    B: 4フィート7インチ（約140cm）超
    C: 4フィート9インチ（約145cm）超
    D: 5フィート0インチ（約152cm）超
  answer: C
  explanation: シートベルトを着用できる年齢と身長に達したすべての同乗者は、ベルトを適切に着用しなければなりません。その基準となる身長は4フィート9インチ（約145cm）超とされています。
- id: 71
  category: safe_driving_rules
  question: 送りハンドル（プッシュ・プル法）を使用する主な利点は何ですか？
  choices:
    A: 高速での素早い旋回が可能になる。
    B: バックの際に認められている唯一の方法である。
    C: 手が交差しないため、エアバッグの展開エリアから腕を遠ざけることができる。
    D: ラジオを操作しながら片手でハンドル操作ができる。
  answer: C
  explanation: 送りハンドルでは、ハンドル上で手が交差することがないため、エアバッグが展開した際に顔、手、または腕を負傷する可能性が低くなります。
- id: 72
  category: defensive_driving
  question: 運転中に不必要な急ブレーキや非常ブレーキを避けるべきなのはなぜですか？
  choices:
    A: アンチロック・ブレーキ・システム（ABS）に永久的な損傷を与えるため。
    B: スムーズな停止を予想していた後続車のドライバーを驚かせる可能性があるため。
    C: 車両が片側に傾く原因となるため。
    D: 車両の死角が広がるため。
  answer: B
  explanation: 不必要な急ブレーキや非常ブレーキは、スムーズな停止を予想していた後続車のドライバーを驚かせる可能性があります。
- id: 73
  category: vehicle_information
  question: 左折する際、遠心力によって車両の重量が外側（右側）に移動します。この左右の揺れを何と呼びますか？
  choices:
    A: ピッチ (Pitch)
    B: ヨー (Yaw)
    C: ロール (Roll)
    D: リーン (Lean)
  answer: C
  explanation: 旋回中に遠心力で重量が移動する際などの車両の左右の動きは、ロールと呼ばれます。
- id: 74
  category: sharing_the_road
  question: 大型車の周囲を走行する際に覚えておくべき重要なルールは何ですか？
  choices:
    A: 大型車は乗用車よりもはるかに早く停止できる。
    B: 相手のミラーが見えない場合、相手のドライバーからもあなたが見えていない。
    C: 常に右側から追い越さなければならない。
    D: 大型車に死角はない。
  answer: B
  explanation: マニュアルには、大型車の周囲を走行する際は配慮し注意を払うよう記されており、「相手のミラーが見えない場合、相手のドライバーからもあなたが見えていない」ことを忘れないようにとしています。
- id: 75
  category: vehicle_information
  question: 運転前に車両の外側で確認すべき事項は次のうちどれですか？
  choices:
    A: インストルメントパネル（計器盤）の警告灯。
    B: 車内の荷物が安全に固定されているか。
    C: 車両の下の液体漏れ。
    D: 携帯電話が消音モードになっているか。
  answer: C
  explanation: 車両の外側の確認には、タイヤの異物、ガラスの破損、または車両の下の液体漏れのチェックが含まれます。
- id: 76
  category: safe_driving_rules
  question: 運転前に車内の調整を行う際、携帯電話はどうすべきですか？
  choices:
    A: すぐに手が届くように助手席に置く。
    B: 緊急時に備えて手に持っておく。
    C: 消音モードにして片付ける。
    D: 両耳を覆うヘッドセットに接続する。
  answer: C
  explanation: 出発前にすべての車内調整を確認する一環として、マニュアルでは携帯電話を消音モードにして片付けるよう求めています。
- id: 77
  category: defensive_driving
  question: 死角を確認するために身につけるべき、賢明で安全な習慣は何ですか？
  choices:
    A: 常に肩越しに目視で確認する。
    B: バックミラー（ルームミラー）だけに頼る。
    C: 車線変更の前にクラクションを鳴らす。
    D: 他の車両を素早く追い越すために加速する。
  answer: A
  explanation: マニュアルでは、死角を確認するために常に肩越しに目視するなどの賢明で安全な習慣を身につけ、それが無意識にできるようにすることを推奨しています。
- id: 78
  category: driver_responsibility
  question: ひどい風邪や日常的なストレスは、運転にどのような影響を与えますか？
  choices:
    A: 反応速度が向上する。
    B: 思考プロセスが遅くなり、賢明な判断を下す能力に影響を与える。
    C: 運転能力には全く影響しない。
    D: 周辺視野が広がる。
  answer: B
  explanation: マニュアルによると、ひどい風邪は思考プロセスを遅らせる可能性があり、ストレスはハンドルを握っている時の賢明な判断能力に影響を与える可能性があります。
- id: 79
  category: safe_driving_rules
  question: 運転中に矯正レンズ（メガネやコンタクト）の着用が必要な場合、夜間に避けるべきことは何ですか？
  choices:
    A: ヘッドライトの使用。
    B: 道路の右端を見ること。
    C: 色の濃い、または着色された矯正レンズの使用。
    D: 周辺視野の確認。
  answer: C
  explanation: マニュアルには、矯正レンズの着用が必要な場合、夜間に色の濃い、または着色された矯正レンズを使用することは避けるべきであると明記されています。
- id: 80
  category: defensive_driving
  question: 暗い場所での運転中、対向車のヘッドライトの眩しさを避けるにはどうすればよいですか？
  choices:
    A: 対向車のヘッドライトを直視する。
    B: 一時的に自分のヘッドライトを消す。
    C: 道路の右端を見て、それをステアリングのガイドにする。
    D: 眩しさに対抗するためにハイビームをつける。
  answer: C
  explanation: 対向車の光の眩しさを避けるために、マニュアルでは道路の右端を見て、それをステアリングのガイドとして使用することを推奨しています。
- id: 81
  category: defensive_driving
  question: 夜間に運転する際、どのようなことができるように速度を落とすべきですか？
  choices:
    A: ヘッドライトが照らしている範囲内で停止できること。
    B: ブレーキを使わずに目的地に到着できること。
    C: 商用車の流れについていけること。
    D: ミラーを使わずに済むこと。
  answer: A
  explanation: 夜間に運転する際は、ヘッドライトが照らしている範囲内で停止できるよう、速度を落とし、車間距離を十分に取る必要があります。
- id: 82
  category: safe_driving_rules
  question: 運転中のイヤホンやヘッドホンの着用に関する法律はどうなっていますか？
  choices:
    A: 音量が小さければ合法である。
    B: 音声を流したりノイズを遮断したりするイヤホンやヘッドホンの着用は違法である。
    C: GPSデバイスを聞いている場合に限り合法である。
    D: 耳の不自由な運転手には着用が義務付けられている。
  answer: B
  explanation: 音声を流したりノイズを遮断したりするイヤホン、イヤフォン、ヘッドホン、またはヘッドセットを着用して車両を運転することは法律で禁止されています。
- id: 83
  category: license_system
  question: 仮免許（instruction permit）または中等免許（intermediate license）を持っている場合、運転中の携帯電話の使用に関する規則は何ですか？
  choices:
    A: ハンズフリーであれば携帯電話を使用できる。
    B: ハンズフリーであっても、携帯電話やその他のモバイル電子機器を使用することはできない。
    C: テキスト送信（メール等）には使用できるが、通話には使用できない。
    D: 赤信号で停止している間であれば携帯電話を使用できる。
  answer: B
  explanation: マニュアルには次のように記載されています。「注意：仮免許または中等免許を持っている場合は、ハンズフリーであっても、運転中に携帯電話やモバイル電子機器を使用することはできません。」
- id: 84
  category: penalties_and_points
  question: アルコールや薬物の影響下での障害運転（DUI）に対する罰則として、考えられるものはどれですか？
  choices:
    A: 初犯の場合は警告のみ。
    B: 罰金の代わりに義務的な社会奉仕活動。
    C: 高額な罰金、免許停止、および禁錮刑。
    D: 日中の運転のみに制限される一時的な措置。
  answer: C
  explanation: アルコールや薬物の影響下での障害運転に対する罰則は非常に厳しく、高額な罰金、保険料の値上げ、免許の停止または取り消し、さらには禁錮刑が含まれます。
- id: 85
  category: alcohol_drugs_health
  question: ワシントン州において、大麻を摂取した後の運転に関する法的規則は何ですか？
  choices:
    A: 21歳以上であれば合法である。
    B: 安全な制限量未満の摂取であれば合法である。
    C: 運転に安全な大麻の摂取量というものは存在しないため、全年齢において違法である。
    D: 医療用大麻を使用している場合に限り合法である。
  answer: C
  explanation: 21歳以上の方の大麻の娯楽使用は合法ですが、大麻を摂取した後の運転は全年齢において違法です。運転に安全な大麻の摂取量というものは存在しません。
- id: 86
  category: alcohol_drugs_health
  question: 新しい処方薬を飲み始めたばかりのときは、どうすべきですか？
  choices:
    A: 処方薬は合法で安全なので、通常通り運転する。
    B: 運転する前に、その薬が判断力、調整能力、反応時間にどのような影響を与えるかを確認できるまで待つ。
    C: 日中の時間帯のみ運転する。
    D: 眠気を抑えるために、運転前にカフェイン飲料を飲む。
  answer: B
  explanation: 新しい処方薬を飲み始めたばかりのときは、運転しないでください。その薬が判断力、調整能力、反応時間にどのような影響を与えるかを確認できるまで待ってください。
- id: 87
  category: alcohol_drugs_health
  question: 死亡事故に関与する最も一般的な機能障害（インペアメント）は何ですか？
  choices:
    A: ハンズフリー機器を使用しながらの運転。
    B: ひどい風邪を引いた状態での運転。
    C: 多剤併用（複数の種類の薬物を混ぜたり摂取したりすること）。
    D: ヘッドライトの光軸がずれた状態での運転。
  answer: C
  explanation: マニュアルには、多剤併用（複数の種類の薬物を混ぜたり摂取したりすること）が、死亡事故に関与する最も一般的な機能障害であると記載されています。
- id: 88
  category: alcohol_drugs_health
  question: 薬の警告ラベルにある「重機の操作（operating heavy machinery）」を控えるという警告には、何が含まれますか？
  choices:
    A: 商用車のみ。
    B: 車両の運転。
    C: 農機具のみ。
    D: 自転車やスケートボード。
  answer: B
  explanation: マニュアルでは、運転前にすべての警告ラベルを確認することを推奨しており、「重機の操作」を控えるという警告には車両の運転が含まれると指摘しています。
- id: 89
  category: alcohol_drugs_health
  question: 一人で運転中に疲れを感じ始めたら、どうすべきですか？
  choices:
    A: カフェイン飲料を飲んで運転を続ける。
    B: 道路脇に車を止め、20分間の仮眠を取る。
    C: ラジオの音量を上げ、窓を開ける。
    D: 早く目的地に着くために速度を上げる。
  answer: B
  explanation: マニュアルによると、一人で運転中に疲れを感じ始めたら、道路脇に車を止めて20分間の仮眠を取るべきです。事故を起こすリスクを冒すよりも、停車して眠る方が安全です。
- id: 90
  category: defensive_driving
  question: 長距離ドライブを計画する際、疲労を避けるためにどのくらいの頻度で休憩を取るべきですか？
  choices:
    A: 50マイルごと、または1時間ごと。
    B: 100マイルごと、または2時間ごと。
    C: 200マイルごと、または4時間ごと。
    D: 燃料補給が必要なときのみ。
  answer: B
  explanation: 長距離ドライブの前には、約100マイルごと、または2時間ごとに停車して、歩き回ったり、新鮮な空気を吸ったり、水分を補給したりする計画を立てるべきです。
- id: 91
  category: driver_responsibility
  question: 運転前に落ち着き、ストレスを解消するための推奨されるテクニックはどれですか？
  choices:
    A: 大音量のテンポの速い音楽を聴く。
    B: 停車した車の中で、100から3ずつ逆方向に数える。
    C: 気分が良くなるまで低速で運転する。
    D: ストレスの原因にすぐに対処する。
  answer: B
  explanation: 運転前に落ち着くために、マニュアルでは停車した車の中に座り、1から20までゆっくり数えるか、100から3ずつ逆方向に数えて、頭の中の雑念を静めることを推奨しています。
- id: 92
  category: penalties_and_points
  question: ワシントン州の法律において、攻撃的運転（aggressive driving）とロード・レイジ（road rage）はどのように分類されますか？
  choices:
    A: 両方とも軽微な民事違反とみなされる。
    B: 攻撃的運転は刑事犯罪であり、ロード・レイジは交通違反である。
    C: 攻撃的運転は交通違反であり、ロード・レイジは刑事犯罪である。
    D: 両方とも刑事犯罪とみなされる。
  answer: C
  explanation: マニュアルには、攻撃的運転は交通違反であり、ロード・レイジは刑事犯罪であると明記されています。
- id: 93
  category: safe_driving_rules
  question: 次の行動のうち、攻撃的運転（aggressive driving）の例とみなされるものはどれですか？
  choices:
    A: 道路沿いを歩いている人や自転車に乗っている人のすぐ近くを走行する。
    B: 4方向一時停止場所で優先権を譲る。
    C: 車線変更の前に方向指示器を使用する。
    D: 掲示された制限速度通りに運転する。
  answer: A
  explanation: 攻撃的運転に関連する行動には、スピード違反、車間距離の詰めすぎ（あおり）、危険な車線変更、道路沿いを歩いている人や自転車に乗っている人のすぐ近くを走行することなどが含まれます。
- id: 94
  category: penalties_and_points
  question: 無許可のストリートレースにおいて、罰金、禁錮刑、車両の押収を含む厳しい罰則の対象となるのは誰ですか？
  choices:
    A: レース車両の運転者のみ。
    B: イベントの主催者のみ。
    C: 運転者、およびレース活動をそそかしたり援助したりしたすべての人。
    D: 前科がある参加者のみ。
  answer: C
  explanation: ストリートレースに対する罰則は厳しく、運転者だけでなく、ストリートレース活動をそそのかしたり援助したりしたすべての人に適用される可能性があります。
- id: 95
  category: driver_responsibility
  question: 次の行動のうち、あなたがロード・レイジ（road rage）に陥っている可能性を示す兆候はどれですか？
  choices:
    A: 他の車を追い越した後、その運転手にお灸を据えるために減速する。
    B: 車両の周囲に安全なスペースを確保する。
    C: 移動時間に十分な余裕を持つ。
    D: 車を寄せて20分間の仮眠をとる。
  answer: A
  explanation: ロード・レイジの兆候には、後続車が車間を詰めすぎないようにブレーキを踏んだり、他の車を追い越した後にその運転手にお灸を据えるために減速したりすることが含まれます。
- id: 96
  category: defensive_driving
  question: 怒った運転手に追跡されたり嫌がらせを受けたりしていると感じた場合、どうすべきですか？
  choices:
    A: 車を止めて、その運転手と対峙する。
    B: 他の人がいて店が開いている場所に車を走らせる。
    C: できるだけ早く自宅へ向かう。
    D: 相手を怖がらせるために急ブレーキをかける。
  answer: B
  explanation: ロード・レイジの被害に遭い、追跡や嫌がらせを受けていると感じた場合は、他の人がいて店が開いている場所まで運転する必要があります。
- id: 97
  category: driver_responsibility
  question: 発生中のロード・レイジ事件はどのように報告すべきですか？
  choices:
    A: 帰宅するまで待ち、オンラインで報告書を作成する。
    B: すぐに911に通報する。
    C: 運転手の写真を撮り、ソーシャルメディアに投稿する。
    D: 警察のために自宅住所を突き止めるべく、その運転手を追跡する。
  answer: B
  explanation: マニュアルでは、発生中のロード・レイジ事件については、すぐに911に電話して報告するよう指示しています。
- id: 98
  category: driver_responsibility
  question: 10代の運転者が、路上でリスクを冒したり状況を見誤ったりしやすいのはなぜですか？
  choices:
    A: 高齢の運転者よりも反応速度が遅いため。
    B: 判断や意思決定を司る脳の部位がまだ発達途中であるため。
    C: 一般的に、より攻撃的に運転するように教えられているため。
    D: 高齢の運転者と比較して視力が悪いため。
  answer: B
  explanation: 10代の運転者は、判断や意思決定を司る脳の部位がまだ発達途中であり、そのためにリスクを冒したり状況を見誤ったりしやすいということを覚えておく必要があります。
- id: 99
  category: driver_responsibility
  question: マニュアルに記載されている、車両事故に遭った高齢運転者特有のリスク要因は何ですか？
  choices:
    A: ストリートレースに参加する可能性が高い。
    B: 重傷を負いやすい。
    C: ロード・レイジを起こしやすい。
    D: 方向指示器の使用を怠ることが多い。
  answer: B
  explanation: マニュアルには、加齢とともに身体的・精神的能力が変化し、高齢の運転者は車両事故で重傷を負いやすくなる可能性があると記されています。
- id: 100
  category: defensive_driving
  question: 問題解決ツールである「OODAループ」において、「情勢判断（Orient）」のステップには何が含まれますか？
  choices:
    A: 突然の障害物や交通の流れの変化を探す。
    B: 知識と経験を駆使して、変化が自分の安全にとって何を意味するかを理解する。
    C: 観察に基づいて最も安全な行動を選択する。
    D: 車線変更やブレーキなどの物理的な操作を実行する。
  answer: B
  explanation: OODAループの「情勢判断（Orient）」ステップでは、知識と経験を駆使して、変化が何を意味し、それが自分や他者の安全にどのように影響するかを理解します。
- id: 101
  category: defensive_driving
  question: 運転中にOODAループを使用する際、「観察（Observe）」ステップの主な焦点は何ですか？
  choices:
    A: 減速するか車線変更するかを決定すること。
    B: 状況の潜在的なリスクを理解すること。
    C: 急な割り込み車両など、周囲の環境の変化に気づくこと。
    D: 他のドライバーに自分の意図を伝えること。
  answer: C
  explanation: 「観察（Observe）」ステップは、車両の急な割り込み、突然の障害物、交通の流れの変化など、状況を観察して何が変わったかを確認することに焦点を当てています。
- id: 102
  category: safe_driving_rules
  question: 道路上で意思決定や操作を行う際、常に目指すべき3つの資質は何ですか？
  choices:
    A: 素早く、断定的で、支配的。
    B: 意識的で、予測可能で、スムーズ。
    C: 用心深く、ためらいがちで、遅い。
    D: 反応的で、自発的で、素早い。
  answer: B
  explanation: 変化を必要とするあらゆる状況に対して問題解決のアプローチを適用する場合、常に意識的（Aware）、予測可能（Predictable）、スムーズ（Smooth）であることを目指すべきです。
- id: 103
  category: alcohol_drugs_health
  question: 次のうち、運転者の疲労の兆候はどれですか？
  choices:
    A: ミラーを頻繁に確認すること。
    B: 一定の速度と車線位置を維持すること。
    C: 頻繁にまばたきをしたり、まぶたが重くなったりすること。
    D: 背筋を伸ばして座り、頭を上げたままにすること。
  answer: C
  explanation: 疲労の兆候には、集中力の低下、頻繁なまばたき、まぶたが重くなる、車線からはみ出す、頭を上げたままにするのが困難になることなどが含まれます。
- id: 104
  category: defensive_driving
  question: OODAループの文脈において、「実行（Act）」フェーズには何が含まれますか？
  choices:
    A: 交通の流れの変化が何を意味するかを理解すること。
    B: 選択した行動をスムーズかつ断固として実行すること。
    C: 観察に基づいて最も安全な行動方針を選択すること。
    D: 突然の障害物や車両の急な割り込みを探すこと。
  answer: B
  explanation: マニュアルによると、OODAループの「実行（Act）」フェーズでは、選択した行動をスムーズかつ断固として実行することが求められます。
- id: 105
  category: safe_driving_rules
  question: マニュアルによると、空想、悩み事、強い感情はどのタイプの注意散漫の例ですか？
  choices:
    A: 物理的な注意散漫
    B: 車内での注意散漫
    C: 精神的な注意散漫
    D: 車外での注意散漫
  answer: C
  explanation: マニュアルでは、空想、悩み事、強い感情を具体的に「精神的な注意散漫」として分類しています。
- id: 106
  category: safe_driving_rules
  question: ワシントン州のわき見運転（注意散漫運転）法に基づき、運転中に電子機器を手に持つことが許可されているのは誰ですか？
  choices:
    A: 21歳以上の運転者。
    B: 5年以上の経験を持つ運転者。
    C: ナビゲーションアプリを使用している運転者。
    D: 年齢や経験に関わらず、いかなる運転者も許可されない。
  answer: D
  explanation: ワシントン州の法律では、運転中にいかなる電子機器も手に持つことはできないと定められており、これは年齢や経験に関係なくすべての運転者に適用されます。
- id: 107
  category: penalties_and_points
  question: ワシントン州において、初回のわき見運転（注意散漫運転）違反の後の罰金はどうなる可能性がありますか？
  choices:
    A: 安全講習を受ければ免除される。
    B: 2倍になる可能性がある。
    C: 半額に減額される。
    D: その後のすべての違反において同額のままである。
  answer: B
  explanation: マニュアルには、初回のわき見運転違反の後の罰金は2倍になる可能性があると記載されています。
- id: 108
  category: defensive_driving
  question: 脳全体が1つのタスクに集中しているときに使用されているのは、どのタイプの注意ですか？
  choices:
    A: 注意の切り替え
    B: 分割的注意
    C: 持続的注意
    D: 焦点的注意（Focused attention）
  answer: D
  explanation: 焦点的注意（Focused attention）は、マニュアルにおいて脳全体が1つのタスクに集中している状態と定義されています。
- id: 109
  category: defensive_driving
  question: 運転中の「スキャニング（Scanning）」は「視覚的探索（Visual searching）」とどのように異なりますか？
  choices:
    A: 視覚的探索は目を使うだけだが、スキャニングは頭を動かすことを含む。
    B: スキャニングは、車両の周囲をできるだけ広く見るために、頭、首、体を動かすことを含む。
    C: スキャニングはダッシュボードを見るときにのみ行われる。
    D: スキャニングは電子センサーを使用して危険を検知することを指す。
  answer: B
  explanation: 視覚的探索（Visual searching）は目を使うことを意味しますが、スキャニング（Scanning）は車両の周囲をできるだけ広く見渡せるように、頭、首、体も動かすことを含みます。
- id: 110
  category: defensive_driving
  question: 駐車中の車両の下や周囲にある足、車輪、影、動きに注意を払うべきなのはなぜですか？
  choices:
    A: 駐車車両が違法駐車かどうかを確認するため。
    B: 潜在的な状況を予測し、直前のブレーキや急ハンドルを避けるため。
    C: 駐車車両のメーカーやモデルを特定するため。
    D: 車両のヘッドライトが点灯しているか確認するため。
  answer: B
  explanation: 駐車車両の周囲の足、車輪、影、動きを前方にスキャンすることで、潜在的な状況を予測し、必要に応じて停止したり方向を変えたりする準備ができます。
- id: 111
  category: defensive_driving
  question: 次のうち、後方の交通状況を確認することが不可欠な状況はどれですか？
  choices:
    A: 長い下り坂や急な下り坂を走行しているとき。
    B: 直線の高速道路で加速しているとき。
    C: 赤信号で停車しているとき。
    D: 広告看板の横を通り過ぎるとき。
  answer: A
  explanation: マニュアルによると、車線変更、自転車レーンを横切っての右左折、減速、後退、または長い下り坂や急な下り坂を走行する際には、後方を確認することが不可欠です。
- id: 112
  category: driver_responsibility
  question: ワシントン州でポイ捨てに対する罰金がこれほど厳しいのはなぜですか？
  choices:
    A: ポイ捨てが地域の不動産価値を低下させるため。
    B: 燃えやすいゴミが山火事を引き起こし、環境にダメージを与える可能性があるため。
    C: ポイ捨てが主要な高速道路で渋滞を引き起こすため。
    D: 州がポイ捨ての罰金を公立学校の資金として使用しているため。
  answer: B
  explanation: ポイ捨てに対する罰金が厳しいのは、燃えやすいゴミや火のついたゴミが山火事を引き起こし、環境にダメージを与え、安全上の危険に加えて死者を出す可能性があるためです。
- id: 113
  category: vehicle_information
  question: ガレージに駐車中にエンジンをかけたままにすると、放出される可能性のある有害で致死的なガスは何ですか？
  choices:
    A: 二酸化炭素
    B: 窒素酸化物
    C: 一酸化炭素
    D: 二酸化硫黄
  answer: C
  explanation: 駐車中、特にガレージ内でエンジンをかけたままにすると、一酸化炭素などの有害なガスが放出され、死に至る可能性があります。
- id: 114
  category: vehicle_information
  question: 車の排出ガスを抑えるために推奨される方法は次のうちどれですか？
  choices:
    A: タイヤの空気圧を少し低めに保つ。
    B: 移動時間を短縮するために、急加速や急ブレーキを行う。
    C: しばらく停車する際にエンジンをアイドリング状態にしておく。
    D: 燃費を良くするために、タイヤの空気圧を適切に保つ。
  answer: D
  explanation: 燃費を良くするためにタイヤの空気圧を適切に保つことは、車の排出ガスを抑えるためにできる小さな工夫の一つとして挙げられています。
- id: 115
  category: vehicle_information
  question: ワシントン州のクリーンカー法（Clean Car Law）は、2009年以降に製造された車両に対して何を義務付けていますか？
  choices:
    A: 電気自動車またはハイブリッド車でなければならない。
    B: 登録、免許交付、または販売の前に、厳しいクリーンエア基準を満たさなければならない。
    C: 1ガロンあたり最低40マイル（約17km/L）の燃費性能を持たなければならない。
    D: 10年後に州公認のリサイクルセンターで廃棄しなければならない。
  answer: B
  explanation: ワシントン州のクリーンカー法は、2009年以降に製造された車両が、登録、免許交付、または販売される前に、厳しいクリーンエア基準を満たすことを義務付けています。
- id: 116
  category: driver_responsibility
  question: 運転の自己評価（セルフエバリュエーション）において、自分自身に問いかけるべき質問は次のうちどれですか？
  choices:
    A: 予想よりも早く目的地に到着できたか？
    B: 自分の運転は法的で、熟練しており、スムーズだったか？
    C: 交通情報をいくつ聞いたか？
    D: ハンズフリー機器を正しく使用したか？
  answer: B
  explanation: 自己評価の際には、「自分の運転は法的で、熟練しており、スムーズだったか？」といった質問を自分に投げかけることで、スキルの向上と維持に役立てるべきです。
- id: 117
  category: safe_driving_rules
  question: 注意散漫なドライバーが起こしやすい行動は次のうちどれですか？
  choices:
    A: サイドミラーを頻繁に確認しすぎる。
    B: 他の車両や自転車との車間距離を詰めすぎる。
    C: 交差点の停止線よりかなり手前で停車する。
    D: 不必要に優先権を譲る。
  answer: B
  explanation: マニュアルには、注意散漫なドライバーが起こしやすい行動として「車線内の他の車両や自転車との車間距離を詰めすぎる」が挙げられています。
- id: 118
  category: defensive_driving
  question: 右左折する前に、横にいる可能性のある自転車や歩行者を確認するために何をすべきですか？
  choices:
    A: クラクションを鳴らして警告する。
    B: サイドミラーを確認し、目視で肩越しに後方を確認する。
    C: 素早く加速して彼らの前に出る。
    D: バックミラー（ルームミラー）のみを頼りにする。
  answer: B
  explanation: マニュアルには、右左折する前に、横にいたり通りを渡ろうとしていたりする自転車や歩行者がいないか、サイドミラーを確認し、肩越しに目視で確認（over-shoulder
    check）すべきであると記載されています。
- id: 119
  category: sharing_the_road
  question: 歩行者が道路を横断しているとき、いつ進むのが安全ですか？
  choices:
    A: 歩行者が自分の車線を一歩出た直後。
    B: 歩行者が自分の車線と、さらに隣のもう一車線を通過したとき。
    C: 歩行者が道路の中央に達したとき。
    D: 歩行者が自分の車両から少なくとも10フィート（約3メートル）離れたとき。
  answer: B
  explanation: マニュアルには、歩行者が自分の車線と、さらに隣のもう一車線を通過するまで待ってから進むように記載されています。
- id: 120
  category: sharing_the_road
  question: 盲導犬を連れた歩行者や車椅子を利用している歩行者が道路を横断している場合、どうしなければなりませんか？
  choices:
    A: 自分の存在を知らせるために軽くクラクションを鳴らす。
    B: 歩行者が自分の車線と、さらに隣のもう一車線を通過するまで待つ。
    C: 歩行者が道路を完全に渡りきるまで待ってから進む。
    D: 歩行者の周りをゆっくりと避けて運転する。
  answer: C
  explanation: 歩行者が車椅子、杖、盲導犬、またはその他の介助犬を利用している場合は、その歩行者が道路を完全に渡りきるまで待ってから進まなければなりません。
- id: 121
  category: penalties_and_points
  question: 停車中のスクールバスを追い越した場合の罰則は何ですか？
  choices:
    A: 免許が30日間停止される。
    B: 初回違反の場合は警告を受ける。
    C: 罰金が2倍になる。
    D: 安全運転講習を受講しなければならない。
  answer: C
  explanation: マニュアルによると、停車中のスクールバスを追い越した者に対しては、罰金が2倍になります。
- id: 122
  category: safe_driving_rules
  question: 赤色のライトを点滅させて停車しているスクールバスと反対方向に走行している場合、停止する必要がないのはどのような時ですか？
  choices:
    A: 2車線道路を走行している。
    B: 時速15マイル（15 mph）未満で走行している。
    C: 道路が3車線以上ある。
    D: スクールゾーン内にいる。
  answer: C
  explanation: バスと反対方向に走行しているドライバーは、3車線以上ある場合、または車線が中央分離帯や障壁で仕切られている場合は、停止する必要はありません。
- id: 123
  category: sharing_the_road
  question: 同じ方向に走行している路線バスが合図を出し、車道に戻ろうとしている場合、どのように対応すべきですか？
  choices:
    A: バスが合流する前に追い越すために加速する。
    B: クラクションを鳴らしてバスの運転手に警告する。
    C: 路線バスに道を譲る。
    D: 合図を出さずに車線変更する。
  answer: C
  explanation: 同じ方向に走行している路線バスが合図を出し、車道に戻ろうとしている場合は、その車両に道を譲らなければなりません。
- id: 124
  category: vehicle_information
  question: ブレーキが適切に調整され、荷物を積んだトラックが時速55マイル（55 mph）で走行している場合、完全に停止するまでにどのくらいの距離が必要ですか？
  choices:
    A: 150フィート
    B: 250フィート
    C: 350フィート
    D: 450フィート
  answer: D
  explanation: ブレーキが適切に調整され、荷物を積んだトラックが時速55マイル（55 mph）で走行している場合、完全に停止するには450フィートの距離が必要です。
- id: 125
  category: defensive_driving
  question: 大型車両の前に合流する場合、どのくらいのスペースを空けるべきですか？
  choices:
    A: サイドミラーで相手のフロントバンパーが見える程度の距離。
    B: ルームミラーで相手の両方のヘッドライトがはっきりと見えるまで待つ。
    C: 時速10マイルごとに少なくとも車1台分の長さ。
    D: トラックの少なくとも100フィート前方に出るまで待つ。
  answer: B
  explanation: 大型車両の前方で交通の流れに入る際は、ルームミラーで相手の両方のヘッドライトがはっきりと見えるようになるまで待ってから合流してください。
- id: 126
  category: sharing_the_road
  question: 大型車両の死角（ブラインドゾーン）を走行しているかどうかは、どうすればわかりますか？
  choices:
    A: 相手のドライバーのミラーが見えない。
    B: トラックの後方50フィート以内にいる。
    C: トラックの方向指示器が点滅している。
    D: 左車線を走行している。
  answer: A
  explanation: 大型車両の近くにいて、相手のドライバーのミラーが見えない場合、あなたは死角にいるため、相手のドライバーからもあなたの姿は見えません。
- id: 127
  category: safe_driving_rules
  question: オートバイとの車線共有に関して、正しいものはどれですか？
  choices:
    A: オートバイが端に寄って走行している場合は、車線を共有してもよい。
    B: 車線が非常に広い場合は、車線を共有してもよい。
    C: オートバイと並んで同じ車線に入ってはならない。
    D: 低速で追い越す場合に限り、車線を共有してもよい。
  answer: C
  explanation: オートバイの運転者には、他のすべての車両と同じ車線幅を使用する権利があります。車線が広くても、オートバイと並んで同じ車線に入ってはいけません。
- id: 128
  category: vehicle_information
  question: オートバイが減速しているときに、ブレーキランプが見えないことがあるのはなぜですか？
  choices:
    A: オートバイのブレーキランプは小さすぎて見えないことが多いから。
    B: ブレーキの代わりにスロットル（エンジンブレーキ）を使って減速している可能性があるから。
    C: オートバイのブレーキランプは完全に停止したときにのみ点灯するから。
    D: 通常、運転者によってブレーキランプが隠れてしまうから。
  answer: B
  explanation: オートバイの運転者は減速する際、ブレーキではなくスロットル操作（エンジンブレーキ）を行うことがあるため、その場合はブレーキランプが点灯しません。
- id: 129
  category: sharing_the_road
  question: 自転車の後方を走行したり追い越したりする際、自車と自転車の間に空けなければならない最小限の距離はどれくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 5フィート
  answer: B
  explanation: 自転車の後方を走行したり追い越したりする際は、自転車と自車の最も幅の広い部分との間に、少なくとも3フィートの距離を空けなければなりません。
- id: 130
  category: safe_driving_rules
  question: 横断歩道にいる自転車は、法律上どのように扱われますか？
  choices:
    A: 自動車とみなされる。
    B: すべての車両交通に道を譲らなければならない。
    C: 歩行者とみなされる。
    D: 横断歩道に入ることは許可されていない。
  answer: C
  explanation: 横断歩道にいる自転車は歩行者とみなされます。標識のある横断歩道でもない横断歩道でも、また交差点においても、彼らに道を譲らなければなりません。
- id: 131
  category: sharing_the_road
  question: 大型車両がラウンドアバウト（環状交差点）を走行する際、どの程度のスペースが必要ですか？
  choices:
    A: 1車線分のスペース
    B: 2車線分のスペース
    C: 3車線分のスペース
    D: ラウンドアバウトの走行は許可されていない
  answer: B
  explanation: 接触事故を避けるため、大型車両が右左折を完了するには1車線以上のスペースが必要になる場合があり、ラウンドアバウト内では2車線分のスペースを必要とします。
- id: 132
  category: safe_driving_rules
  question: 赤色のライトを点滅させて停車しているスクールバスを追い越すために、中央の右左折用車線を使用することは許可されていますか？
  choices:
    A: はい、対向車がいなければ許可される。
    B: はい、ただし時速15マイル以下で走行している場合に限る。
    C: いいえ、すべての右左折車線の運転者は停止しなければならない。
    D: いいえ、スクールバスの運転手が手招きで合図しない限り許可されない。
  answer: C
  explanation: スクールバスを追い越すために中央の右左折用車線を使用しないでください。赤色のライトが点滅し、一時停止のサインが出されているときは、すべての右左折車線の運転者は停止しなければなりません。
- id: 133
  category: defensive_driving
  question: 砂利や舗装の継ぎ目などの路面の凹凸は、オートバイの運転者にどのような影響を与える可能性がありますか？
  choices:
    A: 専用のタイヤを使用しているため、オートバイには影響しない。
    B: オートバイの運転者が速度や車線内の位置を変更せざるを得なくなる可能性がある。
    C: オートバイの方向指示器が故障する原因となる。
    D: オートバイの運転者が道路から完全に外れて停車する必要がある。
  answer: B
  explanation: でこぼこした路面や、砂利、破片、舗装の継ぎ目などの凹凸は、オートバイの運転者に速度や車線内の位置の変更を強いることがあります。
- id: 134
  category: sharing_the_road
  question: 自転車を追い越す際、自車と自転車の間にどのくらいのスペースを空ける必要がありますか？
  choices:
    A: 少なくとも2フィート
    B: 少なくとも3フィート
    C: 少なくとも4フィート
    D: 少なくとも5フィート
  answer: B
  explanation: マニュアルには、追い越す際、自転車と自車の最も幅の広い部分との間に少なくとも3フィートの距離を空けるよう記載されています。
- id: 135
  category: sharing_the_road
  question: 右折しようとしているとき、前方に自転車がいる場合はどうすべきですか？
  choices:
    A: 加速して、右折する直前に自転車を追い越す。
    B: クラクションを鳴らして、自転車に脇に寄るよう警告する。
    C: 自転車が交差点を通過してから右折する。
    D: 右折する前に自転車の進路を塞ぐように自転車専用車線に入る。
  answer: C
  explanation: マニュアルでは、右折する前に自転車が交差点を通過するのを待つよう指示されており、特に「右折しようとする直前に自転車を追い越してはいけない」と記されています。
- id: 136
  category: sharing_the_road
  question: 表示された自転車専用車線を走行することが許可されるのはいつですか？
  choices:
    A: 低速車両を右側から追い越すとき。
    B: 右左折するとき、または縁石付近に駐車するために車線を横切るときのみ。
    C: 現在その車線を使用している自転車がいないときはいつでも。
    D: 乗客を降ろすために停車する必要があるとき。
  answer: B
  explanation: マニュアルによると、「自転車専用車線を走行するのは、右左折する場合、または縁石付近に駐車するために車線を横切る場合のみ」にする必要があります。
- id: 137
  category: sharing_the_road
  question: 列車が接近しているとき、踏切の最も近いレールから必要な停止距離はどれくらいですか？
  choices:
    A: 10〜30フィートの間
    B: 15〜50フィートの間
    C: 20〜60フィートの間
    D: 少なくとも100フィート
  answer: B
  explanation: マニュアルでは、信号が点滅しているときや列車が接近しているときは、「踏切の最も近いレールから15〜50フィート離れた場所で停止する」ことが求められています。
- id: 138
  category: sharing_the_road
  question: 踏切の線路上で車両が立ち往生してしまった場合、まず最初に何をすべきですか？
  choices:
    A: 車内にとどまり、レッカー車を呼ぶ。
    B: 自分で車両を線路から押し出そうとする。
    C: 直ちに全員を車から降ろす。
    D: 踏切のライトが点滅し始めるか様子を見る。
  answer: C
  explanation: マニュアルには明確に「踏切で車両が立ち往生した場合は、直ちに全員を車から降ろしてください」と記載されています。
- id: 139
  category: sharing_the_road
  question: 時速25マイル以下で走行するように設計された農業用車両や農耕車を識別するものは何ですか？
  choices:
    A: 屋根の上の黄色い点滅ストロボライト
    B: 側面のオレンジ色の四角い標識
    C: 背面の三角形の標識またはエンブレム
    D: テールゲートに掲げられた「低速走行（Slow Moving）」のバナー
  answer: C
  explanation: マニュアルには、「時速25マイル以下で走行するように設計された農業用車両および農耕車には、背面に三角形の標識またはエンブレムが付いている」と記載されています。
- id: 140
  category: sharing_the_road
  question: ライトを点灯させサイレンを鳴らした緊急車両を見たり聞いたりしたとき、どのように対応しなければなりませんか？
  choices:
    A: 緊急車両の前を走り続けるために加速する。
    B: 左車線に移動して減速する。
    C: 現在の車線ですぐに停止する。
    D: 直ちに車両を道路の右側に寄せて停止する。
  answer: D
  explanation: マニュアルの指示は次の通りです。「信号を見たり聞いたりしたらすぐに、直ちに車両を道路の右側に寄せて停止してください。」
- id: 141
  category: safe_driving_rules
  question: 同一方向に複数の車線がある道路を走行する場合、左側の車線は主に何のために使用されますか？
  choices:
    A: 相乗り（カープール）
    B: 制限速度での走行
    C: 遅い車両の追い越し
    D: 緊急車両専用
  answer: C
  explanation: マニュアルには次のように記載されています。「追い越し時を除き、右側を走行してください。同一方向に複数の車線がある場合は、右側の車線を走行してください。左側の車線は、遅い車両を追い越すために使用します。」
- id: 142
  category: safe_driving_rules
  question: フリーウェイで曲がり角や出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 路肩に寄せて、慎重に出口までバックする。
    B: そのまま進み続ける。路肩やフリーウェイでバックすることは違法である。
    C: 右車線で停止し、交通が途切れるのを待ってから後退する。
    D: 中央分離帯を越えてUターンする。
  answer: B
  explanation: マニュアルには次のように記載されています。「そのまま進み続けてください。曲がり角や出口を通り過ぎたとしても、道路上で後退してはいけません。路肩やフリーウェイでバックすることは違法です。」
- id: 143
  category: signs_and_signals
  question: 交通信号を優先して指示を出す権限があるのは誰ですか？
  choices:
    A: 緊急事態におけるすべての免許保持者
    B: 横断歩道を渡っている歩行者
    C: 警察官、建設作業員、および学校の交通等守員（クロッシングガード）
    D: 商用車の運転手
  answer: C
  explanation: マニュアルには、「警察官、建設作業員、保守点検員、および学校の交通等守員は交通整理を行うことができます。これらの人々は交通信号を優先して指示を出すことができ、その命令や指示に従わなければなりません」と記されています。
- id: 144
  category: signs_and_signals
  question: 信号機が故障して作動していない交差点に近づいた場合、どのように進むべきですか？
  choices:
    A: その交差点を4方向一時停止（オールウェイ・ストップ）として扱う。
    B: 左側の車両に道を譲る。
    C: 道路が空いていれば、停止せずに交差点を通過する。
    D: 警察官が到着するまで待ってから横断する。
  answer: A
  explanation: マニュアルには次のように記載されています。「信号機が作動していない場合は、その交差点を4方向一時停止として扱ってください。完全に停止し、右側の車両に優先権を譲ってください。」
- id: 145
  category: signs_and_signals
  question: 赤信号で左折が許可されるのは、どのような条件の時ですか？
  choices:
    A: 赤信号での左折は決して許可されない。
    B: 一方通行の道路へ曲がる際、禁止する標識がなく、十分なスペースがある場合。
    C: 一方通行の道路から対面通行の道路へ曲がる場合。
    D: 午前0時から午前5時までの間のみ。
  answer: B
  explanation: マニュアルでは、「赤信号で完全に停止した後、『赤信号での回転禁止』の標識がなく、交通の流れに入るための十分なスペースがある場合は、一方通行の道路へ左折することができます」と説明されています。
- id: 146
  category: signs_and_signals
  question: 黄色の点滅信号は何を意味しますか？
  choices:
    A: 停止して、青信号になるのを待つ。
    B: 信号がまもなく赤に変わる。
    C: 「譲れ（YIELD）」の標識と同じ意味であり、減速して優先権がある時に進む。
    D: 進む前に必ず一時停止しなければならない。
  answer: C
  explanation: マニュアルには次のように記載されています。「黄色の点滅信号は『譲れ（YIELD）』の標識と同じ意味です。その交差点を優先権の指定がない交差点として扱い、優先権がある時に進んでください。」
- id: 147
  category: signs_and_signals
  question: オレンジ色の交通標識は、どのような情報を示していますか？
  choices:
    A: 禁止または制限事項
    B: 建設および保守作業の警告
    C: 前方の道路サービス
    D: スクールゾーンの警告
  answer: B
  explanation: マニュアルの標識に関するセクションによると、「オレンジ色 ＝ 建設および保守作業の警告」とされています。
- id: 148
  category: signs_and_signals
  question: 蛍光の黄緑色の交通標識は何を示していますか？
  choices:
    A: 建設および保守作業の警告
    B: ドライバーへのサービス案内
    C: 学校、歩行者、および自転車の活動に関する警告
    D: 公共のレクリエーションおよび文化施設
  answer: C
  explanation: マニュアルによると、蛍光の黄緑色の標識は、学校、歩行者、および自転車の活動に対する警告を示します。
- id: 149
  category: signs_and_signals
  question: 病院や休憩所（レストエリア）の場所など、ドライバーへのサービス案内を提供する標識は何色ですか？
  choices:
    A: 緑色
    B: 青色
    C: 茶色
    D: 白色
  answer: B
  explanation: マニュアルには、青色の標識がドライバーへのサービス案内を提供すると記載されています。
- id: 150
  category: safe_driving_rules
  question: 掲示されている制限速度以下で走行していても、スピード違反の切符を切られることがありますか？
  choices:
    A: いいえ、制限速度以下で走行している限りありません。
    B: はい、ただしスクールゾーンを走行している場合に限ります。
    C: はい、道路状況に対して速度が速すぎる場合に切符を切られることがあります。
    D: いいえ、制限速度は絶対的な最低速度です。
  answer: C
  explanation: マニュアルには、掲示されている制限速度以下で走行していても、路面が滑りやすい場合や霧が出ている場合など、道路状況に対して速度が速すぎる（too
    fast for conditions）と判断されれば、違反切符を切られる可能性があると記されています。
- id: 151
  category: penalties_and_points
  question: 自動交通安全カメラは、以下のどの違反に対して自動的に画像を記録しますか？
  choices:
    A: 方向指示器の不使用
    B: シートベルト未着用での運転
    C: スクールゾーンでの速度超過
    D: 不適切なUターン
  answer: C
  explanation: 自動交通安全カメラは、赤信号での停止無視、踏切信号での停止無視、またはスクールゾーンでの速度超過が発生した場合に画像を記録します。
- id: 152
  category: signs_and_signals
  question: 四角い標識の中に、円と白い水平線が描かれているものは何を意味しますか？
  choices:
    A: 進入禁止
    B: 逆走
    C: 追い越し禁止区間
    D: この先一時停止
  answer: A
  explanation: 四角い標識の中に円と白い水平線があるものは「進入禁止」の標識であり、その方向から通りに入ることはできないことを意味します。
- id: 153
  category: safe_driving_rules
  question: 共有センターレーン（中央左折専用車線）の適切な使用方法は何ですか？
  choices:
    A: 低速車両の追い越し
    B: ラッシュアワー時の直進走行
    C: いずれの方向からの左折車両による使用
    D: 緊急車両専用
  answer: C
  explanation: 共有センターレーンの左折専用標識は、いずれの方向からの左折車両のためにも確保されている車線であることを示しており、直進走行や追い越しに使用してはいけません。
- id: 154
  category: penalties_and_points
  question: 作業員がいる工事区域内での運転中に違反を犯した場合、罰金はどうなりますか？
  choices:
    A: 初犯の場合は免除される
    B: 通常の罰金と同じである
    C: 半額に減額される
    D: 2倍になる
  answer: D
  explanation: マニュアルには、作業員がいる工事区域内での運転中に違反を犯した場合、罰金は2倍になると明記されています。
- id: 155
  category: sharing_the_road
  question: マニュアルによると、法律上「横断歩道」とみなされるのは次のうちどれですか？
  choices:
    A: 白い線が描かれている交差点のみ
    B: 標示の有無にかかわらず、すべての交差点
    C: 歩行者横断標識がある交差点のみ
    D: ブロックの中間にある横断歩道のみ
  answer: B
  explanation: マニュアルには、標示の有無にかかわらず、すべての交差点は法律上、横断歩道であると記されています。
- id: 156
  category: defensive_driving
  question: 停止線で停止したものの、交差する道路の視界が遮られている場合はどうすべきですか？
  choices:
    A: 危険地帯にいる時間を最小限にするため、交差点を素早く加速して通過する
    B: クラクションを鳴らし、通常の速度で進む
    C: 見えるようになるまで、ゆっくりと少しずつ前に出る
    D: バックして別のルートを選ぶ
  answer: C
  explanation: 停止線で停止しても交差する道路の視界が遮られている場合は、見えるようになるまでゆっくりと少しずつ前に出る必要があります。これにより、交差する道路のドライバーに自車の前方を確認させることができます。
- id: 157
  category: safe_driving_rules
  question: 2台の車両がほぼ同時に4方向一時停止の交差点に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の車両
    B: 右側の車両
    C: より速く走行している車両
    D: 左折する車両
  answer: B
  explanation: 4方向一時停止において、2台の車両がほぼ同時に到着した場合は、右側の車両に道を譲らなければなりません。
- id: 158
  category: safe_driving_rules
  question: 4方向一時停止の交差点で、左折する車両は何をしなければなりませんか？
  choices:
    A: 直進または右折する車両に優先権を譲る
    B: 他のすべての交通に先んじて進む
    C: 歩行者にのみ譲り、他の車両には譲らなくてよい
    D: 交差点からすべての車がいなくなるまで待つ
  answer: A
  explanation: マニュアルには、4方向一時停止において、左折する車両は直進または右折する車両に優先権を譲らなければならないと記されています。
- id: 159
  category: safe_driving_rules
  question: 交差点で左折または右折する場合、どの車線に入らなければなりませんか？
  choices:
    A: 来た方向から最も遠い車線
    B: 中央車線
    C: 来た方向に最も近い車線
    D: 利用可能な任意の車線
  answer: C
  explanation: 交差点で左折または右折する場合、州法により、来た方向に最も近い車線に入ることが義務付けられています。
- id: 160
  category: safe_driving_rules
  question: 対向車線を横切って左折または右折する場合、どれくらい手前から方向指示器を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート手前
    B: 少なくとも100フィート手前
    C: 少なくとも200フィート手前
    D: 少なくとも300フィート手前
  answer: B
  explanation: 対向車線を横切って左折または右折する際は、曲がる少なくとも100フィート手前で方向指示器を出さなければなりません。
- id: 161
  category: safe_driving_rules
  question: ワシントン州では、一般的にどのような場合にUターンが許可されますか？
  choices:
    A: 4差路の交差点のみ
    B: 標識で明示的に許可されている場合のみ
    C: Uターン禁止の標識がない限り
    D: 分離帯のある高速道路のみ
  answer: C
  explanation: ワシントン州では、Uターン禁止の標識がない限り、一般的にUターンが許可されています。
- id: 162
  category: safe_driving_rules
  question: 視界に関する規則により、Uターンをしてはいけない場所はどこですか？
  choices:
    A: 住宅街の中
    B: カーブや丘の頂上付近
    C: T字路
    D: 一方通行の道路
  answer: B
  explanation: Uターンをする前に、全方向の視界が確保されている必要があります。そのため、カーブや丘の頂上付近ではUターンをしてはいけません。
- id: 163
  category: sharing_the_road
  question: 横断歩道のあるブロックの中間地点（交差点ではない場所）の横断歩道では、誰に優先権がありますか？
  choices:
    A: 制限速度で走行している車両
    B: 歩行者
    C: 自転車（降車している場合のみ）
    D: 車両（一時停止標識がない限り）
  answer: B
  explanation: マニュアルによると、ブロックの中間地点にある標識のある横断歩道では、常に歩行者に優先権があり、ドライバーは一時停止標識の有無にかかわらず停止しなければなりません。
- id: 164
  category: safe_driving_rules
  question: 交通静穏化サークル（トラフィック・カルミング・サークル）を通行する消防車や配送トラックなどの大型車両に対して、どのように対応すべきですか？
  choices:
    A: 自分の優先権を知らせるためにクラクションを鳴らす
    B: 右側から追い越す
    C: 通過するために時計回りに進む必要があるかもしれないので、十分なスペースを空ける
    D: サークルを早く通過するために車間距離を詰める
  answer: C
  explanation: マニュアルには、大型車両には十分なスペースを空け、交通静穏化サークルを通過するために時計回りに進む必要があるかもしれないことに注意するよう記載されています。
- id: 165
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内を走行するための設計速度はどれくらいですか？
  choices:
    A: 時速10〜15マイル (mph)
    B: 時速15〜25マイル (mph)
    C: 時速25〜35マイル (mph)
    D: 時速30〜40マイル (mph)
  answer: B
  explanation: マニュアルによると、ラウンドアバウトは時速15〜25マイル (mph) の速度で設計されています。
- id: 166
  category: sharing_the_road
  question: 自転車が車両としてラウンドアバウトを通行する場合、どのように走行すべきですか？
  choices:
    A: トラックエプロン（中央の乗り上げ可能な部分）を走行する
    B: 車線の右端を走行する
    C: 視認性を高めるために車線の中央を走行する
    D: 車の流れに逆らって走行する
  answer: C
  explanation: ラウンドアバウトを車両として通行する場合、自転車はドライバーからの視認性を高めるために車線の中央を走行する必要があります。
- id: 167
  category: safe_driving_rules
  question: ダイバージング・ダイヤモンド・インターチェンジ（DDI）の主な利点は何ですか？
  choices:
    A: 対向車を待ったり停止したりすることなく、フリーウェイへ左折できること。
    B: 一般道の交差点を高速道路の速度で走行できること。
    C: Uターン専用の車線が設けられていること。
    D: 歩行者用横断歩道の必要がなくなること。
  answer: A
  explanation: ダイバージング・ダイヤモンドの主な利点は、対向車を待ったり停止したりすることなく、フリーウェイへ左折できることです。
- id: 168
  category: safe_driving_rules
  question: 信号や標識のない交差点（無制御交差点）において、次のような状況のうち、優先権を譲らなければならないのはどれですか？
  choices:
    A: 未舗装路から舗装路に入る場合。
    B: 直進しており、前方の車両が左折しようとしている場合。
    C: 州道（ステート・ハイウェイ）を走行しており、脇道から車両が横断してくる場合。
    D: 舗装路から未舗装路に入る場合。
  answer: A
  explanation: 無制御交差点では、未舗装路から舗装路に入る場合、優先権を譲らなければなりません。
- id: 169
  category: signs_and_signals
  question: 路面にある短い破線の白線は何を示していますか？
  choices:
    A: この先にリバーシブル車線があること。
    B: 車線が終了するため、合流または出口へ向かう必要があること。
    C: 料金所に近づいていること。
    D: スクールゾーンに入ること。
  answer: B
  explanation: 短い破線の白線は、車線が終了することを意味しており、合流するか出口へ向かう必要があります。
- id: 170
  category: signs_and_signals
  question: 車線間の2本の白い実線は何を示していますか？
  choices:
    A: 安全であれば車線変更のために越えてもよい。
    B: 車線間の障壁であり、越えることは違法である。
    C: 相乗り車両（カープール）専用車線である。
    D: 共有のセンター左折車線内にいること。
  answer: B
  explanation: 2本の白い実線は車線間の障壁であり、これらを越えることは違法です。
- id: 171
  category: safe_driving_rules
  question: 共有センターターンレーン（中央右折専用車線）で走行が許可されている最大距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: センターターンレーン内を300フィート（約90メートル）を超えて走行してはいけません。
- id: 172
  category: signs_and_signals
  question: 標識や路面で高乗車人数車線（HOVレーン）を識別するために使用される記号はどれですか？
  choices:
    A: 白い円
    B: 黄色の三角形
    C: 菱形（ダイヤモンド）の記号
    D: 緑色の正方形
  answer: C
  explanation: HOVレーンは、標識や路面にある菱形（ダイヤモンド）の記号によって識別されます。
- id: 173
  category: signs_and_signals
  question: リバーシブルレーン（可変車線）を走行中、頭上の標識に黄色のX印が点灯している場合は何を意味しますか？
  choices:
    A: その車線を安全に使用できる。
    B: その車線は路線バス専用である。
    C: 車線の進行方向が変わるため、安全が確認でき次第すぐに車線から出る必要がある。
    D: 直ちに停止しなければならない。
  answer: C
  explanation: 黄色のX印の点灯は、その車線の進行方向が変わることを意味します。安全が確認でき次第、速やかにその車線から移動してください。
- id: 174
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に入る際、すでに環状内を走行している車両に道を譲るために、どの方向を確認すべきですか？
  choices:
    A: 右
    B: 左
    C: 直進方向
    D: バックミラー
  answer: B
  explanation: ラウンドアバウトに入る際は、すでに環状内を走行している車両が優先されるため、左側を確認してそれらの車両に道を譲らなければなりません。
- id: 175
  category: safe_driving_rules
  question: 中央分離帯の上や、中央分離帯を横断しての走行に関する規則は何ですか？
  choices:
    A: Uターンをする場合であれば許可される。
    B: 中央分離帯の中、上、または横断して走行することは違法である。
    C: 中央分離帯がオープンスペースである場合に限り許可される。
    D: 低速車両を追い越す場合であれば許可される。
  answer: B
  explanation: マニュアルには、中央分離帯の中、上、または横断して走行することは違法であると明記されています。
- id: 176
  category: signs_and_signals
  question: 中央に黄色の実線と黄色の破線がある対面通行の道路を走行している場合、いつ追い越しが許可されますか？
  choices:
    A: 対向車がいなければ、いつでも追い越しができる。
    B: 黄色の実線が自分の車線側にある場合のみ、追い越しができる。
    C: 黄色の破線が自分の車線側にあり、かつ安全である場合に追い越しができる。
    D: このような道路では、追い越しは一切禁止されている。
  answer: C
  explanation: 破線が自分の車線側にある場合は、安全であれば追い越しが可能です。黄色の実線が自分の車線側にある場合は、追い越しをしてはいけません。
- id: 177
  category: safe_driving_rules
  question: 標示がなくても、すべての交差点には法的に横断歩道が存在するとみなされますか？
  choices:
    A: いいえ、横断歩道は白い実線で標示されていなければならない。
    B: はい、標示の有無にかかわらず、すべての交差点は法的に横断歩道として定義されている。
    C: いいえ、横断歩道は路面照明がある場所にのみ存在する。
    D: はい、ただし指定されたスクールゾーン内に限る。
  answer: B
  explanation: マニュアルによると、すべての横断歩道に標示があるわけではなく、横断歩道の標示の有無にかかわらず、すべての交差点は法的に横断歩道として定義されています。
- id: 178
  category: sharing_the_road
  question: 走行車線と自転車レーンの間にある、2本の白い実線と斜めのクロスハッチング（斜線）で構成されるバッファー（緩衝帯）は何を示していますか？
  choices:
    A: 自転車専用の駐輪エリアである。
    B: 自動車用の追い越し車線である。
    C: 自転車レーンの一部であり、合法的な右左折を行う場合を除き、進入してはならない。
    D: 歩行者用の安全地帯である。
  answer: C
  explanation: マニュアルでは、このバッファーは自転車レーンの一部とみなされます。安全を確認した上で合法的な右左折を行う場合を除き、進入してはいけません。
- id: 179
  category: sharing_the_road
  question: シャロウ（自転車優先道路標示）がある車線で自転車を追い越す際、どれくらいの距離を空ける必要がありますか？
  choices:
    A: 少なくとも2フィート
    B: 少なくとも3フィート
    C: 少なくとも4フィート
    D: 少なくとも5フィート
  answer: B
  explanation: シャロウの標示がある場所では、速度を落として走行し、追い越す際は少なくとも3フィート（約0.9メートル）の間隔を空けなければなりません。
- id: 180
  category: sharing_the_road
  question: 自転車ボックス（バイシクルボックス）の近くで、赤信号時に右折することに関する規則は何ですか？
  choices:
    A: 自転車に道を譲れば、赤信号でも右折できる。
    B: 自転車ボックスの近くでは、赤信号時に右折することはできない。
    C: 自転車ボックスが空いている場合に限り、赤信号でも右折できる。
    D: 赤信号で右折する前に、クラクションを鳴らさなければならない。
  answer: B
  explanation: マニュアルには、「自転車ボックスの近くでは赤信号で右折することはできません。自転車ボックス内が空くまでは、白い線の手前で待機してください」と明記されています。
- id: 181
  category: safe_driving_rules
  question: スクールゾーン（学校周辺地域）の制限速度は何マイルですか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速30マイル
  answer: B
  explanation: スクールゾーンの制限速度は時速20マイル（20 mph）です。速度が上がると、死亡事故のリスクが高まるためです。
- id: 182
  category: safe_driving_rules
  question: 点滅灯を使用している路上対応車両がある緊急ゾーンに接近する際、遠くの車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: 速度を維持し、クラクションを鳴らす。
    B: 緊急車両がライトを消すまで完全に停止する。
    C: 掲示されている制限速度より少なくとも時速10マイル以上減速する。
    D: 加速して緊急ゾーンを素早く通過する。
  answer: C
  explanation: 点滅灯をつけた路上対応車両を見かけたら、すぐに遠くの車線に移動するか、掲示されている制限速度より少なくとも時速10マイル（10 mph）以上減速しなければなりません。
- id: 183
  category: safe_driving_rules
  question: 緊急ゾーンで運転が許可される最高速度は何マイルですか？
  choices:
    A: 時速30マイル
    B: 時速40マイル
    C: 時速50マイル
    D: 時速60マイル
  answer: C
  explanation: マニュアルには、緊急ゾーンでは時速50マイル（50 mph）を超えて運転してはならないと記載されています。
- id: 184
  category: safe_driving_rules
  question: 信号機、一時停止標識、または譲れ（yield）の標識から、車両を何フィート以上離して駐車しなければなりませんか？
  choices:
    A: 少なくとも15フィート
    B: 少なくとも20フィート
    C: 少なくとも30フィート
    D: 少なくとも50フィート
  answer: C
  explanation: 信号機、一時停止標識、または譲れの標識から30フィート以内に駐車してはいけません。
- id: 185
  category: safe_driving_rules
  question: 消火栓から何フィート以内に駐車することは違法ですか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 20フィート
  answer: C
  explanation: マニュアルには、消火栓から15フィート以内に駐車してはならないと記載されています。
- id: 186
  category: safe_driving_rules
  question: 縁石に並行して駐車する場合、車両は縁石から何インチ以内に収まっていなければなりませんか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: B
  explanation: 縁石から12インチ（約30センチ）以上離れて駐車することは許可されていません。
- id: 187
  category: defensive_driving
  question: 「ダッチ・リーチ（Dutch Reach）」法は何のために使用されますか？
  choices:
    A: バックする際に片手でハンドル操作をすること。
    B: 接近する自転車を確認するために、ドアから遠い方の手でドアを開けること。
    C: 緊急時にパーキングブレーキに手を伸ばすこと。
    D: 方向指示器が故障しているときに手信号で合図すること。
  answer: B
  explanation: 「ダッチ・リーチ」法とは、ドアから最も遠い方の手でドアを開ける方法です。これにより体が自然に回転し、後方から接近してくる自転車を確認しやすくなります。
- id: 188
  category: driver_responsibility
  question: エンジンがかかったままの駐車車両内に、何歳未満の子供を放置することは犯罪となりますか？
  choices:
    A: 10歳
    B: 12歳
    C: 14歳
    D: 16歳
  answer: D
  explanation: エンジンがかかったままの駐車車両内に、16歳未満の子供を放置することは犯罪です。
- id: 189
  category: signs_and_signals
  question: 駐車する際、白く塗られた縁石は何を示していますか？
  choices:
    A: 短時間の停車のみが許可されている。
    B: 荷物の積み下ろしゾーンである。
    C: 緊急車両専用の駐車スペースである。
    D: 最大2時間までの駐車が許可されている。
  answer: A
  explanation: 標識や塗られた縁石は、特定の駐車制限を示す場合があります。白は、短時間の停車（乗客の乗り降りなど）のみが許可されていることを意味します。
- id: 190
  category: safe_driving_rules
  question: ドライブウェイ（私道入口）、路地、または私道から何フィート以内に駐車してはいけませんか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 20フィート
  answer: A
  explanation: マニュアルには、ドライブウェイ、路地、または私道から5フィート以内に駐車してはならないと記載されています。
- id: 191
  category: safe_driving_rules
  question: 縦列駐車をする際、車両と縁石の間の最大距離はどれくらいですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: B
  explanation: 縦列駐車スペースで車両を調整する際は、車両が縁石から12インチ以内にあることを確認する必要があります。
- id: 192
  category: safe_driving_rules
  question: 高い縁石のある上り坂で駐車する場合、ハンドルはどちらの方向に切るべきですか？
  choices:
    A: 縁石の方へ
    B: 縁石とは反対の方へ
    C: 車輪をまっすぐに保つ
    D: 道路の中央の方へ
  answer: B
  explanation: 高い縁石のある坂道では、前輪の後ろ側が縁石に触れるまで、ハンドルを縁石とは反対の方向に切ります。これにより、車両が動き出したとしても、縁石に当たって止まるようになります。
- id: 193
  category: safe_driving_rules
  question: 下り坂で駐車する場合、ハンドルをどのように位置させるべきですか？
  choices:
    A: 縁石の方へ切る
    B: 縁石とは反対の方へ切る
    C: 車輪を完全にまっすぐに保つ
    D: センターラインの方へ切る
  answer: A
  explanation: 下り坂では、車両が動き出した場合に縁石に当たって止まるよう、前輪の前側が縁石に触れるまでハンドルを縁石の方へ切ります。
- id: 194
  category: safe_driving_rules
  question: 運転中にバックミラーに身体障害者用駐車許可証（プラカード）を吊り下げてはいけないのはなぜですか？
  choices:
    A: 他のドライバーの注意をそらすため
    B: 視界を遮るため
    C: ミラーを損傷させる可能性があるため
    D: ダッシュボードに置いた場合のみ有効であるため
  answer: B
  explanation: マニュアルには、「運転中は視界を遮るため、バックミラーに駐車許可証を吊り下げないでください」と記載されています。
- id: 195
  category: safe_driving_rules
  question: 身体障害者専用駐車スペースの横にある白い斜線のエリアの目的は何ですか？
  choices:
    A: 歩行者用横断歩道であることを示している
    B: 常に空けておかなければならないアクセス通路である
    C: オートバイの駐車エリアを示している
    D: ショッピングカートを置く場所を示している
  answer: B
  explanation: 専用スペースの横にある白い斜線はアクセス通路と呼ばれ、常に空けておかなければなりません。ここを塞ぐと罰金が科せられる場合があります。
- id: 196
  category: safe_driving_rules
  question: 電気自動車（EV）充電ステーションに車両を駐車することが合法となるのはいつですか？
  choices:
    A: 電気自動車を運転している場合ならいつでも
    B: 最大30分間に限る
    C: 車両が充電機器に接続されている場合のみ
    D: 週末と祝日のみ
  answer: C
  explanation: 車両が充電機器に接続されていない状態で、電気自動車充電ステーションに駐車することは違法です。
- id: 197
  category: driver_responsibility
  question: トラックの荷台で動物を運ぶ場合、法律で義務付けられていることは何ですか？
  choices:
    A: 動物を標準的なリードで繋がなければならない
    B: 動物に保護用ハーネスを装着するか、囲いに入れなければならない
    C: トラックにキャノピー（屋根）を設置しなければならない
    D: 荷台に同乗者が付き添わなければならない
  answer: B
  explanation: 動物が飛び出したり転落したりしないよう、保護用ハーネスや囲いなしに車外（トラックの荷台など）で動物を運ぶことは違法です。
- id: 198
  category: defensive_driving
  question: 運転者のひざの上に動物を乗せて走ることが問題とされるのはなぜですか？
  choices:
    A: 安全運転への集中を妨げる、潜在的な注意散漫の原因となるため
    B: 助手席側のサイドミラーを遮るため
    C: エアバッグの作動を妨げるため
    D: 車両の重量制限に違反するため
  answer: A
  explanation: 車両の安全運転から注意をそらすような活動に従事することは違法です。車内で放されている動物や、運転者のひざの上に乗っている動物は、注意散漫を引き起こす可能性があります。
- id: 199
  category: penalties_and_points
  question: ワシントン州フェリーターミナルで列に割り込みをした場合、どうなる可能性がありますか？
  choices:
    A: 最後に乗船するように求められる
    B: 運賃を2倍請求される
    C: 罰金につながる可能性のある交通違反となる
    D: 車両が直ちにレッカー移動される
  answer: C
  explanation: フェリーの列への割り込みは交通違反であり、罰金が科せられる可能性があります。
- id: 200
  category: sharing_the_road
  question: フェリーターミナルにおいて、自転車利用者はどのように扱われますか？
  choices:
    A: すべての自動車の後ろで待たなければならない
    B: 優先的に乗船でき、自動車の前方に待機エリアがある
    C: 州営フェリーへの乗船は許可されていない
    D: 歩行者と全く同時に乗船しなければならない
  answer: B
  explanation: ほとんどのフェリーで自転車利用者は優先的に乗船でき、自動車の前方に自転車用待機エリアが設けられています。自転車はフェリー待機レーンで待っている車両を追い越して進むことができます。
- id: 201
  category: safe_driving_rules
  question: ワシントン州で許可されている海岸（オーシャンビーチ）を走行する際の制限速度は何マイルですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: 海岸は州道とみなされるため、すべての交通法規が適用されます。制限速度は時速25マイル（25 mph）です。
- id: 202
  category: sharing_the_road
  question: 海岸（オーシャンビーチ）を走行中、常に優先権（right-of-way）を持つのは誰ですか？
  choices:
    A: 自動車
    B: 歩行者と自転車利用者
    C: 緊急車両のみ
    D: 四輪駆動車
  answer: B
  explanation: 海岸を走行する際、歩行者と自転車利用者は常に優先権を持ちます。
- id: 203
  category: driver_responsibility
  question: マニュアルによると、ワシントン州の16歳から25歳の人々の主な死因は何ですか？
  choices:
    A: 溺死
    B: 自動車事故
    C: 職場での事故
    D: 歩行者との衝突
  answer: B
  explanation: ワシントン州では、自動車事故が16歳から25歳の人々の主な死因となっています。
- id: 204
  category: defensive_driving
  question: 危険（ハザード）に近づく際、安全な判断を下すためのスペースと時間を確保するために何をすべきですか？
  choices:
    A: 危険を早く通り過ぎるために加速する
    B: 継続的にクラクションを鳴らす
    C: 速度を落として運転する
    D: 対向車線に移動する
  answer: C
  explanation: 危険に近づく際は、安全な判断を下すためのスペースと時間を確保するために、速度を落として運転してください。
- id: 205
  category: defensive_driving
  question: 前方に危険を発見した後、後方を確認することが重要なのはなぜですか？
  choices:
    A: 他のドライバーがスピードを出していないか確認するため
    B: 後方で起きていることが自身の意思決定に影響を与える可能性があるため
    C: 尾灯（テールランプ）が機能しているか確認するため
    D: 危険は通常後方からやってくるため
  answer: B
  explanation: 進路変更などを必要とする危険を発見した後は、後方を確認してください。後方で起きていることは、あなたの意思決定に影響を与える可能性があります。
- id: 206
  category: defensive_driving
  question: 運転中の「状況認識（situational awareness）」には何が含まれますか？
  choices:
    A: 直前の車両だけに集中すること。
    B: 周囲で何が起きているかを観察し、次に備えるべきことを予測すること。
    C: 突然の危険を避けるために、素早い反応に頼ること。
    D: 環境に関係なく一定の速度を維持すること。
  answer: B
  explanation: 状況認識とは、周囲で何が起きているかを観察し、次に何を準備すべきかを予測することです。
- id: 207
  category: defensive_driving
  question: 危険管理ルーチンの正しい順序は次のうちどれですか？
  choices:
    A: 確認、計画、実行、伝達、評価 (Check, Plan, Execute, Communicate, Evaluate)
    B: 計画、伝達、確認、実行、評価 (Plan, Communicate, Check, Execute, Evaluate)
    C: 評価、計画、確認、伝達、実行 (Evaluate, Plan, Check, Communicate, Execute)
    D: 伝達、実行、確認、計画、評価 (Communicate, Execute, Check, Plan, Evaluate)
  answer: B
  explanation: 危険に対応するための信頼できるルーチンは、「計画 (Plan)」、「伝達 (Communicate)」、「確認 (Check)」、「実行
    (Execute)」、「評価 (Evaluate)」の順序で行う必要があります。
- id: 208
  category: safe_driving_rules
  question: 過度なスピードでの運転は、シートベルトにどのような影響を与えますか？
  choices:
    A: むち打ち症を防ぐ能力が高まる。
    B: 性能に影響はない。
    C: 衝突時にあなたを保護する効果が低下する。
    D: 早期にロックがかかる原因となる。
  answer: C
  explanation: シートベルトは衝突時にあなたを保護するように設計されていますが、速度が上がるとその効果は低下します。
- id: 209
  category: safe_driving_rules
  question: 掲示されている制限速度は何を示していますか？
  choices:
    A: あらゆる天候条件における推奨速度。
    B: 運転が許可される最低速度。
    C: 理想的な条件下で法的に許容される最高速度。
    D: 交通の流れを確保するために維持しなければならない速度。
  answer: C
  explanation: 制限速度は、理想的な条件下で法的に許容される最高速度を示しています。ワシントン州の法律では、現在の道路状況に対して安全な速度で運転することも義務付けられています。
- id: 210
  category: safe_driving_rules
  question: 次の状況のうち、掲示されている制限速度以下に減速すべきなのはどれですか？
  choices:
    A: 直線で乾燥した高速道路を走行しているとき。
    B: 歩行者が多い場所やショッピングセンター周辺を走行しているとき。
    C: 約束の時間に遅れているとき。
    D: 州間高速道路の左車線を走行しているとき。
  answer: B
  explanation: ショッピングセンター、駐車場、歩行者が多い場所などの状況では、速度を落とす必要があります。
- id: 211
  category: safe_driving_rules
  question: 他の車両の近くを走行する際、前方車両との間に空けるべき最小距離はどれくらいですか？
  choices:
    A: 少なくとも自車の長さ分。
    B: 少なくとも自車の長さの2倍。
    C: 少なくとも自車の長さの3倍。
    D: 少なくとも自車の長さの4倍。
  answer: B
  explanation: 他の車両の近くを走行する際は、前方車両との間に少なくとも自車の長さの2倍の距離を空けることが重要です。
- id: 212
  category: sharing_the_road
  question: 州間高速道路（インターステート）に合流する際、どちらに優先権がありますか？
  choices:
    A: 高速道路に合流しようとしている車両。
    B: 最も速い速度で走行している車両。
    C: すでに高速道路を走行しているドライバー。
    D: 右側の車両。
  answer: C
  explanation: すでに高速道路を走行しているドライバーに優先権があるため、合流するためのスペースを作るには速度を調整する必要がある場合があります。
- id: 213
  category: sharing_the_road
  question: ジッパー合流によって、交通の流れは最大でどの程度改善されますか？
  choices:
    A: 20パーセント
    B: 40パーセント
    C: 60パーセント
    D: 80パーセント
  answer: C
  explanation: ジッパー合流は、交通の流れを60パーセント改善する手法です。
- id: 214
  category: sharing_the_road
  question: ジッパー合流を実行する正しい方法は何ですか？
  choices:
    A: 閉鎖される車線から出るために、できるだけ早く合流する。
    B: 車線が終わる前にできるだけ多くの車を追い越すために加速する。
    C: 指定された合流地点まで自分の車線を走り、その後交互に合流する。
    D: 閉鎖される車線で停止し、交通が大きく途切れるのを待つ。
  answer: C
  explanation: ジッパー合流を行うには、指定された合流地点に達するまで自分の車線を走り、その後、もう一方の車線の車両と交互に合流する必要があります。
- id: 215
  category: defensive_driving
  question: 運転中にアイ・リード・タイム（前方注視時間）を設ける目的は何ですか？
  choices:
    A: 直前の車両だけに集中するため。
    B: 前方および側方の道路をスキャンして、潜在的な危険を早期に特定するため。
    C: 後方の車両の速度を推定するため。
    D: 夜間に道路標識をよりはっきりと読むため。
  answer: B
  explanation: アイ・リード・タイムを設けることで、前方の道路をスキャンして潜在的な危険を探すことができます。これにより、危険を早期に発見、分析、対応する時間が得られます。
- id: 216
  category: defensive_driving
  question: 車間距離を判断するための「秒数カウント」演習を行う際、どのくらい前方の目印を選ぶべきですか？
  choices:
    A: 自車の5秒前方。
    B: 自車の10秒前方。
    C: 自車の15秒前方。
    D: 自車の20秒前方。
  answer: C
  explanation: マニュアルでは、車間距離を判断する練習として、道路標識や電柱など、自車の15秒前方にあると思われる目印を選ぶことを推奨しています。
- id: 217
  category: safe_driving_rules
  question: 対向車の前を曲がろうとする際、どちらに優先権がありますか？
  choices:
    A: 右左折しようとしている車両。
    B: 直進してくる対向車。
    C: より遅い速度で走行している車両。
    D: 交差点に先に到着した方。
  answer: B
  explanation: 対向車がいる状況で右左折の準備をする際は、直進してくる対向車に優先権があることを忘れないでください。
- id: 218
  category: driver_responsibility
  question: 運転中に注意散漫を排除し、積極的に注意を払うことが不可欠なのはなぜですか？
  choices:
    A: 脳は一度に一つのことにしか集中できないため。
    B: 現代の車両は古い車よりも多くの手動操作を必要とするため。
    C: スピード違反の切符を切られないようにする唯一の方法であるため。
    D: 注意が散漫になると周辺視野が機能しなくなるため。
  answer: A
  explanation: 脳は一度に一つのことにしか集中できないため、安全な運転には全神経を集中させることが不可欠です。
- id: 219
  category: driver_responsibility
  question: 正面の詳細を見ることを可能にする視覚の種類はどれですか？
  choices:
    A: 周辺視野 (Peripheral vision)
    B: 周辺視 (Fringe vision)
    C: 中心視野 (Central vision)
    D: 焦点視 (Focal vision)
  answer: C
  explanation: 中心視野は、正面の詳細を見ることを可能にします。これは、文字を読むときに使っている視覚です。
- id: 220
  category: driver_responsibility
  question: 高速走行は視界にどのような影響を与えますか？
  choices:
    A: 中心視野が向上する。
    B: 各タイプの視覚の質が低下する。
    C: 周辺視が広がる。
    D: 視覚には影響を与えない。
  answer: B
  explanation: マニュアルによると、運転中には3種類の視覚を使用しますが、速度が上がるとそれぞれの視覚の質が低下します。
- id: 221
  category: safe_driving_rules
  question: 夜間の運転中、どのくらいの距離以内で停止できる速度で走行すべきですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 400フィート
  answer: D
  explanation: 夜間の運転中は、ヘッドライトの照射範囲内（通常は400フィート）で停止できる速度で走行する必要があります。
- id: 222
  category: defensive_driving
  question: 対向車がハイビームを点灯させている場合、どうすべきですか？
  choices:
    A: 相手が消灯するまでハイビームを繰り返し点滅させる。
    B: 距離を測るためにヘッドライトを直視する。
    C: 道路の右側を見る。
    D: 夜間視力を維持するために片目を閉じる。
  answer: C
  explanation: 対向車がハイビームを点灯して近づいてきた場合は、ヘッドライトの光に惑わされないよう、道路の右側を見るようにしてください。
- id: 223
  category: safe_driving_rules
  question: カーブに向けて減速するのに最適なタイミングはいつですか？
  choices:
    A: カーブに入る前。
    B: カーブの途中で。
    C: カーブを抜け始める直前。
    D: カーブ全体を通して一定の速度を維持すべきである。
  answer: A
  explanation: カーブに入る前に減速する必要があります。これにより、トラクション（路面保持力）を維持し、車両のスリップや路外への逸脱を防ぐことができます。
- id: 224
  category: defensive_driving
  question: カーブに近づく際、推奨される車線内の位置はどこですか？
  choices:
    A: 車線のわずかに内側。
    B: 車線のわずかに外側。
    C: 車線のちょうど中央。
    D: 中央線をまたぐ位置。
  answer: B
  explanation: カーブに近づく際は、車両を車線のわずかに外側に位置させます。これにより、操作の余裕が生まれ、視界も向上します。
- id: 225
  category: vehicle_information
  question: カーブで急にハンドルを切ったとき、車を直線方向に動かし続けようとする力は何ですか？
  choices:
    A: 摩擦力
    B: 運動エネルギー
    C: 慣性
    D: ヨー（Yaw）
  answer: C
  explanation: カーブで急にハンドルを切った場合、慣性によって車は直進し続けようとします。
- id: 226
  category: defensive_driving
  question: 暑い日に雨が降り始めた直後の数分間、路面が非常に滑りやすくなるのはなぜですか？
  choices:
    A: 雨が埃と混ざり、厚い泥の層を作るため。
    B: 熱によってアスファルト内の油分が表面に浮き出てくるため。
    C: 路面が急激に冷やされ、ブラックアイスの層ができるため。
    D: 水によって即座にハイドロプレーニング現象が発生するため。
  answer: B
  explanation: 暑い日に雨が降り始めた場合、熱によってアスファルト内の油分が表面に浮き出てくるため、最初の数分間は路面が非常に滑りやすくなることがあります。
- id: 227
  category: defensive_driving
  question: 道路の他の部分が凍結していなくても、凍結しやすい場所はどこですか？
  choices:
    A: トンネル
    B: 交差点
    C: 高架橋や橋の上
    D: 上り坂
  answer: C
  explanation: 高架橋やその他の橋の上は、道路の他の部分が凍結していなくても、凍結箇所がある場合があります。
- id: 228
  category: defensive_driving
  question: 氷点下の気温が氷点下近くまで上昇することは、凍結した道路にどのような影響を与えますか？
  choices:
    A: 氷が完全に溶けるため、路面が滑りにくくなる。
    B: 氷が溶けて濡れるため、路面がより滑りやすくなる。
    C: タイヤの摩擦力が大幅に増加する。
    D: 路面の滑りやすさに影響はない。
  answer: B
  explanation: 氷点下の気温が氷点下近くまで上昇すると、氷が溶けて濡れた状態になることがあります。これにより、路面はより滑りやすくなります。
- id: 229
  category: safe_driving_rules
  question: 車両がスリップし始めた場合、ハンドルをどのように操作すべきですか？
  choices:
    A: 車両が動いている方向とは逆の方向にハンドルを切る。
    B: ハンドルを完全に真っ直ぐに保持する。
    C: 車両が動いている方向と同じ方向にハンドルを切る。
    D: トラクションを回復させるために、ハンドルを左右に素早く動かす。
  answer: C
  explanation: スリップしている場合は、車両が動いている方向と同じ方向にハンドルを切り、タイヤのトラクションが回復するまでハンドルの修正を続けてください。
- id: 230
  category: defensive_driving
  question: ハイドロプレーニング現象の原因は何ですか？
  choices:
    A: 暑い日にアスファルトの表面に油が浮き上がること。
    B: タイヤと路面の間に水が溜まること。
    C: 高速でブラックアイスの上を走行すること。
    D: 乾燥した砂利道で急ブレーキをかけること。
  answer: B
  explanation: ハイドロプレーニング現象は、タイヤと路面の間に水が溜まり、タイヤがトラクションを失って滑ることで発生します。
- id: 231
  category: safe_driving_rules
  question: ハイドロプレーニング現象が発生した場合、どのような行動をとるのが正しいですか？
  choices:
    A: 加速して水を押し切る。
    B: ハンドルを右に急に切る。
    C: ブレーキペダルを強く踏む。
    D: アクセルから足を離し、ハンドルを固定する。
  answer: D
  explanation: ハイドロプレーニング現象が発生した場合は、アクセルから足を離し、ブレーキを軽く踏み、過度な修正を行わずにハンドルを固定する必要があります。
- id: 232
  category: safe_driving_rules
  question: 夜間や曇天時の運転中に、サングラスや着色レンズの着用を避けるべきなのはなぜですか？
  choices:
    A: 対向車のヘッドライトによる眩しさを引き起こすため。
    B: 視界が悪くなるため。
    C: 交通信号の色が歪んで見えるため。
    D: 周辺視野が広がりすぎるため。
  answer: B
  explanation: 夜間や曇天時の運転中は、着色レンズやカラーレンズが視界を低下させるため、サングラスや着色レンズを着用しないでください。
- id: 233
  category: vehicle_information
  question: タイヤと路面の間に働き、車両が路面をグリップできるようにする力は何ですか？
  choices:
    A: 慣性 (Inertia)
    B: 運動量 (Momentum)
    C: 摩擦 (Friction)
    D: 運動エネルギー (Kinetic energy)
  answer: C
  explanation: 摩擦（Friction）はタイヤと路面の間に働く力です。これにより車両が路面をグリップし、安全に減速、加速、または旋回することができます。
- id: 234
  category: defensive_driving
  question: 道路上で車両トラブルが発生した場合、車両の後方どのくらいの距離に緊急用フレア（発炎筒）を設置すべきですか？
  choices:
    A: 50〜100フィート
    B: 100〜150フィート
    C: 200〜300フィート
    D: 300〜400フィート
  answer: C
  explanation: マニュアルには、車両の後方200〜300フィートの位置に緊急用フレアを設置して、他の道路利用者に警告するように記載されています。
- id: 235
  category: vehicle_information
  question: タイヤが突然パンクしたり空気が抜けたりした場合、ブレーキをどのように操作すべきですか？
  choices:
    A: コントロールを維持するためにブレーキを素早くポンピングする。
    B: 車両を停止させるために、すぐに強くブレーキをかける。
    C: ブレーキをかけないか、必要な場合にのみ軽くブレーキをかける。
    D: 非常用パーキングブレーキをかける。
  answer: C
  explanation: タイヤがパンクした場合、マニュアルでは「ブレーキをかけないでください。車両が自然に減速するのを待つか、必要な場合にのみ軽くブレーキをかけてください」とアドバイスしています。
- id: 236
  category: defensive_driving
  question: 車両のアクセルが戻らなくなり、速度が上がり続ける場合、最初にとるべき機械的な手順は何ですか？
  choices:
    A: すぐにエンジンを切る。
    B: 素早くニュートラルにシフトチェンジする。
    C: パーキングブレーキをかける。
    D: 低いギアにシフトダウンする。
  answer: B
  explanation: 車両の速度がどんどん上がっていく場合は、道路を注視し続け、道路脇に寄せてエンジンを切る前に、素早くニュートラルにシフトチェンジする必要があります。
- id: 237
  category: safe_driving_rules
  question: マニュアルによると、衝突事故の典型的な3つの原因のうちの1つは次のうちどれですか？
  choices:
    A: タイヤの空気圧不足での運転
    B: 状況認識の不足
    C: 悪天候
    D: 機械的故障
  answer: B
  explanation: マニュアルには、衝突事故には通常「スピードの出しすぎ」「車間距離の不足」「状況認識の不足」の3つの原因があると記載されています。
- id: 238
  category: driver_responsibility
  question: 駐車中の車両に衝突し、所有者が見つからない場合、メモに残さなければならない情報は何ですか？
  choices:
    A: 運転免許証番号と保険証券番号。
    B: 衝突の日時と連絡先情報。
    C: 電話番号のみ。
    D: 車両のライセンスプレート番号と保険会社名。
  answer: B
  explanation: 駐車中の車両との衝突で所有者が見つからない場合は、衝突の日時と連絡先情報を記載したメモを残さなければなりません。
- id: 239
  category: driver_responsibility
  question: 警察官が衝突報告書を作成しない場合、自分でフォームを提出するまでに何日間の猶予がありますか？
  choices:
    A: 2日
    B: 4日
    C: 7日
    D: 10日
  answer: B
  explanation: 警察官が報告を行わない場合、事故から4日以内に衝突報告書フォームを提出しなければなりません。
- id: 240
  category: alcohol_drugs_health
  question: 事故の後、負傷者に飲み物として何を与えるべきですか？
  choices:
    A: 少量の水。
    B: ショックを防ぐための砂糖入りの飲み物。
    C: 温かい飲み物のみ。
    D: 水を含め、何も飲ませてはいけない。
  answer: D
  explanation: 事故後の負傷者を助ける際、マニュアルには「負傷者には、水であっても何も飲ませてはいけません」と明記されています。
- id: 241
  category: alcohol_drugs_health
  question: 衝突事故の後、なぜ負傷者に毛布やコートを掛けるべきなのですか？
  choices:
    A: 通行車両から見えないようにするため。
    B: 動き回るのを防ぐため。
    C: 体温を保ち、ショック状態に陥るのを防ぐため。
    D: 出血を止めるため。
  answer: C
  explanation: マニュアルでは、負傷者の体温を保ち、ショック状態に陥るのを防ぐために、毛布やコートを掛けるよう指示しています。
- id: 242
  category: safe_driving_rules
  question: 衝突事故の後、電線が車両に接触し、火災が発生していない場合、どうすべきですか？
  choices:
    A: すぐに車から降りて逃げる。
    B: エンジンを切り、911に通報し、車内にとどまる。
    C: 金属フレームに触れないよう注意しながら、慎重に車外に出る。
    D: 電線を切断するために素早く前進する。
  answer: B
  explanation: 電線が絡む衝突事故が発生した場合、エンジンを切り、911に通報し、救急隊が到着するまで車内にとどまらなければなりません。
- id: 243
  category: defensive_driving
  question: 電線が車両に落下して火災が発生した場合、車両から飛び降りた後、どのように離れるべきですか？
  choices:
    A: 少なくとも100フィート（約30メートル）離れるまで、できるだけ速く走る。
    B: 地面との接触を最小限にするため、大きく跳ねるように歩く。
    C: 両足を揃えたまま、35フィート（約10メートル）離れた安全な場所まで足をすり足で移動させる。
    D: 煙を避けるために、手と膝をついて這って進む。
  answer: C
  explanation: 火災が発生し避難しなければならない場合は、両足が同時に着地するように飛び降り、感電を避けるために、両足を揃えたまま35フィート（約10メートル）離れた安全な場所まで足をすり足で移動させてください。
- id: 244
  category: driver_responsibility
  question: 夜間に警察官に車を止められた場合、どうすべきですか？
  choices:
    A: ヘッドライトを消す。
    B: 車内灯を点灯させる。
    C: 警察官から見えるように車外に出る。
    D: 警察官に気づいたことを知らせるためにハイビームを点滅させる。
  answer: B
  explanation: 夜間に車を止められた場合は、警察官からの視認性を高めるために車内灯を点灯させるべきです。
- id: 245
  category: driver_responsibility
  question: 警察官から運転免許証と車両書類の提示を求められた際、適切な手順は何ですか？
  choices:
    A: 警察官が近づく前に準備ができるよう、素早くグローブボックスに手を伸ばす。
    B: 書類を渡すために車外に出る。
    C: 手を伸ばす前に、書類がどこにあるかを警察官に伝える。
    D: 警察官が自分で免許証を取り出せるように、財布を渡す。
  answer: C
  explanation: 書類を取り出す前に警察官の指示を待ち、手を伸ばす前にそれらの書類がどこにあるかを警察官に伝える必要があります。
- id: 246
  category: vehicle_information
  question: 走行中にエンジンが突然停止した場合、ステアリングホイール（ハンドル）の状態について何を想定すべきですか？
  choices:
    A: ステアリングホイールが完全にロックされ、回せなくなる。
    B: ステアリングホイールが非常に軽く、敏感になる。
    C: ステアリングホイールの操作が重くなる可能性があるが、それでも回すことはできる。
    D: ステアリングホイールが自動的に車両を右側に誘導する。
  answer: C
  explanation: エンジンが停止した場合は、ステアリングホイールをしっかりと握ってください。操作が重くなる可能性がありますが、回すことは可能です。
- id: 247
  category: defensive_driving
  question: 走行中にヘッドライトが突然消えた場合、まず最初に行うべきことは次のうちどれですか？
  choices:
    A: 急ブレーキをかけて車線内で停止する。
    B: 非常点滅表示灯（ハザードランプ）、方向指示器、またはフォグランプを点灯させる。
    C: 明るい場所に到達するために加速する。
    D: 電気システムをリセットするためにエンジンを切る。
  answer: B
  explanation: ヘッドライトが突然消えた場合は、非常点滅表示灯（ハザードランプ）、方向指示器、またはフォグランプ（装備されている場合）を点灯させ、できるだけ早く道路脇に寄せて停車してください。
- id: 248
  category: vehicle_information
  question: アンチロックブレーキ（ABS）非搭載の車両でハイドロプレーニング現象が起きている際、ブレーキペダルを強く踏むとどうなる可能性がありますか？
  choices:
    A: 車両が即座に路面との接地を回復するのを助ける。
    B: ハイドロプレーニング現象をさらに悪化させる可能性がある。
    C: 車両の荷重を安全に後輪へ移動させる。
    D: 自動的に緊急ブレーキシステムが作動する。
  answer: B
  explanation: マニュアルでは、アンチロックブレーキ（ABS）がない場合、ブレーキペダルを強く踏むとハイドロプレーニング現象をさらに悪化させる可能性があると警告しています。
- id: 249
  category: driver_responsibility
  question: 交通取り締まりで停車した際、書類に手を伸ばす前に何をすべきですか？
  choices:
    A: 自由に動けるようにシートベルトを外す。
    B: 書類がどこにあるかを警察官に伝える。
    C: 書類を渡すために車外に出る。
    D: 最初に武器を警察官に渡す。
  answer: B
  explanation: マニュアルには、交通取り締まりの際、書類に手を伸ばす前にその場所を警察官に伝えるべきであると記載されています。
- id: 250
  category: penalties_and_points
  question: 交通違反切符への署名を拒否した場合、どうなる可能性がありますか？
  choices:
    A: 代わりに警告が出される。
    B: 車両が即座に押収される。
    C: 逮捕される可能性がある。
    D: 自動的に交通違反の罪を認めたことになる。
  answer: C
  explanation: マニュアルによると、署名は罪を認めることにはなりませんが、交通違反切符への署名を拒否すると逮捕される可能性があります。
- id: 251
  category: penalties_and_points
  question: 運転免許の停止を避けるために、違反切符の裏面にある指示に従わなければならない期間は何日以内ですか？
  choices:
    A: 10日
    B: 15日
    C: 20日
    D: 30日
  answer: B
  explanation: 運転免許の停止を避けるためには、15日以内に違反切符の裏面にある指示に従う必要があります。
- id: 252
  category: alcohol_drugs_health
  question: 黙示の同意法（implied consent law）は、ドライバーに何を求めていますか？
  choices:
    A: 通常の交通検問中に車両の捜索に同意すること。
    B: 影響下での運転（DUI）の疑いがある場合、呼気検査などの特定の検査を受けること。
    C: 交通違反切符を受け取ってから15日以内にすべての罰金を支払うことに同意すること。
    D: 令状なしで警察が運転免許証を没収することを許可すること。
  answer: B
  explanation: 黙示の同意法は、影響下での運転（DUI）の疑いがある場合に、ドライバーが呼気検査などの特定の検査を受けることを義務付けています。
- id: 253
  category: sharing_the_road
  question: 高占有車両（HOV）車線は、どのような車両のために予約されていますか？
  choices:
    A: 運転者のみが乗車している車両。
    B: 2人以上が乗車している車両。
    C: 3人以上が乗車している車両。
    D: 商業貨物を輸送している車両。
  answer: B
  explanation: 用語集では、高占有車両（HOV）車線は、2人以上が乗車している相乗り車両のために予約された車線と定義されています。
- id: 254
  category: safe_driving_rules
  question: ハイドロプレーニング現象の定義は何ですか？
  choices:
    A: 濡れた路面で車両がトラクション（摩擦力）を失い、横滑りすること。
    B: 水に浸かったことで車両のブレーキが正常に作動しなくなること。
    C: 激しい雨の中、運転者がハンドルを握ったまま眠ってしまうこと。
    D: 不均一な路面で車両が左右に揺れること。
  answer: A
  explanation: ハイドロプレーニング現象は、濡れた路面で車両がトラクションを失い、横滑りしたときに発生します。
- id: 255
  category: alcohol_drugs_health
  question: オープンコンテナ法（開栓容器禁止法）は、運転者および同乗者に対して何を禁止していますか？
  choices:
    A: 高速道路を走行中に車両の窓を開けたままにすること。
    B: 開放されたトラックの荷台で危険物を輸送すること。
    C: 車内にアルコール飲料の開栓済み容器を置くこと。
    D: トランクやテールゲートを開けたまま運転すること。
  answer: C
  explanation: オープンコンテナ法は、飲酒運転を防止するため、運転者および同乗者が車内にアルコール飲料の開栓済み容器を持ち込むことを禁止しています。
- id: 256
  category: safe_driving_rules
  question: 運転教本において「優先権（right-of-way）」はどのように定義されていますか？
  choices:
    A: 道路の右側を走行する法的権利。
    B: 交通において先に進む法的権利。
    C: 赤信号で右折できる能力。
    D: 常に歩行者に道を譲る義務。
  answer: B
  explanation: 優先権は、交通において先に進む法的権利と定義されています。例えば、交差点で最初に停止した車両が優先権を持ちます。
- id: 257
  category: alcohol_drugs_health
  question: 「多剤併用（polydrug use）」という用語は何を指しますか？
  choices:
    A: 運転中に処方薬を使用すること。
    B: 2種類以上の薬物を同時に摂取または使用すること。
    C: アルコールの影響下のみで運転すること。
    D: 自動車で違法薬物を輸送すること。
  answer: B
  explanation: 多剤併用とは、2種類以上の薬物を同時に摂取または使用することと定義されています。
- id: 258
  category: license_system
  question: ライセンス・エクスプレス（License Express）は何のために使用されますか？
  choices:
    A: 駐車違反切符の代金をオンラインで支払うため。
    B: 自宅から運転知識試験を受けるため。
    C: 運転免許証の更新や車両売却の報告をオンラインで行うため。
    D: 緊急車両の先導を依頼するため。
  answer: C
  explanation: ライセンス・エクスプレスは、運転免許証、車両タブ、営業許可証の更新、または車両売却時の報告ができるオンラインサービスです。
- id: 259
  category: defensive_driving
  question: 「プロアクティブ（先見的）」なドライバーであるとはどういう意味ですか？
  choices:
    A: 目に見える状況に対応すること。
    B: 予測される状況に対応すること。
    C: 渋滞を避けるために交通の流れよりも速く走ること。
    D: 先進運転支援システム（ADAS）のみに頼ること。
  answer: B
  explanation: プロアクティブであるとは、予測される状況に対応することを意味します。一方、リアクティブ（反応的）であるとは、目に見える状況に対応することを意味します。
- id: 260
  category: safe_driving_rules
  question: 周辺視野（peripheral vision）はどのように定義されますか？
  choices:
    A: 夜間に鮮明に見る能力。
    B: まっすぐ前を見ているときに、横にある物体が見えること。
    C: 2台の車両間の距離を判断する能力。
    D: バックミラーを通して後方を確認すること。
  answer: B
  explanation: 周辺視野は、まっすぐ前を見ているときに、横にある物体が見えることと定義されています。
- id: 261
  category: vehicle_information
  question: 車両の左右の揺れ（動き）は、一般的に何と呼ばれますか？
  choices:
    A: ピッチ（Pitch）
    B: ロール（Roll）
    C: スキッド（Skid）
    D: ハイドロプレーニング（Hydroplaning）
  answer: B
  explanation: 用語集では、車両の左右の揺れや動きのことを「車両のロール（Roll of vehicle）」と定義しています。
- id: 262
  category: license_system
  question: 農業用許可証（Agricultural permit）により、18歳未満の人は何ができますか？
  choices:
    A: 州境を越えてあらゆる商用車を運転すること。
    B: トラクターやその他の農業用車両を運転すること。
    C: セミトラックで農産物を輸送すること。
    D: 農村地域で標準の速度制限を無視すること。
  answer: B
  explanation: 農業用許可証は、18歳未満の人がトラクターやその他の農業用車両を運転することを許可するものです。
- id: 263
  category: signs_and_signals
  question: 「無制御交差点（Uncontrolled intersection）」とは何ですか？
  choices:
    A: 道路が直角に交わる交差点。
    B: 信号機が故障している交差点。
    C: 交通信号や標識がない交差点。
    D: 交通量が非常に多い交差点。
  answer: C
  explanation: 無制御交差点とは、交通信号や標識が設置されていない交差点のことです。
- id: 264
  category: vehicle_information
  question: 「アンダーステア（Understeer）」とは何ですか？
  choices:
    A: 車両がドライバーの意図よりも大きく曲がってしまうこと。
    B: 車両がドライバーの意図したほど曲がらないこと。
    C: 車両の左右の揺れのこと。
    D: タイヤの空気圧が急激に失われること。
  answer: B
  explanation: アンダーステアは、車両がドライバーの意図したほど曲がらない場合に発生します。
- id: 265
  category: vehicle_information
  question: 車両特性において「ヨー（Yaw）」は何を指しますか？
  choices:
    A: 車両の上下の動き。
    B: 車両の左右の揺れ（旋回運動）。
    C: 急ブレーキ時の車両の前方への沈み込み。
    D: トラクションの喪失による横滑り。
  answer: B
  explanation: ヨー（Yaw）は、車両の左右の揺れ（垂直軸を中心とした回転運動）と定義されています。
- id: 266
  category: vehicle_information
  question: '「車両安全技術（VST: Vehicle Safety Technology）」とは何ですか？'
  choices:
    A: 車両の所有権を証明する公式書類。
    B: 衝突による損害や負傷の支払いを支援する保険。
    C: センサーやカメラを使用して、安全な運転のために介入、警告、または支援を行う車両機能。
    D: 視力の良さを確認するための検査。
  answer: C
  explanation: 車両安全技術（VST）とは、センサーやカメラを使用して、安全な運転を介入、警告、または支援する車両の機能のことを指します。
- id: 267
  category: license_system
  question: DOL（運転免許局）から英語以外の言語での支援が必要な場合、誰に連絡すべきですか？
  choices:
    A: ADAコンプライアンス・マネージャー
    B: 公民権コンプライアンス・コーディネーター
    C: 言語アクセス（Language Access）チーム
    D: 車両登録事務所
  answer: C
  explanation: 英語以外の言語での支援が必要な場合は、言語アクセスチーム（languageaccess@dol.wa.gov）に連絡してください。
- id: 268
  category: driver_responsibility
  question: ワシントン州ドライバーガイドは、法廷で法的根拠として使用できますか？
  choices:
    A: はい、交通法規の主要な法的根拠です。
    B: はい、ただし民事請求に限ります。
    C: いいえ、これは法的根拠ではなく、法的請求の根拠として使用することはできません。
    D: いいえ、裁判官によって事前に承認されない限り使用できません。
  answer: C
  explanation: ワシントン州ドライバーガイドは法的根拠ではなく、法廷での使用を意図したものではありません。法的請求や訴訟の根拠として使用することはできません。
- id: 269
  category: driver_responsibility
  question: 市町村の交通規制と州法の関係はどうなっていますか？
  choices:
    A: 市長の承認があれば、市の規制は州法と矛盾してもよい。
    B: 市の規制は州法を補完（上回る規定を）できるが、州法と矛盾してはならない。
    C: 州法は常に市の規制を完全に置き換える。
    D: 市の規制は単なる提案であり、強制力はない。
  answer: B
  explanation: 市町村や郡の交通規制は、州法を補完する内容を含むことができますが、州法と矛盾することはできません。
- id: 270
  category: defensive_driving
  question: 「ビジュアルサーチ（Visual search）」とは何ですか？
  choices:
    A: 視力の良さや目の健康状態を確認する検査。
    B: 現在または潜在的な危険を意図的に探すこと。
    C: 意図を示すために方向指示器を使用すること。
    D: 旅行のルートを計画すること。
  answer: B
  explanation: ビジュアルサーチとは、現在または潜在的な危険を意図的に探すことと定義されています。
- id: 271
  category: license_system
  question: 車両証明書、タブ（更新ステッカー）、および登録に関するサポートが必要な場合は、どこへ行くべきですか？
  choices:
    A: 一般的な交差点
    B: ADA（障害を持つアメリカ人法）コンプライアンス・マネージャー
    C: 車両免許事務所（Vehicle licensing office）
    D: ツイン・レジストリ（双子登録所）
  answer: C
  explanation: 車両免許事務所は、車両証明書、タブ、および登録に関する手続きを行う場所です。
- id: 272
  category: signs_and_signals
  question: 「交通規制装置（Traffic control devices）」とは何ですか？
  choices:
    A: 交通を規制するために使用される標識、信号、および路面標示。
    B: 道路上で車両がどのように走行すべきかを規定する規則。
    C: 車両の前後にある点滅するライト。
    D: 道路で許可されている法定最高速度。
  answer: A
  explanation: 交通規制装置とは、交通を規制するために使用される標識、信号、および路面標示のことです。
- id: 273
  category: driver_responsibility
  question: ワシントン州における自動車の運転および運転免許に関する具体的な法律を確認したい場合、何を参照すべきですか？
  choices:
    A: ワシントン州ドライバーガイド
    B: 1964年公民権法第6編（Title VI）
    C: Title 46 RCW, Motor Vehicles（ワシントン州改訂法第46編「自動車」）
    D: 車両安全技術マニュアル
  answer: C
  explanation: 自動車の運転および運転免許に関する具体的な法律に関心がある場合は、Title 46 RCW, Motor Vehicles（ワシントン州改訂法第46編「自動車」）を参照してください。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行して注意深く進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形のSTOP（一時停止）標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に交通状況と歩行者を確認してください。
  id: 274
- image: yield.png
  category: signs_and_signals
  question: この標識はどのような行動を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通の流れに合流する
    C: 徐行し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形のYIELD（譲れ）標識は、徐行し、他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 275
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路に進入してはならない
    D: この先行き止まり
  answer: C
  explanation: 赤と白のDO NOT ENTER（進入禁止）標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや、進入すると対向車の進路に入ってしまう一方通行の道路で見られます。
  id: 276
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意して運転を続ける
    C: 停止して後退するか、向きを変える — あなたは逆走しています
    D: 素早くそのエリアから出るために加速する
  answer: C
  explanation: 赤と白のWRONG WAY（逆走）標識は、一方通行の道路や高速道路のランプを逆走していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 277
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方の方向（左方向）にのみ流れている
    C: 中央分離帯の左側を走行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒のONE WAY（一方通行）標識は、この通りの交通が矢印の指す一方向にのみ移動することを示しています。
  id: 278
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、その場所でのUターンが禁止されていることを意味します。
  id: 279
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点で左折が許可されていないことを意味します。
  id: 280
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 転回禁止（Uターン禁止）
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、その場所での右折が禁止されていることを意味します。
  id: 281
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道幅減少
    B: この区間では他車を追い越してはいけない
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 白黒のペナント型（三角形）の「NO PASSING ZONE（追い越し禁止区間）」標識は、このエリアで他車を追い越すことが禁止されていることを意味します。これは追い越し禁止区間の始まりを示します。
  id: 282
- image: keep_right.png
  category: signs_and_signals
  question: この標識はドライバーに何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線終了
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 283
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限標識は、理想的な条件下でのそのエリアの法定最高速度を示します。
  id: 284
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはサファリパークがある
    B: このエリアではシカが頻繁に道路を横断する
    C: この先、狩猟区域
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色いひし形の標識は、このエリアでシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 285
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーン
    B: この先、歩行者横断あり
    C: 近くにハイキングコースがある
    D: この先、バス停あり
  answer: B
  explanation: 歩行者の姿が描かれた黄色いひし形の標識は、この先に歩行者横断歩道があることを警告しています。道路を横断する歩行者のために停止できるよう準備してください。
  id: 286
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 287
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い円形の標識は何を警告していますか？
  choices:
    A: この先、環状交差点（ラウンドアバウト）
    B: 病院区域
    C: この先、踏切あり
    D: 追い越し禁止区間
  answer: C
  explanation: 黒いXと2つのRが描かれた黄色い円形の標識は、この先に踏切があることを知らせる事前警告標識です。速度を落とし、列車の目視確認と音の確認を行ってください。
  id: 288
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の鉄道クロスバック標識は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 289
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先、行き止まり
    B: 右折必須
    C: この先、右カーブ
    D: この先、回り道（デツアー）
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先の道路にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 290
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大きな減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（矢印の角度が急なもの）は、通常のカーブ標識よりも急な曲がり角であることを示しています。このカーブの手前では、より大幅に速度を落とす必要があります。
  id: 291
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 曲がりくねった道
    B: この先に1つのカーブがある
    C: 反対方向への2つの連続するカーブ
    D: この先にラウンドアバウト（環状交差点）がある
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路がまず一方に曲がり、次に反対側に曲がることに備えてください。
  id: 292
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角
    D: この先に坂道がある
  answer: C
  explanation: 屈曲あり（ワインディングロード）の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、道路状況の変化に注意してください。
  id: 293
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 中央分離帯のある道路の始まり
    D: 道路が1車線に狭まること
  answer: B
  explanation: 黄色のひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 294
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先に橋がある
    B: この先で道幅が狭くなる
    C: 車線の終了
    D: 中央分離帯のある道路の終了
  answer: B
  explanation: この警戒標識は、この先の道幅が狭くなることを示しています。道幅が狭くなることに備え、車線内の位置を調整してください。
  id: 295
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線と分離された道路（分断ハイウェイ）になることを警告しています。右側を通行してください。
  id: 296
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: 中央分離帯のある道路が終わり、対面通行に戻る
    C: この先に合流地点がある
    D: この先で道路工事が行われている
  answer: B
  explanation: この標識は、中央分離帯のある道路が終了することを警告しています。対向車線が中央分離帯で区切られなくなります。対面通行に備えてください。
  id: 297
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 中央分離帯のある道路の始まり
    B: この先に追い越し区間がある
    C: この先対面通行 — 交通が双方向に流れる
    D: この先で車線が移動する
  answer: C
  explanation: この標識は、この先が対面通行であることを警告しています。一方通行の道路や中央分離帯のある道路から出て、反対方向に進む車両と遭遇する可能性があります。
  id: 298
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 路面の凍結
    B: 濡れている時に滑りやすくなる
    C: この先に曲がりくねった道がある
    D: 路面の凹凸
  answer: B
  explanation: 「スリップ注意（濡れている時）」の標識は、雨などで路面が濡れている時に非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 299
- image: hill.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 路面の隆起
    B: 路面の凹凸
    C: この先に急な坂道や勾配がある
    D: 道路工事
  answer: C
  explanation: この標識は、この先に急な坂道や勾配があることを警告しています。特にトラックや牽引車の場合は、速度を調整し、低いギアにシフトする必要があるかもしれません。
  id: 300
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: この先に一時停止の標識がある
    B: この先に信号機がある
    C: 学校の横断歩道がある
    D: 検問所がある
  answer: B
  explanation: この標識はこの先に信号機があることを警告しています。信号が赤や黄色の場合は停止できるよう準備してください。この標識は、遠くから信号機が見えにくい場所に設置されることが多いです。
  id: 301
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 譲れ（前方優先道路）の標識
    B: 信号機
    C: 必ず停止しなければならない一時停止の標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識はこの先に一時停止の標識があることを警告しています。減速を開始し、一時停止の標識で完全に停止できるよう準備してください。
  id: 302
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: この先に踏切がある
    B: この先に十字路または交差点がある
    C: この先に病院がある
    D: 歩行者用横断歩道がある
  answer: B
  explanation: この標識は、この先に十字路または四差路の交差点があることを警告しています。脇道から進入してくる車両に注意してください。
  id: 303
- image: side_road.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: この先にT字路がある
    B: 右側から合流する脇道がある
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から脇道が合流していることを警告しています。脇道から幹線道路に進入してくる車両に注意してください。
  id: 304
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流している
    B: 車線が減少している
    C: 新しい車線が追加される（合流の必要なし）
    D: 右折が必要
  answer: C
  explanation: 「車線増設」の標識は、合流の必要なく新しい車線が道路に加わることを意味します。ランプ（接続路）から進入する車両には、専用の新しい車線が用意されています。
  id: 305
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: いかなる時の停車も禁止
    B: この区域での駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」の標識は、この区域に車両を駐車できないことを意味します。乗客の乗り降りのために短時間停車することは可能です。
  id: 306
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者専用の駐車スペースであることを示しています。有効な障害者用駐車許可証またはライセンスプレート（ナンバープレート）を掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 307
