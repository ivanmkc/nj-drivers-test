  choices:
    A: 警告を受ける。
    B: 逮捕され、車両が押収（インパウンド）される可能性がある。
    C: 車両が永久に没収される。
    D: 直ちに運転免許試験の再受験を求められる。
  answer: B
  explanation: 義務に従わない場合、運転免許は停止されます。免許停止中に運転して捕まった場合、逮捕されたり、車両が押収されたりする可能性があります。
- id: 74
  category: license_system
  question: 免許局（DOL）が発行する写真付き身分証明書を取得できるのは誰ですか？
  choices:
    A: 18歳以上の個人のみ。
    B: 筆記試験に合格した個人のみ。
    C: 年齢を問わず、運転をしない人。
    D: 運転免許が停止されている個人のみ。
  answer: C
  explanation: マニュアルには「年齢を問わず、運転をしない人に写真付き身分証明書を発行します」と記載されています。
- id: 75
  category: driver_responsibility
  question: ワシントン州において、1回の衝突事故で必要な対物賠償責任保険の最低額はいくらですか？
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: 1回の衝突事故につき、他人の財産の損害または破壊に対して10,000ドル以上を支払う自動車賠償責任保険に加入している必要があります。
- id: 76
  category: driver_responsibility
  question: 次の車両のうち、州の賠償責任保険の義務が免除されているのはどれですか？
  choices:
    A: 1993年以降に製造された乗用車
    B: モペッド（原動機付自転車）
    C: スポーツ用多目的車（SUV）
    D: 商業用配送バン
  answer: B
  explanation: 政府車両、モペッド、および一般運送業者または契約運送業者の車両の運転者は、この保険義務を免除されます。
- id: 77
  category: vehicle_information
  question: ワシントン州における法律上のタイヤの溝の最小の深さはどれくらいですか？
  choices:
    A: 1/32インチ
    B: 2/32インチ
    C: 3/32インチ
    D: 4/32インチ
  answer: B
  explanation: 1セント硬貨（ペニー）を使って確認した際、溝がリンカーンの頭（2/32インチ）まで届かない場合、そのタイヤは違法かつ危険であり、交換する必要があります。
- id: 78
  category: vehicle_information
  question: タイヤの空気圧をチェックするのに最適な時期はいつですか？
  choices:
    A: 高速道路を走行した直後
    B: タイヤが冷えているとき
    C: 1日の中で最も暑い時間帯
    D: タイヤを触って温かいと感じるとき
  answer: B
  explanation: マニュアルでは、タイヤが冷えているときに空気圧計でタイヤの空気圧をチェックすることを推奨しています。
- id: 79
  category: vehicle_information
  question: 走行中に車両のイグニッションを「ロック（LOCK）」の位置に回してはいけないのはなぜですか？
  choices:
    A: エンジンがオーバーヒートするため。
    B: 車両のバッテリーが消耗するため。
    C: ステアリング（ハンドル）がロックされ、制御不能になるため。
    D: トランスミッションに永久的な損傷を与えるため。
  answer: C
  explanation: 走行中にイグニッションを「ロック」の位置に回すと、ハンドルを切ろうとした際にステアリングがロックされ、車両の制御ができなくなります。
- id: 80
  category: vehicle_information
  question: 排気漏れのある排気システムの潜在的な危険性は何ですか？
  choices:
    A: フロントガラスが曇る原因になる。
    B: 非常に短時間で車内の人を死に至らしめる可能性がある。
    C: ハンドルが振動する原因になる。
    D: タイヤがパンクする可能性が高まる。
  answer: B
  explanation: 排気漏れによるガスは、非常に短時間で車内の人を死に至らしめる可能性があります。閉め切ったガレージでエンジンをかけたままにしてはいけません。
- id: 81
  category: vehicle_information
  question: 1993年以降に製造された乗用車には、何を備えることが義務付けられていますか？
  choices:
    A: 車両中央の高い位置に設置された第3のブレーキ灯（ハイマウントストップランプ）。
    B: リアウィンドウとヘッドライトのワイパー。
    C: バックカメラシステム。
    D: 自動緊急ブレーキ。
  answer: A
  explanation: 1993年以降に製造されたトラック、乗用車、バン、スポーツ用多目的車（SUV）には、車両中央の高い位置に第3のブレーキ灯（ハイマウントストップランプ）を設置しなければなりません。
- id: 82
  category: vehicle_information
  question: 段差を越えた後や停車した後に車が揺れ続ける場合、どのシステムを整備士に点検してもらう必要がありますか？
  choices:
    A: ブレーキシステム
    B: ステアリングシステム
    C: サスペンションシステム
    D: 排気システム
  answer: C
  explanation: 段差を越えた後や停車した後に車が揺れ続けたり、コントロールが困難だったりする場合は、ショックアブソーバーやサスペンション部品の交換が必要な可能性があるため、整備士に点検してもらう必要があります。
- id: 83
  category: safe_driving_rules
  question: 車両やトレーラーの積載物が法的に「安全に固定されている」とみなされるのはどのような時ですか？
  choices:
    A: 少なくとも1本のロープで縛られている時。
    B: 積載物が滑ったり、動いたり、落下したり、路面にこぼれたり、空中に飛び出したりする恐れがない時。
    C: 積載物が動く可能性があっても、防水シート（タープ）で覆われている時。
    D: 車両が時速40マイル（約64km/h）未満で走行している時。
  answer: B
  explanation: 積載物はしっかりと固定されていなければならず、滑ったり、動いたり、落下したり、路面にこぼれたり、空中に飛び出したりする恐れがない場合にのみ、安全に固定されているとみなされます。
- id: 84
  category: penalties_and_points
  question: 「マリア法（Maria's Law）」に基づき、積載物の固定不備により負傷者や死者を出した場合の最大罰則は何ですか？
  choices:
    A: 500ドルの罰金と免許停止
    B: 軽罪（misdemeanor）の起訴と30日間の拘留
    C: 重軽罪（gross misdemeanor）の起訴、最大1年間の禁錮、および5,000ドルの罰金
    D: 重罪（felony）の起訴と最大5年間の禁錮
  answer: C
  explanation: 積載物の固定不備により負傷や死亡事故を引き起こした者は、重軽罪（gross misdemeanor）に問われ、最大1年間の禁錮および5,000ドルの罰金が科せられる可能性があります。
- id: 85
  category: penalties_and_points
  question: 固定されていない積載物が物損事故を引き起こした場合、運転者はどのような罪に問われる可能性がありますか？
  choices:
    A: 交通違反（traffic infraction）
    B: 軽罪（misdemeanor）
    C: 重軽罪（gross misdemeanor）
    D: 重罪（felony）
  answer: B
  explanation: 固定されていない積載物が物損事故を引き起こした場合、運転者は軽罪（misdemeanor）に問われる可能性があります。
- id: 86
  category: defensive_driving
  question: 積載物が固定されていない状態で走行している車両を見かけた場合、どうすべきですか？
  choices:
    A: 相手が停車するまで継続的にクラクションを鳴らす。
    B: 運転者に警告するために、その車両のすぐ横に並ぶ。
    C: できるだけ距離を置き、安全な時に911に通報する。
    D: 相手の注意を引くためにハイビームを点滅させる。
  answer: C
  explanation: 積載物が固定されていない状態で走行している車両を見かけた場合は、できるだけ距離を置き、安全が確保できた時点で911に通報してください。
- id: 87
  category: vehicle_information
  question: タイヤのバランスが崩れていたり、空気圧が低かったりする状態で走行すると、どのような結果を招きますか？
  choices:
    A: 燃費が悪化し、ハンドリングやブレーキの効きが悪くなる。
    B: エンジンの出力が低下し、エンストの原因となる。
    C: 濡れた路面でのトラクション（駆動力）が向上する。
    D: 排気システムが過熱する原因となる。
  answer: A
  explanation: タイヤのバランス不良や空気圧不足は、タイヤの摩耗を早め、燃費を悪化させ、車両の操縦や停止を困難にします。
- id: 88
  category: driver_responsibility
  question: マニュアルによると、高速道路のゴミの何パーセントが固定不備の積載物によるものですか？
  choices:
    A: 20%
    B: 30%
    C: 40%
    D: 50%
  answer: C
  explanation: ワシントン州環境局（Department of Ecology）によると、高速道路のゴミの約40%は固定不備の積載物によるものであり、これが年間数百件の事故の原因となっています。
- id: 89
  category: penalties_and_points
  question: ワシントン州において、積載物を固定せずに走行した場合の最大罰則は何ですか？
  choices:
    A: 6ヶ月の禁錮と1,000ドルの罰金
    B: 1年間の禁錮と5,000ドルの罰金
    C: 2年間の禁錮と10,000ドルの罰金
    D: 500ドルの罰金と30日間の免許停止
  answer: B
  explanation: マニュアルには、積載物を固定せずに走行した場合の最大罰則は、1年間の禁錮および5,000ドルの罰金であると記載されています。
- id: 90
  category: vehicle_information
  question: ヘッドライト、バックランプ、ブレーキランプ、テールランプのレンズに付着した汚れは、光量を最大でどの程度減少させますか？
  choices:
    A: 10パーセント
    B: 25パーセント
    C: 50パーセント
    D: 75パーセント
  answer: C
  explanation: マニュアルによると、レンズの汚れによって光量が50パーセント減少することがあります。
- id: 91
  category: safe_driving_rules
  question: 運転前に座席とハンドルを調整する際、両手の間にはハンドルの少なくともどれくらいの割合があるべきですか？
  choices:
    A: 4分の1
    B: 3分の1
    C: 2分の1
    D: 3分の2
  answer: B
  explanation: 全方向の視界が確保され、すべての操作系が手の届く範囲にあり、かつハンドルの少なくとも3分の1が両手の間にあるように調整する必要があります。
- id: 92
  category: safe_driving_rules
  question: 車両のエアバッグに対して、座席をどのように配置すべきですか？
  choices:
    A: エアバッグが顔に当たるように配置する
    B: エアバッグが胸に当たるように配置する
    C: エアバッグが頭の上で展開するように配置する
    D: エアバッグが腹部に当たるように配置する
  answer: B
  explanation: 衝突時にエアバッグが胸に当たるような位置に座る必要があります。
- id: 93
  category: vehicle_information
  question: 後方の交通状況を最もよく確認するために、サイドミラーをどのように調整すべきですか？
  choices:
    A: 自車のどの部分も見えないように調整する
    B: 深く座った状態で、自車の側面全体が見えるように調整する
    C: 少し前かがみになったときに、自車の側面がわずかに見えるように調整する
    D: 後輪のすぐ後ろの地面を直接指すように調整する
  answer: C
  explanation: 少し前かがみになったときに自車の側面がわずかに見えるようにサイドミラーを調整します。これにより、後方の交通状況を確認しやすくなります。
- id: 94
  category: penalties_and_points
  question: 17歳の同乗者がシートベルトを着用していないのが見つかった場合、罰金を支払う責任は誰にありますか？
  choices:
    A: 車両の運転者
    B: 17歳の同乗者
    C: 同乗者の保護者
    D: 運転者と同乗者の両方
  answer: B
  explanation: 16歳以上の同乗者は、シートベルトを着用する責任があり、違反した場合は罰金を支払う責任があります。
- id: 95
  category: driver_responsibility
  question: 運転者は、以下のどの同乗者がシートベルトを着用していない場合に、違反切符を切られ罰金を科される可能性がありますか？
  choices:
    A: 12歳未満の同乗者のみ
    B: 16歳未満の同乗者のみ
    C: 助手席に座っている同乗者のみ
    D: 年齢に関わらずすべての同乗者
  answer: B
  explanation: 16歳未満の同乗者がシートベルトを適切に着用していない、または子供用補助拘束装置で固定されていない場合、運転者に罰金が科されます。
- id: 96
  category: safe_driving_rules
  question: 車両の腰ベルト（ラップベルト）を着用する正しい方法は何ですか？
  choices:
    A: 腹部を横切るように締める
    B: 腹部の下の腰骨を横切るように締める
    C: 太ももの上に緩く締める
    D: 腕の下に挟み込む
  answer: B
  explanation: 安全性を最大限に高めるための正しい着用方法は、腰ベルトを腹部の下の腰骨を横切るように調整することです。
- id: 97
  category: safe_driving_rules
  question: ワシントン州の法律では、子供は何歳になるか、または身長が何フィート何インチになるまで子供用補助拘束装置（チャイルドシート）を使用しなければなりませんか？
  choices:
    A: 6歳の誕生日、または身長4フィート5インチまで
    B: 8歳の誕生日、または身長4フィート9インチまで
    C: 10歳の誕生日、または身長5フィート0インチまで
    D: 12歳の誕生日、または身長4フィート9インチまで
  answer: B
  explanation: 8歳の誕生日を迎えるまでの子供は、身長が4フィート9インチ（約145cm）に達していない限り（どちらか早い方まで）、子供用補助拘束装置を使用しなければなりません。
- id: 98
  category: safe_driving_rules
  question: ワシントン州の子供用拘束具に関する法律によると、何歳未満の子供は、可能な限り後部座席に乗せるべきですか？
  choices:
    A: 8歳未満
    B: 10歳未満
    C: 12歳未満
    D: 13歳未満
  answer: D
  explanation: ワシントン州の子供用拘束具に関する法律では、13歳未満の子供は、可能な限り後部座席に乗せることが義務付けられています。
- id: 99
  category: vehicle_information
  question: 衝撃を吸収し、子供と一緒に動くことで、脆弱な首や脊髄への負担を軽減するため、幼い子供にとって最適な座席とされるのはどのタイプの子供用補助拘束装置ですか？
  choices:
    A: 前向きチャイルドシート
    B: ジュニアシート（ブースターシート）
    C: 後ろ向きチャイルドシート
    D: 標準のシートベルト
  answer: C
  explanation: 後ろ向きチャイルドシートは、幼い子供にとって最適な座席です。衝突時に子供を包み込むように保持し、子供と一緒に動くハーネスを備えているため、脆弱な首や脊髄への負担を軽減します。
- id: 100
  category: license_system
  question: 中級運転免許（Intermediate Driver License）または仮免許（Learner Permit）を持つティーンエイジャーの無線機器の使用に関する規則は何ですか？
  choices:
    A: 運転中はハンズフリー機器のみ使用できる。
    B: 緊急事態を報告する場合を除き、運転中は無線機器を一切使用できない。
    C: 赤信号で停止している間はテキストメッセージを送信できる。
    D: 一人で運転している場合は、手持ちの携帯電話を使用できる。
  answer: B
  explanation: 中級運転免許または仮免許を持つティーンエイジャーは、緊急事態を報告する場合を除き、ハンズフリー機器を含め、運転中に無線機器を一切使用することはできません。
- id: 101
  category: defensive_driving
  question: マニュアルによると、ハンズフリー機器は手持ち機器と比較してどのような安全上の利点がありますか？
  choices:
    A: 衝突のリスクを50パーセント軽減する。
    B: ドライバーが道路に完全に視覚を集中させることができる。
    C: 安全上の利点はない。
    D: 交通渋滞の中では完全に安全に使用できる。
  answer: C
  explanation: マニュアルには明示的に次のように記載されています。「ハンズフリー機器には安全上の利点はありません。携帯電話を置いておく（使用しない）ことが、唯一の安全な運転方法です。」
- id: 102
  category: penalties_and_points
  question: ワシントン州の乗員保護法（Occupant Protection law）は「一次取り締まり（primary enforcement）」法です。これは何を意味しますか？
  choices:
    A: 警察官は初犯に対して警告のみを行うことができる。
    B: 警察官は、シートベルトを着用していないという理由だけで、車を停止させ、違反切符を発行することができる。
    C: 警察官は、シートベルト違反で切符を切る前に、他の交通違反を確認しなければならない。
    D: 車両の主運転者のみが処罰の対象となる。
  answer: B
  explanation: ワシントン州の乗員保護法は「一次取り締まり」法です。つまり、法執行官は、運転者または同乗者がシートベルトを着用していないのを見かけた場合、それだけで車を停止させ、違反切符を発行することができます。
- id: 103
  category: safe_driving_rules
  question: 視界を遮ったり、車両の操作を妨げたりする場合、前部座席に座ることが許可される最大人数は何人ですか？
  choices:
    A: 2人
    B: 3人
    C: 4人
    D: 制限はない
  answer: B
  explanation: マニュアルには次のように記載されています。「視界を遮ったり、車両の操作を妨げたりする場合、前部座席に3人を超えて乗せて運転してはなりません。」
- id: 104
  category: safe_driving_rules
  question: 仮免許（permit）を持つ運転者が、運転中に無線機器を使用できるのはどのような状況ですか？
  choices:
    A: ハンズフリー機器を使用しているとき。
    B: 緊急事態を通報するときのみ。
    C: 緊急ではない理由で路肩に停車しているとき。
    D: 赤信号で停止しているとき。
  answer: B
  explanation: マニュアルには、仮免許を持つ運転者は、緊急事態を通報する場合を除き、ハンズフリー機器を含め、運転中に無線機器を一切使用してはならないと記載されています。
- id: 105
  category: signs_and_signals
  question: 信号機が作動していない交差点に近づいた場合、どうすべきですか？
  choices:
    A: 減速し、注意して進む。
    B: 停止せずに、右側の車両に道を譲る。
    C: 完全に停止し、4方向一時停止（four-way stop）の交差点であるかのように道を譲る。
    D: 警察官が到着するのを待ってから進む。
  answer: C
  explanation: 信号機が作動していない場合は、完全に停止し、4方向一時停止の交差点であるかのように交通に道を譲らなければなりません。
- id: 106
  category: signs_and_signals
  question: 黄色の点灯信号は何を示していますか？
  choices:
    A: 信号が赤に変わろうとしており、安全に停止できる場合は停止しなければならない。
    B: 信号が赤になる前に交差点を通過するために加速すべきである。
    C: 周囲の交通状況に関わらず、直ちに完全に停止しなければならない。
    D: 左折が保護されており、優先権がある。
  answer: A
  explanation: 黄色の点灯信号は、信号が赤に変わろうとしていることを意味します。安全に停止できる場合は停止しなければなりません。
- id: 107
  category: signs_and_signals
  question: 黄色の矢印の点滅は何を意味しますか？
  choices:
    A: 左折は禁止されている。
    B: 左折は可能だが、対向車、自転車、歩行者に道を譲らなければならない。
    C: 左折が保護されており、対向車は停止しなければならない。
    D: 信号機が故障しており、4方向一時停止として扱わなければならない。
  answer: B
  explanation: 黄色の矢印の点滅は、左折が可能であることを意味しますが、自転車や歩行者を含む対向車に道を譲らなければなりません。
- id: 108
  category: safe_driving_rules
  question: 赤の点灯信号で左折することが合法となるのはどのような場合ですか？
  choices:
    A: 対向車がいないときはいつでも。
    B: 一方通行の道路から二方向通行の道路に曲がる場合のみ。
    C: 完全に停止した後、左方向に進行する一方通行の道路に曲がる際、禁止する標識がない場合。
    D: 赤信号で左折することは決して合法ではない。
  answer: C
  explanation: 赤信号での右左折禁止の標識がない場合、完全に停止した後、左方向に進行する一方通行の道路へ左折することができます。
- id: 109
  category: sharing_the_road
  question: 右左折する際、自車の前を横断する歩行者や自転車のために停止しなければならないのはいつですか？
  choices:
    A: 標識のある横断歩道内にいる場合のみ。
    B: 道路の自車線側半分、またはそこから1車線以内にいる場合。
    C: 歩行者用信号が「横断可」の場合のみ。
    D: 距離に関わらず、道路上のどこかにいる場合。
  answer: B
  explanation: 歩行者や自転車が道路の自車線側半分、またはそこから1車線以内にいる場合は、停止しなければなりません。
- id: 110
  category: signs_and_signals
  question: 警戒標識（warning signs）は通常どのような形をしていますか？
  choices:
    A: 正方形で白地に黒の文字。
    B: 円形で黄色に「X」の記号。
    C: ひし形で黄色に黒の文字または記号。
    D: 長方形でオレンジ色に黒の文字。
  answer: C
  explanation: 警戒標識は通常、黄色に黒の文字または記号が描かれており、そのほとんどがひし形をしています。
- id: 111
  category: safe_driving_rules
  question: 100両編成の列車が完全に停止するまで、およそどのくらいの距離が必要ですか？
  choices:
    A: 4分の1マイル
    B: 2分の1マイル
    C: 最大1マイル
    D: 2マイル
  answer: C
  explanation: 列車は巨大であり、見た目よりも速く移動している場合があります。100両編成の列車が完全に停止するには、最大1マイル（約1.6km）かかることがあります。
- id: 112
  category: signs_and_signals
  question: 踏切にある白いX字型の「クロスバック（crossbuck）」標識は何を意味していますか？
  choices:
    A: 「譲れ（Yield）」の標識と同じ意味を持つ
    B: 義務的な一時停止を示す
    C: この先に複数の線路があることを警告している
    D: 踏切が現在通行止めであることを意味する
  answer: A
  explanation: 踏切に設置されている「Railroad Crossing」と書かれた白いX字型の標識（クロスバック）は、「譲れ（Yield）」の標識と同じ意味を持ちます。
- id: 113
  category: safe_driving_rules
  question: 踏切内で車両が故障し、列車が近づいていない場合、まず最初にすべきことは何ですか？
  choices:
    A: 自分で車両を線路外へ押そうとする
    B: すぐに911に通報する
    C: 踏切にある青い標識に記載されている番号を使い、緊急通知システム（ENS）に電話する
    D: 線路に沿って歩き、列車が来ないか確認する
  answer: C
  explanation: 踏切内で車両が動けなくなった場合は、直ちに緊急通知システム（ENS）に連絡してください。電話番号は、踏切の遮断機付近にある青い標識に記載されています。
- id: 114
  category: vehicle_information
  question: 車両の後部にある反射材付きのオレンジ色の三角形は何を示していますか？
  choices:
    A: 危険物を運搬している
    B: 時速25マイル未満で走行している
    C: 緊急車両である
    D: 故障してレッカー車を待っている
  answer: B
  explanation: 車両の後部にある反射材付きのオレンジ色の三角形は、その車両が時速25マイル未満で走行していることを意味します。これは「低速車両（Slow
    Moving Vehicle）」標識として知られています。
- id: 115
  category: penalties_and_points
  question: 作業員がいる工事区間での交通違反（走行中の違反）の罰金はどうなりますか？
  choices:
    A: 半分に減額される
    B: 通常の違反と同じままである
    C: 2倍になる
    D: 自動的に免許停止となる
  answer: C
  explanation: 作業員がいる工事区間での交通違反に対する罰金は2倍になります。
- id: 116
  category: signs_and_signals
  question: 規制標識（Regulatory signs）の目的は何ですか？
  choices:
    A: 前方の急カーブや危険を運転者に警告するため
    B: 通行方向、車線利用、速度、駐車に関する規則の情報を提供するため
    C: ガソリンスタンドや飲食店などのサービス施設がある場所を示すため
    D: 道路上または道路付近で作業が行われていることを警告するため
  answer: B
  explanation: 規制標識は、通行方向、車線利用、右左折、速度、駐車、およびその他の特別な状況に関する規則についての情報を提供します。
- id: 117
  category: safe_driving_rules
  question: 掲示されている最高速度制限（Maximum speed limit）で走行すべきなのはどのような時ですか？
  choices:
    A: 渋滞を防ぐため、常にその速度で走行すべきである
    B: 理想的な運転条件（路面状況や視界が良い時）においてのみ
    C: 左側車線を走行している時のみ
    D: 緊急事態で遅れている時はいつでも
  answer: B
  explanation: 最高速度制限は、理想的な運転条件においてのみ適用されるべき速度です。状況に応じて速度を落とす必要があります。
- id: 118
  category: signs_and_signals
  question: 可変速度制限標識（Variable Speed Limit Signs）の主な機能は何ですか？
  choices:
    A: 高速道路の速度制限を恒久的に変更すること
    B: 前方の渋滞を警告し、交通の流れを均一化すること
    C: 通過する車両の現在の速度を表示すること
    D: 高速道路を走行するために必要な最低速度を示すこと
  answer: B
  explanation: 可変速度制限標識は、交通の流れを均一化するために、前方の渋滞を運転者に警告し、状況に応じた速度制限を表示するデジタル標識です。
- id: 119
  category: penalties_and_points
  question: トラクション・アドバイザリー（路面状況警告）標識で義務付けられている場合に、チェーンを使用しなかった場合の罰則は何ですか？
  choices:
    A: 100ドル
    B: 250ドル
    C: 500ドル
    D: 1000ドル
  answer: C
  explanation: マニュアルによると、トラクション・アドバイザリー標識で義務付けられている際にチェーンを使用しなかった場合、500ドルの罰金が科せられます。
- id: 120
  category: signs_and_signals
  question: 三角形の「追い越し禁止（No Passing Zone）」標識はどのような外見で、どこに設置されていますか？
  choices:
    A: 赤と白で、道路の右側に設置されている
    B: 黄色またはオレンジ色で、道路の左側に設置されている
    C: 緑と白で、道路の左側に設置されている
    D: 黒と白で、道路の右側に設置されている
  answer: B
  explanation: マニュアルには、三角形の「追い越し禁止（No Passing Zone）」標識は黄色またはオレンジ色で、道路の左側に設置されると記載されています。
- id: 121
  category: penalties_and_points
  question: 必要な許可証やナンバープレートを掲示せずに、障害者用駐車スペースに駐車した場合の罰金はいくらですか？
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: B
  explanation: 必要な許可証やナンバープレートを掲示せずに障害者用スペースに駐車した場合、および専用スペースに隣接するアクセス通路を塞いだ場合には、250ドルの罰金が科せられます。
- id: 122
  category: safe_driving_rules
  question: 車線間の白の破線は何を意味していますか？
  choices:
    A: 安全であれば、車線変更のためにその線を越えてもよい。
    B: 特別な状況で必要とされない限り、現在の車線にとどまるべきである。
    C: 追い越し禁止区間に近づいている。
    D: 可逆車線を走行している。
  answer: A
  explanation: 車線間の白の破線は、安全であれば車線変更のためにその線を越えてもよいことを意味します。
- id: 123
  category: safe_driving_rules
  question: 対向車線との間に黄色の実線と破線の両方がある場合、どのような時に追い越しが許可されますか？
  choices:
    A: 黄色の実線が自分の側にある場合のみ。
    B: 破線が自分の側にある場合のみ。
    C: 対向車がいない時はいつでも。
    D: 実線がある場合は、追い越しは決して許可されない。
  answer: B
  explanation: 破線が自分の側にある場合は追い越しゾーンにいることを意味し、安全であれば追い越しが可能です。黄色の実線が自分の側にある場合は、追い越しをしてはいけません。
- id: 124
  category: sharing_the_road
  question: 赤信号で緑色の自転車ボックス（バイクボックス）がある交差点に近づく際、運転者はどうしなければなりませんか？
  choices:
    A: 自転車ボックスの中で停止する。
    B: 自転車ボックスが空であっても、その後方で停止する。
    C: 交差する交通を確認するために、自転車ボックスを通り抜ける。
    D: 自転車に道を譲るが、ボックスを越えて停止する。
  answer: B
  explanation: 運転者は（自転車ボックスが空であっても）自転車ボックスの後方で停止し、青信号を待たなければなりません。
- id: 125
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）を走行するための設計速度はどれくらいですか？
  choices:
    A: 10-15 mph
    B: 15-20 mph
    C: 20-25 mph
    D: 25-30 mph
  answer: B
  explanation: 交差点に近づく際は減速してください。ラウンドアバウトは時速15〜20マイル（15-20 mph）の速度で走行するように設計されています。
- id: 126
  category: signs_and_signals
  question: 可逆車線の上にある黄色の「X」の点灯は何を示していますか？
  choices:
    A: その車線は右左折専用である。
    B: その車線は追い越し専用として開放されている。
    C: 車線の運用が変更されるため、その車線から出る必要がある。
    D: 直ちに停止しなければならない。
  answer: C
  explanation: 黄色の「X」の点灯は、その車線の運用が変更されることを意味しており、安全が確認でき次第、速やかにその車線から出なければなりません。
- id: 127
  category: sharing_the_road
  question: マニュアルによると、横断歩道に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 横断歩道は白線で標示されている場所にのみ存在する。
    B: すべての交差点は、標示の有無にかかわらず、法的に横断歩道と定義されている。
    C: 歩行者は標示のない横断歩道では車両に道を譲らなければならない。
    D: 路面のライトが点滅している場合にのみ、道を譲る必要がある。
  answer: B
  explanation: すべての横断歩道に標示があるわけではありません。すべての交差点は、横断歩道の標示があるかどうかにかかわらず、法的に横断歩道と定義されています。
- id: 128
  category: signs_and_signals
  question: 「Yield（譲れ）」の標識の形と色は何ですか？
  choices:
    A: 白い文字が書かれた赤色の八角形の標識。
    B: 赤い円の中に白い水平線が入った正方形の標識。
    C: 赤と白の逆三角形（下向きの三角形）。
    D: 黒い文字が書かれた黄色の円形の標識。
  answer: C
  explanation: 「Yield（譲れ）」の標識は逆三角形（下向きの三角形）です。赤と白の配色で、赤い文字が書かれています。
- id: 129
  category: safe_driving_rules
  question: 可逆車線は通常、路面にどのように標示されていますか？
  choices:
    A: 白の実線
    B: 黄色の二重破線
    C: 白の単一破線
    D: 斜線（ハッチング）のある黄色の実線
  answer: B
  explanation: 可逆車線は、特定の時間帯には一方向に、別の時間帯には反対方向に交通を流すように設計されています。これらの車線は通常、黄色の二重破線で標示されています。
- id: 130
  category: signs_and_signals
  question: 頭上信号によって制御されている車線を走行中、黄色の「X」の点滅は何を示していますか？
  choices:
    A: その車線はすべての交通に対して閉鎖されている。
    B: その車線は右左折専用である。
    C: 車線の運用が変更されるため、車線から出る必要がある。
    D: その車線は高乗車人数車両（HOV）専用である。
  answer: B
  explanation: マニュアルによると、黄色の「X」の点滅は、その車線が右左折専用であることを意味します。
- id: 131
  category: safe_driving_rules
  question: 双方向左折車線（two-way left turn lane）を走行できる最大距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: マニュアルによると、双方向左折車線は追い越しには使用できず、300フィート（約90メートル）を超えて走行することはできません。
- id: 132
  category: safe_driving_rules
  question: 高速道路で出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 停車し、路肩を慎重に後退する。
    B: ギアをバックに入れ、走行車線を後退する。
    C: 中央分離帯を横切ってUターンする。
    D: 次の出口まで進むか、安全に転回できる場所まで行く。
  answer: D
  explanation: 曲がり角や出口を通り過ぎてしまった場合は、後退せず、次の曲がり角や出口、または安全に転回できる場所まで進んでください。路肩や高速道路で後退することは違法です。
- id: 133
  category: sharing_the_road
  question: 同じ方向に3車線以上ある道路で、合流や分岐が多い場合、どの車線を使用すべきですか？
  choices:
    A: 一番左側の車線
    B: 中央の走行車線
    C: 一番右側の車線
    D: 路肩
  answer: B
  explanation: 同じ方向に3車線以上ある道路で、合流や分岐が多い場合は、中央の走行車線を使用してください。
- id: 134
  category: safe_driving_rules
  question: 夜間に警察官に車を止められた際、警察官が車両に近づく前に何をすべきですか？
  choices:
    A: 車から降りて警察官に挨拶する。
    B: 車内のドームライト（室内灯）を点灯させる。
    C: グローブボックスに手を入れて登録証を取り出す。
    D: ヘッドライトを消し、ハザードランプを点灯させる。
  answer: B
  explanation: 暗い場合は、停車後、警察官が車両に近づく前に車内のドームライト（室内灯）を点灯させてください。
- id: 135
  category: penalties_and_points
  question: 緊急ゾーン（emergency zone）で作業員や財産を無謀に危険にさらした場合の罰則は何ですか？
  choices:
    A: 30日間の免許停止
    B: 60日間の免許停止
    C: 90日間の免許停止
    D: 永久的な運転免許の取消
  answer: B
  explanation: 緊急ゾーンで作業員や財産を無謀に危険にさらした人物の運転免許は、60日間の停止処分の対象となります。
- id: 136
  category: penalties_and_points
  question: 緊急ゾーンでの速度超過に対する交通違反の罰金はどうなりますか？
  choices:
    A: 初犯であれば免除される。
    B: 半分に減額される。
    C: 2倍になる。
    D: 3倍になる。
  answer: C
  explanation: 緊急ゾーンでの速度超過、または停車中の指定車両に対する不適切な追い越しに対して科される交通違反の罰金は、2倍になります。
- id: 137
  category: vehicle_information
  question: 片側3車線以上のアクセス制限道路において、一般的に左端の車線の使用が禁止されている車両はどれですか？
  choices:
    A: 3人以上の乗客を乗せている車両
    B: オートバイおよび自転車
    C: トレーラーを牽引している車両、または重量が10,000ポンドを超える車両
    D: ハイブリッド車および電気自動車
  answer: C
  explanation: 片側3車線以上のアクセス制限道路では、標識で別段の定めがない限り、トレーラーを牽引している車両または重量が10,000ポンドを超える車両は、左端の車線を使用してはなりません。
- id: 138
  category: safe_driving_rules
  question: ワシントン州で走行が許可されている海岸の砂浜を走行する際の最高速度制限はいくらですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: 走行が許可されている海岸の砂浜を走行する場合、速度制限は時速25マイル（25 mph）であり、歩行者と自転車が常に優先権を持ちます。
- id: 139
  category: safe_driving_rules
  question: 次の有料橋のうち、料金所で現金の支払いが可能なのはどれですか？
  choices:
    A: 州道520号線橋（両方向）
    B: 州道16号線タコマ・ナローズ橋（東行き）
    C: 州道520号線橋（西行きのみ）
    D: 州道16号線タコマ・ナローズ橋（西行き）
  answer: B
  explanation: 州道16号線（SR 16）タコマ・ナローズ橋には料金所のオプションがあり、東行きを走行する際にその場で現金を支払うことができます。
- id: 140
  category: penalties_and_points
  question: 自動交通安全カメラによる違反はどのように処理されますか？
  choices:
    A: 運転記録に点数が加算される走行中の違反として処理される
    B: 刑事上の軽罪として処理される
    C: 運転記録には含まれない駐車違反として処理される
    D: 制限速度を20マイル以上超過した場合は重罪として処理される
  answer: C
  explanation: これらの違反は運転記録には記載されず、最大250ドルの罰金を伴う駐車違反として処理されます。
- id: 141
  category: sharing_the_road
  question: フェリー待機車線で、すでに他の車両が並んでいる場合に遭遇したらどうすべきですか？
  choices:
    A: 予約がある場合は、列に割り込む。
    B: 列を通り過ぎて、ターミナル入り口付近で合流する。
    C: 安全に転回できる場所を見つけ、列の最後尾に並ぶ。
    D: 路肩に駐車し、ターミナルまで歩く。
  answer: C
  explanation: フェリー待機車線にすでに他の車両が並んでいる場合は、それらの車両の前に割り込んではいけません。安全に転回できる場所を見つけ、列の最後尾に並んでください。
- id: 142
  category: driver_responsibility
  question: 警察官に車を止められた際、運転免許証と車両登録証はいつ提示すべきですか？
  choices:
    A: 車を停止させた直後
    B: 警察官から要求された時のみ
    C: 車から降りた後
    D: エンジンを切る前
  answer: B
  explanation: 警察による停車要請中は、要求された場合にのみ、運転免許証および/または車両登録証を提示してください。
- id: 143
  category: safe_driving_rules
  question: 高占有有料（HOT）車線とは何ですか？
  choices:
    A: 緊急車両とレッカー車専用の車線
    B: バスとオートバイのみに制限された車線
    C: 通行料を支払うことを選択した単独運転者も利用できるHOV車線
    D: すべての車両が現金で通行料を支払わなければならない車線
  answer: C
  explanation: 高占有有料（HOT）車線およびエクスプレス有料車線は、相乗り車両用のHOV（高占有車両）車線ですが、通行料を支払うことを選択した単独運転者にも開放されています。
- id: 144
  category: safe_driving_rules
  question: 右折する際、曲がり始める前に左側に大きく膨らむのを避けるべきなのはなぜですか？
  choices:
    A: 歩行者が先に横断できるようにするため。
    B: 後続車のドライバーが、あなたが車線変更か左折をすると勘違いして、右側から追い越そうとする可能性があるため。
    C: 縁石から12インチ以内に留まることが法律で義務付けられているため。
    D: 対向車が見えやすくなるため。
  answer: B
  explanation: マニュアルには次のように記載されています。「右折時は、曲がり始める前に左側に大きく膨らむのを避けてください。大きく膨らむと、後続車のドライバーが、あなたが車線変更か左折をしようとしていると思い込み、右側から追い越そうとする可能性があります。」
- id: 145
  category: safe_driving_rules
  question: どのような状況でUターン（転回）をしてはいけませんか？
  choices:
    A: すべての複数車線の幹線道路。
    B: 住宅街の中。
    C: カーブや丘の頂上付近で、自分の車両が他の車から見えない場所。
    D: 信号機のある交差点。
  answer: C
  explanation: マニュアルによると、カーブや丘の頂上付近で、自分の車両が他の車から見えない場所では、Uターンをしてはいけません。
- id: 146
  category: vehicle_information
  question: 近隣用電気自動車（NEV）および中速電気自動車（MEV）は、一般的にどのような道路での走行が許可されていますか？
  choices:
    A: 制限速度が時速25マイル（25 mph）以下の道路のみ。
    B: 地元の法律で禁止されていない限り、制限速度が時速35マイル（35 mph）までの道路。
    C: すべての州道システム。
    D: 制限速度が時速50マイル（50 mph）までの道路。
  answer: B
  explanation: NEVまたはMEVを運転する人は、地元の法律で禁止されていない限り、制限速度が時速35マイル（35 mph）までの道路での走行が許可されています。サンファン郡のみ、時速45マイル（45
    mph）までの走行を許可しています。
- id: 147
  category: penalties_and_points
  question: 電気自動車用充電設備に接続されていない車両を、電気自動車用充電ステーションに駐車した場合の最低罰金はいくらですか？
  choices:
    A: $50
    B: $124
    C: $250
    D: $500
  answer: B
  explanation: 電気自動車用充電設備に接続されていない車両を電気自動車用充電ステーションに駐車することは駐車違反であり、最低124ドルの罰金が科せられます。
- id: 148
  category: sharing_the_road
  question: 優先権（Right-of-way）に関する法律について、正しい記述はどれですか？
  choices:
    A: 法律は、より大きな車両に優先権を与えている。
    B: 法律は、誰が譲らなければならないかを定めているが、誰かに優先権を与えるものではない。
    C: 歩行者は、横断歩道以外の場所を横断している場合でも、常に優先権を持つ。
    D: 自転車利用者は、常に自動車に優先権を譲らなければならない。
  answer: B
  explanation: マニュアルには明確に次のように記載されています。「法律は、誰が優先権を譲らなければならないかを定めていますが、誰かに優先権を与えるものではありません。」
- id: 149
  category: sharing_the_road
  question: 交差点で道路を横断している歩行者や自転車利用者のために、ドライバーはいつ停止しなければなりませんか？
  choices:
    A: 横断歩道に白線が引かれている場合のみ。
    B: 歩行者や自転車利用者が、ドライバー側の車線、またはその隣の車線内にいる場合。
    C: 歩行者がドライバーと目を合わせた場合のみ。
    D: 歩行者が歩道で待っている時。
  answer: B
  explanation: 歩行者や自転車利用者がドライバー側の車線、またはその隣の車線内にいる場合、ドライバーは停止しなければなりません。
- id: 150
  category: sharing_the_road
  question: 盲導犬を連れている、または白杖（白い杖）を持っている歩行者に遭遇した場合、どうすべきですか？
  choices:
    A: 自分の存在を知らせるために、軽くクラクションを鳴らす。
    B: 標識のある横断歩道にいる場合のみ、優先権を譲る。
    C: 絶対的な優先権を与え、クラクションを使用してはならない。
    D: ゆっくりと彼らの周りを通り過ぎる。
  answer: C
  explanation: 盲導犬などのサービスアニマルを連れている歩行者、または白杖を持っている歩行者は、絶対的な優先権を持ちます。歩行者やサービスアニマルを混乱させたり驚かせたりする可能性があるため、クラクションを使用してはいけません。
- id: 151
  category: safe_driving_rules
  question: 一時停止標識、譲れ（Yield）標識、または交通信号のない交差点では、運転者は誰に道を譲らなければなりませんか？
  choices:
    A: 左側から来る車両。
    B: 交差点内にいる車両、および右側から来る車両。
    C: 左折する車両のみ。
    D: 最も速く走行している車両。
  answer: B
  explanation: 一時停止標識、譲れ標識、または交通信号のない交差点では、運転者は交差点内にいる車両、および右側から来る車両に道を譲らなければなりません。
- id: 152
  category: safe_driving_rules
  question: 交差点内にいるときに、サイレンを鳴らし赤色灯を点滅させた緊急車両が接近してきた場合、どうすべきですか？
  choices:
    A: 直ちに交差点の真ん中で停止する。
    B: 交差点内の右端に寄せて停止する。
    C: 交差点を通り抜けてから、右側に寄せて停止する。
    D: 加速して交差点を抜け、そのまま走行を続ける。
  answer: C
  explanation: 交差点内にいる場合は、交差点を通り抜けてから道路の右端に寄せて停止し、緊急車両に道を譲ってください。
- id: 153
  category: sharing_the_road
  question: スクールバスが反対方向に走行しており、道路が以下の条件を満たす場合、赤色灯を点滅させて停車しているスクールバスのために停止する必要はありません：
  choices:
    A: 制限速度が時速35マイル（35 mph）以上である。
    B: 3車線以上の標示された車線がある。
    C: 住宅街の中にある。
    D: 指定された自転車専用レーンがある。
  answer: B
  explanation: 反対方向に走行している場合、道路に3車線以上の標示された車線があるか、中央分離帯で仕切られているか、物理的な障壁で仕切られていれば、赤色灯を点滅させて停車しているスクールバスのために停止する必要はありません。
- id: 154
  category: penalties_and_points
  question: 赤色灯を点滅させて停車中のスクールバスを追い越した場合の罰則は何ですか？
  choices:
    A: 初犯の場合は警告を受ける。
    B: 罰金が2倍になり、罰則の免除、減額、または執行猶予は認められない。
    C: 直ちに車両が押収される。
    D: 30日間の義務的な免許停止。
  answer: B
  explanation: 停車中のスクールバスを追い越した者には、罰金が2倍科されます。停車中のスクールバスのために停止しなかった場合の罰則は、免除、減額、または執行猶予の対象にはなりません。
- id: 155
  category: sharing_the_road
  question: 公共交通機関の車両（バス）に道を譲らなければならないのはいつですか？
  choices:
    A: 状況に関わらず、常に譲らなければならない。
    B: バスがバス専用レーンを走行しているときのみ。
    C: バスが合図を出し、車道に戻ろうとしているとき。
    D: バスが乗客を乗せているときのみ。
  answer: C
  explanation: 合図を出して車道に戻ろうとしている公共交通機関の車両（バス）には、道を譲らなければなりません。
- id: 156
  category: safe_driving_rules
  question: 交差点に進入することが合法なのはいつですか？
  choices:
    A: 交通渋滞が発生していても、信号が青になったらすぐに進入できる。
    B: 停止して交差点を塞ぐことなく、通り抜けられるときのみ。
    C: 赤信号で右折するとき。
    D: 大型トラックの後についていくとき。
  answer: B
  explanation: 運転者は、停止することなく通り抜けられる場合を除き、交差点に進入してはいけません。交差点を塞がないよう、前方の交通がクリアになるまで待つ必要があります。
- id: 157
  category: penalties_and_points
  question: 学校または遊び場の速度制限標識がある横断歩道で、歩行者のために停止しなかったり、優先権を譲らなかったりする違反（Infraction）を犯した場合、どうなりますか？
  choices:
    A: 規定の2倍の罰則を受ける。
    B: 免許が自動的に停止される。
    C: 義務的な安全運転講習を受けなければならない。
    D: 標準的な駐車違反切符を切られる。
  answer: A
  explanation: 学校または遊び場の速度制限標識がある横断歩道内で、歩行者や自転車利用者のために停止しなかったり、優先権を譲らなかったりする違反には、規定の2倍の罰則が科されます。
- id: 158
  category: vehicle_information
  question: 承認されたゴルフカート区域内の公道でゴルフカートを運転するための要件は、次のうちどれですか？
  choices:
    A: 18歳以上であること。
    B: 免許証にゴルフカート専用の限定（Endorsement）があること。
    C: 16歳以上であり、運転教育コースを修了しているか、以前に免許を保有して運転した経験があること。
    D: DOT（運輸省）承認のヘルメットを着用すること。
  answer: C
  explanation: 16歳以上で、運転教育コースを修了しているか、免許を保有する運転者としての経験があれば、承認されたゴルフカート区域内の公道でゴルフカートを運転することができます。
- id: 159
  category: sharing_the_road
  question: 公共交通機関の車両（バス）が合図を出し、車道に戻ろうとしているとき、あなたはどうしなければなりませんか？
  choices:
    A: クラクションを鳴らして素早く追い越す。
    B: その車両に道を譲る。
    C: 速度を維持し、優先権を主張する。
    D: 左車線に移動して加速する。
  answer: B
  explanation: マニュアルには、合図を出して車道に戻ろうとしている公共交通機関の車両（バス）には道を譲らなければならないと記されています。
- id: 160
  category: sharing_the_road
  question: 車両のドアを開ける際に「ダッチ・リーチ（Dutch Reach）」法を使用する主な目的は何ですか？
  choices:
    A: ドアが自動的にロックされるのを防ぐため。
    B: 体を強制的に回転させ、接近してくる自転車をよりよく確認できるようにするため。
    C: 長距離運転の後に腕の筋肉を伸ばすため。
    D: チャイルドセーフティロックが解除されていることを確認するため。
  answer: B
  explanation: 「ダッチ・リーチ」法とは、ドアから遠い方の手でドアを開ける方法です。これにより体が強制的に回転するため、接近してくる自転車をよりよく確認できるようになり、またドアが勢いよく開くのを防ぐことができます。
- id: 161
  category: driver_responsibility
  question: エンジンをかけたままの駐車車両内に子供を放置することが法律で禁止されているのは、子供が何歳未満の場合ですか？
  choices:
    A: 10歳
    B: 12歳
    C: 14歳
    D: 16歳
  answer: D
  explanation: マニュアルには、16歳未満の子供をエンジンがかかった状態の駐車車両内に放置することは法律違反であると記載されています。
- id: 162
  category: safe_driving_rules
  question: 消火栓から何フィート以内に車両を駐車してはいけませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: B
  explanation: マニュアルには駐車禁止区域がリストされており、その中には消火栓から15フィート以内の駐車禁止が含まれています。
- id: 163
  category: safe_driving_rules
  question: 信号機、一時停止標識、または譲れ（Yield）の標識から、少なくとも何フィート離して駐車しなければなりませんか？
  choices:
    A: 少なくとも15フィート
    B: 少なくとも20フィート
    C: 少なくとも30フィート
    D: 少なくとも50フィート
  answer: C
  explanation: 信号機、一時停止標識、または譲れの標識から30フィート以内に駐車することはできません。
- id: 164
  category: signs_and_signals
  question: 白く塗られた縁石は何を示していますか？
  choices:
    A: 短時間の停車のみが許可されている。
    B: 商用車専用の積載ゾーンである。
    C: 障害者専用の駐車場である。
    D: いかなる時も停車または駐車は禁止されている。
  answer: A
  explanation: その他の駐車制限は縁石の塗装によって示されることがあり、白は短時間の停車のみが許可されていることを示します。
- id: 165
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、ハンドルをどちらの方向に切るべきですか？
  choices:
    A: 縁石側
    B: 縁石とは反対側
    C: 直進方向
    D: 道路の中央側
  answer: B
  explanation: 縁石のある坂道で上向きに駐車する場合は、パーキングブレーキをかけ、ハンドルを縁石とは反対側に切ります。こうすることで、万が一車両が動き出したとしても、縁石に当たって止まるようになります。
- id: 166
  category: safe_driving_rules
  question: 下り坂で駐車する場合、ハンドルをどちらの方向に切るべきですか？
  choices:
    A: 縁石側
    B: 縁石とは反対側
    C: 直進方向
    D: 道路と平行
  answer: A
  explanation: 下り坂で駐車する場合は、パーキングブレーキをかけ、ハンドルを縁石側に切ります。
- id: 167
  category: safe_driving_rules
  question: 縦列駐車をする際、車両は縁石から何インチ以内に収めなければなりませんか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: B
  explanation: 縦列駐車をする際は、縁石から12インチ以内に駐車しなければなりません。
- id: 168
  category: vehicle_information
  question: ハンドルを握る際の推奨される手の位置はどこですか？
  choices:
    A: 左手は10時の位置、右手は2時の位置
    B: 左手は8時から9時の間、右手は3時から4時の間
    C: 両手をハンドルの下部、6時の位置に置く
    D: 左手は9時の位置、右手はシフトレバーの上に置く
  answer: B
  explanation: ハンドルの反対側にそれぞれの手を置きます（左手は8時から9時の間、右手は3時から4時の間）。これにより、ハンドルから手を離さずに曲がることができ、またエアバッグの作動を妨げないようになります。
- id: 169
  category: defensive_driving
  question: 安全に運転し、状況を予測するためには、道路のどのくらい先を見るべきですか？
  choices:
    A: 少なくとも5秒先
    B: 少なくとも10秒先
    C: 少なくとも15秒先
    D: 少なくとも20秒先
  answer: C
  explanation: マニュアルでは、道路のかなり先（少なくとも15秒先）を見ること、そして道路の両側と後方を確認することを推奨しています。
- id: 170
  category: safe_driving_rules
  question: 特別の標識がない限り、市街地（都市や町）の道路の制限速度は何マイル（mph）ですか？
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: 特別の標識がない限り、市街地の道路の制限速度は25 mphです。
- id: 171
  category: safe_driving_rules
  question: 特に標識がない場合、郡道（county roads）の最高速度制限は何マイルですか？
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: 特に標識で指定されていない限り、郡道の速度制限は50 mphです。
- id: 172
  category: defensive_driving
  question: ワシントン州における全交通死亡事故のうち、スピード違反が原因となっているのはおよそ何パーセントですか？
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: マニュアルによると、ワシントン州の全交通死亡事故の約40%にスピード違反が関与しています。
- id: 173
  category: penalties_and_points
  question: ワシントン州の脇見運転禁止法に違反した場合の最低罰金額はいくらですか？
  choices:
    A: $100
    B: $124
    C: $150
    D: $250
  answer: B
  explanation: これらの制限の1つ以上に違反した場合の最低罰金額は124ドルであり、衝突事故を引き起こした場合はさらに高額になる可能性があります。
- id: 174
  category: penalties_and_points
  question: 2回目およびそれ以降の脇見運転違反に対する罰金はどうなりますか？
  choices:
    A: 金額は変わらない
    B: 2倍になる
    C: 3倍になる
    D: 運転免許が停止される
  answer: B
  explanation: 2回目およびそれ以降のすべての違反については、罰金が2倍になる対象となります。
- id: 175
  category: penalties_and_points
  question: 法執行官が「危険な脇見運転（Dangerously Distracted Driving）」の違反を適用できるのはどのような時ですか？
  choices:
    A: 衝突事故を起こした場合のみ
    B: 食事をしているのを見かけた際の一次的な違反として
    C: 別の交通違反の疑いで停車させた際の二次的な措置として
    D: 携帯電話を使用している場合のみ
  answer: C
  explanation: 法執行官は、別の交通違反の疑いで車両を停車させた際、その運転者が危険な脇見運転をしていた場合に、二次的な違反としてこれを含めることができます。
- id: 176
  category: safe_driving_rules
  question: 運転中に個人用電子機器を使用することが許可されるのは、次のうちどの状況ですか？
  choices:
    A: 赤信号で停車中にテキストメッセージを読むとき
    B: 違法行為を通報したり、緊急援助を要請したりするとき
    C: 高速道路を走行中にスマートフォンの地図を確認するとき
    D: 音楽のプレイリストを変更するとき
  answer: B
  explanation: 許可される可能性のある活動には、違法行為の通報、および医療やその他の緊急援助の要請が含まれます。
- id: 177
  category: license_system
  question: 仮免許（Instruction Permit）または中間免許（Intermediate License）を持つ運転者の無線通信機器の使用に関する規則は何ですか？
  choices:
    A: ハンズフリー機器のみ使用できる
    B: 信号待ちで停車中であれば手持ちの機器を使用できる
    C: 緊急時を除き、いかなる無線通信機器も使用できない
    D: GPSナビゲーションのためだけに機器を使用できる
  answer: C
  explanation: 仮免許または中間免許を持つ運転者は、緊急時を除き、運転中にいかなる無線通信機器（手持ちかハンズフリーかを問わず）も使用することはできません。
- id: 178
  category: safe_driving_rules
  question: 公道で自動車を運転中、運転者からテレビ放送が見える状態にすることが合法となるのはいつですか？
  choices:
    A: 25 mph未満で走行しているとき
    B: 車両がクルーズコントロール中のとき
    C: 車両が後退（バック）する際のライブ映像を表示しているときのみ
    D: 放送がニュース番組であるとき
  answer: C
  explanation: 運転者から動く画像が見える状態で、テレビ放送を受信できる装置を備えた車両を運転することは禁止されています。ただし、車両が後退する際のライブ映像については例外として認められています。
- id: 179
  category: safe_driving_rules
  question: 運転中のイヤホン着用に関するワシントン州の法律はどうなっていますか？
  choices:
    A: 音量が小さければ着用してもよい
    B: 片耳だけであれば着用してもよい
    C: 耳を覆う、または耳の中に入れるヘッドホンやイヤホンを着用して運転することは違法である
    D: ハンズフリー通話のために着用が義務付けられている
  answer: C
  explanation: 耳を覆う、または耳の中に入れるヘッドホンやイヤホンを着用して運転しないでください。これらはワシントン州や他の多くの州で違法であり、緊急車両の警笛やサイレンが聞こえにくくなります。
- id: 180
  category: defensive_driving
  question: マニュアルに記載されている脇見運転の「5つのD（5 Ds）」に含まれないものは次のうちどれですか？
  choices:
    A: Dangerous（危険）
    B: Deceptive（欺瞞的/気づかないうちに）
    C: Disrespectful（不敬な）
    D: Destructive（破壊的）
  answer: C
  explanation: 脇見運転の「5つのD」は、Dangerous（危険）、Deceptive（欺瞞的）、Destructive（破壊的）、Disabling（無力化させる）、Deadly（致命的）です。
- id: 181
  category: defensive_driving
  question: NHTSA（米国国家道路交通安全局）によると、ドライバーが反応するための時間をあとどれだけ長く持てれば、全事故の80%以上を回避できるとされていますか？
  choices:
    A: 1秒追加
    B: 2秒追加
    C: 3秒追加
    D: 5秒追加
  answer: A
  explanation: NHTSA（米国国家道路交通安全局）によると、ドライバーが反応するための時間をあと1秒長く持てれば、全事故の80%以上を回避できるとされています。
- id: 182
  category: defensive_driving
  question: 一般的なドライバーは、運転中にどれくらい先を見ていますか？
  choices:
    A: 1〜2秒先
    B: 3〜5秒先
    C: 10〜12秒先
    D: 15秒先
  answer: B
  explanation: 一般的なドライバーは、車のわずか3〜5秒先しか見ていません。
- id: 183
  category: defensive_driving
  question: 重要な情報をより早く収集し、危険に対してより迅速に対応するためには、どれくらい先までスキャン（確認）すべきですか？
  choices:
    A: 少なくとも5秒先
    B: 少なくとも10秒先
    C: 少なくとも15秒先
    D: 少なくとも30秒先
  answer: C
  explanation: 少なくとも15秒先までスキャンしていれば、重要な情報をより早く収集し、問題や危険に対してより迅速に対応することができます。
- id: 184
  category: defensive_driving
  question: 市街地を走行している場合、15秒先はおよそどの程度の距離に相当しますか？
  choices:
    A: 車1台分の長さ
    B: 1ブロック
    C: 4ブロック
    D: 0.5マイル
  answer: B
  explanation: 市街地では15秒先を見るようにしてください。15秒はおよそ1ブロックの距離です。
- id: 185
  category: defensive_driving
  question: 車両、歩行者、または自転車が自分の進路を横切ったり進入したりする可能性が最も高いのは、何秒以内の範囲ですか？
  choices:
    A: 2秒の範囲
    B: 4秒の範囲
    C: 8秒の範囲
    D: 10秒の範囲
  answer: B
  explanation: 他の車両、歩行者、または自転車は、いつでも（多くの場合4秒以内の範囲で）進路を横切ったり進入したりする可能性があるため、左右を確認して誰も来ていないことを確かめてください。
- id: 186
  category: defensive_driving
  question: 米国で毎年発生する全事故のうち、交差点で発生する割合は何パーセントですか？
  choices:
    A: 10%以上
    B: 20%以上
    C: 30%以上
    D: 40%以上
  answer: C
  explanation: マニュアルによると、米国で毎年発生する全事故の30%以上が交差点で発生しています。
- id: 187
  category: safe_driving_rules
  question: 対向車線を横切って左折または右折する際、どれくらい手前で合図（ウィンカー）を出すべきですか？
  choices:
    A: 少なくとも50フィート手前
    B: 少なくとも100フィート手前
    C: 少なくとも200フィート手前
    D: 少なくとも300フィート手前
  answer: B
  explanation: マニュアルには次のように記載されています。「対向車線を横切って左折または右折する前に、少なくとも100フィート手前で合図を出し、交通の流れに安全な隙間があるか確認してください。」
- id: 188
  category: safe_driving_rules
  question: 赤信号で停止した後の右左折に関して、正しいものはどれですか？
  choices:
    A: 赤信号での左折は決して許されない。
    B: 禁止されていない限り、赤信号で右折することができる。
    C: 標識で許可されている場合に限り、赤信号で右折できる。
    D: 赤信号であっても、対面通行の道路へは左折できる。
  answer: B
  explanation: マニュアルによると、停止した後、禁止されていない限り赤信号で右折することができます。また、禁止されていない限り、一方通行または対面通行の道路から一方通行の道路へ左折することもできます。
- id: 189
  category: defensive_driving
  question: 交差点で停止している際、交差する道路の視界が遮られている場合はどうすべきですか？
  choices:
    A: クラクションを鳴らして素早く進む。
    B: 他の車両が隣に来るまで待つ。
    C: 見えるようになるまでゆっくりと前に出る。
    D: 交差する前にハイビームを点灯する。
  answer: C
  explanation: 停止中に交差する道路の視界が遮られている場合は、見えるようになるまでゆっくりと前に出る必要があります。これにより、こちらから相手が見えるようになる前に、交差する道路のドライバーに自車の前方を確認させることができます。
- id: 190
  category: safe_driving_rules
  question: 踏切に近づいており、安全に渡れるか確信が持てない場合は、どうすべきですか？
  choices:
    A: 素早く渡りきるために加速する。
    B: ラジオの音量を下げ、窓を開けて、列車の音を確認する。
    C: よりよく見えるように、線路の上で停止する。
    D: 警告灯の表示だけに頼る。
  answer: B
  explanation: マニュアルでは、踏切を安全に渡れるか確信が持てない場合は、ラジオの音量を下げるかオフにし、会話をやめ、窓を開けて、列車の姿や音を確認することを推奨しています。
- id: 191
  category: defensive_driving
  question: 複数の線路がある踏切で、通過する列車が十分に遠ざかるまで待つべきなのはなぜですか？
  choices:
    A: 列車が突然逆方向に進み始める可能性があるため。
    B: 踏切の遮断機がリセットされるまでに長い時間がかかるため。
    C: 通過した列車の陰に別の列車が隠れている可能性があるため。
    D: 列車が通過してから1分以内に横断することは違法であるため。
  answer: C
  explanation: 複数の線路がある踏切では、今通過したばかりの列車の陰に別の列車が隠れている可能性があるため、列車が十分に遠ざかるまで待たなければなりません。
- id: 192
  category: defensive_driving
  question: 車線変更をする際、移動しようとする方向に肩越しに目視確認する必要があるのはなぜですか？
  choices:
    A: ミラーでは確認できない車両の死角を確認するため。
    B: 方向指示器が正しく作動しているか確認するため。
    C: 歩行者に自分の意図を伝えるため。
    D: 直前の車両の速度を確認するため。
  answer: A
  explanation: 車両の後方の角付近には、ミラーでは見ることができない「死角」があるため、肩越しに目視で確認する必要があります。
- id: 193
  category: sharing_the_road
  question: 商用車の前に合流しようとする際、どれくらいの車間距離を空けることが推奨されていますか？
  choices:
    A: 時速5マイルごとに車1台分の長さ。
    B: 時速10マイルごとに車1台分の長さ。
    C: 速度に関わらず車2台分の長さ。
    D: 常に100フィートの距離。
  answer: B
  explanation: 商用車の前に合流しようとする際は、時速10マイル（約16km/h）ごとに車1台分の車間距離を空けることが推奨されています。
- id: 194
  category: safe_driving_rules
  question: 車を後退（バック）させる際、後方を確認するために推奨される方法はどれですか？
  choices:
    A: ルームミラーのみに頼る。
    B: サイドミラーのみに頼る。
    C: 右腕を助手席の背もたれに置き、振り向いて後部窓から直接見る。
    D: 運転席のドアを開けて後ろを見る。
  answer: C
  explanation: 後退する際は、ミラーだけに頼るのではなく、右腕をシートの背もたれに置いて振り向き、後部窓から直接後方を確認するようにしてください。
- id: 195
  category: safe_driving_rules
  question: 法律により、車両のヘッドライトを点灯しなければならないのはいつですか？
  choices:
    A: 日没から日の出まで。
    B: 日没の30分後から日の出の30分前まで。
    C: 日没の1時間後から日の出の1時間前まで。
    D: 外が完全に暗い時のみ。
  answer: B
  explanation: 法律により、車両のヘッドライトは日没の30分後から日の出の30分前まで、または視界が悪く見えにくい状況では常に点灯しなければなりません。
- id: 196
  category: safe_driving_rules
  question: 対向車とすれ違う際、何フィート以内に近づいたらハイビームをロービームに切り替えなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: マニュアルには、対向車から500フィート（約150メートル）以内に近づいた場合は、常にハイビームをロービームに切り替えなければならないと記載されています。
- id: 197
  category: safe_driving_rules
  question: 前方の車両を追従している際、何フィート以内の距離でロービームを使用すべきですか？
  choices:
    A: 100フィート以下。
    B: 200フィート以下。
    C: 300フィート以下。
    D: 500フィート以下。
  answer: C
  explanation: 前方の車両を300フィート（約90メートル）以下の距離で追従する場合は、ロービームを使用する必要があります。
- id: 198
  category: defensive_driving
  question: 霧、雪、または激しい雨の中で、ハイビームではなくロービームを使用すべきなのはなぜですか？
  choices:
    A: 寒い時期はハイビームの方がバッテリーの消耗が早いため。
    B: ハイビームの光が反射して眩しくなり、視界が悪くなるため。
    C: 日中の時間帯は法律でロービームが義務付けられているため。
    D: ハイビームの熱でフロントガラスに降る雪が溶ける可能性があるため。
  answer: B
  explanation: 霧、雪、または激しい雨の中では、ハイビームの光が反射して眩しくなり（グレア現象）、前方の視界が悪くなります。そのため、代わりにロービームを使用する必要があります。
- id: 199
  category: defensive_driving
  question: 対向車がハイビームを点灯して向かってきた場合、目がくらむのを避けるためにどこを見るべきですか？
  choices:
    A: 対向車のヘッドライトを直接見る。
    B: 道路の左側を見る。
    C: 道路の右側を見る。
    D: 自分のダッシュボードを見下ろす。
  answer: C
  explanation: ハイビームを点灯した車両が向かってきた場合は、目がくらむのを防ぐため、ヘッドライトを直視せず、車が通り過ぎるまで道路の右側を見るようにしてください。
- id: 200
  category: defensive_driving
  question: 減速する際、車両の後方を確認することが特に重要なのはどのような時ですか？
  choices:
    A: 急な上り坂を運転している時。
    B: 急減速する時や、後続車のドライバーが予想していない場所で減速する時。
    C: 信号が青の交差点に近づいている時。
    D: フリーウェイの右車線を走行している時。
  answer: B
  explanation: 減速する時は常に後方を確認しなければなりませんが、急減速する場合や、私道や駐車スペースへの進入など、後続車のドライバーが減速を予想していない場所では特に重要です。
- id: 201
  category: safe_driving_rules
  question: 雨、雪、または霧の日に、ヘッドライトに関して何をすべきですか？
  choices:
    A: 暗くなってきた場合のみ点灯する。
    B: 代わりに駐車灯（パーキングライト）を使用する。
    C: ワイパーを作動させるときは常に点灯する。
    D: ハイビームを連続して点滅させる。
  answer: C
  explanation: マニュアルによると、雨、雪、または霧の状況では、ヘッドライトを点灯することで自車が他者から見えやすくなります。覚えておくべき良いルールは、「ワイパーをつけたら、ヘッドライトもつける」ということです。
- id: 202
  category: defensive_driving
  question: 朝日や夕日に背を向けて運転しているとき、なぜヘッドライトを点灯すべきなのですか？
  choices:
    A: 前方の道路をよりはっきりと見るのに役立つため。
    B: 対向車のドライバーがあなたの車を見つけやすくするため。
    C: バックミラーに太陽光が反射するのを防ぐため。
    D: 他のドライバーに減速していることを知らせるため。
  answer: B
  explanation: マニュアルによると、朝日や夕日に背を向けて運転しているとき、対向車のドライバーはあなたの車が見えにくい場合があるため、ヘッドライトを点灯することで相手があなたを認識しやすくなります。
- id: 203
  category: sharing_the_road
  question: 次の状況のうち、クラクションの使用を避けるべきなのはどれですか？
  choices:
    A: 子供が通りに飛び出しそうなとき。
    B: 自転車を追い越すときや、馬に近づくとき。
    C: ドライバーが注意を払っていないとき。
    D: 狭い路地から出るとき。
  answer: B
  explanation: マニュアルには、視覚障害のある歩行者の周囲、自転車の追い越し時、馬に近づくときなど、クラクションを使用してはいけない場面がいくつか記載されています。
- id: 204
  category: safe_driving_rules
  question: 車が故障し、他の道路利用者に警告する必要がある場合、車両の後方どのくらいの距離に緊急用フレア（発炎筒）を置くべきですか？
  choices:
    A: 50〜100フィート
    B: 100〜150フィート
    C: 200〜300フィート
    D: 400〜500フィート
  answer: C
  explanation: 車両のトラブルで停車しなければならない場合は、他のドライバーが必要に応じて車線を変更できるように、車両の後方200〜300フィートの位置に緊急用フレアを設置する必要があります。
- id: 205
  category: vehicle_information
  question: 高速道路で車が故障し、フレア（発炎筒）を持っていない場合、どのように緊急事態を知らせることができますか？
  choices:
    A: 車道に立って腕を振る。
    B: アンテナ、サイドミラー、またはドアハンドルに白い布を縛り付ける。
    C: クラクションを鳴らし続ける。
    D: 駐車灯（パーキングライト）のみを点灯する。
  answer: B
  explanation: マニュアルでは、フレアを持っていない場合は、ボンネットを上げるか、アンテナ、サイドミラー、またはドアハンドルに白い布を縛り付けて緊急事態を知らせるようアドバイスしています。
- id: 206
  category: sharing_the_road
  question: トラックやバスなどの大型車両の横に留まってはいけないのはなぜですか？
  choices:
    A: 乗用車よりもはるかに速いスピードで走行するため。
    B: 「ノーゾーン（No-Zone）」と呼ばれる大きな死角があるため。
    C: 合図なしに頻繁に急な車線変更を行うため。
    D: 道路の砂利や泥をより多く跳ね上げるため。
  answer: B
  explanation: トラックやバスなどの大型車両には、「ノーゾーン（NO-ZONE）」と呼ばれる大きな死角があるため、その横に留まってはいけません。
- id: 207
  category: safe_driving_rules
  question: 車線変更、右左折、合流、または駐車をする際、どのくらい手前から合図を出すべきですか？
  choices:
    A: 少なくとも50フィート手前
    B: 少なくとも100フィート手前
    C: 少なくとも200フィート手前
    D: 少なくとも300フィート手前
  answer: B
  explanation: マニュアルには、動作を開始する少なくとも100フィート手前で合図を出さなければならないと記載されています。
- id: 208
  category: defensive_driving
  question: あなたと、あなたが曲がろうとしている地点との間で、別の車両が通りに入ろうとしている場合、どうすべきですか？
  choices:
    A: 自分の接近を知らせるために早めに合図を出す。
    B: その車両を通り過ぎるまで、曲がるための合図を待つ。
    C: クラクションを軽く鳴らし、すぐに合図を出す。
    D: ヘッドライトを点滅させ、急ブレーキをかける。
  answer: B
  explanation: あなたと曲がる予定の場所との間で別の車両が通りに入ろうとしている場合は、その車両を通り過ぎるまで合図を待ってください。早めに合図を出すと、相手のドライバーはあなたがその車両のいる場所で曲がると思い込み、あなたの進路に割り込んでくる可能性があります。
- id: 209
  category: defensive_driving
  question: 後続車が予想しないような場所で停止または減速することを、どのように警告できますか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）を点灯する。
    B: 左折の手信号を出す。
    C: ブレーキペダルを素早く3、4回踏む。
    D: クラクションを鋭く鳴らす。
  answer: C
  explanation: 他のドライバーが予想しない場所で停止または減速する場合は、ブレーキペダルを素早く3、4回踏んで、減速することを後続車に知らせてください。
- id: 210
  category: safe_driving_rules
  question: 時速60マイルでの停止距離は、時速30マイルでの停止距離と比較してどうなりますか？
  choices:
    A: 停止するのに2倍の距離が必要になる。
    B: 停止するのに3倍の距離が必要になる。
    C: 停止するのに4倍の距離が必要になる。
    D: 停止距離はまったく同じである。
  answer: B
  explanation: 車両の速度が速ければ速いほど、停止に必要な距離は長くなります。例えば、時速60マイルでは、時速30マイルで停止する場合の3倍の距離が必要になることがあります。
- id: 211
  category: safe_driving_rules
  question: 道路のカーブを走行する際、最も安全な方法は何ですか？
  choices:
    A: 速度を維持し、カーブ内で軽くブレーキをかける。
    B: カーブに入る直前に少し加速する。
    C: カーブ内でブレーキをかけなくて済むよう、カーブに入る前に減速する。
    D: カーブの頂点（アペックス）で強くブレーキをかける。
  answer: C
  explanation: カーブ内でブレーキをかける必要がないよう、必ずカーブに入る前に減速してください。カーブ内でのブレーキングは、車両のスリップを引き起こす原因となります。
- id: 212
  category: safe_driving_rules
  question: 圧雪路を走行する場合、速度をどの程度落とすべきですか？
  choices:
    A: 時速10マイル（mph）減速する。
    B: 速度を半分に落とす。
    C: 徐行運転まで落とす。
    D: 掲示されている制限速度を維持しつつ、車間距離を広げる。
  answer: B
  explanation: マニュアルによると、濡れた路面では時速約10マイル減速すべきですが、圧雪路では速度を半分に落とす必要があります。
- id: 213
  category: vehicle_information
  question: ワシントン州では、標準的なスパイクタイヤの使用が法的に許可されているのは何月から何月までですか？
  choices:
    A: 10月1日から4月30日まで
    B: 11月1日から3月31日まで
    C: 12月1日から2月28日まで
    D: 一年中禁止されている
  answer: B
  explanation: ワシントン州では、スパイクタイヤは冬季のみ合法であり、11月1日から3月31日の間だけ使用することができます。
- id: 214
  category: defensive_driving
  question: 他の路面が乾いていても、高架橋や橋の上が凍結しやすいのはなぜですか？
  choices:
    A: 通常の道路よりも風にさらされるため。
    B: 下に地面がないため、寒さから断熱する助けがないため。
    C: 通常、より滑らかなコンクリートで建設されているため。
    D: 周囲の丘から水が流れ込んでくるため。
  answer: B
  explanation: 橋の路面は、他の路面が凍結していなくても凍結することがあります。これは、橋の下に地面がないため、寒さから路面を断熱する効果が得られないからです。
- id: 215
  category: defensive_driving
  question: 暑い日に雨が降り始めた直後の数分間、路面が非常に滑りやすくなるのはなぜですか？
  choices:
    A: 雨が埃と混ざり、厚い泥の層を作るため。
    B: 熱によってアスファルト内の油分が表面に浮き出てくるため。
    C: 急激な冷却によりアスファルトが収縮し、滑りやすくなるため。
    D: 水がすぐにハイドロプレーニング現象を引き起こすため。
  answer: B
  explanation: 暑い日に雨が降り始めると、熱によってアスファルトの油分が表面に浮き出てくるため、最初の数分間は路面が非常に滑りやすくなります。油分が洗い流されるまで、道路は滑りやすい状態が続きます。
- id: 216
  category: safe_driving_rules
  question: 他の路面が凍結していなくても、橋の上が凍結することがあるのはなぜですか？
  choices:
    A: より多くの風にさらされるため。
    B: 下に地面がないため、寒さから断熱する助けがないため。
    C: 異なるアスファルト素材で作られているため。
    D: 空気中の水分をより多く集めるため。
  answer: B
  explanation: マニュアルによると、橋は下に地面がなく、寒さから断熱する助けがないため、他の路面が凍結していなくても凍結することがあります。
- id: 217
  category: safe_driving_rules
  question: 大雨の際、タイヤが路面との摩擦力を完全に失う（ハイドロプレーニング現象）可能性があるのは、時速何マイル（mph）くらいからですか？
  choices:
    A: 時速約35マイル
    B: 時速約40マイル
    C: 時速約50マイル
    D: 時速約60マイル
  answer: C
  explanation: 激しい雨の中では、ハイドロプレーニング現象により、時速約50マイルでタイヤが路面との摩擦力を完全に失うことがあります。
- id: 218
  category: defensive_driving
  question: タイヤが路面との摩擦力を失ったと感じた場合、どうすべきですか？
  choices:
    A: ブレーキを素早く踏み込み（ポンピングブレーキ）、摩擦力を回復させる。
    B: スリップしている方向にハンドルを急に切る。
    C: アクセルペダルから足を離し、ハンドルをまっすぐに保つ。
    D: 水を押し切るために少し加速する。
  answer: C
  explanation: タイヤが摩擦力を失った場合は、アクセルペダルから足を離し、ハンドルをまっすぐに保ってください。タイヤが再び路面をグリップするまで、停止や旋回を試みてはいけません。
- id: 219
  category: sharing_the_road
  question: 追い越しが危険な2車線道路で低速車両を運転している場合、後続車を先に行かせるために路肩に寄せて停車しなければならないのはどのような時ですか？
  choices:
    A: 後方に3台以上の車両が列を作っているとき。
    B: 後方に5台以上の車両が列を作っているとき。
    C: 後続車がクラクションを鳴らしたとき。
    D: 制限速度より時速15マイル以上遅く走行しているとき。
  answer: B
  explanation: 追い越しが危険な2車線道路で低速車両を運転しており、後方に5台以上の車両が列を作っている場合は、安全な場所で路肩に寄せて停車し、後続車を先に行かせなければなりません。
- id: 220
  category: safe_driving_rules
  question: 高速道路のランプ（合流車線）から本線の交通に合流する際の適切な手順は何ですか？
  choices:
    A: ランプの最後まで走行して停止し、車列が途切れるのを待つ。
    B: 合図を出し、周囲の交通と同じ速度で合流する。
    C: 安全のため、周囲の交通よりも遅い速度で合流する。
    D: ランプの途中で停止して、本線の車に道を譲る。
  answer: B
  explanation: 交通の流れに合流するときは、合図を出し、周囲の交通と同じ速度で進入してください。高速道路には通常、速度を上げるための十分な時間を与えるためのランプが備わっています。
- id: 221
  category: safe_driving_rules
  question: 高速道路の出口ランプ（exit ramp）から車列を離れる際、いつ減速すべきですか？
  choices:
    A: 出口ランプの約100フィート手前。
    B: 方向指示器を出したらすぐに。
    C: 出口ランプに入るまで減速してはいけない。
    D: 本線車道にいる間に徐々に減速する。
  answer: C
  explanation: 走行中の道路に出口ランプがある場合、出口ランプに移動するまで減速してはいけません。
- id: 222
  category: penalties_and_points
  question: 工事区間（work zone）で作業員や他の運転者を無謀に危険にさらした場合の罰則は何ですか？
  choices:
    A: 30日間の免許停止。
    B: 60日間の免許停止。
    C: 90日間の免許停止。
    D: 運転免許の永久取り消し。
  answer: B
  explanation: 工事区間において、作業員、他の運転者、または財産を無謀に危険にさらした場合、60日間の免許停止処分を受ける可能性があります。
- id: 223
  category: penalties_and_points
  question: 工事区間（work zone）で違反を犯した場合、交通違反の罰金はどうなりますか？
  choices:
    A: 通常の道路と同じ。
    B: 50ドル増額される。
    C: 2倍になる。
    D: 3倍になる。
  answer: C
  explanation: 工事区間内での交通違反の罰金は2倍になります。
- id: 224
  category: safe_driving_rules
  question: タイヤとブレーキの状態が良く、路面が乾燥している場合、時速50マイル（50 mph）で反応して停車するまでに約どのくらいの距離が必要ですか？
  choices:
    A: 約100フィート
    B: 約200フィート
    C: 約300フィート
    D: 約400フィート
  answer: D
  explanation: 時速50マイルでは、何かを見てから反応し、車両を停止させるまでに約400フィートかかることがあります。これは市街地の1ブロック分に相当する長さです。
- id: 225
  category: vehicle_information
  question: 夜間、ヘッドライトで前方約何フィート先まで見ることができますか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: C
  explanation: ヘッドライトは約400フィート先まで照らします。この距離内で停止できる速度で運転する必要があります。
- id: 226
  category: defensive_driving
  question: 視界の距離に基づき、状況に対して速度が速すぎないかを確認するために使用すべきルールはどれですか？
  choices:
    A: 2秒間の車間距離ルール
    B: 3秒間のスペースルール
    C: 4秒間の視界距離ルール（Four-Second Sight Distance Rule）
    D: 5秒間の反応ルール
  answer: C
  explanation: 状況に対して速度が速すぎないかを確認するには、「4秒間の視界距離ルール」を使用します。数え終わる前に選んだ静止対象物に到達した場合は、速度が速すぎます。
- id: 227
  category: safe_driving_rules
  question: 掲示されている制限速度を下回って運転していても、違反切符を切られることはありますか？
  choices:
    A: いいえ、制限速度以下であれば合法的に運転しています。
    B: はい、濡れた路面や凍結した路面など、状況に対して速度が速すぎる場合。
    C: はい、ただし制限速度を時速15マイル以上下回って運転している場合に限ります。
    D: いいえ、制限速度はすべての天候条件を考慮しています。
  answer: B
  explanation: 掲示されている制限速度を下回って運転していても、路面の濡れや凍結、視界不良、交通渋滞などの状況下で速度が速すぎる場合は、違反切符を切られる可能性があります。
- id: 228
  category: safe_driving_rules
  question: 同じ方向に進む複数の車線がある道路において、車線の使用に関して法律は何を規定していますか？
  choices:
    A: 出口に向かう場合を除き、中央車線を走行しなければならない。
    B: 追い越しをする場合を除き、右側車線を走行しなければならない。
    C: 追い越しをする場合を除き、左側車線を走行しなければならない。
    D: 制限速度を維持している限り、どの車線を走行してもよい。
  answer: B
  explanation: 同じ方向に進む複数の車線がある道路では、追い越しをする場合を除き、右側車線を走行することが法律で義務付けられています。
- id: 229
  category: safe_driving_rules
  question: 時速30マイル（30 mph）を超える速度で運転する場合、推奨される車間距離のルールは何ですか？
  choices:
    A: 2秒ルール
    B: 3秒ルール
    C: 4秒ルール
    D: 5秒ルール
  answer: C
  explanation: マニュアルによると、時速30マイルを超える速度で運転する場合、安全な車間距離を保つために最適なルールは「4秒ルール」です。
- id: 230
  category: defensive_driving
  question: 後続車に車間距離を詰められ（あおり運転）、移動できる右側車線がない場合、どうすべきですか？
  choices:
    A: 後続車を威嚇するために急ブレーキをかける
    B: 車間距離を広げるために加速する
    C: 前方の道路が空くまで待ち、ゆっくりと速度を落とす
    D: ハザードランプを点灯し、速度を維持する
  answer: C
  explanation: 右側車線がない場合は、前方の道路が空くまで待ち、ゆっくりと速度を落としてください。これにより、後続車が追い越しやすくなります。後続車を威嚇するために急減速してはいけません。
- id: 231
  category: sharing_the_road
  question: 法律上、消防車の後ろを走行する際はどの程度の間隔を空ける必要がありますか？
  choices:
    A: 200フィート（約60メートル）以上
    B: 300フィート（約90メートル）以上
    C: 400フィート（約120メートル）以上
    D: 500フィート（約150メートル）以上
  answer: D
  explanation: マニュアルによると、警察車両、救急車、消防車には活動のための追加のスペースが必要であり、消防車の後ろを走行する際は500フィート以上の距離を保たなければなりません。
- id: 232
  category: defensive_driving
  question: 坂道や傾斜地で他の車両の後ろに停車する際、なぜ余分な車間距離を空けるべきなのですか？
  choices:
    A: 信号機の視認性を高めるため
    B: 前方の車両が発進時に後退する可能性があるため
    C: 車両の間を歩行者が横断できるスペースを作るため
    D: ブレーキの摩耗を抑えるため
  answer: B
  explanation: 坂道や傾斜地で停車する場合、前方の車両が発進する際に後ろに下がってくる可能性があるため、余分なスペースを空けておく必要があります。
- id: 233
  category: safe_driving_rules
  question: 他の交通の流れに合流しようとする際、一般的にどのくらいの長さの間隔（ギャップ）が必要ですか？
  choices:
    A: 約2秒間
    B: 約3秒間
    C: 約4秒間
    D: 約6秒間
  answer: C
  explanation: 他の交通の流れに合流する際は、常に約4秒間の間隔が必要です。これにより、自分自身と後続車両の両方が2秒間の車間距離を確保できるようになります。
- id: 234
  category: sharing_the_road
  question: 自転車を追い越そうとしている時に、対向車も同時に近づいてきている場合はどうすべきですか？
  choices:
    A: 対向車が来る前に自転車を追い越せるよう加速する
    B: 自転車の乗り手が道路から外れるようクラクションを鳴らす
    C: 自転車と対向車の間の狭いスペースを通り抜ける
    D: 速度を落とし、先に対向車を通過させる
  answer: D
  explanation: 可能な限り、潜在的な危険には一つずつ対処してください。自転車を追い越す際に対向車が近づいている場合は、速度を落として先に対向車を通過させ、自転車の乗り手に対して十分なスペースを確保できるようにします。
- id: 235
  category: safe_driving_rules
  question: 複数の車線を変更する最も安全な方法は何ですか？
  choices:
    A: 車線変更にかかる時間を最小限にするため、一度にすべての車線を横切る
    B: 階段を上り下りするように、1車線ずつ移動する
    C: 複数の車線を横切る前に、大幅に減速する
    D: 大きな隙間ができるまで、2つの車線にまたがって走行する
  answer: B
  explanation: 複数の車線を移動したい場合は、1車線ずつ行います。階段を一段ずつ上り下りするように、1車線ずつ合流していくのが最も安全で簡単です。
- id: 236
  category: penalties_and_points
  question: 青信号で交差点に入ったものの、前方の車両に阻まれて進めず、信号が赤に変わった時に交差点内に取り残されてしまった場合、どうなる可能性がありますか？
  choices:
    A: バックして戻る優先権がある
    B: 交差点を塞いだとして違反切符を切られる可能性がある
    C: 対向車が道を譲らなければならない
    D: 直ちに免許停止処分を受ける
  answer: B
  explanation: たとえ青信号であっても、前方の車両が道を塞いでいる場合は交差点に進入してはいけません。信号が赤に変わった時に交差点内に取り残されると、交通を妨害することになり、交差点閉塞の違反切符を切られる可能性があります。
- id: 237
  category: defensive_driving
  question: 後続車に車間距離を詰められた（あおられた）場合、どうすべきですか？
  choices:
    A: ブレーキを繰り返し軽く踏んで、後続の運転手に警告する
    B: 前方車両との車間距離を詰める
    C: 自車の前方に余分なスペースを確保するようにする
    D: 一番左側の車線に移動する
  answer: C
  explanation: 後ろから密着して走行された場合は、自車の前方に余分なスペースを空けるようにしてください。そうすることで、急ブレーキを避けることができ、追突されるリスクを減らすことができます。
- id: 238
  category: sharing_the_road
  question: 4車線未満のハイウェイで、点滅灯をつけた緊急車両が停車しているのに近づく際、安全であれば何をしなければなりませんか？
  choices:
    A: 速度を維持し、現在の車線を走行し続ける
    B: 速度を落とし、左側を通過する
    C: 右側の路肩に寄せて停車する
    D: 緊急作業員に知らせるためにクラクションを鳴らす
  answer: B
  explanation: 4車線未満のハイウェイでは、点滅灯を使用しているロードサービス車両、緊急車両、または警察車両に近づく際、安全であれば速度を落とし、左側を通過しなければなりません。
- id: 239
  category: defensive_driving
  question: 追い越しをするわけではないのに、一番左側の車線を走り続けるのが危険なのはなぜですか？
  choices:
    A: 左側のタイヤが過度に摩耗するため
    B: 他の運転手をいらだたせ、攻撃的な運転を誘発する可能性があるため
    C: 右側にある道路標識が見えにくくなるため
    D: 車両の燃料消費量が増えるため
  answer: B
  explanation: 追い越しをしない時に一番左側の車線を走行し続けるのは危険です。なぜなら、他の運転手をいらだたせ、「ロード・レイジ（路上の激昂）」や攻撃的な運転行動を招く可能性があるからです。
- id: 240
  category: sharing_the_road
  question: 濡れた路面や凍結した路面で二輪車の後ろを走行する際、なぜ余分な車間距離が必要なのですか？
  choices:
    A: 二輪車は乗用車よりも停止に時間がかかるため
    B: これらの路面では二輪車の運転者が転倒する可能性が最も高いため
    C: 二輪車はフロントガラスにより多くの水を跳ね上げるため
    D: 悪天候時、二輪車は低速走行が義務付けられているため
  answer: B
  explanation: 二輪車や自転車の乗り手が転倒した場合に備え、衝突を避けるための余分な距離が必要です。転倒の危険性は、濡れた路面、凍結した路面、砂利道、または金属製の表面で最も高くなります。
- id: 241
  category: defensive_driving
  question: 交通を横断する際、中央分離帯（median divider）がある場合はどうすべきですか？
  choices:
    A: 自分の車両が収まる十分な広さの中央分離帯がある場合にのみ、途中で停止する
    B: 広さに関わらず、常に中央分離帯で停止する
    C: いかなる状況でも中央分離帯で停止してはならない
    D: 車両の一部が車道にはみ出す場合でも、途中で停止する
  answer: A
  explanation: 途中で停止するのが安全なのは、自分の車両が収まる十分な広さの中央分離帯がある場合のみです。車両の一部が車道にはみ出すような分離帯では停止しないでください。
- id: 242
  category: safe_driving_rules
  question: 縦列駐車をしようとしている時に後続車がいる場合、正しい手順は何ですか？
  choices:
    A: 車線内で急停車し、駐車スペースにバックで入る
    B: 方向指示器を出し、駐車スペースの横に寄せ、後続車を先に行かせてから駐車する
    C: 交通を妨げないよう、前から駐車スペースに入る
    D: ゆっくりバックしながら、後続車に追い越すよう手で合図する
  answer: B
  explanation: 縦列駐車をしたい時に後続車がいる場合は、方向指示器を出し、駐車スペースの横に停車して、後続車を先に行かせてから駐車してください。
- id: 243
  category: defensive_driving
  question: 対向の大型トレーラーと路上駐車の車両など、2つの危険の間を走行する場合、どのようにハンドル操作をすべきですか？
  choices:
    A: 動いている車両を避けるため、路上駐車の車両に寄せて走行する
    B: 中間を走行するが、大型トレーラー側に少し多めの余裕を持たせる
    C: 大型トレーラーの方がブレーキ性能が良いため、トレーラー側に寄せて走行する
    D: 大型トレーラーが通り過ぎるまで完全に停止する
  answer: B
  explanation: 2つの危険がある場合は、その中間を通るようにします。ただし、一方が他方より危険な場合は、より危険な側に少し多めのスペースを空けてください。例えば、対向車が大型トレーラーの場合は、トラックが通過する側に少し多めの余裕を持たせます。
- id: 244
  category: safe_driving_rules
  question: 信号は青ですが、前方の交差点内に車両がいて塞がっている場合、どうすべきですか？
  choices:
    A: 交差点に入り、交通が解消されるのを待つ。
    B: 車両が動くまでクラクションを鳴らし続ける。
    C: 交差点を渡り始めてはいけない。
    D: 塞いでいる車両の間をゆっくりと縫うように進む。
  answer: C
  explanation: たとえ信号が青であっても、前方の交差点が車両で塞がっている場合は、交差点を渡り始めてはいけません。信号が赤に変わった時に交差点内に取り残されると、交通を遮断することになり、違反切符を切られる可能性があります。
- id: 245
  category: defensive_driving
  question: 対向するモーターサイクル（自動二輪車）が方向指示器を出しているとき、なぜ特に注意が必要なのですか？
  choices:
    A: モーターサイクルは常に方向指示器を点灯させておく義務があるから。
    B: モーターサイクルの方向指示器は、自動で消えないことが多いから。
    C: モーターサイクルは車よりもはるかに速く曲がるから。
    D: モーターサイクルの信号は通常、見えにくいから。
  answer: B
  explanation: モーターサイクルの方向指示器は自動で消えないことが多く、ライダーが前の右左折時に消し忘れている可能性があるため、相手が実際に曲がり始めるまで待つ必要があります。
- id: 246
  category: safe_driving_rules
  question: 時速55マイル（55 mph）で走行中、2車線の道路で他の車両を安全に追い越すには、約どれくらいの距離が必要ですか？
  choices:
    A: 400フィート
    B: 800フィート
    C: 1600フィート
    D: 3200フィート
  answer: C
  explanation: 時速55マイルでは、自車と対向車は10秒間で800フィート以上進みます。つまり、安全に追い越すには1600フィート以上、または約3分の1マイルの距離が必要です。
- id: 247
  category: safe_driving_rules
  question: 坂の頂上やカーブからどのくらいの距離にいる場合、追い越しを開始すべきではありませんか？
  choices:
    A: 4分の1マイル
    B: 3分の1マイル
    C: 2分の1マイル
    D: 1マイル
  answer: B
  explanation: 少なくとも3分の1マイル、または約15秒先まで見通せなければなりません。坂の頂上やカーブから3分の1マイル以内の場所では、追い越しを開始しないでください。
- id: 248
  category: safe_driving_rules
  question: 他の車両を追い越した後、元の車線に戻っても安全なのはいつですか？
  choices:
    A: 追い越した車両の1台分前方に達したとき。
    B: バックミラーに追い越した車両の両方のヘッドライトが見えたとき。
    C: 右の方向指示器を出した直後。
    D: 追い越された車両のドライバーがヘッドライトを点滅させたとき。
  answer: B
  explanation: 元の車線に戻る際は、十分な距離を空けるようにしてください。バックミラーに追い越したばかりの車両の両方のヘッドライトが見えたら、元の車線に戻っても安全です。
- id: 249
  category: sharing_the_road
  question: 自動車のドライバーが自転車専用レーンを走行することが許可されるのは、どのような状況ですか？
  choices:
    A: 遅い車両を右側から追い越すとき。
    B: 交通が激しく混雑しているとき。
    C: 右左折するとき、または縁石付近に駐車するために横切るときのみ。
    D: いかなる状況でも、ドライバーが自転車専用レーンを走行することは許可されていない。
  answer: C
  explanation: 右左折する場合や、縁石付近に駐車するために自転車専用レーンを横切る必要がある場合を除き、自転車専用レーンを走行してはいけません。
- id: 250
  category: sharing_the_road
  question: 自転車を追い抜く、または追い越す際、ドライバーはどれくらいのスペースを空けなければなりませんか？
  choices:
    A: 少なくとも1フィート
    B: 少なくとも2フィート
    C: 少なくとも3フィート
    D: 少なくとも5フィート
  answer: C
  explanation: 自転車を追い抜く、または追い越す際、ドライバーは車両のどの部分からも自転車との間に少なくとも3フィートのスペースを空けなければなりません。
- id: 251
  category: sharing_the_road
  question: 右折しようとしているときに、前方に自転車が走っている場合はどうすべきですか？
  choices:
    A: 右折する直前にスピードを上げて自転車を追い越す。
    B: クラクションを鳴らして、自転車に道を譲るよう警告する。
    C: 減速し、自転車が交差点を通過してから右折する。
    D: 右折中、自転車と同じ車線を共有する。
  answer: C
  explanation: 右折しようとしている場合、曲がる直前に自転車を追い越してはいけません。自転車の前に割り込むのではなく、減速して自転車が交差点を通過してから右折するようにしてください。
- id: 252
  category: sharing_the_road
  question: 追い越しが危険な2車線道路で、後方に5台以上の車両が列を作っている場合、自転車の運転者はどうしなければなりませんか？
  choices:
    A: 交通の流れに合わせて速度を上げる。
    B: 不安全な追い越しを防ぐため、車線の中央に移動する。
    C: 安全な場所で路肩に寄せて停車し、車両を通過させる。
    D: 車両に対し、右側から追い越すよう合図を送る。
  answer: C
  explanation: 追い越しが危険な2車線道路で、後方に5台以上の車両が列を作っている場合、自転車の運転者は、自身の判断で安全だと考えられる場所で路肩に寄せて停車し、車両を通過させなければなりません。
- id: 253
  category: sharing_the_road
  question: 自転車が歩道を走行することを選択した場合、歩行者を追い越す前に何をしなければなりませんか？
  choices:
    A: 一時的に車道に移動する。
    B: 音による合図（ベルなど）を使用して歩行者に警告する。
    C: 前方に取り付けた白いライトを点滅させる。
    D: 自転車から降りて、歩行者の横を押し歩く。
  answer: B
  explanation: 自転車は歩道や横断歩道で歩行者に道を譲らなければなりません。追い越す前に、音による合図を使用して歩行者に警告してください。
- id: 254
  category: vehicle_information
  question: ワシントン州の定義によると、電動アシスト自転車（electric-assisted bicycle）は、平坦な路面で最大時速何マイルまで自走できるモーターを搭載していますか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: 電動アシスト自転車は、ペダルで操作できるだけでなく、平坦な路面で時速20マイル（20 mph）を超えない速度で走行できる電気モーターを備えた自転車と定義されています。
- id: 255
  category: sharing_the_road
  question: 自転車がフリーウェイ（高速道路）やその他の幹線の路肩を走行することは許可されていますか？
  choices:
    A: はい。ただし、標識で禁止されている場所を除きます。
    B: はい。ただし、日中の時間帯に限ります。
    C: いいえ。すべてのフリーウェイで自転車の走行は厳格に禁止されています。
    D: いいえ。電動アシスト自転車に乗っている場合を除きます。
  answer: A
  explanation: 自転車は、標識で禁止されている場所を除き、フリーウェイやその他の幹線の路肩を使用することができます。
- id: 256
  category: defensive_driving
  question: 自転車を追い越した直後に、急な減速や停止を避けるべきなのはなぜですか？
  choices:
    A: 自転車が車両の背後に発生するスリップストリームに巻き込まれる可能性があるため。
    B: 自動車のブレーキは自転車よりも強力であり、衝突事故を引き起こす可能性があるため。
    C: 自転車を追い越してから100フィート以内でブレーキをかけることは違法であるため。
    D: 自転車は車両を右側から追い越す義務があるため。
  answer: B
  explanation: 自転車を追い越した後は注意が必要です。急に減速したり停止したりしないでください。自動車のブレーキは自転車よりも強力なため、急に停止すると衝突事故を引き起こす可能性があります。
- id: 257
  category: safe_driving_rules
  question: 安全に追い越せる十分なスペースがあるかどうかを判断する際、追い越す車両の数に関する一般的なルールは何ですか？
  choices:
    A: 交通の流れを維持するため、できるだけ多くの車両を追い越す。
    B: 一度に3台以上の車両を追い越してはならない。
    C: 通常、一度に1台の車両のみを追い越すようにする。
    D: 大型トラックを運転している場合に限り、複数の車両を追い越す。
  answer: C
  explanation: 一度に数台の車両を追い越すのに十分な時間があるとは限りません。安全を期しましょう。通常、一度に追い越すのは1台だけにしてください。
- id: 258
  category: sharing_the_road
  question: 自転車が通常の交通の流れよりも遅い速度で車道を走行している場合、その車線内の位置について正しいものはどれですか？
  choices:
    A: 常に未舗装の路肩を走行しなければならない。
    B: 歩道がある場合は、歩道を走行することが法律で義務付けられている。
    C: 安全のための車線内の位置取りは運転者の判断に任されており、法的に車線全体を使用することができる。
    D: 白い実線の上を正確に走行しなければならない。
  answer: C
  explanation: 安全のための車線内の位置取りは運転者の判断に任されており、自転車は法的に車線全体を使用することができます。できるだけ車道の右側に寄って走行しなければなりませんが、車線全体を使用することも可能です。
- id: 259
  category: sharing_the_road
  question: 自転車の運転者は、どのような場合に路肩に寄せて停車し、車両を通過させなければなりませんか？
  choices:
    A: 後方に3台以上の車両がいるとき。
    B: 後方に5台以上の車両が列を作っているとき。
    C: 後方の車両が1台でも追い越しを希望しているとき。
    D: 自転車が路肩に寄せる義務が生じることはない。
  answer: B
  explanation: マニュアルによると、自転車の後方に5台以上の車両が列を作っている場合、安全に車両を通過させられる場所で路肩に寄せて停車しなければなりません。
- id: 260
  category: sharing_the_road
  question: 自転車が歩道で歩行者を追い越す前に何をしなければなりませんか？
  choices:
    A: ヘッドライトを点滅させる。
    B: 右側からのみ追い越す。
    C: 音による合図を使用して歩行者に警告する。
    D: 自転車から降りて、歩行者の横を押し歩く。
  answer: C
  explanation: 自転車は歩道や横断歩道で歩行者に道を譲らなければならず、追い越す前に音による合図を使用して歩行者に警告しなければなりません。
- id: 261
  category: vehicle_information
  question: 夜間に自転車に乗る際、どのような灯火装置が必要ですか？
  choices:
    A: 300フィート先から見える白いヘッドライトと、300フィート先から見える赤いテールライト
    B: 500フィート先から見える点灯式の白いヘッドライトと、後方600フィートから見える赤色の反射板
    C: 点滅式の白いヘッドライトと、点滅式の赤いテールライト
    D: ペダルの反射テープと、フロントの白い反射板
  answer: B
  explanation: 夜間に走行する場合、自転車には500フィート先から見える点灯式の白いヘッドライトと、後方600フィートから見える赤色の反射板を装備しなければなりません。
- id: 262
  category: vehicle_information
  question: 自転車のブレーキに関する法的要件は何ですか？
  choices:
    A: 時速10マイルで走行中に15フィート以内で停止できなければならない
    B: アンチロック・ブレーキ・システム（ABS）を装備していなければならない
    C: 乾いた平坦で清潔な路面で、車輪をスリップ（ロック）させることができなければならない
    D: 前輪と後輪の両方が同時に作動しなければならない
  answer: C
  explanation: すべての自転車は、乾いた平坦で清潔な路面で車輪をスリップさせることができるブレーキを装備していなければなりません。
- id: 263
  category: safe_driving_rules
  question: 自転車の運転者が荷物を運ぶことができるのは、どのような条件の場合ですか？
  choices:
    A: 荷物がバックパックに固定されている場合のみ
    B: 常に少なくとも片手でハンドルを握ることができる場合
    C: 荷物の重さが10ポンド未満の場合のみ
    D: 自転車の運転者が荷物を運ぶことは厳格に禁止されている
  answer: B
  explanation: 自転車の運転者は、常に少なくとも片手でハンドルを握ることができる場合を除き、荷物を運ぶことはできません。
- id: 264
  category: safe_driving_rules
  question: 衝突事故に遭った場合、自転車用ヘルメットはどうすべきですか？
  choices:
    A: ひび割れがないか点検し、問題がなければ再利用する
    B: 自転車店で再認定を受ける
    C: 常に新しいヘルメットに買い替える
    D: 再び着用する前に、中性洗剤と水で洗う
  answer: C
  explanation: マニュアルには、衝突事故に遭ったヘルメットは常に新しいものに買い替えるべきであると記載されています。
- id: 265
  category: defensive_driving
  question: 開いたドアにぶつからないよう、自転車は駐車車両との間にどのくらいのスペースを空けるべきですか？
  choices:
    A: 約1フィート
    B: 約2フィート
    C: 約3フィート
    D: 少なくとも5フィート
  answer: C
  explanation: 自転車の運転者は、開いたドアが進路を妨げないよう、駐車車両との間に約3フィートのスペースを空けるべきです。
- id: 266
  category: defensive_driving
  question: 自転車が交差点で車両の右側を追い越すべきではないのはなぜですか？
  choices:
    A: 道路の右側を走行することは違法であるため
    B: 右折するドライバーが、右側を通過する自転車に気づかない、または見ていない可能性があるため
    C: 自転車はいかなる状況でも常に左側から追い越さなければならないため
    D: 道路の右側は通常、路面のくぼみ（ポットホール）が多いため
  answer: B
  explanation: 右折するドライバーが右側を通過する自転車に気づかない、または見ていない可能性があるため、自転車は交差点で車両の右側を追い越すべきではありません。
- id: 267
  category: safe_driving_rules
  question: 大声で叱っても犬が追いかけてくる場合、自転車の運転者はどうすべきですか？
  choices:
    A: 犬を振り切るために、できるだけ速くペダルを漕ぐ
    B: 犬を追い払うために、犬を蹴る
    C: 自転車から降り、自分と犬の間に自転車を置く
    D: 犬を避けるために、走行車線に急ハンドルを切る
  answer: C
  explanation: 犬が追いかけてきて、「ダメ！（NO!）」と叫んでも止まらない場合は、自転車から降りて、自分と犬の間に自転車を置くようにしてください。
- id: 268
  category: sharing_the_road
  question: 自動車とオートバイの重大な衝突事故の一般的な原因は何ですか？
  choices:
    A: 一時停止標識でオートバイが自動車に追突する
    B: 対向するオートバイの前で自動車が左折する
    C: オートバイが右側の路肩から自動車を追い越す
    D: 高速道路で自動車とオートバイが側面接触する
  answer: B
  explanation: 対向するオートバイの前で自動車が左折することは、ドライバーがライダーを見落としたり、速度を見誤ったりするため、重大な自動車とオートバイの事故の原因となることがあります。
- id: 269
  category: defensive_driving
  question: 右左折を待っているときに、ウィンカーを点滅させて近づいてくるオートバイを見かけた場合、どうすべきですか？
  choices:
    A: オートバイは確実に曲がるので、すぐに進む
    B: オートバイの運転者にウィンカーを消すよう促すために、クラクションを鳴らす
    C: 進む前に、オートバイが実際に曲がるのを確実に確認するまで待つ
    D: オートバイの運転者に警告するために、ヘッドライトをパッシングさせる
  answer: C
  explanation: ほとんどのオートバイには、自動的に消えるウィンカーが備わっていません。ウィンカーを点滅させているオートバイの前で曲がる前に、そのオートバイが直進し続けず、実際に曲がることを確認してください。
- id: 270
  category: sharing_the_road
  question: 自動車がオートバイと同じ車線内に並んで走行することが許されるのはいつですか？
  choices:
    A: 車線の幅が非常に広い場合
    B: オートバイが車線の右端を走行している場合
    C: 交通の流れが時速15マイル未満の場合
    D: いかなる場合も不可。オートバイには車線全体の幅を使用する権利がある
  answer: D
  explanation: オートバイの運転者は、他のすべての車両と同様に、車線全体の幅を使用する権利があります。車線が広くても、オートバイと同じ車線内に割り込んではいけません。
- id: 271
  category: safe_driving_rules
  question: 自車と二輪車（オートバイ）との間に設けるべき推奨される車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒以上
    D: 少なくとも6秒
  answer: C
  explanation: 緊急時に回避や停止を行うための十分な時間を確保するため、自車と二輪車との間には4秒以上の車間距離を空ける必要があります。
- id: 272
  category: sharing_the_road
  question: 二輪車（オートバイ）が同じ車線を走行している自転車を追い越すことができるのは、どのような条件の場合ですか？
  choices:
    A: 右側から少なくとも2フィートの間隔を空けて追い越す場合
    B: 左側から少なくとも3フィートの安全な追い越し距離を空けて追い越す場合
    C: 自転車の運転手が追い越すよう合図した場合のみ
    D: 二輪車が同じ車線内で自転車を追い越すことは決して許されない
  answer: B
  explanation: 二輪車は、左側から少なくとも3フィートの安全な追い越し距離を空ける場合に限り、同じ車線内の自転車を追い抜いたり追い越したりすることができます。
- id: 273
  category: defensive_driving
  question: 運転者が除雪車に対して細心の注意を払い、車間距離を詰めすぎないようにすべきなのはなぜですか？
  choices:
    A: 除雪車は予告なく頻繁に停止や後退を行うため
    B: 除雪車が大量の塩をまき、フロントガラスを損傷させる可能性があるため
    C: ブレードが雪を巻き上げ、吹雪のような状態を作り出し、視界を悪化させる可能性があるため
    D: 除雪車は高速で走行し、急ブレーキをかけることがあるため
  answer: C
  explanation: 除雪車のブレードが雪を路面から跳ね上げることで、後続車にとって吹雪のような状態になり、視界が遮られる可能性があるため、除雪車の周囲では細心の注意を払う必要があります。
- id: 274
  category: sharing_the_road
  question: 適切に調整されたブレーキを備えた積載状態のトラックが、乾燥した道路を時速55マイル（約88km/h）で走行している場合、完全に停止するまでにどのくらいの距離が必要ですか？
  choices:
    A: 250フィート
    B: 300フィート
    C: 450フィート
    D: 500フィート
  answer: C
  explanation: マニュアルによると、適切に調整されたブレーキを備えた積載状態のトラックが乾燥した道路を時速55マイルで走行している場合、完全に停止するまでに450フィート（約137メートル）かかります。
- id: 275
  category: sharing_the_road
  question: 大型車両の直後を走行中、自分が相手の死角に入っているかどうかをどのように判断できますか？
  choices:
    A: その車両のテールランプが見えないとき
    B: その車両の運転席のミラーが見えないとき
    C: 200フィート以内の車間距離で追従しているとき
    D: その車両のナンバープレートが見えないとき
  answer: B
  explanation: マニュアルには次のように記載されています。「大型車両の後方を走行しており、相手の運転席のミラーが見えない場合、相手の運転手からもあなたの姿は見えていません。」
- id: 276
  category: sharing_the_road
  question: 前方の大型車両が右折の合図を出しながら左車線に斜めに寄っている場合、どうすべきですか？
  choices:
    A: 素早く右側から追い越す
    B: クラクションを鳴らして、車線を間違えていることを知らせる
    C: その車両の後方にとどまり、右側の隙間に入り込もうとしない
    D: 対向車線に入り、左側から追い越す
  answer: C
  explanation: 大型車両の運転手は右折する際、縁石に乗り上げないように左車線に膨らんでから曲がることがあります。マニュアルでは「大型車両が右折しようとしているときに、右側の隙間に入り込もうとしてはいけません」と警告しています。
- id: 277
  category: safe_driving_rules
  question: 危険物を運搬するすべての車両は、踏切で何をしなければなりませんか？
  choices:
    A: 踏切を素早く通過するために加速する
    B: すべての踏切で停止する
    C: 通過する前にクラクションを鳴らす
    D: ハザードランプを点灯させ、停止せずに進む
  answer: B
  explanation: マニュアルには「危険物を運搬するすべての車両は、すべての踏切で停止しなければならないため、そのような車両の後方を走行している場合は停止に備えてください」と明記されています。
- id: 278
  category: safe_driving_rules
  question: 長く急な下り坂にある「緊急避難所（エスケープ・ランプ）」や「暴走車用ランプ」の目的は何ですか？
  choices:
    A: 低速車両が後続車を先に行かせるための安全な場所を提供するため
    B: 疲れた運転手の休憩所として利用するため
    C: ブレーキが故障した車両を停止させるため
    D: 大型トラックが積荷の重量を測定できるようにするため
  answer: C
  explanation: マニュアルには、緊急避難所や暴走車用ランプの中や近くに駐車してはならないと記されており、「これらのランプは、ブレーキが故障した車両を停止させるためにのみ使用されるべきである」と説明されています。
- id: 279
  category: defensive_driving
  question: 車の流れと同じ方向に歩いている歩行者に対して、なぜ十分な間隔を空ける必要があるのですか？
  choices:
    A: 法律で歩行者の優先権が定められているため
    B: 彼らはあなたに背を向けており、近づいてくるのが見えないため
    C: 突然道路を横断する可能性が高いため
    D: 通常、電子機器に気を取られているため
  answer: B
  explanation: マニュアルの「あなたが見えていない人々」の項目に、車の流れと同じ方向に歩いている歩行者が挙げられており、「彼らはあなたに背を向けているため、あなたの姿が見えません」と説明されています。
- id: 280
  category: defensive_driving
  question: 他の運転手があなたを追い越そうとしてミスをした場合、どうすべきですか？
  choices:
    A: 相手が自分の後ろに合流できるように加速する
    B: クラクションを鳴らし、速度を維持する
    C: 路肩に移動する
    D: 減速して、相手が安全に走行車線に戻れるようにする
  answer: D
  explanation: 「困っている運転手」のセクションで、マニュアルは次のようにアドバイスしています。「他の運転手があなたを追い越す際にミスをしても、事態を悪化させてはいけません。減速して、相手が安全に走行車線に戻れるようにしてください。」
- id: 281
  category: safe_driving_rules
  question: 全死亡事故のうち、車両が車道を逸脱した事故はおよそ何パーセントを占めていますか？
  choices:
    A: 25%
    B: 44%
    C: 75%
    D: 90%
  answer: B
  explanation: マニュアルには「全死亡事故の約44%に、車道を逸脱した車両が関与している」と記載されています。
- id: 282
  category: safe_driving_rules
  question: 車道逸脱による死亡事故の半数以上に共通して関与している要因は、次のうちどれですか？
  choices:
    A: 速度超過
    B: 車両の整備不良
    C: 悪天候
    D: 動物の飛び出し
  answer: A
  explanation: 本文によると、「車道逸脱による死亡事故の半数以上、および報告された重大な負傷事故の半分弱に速度超過が関与していた」とあります。
- id: 283
  category: defensive_driving
  question: 車道逸脱による死亡事故や重大な負傷事故には、通常何台の車両が関与していますか？
  choices:
    A: 90%以上が単独事故である。
    B: ほとんどが2台の車両による正面衝突である。
    C: 約50%に車両と自転車が関与している。
    D: ほとんどの場合、大型商用トラックが関与している。
  answer: A
  explanation: マニュアルには「車道逸脱による死亡事故および重大な負傷事故の90%以上は、1台の車両のみが関与している（単独事故である）」と記されています。
- id: 284
  category: driver_responsibility
  question: 初心者ドライバーにとって、事故を起こす可能性が高いため、最も重要（注意が必要）とされる運転期間はいつですか？
  choices:
    A: 最初の1ヶ月
    B: 最初の6ヶ月
    C: 最初の1年
    D: 最初の2年
  answer: B
  explanation: マニュアルには次のように記載されています。「年齢に関わらず、初心者ドライバーにとって運転を開始してからの最初の6ヶ月間は、経験不足により事故に巻き込まれる可能性が高いため、最も重要な時期である。」
- id: 285
  category: driver_responsibility
  question: 安全運転において、首や胴体の柔軟性が重要なのはなぜですか？
  choices:
    A: 長距離ドライブで快適に座るのに役立つため。
    B: 右左折や後退の前に、最大限の視界を確保して危険を確認できるため。
    C: 運転免許試験の身体検査に合格するために必要なため。
    D: ペダルやハンドルに手が届きやすくなるため。
  answer: B
  explanation: マニュアルでは、首や胴体の柔軟性を含む身体能力は、「右左折、後退、車線変更、または合流の前に、安全上の危険を確認するために最大限の視界を確保する際」に重要であると説明されています。
- id: 286
  category: penalties_and_points
  question: 運転免許証に矯正眼鏡等の使用が義務付けられているにもかかわらず、それらを使用せずに運転していて警察官に止められた場合、どうなる可能性がありますか？
  choices:
    A: 警告を受ける。
    B: 車両が直ちに押収される。
    C: 違反切符を切られる可能性がある。
    D: その場で視力検査の再受検を求められる。
  answer: C
  explanation: マニュアルには「運転免許証に矯正レンズの着用が必要と記載されているにもかかわらず、着用せずに運転して止められた場合、違反切符を切られる可能性がある」と警告されています。
- id: 287
  category: defensive_driving
  question: 側面の視界（周辺視野）にあるものをはっきりと捉えることはできないため、車両や潜在的なトラブルを見つけるにはどうすればよいですか？
  choices:
    A: 数秒ごとに頭を完全に後ろに向ける。
    B: 周辺視野のみに頼る。
    C: サイドミラーを使用し、必要に応じて横を目視する。
    D: 常に視線を真っ直ぐ前に固定する。
  answer: C
  explanation: 側面の視界に関して、マニュアルには「側面のものを注視することはできないため、サイドミラーを使用し、必要に応じて横をちらりと見る（目視する）必要がある」と記載されています。
- id: 288
  category: defensive_driving
  question: 明らかな理由もなく減速しているドライバーや自転車利用者に対して、なぜ十分な車間距離を空けるべきなのですか？
  choices:
    A: 違法なUターンをしようとしている可能性があるため。
    B: 自分の車線位置からは見えない危険を、彼らが見つけている可能性があるため。
    C: 無理に追い越させようとしているため。
    D: ブレーキのテストをしているため。
  answer: B
  explanation: 混乱している可能性のある人々について、マニュアルでは明らかな理由もなく減速している人に注意するよう助言しており、「彼らには、あなたの車線位置からは見えない何かが見えている可能性があることを忘れないでください」と述べています。
- id: 289
  category: safe_driving_rules
  question: 夜間に色の濃い眼鏡や着色コンタクトレンズの使用を避けるべきなのはなぜですか？
  choices:
    A: 一時的な色盲を引き起こす可能性があるため。
    B: 対向車のドライバーの目に光を反射しすぎるため。
    C: はっきりと見るために必要な光を遮ってしまうため。
    D: すべての州で運転中の着用が禁止されているため。
  answer: C
  explanation: マニュアルでは、夜間に色の濃い眼鏡や着色コンタクトレンズを使用しないよう助言しています。なぜなら、それらははっきりと見るために必要な光を遮ってしまうからです。
- id: 290
  category: safe_driving_rules
  question: 調査によると、聴覚障害のあるドライバーの運転記録は、聴覚に問題のないドライバーと比較してどうですか？
  choices:
    A: 衝突事故が大幅に多い。
    B: 聴覚に問題のないドライバーと同等に良好である。
    C: 軽微な事故は少ないが、重大な事故が多い。
    D: サイレンが聞こえないため、わずかに劣る。
  answer: B
  explanation: 調査によると、聴覚障害のあるドライバーは視覚により頼り、注意を怠らないようにすることを学ぶため、その運転記録は聴覚に問題のないドライバーと同等に良好であることが示されています。
- id: 291
  category: safe_driving_rules
  question: 長距離ドライブでの疲れを防ぐために、どのくらいの頻度で休憩を取るべきですか？
  choices:
    A: 1時間おき程度。
    B: 3時間おき。
    C: 給油が必要な時のみ。
    D: 200マイル（約320km）走行するごと。
  answer: A
  explanation: マニュアルでは、1時間おき程度、または必要に応じて休憩を取り、外を歩いて新鮮な空気を吸うことを推奨しています。
- id: 292
  category: safe_driving_rules
  question: 出発前に大量の食事を摂ることは、運転にどのような影響を与えますか？
  choices:
    A: 長距離運転に必要なエネルギーを供給する。
    B: 反応時間を改善する。
    C: 眠くなる可能性がある。
    D: 夜間運転中の覚醒状態を維持するのに役立つ。
  answer: C
  explanation: マニュアルでは、出発前は軽く食べ、大量の食事は控えるようアドバイスしています。大食いの後は眠くなる人がいるためです。
- id: 293
  category: alcohol_drugs_health
  question: 死亡事故が発生した交通事故のうち、アルコールが関与している割合はおよそ何パーセントですか？
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: マニュアルによると、死亡事故が発生した交通事故の約40%にアルコールが関与しています。
- id: 294
  category: alcohol_drugs_health
  question: アルコールは中枢神経系にどのような影響を与えますか？
  choices:
    A: 脳の活動を速める刺激剤として作用する。
    B: 脳と脊髄の活動を遅らせる抑制剤として作用する。
    C: 消化されるまで中枢神経系には影響を与えない。
    D: 一時的に調整能力と反応時間を改善する。
  answer: B
  explanation: アルコールは中枢神経系を抑制する薬物であり、脳と脊髄の活動を遅らせます。
- id: 295
  category: alcohol_drugs_health
  question: アルコールが胃や小腸を通じて血流に直接吸収されるまで、通常どのくらいの時間がかかりますか？
  choices:
    A: 5〜10分
    B: 20〜40分
    C: 1〜2時間
    D: 3〜4時間
  answer: B
  explanation: アルコールは飲み込まれると、胃や小腸の壁を通じて直接血流に吸収されます。通常、20分から40分以内です。
- id: 296
  category: alcohol_drugs_health
  question: 次のうち、同量のアルコールを含む一般的なアルコール飲料とみなされるのはどれですか？
  choices:
    A: 80プルーフ（アルコール度数40%）の蒸留酒 12オンス
    B: ビール 5オンス
    C: 80プルーフ（アルコール度数40%）の蒸留酒 1.5オンス
    D: ワイン 12オンス
  answer: C
  explanation: 一般的なアルコール飲料1杯とは、80プルーフの蒸留酒1.5オンス（ショットグラス1杯）、ビール12オンス、またはワイン5オンスのグラス1杯を指します。
- id: 297
  category: alcohol_drugs_health
  question: 人体は摂取したアルコールの大部分をどのように処理しますか？
  choices:
    A: 汗や呼気を通じて
    B: 肝臓での酸化を通じて
    C: 消化管を通じて
    D: 腎臓と尿を通じて
  answer: B
  explanation: 汗、呼気、尿を通じて排出される量はごくわずかであり、体はほとんどのアルコールを肝臓での酸化（燃焼）によって処理します。
- id: 298
  category: alcohol_drugs_health
  question: 一般的なアルコール飲料1杯分を体が処理するのに、およそどのくらいの時間がかかりますか？
  choices:
    A: 30分
    B: 1時間
    C: 2時間
    D: 4時間
  answer: B
  explanation: アルコールの酸化は一定の速度で行われ、1杯分のアルコールを体が処理するのにおよそ1時間かかります。
- id: 299
  category: alcohol_drugs_health
  question: 大麻（マリファナ）入りの食品を摂取することが、運転者にとって特に危険なのはなぜですか？
  choices:
    A: 一般的な飲料よりも高い割合のアルコールが含まれているため。
    B: 即座に激しい幻覚を引き起こすため。
    C: 効果を感じるまでに時間がかかるため、過剰に摂取しやすくなるから。
    D: 中枢神経系に永久的な損傷を与えるため。
  answer: C
  explanation: 大麻入りの食品の摂取は、効果を感じるまでに時間がかかるため危険です。効果が遅れて現れることで、過剰に摂取してしまいやすくなります。
- id: 300
  category: alcohol_drugs_health
  question: マニュアルによると、大麻（マリファナ）は最大でどのくらいの時間、運転能力を低下させることが示されていますか？
  choices:
    A: 1時間
    B: 3時間
    C: 5時間
    D: 12時間
  answer: C
  explanation: 大麻は、運転業務や教習コースにおけるパフォーマンスを最大5時間低下させることが示されています。
- id: 301
  category: alcohol_drugs_health
  question: 運転中に眠気を覚ますために「アッパー（興奮剤）」やエナジードリンクを摂取することの潜在的な危険性は何ですか？
  choices:
    A: 反応時間を永久に改善する。
    B: 後に神経質になったり、めまいがしたり、集中できなくなったりすることがある。
    C: 血流中へのアルコールの吸収を遅らせる。
    D: 中枢神経系の抑制剤として作用する。
  answer: B
  explanation: 眠気覚まし薬（Pep pills）や「アッパー」、エナジードリンクは、短時間は運転者の覚醒感を高めることがありますが、後に神経質になったり、めまいや集中力の欠如を引き起こしたり、視力に影響を及ぼしたりすることがあります。
- id: 302
  category: penalties_and_points
  question: 処方薬や市販薬の影響下で運転した場合の罰則は何ですか？
  choices:
    A: 初回違反は単純な警告のみ。
    B: 運転改善講習の受講義務。
    C: アルコール違反の場合と同じ罰則。
    D: 軽微な交通違反の罰金。
  answer: C
  explanation: マニュアルによると、薬物の影響下での運転で逮捕または有罪判決を受けた場合、その罰則はアルコール違反の場合と同様です。
- id: 303
  category: alcohol_drugs_health
  question: 運転前に薬物とアルコールを混ぜるとどうなりますか？
  choices:
    A: 薬物とアルコールの効果が互いに打ち消し合う。
    B: 相乗効果が生じ、薬物の効果が倍増する。
    C: アルコールだけを飲んだ場合と全く同じ効果がある。
    D: 違法薬物を摂取した場合のみ運転に支障が出る。
  answer: B
  explanation: マニュアルによると、薬物とアルコールを混ぜると相乗効果（compounded effect）が生じます。これは、薬物の効果が「1+1」以上の倍増した影響を及ぼすことを意味します。
- id: 304
  category: alcohol_drugs_health
  question: 21歳以上の場合、血中アルコール濃度（BAC）がいくら以上であれば運転中に逮捕される可能性がありますか？
  choices:
    A: '.02'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: マニュアルには、21歳以上の場合、BAC（血中アルコール濃度）が.08以上で運転していると逮捕される可能性があると記載されています。
- id: 305
  category: alcohol_drugs_health
  question: 21歳未満の場合、THC（マリファナ）の数値がいくらを超えると逮捕される可能性がありますか？
  choices:
    A: 血液1ミリリットルあたり0.00ナノグラム
    B: 血液1ミリリットルあたり2.00ナノグラム
    C: 血液1ミリリットルあたり5.00ナノグラム
    D: 血液1ミリリットルあたり8.00ナノグラム
  answer: A
  explanation: 21歳未満の場合、血液1ミリリットルあたりのTHC（マリファナ）濃度が0.00ナノグラムを超えると逮捕される可能性があります。
- id: 306
  category: penalties_and_points
  question: 13歳未満の子供が同乗している状態で、親が薬物またはアルコール関連の運転違反で逮捕された場合、逮捕した警察官は何をしなければなりませんか？
  choices:
    A: 車両を永久に押収する。
    B: 速やかに児童保護サービスに通知する。
    C: その場で5,000ドルの追加罰金を科す。
    D: 運転免許をさらに10年間取り消す。
  answer: B
  explanation: 親、法的保護者、または後見人が薬物やアルコール関連の運転違反で逮捕された際、車内に13歳未満の子供が同乗していた場合、逮捕した法執行官は速やかに児童保護サービス（child
    protective services）に通知しなければなりません。
- id: 307
  category: sharing_the_road
  question: 自転車の運転者が影響下での運転（DUI）で公共の安全を脅かすと判断された場合、その自転車はどうなる可能性がありますか？
  choices:
    A: 自転車は永久に没収され、直ちに売却される。
    B: 警察官はその場で自転車を破壊しなければならない。
    C: 合理的な代替案がない場合、警察官は自転車を押収することができる。
    D: 自転車を引き取るために500ドルの押収手数料が課される。
  answer: C
  explanation: 警察官が、公共の安全への脅威を軽減するために押収が必要であると判断し、かつ押収に代わる合理的な手段がない場合、自転車を押収することがあります。
- id: 308
  category: driver_responsibility
  question: 黙示の同意法（Implied Consent Law）とは何を意味しますか？
  choices:
    A: 警察がいつでも車両を捜索することを許可することに同意する。
    B: 血中アルコール濃度を測定するための呼気検査を受けることに同意する。
    C: 最初のDUI違反に対して有罪を認めることに同意する。
    D: 交通違反に関連するすべての罰金を支払うことに同意する。
  answer: B
  explanation: 黙示の同意法（Implied Consent Law）とは、自動車を運転する際、血中アルコール濃度を測定するための呼気検査を受けることに同意したとみなされることを意味します。
- id: 309
  category: penalties_and_points
  question: 初めての逮捕で、BAC呼気検査を拒否した場合の罰則は何ですか？
  choices:
    A: 免許が1年間取り消される。
    B: 免許が90日間停止される。
    C: 5,000ドルの罰金が科されるが、免許は維持できる。
    D: 初回の拒否については警告を受ける。
  answer: A
  explanation: 初めての逮捕で呼気検査を拒否した場合、免許は1年間取り消されます。
- id: 310
  category: penalties_and_points
  question: 過去7年以内で初めての逮捕であり、21歳以上で、呼気検査の結果がBAC .08以上であった場合、免許はどのくらいの期間停止されますか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 1年間
  answer: C
  explanation: 過去7年以内で初めての逮捕であり、21歳以上で、呼気または血液検査の結果がBAC .08以上であった場合、免許は90日間停止されます。
- id: 311
  category: license_system
  question: 運転免許停止中に、仕事、学校、または継続的な医療機関への通院のために運転を許可する制限付き免許の種類はどれですか？
  choices:
    A: イグニッション・インターロック免許 (IIL)
    B: 就労・制限付き運転免許 (ORL)
    C: 保護観察免許
    D: 起訴猶予免許
  answer: B
  explanation: 就労・制限付き運転免許 (ORL) は、仕事、学校、裁判所が命じたサービス、継続的な医療、扶養家族の継続的なサポート、または雇用プログラムのための運転を許可するものです。
- id: 312
  category: penalties_and_points
  question: アルコールや薬物に関連する違反は、運転記録にどのくらいの期間残りますか？
  choices:
    A: 5年間
    B: 7年間
    C: 10年間
    D: 生涯
  answer: D
  explanation: マニュアルによると、アルコールや薬物に関連する違反は、生涯にわたって運転記録に残ります。
- id: 313
  category: safe_driving_rules
  question: 「オープン・コンテナー法（開栓容器法）」に基づき、高速道路上の車両内でアルコールの開栓容器を保管することが合法な場所はどこですか？
  choices:
    A: グローブボックスの中
    B: センターコンソールの中
    C: 通常、運転者や同乗者が乗らない場所
    D: 運転席の下
  answer: C
  explanation: 高速道路上の車両内でアルコール飲料の開栓容器を保持することは交通違反ですが、通常、運転者や同乗者が乗らない場所に置かれている場合は除外されます。手の届く収納スペースに保管することはできません。
- id: 314
  category: license_system
  question: 酒気帯び運転（DUI）で有罪判決を受けた場合、または起訴猶予が認められた場合、保護観察免許（Probationary License）はどのくらいの期間必要ですか？
  choices:
    A: 1年間
    B: 2年間
    C: 5年間
    D: 10年間
  answer: C
  explanation: 酒気帯び運転（DUI）または車両を物理的に制御している状態での有罪判決を受けた場合、あるいは起訴猶予が認められた場合、5年間の保護観察免許が必要となります。
- id: 315
  category: penalties_and_points
  question: 酒気帯び運転（DUI）の起訴猶予プログラムは、生涯で何回利用できますか？
  choices:
    A: 1回
    B: 2回
    C: 3回
    D: 前回の起訴から7年が経過していれば無制限
  answer: A
  explanation: マニュアルには、「起訴猶予プログラムは生涯に1回しか利用できません」と明記されています。
- id: 316
  category: penalties_and_points
  question: 13歳から17歳で、初めてのアルコールまたは銃器に関する違反で有罪判決を受けた場合、運転免許はどのくらいの期間取り消されますか？
  choices:
    A: 90日間
    B: 6ヶ月間
    C: 1年間、または17歳になるまでのいずれか長い方
    D: 2年間、または18歳になるまでのいずれか長い方
  answer: C
  explanation: 13歳から17歳で、初めてのアルコールまたは銃器に関する違反で有罪判決を受けた場合、運転免許は1年間、または17歳になるまでのいずれか長い方の期間、取り消されます。
- id: 317
  category: alcohol_drugs_health
  question: マニュアルによると、ひどい風邪や首のこりなどで体調が優れないときに、どこかへ行く必要がある場合はどうすべきですか？
  choices:
    A: 市販薬を服用し、慎重に運転する。
    B: 制限速度よりも遅い速度で運転する。
    C: 他の人に運転してもらう。
    D: 運転前にカフェイン飲料を飲む。
  answer: C
  explanation: マニュアルでは、首のこり、咳、足の痛みといった小さな問題であっても、運転に影響を与える可能性があるとアドバイスしています。体調が良くないときにどこかへ行く必要がある場合は、他の人に運転してもらいましょう。
- id: 318
  category: alcohol_drugs_health
  question: ワシントン州において、てんかんを持つ人が運転できる条件は何ですか？
  choices:
    A: 3ヶ月間発作が起きていない場合。
    B: 6ヶ月間発作がなく、医師の管理下にある場合。
    C: 日中の時間帯のみ。
    D: 特殊な運転免許証を持っている場合。
  answer: B
  explanation: マニュアルによると、医師の管理下にあり、薬を服用しており、かつ6ヶ月間発作が起きていない場合は、ワシントン州で運転することができます。
- id: 319
  category: alcohol_drugs_health
  question: 糖尿病のドライバーが定期的に目の検査を受けるべきなのはなぜですか？
  choices:
    A: 夜盲症やその他の視力の問題をチェックするため。
    B: 500フィート先から道路標識が読めるか確認するため。
    C: インスリンによって目の色が変わることがあるため。
    D: 免許の医療免除を受ける資格を得るため。
  answer: A
  explanation: マニュアルには、糖尿病がある場合は、夜盲症やその他の視力の問題の可能性を確認するために、定期的に目の検査を受けるべきであると記載されています。
- id: 320
  category: driver_responsibility
  question: 運転前に怒っていたり興奮したりしているときは、どうすべきですか？
  choices:
    A: 制限速度をわずかに下回る速度で運転する。
    B: 気を紛らわせるために大音量で音楽を聴く。
    C: 頭を冷やす時間を作り、落ち着くまで運転を控える。
    D: 運転中に窓を開けて新鮮な空気を吸う。
  answer: C
  explanation: 感情は安全運転能力に影響を与えます。怒っていたり興奮したりしているときは、頭を冷やす時間を作り、必要であれば少し歩くなどして、落ち着くまで運転を控えてください。
- id: 321
  category: defensive_driving
  question: 他のドライバーに追跡されたり、嫌がらせを受けていると感じた場合、どのような行動が推奨されますか？
  choices:
    A: 直ちに停車し、相手のドライバーに立ち向かう。
    B: 相手をまくために、人通りのない場所へ運転する。
    C: 他の人や営業中の店がある場所でのみ車を降りる。
    D: 相手を怖がらせるために、急ブレーキをかける。
  answer: C
  explanation: 追跡されたり嫌がらせを受けたりしていると感じた場合は、助けを求め、周囲に他の人や営業中の店がある場所でのみ車を降りるようにしてください。
- id: 322
  category: defensive_driving
  question: ブレーキが突然効かなくなった場合、まず最初に行うべきことは何ですか？
  choices:
    A: 直ちにニュートラルにシフトする。
    B: ブレーキペダルを数回踏み込み（ポンピング）、圧力を高める。
    C: イグニッションを切り、エンジンを止める。
    D: パーキングブレーキをできるだけ速く、強く引く。
  answer: B
  explanation: ブレーキが効かなくなった場合、最初のステップはブレーキペダルを数回踏み込むことです。これにより、多くの場合、停止するのに十分なブレーキ圧が回復します。
- id: 323
  category: defensive_driving
  question: タイヤが突然パンク（バースト）した場合、どのようにブレーキをかけるべきですか？
  choices:
    A: 直ちに停止するために、ブレーキを強く踏み込む。
    B: ブレーキを素早く何度も踏む。
    C: アクセルペダルから足を離し、ブレーキを軽くかける。
    D: 車が自然に止まるまで、ブレーキを一切使用しない。
  answer: C
  explanation: タイヤがバーストした際は、アクセルペダルから足を離し、ブレーキを軽く使って徐々に減速する必要があります。
- id: 324
  category: vehicle_information
  question: 走行中にエンジンが停止（エンスト）した場合、どのようなことが予想されますか？
  choices:
    A: ハンドルが完全にロックされる。
    B: ブレーキが全く効かなくなる。
    C: ハンドルの操作が重くなり、ブレーキペダルを非常に強く踏み込む必要が生じる場合がある。
    D: 車両が自動的にニュートラルに切り替わる。
  answer: C
  explanation: エンジンが停止した場合、ハンドルの操作が困難になる（より強い力で回すことは可能）ことがあり、ブレーキは機能し続けますが、ブレーキペダルを非常に強く踏み込む必要があります。
- id: 325
  category: defensive_driving
  question: アクセルペダルが戻らなくなり、エンジンの回転が上がり続ける場合、正しい一連の行動は何ですか？
  choices:
    A: エンジンを切り、ニュートラルに入れ、道路脇に寄せる。
    B: ニュートラルに入れ、道路脇に寄せ、エンジンを切る。
    C: パーキングブレーキをかけ、エンジンを切り、パーキング（P）に入れる。
    D: 低速ギアに入れ、ブレーキを数回踏、エンジンを切る。
  answer: B
  explanation: アクセルペダルが戻らなくなった場合は、道路から目を離さず、素早くニュートラルにシフトし、安全を確認して道路脇に寄せた後、エンジンを切ってください。
- id: 326
  category: defensive_driving
  question: 衝突を回避しようとする際、ドライバーが取れる3つの選択肢は何ですか？
  choices:
    A: 停止する、曲がる、または加速する。
    B: ブレーキをかける、クラクションを鳴らす、または急ハンドルを切る。
    C: 停止する、バックする、またはクラクションを鳴らす。
    D: 加速する、ブレーキをかける、または衝撃に備えて身を構える。
  answer: A
  explanation: 衝突を回避する方法として、マニュアルには「停止する」「曲がる」「加速する」の3つの選択肢が記載されています。
- id: 327
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）を搭載した車両で緊急ブレーキをかける場合、どのようにすべきですか？
  choices:
    A: スリップを防ぐために、ブレーキペダルを素早く何度も踏む。
    B: ブレーキペダルをできるだけ強く踏み込み、そのまま踏み続ける。
    C: ブレーキペダルを軽く踏み、徐々に力を強める。
    D: ブレーキペダルを踏み、一度離してから、ハンドルを切る。
  answer: B
  explanation: ABS搭載車で急停止が必要な場合は、ブレーキペダルをできるだけ強く踏み込み、緩めることなくそのまま踏み続けてください。
- id: 328
  category: defensive_driving
  question: ABSが搭載されていない車両で、衝突を避けるために素早く曲がるための適切な手順は何ですか？
  choices:
    A: ブレーキペダルをできるだけ強く踏みながら、ハンドルを急に切る。
    B: ブレーキペダルを踏み、その後離してからハンドルを切る。
    C: ニュートラルに入れてからハンドルを切る。
    D: 曲がる前に後輪に荷重をかけるため、わずかに加速する。
  answer: B
  explanation: ABSがない場合、素早く曲がるには異なる手順が必要です。まずブレーキペダルを踏み、次にそれを離してからハンドルを切ります。
- id: 329
  category: safe_driving_rules
  question: 車両のスリップ（横滑り）の主な原因は何ですか？
  choices:
    A: 状況に対して速度を出しすぎていること。
    B: タイヤの空気圧不足。
    C: ブレーキを急激に何度も踏むこと。
    D: トランクに重い荷物を積んで運転すること。
  answer: A
  explanation: マニュアルには、スリップはドライバーが状況に対して速度を出しすぎていることによって引き起こされると明記されています。
- id: 330
  category: defensive_driving
  question: 車両がスリップし始めた場合、どうすべきですか？
  choices:
    A: 車を素早く止めるために、ブレーキを強く踏み込む。
    B: スリップしている方向とは逆の方向にハンドルを切る。
    C: ブレーキを踏まず、車を進めたい方向にハンドルを切る。
    D: 低速ギアに入れ、パーキングブレーキをかける。
  answer: C
  explanation: 車両がスリップし始めたら、ブレーキを踏まずに、車を進めたい方向にハンドルを切ってください。
- id: 331
  category: defensive_driving
  question: 追突されそうになったとき、どのように身を守るべきですか？
  choices:
    A: ハンドルに向かって前かがみになる。
    B: 座席の背もたれに体を押しつけ、ヘッドレストに頭を固定する。
    C: すぐに車から出られるようにシートベルトを外す。
    D: むち打ちを防ぐために体を横に向ける。
  answer: B
  explanation: 追突された場合、体は後ろに投げ出されます。座席の背もたれに体を押しつけ、ヘッドレストに頭を固定し、ブレーキを踏む準備をしてください。
- id: 332
  category: vehicle_information
  question: 側面衝突された場合、なぜラップベルトとショルダーベルトが特に重要なのですか？
  choices:
    A: サイドエアバッグの作動を誘発するため。
    B: 車のドアがへこむのを防ぐため。
    C: この状況ではエアバッグは役に立たず、ベルトが運転席に留めてくれるため。
    D: 衝撃時に自動的にブレーキをかけるため。
  answer: C
  explanation: 側面から衝突された場合、体は衝突された側に投げ出されます。マニュアルには、この状況ではエアバッグは役に立たないと記されており、運転席に留まるためにはラップベルトとショルダーベルトが必要です。
- id: 333
  category: defensive_driving
  question: 衝突が避けられない場合、衝撃を最小限に抑えるために何をすべきですか？
  choices:
    A: できるだけ強くブレーキをかけ、正面衝突に備える。
    B: 正面から衝突されるのではなく、かすめるような当たり方になるよう車を回転させる。
    C: 衝突される前に通り過ぎるよう加速する。
    D: 火災を防ぐために直ちにイグニッションを切る。
  answer: B
  explanation: マニュアルには、衝突が避けられない場合は、正面から衝突されるのではなく、かすめるような当たり方になるよう車を回転させるべきであると記載されています。
- id: 334
  category: driver_responsibility
  question: 衝突現場や火災現場で消防用ホースの上を走行することが法律で禁止されているのはなぜですか？
  choices:
    A: ホースを損傷させたり、消防士を負傷させたり、消火活動を妨げたりする可能性があるため。
    B: 車のタイヤが即座にパンクするため。
    C: 交通監視カメラによる違反切符が自動的に発行されるため。
    D: 近隣地域の水圧が低下するため。
  answer: A
  explanation: 消防用ホースの上を走行することは、ホースの損傷、消防士の負傷、または活動の妨げになる可能性があるため、法律で禁止されています。
- id: 335
  category: driver_responsibility
  question: 車両やその他の物件の損傷のみの衝突事故に遭った場合、車両に関して直ちに負うべき責任は何ですか？
  choices:
    A: 警察が到着するまで、車両をそのままの場所に置いておく。
    B: できるだけ早く、道路、高速道路、路肩、または中央分離帯から適切な場所へ車両を移動させる。
    C: 車両を移動させる前にレッカー車を待つ。
    D: ハザードランプを点灯させ、他の車に警告するために車線内に立つ。
  answer: B
  explanation: 車両やその他の物件の損傷のみのすべての衝突事故において、運転者は可能な限り速やかに出口ランプの路肩、交差する通り、またはその他の適切な場所へ、道路、高速道路、路肩、または中央分離帯から車両を移動させなければなりません。
- id: 336
  category: safe_driving_rules
  question: 衝突現場で負傷者を救護する際、誰を最初に助けるべきですか？
  choices:
    A: 歩き回って助けを求めている人。
    B: 歩いたり話したりしていない人。
    C: 相手車両の運転手。
    D: 炎上している車内に閉じ込められている人のみ。
  answer: B
  explanation: マニュアルでは、まず歩いたり話したりしていない人を助けるよう指示しています。呼吸を確認し、次に失血を確認してください。
- id: 337
  category: safe_driving_rules
  question: 衝突現場で負傷者に飲み物として何を与えるべきですか？
  choices:
    A: 脱水症状を防ぐために水のみ。
    B: ショック状態を防ぐために糖分を含む飲み物。
    C: 温かい飲み物のみ。
    D: 負傷者には何も飲ませてはいけない。
  answer: D
  explanation: マニュアルには「負傷者には、水であっても何も飲ませてはいけません」と明記されています。
- id: 338
  category: driver_responsibility
  question: どのような状況下で、4日以内に衝突報告書（Collision Report）を作成しなければなりませんか？
  choices:
    A: 金額に関わらず、衝突により物件の損傷が発生した場合。
    B: 衝突により負傷、死亡、または1人当たりの物件損害が1,000ドル以上発生し、かつ法執行官による報告が行われない場合。
    C: 無保険の運転者が関与する衝突の場合のみ。
    D: 駐車中の車に衝突し、所有者が見つからない場合。
  answer: B
  explanation: 衝突により負傷、死亡、または1人当たりの物件損害が1,000ドル以上発生し、かつ法執行官による報告が行われない場合は、4日以内に衝突報告書を作成しなければなりません。
- id: 339
  category: signs_and_signals
  question: 踏切にある青色の緊急通知システム（ENS）の標識には、どのような情報が記載されていますか？
  choices:
