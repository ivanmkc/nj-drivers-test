questions:
- id: 1
  category: driver_responsibility
  question: ワシントン州で賠償責任保険（liability insurance）の携帯義務を免除されているのは誰ですか？
  choices:
    A: レンタカーの運転手
    B: モペッド（原動機付自転車）の運転手
    C: 18歳未満の運転手
    D: 電気自動車の運転手
  answer: B
  explanation: マニュアルによると、政府車両、モペッド、および一般・契約運送業者の車両の運転手は、賠償責任保険の加入義務を免除されています。
- id: 2
  category: license_system
  question: 国内線の搭乗に標準運転免許証が使用できなくなるのはいつからですか？
  choices:
    A: 2024年5月7日
    B: 2025年5月7日
    C: 2025年1月1日
    D: 2026年10月1日
  answer: B
  explanation: 2025年5月7日までに、標準運転免許証は国内線の搭乗や一部の安全な連邦施設への立ち入りのための身分証明書として認められなくなります。
- id: 3
  category: safe_driving_rules
  question: 2歳未満の乳幼児に対するチャイルドシートの使用規定は何ですか？
  choices:
    A: 前向きのチャイルドシートを使用しなければならない。
    B: ブースターシートを使用しなければならない。
    C: 後ろ向きのチャイルドシートを使用しなければならない。
    D: 身長が十分に高ければ、標準のシートベルトを使用できる。
  answer: C
  explanation: マニュアルには、2歳未満の乳幼児は後ろ向き（rear-facing）の状態でチャイルドシートを使用しなければならないと記載されています。
- id: 4
  category: safe_driving_rules
  question: 子供がブースターシートの使用を止め、標準的な車両用シートベルト（腰・肩ベルト）を使用できるようになる一般的な身長はどれくらいですか？
  choices:
    A: 4フィート0インチ
    B: 4フィート5インチ
    C: 4フィート9インチ
    D: 5フィート0インチ
  answer: C
  explanation: 4歳以上の子供は、身長が4フィート9インチに達し、車両のシートベルト（腰・肩ベルト）が適切にフィットするようになるまで、ブースターシートを使用しなければなりません。
- id: 5
  category: vehicle_information
  question: 子供用のブースターシートの使用義務が免除されるのはどの車両ですか？
  choices:
    A: 腰ベルトのみ（lap-only）のシートベルトが装備されている車両
    B: 2005年以前に製造された車両
    C: サイドエアバッグを装備している車両
    D: 一般・契約運送業者の車両
  answer: A
  explanation: マニュアルでは、腰ベルトのみ（lap-only）のシートベルトが装備されている車両は、ブースターシートの使用義務が免除されると規定されています。
- id: 6
  category: penalties_and_points
  question: 標識のある道路工事区域（work zone）内での交通違反の罰金はどうなりますか？
  choices:
    A: 初犯の場合は免除される。
    B: 2倍になることがある。
    C: 半分に減額される。
    D: 自動的に免許停止となる。
  answer: B
  explanation: ドライバーは標識のある工事区域内ではすべての指示に従い、速度を落とさなければなりません。工事区域内では交通違反の罰金が2倍になることがあります。
- id: 7
  category: safe_driving_rules
  question: 「Move Over/Slow Down（車線変更または減速）」法に基づき、点滅灯をつけた緊急車両の横を通過する際、隣の車線に移動できない場合はどうしなければなりませんか？
  choices:
    A: 車両が立ち去るまで完全に停止する。
    B: 速度を維持したままクラクションを鳴らす。
    C: 掲示されている制限速度より時速10マイル（10 mph）以上減速する。
    D: 掲示されている制限速度より時速20マイル（20 mph）以上減速する。
  answer: C
  explanation: 点滅灯をつけた緊急対応車両の横を通過する際は、可能であれば1車線空けるように移動しなければなりません。移動できない場合は、掲示されている制限速度より時速10マイル（10
    mph）以上減速する必要があります。
- id: 8
  category: sharing_the_road
  question: 「Move Over/Slow Down」法において、緊急対応車両（emergency response vehicle）とみなされるのは次のうちどれですか？
  choices:
    A: スクールバス
    B: 廃棄物収集車およびレッカー車
    C: 配送バン
    D: 公共路線バス
  answer: B
  explanation: 緊急対応車両には、法執行機関、消防・救急、事故対応、道路維持管理、公共事業、廃棄物収集、およびレッカー車が含まれます。
- id: 9
  category: signs_and_signals
  question: 標識や信号機に加えて、交通規制を行うことができるのは次のうち誰ですか？
  choices:
    A: 横断歩道にいる歩行者
    B: 学童擁護員（交通指導員）
    C: すべての免許保持者
    D: 近隣監視ボランティア
  answer: B
  explanation: 交通規制は、警察官などの法執行官、道路建設・維持管理作業員、または学童擁護員（school crossing guards）によっても行われることがあります。
- id: 10
  category: license_system
  question: 免許局（DOL）のオンラインサービスで、支払いに使用できないものは次のうちどれですか？
  choices:
    A: Visaデビットカード
    B: MasterCardクレジットカード
    C: American Express
    D: ギフトカード
  answer: D
  explanation: オンラインサービスで利用可能な支払い方法には、Visa、MasterCard、またはAmerican Expressのデビットカードまたはクレジットカードが含まれます（ギフトカードは利用できません）。
- id: 11
  category: driver_responsibility
  question: 運転記録の要約（アブストラクト）には、次のうちどれが含まれますか？
  choices:
    A: 駐車違反切符
    B: 信用履歴
    C: 出頭拒否通知
    D: 車両整備記録
  answer: C
  explanation: 州は、免許申請、交通違反、自動車違反の有罪判決、衝突事故への関与、および出頭拒否通知の記録を保持しています。
- id: 12
  category: license_system
  question: ワシントン州の身分証明書のうち、REAL IDに準拠し、米国内の空路移動に有効なものはどれですか？
  choices:
    A: 標準運転免許証
    B: 強化運転免許証 (EDL)
    C: 仮運転許可証
    D: 有権者登録証
  answer: B
  explanation: ワシントン州の強化運転免許証（EDL）はREAL IDに準拠しており、米国内の空路移動に有効です。
- id: 13
  category: safe_driving_rules
  question: ブースターシートを卒業した子供に対して、シートベルトはどのように装着すべきですか？
  choices:
    A: 腹部と首にかかるように
    B: 脇の下や背中の後ろに
    C: 腰骨の上に、そして肩と胸にぴったりと沿うように
    D: 動きを妨げないよう、腰に緩めに
  answer: C
  explanation: シートベルトは、衝突時に子供を安全に拘束するために、腰骨の上にあり、肩と胸にぴったりと沿っている必要があります。腹部や首にかかってはいけません。
- id: 14
  category: signs_and_signals
  question: 学校の横断歩道および歩行者横断の警戒標識は何色ですか？
  choices:
    A: 赤またはオレンジ
    B: 蛍光緑色または黄色
    C: 白または黒
    D: 青または緑
  answer: B
  explanation: 「警戒標識」のセクションによると、学校の横断歩道および歩行者横断の標識の色は、蛍光緑色または黄色です。
- id: 15
  category: license_system
  question: 15歳以上でワシントン州の最初の運転免許証を取得する場合、窓口を訪れる前に時間を節約できるオンラインサービスは何ですか？
  choices:
    A: オンライン運転試験
    B: 事前申請サービス
    C: バーチャル視力検査
    D: オンライン指紋採取
  answer: B
  explanation: 15歳以上の方、または州外から転入された方は、オンラインの事前申請サービスをご利用ください。これにより、窓口を訪れる際の時間を節約できます。
- id: 16
  category: vehicle_information
  question: 提供されたテキストによると、次の車両登録手続きのうち、オンラインで完了できるものはどれですか？
  choices:
    A: カスタムナンバープレートのデザイン申請
    B: 車両登録更新（タブの更新）
    C: 駐車違反切符の異議申し立て
    D: 運転試験の予約
  answer: B
  explanation: マニュアルでは、オンライン車両登録サービスの中に「車両登録更新（タブの更新）」が記載されています。
- id: 17
  category: vehicle_information
  question: 地域交通局（RTA）の物品税を見積もる必要がある場合、マニュアルではどのように行うよう示されていますか？
  choices:
    A: 地元の警察署で
    B: オンライン車両登録サービスを通じて
    C: 免許局（DOL）に電話して
    D: 車両検査場で
  answer: B
  explanation: テキストには、利用可能なオンライン車両登録サービスの一つとして「地域交通局（RTA）物品税の見積もり」が記載されています。
- id: 18
  category: vehicle_information
  question: マニュアルのオンラインサービスによると、「フリート（車両群）」の住所変更は、最低何台以上の車両に適用されますか？
  choices:
    A: 2台以上
    B: 3台以上
    C: 5台以上
    D: 10台以上
  answer: C
  explanation: オンラインサービスのセクションには、「住所変更：フリート（5台以上の車両）」と明記されています。
- id: 19
  category: penalties_and_points
  question: マニュアルによると、次のヒアリング（聴聞会）申請のうち、オンラインで提出できるものはどれですか？
  choices:
    A: スピード違反切符のヒアリング
    B: DUI（飲酒・薬物影響下運転）ヒアリング申請
    C: 駐車違反のヒアリング
    D: 信号無視カメラのヒアリング
  answer: B
  explanation: テキストには、オンライン記録サービスの中に「DUIヒアリング申請の提出」が明示的に記載されています。
- id: 20
  category: safe_driving_rules
  question: 「運転する前に」のセクションで、必要なステップとして記載されているのは次のうちどれですか？
  choices:
    A: 車両の排ガスチェック
    B: 積載物の固定
    C: ヘッドライトのアップグレード
    D: タイヤのローテーション
  answer: B
  explanation: 目次では、「運転する前に」の章のトピックとして「積載物の固定」が記載されています。
- id: 21
  category: safe_driving_rules
  question: 「道路のルール（Rules of the Road）」のセクションで扱われているトピックは次のうちどれですか？
  choices:
    A: タイヤのパンク
    B: HOTレーンおよび急行有料レーン（Express Toll Lanes）
    C: ブレーキの故障
    D: 所有権証明書
  answer: B
  explanation: 目次では、「道路のルール」の章に「HOTレーンおよび急行有料レーン」が記載されています。
- id: 22
  category: vehicle_information
  question: 目次によると、「低速バッテリー電気自動車（Low-speed Battery Electric Vehicles）」に関する情報はどこに記載されていますか？
  choices:
    A: 運転免許証
    B: 道路のルール
    C: 運転に適した状態
    D: 車両登録
  answer: B
  explanation: 「低速バッテリー電気自動車」に関する情報は、マニュアルの「道路のルール」セクションにあります。
- id: 23
  category: safe_driving_rules
  question: 「わき見運転（Distracted Driving）」と「個人用電子機器」のトピックは、マニュアルのどのセクションにありますか？
  choices:
    A: 安全運転のヒント
    B: 緊急事態
    C: 車両登録
    D: 運転する前に
  answer: A
  explanation: 目次では、「安全運転のヒント」の章に「わき見運転」と「個人用電子機器」が分類されています。
- id: 24
  category: defensive_driving
  question: 「アクセルペダルが戻らなくなった（Gas Pedal Sticks）」状況に陥った場合、マニュアルのどのセクションにガイダンスが記載されていますか？
  choices:
    A: 道路のルール
    B: 安全運転のヒント
    C: 緊急事態
    D: 運転に適した状態
  answer: C
  explanation: 目次では、「アクセルペダルが戻らなくなった」というトピックは「緊急事態」の章に記載されています。
- id: 25
  category: alcohol_drugs_health
  question: 「運転に適した状態（In Shape to Drive）」セクションにおいて、飲酒運転と並んで具体的に取り上げられているトピックは次のうちどれですか？
  choices:
    A: 運転中の食事
    B: 大麻およびその他の薬物
    C: 大音量で音楽を聴くこと
    D: 同乗者との会話
  answer: B
  explanation: 「運転に適した状態」の章では、「飲酒運転」のトピックの直後に「大麻」と「その他の薬物」が具体的に記載されています。
- id: 26
  category: vehicle_information
  question: 「車両登録（Vehicle Licensing）」の下にある具体的なトピックとして記載されているのは次のうちどれですか？
  choices:
    A: 売却報告（Report of Sale）
    B: 座席とミラーの調整
    C: リバーシブルレーン
    D: 衝突の回避
  answer: A
  explanation: 目次では、「車両登録」の章に「売却報告」が記載されています。
- id: 27
  category: sharing_the_road
  question: 「安全運転のヒント（Safe Driving Tips）」セクションにおいて、道路の共有と並んで、どの特定のグループの責任が強調されていますか？
  choices:
    A: 歩行者の責任
    B: 自転車利用者およびモーターサイクル運転者の責任
    C: 商用トラック運転者の責任
    D: 法執行機関の責任
  answer: B
  explanation: 目次では、「安全運転のヒント」の章に「自転車利用者の責任」と「モーターサイクル運転者の責任」が記載されています。
- id: 28
  category: license_system
  question: マニュアルには「性犯罪者/誘拐犯罪者登録」に関する特定のセクションがありますが、それはどの主要な章に含まれていますか？
  choices:
    A: 道路のルール
    B: 運転免許証
    C: 運転に適した状態
    D: 緊急事態
  answer: B
  explanation: 目次では、「性犯罪者/誘拐犯罪者登録」は「運転免許証」の章に配置されています。
- id: 29
  category: defensive_driving
  question: 目次によると、「緊急事態（Emergencies）」の章の一部と見なされるのは次のうちどれですか？
  choices:
    A: 交通状況への適応
    B: スリップへの対処（Dealing with Skids）
    C: 追い越し時を除き右側を走行すること
    D: スキャニング（周囲の確認）
  answer: B
  explanation: 「スリップへの対処」というトピックは、「緊急事態」の章に記載されています。
- id: 30
  category: vehicle_information
  question: 「車両登録（Vehicle Licensing）」セクションで具体的に説明されている文書は次のうちどれですか？
  choices:
    A: 本人確認書類
    B: 所有権証明書（タイトル）
    C: REAL ID
    D: 仮免許（Probationary License）
  answer: B
  explanation: 目次では、「車両登録」の章に「所有権証明書（タイトル）」が記載されています。
- id: 31
  category: license_system
  question: ワシントン州の居住者になった後、新しい居住者は何日以内にワシントン州の運転免許証を取得しなければなりませんか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: マニュアルによると、新しい居住者は居住者になった日から30日以内にワシントン州の運転免許証を取得しなければなりません。
- id: 32
  category: license_system
  question: 免許取得の目的において、次のうちどの行為によってワシントン州の居住者とみなされますか？
  choices:
    A: 3ヶ月の休暇で州を訪れる
    B: 州内で有権者登録を行う
    C: ホテルの部屋を2週間借りる
    D: 大陸横断旅行で州内をドライブする
  answer: B
  explanation: マニュアルには、州内授業料の支払いや州の給付金の受領などの基準に加え、この州で有権者登録を行った場合に居住者となると記載されています。
- id: 33
  category: license_system
  question: 非居住者または短期訪問者が、有効な他州の免許証を持ってワシントン州で自動車を運転するには、何歳以上である必要がありますか？
  choices:
    A: 15歳以上
    B: 15歳半以上
    C: 16歳以上
    D: 18歳以上
  answer: C
  explanation: 非居住者または短期訪問者の場合、出身州の有効な運転免許証を所持しており、かつ16歳以上であれば、この州で自動車を運転することができます。
- id: 34
  category: license_system
  question: 2023年5月3日以降、ワシントン州の標準的な運転免許証は引き続き何に有効ですか？
  choices:
    A: 国内線の搭乗
    B: 安全な軍事基地への立ち入り
    C: 原子力発電所への立ち入り
    D: 州境を越える運転や列車の利用
  answer: D
  explanation: 標準的な免許証は、国内線の搭乗や安全な連邦施設への立ち入りには認められなくなりますが、ワシントン州内での運転、州境を越える運転、列車の利用など、米国内の移動には引き続き使用できます。
- id: 35
  category: driver_responsibility
  question: 学習許可証（Instruction Permit）で車両を運転する際、誰が監督しなければなりませんか？
  choices:
    A: 18歳以上の免許保有者
    B: 少なくとも5年間の運転経験がある免許保有者
    C: 25歳以上の免許保有者
    D: 親または法的保護者のみ
  answer: B
  explanation: 学習許可証（Instruction Permit）を使用すると、少なくとも5年間の運転経験がある免許保有者の監督下で自動車を運転することができます。
- id: 36
  category: safe_driving_rules
  question: 学習許可証（Instruction Permit）の保持者に同行する際、監督する運転者はどこに座らなければなりませんか？
  choices:
    A: 運転者の真後ろの後部座席
    B: 車内のどこでもよい
    C: 助手席（右フロントシート）
    D: 後部座席の助手席側
  answer: C
