  choices:
    A: The rain mixes with dust to form a thick mud.
    B: Heat causes the oil in the asphalt to come to the surface.
    C: The sudden cooling of the road creates a layer of black ice.
    D: The water creates an instant hydroplaning effect.
  answer: B
  explanation: If it starts to rain on a hot day, the pavement can be very slippery
    for the first few minutes because heat causes the oil in the asphalt to come to
    the surface.
