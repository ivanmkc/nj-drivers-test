metadata:
  source: 2025 Washington Driver Guide (dol.wa.gov)
  total_questions: 376
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: Who is exempt from the requirement to carry liability insurance in Washington?
  choices:
    A: Drivers of rental cars
    B: Drivers of mopeds
    C: Drivers under 18 years of age
    D: Drivers of electric vehicles
  answer: B
  explanation: According to the manual, drivers of government vehicles, mopeds, and
    common or contract carrier vehicles are exempt from the liability insurance requirement.
- id: 2
  category: license_system
  question: By what date will standard driver licenses no longer be acceptable for
    boarding domestic flights?
  choices:
    A: May 7, 2024
    B: May 7, 2025
    C: January 1, 2025
    D: October 1, 2026
  answer: B
  explanation: By May 7, 2025, standard driver licenses will no longer be an acceptable
    form of identification for boarding domestic flights and entering some secure
    federal facilities.
- id: 3
  category: safe_driving_rules
  question: What is the child restraint requirement for infants and children under
    two years old?
  choices:
    A: They must use a forward-facing child safety restraint system.
    B: They must use a booster seat.
    C: They must use a rear-facing child safety restraint system.
    D: They can use a standard seat belt if they are tall enough.
  answer: C
  explanation: The manual states that infants and children under two must use a child
    safety restraint system in the rear-facing position.
- id: 4
  category: safe_driving_rules
  question: At what height can a child typically stop using a booster seat and use
    a standard vehicle lap and shoulder belt?
  choices:
    A: 4'0"
    B: 4'5"
    C: 4'9"
    D: 5'0"
  answer: C
  explanation: Children four or older must use a booster seat until they are 4'9"
    tall and can properly fit the vehicle lap and shoulder belt.
- id: 5
  category: vehicle_information
  question: Which vehicles are exempt from the requirement to use a booster seat for
    children?
  choices:
    A: Vehicles equipped with lap-only seat belts
    B: Vehicles manufactured before 2005
    C: Vehicles with side airbags
    D: Common or contract carrier vehicles
  answer: A
  explanation: The manual specifies that vehicles equipped with lap-only seat belts
    are exempt from the requirement to use a booster seat.
- id: 6
  category: penalties_and_points
  question: What can happen to traffic fines in a marked work zone area?
  choices:
    A: They are waived for first-time offenders.
    B: They can double.
    C: They are reduced by half.
    D: They result in an automatic license suspension.
  answer: B
  explanation: Motorists must obey all directions and reduce speeds in any marked
    work zone, and traffic fines can double in a work zone area.
- id: 7
  category: safe_driving_rules
  question: Under the Move Over/Slow Down law, if you cannot move over one lane when
    passing an emergency vehicle with flashing lights, what must you do?
  choices:
    A: Stop completely until the vehicle leaves.
    B: Maintain your speed but honk your horn.
    C: Reduce your speed to 10 mph below the posted speed limit.
    D: Reduce your speed to 20 mph below the posted speed limit.
  answer: C
  explanation: When passing emergency response vehicles with flashing lights, you
    must move over one lane if possible, and if not, reduce your speed to 10 mph below
    the posted speed limit.
- id: 8
  category: sharing_the_road
  question: Which of the following is considered an emergency response vehicle under
    the Move Over/Slow Down law?
  choices:
    A: School buses
    B: Solid waste and tow trucks
    C: Delivery vans
    D: Public transit buses
  answer: B
  explanation: Emergency response vehicles include law enforcement, fire/ambulance,
    incident response, highway maintenance, utility, solid waste and tow trucks.
- id: 9
  category: signs_and_signals
  question: In addition to signs and signals, who among the following can provide
    traffic control?
  choices:
    A: Pedestrians in a crosswalk
    B: School crossing guards
    C: Any licensed driver
    D: Neighborhood watch volunteers
  answer: B
  explanation: Traffic control also can be provided by law enforcement, highway construction
    or maintenance personnel, or school crossing guards.
- id: 10
  category: license_system
  question: Which of the following is NOT an acceptable form of payment for online
    services at the Department of Licensing?
  choices:
    A: Visa debit card
    B: MasterCard credit card
    C: American Express
    D: Gift cards
  answer: D
  explanation: Acceptable forms of payment for online services include Visa, MasterCard,
    or American Express debit or credit cards (gift cards not accepted).
- id: 11
  category: driver_responsibility
  question: Which of the following is included in your driving record abstract?
  choices:
    A: Parking tickets
    B: Credit history
    C: Failure-to-Appear notices
    D: Vehicle maintenance records
  answer: C
  explanation: The state keeps a record of license applications, traffic infractions,
    convictions for motor vehicle violations, collision involvement, and Failure-to-Appear
    notices.
- id: 12
  category: license_system
  question: What type of Washington identification is REAL ID compliant and valid
    for air travel within the United States?
  choices:
    A: Standard driver license
    B: Enhanced driver license (EDL)
    C: Temporary driver permit
    D: Voter registration card
  answer: B
  explanation: Washington’s enhanced driver licenses (EDLs) are REAL ID compliant
    and valid for air travel within the United States.
- id: 13
  category: safe_driving_rules
  question: How should a seat belt be positioned on a child who has outgrown a booster
    seat?
  choices:
    A: Across the stomach area and neck
    B: Under the arm or behind the back
    C: Across the hip bones and snug across the shoulder and chest
    D: Loosely across the waist to allow movement
  answer: C
  explanation: A seat belt should lie across the hip bones and be snug across the
    shoulder and chest to restrain the child safely in a crash. It should not rest
    on the stomach area or across the neck.
- id: 14
  category: signs_and_signals
  question: What colors can School Crossing and Pedestrian Crossing warning signs
    be?
  choices:
    A: Red or orange
    B: Fluorescent green or yellow
    C: White or black
    D: Blue or green
  answer: B
  explanation: According to the Warning Signs section, the color for School Crossing
    and Pedestrian Crossing signs can be fluorescent green or yellow.
- id: 15
  category: license_system
  question: If you are 15 years of age or older and getting your first Washington
    driver license, what online service can save you time before visiting an office?
  choices:
    A: Online driving test
    B: Pre-application service
    C: Virtual vision screening
    D: Online fingerprinting
  answer: B
  explanation: If you are 15 years of age or older, or are new to the state, use our
    online pre-application service. This will save you time when you visit our office.
- id: 16
  category: vehicle_information
  question: According to the provided text, which of the following vehicle registration
    tasks can be completed online?
  choices:
    A: Requesting a custom license plate design
    B: Renewing your vehicle tabs
    C: Disputing a parking ticket
    D: Scheduling a driving test
  answer: B
  explanation: The manual lists 'Renew your vehicle tabs' under the online Vehicle
    Registration services.
- id: 17
  category: vehicle_information
  question: If you need to estimate your Regional Transit Authority (RTA) excise tax,
    how does the manual indicate you can do this?
  choices:
    A: At a local police station
    B: Through the online vehicle registration services
    C: By calling the Department of Licensing
    D: At a vehicle inspection station
  answer: B
  explanation: The text lists 'Estimate your Regional Transit Authority (RTA) excise
    tax' as one of the available online Vehicle Registration services.
- id: 18
  category: vehicle_information
  question: According to the manual's online services, a 'Fleet' address change applies
    to a minimum of how many vehicles?
  choices:
    A: 2 or more
    B: 3 or more
    C: 5 or more
    D: 10 or more
  answer: C
  explanation: 'The online services section specifies ''Change address: Fleets (5
    or more vehicles)''.'
- id: 19
  category: penalties_and_points
  question: Which of the following hearing requests can be submitted online according
    to the manual?
  choices:
    A: Speeding ticket hearing
    B: DUI hearing request
    C: Parking violation hearing
    D: Red light camera hearing
  answer: B
  explanation: The text explicitly lists 'Submit your DUI hearing request' under the
    online record services.
- id: 20
  category: safe_driving_rules
  question: Under the 'Before You Drive' section, which of the following is listed
    as a necessary step?
  choices:
    A: Checking the vehicle's exhaust emissions
    B: Securing your load
    C: Upgrading your headlights
    D: Rotating your tires
  answer: B
  explanation: The Table of Contents lists 'Secure Your Load' as a topic under the
    'Before You Drive' chapter.
- id: 21
  category: safe_driving_rules
  question: Which of the following topics is covered under the 'Rules of the Road'
    section?
  choices:
    A: Tire Blowout
    B: Hot Lanes & Express Toll Lanes
    C: Brake Failure
    D: Certificate of Ownership
  answer: B
  explanation: The Table of Contents lists 'Hot Lanes & Express Toll Lanes' under
    the 'Rules of the Road' chapter.
- id: 22
  category: vehicle_information
  question: According to the Table of Contents, where would you look to find information
    about 'Low-speed Battery Electric Vehicles'?
  choices:
    A: The Driver License
    B: Rules of the Road
    C: In Shape to Drive
    D: Vehicle Licensing
  answer: B
  explanation: Information on 'Low-speed Battery Electric Vehicles' is located in
    the 'Rules of the Road' section of the manual.
- id: 23
  category: safe_driving_rules
  question: The topics of 'Distracted Driving' and 'Personal Electronic Devices' are
    found in which section of the manual?
  choices:
    A: Safe Driving Tips
    B: Emergencies
    C: Vehicle Licensing
    D: Before You Drive
  answer: A
  explanation: The Table of Contents places 'Distracted Driving' and 'Personal Electronic
    Devices' under the 'Safe Driving Tips' chapter.
- id: 24
  category: defensive_driving
  question: If you experience a situation where the 'Gas Pedal Sticks', which section
    of the manual provides guidance?
  choices:
    A: Rules of the Road
    B: Safe Driving Tips
    C: Emergencies
    D: In Shape to Drive
  answer: C
  explanation: The 'Gas Pedal Sticks' topic is listed under the 'Emergencies' chapter
    in the Table of Contents.
- id: 25
  category: alcohol_drugs_health
  question: According to the 'In Shape to Drive' section, which of the following topics
    is specifically addressed alongside drinking and driving?
  choices:
    A: Eating while driving
    B: Marijuana and other drugs
    C: Listening to loud music
    D: Talking to passengers
  answer: B
  explanation: The 'In Shape to Drive' chapter specifically lists 'Marijuana' and
    'Other Drugs' immediately following the 'Drinking Alcohol and Driving' topics.
- id: 26
  category: vehicle_information
  question: Which of the following is listed as a specific topic under 'Vehicle Licensing'?
  choices:
    A: Report of Sale
    B: Adjusting Seat and Mirrors
    C: Reversible Lanes
    D: Avoiding Collisions
  answer: A
  explanation: The Table of Contents lists 'Report of Sale' under the 'Vehicle Licensing'
    chapter.
- id: 27
  category: sharing_the_road
  question: Under the 'Safe Driving Tips' section, which specific groups' responsibilities
    are highlighted alongside sharing the road?
  choices:
    A: Pedestrian Responsibilities
    B: Bicyclist and Motorcycle Responsibilities
    C: Commercial Truck Driver Responsibilities
    D: Law Enforcement Responsibilities
  answer: B
  explanation: The Table of Contents lists 'Bicyclist Responsibilities' and 'Motorcycle
    Responsibilities' under the 'Safe Driving Tips' chapter.
- id: 28
  category: license_system
  question: The manual includes a specific section on 'Sex-Offender/Kidnapping Offender
    Registration' under which main chapter?
  choices:
    A: Rules of the Road
    B: The Driver License
    C: In Shape to Drive
    D: Emergencies
  answer: B
  explanation: The Table of Contents places 'Sex-Offender/Kidnapping Offender Registration'
    in 'The Driver License' chapter.
- id: 29
  category: defensive_driving
  question: According to the Table of Contents, which of the following is considered
    part of the 'Emergencies' chapter?
  choices:
    A: Adjusting to Traffic
    B: Dealing with Skids
    C: Keeping Right Except to Pass
    D: Scanning
  answer: B
  explanation: The topic 'Dealing with Skids' is listed under the 'Emergencies' chapter.
- id: 30
  category: vehicle_information
  question: Which of the following documents is specifically discussed in the 'Vehicle
    Licensing' section?
  choices:
    A: Proof of Identity
    B: Certificate of Ownership (Title)
    C: Real ID
    D: Probationary License
  answer: B
  explanation: The Table of Contents lists 'Certificate of Ownership (Title)' under
    the 'Vehicle Licensing' chapter.
- id: 31
  category: license_system
  question: How many days do new residents have to get a Washington State driver license
    after becoming a resident?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the manual, new residents must get a Washington State
    driver license within 30 days of the date they become a resident.
- id: 32
  category: license_system
  question: Which of the following actions makes you a resident of Washington State
    for licensing purposes?
  choices:
    A: Visiting the state for a three-month vacation
    B: Registering to vote in the state
    C: Renting a hotel room for two weeks
    D: Driving through the state on a cross-country trip
  answer: B
  explanation: The manual states you are a resident if you register to vote in this
    state, among other criteria such as paying in-state tuition or receiving state
    benefits.
- id: 33
  category: license_system
  question: How old must a nonresident or short-term visitor be to operate a motor
    vehicle in Washington with a valid out-of-state license?
  choices:
    A: At least 15 years old
    B: At least 15 and a half years old
    C: At least 16 years old
    D: At least 18 years old
  answer: C
  explanation: If you are a nonresident or a short-term visitor, you can operate a
    motor vehicle in this state if you have a valid driver license from your home
    state and you are at least 16 years old.
- id: 34
  category: license_system
  question: After May 3, 2023, what is a standard Washington driver license still
    valid for?
  choices:
    A: Boarding domestic flights
    B: Entering secure military bases
    C: Entering nuclear power plants
    D: Driving across state lines or riding a train
  answer: D
  explanation: Even though a standard license will no longer be acceptable for boarding
    domestic flights or entering secure federal facilities, it will still work for
    U.S. travel like driving in Washington, across state lines, or riding a train.
- id: 35
  category: driver_responsibility
  question: Who must supervise a driver operating a vehicle with an Instruction Permit?
  choices:
    A: Any licensed driver over the age of 18
    B: A licensed driver with at least five years of licensed driving experience
    C: A licensed driver who is at least 25 years old
    D: Only a parent or legal guardian
  answer: B
  explanation: An Instruction Permit allows you to operate a motor vehicle while supervised
    by a licensed driver with at least five years of licensed driving experience.
- id: 36
  category: safe_driving_rules
  question: Where must the supervising driver sit when accompanying a driver with
    an Instruction Permit?
  choices:
    A: In the back seat directly behind the driver
    B: Anywhere in the vehicle
    C: In the right-front passenger seat
    D: In the back seat on the passenger side
  answer: C
  explanation: The manual specifies that the licensed driver supervising an Instruction
    Permit holder must sit in the right-front passenger seat.
- id: 37
  category: license_system
  question: At what age can a driver be issued an intermediate driver license in Washington?
  choices:
    A: 15 or 16 years old
    B: 16 or 17 years old
    C: 18 or 19 years old
    D: 21 years old
  answer: B
  explanation: If you are 16 or 17 and meet the requirements, Washington will issue
    you an intermediate license with restrictions.
- id: 38
  category: license_system
  question: How long is a standard Washington driver license valid for?
  choices:
    A: Up to 4 years from the date of your last birthday
    B: Up to 5 years from the date of your last birthday
    C: Up to 6 years from the date of your last birthday
    D: Up to 8 years from the date of your last birthday
  answer: C
  explanation: A standard driver license is valid for up to six years from the date
    of your last birthday.
- id: 39
  category: license_system
  question: What travel privilege does an Enhanced Driver License (EDL) provide that
    a standard license does not?
  choices:
    A: It allows you to board international flights to Europe.
    B: It allows you to cross the borders of Canada and Mexico by land or sea.
    C: It allows you to drive in foreign countries without an international permit.
    D: It allows you to bypass customs when returning to the United States.
  answer: B
  explanation: Washington's enhanced driver license (EDL) is REAL ID compliant, valid
    for air travel within the U.S., and can be used to cross the borders of Canada
    and Mexico by land or sea.
- id: 40
  category: license_system
  question: What is the minimum age to get an instruction permit if you are NOT enrolled
    in an approved driver-training course?
  choices:
    A: 15 years old
    B: 15-1/2 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: To be issued an instruction permit, you must be at least 15-1/2 years
    old, or 15 years old if enrolled in an approved driver-training course.
- id: 41
  category: driver_testing
  question: How many hours of driving experience must a parent or guardian certify
    you have completed before you can get an intermediate license?
  choices:
    A: 30 hours, including 5 hours at night
    B: 40 hours, including 10 hours at night
    C: 50 hours, including 10 hours at night
    D: 60 hours, including 15 hours at night
  answer: C
  explanation: You must show that your parent or guardian certifies you have had at
    least 50 hours of driving experience, including 10 hours at night.
- id: 42
  category: driver_testing
  question: To get an intermediate license, you must pass an approved driver-training
    course that includes at least how many hours of classroom instruction?
  choices:
    A: 10 hours
    B: 20 hours
    C: 30 hours
    D: 40 hours
  answer: C
  explanation: You must show proof that you have passed an approved driver-training
    course with at least 30 hours of classroom and six hours of behind-the-wheel instruction.
- id: 43
  category: safe_driving_rules
  question: What are the restricted driving hours for an intermediate driver license
    holder, unless accompanied by a qualifying person?
  choices:
    A: 10 p.m. to 5 a.m.
    B: 11 p.m. to 6 a.m.
    C: 12 a.m. to 5 a.m.
    D: 1 a.m. to 5 a.m.
  answer: D
  explanation: An intermediate license restricts you from driving between 1 a.m. and
    5 a.m. unless you are with a parent, a guardian, or a licensed driver who is at
    least 25 years old.
- id: 44
  category: safe_driving_rules
  question: During the first six months of holding an intermediate license, what is
    the restriction regarding passengers?
  choices:
    A: No passengers are allowed under any circumstances.
    B: No passenger under the age of 20 may be with you unless they are a member of
      your immediate family.
    C: You may only carry one passenger under the age of 20.
    D: You may carry any passengers as long as they are wearing seatbelts.
  answer: B
  explanation: For the first six months of an intermediate license, no passenger under
    the age of 20 may be with you while you drive unless that person is a member of
    your immediate family.
- id: 45
  category: license_system
  question: Under an intermediate license, you cannot drive between 1 a.m. and 5 a.m.
    unless accompanied by a parent, guardian, or a licensed driver who is at least
    what age?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: C
  explanation: The manual states that with an intermediate license, you cannot drive
    between 1 a.m. and 5 a.m. unless you are with a parent, a guardian, or a licensed
    driver who is at least 25 years old.
- id: 46
  category: license_system
  question: For the first six months of holding an intermediate license, who may ride
    as a passenger in your vehicle?
  choices:
    A: Up to three passengers under age 20
    B: No passengers under age 20 unless they are immediate family
    C: Any licensed driver under age 20
    D: Only passengers over the age of 25
  answer: B
  explanation: According to the manual, for the first six months of an intermediate
    license, no passenger under the age of 20 may be with you while you drive unless
    that person is a member of your immediate family.
- id: 47
  category: penalties_and_points
  question: What is the penalty for a second violation of intermediate license restrictions
    during the first year?
  choices:
    A: A warning letter is sent to your parent or guardian
    B: Your license is suspended for six months or until age 18
    C: Your license is suspended until age 21
    D: You must retake the driving test
  answer: B
  explanation: The manual states that for a second violation, you are suspended for
    six months (or until age 18 if that comes first).
- id: 48
  category: safe_driving_rules
  question: When is a driver with an intermediate license permitted to use a cell
    phone while operating a vehicle?
  choices:
    A: When using a hands-free device
    B: When stopped at a red light
    C: To report illegal activity or summon emergency help
    D: To get directions from a GPS application
  answer: C
  explanation: Intermediate license holders may not use a cell phone unless using
    the device to report illegal activity, summon medical or other emergency help,
    or prevent injury to a person or property.
- id: 49
  category: license_system
  question: At what age does an intermediate license automatically become a standard
    driver license without restrictions?
  choices:
    A: '18'
    B: '19'
    C: '20'
    D: '21'
  answer: A
  explanation: 'The manual states: "On your 18th birthday, your license will become
    a standard driver license without the intermediate license restrictions."'
- id: 50
  category: driver_testing
  question: How many questions must you answer correctly to pass the knowledge test?
  choices:
    A: 25 out of 30
    B: 32 out of 40
    C: 35 out of 40
    D: 40 out of 50
  answer: B
  explanation: The knowledge test is a multiple-choice test with 40 questions, and
    you must correctly answer 32 of them to pass the test.
- id: 51
  category: driver_testing
  question: How long is a passing score on the knowledge test valid?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: According to the manual, a passing test score on the knowledge test
    is good for two years.
- id: 52
  category: driver_testing
  question: Who is allowed in the vehicle with you and the examiner during the driving
    test?
  choices:
    A: A parent or guardian
    B: A foreign language interpreter
    C: A service animal or an interpreter for the deaf
    D: A licensed driving instructor
  answer: C
  explanation: The manual specifies that only you, the examiner, a service animal,
    and an interpreter for the deaf or hard of hearing are allowed in the vehicle
    during the test.
- id: 53
  category: driver_testing
  question: What must you do when backing your vehicle during the driving test?
  choices:
    A: Rely solely on your rearview mirror
    B: Turn your head and look to the rear
    C: Honk your horn before moving
    D: Use only your side mirrors
  answer: B
  explanation: During the test, you must turn your head and look to the rear for motor
    vehicles, bicyclists, and pedestrians when you are backing your vehicle.
- id: 54
  category: license_system
  question: How long can a renewed Washington driver license be valid?
  choices:
    A: Up to 4 years
    B: Up to 5 years
    C: Up to 6 years
    D: Up to 8 years
  answer: C
  explanation: 'The manual states: "Your renewed license can be valid for up to six
    years and will expire on your birthday."'
- id: 55
  category: license_system
  question: You must pay an additional late fee if you renew your license more than
    how many days after it has expired?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: According to the manual, if you renew your license more than 60 days
    after it has expired, you must pay an additional late fee.
- id: 56
  category: license_system
  question: How many days do you have to notify the Department of Licensing of an
    address or legal name change?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: You must notify the Department within ten days of an address change
    or a legal name change.
- id: 57
  category: penalties_and_points
  question: Which of the following is a reason you can lose your driver license?
  choices:
    A: Receiving a single parking ticket
    B: Refusing to allow a police officer to test you for alcohol
    C: Driving 5 mph over the speed limit
    D: Failing to renew your license one day after it expires
  answer: B
  explanation: The manual lists "refusing to allow a police officer to test you for
    alcohol" as one of the reasons you can lose your license.
- id: 58
  category: license_system
  question: If you choose not to remove an item that obstructs a full view of your
    face for your license photo (and do not have a medical or religious exception),
    what will happen?
  choices:
    A: Your license will be marked "Not Valid for Identification"
    B: You will be denied a driver license entirely
    C: You must pay an additional fee
    D: You will be issued a temporary permit instead
  answer: A
  explanation: The manual states that if you choose not to remove an obstruction to
    your face and head, your license will be marked "Not Valid for Identification."
- id: 59
  category: driver_testing
  question: Which of the following is a requirement for the vehicle you bring to your
    driving test?
  choices:
    A: It must be less than 10 years old
    B: It must have dual controls for the examiner
    C: It must be legally licensed, registered, and have no defective parts
    D: It must have an automatic transmission
  answer: C
  explanation: For the driving test, you must bring a vehicle that is legally licensed
    and registered, and it must not have defective parts.
- id: 60
  category: penalties_and_points
  question: If you are an uninsured driver involved in a collision, your license may
    be suspended for up to how long?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: The manual states that the Department of Licensing may suspend the
    license of an uninsured driver involved in a collision for up to three years.
- id: 61
  category: penalties_and_points
  question: Failing to settle a civil court judgment resulting from a collision can
    result in a license suspension for how many years?
  choices:
    A: 3 or more years
    B: 5 or more years
    C: 10 or more years
    D: 13 or more years
  answer: D
  explanation: Failing to settle a civil court judgment resulting from a collision
    can result in a suspension for 13 or more years.
- id: 62
  category: penalties_and_points
  question: Which of the following actions can result in the loss of your driver license?
  choices:
    A: Leaving a gas station without paying for fuel you have pumped.
    B: Parking more than 12 inches from the curb.
    C: Driving 5 mph over the speed limit on a highway.
    D: Failing to wash your vehicle regularly.
  answer: A
  explanation: According to the manual, you can lose your license for leaving a gas
    station without paying for fuel you have pumped.
- id: 63
  category: penalties_and_points
  question: How many traffic offenses must you receive while driving with an intermediate
    license to lose your driving privilege?
  choices:
    A: One or more
    B: Two or more
    C: Three or more
    D: Four or more
  answer: B
  explanation: You can lose your license for receiving two or more traffic offenses
    while driving with an intermediate license.
- id: 64
  category: penalties_and_points
  question: If you get a ticket and do not comply within 15 days, the court notifies
    the Department of Licensing. How many days do you then have to comply before your
    driving privilege is suspended?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: If you don't comply within 15 days, the court notifies the department
    and they mail a Notice of Suspension. You then have 45 days to comply or your
    driving privilege will be suspended.
- id: 65
  category: driver_responsibility
  question: Sex offenders and kidnapping offenders in Washington State must register
    with the county sheriff within how many days of establishing residence?
  choices:
    A: Three business days
    B: Five business days
    C: Ten business days
    D: Thirty days
  answer: A
  explanation: Sex offenders and kidnapping offenders in Washington State must register
    within three business days of establishing, or re-establishing, residence.
- id: 66
  category: license_system
  question: To register to vote at a driver licensing office, you must be a United
    States citizen, a Washington State resident, and at least what age?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: To register to vote, you must be a United States citizen whose civil
    rights are not currently revoked, a Washington State resident, and at least 18.
- id: 67
  category: license_system
  question: What happens if a male applicant under the age of 26 declines to register
    with the Selective Service System when applying for a driver's license?
  choices:
    A: His application will be immediately denied.
    B: He will be issued a restricted license.
    C: He may not be denied the requested document if he meets all other requirements.
    D: He must pay an additional fee to receive his license.
  answer: C
  explanation: An applicant who declines to register with the SSS may not be denied
    the requested document if they meet all of the other requirements to receive the
    requested document.
- id: 68
  category: license_system
  question: The Department of Licensing asks if you are a twin or triplet in cooperation
    with which institution for medical research?
  choices:
    A: Washington State University
    B: University of Washington
    C: LifeCenter Northwest
    D: The Department of Health
  answer: B
  explanation: The department asks if you are a twin or triplet in cooperation with
    the University of Washington, which has the largest twin registry in the United
    States.
- id: 69
  category: license_system
  question: Which of the following is permitted with an Enhanced Driver License but
    NOT with a Standard Driver License?
  choices:
    A: Operating a motor vehicle
    B: Domestic air travel
    C: Access to federal facilities that don't require ID
    D: International border crossing by land or sea
  answer: D
  explanation: An Enhanced Driver License allows international border crossing by
    land or sea, while a Standard Driver License does not.
- id: 70
  category: defensive_driving
  question: Risk is generated by all three components of the Highway Transportation
    System. What are these three components?
  choices:
    A: The driver, the vehicle, and the roadway environment
    B: The weather, the vehicle, and the driver
    C: The pedestrians, the roadway, and the weather
    D: The speed limit, the driver, and the vehicle
  answer: A
  explanation: 'Risk is generated by all three components of the Highway Transportation
    System: the driver, the vehicle, and the roadway environment.'
- id: 71
  category: safe_driving_rules
  question: According to Washington crash data from 2009 to 2011, what was the most
    common factor present in fatal crashes?
  choices:
    A: Speeding
    B: Running off the roadway
    C: Driver impairment
    D: Driver distraction
  answer: C
  explanation: Driver impairment was the most common factor, present in 50.1% of fatal
    crashes.
- id: 72
  category: driver_responsibility
  question: What is the leading cause of death for young people ages 16 to 25 in Washington?
  choices:
    A: Drug overdose
    B: Motor vehicle crashes
    C: Drowning
    D: Workplace accidents
  answer: B
  explanation: Motor vehicle crashes are the leading cause of death for young people
    ages 16 to 25 in Washington.
- id: 73
  category: penalties_and_points
  question: What may happen if you are caught driving while your privilege is suspended
    due to a Failure to Appear (FTA) violation?
  choices:
    A: You will be given a warning.
    B: You may be arrested and your vehicle may be impounded.
    C: Your vehicle will be confiscated permanently.
    D: You will be required to retake the driving test immediately.
  answer: B
  explanation: If you do not comply, your driving privilege is suspended. You may
    be arrested and your vehicle may be impounded if you are caught driving while
    your privilege is suspended.
- id: 74
  category: license_system
  question: Who is eligible to be issued a photo identification card by the Department
    of Licensing?
  choices:
    A: Only individuals over the age of 18.
    B: Only individuals who have passed a written driving test.
    C: Non-drivers of any age.
    D: Only individuals who have a suspended driver's license.
  answer: C
  explanation: 'The manual states: ''We issue photo identification cards to non-drivers
    of any age.'''
- id: 75
  category: driver_responsibility
  question: What is the minimum liability insurance required for property damage in
    any one collision in Washington?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: You must have an automobile liability policy that provides $10,000
    or more, payable for injury to or destruction of property of others in any one
    collision.
- id: 76
  category: driver_responsibility
  question: Which of the following vehicles is exempt from the state's liability insurance
    requirement?
  choices:
    A: Passenger cars manufactured after 1993
    B: Mopeds
    C: Sport utility vehicles (SUVs)
    D: Commercial delivery vans
  answer: B
  explanation: Drivers of government vehicles, mopeds, and common or contract carrier
    vehicles are exempt from this insurance requirement.
- id: 77
  category: vehicle_information
  question: What is the minimum legal tire tread depth in Washington?
  choices:
    A: 1/32 inch
    B: 2/32 inch
    C: 3/32 inch
    D: 4/32 inch
  answer: B
  explanation: If the tread does not come at least to Lincoln's head (2/32 inch) when
    checking with a penny, the tire is illegal and unsafe and needs to be replaced.
- id: 78
  category: vehicle_information
  question: When is the best time to check your tire air pressure?
  choices:
    A: Immediately after driving on the highway
    B: When the tires are cold
    C: During the hottest part of the day
    D: When the tires are warm to the touch
  answer: B
  explanation: The manual advises to check tire air pressure with an air pressure
    gauge when the tires are cold.
- id: 79
  category: vehicle_information
  question: Why should you never turn your vehicle's ignition to the 'lock' position
    while it is in motion?
  choices:
    A: It will cause the engine to overheat.
    B: It will drain the vehicle's battery.
    C: It will cause the steering to lock and you will lose control.
    D: It will permanently damage the transmission.
  answer: C
  explanation: Turning the ignition to 'lock' while in motion will cause the steering
    to lock if you try to turn the steering wheel, resulting in a loss of control
    of your vehicle.
- id: 80
  category: vehicle_information
  question: What is a potential danger of a leaky exhaust system?
  choices:
    A: It can cause your windshield to fog up.
    B: It can cause death inside a vehicle in a very short time.
    C: It will cause the steering wheel to shake.
    D: It increases the chance of a flat tire.
  answer: B
  explanation: Gases from a leaky exhaust can cause death inside a vehicle in a very
    short time. You should never run the motor in a closed garage.
- id: 81
  category: vehicle_information
  question: 'Passenger vehicles manufactured after 1993 are required to have:'
  choices:
    A: A third rear brake light mounted high in the center of the vehicle.
    B: Wipers for the rear windows and headlights.
    C: A backup camera system.
    D: Automatic emergency braking.
  answer: A
  explanation: Passenger trucks, cars, vans, and sport utility vehicles (SUVs) manufactured
    after 1993 must have a third rear brake light mounted high in the center of the
    vehicle.
- id: 82
  category: vehicle_information
  question: If your vehicle continues to bounce after a bump or a stop, which system
    likely needs to be checked by a mechanic?
  choices:
    A: Braking system
    B: Steering system
    C: Suspension system
    D: Exhaust system
  answer: C
  explanation: If the vehicle continues to bounce after a bump or a stop, or is hard
    to control, you may need new shocks or suspension parts and should have a mechanic
    check it.
- id: 83
  category: safe_driving_rules
  question: When is a load in a vehicle or trailer considered legally secure?
  choices:
    A: When it is tied down with at least one rope.
    B: When nothing can slide, shift, fall, sift onto the roadway, or become airborne.
    C: When it is covered by a tarp, even if it can shift.
    D: When the vehicle is traveling under 40 mph.
  answer: B
  explanation: A load must be securely fastened and is only considered secure when
    nothing can slide, shift, fall, or sift onto the roadway, or become airborne.
- id: 84
  category: penalties_and_points
  question: Under Maria's Law, what is the maximum penalty for failing to properly
    secure a load that causes an injury or death?
  choices:
    A: A $500 fine and a suspended license
    B: A misdemeanor charge and 30 days in jail
    C: A gross misdemeanor charge, up to one year in jail, and a $5,000 fine
    D: A felony charge and up to five years in prison
  answer: C
  explanation: A person who causes an injury or death by failing to secure a load
    properly can be charged with a gross misdemeanor and can face a maximum penalty
    of one year in jail and a $5,000 fine.
- id: 85
  category: penalties_and_points
  question: What charge can a driver face if their unsecured items cause property
    damage?
  choices:
    A: A traffic infraction
    B: A misdemeanor
    C: A gross misdemeanor
    D: A felony
  answer: B
  explanation: A driver whose unsecured items cause property damage can be charged
    with a misdemeanor.
- id: 86
  category: defensive_driving
  question: What should you do if you see a vehicle driving with an unsecured load?
  choices:
    A: Honk your horn continuously until they pull over.
    B: Pull up closely beside them to warn the driver.
    C: Stay as far away as possible and call 911 when it is safe.
    D: Flash your high beams to get their attention.
  answer: C
  explanation: If you see a vehicle driving with an unsecured load, you should stay
    as far away as possible and call 911 when it is safe for you to do so.
- id: 87
  category: vehicle_information
  question: What is a consequence of driving with unbalanced tires or low tire pressure?
  choices:
    A: It reduces fuel economy and makes the vehicle harder to steer and stop.
    B: It causes the engine to lose power and stall.
    C: It improves traction on wet roads.
    D: It causes the exhaust system to overheat.
  answer: A
  explanation: Unbalanced tires and low pressure cause faster tire wear, reduce fuel
    economy, and make the vehicle harder to steer and stop.
- id: 88
  category: driver_responsibility
  question: According to the manual, what percentage of highway litter comes from
    unsecured loads?
  choices:
    A: 20%
    B: 30%
    C: 40%
    D: 50%
  answer: C
  explanation: According to the Washington State Department of Ecology, roughly 40%
    of highway litter comes from unsecured loads, which causes hundreds of crashes
    per year.
- id: 89
  category: penalties_and_points
  question: What is the maximum penalty for driving with an unsecured load in Washington
    State?
  choices:
    A: 6 months in jail and a $1,000 fine
    B: 1 year in jail and a $5,000 fine
    C: 2 years in jail and a $10,000 fine
    D: A $500 fine and a 30-day license suspension
  answer: B
  explanation: The manual states that driving with an unsecured load carries a maximum
    penalty of one year in jail and a $5,000 fine.
- id: 90
  category: vehicle_information
  question: How much can dirt on the lenses of your headlights, backup, brake, and
    tail lights reduce the light they emit?
  choices:
    A: 10 percent
    B: 25 percent
    C: 50 percent
    D: 75 percent
  answer: C
  explanation: According to the manual, dirt on the lenses can reduce the light by
    50 percent.
- id: 91
  category: safe_driving_rules
  question: When adjusting your seat and steering wheel before driving, at least how
    much of the steering wheel should be between your hands?
  choices:
    A: One-quarter
    B: One-third
    C: One-half
    D: Two-thirds
  answer: B
  explanation: You should have clear vision in all directions, all controls should
    be within reach, and at least one-third of the steering wheel should be between
    your hands.
- id: 92
  category: safe_driving_rules
  question: How should you position your seat in relation to the vehicle's air bag?
  choices:
    A: So the air bag will hit you in the face
    B: So the air bag will hit you in the chest
    C: So the air bag will deploy above your head
    D: So the air bag will hit your stomach
  answer: B
  explanation: You should sit so the air bag will hit you in the chest if there is
    a collision.
- id: 93
  category: vehicle_information
  question: How should you adjust your side mirrors to best see the traffic behind
    you?
  choices:
    A: So you cannot see any part of your own vehicle
    B: So you can see the entire side of your vehicle while sitting back
    C: So you can see a small amount of the side of your vehicle when you lean forward
      slightly
    D: So they point directly at the ground behind your rear tires
  answer: C
  explanation: Adjust the side mirrors so that you can see a small amount of the side
    of your vehicle when you lean forward slightly. This will help you see the traffic
    behind you.
- id: 94
  category: penalties_and_points
  question: Who is responsible for paying the fine if a 17-year-old passenger is caught
    not wearing a seat belt?
  choices:
    A: The driver of the vehicle
    B: The 17-year-old passenger
    C: The passenger's parents
    D: Both the driver and the passenger
  answer: B
  explanation: Passengers over 16 years are responsible for wearing their seat belts
    and for paying any fine.
- id: 95
  category: driver_responsibility
  question: A driver can be cited and fined for which of the following unrestrained
    passengers?
  choices:
    A: Only passengers under age 12
    B: Only passengers under age 16
    C: Only passengers sitting in the front seat
    D: Any passenger regardless of age
  answer: B
  explanation: The driver will be fined for any passengers under age 16 who are not
    properly wearing a seat belt or secured in a child safety restraint.
- id: 96
  category: safe_driving_rules
  question: What is the correct way to wear a vehicle's lap belt?
  choices:
    A: Across your stomach
    B: Across your hip bones below your stomach
    C: Loosely across your thighs
    D: Tucked under your arm
  answer: B
  explanation: To buckle up correctly for the best safety, adjust the lap belt across
    your hip bones below your stomach.
- id: 97
  category: safe_driving_rules
  question: Under Washington law, children must use a child safety restraint until
    they reach what age or height?
  choices:
    A: Their 6th birthday or 4'5" tall
    B: Their 8th birthday or 4'9" tall
    C: Their 10th birthday or 5'0" tall
    D: Their 12th birthday or 4'9" tall
  answer: B
  explanation: Children up to their 8th birthday, unless they are 4’9” tall (whichever
    comes first), must use a child safety restraint.
- id: 98
  category: safe_driving_rules
  question: According to Washington's child restraint law, children under what age
    are to be transported in the back seat where it is practical to do so?
  choices:
    A: Under 8 years old
    B: Under 10 years old
    C: Under 12 years old
    D: Under 13 years old
  answer: D
  explanation: Washington’s child restraint law requires children under 13 years old
    to be transported in the back seat where it is practical to do so.
- id: 99
  category: vehicle_information
  question: Which type of child safety restraint is described as the best seat for
    a young child because it cradles and moves with the child to reduce stress to
    the fragile neck and spinal cord?
  choices:
    A: A forward-facing car seat
    B: A booster seat
    C: A rear-facing car seat
    D: A standard seat belt
  answer: C
  explanation: A rear-facing car seat is the best seat for your young child to use.
    It has a harness that, in a crash, cradles and moves with your child to reduce
    the stress to the child’s fragile neck and spinal cord.
- id: 100
  category: license_system
  question: What are the rules regarding wireless device use for teens with intermediate
    driver licenses or learner permits?
  choices:
    A: They may only use hands-free devices while driving.
    B: They may not use a wireless device at all while driving, unless reporting an
      emergency.
    C: They may text while stopped at a red light.
    D: They may use a handheld cell phone if they are driving alone.
  answer: B
  explanation: Teens with intermediate driver licenses or learner permits may not
    use a wireless device at all while driving, including hands-free devices, unless
    they’re reporting an emergency.
- id: 101
  category: defensive_driving
  question: According to the manual, what safety benefit do hands-free devices offer
    compared to handheld devices?
  choices:
    A: They reduce the risk of a crash by 50 percent.
    B: They allow the driver to maintain full visual focus on the road.
    C: They offer no safety benefit.
    D: They are completely safe to use in heavy traffic.
  answer: C
  explanation: 'The manual explicitly states: "Hands-free devices offer no safety
    benefit. Parking your phone is the only safe way to drive."'
- id: 102
  category: penalties_and_points
  question: The Occupant Protection law in Washington State is a "primary enforcement"
    law. What does this mean?
  choices:
    A: Officers can only issue a warning for a first offense.
    B: Officers can stop and cite drivers solely for not wearing a seat belt.
    C: Officers must observe another traffic violation before citing for a seat belt
      offense.
    D: Only the primary driver of the vehicle can be cited.
  answer: B
  explanation: The Occupant Protection law in Washington State is "primary enforcement",
    meaning a law enforcement officer can stop and cite drivers when they or their
    passengers are seen to not be wearing their seat belt.
- id: 103
  category: safe_driving_rules
  question: What is the maximum number of people allowed in the front seat if it blocks
    your view or interferes with the control of your vehicle?
  choices:
    A: Two people
    B: Three people
    C: Four people
    D: There is no limit
  answer: B
  explanation: 'The manual states: "You may not drive with more than three people
    in the front seat if it blocks your view or interferes with the control of your
    vehicle."'
- id: 104
  category: safe_driving_rules
  question: Under what circumstances may a driver with a permit use a wireless device
    while driving?
  choices:
    A: When using a hands-free device.
    B: Only when reporting an emergency.
    C: When pulled over to the shoulder for a non-emergency.
    D: When stopped at a red light.
  answer: B
  explanation: The manual states that drivers with permits may not use a wireless
    device at all while driving, including hands-free devices, unless they are reporting
    an emergency.
- id: 105
  category: signs_and_signals
  question: What should you do if you approach an intersection where the traffic signal
    is not working?
  choices:
    A: Slow down and proceed with caution.
    B: Yield to the vehicle on your right without stopping.
    C: Come to a complete stop and yield as if it were a four-way stop.
    D: Wait for a police officer to arrive before proceeding.
  answer: C
  explanation: If a traffic signal is not working, you must come to a complete stop,
    then yield to traffic as if it were a four-way stop.
- id: 106
  category: signs_and_signals
  question: What does a steady yellow traffic light indicate?
  choices:
    A: The light is about to change to red and you must stop if it is safe to do so.
    B: You should speed up to clear the intersection before the light turns red.
    C: You must come to a complete stop immediately, regardless of surrounding traffic.
    D: Left turns are protected and you have the right-of-way.
  answer: A
  explanation: A steady yellow traffic light means the traffic light is about to change
    to red. You must stop if it is safe to do so.
- id: 107
  category: signs_and_signals
  question: What does a flashing yellow arrow mean?
  choices:
    A: Left turns are prohibited.
    B: Left turns are allowed, but you must yield to oncoming traffic, bicyclists,
      and pedestrians.
    C: You have a protected left turn and oncoming traffic must stop.
    D: The traffic signal is broken and you must treat it as a four-way stop.
  answer: B
  explanation: A flashing yellow arrow means left turns are allowed, but you must
    yield to oncoming traffic including bicyclists and pedestrians.
- id: 108
  category: safe_driving_rules
  question: When is it legal to make a left turn on a steady red traffic light?
  choices:
    A: Whenever there is no oncoming traffic.
    B: Only when turning from a one-way street onto a two-way street.
    C: When turning onto a one-way street with traffic moving left, after coming to
      a full stop and if no sign prohibits it.
    D: It is never legal to turn left on a red light.
  answer: C
  explanation: You may turn left onto a one-way street with traffic moving left after
    coming to a full stop if there is no sign prohibiting turns on a red light.
- id: 109
  category: sharing_the_road
  question: When turning right or left, when must you stop for pedestrians and bicyclists
    crossing in front of your vehicle?
  choices:
    A: Only if they are in a marked crosswalk.
    B: If they are in, or within, one lane of your half of the roadway.
    C: Only if they have a walk signal.
    D: If they are anywhere on the roadway, regardless of distance.
  answer: B
  explanation: You must stop for pedestrians and bicyclists if they are in, or within,
    one lane of your half of the roadway.
- id: 110
  category: signs_and_signals
  question: What do warning signs typically look like?
  choices:
    A: Square and white with black lettering.
    B: Round and yellow with an 'X' symbol.
    C: Diamond shaped and yellow with black lettering or symbols.
    D: Rectangular and orange with black letters.
  answer: C
  explanation: Warning signs are usually yellow with black lettering or symbols and
    most are diamond shaped.
- id: 111
  category: safe_driving_rules
  question: Approximately how long can it take for a train with 100 cars to come to
    a full stop?
  choices:
    A: One-quarter of a mile.
    B: One-half of a mile.
    C: Up to a mile.
    D: Two miles.
  answer: C
  explanation: Trains are large and may be moving faster than they look, it can take
    up to a mile for a train to come to a full stop with 100 cars.
- id: 112
  category: signs_and_signals
  question: What does a white X-shaped 'crossbuck' sign at a railroad crossing mean?
  choices:
    A: It has the same meaning as a 'Yield' sign.
    B: It indicates a mandatory full stop.
    C: It warns that there is more than one track ahead.
    D: It means the crossing is currently closed to traffic.
  answer: A
  explanation: A white X-shaped sign or 'crossbuck' with 'Railroad Crossing' on it
    is located at the railroad crossing. This sign has the same meaning as a 'Yield'
    sign.
- id: 113
  category: safe_driving_rules
  question: What is the first thing you should do if your vehicle becomes disabled
    on a railroad crossing and no train is approaching?
  choices:
    A: Try to push the vehicle off the tracks yourself.
    B: Call 911 immediately.
    C: Call the Emergency Notification System (ENS) using the number on the blue sign
      at the crossing.
    D: Walk down the tracks to look for an oncoming train.
  answer: C
  explanation: If your vehicle becomes disabled on the crossing, you should immediately
    call the Emergency Notification System (ENS). The phone number is located on the
    blue sign attached to the railroad track-crossing gate.
- id: 114
  category: vehicle_information
  question: What does a reflective orange triangle on the rear of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is traveling less than 25 mph.
    C: The vehicle is an emergency responder.
    D: The vehicle is broken down and waiting for a tow.
  answer: B
  explanation: A reflective orange triangle on the rear of a vehicle means it is traveling
    less than 25 mph. This is known as a Slow Moving Vehicle sign.
- id: 115
  category: penalties_and_points
  question: What happens to fines for moving violations in construction areas when
    workers are present?
  choices:
    A: They are reduced by half.
    B: They remain the same as normal violations.
    C: They are doubled.
    D: They result in an automatic license suspension.
  answer: C
  explanation: Fines double for moving violations in construction areas when workers
    are present.
- id: 116
  category: signs_and_signals
  question: What is the purpose of regulatory signs?
  choices:
    A: To warn drivers of sharp curves and hazards ahead.
    B: To give information about rules for traffic direction, lane use, speed, and
      parking.
    C: To indicate where services like gas and food are located.
    D: To warn that people are working on or near the roadway.
  answer: B
  explanation: Regulatory signs give you information about rules for traffic direction,
    lane use, turning, speed, parking, and other special situations.
- id: 117
  category: safe_driving_rules
  question: When should you drive at the maximum posted speed limit?
  choices:
    A: At all times to prevent traffic backups.
    B: Only in ideal driving conditions.
    C: Only when driving in the left lane.
    D: Whenever you are running late for an emergency.
  answer: B
  explanation: The maximum limit should be driven only in ideal driving conditions
    and you must reduce your speed when conditions require it.
- id: 118
  category: signs_and_signals
  question: What is a primary function of Variable Speed Limit Signs?
  choices:
    A: To permanently change the speed limit of a highway.
    B: To warn drivers of backups ahead and evenly distribute the flow of traffic.
    C: To display the current speed of passing vehicles.
    D: To indicate the minimum speed required to drive on a highway.
  answer: B
  explanation: Variable Speed Limit Signs are digital signs that post variable speed
    limits that help warn drivers of backups ahead in an attempt to evenly distribute
    the flow of traffic.
- id: 119
  category: penalties_and_points
  question: What is the penalty for failing to use chains when required by a Traction
    Advisory sign?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1000
  answer: C
  explanation: According to the manual, there is a $500 penalty for failing to use
    chains when required by Traction Advisory signs.
- id: 120
  category: signs_and_signals
  question: What does a triangular No Passing Zone sign look like and where is it
    placed?
  choices:
    A: It is red and white and placed on the right side of the roadway.
    B: It is yellow or orange and placed on the left side of the roadway.
    C: It is green and white and placed on the left side of the roadway.
    D: It is black and white and placed on the right side of the roadway.
  answer: B
  explanation: The manual states that a triangular No Passing Zone sign is yellow
    or orange and placed on the left side of the roadway.
- id: 121
  category: penalties_and_points
  question: What is the fine for parking in a disabled parking stall without displaying
    the required placard or plate?
  choices:
    A: $100
    B: $250
    C: $500
    D: $750
  answer: B
  explanation: There is a $250 fine for parking in stalls without displaying the required
    placard or plate and for blocking the access aisle next to a reserved space.
- id: 122
  category: safe_driving_rules
  question: What does a dashed white line between lanes of traffic mean?
  choices:
    A: You may cross it to change lanes if it is safe.
    B: You should stay in your lane unless a special situation requires it.
    C: You are approaching a no-passing zone.
    D: You are driving in a reversible lane.
  answer: A
  explanation: A dashed white line between lanes of traffic means that you may cross
    it to change lanes if it is safe.
- id: 123
  category: safe_driving_rules
  question: When there is both a solid and a dashed yellow line between opposing lanes
    of traffic, when are you permitted to pass?
  choices:
    A: Only if the solid yellow line is on your side.
    B: Only if the dashed line is on your side.
    C: Whenever there is no oncoming traffic.
    D: Passing is never permitted when a solid line is present.
  answer: B
  explanation: If the dashed line is on your side you are in the passing zone and
    may pass if it is safe. You may not pass if the solid yellow line is on your side.
- id: 124
  category: sharing_the_road
  question: What must a driver do when approaching an intersection with a green bicycle
    box on a red light?
  choices:
    A: Stop inside the bicycle box.
    B: Stop behind the bicycle box even when it is empty.
    C: Pull through the bicycle box to check for cross traffic.
    D: Yield to bicycles but stop past the box.
  answer: B
  explanation: Drivers must stop behind the bicycle box (even when it’s empty) and
    wait for a green light.
- id: 125
  category: safe_driving_rules
  question: What is the designed speed for driving in a roundabout?
  choices:
    A: 10-15 mph
    B: 15-20 mph
    C: 20-25 mph
    D: 25-30 mph
  answer: B
  explanation: Slow down as you approach the intersection; roundabouts are designed
    for speeds of 15-20 mph.
- id: 126
  category: signs_and_signals
  question: What does a steady yellow "X" over a reversible lane indicate?
  choices:
    A: The lane is only for turning.
    B: The lane is open for passing only.
    C: The use of the lane is changing and you should move out.
    D: You must stop immediately.
  answer: C
  explanation: A steady yellow “X” means that the use of the lane is changing and
    you should move out of it as soon as it is safe to do so.
- id: 127
  category: sharing_the_road
  question: Which of the following statements about crosswalks is true according to
    the manual?
  choices:
    A: Crosswalks are only present where marked with white lines.
    B: Every intersection is legally defined as a crosswalk regardless of markings.
    C: Pedestrians must yield to vehicles in unmarked crosswalks.
    D: You only need to yield if the in-pavement lights are flashing.
  answer: B
  explanation: Not all crosswalks are marked; every intersection is legally defined
    as a crosswalk regardless of whether a crosswalk marking is present.
- id: 128
  category: signs_and_signals
  question: What is the shape and color of a Yield sign?
  choices:
    A: An eight-sided red sign with white letters.
    B: A square sign with a white horizontal line inside a red ball.
    C: A downward pointing triangle that is red and white.
    D: A round yellow sign with black letters.
  answer: C
  explanation: A Yield sign is a downward pointing triangle. It is red and white with
    red letters.
- id: 129
  category: safe_driving_rules
  question: How are reversible lanes usually marked on the roadway?
  choices:
    A: Solid white lines
    B: Double-dashed yellow lines
    C: Single dashed white lines
    D: Solid yellow lines with crosshatchings
  answer: B
  explanation: Reversible lanes are designed to carry traffic in one direction at
    certain times and in the opposite direction at other times. These lanes are usually
    marked by double-dashed yellow lines.
- id: 130
  category: signs_and_signals
  question: When driving in a lane controlled by overhead signals, what does a flashing
    yellow 'X' indicate?
  choices:
    A: The lane is closed to all traffic.
    B: The lane is only for turning.
    C: The lane use is changing and you should move out.
    D: The lane is reserved for high occupancy vehicles.
  answer: B
  explanation: According to the manual, a flashing yellow 'X' means the lane is only
    for turning.
- id: 131
  category: safe_driving_rules
  question: What is the maximum distance you are permitted to travel in a two-way
    left turn lane?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: The manual states that two-way left turn lanes cannot be used for passing
    and cannot be used for travel further than 300 feet.
- id: 132
  category: safe_driving_rules
  question: What should you do if you miss your exit on a freeway?
  choices:
    A: Stop and back up carefully on the shoulder.
    B: Put your vehicle in reverse and back up in the travel lane.
    C: Make a U-turn through the center median.
    D: Go on to the next exit or where you can safely turn around.
  answer: D
  explanation: If you miss your turn or exit, do not back up, but go on to the next
    turn or exit or where you can safely turn around. It is illegal to back up on
    a shoulder or a freeway.
- id: 133
  category: sharing_the_road
  question: On a road with three or more lanes traveling in the same direction, which
    lane should you use if there is a lot of entering or exiting traffic?
  choices:
    A: The far left lane
    B: The center travel lane
    C: The far right lane
    D: The shoulder
  answer: B
  explanation: On a road with three or more lanes traveling in the same direction,
    if there is a lot of entering or exiting traffic, use the center travel lane.
- id: 134
  category: safe_driving_rules
  question: If you are pulled over by a law enforcement officer at night, what should
    you do before the officer approaches your vehicle?
  choices:
    A: Step out of the vehicle to greet the officer.
    B: Turn on your vehicle's interior dome light.
    C: Reach into your glove box to retrieve your registration.
    D: Turn off your headlights and turn on your hazard lights.
  answer: B
  explanation: If it is dark, turn on the vehicles’ interior dome light after stopping
    and before the officer approaches your vehicle.
- id: 135
  category: penalties_and_points
  question: What is the penalty for recklessly endangering a worker or property in
    an emergency zone?
  choices:
    A: A 30-day license suspension
    B: A 60-day license suspension
    C: A 90-day license suspension
    D: Permanent revocation of your driver license
  answer: B
  explanation: The driver license of a person who recklessly endangers a worker or
    property in an emergency zone is subject to a 60-day suspension.
- id: 136
  category: penalties_and_points
  question: What happens to traffic infraction fines for speeding in an emergency
    zone?
  choices:
    A: They are waived if it is your first offense.
    B: They are reduced by half.
    C: They are doubled.
    D: They are tripled.
  answer: C
  explanation: The fines for traffic infractions issued for speeding in an emergency
    zone or improper passing of a designated stationary vehicle are doubled.
- id: 137
  category: vehicle_information
  question: On limited access roadways with three or more lanes in one direction,
    which vehicles are generally prohibited from using the left-hand lane?
  choices:
    A: Vehicles carrying more than three passengers
    B: Motorcycles and bicycles
    C: Vehicles towing a trailer or weighing over 10,000 pounds
    D: Hybrid and electric vehicles
  answer: C
  explanation: On limited access roadways of three or more lanes in one direction,
    vehicles towing a trailer or vehicles over ten thousand pounds may not use the
    left-hand lane unless otherwise posted.
- id: 138
  category: safe_driving_rules
  question: What is the maximum speed limit when driving on permitted ocean beaches
    in Washington?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: When driving on permitted ocean beaches, the speed limit is 25 mph
    and pedestrians and bicyclists have the right-of-way at all times.
- id: 139
  category: safe_driving_rules
  question: Which of the following toll bridges allows drivers to pay cash on site
    at toll booths?
  choices:
    A: State Route 520 Bridge in both directions
    B: State Route 16 Tacoma Narrows Bridge traveling eastbound
    C: State Route 520 Bridge traveling westbound only
    D: State Route 16 Tacoma Narrows Bridge traveling westbound
  answer: B
  explanation: SR 16 Tacoma Narrows Bridge has the additional option of toll booths,
    allowing drivers to pay cash on site when traveling eastbound.
- id: 140
  category: penalties_and_points
  question: How are infractions from automated traffic safety cameras processed?
  choices:
    A: As a moving violation that adds points to your driving record
    B: As a criminal misdemeanor
    C: As a parking infraction not included on your driving record
    D: As a felony if the speed exceeded 20 mph over the limit
  answer: C
  explanation: These infractions are not included in a driving record, and are instead
    processed as a parking infraction with a maximum fine of $250.
- id: 141
  category: sharing_the_road
  question: What should you do if you encounter a ferry holding lane where other vehicles
    are already lined up?
  choices:
    A: Cut in front of the line if you have a reservation.
    B: Drive past the line and merge near the terminal entrance.
    C: Find a safe place to turn around and go to the back of the line.
    D: Park on the shoulder and walk to the terminal.
  answer: C
  explanation: If other vehicles have already lined up in the ferry holding lane,
    do not cut in front of these vehicles—find a safe place to turn around and go
    to the back of the line.
- id: 142
  category: driver_responsibility
  question: When pulled over by a law enforcement officer, when should you show your
    driver license and vehicle registration?
  choices:
    A: Immediately upon stopping the vehicle
    B: Only when requested by the officer
    C: After stepping out of the vehicle
    D: Before turning off the engine
  answer: B
  explanation: During a law enforcement stop, you should show your driver license
    and/or vehicle registration only when requested.
- id: 143
  category: safe_driving_rules
  question: What is a High Occupancy Toll (HOT) lane?
  choices:
    A: A lane exclusively for emergency vehicles and tow trucks
    B: A lane reserved only for buses and motorcycles
    C: An HOV lane open to solo drivers who choose to pay a toll
    D: A lane where all vehicles must pay a toll in cash
  answer: C
  explanation: High occupancy toll (HOT) lanes and Express toll lanes are high occupancy
    vehicle (HOV) lanes for carpools that are also open to solo drivers who choose
    to pay a toll.
- id: 144
  category: safe_driving_rules
  question: When making a right turn, why should you avoid moving wide to the left
    before going into the turn?
  choices:
    A: It allows pedestrians to cross first.
    B: The driver behind you may think you are changing lanes or turning left and
      try to pass on the right.
    C: It is required by law to stay within 12 inches of the curb.
    D: It gives you a better view of oncoming traffic.
  answer: B
  explanation: 'The manual states: ''On right turns avoid moving wide to the left
    before going into the turn. If you swing wide, the driver behind you may think
    you are changing lanes or turning left and may try to pass you on the right.'''
- id: 145
  category: safe_driving_rules
  question: Under what conditions should you NOT make a U-turn?
  choices:
    A: On any multi-lane highway.
    B: In a residential neighborhood.
    C: On any curve or when approaching the crest of a hill when your vehicle cannot
      be seen by others.
    D: At an intersection with a traffic signal.
  answer: C
  explanation: According to the manual, U-turns should not be made on any curve or
    when approaching the crest of a hill when your vehicle cannot be seen by others.
- id: 146
  category: vehicle_information
  question: On what type of roads are Neighborhood Electric Vehicles (NEV) and Medium
    Electric Vehicles (MEV) generally permitted to operate?
  choices:
    A: Only on roads with a posted speed limit of 25 mph or less.
    B: On roads with a posted speed limit of up to 35 mph, unless banned by local
      law.
    C: On any state highway system.
    D: On roads with a posted speed limit of up to 50 mph.
  answer: B
  explanation: Persons operating a NEV or MEV are permitted on roads with a posted
    speed limit of up to 35 mph, unless banned by local law. Only San Juan County
    permits operation up to 45 mph.
- id: 147
  category: penalties_and_points
  question: What is the minimum penalty for parking a vehicle in an electric vehicle
    charging station if the vehicle is not connected to the charging equipment?
  choices:
    A: $50
    B: $124
    C: $250
    D: $500
  answer: B
  explanation: It is a parking infraction with a minimum penalty of $124 to park a
    vehicle in an electric vehicle charging station if the vehicle is not connected
    to the charging equipment.
- id: 148
  category: sharing_the_road
  question: Which of the following statements about right-of-way laws is true?
  choices:
    A: The law gives the right-of-way to the larger vehicle.
    B: The law says who must yield the right-of-way, but it does not give anyone the
      right-of-way.
    C: Pedestrians always have the right-of-way, even when crossing outside of a crosswalk.
    D: Bicyclists must always yield the right-of-way to motor vehicles.
  answer: B
  explanation: 'The manual explicitly states: ''The law says who must yield the right-of-way,
    it does not give anyone the right-of-way.'''
- id: 149
  category: sharing_the_road
  question: When must a driver stop for a pedestrian or bicyclist crossing the roadway
    at an intersection?
  choices:
    A: Only when the crosswalk is marked with painted lines.
    B: If the pedestrian or bicyclist is in the driver's half of the roadway or within
      one lane of their half.
    C: Only if the pedestrian makes eye contact with the driver.
    D: When the pedestrian is waiting on the sidewalk.
  answer: B
  explanation: Drivers must stop if a pedestrian or bicyclist is in their half of
    the roadway or if they are within one lane of their half of the roadway.
- id: 150
  category: sharing_the_road
  question: What should you do if you encounter a pedestrian using a guide dog or
    carrying a white cane?
  choices:
    A: Honk your horn lightly to let them know you are there.
    B: Yield the right-of-way only if they are in a marked crosswalk.
    C: Give them absolute right-of-way and do not use your horn.
    D: Drive around them slowly.
  answer: C
  explanation: Pedestrians using a guide dog or other service animal or carrying a
    white cane have absolute right-of-way. You should not use your horn as it could
    confuse or frighten the pedestrian or the service animal.
- id: 151
  category: safe_driving_rules
  question: At an intersection where there is no stop sign, yield sign, or traffic
    signal, who must a driver yield to?
  choices:
    A: Vehicles coming from the left.
    B: Vehicles in the intersection and those coming from the right.
    C: Only vehicles turning left.
    D: The vehicle that is traveling the fastest.
  answer: B
  explanation: At an intersection where there is no stop sign, yield sign, or traffic
    signal, drivers must yield to vehicles in the intersection and to those coming
    from the right.
- id: 152
  category: safe_driving_rules
  question: What should you do if you are in an intersection and an emergency vehicle
    approaches with a siren and flashing lights?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Pull over to the right edge of the intersection and stop.
    C: Drive through the intersection before you pull over to the right and stop.
    D: Speed up to clear the intersection and continue driving.
  answer: C
  explanation: If you are in an intersection, drive through the intersection before
    you pull over to the right edge of the road and stop for the emergency vehicle.
- id: 153
  category: sharing_the_road
  question: 'You are NOT required to stop for a school bus with red lights flashing
    when the bus is traveling in the opposite direction and the roadway:'
  choices:
    A: Has a speed limit of 35 mph or more.
    B: Has three or more marked traffic lanes.
    C: Is in a residential neighborhood.
    D: Has a designated bicycle lane.
  answer: B
  explanation: You are not required to stop for a school bus with red lights flashing
    when traveling in the opposite direction if the roadway has three or more marked
    traffic lanes, is separated by a median, or is separated by a physical barrier.
- id: 154
  category: penalties_and_points
  question: What is the penalty for passing a stopped school bus with its red lights
    flashing?
  choices:
    A: A warning for the first offense.
    B: Fines are doubled and the penalty may not be waived, reduced, or suspended.
    C: Immediate impoundment of your vehicle.
    D: A mandatory 30-day license suspension.
  answer: B
  explanation: Fines are doubled for anyone that passes a stopped school bus. The
    penalty for failing to stop for a stopped school bus may not be waived, reduced,
    or suspended.
- id: 155
  category: sharing_the_road
  question: When must you yield to a transit vehicle (bus)?
  choices:
    A: At all times, regardless of the situation.
    B: Only when the bus is traveling in a dedicated bus lane.
    C: When the bus has signaled and is pulling back onto the roadway.
    D: Only when the bus is picking up passengers.
  answer: C
  explanation: You must yield to any transit vehicle (bus) that has signaled and is
    pulling back onto the roadway.
- id: 156
  category: safe_driving_rules
  question: When is it legal to enter an intersection?
  choices:
    A: As soon as the traffic light turns green, even if traffic is backed up.
    B: Only when you can get through it without having to stop and block the intersection.
    C: When you are turning right on red.
    D: If you are following a large truck.
  answer: B
  explanation: Drivers must not enter an intersection unless they can get through
    it without having to stop. You should wait until traffic ahead clears so you are
    not blocking the intersection.
- id: 157
  category: penalties_and_points
  question: What happens if you commit an infraction for failing to stop or yield
    the right-of-way for a pedestrian in a crosswalk marked with school or playground
    speed zone signs?
  choices:
    A: You receive twice the scheduled penalty.
    B: Your license is automatically suspended.
    C: You must attend a mandatory defensive driving course.
    D: You receive a standard parking ticket.
  answer: A
  explanation: Infractions for failing to stop or yield the right of way for pedestrian
    or bicyclist within a crosswalk that is marked with school or playground speed
    zone signs receive twice the scheduled penalty.
- id: 158
  category: vehicle_information
  question: Which of the following is a requirement for operating a golf cart on public
    roads in approved golf cart zones?
  choices:
    A: You must be at least 18 years old.
    B: You must have a special golf cart endorsement on your license.
    C: You must be at least 16 years old and have completed a driver education course
      or have previous licensed driving experience.
    D: You must wear a DOT-approved helmet.
  answer: C
  explanation: A person may operate a golf cart on public roads in approved golf cart
    zones if they are at least 16 years old and have either completed a driver education
    course or have previous experience driving as a licensed driver.
- id: 159
  category: sharing_the_road
  question: What must you do when a transit vehicle (bus) has signaled and is pulling
    back onto the roadway?
  choices:
    A: Honk your horn and pass quickly.
    B: Yield to the transit vehicle.
    C: Maintain your speed and right-of-way.
    D: Move to the left lane and accelerate.
  answer: B
  explanation: The manual states that you must yield to any transit vehicle (bus)
    that has signaled and is pulling back onto the roadway.
- id: 160
  category: sharing_the_road
  question: What is the primary purpose of using the 'Dutch Reach' method to open
    your vehicle door?
  choices:
    A: To prevent the door from locking automatically.
    B: To force your body to turn so you can better see approaching bicyclists.
    C: To stretch your arm muscles after a long drive.
    D: To ensure the child safety locks are disengaged.
  answer: B
  explanation: The 'Dutch Reach' method involves opening the door with your far hand.
    It forces your body to turn, which will better allow you to see approaching bicyclists
    and prevents the door from being opened too fast.
- id: 161
  category: driver_responsibility
  question: It is against the law to leave children alone in a parked car with the
    engine running if they are under what age?
  choices:
    A: 10 years of age
    B: 12 years of age
    C: 14 years of age
    D: 16 years of age
  answer: D
  explanation: The manual states that it is against the law to leave children under
    16 years of age alone in a parked car with the engine running.
- id: 162
  category: safe_driving_rules
  question: You are not allowed to park your vehicle within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: The manual lists no parking zones, which includes a restriction against
    parking within 15 feet of a fire hydrant.
- id: 163
  category: safe_driving_rules
  question: How far away must you park from a traffic signal, stop sign, or yield
    sign?
  choices:
    A: At least 15 feet
    B: At least 20 feet
    C: At least 30 feet
    D: At least 50 feet
  answer: C
  explanation: You cannot park within 30 feet of a traffic signal, stop sign, or yield
    sign.
- id: 164
  category: signs_and_signals
  question: What does a white painted curb indicate?
  choices:
    A: Only short stops are permitted.
    B: It is a loading zone for commercial vehicles only.
    C: Parking is reserved for disabled persons.
    D: No stopping or parking at any time.
  answer: A
  explanation: Other parking restrictions may be indicated by painted curbs; white
    indicates that only short stops are permitted.
- id: 165
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking facing uphill
    with a curb?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: Toward the center of the road
  answer: B
  explanation: When you park on a hill with a curb and are facing uphill, set your
    parking brake and turn your steering wheel away from the curb. This way, if your
    vehicle starts to roll, it will roll into the curb.
- id: 166
  category: safe_driving_rules
  question: When parking facing downhill, which direction should you turn your steering
    wheel?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Straight ahead
    D: Parallel to the roadway
  answer: A
  explanation: When you park on a hill facing downhill, set your parking brake and
    turn your steering wheel toward the curb.
- id: 167
  category: safe_driving_rules
  question: When parallel parking, your vehicle must be within how many inches of
    the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: When you parallel park, you must park within 12 inches of the curb.
- id: 168
  category: vehicle_information
  question: What is the recommended hand position on the steering wheel?
  choices:
    A: Left hand at 10 o'clock and right hand at 2 o'clock
    B: Left hand between 8 and 9 o'clock and right hand between 3 and 4 o'clock
    C: Both hands resting at the bottom of the wheel at 6 o'clock
    D: Left hand at 9 o'clock and right hand resting on the gear shift
  answer: B
  explanation: Place your hands on opposite sides of the steering wheel (left hand
    between 8 and 9 o'clock and right hand between 3 and 4 o'clock). This allows you
    to make turns without taking your hands off the wheel and keeps them out of the
    way of the air bag.
- id: 169
  category: defensive_driving
  question: To drive safely and anticipate situations, how far down the road should
    you look?
  choices:
    A: At least 5 seconds
    B: At least 10 seconds
    C: At least 15 seconds
    D: At least 20 seconds
  answer: C
  explanation: The manual advises drivers to look well down the road, at least 15
    seconds, and to look to both sides of the road and the rear.
- id: 170
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit on streets of cities
    and towns?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: Speed limits, unless otherwise posted, are 25 mph on streets of cities
    and towns.
- id: 171
  category: safe_driving_rules
  question: What is the maximum speed limit on county roads unless otherwise posted?
  choices:
    A: 40 mph
    B: 45 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: Speed limits, unless otherwise posted, are 50 mph on county roads.
- id: 172
  category: defensive_driving
  question: Speeding is a factor in approximately what percentage of all traffic fatalities
    in Washington?
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: According to the manual, speeding is a factor in nearly 40% of all
    traffic fatalities in Washington.
- id: 173
  category: penalties_and_points
  question: What is the minimum fine for violating the distracted driving law in Washington?
  choices:
    A: $100
    B: $124
    C: $150
    D: $250
  answer: B
  explanation: The minimum fine for violating one or more of these restrictions is
    $124 and can be more if you cause a crash.
- id: 174
  category: penalties_and_points
  question: What happens to the fine for a second and all subsequent distracted driving
    violations?
  choices:
    A: It remains the same
    B: It is doubled
    C: It is tripled
    D: The driver's license is suspended
  answer: B
  explanation: Second and all subsequent violations are subject to have the fine doubled.
- id: 175
  category: penalties_and_points
  question: When can a law enforcement officer issue a violation for "Dangerously
    Distracted Driving"?
  choices:
    A: Only if you cause a collision
    B: As a primary offense when they see you eating
    C: As a secondary action when stopped for a suspected violation of a separate
      traffic infraction
    D: Only if you are using a cell phone
  answer: C
  explanation: A law enforcement officer may also include a violation for Dangerously
    Distracted Driving as secondary action when a driver of a motor vehicle has been
    stopped for a suspected violation for a separate traffic infraction.
- id: 176
  category: safe_driving_rules
  question: Under which of the following circumstances is it permissible to use a
    personal electronic device while driving?
  choices:
    A: To read a text message at a red light
    B: To report illegal activity or summon emergency help
    C: To check a map on your phone while on the highway
    D: To change the music playlist
  answer: B
  explanation: Activities that may be permissible include reporting illegal activity
    and summoning medical or other emergency help.
- id: 177
  category: license_system
  question: What are the rules regarding wireless communication devices for drivers
    with an Instruction Permit or Intermediate License?
  choices:
    A: They can use hands-free devices only
    B: They can use hand-held devices if stopped at a light
    C: They cannot use any wireless communication device unless in an emergency
    D: They can use devices only for GPS navigation
  answer: C
  explanation: Drivers with an Instruction Permit or Intermediate License cannot use
    any wireless communication device (regardless if hand-held or hands-free) while
    driving unless in an emergency situation.
- id: 178
  category: safe_driving_rules
  question: When is it legal to have a television broadcast visible to the driver
    while operating a motor vehicle on a public road?
  choices:
    A: When driving under 25 mph
    B: When the vehicle is in cruise control
    C: Only when it provides live video of the motor vehicle backing up
    D: When the broadcast is a news program
  answer: C
  explanation: No person is allowed to operate a motor vehicle with equipment capable
    of receiving a television broadcast when the moving images are visible to the
    driver... An exemption is provided for live video of the motor vehicle backing
    up.
- id: 179
  category: safe_driving_rules
  question: What is the Washington state law regarding wearing earphones while driving?
  choices:
    A: You may wear them if the volume is low
    B: You may wear them in one ear only
    C: It is illegal to drive with head or earphones that cover or go in your ears
    D: They are required for hands-free calling
  answer: C
  explanation: Do not drive with head or earphones that cover or go in your ears.
    These are illegal in Washington and many other states and make it hard to hear
    emergency horns or sirens.
- id: 180
  category: defensive_driving
  question: Which of the following is NOT one of the "5 Ds" of distracted driving
    mentioned in the manual?
  choices:
    A: Dangerous
    B: Deceptive
    C: Disrespectful
    D: Destructive
  answer: C
  explanation: 'The "5 Ds" of distracted driving are: Dangerous, Deceptive, Destructive,
    Disabling, and Deadly.'
- id: 181
  category: defensive_driving
  question: According to the NHTSA, more than 80% of all crashes can be avoided if
    drivers have how much additional time to react?
  choices:
    A: One additional second
    B: Two additional seconds
    C: Three additional seconds
    D: Five additional seconds
  answer: A
  explanation: According to the National Highway Traffic Safety Administration (NHTSA),
    more than 80% of all crashes can be avoided if drivers have one additional second
    of time to react.
- id: 182
  category: defensive_driving
  question: How far ahead does the average driver look while driving?
  choices:
    A: 1-2 seconds
    B: 3-5 seconds
    C: 10-12 seconds
    D: 15 seconds
  answer: B
  explanation: The average driver looks only 3-5 seconds ahead of the car.
- id: 183
  category: defensive_driving
  question: To gather critical information earlier and respond sooner to hazards,
    how far ahead should you scan?
  choices:
    A: At least 5 seconds
    B: At least 10 seconds
    C: At least 15 seconds
    D: At least 30 seconds
  answer: C
  explanation: If you scan at least 15 seconds ahead, you are able to gather critical
    information earlier and respond sooner to problems and hazards.
- id: 184
  category: defensive_driving
  question: When driving in city traffic, 15 seconds ahead is approximately equal
    to what distance?
  choices:
    A: One car length
    B: One block
    C: Four blocks
    D: Half a mile
  answer: B
  explanation: In the city look 15 seconds ahead; 15 seconds is about one block.
- id: 185
  category: defensive_driving
  question: Vehicles, pedestrians, or bicyclists most often cross or enter your path
    within what time range?
  choices:
    A: A two-second range
    B: A four-second range
    C: An eight-second range
    D: A ten-second range
  answer: B
  explanation: As other vehicles, pedestrians, or bicyclists may cross or enter your
    path anytime, most often within a four second range, look to the sides to make
    sure no one is coming.
- id: 186
  category: defensive_driving
  question: What percentage of all crashes in the United States each year occur at
    intersections?
  choices:
    A: Over 10%
    B: Over 20%
    C: Over 30%
    D: Over 40%
  answer: C
  explanation: According to the manual, over 30% of all the crashes that take place
    in the United States each year occur at intersections.
- id: 187
  category: safe_driving_rules
  question: Before you turn left or right across oncoming traffic, how far ahead should
    you turn on your signal?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: 'The manual states: "Before you turn left or right across oncoming
    traffic, turn on your signal at least 100 feet ahead and look for a safe gap in
    the traffic."'
- id: 188
  category: safe_driving_rules
  question: Which of the following is true regarding turning on a red light after
    stopping?
  choices:
    A: You may never turn left on a red light.
    B: You may turn right on red unless prohibited.
    C: You may only turn right on red if a sign permits it.
    D: You may turn left on red onto any two-way street.
  answer: B
  explanation: The manual states that after stopping, you may turn right on red unless
    prohibited. You may also turn left from a one-way or two-way street into a one-way
    street unless prohibited.
- id: 189
  category: defensive_driving
  question: What should you do if you are stopped at an intersection and your view
    of the cross street is blocked?
  choices:
    A: Honk your horn and proceed quickly.
    B: Wait for another vehicle to pull up next to you.
    C: Edge forward slowly until you can see.
    D: Turn on your high beams before crossing.
  answer: C
  explanation: If you were stopped and your view of a cross street is blocked, you
    should edge forward slowly until you can see. This allows crossing drivers to
    see the front of your vehicle before you can see them.
- id: 190
  category: safe_driving_rules
  question: 'If you are approaching a railroad crossing and are not sure it is safe
    to cross, you should:'
  choices:
    A: Speed up to cross the tracks quickly.
    B: Turn your radio down, put the window down, and listen for a train.
    C: Stop on the tracks to get a better view.
    D: Rely solely on the crossing lights to warn you.
  answer: B
  explanation: The manual advises that if you are not sure it is safe to cross the
    tracks, turn your radio down or off, stop talking, put the window down, and look
    and listen for a train.
- id: 191
  category: defensive_driving
  question: At a railroad crossing with more than one track, why should you wait until
    a passing train is well down the track before crossing?
  choices:
    A: The train may suddenly reverse direction.
    B: The crossing gates take a long time to reset.
    C: The passing train may hide another train behind it.
    D: It is illegal to cross within one minute of a train passing.
  answer: C
  explanation: At crossings with more than one track, you must wait until the passing
    train is well down the track because a train that just passed may hide another
    train behind it.
- id: 192
  category: defensive_driving
  question: Why is it necessary to look over your shoulder in the direction you plan
    to move when changing lanes?
  choices:
    A: To check your vehicle's blind spots that you cannot see through your mirrors.
    B: To ensure your turn signal is functioning properly.
    C: To communicate your intentions to pedestrians.
    D: To check the speed of the vehicle directly in front of you.
  answer: A
  explanation: You must look over your shoulder because there are "blind spots" near
    the rear corners of your vehicle that you cannot see through your mirrors.
- id: 193
  category: sharing_the_road
  question: How much space is recommended before attempting to merge in front of a
    commercial vehicle?
  choices:
    A: One car length for every 5 miles of speed.
    B: One car length for every 10 miles of speed.
    C: Two car lengths regardless of speed.
    D: 100 feet of space at all times.
  answer: B
  explanation: Before attempting to merge in front of a commercial vehicle, it is
    recommended that one car length of space for every 10 miles of speed be used.
- id: 194
  category: safe_driving_rules
  question: What is the recommended technique for looking behind your vehicle while
    backing up?
  choices:
    A: Depend solely on your rearview mirror.
    B: Depend solely on your side mirrors.
    C: Place your right arm on the back of the seat and turn around to look directly
      through the rear window.
    D: Open your driver's side door and look backward.
  answer: C
  explanation: When backing up, you should place your right arm on the back of the
    seat and turn around so you can look directly through the rear window, rather
    than depending solely on mirrors.
- id: 195
  category: safe_driving_rules
  question: By law, when must your vehicle's headlights be turned on?
  choices:
    A: From sunset to sunrise.
    B: From a half hour after sunset until a half hour before sunrise.
    C: From an hour after sunset until an hour before sunrise.
    D: Only when it is completely dark outside.
  answer: B
  explanation: By law, your vehicle's headlights must be turned on from a half hour
    after sunset until a half hour before sunrise, or any time conditions make it
    difficult to see.
- id: 196
  category: safe_driving_rules
  question: You must dim your high beams whenever you come within what distance of
    an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: The manual states you must dim your high beams whenever you come within
    500 feet of an oncoming vehicle.
- id: 197
  category: safe_driving_rules
  question: 'You should use your low beams when you are following another vehicle
    within:'
  choices:
    A: 100 feet or less.
    B: 200 feet or less.
    C: 300 feet or less.
    D: 500 feet or less.
  answer: C
  explanation: You should use your low beams when following 300 feet or less behind
    another vehicle.
- id: 198
  category: defensive_driving
  question: Why should you use low beams instead of high beams in fog, snow, or hard
    rain?
  choices:
    A: High beams will drain the battery faster in cold weather.
    B: Light from high beams will reflect back, causing glare and making it difficult
      to see.
    C: Low beams are required by law during all daylight hours.
    D: High beams can melt falling snow onto your windshield.
  answer: B
  explanation: In fog, snow, or hard rain, light from high beams will reflect back,
    causing glare and making it difficult to see ahead. Low beams should be used instead.
- id: 199
  category: defensive_driving
  question: If a vehicle comes toward you with its high beams on, where should you
    look to avoid being blinded?
  choices:
    A: Directly at the oncoming headlights.
    B: Toward the left side of the road.
    C: Toward the right side of the road.
    D: Down at your dashboard.
  answer: C
  explanation: If a vehicle comes toward you with high beams on, look away from the
    headlights and toward the right side of the road until the car has passed to keep
    from being blinded.
- id: 200
  category: defensive_driving
  question: When is it especially important to check behind your vehicle when slowing
    down?
  choices:
    A: When you are driving up a steep hill.
    B: When you slow down quickly or at points where a following driver would not
      expect it.
    C: When you are approaching a green traffic light.
    D: When you are driving in the right lane of a freeway.
  answer: B
  explanation: You must check behind your vehicle whenever you slow down, which is
    very important when you slow down quickly or at points where a following driver
    would not expect you to slow down, such as driveways or parking spaces.
- id: 201
  category: safe_driving_rules
  question: What should you do regarding your headlights on rainy, snowy, or foggy
    days?
  choices:
    A: Turn them on only if it is getting dark.
    B: Use your parking lights instead.
    C: Turn them on whenever you turn on your wipers.
    D: Flash your high beams continuously.
  answer: C
  explanation: 'The manual states that in rainy, snowy, or foggy conditions, headlights
    make your vehicle easier to see. A good rule to remember is: if you turn on your
    wipers, turn on your headlights.'
- id: 202
  category: defensive_driving
  question: Why should you turn on your headlights when driving away from a rising
    or setting sun?
  choices:
    A: It helps you see the road ahead more clearly.
    B: It helps drivers coming toward you see your vehicle.
    C: It prevents the sun from glaring in your rearview mirror.
    D: It signals to other drivers that you are slowing down.
  answer: B
  explanation: According to the manual, when driving away from a rising or setting
    sun, drivers coming toward you may have trouble seeing your vehicle, so turning
    on your headlights helps them see you.
- id: 203
  category: sharing_the_road
  question: In which of the following situations should you avoid using your horn?
  choices:
    A: When a child is about to run into the street.
    B: When passing bicyclists or approaching horses.
    C: When a driver is not paying attention.
    D: When exiting a narrow alley.
  answer: B
  explanation: The manual lists several occasions when you should not use your horn,
    which includes around blind pedestrians, passing bicyclists, and when approaching
    horses.
- id: 204
  category: safe_driving_rules
  question: If your vehicle breaks down and you need to warn other road users, how
    far behind your vehicle should you place emergency flares?
  choices:
    A: 50 to 100 feet
    B: 100 to 150 feet
    C: 200 to 300 feet
    D: 400 to 500 feet
  answer: C
  explanation: If you are having vehicle trouble and have to stop, you should place
    emergency flares 200 to 300 feet behind the vehicle to allow other drivers to
    change lanes if necessary.
- id: 205
  category: vehicle_information
  question: If your vehicle breaks down on the highway and you do not have flares,
    how can you signal an emergency?
  choices:
    A: Stand in the roadway and wave your arms.
    B: Tie a white cloth to the antenna, side mirror, or door handle.
    C: Sound your horn in a continuous blast.
    D: Turn on your parking lights only.
  answer: B
  explanation: The manual advises that if you do not have flares, you should lift
    the hood or tie a white cloth to the antenna, side mirror, or door handle to signal
    an emergency.
- id: 206
  category: sharing_the_road
  question: Why should you never stay beside a large vehicle such as a truck or bus?
  choices:
    A: They travel at much higher speeds than passenger cars.
    B: They have large blind spots known as the No-Zone.
    C: They frequently make sudden lane changes without signaling.
    D: They kick up more gravel and dirt from the road.
  answer: B
  explanation: You should never stay beside a large vehicle such as a truck or bus
    because these vehicles have large blind spots, often referred to as the NO-ZONE.
- id: 207
  category: safe_driving_rules
  question: How far in advance should you signal before you change lanes, turn, merge,
    or park?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: The manual states that you must signal at least 100 feet before you
    make your move.
- id: 208
  category: defensive_driving
  question: What should you do if another vehicle is about to enter the street between
    you and where you plan to turn?
  choices:
    A: Signal early to warn the other driver of your approach.
    B: Wait until you have passed the vehicle to signal your turn.
    C: Tap your horn and signal immediately.
    D: Flash your headlights and brake sharply.
  answer: B
  explanation: If another vehicle is about to enter the street between you and where
    you plan to turn, wait until you have passed it to signal. If you signal earlier,
    the other driver may think you plan to turn where they are and pull into your
    path.
- id: 209
  category: defensive_driving
  question: How can you warn drivers behind you that you are going to stop or slow
    down at a place they might not expect?
  choices:
    A: Turn on your emergency flashers.
    B: Use a hand signal for turning left.
    C: Tap your brake pedal three or four times quickly.
    D: Sound a sharp blast on your horn.
  answer: C
  explanation: If you are going to stop or slow down at a place where another driver
    does not expect it, tap your brake pedal three or four times quickly to let those
    behind you know you are about to slow down.
- id: 210
  category: safe_driving_rules
  question: How does your stopping distance at 60 mph compare to your stopping distance
    at 30 mph?
  choices:
    A: It takes twice as far to stop.
    B: It takes three times as far to stop.
    C: It takes four times as far to stop.
    D: The stopping distance is exactly the same.
  answer: B
  explanation: The faster your vehicle is going, the more distance it will take to
    stop. For example, at 60 mph it may take you three times as far to stop as it
    takes to stop at 30 mph.
- id: 211
  category: safe_driving_rules
  question: What is the safest way to navigate a curve in the road?
  choices:
    A: Maintain your speed and brake gently while in the curve.
    B: Accelerate slightly before entering the curve.
    C: Slow down before you enter the curve so you do not have to brake in it.
    D: Apply your brakes firmly at the apex of the curve.
  answer: C
  explanation: Always slow down before you enter a curve so you do not have to brake
    in the curve. Braking in a curve can cause the vehicle to skid.
- id: 212
  category: safe_driving_rules
  question: How much should you reduce your speed when driving on a road with packed
    snow?
  choices:
    A: Reduce your speed by 10 mph.
    B: Cut your speed in half.
    C: Slow to a crawl.
    D: Maintain the posted speed limit but increase following distance.
  answer: B
  explanation: According to the manual, on a wet road you should reduce your speed
    by about 10 mph, but on packed snow, you should cut your speed in half.
- id: 213
  category: vehicle_information
  question: In Washington, during which months are standard studded tires legally
    permitted on the roads?
  choices:
    A: October 1 through April 30
    B: November 1 through March 31
    C: December 1 through February 28
    D: They are illegal year-round
  answer: B
  explanation: In Washington, studded tires are legal during winter months and can
    only be used between November 1 and March 31.
- id: 214
  category: defensive_driving
  question: Why do overpasses and bridges tend to have icy spots even when the rest
    of the pavement is dry?
  choices:
    A: They are exposed to more wind than regular roads.
    B: They do not have earth underneath them to help insulate against the cold.
    C: They are usually constructed from smoother concrete.
    D: Water drains onto them from surrounding hills.
  answer: B
  explanation: The pavement on bridges can be icy even when other pavement is not
    because bridges do not have earth underneath them to help insulate against the
    cold.
- id: 215
  category: defensive_driving
  question: Why can the pavement be very slippery for the first few minutes when it
    starts to rain on a hot day?
  choices:
    A: The rain mixes with dust to form a thick mud.
    B: Heat causes the oil in the asphalt to come to the surface.
    C: The sudden cooling causes the asphalt to contract and become slick.
    D: The water creates a hydroplaning effect immediately.
  answer: B
  explanation: If it starts to rain on a hot day, pavement can be very slippery for
    the first few minutes because heat causes the oil in the asphalt to come to the
    surface. The road is more slippery until the oil washes away.
- id: 216
  category: safe_driving_rules
  question: Why can bridges be icy even when other pavement is not?
  choices:
    A: They are exposed to more wind.
    B: They do not have earth underneath them to help insulate against the cold.
    C: They are made of different asphalt materials.
    D: They collect more moisture from the air.
  answer: B
  explanation: According to the manual, bridges can be icy even when other pavement
    is not because they do not have earth underneath them to help insulate against
    the cold.
- id: 217
  category: safe_driving_rules
  question: At what speed can your tires lose all traction with the road during heavy
    rain (hydroplaning)?
  choices:
    A: About 35 mph
    B: About 40 mph
    C: About 50 mph
    D: About 60 mph
  answer: C
  explanation: In a heavy rain, your tires can lose all traction with the road at
    about 50 mph due to hydroplaning.
- id: 218
  category: defensive_driving
  question: What should you do if it feels like your tires have lost traction with
    the surface of the road?
  choices:
    A: Pump the brakes rapidly to regain traction.
    B: Turn the steering wheel sharply in the direction of the skid.
    C: Ease your foot off the gas pedal and keep the steering wheel straight.
    D: Accelerate slightly to push through the water.
  answer: C
  explanation: If your tires lose traction, you should ease your foot off the gas
    pedal, keep the steering wheel straight, and not try to stop or turn until your
    tires are gripping the road again.
- id: 219
  category: sharing_the_road
  question: If you are driving a slow-moving vehicle on a two-lane road where it is
    unsafe to pass, when must you pull over to let others pass?
  choices:
    A: When three or more vehicles are in a line behind you.
    B: When five or more vehicles are in a line behind you.
    C: When the vehicle behind you honks its horn.
    D: When you are traveling 15 mph below the speed limit.
  answer: B
  explanation: If you are driving a slow moving vehicle on a two-lane road where it
    is unsafe to pass, and five or more vehicles are in a line behind you, you must
    pull over and stop when safe to let them pass.
- id: 220
  category: safe_driving_rules
  question: What is the proper procedure for entering traffic from a high-speed roadway
    ramp?
  choices:
    A: Drive to the end of the ramp, stop, and wait for a gap.
    B: Signal and enter at the same speed that traffic is moving.
    C: Enter the roadway at a slower speed than traffic to be safe.
    D: Yield to traffic by stopping halfway down the ramp.
  answer: B
  explanation: When you merge with traffic, signal, and enter at the same speed that
    traffic is moving. High-speed roadways generally have ramps to give you time to
    build up your speed.
- id: 221
  category: safe_driving_rules
  question: When leaving traffic via an exit ramp on a high-speed roadway, when should
    you slow down?
  choices:
    A: About 100 feet before the exit ramp.
    B: As soon as you turn your turn signal on.
    C: Do not slow down until you move onto the exit ramp.
    D: Gradually slow down while still in the main traffic lane.
  answer: C
  explanation: If the road you are traveling has exit ramps, do not slow down until
    you move onto the exit ramp.
- id: 222
  category: penalties_and_points
  question: What is a potential penalty for recklessly endangering workers or other
    motorists in a work zone?
  choices:
    A: A 30-day license suspension.
    B: A 60-day license suspension.
    C: A 90-day license suspension.
    D: Permanent revocation of your driver's license.
  answer: B
  explanation: Recklessly endangering workers, other motorists or property in a work
    zone could lead to a 60-day license suspension.
- id: 223
  category: penalties_and_points
  question: How are traffic fines affected if you commit a violation in a work zone?
  choices:
    A: Fines are the same as normal roadways.
    B: Fines are increased by $50.
    C: Fines are double.
    D: Fines are triple.
  answer: C
  explanation: Traffic fines are double in the work zones.
- id: 224
  category: safe_driving_rules
  question: If you have good tires and brakes and dry pavement, about how far does
    it take to react and bring your vehicle to a stop at 50 mph?
  choices:
    A: About 100 feet
    B: About 200 feet
    C: About 300 feet
    D: About 400 feet
  answer: D
  explanation: At 50 mph, it can take about 400 feet to react to something you see
    and bring your vehicle to a stop. That is about the length of a city block.
- id: 225
  category: vehicle_information
  question: At night, your headlights will let you see about how far ahead?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: C
  explanation: Your headlights will let you see about 400 feet ahead. You should drive
    at a speed that allows you to stop within this distance.
- id: 226
  category: defensive_driving
  question: Which rule should you use to tell if you are driving too fast for conditions
    based on your sight distance?
  choices:
    A: The Two-Second Following Rule
    B: The Three-Second Space Rule
    C: The Four-Second Sight Distance Rule
    D: The Five-Second Reaction Rule
  answer: C
  explanation: To tell if you are driving too fast for conditions, use the Four-Second
    Sight Distance Rule. If you reach your chosen stationary object before finishing
    your count, you are going too fast.
- id: 227
  category: safe_driving_rules
  question: Can you get a ticket for driving under the posted speed limit?
  choices:
    A: No, as long as you are below the posted limit, you are driving legally.
    B: Yes, if you are traveling too fast for conditions like wet or icy roads.
    C: Yes, but only if you are driving more than 15 mph below the limit.
    D: No, speed limits account for all weather conditions.
  answer: B
  explanation: Even if you are driving under the posted speed limit, you can get a
    ticket for traveling too fast under conditions such as wet or icy roads, poor
    visibility, or heavy traffic.
- id: 228
  category: safe_driving_rules
  question: On roadways with multiple lanes going in the same direction, what does
    the law require regarding lane usage?
  choices:
    A: You must stay in the center lane unless exiting.
    B: You must keep right except to pass.
    C: You must keep left except to pass.
    D: You may travel in any lane as long as you maintain the speed limit.
  answer: B
  explanation: On roadways with multiple lanes going in the same direction, the law
    requires you to keep right except to pass.
- id: 229
  category: safe_driving_rules
  question: What is the recommended following distance rule when driving at speeds
    higher than 30 mph?
  choices:
    A: The two-second rule
    B: The three-second rule
    C: The four-second rule
    D: The five-second rule
  answer: C
  explanation: According to the manual, if you are driving at speeds higher than 30
    mph, the best rule to use is the four-second rule to maintain a safe following
    distance.
- id: 230
  category: defensive_driving
  question: If you are being tailgated and there is no right lane to move into, what
    should you do?
  choices:
    A: Brake quickly to discourage the tailgater
    B: Speed up to increase the distance between vehicles
    C: Wait until the road ahead is clear and reduce your speed slowly
    D: Turn on your hazard lights and maintain your speed
  answer: C
  explanation: If there is no right lane, wait until the road ahead is clear then
    reduce speed slowly. This will encourage the tailgater to drive around you. Never
    slow down quickly to discourage a tailgater.
- id: 231
  category: sharing_the_road
  question: How close are you legally allowed to follow a fire truck?
  choices:
    A: No closer than 200 feet
    B: No closer than 300 feet
    C: No closer than 400 feet
    D: No closer than 500 feet
  answer: D
  explanation: The manual states that police vehicles, ambulances, and fire trucks
    need additional room to operate, and you must not follow closer than 500 feet
    to a fire truck.
- id: 232
  category: defensive_driving
  question: Why should you leave extra space when stopped on a hill or incline behind
    another vehicle?
  choices:
    A: To improve your visibility of the traffic light
    B: Because the vehicle ahead may roll back when it starts up
    C: To allow room for pedestrians to cross between vehicles
    D: Because it reduces the wear on your brakes
  answer: B
  explanation: You should leave extra space when stopped on a hill or incline because
    the vehicle ahead may roll back when it starts up.
- id: 233
  category: safe_driving_rules
  question: When you want to merge with other traffic, how large of a gap do you generally
    need?
  choices:
    A: About two seconds
    B: About three seconds
    C: About four seconds
    D: About six seconds
  answer: C
  explanation: Anytime you want to merge with other traffic, you need a gap of about
    four seconds. This ensures both you and the vehicle behind you have a two-second
    following distance.
- id: 234
  category: sharing_the_road
  question: What should you do if you are overtaking a bicycle and an oncoming vehicle
    is approaching at the same time?
  choices:
    A: Speed up to pass the bicycle before the vehicle reaches you
    B: Honk your horn so the bicycle rider moves off the road
    C: Squeeze between the bicycle and the oncoming vehicle
    D: Slow down and let the oncoming vehicle pass first
  answer: D
  explanation: When possible, take potential hazards one at a time. If you are overtaking
    a bicycle and an oncoming vehicle is approaching, slow down and let the vehicle
    pass first so that you can give extra room to the bicycle rider.
- id: 235
  category: safe_driving_rules
  question: What is the safest way to change multiple lanes?
  choices:
    A: Move across all lanes at once to minimize time spent changing lanes
    B: Take them one at a time, like going up or down stairs
    C: Slow down drastically before crossing multiple lanes
    D: Straddle two lanes until a large gap opens up
  answer: B
  explanation: If you want to move over several lanes, take them one at a time. Like
    going up or down stairs one-step at a time, it is safest and easiest to merge
    one lane at a time.
- id: 236
  category: penalties_and_points
  question: What can happen if you enter an intersection on a green light but vehicles
    are blocking your way, causing you to get caught in the intersection when the
    light turns red?
  choices:
    A: You have the right-of-way to back up
    B: You can get a ticket for blocking an intersection
    C: Oncoming traffic must yield to you
    D: Your license will be immediately suspended
  answer: B
  explanation: Even if you have a green light, do not start across an intersection
    if there are vehicles blocking your way. If caught in the intersection when the
    light changes to red, you will block traffic and can get a ticket for blocking
    an intersection.
- id: 237
  category: defensive_driving
  question: What should you do if you are being followed closely by another vehicle?
  choices:
    A: Tap your brakes repeatedly to warn the driver
    B: Decrease your following distance from the vehicle ahead of you
    C: Try to allow extra room in front of your vehicle
    D: Move to the far left lane
  answer: C
  explanation: When being followed closely, you should try to allow extra room in
    front of you. You will then be able to stop without being hit from behind.
- id: 238
  category: sharing_the_road
  question: When approaching a stopped emergency vehicle with flashing lights on a
    highway with less than four lanes, what must you do if it is safe?
  choices:
    A: Maintain your speed and stay in your lane
    B: Slow down and pass to the left
    C: Pull over to the right shoulder and stop
    D: Honk your horn to alert the emergency workers
  answer: B
  explanation: On highways with less than four lanes, slow down, and pass to the left,
    if it is safe to do so when approaching a stopped roadside assistance, emergency,
    or police vehicle using flashing lights.
- id: 239
  category: defensive_driving
  question: Why is it dangerous to drive in the far left lane when you are not passing?
  choices:
    A: It causes excessive wear on the left-side tires
    B: It frustrates other drivers and may contribute to aggressive driving
    C: It makes it difficult to see road signs on the right
    D: It increases your vehicle's fuel consumption
  answer: B
  explanation: Driving in the far left lane when you’re not passing is dangerous because
    it frustrates other drivers and may contribute to 'road rage' and aggressive driving
    behavior.
- id: 240
  category: sharing_the_road
  question: Why do you need extra following distance when driving behind a motorcycle
    on a wet or icy road?
  choices:
    A: Motorcycles take longer to stop than cars
    B: The chances of a motorcycle rider falling are greatest on these surfaces
    C: Motorcycles spray more water onto your windshield
    D: Motorcycles are required to drive slower in bad weather
  answer: B
  explanation: If the motorcycle or bicycle rider should fall, you need extra distance
    to avoid the rider. The chances of a fall are greatest on wet or icy roads, gravel
    roads, or metal surfaces.
- id: 241
  category: defensive_driving
  question: What should you do if you are crossing traffic and there is a median divider?
  choices:
    A: Stop halfway across only if the median divider is large enough for your vehicle
    B: Always stop in the median divider, regardless of its size
    C: Never stop in a median divider under any circumstances
    D: Stop halfway across even if part of your vehicle sticks into traffic
  answer: A
  explanation: Stopping halfway across is only safe when there is a median divider
    large enough for your vehicle. Do not stop in a divider where part of your vehicle
    is sticking into traffic.
- id: 242
  category: safe_driving_rules
  question: If you want to parallel park and there is traffic behind you, what is
    the correct procedure?
  choices:
    A: Stop suddenly in the lane and back into the space
    B: Put on your turn signal, pull next to the space, and allow following vehicles
      to pass before parking
    C: Pull into the space head-first to avoid holding up traffic
    D: Wave the traffic around you while you slowly back up
  answer: B
  explanation: If you want to parallel park and there is traffic behind you, put on
    your turn signal, pull next to the space, and allow following vehicles to pass
    before you park.
- id: 243
  category: defensive_driving
  question: How should you handle steering between two hazards, such as an oncoming
    tractor-trailer and parked cars?
  choices:
    A: Steer closer to the parked cars to avoid the moving vehicle
    B: Steer a middle course, but leave a little more room on the side of the tractor-trailer
    C: Steer closer to the tractor-trailer because it has better brakes
    D: Stop completely until the tractor-trailer has passed
  answer: B
  explanation: You should split the difference between two hazards. However, if one
    is more dangerous than the other, leave a little more space on the dangerous side.
    For example, if the oncoming vehicle is a tractor-trailer, leave a little more
    room on the side that the truck will pass.
- id: 244
  category: safe_driving_rules
  question: What should you do if you have a green light but there are vehicles blocking
    the intersection ahead?
  choices:
    A: Enter the intersection and wait for traffic to clear.
    B: Honk your horn until the vehicles move.
    C: Do not start across the intersection.
    D: Slowly weave through the blocking vehicles.
  answer: C
  explanation: Even if you have a green light, do not start across an intersection
    if there are vehicles blocking your way. If caught in the intersection when the
    light changes to red, you will block traffic and can get a ticket.
- id: 245
  category: defensive_driving
  question: Why should you be particularly cautious when an approaching motorcycle
    has its turn signal on?
  choices:
    A: Motorcycles are required to keep their signals on at all times.
    B: Motorcycle turn signals often do not cancel by themselves.
    C: Motorcycles turn much faster than cars.
    D: Motorcycle signals are usually harder to see.
  answer: B
  explanation: You should wait until the other driver actually starts to turn because
    motorcycle signals often do not cancel by themselves, and the rider may have forgotten
    to turn it off from a prior turn.
- id: 246
  category: safe_driving_rules
  question: At a speed of 55 mph, approximately how much distance do you need to safely
    pass another vehicle on a two-lane roadway?
  choices:
    A: 400 feet
    B: 800 feet
    C: 1600 feet
    D: 3200 feet
  answer: C
  explanation: At 55 mph, you and an oncoming vehicle will travel over 800 feet in
    ten seconds. That means you need over 1600 feet or about one-third of a mile to
    pass safely.
- id: 247
  category: safe_driving_rules
  question: You should not start to pass a vehicle if you are within what distance
    of a hill or curve?
  choices:
    A: One-quarter of a mile
    B: One-third of a mile
    C: One-half of a mile
    D: One mile
  answer: B
  explanation: You have to be able to see at least one-third of a mile or about 15
    seconds ahead. Do not start to pass if you are within one-third of a mile of a
    hill or curve.
- id: 248
  category: safe_driving_rules
  question: When is it safe to return to the driving lane after passing another vehicle?
  choices:
    A: When you are one car length ahead of the passed vehicle.
    B: When you can see both headlights of the passed vehicle in your rearview mirror.
    C: As soon as you activate your right turn signal.
    D: When the driver of the passed vehicle flashes their headlights.
  answer: B
  explanation: When you return to the driving lane, be sure to leave enough room.
    When you can see both headlights of the vehicle you just passed in your rearview
    mirror, it is safe to return to the driving lane.
- id: 249
  category: sharing_the_road
  question: Under what circumstances is a motor vehicle driver permitted to drive
    in a bicycle lane?
  choices:
    A: When passing a slower vehicle on the right.
    B: When traffic is heavily congested.
    C: Only when making a turn or crossing it to park near the curb.
    D: Drivers are never permitted to drive in a bicycle lane under any circumstances.
  answer: C
  explanation: Do not drive in a bicycle lane except when making a turn or when you
    need to cross the bicycle lane to park near the curb.
- id: 250
  category: sharing_the_road
  question: How much space must a driver allow when overtaking or passing a bicyclist?
  choices:
    A: At least one foot
    B: At least two feet
    C: At least three feet
    D: At least five feet
  answer: C
  explanation: Drivers must allow at least three feet of space between any portion
    of the vehicle and the bicycle when overtaking or passing a bicyclist.
- id: 251
  category: sharing_the_road
  question: What should you do if you are about to make a right turn and a bicyclist
    is riding ahead of you?
  choices:
    A: Speed up and pass the bicyclist immediately before the turn.
    B: Honk your horn to warn the bicyclist to move out of the way.
    C: Slow down and let the bicyclist clear the intersection before making your turn.
    D: Share the lane with the bicyclist while making the turn.
  answer: C
  explanation: If you are about to make a right turn, do not pass a bicyclist immediately
    before the turn; slow down and let the bicyclist clear the intersection before
    making your turn rather than cutting in front of the rider.
- id: 252
  category: sharing_the_road
  question: What must a bicyclist do when riding on a two-lane road where it is unsafe
    to pass, and five or more vehicles are in a line behind them?
  choices:
    A: Increase their speed to match the flow of traffic.
    B: Move to the center of the lane to prevent unsafe passing.
    C: Pull over and stop when it is safe to let vehicles pass.
    D: Signal the vehicles to pass them on the right.
  answer: C
  explanation: When riding on a two-lane road where it is unsafe to pass, and five
    or more vehicles are in a line behind you, bicyclists must pull over and stop
    when, in the rider's judgment, it is safe to let vehicles pass.
- id: 253
  category: sharing_the_road
  question: When a bicyclist chooses to ride on a sidewalk, what must they do before
    passing a pedestrian?
  choices:
    A: Move onto the roadway temporarily.
    B: Use an audible signal to warn the pedestrian.
    C: Flash a front-mounted white light.
    D: Dismount and walk the bicycle past the pedestrian.
  answer: B
  explanation: Bicyclists must yield to pedestrians on sidewalks or in crosswalks.
    Use an audible signal to warn pedestrians before passing.
- id: 254
  category: vehicle_information
  question: By Washington state definition, an electric-assisted bicycle has a motor
    capable of propelling the bike at no more than what speed on level ground?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Electric-assisted bicycles are defined as bicycles that can be operated
    with pedals, but also have an electric motor capable of propelling the bike not
    more than 20 mph on level ground.
- id: 255
  category: sharing_the_road
  question: Are bicyclists permitted to ride on the shoulders of freeways and other
    highways?
  choices:
    A: Yes, except where signs say it is illegal.
    B: Yes, but only during daylight hours.
    C: No, bicycles are strictly prohibited on all freeways.
    D: No, unless they are riding an electric-assisted bicycle.
  answer: A
  explanation: Bicyclists may use the shoulders of freeways and other highways, except
    where signs say it is illegal.
- id: 256
  category: defensive_driving
  question: Why should a driver avoid slowing down or stopping quickly immediately
    after passing a bicyclist?
  choices:
    A: The bicyclist may become caught in the vehicle's slipstream.
    B: A motor vehicle's brakes are more powerful than a bicycle's, which could cause
      a crash.
    C: It is illegal to brake within 100 feet of passing a bicycle.
    D: The bicyclist is required to pass the vehicle on the right.
  answer: B
  explanation: Be careful after you have passed a bicyclist. Do not slow down or stop
    quickly. A motor vehicle's brakes are more powerful than a bicycle's, and if you
    stop suddenly you could cause a crash.
- id: 257
  category: safe_driving_rules
  question: When judging whether you have enough room to pass safely, what is the
    general rule regarding the number of vehicles you should pass?
  choices:
    A: Pass as many vehicles as possible to maintain traffic flow.
    B: Pass no more than three vehicles at once.
    C: Generally, only pass one vehicle at a time.
    D: Pass multiple vehicles only if you are driving a large truck.
  answer: C
  explanation: Do not count on having enough time to pass several vehicles at once.
    Be safe. Generally, only pass one vehicle at a time.
- id: 258
  category: sharing_the_road
  question: When a bicyclist is operating on a roadway at a speed less than the normal
    flow of traffic, which of the following is true regarding their lane positioning?
  choices:
    A: They must always ride on the unpaved shoulder.
    B: They are legally required to ride on the sidewalk if one is available.
    C: Lane positioning is in the rider's judgment, and they may legally use the full
      lane.
    D: They must ride exactly on the solid white line.
  answer: C
  explanation: Lane positioning for safety is in the rider's judgment, and a bicyclist
    may legally use the full lane. They must ride as near to the right of the roadway
    as is safe, but can use the full lane.
- id: 259
  category: sharing_the_road
  question: When must a bicyclist pull over and stop to let vehicles pass?
  choices:
    A: When 3 or more vehicles are behind them
    B: When 5 or more vehicles are in a line behind them
    C: Whenever a single vehicle wants to pass
    D: Bicyclists are never required to pull over
  answer: B
  explanation: According to the manual, if five or more vehicles are in a line behind
    a bicyclist, they must pull over and stop when it is safe to let vehicles pass.
- id: 260
  category: sharing_the_road
  question: What must a bicyclist do before passing a pedestrian on a sidewalk?
  choices:
    A: Flash their headlight
    B: Pass on the right side only
    C: Use an audible signal to warn the pedestrian
    D: Dismount and walk the bicycle past the pedestrian
  answer: C
  explanation: Bicyclists must yield to pedestrians on sidewalks or in crosswalks
    and must use an audible signal to warn pedestrians before passing.
- id: 261
  category: vehicle_information
  question: What lighting equipment is required for a bicycle when riding at night?
  choices:
    A: A white headlight visible for 300 feet and a red taillight visible for 300
      feet
    B: A steady white headlight visible for 500 feet and a red reflector visible for
      600 feet to the rear
    C: A flashing white headlight and a flashing red taillight
    D: Reflective tape on the pedals and a white reflector on the front
  answer: B
  explanation: When riding at night, a bicycle must have a steady white headlight
    visible for 500 feet and a red reflector visible for 600 feet to the rear.
- id: 262
  category: vehicle_information
  question: What is the legal requirement for bicycle brakes?
  choices:
    A: They must be able to stop the bicycle within 15 feet at 10 mph
    B: They must be equipped with anti-lock braking technology
    C: They must make the wheels skid on dry, level, clean pavement
    D: They must operate on both the front and rear wheels simultaneously
  answer: C
  explanation: Every bicycle must be equipped with a brake that makes the wheels skid
    on dry, level, clean pavement.
- id: 263
  category: safe_driving_rules
  question: Under what condition may a bicyclist carry packages while riding?
  choices:
    A: Only if the packages are secured in a backpack
    B: If the rider can keep at least one hand on the handlebars at all times
    C: Only if the packages weigh less than 10 pounds
    D: Bicyclists are strictly prohibited from carrying packages
  answer: B
  explanation: Bicyclists cannot carry packages unless the rider can keep at least
    one hand on the handlebars at all times.
- id: 264
  category: safe_driving_rules
  question: What should you do with your bicycle helmet if you have been in a crash?
  choices:
    A: Inspect it for cracks and reuse it if it looks fine
    B: Have it recertified by a bike shop
    C: Always get a new helmet
    D: Wash it with mild soap and water before wearing it again
  answer: C
  explanation: The manual states that you should always get a new helmet if yours
    has been in a crash.
- id: 265
  category: defensive_driving
  question: How much space should a bicyclist leave between themselves and parked
    cars to avoid opened doors?
  choices:
    A: About one foot
    B: About two feet
    C: About three feet
    D: At least five feet
  answer: C
  explanation: Bicyclists should leave about three feet between themselves and parked
    cars so that an opened door will not block their path.
- id: 266
  category: defensive_driving
  question: Why should bicyclists avoid passing vehicles on the right side at intersections?
  choices:
    A: It is illegal to ride on the right side of the road
    B: Motorists turning right may not look for or see a bicycle passing on the right
    C: Bicycles must always pass on the left in all situations
    D: The right side of the road usually has more potholes
  answer: B
  explanation: Bicyclists should not pass on the right side of vehicles at intersections
    because motorists turning right may not look for, or see, a bicycle passing on
    the right.
- id: 267
  category: safe_driving_rules
  question: What should a bicyclist do if a dog continues to chase them after being
    yelled at?
  choices:
    A: Pedal as fast as possible to outrun the dog
    B: Kick at the dog to scare it away
    C: Get off the bike and put it between themselves and the dog
    D: Swerve into the traffic lane to avoid the dog
  answer: C
  explanation: If a dog starts to chase you and does not stop when you yell 'NO!',
    you should get off your bike and put it between you and the dog.
- id: 268
  category: sharing_the_road
  question: What is a common cause of serious car and motorcycle crashes?
  choices:
    A: Motorcycles rear-ending cars at stop signs
    B: Cars turning left in front of an oncoming motorcyclist
    C: Motorcycles passing cars on the right shoulder
    D: Cars and motorcycles sideswiping each other on the freeway
  answer: B
  explanation: Cars turning left in front of an oncoming motorcyclist may cause serious
    car/motorcycle crashes because drivers may fail to see the rider or judge their
    speed.
- id: 269
  category: defensive_driving
  question: What should you do if you are waiting to turn and see an approaching motorcycle
    with its turn signal flashing?
  choices:
    A: Proceed immediately because the motorcycle is definitely turning
    B: Honk your horn to remind the motorcyclist to turn off their signal
    C: Wait to be sure the motorcycle is actually turning before you proceed
    D: Flash your headlights to warn the motorcyclist
  answer: C
  explanation: Most motorcycles do not have turn signals that turn off automatically.
    Before turning in front of a motorcycle with a flashing signal, be sure the motorcycle
    is actually turning and not continuing straight.
- id: 270
  category: sharing_the_road
  question: When is it permissible for a car to share the same lane alongside a motorcycle?
  choices:
    A: When the lane is extra wide
    B: When the motorcyclist is riding far to the right side of the lane
    C: When traffic is moving at less than 15 mph
    D: Never; motorcyclists are entitled to the full lane width
  answer: D
  explanation: Motorcyclists are entitled to the same full lane width as all other
    vehicles. You should never move into the same lane alongside a motorcyclist, even
    if the lane is wide.
- id: 271
  category: safe_driving_rules
  question: What is the recommended following distance you should allow between your
    vehicle and a motorcycle?
  choices:
    A: Two seconds
    B: Three seconds
    C: More than four seconds
    D: At least six seconds
  answer: C
  explanation: You should allow more than four seconds following distance between
    your vehicle and a motorcycle to allow enough time to maneuver or stop in an emergency.
- id: 272
  category: sharing_the_road
  question: Under what condition may a motorcyclist pass a bicyclist occupying the
    same lane?
  choices:
    A: If they pass on the right with at least two feet of clearance
    B: If they pass on the left with at least three feet of clear passing distance
    C: Only if the bicyclist signals them to pass
    D: Motorcyclists are never allowed to pass a bicyclist in the same lane
  answer: B
  explanation: Motorcyclists may overtake and pass a bicyclist in the same lane provided
    they pass to the left with at least three feet of clear passing distance.
- id: 273
  category: defensive_driving
  question: Why should drivers use extra caution and avoid following snowplows too
    closely?
  choices:
    A: Snowplows frequently stop and back up without warning
    B: Snowplows drop large amounts of salt that can damage windshields
    C: The blades force snow up, potentially causing blizzard-like conditions and
      reduced visibility
    D: Snowplows travel at high speeds and may brake suddenly
  answer: C
  explanation: You should use extra caution around snowplows because their blades
    force snow up and off the road, potentially causing blizzard-like conditions and
    reduced visibility for drivers following too closely.
- id: 274
  category: sharing_the_road
  question: How much distance does it take a loaded truck with properly adjusted brakes
    to come to a complete stop when traveling 55 mph on a dry road?
  choices:
    A: 250 feet
    B: 300 feet
    C: 450 feet
    D: 500 feet
  answer: C
  explanation: According to the manual, it takes a loaded truck with properly adjusted
    brakes 450 feet to come to a complete stop when traveling 55 mph on a dry road.
- id: 275
  category: sharing_the_road
  question: How can you tell if you are driving in a large vehicle's blind spot directly
    behind them?
  choices:
    A: You cannot see the vehicle's taillights.
    B: You cannot see the driver's mirrors.
    C: You are following closer than 200 feet.
    D: You cannot see the vehicle's license plate.
  answer: B
  explanation: 'The manual states: "If you are following a large vehicle and you cannot
    see the driver''s mirrors, then the driver cannot see you either."'
- id: 276
  category: sharing_the_road
  question: What should you do if a large vehicle ahead of you is angling into the
    left lane while signaling a right turn?
  choices:
    A: Quickly pass them on the right side.
    B: Honk your horn to warn them they are in the wrong lane.
    C: Stay behind them and do not try to squeeze by on the right side.
    D: Move into the oncoming traffic lane to pass them on the left.
  answer: C
  explanation: 'When turning right, large vehicle drivers may angle into the left
    lane to make the turn without hitting the curb. The manual warns: "Do not try
    to squeeze by on the right side when a large vehicle is making a turn."'
- id: 277
  category: safe_driving_rules
  question: What must all vehicles carrying hazardous materials do at railroad crossings?
  choices:
    A: Speed up to cross the tracks quickly.
    B: Stop at all railroad crossings.
    C: Sound their horn before crossing.
    D: Turn on their hazard lights and proceed without stopping.
  answer: B
  explanation: The manual explicitly states that "All vehicles carrying hazardous
    materials must stop at all railroad crossings, so be prepared to stop if you are
    following one."
- id: 278
  category: safe_driving_rules
  question: What is the purpose of "escape" or "runaway" ramps on long, steep grades?
  choices:
    A: To provide a safe place for slow vehicles to let others pass.
    B: To serve as a rest area for tired drivers.
    C: To stop vehicles whose brakes have failed.
    D: To allow large trucks to weigh their cargo.
  answer: C
  explanation: The manual notes that drivers should not park in or near escape or
    runaway ramps, as "These ramps should only be used to stop vehicles whose brakes
    have failed."
- id: 279
  category: defensive_driving
  question: Why should you give extra room to pedestrians walking in the same direction
    as the traffic flow?
  choices:
    A: They are required by law to have the right-of-way.
    B: They have their backs to you and cannot see you approaching.
    C: They are likely to suddenly cross the street.
    D: They are usually distracted by electronic devices.
  answer: B
  explanation: The manual lists pedestrians walking in the same direction as traffic
    flow under "Those who cannot see you," explaining that "Since they have their
    back to you, they cannot see you."
- id: 280
  category: defensive_driving
  question: What should you do if another driver makes a mistake while trying to pass
    you?
  choices:
    A: Speed up so they can merge behind you.
    B: Honk your horn and maintain your speed.
    C: Move onto the shoulder of the road.
    D: Slow down and let them return to the drive lane safely.
  answer: D
  explanation: 'Under the ''Drivers in trouble'' section, the manual advises: "If
    another driver makes a mistake in passing you, do not make it worse. Slow down
    and let them return to the drive lane safely."'
- id: 281
  category: safe_driving_rules
  question: Approximately what percentage of all fatal collisions involve a vehicle
    that left the roadway?
  choices:
    A: 25%
    B: 44%
    C: 75%
    D: 90%
  answer: B
  explanation: The manual states that "Nearly 44% of all fatal collisions involve
    a vehicle that left the roadway."
- id: 282
  category: safe_driving_rules
  question: Which of the following factors is involved in more than half of all run-off-the-road
    fatalities?
  choices:
    A: Speeding
    B: Vehicle equipment failure
    C: Poor weather conditions
    D: Animal crossings
  answer: A
  explanation: According to the text, "Speeding was involved in more than half of
    run-off-the-road fatalities and in just under half of serious injuries reported."
- id: 283
  category: defensive_driving
  question: How many vehicles are typically involved in fatal and serious injury run-off-the-road
    collisions?
  choices:
    A: Over 90% involve only one vehicle.
    B: Most involve two vehicles colliding head-on.
    C: About 50% involve a vehicle and a bicyclist.
    D: They almost always involve a large commercial truck.
  answer: A
  explanation: The manual notes that "Over 90% of fatal and serious injury run-off-the-road
    collisions involve only one vehicle."
- id: 284
  category: driver_responsibility
  question: What period of driving is considered the most critical for any novice
    driver due to a higher likelihood of crashing?
  choices:
    A: The first month
    B: The first six months
    C: The first year
    D: The first two years
  answer: B
  explanation: 'The manual states: "The first six months of driving for any novice
    driver, regardless of age, are the most critical because the new driver is more
    likely to be involved in a crash due to lack of experience."'
- id: 285
  category: driver_responsibility
  question: Why is flexibility of the neck and torso important for safe driving?
  choices:
    A: It helps you sit comfortably on long trips.
    B: It allows you to use your best possible vision to check for hazards before
      turning or backing.
    C: It is required to pass the physical portion of the driving test.
    D: It helps you reach the pedals and steering wheel more easily.
  answer: B
  explanation: The manual explains that physical abilities, including flexibility
    of the neck and torso, are important "when using best possible vision for safety
    hazards before turning, backing, changing lanes, or merging."
- id: 286
  category: penalties_and_points
  question: What could happen if your driver license requires corrective lenses and
    you are stopped by law enforcement while driving without them?
  choices:
    A: You will be given a warning.
    B: Your vehicle will be impounded immediately.
    C: You could get a ticket.
    D: You will be required to retake the vision test on the spot.
  answer: C
  explanation: 'The manual warns: "If your driver license says you must wear corrective
    lenses and you get stopped without them, you could get a ticket."'
- id: 287
  category: defensive_driving
  question: Because you cannot focus clearly on things in your side vision, what must
    you do to spot vehicles and potential trouble?
  choices:
    A: Turn your head completely around every few seconds.
    B: Rely entirely on your peripheral vision.
    C: Use your side mirrors and glance to the side if necessary.
    D: Keep your eyes fixed straight ahead at all times.
  answer: C
  explanation: 'The manual states regarding side vision: "Because you cannot focus
    on things to the side, you must also use your side mirrors and glance to the side
    if necessary."'
- id: 288
  category: defensive_driving
  question: Why should you allow extra room for drivers or bicyclists who are slowing
    down for no apparent reason?
  choices:
    A: They are likely preparing to make an illegal U-turn.
    B: They may be able to see a hazard that you cannot see from your lane position.
    C: They are trying to force you to pass them.
    D: They are testing their brakes.
  answer: B
  explanation: 'When discussing people who may be confused, the manual advises watching
    for those slowing for no apparent reason, noting: "Remember that they may be able
    to see something you can’t see from your lane position."'
- id: 289
  category: safe_driving_rules
  question: Why should you avoid using dark glasses or tinted contact lenses at night?
  choices:
    A: They can cause temporary color blindness.
    B: They reflect too much light into the eyes of oncoming drivers.
    C: They will cut down the light that you need to see clearly.
    D: They are illegal to wear while driving in all states.
  answer: C
  explanation: The manual advises to avoid using dark glasses or tinted contact lenses
    at night because they will cut down the light that you need to see clearly.
- id: 290
  category: safe_driving_rules
  question: According to studies, how do the driving records of hearing-impaired drivers
    compare to drivers with good hearing?
  choices:
    A: They have significantly more collisions.
    B: They are just as good as drivers with good hearing.
    C: They have fewer minor accidents but more major ones.
    D: They are slightly worse due to the inability to hear sirens.
  answer: B
  explanation: Studies have shown that the driving records of hearing impaired drivers
    are just as good as those drivers with good hearing because they learn to rely
    more on their vision and stay alert.
- id: 291
  category: safe_driving_rules
  question: To help prevent getting tired on a long trip, how often should you take
    a break?
  choices:
    A: Every hour or so.
    B: Every three hours.
    C: Only when you need to refuel.
    D: Every 200 miles.
  answer: A
  explanation: The manual recommends taking breaks by stopping every hour or so, or
    when you need to, to walk around and get fresh air.
- id: 292
  category: safe_driving_rules
  question: How does eating a large meal before a trip affect your driving?
  choices:
    A: It provides necessary energy for long-distance driving.
    B: It improves your reaction time.
    C: It can make you sleepy.
    D: It helps you stay alert during night driving.
  answer: C
  explanation: The manual advises to eat lightly and not eat a large meal before you
    leave, because some people get sleepy after they eat a big meal.
- id: 293
  category: alcohol_drugs_health
  question: Alcohol is involved in approximately what percentage of traffic collisions
    in which someone is killed?
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: According to the manual, alcohol is involved in about 40% of the traffic
    collisions in which someone is killed.
- id: 294
  category: alcohol_drugs_health
  question: How does alcohol affect the central nervous system?
  choices:
    A: It acts as a stimulant to speed up brain activity.
    B: It acts as a depressant to slow the activity of the brain and spinal cord.
    C: It has no effect on the central nervous system until it is digested.
    D: It improves coordination and reaction time temporarily.
  answer: B
  explanation: Alcohol is a drug that depresses the central nervous system, slowing
    the activity of the brain and the spinal cord.
- id: 295
  category: alcohol_drugs_health
  question: How long does it usually take for alcohol to be absorbed directly into
    the bloodstream through the stomach and small intestine?
  choices:
    A: 5 to 10 minutes
    B: 20 to 40 minutes
    C: 1 to 2 hours
    D: 3 to 4 hours
  answer: B
  explanation: Once swallowed, alcohol is absorbed directly into the blood stream
    through the walls of the stomach and small intestine, usually within 20 - 40 minutes.
- id: 296
  category: alcohol_drugs_health
  question: Which of the following is considered a typical alcoholic drink containing
    an equal amount of alcohol?
  choices:
    A: 12 oz. of 80-proof liquor
    B: 5 oz. of beer
    C: 1 1/2 oz. of 80-proof liquor
    D: 12 oz. of wine
  answer: C
  explanation: A typical alcoholic drink is 1 1/2 oz. of 80-proof liquor (one shot
    glass), 12 oz. of beer, or a 5 oz. glass of wine.
- id: 297
  category: alcohol_drugs_health
  question: How does the human body dispose of most of the alcohol consumed?
  choices:
    A: Through sweat and breath
    B: Through oxidation in the liver
    C: Through the digestive tract
    D: Through the kidneys and urine
  answer: B
  explanation: While very small quantities are eliminated through sweat, breath, and
    urine, the body disposes of most alcohol through oxidation (burning) in the liver.
- id: 298
  category: alcohol_drugs_health
  question: Approximately how long does it take for your body to get rid of each typical
    alcoholic drink?
  choices:
    A: 30 minutes
    B: One hour
    C: Two hours
    D: Four hours
  answer: B
  explanation: The oxidation of alcohol takes place at a constant rate, and it takes
    about one hour for your body to get rid of each drink.
- id: 299
  category: alcohol_drugs_health
  question: Why can consuming marijuana-infused foods be particularly dangerous for
    drivers?
  choices:
    A: They contain a higher percentage of alcohol than typical drinks.
    B: They cause immediate and severe hallucinations.
    C: It takes longer to feel the effects, making it easier to consume too much.
    D: They permanently damage the central nervous system.
  answer: C
  explanation: Consuming marijuana-infused foods can be dangerous because it takes
    longer to feel the effects, making it easier to have too much because the effects
    are delayed.
- id: 300
  category: alcohol_drugs_health
  question: According to the manual, marijuana has been shown to impair performance
    on driving tasks for up to how long?
  choices:
    A: 1 hour
    B: 3 hours
    C: 5 hours
    D: 12 hours
  answer: C
  explanation: Marijuana has been shown to impair performance on driving tasks and
    on driving courses for up to 5 hours.
- id: 301
  category: alcohol_drugs_health
  question: What is a potential danger of taking "uppers" or energy drinks to stay
    awake while driving?
  choices:
    A: They permanently improve your reaction time.
    B: They can later cause you to be nervous, dizzy, and unable to concentrate.
    C: They slow down the absorption of alcohol in the bloodstream.
    D: They act as a depressant on the central nervous system.
  answer: B
  explanation: Pep pills, "uppers", and energy drinks can make a driver feel more
    alert for a short time, but later they can cause a person to be nervous, dizzy,
    unable to concentrate, and can affect vision.
- id: 302
  category: penalties_and_points
  question: What are the penalties for driving under the influence of prescription
    or over-the-counter drugs?
  choices:
    A: A simple warning for the first offense.
    B: A mandatory driver improvement class.
    C: The penalties are the same as for any alcohol violation.
    D: A minor traffic infraction fine.
  answer: C
  explanation: The manual states that if you are arrested or convicted of driving
    under the influence of drugs, the penalties are the same as for any alcohol violation.
- id: 303
  category: alcohol_drugs_health
  question: What happens when you mix drugs and alcohol before driving?
  choices:
    A: The effects of the drugs and alcohol cancel each other out.
    B: It causes a compounded effect where the effects of the drug multiply.
    C: It has the exact same effect as drinking alcohol alone.
    D: It only impairs your driving if you take illegal drugs.
  answer: B
  explanation: According to the manual, mixing drugs and alcohol can cause a compounded
    effect, which means that the effects of the drug multiply to become more than
    1+1.
- id: 304
  category: alcohol_drugs_health
  question: If you are 21 or older, you can be arrested for driving with a Blood Alcohol
    Content (BAC) of what amount or higher?
  choices:
    A: '.02'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: The manual states that you can be arrested for driving with a BAC of
    .08 or more if you are 21 or older.
- id: 305
  category: alcohol_drugs_health
  question: 'If you are under 21, you can be arrested for a THC/marijuana level of
    more than:'
  choices:
    A: 0.00 nanograms per milliliter of blood
    B: 2.00 nanograms per milliliter of blood
    C: 5.00 nanograms per milliliter of blood
    D: 8.00 nanograms per milliliter of blood
  answer: A
  explanation: If you are under 21, you can be arrested for a THC/marijuana level
    of more than 0.00 nanograms per milliliter of blood.
- id: 306
  category: penalties_and_points
  question: What must an arresting officer do if a parent is arrested for a drug-
    or alcohol-related driving offense while a child under age 13 is present in the
    car?
  choices:
    A: Impound the vehicle permanently.
    B: Promptly notify child protective services.
    C: Issue an additional $5,000 fine on the spot.
    D: Revoke the driver's license for an additional 10 years.
  answer: B
  explanation: When a child under age 13 is present in the car of a parent/legal custodian/guardian
    being arrested for a drug- or alcohol-related driving offense, the arresting law
    enforcement officer must promptly notify child protective services.
- id: 307
  category: sharing_the_road
  question: What may happen to a bicycle if a bicyclist is found riding under the
    influence and poses a threat to public safety?
  choices:
    A: The bicycle will be permanently confiscated and sold immediately.
    B: The officer must destroy the bicycle on site.
    C: The officer may impound the bicycle if there are no reasonable alternatives.
    D: The bicyclist will be charged a $500 impound fee to retrieve it.
  answer: C
  explanation: The officer may impound the bicycle if the officer determines that
    impoundment is necessary to reduce a threat to public safety, and there are no
    reasonable alternatives to impoundment.
- id: 308
  category: driver_responsibility
  question: What does the Implied Consent Law mean?
  choices:
    A: You agree to let police search your vehicle at any time.
    B: You agree to take a breath test to determine the alcohol content of your blood.
    C: You agree to plead guilty to your first DUI offense.
    D: You agree to pay all fines associated with traffic infractions.
  answer: B
  explanation: The Implied Consent Law means that when you operate a motor vehicle,
    you have agreed to take a breath test to determine the alcohol content of your
    blood.
- id: 309
  category: penalties_and_points
  question: What is the penalty if it is your first arrest and you refuse to take
    a BAC breath test?
  choices:
    A: Your license will be revoked for one year.
    B: Your license will be suspended for 90 days.
    C: You will be fined $5,000 but keep your license.
    D: You will receive a warning for your first refusal.
  answer: A
  explanation: If it is your first arrest and you refuse to take a breath test, your
    license will be revoked for one year.
- id: 310
  category: penalties_and_points
  question: If it is your first arrest within seven years, you are 21 or older, and
    your breath test shows a BAC of .08 or more, how long will your license be suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: If it is your first arrest within seven years, you are 21 or older,
    and the breath or blood test result shows a BAC of .08 or more... your license
    will be suspended for 90 days.
- id: 311
  category: license_system
  question: Which type of restricted license allows you to drive to work, school,
    or continuing healthcare while your driving privilege is suspended?
  choices:
    A: Ignition Interlock License (IIL)
    B: Occupational/Restricted Driver License (ORL)
    C: Probationary License
    D: Deferred Prosecution License
  answer: B
  explanation: An Occupational/Restricted Driver License (ORL) allows you to drive
    to work, school, court ordered services, continuing healthcare, continuing support
    of a dependent, or employment programs.
- id: 312
  category: penalties_and_points
  question: How long do alcohol/drug-related offenses appear on your driving record?
  choices:
    A: 5 years
    B: 7 years
    C: 10 years
    D: For life
  answer: D
  explanation: According to the manual, alcohol/drug-related offenses appear on your
    driving record for life.
- id: 313
  category: safe_driving_rules
  question: Under the 'Open Container Law,' where is it legal to keep an open container
    of alcohol in a vehicle on a highway?
  choices:
    A: In the glove compartment
    B: In the center console
    C: In an area not normally occupied by the driver or passengers
    D: Under the driver's seat
  answer: C
  explanation: It is a traffic infraction to keep an open container of an alcoholic
    beverage in a vehicle on a highway, unless it is in an area not normally occupied
    by the driver or passengers. It cannot be kept in any accessible storage compartment.
- id: 314
  category: license_system
  question: If you are convicted of driving under the influence or granted a deferred
    prosecution, how long will a probationary license be required?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: If convicted of driving or being in physical control of a vehicle while
    under the influence or are granted a deferred prosecution, a probationary license
    will be required for five years.
- id: 315
  category: penalties_and_points
  question: How many times in your lifetime can you use the deferred prosecution program
    for a DUI charge?
  choices:
    A: Once
    B: Twice
    C: Three times
    D: Unlimited, as long as 7 years have passed between charges
  answer: A
  explanation: 'The manual explicitly states: ''You can only use the deferred prosecution
    program once in your lifetime.'''
- id: 316
  category: penalties_and_points
  question: 'If you are age 13 through 17 and convicted of a first alcohol or firearm
    violation, your driving privilege will be revoked for:'
  choices:
    A: 90 days
    B: 6 months
    C: One year or until age 17, whichever is longer
    D: Two years or until age 18, whichever is longer
  answer: C
  explanation: If you are age 13 through 17 and convicted of a first alcohol or firearm
    violation... your driving privilege will be revoked for one year or until age
    17, whichever is longer.
- id: 317
  category: alcohol_drugs_health
  question: According to the manual, what should you do if you are not feeling well
    due to a bad cold or a stiff neck and need to go somewhere?
  choices:
    A: Take over-the-counter medication and drive carefully.
    B: Drive at a slower speed than the posted limit.
    C: Let someone else drive.
    D: Drink a caffeinated beverage before driving.
  answer: C
  explanation: The manual advises that even little problems like a stiff neck, a cough,
    or a sore leg can affect your driving. If you are not feeling well and need to
    go somewhere, let someone else drive.
- id: 318
  category: alcohol_drugs_health
  question: Under what condition may a person with epilepsy drive in Washington?
  choices:
    A: If they have not had a seizure for three months.
    B: If they have not had a seizure for six months and are under medical care.
    C: Only during daylight hours.
    D: If they have a specialized driver's license.
  answer: B
  explanation: According to the manual, you may drive in Washington if you are under
    the care of a doctor, have been taking your medication, and have not had a seizure
    for six months.
- id: 319
  category: alcohol_drugs_health
  question: Why should drivers with diabetes have their eyes checked regularly?
  choices:
    A: To check for possible night blindness or other vision problems.
    B: To ensure they can read road signs from 500 feet away.
    C: Because insulin can change the color of their eyes.
    D: To qualify for a medical exemption on their license.
  answer: A
  explanation: The manual states that if you have diabetes, you should have your eyes
    checked regularly for possible night blindness or other vision problems.
- id: 320
  category: driver_responsibility
  question: What should you do if you are angry or excited before driving?
  choices:
    A: Drive slightly below the speed limit.
    B: Listen to loud music to distract yourself.
    C: Give yourself time to cool off and stay off the road until calm.
    D: Roll down the windows to get fresh air while driving.
  answer: C
  explanation: Emotions can affect your ability to drive safely. If you are angry
    or excited, give yourself time to cool off, take a short walk if necessary, and
    stay off the road until you have calmed down.
- id: 321
  category: defensive_driving
  question: What is the recommended action if you feel you are being followed or harassed
    by another driver?
  choices:
    A: Stop your vehicle immediately and confront the driver.
    B: Drive to a secluded area to lose them.
    C: Exit only in an area where there are other people and open businesses.
    D: Brake suddenly to scare the other driver away.
  answer: C
  explanation: If you feel you are being followed or harassed, seek help and exit
    only in an area where there are other people and open businesses around you.
- id: 322
  category: defensive_driving
  question: What is the first thing you should do if your brakes suddenly stop working?
  choices:
    A: Shift into neutral immediately.
    B: Pump the brake pedal several times to build up pressure.
    C: Turn off the ignition to stop the engine.
    D: Pull the parking brake up as fast and hard as possible.
  answer: B
  explanation: If your brakes stop working, the first step is to pump the brake pedal
    several times, which will often build up enough brake pressure to allow you to
    stop.
- id: 323
  category: defensive_driving
  question: How should you brake if a tire suddenly goes flat (blowout)?
  choices:
    A: Slam on the brakes to stop immediately.
    B: Pump the brakes rapidly.
    C: Take your foot off the gas pedal and use the brakes lightly.
    D: Do not use the brakes at all until the vehicle stops on its own.
  answer: C
  explanation: During a tire blowout, you should slow down gradually by taking your
    foot off the gas pedal and using the brakes lightly.
- id: 324
  category: vehicle_information
  question: What should you expect if your engine stalls while you are driving?
  choices:
    A: The steering wheel will lock completely.
    B: The brakes will stop working entirely.
    C: The steering wheel may be difficult to turn and you may have to push very hard
      on the brake pedal.
    D: The vehicle will automatically shift into neutral.
  answer: C
  explanation: If the engine stalls, the steering wheel may be difficult to turn (though
    you can turn it with more effort), and while the brakes will still work, you may
    have to push very hard on the brake pedal.
- id: 325
  category: defensive_driving
  question: What is the correct sequence of actions if your gas pedal sticks and the
    motor keeps going faster?
  choices:
    A: Turn off the engine, shift to neutral, pull off the road.
    B: Shift to neutral, pull off the road, turn off the engine.
    C: Apply the parking brake, turn off the engine, shift to park.
    D: Shift to a lower gear, pump the brakes, turn off the engine.
  answer: B
  explanation: If the gas pedal sticks, you should keep your eyes on the road, quickly
    shift to neutral, pull off the road when safe to do so, and then turn off the
    engine.
- id: 326
  category: defensive_driving
  question: What are a driver's three options when trying to avoid a collision?
  choices:
    A: Stop, turn, or speed up.
    B: Brake, honk, or swerve.
    C: Stop, reverse, or honk.
    D: Accelerate, brake, or brace for impact.
  answer: A
  explanation: 'In avoiding a collision, the manual states that drivers have three
    options: stop, turn, or speed up.'
- id: 327
  category: vehicle_information
  question: How should you brake in an emergency if your vehicle is equipped with
    an antilock braking system (ABS)?
  choices:
    A: Pump the brake pedal rapidly to prevent skidding.
    B: Press the brake pedal as hard as you can and keep pressing on it.
    C: Apply light pressure to the brake pedal and gradually increase it.
    D: Step on the brake pedal, let up, and then turn the steering wheel.
  answer: B
  explanation: With ABS, if you must stop quickly, you should press on the brake pedal
    as hard as you can and keep pressing on it without letting up.
- id: 328
  category: defensive_driving
  question: If your vehicle does NOT have ABS, what is the proper procedure to turn
    quickly to avoid a collision?
  choices:
    A: Turn the steering wheel sharply while pressing the brake pedal as hard as possible.
    B: Step on the brake pedal, then let up and turn the steering wheel.
    C: Shift into neutral and turn the steering wheel.
    D: Accelerate slightly to shift weight to the rear tires before turning.
  answer: B
  explanation: 'Without ABS, you must use a different procedure to turn quickly: step
    on the brake pedal, then let up and turn the steering wheel.'
- id: 329
  category: safe_driving_rules
  question: What is the primary cause of vehicle skids?
  choices:
    A: Traveling too fast for conditions.
    B: Under-inflated tires.
    C: Pumping the brakes too quickly.
    D: Driving with a heavy load in the trunk.
  answer: A
  explanation: The manual explicitly states that skids are caused by drivers traveling
    too fast for conditions.
- id: 330
  category: defensive_driving
  question: What should you do if your vehicle begins to skid?
  choices:
    A: Slam on the brakes to stop the vehicle quickly.
    B: Turn the steering wheel in the opposite direction of the skid.
    C: Stay off the brake and turn the steering wheel in the direction you want the
      vehicle to go.
    D: Shift into a lower gear and apply the parking brake.
  answer: C
  explanation: If your vehicle begins to skid, you should stay off the brake and turn
    the steering wheel in the direction you want the vehicle to go.
- id: 331
  category: defensive_driving
  question: How should you protect yourself if you are about to be hit from the rear?
  choices:
    A: Lean forward toward the steering wheel.
    B: Press yourself against the back of your seat and put your head against the
      head restraint.
    C: Unbuckle your seatbelt so you can exit the vehicle quickly.
    D: Turn your body sideways to avoid whiplash.
  answer: B
  explanation: If hit from the rear, your body will be thrown backwards. You should
    press yourself against the back of your seat and put your head against the head
    restraint, and be ready to apply your brakes.
- id: 332
  category: vehicle_information
  question: Why are lap and shoulder belts especially important if your vehicle is
    hit from the side?
  choices:
    A: They trigger the side airbags to deploy.
    B: They prevent the vehicle's doors from caving in.
    C: Air bags will not help in this situation, and belts keep you behind the wheel.
    D: They automatically apply the brakes upon impact.
  answer: C
  explanation: If hit from the side, your body is thrown towards the side that is
    hit. The manual notes that air bags will not help in this situation, so lap and
    shoulder belts are needed to help keep you behind the wheel.
- id: 333
  category: defensive_driving
  question: What should you do if a collision is imminent to minimize the impact?
  choices:
    A: Brake as hard as possible and brace for a head-on impact.
    B: Try to turn the vehicle to have a glancing blow rather than being struck head-on.
    C: Accelerate to pass the vehicle before it hits you.
    D: Turn off the ignition immediately to prevent a fire.
  answer: B
  explanation: The manual states that if a collision is going to happen, you should
    try to turn the vehicle to have a glancing blow rather than being struck head-on.
- id: 334
  category: driver_responsibility
  question: Why is it against the law to drive over a fire hose at a collision or
    fire scene?
  choices:
    A: It can damage the hose, injure firefighters, or hinder their efforts.
    B: It will cause your vehicle's tires to instantly deflate.
    C: It will automatically trigger a traffic camera ticket.
    D: It causes the water pressure to drop in the surrounding neighborhood.
  answer: A
  explanation: It is against the law to drive over a fire hose because doing this
    can damage the hose, injure firefighters or hinder their efforts.
- id: 335
  category: driver_responsibility
  question: If you are involved in a collision that only damages a vehicle or other
    property, what is your immediate responsibility regarding your vehicle?
  choices:
    A: Leave the vehicle exactly where it is until police arrive.
    B: Move the vehicle off the road, freeway, shoulder or median to a suitable location
      as soon as possible.
    C: Wait for a tow truck before attempting to move the vehicle.
    D: Turn on your hazard lights and stand in the traffic lane to warn others.
  answer: B
  explanation: For all collisions that only damage a vehicle or other property, the
    driver must move the vehicle off the road, freeway, shoulder or median to an exit
    ramp shoulder, cross street or other suitable location as soon as it is possible.
- id: 336
  category: safe_driving_rules
  question: When helping injured persons at a collision scene, who should you help
    first?
  choices:
    A: Those who are walking around and asking for help.
    B: Anyone who is not already walking and talking.
    C: The driver of the other vehicle.
    D: Those who are trapped inside a burning vehicle only.
  answer: B
  explanation: The manual instructs to first help anyone who is not already walking
    and talking. Check for breathing, then check for bleeding.
- id: 337
  category: safe_driving_rules
  question: What should you give an injured person to drink at a collision scene?
  choices:
    A: Only water to prevent dehydration.
    B: A sugary drink to prevent shock.
    C: Warm liquids only.
    D: Do not give injured persons anything to drink.
  answer: D
  explanation: 'The manual explicitly states: "Do not give injured persons anything
    to drink, not even water."'
- id: 338
  category: driver_responsibility
  question: Under what circumstances must you complete a Collision Report form within
    four days?
  choices:
    A: If the collision results in any property damage, regardless of the amount.
    B: If the collision results in injury, death, or property damage of $1,000 or
      more to one person's property and a report is not made by a law enforcement
      officer.
    C: Only if the collision involves an uninsured driver.
    D: If you hit a parked car and cannot find the owner.
  answer: B
  explanation: You must complete a Collision Report form within four days if the collision
    results in an injury, death, or property damage of $1,000 or more to one person's
    property and a report is not made by a law enforcement officer.
- id: 339
  category: signs_and_signals
  question: What information is provided on the blue Emergency Notification System
    (ENS) sign at a railroad crossing?
  choices:
    A: The train schedule for that specific crossing.
    B: A USDOT number that identifies the crossing's physical location.
    C: The speed limit for trains passing through the crossing.
    D: The distance to the nearest hospital.
  answer: B
  explanation: The ENS sign contains a USDOT number that identifies the railroad grade
    crossing’s physical location so emergency crews or railroad personnel can respond.
- id: 340
  category: vehicle_information
  question: If you are a new resident of Washington State, how long do you have to
    register your vehicle?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: If you are a new resident, you must register your vehicle within 30
    days of becoming a resident.
- id: 341
  category: vehicle_information
  question: 'When bringing a vehicle to a licensing office to be titled and registered,
    an odometer reading is required if the vehicle is:'
  choices:
    A: Less than five years old.
    B: Less than ten years old.
    C: More than ten years old.
    D: Purchased from out of state.
  answer: B
  explanation: To title and register your vehicle, bring an odometer reading on a
    secure odometer form, if your vehicle is less than ten years old.
- id: 342
  category: vehicle_information
  question: Which of the following vehicles is NOT titled in Washington, but is required
    to be registered annually?
  choices:
    A: Mopeds
    B: Mobile homes
    C: Snowmobiles
    D: Off-road vehicles
  answer: C
  explanation: Snowmobiles are not titled in Washington, but they are required to
    be registered annually.
- id: 343
  category: vehicle_information
  question: Where should you keep your vehicle's Certificate of Ownership (title)?
  choices:
    A: In the vehicle's glove compartment.
    B: Taped to the inside of the windshield.
    C: In a safe place, but not in the vehicle.
    D: Folded inside your wallet.
  answer: C
  explanation: The title shows the registered and legal owner(s). Keep it in a safe
    place, but not in the vehicle.
- id: 344
  category: vehicle_information
  question: When ownership of a vehicle is transferred, how many days does the purchaser
    have to transfer ownership to avoid penalty fees?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: The purchaser must transfer ownership within 15 days to avoid penalty
    fees.
- id: 345
  category: vehicle_information
  question: 'When a vehicle is sold or traded to a private party or dealer, the owner
    must report the sale within:'
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: A
  explanation: When a vehicle is sold or traded to a private party or dealer, the
    owner must report the sale within five days.
- id: 346
  category: vehicle_information
  question: Where are license renewal month and year tabs required to be placed on
    a vehicle registered in Washington?
  choices:
    A: On both the front and rear license plates.
    B: Only on the front license plate.
    C: Only on the rear license plate.
    D: On the inside of the lower driver's side windshield.
  answer: C
  explanation: License renewal month and year tabs are required only on rear plates.
- id: 347
  category: signs_and_signals
  question: According to the regulatory signs, what is the speed limit in a school
    zone when children are present?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: 'The regulatory signs section lists the school zone sign as: "School:
    Speed Limit 20 mph When Children Are Present".'
- id: 348
  category: driver_responsibility
  question: Approximately how many young people die every year on Washington's roads?
  choices:
    A: Less than 50
    B: Exactly 75
    C: More than 100
    D: Over 500
  answer: C
  explanation: The manual states that more than 100 young people die every year on
    Washington's roads.
- id: 349
  category: driver_responsibility
  question: Which age group has the highest crash rate and highest rates of speeding,
    impaired driving, and distracted driving?
  choices:
    A: 16 to 25
    B: 26 to 35
    C: 36 to 45
    D: 65 and older
  answer: A
  explanation: Drivers aged 16 to 25 have the highest crash rate and the highest rates
    of speeding, impaired driving, and distracted driving of any other age group.
- id: 350
  category: driver_responsibility
  question: In fatal crashes, how does the number of male drivers compare to female
    drivers?
  choices:
    A: Female drivers outnumber male drivers 2 to 1
    B: Male drivers outnumber female drivers by roughly 3 to 1
    C: They are involved in an equal number of fatal crashes
    D: Male drivers outnumber female drivers by roughly 10 to 1
  answer: B
  explanation: The statistics show that in fatal crashes, male drivers outnumber female
    drivers by roughly 3 to 1.
- id: 351
  category: driver_responsibility
  question: According to Washington crash statistics, 16 to 17 year old female drivers
    involved in fatal collisions were more than twice as likely as males to have been
    doing what?
  choices:
    A: Speeding
    B: Driving impaired
    C: Driving distracted
    D: Driving without a seatbelt
  answer: C
  explanation: The manual notes that 16 to 17 year old female drivers involved in
    fatal collisions were more than twice as likely to have been driving distracted
    as their male counterparts.
- id: 352
  category: signs_and_signals
  question: Which of the following is classified as a Work Area sign?
  choices:
    A: Hospital
    B: Flagger
    C: Do Not Enter
    D: Exit Only
  answer: B
  explanation: The manual lists 'Detour' and 'Flagger' under the category of Work
    Area Signs.
- id: 353
  category: signs_and_signals
  question: A 'Hospital' sign is classified as what type of sign?
  choices:
    A: Regulatory Sign
    B: Work Area Sign
    C: Service Sign
    D: Destination Sign
  answer: C
  explanation: According to the manual, 'Hospital' and 'Phone' signs are classified
    as Service Signs.
- id: 354
  category: signs_and_signals
  question: A sign indicating 'City and Mileage' falls under which category?
  choices:
    A: Service Signs
    B: Destination Signs
    C: Regulatory Signs
    D: Work Area Signs
  answer: B
  explanation: The manual categorizes 'City and Mileage' as Destination Signs.
- id: 355
  category: safe_driving_rules
  question: What does the regulatory sign regarding slower traffic instruct drivers
    to do?
  choices:
    A: Slower Traffic Keep Right
    B: Slower Traffic Use Shoulder
    C: Slower Traffic Exit Immediately
    D: Slower Traffic Turn On Hazard Lights
  answer: A
  explanation: The manual lists 'Slower Traffic Keep Right' as a standard regulatory
    sign.
- id: 356
  category: safe_driving_rules
  question: According to the 'Keep Right' regulatory sign, what is the only exception
    to keeping right?
  choices:
    A: When exiting the highway
    B: Except to pass
    C: When driving under the speed limit
    D: When approaching a work zone
  answer: B
  explanation: The regulatory sign listed in the manual specifically states 'Keep
    Right (except to pass)'.
- id: 357
  category: license_system
  question: Which of the following tasks can you complete online at the Washington
    Department of Licensing website?
  choices:
    A: Pay traffic tickets
    B: Renew your vehicle and boat registration
    C: Take your initial driving skills test
    D: Dispute an insurance claim
  answer: B
  explanation: The manual states you can go online to manage your vehicle renewals,
    boat registration, driver's license, and change of address.
- id: 358
  category: defensive_driving
  question: 'To help turn around the alarming crash statistics for young drivers,
    the manual recommends that you do your part by doing all of the following EXCEPT:'
  choices:
    A: Slow down
    B: Always drive sober
    C: Don't text and drive
    D: Only drive during daylight hours
  answer: D
  explanation: 'The manual specifically asks drivers to do their part by: Slow down,
    Always drive sober, and Don''t text and drive. It does not mention restricting
    driving to daylight hours.'
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 359
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 360
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 361
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 362
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 363
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 364
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 365
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 366
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 367
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 368
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 369
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 370
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 371
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 372
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 373
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 374
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 375
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 376
