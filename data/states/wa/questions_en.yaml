metadata:
  source: 2025 Washington Driver Guide (dol.wa.gov)
  total_questions: 307
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What letters do assigned Washington numbers on licenses, permits, and
    ID cards often start with?
  choices:
    A: WA
    B: WDL
    C: DOL
    D: LIC
  answer: B
  explanation: According to the manual, all Washington licenses, permits, and ID cards
    have an assigned Washington number that often starts with the letters WDL.
- id: 2
  category: license_system
  question: Which of the following is true regarding creating a License Express account?
  choices:
    A: You can use a family member's account to access services for yourself.
    B: You do not need a WDL number to create an account.
    C: The account must belong to you, and new drivers must set up their own account.
    D: You can only create an account if you are 18 years of age or older.
  answer: C
  explanation: The manual states that new drivers need to set up their own account,
    you cannot get services for yourself by using someone else's account, and the
    account must belong to you.
- id: 3
  category: license_system
  question: Where should you go if you need help related to your vehicle's registration?
  choices:
    A: A driver licensing office
    B: A vehicle licensing office
    C: A Department of Social and Health Services office
    D: A driver training school
  answer: B
  explanation: The manual specifies to visit a vehicle licensing office for help related
    to vehicle licensing and registration, as opposed to a driver licensing office
    which handles driver licenses and IDs.
- id: 4
  category: license_system
  question: How many days do new residents who are 18 or older and licensed in another
    state have to obtain a Washington State driver license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents that are 18+ years old and licensed in another state
    have 30 days to obtain a Washington State driver license.
- id: 5
  category: driver_testing
  question: What must a new resident (18 or older) do if their out-of-state driver
    license is expired?
  choices:
    A: Pay a late fee to transfer the license without testing.
    B: Pass only the Driving Knowledge Exam.
    C: Pass only the Driving Skills Exam.
    D: Pass both the Driving Knowledge Exam and Driving Skills Exam.
  answer: D
  explanation: If your out-of-state license is expired, you will need to pass both
    the Driving Knowledge Exam and Driving Skills Exam before getting a Washington
    license.
- id: 6
  category: license_system
  question: If you are experiencing homelessness, you may be eligible for which of
    the following?
  choices:
    A: An automatic waiver for the Driving Skills Exam
    B: A no-cost or reduced-fee ID card
    C: A free enhanced driver license
    D: An unrestricted driver license at age 16
  answer: B
  explanation: The manual states that if you are experiencing homelessness, you are
    eligible for a no-cost ID or a reduced-fee ID.
- id: 7
  category: license_system
  question: Which of the following activities is an Enhanced driver license or ID
    NOT suitable for?
  choices:
    A: Domestic air travel
    B: International border crossing by land or sea
    C: International air travel
    D: Access to federal facilities
  answer: C
  explanation: 'While an Enhanced driver license is suitable for domestic air travel,
    border crossings by land/sea, and accessing federal facilities, it is explicitly
    listed as ''Not suitable for: International air travel''.'
- id: 8
  category: license_system
  question: How early can you apply for an instruction permit if you are enrolling
    in an approved driver training course?
  choices:
    A: 15 years old
    B: 15 ½ years old
    C: 16 years old
    D: 18 years old
  answer: A
  explanation: If you are enrolling in a driver training course, you can apply for
    your permit as early as 15 years old (1 to 10 days before your course starts).
- id: 9
  category: driver_testing
  question: If you are NOT enrolling in a driver training course, at what age can
    you take the knowledge exam to get your instruction permit?
  choices:
    A: 15 years old
    B: 15 ½ years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: If you are not enrolling in a driver training course, you can take
    the knowledge exam after you turn 15½ to get your permit.
- id: 10
  category: driver_testing
  question: How long is a passing score on the Driving Knowledge Exam valid for?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: The manual states that your knowledge exam score is only valid for
    2 years.
- id: 11
  category: driver_responsibility
  question: To get your first driver license at age 16 or 17, how many hours of practice
    driving must you complete?
  choices:
    A: 30 hours of day driving and 10 hours of night driving
    B: 40 hours of day driving and 10 hours of night driving
    C: 50 hours of day driving and 15 hours of night driving
    D: 60 hours total of supervised driving
  answer: B
  explanation: Teens ages 16 to 17 must complete at least 40 hours of day driving
    and 10 hours of night driving with a licensed driver.
- id: 12
  category: driver_responsibility
  question: When completing the required practice driving hours for a teen license
    (ages 16-17), the licensed driver supervising you must have at least how many
    years of driving experience?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: For teens ages 16 to 17, practice driving must be done with a licensed
    driver who has 3 or more years of experience.
- id: 13
  category: penalties_and_points
  question: Before applying for a driver license at age 16 or 17, you must be without
    any traffic violations or convictions for how long?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: To get your first driver license at age 16 or 17, you must be without
    any traffic violations or convictions for 6 months prior to applying for the license.
- id: 14
  category: license_system
  question: When you get your license in person at the licensing office, you will
    receive a temporary license before leaving. How long is this temporary license
    valid?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: Before leaving the office, you'll receive a temporary license that
    is good for 45 days while your official license is mailed to you.
- id: 15
  category: driver_responsibility
  question: If you are 18 or older and choose to get a permit to practice driving
    before taking the skills exam, the licensed driver supervising you must have at
    least how many years of driving experience?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: For individuals 18 and older getting their first license, one option
    is to get a permit and practice driving with a licensed driver who has 5 or more
    years of experience.
- id: 16
  category: license_system
  question: During the first 6 months of holding an intermediate driver license, what
    is the restriction on passengers?
  choices:
    A: No passengers are allowed in the vehicle at any time
    B: No passengers under age 20 except immediate family members
    C: Up to 3 passengers under age 20 are permitted
    D: Only passengers over age 25 are allowed
  answer: B
  explanation: According to the manual, during the first 6 months of an intermediate
    driver license, you may have no passengers under age 20 except immediate family
    members.
- id: 17
  category: safe_driving_rules
  question: What are the nighttime driving restrictions for a driver with an intermediate
    license during the first six months?
  choices:
    A: No driving between 10 p.m. and 6 a.m.
    B: No driving between midnight and 5 a.m.
    C: No driving between 1 a.m. and 5 a.m. unless accompanied by a qualifying licensed
      driver
    D: No driving after sunset
  answer: C
  explanation: For the first 6 months, intermediate license holders cannot drive between
    1 a.m. and 5 a.m. unless accompanied by a parent, guardian, or licensed driver
    at least age 25.
- id: 18
  category: safe_driving_rules
  question: When can an intermediate driver license holder use a wireless communication
    device while driving?
  choices:
    A: Only when using hands-free technology
    B: Only to report an emergency
    C: When stopped at a red light
    D: Any time after the first 6 months of driving
  answer: B
  explanation: Intermediate license laws restrict the use of cell phones and wireless
    communication devices while driving, even with hands-free technology. You can
    only use your phone to report an emergency.
- id: 19
  category: penalties_and_points
  question: What is the penalty for a second traffic violation while holding an intermediate
    driver license?
  choices:
    A: License is suspended for 6 months or until you turn 18
    B: Current restrictions apply until age 18
    C: License is revoked permanently
    D: A warning letter is sent to the parents
  answer: A
  explanation: For a 2nd violation on an intermediate license, the license is suspended
    for 6 months or until you turn 18, whichever comes first.
- id: 20
  category: license_system
  question: Which of the following is true regarding juvenile agricultural permits?
  choices:
    A: They waive the requirements for getting your first driver license
    B: They act as a substitution for an instruction permit
    C: There is no minimum age requirement to obtain one
    D: They allow driving anywhere in the state at any time
  answer: C
  explanation: The manual states that there is no minimum age requirement for a juvenile
    agricultural permit, and it allows drivers under 18 to drive within a specific
    area for farm work.
- id: 21
  category: driver_responsibility
  question: Why does the Department of Licensing send early warning letters to drivers
    ages 18 to 21 who receive their first moving violation?
  choices:
    A: To suspend their driving privileges immediately
    B: Because a driver's chances of crashing doubles after their first violation
    C: To require them to retake the driving skills exam
    D: To notify them of an upcoming license expiration
  answer: B
  explanation: The DOL sends early warning letters because a driver's chances of crashing
    doubles after receiving their first violation. The goal is to help young drivers
    realize the risks and reduce repeat offenses.
- id: 22
  category: license_system
  question: Which of the following medical designations can you choose to add to your
    driver license or ID card to assist first responders?
  choices:
    A: Blood type
    B: Deaf or hard of hearing
    C: Asthma alert
    D: Pacemaker indicator
  answer: B
  explanation: You can add specific medical designations to your record, including
    Developmental disability, Deaf or hard of hearing, and Medical alert.
- id: 23
  category: license_system
  question: What must you do to legally drive a motorcycle or commercial motor vehicle?
  choices:
    A: Obtain a completely separate driver license
    B: Add an additional endorsement to your personal driver license
    C: Pass a vision screening only
    D: Wait until you are at least 21 years old
  answer: B
  explanation: To drive motorcycles or commercial motor vehicles, you need to get
    an additional endorsement added to your personal driver license.
- id: 24
  category: driver_testing
  question: After passing the Driving Knowledge Exam, how long do you have to complete
    the Driving Skills Exam?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: After you pass the knowledge exam, you have two years to complete the
    skills exam.
- id: 25
  category: driver_testing
  question: Who is allowed in the vehicle with you during the Driving Skills Exam?
  choices:
    A: Only the examiner, with exceptions for service animals and sign language interpreters
    B: The examiner and one parent or guardian
    C: The examiner and a licensed driver over age 25
    D: Up to three passengers under age 20
  answer: A
  explanation: You and the examiner are the only people allowed in the vehicle during
    the exam, with exceptions made for service animals and sign language interpreters.
- id: 26
  category: driver_testing
  question: How many hours of driving practice are explained in the parent orientation
    class for students under age 18?
  choices:
    A: 30 hours of daylight and 5 hours of night driving
    B: 40 hours of daylight and 10 hours of night driving
    C: 50 hours of daylight and 15 hours of night driving
    D: 60 hours total of driving practice
  answer: B
  explanation: Attending the parent orientation sessions will familiarize mentors
    with the program and further explain the 40 hours of daylight and 10 hours of
    night driving requirement.
- id: 27
  category: license_system
  question: How early can you renew your driver license before it expires?
  choices:
    A: Up to 30 days before
    B: Up to 6 months before
    C: Up to 1 year before
    D: Up to 2 years before
  answer: C
  explanation: Your expiration date can be found near the bottom of your license.
    You can renew your license up to one year before it expires.
- id: 28
  category: license_system
  question: What is required if your driver license has been expired for 8 or more
    years?
  choices:
    A: You must pay a late fee but no exams are required
    B: You must retake the skills and knowledge test
    C: You must complete a new driver training course
    D: You must apply for an intermediate driver license
  answer: B
  explanation: If your license is 8 or more years expired, you'll need to retake the
    skills and knowledge test.
- id: 29
  category: penalties_and_points
  question: Which of the following is a reason a driver could lose their driving privileges?
  choices:
    A: Receiving a single parking ticket
    B: Being a minor in possession of firearms
    C: Driving with an expired vehicle registration
    D: Failing to update their address within 10 days
  answer: B
  explanation: Drivers can lose driving privileges for several reasons, including
    being a minor in possession of alcohol, drugs, or firearms.
- id: 30
  category: safe_driving_rules
  question: Under what condition may an intermediate driver license holder drive at
    any hour with passengers?
  choices:
    A: When driving to or from a school-sponsored event
    B: For agricultural purposes
    C: When commuting to a part-time job
    D: If they have held their instruction permit for at least 6 months
  answer: B
  explanation: As an exception to the restrictions, intermediate driver license holders
    may drive at any hour, with passengers, for agricultural purposes.
- id: 31
  category: penalties_and_points
  question: Minors who receive an alcohol, drug, or firearm offense run the risk of
    having their driver license delayed until what age?
  choices:
    A: 16 years of age
    B: 17 years of age
    C: 18 years of age
    D: 21 years of age
  answer: B
  explanation: According to the manual, minors who receive an alcohol, drug, or firearm
    offense run the risk of delaying their license until they are 17 years of age.
- id: 32
  category: alcohol_drugs_health
  question: What does the Implied Consent Law in Washington state require of drivers?
  choices:
    A: They agree to have their vehicle searched at any traffic stop.
    B: They agree to carry proof of financial responsibility at all times.
    C: They agree to be tested if an officer suspects they are under the influence
      of alcohol or drugs.
    D: They agree to a mandatory license suspension if they receive a speeding ticket.
  answer: C
  explanation: Under The Implied Consent Law (RCW 46.20.308), everyone who drives
    in Washington agrees to be tested if an officer suspects they are under the influence
    of alcohol or drugs.
- id: 33
  category: penalties_and_points
  question: What is the penalty for refusing to take a BAC or THC test if suspected
    of driving under the influence?
  choices:
    A: Loss of driving privilege for 30 days
    B: Loss of driving privilege for 90 to 730 days, or until age 21, whichever is
      longer
    C: A permanent revocation of your driver license
    D: A mandatory 5-year prison sentence
  answer: B
  explanation: If you refuse to be tested, you could lose your driving privilege for
    90 to 730 days, or until you reach age 21, whichever is longer.
- id: 34
  category: alcohol_drugs_health
  question: For drivers age 21 and older, what Blood Alcohol Concentration (BAC) level
    is considered a DUI?
  choices:
    A: 0.02% or higher
    B: 0.04% or higher
    C: 0.05% or higher
    D: 0.08% or higher
  answer: D
  explanation: For drivers age 21 and older, having a BAC of .08% or higher is considered
    a DUI and can result in legal consequences.
- id: 35
  category: alcohol_drugs_health
  question: For drivers under age 21, what level of active THC per milliliter of blood
    is considered a DUI?
  choices:
    A: Anything more than 0 nanograms
    B: 2.00 nanograms or more
    C: 5.00 nanograms or more
    D: 8.00 nanograms or more
  answer: A
  explanation: Drivers under age 21 have the same potential consequences for anything
    more than 0 nanograms of active THC per milliliter of blood in their system.
- id: 36
  category: safe_driving_rules
  question: Under the open container law, where must open alcohol and cannabis products
    be transported in a vehicle?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In a trunk or truck bed
    D: In the back seat floorboard
  answer: C
  explanation: Open alcohol and cannabis products can only be transported in a trunk
    or truck bed. They cannot be kept in storage compartments accessible to the driver.
- id: 37
  category: license_system
  question: If your address changes, within how many days must you update your information
    in License Express?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: If your address changes, update your information in License Express
    within 10 days of the change.
- id: 38
  category: vehicle_information
  question: Where should you keep your vehicle's Certificate of Ownership (title)?
  choices:
    A: In the vehicle's glove box
    B: Taped to the inside of the windshield
    C: In a safe place but not in the vehicle
    D: Folded inside the vehicle's owner's manual
  answer: C
  explanation: The title is an important document. The manual states to keep it in
    a safe place but not in the vehicle.
- id: 39
  category: vehicle_information
  question: How long do new residents have to complete their vehicle registration
    in Washington?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: New residents have 30 days to complete their vehicle registration.
- id: 40
  category: vehicle_information
  question: If you sell or dispose of your vehicle to another individual, within how
    many days must you file a Vehicle Report of Sale?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: A
  explanation: If you sell, trade, gift, or dispose of your vehicle, file a Vehicle
    Report of Sale form within five days.
- id: 41
  category: vehicle_information
  question: When purchasing a vehicle from an individual, within how many days must
    the purchaser transfer ownership to avoid penalty fees?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: The purchaser must bring the signed title to a licensing office to
    transfer ownership within 15 days to avoid penalty fees.
- id: 42
  category: vehicle_information
  question: What is the rule regarding license plate frames in Washington?
  choices:
    A: They are strictly prohibited on all motor vehicles.
    B: They can only be used on the rear license plate.
    C: They must be made of clear plastic.
    D: They cannot cover or obstruct the letters, numbers, or tabs on the plate.
  answer: D
  explanation: You can have a license plate frame, but it cannot cover or obstruct
    the letters, numbers, or tabs on the plate.
- id: 43
  category: driver_responsibility
  question: What is the minimum required liability insurance coverage for injury to
    or destruction of property of others in any one collision?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: A
  explanation: Washington State requires proof of liability insurance providing $10,000
    or more, payable for injury to or destruction of property of others in any one
    collision.
- id: 44
  category: penalties_and_points
  question: How long do alcohol- and drug-related offenses appear on your driving
    record?
  choices:
    A: 5 years
    B: 7 years
    C: 15 years
    D: For life
  answer: D
  explanation: Alcohol- and drug-related offenses appear on your driving record for
    life.
- id: 45
  category: defensive_driving
  question: What is the purpose of Vehicle Safety Technology (VST) and Advanced Driver
    Assistance Systems (ADAS)?
  choices:
    A: To replace the need for human attention while driving.
    B: To assist your already-healthy driving habits and reduce the impact of crashes.
    C: To allow drivers to legally use mobile devices while operating a vehicle.
    D: To automatically report traffic violations to local law enforcement.
  answer: B
  explanation: They are meant to assist your already-healthy driving habits, not replace
    them, and reduce the impact of crashes by trying to prevent them from happening.
- id: 46
  category: vehicle_information
  question: Which of the following is a limitation of blind spot detection systems
    mentioned in the manual?
  choices:
    A: They cannot detect vehicles directly behind you.
    B: They automatically steer your vehicle away from danger.
    C: They cannot detect if a vehicle two lanes over is also preparing to merge.
    D: They only work during daylight hours.
  answer: C
  explanation: The manual notes that while these systems can alert you to a vehicle
    in your blind spot, they can’t detect if there is a vehicle two lanes over that
    is also preparing to merge.
- id: 47
  category: vehicle_information
  question: 'To prevent slipping and sliding, your tire tread should not be less than:'
  choices:
    A: 1/16 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/8 of an inch
  answer: B
  explanation: According to the manual, worn tires can cause slipping and sliding,
    and tire tread shouldn't be less than 2/32 of an inch.
- id: 48
  category: vehicle_information
  question: Where can you find the proper inflation pressure for your vehicle's tires?
  choices:
    A: On the sidewall of the tire itself.
    B: On the Tire and Loading Information label on the driver’s side door edge.
    C: On the dashboard instrument panel.
    D: On the inside of the fuel door.
  answer: B
  explanation: The proper inflation pressure for your tires can be found on the Tire
    and Loading Information label on the driver’s side door edge or in your owner’s
    manual.
- id: 49
  category: safe_driving_rules
  question: Under Washington law, when are you required to have your headlights turned
    on?
  choices:
    A: From sunset to sunrise.
    B: From a half hour after sunset to a half hour before sunrise.
    C: From a half hour before sunset to a half hour after sunrise.
    D: Only when visibility is less than 500 feet.
  answer: B
  explanation: Washington law says you need to have your headlights on a half hour
    after sunset to a half hour before sunrise.
- id: 50
  category: safe_driving_rules
  question: You must switch from high beams to regular headlights when you are within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You must remember to switch back to regular headlights when you are
    500 feet in front of an oncoming vehicle.
- id: 51
  category: safe_driving_rules
  question: 'When following behind another vehicle, you must dim your high beams when
    you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: You must switch back to regular headlights when you are 300 feet when
    you’re behind another vehicle.
- id: 52
  category: vehicle_information
  question: 'Your vehicle''s brake lights must be red and clearly visible from a distance
    of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Your brake lights are red and must be clearly visible from 100 feet
    away.
- id: 53
  category: safe_driving_rules
  question: How far in advance should you use your turn signal before making a move
    or changing direction?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: The manual instructs drivers to signal 100 feet before you make your
    move.
- id: 54
  category: safe_driving_rules
  question: If your turn signals are not working, what is the correct hand signal
    for a right turn?
  choices:
    A: Put your left arm out the window and point your fingers to the ground.
    B: Put your left arm out the window and point your fingers straight out to the
      left.
    C: Put your left arm out the window and bend your arm so your fingers point to
      the sky.
    D: Put your right arm out the passenger window and point straight.
  answer: C
  explanation: For a right turn hand signal, put your left arm out the window and
    bend your arm so your fingers point to the sky.
- id: 55
  category: safe_driving_rules
  question: To leave adequate space for the airbag to deploy safely, your chest should
    be at least how far from the steering wheel?
  choices:
    A: 5 inches
    B: 8 inches
    C: 10 inches
    D: 12 inches
  answer: C
  explanation: Adjust the back of your seat so you are sitting comfortably straight.
    Your chest should be at least 10 inches from the steering wheel to leave space
    for the airbag.
- id: 56
  category: safe_driving_rules
  question: How should you adjust your headrest to protect yourself from whiplash?
  choices:
    A: So it rests at the base of your neck.
    B: So it is even with your ears.
    C: So it is at least two inches above your head.
    D: So it touches your upper back.
  answer: B
  explanation: Protect yourself from whiplash by making sure the headrest is even
    with your ears.
- id: 57
  category: safe_driving_rules
  question: What is the correct way to wear your seat belt?
  choices:
    A: The shoulder belt should cross your neck and the lap belt should rest on your
      stomach.
    B: The shoulder belt should lie snug across the shoulder and chest, and the lap
      belt should securely restrain the hips below the stomach.
    C: The shoulder belt should be tucked under your arm and the lap belt across your
      thighs.
    D: The shoulder belt should be placed behind your back if it causes discomfort.
  answer: B
  explanation: The shoulder belt should lie snug across the shoulder and chest, and
    not cross the neck or face. The lap belt should securely and snugly restrain the
    hips, below the stomach.
- id: 58
  category: safe_driving_rules
  question: According to the manual, children must ride in a rear-facing car seat
    until what age?
  choices:
    A: Up to age 1
    B: Up to age 2
    C: Up to age 3
    D: Up to age 4
  answer: B
  explanation: Children up to age 2 must ride in a rear-facing car seat.
- id: 59
  category: safe_driving_rules
  question: What hand signal should you use to tell the person behind you that you
    are slowing down and preparing to stop?
  choices:
    A: Put your left arm out the window and point your fingers to the sky.
    B: Put your left arm out the window and point your fingers straight out to the
      left.
    C: Put your left arm out the window and point your fingers to the ground.
