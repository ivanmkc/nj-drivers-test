  explanation: If you're skidding, you should steer in the same direction your vehicle
    is moving and continue to correct your steering until your tires regain traction.
- id: 230
  category: defensive_driving
  question: What causes a vehicle to hydroplane?
  choices:
    A: Oil rising to the surface of the asphalt on a hot day.
    B: Water building up between the tires and the road surface.
    C: Driving over black ice at high speeds.
    D: Sudden braking on a dry, gravel road.
  answer: B
  explanation: Hydroplaning happens when water builds up between your tires and the
    road surface, causing the tires to lose traction and skid.
- id: 231
  category: safe_driving_rules
  question: Which of the following is the correct action to take if your vehicle starts
    hydroplaning?
  choices:
    A: Accelerate to push through the water.
    B: Jerk the steering wheel to the right.
    C: Forcefully press the brake pedal.
    D: Take your foot off the accelerator and keep the steering wheel steady.
  answer: D
  explanation: If you hydroplane, you should take your foot off the accelerator, gently
    press the brakes, and keep the steering wheel steady without overcorrecting.
- id: 232
  category: safe_driving_rules
  question: Why should you avoid wearing sunglasses or tinted lenses when driving
    at night or on overcast days?
  choices:
    A: They cause glare from oncoming headlights.
    B: They reduce your vision.
    C: They distort the colors of traffic signals.
    D: They increase your peripheral vision too much.
  answer: B
  explanation: Do not wear sunglasses or colored lenses when driving at night or on
    overcast days because tinted or colored lenses reduce your vision.
- id: 233
  category: vehicle_information
  question: What is the force between your tires and the road that allows your vehicle
    to grip the surface?
  choices:
    A: Inertia
    B: Momentum
    C: Friction
    D: Kinetic energy
  answer: C
  explanation: Friction is the force between the tires and the road. It allows your
    vehicle to grip the surface, helping you slow down, speed up, or turn safely.
- id: 234
  category: defensive_driving
  question: How far behind your vehicle should you place emergency flares if you have
    vehicle trouble on the road?
  choices:
    A: 50 to 100 feet
    B: 100 to 150 feet
    C: 200 to 300 feet
    D: 300 to 400 feet
  answer: C
  explanation: The manual states to warn other road users by placing emergency flares
    200 to 300 feet behind the vehicle.
- id: 235
  category: vehicle_information
  question: What should you do with your brakes if a tire suddenly blows out or goes
    flat?
  choices:
    A: Pump the brakes rapidly to maintain control.
    B: Brake hard immediately to stop the vehicle.
    C: Do not brake, or brake gently only if necessary.
    D: Apply the emergency parking brake.
  answer: C
  explanation: 'If a tire blows out, the manual advises: ''Do not brake. Allow the
    vehicle to slow by itself, or brake gently if necessary.'''
- id: 236
  category: defensive_driving
  question: What is the first mechanical step you should take if your vehicle's accelerator
    gets stuck and the vehicle keeps going faster?
  choices:
    A: Turn off the engine immediately.
    B: Quickly shift to neutral.
    C: Apply the parking brake.
    D: Shift into a lower gear.
  answer: B
  explanation: If the vehicle keeps going faster and faster, you should keep your
    eyes on the road and quickly shift to neutral before pulling off the road and
    turning off the engine.
- id: 237
  category: safe_driving_rules
  question: According to the manual, which of the following is one of the three typical
    causes of collisions?
  choices:
    A: Driving with underinflated tires
    B: Insufficient situational awareness
    C: Poor weather conditions
    D: Mechanical failure
  answer: B
  explanation: 'The manual states that collisions typically have three causes: Too
    much speed, Too little space, and Insufficient situational awareness.'
- id: 238
  category: driver_responsibility
  question: If you collide with a parked vehicle and cannot locate the owner, what
    information must you leave in a note?
  choices:
    A: Your driver license number and insurance policy number.
    B: The date and time of the collision and your contact information.
    C: Only your phone number.
    D: Your vehicle's license plate number and your insurance company.
  answer: B
  explanation: If the collision involves a parked vehicle and you cannot locate the
    owner, you must leave a note that includes the date and time of collision and
    your contact information.
- id: 239
  category: driver_responsibility
  question: If a law enforcement officer does not file a collision report for you,
    how many days do you have to file the form yourself?
  choices:
    A: 2 days
    B: 4 days
    C: 7 days
    D: 10 days
  answer: B
  explanation: You must file a collision report form within 4 days of a crash if a
    law enforcement officer doesn’t do this for you.
- id: 240
  category: alcohol_drugs_health
  question: What should you give an injured person to drink after a crash?
  choices:
    A: A small amount of water.
    B: A sugary drink to prevent shock.
    C: Warm liquids only.
    D: Nothing to drink, not even water.
  answer: D
  explanation: 'When helping an injured person after a crash, the manual explicitly
    states: ''Do not give injured people anything to drink — not even water.'''
- id: 241
  category: alcohol_drugs_health
  question: Why should you cover an injured person with a blanket or coat after a
    collision?
  choices:
    A: To keep them hidden from passing traffic.
    B: To prevent them from moving around.
    C: To keep them warm and help prevent them from going into shock.
    D: To stop any active bleeding.
  answer: C
  explanation: The manual instructs to cover injured people with a blanket or coat
    to keep them warm and to help prevent them from going into shock.
- id: 242
  category: safe_driving_rules
  question: What should you do if a power line comes in contact with your vehicle
    after a collision, and there is no fire?
  choices:
    A: Exit the vehicle immediately and run away.
    B: Turn off your engine, call 911, and stay inside your vehicle.
    C: Carefully step out of the vehicle making sure not to touch the metal frame.
    D: Drive forward quickly to break the power line.
  answer: B
  explanation: If a collision involves power lines, you must turn off your engine,
    call 911, and stay inside your vehicle until emergency responders arrive.
- id: 243
  category: defensive_driving
  question: If a power line falls on your vehicle and starts a fire, how should you
    move away after jumping clear of the vehicle?
  choices:
    A: Run as fast as you can for at least 100 feet.
    B: Take large, leaping steps to minimize ground contact.
    C: Shuffle 35 feet away to safety with both feet together.
    D: Crawl on your hands and knees to avoid smoke.
  answer: C
  explanation: If a fire starts and you must evacuate, jump clear making sure both
    feet land together, and to avoid electric shock, shuffle 35 feet away to safety.
- id: 244
  category: driver_responsibility
  question: What should you do if you are pulled over by law enforcement at night?
  choices:
    A: Turn off your headlights.
    B: Turn on your interior lights.
    C: Step out of the vehicle so the officer can see you.
    D: Flash your high beams to acknowledge the officer.
  answer: B
  explanation: If you are pulled over at night, you should turn on your interior lights
    to provide additional visibility for the officer.
- id: 245
  category: driver_responsibility
  question: When a law enforcement officer asks for your driver license and vehicle
    documents, what is the proper procedure?
  choices:
    A: Quickly reach into your glove box to have them ready before the officer approaches.
    B: Step out of the vehicle to hand the documents to the officer.
    C: Tell the officer where the documents are located before reaching for them.
    D: Hand the officer your wallet so they can retrieve the license themselves.
  answer: C
  explanation: You should wait for the officer's instructions before reaching for
    documents and tell the officer where these documents are located before reaching
    for them.
- id: 246
  category: vehicle_information
  question: What should you expect regarding your steering wheel if your engine suddenly
    shuts off while driving?
  choices:
    A: The steering wheel will lock completely and cannot be turned.
    B: The steering wheel will become very loose and sensitive.
    C: The steering wheel might be difficult to turn, but you can still turn it.
    D: The steering wheel will automatically steer the vehicle to the right.
  answer: C
  explanation: If the engine shuts off, keep a strong grip on the steering wheel.
    Be aware that the steering wheel might be difficult to turn, but you can turn
    it.
- id: 247
  category: defensive_driving
  question: Which of the following should you do first if your headlights suddenly
    go out while driving?
  choices:
    A: Brake hard and stop in your lane.
    B: Put on your hazard warning lights, turn signals, or fog lights.
    C: Speed up to reach a well-lit area.
    D: Turn off your engine to reset the electrical system.
  answer: B
  explanation: If your headlights suddenly go out, you should put on your hazard warning
    lights, turn signals, or fog lights, if you have them, and pull off the road as
    soon as possible.
- id: 248
  category: vehicle_information
  question: What can happen if you forcefully press the brake pedal while hydroplaning
    in a vehicle without antilock brakes?
  choices:
    A: It will help the vehicle regain contact with the road immediately.
    B: It could cause you to hydroplane more.
    C: It will safely shift the vehicle's weight to the rear tires.
    D: It will automatically engage the emergency braking system.
  answer: B
  explanation: The manual warns that if you don’t have antilock brakes, forcefully
    pressing the brake pedal could cause you to hydroplane more.
- id: 249
  category: driver_responsibility
  question: What should you do before reaching for your documents during a traffic
    stop?
  choices:
    A: Unbuckle your seatbelt so you can move freely.
    B: Tell the officer where the documents are located.
    C: Step out of the vehicle to hand them over.
    D: Hand the officer your weapon first.
  answer: B
  explanation: The manual states that during a traffic stop, you should tell the officer
    where your documents are located before reaching for them.
- id: 250
  category: penalties_and_points
  question: What could happen if you refuse to sign a traffic ticket?
  choices:
    A: You will be issued a warning instead.
    B: Your vehicle will be impounded immediately.
    C: It could result in your arrest.
    D: You automatically admit guilt to the traffic violation.
  answer: C
  explanation: According to the manual, your signature isn't an admission of guilt,
    but refusing to sign a traffic ticket could result in your arrest.
- id: 251
  category: penalties_and_points
  question: How many days do you have to follow the instructions on the back of a
    ticket to avoid having your driving privileges suspended?
  choices:
    A: 10 days
    B: 15 days
    C: 20 days
    D: 30 days
  answer: B
  explanation: You need to follow the instructions on the back of the ticket within
    15 days to avoid having your driving privileges suspended.
- id: 252
  category: alcohol_drugs_health
  question: What does the implied consent law require drivers to do?
  choices:
    A: Consent to a vehicle search during any routine traffic stop.
    B: Submit to certain tests, like breathalyzer tests, if suspected of driving under
      the influence.
    C: Agree to pay all fines within 15 days of receiving a traffic ticket.
    D: Allow law enforcement to confiscate their driver's license without a warrant.
  answer: B
  explanation: The implied consent law requires drivers to submit to certain tests,
    like breathalyzer tests, if suspected of driving under the influence.
- id: 253
  category: sharing_the_road
  question: 'A High Occupancy Vehicle (HOV) lane is reserved for vehicles with:'
  choices:
    A: Only the driver inside.
    B: 2 or more people inside.
    C: 3 or more people inside.
    D: Commercial goods being transported.
  answer: B
  explanation: The glossary defines a High Occupancy Vehicle (HOV) lane as a lane
    reserved for carpooling vehicles with 2 or more people inside.
- id: 254
  category: safe_driving_rules
  question: What is the definition of hydroplaning?
  choices:
    A: When a vehicle loses traction on a wet road and skids.
    B: When a vehicle's brakes stop working properly due to water exposure.
    C: When a driver falls asleep at the wheel during heavy rain.
    D: When a vehicle rolls from side to side on an uneven surface.
  answer: A
  explanation: Hydroplaning occurs when a vehicle loses traction on a wet road and
    skids.
- id: 255
  category: alcohol_drugs_health
  question: 'The open container law prohibits drivers and passengers from:'
  choices:
    A: Leaving the vehicle's windows open while driving on the highway.
    B: Transporting any hazardous materials in an open truck bed.
    C: Having open containers of alcoholic beverages in a vehicle.
    D: Driving with an open trunk or tailgate.
  answer: C
  explanation: The open container law prohibits drivers and passengers from having
    open containers of alcoholic beverages in a vehicle, to prevent drinking and driving.
- id: 256
  category: safe_driving_rules
  question: How is 'right-of-way' defined in the driver's manual?
  choices:
    A: The legal right to drive on the right side of the road.
    B: The legal right to proceed first in traffic.
    C: The ability to turn right at a red traffic light.
    D: The requirement to yield to pedestrians at all times.
  answer: B
  explanation: Right-of-way is defined as the legal right to proceed first in traffic;
    for example, the first vehicle to stop at an intersection has the right-of-way.
- id: 257
  category: alcohol_drugs_health
  question: What does the term 'polydrug use' refer to?
  choices:
    A: Using a prescription drug while driving.
    B: Consuming or using more than 1 kind of drug at the same time.
    C: Driving under the influence of alcohol only.
    D: Transporting illegal drugs in a motor vehicle.
  answer: B
  explanation: Polydrug use is defined as consuming or using more than 1 kind of drug
    at the same time.
- id: 258
  category: license_system
  question: What is License Express used for?
  choices:
    A: Paying for parking tickets online.
    B: Taking the driver's knowledge exam from home.
    C: Renewing your driver's license or reporting a vehicle sale online.
    D: Requesting an emergency vehicle escort.
  answer: C
  explanation: License Express is an online service where you can renew your driver's
    license, vehicle tabs, business license, or report when you sell a vehicle.
- id: 259
  category: defensive_driving
  question: What does it mean to be a 'proactive' driver?
  choices:
    A: Responding to a situation you see.
    B: Responding to a situation you anticipate.
    C: Driving faster than the flow of traffic to avoid congestion.
    D: Relying solely on Advanced Driver Assistance Systems.
  answer: B
  explanation: Being proactive means responding to a situation you anticipate, whereas
    being reactive means responding to a situation you see.
- id: 260
  category: safe_driving_rules
  question: 'Peripheral vision is defined as:'
  choices:
    A: The ability to see clearly at night.
    B: Seeing objects to the side while looking straight ahead.
    C: The ability to judge the distance between two vehicles.
    D: Looking through the rearview mirror to see behind you.
  answer: B
  explanation: Peripheral vision is defined as seeing objects to the side while looking
    straight ahead.
- id: 261
  category: vehicle_information
  question: 'The side-to-side movement of a vehicle is known as:'
  choices:
    A: Pitch
    B: Roll
    C: Skid
    D: Hydroplaning
  answer: B
  explanation: The glossary defines 'Roll of vehicle' as the side-to-side movement
    of a vehicle.
- id: 262
  category: license_system
  question: 'An agricultural permit allows a person under the age of 18 to:'
  choices:
    A: Drive any commercial vehicle across state lines.
    B: Drive tractors and other vehicles used in farming.
    C: Transport agricultural goods in a semi-truck.
    D: Bypass standard speed limits in rural farming areas.
  answer: B
  explanation: An agricultural permit is permission for a person under the age of
    18 to drive tractors and other vehicles used in farming.
- id: 263
  category: signs_and_signals
  question: What is an 'Uncontrolled intersection'?
  choices:
    A: An intersection where roads meet at right angles.
    B: An intersection with broken traffic lights.
    C: An intersection without traffic signals or signs.
    D: An intersection with heavy traffic volume.
  answer: C
  explanation: An uncontrolled intersection is an intersection without traffic signals
    or signs.
- id: 264
  category: vehicle_information
  question: What is 'Understeer'?
  choices:
    A: When a vehicle turns more than the driver intends.
    B: When a vehicle doesn't turn as much as the driver intends.
    C: The side-to-side movement of a vehicle.
    D: Sudden loss of air pressure in a tire.
  answer: B
  explanation: Understeer occurs when a vehicle doesn't turn as much as the driver
    intends.
- id: 265
  category: vehicle_information
  question: What does 'Yaw' refer to in vehicle dynamics?
  choices:
    A: The up-and-down movement of a vehicle.
    B: The side-to-side movement of a vehicle.
    C: The forward pitching of a vehicle during hard braking.
    D: The loss of traction causing a skid.
  answer: B
  explanation: Yaw is defined as the side-to-side movement of a vehicle.
- id: 266
  category: vehicle_information
  question: What is 'Vehicle Safety Technology (VST)'?
  choices:
    A: Official documentation proving ownership of a vehicle.
    B: Coverage that helps pay for damage or injuries from crashes.
    C: Vehicle features that use sensors or cameras to intervene, warn, or assist
      you in driving safely.
    D: A test to check how well you can see.
  answer: C
  explanation: Vehicle Safety Technology (VST) refers to vehicle features that use
    sensors or cameras to intervene, warn, or assist you in driving safely.
- id: 267
  category: license_system
  question: If you need assistance in a language other than English from the DOL,
    who should you contact?
  choices:
    A: The ADA Compliance Manager
    B: The Civil Rights Compliance Coordinator
    C: The Language Access team
    D: The Vehicle licensing office
  answer: C
  explanation: If you need assistance in a language other than English, you should
    contact the Language Access team at languageaccess@dol.wa.gov.
- id: 268
  category: driver_responsibility
  question: Can the Washington State Driver Guide be used as a legal authority in
    court?
  choices:
    A: Yes, it is the primary legal authority for traffic laws.
    B: Yes, but only for civil claims.
    C: No, it is not a legal authority and cannot be used as a basis for legal claims.
    D: No, unless it is approved by a judge first.
  answer: C
  explanation: The Washington State Driver Guide is not a legal authority and is not
    intended for use in court. It cannot be used as a basis for legal claims or actions.
- id: 269
  category: driver_responsibility
  question: What is the relationship between city/town traffic regulations and state
    laws?
  choices:
    A: City regulations can conflict with state laws if approved by the mayor.
    B: City regulations may go beyond state laws, but cannot conflict with them.
    C: State laws always replace city regulations entirely.
    D: City regulations are only suggestions and cannot be enforced.
  answer: B
  explanation: Traffic regulations in cities, towns, and countries may go beyond state
    laws, but cannot conflict with them.
- id: 270
  category: defensive_driving
  question: What is a 'Visual search'?
  choices:
    A: A test to check how well you can see and if your eyes are healthy.
    B: Deliberately looking for current or potential hazards.
    C: Using turn signals to indicate intentions.
    D: Planning the route for a journey.
  answer: B
  explanation: Visual search is defined as deliberately looking for current or potential
    hazards.
- id: 271
  category: license_system
  question: Where should you go for vehicle certificates, tabs, and registration help?
  choices:
    A: A traditional intersection
    B: The ADA Compliance Manager
    C: A vehicle licensing office
    D: The twin registry
  answer: C
  explanation: The vehicle licensing office is where you go for vehicle certificates,
    tabs, and registration help.
- id: 272
  category: signs_and_signals
  question: What are 'Traffic control devices'?
  choices:
    A: Signs, signals, and markings used to regulate traffic.
    B: Rules that govern how vehicles must operate on roads.
    C: The blinking lights on the front and back of a vehicle.
    D: Maximum legal speeds allowed on roads.
  answer: A
  explanation: Traffic control devices are signs, signals, and markings used to regulate
    traffic.
- id: 273
  category: driver_responsibility
  question: If you want to read the specific laws relating to motor vehicle operation
    and driver licensing in Washington, what should you refer to?
  choices:
    A: The Washington State Driver Guide
    B: Title VI of the Civil Rights Act of 1964
    C: Title 46 RCW, Motor Vehicles
    D: The Vehicle Safety Technology manual
  answer: C
  explanation: If you are interested in specific laws relating to motor vehicle operation
    and driver licensing, refer to Title 46 RCW, Motor Vehicles.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 274
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 275
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 276
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 277
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 278
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 279
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 280
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 281
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 282
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 283
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 284
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 285
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 286
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 287
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 288
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
