metadata:
  source: 2025 Washington Driver's Manual
  total_questions: 248
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Washington State, if you are enrolled in an approved driver education
    course, what is the minimum age at which you can apply for an instruction permit?
  choices:
    A: 15 years old
    B: 15 1/2 years old
    C: 16 years old
    D: 14 1/2 years old
  answer: A
  explanation: In Washington, you can get an instruction permit at age 15 if you are
    enrolled in an approved driver education course. If you are not enrolled, you
    must wait until you are 15 1/2.
- id: 2
  category: license_system
  question: How many days do you have to notify the Washington Department of Licensing
    (DOL) after changing your legal name or address?
  choices:
    A: 30 days
    B: 15 days
    C: 10 days
    D: 45 days
  answer: C
  explanation: Washington law requires you to notify the DOL within 10 days of any
    change to your name or address.
- id: 3
  category: license_system
  question: What is the nighttime driving restriction for a Washington driver holding
    an Intermediate Driver License (IDL)?
  choices:
    A: No driving between 10 PM and 4 AM
    B: No driving between Midnight and 6 AM
    C: No driving between 1 AM and 5 AM
    D: No driving between 11 PM and 5 AM
  answer: C
  explanation: Intermediate Driver License holders are prohibited from driving between
    1 AM and 5 AM unless accompanied by a parent, guardian, or licensed driver at
    least 25 years old.
- id: 4
  category: license_system
  question: If a Washington driver with an Intermediate Driver License (IDL) commits
    a second traffic violation, what is the penalty?
  choices:
    A: A warning letter is sent to the parents
    B: The license is suspended for 6 months
    C: The license is revoked until age 18
    D: A mandatory $500 fine
  answer: B
  explanation: For a second traffic violation under an IDL, the license is suspended
    for six months (or until age 18, whichever comes first).
- id: 5
  category: license_system
  question: To supervise a driver with an instruction permit in Washington, the licensed
    driver must have at least how many years of driving experience?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: The person supervising a permit holder must have at least five years
    of driving experience and be seated in the right-front passenger seat.
- id: 6
  category: license_system
  question: 'Before applying for an Intermediate Driver License in Washington, a teen
    must have held an instruction permit for at least:'
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Washington law requires teens to hold an instruction permit for at
    least six months before they are eligible for an Intermediate Driver License.
- id: 7
  category: license_system
  question: How many hours of supervised driving practice, including nighttime hours,
    are required to obtain a Washington Intermediate Driver License?
  choices:
    A: 40 hours total, 5 at night
    B: 50 hours total, 10 at night
    C: 60 hours total, 15 at night
    D: 30 hours total, 10 at night
  answer: B
  explanation: Applicants for an IDL must certify that they have had at least 50 hours
    of driving experience, 10 of which must be at night.
- id: 8
  category: license_system
  question: After the first six months of holding an Intermediate Driver License,
    a Washington driver is restricted to how many passengers under age 20 (who are
    not family)?
  choices:
    A: None
    B: One
    C: Two
    D: Three
  answer: D
  explanation: After the first six months, the passenger restriction changes to allow
    no more than three passengers under age 20 who are not members of the immediate
    family.
- id: 9
  category: license_system
  question: New Washington residents must obtain a Washington State driver license
    within how many days of moving to the state?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: If you move to Washington and have a valid out-of-state license, you
    must obtain a Washington license within 30 days of becoming a resident.
- id: 10
  category: license_system
  question: What are the minimum liability insurance requirements for property damage
    in a single collision in Washington?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: Washington law requires minimum liability insurance of $25,000 for
    bodily injury to one person, $50,000 for bodily injury to two or more people,
    and $10,000 for property damage.
- id: 11
  category: license_system
  question: A Washington instruction permit is valid for how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: A Washington State instruction permit is valid for one year and can
    be renewed.
- id: 12
  category: license_system
  question: Which of the following is a requirement for a teen to receive an Intermediate
    Driver License in Washington?
  choices:
    A: No traffic violations within the last 6 months
    B: Passing a vision screening
    C: Passing a knowledge and skills test
    D: All of the above
  answer: D
  explanation: To get an IDL, you must be 16-17, have held a permit for 6 months,
    have 50 hours of practice, have no traffic violations in the last 6 months, and
    pass all required tests.
- id: 13
  category: license_system
  question: 'In Washington, using a personal electronic device (like a cell phone)
    while holding an Intermediate Driver License is:'
  choices:
    A: Allowed if using a hands-free device
    B: Allowed for GPS only
    C: Prohibited at all times, including hands-free, except for emergencies
    D: Allowed only when stopped at a red light
  answer: C
  explanation: Intermediate Driver License holders are prohibited from using any wireless
    communication device while driving, even if it is hands-free, unless it is for
    an emergency.
- id: 14
  category: license_system
  question: 'If you are under 21, you can be arrested for a DUI in Washington if your
    THC (marijuana) level is higher than:'
  choices:
    A: 5.00 nanograms per milliliter
    B: 2.00 nanograms per milliliter
    C: 0.00 nanograms per milliliter
    D: 0.05 nanograms per milliliter
  answer: C
  explanation: Washington has a 'zero tolerance' policy for minors. If you are under
    21, you can be arrested for a THC level of more than 0.00 nanograms per milliliter.
- id: 15
  category: license_system
  question: A standard Washington State driver license is typically valid for how
    many years before it expires?
  choices:
    A: 4 years
    B: 5 years
    C: 6 years
    D: 8 years
  answer: D
  explanation: As of recent updates to Washington law, standard driver licenses and
    ID cards are now issued for a period of eight years.
- id: 16
  category: license_system
  question: 'When you sell or transfer a vehicle in Washington, you must report the
    sale to the Department of Licensing within:'
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: A
  explanation: Washington law requires the seller of a vehicle to file a Report of
    Sale within 5 days of the transaction.
- id: 17
  category: license_system
  question: 'After purchasing a vehicle from a private party in Washington, the buyer
    must transfer the title within:'
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 20 days
  answer: C
  explanation: The buyer must transfer the vehicle title into their name within 15
    days to avoid a late penalty fee.
- id: 18
  category: license_system
  question: 'Under Washington''s Implied Consent Law, if you refuse to take a breath
    or blood test to determine your alcohol or drug concentration, your license will
    be revoked for at least:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: By driving in Washington, you have given consent to a breath test.
    Refusing the test results in a mandatory 1-year license revocation for a first
    offense.
- id: 19
  category: license_system
  question: In Washington, a person is considered a 'Habitual Traffic Offender' if
    they accumulate how many moving violations within a five-year period?
  choices:
    A: '10'
    B: '15'
    C: '20'
    D: '25'
  answer: C
  explanation: Under the Habitual Traffic Offender law, a person who receives 20 or
    more moving violations within a five-year period will have their license revoked
    for seven years.
- id: 20
  category: license_system
  question: 'A Washington Enhanced Driver License (EDL) is an acceptable alternative
    to a passport for:'
  choices:
    A: International air travel to any country
    B: Re-entering the U.S. from Canada or Mexico by land or sea
    C: Registering to vote in a different state
    D: Operating a commercial vehicle over 26,001 pounds
  answer: B
  explanation: An Enhanced Driver License (EDL) or Enhanced ID (EID) allows Washington
    residents to re-enter the U.S. from Canada, Mexico, or the Caribbean by land or
    sea without a passport.
- id: 21
  category: license_system
  question: Washington law requires motorists to carry liability insurance. What is
    the minimum required coverage for bodily injury to one person in a single collision?
  choices:
    A: $10,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: The minimum liability insurance requirements in Washington are $25,000
    for bodily injury to one person and $50,000 for bodily injury to two or more people.
- id: 22
  category: license_system
  question: What is the minimum required liability insurance coverage for bodily injury
    to two or more people in a single collision in Washington?
  choices:
    A: $25,000
    B: $30,000
    C: $50,000
    D: $60,000
  answer: C
  explanation: Washington's mandatory insurance law requires at least $50,000 for
    bodily injury or death of two or more persons in any one collision.
- id: 23
  category: license_system
  question: For drivers age 21 or older in Washington, it is illegal to drive with
    a THC (marijuana) level of ____ nanograms per milliliter of blood or higher.
  choices:
    A: '1.00'
    B: '2.00'
    C: '5.00'
    D: '8.00'
  answer: C
  explanation: In Washington, the legal limit for THC in the blood for drivers 21
    and older is 5.00 nanograms per milliliter.
- id: 24
  category: license_system
  question: 'In Washington, a driver age 21 or older is considered to be driving under
    the influence (DUI) if their Blood Alcohol Content (BAC) is:'
  choices:
    A: 0.02% or higher
    B: 0.04% or higher
    C: 0.05% or higher
    D: 0.08% or higher
  answer: D
  explanation: The legal BAC limit for adult drivers (21+) in Washington State is
    0.08%.
- id: 25
  category: license_system
  question: At what age can a Washington resident pre-register to vote at a Department
    of Licensing office?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: In Washington, 16 and 17-year-olds can pre-register to vote when they
    apply for their driver license or permit; they will be automatically registered
    when they turn 18.
- id: 26
  category: license_system
  question: If you receive a notice of a traffic infraction, you must respond to the
    court within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Failure to respond to a traffic infraction within 15 days will result
    in the court notifying the DOL, which may lead to license suspension.
- id: 27
  category: license_system
  question: Following a DUI conviction and the subsequent license suspension, a Washington
    driver is required to have a 'Probationary License' for how many years?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 7 years
  answer: C
  explanation: A driver convicted of a DUI must hold a probationary license for five
    years after their suspension period ends.
- id: 28
  category: license_system
  question: 'In Washington, you may be unable to renew your vehicle''s registration
    (tabs) if you have:'
  choices:
    A: Expired car insurance
    B: Unpaid parking tickets or toll violations
    C: A cracked windshield
    D: More than two passengers in the vehicle
  answer: B
  explanation: The Department of Licensing will not renew vehicle tabs if the owner
    has outstanding parking tickets, toll violations, or certain other civil penalties.
- id: 29
  category: driver_testing
  question: 'To meet the minimum vision requirements for a Washington driver license,
    your visual acuity must be at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/50 in both eyes
    D: 20/30 in at least one eye
  answer: B
  explanation: According to the Washington Driver Guide, you must have a visual acuity
    of at least 20/40 in at least one eye, with or without corrective lenses, to pass
    the vision screening.
- id: 30
  category: driver_testing
  question: The Washington State knowledge test consists of 40 multiple-choice questions.
    What is the minimum number of questions you must answer correctly to pass?
  choices:
    A: '25'
    B: '30'
    C: '32'
    D: '35'
  answer: C
  explanation: The Washington knowledge test requires a passing score of 80%, which
    means you must answer at least 32 out of 40 questions correctly.
- id: 31
  category: driver_testing
  question: When taking the skills (road) test in Washington, which of the following
    is NOT a required piece of equipment for your vehicle?
  choices:
    A: Functioning turn signals and brake lights
    B: A windshield with no cracks at all
    C: Valid proof of liability insurance
    D: Seat belts for both the driver and the examiner
  answer: B
  explanation: While the windshield must provide an unobstructed view, it does not
    necessarily have to be 'crack-free' as long as the cracks do not interfere with
    the driver's vision or safety. However, insurance, working lights, and seat belts
    are mandatory for the test.
- id: 32
  category: driver_testing
  question: At what age does a Washington Intermediate Driver License (IDL) automatically
    transition to a regular (basic) driver license?
  choices:
    A: '17'
    B: '18'
    C: '21'
    D: '19'
  answer: B
  explanation: The restrictions of an Intermediate Driver License (IDL) expire on
    the driver's 18th birthday, at which point it becomes a basic driver license.
- id: 33
  category: driver_testing
  question: If you fail the Washington skills (road) test on your first attempt, how
    long must you wait before you are eligible to retake it?
  choices:
    A: 24 hours
    B: 3 days
    C: 1 week
    D: 2 weeks
  answer: C
  explanation: In Washington, if you fail the skills test, you must wait at least
    one week (7 days) before you can take the test again for the first time.
- id: 34
  category: driver_testing
  question: Once you have successfully passed the Washington knowledge test, how long
    are the results valid for?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: Washington State knowledge test scores are valid for two years from
    the date of the test.
- id: 35
  category: driver_testing
  question: To obtain an Intermediate Driver License in Washington, a teen must complete
    an approved driver education course that includes at least how many hours of classroom
    instruction?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 50 hours
  answer: B
  explanation: Washington law requires teens under 18 to complete an approved driver
    education course consisting of at least 30 hours of classroom instruction.
- id: 36
  category: driver_testing
  question: In addition to classroom hours, an approved Washington driver education
    course must include how many hours of behind-the-wheel instruction?
  choices:
    A: 4 hours
    B: 6 hours
    C: 8 hours
    D: 10 hours
  answer: B
  explanation: The Washington driver education curriculum requires a minimum of 6
    hours of behind-the-wheel practice and 1 hour of observation.
- id: 37
  category: driver_testing
  question: Which of the following would result in an automatic failure during the
    Washington skills (road) test?
  choices:
    A: Failing to use a turn signal once
    B: Parking more than 12 inches from the curb
    C: Performing a 'rolling stop' at a stop sign
    D: Driving 2 mph under the speed limit
  answer: C
  explanation: Performing a 'rolling stop' (failing to come to a complete stop) is
    a violation of traffic laws and typically results in an automatic failure of the
    skills test.
- id: 38
  category: driver_testing
  question: What is the primary difference between a standard Washington driver license
    and an Enhanced Driver License (EDL)?
  choices:
    A: An EDL allows you to drive commercial vehicles
    B: An EDL can be used for international air travel to Europe
    C: An EDL is an acceptable alternative to a passport for land and sea border crossings
      into Canada and Mexico
    D: An EDL does not require a vision test for renewal
  answer: C
  explanation: The Washington Enhanced Driver License (EDL) is a REAL ID-compliant
    document that allows land and sea border crossings into Canada, Mexico, and the
    Caribbean without a separate passport.
- id: 39
  category: driver_testing
  question: 'When applying for a Washington driver license, you may also register
    to vote if you are at least:'
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: In Washington, you can pre-register to vote at age 16 or 17 when you
    apply for your license, and you will be automatically registered to vote when
    you turn 18.
- id: 40
  category: driver_testing
  question: 'If you have a medical condition that could affect your ability to drive
    safely, you must:'
  choices:
    A: Only tell your insurance company
    B: Surrender your license immediately
    C: Disclose the condition to the Department of Licensing (DOL) when applying for
      or renewing your license
    D: Keep it private as it is protected by HIPAA laws
  answer: C
  explanation: Washington law requires drivers to inform the DOL of any physical or
    mental condition that may affect their ability to operate a motor vehicle safely.
- id: 41
  category: driver_testing
  question: How many years before your Washington driver license expires are you allowed
    to renew it?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 90 days
  answer: B
  explanation: In Washington State, you can renew your driver license up to one year
    before it expires.
- id: 42
  category: driver_testing
  question: To pass the vision screening for a Washington driver license, your visual
    acuity must be at least ________ in at least one eye, with or without corrective
    lenses.
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the Washington Driver Guide, applicants must have vision
    of at least 20/40 in at least one eye, with or without corrective lenses, to pass
    the vision screening.
- id: 43
  category: driver_testing
  question: During the Washington driving skills test, which of the following is a
    reason for immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: Driving over a curb
    C: Adjusting the mirrors while stopped
    D: Driving 2 mph under the speed limit
  answer: B
  explanation: In Washington, performing a dangerous action such as driving over a
    curb, causing a collision, or disobeying a traffic sign/signal results in an immediate
    failure of the skills test.
- id: 44
  category: driver_testing
  question: In Washington, if a collision results in injury, death, or property damage
    of ________ or more to one person's property, and a police officer does not file
    a report, you must file a Collision Report.
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: C
  explanation: Washington law requires drivers to file a collision report within 4
    days if there is an injury, death, or property damage of $1,000 or more to any
    one person's property.
- id: 45
  category: driver_testing
  question: In Washington, you are prohibited from parking within how many feet of
    a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: Per Washington State law (RCW 46.61.570), you may not park a vehicle
    within 15 feet of a fire hydrant.
- id: 46
  category: driver_testing
  question: In Washington, you may not park within how many feet of a stop sign, yield
    sign, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Washington law prohibits parking within 30 feet of any flashing signal,
    stop sign, yield sign, or traffic control signal located at the side of a roadway.
- id: 47
  category: driver_testing
  question: When driving at night in Washington, you must dim your high beams when
    you are within ________ feet of an oncoming vehicle.
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Washington law (RCW 46.37.230) requires drivers to use low beams when
    approaching an oncoming vehicle within 500 feet.
- id: 48
  category: driver_testing
  question: Unless otherwise posted, what is the speed limit in a school zone in Washington
    State?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: In Washington, the standard speed limit in a school zone is 20 mph
    when lights are flashing or children are present.
- id: 49
  category: driver_testing
  question: Unless otherwise posted, what is the legal speed limit on streets of cities
    and towns in Washington?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: According to RCW 46.61.400, the maximum speed limit on city or town
    streets is 25 mph unless otherwise posted.
- id: 50
  category: driver_testing
  question: Unless otherwise posted, what is the legal speed limit on Washington county
    roads?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: B
  explanation: According to RCW 46.61.400, the maximum speed limit on county roads
    is 50 mph unless otherwise posted.
- id: 51
  category: driver_testing
  question: The Washington Driver Guide recommends maintaining a following distance
    of at least ________ behind the vehicle in front of you at speeds over 30 mph.
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: The Washington Driver Guide recommends a 'four-second rule' to provide
    a safe following distance under normal driving conditions.
- id: 52
  category: driver_responsibility
  question: 'In Washington State, you must file a Collision Report if there is an
    injury, death, or property damage to any one person''s property of at least:'
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,500
  answer: C
  explanation: According to the Washington Driver Guide, a written report (Motor Vehicle
    Collision Report) must be filed within four days if there is an injury, death,
    or property damage of $1,000 or more to one person's property.
- id: 53
  category: driver_responsibility
  question: If a reportable collision occurs and a law enforcement officer does not
    file a report, how many days do you have to file a Washington Traffic Collision
    Report?
  choices:
    A: 24 hours
    B: 4 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: If a collision results in injury, death, or property damage over $1,000
    and no officer files a report, you must file one yourself within 4 days.
- id: 54
  category: driver_responsibility
  question: Where must the vehicle's registration certificate be kept in Washington
    State?
  choices:
    A: At the owner's residence
    B: In the vehicle
    C: In the owner's wallet or purse
    D: At the Department of Licensing
  answer: B
  explanation: Washington law requires that the vehicle registration certificate be
    carried in the vehicle whenever it is being operated.
- id: 55
  category: driver_responsibility
  question: For drivers 21 years of age or older, what is the legal limit for Blood
    Alcohol Content (BAC) in Washington?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In Washington, it is illegal for a person 21 or older to drive with
    a BAC of 0.08% or higher.
- id: 56
  category: driver_responsibility
  question: In Washington, what is the legal limit for THC (marijuana) in the blood
    for a driver who is 21 years of age or older?
  choices:
    A: 1.00 nanogram per milliliter
    B: 2.00 nanograms per milliliter
    C: 5.00 nanograms per milliliter
    D: 10.00 nanograms per milliliter
  answer: C
  explanation: For drivers 21 and older, the legal limit for THC is 5.00 nanograms
    per milliliter of blood.
- id: 57
  category: driver_responsibility
  question: If you are stopped by law enforcement and cannot show proof of motor vehicle
    insurance, what is the result?
  choices:
    A: You will receive a traffic infraction
    B: Your car will be impounded immediately
    C: Your license will be revoked for one year
    D: There is no penalty if you have insurance but forgot the card
  answer: A
  explanation: Failure to provide proof of insurance when requested by a law enforcement
    officer is a traffic infraction in Washington.
- id: 58
  category: driver_responsibility
  question: Under Washington law, it is illegal to have an open container of alcohol
    in which part of the vehicle?
  choices:
    A: The trunk
    B: The passenger compartment
    C: Behind the last upright seat of a vehicle without a trunk
    D: A locked glove box
  answer: B
  explanation: It is a traffic infraction to keep an open container of alcohol in
    the passenger compartment of a motor vehicle on a highway.
- id: 59
  category: driver_responsibility
  question: 'If you collide with a parked vehicle and cannot find the owner, Washington
    law requires you to:'
  choices:
    A: Wait for at least two hours for the owner to return
    B: Leave a note with your name, address, and a description of what happened
    C: Call a tow truck to move the other vehicle
    D: Drive away if the damage appears to be less than $500
  answer: B
  explanation: If you hit an unattended vehicle, you must try to find the owner. If
    you cannot, you must leave a note in a conspicuous place with your name, address,
    and the date/time of the collision.
- id: 60
  category: driver_responsibility
  question: If your driving privilege is suspended due to a lack of financial responsibility,
    how long must you typically maintain an SR-22 (Proof of Financial Responsibility)
    certificate?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: In Washington, if you are required to file proof of financial responsibility
    (SR-22), you must generally maintain it for three years.
- id: 61
  category: driver_responsibility
  question: 'Washington State law requires most passenger vehicles to display license
    plates on:'
  choices:
    A: The rear of the vehicle only
    B: The front of the vehicle only
    C: Both the front and the rear of the vehicle
    D: The rear and the dashboard
  answer: C
  explanation: Washington law requires that most motor vehicles display license plates
    on both the front and the rear of the vehicle.
- id: 62
  category: driver_responsibility
  question: 'In Washington, throwing a lit cigarette or any other ''lit debris'' from
    a moving vehicle is a crime punishable by a fine of up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,025
  answer: D
  explanation: Washington has strict littering laws; specifically, throwing lit tobacco
    products or other lit debris is a crime that can result in a $1,025 fine.
- id: 63
  category: driver_responsibility
  question: 'For a first-time DUI conviction in Washington, your driver license will
    be suspended for at least:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: A first-time DUI conviction in Washington results in a license suspension
    of at least 90 days.
- id: 64
  category: driver_responsibility
  question: Washington's 'Move Over' law requires drivers to move to the left lane
    or slow down when approaching stationary emergency vehicles. What happens to the
    fine for a traffic infraction in this zone?
  choices:
    A: The fine is waived for first-time offenders
    B: The fine is reduced by half
    C: The fine is doubled
    D: The fine is tripled
  answer: C
  explanation: Under the 'Move Over' law (Emergency Zone law), fines are doubled for
    infractions committed in an emergency zone.
- id: 65
  category: driver_responsibility
  question: 'If you are involved in a collision and do not have the required liability
    insurance, the Department of Licensing may suspend your license for up to:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: If you are in a collision and don't have insurance, your license can
    be suspended for up to three years if you do not pay the damages or reach a settlement.
- id: 66
  category: driver_responsibility
  question: In Washington State, if you are involved in a collision that results in
    injury, death, or property damage of $1,000 or more, you must file an accident
    report within how many days?
  choices:
    A: 2 days
    B: 4 days
    C: 7 days
    D: 10 days
  answer: B
  explanation: According to the Washington Driver Guide, you must file a Motor Vehicle
    Collision Report within four days if there is an injury, death, or property damage
    of $1,000 or more to any one person's property.
- id: 67
  category: driver_responsibility
  question: What is the minimum amount of liability insurance required in Washington
    for the bodily injury or death of one person in any one collision?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: Washington law requires motorists to carry a minimum of $25,000 for
    bodily injury or death of one person in any one collision.
- id: 68
  category: driver_responsibility
  question: In Washington, who is legally responsible for ensuring that passengers
    under the age of 16 are properly buckled up or secured in a child safety seat?
  choices:
    A: The passengers themselves
    B: The driver of the vehicle
    C: The passengers' parents (even if not in the car)
    D: No one; it is a personal choice
  answer: B
  explanation: In Washington, the driver is responsible for and will be cited for
    any passenger under age 16 who is not properly wearing a seat belt or in a child
    safety seat.
- id: 69
  category: driver_responsibility
  question: In Washington, what happens to the fine for a traffic infraction committed
    in an 'Emergency Zone' (adjacent to stationary emergency vehicles with sirens/lights)?
  choices:
    A: The fine is waived for first-time offenders
    B: The fine is doubled
    C: The fine is tripled
    D: The fine remains the same but points are tripled
  answer: B
  explanation: Under Washington law (RCW 46.61.212), fines for traffic infractions
    committed in an emergency zone are doubled.
- id: 70
  category: driver_responsibility
  question: If you fail to comply with a notice of a traffic infraction, such as failing
    to appear in court or failing to pay a fine, what action will the Washington DOL
    take?
  choices:
    A: They will increase your insurance rates only
    B: They will issue a warrant for your arrest only
    C: They may suspend your driving privilege
    D: They will seize your vehicle
  answer: C
  explanation: Failure to respond to a notice of traffic infraction or failure to
    pay a fine can result in the suspension of your driver license.
- id: 71
  category: driver_responsibility
  question: In Washington, it is illegal to park a vehicle within how many feet of
    a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: Washington law prohibits parking within 15 feet of a fire hydrant.
- id: 72
  category: driver_responsibility
  question: 'Washington law requires you to turn on your headlights from:'
  choices:
    A: One hour after sunset until one hour before sunrise
    B: Half an hour after sunset until half an hour before sunrise
    C: Sunset to sunrise
    D: 8:00 PM to 6:00 AM
  answer: B
  explanation: Washington law requires headlights to be turned on from a half hour
    after sunset until a half hour before sunrise.
- id: 73
  category: driver_responsibility
  question: In Washington, you must dim your high beam headlights when you come within
    how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: You must dim your high beams whenever you come within 500 feet of an
    oncoming vehicle.
- id: 74
  category: driver_responsibility
  question: In Washington, what is the maximum fine for 'potentially dangerous litter'
    such as a lit cigarette or glass?
  choices:
    A: $103
    B: $250
    C: $500
    D: $1,025
  answer: D
  explanation: In Washington, the fine for littering potentially dangerous items like
    lit cigarettes or glass is $1,025.
- id: 75
  category: safe_driving_rules
  question: When parking your vehicle in Washington, you must be within how many inches
    of the curb?
  choices:
    A: 6 inches
    B: 10 inches
    C: 12 inches
    D: 18 inches
  answer: C
  explanation: The Washington Driver Guide states that when you park alongside a curb,
    your wheels must be within 12 inches of the curb.
- id: 76
  category: safe_driving_rules
  question: 'When following another vehicle in Washington, you must dim your high
    beams when you are within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: According to the Washington Driver Guide, you must use your low beams
    when following a vehicle within 300 feet.
- id: 77
  category: safe_driving_rules
  question: In Washington, you must signal at least how many feet before you turn
    or change lanes?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Washington law requires drivers to signal at least 100 feet before
    making a turn or lane change.
- id: 78
  category: safe_driving_rules
  question: When parking on a hill in Washington with a curb and facing uphill, which
    way should you turn your steering wheel?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Keep wheels straight
    D: Toward the center of the road
  answer: B
  explanation: When parking uphill with a curb, you should turn your steering wheel
    away from the curb so the vehicle will roll into the curb if the brakes fail.
- id: 79
  category: safe_driving_rules
  question: 'In Washington, you are not required to stop for a school bus traveling
    in the opposite direction if the roadway has:'
  choices:
    A: Two lanes
    B: A turn lane in the middle
    C: Three or more marked traffic lanes
    D: A speed limit over 35 mph
  answer: C
  explanation: RCW 46.61.370 states you do not need to stop for a school bus in the
    opposite direction if the road has three or more marked traffic lanes.
- id: 80
  category: safe_driving_rules
  question: What is the recommended following distance behind the vehicle in front
    of you at speeds over 30 mph in Washington?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: The Washington Driver Guide recommends a following distance of at least
    four seconds for speeds over 30 mph.
- id: 81
  category: safe_driving_rules
  question: 'When entering a roundabout in Washington, you must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from your right
    B: Traffic already in the circle coming from your left
    C: No one; you have the right of way
    D: Only pedestrians on the sidewalk
  answer: B
  explanation: In a roundabout, you must yield to traffic already in the circle circulating
    from your left.
- id: 82
  category: safe_driving_rules
  question: Under Washington's 'Move Over' law, what must you do when approaching
    an emergency vehicle with sirens or lights flashing on a highway with two or more
    lanes in your direction?
  choices:
    A: Stop immediately in your lane
    B: Move to the left lane if safe to do so
    C: Speed up to pass quickly
    D: Maintain speed and stay in your lane
  answer: B
  explanation: Washington's Move Over Law requires drivers to move to the left lane
    if there are two or more lanes going in the same direction, or slow down if they
    cannot move over.
- id: 83
  category: safe_driving_rules
  question: In Washington, what happens to the traffic fines for moving violations
    committed in a designated work zone?
  choices:
    A: They are waived for first-time offenders
    B: They are reduced by half
    C: They are doubled
    D: They remain the same as standard fines
  answer: C
  explanation: According to the Washington Driver Guide, traffic fines are doubled
    for infractions committed in highway work zones.
- id: 84
  category: safe_driving_rules
  question: 'In Washington, you must yield the right-of-way to a transit bus when:'
  choices:
    A: The bus is stopped at a designated bus stop
    B: The bus has signaled and is pulling back into the flow of traffic
    C: The bus is traveling in the HOV lane
    D: The bus is behind you and flashing its high beams
  answer: B
  explanation: Washington law requires drivers to yield to any transit vehicle (bus)
    that has signaled and is pulling back onto the roadway.
- id: 85
  category: safe_driving_rules
  question: When parking a vehicle in Washington, how many inches must the tires be
    from the curb to be considered legally parked?
  choices:
    A: Within 6 inches
    B: Within 10 inches
    C: Within 12 inches
    D: Within 18 inches
  answer: C
  explanation: Washington law requires that a vehicle be parked with its wheels parallel
    to and within 12 inches of the curb.
- id: 86
  category: safe_driving_rules
  question: When following another vehicle in Washington, what is the recommended
    minimum following distance for speeds over 30 mph under ideal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: The Washington Driver Guide recommends a following distance of at least
    four seconds to allow enough time to react to hazards.
- id: 87
  category: safe_driving_rules
  question: You are traveling on a highway with three or more lanes. An oncoming school
    bus is stopped with its red lights flashing and stop paddle extended on the opposite
    side of the road. Do you need to stop?
  choices:
    A: Yes, you must always stop for a school bus with red lights flashing.
    B: No, you do not need to stop if there are three or more marked traffic lanes.
    C: Yes, but only if there is no physical median.
    D: No, but you must slow down to 15 mph.
  answer: B
  explanation: In Washington, you do not need to stop for a school bus traveling in
    the opposite direction if the roadway has three or more marked traffic lanes and
    is separated by a median or physical barrier.
- id: 88
  category: safe_driving_rules
  question: For drivers 21 and older in Washington, what is the legal limit for THC
    (marijuana) concentration in the blood?
  choices:
    A: 1.00 nanograms per milliliter
    B: 2.00 nanograms per milliliter
    C: 5.00 nanograms per milliliter
    D: Zero tolerance
  answer: C
  explanation: In Washington, adults 21 and older can be arrested for DUI if their
    THC level is 5.00 nanograms per milliliter of blood or higher.
- id: 89
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road in Washington, you must
    return to your lane at least how many feet before meeting an oncoming vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: According to the Washington Driver Guide, you must return to your right-hand
    lane at least 200 feet before coming within range of an oncoming vehicle.
- id: 90
  category: safe_driving_rules
  question: 'In Washington, a bicycle used at night must be equipped with a headlight
    visible from at least:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 600 feet
    D: 1,000 feet
  answer: B
  explanation: Washington law requires bicycles ridden at night to have a white front
    light visible for at least 500 feet.
- id: 91
  category: defensive_driving
  question: According to the Washington Driver Guide, how far ahead should you scan
    to be ready for anything happening on the road?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 30 seconds
  answer: C
  explanation: The Washington Driver Guide recommends scanning at least 15 seconds
    ahead to see hazards early and avoid last-minute moves.
- id: 92
  category: defensive_driving
  question: In Washington, at what speed can your tires start to lose all contact
    with the road (hydroplane) during a heavy rain?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: The Washington Driver Guide states that in heavy rain, your tires can
    lose all contact with the road at speeds as low as 50 mph.
- id: 93
  category: defensive_driving
  question: If you are driving in Washington and your vehicle begins to hydroplane,
    what is the correct defensive driving response?
  choices:
    A: Brake hard immediately
    B: Turn the steering wheel sharply
    C: Ease your foot off the gas pedal
    D: Shift the car into neutral
  answer: C
  explanation: If hydroplaning, you should ease your foot off the gas pedal and keep
    the steering wheel straight. Do not try to stop or turn until your tires are gripping
    the road again.
- id: 94
  category: defensive_driving
  question: In Washington, when passing a person riding a bicycle or a pedestrian
    on the shoulder, what is the minimum distance you should maintain if the speed
    limit is 35 mph or higher?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: RCW 46.61.110 requires drivers to provide at least three feet of distance
    when passing a person on a bicycle or a pedestrian.
- id: 95
  category: defensive_driving
  question: When parking on a public road in Washington, you must not park more than
    how many inches from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: Washington law (RCW 46.61.575) requires that both right-hand wheels
    of a parked vehicle be parallel to and within 12 inches of the curb.
- id: 96
  category: defensive_driving
  question: When driving in fog in Washington, which light setting should you use
    to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights
  answer: B
  explanation: The Washington Driver Guide advises using low beams in fog because
    high beams reflect off the fog and cause glare, making it harder to see.
- id: 97
  category: defensive_driving
  question: In Washington, what is the standard speed limit in a school zone when
    lights are flashing or children are present?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: C
  explanation: RCW 46.61.440 sets the speed limit in marked school or playground zones
    at 20 mph.
- id: 98
  category: defensive_driving
  question: Under Washington's 'Emergency Zone' law, what happens to the fine for
    speeding in an area where emergency vehicles are stopped with sirens or lights
    flashing?
  choices:
    A: The fine is waived for first offenders
    B: The fine is reduced by half
    C: The fine is doubled
    D: The fine is tripled
  answer: C
  explanation: RCW 46.61.212 states that the monetary penalty for a traffic infraction
    in an emergency zone (within 200 feet of a stationary emergency vehicle) is doubled.
- id: 99
  category: defensive_driving
  question: According to the Washington Driver Guide, how many seconds of following
    distance should you maintain behind the vehicle in front of you at speeds over
    30 mph?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: The Washington Driver Guide recommends a following distance of at least
    four seconds for speeds over 30 mph to allow enough time to react to hazards.
- id: 100
  category: defensive_driving
  question: In Washington State, to be a safe driver, you should scan the road ahead
    of you at least how many seconds?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 20 seconds
  answer: C
  explanation: Washington law and safety guidelines state that you should look at
    least 15 seconds ahead to avoid last-minute braking or turning.
- id: 101
  category: defensive_driving
  question: According to the Washington Driver Guide, at what speed can your tires
    begin to hydroplane (lose all contact with the road) in heavy rain?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 60 mph
  answer: C
  explanation: The Washington Driver Guide states that in heavy rain, your tires can
    lose all traction with the road at speeds as low as 50 mph.
- id: 102
  category: defensive_driving
  question: When parking near a traffic signal, stop sign, or yield sign in Washington,
    what is the minimum required distance you must maintain?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: RCW 46.61.570 states that you may not park within 30 feet of any flashing
    signal, stop sign, yield sign, or traffic control signal located at the side of
    a roadway.
- id: 103
  category: defensive_driving
  question: In Washington, you must not follow within how many feet of a fire engine
    responding to an alarm?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Per RCW 46.61.635, it is illegal to follow a fire apparatus responding
    to a fire alarm closer than 500 feet.
- id: 104
  category: defensive_driving
  question: When a school bus is stopped on a roadway with three or more marked traffic
    lanes and has its red lights flashing, which drivers must stop?
  choices:
    A: All drivers in both directions
    B: Only drivers traveling in the same direction as the bus
    C: Only drivers in the opposite direction
    D: No one is required to stop if there is a median
  answer: B
  explanation: Per RCW 46.61.370, if the roadway has three or more marked traffic
    lanes, drivers traveling in the opposite direction of a school bus do not need
    to stop. Only those following the bus must stop.
- id: 105
  category: defensive_driving
  question: Under Washington law, what is the maximum legal blood alcohol content
    (BAC) for a driver under the age of 21?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Washington has a 'zero tolerance' policy for minors; the legal limit
    for drivers under 21 is 0.02%.
- id: 106
  category: defensive_driving
  question: In Washington, you must turn on your headlights from ______ until ______.
  choices:
    A: Sunset; Sunrise
    B: One hour after sunset; One hour before sunrise
    C: Half hour after sunset; Half hour before sunrise
    D: 6:00 PM; 6:00 AM
  answer: C
  explanation: RCW 46.37.020 requires headlights to be turned on from a half hour
    after sunset to a half hour before sunrise, or whenever visibility is less than
    1,000 feet.
- id: 107
  category: alcohol_drugs_health
  question: For drivers under the age of 21 in Washington, what is the specific BAC
    limit that will result in a license suspension or revocation?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Washington has a 'zero tolerance' policy for minors; a BAC of 0.02%
    or higher for a driver under 21 is grounds for license suspension.
- id: 108
  category: alcohol_drugs_health
  question: In Washington, a driver 21 years of age or older can be arrested for DUI
    if their THC (marijuana) level is at or above how many nanograms per milliliter
    of blood?
  choices:
    A: 1.00 nanograms
    B: 2.00 nanograms
    C: 5.00 nanograms
    D: 10.00 nanograms
  answer: C
  explanation: Washington law sets the per se limit for THC at 5.00 nanograms per
    milliliter of blood for drivers age 21 and older.
- id: 109
  category: alcohol_drugs_health
  question: Alcohol reaches your brain shortly after being consumed. In Washington's
    driver manual, how long does it typically take for alcohol to reach the brain?
  choices:
    A: 5 to 10 minutes
    B: 20 to 40 minutes
    C: 60 to 90 minutes
    D: 2 to 3 hours
  answer: B
  explanation: The Washington Driver Guide states that alcohol is absorbed into the
    bloodstream and reaches the brain within 20 to 40 minutes.
- id: 110
  category: alcohol_drugs_health
  question: If you are convicted of a first DUI in Washington, your driver's license
    will be suspended for at least how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A first-time DUI conviction in Washington results in a mandatory license
    suspension of at least 90 days.
- id: 111
  category: alcohol_drugs_health
  question: According to the Washington Driver Guide, how long can the effects of
    marijuana on driving (such as slowed reaction time) last?
  choices:
    A: Up to 1 hour
    B: Up to 2 hours
    C: Up to 5 hours
    D: Up to 24 hours
  answer: C
  explanation: The Washington Driver Guide notes that marijuana can affect driving
    performance for up to five hours.
- id: 112
  category: alcohol_drugs_health
  question: In Washington, it is illegal to drink alcohol or have an open container
    of alcohol in a motor vehicle on a highway. Where is the only legal place to keep
    an open container?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In the trunk or an area not normally occupied by passengers
    D: In the center console
  answer: C
  explanation: Washington's Open Container Law requires open alcoholic beverages to
    be kept in the trunk or an area of the vehicle not occupied by the driver or passengers
    (if the vehicle has no trunk).
- id: 113
  category: alcohol_drugs_health
  question: When consuming marijuana in edible form (like cookies or candies), how
    long might it take for the driver to feel the effects?
  choices:
    A: Immediately
    B: 5 to 10 minutes
    C: Up to 2 hours
    D: At least 4 hours
  answer: C
  explanation: Because edibles must be digested, the Washington Driver Guide warns
    that it can take up to two hours for the effects to be felt.
- id: 114
  category: alcohol_drugs_health
  question: 'If you are arrested for DUI in Washington and it is your first offense,
    you may be required to have an Ignition Interlock Device (IID) installed for at
    least:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: Washington law generally requires a first-time DUI offender to install
    an ignition interlock device for a period of one year.
- id: 115
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with another drug, such as a cold
    remedy or prescription medication?
  choices:
    A: The effects of the alcohol are cancelled out
    B: The effects of the drug are cancelled out
    C: It has no effect on driving ability
    D: It can multiply the effects of both, significantly increasing impairment
  answer: D
  explanation: The Washington Driver Guide explains that mixing alcohol and drugs
    often causes a synergistic effect, meaning the combined impact is much greater
    than either substance alone.
- id: 116
  category: alcohol_drugs_health
  question: To pass the vision test in Washington, you must have at least what visual
    acuity in at least one eye (with or without corrective lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Washington State requires drivers to have at least 20/40 vision in
    at least one eye to qualify for a driver's license.
- id: 117
  category: alcohol_drugs_health
  question: After a DUI-related license suspension is over, a Washington driver will
    be issued a 'probationary license' for how many years?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: Following a DUI conviction and license reinstatement, Washington requires
    the driver to hold a probationary license for five years.
- id: 118
  category: alcohol_drugs_health
  question: According to the Washington Driver Guide, how many drinks does it typically
    take for alcohol to begin affecting your driving?
  choices:
    A: One drink
    B: Two drinks
    C: Three drinks
    D: When you reach 0.08 BAC
  answer: A
  explanation: The manual emphasizes that alcohol begins to affect your judgment and
    coordination with the very first drink.
- id: 119
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and a doctor has not told you if
    it will affect your driving, what should you do before driving in Washington?
  choices:
    A: Drive only during daylight hours
    B: Check the label or ask a pharmacist about side effects
    C: Drive only if you feel fine
    D: Drink coffee to stay alert while taking the medication
  answer: B
  explanation: Washington law holds drivers responsible for impairment caused by any
    drug. You must check labels or consult a professional to ensure a medication does
    not impair your ability to drive.
- id: 120
  category: alcohol_drugs_health
  question: 'If a driver is convicted of a first DUI in Washington and their BAC was
    less than 0.15, their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: For a first DUI conviction with a BAC under 0.15, the Washington Department
    of Licensing will suspend the driver's license for 90 days.
- id: 121
  category: alcohol_drugs_health
  question: Which of the following is the only way to lower your Blood Alcohol Content
    (BAC) and 'sober up' before driving?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Exercising or running
    D: Allowing time for the body to process the alcohol
  answer: D
  explanation: The Washington Driver Guide emphasizes that only time allows the body
    to process and remove alcohol from the system; coffee, food, and showers do not
    lower BAC.
- id: 122
  category: alcohol_drugs_health
  question: When consuming alcohol, which of the following is typically affected first?
  choices:
    A: Muscle coordination
    B: Judgment and reasoning
    C: Vision and hearing
    D: Balance and speech
  answer: B
  explanation: Alcohol affects the brain's ability to make decisions and exercise
    good judgment long before it affects physical coordination.
- id: 123
  category: alcohol_drugs_health
  question: A person convicted of a DUI in Washington is required to have an Ignition
    Interlock Device (IID) installed for at least how long for a first offense?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 5 years
  answer: C
  explanation: Washington law requires a first-time DUI offender to install an Ignition
    Interlock Device for at least one year.
- id: 124
  category: alcohol_drugs_health
  question: If a Washington driver is arrested for DUI while a passenger under the
    age of 16 is in the vehicle, what additional penalty applies?
  choices:
    A: The driver's vehicle is immediately scrapped
    B: The driver faces additional ignition interlock requirements and potential fines
    C: The driver's license is revoked for life
    D: There are no additional penalties for passengers
  answer: B
  explanation: Washington law imposes enhanced penalties for DUI with a passenger
    under 16, including an extra 6 months of IID requirement and higher fines.
- id: 125
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and it impairs your driving, can
    you be arrested for DUI in Washington?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI only applies to illegal drugs and alcohol
    C: Yes, it is illegal to drive while impaired by any drug
    D: Only if the drug is a narcotic
  answer: C
  explanation: Washington's DUI laws apply to any substance that impairs your ability
    to drive, including prescription and over-the-counter medications.
- id: 126
  category: alcohol_drugs_health
  question: How does alcohol consumption specifically affect a driver's vision?
  choices:
    A: It improves night vision
    B: It reduces peripheral (side) vision
    C: It makes colors appear more vivid
    D: It has no effect on vision
  answer: B
  explanation: Alcohol causes 'tunnel vision' by reducing peripheral vision, making
    it harder for drivers to see hazards coming from the sides.
- id: 127
  category: alcohol_drugs_health
  question: If you have a medical condition like epilepsy or diabetes that could affect
    your driving, what is your responsibility in Washington?
  choices:
    A: You must never drive again
    B: You must notify the Department of Licensing (DOL)
    C: You only need to tell your insurance company
    D: You do not need to do anything if you feel fine
  answer: B
  explanation: Washington law requires drivers to inform the DOL of any physical or
    mental condition that may impair their ability to operate a motor vehicle safely.
- id: 128
  category: alcohol_drugs_health
  question: 'According to the Washington Driver Guide, marijuana has been shown to:'
  choices:
    A: Improve focus on the road
    B: Decrease reaction time
    C: Increase reaction time
    D: Have no effect on driving performance
  answer: C
  explanation: Marijuana use increases reaction time and impairs a driver's ability
    to estimate distance and speed.
- id: 129
  category: alcohol_drugs_health
  question: In terms of alcohol content, which of the following contains the most
    alcohol?
  choices:
    A: 12 ounces of 5% beer
    B: 5 ounces of 12% wine
    C: 1.5 ounces of 80-proof liquor
    D: They all contain approximately the same amount of alcohol
  answer: D
  explanation: A standard drink is defined as 12 oz of beer, 5 oz of wine, or 1.5
    oz of 80-proof liquor; each contains about 0.6 ounces of pure alcohol.
- id: 130
  category: penalties_and_points
  question: In Washington, what is the standard fine for a first offense of using
    a hand-held personal electronic device (E-PIC) while driving?
  choices:
    A: $50
    B: $101
    C: $136
    D: $250
  answer: C
  explanation: The first violation of Washington's 'Driving While Using a Personal
    Electronic Device' law results in a standard fine of $136.
- id: 131
  category: penalties_and_points
  question: 'If a Washington driver receives a second distracted driving (E-PIC) citation
    within five years, the fine increases to approximately:'
  choices:
    A: $150
    B: $234
    C: $500
    D: $1,000
  answer: B
  explanation: For a second or subsequent distracted driving offense within five years
    in Washington, the fine increases to at least $234.
- id: 132
  category: penalties_and_points
  question: In Washington, if you are convicted of a DUI, you will be required to
    hold a 'probationary license' for how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: Following a DUI-related suspension or revocation, Washington requires
    the driver to maintain a probationary license for 5 years.
- id: 133
  category: penalties_and_points
  question: Under Washington's 'Emergency Zone' law, speeding fines are ______ when
    the violation occurs in a zone where emergency vehicles are present with lights
    flashing.
  choices:
    A: Tripled
    B: Doubled
    C: Increased by $100
    D: Waived for first-time offenders
  answer: B
  explanation: Fines for traffic infractions are doubled in Washington when they occur
    in an emergency zone (the 200 feet before and after a stationary emergency vehicle
    with lights).
- id: 134
  category: penalties_and_points
  question: Washington's 'Open Container Law' prohibits the possession of an open
    alcoholic beverage container in the passenger compartment of a vehicle. Where
    should an open container be stored to comply with the law?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In the trunk
    D: In a cup holder with a lid
  answer: C
  explanation: Open containers of alcohol must be kept in the trunk or in an area
    of the vehicle not normally occupied by the driver or passengers if the vehicle
    does not have a trunk.
- id: 135
  category: penalties_and_points
  question: In Washington, the Department of Licensing will send a warning letter
    to a driver who accumulates how many moving violations within a 12-month period?
  choices:
    A: '1'
    B: '2'
    C: '4'
    D: '6'
  answer: B
  explanation: Washington's discretionary suspension program triggers a warning letter
    after 2 moving violations are committed within a 12-month period.
- id: 136
  category: penalties_and_points
  question: A Washington driver's license will be suspended for 60 days if they accumulate
    ____ moving violations within a 12-month period.
  choices:
    A: '3'
    B: '4'
    C: '6'
    D: '10'
  answer: C
  explanation: Accumulating 6 moving violations within a 12-month period results in
    a 60-day license suspension in Washington.
- id: 137
  category: penalties_and_points
  question: In Washington, what is the fine for parking in a space reserved for persons
    with disabilities without a proper placard or license plate?
  choices:
    A: $100
    B: $250
    C: $450
    D: $1,000
  answer: C
  explanation: The standard fine for unauthorized parking in a disabled parking space
    in Washington is $450.
- id: 138
  category: penalties_and_points
  question: 'If a Washington driver is convicted of a first-time DUI, they are typically
    required to install an Ignition Interlock Device (IID) for at least:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 3 years
  answer: C
  explanation: For a first DUI conviction in Washington, the driver is generally required
    to install and use an IID for at least one year.
- id: 139
  category: penalties_and_points
  question: In Washington, if you fail to comply with a traffic citation (such as
    not paying a fine or appearing in court), the DOL will suspend your license after
    how many days?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: A
  explanation: If you do not comply with a notice of a traffic infraction within 15
    days, the court notifies the DOL, which will then start the license suspension
    process.
- id: 140
  category: penalties_and_points
  question: 'In Washington, a person under the age of 21 can be arrested for DUI if
    their Breath Alcohol Content (BAC) is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Washington has a 'zero tolerance' policy for minors. Drivers under
    21 can be arrested for DUI with a BAC of 0.02% or higher.
- id: 141
  category: penalties_and_points
  question: Under Washington law, a driver is classified as a 'Habitual Traffic Offender'
    if they accumulate how many 'major' traffic offenses (such as DUI or Reckless
    Driving) within a five-year period?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '7'
  answer: B
  explanation: According to RCW 46.65.020, a Habitual Traffic Offender is someone
    who accumulates 3 or more major offenses or 20 or more moving violations within
    a 5-year period.
- id: 142
  category: penalties_and_points
  question: 'For a first-time DUI conviction in Washington with a BAC level under
    0.15, the mandatory driver license suspension period is:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: A first-time DUI conviction for an adult with a BAC below 0.15 results
    in a mandatory 90-day license suspension.
- id: 143
  category: penalties_and_points
  question: According to Washington's open container law, where is it legal to keep
    an open container of alcohol in a vehicle?
  choices:
    A: In the glove compartment
    B: In the center console
    C: Under the driver's seat
    D: In the trunk
  answer: D
  explanation: Open containers of alcohol must be kept in the trunk or in an area
    of the vehicle not normally occupied by the driver or passengers if the vehicle
    has no trunk. It is specifically illegal to keep them in the glove compartment.
- id: 144
  category: penalties_and_points
  question: 'To reinstate a Washington driver license after a non-alcohol-related
    suspension, the driver must pay a fee of:'
  choices:
    A: $25
    B: $50
    C: $75
    D: $150
  answer: C
  explanation: The standard reinstatement fee for a non-alcohol-related suspension
    in Washington is $75. Alcohol-related reinstatements typically cost $150.
- id: 145
  category: penalties_and_points
  question: 'In Washington, an adult (21+) can be arrested for DUI if their blood
    THC (marijuana) level is at or above:'
  choices:
    A: 1.00 nanograms per milliliter
    B: 2.00 nanograms per milliliter
    C: 5.00 nanograms per milliliter
    D: 8.00 nanograms per milliliter
  answer: C
  explanation: For drivers 21 and older, the legal limit for THC in Washington is
    5.00 nanograms per milliliter of blood.
- id: 146
  category: penalties_and_points
  question: Which type of restricted license allows a Washington driver to operate
    a vehicle while their license is suspended for a drug or alcohol-related offense?
  choices:
    A: Occupational Restricted Driver License (ORL)
    B: Ignition Interlock License (IIL)
    C: Commercial Driver License (CDL)
    D: Intermediate Driver License (IDL)
  answer: B
  explanation: The Ignition Interlock License (IIL) specifically allows drivers with
    alcohol/drug-related suspensions to drive vehicles equipped with an ignition interlock
    device.
- id: 147
  category: penalties_and_points
  question: Which of the following is true regarding the fine for failing to stop
    for a school bus with its red lights flashing and stop paddle extended in Washington?
  choices:
    A: The fine can be reduced by a judge if it is a first offense
    B: The fine can be waived if you attend traffic school
    C: The fine cannot be reduced, waived, or suspended
    D: The fine is only $50
  answer: C
  explanation: Washington law (RCW 46.61.370) stipulates that the fine for passing
    a stopped school bus (approximately $419) cannot be reduced, waived, or suspended.
- id: 148
  category: penalties_and_points
  question: If an adult driver in Washington receives how many moving violations within
    a 12-month period, they will be placed on a one-year probation?
  choices:
    A: '3'
    B: '4'
    C: '6'
    D: '8'
  answer: C
  explanation: The Washington Department of Licensing will place a driver on probation
    for one year if they accumulate 6 moving violations within a 12-month period.
- id: 149
  category: sharing_the_road
  question: When passing a bicycle in Washington on a roadway with two lanes and a
    speed limit of 35 mph or higher, what is the driver required to do?
  choices:
    A: Honk to alert the cyclist and maintain speed.
    B: Pass with at least 2 feet of clearance.
    C: Move into the left lane to pass if it is safe to do so.
    D: Wait until the cyclist waves you through.
  answer: C
  explanation: Under RCW 46.61.110, on a roadway with two lanes and a speed limit
    of 35 mph or higher, the driver must move into the left lane to pass a cyclist.
    If not possible, they must provide at least 3 feet of clearance.
- id: 150
  category: sharing_the_road
  question: Under Washington's 'Move Over' law, what is the penalty for failing to
    move over or slow down for an emergency vehicle with its lights flashing?
  choices:
    A: A flat $500 fine.
    B: A mandatory 30-day license suspension.
    C: The monetary fine is doubled.
    D: Community service and a warning.
  answer: C
  explanation: RCW 46.61.212 states that the monetary penalty for a traffic infraction
    in an emergency zone (within 200 feet of a stationary emergency vehicle) is doubled.
- id: 151
  category: sharing_the_road
  question: What is the recommended following distance when traveling behind a motorcycle
    in Washington State?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: The Washington Driver Guide recommends a following distance of at least
    4 seconds behind motorcycles because they can stop much faster than other vehicles.
- id: 152
  category: sharing_the_road
  question: In Washington, when must a driver stop for a pedestrian in an unpainted
    crosswalk?
  choices:
    A: Only if the pedestrian is directly in front of the car.
    B: When the pedestrian is within one lane of the driver's half of the roadway.
    C: Only if the pedestrian is carrying a white cane.
    D: Only if the driver is turning right.
  answer: B
  explanation: Washington law requires drivers to stop for pedestrians if they are
    on the driver's half of the roadway or within one lane of the driver's half of
    the roadway.
- id: 153
  category: sharing_the_road
  question: 'Large commercial trucks have blind spots where the driver cannot see
    you. These are commonly called:'
  choices:
    A: Danger Zones
    B: No-Zones
    C: Zero-Visibility Spots
    D: Truck Gaps
  answer: B
  explanation: The Washington Driver Guide refers to the large blind spots around
    the front, rear, and sides of commercial trucks as 'No-Zones'.
- id: 154
  category: sharing_the_road
  question: In Washington, a slow-moving vehicle must pull off the roadway at a safe
    turnout when it has how many vehicles following behind it?
  choices:
    A: 3 or more
    B: 5 or more
    C: 10 or more
    D: Only if the speed limit is over 50 mph.
  answer: B
  explanation: RCW 46.61.427 requires slow-moving vehicles to pull off the roadway
    at a safe turnout if there are 5 or more vehicles following in a line.
- id: 155
  category: sharing_the_road
  question: According to Washington law, which of the following is true regarding
    motorcycles sharing a lane?
  choices:
    A: Motorcycles are never allowed to share a lane.
    B: A motorcycle may share a lane with a car.
    C: Two motorcycles may ride side-by-side in a single lane.
    D: Motorcycles may only share a lane when passing.
  answer: C
  explanation: RCW 46.61.608 allows two motorcycles to operate abreast (side-by-side)
    in a single lane, but prohibits motorcycles from sharing a lane with a car or
    'lane splitting' between rows of cars.
- id: 156
  category: sharing_the_road
  question: On a two-lane road (one lane in each direction), when a school bus is
    stopped with red lights flashing and stop paddle extended, who must stop?
  choices:
    A: Only traffic following the bus.
    B: Only traffic meeting the bus from the front.
    C: Traffic in both directions.
    D: No one, unless children are currently crossing.
  answer: C
  explanation: On a two-lane roadway where there is only one lane of traffic in each
    direction, all traffic from both directions must stop for a school bus with its
    red lights flashing and stop paddle extended.
- id: 157
  category: sharing_the_road
  question: An 'Emergency Zone' in Washington is defined as the adjacent lanes of
    the roadway within how many feet of a stationary emergency vehicle with sirens
    or flashing lights?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: RCW 46.61.212 defines an emergency zone as the area 200 feet before
    and after a stationary emergency vehicle with flashing lights.
- id: 158
  category: sharing_the_road
  question: In Washington State, a person riding a bicycle may treat a stop sign as
    a yield sign, provided they slow down and yield to traffic. This is known as the
    'Safety Stop.' When is this NOT allowed?
  choices:
    A: At all stop signs.
    B: At stop signs on school buses or at railroad crossings.
    C: During nighttime hours.
    D: When riding on a sidewalk.
  answer: B
  explanation: RCW 46.61.190 allows cyclists to treat stop signs as yields, but they
    must still come to a complete stop at stop signs on school buses and at railroad
    crossings.
- id: 159
  category: sharing_the_road
  question: In Washington, how many feet must you stay behind an emergency vehicle
    (such as a fire truck) that is responding to an alarm?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: RCW 46.61.635 prohibits drivers from following a fire apparatus closer
    than 500 feet or driving into or parking within the block where the fire apparatus
    has stopped in answer to a fire alarm.
- id: 160
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may need to:'
  choices:
    A: Stay entirely in the right lane.
    B: Swing wide to the left before turning.
    C: Speed up to clear the intersection.
    D: Turn from the left lane only.
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn
    without the rear wheels hitting the curb or other objects.
- id: 161
  category: sharing_the_road
  question: 'When passing a ''vulnerable user'' (such as a pedestrian or cyclist)
    on a roadway with three or more lanes, Washington law requires you to:'
  choices:
    A: Stay in your lane and slow to 15 mph.
    B: Move to a lane that is not adjacent to the vulnerable user.
    C: Honk your horn twice before passing.
    D: Wait for the user to exit the roadway entirely.
  answer: B
  explanation: RCW 46.61.110 requires that on a roadway with two or more lanes in
    the same direction, a driver must move to a lane that is not adjacent to the vulnerable
    user if it is safe to do so.
- id: 162
  category: sharing_the_road
  question: 'In Washington State, on a roadway with three or more marked traffic lanes,
    you must stop for a school bus with red lights flashing and stop paddle extended
    only if:'
  choices:
    A: You are traveling in the opposite direction of the bus.
    B: You are traveling in the same direction as the bus.
    C: The bus is stopped at an intersection.
    D: There are more than five vehicles behind the bus.
  answer: B
  explanation: According to Washington law (RCW 46.61.370), on roadways with three
    or more marked traffic lanes, drivers traveling in the opposite direction do not
    need to stop for a school bus. However, drivers traveling in the same direction
    as the bus must always stop.
- id: 163
  category: sharing_the_road
  question: Under Washington's 'Safety Stop' law, how are bicycle riders permitted
    to treat stop signs when no other traffic is present?
  choices:
    A: As a green light
    B: As a yield sign
    C: As a mandatory 3-second stop
    D: As a caution light
  answer: B
  explanation: As of 2020, Washington law (RCW 46.61.190) allows cyclists to treat
    stop signs as yield signs, provided they slow down and yield to any traffic or
    pedestrians already in the intersection.
- id: 164
  category: sharing_the_road
  question: 'In Washington, if you are approaching a stationary emergency vehicle
    with flashing lights on a highway with at least two lanes in your direction, you
    must:'
  choices:
    A: Stop immediately in your lane.
    B: Move to the left lane if it is safe to do so.
    C: Maintain your speed and stay in your lane.
    D: Speed up to pass the vehicle quickly.
  answer: B
  explanation: Washington's 'Move Over Law' (RCW 46.61.212) requires drivers to move
    to the left lane if safe. If moving over is not possible, the driver must reduce
    speed to at least 10 mph below the posted limit.
- id: 165
  category: sharing_the_road
  question: 'In Washington, when a pedestrian is waiting at a crosswalk that is not
    marked with paint, you must:'
  choices:
    A: Continue driving because it is an unmarked crosswalk.
    B: Stop and yield the right-of-way to the pedestrian.
    C: Honk to warn the pedestrian you are not stopping.
    D: Only stop if the pedestrian is a child or elderly.
  answer: B
  explanation: In Washington, every intersection is considered a legal crosswalk,
    whether it is marked or unmarked. Drivers must stop for pedestrians at all intersections.
- id: 166
  category: sharing_the_road
  question: When following a large commercial truck, what is the best way to ensure
    you are not in the driver's 'No-Zone'?
  choices:
    A: If you can see the truck's front bumper in your rearview mirror.
    B: If you can see the truck's side mirrors.
    C: If you are at least 10 feet behind the trailer.
    D: If you can see the driver's face in your side mirror.
  answer: B
  explanation: The 'No-Zone' represents the blind spots around a truck. If you cannot
    see the truck driver's side mirrors, the driver cannot see you.
- id: 167
  category: sharing_the_road
  question: What is the recommended following distance behind a motorcycle in Washington
    State to allow for their shorter stopping distance and potential hazards?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: The Washington Driver Guide recommends a following distance of at least
    4 seconds behind motorcycles because they can stop much faster than cars and may
    need to swerve to avoid hazards like potholes or gravel.
- id: 168
  category: sharing_the_road
  question: In Washington, if you are driving a slow-moving vehicle and have how many
    vehicles following behind you, must you pull over and let them pass?
  choices:
    A: 3 or more
    B: 5 or more
    C: 7 or more
    D: 10 or more
  answer: B
  explanation: According to RCW 46.61.427, if you are driving a slow-moving vehicle
    on a two-lane highway where passing is unsafe, and 5 or more vehicles are formed
    in a line behind you, you must pull over at the next safe turnout to let them
    pass.
- id: 169
  category: sharing_the_road
  question: 'You are traveling on a highway divided by a physical barrier (such as
    a median or wall). A school bus is stopped on the opposite side of the barrier
    with red lights flashing. You must:'
  choices:
    A: Stop and wait for the lights to stop flashing.
    B: Slow down to 15 mph and proceed with caution.
    C: Continue driving; you are not required to stop.
    D: Stop only if there are children crossing the barrier.
  answer: C
  explanation: Under RCW 46.61.370, drivers do not need to stop for a school bus if
    the bus is on the other side of a divided highway with a physical barrier or unpaved
    median.
- id: 170
  category: sharing_the_road
  question: In Washington, it is illegal to follow closer than ____ feet behind a
    fire engine responding to a fire alarm.
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: RCW 46.61.635 states that it is illegal to follow a fire apparatus
    closer than 500 feet or to drive into or park within the block where the fire
    apparatus has stopped in answer to a fire alarm.
- id: 171
  category: sharing_the_road
  question: 'When you see a pedestrian with a white cane or a guide dog in Washington,
    you must:'
  choices:
    A: Honk to let them know you are there.
    B: Give them the right-of-way and stop your vehicle.
    C: Drive around them slowly.
    D: Wait for them to signal you to pass.
  answer: B
  explanation: Washington law requires drivers to take extra precautions and yield
    the right-of-way to blind pedestrians using a white cane or a guide dog. You must
    come to a complete stop to ensure their safety.
- id: 172
  category: sharing_the_road
  question: 'In Washington, when riding a bicycle on a sidewalk or in a crosswalk,
    a cyclist:'
  choices:
    A: Has the same rights and duties as a pedestrian.
    B: Must always yield to motor vehicles.
    C: Must maintain a speed of at least 10 mph.
    D: Is committing a traffic violation.
  answer: A
  explanation: In Washington, cyclists are generally permitted to ride on sidewalks
    unless local ordinances prohibit it. When doing so, they have the same rights
    and responsibilities as pedestrians but must yield to pedestrians already on the
    sidewalk.
- id: 173
  category: vehicle_information
  question: In Washington State, what is the minimum legal tread depth for tires on
    a passenger vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: According to Washington law (RCW 46.37.425), it is unlawful to operate
    a vehicle with tires that have less than 2/32 of an inch of tread depth.
- id: 174
  category: vehicle_information
  question: According to the Washington Driver Guide, when must you turn on your headlights?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: Only when it is raining or snowing
    C: From a half hour after sunset to a half hour before sunrise
    D: Only when you cannot see more than 500 feet ahead
  answer: C
  explanation: Washington law requires headlights to be turned on from a half hour
    after sunset until a half hour before sunrise, and any other time when visibility
    is low.
- id: 175
  category: vehicle_information
  question: In Washington State, studded tires are legal to use only during which
    time period?
  choices:
    A: October 1 to April 30
    B: November 1 to March 31
    C: December 1 to February 28
    D: November 15 to April 1
  answer: B
  explanation: Studded tires are legal in Washington only from November 1 to March
    31. Using them outside these dates can result in a fine.
- id: 176
  category: vehicle_information
  question: Washington law requires that your rearview mirror provides a view of the
    highway for at least how many feet to the rear of the vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Under RCW 46.37.400, all vehicles must have a mirror that allows the
    driver to see at least 200 feet to the rear.
- id: 177
  category: vehicle_information
  question: In Washington, what is the maximum legal level of window tinting allowed
    on the front side windows?
  choices:
    A: Must allow more than 35% of light in
    B: Must allow more than 24% of light in
    C: Must allow more than 50% of light in
    D: No tinting is allowed on front side windows
  answer: B
  explanation: Washington State law (RCW 46.37.430) specifies that window tinting
    must allow at least 24% of light to pass through.
- id: 178
  category: vehicle_information
  question: If a load extends more than ____ feet beyond the rear of the center of
    the last axle of a vehicle in Washington, a red flag or cloth must be displayed.
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: According to RCW 46.37.140, if a load extends 4 feet or more past the
    rear of the vehicle, it must be marked with a red or orange fluorescent flag during
    the day.
- id: 179
  category: vehicle_information
  question: 'In Washington, every motor vehicle must be equipped with a horn that
    can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: RCW 46.37.380 requires a horn audible under normal conditions from
    a distance of not less than 200 feet.
- id: 180
  category: vehicle_information
  question: 'Under Washington''s child restraint law, a child must remain in a child
    safety restraint system (car seat or booster) until they are:'
  choices:
    A: 6 years old or 4'6" tall
    B: 8 years old or 4'9" tall
    C: 10 years old or 5'0" tall
    D: 12 years old
  answer: B
  explanation: Washington law requires children to use a booster seat or appropriate
    child restraint until they are 8 years old or reach 4 feet 9 inches in height.
- id: 181
  category: vehicle_information
  question: When are you allowed to use your horn in Washington State?
  choices:
    A: To signal friends as you pass them
    B: To tell a driver in front of you to hurry up
    C: Only when it is reasonably necessary to prevent an accident
    D: To notify a driver you are about to pass them on the right
  answer: C
  explanation: Washington law states the horn should only be used when necessary to
    ensure safe operation or to warn other drivers of danger.
- id: 182
  category: vehicle_information
  question: In Washington, what is the requirement for a vehicle's exhaust system?
  choices:
    A: It must be loud enough to be heard from 50 feet
    B: It must be equipped with a muffler in good working order to prevent excessive
      noise
    C: It must be modified to increase engine horsepower
    D: It must be vented through the side of the vehicle
  answer: B
  explanation: RCW 46.37.390 requires every vehicle to have a muffler in good working
    order to prevent excessive or unusual noise and smoke.
- id: 183
  category: vehicle_information
  question: 'When riding a bicycle at night in Washington, you must have a white front
    light visible for at least:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 700 feet
    D: 1,000 feet
  answer: B
  explanation: RCW 46.61.780 requires bicycles operated at night to have a front lamp
    emitting a white light visible from a distance of at least 500 feet.
- id: 184
  category: vehicle_information
  question: In Washington, your vehicle's turn signals must be visible from a distance
    of not less than ____ feet in normal sunlight.
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: A
  explanation: Washington law (RCW 46.37.200) requires that signal lamps be visible
    from a distance of not less than 100 feet in normal sunlight.
- id: 185
  category: vehicle_information
  question: What is the maximum legal window tinting limit for the side and rear windows
    of a passenger car in Washington?
  choices:
    A: Must allow more than 24% of light to pass through
    B: Must allow more than 35% of light to pass through
    C: Must allow more than 50% of light to pass through
    D: Tinting is not allowed on side windows
  answer: A
  explanation: In Washington, window tinting must allow more than 24% of light to
    pass through (RCW 46.37.430).
- id: 186
  category: vehicle_information
  question: 'In Washington, a vehicle''s horn must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: RCW 46.37.380 requires that every motor vehicle be equipped with a
    horn capable of emitting sound audible under normal conditions from a distance
    of not less than 200 feet.
- id: 187
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of a vehicle,
    a red flag or red light must be attached to the end of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: RCW 46.37.140 requires a red flag (daytime) or red light (nighttime)
    to be displayed if a load extends 4 feet or more beyond the rear of the vehicle.
- id: 188
  category: vehicle_information
  question: Under Washington's child restraint law, a child must be in a rear-facing
    infant seat until they reach what age?
  choices:
    A: 1 year old
    B: 2 years old
    C: 4 years old
    D: 6 years old
  answer: B
  explanation: RCW 46.61.687 requires children to remain in a rear-facing child restraint
    system until they are two years old or until they reach the weight or height steps
    set by the seat manufacturer.
- id: 189
  category: vehicle_information
  question: In Washington, children must use a booster seat until they are at least
    how tall?
  choices:
    A: 4 feet 2 inches
    B: 4 feet 5 inches
    C: 4 feet 9 inches
    D: 5 feet
  answer: C
  explanation: Washington law requires children to use a booster seat until they are
    4'9" tall or reach age 8, whichever comes first.
- id: 190
  category: vehicle_information
  question: Which of the following is true regarding safety belts in Washington State?
  choices:
    A: Only the driver and front-seat passengers must wear them
    B: Only passengers under 18 must wear them
    C: Every person in the vehicle must wear a safety belt or be in a child restraint
    D: Safety belts are optional for adults in the back seat
  answer: C
  explanation: RCW 46.61.688 (Washington's Seat Belt Law) requires every person in
    a motor vehicle to wear a properly adjusted and fastened safety belt system.
- id: 191
  category: vehicle_information
  question: 'Washington law requires that your vehicle be equipped with a parking
    brake that is capable of:'
  choices:
    A: Stopping the vehicle within 50 feet at 20 mph
    B: Holding the vehicle on any grade on which it is operated
    C: Locking the front wheels only
    D: Operating automatically when the engine is turned off
  answer: B
  explanation: RCW 46.37.310 requires a parking brake system adequate to hold the
    vehicle on any grade on which it is operated, under all conditions of loading.
- id: 192
  category: vehicle_information
  question: 'If your brakes fail while driving, Washington''s driver manual suggests
    you should first:'
  choices:
    A: Turn off the engine immediately
    B: Shift to neutral and use the emergency brake
    C: Pump the brake pedal several times
    D: Jump out of the vehicle
  answer: C
  explanation: The Washington Driver Guide recommends pumping the brake pedal several
    times to build up enough hydraulic pressure to stop the vehicle if the brakes
    fail.
- id: 193
  category: signs_and_signals
  question: In Washington State, what does a steady red 'X' posted above a reversible
    lane indicate?
  choices:
    A: The lane is about to change direction.
    B: You may use the lane only for turning left.
    C: You are not allowed to use the lane.
    D: The lane is for HOV vehicles only.
  answer: C
  explanation: According to the Washington Driver Guide, a steady red 'X' over a reversible
    lane means that you are not allowed to use that lane.
- id: 194
  category: signs_and_signals
  question: When approaching a traffic signal in Washington with a flashing yellow
    arrow, what must you do?
  choices:
    A: Stop and wait for a green arrow.
    B: Turn immediately as you have the right-of-way.
    C: Yield to oncoming traffic and pedestrians, then turn when safe.
    D: The light is broken; treat it as a four-way stop.
  answer: C
  explanation: A flashing yellow arrow means left turns are allowed, but you must
    first yield to oncoming traffic and pedestrians and then proceed with caution.
- id: 195
  category: signs_and_signals
  question: To signal a right turn using hand signals in Washington, how should you
    position your arm?
  choices:
    A: Arm straight out the window.
    B: Arm out and pointed down toward the ground.
    C: Arm out and bent upward at a 90-degree angle.
    D: Arm out and waving in a circular motion.
  answer: C
  explanation: The correct hand signal for a right turn is the left arm bent upward
    at a 90-degree angle.
- id: 196
  category: signs_and_signals
  question: In Washington, what happens to the fine for speeding in an 'Emergency
    Zone' (the area 200 feet before and after a stationary emergency vehicle with
    sirens or lights)?
  choices:
    A: The fine is waived for first-time offenders.
    B: The fine is reduced by half.
    C: The fine is doubled.
    D: The fine is tripled.
  answer: C
  explanation: Under Washington law, fines for traffic infractions committed in an
    emergency zone are doubled.
- id: 197
  category: signs_and_signals
  question: What pavement marking is used to indicate a lane reserved for High Occupancy
    Vehicles (HOV) in Washington?
  choices:
    A: A solid red line.
    B: A white diamond symbol.
    C: A series of yellow triangles.
    D: A green painted square.
  answer: B
  explanation: HOV lanes (carpool lanes) are marked with a white diamond symbol on
    the pavement and signs along the side of the highway.
- id: 198
  category: signs_and_signals
  question: When entering a roundabout in Washington State, whom must you yield to?
  choices:
    A: Traffic entering from the right.
    B: Traffic already in the circle and pedestrians in crosswalks.
    C: Only emergency vehicles.
    D: No one; traffic in the circle must yield to you.
  answer: B
  explanation: Drivers entering a roundabout must yield to traffic already in the
    circle and to pedestrians or bicyclists in the crosswalks.
- id: 199
  category: signs_and_signals
  question: 'In Washington, a solid white line painted between lanes of traffic means:'
  choices:
    A: You are in a one-way street.
    B: You should stay in your lane and avoid lane changes unless necessary.
    C: You may cross the line at any time to pass.
    D: The lane is ending immediately.
  answer: B
  explanation: A solid white line is used to mark the edge of the road or to separate
    lanes of traffic moving in the same direction where lane changes are discouraged.
- id: 200
  category: signs_and_signals
  question: What is a 'Bicycle Box' as seen at some Washington intersections?
  choices:
    A: A parking area for bicycles on the sidewalk.
    B: A green painted area at an intersection that allows bicyclists to pull in front
      of stopped cars.
    C: A storage container for rental bikes.
    D: A lane specifically for motorized scooters only.
  answer: B
  explanation: A bicycle box is a green painted area with a white bicycle symbol between
    the stop line and the crosswalk, allowing cyclists to be more visible to drivers
    at a red light.
- id: 201
  category: signs_and_signals
  question: 'In Washington, a flashing red traffic light should be treated the same
    as a:'
  choices:
    A: Yield sign.
    B: Stop sign.
    C: Warning sign.
    D: Steady yellow light.
  answer: B
  explanation: A flashing red light means you must come to a complete stop, yield
    to cross traffic and pedestrians, and proceed when it is safe, just like a stop
    sign.
- id: 202
  category: signs_and_signals
  question: In Washington State, traffic fines are __________ for infractions committed
    in roadway construction zones.
  choices:
    A: Tripled
    B: Doubled
    C: Stay the same
    D: Reduced
  answer: B
  explanation: Washington law dictates that traffic fines double in construction zones
    when workers are present.
- id: 203
  category: signs_and_signals
  question: What does a 'Sharrow' marking (a bicycle symbol with two chevrons above
    it) on a Washington roadway mean?
  choices:
    A: Bicycles are prohibited on this road.
    B: The lane is a dedicated bike lane only.
    C: The lane is shared; bicyclists may occupy the full lane.
    D: Bicycles must stay on the shoulder.
  answer: C
  explanation: Sharrows, or shared lane markings, indicate that the lane is too narrow
    for a car and a bike to share safely side-by-side, and bicyclists may use the
    entire lane.
- id: 204
  category: signs_and_signals
  question: Under Washington law, when can you turn right on a red light?
  choices:
    A: Never.
    B: Only if there is a green arrow.
    C: After coming to a complete stop and yielding to traffic and pedestrians, unless
      a sign prohibits it.
    D: Without stopping, as long as no traffic is coming.
  answer: C
  explanation: In Washington, you may turn right on a red light after stopping completely
    and yielding to others, provided there is no sign saying 'No Turn on Red'.
- id: 205
  category: signs_and_signals
  question: What is the shape and color of a standard 'Yield' sign used in Washington?
  choices:
    A: Yellow circle with black text.
    B: Red and white equilateral triangle pointing down.
    C: Orange diamond with black borders.
    D: White rectangle with black text.
  answer: B
  explanation: A yield sign is a downward-pointing triangle that is red and white
    with red letters.
- id: 206
  category: signs_and_signals
  question: In Washington State, what does a flashing yellow arrow display for a left
    turn mean?
  choices:
    A: You have the right-of-way to turn left.
    B: Left turns are prohibited; you must go straight.
    C: Left turns are allowed, but you must first yield to oncoming traffic and pedestrians.
    D: The signal is about to turn red; you must clear the intersection immediately.
  answer: C
  explanation: According to the Washington Driver Guide, a flashing yellow arrow means
    left turns are allowed, but you must yield to oncoming traffic and pedestrians
    and then proceed with caution.
- id: 207
  category: signs_and_signals
  question: In Washington, when is it legal to turn left on a red light?
  choices:
    A: Never; left turns on red are always illegal.
    B: Only from a one-way street onto another one-way street.
    C: From either a one-way or two-way street onto a one-way street.
    D: Only if there is a green arrow present.
  answer: C
  explanation: Washington law (RCW 46.61.055) allows a left turn on a red light from
    either a one-way or two-way street onto a one-way street, after coming to a complete
    stop and yielding to traffic and pedestrians.
- id: 208
  category: signs_and_signals
  question: In Washington, what does a sign with a white diamond symbol on a black
    background indicate?
  choices:
    A: A dangerous intersection ahead.
    B: A lane reserved for specific vehicles like buses or carpools (HOV).
    C: A slow-moving vehicle zone.
    D: The start of a divided highway.
  answer: B
  explanation: The diamond symbol indicates a 'restricted lane' or HOV (High Occupancy
    Vehicle) lane, reserved for buses, carpools, or other special vehicles.
- id: 209
  category: signs_and_signals
  question: 'According to Washington law, you must yield to any transit vehicle (bus)
    that has signaled and is:'
  choices:
    A: Entering a highway from an off-ramp.
    B: Stopped at a red light.
    C: Re-entering the flow of traffic from a pullout or stop.
    D: Changing lanes on a multi-lane freeway.
  answer: C
  explanation: RCW 46.61.220 requires drivers to yield the right-of-way to any transit
    vehicle that is signaled and re-entering the flow of traffic from a bus stop or
    pullout.
- id: 210
  category: signs_and_signals
  question: When using hand signals, how do you signal that you are slowing down or
    stopping?
  choices:
    A: Arm extended straight out the window.
    B: Arm bent upward at a 90-degree angle.
    C: Arm bent downward at a 90-degree angle.
    D: Waving the arm in a circular motion.
  answer: C
  explanation: The standard hand signal for slowing or stopping is the left arm extended
    out the window and bent downward at the elbow.
- id: 211
  category: signs_and_signals
  question: At an intersection where there are no painted crosswalks, what are the
    rules regarding pedestrians?
  choices:
    A: Pedestrians only have the right-of-way at marked crosswalks.
    B: Pedestrians must yield to all vehicles.
    C: Every intersection is considered a legal crosswalk, and you must yield to pedestrians.
    D: You only yield if the pedestrian is using a white cane or guide dog.
  answer: C
  explanation: In Washington, every intersection is a legal crosswalk whether it is
    marked or unmarked. Drivers must yield to pedestrians crossing the road at an
    intersection.
- id: 212
  category: signs_and_signals
  question: What do green pavement markings in a bike lane signify in Washington?
  choices:
    A: The lane is for electric scooters only.
    B: Parking is allowed for less than 5 minutes.
    C: A potential conflict area where paths of road users cross, such as near intersections.
    D: The start of a school zone.
  answer: C
  explanation: Green pavement markings are used in Washington to increase the visibility
    of bike lanes and highlight areas where motorists and bicyclists may cross paths.
- id: 213
  category: signs_and_signals
  question: 'A solid white line painted on the right edge of the roadway is known
    as a:'
  choices:
    A: Stop line.
    B: Fog line.
    C: Yield line.
    D: Center line.
  answer: B
  explanation: A solid white line on the right side of the road is called a fog line.
    It helps drivers stay on the road during poor visibility conditions.
- id: 214
  category: signs_and_signals
  question: When you approach a railroad crossing with flashing red lights, you must
    stop your vehicle within how many feet of the nearest rail?
  choices:
    A: Between 5 and 25 feet.
    B: Between 10 and 30 feet.
    C: Between 15 and 50 feet.
    D: Exactly 20 feet.
  answer: C
  explanation: Washington law requires drivers to stop at least 15 feet but no more
    than 50 feet from the nearest rail at a railroad crossing when signals are flashing.
- id: 215
  category: signs_and_signals
  question: What does a reflective orange triangle with a red border on the rear of
    a vehicle mean?
  choices:
    A: The vehicle is carrying hazardous materials.
    B: The vehicle is a wide load.
    C: The vehicle travels at speeds of 25 mph or less.
    D: The vehicle is an emergency response unit.
  answer: C
  explanation: This is the 'Slow Moving Vehicle' emblem, required on vehicles designed
    to travel at speeds of 25 mph or less, such as farm tractors or construction equipment.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 216
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 217
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 218
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 219
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 220
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 221
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 222
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 223
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 224
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 225
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 226
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 227
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 228
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 229
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 230
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
