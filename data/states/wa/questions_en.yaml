    C: It increases tire friction significantly.
    D: It has no effect on the slipperiness of the road.
  answer: B
  explanation: When below-freezing temperatures warm up to near-freezing, ice can
    melt and become wet. This makes the road more slippery.
- id: 229
  category: safe_driving_rules
  question: What should you do with your steering wheel if your vehicle begins to
