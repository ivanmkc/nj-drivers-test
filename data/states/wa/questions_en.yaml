    B: Speeding up and braking hard to reduce travel time.
    C: Leaving your engine idling when parked for a while.
    D: Keeping your tires properly inflated for better gas mileage.
  answer: D
  explanation: Keeping your tires properly inflated for better gas mileage is listed
    as a small change you can make to help lower vehicle emissions.
- id: 115
  category: vehicle_information
  question: What does Washington’s Clean Car Law require for vehicles made in 2009
    and later?
  choices:
    A: They must be electric or hybrid vehicles.
    B: They must meet strict clean air standards before being registered, licensed,
      or sold.
    C: They must have a minimum fuel efficiency of 40 miles per gallon.
    D: They must be disposed of at a state-approved recycling center after 10 years.
  answer: B
  explanation: Washington’s Clean Car Law requires vehicles made in 2009 and later
    to meet strict clean air standards before they can be registered, licensed, or
    sold.
- id: 116
  category: driver_responsibility
  question: Which of the following is a question you should ask yourself during a
    driving self-evaluation?
  choices:
    A: Did I arrive at my destination faster than expected?
    B: Was my driving legal, proficient, and smooth?
    C: How many traffic advisories did I hear?
    D: Did I use my hands-free device correctly?
  answer: B
  explanation: During a self-evaluation, you should ask yourself questions like 'Was
    my driving legal, proficient, and smooth?' to help improve and maintain your skills.
- id: 117
  category: safe_driving_rules
  question: Distracted drivers are more prone to which of the following behaviors?
  choices:
    A: Checking their side mirrors too frequently.
    B: Following too closely to other vehicles or cyclists.
    C: Stopping too far behind the stop line at intersections.
    D: Yielding the right-of-way unnecessarily.
  answer: B
  explanation: The manual lists 'Following too closely to other vehicles or cyclists
    in the lane' as a behavior that distracted drivers are more prone to.
- id: 118
  category: defensive_driving
  question: What should you do before turning to check for bicyclists or pedestrians
    who might be alongside you?
  choices:
    A: Honk your horn to warn them.
    B: Check your side mirrors and do an over-shoulder check.
    C: Accelerate quickly to get ahead of them.
    D: Rely solely on your rearview mirror.
  answer: B
  explanation: The manual states that before turning, you should check your side mirrors
    and do an over-shoulder check for bicyclists or pedestrians who might be alongside
    you or about to cross the street.
- id: 119
  category: sharing_the_road
  question: When a pedestrian is crossing the street, when is it safe for you to proceed?
  choices:
    A: As soon as they step out of your lane.
    B: When they have cleared your lane and one additional lane.
    C: When they reach the middle of the road.
    D: When they are at least 10 feet away from your vehicle.
  answer: B
  explanation: The manual states to wait until a pedestrian has cleared your lane
    and one additional lane before proceeding.
- id: 120
  category: sharing_the_road
  question: What must you do if a pedestrian using a guide dog or wheelchair is crossing
    the street?
  choices:
    A: Honk lightly to let them know you are there.
    B: Wait until they have cleared your lane and one additional lane.
    C: Wait until they have completely crossed the street before continuing.
    D: Drive around them slowly.
  answer: C
  explanation: If the pedestrian is using a wheelchair, cane, guide dog, or other
    service animal, you must wait until they have completely crossed the street before
    continuing.
- id: 121
  category: penalties_and_points
  question: What is the penalty for passing a stopped school bus?
  choices:
    A: Your license is suspended for 30 days.
    B: You receive a warning for the first offense.
    C: Fines are doubled.
    D: You must complete a defensive driving course.
  answer: C
  explanation: According to the manual, fines are doubled for anyone who passes a
    stopped school bus.
- id: 122
  category: safe_driving_rules
  question: 'When traveling in the opposite direction of a stopped school bus with
    flashing red lights, you do NOT need to stop if:'
  choices:
    A: You are on a 2-lane road.
    B: You are traveling at less than 15 mph.
    C: The road has three or more lanes.
    D: You are in a school zone.
  answer: C
  explanation: Drivers traveling in the opposite direction as the bus don't need to
    stop if there are three or more lanes, or if the lanes are separated by a median
    or barrier.
- id: 123
  category: sharing_the_road
  question: How should you react to a transit bus traveling in the same direction
    that has signaled and is pulling back onto the roadway?
  choices:
    A: Speed up to pass the bus before it merges.
    B: Honk your horn to warn the bus driver.
    C: Yield to the transit vehicle.
    D: Change lanes without signaling.
  answer: C
  explanation: You must yield to any transit vehicle traveling in the same direction
    as you that has signaled and is pulling back onto the roadway.
- id: 124
  category: vehicle_information
  question: How much distance does it take for a loaded truck with properly adjusted
    brakes traveling at 55 mph to come to a complete stop?
  choices:
    A: 150 feet
    B: 250 feet
    C: 350 feet
    D: 450 feet
  answer: D
  explanation: It takes a loaded truck with properly adjusted brakes, traveling at
    55 mph, 450 feet to come to a complete stop.
- id: 125
  category: defensive_driving
  question: When merging in front of a large vehicle, how much space should you leave?
  choices:
    A: Enough to see their front bumper in your side mirror.
    B: Wait until you can clearly see both of their headlights in your rearview mirror.
    C: At least one car length for every 10 mph of speed.
    D: Wait until you are at least 100 feet ahead of the truck.
  answer: B
  explanation: When entering traffic ahead of a large vehicle, wait until you can
    clearly see both of their headlights in your rearview mirror before merging in
    front of them.
- id: 126
  category: sharing_the_road
  question: How can you tell if you are driving in a large vehicle's blind zone?
  choices:
    A: You cannot see the driver's mirrors.
    B: You are within 50 feet of the rear of the truck.
    C: The truck's turn signals are flashing.
    D: You are driving in the left lane.
  answer: A
  explanation: If you are near a large vehicle and can't see the driver's mirrors,
    the driver can't see you because you are in their blind zone.
- id: 127
  category: safe_driving_rules
  question: Which of the following is true regarding lane sharing with a motorcycle?
  choices:
    A: You may share a lane if the motorcycle is riding far to one side.
    B: You may share a lane if the lane is exceptionally wide.
    C: You should never move into the same lane alongside a motorcyclist.
    D: You may share a lane only when passing at low speeds.
  answer: C
  explanation: Motorcyclists are entitled to the same lane width as all other vehicles.
    You should never move into the same lane alongside a motorcyclist, even if the
    lane is wide.
- id: 128
  category: vehicle_information
  question: Why might a motorcyclist's brake lights NOT be visible when they are slowing
    down?
  choices:
    A: Motorcycle brake lights are often too small to see.
    B: They might be using the throttle to slow down instead of their brakes.
    C: Motorcycle brake lights only activate at a complete stop.
    D: The brake lights are usually obscured by the rider.
  answer: B
  explanation: When slowing down, motorcyclists might use the throttle and not their
    brakes, so brake lights wouldn't be visible.
- id: 129
  category: sharing_the_road
  question: What is the minimum amount of space you must leave between your vehicle
    and a bicyclist when driving behind or passing them?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: When you're driving behind a bicyclist or passing them, you must leave
    at least 3 feet of space between the bicyclist and the widest part of your vehicle.
- id: 130
  category: safe_driving_rules
  question: How are bicyclists treated by the law when they are in a crosswalk?
  choices:
    A: They are considered motor vehicles.
    B: They must yield to all vehicular traffic.
    C: They are considered pedestrians.
    D: They are not allowed in crosswalks.
  answer: C
  explanation: Bicyclists in crosswalks are considered pedestrians. You must yield
    to them in both marked and unmarked crosswalks and intersections.
- id: 131
  category: sharing_the_road
  question: How much space do large vehicles need when navigating a roundabout?
  choices:
    A: 1 lane of space
    B: 2 lanes of space
    C: 3 lanes of space
    D: They are not permitted in roundabouts
  answer: B
  explanation: To avoid hitting something, large vehicles might require more than
    one lane to complete a turn, and they need 2 lanes of space in a roundabout.
- id: 132
  category: safe_driving_rules
  question: Are you allowed to use a center turn lane to pass a stopped school bus
    with flashing red lights?
  choices:
    A: Yes, if there is no oncoming traffic.
    B: Yes, but only if you are traveling under 15 mph.
    C: No, drivers in all turn lanes must stop.
    D: No, unless the school bus driver waves you past.
  answer: C
  explanation: Don't use a center turn lane to pass a school bus. Drivers in all turn
    lanes must stop when the red lights flash and the stop sign is extended.
- id: 133
  category: defensive_driving
  question: How might road surface irregularities like gravel or pavement seams affect
    a motorcyclist?
  choices:
    A: They have no effect on motorcycles due to their specialized tires.
    B: They may force a motorcyclist to change speed or lane position.
    C: They cause the motorcycle's turn signals to malfunction.
    D: They require the motorcyclist to pull off the road entirely.
  answer: B
  explanation: Bumpy road surfaces and irregularities such as gravel, debris, and
    pavement seams can force a motorcyclist to change speed or lane position.
- id: 134
  category: sharing_the_road
  question: How much space must you leave between your vehicle and a bicyclist when
    passing?
  choices:
    A: At least 2 feet
    B: At least 3 feet
    C: At least 4 feet
    D: At least 5 feet
  answer: B
  explanation: The manual states to leave at least 3 feet between the bicyclist and
    the widest part of your vehicle when passing.
- id: 135
  category: sharing_the_road
  question: What should you do if you are preparing to turn right and there is a bicyclist
    ahead of you?
  choices:
    A: Speed up and pass the bicyclist just before the turn.
    B: Honk your horn to warn the bicyclist to move over.
    C: Let the bicyclist clear the intersection before making the turn.
    D: Move into the bike lane to block the bicyclist before turning.
  answer: C
  explanation: 'The manual instructs drivers to let the bicyclist clear the intersection
    before making a turn, and specifically notes: "If you’re going to turn right,
    don’t pass a bicyclist just before the turn."'
- id: 136
  category: sharing_the_road
  question: When are you permitted to drive in a marked bicycle lane?
  choices:
    A: When passing a slower vehicle on the right.
    B: Only when turning or crossing the lane to park near the curb.
    C: Whenever there are no bicyclists currently using the lane.
    D: When you need to stop to drop off a passenger.
  answer: B
  explanation: According to the manual, you should "Drive in bicycle lanes only when
    turning or crossing the lane to park near the curb."
- id: 137
  category: sharing_the_road
  question: When a train is approaching, what is the required stopping distance from
    the nearest rail of a crossing?
  choices:
    A: Between 10 and 30 feet
    B: Between 15 and 50 feet
    C: Between 20 and 60 feet
    D: At least 100 feet
  answer: B
  explanation: The manual requires drivers to "Stop between 15 and 50 feet away from
    the nearest rail of a crossing" when a signal is flashing or a train is approaching.
- id: 138
  category: sharing_the_road
  question: What is the first thing you should do if your vehicle gets stuck on railroad
    tracks at a crossing?
  choices:
    A: Stay in the vehicle and call a tow truck.
    B: Try to push the vehicle off the tracks yourself.
    C: Get everyone out of the vehicle immediately.
    D: Wait to see if the crossing lights begin to flash.
  answer: C
  explanation: 'The manual explicitly states: "If your vehicle gets stuck at a crossing,
    get everyone out immediately."'
- id: 139
  category: sharing_the_road
  question: What identifies an agricultural or farm vehicle designed to travel at
    25 mph or less?
  choices:
    A: Flashing yellow strobe lights on the roof
    B: A square orange sign on the sides
    C: A triangle sign or emblem on the back
    D: A "Slow Moving" banner across the tailgate
  answer: C
  explanation: The manual states that "Agricultural and farm vehicles designed to
    go 25 mph or less will have a triangle sign or emblem on the back."
- id: 140
  category: sharing_the_road
  question: How must you react when you see or hear an emergency vehicle with its
    lights and sirens activated?
  choices:
    A: Speed up to stay ahead of the emergency vehicle.
    B: Move to the left lane and slow down.
    C: Stop immediately in your current lane.
    D: Immediately pull your vehicle to the right side of the road and stop.
  answer: D
  explanation: 'The manual instructs: "As soon as you see or hear the signals, immediately
    pull your vehicle to the right side of the road and stop."'
- id: 141
  category: safe_driving_rules
  question: When traveling on a road with multiple lanes in the same direction, what
    is the left lane primarily used for?
  choices:
    A: Carpooling
    B: Traveling at the speed limit
    C: Passing slower traffic
    D: Emergency vehicles only
  answer: C
  explanation: 'The manual states: "Keep right except to pass. When there are multiple
    lanes traveling in the same direction, drive in the right lane. Use the left lane
    to pass slower traffic."'
- id: 142
  category: safe_driving_rules
  question: What should you do if you miss your turn or exit on a freeway?
  choices:
    A: Pull onto the shoulder and carefully back up to the exit.
    B: Keep moving forward, as it is illegal to back up on a shoulder or freeway.
    C: Stop in the right lane and wait for traffic to clear before reversing.
    D: Make a U-turn across the median.
  answer: B
  explanation: 'The manual states: "Keep moving forward. Don’t drive in reverse on
    the road, even if you miss your turn or exit. It’s illegal to back up on a shoulder
    or freeway."'
- id: 143
  category: signs_and_signals
  question: Who has the authority to overrule traffic signals?
  choices:
    A: Any licensed driver in an emergency
    B: Pedestrians in a marked crosswalk
    C: Law enforcement, construction workers, and school crossing guards
    D: Drivers of commercial motor vehicles
  answer: C
  explanation: The manual notes that "law enforcement, construction workers, maintenance
    personnel, and school crossing guards can direct traffic. These people can overrule
    traffic signals, and their orders or directions must be followed."
- id: 144
  category: signs_and_signals
  question: How should you proceed if you approach an intersection where the traffic
    signal is broken and not working?
  choices:
    A: Treat the intersection like a four-way stop.
    B: Yield to traffic on your left.
    C: Proceed through the intersection without stopping if the road is clear.
    D: Wait for law enforcement to arrive before crossing.
  answer: A
  explanation: 'The manual states: "If a traffic signal isn’t working, treat the intersection
    like a four-way stop. Come to a complete stop. Yield to traffic on your right."'
- id: 145
  category: signs_and_signals
  question: Under what condition are you permitted to turn left at a solid red traffic
    light?
  choices:
    A: You may never turn left on a red light.
    B: When turning onto a one-way street, if there is no sign prohibiting it and
      you have room.
    C: When turning from a one-way street onto a two-way street.
    D: Only between the hours of midnight and 5 AM.
  answer: B
  explanation: The manual explains that "After coming to a complete stop at a red
    light, you can turn left onto a one-way street if you don’t see a 'no turn on
    red' sign and you have plenty of room to enter traffic."
- id: 146
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean?
  choices:
    A: Stop and wait for a green light.
    B: The light is about to turn red.
    C: It has the same meaning as a yield sign; slow down and proceed when you have
      the right-of-way.
    D: You must come to a complete stop before proceeding.
  answer: C
  explanation: 'The manual states: "A flashing yellow light has the same meaning as
    a yield sign. Treat the intersection as an uncontrolled intersection. Proceed
    when you have the right-of-way."'
- id: 147
  category: signs_and_signals
  question: What type of information does an orange traffic sign indicate?
  choices:
    A: Prohibitive or restricted action
    B: Construction and maintenance warning
    C: Roadway services ahead
    D: School zone warning
  answer: B
  explanation: According to the manual's section on signs, "Orange = Construction
    and maintenance warning".
- id: 148
  category: signs_and_signals
  question: What does a fluorescent yellow-green traffic sign indicate?
  choices:
    A: Construction and maintenance warning
    B: Motorist services guidance
    C: Warning of school, pedestrian, and bicycling activity
    D: Public recreation and cultural areas
  answer: C
  explanation: According to the manual, fluorescent yellow-green signs provide a warning
    of school, pedestrian, and bicycling activity.
- id: 149
  category: signs_and_signals
  question: What color are signs that provide motorist services guidance, such as
    the location of hospitals or rest areas?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: White
  answer: B
  explanation: The manual states that blue signs provide motorist services guidance.
- id: 150
  category: safe_driving_rules
  question: Can you receive a speeding ticket if you are driving under the posted
    speed limit?
  choices:
    A: No, as long as you are driving under the posted limit.
    B: Yes, but only if you are driving in a school zone.
    C: Yes, you can get a ticket for traveling too fast for road conditions.
    D: No, speed limits are absolute minimums.
  answer: C
  explanation: The manual notes that even if you are driving under the posted speed
    limit, you can get a ticket for traveling too fast for road conditions, such as
    when it is slippery or foggy.
- id: 151
  category: penalties_and_points
  question: Automated traffic safety cameras automatically record images for which
    of the following violations?
  choices:
    A: Failing to use a turn signal
    B: Driving without a seatbelt
    C: Exceeding the speed limit in a school zone
    D: Making an illegal U-turn
  answer: C
  explanation: Automated traffic safety cameras record images if you fail to stop
    at a steady red light, fail to stop at a railroad crossing signal, or exceed the
    speed limit in a school zone.
- id: 152
  category: signs_and_signals
  question: What does a square sign with a white horizontal line inside a circle mean?
  choices:
    A: Do Not Enter
    B: Wrong Way
    C: No Passing Zone
    D: Stop Ahead
  answer: A
  explanation: A square sign with a white horizontal line inside a circle is a 'Do
    Not Enter' sign, meaning you cannot enter the street from that direction.
- id: 153
  category: safe_driving_rules
  question: What is the proper use of a shared center lane?
  choices:
    A: Passing slow-moving vehicles
    B: Through traffic during rush hour
    C: Left-turning vehicles from either direction
    D: Emergency vehicles only
  answer: C
  explanation: A shared center lane left turn only sign indicates a lane reserved
    for left-turning vehicles from either direction and isn't to be used for through
    traffic or passing.
- id: 154
  category: penalties_and_points
  question: What happens to fines for offenses committed while driving in a construction
    area when workers are present?
  choices:
    A: They are waived for first-time offenders
    B: They remain the same as regular fines
    C: They are reduced by half
    D: They double
  answer: D
  explanation: The manual explicitly states that fines double for offenses committed
    while driving in construction areas when workers are present.
- id: 155
  category: sharing_the_road
  question: According to the manual, which of the following is legally considered
    a crosswalk?
  choices:
    A: Only intersections with painted white lines
    B: Every intersection, whether marked or unmarked
    C: Only intersections with pedestrian crossing signs
    D: Mid-block crossings only
  answer: B
  explanation: The manual states that every intersection is legally a crosswalk, whether
    it is marked or unmarked.
- id: 156
  category: defensive_driving
  question: What should you do if you stop at a stop line but your view of the cross
    street is blocked?
  choices:
    A: Accelerate quickly through the intersection to minimize time in the hazard
      zone
    B: Honk your horn and proceed at your normal speed
    C: Edge forward slowly until you can see
    D: Back up and choose a different route
  answer: C
  explanation: If you stop on the stop line but your view of a cross street is blocked,
    you should edge forward slowly until you can see. This allows crossing drivers
    to see the front of your vehicle.
- id: 157
  category: safe_driving_rules
  question: If two vehicles arrive at a four-way stop at approximately the same time,
    who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling faster
    D: The vehicle turning left
  answer: B
  explanation: At a four-way stop, if two vehicles arrive at approximately the same
    time, you must yield to the vehicle on the right.
- id: 158
  category: safe_driving_rules
  question: At a four-way stop, what must a vehicle turning left do?
  choices:
    A: Yield the right-of-way to vehicles going straight or turning right
    B: Proceed first before all other traffic
    C: Yield only to pedestrians, but not other vehicles
    D: Wait until the intersection is completely clear of all cars
  answer: A
  explanation: The manual states that at a four-way stop, any vehicle turning left
    must yield the right-of-way to vehicles going straight or turning right.
- id: 159
  category: safe_driving_rules
  question: When turning left or right at an intersection, which lane must you turn
    into?
  choices:
    A: The lane furthest from the direction you are coming from
    B: The center lane
    C: The lane closest to the direction you are coming from
    D: Any available lane
  answer: C
  explanation: Whether turning left or right at an intersection, state law requires
    you to turn into the lane closest to the direction you are coming from.
- id: 160
  category: safe_driving_rules
  question: How far in advance must you put on your turn signal before turning left
    or right across oncoming traffic?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: You must put on your turn signal at least 100 feet before you turn
    left or right across oncoming traffic.
- id: 161
  category: safe_driving_rules
  question: In Washington, when are U-turns generally allowed?
  choices:
    A: Only at four-way intersections
    B: Only when a sign explicitly permits them
    C: Unless a sign is posted telling you a U-turn is not allowed
    D: Only on divided highways
  answer: C
  explanation: In Washington, U-turns are generally allowed unless a sign is posted
    telling you a U-turn is not allowed.
- id: 162
  category: safe_driving_rules
  question: Where should you NOT make a U-turn due to visibility rules?
  choices:
    A: In a residential neighborhood
    B: On a curve or when approaching the crest of a hill
    C: At a T-intersection
    D: On a one-way street
  answer: B
  explanation: You must have clear visibility in all directions before making a U-turn.
    For that reason, do not make a U-turn on a curve or when approaching the crest
    of a hill.
- id: 163
  category: sharing_the_road
  question: Who has the right-of-way at a mid-block crossing with a marked crosswalk?
  choices:
    A: Vehicles traveling at the posted speed limit
    B: Pedestrians
    C: Bicyclists only if they dismount
    D: Vehicles, unless there is a stop sign
  answer: B
  explanation: According to the manual, pedestrians always have the right-of-way in
    a marked crosswalk at a mid-block crossing, and drivers should stop regardless
    of whether there is a stop sign.
- id: 164
  category: safe_driving_rules
  question: How should you react to large vehicles like fire trucks or delivery trucks
    navigating a traffic calming circle?
  choices:
    A: Honk to let them know you have the right-of-way
    B: Pass them on the right side
    C: Give them plenty of space as they might have to go clockwise to get through
    D: Tailgate them to get through the circle faster
  answer: C
  explanation: The manual states to give larger vehicles plenty of space and be aware
    that they might have to go clockwise to get through a traffic calming circle.
- id: 165
  category: safe_driving_rules
  question: What is the designed speed for driving in a roundabout?
  choices:
    A: 10 to 15 mph
    B: 15 to 25 mph
    C: 25 to 35 mph
    D: 30 to 40 mph
  answer: B
  explanation: The manual states that roundabouts are designed for speeds between
    15 and 25 mph.
- id: 166
  category: sharing_the_road
  question: How should a bicyclist travel through a roundabout when choosing to navigate
    it as a vehicle?
  choices:
    A: Ride on the truck apron
    B: Ride on the far right edge of the lane
    C: Ride in the middle of the lane to increase visibility
    D: Ride against the flow of traffic
  answer: C
  explanation: When traveling as a vehicle in a roundabout, bicyclists should ride
    in the middle of the lane to increase their visibility to drivers.
- id: 167
  category: safe_driving_rules
  question: What is the main advantage of a diverging diamond intersection?
  choices:
    A: It allows vehicles to make left turns onto the freeway without stopping or
      yielding to oncoming traffic.
    B: It allows vehicles to travel at highway speeds through local intersections.
    C: It provides a dedicated lane for U-turns only.
    D: It eliminates the need for pedestrian crosswalks.
  answer: A
  explanation: The main advantage of a diverging diamond is that it allows you to
    make left turns onto the freeway without stopping or yielding to oncoming traffic.
- id: 168
  category: safe_driving_rules
  question: At an uncontrolled intersection, you must yield the right-of-way in which
    of the following situations?
  choices:
    A: You are entering a paved road from an unpaved road.
    B: You are traveling straight and a vehicle is turning left in front of you.
    C: You are on a state highway and a vehicle is crossing from a secondary road.
    D: You are entering an unpaved road from a paved road.
  answer: A
  explanation: At uncontrolled intersections, you must yield the right-of-way if you
    enter a paved road from an unpaved road.
- id: 169
  category: signs_and_signals
  question: What do shorter dashed white lines on the roadway indicate?
  choices:
    A: A reversible lane is ahead.
    B: The lane is ending and you will need to merge or exit.
    C: You are approaching a toll booth.
    D: You are entering a school zone.
  answer: B
  explanation: Shorter dashed white lines mean the lane is ending, and you will either
    need to merge or exit.
- id: 170
  category: signs_and_signals
  question: What does a double solid white line between lanes indicate?
  choices:
    A: You may cross to change lanes if it is safe.
