  explanation: Position your vehicle slightly to the outside of the lane as you approach
    the curve. This gives you more room to maneuver and improves visibility.
- id: 225
  category: vehicle_information
  question: Which force tries to keep your car moving in a straight line when you
    suddenly turn the steering wheel in a curve?
  choices:
    A: Friction
    B: Kinetic energy
    C: Inertia
    D: Yaw
  answer: C
  explanation: In a curve, if you suddenly turn the steering wheel, inertia will try
    to keep the car moving straight.
- id: 226
  category: defensive_driving
  question: Why can the pavement be very slippery for the first few minutes when it
