metadata:
  source: 2025 South Dakota Driver's Manual
  total_questions: 255
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In South Dakota, what is the minimum age an individual must reach to apply
    for an Instruction Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: A
  explanation: According to the South Dakota Driver's Manual, the minimum age to apply
    for an Instruction Permit is 14 years old.
- id: 2
  category: license_system
  question: If a teen driver has NOT completed an approved driver education course,
    how long must they hold a South Dakota Instruction Permit before applying for
    a Restricted Minor's Permit?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: In South Dakota, if you have not completed an approved driver education
    course, you must hold the Instruction Permit for at least 180 continuous days.
- id: 3
  category: license_system
  question: 'A South Dakota Instruction Permit holder must be supervised by a person
    who is at least 18 years old, has held a valid license for at least one year,
    and is:'
  choices:
    A: Sitting in the back seat
    B: In the vehicle anywhere
    C: Occupying the seat beside the driver
    D: Monitoring from another vehicle
  answer: C
  explanation: The supervising driver must occupy the seat beside the permit holder
    to provide immediate instruction and assistance.
- id: 4
  category: license_system
  question: What are the restricted driving hours for a South Dakota Restricted Minor's
    Permit holder without a parent or guardian present?
  choices:
    A: 8 AM to 8 PM
    B: 6 AM to 10 PM
    C: 5 AM to 11 PM
    D: 7 AM to 9 PM
  answer: B
  explanation: A Restricted Minor's Permit allows the holder to drive unsupervised
    from 6 AM to 10 PM with the permission of their parent or guardian.
- id: 5
  category: license_system
  question: What is the penalty for a first conviction of a moving violation while
    holding a South Dakota GDL (Instruction or Restricted Permit)?
  choices:
    A: A $500 fine
    B: Suspension of driving privileges for 30 days
    C: Suspension of driving privileges for 6 months
    D: Mandatory retaking of the driving test only
  answer: B
  explanation: Under South Dakota law, a first conviction of a moving violation for
    a GDL holder results in a 30-day suspension of driving privileges.
- id: 6
  category: license_system
  question: To obtain a South Dakota driver's license, what is the minimum vision
    requirement (with or without corrective lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: South Dakota requires drivers to have 20/40 vision or better in at
    least one eye to qualify for an unrestricted license.
- id: 7
  category: license_system
  question: How many documents proving South Dakota residency are required to apply
    for a federally compliant REAL ID license?
  choices:
    A: One
    B: Two
    C: Three
    D: None, if you have a Social Security card
  answer: B
  explanation: Applicants must provide two separate documents that prove their physical
    South Dakota address to obtain a REAL ID.
- id: 8
  category: license_system
  question: What is the Blood Alcohol Content (BAC) limit for a driver under the age
    of 21 in South Dakota?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: South Dakota has a 'zero tolerance' law for minors, setting the BAC
    limit at 0.02% for anyone under the age of 21.
- id: 9
  category: license_system
  question: A Restricted Minor's Permit holder may NOT carry more than how many passengers
    who are not immediate family members?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: South Dakota law restricts permit holders to carrying only one passenger
    who is not a member of their immediate family.
- id: 10
  category: license_system
  question: How many days do you have to notify the South Dakota DMV of a change of
    address after moving?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: South Dakota law requires you to notify the Driver Licensing Program
    of an address change within 30 days.
- id: 11
  category: license_system
  question: What is the minimum age to apply for a full, unrestricted Class 1 Operator's
    License in South Dakota?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: A driver must be at least 16 years old and have met all the requirements
    of the Instruction and Restricted permits to receive a full Operator's License.
- id: 12
  category: license_system
  question: If you are under 18 and want to apply for a permit, whose signature is
    required on the application?
  choices:
    A: A school principal
    B: A driver education instructor
    C: A parent or legal guardian
    D: No signature is required if you have a birth certificate
  answer: C
  explanation: Applicants under 18 must have the written consent of a parent or legal
    guardian.
- id: 13
  category: license_system
  question: How long is a standard South Dakota driver's license valid before it expires?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: C
  explanation: In South Dakota, a standard driver's license is typically issued for
    a period of 5 years.
- id: 14
  category: license_system
  question: What is the passing score for the South Dakota written knowledge test?
  choices:
    A: 70% (18 out of 25 correct)
    B: 75% (19 out of 25 correct)
    C: 80% (20 out of 25 correct)
    D: 90% (23 out of 25 correct)
  answer: C
  explanation: The South Dakota knowledge test consists of 25 questions, and you must
    answer at least 20 correctly (80%) to pass.
- id: 15
  category: license_system
  question: 'If you hold a South Dakota Instruction Permit and complete an approved
    driver education course, the holding period is reduced from 180 days to:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: Completing an approved driver education course reduces the required
    holding period for an Instruction Permit from 180 days to 90 days.
- id: 16
  category: license_system
  question: How many days before your South Dakota driver's license expires are you
    permitted to renew it?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: D
  explanation: In South Dakota, you may renew your driver's license up to 180 days
    (6 months) prior to its expiration date.
- id: 17
  category: license_system
  question: If you legally change your name through marriage or court order, how many
    days do you have to apply for a duplicate South Dakota license with the new name?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: South Dakota law requires drivers to notify the Department of Public
    Safety and obtain a duplicate license within 30 days of a legal name change.
- id: 18
  category: license_system
  question: What are the minimum liability insurance coverage requirements for a motor
    vehicle registered in South Dakota?
  choices:
    A: 10/20/10 ($10k bodily injury per person / $20k per accident / $10k property
      damage)
    B: 25/50/25 ($25k bodily injury per person / $50k per accident / $25k property
      damage)
    C: 50/100/50 ($50k bodily injury per person / $100k per accident / $50k property
      damage)
    D: 100/300/100 ($100k bodily injury per person / $300k per accident / $100k property
      damage)
  answer: B
  explanation: South Dakota law requires minimum liability insurance of $25,000 for
    bodily injury to one person, $50,000 for bodily injury to two or more people,
    and $25,000 for property damage (25/50/25).
- id: 19
  category: license_system
  question: Under South Dakota's Implied Consent Law, what is the penalty for refusing
    to submit to a chemical test for alcohol or drugs if requested by an officer?
  choices:
    A: A $500 fine only
    B: A 30-day license suspension
    C: A 1-year license revocation
    D: A mandatory 48-hour jail sentence
  answer: C
  explanation: By driving in South Dakota, you consent to chemical testing. Refusal
    to take the test results in a 1-year revocation of your driving privileges.
- id: 20
  category: license_system
  question: What is the minimum age to apply for a Commercial Driver License (CDL)
    in South Dakota to operate a commercial vehicle in interstate commerce (across
    state lines)?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: While you can obtain a CDL for intrastate (within SD) driving at 18,
    federal law requires you to be at least 21 years old to drive a commercial vehicle
    across state lines (interstate).
- id: 21
  category: license_system
  question: What is the minimum age to apply for a South Dakota Motorcycle Instruction
    Permit (Class 2)?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: A
  explanation: In South Dakota, a person who is at least 14 years old may apply for
    a motorcycle instruction permit after passing the required vision and knowledge
    tests.
- id: 22
  category: license_system
  question: In South Dakota, your driving privileges may be suspended if you are convicted
    of how many moving violations within a 12-month period?
  choices:
    A: 2 convictions
    B: 3 convictions
    C: 5 convictions
    D: 8 convictions
  answer: B
  explanation: The South Dakota Department of Public Safety may suspend the license
    of any driver who is convicted of three or more moving violations within any 12-month
    period.
- id: 23
  category: license_system
  question: What is the fee for a duplicate South Dakota driver's license if yours
    is lost, stolen, or destroyed?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $28.00
  answer: C
  explanation: The fee for a duplicate South Dakota driver's license or ID card is
    currently $15.00.
- id: 24
  category: license_system
  question: To have the 'Veteran' designation added to a South Dakota driver's license,
    what document must the applicant provide?
  choices:
    A: A military ID card
    B: A letter from the VA
    C: A DD Form 214 (Discharge Paperwork)
    D: A valid US Passport
  answer: C
  explanation: To add the Veteran indicator to a South Dakota license, the applicant
    must provide a DD-214 showing an honorable discharge.
- id: 25
  category: license_system
  question: 'According to South Dakota law, applying for a driver''s license or permit
    automatically registers males between the ages of 18 and 25 for:'
  choices:
    A: The State Militia
    B: Voter Registration
    C: The Selective Service System
    D: Jury Duty eligibility
  answer: C
  explanation: Under SDCL 32-12-17.15, any male US citizen or immigrant between 18
    and 25 who applies for a license or permit consents to registration with the Selective
    Service System.
- id: 26
  category: license_system
  question: 'South Dakota drivers may renew their license online or by mail, but they
    must renew in person at least once every:'
  choices:
    A: 2 years
    B: 5 years
    C: 10 years
    D: 15 years
  answer: C
  explanation: South Dakota allows online renewal if you renewed in person last time.
    Because licenses are valid for 5 years, this means you must visit a station in
    person at least once every 10 years.
- id: 27
  category: license_system
  question: Which of the following is a requirement for all applicants applying for
    a South Dakota driver's license for the first time?
  choices:
    A: Providing a Social Security Number
    B: Providing a high school diploma
    C: Providing a blood type certificate
    D: Providing a character reference
  answer: A
  explanation: All applicants for a South Dakota driver's license must provide their
    Social Security Number, which is verified with the Social Security Administration.
- id: 28
  category: license_system
  question: What is the reinstatement fee for a South Dakota driver's license that
    was revoked due to a DUI or drug-related offense?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: D
  explanation: The reinstatement fee for alcohol or drug-related revocations in South
    Dakota is $200.
- id: 29
  category: license_system
  question: What is the reinstatement fee for a South Dakota driver's license that
    was suspended for reasons other than DUI, drugs, or child support arrears?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: For most general suspensions (like multiple moving violations), the
    South Dakota reinstatement fee is $50.
- id: 30
  category: license_system
  question: 'If you are a non-US citizen applying for a South Dakota license, you
    must provide proof of:'
  choices:
    A: Employment in the state
    B: Lawful status in the United States
    C: A valid foreign driver's license
    D: Ownership of a vehicle
  answer: B
  explanation: Non-citizens must provide valid USCIS documents to prove lawful status
    in the United States to be eligible for a South Dakota driver's license.
- id: 31
  category: driver_testing
  question: In South Dakota, what is the maximum speed limit on rural interstate highways
    for passenger vehicles?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: According to the South Dakota Driver's Manual, the maximum speed limit
    on rural interstate highways is 80 mph unless otherwise posted.
- id: 32
  category: driver_testing
  question: When parking your vehicle near a fire hydrant in South Dakota, what is
    the minimum required distance you must maintain?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: South Dakota law prohibits parking within 15 feet of a fire hydrant.
- id: 33
  category: driver_testing
  question: In South Dakota, you are prohibited from parking within how many feet
    of a stop sign, flashing beacon, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers may not park within 30 feet of any flashing beacon, stop sign,
    or traffic control signal located at the side of a roadway.
- id: 34
  category: driver_testing
  question: 'Under South Dakota law, an accident report must be filed with the Department
    of Public Safety if the accident results in injury, death, or total property damage
    exceeding:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $2,500
  answer: B
  explanation: Drivers must report any accident resulting in injury, death, or property
    damage of $1,000 or more to any one person's property or $2,000 total.
- id: 35
  category: driver_testing
  question: When driving at night in South Dakota, you must dim your high beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: South Dakota law requires drivers to dim their high beams when within
    500 feet of an oncoming vehicle.
- id: 36
  category: driver_testing
  question: When passing a bicycle in South Dakota on a roadway with a speed limit
    of 35 mph or less, what is the minimum trailing/passing distance required by law?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 6 feet
  answer: B
  explanation: South Dakota law requires a minimum of 3 feet of space when passing
    a bicycle if the speed limit is 35 mph or less. If the speed limit is over 35
    mph, the requirement increases to 6 feet.
- id: 37
  category: driver_testing
  question: In South Dakota, it is illegal to park within how many feet of a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: Parking is prohibited within 20 feet of a crosswalk at an intersection.
- id: 38
  category: driver_testing
  question: What is the minimum distance you must park away from the nearest rail
    of a railroad crossing in South Dakota?
  choices:
    A: 20 feet
    B: 30 feet
    C: 50 feet
    D: 100 feet
  answer: C
  explanation: South Dakota regulations state that you may not park within 50 feet
    of the nearest rail of a railroad crossing.
- id: 39
  category: driver_testing
  question: The South Dakota Driver's Manual recommends maintaining a following distance
    of at least how many seconds behind the vehicle in front of you?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: South Dakota recommends the 'three-second rule' for maintaining a safe
    following distance under ideal driving conditions.
- id: 40
  category: driver_testing
  question: At what speed can hydroplaning (where tires lose contact with the road
    on wet surfaces) begin in South Dakota?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: In South Dakota, hydroplaning can begin at speeds as low as 35 mph,
    and tires may lose all contact with the road at 55 mph.
- id: 41
  category: driver_testing
  question: In South Dakota, if you are driving on a highway with at least two lanes
    in each direction and a school bus is stopped in the opposite direction with red
    lights flashing and stop arm extended, do you need to stop?
  choices:
    A: Yes, you must always stop for a school bus.
    B: No, you do not need to stop if the highway is divided by a median or barrier.
    C: No, you only stop if there are children present.
    D: Yes, unless you are traveling over 55 mph.
  answer: B
  explanation: On a divided highway with a physical barrier or median, traffic traveling
    in the opposite direction of a stopped school bus is not required to stop.
- id: 42
  category: driver_testing
  question: What happens to traffic violation fines in South Dakota when the violation
    occurs in a designated work zone?
  choices:
    A: Fines are tripled.
    B: Fines are doubled.
    C: Fines are increased by $100.
    D: Fines remain the same but points are doubled.
  answer: B
  explanation: In South Dakota, speeding fines and other traffic violation fines are
    doubled in highway work zones when workers are present.
- id: 43
  category: driver_testing
  question: According to the South Dakota Driver's Manual, what is the correct hand
    signal for a right turn?
  choices:
    A: Left arm extended straight out.
    B: Left arm extended downward.
    C: Left arm extended upward.
    D: Right arm extended straight out.
  answer: C
  explanation: The hand signal for a right turn is the left arm and hand extended
    upward.
- id: 44
  category: driver_testing
  question: Under South Dakota's 'Move Over Law,' what must a driver do when approaching
    a stopped authorized emergency vehicle using visual signals?
  choices:
    A: Stop immediately in the lane of travel.
    B: Maintain speed but honk to alert the officer.
    C: Move to a lane not adjacent to the vehicle or slow down to a safe speed if
      a lane change is not possible.
    D: Speed up to pass the vehicle as quickly as possible.
  answer: C
  explanation: South Dakota law requires drivers to move to a non-adjacent lane or
    slow down significantly when passing stopped emergency vehicles with lights activated.
- id: 45
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit on unpaved (gravel)
    roads in South Dakota?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: According to the South Dakota Driver's Manual, the maximum speed limit
    on unpaved roads is 55 mph unless otherwise posted.
- id: 46
  category: driver_testing
  question: When parking near an intersection, you must be at least how many feet
    away from a stop sign, yield sign, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers in South Dakota may not park within 30 feet of any flashing
    beacon, stop sign, yield sign, or traffic control signal located at the side of
    a roadway.
- id: 47
  category: driver_testing
  question: 'Under South Dakota law, you must immediately report an accident to the
    nearest law enforcement agency if it results in property damage to any one person''s
    property of at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: B
  explanation: South Dakota law requires an immediate report for accidents involving
    injury, death, or property damage of $1,000 or more to any one person's property
    (or $2,000 total).
- id: 48
  category: driver_testing
  question: In South Dakota, between what times are you required to display your headlights?
  choices:
    A: From sunset to sunrise
    B: From 1/2 hour after sunset to 1/2 hour before sunrise
    C: From 1 hour after sunset to 1 hour before sunrise
    D: Only when visibility is less than 1,000 feet
  answer: B
  explanation: South Dakota law requires headlights to be turned on from a half-hour
    after sunset to a half-hour before sunrise, and at any other time when visibility
    is poor.
- id: 49
  category: driver_testing
  question: Under what specific condition is a left turn on a red light permitted
    in South Dakota?
  choices:
    A: It is never permitted
    B: When turning from a two-way street onto a one-way street
    C: When turning from a one-way street onto another one-way street
    D: When there is no traffic coming from the right
  answer: C
  explanation: In South Dakota, a left turn on red is only legal when turning from
    a one-way street onto another one-way street after coming to a complete stop and
    yielding to traffic and pedestrians.
- id: 50
  category: driver_testing
  question: 'A slow-moving vehicle emblem (an orange triangle) must be displayed on
    the rear of any vehicle designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The slow-moving vehicle emblem is required for vehicles that travel
    at speeds of 25 mph or less, such as farm machinery or construction equipment.
- id: 51
  category: driver_testing
  question: In South Dakota, you must signal your intention to turn at least how many
    feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Drivers are required to signal their intent to turn at least 100 feet
    before reaching the intersection or turn point.
- id: 52
  category: driver_testing
  question: 'When a school bus is stopped with its red lights flashing and stop arm
    extended on a highway with a physical median or barrier, traffic traveling in
    the opposite direction must:'
  choices:
    A: Stop at least 15 feet away
    B: Stop only if there are children crossing
    C: Slow down to 15 mph and proceed with caution
    D: Proceed without stopping
  answer: D
  explanation: In South Dakota, if a highway is divided by a physical barrier or median,
    traffic traveling in the opposite direction of a school bus is not required to
    stop.
- id: 53
  category: driver_testing
  question: 'When approaching a stationary emergency vehicle using visual signals
    on a multi-lane highway, South Dakota''s ''Move Over'' law requires you to:'
  choices:
    A: Stop immediately in your lane
    B: Move to a lane that is not adjacent to the emergency vehicle, if safe to do
      so
    C: Maintain your speed but move to the far left of your lane
    D: Speed up to pass the emergency vehicle as quickly as possible
  answer: B
  explanation: South Dakota law requires drivers to move to a lane not adjacent to
    the emergency vehicle or slow down significantly if a lane change is not possible
    or safe.
- id: 54
  category: driver_testing
  question: You may not park your vehicle within how many feet of a crosswalk at an
    intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: According to South Dakota parking regulations, you may not park within
    20 feet of a crosswalk at an intersection.
- id: 55
  category: driver_responsibility
  question: New residents to South Dakota must register and title their vehicles within
    how many days of establishing residency?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: South Dakota law requires new residents to register and title their
    motor vehicles within 90 days of establishing residency in the state.
- id: 56
  category: driver_responsibility
  question: Under the South Dakota point system, how many points accumulated within
    a 12-month period will result in a license suspension?
  choices:
    A: 10 points
    B: 12 points
    C: 15 points
    D: 20 points
  answer: C
  explanation: In South Dakota, a driver's license will be suspended if they accumulate
    15 points in any 12-consecutive month period.
- id: 57
  category: driver_responsibility
  question: If a South Dakota driver accumulates 22 points within a 24-month period,
    what is the consequence?
  choices:
    A: A formal warning letter
    B: Mandatory driver retraining
    C: License suspension
    D: Permanent license revocation
  answer: C
  explanation: South Dakota law mandates a license suspension for drivers who accumulate
    22 points within a 24-consecutive month period.
- id: 58
  category: driver_responsibility
  question: In South Dakota, how many points are assessed against your driving record
    for a conviction of 'Reckless Driving'?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 10 points
  answer: C
  explanation: Under the South Dakota point system, Reckless Driving is a high-point
    violation and results in 8 points being added to the driver's record.
- id: 59
  category: driver_responsibility
  question: 'If you are convicted of driving without insurance in South Dakota, your
    license may be suspended for a period of:'
  choices:
    A: 7 to 14 days
    B: 30 days to one year
    C: Exactly six months
    D: Two years
  answer: B
  explanation: Failure to maintain financial responsibility (insurance) in South Dakota
    can lead to a license suspension ranging from 30 days to one year.
- id: 60
  category: driver_responsibility
  question: Drivers who have had their license suspended for a lack of financial responsibility
    must maintain an SR-22 insurance certificate for how long?
  explanation: South Dakota requires drivers to file and maintain an SR-22 (Proof
    of Financial Responsibility) for three years following a suspension for insurance-related
    violations or certain serious offenses.
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
- id: 61
  category: driver_responsibility
  question: In South Dakota, it is illegal to have an open alcoholic beverage container
    in which part of the vehicle while on a public highway?
  choices:
    A: The trunk only
    B: The passenger area
    C: The glove compartment
    D: Behind the last upright seat of a hatchback
  answer: B
  explanation: South Dakota law prohibits the possession of an unsealed or open alcoholic
    beverage container in the passenger area of any motor vehicle on a public highway.
- id: 62
  category: driver_responsibility
  question: What is the point value assessed for a standard 'Speeding' violation in
    South Dakota?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: A standard speeding conviction in South Dakota results in 2 points
    being added to the driver's record.
- id: 63
  category: driver_responsibility
  question: 'For a first DUI conviction in South Dakota, a driver''s license can be
    revoked for a period of at least:'
  choices:
    A: 10 days
    B: 30 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: A first offense DUI conviction in South Dakota carries a mandatory
    license revocation period of no less than 30 days, which can extend up to one
    year.
- id: 64
  category: driver_responsibility
  question: 'In South Dakota, children must be secured in a child passenger restraint
    system if they are under the age of:'
  choices:
    A: 4 years old
    B: 5 years old
    C: 8 years old
    D: 12 years old
  answer: B
  explanation: South Dakota law (SDCL 32-37-1) requires that any child under the age
    of 5 must be properly secured in a child passenger restraint system.
- id: 65
  category: driver_responsibility
  question: If you are involved in an accident where the total property damage to
    all vehicles and property is ________ or more, you must file a report with the
    DMV if law enforcement did not file one.
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $4,000
  answer: C
  explanation: In South Dakota, if the total property damage from an accident reaches
    $2,000 or more, a report must be filed with the Department of Public Safety/DMV.
- id: 66
  category: driver_responsibility
  question: Under South Dakota law, what is the point penalty for 'Failure to Yield
    Right of Way'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: A conviction for Failure to Yield Right of Way in South Dakota results
    in 4 points being assessed against the driver's license.
- id: 67
  category: driver_responsibility
  question: In South Dakota, most passenger vehicles are required to display how many
    license plates?
  choices:
    A: One plate on the rear only
    B: One plate on the front only
    C: Two plates, one on the front and one on the rear
    D: Two plates, both on the rear
  answer: C
  explanation: 'South Dakota law generally requires motor vehicles to display two
    license plates: one on the front and one on the rear of the vehicle.'
- id: 68
  category: driver_responsibility
  question: 'Before leaving a motor vehicle unattended on a South Dakota highway,
    the law requires the driver to do all of the following EXCEPT:'
  choices:
    A: Effectively set the brake
    B: Stop the engine
    C: Remove the key from the ignition
    D: Turn the wheels toward the curb regardless of the grade
  answer: D
  explanation: SDCL 32-30-5 requires drivers to stop the engine, lock the ignition,
    remove the key, and set the brake. While turning wheels is safe practice on hills,
    the law specifically mandates the first three actions for all unattended vehicles.
- id: 69
  category: driver_responsibility
  question: How many days does a new resident have to register their vehicle after
    moving to South Dakota?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: New residents in South Dakota are required to register their motor
    vehicles within 90 days of establishing residency.
- id: 70
  category: driver_responsibility
  question: When purchasing a vehicle in South Dakota, within how many days must you
    apply for a title and pay the required motor vehicle excise tax?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: South Dakota law requires that a vehicle title be applied for within
    45 days of the date of purchase to avoid late fees and penalties.
- id: 71
  category: driver_responsibility
  question: What is the penalty for a first-time conviction of driving without the
    required liability insurance in South Dakota?
  choices:
    A: A $100 fine only
    B: A Class 2 misdemeanor, a $500 fine, and license suspension for 30 days to one
      year
    C: A verbal warning and a 10-day grace period to provide proof
    D: Permanent vehicle impoundment
  answer: B
  explanation: Driving without insurance in South Dakota is a Class 2 misdemeanor.
    Penalties include a $500 fine, up to 30 days in jail, and a mandatory driver's
    license suspension for at least 30 days (up to one year).
- id: 72
  category: driver_responsibility
  question: If your South Dakota driver's license is suspended for a financial responsibility
    violation, you must maintain an SR-22 insurance filing for how long?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers who have had their license suspended for lack of insurance
    or certain other violations must typically maintain an SR-22 certificate of financial
    responsibility for 3 years.
- id: 73
  category: driver_responsibility
  question: Under South Dakota's 'Move Over' law, what must a driver do when approaching
    an emergency vehicle stopped on the side of a multi-lane highway with its lights
    flashing?
  choices:
    A: Stop completely in the lane of travel
    B: Maintain speed but honk to alert the officer
    C: Move into a lane not adjacent to the emergency vehicle, if safe to do so
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: South Dakota law requires drivers to move into a lane not adjacent
    to the stopped emergency vehicle on multi-lane highways. If moving over is not
    possible or safe, the driver must slow down to a speed that is safe for the conditions.
- id: 74
  category: driver_responsibility
  question: What is the maximum fine for a first-offense littering conviction from
    a motor vehicle in South Dakota?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Littering in South Dakota is a Class 2 misdemeanor, which carries a
    maximum penalty of a $500 fine and/or 30 days in jail.
- id: 75
  category: driver_responsibility
  question: 'A first-offense DUI (Driving Under the Influence) conviction in South
    Dakota can result in a license revocation for a period of:'
  choices:
    A: 10 to 20 days
    B: 30 days to 1 year
    C: Exactly 2 years
    D: Life
  answer: B
  explanation: For a first DUI offense in South Dakota, the court may revoke the driver's
    license for a period ranging from 30 days to one year.
- id: 76
  category: driver_responsibility
  question: 'South Dakota law requires children to be in a federally approved car
    seat if they are:'
  choices:
    A: Under 5 years of age and weigh less than 40 pounds
    B: Under 8 years of age and weigh less than 80 pounds
    C: Under 12 years of age
    D: Under 4 feet tall regardless of age
  answer: A
  explanation: South Dakota law requires that any child under the age of 5, who weighs
    less than 40 pounds, must be properly secured in a child passenger restraint system.
- id: 77
  category: driver_responsibility
  question: If you are involved in an accident in South Dakota and the police do NOT
    investigate, when must you file a written report with the Department of Public
    Safety?
  choices:
    A: Within 24 hours if damage exceeds $500
    B: Within 10 days if there is an injury, death, or total property damage of $2,000
      or more
    C: Only if someone is hospitalized
    D: Reports are never required if the police do not attend
  answer: B
  explanation: If an accident is not investigated by law enforcement, and it results
    in injury, death, or property damage of $2,000 or more, the driver must file a
    written report within 10 days.
- id: 78
  category: safe_driving_rules
  question: What is the speed limit in a South Dakota school zone when children are
    present or when a warning light is flashing?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: In South Dakota, the speed limit in school zones is 15 mph when children
    are present or when indicated by flashing lights.
- id: 79
  category: safe_driving_rules
  question: You may not park your vehicle within how many feet of a stop sign, yield
    sign, or traffic control signal in South Dakota?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: According to the South Dakota Driver's Manual, you must not park within
    30 feet of any official flashing beacon, stop sign, yield sign, or traffic control
    signal.
- id: 80
  category: safe_driving_rules
  question: 'In South Dakota, you are prohibited from making a U-turn on a curve or
    near the crest of a hill where your vehicle cannot be seen by other drivers approaching
    from either direction within:'
  choices:
    A: 500 feet
    B: 700 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: South Dakota law prohibits U-turns on curves or hills where the vehicle
    cannot be seen by others within 1,000 feet.
- id: 81
  category: safe_driving_rules
  question: In South Dakota, you may not pass another vehicle when you are within
    how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Drivers are prohibited from passing when they are within 100 feet of
    an intersection or a railroad crossing.
- id: 82
  category: safe_driving_rules
  question: 'South Dakota''s ''Move Over'' law requires drivers approaching a stopped
    emergency vehicle with lights flashing to:'
  choices:
    A: Stop completely until the vehicle leaves
    B: Maintain speed but honk to alert the emergency workers
    C: Move to a lane not adjacent to the vehicle or slow down to a safe speed if
      a lane change is not possible
    D: Accelerate to pass the vehicle as quickly as possible
  answer: C
  explanation: South Dakota law requires drivers to move over to a non-adjacent lane
    or slow down significantly when approaching stopped emergency or maintenance vehicles
    with flashing lights.
- id: 83
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit on an undivided two-lane
    South Dakota state highway?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: C
  explanation: The default speed limit on South Dakota state highways is 65 mph unless
    signs indicate otherwise.
- id: 84
  category: safe_driving_rules
  question: 'To maintain a safe following distance behind the vehicle in front of
    you in South Dakota, you should use the:'
  choices:
    A: One-car-length rule
    B: Two-second rule
    C: Three-second rule
    D: Five-second rule
  answer: C
  explanation: The South Dakota Driver's Manual recommends a following distance of
    at least three seconds under normal driving conditions.
- id: 85
  category: safe_driving_rules
  question: In South Dakota, you may not park your vehicle within how many feet of
    the driveway entrance to any fire station?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: C
  explanation: It is illegal to park within 20 feet of a fire station driveway entrance
    on the same side of the street.
- id: 86
  category: safe_driving_rules
  question: According to the South Dakota Driver's Manual, at what speed can your
    tires start to 'hydroplane' (lose contact with the road) in heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The manual states that partial hydroplaning can begin at speeds as
    low as 35 mph.
- id: 87
  category: safe_driving_rules
  question: 'In South Dakota, you must turn on your headlights if you cannot see persons
    or vehicles clearly for at least:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: A
  explanation: South Dakota law requires the use of headlights when visibility is
    reduced to 200 feet or less due to weather or darkness.
- id: 88
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in a South Dakota urban
    business district?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: According to the South Dakota Driver's Manual, the speed limit in a
    business district is 20 mph unless otherwise posted.
- id: 89
  category: safe_driving_rules
  question: According to the South Dakota Driver's Manual, what is the recommended
    following distance behind the vehicle in front of you?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: South Dakota recommends a following distance of at least 3 seconds
    to allow enough time to react to hazards.
- id: 90
  category: safe_driving_rules
  question: At an uncontrolled intersection where two vehicles arrive at the same
    time, which driver has the right of way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver on the larger road
  answer: B
  explanation: In South Dakota, at an uncontrolled intersection, the driver of the
    vehicle on the left must yield the right of way to the vehicle on the right.
- id: 91
  category: safe_driving_rules
  question: Under South Dakota law, what happens to the fine for a speeding violation
    in a designated work zone when workers are present?
  choices:
    A: The fine is waived for first-time offenders
    B: The fine is doubled
    C: The fine is tripled
    D: The fine remains the same as a standard ticket
  answer: B
  explanation: Speeding fines are doubled in South Dakota work zones when workers
    are present and the zone is properly signed.
- id: 92
  category: safe_driving_rules
  question: 'When passing another vehicle on a two-lane road, you should not return
    to the right lane until:'
  choices:
    A: You are 10 feet ahead of the passed vehicle
    B: You turn on your right turn signal
    C: You can see the headlights of the passed vehicle in your rearview mirror
    D: The passed vehicle honks its horn
  answer: C
  explanation: To ensure a safe distance, you should not pull back into the right
    lane until you can see the headlights of the vehicle you just passed in your rearview
    mirror.
- id: 93
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in South Dakota,
    how far ahead should you scan the road?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: One city block only
  answer: B
  explanation: South Dakota defensive driving guidelines suggest looking 10 to 15
    seconds ahead to anticipate hazards and traffic flow changes.
- id: 94
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road due
    to water) begin in South Dakota weather conditions?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only during heavy thunderstorms
  answer: A
  explanation: The South Dakota Driver's Manual warns that hydroplaning can start
    at speeds as low as 35 mph, and at 50 mph, tires may lose all contact with the
    road.
- id: 95
  category: defensive_driving
  question: When driving in heavy fog in South Dakota, which headlight setting should
    you use?
  choices:
    A: High beams to see further
    B: Low beams
    C: Parking lights only
    D: No lights are required during the day
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    water droplets, causing glare and making it harder to see.
- id: 96
  category: defensive_driving
  question: If your vehicle begins to skid on an icy South Dakota road, what is the
    correct defensive driving response?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the direction the rear of the vehicle is skidding
    D: Shift the car into neutral and turn off the engine
  answer: C
  explanation: To recover from a skid, you should stay off the brakes and steer in
    the direction the rear of the vehicle is sliding.
- id: 97
  category: defensive_driving
  question: In South Dakota, when must you use your turn signal before making a turn
    or changing lanes?
  choices:
    A: At least 50 feet before the turn
    B: At least 100 feet before the turn
    C: At least 200 feet before the turn
    D: Only when other vehicles are present
  answer: B
  explanation: South Dakota law 32-26-18.1 requires drivers to signal their intention
    to turn continuously for at least the last 100 feet traveled before turning.
- id: 98
  category: defensive_driving
  question: When driving on a South Dakota interstate with a speed limit of 80 mph,
    what is the safest way to handle a 'No-Zone' around a large commercial truck?
  choices:
    A: Tailgate the truck to stay in its slipstream
    B: Drive alongside the truck's cab for long periods
    C: Avoid lingering in the areas directly behind, in front, or on either side of
      the truck
    D: Flash your high beams until the truck moves over
  answer: C
  explanation: The 'No-Zone' refers to the large blind spots around trucks. Defensive
    drivers avoid these areas to ensure the truck driver can see them.
- id: 99
  category: defensive_driving
  question: 'Under South Dakota law, you are NOT required to stop for a school bus
    with red lights flashing and stop arm extended if:'
  choices:
    A: You are traveling in the opposite direction on a two-lane road
    B: The bus is stopped in a school zone
    C: You are traveling in the opposite direction on a divided highway with a median
      or physical barrier
    D: There are no children visible on the sidewalk
  answer: C
  explanation: Drivers do not need to stop for a school bus if they are on the opposite
    side of a divided highway where the lanes are separated by a physical barrier
    or median.
- id: 100
  category: defensive_driving
  question: What is the 'blind spot' rule for following distances when behind a motorcycle
    in South Dakota?
  choices:
    A: Follow closer than a car because they stop slower
    B: Allow a four-second following distance to account for the motorcycle's ability
      to stop quickly
    C: Always share the lane with the motorcycle
    D: Motorcycles do not have blind spots
  answer: B
  explanation: The South Dakota manual suggests increasing following distance behind
    motorcycles to at least four seconds because they can stop much faster than cars
    and are easily obscured by road hazards.
- id: 101
  category: defensive_driving
  question: 'When entering a roundabout in South Dakota, defensive driving rules dictate
    that you must yield the right-of-way to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right of way when entering
    D: Only emergency vehicles
  answer: B
  explanation: In South Dakota roundabouts, entering traffic must always yield to
    the traffic already circulating in the roundabout.
- id: 102
  category: defensive_driving
  question: If your brakes fail while driving in South Dakota, what is the first defensive
    action you should take?
  choices:
    A: Shift to neutral and turn off the key
    B: Pump the brake pedal several times to build up pressure
    C: Immediately pull the emergency brake at high speed
    D: Jump out of the vehicle
  answer: B
  explanation: If your brakes fail, you should first pump the brake pedal several
    times. If that doesn't work, use the parking brake gradually and shift to a lower
    gear.
- id: 103
  category: defensive_driving
  question: At what speed can hydroplaning begin to occur on wet South Dakota roads
    with standard tires?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning (where tires lose contact with the road and ride on a
    film of water) can begin at speeds as low as 35 mph.
- id: 104
  category: defensive_driving
  question: According to South Dakota law, during which timeframe are motorists permitted
    to use studded snow tires?
  choices:
    A: November 1 to March 31
    B: October 1 to April 30
    C: October 15 to April 15
    D: September 1 to May 31
  answer: B
  explanation: Under SDCL 32-19-3, it is lawful to operate a motor vehicle with studded
    tires between October 1 and April 30.
- id: 105
  category: defensive_driving
  question: When approaching a stationary emergency vehicle with its lights flashing
    on a South Dakota interstate, what must you do?
  choices:
    A: Maintain speed but move to the left lane
    B: Stop immediately in the driving lane
    C: Move to the lane not adjacent to the vehicle and slow down
    D: Honk to let the emergency workers know you are passing
  answer: C
  explanation: South Dakota's 'Move Over' law (SDCL 32-30-6.1) requires drivers to
    move to the non-adjacent lane on multi-lane highways or slow down significantly
    if moving over is not possible.
- id: 106
  category: defensive_driving
  question: When parking a vehicle on a downhill grade in South Dakota, how should
    you position your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter as long as the parking brake is set
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will roll into the curb rather than into traffic.
- id: 107
  category: defensive_driving
  question: Before changing lanes, how should you check for vehicles in your blind
    spots?
  choices:
    A: Check your rearview mirror only
    B: Check your side mirrors only
    C: Turn your head and look over your shoulder
    D: Slow down and wait for vehicles to pass
  answer: C
  explanation: Mirrors do not show everything; you must turn your head and check over
    your shoulder to ensure the blind spot is clear before changing lanes.
- id: 108
  category: defensive_driving
  question: 'When following a vehicle that stops at railroad crossings (like a school
    bus or a truck carrying hazardous materials), South Dakota recommends you:'
  choices:
    A: Pass them immediately
    B: Increase your following distance
    C: Honk to encourage them to move faster
    D: Stop right behind their bumper
  answer: B
  explanation: Defensive driving requires increasing following distance behind vehicles
    required by law to stop at all railroad crossings to allow them space to stop
    and restart safely.
- id: 109
  category: defensive_driving
  question: 'In South Dakota, you must dim your high-beam headlights when following
    another vehicle from behind within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: The South Dakota Driver's Manual states you should dim your high beams
    when following another vehicle within 200 feet to avoid blinding the driver in
    front of you through their mirrors.
- id: 110
  category: alcohol_drugs_health
  question: In South Dakota, a first-offense DUI (Driving Under the Influence) is
    classified as what type of legal charge?
  choices:
    A: Class 2 Misdemeanor
    B: Class 1 Misdemeanor
    C: Class 6 Felony
    D: Petty Offense
  answer: B
  explanation: In South Dakota, a first-offense DUI is a Class 1 Misdemeanor, which
    can carry a penalty of up to one year in jail, a $2,000 fine, and a driver's license
    revocation of 30 days to one year.
- id: 111
  category: alcohol_drugs_health
  question: Under South Dakota's open container law, where is it legal to keep an
    unsealed or opened container of an alcoholic beverage in a motor vehicle?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In the trunk or an area not normally occupied by the driver or passengers
    D: In a cup holder, as long as the driver is not drinking it
  answer: C
  explanation: South Dakota law prohibits having an open container of alcohol in the
    passenger area of a motor vehicle on a public highway. It must be kept in the
    trunk or an area not occupied by passengers (like behind the last upright seat
    in a vehicle without a trunk).
- id: 112
  category: alcohol_drugs_health
  question: 'For a driver age 21 or older, South Dakota law presumes they are under
    the influence of alcohol if their Blood Alcohol Content (BAC) is at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In South Dakota, the legal limit for BAC for drivers 21 and older is
    0.08%. Drivers can still be convicted of DUI with a lower BAC if their driving
    is impaired.
- id: 113
  category: alcohol_drugs_health
  question: If a driver is convicted of a second DUI offense in South Dakota within
    a 10-year period, what is the minimum period their license will be revoked?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: A second DUI conviction within 10 years in South Dakota results in
    a license revocation of not less than one year.
- id: 114
  category: alcohol_drugs_health
  question: In South Dakota, how many DUI convictions within a 10-year period result
    in the offense being elevated to a Class 6 Felony?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: A third DUI conviction within a 10-year period in South Dakota is a
    Class 6 Felony, carrying significantly harsher penalties including potential prison
    time.
- id: 115
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' when referring to driving safety in South
    Dakota?
  choices:
    A: The effect of mixing different types of alcohol
    B: The combined effect of alcohol and other drugs, which is greater than the sum
      of their parts
    C: The recovery time needed after a long trip
    D: The effect of high altitude on a driver's vision
  answer: B
  explanation: The synergistic effect occurs when alcohol is combined with other drugs
    (even prescription or over-the-counter meds), causing much greater impairment
    than either substance would alone.
- id: 116
  category: alcohol_drugs_health
  question: Which of the following factors does NOT affect an individual's Blood Alcohol
    Content (BAC) in South Dakota?
  choices:
    A: The person's body weight
    B: The amount of food in the stomach
    C: The type of alcoholic beverage (e.g., beer vs. vodka)
    D: The person's physical fitness or muscle mass
  answer: C
  explanation: BAC is determined by the amount of alcohol consumed, the time spent
    drinking, and body weight. While different beverages have different concentrations,
    'one drink' (12oz beer, 5oz wine, 1.5oz shot) contains roughly the same amount
    of alcohol.
- id: 117
  category: alcohol_drugs_health
  question: 'Under South Dakota''s Zero Tolerance law, a driver under 21 who is convicted
    of driving with a BAC of 0.02% or higher for the first time will lose their driving
    privileges for:'
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 6 months
  answer: B
  explanation: A first-offense Zero Tolerance violation (BAC 0.02% or higher for those
    under 21) results in a 30-day license loss.
- id: 118
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and a doctor has not warned you
    about driving, what is your responsibility in South Dakota?
  choices:
    A: You can drive as long as you feel fine
    B: You are legally exempt from DUI laws if the drug is prescribed
    C: You must check the label for warnings or ask a pharmacist about side effects
      before driving
    D: You should only drive during daylight hours
  answer: C
  explanation: Drivers are responsible for knowing the effects of any medication they
    take. Many prescription and over-the-counter drugs can cause drowsiness or impairment,
    making it illegal to drive.
- id: 119
  category: alcohol_drugs_health
  question: When calculating the number of prior DUI offenses for sentencing in South
    Dakota, what is the 'lookback period'?
  choices:
    A: 3 years
    B: 5 years
    C: 10 years
    D: The driver's entire lifetime
  answer: C
  explanation: South Dakota uses a 10-year lookback period to determine if a DUI is
    a subsequent offense (2nd, 3rd, etc.).
- id: 120
  category: alcohol_drugs_health
  question: 'In South Dakota, a person operating a commercial motor vehicle is considered
    to be under the influence if their BAC is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Federal and South Dakota state laws set a stricter BAC limit of 0.04%
    for drivers operating commercial motor vehicles.
- id: 121
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your Blood Alcohol Content (BAC)
    before driving in South Dakota?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Giving your body time to process the alcohol
    D: Exercising vigorously
  answer: C
  explanation: Only time can sober a person up. The body processes alcohol at a steady
    rate (roughly one drink per hour), and methods like coffee or cold showers do
    not speed up this process.
- id: 122
  category: alcohol_drugs_health
  question: 'If you are feeling fatigued or drowsy while driving on a South Dakota
    highway, the safest course of action is to:'
  choices:
    A: Turn up the radio and open the windows
    B: Drink a high-caffeine energy drink
    C: Pull over at a safe rest area or exit and take a nap
    D: Speed up to reach your destination faster
  answer: C
  explanation: Fatigue impairs reaction time and judgment similarly to alcohol. The
    only safe solution for drowsiness is sleep; temporary fixes like caffeine or cold
    air are not reliable.
- id: 123
  category: alcohol_drugs_health
  question: Under South Dakota's Implied Consent law, what types of chemical tests
    may a law enforcement officer request to determine your BAC or drug content?
  choices:
    A: Breath tests only
    B: Blood tests only
    C: Breath, blood, or urine tests
    D: Only a field sobriety coordination test
  answer: C
  explanation: Implied Consent means that by driving in South Dakota, you have consented
    to chemical testing of your breath, blood, or urine if an officer has probable
    cause to believe you are driving under the influence.
- id: 124
  category: alcohol_drugs_health
  question: For a driver operating a commercial motor vehicle in South Dakota, what
    is the maximum legal Blood Alcohol Content (BAC) allowed?
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.08%
    D: 0.00%
  answer: B
  explanation: Under South Dakota and federal regulations, the BAC limit for commercial
    drivers is 0.04%. If a CDL holder is found at or above this level, they are subject
    to disqualification.
- id: 125
  category: alcohol_drugs_health
  question: What is the effect of 'synergism' when a driver combines alcohol with
    other drugs?
  choices:
    A: The effects of each cancel each other out
    B: The effects are increased more than the sum of the two separate effects
    C: There is no change in the driver's impairment level
    D: The driver becomes more alert and focused
  answer: B
  explanation: Synergism occurs when alcohol and drugs (even prescription or over-the-counter)
    are mixed, resulting in a much higher level of impairment than either substance
    would cause alone.
- id: 126
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and it impairs your driving ability
    in South Dakota, can you be charged with a DUI?
  choices:
    A: No, as long as you have a valid prescription
    B: No, because DUI only applies to alcohol and illegal drugs
    C: Yes, it is illegal to drive under the influence of any substance that impairs
      your ability
    D: Only if your BAC is also over 0.08%
  answer: C
  explanation: South Dakota law (SDCL 32-23-1) applies to alcohol, marijuana, any
    controlled drug or substance, or any 'intoxicating substance' that renders a person
    incapable of safely driving.
- id: 127
  category: alcohol_drugs_health
  question: 'In South Dakota, if a driver under the age of 21 is convicted of a first-offense
    ''Zero Tolerance'' violation (BAC 0.02% or higher), their license will be revoked
    for at least:'
  choices:
    A: 10 days
    B: 30 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: For a first violation of South Dakota's Zero Tolerance law (under 21
    with a BAC of 0.02% to 0.08%), the driver's license is revoked for 30 days. If
    the BAC is 0.08% or higher, standard DUI penalties apply.
- id: 128
  category: alcohol_drugs_health
  question: How long does a second DUI conviction within a 10-year period typically
    result in license revocation in South Dakota?
  choices:
    A: 60 days
    B: 6 months
    C: At least 1 year
    D: Permanent revocation
  answer: C
  explanation: A second DUI conviction within 10 years in South Dakota results in
    a license revocation of not less than one year.
- id: 129
  category: alcohol_drugs_health
  question: 'In South Dakota, if you are involved in a crash and a law enforcement
    officer has probable cause to believe you were driving under the influence, they
    may:'
  choices:
    A: Only test you if you are unconscious
    B: Require you to submit to a chemical test of your breath, blood, or urine
    C: Only test you if you are over 21
    D: Not test you unless you are formally arrested first
  answer: B
  explanation: Under South Dakota's Implied Consent laws, if an officer has probable
    cause to believe a driver is under the influence, the driver is deemed to have
    given consent to a chemical test.
- id: 130
  category: alcohol_drugs_health
  question: If you have a medical condition such as epilepsy or diabetes that may
    affect your ability to drive safely, what are you required to do in South Dakota?
  choices:
    A: Nothing, medical history is private
    B: Report the condition to the Driver Licensing Program when applying for or renewing
      a license
    C: Only drive during daylight hours
    D: Always have a passenger with you
  answer: B
  explanation: South Dakota requires drivers to disclose physical or mental conditions
    that may impair their ability to drive. The state may require a medical statement
    from a physician before issuing a license.
- id: 131
  category: alcohol_drugs_health
  question: What happens to a South Dakota driver who is convicted of a third DUI
    offense within 10 years?
  choices:
    A: It is still a misdemeanor
    B: It becomes a Class 6 Felony
    C: The license is revoked for 30 days
    D: They are only required to pay a fine
  answer: B
  explanation: In South Dakota, a third DUI conviction within a 10-year period is
    a Class 6 Felony, which carries more severe penalties, including potential prison
    time and longer license revocation.
- id: 132
  category: alcohol_drugs_health
  question: Which of the following is a symptom of driving while fatigued, which can
    be as dangerous as driving under the influence?
  choices:
    A: Increased reaction time
    B: Difficulty focusing or frequent blinking
    C: Improved peripheral vision
    D: Heightened awareness of surroundings
  answer: B
  explanation: Fatigue causes symptoms like difficulty focusing, drifting from lanes,
    and frequent blinking. It significantly impairs judgment and reaction time, similar
    to alcohol.
- id: 133
  category: alcohol_drugs_health
  question: In South Dakota, can a driver be convicted of a DUI if their BAC is below
    0.08%?
  choices:
    A: No, 0.08% is the absolute minimum for a conviction
    B: Yes, if the state can prove the driver was 'under the influence' and their
      driving was impaired
    C: Only if the driver is under 18
    D: Only if there was a passenger in the car
  answer: B
  explanation: While 0.08% is the 'per se' limit, a person can still be convicted
    of DUI in South Dakota if other evidence (driving behavior, field sobriety tests)
    proves they were under the influence to a degree that rendered them incapable
    of safe driving.
- id: 134
  category: penalties_and_points
  question: How many points are assessed against a South Dakota driver's license for
    a standard speeding violation?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: South Dakota does not use a point system
  answer: D
  explanation: Unlike many other states, South Dakota does not use a point system
    to track traffic violations. Instead, the state monitors the number and severity
    of convictions on a driving record.
- id: 135
  category: penalties_and_points
  question: What is the minimum period of driver's license revocation for a first-offense
    DUI conviction in South Dakota?
  choices:
    A: 10 days
    B: 30 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: For a first DUI conviction, the court must revoke the person's driving
    privilege for a period of not less than 30 days and not more than one year.
- id: 136
  category: penalties_and_points
  question: What is the fine for a first-time violation of South Dakota's law prohibiting
    texting while driving?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Texting while driving is a primary offense in South Dakota and carries
    a fine of $100.
- id: 137
  category: penalties_and_points
  question: To reinstate a driver's license after it has been revoked for a DUI conviction
    in South Dakota, what is the required reinstatement fee?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: According to South Dakota Codified Law 32-12-47.1, the fee for reinstatement
    of a license revoked for a DUI or drug-related offense is $200.
- id: 138
  category: penalties_and_points
  question: 'In South Dakota, if you are convicted of passing a school bus that has
    its red signal lights flashing and stop arm extended, you may face:'
  choices:
    A: A fine only
    B: A Class 2 Misdemeanor conviction
    C: Automatic permanent license revocation
    D: A Class 1 Felony
  answer: B
  explanation: Passing a school bus with red lights flashing is a Class 2 Misdemeanor
    in South Dakota, which can result in fines and jail time.
- id: 139
  category: penalties_and_points
  question: 'A South Dakota driver can have their license suspended for non-driving
    reasons, such as failing to pay:'
  choices:
    A: Property taxes
    B: Library fines
    C: Child support
    D: Credit card debt
  answer: C
  explanation: South Dakota law allows for the suspension of a driver's license if
    the individual is significantly behind on child support payments.
- id: 140
  category: penalties_and_points
  question: What is the penalty for a driver who fails to yield the right-of-way to
    an emergency vehicle (Move Over Law) in South Dakota?
  choices:
    A: A warning for the first offense
    B: A Class 2 Misdemeanor
    C: A Class 1 Misdemeanor
    D: Mandatory 1-year license suspension
  answer: B
  explanation: Violating South Dakota's 'Move Over' law, which requires drivers to
    vacate the lane closest to stationary emergency or service vehicles, is a Class
    2 Misdemeanor.
- id: 141
  category: penalties_and_points
  question: In South Dakota, an 'Open Container' violation refers to having an unsealed
    alcoholic beverage in which part of the vehicle?
  choices:
    A: The trunk only
    B: The passenger area of the motor vehicle on a public highway
    C: The bed of a pickup truck only
    D: Behind the last upright seat of a hatchback
  answer: B
  explanation: It is illegal to have an open alcoholic beverage container in the passenger
    area of any motor vehicle located on a public highway in South Dakota.
- id: 142
  category: penalties_and_points
  question: 'If a South Dakota driver is convicted of ''Eluding'' a law enforcement
    officer, their license will be revoked for at least:'
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 5 years
  answer: C
  explanation: A conviction for eluding a police officer in South Dakota results in
    a mandatory license revocation for a period of one year.
- id: 143
  category: penalties_and_points
  question: What happens if a South Dakota driver is caught operating a vehicle without
    the required liability insurance?
  choices:
    A: The vehicle is immediately impounded and crushed
    B: A Class 2 Misdemeanor and potential license suspension
    C: No penalty if it's the first time
    D: A $5 fine
  answer: B
  explanation: Driving without insurance in South Dakota is a Class 2 Misdemeanor.
    Conviction results in a driver's license suspension for a period of 30 days to
    one year and requires filing proof of financial responsibility (SR-22) for three
    years.
- id: 144
  category: penalties_and_points
  question: 'If your South Dakota license is suspended or revoked, you must:'
  choices:
    A: Keep the license until it expires
    B: Destroy the license yourself
    C: Surrender the license to the Department of Public Safety
    D: Give the license to your insurance agent
  answer: C
  explanation: When a license is suspended or revoked, the driver is required by law
    to surrender the physical license to the South Dakota Department of Public Safety.
- id: 145
  category: penalties_and_points
  question: Under South Dakota's habitual offender laws, the Secretary of Public Safety
    may suspend the license of any driver who has been convicted of how many moving
    violations within a single year?
  choices:
    A: 3 or more
    B: 5 or more
    C: 10 or more
    D: 15 or more
  answer: C
  explanation: South Dakota law (SDCL 32-12-49) allows for the suspension of a license
    for a driver who is a 'habitual violator,' defined as having 10 or more moving
    violations in one year.
- id: 146
  category: penalties_and_points
  question: 'A South Dakota driver convicted of a second DUI offense within 10 years
    faces a mandatory license revocation of at least:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 3 years
  answer: C
  explanation: A second DUI conviction within a 10-year period in South Dakota results
    in a license revocation of not less than one year.
- id: 147
  category: penalties_and_points
  question: If a driver is required to file an SR-22 (Proof of Financial Responsibility)
    following a DUI conviction, how long must they maintain this filing in South Dakota?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers convicted of DUI or other major offenses in South Dakota are
    typically required to maintain SR-22 insurance filings for a period of 3 years.
- id: 148
  category: penalties_and_points
  question: 'Violating South Dakota''s ''Move Over'' law (failing to vacate the lane
    closest to a stopped emergency vehicle with lights flashing) is classified as
    a:'
  choices:
    A: Petty offense
    B: Class 2 misdemeanor
    C: Class 1 misdemeanor
    D: Class 6 felony
  answer: B
  explanation: Failing to move over or slow down for stopped emergency, service, or
    highway patrol vehicles is a Class 2 misdemeanor in South Dakota.
- id: 149
  category: penalties_and_points
  question: 'If a Restricted Minor''s Permit holder is convicted of a SECOND moving
    violation, their driving privileges will be suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: Until they turn 18
  answer: C
  explanation: Under South Dakota's GDL laws, a first moving violation results in
    a 30-day suspension, and a second moving violation results in a 180-day suspension.
- id: 150
  category: penalties_and_points
  question: 'In South Dakota, a Class 1 Misdemeanor (such as a first-offense DUI or
    Eluding) carries a maximum penalty of:'
  choices:
    A: 30 days in jail and a $500 fine
    B: 6 months in jail and a $1,000 fine
    C: 1 year in jail and a $2,000 fine
    D: 2 years in jail and a $4,000 fine
  answer: C
  explanation: A Class 1 misdemeanor in South Dakota is punishable by up to one year
    in the county jail, a fine of $2,000, or both.
- id: 151
  category: penalties_and_points
  question: 'In South Dakota, ''Drag Racing'' on a public highway is a Class 2 misdemeanor.
    A conviction for this offense also results in:'
  choices:
    A: Mandatory vehicle impoundment for 90 days
    B: A $5,000 fine
    C: License revocation
    D: A requirement to retake the driving test every year
  answer: C
  explanation: A conviction for drag racing on South Dakota public roads results in
    the revocation of the driver's license.
- id: 152
  category: sharing_the_road
  question: In South Dakota, when a school bus is stopped with its red lights flashing
    and stop arm extended on a two-lane road, who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching the bus from the front
    C: Traffic from both directions
    D: No one, if the speed limit is over 45 mph
  answer: C
  explanation: According to South Dakota law (SDCL 32-32-6), drivers approaching from
    any direction must stop for a school bus displaying flashing red lights and an
    extended stop arm, unless the bus is on a different roadway of a divided highway.
- id: 153
  category: sharing_the_road
  question: When driving on a South Dakota highway with at least two lanes in the
    same direction, what must you do when approaching a stationary emergency vehicle
    with its lights flashing?
  choices:
    A: Maintain speed but honk to alert the officer
    B: Move into a lane not adjacent to the vehicle if safe to do so
    C: Stop immediately in your current lane
    D: Speed up to pass the vehicle quickly
  answer: B
  explanation: South Dakota's 'Move Over Law' requires drivers to move into a lane
    not adjacent to the stopped emergency or service vehicle if there are two or more
    lanes available in that direction and it is safe to do so.
- id: 154
  category: sharing_the_road
  question: When passing a bicycle in South Dakota, what is the minimum legal distance
    a motorist must maintain between their vehicle and the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: South Dakota law (SDCL 32-26-26.1) requires the driver of a motor vehicle
    overtaking a bicycle to leave a safe distance of at least three feet between the
    vehicle and the bicycle.
- id: 155
  category: sharing_the_road
  question: In South Dakota, who is legally required to wear a safety helmet when
    operating or riding on a motorcycle?
  choices:
    A: All riders regardless of age
    B: Only the operator, not the passenger
    C: Only persons under the age of 18
    D: No one is required to wear a helmet in South Dakota
  answer: C
  explanation: Under South Dakota law (SDCL 32-20-4), it is unlawful for any person
    under the age of 18 to operate or ride upon a motorcycle unless they are wearing
    a federally approved safety helmet.
- id: 156
  category: sharing_the_road
  question: When a school bus is stopped on a highway with four or more lanes and
    a median or barrier separating the directions of traffic, which vehicles must
    stop?
  choices:
    A: All vehicles in all lanes
    B: Only vehicles traveling in the same direction as the bus
    C: Only vehicles in the lanes furthest from the bus
    D: No vehicles are required to stop on a four-lane road
  answer: B
  explanation: On a divided highway with a physical barrier or median, only traffic
    following the bus (traveling in the same direction) is required to stop in South
    Dakota.
- id: 157
  category: sharing_the_road
  question: What does a 'Slow Moving Vehicle' emblem look like in South Dakota?
  choices:
    A: A blue circle with a white border
    B: A triangular orange sign with a red reflective border
    C: A square yellow sign with black lettering
    D: A green diamond-shaped sign
  answer: B
  explanation: Slow-moving vehicles, such as farm machinery or horse-drawn carriages,
    must display a triangular orange emblem with a red reflective border when traveling
    on public roads.
- id: 158
  category: sharing_the_road
  question: In South Dakota, what is the maximum speed a vehicle can be traveling
    to be legally classified as a 'Slow Moving Vehicle' and required to display the
    emblem?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The slow-moving vehicle emblem is required for vehicles designed for
    or traveling at speeds of 25 mph or less.
- id: 159
  category: sharing_the_road
  question: 'When following a large truck, if you cannot see the truck driver''s face
    in their side-view mirrors, you are:'
  choices:
    A: In a good position to pass
    B: In the truck's 'No-Zone' (blind spot)
    C: Following at a safe distance
    D: Required to turn on your high beams
  answer: B
  explanation: Large trucks have significant blind spots called 'No-Zones.' If you
    cannot see the driver's face in their side mirror, they cannot see you, and you
    are in a dangerous position.
- id: 160
  category: sharing_the_road
  question: In South Dakota, what must a driver do when approaching a pedestrian carrying
    a white cane or using a guide dog?
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Wait for the pedestrian to wave you through
    D: Drive around them if there is enough room in the lane
  answer: B
  explanation: South Dakota law requires drivers to yield the right-of-way to blind
    or visually impaired pedestrians using a guide dog or carrying a white cane.
- id: 161
  category: sharing_the_road
  question: 'Under South Dakota law, a person riding a bicycle on a roadway has:'
  choices:
    A: No legal rights to the road
    B: The same rights and responsibilities as a motor vehicle driver
    C: The right-of-way at all times over cars
    D: The requirement to ride only on sidewalks
  answer: B
  explanation: Bicyclists have the same rights and are subject to the same duties
    as the drivers of motor vehicles in South Dakota, including obeying traffic signs
    and signals.
- id: 162
  category: sharing_the_road
  question: In South Dakota, what is the minimum distance you should maintain when
    following an emergency vehicle that has its lights and sirens activated?
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Drivers are generally prohibited from following a fire apparatus or
    other emergency vehicle responding to an alarm closer than 500 feet.
- id: 163
  category: sharing_the_road
  question: What is the South Dakota law regarding 'lane splitting' for motorcycles
    (riding between rows of stopped or moving vehicles)?
  choices:
    A: It is legal at speeds under 15 mph
    B: It is legal only on interstate highways
    C: It is illegal in South Dakota
    D: It is legal if the motorcyclist is wearing a helmet
  answer: C
  explanation: In South Dakota, motorcycles are entitled to the full use of a lane,
    and 'lane splitting' or 'filtering' between lanes of traffic is prohibited.
- id: 164
  category: sharing_the_road
  question: 'When a funeral procession is using flashing lights and following a lead
    vehicle, South Dakota drivers should:'
  choices:
    A: Yield the right-of-way to the entire procession
    B: Only yield to the first vehicle
    C: Pass the procession on the right
    D: Interject themselves into the line of vehicles
  answer: A
  explanation: South Dakota law (SDCL 32-26-46) requires drivers to yield the right-of-way
    to funeral processions. You should not drive between the vehicles of a procession
    or pass them unless directed by a police officer.
- id: 165
  category: sharing_the_road
  question: 'In South Dakota, if you see a vehicle with a flashing BLUE light (not
    red or amber), it most likely belongs to:'
  choices:
    A: A police officer
    B: A snow plow
    C: A volunteer firefighter or rescue squad member
    D: A wide-load escort vehicle
  answer: C
  explanation: South Dakota law (SDCL 32-17-42) allows volunteer firefighters and
    ambulance personnel to use blue lights on their private vehicles when responding
    to an emergency. Drivers should yield to these vehicles as a courtesy.
- id: 166
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the driver may:'
  choices:
    A: Turn from the left lane to avoid the curb
    B: Swing wide to the left before turning right
    C: Stop in the middle of the intersection
    D: Turn only from the sidewalk
  answer: B
  explanation: Large trucks often need to swing wide to the left to clear the curb
    when making a right turn. Drivers should never try to squeeze between a truck
    and the curb when the truck is turning right.
- id: 167
  category: sharing_the_road
  question: Under South Dakota's 'Move Over' law, what must you do when approaching
    a stationary authorized emergency vehicle displaying flashing lights?
  choices:
    A: Stop completely until the vehicle moves
    B: Move to a lane not adjacent to the vehicle if possible, or slow down significantly
    C: Maintain speed but honk to alert the emergency workers
    D: Speed up to pass the area as quickly as possible
  answer: B
  explanation: SD Law 32-30-6.1 requires drivers to move into a lane not adjacent
    to the stationary emergency vehicle if on a multi-lane highway, or to slow down
    and proceed with caution if a lane change is not possible or safe.
- id: 168
  category: sharing_the_road
  question: In South Dakota, which of the following is true regarding a motorcycle's
    right to a traffic lane?
  choices:
    A: Motorcycles must share a lane with cars to save space
    B: Motorcycles are entitled to the full width of a traffic lane
    C: Motorcycles must always ride on the shoulder
    D: Cars may pass a motorcycle in the same lane if there is room
  answer: B
  explanation: Motorcycles are entitled to the full width of a lane. Motorists should
    never attempt to share a lane with a motorcycle.
- id: 169
  category: sharing_the_road
  question: When following a motorcycle in South Dakota, why should you allow for
    a larger following distance (at least 4 seconds)?
  choices:
    A: Motorcycles have much longer stopping distances than cars
    B: Motorcycles are more likely to be affected by road hazards like potholes or
      gravel
    C: Motorcycles are required by law to be followed by 100 feet
    D: Motorcycles do not have brake lights
  answer: B
  explanation: A larger following distance is necessary because motorcycles can stop
    more quickly than other vehicles and are more susceptible to losing control due
    to road surface conditions.
- id: 170
  category: sharing_the_road
  question: What does a 'No-Zone' refer to when sharing the road with large trucks?
  choices:
    A: Areas where trucks are not allowed to drive
    B: Blind spots around the truck where your car can disappear from the driver's
      view
    C: The area directly in front of a truck where it cannot speed up
    D: Parking zones reserved for commercial vehicles only
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots located at the front,
    rear, and sides of a truck where the truck driver cannot see other vehicles.
- id: 171
  category: sharing_the_road
  question: In South Dakota, what must you do when a pedestrian is crossing the street
    guided by a service animal or carrying a white cane?
  choices:
    A: Honk your horn to let them know you are there
    B: Yield the right-of-way and take extra precautions
    C: Drive around them if there is an open lane
    D: Only stop if they are in a marked crosswalk
  answer: B
  explanation: South Dakota law requires drivers to yield the right-of-way to blind
    or visually impaired pedestrians using a service animal or a white cane.
- id: 172
  category: sharing_the_road
  question: When a funeral procession is using flashing emergency lights and following
    an escort vehicle, what is the rule for other drivers in South Dakota?
  choices:
    A: You may join the procession to get through traffic
    B: You must yield the right-of-way to the entire procession
    C: You should pass the procession on the right
    D: Only yield if the procession is at a stop sign
  answer: B
  explanation: Under SD Law 32-26-48, drivers of other vehicles must yield the right-of-way
    to any vehicle that is part of a funeral procession being led by a funeral escort
    vehicle.
- id: 173
  category: sharing_the_road
  question: In South Dakota, who has the right-of-way at an intersection with no marked
    crosswalks?
  choices:
    A: The motorist, because there is no marked crosswalk
    B: The pedestrian, as every intersection is considered an 'unmarked crosswalk'
    C: Whoever arrives at the intersection first
    D: The pedestrian, but only during daylight hours
  answer: B
  explanation: In South Dakota, pedestrians have the right-of-way at all intersections,
    whether the crosswalk is marked or unmarked.
- id: 174
  category: sharing_the_road
  question: 'When passing a bicyclist in South Dakota, you may cross the center line
    of a highway (even in a no-passing zone) if:'
  choices:
    A: The bicyclist waves you through
    B: It can be done safely and is necessary to maintain the 3-foot distance
    C: You are driving a commercial vehicle
    D: It is never legal to cross a double yellow line to pass a bicycle
  answer: B
  explanation: South Dakota law allows motorists to cross the center line, even in
    a no-passing zone, to provide the required 3-foot clearance for a bicyclist, provided
    it can be done safely.
- id: 175
  category: sharing_the_road
  question: If you are turning left and a bicyclist is approaching from the opposite
    direction, what should you do?
  choices:
    A: Turn quickly before the bicyclist reaches the intersection
    B: Wait for the bicyclist to pass before turning
    C: Honk to warn the bicyclist to stop
    D: Bicyclists must yield to all turning motor vehicles
  answer: B
  explanation: Bicyclists have the same rights and responsibilities as motor vehicle
    drivers. You must yield to oncoming bicyclists when turning left, just as you
    would for a car.
- id: 176
  category: vehicle_information
  question: According to South Dakota law, when are you required to turn on your headlights
    due to limited visibility?
  choices:
    A: When you cannot see clearly for a distance of 500 feet
    B: When you cannot see clearly for a distance of 200 feet
    C: Only when it is raining or snowing
    D: When you cannot see clearly for a distance of 1,000 feet
  answer: B
  explanation: In South Dakota, headlights must be used from sunset to sunrise and
    at any other time when you cannot see clearly for a distance of 200 feet.
- id: 177
  category: vehicle_information
  question: When following another vehicle in South Dakota, at what distance must
    you dim your high beam headlights?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: You must dim your high beams when following another vehicle within
    200 feet to avoid blinding the driver ahead through their mirrors.
- id: 178
  category: vehicle_information
  question: South Dakota law requires that a vehicle's foot brake must be capable
    of stopping the vehicle within how many feet when traveling at 20 mph on a dry,
    level road?
  choices:
    A: 15 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Under South Dakota equipment standards, the service (foot) brake must
    be able to stop the vehicle within 30 feet at a speed of 20 mph.
- id: 179
  category: vehicle_information
  question: 'Every motor vehicle in South Dakota must be equipped with a horn that
    can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: South Dakota law requires a horn in good working order capable of emitting
    sound audible under normal conditions from a distance of not less than 200 feet.
- id: 180
  category: vehicle_information
  question: South Dakota law requires that your vehicle's rearview mirror must allow
    you to see the highway for a distance of at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: All motor vehicles must have a mirror so located as to reflect to the
    driver a view of the highway for a distance of at least 200 feet to the rear.
- id: 181
  category: vehicle_information
  question: Between which dates are studded snow tires legally permitted on South
    Dakota highways?
  choices:
    A: November 1 to March 31
    B: October 1 to April 30
    C: September 1 to May 1
    D: December 1 to February 28
  answer: B
  explanation: In South Dakota, it is lawful to operate a motor vehicle with studded
    tires between October 1 and April 30.
- id: 182
  category: vehicle_information
  question: For a vehicle registered in South Dakota, what is the minimum light transmission
    percentage required for the front side windows?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: South Dakota law (SDCL 32-15-2.1) requires that front side windows
    allow at least 35% light transmission.
- id: 183
  category: vehicle_information
  question: Under South Dakota window tinting laws, what is the minimum light transmission
    required for the rear side windows and the back window?
  choices:
    A: 10%
    B: 20%
    C: 35%
    D: 50%
  answer: B
  explanation: South Dakota law requires that rear side windows and the back window
    allow at least 20% light transmission.
- id: 184
  category: vehicle_information
  question: 'In South Dakota, a ''Slow Moving Vehicle'' emblem must be displayed on
    the rear of any farm vehicle or machinery that normally travels at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The Slow Moving Vehicle (SMV) emblem is required on vehicles designed
    for use at speeds of 25 mph or less.
- id: 185
  category: vehicle_information
  question: What is the minimum legal tire tread depth for passenger vehicles in South
    Dakota?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe in South Dakota if the tread depth is less
    than 2/32 of an inch.
- id: 186
  category: vehicle_information
  question: 'South Dakota law requires the rear license plate to be illuminated so
    that it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The rear registration plate must be illuminated with a white light
    so that it is visible from a distance of 50 feet to the rear.
- id: 187
  category: vehicle_information
  question: Regarding vehicle exhaust systems, South Dakota law prohibits which of
    the following?
  choices:
    A: Mufflers with chrome tips
    B: Muffler cutouts or bypasses
    C: Dual exhaust systems
    D: Exhaust pipes that exit to the side
  answer: B
  explanation: South Dakota law requires every motor vehicle to have a muffler in
    good working order and prohibits the use of a muffler cutout, bypass, or similar
    device.
- id: 188
  category: vehicle_information
  question: 'In South Dakota, if your vehicle''s turn signals are used, they must
    be visible to other drivers in normal sunlight from a distance of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Turn signal lamps must be visible from a distance of not less than
    100 feet both to the front and the rear in normal sunlight.
- id: 189
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of a vehicle
    in South Dakota, a red flag or red light must be attached to the end of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: Whenever a load extends 4 feet or more beyond the bed or body of a
    vehicle, a red flag (at least 12 inches square) during the day or a red light
    at night must be displayed at the end of the load.
- id: 190
  category: vehicle_information
  question: According to the South Dakota Driver's Manual, when must your vehicle's
    headlights be turned on?
  choices:
    A: From one hour after sunset until one hour before sunrise
    B: From sunset to sunrise and whenever you cannot see clearly for 200 feet
    C: Only when it is raining, snowing, or foggy
    D: From 8:00 PM to 6:00 AM daily
  answer: B
  explanation: In South Dakota, headlights must be used from sunset to sunrise and
    at any other time when you cannot see clearly for a distance of 200 feet.
- id: 191
  category: vehicle_information
  question: 'In South Dakota, a motor vehicle must have at least one rearview mirror
    that provides a view of the highway to the rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: SDCL 32-15-8 requires a mirror located to reflect to the driver a view
    of the highway for a distance of at least 200 feet to the rear.
- id: 192
  category: vehicle_information
  question: According to South Dakota window tinting laws, the front side windows
    must allow at least what percentage of light to pass through?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: Under SDCL 32-9-7, the light transmission for the windshield and front
    side windows must be at least 35%.
- id: 193
  category: vehicle_information
  question: 'In South Dakota, a ''Slow Moving Vehicle'' emblem is required on vehicles
    designed to travel at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: SDCL 32-15-20 requires a slow-moving vehicle emblem on any farm machinery
    or other vehicle designed for operation at speeds of 25 miles per hour or less.
- id: 194
  category: vehicle_information
  question: 'Every motor vehicle in South Dakota must have at least one red tail lamp
    that is visible from a distance of:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: SDCL 32-17-8 specifies that tail lamps must exhibit a red light plainly
    visible from a distance of 1,000 feet to the rear.
- id: 195
  category: vehicle_information
  question: 'When using turn signals in South Dakota, the lamps must be visible from
    a distance of not less than:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: SDCL 32-17-18 requires that signal lamps used to indicate a turn must
    be visible from a distance of not less than 100 feet in normal sunlight.
- id: 196
  category: vehicle_information
  question: Which of the following is true regarding windshields in South Dakota?
  choices:
    A: You may place any stickers on the windshield as long as they are in the center
    B: Posters or signs are allowed if they are smaller than 5x7 inches
    C: No person may drive with any non-transparent material on the windshield that
      obstructs the driver's clear view
    D: Cracked windshields are legal if the crack is less than 12 inches long
  answer: C
  explanation: SDCL 32-15-5 prohibits driving with any sign, poster, or other nontransparent
    material upon the front windshield which obstructs the driver's clear view of
    the highway.
- id: 197
  category: vehicle_information
  question: Regarding vehicle emissions and inspections, which statement is true for
    South Dakota?
  choices:
    A: All vehicles must pass an annual smog check
    B: South Dakota does not currently require annual vehicle emissions testing
    C: Only vehicles in Sioux Falls and Rapid City require emissions testing
    D: Emissions testing is required every two years for vehicles older than 5 years
  answer: B
  explanation: South Dakota does not have a state-mandated vehicle emissions (smog)
    testing program for vehicle registration or renewal.
- id: 198
  category: signs_and_signals
  question: In South Dakota, a pennant-shaped sign (a sideways triangle) is used to
    indicate a 'No Passing Zone.' Where is this sign typically located?
  choices:
    A: On the right side of the road at the beginning of the zone
    B: On the left side of the road at the beginning of the zone
    C: Overhead above the center lane
    D: Only on the back of slow-moving vehicles
  answer: B
  explanation: In South Dakota, the pennant-shaped 'No Passing Zone' sign is unique
    because it is placed on the left side of the road to provide additional warning
    to drivers attempting to pass.
- id: 199
  category: signs_and_signals
  question: What does a flashing red light at an intersection mean in South Dakota?
  choices:
    A: Slow down and proceed with caution
    B: The signal is broken; yield to the right
    C: Stop completely and proceed only when it is safe to do so
    D: Stop and wait for the light to turn green
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop and yield the right-of-way to cross traffic before proceeding.
- id: 200
  category: signs_and_signals
  question: What is the standard speed limit on rural secondary highways in South
    Dakota unless otherwise posted?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: B
  explanation: The speed limit on rural state and federal highways in South Dakota
    is 65 mph unless signs indicate otherwise.
- id: 201
  category: signs_and_signals
  question: 'When you see a flashing yellow light at an intersection, you should:'
  choices:
    A: Stop and wait for a green light
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Treat it like a four-way stop
  answer: C
  explanation: A flashing yellow light is a warning to slow down and be especially
    alert as you move through the intersection.
- id: 202
  category: signs_and_signals
  question: In South Dakota, when are you permitted to turn left on a red light?
  choices:
    A: Never
    B: When turning from a one-way street onto another one-way street
    C: When turning from a two-way street onto a one-way street
    D: Anytime there is no oncoming traffic
  answer: B
  explanation: South Dakota law allows a left turn on red only when turning from a
    one-way street onto another one-way street, after coming to a complete stop and
    yielding to traffic and pedestrians.
- id: 203
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center line mean?
  choices:
    A: You are in a passing zone
    B: You may pass if the road ahead is clear
    C: You are not allowed to pass
    D: The road is narrowing
  answer: C
  explanation: A solid yellow line on your side of the center dash means you are in
    a no-passing zone and cannot legally pass other vehicles.
- id: 204
  category: signs_and_signals
  question: 'A diamond-shaped sign with an orange background indicates:'
  choices:
    A: A school zone
    B: A railroad crossing
    C: A construction or maintenance zone
    D: A regulatory speed limit
  answer: C
  explanation: Orange diamond-shaped signs are used specifically for construction,
    maintenance, or utility operations to warn drivers of workers or equipment ahead.
- id: 205
  category: signs_and_signals
  question: What does a pentagon-shaped sign (five sides) indicate?
  choices:
    A: A yield sign
    B: A school zone or school crossing
    C: A county road marker
    D: A no-passing zone
  answer: B
  explanation: A five-sided (pentagon) sign is used exclusively to warn drivers that
    they are approaching a school zone or a school crosswalk.
- id: 206
  category: signs_and_signals
  question: In South Dakota, what do double solid white lines painted on the pavement
    indicate?
  choices:
    A: You may cross them to change lanes
    B: They separate traffic moving in opposite directions
    C: Crossing the lines is prohibited
    D: They indicate a bicycle lane only
  answer: C
  explanation: Double solid white lines are used to separate lanes of traffic moving
    in the same direction where lane changing is prohibited.
- id: 207
  category: signs_and_signals
  question: 'A slow-moving vehicle emblem is a triangular sign that is:'
  choices:
    A: Solid red
    B: Fluorescent orange with a reflective red border
    C: Bright yellow with black letters
    D: White with a black 'X'
  answer: B
  explanation: The slow-moving vehicle emblem is a fluorescent orange triangle with
    a reflective red border, required on vehicles traveling 25 mph or less.
- id: 208
  category: signs_and_signals
  question: 'When approaching a railroad crossing with flashing red lights but no
    gates, you must:'
  choices:
    A: Slow down and look, but do not stop unless a train is visible
    B: Stop at least 15 feet from the nearest rail
    C: Speed up to cross before the train arrives
    D: Stop only if you hear a whistle
  answer: B
  explanation: In South Dakota, you must stop at least 15 feet (but no more than 50
    feet) from the nearest rail when flashing lights indicate an approaching train.
- id: 209
  category: signs_and_signals
  question: What is the hand signal to indicate that you are slowing down or stopping?
  choices:
    A: Left arm extended upward
    B: Left arm extended straight out
    C: Left arm extended downward
    D: Waving the hand back and forth
  answer: C
  explanation: To signal a stop or a decrease in speed using hand signals, extend
    the left arm out the window and point it downward.
- id: 210
  category: signs_and_signals
  question: In South Dakota, what does a flashing yellow traffic light signify?
  choices:
    A: Stop and wait for the light to turn green
    B: Proceed with caution
    C: Speed up to clear the intersection
    D: Treat it as a four-way stop
  answer: B
  explanation: According to the South Dakota Driver Manual, a flashing yellow light
    means you should proceed with caution and be alert.
- id: 211
  category: signs_and_signals
  question: 'A pennant-shaped sign found on the left side of the road in South Dakota
    indicates:'
  choices:
    A: A school zone
    B: A yield requirement
    C: A no-passing zone
    D: A railroad crossing
  answer: C
  explanation: The pennant-shaped sign is unique because it is placed on the left
    side of the road to mark the beginning of a no-passing zone.
- id: 212
  category: signs_and_signals
  question: 'When you see a ''Crossbuck'' sign at a railroad crossing in South Dakota,
    you should treat it the same as a:'
  choices:
    A: Stop sign
    B: Yield sign
    C: Speed limit sign
    D: Do Not Enter sign
  answer: B
  explanation: A crossbuck sign marks the location of a railroad crossing and should
    be treated as a yield sign; you must yield to any approaching trains.
- id: 213
  category: signs_and_signals
  question: If you are turning at an intersection and the signal is a steady yellow
    arrow, what should you do?
  choices:
    A: Increase speed to beat the red light
    B: The protected turning period is ending; prepare to stop
    C: Stop immediately in the middle of the intersection
    D: Continue turning; you have the right-of-way
  answer: B
  explanation: A steady yellow arrow means the 'protected' turning time is ending
    and the signal is about to turn red. You should prepare to stop if you have not
    entered the intersection.
- id: 214
  category: signs_and_signals
  question: What is the meaning of a pentagon-shaped traffic sign?
  choices:
    A: Yield right-of-way
    B: Railroad crossing ahead
    C: School zone or school crossing
    D: No passing zone
  answer: C
  explanation: A five-sided (pentagon) sign indicates that you are near a school and
    should watch for children.
- id: 215
  category: signs_and_signals
  question: 'To signal a right turn using hand signals, a South Dakota driver should:'
  choices:
    A: Extend the left arm straight out the window
    B: Extend the left arm out and point it upward
    C: Extend the left arm out and point it downward
    D: Extend the right arm straight out the window
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out the window
    and bent upward at the elbow.
- id: 216
  category: signs_and_signals
  question: 'A red circle with a white horizontal bar across the middle is a sign
    that means:'
  choices:
    A: Yield
    B: No Parking
    C: Do Not Enter
    D: Stop
  answer: C
  explanation: This is the standard 'Do Not Enter' sign, typically found at the exit
    ramps of highways or one-way streets.
- id: 217
  category: signs_and_signals
  question: What do diagonal yellow stripes painted on a fixed object in the road
    indicate?
  choices:
    A: An area where parking is allowed
    B: A pedestrian crosswalk
    C: An object that should be avoided
    D: A bus stop
  answer: C
  explanation: Diagonal stripes (often called 'chevron' or 'hazard' markings) on a
    fixed object indicate a hazard that drivers should avoid hitting.
- id: 218
  category: signs_and_signals
  question: 'In South Dakota, if you are at an intersection with a flashing red light,
    you must:'
  choices:
    A: Slow down and proceed if the way is clear
    B: Stop completely and proceed only when it is safe
    C: Wait for the light to turn green
    D: Yield only to traffic coming from the right
  answer: B
  explanation: 'A flashing red light must be treated the same as a stop sign: come
    to a complete stop and proceed when safe.'
- id: 219
  category: signs_and_signals
  question: What does a white diamond symbol painted on the pavement signify?
  choices:
    A: The lane is reserved for specific vehicles (like HOV or buses)
    B: A railroad crossing is ahead
    C: The lane is for emergency stopping only
    D: You are approaching a school zone
  answer: A
  explanation: A white diamond on the pavement indicates a restricted lane, such as
    a High Occupancy Vehicle (HOV) lane, bus lane, or bicycle lane.
- id: 220
  category: signs_and_signals
  question: 'When two vehicles reach an intersection with no signs or signals at the
    same time, South Dakota law requires:'
  choices:
    A: The vehicle on the left to yield to the vehicle on the right
    B: The vehicle on the right to yield to the vehicle on the left
    C: The smaller vehicle to yield to the larger vehicle
    D: The vehicle traveling faster to have the right-of-way
  answer: A
  explanation: At an uncontrolled intersection, the driver of the vehicle on the left
    must yield the right-of-way to the vehicle on the right.
- id: 221
  category: signs_and_signals
  question: 'To signal that you are slowing down or stopping using hand signals, you
    should:'
  choices:
    A: Extend the left arm straight out
    B: Extend the left arm upward
    C: Extend the left arm downward
    D: Wave your arm in a circular motion
  answer: C
  explanation: The hand signal for stopping or slowing down is the left arm extended
    out and pointing down toward the ground.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 222
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 223
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 224
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 225
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 226
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 227
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 228
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 229
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 230
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 231
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 232
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 233
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 234
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 235
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 236
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 237
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 238
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 239
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 240
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 241
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 242
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 243
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 244
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 245
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 246
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 247
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 248
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 249
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 250
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 251
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 252
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 253
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 254
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 255
