questions:
- id: 1
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor en una carretera interestatal con dos o más
    carriles en la misma dirección al acercarse a un vehículo detenido con luces de
    advertencia ámbar, amarillas o azules?
  choices:
    A: Detenerse inmediatamente y esperar a que el vehículo se mueva
    B: Incorporarse al carril más alejado del vehículo y proceder con precaución
    C: Mantener el carril y la velocidad actuales
    D: Acelerar para rebasar el vehículo lo más rápido posible
  answer: B
  explanation: Según el manual, los conductores en carreteras interestatales o autopistas
    con dos o más carriles que circulan en la misma dirección deben incorporarse al
    carril más alejado del vehículo detenido al menos 300 pies antes del vehículo
    y proceder con precaución.
- id: 2
  category: safe_driving_rules
  question: ¿A qué distancia antes de un vehículo detenido con luces de advertencia
    debe un conductor tomar medidas para incorporarse o reducir la velocidad?
  choices:
    A: Al menos 100 pies
    B: Al menos 200 pies
    C: Al menos 300 pies
    D: Al menos 500 pies
  answer: C
  explanation: El manual establece que los conductores deben tomar medidas (ya sea
    incorporándose en una autopista de varios carriles o reduciendo la velocidad en
    una carretera de dos carriles) al menos trescientos pies antes del vehículo detenido.
- id: 3
  category: safe_driving_rules
  question: En una carretera de dos carriles, ¿cuánto debe reducir su velocidad al
    acercarse a un vehículo detenido con luces de advertencia, si el límite de velocidad
    es superior a 20 mph?
  choices:
    A: 10 millas por hora menos que el límite de velocidad indicado
    B: 15 millas por hora menos que el límite de velocidad indicado
    C: 20 millas por hora menos que el límite de velocidad indicado
    D: 25 millas por hora menos que el límite de velocidad indicado
  answer: C
  explanation: En carreteras de dos carriles, los conductores deben reducir la velocidad
    a una velocidad que sea al menos veinte millas por hora menor que el límite de
    velocidad indicado al acercarse a un vehículo detenido con luces de advertencia.
- id: 4
  category: safe_driving_rules
  question: Si el límite de velocidad indicado es de 20 mph o menos, ¿a qué velocidad
    debe reducir al acercarse a un vehículo detenido con luces de advertencia en una
    carretera de dos carriles?
  choices:
    A: 15 millas por hora
    B: 10 millas por hora
    C: 5 millas por hora
    D: Debe detenerse por completo
  answer: C
  explanation: El manual especifica que los conductores deben reducir la velocidad
    a cinco millas por hora cuando el límite de velocidad indicado es de veinte millas
    por hora o menos.
- id: 5
  category: sharing_the_road
  question: La ley de Dakota del Sur exige que los conductores tomen medidas específicas
    al acercarse a vehículos detenidos que utilicen ¿qué colores de luces de advertencia?
  choices:
    A: Verde, blanco o púrpura
    B: Ámbar, amarillo o azul
    C: Rojo, blanco o azul
    D: Verde, amarillo o rojo
  answer: B
  explanation: La ley exige que los conductores que se acerquen a cualquier vehículo
    detenido que utilice luces de advertencia ámbar, amarillas o azules se incorporen
    o reduzcan la velocidad.
- id: 6
  category: sharing_the_road
  question: Según el texto, las reglas para acercarse a vehículos detenidos también
    se aplican a un vehículo de emergencia autorizado que utilice ¿qué color de señales
    visuales?
  choices:
    A: Verde
    B: Blanco
    C: Rojo
    D: Púrpura
  answer: C
  explanation: El manual establece que estas reglas se aplican a un vehículo de emergencia
    autorizado que utilice sus señales visuales rojas.
- id: 7
  category: driver_responsibility
  question: Según el Índice, ¿bajo qué encabezado principal encontraría información
    sobre 'Conducción agresiva' (Aggressive Driving)?
  choices:
    A: La licencia de conducir
    B: Estar en condiciones de conducir
    C: Antes de conducir
    D: Conducción básica
  answer: B
  explanation: El Índice enumera 'Conducción agresiva' bajo el encabezado principal
    'ESTAR EN CONDICIONES DE CONDUCIR' (BE IN SHAPE TO DRIVE).
- id: 8
  category: safe_driving_rules
  question: Según el Índice, ¿en qué página comienza la sección 'Leyes de seguridad
    para niños pasajeros' (Child Passenger Safety Laws)?
  choices:
    A: Página 15
    B: Página 20
    C: Página 23
    D: Página 25
  answer: C
  explanation: El Índice indica que las 'Leyes de seguridad para niños pasajeros'
    se encuentran en la página 23.
- id: 9
  category: vehicle_information
  question: ¿Cuál de los siguientes temas se encuentra bajo la sección 'Antes de conducir'
    (Before You Drive) en el Índice?
  choices:
    A: Ajustar sus espejos
    B: Cambiar de carril
    C: Señales de tráfico
    D: Visión
  answer: A
  explanation: El Índice enumera 'Ajustar sus espejos' bajo la sección 'ANTES DE CONDUCIR'
    (BEFORE YOU DRIVE).
- id: 10
  category: safe_driving_rules
  question: El tema 'Ceder el paso' (Yielding Right-of-Way) se encuentra bajo ¿qué
    sección principal del manual?
  choices:
    A: Conducción básica
    B: Reglas de la carretera
    C: Conducción general
    D: La licencia de conducir
  answer: B
  explanation: Según el Índice, 'Ceder el paso' es el primer tema que figura bajo
    la sección 'REGLAS DE LA CARRETERA' (RULES OF THE ROAD).
- id: 11
  category: vehicle_information
  question: ¿Cuál de los siguientes se enumera como un tema bajo 'Conducción Básica'
    (Basic Driving) en el Índice?
  choices:
    A: Retroceder
    B: Estacionamiento
    C: Intersecciones
    D: Planificación de viajes
  answer: A
  explanation: El Índice enumera 'Retroceder' (Backing Up) como un tema bajo la sección
    de 'CONDUCCIÓN BÁSICA'.
- id: 12
  category: defensive_driving
  question: En la sección de 'Conducción General' (General Driving) del Índice, ¿qué
    tema sigue inmediatamente después de 'Cambio de Carriles' (Changing Lanes)?
  choices:
    A: Estacionamiento
    B: Ajustarse al tráfico y conducción en carreteras interestatales
    C: Reglas para autobuses escolares
    D: Qué debe hacer un conductor durante una parada de cumplimiento de la ley
  answer: B
  explanation: En el Índice, bajo 'CONDUCCIÓN GENERAL', el tema 'Ajustarse al tráfico
    y conducción en carreteras interestatales' aparece inmediatamente después de 'Cambio
    de Carriles'.
- id: 13
  category: driver_responsibility
  question: Si necesita leer sobre 'Responsabilidad Financiera' (Financial Responsibility),
    ¿a qué página le dirige el Índice?
  choices:
    A: Página 12
    B: Página 13
    C: Página 14
    D: Página 15
  answer: C
  explanation: El Índice enumera 'Responsabilidad Financiera' en la página 14.
- id: 14
  category: alcohol_drugs_health
  question: ¿Dónde puede un conductor encontrar información sobre 'Alcohol, otras
    drogas y la conducción' según el Índice?
  choices:
    A: Conducción General
    B: Reglas de la carretera
    C: Estar en condiciones para conducir
    D: La licencia de conducir
  answer: C
  explanation: El Índice ubica 'Alcohol, otras drogas y la conducción' bajo el encabezado
    principal 'ESTAR EN CONDICIONES PARA CONDUCIR' (BE IN SHAPE TO DRIVE).
- id: 15
  category: safe_driving_rules
  question: ¿A qué Ley Codificada de Dakota del Sur se hace referencia en el texto
    con respecto a acercarse a vehículos detenidos con luces de advertencia?
  choices:
    A: Ley Codificada de Dakota del Sur 32-31-6.2
    B: Ley Codificada de Dakota del Sur 32-24-1
    C: Ley Codificada de Dakota del Sur 32-12-4
    D: Ley Codificada de Dakota del Sur 32-31-8.1
  answer: A
  explanation: El texto cita explícitamente la 'Ley Codificada de Dakota del Sur 32-31-6.2'
    al final de la sección que detalla las reglas para acercarse a vehículos detenidos
    con luces de advertencia.
- id: 16
  category: license_system
  question: Si tiene una licencia no comercial válida de otro estado, ¿cuántos días
    tiene para solicitar una licencia de conducir de Dakota del Sur después de establecer
    su residencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Si tiene una licencia no comercial válida de otro estado, debe solicitar
    una licencia de conducir de Dakota del Sur dentro de los 90 días posteriores a
    establecer su residencia en Dakota del Sur.
- id: 17
  category: license_system
  question: Si posee una Licencia de Conducir Comercial (CDL) de otro estado, ¿dentro
    de cuántos días debe solicitar una licencia de Dakota del Sur después de establecer
    su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si es titular de una CDL, debe solicitar una licencia de Dakota del
    Sur dentro de los 30 días posteriores a establecer su residencia en Dakota del
    Sur.
- id: 18
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener una licencia de conducir
    de Dakota del Sur?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: A
  explanation: Puede obtener una licencia de conducir si tiene al menos 14 años de
    edad y cumple con todos los demás requisitos.
- id: 19
  category: license_system
  question: Los no residentes pueden conducir en Dakota del Sur con una licencia de
    operador válida de su estado de origen si tienen al menos ¿qué edad?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: Los no residentes que tengan al menos 16 años de edad pueden conducir
    con una licencia de operador válida de su estado de origen.
- id: 20
  category: driver_responsibility
  question: 'Al operar un vehículo motorizado, la ley de Dakota del Sur exige que
    todo titular de una licencia debe:'
  choices:
    A: Mantener su licencia de conducir en la guantera
    B: Tener su licencia de conducir en su posesión inmediata
    C: Memorizar su número de licencia de conducir
    D: Mostrar su licencia de conducir en el tablero
  answer: B
  explanation: La ley de Dakota del Sur establece que todo titular de una licencia
    debe tener siempre su licencia de conducir en su posesión inmediata al operar
    un vehículo motorizado.
- id: 21
  category: license_system
  question: ¿Para menores de qué edad se requiere el consentimiento de los padres
    o tutores en cada solicitud de licencia de conducir completada?
  choices:
    A: '16'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: Puede obtener una licencia de conducir si cuenta con el consentimiento
    de sus padres o tutores si es menor de 18 años (obligatorio para cada solicitud
    completada).
- id: 22
  category: license_system
  question: ¿Cuál de las siguientes condiciones le impediría obtener una licencia
    de conducir de Dakota del Sur?
  choices:
    A: Tener multas de estacionamiento sin pagar
    B: Tener multas sin pagar por infracciones de tránsito en movimiento
    C: No ser propietario de un vehículo motorizado
    D: Ser residente de Dakota del Sur por menos de un año
  answer: B
  explanation: Para obtener una licencia de conducir, no debe tener multas sin pagar
    por infracciones de tránsito en movimiento.
- id: 23
  category: license_system
  question: Al presentar los documentos requeridos para una solicitud de licencia
    de conducir o tarjeta de identificación, ¿son aceptables las fotocopias?
  choices:
    A: Sí, si están ante notario
    B: Sí, solo para el comprobante de domicilio
    C: No, las fotocopias no son aceptables
    D: Sí, si están impresas a color
  answer: C
  explanation: El manual establece explícitamente en la sección de REQUISITOS DE DOCUMENTOS
    que las fotocopias no son aceptables.
- id: 24
  category: license_system
  question: Al renovar una licencia de conducir o tarjeta de identificación, debe
    presentar dos documentos que acrediten su dirección física en Dakota del Sur.
    ¿Qué antigüedad pueden tener estos documentos?
  choices:
    A: Menos de 30 días de antigüedad
    B: Menos de 6 meses de antigüedad
    C: Menos de un año de antigüedad
    D: Menos de dos años de antigüedad
  answer: C
  explanation: La renovación de una licencia de conducir o tarjeta de identificación
    requiere dos documentos que acrediten la dirección física en Dakota del Sur, los
    cuales deben tener menos de un año de antigüedad.
- id: 25
  category: license_system
  question: Al presentar un Acta de Nacimiento Certificada para una nueva licencia
    de conducir de Dakota del Sur, ¿cuál de los siguientes NO es aceptable?
  choices:
    A: Una copia certificada con el sello de la autoridad emisora
    B: Una copia certificada con el sello en relieve de la autoridad emisora
    C: Un certificado de nacimiento emitido por un hospital
    D: Una copia certificada emitida por un estado de los Estados Unidos
  answer: C
  explanation: El manual establece que una copia certificada de un Acta de Nacimiento
    debe tener el sello o el sello en relieve de la autoridad emisora, y que un certificado
    emitido por un hospital no es aceptable.
- id: 26
  category: license_system
  question: Si utiliza un Acta de Nacimiento Certificada emitida por Puerto Rico para
    obtener una nueva licencia de conducir, ¿debe estar certificada como emitida en
    qué fecha o después de ella?
  choices:
    A: 1 de julio de 2010
    B: 1 de enero de 2000
    C: 11 de septiembre de 2001
    D: 4 de julio de 1996
  answer: A
  explanation: Un Acta de Nacimiento Certificada emitida por Puerto Rico debe estar
    certificada como emitida el 1 de julio de 2010 o después de esa fecha.
- id: 27
  category: license_system
  question: Si su nombre ha cambiado con respecto a su licencia de conducir o tarjeta
    de identificación actual, ¿cuál de los siguientes documentos puede utilizarse
    para acreditar el cambio de nombre?
  choices:
    A: Una factura de servicios públicos
    B: Un certificado de nacimiento emitido por un hospital
    C: Un Certificado de Matrimonio
    D: Un formulario W-2
  answer: C
  explanation: Si su nombre ha cambiado, deberá presentar un comprobante del cambio
    de nombre, como un Certificado de Matrimonio, una Sentencia de Divorcio o una
    Orden Judicial.
- id: 28
  category: license_system
  question: Al reemplazar una licencia de conducir o tarjeta de identificación de
    Dakota del Sur, debe presentar un segundo documento que acredite su identidad.
    ¿Cuál de los siguientes es un segundo documento aceptable?
  choices:
    A: Una tarjeta de biblioteca
    B: Un formulario W-2
    C: Una tarjeta de crédito
    D: Una tarjeta de membresía de gimnasio
  answer: B
  explanation: Los segundos documentos aceptables para acreditar la identidad incluyen
    una tarjeta de seguro social, un formulario W-2, una identificación militar, una
    identificación tribal u otro documento aprobado por el examinador.
- id: 29
  category: license_system
  question: Si desea una licencia para conducir un vehículo motorizado comercial,
    ¿qué manual debe leer?
  choices:
    A: El Manual de Motocicletas
    B: El Manual de Licencia de Conducir Comercial (CDL)
    C: El Manual de la Patrulla de Caminos de Dakota del Sur
    D: El Manual Federal de Transportistas Motorizados
  answer: B
  explanation: Si desea una licencia para conducir un vehículo motorizado comercial,
    deberá leer el Manual de Licencia de Conducir Comercial (CDL).
- id: 30
  category: license_system
  question: ¿Qué debe hacer con su(s) licencia(s) de conducir o tarjeta(s) de identificación
    existente(s) al obtener una nueva licencia de conducir de Dakota del Sur?
  choices:
    A: Conservarlas como una forma secundaria de identificación
    B: Destruirlas usted mismo
    C: Entregarlas
    D: Enviarlas por correo a su estado de residencia anterior
  answer: C
  explanation: Para obtener una licencia de conducir, debe entregar todas las licencias
    de conducir o tarjetas de identificación existentes.
- id: 31
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para demostrar un cambio
    de nombre para una licencia de conducir de South Dakota?
  choices:
    A: Una fotocopia de un certificado de matrimonio
    B: Un certificado de matrimonio emitido por una iglesia o capilla
    C: Un certificado de matrimonio certificado con un sello en relieve
    D: Una copia enviada por fax de una orden judicial
  answer: C
  explanation: El manual establece que un certificado de matrimonio debe ser una copia
    certificada con el sello o el sello en relieve de la autoridad emisora. No se
    aceptan fotocopias, faxes ni certificados emitidos por iglesias.
- id: 32
  category: license_system
  question: ¿Qué documento NO figura como una prueba aceptable de su número de Seguro
    Social?
  choices:
    A: Formulario W-2
    B: Talón de pago
    C: Tarjeta de Seguro Social
    D: Una factura de servicios públicos
  answer: D
  explanation: Las pruebas aceptables de un número de Seguro Social incluyen una tarjeta
    de Seguro Social, el formulario W-2, los formularios 1099 y un talón de pago.
    Una factura de servicios públicos se utiliza para probar la dirección física,
    no el SSN.
- id: 33
  category: license_system
  question: 'Al proporcionar documentos para demostrar su dirección física en South
    Dakota, los documentos deben tener:'
  choices:
    A: Menos de 30 días de antigüedad
    B: Menos de 6 meses de antigüedad
    C: Menos de un año de antigüedad
    D: Menos de dos años de antigüedad
  answer: C
  explanation: El manual requiere dos documentos que demuestren la dirección física
    en South Dakota y que tengan menos de un año de antigüedad.
- id: 34
  category: license_system
  question: 'Si usted es un viajero a tiempo completo que utiliza una dirección de
    reenvío de correo de South Dakota, debe proporcionar un recibo que demuestre una
    estancia de una noche dentro del último año en un establecimiento de South Dakota
    de tipo:'
  choices:
    A: Hotel, motel, campamento o parque de casas rodantes (RV)
    B: Área de descanso o parque estatal
    C: Residencia de un amigo o familiar
    D: Complejo de apartamentos
  answer: A
  explanation: Los viajeros a tiempo completo deben proporcionar un recibo de un hotel/motel,
    campamento o parque de casas rodantes (RV) de South Dakota para demostrar una
    noche de estancia dentro del último año.
- id: 35
  category: license_system
  question: Para añadir la palabra 'Veteran' (Veterano) al frente de una licencia
    de conducir de South Dakota, ¿cuál de los siguientes documentos debe presentar
    un veterano licenciado con honores?
  choices:
    A: Un uniforme militar
    B: Un Formulario DD-214 que muestre el estado de baja honorable
    C: Una carta de un oficial al mando
    D: Una tarjeta de identificación militar vigente
  answer: B
  explanation: Los veteranos pueden añadir la palabra 'Veteran' a su licencia presentando
    un Formulario DD-214 que muestre el estado de baja honorable del servicio activo,
    entre otros formularios específicos.
- id: 36
  category: license_system
  question: ¿Los solicitantes masculinos de qué rango de edad deben declarar que se
    han registrado en el Servicio Selectivo al solicitar una licencia?
  choices:
    A: 16 a 18 años
    B: 18 a 21 años
    C: 18 a 25 años
    D: 21 a 30 años
  answer: C
  explanation: Cualquier solicitante masculino de 18 a 25 años debe declarar en su
    solicitud que se ha registrado en el Servicio Selectivo o autorizar al Departamento
    de Seguridad Pública a enviar su información.
- id: 37
  category: license_system
  question: ¿Cuál es el costo de una Licencia de Conducir Regular o un Permiso de
    Instrucción de South Dakota?
  choices:
    A: $15.00
    B: $28.00
    C: $33.00
    D: $90.00
  answer: B
  explanation: El costo de una Licencia de Conducir Regular o un Permiso de Instrucción
    (mejora, nueva, renovación o transferencia) es de $28.00.
- id: 38
  category: driver_testing
  question: Para fines de evaluación, ¿cuántos intentos para aprobar un examen le
    permite el pago de la tarifa de solicitud dentro de un período de 6 meses?
  choices:
    A: Un intento
    B: Dos intentos
    C: Tres intentos
    D: Intentos ilimitados
  answer: C
  explanation: Para fines de evaluación, la tarifa le permite tres intentos para aprobar
    un examen dentro de un período de 6 meses.
- id: 39
  category: license_system
  question: 'A una persona se le puede denegar una licencia de conducir regular de
    South Dakota si ha acumulado atrasos en la manutención de los hijos de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: Las personas que han acumulado atrasos en la manutención de los hijos
    por un monto de $1,000 o más no pueden obtener una licencia de conducir estándar
    de South Dakota, aunque pueden ser elegibles para una licencia temporal de 6 meses.
- id: 40
  category: license_system
  question: ¿Cuál es la edad mínima requerida para obtener un Permiso de Instrucción
    en South Dakota?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: A
  explanation: Para obtener un Permiso de Instrucción, debe tener al menos 14 años
    de edad y aprobar los exámenes de la vista y de conocimientos.
- id: 41
  category: driver_testing
  question: ¿Si un menor de 18 años completa con éxito un curso de educación vial
    aprobado, cuánto tiempo debe mantener continuamente su Permiso de Instrucción
    antes de actualizarlo?
  choices:
    A: 90 días
    B: 180 días
    C: 275 días
    D: 365 días
  answer: B
  explanation: Los menores deben mantener el permiso continuamente durante 275 días,
    pero este tiempo se reduce a 180 días si completan con éxito un curso de educación
    vial aprobado con una calificación del 80% o superior.
- id: 42
  category: safe_driving_rules
  question: ¿Cuántas horas de conducción supervisada por un adulto debe completar
    un conductor con un Permiso de Instrucción?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: El conductor debe completar 50 horas de conducción supervisada por
    un adulto con un Permiso de Instrucción, las cuales deben incluir 10 horas en
    condiciones climáticas adversas y 10 horas después del anochecer.
- id: 43
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto al uso de dispositivos de comunicación
    inalámbrica para los titulares de un Permiso de Instrucción?
  choices:
    A: Solo pueden usar dispositivos de manos libres.
    B: Pueden usarlos solo para navegación GPS.
    C: No pueden usar ningún tipo de dispositivo de comunicación inalámbrica mientras
      operan un vehículo motorizado.
    D: Pueden usarlos solo durante las horas del día.
  answer: C
  explanation: Los titulares de un Permiso de Instrucción no pueden utilizar ningún
    tipo de dispositivo de comunicación inalámbrica mientras operan un vehículo motorizado
    en vías públicas.
- id: 44
  category: license_system
  question: 'Para obtener un Permiso de Menor Restringido, el solicitante no debe
    haber sido condenado por una infracción de tráfico durante los:'
  choices:
    A: 3 meses anteriores a la solicitud
    B: 6 meses anteriores a la solicitud
    C: 12 meses anteriores a la solicitud
    D: 2 años anteriores a la solicitud
  answer: B
  explanation: Para obtener un Permiso de Menor Restringido, no debe haber sido condenado
    por una infracción de tráfico durante los seis meses anteriores a la solicitud.
- id: 45
  category: safe_driving_rules
  question: 'Para un titular de Permiso de Instrucción mayor de 18 años, el adulto
    supervisor sentado a su lado debe tener una licencia de conducir válida y al menos:'
  choices:
    A: 6 meses de experiencia en la conducción
    B: 1 año de experiencia en la conducción
    C: 3 años de experiencia en la conducción
    D: 5 años de experiencia en la conducción
  answer: B
  explanation: Para los titulares de un Permiso de Instrucción mayores de 18 años,
    el adulto supervisor debe tener una licencia de conducir válida y al menos un
    año de experiencia en la conducción.
- id: 46
  category: license_system
  question: ¿Cuál es el costo de un Permiso de Menor Restringido en Dakota del Sur?
  choices:
    A: $20.00
    B: $25.00
    C: $28.00
    D: $30.00
  answer: C
  explanation: Según el manual, el costo es de $28.00 por un Permiso de Menor Restringido.
- id: 47
  category: safe_driving_rules
  question: ¿En qué horario puede conducir el titular de un Permiso de Menor Restringido
    sin un padre o tutor legal en el vehículo, siempre que tenga permiso?
  choices:
    A: 5 a.m. a 9 p.m.
    B: 6 a.m. a 10 p.m.
    C: 7 a.m. a 8 p.m.
    D: 6 a.m. a 11 p.m.
  answer: B
  explanation: El permiso autoriza al titular a operar un vehículo motorizado durante
    el horario de 6 a.m. a 10 p.m. si el vehículo se opera con el permiso del padre
    o tutor legal del menor.
- id: 48
  category: license_system
  question: El titular de un Permiso de Menor Restringido puede conducir solo después
    de las 10 p.m. si está tomando la ruta más directa hacia o desde ¿cuál de los
    siguientes?
  choices:
    A: La casa de un amigo
    B: Un evento escolar
    C: Una tienda de comestibles
    D: Un parque recreativo
  answer: B
  explanation: Puede conducir solo después de las 10 p.m. si está tomando la ruta
    más directa y viaja hacia o desde la escuela o un evento escolar, la iglesia o
    un evento religioso, el trabajo o realizando labores agrícolas.
- id: 49
  category: driver_responsibility
  question: ¿Qué tipo de dispositivo de comunicación inalámbrica se le permite usar
    al titular de un Permiso de Menor Restringido mientras opera un vehículo motorizado
    en vías públicas?
  choices:
    A: Un teléfono celular de manos libres
    B: Un asistente digital personal solo para navegación
    C: Un dispositivo de mensajería de texto si está detenido en un semáforo en rojo
    D: No se permite ningún dispositivo de comunicación inalámbrica
  answer: D
  explanation: El titular de un Permiso de Menor Restringido no puede utilizar ningún
    tipo de dispositivo de comunicación inalámbrica mientras opera un vehículo motorizado
    en vías públicas.
- id: 50
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una restricción para el titular de un Permiso
    de Instrucción de Motocicleta?
  choices:
    A: Solo pueden conducir entre las 8 a.m. y las 5 p.m.
    B: Pueden llevar hasta un pasajero
    C: Deben estar acompañados por un conductor de motocicleta con licencia que tenga
      al menos 18 años y conduzca otra motocicleta
    D: Deben viajar en la misma motocicleta que su conductor supervisor
  answer: C
  explanation: El titular de un Permiso de Instrucción de Motocicleta puede operar
    una motocicleta... si está acompañado por un conductor con una licencia de motocicleta
    válida que tenga al menos dieciocho años de edad... y que esté conduciendo otra
    motocicleta junto con el titular del permiso.
- id: 51
  category: license_system
  question: Cuando obtiene un duplicado de la licencia de conducir, ¿qué sucede con
    la fecha de vencimiento?
  choices:
    A: Se extiende por 5 años a partir de la fecha de duplicación
    B: Conserva la fecha de vencimiento de la licencia original
    C: Vence un año después de la fecha de duplicación
    D: Vence en su próximo cumpleaños
  answer: B
  explanation: Cuando se obtiene un duplicado de la licencia, su licencia conservará
    la fecha de vencimiento de la licencia original.
- id: 52
  category: vehicle_information
  question: ¿Qué tipo de licencia se requiere para operar un ciclomotor (moped) en
    Dakota del Sur?
  choices:
    A: Una Licencia de Operador de Motocicleta
    B: Un Permiso Restringido para Ciclomotor
    C: Una Licencia de Operador válida
    D: No se requiere licencia
  answer: C
  explanation: 'Operadores de ciclomotores (moped): debe estar en posesión de una
    Licencia de Operador válida.'
- id: 53
  category: license_system
  question: ¿Cuándo vence una licencia de conducir emitida a una persona menor de
    21 años, si quedan cinco años o menos para su cumpleaños número 21?
  choices:
    A: En su cumpleaños número 21
    B: 30 días después de su cumpleaños número 21
    C: 90 días después de su cumpleaños número 21
    D: En su cumpleaños número 25
  answer: B
  explanation: Cualquier licencia de conducir o identificación de no conductor emitida
    a cualquier persona menor de 21 años a la que le queden cinco años o menos para
    cumplir 21 años, vencerá 30 días después de que la persona cumpla 21 años.
- id: 54
  category: driver_testing
  question: ¿Cuál de los siguientes está permitido en el vehículo durante el examen
    de habilidades de conducción en carretera?
  choices:
    A: Un padre o tutor legal
    B: Una mascota en una transportadora segura
    C: Únicamente el solicitante y el examinador
    D: Niños menores de 5 años
  answer: C
  explanation: No se permitirán mascotas ni pasajeros en el vehículo durante el examen
    de habilidades de conducción en carretera.
- id: 55
  category: driver_testing
  question: ¿Con cuántos días de antelación a su fecha de vencimiento se puede renovar
    generalmente una licencia de conducir de Dakota del Sur (a menos que el solicitante
    cumpla 21 años)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: Las licencias pueden renovarse 180 días antes de su fecha de vencimiento,
    a menos que el solicitante cumpla 21 años de edad al momento de la renovación.
- id: 56
  category: driver_testing
  question: Si actualmente posee una licencia de conducir válida de otro estado y
    solicita una licencia de Dakota del Sur, ¿qué exámenes se requieren generalmente?
  choices:
    A: Solo un examen de la vista
    B: Un examen de conocimientos y un examen de conducción
    C: No se requiere ningún examen a menos que tenga un endoso de materiales peligrosos
    D: Solo un examen de conducción
  answer: C
  explanation: Si actualmente posee una licencia de conducir válida de otro estado,
    no se requerirá ningún examen para la transferencia de esa licencia, a menos que
    tenga un endoso de materiales peligrosos.
- id: 57
  category: driver_testing
  question: ¿Cuál es la sanción si se descubre a un solicitante haciendo trampa en
    el examen de conocimientos?
  choices:
    A: Debe esperar hasta el siguiente día hábil para volver a examinarse
    B: Debe esperar un mínimo de dos semanas antes de volver a examinarse
    C: Debe esperar 6 meses antes de volver a examinarse
    D: Se le prohíbe permanentemente obtener una licencia
  answer: B
  explanation: Si se descubre a alguien haciendo trampa, no se le permitirá volver
    a examinarse al día siguiente y se le exigirá que espere un mínimo de dos semanas
    antes de que se le permita examinarse de nuevo.
- id: 58
  category: driver_testing
  question: ¿Cuántas oportunidades tiene para aprobar los exámenes de conducir por
    cada tarifa pagada dentro de un período de 6 meses?
  choices:
    A: 1 oportunidad
    B: 2 oportunidades
    C: 3 oportunidades
    D: Oportunidades ilimitadas
  answer: C
  explanation: Se le permiten 3 oportunidades para examinarse por cada tarifa pagada
    dentro de un período de 6 meses. Después de 3 reprobaciones, la tarifa debe pagarse
    nuevamente.
- id: 59
  category: license_system
  question: ¿Qué indica un código de restricción 'F' en una licencia de conducir de
    Dakota del Sur?
  choices:
    A: Se requieren lentes correctivos
    B: No conducir de noche
    C: Solo transmisión automática
    D: Se requiere espejo retrovisor exterior izquierdo
  answer: D
  explanation: Según la tabla de Restricciones de la Licencia de Conducir, el código
    de restricción 'F' significa 'Espejo retrovisor exterior izquierdo'.
- id: 60
  category: license_system
  question: ¿Qué código de restricción de la licencia de conducir significa 'No conducir
    de noche'?
  choices:
    A: Restricción R
    B: Restricción G
    C: Restricción I
    D: Restricción Y
  answer: B
  explanation: La tabla de Restricciones de la Licencia de Conducir enumera la 'G'
    como el código para 'No conducir de noche'.
- id: 61
  category: alcohol_drugs_health
  question: ¿Según el manual, a cuántas personas puede salvar o mejorar la vida un
    solo donante de órganos y tejidos?
  choices:
    A: Hasta 10 personas
    B: Hasta 25 personas
    C: Hasta 60 personas
    D: Hasta 100 personas
  answer: C
  explanation: Un solo donante de órganos y tejidos puede salvar o mejorar la vida
    de hasta 60 personas.
- id: 62
  category: alcohol_drugs_health
  question: ¿Quién es responsable de pagar los costos relacionados con la donación
    de órganos y tejidos?
  choices:
    A: La familia del donante
    B: El seguro de salud del donante
    C: El gobierno estatal
    D: La organización de obtención (procurement organization)
  answer: D
  explanation: Todos los costos relacionados con la donación son cubiertos por la
    organización de obtención, la cual traslada esos costos al centro de trasplante.
    No se generan cargos para el donante ni para su familia.
- id: 63
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar de Dakota
    del Sur?
  choices:
    A: 3 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: C
  explanation: Su licencia de conducir es válida por 5 años y vencerá en su cumpleaños
    o 30 días después de su cumpleaños si cumple 21 años.
- id: 64
  category: license_system
  question: ¿Con cuánta anticipación puede renovar su licencia de conducir antes de
    que venza (a menos que cumpla 21 años)?
  choices:
    A: Hasta 30 días antes
    B: Hasta 60 días antes
    C: Hasta 90 días antes
    D: Hasta 180 días antes
  answer: D
  explanation: Puede renovar la licencia en cualquier momento hasta 180 días antes
    de que venza (a menos que vaya a cumplir 21 años).
- id: 65
  category: driver_testing
  question: ¿Qué examen se requiere siempre al renovar su licencia de conducir de
    Dakota del Sur?
  choices:
    A: Un examen de manejo
    B: Un examen de conocimientos
    C: Un examen de la vista
    D: Un examen de audición
  answer: C
  explanation: Se le requerirá realizar un examen de la vista al renovar su licencia
    de conducir.
- id: 66
  category: driver_testing
  question: Si la licencia de conducir que entrega para la renovación está vencida,
    ¿qué examen adicional se requiere?
  choices:
    A: Un examen de manejo
    B: Un examen de conocimientos
    C: Un examen médico
    D: Un examen de reflejos
  answer: B
  explanation: Si la licencia de conducir que entrega está vencida, también se requerirá
    un examen de conocimientos.
- id: 67
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento por una primera revocación por
    DWI (conducir bajo la influencia)?
  choices:
    A: $50
    B: $75
    C: $125
    D: $175
  answer: B
  explanation: La tarifa de restablecimiento por un primer DWI es de $75.
- id: 68
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón por la que puede perder sus privilegios
    de conducir en Dakota del Sur?
  choices:
    A: Tener una deuda con una agencia gubernamental de Dakota del Sur que sume $1,000
      o más
    B: Recibir una sola multa de estacionamiento
    C: No renovar el registro de su vehículo en un plazo de 10 días
    D: Conducir a 5 mph por encima del límite de velocidad en una carretera interestatal
  answer: A
  explanation: Puede perder su licencia por tener deudas con una agencia gubernamental
    de Dakota del Sur que sumen un total de $1,000 o más.
- id: 69
  category: penalties_and_points
  question: ¿Qué exámenes se requieren para el restablecimiento después de una revocación
    de la licencia?
  choices:
    A: Solo un examen de la vista
    B: Solo un examen de manejo
    C: Exámenes de la vista y de conocimientos
    D: No se requieren exámenes
  answer: C
  explanation: Se requerirán exámenes de la vista y de conocimientos después de una
    revocación.
- id: 70
  category: penalties_and_points
  question: ¿Cuál es la tarifa estándar de restablecimiento después de una suspensión
    de la licencia?
  choices:
    A: $50
    B: $75
    C: $100
    D: $200
  answer: A
  explanation: Después de una suspensión, no se requerirán exámenes a menos que la
    licencia haya vencido. Se requerirá una tarifa de solicitud y una tarifa de restablecimiento
    de $50.
- id: 71
  category: license_system
  question: ¿Con qué frecuencia puede una persona elegible solicitar por correo o
    en línea el reemplazo y la renovación de su licencia de conducir?
  choices:
    A: Una vez cada 5 años
    B: Una vez en cualquier período de 10 años
    C: Dos veces en cualquier período de 10 años
    D: Veces ilimitadas
  answer: B
  explanation: Cualquier persona que sea elegible puede solicitar por correo o en
    línea un reemplazo y renovación una vez en cualquier período de diez años.
- id: 72
  category: vehicle_information
  question: ¿Cuántos días tiene para registrar un vehículo traído a Dakota del Sur
    desde otro estado?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Tiene 90 días para registrar un vehículo traído de otro estado.
- id: 73
  category: vehicle_information
  question: ¿Dónde debe guardar el Certificado de Título de su vehículo?
  choices:
    A: En la guantera del vehículo
    B: En un lugar seguro, no en el vehículo
    C: Adjunto al certificado de registro
    D: Exhibido en el tablero
  answer: B
  explanation: El Título debe guardarse en un lugar seguro, no en el vehículo. El
    certificado de registro debe llevarse siempre en el vehículo.
- id: 74
  category: penalties_and_points
  question: Bajo el Sistema de Puntos de Dakota del Sur, un conductor está sujeto
    a la suspensión de la licencia si acumula ¿cuántos puntos en cualquier período
    de 12 meses consecutivos?
  choices:
    A: 10 puntos
    B: 12 puntos
    C: 15 puntos
    D: 22 puntos
  answer: C
  explanation: Cualquier operador que acumule 15 puntos en cualquier período de 12
    meses consecutivos, o 22 puntos en cualquier período de 24 meses consecutivos,
    está sujeto a una suspensión de la licencia de conducir.
- id: 75
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones NO resultará en la asignación de
    puntos a su historial de conducción?
  choices:
    A: Exceso de velocidad
    B: No ceder el paso
    C: Rebase inadecuado
    D: Infracción de señal de alto
  answer: A
  explanation: No se asignarán puntos por exceso de velocidad, detención, estacionamiento,
    equipo, o infracciones de tamaño o peso.
- id: 76
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de conducción por una condena
    por Conducción Temeraria (Reckless Driving)?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: C
  explanation: De acuerdo con el Sistema de Puntos de Dakota del Sur, una condena
    por Conducción Temeraria resulta en 8 puntos.
- id: 77
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión para una primera suspensión bajo el
    sistema de puntos?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: El período de suspensión para una Primera Suspensión bajo el sistema
    de puntos es de 60 días.
- id: 78
  category: driver_testing
  question: Para calificar para una licencia de conducir sin restricciones, ¿cuál
    es la puntuación mínima de visión requerida con ambos ojos?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para calificar para una licencia de conducir sin restricciones, el
    solicitante debe obtener una puntuación de 20/40 o mejor con ambos ojos, pero
    no peor de 20/50 en cada ojo.
- id: 79
  category: defensive_driving
  question: Para prevenir la fatiga en un viaje largo, ¿con qué frecuencia debería
    planear detenerse?
  choices:
    A: Cada 50 millas o 1 hora
    B: Cada 100 millas o 2 horas
    C: Cada 150 millas o 3 horas
    D: Cada 200 millas o 4 horas
  answer: B
  explanation: Antes de un viaje, debe planear detenerse aproximadamente cada 100
    millas o 2 horas para prevenir la fatiga.
- id: 80
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma aceptable de responsabilidad financiera
    en Dakota del Sur?
  choices:
    A: Una carta de crédito personal de un banco
    B: Un Certificado de Depósito por la cantidad de $50,000 depositado ante el Tesorero
      del Estado
    C: Un mínimo de $10,000 en una cuenta de ahorros personal
    D: Un Certificado de Auto-seguro para un mínimo de 10 vehículos
  answer: B
  explanation: Las formas aceptables de responsabilidad financiera incluyen un Certificado
    de Depósito o Valores por la cantidad de $50,000 depositados ante el Tesorero
    del Estado. El auto-seguro requiere un mínimo de 26 vehículos.
- id: 81
  category: penalties_and_points
  question: Si un menor de 16 años recibe una condena por una primera infracción de
    tránsito, ¿por cuánto tiempo se suspenderán sus privilegios de conducir?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 180 días
  answer: B
  explanation: Si el Departamento recibe un registro de una condena por una infracción
    de tránsito de un menor de 16 años, los privilegios de conducir se suspenderán
    por un período de treinta días.
- id: 82
  category: penalties_and_points
  question: ¿Cómo se evalúan los puntos por condenas de tránsito fuera del estado?
  choices:
    A: No se evalúan puntos por condenas fuera del estado.
    B: Las condenas fuera del estado se evalúan a la mitad del valor de los puntos.
    C: Los puntos se evalúan tal como si se hubieran cometido en Dakota del Sur.
    D: Solo las condenas por delitos graves fuera del estado resultan en puntos.
  answer: C
  explanation: Los puntos se evalúan por condenas fuera del estado tal como si se
    hubieran cometido en Dakota del Sur.
- id: 83
  category: driver_responsibility
  question: Si se le requiere presentar un formulario SR22 como prueba de responsabilidad
    financiera, ¿cómo debe enviarse?
  choices:
    A: Debe entregarlo personalmente en una estación local de examen de conducir.
    B: Debe provenir directamente de su compañía de seguros a la oficina administrativa
      central.
    C: Debe enviar por correo una copia personal al Tesorero del Condado.
    D: Debe mantenerse en su vehículo en todo momento y mostrarse a las autoridades.
  answer: B
  explanation: Los formularios SR22 deben recibirse en la oficina administrativa central
    (las estaciones de examen de conducir no pueden aceptar formularios SR22). Los
    formularios deben provenir directamente de la compañía de seguros.
- id: 84
  category: vehicle_information
  question: ¿Cómo se determina el mes para la renovación del registro de su vehículo
    en Dakota del Sur?
  choices:
    A: Por el mes en que se compró el vehículo
    B: Por el mes de nacimiento del conductor
    C: Por la primera letra de su apellido
    D: Por el último dígito del número de su placa
  answer: C
  explanation: Las renovaciones de registro se determinan mediante un sistema de renovación
    de registro escalonado basado en la primera letra de su apellido.
- id: 85
  category: penalties_and_points
  question: ¿Cuál es la sanción por una condena por no mantener la prueba de responsabilidad
    financiera?
  choices:
    A: Un delito menor de Clase 1 y una suspensión de la licencia de 6 meses
    B: Un delito menor de Clase 2, una suspensión de la licencia de 30 días a 1 año
      y la presentación de un SR22 por 3 años
    C: Una multa de $500 e incautación inmediata del vehículo
    D: Una advertencia por la primera infracción y una multa de $100 por la segunda
      infracción
  answer: B
  explanation: Una condena por no mantener la prueba de responsabilidad financiera
    es un delito menor de Clase 2, conlleva la suspensión de la licencia de conducir
    por un período no menor de 30 días ni mayor de un año y la presentación de una
    prueba de seguro (SR22) ante el Estado de Dakota del Sur por 3 años.
- id: 86
  category: safe_driving_rules
  question: Al planificar un viaje largo, ¿con qué frecuencia debe planear detenerse
    y descansar?
  choices:
    A: Cada 50 millas o 1 hora
    B: Cada 100 millas o 2 horas
    C: Cada 150 millas o 3 horas
    D: Cada 200 millas o 4 horas
  answer: B
  explanation: Antes de un viaje, el manual recomienda que planee detenerse aproximadamente
    cada 100 millas o 2 horas para evitar la fatiga.
- id: 87
  category: defensive_driving
  question: ¿Qué se recomienda si comienza a sentirse cansado mientras conduce?
  choices:
    A: Subir el volumen del radio para mantenerse despierto
    B: Bajar las ventanas para que entre aire fresco
    C: Detenerse en la siguiente salida o área de descanso para tomar una siesta de
      15 a 20 minutos
    D: Conducir más rápido para llegar antes a su destino
  answer: C
  explanation: Si comienza a sentirse cansado, el manual aconseja dejar de conducir
    y detenerse en la siguiente salida o área de descanso para tomar una siesta de
    15 a 20 minutos o buscar un lugar para dormir.
- id: 88
  category: alcohol_drugs_health
  question: ¿En qué porcentaje aproximado de todos los accidentes de tránsito en los
    que alguien muere cada año están involucrados el alcohol y otras drogas que afectan
    la capacidad de conducir?
  choices:
    A: 10%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: El alcohol y otras drogas que afectan la capacidad de conducir están
    involucrados en aproximadamente el 40% de todos los accidentes de tránsito en
    los que alguien muere cada año.
- id: 89
  category: alcohol_drugs_health
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para que
    los conductores menores de 21 años sean arrestados por deterioro por alcohol en
    Dakota del Sur?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: En Dakota del Sur, si es menor de 21 años, puede ser arrestado por
    deterioro por alcohol con un 0.02% bajo las leyes de Tolerancia Cero.
- id: 90
  category: penalties_and_points
  question: Tras una condena por DWI (conducir bajo los efectos del alcohol o drogas),
    ¿por cuánto tiempo debe mantener una 'presentación de seguro' SR22 ante el Departamento
    de Seguridad Pública?
  choices:
    A: 1 año a partir de la fecha de elegibilidad
    B: 2 años a partir de la fecha de elegibilidad
    C: 3 años a partir de la fecha de elegibilidad
    D: 5 años a partir de la fecha de elegibilidad
  answer: C
  explanation: Tras una condena por DWI, debe presentar una 'presentación de seguro'
    SR22 ante el Departamento de Seguridad Pública y mantener este seguro durante
    3 años a partir de la fecha de elegibilidad.
- id: 91
  category: alcohol_drugs_health
  question: ¿A qué nivel de contenido de alcohol en la sangre (BAC) se ve afectada
    la visión de todos los conductores?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.06%
    D: 0.08%
  answer: A
  explanation: La visión se ve afectada con un 0.02% de contenido de alcohol en la
    sangre (BAC) para todos los conductores, lo que nubla la visión, ralentiza la
    capacidad de enfoque y reduce la capacidad de juzgar la distancia y la velocidad.
- id: 92
  category: penalties_and_points
  question: ¿Cuál es la sanción por negarse a realizar una prueba de concentración
    de alcohol en la sangre (BAC) bajo la ley de consentimiento implícito de Dakota
    del Sur?
  choices:
    A: Una multa de $500
    B: Pérdida de su licencia de conducir por 30 días
    C: Pérdida de su licencia de conducir por 6 meses
    D: Pérdida de su licencia de conducir por un año
  answer: D
  explanation: Bajo la ley de consentimiento implícito de Dakota del Sur, usted puede
    perder su licencia de conducir por un año si se niega a realizar una prueba de
    BAC.
- id: 93
  category: driver_responsibility
  question: Si es arrestado en un estado con leyes de consentimiento implícito, pero
    su licencia es de un estado que no las tiene, ¿qué leyes se aplican?
  choices:
    A: Las leyes del estado donde obtuvo su licencia
    B: Las leyes del estado donde fue arrestado
    C: Leyes federales de consentimiento implícito
    D: Usted está exento de las leyes de consentimiento implícito
  answer: B
  explanation: La ley se aplica al estado donde fue arrestado, no al estado donde
    obtuvo su licencia. Usted está sujeto a las leyes de consentimiento implícito
    del estado donde se realizó el arresto.
- id: 94
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de la ley de Tolerancia
    Cero (menores de 21 años, 0.02% o más de BAC)?
  choices:
    A: Delito menor de Clase 2 y pérdida de la licencia de conducir por 30 días
    B: Delito menor de Clase 1 y pérdida de la licencia de conducir por 90 días
    C: Delito menor de Clase 2 y pérdida de la licencia de conducir por 180 días
    D: Delito grave de Clase 6 y pérdida de la licencia de conducir por 1 año
  answer: A
  explanation: Una primera infracción de Tolerancia Cero es un delito menor de Clase
    2 que se castiga con una multa y la pérdida de la licencia de conducir por 30
    días.
- id: 95
  category: penalties_and_points
  question: ¿Cuál es el periodo mínimo de pérdida de la licencia de conducir por una
    primera infracción de DWI (0.08% o más de BAC)?
  choices:
    A: 15 días
    B: 30 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Una primera infracción de DWI (conducir bajo los efectos del alcohol)
    es un delito menor de Clase 1 que incluye la pérdida de su licencia de conducir
    por un mínimo de 30 días.
- id: 96
  category: penalties_and_points
  question: ¿Cómo se clasifica una tercera infracción de DWI (0.08% o más de BAC)?
  choices:
    A: Delito menor de Clase 1
    B: Delito menor de Clase 2
    C: Delito grave de Clase 6
    D: Delito grave de Clase 4
  answer: C
  explanation: Una tercera infracción de DWI es un delito grave de Clase 6 que se
    castiga con una multa, prisión de hasta dos años y la pérdida de la licencia de
    conducir por no menos de un año.
- id: 97
  category: alcohol_drugs_health
  question: ¿Cuándo comienza el deterioro por alcohol?
  choices:
    A: Con la primera bebida
    B: Después de dos bebidas
    C: Cuando su BAC alcanza el 0.05%
    D: Cuando su BAC alcanza el 0.08%
  answer: A
  explanation: El manual establece que el deterioro comienza con la primera bebida.
    Incluso una sola bebida de alcohol puede afectar la capacidad de una persona para
    operar un vehículo motorizado.
- id: 98
  category: signs_and_signals
  question: ¿Cuál es el propósito del programa de señales 'THINK' (PIENSE) establecido
    por el Departamento de Seguridad Pública de Dakota del Sur?
  choices:
    A: Marcar rutas panorámicas a lo largo de la carretera
    B: Indicar áreas de descanso próximas para conductores fatigados
    C: Servir como memorial para las víctimas de accidentes y recordar a los automovilistas
      los comportamientos de conducción peligrosos
    D: Advertir a los conductores sobre las próximas zonas de construcción
  answer: C
  explanation: El programa de señales 'THINK' proporciona un memorial a la víctima
    y recuerda a los automovilistas comportamientos peligrosos como conducir bajo
    la influencia, no usar el cinturón de seguridad, el exceso de velocidad y la conducción
    distraída.
- id: 99
  category: safe_driving_rules
  question: ¿Cuál de los siguientes comportamientos se asocia típicamente con la conducción
    agresiva?
  choices:
    A: Conducir a 5 mph por debajo del límite de velocidad
    B: Seguir demasiado de cerca y realizar cambios de carril inseguros
    C: Ceder el paso en una intersección
    D: Usar el control de crucero en la carretera
  answer: B
  explanation: Los comportamientos típicamente asociados con la conducción agresiva
    incluyen el exceso de velocidad, seguir demasiado de cerca, cambios de carril
    inseguros, señalización inadecuada y no obedecer los dispositivos de control de
    tráfico.
- id: 100
  category: signs_and_signals
  question: ¿Bajo qué condición se retirará rápidamente una señal 'THINK' de la carretera?
  choices:
    A: Después de haber estado en su lugar durante exactamente 10 años
    B: Si se reduce el límite de velocidad en ese tramo de la carretera
    C: Si un familiar directo de la víctima del accidente se opone a la señal
    D: Cuando el departamento de carreteras del estado realiza el mantenimiento anual
      de rutina
  answer: C
  explanation: Según el manual, estas señales permanecen en su lugar hasta que un
    familiar directo de la víctima del accidente se opone a la señal, momento en el
    cual la señal se retirará rápidamente.
- id: 101
  category: alcohol_drugs_health
  question: ¿Cómo pueden afectar su conducción los medicamentos de venta libre, como
    las pastillas estimulantes o las pastillas para adelgazar?
  choices:
    A: Mejoran su tiempo de reacción y estado de alerta en viajes largos.
    B: Pueden hacerle sentir nervioso, mareado, incapaz de concentrarse y afectar
      su visión.
    C: No tienen ningún efecto en la capacidad de conducción siempre que se tomen
      con comida.
    D: Reducen la presión arterial y causan fatiga extrema.
  answer: B
  explanation: El manual establece que las pastillas estimulantes ("uppers") y las
    pastillas para adelgazar pueden hacerle sentir nervioso, mareado, incapaz de concentrarse
    y pueden afectar su visión.
- id: 102
  category: alcohol_drugs_health
  question: 'Según el manual, los estudios han demostrado que las personas que consumen
    marihuana:'
  choices:
    A: Tienen reflejos más rápidos que otros conductores.
    B: Cometen más errores, tienen más problemas para adaptarse al deslumbramiento
      y son arrestados más por infracciones de tráfico.
    C: Tienen menos probabilidades de ser arrestados por infracciones de tráfico debido
      a que conducen más lento.
    D: Pueden operar un vehículo de manera segura si también consumen cafeína.
  answer: B
  explanation: Los estudios han demostrado que las personas que consumen marihuana
    cometen más errores, tienen más problemas para adaptarse al deslumbramiento y
    son arrestadas por infracciones de tráfico con más frecuencia que otros conductores.
- id: 103
  category: alcohol_drugs_health
  question: ¿Cuál es el resultado de combinar alcohol con otras drogas que alteran
    la capacidad de conducción?
  choices:
    A: Las drogas anularán los efectos de alteración del alcohol.
    B: Es seguro siempre que los medicamentos sean recetados legalmente por un médico.
    C: Las drogas podrían multiplicar los efectos del alcohol o tener efectos adicionales
      propios.
    D: Solo afecta su conducción si consume drogas ilegales con alcohol.
  answer: C
  explanation: El manual advierte que nunca se debe beber alcohol mientras se toman
    otros medicamentos porque estos podrían multiplicar los efectos del alcohol o
    tener efectos adicionales propios.
- id: 104
  category: safe_driving_rules
  question: Si se siente enojado o excesivamente emocionado antes de conducir, ¿qué
    debe hacer?
  choices:
    A: Conducir un poco más rápido para llegar antes a su destino.
    B: Escuchar música a todo volumen para ahogar sus pensamientos.
    C: Darse tiempo para calmarse y no salir a la carretera hasta que se haya tranquilizado.
    D: Bajar las ventanillas para que el aire fresco le refresque mientras conduce.
  answer: C
  explanation: Si está enojado o emocionado, dese tiempo para calmarse. Si es necesario,
    dé un paseo corto, pero no salga a la carretera hasta que se haya tranquilizado.
- id: 105
  category: alcohol_drugs_health
  question: ¿Por qué podría ser peligroso conducir para un diabético que toma insulina?
  choices:
    A: Tienen más probabilidades de experimentar furia al volante.
    B: Podrían experimentar una reacción a la insulina, un desmayo o un choque por
      saltarse una comida.
    C: La insulina causa somnolencia inmediata y visión borrosa.
    D: A los diabéticos no se les permite legalmente tener una licencia de conducir.
  answer: B
  explanation: Los diabéticos que toman insulina no deben conducir cuando exista alguna
    posibilidad de una reacción a la insulina, desmayo, convulsión o choque, lo cual
    podría resultar de saltarse una comida o tomar la cantidad incorrecta de insulina.
- id: 106
  category: alcohol_drugs_health
  question: ¿Cuándo se considera generalmente seguro que una persona con epilepsia
    conduzca?
  choices:
    A: Solo durante las horas del día.
    B: Cuando están acompañados por un conductor adulto con licencia.
    C: Siempre que la condición esté bajo control médico.
    D: La epilepsia siempre impide que una persona conduzca de manera segura.
  answer: C
  explanation: 'El manual establece con respecto a la epilepsia: "Siempre que esté
    bajo control médico, la epilepsia generalmente no es peligrosa".'
- id: 107
  category: vehicle_information
  question: ¿Dónde puede encontrar el PSI (libras por pulgada cuadrada) recomendado
    para los neumáticos de su vehículo?
  choices:
    A: En el flanco del propio neumático.
    B: En el manual del propietario del vehículo o en el marco de la puerta del lado
      del conductor.
    C: En la placa de matrícula del vehículo.
    D: Solo en la pantalla del tablero.
  answer: B
  explanation: Antes de entrar a un vehículo, verifique la presión de los neumáticos
    utilizando el PSI recomendado que se encuentra en el manual del propietario del
    vehículo o en el marco de la puerta del lado del conductor del vehículo.
- id: 108
  category: vehicle_information
  question: Al verificar la profundidad de la banda de rodadura de sus neumáticos
    con una moneda de un centavo, ¿qué indica que sus neumáticos están demasiado desgastados
    y necesitan ser reemplazados?
  choices:
    A: No puede ver nada de la cabeza de Abraham Lincoln.
    B: Puede ver toda la cabeza de Abraham Lincoln.
    C: La moneda se cae de la ranura fácilmente.
    D: La banda de rodadura cubre exactamente la mitad de la moneda.
  answer: B
  explanation: Coloque la cabeza de Lincoln primero en la ranura que parezca más profunda.
    Si puede ver toda su cabeza, sus neumáticos están demasiado desgastados; no conduzca
    con ellos y asegúrese de reemplazarlos.
- id: 109
  category: vehicle_information
  question: ¿Cuál de los siguientes es una señal de que su sistema de frenado puede
    necesitar ser revisado por un mecánico?
  choices:
    A: El pedal del freno se siente firme al presionarlo.
    B: El vehículo se detiene en línea recta.
    C: El pedal del freno llega hasta el piso.
    D: Los frenos no hacen ruido al aplicarlos.
  answer: C
  explanation: Si los frenos no parecen funcionar correctamente, hacen mucho ruido,
    huelen mal o el pedal del freno llega hasta el piso, haga que un mecánico los
    revise.
- id: 110
  category: vehicle_information
  question: ¿Cuál es un peligro potencial de conducir con un faro desalineado?
  choices:
    A: Agotará la batería del vehículo más rápido.
    B: Puede iluminar donde no le ayuda y puede cegar a otros conductores.
    C: Hará que las luces direccionales parpadeen rápidamente.
    D: Reduce el ahorro de combustible del vehículo.
  answer: B
  explanation: Un faro desalineado puede iluminar donde no le ayuda y puede cegar
    a otros conductores.
- id: 111
  category: vehicle_information
  question: ¿Cuál es una consecuencia peligrosa de conducir con neumáticos desgastados
    o lisos?
  choices:
    A: Aumento del ahorro de combustible.
    B: Girar más fácilmente en carreteras mojadas.
    C: Aumento de la distancia de frenado y una mayor probabilidad de hidroplaneo
      (hydroplaning).
    D: El volante se bloqueará en su posición.
  answer: C
  explanation: Los neumáticos desgastados o lisos pueden aumentar la distancia de
    frenado y dificultar los giros cuando la carretera está mojada. Los neumáticos
    desgastados también pueden causar hidroplaneo (hydroplaning) y aumentar la probabilidad
    de sufrir un pinchazo.
- id: 112
  category: defensive_driving
  question: 'Para evitar la impaciencia y la ira al volante (road rage), el manual
    sugiere que usted debe:'
  choices:
    A: Tocar la bocina para alertar a los conductores lentos que se quiten de su camino.
    B: Prever tiempo extra para el viaje y salir unos minutos antes.
    C: Seguir muy de cerca al vehículo de adelante para animarlo a acelerar.
    D: Conducir rodeando las barreras ferroviarias bajadas si tiene prisa.
  answer: B
  explanation: Si es impaciente (ira al volante), prevea tiempo extra para el viaje.
    Salga unos minutos antes. Si tiene tiempo suficiente, no tenderá a exceder la
    velocidad ni a realizar otras acciones que puedan resultar en una multa de tráfico
    o causar un choque.
- id: 113
  category: vehicle_information
  question: ¿Por qué es importante mantener su vehículo en buen estado?
  choices:
    A: Garantiza que nunca se verá involucrado en una colisión.
    B: Le permite conducir de forma segura por encima del límite de velocidad establecido.
    C: Le otorga un margen de seguridad adicional cuando lo necesite en una emergencia.
    D: Elimina la necesidad de revisar sus espejos antes de conducir.
  answer: C
  explanation: Un vehículo en buen estado puede darle un margen de seguridad adicional
    cuando lo necesite, y nunca se sabe cuándo será necesario. Un vehículo en mal
    estado podría impedirle salir de una situación de emergencia.
- id: 114
  category: vehicle_information
  question: ¿Cómo puede comprobar si la banda de rodadura de sus neumáticos es segura
    usando una moneda de un centavo?
  choices:
    A: Insértela con el lado de la cruz primero; si la cruz queda cubierta, es segura.
    B: Insértela con la cabeza primero; si la banda de rodadura no llega al menos
      a la cabeza de Abe, no es segura.
    C: Colóquela plana sobre la banda de rodadura; si se cae, no es segura.
    D: Insértela con la cabeza primero; si puede ver la parte superior de la cabeza,
      es segura.
  answer: B
  explanation: Según el manual, debe introducir la moneda en la banda de rodadura
    con la 'cabeza' primero. Si la banda de rodadura no llega al menos a la cabeza
    de Abe (Lincoln), el neumático no es seguro y debe ser reemplazado.
- id: 115
  category: vehicle_information
  question: ¿Cuál es el mayor peligro de un sistema de escape con fugas?
  choices:
    A: Puede causar que el motor se sobrecaliente rápidamente.
    B: Puede causar la muerte dentro del vehículo en muy poco tiempo.
    C: Reduce la eficacia de la suspensión del vehículo.
    D: Hace que el volante se bloquee.
  answer: B
  explanation: El manual establece que los gases de un escape con fugas pueden causar
    la muerte dentro de un vehículo en muy poco tiempo, razón por la cual nunca debe
    dejar el motor encendido en un garaje cerrado.
- id: 116
  category: safe_driving_rules
  question: En Dakota del Sur, ¿cuál es la transmitancia de luz mínima permitida para
    las ventanillas laterales situadas delante o adyacentes al asiento del conductor?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 75%
  answer: B
  explanation: Los parabrisas, las aletas laterales o las ventanillas laterales situadas
    delante, a ambos lados o adyacentes al asiento del conductor no pueden estar cubiertos
    con una aplicación que reduzca la transmitancia de luz a un nivel inferior al
    35%.
- id: 117
  category: vehicle_information
  question: ¿Cuánto puede reducir la potencia luminosa la suciedad en los lentes de
    sus faros delanteros, luces de marcha atrás, de freno y traseras?
  choices:
    A: En un 10%
    B: En un 25%
    C: En un 50%
    D: En un 75%
  answer: C
  explanation: El manual señala que debe mantener limpios los faros delanteros, las
    luces de marcha atrás, de freno y las traseras, ya que la suciedad en los lentes
    puede reducir la luz en un 50%.
- id: 118
  category: safe_driving_rules
  question: Al ajustar su asiento, ¿cuánta distancia debe haber entre su pecho y el
    volante?
  choices:
    A: 5 pulgadas
    B: 10 pulgadas
    C: 15 pulgadas
    D: 20 pulgadas
  answer: B
  explanation: Al ajustar su asiento, debe haber 10 pulgadas entre su pecho y el volante
    para permitir el espacio adecuado para el despliegue de la bolsa de aire (airbag).
- id: 119
  category: safe_driving_rules
  question: ¿Dónde debe colocarse la parte superior del volante en relación con su
    cuerpo?
  choices:
    A: Por encima del nivel de su barbilla
    B: No más arriba de la parte superior de sus hombros y por debajo del nivel de
      la barbilla
    C: A la misma altura que la parte superior de su cabeza
    D: Por debajo del nivel de su pecho
  answer: B
  explanation: El manual establece que la parte superior del volante no debe estar
    más arriba de la parte superior de sus hombros y debe quedar por debajo del nivel
    de la barbilla.
- id: 120
  category: safe_driving_rules
  question: ¿Cómo deben ajustarse los reposacabezas para prevenir mejor el latigazo
    cervical (whiplash)?
  choices:
    A: De modo que solo toquen la parte posterior de su cuello
    B: De modo que se sitúen por debajo del nivel de sus orejas
    C: De modo que toquen la parte posterior de su cabeza y no por debajo del nivel
      de sus orejas
    D: De modo que estén inclinados hacia adelante tocando la parte superior de su
      espalda
  answer: C
  explanation: Los reposacabezas están diseñados para prevenir el latigazo cervical
    (whiplash) y deben ajustarse de modo que toquen la parte posterior de su cabeza
    y no queden por debajo del nivel de sus orejas.
- id: 121
  category: defensive_driving
  question: ¿Cómo debe colocar la cabeza para ajustar correctamente el espejo exterior
    izquierdo y reducir los puntos ciegos?
  choices:
    A: Apoyar la cabeza contra la ventana cerrada
    B: Inclinarse hacia la derecha sobre la consola central
    C: Sentarse perfectamente derecho en el asiento del conductor
    D: Inclinarse hacia adelante hasta que el pecho toque el volante
  answer: A
  explanation: Para ajustar el espejo lateral izquierdo, el conductor debe apoyar
    la cabeza contra la ventana cerrada y ajustar el espejo de modo que apenas se
    vea el borde del vehículo.
- id: 122
  category: defensive_driving
  question: Ajustar correctamente los espejos exteriores utilizando el método recomendado,
    ¿cuánta área de visión adicional añade a cada lado del vehículo?
  choices:
    A: De 5 a 10 grados
    B: De 12 a 16 grados
    C: De 20 a 25 grados
    D: De 30 a 45 grados
  answer: B
  explanation: El método de ajuste de espejos recomendado añade de 12 a 16 grados
    de área de visión adicional a cada lado del vehículo.
- id: 123
  category: safe_driving_rules
  question: ¿Cómo debe ajustarse la correa de regazo del cinturón de seguridad?
  choices:
    A: Holgada a través del estómago
    B: Ajustada y alta a través de la cintura
    C: Ajustada y baja a través de las caderas
    D: Apretada a través de la parte superior de los muslos
  answer: C
  explanation: La correa de regazo debe ajustarse de modo que quede ceñida y baja
    a través de las caderas después de abrocharse para evitar deslizarse fuera del
    cinturón en caso de choque.
- id: 124
  category: safe_driving_rules
  question: ¿Por qué es importante usar el cinturón de seguridad incluso si su vehículo
    está equipado con bolsas de aire (air bags)?
  choices:
    A: Las bolsas de aire están diseñadas para desplegarse solo a velocidades superiores
      a 50 mph.
    B: Las bolsas de aire no le protegen si le golpean por el lado o por detrás, o
      si el vehículo vuelca.
    C: Las bolsas de aire pueden hacer que el volante se bloquee durante un choque.
    D: Los cinturones de seguridad evitan que las bolsas de aire se desplieguen accidentalmente.
  answer: B
  explanation: Los cinturones de seguridad deben usarse incluso con bolsas de aire
    porque estas no le protegen si recibe un impacto lateral o trasero, o si el vehículo
    vuelca.
- id: 125
  category: driver_responsibility
  question: Según la ley de Dakota del Sur, ¿a quién está obligado específicamente
    el conductor a asegurar con un sistema de cinturón de seguridad correctamente
    ajustado en el asiento delantero?
  choices:
    A: Cualquier pasajero que tenga al menos cinco años de edad pero sea menor de
      dieciocho años de edad
    B: Solo pasajeros menores de cinco años
    C: Todos los pasajeros adultos mayores de dieciocho años
    D: Solo los pasajeros sentados directamente detrás del conductor
  answer: A
  explanation: El conductor del vehículo de pasajeros debe asegurar o hacer que se
    asegure con un sistema de cinturón de seguridad correctamente ajustado y abrochado
    a cualquier pasajero en el asiento delantero que tenga al menos cinco años de
    edad pero sea menor de dieciocho años de edad.
- id: 126
  category: safe_driving_rules
  question: Para evitar lesiones causadas por una bolsa de aire en caso de choque,
    ¿los niños de qué edad deben sentarse en el asiento trasero del vehículo?
  choices:
    A: 8 años o menos
    B: 10 años o menos
    C: 12 años o menos
    D: 15 años o menos
  answer: C
  explanation: Los niños de 12 años o menos deben sentarse en el asiento trasero del
    vehículo para evitar lesiones causadas por una bolsa de aire en caso de choque.
- id: 127
  category: safe_driving_rules
  question: ¿Dónde NO debe colocarse nunca un asiento de seguridad para niños orientado
    hacia atrás?
  choices:
    A: En el centro del asiento trasero
    B: Detrás del asiento del conductor
    C: Frente a una bolsa de aire del pasajero activa
    D: En un vehículo equipado con bolsas de aire laterales de cortina
  answer: C
  explanation: Asegúrese de que un asiento de seguridad para niños orientado hacia
    atrás nunca se coloque frente a una bolsa de aire del pasajero activa, ya que
    su despliegue podría lesionar gravemente al niño.
- id: 128
  category: vehicle_information
  question: ¿Cómo protege a un bebé un portabebés para el automóvil?
  choices:
    A: El niño viaja mirando hacia adelante solo con un cinturón de regazo.
    B: El niño viaja mirando hacia atrás con la cabeza y el cuerpo protegidos por
      materiales que absorben los impactos.
    C: El niño se sienta erguido mirando hacia adelante para maximizar la protección
      de la bolsa de aire.
    D: El portabebés se sujeta al techo del vehículo para evitar lesiones por vuelco.
  answer: B
  explanation: En un portabebés para el automóvil, el niño viaja mirando hacia atrás
    con toda la cabeza y el cuerpo protegidos por materiales que absorben los impactos.
- id: 129
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la diferencia entre un portabebés para el automóvil
    y una silla para bebés?
  choices:
    A: Las sillas para bebés son más seguras para los vehículos que los portabebés
      para el automóvil.
    B: Las sillas para bebés no están fabricadas para proteger a un bebé en un vehículo
      y no deben usarse allí.
    C: Los portabebés para el automóvil son solo para uso dentro de la casa.
    D: Son exactamente lo mismo y pueden usarse indistintamente.
  answer: B
  explanation: 'El manual establece: ''No confunda los portabebés para el automóvil
    con las sillas para bebés. Las sillas para bebés pueden ser útiles en la casa,
    pero no están fabricadas para proteger a un bebé en el vehículo y no deben usarse
    allí''.'
- id: 130
  category: safe_driving_rules
  question: ¿Por qué es peligroso llevar a un niño en brazos mientras se viaja en
    un vehículo?
  choices:
    A: El niño podría distraer al conductor al bloquear su visión.
    B: El niño puede desabrochar fácilmente su cinturón de seguridad.
    C: Las fuerzas violentas de una colisión arrancarían al niño de sus brazos.
    D: Hace que las bolsas de aire se desplieguen incorrectamente.
  answer: C
  explanation: El manual explica que incluso si usted lleva puesto el cinturón de
    seguridad, 'el niño sería arrancado de sus brazos por las fuerzas violentas de
    una colisión'.
- id: 131
  category: safe_driving_rules
  question: ¿Como regla general, qué parte del vehículo se considera el lugar más
    seguro para un pasajero?
  choices:
    A: El asiento del pasajero delantero
    B: El centro del asiento trasero
    C: El lado izquierdo del asiento trasero
    D: El lado derecho del asiento trasero
  answer: B
  explanation: Según el manual, 'Como regla, el asiento trasero es más seguro que
    el delantero, y el centro del vehículo es más seguro que los lados'.
- id: 132
  category: safe_driving_rules
  question: Según la ley de Dakota del Sur, ¿un niño menor de cinco años puede ser
    asegurado legalmente usando solo un cinturón de seguridad estándar si cumple con
    qué requisito?
  choices:
    A: Pesan al menos 30 libras de peso.
    B: Pesan al menos 40 libras de peso.
    C: Viajan en el asiento delantero.
    D: Están acompañados por un padre o tutor.
  answer: B
  explanation: La Ley Codificada de Dakota del Sur 32-37-1 establece que los requisitos
    de la sección se cumplen 'si el niño es menor de cinco años y pesa al menos cuarenta
    libras al asegurar al niño con un cinturón de seguridad'.
- id: 133
  category: penalties_and_points
  question: ¿Cuál es la sanción para un operador de 16 años de un vehículo de pasajeros
    que no use un cinturón de seguridad debidamente ajustado y abrochado?
  choices:
    A: Un delito menor de Clase 1 (Class 1 Misdemeanor)
    B: Un delito grave (felony)
    C: Una infracción leve (petty offense)
    D: Suspensión de la licencia por 30 días
  answer: C
  explanation: Según la ley de SD 32-37-1.2, cualquier operador entre 14 y menos de
    18 años de edad debe usar cinturón de seguridad, y 'Una violación de esta sección
    es una infracción leve (petty offense)'.
- id: 134
  category: safe_driving_rules
  question: ¿Las leyes de Dakota del Sur sobre sistemas de retención infantil y cinturones
    de seguridad (32-37-1 a 32-37-1.3) NO se aplican a cuál de los siguientes vehículos?
  choices:
    A: Automóviles de pasajeros fabricados antes de 1966 que no hayan sido equipados
      con cinturones de seguridad.
    B: Cualquier vehículo fabricado antes de 1981.
    C: Camionetas pickup con un peso bruto vehicular superior a 10,000 libras.
    D: Vehículos conducidos por residentes de otros estados.
  answer: A
  explanation: La ley de SD 32-37-2 (Exenciones) establece que estas disposiciones
    'no se aplican en automóviles de pasajeros fabricados antes de 1966 que no hayan
    sido equipados con cinturones de seguridad'.
- id: 135
  category: safe_driving_rules
  question: Según la Guía de Asientos de Seguridad (Car Seat Guide), ¿cómo debe colocarse
    un asiento para bebés?
  choices:
    A: Mirando hacia adelante y en posición vertical
    B: Mirando hacia atrás y reclinado 30 grados
    C: Mirando hacia atrás y completamente plano
    D: Mirando hacia adelante y reclinado 45 grados
  answer: B
  explanation: La Guía de Asientos de Seguridad para Asientos de Bebés especifica
    que deben 'Mirar siempre hacia atrás' y 'Reclinarse 30 grados'.
- id: 136
  category: safe_driving_rules
  question: Al usar un asiento elevador (booster seat) para un niño pequeño que pese
    al menos 30 libras, ¿cuándo es aceptable usar solo un cinturón de regazo?
  choices:
    A: Cuando el asiento elevador tiene un escudo
    B: Cuando el vehículo no tiene correas para los hombros
    C: Cuando el niño tiene más de 4 años
    D: Nunca es aceptable usar solo un cinturón de regazo
  answer: A
  explanation: La Guía de Asientos de Seguridad para Asientos Elevadores establece
    que 'Puede usarse solo con un cinturón de regazo si tiene un escudo'.
- id: 137
  category: defensive_driving
  question: ¿Cuál de los siguientes hechos desmiente el mito de que los cinturones
    de seguridad solo son necesarios en viajes largos?
  choices:
    A: Más de la mitad de todas las muertes por tráfico ocurren a menos de 25 millas
      de casa.
    B: La mayoría de los accidentes ocurren en autopistas interestatales.
    C: Los cinturones de seguridad solo son efectivos a velocidades superiores a 55
      mph.
    D: Las bolsas de aire brindan suficiente protección para viajes de menos de 10
      millas.
  answer: A
  explanation: 'El manual aborda la ''mala información'' sobre los viajes cortos indicando:
    ''Más de la mitad de todas las muertes por tráfico ocurren a menos de 25 millas
    de casa. Muchas de ellas ocurren en carreteras con límites de velocidad de menos
    de 45 mph''.'
- id: 138
  category: defensive_driving
  question: ¿Qué les sucede a los pasajeros que no llevan el cinturón abrochado cuando
    un vehículo es golpeado por el costado?
  choices:
    A: Son lanzados lejos del punto del choque.
    B: Se deslizarán hacia el punto del choque.
    C: Son empujados directamente hacia adelante contra el tablero.
    D: Permanecen seguros en sus asientos debido a la inercia.
  answer: B
  explanation: El manual explica que cuando un vehículo es golpeado por el costado,
    'Todo lo que hay en el vehículo que no esté sujeto, incluidos los pasajeros, se
    deslizará hacia el punto del choque, no lejos de él'.
- id: 139
  category: defensive_driving
  question: ¿La fuerza de un choque frontal a 25 mph es equivalente a qué acción?
  choices:
    A: Caerse de una bicicleta a 10 mph
    B: Lanzarse desde un edificio de tres pisos hacia la acera
    C: Saltar desde una escalera de 10 pies
    D: Chocar contra una pared de ladrillos a paso de trote
  answer: B
  explanation: 'El manual establece: ''Incluso a 25 mph, la fuerza de un choque frontal
    es la misma que pedalear una bicicleta a toda velocidad contra una pared de ladrillos
    o lanzarse desde un edificio de tres pisos hacia la acera''.'
- id: 140
  category: driver_responsibility
  question: ¿Cuándo se considera que una carga en un vehículo o remolque está asegurada
    de manera legal y segura?
  choices:
    A: Cuando es lo suficientemente pesada como para mantenerse en su lugar por su
      propio peso
    B: Cuando nada puede deslizarse, desplazarse, caerse, filtrarse hacia la calzada
      o salir volando
    C: Cuando se coloca en el maletero de un automóvil
    D: Cuando el conductor evita conducir por la interestatal
  answer: B
  explanation: Según la sección Asegure su Carga (Secure Your Load), 'Una carga debe
    estar firmemente sujeta y solo se considera segura cuando nada puede deslizarse,
    desplazarse, caerse o filtrarse hacia la calzada o salir volando'.
- id: 141
  category: vehicle_information
  question: ¿Qué debe hacer antes de arrancar el motor de un vehículo con transmisión
    automática?
  choices:
    A: Colocar el pie izquierdo en el acelerador y verificar que la marcha esté en
      punto muerto (neutral).
    B: Colocar el pie derecho en el pedal del freno y verificar que la palanca selectora
      de marchas esté en posición de estacionamiento (park).
    C: Girar el volante completamente hacia la derecha.
    D: Cambiar la palanca selectora de marchas a conducir (D).
  answer: B
  explanation: 'El manual indica: ''Para arrancar el motor, coloque el pie derecho
    en el pedal del freno y verifique que la palanca selectora de marchas esté en
    posición de estacionamiento (park)''.'
- id: 142
  category: vehicle_information
  question: ¿Cuál es la posición adecuada del pie al acelerar el vehículo?
  choices:
    A: La parte superior del pie en el pedal y el talón del pie en el piso
    B: El talón del pie en el pedal y los dedos apuntando hacia arriba
    C: Todo el pie suspendido sobre el pedal
    D: El pie izquierdo en el freno y el pie derecho en el acelerador
  answer: A
  explanation: En la sección 'Mover el vehículo', el manual establece que se debe
    'Acelerar de forma gradual y suave con la parte superior del pie en el pedal y
    el talón del pie en el piso'.
- id: 143
  category: defensive_driving
  question: ¿Por qué se considera peligroso frenar repentinamente?
  choices:
    A: Hace que el motor se apague inmediatamente.
    B: Aumenta significativamente el consumo de combustible.
    C: Puede hacer que patine, pierda el control y dificulta que los conductores detrás
      de usted se detengan.
    D: Daña la transmisión del vehículo.
  answer: C
  explanation: El manual advierte que 'Cuando frena rápidamente, podría patinar y
    perder el control de su vehículo. También dificulta que los conductores detrás
    de usted se detengan sin chocarlo'.
- id: 144
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante para mantener
    el control del vehículo?
  choices:
    A: Las 10 y las 2 en punto
    B: Las 3 y las 9 en punto
    C: Las 12 y las 6 en punto
    D: Las 8 y las 4 en punto
  answer: B
  explanation: Según el manual, ambas manos deben colocarse en la parte exterior del
    volante en lados opuestos, en las posiciones de las 3 y las 9 en punto, para mantener
    el control del vehículo.
- id: 145
  category: vehicle_information
  question: ¿Por qué ya no se recomienda la posición de las manos a las 2 y las 10
    en punto en el volante?
  choices:
    A: Causa fatiga al conductor en viajes largos
    B: Hace que el giro de manos cruzadas sea imposible
    C: Puede ser peligroso en un vehículo equipado con bolsas de aire (airbags)
    D: Bloquea la vista del velocímetro para el conductor
  answer: C
  explanation: El manual establece que colocar las manos en las posiciones de las
    2 y las 10 en punto ya no se recomienda porque puede ser peligroso en un vehículo
    equipado con bolsas de aire (airbags).
- id: 146
  category: safe_driving_rules
  question: ¿Qué sucederá si gira el encendido de su vehículo a la posición de 'bloqueo'
    (lock) mientras aún está en movimiento?
  choices:
    A: Los frenos se activarán inmediatamente
    B: El volante se bloqueará y perderá el control del vehículo
    C: El motor acelerará
    D: Las bolsas de aire se desplegarán
  answer: B
  explanation: El manual advierte que nunca debe girar el encendido de su vehículo
    a la posición de 'bloqueo' (lock) mientras esté en movimiento, ya que esto hará
    que el volante se bloquee si intenta girarlo, lo que resultará en una pérdida
    de control.
- id: 147
  category: safe_driving_rules
  question: Al retroceder su vehículo de manera segura, ¿dónde debe colocar su mano
    izquierda en el volante?
  choices:
    A: En la posición de las 3 en punto
    B: En la posición de las 6 en punto
    C: En la posición de las 9 en punto
    D: En la posición de las 12 en punto
  answer: D
  explanation: Al retroceder, debe colocar el pie en el freno, cambiar a reversa y
    sujetar el volante en la posición de las 12 en punto con la mano izquierda.
- id: 148
  category: safe_driving_rules
  question: Si usted y otro conductor llegan a una intersección con parada en todas
    las direcciones al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El conductor de la izquierda debe ceder el paso al conductor de la derecha
    B: El conductor de la derecha debe ceder el paso al conductor de la izquierda
    C: El conductor que va derecho debe ceder el paso al conductor que gira
    D: El conductor del vehículo más grande tiene el derecho de paso
  answer: A
  explanation: Las reglas de derecho de paso establecen que debe ceder el paso al
    conductor a su derecha en una intersección con parada en todas las direcciones
    si ambos llegan a la intersección al mismo tiempo.
- id: 149
  category: defensive_driving
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a las reglas
    de derecho de paso?
  choices:
    A: Los peatones siempre tienen el derecho de paso absoluto en todas las situaciones
    B: Debe asumir que automáticamente tiene el derecho de paso si llega primero
    C: Nadie debe asumir que tiene automáticamente el derecho de paso
    D: Los vehículos más grandes tienen automáticamente el derecho de paso sobre los
      vehículos más pequeños
  answer: C
  explanation: El manual establece explícitamente que, aunque las reglas de ceder
    el paso sirven de guía, nadie debe asumir que tiene automáticamente el derecho
    de paso.
- id: 150
  category: sharing_the_road
  question: ¿Qué vehículos en un cortejo fúnebre están obligados a obedecer las señales
    y semáforos de tránsito?
  choices:
    A: Todos los vehículos del cortejo
    B: Solo el primer vehículo del cortejo
    C: Solo el último vehículo del cortejo
    D: Ninguno de los vehículos del cortejo
  answer: B
  explanation: Según el manual, solo el primer vehículo de un cortejo fúnebre debe
    obedecer las señales y semáforos de tránsito.
- id: 151
  category: signs_and_signals
  question: ¿Cómo se ve un Semáforo Híbrido para Peatones (PHB) antes de que un peatón
    presione el botón de llamada para activarlo?
  choices:
    A: Muestra una luz amarilla intermitente
    B: Muestra una luz roja fija
    C: Muestra una luz roja intermitente
    D: Las lentes permanecen apagadas (oscuras)
  answer: D
  explanation: El manual señala que las lentes de un Semáforo Híbrido para Peatones
    permanecen 'oscuras' o apagadas hasta que un peatón que desea cruzar la calle
    presiona el botón de llamada para activar el semáforo.
- id: 152
  category: signs_and_signals
  question: Al encontrarse con un semáforo horizontal en algunas áreas metropolitanas,
    ¿dónde se ubica la luz roja?
  choices:
    A: En el extremo derecho
    B: En el medio
    C: En el extremo izquierdo
    D: Alterna de lado
  answer: C
  explanation: En algunas áreas metropolitanas donde los semáforos son horizontales,
    la luz roja está a la izquierda, la luz amarilla en el medio y la luz verde a
    la derecha.
- id: 153
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a un semáforo con luz ROJA intermitente?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Hacer un alto total y avanzar cuando sea seguro
    C: Ceder el paso al tráfico de la derecha sin detenerse
    D: Detenerse solo si hay peatones presentes
  answer: B
  explanation: Una luz de tráfico ROJA intermitente significa lo mismo que una señal
    de alto. Debe realizar un alto total y luego puede avanzar cuando sea seguro hacerlo.
- id: 154
  category: signs_and_signals
  question: ¿Qué significa una flecha AMARILLA intermitente si usted está girando
    a la izquierda?
  choices:
    A: Usted tiene el derecho de paso protegido para girar a la izquierda
    B: Debe detenerse y esperar a una flecha verde
    C: Puede entrar con precaución en la intersección para girar después de ceder
      el paso al tráfico en sentido contrario y a los peatones
    D: La intersección está cerrada para giros a la izquierda
  answer: C
  explanation: Si va a girar a la izquierda, una flecha AMARILLA intermitente significa
    que puede entrar con precaución en la intersección para realizar el giro cuando
    sea seguro hacerlo, después de ceder el paso al tráfico que viene en sentido contrario
    y a los peatones.
- id: 155
  category: signs_and_signals
  question: ¿Cómo debe tratar una intersección si el semáforo está completamente apagado
    debido a un corte de energía?
  choices:
    A: Pasar sin detenerse si el camino está despejado
    B: Detenerse de la misma manera que si estuviera ante una señal de alto
    C: Ceder el paso solo a los vehículos a su derecha
    D: Esperar en la intersección hasta que llegue la policía
  answer: B
  explanation: Si una señal de control de tráfico no funciona o está completamente
    apagada, el vehículo que la enfrenta debe detenerse de la misma manera que si
    estuviera ante una señal de alto.
- id: 156
  category: signs_and_signals
  question: ¿Cuál es la forma y el color típicos de una señal de advertencia general?
  choices:
    A: Forma octagonal y color rojo
    B: Forma de rombo (diamante) y color amarillo con letras negras
    C: Rectangular y blanca con letras negras
    D: Circular y amarilla con letras negras
  answer: B
  explanation: Las señales de advertencia suelen ser amarillas con letras o símbolos
    negros y tienen forma de rombo (diamante).
- id: 157
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la mejor manera de asegurarse de que no está
    excediendo el límite de velocidad?
  choices:
    A: Igualar la velocidad de los vehículos a su alrededor
    B: Confiar en su juicio sobre la velocidad del vehículo
    C: Revisar el velocímetro con frecuencia
    D: Mantener las RPM del motor por debajo de 3000
  answer: C
  explanation: El manual establece que la mejor manera de no exceder la velocidad
    es saber qué tan rápido va revisando el velocímetro con frecuencia, porque las
    personas no son muy buenas juzgando su propia velocidad.
- id: 158
  category: signs_and_signals
  question: ¿Qué debe hacer si ya se encuentra dentro de la intersección cuando se
    enciende una luz AMARILLA fija?
  choices:
    A: Detenerse inmediatamente en la intersección
    B: Poner reversa y salir de la intersección
    C: No detenerse, sino continuar a través de la intersección
    D: Hacerse a un lado de la intersección y esperar a la luz verde
  answer: C
  explanation: Una luz de tráfico AMARILLA fija significa que debe detenerse si es
    seguro hacerlo. Sin embargo, si ya está en la intersección cuando se enciende
    la luz amarilla, no se detenga y continúe a través de la intersección.
- id: 159
  category: signs_and_signals
  question: ¿Para qué se utilizan normalmente las señales de advertencia de color
    amarillo fluorescente?
  choices:
    A: Salidas de autopistas y marcadores de millas
    B: Zonas escolares y cruces de peatones
    C: Zonas de construcción y mantenimiento
    D: Cruces de ferrocarril y espacios libres bajos
  answer: B
  explanation: Según el manual, algunas señales de advertencia pueden ser de color
    amarillo fluorescente, como las de zonas escolares, cruces escolares y cruces
    de peatones.
- id: 160
  category: signs_and_signals
  question: ¿Qué indica una señal de advertencia circular amarilla con un símbolo
    de 'X' y letras 'RR' en negro?
  choices:
    A: Está en un cruce de ferrocarril y debe detenerse inmediatamente.
    B: La carretera está cerrada más adelante debido a vías de tren.
    C: Se coloca a lo largo de la carretera antes de un cruce para advertirle que
      reduzca la velocidad y busque un tren.
    D: Hay un cruce de ferrocarril abandonado más adelante.
  answer: C
  explanation: Una señal de advertencia circular amarilla con un símbolo de 'X' y
    letras 'RR' en negro se coloca a lo largo de la carretera antes de un cruce a
    nivel de carretera y ferrocarril para advertir a los conductores que reduzcan
    la velocidad, miren y escuchen.
- id: 161
  category: signs_and_signals
  question: ¿Cuál es el propósito del número DOT en una señal del Sistema de Notificación
    de Emergencias (ENS) ferroviarias?
  choices:
    A: Informar a los conductores sobre el límite de velocidad máximo del tren.
    B: Identificar la ubicación física del cruce para los equipos de emergencia.
    C: Indicar cuántas vías hay en el cruce.
    D: Mostrar la distancia hasta el próximo cruce de ferrocarril.
  answer: B
  explanation: La señal ENS contiene un número DOT que identifica la ubicación física
    del cruce para que los equipos de emergencia o el personal ferroviario puedan
    responder exactamente donde se encuentra el cruce.
- id: 162
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por exceso de velocidad en una zona de obras?
  choices:
    A: Su licencia será revocada inmediatamente.
    B: Se le exigirá que vuelva a tomar el examen de conducir.
    C: Las multas por exceso de velocidad en una zona de obras pueden duplicarse.
    D: Su vehículo será confiscado.
  answer: C
  explanation: El manual indica que se debe dar un "respiro" (frenar) a los trabajadores
    de la construcción y señala que las multas por exceso de velocidad en una zona
    de obras pueden duplicarse.
- id: 163
  category: signs_and_signals
  question: ¿De qué color y forma son la mayoría de las señales de zona de obras?
  choices:
    A: En forma de diamante o rectangulares y de color naranja con letras o símbolos
      negros.
    B: De forma cuadrada y azules con letras blancas.
    C: De forma circular y amarillas con letras negras.
    D: De forma triangular y rojas con letras blancas.
  answer: A
  explanation: Las señales de zona de obras generalmente tienen forma de diamante
    o rectangular y son de color naranja con letras o símbolos negros.
- id: 164
  category: safe_driving_rules
  question: ¿Cuándo se le permite conducir al límite de velocidad máximo indicado?
  choices:
    A: En todo momento, independientemente de las condiciones climáticas.
    B: Solo en condiciones de conducción ideales.
    C: Solo al adelantar a otro vehículo.
    D: Al conducir en una carretera de varios carriles.
  answer: B
  explanation: El límite máximo debe respetarse solo en condiciones de conducción
    ideales y debe reducir su velocidad cuando las condiciones lo requieran, como
    cuando la calzada está resbaladiza o hay niebla.
- id: 165
  category: signs_and_signals
  question: ¿Qué significa un círculo rojo con una barra diagonal roja sobre un símbolo
    en una señal reglamentaria?
  choices:
    A: Se recomienda la acción mostrada.
    B: La acción mostrada está prohibida.
    C: Proceda con precaución.
    D: Ceda el paso al tráfico que viene en sentido contrario.
  answer: B
  explanation: Algunas señales reglamentarias tienen un círculo rojo con una barra
    diagonal roja sobre un símbolo, lo que prohíbe ciertas acciones.
- id: 166
  category: signs_and_signals
  question: ¿Qué indica un triángulo naranja reflectante en la parte trasera de un
    vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos.
    B: El vehículo es un autobús escolar.
    C: El vehículo circula a menos de 25 mph.
    D: El vehículo está averiado y espera una grúa.
  answer: C
  explanation: Un triángulo naranja reflectante en la parte trasera de un vehículo
    significa que es un Vehículo de Movimiento Lento que circula a menos de 25 mph.
- id: 167
  category: signs_and_signals
  question: ¿Qué representan las señales azules cuadradas o rectangulares con letras
    o símbolos blancos?
  choices:
    A: Señales de destino que muestran distancias a ciudades.
    B: Señales de servicio que muestran ubicaciones de áreas de descanso, gasolineras
      u hospitales.
    C: Señales reglamentarias que indican límites de velocidad.
    D: Señales de advertencia de próximas curvas.
  answer: B
  explanation: Las señales de servicio tienen forma cuadrada o rectangular y son azules
    con letras o símbolos blancos. Muestran la ubicación de diversos servicios, como
    áreas de descanso, gasolineras, campamentos u hospitales.
- id: 168
  category: safe_driving_rules
  question: ¿Qué indica una doble línea amarilla en una calzada de doble sentido?
  choices:
    A: Se permite adelantar en ambos sentidos.
    B: Se permite adelantar solo durante las horas del día.
    C: Está prohibido adelantar en ambos sentidos.
    D: El carril está reservado solo para giros a la izquierda.
  answer: C
  explanation: Una calzada de doble sentido indicada por una doble línea amarilla
    significa que está prohibido adelantar en ambos sentidos.
- id: 169
  category: safe_driving_rules
  question: Si se aproxima a una intersección con una señal de alto, un cruce de peatones
    marcado y una línea de parada, ¿dónde debe detenerse primero?
  choices:
    A: Justo después del cruce de peatones.
    B: Antes de la línea de parada.
    C: A la altura de la señal de alto.
    D: En medio del cruce de peatones.
  answer: B
  explanation: Si hay una línea de parada antes del cruce de peatones, se debe obedecer
    primero la línea de parada.
- id: 170
  category: safe_driving_rules
  question: ¿Cómo están marcados a cada lado los carriles centrales compartidos?
  choices:
    A: Por líneas blancas sólidas dobles.
    B: Por una sola línea blanca discontinua.
    C: Por líneas amarillas continuas y amarillas discontinuas.
    D: Por líneas rojas sólidas.
  answer: C
  explanation: Los carriles centrales compartidos están marcados a cada lado por líneas
    amarillas continuas y amarillas discontinuas.
- id: 171
  category: safe_driving_rules
  question: ¿Qué debe hacer si conduce por una carretera de alta velocidad y la velocidad
    mínima señalizada es demasiado rápida para usted?
  choices:
    A: Encienda las luces de emergencia y conduzca a su velocidad preferida.
    B: Conduzca por el arcén de la carretera.
    C: Use otra carretera.
    D: Siga muy de cerca a un vehículo más lento.
  answer: C
  explanation: Si la velocidad mínima señalizada es demasiado rápida para usted, debe
    utilizar otra carretera para no representar un peligro para otros conductores.
- id: 172
  category: signs_and_signals
  question: ¿Qué indica una señal blanca en forma de X con las palabras "Railroad
    Crossing" (Cruce de ferrocarril) impresas?
  choices:
    A: Se está aproximando a un cruce de ferrocarril en 500 pies.
    B: Se encuentra en el cruce a nivel de la carretera y el ferrocarril.
    C: El cruce de ferrocarril está cerrado actualmente por reparaciones.
    D: Los trenes ya no utilizan las vías.
  answer: B
  explanation: Una señal blanca en forma de X con "Railroad Crossing" impreso se encuentra
    en el cruce a nivel de la carretera y el ferrocarril. Estas también se denominan
    señales de "aspa" (cross-buck).
- id: 173
  category: safe_driving_rules
  question: Al realizar un giro a la derecha, ¿qué acción debe evitar el conductor?
  choices:
    A: Acelerar suavemente durante el giro
    B: Abrirse mucho hacia la izquierda antes de realizar el giro
    C: Girar desde la parte más a la derecha del carril
    D: Revisar el tráfico detrás
  answer: B
  explanation: El manual establece explícitamente que al realizar giros a la derecha,
    debe evitar abrirse mucho hacia la izquierda antes de hacer el giro.
- id: 174
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado al girar desde una calzada con múltiples
    carriles de giro?
  choices:
    A: Cambiar de carril durante el giro para encontrar el camino más despejado
    B: Incorporarse siempre al carril del extremo derecho mientras gira
    C: Identificar y entrar en el carril desde el cual girará, y permanecer en ese
      carril hasta completar el giro
    D: Ceder el paso a los vehículos en el carril adyacente antes de cambiar de carril
      a mitad del giro
  answer: C
  explanation: Para giros con múltiples carriles, el manual instruye a los conductores
    a identificar y entrar en el carril desde el cual girarán y permanecer en ese
    carril hasta que se complete el giro.
- id: 175
  category: safe_driving_rules
  question: ¿En qué tipo de calzada se debe utilizar un giro de tres puntos (giro
    en Y)?
  choices:
    A: Una autopista de cuatro carriles
    B: Una calle de sentido único
    C: Una calzada de dos carriles
    D: Una rampa de entrada a la interestatal
  answer: C
  explanation: El manual establece que un giro de tres puntos solo debe usarse en
    una calzada de dos carriles cuando la carretera es demasiado estrecha para hacer
    un giro en U y no es posible dar la vuelta a la manzana.
- id: 176
  category: safe_driving_rules
  question: No debe realizar un giro en U en una curva o cerca de la cima de una pendiente
    si su vehículo no puede ser visto por los conductores que se aproximan a qué distancia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: No realice un giro en U en una curva o cerca de la cima de una pendiente
    en cualquier carretera sin división donde el vehículo no pueda ser visto por el
    conductor de cualquier otro vehículo a menos de 500 pies que se aproxime desde
    cualquier dirección.
- id: 177
  category: safe_driving_rules
  question: ¿En cuál de los siguientes lugares está generalmente prohibido realizar
    un giro en U?
  choices:
    A: A mitad de cuadra en cualquier calle de un distrito comercial
    B: En una intersección con una parada de cuatro vías
    C: En una calzada de dos carriles sin tráfico en sentido contrario
    D: En una carretera dividida con un cruce legal
  answer: A
  explanation: El manual establece que no debe realizar un giro en U a mitad de cuadra
    en ninguna calle de un distrito comercial.
- id: 178
  category: defensive_driving
  question: Antes de avanzar después de detenerse en una intersección, ¿cuál es la
    forma recomendada de verificar el tráfico transversal?
  choices:
    A: Mirar a la derecha, luego a la izquierda, luego a la derecha de nuevo
    B: Mirar a la izquierda, luego a la derecha, luego a la izquierda de nuevo
    C: Mirar hacia adelante, luego a la izquierda, luego a la derecha
    D: Mirar los espejos y luego sobre su hombro derecho
  answer: B
  explanation: El manual recomienda mirar a la izquierda, luego a la derecha y luego
    a la izquierda de nuevo antes de entrar en la intersección.
- id: 179
  category: defensive_driving
  question: ¿Por qué debe evitar girar hacia un carril solo porque un vehículo que
    se aproxima tiene activa su señal de giro?
  choices:
    A: La señal de giro podría estar indicando un cambio de carril en lugar de un
      giro
    B: El conductor puede planear girar después de pasar su vehículo o puede haber
      olvidado apagar la señal
    C: Es ilegal girar frente a un vehículo que hace señales bajo cualquier circunstancia
    D: El vehículo que se aproxima tiene automáticamente el derecho de paso para girar
      en su carril
  answer: B
  explanation: El manual advierte no girar solo porque un vehículo que se aproxima
    tenga una señal de giro activa, ya que el conductor puede planear girar después
    de pasar su vehículo o puede haber olvidado apagar la señal de un giro anterior.
- id: 180
  category: safe_driving_rules
  question: ¿En qué dirección fluye el tráfico en una rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: Direcciones alternas según la hora del día
    D: Directo a través de la isla central
  answer: B
  explanation: Las rotondas mantienen el tráfico moviéndose en un solo sentido, en
    dirección contraria a las agujas del reloj.
- id: 181
  category: safe_driving_rules
  question: ¿Según las estadísticas de choques, las rotondas reducen los choques fatales
    en aproximadamente qué porcentaje en comparación con otros tipos de controles
    de intersección?
  choices:
    A: 35%
    B: 50%
    C: 75%
    D: 90%
  answer: D
  explanation: Las estadísticas de choques muestran que las rotondas reducen los choques
    fatales en aproximadamente un 90% en comparación con otros tipos de controles
    de intersección.
- id: 182
  category: sharing_the_road
  question: ¿Cuál es el propósito de una berma para camiones (truck apron) en una
    rotonda?
  choices:
    A: Un área de estacionamiento para vehículos averiados
    B: Un carril designado para que los automóviles de pasajeros rebasen a los camiones
    C: Un área pavimentada en el interior para que las ruedas traseras de los camiones
      grandes la utilicen al girar
    D: Una zona de cruce de peatones
  answer: C
  explanation: Una berma para camiones es un área pavimentada en el interior de la
    rotonda para que las ruedas traseras de los camiones grandes la utilicen al girar
    (desviación de la trayectoria).
- id: 183
  category: safe_driving_rules
  question: Al prepararse para entrar en una rotonda, ¿a quién debe ceder el paso?
  choices:
    A: Al tráfico a su derecha que ya se encuentra en la rotonda
    B: Al tráfico a su izquierda que ya se encuentra en la rotonda
    C: A los vehículos que entran desde el lado opuesto de la rotonda
    D: A los vehículos que salen de la rotonda
  answer: B
  explanation: El paso 3 para conducir en una rotonda es ceder el paso al tráfico
    a su izquierda que ya se encuentra en la rotonda.
- id: 184
  category: sharing_the_road
  question: ¿Qué debe hacer si ya está dentro de una rotonda y se aproxima un vehículo
    de emergencia?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda
    B: Hacerse a un lado hacia la isla interior y detenerse
    C: Continuar hasta su salida, luego hacerse a un lado y permitir que pasen los
      vehículos de emergencia
    D: Acelerar para salir de la rotonda antes de que entre el vehículo de emergencia
  answer: C
  explanation: Si ha entrado en la rotonda, continúe hasta su salida, luego hágase
    a un lado y permita que pasen los vehículos de emergencia. Debe evitar detenerse
    dentro de la rotonda.
- id: 185
  category: safe_driving_rules
  question: ¿Qué señal debe usar al acercarse a su salida en una rotonda?
  choices:
    A: Señal de giro a la izquierda
    B: Señal de giro a la derecha
    C: Luces de emergencia (intermitentes)
    D: No se requiere ninguna señal
  answer: B
  explanation: 'El paso 6 para conducir en una rotonda establece: Al acercarse a la
    salida, encienda la señal de giro a la derecha.'
- id: 186
  category: safe_driving_rules
  question: ¿Cuál es un problema común que ocurre en las áreas de entrecruzamiento
    (weaving areas) de un intercambio en trébol?
  choices:
    A: El tráfico intenta entrar a los carriles de la interestatal al mismo tiempo
      que otro tráfico intenta salir
    B: Los vehículos se ven obligados a detenerse en los semáforos de la rampa
    C: Los bucles de la rampa requieren que los conductores aumenten su velocidad
      significativamente
    D: Los peatones cruzan frecuentemente las áreas de entrecruzamiento
  answer: A
  explanation: El manual señala que pueden ocurrir problemas en las áreas de entrecruzamiento
    en un intercambio en trébol porque el tráfico intenta entrar a los carriles de
    la interestatal al mismo tiempo que otro tráfico intenta salir.
- id: 187
  category: safe_driving_rules
  question: ¿Cómo se manejan los giros a la izquierda hacia la autopista en un Intercambio
    de Diamante Divergente (DDI)?
  choices:
    A: Los vehículos deben detenerse ante una luz roja antes de girar.
    B: Los giros a la izquierda son de flujo libre, lo que significa que los vehículos
      no se detienen para acceder a la rampa.
    C: Los vehículos deben ceder el paso al tráfico que viene de frente antes de girar.
    D: Los giros a la izquierda están prohibidos y los conductores deben usar una
      rampa de bucle.
  answer: B
  explanation: Según el manual, en un Intercambio de Diamante Divergente (DDI), todos
    los giros a la izquierda hacia la autopista son de flujo libre, lo que significa
    que los vehículos no se detienen para acceder a la rampa.
- id: 188
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en la interestatal?
  choices:
    A: Hacerse al acotamiento y retroceder con cuidado.
    B: Dar una vuelta en U a través de la mediana.
    C: Detenerse y esperar un espacio en el tráfico para retroceder.
    D: Continuar hasta la siguiente salida.
  answer: D
  explanation: 'El manual establece: "Si se pasa de su salida, continúe hasta la siguiente
    salida. Retroceder en la interestatal está prohibido bajo cualquier circunstancia".'
- id: 189
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar que tiene
    sus luces rojas intermitentes y el brazo de parada extendido?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera de dos carriles.
    B: Cuando la calzada está separada por una barrera física.
    C: Cuando llega tarde y no hay niños visibles.
    D: Cuando el autobús escolar está detenido en una intersección.
  answer: B
  explanation: Siempre debe detenerse ante un autobús escolar que tenga sus luces
    rojas intermitentes o su brazo de parada extendido en todo momento, a menos que
    la calzada esté separada por una barrera física.
- id: 190
  category: vehicle_information
  question: ¿Bajo qué condición sugiere el manual que podría optar por dejar el freno
    de estacionamiento desactivado al estacionar?
  choices:
    A: Al estacionar en una colina empinada.
    B: Durante el clima frío, cuando el freno de estacionamiento podría congelarse
      en la posición de activado.
    C: Al estacionar en un espacio de estacionamiento en paralelo.
    D: Al estacionar un vehículo con transmisión manual.
  answer: B
  explanation: Una posible excepción a poner el freno de estacionamiento es durante
    el clima frío, cuando es posible que el freno de estacionamiento se congele en
    la posición de activado. En esos momentos, puede optar por dejar el freno de estacionamiento
    desactivado.
- id: 191
  category: safe_driving_rules
  question: ¿Si debe estacionar su vehículo en una carretera rural, cuánto ancho de
    la vía debe quedar libre para que pase el resto del tráfico?
  choices:
    A: Al menos 10 pies
    B: Al menos 12 pies
    C: Al menos 15 pies
    D: Al menos 20 pies
  answer: C
  explanation: Si se estaciona en una carretera rural, debe haber al menos 15 pies
    de ancho de vía para que el resto del tráfico pase al vehículo, y este debe ser
    visible desde al menos 500 pies en cualquier dirección.
- id: 192
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante al estacionar cuesta arriba con
    un bordillo (curb)?
  choices:
    A: Completamente hacia la derecha
    B: Completamente hacia la izquierda
    C: Mantener las ruedas rectas
    D: Ligeramente hacia la derecha
  answer: B
  explanation: Al estacionar en una pendiente, debe girar las ruedas completamente
    hacia la izquierda si hay un bordillo y está mirando cuesta arriba.
- id: 193
  category: safe_driving_rules
  question: ¿Cómo debe posicionar las ruedas al estacionar cuesta abajo, con o sin
    bordillo?
  choices:
    A: Gire las ruedas completamente hacia la derecha.
    B: Gire las ruedas completamente hacia la izquierda.
    C: Mantenga las ruedas perfectamente rectas.
    D: Gire las ruedas a la izquierda solo si hay un bordillo.
  answer: A
  explanation: El manual instruye a los conductores a girar las ruedas completamente
    hacia la derecha si no hay bordillo o si se está mirando cuesta abajo. Esto asegura
    que el vehículo ruede lejos del tráfico si comienza a moverse.
- id: 194
  category: safe_driving_rules
  question: Cuando haya terminado de estacionar en paralelo, ¿a qué distancia debe
    estar su vehículo del bordillo o del borde de la carretera?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: B
  explanation: Cuando se termina la maniobra de estacionamiento en paralelo, el vehículo
    debe estar a menos de 12 pulgadas del bordillo o del borde de la carretera.
- id: 195
  category: safe_driving_rules
  question: Después de completar una maniobra de estacionamiento en paralelo, ¿cuál
    es la distancia mínima que debe dejar entre su vehículo y los otros vehículos
    estacionados?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 4 pies
  answer: B
  explanation: El manual establece que cuando se termina la maniobra de estacionamiento
    en paralelo, su vehículo debe estar al menos a 2 pies de distancia de los vehículos
    estacionados.
- id: 196
  category: defensive_driving
  question: ¿Cuál es la forma adecuada de revisar sus puntos ciegos antes de realizar
    un cambio de carril?
  choices:
    A: Confiar únicamente en su espejo retrovisor.
    B: Revisar sus espejos laterales durante al menos cinco segundos.
    C: Girar rápidamente la cabeza para buscar peatones o vehículos ocultos.
    D: Tocar la bocina para advertir a los vehículos que puedan estar en su punto
      ciego.
  answer: C
  explanation: Debido a que no puede ver a los peatones u otros vehículos en el retrovisor
    o en los espejos laterales cuando están en los puntos ciegos, debe girar rápidamente
    la cabeza para buscar peatones o vehículos ocultos antes de realizar cambios de
    carril o giros.
- id: 197
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de conducir mucho más lento que otros
    vehículos en la vía?
  choices:
    A: Mejora el flujo general del tráfico.
    B: Es más seguro que mantener el ritmo del tráfico.
    C: Puede ser multado por obstruir el tráfico.
    D: Ahorrará una cantidad significativa de combustible.
  answer: C
  explanation: Ir mucho más lento que otros vehículos puede ser tan malo como el exceso
    de velocidad. Es peligroso y puede ser multado por obstruir el tráfico.
- id: 198
  category: safe_driving_rules
  question: ¿Qué debe evitar hacer al usar un carril de aceleración para incorporarse
    a una carretera de alta velocidad?
  choices:
    A: Alcanzar la velocidad de los otros vehículos antes de incorporarse.
    B: Conducir hasta el final del carril y detenerse.
    C: Ceder el paso al tráfico que ya circula por la vía.
    D: Buscar un hueco en el tráfico mientras aumenta la velocidad.
  answer: B
  explanation: Al incorporarse al tráfico, debe usar el carril de aceleración para
    alcanzar la velocidad de los otros vehículos. No conduzca hasta el final del carril
    y se detenga, o no habrá suficiente espacio para alcanzar la velocidad del tráfico.
- id: 199
  category: safe_driving_rules
  question: Al salir de una carretera principal que tiene rampas de salida, ¿cuándo
    debe comenzar a reducir la velocidad?
  choices:
    A: Aproximadamente 500 pies antes de la rampa de salida.
    B: Tan pronto como encienda su luz direccional.
    C: Solo después de haberse movido a la rampa de salida.
    D: Mientras todavía está en el carril derecho de la carretera principal.
  answer: C
  explanation: Si la carretera por la que viaja tiene rampas de salida, no reduzca
    la velocidad hasta que se mueva a la rampa de salida.
- id: 200
  category: safe_driving_rules
  question: ¿Cuál es la disciplina de carril adecuada al conducir en la interestatal?
  choices:
    A: Permanecer en el carril izquierdo para evitar el tráfico que se incorpora.
    B: Zigzaguear entre carriles para mantener la mayor velocidad posible.
    C: Permanecer en el carril derecho a menos que esté adelantando y pasando a otro
      vehículo.
    D: Conducir en el carril central en todo momento.
  answer: C
  explanation: Las técnicas de conducción adecuadas en la interestatal requieren que
    evite cambios de carril innecesarios y que permanezca en el carril derecho a menos
    que esté adelantando y pasando a otro vehículo.
- id: 201
  category: safe_driving_rules
  question: ¿Cuál es la práctica más segura al salir de un vehículo estacionado en
    una calzada?
  choices:
    A: Salir siempre por el lado de la calle para evitar a los peatones.
    B: Salir del vehículo por el lado de la acera si es posible.
    C: Dejar la puerta abierta mientras recoge sus pertenencias.
    D: Dejar la llave de encendido en el vehículo en caso de que sea necesario moverlo.
  answer: B
  explanation: El manual aconseja salir del vehículo por el lado de la acera si es
    posible. Si no es posible, use el lado de la calle, pero asegúrese de verificar
    el tráfico antes de abrir la puerta.
- id: 202
  category: safe_driving_rules
  question: Al girar desde una carretera de dos carriles de alta velocidad, ¿cómo
    debe ajustar su velocidad si tiene tráfico detrás de usted?
  choices:
    A: Frenar bruscamente de inmediato para advertir a los conductores que le siguen.
    B: Tratar de no reducir la velocidad demasiado pronto y pisar los frenos de forma
      rápida pero segura.
    C: Moverse al arcén antes de reducir la velocidad.
    D: Mantener su velocidad alta hasta que esté completamente dentro del giro.
  answer: B
  explanation: El manual establece que al girar desde una carretera de dos carriles
    de alta velocidad, debe intentar no reducir la velocidad demasiado pronto si tiene
    tráfico detrás de usted y, en su lugar, pisar los frenos de forma rápida pero
    segura para reducir la velocidad.
- id: 203
  category: vehicle_information
  question: ¿Cuál es la velocidad máxima típica de los tractores agrícolas, los vehículos
    de tracción animal y los vehículos de mantenimiento de carreteras?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: Según el manual, los tractores agrícolas, los vehículos de tracción
    animal y los vehículos de mantenimiento de carreteras suelen circular a 25 mph
    o menos.
- id: 204
  category: safe_driving_rules
  question: Al acercarse a un vehículo que circula despacio, ¿por qué lado debe adelantarlo?
  choices:
    A: Solo por el lado derecho
    B: Por el lado izquierdo o derecho, dependiendo del tráfico
    C: Por el lado izquierdo, si es posible
    D: No se permite adelantar a vehículos que circulan despacio
  answer: C
  explanation: El manual indica a los conductores que reduzcan la velocidad al acercarse
    a un vehículo que circula despacio y, si es posible, se desplacen a la izquierda
    para adelantarlo. Nunca debe adelantar por la derecha.
- id: 205
  category: safe_driving_rules
  question: Al adelantar a otro vehículo en una carretera de varios carriles, ¿qué
    carril está destinado a ser utilizado para adelantar a los vehículos más lentos?
  choices:
    A: El carril del extremo derecho
    B: El carril central
    C: El carril del extremo izquierdo
    D: El arcén
  answer: C
  explanation: El manual establece que en las carreteras de varios carriles, el carril
    del extremo izquierdo está destinado a ser utilizado para adelantar a los vehículos
    más lentos.
- id: 206
  category: safe_driving_rules
  question: ¿Cuándo es seguro volver a su carril después de adelantar a otro vehículo?
  choices:
    A: Tan pronto como esté en paralelo con el otro vehículo
    B: Cuando pueda ver la parte delantera completa del vehículo adelantado en su
      espejo retrovisor
    C: Cuando esté a una distancia de un vehículo por delante del vehículo adelantado
    D: Inmediatamente después de activar la señal de giro a la derecha
  answer: B
  explanation: Al adelantar, debe continuar el adelantamiento hasta que la parte delantera
    completa del vehículo adelantado sea visible en el espejo retrovisor antes de
    señalizar y regresar al carril.
- id: 207
  category: defensive_driving
  question: ¿Qué debe hacer cuando otro vehículo le está adelantando?
  choices:
    A: Aumentar la velocidad para evitar que le cierren el paso
    B: Moverse al arcén derecho
    C: Permanecer en su carril y mantener una velocidad constante
    D: Reducir la velocidad drásticamente para dejarles pasar rápidamente
  answer: C
  explanation: Cuando le estén adelantando, el manual le aconseja permanecer en su
    carril y mantener una velocidad constante para permitir que el conductor le pase.
- id: 208
  category: sharing_the_road
  question: Según la ley de Dakota del Sur, ¿cuál es la separación mínima requerida
    al adelantar a una bicicleta si el límite de velocidad indicado es de 35 mph o
    menos?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: B
  explanation: La ley estatal (32-26-26.1) exige una separación mínima de tres pies
    entre su vehículo y una bicicleta si el límite indicado es de 35 mph o menos.
- id: 209
  category: driver_responsibility
  question: ¿Cómo debe reconocer la presencia de un oficial de la ley cuando este
    inicia una parada de control?
  choices:
    A: Encender las luces de emergencia
    B: Encender la señal de giro a la derecha
    C: Sacar la mano por la ventana
    D: Pisar los frenos tres veces
  answer: B
  explanation: El manual establece que debe reconocer la presencia del oficial encendiendo
    la señal de giro a la derecha, lo que le permite al oficial saber que usted reconoce
    su presencia.
- id: 210
  category: safe_driving_rules
  question: ¿Dónde debe detenerse durante una parada de control en una autopista?
  choices:
    A: La mediana central
    B: El arcén izquierdo si se encuentra en el carril de viaje compartido (carpool)
    C: Completamente en el arcén derecho
    D: Solo en la rampa de salida más cercana
  answer: C
  explanation: En una autopista, debe desplazarse completamente hacia el arcén derecho,
    incluso si se encuentra en el carril de viaje compartido/HOV. Nunca debe detenerse
    en la mediana central.
- id: 211
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿qué deben hacer usted y sus pasajeros
    con las manos?
  choices:
    A: Mantenerlas ocultas debajo de las piernas
    B: Colocarlas a la vista, como en el volante o en el regazo
    C: Buscar en la guantera su registro inmediatamente
    D: Mantenerlas en los bolsillos
  answer: B
  explanation: Debe colocar sus manos a la vista, incluyendo las manos de todos los
    pasajeros, como en el volante o sobre su regazo, para evitar aumentar el nivel
    de amenaza que siente el oficial.
- id: 212
  category: driver_responsibility
  question: ¿Qué debe hacer si la policía le ordena detenerse y su vehículo tiene
    vidrios polarizados?
  choices:
    A: Mantener las ventanas cerradas para proteger su privacidad
    B: Bajar las ventanas después de detenerse y antes de que el oficial haga contacto
    C: Salir del vehículo inmediatamente para que el oficial pueda verlo
    D: Encender las luces altas
  answer: B
  explanation: Si sus ventanas están polarizadas, se recomienda bajarlas después de
    haber detenido su vehículo en el arcén derecho y antes de que el oficial haga
    contacto con usted.
- id: 213
  category: defensive_driving
  question: Idealmente, ¿a qué distancia por delante de su automóvil debe intentar
    mirar mientras conduce?
  choices:
    A: 5 a 10 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: 45 a 60 segundos
  answer: C
  explanation: El manual establece que, idealmente, debe intentar mirar lo que ocurre
    de 20 a 30 segundos por delante del automóvil para tener tiempo de ajustar y planificar
    los movimientos de conducción.
- id: 214
  category: defensive_driving
  question: ¿Cómo ayuda a ahorrar combustible el mirar bien hacia adelante en la carretera?
  choices:
    A: Le permite conducir a velocidades más altas de forma segura
    B: Le ayuda a evitar frenazos innecesarios al reducir la velocidad gradualmente
    C: Reduce la resistencia aerodinámica de su vehículo
    D: Le permite seguir de cerca a vehículos más grandes para obtener un efecto de
      succión
  answer: B
  explanation: Al mirar bien hacia adelante, los conductores pueden reducir la velocidad
    gradualmente o cambiar de carril y evitar frenazos innecesarios que conducen a
    un menor rendimiento de millas por galón.
- id: 215
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es inseguro y está prohibido adelantar
    a otro vehículo?
  choices:
    A: En una autopista de varios carriles con una línea blanca discontinua
    B: Cuando el vehículo de adelante viaja por debajo del límite de velocidad
    C: Antes de un cruce de carretera y ferrocarril o un puente
    D: Cuando tiene una vista despejada de la carretera por una milla
  answer: C
  explanation: 'El manual establece explícitamente: ''No intente adelantar cuando
    se acerque un vehículo en sentido contrario, su visión esté bloqueada por una
    curva o una colina, en intersecciones, antes de un cruce de carretera y ferrocarril,
    o antes de un puente''.'
- id: 216
  category: defensive_driving
  question: ¿Qué debe hacer si se detiene en una intersección y su visión de la calle
    transversal está bloqueada?
  choices:
    A: Tocar la bocina y acelerar rápidamente a través de la intersección.
    B: Avanzar lentamente hacia adelante hasta que pueda ver.
    C: Esperar a que otro vehículo gire primero y seguirlo.
    D: Retroceder y elegir una ruta diferente.
  answer: B
  explanation: 'El manual establece: "Si se detuvo y su visión de una calle transversal
    está bloqueada, avance lentamente hacia adelante hasta que pueda ver. Al moverse
    lentamente hacia adelante, los conductores que cruzan pueden ver la parte delantera
    de su vehículo antes de que usted pueda verlos a ellos".'
- id: 217
  category: safe_driving_rules
  question: ¿Cuándo es especialmente importante mirar a la izquierda y a la derecha
    en una intersección porque otros conductores podrían pasar apresuradamente?
  choices:
    A: Justo después de que la luz cambie a verde.
    B: Cuando la luz es amarilla intermitente.
    C: Durante las horas del amanecer y el atardecer.
    D: Cuando está girando a la derecha en rojo.
  answer: A
  explanation: El manual señala que mirar a la izquierda y a la derecha es "especialmente
    importante justo después de que la luz cambie a verde. Aquí es cuando las personas
    en la calle transversal tienen más probabilidades de apresurarse a cruzar la intersección
    antes de que la luz cambie a rojo".
- id: 218
  category: safe_driving_rules
  question: ¿Con cuánta anticipación deben señalizar todos los conductores antes de
    una intersección?
  choices:
    A: Al menos 50 pies.
    B: Al menos 100 pies.
    C: Al menos 200 pies.
    D: Al menos 500 pies.
  answer: B
  explanation: Según el manual, todos los conductores deben señalizar "Al menos a
    100 pies de una intersección".
- id: 219
  category: defensive_driving
  question: ¿Por qué debe girar físicamente la cabeza y mirar por encima del hombro
    antes de cambiar de carril?
  choices:
    A: Para revisar las señales de tráfico detrás de usted.
    B: Para asegurarse de que su luz de giro funcione correctamente.
    C: Para ver los vehículos en sus puntos ciegos que no se pueden ver a través de
      los espejos.
    D: Para medir su distancia de seguimiento con precisión.
  answer: C
  explanation: 'El manual establece: "Estas áreas se denominan ''puntos ciegos'' porque
    no se pueden ver a través de los espejos. Debe girar físicamente la cabeza y mirar
    para ver los vehículos en sus puntos ciegos".'
- id: 220
  category: vehicle_information
  question: ¿Cuál de las siguientes es una práctica recomendada al retroceder su vehículo?
  choices:
    A: Depender totalmente de sus espejos retrovisores y laterales.
    B: Colocar su brazo derecho en el respaldo del asiento del pasajero y mirar directamente
      a través de la ventana trasera.
    C: Retroceder lo más rápido posible para minimizar el tiempo que pasa en reversa.
    D: Tocar la bocina continuamente mientras retrocede.
  answer: B
  explanation: El manual aconseja "Colocar su brazo derecho en el respaldo del asiento
    del pasajero y darse la vuelta para poder mirar directamente a través de la ventana
    trasera. No dependa de los espejos retrovisores o laterales".
- id: 221
  category: defensive_driving
  question: ¿Durante qué dos meses ocurre el mayor número de choques entre automóviles
    y ciervos en Dakota del Sur?
  choices:
    A: Mayo y junio
    B: Julio y agosto
    C: Octubre y noviembre
    D: Diciembre y enero
  answer: C
  explanation: 'El manual indica: "Esté especialmente alerta a los ciervos en octubre
    y noviembre, los meses con el mayor número de choques entre automóviles y ciervos".'
- id: 222
  category: defensive_driving
  question: ¿Cuál es el segundo objeto con el que se choca más comúnmente en Dakota
    del Sur?
  choices:
    A: Peatones
    B: Bicicletas
    C: Ciervos
    D: Guardarraíles
  answer: C
  explanation: 'El manual establece explícitamente: "De hecho, los ciervos son el
    segundo objeto con el que se choca más comúnmente en Dakota del Sur..."'
- id: 223
  category: safe_driving_rules
  question: ¿Cuándo debe reducir su velocidad para una curva?
  choices:
    A: Mientras está en medio de la curva.
    B: Después de haber salido de la curva.
    C: Solo si la carretera está mojada o helada.
    D: Antes de entrar en la curva.
  answer: D
  explanation: 'El manual aconseja: "Reduzca siempre la velocidad antes de entrar
    en la curva a una velocidad segura..." También señala que frenar bruscamente después
    de entrar podría hacer que los neumáticos del vehículo pierdan tracción.'
- id: 224
  category: defensive_driving
  question: ¿Qué es el hidroplaneo (hydroplaning)?
  choices:
    A: Cuando los frenos de un vehículo fallan debido al sobrecalentamiento.
    B: Cuando los neumáticos de dirección comienzan a deslizarse sobre el agua acumulada,
      como si fueran esquís acuáticos.
    C: Cuando un vehículo pierde tracción sobre hielo negro.
    D: Cuando la visión del conductor se ve empañada por la lluvia intensa.
  answer: B
  explanation: El manual define el hidroplaneo como algo que ocurre "cuando los neumáticos
    de dirección comienzan a deslizarse sobre cualquier acumulación de agua, como
    la acción de los esquís acuáticos".
- id: 225
  category: driver_responsibility
  question: ¿Cuál es el tiempo promedio de percepción para que un conductor alerta
    reconozca que debe detenerse?
  choices:
    A: ¼ a ½ segundo
    B: ¾ a 1 segundo
    C: 1 a 2 segundos
    D: 2 a 3 segundos
  answer: B
  explanation: 'El manual establece: "El tiempo promedio de percepción para un conductor
    alerta es de ¾ de segundo a 1 segundo".'
- id: 226
  category: vehicle_information
  question: A 50 mph en pavimento seco con buenos frenos, ¿aproximadamente qué tan
    larga es la distancia de frenado?
  choices:
    A: 50 pies
    B: 100 pies
    C: 158 pies
    D: 250 pies
  answer: C
  explanation: El manual señala que "A 50 mph en pavimento seco con buenos frenos,
    puede tomar unos 158 pies" para que los frenos reduzcan la velocidad y detengan
    el vehículo.
- id: 227
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento recomendada que debe mantener
    entre su automóvil y el vehículo que tiene delante?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: 'El manual establece: "Intente siempre mantener una distancia mínima
    de seguimiento de 4 segundos entre su automóvil y el vehículo de adelante".'
- id: 228
  category: defensive_driving
  question: ¿Cuándo es especialmente importante revisar detrás de su vehículo al reducir
    la velocidad?
  choices:
    A: Al acercarse a un semáforo en verde.
    B: Al subir una colina empinada.
    C: Al reducir la velocidad rápidamente o en puntos donde un conductor que le sigue
      no lo esperaría.
    D: Al conducir en una autopista de varios carriles con poco tráfico.
  answer: C
  explanation: El manual establece que revisar detrás es "muy importante cuando reduce
    la velocidad rápidamente o en puntos donde un conductor que le sigue no esperaría
    que redujera la velocidad, como entradas privadas o espacios de estacionamiento".
- id: 229
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una forma aceptable de dar una señal de giro?
  choices:
    A: Parpadear los faros delanteros.
    B: Tocar la bocina dos veces.
    C: Usar una luz de señal eléctrica o el brazo y la mano izquierdos.
    D: Agitar el brazo derecho por la ventana.
  answer: C
  explanation: El manual especifica que la señal debe darse con "Una luz de señal
    eléctrica o el brazo y la mano izquierdos".
- id: 230
  category: defensive_driving
  question: ¿Qué debe hacer si ve el reflejo de los faros del vehículo en los ojos
    de un ciervo a un lado de la carretera?
  choices:
    A: Acelerar para pasar al ciervo rápidamente.
    B: Parpadear las luces altas y desviarse al otro carril.
    C: Apagar los faros para no cegar al ciervo.
    D: Reducir la velocidad, tocar la bocina y estar preparado para detenerse.
  answer: D
  explanation: 'El manual aconseja: "Si ve tal reflejo a un lado de la carretera,
    reduzca la velocidad. Toque la bocina y esté preparado para detenerse".'
- id: 231
  category: safe_driving_rules
  question: ¿Cómo puede determinar con precisión su distancia de seguimiento mientras
    conduce?
  choices:
    A: Estimar el número de largos de vehículo entre usted y el vehículo de adelante.
    B: Observar cuando el vehículo de adelante pasa por un punto fijo y contar los
      segundos hasta que usted llegue a él.
    C: Dividir su velocidad actual por 10 para calcular los segundos requeridos.
    D: Esperar hasta que el vehículo de adelante frene y medir su tiempo de reacción.
  answer: B
  explanation: Para determinar la distancia de seguimiento, observe cuando la parte
    trasera del vehículo de adelante pase por un punto fijo y cuente los segundos
    que le toma a usted llegar a ese mismo punto.
- id: 232
  category: sharing_the_road
  question: ¿Hasta qué distancia puede extenderse el punto ciego en la parte trasera
    de un camión grande?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: D
  explanation: El manual advierte que el punto ciego en la parte trasera de los camiones
    grandes puede extenderse por 200 pies, lo que significa que podrían detenerse
    repentinamente sin saber que usted está allí.
- id: 233
  category: sharing_the_road
  question: ¿Por qué es importante aumentar su distancia de seguimiento cuando circula
    detrás de una motocicleta o un ciclista?
  choices:
    A: Están obligados legalmente a conducir más lento que el resto del tráfico.
    B: Necesita distancia adicional para evitar golpear al conductor si este llegara
      a caerse.
    C: Tienen frenos más potentes y pueden detenerse mucho más rápido que los autos.
    D: Sus luces de freno suelen ser demasiado tenues para verse con claridad durante
      el día.
  answer: B
  explanation: Si un conductor de ciclo se cae, usted necesita distancia adicional
    para evitar golpearlo. Las probabilidades de una caída son mayores en carreteras
    mojadas, con hielo o grava, y en superficies metálicas.
- id: 234
  category: defensive_driving
  question: ¿Qué significa 'dividir la diferencia' (split the difference) al conducir?
  choices:
    A: Conducir exactamente al límite de velocidad entre dos intersecciones.
    B: Circular sobre la línea central cuando no hay tráfico en sentido contrario.
    C: Dirigirse por un camino intermedio entre dos peligros, dando más espacio al
      más peligroso.
    D: Rebasar a dos vehículos exactamente al mismo tiempo en una carretera de varios
      carriles.
  answer: C
  explanation: '''Dividir la diferencia'' significa dirigirse por un camino intermedio
    entre dos peligros. Si uno es más peligroso que el otro, debe dejar un poco más
    de espacio en el lado peligroso.'
- id: 235
  category: defensive_driving
  question: ¿Qué debe hacer si alguien lo sigue muy de cerca (tailgating) y no hay
    un carril derecho al cual cambiarse?
  choices:
    A: Tocar sus frenos rápidamente para advertir al conductor detrás de usted.
    B: Acelerar para aumentar la distancia entre sus vehículos.
    C: Esperar hasta que el camino de adelante esté despejado y sea legal rebasar,
      luego reducir lentamente su velocidad.
    D: Encender sus luces de emergencia y detenerse por completo en su carril.
  answer: C
  explanation: Si no hay un carril derecho, espere hasta que el camino de adelante
    esté despejado y sea legal rebasar, luego reduzca la velocidad lentamente. Esto
    anima al conductor que lo sigue de cerca a rebasarlo. Nunca debe frenar bruscamente
    para desanimar a alguien que lo sigue de cerca.
- id: 236
  category: safe_driving_rules
  question: A una velocidad de 55 mph, ¿aproximadamente cuánto tiempo y distancia
    necesita para rebasar a un vehículo que viene en sentido contrario de manera segura?
  choices:
    A: 5 segundos y 800 pies
    B: 10 segundos y más de 1600 pies (aproximadamente un tercio de milla)
    C: 15 segundos y media milla
    D: 20 segundos y una milla
  answer: B
  explanation: A 55 mph, necesita unos 10 segundos para rebasar. Debido a que tanto
    usted como el vehículo que viene en sentido contrario recorren más de 800 pies
    en 10 segundos, necesita más de 1600 pies o aproximadamente un tercio de milla
    para rebasar de manera segura.
- id: 237
  category: safe_driving_rules
  question: ¿No debe comenzar a rebasar a un vehículo si se encuentra a qué distancia
    de una colina o curva?
  choices:
    A: Un cuarto de milla
    B: Un tercio de milla
    C: Media milla
    D: Tres cuartos de milla
  answer: B
  explanation: Debe poder ver al menos a un tercio de milla o unos 10 segundos hacia
    adelante. No debe comenzar a rebasar si se encuentra a menos de un tercio de milla
    de una colina o curva.
- id: 238
  category: sharing_the_road
  question: ¿Por qué toma mucho más tiempo rebasar a un camión grande en comparación
    con un auto típico?
  choices:
    A: Los camiones generalmente viajan a velocidades más altas que los autos.
    B: Los camiones crean una corriente de aire que frena a los vehículos que los
      rebasan.
    C: Un camión de remolques múltiples puede medir 75 pies de largo o más.
    D: Los camiones están obligados legalmente a acelerar cuando son rebasados.
  answer: C
  explanation: Un auto típico mide 15 pies de largo, mientras que un camión de remolques
    múltiples puede medir 75 pies de largo o más. Por lo tanto, toma mucho más tiempo
    rebasar a un camión, y debe tener el camino despejado por delante.
- id: 239
  category: defensive_driving
  question: ¿Cómo debe manejar una situación en la que está rebasando a una bicicleta
    y un vehículo se aproxima en sentido contrario al mismo tiempo?
  choices:
    A: Acelerar para rebasar la bicicleta antes de que llegue el vehículo en sentido
      contrario.
    B: Tocar la bocina para que tanto el ciclista como el vehículo en sentido contrario
      se aparten.
    C: Pasar ajustadamente entre la bicicleta y el vehículo en sentido contrario.
    D: Reducir la velocidad y dejar que el vehículo en sentido contrario pase primero
      para poder darle espacio adicional a la bicicleta.
  answer: D
  explanation: Cuando sea posible, enfrente los peligros potenciales uno a la vez.
    Si está rebasando una bicicleta y se aproxima un vehículo en sentido contrario,
    reduzca la velocidad y deje que el vehículo pase primero para poder darle espacio
    adicional a la bicicleta.
- id: 240
  category: safe_driving_rules
  question: Si desea estacionarse en paralelo y hay tráfico viniendo por detrás, ¿cuál
    es el procedimiento adecuado?
  choices:
    A: Detenerse en el carril de tráfico y esperar a que los vehículos detrás de usted
      retrocedan.
    B: Poner su luz de giro, colocarse junto al espacio y permitir que los vehículos
      de atrás pasen antes de estacionarse.
    C: Entrar rápidamente en el espacio de estacionamiento sin señalizar para evitar
      retrasar el tráfico.
    D: Pasar de largo el espacio y buscar un lugar para estacionarse en una calle
      menos transitada.
  answer: B
  explanation: Si desea estacionarse en paralelo y hay tráfico viniendo por detrás,
    ponga la luz de giro, colóquese junto al espacio y permita que los vehículos de
    atrás pasen antes de estacionarse.
- id: 241
  category: sharing_the_road
  question: ¿A cuál de los siguientes peatones debería darle espacio adicional porque
    podrían tener dificultades para verlo?
  choices:
    A: Un peatón que viste ropa de colores brillantes.
    B: Un peatón con un paraguas frente a su cara.
    C: Un peatón que camina por una acera de frente al tráfico.
    D: Un peatón que espera en un cruce peatonal marcado con una señal de caminar.
  answer: B
  explanation: El manual menciona a los peatones con paraguas frente a sus caras o
    con sus sombreros calados como personas que podrían tener dificultades para verlo,
    y usted debería darles espacio adicional.
- id: 242
  category: defensive_driving
  question: ¿Por qué debería dejar espacio adicional frente a su vehículo cuando se
    detiene en una colina o pendiente?
  choices:
    A: Para permitir que los peatones crucen entre los vehículos.
    B: Porque el vehículo de adelante puede rodar hacia atrás cuando comience a moverse.
    C: Para tener espacio para dar una vuelta en U si es necesario.
    D: Porque mejora la eficiencia de combustible de su vehículo al acelerar.
  answer: B
  explanation: Cuando se detiene en una colina o pendiente, debe dejar espacio adicional
    porque el vehículo de adelante puede rodar hacia atrás cuando comience a moverse.
- id: 243
  category: defensive_driving
  question: ¿Qué debe hacer si tiene que lidiar con dos o más riesgos al mismo tiempo
    y no puede separarlos?
  choices:
    A: Acelerar para rebasar ambos peligros lo más rápido posible.
    B: Dar el mayor espacio al peligro más grave.
    C: Tocar la bocina y mantener su posición en el carril.
    D: Orillarse a un lado de la carretera y detenerse por completo.
  answer: B
  explanation: Una técnica de conducción defensiva es el compromiso. Cuando no puede
    separar los riesgos y debe lidiar con dos o más al mismo tiempo, comprométase
    dando el mayor espacio al peligro más grave.
- id: 244
  category: defensive_driving
  question: ¿Cuál de los siguientes es un ejemplo de la técnica de conducción defensiva
    llamada 'separar riesgos'?
  choices:
    A: Acelerar o reducir la velocidad para pasar a un corredor y a un camión que
      viene en sentido contrario uno a la vez.
    B: Acercarse a la línea central para evitar a un niño en bicicleta.
    C: Encender las luces de emergencia al conducir por una zona de construcción.
    D: Tocar la bocina a un vehículo que viene en sentido contrario mientras pasa
      a un peatón.
  answer: A
  explanation: Para separar los riesgos, usted toma los riesgos uno a la vez siempre
    que sea posible. Por ejemplo, puede acelerar o reducir la velocidad para pasar
    a los corredores antes o después de un camión que viene en sentido contrario,
    pasándolos uno a la vez.
- id: 245
  category: safe_driving_rules
  question: ¿Cuál es una buena regla a seguir con respecto al uso de los faros delanteros
    en condiciones de lluvia, nieve o niebla?
  choices:
    A: Si enciende los limpiaparabrisas, encienda los faros.
    B: Use solo sus luces de estacionamiento para evitar el deslumbramiento.
    C: Use siempre las luces altas para atravesar el clima.
    D: Encienda sus luces de emergencia en lugar de sus faros delanteros.
  answer: A
  explanation: En días de lluvia, nieve o niebla, a veces es difícil para otros conductores
    ver a los demás vehículos. Una buena regla a seguir es que si enciende los limpiaparabrisas,
    encienda los faros.
- id: 246
  category: safe_driving_rules
  question: Al conducir alejándose de un sol naciente o poniente, ¿por qué debería
    encender sus faros delanteros?
  choices:
    A: Para ayudarle a ver el camino por delante con más claridad.
    B: Porque lo exige la ley entre el amanecer y el atardecer.
    C: Para ayudar a los conductores que vienen hacia usted a ver su vehículo a pesar
      del resplandor.
    D: Para activar las luces de circulación diurna de su vehículo.
  answer: C
  explanation: Al conducir alejándose de un sol naciente o poniente, encienda los
    faros. Los conductores que vienen hacia usted pueden tener dificultades para ver
    el vehículo debido al resplandor, y los faros les ayudarán a verlo.
- id: 247
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar las luces altas de sus faros cuando se aproxima
    a un vehículo en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Debe bajar las luces altas siempre que se encuentre a menos de 500
    pies (aproximadamente la distancia de una cuadra) de un vehículo que viene en
    sentido contrario.
- id: 248
  category: safe_driving_rules
  question: ¿Bajo qué condiciones debería usar sus luces bajas en lugar de las luces
    altas?
  choices:
    A: En carreteras desconocidas por la noche.
    B: En la niebla, cuando está nevando o cuando llueve fuerte.
    C: Cuando no hay vehículos que vengan en sentido contrario.
    D: En zonas de construcción sin otro tráfico.
  answer: B
  explanation: Use las luces bajas en la niebla, cuando esté nevando o cuando esté
    lloviendo fuerte. La luz de las luces altas se reflejará, causando deslumbramiento
    y dificultando la visión hacia adelante.
- id: 249
  category: defensive_driving
  question: ¿Qué debe hacer si un conductor que se aproxima no baja sus faros?
  choices:
    A: Encender sus luces altas y dejarlas encendidas hasta que el vehículo pase.
    B: Mirar hacia el lado izquierdo de la carretera.
    C: Hacer un cambio de luces altas, y si aún no las bajan, mirar hacia el lado
      derecho de la carretera.
    D: Tocar la bocina con fuerza y frenar firmemente.
  answer: C
  explanation: Si un conductor que se aproxima no baja sus faros, haga un cambio de
    luces altas para avisarle. Si aún no baja las luces, mire hacia el lado derecho
    de la carretera para evitar ser deslumbrado.
- id: 250
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones debería tocar la bocina con un
    TOQUE FUERTE en lugar de un toque ligero?
  choices:
    A: Cuando un conductor no está prestando atención.
    B: Cuando está saliendo de un callejón estrecho.
    C: Cuando ha perdido el control del vehículo y se dirige hacia alguien.
    D: Al pasar a un conductor que comienza a girar hacia su carril.
  answer: C
  explanation: Debe tocar la bocina con un TOQUE FUERTE cuando otro vehículo esté
    en peligro de chocar con usted, o cuando haya perdido el control del vehículo
    y se dirija hacia alguien.
- id: 251
  category: safe_driving_rules
  question: ¿Cuándo es inapropiado usar la bocina?
  choices:
    A: Al acercarse a una colina empinada donde no se puede ver lo que hay adelante.
    B: Cerca de peatones ciegos o vehículos de tracción animal.
    C: Cuando una persona en bicicleta parece estar moviéndose hacia su carril.
    D: Cuando otro vehículo está en peligro de chocar con usted.
  answer: B
  explanation: No use la bocina cerca de peatones ciegos, vehículos de tracción animal
    o animales que estén siendo guiados en la calzada, ya que podría asustarlos o
    irritarlos.
- id: 252
  category: vehicle_information
  question: Si su vehículo se avería y debe detenerse, ¿cómo puede indicar una emergencia
    a otros conductores?
  choices:
    A: Pararse en la calzada y agitar los brazos.
    B: Encender las luces de estacionamiento y dejar el motor en marcha.
    C: Detenerse justo después de una colina para que los conductores puedan verlo
      al llegar a la cima.
    D: Levantar el capó o atar un paño blanco a la antena, al espejo lateral o a la
      manija de la puerta.
  answer: D
  explanation: Si tiene problemas con el vehículo, debe levantar el capó o atar un
    paño blanco a la antena, al espejo lateral o a la manija de la puerta para señalizar
    una emergencia.
- id: 253
  category: sharing_the_road
  question: ¿Cuál es la mejor manera de manejar cuando se conduce cerca del punto
    ciego de otro vehículo?
  choices:
    A: Permanecer en el punto ciego para que el otro conductor pueda revisar sus espejos.
    B: Acelerar o quedarse atrás para que el otro conductor pueda ver su vehículo
      más fácilmente.
    C: Tocar la bocina continuamente mientras esté en el punto ciego.
    D: Encender las luces altas para hacerse visible en sus espejos.
  answer: B
  explanation: No conduzca en el punto ciego de otro vehículo. Acelere o retroceda
    para que el otro conductor pueda ver su vehículo con mayor facilidad.
- id: 254
  category: sharing_the_road
  question: ¿Hasta qué distancia se extiende el punto ciego trasero (la "No Zone")
    de un camión grande?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: Un automóvil puede desaparecer de la vista del conductor de un camión
    hasta 200 pies por detrás del camión. Esta área es parte de lo que se llama la
    "No Zone" (Zona Prohibida).
- id: 255
  category: sharing_the_road
  question: ¿A qué distancia por delante de la cabina de un camión grande puede un
    automóvil desaparecer de la vista del conductor del camión?
  choices:
    A: Hasta 10 pies
    B: Hasta 20 pies
    C: Hasta 30 pies
    D: Hasta 50 pies
  answer: B
  explanation: Un automóvil puede desaparecer de la vista del conductor de un camión
    cuando se encuentra hasta a 20 pies por delante de la cabina. Esto es parte de
    la "No Zone" del camión.
- id: 256
  category: defensive_driving
  question: Según el manual, ¿cuál de los siguientes es un ejemplo de un conductor
    que podría estar confundido y causar una situación insegura?
  choices:
    A: Un conductor con placas de otro estado en una intersección complicada.
    B: Un repartidor mirando una tabla con sujetapapeles.
    C: Un trabajador de la construcción dirigiendo el tráfico.
    D: Un conductor rebasando a un corredor en una carretera de dos carriles.
  answer: A
  explanation: Las personas que pueden estar confundidas incluyen a quienes conducen
    autos con placas de otros estados (especialmente en intersecciones complicadas),
    turistas y conductores que buscan señales de las calles.
- id: 257
  category: vehicle_information
  question: ¿Cuándo es aceptable conducir solo con las luces de estacionamiento encendidas?
  choices:
    A: Durante el día cuando llueve ligeramente.
    B: Al amanecer o al atardecer antes de que oscurezca por completo.
    C: Cuando conduce en una zona urbana bien iluminada.
    D: Nunca; las luces de estacionamiento son solo para vehículos estacionados.
  answer: D
  explanation: No conduzca en ningún momento solo con las luces de estacionamiento
    encendidas. Las luces de estacionamiento son solo para estacionar. Siempre que
    sea necesario conducir con luces, use los faros delanteros.
- id: 258
  category: sharing_the_road
  question: ¿Qué es la "No Zone" detrás de un camión o autobús?
  choices:
    A: Hasta 50 pies detrás del vehículo
    B: Hasta 100 pies detrás del vehículo
    C: Hasta 200 pies detrás del vehículo
    D: Hasta 300 pies detrás del vehículo
  answer: C
  explanation: La "No Zone" incluye el área de hasta 200 pies detrás de un camión
    donde el conductor no puede ver su vehículo.
- id: 259
  category: sharing_the_road
  question: ¿Cuál es una buena regla general para determinar si el conductor de un
    camión o autobús puede ver su vehículo?
  choices:
    A: Si usted puede ver los faros del camión, ellos pueden verlo a usted.
    B: Si usted no puede ver al conductor del camión en su espejo lateral, él no puede
      verlo a usted.
    C: Si usted está a menos de 50 pies del camión, ellos pueden verlo.
    D: Si toca la bocina, siempre lo verán.
  answer: B
  explanation: 'Una buena regla general para los conductores que comparten la carretera
    con un camión o autobús es: si no puede ver al conductor del camión o autobús
    en su espejo lateral, él no puede verlo a usted.'
- id: 260
  category: defensive_driving
  question: Si hay una entrada para autos o una calle entre usted y el lugar donde
    desea girar, ¿cuándo debe activar su señal de giro?
  choices:
    A: 100 pies antes de la entrada para autos.
    B: Tan pronto como decida girar.
    C: Espere hasta haber pasado la entrada o la calle para señalizar.
    D: Señalizar continuamente durante 200 pies.
  answer: C
  explanation: Si hay calles, entradas para autos o accesos entre usted y el lugar
    donde desea girar, espere hasta haberlos pasado para señalizar, de modo que otros
    conductores no piensen que planea girar antes.
- id: 261
  category: defensive_driving
  question: ¿Cómo puede avisar a los conductores detrás de usted que está a punto
    de reducir la velocidad en un lugar inesperado?
  choices:
    A: Encender las luces de emergencia
    B: Presionar rápidamente el pedal del freno 3 o 4 veces
    C: Tocar la bocina dos veces
    D: Usar la señal manual de giro a la izquierda
  answer: B
  explanation: Si va a detenerse o reducir la velocidad en un lugar donde otro conductor
    no lo espera, presione rápidamente el pedal del freno 3 o 4 veces para avisar
    a quienes vienen detrás que está a punto de disminuir la velocidad.
- id: 262
  category: safe_driving_rules
  question: ¿Cuál es la señal manual y de brazo estándar para un giro a la derecha?
  choices:
    A: Mano apuntando recto hacia afuera
    B: Mano apuntando hacia abajo
    C: Mano apuntando hacia arriba
    D: Mover la mano en movimiento circular
  answer: C
  explanation: Al usar señales manuales y de brazo, la posición estándar para un giro
    a la derecha es con la mano apuntando hacia arriba.
- id: 263
  category: vehicle_information
  question: ¿Cuál es la pauta general para frenar en una emergencia si su vehículo
    está equipado con un sistema de frenos antibloqueo (ABS)?
  choices:
    A: Bombear los frenos rápidamente para evitar derrapes
    B: Presionar el pedal del freno con toda su fuerza y mantener la presión
    C: Tocar ligeramente los frenos mientras gira bruscamente
    D: Aplicar el freno de estacionamiento de inmediato
  answer: B
  explanation: Para vehículos con ABS, debe presionar el pedal del freno con toda
    su fuerza y mantener la presión. Es posible que sienta que el pedal vibra, lo
    cual es normal.
- id: 264
  category: defensive_driving
  question: ¿Cuáles son las tres opciones principales que tiene un conductor para
    evitar un choque o reducir su impacto?
  choices:
    A: Frenar, maniobrar el volante o acelerar
    B: Tocar la bocina, dar un volantazo o frenar
    C: Acelerar, poner punto muerto (neutral) o frenar
    D: Maniobrar el volante, señalizar o detenerse
  answer: A
  explanation: Existen tres opciones para evitar un choque o reducir su impacto. Estas
    opciones son frenar, maniobrar el volante o acelerar.
- id: 265
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si su vehículo comienza a derrapar?
  choices:
    A: Pisar los frenos a fondo
    B: Girar el volante en la dirección opuesta al derrape
    C: Dejar de presionar el freno o el acelerador
    D: Acelerar para recuperar la tracción
  answer: C
  explanation: Si el vehículo comienza a derrapar, debe dejar de presionar el freno
    o el acelerador y mirar hacia donde desea ir.
- id: 266
  category: defensive_driving
  question: ¿Cómo debe reaccionar si las ruedas de su vehículo se salen de la superficie
    pavimentada de la carretera y caen en una superficie irregular?
  choices:
    A: Girar el volante bruscamente por pánico para volver al pavimento de inmediato
    B: Frenar fuerte y detenerse en el arcén
    C: Acelerar para volver a la carretera rápidamente
    D: Reducir la velocidad gradualmente y volver al pavimento cuando sea seguro
  answer: D
  explanation: Si el vehículo se sale de la superficie pavimentada de la carretera,
    evite girar el volante bruscamente por pánico. Reduzca la velocidad gradualmente
    y, cuando sea seguro hacerlo, vuelva al pavimento.
- id: 267
  category: vehicle_information
  question: ¿Qué es lo primero que debe intentar si sus frenos dejan de funcionar
    mientras conduce?
  choices:
    A: Cambiar a reversa
    B: Apagar el motor de inmediato
    C: Tirar de la palanca del freno de estacionamiento o presionar el pedal de pie
      lentamente
    D: Bombear el pedal del acelerador
  answer: C
  explanation: Si los frenos dejan de funcionar, use el freno de estacionamiento.
    Tire de la palanca del freno de estacionamiento o presione el pedal de pie lentamente
    para no bloquear las ruedas traseras y causar un derrape.
- id: 268
  category: vehicle_information
  question: ¿Cómo reaccionarà un vehículo si se revienta un neumático delantero?
  choices:
    A: El vehículo se tambaleará y vibrará ligeramente
    B: El vehículo tirará con fuerza en la dirección del reventón
    C: El vehículo acelerará de forma incontrolada
    D: El vehículo tirará con fuerza en dirección opuesta al reventón
  answer: B
  explanation: Si se revienta un neumático delantero, el vehículo tirará con fuerza
    en la dirección del reventón.
- id: 269
  category: vehicle_information
  question: ¿Cuál de los siguientes es el procedimiento correcto si un neumático se
    revienta o se desinfla repentinamente?
  choices:
    A: Frenar fuerte de inmediato para detener el vehículo
    B: Sujetar el volante con firmeza, retirar el pie del acelerador y no frenar
    C: Girar el volante bruscamente hacia la derecha
    D: Acelerar para mantener el control del vehículo
  answer: B
  explanation: Si un neumático se revienta, sujete el volante con firmeza, mantenga
    el vehículo recto, reduzca la velocidad gradualmente retirando el pie del acelerador
    y no frene.
- id: 270
  category: vehicle_information
  question: ¿Qué debe hacer si el acelerador de su vehículo se atasca y el vehículo
    acelera sin control?
  choices:
    A: Apagar el motor y poner punto muerto (neutral)
    B: Aplicar el freno de estacionamiento con la mayor fuerza posible
    C: Cambiar a park (estacionamiento) mientras está en movimiento
    D: Bombear el pedal del freno rápidamente
  answer: A
  explanation: Si el vehículo acelera sin control, apague el motor, ponga punto muerto
    (neutral), busque una vía de escape, maniobre el volante con suavidad, frene suavemente
    y salga de la calzada.
- id: 271
  category: defensive_driving
  question: Si su vehículo se avería en la autopista, ¿dónde debe colocar las bengalas
    de emergencia para advertir a otros conductores?
  choices:
    A: De 50 a 100 pies detrás del vehículo
    B: De 100 a 150 pies detrás del vehículo
    C: De 200 a 300 pies detrás del vehículo
    D: Directamente al lado de la puerta del lado del conductor
  answer: C
  explanation: Intente advertir a otros usuarios de la vía que el vehículo está allí
    colocando bengalas de emergencia a unos 200 o 300 pies detrás del vehículo.
- id: 272
  category: safe_driving_rules
  question: ¿A qué distancia detrás de un vehículo averiado debe colocar las bengalas
    de emergencia?
  choices:
    A: De 50 a 100 pies
    B: De 100 a 200 pies
    C: De 200 a 300 pies
    D: De 300 a 400 pies
  answer: C
  explanation: El manual indica colocar las bengalas de emergencia a unos 200 o 300
    pies detrás del vehículo averiado para dar tiempo a otros conductores a cambiar
    de carril.
- id: 273
  category: vehicle_information
  question: ¿Qué es lo primero que debe hacer si sus faros delanteros se apagan repentinamente?
  choices:
    A: Salirse de la carretera inmediatamente
    B: Intentar accionar el interruptor de los faros varias veces
    C: Encender las luces intermitentes de emergencia
    D: Tocar la bocina para advertir a los demás
  answer: B
  explanation: Si los faros se apagan repentinamente, el primer paso recomendado por
    el manual es intentar accionar el interruptor de los faros varias veces.
- id: 274
  category: driver_responsibility
  question: ¿Por qué nunca debe conducir a la escena de un accidente o incendio solo
    para mirar?
  choices:
    A: Podrían pedirle que preste primeros auxilios
    B: Podría bloquear el paso a los vehículos de policía y de rescate
    C: Sus tarifas de seguro aumentarán
    D: Se considera una infracción de tránsito en movimiento
  answer: B
  explanation: El manual advierte que conducir a la escena de un desastre solo para
    mirar puede bloquear el paso a la policía, bomberos, ambulancias, grúas y otros
    vehículos de rescate.
- id: 275
  category: defensive_driving
  question: Si su vehículo es golpeado por detrás, ¿qué debe estar preparado para
    hacer?
  choices:
    A: Aplicar los frenos para no ser empujado contra otro vehículo
    B: Acelerar para minimizar el impacto
    C: Girar el volante bruscamente hacia la derecha
    D: Desabrocharse el cinturón de seguridad para escapar rápidamente
  answer: A
  explanation: Cuando lo golpean por detrás, su cuerpo es lanzado hacia atrás. Debe
    presionarse contra el asiento y el reposacabezas, y estar preparado para aplicar
    los frenos para no ser empujado contra otro vehículo.
- id: 276
  category: vehicle_information
  question: ¿Qué dispositivo de seguridad NO ayudará si su vehículo es golpeado por
    el costado?
  choices:
    A: Cinturones de regazo
    B: Cinturones de hombro
    C: Bolsas de aire delanteras (airbags)
    D: Reposacabezas
  answer: C
  explanation: El manual señala específicamente que si el vehículo es golpeado por
    el costado, las bolsas de aire delanteras no ayudarán en esta situación.
- id: 277
  category: safe_driving_rules
  question: ¿Por qué es importante apagar el encendido de los vehículos accidentados
    y evitar fumar cerca de ellos?
  choices:
    A: Para ahorrar la batería del vehículo
    B: Porque podría haberse derramado combustible, lo que hace que el fuego sea un
      peligro real
    C: Para evitar que las bolsas de aire se desplieguen tarde
    D: Porque los gases de escape son tóxicos
  answer: B
  explanation: En la escena de un accidente, debe apagar el encendido y no fumar porque
    podría haberse derramado combustible y el fuego es un peligro real.
- id: 278
  category: driver_responsibility
  question: Al prestar primeros auxilios en la escena de un accidente, ¿a quién debe
    ayudar primero?
  choices:
    A: Al conductor del otro vehículo
    B: A cualquier persona que no esté ya caminando y hablando
    C: A la persona que esté sangrando más
    D: A los niños y a los ancianos
  answer: B
  explanation: El manual indica ayudar primero a cualquier persona que no esté ya
    caminando y hablando, verificando la respiración y luego el sangrado.
- id: 279
  category: driver_responsibility
  question: ¿Qué debe darle de beber a una persona herida en la escena de un accidente?
  choices:
    A: Solo agua
    B: Una bebida caliente para prevenir el shock
    C: Una bebida azucarada para obtener energía
    D: No dé nada de beber a las personas heridas
  answer: D
  explanation: 'El manual establece explícitamente: ''No dé nada de beber a las personas
    heridas, ni siquiera agua''.'
- id: 280
  category: penalties_and_points
  question: Si daña un vehículo desatendido y no puede localizar al propietario, ¿qué
    debe hacer?
  choices:
    A: Dejar una nota y conducir a casa inmediatamente
    B: Contactar a las autoridades, dejar una nota y esperar a que lleguen las autoridades
    C: Esperar 15 minutos y luego irse si no aparece nadie
    D: Informarlo a su compañía de seguros dentro de las 24 horas
  answer: B
  explanation: Si daña un vehículo desatendido, debe contactar a las autoridades,
    dejar una nota con su información y esperar a que las autoridades lleguen a la
    escena.
- id: 281
  category: safe_driving_rules
  question: Según el manual de Dakota del Sur, ¿cuál es la infracción número uno que
    causa accidentes con lesiones y víctimas mortales?
  choices:
    A: Conducir bajo la influencia (DUI)
    B: Seguir demasiado de cerca
    C: Conducción descuidada
    D: No detenerse ante una señal o semáforo
  answer: C
  explanation: En la tabla de las 10 principales infracciones que causan accidentes
    con lesiones y víctimas mortales, la conducción descuidada ocupa el puesto número
    1.
- id: 282
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un peatón guiado por un perro o que lleva un bastón
    blanco está cruzando una calle?
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo y ceder el derecho de paso
    D: Maniobrar para rodearlo con cuidado
  answer: C
  explanation: Siempre debe ceder el derecho de paso a las personas con discapacidad
    visual. Cuando un peatón cruza guiado por un perro o lleva un bastón blanco, usted
    debe detenerse por completo.
- id: 283
  category: sharing_the_road
  question: ¿Por qué debe evitar tocar la bocina cerca de los ciclistas?
  choices:
    A: Es ilegal en zonas residenciales
    B: Puede asustarlos y hacer que se desvíen hacia su trayectoria
    C: Los ciclistas no pueden oír las bocinas por el ruido del tráfico
    D: Hará que frenen repentinamente
  answer: B
  explanation: Tocar la bocina para alertar de su presencia puede asustar a los ciclistas
    y hacer que se desvíen hacia su trayectoria y choquen.
- id: 284
  category: sharing_the_road
  question: ¿Por qué debe evitar reducir la velocidad o detenerse rápidamente cuando
    conduce delante de un ciclista?
  choices:
    A: Las bicicletas no están equipadas con frenos
    B: Los frenos de un vehículo motorizado son más potentes que los de una bicicleta
      y podría causar un choque
    C: El ciclista podría intentar rebasarlo por la derecha
    D: Es ilegal frenar repentinamente en un carril para bicicletas
  answer: B
  explanation: Debe evitar reducir la velocidad o detenerse rápidamente porque los
    frenos de un vehículo motorizado son más potentes que los de una bicicleta, lo
    que podría causar un choque.
- id: 285
  category: sharing_the_road
  question: ¿Bajo qué condición se le permite conducir en un sendero o carril designado
    para bicicletas?
  choices:
    A: Cuando el tráfico está muy congestionado
    B: Cuando está rebasando a un vehículo que circula despacio
    C: Al entrar o salir de un callejón o entrada privada
    D: Cuando necesite estacionarse por menos de 5 minutos
  answer: C
  explanation: No puede conducir en un sendero o carril designado para bicicletas
    a menos que esté entrando o saliendo de un callejón o entrada privada, realizando
    tareas oficiales, por indicación de un oficial de policía o si existe una emergencia.
- id: 286
  category: defensive_driving
  question: Si una colisión frontal es inevitable, ¿cuál es la mejor acción a tomar?
  choices:
    A: Girar el vehículo para intentar que sea un "golpe de refilón"
    B: Acelerar para atravesar el obstáculo
    C: Apagar el motor antes del impacto
    D: Levantar las manos para protegerse la cara
  answer: A
  explanation: Si el vehículo está a punto de ser golpeado por delante, es importante
    intentar que sea un "golpe de refilón" en lugar de ser golpeado de frente, girando
    el vehículo.
- id: 287
  category: sharing_the_road
  question: ¿Cuánta distancia de separación debe dejar un conductor al adelantar a
    una bicicleta si el límite de velocidad indicado es superior a 35 mph?
  choices:
    A: 3 pies
    B: 4 pies
    C: 5 pies
    D: 6 pies
  answer: D
  explanation: Un conductor debe permitir un mínimo de seis pies de separación al
    adelantar a una bicicleta si el límite indicado es superior a 35 millas por hora
    (mph).
- id: 288
  category: safe_driving_rules
  question: Al adelantar a una bicicleta que circula en la misma dirección, ¿se le
    permite al conductor cruzar la línea central de la carretera?
  choices:
    A: No, cruzar la línea central está estrictamente prohibido.
    B: Sí, pero solo si la bicicleta circula a menos de 15 mph.
    C: Sí, un vehículo motorizado puede cruzar parcialmente la línea central si se
      puede realizar de forma segura.
    D: No, a menos que el ciclista haga una señal para que el vehículo pase.
  answer: C
  explanation: Sin perjuicio de cualquier otra disposición legal, un vehículo motorizado
    que adelante a una bicicleta que circule en la misma dirección puede cruzar parcialmente
    la línea central de la carretera o la línea divisoria entre dos carriles de circulación
    si se puede realizar de forma segura.
- id: 289
  category: sharing_the_road
  question: 'Al conducir cerca de una motocicleta, usted debe:'
  choices:
    A: Compartir el carril con la motocicleta para mejorar el flujo del tráfico.
    B: Permitir al motociclista el ancho total de un carril.
    C: Adelantar a la motocicleta en el mismo carril si hay suficiente espacio.
    D: Conducir muy cerca de la motocicleta para protegerla de otros vehículos.
  answer: B
  explanation: Debe permitir al motociclista el ancho total de un carril y no compartir
    el carril. La motocicleta necesita espacio para que el motociclista reaccione
    ante el resto del tráfico.
- id: 290
  category: defensive_driving
  question: ¿Por qué no debe asumir que una motocicleta va a girar solo porque su
    luz direccional está parpadeando?
  choices:
    A: Las luces direccionales de las motocicletas se usan a menudo como luces de
      emergencia.
    B: Es posible que las luces direccionales de las motocicletas no se cancelen automáticamente
      y que el conductor haya olvidado apagarlas.
    C: Los motociclistas usan las luces direccionales para indicar que están reduciendo
      la velocidad.
    D: La luz direccional suele indicar que la motocicleta está cambiando de marcha.
  answer: B
  explanation: Es posible que las luces direccionales de las motocicletas no se cancelen
    automáticamente y que el motociclista haya olvidado apagarlas. Debe esperar para
    estar seguro de que el conductor va a girar antes de continuar.
- id: 291
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada al conducir detrás
    de un motociclista en condiciones normales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: Al seguir a un motociclista, deje una distancia de seguimiento mínima
    de 4 segundos o más en condiciones húmedas; de lo contrario, es posible que no
    tenga suficiente tiempo o espacio para evitar un choque.
- id: 292
  category: sharing_the_road
  question: ¿Qué son las "Zonas Prohibidas" (No-Zones) alrededor de camiones grandes
    y autobuses?
  choices:
    A: Áreas donde el estacionamiento está estrictamente prohibido.
    B: Carriles designados exclusivamente para vehículos comerciales.
    C: Puntos ciegos en los costados, la parte trasera y la parte delantera donde
      los vehículos desaparecen de la vista del conductor comercial.
    D: Áreas cerca de las estaciones de pesaje donde no se permite conducir automóviles.
  answer: C
  explanation: La Zona Prohibida (No-Zone) es el área alrededor de camiones grandes
    o autobuses donde los vehículos desaparecen de la vista del conductor comercial
    al entrar en los puntos ciegos. Estos se encuentran en los costados, la parte
    trasera y la parte delantera del vehículo grande.
- id: 293
  category: defensive_driving
  question: ¿Cómo puede saber si está conduciendo en el punto ciego lateral de un
    camión grande?
  choices:
    A: Está conduciendo exactamente a la misma velocidad que el camión.
    B: No puede ver la cara del conductor del camión en el espejo retrovisor lateral
      del camión.
    C: Las luces direccionales del camión están parpadeando.
    D: Se encuentra a menos de 50 pies de la parte trasera del camión.
  answer: B
  explanation: Si no puede ver la cara del conductor en el espejo retrovisor lateral,
    él no puede verlo a usted. Esto significa que se encuentra en su Zona Prohibida
    (No-Zone) lateral.
- id: 294
  category: safe_driving_rules
  question: Al rebasar un vehículo grande, ¿cuándo es seguro volver a colocarse delante
    de él?
  choices:
    A: Tan pronto como su parachoques trasero pase la parte delantera del camión.
    B: Cuando pueda ver toda la parte delantera del vehículo en su espejo retrovisor
      interior.
    C: Cuando el conductor del camión parpadee sus faros delanteros.
    D: Después de haber mantenido su velocidad durante al menos 5 segundos.
  answer: B
  explanation: Al rebasar un vehículo grande, busque ver toda la parte delantera del
    vehículo en el espejo retrovisor interior antes de colocarse delante y mantener
    la velocidad.
- id: 295
  category: defensive_driving
  question: ¿Por qué un camión grande podría abrirse hacia la izquierda antes de girar
    a la derecha?
  choices:
    A: Para permitir que los automóviles pasen por el lado derecho.
    B: Para librar con seguridad la esquina de un bordillo u otra obstrucción.
    C: Para ganar más velocidad antes de entrar en la intersección.
    D: Para revisar su punto ciego del lado derecho.
  answer: B
  explanation: Cuando un camión o autobús necesita girar a la derecha, el conductor
    a veces abrirá el vehículo hacia la izquierda para girar a la derecha de forma
    segura y librar la esquina de un bordillo u otra obstrucción.
- id: 296
  category: safe_driving_rules
  question: Al encontrarse con un camión grande que viene en dirección opuesta, ¿por
    qué debe mantenerse lo más a la derecha posible de la calzada?
  choices:
    A: Para darle espacio al camión para dar una vuelta en U.
    B: Para evitar un choque lateral y reducir la turbulencia del viento que empuja
      a los vehículos en direcciones opuestas.
    C: Para permitir que el conductor del camión vea su placa de matrícula.
    D: Para prepararse para orillarse y detenerse.
  answer: B
  explanation: Manténgase lo más a la derecha posible de la calzada para evitar un
    choque lateral y reducir la turbulencia del viento entre los dos vehículos, la
    cual empuja a los vehículos en direcciones opuestas.
- id: 297
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de las líneas de parada en las intersecciones
    al compartir la carretera con vehículos grandes?
  choices:
    A: Indican por dónde se permite cruzar a los peatones.
    B: Lo sitúan más atrás en una intersección para dar a los vehículos más grandes
      más espacio para girar.
    C: Marcan el área donde los camiones deben estacionarse.
    D: Muestran el punto exacto donde comienza el punto ciego de un camión.
  answer: B
  explanation: Muchas intersecciones están marcadas con líneas de parada para indicar
    dónde debe detenerse por completo. Estas líneas de parada ayudan a situarlo más
    atrás en una intersección para dar a los vehículos más grandes más espacio para
    girar.
- id: 298
  category: sharing_the_road
  question: ¿Por qué un ciclista podría no ser capaz de usar señales manuales al girar
    o detenerse?
  choices:
    A: Es ilegal que los ciclistas usen señales manuales en las autopistas principales.
    B: Los ciclistas solo están obligados a usar señales manuales por la noche.
    C: Las condiciones de la carretera o del tráfico pueden requerir que mantengan
      ambas manos en el manubrio.
    D: Las bicicletas están equipadas con señales de giro electrónicas que reemplazan
      las señales manuales.
  answer: C
  explanation: Tenga en cuenta que es posible que los ciclistas no puedan hacer señales
    si las condiciones de la carretera o del tráfico requieren que mantengan ambas
    manos en el manubrio.
- id: 299
  category: defensive_driving
  question: ¿Cómo pueden los conductores de automóviles ayudar a los conductores de
    camiones y autobuses que entran en una autopista desde un carril de aceleración?
  choices:
    A: Deteniéndose en la autopista para dejarlos entrar.
    B: Acelerando para rebasarlos lo más rápido posible.
    C: Tocando la bocina para que el conductor del camión sepa que están allí.
    D: Manteniendo la velocidad adecuada para el flujo del tráfico para permitirles
      entrar sin problemas.
  answer: D
  explanation: Los conductores de automóviles pueden ayudar a los conductores de camiones
    y autobuses que entran en una autopista manteniendo la velocidad adecuada para
    el flujo del tráfico. Esto permite que los camiones y autobuses entren sin problemas
    a la autopista sin tener que detenerse.
- id: 300
  category: sharing_the_road
  question: ¿Cuál es un indicio de que un camión o autobús está sufriendo una falla
    en los frenos y podría ser un vehículo fuera de control?
  choices:
    A: El vehículo toca la bocina continuamente.
    B: Sale humo de los frenos.
    C: El vehículo tiene las luces de emergencia parpadeando.
    D: El conductor está saludando por la ventana.
  answer: B
  explanation: Según el manual, un indicio de un camión o autobús fuera de control
    es que salga humo de los frenos. Si ve esto, debe apartarse del camino y no colocarse
    delante del vehículo.
- id: 301
  category: sharing_the_road
  question: 'Al conducir cerca de un autobús articulado, debe dejar suficiente espacio
    entre su vehículo y la parte trasera del autobús para permitir un giro de la parte
    trasera (tail swing) de aproximadamente:'
  choices:
    A: 1 pie
    B: 3 pies
    C: 5 pies
    D: 7 pies
  answer: B
  explanation: El manual establece que los autobuses articulados presentan un peligro
    adicional debido al giro de la parte trasera, que es de aproximadamente 3 pies.
    Los conductores deben dejar suficiente espacio para permitir este giro.
- id: 302
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando se aproxima un vehículo de emergencia con sus luces
    intermitentes y sirenas encendidas?
  choices:
    A: Acelerar para mantenerse por delante del vehículo de emergencia
    B: Detenerse inmediatamente en su carril actual
    C: Orillarse al borde de la carretera para que el vehículo pueda pasar
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: Como conductor, debe ceder el paso a un vehículo de emergencia cuando
    las luces intermitentes y las sirenas estén encendidas, orillándose al borde de
    la carretera para que el vehículo o vehículos de emergencia puedan pasar.
- id: 303
  category: driver_responsibility
  question: Si la policía lo detiene por la noche, ¿qué debe hacer para ayudar al
    oficial a ver el interior de su vehículo?
  choices:
    A: Encender las luces altas de sus faros
    B: Encender las luces interiores
    C: Alumbrar con una linterna por la ventana
    D: Salir del vehículo inmediatamente
  answer: B
  explanation: Durante una parada de tráfico por la noche, debe encender las luces
    interiores para ayudar al oficial a ver que todo está en orden dentro del vehículo.
- id: 304
  category: driver_responsibility
  question: 'Cuando un oficial de la ley le pida su licencia de conducir, comprobante
    de seguro y registro del vehículo durante una parada de tráfico, usted debe:'
  choices:
    A: Alcanzar rápidamente la guantera para sacarlos
    B: Decirle al oficial dónde se encuentran y alcanzarlos lentamente con una mano
      en el volante
    C: Salir del vehículo para entregar los documentos al oficial
    D: Desabrocharse el cinturón de seguridad inmediatamente para buscarlos debajo
      del asiento
  answer: B
  explanation: Si el oficial solicita estos documentos, debe decirle al oficial dónde
    se encuentran y alcanzarlos lentamente con una mano en el volante.
- id: 305
  category: signs_and_signals
  question: 'Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera de un vehículo indica que el vehículo:'
  choices:
    A: Transporta materiales peligrosos
    B: Viaja a menos de 25 mph
    C: Es un vehículo de emergencia respondiendo a una llamada
    D: Está averiado y esperando una grúa
  answer: B
  explanation: Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera de los vehículos significa que el vehículo viaja a menos de
    25 mph.
- id: 306
  category: sharing_the_road
  question: ¿Por qué debe evitar usar la bocina o acelerar el motor al rebasar un
    vehículo tirado por animales o a un jinete?
  choices:
    A: Es ilegal en zonas rurales
    B: Puede asustar al caballo y causar un choque
    C: Hará que el jinete acelere
    D: Interfiere con la audición del animal
  answer: B
  explanation: Al rebasar vehículos tirados por animales y jinetes, debe pasar con
    precaución y no usar la bocina ni acelerar el motor ('rev'), ya que esto puede
    asustar al caballo y causar un choque.
- id: 307
  category: defensive_driving
  question: Según el manual, ¿qué tanto más lejos le permiten ver las luces altas
    en comparación con las luces bajas?
  choices:
    A: El doble de lejos
    B: Tres veces más lejos
    C: Cuatro veces más lejos
    D: Una vez y media más lejos
  answer: A
  explanation: El manual establece que debe usar las luces altas siempre que no haya
    vehículos en sentido contrario, porque las luces altas le permiten ver el doble
    de lejos que las luces bajas.
- id: 308
  category: defensive_driving
  question: Si un vehículo que viene en sentido contrario se le aproxima por la noche
    con las luces altas encendidas, ¿hacia dónde debe mirar para evitar quedar momentáneamente
    cegado?
  choices:
    A: Directamente a los faros que se aproximan
    B: Hacia el lado izquierdo de la carretera
    C: Hacia el lado derecho de la carretera
    D: A su espejo retrovisor
  answer: C
  explanation: Si un vehículo viene hacia usted con las luces altas encendidas, mire
    hacia el lado derecho de la carretera para evitar distraerse o quedar momentáneamente
    cegado por sus faros.
- id: 309
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar al conducir con niebla, lluvia o nieve?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia (hazard lights)
  answer: B
  explanation: En condiciones de niebla, lluvia o nieve, use las luces bajas. La luz
    de las luces altas puede causar deslumbramiento y dificultar la visión hacia adelante.
- id: 310
  category: defensive_driving
  question: ¿Cuánto debe aumentar su distancia de seguimiento al conducir por carreteras
    desconocidas por la noche?
  choices:
    A: Al menos un segundo adicional
    B: Al menos dos segundos adicionales
    C: Al menos tres segundos adicionales
    D: Al menos cuatro segundos adicionales
  answer: B
  explanation: Debe aumentar la distancia de seguimiento agregando al menos un segundo
    adicional para las condiciones de conducción nocturna y al menos dos segundos
    adicionales para conducir en carreteras desconocidas por la noche.
- id: 311
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales de zona de obras?
  choices:
    A: Fondo amarillo con letras negras
    B: Fondo blanco con letras negras
    C: Fondo naranja con letras o símbolos negros
    D: Fondo rojo con letras blancas
  answer: C
  explanation: Al acercarse a una zona de obras, preste atención a las señales. Las
    señales de zona de obras tienen un fondo naranja y letras o símbolos negros.
- id: 312
  category: safe_driving_rules
  question: 'Al conducir por una zona de obras donde no hay trabajadores presentes
    en ese momento, usted debe:'
  choices:
    A: Mantener su velocidad normal de autopista
    B: Reducir siempre su velocidad
    C: Aumentar su velocidad para despejar el área rápidamente
    D: Moverse al arcén (hombro) de la carretera
  answer: B
  explanation: El manual instruye a los conductores a reducir siempre su velocidad
    en una zona de obras, incluso si no hay trabajadores presentes, porque los carriles
    más estrechos y el pavimento irregular pueden crear condiciones peligrosas.
- id: 313
  category: defensive_driving
  question: ¿Durante cuánto tiempo debe obedecer las señales de zona de obras publicadas?
  choices:
    A: Hasta que pase el primer vehículo de construcción.
    B: Hasta que vea una señal de "Fin de obras viales" (End Road Work).
    C: Durante exactamente dos millas después de la primera señal.
    D: Hasta que el límite de velocidad aumente por sí solo.
  answer: B
  explanation: El manual establece que se deben obedecer las señales de zona de obras
    publicadas hasta que vea la señal de "Fin de obras viales" (End Road Work).
- id: 314
  category: safe_driving_rules
  question: 'Al conducir por carreteras resbaladizas durante condiciones invernales,
    usted debe:'
  choices:
    A: Usar el control de crucero (cruise control) para mantener una velocidad constante.
    B: Nunca usar el control de crucero (cruise control).
    C: Solo usar el control de crucero en autopistas interestatales.
    D: Usar el control de crucero si viaja a menos de 35 mph.
  answer: B
  explanation: 'El manual establece explícitamente: "Nunca use el control de crucero
    en carreteras resbaladizas".'
- id: 315
  category: sharing_the_road
  question: En carreteras con un límite de velocidad publicado de 35 mph o más, ¿a
    qué distancia debe mantenerse detrás de un quitanieves con sus luces rojas o ámbar
    encendidas?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: C
  explanation: La ley exige que los conductores se mantengan al menos a 200 pies detrás
    de un quitanieves cuando sus luces rojas o ámbar estén encendidas, en carreteras
    con un límite de velocidad publicado de 35 mph o más.
- id: 316
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de viajar por una carretera cerrada
    y quedarse atascado durante una tormenta de nieve?
  choices:
    A: Se le dará prioridad para el rescate de emergencia.
    B: Podría recibir una multa y ser considerado responsable de los costos de rescate.
    C: Su vehículo será remolcado gratuitamente por el estado.
    D: Recibirá una advertencia pero no multas.
  answer: B
  explanation: Si viaja por una carretera cerrada y se queda atascado, podría recibir
    una multa y ser considerado responsable de cualquier costo relacionado con su
    rescate, el de los pasajeros o el del vehículo.
- id: 317
  category: safe_driving_rules
  question: 'Para evitar el deslumbramiento durante una tormenta de nieve nocturna,
    usted debe:'
  choices:
    A: Apagar sus faros delanteros.
    B: Usar las luces altas.
    C: Evitar el uso de luces altas.
    D: Usar solo las luces de emergencia (hazard lights).
  answer: C
  explanation: El manual aconseja encender los faros delanteros pero evitar el uso
    de luces altas durante una tormenta nocturna para prevenir el deslumbramiento.
- id: 318
  category: safe_driving_rules
  question: ¿Quién tiene generalmente el derecho de paso en un puente estrecho o de
    un solo carril?
  choices:
    A: El vehículo más grande.
    B: El vehículo que viaja a una velocidad mayor.
    C: El primer conductor en llegar al puente.
    D: El conductor a la derecha.
  answer: C
  explanation: Al cruzar puentes estrechos o de un solo carril, generalmente, el primer
    conductor que llega al puente tiene el derecho de paso.
- id: 319
  category: defensive_driving
  question: ¿Cómo debe manejar al conducir sobre rejillas abiertas de puentes o puentes
    de acero?
  choices:
    A: Aumentar su velocidad para cruzar rápidamente.
    B: Reducir la velocidad, aumentar la distancia de seguimiento y mantener un agarre
      firme en el volante.
    C: Frenar bruscamente antes de entrar al puente.
    D: Conducir lo más cerca posible de la línea central.
  answer: B
  explanation: Las rejillas abiertas de los puentes o los puentes de acero pueden
    reducir la tracción. Debe reducir la velocidad, aumentar la distancia de seguimiento
    y mantener un agarre firme en el volante.
- id: 320
  category: safe_driving_rules
  question: ¿Cómo debe aproximarse a una intersección no controlada en una carretera
    rural?
  choices:
    A: Mantener su velocidad ya que no hay señales de alto.
    B: Tocar la bocina y continuar sin detenerse.
    C: Reducir la velocidad y estar preparado para detenerse ante el tráfico que cruza
      o que viene en sentido contrario.
    D: Acelerar para despejar la intersección rápidamente.
  answer: C
  explanation: Al acercarse a una intersección rural no controlada, reduzca la velocidad
    y esté preparado para detenerse ante el tráfico que cruza o que viene en sentido
    contrario.
- id: 321
  category: alcohol_drugs_health
  question: ¿Cómo afectan el alcohol y otras drogas que alteran las facultades a sus
    habilidades de conducción?
  choices:
    A: Reducen su capacidad de juicio.
    B: Disminuyen su tiempo de reacción.
    C: Mejoran su capacidad de concentración.
    D: Mejoran su visión nocturna.
  answer: A
  explanation: Según la prueba de conocimientos del manual, el alcohol y otras drogas
    que alteran las facultades reducen su capacidad de juicio.
- id: 322
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla discontinua en su lado de la calzada?
  choices:
    A: Está prohibido adelantar en ambos lados.
    B: Se permite adelantar en ambos lados.
    C: Se permite adelantar en su lado.
    D: Se está aproximando a una zona escolar.
  answer: C
  explanation: Una línea amarilla discontinua en su lado de la calzada significa que
    se permite adelantar en su lado.
- id: 323
  category: safe_driving_rules
  question: 'Si llega a una intersección de cuatro vías controlada por señales de
    alto (stop) al mismo tiempo que otro conductor, usted debe:'
  choices:
    A: Continuar por la intersección de inmediato.
    B: Ceder el paso al conductor que esté a su derecha.
    C: Dejar que el conductor a su izquierda pase primero.
    D: Hacer parpadear sus luces delanteras para indicarles que pasen.
  answer: B
  explanation: Si llega a un alto de cuatro vías al mismo tiempo que otro conductor,
    debe ceder el paso al conductor que esté a su derecha.
- id: 324
  category: sharing_the_road
  question: 'Si un peatón está cruzando en medio de la calle, no en un paso de peatones,
    incluso si es ilegal, usted:'
  choices:
    A: Debe detenerse por ellos.
    B: No tiene que detenerse por ellos.
    C: Debe tocar la bocina y mantener la velocidad.
    D: Debe desviarse hacia el carril contrario para evitarlos.
  answer: A
  explanation: Incluso si un peatón está cruzando ilegalmente en medio de la calle,
    usted debe detenerse por él.
- id: 325
  category: sharing_the_road
  question: 'Los operadores de motocicletas tienen derecho a:'
  choices:
    A: Usar un carril de tráfico completo.
    B: Compartir un carril de tráfico con un vehículo estándar.
    C: Usar el arcén (hombro) de una carretera para adelantar.
    D: Circular por la acera si el tráfico es denso.
  answer: A
  explanation: Los operadores de motocicletas tienen derecho a usar un carril de tráfico
    completo.
- id: 326
  category: license_system
  question: ¿Cuándo puede un conductor de 20 años renovar su licencia de conducir?
  choices:
    A: En cualquier momento durante su vigésimo año.
    B: Seis meses antes de cumplir 21 años.
    C: Deben esperar hasta cumplir 21 años y tienen 30 días adicionales para renovar.
    D: Únicamente el día exacto de su vigésimo cumpleaños.
  answer: C
  explanation: El manual establece que las personas de 20 años deben esperar hasta
    cumplir 21 años y tienen 30 días adicionales para renovar.
- id: 327
  category: driver_testing
  question: ¿En cuál de los siguientes horarios NO se realizan exámenes de conducción
    en la estación de exámenes?
  choices:
    A: De 8:00 a.m. a 10:00 a.m.
    B: De 11:30 a.m. a 1:30 p.m.
    C: De 2:00 p.m. a 3:00 p.m.
    D: Los martes por la mañana.
  answer: B
  explanation: El manual especifica que no se realizan exámenes de conducción de 11:30
    a.m. a 1:30 p.m. ni dentro de la hora previa al cierre.
- id: 328
  category: license_system
  question: Según el manual, ¿dónde se encuentra la estación de exámenes de conducir
    de Vermillion?
  choices:
    A: 11 E Cherry St
    B: 60 Main Ave SE
    C: 200 E 3rd St
    D: 1401 Lazelle St
  answer: A
  explanation: El manual indica que la ubicación de la estación de exámenes de conducir
    de Vermillion es 11 E Cherry St (Hallmark Square).
- id: 329
  category: license_system
  question: ¿Qué edificio alberga la estación de exámenes de conducir de Vermillion?
  choices:
    A: Ayuntamiento (City Hall)
    B: Palacio de Justicia (Courthouse)
    C: Hallmark Square
    D: Centro Comunitario (Community Center)
  answer: C
  explanation: La estación de Vermillion se encuentra en 11 E Cherry St, en Hallmark
    Square.
- id: 330
  category: license_system
  question: ¿Cuál es la dirección de la estación de exámenes de conducir en Watertown?
  choices:
    A: 711 W 1st St, Suite 107
    B: 2001 9th Ave SW, Suite 100
    C: 3113 Spruce St, Suite 109
    D: 200 E 3rd St
  answer: B
  explanation: La ubicación de la estación de exámenes de conducir de Watertown figura
    como 2001 9th Ave SW, Suite 100.
- id: 331
  category: license_system
  question: ¿En qué edificio se encuentra la estación de exámenes de conducir en Wagner?
  choices:
    A: Hallmark Square
    B: Kanner Bldg
    C: Courthouse (Palacio de Justicia)
    D: City Hall (Ayuntamiento)
  answer: D
  explanation: La estación de Wagner se encuentra en 60 Main Ave SE, en el Ayuntamiento
    (City Hall).
- id: 332
  category: license_system
  question: ¿La estación de exámenes de conducir de qué ciudad se encuentra en 60
    Main Ave SE?
  choices:
    A: Wagner
    B: Watertown
    C: Webster
    D: Winner
  answer: A
  explanation: El manual indica que 60 Main Ave SE (City Hall) es la ubicación de
    la estación de exámenes de conducir de Wagner.
- id: 333
  category: license_system
  question: ¿Cuál es la dirección de la estación de exámenes de conducir de Webster?
  choices:
    A: 711 W 1st St, Suite 107
    B: 200 E 3rd St
    C: 1401 Lazelle St
    D: 3113 Spruce St, Suite 109
  answer: A
  explanation: La estación de exámenes de conducir de Webster se encuentra en 711
    W 1st St, Suite 107.
- id: 334
  category: license_system
  question: 'Al igual que la ubicación de Webster, la estación de exámenes de conducir
    de Winner también se encuentra en un:'
  choices:
    A: City Hall (Ayuntamiento)
    B: Community Center (Centro Comunitario)
    C: Hallmark Square
    D: Courthouse (Palacio de Justicia)
  answer: D
  explanation: La ubicación de Winner en 200 E 3rd St se encuentra en un Palacio de
    Justicia (Courthouse), al igual que la ubicación de Webster.
- id: 335
  category: license_system
  question: Una estación de exámenes de conducir se encuentra en 1401 Lazelle St.
    ¿En qué edificio está?
  choices:
    A: City Hall (Ayuntamiento)
    B: Community Center (Centro Comunitario)
    C: Courthouse (Palacio de Justicia)
    D: Kanner Bldg
  answer: B
  explanation: La ubicación en 1401 Lazelle St está en el Centro Comunitario (Community
    Center).
- id: 336
  category: license_system
  question: Según el texto del manual proporcionado, ¿cuál es la fecha de revisión
    de este documento?
  choices:
    A: 01/2020
    B: 06/2021
    C: 12/2021
    D: 06/2022
  answer: B
  explanation: El texto establece explícitamente "REVISADO 06/2021" en la parte inferior
    de la página.
- id: 337
  category: license_system
  question: ¿Cuál de las siguientes estaciones de exámenes de conducir se encuentra
    en una suite (oficina)?
  choices:
    A: Vermillion
    B: Wagner
    C: Watertown
    D: Winner
  answer: C
  explanation: La ubicación de Watertown está en 2001 9th Ave SW, Suite 100. Las ubicaciones
    de Vermillion, Wagner y Winner no incluyen un número de suite.
- id: 338
  category: license_system
  question: ¿Cuál de las siguientes direcciones es una ubicación válida para una estación
    de exámenes de conducir según el manual?
  choices:
    A: 11 W Cherry St
    B: 60 Main Ave NW
    C: 200 E 3rd St
    D: 1401 Spruce St
  answer: C
  explanation: 200 E 3rd St es la dirección correcta para la ubicación de Winner.
    Las otras son variaciones incorrectas de las direcciones listadas.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y continúe con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 339
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 340
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 341
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 342
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 343
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 344
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 345
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 346
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 347
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 348
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 349
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 350
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte sobre un cruce de peatones más adelante. Esté preparado para detenerse
    ante los peatones que crucen la calle.
  id: 351
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 352
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (roundabout) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 353
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 354
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 355
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 356
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (roundabout) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y esté preparado para que el camino
    gire primero en un sentido y luego en el otro.
  id: 357
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 358
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 359
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Esté preparado para una reducción del ancho de la carretera y ajuste
    su posición en el carril.
  id: 360
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 361
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico de doble sentido.
  id: 362
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de rebase más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 363
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 364
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 365
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 366
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 367
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 368
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de un camino lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde el camino lateral.
  id: 369
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril — no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir una incorporación. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 370
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 371
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 372
