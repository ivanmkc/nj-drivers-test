questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima que debe alcanzar una persona para solicitar un
    Permiso de Instrucción en Dakota del Sur?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: A
  explanation: Según el Manual del Conductor de Dakota del Sur, la edad mínima para
    solicitar un Permiso de Instrucción es de 14 años.
- id: 2
  category: license_system
  question: Si un conductor adolescente NO ha completado un curso de educación vial
    aprobado, ¿cuánto tiempo debe tener un Permiso de Instrucción de Dakota del Sur
    antes de solicitar un Permiso Restringido para Menores?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: En Dakota del Sur, si no ha completado un curso de educación vial aprobado,
    debe tener el Permiso de Instrucción durante al menos 180 días continuos.
- id: 3
  category: license_system
  question: 'El titular de un Permiso de Instrucción de Dakota del Sur debe estar
    supervisado por una persona que tenga al menos 18 años, haya tenido una licencia
    válida durante al menos un año y esté:'
  choices:
    A: Sentada en el asiento trasero
    B: En cualquier lugar del vehículo
    C: Ocupando el asiento al lado del conductor
    D: Monitoreando desde otro vehículo
  answer: C
  explanation: El conductor supervisor debe ocupar el asiento al lado del titular
    del permiso para proporcionar instrucción y asistencia inmediata.
- id: 4
  category: license_system
  question: ¿Cuáles son las horas de conducción restringidas para el titular de un
    Permiso Restringido para Menores de Dakota del Sur sin la presencia de un padre
    o tutor?
  choices:
    A: De 8 AM a 8 PM
    B: De 6 AM a 10 PM
    C: De 5 AM a 11 PM
    D: De 7 AM a 9 PM
  answer: B
  explanation: Un Permiso Restringido para Menores permite al titular conducir sin
    supervisión de 6 AM a 10 PM con el permiso de su padre o tutor.
- id: 5
  category: license_system
  question: ¿Cuál es la sanción por una primera condena por una infracción de tránsito
    mientras se tiene una GDL (Permiso de Instrucción o Restringido) de Dakota del
    Sur?
  choices:
    A: Una multa de $500
    B: Suspensión de los privilegios de conducir por 30 días
    C: Suspensión de los privilegios de conducir por 6 meses
    D: Repetición obligatoria únicamente del examen de conducir
  answer: B
  explanation: Bajo la ley de Dakota del Sur, una primera condena por una infracción
    de tránsito para un titular de GDL resulta en una suspensión de 30 días de los
    privilegios de conducir.
- id: 6
  category: license_system
  question: Para obtener una licencia de conducir de Dakota del Sur, ¿cuál es el requisito
    mínimo de visión (con o sin lentes correctivos)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Dakota del Sur requiere que los conductores tengan una visión de 20/40
    o mejor en al menos un ojo para calificar para una licencia sin restricciones.
- id: 7
  category: license_system
  question: ¿Cuántos documentos que acrediten la residencia en Dakota del Sur se requieren
    para solicitar una licencia REAL ID que cumpla con las normas federales?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene una tarjeta de Seguro Social
  answer: B
  explanation: Los solicitantes deben proporcionar dos documentos separados que demuestren
    su dirección física en Dakota del Sur para obtener una REAL ID.
- id: 8
  category: license_system
  question: ¿Cuál es el límite de Contenido de Alcohol en Sangre (BAC) para un conductor
    menor de 21 años en Dakota del Sur?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Dakota del Sur tiene una ley de "tolerancia cero" para menores, estableciendo
    el límite de BAC en 0.02% para cualquier persona menor de 21 años.
- id: 9
  category: license_system
  question: El titular de un Permiso Restringido para Menores NO puede llevar a más
    de ¿cuántos pasajeros que no sean miembros de la familia inmediata?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: La ley de Dakota del Sur restringe a los titulares de permisos a llevar
    solo un pasajero que no sea miembro de su familia inmediata.
- id: 10
  category: license_system
  question: ¿Cuántos días tiene para notificar al DMV de Dakota del Sur sobre un cambio
    de dirección después de mudarse?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Dakota del Sur exige que notifique al Programa de Licencias
    de Conducir sobre un cambio de dirección dentro de los 30 días.
- id: 11
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Operador Clase
    1 completa y sin restricciones en Dakota del Sur?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: Un conductor debe tener al menos 16 años y haber cumplido con todos
    los requisitos de los permisos de instrucción y restringidos para recibir una
    Licencia de Operador completa.
- id: 12
  category: license_system
  question: Si es menor de 18 años y desea solicitar un permiso, ¿de quién se requiere
    la firma en la solicitud?
  choices:
    A: El director de una escuela
    B: Un instructor de educación vial
    C: Un padre o tutor legal
    D: No se requiere firma si tiene un certificado de nacimiento
  answer: C
  explanation: Los solicitantes menores de 18 años deben contar con el consentimiento
    por escrito de un padre o tutor legal.
- id: 13
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar de Dakota
    del Sur antes de que expire?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: C
  explanation: En Dakota del Sur, una licencia de conducir estándar se emite generalmente
    por un período de 5 años.
- id: 14
  category: license_system
  question: ¿Cuál es la puntuación de aprobación para el examen de conocimientos escritos
    de Dakota del Sur?
  choices:
    A: 70% (18 de 25 correctas)
    B: 75% (19 de 25 correctas)
    C: 80% (20 de 25 correctas)
    D: 90% (23 de 25 correctas)
  answer: C
  explanation: El examen de conocimientos de Dakota del Sur consta de 25 preguntas
    y debe responder correctamente al menos 20 (80%) para aprobar.
- id: 15
  category: license_system
  question: 'Si tiene un Permiso de Instrucción de Dakota del Sur y completa un curso
    de educación vial aprobado, el período de espera se reduce de 180 días a:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Completar un curso de educación vial aprobado reduce el período de
    espera requerido para un Permiso de Instrucción de 180 días a 90 días.
- id: 16
  category: license_system
  question: ¿Cuántos días antes de que expire su licencia de conducir de Dakota del
    Sur se le permite renovarla?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: En Dakota del Sur, puede renovar su licencia de conducir hasta 180
    días (6 meses) antes de su fecha de vencimiento.
- id: 17
  category: license_system
  question: Si cambia legalmente su nombre por matrimonio o por orden judicial, ¿cuántos
    días tiene para solicitar un duplicado de la licencia de Dakota del Sur con el
    nuevo nombre?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Dakota del Sur exige que los conductores notifiquen al Departamento
    de Seguridad Pública y obtengan un duplicado de la licencia dentro de los 30 días
    posteriores a un cambio de nombre legal.
- id: 18
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de cobertura de seguro de responsabilidad
    civil para un vehículo motorizado registrado en Dakota del Sur?
  choices:
    A: 10/20/10 ($10k por lesiones corporales por persona / $20k por accidente / $10k
      por daños a la propiedad)
    B: 25/50/25 ($25k por lesiones corporales por persona / $50k por accidente / $25k
      por daños a la propiedad)
    C: 50/100/50 ($50k por lesiones corporales por persona / $100k por accidente /
      $50k por daños a la propiedad)
    D: 100/300/100 ($100k por lesiones corporales por persona / $300k por accidente
      / $100k por daños a la propiedad)
  answer: B
  explanation: La ley de Dakota del Sur exige un seguro de responsabilidad civil mínimo
    de $25,000 por lesiones corporales a una persona, $50,000 por lesiones corporales
    a dos o más personas y $25,000 por daños a la propiedad (25/50/25).
- id: 19
  category: license_system
  question: Según la Ley de Consentimiento Implícito (Implied Consent Law) de Dakota
    del Sur, ¿cuál es la sanción por negarse a someterse a una prueba química de alcohol
    o drogas si lo solicita un oficial?
  choices:
    A: Solo una multa de $500
    B: Una suspensión de la licencia por 30 días
    C: Una revocación de la licencia por 1 año
    D: Una sentencia de cárcel obligatoria de 48 horas
  answer: C
  explanation: Al conducir en Dakota del Sur, usted acepta someterse a pruebas químicas.
    La negativa a realizar la prueba resulta en la revocación de sus privilegios de
    conducir por 1 año.
- id: 20
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) en Dakota del Sur para operar un vehículo comercial en el comercio interestatal
    (a través de las fronteras estatales)?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Aunque puede obtener una CDL para conducir dentro del estado (intraestatal)
    a los 18 años, la ley federal exige que tenga al menos 21 años para conducir un
    vehículo comercial a través de las fronteras estatales (interestatal).
- id: 21
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un Permiso de Instrucción de Motocicleta
    de Dakota del Sur (Clase 2)?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: A
  explanation: En Dakota del Sur, una persona que tenga al menos 14 años puede solicitar
    un permiso de instrucción de motocicleta tras aprobar los exámenes de visión y
    conocimientos requeridos.
- id: 22
  category: license_system
  question: En Dakota del Sur, sus privilegios de conducción pueden ser suspendidos
    si es condenado por ¿cuántas infracciones de tránsito en movimiento dentro de
    un período de 12 meses?
  choices:
    A: 2 condenas
    B: 3 condenas
    C: 5 condenas
    D: 8 condenas
  answer: B
  explanation: El Departamento de Seguridad Pública de Dakota del Sur puede suspender
    la licencia de cualquier conductor que sea condenado por tres o más infracciones
    de tránsito en movimiento dentro de cualquier período de 12 meses.
- id: 23
  category: license_system
  question: ¿Cuál es el costo de un duplicado de la licencia de conducir de Dakota
    del Sur si la suya se pierde, es robada o destruida?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $28.00
  answer: C
  explanation: El costo de un duplicado de la licencia de conducir o tarjeta de identificación
    de Dakota del Sur es actualmente de $15.00.
- id: 24
  category: license_system
  question: Para que se agregue la designación de "Veterano" a una licencia de conducir
    de Dakota del Sur, ¿qué documento debe proporcionar el solicitante?
  choices:
    A: Una tarjeta de identificación militar
    B: Una carta del VA
    C: Un Formulario DD 214 (Documentación de baja)
    D: Un pasaporte estadounidense válido
  answer: C
  explanation: Para agregar el indicador de Veterano a una licencia de Dakota del
    Sur, el solicitante debe proporcionar un formulario DD-214 que muestre una baja
    honorable.
- id: 25
  category: license_system
  question: 'Según la ley de Dakota del Sur, solicitar una licencia de conducir o
    permiso registra automáticamente a los hombres de entre 18 y 25 años en:'
  choices:
    A: La Milicia Estatal
    B: El Registro de Votantes
    C: El Sistema de Servicio Selectivo (Selective Service System)
    D: La elegibilidad para el deber de jurado
  answer: C
  explanation: Bajo la ley SDCL 32-12-17.15, cualquier ciudadano estadounidense o
    inmigrante varón de entre 18 y 25 años que solicite una licencia o permiso consiente
    el registro en el Sistema de Servicio Selectivo.
- id: 26
  category: license_system
  question: 'Los conductores de Dakota del Sur pueden renovar su licencia en línea
    o por correo, pero deben renovarla en persona al menos una vez cada:'
  choices:
    A: 2 años
    B: 5 años
    C: 10 años
    D: 15 años
  answer: C
  explanation: Dakota del Sur permite la renovación en línea si renovó en persona
    la última vez. Debido a que las licencias son válidas por 5 años, esto significa
    que debe visitar una estación en persona al menos una vez cada 10 años.
- id: 27
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para todos los solicitantes que
    piden una licencia de conducir de Dakota del Sur por primera vez?
  choices:
    A: Proporcionar un número de Seguro Social
    B: Proporcionar un diploma de escuela secundaria
    C: Proporcionar un certificado de tipo de sangre
    D: Proporcionar una referencia de carácter
  answer: A
  explanation: Todos los solicitantes de una licencia de conducir de Dakota del Sur
    deben proporcionar su número de Seguro Social, el cual se verifica con la Administración
    del Seguro Social.
- id: 28
  category: license_system
  question: ¿Cuál es el cargo de restablecimiento para una licencia de conducir de
    Dakota del Sur que fue revocada debido a un DUI o una infracción relacionada con
    drogas?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: D
  explanation: El cargo de restablecimiento por revocaciones relacionadas con el alcohol
    o las drogas en Dakota del Sur es de $200.
- id: 29
  category: license_system
  question: ¿Cuál es el cargo de restablecimiento para una licencia de conducir de
    Dakota del Sur que fue suspendida por razones distintas a DUI, drogas o atrasos
    en la manutención infantil?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: Para la mayoría de las suspensiones generales (como múltiples infracciones
    de tránsito), el cargo de restablecimiento en Dakota del Sur es de $50.
- id: 30
  category: license_system
  question: 'Si usted no es ciudadano de los EE. UU. y solicita una licencia de Dakota
    del Sur, debe proporcionar prueba de:'
  choices:
    A: Empleo en el estado
    B: Estatus legal en los Estados Unidos
    C: Una licencia de conducir extranjera válida
    D: Propiedad de un vehículo
  answer: B
  explanation: Los no ciudadanos deben proporcionar documentos válidos del USCIS para
    demostrar su estatus legal en los Estados Unidos para ser elegibles para una licencia
    de conducir de Dakota del Sur.
- id: 31
  category: driver_testing
  question: ¿En Dakota del Sur, cuál es el límite de velocidad máximo en las autopistas
    interestatales rurales para vehículos de pasajeros?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: Según el Manual del Conductor de Dakota del Sur, el límite de velocidad
    máximo en las autopistas interestatales rurales es de 80 mph, a menos que se indique
    lo contrario.
- id: 32
  category: driver_testing
  question: Al estacionar su vehículo cerca de un hidrante de incendios en Dakota
    del Sur, ¿cuál es la distancia mínima requerida que debe mantener?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley de Dakota del Sur prohíbe estacionar a menos de 15 pies de un
    hidrante de incendios.
- id: 33
  category: driver_testing
  question: En Dakota del Sur, ¿se prohíbe estacionar a menos de cuántos pies de una
    señal de alto, una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Los conductores no pueden estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una carretera.
- id: 34
  category: driver_testing
  question: 'Según la ley de Dakota del Sur, se debe presentar un informe de accidente
    ante el Departamento de Seguridad Pública si el accidente resulta en lesiones,
    muerte o daños totales a la propiedad que superen los:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $2,500
  answer: B
  explanation: Los conductores deben informar cualquier accidente que resulte en lesiones,
    muerte o daños a la propiedad de $1,000 o más a la propiedad de una sola persona
    o $2,000 en total.
- id: 35
  category: driver_testing
  question: Al conducir de noche en Dakota del Sur, ¿debe bajar las luces altas cuando
    se encuentre a menos de cuántos pies de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Dakota del Sur exige que los conductores bajen las luces
    altas cuando estén a menos de 500 pies de un vehículo que se aproxima.
- id: 36
  category: driver_testing
  question: Al rebasar una bicicleta en Dakota del Sur en una carretera con un límite
    de velocidad de 35 mph o menos, ¿cuál es la distancia mínima de seguimiento/rebase
    requerida por la ley?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 6 pies
  answer: B
  explanation: La ley de Dakota del Sur exige un espacio mínimo de 3 pies al rebasar
    una bicicleta si el límite de velocidad es de 35 mph o menos. Si el límite de
    velocidad es superior a 35 mph, el requisito aumenta a 6 pies.
- id: 37
  category: driver_testing
  question: En Dakota del Sur, ¿es ilegal estacionar a menos de cuántos pies de un
    cruce de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: Está prohibido estacionar a menos de 20 pies de un cruce de peatones
    en una intersección.
- id: 38
  category: driver_testing
  question: ¿Cuál es la distancia mínima a la que debe estacionar del riel más cercano
    de un cruce de ferrocarril en Dakota del Sur?
  choices:
    A: 20 pies
    B: 30 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: Las regulaciones de Dakota del Sur establecen que no se puede estacionar
    a menos de 50 pies del riel más cercano de un cruce de ferrocarril.
- id: 39
  category: driver_testing
  question: ¿El Manual del Conductor de Dakota del Sur recomienda mantener una distancia
    de seguimiento de al menos cuántos segundos detrás del vehículo que va delante
    de usted?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: Dakota del Sur recomienda la 'regla de los tres segundos' para mantener
    una distancia de seguimiento segura en condiciones de conducción ideales.
- id: 40
  category: driver_testing
  question: ¿A qué velocidad puede comenzar el hidroplaneo (donde los neumáticos pierden
    contacto con la carretera en superficies mojadas) en Dakota del Sur?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: En Dakota del Sur, el hidroplaneo puede comenzar a velocidades tan
    bajas como 35 mph, y los neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 41
  category: driver_testing
  question: En Dakota del Sur, si conduce por una carretera con al menos dos carriles
    en cada dirección y un autobús escolar se detiene en la dirección opuesta con
    las luces rojas intermitentes y el brazo de parada extendido, ¿debe detenerse?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar.
    B: No, no es necesario detenerse si la carretera está dividida por una mediana
      o barrera.
    C: No, solo se detiene si hay niños presentes.
    D: Sí, a menos que viaje a más de 55 mph.
  answer: B
  explanation: En una carretera dividida con una barrera física o mediana, el tráfico
    que circula en la dirección opuesta a un autobús escolar detenido no está obligado
    a detenerse.
- id: 42
  category: driver_testing
  question: ¿Qué sucede con las multas por infracciones de tránsito en Dakota del
    Sur cuando la infracción ocurre en una zona de obras designada?
  choices:
    A: Las multas se triplican.
    B: Las multas se duplican.
    C: Las multas aumentan en $100.
    D: Las multas siguen siendo las mismas, pero los puntos se duplican.
  answer: B
  explanation: En Dakota del Sur, las multas por exceso de velocidad y otras infracciones
    de tránsito se duplican en las zonas de obras viales cuando hay trabajadores presentes.
- id: 43
  category: driver_testing
  question: Según el Manual del Conductor de Dakota del Sur, ¿cuál es la señal manual
    correcta para un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido hacia afuera.
    B: Brazo izquierdo extendido hacia abajo.
    C: Brazo izquierdo extendido hacia arriba.
    D: Brazo derecho extendido hacia afuera.
  answer: C
  explanation: La señal manual para un giro a la derecha es el brazo izquierdo y la
    mano extendidos hacia arriba.
- id: 44
  category: driver_testing
  question: Bajo la "Ley de Moverse a un Lado" (Move Over Law) de Dakota del Sur,
    ¿qué debe hacer un conductor al acercarse a un vehículo de emergencia autorizado
    que esté detenido y use señales visuales?
  choices:
    A: Detenerse inmediatamente en el carril de circulación.
    B: Mantener la velocidad pero tocar la bocina para alertar al oficial.
    C: Moverse a un carril que no sea adyacente al vehículo o reducir la velocidad
      a una velocidad segura si no es posible cambiar de carril.
    D: Acelerar para pasar el vehículo lo más rápido posible.
  answer: C
  explanation: La ley de Dakota del Sur exige que los conductores se muevan a un carril
    no adyacente o reduzcan la velocidad significativamente al pasar vehículos de
    emergencia detenidos con las luces activadas.
- id: 45
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en caminos no pavimentados (de grava) en Dakota del Sur?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 60 mph
  answer: C
  explanation: Según el Manual del Conductor de Dakota del Sur, el límite de velocidad
    máximo en caminos no pavimentados es de 55 mph, a menos que se indique lo contrario.
- id: 46
  category: driver_testing
  question: Al estacionar cerca de una intersección, ¿a cuántos pies de distancia
    como mínimo debe estar de una señal de alto (stop), una señal de ceda el paso
    (yield) o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Los conductores en Dakota del Sur no pueden estacionar a menos de 30
    pies de cualquier baliza intermitente, señal de alto, señal de ceda el paso o
    señal de control de tráfico ubicada al costado de una calzada.
- id: 47
  category: driver_testing
  question: 'Según la ley de Dakota del Sur, debe informar inmediatamente un accidente
    a la agencia policial más cercana si este resulta en daños a la propiedad de cualquier
    persona por un valor de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,500
  answer: B
  explanation: La ley de Dakota del Sur exige un informe inmediato de los accidentes
    que involucren lesiones, muerte o daños a la propiedad de $1,000 o más a la propiedad
    de una sola persona (o $2,000 en total).
- id: 48
  category: driver_testing
  question: En Dakota del Sur, ¿entre qué horarios es obligatorio encender los faros
    delanteros?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde 1/2 hora después del atardecer hasta 1/2 hora antes del amanecer
    C: Desde 1 hora después del atardecer hasta 1 hora antes del amanecer
    D: Solo cuando la visibilidad es inferior a 1,000 pies
  answer: B
  explanation: La ley de Dakota del Sur exige que los faros se enciendan desde media
    hora después del atardecer hasta media hora antes del amanecer, y en cualquier
    otro momento en que la visibilidad sea deficiente.
- id: 49
  category: driver_testing
  question: ¿Bajo qué condición específica se permite un giro a la izquierda con luz
    roja en Dakota del Sur?
  choices:
    A: Nunca está permitido
    B: Al girar desde una calle de doble sentido hacia una calle de un solo sentido
    C: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
    D: Cuando no viene tráfico desde la derecha
  answer: C
  explanation: En Dakota del Sur, un giro a la izquierda en rojo solo es legal cuando
    se gira desde una calle de un solo sentido hacia otra calle de un solo sentido
    después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 50
  category: driver_testing
  question: 'Se debe colocar un emblema de vehículo de movimiento lento (un triángulo
    naranja) en la parte trasera de cualquier vehículo diseñado para viajar a velocidades
    de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio para los
    vehículos que viajan a velocidades de 25 mph o menos, como maquinaria agrícola
    o equipos de construcción.
- id: 51
  category: driver_testing
  question: En Dakota del Sur, ¿con cuántos pies de antelación como mínimo debe señalizar
    su intención de girar antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Los conductores deben señalizar su intención de girar al menos 100
    pies antes de llegar a la intersección o al punto de giro.
- id: 52
  category: driver_testing
  question: 'Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    y el brazo de parada extendido en una carretera con una mediana física o barrera,
    el tráfico que viaja en la dirección opuesta debe:'
  choices:
    A: Detenerse al menos a 15 pies de distancia
    B: Detenerse solo si hay niños cruzando
    C: Reducir la velocidad a 15 mph y proceder con precaución
    D: Continuar sin detenerse
  answer: D
  explanation: En Dakota del Sur, si una carretera está dividida por una barrera física
    o mediana, el tráfico que viaja en la dirección opuesta a un autobús escolar no
    está obligado a detenerse.
- id: 53
  category: driver_testing
  question: 'Al acercarse a un vehículo de emergencia estacionado que utiliza señales
    visuales en una carretera de varios carriles, la ley de ''Hacerse a un lado''
    (Move Over) de Dakota del Sur le exige:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Cambiarse a un carril que no sea adyacente al vehículo de emergencia, si es
      seguro hacerlo
    C: Mantener su velocidad pero moverse al extremo izquierdo de su carril
    D: Aumentar la velocidad para pasar el vehículo de emergencia lo más rápido posible
  answer: B
  explanation: La ley de Dakota del Sur exige que los conductores se muevan a un carril
    que no sea adyacente al vehículo de emergencia o que reduzcan la velocidad significativamente
    si un cambio de carril no es posible o seguro.
- id: 54
  category: driver_testing
  question: ¿A menos de cuántos pies de un paso de peatones en una intersección no
    se permite estacionar su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: Según las regulaciones de estacionamiento de Dakota del Sur, no se
    puede estacionar a menos de 20 pies de un paso de peatones en una intersección.
- id: 55
  category: driver_responsibility
  question: ¿Dentro de cuántos días después de establecer su residencia deben los
    nuevos residentes de Dakota del Sur registrar y titular sus vehículos?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: La ley de Dakota del Sur exige que los nuevos residentes registren
    y titulen sus vehículos motorizados dentro de los 90 días posteriores al establecimiento
    de la residencia en el estado.
- id: 56
  category: driver_responsibility
  question: Bajo el sistema de puntos de Dakota del Sur, ¿cuántos puntos acumulados
    en un período de 12 meses resultarán en la suspensión de la licencia?
  choices:
    A: 10 puntos
    B: 12 puntos
    C: 15 puntos
    D: 20 puntos
  answer: C
  explanation: En Dakota del Sur, la licencia de conducir será suspendida si se acumulan
    15 puntos en cualquier período de 12 meses consecutivos.
- id: 57
  category: driver_responsibility
  question: Si un conductor de Dakota del Sur acumula 22 puntos en un período de 24
    meses, ¿cuál es la consecuencia?
  choices:
    A: Una carta de advertencia formal
    B: Reentrenamiento obligatorio para conductores
    C: Suspensión de la licencia
    D: Revocación permanente de la licencia
  answer: C
  explanation: La ley de Dakota del Sur exige la suspensión de la licencia para los
    conductores que acumulen 22 puntos en un período de 24 meses consecutivos.
- id: 58
  category: driver_responsibility
  question: En Dakota del Sur, ¿cuántos puntos se asignan a su historial de conducción
    por una condena de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 10 puntos
  answer: C
  explanation: Bajo el sistema de puntos de Dakota del Sur, la Conducción Temeraria
    es una infracción de alto puntaje y resulta en la adición de 8 puntos al historial
    del conductor.
- id: 59
  category: driver_responsibility
  question: 'Si es condenado por conducir sin seguro en Dakota del Sur, su licencia
    puede ser suspendida por un período de:'
  choices:
    A: De 7 a 14 días
    B: De 30 días a un año
    C: Exactamente seis meses
    D: Dos años
  answer: B
  explanation: No mantener la responsabilidad financiera (seguro) en Dakota del Sur
    puede llevar a una suspensión de la licencia que oscila entre 30 días y un año.
- id: 60
  category: driver_responsibility
  question: Los conductores a los que se les ha suspendido la licencia por falta de
    responsabilidad financiera deben mantener un certificado de seguro SR-22 ¿por
    cuánto tiempo?
  explanation: Dakota del Sur exige que los conductores presenten y mantengan un SR-22
    (Prueba de Responsabilidad Financiera) durante tres años después de una suspensión
    por infracciones relacionadas con el seguro o ciertas ofensas graves.
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
- id: 61
  category: driver_responsibility
  question: ¿En qué parte del vehículo es ilegal tener un recipiente de bebida alcohólica
    abierto mientras se circula por una carretera pública en Dakota del Sur?
  choices:
    A: Solo en el maletero
    B: En el área de pasajeros
    C: En la guantera
    D: Detrás del último asiento vertical de un vehículo con puerta trasera (hatchback)
  answer: B
  explanation: La ley de Dakota del Sur prohíbe la posesión de un recipiente de bebida
    alcohólica sin sellar o abierto en el área de pasajeros de cualquier vehículo
    motorizado en una carretera pública.
- id: 62
  category: driver_responsibility
  question: ¿Cuál es el valor en puntos asignado por una infracción estándar de "Exceso
    de velocidad" en Dakota del Sur?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: B
  explanation: Una condena estándar por exceso de velocidad en Dakota del Sur resulta
    en la adición de 2 puntos al registro del conductor.
- id: 63
  category: driver_responsibility
  question: 'Por una primera condena por conducir bajo la influencia (DUI) en Dakota
    del Sur, la licencia de conducir puede ser revocada por un período de al menos:'
  choices:
    A: 10 días
    B: 30 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Una condena por DUI por primera vez en Dakota del Sur conlleva un período
    de revocación de licencia obligatorio de no menos de 30 días, el cual puede extenderse
    hasta un año.
- id: 64
  category: driver_responsibility
  question: 'En Dakota del Sur, los niños deben estar asegurados en un sistema de
    retención infantil si son menores de:'
  choices:
    A: 4 años de edad
    B: 5 años de edad
    C: 8 años de edad
    D: 12 años de edad
  answer: B
  explanation: La ley de Dakota del Sur (SDCL 32-37-1) exige que cualquier niño menor
    de 5 años debe estar debidamente asegurado en un sistema de retención infantil.
- id: 65
  category: driver_responsibility
  question: Si usted está involucrado en un accidente donde el daño total a la propiedad
    de todos los vehículos y bienes es de ________ o más, debe presentar un informe
    ante el DMV si las autoridades no presentaron uno.
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $4,000
  answer: C
  explanation: En Dakota del Sur, si el daño total a la propiedad por un accidente
    alcanza los $2,000 o más, se debe presentar un informe ante el Departamento de
    Seguridad Pública/DMV.
- id: 66
  category: driver_responsibility
  question: Según la ley de Dakota del Sur, ¿cuál es la penalización en puntos por
    "No ceder el paso"?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Una condena por No ceder el paso en Dakota del Sur resulta en la asignación
    de 4 puntos contra la licencia de conducir.
- id: 67
  category: driver_responsibility
  question: En Dakota del Sur, ¿cuántas placas de matrícula deben exhibir la mayoría
    de los vehículos de pasajeros?
  choices:
    A: Una placa solo en la parte trasera
    B: Una placa solo en la parte delantera
    C: Dos placas, una en la parte delantera y otra en la trasera
    D: Dos placas, ambas en la parte trasera
  answer: C
  explanation: 'La ley de Dakota del Sur generalmente requiere que los vehículos motorizados
    exhiban dos placas de matrícula: una en la parte delantera y otra en la parte
    trasera del vehículo.'
- id: 68
  category: driver_responsibility
  question: 'Antes de dejar un vehículo motorizado desatendido en una carretera de
    Dakota del Sur, la ley exige que el conductor haga todo lo siguiente EXCEPTO:'
  choices:
    A: Poner el freno de manera efectiva
    B: Apagar el motor
    C: Quitar la llave del encendido
    D: Girar las ruedas hacia el bordillo independientemente de la pendiente
  answer: D
  explanation: La ley SDCL 32-30-5 exige que los conductores apaguen el motor, bloqueen
    el encendido, quiten la llave y pongan el freno. Aunque girar las ruedas es una
    práctica segura en colinas, la ley exige específicamente las tres primeras acciones
    para todos los vehículos desatendidos.
- id: 69
  category: driver_responsibility
  question: ¿Cuántos días tiene un nuevo residente para registrar su vehículo después
    de mudarse a Dakota del Sur?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Los nuevos residentes en Dakota del Sur deben registrar sus vehículos
    motorizados dentro de los 90 días posteriores al establecimiento de la residencia.
- id: 70
  category: driver_responsibility
  question: Al comprar un vehículo en Dakota del Sur, ¿dentro de cuántos días debe
    solicitar un título y pagar el impuesto especial sobre vehículos motorizados requerido?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: La ley de Dakota del Sur exige que se solicite el título del vehículo
    dentro de los 45 días posteriores a la fecha de compra para evitar cargos por
    pagos atrasados y multas.
- id: 71
  category: driver_responsibility
  question: ¿Cuál es la sanción por una primera condena por conducir sin el seguro
    de responsabilidad civil obligatorio en Dakota del Sur?
  choices:
    A: Solo una multa de $100
    B: Un delito menor de Clase 2, una multa de $500 y la suspensión de la licencia
      de 30 días a un año
    C: Una advertencia verbal y un período de gracia de 10 días para presentar la
      prueba
    D: El embargo permanente del vehículo
  answer: B
  explanation: Conducir sin seguro en Dakota del Sur es un delito menor de Clase 2.
    Las sanciones incluyen una multa de $500, hasta 30 días de cárcel y una suspensión
    obligatoria de la licencia de conducir por al menos 30 días (hasta un año).
- id: 72
  category: driver_responsibility
  question: Si su licencia de conducir de Dakota del Sur es suspendida por una violación
    de responsabilidad financiera, ¿por cuánto tiempo debe mantener una presentación
    de seguro SR-22?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores a los que se les ha suspendido la licencia por falta
    de seguro u otras infracciones específicas suelen estar obligados a mantener un
    certificado de responsabilidad financiera SR-22 durante 3 años.
- id: 73
  category: driver_responsibility
  question: Según la ley de "hacerse a un lado" (Move Over) de Dakota del Sur, ¿qué
    debe hacer un conductor al acercarse a un vehículo de emergencia detenido a un
    lado de una autopista de carriles múltiples con sus luces intermitentes encendidas?
  choices:
    A: Detenerse por completo en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina para alertar al oficial
    C: Cambiarse a un carril que no sea adyacente al vehículo de emergencia, si es
      seguro hacerlo
    D: Acelerar para pasar por el área lo más rápido posible
  answer: C
  explanation: La ley de Dakota del Sur exige que los conductores se cambien a un
    carril que no sea adyacente al vehículo de emergencia detenido en autopistas de
    carriles múltiples. Si cambiarse de carril no es posible o seguro, el conductor
    debe reducir la velocidad a una que sea segura para las condiciones.
- id: 74
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por una primera condena por arrojar basura desde
    un vehículo motorizado en Dakota del Sur?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Arrojar basura en Dakota del Sur es un delito menor de Clase 2, que
    conlleva una sanción máxima de una multa de $500 y/o 30 días de cárcel.
- id: 75
  category: driver_responsibility
  question: 'Una primera condena por DUI (conducir bajo la influencia) en Dakota del
    Sur puede resultar en la revocación de la licencia por un período de:'
  choices:
    A: 10 a 20 días
    B: 30 días a 1 año
    C: Exactamente 2 años
    D: De por vida
  answer: B
  explanation: Para una primera infracción de DUI en Dakota del Sur, el tribunal puede
    revocar la licencia de conducir por un período que oscila entre 30 días y un año.
- id: 76
  category: driver_responsibility
  question: 'La ley de Dakota del Sur exige que los niños utilicen un asiento de seguridad
    para el automóvil aprobado por el gobierno federal si:'
  choices:
    A: Tienen menos de 5 años de edad y pesan menos de 40 libras
    B: Tienen menos de 8 años de edad y pesan menos de 80 libras
    C: Tienen menos de 12 años de edad
    D: Miden menos de 4 pies de altura, independientemente de su edad
  answer: A
  explanation: La ley de Dakota del Sur exige que cualquier niño menor de 5 años,
    que pese menos de 40 libras, debe estar debidamente asegurado en un sistema de
    retención para niños.
- id: 77
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan a su historial de conducción de Dakota del
    Sur por violaciones de "señal de alto" o "semáforo"?
  choices:
    A: 1 punto
    B: 2 puntos
    '3': 3 puntos
    D: 5 puntos
  answer: '3'
  explanation: Pasarse una señal de alto o un semáforo en rojo en Dakota del Sur resulta
    en la asignación de 3 puntos contra la licencia de conducir.
- id: 78
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente en Dakota del Sur y la policía
    NO investiga, ¿cuándo debe presentar un informe por escrito al Departamento de
    Seguridad Pública?
  choices:
    A: Dentro de las 24 horas si los daños superan los $500
    B: Dentro de los 10 días si hay lesiones, muerte o daños totales a la propiedad
      de $2,000 o más
    C: Solo si alguien es hospitalizado
    D: Nunca se requieren informes si la policía no asiste
  answer: B
  explanation: Si un accidente no es investigado por las autoridades y resulta en
    lesiones, muerte o daños a la propiedad de $2,000 o más, el conductor debe presentar
    un informe por escrito en un plazo de 10 días.
- id: 79
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar de Dakota del Sur
    cuando hay niños presentes o cuando una luz de advertencia está parpadeando?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: En Dakota del Sur, el límite de velocidad en las zonas escolares es
    de 15 mph cuando hay niños presentes o cuando lo indican las luces intermitentes.
- id: 80
  category: safe_driving_rules
  question: ¿A cuántos pies de una señal de alto, señal de ceda el paso o señal de
    control de tráfico no se permite estacionar su vehículo en Dakota del Sur?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: De acuerdo con el Manual del Conductor de Dakota del Sur, no debe estacionarse
    a menos de 30 pies de cualquier baliza intermitente oficial, señal de alto, señal
    de ceda el paso o señal de control de tráfico.
- id: 81
  category: safe_driving_rules
  question: 'En Dakota del Sur, se prohíbe realizar un giro en U en una curva o cerca
    de la cima de una colina donde su vehículo no pueda ser visto por otros conductores
    que se aproximen desde cualquier dirección dentro de:'
  choices:
    A: 500 pies
    B: 700 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley de Dakota del Sur prohíbe los giros en U en curvas o colinas
    donde el vehículo no pueda ser visto por otros dentro de los 1,000 pies.
- id: 82
  category: safe_driving_rules
  question: ¿En Dakota del Sur, a cuántos pies de una intersección o cruce de ferrocarril
    no se le permite rebasar a otro vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Se prohíbe a los conductores rebasar cuando se encuentran a menos de
    100 pies de una intersección o un cruce de ferrocarril.
- id: 83
  category: safe_driving_rules
  question: 'La ley ''Move Over'' (hacerse a un lado) de Dakota del Sur exige que
    los conductores que se aproximen a un vehículo de emergencia detenido con las
    luces intermitentes encendidas deben:'
  choices:
    A: Detenerse por completo hasta que el vehículo se retire
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Cambiarse a un carril que no sea adyacente al vehículo o reducir la velocidad
      a una velocidad segura si no es posible cambiar de carril
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley de Dakota del Sur exige que los conductores se muevan a un carril
    no adyacente o reduzcan la velocidad significativamente al acercarse a vehículos
    de emergencia o de mantenimiento detenidos con luces intermitentes.
- id: 84
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una carretera estatal de dos carriles no dividida en Dakota del Sur?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: C
  explanation: El límite de velocidad predeterminado en las carreteras estatales de
    Dakota del Sur es de 65 mph, a menos que las señales indiquen lo contrario.
- id: 85
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura detrás del vehículo
    que va delante de usted en Dakota del Sur, debe utilizar la:'
  choices:
    A: Regla de un largo de auto
    B: Regla de los dos segundos
    C: Regla de los tres segundos
    D: Regla de los cinco segundos
  answer: C
  explanation: El Manual del Conductor de Dakota del Sur recomienda una distancia
    de seguimiento de al menos tres segundos en condiciones normales de conducción.
- id: 86
  category: safe_driving_rules
  question: En Dakota del Sur, ¿a cuántos pies de la entrada de la entrada para vehículos
    de cualquier estación de bomberos no puede estacionar su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: Es ilegal estacionar a menos de 20 pies de la entrada de una estación
    de bomberos en el mismo lado de la calle.
- id: 87
  category: safe_driving_rules
  question: Según el Manual del Conductor de Dakota del Sur, ¿a qué velocidad pueden
    sus neumáticos comenzar a experimentar 'hidroplaneo' (perder contacto con la carretera)
    bajo una lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El manual establece que el hidroplaneo parcial puede comenzar a velocidades
    tan bajas como 35 mph.
- id: 88
  category: safe_driving_rules
  question: 'En Dakota del Sur, debe encender sus faros delanteros si no puede ver
    claramente a personas o vehículos durante al menos:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: A
  explanation: La ley de Dakota del Sur exige el uso de faros delanteros cuando la
    visibilidad se reduce a 200 pies o menos debido al clima o la oscuridad.
- id: 89
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    un distrito comercial urbano de Dakota del Sur?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Según el Manual del Conductor de Dakota del Sur, el límite de velocidad
    en un distrito comercial es de 20 mph, a menos que se indique lo contrario.
- id: 90
  category: safe_driving_rules
  question: Según el Manual del Conductor de Dakota del Sur, ¿cuál es la distancia
    de seguimiento recomendada detrás del vehículo que va delante de usted?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Dakota del Sur recomienda una distancia de seguimiento de al menos
    3 segundos para permitir suficiente tiempo para reaccionar ante peligros.
- id: 91
  category: safe_driving_rules
  question: 'Si conduce por una carretera de dos carriles y se aproxima a un autobús
    escolar con luces rojas intermitentes y un brazo de parada extendido, usted debe:'
  choices:
    A: Detenerse solo si viaja en la misma dirección que el autobús
    '0': Reducir la velocidad y pasar con precaución
    C: Detenerse independientemente de su dirección de viaje
    D: Detenerse solo si hay niños cruzando la carretera en ese momento
  answer: C
  explanation: En una carretera de dos carriles, el tráfico en ambas direcciones debe
    detenerse ante un autobús escolar con luces rojas intermitentes y un brazo de
    parada extendido.
- id: 92
  category: safe_driving_rules
  question: ¿En una intersección no controlada donde dos vehículos llegan al mismo
    tiempo, qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a una velocidad mayor
    D: El conductor que circula por la carretera más grande
  answer: B
  explanation: En South Dakota, en una intersección no controlada, el conductor del
    vehículo de la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 93
  category: safe_driving_rules
  question: Según la ley de South Dakota, ¿qué sucede con la multa por una infracción
    de exceso de velocidad en una zona de obras designada cuando hay trabajadores
    presentes?
  choices:
    A: Se exonera la multa para quienes cometen la infracción por primera vez
    B: La multa se duplica
    C: La multa se triplica
    D: La multa sigue siendo la misma que una infracción estándar
  answer: B
  explanation: Las multas por exceso de velocidad se duplican en las zonas de obras
    de South Dakota cuando hay trabajadores presentes y la zona está debidamente señalizada.
- id: 94
  category: safe_driving_rules
  question: 'Al adelantar a otro vehículo en una carretera de dos carriles, no debe
    regresar al carril derecho hasta que:'
  choices:
    A: Esté a 10 pies por delante del vehículo adelantado
    B: Encienda su luz direccional derecha
    C: Pueda ver los faros delanteros del vehículo adelantado en su espejo retrovisor
    D: El vehículo adelantado toque la bocina
  answer: C
  explanation: Para garantizar una distancia segura, no debe volver al carril derecho
    hasta que pueda ver los faros delanteros del vehículo que acaba de adelantar en
    su espejo retrovisor.
- id: 95
  category: defensive_driving
  question: Para evitar la necesidad de frenar o girar en el último momento en South
    Dakota, ¿con cuánta anticipación debe observar el camino?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 25 segundos
    D: Solo una cuadra de la ciudad
  answer: B
  explanation: Las pautas de conducción defensiva de South Dakota sugieren mirar de
    10 a 15 segundos hacia adelante para anticipar peligros y cambios en el flujo
    del tráfico.
- id: 96
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (pérdida de contacto de
    los neumáticos con la carretera debido al agua) en las condiciones climáticas
    de South Dakota?
  choices:
    A: Tan baja como 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente a 45 mph
    D: Solo durante tormentas eléctricas intensas
  answer: A
  explanation: El Manual del Conductor de South Dakota advierte que el hidroplaneo
    puede comenzar a velocidades tan bajas como 35 mph, y a 50 mph, los neumáticos
    pueden perder todo contacto con la carretera.
- id: 97
  category: defensive_driving
  question: Al conducir con niebla densa en South Dakota, ¿qué ajuste de faros delanteros
    debe utilizar?
  choices:
    A: Luces altas para ver más lejos
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: No se requieren luces durante el día
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en las gotas de agua, lo que causa deslumbramiento y dificulta la visión.
- id: 98
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera helada de South Dakota,
    ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección en la que derrapa la parte trasera del vehículo
    D: Poner el vehículo en punto muerto (neutral) y apagar el motor
  answer: C
  explanation: Para recuperarse de un derrape, debe evitar frenar y girar el volante
    en la dirección en la que se desliza la parte trasera del vehículo.
- id: 99
  category: defensive_driving
  question: En South Dakota, ¿cuándo debe usar su luz direccional antes de realizar
    un giro o cambiar de carril?
  choices:
    A: Al menos 50 pies antes del giro
    B: Al menos 100 pies antes del giro
    C: Al menos 200 pies antes del giro
    D: Solo cuando haya otros vehículos presentes
  answer: B
  explanation: La ley de South Dakota 32-26-18.1 exige que los conductores señalen
    su intención de girar continuamente durante al menos los últimos 100 pies recorridos
    antes de girar.
- id: 100
  category: defensive_driving
  question: Al conducir en una interestatal de South Dakota con un límite de velocidad
    de 80 mph, ¿cuál es la forma más segura de manejar una 'Zona Ciega' (No-Zone)
    alrededor de un camión comercial grande?
  choices:
    A: Seguir de cerca al camión para mantenerse en su estela
    B: Conducir junto a la cabina del camión durante períodos prolongados
    C: Evitar permanecer en las áreas directamente detrás, delante o a ambos lados
      del camión
    D: Hacer parpadear sus luces altas hasta que el camión se mueva
  answer: C
  explanation: La 'Zona Ciega' (No-Zone) se refiere a los grandes puntos ciegos alrededor
    de los camiones. Los conductores defensivos evitan estas áreas para asegurar que
    el conductor del camión pueda verlos.
- id: 101
  category: defensive_driving
  question: 'Según la ley de Dakota del Sur, NO es obligatorio detenerse ante un autobús
    escolar con las luces rojas intermitentes y el brazo de parada extendido si:'
  choices:
    A: Usted viaja en la dirección opuesta en una carretera de dos carriles
    B: El autobús está detenido en una zona escolar
    C: Usted viaja en la dirección opuesta en una autopista dividida con una mediana
      o barrera física
    D: No hay niños visibles en la acera
  answer: C
  explanation: Los conductores no necesitan detenerse ante un autobús escolar si se
    encuentran en el lado opuesto de una autopista dividida donde los carriles están
    separados por una barrera física o mediana.
- id: 102
  category: defensive_driving
  question: ¿Cuál es la regla del 'punto ciego' para las distancias de seguimiento
    cuando se circula detrás de una motocicleta en Dakota del Sur?
  choices:
    A: Seguir más de cerca que a un automóvil porque se detienen más lento
    B: Permitir una distancia de seguimiento de cuatro segundos para tener en cuenta
      la capacidad de la motocicleta para detenerse rápidamente
    C: Compartir siempre el carril con la motocicleta
    D: Las motocicletas no tienen puntos ciegos
  answer: B
  explanation: El manual de Dakota del Sur sugiere aumentar la distancia de seguimiento
    detrás de las motocicletas a al menos cuatro segundos porque pueden detenerse
    mucho más rápido que los automóviles y son fácilmente ocultadas por los peligros
    de la carretera.
- id: 103
  category: defensive_driving
  question: 'Al entrar en una rotonda en Dakota del Sur, las reglas de conducción
    defensiva dictan que debe ceder el derecho de paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo
    C: Nadie; usted tiene el derecho de paso al entrar
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: En las rotondas de Dakota del Sur, el tráfico que entra debe ceder
    siempre el paso al tráfico que ya está circulando en la rotonda.
- id: 104
  category: defensive_driving
  question: Si sus frenos fallan mientras conduce en Dakota del Sur, ¿cuál es la primera
    acción defensiva que debe tomar?
  choices:
    A: Cambiar a punto muerto (neutral) y apagar la llave
    B: Bombear el pedal del freno varias veces para aumentar la presión
    C: Tirar inmediatamente del freno de emergencia a alta velocidad
    D: Saltar del vehículo
  answer: B
  explanation: Si los frenos fallan, primero debe bombear el pedal del freno varias
    veces. Si eso no funciona, use el freno de estacionamiento gradualmente y cambie
    a una marcha más baja.
- id: 105
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a producirse el hidroplaneo (hydroplaning)
    en carreteras mojadas de Dakota del Sur con neumáticos estándar?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo (donde los neumáticos pierden contacto con la carretera
    y se deslizan sobre una capa de agua) puede comenzar a velocidades tan bajas como
    35 mph.
- id: 106
  category: defensive_driving
  question: Según la ley de Dakota del Sur, ¿durante qué período de tiempo se permite
    a los automovilistas utilizar neumáticos para nieve con clavos?
  choices:
    A: Del 1 de noviembre al 31 de marzo
    B: Del 1 de octubre al 30 de abril
    C: Del 15 de octubre al 15 de abril
    D: Del 1 de septiembre al 31 de mayo
  answer: B
  explanation: Bajo la ley SDCL 32-19-3, es legal operar un vehículo motorizado con
    neumáticos con clavos entre el 1 de octubre y el 30 de abril.
- id: 107
  category: defensive_driving
  question: Al acercarse a un vehículo de emergencia estacionado con sus luces intermitentes
    encendidas en una carretera interestatal de Dakota del Sur, ¿qué debe hacer?
  choices:
    A: Mantener la velocidad pero moverse al carril izquierdo
    B: Detenerse inmediatamente en el carril de circulación
    C: Moverse al carril que no sea adyacente al vehículo y reducir la velocidad
    D: Tocar la bocina para que los trabajadores de emergencia sepan que está pasando
  answer: C
  explanation: La ley de 'Moverse a un lado' (Move Over law) de Dakota del Sur (SDCL
    32-30-6.1) exige que los conductores se muevan al carril no adyacente en autopistas
    de varios carriles o que reduzcan la velocidad significativamente si no es posible
    cambiarse de carril.
- id: 108
  category: defensive_driving
  question: Al estacionar un vehículo en una pendiente cuesta abajo en Dakota del
    Sur, ¿cómo debe colocar las ruedas delanteras?
  choices:
    A: Hacia el bordillo (acera)
    B: Lejos del bordillo (acera)
    C: Paralelas al bordillo (acera)
    D: No importa, siempre que el freno de estacionamiento esté puesto
  answer: A
  explanation: Al estacionar cuesta abajo, debe girar las ruedas hacia el bordillo
    para que, si el vehículo rueda, lo haga hacia el bordillo en lugar de hacia el
    tráfico.
- id: 109
  category: defensive_driving
  question: Antes de cambiar de carril, ¿cómo debe revisar si hay vehículos en sus
    puntos ciegos?
  choices:
    A: Revisando solo el espejo retrovisor
    B: Revisando solo los espejos laterales
    C: Girando la cabeza y mirando por encima del hombro
    D: Reduciendo la velocidad y esperando a que los vehículos pasen
  answer: C
  explanation: Los espejos no lo muestran todo; debe girar la cabeza y mirar por encima
    del hombro para asegurarse de que el punto ciego esté despejado antes de cambiar
    de carril.
- id: 110
  category: defensive_driving
  question: 'Al seguir a un vehículo que se detiene en los cruces ferroviarios (como
    un autobús escolar o un camión que transporta materiales peligrosos), Dakota del
    Sur recomienda que usted:'
  choices:
    A: Los rebase inmediatamente
    B: Aumente su distancia de seguimiento
    C: Toque la bocina para animarlos a moverse más rápido
    D: Se detenga justo detrás de su parachoques
  answer: B
  explanation: La conducción defensiva requiere aumentar la distancia de seguimiento
    detrás de los vehículos obligados por ley a detenerse en todos los cruces ferroviarios
    para permitirles espacio para detenerse y reanudar la marcha de forma segura.
- id: 111
  category: defensive_driving
  question: 'En South Dakota, debe atenuar sus luces altas cuando siga a otro vehículo
    por detrás a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: El Manual del Conductor de South Dakota establece que debe atenuar
    las luces altas cuando siga a otro vehículo a menos de 200 pies para evitar cegar
    al conductor que va delante a través de sus espejos.
- id: 112
  category: alcohol_drugs_health
  question: En South Dakota, ¿cómo se clasifica legalmente un cargo por conducir bajo
    la influencia (DUI) por primera vez?
  choices:
    A: Delito menor de Clase 2
    B: Delito menor de Clase 1
    C: Felonía de Clase 6
    D: Infracción leve
  answer: B
  explanation: En South Dakota, un DUI (conducir bajo la influencia) por primera vez
    es un delito menor de Clase 1, que puede conllevar una pena de hasta un año de
    cárcel, una multa de $2,000 y la revocación de la licencia de conducir de 30 días
    a un año.
- id: 113
  category: alcohol_drugs_health
  question: Según la ley de recipientes abiertos de South Dakota, ¿dónde es legal
    llevar un recipiente de bebida alcohólica abierto o con el sello roto en un vehículo
    motorizado?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero o en un área que no sea ocupada normalmente por el conductor
      o los pasajeros
    D: En un portavasos, siempre que el conductor no esté bebiendo
  answer: C
  explanation: La ley de South Dakota prohíbe tener un recipiente abierto de alcohol
    en el área de pasajeros de un vehículo motorizado en una vía pública. Debe guardarse
    en el maletero o en un área no ocupada por pasajeros (como detrás del último asiento
    vertical en un vehículo sin maletero).
- id: 114
  category: alcohol_drugs_health
  question: 'Para un conductor de 21 años o más, la ley de South Dakota presume que
    está bajo la influencia del alcohol si su contenido de alcohol en sangre (BAC)
    es igual o superior a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En South Dakota, el límite legal de BAC para conductores de 21 años
    o más es de 0.08%. Los conductores aún pueden ser condenados por DUI con un BAC
    más bajo si su capacidad de conducción está disminuida.
- id: 115
  category: alcohol_drugs_health
  question: Si un conductor es condenado por una segunda infracción de DUI en South
    Dakota dentro de un período de 10 años, ¿cuál es el período mínimo de revocación
    de su licencia?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Una segunda condena por DUI dentro de un período de 10 años en South
    Dakota resulta en una revocación de la licencia por no menos de un año.
- id: 116
  category: alcohol_drugs_health
  question: En South Dakota, ¿cuántas condenas por DUI dentro de un período de 10
    años hacen que la infracción se eleve a una Felonía de Clase 6?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Una tercera condena por DUI dentro de un período de 10 años en South
    Dakota es una Felonía de Clase 6, lo que conlleva penas significativamente más
    severas, incluyendo posible tiempo en prisión.
- id: 117
  category: alcohol_drugs_health
  question: ¿A qué se refiere el 'efecto sinérgico' en relación con la seguridad al
    conducir en South Dakota?
  choices:
    A: Al efecto de mezclar diferentes tipos de alcohol
    B: Al efecto combinado del alcohol y otras drogas, que es mayor que la suma de
      sus partes
    C: Al tiempo de recuperación necesario después de un viaje largo
    D: Al efecto de la gran altitud en la visión del conductor
  answer: B
  explanation: El efecto sinérgico ocurre cuando se combina el alcohol con otras drogas
    (incluso medicamentos recetados o de venta libre), lo que provoca un deterioro
    mucho mayor que el que causaría cualquiera de las sustancias por sí sola.
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores NO afecta el contenido de alcohol en
    sangre (BAC) de una persona en South Dakota?
  choices:
    A: El peso corporal de la persona
    B: La cantidad de comida en el estómago
    C: El tipo de bebida alcohólica (por ejemplo, cerveza frente a vodka)
    D: La condición física o masa muscular de la persona
  answer: C
  explanation: El BAC se determina por la cantidad de alcohol consumido, el tiempo
    dedicado a beber y el peso corporal. Aunque las diferentes bebidas tienen concentraciones
    distintas, 'un trago' (12 oz de cerveza, 5 oz de vino, 1.5 oz de licor fuerte)
    contiene aproximadamente la misma cantidad de alcohol.
- id: 119
  category: alcohol_drugs_health
  question: 'Bajo la ley de Tolerancia Cero de South Dakota, un conductor menor de
    21 años que sea condenado por conducir con un BAC de 0.02% o superior por primera
    vez perderá sus privilegios de conducir por:'
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 6 meses
  answer: B
  explanation: Una primera infracción de la ley de Tolerancia Cero (BAC de 0.02% o
    superior para menores de 21 años) resulta en la pérdida de la licencia por 30
    días.
- id: 120
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y un médico no le ha advertido
    sobre conducir, ¿cuál es su responsabilidad en South Dakota?
  choices:
    A: Puede conducir siempre que se sienta bien
    B: Está legalmente exento de las leyes de DUI si el medicamento es recetado
    C: Debe revisar la etiqueta para ver las advertencias o preguntar a un farmacéutico
      sobre los efectos secundarios antes de conducir
    D: Solo debe conducir durante las horas del día
  answer: C
  explanation: Los conductores son responsables de conocer los efectos de cualquier
    medicamento que tomen. Muchos medicamentos recetados y de venta libre pueden causar
    somnolencia o deterioro, lo que hace que sea ilegal conducir.
- id: 121
  category: alcohol_drugs_health
  question: ¿Al calcular el número de delitos previos por conducir bajo los efectos
    del alcohol o drogas (DUI) para la sentencia en Dakota del Sur, cuál es el 'período
    de revisión' (lookback period)?
  choices:
    A: 3 años
    B: 5 años
    C: 10 años
    D: Toda la vida del conductor
  answer: C
  explanation: Dakota del Sur utiliza un período de revisión de 10 años para determinar
    si un DUI es una reincidencia (2.ª, 3.ª, etc.).
- id: 122
  category: alcohol_drugs_health
  question: 'En Dakota del Sur, se considera que una persona que opera un vehículo
    motorizado comercial está bajo la influencia si su concentración de alcohol en
    sangre (BAC) es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Las leyes federales y estatales de Dakota del Sur establecen un límite
    de BAC más estricto de 0.04% para los conductores que operan vehículos motorizados
    comerciales.
- id: 123
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Dakota del Sur, ¿cuál de los siguientes
    contiene la mayor cantidad de alcohol?
  choices:
    A: 12 onzas de cerveza típica
    B: 5 onzas de vino típico
    C: 1.5 onzas de licor de 80 grados (80-proof)
    D: Todos contienen aproximadamente la misma cantidad de alcohol
  answer: D
  explanation: Una porción estándar de cerveza (12 oz), vino (5 oz) y licores de 80
    grados (1.5 oz) contienen aproximadamente la misma cantidad de alcohol puro.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) antes de conducir en Dakota del Sur?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Darle tiempo a su cuerpo para procesar el alcohol
    D: Hacer ejercicio vigorosamente
  answer: C
  explanation: Solo el tiempo puede hacer que una persona recupere la sobriedad. El
    cuerpo procesa el alcohol a un ritmo constante (aproximadamente una bebida por
    hora), y los métodos como el café o las duchas frías no aceleran este proceso.
- id: 125
  category: alcohol_drugs_health
  question: 'Si se siente fatigado o somnoliento mientras conduce por una carretera
    de Dakota del Sur, la acción más segura es:'
  choices:
    A: Subir el volumen de la radio y abrir las ventanas
    B: Beber una bebida energética con mucha cafeína
    C: Detenerse en un área de descanso segura o salida y tomar una siesta
    D: Acelerar para llegar más rápido a su destino
  answer: C
  explanation: La fatiga afecta el tiempo de reacción y el juicio de manera similar
    al alcohol. La única solución segura para la somnolencia es dormir; las soluciones
    temporales como la cafeína o el aire frío no son confiables.
- id: 126
  category: alcohol_drugs_health
  question: Bajo la ley de Consentimiento Implícito (Implied Consent) de Dakota del
    Sur, ¿qué tipos de pruebas químicas puede solicitar un oficial de la ley para
    determinar su BAC o contenido de drogas?
  choices:
    A: Solo pruebas de aliento
    B: Solo pruebas de sangre
    C: Pruebas de aliento, sangre u orina
    D: Solo una prueba de coordinación de sobriedad en el campo
  answer: C
  explanation: El consentimiento implícito significa que, al conducir en Dakota del
    Sur, usted ha aceptado someterse a pruebas químicas de aliento, sangre u orina
    si un oficial tiene una causa probable para creer que está conduciendo bajo la
    influencia.
- id: 127
  category: alcohol_drugs_health
  question: Para un conductor que opera un vehículo motorizado comercial en Dakota
    del Sur, ¿cuál es la concentración máxima legal de alcohol en sangre (BAC) permitida?
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.08%
    D: 0.00%
  answer: B
  explanation: Según las regulaciones federales y de Dakota del Sur, el límite de
    BAC para conductores comerciales es de 0.04%. Si se descubre que un titular de
    licencia de conducir comercial (CDL) está en este nivel o por encima, está sujeto
    a descalificación.
- id: 128
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de 'sinergismo' (synergism) cuando un conductor combina
    alcohol con otras drogas?
  choices:
    A: Los efectos de cada uno se anulan entre sí
    B: Los efectos aumentan más que la suma de los dos efectos por separado
    C: No hay cambios en el nivel de deterioro del conductor
    D: El conductor se vuelve más alerta y concentrado
  answer: B
  explanation: El sinergismo ocurre cuando se mezclan el alcohol y las drogas (incluso
    las recetadas o de venta libre), lo que resulta en un nivel de deterioro mucho
    mayor que el que causaría cualquiera de las sustancias por sí sola.
- id: 129
  category: alcohol_drugs_health
  question: Si está tomando un medicamento recetado y este afecta su capacidad para
    conducir en Dakota del Sur, ¿puede ser acusado de un DUI?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, porque el DUI solo se aplica al alcohol y a las drogas ilegales
    C: Sí, es ilegal conducir bajo la influencia de cualquier sustancia que afecte
      su capacidad
    D: Solo si su BAC también es superior al 0.08%
  answer: C
  explanation: La ley de Dakota del Sur (SDCL 32-23-1) se aplica al alcohol, la marihuana,
    cualquier droga o sustancia controlada, o cualquier 'sustancia embriagante' que
    haga que una persona sea incapaz de conducir de manera segura.
- id: 130
  category: alcohol_drugs_health
  question: 'En Dakota del Sur, si un conductor menor de 21 años es condenado por
    una primera infracción de la ley de ''Tolerancia Cero'' (BAC de 0.02% o superior),
    su licencia será revocada por al menos:'
  choices:
    A: 10 días
    B: 30 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Por una primera infracción de la ley de Tolerancia Cero de Dakota del
    Sur (menores de 21 años con un BAC de 0.02% a 0.08%), la licencia del conductor
    se revoca por 30 días. Si el BAC es de 0.08% o superior, se aplican las sanciones
    estándar por DUI.
- id: 131
  category: alcohol_drugs_health
  question: ¿Por cuánto tiempo resulta típicamente la revocación de la licencia en
    Dakota del Sur tras una segunda condena por DUI dentro de un período de 10 años?
  choices:
    A: 60 días
    B: 6 meses
    C: Al menos 1 año
    D: Revocación permanente
  answer: C
  explanation: Una segunda condena por DUI dentro de un período de 10 años en Dakota
    del Sur resulta en una revocación de la licencia de no menos de un año.
- id: 132
  category: alcohol_drugs_health
  question: 'En Dakota del Sur, si usted está involucrado en un choque y un oficial
    de la ley tiene causa probable para creer que conducía bajo la influencia, ellos
    pueden:'
  choices:
    A: Solo hacerle la prueba si está inconsciente
    B: Requerir que se someta a una prueba química de aliento, sangre u orina
    C: Solo hacerle la prueba si es mayor de 21 años
    D: No hacerle la prueba a menos que sea arrestado formalmente primero
  answer: B
  explanation: Bajo las leyes de Consentimiento Implícito de Dakota del Sur, si un
    oficial tiene causa probable para creer que un conductor está bajo la influencia,
    se considera que el conductor ha dado su consentimiento para una prueba química.
- id: 133
  category: alcohol_drugs_health
  question: Si tiene una condición médica como epilepsia o diabetes que pueda afectar
    su capacidad para conducir de manera segura, ¿qué se le requiere hacer en Dakota
    del Sur?
  choices:
    A: Nada, el historial médico es privado
    B: Informar la condición al Programa de Licencias de Conducir al solicitar o renovar
      una licencia
    C: Solo conducir durante las horas del día
    D: Tener siempre un pasajero con usted
  answer: B
  explanation: Dakota del Sur requiere que los conductores revelen condiciones físicas
    o mentales que puedan afectar su capacidad para conducir. El estado puede requerir
    una declaración médica de un médico antes de emitir una licencia.
- id: 134
  category: alcohol_drugs_health
  question: ¿Qué le sucede a un conductor de Dakota del Sur que es condenado por una
    tercera ofensa de DUI dentro de 10 años?
  choices:
    A: Sigue siendo un delito menor
    B: Se convierte en un delito grave de Clase 6 (Class 6 Felony)
    C: La licencia se revoca por 30 días
    D: Solo se les requiere pagar una multa
  answer: B
  explanation: En Dakota del Sur, una tercera condena por DUI dentro de un período
    de 10 años es un delito grave de Clase 6 (Class 6 Felony), lo que conlleva sanciones
    más severas, incluyendo posible tiempo en prisión y una revocación de licencia
    más larga.
- id: 135
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de conducir fatigado, lo cual puede
    ser tan peligroso como conducir bajo la influencia?
  choices:
    A: Aumento del tiempo de reacción
    B: Dificultad para concentrarse o parpadeo frecuente
    C: Mejora de la visión periférica
    D: Mayor conciencia del entorno
  answer: B
  explanation: La fatiga causa síntomas como dificultad para concentrarse, salirse
    del carril y parpadeo frecuente. Afecta significativamente el juicio y el tiempo
    de reacción, de manera similar al alcohol.
- id: 136
  category: alcohol_drugs_health
  question: En Dakota del Sur, ¿puede un conductor ser condenado por DUI si su nivel
    de alcohol en sangre (BAC) es inferior al 0.08%?
  choices:
    A: No, el 0.08% es el mínimo absoluto para una condena
    B: Sí, si el estado puede probar que el conductor estaba 'bajo la influencia'
      y su conducción estaba afectada
    C: Solo si el conductor es menor de 18 años
    D: Solo si había un pasajero en el auto
  answer: B
  explanation: Aunque el 0.08% es el límite 'per se', una persona aún puede ser condenada
    por DUI en Dakota del Sur si otras pruebas (comportamiento al conducir, pruebas
    de sobriedad en el campo) demuestran que estaba bajo la influencia hasta un grado
    que la incapacitaba para conducir de forma segura.
- id: 137
  category: penalties_and_points
  question: ¿Cuántos puntos se evalúan contra la licencia de un conductor de Dakota
    del Sur por una infracción estándar de exceso de velocidad?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 6 puntos
    D: Dakota del Sur no utiliza un sistema de puntos
  answer: D
  explanation: A diferencia de muchos otros estados, Dakota del Sur no utiliza un
    sistema de puntos para rastrear las infracciones de tráfico. En su lugar, el estado
    monitorea el número y la gravedad de las condenas en el historial de conducción.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación de la licencia de conducir por
    una primera condena de DUI en Dakota del Sur?
  choices:
    A: 10 días
    B: 30 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Para una primera condena por DUI, el tribunal debe revocar el privilegio
    de conducir de la persona por un período no menor de 30 días y no mayor de un
    año.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de la ley de Dakota del Sur
    que prohíbe enviar mensajes de texto mientras se conduce?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Enviar mensajes de texto mientras se conduce es una infracción primaria
    en Dakota del Sur y conlleva una multa de $100.
- id: 140
  category: penalties_and_points
  question: Para restablecer una licencia de conducir después de haber sido revocada
    por una condena de DUI en Dakota del Sur, ¿cuál es la tarifa de restablecimiento
    requerida?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: De acuerdo con la Ley Codificada de Dakota del Sur 32-12-47.1, la tarifa
    para el restablecimiento de una licencia revocada por un DUI o una ofensa relacionada
    con drogas es de $200.
- id: 141
  category: penalties_and_points
  question: 'En Dakota del Sur, si se le condena por rebasar un autobús escolar que
    tiene sus luces rojas intermitentes encendidas y el brazo de parada extendido,
    podría enfrentar:'
  choices:
    A: Solo una multa
    B: Una condena por un delito menor de Clase 2
    C: Revocación permanente automática de la licencia
    D: Un delito grave de Clase 1
  answer: B
  explanation: Rebasar un autobús escolar con las luces rojas intermitentes es un
    delito menor de Clase 2 en Dakota del Sur, lo que puede resultar en multas y tiempo
    en la cárcel.
- id: 142
  category: penalties_and_points
  question: 'A un conductor de Dakota del Sur se le puede suspender la licencia por
    motivos no relacionados con la conducción, como no pagar:'
  choices:
    A: Impuestos sobre la propiedad
    B: Multas de la biblioteca
    C: Manutención infantil
    D: Deuda de tarjeta de crédito
  answer: C
  explanation: La ley de Dakota del Sur permite la suspensión de la licencia de conducir
    si la persona tiene un retraso significativo en los pagos de manutención infantil.
- id: 143
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor que no cede el paso a un vehículo
    de emergencia (Ley de Hacerse a un Lado o 'Move Over Law') en Dakota del Sur?
  choices:
    A: Una advertencia por la primera infracción
    B: Un delito menor de Clase 2
    C: Un delito menor de Clase 1
    D: Suspensión obligatoria de la licencia por 1 año
  answer: B
  explanation: Violar la ley 'Move Over' de Dakota del Sur, que exige que los conductores
    despejen el carril más cercano a los vehículos de emergencia o de servicio estacionados,
    es un delito menor de Clase 2.
- id: 144
  category: penalties_and_points
  question: En Dakota del Sur, una infracción de 'Contenedor Abierto' (Open Container)
    se refiere a tener una bebida alcohólica sin sellar ¿en qué parte del vehículo?
  choices:
    A: Solo en el maletero
    B: El área de pasajeros del vehículo motorizado en una vía pública
    C: Solo en la caja de una camioneta pickup
    D: Detrás del último asiento vertical de un vehículo con puerta trasera (hatchback)
  answer: B
  explanation: Es ilegal tener un contenedor de bebida alcohólica abierto en el área
    de pasajeros de cualquier vehículo motorizado ubicado en una vía pública en Dakota
    del Sur.
- id: 145
  category: penalties_and_points
  question: 'Si un conductor de Dakota del Sur es condenado por ''eludir'' (Eluding)
    a un oficial de la ley, su licencia será revocada por al menos:'
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 5 años
  answer: C
  explanation: Una condena por eludir a un oficial de policía en Dakota del Sur resulta
    en una revocación obligatoria de la licencia por un período de un año.
- id: 146
  category: penalties_and_points
  question: ¿Qué sucede si un conductor de Dakota del Sur es sorprendido operando
    un vehículo sin el seguro de responsabilidad civil requerido?
  choices:
    A: El vehículo es confiscado inmediatamente y destruido
    B: Un delito menor de Clase 2 y una posible suspensión de la licencia
    C: Ninguna sanción si es la primera vez
    D: Una multa de $5
  answer: B
  explanation: Conducir sin seguro en Dakota del Sur es un delito menor de Clase 2.
    La condena resulta en la suspensión de la licencia de conducir por un período
    de 30 días a un año y requiere presentar una prueba de responsabilidad financiera
    (SR-22) durante tres años.
- id: 147
  category: penalties_and_points
  question: 'Si su licencia de Dakota del Sur es suspendida o revocada, usted debe:'
  choices:
    A: Conservar la licencia hasta que expire
    B: Destruir la licencia usted mismo
    C: Entregar la licencia al Departamento de Seguridad Pública
    D: Entregar la licencia a su agente de seguros
  answer: C
  explanation: Cuando una licencia es suspendida o revocada, la ley exige que el conductor
    entregue la licencia física al Departamento de Seguridad Pública de Dakota del
    Sur.
- id: 148
  category: penalties_and_points
  question: Según las leyes de infractores habituales de Dakota del Sur, el Secretario
    de Seguridad Pública puede suspender la licencia de cualquier conductor que haya
    sido condenado por ¿cuántas infracciones de tránsito en un solo año?
  choices:
    A: 3 o más
    B: 5 o más
    C: 10 o más
    D: 15 o más
  answer: C
  explanation: La ley de Dakota del Sur (SDCL 32-12-49) permite la suspensión de la
    licencia de un conductor que sea un 'infractor habitual', definido como aquel
    que tiene 10 o más infracciones de tránsito en un año.
- id: 149
  category: penalties_and_points
  question: 'Un conductor de Dakota del Sur condenado por una segunda infracción de
    DUI dentro de un periodo de 10 años enfrenta una revocación obligatoria de la
    licencia de al menos:'
  choices:
    A: 90 días
    B: 6 meses
    C: 1 año
    D: 3 años
  answer: C
  explanation: Una segunda condena por DUI dentro de un período de 10 años en Dakota
    del Sur resulta en una revocación de la licencia de no menos de un año.
- id: 150
  category: penalties_and_points
  question: Si a un conductor se le exige presentar un SR-22 (Prueba de Responsabilidad
    Financiera) tras una condena por DUI, ¿durante cuánto tiempo debe mantener este
    registro en Dakota del Sur?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Los conductores condenados por DUI u otras infracciones graves en Dakota
    del Sur suelen estar obligados a mantener los registros de seguro SR-22 por un
    período de 3 años.
- id: 151
  category: penalties_and_points
  question: 'Violar la ley de "Moverse a un lado" (Move Over) de Dakota del Sur (no
    despejar el carril más cercano a un vehículo de emergencia detenido con las luces
    intermitentes) se clasifica como:'
  choices:
    A: Falta leve
    B: Delito menor de Clase 2
    C: Delito menor de Clase 1
    D: Delito grave de Clase 6
  answer: B
  explanation: No moverse a un lado o no reducir la velocidad ante vehículos de emergencia,
    de servicio o de la patrulla de caminos detenidos es un delito menor de Clase
    2 en Dakota del Sur.
- id: 152
  category: penalties_and_points
  question: 'Si el titular de un Permiso restringido para menores es declarado culpable
    de una SEGUNDA infracción de tránsito, sus privilegios de conducción serán suspendidos
    por:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: Hasta que cumpla 18 años
  answer: C
  explanation: Según las leyes de Licencia de Conducir Gradual (GDL) de Dakota del
    Sur, una primera infracción de tránsito resulta en una suspensión de 30 días,
    y una segunda infracción de tránsito resulta en una suspensión de 180 días.
- id: 153
  category: penalties_and_points
  question: 'En Dakota del Sur, un delito menor de Clase 1 (como un DUI por primera
    vez o eludir a la autoridad) conlleva una pena máxima de:'
  choices:
    A: 30 días en la cárcel y una multa de $500
    B: 6 meses en la cárcel y una multa de $1,000
    C: 1 año en la cárcel y una multa de $2,000
    D: 2 años en la cárcel y una multa de $4,000
  answer: C
  explanation: Un delito menor de Clase 1 en Dakota del Sur es punible con hasta un
    año en la cárcel del condado, una multa de $2,000, o ambas.
- id: 154
  category: penalties_and_points
  question: 'En Dakota del Sur, las "carreras de aceleración" (drag racing) en una
    vía pública son un delito menor de Clase 2. Una condena por esta infracción también
    resulta en:'
  choices:
    A: Incautación obligatoria del vehículo por 90 días
    B: Una multa de $5,000
    C: Revocación de la licencia
    D: El requisito de volver a tomar el examen de conducir cada año
  answer: C
  explanation: Una condena por carreras de aceleración (drag racing) en las vías públicas
    de Dakota del Sur resulta en la revocación de la licencia de conducir.
- id: 155
  category: sharing_the_road
  question: En Dakota del Sur, cuando un autobús escolar se detiene con sus luces
    rojas intermitentes y el brazo de parada extendido en una carretera de dos carriles,
    ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima al autobús por delante
    C: El tráfico de ambas direcciones
    D: Nadie, si el límite de velocidad es superior a 45 mph
  answer: C
  explanation: De acuerdo con la ley de Dakota del Sur (SDCL 32-32-6), los conductores
    que se aproximen desde cualquier dirección deben detenerse ante un autobús escolar
    que muestre luces rojas intermitentes y un brazo de parada extendido, a menos
    que el autobús se encuentre en una calzada diferente de una carretera dividida.
- id: 156
  category: sharing_the_road
  question: Al conducir en una carretera de Dakota del Sur con al menos dos carriles
    en la misma dirección, ¿qué debe hacer al acercarse a un vehículo de emergencia
    estacionado con sus luces intermitentes?
  choices:
    A: Mantener la velocidad pero tocar la bocina para alertar al oficial
    B: Cambiarse a un carril que no sea adyacente al vehículo si es seguro hacerlo
    C: Detenerse inmediatamente en su carril actual
    D: Acelerar para pasar el vehículo rápidamente
  answer: B
  explanation: La ley de "Moverse a un lado" (Move Over Law) de Dakota del Sur exige
    que los conductores se muevan a un carril que no sea adyacente al vehículo de
    emergencia o de servicio detenido si hay dos o más carriles disponibles en esa
    dirección y es seguro hacerlo.
- id: 157
  category: sharing_the_road
  question: Al rebasar una bicicleta en Dakota del Sur, ¿cuál es la distancia legal
    mínima que un automovilista debe mantener entre su vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley de Dakota del Sur (SDCL 32-26-26.1) exige que el conductor de
    un vehículo motorizado que adelante a una bicicleta deje una distancia de seguridad
    de al menos tres pies entre el vehículo y la bicicleta.
- id: 158
  category: sharing_the_road
  question: En Dakota del Sur, ¿quién está legalmente obligado a usar un casco de
    seguridad al operar o viajar en una motocicleta?
  choices:
    A: Todos los conductores independientemente de su edad
    B: Solo el operador, no el pasajero
    C: Solo las personas menores de 18 años
    D: Nadie está obligado a usar casco en Dakota del Sur
  answer: C
  explanation: Bajo la ley de Dakota del Sur (SDCL 32-20-4), es ilegal que cualquier
    persona menor de 18 años opere o viaje en una motocicleta a menos que use un casco
    de seguridad aprobado por el gobierno federal.
- id: 159
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en una carretera de cuatro o más
    carriles y una mediana o barrera separa las direcciones del tráfico, ¿qué vehículos
    deben detenerse?
  choices:
    A: Todos los vehículos en todos los carriles
    B: Solo los vehículos que viajan en la misma dirección que el autobús
    C: Solo los vehículos en los carriles más alejados del autobús
    D: No se requiere que ningún vehículo se detenga en una carretera de cuatro carriles
  answer: B
  explanation: En una carretera dividida con una barrera física o mediana, solo el
    tráfico que sigue al autobús (que viaja en la misma dirección) está obligado a
    detenerse en Dakota del Sur.
- id: 160
  category: sharing_the_road
  question: ¿Cómo es el emblema de "Vehículo de movimiento lento" en Dakota del Sur?
  choices:
    A: Un círculo azul con un borde blanco
    B: Una señal triangular naranja con un borde reflectante rojo
    C: Una señal cuadrada amarilla con letras negras
    D: Una señal verde en forma de diamante
  answer: B
  explanation: Los vehículos de movimiento lento, como la maquinaria agrícola o los
    carruajes tirados por caballos, deben exhibir un emblema triangular naranja con
    un borde reflectante rojo cuando circulen por vías públicas.
- id: 161
  category: sharing_the_road
  question: ¿En South Dakota, cuál es la velocidad máxima a la que puede circular
    un vehículo para ser clasificado legalmente como un 'Vehículo de movimiento lento'
    y estar obligado a exhibir el emblema?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio para los
    vehículos diseñados para circular o que circulan a velocidades de 25 mph o menos.
- id: 162
  category: sharing_the_road
  question: 'Al seguir a un camión grande, si no puede ver la cara del conductor del
    camión en sus espejos laterales, usted se encuentra:'
  choices:
    A: En una buena posición para rebasar
    B: En la 'No-Zone' (punto ciego) del camión
    C: Siguiendo a una distancia segura
    D: Obligado a encender sus luces altas
  answer: B
  explanation: Los camiones grandes tienen puntos ciegos significativos llamados 'No-Zones'.
    Si no puede ver la cara del conductor en su espejo lateral, él no puede verlo
    a usted, y usted se encuentra en una posición peligrosa.
- id: 163
  category: sharing_the_road
  question: En South Dakota, ¿qué debe hacer un conductor al acercarse a un peatón
    que lleva un bastón blanco o utiliza un perro guía?
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Ceder el paso y tomar precauciones para evitar lesiones
    C: Esperar a que el peatón le haga una señal para pasar
    D: Rodearlo si hay suficiente espacio en el carril
  answer: B
  explanation: La ley de South Dakota exige que los conductores cedan el paso a los
    peatones ciegos o con discapacidad visual que utilicen un perro guía o lleven
    un bastón blanco.
- id: 164
  category: sharing_the_road
  question: 'Según la ley de South Dakota, una persona que monta en bicicleta por
    una calzada tiene:'
  choices:
    A: Ningún derecho legal en la carretera
    B: Los mismos derechos y responsabilidades que el conductor de un vehículo motorizado
    C: El derecho de paso en todo momento sobre los autos
    D: La obligación de circular únicamente por las aceras
  answer: B
  explanation: Los ciclistas tienen los mismos derechos y están sujetos a los mismos
    deberes que los conductores de vehículos motorizados en South Dakota, incluyendo
    el obedecer las señales de tráfico.
- id: 165
  category: sharing_the_road
  question: En South Dakota, ¿cuál es la distancia mínima que debe mantener al seguir
    a un vehículo de emergencia que tiene sus luces y sirenas activadas?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Generalmente se prohíbe a los conductores seguir a un camión de bomberos
    u otro vehículo de emergencia que responda a una alarma a una distancia menor
    de 500 pies.
- id: 166
  category: sharing_the_road
  question: ¿Cuál es la ley de South Dakota con respecto a la 'división de carril'
    (lane splitting) para motocicletas (circular entre filas de vehículos detenidos
    o en movimiento)?
  choices:
    A: Es legal a velocidades inferiores a 15 mph
    B: Es legal solo en autopistas interestatales
    C: Es ilegal en South Dakota
    D: Es legal si el motociclista lleva casco
  answer: C
  explanation: En South Dakota, las motocicletas tienen derecho al uso total de un
    carril, y la 'división de carril' o el 'filtrado' entre carriles de tráfico está
    prohibido.
- id: 167
  category: sharing_the_road
  question: 'Cuando un cortejo fúnebre utiliza luces intermitentes y sigue a un vehículo
    guía, los conductores de South Dakota deben:'
  choices:
    A: Ceder el paso a todo el cortejo
    B: Solo ceder el paso al primer vehículo
    C: Rebasar al cortejo por la derecha
    D: Intercalarse en la fila de vehículos
  answer: A
  explanation: La ley de South Dakota (SDCL 32-26-46) exige que los conductores cedan
    el paso a los cortejos fúnebres. No debe conducir entre los vehículos de un cortejo
    ni rebasarlos a menos que lo indique un oficial de policía.
- id: 168
  category: sharing_the_road
  question: 'En South Dakota, si ve un vehículo con una luz AZUL intermitente (no
    roja ni ámbar), lo más probable es que pertenezca a:'
  choices:
    A: Un oficial de policía
    B: Un quitanieves
    C: Un bombero voluntario o miembro de un equipo de rescate
    D: Un vehículo de escolta de carga ancha
  answer: C
  explanation: La ley de South Dakota (SDCL 32-17-42) permite que los bomberos voluntarios
    y el personal de ambulancias utilicen luces azules en sus vehículos privados cuando
    responden a una emergencia. Los conductores deben ceder el paso a estos vehículos
    por cortesía.
- id: 169
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el conductor puede:'
  choices:
    A: Girar desde el carril izquierdo para evitar el bordillo
    B: Abrirse hacia la izquierda antes de girar a la derecha
    C: Detenerse en medio de la intersección
    D: Girar solo desde la acera
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para no golpear el bordillo al girar a la derecha. Los conductores nunca deben
    intentar meterse entre un camión y el bordillo cuando el camión está girando a
    la derecha.
- id: 170
  category: sharing_the_road
  question: En South Dakota, usted NO está obligado a detenerse ante un autobús escolar
    con luces rojas intermitentes si viaja en la dirección opuesta en qué tipo de
    carretera?
  choices:
    A: Una carretera con cuatro o más carriles
    B: Una calle residencial
    C: Una autopista dividida con una mediana o barrera física
    D: Cuando las luces ámbar están parpadeando
  answer: C
  explanation: Los conductores que viajan en la dirección opuesta en una autopista
    dividida con una mediana o barrera física no están obligados a detenerse ante
    un autobús escolar. Un carril de giro no cuenta como una barrera física.
- id: 171
  category: sharing_the_road
  question: Bajo la ley de 'Hacerse a un lado' (Move Over) de Dakota del Sur, ¿qué
    debe hacer al acercarse a un vehículo de emergencia autorizado que está detenido
    y tiene las luces intermitentes encendidas?
  choices:
    A: Detenerse por completo hasta que el vehículo se mueva
    B: Cambiarse a un carril que no sea adyacente al vehículo si es posible, o reducir
      la velocidad significativamente
    C: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    D: Aumentar la velocidad para pasar el área lo más rápido posible
  answer: B
  explanation: La Ley de SD 32-30-6.1 exige que los conductores se muevan a un carril
    que no sea adyacente al vehículo de emergencia detenido si se encuentran en una
    carretera de varios carriles, o que reduzcan la velocidad y procedan con precaución
    si un cambio de carril no es posible o seguro.
- id: 172
  category: sharing_the_road
  question: En Dakota del Sur, ¿cuál de las siguientes afirmaciones es verdadera con
    respecto al derecho de una motocicleta a un carril de tráfico?
  choices:
    A: Las motocicletas deben compartir el carril con los autos para ahorrar espacio
    B: Las motocicletas tienen derecho al ancho total de un carril de tráfico
    C: Las motocicletas siempre deben circular por el acotamiento
    D: Los autos pueden rebasar a una motocicleta en el mismo carril si hay espacio
  answer: B
  explanation: Las motocicletas tienen derecho al ancho total de un carril. Los automovilistas
    nunca deben intentar compartir un carril con una motocicleta.
- id: 173
  category: sharing_the_road
  question: Al seguir a una motocicleta en Dakota del Sur, ¿por qué debería dejar
    una distancia de seguimiento mayor (al menos 4 segundos)?
  choices:
    A: Las motocicletas tienen distancias de frenado mucho más largas que los autos
    B: Las motocicletas tienen más probabilidades de verse afectadas por peligros
      en la carretera como baches o grava
    C: La ley exige seguir a las motocicletas a una distancia de 100 pies
    D: Las motocicletas no tienen luces de freno
  answer: B
  explanation: Es necesaria una mayor distancia de seguimiento porque las motocicletas
    pueden detenerse más rápidamente que otros vehículos y son más susceptibles a
    perder el control debido a las condiciones de la superficie de la carretera.
- id: 174
  category: sharing_the_road
  question: ¿A qué se refiere una 'Zona No' (No-Zone) cuando se comparte la carretera
    con camiones grandes?
  choices:
    A: Áreas donde los camiones no tienen permitido circular
    B: Puntos ciegos alrededor del camión donde su auto puede desaparecer de la vista
      del conductor
    C: El área directamente frente a un camión donde este no puede acelerar
    D: Zonas de estacionamiento reservadas solo para vehículos comerciales
  answer: B
  explanation: La 'Zona No' (No-Zone) se refiere a los grandes puntos ciegos ubicados
    en la parte delantera, trasera y laterales de un camión donde el conductor del
    camión no puede ver a otros vehículos.
- id: 175
  category: sharing_the_road
  question: En Dakota del Sur, ¿qué debe hacer cuando un peatón cruza la calle guiado
    por un animal de servicio o lleva un bastón blanco?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Ceder el derecho de paso y tomar precauciones adicionales
    C: Rodearlos si hay un carril abierto
    D: Solo detenerse si están en un cruce peatonal marcado
  answer: B
  explanation: La ley de Dakota del Sur exige que los conductores cedan el derecho
    de paso a los peatones ciegos o con discapacidad visual que utilicen un animal
    de servicio o un bastón blanco.
- id: 176
  category: sharing_the_road
  question: Cuando un cortejo fúnebre utiliza luces de emergencia intermitentes y
    sigue a un vehículo de escolta, ¿cuál es la regla para los demás conductores en
    Dakota del Sur?
  choices:
    A: Puede unirse al cortejo para avanzar entre el tráfico
    B: Debe ceder el derecho de paso a todo el cortejo fúnebre
    C: Debe rebasar al cortejo por la derecha
    D: Solo debe ceder el paso si el cortejo está en una señal de alto
  answer: B
  explanation: Bajo la Ley de SD 32-26-48, los conductores de otros vehículos deben
    ceder el derecho de paso a cualquier vehículo que forme parte de un cortejo fúnebre
    que sea guiado por un vehículo de escolta funeraria.
- id: 177
  category: sharing_the_road
  question: En Dakota del Sur, ¿quién tiene el derecho de paso en una intersección
    que no tiene cruces peatonales marcados?
  choices:
    A: El automovilista, porque no hay un cruce peatonal marcado
    B: El peatón, ya que cada intersección se considera un 'cruce peatonal no marcado'
    C: Quien llegue primero a la intersección
    D: El peatón, pero solo durante las horas del día
  answer: B
  explanation: En Dakota del Sur, los peatones tienen el derecho de paso en todas
    las intersecciones, ya sea que el cruce peatonal esté marcado o no.
- id: 178
  category: sharing_the_road
  question: 'Al rebasar a un ciclista en Dakota del Sur, usted puede cruzar la línea
    central de una carretera (incluso en una zona de no rebasar) si:'
  choices:
    A: El ciclista le hace una señal para que pase
    B: Se puede hacer de manera segura y es necesario para mantener la distancia de
      3 pies
    C: Usted conduce un vehículo comercial
    D: Nunca es legal cruzar una línea amarilla doble para rebasar a una bicicleta
  answer: B
  explanation: La ley de Dakota del Sur permite a los automovilistas cruzar la línea
    central, incluso en una zona de no rebasar, para proporcionar el espacio libre
    de 3 pies requerido para un ciclista, siempre que se pueda hacer de manera segura.
- id: 179
  category: sharing_the_road
  question: Si usted va a girar a la izquierda y un ciclista se aproxima desde la
    dirección opuesta, ¿qué debe hacer?
  choices:
    A: Girar rápidamente antes de que el ciclista llegue a la intersección
    B: Esperar a que el ciclista pase antes de girar
    C: Tocar la bocina para advertir al ciclista que se detenga
    D: Los ciclistas deben ceder el paso a todos los vehículos motorizados que giran
  answer: B
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    conductores de vehículos motorizados. Debe ceder el paso a los ciclistas que vienen
    en sentido contrario al girar a la izquierda, tal como lo haría con un auto.
- id: 180
  category: vehicle_information
  question: De acuerdo con la ley de Dakota del Sur, ¿cuándo se requiere encender
    los faros delanteros debido a la visibilidad limitada?
  choices:
    A: Cuando no se puede ver claramente a una distancia de 500 pies
    B: Cuando no se puede ver claramente a una distancia de 200 pies
    C: Solo cuando está lloviendo o nevando
    D: Cuando no se puede ver claramente a una distancia de 1,000 pies
  answer: B
  explanation: En Dakota del Sur, los faros delanteros deben usarse desde el atardecer
    hasta el amanecer y en cualquier otro momento en que no se pueda ver claramente
    a una distancia de 200 pies.
- id: 181
  category: vehicle_information
  question: ¿A qué distancia debe atenuar las luces altas cuando sigue a otro vehículo
    en Dakota del Sur?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Debe atenuar las luces altas cuando siga a otro vehículo a menos de
    200 pies para evitar cegar al conductor de adelante a través de sus espejos.
- id: 182
  category: vehicle_information
  question: ¿La ley de Dakota del Sur exige que el freno de pie de un vehículo sea
    capaz de detenerlo en cuántos pies cuando viaja a 20 mph en una carretera seca
    y nivelada?
  choices:
    A: 15 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Según los estándares de equipamiento de Dakota del Sur, el freno de
    servicio (de pie) debe poder detener el vehículo en un máximo de 30 pies a una
    velocidad de 20 mph.
- id: 183
  category: vehicle_information
  question: 'Todo vehículo motorizado en Dakota del Sur debe estar equipado con una
    bocina que se pueda escuchar desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Dakota del Sur exige una bocina en buen estado de funcionamiento
    capaz de emitir un sonido audible en condiciones normales desde una distancia
    no menor a 200 pies.
- id: 184
  category: vehicle_information
  question: ¿La ley de Dakota del Sur exige que el espejo retrovisor de su vehículo
    le permita ver la carretera a una distancia de al menos cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todos los vehículos motorizados deben tener un espejo ubicado de manera
    que refleje al conductor una vista de la carretera a una distancia de al menos
    200 pies hacia atrás.
- id: 185
  category: vehicle_information
  question: ¿Entre qué fechas se permiten legalmente los neumáticos para nieve con
    clavos en las carreteras de Dakota del Sur?
  choices:
    A: Del 1 de noviembre al 31 de marzo
    B: Del 1 de octubre al 30 de abril
    C: Del 1 de septiembre al 1 de mayo
    D: Del 1 de diciembre al 28 de febrero
  answer: B
  explanation: En Dakota del Sur, es legal operar un vehículo motorizado con neumáticos
    con clavos entre el 1 de octubre y el 30 de abril.
- id: 186
  category: vehicle_information
  question: Para un vehículo registrado en Dakota del Sur, ¿cuál es el porcentaje
    mínimo de transmisión de luz requerido para las ventanas laterales delanteras?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La ley de Dakota del Sur (SDCL 32-15-2.1) exige que las ventanas laterales
    delanteras permitan al menos un 35% de transmisión de luz.
- id: 187
  category: vehicle_information
  question: Según las leyes de polarización de ventanas de Dakota del Sur, ¿cuál es
    la transmisión de luz mínima requerida para las ventanas laterales traseras y
    la ventana trasera?
  choices:
    A: 10%
    B: 20%
    C: 35%
    D: 50%
  answer: B
  explanation: La ley de Dakota del Sur exige que las ventanas laterales traseras
    y la ventana trasera permitan al menos un 20% de transmisión de luz.
- id: 188
  category: vehicle_information
  question: 'En Dakota del Sur, se debe exhibir un emblema de ''Vehículo de movimiento
    lento'' (Slow Moving Vehicle) en la parte trasera de cualquier vehículo o maquinaria
    agrícola que normalmente viaje a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de Vehículo de Movimiento Lento (SMV) es obligatorio en
    vehículos diseñados para su uso a velocidades de 25 mph o menos.
- id: 189
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para vehículos de pasajeros en Dakota del Sur?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros en Dakota del Sur si la profundidad
    de la banda de rodadura es inferior a 2/32 de pulgada.
- id: 190
  category: vehicle_information
  question: 'La ley de Dakota del Sur exige que la placa de matrícula trasera esté
    iluminada para que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La placa de registro trasera debe estar iluminada con una luz blanca
    para que sea visible desde una distancia de 50 pies hacia atrás.
- id: 191
  category: vehicle_information
  question: ¿Con respecto a los sistemas de escape de los vehículos, la ley de Dakota
    del Sur prohíbe cuál de los siguientes?
  choices:
    A: Silenciadores con puntas de cromo
    B: Recortes de silenciador (muffler cutouts) o derivaciones (bypasses)
    C: Sistemas de escape doble
    D: Tubos de escape que salen por el lado
  answer: B
  explanation: La ley de Dakota del Sur exige que cada vehículo motorizado tenga un
    silenciador en buen estado de funcionamiento y prohíbe el uso de un recorte de
    silenciador, derivación o dispositivo similar.
- id: 192
  category: vehicle_information
  question: 'En Dakota del Sur, si se utilizan las luces direccionales de su vehículo,
    estas deben ser visibles para otros conductores bajo la luz solar normal desde
    una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Las luces direccionales deben ser visibles desde una distancia no menor
    a 100 pies tanto hacia adelante como hacia atrás bajo la luz solar normal.
- id: 193
  category: vehicle_information
  question: ¿Si una carga se extiende más de cuántos pies más allá de la parte trasera
    de un vehículo en Dakota del Sur, se debe colocar una bandera roja o una luz roja
    al final de la carga?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: Siempre que una carga se extienda 4 pies o más más allá de la plataforma
    o carrocería de un vehículo, se debe mostrar una bandera roja (de al menos 12
    pulgadas cuadradas) durante el día o una luz roja por la noche al final de la
    carga.
- id: 194
  category: vehicle_information
  question: Según el Manual del Conductor de Dakota del Sur, ¿cuándo deben encenderse
    las luces delanteras de su vehículo?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    B: Desde la puesta del sol hasta el amanecer y siempre que no pueda ver claramente
      a 200 pies
    C: Solo cuando esté lloviendo, nevando o haya niebla
    D: De 8:00 PM a 6:00 AM diariamente
  answer: B
  explanation: En Dakota del Sur, las luces delanteras deben usarse desde la puesta
    del sol hasta el amanecer y en cualquier otro momento en que no pueda ver claramente
    a una distancia de 200 pies.
- id: 195
  category: vehicle_information
  question: 'En Dakota del Sur, un vehículo motorizado debe tener al menos un espejo
    retrovisor que proporcione una vista de la carretera hacia atrás por una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley SDCL 32-15-8 exige un espejo ubicado para reflejar al conductor
    una vista de la carretera por una distancia de al menos 200 pies hacia atrás.
- id: 196
  category: vehicle_information
  question: Según las leyes de tinte de ventanas de Dakota del Sur, las ventanas laterales
    delanteras deben permitir que pase al menos qué porcentaje de luz?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: Según la ley SDCL 32-9-7, la transmisión de luz para el parabrisas
    y las ventanas laterales delanteras debe ser de al menos el 35%.
- id: 197
  category: vehicle_information
  question: 'En Dakota del Sur, se requiere un emblema de ''Vehículo de Movimiento
    Lento'' en los vehículos diseñados para viajar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: La ley SDCL 32-15-20 exige un emblema de vehículo de movimiento lento
    en cualquier maquinaria agrícola u otro vehículo diseñado para operar a velocidades
    de 25 millas por hora o menos.
- id: 198
  category: vehicle_information
  question: 'Cada vehículo motorizado en Dakota del Sur debe tener al menos una luz
    trasera roja que sea visible desde una distancia de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley SDCL 32-17-8 especifica que las luces traseras deben exhibir
    una luz roja claramente visible desde una distancia de 1,000 pies hacia atrás.
- id: 199
  category: vehicle_information
  question: 'Al usar las luces direccionales en Dakota del Sur, las luces deben ser
    visibles desde una distancia no menor a:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley SDCL 32-17-18 exige que las luces de señalización utilizadas
    para indicar un giro sean visibles desde una distancia no menor a 100 pies bajo
    la luz solar normal.
- id: 200
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los parabrisas
    en Dakota del Sur?
  choices:
    A: Puede colocar cualquier calcomanía en el parabrisas siempre que esté en el
      centro
    B: Se permiten carteles o letreros si son más pequeños de 5x7 pulgadas
    C: Ninguna persona puede conducir con ningún material no transparente en el parabrisas
      que obstruya la vista clara del conductor
    D: Los parabrisas agrietados son legales si la grieta tiene menos de 12 pulgadas
      de largo
  answer: C
  explanation: La ley SDCL 32-15-5 prohíbe conducir con cualquier letrero, cartel
    u otro material no transparente sobre el parabrisas delantero que obstruya la
    vista clara del conductor de la carretera.
- id: 201
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera respecto a las emisiones
    e inspecciones de vehículos en Dakota del Sur?
  choices:
    A: Todos los vehículos deben pasar una prueba de smog anual
    B: Dakota del Sur no requiere actualmente pruebas anuales de emisiones de vehículos
    C: Solo los vehículos en Sioux Falls y Rapid City requieren pruebas de emisiones
    D: Se requieren pruebas de emisiones cada dos años para vehículos con más de 5
      años de antigüedad
  answer: B
  explanation: Dakota del Sur no cuenta con un programa de pruebas de emisiones de
    vehículos (smog) exigido por el estado para el registro o la renovación de vehículos.
- id: 202
  category: signs_and_signals
  question: En Dakota del Sur, se utiliza una señal en forma de banderín (un triángulo
    lateral) para indicar una 'Zona de No Rebasar'. ¿Dónde se ubica normalmente esta
    señal?
  choices:
    A: En el lado derecho de la carretera al comienzo de la zona
    B: En el lado izquierdo de la carretera al comienzo de la zona
    C: Elevada sobre el carril central
    D: Solo en la parte trasera de los vehículos de movimiento lento
  answer: B
  explanation: En Dakota del Sur, la señal de 'Zona de No Rebasar' en forma de banderín
    es única porque se coloca en el lado izquierdo de la carretera para proporcionar
    una advertencia adicional a los conductores que intentan rebasar.
- id: 203
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en una intersección en Dakota
    del Sur?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: La señal está averiada; ceda el paso a la derecha
    C: Detenerse por completo y proceder solo cuando sea seguro hacerlo
    D: Detenerse y esperar a que la luz cambie a verde
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto (pare). Debe detenerse por completo y ceder el derecho de paso al tráfico
    transversal antes de continuar.
- id: 204
  category: signs_and_signals
  question: ¿Cuál es el límite de velocidad estándar en las carreteras secundarias
    rurales en Dakota del Sur, a menos que se indique lo contrario?
  choices:
    A: 55 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: B
  explanation: El límite de velocidad en las carreteras estatales y federales rurales
    en Dakota del Sur es de 65 mph, a menos que las señales indiquen lo contrario.
- id: 205
  category: signs_and_signals
  question: 'Cuando ve una luz amarilla intermitente en una intersección, usted debe:'
  choices:
    A: Detenerse y esperar una luz verde
    B: Aumentar la velocidad para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y estar especialmente alerta al atravesar la intersección.
- id: 206
  category: signs_and_signals
  question: En Dakota del Sur, ¿cuándo se le permite girar a la izquierda con una
    luz roja?
  choices:
    A: Nunca
    B: Al girar desde una calle de sentido único hacia otra calle de sentido único
    C: Al girar desde una calle de doble sentido hacia una calle de sentido único
    D: En cualquier momento que no haya tráfico en sentido contrario
  answer: B
  explanation: La ley de Dakota del Sur permite un giro a la izquierda en rojo solo
    cuando se gira desde una calle de sentido único hacia otra calle de sentido único,
    después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 207
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla continua en su lado de la línea central?
  choices:
    A: Usted está en una zona donde se permite rebasar
    B: Puede rebasar si el camino por delante está despejado
    C: No se le permite rebasar
    D: La carretera se está estrechando
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central discontinua
    significa que se encuentra en una zona de no rebasar y no puede adelantar legalmente
    a otros vehículos.
- id: 208
  category: signs_and_signals
  question: 'Una señal en forma de diamante con fondo naranja indica:'
  choices:
    A: Una zona escolar
    B: Un cruce de ferrocarril
    C: Una zona de construcción o mantenimiento
    D: Un límite de velocidad reglamentario
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para operaciones de construcción, mantenimiento o servicios públicos para advertir
    a los conductores sobre trabajadores o equipos más adelante.
- id: 209
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de pentágono (cinco lados)?
  choices:
    A: Una señal de ceda el paso
    B: Una zona escolar o cruce escolar
    C: Un marcador de carretera del condado
    D: Una zona de no rebasar
  answer: B
  explanation: Una señal de cinco lados (pentágono) se utiliza exclusivamente para
    advertir a los conductores que se aproximan a una zona escolar o a un cruce peatonal
    escolar.
- id: 210
  category: signs_and_signals
  question: En Dakota del Sur, ¿qué indican las líneas blancas continuas dobles pintadas
    en el pavimento?
  choices:
    A: Puede cruzarlas para cambiar de carril
    B: Separan el tráfico que se mueve en direcciones opuestas
    C: Está prohibido cruzar las líneas
    D: Indican únicamente un carril para bicicletas
  answer: C
  explanation: Las líneas blancas continuas dobles se utilizan para separar carriles
    de tráfico que se mueven en la misma dirección donde está prohibido cambiar de
    carril.
- id: 211
  category: signs_and_signals
  question: 'El emblema de vehículo de movimiento lento es una señal triangular que
    es:'
  choices:
    A: Rojo sólido
    B: Naranja fluorescente con un borde rojo reflectante
    C: Amarillo brillante con letras negras
    D: Blanca con una 'X' negra
  answer: B
  explanation: El emblema de vehículo de movimiento lento es un triángulo naranja
    fluorescente con un borde rojo reflectante, requerido en vehículos que viajan
    a 25 mph o menos.
- id: 212
  category: signs_and_signals
  question: 'Al acercarse a un cruce de ferrocarril con luces rojas intermitentes
    pero sin barreras, usted debe:'
  choices:
    A: Reducir la velocidad y mirar, pero no detenerse a menos que se vea un tren
    B: Detenerse al menos a 15 pies del riel más cercano
    C: Aumentar la velocidad para cruzar antes de que llegue el tren
    D: Detenerse solo si escucha un silbato
  answer: B
  explanation: En Dakota del Sur, debe detenerse al menos a 15 pies (pero no más de
    50 pies) del riel más cercano cuando las luces intermitentes indican que se aproxima
    un tren.
- id: 213
  category: signs_and_signals
  question: ¿Cuál es la señal manual para indicar que está reduciendo la velocidad
    o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia arriba
    B: Brazo izquierdo extendido hacia afuera
    C: Brazo izquierdo extendido hacia abajo
    D: Mover la mano de un lado a otro
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad mediante
    señales manuales, extienda el brazo izquierdo por la ventana y apunte hacia abajo.
- id: 214
  category: signs_and_signals
  question: En Dakota del Sur, ¿qué significa una luz de tráfico amarilla intermitente?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Proceder con precaución
    C: Aumentar la velocidad para despejar la intersección
    D: Tratarla como una parada de cuatro vías
  answer: B
  explanation: Según el Manual del Conductor de Dakota del Sur, una luz amarilla intermitente
    significa que debe proceder con precaución y estar alerta.
- id: 215
  category: signs_and_signals
  question: 'Una señal en forma de banderín que se encuentra en el lado izquierdo
    de la carretera en Dakota del Sur indica:'
  choices:
    A: Una zona escolar
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar
    D: Un cruce de ferrocarril
  answer: C
  explanation: La señal en forma de banderín es única porque se coloca en el lado
    izquierdo de la carretera para marcar el comienzo de una zona de no rebasar.
- id: 216
  category: signs_and_signals
  question: 'Cuando vea una señal de ''Aspa'' (Crossbuck) en un cruce de ferrocarril
    en Dakota del Sur, debe tratarla igual que una:'
  choices:
    A: Señal de alto (Stop)
    B: Señal de ceder el paso (Yield)
    C: Señal de límite de velocidad
    D: Señal de prohibido el paso (Do Not Enter)
  answer: B
  explanation: Una señal de aspa marca la ubicación de un cruce de ferrocarril y debe
    tratarse como una señal de ceder el paso; debe ceder el paso a cualquier tren
    que se aproxima.
- id: 217
  category: signs_and_signals
  question: Si está girando en una intersección y la señal es una flecha amarilla
    fija, ¿qué debe hacer?
  choices:
    A: Aumentar la velocidad para ganarle a la luz roja
    B: El período de giro protegido está terminando; prepárese para detenerse
    C: Detenerse inmediatamente en medio de la intersección
    D: Continuar girando; usted tiene el derecho de paso
  answer: B
  explanation: Una flecha amarilla fija significa que el tiempo de giro 'protegido'
    está terminando y la señal está a punto de cambiar a rojo. Debe prepararse para
    detenerse si aún no ha entrado en la intersección.
- id: 218
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de tráfico en forma de pentágono?
  choices:
    A: Ceder el derecho de paso
    B: Cruce de ferrocarril más adelante
    C: Zona escolar o cruce escolar
    D: Zona de no rebasar
  answer: C
  explanation: Una señal de cinco lados (pentágono) indica que está cerca de una escuela
    y debe estar atento a los niños.
- id: 219
  category: signs_and_signals
  question: 'Para señalar un giro a la derecha mediante señales manuales, un conductor
    de Dakota del Sur debe:'
  choices:
    A: Extender el brazo izquierdo recto por la ventana
    B: Extender el brazo izquierdo hacia afuera y apuntar hacia arriba
    C: Extender el brazo izquierdo hacia afuera y apuntar hacia abajo
    D: Extender el brazo derecho recto por la ventana
  answer: B
  explanation: La señal manual para un giro a la derecha es el brazo izquierdo extendido
    por la ventana y doblado hacia arriba por el codo.
- id: 220
  category: signs_and_signals
  question: 'Un círculo rojo con una barra horizontal blanca en el medio es una señal
    que significa:'
  choices:
    A: Ceder el paso (Yield)
    B: No estacionar
    C: Prohibido el paso (Do Not Enter)
    D: Alto (Stop)
  answer: C
  explanation: Esta es la señal estándar de 'Prohibido el paso' (Do Not Enter), que
    se encuentra típicamente en las rampas de salida de las autopistas o calles de
    un solo sentido.
- id: 221
  category: signs_and_signals
  question: ¿Qué indican las franjas amarillas diagonales pintadas sobre un objeto
    fijo en la carretera?
  choices:
    A: Un área donde se permite estacionar
    B: Un cruce peatonal
    C: Un objeto que debe evitarse
    D: Una parada de autobús
  answer: C
  explanation: Las franjas diagonales (a menudo llamadas marcas de "galón" o de "peligro")
    en un objeto fijo indican un peligro que los conductores deben evitar golpear.
- id: 222
  category: signs_and_signals
  question: 'En Dakota del Sur, si se encuentra en una intersección con una luz roja
    intermitente, usted debe:'
  choices:
    A: Reducir la velocidad y continuar si el camino está despejado
    B: Detenerse por completo y continuar solo cuando sea seguro
    C: Esperar a que la luz cambie a verde
    D: Ceder el paso solo al tráfico que viene por la derecha
  answer: B
  explanation: 'Una luz roja intermitente debe tratarse igual que una señal de alto
    (STOP): deténgase por completo y continúe cuando sea seguro.'
- id: 223
  category: signs_and_signals
  question: ¿Qué significa un símbolo de diamante blanco pintado en el pavimento?
  choices:
    A: El carril está reservado para vehículos específicos (como HOV o autobuses)
    B: Hay un cruce de ferrocarril más adelante
    C: El carril es solo para paradas de emergencia
    D: Se está acercando a una zona escolar
  answer: A
  explanation: Un diamante blanco en el pavimento indica un carril restringido, como
    un carril para vehículos de alta ocupación (HOV), un carril para autobuses o un
    carril para bicicletas.
- id: 224
  category: signs_and_signals
  question: 'Cuando dos vehículos llegan al mismo tiempo a una intersección sin señales
    ni semáforos, la ley de Dakota del Sur exige:'
  choices:
    A: Que el vehículo de la izquierda ceda el paso al vehículo de la derecha
    B: Que el vehículo de la derecha ceda el paso al vehículo de la izquierda
    C: Que el vehículo más pequeño ceda el paso al vehículo más grande
    D: Que el vehículo que viaja más rápido tenga el derecho de paso
  answer: A
  explanation: En una intersección no controlada, el conductor del vehículo de la
    izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 225
  category: signs_and_signals
  question: 'Para indicar que está reduciendo la velocidad o deteniéndose mediante
    señales manuales, usted debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo
    D: Mover el brazo en un movimiento circular
  answer: C
  explanation: La señal manual para detenerse o reducir la velocidad es el brazo izquierdo
    extendido hacia afuera y apuntando hacia abajo, hacia el suelo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y continuar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 226
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 227
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 228
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 229
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 230
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 231
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 232
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 233
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 234
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 235
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 236
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 237
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la carretera.
  id: 238
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 239
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 240
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 241
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de rombo?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de rombo con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 242
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 243
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    hacia un lado y luego hacia el otro.
  id: 244
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 245
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de rombo advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 246
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 247
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 248
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 249
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 250
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 251
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 252
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 253
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 254
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 255
