questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de aprendizaje en Kentucky?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 17 años
  answer: C
  explanation: Según la ley de Kentucky, el solicitante debe tener al menos 16 años
    de edad para solicitar un permiso de instrucción.
- id: 2
  category: license_system
  question: Bajo la ley de Licencia de Conducir Graduada (GDL) de Kentucky, ¿cuánto
    tiempo debe un conductor menor de 18 años tener un permiso de instrucción antes
    de poder realizar el examen de manejo?
  choices:
    A: 30 días
    B: 60 días
    C: 120 días
    D: 180 días
  answer: D
  explanation: La ley de Kentucky exige que los titulares de permisos menores de 18
    años mantengan su permiso durante al menos 180 días antes de ser elegibles para
    el examen de habilidades viales.
- id: 3
  category: license_system
  question: ¿Cuál es el toque de queda para un conductor de Kentucky con una licencia
    intermedia?
  choices:
    A: 10:00 PM a 5:00 AM
    B: 11:00 PM a 6:00 AM
    C: 12:00 AM (medianoche) a 6:00 AM
    D: 1:00 AM a 5:00 AM
  answer: C
  explanation: Los titulares de licencias intermedias no tienen permitido conducir
    entre las 12:00 AM (medianoche) y las 6:00 AM, a menos que puedan demostrar una
    causa justificada (como actividades relacionadas con la escuela o el trabajo).
- id: 4
  category: license_system
  question: Bajo el programa GDL de Kentucky, ¿cuántas personas sin parentesco menores
    de 20 años puede llevar en el vehículo un titular de licencia intermedia?
  choices:
    A: Cero
    B: Una
    C: Dos
    D: Tres
  answer: B
  explanation: Los titulares de licencias intermedias de Kentucky están restringidos
    a transportar solo a una persona sin parentesco menor de 20 años en el vehículo.
- id: 5
  category: license_system
  question: Para pasar de la fase de licencia intermedia a una licencia completa sin
    restricciones en Kentucky, ¿cuál de los siguientes requisitos debe completar un
    conductor?
  choices:
    A: Un curso de 4 horas del Programa de Licencia Graduada (GLP)
    B: Un curso de conducción defensiva de 10 horas
    C: Un segundo examen escrito
    D: Un segundo examen de manejo
  answer: A
  explanation: Kentucky exige que todos los conductores que obtuvieron su permiso
    antes de los 18 años completen una clase de 4 horas del Programa de Licencia Graduada
    (GLP) o un equivalente aprobado antes de recibir una licencia completa.
- id: 6
  category: license_system
  question: 'La ley ''No Pass/No Drive'' (Si no apruebas, no conduces) de Kentucky
    puede resultar en la suspensión de la licencia o permiso para un joven de 16 o
    17 años si este:'
  choices:
    A: Reprueba más de una clase en un semestre
    B: Tiene 9 o más ausencias injustificadas en un semestre
    C: Abandona la escuela
    D: Todas las anteriores
  answer: D
  explanation: La ley 'No Pass/No Drive' (KRS 159.051) se aplica a jóvenes de 16 y
    17 años que abandonan la escuela, tienen deficiencias académicas (reprueban 2
    o más cursos) o tienen 9 o más ausencias injustificadas.
- id: 7
  category: license_system
  question: En Kentucky, ¿cuántos puntos acumulados en un período de dos años resultarán
    en la suspensión de la licencia para un conductor menor de 18 años?
  choices:
    A: 5 puntos
    B: 7 puntos
    C: 10 puntos
    D: 12 puntos
  answer: B
  explanation: Para conductores menores de 18 años, el Gabinete de Transporte de Kentucky
    enviará un aviso de suspensión si el conductor acumula 7 o más puntos en un período
    de dos años.
- id: 8
  category: license_system
  question: En Kentucky, ¿cuál es el límite legal de concentración de alcohol en sangre
    (BAC) para conductores menores de 21 años?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Kentucky tiene una ley de 'Tolerancia Cero' para menores, estableciendo
    el límite legal de BAC en 0.02% para conductores menores de 21 años.
- id: 9
  category: license_system
  question: Al conducir con un permiso de instrucción de Kentucky, ¿qué edad debe
    tener como mínimo el conductor con licencia que lo supervisa?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: Cualquier edad, siempre que tenga licencia
  answer: B
  explanation: El titular de un permiso debe estar acompañado por una persona que
    tenga al menos 21 años de edad y posea una licencia de operador válida al momento
    de la operación.
- id: 10
  category: license_system
  question: Para cumplir con el requisito de visión de Kentucky para una licencia
    sin restricciones, ¿qué agudeza visual debe tener un solicitante como mínimo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Kentucky requiere que los solicitantes tengan al menos una agudeza
    visual de 20/40 en al menos un ojo para obtener una licencia de operador sin restricciones.
- id: 11
  category: license_system
  question: Si se muda a Kentucky desde otro estado, ¿dentro de cuántos días después
    de convertirse en residente debe solicitar una licencia de Kentucky?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes de Kentucky tienen 30 días para obtener una licencia
    de conducir de Kentucky.
- id: 12
  category: license_system
  question: ¿Por cuántos años es válida normalmente una licencia de conducir estándar
    de Kentucky antes de que deba renovarse?
  choices:
    A: 2 o 4 años
    B: 4 u 8 años
    C: 5 o 10 años
    D: Cada año
  answer: B
  explanation: Kentucky ofrece a los conductores la opción de un ciclo de renovación
    de 4 u 8 años para las licencias estándar y REAL ID.
- id: 13
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que el titular de un permiso
    de Kentucky menor de 18 años realice el examen de conducir (road test)?
  choices:
    A: Completar 60 horas de práctica (10 de noche)
    B: Completar 40 horas de práctica (5 de noche)
    C: Completar 50 horas de práctica (5 de noche)
    D: Completar 60 horas de práctica (15 de noche)
  answer: A
  explanation: Kentucky requiere que los titulares de permisos menores de 18 años
    completen 60 horas de práctica de manejo, 10 de las cuales deben ser de noche,
    documentadas en un registro de práctica de manejo.
- id: 14
  category: license_system
  question: Si un conductor de Kentucky es condenado por conducir sin seguro, ¿cuál
    es el período mínimo por el que se puede suspender su licencia por una primera
    infracción?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Una primera condena por no mantener el seguro requerido en Kentucky
    puede resultar en una suspensión de la licencia de 90 días a un año.
- id: 15
  category: license_system
  question: En Kentucky, si cambia su nombre legal o su dirección residencial, ¿dentro
    de cuántos días debe solicitar un duplicado de la licencia?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: Según el Manual del Conductor de Kentucky, si cambia su nombre o dirección,
    debe solicitar un duplicado de la licencia dentro de los 10 días.
- id: 16
  category: license_system
  question: Bajo el sistema de puntos de Kentucky, ¿cuánto tiempo permanecen los puntos
    en el registro de un conductor desde la fecha de la condena?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: B
  explanation: Los puntos asignados al registro de un conductor de Kentucky permanecen
    por un período de dos años a partir de la fecha de la condena.
- id: 17
  category: license_system
  question: Si se suspende su privilegio de conducir en Kentucky, ¿cuál es la tarifa
    estándar requerida para restablecer la licencia?
  choices:
    A: $25
    B: $40
    C: $100
    D: $200
  answer: B
  explanation: La ley de Kentucky requiere el pago de una tarifa de restablecimiento
    de $40 después de que haya finalizado el período de suspensión de la licencia.
- id: 18
  category: license_system
  question: 'La ley de ''Consentimiento Implícito'' (Implied Consent) de Kentucky
    significa que, al operar un vehículo en las carreteras de Kentucky, usted ha dado
    su consentimiento para:'
  choices:
    A: Un registro del maletero de su vehículo
    B: Una prueba de sangre, aliento u orina para detectar alcohol o drogas
    C: Una revisión de sus registros telefónicos
    D: Un curso obligatorio de conducción defensiva
  answer: B
  explanation: La ley de Consentimiento Implícito establece que cualquier persona
    que opere un vehículo motorizado en Kentucky ha dado su consentimiento para una
    prueba química de sangre, aliento u orina para determinar el contenido de alcohol
    o drogas.
- id: 19
  category: license_system
  question: En Kentucky, ¿cuál es la edad mínima para operar un ciclomotor (moped)
    en vías públicas sin una licencia de conducir tradicional, siempre que tenga una
    licencia de ciclomotor?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: En Kentucky, debe tener al menos 16 años de edad para operar un ciclomotor
    y poseer una licencia de operador válida o una licencia especial para ciclomotores.
- id: 20
  category: license_system
  question: Si reprueba el examen de habilidades de conducción (road test) de Kentucky,
    ¿cuánto tiempo debe esperar antes de ser elegible para realizar el examen nuevamente?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 14 días
  answer: C
  explanation: Las regulaciones de Kentucky requieren que los solicitantes que reprueben
    el examen de habilidades de conducción esperen al menos siete días antes de intentar
    el examen nuevamente.
- id: 21
  category: license_system
  question: ¿Si reprueba el examen escrito de conocimientos para el permiso de Kentucky,
    cuándo es lo más pronto que puede intentar el examen de nuevo?
  choices:
    A: El siguiente día hábil disponible
    B: Después de 48 horas
    C: Después de 7 días
    D: Después de 30 días
  answer: A
  explanation: Si reprueba el examen escrito de conocimientos en Kentucky, puede volver
    a tomar el examen el siguiente día hábil disponible.
- id: 22
  category: license_system
  question: En Kentucky, ¿cuántos puntos se asignan contra su licencia por exceder
    el límite de velocidad por 16-25 mph?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 9 puntos
  answer: C
  explanation: Exceder el límite de velocidad por 16-25 mph en Kentucky resulta en
    la adición de 6 puntos a su historial de manejo.
- id: 23
  category: license_system
  question: ¿Cuántos puntos se agregan a un historial de manejo de Kentucky por una
    condena de 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Una condena por Conducción Temeraria (Reckless Driving) en Kentucky
    resulta en la asignación de 4 puntos contra la licencia del conductor.
- id: 24
  category: license_system
  question: Para obtener una REAL ID de Kentucky, ¿cuál de los siguientes es un documento
    aceptable para demostrar su número de Seguro Social?
  choices:
    A: Una nota escrita a mano de un empleador
    B: Una tarjeta de Seguro Social, W-2 o formulario 1099
    C: Un certificado de nacimiento
    D: Una factura de servicios públicos
  answer: B
  explanation: Para demostrar un número de Seguro Social para una REAL ID en Kentucky,
    los solicitantes deben presentar una tarjeta de Seguro Social, un formulario W-2
    o un formulario 1099.
- id: 25
  category: license_system
  question: Los residentes de Kentucky que sirven en el ejército y están destacados
    fuera del estado, ¿cuántas veces pueden renovar su licencia por correo?
  choices:
    A: Una vez
    B: Twice
    C: Veces ilimitadas mientras estén en servicio activo
    D: Nunca; deben regresar a Kentucky
  answer: A
  explanation: El personal militar de Kentucky destacado fuera del estado puede renovar
    su licencia por correo una vez, pero la siguiente renovación debe realizarse en
    persona.
- id: 26
  category: license_system
  question: Bajo la ley 'No Pass/No Drive' de Kentucky, la licencia o permiso de un
    estudiante puede ser revocada si tiene ¿cuántas ausencias injustificadas en un
    solo semestre?
  choices:
    A: 3 o más
    B: 5 o más
    C: 9 o más
    D: 12 o más
  answer: C
  explanation: La ley 'No Pass/No Drive' establece que un estudiante puede perder
    su licencia si tiene 9 o más ausencias injustificadas en un semestre.
- id: 27
  category: license_system
  question: En Kentucky, exceder el límite de velocidad por 26 mph o más resultará
    en ¿cuál de lo siguiente?
  choices:
    A: Revocación permanente y automática de la licencia
    B: Una audiencia obligatoria y una posible suspensión de 90 días
    C: Una multa fija de $500 sin puntos
    D: Una asignación de 3 puntos
  answer: B
  explanation: Exceder el límite de velocidad por 26 mph o más en Kentucky es una
    infracción grave que requiere una audiencia y puede llevar a una suspensión de
    la licencia por 90 días.
- id: 28
  category: license_system
  question: 'Si un conductor de Kentucky tiene una condición física o mental que pueda
    afectar su capacidad para conducir de manera segura, la ley le exige:'
  choices:
    A: Dejar de conducir inmediata y permanentemente
    B: Informar la condición a la División de Licencias de Conducir (Division of Driver
      Licensing)
    C: Solo conducir durante las horas del día
    D: Llevar una nota del médico en todo momento
  answer: B
  explanation: La ley de Kentucky exige que los conductores informen cualquier condición
    física o mental que pueda afectar su conducción a la División de Licencias de
    Conducir para que sea evaluada por la Junta de Revisión Médica (Medical Review
    Board).
- id: 29
  category: license_system
  question: ¿Cuál es el cargo por un duplicado de la licencia de conducir estándar
    de Kentucky si la original se pierde o es robada?
  choices:
    A: $5
    B: $15
    C: $25
    D: $40
  answer: B
  explanation: El cargo por un duplicado de la licencia de conducir estándar de Kentucky
    es de $15.
- id: 30
  category: driver_testing
  question: En Kentucky, ¿cuál es el límite de velocidad en todas las carreteras estatales
    o en cualquier distrito comercial o residencial, a menos que se indique lo contrario?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: Según el Manual del Conductor de Kentucky, el límite de velocidad es
    de 35 mph en todas las carreteras estatales o en cualquier distrito comercial
    o residencial, a menos que se indique una velocidad diferente.
- id: 31
  category: driver_testing
  question: ¿Cuál es el límite de velocidad máximo para vehículos en instalaciones
    de estacionamiento fuera de la vía pública en Kentucky?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: C
  explanation: La ley de Kentucky establece el límite de velocidad en 15 mph en instalaciones
    de estacionamiento fuera de la vía pública.
- id: 32
  category: driver_testing
  question: En Kentucky, ¿a cuántos pies de distancia debe cambiar de luces altas
    a luces bajas cuando se aproxima un vehículo en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Kentucky exige que los conductores bajen la intensidad de
    sus faros cuando un vehículo que viene en sentido contrario se encuentra a menos
    de 500 pies.
- id: 33
  category: driver_testing
  question: Al seguir a otro vehículo por la noche en Kentucky, ¿a qué distancia debe
    cambiar de luces altas a luces bajas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los conductores en Kentucky deben cambiar a luces bajas cuando sigan
    a otro vehículo a una distancia de 200 pies.
- id: 34
  category: driver_testing
  question: Bajo el sistema de puntos de Kentucky, ¿cuántos puntos se asignan por
    exceso de velocidad de 16 a 25 mph sobre el límite en una autopista de acceso
    limitado?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 9 puntos
  answer: C
  explanation: Conducir a un exceso de velocidad de 16 a 25 mph sobre el límite resulta
    en la adición de 6 puntos a su historial de conducción de Kentucky.
- id: 35
  category: driver_testing
  question: En Kentucky, ¿es ilegal estacionarse a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Kentucky prohíbe estacionarse a menos de 15 pies de un hidrante
    de incendios.
- id: 36
  category: driver_testing
  question: En Kentucky, ¿se prohíbe estacionar a menos de cuántos pies de una señal
    de alto, una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: La ley de Kentucky establece que no se puede estacionar a menos de
    30 pies de cualquier baliza intermitente, señal de alto o señal de control de
    tráfico.
- id: 37
  category: driver_testing
  question: Si usted se ve involucrado en una colisión en Kentucky que resulte en
    daños a la propiedad de $500 o más, ¿dentro de cuántos días debe presentar un
    informe por escrito (formulario OCR-88) si la policía no presentó uno?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: La ley de Kentucky exige que se presente un informe de accidente por
    escrito en un plazo de 10 días si los daños superan los $500 y no se presentó
    ningún informe policial.
- id: 38
  category: driver_testing
  question: Al rebasar una bicicleta en Kentucky, ¿cuál es el espacio mínimo que un
    automovilista debe dejar entre el vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La 'ley de los 3 pies' de Kentucky exige que los automovilistas dejen
    al menos tres pies de espacio al rebasar a una persona que circula en bicicleta.
- id: 39
  category: driver_testing
  question: En una carretera de cuatro o más carriles, si un autobús escolar se detiene
    en el lado opuesto de una mediana o barrera, ¿qué debe hacer un conductor de Kentucky?
  choices:
    A: Detenerse hasta que el autobús se mueva
    B: Detenerse hasta que se retraiga el brazo de parada
    C: Reducir la velocidad a 15 mph y proceder con precaución
    D: Proceder con precaución; no se requiere detenerse para el tráfico en la dirección
      opuesta
  answer: D
  explanation: En Kentucky, en una carretera de cuatro o más carriles, el tráfico
    que se aproxima desde la dirección opuesta a un autobús escolar detenido no está
    obligado a detenerse, aunque se recomienda precaución.
- id: 40
  category: driver_testing
  question: ¿La ley de Kentucky exige que use su señal de giro al menos cuántos pies
    antes de realizar un giro o cambiar de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Los conductores en Kentucky deben señalizar su intención de girar o
    cambiar de carril con al menos 100 pies de antelación.
- id: 41
  category: driver_testing
  question: ¿Cuál es el rango de la multa que se puede imponer por una primera condena
    por DUI (conducir bajo los efectos del alcohol o drogas) en Kentucky (para mayores
    de 21 años)?
  choices:
    A: Sin multa, solo servicio comunitario
    B: $100 a $300
    C: $200 a $500
    D: $500 a $1,000
  answer: C
  explanation: Una condena por DUI por primera vez para un adulto en Kentucky conlleva
    una multa que oscila entre $200 y $500, además de las costas y cargos judiciales.
- id: 42
  category: driver_testing
  question: En Kentucky, ¿qué sucede con la multa por exceso de velocidad en una zona
    de obras viales cuando hay trabajadores presentes?
  choices:
    A: La multa se exonera para los infractores por primera vez
    B: La multa se duplica
    C: La multa se triplica
    D: La multa se incrementa en una tarifa fija de $500
  answer: B
  explanation: La ley de Kentucky exige que las multas por exceso de velocidad y otras
    infracciones de tráfico se dupliquen en las zonas de obras viales cuando hay trabajadores
    presentes.
- id: 43
  category: driver_testing
  question: Para aprobar el examen escrito de conocimientos de Kentucky, ¿cuál es
    la puntuación mínima requerida?
  choices:
    A: 70% (28 de 40 preguntas)
    B: 75% (30 de 40 preguntas)
    C: 80% (32 de 40 preguntas)
    D: 90% (36 de 40 preguntas)
  answer: C
  explanation: El examen escrito para el permiso de Kentucky consta de 40 preguntas.
    El solicitante debe responder correctamente al menos el 80% (32 preguntas) para
    aprobar.
- id: 44
  category: driver_testing
  question: Durante el examen de habilidades de conducción de Kentucky, se le pedirá
    que estacione en paralelo. ¿A cuántas pulgadas del bordillo debe quedar estacionado
    su vehículo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: El Manual del Conductor de Kentucky especifica que, al estacionar en
    paralelo, el vehículo debe estar a menos de 12 pulgadas del bordillo.
- id: 45
  category: driver_testing
  question: 'En Kentucky, debe utilizar sus faros delanteros cuando la visibilidad
    se reduce a menos de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Kentucky exige el uso de faros delanteros cuando no hay luz
    suficiente para ver claramente a personas o vehículos a una distancia de 500 pies
    hacia adelante.
- id: 46
  category: driver_testing
  question: 'La ley ''Move Over'' (hacerse a un lado) de Kentucky exige que los automovilistas
    hagan lo siguiente al acercarse a un vehículo de emergencia detenido con luces
    intermitentes en una autopista de carriles múltiples:'
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Cambiarse al carril más alejado del vehículo de emergencia si es seguro hacerlo
    D: Acelerar para rebasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley de Kentucky exige que los conductores se muevan al carril que
    no sea adyacente al vehículo de emergencia en autopistas de carriles múltiples.
    Si cambiar de carril es imposible o inseguro, el conductor debe reducir la velocidad
    y mantener una velocidad segura.
- id: 47
  category: driver_testing
  question: Si usted se ve involucrado en una colisión en Kentucky que no es investigada
    por un oficial de la ley, y los daños superan los ______, debe presentar un informe
    por escrito (formulario 740) ante la Policía Estatal de Kentucky.
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: De acuerdo con la ley de Kentucky (KRS 189.635), si una colisión resulta
    en daños a la propiedad de $500 o más y no es investigada por un oficial, se debe
    presentar un informe en un plazo de 10 días.
- id: 48
  category: driver_testing
  question: En Kentucky, ¿con cuántos pies de antelación, como mínimo, debe señalizar
    su intención de girar antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: El Manual del Conductor de Kentucky establece que se debe dar una señal
    al menos 100 pies antes de realizar el giro.
- id: 49
  category: driver_testing
  question: Según el Manual del Conductor de Kentucky, ¿cuál es la distancia de seguimiento
    recomendada con respecto al vehículo que circula delante de usted en buenas condiciones
    de conducción?
  choices:
    A: La longitud de un vehículo
    B: Dos segundos
    C: Tres segundos
    D: Cinco segundos
  answer: C
  explanation: Kentucky recomienda la 'regla de los tres segundos' para mantener una
    distancia de seguimiento segura en condiciones normales de conducción.
- id: 50
  category: driver_testing
  question: Si se le condena por exceso de velocidad de 15 mph o más sobre el límite
    en una autopista de Kentucky, ¿cuántos puntos se añadirán a su historial de conducción?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: Suspensión automática
  answer: C
  explanation: En Kentucky, conducir a 15 mph o más por encima del límite de velocidad
    resulta en la adición de 6 puntos al historial del conductor.
- id: 51
  category: driver_testing
  question: En Kentucky, cuando un autobús escolar se detiene en una autopista de
    cuatro carriles (dos carriles en cada dirección) con sus luces rojas intermitentes
    y el brazo de parada extendido, ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico en el carril más alejado del autobús
    C: El tráfico en todas las direcciones debe detenerse
    D: Nadie está obligado a detenerse si hay cuatro carriles
  answer: C
  explanation: En Kentucky, en una autopista de cuatro o más carriles, todo el tráfico
    debe detenerse ante un autobús escolar, a menos que haya una mediana o una barrera
    física que separe las direcciones de circulación.
- id: 52
  category: driver_testing
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    para un vehículo de pasajeros privado en Kentucky?
  choices:
    A: $10,000/$20,000/$5,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $100,000/$300,000/$50,000
  answer: B
  explanation: La ley de Kentucky exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales a una persona, $50,000 por lesiones corporales
    a todas las personas en un accidente y $25,000 por daños a la propiedad.
- id: 53
  category: driver_testing
  question: Al realizar el examen práctico de manejo en Kentucky, ¿cuál de las siguientes
    situaciones conlleva una reprobación automática?
  choices:
    A: No usar una señal de giro una vez
    B: Tocar un cono durante el estacionamiento en paralelo
    C: Un accidente que involucre cualquier grado de daño a la propiedad o lesiones
      personales
    D: Ajustar el radio mientras conduce
  answer: C
  explanation: De acuerdo con los estándares de evaluación de la Policía Estatal de
    Kentucky, cualquier accidente o infracción de tráfico cometida durante el examen
    práctico resulta en una reprobación automática.
- id: 54
  category: driver_responsibility
  question: Kentucky es un estado de seguro 'sin culpa' (no-fault). ¿Cuál es el monto
    mínimo de cobertura de Protección contra Lesiones Personales (PIP) requerido para
    todos los vehículos motorizados (excluyendo motocicletas)?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: La ley de seguro sin culpa de Kentucky requiere un mínimo de $10,000
    en cobertura de Protección contra Lesiones Personales (PIP) para pagar gastos
    médicos y salarios perdidos, independientemente de quién tenga la culpa.
- id: 55
  category: driver_responsibility
  question: ¿Cuándo debe un residente de Kentucky renovar el registro de su vehículo
