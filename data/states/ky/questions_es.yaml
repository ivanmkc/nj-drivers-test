    de parada está extendido?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: Suspensión automática
  answer: C
  explanation: No detenerse ante un autobús escolar (que está recibiendo o dejando
    pasajeros) es una infracción grave en Kentucky y conlleva una penalización de
    6 puntos.
- id: 59
  category: driver_responsibility
  question: En Kentucky, si un conductor es condenado por exceso de velocidad de 16
    mph a 25 mph sobre el límite establecido, ¿cuántos puntos se agregan a su historial?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: La licencia se revoca automáticamente
  answer: C
  explanation: Conducir a un exceso de velocidad de 16 a 25 mph sobre el límite en
    Kentucky resulta en 6 puntos. El exceso de velocidad de 15 mph o menos sobre el
    límite resulta en 3 puntos.
- id: 60
  category: driver_responsibility
  question: En lugar de los límites de responsabilidad estándar de 25/50/25, el propietario
    de un vehículo en Kentucky puede optar por una póliza de 'límite único'. ¿Cuál
    es el monto mínimo requerido para este tipo de póliza?
  choices:
    A: $50,000
    B: $60,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: La ley de Kentucky permite una póliza de límite único con un mínimo
    de $60,000 para cumplir con los requisitos de responsabilidad financiera.
- id: 61
  category: driver_responsibility
  question: Si un conductor de Kentucky menor de 21 años es condenado por un DUI con
    un BAC (concentración de alcohol en sangre) entre 0.02% y 0.08%, ¿por cuánto tiempo
    se puede suspender su licencia por una primera infracción?
  choices:
    A: 30 días a 6 meses
    B: 6 meses a 1 año
    C: 1 año a 2 años
    D: Hasta que cumplan 21 años
  answer: A
  explanation: Para conductores menores de 21 años con un BAC de 0.02 a 0.08, el periodo
    de suspensión por la primera infracción es de 30 días a 6 meses.
- id: 62
  category: driver_responsibility
  question: ¿A un conductor de Kentucky que sea condenado por 'Carreras' (Racing)
    en carreteras públicas se le sumarán cuántos puntos a su historial de conducción?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 9 puntos
  answer: C
  explanation: La condena por participar en carreras en carreteras públicas en Kentucky
    resulta en la adición de 6 puntos al historial del conductor.
- id: 63
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente en Kentucky, ¿qué información
    está legalmente obligado a intercambiar con el otro conductor?
  choices:
    A: Solo nombre y dirección
    B: Nombre, dirección y número de registro del vehículo
    C: Nombre, dirección, registro del vehículo e información del seguro
    D: No se requiere información si no hay heridos
  answer: C
  explanation: La ley de Kentucky exige que los conductores involucrados en una colisión
    intercambien nombres, direcciones, números de registro y comprobante de seguro.
- id: 64
  category: driver_responsibility
  question: ¿Cuál es la sanción por una primera condena por operar un vehículo motorizado
    en Kentucky sin el seguro de responsabilidad civil requerido?
  choices:
    A: Una multa de $100 a $250
    B: Una multa de $500 a $1,000 y/o hasta 90 días de cárcel
    C: Revocación permanente de la licencia de conducir
    D: Una sentencia de prisión obligatoria de 5 años
  answer: B
  explanation: Una primera infracción por conducir sin seguro en Kentucky conlleva
    una multa de $500 a $1,000 y/o hasta 90 días de cárcel, además de la suspensión
    de la licencia y el registro.
- id: 65
  category: driver_responsibility
  question: En Kentucky, ¿cuántos puntos se asignan por 'No ceder el paso' (Failure
    to yield) al derecho de vía?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: No ceder el paso al derecho de vía es una infracción de 3 puntos bajo
    el sistema de puntos de Kentucky.
- id: 66
  category: driver_responsibility
  question: En Kentucky, si usted se ve involucrado en un accidente de tráfico donde
    hay una fatalidad, lesiones personales o daños a la propiedad que excedan ¿qué
    cantidad?, debe presentar un informe por escrito (CR-88) ante la Policía Estatal
    de Kentucky si el oficial no presenta uno.
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: Según el Manual del Conductor de Kentucky, cualquier accidente que
    resulte en una fatalidad, lesiones personales o daños a la propiedad de $500 o
    más debe ser reportado. Si un oficial de la ley no presenta un informe, los operadores
    deben presentar un informe CR-88 dentro de los 10 días.
- id: 67
  category: driver_responsibility
  question: 'La ley de seguro obligatorio ''Sin Culpa'' (No-Fault) de Kentucky exige
    que cada propietario de un vehículo motorizado tenga una cobertura de Protección
    contra Lesiones Personales (PIP) por un monto mínimo de:'
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $25,000
  answer: B
  explanation: Kentucky es un estado 'Sin Culpa' (No-Fault). Los propietarios de vehículos
    motorizados deben tener un mínimo de $10,000 en cobertura de Protección contra
    Lesiones Personales (PIP) para pagar gastos médicos y salarios perdidos, independientemente
    de quién tenga la culpa.
- id: 68
  category: driver_responsibility
  question: ¿Cuáles son los límites mínimos de cobertura de seguro de responsabilidad
    civil requeridos para lesiones corporales de una sola persona en el estado de
    Kentucky?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Kentucky exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones corporales a una persona, $50,000 por lesiones corporales
    a todas las personas en un accidente y $25,000 por daños a la propiedad (25/50/25).
- id: 69
  category: driver_responsibility
  question: Cuando compra un vehículo en Kentucky, debe proporcionar un comprobante
    de seguro y registrar el vehículo a su nombre ¿dentro de cuántos días?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: La ley de Kentucky exige que cuando se compra o transfiere un vehículo,
    el nuevo propietario debe registrar el vehículo y proporcionar un comprobante
    de seguro dentro de los 15 días.
- id: 70
  category: driver_responsibility
  question: En Kentucky, ¿cuál es la multa máxima por una primera condena por arrojar
    basura (littering) desde un vehículo motorizado?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Arrojar basura es ilegal en Kentucky. Una persona declarada culpable
    de arrojar basura desde un vehículo puede ser multada con hasta $500 y/o pasar
    hasta un año en la cárcel.
- id: 71
  category: driver_responsibility
  question: 'Para conductores de 21 años o más, una condena por primera ofensa de
    DUI (conducir bajo la influencia) en Kentucky puede resultar en una sentencia
    de cárcel de:'
  choices:
    A: 24 horas a 7 días
    B: 48 horas a 30 días
    C: 10 días a 6 meses
    D: 30 días a 1 año
  answer: B
  explanation: Para una primera ofensa de DUI en Kentucky (mayores de 21 años), el
    tiempo potencial de cárcel oscila entre 48 horas y 30 días.
- id: 72
  category: driver_responsibility
  question: En Kentucky, ¿cuál de las siguientes se considera una 'circunstancia agravante'
    que puede duplicar el tiempo mínimo obligatorio de cárcel por una condena de DUI?
  choices:
    A: Conducir con un pasajero menor de 12 años
    B: Conducir a 15 mph por encima del límite de velocidad
    C: Negarse a una prueba de sangre si es su primera ofensa
    D: Conducir con un BAC de 0.10%
  answer: A
  explanation: 'Las circunstancias agravantes en Kentucky incluyen: un BAC (concentración
    de alcohol en sangre) de 0.15% o más, conducir en sentido contrario en una carretera
    de acceso limitado, causar un accidente que resulte en muerte o lesiones graves,
    o conducir con un pasajero menor de 12 años.'
- id: 73
  category: driver_responsibility
  question: ¿Cuántos puntos se le asignan a un conductor de Kentucky por no ceder
    el paso a un vehículo de emergencia?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: No ceder el paso a un vehículo de emergencia es una infracción de 4
    puntos en el sistema de puntos de Kentucky.
- id: 74
  category: driver_responsibility
  question: Si usted es residente de Kentucky y compra un vehículo fuera del estado,
    ¿quién debe inspeccionar el vehículo antes de que pueda ser registrado?
  choices:
    A: Un mecánico privado certificado
    B: La Policía Estatal de Kentucky
    C: El Sheriff del Condado
    D: El Departamento de Transporte
  answer: C
  explanation: En Kentucky, cualquier vehículo traído al estado desde otra jurisdicción
    debe ser inspeccionado por el Sheriff del Condado en el condado donde se registrará
    el vehículo.
- id: 75
  category: driver_responsibility
  question: Según la ley de Kentucky, ¿cuántos puntos se asignan por 'Seguir demasiado
    de cerca'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Seguir demasiado de cerca (tailgating) es una infracción de 3 puntos
    bajo el sistema de puntos de Kentucky.
- id: 76
  category: driver_responsibility
  question: En Kentucky, si es condenado por 'Rebase indebido', ¿cuántos puntos se
    añadirán a su historial de conducción?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 6 puntos
  answer: A
  explanation: El rebase indebido se categoriza como una infracción de 3 puntos en
    Kentucky.
- id: 77
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un requisito legal con respecto a su tarjeta
    de seguro de Kentucky?
  choices:
    A: Debe guardarse en su residencia principal
    B: Debe mantenerse en el vehículo en todo momento
    C: Debe presentarse anualmente ante el Secretario del Condado
    D: Solo se requiere al renovar su licencia
  answer: B
  explanation: La ley de Kentucky exige que el comprobante de seguro (la tarjeta de
    seguro) se mantenga en el vehículo en todo momento mientras se esté operando.
- id: 78
  category: driver_responsibility
  question: En Kentucky, una condena por 'No detenerse ante un autobús escolar' (primera
    ofensa) ¿cuántos puntos conlleva?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 6 puntos
  answer: D
  explanation: No detenerse ante un autobús escolar es una infracción grave en Kentucky
    y conlleva una penalización de 6 puntos en el historial del conductor.
- id: 79
  category: safe_driving_rules
  question: En Kentucky, ¿cuál es el límite de velocidad en las instalaciones de estacionamiento
    fuera de la vía pública, a menos que se indique lo contrario?
  explanation: Según el Manual del Conductor de Kentucky, el límite de velocidad en
    las instalaciones de estacionamiento fuera de la vía pública es de 15 mph, a menos
    que se indique lo contrario.
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: C
- id: 80
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    un distrito comercial o residencial de Kentucky?
  explanation: En Kentucky, el límite de velocidad legal para distritos comerciales
    o residenciales es de 35 mph, a menos que las señales indiquen un límite diferente.
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
- id: 81
  category: safe_driving_rules
  question: ¿Según la ley de Kentucky, a cuántos pies de una intersección o cruce
    de ferrocarril no se debe rebasar a otro vehículo?
  explanation: La ley de Kentucky prohíbe rebasar a otro vehículo cuando se encuentra
    a menos de 100 pies de cualquier intersección o cruce de ferrocarril.
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
- id: 82
  category: safe_driving_rules
  question: Al estacionar un vehículo en una vía de Kentucky, ¿a qué distancia debe
    estar de un hidrante de incendios?
  explanation: La ley de Kentucky establece que no se puede estacionar a menos de
    15 pies de un hidrante de incendios.
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
- id: 83
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene en una carretera de cuatro o más
    carriles que tiene una mediana o barrera, ¿qué vehículos deben detenerse?
  explanation: En Kentucky, si un autobús escolar se detiene en una carretera de cuatro
    o más carriles con una mediana o barrera, solo el tráfico que sigue al autobús
    debe detenerse. El tráfico en la dirección opuesta no está obligado a detenerse.
  choices:
    A: Todo el tráfico en ambas direcciones
    B: Solo el tráfico que sigue al autobús
    C: Solo el tráfico en la dirección opuesta
    D: No se requiere que el tráfico se detenga si hay cuatro carriles
  answer: B
- id: 84
  category: safe_driving_rules
  question: Al estacionar cuesta arriba en una calle de Kentucky con bordillo (acera),
    ¿hacia qué lado debe girar las ruedas delanteras?
  explanation: Al estacionar cuesta arriba con bordillo, gire las ruedas en dirección
    contraria al bordillo (hacia la izquierda) para que, si el vehículo rueda, la
    parte trasera de la llanta delantera golpee el bordillo.
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: B
- id: 85
  category: safe_driving_rules
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (hydroplaning)
    en las carreteras mojadas de Kentucky?
  explanation: El Manual del Conductor de Kentucky establece que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph, donde los neumáticos pueden perder
    contacto con la superficie de la carretera.
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
- id: 86
  category: safe_driving_rules
  question: La ley de 'Hacerse a un lado' (Move Over) de Kentucky exige que los conductores
    se muevan al carril izquierdo o reduzcan la velocidad al acercarse a ¿qué tipo
    de vehículo estacionado con luces intermitentes?
  explanation: La ley Move Over de Kentucky se aplica a vehículos de emergencia, vehículos
    de remolque y vehículos de mantenimiento o servicios públicos de carreteras con
    luces intermitentes.
  choices:
    A: Solo patrullas de policía
    B: Solo ambulancias y camiones de bomberos
    C: Vehículos de emergencia, de remolque y de mantenimiento
    D: Cualquier vehículo estacionado en el arcén (hombro)
  answer: C
- id: 87
  category: safe_driving_rules
  question: 'En Kentucky, al entrar en una glorieta (roundabout), debe ceder el paso
    a:'
  explanation: Al entrar en una glorieta en Kentucky, debe ceder el paso al tráfico
    que ya circula en la glorieta y que viene por su izquierda.
  choices:
    A: Tráfico que entra por la derecha
    B: Tráfico que ya está en el círculo
    C: Nadie; usted tiene el derecho de paso
    D: Solo a los peatones
  answer: B
- id: 88
  category: safe_driving_rules
  question: 'En Kentucky, es ilegal seguir a un equipo de bomberos que responde a
    una alarma a una distancia menor de:'
  explanation: Según el Manual del Conductor de Kentucky, no debe seguir a un camión
    de bomberos u otro equipo de bomberos a menos de 500 pies.
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
- id: 89
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia debe estacionar de cualquier baliza intermitente,
    señal de alto o señal de control de tráfico en Kentucky?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: La ley de Kentucky exige que los conductores estacionen al menos a
    30 pies de distancia de cualquier baliza intermitente, señal de alto o señal de
    control de tráfico ubicada al costado de una vía.
- id: 90
  category: safe_driving_rules
  question: En una carretera de Kentucky con cuatro o más carriles, ¿qué vehículos
    deben detenerse ante un autobús escolar con luces rojas intermitentes y el brazo
    de parada extendido?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima desde la dirección opuesta
    C: Todo el tráfico en ambas direcciones
    D: No se requiere que ningún vehículo se detenga en una carretera de 4 carriles
  answer: A
  explanation: En Kentucky, en una carretera con cuatro o más carriles, el conductor
    de un vehículo que se aproxima a un autobús escolar detenido desde la dirección
    opuesta no necesita detenerse. Solo el tráfico que sigue al autobús debe detenerse.
- id: 91
  category: safe_driving_rules
  question: ¿Bajo el sistema de puntos de Kentucky, cuántos puntos se asignan por
    una condena de conducción temeraria?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: La conducción temeraria es una infracción de 4 puntos bajo el Sistema
    de Puntos para Conductores de Kentucky.
- id: 92
  category: safe_driving_rules
  question: En Kentucky, ¿cuántos puntos se añaden a su historial de conducción por
    'seguir demasiado de cerca'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Seguir demasiado de cerca (tailgating) resulta en la adición de 3 puntos
    al historial de un conductor en Kentucky.
- id: 93
  category: safe_driving_rules
  question: 'Al encontrarse con un vehículo que viene en dirección contraria por la
    noche en Kentucky, debe bajar las luces altas cuando el vehículo esté a menos
    de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Kentucky exige que los conductores bajen las luces altas
    cuando un vehículo que viene en sentido contrario está a menos de 500 pies.
- id: 94
  category: safe_driving_rules
  question: Según el Manual del Conductor de Kentucky, ¿a qué velocidad puede comenzar
    el hidroplaneo (pérdida de contacto de los neumáticos con la carretera)?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de Kentucky establece que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph.
- id: 95
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    ¿qué tan adelante de su vehículo sugieren la ley y las pautas de seguridad de
    Kentucky que debe mirar?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: Una cuadra de la ciudad
  answer: B
  explanation: Las pautas de seguridad de Kentucky establecen que debe mirar de 10
    a 15 segundos por delante de su vehículo para anticipar peligros y gestionar el
    flujo de tráfico.
- id: 96
  category: defensive_driving
  question: En Kentucky, al seguir a otro vehículo por la noche, ¿a cuántos pies del
    vehículo de adelante debe bajar las luces altas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Kentucky exige que los conductores bajen las luces altas
    cuando siguen a otro vehículo a una distancia de 200 pies.
- id: 97
  category: defensive_driving
  question: 'La ley de Kentucky exige que encienda los faros siempre que use los limpiaparabrisas
    debido a la lluvia, nieve o aguanieve, y siempre que la visibilidad sea inferior
    a:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Kentucky establece que los faros deben estar encendidos cuando
    los limpiaparabrisas están en uso y siempre que la visibilidad se reduzca a 500
    pies o menos.
- id: 98
  category: defensive_driving
  question: Al conducir con niebla densa en Kentucky, ¿qué ajuste de faros debe usar
    para mantener la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia (intermitentes)
  answer: B
  explanation: En condiciones de niebla, debe usar las luces bajas. Las luces altas
    se reflejan en la niebla y, de hecho, disminuyen la visibilidad.
- id: 99
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Kentucky,
    ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección en la que la parte trasera del vehículo se
      está deslizando
    D: Poner el coche en punto muerto y apagar el motor
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que la parte trasera del vehículo está
    derrapando.
- id: 100
  category: defensive_driving
  question: Al entrar en una curva en Kentucky, ¿cuál es la práctica de conducción
    defensiva más segura para mantener el control?
  choices:
    A: Frenar fuerte mientras está en medio de la curva
    B: Reducir la velocidad antes de entrar en la curva
    C: Acelerar al entrar en la curva
    D: Mantener su velocidad de carretera durante toda la curva
  answer: B
  explanation: El Manual del Conductor de Kentucky aconseja reducir la velocidad antes
    de entrar en una curva para poder mantener un mejor control y evitar derrapes.
- id: 101
  category: defensive_driving
  question: En Kentucky, cuando está detenido en una intersección y la luz cambia
    a verde, ¿cuál es la secuencia de observación recomendada antes de avanzar?
  choices:
    A: Mirar recto y avanzar
    B: Mirar a la derecha, luego a la izquierda
    C: Mirar a la izquierda, luego a la derecha, y luego a la izquierda de nuevo
    D: Revisar solo el espejo retrovisor
  answer: C
  explanation: Las pautas de seguridad de Kentucky recomiendan mirar a la izquierda,
    luego a la derecha y luego a la izquierda nuevamente antes de entrar en una intersección
    para asegurarse de que ningún tráfico transversal se esté pasando un semáforo
    en rojo.
- id: 102
  category: defensive_driving
  question: Al conducir en una autopista de Kentucky con tres o más carriles, ¿qué
    carril se utiliza generalmente para el flujo de tráfico más fluido?
  choices:
    A: El carril izquierdo
    B: El carril derecho
    C: El carril central
    D: El acotamiento (hombro)
  answer: C
  explanation: En una carretera con tres o más carriles, el carril central suele ofrecer
    el flujo de tráfico más fluido, mientras que el izquierdo es para rebasar y el
    derecho es para entrar o salir.
- id: 103
  category: defensive_driving
  question: Si sigue a un camión grande o vehículo comercial en Kentucky, ¿cómo puede
    saber si se encuentra en la 'Zona Prohibida' (No-Zone) o punto ciego del conductor?
  choices:
    A: Si está a menos de 50 pies de distancia
    B: Si no puede ver la cara del conductor del camión en su espejo retrovisor lateral
    C: Si conduce en el carril izquierdo
    D: Si el camión viaja a más de 55 mph
  answer: B
  explanation: Una regla general para los conductores de Kentucky es que si no puede
    ver la cara del conductor del camión en su espejo lateral, el conductor del camión
    no puede verlo a usted.
- id: 104
  category: defensive_driving
  question: Durante una fuerte tormenta de lluvia en Kentucky, ¿cuándo es probable
    que la superficie de la carretera esté más resbaladiza?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo después de que deja de llover
    C: Durante los primeros minutos de lluvia
    D: Cuando la temperatura es superior a 80 grados
  answer: C
  explanation: Las carreteras están más resbaladizas durante los primeros minutos
    de lluvia porque el agua se mezcla con el aceite y la grasa del pavimento que
    aún no se han lavado.
- id: 105
  category: defensive_driving
  question: Si el pedal del acelerador se queda pegado mientras conduce por una carretera
    de Kentucky, ¿cuál debería ser su primera acción defensiva?
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a neutral (punto muerto) y aplicar los frenos
    C: Tirar del freno de emergencia
    D: Abrir la puerta del coche para reducir la velocidad
  answer: B
  explanation: Si el acelerador se queda pegado, debe cambiar a neutral (punto muerto),
    aplicar los frenos y buscar una forma segura de salir de la carretera.
- id: 106
  category: defensive_driving
  question: ¿Para evitar el deslumbramiento de los faros de un vehículo que viene
    en sentido contrario por la noche, hacia dónde debe dirigir la vista un conductor
    de Kentucky?
  choices:
    A: Directamente a los faros que se aproximan
    B: A la línea central de la carretera
    C: Hacia el borde derecho de la carretera
    D: Cerrar los ojos brevemente
  answer: C
  explanation: El Manual del Conductor de Kentucky sugiere mirar hacia el lado derecho
    de la carretera o hacia la línea blanca para evitar ser cegado por las luces altas
    que se aproximan.
- id: 107
  category: defensive_driving
  question: Según el Manual del Conductor de Kentucky, ¿a qué velocidad puede comenzar
    el hidroplaneo (hydroplaning), donde los neumáticos comienzan a deslizarse sobre
    una película de agua?
  choices:
    A: Tan bajo como 25 mph
    B: Tan bajo como 35 mph
    C: Solo por encima de 55 mph
    D: Solo durante tormentas eléctricas fuertes
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    A 55 mph, los neumáticos pueden perder todo contacto con la superficie de la carretera.
- id: 108
  category: defensive_driving
  question: Para mantener una 'conciencia situacional' adecuada, ¿el Manual del Conductor
    de Kentucky sugiere observar el camino por delante al menos cuántos segundos?
  choices:
    A: De 2 a 5 segundos
    B: De 5 a 8 segundos
    C: De 10 a 15 segundos
    D: De 20 a 30 segundos
  answer: C
  explanation: Se recomienda a los conductores mirar de 10 a 15 segundos hacia adelante
    para identificar posibles peligros con anticipación y evitar maniobras de último
    minuto.
- id: 109
  category: defensive_driving
  question: En Kentucky, ¿cuándo están las carreteras más resbaladizas durante una
    tormenta de lluvia?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Durante una llovizna ligera que dura todo el día
    C: Justo después de que comienza a llover
    D: Cuando sale el sol después de la lluvia
  answer: C
  explanation: Las carreteras están más resbaladizas justo después de que comienza
    a llover porque el agua se mezcla con el aceite y el polvo del pavimento que aún
    no se ha lavado.
- id: 110
  category: defensive_driving
  question: Al acercarse a un cruce de ferrocarril en Kentucky con una señal de alto
    o semáforo, ¿dentro de qué distancia del riel más cercano debe detener su vehículo?
  choices:
    A: Entre 5 y 20 pies
    B: Entre 10 y 25 pies
    C: Entre 15 y 50 pies
    D: Exactamente 50 pies
  answer: C
  explanation: La ley de Kentucky exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano en un cruce de ferrocarril cuando sea necesario detenerse.
- id: 111
  category: defensive_driving
  question: ¿Si sus frenos fallan mientras conduce, cuál debería ser su primera acción
    defensiva de acuerdo con las pautas de seguridad de Kentucky?
  choices:
    A: Apagar el encendido inmediatamente
    B: Cambiar a una marcha más baja y bombear el pedal del freno rápida y fuertemente
      varias veces
    C: Saltar fuera del vehículo
    D: Poner el auto en 'Park' (estacionamiento)
  answer: B
  explanation: Bombear los frenos a menudo puede generar suficiente presión hidráulica
    para detener el auto, y reducir la marcha utiliza el motor para ayudar a frenar
    el vehículo.
- id: 112
  category: defensive_driving
  question: En Kentucky, ¿de qué se compone la 'Distancia Total de Parada'?
  choices:
    A: Solo la distancia de frenado
    B: Distancia de reacción y distancia de frenado
    C: Distancia de percepción, distancia de reacción y distancia de frenado
    D: Distancia de percepción y velocidad
  answer: C
  explanation: La distancia total de parada es la suma del tiempo que toma ver el
    peligro (percepción), el tiempo para mover el pie al freno (reacción) y la distancia
    que recorre el vehículo una vez que se aplican los frenos (frenado).
- id: 113
  category: defensive_driving
  question: 'Si está conduciendo en una carretera de Kentucky y se revienta un neumático,
    usted debe:'
  choices:
    A: Frenar fuerte inmediatamente para detenerse
    B: Sujetar el volante firmemente y mantener el vehículo recto mientras reduce
      la velocidad gradualmente
    C: Girar rápidamente hacia el acotamiento (shoulder)
    D: Acelerar para mantener el impulso
  answer: B
  explanation: En un reventón, el frenado repentino puede causar un desvío. Debe mantener
    un agarre firme, seguir recto y soltar el acelerador para reducir la velocidad
    de manera segura.
- id: 114
  category: alcohol_drugs_health
  question: Si un conductor de Kentucky es condenado por una primera ofensa de DUI
    con una 'circunstancia agravante', ¿cuál es la sentencia mínima obligatoria de
    cárcel?
  choices:
    A: 24 horas
    B: 48 horas
    C: 4 días
    D: 10 días
  answer: C
  explanation: Para una primera ofensa de DUI en Kentucky, si hay una circunstancia
    agravante presente, hay una sentencia mínima obligatoria de cárcel de 4 días.
- id: 115
  category: alcohol_drugs_health
  question: La ley de 'Contenedor Abierto' (Open Container) de Kentucky prohíbe la
    posesión de un recipiente de bebida alcohólica abierto en el área de pasajeros
    de un vehículo. ¿Dónde es legal guardar un contenedor abierto?
  choices:
    A: En la guantera
    B: En la consola central
    C: En el maletero (trunk)
    D: Debajo del asiento del conductor
  answer: C
  explanation: Los contenedores abiertos deben mantenerse en el maletero o en un área
    que no esté ocupada normalmente por el conductor o los pasajeros. La guantera
    generalmente se considera parte del área de pasajeros.
- id: 116
  category: alcohol_drugs_health
  question: 'Un conductor de Kentucky condenado por una primera ofensa de DUI debe
    completar un programa de educación o tratamiento por abuso de sustancias por un
    período de:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: La ley de Kentucky exige que quienes cometen un DUI por primera vez
    completen un programa de educación o tratamiento por abuso de alcohol o sustancias
    de 90 días.
- id: 117
  category: alcohol_drugs_health
  question: En Kentucky, ¿con qué nivel de Concentración de Alcohol en Sangre (BAC)
    se considera que un conductor está operando bajo un nivel 'agravado', independientemente
    de otros factores?
  choices:
    A: 0.10% o más
    B: 0.15% o más
    C: 0.20% o más
    D: 0.25% o más
  answer: B
  explanation: Operar un vehículo motorizado con un BAC de 0.15% o más se enumera
    específicamente como una circunstancia agravante en los estatutos de DUI de Kentucky.
- id: 118
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados en Kentucky, ¿puede ser condenado
    por DUI?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, el DUI solo se aplica al alcohol y las drogas ilegales
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Sí, pero solo si lo mezcla con alcohol
  answer: C
  explanation: La ley de Kentucky prohíbe conducir bajo la influencia de cualquier
    sustancia que pueda afectar la capacidad de conducción, incluidos los medicamentos
    recetados o de venta libre.
- id: 119
  category: alcohol_drugs_health
  question: De acuerdo con los estándares médicos de Kentucky, ¿cuánto tiempo debe
    pasar una persona que ha experimentado una convulsión o desmayo sin tenerlos antes
    de poder conducir legalmente?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Las regulaciones administrativas de Kentucky generalmente requieren
    que un conductor esté libre de convulsiones o desmayos durante al menos 90 días
    para ser elegible para una licencia.
- id: 120
  category: alcohol_drugs_health
  question: 'En Kentucky, el ''período de revisión'' (lookback period) para condenas
    previas por DUI para determinar si una ofensa actual es una segunda o subsiguiente
    es de:'
  choices:
    A: 3 años
    B: 5 años
    C: 10 años
    D: Permanente
  answer: C
  explanation: Kentucky utiliza un período de 'revisión' de 10 años (también conocido
    como período de 'eliminación') para las ofensas de DUI.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una circunstancia agravante para un DUI en
    Kentucky que involucra la velocidad?
  choices:
    A: Exceder el límite de velocidad por 15 mph
    B: Exceder el límite de velocidad por 20 mph
    C: Exceder el límite de velocidad por 25 mph
    D: Exceder el límite de velocidad por 30 mph o más
  answer: D
  explanation: Operar un vehículo motorizado a más de 30 millas por hora sobre el
    límite de velocidad establecido mientras se está bajo la influencia es una circunstancia
    agravante en Kentucky.
- id: 122
  category: alcohol_drugs_health
  question: En Kentucky, ¿quién puede ser acusado bajo la ley de envase abierto (Open
    Container) si se encuentra una bebida alcohólica abierta en el área de pasajeros
    de un vehículo?
  choices:
    A: Solo el conductor
    B: Solo la persona que sostiene el envase
    C: El conductor y/o cualquier pasajero que esté en posesión del envase
    D: Solo los pasajeros
  answer: C
  explanation: La ley de envase abierto de Kentucky se aplica tanto al conductor como
    a los pasajeros. Ninguna persona debe tener un envase de bebida alcohólica abierto
    en su posesión mientras se encuentre en el área de pasajeros de un vehículo motorizado
    en una vía pública.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto principal de combinar alcohol con otras drogas al conducir?
  choices:
    A: Las drogas anulan el alcohol
    B: El alcohol anula las drogas
    C: Los efectos se multiplican (efecto sinérgico)
    D: No hay cambios en el nivel de deterioro
  answer: C
  explanation: Combinar alcohol con otras drogas, incluso las de venta libre, crea
    un efecto sinérgico donde el nivel de deterioro es mucho mayor que el de cualquiera
    de las sustancias por sí sola.
- id: 124
  category: alcohol_drugs_health
  question: 'En Kentucky, si un conductor es condenado por un DUI mientras conduce
    en ''sentido contrario'' en una autopista de acceso limitado, esto se clasifica
    como:'
  choices:
    A: Un DUI estándar
    B: Una circunstancia agravante
    C: Un delito grave (felony) en la primera infracción
    D: Una infracción no relacionada con el movimiento
  answer: B
  explanation: Operar un vehículo motorizado en la dirección incorrecta en una autopista
    dividida de acceso limitado es una de las circunstancias agravantes específicas
    definidas por la ley de DUI de Kentucky.
- id: 125
  category: alcohol_drugs_health
  question: En Kentucky, una condena por DUI se considera 'agravada' si la concentración
    de alcohol en sangre (BAC) del conductor es igual o superior a ¿qué nivel?
  choices:
    A: 0.10%
    B: 0.15%
    C: 0.18%
    D: 0.20%
  answer: B
  explanation: La ley de Kentucky define un BAC de 0.15% o superior como una 'circunstancia
    agravante', lo que activa un tiempo mínimo obligatorio en la cárcel y sanciones
    más elevadas.
- id: 126
  category: alcohol_drugs_health
  question: Según la ley de Kentucky, ¿cuál es el período de retrospectiva (look-back
    period) para contabilizar condenas previas por DUI a fines de sentencia?
  choices:
    A: 3 años
    B: 5 años
    C: 10 años
    D: 15 años
  answer: C
  explanation: Kentucky utiliza un período de retrospectiva de 10 años. Si un conductor
    es condenado por un DUI, cualquier otra condena por DUI dentro de los 10 años
    anteriores se contabiliza para determinar si se trata de una segunda, tercera
    o subsiguiente infracción.
- id: 127
  category: alcohol_drugs_health
  question: La ley de 'envase abierto' (Open Container) de Kentucky prohíbe ¿cuál
    de los siguientes?
  choices:
    A: Poseer un envase de bebida alcohólica abierto en el área de pasajeros de un
      vehículo en una vía pública
    B: Poseer una botella de vino sin abrir en el asiento delantero
    C: Poseer un envase abierto en el maletero del vehículo
    D: Poseer un envase abierto en la guantera cerrada con llave
  answer: A
  explanation: La ley de Kentucky prohíbe la posesión de un envase de bebida alcohólica
    abierto en el área de pasajeros de un vehículo motorizado mientras se encuentre
    en una vía pública. Esto se aplica tanto a conductores como a pasajeros.
- id: 128
  category: alcohol_drugs_health
  question: Si un conductor de Kentucky se niega a someterse a una prueba química
    de alcohol o drogas, ¿cuál es la consecuencia inmediata bajo la ley de consentimiento
    implícito (Implied Consent) por una primera infracción?
  choices:
    A: Una estancia obligatoria de 48 horas en la cárcel
    B: Una multa de $1,000
    C: Suspensión de los privilegios de conducir por el tribunal en el momento de
      la lectura de cargos
    D: Pérdida permanente del vehículo
  answer: C
  explanation: Si se niega a una prueba química en Kentucky, su licencia será suspendida
    por el tribunal en el momento de la lectura de cargos (arraignment). Para una
    primera infracción, la suspensión suele durar lo que dure el caso judicial (generalmente
    6 meses).
- id: 129
  category: alcohol_drugs_health
  question: En Kentucky, ¿puede ser condenado por un DUI si conduce bajo la influencia
    de medicamentos recetados legalmente?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, la ley de DUI solo se aplica al alcohol y a las drogas ilegales
    C: Sí, si el medicamento afecta su capacidad para conducir de manera segura
    D: Sí, pero solo si también tiene alcohol en su sistema
  answer: C
  explanation: La ley de DUI de Kentucky se aplica a cualquier sustancia que afecte
    la capacidad de un conductor para operar un vehículo motorizado, incluidos los
    medicamentos recetados, los medicamentos de venta libre y los inhalantes.
- id: 130
  category: alcohol_drugs_health
  question: ¿Cuál es el tiempo mínimo obligatorio en la cárcel por una segunda infracción
    de DUI dentro de un período de 10 años en Kentucky?
  choices:
    A: 24 horas
    B: 48 horas
    C: 7 días
    D: 30 días
  answer: C
  explanation: Para una segunda condena por DUI dentro de un período de 10 años en
    Kentucky, la ley exige un mínimo obligatorio de 7 días en la cárcel, que puede
    extenderse hasta 6 meses.
- id: 131
  category: alcohol_drugs_health
  question: 'En Kentucky, una cuarta condena por DUI o subsiguiente dentro de un período
    de 10 años se clasifica como:'
  choices:
    A: Un delito menor de Clase A
    B: Un delito menor de Clase B
    C: Una felonía de Clase D
    D: Una infracción sin tiempo de cárcel
  answer: C
  explanation: En Kentucky, una cuarta ofensa por DUI dentro de un período de 10 años
    es una felonía de Clase D, la cual conlleva una sentencia mínima obligatoria de
    120 días de prisión sin libertad condicional.
- id: 132
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Kentucky, ¿qué es lo primero que se ve
    afectado por el consumo de alcohol?
  choices:
    A: La visión
    B: La coordinación muscular
    C: El juicio
    D: El habla
  answer: C
  explanation: El alcohol afecta primero el juicio. Los conductores pueden sentirse
    más confiados y tomar riesgos que normalmente no tomarían antes de que su coordinación
    física o visión muestren signos obvios de deterioro.
- id: 133
  category: alcohol_drugs_health
  question: Para restablecer una licencia de conducir de Kentucky después de una condena
    por DUI, ¿cuál de los siguientes requisitos debe completar el conductor?
  choices:
    A: Un curso de conducción defensiva de 4 horas
    B: Un programa de abuso de sustancias aprobado por el estado
    C: Solo un nuevo examen escrito y de carretera
    D: 100 horas de servicio comunitario
  answer: B
  explanation: La ley de Kentucky exige que todas las personas condenadas por un DUI
    completen con éxito un programa de educación o tratamiento por abuso de sustancias
    con licencia del Gabinete de Servicios de Salud y Familia antes de que se pueda
    restablecer su licencia.
- id: 134
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una 'circunstancia agravante' que involucra
    a un pasajero en un caso de DUI en Kentucky?
  choices:
    A: Tener más de 3 pasajeros en el vehículo
    B: Tener un pasajero que también está intoxicado
    C: Transportar a un pasajero menor de 12 años
    D: Transportar a un pasajero que no tiene licencia
  answer: C
  explanation: Operar un vehículo motorizado bajo la influencia con un pasajero menor
    de 12 años se enumera específicamente como una circunstancia agravante en Kentucky
    (KRS 189A.010).
- id: 135
  category: penalties_and_points
  question: Para una primera condena por DUI en Kentucky, ¿por cuánto tiempo se suspenderá
    típicamente su licencia de conducir?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Una condena por DUI por primera ofensa en Kentucky generalmente conlleva
    un período de suspensión de la licencia de 6 meses.
- id: 136
  category: penalties_and_points
  question: ¿Con qué frecuencia es elegible un conductor de Kentucky para asistir
    a la Escuela de Tráfico del Estado para reducir los puntos en su licencia?
  choices:
    A: Una vez cada 6 meses
    B: Una vez cada 12 meses
    C: Una vez cada 2 años
    D: Una vez cada 5 años
  answer: B
  explanation: La ley de Kentucky permite a los conductores asistir a la Escuela de
    Tráfico del Estado para la reducción de puntos una vez cada 12 meses.
- id: 137
  category: penalties_and_points
  question: En Kentucky, ser condenado por 'Conducción Temeraria' (Reckless Driving)
    resultará en ¿cuántos puntos en su historial de manejo?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: La conducción temeraria es una infracción de 4 puntos bajo el sistema
    de puntos de Kentucky.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos para un conductor de Kentucky que es
    condenado por rebasar un autobús escolar que está cargando o descargando?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos (Suspensión automática)
  answer: C
  explanation: Rebasar incorrectamente un autobús escolar que está cargando o descargando
    es una infracción grave que vale 6 puntos en Kentucky.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la multa estándar por una primera infracción del uso del cinturón
    de seguridad para un adulto en Kentucky?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: La ley primaria del cinturón de seguridad de Kentucky conlleva una
    multa de $25 por infracciones.
- id: 140
  category: penalties_and_points
  question: 'En Kentucky, debe presentar un informe de accidente por escrito (Formulario
    KSP 232) si el accidente resultó en daños a la propiedad que exceden los:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: La ley de Kentucky exige un informe por escrito al Departamento de
    la Policía Estatal dentro de los 10 días si los daños a la propiedad exceden los
    $500.
- id: 141
  category: penalties_and_points
  question: ¿Para un conductor de 18 años o más, una condena por enviar mensajes de
    texto mientras conduce en Kentucky resulta en cuántos puntos?
  choices:
    A: 0 puntos (Solo multa)
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: B
  explanation: Enviar mensajes de texto mientras se conduce es una infracción de 3
    puntos para conductores de 18 años o más en Kentucky.
- id: 142
  category: penalties_and_points
  question: 'Si un conductor de Kentucky es condenado por ''Carreras'' (Racing) en
    una vía pública, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: La ley de Kentucky exige una suspensión de la licencia de 90 días por
    una condena por participar en carreras en una vía pública.
- id: 143
  category: penalties_and_points
  question: 'En Kentucky, arrojar basura desde un vehículo motorizado es una infracción
    que puede resultar en una multa de hasta:'
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: C
  explanation: Arrojar basura es una infracción penal en Kentucky, y los infractores
    pueden ser multados con hasta $500.
- id: 144
  category: penalties_and_points
  question: Para una primera condena por DUI en Kentucky, ¿cuál es el período estándar
    de suspensión de la licencia para un conductor mayor de 21 años?
  choices:
    A: 30 a 60 días
    B: 4 a 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Una condena por DUI por primera vez para un conductor de 21 años o
    más en Kentucky generalmente resulta en una suspensión de la licencia de 4 a 6
    meses.
- id: 145
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'Conducción Temeraria' (Reckless Driving)
    en el estado de Kentucky?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: El sistema de puntos de Kentucky asigna 4 puntos al registro de un
    conductor por una condena de conducción temeraria.
- id: 146
  category: penalties_and_points
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para los
    conductores comerciales (titulares de CDL) que operan un vehículo comercial en
    Kentucky?
  choices:
    A: '0.01'
    B: '0.02'
    C: '0.04'
    D: '0.08'
  answer: C
  explanation: De acuerdo con las leyes federales y del estado de Kentucky, el límite
    de BAC para los conductores comerciales que operan un vehículo comercial es de
    0.04.
- id: 147
  category: penalties_and_points
  question: En Kentucky, ¿cuántos puntos se asignan por una condena de 'No detenerse
    ante un autobús escolar o de una iglesia'?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: Sin puntos, pero una multa de $500
  answer: C
  explanation: No detenerse ante un autobús escolar o de una iglesia que está cargando
    o descargando pasajeros es una infracción grave de 6 puntos en Kentucky.
- id: 148
  category: penalties_and_points
  question: Según la ley de Kentucky, ¿cuál es la multa por una primera infracción
    de 'Enviar mensajes de texto mientras se conduce' para un conductor mayor de 18
    años?
  choices:
    A: $25
    B: $100
    C: $250
    D: $500
  answer: A
  explanation: Para conductores de 18 años o más en Kentucky, la multa por una primera
    infracción de enviar mensajes de texto mientras se conduce es de $25 más las costas
    judiciales.
- id: 149
  category: sharing_the_road
  question: Según la ley de Kentucky, ¿cuál de los siguientes operadores de motocicletas
    está OBLIGADO a usar un casco protector?
  choices:
    A: Solo aquellos menores de 18 años
    B: Solo aquellos con un permiso de instrucción de motocicleta
    C: Operadores menores de 21 años, aquellos con un permiso o aquellos con licencia
      por menos de un año
    D: Todos los operadores de motocicletas independientemente de su edad o experiencia
  answer: C
  explanation: El estatuto KRS 189.285 establece que se requiere el uso de casco para
    los operadores menores de 21 años, aquellos con un permiso de instrucción de motocicleta
    y aquellos que han tenido su licencia de motocicleta por menos de un año.
- id: 150
  category: sharing_the_road
  question: En Kentucky, ¿qué debe hacer un conductor cuando un peatón cruza la calle
    guiado por un perro o lleva un bastón blanco (que puede tener la punta roja)?
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Cederles el paso y tomar precauciones para evitar lesiones
    C: Rodearlos si hay suficiente espacio
    D: Esperar a que crucen solo si hay un cruce de peatones marcado
  answer: B
  explanation: La ley de Kentucky exige que los conductores cedan el paso a los peatones
    ciegos que utilicen un perro guía o un bastón blanco, independientemente de si
    se encuentran en un cruce de peatones marcado.
- id: 151
  category: sharing_the_road
  question: ¿Cuántos puntos se suman a su historial de conducción por una primera
    condena por rebasar un autobús escolar detenido en Kentucky mientras carga o descarga
    pasajeros?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: Según el sistema de puntos de Kentucky, "no detenerse ante un autobús
    escolar" es una infracción de 6 puntos.
- id: 152
  category: sharing_the_road
  question: 'Al encontrarse con un vehículo de tracción animal en las carreteras de
    Kentucky, usted debe:'
  choices:
    A: Tocar la bocina para advertir al conductor de su acercamiento
    B: Usar las luces altas para ver mejor el carruaje
    C: Reducir la velocidad y rebasar solo cuando sea seguro y no asuste al caballo
    D: Mantener siempre una velocidad de al menos 55 mph para rebasar rápidamente
  answer: C
  explanation: Kentucky tiene muchas comunidades amish y menonitas. Los conductores
    deben ser cautelosos, evitar ruidos fuertes como tocar la bocina y rebasar lentamente
    para evitar asustar a los animales.
- id: 153
  category: sharing_the_road
  question: En Kentucky, ¿es legal el "lane splitting" o división de carril (una motocicleta
    que circula entre dos carriles de tráfico detenido o en movimiento)?
  choices:
    A: Sí, es legal a velocidades inferiores a 30 mph
    B: Sí, es legal si los autos están detenidos en un semáforo
    C: No, es ilegal y las motocicletas deben circular dentro de un solo carril
    D: Solo es legal para los servicios de emergencia
  answer: C
  explanation: En Kentucky, las motocicletas tienen derecho al uso completo de un
    carril y no se permite la división de carril; las motocicletas deben seguir las
    mismas reglas de carril que los demás vehículos.
- id: 154
  category: sharing_the_road
  question: Según la ley de Kentucky, ¿cuál es la distancia mínima que debe mantener
    al seguir a un vehículo de emergencia que responde a una alarma?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El estatuto KRS 189.930(5) prohíbe a los conductores seguir a cualquier
    vehículo de emergencia a menos de 500 pies cuando este responde a una emergencia.
- id: 155
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle estrecha, es posible
    que necesite:'
  choices:
    A: Abrirse ampliamente hacia la izquierda antes de girar
    B: Detenerse y retroceder para realizar el giro
    C: Girar desde el carril izquierdo
    D: Aumentar la velocidad para despejar la intersección
  answer: A
  explanation: Los camiones grandes tienen un radio de giro amplio. Para no chocar
    con el bordillo, a menudo se abren hacia la izquierda. Los conductores nunca deben
    intentar meterse entre un camión y el bordillo durante un giro a la derecha.
- id: 156
  category: sharing_the_road
  question: 'En Kentucky, la ley exige que los ciclistas:'
  choices:
    A: Circulen por la acera en todo momento
    B: Circulen en sentido contrario al tráfico
    C: Obedezcan las mismas leyes y señales de tráfico que los conductores de vehículos
      motorizados
    D: Solo circulen por ciclovías designadas
  answer: C
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    automovilistas en Kentucky y deben obedecer todas las señales de tráfico, letreros
    y marcas en el pavimento.
- id: 157
  category: sharing_the_road
  question: Si usted está girando en una intersección y un peatón está cruzando por
    un paso de peatones no marcado, ¿quién tiene el derecho de paso en Kentucky?
  choices:
    A: El conductor, porque el paso de peatones no está marcado
    B: El peatón
    C: Quien haya llegado primero a la intersección
    D: El peatón, pero solo si lleva ropa reflectante
  answer: B
  explanation: La ley de Kentucky exige que los conductores cedan el paso a los peatones
    tanto en los pasos de peatones marcados como en los no marcados en las intersecciones.
- id: 158
  category: sharing_the_road
  question: Según la ley de Kentucky (KRS 189.378), ¿cuál es la regla con respecto
    a los cortejos fúnebres?
  choices:
    A: Deben ceder el paso a todo el resto del tráfico
    B: Tienen el derecho de paso en las intersecciones independientemente de las señales
      de tráfico, si el vehículo guía entró legalmente
    C: Solo se permiten los domingos
    D: No deben exceder las 25 mph en ninguna carretera
  answer: B
  explanation: Los cortejos fúnebres tienen el derecho de paso en las intersecciones.
    Una vez que el vehículo guía entra legalmente en una intersección, los vehículos
    restantes del cortejo pueden seguirlo independientemente de los semáforos, siempre
    que actúen con la debida precaución.
- id: 159
  category: sharing_the_road
  question: 'En Kentucky, las motocicletas deben tener sus faros encendidos:'
  choices:
    A: Solo por la noche
    B: Solo durante el mal tiempo
    C: En todo momento mientras estén en funcionamiento
    D: Solo cuando circulen por la carretera interestatal
  answer: C
  explanation: La ley de Kentucky exige que las motocicletas tengan sus faros encendidos
    en todo momento mientras estén en funcionamiento para aumentar la visibilidad
    ante otros conductores.
- id: 160
  category: sharing_the_road
  question: En Kentucky, cuando un autobús escolar se detiene en una carretera de
    cuatro carriles que NO está dividida por una mediana o barrera física, ¿qué tráfico
    debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico en el carril más alejado del autobús
    C: El tráfico en todas las direcciones
    D: Nadie está obligado a detenerse en una carretera de cuatro carriles
  answer: C
  explanation: Según el Manual del Conductor de Kentucky, en una carretera de cuatro
    o más carriles, todo el tráfico debe detenerse ante un autobús escolar a menos
    que la calzada esté dividida por una mediana o barrera física. Si no hay barrera,
    todos los carriles en ambas direcciones deben detenerse.
- id: 161
  category: sharing_the_road
  question: 'Al seguir a un camión comercial grande, si no puede ver los espejos laterales
    del conductor del camión, usted está:'
  choices:
    A: En la "Zona Prohibida" (No-Zone) o punto ciego del camión
    B: En la posición ideal para rebasar
    C: A salvo de cualquier escombro que caiga del camión
    D: Siguiendo a una distancia legal y segura
  answer: A
  explanation: El Manual del Conductor de Kentucky enfatiza que si no puede ver la
    cara del conductor en su espejo lateral, él no puede verlo a usted. Esta área
    se conoce como la "Zona Prohibida" (No-Zone) o punto ciego.
- id: 162
  category: sharing_the_road
  question: En Kentucky, ¿qué debe hacer cuando ve a un peatón con un bastón blanco
    o un perro guía entrando en una intersección?
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Cederles el derecho de paso y detenerse por completo
    D: Rodearlos si hay suficiente espacio
  answer: C
  explanation: La ley de Kentucky exige que los conductores cedan el derecho de paso
    a los peatones ciegos que utilicen un perro guía o lleven un bastón blanco (con
    o sin punta roja).
- id: 163
  category: sharing_the_road
  question: En una carretera de Kentucky dividida por un camellón o barrera física,
    ¿cuándo debe detenerse el tráfico que viaja en la dirección opuesta a un autobús
    escolar detenido?
  choices:
    A: Siempre
    B: Solo si hay más de tres niños cruzando
    C: Nunca
    D: Solo si el conductor del autobús les hace una señal para detenerse
  answer: C
  explanation: Si un autobús escolar se detiene en una carretera dividida por un camellón
    o barrera física, solo el tráfico que sigue al autobús debe detenerse. El tráfico
    en la dirección opuesta no está obligado a detenerse.
- id: 164
  category: sharing_the_road
  question: En Kentucky, ¿es ilegal seguir a menos de cuántos pies a un vehículo de
    emergencia que responde a una alarma?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El estatuto KRS 189.930(4) establece que el conductor de cualquier
    vehículo, que no esté en misión oficial, no debe seguir a ningún vehículo de emergencia
    o de seguridad pública a menos de 500 pies.
- id: 165
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los ciclistas
    en las carreteras de Kentucky?
  choices:
    A: Siempre deben circular por la acera
    B: Deben circular en sentido contrario al tráfico
    C: Tienen los mismos derechos y responsabilidades que los conductores de vehículos
      motorizados
    D: No se les permite circular por ninguna carretera con un límite de velocidad
      superior a 35 mph
  answer: C
  explanation: En Kentucky, las bicicletas se consideran vehículos. Los ciclistas
    tienen los mismos derechos en la carretera y deben obedecer las mismas leyes de
    tránsito que los automovilistas.
- id: 166
  category: sharing_the_road
  question: Si usted está conduciendo y un cortejo fúnebre se aproxima a una intersección,
    ¿cuál es la ley en Kentucky?
  choices:
    A: El cortejo debe ceder el paso a todo el resto del tráfico
    B: Usted debe ceder el derecho de paso a todo el cortejo hasta que hayan pasado
      todos los vehículos
    C: Solo el vehículo guía del cortejo tiene el derecho de paso
    D: Puede atravesar el cortejo si hay un espacio grande
  answer: B
  explanation: Según la ley de Kentucky (KRS 189.378), los cortejos fúnebres tienen
    el derecho de paso en las intersecciones. Los conductores deben ceder el paso
    a todo el cortejo y se les prohíbe conducir entre los vehículos del cortejo o
    unirse a ellos.
- id: 167
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Abrirse hacia el carril izquierdo para completar el giro
    C: Girar únicamente desde el carril izquierdo
    D: Detenerse y esperar a que el tráfico despeje ambos carriles
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha. Los conductores deben evitar "apretarse" entre
    el camión y la acera.
- id: 168
  category: sharing_the_road
  question: En Kentucky, ¿cómo es el emblema de un vehículo de movimiento lento?
  choices:
    A: Una señal azul circular
    B: Un emblema triangular de color naranja rojizo
    C: Una señal amarilla cuadrada
    D: Una señal blanca rectangular
  answer: B
  explanation: Los vehículos de movimiento lento (aquellos que viajan a 25 mph o menos),
    como la maquinaria agrícola o los carruajes tirados por caballos, deben exhibir
    un emblema triangular de color naranja rojizo fluorescente con un borde reflectante.
- id: 169
  category: sharing_the_road
  question: 'Si un vehículo de emergencia con luces y sirenas activadas se le aproxima
    por detrás mientras usted está en medio de una intersección, usted debe:'
  choices:
    A: Detenerse inmediatamente en la intersección
    B: Girar a la izquierda para quitarse del camino
    C: Continuar a través de la intersección y luego hacerse a la derecha y detenerse
    D: Retroceder para despejar la intersección
  answer: C
  explanation: El Manual del Conductor de Kentucky instruye a los conductores a nunca
    detenerse en una intersección. Si se aproxima un vehículo de emergencia, termine
    de cruzar la intersección y luego hágase a la derecha.
- id: 170
  category: sharing_the_road
  question: 'Al rebasar un vehículo tirado por caballos en Kentucky, el conductor
    debe:'
  choices:
    A: Tocar la bocina para alertar al conductor
    B: Acelerar para rebasar lo más rápido posible
    C: Reducir la velocidad y rebasar con precaución, evitando ruidos fuertes
    D: Encender las luces altas para ver mejor el vehículo
  answer: C
  explanation: Al compartir la carretera con vehículos tirados por caballos, los conductores
    deben reducir la velocidad, dejar suficiente espacio y evitar movimientos bruscos
    o ruidos fuertes como tocar la bocina, lo que podría asustar al caballo.
- id: 171
  category: sharing_the_road
  question: 'En Kentucky, los peatones deben usar una acera cuando haya una disponible.
    Si no hay una acera disponible, deben caminar:'
  choices:
    A: En el lado derecho de la carretera con el flujo del tráfico
    B: En el lado izquierdo de la carretera de frente al tráfico que viene en sentido
      contrario
    C: En medio de la carretera donde sean más visibles
    D: Solo durante las horas del día
  answer: B
  explanation: El Manual del Conductor de Kentucky establece que si no hay acera,
    los peatones deben caminar por el lado izquierdo de la carretera, de frente al
    tráfico, para ver mejor y reaccionar ante los vehículos que se aproximan.
- id: 172
  category: vehicle_information
  question: Según el Manual del Conductor de Kentucky, debe usar sus faros delanteros
    desde la puesta del sol hasta el amanecer y en cualquier otro momento en que no
    pueda ver claramente a una distancia de al menos ¿cuántos pies?
  choices:
    A: 300 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Kentucky exige que los faros delanteros estén encendidos
    desde la puesta del sol hasta el amanecer, o siempre que las condiciones climáticas
    o la falta de luz imposibiliten ver al menos a 500 pies de distancia.
- id: 173
  category: vehicle_information
  question: Según la ley de Kentucky, ¿cuál es la profundidad mínima legal de la banda
    de rodadura para los neumáticos de un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros e ilegales en Kentucky si la
    banda de rodadura está cortada, dañada o desgastada a una profundidad inferior
    a 2/32 de pulgada.
- id: 174
  category: vehicle_information
  question: 'La ley de Kentucky exige que la luz que ilumina la placa de matrícula
    trasera debe hacer que la placa sea legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 150 pies
  answer: B
  explanation: Todo vehículo de motor en Kentucky debe tener una luz blanca que ilumine
    la placa de matrícula trasera para que pueda leerse claramente desde una distancia
    de 50 pies.
- id: 175
  category: vehicle_information
  question: 'Para que un vehículo sea operado legalmente en Kentucky, la bocina debe
    ser capaz de emitir un sonido audible en condiciones normales desde una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los Estatutos Revisados de Kentucky exigen que todo vehículo de motor
    esté equipado con una bocina en buen estado de funcionamiento capaz de emitir
    un sonido audible desde una distancia no inferior a 200 pies.
- id: 176
  category: vehicle_information
  question: ¿Cuál es el porcentaje máximo legal de bloqueo de luz (polarizado) permitido
    en las ventanas laterales delanteras de un vehículo en Kentucky?
  choices:
    A: 25% de bloqueo de luz
    B: 35% de bloqueo de luz
    C: 50% de bloqueo de luz
    D: 65% de bloqueo de luz
  answer: B
  explanation: La ley de Kentucky (KRS 189.110) especifica que las ventanas laterales
    delanteras deben permitir el paso de al menos el 35% de la luz (lo que significa
    no más del 65% de bloqueo, aunque la regla a menudo se expresa como '35% de tinte'
    en el lenguaje común refiriéndose a la transmisión).
- id: 177
  category: vehicle_information
  question: En Kentucky, si una carga se extiende más de ¿cuántos pies? más allá de
    la parte trasera de la plataforma o carrocería de un vehículo, se debe mostrar
    una bandera roja o una luz roja al final de la carga.
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: La ley de Kentucky exige que se coloque una bandera roja (de día) o
    una luz roja (de noche) en el extremo posterior de cualquier carga que se extienda
    más de cuatro pies más allá de la parte trasera del vehículo.
- id: 178
  category: vehicle_information
  question: Todo vehículo de motor en Kentucky debe estar equipado con un espejo ubicado
    de tal manera que refleje al conductor una vista de la carretera por una distancia
    de al menos ¿cuántos pies? hacia atrás.
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Kentucky exige que los vehículos tengan un espejo que proporcione
    una vista de la carretera de al menos 200 pies detrás del vehículo.
- id: 179
  category: vehicle_information
  question: Según la ley de seguro obligatorio de Kentucky, ¿cuál es el monto mínimo
    de cobertura de responsabilidad civil por 'daños a la propiedad' requerido por
    accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Los requisitos mínimos de seguro de responsabilidad civil de Kentucky
    son $25,000 por lesiones corporales por persona, $50,000 por lesiones corporales
    por accidente y $25,000 por daños a la propiedad.
- id: 180
  category: vehicle_information
  question: La ley de Kentucky exige que los niños menores de qué edad Y que midan
    entre 40 y 57 pulgadas de alto deben estar asegurados en un asiento elevador (booster
    seat).
  choices:
    A: Menores de 6 años
    B: Menores de 7 años
    C: Menores de 8 años
    D: Menores de 10 años
  answer: C
  explanation: Según la ley de Kentucky, cualquier niño menor de 8 años y que mida
    entre 40 y 57 pulgadas de alto debe estar debidamente asegurado en un asiento
    elevador para niños (booster seat).
- id: 181
  category: vehicle_information
  question: En Kentucky, las luces de freno de un vehículo deben ser rojas y deben
    ser visibles desde una distancia de al menos ¿cuántos pies bajo la luz solar normal?
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los estándares de equipamiento de vehículos de Kentucky requieren que
    las luces de freno sean visibles desde una distancia de 500 pies durante el día.
- id: 182
  category: vehicle_information
  question: Con respecto a la dirección, un vehículo en Kentucky se considera inseguro
    si hay más de cuánto "juego" (giro libre) en un volante con un diámetro de 18
    pulgadas o menos?
  choices:
    A: 1 pulgada
    B: 2 pulgadas
    C: 3 pulgadas
    D: 4 pulgadas
  answer: B
  explanation: El Manual del Conductor de Kentucky establece que la dirección es insegura
    si hay más de dos pulgadas de "juego" en el volante.
- id: 183
  category: vehicle_information
  question: En Kentucky, las ventanas laterales traseras y la ventana trasera de un
    automóvil de pasajeros pueden estar polarizadas para permitir un mínimo de ¿qué
    porcentaje de transmisión de luz?
  choices:
    A: 18%
    B: 25%
    C: 35%
    D: 50%
  answer: A
  explanation: Si bien las ventanas laterales delanteras deben permitir un 35% de
    transmisión de luz, la ley de Kentucky permite que las ventanas laterales traseras
    y la ventana trasera sean más oscuras, requiriendo solo un 18% de transmisión
    de luz.
- id: 184
  category: vehicle_information
  question: En Kentucky, las señales de giro deben usarse para indicar la intención
    de girar durante al menos ¿cuántos pies antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Kentucky exige que los conductores indiquen su intención
    de girar al menos 100 pies antes de llegar al punto de giro.
- id: 185
  category: vehicle_information
  question: 'Según el Manual del Conductor de Kentucky, los faros delanteros deben
    usarse cuando la visibilidad se limita a menos de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 700 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Kentucky exige el uso de faros delanteros cuando no hay suficiente
    luz para ver claramente a personas o vehículos a 500 pies de distancia.
- id: 186
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para vehículos de pasajeros en Kentucky?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros y no cumplen con los estándares
    legales de Kentucky si están desgastados hasta un punto en el que queda menos
    de 2/32 de pulgada de banda de rodadura.
- id: 187
  category: vehicle_information
  question: Según la ley de Kentucky, el freno de servicio (de pie) de cada vehículo
    motorizado debe ser capaz de detener el vehículo en ¿cuántos pies cuando viaja
    a 20 mph?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 45 pies
  answer: C
  explanation: El Manual del Conductor de Kentucky establece que el freno de servicio
    debe poder detener el vehículo en un tramo de 30 pies a una velocidad de 20 mph.
- id: 188
  category: vehicle_information
  question: La ley de Kentucky exige que todos los vehículos motorizados tengan un
    espejo retrovisor que proporcione una vista de la carretera durante al menos ¿cuántos
    pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo motorizado debe estar equipado con un espejo ubicado
    de manera que refleje al conductor una vista de la carretera a una distancia de
    al menos 200 pies hacia atrás.
- id: 189
  category: vehicle_information
  question: 'Según las regulaciones de equipamiento de Kentucky, la placa de matrícula
    trasera debe estar iluminada para que sea legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Kentucky exige que una luz blanca ilumine la placa de matrícula
    trasera para que sea claramente legible desde una distancia de 50 pies hacia atrás.
- id: 190
  category: vehicle_information
  question: Según la ley de Kentucky (KRS 189.110), ¿cuál es la oscuridad máxima permitida
    del polarizado para las ventanas laterales delanteras (a la izquierda y derecha
    inmediatas del conductor)?
  choices:
    A: 25% de transmisión de luz
    B: 35% de transmisión de luz
    C: 50% de transmisión de luz
    D: 70% de transmisión de luz
  answer: B
  explanation: La ley de Kentucky exige que las ventanas laterales delanteras permitan
    el paso de al menos el 35% de la luz (más o menos un 3% de tolerancia).
- id: 191
  category: vehicle_information
  question: ¿Para los automóviles de pasajeros en Kentucky, cuál es la oscuridad máxima
    permitida del polarizado para las ventanas laterales traseras y la ventana trasera?
  choices:
    A: 8% de transmisión de luz
    B: 18% de transmisión de luz
    C: 35% de transmisión de luz
    D: 50% de transmisión de luz
  answer: B
  explanation: La ley de Kentucky especifica que, para los automóviles de pasajeros,
    las ventanas laterales traseras y la ventana trasera deben permitir el paso de
    al menos el 18% de la luz.
- id: 192
  category: vehicle_information
  question: 'En Kentucky, se debe exhibir un emblema de "Vehículo de Movimiento Lento"
    en la parte trasera de cualquier vehículo que esté diseñado para operar a velocidades
    de:'
  choices:
    A: 15 mph o menos
    B: 20 mph o menos
    C: 25 mph o menos
    D: 35 mph o menos
  answer: C
  explanation: El emblema triangular de vehículo de movimiento lento es obligatorio
    para los vehículos diseñados para viajar a velocidades de 25 millas por hora o
    menos.
- id: 193
  category: vehicle_information
  question: La ley de Kentucky exige que todo vehículo de motor esté equipado con
    al menos ¿cuántas luces traseras rojas montadas en la parte trasera?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: La ley de Kentucky exige que los vehículos de motor tengan al menos
    dos luces traseras rojas (una a cada lado) visibles desde una distancia de 500
    pies hacia atrás.
- id: 194
  category: vehicle_information
  question: ¿Cuál es el requisito de Kentucky con respecto al sistema de escape de
    un vehículo?
  choices:
    A: Debe tener una derivación o corte (bypass/cutout)
    B: Debe estar equipado con un silenciador en buen estado de funcionamiento para
      evitar ruidos excesivos
    C: Debe estar modificado para aumentar el sonido del motor
    D: Solo necesita ser funcional durante los meses de invierno
  answer: B
  explanation: La norma KRS 189.140 exige que todo vehículo de motor esté equipado
    con un silenciador en buen estado de funcionamiento y en operación constante para
    evitar ruidos excesivos o inusuales y humo molesto.
- id: 195
  category: vehicle_information
  question: 'En Kentucky, las señales de giro deben ser visibles desde una distancia
    no menor a:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Los estándares de equipamiento de Kentucky requieren que las señales
    de giro sean visibles desde una distancia de al menos 100 pies tanto hacia adelante
    como hacia atrás.
- id: 196
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para los parabrisas de los vehículos
    operados en Kentucky?
  choices:
    A: Deben estar hechos de vidrio de seguridad
    B: Pueden tener grietas de hasta 12 pulgadas de largo
    C: No son obligatorios si el conductor usa gafas protectoras
    D: Deben estar polarizados al menos al 50% de oscuridad
  answer: A
  explanation: La ley de Kentucky exige que todos los vehículos de motor estén equipados
    con un parabrisas de vidrio de seguridad, y este debe estar libre de cualquier
    obstrucción que dificulte la visión del conductor.
- id: 197
  category: signs_and_signals
  question: En Kentucky, ¿cuándo se le permite girar a la izquierda con luz roja?
  choices:
    A: Nunca
    B: Solo cuando gira desde una calle de un solo sentido hacia otra calle de un
      solo sentido
    C: Solo cuando gira desde una calle de doble sentido hacia una calle de un solo
      sentido
    D: Siempre que no haya tráfico en sentido contrario
  answer: B
  explanation: Según el Manual del Conductor de Kentucky, puede girar a la izquierda
    en rojo solo cuando gira desde una calle de un solo sentido hacia otra calle de
    un solo sentido, después de detenerse por completo y ceder el paso al tráfico
    y a los peatones.
- id: 198
  category: signs_and_signals
  question: ¿Qué significa una señal de flecha amarilla intermitente en Kentucky?
  choices:
    A: Deténgase y espere la luz verde
    B: La señal está a punto de ponerse roja; despeje la intersección
    C: Se permiten los giros, pero primero debe ceder el paso al tráfico en sentido
      contrario y a los peatones
    D: Tiene un giro protegido; el tráfico en sentido contrario está detenido
  answer: C
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    a la izquierda, pero no están "protegidos", lo que significa que debe ceder el
    paso al tráfico en sentido contrario y a los peatones antes de completar el giro.
- id: 199
  category: signs_and_signals
  question: 'Para señalar un giro a la derecha usando señales manuales, un conductor
    de Kentucky debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera de la ventana
    B: Extender el brazo izquierdo hacia afuera y apuntar hacia arriba
    C: Extender el brazo izquierdo hacia afuera y apuntar hacia abajo
    D: Extender el brazo derecho hacia afuera de la ventana del pasajero
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia afuera de la ventana y doblado hacia arriba a la altura del codo.
- id: 200
  category: signs_and_signals
  question: ¿Cuál es el significado de una línea blanca continua pintada en el borde
    derecho de la calzada?
  choices:
    A: Marca el borde del carril de circulación y no debe cruzarse excepto en emergencias
    B: Indica un carril donde se permite el estacionamiento
    C: Marca el comienzo de una zona escolar
    D: Indica que se permite rebasar por la derecha
  answer: A
  explanation: Las líneas blancas continuas a lo largo del borde del pavimento (líneas
    de niebla) sirven como guía para ayudar a los conductores a permanecer en la carretera,
    especialmente de noche o con mal tiempo.
- id: 201
  category: signs_and_signals
  question: 'Al acercarse a una intersección con una luz roja intermitente en Kentucky,
    usted debe:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse solo si hay tráfico cruzado
    C: Detenerse por completo y ceder el paso tal como lo haría ante una señal de
      alto (stop)
    D: Tratarla como una luz amarilla y acelerar para despejar la intersección
  answer: C
  explanation: Una luz roja intermitente significa lo mismo que una señal de alto.
    Debe detenerse por completo y ceder el paso al tráfico y a los peatones antes
    de continuar.
- id: 202
  category: signs_and_signals
  question: ¿Cuál es la forma específica de una señal de 'Ceda el paso' (Yield) utilizada
    en las carreteras de Kentucky?
  choices:
    A: Octágono
    B: Rombo (diamante)
    C: Triángulo equilátero apuntando hacia abajo
    D: Banderín (pennant)
  answer: C
  explanation: Una señal de ceda el paso es un triángulo equilátero con la punta hacia
    abajo, típicamente de color rojo y blanco.
- id: 203
  category: signs_and_signals
  question: En Kentucky, ¿qué indica una señal de tráfico de color rosa fluorescente?
  choices:
    A: Zona escolar
    B: Recreación pública o interés cultural
    C: Gestión de incidentes (accidentes o escenas de emergencia)
    D: Construcción o mantenimiento
  answer: C
  explanation: Las señales de color rosa fluorescente se utilizan para la gestión
    de incidentes para advertir a los conductores sobre emergencias temporales como
    accidentes o inundaciones.
- id: 204
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas sólidas dobles pintadas entre los carriles
    de circulación?
  choices:
    A: Puede cruzarlas para cambiar de carril en cualquier momento
    B: Separan el tráfico que se mueve en direcciones opuestas
    C: Está prohibido cruzar las líneas
    D: Indican un carril de giro compartido
  answer: C
  explanation: Las líneas blancas sólidas dobles indican que los cambios de carril
    están prohibidos entre esos carriles.
- id: 205
  category: signs_and_signals
  question: 'Una señal en forma de banderín (pennant) situada en el lado izquierdo
    de una carretera de dos carriles indica:'
  choices:
    A: Una zona escolar más adelante
    B: Una zona de no rebasar (no pasar)
    C: Un cruce de ferrocarril
    D: Una curva cerrada a la izquierda
  answer: B
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para marcar el inicio de una zona de no rebasar.
- id: 206
  category: signs_and_signals
  question: En Kentucky, ¿cuál es el propósito de un carril marcado con una línea
    amarilla sólida y una línea amarilla discontinua en cada lado?
  choices:
    A: Es un carril para vehículos de alta ocupación (HOV)
    B: Es un carril de giro a la izquierda compartido para vehículos en ambas direcciones
    C: Es un carril reservado solo para vehículos de emergencia
    D: Es un carril de rebase para el tráfico que sube una pendiente
  answer: B
  explanation: Estas marcas definen un carril de giro a la izquierda compartido, que
    es utilizado por vehículos que viajan en cualquier dirección para realizar giros
    a la izquierda.
- id: 207
  category: signs_and_signals
  question: 'Para indicar que está reduciendo la velocidad o deteniéndose mediante
    señales manuales, usted debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo con la palma hacia atrás
    D: Agitar la mano por la ventana
  answer: C
  explanation: La señal manual para reducir la velocidad o detenerse es el brazo izquierdo
    extendido hacia afuera y doblado hacia abajo en el codo.
- id: 208
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de 'Sentido contrario' (Wrong Way)
    en Kentucky?
  choices:
    A: Se está acercando a una calle de un solo sentido desde la dirección correcta
    B: Está conduciendo en contra del flujo del tráfico
    C: La carretera adelante está cerrada por construcción
    D: Debe realizar un giro en U inmediatamente
  answer: B
  explanation: Una señal de 'Sentido contrario' indica que está viajando en la dirección
    opuesta al tráfico. Debe detenerse y orillarse inmediatamente, luego dar la vuelta
    cuando sea seguro.
- id: 209
  category: signs_and_signals
  question: En Kentucky, ¿cuál es la forma específica de una señal de 'Zona de no
    rebasar' (No Passing Zone) que se encuentra en el lado izquierdo de la carretera?
  choices:
    A: Rombo (diamante)
    B: Rectángulo
    C: Banderín (pennant)
    D: Redonda
  answer: C
  explanation: Según el Manual del Conductor de Kentucky, se coloca una señal en forma
    de banderín en el lado izquierdo de la carretera para indicar el inicio de una
    zona de no rebasar.
- id: 210
  category: signs_and_signals
  question: Cuando vea una luz amarilla intermitente en una intersección en Kentucky,
    ¿qué debe hacer?
  choices:
    A: Detenerse por completo y esperar a que la luz cambie a verde.
    B: Reducir la velocidad y proceder con precaución.
    C: Acelerar para despejar la intersección rápidamente.
    D: Tratarla como una parada de cuatro vías (four-way stop).
  answer: B
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución, tal como se describe en el Manual del Conductor de
    Kentucky.
- id: 211
  category: signs_and_signals
  question: ¿En Kentucky, bajo qué condición específica se permite girar a la izquierda
    con luz roja?
  choices:
    A: Nunca se permite girar a la izquierda con luz roja.
    B: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    C: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido.
    D: Solo si no viene tráfico desde la derecha.
  answer: C
  explanation: La ley de Kentucky permite girar a la izquierda en rojo únicamente
    cuando se gira desde una calle de un solo sentido hacia otra calle de un solo
    sentido, después de detenerse por completo y ceder el paso al tráfico y a los
    peatones.
- id: 212
  category: signs_and_signals
  question: Según el Manual del Conductor de Kentucky, ¿qué significa una línea amarilla
    continua en su lado de la línea central discontinua?
  choices:
    A: Puede rebasar si es seguro hacerlo.
    B: Se encuentra en una zona de no rebasar (no-passing zone).
    C: La carretera más adelante está en construcción.
    D: Debe girar a la derecha en la próxima intersección.
  answer: B
  explanation: Una línea amarilla continua en su lado de la línea central indica una
    zona de no rebasar, donde es ilegal e inseguro adelantar a otros vehículos.
- id: 213
  category: signs_and_signals
  question: 'El emblema de "Vehículo de movimiento lento" (Slow Moving Vehicle), un
    letrero naranja triangular con borde rojo, debe exhibirse en vehículos que viajan
    a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: En Kentucky, el emblema de vehículo de movimiento lento es obligatorio
    para los vehículos diseñados para operar a velocidades de 25 millas por hora o
    menos.
- id: 214
  category: signs_and_signals
  question: Si las luces direccionales de su vehículo no funcionan, ¿cuál es la señal
    manual de Kentucky para un giro a la derecha?
  choices:
    A: Brazo extendido directamente hacia afuera de la ventana.
    B: Brazo extendido hacia arriba en un ángulo de 90 grados.
    C: Brazo extendido hacia abajo en un ángulo de 90 grados.
    D: Mover el brazo en movimiento circular.
  answer: B
  explanation: Para indicar un giro a la derecha mediante señales manuales, el conductor
    debe extender el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 215
  category: signs_and_signals
  question: En Kentucky, ¿qué indican las líneas blancas discontinuas pintadas en
    el pavimento?
  choices:
    A: Tráfico moviéndose en direcciones opuestas.
    B: El borde de la calzada.
    C: Tráfico moviéndose en la misma dirección.
    D: Un cruce peatonal.
  answer: C
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección e indican que se permiten los cambios de carril
    cuando sea seguro.
- id: 216
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en una intersección en Kentucky?
  choices:
    A: Reducir la velocidad y avanzar si el camino está despejado.
    B: Detenerse y esperar a que la luz cambie a verde.
    C: Detenerse por completo y avanzar solo cuando sea seguro hacerlo.
    D: La señal está averiada; trátela como una intersección sin control.
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto (STOP). Debe detenerse por completo y puede avanzar solo cuando sea seguro
    y haya cedido el paso al resto del tráfico.
- id: 217
  category: signs_and_signals
  question: En Kentucky, ¿de qué color son las señales reglamentarias que proporcionan
    información sobre leyes y reglamentos?
  choices:
    A: Amarillo con letras negras
    B: Naranja con letras negras
    C: Azul con letras blancas
    D: Blanco con letras negras o rojas
  answer: D
  explanation: Las señales reglamentarias, como las de límite de velocidad o las de
    "No entrar", suelen ser rectangulares y utilizan los colores blanco, negro y rojo.
- id: 218
  category: signs_and_signals
  question: ¿Cuál es la señal manual de Kentucky para detenerse o disminuir la velocidad?
  choices:
    A: Brazo extendido directamente hacia afuera.
    B: Brazo extendido hacia arriba.
    C: Brazo extendido hacia abajo.
    D: Brazo moviéndose de adelante hacia atrás.
  answer: C
  explanation: Para indicar que se va a detener o a reducir la velocidad, extienda
    el brazo izquierdo por la ventana y apunte hacia abajo.
- id: 219
  category: signs_and_signals
  question: ¿De qué forma y color es una señal de "Ceda el paso" (Yield) en Kentucky?
  choices:
    A: Un triángulo equilátero rojo y blanco que apunta hacia abajo.
    B: Un círculo amarillo y negro.
    C: Un octágono rojo.
    D: Un rectángulo blanco.
  answer: A
  explanation: Una señal de ceda el paso es un triángulo que apunta hacia abajo, generalmente
    de color rojo y blanco (aunque algunas versiones más antiguas pueden ser amarillas
    y negras).
- id: 220
  category: signs_and_signals
  question: Cuando ve una señal de "Construcción de carretera adelante" (Road Construction
    Ahead) en Kentucky, ¿de qué color es probable que sea?
  choices:
    A: Amarillo
    B: Verde
    C: Naranja
    D: Marrón
  answer: C
  explanation: El naranja es el color estándar para las señales de mantenimiento y
    construcción de carreteras en Kentucky y en todo Estados Unidos.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Hacer una parada completa
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 221
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Hacer una parada completa
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 222
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 223
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de
    manera segura.
  id: 224
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UNA VÍA (ONE WAY) con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 225
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 226
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 227
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 228
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 229
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Giro a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 230
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad indican la velocidad máxima legal para el área
    en condiciones ideales.
  id: 231
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 232
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    sobre un cruce de peatones más adelante. Esté preparado para detenerse ante los
    peatones que crucen la calle.
  id: 233
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 234
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 235
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 236
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 237
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 238
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 239
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 240
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 241
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 242
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 243
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Zona de incorporación más adelante
    D: Construcción en la carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 244
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: Tráfico en ambos sentidos más adelante — el tráfico circula en ambas direcciones
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 245
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 246
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 247
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de pare (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 248
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de pare (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de pare (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de pare.
  id: 249
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce peatonal
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 250
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 251
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un carril nuevo; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 252
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 253
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para discapacitados válida pueden
    estacionarse en estos espacios. Las infracciones conllevan multas elevadas.
  id: 254
