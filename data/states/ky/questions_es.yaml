  choices:
    A: Cada dos años en la fecha de compra
    B: Anualmente durante el mes de nacimiento del propietario
    C: Cada 1 de enero
    D: Anualmente en la fecha en que se emitió el título
  answer: B
  explanation: En Kentucky, el registro del vehículo debe renovarse anualmente. Para
    las personas físicas, el período de renovación es el mes de nacimiento del propietario.
- id: 56
  category: driver_responsibility
  question: Si compra un vehículo en Kentucky, ¿dentro de cuántos días debe transferir
    el título y el registro a su nombre?
  choices:
    A: 7 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: La ley de Kentucky exige que el título y el registro de un vehículo
    se transfieran dentro de los 15 días posteriores a la fecha de compra.
- id: 57
  category: driver_responsibility
  question: Bajo el sistema de puntos de Kentucky, ¿cuántos puntos se asignan a su
    historial de manejo por 'Conducción Temeraria' (Reckless Driving)?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 9 puntos
  answer: B
  explanation: La conducción temeraria en Kentucky resulta en la adición de 4 puntos
    al historial del conductor.
- id: 58
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan al historial de un conductor de Kentucky por
