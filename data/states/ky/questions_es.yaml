questions:
- id: 1
  category: license_system
  question: ¿Quién figura como Comisionado de la Policía Estatal de Kentucky en el
    texto del manual proporcionado?
  choices:
    A: Phillip Burnett, Jr.
    B: John Beshear
    C: Michael Dossett
    D: Richard Sanders
  answer: A
  explanation: Según el texto introductorio del manual, Phillip Burnett, Jr. es el
    Comisionado de la Policía Estatal de Kentucky.
- id: 2
  category: penalties_and_points
  question: Según la Tabla de Contenido, ¿qué sección cubre la "Pérdida de los Privilegios
    de Conducir"?
  choices:
    A: Sección Uno
    B: Sección Dos
    C: Sección Tres
    D: Sección Cuatro
  answer: A
  explanation: 'La Tabla de Contenido enumera la "Pérdida de los Privilegios de Conducir"
    bajo la Sección Uno: La Licencia de Conducir.'
- id: 3
  category: alcohol_drugs_health
  question: ¿Dónde debería buscar un conductor en el manual para encontrar información
    sobre la Junta de Revisión Médica?
  choices:
    A: Sección Uno
    B: Sección Dos
    C: Sección Cinco
    D: Sección Nueve
  answer: B
  explanation: 'Según la Tabla de Contenido, la "Junta de Revisión Médica" se trata
    en la Sección Dos: Información General.'
- id: 4
  category: alcohol_drugs_health
  question: '¿Cuál de los siguientes temas se trata en la Sección Tres: Estar en forma
    para conducir?'
  choices:
    A: Registro de vehículos motorizados
    B: Fatiga
    C: Bolsas de aire (Air Bags)
    D: Marcas en el pavimento
  answer: B
  explanation: 'La Tabla de Contenido indica que la "Fatiga" es uno de los temas cubiertos
    en la Sección Tres: Estar en forma para conducir.'
- id: 5
  category: safe_driving_rules
  question: Si necesita informarse sobre las Leyes de Seguridad para Niños Pasajeros,
    ¿qué sección del manual debe consultar?
  choices:
    A: Sección Dos
    B: Sección Tres
    C: Sección Cuatro
    D: Sección Cinco
  answer: C
  explanation: 'La Tabla de Contenido enumera las "Leyes de Seguridad para Niños Pasajeros"
    bajo la Sección Cuatro: Antes de Conducir.'
- id: 6
  category: vehicle_information
  question: ¿Qué significan las siglas ADAS en la Sección Cuatro del manual?
  choices:
    A: Conducción y dirección automáticas
    B: Sistemas Avanzados de Asistencia al Conductor (Advanced Driver Assistance Systems)
    C: Conducción y seguridad adaptativas
    D: Sistemas automatizados de alerta al conductor
  answer: B
  explanation: La Sección Cuatro de la Tabla de Contenido enumera las "Funciones de
    seguridad de los Sistemas Avanzados de Asistencia al Conductor (ADAS)".
- id: 7
  category: vehicle_information
  question: ¿Qué sección se titula "Conducción Básica" y cubre el arranque del motor,
    el movimiento, la detención, la dirección y la marcha atrás?
  choices:
    A: Sección Cuatro
    B: Sección Cinco
    C: Sección Seis
    D: Sección Siete
  answer: B
  explanation: La Tabla de Contenido muestra que la Sección Cinco se titula "Conducción
    Básica" e incluye temas como arrancar el motor, avanzar, detenerse, maniobrar
    el volante y retroceder.
- id: 8
  category: signs_and_signals
  question: ¿En qué sección se puede encontrar información sobre las Marcas en el
    Pavimento y las Señales de Tráfico?
  choices:
    A: 'Sección Cinco: Conducción Básica'
    B: 'Sección Seis: Reglas de la Carretera'
    C: 'Sección Siete: Conducción General'
    D: 'Sección Ocho: Consejos para una Conducción Segura'
  answer: B
  explanation: 'Según la Tabla de Contenido, las "Señales de Tráfico" y las "Marcas
    en el Pavimento" se encuentran en la Sección Seis: Reglas de la Carretera.'
- id: 9
  category: sharing_the_road
  question: ¿Bajo qué sección se encuentran las "Reglas para Autobuses Escolares"?
  choices:
    A: Sección Cuatro
    B: Sección Seis
    C: Sección Siete
    D: Sección Nueve
  answer: C
  explanation: 'La Tabla de Contenido ubica las "Reglas para Autobuses Escolares"
    dentro de la Sección Siete: Conducción General.'
- id: 10
  category: safe_driving_rules
  question: La Sección Siete cubre la "Conducción General". ¿Cuál de los siguientes
    es un tema incluido en esta sección?
  choices:
    A: Rotondas y círculos de tráfico
    B: Búsqueda visual
    C: Inspección de su vehículo
    D: Donación de órganos
  answer: A
  explanation: 'La Tabla de Contenido enumera "Rotondas y círculos de tráfico" como
    un tema bajo la Sección Siete: Conducción General.'
- id: 11
  category: defensive_driving
  question: 'Si un conductor desea leer sobre ''Control de velocidad'' y ''Distancia
    de frenado'', debe buscar en:'
  choices:
    A: Sección cinco
    B: Sección seis
    C: Sección siete
    D: Sección ocho
  answer: D
  explanation: 'Según el índice, el ''Control de velocidad'' y la ''Distancia de frenado''
    se tratan en la Sección ocho: Consejos para una conducción segura.'
- id: 12
  category: defensive_driving
  question: ¿Cuál es el título de la Sección nueve?
  choices:
    A: Reglas de la carretera
    B: Consejos para una conducción segura
    C: Situaciones de emergencia y cómo evitar choques
    D: Conducción general
  answer: C
  explanation: El índice titula la Sección nueve como 'Situaciones de emergencia y
    cómo evitar choques'.
- id: 13
  category: driver_responsibility
  question: ¿Qué sección contiene información sobre la 'Donación de órganos'?
  choices:
    A: Sección uno
    B: Sección dos
    C: Sección tres
    D: Sección diez
  answer: B
  explanation: 'El índice enumera la ''Donación de órganos'' como un tema en la Sección
    dos: Información general.'
- id: 14
  category: driver_responsibility
  question: '''Emociones, conducción agresiva y furia al volante'' es una subsección
    de ¿qué sección principal?'
  choices:
    A: 'Sección tres: Estar en condiciones para conducir'
    B: 'Sección seis: Reglas de la carretera'
    C: 'Sección ocho: Consejos para una conducción segura'
    D: 'Sección nueve: Situaciones de emergencia'
  answer: A
  explanation: 'Según el índice, ''Emociones, conducción agresiva y furia al volante''
    se encuentra en la Sección tres: Estar en condiciones para conducir.'
- id: 15
  category: driver_testing
  question: ¿Dónde puede encontrar información sobre la 'Programación de exámenes'
    y los 'Requisitos y preparación para los exámenes'?
  choices:
    A: Sección uno
    B: Sección dos
    C: Sección cuatro
    D: Sección cinco
  answer: A
  explanation: 'El índice muestra que los ''Requisitos y preparación para los exámenes''
    y la ''Programación de exámenes'' se encuentran en la Sección uno: La licencia
    de conducir.'
- id: 16
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para solicitar una licencia de operador
    Clase D en Kentucky?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 17 años de edad
    D: 18 años de edad
  answer: B
  explanation: Según el manual, los solicitantes de una licencia de operador Clase
    D deben ser residentes de Kentucky y tener al menos 16 años de edad.
- id: 17
  category: license_system
  question: ¿Qué clase de licencia de conducir de Kentucky está restringida únicamente
    a ciclomotores (mopeds)?
  choices:
    A: Clase C
    B: Clase D
    C: Clase E
    D: Clase M
  answer: C
  explanation: El manual establece que la licencia Clase E es solo para ciclomotores.
- id: 18
  category: license_system
  question: No se requiere una Licencia de conducir comercial (CDL) para un agricultor
    que conduce un vehículo agrícola dentro de ¿qué distancia desde su punto de origen?
  choices:
    A: 50 millas
    B: 100 millas
    C: 150 millas
    D: 200 millas
  answer: C
  explanation: No se requiere una CDL para un conductor de vehículos utilizados exclusivamente
    en el transporte agrícola de la granja al mercado, que sean propiedad y estén
    operados por el agricultor o sus empleados, y que se utilicen dentro de las 150
    millas del punto de origen.
- id: 19
  category: license_system
  question: Se requiere una Licencia de conducir comercial Clase C para un solo vehículo
    de menos de 26,001 libras si tiene carteles de materiales peligrosos o si está
    diseñado para transportar a más de ¿cuántas personas (incluido el conductor)?
  choices:
    A: 10 personas
    B: 12 personas
    C: 15 personas
    D: 16 personas
  answer: D
  explanation: Se requiere una CDL Clase C para cualquier vehículo individual con
    una clasificación de peso bruto combinado de menos de 26,001 libras que tenga
    carteles de materiales peligrosos o esté diseñado para transportar a más de dieciséis
    (16) personas, incluido el conductor del vehículo.
- id: 20
  category: license_system
  question: ¿Qué se requiere para un solicitante de licencia Clase D que sea menor
    de 18 años?
  choices:
    A: Deben completar un curso de conducción defensiva.
    B: Un padre o tutor legal debe firmar la solicitud.
    C: Deben tener un cosignatario para el seguro del vehículo.
    D: Deben aprobar un examen médico físico.
  answer: B
  explanation: El manual especifica que si el solicitante es menor de 18 años, un
    padre o tutor legal debe firmar la solicitud.
- id: 21
  category: driver_testing
  question: ¿Qué exámenes deben aprobar todos los solicitantes por primera vez para
    obtener una Licencia de Operador Clase D?
  choices:
    A: Exámenes de visión, conocimientos y habilidades
    B: Solo exámenes de visión y conocimientos
    C: Solo exámenes de conocimientos y habilidades
    D: Exámenes de visión, médicos y habilidades
  answer: A
  explanation: Todos los solicitantes por primera vez de una Licencia de Operador
    Clase D deben aprobar los exámenes de visión, conocimientos y habilidades.
- id: 22
  category: driver_testing
  question: ¿Cuál de los siguientes NO es un requisito para obtener una licencia de
    ciclomotor (moped) Clase E?
  choices:
    A: Un examen de visión
    B: Un examen de conocimientos generales
    C: Un examen de habilidades
    D: Tener al menos 16 años de edad
  answer: C
  explanation: Se requiere que los solicitantes aprueben los exámenes de conocimientos
    generales y de visión para que se les otorgue una licencia de ciclomotor. Sin
    embargo, no se requiere un examen de habilidades ni un permiso.
- id: 23
  category: vehicle_information
  question: 'Por definición en Kentucky, un ciclomotor (moped) es una bicicleta motorizada
    capaz de alcanzar una velocidad máxima de no más de:'
  choices:
    A: 20 millas por hora
    B: 25 millas por hora
    C: 30 millas por hora
    D: 35 millas por hora
  answer: C
  explanation: Un ciclomotor se define como una bicicleta motorizada capaz de alcanzar
    una velocidad máxima de no más de treinta (30) millas por hora.
- id: 24
  category: vehicle_information
  question: 'Para ser clasificado como un ciclomotor (moped), el vehículo debe tener
    una cilindrada que no exceda los:'
  choices:
    A: 30 centímetros cúbicos
    B: 50 centímetros cúbicos
    C: 100 centímetros cúbicos
    D: 150 centímetros cúbicos
  answer: B
  explanation: La definición de un ciclomotor incluye tener una cilindrada que no
    exceda los cincuenta (50) centímetros cúbicos.
- id: 25
  category: license_system
  question: Según el manual del conductor de Kentucky, ¿cuál de las siguientes personas
    NO es elegible para una licencia de conducir?
  choices:
    A: Una persona que usa lentes correctivos.
    B: Una persona que es incapaz de entender las advertencias de la carretera en
      el idioma inglés.
    C: Un no residente que trabaja en Kentucky.
    D: Un joven de 17 años con la firma de un padre.
  answer: B
  explanation: El manual enumera varias condiciones bajo las cuales una persona no
    es elegible para una licencia, incluyendo a cualquier persona que sea incapaz
    de entender las advertencias o direcciones de la carretera en el idioma inglés.
- id: 26
  category: license_system
  question: ¿Cuál de los siguientes conductores está exento de necesitar una Licencia
    de Conducir Comercial (CDL)?
  choices:
    A: Un conductor voluntario de un autobús de iglesia.
    B: Un conductor de autobús de escuela pública.
    C: Un operador de un vehículo recreativo no utilizado para el comercio.
    D: Un mecánico que realiza una prueba de conducción de un camión comercial.
  answer: C
  explanation: No se requiere una Licencia de Conducir Comercial (CDL) para los operadores
    de vehículos recreativos que no sean para el comercio. Los conductores voluntarios,
    los conductores de autobuses escolares y los mecánicos que operan vehículos comerciales
    sí requieren una CDL.
- id: 27
  category: license_system
  question: 'Se requiere una Licencia de Conducir Comercial Clase A para una combinación
    de vehículos con una clasificación de peso bruto combinado de 26,001 libras o
    más, siempre que el vehículo remolcado exceda las:'
  choices:
    A: 5,000 libras
    B: 8,000 libras
    C: 10,000 libras
    D: 15,000 libras
  answer: C
  explanation: Una CDL Clase A es para cualquier combinación de vehículos con una
    clasificación de peso bruto combinado de 26,001 libras o más, siempre que la clasificación
    de peso bruto vehicular del vehículo remolcado sea superior a 10,000 libras.
- id: 28
  category: license_system
  question: ¿Quién de los siguientes NO está obligado a obtener una licencia de conducir
    de Kentucky para conducir en el estado?
  choices:
    A: Un nuevo residente que se mudó recientemente a Kentucky de forma permanente.
    B: Un miembro militar en servicio activo que posee una licencia válida de otro
      estado.
    C: Un joven de 16 años que conduce un automóvil familiar a la escuela.
    D: Un conductor comercial que transporta mercancías dentro del estado.
  answer: B
  explanation: No se requiere una licencia de conducir de Kentucky para los miembros
    de las fuerzas armadas en servicio activo y sus dependientes que posean una licencia
    válida de otro estado.
- id: 29
  category: license_system
  question: ¿Se aplican los requisitos de la Licencia de Conducir Comercial (CDL)
    a los conductores voluntarios, como los conductores de autobuses de iglesias?
  choices:
    A: No, los conductores voluntarios siempre están exentos de los requisitos de
      la CDL.
    B: Sí, los requisitos de la CDL se aplican a los conductores voluntarios que operan
      vehículos motorizados comerciales.
    C: Solo si conducen a través de las fronteras estatales.
    D: Solo si se les paga un estipendio por su tiempo.
  answer: B
  explanation: El manual establece explícitamente que los requisitos de la CDL se
    aplican a los conductores voluntarios, como los conductores de autobuses de iglesias,
    conductores de autobuses de escuelas públicas y privadas, mecánicos, vendedores,
    etc.
- id: 30
  category: license_system
  question: ¿Qué clase de licencia de conducir de Kentucky se requiere específicamente
    para operar una motocicleta?
  choices:
    A: Clase B
    B: Clase C
    C: Clase D
    D: Clase M
  answer: D
  explanation: Según el manual, la licencia Clase M es para motocicletas.
- id: 31
  category: driver_testing
  question: ¿Qué exámenes se requieren para obtener una licencia de ciclomotor en
    Kentucky?
  choices:
    A: Exámenes de la vista, de conocimientos generales y de habilidades
    B: Solo exámenes de la vista y de conocimientos generales
    C: Solo exámenes de conocimientos generales y de habilidades
    D: Solo exámenes de la vista y de habilidades
  answer: B
  explanation: Según el manual, los solicitantes deben aprobar los exámenes de conocimientos
    generales y de la vista para que se les otorgue una licencia de ciclomotor. No
    se requiere un examen de habilidades ni un permiso.
- id: 32
  category: safe_driving_rules
  question: ¿Dónde es ilegal operar un ciclomotor?
  choices:
    A: En cualquier vía pública con un límite de velocidad superior a 35 mph
    B: En autopistas de acceso limitado donde la velocidad mínima es de más de 30
      mph
    C: En zonas residenciales con un límite de velocidad inferior a 25 mph
    D: En cualquier carretera estatal o interestatal
  answer: B
  explanation: El manual establece que los ciclomotores NO pueden operarse en autopistas
    de acceso limitado donde la velocidad mínima sea superior a treinta (30) millas
    por hora (mph).
- id: 33
  category: vehicle_information
  question: ¿Qué equipo de seguridad se requiere legalmente para los operadores de
    ciclomotores en Kentucky?
  choices:
    A: Casco y protección ocular
    B: Solo casco
    C: Solo protección ocular
    D: No se requiere legalmente ni casco ni protección ocular
  answer: D
  explanation: El manual señala que los operadores de ciclomotores no están obligados
    a usar cascos ni dispositivos de protección ocular, aunque se recomiendan encarecidamente.
- id: 34
  category: vehicle_information
  question: ¿Cuál de los siguientes está excluido de la definición legal de una motocicleta?
  choices:
    A: Un vehículo impulsado por motor con dos ruedas
    B: Un vehículo impulsado por motor con un sillín
    C: Un vehículo en el que el operador viaja en una cabina cerrada
    D: Un vehículo impulsado por motor con tres ruedas
  answer: C
  explanation: Una motocicleta se define como un vehículo impulsado por motor con
    un asiento o sillín y no más de tres ruedas, excluyendo específicamente ciclomotores,
    tractores y vehículos en los que el operador y los pasajeros viajan en una cabina
    cerrada.
- id: 35
  category: safe_driving_rules
  question: ¿Dónde puede un conductor operar legalmente una minimoto o un scooter
    motorizado sin una licencia de conducir?
  choices:
    A: En calles residenciales
    B: En propiedad privada
    C: En parques públicos
    D: En carreteras con un límite de velocidad inferior a 25 mph
  answer: B
  explanation: El manual establece que el único lugar donde un conductor puede conducir
    u operar legalmente vehículos pequeños como minimotos o scooters motorizados sin
    una licencia de conducir y equipo de seguridad es en propiedad privada.
- id: 36
  category: license_system
  question: ¿Quién es elegible para solicitar un permiso de instrucción de motocicleta
    sin necesidad de la firma de un padre o tutor?
  choices:
    A: Cualquier persona que tenga al menos 16 años
    B: Cualquier persona que posea una licencia de ciclomotor
    C: Una persona que tenga al menos 18 años de edad
    D: Una persona que tenga al menos 21 años de edad
  answer: C
  explanation: Una persona que tenga al menos dieciocho (18) años de edad puede solicitar
    un permiso de instrucción para operar una motocicleta. Si la persona es menor
    de 18 años, la solicitud debe estar firmada por un padre o tutor legal.
- id: 37
  category: driver_testing
  question: ¿Cómo puede un solicitante de una licencia de motocicleta quedar exento
    de los exámenes escritos y de habilidades?
  choices:
    A: Al tener un permiso de motocicleta por más de un año
    B: Al completar con éxito un curso de capacitación para conductores RideSmartKY
      aprobado
    C: Al tener una licencia de conducir válida de otro estado
    D: Al aprobar un examen de la vista con visión 20/20
  answer: B
  explanation: Los solicitantes de una licencia de motocicleta estarán exentos de
    los exámenes escritos y de habilidades de la licencia si presentan evidencia satisfactoria
    de haber completado con éxito un curso de capacitación para conductores aprobado
    (RideSmartKY).
- id: 38
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una licencia de operador,
    de motocicleta o de ciclomotor de Kentucky?
  choices:
    A: 15 años
    B: 16 años
    C: 17 años
    D: 18 años
  answer: B
  explanation: Para ser elegible para solicitar una licencia de operador, una licencia
    de motocicleta o una licencia de ciclomotor de Kentucky, debe haber cumplido dieciséis
    años.
- id: 39
  category: driver_responsibility
  question: ¿Qué sucede si un padre o tutor legal retira su responsabilidad por un
    conductor menor de edad?
  choices:
    A: El menor debe pagar una multa para seguir conduciendo
    B: El permiso o la licencia del menor serán cancelados
    C: El menor está restringido a conducir solo durante las horas del día
    D: El menor debe volver a tomar los exámenes escritos y de la vista
  answer: B
  explanation: Un padre o tutor legal tiene el derecho de retirar su responsabilidad
    en cualquier momento. Una vez que se recibe e ingresa el formulario de retiro,
    el permiso o la licencia del menor se cancelará hasta que se firme otra solicitud.
- id: 40
  category: license_system
  question: ¿Cuáles son las tres fases de obtención de la licencia para conductores
    menores de 18 años en el Programa de Licencia de Conducir Graduada (GDL)?
  choices:
    A: Permiso de aprendizaje, licencia restringida, licencia comercial
    B: Permiso de instrucción, licencia provisional, licencia intermedia
    C: Permiso de aprendizaje, licencia intermedia, licencia completa sin restricciones
    D: Licencia de ciclomotor, permiso de aprendizaje, licencia completa sin restricciones
  answer: C
  explanation: 'Los conductores menores de 18 años deben pasar por tres fases de obtención
    de licencia: un permiso de aprendizaje (Learner''s Permit), una licencia intermedia
    (Intermediate License) y luego una licencia completa sin restricciones (Full Unrestricted
    License).'
- id: 41
  category: license_system
  question: ¿Al solicitar un permiso, qué documento debe ser emitido por la escuela
    del solicitante?
  choices:
    A: Una copia certificada de su expediente académico
    B: Un Formulario de Verificación de Cumplimiento Escolar (School Compliance Verification
      Form)
    C: Una carta de recomendación del director
    D: Una tarjeta de identificación de estudiante
  answer: B
  explanation: Al solicitar un permiso, los solicitantes deben traer un Formulario
    de Verificación de Cumplimiento Escolar emitido por su escuela de acuerdo con
    la Ley de No Aprobación/No Conducción (No Pass/No Drive Law).
- id: 42
  category: license_system
  question: ¿Cuánto tiempo debe tener su permiso de conducir un titular de entre 16
    y 20 años antes de poder realizar el examen de conducir?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 365 días
  answer: C
  explanation: Los titulares de permisos de 16 a 20 años deben tener el permiso de
    conducir por un mínimo de 180 días.
- id: 43
  category: driver_testing
  question: ¿Cuántas horas totales de práctica de conducción deben registrarse para
    ser elegible para una licencia intermedia?
  choices:
    A: 40 horas
    B: 50 horas
    C: 60 horas
    D: 70 horas
  answer: C
  explanation: Para ser elegible para una licencia intermedia, un conductor debe completar
    un Registro de Práctica de Conducción con un mínimo de 60 horas de práctica de
    conducción.
- id: 44
  category: driver_testing
  question: De las horas de práctica de conducción requeridas para una licencia intermedia,
    ¿cuántas deben completarse por la noche?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: De las 60 horas totales de práctica de conducción requeridas para una
    licencia intermedia, 10 horas deben completarse por la noche.
- id: 45
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los documentos
    requeridos para solicitar un permiso?
  choices:
    A: Se aceptan fotocopias si están notarizadas
    B: Se aceptan fotocopias solo para la Tarjeta de Seguro Social
    C: No se aceptarán fotocopias de ninguno de los documentos requeridos
    D: Se aceptan fotos digitales en un teléfono inteligente en lugar de los documentos
      originales
  answer: C
  explanation: 'El manual establece explícitamente en letras mayúsculas: ''NO SE ACEPTARÁN
    FOTOCOPIAS DE NINGUNO DE LOS DOCUMENTOS REQUERIDOS''.'
- id: 46
  category: safe_driving_rules
  question: ¿Cuál es la restricción de pasajeros para el titular de un permiso?
  choices:
    A: No se permiten pasajeros en ningún momento.
    B: Limitado a 1 persona sin parentesco menor de 20 años.
    C: Limitado a 2 personas sin parentesco menores de 18 años.
    D: Limitado únicamente a miembros de la familia.
  answer: B
  explanation: El manual establece que la restricción de pasajeros para los titulares
    de permisos se limita a 1 (una) persona sin parentesco menor de 20 años.
- id: 47
  category: safe_driving_rules
  question: ¿Entre qué horas se prohíbe generalmente conducir a los titulares de permisos
    menores de 18 años?
  choices:
    A: 10:00 p.m. y 5:00 a.m.
    B: 11:00 p.m. y 6:00 a.m.
    C: Medianoche y 6:00 a.m.
    D: Medianoche y 5:00 a.m.
  answer: C
  explanation: Los titulares de permisos menores de 18 años no pueden conducir entre
    la medianoche y las 6:00 a.m., a menos que la persona pueda demostrar una causa
    justificada para conducir.
- id: 48
  category: alcohol_drugs_health
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) definido
    como 'Tolerancia Cero al Alcohol' para conductores menores de 21 años en Kentucky?
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: Todos los conductores menores de 21 años están sujetos a la 'Tolerancia
    Cero al Alcohol', que se define como una concentración de alcohol en sangre (BAC)
    de .02.
- id: 49
  category: penalties_and_points
  question: ¿Qué sucede si el titular de un permiso menor de 18 años comete una infracción
    de tránsito en movimiento?
  choices:
    A: Su permiso es revocado permanentemente.
    B: Debe pagar una multa de $500 y volver a tomar el examen escrito.
    C: Se agregan un mínimo de 180 días adicionales antes de que pueda solicitar una
      licencia intermedia.
    D: Debe completar 60 horas adicionales de práctica de conducción.
  answer: C
  explanation: Si ocurre una infracción, se agregará un mínimo de 180 días adicionales
    a partir de la fecha de la infracción antes de que el conductor pueda solicitar
    una licencia intermedia.
- id: 50
  category: penalties_and_points
  question: ¿Con cuántos puntos acumulados se le puede suspender el privilegio de
    conducir a un conductor menor de 18 años?
  choices:
    A: Más de 3 puntos
    B: Más de 6 puntos
    C: Más de 9 puntos
    D: Más de 12 puntos
  answer: B
  explanation: A un conductor menor de 18 años que acumule más de seis puntos se le
    puede suspender el privilegio de conducir.
- id: 51
  category: driver_testing
  question: ¿Si un solicitante reprueba el examen de habilidades de conducción, cuánto
    tiempo debe esperar antes de intentar el examen nuevamente?
  choices:
    A: Al menos 24 horas
    B: Al menos 3 días
    C: Al menos una semana
    D: Al menos 30 días
  answer: C
  explanation: Si reprueba el examen de habilidades de conducción, debe esperar al
    menos una semana a partir de la fecha del reprobado antes de intentar el examen
    nuevamente.
- id: 52
  category: license_system
  question: ¿Qué sucede inmediatamente después de que un conductor aprueba con éxito
    el examen práctico para su licencia intermedia?
  choices:
    A: Se le envía por correo una nueva tarjeta de licencia de plástico al día siguiente.
    B: El examinador coloca una calcomanía de "Licencia Intermedia" (Intermediate
      License) en el permiso del conductor.
    C: Debe entregar su permiso y conducir sin una licencia física durante 7 días.
    D: Se le emite una licencia completa sin restricciones en el acto.
  answer: B
  explanation: Después de completar con éxito el examen práctico, el examinador de
    la Policía Estatal de Kentucky colocará una calcomanía de "Licencia Intermedia"
    (Intermediate License) en el permiso del conductor.
- id: 53
  category: driver_testing
  question: ¿Cuál de las siguientes NO es una forma aceptable de comprobante de seguro
    de responsabilidad civil para el examen práctico?
  choices:
    A: Una tarjeta de comprobante de seguro proporcionada por la compañía de seguros
    B: Una póliza de seguro vigente para ese vehículo
    C: Una confirmación verbal del propietario del vehículo
    D: Un documento de cobertura provisional (binder) por escrito de un agente de
      seguros
  answer: C
  explanation: Los comprobantes de seguro aceptables incluyen una tarjeta de seguro,
    una póliza vigente o un documento de cobertura provisional (binder) por escrito
    de un agente. No se acepta la confirmación verbal.
- id: 54
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso temporal para solicitantes de
    18 a 20 años de edad?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: El manual establece que el permiso temporal emitido a los solicitantes
    es válido por tres años y puede ser renovado.
- id: 55
  category: license_system
  question: Si un permiso no se renueva dentro de un año de su fecha de vencimiento,
    ¿qué debe hacer el solicitante?
  choices:
    A: Pagar un cargo por demora de $50
    B: Repetir los exámenes escrito y de la vista
    C: Completar un curso adicional de educación vial
    D: Esperar 180 días antes de solicitarlo nuevamente
  answer: B
  explanation: Si el permiso no se renueva dentro de un año de la fecha de vencimiento,
    se deben repetir los exámenes escrito y de la vista.
- id: 56
  category: license_system
  question: ¿Cuántos comprobantes de residencia en Kentucky se requieren al solicitar
    un permiso REAL ID?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: El manual especifica que se requiere un comprobante de residencia en
    Kentucky del solicitante, pero se requieren dos (2) para una REAL ID.
- id: 57
  category: driver_testing
  question: Al llegar a una cita para el examen práctico, ¿cuál es el requisito con
    respecto al transporte del titular del permiso al lugar del examen?
  choices:
    A: Debe conducir por sí mismo para demostrar competencia básica.
    B: Debe estar acompañado por un conductor con licencia de al menos 21 años en
      el asiento del pasajero delantero.
    C: Debe ser llevado por un instructor de manejo certificado.
    D: Debe tomar el transporte público al centro de exámenes.
  answer: B
  explanation: Los titulares de permisos deben estar acompañados por una persona con
    una licencia de operador válida que tenga al menos 21 años de edad y que ocupe
    el asiento del pasajero delantero. Es ilegal conducir por sí mismos a la cita
    sin cumplir con este requisito.
- id: 58
  category: license_system
  question: Si un conductor joven elige tomar un curso privado de capacitación para
    conductores para cumplir con su requisito de educación de Licencia Graduada (GDL),
    ¿cuántas horas de capacitación en el aula debe incluir?
  choices:
    A: Dos (2) horas
    B: Cuatro (4) horas
    C: Seis (6) horas
    D: Ocho (8) horas
  answer: B
  explanation: Un curso de capacitación privada para conductores en una escuela de
    manejo aprobada debe incluir cuatro (4) horas de capacitación en el aula.
- id: 59
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de Kentucky?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 4 años
  answer: C
  explanation: Según el manual, el permiso temporal es válido por tres años y puede
    ser renovado.
- id: 60
  category: driver_testing
  question: ¿Cuánto tiempo debe tener su permiso un solicitante menor de 21 años antes
    de ser elegible para realizar el examen práctico?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: El manual establece que debe tener el permiso durante 180 días antes
    de ser elegible para realizar el examen práctico (antes de la sección "Solicitantes
    de 21 años o más").
- id: 61
  category: safe_driving_rules
  question: ¿Cuando el titular de un permiso está conduciendo, quién debe acompañarlo
    en el asiento del pasajero delantero?
  choices:
    A: Cualquier persona con una licencia de conducir válida.
    B: Un conductor con licencia que tenga al menos 18 años de edad.
    C: Un conductor con licencia que tenga al menos 21 años de edad.
    D: Solo un padre o tutor legal.
  answer: C
  explanation: Todos los titulares de permisos deben estar acompañados por una persona
    con una licencia de operador válida que tenga 21 años de edad o más y que ocupe
    siempre el asiento del pasajero a su lado.
- id: 62
  category: license_system
  question: ¿Se aceptan fotocopias de los documentos requeridos (como el certificado
    de nacimiento o la tarjeta del Seguro Social) al solicitar un permiso?
  choices:
    A: Sí, si están notarizadas.
    B: Sí, solo para la tarjeta del Seguro Social.
    C: No, no se aceptarán fotocopias de ninguno de los documentos requeridos.
    D: Sí, si son claras y legibles.
  answer: C
  explanation: 'El manual establece explícitamente: ''NO SE ACEPTARÁN FOTOCOPIAS DE
    NINGUNO DE LOS DOCUMENTOS REQUERIDOS''.'
- id: 63
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida para aprobar el examen de
    la vista inicial sin necesidad de ser remitido a un especialista?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: Se requiere una agudeza visual mínima de 20/40 (corregida o no corregida)
    antes de que se le permita al solicitante pasar a la prueba escrita.
- id: 64
  category: driver_testing
  question: 'Después de ser remitido a un especialista de la vista, un solicitante
    es elegible para realizar el examen del permiso de instrucción si su agudeza visual
    es de al menos:'
  choices:
    A: 20/40 o mejor
    B: 20/50 o mejor
    C: 20/60 o mejor
    D: 20/70 o mejor
  answer: C
  explanation: Una vez completada la remisión, los solicitantes cuya agudeza visual
    sea de 20/60 o mejor serán elegibles para realizar el examen del permiso de instrucción
    o la licencia de operador.
- id: 65
  category: driver_testing
  question: ¿Cuál es la puntuación mínima que debe alcanzar un solicitante para aprobar
    el examen escrito?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: Los solicitantes deben obtener una puntuación mínima del 80% para aprobar
    el examen escrito.
- id: 66
  category: driver_testing
  question: Si el examen escrito se administra de forma oral a un solicitante que
    no sabe leer inglés, ¿cómo debe manejarse la parte de las señales del examen?
  choices:
    A: El examinador describirá las señales al solicitante.
    B: Se exonera la parte de las señales en los exámenes orales.
    C: El solicitante debe responder la parte de las señales basándose en su propio
      conocimiento y comprensión.
    D: Se permite que un intérprete traduzca la parte de las señales.
  answer: C
  explanation: El manual establece que para los exámenes orales, 'la parte de las
    señales del examen debe ser respondida por los solicitantes basándose en su propio
    conocimiento y comprensión'.
- id: 67
  category: driver_testing
  question: ¿Bajo qué condición se permite el uso de un vehículo de alquiler para
    el examen de habilidades viales?
  choices:
    A: Si el solicitante tiene un seguro de cobertura total.
    B: Si el nombre del solicitante aparece en el contrato de alquiler como conductor.
    C: Si la empresa de alquiler proporciona una carta de permiso por escrito.
    D: Nunca se permiten vehículos de alquiler para el examen práctico.
  answer: B
  explanation: Se permiten vehículos de alquiler solo si el nombre del solicitante
    aparece en el contrato de alquiler como conductor del vehículo.
- id: 68
  category: driver_testing
  question: ¿Por qué podría un examinador rechazar un vehículo antes de que comience
    el examen de habilidades viales?
  choices:
    A: El vehículo no tiene cámara de reversa.
    B: El compartimiento de pasajeros, el asiento y el área del piso no están limpios.
    C: El vehículo tiene más de 10 años de antigüedad.
    D: El vehículo tiene transmisión manual.
  answer: B
  explanation: El manual establece que el compartimiento de pasajeros, el asiento
    y el área del piso deben estar limpios o el vehículo puede ser rechazado, ya que
    el examinador ocupará el lado del pasajero del asiento delantero.
- id: 69
  category: driver_testing
  question: ¿Se permiten intérpretes en el vehículo durante el examen práctico?
  choices:
    A: Sí, si se sientan en el asiento trasero.
    B: Sí, pero solo para la inspección del vehículo.
    C: No, pero pueden estar presentes antes y después del examen.
    D: No, los intérpretes están estrictamente prohibidos en el lugar del examen.
  answer: C
  explanation: Según el manual, no se permiten intérpretes en el vehículo durante
    el examen práctico. Sin embargo, un intérprete puede estar presente tanto antes
    como después del examen para ayudar según sea necesario.
- id: 70
  category: vehicle_information
  question: ¿Cuáles son los requisitos de distancia de los faros delanteros para las
    luces altas y bajas?
  choices:
    A: Luz alta 500 pies, luz baja 200 pies
    B: Luz alta 350 pies, luz baja 100 pies
    C: Luz alta 300 pies, luz baja 150 pies
    D: Luz alta 400 pies, luz baja 50 pies
  answer: B
  explanation: Los faros delanteros en luz alta deben ser lo suficientemente potentes
    como para revelar a una persona a 350 pies de distancia, y a 100 pies de distancia
    en luz baja.
- id: 71
  category: vehicle_information
  question: ¿A qué distancia debe ser visible la luz trasera roja de su vehículo?
  choices:
    A: 100 pies
    B: 350 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: La luz trasera debe ser roja y debe estar encendida y colocada de manera
    que pueda verse a 500 pies detrás de su vehículo.
- id: 72
  category: driver_testing
  question: ¿Qué sucede si el titular de un permiso conduce por sí mismo a la cita
    del examen de conducir sin un conductor con licencia que tenga al menos 21 años
    en el asiento delantero?
  choices:
    A: Recibirá una reprobación automática en el examen de conducir.
    B: El examen será reprogramado.
    C: Deberá pagar una tarifa de examen adicional.
    D: Se le permitirá realizar el examen pero recibirá una advertencia.
  answer: B
  explanation: Es ilegal que los solicitantes conduzcan por sí mismos a su cita para
    el examen de conducir sin un conductor con licencia de al menos 21 años ocupando
    el asiento del pasajero delantero. Las violaciones de esta norma en el sitio del
    examen causarán que el examen sea reprogramado.
- id: 73
  category: driver_testing
  question: Durante el examen de conducir, ¿cuántas veces puede un solicitante no
    seguir las instrucciones del examinador antes de ser descalificado?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Cuatro veces
  answer: B
  explanation: No seguir las instrucciones del examinador dos veces durante el examen
    resultará en la descalificación.
- id: 74
  category: driver_testing
  question: Si no aprueba el examen de conducir, ¿cuánto tiempo debe esperar antes
    de volver a realizar el examen?
  choices:
    A: Al menos 24 horas
    B: Al menos 48 horas
    C: Al menos una semana
    D: Al menos dos semanas
  answer: C
  explanation: En caso de no aprobar el examen de conducir, debe esperar al menos
    una semana antes de volver a realizar el examen.
- id: 75
  category: license_system
  question: ¿Cuántos días tienen las personas que se mudan a Kentucky para obtener
    una licencia de conducir de Kentucky después de establecer su residencia?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Las personas que se mudan a Kentucky deben obtener una licencia de
    conducir de Kentucky dentro de los 30 días posteriores a establecer su residencia.
- id: 76
  category: license_system
  question: Si está transfiriendo una licencia de otro estado a Kentucky y esta ha
    estado vencida por más de un año, ¿qué exámenes debe realizar?
  choices:
    A: Solo el examen escrito
    B: Solo el examen de conducir
    C: Tanto el examen escrito como el de la vista
    D: Los exámenes escrito, de la vista y de conducir
  answer: C
  explanation: Si la licencia ha estado vencida por más de un (1) año al momento de
    la transferencia, se le requerirá realizar tanto el examen escrito como el de
    la vista antes de que se le otorgue un permiso o licencia de operador de Kentucky.
- id: 77
  category: vehicle_information
  question: ¿Cuál es el requisito para los espejos en un vehículo motorizado?
  choices:
    A: Un espejo en el lado izquierdo y uno en el interior al centro o en el lado
      derecho.
    B: Un espejo en el lado izquierdo y uno en el lado derecho.
    C: Solo un espejo retrovisor en el interior al centro del vehículo.
    D: 'Tres espejos: izquierdo, derecho y central.'
  answer: A
  explanation: Un vehículo debe estar equipado con un espejo montado en el lado izquierdo
    del vehículo y un espejo montado ya sea dentro del vehículo aproximadamente en
    el centro o en el lado derecho del vehículo.
- id: 78
  category: vehicle_information
  question: Según la ley de Kentucky, ¿quién debe usar un cinturón de seguridad debidamente
    ajustado y abrochado en un vehículo fabricado después de 1981?
  choices:
    A: Solo el conductor
    B: El conductor y los pasajeros del asiento delantero
    C: El conductor y todos los pasajeros
    D: Pasajeros menores de 18 años
  answer: C
  explanation: Una persona no debe operar un vehículo motorizado fabricado después
    de 1981 en las vías públicas a menos que el conductor y todos los pasajeros usen
    un cinturón de seguridad debidamente ajustado y abrochado.
- id: 79
  category: driver_testing
  question: ¿Cuál de las siguientes situaciones resultará en una reprobación automática
    durante el examen de conducir?
  choices:
    A: Olvidar usar el freno de emergencia al estacionar
    B: Cualquier colisión, infracción de tráfico o acto peligroso
    C: Calar un vehículo de transmisión manual una vez
    D: Pedirle al examinador que repita una instrucción
  answer: B
  explanation: Cualquier colisión, infracción de tráfico o acto peligroso puede resultar
    en una reprobación automática, y el examen no se completará.
- id: 80
  category: vehicle_information
  question: ¿Cuál es el único material de protección solar aceptable permitido en
    el parabrisas de un vehículo?
  choices:
    A: Teñido ligero en todo el parabrisas
    B: Material de protección solar a lo largo de una franja en la parte superior
      del parabrisas
    C: Parasoles removibles mientras conduce
    D: Teñido reflectante en la mitad inferior del parabrisas
  answer: B
  explanation: Es ilegal operar un vehículo motorizado con cualquier letrero, material
    de protección solar, producto o cubierta en el parabrisas. Solo son aceptables
    los certificados o documentos requeridos por la ley y el material de protección
    solar a lo largo de una franja en la parte superior del parabrisas.
- id: 81
  category: driver_testing
  question: ¿Qué documentos revisará primero el examinador durante la inspección del
    vehículo antes de la prueba de manejo?
  choices:
    A: El certificado de nacimiento y la tarjeta del Seguro Social del solicitante
    B: El registro del vehículo y los documentos del seguro
    C: El registro de conducción y el permiso del solicitante
    D: Los registros de mantenimiento del vehículo
  answer: B
  explanation: Para la inspección del vehículo, el examinador revisará primero el
    registro del vehículo y los documentos del seguro.
- id: 82
  category: driver_testing
  question: ¿Cómo se presentará la calificación de la prueba de manejo del solicitante
    en la hoja de resultados al finalizar el examen?
  choices:
    A: Como un porcentaje sobre 100
    B: Como una calificación con letra de la A a la F
    C: Indicando si aprobó o reprobó, sin una puntuación numérica
    D: Como una puntuación numérica sobre 50 puntos
  answer: C
  explanation: Al finalizar la prueba, se le entregará al solicitante una hoja de
    resultados que indicará si aprobó o reprobó. No habrá una puntuación numérica
    en la hoja de resultados.
- id: 83
  category: license_system
  question: ¿Cuál es la edad mínima requerida para transferir un permiso o licencia
    de conducir de otro estado a Kentucky?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 17 años de edad
    D: 18 años de edad
  answer: B
  explanation: Debe tener al menos 16 años de edad para transferir un permiso o licencia
    de conducir a Kentucky.
- id: 84
  category: license_system
  question: ¿Qué formulario debe presentar un solicitante menor de 18 años al transferir
    un permiso de otro estado a Kentucky?
  choices:
    A: Certificado de finalización de educación vial
    B: Formulario de verificación de cumplimiento escolar (School Compliance Verification
      Form)
    C: Formulario de consentimiento del padre/tutor
    D: Registro de conducción de otro estado
  answer: B
  explanation: Según el manual, si es menor de 18 años, debe presentar un Formulario
    de verificación de cumplimiento escolar firmado por la escuela de fuera del estado
    para cumplir con la ley No Pass/No Drive (Si no apruebas, no conduces).
- id: 85
  category: license_system
  question: ¿Qué debe llevar consigo un estudiante universitario de otro estado mientras
    conduce en Kentucky para evitar transferir su licencia?
  choices:
    A: Una carta de su asesor académico
    B: Un permiso de conducir temporal de Kentucky
    C: Una tarjeta de identificación de estudiante de su universidad, colegio o escuela
      técnica de Kentucky
    D: Su certificado de nacimiento
  answer: C
  explanation: Un estudiante universitario puede conducir con una licencia válida
    de otro estado si tiene consigo una tarjeta de identificación de estudiante de
    su universidad, colegio o escuela técnica de Kentucky al momento de conducir.
- id: 86
  category: license_system
  question: ¿Cuánto tiempo tiene un miembro militar que regresa para renovar una licencia
    de conducir de Kentucky vencida sin tener que realizar un examen escrito o de
    manejo?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Si un residente de Kentucky que sirve en las fuerzas armadas de los
    EE. UU. permite que su licencia expire, se le permite renovarla sin un examen
    escrito o de manejo dentro de los 90 días posteriores a su regreso al estado (Commonwealth).
- id: 87
  category: license_system
  question: ¿Cuándo vence una licencia de conducir de Kentucky si el conductor es
    menor de 21 años?
  choices:
    A: En su cumpleaños número 21
    B: 31 días después de su cumpleaños número 21
    C: 60 días después de su cumpleaños número 21
    D: 90 días después de su cumpleaños número 21
  answer: D
  explanation: Si el conductor es menor de 21 años, la licencia vence 90 días después
    de que el conductor cumpla 21 años.
- id: 88
  category: license_system
  question: Para los conductores de 21 años o más, ¿cuándo vence su licencia de conducir
    de Kentucky?
  choices:
    A: En su cumpleaños
    B: 10 días después de su cumpleaños
    C: 31 días después de su cumpleaños
    D: 90 días después de su cumpleaños
  answer: C
  explanation: Para los conductores de 21 años o más, la licencia vence 31 días después
    del cumpleaños del conductor.
- id: 89
  category: driver_testing
  question: ¿Qué se requiere si la credencial de un conductor ha estado vencida por
    más de 5 años?
  choices:
    A: Debe pagar un cargo por demora, pero no se requieren exámenes
    B: Debe realizar solo un examen de la vista
    C: Debe comenzar de nuevo como un conductor nuevo
    D: Debe completar un curso de conducción defensiva
  answer: C
  explanation: Cualquier conductor cuya credencial esté vencida por más de 5 años
    debe comenzar de nuevo como un conductor nuevo.
- id: 90
  category: driver_responsibility
  question: Si cambia su nombre o dirección, ¿dentro de cuántos días debe obtener
    un duplicado de la licencia de conducir?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: Si cambia su dirección o nombre por cualquier motivo, debe obtener
    un duplicado de la licencia dentro de los 10 días.
- id: 91
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como prueba de un cambio
    de nombre al actualizar su licencia de conducir?
  choices:
    A: Licencia de matrimonio
    B: Sentencia de divorcio
    C: Tarjeta de Seguro Social
    D: Orden judicial de cambio de nombre
  answer: C
  explanation: Una tarjeta de Seguro Social no es aceptable como prueba de cambio
    de nombre, aunque debe presentar una prueba de una nueva tarjeta de Seguro Social
    con su nuevo nombre para demostrar que la actualizó ante la SSA.
- id: 92
  category: penalties_and_points
  question: ¿Su licencia de conducir puede ser suspendida o revocada si recibe cuántas
    condenas por conducción temeraria en un periodo de 12 meses?
  choices:
    A: Una (1)
    B: Dos (2)
    C: Tres (3)
    D: Cuatro (4)
  answer: C
  explanation: Su licencia de conducir puede ser suspendida o revocada por conducción
    temeraria si tiene tres (3) condenas en un periodo de doce (12) meses.
- id: 93
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones puede resultar en la suspensión o
    revocación de su licencia de conducir de Kentucky?
  choices:
    A: Una sola multa de estacionamiento
    B: Robo de gasolina
    C: Conducir a 5 mph sobre el límite de velocidad en una carretera interestatal
    D: Tener un sistema de escape ruidoso
  answer: B
  explanation: El manual enumera el 'Robo de gasolina' como uno de los motivos por
    los cuales su licencia de conducir puede ser suspendida o revocada.
- id: 94
  category: driver_testing
  question: ¿Qué exámenes se requieren para un residente permanente que posee un Permiso
    Internacional de Conducir de un país con reciprocidad de licencia extranjera?
  choices:
    A: Solo un examen de la vista
    B: Examen de conocimientos por escrito y examen de la vista
    C: Examen de conocimientos por escrito, examen de la vista y examen práctico de
      manejo
    D: No se requiere ningún examen
  answer: B
  explanation: Un residente permanente que posea un Permiso Internacional de Conducir
    de un país con reciprocidad de licencia extranjera deberá aprobar con éxito el
    examen de conocimientos de conducción por escrito y el examen de la vista.
- id: 95
  category: license_system
  question: ¿Por cuántos años es válida una licencia de operador estándar de Kentucky?
  choices:
    A: 2 o 4 años
    B: 3 o 5 años
    C: 4 o 8 años
    D: 5 o 10 años
  answer: C
  explanation: Una licencia de operador de Kentucky es válida por cuatro (4) años
    u ocho (8) años.
- id: 96
  category: driver_responsibility
  question: ¿Cómo puede un conductor entregar voluntariamente su licencia de conducir
    de Kentucky?
  choices:
    A: Enviándola por correo al departamento de policía local
    B: Completando un formulario y entregándolo junto con la licencia a un empleado
      en una Oficina Regional de Licencias de Conducir del KYTC
    C: Cortándola por la mitad y tirándola a la basura
    D: Notificando al DMV en línea sin devolver la tarjeta física
  answer: B
  explanation: Según el manual, un conductor puede entregar voluntariamente su licencia
    completando el formulario correspondiente en cualquier Oficina Regional de Licencias
    de Conducir del KYTC y entregándolo junto con la licencia al empleado.
- id: 97
  category: penalties_and_points
  question: Si una persona no cumple con una sentencia dictada en su contra por daños
    resultantes de la operación de un vehículo motorizado en un plazo de 60 días,
    ¿cuál es la sanción?
  choices:
    A: Una multa de $500
    B: Asistencia obligatoria a la Escuela Estatal de Tráfico
    C: Su privilegio de conducir será suspendido indefinidamente o hasta que se cumpla
      la sentencia
    D: Se añadirán 12 puntos a su historial de conducción
  answer: C
  explanation: El manual establece que el incumplimiento de una sentencia por daños
    en un plazo de 60 días resultará en la suspensión del privilegio de conducir indefinidamente
    o hasta que la sentencia haya sido satisfecha.
- id: 98
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecen válidos los puntos asignados bajo el sistema
    de puntos de Kentucky antes de vencer?
  choices:
    A: Un año a partir de la fecha de la condena
    B: Dos años a partir de la fecha de la condena
    C: Cinco años a partir de la fecha de la condena
    D: Nunca vencen
  answer: B
  explanation: El manual establece que los puntos asignados bajo este sistema vencen
    a los dos (2) años de la fecha de la condena.
- id: 99
  category: penalties_and_points
  question: Aunque los puntos vencen después de dos años, ¿cuánto tiempo permanece
    el registro de la condena como parte del historial del conductor?
  choices:
    A: 2 años
    B: 3 años
    C: 5 años
    D: 7 años
  answer: C
  explanation: Según el manual, el registro de la condena permanece en el historial
    del conductor por un periodo de cinco (5) años a partir de la fecha de la condena.
- id: 100
  category: penalties_and_points
  question: ¿Cuál es la sanción por no comparecer a una audiencia después de acumular
    doce puntos por primera vez?
  choices:
    A: Una suspensión de la licencia por un periodo de seis meses
    B: Una suspensión de la licencia por un año
    C: Revocación inmediata del registro del vehículo
    D: Una multa de hasta $1,000
  answer: A
  explanation: No comparecer a la audiencia resulta en una suspensión de la licencia
    por un periodo de seis (6) meses por la primera acumulación de doce (12) puntos.
- id: 101
  category: driver_responsibility
  question: ¿Cuál de los siguientes conductores es elegible para asistir a la Escuela
    de Tráfico del Estado de Kentucky (Kentucky State Traffic School)?
  choices:
    A: Un conductor de otro estado
    B: Un conductor cuya licencia está suspendida actualmente
    C: Un conductor con una condena que conlleva una suspensión obligatoria de la
      licencia
    D: Un conductor con una infracción de tráfico menor que no ha asistido a la escuela
      en los últimos 12 meses
  answer: D
  explanation: Un conductor solo puede asistir con infracciones de tráfico menores
    y solo puede completar la Escuela de Tráfico del Estado una vez cada doce (12)
    meses. Los conductores suspendidos, sin licencia y de otros estados no son elegibles.
- id: 102
  category: penalties_and_points
  question: ¿Qué sucede si un tribunal remite a un conductor a la Escuela de Tráfico
    del Estado de Kentucky pero este no cumple con la orden de asistir?
  choices:
    A: El conductor será multado con $500
    B: Se suspenderán los privilegios de conducción del conductor
    C: El conductor recibirá 12 puntos en su historial
    D: Se requerirá que el conductor vuelva a tomar el examen de conocimientos escrito
  answer: B
  explanation: Una vez remitido a la Escuela de Tráfico del Estado de Kentucky, se
    convierte en una orden judicial. Si el conductor no cumple con la orden judicial
    de asistir a la escuela de tráfico, se suspenderán sus privilegios de conducción.
- id: 103
  category: alcohol_drugs_health
  question: 'Antes de que una persona condenada por un DUI (conducir bajo la influencia)
    pueda recuperar sus privilegios de conducción, debe hacer todo lo siguiente EXCEPTO:'
  choices:
    A: Completar un programa de educación o tratamiento de alcohol aprobado por el
      CHR
    B: Pagar todas las tarifas obligatorias de evaluación, educación o tratamiento
      de alcohol
    C: Esperar a que expire el período de suspensión de la licencia
    D: Volver a tomar el examen de habilidades de conducción
  answer: D
  explanation: Para que se vuelva a emitir una licencia después de un DUI, una persona
    necesita pagar la tarifa requerida, presentar un aviso de finalización de un programa
    de DUI aprobado y esperar a que expire el período de suspensión de la licencia.
    No se menciona como requisito volver a tomar el examen de habilidades de conducción.
- id: 104
  category: vehicle_information
  question: Si una persona compra un vehículo motorizado o trae uno a Kentucky desde
    otro estado, ¿dentro de cuántos días debe solicitar el registro?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: Una persona que compra un vehículo motorizado o trae un vehículo motorizado
    a Kentucky desde otro estado debe realizar la solicitud de registro dentro de
    los quince (15) días.
- id: 105
  category: vehicle_information
  question: ¿Cuál es el período de gracia para renovar el registro de su vehículo
    en Kentucky?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: No hay período de gracia
  answer: D
  explanation: 'El manual establece explícitamente: "No hay período de gracia para
    renovar el registro de su vehículo".'
- id: 106
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por no mantener el seguro de un vehículo
    registrado en Kentucky?
  choices:
    A: Una multa de $500.00 a $1,000.00 y hasta 90 días de cárcel
    B: Una multa de $100.00 y 3 puntos en la licencia de conducir
    C: Asistencia obligatoria a un programa de educación sobre DUI
    D: Una advertencia por la primera infracción
  answer: A
  explanation: No mantener el seguro es un delito penal. El propietario y el conductor
    del vehículo están sujetos a una multa de $500.00 a $1,000.00, hasta 90 días de
    cárcel, o ambos, y se revocará el registro del vehículo.
- id: 107
  category: vehicle_information
  question: ¿Cuál es la cobertura mínima de responsabilidad civil requerida para todos
    los daños a la propiedad como resultado de cualquier accidente en Kentucky?
  choices:
    A: $10,000.00
    B: $25,000.00
    C: $50,000.00
    D: $60,000.00
  answer: B
  explanation: Todos los propietarios de vehículos motorizados deben contar con una
    cobertura mínima de responsabilidad civil, que incluye $25,000.00 para todos los
    daños a la propiedad como resultado de cualquier accidente.
- id: 108
  category: vehicle_information
  question: ¿Cómo debe el propietario u operador de un vehículo motorizado mantener
    el comprobante de cobertura mínima de responsabilidad civil en el vehículo?
  choices:
    A: Solo como un documento en papel ante notario
    B: Como una tarjeta de seguro en papel o en un dispositivo electrónico portátil
    C: Manteniendo el contrato original de la póliza de seguro en la guantera
    D: No se requiere mantener el comprobante de seguro en el vehículo
  answer: B
  explanation: El comprobante por escrito, en forma de tarjeta de seguro, puede ser
    una tarjeta de seguro en papel o un dispositivo electrónico portátil para descargar
    la tarjeta de seguro.
- id: 109
  category: vehicle_information
  question: ¿Cómo pueden los estudiantes universitarios de otros estados conducir
    legalmente en Kentucky usando el registro y el seguro de su estado de origen?
  choices:
    A: Registrando su vehículo en Kentucky dentro de los 15 días
    B: Manteniendo una tarjeta de identificación de estudiante vigente de un colegio,
      universidad o escuela técnica de Kentucky
    C: Pagando una tarifa especial para estudiantes de fuera del estado al secretario
      del condado
    D: A los estudiantes de otros estados no se les permite conducir en Kentucky
  answer: B
  explanation: Los estudiantes pueden usar el registro y el seguro de su estado de
    origen para conducir en Kentucky si mantienen una tarjeta de identificación de
    estudiante vigente de un colegio, universidad o escuela técnica de Kentucky.
- id: 110
  category: alcohol_drugs_health
  question: ¿Cuánto tiempo debe un solicitante de licencia estar libre de convulsiones
    o desmayos para obtener o mantener los privilegios de conducción en Kentucky?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Según el manual, un solicitante de licencia o titular de la misma debe
    estar libre de convulsiones, desmayos, pérdida del conocimiento o un estado alterado
    de conciencia durante 90 días para obtener o mantener los privilegios de conducción.
- id: 111
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida en al menos un ojo para conducir
    en Kentucky?
  choices:
    A: 20/20
    B: 20/40
    C: 20/60
    D: 20/80
  answer: C
  explanation: En Kentucky, los requisitos visuales para conducir exigen que una persona
    tenga una agudeza visual de al menos 20/60 o mejor en al menos un ojo.
- id: 112
  category: driver_testing
  question: Según los requisitos de visión estándar de Kentucky, ¿cuál debe ser el
    campo de visión horizontal de un conductor?
  choices:
    A: Al menos 25 grados tanto a la izquierda como a la derecha
    B: Al menos 35 grados tanto a la izquierda como a la derecha
    C: Al menos 50 grados tanto a la izquierda como a la derecha
    D: Al menos 120 grados horizontalmente
  answer: B
  explanation: El manual establece que el campo de visión horizontal del conductor
    debe ser de al menos 35 grados tanto a la izquierda como a la derecha.
- id: 113
  category: license_system
  question: ¿Qué agencia administra el Programa de Conducción Bióptica de Kentucky?
  choices:
    A: Policía Estatal de Kentucky
    B: Junta de Revisión Médica
    C: Oficina de Rehabilitación Vocacional de Kentucky
    D: División de Licencias de Conducir
  answer: C
  explanation: El manual especifica que el Programa de Conducción Bióptica de Kentucky
    es administrado por la Oficina de Rehabilitación Vocacional de Kentucky.
- id: 114
  category: driver_responsibility
  question: ¿Cuántos ciudadanos deben nombrar a un conductor en una declaración jurada
    ante la Junta de Revisión Médica para reportarlo como incapaz de operar un vehículo
    motorizado de manera segura?
  choices:
    A: Al menos uno
    B: Al menos dos
    C: Al menos tres
    D: Al menos cinco
  answer: B
  explanation: Los conductores pueden ser reportados a la Junta de Revisión Médica
    si han sido nombrados en una declaración jurada por al menos dos ciudadanos como
    incapaces de operar adecuadamente un vehículo motorizado debido a un impedimento
    físico o mental.
- id: 115
  category: vehicle_information
  question: ¿A qué tipo de contaminación, que causa enfermedades pulmonares y cardíacas
    crónicas, contribuyen principalmente los vehículos motorizados?
  choices:
    A: Ozono a nivel del suelo
    B: Lluvia ácida
    C: Contaminación por plomo
    D: Ozono estratosférico
  answer: A
  explanation: El manual establece que los vehículos motorizados son los principales
    contribuyentes al ozono a nivel del suelo, lo que contribuye a problemas de salud
    como enfermedades pulmonares y cardíacas crónicas, alergias y asma.
- id: 116
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un hábito de conducción recomendado para ayudar
    a reducir las emisiones del vehículo y mejorar el ahorro de combustible?
  choices:
    A: Acelerar rápidamente desde las paradas
    B: Conducir durante las horas pico
    C: Adaptar el ritmo de conducción al tráfico y a la sincronización de los semáforos
    D: Frenar bruscamente al acercarse a las intersecciones
  answer: C
  explanation: Para reducir las emisiones y mejorar el ahorro de combustible, el manual
    aconseja a los conductores adaptar su ritmo de conducción al tráfico y a la sincronización
    de los semáforos para mantener el frenado y la aceleración al mínimo.
- id: 117
  category: license_system
  question: ¿Cuándo pueden los conductores con licencia en Kentucky inscribirse para
    ser donantes de órganos?
  choices:
    A: Solo cuando cumplen 18 años
    B: Solo al recibir una citación de tráfico
    C: Cuando se emite o renueva su licencia de conducir inicial
    D: Cuando registran un vehículo nuevo
  answer: C
  explanation: En Kentucky, los conductores con licencia pueden inscribirse como donantes
    de órganos cuando se emite su licencia de conducir inicial o cuando se renueva
    la licencia.
- id: 118
  category: safe_driving_rules
  question: ¿Qué tipo de lentes correctivos debe evitar usar al conducir de noche?
  choices:
    A: Lentes bifocales
    B: Lentes oscuros o teñidos
    C: Lentes antirreflectantes
    D: Lentes de contacto
  answer: B
  explanation: El manual establece explícitamente que se debe evitar el uso de lentes
    correctivos oscuros o teñidos por la noche.
- id: 119
  category: defensive_driving
  question: ¿Cómo pueden adaptarse para conducir de manera segura los conductores
    que saben que son sordos o tienen problemas de audición?
  choices:
    A: Conduciendo solo durante las horas del día
    B: Dependiendo más de sus capacidades visuales
    C: Manteniendo las ventanillas bajadas
    D: Conduciendo a velocidades más lentas
  answer: B
  explanation: Los conductores que saben que son sordos o tienen problemas de audición
    pueden adaptarse dependiendo más de sus capacidades visuales, según el manual.
- id: 120
  category: alcohol_drugs_health
  question: Según el manual, ¿cuántas horas de sueño necesitan la mayoría de las personas
    para mantener un estado de alerta adecuado durante el día?
  choices:
    A: De 5 a 6 horas
    B: De 6 a 8 horas
    C: De 7 a 9 horas
    D: De 8 a 10 horas
  answer: C
  explanation: Para mantener un estado de alerta adecuado durante el día, el manual
    establece que la mayoría de las personas necesitan de 7 a 9 horas de sueño.
- id: 121
  category: safe_driving_rules
  question: ¿Con qué frecuencia debe planear detenerse y descansar durante un viaje
    largo para evitar la fatiga?
  choices:
    A: Cada 50 millas o 1 hora
    B: Cada 100 millas o 2 horas
    C: Cada 200 millas o 4 horas
    D: Solo cuando necesite cargar combustible
  answer: B
  explanation: Antes de un viaje, debe planear detenerse aproximadamente cada 100
    millas o 2 horas durante los viajes largos para evitar la fatiga.
- id: 122
  category: defensive_driving
  question: Si comienza a sentirse cansado mientras conduce, ¿cuál es una estrategia
    recomendada para combatir la fatiga?
  choices:
    A: Subir el volumen del radio
    B: Bajar las ventanillas para que entre aire fresco
    C: Salir en la próxima salida y tomar una siesta de 15 a 20 minutos
    D: Conducir más rápido para llegar antes a su destino
  answer: C
  explanation: Si comienza a sentirse cansado, el manual recomienda dejar de conducir
    y salir en la próxima salida o área de descanso para tomar una siesta de 15 a
    20 minutos.
- id: 123
  category: license_system
  question: La Junta de Revisión Médica (Medical Review Board), que identifica a los
    conductores con impedimentos físicos o mentales, ¿está compuesta por cuáles de
    los siguientes profesionales?
  choices:
    A: Oftalmólogos, neurólogos, psiquiatras y especialistas en rehabilitación
    B: Oficiales de policía, jueces y abogados
    C: Agentes de seguros e instructores de manejo
    D: Paramédicos y enfermeros de la sala de emergencias
  answer: A
  explanation: La Junta de Revisión Médica está compuesta por oftalmólogos, neurólogos,
    psiquiatras y especialistas en rehabilitación.
- id: 124
  category: driver_responsibility
  question: Si recibe una carta de notificación de falta de seguro, ¿cómo puede resolver
    el problema si se encuentra en servicio militar activo?
  choices:
    A: Ignorar la carta hasta que regrese de su despliegue
    B: Mostrar prueba de servicio militar activo en la oficina del Secretario del
      Condado (County Clerk)
    C: Presentar una declaración jurada ante la Junta de Revisión Médica
    D: Pagar una multa a la Policía Estatal de Kentucky
  answer: B
  explanation: Si recibe una carta de notificación de falta de seguro, puede mostrar
    prueba de su servicio militar activo (talón de pago, identificación) en la oficina
    del Secretario del Condado (County Clerk) para resolver el problema.
- id: 125
  category: driver_responsibility
  question: Según la NHTSA, ¿qué tipo de distracción implica la carga de trabajo mental
    de pensar en algo que no sea la tarea de conducir?
  choices:
    A: Distracción visual
    B: Distracción manual
    C: Distracción cognitiva
    D: Distracción emocional
  answer: C
  explanation: El manual define la distracción cognitiva como las tareas que se definen
    como la carga de trabajo mental asociada con una tarea que implica pensar en algo
    que no sea la tarea de conducir.
- id: 126
  category: safe_driving_rules
  question: Enviar o recibir un mensaje de texto aparta la vista del conductor de
    la carretera por un promedio de ¿cuántos segundos?
  choices:
    A: 2.5 segundos
    B: 3.2 segundos
    C: 4.6 segundos
    D: 5.8 segundos
  answer: C
  explanation: Según el manual, enviar o recibir un mensaje de texto aparta la vista
    del conductor de la carretera por un promedio de 4.6 segundos.
- id: 127
  category: defensive_driving
  question: Realizar subtareas visuales-manuales, como alcanzar un teléfono o marcar,
    ¿cuánto aumenta el riesgo de sufrir un choque?
  choices:
    A: Dos veces
    B: Tres veces
    C: Cuatro veces
    D: Cinco veces
  answer: B
  explanation: El manual establece que realizar subtareas visuales-manuales asociadas
    con el uso de teléfonos portátiles y otros dispositivos portátiles aumenta tres
    veces el riesgo de sufrir un choque.
- id: 128
  category: driver_responsibility
  question: Si está enojado o preocupado antes de conducir, ¿cuál es el curso de acción
    recomendado?
  choices:
    A: Conducir un poco más rápido para llegar antes a su destino.
    B: Encender el radio para distraerse.
    C: Darse tiempo para calmarse o dar un paseo corto.
    D: Desahogar sus sentimientos tocando la bocina a otros conductores.
  answer: C
  explanation: El manual aconseja que si está enojado o preocupado, debe darse tiempo
    para calmarse y, si es necesario, dar un paseo corto o tomar una siesta, manteniéndose
    fuera de la carretera hasta que los síntomas hayan pasado.
- id: 129
  category: safe_driving_rules
  question: ¿Cómo define el manual la "furia al volante" (road rage)?
  choices:
    A: Cambiar de carril abruptamente sin señalizar.
    B: Ira incontrolada que resulta en violencia o amenaza de violencia en la carretera.
    C: Seguir a otro vehículo demasiado de cerca en la autopista.
    D: Cometer intencionalmente una infracción de tráfico como el exceso de velocidad.
  answer: B
  explanation: La furia al volante se define en el manual como una ira incontrolada
    que resulta en violencia o amenaza de violencia en la carretera, lo cual es un
    comportamiento criminal.
- id: 130
  category: defensive_driving
  question: ¿Cuál de los siguientes comportamientos se considera conducción agresiva
    en lugar de furia al volante?
  choices:
    A: Amenazar a otro conductor con violencia.
    B: Seguir de cerca intencionalmente (tailgating) y cambiar de carril abruptamente.
    C: Salirse de la carretera para llamar a la policía.
    D: Perderse en una ruta familiar.
  answer: B
  explanation: La conducción agresiva ocurre cuando un individuo comete intencionalmente
    una acción que pone en peligro a otras personas o propiedades, e incluye comportamientos
    como seguir de cerca (tailgating), cambiar de carril abruptamente y el exceso
    de velocidad.
- id: 131
  category: defensive_driving
  question: Si se ve involucrado en un incidente de furia al volante con un conductor
    enfurecido, ¿qué debe hacer?
  choices:
    A: Tomar represalias para demostrar que no se siente intimidado.
    B: Entablar una discusión para defenderse.
    C: Salirse de la calzada de manera segura en un área pública bien iluminada y
      llamar a la policía para pedir ayuda.
    D: Acelerar e intentar rebasar al otro conductor.
  answer: C
  explanation: El manual aconseja que si se ve involucrado en un incidente de furia
    al volante, no debe tomar represalias ni discutir. En su lugar, salga de la calzada
    de manera segura en un área pública bien iluminada y llame a la policía para pedir
    ayuda.
- id: 132
  category: driver_responsibility
  question: ¿Cuál de los siguientes se menciona como una señal de advertencia de que
    un conductor de edad avanzada podría necesitar una evaluación de conducción?
  choices:
    A: Cambiar a un vehículo con más funciones de seguridad.
    B: Perderse mientras conduce por rutas que antes le eran familiares.
    C: Conducir exclusivamente durante las horas del día.
    D: Renovar la licencia de conducir en línea.
  answer: B
  explanation: Una de las señales de advertencia de que un conductor de edad avanzada
    puede necesitar una evaluación es si a veces se pierde mientras conduce por rutas
    que antes le eran familiares.
- id: 133
  category: alcohol_drugs_health
  question: ¿En qué porcentaje aproximado de todos los accidentes de tráfico en los
    que alguien muere cada año están involucrados el alcohol y otras drogas que alteran
    las facultades?
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: El manual establece que el alcohol y otras drogas que alteran las facultades
    están involucrados en aproximadamente el 40% de todos los accidentes de tráfico
    en los que alguien muere cada año.
- id: 134
  category: alcohol_drugs_health
  question: ¿Qué significan las leyes de 'tolerancia cero' para los conductores menores
    de 21 años?
  choices:
    A: Se les permite un BAC máximo de 0.08.
    B: No pueden tener nada de alcohol en su sistema circulatorio mientras conducen.
    C: Perderán su licencia si reciben una sola multa por exceso de velocidad.
    D: Deben conducir con un adulto si han consumido algo de alcohol.
  answer: B
  explanation: Todos los estados tienen leyes de 'tolerancia cero' para conductores
    menores de 21 años, lo que significa que no debe haber alcohol en el sistema circulatorio.
- id: 135
  category: alcohol_drugs_health
  question: ¿Con qué nivel de contenido de alcohol en la sangre (BAC) se ve afectada
    por primera vez la visión de un conductor?
  choices:
    A: '0.02'
    B: '0.04'
    C: '0.06'
    D: '0.08'
  answer: A
  explanation: Según el manual, la visión se ve afectada con un contenido de alcohol
    en la sangre (BAC) de 0.02 para todos los conductores.
- id: 136
  category: alcohol_drugs_health
  question: ¿Cuándo comienza el deterioro por alcohol a afectar la capacidad de una
    persona para conducir?
  choices:
    A: Después del segundo trago.
    B: Cuando el BAC del conductor alcanza 0.08.
    C: Con el primer trago.
    D: Solo si el conductor se siente intoxicado.
  answer: C
  explanation: El manual establece explícitamente que el deterioro comienza con el
    primer trago, e incluso una sola bebida alcohólica puede afectar la capacidad
    de una persona para conducir.
- id: 137
  category: alcohol_drugs_health
  question: ¿Cómo pueden afectar su conducción los medicamentos de venta libre que
    se toman para resfriados o alergias?
  choices:
    A: Mejoran su tiempo de reacción.
    B: Pueden causarle somnolencia y afectar su conducción.
    C: Agudizan su visión y la distinción de colores.
    D: No tienen ningún efecto en la capacidad de conducción a menos que se mezclen
      con medicamentos recetados.
  answer: B
  explanation: Los medicamentos de venta libre que se toman para dolores de cabeza,
    resfriados, fiebre del heno u otras alergias pueden causarle somnolencia y afectar
    su conducción.
- id: 138
  category: safe_driving_rules
  question: 'Apartar la vista de la carretera durante 4.6 segundos para enviar un
    mensaje de texto a 55 mph equivale a conducir la longitud de:'
  choices:
    A: Una cancha de baloncesto.
    B: Un campo de fútbol americano completo.
    C: Una cuadra estándar de la ciudad.
    D: Una milla.
  answer: B
  explanation: Enviar o recibir un mensaje de texto aparta la vista del conductor
    de la carretera durante un promedio de 4.6 segundos; a 55 mph, esto equivale a
    conducir la longitud de un campo de fútbol americano completo.
- id: 139
  category: driver_responsibility
  question: ¿Qué sugiere el manual hacer para obtener los beneficios tanto de la cafeína
    como de una siesta corta para combatir la fatiga?
  choices:
    A: Consumir cafeína inmediatamente después de despertarse de una siesta.
    B: Intentar consumir cafeína antes de tomar una siesta corta.
    C: Evitar la cafeína por completo si planea tomar una siesta.
    D: Beber cafeína solo si la siesta dura más de una hora.
  answer: B
  explanation: El manual sugiere 'intentar consumir cafeína antes de tomar una siesta
    corta para obtener los beneficios de ambas' cuando se trata de combatir la fatiga.
- id: 140
  category: penalties_and_points
  question: ¿Cuál es la pena de cárcel por una primera condena por una infracción
    de drogas ilegales mientras conduce dentro de un período de 10 años?
  choices:
    A: 24 a 48 horas
    B: 48 horas a 30 días
    C: 30 a 60 días
    D: 60 a 120 días
  answer: B
  explanation: Por una primera condena de una infracción por drogas mientras conduce
    dentro de un período de 10 años, será encarcelado en la cárcel del condado por
    no menos de 48 horas ni más de 30 días.
- id: 141
  category: alcohol_drugs_health
  question: Según la ley de consentimiento implícito de Kentucky, ¿la ley de qué estado
    se aplica si usted es arrestado por sospecha de conducir bajo los efectos del
    alcohol o drogas?
  choices:
    A: El estado donde obtuvo su licencia
    B: El estado donde su vehículo está registrado
    C: El estado donde es arrestado
    D: Su estado de residencia permanente
  answer: C
  explanation: El manual establece que aunque las leyes de consentimiento implícito
    varían según el estado, la ley se aplica al estado donde usted es arrestado, no
    al estado donde obtuvo su licencia.
- id: 142
  category: penalties_and_points
  question: Si se niega a someterse a una prueba solicitada de aliento, sangre u orina,
    y es su segunda infracción por DUI (conducir bajo la influencia) en un plazo de
    10 años, ¿cuál es la consecuencia?
  choices:
    A: Su vehículo será confiscado permanentemente
    B: Se le multará con un mínimo de $1,000
    C: Su sentencia mínima obligatoria de cárcel será el doble de larga
    D: Perderá permanentemente su licencia de conducir
  answer: C
  explanation: Para una segunda o posterior infracción dentro de un período de 10
    años, la negativa a una prueba de aliento u orina es una circunstancia agravante,
    lo que lo sujeta a una sentencia mínima obligatoria de cárcel el doble de larga
    que si se hubiera sometido a las pruebas.
- id: 143
  category: alcohol_drugs_health
  question: Antes de realizar una prueba solicitada de sangre, aliento u orina, ¿de
    cuánto tiempo dispone para intentar contactar a un abogado?
  choices:
    A: De 5 a 10 minutos
    B: De 10 a 15 minutos
    C: De 15 a 20 minutos
    D: 30 minutos
  answer: B
  explanation: Durante el período inmediatamente anterior a la administración de cualquier
    prueba, se le dará una oportunidad de al menos 10 minutos pero no más de 15 minutos
    para intentar contactar y comunicarse con un abogado.
- id: 144
  category: penalties_and_points
  question: ¿Cuál de las siguientes se considera una 'circunstancia agravante' que
    requiere tiempo de cárcel obligatorio?
  choices:
    A: Operar un vehículo motorizado a 15 mph por encima del límite de velocidad establecido
    B: Transportar a un pasajero menor de 12 años
    C: Tener un BAC (concentración de alcohol en sangre) de .08 dentro de las dos
      horas posteriores a la conducción
    D: Conducir con una placa de matrícula vencida
  answer: B
  explanation: Operar un vehículo motorizado mientras se transporta a un pasajero
    menor de 12 años figura como una circunstancia agravante que requiere tiempo de
    cárcel obligatorio.
- id: 145
  category: penalties_and_points
  question: ¿Qué sucede con las placas de matrícula de los conductores condenados
    por conducir bajo la influencia (DUI) durante el período de suspensión de su licencia?
  choices:
    A: Se marcan con una calcomanía especial de DUI
    B: Se suspenden por exactamente un año
    C: Deben reemplazarse por una placa de un color diferente
    D: Se entregan a los tribunales a menos que se emita una licencia con dispositivo
      de interbloqueo o una licencia por dificultades económicas
  answer: D
  explanation: Los conductores condenados por DUI entregarán sus placas de matrícula
    a los tribunales durante el período de suspensión, a menos que se les emita una
    licencia con dispositivo de interbloqueo de encendido o una licencia por dificultades
    económicas (hardship license).
- id: 146
  category: vehicle_information
  question: ¿Dónde puede encontrar el 'PSI' (presión de los neumáticos) recomendado
    para los neumáticos de su vehículo?
  choices:
    A: En el flanco (pared lateral) del neumático
    B: En la guantera del vehículo
    C: En una calcomanía ubicada en el marco interior de la puerta del automóvil
    D: En el bloque del motor
  answer: C
  explanation: Para encontrar el PSI, debe abrir la puerta de su automóvil; en el
    marco interior, debería ver una calcomanía con el número que dice 'PSI'.
- id: 147
  category: vehicle_information
  question: Al usar una moneda de un centavo para verificar la profundidad de la banda
    de rodadura de sus neumáticos, ¿qué indica que sus neumáticos están demasiado
    desgastados y deben reemplazarse?
  choices:
    A: No puede ver nada de la cabeza de Lincoln
    B: Puede ver toda la cabeza de Lincoln
    C: La moneda se sale de la ranura
    D: La banda de rodadura cubre la nariz de Lincoln
  answer: B
  explanation: Al colocar la cabeza de Lincoln primero en la ranura más profunda,
    si puede ver toda su cabeza, sus neumáticos están demasiado desgastados y deben
    ser reemplazados.
- id: 148
  category: safe_driving_rules
  question: ¿Cómo debe ajustarse su asiento en relación con el volante para permitir
    el espacio adecuado para el despliegue de la bolsa de aire (airbag)?
  choices:
    A: Debe haber 10 pulgadas entre su pecho y el volante
    B: Su pecho debe estar apoyado contra el volante
    C: Debe haber al menos 20 pulgadas entre su pecho y el volante
    D: El volante debe estar por encima del nivel de su barbilla
  answer: A
  explanation: El manual establece que debe haber 10 pulgadas entre su pecho y el
    volante.
- id: 149
  category: safe_driving_rules
  question: ¿Cómo deben ajustarse los reposacabezas para evitar el latigazo cervical?
  choices:
    A: Deben estar en contacto con la parte posterior de su cuello, debajo de las
      orejas
    B: Deben estar en contacto con la parte posterior de su cabeza y no por debajo
      del nivel de sus orejas
    C: Deben colocarse 3 pulgadas por encima de la parte superior de su cabeza
    D: Deben retirarse si obstruyen su visión trasera
  answer: B
  explanation: Los reposacabezas deben ajustarse de modo que estén en contacto con
    la parte posterior de su cabeza y no por debajo del nivel de sus orejas.
- id: 150
  category: alcohol_drugs_health
  question: Si se somete a una prueba de sangre, aliento u orina solicitada legalmente,
    ¿qué derecho tiene con respecto a pruebas adicionales?
  choices:
    A: Puede exigir que la policía pague por una segunda prueba
    B: Tiene derecho a que una persona de su elección le realice una prueba a su cargo
    C: Puede negarse a que los resultados se utilicen en el tribunal
    D: Puede solicitar que la prueba se retrase por 24 horas
  answer: B
  explanation: Si se somete a la prueba o pruebas, tiene derecho a que una persona
    de su elección le realice una prueba de sangre dentro de un tiempo razonable después
    de su arresto y a su cargo.
- id: 151
  category: safe_driving_rules
  question: ¿Cuál es la altura adecuada al ajustar el volante?
  choices:
    A: La parte superior del volante debe estar más alta que su barbilla
    B: La parte superior del volante no debe estar más alta que la parte superior
      de sus hombros y debe quedar por debajo del nivel de la barbilla
    C: La parte inferior del volante debe tocar sus muslos
    D: El volante debe estar inclinado lo más arriba posible
  answer: B
  explanation: La parte superior del volante no debe estar más alta que la parte superior
    de sus hombros y debe quedar por debajo del nivel de la barbilla.
- id: 152
  category: penalties_and_points
  question: ¿Cuál es la sanción de suspensión de la licencia por una primera condena
    por infracción de alcohol en un período de 10 años para un conductor mayor de
    18 años?
  choices:
    A: 30 a 120 días
    B: 4 a 6 meses
    C: 1 a 2 años
    D: 6 a 12 meses
  answer: B
  explanation: Por una primera condena por una infracción de alcohol en un período
    de 10 años, su licencia será suspendida por un período de 4 a 6 meses.
- id: 153
  category: penalties_and_points
  question: ¿A partir de qué nivel de concentración de alcohol en el aliento un dispositivo
    de bloqueo de encendido (ignition interlock device) impide que un conductor opere
    un vehículo?
  choices:
    A: '0.00'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: El dispositivo de bloqueo de encendido impide que un conductor opere
    ese vehículo si su concentración de alcohol en el aliento supera el .02.
- id: 154
  category: vehicle_information
  question: Según el manual, ¿cómo debe posicionarse un conductor para ajustar correctamente
    el espejo lateral izquierdo?
  choices:
    A: Inclinarse hacia la derecha para que su cabeza quede directamente debajo del
      espejo retrovisor.
    B: Apoyar la cabeza contra la ventana cerrada.
    C: Sentarse perfectamente derecho y mirar por encima del hombro izquierdo.
    D: Ajustar el asiento lo más atrás posible.
  answer: B
  explanation: Para ajustar el espejo lateral izquierdo, el conductor debe apoyar
    la cabeza contra la ventana cerrada y ajustar el espejo de modo que apenas se
    vea el borde trasero del vehículo.
- id: 155
  category: vehicle_information
  question: ¿Cuánto margen de visión adicional a cada lado del vehículo añade el ajuste
    correcto de los espejos exteriores utilizando el método recomendado?
  choices:
    A: 5 a 10 grados
    B: 12 a 16 grados
    C: 20 a 25 grados
    D: 30 a 45 grados
  answer: B
  explanation: El método de ajuste recomendado añade entre 12 y 16 grados de área
    de visión adicional a cada lado del vehículo.
- id: 156
  category: safe_driving_rules
  question: ¿Cuál es la norma de Kentucky con respecto a colgar objetos del espejo
    retrovisor?
  choices:
    A: Está permitido siempre que el objeto sea menor de 3 pulgadas.
    B: Se recomienda colgar ambientadores para mantener el auto con un olor limpio.
    C: Es ilegal porque bloquea su visión.
    D: Está permitido solo durante las horas del día.
  answer: C
  explanation: 'El manual establece: "No cuelgue nada de su espejo retrovisor... Son
    ilegales y bloquean su visión".'
- id: 157
  category: safe_driving_rules
  question: La ley de Kentucky exige que el conductor y todos los pasajeros usen un
    cinturón de seguridad debidamente ajustado y abrochado si el vehículo motorizado
    fue fabricado después de ¿qué año?
  choices:
    A: '1968'
    B: '1975'
    C: '1981'
    D: '1990'
  answer: C
  explanation: La ley de Kentucky establece que una persona no debe operar un vehículo
    motorizado fabricado después de 1981 a menos que el conductor y todos los pasajeros
    usen un cinturón de seguridad debidamente ajustado y abrochado.
- id: 158
  category: defensive_driving
  question: Según el manual, ¿cuántas veces más son sus probabilidades de sobrevivir
    a un choque si permanece dentro de la protección de su vehículo?
  choices:
    A: Dos veces más
    B: Tres veces más
    C: Cinco veces más
    D: Diez veces más
  answer: C
  explanation: Sus probabilidades de sobrevivir a un choque son cinco veces mayores
    si permanece dentro de la protección de su vehículo.
- id: 159
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de cinturones de seguridad de Kentucky?
  choices:
    A: Es una ley secundaria, lo que significa que solo puede ser citado si lo detienen
      por otra infracción.
    B: Es una ley primaria, lo que significa que las autoridades pueden detenerlo
      únicamente por no usar el cinturón de seguridad.
    C: Solo se aplica al conductor y a los pasajeros del asiento delantero.
    D: No se aplica si el vehículo está equipado con bolsas de aire (airbags).
  answer: B
  explanation: La ley de cinturones de seguridad es primaria en Kentucky y los conductores
    pueden ser detenidos por los oficiales de la ley si se observa que conducen sin
    usar los cinturones de seguridad.
- id: 160
  category: vehicle_information
  question: ¿Cómo debe ajustarse correctamente un cinturón de regazo?
  choices:
    A: Holgado a través del estómago
    B: Ajustado y bajo a través de sus caderas
    C: Alto a través de la cintura
    D: Debajo del brazo y a través del pecho
  answer: B
  explanation: El cinturón de regazo debe ajustarse de modo que quede ceñido y se
    sitúe bajo a través de sus caderas después de abrocharlo.
- id: 161
  category: vehicle_information
  question: ¿Aproximadamente cuánto tiempo tarda todo el proceso de despliegue de
    la bolsa de aire (airbag)?
  choices:
    A: 1/2 de segundo
    B: 1/10 de segundo
    C: 1/20 de segundo
    D: 1 segundo
  answer: C
  explanation: Todo el proceso de despliegue de la bolsa de aire tarda aproximadamente
    1/20 de segundo, más rápido que un parpadeo.
- id: 162
  category: vehicle_information
  question: Si su bolsa de aire se despliega y llena el compartimento del vehículo
    con una sustancia similar al polvo, ¿qué es esta sustancia?
  choices:
    A: Humo de un incendio menor
    B: Un agente secante para la bolsa de aire
    C: Productos químicos tóxicos del motor
    D: Polvo del tablero
  answer: B
  explanation: En caso de que su bolsa de aire se despliegue, es común que una sustancia
    similar al polvo llene el compartimento del vehículo. Esta sustancia es solo un
    agente secante para la bolsa de aire, pero podría confundirse con humo.
- id: 163
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los asientos de seguridad para niños
    orientados hacia atrás y las bolsas de aire?
  choices:
    A: Deben colocarse en el asiento delantero con la bolsa de aire activada.
    B: Pueden colocarse en el asiento delantero si el asiento se mueve completamente
      hacia atrás.
    C: Nunca deben colocarse frente a una bolsa de aire del pasajero activa.
    D: Solo son seguros en el asiento delantero si el niño mide más de 40 pulgadas
      de alto.
  answer: C
  explanation: Nunca coloque un asiento de seguridad para niños orientado hacia atrás
    frente a una bolsa de aire del pasajero activa.
- id: 164
  category: safe_driving_rules
  question: 'La ley de Kentucky exige que un niño esté debidamente asegurado en un
    sistema de retención infantil si:'
  choices:
    A: Mide 40 pulgadas de altura o menos
    B: Mide 50 pulgadas de altura o menos
    C: Tiene menos de 5 años de edad independientemente de su altura
    D: Pesa menos de 40 libras
  answer: A
  explanation: La ley de Kentucky exige que cualquier conductor que transporte a un
    niño de cuarenta (40) pulgadas de altura o menos debe tener al niño debidamente
    asegurado en un sistema de retención infantil.
- id: 165
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar la Ley de Retención Infantil de Kentucky?
  choices:
    A: Una multa de $25
    B: Una multa de $50 más una tarifa de $10 para el Fondo Fiduciario de Lesiones
      Cerebrales Traumáticas
    C: Una multa de $100 y 2 puntos en su licencia
    D: Una multa de $500 y tiempo de cárcel obligatorio
  answer: B
  explanation: Cualquier persona que viole las disposiciones de la Ley de Retención
    Infantil de Kentucky será multada con cincuenta dólares ($50) y pagará una tarifa
    adicional de diez dólares ($10) que se depositará en el Fondo Fiduciario de Lesiones
    Cerebrales Traumáticas.
- id: 166
  category: safe_driving_rules
  question: Según la ley de Kentucky, un niño debe estar asegurado en un asiento elevador
    (booster seat) si tiene menos de ocho (8) años de edad y mide ¿qué altura?
  choices:
    A: Entre 30 y 40 pulgadas
    B: Entre 40 y 57 pulgadas
    C: Más de 57 pulgadas
    D: Entre 50 y 65 pulgadas
  answer: B
  explanation: Un conductor que transporte a un niño menor de ocho (8) años que mida
    entre cuarenta (40) pulgadas y cincuenta y siete (57) pulgadas de altura debe
    tener al niño debidamente asegurado en un asiento elevador (booster seat).
- id: 167
  category: driver_responsibility
  question: En Kentucky, es ilegal dejar a un niño desatendido en un vehículo motorizado
    bajo circunstancias que manifiesten una indiferencia extrema por la vida humana
    si el niño es menor de ¿qué edad?
  choices:
    A: 6 años
    B: 8 años
    C: 10 años
    D: 12 años
  answer: B
  explanation: En Kentucky, es ilegal dejar a un niño menor de ocho (8) años en un
    vehículo motorizado bajo circunstancias que manifiesten una indiferencia extrema
    por la vida humana.
- id: 168
  category: driver_responsibility
  question: ¿Cuándo se considera que la carga en su vehículo o remolque está segura?
  choices:
    A: Cuando está amarrada con al menos una cuerda.
    B: Cuando pesa más de 100 libras.
    C: Cuando nada puede deslizarse, desplazarse, caerse o filtrarse hacia la calzada
      ni salir volando.
    D: Cuando conduce a menos de 45 millas por hora.
  answer: C
  explanation: Una carga debe estar bien sujeta y solo se considera segura cuando
    nada puede deslizarse, desplazarse, caerse o filtrarse hacia la calzada ni salir
    volando.
- id: 169
  category: driver_testing
  question: ¿Cuál de las siguientes funciones de seguridad de los Sistemas Avanzados
    de Asistencia al Conductor (ADAS) NO se le permite usar durante su examen de conducir?
  choices:
    A: Cámaras de reversa y advertencias de punto ciego.
    B: Advertencia de colisión frontal y asistencia de mantenimiento de carril.
    C: Asistente de estacionamiento y control de crucero.
    D: Frenado de emergencia automático.
  answer: C
  explanation: El manual establece que al realizar su examen de conducir, no se le
    permitirá usar ciertas funciones de seguridad, como el asistente de estacionamiento
    y el control de crucero.
- id: 170
  category: vehicle_information
  question: ¿En cuál de las siguientes condiciones podrían NO funcionar correctamente
    las funciones de seguridad de su vehículo (ADAS)?
  choices:
    A: En carreteras llanas y secas.
    B: En lluvia, nieve, hielo, niebla, colinas y curvas.
    C: Durante las horas del día.
    D: Al conducir por debajo del límite de velocidad.
  answer: B
  explanation: Los conductores deben ser conscientes de que las funciones de seguridad
    pueden no funcionar correctamente en ciertas condiciones, como lluvia, nieve,
    hielo, niebla, colinas y curvas.
- id: 171
  category: vehicle_information
  question: ¿Cuál es la posición correcta del pedal y de la marcha al arrancar el
    motor del vehículo?
  choices:
    A: Pie derecho en el acelerador, marcha en Drive (D).
    B: Pie izquierdo en el freno, marcha en Neutral (N).
    C: Pie derecho en el freno, marcha en Park (P).
    D: Pie izquierdo en el embrague (clutch), marcha en primera.
  answer: C
  explanation: Para arrancar el motor, coloque el pie derecho en el pedal del freno
    y verifique que la palanca selectora de marchas esté en la posición de estacionamiento
    (Park).
- id: 172
  category: safe_driving_rules
  question: ¿Cómo debe estar posicionado su pie en el pedal del acelerador al mover
    el vehículo?
  choices:
    A: El talón del pie en el pedal y los dedos en el piso.
    B: La parte superior del pie en el pedal y el talón del pie en el piso.
    C: Todo el pie presionando de forma plana contra el centro del pedal.
    D: El costado del pie apoyado en el pedal.
  answer: B
  explanation: Debe acelerar de forma gradual y suave con la parte superior del pie
    en el pedal y el talón del pie en el piso.
- id: 173
  category: safe_driving_rules
  question: ¿Por qué ya no se recomienda colocar las manos en las posiciones de las
    2 y las 10 en punto en el volante?
  choices:
    A: Causa fatiga al conductor en viajes largos.
    B: Dificulta el alcance de las luces direccionales.
    C: Puede ser peligroso en un vehículo equipado con bolsas de aire (airbags).
    D: Reduce el radio de giro del vehículo.
  answer: C
  explanation: Ya no se recomienda colocar las manos en las posiciones de las 2 y
    las 10 en punto porque puede ser peligroso en un vehículo equipado con bolsas
    de aire (airbags).
- id: 174
  category: safe_driving_rules
  question: ¿Cuál es la posición de las manos en el volante recomendada actualmente?
  choices:
    A: Las 10 y las 2 en punto.
    B: Las 3 y las 9 en punto.
    C: Las 12 y las 6 en punto.
    D: Las 4 y las 8 en punto.
  answer: B
  explanation: Ambas manos deben colocarse en la parte exterior del volante en lados
    opuestos, en las posiciones de las 3 y las 9 en punto, para mantener el control
    del vehículo.
- id: 175
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una técnica correcta para sujetar el volante?
  choices:
    A: Sujetar el volante desde el interior del aro.
    B: Usar las palmas de las manos para girar el volante.
    C: Mantener los pulgares metidos debajo del volante.
    D: Mantener los pulgares hacia arriba a lo largo de la cara del volante.
  answer: D
  explanation: El agarre del volante debe ser firme pero suave. Use los dedos en lugar
    de las palmas de las manos y mantenga los pulgares hacia arriba a lo largo de
    la cara del volante.
- id: 176
  category: safe_driving_rules
  question: ¿Cuál es la posición corporal adecuada al retroceder su vehículo de manera
    segura?
  choices:
    A: Ambas manos en las 3 y las 9 en punto, mirando únicamente la cámara de retroceso.
    B: Mano izquierda en las 12 en punto, brazo derecho en el respaldo del asiento,
      mirando directamente a través de la ventana trasera.
    C: Mano derecha en las 12 en punto, mirando por el espejo retrovisor.
    D: Ambas manos en las 10 y las 2 en punto, mirando sobre su hombro izquierdo.
  answer: B
  explanation: Al retroceder, sujete el volante en la posición de las 12 en punto
    con la mano izquierda. Coloque el brazo derecho en el respaldo del asiento y mire
    directamente a través de la ventana trasera.
- id: 177
  category: safe_driving_rules
  question: Si usted y otro conductor llegan a una intersección de cuatro vías controlada
    por señales de alto (stop) exactamente al mismo tiempo, ¿quién debe ceder el paso?
  choices:
    A: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    B: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    C: El conductor que va derecho debe ceder el paso al conductor que gira.
    D: El conductor del vehículo más grande tiene el derecho de paso.
  answer: A
  explanation: Debe ceder el derecho de paso al conductor a su derecha en una intersección
    de cuatro vías controlada por señales de alto si ambos llegan a la intersección
    al mismo tiempo.
- id: 178
  category: signs_and_signals
  question: ¿Qué debe hacer si se aproxima a una intersección donde un oficial de
    policía está dirigiendo el tráfico, pero el semáforo está en rojo?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Hacer lo que el oficial de policía le indique.
    C: Tratar la intersección como una parada de cuatro vías.
    D: Girar a la derecha en rojo si el camino está despejado.
  answer: B
  explanation: Al acercarse a una intersección donde un oficial de policía está dirigiendo
    el tráfico, haga lo que el oficial le indique, independientemente de los dispositivos
    o señales de control de tráfico.
- id: 179
  category: signs_and_signals
  question: En las zonas donde los semáforos están montados horizontalmente, ¿cuál
    es la disposición de los colores?
  choices:
    A: Verde a la izquierda, amarillo en el medio, rojo a la derecha.
    B: Rojo a la izquierda, amarillo en el medio, verde a la derecha.
    C: Amarillo a la izquierda, rojo en el medio, verde a la derecha.
    D: Rojo arriba, amarillo en el medio, verde abajo.
  answer: B
  explanation: En algunas áreas metropolitanas, los semáforos son horizontales en
    lugar de verticales, y la luz roja está a la izquierda, la luz amarilla en el
    medio y la luz verde a la derecha.
- id: 180
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla del semáforo?
  choices:
    A: Usted tiene el derecho de paso para acelerar y despejar la intersección.
    B: La señal de tráfico está a punto de cambiar a rojo y debe detenerse si puede
      hacerlo de manera segura.
    C: Debe detenerse por completo de inmediato, independientemente de dónde se encuentre.
    D: La intersección está libre de todo tráfico.
  answer: B
  explanation: Una luz amarilla significa que la señal de tráfico está a punto de
    cambiar a rojo. Deténgase si puede hacerlo de manera segura.
- id: 181
  category: signs_and_signals
  question: ¿Bajo qué condición se permite un giro a la izquierda con un semáforo
    en rojo?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Al girar desde una calle de un solo sentido hacia una calle de doble sentido.
    C: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido.
    D: Los giros a la izquierda en rojo nunca están permitidos.
  answer: C
  explanation: Los giros a la izquierda en rojo se permiten solo cuando se gira desde
    una calle de un solo sentido hacia otra calle de un solo sentido. Primero debe
    detenerse por completo y luego girar a la izquierda cuando la vía esté despejada.
- id: 182
  category: safe_driving_rules
  question: Al realizar un giro a la izquierda con una luz verde fija, ¿a quién debe
    cederle el derecho de paso?
  choices:
    A: A los vehículos que vienen detrás de usted.
    B: A los conductores en el carril de tráfico opuesto que vienen en dirección contraria.
    C: Solo a los conductores a su derecha.
    D: A nadie, usted tiene el derecho de paso.
  answer: B
  explanation: Al girar a la izquierda con luz verde, se debe ceder el paso al tráfico
    directo que viene en dirección opuesta.
- id: 183
  category: safe_driving_rules
  question: ¿Cuándo se permite un giro a la izquierda con luz roja?
  choices:
    A: En cualquier momento que no haya tráfico en dirección contraria.
    B: Solo al girar desde una calle de un solo sentido hacia otra calle de un solo
      sentido.
    C: Solo al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    D: Los giros a la izquierda en rojo nunca están permitidos.
  answer: B
  explanation: Según el manual, los giros a la izquierda en rojo se permiten solo
    al girar desde una calle de un solo sentido hacia otra calle de un solo sentido,
    después de detenerse primero y asegurarse de que la vía esté despejada.
- id: 184
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a un cruce de ferrocarril con dos luces rojas
    intermitentes?
  choices:
    A: Reducir la velocidad y cruzar las vías rápidamente.
    B: Detenerse y avanzar solo después de que las luces dejen de parpadear y no se
      acerque ningún tren.
    C: Ceder el paso a los trenes, pero no detenerse a menos que se vea un tren.
    D: Detenerse y luego avanzar con precaución incluso si las luces siguen parpadeando.
  answer: B
  explanation: Dos luces rojas intermitentes marcan un cruce de ferrocarril. Debe
    detenerse y avanzar solo después de que las luces rojas dejen de parpadear y determine
    que no se acerca ningún tren.
- id: 185
  category: signs_and_signals
  question: ¿Cuál es la forma y el color típicos de una señal de advertencia?
  choices:
    A: Cuadrada y verde con letras blancas.
    B: En forma de diamante y amarilla con letras o símbolos negros.
    C: Rectangular y blanca con letras negras.
    D: En forma de octágono y roja con letras blancas.
  answer: B
  explanation: Las señales de advertencia suelen ser amarillas con letras o símbolos
    negros y tienen forma de diamante.
- id: 186
  category: defensive_driving
  question: Si su vehículo se apaga (se detiene) en un cruce de ferrocarril, ¿qué
    debe hacer de inmediato?
  choices:
    A: Quedarse en el vehículo y llamar al 911.
    B: Intentar arrancar el vehículo mientras vigila si vienen trenes.
    C: Abandonar el automóvil y correr lejos de la vía en la dirección de donde viene
      el tren.
    D: Abandonar el automóvil y correr por la vía en la misma dirección en la que
      viaja el tren.
  answer: C
  explanation: Si queda atrapado o su vehículo se detiene en un cruce de ferrocarril,
    abandone su automóvil de inmediato y corra lejos de la vía férrea en la dirección
    de donde viene el tren para evitar ser golpeado por escombros que salgan volando.
- id: 187
  category: sharing_the_road
  question: ¿Cuál es la distancia de frenado aproximada para un tren de carga promedio
    que viaja a 55 millas por hora?
  choices:
    A: 500 pies
    B: Media milla
    C: Una milla o más
    D: Dos millas
  answer: C
  explanation: La distancia de frenado para un tren de carga promedio a 55 millas
    por hora puede ser de una milla o más. Los trenes no pueden detenerse rápidamente.
- id: 188
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de obras?
  choices:
    A: Las multas se duplican.
    B: Se le suspende la licencia por 30 días.
    C: Las multas se triplican.
    D: Recibe una comparecencia obligatoria ante el tribunal.
  answer: A
  explanation: El manual establece que debe reducir su velocidad en las zonas de obras
    y que las multas por exceso de velocidad en una zona de obras se duplican.
- id: 189
  category: signs_and_signals
  question: ¿De qué color y forma son generalmente las señales de zona de obras?
  choices:
    A: Verdes y rectangulares
    B: Naranjas y en forma de diamante o rectangulares
    C: Amarillas y redondas
    D: Blancas y cuadradas
  answer: B
  explanation: Las señales de zona de obras suelen tener forma de diamante o rectangular
    y son de color naranja con letras o símbolos negros.
- id: 190
  category: signs_and_signals
  question: ¿Qué significa una señal de ceda el paso (yield)?
  choices:
    A: Usted tiene el derecho de paso y el resto del tráfico debe detenerse.
    B: Debe detenerse por completo en todo momento antes de avanzar.
    C: Debe reducir la velocidad y permitir que el tráfico que tiene el derecho de
      paso cruce antes de entrar.
    D: Está entrando en una calle de un solo sentido.
  answer: C
  explanation: Una señal de ceda el paso es un triángulo rojo y blanco que apunta
    hacia abajo, lo que significa que debe reducir la velocidad y permitir que el
    tráfico que tiene el derecho de paso cruce antes de entrar.
- id: 191
  category: safe_driving_rules
  question: ¿Para qué se utiliza un carril central compartido solo para girar a la
    izquierda?
  choices:
    A: Rebasar vehículos que circulan despacio.
    B: Tráfico directo durante las horas pico.
    C: Un carril reservado para vehículos que giran a la izquierda desde cualquier
      dirección.
    D: Solo para vehículos de emergencia.
  answer: C
  explanation: Esta señal le indica dónde un carril está reservado para el uso de
    vehículos que giran a la izquierda desde cualquier dirección y no debe usarse
    para el tráfico directo ni para rebasar a otros vehículos.
- id: 192
  category: signs_and_signals
  question: ¿Qué tipo de señales proporcionan información sobre carreteras que se
    cruzan, ciudades y puntos de interés?
  choices:
    A: Señales reglamentarias
    B: Señales de advertencia
    C: Señales de guía
    D: Señales de zona de obras
  answer: C
  explanation: Las señales de guía proporcionan información sobre carreteras que se
    cruzan, ayudan a dirigirlo hacia ciudades y pueblos, y muestran puntos de interés
    a lo largo de la carretera.
- id: 193
  category: safe_driving_rules
  question: Cuando necesite cruzar vías de ferrocarril, ¿cómo debe proceder?
  choices:
    A: Detenerse en las vías para mirar hacia ambos lados.
    B: Mirar hacia ambos lados y cruzar las vías rápidamente, sin detenerse.
    C: Cambiar de marcha mientras cruza las vías.
    D: Conducir lentamente a través de las vías para evitar dañar sus neumáticos.
  answer: B
  explanation: Cuando necesite cruzar vías de ferrocarril, el manual le indica que
    mire hacia ambos lados y cruce las vías rápidamente, sin detenerse.
- id: 194
  category: signs_and_signals
  question: ¿Qué indican las señales de límite de velocidad en blanco y negro?
  choices:
    A: La velocidad mínima a la que debe circular.
    B: La velocidad recomendada para condiciones peligrosas.
    C: La velocidad máxima legal permitida en condiciones ideales.
    D: El límite de velocidad solo durante las horas del día.
  answer: C
  explanation: Las señales de límite de velocidad son señales en blanco y negro que
    indican la velocidad máxima legal permitida en condiciones ideales.
- id: 195
  category: signs_and_signals
  question: Cuando hay más de un semáforo en una intersección, ¿cuál debe obedecer?
  choices:
    A: El que está en el extremo derecho.
    B: El que está sobre su carril.
    C: El semáforo más grande.
    D: El que tiene la flecha verde.
  answer: B
  explanation: El manual establece que cuando hay más de un semáforo, debe obedecer
    el que está sobre su carril.
- id: 196
  category: safe_driving_rules
  question: Al acercarse a una intersección que tiene tanto una línea de parada como
    un paso de peatones, ¿dónde debe detenerse?
  choices:
    A: Primero en el paso de peatones
    B: Primero en la línea de parada
    C: En medio del paso de peatones
    D: Justo después de la línea de parada
  answer: B
  explanation: Según el manual, si hay una línea de parada antes del paso de peatones,
    se debe obedecer primero la línea de parada.
- id: 197
  category: signs_and_signals
  question: ¿Qué tipo de señal tiene forma de pentágono?
  choices:
    A: Señal de ceder el paso
    B: Advertencia anticipada de ferrocarril
    C: Señal escolar
    D: Señal reglamentaria
  answer: C
  explanation: Según la tabla de formas estándar del manual, se utiliza una forma
    de pentágono para las señales escolares.
- id: 198
  category: signs_and_signals
  question: 'Una señal de tráfico redonda se utiliza para:'
  choices:
    A: Ceder el derecho de paso
    B: Ferrocarril y advertencia anticipada
    C: Peligros existentes o posibles
    D: Señales de guía
  answer: B
  explanation: El manual especifica que se utiliza una forma redonda para las señales
    de ferrocarril y de advertencia anticipada.
- id: 199
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar si planea girar en una intersección?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: 'El manual establece: ''Si planea girar en una intersección, señalice
    100 pies antes del giro''.'
- id: 200
  category: safe_driving_rules
  question: Si el conductor delante de usted está señalizando un giro, ¿cuándo debe
    usar su señal de giro?
  choices:
    A: Siempre, para advertir a los conductores detrás de usted
    B: Solo si usted también va a girar
    C: Solo si los está rebasando
    D: Nunca, confundirá a otros conductores
  answer: B
  explanation: 'El manual aconseja: ''Si el conductor delante de usted está señalizando
    un giro, no señalice a menos que usted también vaya a girar''.'
- id: 201
  category: safe_driving_rules
  question: 'Al realizar un giro a la derecha, usted debe:'
  choices:
    A: Abrirse hacia la izquierda antes de girar
    B: Girar desde la parte más a la izquierda de su carril
    C: Evitar abrirse hacia la izquierda antes de realizar el giro
    D: Acelerar rápidamente a través de la intersección
  answer: C
  explanation: Bajo la sección de 'Giros a la derecha', el manual establece 'Evitar
    abrirse hacia la izquierda antes de realizar el giro'.
- id: 202
  category: safe_driving_rules
  question: Al realizar un cambio de sentido (turnabout), ¿debe asegurarse de que
    su vehículo sea visible desde al menos qué distancia en cualquier dirección?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: Al prepararse para un cambio de sentido, el manual requiere que 'se
    asegure de que su vehículo sea visible a 500 pies en cualquier dirección'.
- id: 203
  category: defensive_driving
  question: Antes de avanzar después de detenerse en una intersección, ¿cuál es la
    forma correcta de verificar el tráfico transversal?
  choices:
    A: Mirar a la derecha, luego a la izquierda y luego a la derecha de nuevo
    B: Mirar a la izquierda, luego a la derecha y a la izquierda de nuevo
    C: Mirar hacia adelante y avanzar si está despejado
    D: Mirar únicamente el semáforo
  answer: B
  explanation: El manual instruye a los conductores a 'mirar a la izquierda, luego
    a la derecha y a la izquierda de nuevo antes de entrar en la intersección'.
- id: 204
  category: defensive_driving
  question: ¿Por qué debe evitar girar hacia un carril solo porque un vehículo que
    se aproxima tiene activa su señal de giro?
  choices:
    A: El conductor puede planear girar después de pasar su vehículo
    B: Las señales de giro a menudo están averiadas
    C: Siempre debe esperar a que el vehículo se detenga por completo
    D: El vehículo que se aproxima siempre tiene el derecho de paso para girar primero
  answer: A
  explanation: 'El manual advierte: ''El conductor con una señal de giro activa puede
    planear girar después de pasar su vehículo o puede haber olvidado apagar la señal
    de un giro anterior''.'
- id: 205
  category: safe_driving_rules
  question: ¿En qué dirección circulan los vehículos en una rotonda o glorieta?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En línea recta
    D: En cualquier dirección que sea más corta hacia la salida
  answer: B
  explanation: El manual establece que en una rotonda o glorieta, 'los vehículos circulan
    en sentido contrario a las agujas del reloj alrededor de una isla central elevada'.
- id: 206
  category: sharing_the_road
  question: Cuando se detiene por un autobús escolar que está subiendo o bajando pasajeros,
    ¿cuándo se le permite legalmente avanzar?
  choices:
    A: Tan pronto como se retraiga el brazo de parada
    B: Cuando el conductor del autobús le haga una señal para avanzar
    C: Cuando todas las personas estén fuera de la calzada y el autobús esté en movimiento
    D: Después de esperar 60 segundos
  answer: C
  explanation: Por ley, debe permanecer detenido hasta que todas las personas estén
    fuera de la calzada y el autobús esté en movimiento.
- id: 207
  category: sharing_the_road
  question: ¿En qué situación NO se requiere que se detenga ante un autobús escolar
    que está subiendo o bajando pasajeros?
  choices:
    A: Cuando sigue al autobús en una carretera de dos carriles
    B: Cuando se aproxima desde la dirección opuesta en una carretera de cuatro o
      más carriles
    C: Cuando se aproxima desde la dirección opuesta en una carretera de dos carriles
    D: Cuando sigue al autobús en una carretera con menos de cuatro carriles
  answer: B
  explanation: 'El manual establece: ''No se requiere una parada al aproximarse a
    un autobús detenido desde la dirección opuesta en una carretera de cuatro o más
    carriles''.'
- id: 208
  category: safe_driving_rules
  question: 'Al estacionar su vehículo a lo largo de una calzada con bordillo (curb),
    usted debe:'
  choices:
    A: Estacionar al menos a dos pies de distancia del bordillo
    B: Estacionar lo más cerca posible del bordillo
    C: Estacionar sobre la acera
    D: Estacionar de frente al tráfico que viene en sentido contrario
  answer: B
  explanation: 'El manual aconseja: ''Al estacionar a lo largo de la calzada, estacione
    su vehículo lo más lejos posible del flujo de tráfico. Si hay un bordillo, estacione
    lo más cerca posible de este''.'
- id: 209
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿de qué lado del vehículo es más seguro salir?
  choices:
    A: El lado de la calle
    B: El lado del bordillo
    C: El lado del conductor
    D: La parte trasera
  answer: B
  explanation: El manual establece que es más seguro salir de su vehículo por el lado
    del bordillo. Si debe usar el lado de la calle, debe verificar el tráfico antes
    de salir.
- id: 210
  category: driver_responsibility
  question: ¿Qué exige la ley de Kentucky que haga al dejar un vehículo?
  choices:
    A: Dejar el motor en marcha si va a estar fuera por menos de cinco minutos
    B: Apagar el motor y retirar la llave
    C: Dejar las ventanas bajadas para ventilación
    D: Encender las luces de emergencia
  answer: B
  explanation: La ley exige que apague el motor y retire la llave cuando deje un vehículo.
    También debe cerrar siempre su vehículo con llave.
- id: 211
  category: safe_driving_rules
  question: ¿Cómo debe girar las ruedas al estacionar en una colina sin bordillo?
  choices:
    A: Para que el vehículo ruede directamente hacia atrás
    B: Para que el vehículo se salga de la carretera en caso de rodar
    C: Para que el vehículo ruede hacia el centro de la calle
    D: Mantenga las ruedas perfectamente rectas
  answer: B
  explanation: Si no hay bordillo, gire las ruedas de modo que el vehículo se salga
    de la carretera en caso de rodar.
- id: 212
  category: penalties_and_points
  question: ¿Quién tiene permitido legalmente estacionar en un área de estacionamiento
    designada para personas con discapacidad?
  choices:
    A: Cualquier persona que solo vaya a estacionar por unos minutos
    B: Cualquier vehículo que muestre una calcomanía de discapacidad, independientemente
      de los pasajeros
    C: Vehículos que muestren un permiso oficial y transporten a una persona con discapacidad
    D: Ciudadanos de la tercera edad mayores de 65 años
  answer: C
  explanation: El estacionamiento para personas con discapacidad es solo para vehículos
    que muestren un permiso oficial y transporten a una persona con discapacidad.
- id: 213
  category: safe_driving_rules
  question: En una carretera de acceso limitado, ¿qué es ilegal con respecto al carril
    izquierdo?
  choices:
    A: Usarlo para rebasar vehículos más lentos
    B: Permanecer en el carril izquierdo
    C: Conducir al límite de velocidad indicado
    D: Usarlo para girar a la izquierda
  answer: B
  explanation: El manual establece explícitamente que permanecer en el carril izquierdo
    en una carretera de acceso limitado es ilegal.
- id: 214
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su giro en una intersección?
  choices:
    A: Detenerse y retroceder rápidamente
    B: Hacer un giro en U inmediatamente
    C: Continuar hasta la siguiente intersección y buscar el camino de regreso
    D: Detenerse en el lado equivocado de la carretera
  answer: C
  explanation: Si se pasa de su giro, continúe hasta la siguiente intersección y busque
    el camino de regreso hacia donde desea ir.
- id: 215
  category: defensive_driving
  question: Si ya ha comenzado a cruzar una intersección cuando el semáforo cambia,
    ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en la intersección
    B: Continuar y terminar de cruzar
    C: Poner su vehículo en reversa
    D: Virar bruscamente hacia el carril más cercano
  answer: B
  explanation: Si ya ha comenzado a cruzar una intersección cuando la luz cambia,
    continúe. Los cambios de último segundo pueden causar colisiones.
- id: 216
  category: defensive_driving
  question: ¿Cómo debe revisar sus 'puntos ciegos' al cambiar de carril?
  choices:
    A: Mirando por el espejo retrovisor
    B: Mirando por los espejos laterales
    C: Girando la cabeza y mirando por encima del hombro
    D: Tocando la bocina
  answer: C
  explanation: Revise sus 'puntos ciegos' girando la cabeza y mirando por encima del
    hombro en la dirección en la que planea moverse.
- id: 217
  category: safe_driving_rules
  question: Al entrar en una carretera de varios carriles, ¿quién tiene el derecho
    de paso?
  choices:
    A: El tráfico existente en la carretera
    B: El vehículo que entra en la carretera
    C: El vehículo más grande
    D: El vehículo que se mueve más rápido
  answer: A
  explanation: El tráfico existente tiene el derecho de paso, así que asegúrese de
    que esté despejado antes de incorporarse.
- id: 218
  category: safe_driving_rules
  question: Al salir de una carretera, ¿cuándo debe reducir la velocidad a la velocidad
    de salida?
  choices:
    A: Mientras aún está en la vía principal
    B: Después de moverse al carril de desaceleración
    C: Antes de señalizar su intención
    D: Justo antes de llegar a la curva de la rampa de salida
  answer: B
  explanation: Debe mantener la velocidad de su vehículo mientras esté en la vía principal,
    luego señalizar, moverse al carril de desaceleración y reducir a su velocidad
    de salida.
- id: 219
  category: safe_driving_rules
  question: Según la ley de Kentucky, ¿cuándo debe completarse un rebase en relación
    con un vehículo que viene en sentido contrario?
  choices:
    A: Antes de llegar a 50 pies del vehículo que viene en sentido contrario
    B: Antes de llegar a 100 pies del vehículo que viene en sentido contrario
    C: Antes de llegar a 200 pies del vehículo que viene en sentido contrario
    D: Antes de llegar a 500 pies del vehículo que viene en sentido contrario
  answer: C
  explanation: La ley de Kentucky exige que un rebase se complete antes de llegar
    a doscientos (200) pies de un vehículo que viene en sentido contrario.
- id: 220
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cómo sabe que tiene suficiente espacio para
    regresar al carril de conducción?
  choices:
    A: Cuando esté a una distancia de un vehículo por delante
    B: Cuando pueda ver la parte delantera completa del vehículo rebasado en su espejo
      retrovisor
    C: Cuando el vehículo rebasado parpadee sus luces delanteras
    D: Cuando esté paralelo al parachoques delantero del vehículo rebasado
  answer: B
  explanation: Debe continuar rebasando hasta que la parte delantera completa del
    vehículo rebasado sea visible en su espejo retrovisor antes de regresar al carril
    de conducción.
- id: 221
  category: defensive_driving
  question: ¿Cómo debe tratar una curva o una colina al considerar rebasar a otro
    vehículo?
  choices:
    A: Trátela como un vehículo que viene en sentido contrario y no comience a rebasar
    B: Toque la bocina y rebase rápidamente
    C: Acelere para rebasar antes de la curva o colina
    D: Rebase solo si el vehículo de adelante se mueve por debajo del límite de velocidad
  answer: A
  explanation: Cada vez que su vista esté bloqueada por una curva o una colina, debe
    asumir que hay un vehículo que viene en sentido contrario justo fuera de su vista.
    Trate una curva o una colina como un vehículo que viene en sentido contrario y
    no comience a rebasar.
- id: 222
  category: sharing_the_road
  question: Al rebasar una bicicleta en una carretera con un solo carril que circula
    en la misma dirección, ¿cuál es la distancia mínima que debe mantener entre su
    vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: Si solo hay un carril para el tráfico que circula en la misma dirección,
    rebase por la izquierda manteniendo al menos tres (3) pies entre su vehículo y
    la bicicleta o el scooter eléctrico de baja velocidad.
- id: 223
  category: safe_driving_rules
  question: ¿Qué sucede si todavía se encuentra en el carril izquierdo cuando llega
    a una "zona de no rebasar"?
  choices:
    A: Tiene el derecho de paso para terminar de rebasar
    B: Está violando la ley
    C: Debe acelerar para completar el rebase legalmente
    D: Debe obligar al vehículo de la derecha a irse al acotamiento
  answer: B
  explanation: La ley de Kentucky exige que un rebase se complete antes de llegar
    al comienzo de una "zona de no rebasar". Si todavía está en el carril izquierdo
    cuando llega a ella, está violando la ley.
- id: 224
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que debe mantener al rebasar una bicicleta
    o un scooter eléctrico de baja velocidad?
  choices:
    A: Dos (2) pies
    B: Tres (3) pies
    C: Cuatro (4) pies
    D: Cinco (5) pies
  answer: B
  explanation: El manual establece que se debe usar una precaución razonable al rebasar
    si no hay espacio disponible para tener una distancia mínima de tres (3) pies
    entre su vehículo y la bicicleta o el scooter eléctrico de baja velocidad.
- id: 225
  category: sharing_the_road
  question: 'Al rebasar una bicicleta o un scooter eléctrico de baja velocidad, puede
    conducir a la izquierda de la línea central en una zona de no rebasar ÚNICAMENTE
    si:'
  choices:
    A: Toca la bocina antes de cruzar la línea.
    B: Viaja a menos de 25 mph.
    C: La calzada a la izquierda está despejada a una distancia suficiente para permitir
      el rebase de manera segura.
    D: La bicicleta viaja a menos de 10 mph.
  answer: C
  explanation: Puede conducir a la izquierda de la línea central en una zona de no
    rebasar para adelantar a una bicicleta o scooter solo si la calzada a la izquierda
    está despejada a una distancia suficiente para permitir el rebase de manera segura
    y evitar interferencias con el tráfico que viene en sentido contrario.
- id: 226
  category: defensive_driving
  question: Idealmente, ¿con cuánta anticipación debería intentar mirar hacia adelante
    en su trayectoria de viaje planificada?
  choices:
    A: 5 a 10 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: 45 a 60 segundos
  answer: C
  explanation: Según el manual, idealmente, debe intentar mirar lo que ocurre entre
    20 y 30 segundos por delante de su automóvil para tener tiempo de ajustar y planificar
    los movimientos de conducción.
- id: 227
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad no señalizado en las autopistas interestatales
    y autovías (parkways) en Kentucky?
  choices:
    A: 55 MPH
    B: 60 MPH
    C: 65 MPH
    D: 70 MPH
  answer: C
  explanation: Cuando el límite de velocidad no está señalizado, sesenta y cinco millas
    por hora (65 MPH) es el límite de velocidad en las autopistas interestatales y
    autovías (parkways) en Kentucky.
- id: 228
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    un distrito comercial o residencial?
  choices:
    A: 25 MPH
    B: 35 MPH
    C: 45 MPH
    D: 55 MPH
  answer: B
  explanation: Treinta y cinco millas por hora (35 MPH) es el límite de velocidad
    en un distrito comercial o residencial cuando no está señalizado.
- id: 229
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una instalación de estacionamiento
    fuera de la vía pública ofrecida para uso público?
  choices:
    A: 10 MPH
    B: 15 MPH
    C: 20 MPH
    D: 25 MPH
  answer: B
  explanation: El límite de velocidad en una instalación de estacionamiento fuera
    de la vía pública ofrecida para uso público, ya sea de propiedad pública o privada,
    será de quince millas por hora (15 MPH).
- id: 230
  category: safe_driving_rules
  question: 'Si la lluvia intensa, la nieve o la niebla espesa limitan su visibilidad
    a 100 pies o menos, no puede conducir de manera segura a más de:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: En una lluvia intensa, una tormenta de nieve o una niebla espesa, es
    posible que no pueda ver más de 100 pies adelante. Cuando no pueda ver más allá
    de esa distancia, no puede conducir de manera segura a más de 25 millas por hora.
- id: 231
  category: defensive_driving
  question: Al acercarse a una curva, ¿cuál es el mejor momento para reducir la velocidad?
  choices:
    A: Antes de entrar en la curva
    B: Mientras se encuentra en el punto más pronunciado de la curva
    C: Después de entrar en la curva
    D: Justo al salir de la curva
  answer: A
  explanation: Reduzca siempre la velocidad a un nivel seguro antes de entrar en la
    curva. Frenar bruscamente después de entrar en una curva podría hacer que los
    neumáticos del vehículo pierdan tracción.
- id: 232
  category: vehicle_information
  question: 'Si su vehículo comienza a derrapar en una carretera resbaladiza y está
    equipado con frenos antibloqueo (ABS), usted debe:'
  choices:
    A: Bombear los frenos suavemente.
    B: Aplicar una presión constante a los frenos.
    C: Pisar los frenos repetidamente con fuerza.
    D: Tirar del freno de emergencia inmediatamente.
  answer: B
  explanation: Bombee los frenos suavemente, a menos que su vehículo esté equipado
    con frenos antibloqueo (ABS), en cuyo caso debe aplicar una presión constante
    a los frenos.
- id: 233
  category: defensive_driving
  question: 'El hidroplaneo (hydroplaning) ocurre cuando:'
  choices:
    A: Sus frenos se bloquean en una carretera helada.
    B: Los neumáticos de dirección comienzan a deslizarse sobre el agua acumulada.
    C: Usted conduce por una carretera inundada y el motor se apaga.
    D: Su vehículo pierde la dirección asistida bajo una lluvia intensa.
  answer: B
  explanation: El hidroplaneo ocurre cuando los neumáticos de dirección comienzan
    a deslizarse sobre cualquier acumulación de agua, de forma similar a la acción
    de los esquís acuáticos, y no están en contacto con la superficie real de la carretera.
- id: 234
  category: driver_responsibility
  question: ¿Cuál es el tiempo de percepción promedio para que un conductor alerta
    reconozca que debe detenerse?
  choices:
    A: ¼ a ½ segundo
    B: ½ a ¾ de segundo
    C: ¾ a 1 segundo
    D: 1 a 2 segundos
  answer: C
  explanation: El tiempo de percepción es el tiempo y la distancia que le toma reconocer
    que debe detenerse. El tiempo de percepción promedio para un conductor alerta
    es de ¾ de segundo a 1 segundo.
- id: 235
  category: defensive_driving
  question: A 50 mph en pavimento seco con buenos frenos, ¿aproximadamente cuántos
    pies tardan sus frenos en reducir la velocidad y detener su vehículo (distancia
    de frenado)?
  choices:
    A: 50 pies
    B: 100 pies
    C: 158 pies
    D: 250 pies
  answer: C
  explanation: La distancia de frenado es el tiempo y la distancia que tardan los
    frenos en reducir la velocidad y detener el vehículo. A 50 mph en pavimento seco
    con buenos frenos, puede tomar unos 158 pies.
- id: 236
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento recomendada entre su automóvil
    y el vehículo que tiene delante?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: Siempre debe intentar mantener una distancia mínima de seguimiento
    de 4 segundos entre su automóvil y el vehículo de adelante.
- id: 237
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debería AUMENTAR su distancia de
    seguimiento más allá del mínimo de 4 segundos?
  choices:
    A: Al conducir sobre pavimento seco durante el día.
    B: Al seguir a una motocicleta.
    C: Al conducir en un distrito residencial.
    D: Al acercarse a un semáforo en verde.
  answer: B
  explanation: Debe aumentar su distancia de seguimiento cuando siga a motocicletas,
    porque los motociclistas pueden girar y cambiar de carril mucho más rápido que
    otros vehículos.
- id: 238
  category: sharing_the_road
  question: 'Cuando otro vehículo lo está adelantando, la ley de Kentucky le exige:'
  choices:
    A: Aumentar la velocidad para evitar que lo adelanten.
    B: Moverse al carril izquierdo.
    C: Ceder el paso hacia la derecha a favor del vehículo que lo adelanta.
    D: Parpadear sus faros para advertir al tráfico que viene en sentido contrario.
  answer: C
  explanation: Al ser adelantado, la ley de Kentucky exige que el operador de un vehículo
    que está a punto de ser alcanzado y rebasado ceda el paso hacia la derecha a favor
    del vehículo que lo adelanta.
- id: 239
  category: sharing_the_road
  question: ¿Por qué debería dejar una distancia de seguimiento adicional al conducir
    detrás de una motocicleta?
  choices:
    A: Las motocicletas son más pesadas que los automóviles de pasajeros.
    B: Los motociclistas pueden girar y cambiar de carril mucho más rápido que otros
      vehículos.
    C: Las motocicletas requieren una distancia de frenado más larga que los automóviles.
    D: La ley exige que las motocicletas se detengan en todos los cruces ferroviarios.
  answer: B
  explanation: Los motociclistas pueden girar y cambiar de carril mucho más rápido
    que otros vehículos. Deje espacio adicional para reaccionar ante las motocicletas.
- id: 240
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra conduciendo ligeramente detrás de otro
    vehículo en su punto ciego?
  choices:
    A: Tocar la bocina continuamente para alertarlos de su presencia.
    B: Mantener su velocidad y posición de carril actuales.
    C: Aumentar la velocidad o retroceder para no permanecer en el punto ciego.
    D: Encender las luces altas.
  answer: C
  explanation: Es posible que se encuentre en su punto ciego, lo que reduce el espacio
    que podría necesitar para evitar un choque. Aumente la velocidad o retroceda,
    pero no permanezca en el punto ciego de otro conductor.
- id: 241
  category: sharing_the_road
  question: ¿Cómo debe ajustar la posición de su vehículo cuando un camión de remolque
    lo está rebasando?
  choices:
    A: Muévase hacia la parte interior de su carril, más cerca del camión.
    B: Muévase hacia la parte exterior de su carril para dejar un poco más de espacio.
    C: Circule sobre la línea central para darle espacio al camión.
    D: Salga completamente de la calzada hacia el acotamiento y deténgase.
  answer: B
  explanation: Cuando el vehículo que lo rebasa es un camión de remolque, deje un
    poco más de espacio entre usted y ese vehículo moviéndose hacia la parte exterior
    de su carril.
- id: 242
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado al acercarse a vehículos estacionados
    en el acotamiento de una autopista interestatal?
  choices:
    A: Toque la bocina y manténgase en su carril actual.
    B: Acelere para rebasar los vehículos estacionados lo más rápido posible.
    C: Cámbiese al carril izquierdo de manera segura antes de pasarlos y luego regrese
      al carril derecho.
    D: Deténgase detrás del vehículo estacionado para ver si el conductor necesita
      ayuda.
  answer: C
  explanation: Al acercarse a estos vehículos, cámbiese al carril izquierdo de manera
    segura antes de pasarlos y luego regrese al carril derecho después de haberlos
    pasado.
- id: 243
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de la salida deseada en una autopista interestatal
    o vía rápida?
  choices:
    A: Retroceda con cuidado por el acotamiento de la carretera.
    B: Haga un giro en U a través de la mediana de césped.
    C: Deténgase en su carril y espere a que el tráfico se despeje antes de retroceder.
    D: Continúe hasta la siguiente salida y busque el camino de regreso hacia donde
      desea ir.
  answer: D
  explanation: Si se ha pasado de su salida en una autopista interestatal o vía rápida,
    nunca retroceda ni intente dar la vuelta. Continúe hasta la siguiente salida y
    regrese desde allí.
- id: 244
  category: safe_driving_rules
  question: ¿Durante qué período de tiempo deben estar encendidos los faros de su
    vehículo?
  choices:
    A: Desde la puesta del sol hasta el amanecer.
    B: Desde media hora después de la puesta del sol hasta media hora antes del amanecer.
    C: Desde una hora después de la puesta del sol hasta una hora antes del amanecer.
    D: Solo cuando esté completamente oscuro afuera.
  answer: B
  explanation: Los faros deben estar encendidos durante el período comprendido entre
    media (1/2) hora después de la puesta del sol y media (1/2) hora antes del amanecer.
- id: 245
  category: vehicle_information
  question: Según el manual, ¿qué tipo de señales de giro debe tener su vehículo?
  choices:
    A: Solo señales mecánicas.
    B: Solo señales manuales.
    C: Tanto señales mecánicas como manuales.
    D: Señales de sensor automático.
  answer: A
  explanation: Su vehículo debe tener señales mecánicas. No se pueden utilizar señales
    manuales.
- id: 246
  category: safe_driving_rules
  question: ¿Debe usar su señal de giro si no ve otros vehículos a su alrededor?
  choices:
    A: No, es innecesario y desperdicia la energía de la batería.
    B: Sí, señale cada vez que cambie de dirección porque el vehículo que no ve es
      el más peligroso.
    C: Solo si conduce de noche o con mal tiempo.
    D: Solo si conduce en una carretera de varios carriles.
  answer: B
  explanation: Señale cada vez que cambie de dirección, incluso cuando no vea a nadie
    más alrededor. El vehículo que no ve es el más peligroso.
- id: 247
  category: defensive_driving
  question: ¿Cuáles son las tres opciones principales que tiene un conductor para
    evitar un choque o reducir su impacto?
  choices:
    A: Tocar la bocina, parpadear las luces o dar un volantazo.
    B: Frenar, maniobrar el volante o acelerar.
    C: Reducir la marcha, frenar o prepararse para el impacto.
    D: Cerrar los ojos, frenar o apagar el motor.
  answer: B
  explanation: Usted tiene tres opciones para evitar el choque o reducir su impacto.
    Estas opciones son frenar, maniobrar el volante o acelerar.
- id: 248
  category: vehicle_information
  question: ¿Cuál es la pauta general para frenar en una emergencia si su vehículo
    está equipado con un sistema de frenos antibloqueo (ABS)?
  choices:
    A: Bombee el pedal del freno rápidamente para evitar derrapar.
    B: Presione ligeramente el pedal del freno y aumente la presión gradualmente.
    C: Presione el pedal del freno con tanta fuerza como pueda y mantenga la presión.
    D: Aplique el freno de mano mientras presiona simultáneamente el freno de pie.
  answer: C
  explanation: 'Las pautas generales para usar el ABS son: presione el pedal del freno
    con tanta fuerza como pueda y mantenga la presión. El ABS funcionará solo si mantiene
    la presión en el pedal del freno.'
- id: 249
  category: defensive_driving
  question: Al maniobrar rápidamente el volante para esquivar un problema en la calzada,
    ¿qué debe hacer después de haber superado el obstáculo?
  choices:
    A: Acelere rápidamente para recuperar la velocidad perdida.
    B: Gire el volante en la dirección opuesta para enderezar su vehículo.
    C: Pise los frenos a fondo para detenerse por completo.
    D: Quite las manos del volante para dejar que el coche se corrija solo.
  answer: B
  explanation: Cuando haya superado el problema, gire el volante en la dirección opuesta
    para enderezar su vehículo, ganar control y comenzar a reducir la velocidad.
- id: 250
  category: defensive_driving
  question: Si su vehículo comienza a derrapar de lado, ¿hacia dónde debe girar el
    volante para recuperar el control?
  choices:
    A: Gire el volante en la dirección opuesta al derrape.
    B: Mantenga el volante perfectamente recto.
    C: Gire el volante en la dirección en la que derrapa la parte trasera del vehículo.
    D: Gire el volante bruscamente a la izquierda y a la derecha hasta que vuelva
      la tracción.
  answer: C
  explanation: Si comienza a derrapar de lado, debe girar el volante en la dirección
    en la que derrapa la parte trasera del vehículo. Esto permitirá que la parte delantera
    del vehículo se alinee con la trasera.
- id: 251
  category: defensive_driving
  question: ¿Cómo debe reducir la velocidad de su vehículo si está derrapando en línea
    recta y NO tiene frenos antibloqueo (ABS)?
  choices:
    A: Frenar lo más fuerte posible y mantener el pedal presionado.
    B: Bombear los frenos suavemente.
    C: Aplicar el freno de mano de emergencia inmediatamente.
    D: Cambiar el vehículo a reversa.
  answer: B
  explanation: Si no tiene frenos antibloqueo, no frene con fuerza. Esto solo bloqueará
    sus ruedas y empeorará el derrape. En su lugar, reduzca la velocidad del vehículo
    bombeando los frenos suavemente.
- id: 252
  category: defensive_driving
  question: ¿Cómo puede ayudar a que el conductor detrás de usted mantenga una distancia
    de seguimiento segura?
  choices:
    A: Pisando frecuentemente sus frenos para advertirle.
    B: Acelerando y frenando de manera impredecible.
    C: Manteniendo una velocidad constante, señalizando con anticipación y dejando
      más espacio al frente.
    D: Encendiendo sus luces de emergencia mientras conduce.
  answer: C
  explanation: Puede ayudar a mantener al conductor detrás de usted a una distancia
    segura manteniendo una velocidad constante, señalizando con anticipación y dejando
    más espacio frente a su vehículo antes de reducir la velocidad o girar.
- id: 253
  category: defensive_driving
  question: ¿Cuál es el control más importante del vehículo que se debe usar durante
    un derrape?
  choices:
    A: El pedal del acelerador
    B: El pedal del freno
    C: El volante
    D: El freno de mano
  answer: C
  explanation: Según el manual, continúe corrigiendo su dirección hasta que se recupere
    por completo del derrape. El control más importante del vehículo que se debe usar
    durante un derrape es el volante.
- id: 254
  category: defensive_driving
  question: Si su vehículo no tiene frenos antibloqueo (ABS) y comienza a derrapar,
    ¿qué debe hacer?
  choices:
    A: Frenar fuerte para detener el vehículo inmediatamente
    B: Reducir la velocidad del vehículo bombeando los frenos suavemente
    C: Poner el vehículo en punto muerto (neutral) y avanzar por inercia hasta detenerse
    D: Tirar del freno de mano rápidamente
  answer: B
  explanation: Si no tiene frenos antibloqueo, no frene con fuerza, ya que esto bloqueará
    sus ruedas y empeorará el derrape. En su lugar, reduzca la velocidad del vehículo
    bombeando los frenos suavemente.
- id: 255
  category: defensive_driving
  question: ¿Qué debe hacer si las ruedas de su vehículo se salen de la carretera
    pavimentada y caen en una superficie irregular?
  choices:
    A: Girar el volante bruscamente por pánico para volver inmediatamente al pavimento
    B: Frenar fuerte y detenerse en el acotamiento
    C: Reducir la velocidad gradualmente y girar rápidamente de regreso al pavimento
      cuando sea seguro
    D: Acelerar para recuperar la tracción antes de volver a girar
  answer: C
  explanation: Si su vehículo se sale de la carretera pavimentada, evite girar el
    volante bruscamente por pánico. Reduzca la velocidad gradualmente, cuando sea
    seguro hacerlo, y gire rápidamente de regreso al pavimento.
- id: 256
  category: safe_driving_rules
  question: Según la ley de Kentucky, ¿qué debe hacer si está involucrado en un accidente
    sin heridos?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue una grúa
    B: Mover los vehículos dañados al acotamiento de la carretera
    C: Conducir a casa y reportar el accidente al día siguiente
    D: Esperar a un oficial antes de mover los vehículos fuera del carril de tráfico
  answer: B
  explanation: De acuerdo con la ley de Kentucky (KRS 189.580), cuando esté involucrado
    en un accidente sin heridos, debe mover los vehículos dañados al acotamiento de
    la carretera.
- id: 257
  category: driver_responsibility
  question: Si está involucrado en una colisión que resulte en daños a la propiedad
    que superen los $500 y ningún oficial de la ley investiga, ¿cuánto tiempo tiene
    para presentar un informe por escrito a la Policía Estatal de Kentucky?
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Cualquier persona involucrada en una colisión de automóviles que resulte
    en daños a la propiedad que superen los $500 y que no sea investigada por un oficial,
    deberá presentar un informe por escrito a la Policía Estatal de Kentucky dentro
    de los diez (10) días.
- id: 258
  category: driver_responsibility
  question: ¿Qué debe hacer si choca con un vehículo estacionado y no puede localizar
    al propietario?
  choices:
    A: Abandonar la escena inmediatamente si no hay daños visibles
    B: Esperar junto al vehículo hasta que el dueño regrese
    C: Llamar a una grúa para retirar el vehículo estacionado
    D: Dejar una nota con su nombre, dirección, número de licencia de conducir, número
      de placa, y la fecha y hora
  answer: D
  explanation: Si la colisión involucra a un vehículo estacionado y no puede localizar
    al propietario, deje una nota donde pueda verse que incluya su nombre, dirección,
    número de licencia de conducir, número de placa, junto con la fecha y hora de
    la colisión.
- id: 259
  category: driver_responsibility
  question: ¿Cuándo debe intentar retirar a una persona herida de la escena de una
    colisión?
  choices:
    A: Inmediatamente al llegar a la escena
    B: Solo en emergencias que pongan en peligro la vida
    C: Siempre que pidan ser movidos
    D: Si están bloqueando el tráfico
  answer: B
  explanation: Solo en emergencias que pongan en peligro la vida debe intentar retirar
    a una persona de una colisión. Si es posible, espere a un técnico en emergencias
    médicas o una ambulancia.
- id: 260
  category: vehicle_information
  question: Si sus frenos dejan de funcionar mientras conduce, ¿cuál es el primer
    paso que debe tomar?
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a reversa
    C: Usar el freno de mano tirando o presionándolo lentamente
    D: Bombear el pedal del acelerador
  answer: C
  explanation: Si sus frenos dejan de funcionar mientras conduce, use el freno de
    mano. Tire de la palanca o presione el pedal de pie lentamente para no bloquear
    las ruedas traseras y causar un derrape.
- id: 261
  category: defensive_driving
  question: ¿Cómo debe reaccionar si un neumático estalla o se desinfla repentinamente
    mientras conduce?
  choices:
    A: Frenar bruscamente y detenerse en el carril
    B: Sujetar el volante con firmeza, mantenerse derecho y reducir la velocidad gradualmente
      sin frenar bruscamente
    C: Girar el volante bruscamente en la dirección opuesta al estallido
    D: Acelerar para mantener el control del vehículo
  answer: B
  explanation: Si un neumático estalla, sujete el volante con firmeza, mantenga el
    vehículo derecho, reduzca la velocidad gradualmente quitando el pie del acelerador
    y no frene bruscamente.
- id: 262
  category: vehicle_information
  question: 'Si el motor se apaga mientras conduce, debe tener en cuenta que:'
  choices:
    A: El volante se bloqueará por completo y no podrá girarse
    B: El volante puede ser difícil de girar, pero aún podrá girarlo
    C: Los frenos se aplicarán automáticamente
    D: El vehículo se detendrá por completo de inmediato
  answer: B
  explanation: Si el motor se apaga mientras conduce, sujete el volante con firmeza.
    Tenga en cuenta que el volante puede ser difícil de girar, pero podrá hacerlo.
- id: 263
  category: defensive_driving
  question: ¿Cuál es la acción correcta a seguir si su vehículo acelera sin control
    debido a un acelerador atascado?
  choices:
    A: Apagar el motor, poner la marcha en punto muerto (neutral) y buscar una vía
      de escape
    B: Cambiar a la posición de estacionamiento (park) mientras está en movimiento
    C: Tirar del freno de mano con la mayor fuerza posible
    D: Girar el volante bruscamente de un lado a otro
  answer: A
  explanation: Si su vehículo acelera sin control, apague el motor, ponga la marcha
    en punto muerto (neutral), busque una vía de escape, maniobre con suavidad, frene
    suavemente y salga de la calzada.
- id: 264
  category: safe_driving_rules
  question: ¿Dónde debe colocar las bengalas de emergencia si su vehículo se avería
    en la autopista?
  choices:
    A: De 10 a 20 pies detrás del vehículo
    B: De 50 a 100 pies detrás del vehículo
    C: De 200 a 300 pies detrás del vehículo
    D: De 500 a 600 pies detrás del vehículo
  answer: C
  explanation: Intente advertir a otros usuarios de la vía colocando bengalas de emergencia
    a unos 200 o 300 pies detrás del vehículo, para dar tiempo a otros conductores
    a cambiar de carril si es necesario.
- id: 265
  category: sharing_the_road
  question: 'Al realizar un giro a la derecha o a la izquierda con luz roja, usted
    debe:'
  choices:
    A: Tocar la bocina para advertir a los peatones que despejen el paso de cebra
    B: Estar preparado para ceder el paso a los peatones
    C: Continuar sin detenerse si no vienen otros vehículos
    D: Esperar a la luz verde si hay peatones visibles en la acera
  answer: B
  explanation: Al realizar un giro a la derecha o a la izquierda en rojo, debe estar
    preparado para ceder el paso a los peatones.
- id: 266
  category: sharing_the_road
  question: ¿Cuál es la sanción por no ceder el paso a un peatón ciego que lleva un
    bastón blanco o va acompañado de un perro de asistencia?
  choices:
    A: Una advertencia por la primera infracción
    B: Una multa de hasta $100
    C: Una multa de hasta $250
    D: Suspensión inmediata de la licencia
  answer: C
  explanation: La ley de Kentucky exige que los conductores cedan el paso a los peatones
    ciegos que lleven un bastón blanco o vayan acompañados de un perro de asistencia.
    No ceder el paso es una infracción que podría resultar en una multa de hasta $250.
- id: 267
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso si un peatón cruza una calzada en un punto
    que no sea un paso de cebra marcado o no marcado en una intersección?
  choices:
    A: El peatón siempre tiene el derecho de paso
    B: El peatón debe ceder el paso a todos los vehículos
    C: Los vehículos deben detenerse y esperar al peatón independientemente de la
      ubicación
    D: El derecho de paso es para quien llegue primero
  answer: B
  explanation: Todo peatón que cruce una calzada en un punto que no sea un paso de
    cebra marcado o un paso de cebra no marcado en una intersección deberá ceder el
    paso a todos los vehículos.
- id: 268
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por no ceder el paso a un peatón ciego en Kentucky?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: No ceder el paso a un peatón ciego es una infracción que podría resultar
    en una multa de hasta doscientos cincuenta dólares ($250).
- id: 269
  category: sharing_the_road
  question: Al detenerse ante un peatón ciego en un paso de cebra, ¿a qué distancia
    debe detener su vehículo del paso de cebra si no hay una línea de parada adelantada?
  choices:
    A: Al menos a 10 pies de distancia
    B: A no más de 5 pies del paso de cebra
    C: A más de 15 pies de distancia
    D: Dentro del paso de cebra
  answer: B
  explanation: No detenga su vehículo a más de cinco (5) pies del paso de cebra, a
    menos que haya una línea de parada adelantada. Un peatón ciego utiliza el sonido
    de su vehículo como guía.
- id: 270
  category: sharing_the_road
  question: ¿Por qué los conductores de vehículos eléctricos e híbridos deben estar
    más alerta ante los peatones ciegos?
  choices:
    A: Estos vehículos tienen puntos ciegos más grandes.
    B: Los peatones ciegos pueden no percatarse de su presencia debido a la naturaleza
      silenciosa de estos vehículos.
    C: Estos vehículos aceleran más rápido que los vehículos estándar.
    D: Los faros de estos vehículos son menos visibles durante el día.
  answer: B
  explanation: Los conductores de vehículos eléctricos e híbridos deben estar más
    alerta ante los peatones ciegos, ya que estos pueden no percatarse de su presencia
    debido a la naturaleza silenciosa de estos vehículos.
- id: 271
  category: sharing_the_road
  question: ¿Cuál es la cantidad mínima de espacio recomendada que un conductor debe
    dejar al rebasar a un ciclista?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cinco pies
  answer: C
  explanation: Se recomienda al menos tres pies de espacio al rebasar ciclistas y
    los vehículos que rebasan deben volver al carril derecho solo cuando estén bien
    alejados del ciclista.
- id: 272
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe un ciclista hacer una señal antes de realizar
    un giro?
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 200 pies
  answer: B
  explanation: La señal se debe dar de forma intermitente durante los últimos cincuenta
    (50) pies recorridos por el vehículo (bicicleta) antes del giro.
- id: 273
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla que los ciclistas deben seguir?
  choices:
    A: Circular por la acera siempre que sea posible.
    B: Circular en sentido contrario al tráfico.
    C: Nunca circular por autopistas interestatales y vías rápidas (parkways).
    D: Circular al menos de tres en fondo para aumentar la visibilidad.
  answer: C
  explanation: Las reglas para ciclistas establecen que "nunca deben circular por
    autopistas interestatales y vías rápidas". También se les prohíbe circular por
    las aceras y deben circular con el tráfico.
- id: 274
  category: vehicle_information
  question: Al andar en bicicleta por la noche, ¿qué equipo de iluminación se requiere?
  choices:
    A: Una luz blanca tanto en la parte delantera como en la trasera.
    B: Una luz roja en la parte delantera y un reflector blanco en la trasera.
    C: Una luz blanca visible desde el frente y un reflector o luz roja visible desde
      la parte trasera.
    D: Solo se requiere ropa reflectante.
  answer: C
  explanation: Al circular de noche, opere la bicicleta con una luz blanca visible
    desde el frente y un reflector o luz roja visible desde la parte trasera.
- id: 275
  category: vehicle_information
  question: ¿Cuál es la velocidad máxima de diseño de un scooter eléctrico de baja
    velocidad en una superficie nivelada pavimentada?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 30 millas por hora
  answer: B
  explanation: Un scooter eléctrico de baja velocidad está diseñado para operar a
    una velocidad máxima de veinte (20) millas por hora en una superficie nivelada
    pavimentada.
- id: 276
  category: license_system
  question: ¿Cuál es la edad mínima requerida para operar un scooter eléctrico de
    baja velocidad en una carretera, carril para bicicletas o sendero para bicicletas?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: Una persona de dieciséis (16) años de edad o más puede operar un scooter
    eléctrico de baja velocidad en una carretera, carril para bicicletas o sendero
    para bicicletas.
- id: 277
  category: safe_driving_rules
  question: ¿En qué horarios deben estar encendidas las luces de un scooter eléctrico
    de baja velocidad?
  choices:
    A: Desde el atardecer hasta el amanecer.
    B: Desde media hora después del atardecer hasta media hora antes del amanecer.
    C: Desde una hora después del atardecer hasta una hora antes del amanecer.
    D: En todo momento cuando se opera en una carretera.
  answer: B
  explanation: Estas luces deben estar encendidas desde media (1/2) hora después del
    atardecer hasta media (1/2) hora antes del amanecer o en otros momentos cuando
    haya poca visibilidad.
- id: 278
  category: sharing_the_road
  question: 'Al compartir la carretera con una motocicleta, usted debe:'
  choices:
    A: Compartir el carril con la motocicleta para mejorar el flujo del tráfico.
    B: Permitir al motociclista el ancho total de un carril.
    C: Tocar la bocina al rebasarlos.
    D: Seguirlos a una distancia de 2 segundos.
  answer: B
  explanation: Permita a un motociclista el ancho total de un carril. No comparta
    el carril. La motocicleta necesita espacio para que el motociclista reaccione
    ante el resto del tráfico.
- id: 279
  category: defensive_driving
  question: ¿Por qué no debe asumir que una motocicleta va a girar solo porque su
    luz direccional está parpadeando?
  choices:
    A: Las luces direccionales de las motocicletas se usan a menudo como luces de
      emergencia.
    B: Los motociclistas usan las luces direccionales para indicar que están disminuyendo
      la velocidad.
    C: Es posible que las luces direccionales de las motocicletas no se cancelen automáticamente
      y que el conductor haya olvidado apagarlas.
    D: La luz direccional indica que la motocicleta está cambiando de marcha.
  answer: C
  explanation: No asuma que una motocicleta va a girar cuando vea que su luz direccional
    parpadea. Es posible que las luces direccionales de las motocicletas no se cancelen
    automáticamente y que el motociclista haya olvidado apagarlas.
- id: 280
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada al conducir detrás
    de un motociclista?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: Al seguir a un motociclista, deje una distancia de seguimiento mínima
    de 4 segundos o más en condiciones de humedad, o es posible que no tenga suficiente
    tiempo o espacio para evitar un choque.
- id: 281
  category: defensive_driving
  question: ¿Por qué debe un conductor evitar reducir la velocidad o detenerse rápidamente
    delante de un ciclista?
  choices:
    A: Las bicicletas no están equipadas con frenos.
    B: Los frenos de un vehículo motorizado son más potentes que los de una bicicleta
      y podrían causar un choque.
    C: El ciclista se verá obligado a circular por la acera.
    D: Es ilegal frenar delante de una bicicleta.
  answer: B
  explanation: Evite reducir la velocidad o detenerse rápidamente. Los frenos de un
    vehículo motorizado son más potentes que los de una bicicleta y usted podría causar
    un choque.
- id: 282
  category: sharing_the_road
  question: ¿Qué debe hacer si un peatón ciego da un paso atrás y retira su bastón
    en un cruce de peatones?
  choices:
    A: Tocar la bocina para avisarle que es seguro cruzar.
    B: Darle instrucciones verbales para cruzar la calle.
    C: Esperar hasta que vuelva a dar un paso adelante.
    D: Tomarlo como una señal definitiva de que usted debe avanzar.
  answer: D
  explanation: Si la persona da un paso atrás y retira el bastón, es una señal definitiva
    de que usted debe avanzar.
- id: 283
  category: sharing_the_road
  question: Bajo condiciones ideales, ¿cuánta distancia necesita un camión cargado
    que viaja a 55 mph para detenerse por completo?
  choices:
    A: Al menos 150 pies
    B: Al menos 200 pies
    C: Al menos 250 pies
    D: Al menos 335 pies
  answer: D
  explanation: Según el manual, un camión cargado con neumáticos en buen estado y
    frenos ajustados correctamente que viaja a 55 mph requiere al menos 335 pies antes
    de detenerse por completo.
- id: 284
  category: sharing_the_road
  question: ¿Cómo puede determinar si está conduciendo en el punto ciego lateral de
    un camión grande?
  choices:
    A: Si se encuentra a menos de 50 pies del parachoques trasero del camión
    B: Si no puede ver la cara del conductor en el espejo retrovisor lateral
    C: Si está conduciendo en el carril izquierdo junto al camión
    D: Si puede ver los faros del camión en su espejo retrovisor
  answer: B
  explanation: El manual explica que si no puede ver la cara del conductor en el espejo
    retrovisor lateral, él o ella no puede verlo a usted, lo que significa que se
    encuentra en su punto ciego.
- id: 285
  category: sharing_the_road
  question: ¿Hasta qué distancia puede extenderse el punto ciego directamente detrás
    de un vehículo comercial grande?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 200 pies
    D: Hasta 300 pies
  answer: C
  explanation: A diferencia de los automóviles, los vehículos grandes tienen puntos
    ciegos enormes directamente detrás de ellos que se extienden hasta 200 pies.
- id: 286
  category: defensive_driving
  question: Al rebasar un vehículo grande, ¿cuándo es seguro volver a colocarse delante
    de él?
  choices:
    A: Tan pronto como pase el parachoques delantero del camión
    B: Cuando pueda ver toda la parte delantera del vehículo en su espejo retrovisor
      interior
    C: Cuando el conductor del camión parpadee sus faros
    D: Después de haber mantenido su velocidad durante 3 segundos
  answer: B
  explanation: El manual aconseja que al rebasar un vehículo grande, debe ver toda
    la parte delantera del vehículo en su espejo retrovisor interior antes de colocarse
    delante y mantener la velocidad.
- id: 287
  category: sharing_the_road
  question: ¿Por qué los camiones grandes a veces se abren hacia la izquierda al realizar
    un giro a la derecha?
  choices:
    A: Para permitir que los autos los rebasen por la derecha
    B: Para librar con seguridad la esquina de un bordillo u otra obstrucción
    C: Para aumentar la velocidad antes de entrar en la nueva carretera
    D: Para revisar sus puntos ciegos del lado derecho
  answer: B
  explanation: Cuando un camión o autobús necesita girar a la derecha, el conductor
    a veces abrirá el vehículo hacia la izquierda para girar a la derecha de forma
    segura y librar la esquina de un bordillo u otra obstrucción.
- id: 288
  category: signs_and_signals
  question: ¿Por qué se colocan líneas de parada en muchas intersecciones?
  choices:
    A: Para indicar por dónde se permite cruzar a los peatones
    B: Para marcar el límite de una zona escolar
    C: Para situar a los vehículos más atrás y dar a los vehículos más grandes más
      espacio para girar
    D: Para mostrar dónde cambia el límite de velocidad
  answer: C
  explanation: Muchas intersecciones están marcadas con líneas de parada para situarlo
    más atrás en una intersección y dar a los vehículos más grandes más espacio para
    girar.
- id: 289
  category: defensive_driving
  question: Cuando esté detenido detrás de un camión en una pendiente ascendente,
    ¿dwónde debe posicionar su vehículo?
  choices:
    A: Tan cerca del parachoques trasero del camión como sea posible
    B: A la derecha de su carril
    C: A la izquierda de su carril donde el conductor pueda verlo
    D: En el centro del carril con las luces de emergencia encendidas
  answer: C
  explanation: Cuando esté detenido detrás de un camión en una pendiente ascendente,
    manténgase a la izquierda de su carril donde el conductor pueda verlo y deje espacio
    adicional en caso de que el camión retroceda.
- id: 290
  category: safe_driving_rules
  question: ¿Qué deben hacer los vehículos que transportan materiales peligrosos en
    todos los cruces de ferrocarril?
  choices:
    A: Reducir la velocidad a 15 mph
    B: Detenerse solo si se acerca un tren
    C: Tocar la bocina antes de cruzar
    D: Detenerse en todos los cruces de ferrocarril
  answer: D
  explanation: El manual establece explícitamente que los vehículos que transportan
    materiales peligrosos deben detenerse en todos los cruces de ferrocarril.
- id: 291
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando escucha una sirena o ve un vehículo que muestra
    luces rojas o azules intermitentes?
  choices:
    A: Aumentar la velocidad para despejar el camino rápidamente
    B: Detenerse inmediatamente en su carril actual
    C: Dirigirse al lado derecho de la carretera o al borde de la acera, fuera de
      cualquier intersección, y detenerse
    D: Moverse al carril izquierdo y reducir la velocidad
  answer: C
  explanation: Cuando se percate de que se aproxima un vehículo de emergencia con
    luces rojas/azules intermitentes o una sirena, debe dirigirse inmediatamente al
    lado derecho de la carretera o al borde de la acera, fuera de cualquier intersección,
    y detenerse.
- id: 292
  category: safe_driving_rules
  question: 'Es ilegal seguir a cualquier vehículo de emergencia a una distancia menor
    de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Según la ley de Kentucky, es ilegal seguir a cualquier vehículo de
    emergencia a una distancia menor de 500 pies.
- id: 293
  category: driver_responsibility
  question: ¿Qué debe hacer con las manos cuando un oficial de la ley lo detiene?
  choices:
    A: Mantenerlas en su regazo
    B: Mantenerlas en el volante
    C: Usarlas para buscar inmediatamente su licencia
    D: Sacarlas por la ventana
  answer: B
  explanation: Durante una parada de tráfico, debe mantener las manos en el volante
    y limitar los movimientos para que el oficial no piense que está escondiendo o
    buscando algo.
- id: 294
  category: driver_responsibility
  question: Si un oficial de la ley lo detiene por la noche, ¿qué debe hacer para
    ayudar al oficial?
  choices:
    A: Apagar los faros delanteros
    B: Encender las luces altas
    C: Encender las luces interiores
    D: Salir del vehículo inmediatamente
  answer: C
  explanation: Si lo detienen por la noche, debe encender las luces interiores para
    ayudar al oficial a ver que todo está en orden dentro del vehículo.
- id: 295
  category: driver_responsibility
  question: Cuando un oficial de la ley le solicita sus documentos durante una parada
    de tráfico, ¿cuál es el procedimiento adecuado?
  choices:
    A: Alcanzar rápidamente la guantera para sacarlos
    B: Decirle al oficial dónde se encuentran antes de alcanzarlos lentamente
    C: Pedirle al oficial que los saque por usted
    D: Entregarle al oficial su billetera completa
  answer: B
  explanation: Cuando se le solicite proporcionar documentos, primero debe decirle
    al oficial dónde se encuentran y luego alcanzarlos lentamente con una mano en
    el volante.
- id: 296
  category: safe_driving_rules
  question: ¿Qué exigen las leyes de "hacerse a un lado" (move-over laws) que hagan
    los conductores al acercarse a un incidente en la carretera?
  choices:
    A: Detenerse y ofrecer asistencia al personal de emergencia
    B: Mantener la velocidad pero tocar la bocina para advertir a los trabajadores
    C: Reducir la velocidad y cambiar de carril
    D: Detenerse en el arcén derecho y parar
  answer: C
  explanation: Las leyes de "hacerse a un lado" (move-over laws) exigen que los conductores
    reduzcan la velocidad y cambien de carril al acercarse a un incidente en la carretera
    para proteger al personal de las fuerzas del orden, servicios médicos de emergencia
    (EMS) y del departamento de bomberos.
- id: 297
  category: safe_driving_rules
  question: Según las leyes de "hacerse a un lado" de Kentucky, ¿qué debe hacer un
    conductor al acercarse a un vehículo de emergencia detenido en el arcén de una
    carretera de cuatro carriles?
  choices:
    A: Detenerse inmediatamente y esperar a que el vehículo se retire.
    B: Acercarse lentamente y moverse al carril izquierdo si es seguro hacerlo.
    C: Mantener la velocidad y permanecer en el carril derecho.
    D: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia.
  answer: B
  explanation: La ley de Kentucky exige que los conductores se acerquen lentamente
    y se muevan al carril izquierdo en carreteras de cuatro carriles, si es seguro
    hacerlo, al acercarse a vehículos policiales o de emergencia detenidos.
- id: 298
  category: signs_and_signals
  question: Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera de un vehículo indica que el vehículo viaja a ¿qué velocidad?
  choices:
    A: Menos de 15 mph
    B: Menos de 25 mph
    C: Menos de 35 mph
    D: Menos de 45 mph
  answer: B
  explanation: Un triángulo naranja y rojo fluorescente o reflectante que se muestra
    en la parte trasera de vehículos tirados por animales, equipos agrícolas o equipos
    de construcción significa que el vehículo viaja a menos de 25 mph.
- id: 299
  category: sharing_the_road
  question: ¿Por qué debe evitar usar la bocina o acelerar el motor al rebasar a un
    jinete o un vehículo tirado por animales?
  choices:
    A: Es ilegal usar la bocina en zonas rurales.
    B: Puede asustar al caballo y provocar un choque.
    C: Hará que el vehículo tirado por animales aumente la velocidad.
    D: El jinete no puede oír los vehículos que se acercan de todos modos.
  answer: B
  explanation: Al compartir la carretera con vehículos tirados por animales y jinetes,
    debe rebasar con precaución y no usar la bocina ni acelerar el motor, ya que esto
    puede asustar al caballo y provocar un choque.
- id: 300
  category: safe_driving_rules
  question: Al cruzar una carretera pública de dos carriles en un vehículo todo terreno
    (ATV), ¿cuál es la distancia máxima que se le permite viajar por la carretera?
  choices:
    A: Un décimo (1/10) de milla
    B: Dos décimos (2/10) de milla
    C: Cinco décimos (5/10) de milla
    D: Una milla
  answer: B
  explanation: Al cruzar una carretera pública de dos carriles, el operador debe cruzar
    en un ángulo lo más cercano posible a los 90 grados y no debe viajar por la carretera
    más de dos décimos (2/10) de milla.
- id: 301
  category: driver_responsibility
  question: ¿Qué se requiere para que una persona menor de dieciséis (16) años opere
    un vehículo todoterreno (ATV)?
  choices:
    A: Supervisión parental directa y casco protector aprobado
    B: Un permiso de instrucción válido y solo durante las horas del día
    C: Una licencia especial para ATV y ropa reflectante
    D: Tienen estrictamente prohibido operar un ATV bajo cualquier circunstancia
  answer: A
  explanation: Si es menor de dieciséis (16) años, una persona no podrá operar un
    ATV excepto bajo la supervisión parental directa, y nunca sin el casco protector
    aprobado en todo momento que el vehículo esté en movimiento.
- id: 302
  category: safe_driving_rules
  question: Al conducir de noche, ¿cuándo debe usar las luces bajas en lugar de las
    luces altas?
  choices:
    A: Al conducir por carreteras desconocidas
    B: Al conducir con niebla, lluvia o nieve
    C: Cuando no hay vehículos en sentido contrario
    D: Al conducir por carreteras rurales
  answer: B
  explanation: Debe usar las luces bajas cuando siga a otro vehículo y en condiciones
    de niebla, lluvia o nieve. La luz de las luces altas puede causar deslumbramiento
    en estas condiciones.
- id: 303
  category: safe_driving_rules
  question: ¿A qué distancia debe atenuar sus faros al acercarse a un vehículo que
    viene en sentido contrario por la noche?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Debe atenuar sus luces siempre que se encuentre a menos de 500 pies
    de los vehículos que vienen en sentido contrario, y a menos de 300 pies de cualquier
    vehículo al que esté siguiendo.
- id: 304
  category: defensive_driving
  question: ¿Cuánto debe aumentar su distancia de seguimiento al conducir por carreteras
    desconocidas por la noche?
  choices:
    A: Añadir al menos un segundo adicional
    B: Añadir al menos dos segundos adicionales
    C: Añadir al menos tres segundos adicionales
    D: Añadir al menos cuatro segundos adicionales
  answer: B
  explanation: Debe aumentar su distancia de seguimiento añadiendo al menos un segundo
    adicional para las condiciones de conducción nocturna y al menos dos segundos
    adicionales para la conducción por carreteras desconocidas por la noche.
- id: 305
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos tiene el derecho de paso sobre un cortejo
    fúnebre en una intersección?
  choices:
    A: Un autobús de transporte público
    B: Un camión de reparto comercial
    C: Un tren o locomotora
    D: Un vehículo que gira a la derecha en rojo
  answer: C
  explanation: Un cortejo fúnebre tiene el derecho de paso en una intersección. Las
    únicas excepciones son cuando el derecho de paso es requerido por un vehículo
    de emergencia, cuando lo indique un oficial de policía/seguridad, o cuando el
    vehículo es un tren o locomotora.
- id: 306
  category: penalties_and_points
  question: ¿Cuál es la posible sanción por violar las leyes relativas a los cortejos
    fúnebres en Kentucky?
  choices:
    A: Una multa de $50
    B: Una multa de $100 o 30 días de cárcel
    C: Una multa de $250 o 90 días de cárcel
    D: Una multa de $500 y suspensión de la licencia
  answer: C
  explanation: Si viola la ley de cortejos fúnebres, puede recibir una multa de $250
    o 90 días de cárcel.
- id: 307
  category: penalties_and_points
  question: ¿Bajo qué condiciones se duplican las multas en una zona de obras viales
    en Kentucky?
  choices:
    A: Solo cuando hay trabajadores presentes, independientemente de la señalización
    B: Cuando se exhiben señales que informan a los conductores de multas dobles y
      hay al menos un trabajador auténtico presente
    C: En todo momento dentro de la zona de obras designada
    D: Solo durante las horas de construcción nocturna
  answer: B
  explanation: La ley de Kentucky permite que las multas se dupliquen en una zona
    de obras viales cuando se exhiben señales que informan a los conductores que las
    multas son dobles en ella y, además, debe haber al menos un trabajador auténtico
    presente.
- id: 308
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales de las zonas de obras?
  choices:
    A: Fondo amarillo con letras negras
    B: Fondo naranja con letras negras
    C: Fondo blanco con letras rojas
    D: Fondo verde con letras blancas
  answer: B
  explanation: Las señales de las zonas de obras tienen un fondo naranja y letras
    o símbolos negros.
- id: 309
  category: defensive_driving
  question: ¿Qué debe hacer para evitar quedar cegado momentáneamente si un vehículo
    que viene en sentido contrario tiene las luces altas encendidas?
  choices:
    A: Parpadear sus luces altas repetidamente
    B: Mirar directamente a los faros que se aproximan
    C: Mirar hacia el lado derecho de la carretera
    D: Cerrar los ojos brevemente hasta que el vehículo pase
  answer: C
  explanation: Si un vehículo viene hacia usted con las luces altas encendidas, mire
    hacia el lado derecho de la carretera para evitar distraerse o quedar cegado momentáneamente
    por sus faros.
- id: 310
  category: vehicle_information
  question: ¿Qué equipo de iluminación se requiere al operar un vehículo todoterreno
    (ATV) en una vía pública?
  choices:
    A: Al menos dos faros delanteros y una luz trasera
    B: Al menos un faro delantero y dos luces traseras encendidas en todo momento
    C: Solo una luz estroboscópica amarilla intermitente
    D: Los faros delanteros solo son obligatorios si se conduce de noche
  answer: B
  explanation: Una persona que opere un ATV en una vía pública debe tener al menos
    un faro delantero y dos luces traseras encendidas en todo momento.
- id: 311
  category: signs_and_signals
  question: ¿Qué parte del símbolo de vehículo de movimiento lento es visible durante
    la conducción nocturna?
  choices:
    A: El centro naranja fluorescente
    B: El borde rojo reflectante
    C: La baliza amarilla intermitente
    D: El triángulo negro sólido
  answer: B
  explanation: Durante el día, verá el triángulo naranja fluorescente en el centro
    del símbolo. Durante la conducción nocturna, verá el borde rojo reflectante del
    símbolo.
- id: 312
  category: defensive_driving
  question: ¿Qué debe hacer al conducir por caminos de grava o tierra para manejar
    la tracción reducida?
  choices:
    A: Aumentar su velocidad para mantener el impulso
    B: Reducir su velocidad y aumentar su distancia de seguimiento
    C: Bombear sus frenos continuamente
    D: Conducir más cerca del vehículo de adelante para seguir sus huellas
  answer: B
  explanation: Según el manual, la tracción puede reducirse en caminos de grava o
    tierra. Debe reducir su velocidad, aumentar su distancia de seguimiento y ser
    consciente de que puede patinar al intentar detenerse.
- id: 313
  category: safe_driving_rules
  question: ¿Quién tiene generalmente el derecho de paso al acercarse a un puente
    estrecho o de un solo carril?
  choices:
    A: El vehículo más grande
    B: El vehículo que viaja a una velocidad mayor
    C: El primer conductor en llegar al puente
    D: El vehículo que viaja cuesta arriba
  answer: C
  explanation: Al encontrarse con puentes estrechos y de un solo carril, deben turnarse
    para cruzar; generalmente, el primer conductor en llegar al puente tiene el derecho
    de paso.
- id: 314
  category: defensive_driving
  question: ¿Cómo debe ajustar su conducción al cruzar rejillas de puentes abiertas
    o puentes de acero?
  choices:
    A: Aumentar su velocidad para cruzar rápidamente
    B: Reducir su velocidad y mantener un agarre firme en el volante
    C: Aflojar el agarre del volante para permitir que los neumáticos sigan la rejilla
    D: Aplicar los frenos con firmeza mientras cruza
  answer: B
  explanation: Las rejillas de puentes abiertas o los puentes de acero pueden reducir
    su tracción. Debe reducir su velocidad, aumentar su distancia de seguimiento y
    mantener un agarre firme en el volante.
- id: 315
  category: license_system
  question: ¿Qué tipo de licencia se requiere para operar un autociclo (autocycle)?
  choices:
    A: Una licencia de conducir comercial (CDL)
    B: Una licencia de operador válida
    C: Una licencia o endoso de motocicleta
    D: Un permiso especial para autociclos
  answer: B
  explanation: Un operador de un autociclo (autocycle) no está obligado a obtener
    una licencia o endoso de motocicleta, y puede operar el vehículo si posee una
    licencia de operador válida.
- id: 316
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los requisitos
    de protección para la cabeza para los operadores de autociclos (autocycles)?
  choices:
    A: Deben usar un casco aprobado por el DOT en todo momento
    B: Están exentos de cualquier requisito de protección para la cabeza
    C: Deben usar casco solo si conducen a más de 40 mph
    D: Deben usar casco a menos que el autociclo tenga un techo fijo
  answer: B
  explanation: El manual establece que el operador de un autociclo (autocycle) está
    exento de cualquier requisito de protección para la cabeza.
- id: 317
  category: vehicle_information
  question: ¿Cómo debe distribuirse el peso de la carga al cargar un remolque para
    reducir la posibilidad de balanceo?
  choices:
    A: 50 por ciento en la parte delantera y 50 por ciento en la parte trasera
    B: 40 por ciento en la parte delantera y 60 por ciento en la parte trasera
    C: 60 por ciento en la parte delantera y 40 por ciento en la parte trasera
    D: 100 por ciento distribuido uniformemente en el medio
  answer: C
  explanation: Los remolques deben cargarse con más peso en la parte delantera para
    reducir el balanceo. El sesenta por ciento del peso de la carga de un remolque
    debe ir en la parte delantera (más cerca del vehículo remolcador) y el 40 por
    ciento en la parte trasera.
- id: 318
  category: defensive_driving
  question: Si su remolque comienza a balancearse o dar latigazos mientras conduce,
    ¿cuál es la acción correcta a tomar?
  choices:
    A: Aplicar los frenos con firmeza e inmediatamente
    B: Aumentar su velocidad para enderezar el remolque
    C: Dirigir en línea recta y reducir la velocidad gradualmente sin aplicar los
      frenos
    D: Virar ligeramente en la dirección opuesta al balanceo
  answer: C
  explanation: Si el remolque comienza a balancearse o dar latigazos, dirija en línea
    recta y reduzca la velocidad gradualmente, no aplique los frenos. Nunca aumente
    la velocidad.
- id: 319
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima recomendada para la mayoría de las combinaciones
    de vehículo y remolque?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 70 mph
  answer: B
  explanation: El manual establece que la velocidad máxima recomendada para la mayoría
    de las combinaciones de vehículo y remolque es de 55 mph.
- id: 320
  category: vehicle_information
  question: Al retroceder un remolque, ¿dónde debe colocar la mano en el volante para
    que sea más fácil dirigir el remolque?
  choices:
    A: En la parte superior del volante
    B: En la parte inferior del volante
    C: En el lado izquierdo del volante
    D: En el lado derecho del volante
  answer: B
  explanation: Al retroceder un remolque, vaya despacio y mantenga la mano en la parte
    inferior del volante. Para mover el remolque hacia la izquierda, mueva la mano
    hacia la izquierda; para moverlo hacia la derecha, mueva la mano hacia la derecha.
- id: 321
  category: defensive_driving
  question: ¿Qué debe hacer si su remolque comienza a plegarse (jackknife) mientras
    retrocede?
  choices:
    A: Gire el volante bruscamente hacia la izquierda
    B: Acelere en reversa para superar el plegamiento
    C: Deténgase, avance para enderezarse y comience de nuevo
    D: Aplique el freno de emergencia de inmediato
  answer: C
  explanation: Si el remolque comienza a plegarse (jackknife) al retroceder, debe
    DETENERSE y avanzar para enderezarse, luego comenzar de nuevo.
- id: 322
  category: defensive_driving
  question: Al remolcar un tráiler y acercarse a una pendiente descendente (colina),
    ¿cuándo debe reducir la velocidad?
  choices:
    A: Antes de comenzar a bajar la colina
    B: A mitad de la colina
    C: Al pie de la colina
    D: Debe acelerar para mantener el impulso
  answer: A
  explanation: Al bajar una pendiente mientras remolca un tráiler, debe reducir la
    velocidad ANTES de comenzar a bajar la colina.
- id: 323
  category: sharing_the_road
  question: Si un peatón cruza ilegalmente por el medio de la calle (jaywalking),
    ¿qué debe hacer usted?
  choices:
    A: Toque la bocina y mantenga su velocidad
    B: Desvíese hacia el carril contrario para evitarlo
    C: Deténgase ante él
    D: No tiene que detenerse ante él
  answer: C
  explanation: Incluso si un peatón cruza ilegalmente por el medio de la calle (jaywalking),
    usted debe detenerse ante él.
- id: 324
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los conductores
    de motocicletas en la vía pública?
  choices:
    A: Deben compartir un carril de tráfico con otro vehículo
    B: Tienen derecho a utilizar un carril de tráfico completo
    C: Se les exige conducir por el arcén (hombro) de la carretera
    D: Deben ceder su carril a vehículos de pasajeros más grandes
  answer: B
  explanation: Los conductores de motocicletas tienen derecho a utilizar un carril
    de tráfico completo.
- id: 325
  category: safe_driving_rules
  question: Al conducir de noche, ¿cuándo es apropiado usar las luces altas (high
    beams)?
  choices:
    A: Cuando hay niebla, lluvia o nieve
    B: Cuando sigue de cerca a otro vehículo
    C: Cuando no se aproxima tráfico en sentido contrario
    D: Al conducir en una zona urbana bien iluminada
  answer: C
  explanation: Al conducir de noche, debe usar las luces altas cuando no se aproxime
    tráfico en sentido contrario.
- id: 326
  category: driver_responsibility
  question: Según la página de derechos de autor del manual, ¿qué organización posee
    los derechos de autor de 2022 del manual?
  choices:
    A: National Highway Traffic Safety Administration
    B: American Association of Motor Vehicle Administrators
    C: Virginia Tech Transportation Institute
    D: Department of Transportation
  answer: B
  explanation: 'El texto establece: ''2022 © Copyright Todos los derechos reservados
    American Association of Motor Vehicle Administrators''.'
- id: 327
  category: safe_driving_rules
  question: ¿Cómo se pretende utilizar este manual en relación con el manual oficial
    del conductor del estado?
  choices:
    A: Como un reemplazo completo
    B: Como un suplemento
    C: Como un sustituto legal en los tribunales
    D: Solo como una guía de estudio preliminar
  answer: B
  explanation: 'El texto señala explícitamente: ''Este manual es un suplemento del
    manual del conductor del estado...'''
- id: 328
  category: safe_driving_rules
  question: Según el texto, ¿cuál de los siguientes temas está cubierto por el manual
    del conductor del estado?
  choices:
    A: Estándares de fabricación de vehículos
    B: Reglas de la carretera, señales y semáforos
    C: Programación de sistemas de conducción automatizados
    D: Instalación de dispositivos de posventa
  answer: B
  explanation: El texto indica que el manual del conductor del estado 'cubre las reglas
    de la carretera, señales, semáforos, marcas viales y prácticas de conducción segura'.
- id: 329
  category: vehicle_information
  question: ¿Quién proporcionó los gráficos y las imágenes contenidos en este manual?
  choices:
    A: National Highway Traffic Safety Administration
    B: Virginia Tech Transportation Institute
    C: Motorcycle Safety Foundation y Highway Safety Services, LLC
    D: Department of Transportation
  answer: C
  explanation: 'El texto indica: ''Los gráficos y las imágenes contenidos en este
    manual se proporcionan por cortesía de Motorcycle Safety Foundation y Highway
    Safety Services, LLC''.'
- id: 330
  category: safe_driving_rules
  question: ¿Qué organización publicó las pautas de diciembre de 2016 para dispositivos
    portátiles y de posventa?
  choices:
    A: Virginia Tech Transportation Institute
    B: Highway Safety Services, LLC
    C: National Highway Traffic Safety Administration (NHTSA)
    D: Motorcycle Safety Foundation
  answer: C
  explanation: La bibliografía cita a la 'National Highway Traffic Safety Administration
    (NHTSA), Department of Transportation (DOT). (Diciembre de 2016). Visual-manual
    nhtsa driver distraction guidelines for portable and aftermarket devices'.
- id: 331
  category: safe_driving_rules
  question: ¿En el contexto de las citas del manual, qué significan las siglas NHTSA?
  choices:
    A: Administración Nacional de Seguridad del Tráfico en las Carreteras (National
      Highway Traffic Safety Administration)
    B: Agencia Nacional de Seguridad del Tránsito en Carreteras
    C: Asociación Nacional de Seguridad de Camiones Pesados
    D: Autoridad Nacional de Estándares de Transporte por Carretera
  answer: A
  explanation: El texto enumera explícitamente la 'Administración Nacional de Seguridad
    del Tráfico en las Carreteras (NHTSA)'.
- id: 332
  category: safe_driving_rules
  question: Según las referencias del manual, ¿la NHTSA forma parte de qué departamento
    más grande?
  choices:
    A: Departamento de Vehículos Motorizados (DMV)
    B: Departamento de Transporte (DOT)
    C: Departamento de Seguridad Pública (DPS)
    D: Departamento de Seguridad de Carreteras (DHS)
  answer: B
  explanation: La cita dice 'Administración Nacional de Seguridad del Tráfico en las
    Carreteras (NHTSA), Departamento de Transporte (DOT)'.
- id: 333
  category: defensive_driving
  question: ¿Qué instituto es citado por un estudio de mayo de 2013 que destaca los
    peligros de la conducción distraída?
  choices:
    A: Asociación Americana de Administradores de Vehículos Motorizados (AAMVA)
    B: Highway Safety Services, LLC
    C: Instituto de Transporte de Virginia Tech (Virginia Tech Transportation Institute)
    D: Administración Nacional de Seguridad del Tráfico en las Carreteras (NHTSA)
  answer: C
  explanation: El texto cita al 'Instituto de Transporte de Virginia Tech. (Mayo de
    2013, 2.ª edición). Los resultados del nuevo estudio del VTTI continúan destacando
    los peligros de la conducción distraída'.
- id: 334
  category: defensive_driving
  question: ¿En qué tipo específico de distracción del conductor se centran las directrices
    de la NHTSA de diciembre de 2016 con respecto a los dispositivos portátiles y
    de repuesto?
  choices:
    A: Distracción cognitiva
    B: Distracción auditiva-vocal
    C: Distracción visual-manual
    D: Distracción olfativa
  answer: C
  explanation: La cita se titula 'Directrices de la NHTSA sobre la distracción visual-manual
    del conductor para dispositivos portátiles y de repuesto'.
- id: 335
  category: vehicle_information
  question: ¿Un libro blanco (whitepaper) citado de 2021 aumenta las directrices para
    las pruebas y el despliegue seguros de vehículos equipados con qué tecnología?
  choices:
    A: Sistemas de transmisión manual
    B: Sistemas de conducción automatizada
    C: Sistemas de escape de repuesto
    D: Sistemas de frenado hidráulico
  answer: B
  explanation: El texto hace referencia a un libro blanco que 'aumenta las directrices
    para las pruebas y el despliegue seguros de vehículos equipados con sistemas de
    conducción automatizada'.
- id: 336
  category: driver_responsibility
  question: ¿Dónde tiene su sede la Asociación Americana de Administradores de Vehículos
    Motorizados (AAMVA) según el manual?
  choices:
    A: Washington, D.C.
    B: Arlington, Virginia
    C: Blacksburg, Virginia
    D: Frankfort, Kentucky
  answer: B
  explanation: La información de contacto proporcionada en el texto indica la dirección
    de la Asociación Americana de Administradores de Vehículos Motorizados como 'Arlington,
    Virginia 22203'.
- id: 337
  category: driver_responsibility
  question: ¿Cuál es el número de teléfono de contacto proporcionado para la Asociación
    Americana de Administradores de Vehículos Motorizados?
  choices:
    A: 800.555.1234
    B: 703.522.4200
    C: 202.366.4000
    D: 888.327.4236
  answer: B
  explanation: El texto indica el número de teléfono de la Asociación Americana de
    Administradores de Vehículos Motorizados como '703.522.4200'.
- id: 338
  category: defensive_driving
  question: ¿En qué problema se centra el libro blanco de febrero de 2021 citado en
    el manual para fortalecer la educación, la legislación y la aplicación de la ley?
  choices:
    A: Conducir bajo los efectos del alcohol
    B: Conducción distraída
    C: Exceso de velocidad en zonas escolares
    D: Uso del cinturón de seguridad
  answer: B
  explanation: El libro blanco se titula 'Fortalecimiento de la educación, la legislación
    y la aplicación de la ley sobre la conducción distraída...'
- id: 339
  category: defensive_driving
  question: ¿Qué edición del estudio del Instituto de Transporte de Virginia Tech
    sobre la conducción distraída se cita en el manual?
  choices:
    A: 1.ª edición
    B: 2.ª edición
    C: 3.ª edición
    D: 4.ª edición
  answer: B
  explanation: La cita indica explícitamente '(Mayo de 2013, 2.ª edición)' para el
    estudio del Instituto de Transporte de Virginia Tech.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 340
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de forma segura.
  id: 341
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 342
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de forma
    segura.
  id: 343
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UNA VÍA (ONE WAY) con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 344
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 345
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 346
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 347
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico en ambos sentidos más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona donde está prohibido adelantar.
  id: 348
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 349
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 350
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 351
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que crucen la vía.
  id: 352
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 353
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras "R" es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 354
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
  id: 355
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 356
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 357
