metadata:
  source: Kentucky Driver Manual (drive.ky.gov)
  total_questions: 373
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: Who is listed as the Commissioner of the Kentucky State Police in the
    provided manual text?
  choices:
    A: Phillip Burnett, Jr.
    B: John Beshear
    C: Michael Dossett
    D: Richard Sanders
  answer: A
  explanation: According to the manual's introductory text, Phillip Burnett, Jr. is
    the Commissioner of the Kentucky State Police.
- id: 2
  category: penalties_and_points
  question: According to the Table of Contents, which section covers 'Loss of Driving
    Privileges'?
  choices:
    A: Section One
    B: Section Two
    C: Section Three
    D: Section Four
  answer: A
  explanation: 'The Table of Contents lists ''Loss of Driving Privileges'' under Section
    One: The Driver''s License.'
- id: 3
  category: alcohol_drugs_health
  question: Where would a driver look in the manual to find information about the
    Medical Review Board?
  choices:
    A: Section One
    B: Section Two
    C: Section Five
    D: Section Nine
  answer: B
  explanation: 'According to the Table of Contents, the ''Medical Review Board'' is
    covered in Section Two: General Information.'
- id: 4
  category: alcohol_drugs_health
  question: 'Which of the following topics is covered under Section Three: Be in Shape
    to Drive?'
  choices:
    A: Motor Vehicle Registration
    B: Fatigue
    C: Air Bags
    D: Pavement Markings
  answer: B
  explanation: 'The Table of Contents indicates that ''Fatigue'' is one of the topics
    covered under Section Three: Be in Shape to Drive.'
- id: 5
  category: safe_driving_rules
  question: If you need to learn about Child Passenger Safety Laws, which section
    of the manual should you consult?
  choices:
    A: Section Two
    B: Section Three
    C: Section Four
    D: Section Five
  answer: C
  explanation: 'The Table of Contents lists ''Child Passenger Safety Laws'' under
    Section Four: Before You Drive.'
- id: 6
  category: vehicle_information
  question: What does the acronym ADAS stand for in Section Four of the manual?
  choices:
    A: Automatic Driving and Steering
    B: Advanced Driver Assistance Systems
    C: Adaptive Driving and Safety
    D: Automated Driver Alert Systems
  answer: B
  explanation: Section Four of the Table of Contents lists 'Advanced Driver Assistance
    Systems (ADAS) Safety Features'.
- id: 7
  category: vehicle_information
  question: Which section is titled 'Basic Driving' and covers starting the engine,
    moving, stopping, steering, and backing up?
  choices:
    A: Section Four
    B: Section Five
    C: Section Six
    D: Section Seven
  answer: B
  explanation: The Table of Contents shows that Section Five is titled 'Basic Driving'
    and includes topics like starting the engine, moving, stopping, steering, and
    backing up.
- id: 8
  category: signs_and_signals
  question: Information regarding Pavement Markings and Traffic Signs can be found
    in which section?
  choices:
    A: 'Section Five: Basic Driving'
    B: 'Section Six: Rules of the Road'
    C: 'Section Seven: General Driving'
    D: 'Section Eight: Safe Driving Tips'
  answer: B
  explanation: 'According to the Table of Contents, ''Traffic Signs'' and ''Pavement
    Markings'' are located in Section Six: Rules of the Road.'
- id: 9
  category: sharing_the_road
  question: Under which section are the 'Rules for School Buses' located?
  choices:
    A: Section Four
    B: Section Six
    C: Section Seven
    D: Section Nine
  answer: C
  explanation: 'The Table of Contents places ''Rules for School Buses'' within Section
    Seven: General Driving.'
- id: 10
  category: safe_driving_rules
  question: Section Seven covers 'General Driving.' Which of the following is a topic
    included in this section?
  choices:
    A: Roundabouts and Traffic Circles
    B: Visual Search
    C: Inspecting Your Vehicle
    D: Organ Donation
  answer: A
  explanation: 'The Table of Contents lists ''Roundabouts and Traffic Circles'' as
    a topic under Section Seven: General Driving.'
- id: 11
  category: defensive_driving
  question: 'If a driver wants to read about ''Speed Management'' and ''Stopping Distance,''
    they should look in:'
  choices:
    A: Section Five
    B: Section Six
    C: Section Seven
    D: Section Eight
  answer: D
  explanation: 'According to the Table of Contents, ''Speed Management'' and ''Stopping
    Distance'' are covered in Section Eight: Safe Driving Tips.'
- id: 12
  category: defensive_driving
  question: What is the title of Section Nine?
  choices:
    A: Rules of the Road
    B: Safe Driving Tips
    C: Emergency Situations and Avoiding Crashes
    D: General Driving
  answer: C
  explanation: The Table of Contents titles Section Nine as 'Emergency Situations
    and Avoiding Crashes'.
- id: 13
  category: driver_responsibility
  question: Which section contains information on 'Organ Donation'?
  choices:
    A: Section One
    B: Section Two
    C: Section Three
    D: Section Ten
  answer: B
  explanation: 'The Table of Contents lists ''Organ Donation'' as a topic in Section
    Two: General Information.'
- id: 14
  category: driver_responsibility
  question: '''Emotions, Aggressive Driving and Road Rage'' is a subsection of which
    main section?'
  choices:
    A: 'Section Three: Be in Shape to Drive'
    B: 'Section Six: Rules of the Road'
    C: 'Section Eight: Safe Driving Tips'
    D: 'Section Nine: Emergency Situations'
  answer: A
  explanation: 'According to the Table of Contents, ''Emotions, Aggressive Driving
    and Road Rage'' is found under Section Three: Be in Shape to Drive.'
- id: 15
  category: driver_testing
  question: Where can you find information on 'Test Scheduling' and 'Testing Requirements
    and Preparation'?
  choices:
    A: Section One
    B: Section Two
    C: Section Four
    D: Section Five
  answer: A
  explanation: 'The Table of Contents shows that ''Testing Requirements and Preparation''
    and ''Test Scheduling'' are located in Section One: The Driver''s License.'
- id: 16
  category: license_system
  question: What is the minimum age requirement to apply for a Class D Operator's
    License in Kentucky?
  choices:
    A: 15 years of age
    B: 16 years of age
    C: 17 years of age
    D: 18 years of age
  answer: B
  explanation: According to the manual, applicants for a Class D Operator's License
    must be a Kentucky resident and be at least 16 years of age.
- id: 17
  category: license_system
  question: Which class of Kentucky driver's license is restricted to mopeds only?
  choices:
    A: Class C
    B: Class D
    C: Class E
    D: Class M
  answer: C
  explanation: The manual states that the Class E license is for mopeds only.
- id: 18
  category: license_system
  question: A Commercial Driver's License (CDL) is NOT required for a farmer driving
    an agricultural vehicle within what distance from its point of origin?
  choices:
    A: 50 miles
    B: 100 miles
    C: 150 miles
    D: 200 miles
  answer: C
  explanation: A CDL is not required for a driver of vehicles used exclusively in
    farm-to-market agricultural transportation, owned and operated by the farmer or
    his employees, and used within 150 miles of the point of origin.
- id: 19
  category: license_system
  question: A Class C Commercial Driver's License is required for a single vehicle
    under 26,001 pounds if it is placarded for hazardous materials or designed to
    transport more than how many people (including the driver)?
  choices:
    A: 10 people
    B: 12 people
    C: 15 people
    D: 16 people
  answer: D
  explanation: A Class C CDL is required for any single vehicle with a gross combination
    weight rating of less than 26,001 pounds that is placarded for hazardous materials
    or designed to transport more than sixteen (16) people including the vehicle driver.
- id: 20
  category: license_system
  question: What is required for a Class D license applicant who is under the age
    of 18?
  choices:
    A: They must complete a defensive driving course.
    B: A parent or legal guardian must sign the application.
    C: They must have a co-signer for vehicle insurance.
    D: They must pass a physical medical exam.
  answer: B
  explanation: The manual specifies that if the applicant is under the age of 18,
    a parent or legal guardian must sign the application.
- id: 21
  category: driver_testing
  question: Which tests must all first-time applicants pass to obtain a Class D Operator's
    License?
  choices:
    A: Vision, knowledge, and skills tests
    B: Vision and knowledge tests only
    C: Knowledge and skills tests only
    D: Vision, medical, and skills tests
  answer: A
  explanation: All first-time applicants for a Class D Operator's License must pass
    the vision, knowledge, and skills tests.
- id: 22
  category: driver_testing
  question: Which of the following is NOT required to obtain a Class E Moped license?
  choices:
    A: A vision test
    B: A general knowledge test
    C: A skills test
    D: Being at least 16 years old
  answer: C
  explanation: Applicants are required to pass the general knowledge and vision tests
    to be issued a moped license. However, a skills test and permit are not required.
- id: 23
  category: vehicle_information
  question: 'By definition in Kentucky, a moped is a motorized bicycle capable of
    a maximum speed of no more than:'
  choices:
    A: 20 miles per hour
    B: 25 miles per hour
    C: 30 miles per hour
    D: 35 miles per hour
  answer: C
  explanation: A moped is defined as a motorized bicycle capable of a maximum speed
    of not more than thirty (30) miles per hour.
- id: 24
  category: vehicle_information
  question: 'To be classified as a moped, the vehicle must have a cylinder capacity
    not exceeding:'
  choices:
    A: 30 cubic centimeters
    B: 50 cubic centimeters
    C: 100 cubic centimeters
    D: 150 cubic centimeters
  answer: B
  explanation: The definition of a moped includes having a cylinder capacity not exceeding
    fifty (50) cubic centimeters.
- id: 25
  category: license_system
  question: According to the Kentucky driver's manual, which of the following individuals
    is NOT eligible for a driver's license?
  choices:
    A: A person who wears corrective lenses.
    B: A person who is unable to understand highway warnings in the English language.
    C: A nonresident working in Kentucky.
    D: A 17-year-old with a parent's signature.
  answer: B
  explanation: The manual lists several conditions under which a person is not eligible
    for a license, including any person who is unable to understand highway warnings
    or directions in the English language.
- id: 26
  category: license_system
  question: Which of the following drivers is exempt from needing a Commercial Driver's
    License (CDL)?
  choices:
    A: A volunteer church bus driver.
    B: A public-school bus driver.
    C: An operator of a recreational vehicle not used for commerce.
    D: A mechanic test-driving a commercial truck.
  answer: C
  explanation: A Commercial Driver's License is not required for operators of recreational
    vehicles not for commerce. Volunteer drivers, school bus drivers, and mechanics
    operating commercial vehicles do require a CDL.
- id: 27
  category: license_system
  question: 'A Class A Commercial Driver''s License is required for a combination
    of vehicles with a gross combination weight rating of 26,001 pounds or more, provided
    the towed vehicle exceeds:'
  choices:
    A: 5,000 pounds
    B: 8,000 pounds
    C: 10,000 pounds
    D: 15,000 pounds
  answer: C
  explanation: A Class A CDL is for any combination of vehicles with a gross combination
    weight rating of 26,001 pounds or more provided that the gross vehicle weight
    rating of the towed vehicle is in excess of 10,000 pounds.
- id: 28
  category: license_system
  question: Who among the following is NOT required to obtain a Kentucky driver's
    license to drive in the state?
  choices:
    A: A new resident who recently moved to Kentucky permanently.
    B: An active duty military member holding a valid license from another state.
    C: A 16-year-old driving a family car to school.
    D: A commercial driver transporting goods within the state.
  answer: B
  explanation: A Kentucky driver's license is not required for members of the military
    on active duty and their dependents who hold a valid license from another state.
- id: 29
  category: license_system
  question: Do Commercial Driver's License (CDL) requirements apply to volunteer drivers,
    such as church bus drivers?
  choices:
    A: No, volunteer drivers are always exempt from CDL requirements.
    B: Yes, CDL requirements apply to volunteer drivers operating commercial motor
      vehicles.
    C: Only if they are driving across state lines.
    D: Only if they are paid a stipend for their time.
  answer: B
  explanation: The manual explicitly states that CDL requirements apply to volunteer
    drivers, such as church bus drivers, private and public-school bus drivers, mechanics,
    salesmen, etc.
- id: 30
  category: license_system
  question: Which class of Kentucky driver's license is required specifically to operate
    a motorcycle?
  choices:
    A: Class B
    B: Class C
    C: Class D
    D: Class M
  answer: D
  explanation: According to the manual, the Class M license is for motorcycles.
- id: 31
  category: driver_testing
  question: Which tests are required to obtain a moped license in Kentucky?
  choices:
    A: Vision, general knowledge, and skills tests
    B: Vision and general knowledge tests only
    C: General knowledge and skills tests only
    D: Vision and skills tests only
  answer: B
  explanation: According to the manual, applicants are required to pass the general
    knowledge and vision tests to be issued a moped license. A skills test and permit
    are not required.
- id: 32
  category: safe_driving_rules
  question: Where is it illegal to operate a moped?
  choices:
    A: On any public road with a speed limit over 35 mph
    B: On limited-access highways where the minimum speed is more than 30 mph
    C: In residential areas with a speed limit under 25 mph
    D: On any state highway or interstate
  answer: B
  explanation: The manual states that mopeds CANNOT be operated on limited-access
    highways where the minimum speed is more than thirty (30) miles per hour.
- id: 33
  category: vehicle_information
  question: What safety equipment is legally required for moped operators in Kentucky?
  choices:
    A: A helmet and eye-protection
    B: Only a helmet
    C: Only eye-protection
    D: Neither a helmet nor eye-protection is legally required
  answer: D
  explanation: The manual notes that moped operators are not required to wear helmets
    or eye-protection devices, although they are strongly recommended.
- id: 34
  category: vehicle_information
  question: Which of the following is excluded from the legal definition of a motorcycle?
  choices:
    A: A motor-driven vehicle with two wheels
    B: A motor-driven vehicle with a saddle
    C: A vehicle where the operator rides in an enclosed cab
    D: A motor-driven vehicle with three wheels
  answer: C
  explanation: A motorcycle is defined as a motor-driven vehicle with a seat or saddle
    and no more than three wheels, specifically excluding mopeds, tractors, and vehicles
    on which the operator and passengers ride in an enclosed cab.
- id: 35
  category: safe_driving_rules
  question: Where can a driver legally operate a minibike or motor scooter without
    an operator's license?
  choices:
    A: On residential streets
    B: On private property
    C: In public parks
    D: On roads with a speed limit under 25 mph
  answer: B
  explanation: The manual states that the only place a driver may legally ride or
    operate small vehicles like minibikes or motor scooters without an operator's
    license and safety equipment is on private property.
- id: 36
  category: license_system
  question: Who is eligible to apply for a motorcycle instruction permit without needing
    a parent or guardian's signature?
  choices:
    A: Anyone who is at least 16 years old
    B: Anyone who possesses a moped license
    C: A person who is at least 18 years of age
    D: A person who is at least 21 years of age
  answer: C
  explanation: A person who is at least eighteen (18) years of age may apply for an
    instruction permit to operate a motorcycle. If the person is under 18, the application
    must be signed by a parent or legal guardian.
- id: 37
  category: driver_testing
  question: How can an applicant for a motorcycle license be exempted from the written
    and skills tests?
  choices:
    A: By holding a motorcycle permit for over a year
    B: By successfully completing an approved RideSmartKY rider training course
    C: By having a valid out-of-state driver's license
    D: By passing a vision test with 20/20 vision
  answer: B
  explanation: Applicants for a motorcycle license will be exempted from the licensing
    written and skills tests if they present satisfactory evidence of successful completion
    of an approved rider training course (RideSmartKY).
- id: 38
  category: license_system
  question: What is the minimum age required to apply for a Kentucky Operator's, Motorcycle,
    or Moped License?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: To be eligible to apply for a Kentucky Operator's License, Motorcycle
    License, or Moped License, you must have reached your sixteenth birthday.
- id: 39
  category: driver_responsibility
  question: What happens if a parent or legal guardian withdraws their responsibility
    for a minor driver?
  choices:
    A: The minor must pay a fine to keep driving
    B: The minor's permit or license will be canceled
    C: The minor is restricted to driving only during daylight hours
    D: The minor must retake the written and vision tests
  answer: B
  explanation: A parent or legal guardian has the right to withdraw their responsibility
    at any time. Once the withdrawal form is received and entered, the minor's permit
    or license will be canceled until another application is signed.
- id: 40
  category: license_system
  question: What are the three phases of licensing for drivers under 18 in the Graduated
    Driver License Program?
  choices:
    A: Learner's Permit, Restricted License, Commercial License
    B: Instruction Permit, Provisional License, Intermediate License
    C: Learner's Permit, Intermediate License, Full Unrestricted License
    D: Moped License, Learner's Permit, Full Unrestricted License
  answer: C
  explanation: 'Drivers under 18 must go through three phases of licensing: a Learner''s
    Permit, an Intermediate License, and then a Full Unrestricted License.'
- id: 41
  category: license_system
  question: When applying for a permit, what document must be issued by the applicant's
    school?
  choices:
    A: A certified copy of their transcript
    B: A School Compliance Verification Form
    C: A letter of recommendation from the principal
    D: A student ID card
  answer: B
  explanation: When applying for a permit, applicants must bring a School Compliance
    Verification Form issued by their school in accordance with the No Pass/No Drive
    Law.
- id: 42
  category: license_system
  question: How long must a permit holder between the ages of 16 and 20 hold their
    driving permit before they can take the road test?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 365 days
  answer: C
  explanation: Permit holders ages 16 to 20 must hold the driving permit for a minimum
    of 180 days.
- id: 43
  category: driver_testing
  question: How many total hours of practice driving must be logged to be eligible
    for an intermediate license?
  choices:
    A: 40 hours
    B: 50 hours
    C: 60 hours
    D: 70 hours
  answer: C
  explanation: To be eligible for an intermediate license, a driver must complete
    a Practice Driving Log with a minimum of 60 hours of practice driving.
- id: 44
  category: driver_testing
  question: Of the required practice driving hours for an intermediate license, how
    many must be completed at night?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: Out of the 60 total hours of practice driving required for an intermediate
    license, 10 hours must be completed at night.
- id: 45
  category: license_system
  question: Which of the following is true regarding the documents required to apply
    for a permit?
  choices:
    A: Photocopies are accepted if notarized
    B: Photocopies are accepted for the Social Security Card only
    C: Photocopies will not be accepted for any required documents
    D: Digital photos on a smartphone are accepted in place of original documents
  answer: C
  explanation: 'The manual explicitly states in all capital letters: ''PHOTOCOPIES
    WILL NOT BE ACCEPTED FOR ANY REQUIRED DOCUMENTS''.'
- id: 46
  category: safe_driving_rules
  question: What is the passenger restriction for a permit holder?
  choices:
    A: No passengers are allowed at any time.
    B: Limited to 1 unrelated person under 20 years of age.
    C: Limited to 2 unrelated persons under 18 years of age.
    D: Limited to family members only.
  answer: B
  explanation: The manual states that the passenger restriction for permit holders
    is limited to 1 (one) unrelated person under 20 years of age.
- id: 47
  category: safe_driving_rules
  question: Between what hours are permit holders under the age of 18 generally prohibited
    from driving?
  choices:
    A: 10:00 p.m. and 5:00 a.m.
    B: 11:00 p.m. and 6:00 a.m.
    C: Midnight and 6:00 a.m.
    D: Midnight and 5:00 a.m.
  answer: C
  explanation: Permit holders under the age of 18 may not drive between the hours
    of midnight and 6:00 a.m. unless the person can demonstrate good cause for driving.
- id: 48
  category: alcohol_drugs_health
  question: What is the Blood Alcohol Concentration (BAC) limit defined as 'Zero Alcohol
    Tolerance' for drivers under 21 in Kentucky?
  choices:
    A: '.00'
    B: '.02'
    C: '.04'
    D: '.08'
  answer: B
  explanation: All drivers under 21 are subject to 'Zero Alcohol Tolerance', which
    is defined as a .02 Blood Alcohol Concentration.
- id: 49
  category: penalties_and_points
  question: What happens if a permit holder under the age of 18 commits a moving violation?
  choices:
    A: Their permit is permanently revoked.
    B: They must pay a $500 fine and retake the written test.
    C: An additional minimum of 180 days is added before they can apply for an intermediate
      license.
    D: They must complete an additional 60 hours of practice driving.
  answer: C
  explanation: If a violation occurs, it will add an additional minimum of 180 days
    from the date of the violation before the driver may apply for an intermediate
    license.
- id: 50
  category: penalties_and_points
  question: At how many accumulated points may a driver under the age of 18 have their
    driving privilege suspended?
  choices:
    A: More than 3 points
    B: More than 6 points
    C: More than 9 points
    D: More than 12 points
  answer: B
  explanation: A driver under the age of 18 who accumulates more than six points may
    have their driving privilege suspended.
- id: 51
  category: driver_testing
  question: If an applicant fails the road skills test, how long must they wait before
    attempting the test again?
  choices:
    A: At least 24 hours
    B: At least 3 days
    C: At least one week
    D: At least 30 days
  answer: C
  explanation: If you fail the road skills test, you must wait at least one week from
    the date of the failure before attempting the test again.
- id: 52
  category: license_system
  question: What happens immediately after a driver successfully passes the road test
    for their intermediate license?
  choices:
    A: They are mailed a new plastic license card the next day.
    B: The examiner places an 'Intermediate License' sticker on the driver's permit.
    C: They must surrender their permit and drive without a physical license for 7
      days.
    D: They are issued a full unrestricted license on the spot.
  answer: B
  explanation: After successfully completing the road test, the Kentucky State Police
    examiner will place an 'Intermediate License' sticker on the driver's permit.
- id: 53
  category: driver_testing
  question: Which of the following is NOT an acceptable form of proof of liability
    insurance for the road test?
  choices:
    A: A proof-of-insurance card furnished by the insurance company
    B: A current insurance policy for that vehicle
    C: A verbal confirmation from the vehicle's owner
    D: A binder from an insurance agent in writing
  answer: C
  explanation: Acceptable proofs of insurance include an insurance card, a current
    policy, or a written binder from an agent. Verbal confirmation is not accepted.
- id: 54
  category: license_system
  question: How long is a temporary permit valid for applicants age 18 to 20?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: The manual states that the temporary permit issued to applicants is
    valid for three years and may be renewed.
- id: 55
  category: license_system
  question: If a permit is not renewed within one year of its expiration date, what
    must the applicant do?
  choices:
    A: Pay a late fee of $50
    B: Repeat the written and vision tests
    C: Complete an additional driver education course
    D: Wait 180 days before applying again
  answer: B
  explanation: If the permit is not renewed within one year of the expiration date,
    the written and vision tests must be repeated.
- id: 56
  category: license_system
  question: How many proofs of Kentucky residency are required when applying for a
    REAL ID permit?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: The manual specifies that one proof of applicant's Kentucky residency
    is required, but two (2) are required for a REAL ID.
- id: 57
  category: driver_testing
  question: When arriving for a road test appointment, what is the requirement regarding
    the permit holder's transportation to the test site?
  choices:
    A: They must drive themselves to demonstrate basic competency.
    B: They must be accompanied by a licensed driver at least 21 years old in the
      front passenger seat.
    C: They must be driven by a certified driving instructor.
    D: They must take public transportation to the testing center.
  answer: B
  explanation: Permit holders are required to be accompanied by a person with a valid
    operator's license who is at least 21 years of age occupying the front passenger
    seat. It is unlawful to drive themselves to the appointment without meeting this
    requirement.
- id: 58
  category: license_system
  question: If a young driver chooses to take a private driver training course to
    fulfill their Graduated Licensing education requirement, how many hours of classroom
    training must it include?
  choices:
    A: Two (2) hours
    B: Four (4) hours
    C: Six (6) hours
    D: Eight (8) hours
  answer: B
  explanation: A Private Driver Training course at an approved driver training school
    must include four (4) hours of classroom training.
- id: 59
  category: license_system
  question: How long is a Kentucky instruction permit valid for?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 4 years
  answer: C
  explanation: According to the manual, the temporary permit is valid for three years
    and may be renewed.
- id: 60
  category: driver_testing
  question: How long must an applicant under the age of 21 hold their permit before
    they are eligible to take the road test?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: The manual states that you must hold the permit for 180 days before
    you are eligible to take the road test (prior to the 'Applicants Age 21 and Over'
    section).
- id: 61
  category: safe_driving_rules
  question: When a permit holder is driving, who must accompany them in the front
    passenger seat?
  choices:
    A: Anyone with a valid driver's license.
    B: A licensed driver who is at least 18 years old.
    C: A licensed driver who is at least 21 years old.
    D: A parent or legal guardian only.
  answer: C
  explanation: All permit holders must be accompanied by a person with a valid operator
    license who is 21 years of age or older and always occupying the passenger seat
    beside them.
- id: 62
  category: license_system
  question: Are photocopies of required documents (such as a birth certificate or
    Social Security card) accepted when applying for a permit?
  choices:
    A: Yes, if they are notarized.
    B: Yes, for the Social Security card only.
    C: No, photocopies will not be accepted for any required documents.
    D: Yes, if they are clear and legible.
  answer: C
  explanation: 'The manual explicitly states: ''PHOTOCOPIES WILL NOT BE ACCEPTED FOR
    ANY REQUIRED DOCUMENTS.'''
- id: 63
  category: driver_testing
  question: What is the minimum visual acuity required to pass the initial vision
    screening without needing a referral to a specialist?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/60
  answer: C
  explanation: A minimum visual acuity of 20/40 (corrected or uncorrected) is required
    before the applicant will be allowed to move on to the written test.
- id: 64
  category: driver_testing
  question: 'After being referred to a vision specialist, an applicant is eligible
    to test for an instruction permit if their visual acuity is at least:'
  choices:
    A: 20/40 or better
    B: 20/50 or better
    C: 20/60 or better
    D: 20/70 or better
  answer: C
  explanation: After the referral has been completed, applicants whose visual acuity
    is 20/60 or better shall be eligible to test for an instruction permit or operator’s
    license.
- id: 65
  category: driver_testing
  question: What is the minimum score an applicant must achieve to pass the written
    test?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: C
  explanation: Applicants must make a minimum score of 80% to pass the written test.
- id: 66
  category: driver_testing
  question: If the written test is administered orally to an applicant who cannot
    read English, how must the signs portion of the test be handled?
  choices:
    A: The examiner will describe the signs to the applicant.
    B: The signs portion is waived for oral tests.
    C: The applicant must answer the signs portion from their own knowledge and understanding.
    D: An interpreter is allowed to translate the signs portion.
  answer: C
  explanation: The manual states that for oral tests, 'the signs portion of the test
    must be answered by applicants from their own knowledge and understanding.'
- id: 67
  category: driver_testing
  question: Under what condition is a rental vehicle allowed to be used for the road
    skills test?
  choices:
    A: If the applicant has full coverage insurance.
    B: If the applicant's name appears on the rental contract as an operator.
    C: If the rental company provides a written letter of permission.
    D: Rental vehicles are never allowed for the road test.
  answer: B
  explanation: Rental vehicles are allowed only if the applicant’s name appears on
    the rental contract as an operator of the vehicle.
- id: 68
  category: driver_testing
  question: Why might an examiner reject a vehicle before the road skills test begins?
  choices:
    A: The vehicle does not have a backup camera.
    B: The passenger compartment, seat, and floor area are not clean.
    C: The vehicle is older than 10 years.
    D: The vehicle has a manual transmission.
  answer: B
  explanation: The manual states that the passenger compartment, seat, and floor area
    must be clean or the vehicle may be rejected, as the examiner will occupy the
    passenger side of the front seat.
- id: 69
  category: driver_testing
  question: Are interpreters permitted in the vehicle during the road test?
  choices:
    A: Yes, if they sit in the back seat.
    B: Yes, but only for the vehicle inspection.
    C: No, but they may be present before and after the test.
    D: No, interpreters are strictly prohibited at the testing site.
  answer: C
  explanation: According to the manual, interpreters are not permitted in the vehicle
    during the road test. However, an interpreter may be present both before and after
    the test to assist as needed.
- id: 70
  category: vehicle_information
  question: What are the headlight distance requirements for high and low beams?
  choices:
    A: High beam 500 feet, low beam 200 feet
    B: High beam 350 feet, low beam 100 feet
    C: High beam 300 feet, low beam 150 feet
    D: High beam 400 feet, low beam 50 feet
  answer: B
  explanation: Headlights on high beam must be strong enough to reveal a person 350
    feet ahead, and 100 feet ahead on low beam.
- id: 71
  category: vehicle_information
  question: How far away must your vehicle's red taillight be visible?
  choices:
    A: 100 feet
    B: 350 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: The rear light, or taillight, must be red and must be lighted and placed
    so it can be seen 500 feet behind your vehicle.
- id: 72
  category: driver_testing
  question: What happens if a permit holder drives themselves to the road test appointment
    without a licensed driver who is at least 21 years old in the front seat?
  choices:
    A: They will receive an automatic failure on the road test.
    B: The test will be rescheduled.
    C: They must pay an additional testing fee.
    D: They will be allowed to test but receive a warning.
  answer: B
  explanation: It is unlawful for applicants to drive themselves to their road test
    appointment without a licensed driver who is at least 21 occupying the front passenger
    seat. Violations of this at the test site will cause the test to be rescheduled.
- id: 73
  category: driver_testing
  question: During the road test, how many times can an applicant fail to follow the
    Examiner's instructions before being disqualified?
  choices:
    A: One time
    B: Two times
    C: Three times
    D: Four times
  answer: B
  explanation: Failure to follow the Examiner's instructions two times during the
    test will result in being disqualified.
- id: 74
  category: driver_testing
  question: If you do not pass the road test, how long must you wait before taking
    the test again?
  choices:
    A: At least 24 hours
    B: At least 48 hours
    C: At least one week
    D: At least two weeks
  answer: C
  explanation: Should you not pass the road test, you must wait at least one week
    before taking the test again.
- id: 75
  category: license_system
  question: How many days do persons moving into Kentucky have to obtain a Kentucky
    Driver's License after establishing residence?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Persons moving into Kentucky must obtain a Kentucky Driver's License
    within 30 days of establishing residence.
- id: 76
  category: license_system
  question: If you are transferring an out-of-state license to Kentucky and it has
    been expired for more than one year, what tests are you required to take?
  choices:
    A: Only the written exam
    B: Only the road test
    C: Both the written and eye exams
    D: The written, eye, and road exams
  answer: C
  explanation: If the license has been expired for more than one (1) year at the time
    of transfer, you will be required to take both the written and eye exams before
    being issued a Kentucky operator's permit or license.
- id: 77
  category: vehicle_information
  question: What is the requirement for mirrors on a motor vehicle?
  choices:
    A: One mirror on the left side and one inside the center or on the right side.
    B: One mirror on the left side and one on the right side.
    C: Only one rearview mirror inside the center of the vehicle.
    D: 'Three mirrors: left, right, and center.'
  answer: A
  explanation: A vehicle must be equipped with one mirror mounted on the left side
    of the vehicle, and one mirror mounted either inside the vehicle approximately
    in the center or on the right side of the vehicle.
- id: 78
  category: vehicle_information
  question: According to Kentucky law, who must wear a properly adjusted and fastened
    seat belt in a vehicle manufactured after 1981?
  choices:
    A: Only the driver
    B: The driver and front-seat passengers
    C: The driver and all passengers
    D: Passengers under the age of 18
  answer: C
  explanation: A person shall not operate a motor vehicle manufactured after 1981
    on the public roadways unless the driver and all passengers are wearing a properly
    adjusted and fastened seat belt.
- id: 79
  category: driver_testing
  question: Which of the following will result in an automatic failure during the
    road test?
  choices:
    A: Forgetting to use the emergency brake when parking
    B: Any collision, traffic violation, or dangerous act
    C: Stalling a manual transmission vehicle once
    D: Asking the examiner to repeat an instruction
  answer: B
  explanation: Any collision, traffic violation, or dangerous act may result in automatic
    failure, and the test will not be completed.
- id: 80
  category: vehicle_information
  question: What is the only acceptable sun screening material allowed on a vehicle's
    windshield?
  choices:
    A: Light tinting over the entire windshield
    B: Sun screening material along a strip at the top of the windshield
    C: Removable sun shades while driving
    D: Reflective tinting on the bottom half of the windshield
  answer: B
  explanation: It is unlawful to operate a motor vehicle with any sign, sun screening
    material, product or covering on the windshield. Only certificates or papers required
    by law and sun screening material along a strip at the top of the windshield are
    acceptable.
- id: 81
  category: driver_testing
  question: What documents will the examiner review first during the vehicle inspection
    before the road test?
  choices:
    A: The applicant's birth certificate and Social Security card
    B: The vehicle registration and insurance documents
    C: The applicant's driving log and permit
    D: The vehicle's maintenance records
  answer: B
  explanation: For the vehicle inspection, the examiner will first review the vehicle
    registration and insurance documents.
- id: 82
  category: driver_testing
  question: How will the applicant's road test score be presented on the score sheet
    at the completion of the test?
  choices:
    A: As a percentage out of 100
    B: As a letter grade from A to F
    C: By indicating whether they passed or failed, with no numerical score
    D: As a numerical score out of 50 points
  answer: C
  explanation: The applicant will be given a score sheet at the completion of the
    test, indicating whether he or she passed or failed. There will not be a numerical
    score on the score sheet.
- id: 83
  category: license_system
  question: What is the minimum age required to transfer an out-of-state driving permit
    or license to Kentucky?
  choices:
    A: 15 years of age
    B: 16 years of age
    C: 17 years of age
    D: 18 years of age
  answer: B
  explanation: You must be at least 16 years of age to transfer a driving permit or
    license to Kentucky.
- id: 84
  category: license_system
  question: What form must an applicant under age 18 present when transferring an
    out-of-state permit to Kentucky?
  choices:
    A: Driver Education Completion Certificate
    B: School Compliance Verification Form
    C: Parent/Guardian Consent Form
    D: Out-of-State Driving Record
  answer: B
  explanation: According to the manual, if under age 18, you must present a School
    Compliance Verification Form signed by the out-of-state school to comply with
    the No Pass/No Drive Law.
- id: 85
  category: license_system
  question: What must an out-of-state college student carry in their immediate possession
    while driving in Kentucky to avoid transferring their license?
  choices:
    A: A letter from their academic advisor
    B: A Kentucky temporary driving permit
    C: A student identification card from their Kentucky college
    D: Their birth certificate
  answer: C
  explanation: A college student may drive on a valid out-of-state license if they
    have a student identification card from their Kentucky university, college, or
    technical college in their immediate possession when driving.
- id: 86
  category: license_system
  question: How long does a returning military member have to renew an expired Kentucky
    driver's license without having to take a written or road test?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: If a Kentucky resident serving in the U.S. military allows their license
    to expire, they are permitted to renew it without a written or road test within
    90 days of returning to the Commonwealth.
- id: 87
  category: license_system
  question: When does a Kentucky driver's license expire if the driver is under 21
    years of age?
  choices:
    A: On their 21st birthday
    B: 31 days after their 21st birthday
    C: 60 days after their 21st birthday
    D: 90 days after their 21st birthday
  answer: D
  explanation: If the driver is under age 21, the license expires 90 days after the
    driver's 21st birthday.
- id: 88
  category: license_system
  question: For drivers aged 21 and older, when does their Kentucky driver's license
    expire?
  choices:
    A: On their birthday
    B: 10 days after their birthday
    C: 31 days after their birthday
    D: 90 days after their birthday
  answer: C
  explanation: For drivers age 21 and older, the license expires 31 days after the
    driver's birthday.
- id: 89
  category: driver_testing
  question: What is required if a driver's credential has been expired for more than
    5 years?
  choices:
    A: They must pay a late fee but no testing is required
    B: They must take only a vision test
    C: They must start over as a new driver
    D: They must complete a defensive driving course
  answer: C
  explanation: Any driver whose credential is expired more than 5 years must start
    over as a new driver.
- id: 90
  category: driver_responsibility
  question: If you change your name or address, within how many days must you obtain
    a duplicate driver's license?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: A
  explanation: If you change your address or name for any reason, you must obtain
    a duplicate license within 10 days.
- id: 91
  category: license_system
  question: Which of the following documents is NOT acceptable as proof of a name
    change when updating your driver's license?
  choices:
    A: Marriage License
    B: Divorce Decree
    C: Social Security card
    D: Name Change Court Order
  answer: C
  explanation: A Social Security card is not acceptable as proof of name change, though
    you must provide proof of a new Social Security card with your new name to show
    you updated it with the SSA.
- id: 92
  category: penalties_and_points
  question: Your driver's license may be suspended or revoked if you receive how many
    reckless driving convictions within a 12-month period?
  choices:
    A: One (1)
    B: Two (2)
    C: Three (3)
    D: Four (4)
  answer: C
  explanation: Your driver's license may be suspended or revoked for reckless driving
    if you have three (3) convictions within twelve (12) months.
- id: 93
  category: penalties_and_points
  question: Which of the following offenses can result in the suspension or revocation
    of your Kentucky driver's license?
  choices:
    A: A single parking ticket
    B: Theft of gasoline
    C: Driving 5 mph over the speed limit on an interstate
    D: Having a loud exhaust system
  answer: B
  explanation: The manual lists 'Theft of gasoline' as one of the reasons your driver's
    license may be suspended or revoked.
- id: 94
  category: driver_testing
  question: What tests are required for a permanent resident who holds an International
    Driver Permit from a Foreign License Reciprocity Country?
  choices:
    A: Only a vision test
    B: Written knowledge test and vision test
    C: Written knowledge test, vision test, and road test
    D: No testing is required
  answer: B
  explanation: A permanent resident who holds an International Driver Permit from
    a Foreign License Reciprocity Country will be required to successfully pass the
    written knowledge drivers test and vision test.
- id: 95
  category: license_system
  question: For how many years is a standard Kentucky operator's license valid?
  choices:
    A: 2 or 4 years
    B: 3 or 5 years
    C: 4 or 8 years
    D: 5 or 10 years
  answer: C
  explanation: A Kentucky operator's license is valid for four (4) years or eight
    (8) years.
- id: 96
  category: driver_responsibility
  question: How can a driver voluntarily surrender their Kentucky driver's license?
  choices:
    A: By mailing it to the local police department
    B: By completing a form and submitting it with the license to a clerk at a KYTC
      Driver Licensing Regional Office
    C: By cutting it in half and throwing it away
    D: By notifying the DMV online without returning the physical card
  answer: B
  explanation: According to the manual, a driver may voluntarily surrender their license
    by completing the appropriate form at any KYTC Driver Licensing Regional Office
    and submitting it along with the license to the clerk.
- id: 97
  category: penalties_and_points
  question: If a person fails to satisfy a judgment rendered against them for damages
    resulting from a motor vehicle operation within 60 days, what is the penalty?
  choices:
    A: A $500 fine
    B: Mandatory attendance at State Traffic School
    C: Their driving privilege will be suspended indefinitely or until the judgment
      is satisfied
    D: 12 points will be added to their driving record
  answer: C
  explanation: The manual states that failing to satisfy a judgment for damages within
    60 days will result in the driving privilege being suspended indefinitely or until
    the judgment has been satisfied.
- id: 98
  category: penalties_and_points
  question: How long do points assessed under the Kentucky point system remain valid
    before they expire?
  choices:
    A: One year from the date of conviction
    B: Two years from the date of conviction
    C: Five years from the date of conviction
    D: They never expire
  answer: B
  explanation: The manual states that points assessed under this system expire two
    (2) years from the date of conviction.
- id: 99
  category: penalties_and_points
  question: Even though points expire after two years, how long does the conviction
    entry remain part of a driver's record?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 7 years
  answer: C
  explanation: According to the manual, the conviction entry remains part of the driver's
    record for a period of five (5) years from the conviction date.
- id: 100
  category: penalties_and_points
  question: What is the penalty for failing to appear for a hearing after accumulating
    twelve points for the first time?
  choices:
    A: A driving suspension for a period of six months
    B: A driving suspension for one year
    C: Immediate revocation of the vehicle's registration
    D: A fine of up to $1,000
  answer: A
  explanation: Failure to appear for the hearing results in a driving suspension for
    a period of six (6) months for the first such accumulation of twelve (12) points.
- id: 101
  category: driver_responsibility
  question: Which of the following drivers is eligible to attend the Kentucky State
    Traffic School?
  choices:
    A: An out-of-state driver
    B: A driver whose license is currently suspended
    C: A driver with a conviction carrying a mandatory license suspension
    D: A driver with a minor traffic violation who has not attended the school in
      the past 12 months
  answer: D
  explanation: A driver can only attend with minor traffic violations and can only
    complete State Traffic School once every twelve (12) months. Suspended, non-licensed,
    and out-of-state drivers are not eligible.
- id: 102
  category: penalties_and_points
  question: What happens if a driver is referred to Kentucky State Traffic School
    by a court but fails to comply with the order to attend?
  choices:
    A: The driver will be fined $500
    B: The driver's driving privileges will be suspended
    C: The driver will receive 12 points on their record
    D: The driver will be required to retake the written knowledge test
  answer: B
  explanation: Once referred to Kentucky State Traffic School, it becomes a court
    order. If the driver does not comply with the court order to attend traffic school,
    it will suspend the driver's driving privileges.
- id: 103
  category: alcohol_drugs_health
  question: 'Before an individual convicted of a DUI can have their driving privileges
    reinstated, they must do all of the following EXCEPT:'
  choices:
    A: Complete a CHR approved alcohol education or treatment program
    B: Pay all mandatory alcohol assessment, education, or treatment fees
    C: Wait for the expiration of the period of license suspension
    D: Retake the driving skills test
  answer: D
  explanation: To get a license reissued after a DUI, an individual needs payment
    of the required fee, a notice of completion from an approved DUI program, and
    the expiration of the period of license suspension. Retaking the driving skills
    test is not mentioned as a requirement.
- id: 104
  category: vehicle_information
  question: If a person purchases a motor vehicle or brings one into Kentucky from
    another state, within how many days must they apply for registration?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: A person who purchases a motor vehicle, or brings a motor vehicle into
    Kentucky from another state must make application for registration within fifteen
    (15) days.
- id: 105
  category: vehicle_information
  question: What is the grace period for renewing your vehicle registration in Kentucky?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: There is no grace period
  answer: D
  explanation: 'The manual explicitly states: "There is no grace period for renewing
    your vehicle registration."'
- id: 106
  category: penalties_and_points
  question: What is a potential penalty for failing to maintain insurance on a registered
    vehicle in Kentucky?
  choices:
    A: A fine of $500.00 to $1,000.00 and up to 90 days in jail
    B: A fine of $100.00 and 3 points on the driver's license
    C: Mandatory attendance at a DUI education program
    D: A warning for the first offense
  answer: A
  explanation: Failure to maintain insurance is a criminal offense. The vehicle owner
    and driver are subject to a fine of $500.00 to $1,000.00, up to 90 days in jail,
    or both, and the vehicle registration shall be revoked.
- id: 107
  category: vehicle_information
  question: What is the minimum liability coverage required for all property damage
    as a result of any one accident in Kentucky?
  choices:
    A: $10,000.00
    B: $25,000.00
    C: $50,000.00
    D: $60,000.00
  answer: B
  explanation: All motor vehicle owners must carry minimum liability coverage, which
    includes $25,000.00 for all property damage as a result of any one accident.
- id: 108
  category: vehicle_information
  question: How must a motor vehicle owner or operator maintain proof of minimum liability
    coverage in the vehicle?
  choices:
    A: Only as a notarized paper document
    B: As a paper insurance card or on a portable electronic device
    C: By keeping the original insurance policy contract in the glovebox
    D: Proof of insurance is not required to be kept in the vehicle
  answer: B
  explanation: Written proof, in the form of an insurance card, can be a paper insurance
    card or a portable electronic device to download the insurance card.
- id: 109
  category: vehicle_information
  question: How can out-of-state college students legally drive in Kentucky using
    their home-state registration and insurance?
  choices:
    A: By registering their vehicle in Kentucky within 15 days
    B: By keeping a current student identification card from a Kentucky college, university,
      or technical college
    C: By paying a special out-of-state student fee to the county clerk
    D: Out-of-state students are not allowed to drive in Kentucky
  answer: B
  explanation: Students can use their home-state registration and insurance to drive
    in Kentucky if they keep a current student identification card from a Kentucky
    college, university, or technical college.
- id: 110
  category: alcohol_drugs_health
  question: How long must a license applicant be free of seizures or blackouts to
    obtain or maintain driving privileges in Kentucky?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: According to the manual, a license applicant or licensee must be free
    of seizures, blackout, loss of conscience, or an altered state of awareness for
    90 days to obtain or maintain driving privileges.
- id: 111
  category: driver_testing
  question: What is the minimum visual acuity required in at least one eye for driving
    in Kentucky?
  choices:
    A: 20/20
    B: 20/40
    C: 20/60
    D: 20/80
  answer: C
  explanation: In Kentucky, visual requirements for driving require an individual
    to have visual acuity of at least 20/60 or better in at least one eye.
- id: 112
  category: driver_testing
  question: Under standard Kentucky vision requirements, what must a driver's horizontal
    field of vision be?
  choices:
    A: At least 25 degrees to both the left and right
    B: At least 35 degrees to both the left and right
    C: At least 50 degrees to both the left and right
    D: At least 120 degrees horizontally
  answer: B
  explanation: The manual states that the driver's horizontal field of vision must
    be at least 35 degrees to both the left and the right.
- id: 113
  category: license_system
  question: Which agency administers the Kentucky Bioptic Driving Program?
  choices:
    A: Kentucky State Police
    B: Medical Review Board
    C: Kentucky Office of Vocational Rehabilitation
    D: Division of Driver Licensing
  answer: C
  explanation: The manual specifies that the Kentucky Bioptic Driving Program is administered
    by the Kentucky Office of Vocational Rehabilitation.
- id: 114
  category: driver_responsibility
  question: How many citizens must name a driver in an affidavit to the Medical Review
    Board to report them as incapable of safely operating a motor vehicle?
  choices:
    A: At least one
    B: At least two
    C: At least three
    D: At least five
  answer: B
  explanation: Drivers may be reported to the Medical Review Board if they have been
    named in an affidavit by at least two citizens as incapable of properly operating
    a motor vehicle due to a physical or mental impairment.
- id: 115
  category: vehicle_information
  question: Motor vehicles are major contributors to which type of pollution that
    causes chronic lung and heart disease?
  choices:
    A: Ground-level ozone
    B: Acid rain
    C: Lead contamination
    D: Stratospheric ozone
  answer: A
  explanation: The manual states that motor vehicles are major contributors to ground
    level ozone, which contributes to health problems such as chronic lung and heart
    disease, allergies, and asthma.
- id: 116
  category: safe_driving_rules
  question: Which of the following is a recommended driving habit to help reduce vehicle
    emissions and improve fuel economy?
  choices:
    A: Accelerate quickly from stops
    B: Drive during rush hour
    C: Pace your driving to traffic and signal timing
    D: Brake abruptly when approaching intersections
  answer: C
  explanation: To reduce emissions and improve fuel economy, the manual advises drivers
    to pace their driving to the traffic and traffic signal timing so they can keep
    braking and acceleration at a minimum.
- id: 117
  category: license_system
  question: When can licensed drivers in Kentucky sign up to be an organ donor?
  choices:
    A: Only when they turn 18
    B: Only when receiving a traffic citation
    C: When their initial driver's license is issued or renewed
    D: When they register a new vehicle
  answer: C
  explanation: In Kentucky, licensed drivers can sign up as an organ donor when their
    initial driver's license is issued or when the license is renewed.
- id: 118
  category: safe_driving_rules
  question: What type of corrective lenses should you avoid using when driving at
    night?
  choices:
    A: Bifocal lenses
    B: Dark or tinted lenses
    C: Anti-reflective lenses
