  choices:
    A: 10 and 2 o'clock.
    B: 3 and 9 o'clock.
    C: 12 and 6 o'clock.
    D: 4 and 8 o'clock.
  answer: B
  explanation: Both hands should be placed on the outside of the steering wheel on
    opposite sides, at the 3 and 9 o'clock positions, to maintain control of the vehicle.
- id: 175
  category: safe_driving_rules
  question: Which of the following is a correct technique for gripping the steering
    wheel?
  choices:
    A: Grip the wheel from the inside of the rim.
    B: Use the palms of your hands to turn the wheel.
    C: Keep your thumbs tucked under the steering wheel.
    D: Keep your thumbs up along the face of the steering wheel.
  answer: D
  explanation: Your grip on the steering wheel should be firm but gentle. Use your
    fingers instead of the palms of your hands and keep your thumbs up along the face
    of the steering wheel.
- id: 176
  category: safe_driving_rules
  question: What is the proper body position when safely backing up your vehicle?
  choices:
    A: Both hands at 3 and 9 o'clock, looking only at the backup camera.
    B: Left hand at 12 o'clock, right arm on the back of the seat, looking directly
      through the rear window.
    C: Right hand at 12 o'clock, looking in the rearview mirror.
    D: Both hands at 10 and 2 o'clock, looking over your left shoulder.
  answer: B
  explanation: When backing up, grasp the steering wheel at the 12 o'clock position
    with your left hand. Place your right arm on the back of the seat and look directly
    through the rear window.
- id: 177
  category: safe_driving_rules
  question: If you and another driver arrive at a four-way intersection controlled
    by stop signs at the exact same time, who should yield the right of way?
  choices:
    A: The driver on the left must yield to the driver on the right.
    B: The driver on the right must yield to the driver on the left.
    C: The driver going straight must yield to the turning driver.
    D: The driver in the larger vehicle has the right of way.
  answer: A
  explanation: You should yield the right of way to the driver on your right at a
    four-way intersection controlled by stop signs if both of you arrive at the intersection
    at the same time.
- id: 178
  category: signs_and_signals
  question: What should you do if you approach an intersection where a police officer
    is directing traffic, but the traffic light is red?
  choices:
    A: Stop and wait for the light to turn green.
    B: Do what the police officer instructs you to do.
    C: Treat the intersection as a four-way stop.
    D: Turn right on red if it is clear.
  answer: B
  explanation: Upon approaching an intersection where a police officer is directing
    traffic, do what the officer instructs you to do regardless of traffic-control
    devices or signs.
- id: 179
  category: signs_and_signals
  question: In areas where traffic lights are mounted horizontally, what is the arrangement
    of the colors?
  choices:
    A: Green on the left, yellow in the middle, red on the right.
    B: Red on the left, yellow in the middle, green on the right.
    C: Yellow on the left, red in the middle, green on the right.
    D: Red on the top, yellow in the middle, green on the bottom.
  answer: B
  explanation: In some metropolitan areas, traffic lights are horizontal, instead
    of vertical, and the red light is on the left, the yellow light is in the middle,
    and the green light is on the right.
- id: 180
  category: signs_and_signals
  question: What does a yellow traffic light indicate?
  choices:
    A: You have the right of way to speed up and clear the intersection.
    B: The traffic signal is about to turn red, and you should stop if you can do
      so safely.
    C: You must come to a complete stop immediately, regardless of where you are.
    D: The intersection is clear of all traffic.
  answer: B
  explanation: A yellow light means the traffic signal is about to turn red. Stop
    if you can do so safely.
- id: 181
  category: signs_and_signals
  question: Under what condition is a left turn permitted on a red traffic light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street onto a two-way street.
    C: When turning from a one-way street onto another one-way street.
    D: Left turns on red are never permitted.
  answer: C
  explanation: Left turns on red are permitted only when turning from a one-way street
    onto a one-way street. You must first stop then turn left when the roadway is
    clear.
- id: 182
  category: safe_driving_rules
  question: When making a left turn on a solid green light, who must you yield the
    right of way to?
  choices:
    A: Vehicles behind you.
    B: Drivers in the opposing traffic lane coming from the opposite direction.
    C: Drivers on your right only.
    D: No one, you have the right of way.
  answer: B
  explanation: Left turns on a green light must yield to through traffic coming from
    the opposite direction.
- id: 183
  category: safe_driving_rules
  question: When is a left turn on a red light permitted?
  choices:
    A: Anytime there is no oncoming traffic.
    B: Only when turning from a one-way street onto another one-way street.
    C: Only when turning from a two-way street onto a one-way street.
    D: Left turns on red are never permitted.
  answer: B
  explanation: According to the manual, left turns on red are permitted only when
    turning from a one-way street onto a one-way street, after first stopping and
    ensuring the roadway is clear.
- id: 184
  category: signs_and_signals
  question: What must you do when approaching a railroad crossing with two flashing
    red lights?
  choices:
    A: Slow down and cross the tracks quickly.
    B: Stop and proceed only after the lights stop flashing and no train is approaching.
    C: Yield to trains but do not stop unless a train is visible.
    D: Stop, then proceed cautiously even if the lights are still flashing.
  answer: B
  explanation: Two flashing red lights mark a railroad crossing. You must stop and
    proceed only after the red lights stop flashing and you determine no train is
    approaching.
- id: 185
  category: signs_and_signals
  question: What is the typical shape and color of a warning sign?
  choices:
    A: Square and green with white lettering.
    B: Diamond shaped and yellow with black lettering or symbols.
    C: Rectangular and white with black lettering.
    D: Octagon shaped and red with white lettering.
  answer: B
  explanation: Warning signs are usually yellow with black lettering or symbols and
    are diamond shaped.
- id: 186
  category: defensive_driving
  question: If your vehicle stalls on a railroad crossing, what should you do immediately?
  choices:
    A: Stay in the vehicle and call 911.
    B: Try to restart the vehicle while watching for trains.
    C: Abandon the car and run away from the track in the direction the train is coming.
    D: Abandon the car and run down the track in the same direction the train is traveling.
  answer: C
  explanation: If you get boxed in or stalled on a railroad crossing, abandon your
    car immediately and run away from the railroad track in the direction the train
    is coming to avoid being hit by flying debris.
- id: 187
  category: sharing_the_road
  question: What is the approximate stopping distance for an average freight train
    traveling at 55 miles per hour?
  choices:
    A: 500 feet
    B: Half a mile
    C: A mile or more
    D: Two miles
  answer: C
  explanation: The stopping distance for an average freight train at 55 miles per
    hour may be a mile or more. Trains cannot stop quickly.
- id: 188
  category: penalties_and_points
  question: What is the penalty for speeding in a work zone?
  choices:
    A: Fines are doubled.
    B: Your license is suspended for 30 days.
    C: Fines are tripled.
    D: You receive a mandatory court appearance.
  answer: A
  explanation: The manual states that you should reduce your speed in work zones and
    that fines for speeding in a work zone are doubled.
- id: 189
  category: signs_and_signals
  question: What color and shape are work zone signs generally?
  choices:
    A: Green and rectangular
    B: Orange and diamond or rectangular shaped
    C: Yellow and round
    D: White and square
  answer: B
  explanation: Work zone signs are generally diamond or rectangular shaped and orange
    with black letters or symbols.
- id: 190
  category: signs_and_signals
  question: What does a yield sign mean?
  choices:
    A: You have the right of way and other traffic must stop.
    B: You must come to a complete stop at all times before proceeding.
    C: You must slow down and allow traffic that has the right of way to cross before
      entering.
    D: You are entering a one-way street.
  answer: C
  explanation: A yield sign is a red and white downward-pointing triangle that means
    you must slow down and allow traffic that has the right of way to cross before
    entering.
- id: 191
  category: safe_driving_rules
  question: What is a Shared Center Lane Left Turn Only lane used for?
  choices:
    A: Passing slow-moving vehicles.
    B: Through traffic during rush hour.
    C: A lane reserved for left turning vehicles from either direction.
    D: Emergency vehicles only.
  answer: C
  explanation: This sign tells you where a lane is reserved for the use of left turning
    vehicles from either direction and is not to be used for through traffic or passing
    other vehicles.
- id: 192
  category: signs_and_signals
  question: Which type of signs give information on intersecting roads, cities, and
    points of interest?
  choices:
    A: Regulatory signs
    B: Warning signs
    C: Guide signs
    D: Work zone signs
  answer: C
  explanation: Guide signs give information on intersecting roads, help direct you
    to cities and towns, and show points of interest along the highway.
- id: 193
  category: safe_driving_rules
  question: When you need to cross railroad tracks, how should you proceed?
  choices:
    A: Stop on the tracks to look both ways.
    B: Look both ways and cross the tracks quickly, without stopping.
    C: Shift gears while crossing the tracks.
    D: Drive slowly across the tracks to avoid damaging your tires.
  answer: B
  explanation: When you need to cross railroad tracks, the manual instructs you to
    look both ways and cross the tracks quickly, without stopping.
- id: 194
  category: signs_and_signals
  question: What do black and white speed limit signs indicate?
  choices:
    A: The minimum speed you must travel.
    B: The recommended speed for hazardous conditions.
    C: The maximum legal speed allowed in ideal conditions.
    D: The speed limit only during daylight hours.
  answer: C
  explanation: Speed Limit Signs are black and white signs that indicate the maximum
    legal speed allowed in ideal conditions.
- id: 195
  category: signs_and_signals
  question: When there is more than one traffic light at an intersection, which one
    should you obey?
  choices:
    A: The one on the far right.
    B: The one that is over your lane.
    C: The largest traffic light.
    D: The one with the green arrow.
  answer: B
  explanation: The manual states that when there is more than one traffic light, you
    must obey the one that is over your lane.
- id: 196
  category: safe_driving_rules
  question: When approaching an intersection with both a stop line and a crosswalk,
    where must you stop?
  choices:
    A: At the crosswalk first
    B: At the stop line first
    C: In the middle of the crosswalk
    D: Just past the stop line
  answer: B
  explanation: According to the manual, if there is a stop line before the crosswalk,
    the stop line must be obeyed first.
- id: 197
  category: signs_and_signals
  question: What type of sign is shaped like a pentagon?
  choices:
    A: Yield sign
    B: Railroad advance warning
    C: School sign
    D: Regulatory sign
  answer: C
  explanation: According to the standard shapes chart in the manual, a pentagon shape
    is used for school signs.
- id: 198
  category: signs_and_signals
  question: 'A round traffic sign is used for:'
  choices:
    A: Yielding right-of-way
    B: Railroad and advance warning
    C: Existing or possible hazards
    D: Guide signs
  answer: B
  explanation: The manual specifies that a round shape is used for railroad and advance
    warning signs.
- id: 199
  category: safe_driving_rules
  question: How far in advance should you signal if you plan to turn at an intersection?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: 'The manual states: ''If you plan to turn at an intersection, signal
    100 feet before the turn.'''
- id: 200
  category: safe_driving_rules
  question: If the driver in front of you is signaling for a turn, when should you
    use your turn signal?
  choices:
    A: Always, to warn drivers behind you
    B: Only if you are also going to turn
    C: Only if you are passing them
    D: Never, it will confuse other drivers
  answer: B
  explanation: 'The manual advises: ''If the driver in front of you is signaling for
    a turn, do not signal unless you are also going to turn.'''
- id: 201
  category: safe_driving_rules
  question: 'When making a right turn, you should:'
  choices:
    A: Swing wide to the left before turning
    B: Turn from the left-most portion of your lane
    C: Avoid swinging wide to the left before making the turn
    D: Accelerate rapidly through the intersection
  answer: C
  explanation: Under the 'Right Turns' section, the manual states to 'Avoid swinging
    wide to the left before making the turn.'
- id: 202
  category: safe_driving_rules
  question: When performing a turnabout, you must make sure your car can be seen for
    at least how far in either direction?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: When preparing for a turnabout, the manual requires you to 'Make sure
    your car can be seen for 500 feet in either direction.'
- id: 203
  category: defensive_driving
  question: Before moving after stopping at an intersection, what is the proper way
    to check for crossing traffic?
  choices:
    A: Look right, then left, then right again
    B: Look left, then right, and left again
    C: Look straight ahead and proceed if clear
    D: Look only at the traffic signal
  answer: B
  explanation: The manual instructs drivers to 'Look left and then right and left
    again before entering the intersection.'
- id: 204
  category: defensive_driving
  question: Why should you avoid turning into a lane just because an approaching vehicle
    has its turn signal active?
  choices:
    A: The driver may plan to turn after passing your vehicle
    B: Turn signals are often broken
    C: You must always wait for the vehicle to come to a complete stop
    D: The approaching vehicle always has the right-of-way to turn first
  answer: A
  explanation: 'The manual warns: ''The driver with an active turn signal may plan
    to turn after they go past your vehicle or may have forgotten to turn the signal
    off from a prior turn.'''
- id: 205
  category: safe_driving_rules
  question: In what direction do vehicles travel in a roundabout or traffic circle?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a straight line
    D: Whichever direction is shortest to the exit
  answer: B
  explanation: The manual states that in a roundabout or traffic circle, 'Vehicles
    travel counterclockwise around a raised center island.'
- id: 206
  category: sharing_the_road
  question: When you stop for a school bus loading or unloading passengers, when are
    you legally allowed to proceed?
  choices:
    A: As soon as the stop arm is retracted
    B: When the bus driver waves you on
    C: When all people are clear of the roadway and the bus is in motion
    D: After waiting for 60 seconds
  answer: C
  explanation: By law, you must remain stopped until all people are clear of the roadway
    and the bus is in motion.
- id: 207
  category: sharing_the_road
  question: In which situation are you NOT required to stop for a school bus that
    is loading or unloading passengers?
  choices:
    A: When following the bus on a two-lane road
    B: When approaching from the opposite direction on a highway of four or more lanes
    C: When approaching from the opposite direction on a two-lane road
    D: When following the bus on a highway with less than four lanes
  answer: B
  explanation: 'The manual states: ''A stop is not required when approaching a stopped
    bus from the opposite direction upon a highway of four or more lanes.'''
- id: 208
  category: safe_driving_rules
  question: 'When parking your vehicle along a roadway with a curb, you should:'
  choices:
    A: Park at least two feet away from the curb
    B: Park as close to the curb as possible
    C: Park on the sidewalk
    D: Park facing oncoming traffic
  answer: B
  explanation: 'The manual advises: ''When parking along the roadway, park your vehicle
    as far away from the flow of traffic as possible. If there is a curb, park as
    close to it as possible.'''
- id: 209
  category: safe_driving_rules
  question: When parallel parking, which side of the vehicle is safest to exit from?
  choices:
    A: The street side
    B: The curb side
    C: The driver's side
    D: The rear
  answer: B
  explanation: The manual states that it is safest to get out of your vehicle on the
    curb side. If you must use the street side, you should check traffic before getting
    out.
- id: 210
  category: driver_responsibility
  question: What does Kentucky law require you to do when leaving a vehicle?
  choices:
    A: Leave the engine running if you will be away for less than five minutes
    B: Turn off the engine and remove the key
    C: Leave the windows rolled down for ventilation
    D: Turn on your hazard lights
  answer: B
  explanation: The law requires you to turn off the engine and remove the key when
    you leave a vehicle. You should also always lock your vehicle.
- id: 211
  category: safe_driving_rules
  question: How should you turn your wheels when parking on a hill with no curb?
  choices:
    A: So the vehicle will roll straight backward
    B: So the vehicle will go off the road should it roll
    C: So the vehicle will roll into the center of the street
    D: Keep the wheels perfectly straight
  answer: B
  explanation: If there is no curb, turn the wheels so the vehicle will go off the
    road should it roll.
- id: 212
  category: penalties_and_points
  question: Who is legally allowed to park in a designated handicapped parking area?
  choices:
    A: Anyone who is only parking for a few minutes
    B: Any vehicle displaying a handicapped decal, regardless of passengers
    C: Vehicles displaying an official permit and transporting a disabled person
    D: Senior citizens over the age of 65
  answer: C
  explanation: Handicapped Parking is only for vehicles displaying an official permit
    and transporting a disabled person.
- id: 213
  category: safe_driving_rules
  question: On a limited access highway, what is illegal regarding the left lane?
  choices:
    A: Using it to pass slower vehicles
    B: Remaining in the left lane
    C: Driving at the posted speed limit
    D: Using it to turn left
  answer: B
  explanation: The manual explicitly states that remaining in the left lane on a limited
    access highway is illegal.
- id: 214
  category: safe_driving_rules
  question: What should you do if you miss your turn at an intersection?
  choices:
    A: Stop and back up quickly
    B: Make a U-turn immediately
    C: Go on to the next intersection and work your way back
    D: Pull over to the wrong side of the road
  answer: C
  explanation: If you miss your turn, go on to the next intersection and work your
    way back to where you want to go.
- id: 215
  category: defensive_driving
  question: If you have already started through an intersection when the traffic light
    changes, what should you do?
  choices:
    A: Stop immediately in the intersection
    B: Keep going and follow through
    C: Put your vehicle in reverse
    D: Swerve into the nearest lane
  answer: B
  explanation: If you have already started through an intersection when the light
    changes, keep going. Last-second changes can cause collisions.
- id: 216
  category: defensive_driving
  question: How should you check your 'blind spots' when changing lanes?
  choices:
    A: By looking in your rearview mirror
    B: By looking in your side mirrors
    C: By turning your head and looking over your shoulder
    D: By honking your horn
  answer: C
  explanation: Check your 'blind spots' by turning your head and looking over your
    shoulder in the direction you plan to move.
- id: 217
  category: safe_driving_rules
  question: When entering a multi-lane highway, who has the right of way?
  choices:
    A: The existing traffic on the highway
    B: The vehicle entering the highway
    C: The largest vehicle
    D: The vehicle moving the fastest
  answer: A
  explanation: The existing traffic has the right of way, so make sure it is clear
    before you merge.
- id: 218
  category: safe_driving_rules
  question: When exiting a roadway, when should you slow down to your exiting speed?
  choices:
    A: While still on the main roadway
    B: After moving to the deceleration lane
    C: Before signaling your intention
    D: Just before you reach the exit ramp curve
  answer: B
  explanation: You should maintain your vehicle speed as long as you are on the main
    roadway, then signal, move to the deceleration lane, and slow to your exiting
    speed.
- id: 219
  category: safe_driving_rules
  question: Under Kentucky law, when must a pass be completed in relation to an oncoming
    vehicle?
  choices:
    A: Before coming within 50 feet of the oncoming vehicle
    B: Before coming within 100 feet of the oncoming vehicle
    C: Before coming within 200 feet of the oncoming vehicle
    D: Before coming within 500 feet of the oncoming vehicle
  answer: C
  explanation: Kentucky law requires that a pass be completed before coming within
    two hundred (200) feet of an oncoming vehicle.
- id: 220
  category: safe_driving_rules
  question: When passing another vehicle, how do you know you have enough room to
    return to the driving lane?
  choices:
    A: When you are one car length ahead
    B: When you can see the complete front of the passed vehicle in your rearview
      mirror
    C: When the passed vehicle flashes its headlights
    D: When you are parallel to the passed vehicle's front bumper
  answer: B
  explanation: You should continue to pass until the complete front of the passed
    vehicle is visible in your rearview mirror before returning to the driving lane.
- id: 221
  category: defensive_driving
  question: How should you treat a curve or a hill when considering passing another
    vehicle?
  choices:
    A: Treat it as an oncoming vehicle and do not start to pass
    B: Honk your horn and pass quickly
    C: Accelerate to pass before the curve or hill
    D: Pass only if the vehicle ahead is moving below the speed limit
  answer: A
  explanation: Any time your view is blocked by a curve or a hill, you should assume
    there is an oncoming vehicle just out of sight. Treat a curve or a hill as an
    oncoming vehicle and do not start to pass.
- id: 222
  category: sharing_the_road
  question: When passing a bicycle on a road with only one lane traveling in the same
    direction, what is the minimum distance you must keep between your vehicle and
    the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: If there is only one lane for traffic traveling in the same direction,
    pass to the left keeping at least three (3) feet between your vehicle and the
    bicycle or electric low-speed scooter.
- id: 223
  category: safe_driving_rules
  question: What happens if you are still in the left lane when you reach a 'no passing
    zone'?
  choices:
    A: You have the right of way to finish passing
    B: You are violating the law
    C: You must speed up to complete the pass legally
    D: You must force the vehicle on the right onto the shoulder
  answer: B
  explanation: Kentucky law requires that a pass be completed before reaching the
    beginning of a 'no passing zone'. If you are still in the left lane when you reach
    it, you are violating the law.
- id: 224
  category: sharing_the_road
  question: What is the minimum distance you must maintain when passing a bicycle
    or electric low-speed scooter?
  choices:
    A: Two (2) feet
    B: Three (3) feet
    C: Four (4) feet
    D: Five (5) feet
  answer: B
  explanation: The manual states to use reasonable caution in passing if space is
    not available to have a minimum distance of three (3) feet between your vehicle
    and the bicycle or electric low-speed scooter.
- id: 225
  category: sharing_the_road
  question: 'When passing a bicycle or electric low-speed scooter, you may drive to
    the left of the center line in a no-passing zone ONLY if:'
  choices:
    A: You sound your horn before crossing the line.
    B: You are traveling at less than 25 mph.
    C: The roadway to the left is clear for a sufficient distance to permit passing
      safely.
    D: The bicycle is traveling under 10 mph.
  answer: C
  explanation: You may drive to the left of the center line in a no-passing zone to
    pass a bicycle or scooter only if the roadway to the left is clear for a sufficient
    distance to permit passing safely and avoid interference with oncoming traffic.
- id: 226
  category: defensive_driving
  question: Ideally, how far ahead should you try to look down your planned path of
    travel?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 45 to 60 seconds
  answer: C
  explanation: According to the manual, ideally, you should try to look at what is
    occurring 20 to 30 seconds in front of your car to give yourself time to adjust
    and plan driving movements.
- id: 227
  category: safe_driving_rules
  question: What is the unposted speed limit on interstate highways and parkways in
    Kentucky?
  choices:
    A: 55 MPH
    B: 60 MPH
    C: 65 MPH
    D: 70 MPH
  answer: C
  explanation: When the speed limit is not posted, sixty-five miles per hour (65 MPH)
    is the speed limit on interstate highways and parkways in Kentucky.
- id: 228
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in a business or residential
    district?
  choices:
    A: 25 MPH
    B: 35 MPH
    C: 45 MPH
    D: 55 MPH
  answer: B
  explanation: Thirty-five miles per hour (35 MPH) is the speed limit in a business/residential
    district when not posted.
- id: 229
  category: safe_driving_rules
  question: What is the speed limit in an off-street parking facility offered for
    public use?
  choices:
    A: 10 MPH
    B: 15 MPH
    C: 20 MPH
    D: 25 MPH
  answer: B
  explanation: The speed limit in an off-street parking facility offered for public
    use, whether publicly or privately owned, shall be fifteen miles per hour (15
    MPH).
- id: 230
  category: safe_driving_rules
  question: 'If heavy rain, snow, or thick fog limits your visibility to 100 feet
    or less, you cannot safely drive faster than:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: In a heavy rain, snowstorm, or a thick fog, you may not be able to
    see more than 100 feet ahead. When you cannot see any farther than that, you cannot
    safely drive faster than 25 miles per hour.
- id: 231
  category: defensive_driving
  question: When approaching a curve, when is the best time to reduce your speed?
  choices:
    A: Before entering the curve
    B: While at the sharpest point of the curve
    C: After entering the curve
    D: Just as you exit the curve
  answer: A
  explanation: Always reduce speed before entering the curve to a safe speed. Hard
    braking after entry to a curve could cause the vehicle tires to lose traction.
- id: 232
  category: vehicle_information
  question: 'If your vehicle begins to skid on a slippery road and is equipped with
    anti-lock brakes (ABS), you should:'
  choices:
    A: Pump the brakes gently.
    B: Apply steady pressure to the brakes.
    C: Slam on the brakes repeatedly.
    D: Pull the emergency brake immediately.
  answer: B
  explanation: Pump your brakes gently, unless your vehicle is equipped with anti-lock
    brakes, in which case you should apply steady pressure to the brakes.
- id: 233
  category: defensive_driving
  question: 'Hydroplaning occurs when:'
  choices:
    A: Your brakes lock up on an icy road.
    B: The steering tires start to ride up on pooled water.
    C: You drive through a flooded roadway and stall the engine.
    D: Your vehicle loses power steering in heavy rain.
  answer: B
  explanation: Hydroplaning occurs when the steering tires start to ride up on any
    pooled water, similar to the action of water skis, and are not contacting the
    actual roadway surface.
- id: 234
  category: driver_responsibility
  question: What is the average perception time for an alert driver to recognize they
    must stop?
  choices:
    A: ¼ to ½ second
    B: ½ to ¾ second
    C: ¾ to 1 second
    D: 1 to 2 seconds
  answer: C
  explanation: Perception time is the time and distance it takes you to recognize
    you must stop. The average perception time for an alert driver is ¾ second to
    1 second.
- id: 235
  category: defensive_driving
  question: At 50 mph on dry pavement with good brakes, approximately how many feet
    does it take for your brakes to slow and stop your vehicle (braking distance)?
  choices:
    A: 50 feet
    B: 100 feet
    C: 158 feet
    D: 250 feet
  answer: C
  explanation: Braking distance is the time and distance it takes for your brakes
    to slow and stop your vehicle. At 50 mph on dry pavement with good brakes, it
    can take about 158 feet.
- id: 236
  category: safe_driving_rules
  question: What is the recommended minimum following distance between your car and
    the vehicle in front of you?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: You should always try to keep a minimum following distance of 4 seconds
    between your car and the vehicle in front.
- id: 237
  category: defensive_driving
  question: In which of the following situations should you INCREASE your following
    distance beyond the 4-second minimum?
  choices:
    A: When driving on dry pavement during the day.
    B: When following a motorcycle.
    C: When driving in a residential district.
    D: When approaching a green traffic light.
  answer: B
  explanation: You should increase your following distance when following motorcycles,
    because motorcyclists can turn and change lanes much quicker than other vehicles.
- id: 238
  category: sharing_the_road
  question: 'When you are being passed by another vehicle, Kentucky law requires you
    to:'
  choices:
    A: Speed up to prevent them from passing.
    B: Move to the left lane.
    C: Give way to the right in favor of the overtaking vehicle.
    D: Flash your headlights to warn oncoming traffic.
  answer: C
  explanation: When being passed, Kentucky law requires the operator of a vehicle
    about to be overtaken and passed shall give way to the right in favor of the overtaking
    vehicle.
- id: 239
  category: sharing_the_road
  question: Why should you allow extra following distance when driving behind a motorcycle?
  choices:
    A: Motorcycles are heavier than passenger cars.
    B: Motorcyclists can turn and change lanes much quicker than other vehicles.
    C: Motorcycles require a longer stopping distance than cars.
    D: Motorcycles are required by law to stop at all railroad crossings.
  answer: B
  explanation: Motorcyclists can turn and change lanes much quicker than other vehicles.
    Allow extra space to react to motorcycles.
- id: 240
  category: defensive_driving
  question: What should you do if you find yourself driving slightly to the rear of
    another vehicle in their blind spot?
  choices:
    A: Honk your horn continuously to alert them of your presence.
    B: Maintain your current speed and lane position.
    C: Either speed up or drop back so you do not remain in the blind spot.
    D: Turn on your high beam headlights.
  answer: C
  explanation: You may be in their blind spot, and it reduces the space you may need
    to avoid a crash. Either speed up or drop back, but do not remain in another driver's
    blind spot.
- id: 241
  category: sharing_the_road
  question: When a tractor-trailer is passing you, how should you adjust your vehicle's
    position?
  choices:
    A: Move to the inside portion of your lane closer to the truck.
    B: Move to the outside portion of your lane to leave a little more space.
    C: Straddle the center line to give the truck room.
    D: Pull completely off the roadway onto the shoulder and stop.
  answer: B
  explanation: When a passing vehicle is a tractor trailer, leave a little more space
    between you and that vehicle by moving to the outside portion of your lane.
- id: 242
  category: safe_driving_rules
  question: What is the proper procedure when approaching parked vehicles on the shoulder
    of an interstate highway?
  choices:
    A: Honk your horn and maintain your current lane.
    B: Speed up to pass the parked vehicles as quickly as possible.
    C: Move to the left lane safely before passing them and then back to the right
      lane.
    D: Stop behind the parked vehicle to see if the driver needs assistance.
  answer: C
  explanation: When approaching these vehicles, move to the left lane safely before
    passing them and then back to the right lane after passing.
- id: 243
  category: safe_driving_rules
  question: What must you do if you pass your intended exit on an interstate or freeway?
  choices:
    A: Carefully back up on the shoulder of the road.
    B: Make a U-turn through the grassy median.
    C: Stop in your lane and wait for traffic to clear before backing up.
    D: Proceed to the next exit and work your way back to where you want to go.
  answer: D
  explanation: If you have passed your exit on an interstate or freeway, never back
    up or try to turn around. Proceed to the next exit and work your way back.
- id: 244
  category: safe_driving_rules
  question: During what time period must your vehicle's headlights be illuminated?
  choices:
    A: From sunset to sunrise.
    B: From one-half hour after sunset to one-half hour before sunrise.
    C: From one hour after sunset to one hour before sunrise.
    D: Only when it is completely dark outside.
  answer: B
  explanation: Headlights must be illuminated during the period from one-half (1/2)
    hour after sunset to one-half (1/2) hour before sunrise.
- id: 245
  category: vehicle_information
  question: According to the manual, what type of turn signals must your vehicle have?
  choices:
    A: Mechanical signals only.
    B: Hand signals only.
    C: Both mechanical and hand signals.
    D: Automatic sensor signals.
  answer: A
  explanation: Your vehicle must have mechanical signals. Hand signals cannot be used.
- id: 246
  category: safe_driving_rules
  question: Should you use your turn signal if you do not see any other vehicles around?
  choices:
    A: No, it is unnecessary and wastes battery power.
    B: Yes, signal every time you change direction because the vehicle you do not
      see is the most dangerous.
    C: Only if you are driving at night or in bad weather.
    D: Only if you are driving on a multi-lane highway.
  answer: B
  explanation: Signal every time you change direction, even when you do not see anyone
    else around. The vehicle you do not see is the most dangerous.
- id: 247
  category: defensive_driving
  question: What are the three primary options a driver has to avoid a crash or reduce
    its impact?
  choices:
    A: Honking, flashing lights, or swerving.
    B: Braking, steering, or accelerating.
    C: Downshifting, braking, or bracing for impact.
    D: Closing eyes, braking, or turning off the engine.
  answer: B
  explanation: You have three options to avoid the crash or to reduce its impact.
    These options are braking, steering, or accelerating.
- id: 248
  category: vehicle_information
  question: What is the general guideline for braking in an emergency if your vehicle
    is equipped with an anti-lock braking system (ABS)?
  choices:
    A: Pump the brake pedal rapidly to avoid skidding.
    B: Press lightly on the brake pedal and gradually increase pressure.
    C: Press on the brake pedal as hard as you can and keep applying pressure.
    D: Apply the parking brake while simultaneously pressing the foot brake.
  answer: C
  explanation: 'The general guidelines for using ABS are: Press on the brake pedal
    as hard as you can and keep applying pressure. ABS will work only if you keep
    the pressure on the brake pedal.'
- id: 249
  category: defensive_driving
  question: When quickly steering around a problem in the roadway, what should you
    do after you have cleared the obstacle?
  choices:
    A: Accelerate rapidly to regain any lost speed.
    B: Steer in the opposite direction to straighten out your vehicle.
    C: Slam on the brakes to come to a complete stop.
    D: Take your hands off the wheel to let the car self-correct.
  answer: B
  explanation: When you have cleared the problem, steer in the opposite direction
    to straighten out your vehicle, gain control, and start slowing.
- id: 250
  category: defensive_driving
  question: If your vehicle begins to skid sideways, how should you steer to regain
    control?
  choices:
    A: Turn the wheel in the opposite direction of the skid.
    B: Keep the steering wheel perfectly straight.
    C: Turn the wheel in the direction the back of the vehicle is skidding.
    D: Turn the wheel sharply left and right until traction returns.
  answer: C
  explanation: If you begin to skid sideways, you need to turn the wheel in the direction
    the back of the vehicle is skidding. This will allow the front of the vehicle
    to line up with the back.
- id: 251
  category: defensive_driving
  question: How should you slow your vehicle if you are skidding in a straight line
    and do NOT have anti-lock brakes?
  choices:
    A: Brake as hard as possible and hold the pedal down.
    B: Pump the brakes gently.
    C: Apply the emergency parking brake immediately.
    D: Shift the vehicle into reverse.
  answer: B
  explanation: If you do not have anti-lock, do not brake hard. This will only lock
    your wheels and make the skid worse. Instead, slow the vehicle by pumping the
    brakes gently.
- id: 252
  category: defensive_driving
  question: How can you help keep a driver behind you at a safe following distance?
  choices:
    A: By frequently tapping your brakes to warn them.
    B: By speeding up and slowing down unpredictably.
    C: By keeping a steady speed, signaling in advance, and keeping more space to
      the front.
    D: By turning on your hazard lights while driving.
  answer: C
  explanation: You can help keep the driver behind you at a safe distance by keeping
    a steady speed, signaling in advance, and keeping more space to the front of your
    vehicle before reducing speed or turning.
- id: 253
  category: defensive_driving
  question: What is the most important vehicle control to use during a skid?
  choices:
    A: The accelerator pedal
    B: The brake pedal
    C: The steering wheel
    D: The parking brake
  answer: C
  explanation: According to the manual, continue to correct your steering until you
    recover completely from the skid. The most important vehicle control to use during
    a skid is the steering wheel.
- id: 254
  category: defensive_driving
  question: If your vehicle does not have anti-lock brakes and you begin to skid,
    what should you do?
  choices:
    A: Brake hard to stop the vehicle immediately
    B: Slow the vehicle by pumping the brakes gently
    C: Shift into neutral and coast until you stop
    D: Pull the parking brake quickly
  answer: B
  explanation: If you do not have anti-lock brakes, do not brake hard, as this will
    lock your wheels and make the skid worse. Instead, slow the vehicle by pumping
    the brakes gently.
- id: 255
  category: defensive_driving
  question: What should you do if your vehicle's wheels leave the paved road and drop
    onto an uneven surface?
  choices:
    A: Panic steer immediately back onto the pavement
    B: Brake hard and stop on the shoulder
    C: Slow down gradually and turn quickly back onto the pavement when safe
    D: Accelerate to regain traction before turning back
  answer: C
  explanation: If your vehicle leaves the paved road, avoid panic steering. Slow down
    gradually, when safe to do so, and turn quickly back onto the pavement.
- id: 256
  category: safe_driving_rules
  question: Under Kentucky law, what must you do if you are involved in a non-injury
    accident?
  choices:
    A: Leave the vehicles exactly where they are until a tow truck arrives
    B: Move the damaged vehicles to the shoulder of the roadway
    C: Drive home and report the accident the next day
    D: Wait for an officer before moving the vehicles out of the traffic lane
  answer: B
  explanation: In accordance with Kentucky law (KRS 189.580), when involved in a non-injury
    accident, you must move the damaged vehicles to the shoulder of the roadway.
- id: 257
  category: driver_responsibility
  question: If you are involved in a collision resulting in property damage exceeding
    $500 and no law enforcement officer investigates, how long do you have to file
    a written report with the Kentucky State Police?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: Any person involved in an automobile collision resulting in property
    damage exceeding $500 not investigated by an officer shall file a written report
    with the Kentucky State Police within ten (10) days.
- id: 258
  category: driver_responsibility
  question: What should you do if you collide with a parked vehicle and cannot locate
    the owner?
  choices:
    A: Leave the scene immediately if there is no visible damage
    B: Wait by the vehicle until the owner returns
    C: Call a tow truck to remove the parked vehicle
    D: Leave a note with your name, address, driver license number, license plate
      number, and the date and time
  answer: D
  explanation: If the collision involves a parked vehicle and you cannot locate the
    owner, leave a note where it can be seen including your name, address, driver
    license number, license plate number, along with the date and time of the collision.
- id: 259
  category: driver_responsibility
  question: When should you attempt to remove an injured individual from a collision
    scene?
  choices:
    A: Immediately upon arriving at the scene
    B: Only in life-threatening emergencies
    C: Whenever they ask to be moved
    D: If they are blocking traffic
  answer: B
  explanation: Only in life-threatening emergencies should you attempt to remove an
    individual from a collision. If possible, wait for an Emergency Medical Technician
    or ambulance.
- id: 260
  category: vehicle_information
  question: If your brakes stop working while driving, what is the first step you
    should take?
  choices:
    A: Turn off the engine immediately
    B: Shift into reverse
    C: Use the parking brake by pulling or pushing it slowly
    D: Pump the accelerator pedal
  answer: C
  explanation: If your brakes stop working while driving, use the parking brake. Pull
    on the handle or push the foot pedal slowly so you will not lock the rear wheels
    and cause a skid.
- id: 261
  category: defensive_driving
  question: How should you respond if a tire blows out or suddenly goes flat while
    driving?
  choices:
    A: Brake hard and stop in the lane
    B: Grip the steering wheel firmly, keep straight, and slow down gradually without
      braking hard
    C: Turn the steering wheel sharply in the opposite direction of the blowout
    D: Accelerate to maintain control of the vehicle
  answer: B
  explanation: If a tire blows out, grip the steering wheel firmly, keep the vehicle
    going straight, slow down gradually by taking your foot off the accelerator, and
    do not brake hard.
- id: 262
  category: vehicle_information
  question: 'If your engine shuts off while you are driving, you should be aware that:'
  choices:
    A: The steering wheel will lock completely and cannot be turned
    B: The steering wheel may be difficult to turn, but you can still turn it
    C: The brakes will automatically apply themselves
    D: The vehicle will immediately come to a complete stop
  answer: B
  explanation: If the engine shuts off while driving, keep a strong grip on the steering
    wheel. Be aware that the steering wheel may be difficult to turn, but you can
    turn it.
- id: 263
  category: defensive_driving
  question: What is the correct action to take if your vehicle is accelerating out
    of control due to a stuck accelerator?
  choices:
    A: Turn off the engine, shift to neutral, and search for an escape path
    B: Shift into park while moving
    C: Pull the parking brake as hard as possible
    D: Turn the steering wheel sharply back and forth
  answer: A
  explanation: If your vehicle is accelerating out of control, turn off the engine,
    shift to neutral, search for an escape path, steer smoothly, brake gently, and
    pull off the roadway.
- id: 264
  category: safe_driving_rules
  question: Where should you place emergency flares if your vehicle breaks down on
    the highway?
  choices:
    A: 10 to 20 feet behind the vehicle
    B: 50 to 100 feet behind the vehicle
    C: 200 to 300 feet behind the vehicle
    D: 500 to 600 feet behind the vehicle
  answer: C
  explanation: Try to warn other roadway users by placing emergency flares about 200
    to 300 feet behind the vehicle, giving other drivers some time to change lanes
    if necessary.
- id: 265
  category: sharing_the_road
  question: 'When making a right or left turn on a red light, you must:'
  choices:
    A: Honk your horn to warn pedestrians to clear the crosswalk
    B: Be prepared to yield the right of way to pedestrians
    C: Proceed without stopping if no other vehicles are coming
    D: Wait for a green light if any pedestrians are visible on the sidewalk
  answer: B
  explanation: When making a right or left turn on red, you must be prepared to yield
    the right of way to pedestrians.
- id: 266
  category: sharing_the_road
  question: What is the penalty for failing to yield the right-of-way to a blind pedestrian
    carrying a white cane or accompanied by an assistance dog?
  choices:
    A: A warning for the first offense
    B: A fine up to $100
    C: A fine up to $250
    D: Immediate license suspension
  answer: C
  explanation: Kentucky law requires operators to yield to a blind pedestrian carrying
    a white cane or accompanied by an assistance dog. Failure to yield is a violation
    that could result in a fine up to $250.
- id: 267
  category: sharing_the_road
  question: Who has the right-of-way if a pedestrian is crossing a roadway at a point
    other than within a marked or unmarked crosswalk at an intersection?
  choices:
    A: The pedestrian always has the right-of-way
    B: The pedestrian must yield the right-of-way to all vehicles
    C: Vehicles must stop and wait for the pedestrian regardless of location
    D: The right-of-way goes to whoever arrived first
  answer: B
  explanation: Every pedestrian crossing a roadway at a point other than within a
    marked crosswalk or within an unmarked crosswalk at an intersection shall yield
    the right-of-way to all vehicles.
- id: 268
  category: penalties_and_points
  question: What is the maximum fine for failing to yield the right-of-way to a blind
    pedestrian in Kentucky?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Failure to yield the right-of-way to a blind pedestrian is a violation
    that could result in a fine up to two hundred fifty dollars ($250).
- id: 269
  category: sharing_the_road
  question: When stopping for a blind pedestrian at a crosswalk, how close should
    you stop your vehicle to the crosswalk if there is no advanced stop bar?
  choices:
    A: At least 10 feet away
    B: No more than 5 feet from the crosswalk
    C: More than 15 feet away
    D: Inside the crosswalk
  answer: B
  explanation: Do not stop your vehicle more than five (5) feet from the crosswalk,
    unless there is an advanced stop bar. A blind pedestrian uses the sound of your
    vehicle as a guide.
- id: 270
  category: sharing_the_road
  question: Why must drivers of electric and hybrid vehicles be extra alert around
    blind pedestrians?
  choices:
    A: These vehicles have larger blind spots.
    B: Blind pedestrians may be unaware of their presence due to the silent nature
      of these vehicles.
    C: These vehicles accelerate faster than standard vehicles.
    D: The headlights on these vehicles are less visible during the day.
  answer: B
  explanation: Drivers of electric and hybrid vehicles must be extra alert to blind
    pedestrians, as they may be unaware of your presence due to the silent nature
    of these vehicles.
- id: 271
  category: sharing_the_road
  question: What is the recommended minimum amount of space a driver should allow
    when passing a bicyclist?
  choices:
    A: One foot
    B: Two feet
    C: Three feet
    D: Five feet
  answer: C
  explanation: At least three feet of space is recommended when passing bicyclists
    and the passing vehicles should move back into the right lane only when well clear
    of the bicyclist.
- id: 272
  category: safe_driving_rules
  question: How far in advance must a bicyclist give a signal before making a turn?
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 200 feet
  answer: B
  explanation: The signal shall be given intermittently for the last fifty (50) feet
    traveled by the vehicle (bicycle) before the turn.
- id: 273
  category: sharing_the_road
  question: Which of the following is a rule that bicyclists must follow?
  choices:
    A: Ride on the sidewalk whenever possible.
    B: Ride against the flow of traffic.
    C: Never ride on interstates and parkways.
    D: Ride at least three abreast to increase visibility.
  answer: C
  explanation: Rules for Bicyclists state that they must "Never ride on interstates
    and parkways." They are also prohibited from riding on sidewalks and must ride
    with traffic.
- id: 274
  category: vehicle_information
  question: When riding a bicycle at night, what lighting equipment is required?
  choices:
    A: A white light on both the front and rear.
    B: A red light on the front and a white reflector on the rear.
    C: A white light visible from the front and a red reflector or light visible from
      the rear.
    D: Only reflective clothing is required.
  answer: C
  explanation: When riding at night, operate the bicycle with a white light visible
    from the front and a red reflector or light visible from the rear.
- id: 275
  category: vehicle_information
  question: What is the maximum designed speed of an electric low-speed scooter on
    a paved level surface?
  choices:
    A: 15 miles per hour
    B: 20 miles per hour
    C: 25 miles per hour
    D: 30 miles per hour
  answer: B
  explanation: An electric low-speed scooter is designed to operate at a maximum speed
    of twenty (20) miles per hour on a paved level surface.
- id: 276
  category: license_system
  question: What is the minimum age required to operate an electric low-speed scooter
    on a highway, bicycle lane, or bicycle path?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 18 years of age
  answer: C
  explanation: A person sixteen (16) years of age or older, may operate an electric
    low-speed scooter on a highway, bicycle lane, or bicycle path.
- id: 277
  category: safe_driving_rules
  question: During what times must an electric low-speed scooter's lights be illuminated?
  choices:
    A: From sunset to sunrise.
    B: From one-half hour after sunset to one-half hour before sunrise.
    C: From one hour after sunset to one hour before sunrise.
    D: At all times when operating on a highway.
  answer: B
  explanation: These lights shall be illuminated from one-half (1/2) hour after sunset
    to one-half (1/2) hour before sunrise or at other times when there is low visibility.
- id: 278
  category: sharing_the_road
  question: 'When sharing the road with a motorcycle, you should:'
  choices:
    A: Share the lane with the motorcycle to improve traffic flow.
    B: Allow the motorcyclist a full lane width.
    C: Honk your horn when passing them.
    D: Follow them at a 2-second distance.
  answer: B
  explanation: Allow a motorcyclist a full lane width. Do not share the lane. The
    motorcycle needs space for the motorcyclist to react to other traffic.
- id: 279
  category: defensive_driving
  question: Why should you not assume a motorcycle is turning just because its turn
    signal is flashing?
  choices:
    A: Motorcycle turn signals are often used as hazard lights.
    B: Motorcyclists use turn signals to indicate they are slowing down.
    C: Motorcycle turn signals may not self-cancel and the rider may have forgotten
      to turn them off.
    D: The turn signal indicates the motorcycle is changing gears.
  answer: C
  explanation: Do not assume a motorcycle is turning when you see its turn signal
    flashing. Motorcycle turn signals may not self-cancel, and the motorcyclist may
    have forgotten to turn them off.
- id: 280
  category: safe_driving_rules
  question: What is the minimum recommended following distance when driving behind
    a motorcyclist?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: When following a motorcyclist, allow for a minimum 4-second following
    distance or more in wet conditions, or you may not have enough time or space to
    avoid a crash.
- id: 281
  category: defensive_driving
  question: Why should a driver avoid slowing down or stopping quickly in front of
    a bicyclist?
  choices:
    A: Bicycles are not equipped with brakes.
    B: A motor vehicle's brakes are more powerful than a bicycle's and could cause
      a crash.
    C: The bicyclist will be forced to ride onto the sidewalk.
    D: It is illegal to brake in front of a bicycle.
  answer: B
  explanation: Avoid slowing down or stopping quickly. A motor vehicle’s brakes are
    more powerful than a bicycle’s and you could cause a crash.
- id: 282
  category: sharing_the_road
  question: What should you do if a blind pedestrian takes a step back and pulls in
    their cane at a crosswalk?
  choices:
    A: Honk your horn to let them know it is safe to cross.
    B: Give them verbal directions to cross the street.
    C: Wait until they step forward again.
    D: Treat it as a definite sign that you should go.
  answer: D
  explanation: If the person takes a step back and pulls in the cane that is a definite
    sign you should go.
- id: 283
  category: sharing_the_road
  question: Under ideal conditions, how much distance does a loaded truck traveling
    at 55 mph require to come to a complete stop?
  choices:
    A: At least 150 feet
    B: At least 200 feet
    C: At least 250 feet
    D: At least 335 feet
  answer: D
  explanation: According to the manual, a loaded truck with good tires and properly
    adjusted brakes traveling at 55 mph requires at least 335 feet before coming to
    a complete stop.
- id: 284
  category: sharing_the_road
  question: How can you determine if you are driving in a large truck's side blind
    spot?
  choices:
    A: If you are within 50 feet of the truck's rear bumper
    B: If you cannot see the driver's face in the side view mirror
    C: If you are driving in the left lane next to the truck
    D: If you can see the truck's headlights in your rearview mirror
  answer: B
  explanation: The manual explains that if you cannot see the driver's face in the
    side view mirror, he or she cannot see you, meaning you are in their blind spot.
- id: 285
  category: sharing_the_road
  question: How far can the blind spot directly behind a large commercial vehicle
    extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 200 feet
    D: Up to 300 feet
  answer: C
  explanation: Unlike cars, large vehicles have huge blind spots directly behind them
    that extend up to 200 feet.
- id: 286
  category: defensive_driving
  question: When passing a large vehicle, when is it safe to pull back in front of
    it?
  choices:
    A: As soon as you clear the front bumper of the truck
    B: When you can see the whole front of the vehicle in your rear-view mirror
    C: When the truck driver flashes their headlights
    D: After you have maintained your speed for 3 seconds
  answer: B
  explanation: The manual advises that when passing a large vehicle, you should look
    for the whole front of the vehicle in your rear-view mirror before pulling in
    front and maintaining speed.
- id: 287
  category: sharing_the_road
  question: Why do large trucks sometimes swing wide to the left when making a right
    turn?
  choices:
    A: To allow cars to pass them on the right
    B: To safely clear the corner of a curb or other obstruction
    C: To build up speed before entering the new road
    D: To check their right-side blind spots
  answer: B
  explanation: When a truck or bus needs to make a right turn, the driver will sometimes
    swing the vehicle wide to the left to safely turn right and clear the corner of
    a curb or other obstruction.
- id: 288
  category: signs_and_signals
  question: Why are stop lines placed at many intersections?
  choices:
    A: To indicate where pedestrians are allowed to cross
    B: To mark the boundary of a school zone
    C: To set vehicles farther back to give larger vehicles more turning space
    D: To show where the speed limit changes
  answer: C
  explanation: Many intersections are marked with stop lines to set you farther back
    at an intersection to give larger vehicles more turning space.
- id: 289
  category: defensive_driving
  question: When stopped behind a truck on an upgrade, where should you position your
    vehicle?
  choices:
    A: As close to the truck's rear bumper as possible
    B: To the right of your lane
    C: To the left of your lane where the driver can see you
    D: In the center of the lane with your hazard lights on
  answer: C
  explanation: When stopped behind a truck on an upgrade, stay to the left of your
    lane where the driver can see you and allow extra space in case the truck drifts
    backwards.
- id: 290
  category: safe_driving_rules
  question: What must vehicles carrying hazardous materials do at all railroad crossings?
  choices:
    A: Slow down to 15 mph
    B: Stop only if a train is approaching
    C: Sound their horn before crossing
    D: Stop at all railroad crossings
  answer: D
  explanation: The manual explicitly states that vehicles carrying hazardous materials
    must stop at all railroad crossings.
- id: 291
  category: safe_driving_rules
  question: What must you do when you hear a siren or see a vehicle displaying flashing
    red or blue lights?
  choices:
    A: Speed up to clear the road quickly
    B: Stop immediately in your current lane
    C: Drive to the right side of the road or curb, clear of any intersection, and
      stop
    D: Move to the left lane and slow down
  answer: C
  explanation: When you become aware of an approaching emergency vehicle with flashing
    red/blue lights or a siren, you must immediately drive to the right side of the
    road or curb, clear of any intersection, and stop.
- id: 292
  category: safe_driving_rules
  question: 'It is unlawful to follow any emergency vehicle closer than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: According to Kentucky law, it is unlawful to follow any emergency vehicle
    closer than 500 feet.
- id: 293
  category: driver_responsibility
  question: What should you do with your hands when pulled over by law enforcement?
  choices:
    A: Keep them in your lap
    B: Keep them on the steering wheel
    C: Use them to immediately search for your license
    D: Hold them out the window
  answer: B
  explanation: During a traffic stop, you should keep your hands on the steering wheel
    and limit movements so the officer does not think you are hiding or searching
    for something.
- id: 294
  category: driver_responsibility
  question: If you are pulled over by law enforcement at night, what should you do
    to help the officer?
  choices:
    A: Turn off your headlights
    B: Turn on your high beams
    C: Turn on your interior lights
    D: Step out of the vehicle immediately
  answer: C
  explanation: If pulled over at night, you should turn on your interior lights to
    help the officer see that everything is in order inside the vehicle.
- id: 295
  category: driver_responsibility
  question: When a law enforcement officer asks for your documents during a traffic
    stop, what is the proper procedure?
  choices:
    A: Quickly reach into your glove box to retrieve them
    B: Tell the officer where they are located before reaching for them slowly
    C: Ask the officer to retrieve them for you
    D: Hand the officer your entire wallet
  answer: B
  explanation: When requested to provide documents, you should first tell the officer
    where they are located, then reach for them slowly with one hand on the wheel.
- id: 296
  category: safe_driving_rules
  question: What do move-over laws require drivers to do when approaching a roadside
    incident?
  choices:
    A: Stop and offer assistance to emergency personnel
    B: Maintain speed but honk the horn to warn workers
    C: Slow down and change lanes
    D: Pull over to the right shoulder and stop
  answer: C
  explanation: Move-over laws require drivers to slow and change lanes when approaching
    a roadside incident to protect law enforcement, EMS, and fire department personnel.
- id: 297
  category: safe_driving_rules
  question: Under Kentucky's move-over laws, what should a driver do when approaching
    an emergency vehicle stopped on the shoulder of a four-lane highway?
  choices:
    A: Stop immediately and wait for the vehicle to leave.
    B: Approach slowly and move into the left lane if it is safe to do so.
    C: Maintain speed and stay in the right lane.
    D: Honk to alert the emergency workers of your presence.
  answer: B
  explanation: Kentucky law requires drivers to approach slowly and move into the
    left lane on four-lane highways if it is safe to do so when approaching stopped
    police or emergency vehicles.
- id: 298
  category: signs_and_signals
  question: A fluorescent or reflective orange and red triangle displayed on the rear
    of a vehicle indicates that the vehicle is traveling at what speed?
  choices:
    A: Less than 15 mph
    B: Less than 25 mph
    C: Less than 35 mph
    D: Less than 45 mph
  answer: B
  explanation: A fluorescent or reflective orange and red triangle displayed on the
    rear of vehicles drawn by animal, farm equipment, or construction equipment means
    the vehicle is traveling less than 25 mph.
- id: 299
  category: sharing_the_road
  question: Why should you avoid using your horn or revving your engine when passing
    a horseback rider or animal-drawn vehicle?
  choices:
    A: It is illegal to use a horn in rural areas.
    B: It may scare the horse and cause a crash.
    C: It will cause the animal-drawn vehicle to speed up.
    D: The rider cannot hear approaching vehicles anyway.
  answer: B
  explanation: When sharing the road with animal-drawn vehicles and horseback riders,
    you should pass with caution and not use your horn or rev the engine because this
    may scare the horse and cause a crash.
- id: 300
  category: safe_driving_rules
  question: When crossing a two-lane public highway on an All-Terrain Vehicle (ATV),
    what is the maximum distance you are allowed to travel on the highway?
  choices:
    A: One-tenth (1/10) of a mile
    B: Two-tenths (2/10) of a mile
    C: Five-tenths (5/10) of a mile
    D: One mile
  answer: B
  explanation: While crossing a two-lane public highway, the operator shall cross
    at as close to a 90-degree angle as practical and shall not travel on the highway
    for more than two-tenths (2/10) of a mile.
- id: 301
  category: driver_responsibility
  question: What is required for a person under sixteen (16) years of age to operate
    an All-Terrain Vehicle (ATV)?
  choices:
    A: Direct parental supervision and approved protective headgear
    B: A valid instruction permit and daylight hours only
    C: A special ATV license and reflective clothing
    D: They are strictly prohibited from operating an ATV under any circumstances
  answer: A
  explanation: If under sixteen (16) years of age, a person shall not operate an ATV
    except under direct parental supervision, and not without approved protective
    headgear at all times the vehicle is in motion.
- id: 302
  category: safe_driving_rules
  question: When driving at night, when should you use your low beam headlights instead
    of high beams?
  choices:
    A: When driving on unfamiliar roadways
    B: When driving in fog, rain, or snow
    C: When there are no oncoming vehicles
    D: When driving on rural highways
  answer: B
  explanation: You should use your low beams when following another vehicle, and in
    fog, rain, or snow. Light from your high beams may cause glare in these conditions.
- id: 303
  category: safe_driving_rules
  question: At what distance must you dim your headlights when approaching an oncoming
    vehicle at night?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You must dim your lights whenever you come within 500 feet of oncoming
    vehicles, and within 300 feet of any vehicle you are following.
- id: 304
  category: defensive_driving
  question: How much should you increase your following distance when driving on unfamiliar
    roadways at night?
  choices:
    A: Add at least one additional second
    B: Add at least two additional seconds
    C: Add at least three additional seconds
    D: Add at least four additional seconds
  answer: B
  explanation: You should increase your following distance by adding at least one
    additional second for night driving conditions and at least two additional seconds
    for driving on unfamiliar roadways at night.
- id: 305
  category: sharing_the_road
  question: Which of the following vehicles has the right-of-way over a funeral procession
    at an intersection?
  choices:
    A: A public transit bus
    B: A commercial delivery truck
    C: A train or locomotive
    D: A vehicle turning right on red
  answer: C
  explanation: A funeral procession has the right-of-way at an intersection. The only
    exceptions are when the right-of-way is required by an emergency vehicle, directed
    otherwise by a police/safety officer, or when the vehicle is a train or locomotive.
- id: 306
  category: penalties_and_points
  question: What is the potential penalty for violating the laws regarding funeral
    processions in Kentucky?
  choices:
    A: A $50 fine
    B: A $100 fine or 30 days in jail
    C: A $250 fine or 90 days in jail
    D: A $500 fine and license suspension
  answer: C
  explanation: If you violate the funeral procession law, you may receive a $250 fine
    or 90 days in jail.
- id: 307
  category: penalties_and_points
  question: Under what conditions are fines doubled in a Kentucky highway work zone?
  choices:
    A: Only when workers are present, regardless of signage
    B: When signs are displayed informing drivers of double fines and at least one
      bona fide worker is present
    C: At all times within the designated work zone
    D: Only during nighttime construction hours
  answer: B
  explanation: Kentucky law allows for fines to be doubled in a highway work zone
    when signs are displayed informing drivers that fines are double in it, and additionally,
    at least one bona fide worker must be present.
- id: 308
  category: signs_and_signals
  question: What colors are used for work zone signs?
  choices:
    A: Yellow background with black letters
    B: Orange background with black letters
    C: White background with red letters
    D: Green background with white letters
  answer: B
  explanation: Work zone signs have an orange background and black letters or symbols.
- id: 309
  category: defensive_driving
  question: What should you do to keep from being momentarily blinded if an oncoming
    vehicle has its high beams on?
  choices:
    A: Flash your high beams repeatedly
    B: Look directly at the oncoming headlights
    C: Look toward the right side of the road
    D: Close your eyes briefly until the vehicle passes
  answer: C
  explanation: If a vehicle comes toward you with their high beams on, look toward
    the right side of the road to keep from being distracted or momentarily blinded
    by their headlights.
- id: 310
  category: vehicle_information
  question: What lighting equipment is required when operating an All-Terrain Vehicle
    (ATV) on a public highway?
  choices:
    A: At least two headlights and one taillight
    B: At least one headlight and two taillights illuminated at all times
    C: Only a flashing yellow strobe light
    D: Headlights are only required if driving at night
  answer: B
  explanation: A person who operates an ATV on a public highway must have at least
    one headlight and two taillights illuminated at all times.
- id: 311
  category: signs_and_signals
  question: What part of the slow-moving vehicle symbol is visible during night driving?
  choices:
    A: The fluorescent orange center
    B: The reflective red border
    C: The flashing yellow beacon
    D: The solid black triangle
  answer: B
  explanation: During the day, you will see the fluorescent orange triangle in the
    center of the symbol. During night driving, you will see the reflective red border
    of the symbol.
- id: 312
  category: defensive_driving
  question: What should you do when driving on gravel or dirt roads to handle reduced
    traction?
  choices:
    A: Increase your speed to maintain momentum
    B: Reduce your speed and increase your following distance
    C: Pump your brakes continuously
    D: Drive closer to the vehicle ahead to follow their tracks
  answer: B
  explanation: According to the manual, traction can be reduced on gravel or dirt
    roads. You should reduce your speed, increase your following distance, and realize
    you may skid when trying to stop.
- id: 313
  category: safe_driving_rules
  question: Who generally has the right of way when approaching a narrow or single-lane
    bridge?
  choices:
    A: The larger vehicle
    B: The vehicle traveling at a higher speed
    C: The first driver to arrive at the bridge
    D: The vehicle traveling uphill
  answer: C
  explanation: When encountering narrow and single-lane bridges, you should take turns
    crossing; generally, the first driver to the bridge has the right of way.
- id: 314
  category: defensive_driving
  question: How should you adjust your driving when crossing open bridge gratings
    or steel bridges?
  choices:
    A: Increase your speed to cross quickly
    B: Reduce your speed and maintain a firm grip on the steering wheel
    C: Loosen your grip on the steering wheel to allow the tires to follow the grating
    D: Apply your brakes firmly while crossing
  answer: B
  explanation: Open bridge gratings or steel bridges can reduce your traction. You
    should reduce your speed, increase your following distance, and maintain a firm
    grip on the steering wheel.
- id: 315
  category: license_system
  question: What type of license is required to operate an autocycle?
  choices:
    A: A commercial driver's license (CDL)
    B: A valid operator's license
    C: A motorcycle license or endorsement
    D: A special autocycle permit
  answer: B
  explanation: An operator of an autocycle is not required to obtain a motorcycle
    license or endorsement, and may operate the vehicle if the operator is in possession
    of a valid operator's license.
- id: 316
  category: safe_driving_rules
  question: Which of the following is true regarding headgear requirements for autocycle
    operators?
  choices:
    A: They must wear a DOT-approved helmet at all times
    B: They are exempt from any headgear requirements
    C: They must wear a helmet only if driving over 40 mph
    D: They must wear a helmet unless the autocycle has a fixed top
  answer: B
  explanation: The manual states that an operator of an autocycle is exempt from any
    headgear requirements.
- id: 317
  category: vehicle_information
  question: How should cargo weight be distributed when loading a trailer to reduce
    the possibility of sway?
  choices:
    A: 50 percent in the front and 50 percent in the back
    B: 40 percent in the front and 60 percent in the back
    C: 60 percent in the front and 40 percent in the back
    D: 100 percent evenly distributed across the middle
  answer: C
  explanation: Trailers must be loaded heavier in the front to reduce sway. Sixty
    percent of the cargo weight of a trailer should go in the front (nearest the towing
    vehicle) and 40 percent in the back.
- id: 318
  category: defensive_driving
  question: If your trailer begins to sway or whip while driving, what is the correct
    action to take?
  choices:
    A: Apply the brakes firmly and immediately
    B: Increase your speed to pull the trailer straight
    C: Steer straight and reduce speed gradually without applying the brakes
    D: Swerve slightly in the opposite direction of the sway
  answer: C
  explanation: If the trailer begins to sway or whip, steer straight and reduce speed
    gradually, do not apply the brakes. Never increase speed.
- id: 319
  category: safe_driving_rules
  question: What is the maximum recommended speed for most vehicle-trailer combinations?
  choices:
    A: 45 mph
    B: 55 mph
    C: 65 mph
    D: 70 mph
  answer: B
  explanation: The manual states that the maximum recommended speed for most vehicle-trailer
    combinations is 55 mph.
- id: 320
  category: vehicle_information
  question: When backing up a trailer, where should you place your hand on the steering
    wheel to make it easier to direct the trailer?
  choices:
    A: At the top of the steering wheel
    B: At the bottom of the steering wheel
    C: On the left side of the steering wheel
    D: On the right side of the steering wheel
  answer: B
  explanation: When backing up a trailer, go slowly and keep your hand at the bottom
    of the steering wheel. To move the trailer left, move your hand to the left; to
    move right, move your hand to the right.
- id: 321
  category: defensive_driving
  question: What should you do if your trailer starts to jackknife while you are backing
    up?
  choices:
    A: Turn the steering wheel sharply to the left
    B: Accelerate in reverse to push through the jackknife
    C: Stop, pull ahead to straighten out, and start again
    D: Apply the emergency brake immediately
  answer: C
  explanation: If the trailer starts to jackknife while backing up, you should STOP
    and pull ahead to straighten out, then start again.
- id: 322
  category: defensive_driving
  question: When towing a trailer and approaching a downgrade (hill), when should
    you slow down?
  choices:
    A: Before starting down the hill
    B: Halfway down the hill
    C: At the bottom of the hill
    D: You should speed up to maintain momentum
  answer: A
  explanation: When going down a grade while towing a trailer, you must slow down
    BEFORE starting down the hill.
- id: 323
  category: sharing_the_road
  question: If a pedestrian is crossing in the middle of the street illegally (jaywalking),
    what must you do?
  choices:
    A: Honk your horn and maintain your speed
    B: Swerve into the oncoming lane to avoid them
    C: Stop for them
    D: You do not have to stop for them
  answer: C
  explanation: Even if a pedestrian is crossing in the middle of the street illegally
    (jaywalking), you must stop for them.
- id: 324
  category: sharing_the_road
  question: Which of the following statements is true regarding motorcycle operators
    on the roadway?
  choices:
    A: They must share a traffic lane with another vehicle
    B: They have the right to use a complete traffic lane
    C: They are required to drive on the shoulder of the roadway
    D: They must yield their lane to larger passenger vehicles
  answer: B
  explanation: Motorcycle operators have the right to use a complete traffic lane.
- id: 325
  category: safe_driving_rules
  question: When driving at night, when is it appropriate to use your high beam headlights?
  choices:
    A: When fog, rain, or snow is present
    B: When you are following another vehicle closely
    C: When there is no oncoming traffic approaching
    D: When driving in a well-lit urban area
  answer: C
  explanation: When driving at night, you should use your high beams when there is
    no oncoming traffic approaching.
- id: 326
  category: driver_responsibility
  question: According to the manual's copyright page, what organization holds the
    2022 copyright for the manual?
  choices:
    A: National Highway Traffic Safety Administration
    B: American Association of Motor Vehicle Administrators
    C: Virginia Tech Transportation Institute
    D: Department of Transportation
  answer: B
  explanation: The text states '2022 © Copyright All Rights Reserved American Association
    of Motor Vehicle Administrators'.
- id: 327
  category: safe_driving_rules
  question: How is this manual intended to be used in relation to the state's official
    driver manual?
  choices:
    A: As a complete replacement
    B: As a supplement
    C: As a legal substitute in court
    D: As a preliminary study guide only
  answer: B
  explanation: The text explicitly notes, 'This manual is a supplement to the state’s
    driver manual...'
- id: 328
  category: safe_driving_rules
  question: According to the text, which of the following topics is covered by the
    state's driver manual?
  choices:
    A: Vehicle manufacturing standards
    B: Rules of the road, signs, and signals
    C: Automated driving system programming
    D: Aftermarket device installation
  answer: B
  explanation: The text states the state's driver manual 'covers rules of the road,
    signs, signals, roadway markings and safe driving practices.'
- id: 329
  category: vehicle_information
  question: Who provided the graphics and pictures contained within this manual?
  choices:
    A: National Highway Traffic Safety Administration
    B: Virginia Tech Transportation Institute
    C: Motorcycle Safety Foundation and Highway Safety Services, LLC
    D: Department of Transportation
  answer: C
  explanation: The text states, 'Graphics and pictures contained within this manual
    are provided courtesy of Motorcycle Safety Foundation and Highway Safety Services,
    LLC'.
- id: 330
  category: safe_driving_rules
  question: Which organization published the December 2016 guidelines for portable
    and aftermarket devices?
  choices:
    A: Virginia Tech Transportation Institute
    B: Highway Safety Services, LLC
    C: National Highway Traffic Safety Administration (NHTSA)
    D: Motorcycle Safety Foundation
  answer: C
  explanation: The bibliography cites the 'National Highway Traffic Safety Administration
    (NHTSA), Department of Transportation (DOT). (2016, December). Visual-manual nhtsa
    driver distraction guidelines for portable and aftermarket devices.'
- id: 331
  category: safe_driving_rules
  question: In the context of the manual's citations, what does the acronym NHTSA
    stand for?
  choices:
    A: National Highway Traffic Safety Administration
    B: National Highway Transit Security Agency
    C: Nationwide Heavy Truck Safety Association
    D: National Highway Transportation Standards Authority
  answer: A
  explanation: The text explicitly lists 'National Highway Traffic Safety Administration
    (NHTSA)'.
- id: 332
  category: safe_driving_rules
  question: According to the manual's references, the NHTSA is a part of which larger
    department?
  choices:
    A: Department of Motor Vehicles (DMV)
    B: Department of Transportation (DOT)
    C: Department of Public Safety (DPS)
    D: Department of Highway Security (DHS)
  answer: B
  explanation: The citation reads 'National Highway Traffic Safety Administration
    (NHTSA), Department of Transportation (DOT).'
- id: 333
  category: defensive_driving
  question: Which institute is cited for a May 2013 study highlighting the dangers
    of distracted driving?
  choices:
    A: American Association of Motor Vehicle Administrators
    B: Highway Safety Services, LLC
    C: Virginia Tech Transportation Institute
    D: National Highway Traffic Safety Administration
  answer: C
  explanation: The text cites the 'Virginia Tech Transportation Institute. (2013,
    May, 2nd edition). New vtti study results continue to highlight the dangers of
    distracted driving.'
- id: 334
  category: defensive_driving
  question: The December 2016 NHTSA guidelines focus on what specific type of driver
    distraction regarding portable and aftermarket devices?
  choices:
    A: Cognitive distraction
    B: Auditory-vocal distraction
    C: Visual-manual distraction
    D: Olfactory distraction
  answer: C
  explanation: The citation is titled 'Visual-manual nhtsa driver distraction guidelines
    for portable and aftermarket devices.'
- id: 335
  category: vehicle_information
  question: A cited 2021 whitepaper augments guidelines for the safe testing and deployment
    of vehicles equipped with what technology?
  choices:
    A: Manual transmission systems
    B: Automated driving systems
    C: Aftermarket exhaust systems
    D: Hydraulic braking systems
  answer: B
  explanation: The text references a whitepaper 'augmenting safe testing and deployment
    of vehicles equipped with automated driving systems guidelines.'
- id: 336
  category: driver_responsibility
  question: Where is the American Association of Motor Vehicle Administrators (AAMVA)
    headquartered according to the manual?
  choices:
    A: Washington, D.C.
    B: Arlington, Virginia
    C: Blacksburg, Virginia
    D: Frankfort, Kentucky
  answer: B
  explanation: The contact information provided in the text lists the address for
    the American Association of Motor Vehicle Administrators as 'Arlington, Virginia
    22203'.
- id: 337
  category: driver_responsibility
  question: What is the contact phone number provided for the American Association
    of Motor Vehicle Administrators?
  choices:
    A: 800.555.1234
    B: 703.522.4200
    C: 202.366.4000
    D: 888.327.4236
  answer: B
  explanation: The text lists the phone number for the American Association of Motor
    Vehicle Administrators as '703.522.4200'.
- id: 338
  category: defensive_driving
  question: The February 2021 whitepaper cited in the manual focuses on strengthening
    education, legislation, and enforcement for what issue?
  choices:
    A: Drunk driving
    B: Distracted driving
    C: Speeding in school zones
    D: Seatbelt usage
  answer: B
  explanation: The whitepaper is titled 'Strengthening distracted driving education,
    legislations, and enforcement...'
- id: 339
  category: defensive_driving
  question: Which edition of the Virginia Tech Transportation Institute study on distracted
    driving is cited in the manual?
  choices:
    A: 1st edition
    B: 2nd edition
    C: 3rd edition
    D: 4th edition
  answer: B
  explanation: The citation explicitly notes '(2013, May, 2nd edition)' for the Virginia
    Tech Transportation Institute study.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 340
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 341
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 342
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 343
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
