questions:
- id: 1
  category: license_system
  question: En Colombie-Britannique, quel est l'âge minimum requis pour demander un
    permis de conduire de classe 7L (apprenti) ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 18 ans
  answer: C
  explanation: En Colombie-Britannique, vous devez avoir au moins 16 ans pour demander
    un permis d'apprenti conducteur. Si vous avez moins de 19 ans, vous devez également
    obtenir le consentement d'un parent ou d'un tuteur légal.
- id: 2
  category: license_system
  question: Un superviseur pour un conducteur titulaire d'un permis de classe 7L en
    Colombie-Britannique doit répondre à laquelle des exigences suivantes ?
  choices:
    A: Être âgé d'au moins 19 ans et détenir un permis de classe 7N
    B: Être âgé d'au moins 21 ans et détenir un permis de classe 5
    C: Être âgé d'au moins 25 ans et détenir un permis valide de classe 1, 2, 3, 4
      ou 5
    D: Être âgé d'au moins 30 ans et n'avoir aucun point d'inaptitude
  answer: C
  explanation: Selon l'ICBC, un superviseur doit être âgé de 25 ans ou plus et détenir
    un permis de conduire valide avec privilèges complets (classe 1 à 5).
- id: 3
  category: license_system
  question: Quelle est la limite de taux d'alcoolémie (BAC) pour un conducteur du
    programme de permis de conduire progressif (étapes L ou N) en Colombie-Britannique
    ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Les conducteurs du programme de permis de conduire progressif (GLP)
    de la Colombie-Britannique doivent avoir un taux d'alcoolémie de zéro. Il existe
    une politique de tolérance zéro pour l'alcool et les drogues pour les conducteurs
    des étapes L et N.
- id: 4
  category: license_system
  question: Combien de passagers un conducteur de classe 7L (apprenti) est-il autorisé
    à transporter en Colombie-Britannique ?
  choices:
    A: Aucun passager n'est autorisé
    B: Un maximum de 2, incluant le superviseur
    C: Un maximum de 3, incluant le superviseur
    D: Autant qu'il y a de ceintures de sécurité
  answer: B
  explanation: 'Un apprenti conducteur est limité à deux passagers : le superviseur
    requis et un passager supplémentaire.'
- id: 5
  category: license_system
  question: Laquelle des propositions suivantes est une restriction pour un conducteur
    de classe 7N (novice) concernant les appareils électroniques ?
  choices:
    A: Ils peuvent utiliser uniquement des appareils mains libres
    B: Ils peuvent utiliser des appareils portatifs uniquement lorsqu'ils sont arrêtés
      à un feu rouge
    C: Ils ne sont pas autorisés à utiliser d'appareils électroniques, y compris les
      systèmes mains libres
    D: Il n'y a aucune restriction tant qu'ils ont 18 ans ou plus
  answer: C
  explanation: En Colombie-Britannique, il est interdit aux conducteurs aux étapes
    L et N du programme de permis de conduire progressif d'utiliser tout appareil
    électronique en conduisant, même en mode mains libres.
- id: 6
  category: license_system
  question: Combien de temps un conducteur doit-il rester à l'étape Novice (N) avant
    de pouvoir passer l'examen pratique pour la classe 5, en supposant qu'aucun crédit
    n'est obtenu ?
  choices:
    A: 12 mois
    B: 18 mois
    C: 24 mois
    D: 36 mois
  answer: C
  explanation: Un conducteur doit détenir un permis de classe 7N pendant au moins
    24 mois consécutifs sans interdiction de conduire avant de pouvoir passer l'examen
    pratique pour la classe 5.
- id: 7
  category: license_system
  question: En Colombie-Britannique, si un conducteur novice reçoit une interdiction
    de conduire, qu'advient-il de sa période de 24 mois à l'étape « N » ?
  choices:
    A: Elle continue là où elle s'était arrêtée
    B: Elle est suspendue pendant la durée de l'interdiction
    C: Elle redémarre à zéro une fois que le permis est rétabli
    D: Elle est prolongée de 6 mois
  answer: C
  explanation: Si un conducteur novice fait l'objet d'une interdiction de conduire,
    la période de 24 mois requise pour passer au permis de classe 5 redémarre à zéro
    une fois que l'interdiction prend fin et que le permis est rétabli.
- id: 8
  category: license_system
  question: Quelle est la restriction de passagers pour un conducteur de classe 7N
    (novice) lorsqu'il n'est PAS accompagné d'un superviseur ?
  choices:
    A: Aucun passager autorisé
    B: Un seul passager, sauf s'il s'agit de membres de la famille immédiate
    C: Deux passagers seulement
    D: Jusqu'à trois passagers
  answer: B
  explanation: Les conducteurs novices sont limités à un seul passager, à moins d'être
    accompagnés d'un superviseur (25 ans et plus avec un permis de classe 1 à 5) ou
    que les passagers soient des membres de leur famille immédiate.
- id: 9
  category: license_system
  question: Comment un conducteur du programme de permis de conduire progressif peut-il
    réduire de six mois son temps passé à l'étape Novice (N) ?
  choices:
    A: En n'ayant aucune contravention pendant un an
    B: En suivant un cours de formation de conduite approuvé par l'ICBC pendant l'étape
      L
    C: En réussissant l'examen pratique de classe 7 à la première tentative
    D: En effectuant 50 heures de conduite supervisée enregistrées
  answer: B
  explanation: La réussite d'un cours de formation de conduite approuvé par l'ICBC
    pendant l'étape L peut réduire l'étape N de six mois, à condition que le conducteur
    ne reçoive aucune contravention et ne soit responsable d'aucun accident pendant
    les 18 premiers mois de l'étape N.
- id: 10
  category: license_system
  question: Pendant l'étape d'apprentissage (L), entre quelles heures le conducteur
    a-t-il l'interdiction de conduire un véhicule ?
  choices:
    A: De 21 h 00 à 6 h 00
    B: De minuit à 5 h 00
    C: De 23 h 00 à 5 h 00
    D: De 22 h 00 à 7 h 00
  answer: B
  explanation: Les conducteurs de classe 7L ont l'interdiction de conduire entre minuit
    et 5 h 00 du matin.
- id: 11
  category: license_system
  question: Où le signe « L » ou « N » doit-il être affiché sur le véhicule lorsqu'un
    conducteur du programme de permis progressif (GLP) l'utilise ?
  choices:
    A: Sur le pare-brise avant
    B: Sur le tableau de bord
    C: À l'arrière du véhicule, visible pour les conducteurs derrière
    D: Sur la vitre latérale
  answer: C
  explanation: Le signe « L » ou « N » doit être clairement visible à l'arrière du
    véhicule pour que les autres conducteurs puissent le voir.
- id: 12
  category: license_system
  question: Lequel des documents suivants n'est PAS requis lorsque vous vous rendez
    dans un bureau de délivrance des permis de conduire de l'ICBC pour passer votre
    examen théorique ?
  choices:
    A: Identification primaire (ex. certificat de naissance ou passeport)
    B: Identification secondaire (ex. carte de services de la C.-B. ou carte d'étudiant)
    C: Preuve d'assurance du véhicule
    D: Les frais requis pour l'examen
  answer: C
  explanation: Vous avez besoin d'une pièce d'identité primaire et secondaire ainsi
    que des frais pour l'examen théorique. La preuve d'assurance du véhicule n'est
    pas requise pour passer l'examen théorique, car vous ne conduisez pas encore.
- id: 13
  category: license_system
  question: En Colombie-Britannique, pendant combien de mois un conducteur doit-il
    détenir un permis de classe 7L avant d'être admissible à l'examen de conduite
    de classe 7 ?
  choices:
    A: 6 mois
    B: 9 mois
    C: 12 mois
    D: 24 mois
  answer: C
  explanation: Un apprenti doit détenir son permis de classe 7L pendant au moins 12
    mois avant de pouvoir passer l'examen de conduite de classe 7 pour passer à l'étape
    novice.
- id: 14
  category: license_system
  question: Quel est l'objectif principal du système de points de démérite (DPP) en
    Colombie-Britannique ?
  choices:
    A: Collecter des revenus pour le gouvernement
    B: Suivre les dossiers de conduite et appliquer des surprimes aux conducteurs
      à haut risque
    C: Déterminer les frais d'immatriculation des véhicules
    D: Remplacer le besoin d'amendes de circulation
  answer: B
  explanation: Le système de points de démérite (DPP) suit les infractions au code
    de la route. Si vous accumulez plus de 3 points au cours d'une période d'évaluation
    d'un an, vous devez payer une prime de points de démérite.
- id: 15
  category: license_system
  question: Si vous déménagez en Colombie-Britannique en provenance d'une autre province,
    de combien de temps disposez-vous pour échanger votre permis de conduire hors
    province contre un permis de la C.-B. ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 6 mois
  answer: C
  explanation: Les nouveaux résidents de la C.-B. disposent de 90 jours pour échanger
    leur permis de conduire valide d'une autre province contre un permis de la C.-B.
- id: 16
  category: license_system
  question: En Colombie-Britannique, de combien de jours disposez-vous pour informer
    l'ICBC d'un changement de nom ou d'adresse ?
  choices:
    A: 7 jours
    B: 10 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Selon la loi sur les véhicules à moteur de la C.-B. (Motor Vehicle
    Act), vous devez informer l'ICBC dans les 10 jours suivant un changement de nom
    ou d'adresse.
- id: 17
  category: license_system
  question: Lequel des éléments suivants est considéré comme une pièce d'identité
    « primaire » lors d'une demande de permis de conduire de la C.-B. ?
  choices:
    A: Carte CareCard de la C.-B.
    B: Carte d'étudiant
    C: Certificat de naissance canadien
    D: Carte de crédit
  answer: C
  explanation: Un certificat de naissance canadien est une pièce d'identité primaire.
    Les éléments tels que les cartes d'étudiant ou les cartes de crédit sont considérés
    comme secondaires ou ne sont pas acceptés comme identification primaire.
- id: 18
  category: license_system
  question: À quel âge les conducteurs de la Colombie-Britannique sont-ils tenus de
    subir un examen médical obligatoire pour prouver qu'ils sont aptes à conduire
    ?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: D
  explanation: En C.-B., les conducteurs doivent passer un examen médical à l'âge
    de 80 ans, puis tous les deux ans par la suite, pour s'assurer qu'ils sont toujours
    capables de conduire en toute sécurité.
- id: 19
  category: license_system
  question: Si vous échouez à votre premier examen de conduite de classe 7 en Colombie-Britannique,
    combien de temps devez-vous attendre avant de pouvoir repasser l'examen ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 21 jours
    D: 30 jours
  answer: B
  explanation: Après le premier échec à l'examen de conduite, il y a une période d'attente
    de 14 jours. Celle-ci passe à 30 jours pour un deuxième échec et à 60 jours pour
    les échecs suivants.
- id: 20
  category: license_system
  question: Combien de points de démérite (DPP) sont imposés pour une seule condamnation
    pour « utilisation d'un appareil électronique au volant » en C.-B. ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: La distraction au volant (utilisation d'un appareil électronique) entraîne
    une pénalité de 4 points de démérite en Colombie-Britannique.
- id: 21
  category: license_system
  question: En Colombie-Britannique, la surcharge de prime du conducteur (DPS - Driver
    Premium Surcharge) est un montant supplémentaire que vous devez payer si vous
    avez accumulé combien de points ou plus à votre dossier au cours d'une période
    de 12 mois ?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: B
  explanation: Les conducteurs qui accumulent 4 points ou plus au cours de leur période
    d'évaluation (un an) doivent payer une prime de points de pénalité du conducteur.
- id: 22
  category: license_system
  question: Quel est le poids maximal d'une remorque qu'un titulaire d'un permis standard
    de classe 5 ou 7 peut remorquer en Colombie-Britannique sans mention pour remorque
    lourde ?
  choices:
    A: 2 500 kg
    B: 3 600 kg
    C: 4 600 kg
    D: 5 500 kg
  answer: C
  explanation: Un permis de classe 5 ou 7 vous permet de remorquer des remorques pesant
    jusqu'à 4 600 kg (poids nominal brut du véhicule). Tout poids supérieur nécessite
    une mention pour caravane (Code 07) ou une mention pour remorque lourde (Code
    20).
- id: 23
  category: license_system
  question: Si vous échouez au test de connaissances du conducteur de la Colombie-Britannique,
    combien de temps devez-vous attendre avant de pouvoir le repasser ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Si vous échouez à un test de connaissances, vous devez attendre 7 jours
    avant de pouvoir le repasser.
- id: 24
  category: license_system
  question: Les visiteurs en Colombie-Britannique qui ne déménagent pas dans la province
    peuvent conduire avec un permis valide d'une autre province pendant une période
    maximale de combien de temps ?
  choices:
    A: 30 jours
    B: 90 jours
    C: 6 mois
    D: 1 an
  answer: C
  explanation: Les visiteurs peuvent conduire en Colombie-Britannique pendant une
    période allant jusqu'à six mois, à condition d'avoir un permis de conduire valide
    provenant de l'extérieur de la province.
- id: 25
  category: license_system
  question: Lorsque vous achetez un véhicule d'occasion en Colombie-Britannique, de
    combien de jours disposez-vous pour enregistrer le transfert de propriété auprès
    de l'ICBC ?
  choices:
    A: 10 jours
    B: 15 jours
    C: 30 jours
    D: Immédiatement
  answer: A
  explanation: L'acheteur doit enregistrer le transfert de propriété auprès de l'ICBC
    dans les 10 jours suivant la date d'achat.
- id: 26
  category: license_system
  question: Laquelle des descriptions suivantes correspond à un permis de conduire
    de classe 4 (restreint) en Colombie-Britannique ?
  choices:
    A: Permet de conduire des autobus transportant plus de 25 passagers
    B: Permet de conduire des taxis, des limousines et des ambulances (jusqu'à 10
      occupants)
    C: Permet de conduire uniquement des motocyclettes
    D: Permet de conduire des camions lourds équipés de freins à air
  answer: B
  explanation: Un permis de classe 4 (restreint) vous permet de conduire des taxis,
    des limousines, des ambulances et des petits autobus d'une capacité totale allant
    jusqu'à 10 personnes (conducteur compris).
- id: 27
  category: license_system
  question: 'Les étudiants à temps plein fréquentant un établissement d''enseignement
    reconnu en Colombie-Britannique et provenant d''une autre province :'
  choices:
    A: Doivent passer à un permis de la C.-B. dans les 90 jours
    B: Doivent passer à un permis de la C.-B. dans les 6 mois
    C: Peuvent conduire avec le permis de leur province d'origine tant qu'ils restent
      étudiants à temps plein
    D: Ne sont pas autorisés à conduire en Colombie-Britannique
  answer: C
  explanation: Les étudiants à temps plein dans des établissements reconnus de la
    Colombie-Britannique peuvent continuer à utiliser leur permis de conduire valide
    d'une autre province pendant la durée de leurs études.
- id: 28
  category: license_system
  question: Un permis de conduire standard de la Colombie-Britannique est généralement
    valide pendant combien d'années avant de devoir être renouvelé ?
  choices:
    A: 2 ans
    B: 5 ans
    C: 8 ans
    D: 10 ans
  answer: B
  explanation: La plupart des permis de conduire de la Colombie-Britannique sont délivrés
    pour une période de 5 ans et expirent le jour de l'anniversaire du conducteur.
- id: 29
  category: license_system
  question: Quelle classe de permis de la Colombie-Britannique est spécifiquement
    requise pour conduire une motocyclette ?
  choices:
    A: Classe 4
    B: Classe 5
    C: Classe 6
    D: Classe 8
  answer: C
  explanation: La classe 6 est le permis de motocyclette complet en Colombie-Britannique.
    La classe 8 est le permis d'apprenti ou de novice pour motocyclette.
- id: 30
  category: driver_testing
  question: Pour réussir le test de connaissances de l'ICBC pour un permis de classe
    7L, quel est le score minimal requis ?
  choices:
    A: 35 sur 50
    B: 40 sur 50
    C: 45 sur 50
    D: 30 sur 40
  answer: B
  explanation: En Colombie-Britannique, le test de connaissances se compose de 50
    questions à choix multiples, et vous devez répondre correctement à au moins 40
    d'entre elles pour réussir.
- id: 31
  category: driver_testing
  question: Lequel des défauts de véhicule suivants entraînerait le refus d'un examinateur
    de l'ICBC de mener un examen pratique ?
  choices:
    A: Un petit éclat dans le pare-brise qui n'obstrue pas la vision
    B: Un pare-brise fissuré dans la zone balayée par les essuie-glaces
    C: Un véhicule auquel il manque les enjoliveurs
    D: Un véhicule dont le réservoir de liquide lave-glace est vide
  answer: B
  explanation: Les normes de sécurité de l'ICBC pour les examens pratiques interdisent
    les véhicules dont le pare-brise est fissuré dans le champ de vision du conducteur
    ou dans la zone balayée par les essuie-glaces, car cela constitue un danger pour
    la sécurité.
- id: 32
  category: driver_testing
  question: En Colombie-Britannique, quel est le montant minimum de la couverture
    d'assurance responsabilité civile envers les tiers requis pour tous les véhicules
    ?
  choices:
    A: 100 000 $
    B: 200 000 $
    C: 500 000 $
    D: 1 000 000 $
  answer: B
  explanation: En vertu de la Loi sur les véhicules à moteur de la C.-B., la couverture
    minimale obligatoire de responsabilité civile envers les tiers fournie par l'assurance
    de base Autoplan de l'ICBC est de 200 000 $.
- id: 33
  category: driver_testing
  question: Lorsque vous déménagez en Colombie-Britannique en provenance d'une autre
    province, de combien de jours disposez-vous pour immatriculer et enregistrer votre
    véhicule auprès de l'ICBC ?
  choices:
    A: 10 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Bien que vous disposiez de 90 jours pour changer votre permis de conduire,
    vous n'avez que 30 jours pour immatriculer, enregistrer et assurer votre véhicule
    après avoir emménagé en C.-B.
- id: 34
  category: driver_testing
  question: Lors d'un examen pratique de l'ICBC, quelle est la politique concernant
    l'utilisation d'une caméra de recul ?
  choices:
    A: Les caméras de recul sont strictement interdites et doivent être couvertes.
    B: Vous pouvez utiliser la caméra, mais vous devez tout de même effectuer des
      vérifications visuelles à 360 degrés et regarder par la lunette arrière.
    C: Vous pouvez vous fier uniquement à la caméra pour toutes les manœuvres de marche
      arrière.
    D: Les caméras de recul ne peuvent être utilisées que pendant la partie du stationnement
      en parallèle de l'examen.
  answer: B
  explanation: L'ICBC autorise l'utilisation de caméras de recul comme aide secondaire,
    mais les conducteurs doivent tout de même démontrer des compétences d'observation
    appropriées, notamment en vérifiant les angles morts et en regardant par la lunette
    arrière pendant la marche arrière.
- id: 35
  category: driver_testing
  question: Laquelle de ces actions entraînera un échec automatique lors d'un examen
    pratique en Colombie-Britannique ?
  choices:
    A: Caler le moteur une fois
    B: Toucher la bordure du trottoir lors d'un stationnement en parallèle (sans monter
      dessus)
    C: Nécessiter l'intervention de l'examinateur pour prendre le contrôle du véhicule
      afin d'éviter un danger
    D: Croiser les mains sur le volant lors d'un virage
  answer: C
  explanation: Une « intervention » où l'examinateur doit prendre le contrôle du volant
    ou des freins pour prévenir un accident constitue un échec automatique à tout
    examen pratique en C.-B.
- id: 36
  category: driver_testing
  question: En Colombie-Britannique, un conducteur se situant pour la première fois
    dans la zone d'avertissement (« Warn ») du taux d'alcoolémie (0,05 à 0,08) s'expose
    à une interdiction de conduire immédiate (IRP) de combien de jours ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Pour une première infraction dans la zone d'avertissement (taux d'alcoolémie
    de 0,05 à 0,08), un conducteur s'expose à une interdiction de conduire immédiate
    de 3 jours, à une amende et à la mise en fourrière du véhicule à la discrétion
    de l'agent.
- id: 37
  category: driver_testing
  question: Dans le cadre du Programme d'amélioration des conducteurs de la Colombie-Britannique,
    qui a l'autorité d'interdire à un conducteur de conduire en fonction de son dossier
    de conduite ?
  choices:
    A: Le chef de la police locale
    B: L'examinateur de l'ICBC
    C: Le surintendant des véhicules à moteur
    D: Le premier ministre de la Colombie-Britannique
  answer: C
  explanation: Le surintendant des véhicules à moteur examine les dossiers de conduite
    et possède l'autorité légale de délivrer des interdictions de conduire dans le
    cadre du Programme d'amélioration des conducteurs.
- id: 38
  category: driver_testing
  question: Qu'est-ce que la « Surcharge de prime du conducteur » (Driver Premium
    Surcharge) en Colombie-Britannique ?
  choices:
    A: Une taxe payée par tous les nouveaux conducteurs de moins de 19 ans.
    B: Un coût d'assurance supplémentaire pour les conducteurs ayant certaines condamnations
      à haut risque, comme la vitesse excessive ou la conduite distraite.
    C: Les frais payés pour passer un examen pratique.
    D: Une réduction accordée aux conducteurs qui terminent un cours d'éducation routière
      au secondaire.
  answer: B
  explanation: 'La surcharge de prime du conducteur (DPS) est une pénalité facturée
    aux conducteurs ayant commis une ou plusieurs infractions de conduite à haut risque
    (ex. : vitesse excessive, conduite distraite) sur une période de trois ans.'
- id: 39
  category: driver_testing
  question: Si vous passez un examen pratique de classe 5 en Colombie-Britannique,
    laquelle des manœuvres suivantes est spécifiquement testée et n'est généralement
    PAS mise en avant lors de l'examen de classe 7 ?
  choices:
    A: La vérification des angles morts
    B: Le stationnement en parallèle
    C: L'insertion et la sortie d'autoroute à des vitesses plus élevées
    D: L'utilisation des clignotants
  answer: C
  explanation: L'examen pratique de classe 5 est plus avancé que celui de classe 7
    et comprend généralement des environnements de conduite plus complexes, tels que
    la conduite sur autoroute et l'insertion/sortie à haute vitesse.
- id: 40
  category: driver_testing
  question: En Colombie-Britannique, si vous échouez au test de vue lors de votre
    demande de permis, quelle est l'étape suivante ?
  choices:
    A: Vous êtes définitivement interdit de conduire.
    B: Vous devez attendre 6 mois pour repasser le test.
    C: On vous demandera de consulter un spécialiste de la vue (optométriste ou ophtalmologiste)
      et de rapporter un rapport de vision.
    D: Vous pouvez toujours passer l'examen théorique mais ne pouvez pas passer l'examen
      pratique.
  answer: C
  explanation: Si vous ne respectez pas les normes de vision minimales au bureau de
    l'ICBC, on vous remettra un formulaire à faire remplir par un spécialiste de la
    vue pour déterminer si votre vision peut être corrigée ou si vous pouvez conduire
    en toute sécurité.
- id: 41
  category: driver_testing
  question: Laquelle des conditions suivantes est requise pour le véhicule que vous
    apportez à votre examen pratique de l'ICBC ?
  choices:
    A: Il doit s'agir d'un véhicule à double commande de freinage.
    B: Il doit avoir une vignette d'assurance valide sur la plaque d'immatriculation
      (ou des documents d'immatriculation valides).
    C: Il doit s'agir d'une voiture compacte ou sous-compacte.
    D: Il doit avoir été fabriqué au cours des 10 dernières années.
  answer: B
  explanation: Le véhicule doit être correctement assuré, immatriculé et en bon état
    de fonctionnement (y compris les feux, le klaxon et les ceintures de sécurité)
    pour être utilisé lors d'un examen pratique.
- id: 42
  category: driver_testing
  question: En Colombie-Britannique, à quelle fréquence les primes de points de démérite
    (DPP - Driver Penalty Point) sont-elles facturées à un conducteur ?
  choices:
    A: Chaque fois que vous recevez une contravention.
    B: Une fois par an, sur la base des points accumulés au cours d'une période d'évaluation
      de 12 mois.
    C: Tous les cinq ans lors du renouvellement de votre permis.
    D: Mensuellement, dans le cadre de votre paiement d'assurance.
  answer: B
  explanation: Les primes DPP sont distinctes de l'assurance et sont facturées annuellement
    si un conducteur accumule 4 points ou plus au cours de sa période d'évaluation.
- id: 43
  category: driver_testing
  question: Quel est l'âge minimum pour demander un permis commercial de classe 4
    (restreint) en Colombie-Britannique, qui permet de conduire des taxis et des véhicules
    de transport avec chauffeur ?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: B
  explanation: Pour demander un permis commercial de classe 4 en Colombie-Britannique,
    vous devez avoir au moins 19 ans et détenir un permis de classe 5 ou 6 valide
    (ou l'équivalent).
- id: 44
  category: driver_testing
  question: Quelle est l'acuité visuelle minimale requise pour réussir l'examen de
    la vue pour un permis de classe 5 ou 7 en Colombie-Britannique ?
  choices:
    A: 20/20 dans les deux yeux
    B: 20/30 dans le meilleur œil
    C: 20/40 avec les deux yeux ouverts et examinés ensemble
    D: 20/50 dans au moins un œil
  answer: C
  explanation: L'ICBC exige une acuité visuelle minimale de 20/40 avec les deux yeux
    ouverts et examinés ensemble, avec ou sans lentilles correctrices, pour un permis
    de véhicule de tourisme standard.
- id: 45
  category: driver_testing
  question: Lors d'un examen pratique en Colombie-Britannique, laquelle des défectuosités
    suivantes du véhicule entraînerait l'annulation de l'examen avant qu'il ne commence
    ?
  choices:
    A: Un petit éclat dans le pare-brise en dehors du champ de vision du conducteur
    B: Un réservoir de liquide lave-glace vide
    C: Un feu de freinage côté passager qui ne fonctionne pas
    D: Une bosse mineure sur le pare-chocs arrière
  answer: C
  explanation: Pour un examen pratique, le véhicule doit être sécuritaire et répondre
    aux exigences légales. Un feu de freinage ou un clignotant qui ne fonctionne pas,
    ou un pare-brise fissuré dans le champ de vision du conducteur, sont des motifs
    fréquents d'annulation d'un examen par les examinateurs de l'ICBC.
- id: 46
  category: driver_testing
  question: Combien de questions comporte l'examen théorique de classe 7L de la Colombie-Britannique,
    et quel est le score de passage ?
  choices:
    A: 40 questions ; 30 bonnes réponses
    B: 50 questions ; 40 bonnes réponses
    C: 25 questions ; 20 bonnes réponses
    D: 60 questions ; 50 bonnes réponses
  answer: B
  explanation: L'examen théorique de l'ICBC se compose de 50 questions à choix multiples.
    Vous devez répondre correctement à 40 d'entre elles (80 %) pour réussir.
- id: 47
  category: driver_testing
  question: En Colombie-Britannique, la prime de risque du conducteur (DRP - Driver
    Risk Premium) est un paiement annuel exigé des conducteurs qui ont quel élément
    à leur dossier ?
  choices:
    A: Une contravention de stationnement
    B: Une seule contravention pour excès de vitesse de 10 km/h au-dessus de la limite
    C: Une ou plusieurs condamnations pour « excès de vitesse excessif »
    D: Une tentative de stationnement en parallèle échouée lors d'un examen pratique
  answer: C
  explanation: La prime de risque du conducteur (DRP) est une charge distincte des
    amendes et est facturée annuellement aux conducteurs ayant commis des infractions
    à haut risque, telles que l'excès de vitesse excessif (40 km/h+ au-dessus de la
    limite), les interdictions de conduire ou les condamnations liées à l'alcool.
- id: 48
  category: driver_testing
  question: Quel est le champ de vision horizontal minimum requis pour réussir l'examen
    de la vue de l'ICBC pour un permis de classe 5 ?
  choices:
    A: 90 degrés
    B: 100 degrés
    C: 120 degrés
    D: 180 degrés
  answer: C
  explanation: Pour répondre aux normes de vision pour un permis de classe 5 ou 7
    en Colombie-Britannique, un conducteur doit avoir un champ de vision horizontal
    continu d'au moins 120 degrés.
- id: 49
  category: driver_testing
  question: Lors d'un examen pratique de classe 7 (Novice), un conducteur doit faire
    preuve de « perception des dangers ». En quoi cela consiste-t-il ?
  choices:
    A: Identifier et nommer les dangers potentiels tout en conduisant
    B: Effectuer un arrêt d'urgence contrôlé à partir de 50 km/h
    C: Traverser une zone de travaux sans ralentir
    D: Utiliser une application mobile pour signaler les dangers routiers à l'ICBC
  answer: A
  explanation: Pendant l'examen pratique de classe 7, l'examinateur demandera au conducteur
    d'identifier les dangers qu'il voit (par exemple, des piétons, des portières de
    voiture qui s'ouvrent, des plaques de glace) pour démontrer qu'il surveille efficacement
    l'environnement.
- id: 50
  category: driver_testing
  question: Êtes-vous autorisé à utiliser la caméra de recul intégrée d'un véhicule
    lors d'un examen pratique en Colombie-Britannique ?
  choices:
    A: Non, la caméra doit être recouverte de ruban adhésif
    B: Oui, mais vous devez toujours utiliser principalement les rétroviseurs et effectuer
      des vérifications d'épaule à 360 degrés
    C: Oui, elle peut être votre seule source de vision lors de la marche arrière
    D: Seulement si vous avez une exemption médicale
  answer: B
  explanation: L'ICBC autorise l'utilisation de caméras de recul et de capteurs de
    stationnement, mais ils sont considérés comme des « aides à la conduite ». Vous
    échouerez si vous vous fiez uniquement à eux et n'effectuez pas les vérifications
    d'épaule physiques et les balayages des rétroviseurs requis.
- id: 51
  category: driver_testing
  question: Si un conducteur du Programme de licence graduée (GLP) doit passer un
    examen médical du conducteur, qui est responsable du paiement des honoraires du
    médecin ?
  choices:
    A: L'ICBC
    B: Le gouvernement provincial (MSP)
    C: Le conducteur
    D: La compagnie d'assurance du conducteur
  answer: C
  explanation: En Colombie-Britannique, tous les frais facturés par un médecin pour
    remplir un rapport d'examen médical du conducteur (DMER) sont à la charge du conducteur
    et ne sont pas couverts par le MSP ou l'ICBC.
- id: 52
  category: driver_testing
  question: Que se passe-t-il si vous vous présentez à votre examen de conduite en
    Colombie-Britannique et que le tableau de bord de votre véhicule affiche un témoin
    d'avertissement « Airbag » (coussin gonflable) actif ?
  choices:
    A: L'examen se déroule normalement
    B: L'examinateur désactivera l'airbag et continuera
    C: L'examen sera annulé car le véhicule est jugé dangereux
    D: Vous recevrez une pénalité de 5 points mais pourrez tout de même passer l'examen
  answer: C
  explanation: Les normes de sécurité de l'ICBC pour les véhicules d'examen de conduite
    exigent qu'aucun témoin d'avertissement de sécurité (comme l'ABS ou les airbags)
    ne soit allumé, car ils indiquent une défaillance potentielle de l'équipement
    de sécurité.
- id: 53
  category: driver_testing
  question: Dans le cadre du Programme d'amélioration des conducteurs (Driver Improvement
    Program), quel est le seuil de points habituel à partir duquel un conducteur novice
    (classe 7N) recevra une lettre d'avertissement ?
  choices:
    A: 2 à 6 points
    B: 10 à 12 points
    C: 15 points
    D: 20 points
  answer: A
  explanation: Les conducteurs novices sont soumis à des normes plus strictes. Ils
    reçoivent généralement une lettre d'avertissement entre 2 et 6 points et peuvent
    faire l'objet d'une interdiction de conduire avec seulement 2 à 6 points, selon
    la gravité des infractions.
- id: 54
  category: driver_testing
  question: L'« Évaluation routière améliorée » (ERA) en Colombie-Britannique est
    le plus souvent requise pour quel groupe de conducteurs ?
  choices:
    A: Les conducteurs demandant un permis de moto
    B: Les conducteurs ayant échoué trois fois à leur examen théorique
    C: Les conducteurs ayant des problèmes de santé signalés ou les aînés dont l'aptitude
      à conduire est en cours d'évaluation
    D: Les chauffeurs de camions professionnels
  answer: C
  explanation: L'évaluation routière améliorée (ERA) est une évaluation non notée
    utilisée par RoadSafetyBC pour déterminer si un conducteur (souvent des aînés
    ou des personnes ayant des problèmes de santé) peut continuer à conduire en toute
    sécurité.
- id: 55
  category: driver_responsibility
  question: 'Si vous êtes impliqué dans un accident de la route en Colombie-Britannique
    où seuls des dommages matériels surviennent, vous devez le signaler à la police
    si les dommages semblent dépasser :'
  choices:
    A: 1 000 $
    B: 2 500 $
    C: 5 000 $
    D: 10 000 $
  answer: D
  explanation: Selon la loi sur les véhicules à moteur de la Colombie-Britannique
    (BC Motor Vehicle Act), les accidents avec dommages matériels uniquement doivent
    être signalés à la police si les dommages dépassent 10 000 $ (1 000 $ pour les
    motos et 600 $ pour les vélos).
- id: 56
  category: driver_responsibility
  question: Un nouveau résident de la Colombie-Britannique doit immatriculer son véhicule
    auprès de l'ICBC dans un délai de combien de jours après son installation dans
    la province ?
  choices:
    A: 10 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Bien que vous disposiez de 90 jours pour changer votre permis de conduire,
    vous n'avez que 30 jours pour immatriculer et assurer votre véhicule après avoir
    emménagé en Colombie-Britannique.
- id: 57
  category: driver_responsibility
  question: Lors de la vente d'un véhicule immatriculé en Colombie-Britannique, le
    vendeur doit remettre à l'acheteur un formulaire de transfert/taxe (APV9T) signé.
    De combien de jours l'acheteur dispose-t-il pour enregistrer le transfert auprès
    de l'ICBC ?
  choices:
    A: 10 jours
    B: 15 jours
    C: 30 jours
    D: Immédiatement
  answer: A
  explanation: En Colombie-Britannique, l'acheteur d'un véhicule doit enregistrer
    le transfert de propriété auprès de l'ICBC dans les 10 jours suivant la date d'achat.
- id: 58
  category: driver_responsibility
  question: Dans le cadre du système de points de pénalité du conducteur (DPP), à
    partir de quel seuil de points un conducteur commence-t-il à payer une prime de
    points de pénalité ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: En Colombie-Britannique, les conducteurs se voient imposer une prime
    de points de pénalité s'ils accumulent quatre points ou plus au cours d'une période
    d'évaluation de 12 mois.
- id: 59
  category: driver_responsibility
  question: Quelle est l'amende en Colombie-Britannique pour la conduite d'un véhicule
    à moteur sans assurance valide ?
  choices:
    A: 167 $
    B: 368 $
    C: 598 $
    D: 1 200 $
  answer: C
  explanation: Conduire sans assurance en Colombie-Britannique entraîne une amende
    importante de 598 $, et le véhicule peut être remorqué.
- id: 60
  category: driver_responsibility
  question: Dans le cadre du modèle d'assurance « Soins améliorés » (Enhanced Care)
    de la Colombie-Britannique, quel est le principal avantage concernant les frais
    médicaux et de réadaptation après un accident ?
  choices:
    A: Les prestations ne sont versées qu'au conducteur qui n'était pas responsable.
    B: Les prestations sont accessibles à tous les résidents de la Colombie-Britannique,
      quel que soit le responsable.
    C: Les prestations sont plafonnées à 50 000 $ par personne.
    D: Les prestations ne sont disponibles que si vous poursuivez l'autre conducteur.
  answer: B
  explanation: Le modèle « Soins améliorés » de la Colombie-Britannique est un modèle
    « sans égard à la responsabilité », ce qui signifie que tous les résidents de
    la province blessés dans un accident ont accès à des prestations médicales et
    de réadaptation, peu importe qui a causé l'accident.
- id: 61
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident, quelles informations êtes-vous
    légalement tenu d'échanger avec l'autre ou les autres conducteurs ?
  choices:
    A: Le nom, l'adresse et le numéro de téléphone uniquement.
    B: Le nom, l'adresse, le numéro de plaque d'immatriculation du véhicule et les
      informations d'assurance.
    C: Le numéro de permis de conduire et les informations de carte de crédit.
    D: Aucune information n'est requise s'il n'y a pas de blessés.
  answer: B
  explanation: Les conducteurs impliqués dans un accident doivent fournir leur nom,
    leur adresse, le numéro de plaque d'immatriculation du véhicule et leurs informations
    d'assurance à l'autre partie ainsi qu'à toute personne blessée.
- id: 62
  category: driver_responsibility
  question: Laquelle des conditions suivantes est requise pour qu'un véhicule provenant
    d'une autre province puisse être immatriculé en Colombie-Britannique ?
  choices:
    A: Il doit être peint d'une couleur neutre.
    B: Il doit passer une inspection de sécurité provinciale dans un établissement
      désigné.
    C: Il doit avoir moins de 100 000 kilomètres au compteur.
    D: Il doit avoir moins de 5 ans.
  answer: B
  explanation: La plupart des véhicules provenant de l'extérieur de la Colombie-Britannique
    doivent passer une inspection de sécurité provinciale dans un centre d'inspection
    désigné avant de pouvoir être immatriculés et assurés dans la province.
- id: 63
  category: driver_responsibility
  question: 'En Colombie-Britannique, le « Facteur conducteur » utilisé pour déterminer
    les primes d''assurance est principalement basé sur :'
  choices:
    A: L'âge et le sexe du conducteur.
    B: La valeur et la cote de sécurité du véhicule.
    C: Les années d'expérience de conduite et l'historique d'accidents du conducteur.
    D: Le quartier où réside le conducteur.
  answer: C
  explanation: Le modèle d'assurance d'ICBC utilise un « Facteur conducteur » qui
    analyse les années d'expérience d'un conducteur et son historique d'accidents
    responsables.
- id: 64
  category: driver_responsibility
  question: Si vous vendez votre véhicule en Colombie-Britannique, que devez-vous
    faire des plaques d'immatriculation ?
  choices:
    A: Les laisser sur le véhicule pour le nouveau propriétaire.
    B: Les retirer et les garder, ou les remettre à un courtier d'ICBC.
    C: Les jeter immédiatement.
    D: Les donner à la police.
  answer: B
  explanation: En Colombie-Britannique, les plaques d'immatriculation appartiennent
    au propriétaire, pas au véhicule. Lors de la vente d'un véhicule, vous devez retirer
    vos plaques. Vous pouvez éventuellement les transférer sur un nouveau véhicule
    ou les rendre pour obtenir un remboursement sur la portion d'assurance restante.
- id: 65
  category: driver_responsibility
  question: Est-il légal de stationner un véhicule non assuré sur une voie publique
    en Colombie-Britannique ?
  choices:
    A: Oui, tant qu'il n'est pas conduit.
    B: Oui, mais seulement pour une durée maximale de 48 heures.
    C: Non, tout véhicule sur une voie publique doit être assuré.
    D: Oui, si le propriétaire habite dans cette rue.
  answer: C
  explanation: En Colombie-Britannique, tout véhicule stationné ou utilisé sur une
    voie publique doit détenir une assurance de base valide et afficher des plaques
    d'immatriculation valides.
- id: 66
  category: driver_responsibility
  question: 'En vertu de la Motor Vehicle Act de la Colombie-Britannique, si vous
    heurtez un véhicule sans surveillance et que vous ne trouvez pas le propriétaire,
    vous devez :'
  choices:
    A: Attendre sur les lieux pendant au moins deux heures.
    B: Laisser une note avec votre nom, votre adresse, ainsi que le nom et l'adresse
      du propriétaire du véhicule que vous conduisez.
    C: Partir s'il n'y a pas de dommages visibles.
    D: Appeler une dépanneuse pour déplacer l'autre véhicule.
  answer: B
  explanation: Si vous heurtez un véhicule sans surveillance, vous êtes légalement
    tenu de laisser une note dans un endroit bien en vue sur ce véhicule avec vos
    coordonnées et les informations du propriétaire du véhicule.
- id: 67
  category: driver_responsibility
  question: En Colombie-Britannique, qui est responsable de s'assurer qu'un passager
    de moins de 16 ans porte sa ceinture de sécurité ?
  choices:
    A: Le passager lui-même.
    B: Les parents du passager, même s'ils ne sont pas dans la voiture.
    C: Le conducteur du véhicule.
    D: Le propriétaire du véhicule, peu importe qui conduit.
  answer: C
  explanation: Le conducteur est légalement responsable de s'assurer que tous les
    passagers de moins de 16 ans sont correctement attachés avec une ceinture de sécurité
    ou un dispositif de retenue pour enfants approprié.
- id: 68
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident de la route en Colombie-Britannique
    où une personne a été blessée, quelle est votre obligation légale immédiate ?
  choices:
    A: Signaler l'accident à ICBC dans les 24 heures seulement.
    B: Échanger les informations d'assurance et partir.
    C: Rester sur les lieux, porter toute l'assistance possible et signaler l'accident
      à la police.
    D: Se rendre immédiatement au centre de réclamation d'ICBC le plus proche.
  answer: C
  explanation: En vertu de la Motor Vehicle Act de la Colombie-Britannique, les conducteurs
    doivent rester sur les lieux, porter assistance aux blessés et signaler immédiatement
    à la police tout accident impliquant des blessures ou un décès.
- id: 69
  category: driver_responsibility
  question: Si vous entrez en collision avec un véhicule stationné et que le propriétaire
    n'est pas présent, que devez-vous légalement faire en Colombie-Britannique ?
  choices:
    A: Attendre 10 minutes, puis partir si personne ne se présente.
    B: Le signaler à ICBC uniquement si les dommages dépassent 2 000 $.
    C: Laisser une note dans un endroit bien en vue avec votre nom, votre adresse,
      le nom/adresse du propriétaire du véhicule (si différent) et le numéro de plaque.
    D: Appeler une dépanneuse pour déplacer l'autre véhicule.
  answer: C
  explanation: La Motor Vehicle Act de la Colombie-Britannique exige que les conducteurs
    qui heurtent un véhicule sans surveillance laissent un avis écrit contenant leurs
    coordonnées et les informations relatives au véhicule.
- id: 70
  category: driver_responsibility
  question: En Colombie-Britannique, où est-il légal de garder un véhicule qui n'a
    pas d'assurance valide ni de plaques d'immatriculation ?
  choices:
    A: Dans une rue résidentielle calme.
    B: Dans un stationnement public.
    C: Uniquement sur une propriété privée.
    D: Sur l'accotement d'une autoroute.
  answer: C
  explanation: Les véhicules non assurés ne peuvent être conduits ou stationnés sur
    aucune voie publique en Colombie-Britannique ; ils doivent être conservés sur
    une propriété privée.
- id: 71
  category: driver_responsibility
  question: Quel est le nom du document officiel requis pour transférer la propriété
    d'un véhicule en Colombie-Britannique ?
  choices:
    A: Formulaire T-1
    B: APV9T
    C: BC-TRANS-01
    D: ICBC-SALE-10
  answer: B
  explanation: L'APV9T est le formulaire de transfert/taxe fourni par l'ICBC qui doit
    être signé par le vendeur et l'acheteur pour transférer légalement un véhicule.
- id: 72
  category: driver_responsibility
  question: Pendant combien d'années une condamnation grave (comme un grand excès
    de vitesse) reste-t-elle à votre dossier aux fins du calcul de la prime de risque
    du conducteur (DRP) ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: C
  explanation: L'ICBC examine votre dossier de conduite sur une période de trois ans
    pour déterminer si vous êtes redevable d'une prime de risque du conducteur (Driver
    Risk Premium).
- id: 73
  category: driver_responsibility
  question: Laquelle des couvertures d'assurance suivantes est « facultative » (non
    obligatoire) en Colombie-Britannique ?
  choices:
    A: Responsabilité civile envers les tiers (jusqu'à 200 000 $)
    B: Prestations d'accident améliorées
    C: Couverture collision et accidents sans collision (garantie complète)
    D: Protection contre les automobilistes sous-assurés
  answer: C
  explanation: Alors que la responsabilité civile et les prestations d'accident font
    partie de l'assurance de base obligatoire (Basic Autoplan), les couvertures collision
    et accidents sans collision sont facultatives.
- id: 74
  category: driver_responsibility
  question: Quelle est la conséquence si un conducteur ne paie pas sa facture de points
    de pénalité (DPP) ou de prime de risque du conducteur (DRP) ?
  choices:
    A: Il recevra une amende de 50 $
    B: Il ne pourra pas renouveler son permis de conduire ni l'assurance de son véhicule
    C: Son véhicule sera immédiatement mis en fourrière
    D: Rien, car il s'agit de frais facultatifs
  answer: B
  explanation: L'ICBC refusera de délivrer ou de renouveler un permis de conduire
    ou une assurance de véhicule si le conducteur a une dette impayée liée aux primes
    DPP ou DRP.
- id: 75
  category: safe_driving_rules
  question: En Colombie-Britannique, quelle est la limite de vitesse par défaut à
    l'intérieur d'une municipalité, sauf indication contraire ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: Selon la loi sur les véhicules à moteur de la Colombie-Britannique
    (BC Motor Vehicle Act), la limite de vitesse dans une municipalité est de 50 km/h,
    à moins que des panneaux n'indiquent le contraire.
- id: 76
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse dans une zone
    scolaire en Colombie-Britannique lorsque l'école est en session ?
  choices:
    A: 20 km/h entre 8 h et 16 h
    B: 30 km/h entre 8 h et 17 h
    C: 30 km/h entre 7 h et 19 h
    D: 40 km/h entre 8 h et 17 h
  answer: B
  explanation: En Colombie-Britannique, les limites de vitesse en zone scolaire sont
    de 30 km/h de 8 h à 17 h les jours d'école, sauf indication contraire.
- id: 77
  category: safe_driving_rules
  question: Quelles sont les heures d'application de la limite de vitesse de 30 km/h
    dans une zone de jeux en Colombie-Britannique ?
  choices:
    A: De 8 h à 17 h tous les jours
    B: De 8 h à 20 h tous les jours
    C: De l'aube au crépuscule tous les jours
    D: 24 heures sur 24
  answer: C
  explanation: Les zones de jeux en Colombie-Britannique sont en vigueur de l'aube
    au crépuscule, tous les jours de l'année.
- id: 78
  category: safe_driving_rules
  question: En Colombie-Britannique, quelle est la distance minimale à laquelle vous
    devez vous garer d'une borne d'incendie ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 6 mètres
  answer: C
  explanation: La loi sur les véhicules à moteur de la Colombie-Britannique interdit
    de se garer à moins de 5 mètres d'une borne d'incendie.
- id: 79
  category: safe_driving_rules
  question: À quelle distance devez-vous vous garer d'un panneau d'arrêt, d'un feu
    de circulation ou d'un passage pour piétons marqué en Colombie-Britannique ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 6 mètres
    D: 10 mètres
  answer: C
  explanation: En Colombie-Britannique, les conducteurs ne doivent pas se garer à
    moins de 6 mètres d'un panneau d'arrêt, d'un feu de circulation ou d'un passage
    pour piétons.
- id: 80
  category: safe_driving_rules
  question: En vertu de la loi « Move Over » de la Colombie-Britannique, si la limite
    de vitesse affichée est de 80 km/h ou plus, à quelle vitesse devez-vous ralentir
    lorsque vous dépassez un véhicule d'urgence dont les feux clignotent ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: D
  explanation: Si la limite de vitesse est de 80 km/h ou plus, les conducteurs doivent
    ralentir à 70 km/h. Si la limite est inférieure à 80 km/h, ils doivent ralentir
    à 40 km/h.
- id: 81
  category: safe_driving_rules
  question: En Colombie-Britannique, quand est-il légal de tourner à gauche au feu
    rouge après avoir marqué un arrêt complet et cédé le passage à la circulation
    et aux piétons ?
  choices:
    A: Jamais
    B: D'une rue à double sens vers une rue à sens unique
    C: D'une rue à sens unique vers une autre rue à sens unique
    D: À n'importe quelle intersection après minuit
  answer: C
  explanation: En Colombie-Britannique, vous pouvez tourner à gauche au feu rouge
    uniquement si vous passez d'une rue à sens unique à une autre rue à sens unique,
    à condition de vous arrêter d'abord et de céder le passage.
- id: 82
  category: safe_driving_rules
  question: Lorsque vous conduisez dans une ville ou une agglomération en Colombie-Britannique,
    combien de temps à l'avance devez-vous signaler avant d'effectuer un virage ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: B
  explanation: L'ICBC recommande de signaler au moins 30 mètres avant de tourner en
    circulation urbaine pour avertir suffisamment les autres conducteurs.
- id: 83
  category: safe_driving_rules
  question: Que signifie une double ligne jaune continue au centre d'une chaussée
    en Colombie-Britannique ?
  choices:
    A: Le dépassement est autorisé si la voie est libre
    B: Le dépassement est interdit
    C: Le dépassement est autorisé uniquement pendant la journée
    D: Elle marque une voie réservée aux véhicules multioccupants (VMO)
  answer: B
  explanation: Une double ligne jaune continue signifie que le dépassement est interdit
    dans les deux sens.
- id: 84
  category: safe_driving_rules
  question: Selon la réglementation de 2024 de la Colombie-Britannique, quelle est
    la distance minimale qu'un conducteur doit maintenir lorsqu'il dépasse un cycliste
    sur une route dont la limite de vitesse est de 50 km/h ou moins ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: Les nouvelles lois de la Colombie-Britannique exigent une distance
    de dépassement minimale de 1 mètre pour les cyclistes sur les routes dont la limite
    de vitesse est de 50 km/h ou moins, et de 1,5 mètre sur les routes de plus de
    50 km/h.
- id: 85
  category: safe_driving_rules
  question: À l'approche d'un passage à niveau en Colombie-Britannique, quelle est
    la distance minimale à laquelle vous devez vous arrêter du rail le plus proche
    si un train approche ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Les conducteurs doivent s'arrêter à au moins 5 mètres du rail le plus
    proche à un passage à niveau lorsqu'un train approche.
- id: 86
  category: safe_driving_rules
  question: En Colombie-Britannique, quelle est la distance de suivi recommandée derrière
    un autre véhicule dans des conditions météorologiques idéales ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: Une longueur de voiture pour chaque 10 km/h
  answer: B
  explanation: L'ICBC recommande une distance de suivi minimale de 2 secondes dans
    des conditions idéales et de 3 secondes sur les routes à grande vitesse.
- id: 87
  category: safe_driving_rules
  question: Si deux véhicules arrivent en même temps à un arrêt à quatre sens en Colombie-Britannique,
    qui a la priorité de passage ?
  choices:
    A: Le véhicule à gauche
    B: Le véhicule à droite
    C: Le véhicule circulant à la vitesse la plus élevée
    D: Le véhicule sur la rue la plus fréquentée
  answer: B
  explanation: Si deux véhicules arrivent à un arrêt à quatre sens en même temps,
    le conducteur à gauche doit céder le passage au conducteur à droite.
- id: 88
  category: safe_driving_rules
  question: En Colombie-Britannique, à quelle distance devez-vous passer en feux de
    croisement lorsque vous approchez d'un véhicule venant en sens inverse avec vos
    feux de route ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Le Motor Vehicle Act de la Colombie-Britannique exige que les conducteurs
    passent en feux de croisement à moins de 150 mètres d'un véhicule venant en sens
    inverse.
- id: 89
  category: safe_driving_rules
  question: En Colombie-Britannique, qu'indique généralement un feu vert clignotant
    à une intersection ?
  choices:
    A: Le feu est sur le point de passer au rouge
    B: Il s'agit d'un signal commandé par les piétons
    C: Vous avez un virage à gauche protégé
    D: L'intersection est en travaux
  answer: B
  explanation: En Colombie-Britannique, un feu vert clignotant indique un signal commandé
    par les piétons. Les conducteurs peuvent avancer mais doivent surveiller les piétons
    qui pourraient activer le feu.
- id: 90
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse dans une zone
    scolaire les jours d'école entre 8 h et 17 h ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: En Colombie-Britannique, les limites de vitesse en zone scolaire sont
    de 30 km/h de 8 h à 17 h les jours d'école, sauf indication contraire.
- id: 91
  category: safe_driving_rules
  question: En Colombie-Britannique, quand les limites de vitesse de 30 km/h dans
    les zones de jeux sont-elles en vigueur ?
  choices:
    A: De 8h à 17h en semaine
    B: De 8h à 20h tous les jours
    C: De l'aube au crépuscule tous les jours
    D: 24 heures sur 24
  answer: C
  explanation: Les limites de vitesse de 30 km/h dans les zones de jeux sont en vigueur
    de l'aube au crépuscule, tous les jours de l'année.
- id: 92
  category: safe_driving_rules
  question: Quand un conducteur est-il autorisé à effectuer un virage à gauche au
    feu rouge en Colombie-Britannique ?
  choices:
    A: Jamais
    B: Uniquement d'une rue à sens unique vers une autre rue à sens unique après un
      arrêt complet
    C: Uniquement s'il n'y a pas de panneau « Interdiction de tourner au rouge »
    D: D'une rue à double sens vers une rue à sens unique après un arrêt complet
  answer: B
  explanation: En C.-B., vous pouvez tourner à gauche au feu rouge uniquement lorsque
    vous passez d'une rue à sens unique à une autre rue à sens unique, à condition
    de marquer un arrêt complet et de céder le passage à tout le trafic et aux piétons.
- id: 93
  category: safe_driving_rules
  question: Lequel des véhicules suivants n'est PAS autorisé à utiliser les voies
    réservées aux véhicules multioccupants (VMO - HOV) en C.-B., quel que soit le
    nombre d'occupants ?
  choices:
    A: Véhicules d'urgence
    B: Motocyclettes
    C: Autobus
    D: Camions lourds avec un PNB (GVW) de plus de 5 500 kg
  answer: D
  explanation: Les voies VMO sont destinées aux autobus, aux motocyclettes et aux
    véhicules respectant les exigences d'occupation. Les camions lourds (plus de 5
    500 kg) sont généralement exclus, sauf indication contraire par la signalisation.
- id: 94
  category: safe_driving_rules
  question: Sous quelle condition est-il légal de dépasser un autre véhicule par la
    droite en Colombie-Britannique ?
  choices:
    A: Lorsque le véhicule devant tourne à gauche et qu'il y a une voie disponible
      ou un accotement revêtu
    B: Lorsque vous êtes pressé et que le véhicule dans la voie de gauche est lent
    C: En conduisant sur une route à deux voies avec un accotement en gravier
    D: Il n'est jamais légal de dépasser par la droite
  answer: A
  explanation: Vous pouvez dépasser par la droite si vous êtes sur une route à plusieurs
    voies ou si le véhicule devant tourne à gauche et qu'il y a une surface revêtue
    ou une voie pour le faire en toute sécurité sans quitter la chaussée.
- id: 95
  category: safe_driving_rules
  question: En Colombie-Britannique, le « grand excès de vitesse » est défini comme
    le fait de conduire à combien de km/h au-dessus de la limite de vitesse affichée
    ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: C
  explanation: Le grand excès de vitesse en C.-B. est défini comme le fait de conduire
    à plus de 40 km/h au-dessus de la limite de vitesse affichée, ce qui entraîne
    la mise en fourrière immédiate du véhicule.
- id: 96
  category: safe_driving_rules
  question: Lorsqu'un autobus de transport en commun signale son intention de quitter
    la bordure du trottoir pour s'insérer dans la circulation, que doivent faire les
    autres conducteurs sur une route où la limite de vitesse est de 60 km/h ou moins
    ?
  choices:
    A: Maintenir leur vitesse et leur position
    B: Klaxonner pour avertir le chauffeur de l'autobus
    C: Céder le passage à l'autobus
    D: Accélérer pour dépasser l'autobus rapidement
  answer: C
  explanation: En C.-B., les conducteurs doivent céder le passage à un autobus de
    transport en commun qui a signalé son intention de s'insérer dans le flux de la
    circulation depuis un arrêt d'autobus ou la bordure du trottoir, à condition que
    la limite de vitesse soit de 60 km/h ou moins.
- id: 97
  category: safe_driving_rules
  question: Dans des conditions idéales, quelle est la distance de sécurité recommandée
    derrière le véhicule qui vous précède en C.-B. ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: La longueur d'une voiture pour chaque 10 km/h
  answer: B
  explanation: L'ICBC recommande une distance de sécurité minimale d'au moins 2 secondes
    derrière le véhicule qui vous précède par beau temps et dans des conditions routières
    idéales.
- id: 98
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule en pente ascendante sur une rue avec
    une bordure de trottoir, comment les roues avant doivent-elles être tournées ?
  choices:
    A: Vers la bordure
    B: À l'opposé de la bordure (vers le centre de la route)
    C: Parallèles à la bordure
    D: Cela n'a pas d'importance
  answer: B
  explanation: Lors d'un stationnement en pente ascendante avec une bordure, tournez
    les roues vers le centre de la route (à l'opposé de la bordure) de sorte que si
    le véhicule recule, l'arrière du pneu avant frappe la bordure et s'arrête.
- id: 99
  category: safe_driving_rules
  question: Lorsque vous conduisez de nuit, vous devez passer en feux de croisement
    lorsque vous vous trouvez à moins de combien de mètres d'un véhicule venant en
    sens inverse ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Le Motor Vehicle Act de la C.-B. exige que les conducteurs passent
    aux feux de croisement lorsqu'un véhicule venant en sens inverse se trouve à moins
    de 150 mètres.
- id: 100
  category: defensive_driving
  question: Lorsque vous conduisez sur des autoroutes à grande vitesse en C.-B., ou
    lorsque vous suivez une motocyclette, quelle est la distance de sécurité recommandée
    ?
  choices:
    A: 2 secondes
    B: 3 secondes
    C: 4 secondes
    D: 5 secondes
  answer: B
  explanation: L'ICBC recommande d'augmenter votre distance de sécurité à au moins
    trois secondes sur les autoroutes ou lorsque vous suivez des motocyclettes, car
    celles-ci peuvent s'arrêter très rapidement.
- id: 101
  category: defensive_driving
  question: Pour maintenir une bonne « avance visuelle » lors de la conduite en milieu
    urbain, à quelle distance devant vous devriez-vous balayer du regard ?
  choices:
    A: 5 secondes
    B: 12 secondes
    C: 20 secondes
    D: 30 secondes
  answer: B
  explanation: En conduite urbaine, vous devriez balayer du regard environ 12 secondes
    devant vous (soit un à deux pâtés de maisons) pour anticiper les dangers avant
    qu'ils ne deviennent des urgences.
- id: 102
  category: defensive_driving
  question: Selon la Loi sur les véhicules à moteur de la C.-B., à quelle distance
    d'un véhicule venant en sens inverse devez-vous passer de vos feux de route aux
    feux de croisement ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 250 mètres
  answer: B
  explanation: L'article 162 du règlement de la Loi sur les véhicules à moteur de
    la C.-B. exige que les conducteurs passent aux feux de croisement lorsqu'un véhicule
    arrivant en sens inverse se trouve à moins de 150 mètres.
- id: 103
  category: defensive_driving
  question: 'En Colombie-Britannique, vous devez passer de vos feux de route aux feux
    de croisement lorsque vous suivez un autre véhicule à une distance de :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Vous devez baisser vos phares lorsque vous suivez un autre véhicule
    à moins de 150 mètres pour éviter d'éblouir le conducteur devant vous via ses
    rétroviseurs.
- id: 104
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une autoroute
    mouillée de la C.-B., quelle est la bonne manœuvre de conduite préventive ?
  choices:
    A: Freiner brusquement pour retrouver de la traction
    B: Accélérer légèrement pour traverser l'eau
    C: Relâcher l'accélérateur et diriger le volant dans la direction où vous voulez
      aller
    D: Mettre le véhicule au point mort et pomper les freins
  answer: C
  explanation: En cas d'aquaplanage, vous devez relâcher l'accélérateur, maintenir
    le volant droit et éviter de freiner jusqu'à ce que vos pneus retrouvent le contact
    avec la route.
- id: 105
  category: defensive_driving
  question: Lors du balayage visuel d'une intersection avant d'y pénétrer, quelle
    est la séquence d'observation correcte recommandée par l'ICBC ?
  choices:
    A: Gauche, droite, gauche
    B: Droite, gauche, droite
    C: Gauche, centre, droite, puis gauche à nouveau
    D: Centre, gauche, droite
  answer: C
  explanation: L'ICBC recommande de regarder à gauche, au centre, à droite, puis à
    nouveau à gauche pour s'assurer qu'aucun danger ne s'approche des côtés avant
    de s'engager.
- id: 106
  category: defensive_driving
  question: Sur de nombreuses autoroutes de la C.-B., les pneus d'hiver ou les chaînes
    sont légalement obligatoires entre quelles dates ?
  choices:
    A: Du 1er septembre au 31 mars
    B: Du 1er octobre au 30 avril
    C: Du 1er novembre au 1er mars
    D: Du 31 octobre au 31 mars
  answer: B
  explanation: En C.-B., les pneus d'hiver ou les chaînes sont obligatoires sur la
    plupart des autoroutes désignées du 1er octobre au 31 mars, bien que pour certains
    cols de montagne, cette période soit prolongée jusqu'au 30 avril.
- id: 107
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais en Colombie-Britannique,
    quel réglage de phares devez-vous utiliser pour une sécurité maximale ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Feux de détresse
  answer: B
  explanation: Les feux de croisement sont préférables dans le brouillard car les
    feux de route se reflètent sur les gouttelettes d'humidité, provoquant un éblouissement
    et réduisant davantage la visibilité.
- id: 108
  category: defensive_driving
  question: Lorsque vous suivez un gros camion commercial, comment pouvez-vous vous
    assurer que vous n'êtes pas dans la « zone de danger » (angle mort) du conducteur
    ?
  choices:
    A: Si vous pouvez voir le pare-chocs avant du camion
    B: Si vous pouvez voir les rétroviseurs extérieurs du camion
    C: Si vous êtes à au moins 10 mètres derrière le camion
    D: Si vous pouvez voir le visage du conducteur dans votre rétroviseur intérieur
  answer: B
  explanation: 'Une règle générale de conduite préventive est la suivante : si vous
    ne voyez pas les rétroviseurs extérieurs du conducteur du camion, celui-ci ne
    peut pas vous voir.'
- id: 109
  category: defensive_driving
  question: En C.-B., quelle est la distance de sécurité recommandée lorsque vous
    conduisez dans de mauvaises conditions météorologiques comme la pluie, la neige
    ou le verglas ?
  choices:
    A: 2 secondes
    B: 3 secondes
    C: 4 secondes
    D: 10 secondes
  answer: C
  explanation: L'ICBC recommande de doubler votre distance de sécurité à au moins
    quatre secondes par mauvais temps ou sur des routes glissantes pour tenir compte
    de l'augmentation de la distance de freinage.
- id: 110
  category: defensive_driving
  question: Qu'est-ce que la « glace noire » et où est-elle la plus susceptible de
    se former sur les routes de la C.-B. ?
  choices:
    A: De la glace mélangée à de la terre que l'on trouve dans les gravières
    B: Une couche de glace mince et transparente que l'on trouve sur les ponts et
      dans les zones ombragées
    C: De la glace épaisse que l'on ne trouve que dans le nord de la province
    D: De la glace qui ne se forme que pendant la nuit
  answer: B
  explanation: La glace noire est une couche de glace mince et presque invisible qui
    se forme sur la chaussée, particulièrement sur les ponts, les viaducs et dans
    les zones ombragées où la route gèle avant les autres sections.
- id: 111
  category: defensive_driving
  question: À l'approche d'un virage, à quel moment un conducteur prévoyant doit-il
    effectuer la majeure partie de son freinage ?
  choices:
    A: Dans la partie la plus serrée du virage
    B: Immédiatement après être sorti du virage
    C: Avant d'entrer dans le virage
    D: Uniquement si le véhicule commence à déraper
  answer: C
  explanation: Vous devez ralentir à une vitesse sécuritaire avant d'entrer dans un
    virage pour maintenir une meilleure traction et stabilité tout au long de la courbe.
- id: 112
  category: defensive_driving
  question: Si un véhicule vous suit de trop près sur une route à deux voies en Colombie-Britannique
    (C.-B.), quelle est la réaction de conduite préventive la plus sûre ?
  choices:
    A: Freiner brusquement pour avertir le conducteur
    B: Accélérer pour augmenter l'écart
    C: Ralentir légèrement et augmenter votre distance de sécurité par rapport à la
      voiture devant vous
    D: Allumer vos feux de détresse et vous arrêter dans la voie
  answer: C
  explanation: Si vous êtes suivi de trop près, vous devez ralentir légèrement et
    augmenter l'espace devant vous. Cela vous donne plus de temps pour réagir lentement
    si nécessaire, réduisant ainsi le risque que le conducteur derrière vous ne vous
    percute si vous devez vous arrêter.
- id: 113
  category: defensive_driving
  question: Selon le guide « Learn to Drive Smart » de l'ICBC, quelle est la distance
    de sécurité minimale que vous devez maintenir derrière un autre véhicule dans
    des conditions de conduite idéales ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: 6 secondes
  answer: B
  explanation: En Colombie-Britannique, la distance de sécurité minimale recommandée
    par beau temps et dans de bonnes conditions routières est d'au moins deux secondes.
- id: 114
  category: defensive_driving
  question: Lorsque vous conduisez sur une autoroute à grande vitesse en C.-B., quelle
    est la distance de sécurité recommandée pour permettre une meilleure visibilité
    et un meilleur temps de réaction ?
  choices:
    A: 2 secondes
    B: 3 secondes
    C: 5 secondes
    D: 10 secondes
  answer: B
  explanation: L'ICBC recommande d'augmenter votre distance de sécurité à au moins
    trois secondes sur les autoroutes à grande vitesse afin de disposer de plus d'espace
    pour balayer la route du regard et réagir.
- id: 115
  category: defensive_driving
  question: En Colombie-Britannique, à quelle distance devant vous devez-vous balayer
    votre environnement de conduite du regard lorsque vous circulez en zone urbaine
    ?
  choices:
    A: 5 secondes
    B: 12 secondes
    C: 20 secondes
    D: 30 secondes
  answer: B
  explanation: Les directives de conduite préventive de la C.-B. suggèrent de balayer
    du regard 12 secondes à l'avance en ville pour anticiper les dangers avant qu'ils
    ne deviennent des problèmes immédiats.
- id: 116
  category: defensive_driving
  question: En C.-B., lorsque vous suivez un autre véhicule de nuit, à quelle distance
    devez-vous passer en feux de croisement pour éviter d'éblouir le conducteur devant
    vous ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: En C.-B., les conducteurs doivent passer des feux de route aux feux
    de croisement lorsqu'ils suivent un autre véhicule à moins de 150 mètres.
- id: 117
  category: defensive_driving
  question: En Colombie-Britannique, les lois « Slow Down, Move Over » (ralentir et
    s'écarter) vous obligent à ralentir à quelle vitesse si la limite affichée est
    de 80 km/h ou plus et que vous dépassez un véhicule d'urgence arrêté avec ses
    gyrophares allumés ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: D
  explanation: En C.-B., si la limite de vitesse affichée est de 80 km/h ou plus,
    vous devez ralentir à 70 km/h lorsque vous dépassez des véhicules d'urgence arrêtés
    avec leurs gyrophares allumés. Si la limite est inférieure à 80 km/h, vous devez
    ralentir à 40 km/h.
- id: 118
  category: defensive_driving
  question: En Colombie-Britannique, sauf indication contraire, quelle est la limite
    de vitesse dans une zone de jeux de l'aube au crépuscule ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: Les zones de jeux en C.-B. ont une limite de 30 km/h en vigueur de
    l'aube au crépuscule, tous les jours de l'année.
- id: 119
  category: defensive_driving
  question: Combien de points de pénalité (Driver Penalty Points - DPP) sont imposés
    pour une condamnation pour « suivi de trop près » (talonnage) en Colombie-Britannique
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Le suivi de trop près est une infraction qui entraîne l'ajout de 3
    points de pénalité à votre dossier de conduite de la C.-B.
- id: 120
  category: defensive_driving
  question: Lorsque vous conduisez derrière un gros camion commercial en C.-B., pourquoi
    devriez-vous maintenir une distance de sécurité plus grande que pour une voiture
    de tourisme ?
  choices:
    A: La loi exige que les camions disposent d'un espace de 5 secondes
    B: Pour rester hors des angles morts du conducteur du camion (No-Zones)
    C: Parce que les camions sont légalement autorisés à reculer aux arrêts
    D: Pour éviter l'échappement des freins à air du camion
  answer: B
  explanation: Une distance de sécurité plus grande derrière les camions est nécessaire
    pour que le conducteur puisse vous voir dans ses rétroviseurs latéraux et pour
    rester hors de son angle mort arrière.
- id: 121
  category: defensive_driving
  question: Lorsque vous conduisez en Colombie-Britannique en hiver, sur quelle surface
    la « glace noire » est-elle la plus susceptible de se former en premier ?
  choices:
    A: Routes de gravier
    B: Collines escarpées
    C: Ponts et viaducs
    D: Sorties de stationnements souterrains
  answer: C
  explanation: Les ponts et les viaducs gèlent en premier car l'air froid circule
    à la fois au-dessus et au-dessous de la surface de la route, ce qui en fait des
    endroits propices à la formation de glace noire.
- id: 122
  category: alcohol_drugs_health
  question: En Colombie-Britannique, quelle est la conséquence immédiate d'un premier
    résultat d'alcootest dans la zone d'avertissement « Warn » (taux d'alcoolémie
    ou BAC entre 0,05 et 0,08) ?
  choices:
    A: Une interdiction de conduire de 24 heures sur le bord de la route
    B: Une interdiction immédiate de conduire (IRP) de 3 jours
    C: Une interdiction administrative de conduire de 90 jours
    D: Une suspension de permis obligatoire d'un an
  answer: B
  explanation: En Colombie-Britannique, un premier résultat « Warn » (BAC de 0,05
    à 0,08) entraîne une interdiction immédiate de conduire de 3 jours et une sanction
    administrative de 200 $.
- id: 123
  category: alcohol_drugs_health
  question: Si un conducteur en Colombie-Britannique fournit un échantillon d'haleine
    qui donne un résultat d'échec « Fail » (taux d'alcoolémie ou BAC supérieur à 0,08)
    ou s'il refuse de fournir un échantillon, quelle est la durée de l'interdiction
    immédiate de conduire (IRP) ?
  choices:
    A: 15 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: D
  explanation: Un résultat « Fail » ou un refus de fournir un échantillon d'haleine
    entraîne une interdiction immédiate de conduire (IRP) de 90 jours.
- id: 124
  category: alcohol_drugs_health
  question: Lorsqu'un conducteur reçoit une interdiction immédiate de conduire (IRP)
    de 90 jours en Colombie-Britannique, pendant combien de temps son véhicule est-il
    obligatoirement mis en fourrière ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: Une IRP de 90 jours entraîne une mise en fourrière obligatoire du véhicule
    pendant 30 jours. Le conducteur est responsable de tous les frais de remorquage
    et d'entreposage.
- id: 125
  category: alcohol_drugs_health
  question: En Colombie-Britannique, quelle est la limite légale de THC (cannabis)
    dans le sang qui déclenche un échec « Fail » en vertu de la Motor Vehicle Act
    pour les conducteurs non professionnels ?
  choices:
    A: 1 nanogramme (ng) par ml
    B: 2 nanogrammes (ng) par ml
    C: 5 nanogrammes (ng) par ml
    D: 10 nanogrammes (ng) par ml
  answer: C
  explanation: Le fait d'avoir 5 nanogrammes ou plus de THC par ml de sang est considéré
    comme un échec (« Fail ») et peut entraîner une interdiction administrative de
    90 jours ou des poursuites criminelles.
- id: 126
  category: alcohol_drugs_health
  question: En vertu de la Motor Vehicle Act de la Colombie-Britannique, lequel des
    professionnels suivants est légalement tenu de signaler un patient à RoadSafetyBC
    s'il présente un problème de santé rendant la conduite dangereuse ?
  choices:
    A: Seulement les médecins
    B: Seulement les optométristes
    C: À la fois les médecins et les optométristes
    D: Seulement les pharmaciens et les infirmiers
  answer: C
  explanation: En Colombie-Britannique, les médecins et les optométristes sont tous
    deux légalement tenus de signaler les patients dont l'état de santé pourrait affecter
    leur capacité à conduire un véhicule à moteur en toute sécurité.
- id: 127
  category: alcohol_drugs_health
  question: Si un conducteur en Colombie-Britannique est pris à conduire alors qu'il
    fait l'objet d'une interdiction liée à une infraction d'alcoolémie, quelle est
    l'amende minimale pour une première condamnation ?
  choices:
    A: 250 $
    B: 500 $
    C: 1 000 $
    D: 2 500 $
  answer: B
  explanation: Conduire pendant une période d'interdiction en Colombie-Britannique
    entraîne une amende minimale de 500 $ et une possible peine d'emprisonnement pour
    une première infraction.
- id: 128
  category: alcohol_drugs_health
  question: Qu'est-ce que le « Responsible Driver Program » (RDP) en Colombie-Britannique
    ?
  choices:
    A: Un cours volontaire pour réduire les primes d'assurance
    B: Un programme de rattrapage obligatoire pour les conducteurs ayant des interdictions
      liées à l'alcool ou aux drogues
    C: Un programme d'école secondaire pour les nouveaux conducteurs
    D: Un programme pour récompenser les conducteurs sans contravention pendant 5
      ans
  answer: B
  explanation: Le RDP est un programme de rattrapage obligatoire pour les conducteurs
    ayant reçu certaines interdictions de conduire liées à l'alcool ou aux drogues.
    Les conducteurs doivent payer eux-mêmes les frais du programme.
- id: 129
  category: alcohol_drugs_health
  question: En Colombie-Britannique, un conducteur qui reçoit une IRP de 90 jours
    ou qui a plusieurs incidents liés à l'alcool peut être tenu d'installer un antidémarreur
    avec éthylomètre (Ignition Interlock Device). Qui est responsable de l'installation
    et des frais mensuels ?
  choices:
    A: L'ICBC
    B: Le gouvernement provincial
    C: Le conducteur
    D: Le fabricant du véhicule
  answer: C
  explanation: Le conducteur est responsable de tous les frais associés au programme
    d'antidémarreur avec éthylomètre, y compris l'installation, les frais de surveillance
    mensuels et le retrait.
- id: 130
  category: alcohol_drugs_health
  question: 'Selon l''ICBC, rester éveillé pendant 17 heures peut altérer votre capacité
    de conduite au même niveau qu''un taux d''alcoolémie (BAC) de :'
  choices:
    A: 0,02
    B: 0,05
    C: 0,08
    D: 0,10
  answer: B
  explanation: La fatigue est une cause majeure d'accidents. Les recherches montrent
    que rester éveillé pendant 17 heures réduit les performances au même niveau qu'un
    taux d'alcoolémie de 0,05.
- id: 131
  category: alcohol_drugs_health
  question: Si un conducteur de la Colombie-Britannique reçoit un deuxième avertissement
    « Warn » (taux d'alcoolémie ou BAC entre 0,05 et 0,08) sur une période de cinq
    ans, quelle est la durée de l'interdiction de conduire ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Un deuxième résultat dans la zone d'avertissement « Warn » en cinq
    ans entraîne une interdiction de conduire immédiate (IRP) de 7 jours et une mise
    en fourrière du véhicule de 7 jours.
- id: 132
  category: alcohol_drugs_health
  question: Si vous prenez des médicaments sur ordonnance, qui est responsable de
    s'assurer que vous êtes en état de conduire en Colombie-Britannique ?
  choices:
    A: Le médecin qui les a prescrits
    B: Le pharmacien qui les a délivrés
    C: La police
    D: Le conducteur
  answer: D
  explanation: Il incombe au conducteur de s'informer auprès de son médecin ou de
    son pharmacien sur les effets secondaires et de s'assurer qu'il n'est pas affaibli
    avant de prendre le volant.
- id: 133
  category: alcohol_drugs_health
  question: En Colombie-Britannique, que se passe-t-il si un conducteur présente un
    taux d'alcoolémie (BAC) entre 0,05 et 0,08 pour la troisième fois en cinq ans
    ?
  choices:
    A: Une interdiction de 7 jours
    B: Une interdiction de 14 jours
    C: Une interdiction de 30 jours
    D: Une interdiction permanente à vie
  answer: C
  explanation: Un troisième résultat dans la zone d'avertissement « Warn » sur une
    période de cinq ans entraîne une interdiction de conduire immédiate (IRP) de 30
    jours et une mise en fourrière du véhicule de 30 jours.
- id: 134
  category: alcohol_drugs_health
  question: Laquelle des affirmations suivantes est vraie concernant les « interdictions
    de conduire administratives » (ADP) en Colombie-Britannique ?
  choices:
    A: Elles ne s'appliquent qu'aux conducteurs débutants (Learner)
    B: Ce sont des interdictions de 90 jours émises lorsqu'un conducteur fait l'objet
      d'une enquête pour une infraction de conduite avec facultés affaiblies selon
      le Code criminel
    C: Elles sont émises pour excès de vitesse dans les zones scolaires
    D: Elles peuvent être purgées en même temps qu'une IRP de 3 jours
  answer: B
  explanation: Une ADP est une interdiction de 90 jours imposée aux conducteurs faisant
    l'objet de poursuites pour une infraction de conduite avec facultés affaiblies
    en vertu du Code criminel (taux d'alcoolémie supérieur à 0,08 ou refus de souffler).
- id: 135
  category: alcohol_drugs_health
  question: Quel est l'effet du mélange d'alcool avec même de petites quantités de
    drogues ou de médicaments ?
  choices:
    A: Les effets de chacun s'annulent
    B: Il n'y a aucun changement dans l'affaiblissement des facultés
    C: L'effet combiné est souvent bien supérieur à la somme des deux
    D: La drogue ralentira l'absorption de l'alcool
  answer: C
  explanation: La combinaison d'alcool et de drogues (effet synergique) peut provoquer
    un affaiblissement extrême des facultés, bien au-delà de ce que l'une ou l'autre
    substance provoquerait seule.
- id: 136
  category: alcohol_drugs_health
  question: En Colombie-Britannique, un conducteur expérimenté (classe 5) qui souffle
    dans un éthylomètre portatif et obtient un résultat « Warn » (taux d'alcoolémie
    entre 0,05 et 0,08) pour la première fois en cinq ans fera l'objet d'une interdiction
    de conduire immédiate de combien de jours ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 30 jours
  answer: B
  explanation: Pour une première infraction « Warn » (BAC de 0,05 à 0,08) sur une
    période de cinq ans, un conducteur expérimenté s'expose à une interdiction de
    conduire immédiate (IRP) de 3 jours, une sanction administrative de 200 $ et une
    possible mise en fourrière du véhicule.
- id: 137
  category: alcohol_drugs_health
  question: Si un conducteur en Colombie-Britannique reçoit une interdiction de conduire
    immédiate (IRP) de 90 jours pour avoir obtenu un résultat « Fail » (échec) à un
    alcootest, pendant combien de temps son véhicule sera-t-il mis en fourrière pour
    une première infraction ?
  choices:
    A: 3 jours
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: Une IRP de 90 jours pour un résultat « Fail » (taux d'alcoolémie supérieur
    à 0,08) ou un refus de fournir un échantillon entraîne une mise en fourrière obligatoire
    du véhicule de 30 jours pour une première infraction.
- id: 138
  category: alcohol_drugs_health
  question: En vertu de la Motor Vehicle Act de la Colombie-Britannique, quelle est
    l'amende de sanction administrative pour un conducteur qui reçoit une interdiction
    de conduire immédiate (IRP) de 90 jours ?
  choices:
    A: 100 $
    B: 250 $
    C: 500 $
    D: 1 000 $
  answer: C
  explanation: Une IRP de 90 jours comporte une amende de sanction administrative
    de 500 $, en plus des frais de remorquage/d'entreposage et des frais de rétablissement
    du permis.
- id: 139
  category: alcohol_drugs_health
  question: En Colombie-Britannique, quelle est la règle de « tolérance zéro » concernant
    le cannabis pour les conducteurs du programme de licence graduée (GLP) ?
  choices:
    A: Ils peuvent avoir jusqu'à 2 ng de THC dans le sang.
    B: Ils ne peuvent consommer du cannabis que s'il est à des fins médicales.
    C: Ils ne doivent avoir aucune présence de THC dans leur organisme.
    D: Les mêmes limites que pour les conducteurs expérimentés s'appliquent (5 ng).
  answer: C
  explanation: Les conducteurs du GLP (apprentis et novices) sont soumis à la politique
    de tolérance zéro de la Colombie-Britannique, ce qui signifie qu'ils ne doivent
    avoir aucune quantité détectable de THC dans leur système en conduisant.
- id: 140
  category: alcohol_drugs_health
  question: Quel programme un conducteur de la Colombie-Britannique pourrait-il être
    tenu de suivre à ses propres frais s'il reçoit plusieurs interdictions de conduire
    liées à l'alcool ?
  choices:
    A: Le programme des conducteurs responsables (RDP)
    B: Le cours d'amélioration des conducteurs de la C.-B.
    C: L'initiative de conduite sécuritaire
    D: Le module de conduite des Alcooliques Anonymes
  answer: A
  explanation: RoadSafetyBC peut exiger que les conducteurs ayant des interdictions
    liées à l'alcool ou aux drogues suivent le programme des conducteurs responsables
    (RDP), qui met l'accent sur le conseil et l'éducation.
- id: 141
  category: alcohol_drugs_health
  question: Si un conducteur de la C.-B. est tenu de participer au programme d'antidémarrage
    avec éthylomètre (Ignition Interlock Program), qui est responsable du paiement
    des frais d'installation et de surveillance mensuels ?
  choices:
    A: L'ICBC
    B: RoadSafetyBC
    C: Le conducteur
    D: Le gouvernement provincial
  answer: C
  explanation: Le conducteur est responsable de tous les coûts associés au programme
    d'antidémarrage avec éthylomètre, y compris l'installation, la location mensuelle
    et les frais de retrait.
- id: 142
  category: alcohol_drugs_health
  question: 'En C.-B., si un agent de police soupçonne que vos facultés sont affaiblies
    par une drogue, il peut exiger que vous subissiez un test physique au bord de
    la route appelé :'
  choices:
    A: Un test d'alcootest
    B: Un test de sobriété normalisé sur le terrain (SFST)
    C: Un test de glycémie
    D: Un test de réflexes
  answer: B
  explanation: Le test de sobriété normalisé sur le terrain (SFST) est utilisé par
    les agents pour évaluer la coordination physique et le mouvement des yeux afin
    de déterminer si les facultés d'un conducteur sont affaiblies par la drogue ou
    l'alcool.
- id: 143
  category: alcohol_drugs_health
  question: Selon le guide du conducteur de la C.-B., quel est le seul moyen efficace
    de réduire votre taux d'alcoolémie (BAC) avant de conduire ?
  choices:
    A: Boire du café noir
    B: Prendre une douche froide
    C: Faire de l'exercice vigoureusement
    D: Attendre que le temps passe
  answer: D
  explanation: Seul le temps permet au foie de métaboliser l'alcool et de réduire
    le taux d'alcoolémie (BAC). Le café, les douches froides et l'exercice n'accélèrent
    pas ce processus.
- id: 144
  category: alcohol_drugs_health
  question: En Colombie-Britannique, qui détient l'autorité ultime pour décider si
    une personne est médicalement apte à détenir un permis de conduire ?
  choices:
    A: Le médecin de famille du conducteur
    B: Le surintendant des véhicules à moteur (RoadSafetyBC)
    C: Un examinateur de conduite de l'ICBC
    D: Le service de police local
  answer: B
  explanation: Bien que les médecins fournissent des rapports, c'est le surintendant
    des véhicules à moteur (par l'intermédiaire de RoadSafetyBC) qui prend la décision
    finale sur l'aptitude médicale d'une personne à conduire.
- id: 145
  category: alcohol_drugs_health
  question: Si vous prenez un nouveau médicament sur ordonnance en C.-B., quelle est
    votre responsabilité avant de conduire un véhicule à moteur ?
  choices:
    A: Vous devez attendre 24 heures avant de conduire.
    B: Vous devez en informer l'ICBC immédiatement.
    C: Vous devriez consulter un médecin ou un pharmacien au sujet des effets secondaires
      qui affectent la conduite.
    D: Vous pouvez conduire tant que vous vous sentez bien.
  answer: C
  explanation: Les conducteurs sont responsables de savoir comment les médicaments
    les affectent. Vous devriez toujours demander à un professionnel de la santé si
    un médicament provoque de la somnolence ou affecte la coordination.
- id: 146
  category: alcohol_drugs_health
  question: Un conducteur de la C.-B. reconnu coupable d'une infraction de conduite
    au Code criminel (comme la conduite avec facultés affaiblies) devra payer une
    « prime de risque du conducteur » (DRP) pendant combien d'années ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: C
  explanation: La prime de risque du conducteur (DRP) est une facture annuelle payée
    pendant trois ans par les conducteurs ayant certaines condamnations, y compris
    les infractions liées à l'alcool.
- id: 147
  category: alcohol_drugs_health
  question: Quelle est la conséquence pour un conducteur de la C.-B. qui refuse de
    fournir un échantillon d'haleine lorsqu'un agent de police l'exige légalement
    ?
  choices:
    A: Une suspension de 24 heures seulement
    B: Les mêmes sanctions qu'un résultat « Échec » (IRP de 90 jours)
    C: Un avertissement verbal pour la première infraction
    D: Une amende de 100 $ et aucune suspension de permis
  answer: B
  explanation: Le refus de fournir un échantillon d'haleine ou de sang entraîne les
    mêmes sanctions immédiates qu'un résultat « Échec » (taux d'alcoolémie supérieur
    à 0,08), ce qui inclut une interdiction de conduire immédiate (IRP) de 90 jours.
- id: 148
  category: alcohol_drugs_health
  question: 'En C.-B., si vous vous sentez fatigué en conduisant, la mesure la plus
    sûre à prendre est de :'
  choices:
    A: Monter le son de la radio et ouvrir la fenêtre
    B: Boire une boisson énergisante et continuer
    C: Se garer dans un endroit sûr et faire une sieste
    D: Accélérer pour atteindre votre destination plus rapidement
  answer: C
  explanation: Le seul remède à la fatigue est le sommeil. Ouvrir les fenêtres ou
    écouter de la musique forte ne sont que des distractions temporaires et inefficaces
    contre la somnolence.
- id: 149
  category: alcohol_drugs_health
  question: Laquelle des descriptions suivantes correspond à l'interdiction de conduire
    administrative (ADP) en Colombie-Britannique ?
  choices:
    A: Une interdiction de 90 jours pour les conducteurs faisant l'objet d'une enquête
      pour une infraction criminelle de conduite avec facultés affaiblies.
    B: Une interdiction de 12 heures pour fatigue excessive au volant.
    C: Une interdiction imposée uniquement aux conducteurs de camions commerciaux.
    D: Une interdiction à vie pour toute consommation d'alcool.
  answer: A
  explanation: L'ADP est une interdiction de 90 jours qui peut être délivrée aux conducteurs
    qui obtiennent un résultat « Échec » ou qui font l'objet d'une procédure pour
    des accusations criminelles de conduite avec facultés affaiblies.
- id: 150
  category: alcohol_drugs_health
  question: Selon la loi de la C.-B., que doit faire un médecin s'il a un patient
    dont l'état de santé rend la conduite dangereuse ?
  choices:
    A: Il doit garder le secret en raison des lois sur la confidentialité.
    B: Il doit signaler le patient à RoadSafetyBC.
    C: Il doit retirer physiquement le permis du patient.
    D: Il doit en informer la compagnie d'assurance du patient.
  answer: B
  explanation: En C.-B., les médecins et les optométristes sont légalement tenus de
    signaler les patients à RoadSafetyBC s'ils présentent un problème de santé susceptible
    de rendre dangereuse la conduite d'un véhicule à moteur.
- id: 151
  category: penalties_and_points
  question: En Colombie-Britannique, si vous êtes pris en flagrant délit d'excès de
    vitesse à plus de 40 km/h au-dessus de la limite affichée, votre véhicule sera
    immédiatement mis en fourrière pendant au moins combien de jours pour une première
    infraction ?
  choices:
    A: 24 heures
    B: 3 jours
    C: 7 jours
    D: 14 jours
  answer: C
  explanation: En vertu des lois de la Colombie-Britannique sur les grands excès de
    vitesse, conduire à plus de 40 km/h au-dessus de la limite entraîne une mise en
    fourrière immédiate du véhicule de 7 jours pour une première infraction, en plus
    des amendes et des points de pénalité.
- id: 152
  category: penalties_and_points
  question: Quelle est l'amende pour une première condamnation pour utilisation d'un
    appareil électronique au volant en Colombie-Britannique ?
  choices:
    A: 167 $
    B: 250 $
    C: 368 $
    D: 575 $
  answer: C
  explanation: En Colombie-Britannique, l'amende pour distraction au volant (utilisation
    d'un appareil électronique) est de 368 $. Cela s'ajoute aux 4 points de pénalité
    et à une éventuelle prime de risque du conducteur.
- id: 153
  category: penalties_and_points
  question: En Colombie-Britannique, combien de points de pénalité sont inscrits à
    votre dossier de conduite pour avoir omis de s'arrêter pour un autobus scolaire
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire lorsque ses feux
    rouges clignotent est une infraction grave qui entraîne 3 points de pénalité en
    Colombie-Britannique.
- id: 154
  category: penalties_and_points
  question: La Prime de risque du conducteur (DRP) est un paiement distinct de la
    prime pour points de pénalité du conducteur. Laquelle des condamnations suivantes
    déclenche une DRP en Colombie-Britannique ?
  choices:
    A: Omission de signaler un virage
    B: Une condamnation pour grand excès de vitesse
    C: Une seule contravention de stationnement
    D: Conduire à 5 km/h au-dessus de la limite
  answer: B
  explanation: La Prime de risque du conducteur (DRP) est déclenchée par des infractions
    graves, notamment les grands excès de vitesse (40 km/h ou plus au-dessus de la
    limite), la distraction au volant ou les interdictions liées à l'alcool.
- id: 155
  category: penalties_and_points
  question: Si vous êtes reconnu coupable de « conduite sans considération raisonnable
    pour autrui » en Colombie-Britannique, combien de points de pénalité sont ajoutés
    à votre dossier ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: La conduite sans considération raisonnable pour autrui est une infraction
    de conduite à haut risque en Colombie-Britannique et comporte 6 points de pénalité.
- id: 156
  category: penalties_and_points
  question: Si un conducteur est pris pour une deuxième infraction de grand excès
    de vitesse sur une période de deux ans, pendant combien de temps son véhicule
    sera-t-il mis en fourrière ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: Une deuxième infraction de grand excès de vitesse en deux ans entraîne
    une période de mise en fourrière du véhicule augmentée à 30 jours.
- id: 157
  category: penalties_and_points
  question: Si un conducteur expérimenté reçoit une interdiction de conduire immédiate
    (IRP) de 90 jours pour un taux d'alcoolémie (BAC) supérieur à 0,08, quelle est
    la période de mise en fourrière obligatoire du véhicule ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: Une IRP de 90 jours pour avoir échoué à un test d'alcoolémie (taux
    d'alcoolémie supérieur à 0,08) comprend une mise en fourrière obligatoire du véhicule
    de 30 jours.
- id: 158
  category: penalties_and_points
  question: En Colombie-Britannique, combien de points de pénalité sont attribués
    pour avoir omis de céder le passage à un piéton dans un passage pour piétons ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Le fait de ne pas céder le passage à un piéton est une infraction de
    3 points en Colombie-Britannique.
- id: 159
  category: penalties_and_points
  question: Si vous êtes impliqué dans un délit de fuite (omission de rester sur les
    lieux d'un accident), combien de points de pénalité seront ajoutés à votre dossier
    de conduite de la Colombie-Britannique lors de la condamnation ?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Le fait de ne pas rester sur les lieux d'un accident est une infraction
    très grave et entraîne 6 points de pénalité en Colombie-Britannique.
- id: 160
  category: penalties_and_points
  question: En Colombie-Britannique, à partir de quel nombre minimum de points un
    conducteur doit-il payer une prime pour points de pénalité (DPP) à l'ICBC ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: En Colombie-Britannique, si vous accumulez quatre points ou plus au
    cours de votre période d'évaluation (généralement un an), vous devez payer une
    prime pour points de pénalité (DPP).
- id: 161
  category: penalties_and_points
  question: De combien de kilomètres par heure au-dessus de la limite de vitesse un
    conducteur doit-il rouler pour être accusé de « grand excès de vitesse » en Colombie-Britannique
    ?
  choices:
    A: Plus de 20 km/h
    B: Plus de 30 km/h
    C: Plus de 40 km/h
    D: Plus de 60 km/h
  answer: C
  explanation: En Colombie-Britannique, conduire à plus de 40 km/h au-dessus de la
    limite de vitesse affichée est considéré comme un grand excès de vitesse, ce qui
    entraîne des amendes plus élevées et la mise en fourrière immédiate du véhicule.
- id: 162
  category: penalties_and_points
  question: Dans le cadre du programme d'interdiction de conduire immédiate (IRP)
    de la Colombie-Britannique, quelle est la plage de taux d'alcoolémie (BAC) pour
    un résultat « Avertissement » (Warn) ?
  choices:
    A: 0.02 à 0.04
    B: 0.05 à 0.08
    C: 0.08 à 0.10
    D: 0.10 ou plus
  answer: B
  explanation: Une interdiction de conduire immédiate (IRP) de type « Avertissement
    » est délivrée si le taux d'alcoolémie (BAC) d'un conducteur se situe entre 0.05
    et 0.08. Cela peut entraîner une saisie immédiate du permis et la mise en fourrière
    du véhicule.
- id: 163
  category: penalties_and_points
  question: Quelle est la durée de l'interdiction de conduire pour un premier résultat
    « Échec » (Fail) (taux d'alcoolémie supérieur à 0.08) dans le cadre du programme
    d'interdiction de conduire immédiate (IRP) de la Colombie-Britannique ?
  choices:
    A: 24 heures
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: D
  explanation: Un premier résultat « Échec » à un alcootest (ou le refus de fournir
    un échantillon) entraîne une interdiction de conduire immédiate de 90 jours en
    Colombie-Britannique.
- id: 164
  category: penalties_and_points
  question: Combien de points de démérite sont imposés pour avoir omis de s'arrêter
    pour un autobus scolaire dont les feux rouges clignotent en Colombie-Britannique
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: L'omission de s'arrêter pour un autobus scolaire est une infraction
    grave à la sécurité en Colombie-Britannique et entraîne l'ajout de 3 points de
    démérite à votre dossier de conduite.
- id: 165
  category: penalties_and_points
  question: La prime de risque du conducteur (DRP) est un paiement distinct de la
    prime pour points de démérite. Pendant combien d'années une DRP est-elle imposée
    pour une seule infraction admissible ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: C
  explanation: La prime de risque du conducteur (DRP) est facturée annuellement pendant
    trois ans en fonction du dossier du conducteur sur une période de trois ans. Elle
    s'applique aux infractions graves comme le grand excès de vitesse ou les interdictions
    liées à l'alcool.
- id: 166
  category: penalties_and_points
  question: Quelle est l'amende pour un conducteur en Colombie-Britannique qui ne
    porte pas sa ceinture de sécurité ?
  choices:
    A: $109
    B: $167
    C: $230
    D: $368
  answer: B
  explanation: L'amende pour ne pas porter de ceinture de sécurité en Colombie-Britannique
    est de 167 $.
- id: 167
  category: penalties_and_points
  question: Combien de points de démérite sont imposés pour une infraction d'excès
    de vitesse standard (non excessif) en Colombie-Britannique ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Une contravention pour excès de vitesse standard en Colombie-Britannique
    entraîne l'ajout de 3 points de démérite au dossier du conducteur.
- id: 168
  category: penalties_and_points
  question: En vertu de la loi « Ralentissez, tassez-vous » de la Colombie-Britannique,
    combien de points de démérite sont imposés pour avoir omis de ralentir et de changer
    de voie à l'approche de véhicules d'urgence dont les feux clignotent ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Le fait de ne pas ralentir et de ne pas changer de voie pour un véhicule
    officiel (police, pompiers, ambulance, dépanneuse) dont les feux clignotent entraîne
    3 points de démérite en Colombie-Britannique.
- id: 169
  category: sharing_the_road
  question: En Colombie-Britannique, que devez-vous faire à l'approche d'un véhicule
    d'urgence arrêté avec ses feux clignotants sur une autoroute où la limite de vitesse
    est de 80 km/h ou plus ?
  choices:
    A: Ralentir à 40 km/h et changer de voie si cela peut être fait en toute sécurité.
    B: Ralentir à 70 km/h et changer de voie si cela peut être fait en toute sécurité.
    C: Maintenir votre vitesse mais vous déplacer vers la voie la plus à gauche.
    D: S'arrêter complètement jusqu'à ce que le véhicule d'urgence éteigne ses feux.
  answer: B
  explanation: Selon la loi « Move Over » de la Colombie-Britannique, si la limite
    de vitesse affichée est de 80 km/h ou plus, les conducteurs doivent ralentir à
    70 km/h et se déplacer vers la voie la plus éloignée en dépassant des véhicules
    d'urgence arrêtés avec des feux clignotants.
- id: 170
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    et son bras d'arrêt déployé, quels conducteurs doivent s'arrêter en Colombie-Britannique
    ?
  choices:
    A: Uniquement les conducteurs qui suivent l'autobus.
    B: Uniquement les conducteurs arrivant de l'avant.
    C: Les conducteurs arrivant des deux directions, à moins que la route ne soit
      séparée par un terre-plein central.
    D: Les conducteurs arrivant des deux directions sur tous les types de routes,
      y compris les autoroutes divisées.
  answer: C
  explanation: En Colombie-Britannique, la circulation dans les deux sens doit s'arrêter
    pour un autobus scolaire dont les feux rouges clignotent. La seule exception est
    sur une route divisée par un terre-plein central, où seule la circulation suivant
    l'autobus doit s'arrêter.
- id: 171
  category: sharing_the_road
  question: En Colombie-Britannique, quelle est l'amende pour ne pas s'être arrêté
    pour un autobus scolaire dont les feux rouges clignotent ?
  choices:
    A: L'amende est de 167 $ et 2 points.
    B: L'amende est de 368 $ et 3 points.
    C: L'amende est de 575 $ et 6 points.
    D: L'amende est de 1 000 $ et une suspension immédiate de 30 jours.
  answer: B
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire en Colombie-Britannique
    entraîne une amende de 368 $ et 3 points d'inaptitude au dossier du conducteur.
- id: 172
  category: sharing_the_road
  question: Lorsque vous tournez à droite à une intersection où un cycliste est positionné
    à votre droite et a l'intention d'aller tout droit, que devez-vous faire ?
  choices:
    A: Accélérer pour dépasser le cycliste avant d'effectuer le virage.
    B: Klaxonner pour avertir le cycliste que vous tournez.
    C: Céder le passage au cycliste et attendre qu'il ait dégagé l'intersection avant
      de tourner.
    D: Tourner à droite immédiatement car les véhicules ont toujours la priorité sur
      les vélos.
  answer: C
  explanation: Les conducteurs doivent céder le passage aux cyclistes qui traversent
    une intersection tout droit avant d'effectuer un virage à droite coupant leur
    trajectoire.
- id: 173
  category: sharing_the_road
  question: À quoi fait référence une « No-Zone » lorsque vous conduisez près de gros
    camions commerciaux en Colombie-Britannique ?
  choices:
    A: Aux zones où les camions ne sont pas autorisés à circuler.
    B: Aux angles morts autour du camion où le conducteur ne peut pas vous voir.
    C: Aux zones de limite de poids pour les ponts.
    D: Aux quais de chargement des entrepôts.
  answer: B
  explanation: La « No-Zone » fait référence aux angles morts importants situés derrière,
    devant et des deux côtés d'un camion commercial, où la visibilité du conducteur
    du camion est limitée.
- id: 174
  category: sharing_the_road
  question: En Colombie-Britannique, si vous conduisez sur une route où la limite
    de vitesse est de 60 km/h et que vous approchez d'un véhicule d'urgence arrêté
    avec ses feux clignotants, à quelle vitesse devez-vous ralentir ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 20 km/h
  answer: B
  explanation: Selon la loi « Move Over » (se ranger) de la Colombie-Britannique,
    si la limite de vitesse affichée est inférieure à 80 km/h, les conducteurs doivent
    ralentir à 40 km/h lorsqu'ils dépassent un véhicule d'urgence arrêté avec ses
    feux clignotants.
- id: 175
  category: sharing_the_road
  question: Lorsqu'un piéton utilise une canne blanche ou est accompagné d'un chien-guide
    en Colombie-Britannique, qu'est-ce que cela indique à un conducteur ?
  choices:
    A: Le piéton est une personne âgée.
    B: Le piéton a une déficience visuelle et vous devez lui laisser plus d'espace
      et faire preuve de prudence.
    C: Le piéton entraîne un chien et vous ne devriez pas vous arrêter.
    D: Le piéton n'a la priorité qu'aux passages pour piétons marqués.
  answer: B
  explanation: Une canne blanche ou un chien-guide indique que le piéton a une déficience
    visuelle. Les conducteurs doivent faire preuve d'une prudence extrême et lui céder
    le passage.
- id: 176
  category: sharing_the_road
  question: Laquelle des affirmations suivantes est vraie concernant les « passages
    pour piétons non marqués » en Colombie-Britannique ?
  choices:
    A: Les piétons n'ont la priorité qu'aux passages pour piétons marqués.
    B: Un passage pour piétons non marqué existe à chaque intersection, à moins qu'un
      panneau n'interdise la traversée.
    C: Les conducteurs ne sont pas tenus de s'arrêter pour les piétons aux passages
      non marqués.
    D: Les passages pour piétons non marqués n'existent que dans les zones résidentielles.
  answer: B
  explanation: En Colombie-Britannique, chaque intersection comporte un passage pour
    piétons, qu'il soit marqué par de la peinture ou non. Les conducteurs doivent
    céder le passage aux piétons à toutes les intersections.
- id: 177
  category: sharing_the_road
  question: En Colombie-Britannique, quelle est la limite de vitesse standard dans
    une zone scolaire lorsque des enfants sont présents ou lorsque le panneau est
    en vigueur ?
  choices:
    A: 20 km/h de 8 h à 16 h.
    B: 30 km/h de 8 h à 17 h les jours d'école.
    C: 40 km/h de 7 h à 19 h.
    D: 30 km/h 24 heures sur 24, 7 jours sur 7.
  answer: B
  explanation: En Colombie-Britannique, la limite de vitesse en zone scolaire est
    de 30 km/h entre 8 h et 17 h les jours d'école, sauf indication contraire.
- id: 178
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut avoir
    besoin de :'
  choices:
    A: Faire un virage large vers la gauche avant de tourner à droite.
    B: Rester aussi près que possible de la bordure droite.
    C: Accélérer pour dégager l'intersection rapidement.
    D: Tourner à partir de la voie de gauche à l'extrémité.
  answer: A
  explanation: Les véhicules de grande taille ont besoin de plus d'espace pour tourner.
    Ils effectuent souvent un virage large vers la gauche pour terminer un virage
    à droite sans heurter le trottoir ou des objets sur le coin.
- id: 179
  category: sharing_the_road
  question: Que devez-vous faire si un véhicule d'urgence (ambulance, camion de pompiers
    ou voiture de police) s'approche de vous par l'arrière avec sa sirène et ses feux
    allumés ?
  choices:
    A: S'arrêter exactement là où vous êtes.
    B: Accélérer pour rester devant lui.
    C: Se ranger à droite le plus loin possible et s'arrêter.
    D: Se ranger à gauche et s'arrêter.
  answer: C
  explanation: En Colombie-Britannique, vous devez céder le passage en vous déplaçant
    vers le bord droit de la route (ou le bord gauche sur une rue à sens unique) et
    en vous arrêtant complètement jusqu'à ce que le véhicule d'urgence soit passé.
- id: 180
  category: sharing_the_road
  question: 'En Colombie-Britannique, un cycliste signale un virage à droite en :'
  choices:
    A: Tendant le bras gauche vers l'extérieur et en le pliant vers le haut au niveau
      du coude, ou en tendant le bras droit horizontalement.
    B: Tendant le bras gauche horizontalement vers l'extérieur.
    C: Tendant le bras gauche vers l'extérieur et en le pliant vers le bas au niveau
      du coude.
    D: Pointant le sol avec la main droite.
  answer: A
  explanation: Les cyclistes peuvent signaler un virage à droite soit en tendant le
    bras gauche vers le haut à un angle de 90 degrés, soit en tendant le bras droit
    horizontalement vers la droite.
- id: 181
  category: sharing_the_road
  question: En Colombie-Britannique (C.-B.), quelle est la distance de sécurité minimale
    à maintenir derrière un véhicule de grande taille sur une autoroute à grande vitesse
    pour s'assurer de bien voir devant ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 3 secondes
    D: Au moins 5 secondes
  answer: C
  explanation: Bien que 2 secondes soit le minimum pour les voitures dans des conditions
    idéales, l'ICBC recommande au moins 3 secondes (et plus dans de mauvaises conditions)
    lorsque vous suivez des véhicules de grande taille pour permettre une meilleure
    visibilité autour du camion.
- id: 182
  category: sharing_the_road
  question: À l'approche d'un autobus scolaire dont les feux rouges clignotent et
    le bras d'arrêt est déployé sur une route sans terre-plein central, qui doit s'arrêter
    ?
  choices:
    A: Uniquement les véhicules qui suivent l'autobus.
    B: Uniquement les véhicules arrivant d'en face.
    C: Les véhicules circulant dans les deux sens.
    D: Personne, s'il y a au moins trois voies de circulation.
  answer: C
  explanation: En C.-B., sur une route sans terre-plein central (non divisée), les
    conducteurs arrivant de l'avant et de l'arrière doivent s'arrêter pour un autobus
    scolaire dont les feux rouges clignotent.
- id: 183
  category: sharing_the_road
  question: Qu'est-ce que la « No-Zone » (zone de danger) par rapport aux gros camions
    commerciaux en Colombie-Britannique ?
  choices:
    A: La zone où les camions ne sont pas autorisés à circuler.
    B: Les angles morts autour du camion où le conducteur ne peut pas vous voir.
    C: La voie réservée spécifiquement aux camions sur l'autoroute Coquihalla.
    D: La distance dont un camion a besoin pour s'arrêter complètement.
  answer: B
  explanation: La « No-Zone » fait référence aux angles morts importants situés derrière,
    devant et sur les deux côtés d'un camion commercial, où la visibilité du conducteur
    est limitée.
- id: 184
  category: sharing_the_road
  question: Selon la loi sur les véhicules à moteur (Motor Vehicle Act) de la C.-B.,
    si un piéton traverse à une intersection sans passage pour piétons peint, quelles
    sont les responsabilités du conducteur ?
  choices:
    A: Le conducteur a la priorité car il n'y a pas de passage pour piétons marqué.
    B: Le piéton doit attendre un intervalle d'au moins 100 mètres dans la circulation.
    C: Le conducteur doit céder le passage car chaque intersection est considérée
      comme un « passage pour piétons non marqué ».
    D: Le conducteur doit klaxonner pour avertir le piéton de rester sur le trottoir.
  answer: C
  explanation: En C.-B., un « passage pour piétons non marqué » existe à chaque intersection,
    à moins qu'un panneau n'interdise la traversée. Les conducteurs doivent céder
    le passage aux piétons dans ces zones.
- id: 185
  category: sharing_the_road
  question: Quelle est la distance de sécurité recommandée pour un véhicule circulant
    derrière une motocyclette en C.-B. ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 3 secondes
    D: 5 secondes
  answer: C
  explanation: L'ICBC recommande une distance de sécurité d'au moins 3 secondes derrière
    une motocyclette car celle-ci peut s'arrêter très rapidement et est plus vulnérable
    aux dangers de la route.
- id: 186
  category: sharing_the_road
  question: Lorsqu'un véhicule d'urgence (police, pompiers ou ambulance) s'approche
    de vous dans l'une ou l'autre direction avec sa sirène et ses gyrophares allumés,
    que devez-vous faire ?
  choices:
    A: Accélérer pour libérer le passage.
    B: Se ranger sur le bord du trottoir le plus proche et s'arrêter.
    C: S'arrêter exactement là où vous vous trouvez dans la voie.
    D: Allumer vos feux de détresse et continuer à la même vitesse.
  answer: B
  explanation: Les conducteurs doivent se ranger sur le bord du trottoir le plus proche
    (généralement à droite) et s'arrêter complètement, en veillant à ne pas bloquer
    d'intersection.
- id: 187
  category: sharing_the_road
  question: En C.-B., lorsque vous vous apprêtez à tourner à droite et qu'il y a une
    voie cyclable à votre droite, quelle est la procédure correcte ?
  choices:
    A: Tourner depuis votre voie actuelle et traverser rapidement la voie cyclable.
    B: S'insérer dans la voie cyclable uniquement si elle présente une ligne blanche
      pointillée, après avoir vérifié la présence de cyclistes.
    C: Toujours s'arrêter dans la voie cyclable pour attendre un intervalle dans la
      circulation.
    D: Klaxonner pour s'assurer que les cyclistes derrière vous s'arrêtent avant que
      vous ne tourniez.
  answer: B
  explanation: Vous ne devez vous insérer dans une voie cyclable que lorsque la ligne
    est pointillée, et seulement après avoir vérifié vos rétroviseurs et effectué
    une vérification par-dessus l'épaule pour vous assurer qu'aucun cycliste n'est
    présent.
- id: 188
  category: sharing_the_road
  question: Si vous voyez un piéton avec une canne blanche ou un chien-guide à un
    coin de rue, qu'est-ce que cela indique ?
  choices:
    A: Le piéton est un représentant du gouvernement.
    B: Le piéton a une déficience visuelle et vous devez lui laisser plus d'espace
      et de temps.
    C: Le piéton entraîne un chien et vous ne devez pas vous arrêter.
    D: Le piéton est tenu de céder le passage à tous les véhicules à moteur.
  answer: B
  explanation: Une canne blanche ou un chien-guide indique une personne ayant une
    déficience visuelle. Les conducteurs doivent faire preuve d'une extrême prudence
    et céder le passage.
- id: 189
  category: sharing_the_road
  question: Pourquoi un gros camion pourrait-il se déporter dans la voie de gauche
    avant d'effectuer un virage à droite à une intersection ?
  choices:
    A: Le conducteur est perdu et essaie de changer de direction.
    B: Les camions sont légalement tenus de tourner depuis la voie de gauche.
    C: Le camion a besoin de plus d'espace pour ne pas monter sur le trottoir (virage
      large).
    D: Le conducteur essaie de bloquer la circulation pour des raisons de sécurité.
  answer: C
  explanation: Les véhicules de grande taille doivent effectuer des virages larges
    pour éviter de heurter le trottoir. Les conducteurs ne doivent jamais essayer
    de se faufiler entre un camion qui tourne et le trottoir.
- id: 190
  category: sharing_the_road
  question: Que signifie le symbole « sharrow » (un vélo surmonté de deux chevrons)
    peint sur une route en C.-B. ?
  choices:
    A: La voie est réservée aux vélos ; les voitures y sont interdites.
    B: Les cyclistes doivent rester sur le trottoir dans cette zone.
    C: Il s'agit d'une voie partagée où les automobilistes et les cyclistes doivent
      occuper la même voie de circulation.
    D: Il indique une zone de cyclisme à grande vitesse.
  answer: C
  explanation: Les « sharrows » indiquent une voie partagée. Ils rappellent aux automobilistes
    de partager la route et aident les cyclistes à se positionner dans la voie.
- id: 191
  category: sharing_the_road
  question: Lorsque vous dépassez un véhicule d'urgence arrêté avec ses gyrophares
    allumés sur une route où la limite de vitesse est INFÉRIEURE à 80 km/h, quelle
    est la vitesse requise ?
  choices:
    A: 20 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: B
  explanation: En Colombie-Britannique, si la limite de vitesse affichée est inférieure
    à 80 km/h, les conducteurs doivent ralentir à 40 km/h lorsqu'ils dépassent un
    véhicule d'urgence arrêté avec ses gyrophares allumés.
- id: 192
  category: sharing_the_road
  question: L'inter-files ou « lane splitting » (conduire une motocyclette entre deux
    voies de circulation arrêtée ou en mouvement) est-il légal en Colombie-Britannique
    ?
  choices:
    A: Oui, c'est légal si la circulation roule à moins de 30 km/h.
    B: Oui, mais seulement pour les motocyclettes de police.
    C: Non, c'est illégal et considéré comme un « changement de voie dangereux » ou
      un « dépassement par la droite ».
    D: Oui, c'est encouragé pour réduire la congestion routière.
  answer: C
  explanation: L'inter-files est illégal en Colombie-Britannique. Les motocyclettes
    doivent occuper une position de voie normale, tout comme n'importe quel autre
    véhicule.
- id: 193
  category: vehicle_information
  question: En Colombie-Britannique, quelle est la profondeur de sculpture minimale
    légale pour les pneus d'hiver lors de la conduite sur les cols de montagne et
    les routes rurales désignés ?
  choices:
    A: 1,6 mm
    B: 2,5 mm
    C: 3,5 mm
    D: 4,0 mm
  answer: C
  explanation: Selon la loi sur les véhicules à moteur de la C.-B. (Motor Vehicle
    Act), les pneus d'hiver doivent avoir une profondeur de sculpture d'au moins 3,5
    mm pour être légalement utilisés sur les routes désignées pendant la saison hivernale.
- id: 194
  category: vehicle_information
  question: Selon la réglementation sur les véhicules de la C.-B., quelles vitres
    ne sont PAS autorisées à recevoir un film teinté après-vente ?
  choices:
    A: La lunette arrière uniquement
    B: Les vitres latérales arrière uniquement
    C: Le pare-brise et les vitres latérales avant
    D: Toutes les vitres peuvent être teintées
  answer: C
  explanation: En Colombie-Britannique, le teintage après-vente est interdit sur le
    pare-brise (sauf pour les 75 mm supérieurs) et les vitres latérales avant pour
    des raisons de sécurité et de visibilité.
- id: 195
  category: vehicle_information
  question: Sur la plupart des routes de la C.-B., les pneus d'hiver ou les chaînes
    sont obligatoires par la loi pendant quelle période ?
  choices:
    A: Du 1er novembre au 31 mars
    B: Du 1er octobre au 31 mars (prolongé jusqu'au 30 avril pour certains cols)
    C: Du 1er décembre au 28 février
    D: Du 31 octobre au 1er avril
  answer: B
  explanation: En Colombie-Britannique, l'obligation de pneus d'hiver commence le
    1er octobre et se termine le 31 mars, bien qu'elle soit prolongée jusqu'au 30
    avril pour de nombreux cols de montagne et routes rurales.
- id: 196
  category: vehicle_information
  question: 'En Colombie-Britannique, votre véhicule doit être équipé de rétroviseurs
    offrant une vue de la route vers l''arrière sur une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Le règlement de la loi sur les véhicules à moteur de la C.-B. stipule
    que les rétroviseurs doivent offrir une vue dégagée de la route sur au moins 60
    mètres vers l'arrière.
- id: 197
  category: vehicle_information
  question: Quelle est la profondeur de sculpture minimale légale pour les pneus standards
    (non-hiver) en Colombie-Britannique ?
  choices:
    A: 1,0 mm
    B: 1,6 mm
    C: 2,0 mm
    D: 3,5 mm
  answer: B
  explanation: La profondeur de sculpture minimale légale pour les pneus ordinaires
    en Colombie-Britannique est de 1,6 mm. Les pneus usés en dessous de cette limite
    sont considérés comme dangereux.
- id: 198
  category: vehicle_information
  question: 'En Colombie-Britannique, vous devez allumer vos phares si la visibilité
    est réduite à moins de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Les phares doivent être utilisés en Colombie-Britannique chaque fois
    que vous ne pouvez pas voir clairement à une distance de 150 mètres devant vous
    en raison des conditions météorologiques ou de luminosité.
- id: 199
  category: vehicle_information
  question: Selon les lois sur la sécurité des enfants passagers de la C.-B., un enfant
    doit utiliser un siège d'appoint jusqu'à ce qu'il mesure au moins quelle taille
    ?
  choices:
    A: 135 cm (4'5")
    B: 145 cm (4'9")
    C: 155 cm (5'1")
    D: 165 cm (5'5")
  answer: B
  explanation: En Colombie-Britannique, les enfants doivent rester dans un siège d'appoint
    jusqu'à ce qu'ils mesurent au moins 145 cm (4'9") ou qu'ils atteignent leur 9e
    anniversaire.
- id: 200
  category: vehicle_information
  question: 'Pour offrir une protection maximale lors d''une collision, l''appuie-tête
    de votre véhicule doit être réglé de manière à ce que son sommet soit au même
    niveau que :'
  choices:
    A: La base de votre cou
    B: Le bas de vos oreilles
    C: Le haut de vos oreilles
    D: Le sommet de votre tête
  answer: D
  explanation: L'ICBC recommande de régler l'appuie-tête de manière à ce que le sommet
    soit au même niveau que le sommet de votre tête afin de prévenir le coup de lapin
    (entorse cervicale).
- id: 201
  category: vehicle_information
  question: En Colombie-Britannique, à quelles dates précises les pneus cloutés sont-ils
    autorisés sur les véhicules ?
  choices:
    A: Du 1er septembre au 31 mai
    B: Du 1er octobre au 30 avril
    C: Du 1er novembre au 31 mars
    D: Du 31 octobre au 1er avril
  answer: B
  explanation: Les pneus cloutés sont autorisés en Colombie-Britannique uniquement
    du 1er octobre au 30 avril. Leur utilisation en dehors de ces dates peut entraîner
    une amende.
- id: 202
  category: vehicle_information
  question: Laquelle des options suivantes est une exigence d'assurance obligatoire
    pour tous les propriétaires de véhicules en Colombie-Britannique ?
  choices:
    A: Une couverture complète auprès d'un assureur privé
    B: Une couverture collision auprès de l'ICBC
    C: La couverture de base Autoplan de l'ICBC
    D: Une couverture contre les risques spécifiés
  answer: C
  explanation: Tous les véhicules immatriculés en Colombie-Britannique doivent détenir
    l'assurance de base Autoplan de l'ICBC, qui comprend la responsabilité civile
    envers les tiers et les prestations d'accident.
- id: 203
  category: vehicle_information
  question: Si les clignotants de votre véhicule sont en panne, quel est le signal
    manuel correct pour indiquer un virage à droite en Colombie-Britannique ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre
    B: Le bras gauche sorti et plié vers le haut au niveau du coude
    C: Le bras gauche sorti et plié vers le bas au niveau du coude
    D: Le bras droit tendu horizontalement par la fenêtre du passager
  answer: B
  explanation: Pour signaler manuellement un virage à droite, le conducteur sort le
    bras gauche par la fenêtre et le plie vers le haut à un angle de 90 degrés.
- id: 204
  category: vehicle_information
  question: 'En Colombie-Britannique, tout véhicule à moteur doit être muni d''un
    feu arrière qui émet une lumière rouge visible à une distance de :'
  choices:
    A: 60 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Le règlement de la loi sur les véhicules à moteur de la Colombie-Britannique
    exige que les feux arrière soient visibles à une distance de 150 mètres vers l'arrière.
- id: 205
  category: vehicle_information
  question: Entre quelles dates les pneus d'hiver ou les chaînes sont-ils généralement
    obligatoires sur la plupart des routes désignées en Colombie-Britannique ?
  choices:
    A: Du 1er novembre au 31 mars
    B: Du 1er octobre au 31 mars
    C: Du 15 octobre au 15 avril
    D: Du 1er septembre au 1er mai
  answer: B
  explanation: En Colombie-Britannique, les pneus d'hiver ou les chaînes sont obligatoires
    sur la plupart des routes désignées du 1er octobre au 31 mars. Pour certaines
    routes, notamment les cols de montagne et les routes rurales, cette période est
    prolongée jusqu'au 30 avril.
- id: 206
  category: vehicle_information
  question: Lorsque vous suivez un autre véhicule, à quelle distance devez-vous passer
    de vos feux de route aux feux de croisement en Colombie-Britannique ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 250 mètres
  answer: C
  explanation: Vous devez baisser vos feux de route (passer en feux de croisement)
    lorsque vous suivez un autre véhicule à moins de 150 mètres pour éviter d'éblouir
    le conducteur devant vous via ses rétroviseurs.
- id: 207
  category: vehicle_information
  question: Quelle est la loi en Colombie-Britannique concernant le teintage des vitres
    latérales avant (côté conducteur et passager) ?
  choices:
    A: Le teintage est autorisé jusqu'à 35 % de blocage de la lumière.
    B: Le teintage est autorisé jusqu'à 50 % de blocage de la lumière.
    C: Aucune pellicule teintée non d'origine n'est autorisée sur les vitres latérales
      avant.
    D: Le teintage n'est autorisé que si le conducteur possède une note médicale.
  answer: C
  explanation: Le règlement de la loi sur les véhicules à moteur de la Colombie-Britannique
    interdit l'application de pellicules teintées après-vente sur le pare-brise et
    les vitres latérales avant.
- id: 208
  category: vehicle_information
  question: En Colombie-Britannique, tout véhicule à moteur, autre qu'une motocyclette,
    doit être équipé de quel système de freinage ?
  choices:
    A: Uniquement un frein à pied
    B: Uniquement un frein de stationnement
    C: Deux systèmes de freinage distincts (généralement un frein à pied et un frein
      de stationnement)
    D: Un système de freinage antiblocage (ABS) est la seule exigence
  answer: C
  explanation: 'La loi de la Colombie-Britannique exige que les véhicules disposent
    de deux systèmes de freinage indépendants : un frein de service (frein à pied)
    et un frein de stationnement ou de secours.'
- id: 209
  category: vehicle_information
  question: 'Selon la réglementation de la Colombie-Britannique, le klaxon d''un véhicule
    doit être audible dans des conditions normales à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Un véhicule à moteur doit être équipé d'un avertisseur sonore en bon
    état de fonctionnement, capable d'émettre un son audible dans des conditions normales
    à une distance d'au moins 60 mètres.
- id: 210
  category: vehicle_information
  question: Quand êtes-vous tenu d'utiliser vos phares en Colombie-Britannique ?
  choices:
    A: Du coucher au lever du soleil.
    B: Uniquement lorsqu'il pleut ou qu'il neige.
    C: De 30 minutes après le coucher du soleil à 30 minutes avant le lever du soleil,
      ou chaque fois que la visibilité est réduite.
    D: Uniquement entre minuit et 5h00 du matin.
  answer: C
  explanation: Les phares doivent être allumés de 30 minutes après le coucher du soleil
    à 30 minutes avant le lever du soleil, et à tout moment lorsque la visibilité
    est réduite à 150 mètres ou moins.
- id: 211
  category: vehicle_information
  question: Quelle est la couverture minimale d'assurance responsabilité civile envers
    les tiers requise pour un véhicule de tourisme immatriculé en Colombie-Britannique
    ?
  choices:
    A: 100 000 $
    B: 200 000 $
    C: 500 000 $
    D: 1 000 000 $
  answer: B
  explanation: En Colombie-Britannique, le minimum légal pour l'assurance responsabilité
    civile envers les tiers est de 200 000 $, bien que l'ICBC et la plupart des experts
    recommandent une couverture plus élevée.
- id: 212
  category: vehicle_information
  question: En Colombie-Britannique, comment un appuie-tête doit-il être réglé pour
    une sécurité maximale ?
  choices:
    A: Au niveau de la base du cou.
    B: Au niveau du haut des oreilles.
    C: Aussi bas que possible pour éviter de bloquer la vision.
    D: À au moins 10 cm de l'arrière de la tête.
  answer: B
  explanation: Pour une protection maximale contre le coup de lapin, l'appuie-tête
    doit être réglé de manière à ce que le haut de l'appui soit au même niveau que
    le haut de vos oreilles.
- id: 213
  category: vehicle_information
  question: Quelle est l'exigence concernant les rétroviseurs sur un véhicule de tourisme
    standard en Colombie-Britannique ?
  choices:
    A: Seul un rétroviseur intérieur est requis.
    B: Seul un rétroviseur extérieur côté conducteur est requis.
    C: Un rétroviseur intérieur et un rétroviseur extérieur côté conducteur sont requis
      (sauf si la vue intérieure est obstruée).
    D: Trois rétroviseurs (un intérieur et deux extérieurs) sont toujours requis.
  answer: C
  explanation: La loi de la Colombie-Britannique exige un rétroviseur intérieur et
    un rétroviseur extérieur du côté du conducteur. Si le rétroviseur intérieur est
    obstrué, un rétroviseur extérieur côté passager est également requis.
- id: 214
  category: vehicle_information
  question: Selon la loi de la Colombie-Britannique, que devez-vous faire si votre
    pare-brise est fissuré ?
  choices:
    A: Vous pouvez conduire tant que la fissure mesure moins de 30 cm de long.
    B: Vous devez le remplacer ou le réparer si la fissure nuit à la vision du conducteur.
    C: Les fissures de pare-brise ne sont illégales que si elles se trouvent du côté
      passager.
    D: Les fissures ne sont vérifiées que lors de la vente d'un véhicule.
  answer: B
  explanation: Le règlement de la loi sur les véhicules à moteur (Motor Vehicle Act)
    de la Colombie-Britannique stipule qu'un pare-brise ne doit pas être fissuré ou
    embué d'une manière qui nuit à la vision du conducteur.
- id: 215
  category: signs_and_signals
  question: Que signifie un signal à barre verticale blanche fixe (signal de transport
    en commun) en Colombie-Britannique ?
  choices:
    A: Tous les véhicules doivent s'arrêter.
    B: Seuls les véhicules d'urgence peuvent circuler.
    C: Seuls les autobus de transport en commun peuvent circuler.
    D: Les piétons peuvent traverser la rue.
  answer: C
  explanation: Une barre verticale blanche fixe est un signal de transport en commun
    qui permet aux autobus de transport public de circuler alors que les autres véhicules
    font face à un feu rouge.
- id: 216
  category: signs_and_signals
  question: 'En Colombie-Britannique, un panneau comportant un losange blanc sur fond
    noir indique :'
  choices:
    A: Un itinéraire pour marchandises dangereuses.
    B: Une voie réservée à des véhicules spécifiques comme les VMO (HOV) ou les autobus.
    C: Un passage à niveau à venir.
    D: Une impasse.
  answer: B
  explanation: Le symbole du losange en Colombie-Britannique identifie les voies réservées,
    telles que les voies pour véhicules multioccupants (VMO/HOV) ou les voies d'autobus.
- id: 217
  category: signs_and_signals
  question: Lorsqu'un conducteur tend le bras gauche par la fenêtre et le pointe vers
    le haut, quel signal donne-t-il ?
  choices:
    A: Un virage à gauche.
    B: Un virage à droite.
    C: Un arrêt ou un ralentissement.
    D: Une cession de passage.
  answer: B
  explanation: Le signal manuel pour un virage à droite est le bras gauche tendu par
    la fenêtre et plié vers le haut au niveau du coude.
- id: 218
  category: signs_and_signals
  question: En Colombie-Britannique, que devez-vous faire à l'approche d'un feu rouge
    clignotant ?
  choices:
    A: Ralentir et avancer avec prudence.
    B: S'arrêter et attendre que le feu passe au vert.
    C: Faire un arrêt complet et ne repartir que lorsque cela est sécuritaire.
    D: Céder le passage uniquement à la circulation venant de la droite.
  answer: C
  explanation: 'Un feu rouge clignotant doit être traité de la même manière qu''un
    panneau d''arrêt : faites un arrêt complet et repartez quand vous pouvez le faire
    en toute sécurité.'
- id: 219
  category: signs_and_signals
  question: 'Un panneau avec un fond jaune-vert fluorescent est spécifiquement utilisé
    en Colombie-Britannique pour :'
  choices:
    A: Les zones de travaux.
    B: Les zones hospitalières.
    C: Les passages pour écoliers, piétons et cyclistes.
    D: Les parcs provinciaux.
  answer: C
  explanation: Les panneaux jaune-vert fluorescents sont utilisés pour offrir une
    grande visibilité aux zones scolaires, aux passages pour piétons et aux avertissements
    pour les cyclistes.
- id: 220
  category: signs_and_signals
  question: En Colombie-Britannique, pouvez-vous tourner à gauche à un feu rouge ?
  choices:
    A: Non, ce n'est jamais autorisé.
    B: Oui, mais seulement d'une rue à sens unique vers une autre rue à sens unique
      après s'être arrêté.
    C: Oui, depuis n'importe quelle rue tant qu'aucun véhicule n'arrive.
    D: Seulement s'il y a un panneau « Virage à gauche autorisé ».
  answer: B
  explanation: En vertu de la loi sur les véhicules à moteur (Motor Vehicle Act) de
    la Colombie-Britannique, un conducteur ne peut tourner à gauche à un feu rouge
    que s'il passe d'une rue à sens unique à une autre rue à sens unique, après avoir
    marqué un arrêt complet et cédé le passage aux piétons et aux autres véhicules.
- id: 221
  category: signs_and_signals
  question: Que signifie une seule ligne blanche pointillée sur la chaussée ?
  choices:
    A: Elle sépare la circulation circulant dans des directions opposées.
    B: Elle indique le bord de la chaussée.
    C: Elle sépare les voies de circulation circulant dans la même direction ; le
      changement de voie est autorisé.
    D: Vous ne devez pas franchir cette ligne.
  answer: C
  explanation: Les lignes blanches séparent la circulation circulant dans la même
    direction. Une ligne blanche pointillée indique que les changements de voie sont
    autorisés lorsque cela est sécuritaire.
- id: 222
  category: signs_and_signals
  question: À quoi ressemble un panneau « Véhicule lent » en Colombie-Britannique
    ?
  choices:
    A: Un losange jaune.
    B: Un triangle orange avec une bordure rouge.
    C: Un carré blanc avec un cercle noir.
    D: Un rectangle vert.
  answer: B
  explanation: Un panneau de véhicule lent est un triangle orange réfléchissant avec
    une bordure rouge, fixé à l'arrière des véhicules qui circulent à 40 km/h ou moins.
- id: 223
  category: signs_and_signals
  question: Quelle est la signification d'une ligne blanche continue à une intersection
    (ligne d'arrêt) ?
  choices:
    A: Vous devez vous arrêter derrière cette ligne.
    B: Vous ne devez vous arrêter que s'il y a un piéton.
    C: Vous pouvez vous arrêter n'importe où tant que vous ne bloquez pas l'intersection.
    D: Elle marque le début d'une piste cyclable.
  answer: A
  explanation: Une ligne blanche continue peinte en travers d'une intersection est
    une ligne d'arrêt. Les conducteurs doivent immobiliser complètement leur véhicule
    derrière cette ligne.
- id: 224
  category: signs_and_signals
  question: 'En Colombie-Britannique, un panneau « C » (lettre C noire sur fond jaune)
    indique :'
  choices:
    A: Travaux de construction à venir.
    B: Zone de prudence.
    C: Un arrêt d'autobus scolaire.
    D: Un cul-de-sac.
  answer: C
  explanation: En Colombie-Britannique, un panneau jaune avec un « C » noir indique
    une zone de montée/descente d'autobus scolaire ou une zone d'arrêt d'autobus scolaire
    désignée.
- id: 225
  category: signs_and_signals
  question: 'Un symbole de losange blanc peint sur une voie en Colombie-Britannique
    indique que la voie est :'
  choices:
    A: Réservée uniquement aux véhicules d'urgence
    B: Une voie réservée aux véhicules multioccupants (VMO/HOV) ou aux autobus
    C: Une zone de stationnement désignée
    D: Une voie qui se termine bientôt
  answer: B
  explanation: Le symbole du losange est utilisé en Colombie-Britannique pour identifier
    les voies réservées à des types de véhicules spécifiques, tels que les autobus
    ou les véhicules multioccupants (VMO/HOV).
- id: 226
  category: signs_and_signals
  question: À l'approche d'un passage à niveau avec des feux rouges clignotants en
    Colombie-Britannique, à quelle distance du rail le plus proche devez-vous vous
    arrêter ?
  choices:
    A: Au moins 2 mètres
    B: Au moins 5 mètres
    C: Au moins 10 mètres
    D: Au moins 15 mètres
  answer: B
  explanation: En vertu de la loi sur les véhicules à moteur de la Colombie-Britannique,
    vous devez vous arrêter à au moins 5 mètres du rail le plus proche à un passage
    à niveau lorsque les signaux indiquent l'approche d'un train.
- id: 227
  category: signs_and_signals
  question: Quelle est la signification d'une ligne blanche continue peinte entre
    deux voies de circulation circulant dans la même direction ?
  choices:
    A: Les changements de voie sont encouragés pour améliorer la fluidité du trafic
    B: Les changements de voie sont déconseillés et doivent être évités
    C: La voie de droite est réservée au stationnement uniquement
    D: La voie de gauche est une voie réservée aux VMO (HOV)
  answer: B
  explanation: Une ligne blanche continue entre des voies circulant dans la même direction
    indique que le changement de voie est déconseillé et ne doit être effectué qu'en
    cas de nécessité.
- id: 228
  category: signs_and_signals
  question: 'En Colombie-Britannique, un panneau avec un fond orange et des symboles
    ou du texte noirs est utilisé pour indiquer :'
  choices:
    A: Des règles réglementaires comme les limites de vitesse
    B: Des points d'intérêt et des services
    C: Des conditions temporaires telles que des travaux de construction ou de voirie
    D: Des zones scolaires et de terrains de jeux
  answer: C
  explanation: Les panneaux oranges sont utilisés en Colombie-Britannique pour avertir
    les conducteurs de conditions temporaires, telles que des zones de construction
    ou des travaux d'entretien.
- id: 229
  category: signs_and_signals
  question: Que signifie un feu jaune fixe à une intersection en Colombie-Britannique
    ?
  choices:
    A: Accélérez pour dégager l'intersection avant qu'il ne devienne rouge
    B: Arrêtez-vous avant d'entrer dans l'intersection, à moins qu'il ne soit dangereux
      de le faire
    C: Continuez à travers l'intersection car vous avez la priorité
    D: Le feu est en panne ; traitez-le comme un arrêt à quatre sens
  answer: B
  explanation: Un feu jaune fixe signifie que le signal est sur le point de passer
    au rouge. Vous devez vous arrêter avant l'intersection, à moins d'y être déjà
    engagé ou de ne pas pouvoir vous arrêter en toute sécurité.
- id: 230
  category: signs_and_signals
  question: 'Lorsque vous voyez un panneau « Cédez le passage » en Colombie-Britannique,
    vous devez :'
  choices:
    A: Toujours effectuer un arrêt complet
    B: Accélérer pour vous insérer dans la circulation
    C: Céder le passage à tout véhicule ou piéton se trouvant déjà dans l'intersection
    D: Ne vous arrêter que si un agent de police est présent
  answer: C
  explanation: Un panneau de cédez le passage signifie que vous devez laisser passer
    tout trafic ou piéton déjà engagé dans l'intersection ou sur la route transversale,
    en ne vous arrêtant que si nécessaire.
- id: 231
  category: signs_and_signals
  question: Quel est l'objectif d'une voie de virage à gauche bidirectionnelle (une
    voie centrale avec une ligne jaune pleine et une ligne jaune pointillée de chaque
    côté) ?
  choices:
    A: Permettre aux véhicules de dépasser les véhicules lents
    B: Fournir une voie réservée uniquement aux véhicules d'urgence
    C: Permettre aux véhicules circulant dans l'une ou l'autre direction de tourner
      à gauche
    D: Servir de voie cyclable réservée
  answer: C
  explanation: Les voies de virage à gauche bidirectionnelles sont conçues pour permettre
    aux véhicules venant de l'une ou l'autre direction de s'engager dans la voie centrale
    pour attendre une ouverture afin de tourner à gauche dans une entrée privée ou
    une rue latérale.
- id: 232
  category: signs_and_signals
  question: En Colombie-Britannique (BC), qu'indique un panneau montrant une personne
    tenant un drapeau ?
  choices:
    A: Un défilé se trouve devant
    B: Un passage pour écoliers avec un brigadier
    C: Un signaleur de chantier se trouve devant ; suivez ses instructions
    D: Un bâtiment gouvernemental se trouve à proximité
  answer: C
  explanation: Ce panneau avertit les conducteurs de la présence d'un signaleur routier
    devant eux. Les conducteurs doivent obéir aux signaux manuels et aux instructions
    du signaleur.
