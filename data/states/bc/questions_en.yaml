  category: sharing_the_road
  question: In British Columbia, what must you do when approaching a stopped emergency
    vehicle with its lights flashing on a highway with a speed limit of 80 km/h or
    higher?
  choices:
    A: Slow down to 40 km/h and move into another lane if safe to do so.
    B: Slow down to 70 km/h and move into another lane if safe to do so.
    C: Maintain your speed but move to the far left lane.
    D: Stop completely until the emergency vehicle turns off its lights.
  answer: B
  explanation: According to BC's 'Move Over' law, if the posted speed limit is 80
    km/h or higher, drivers must slow to 70 km/h and move into the far lane when passing
    stopped emergency vehicles with flashing lights.
- id: 170
  category: sharing_the_road
  question: When a school bus is stopped with its red lights flashing and 'stop' arm
    extended, which drivers must stop in British Columbia?
  choices:
    A: Only drivers following the bus.
    B: Only drivers approaching from the front.
    C: Drivers approaching from both directions, unless the road is divided by a median.
    D: Drivers approaching from both directions on all types of roads, including divided
      highways.
  answer: C
  explanation: In BC, traffic in both directions must stop for a school bus with flashing
    red lights. The only exception is on a highway divided by a median, where only
    the traffic following the bus must stop.
- id: 171
  category: sharing_the_road
  question: In British Columbia, what is the fine for failing to stop for a school
    bus with its red lights flashing?
  choices:
    A: The fine is $167 and 2 points.
    B: The fine is $368 and 3 points.
    C: The fine is $575 and 6 points.
    D: The fine is $1,000 and an immediate 30-day suspension.
  answer: B
  explanation: Failing to stop for a school bus in BC results in a $368 fine and 3
    driver penalty points.
- id: 172
  category: sharing_the_road
  question: When turning right at an intersection where a cyclist is positioned to
    your right and intends to go straight, what should you do?
  choices:
    A: Speed up to pass the cyclist before making the turn.
    B: Honk to warn the cyclist you are turning.
    C: Yield to the cyclist and wait for them to clear the intersection before turning.
    D: Turn right immediately as vehicles always have the right-of-way over bicycles.
  answer: C
  explanation: Drivers must yield to cyclists who are going straight through an intersection
    before making a right turn across their path.
- id: 173
  category: sharing_the_road
  question: What does a 'No-Zone' refer to when driving near large commercial trucks
    in BC?
  choices:
    A: Areas where trucks are not allowed to drive.
    B: The blind spots around the truck where the driver cannot see you.
    C: The weight limit zones for bridges.
    D: The loading docks at warehouses.
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots behind, in front, and
    on both sides of a commercial truck where the truck driver's visibility is limited.
- id: 174
  category: sharing_the_road
  question: In BC, if you are driving on a road with a speed limit of 60 km/h and
    you approach a stopped emergency vehicle with flashing lights, what speed must
    you slow down to?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 20 km/h
  answer: B
  explanation: Under BC's 'Move Over' law, if the posted speed limit is under 80 km/h,
    drivers must slow to 40 km/h when passing a stopped emergency vehicle with flashing
    lights.
- id: 175
  category: sharing_the_road
  question: When a pedestrian is using a white cane or is accompanied by a guide dog
    in BC, what does this indicate to a driver?
  choices:
    A: The pedestrian is a senior citizen.
    B: The pedestrian has a visual impairment and you must give them extra space and
      caution.
    C: The pedestrian is training a dog and you should not stop.
    D: The pedestrian has the right of way only at marked crosswalks.
  answer: B
  explanation: A white cane or guide dog indicates the pedestrian has a visual impairment.
    Drivers must exercise extreme caution and yield the right-of-way.
- id: 176
  category: sharing_the_road
  question: Which of the following is true regarding 'unmarked crosswalks' in British
    Columbia?
  choices:
    A: Pedestrians only have the right-of-way at marked crosswalks.
    B: An unmarked crosswalk exists at every intersection unless a sign prohibits
      crossing.
    C: Drivers are not required to stop for pedestrians at unmarked crosswalks.
    D: Unmarked crosswalks only exist in residential areas.
  answer: B
  explanation: In BC, every intersection has a crosswalk, whether it is marked with
    paint or not. Drivers must yield to pedestrians at all intersections.
- id: 177
  category: sharing_the_road
  question: In BC, what is the standard speed limit in a school zone when children
    are present or when the sign is in effect?
  choices:
    A: 20 km/h from 8 a.m. to 4 p.m.
    B: 30 km/h from 8 a.m. to 5 p.m. on school days.
    C: 40 km/h from 7 a.m. to 7 p.m.
    D: 30 km/h 24 hours a day, 7 days a week.
  answer: B
  explanation: In BC, the school zone speed limit is 30 km/h between 8 a.m. and 5
    p.m. on school days, unless otherwise posted.
- id: 178
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may need to:'
  choices:
    A: Swing wide to the left before turning right.
    B: Stay as close to the right curb as possible.
    C: Speed up to clear the intersection quickly.
    D: Turn from the far left lane.
  answer: A
  explanation: Large vehicles need more space to turn. They often swing wide to the
    left to complete a right-hand turn without hitting the curb or objects on the
    corner.
- id: 179
  category: sharing_the_road
  question: What should you do if an emergency vehicle (ambulance, fire truck, or
    police car) is approaching you from behind with its siren and lights on?
  choices:
    A: Stop exactly where you are.
    B: Speed up to stay ahead of it.
    C: Pull over to the right as far as possible and stop.
    D: Pull over to the left and stop.
  answer: C
  explanation: In BC, you must yield the right-of-way by moving to the right edge
    of the road (or left edge on a one-way street) and coming to a complete stop until
    the emergency vehicle has passed.
- id: 180
  category: sharing_the_road
  question: 'A cyclist in BC signals a right turn by:'
  choices:
    A: Extending the left arm out and bending it upward at the elbow, or extending
      the right arm straight out.
    B: Extending the left arm straight out.
    C: Extending the left arm out and bending it downward at the elbow.
    D: Pointing to the ground with the right hand.
  answer: A
  explanation: Cyclists can signal a right turn by either extending the left arm upward
    at a 90-degree angle or by extending the right arm straight out to the right.
- id: 181
  category: sharing_the_road
  question: In BC, what is the minimum following distance you should maintain behind
    a large vehicle on a high-speed highway to ensure you can see ahead?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: At least 5 seconds
  answer: C
  explanation: While 2 seconds is the minimum for cars in ideal conditions, ICBC recommends
    at least 3 seconds (and more in poor conditions) when following large vehicles
    to allow for better visibility around the truck.
- id: 182
  category: sharing_the_road
  question: When approaching a school bus with its red lights flashing and stop arm
    extended on an undivided highway, who must stop?
  choices:
    A: Only traffic following the bus.
    B: Only traffic approaching from the front.
    C: Traffic in both directions.
    D: No one, if there are at least three lanes of traffic.
  answer: C
  explanation: In BC, on an undivided highway (no median), drivers approaching from
    both the front and the rear must stop for a school bus with flashing red lights.
- id: 183
  category: sharing_the_road
  question: What is the 'No-Zone' in relation to large commercial trucks in British
    Columbia?
  choices:
    A: The area where trucks are not allowed to drive.
    B: The blind spots around the truck where the driver cannot see you.
    C: The lane reserved specifically for trucks on the Coquihalla highway.
    D: The distance a truck needs to come to a full stop.
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots behind, in front, and
    on both sides of a commercial truck where the driver's visibility is limited.
- id: 184
  category: sharing_the_road
  question: Under the BC Motor Vehicle Act, if a pedestrian is crossing at an intersection
    without painted crosswalk lines, what are the driver's responsibilities?
  choices:
    A: The driver has the right of way because there is no marked crosswalk.
    B: The pedestrian must wait for a gap in traffic of at least 100 metres.
    C: The driver must yield as every intersection is considered an 'unmarked crosswalk'.
    D: The driver should honk to warn the pedestrian to stay on the sidewalk.
  answer: C
  explanation: In BC, an 'unmarked crosswalk' exists at every intersection unless
    a sign prohibits crossing. Drivers must yield to pedestrians in these areas.
- id: 185
  category: sharing_the_road
  question: What is the recommended following distance for a vehicle traveling behind
    a motorcycle in BC?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: ICBC recommends a following distance of at least 3 seconds behind a
    motorcycle because they can stop very quickly and are more vulnerable to road
    hazards.
- id: 186
  category: sharing_the_road
  question: When an emergency vehicle (police, fire, or ambulance) approaches you
    from either direction with its siren and lights on, what must you do?
  choices:
    A: Speed up to get out of the way.
    B: Pull over to the nearest curb and stop.
    C: Stop exactly where you are in the lane.
    D: Turn on your hazard lights and continue at the same speed.
  answer: B
  explanation: Drivers must pull over to the nearest curb (usually the right) and
    come to a complete stop, ensuring they do not block an intersection.
- id: 187
  category: sharing_the_road
  question: In BC, when you are preparing to turn right and there is a bicycle lane
    to your right, what is the correct procedure?
  choices:
    A: Turn from your current lane and cut across the bike lane quickly.
    B: Merge into the bike lane only if it has a dashed white line, after checking
      for cyclists.
    C: Always stop in the bike lane to wait for a gap in traffic.
    D: Honk to ensure any cyclists behind you stop before you turn.
  answer: B
  explanation: You should only merge into a bike lane when the line is dashed, and
    only after checking your mirrors and shoulder-checking to ensure no cyclists are
    present.
- id: 188
  category: sharing_the_road
  question: If you see a pedestrian with a white cane or a guide dog at a street corner,
    what does this indicate?
  choices:
    A: The pedestrian is a government official.
    B: The pedestrian has a visual impairment and you must give them extra space and
      time.
    C: The pedestrian is training a dog and you should not stop.
    D: The pedestrian is required to yield to all motor vehicles.
  answer: B
  explanation: A white cane or guide dog indicates a person with a visual impairment.
    Drivers must exercise extreme caution and yield the right of way.
- id: 189
  category: sharing_the_road
  question: Why might a large truck move into the left lane before making a right
    turn at an intersection?
  choices:
    A: The driver is lost and trying to change direction.
    B: Trucks are legally required to turn from the left lane.
    C: The truck needs more room to clear the curb (wide turn).
    D: The driver is trying to block traffic for safety.
  answer: C
  explanation: Large vehicles need to make wide turns to clear the curb. Drivers should
    never try to squeeze between a turning truck and the curb.
- id: 190
  category: sharing_the_road
  question: What does a 'sharrow' symbol (a bicycle with two chevrons above it) painted
    on a BC road mean?
  choices:
    A: The lane is for bicycles only; cars are prohibited.
    B: Cyclists must stay on the sidewalk in this area.
    C: It is a shared lane where motorists and cyclists should occupy the same travel
      lane.
    D: It indicates a high-speed cycling zone.
  answer: C
  explanation: Sharrows indicate a shared lane. They remind motorists to share the
    road and help cyclists with positioning in the lane.
- id: 191
  category: sharing_the_road
  question: When passing a stopped emergency vehicle with flashing lights on a road
    where the speed limit is LESS than 80 km/h, what is the required speed?
  choices:
    A: 20 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: B
  explanation: In BC, if the posted speed limit is less than 80 km/h, drivers must
    slow to 40 km/h when passing a stopped emergency vehicle with lights flashing.
- id: 192
  category: sharing_the_road
  question: Is 'lane splitting' (riding a motorcycle between two lanes of stopped
    or moving traffic) legal in British Columbia?
  choices:
    A: Yes, it is legal if the traffic is moving slower than 30 km/h.
    B: Yes, but only for police motorcycles.
    C: No, it is illegal and considered 'unsafe lane changes' or 'passing on the right'.
    D: Yes, it is encouraged to reduce traffic congestion.
  answer: C
  explanation: Lane splitting is illegal in BC. Motorcycles must occupy a regular
    lane position just like any other vehicle.
- id: 193
  category: vehicle_information
  question: In British Columbia, what is the minimum legal tread depth for winter
    tires when driving on designated mountain passes and rural highways?
  choices:
    A: 1.6 mm
    B: 2.5 mm
    C: 3.5 mm
    D: 4.0 mm
  answer: C
  explanation: According to the BC Motor Vehicle Act, winter tires must have a tread
    depth of at least 3.5 mm to be legal for use on designated highways during the
    winter season.
- id: 194
  category: vehicle_information
  question: According to BC vehicle regulations, which windows are NOT permitted to
    have aftermarket window tinting applied?
  choices:
    A: The rear window only
    B: The rear side windows only
    C: The windshield and front side windows
    D: All windows are allowed to be tinted
  answer: C
  explanation: In BC, aftermarket tinting is prohibited on the windshield (except
    for the top 75mm) and the front side windows for safety and visibility reasons.
- id: 195
  category: vehicle_information
  question: On most BC highways, winter tires or chains are required by law during
    which time period?
  choices:
    A: November 1 to March 31
    B: October 1 to March 31 (extended to April 30 for some passes)
    C: December 1 to February 28
    D: October 31 to April 1
  answer: B
  explanation: In BC, winter tire requirements begin October 1 and end March 31, though
    they are extended to April 30 for many mountain passes and rural highways.
- id: 196
  category: vehicle_information
  question: 'In BC, your vehicle must be equipped with mirrors that provide a view
    of the highway to the rear for a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: The BC Motor Vehicle Act Regulations state that mirrors must provide
    a clear view of the highway for at least 60 metres to the rear.
- id: 197
  category: vehicle_information
  question: What is the minimum legal tread depth for standard (non-winter) tires
    in British Columbia?
  choices:
    A: 1.0 mm
    B: 1.6 mm
    C: 2.0 mm
    D: 3.5 mm
  answer: B
  explanation: The minimum legal tread depth for regular tires in BC is 1.6 mm. Tires
    worn below this limit are considered unsafe.
- id: 198
  category: vehicle_information
  question: 'In BC, you must turn on your headlights if visibility is reduced to less
    than:'
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 300 metres
  answer: B
  explanation: Headlights must be used in BC whenever you cannot see clearly for a
    distance of 150 metres ahead due to weather or light conditions.
- id: 199
  category: vehicle_information
  question: According to BC's Child Passenger Safety laws, a child must use a booster
    seat until they are at least how tall?
  choices:
    A: 135 cm (4'5")
    B: 145 cm (4'9")
    C: 155 cm (5'1")
    D: 165 cm (5'5")
  answer: B
  explanation: In BC, children must remain in a booster seat until they are at least
    145 cm (4'9") tall or reach their 9th birthday.
- id: 200
  category: vehicle_information
  question: 'To provide maximum protection in a collision, the head restraint in your
    vehicle should be adjusted so the top of it is level with:'
  choices:
    A: The base of your neck
    B: The bottom of your ears
    C: The top of your ears
    D: The top of your head
  answer: D
  explanation: ICBC recommends that the head restraint be adjusted so the top is level
    with the top of your head to prevent whiplash.
- id: 201
  category: vehicle_information
  question: In British Columbia, studded tires are only permitted on vehicles during
    which specific dates?
  choices:
    A: September 1 to May 31
    B: October 1 to April 30
    C: November 1 to March 31
    D: October 31 to April 1
  answer: B
  explanation: Studded tires are allowed in BC only from October 1 to April 30. Using
    them outside these dates can result in a fine.
- id: 202
  category: vehicle_information
  question: Which of the following is a mandatory insurance requirement for all vehicle
    owners in British Columbia?
  choices:
    A: Comprehensive coverage from a private insurer
    B: Collision coverage from ICBC
    C: Basic Autoplan coverage from ICBC
    D: Specified Perils coverage
  answer: C
  explanation: All vehicles registered in BC must have Basic Autoplan insurance from
    ICBC, which includes third-party liability and accident benefits.
- id: 203
  category: vehicle_information
  question: If your vehicle's turn signal lights are broken, what is the correct hand
    signal to indicate a right turn in BC?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out and bent upward at the elbow
    C: Left arm out and bent downward at the elbow
    D: Right arm extended straight out the passenger window
  answer: B
  explanation: To signal a right turn manually, the driver extends the left arm out
    the window and bends it upward at a 90-degree angle.
- id: 204
  category: vehicle_information
  question: 'In BC, every motor vehicle must have a tail lamp that emits a red light
    plainly visible from a distance of:'
  choices:
    A: 60 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: The BC Motor Vehicle Act Regulations require tail lamps to be visible
    from a distance of 150 metres to the rear.
- id: 205
  category: vehicle_information
  question: Between which dates are winter tires or chains typically required on most
    designated highways in British Columbia?
  choices:
    A: November 1 to March 31
    B: October 1 to March 31
    C: October 15 to April 15
    D: September 1 to May 1
  answer: B
  explanation: In BC, winter tires or chains are required on most designated highways
    from October 1 to March 31. For some highways, including mountain passes and rural
    routes, this is extended to April 30.
- id: 206
  category: vehicle_information
  question: When following another vehicle from behind, at what distance must you
    dim your high-beam headlights in British Columbia?
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 250 metres
  answer: C
  explanation: You must dim your high beams when following within 150 metres of another
    vehicle to avoid blinding the driver ahead through their mirrors.
- id: 207
  category: vehicle_information
  question: What is the British Columbia law regarding window tinting on the front
    side windows (driver and passenger side)?
  choices:
    A: Tinting is allowed up to 35% light blockage.
    B: Tinting is allowed up to 50% light blockage.
    C: No aftermarket tinting film is allowed on the front side windows.
    D: Tinting is only allowed if the driver has a medical note.
  answer: C
  explanation: The BC Motor Vehicle Act Regulations prohibit the application of aftermarket
    window tint film to the windshield and the front side windows.
- id: 208
  category: vehicle_information
  question: Every motor vehicle in BC, other than a motorcycle, must be equipped with
    which of the following braking systems?
  choices:
    A: Only a foot brake
    B: Only a parking brake
    C: Two separate braking systems (usually a foot brake and a parking brake)
    D: An anti-lock braking system (ABS) is the only requirement
  answer: C
  explanation: 'BC law requires vehicles to have two independent braking systems:
    a service brake (foot brake) and a parking/emergency brake.'
- id: 209
  category: vehicle_information
  question: 'According to BC regulations, a vehicle''s horn must be audible under
    normal conditions from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: A motor vehicle must be equipped with a horn in good working order
    capable of emitting sound audible under normal conditions from a distance of not
    less than 60 metres.
- id: 210
  category: vehicle_information
  question: When are you required to use your headlights in British Columbia?
  choices:
    A: From sunset to sunrise.
    B: Only when it is raining or snowing.
    C: From 30 minutes after sunset to 30 minutes before sunrise, or whenever visibility
      is low.
    D: Only between midnight and 5:00 AM.
  answer: C
  explanation: Headlights must be turned on from 30 minutes after sunset to 30 minutes
    before sunrise, and at any time when visibility is reduced to 150 metres or less.
- id: 211
  category: vehicle_information
  question: What is the minimum third-party liability insurance coverage required
    for a passenger vehicle registered in British Columbia?
  choices:
    A: $100,000
    B: $200,000
    C: $500,000
    D: $1,000,000
  answer: B
  explanation: In BC, the legal minimum for third-party liability insurance is $200,000,
    though ICBC and most experts recommend higher coverage.
- id: 212
  category: vehicle_information
  question: In BC, how should a head restraint be adjusted for maximum safety?
  choices:
    A: Level with the base of the neck.
    B: Level with the top of the ears.
    C: As low as possible to avoid blocking vision.
    D: At least 10 cm away from the back of the head.
  answer: B
  explanation: For maximum protection against whiplash, the head restraint should
    be adjusted so the top of the restraint is level with the top of your ears.
- id: 213
  category: vehicle_information
  question: What is the requirement for mirrors on a standard passenger vehicle in
    British Columbia?
  choices:
    A: Only a rearview mirror is required.
    B: Only a driver-side exterior mirror is required.
    C: An interior rearview mirror and a driver-side exterior mirror are required
      (unless the interior view is obstructed).
    D: Three mirrors (one interior and two exterior) are always required.
  answer: C
  explanation: BC law requires an interior rearview mirror and a side mirror on the
    driver's side. If the interior mirror is obstructed, a passenger-side exterior
    mirror is also required.
- id: 214
  category: vehicle_information
  question: Under BC law, what must you do if your windshield is cracked?
  choices:
    A: You can drive as long as the crack is less than 30 cm long.
    B: You must replace or repair it if the crack interferes with the driver's vision.
    C: Windshield cracks are only illegal if they are on the passenger side.
    D: Cracks are only checked during the sale of a vehicle.
  answer: B
  explanation: The BC Motor Vehicle Act Regulations state that a windshield must not
    be cracked or clouded in a way that impairs the driver's vision.
- id: 215
  category: signs_and_signals
  question: What does a steady white vertical bar signal (transit signal) mean in
    British Columbia?
  choices:
    A: All vehicles must stop.
    B: Only emergency vehicles may proceed.
    C: Only transit buses may proceed.
    D: Pedestrians may cross the street.
  answer: C
  explanation: A steady white vertical bar is a transit signal that allows public
    transit buses to proceed while other traffic faces a red light.
- id: 216
  category: signs_and_signals
  question: 'In BC, a sign featuring a white diamond on a black background indicates:'
  choices:
    A: A dangerous goods route.
    B: A reserved lane for specific vehicles like HOV or buses.
    C: A railway crossing ahead.
    D: A dead-end street.
  answer: B
  explanation: The diamond symbol in British Columbia identifies reserved lanes, such
    as High Occupancy Vehicle (HOV) lanes or bus lanes.
- id: 217
  category: signs_and_signals
  question: When a driver extends their left arm out the window and points it straight
    up, what signal are they giving?
  choices:
    A: A left turn.
    B: A right turn.
    C: Stopping or slowing down.
    D: Yielding to traffic.
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out the window
    and bent upward at the elbow.
- id: 218
  category: signs_and_signals
  question: In BC, what must you do when approaching a flashing red traffic light?
  choices:
    A: Slow down and proceed with caution.
    B: Stop and wait for the light to turn green.
    C: Come to a complete stop and proceed only when it is safe to do so.
    D: Yield to traffic on the right only.
  answer: C
  explanation: 'A flashing red light must be treated the same as a stop sign: come
    to a complete stop and proceed when safe.'
- id: 219
  category: signs_and_signals
  question: 'A sign with a fluorescent yellow-green background is specifically used
    in BC for:'
  choices:
    A: Construction zones.
    B: Hospital zones.
    C: School, pedestrian, and bicycle crossings.
    D: Provincial parks.
  answer: C
  explanation: Fluorescent yellow-green signs are used to provide high visibility
    for school zones, pedestrian crossings, and bicycle warnings.
- id: 220
  category: signs_and_signals
  question: In British Columbia, can you turn left on a red light?
  choices:
    A: No, it is never permitted.
    B: Yes, but only from a one-way street onto another one-way street after stopping.
    C: Yes, from any street as long as no traffic is coming.
    D: Only if there is a 'Left Turn Permitted' sign.
  answer: B
  explanation: Under the BC Motor Vehicle Act, a driver may turn left on a red light
    only if they are turning from a one-way street onto another one-way street, after
    coming to a complete stop and yielding to pedestrians and other traffic.
- id: 221
  category: signs_and_signals
  question: What does a single broken white line on the road surface indicate?
  choices:
    A: Separates traffic moving in opposite directions.
    B: Indicates the edge of the pavement.
    C: Separates lanes of traffic moving in the same direction; lane changing is permitted.
    D: You must not cross this line.
  answer: C
  explanation: White lines separate traffic moving in the same direction. A broken
    white line indicates that lane changes are permitted when safe.
- id: 222
  category: signs_and_signals
  question: What does a 'Slow Moving Vehicle' sign look like in British Columbia?
  choices:
    A: A yellow diamond.
    B: An orange triangle with a red border.
    C: A white square with a black circle.
    D: A green rectangle.
  answer: B
  explanation: A slow-moving vehicle sign is a reflective orange triangle with a red
    border, attached to the rear of vehicles that travel at 40 km/h or less.
- id: 223
  category: signs_and_signals
  question: What is the meaning of a solid white line at an intersection (stop line)?
  choices:
    A: You must stop behind this line.
    B: You should stop only if there is a pedestrian.
    C: You may stop anywhere as long as you don't block the intersection.
    D: It marks the start of a bike lane.
  answer: A
  explanation: A solid white line painted across an intersection is a stop line. Drivers
    must stop their vehicle completely behind this line.
