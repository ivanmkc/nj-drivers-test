  question: 'When you see a ''Yield'' sign in British Columbia, you must:'
  choices:
    A: Always come to a complete stop
    B: Speed up to merge with traffic
    C: Give the right of way to any vehicles or pedestrians in the intersection
    D: Stop only if there is a police officer present
  answer: C
  explanation: A yield sign means you must let any traffic or pedestrians already
    in the intersection or on the through road go first, stopping only if necessary.
