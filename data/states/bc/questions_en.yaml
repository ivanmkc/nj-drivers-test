- id: 121
  category: defensive_driving
  question: When driving in BC during winter, 'black ice' is most likely to form first
    on which of the following surfaces?
  choices:
    A: Gravel roads
    B: Steep hills
    C: Bridges and overpasses
    D: Underground parking exits
  answer: C
  explanation: Bridges and overpasses freeze first because cold air circulates both
