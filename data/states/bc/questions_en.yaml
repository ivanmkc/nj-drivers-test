metadata:
  source: Learn to Drive Smart (ICBC)
  total_questions: 232
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In British Columbia, what is the minimum age required to apply for a Class
    7L (Learner's) driver's license?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: In BC, you must be at least 16 years old to apply for a learner's license.
    If you are under 19, you must also have consent from a parent or legal guardian.
- id: 2
  category: license_system
  question: A supervisor for a driver with a Class 7L license in British Columbia
    must meet which of the following requirements?
  choices:
    A: Be at least 19 years old and hold a Class 7N license
    B: Be at least 21 years old and hold a Class 5 license
    C: Be at least 25 years old and hold a valid Class 1, 2, 3, 4, or 5 license
    D: Be at least 30 years old and have no penalty points
  answer: C
  explanation: According to ICBC, a supervisor must be 25 years of age or older and
    hold a valid full-privilege driver's license (Class 1-5).
- id: 3
  category: license_system
  question: What is the blood alcohol content (BAC) limit for a driver in the Graduated
    Licensing Program (L or N stages) in BC?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Drivers in BC's Graduated Licensing Program (GLP) must have a blood
    alcohol content of zero. There is a zero-tolerance policy for alcohol and drugs
    for L and N drivers.
- id: 4
  category: license_system
  question: How many passengers is a Class 7L (Learner) driver permitted to carry
    in British Columbia?
  choices:
    A: No passengers are allowed
    B: A maximum of 2, including the supervisor
    C: A maximum of 3, including the supervisor
    D: As many as there are seatbelts
  answer: B
  explanation: 'A learner driver is limited to two passengers: the required supervisor
    and one additional passenger.'
- id: 5
  category: license_system
  question: Which of the following is a restriction for a Class 7N (Novice) driver
    regarding electronic devices?
  choices:
    A: They may use hands-free devices only
    B: They may use hand-held devices only while stopped at a red light
    C: They are not permitted to use any electronic device, including hands-free systems
    D: There are no restrictions as long as they are 18 or older
  answer: C
  explanation: In BC, drivers in the L and N stages of the Graduated Licensing Program
    are prohibited from using any electronic device while driving, even hands-free.
- id: 6
  category: license_system
  question: How long must a driver remain in the Novice (N) stage before they are
    eligible to take the Class 5 road test, assuming no credits are earned?
  choices:
    A: 12 months
    B: 18 months
    C: 24 months
    D: 36 months
  answer: C
  explanation: A driver must hold a Class 7N license for at least 24 consecutive months
    without a prohibition before they can take the Class 5 road test.
- id: 7
  category: license_system
  question: In BC, if a Novice driver receives a driving prohibition, what happens
    to their 24-month 'N' stage clock?
  choices:
    A: It continues from where it left off
    B: It is paused for the duration of the prohibition
    C: It restarts from zero once the license is reinstated
    D: It is extended by 6 months
  answer: C
  explanation: If a Novice driver is prohibited from driving, the 24-month period
    required to graduate to a Class 5 license restarts from zero once the prohibition
    ends and the license is reinstated.
- id: 8
  category: license_system
  question: What is the passenger restriction for a Class 7N (Novice) driver when
    NOT accompanied by a supervisor?
  choices:
    A: No passengers allowed
    B: One passenger only, unless they are immediate family
    C: Two passengers only
    D: Up to three passengers
  answer: B
  explanation: Novice drivers are limited to one passenger unless they are accompanied
    by a supervisor (25+ with Class 1-5) or the passengers are immediate family members.
- id: 9
  category: license_system
  question: How can a driver in the Graduated Licensing Program reduce their time
    in the Novice (N) stage by six months?
  choices:
    A: By having no tickets for one year
    B: By completing an ICBC-approved driver training course during the L stage
    C: By passing the Class 7 road test on the first attempt
    D: By completing 50 hours of recorded practice driving
  answer: B
  explanation: Successful completion of an ICBC-approved driver training course while
    in the L stage can reduce the N stage by six months, provided the driver remains
    ticket-free and at fault accident-free for the first 18 months of the N stage.
- id: 10
  category: license_system
  question: During the Learner (L) stage, between what hours is the driver prohibited
    from operating a vehicle?
  choices:
    A: 9:00 pm to 6:00 am
    C: 11:00 pm to 5:00 am
    B: Midnight to 5:00 am
    D: 10:00 pm to 7:00 am
  answer: B
  explanation: Class 7L drivers are prohibited from driving between midnight and 5:00
    am.
- id: 11
  category: license_system
  question: Where must the 'L' or 'N' sign be displayed on the vehicle while a GLP
    driver is operating it?
  choices:
    A: On the front windshield
    B: On the dashboard
    C: On the back of the vehicle, visible to drivers behind
    D: On the side window
  answer: C
  explanation: The 'L' or 'N' sign must be clearly visible on the back of the vehicle
    for other drivers to see.
- id: 12
  category: license_system
  question: Which of the following documents is NOT required when you go to an ICBC
    driver licensing office to take your knowledge test?
  choices:
    A: Primary identification (e.g., Birth Certificate or Passport)
    B: Secondary identification (e.g., BC Services Card or Student ID)
    C: Proof of vehicle insurance
    D: The required fee for the test
  answer: C
  explanation: You need primary and secondary ID and the fee for the knowledge test.
    Proof of vehicle insurance is not required to take the knowledge test, as you
    are not yet driving.
- id: 13
  category: license_system
  question: In BC, how many months must a driver hold a Class 7L license before they
    are eligible to take the Class 7 road test?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: A learner must hold their Class 7L license for at least 12 months before
    they can take the Class 7 road test to move to the Novice stage.
- id: 14
  category: license_system
  question: What is the primary purpose of the Driver Penalty Point (DPP) system in
    British Columbia?
  choices:
    A: To collect revenue for the government
    B: To track driving records and apply premiums to high-risk drivers
    C: To determine vehicle registration fees
    D: To replace the need for traffic fines
  answer: B
  explanation: The DPP system tracks driving offenses. If you collect more than 3
    points in a one-year assessment period, you must pay a Driver Penalty Point premium.
- id: 15
  category: license_system
  question: If you move to British Columbia from another province, how long do you
    have to switch your out-of-province driver's license to a BC license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: New residents of BC have 90 days to switch their valid out-of-province
    driver's license to a BC license.
- id: 16
  category: license_system
  question: In British Columbia, how many days do you have to notify ICBC of a change
    of name or address?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: According to the BC Motor Vehicle Act, you must notify ICBC within
    10 days of changing your name or address.
- id: 17
  category: license_system
  question: Which of the following is considered a 'Primary' piece of identification
    when applying for a BC driver's license?
  choices:
    A: BC CareCard
    B: Student ID card
    C: Canadian Birth Certificate
    D: Credit Card
  answer: C
  explanation: A Canadian Birth Certificate is a primary ID. Items like student IDs
    or credit cards are considered secondary or not accepted for primary identification.
- id: 18
  category: license_system
  question: At what age are drivers in British Columbia required to undergo a mandatory
    medical examination to prove they are fit to drive?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: D
  explanation: In BC, drivers must have a medical exam at age 80, and every two years
    thereafter, to ensure they are still capable of driving safely.
- id: 19
  category: license_system
  question: If you fail your first Class 7 road test in British Columbia, how long
    must you wait before you can take the test again?
  choices:
    A: 7 days
    B: 14 days
    C: 21 days
    D: 30 days
  answer: B
  explanation: After the first failed road test, there is a 14-day waiting period.
    This increases to 30 days for a second failure and 60 days for subsequent failures.
- id: 20
  category: license_system
  question: How many Driver Penalty Points (DPP) are assessed for a single conviction
    of 'Use of an electronic device while driving' in BC?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Distracted driving (using an electronic device) carries a penalty of
    4 points in British Columbia.
- id: 21
  category: license_system
  question: In BC, the Driver Premium Surcharge (DPS) is an additional amount you
    must pay if you have how many or more points on your record during a 12-month
    period?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: B
  explanation: Drivers who collect 4 or more points during their assessment period
    (one year) must pay a Driver Penalty Point premium.
- id: 22
  category: license_system
  question: What is the maximum weight of a trailer that a holder of a standard Class
    5 or 7 license can tow in BC without a heavy trailer endorsement?
  choices:
    A: 2,500 kg
    B: 3,600 kg
    C: 4,600 kg
    D: 5,500 kg
  answer: C
  explanation: A Class 5 or 7 license allows you to tow trailers up to 4,600 kg (gross
    vehicle weight). Anything heavier requires a House Trailer endorsement (Code 07)
    or a Heavy Trailer endorsement (Code 20).
- id: 23
  category: license_system
  question: If you fail the BC driver's knowledge test, how long must you wait before
    you can attempt the test again?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: If you fail a knowledge test, you must wait 7 days before you can take
    it again.
- id: 24
  category: license_system
  question: Visitors to British Columbia who are not moving to the province can drive
    with a valid out-of-province license for up to how long?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Visitors can drive in BC for up to six months as long as they have
    a valid driver's license from outside BC.
- id: 25
  category: license_system
  question: When you purchase a used vehicle in British Columbia, how many days do
    you have to register the transfer of ownership with ICBC?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: Immediately
  answer: A
  explanation: The buyer must register the transfer of ownership with ICBC within
    10 days of the purchase date.
- id: 26
  category: license_system
  question: Which of the following describes a Class 4 (Restricted) driver's license
    in BC?
  choices:
    A: Allows driving of buses with more than 25 passengers
    B: Allows driving of taxis, limousines, and ambulances (up to 10 occupants)
    C: Allows driving of motorcycles only
    D: Allows driving of heavy trucks with air brakes
  answer: B
  explanation: A Class 4 (Restricted) license allows you to drive taxis, limousines,
    ambulances, and small buses with a total capacity of up to 10 persons (including
    the driver).
- id: 27
  category: license_system
  question: 'Full-time students attending a recognized educational institution in
    BC who are from another province:'
  choices:
    A: Must switch to a BC license within 90 days
    B: Must switch to a BC license within 6 months
    C: May drive with their home province license as long as they remain a full-time
      student
    D: Are not allowed to drive in BC
  answer: C
  explanation: Full-time students at recognized BC institutions can continue to use
    their valid out-of-province license while they are studying.
- id: 28
  category: license_system
  question: A standard British Columbia driver's license is typically valid for how
    many years before it must be renewed?
  choices:
    A: 2 years
    B: 5 years
    C: 8 years
    D: 10 years
  answer: B
  explanation: Most BC driver's licenses are issued for a 5-year period and expire
    on the driver's birthday.
- id: 29
  category: license_system
  question: Which BC license class is required specifically for operating a motorcycle?
  choices:
    A: Class 4
    B: Class 5
    C: Class 6
    D: Class 8
  answer: C
  explanation: Class 6 is the full motorcycle license in British Columbia. Class 8
    is the motorcycle learner/novice license.
- id: 30
  category: driver_testing
  question: To pass the ICBC knowledge test for a Class 7L license, what is the minimum
    score required?
  choices:
    A: 35 out of 50
    B: 40 out of 50
    C: 45 out of 50
    D: 30 out of 40
  answer: B
  explanation: In British Columbia, the knowledge test consists of 50 multiple-choice
    questions, and you must answer at least 40 correctly to pass.
- id: 31
  category: driver_testing
  question: Which of the following vehicle defects would result in an ICBC examiner
    refusing to conduct a road test?
  choices:
    A: A small chip in the windshield that does not obstruct vision
    B: A cracked windshield in the area swept by the wipers
    C: A vehicle that is missing its hubcaps
    D: A vehicle with an empty windshield washer fluid reservoir
  answer: B
  explanation: ICBC safety standards for road tests prohibit vehicles with cracked
    windshields in the driver's field of vision or the area swept by wipers, as it
    is a safety hazard.
- id: 32
  category: driver_testing
  question: In British Columbia, what is the minimum amount of Third Party Liability
    insurance coverage required for all vehicles?
  choices:
    A: $100,000
    B: $200,000
    C: $500,000
    D: $1,000,000
  answer: B
  explanation: Under the BC Motor Vehicle Act, the minimum mandatory Third Party Liability
    coverage provided by ICBC Basic Autoplan is $200,000.
- id: 33
  category: driver_testing
  question: When moving to British Columbia from another province, how many days do
    you have to register and license your vehicle with ICBC?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: While you have 90 days to switch your driver's license, you only have
    30 days to register, license, and insure your vehicle after moving to BC.
- id: 34
  category: driver_testing
  question: During an ICBC road test, what is the policy regarding the use of a backup
    camera?
  choices:
    A: Backup cameras are strictly prohibited and must be covered.
    B: You may use the camera, but you must still perform 360-degree vision checks
      and look out the rear window.
    C: You may rely solely on the camera for all reversing maneuvers.
    D: Backup cameras can only be used during the parallel parking portion of the
      test.
  answer: B
  explanation: ICBC allows the use of backup cameras as a secondary aid, but drivers
    are still required to demonstrate proper observation skills, including shoulder
    checks and looking through the rear window while reversing.
- id: 35
  category: driver_testing
  question: Which of these actions will result in an automatic failure during a BC
    road test?
  choices:
    A: Stalling the engine once
    B: Touching the curb while parallel parking (without climbing it)
    C: Requiring the examiner to take control of the vehicle to avoid a hazard
    D: Crossing your hands on the steering wheel during a turn
  answer: C
  explanation: An 'intervention' where the examiner must take control of the steering
    wheel or brake to prevent an accident is an automatic failure on any BC road test.
- id: 36
  category: driver_testing
  question: In BC, a driver in the 'Warn' range of Blood Alcohol Content (0.05 to
    0.08) for the first time faces an immediate roadside prohibition (IRP) of how
    many days?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: B
  explanation: For a first-time 'Warn' range (0.05 to 0.08 BAC), a driver faces a
    3-day immediate roadside prohibition, a fine, and a vehicle impoundment at the
    officer's discretion.
- id: 37
  category: driver_testing
  question: Under the BC Driver Improvement Program, who has the authority to prohibit
    a driver from driving based on their driving record?
  choices:
    A: The local police chief
    B: The ICBC examiner
    C: The Superintendent of Motor Vehicles
    D: The Premier of British Columbia
  answer: C
  explanation: The Superintendent of Motor Vehicles reviews driving records and has
    the legal authority to issue driving prohibitions under the Driver Improvement
    Program.
- id: 38
  category: driver_testing
  question: What is the 'Driver Premium Surcharge' in British Columbia?
  choices:
    A: A tax paid by all new drivers under 19.
    B: An additional insurance cost for drivers with certain high-risk convictions
      like excessive speeding or distracted driving.
    C: The fee paid to take a road test.
    D: A discount given to drivers who complete a high school driver education course.
  answer: B
  explanation: The Driver Premium Surcharge (DPS) is a penalty billed to drivers who
    have one or more high-risk driving offenses (e.g., excessive speeding, distracted
    driving) within a three-year period.
- id: 39
  category: driver_testing
  question: If you are taking a Class 5 road test in BC, which of the following maneuvers
    is specifically tested that is NOT usually emphasized in the Class 7 test?
  choices:
    A: Shoulder checking
    B: Parallel parking
    C: Highway merging and exiting at higher speeds
    D: Using turn signals
  answer: C
  explanation: The Class 5 road test is more advanced than the Class 7 test and typically
    includes more complex driving environments, such as highway driving and higher-speed
    merging/exiting.
- id: 40
  category: driver_testing
  question: In BC, if you fail the vision test during your license application, what
    is the next step?
  choices:
    A: You are permanently banned from driving.
    B: You must wait 6 months to re-test.
    C: You will be asked to see an eye doctor (optometrist or ophthalmologist) and
      bring back a vision report.
    D: You can still take the knowledge test but cannot take the road test.
  answer: C
  explanation: If you do not meet the minimum vision standards at the ICBC office,
    you will be given a form for an eye specialist to complete to determine if your
    vision can be corrected or if you are safe to drive.
- id: 41
  category: driver_testing
  question: Which of the following is a requirement for the vehicle you bring to your
    ICBC road test?
  choices:
    A: It must be a dual-brake vehicle.
    B: It must have a valid insurance decal on the license plate (or valid registration
      papers).
    C: It must be a compact or sub-compact car.
    D: It must have been manufactured within the last 10 years.
  answer: B
  explanation: The vehicle must be properly insured, registered, and in good working
    order (including working lights, horn, and seatbelts) to be used for a road test.
- id: 42
  category: driver_testing
  question: In British Columbia, how often are Driver Penalty Point (DPP) premiums
    billed to a driver?
  choices:
    A: Every time you receive a ticket.
    B: Once a year, based on the points collected during a 12-month assessment period.
    C: Every five years when you renew your license.
    D: Monthly, as part of your insurance payment.
  answer: B
  explanation: DPP premiums are separate from insurance and are billed annually if
    a driver accumulates 4 or more points within their assessment period.
- id: 43
  category: driver_testing
  question: What is the minimum age to apply for a Class 4 (Restricted) commercial
    license in BC, which allows you to drive taxis and ride-hail vehicles?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: B
  explanation: To apply for a Class 4 commercial license in British Columbia, you
    must be at least 19 years old and hold a valid Class 5 or 6 license (or equivalent).
- id: 44
  category: driver_testing
  question: What is the minimum visual acuity required to pass the vision screening
    for a Class 5 or 7 license in British Columbia?
  choices:
    A: 20/20 in both eyes
    B: 20/30 in the better eye
    C: 20/40 with both eyes open and examined together
    D: 20/50 in at least one eye
  answer: C
  explanation: ICBC requires a minimum visual acuity of 20/40 with both eyes open
    and examined together, with or without corrective lenses, for a standard passenger
    vehicle license.
- id: 45
  category: driver_testing
  question: During a BC road test, which of the following vehicle defects would result
    in the test being canceled before it begins?
  choices:
    A: A small chip in the windshield outside the driver's line of vision
    B: An empty windshield washer fluid reservoir
    C: A non-functioning passenger-side brake light
    D: A minor dent on the rear bumper
  answer: C
  explanation: For a road test, the vehicle must be safe and meet legal requirements.
    A non-functioning brake light, turn signal, or a cracked windshield in the driver's
    line of vision are common reasons for ICBC examiners to cancel a test.
- id: 46
  category: driver_testing
  question: How many questions are on the British Columbia Class 7L knowledge test,
    and what is the passing score?
  choices:
    A: 40 questions; 30 correct
    B: 50 questions; 40 correct
    C: 25 questions; 20 correct
    D: 60 questions; 50 correct
  answer: B
  explanation: The ICBC knowledge test consists of 50 multiple-choice questions. You
    must answer 40 correctly (80%) to pass.
- id: 47
  category: driver_testing
  question: In BC, the Driver Risk Premium (DRP) is an annual payment required from
    drivers who have which of the following on their record?
  choices:
    A: One parking ticket
    B: A single speeding ticket for 10 km/h over the limit
    C: One or more 'Excessive Speeding' convictions
    D: A failed parallel parking attempt during a road test
  answer: C
  explanation: The Driver Risk Premium (DRP) is a separate charge from fines and is
    billed annually to drivers with high-risk offenses, such as excessive speeding
    (40 km/h+ over), driving prohibitions, or alcohol-related convictions.
- id: 48
  category: driver_testing
  question: What is the minimum horizontal field of vision required to pass the ICBC
    vision test for a Class 5 license?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 180 degrees
  answer: C
  explanation: To meet the vision standards for a Class 5 or 7 license in BC, a driver
    must have a continuous horizontal field of vision of at least 120 degrees.
- id: 49
  category: driver_testing
  question: When taking a Class 7 (Novice) road test, a driver is required to demonstrate
    'Hazard Perception.' What does this involve?
  choices:
    A: Identifying and naming potential hazards while driving
    B: Performing an emergency controlled stop from 50 km/h
    C: Driving through a construction zone without slowing down
    D: Using a mobile app to report road hazards to ICBC
  answer: A
  explanation: During the Class 7 road test, the examiner will ask the driver to identify
    hazards they see (e.g., pedestrians, opening car doors, icy patches) to demonstrate
    they are scanning the environment effectively.
- id: 50
  category: driver_testing
  question: Are you allowed to use a vehicle's built-in backup camera during a BC
    road test?
  choices:
    A: No, the camera must be covered with tape
    B: Yes, but you must still primarily use mirrors and 360-degree shoulder checks
    C: Yes, it can be your only source of vision while reversing
    D: Only if you have a medical exemption
  answer: B
  explanation: ICBC allows the use of backup cameras and parking sensors, but they
    are considered 'driver aids.' You will fail if you rely solely on them and do
    not perform the required physical shoulder checks and mirror scans.
- id: 51
  category: driver_testing
  question: If a driver in the Graduated Licensing Program (GLP) is required to take
    a Driver Medical Examination, who is responsible for paying the physician's fee?
  choices:
    A: ICBC
    B: The provincial government (MSP)
    C: The driver
    D: The driver's insurance company
  answer: C
  explanation: In BC, any fees charged by a doctor for completing a Driver Medical
    Examination Report (DMER) are the responsibility of the driver and are not covered
    by MSP or ICBC.
- id: 52
  category: driver_testing
  question: What happens if you arrive for your BC road test and your vehicle's dashboard
    displays an active 'Airbag' warning light?
  choices:
    A: The test proceeds as normal
    B: The examiner will disable the airbag and continue
    C: The test will be canceled because the vehicle is deemed unsafe
    D: You will be given a 5-point penalty but can still take the test
  answer: C
  explanation: ICBC safety standards for road test vehicles require that no safety
    warning lights (like ABS or Airbags) are illuminated, as they indicate a potential
    failure of safety equipment.
- id: 53
  category: driver_testing
  question: Under the Driver Improvement Program, what is the typical point threshold
    where a Novice (Class 7N) driver will receive a warning letter?
  choices:
    A: 2 to 6 points
    B: 10 to 12 points
    C: 15 points
    D: 20 points
  answer: A
  explanation: Novice drivers are held to a higher standard. They typically receive
    a warning letter at 2-6 points and can face a driving prohibition with as few
    as 2 to 6 points, depending on the severity of the offenses.
- id: 54
  category: driver_testing
  question: The 'Enhanced Road Assessment' (ERA) in BC is most commonly required for
    which group of drivers?
  choices:
    A: Drivers applying for a motorcycle license
    B: Drivers who have failed their knowledge test three times
    C: Drivers with reported medical conditions or seniors whose fitness to drive
      is being assessed
    D: Professional truck drivers
  answer: C
  explanation: The Enhanced Road Assessment (ERA) is a non-graded assessment used
    by RoadSafetyBC to determine if a driver (often seniors or those with medical
    conditions) can continue to drive safely.
- id: 55
  category: driver_responsibility
  question: 'If you are involved in a motor vehicle accident in BC where property
    damage only occurs, you must report it to the police if the damage appears to
    exceed:'
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: D
  explanation: According to the BC Motor Vehicle Act, property-damage-only accidents
    must be reported to the police if the damage exceeds $10,000 ($1,000 for motorcycles
    and $600 for bicycles).
- id: 56
  category: driver_responsibility
  question: A new resident of British Columbia must register and license their vehicle
    with ICBC within how many days of moving to the province?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: While you have 90 days to switch your driver's license, you only have
    30 days to register, license, and insure your vehicle after moving to BC.
- id: 57
  category: driver_responsibility
  question: When selling a BC-registered vehicle, the seller must provide the buyer
    with a signed Transfer/Tax Form (APV9T). How many days does the buyer have to
    register the transfer with ICBC?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: Immediately
  answer: A
  explanation: In British Columbia, the buyer of a vehicle must register the transfer
    of ownership with ICBC within 10 days of the purchase date.
- id: 58
  category: driver_responsibility
  question: Under the Driver Penalty Point (DPP) system, at what point threshold does
    a driver start paying a Driver Penalty Point premium?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Drivers in BC are assessed a Driver Penalty Point premium if they accumulate
    four or more points within a 12-month assessment period.
- id: 59
  category: driver_responsibility
  question: What is the fine in British Columbia for operating a motor vehicle without
    valid insurance?
  choices:
    A: $167
    B: $368
    C: $598
    D: $1,200
  answer: C
  explanation: Driving without insurance in BC carries a significant fine of $598,
    and the vehicle may be towed.
- id: 60
  category: driver_responsibility
  question: Under BC's 'Enhanced Care' insurance model, what is the primary benefit
    regarding medical and rehabilitation costs after a crash?
  choices:
    A: Benefits are only paid to the driver who was not at fault.
    B: Benefits are available to all BC residents regardless of who was at fault.
    C: Benefits are capped at $50,000 per person.
    D: Benefits are only available if you sue the other driver.
  answer: B
  explanation: BC's Enhanced Care is a 'no-fault' model, meaning all BC residents
    injured in a crash have access to medical and rehabilitation benefits regardless
    of who caused the crash.
- id: 61
  category: driver_responsibility
  question: If you are involved in a crash, what information are you legally required
    to exchange with the other driver(s)?
  choices:
    A: Name, address, and phone number only.
    B: Name, address, vehicle plate number, and insurance information.
    C: Driver's license number and credit card information.
    D: No information is required if there are no injuries.
  answer: B
  explanation: Drivers involved in a crash must provide their name, address, vehicle
    plate number, and insurance information to the other party and any person injured.
- id: 62
  category: driver_responsibility
  question: Which of the following is a requirement for a vehicle being brought into
    BC from another province before it can be registered?
  choices:
    A: It must be painted a neutral color.
    B: It must pass a provincial safety inspection at a designated facility.
    C: It must have less than 100,000 kilometers on the odometer.
    D: It must be less than 5 years old.
  answer: B
  explanation: Most vehicles from outside BC must pass a provincial safety inspection
    at a designated inspection facility before they can be registered and insured
    in BC.
- id: 63
  category: driver_responsibility
  question: 'In BC, the ''Driver Factor'' used to determine insurance premiums is
    primarily based on:'
  choices:
    A: The age and gender of the driver.
    B: The value and safety rating of the vehicle.
    C: The driver's years of driving experience and crash history.
    D: The neighborhood where the driver lives.
  answer: C
  explanation: ICBC's insurance model uses a 'Driver Factor' which looks at a driver's
    years of experience and their history of at-fault crashes.
- id: 64
  category: driver_responsibility
  question: If you are selling your vehicle in BC, what should you do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner.
    B: Remove them and keep them or return them to an ICBC broker.
    C: Throw them away immediately.
    D: Give them to the police.
  answer: B
  explanation: License plates in BC belong to the owner, not the vehicle. When selling
    a vehicle, you must remove your plates. You may be able to transfer them to a
    new vehicle or return them for a refund on the remaining insurance.
- id: 65
  category: driver_responsibility
  question: Is it legal to park an uninsured vehicle on a public street in British
    Columbia?
  choices:
    A: Yes, as long as it is not being driven.
    B: Yes, but only for up to 48 hours.
    C: No, any vehicle on a public road must be insured.
    D: Yes, if the owner lives on that street.
  answer: C
  explanation: In BC, any vehicle parked or operated on a public roadway must have
    valid basic insurance and display valid license plates.
- id: 66
  category: driver_responsibility
  question: 'Under BC''s Motor Vehicle Act, if you hit an unattended vehicle and cannot
    find the owner, you must:'
  choices:
    A: Wait at the scene for at least two hours.
    B: Leave a note with your name, address, and the owner's name/address of the vehicle
      you are driving.
    C: Drive away if there is no visible damage.
    D: Call a tow truck to move the other vehicle.
  answer: B
  explanation: If you hit an unattended vehicle, you are legally required to leave
    a note in a conspicuous place on that vehicle with your contact information and
    the vehicle owner's information.
- id: 67
  category: driver_responsibility
  question: In BC, who is responsible for ensuring that a passenger under the age
    of 16 is wearing a seatbelt?
  choices:
    A: The passenger themselves.
    B: The passenger's parents, even if they are not in the car.
    C: The driver of the vehicle.
    D: The owner of the vehicle, regardless of who is driving.
  answer: C
  explanation: The driver is legally responsible for ensuring that all passengers
    under the age of 16 are properly secured with seatbelts or child restraint systems.
- id: 68
  category: driver_responsibility
  question: If you are involved in a motor vehicle accident in BC where a person has
    been injured, what is your immediate legal obligation?
  choices:
    A: Report the accident to ICBC within 24 hours only
    B: Exchange insurance information and leave
    C: Remain at the scene and render all possible assistance, and report to the police
    D: Drive to the nearest ICBC claim center immediately
  answer: C
  explanation: Under the BC Motor Vehicle Act, drivers must remain at the scene, provide
    assistance to the injured, and report any accident involving injury or death to
    the police immediately.
- id: 69
  category: driver_responsibility
  question: If you collide with a parked vehicle and the owner is not present, what
    are you legally required to do in BC?
  choices:
    A: Wait for 10 minutes and then leave if no one shows up
    B: Report it to ICBC only if the damage is over $2,000
    C: Leave a note in a conspicuous place with your name, address, and the vehicle
      owner's name/address (if different) and plate number
    D: Call a tow truck to move the other vehicle
  answer: C
  explanation: The BC Motor Vehicle Act requires drivers who hit an unattended vehicle
    to leave a written notice with their contact and vehicle information.
- id: 70
  category: driver_responsibility
  question: In BC, where is it legal to keep a vehicle that does not have valid insurance
    and license plates?
  choices:
    A: On a quiet residential street
    B: In a public parking lot
    C: Only on private property
    D: On the shoulder of a highway
  answer: C
  explanation: Uninsured vehicles cannot be driven or parked on any public roadway
    in British Columbia; they must be kept on private property.
- id: 71
  category: driver_responsibility
  question: What is the name of the official document required to transfer vehicle
    ownership in British Columbia?
  choices:
    A: Form T-1
    B: APV9T
    C: BC-TRANS-01
    D: ICBC-SALE-10
  answer: B
  explanation: The APV9T is the Transfer/Tax Form provided by ICBC that must be signed
    by both the seller and the buyer to legally transfer a vehicle.
- id: 72
  category: driver_responsibility
  question: For how many years does a serious conviction (like Excessive Speeding)
    stay on your record for the purpose of calculating the Driver Risk Premium (DRP)?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: ICBC looks at your driving record over a three-year period to determine
    if you are liable for a Driver Risk Premium.
- id: 73
  category: driver_responsibility
  question: Which of the following insurance coverages is 'Optional' (not mandatory)
    in British Columbia?
  choices:
    A: Third-Party Liability (up to $200,000)
    B: Enhanced Accident Benefits
    C: Collision and Comprehensive coverage
    D: Underinsured Motorist Protection
  answer: C
  explanation: While Third-Party Liability and Accident Benefits are part of the mandatory
    Basic Autoplan, Collision and Comprehensive coverages are optional.
- id: 74
  category: driver_responsibility
  question: What is the consequence if a driver fails to pay their Driver Penalty
    Point (DPP) or Driver Risk Premium (DRP) bill?
  choices:
    A: They will be fined $50
    B: They will be unable to renew their driver's license or vehicle insurance
    C: Their vehicle will be impounded immediately
    D: Nothing, as these are optional fees
  answer: B
  explanation: ICBC will refuse to issue or renew a driver's license or vehicle insurance
    if the driver has outstanding debt related to DPP or DRP premiums.
- id: 75
  category: safe_driving_rules
  question: In British Columbia, what is the default speed limit inside a municipality
    unless otherwise posted?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: According to the BC Motor Vehicle Act, the speed limit in a municipality
    is 50 km/h unless signs indicate otherwise.
- id: 76
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit for a school zone in
    BC when school is in session?
  choices:
    A: 20 km/h between 8 a.m. and 4 p.m.
    B: 30 km/h between 8 a.m. and 5 p.m.
    C: 30 km/h between 7 a.m. and 7 p.m.
    D: 40 km/h between 8 a.m. and 5 p.m.
  answer: B
  explanation: In BC, school zone speed limits are 30 km/h from 8 a.m. to 5 p.m. on
    school days, unless otherwise posted.
- id: 77
  category: safe_driving_rules
  question: What are the effective hours for a 30 km/h playground zone speed limit
    in British Columbia?
  choices:
    A: 8 a.m. to 5 p.m. daily
    B: 8 a.m. to 8 p.m. daily
    C: Dawn to dusk daily
    D: 24 hours a day
  answer: C
  explanation: Playground zones in BC are in effect from dawn to dusk every day of
    the year.
- id: 78
  category: safe_driving_rules
  question: In BC, what is the minimum distance you must park away from a fire hydrant?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 6 meters
  answer: C
  explanation: The BC Motor Vehicle Act prohibits parking within 5 meters of a fire
    hydrant.
- id: 79
  category: safe_driving_rules
  question: How far must you park from a stop sign, traffic control signal, or marked
    crosswalk in British Columbia?
  choices:
    A: 3 meters
    B: 5 meters
    C: 6 meters
    D: 10 meters
  answer: C
  explanation: Drivers in BC must not park within 6 meters of a stop sign, traffic
    light, or crosswalk.
- id: 80
  category: safe_driving_rules
  question: Under BC's 'Move Over' law, if the posted speed limit is 80 km/h or higher,
    what speed must you slow down to when passing an emergency vehicle with flashing
    lights?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: D
  explanation: If the speed limit is 80 km/h or higher, drivers must slow to 70 km/h.
    If the limit is under 80 km/h, they must slow to 40 km/h.
- id: 81
  category: safe_driving_rules
  question: In BC, when is it legal to turn left on a red light after coming to a
    complete stop and yielding to traffic/pedestrians?
  choices:
    A: Never
    B: From a two-way street onto a one-way street
    C: From a one-way street onto another one-way street
    D: At any intersection after midnight
  answer: C
  explanation: In BC, you may turn left on a red light only if you are turning from
    a one-way street onto another one-way street, provided you stop first and yield.
- id: 82
  category: safe_driving_rules
  question: When driving in a city or town in BC, how far in advance should you signal
    before making a turn?
  choices:
    A: 15 meters
    B: 30 meters
    C: 50 meters
    D: 100 meters
  answer: B
  explanation: ICBC recommends signaling at least 30 meters before turning in city
    traffic to give other drivers enough warning.
- id: 83
  category: safe_driving_rules
  question: What does a double solid yellow line down the center of a roadway mean
    in British Columbia?
  choices:
    A: Passing is allowed if the way is clear
    B: Passing is prohibited
    C: Passing is allowed only during daylight hours
    D: It marks a high-occupancy vehicle lane
  answer: B
  explanation: A double solid yellow line means that passing is prohibited in both
    directions.
- id: 84
  category: safe_driving_rules
  question: According to BC's 2024 regulations, what is the minimum distance a driver
    must maintain when passing a cyclist on a road with a speed limit of 50 km/h or
    less?
  choices:
    A: 0.5 meters
    B: 1 meter
    C: 1.5 meters
    D: 2 meters
  answer: B
  explanation: New BC laws require a minimum passing distance of 1 meter for cyclists
    on roads with speed limits of 50 km/h or less, and 1.5 meters on roads over 50
    km/h.
- id: 85
  category: safe_driving_rules
  question: When approaching a railway crossing in BC, what is the minimum distance
    you must stop from the nearest rail if a train is coming?
  choices:
    A: 2 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: Drivers must stop at least 5 meters back from the nearest rail at a
    railway crossing when a train is approaching.
- id: 86
  category: safe_driving_rules
  question: In British Columbia, what is the recommended following distance behind
    another vehicle in ideal weather conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 1 car length for every 10 km/h
  answer: B
  explanation: ICBC recommends a minimum following distance of 2 seconds in ideal
    conditions and 3 seconds on high-speed roads.
- id: 87
  category: safe_driving_rules
  question: If two vehicles arrive at a four-way stop in BC at the same time, who
    has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The vehicle on the busier street
  answer: B
  explanation: If two vehicles arrive at a four-way stop at the same time, the driver
    on the left must yield to the driver on the right.
- id: 88
  category: safe_driving_rules
  question: When using high-beam headlights in BC, within what distance must you dim
    them when approaching an oncoming vehicle?
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: The BC Motor Vehicle Act requires drivers to dim high beams within
    150 meters of an oncoming vehicle.
- id: 89
  category: safe_driving_rules
  question: In BC, what does a flashing green light at an intersection usually indicate?
  choices:
    A: The light is about to turn red
    B: It is a pedestrian-controlled signal
    C: You have a protected left turn
    D: The intersection is under construction
  answer: B
  explanation: In British Columbia, a flashing green light indicates a pedestrian-controlled
    signal. Drivers can proceed but must watch for pedestrians who may activate the
    light.
- id: 90
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in a school zone on school
    days between 8 a.m. and 5 p.m.?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: In BC, school zone speed limits are 30 km/h from 8 a.m. to 5 p.m. on
    school days, unless otherwise posted.
- id: 91
  category: safe_driving_rules
  question: In British Columbia, when are the 30 km/h speed limits in playground zones
    in effect?
  choices:
    A: 8 a.m. to 5 p.m. on weekdays
    B: 8 a.m. to 8 p.m. daily
    C: Dawn to dusk daily
    D: 24 hours a day
  answer: C
  explanation: Playground zone speed limits of 30 km/h are in effect from dawn to
    dusk every day of the year.
- id: 92
  category: safe_driving_rules
  question: When is a driver permitted to make a left turn on a red light in British
    Columbia?
  choices:
    A: Never
    B: Only from a one-way street onto another one-way street after a full stop
    C: Only if there is no 'No Turn on Red' sign
    D: From a two-way street onto a one-way street after a full stop
  answer: B
  explanation: In BC, you may turn left on a red light only when turning from a one-way
    street onto another one-way street, provided you come to a complete stop and yield
    to all traffic and pedestrians.
- id: 93
  category: safe_driving_rules
  question: Which of the following vehicles is NOT permitted to use High Occupancy
    Vehicle (HOV) lanes in BC, regardless of the number of occupants?
  choices:
    A: Emergency vehicles
    B: Motorcycles
    C: Buses
    D: Heavy trucks with a GVW over 5,500 kg
  answer: D
  explanation: HOV lanes are for buses, motorcycles, and vehicles meeting the occupancy
    requirement. Heavy trucks (over 5,500 kg) are generally excluded unless otherwise
    signed.
- id: 94
  category: safe_driving_rules
  question: Under what condition is it legal to pass another vehicle on the right
    in British Columbia?
  choices:
    A: When the vehicle ahead is turning left and there is an available lane or paved
      shoulder
    B: When you are in a hurry and the vehicle in the left lane is slow
    C: When driving on a two-lane road with a gravel shoulder
    D: It is never legal to pass on the right
  answer: A
  explanation: You may pass on the right if you are on a multi-lane road or if the
    vehicle ahead is turning left and there is a paved surface/lane to do so safely
    without leaving the roadway.
- id: 95
  category: safe_driving_rules
  question: In British Columbia, 'Excessive Speeding' is defined as driving how many
    km/h over the posted speed limit?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: C
  explanation: Excessive speeding in BC is defined as driving more than 40 km/h over
    the posted speed limit, which results in immediate vehicle impoundment.
- id: 96
  category: safe_driving_rules
  question: When a transit bus is signaling to move from the curb into traffic, what
    must other drivers do on a road where the speed limit is 60 km/h or less?
  choices:
    A: Maintain speed and position
    B: Honk to warn the bus driver
    C: Yield the right-of-way to the bus
    D: Speed up to pass the bus quickly
  answer: C
  explanation: In BC, drivers must yield to a transit bus that has signaled its intention
    to move into the flow of traffic from a bus stop or the curb, provided the speed
    limit is 60 km/h or less.
- id: 97
  category: safe_driving_rules
  question: Under ideal conditions, what is the recommended following distance behind
    the vehicle in front of you in BC?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 1 car length for every 10 km/h
  answer: B
  explanation: ICBC recommends a minimum following distance of at least 2 seconds
    behind the vehicle in front of you in ideal weather and road conditions.
- id: 98
  category: safe_driving_rules
  question: When parking a vehicle facing uphill on a street with a curb, how should
    the front wheels be turned?
  choices:
    A: Toward the curb
    B: Away from the curb (toward the center of the road)
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn the wheels toward the center
    of the road (away from the curb) so that if the vehicle rolls, the back of the
    front tire will hit the curb and stop.
- id: 99
  category: safe_driving_rules
  question: When driving at night, you must dim your high beam headlights when you
    are within how many meters of an oncoming vehicle?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: The BC Motor Vehicle Act requires drivers to switch to low beams when
    an oncoming vehicle is within 150 meters.
- id: 100
  category: defensive_driving
  question: When driving on high-speed highways in BC, or when following a motorcycle,
    what is the recommended following distance?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: ICBC recommends increasing your following distance to at least three
    seconds on highways or when following motorcycles, as they can stop very quickly.
- id: 101
  category: defensive_driving
  question: To maintain a good 'visual lead' while driving in a city environment,
    how far ahead should you be scanning?
  choices:
    A: 5 seconds
    B: 12 seconds
    C: 20 seconds
    D: 30 seconds
  answer: B
  explanation: In city driving, you should scan about 12 seconds ahead (about one
    to two blocks) to anticipate hazards before they become emergencies.
- id: 102
  category: defensive_driving
  question: According to the BC Motor Vehicle Act, you must dim your high beam headlights
    when you are within what distance of an oncoming vehicle?
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 250 metres
  answer: B
  explanation: Section 162 of the BC Motor Vehicle Act Regulations requires drivers
    to switch to low beams when an oncoming vehicle is within 150 metres.
- id: 103
  category: defensive_driving
  question: 'In BC, you must switch your high beam headlights to low beams when following
    another vehicle within a distance of:'
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: You must dim your high beams when following another vehicle within
    150 metres to avoid blinding the driver ahead through their mirrors.
- id: 104
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet BC highway, what is the
    correct defensive driving action?
  choices:
    A: Brake hard to regain traction
    B: Accelerate slightly to pull through the water
    C: Ease off the accelerator and steer in the direction you want to go
    D: Shift the vehicle into neutral and pump the brakes
  answer: C
  explanation: If hydroplaning, you should ease off the gas, keep the steering wheel
    straight, and avoid braking until your tires regain contact with the road.
- id: 105
  category: defensive_driving
  question: When scanning an intersection before entering, what is the correct sequence
    of observation recommended by ICBC?
  choices:
    A: Left, right, left
    B: Right, left, right
    C: Left, centre, right, and left again
    D: Centre, left, right
  answer: C
  explanation: ICBC recommends scanning left, centre, right, and then left again to
    ensure no hazards are approaching from the sides before proceeding.
- id: 106
  category: defensive_driving
  question: On many BC highways, winter tires or chains are legally required between
    which dates?
  choices:
    A: September 1 to March 31
    B: October 1 to April 30
    C: November 1 to March 1
    D: October 31 to March 31
  answer: B
  explanation: In BC, winter tires or chains are required on most designated highways
    from October 1 to March 31, though some mountain passes extend this to April 30.
- id: 107
  category: defensive_driving
  question: When driving in heavy fog in British Columbia, which light setting should
    you use for maximum safety?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: Low beams are best in fog because high beams reflect off the moisture
    droplets, causing glare and reducing visibility further.
- id: 108
  category: defensive_driving
  question: When following a large commercial truck, how can you ensure you are not
    in the driver's 'No-Zone' (blind spot)?
  choices:
    A: If you can see the truck's front bumper
    B: If you can see the truck's side mirrors
    C: If you are at least 10 metres behind the truck
    D: If you can see the driver's face in your rearview mirror
  answer: B
  explanation: 'A general rule for defensive driving is: if you cannot see the truck
    driver''s side mirrors, they cannot see you.'
- id: 109
  category: defensive_driving
  question: In BC, what is the recommended following distance when driving in poor
    weather conditions like rain, snow, or ice?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 10 seconds
  answer: C
  explanation: ICBC recommends doubling your following distance to at least four seconds
    in poor weather or on slippery roads to account for increased braking distance.
- id: 110
  category: defensive_driving
  question: What is 'Black Ice' and where is it most likely to form on BC roads?
  choices:
    A: Ice mixed with dirt found in gravel pits
    B: A thin, transparent layer of ice found on bridges and shaded areas
    C: Thick ice found only in the northern interior
    D: Ice that forms only during the night
  answer: B
  explanation: Black ice is a thin, nearly invisible layer of ice that forms on road
    surfaces, particularly on bridges, overpasses, and in shaded areas where the road
    freezes before other sections.
- id: 111
  category: defensive_driving
  question: When entering a curve, when should a defensive driver perform most of
    their braking?
  choices:
    A: While in the sharpest part of the curve
    B: Immediately after exiting the curve
    C: Before entering the curve
    D: Only if the vehicle begins to skid
  answer: C
  explanation: You should slow down to a safe speed before entering a curve to maintain
    better traction and stability throughout the turn.
- id: 112
  category: defensive_driving
  question: If you are being tailgated on a two-lane road in BC, what is the safest
    defensive driving response?
  choices:
    A: Brake suddenly to warn the driver
    B: Speed up to increase the gap
    C: Slow down slightly and increase your following distance from the car in front
    D: Turn on your hazard lights and stop in the lane
  answer: C
  explanation: If tailgated, you should slow down slightly and increase the space
    in front of you. This gives you more time to react slowly if needed, reducing
    the risk of the tailgater hitting you if you have to stop.
- id: 113
  category: defensive_driving
