- id: 229
  category: signs_and_signals
  question: What does a steady yellow light mean at a BC intersection?
  choices:
    A: Speed up to clear the intersection before it turns red
    B: Stop before entering the intersection unless it is unsafe to do so
    C: Continue through the intersection as you have the right of way
    D: The light is broken; treat it as a four-way stop
  answer: B
  explanation: A steady yellow light means the signal is about to turn red. You must
    stop before the intersection unless you are already in it or cannot stop safely.
- id: 230
