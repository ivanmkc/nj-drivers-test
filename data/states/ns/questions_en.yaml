metadata:
  source: Nova Scotia Driver Handbook
  total_questions: 234
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Nova Scotia, what is the minimum age to apply for a Class 7 Learner's
    License?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    '0': 17 years old
  answer: C
  explanation: In Nova Scotia, an individual must be at least 16 years of age to apply
    for a Class 7 Learner's License.
- id: 2
  category: license_system
  question: A person holding a Class 7 Learner's License must be accompanied by an
    experienced driver. What are the requirements for this supervisor?
  choices:
    A: Must have a Class 5 license and be at least 19 years old
    B: Must have a valid Class 5 license and not be in the GDL program
    C: Must have at least 1 year of driving experience
    D: Must be a family member with a valid license
  answer: B
  explanation: The supervising driver must hold a valid Class 5 license (or higher)
    and must have exited the Graduated Driver Licensing (GDL) program.
- id: 3
  category: license_system
  question: How long must a driver remain in the Learner's stage (Class 7) before
    they can take a road test, if they have NOT completed a recognized driver education
    program?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: D
  explanation: The standard waiting period for the Learner's stage is 12 months. This
    can be reduced to 6 months if the driver completes an approved driver education
    course.
- id: 4
  category: license_system
  question: What is the maximum blood alcohol concentration (BAC) allowed for a driver
    in the Nova Scotia Graduated Driver Licensing (GDL) program?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Nova Scotia has a zero-tolerance policy for alcohol for all drivers
    in the GDL program (Learner, Newly Licensed, and Restricted stages).
- id: 5
  category: license_system
  question: Under the Nova Scotia GDL program, what is the curfew for a 'Newly Licensed'
    (Class 5N) driver?
  choices:
    A: No driving between 10:00 PM and 6:00 AM
    B: No driving between 11:00 PM and 5:00 AM
    C: No driving between midnight and 5:00 AM
    D: There is no curfew for Class 5N drivers
  answer: C
  explanation: Newly Licensed drivers (Class 5N) are prohibited from driving between
    midnight and 5:00 AM unless they are accompanied by an experienced driver or have
    a written exemption for work purposes.
- id: 6
  category: license_system
  question: How many demerit points will result in a license suspension for a driver
    in the Graduated Driver Licensing (GDL) program?
  choices:
    A: 4 points
    B: 6 points
    C: 10 points
    D: 12 points
  answer: B
  explanation: In Nova Scotia, a GDL driver's license is suspended when they accumulate
    6 demerit points. For fully licensed drivers, the threshold is 10 points.
- id: 7
  category: license_system
  question: How long is the 'Newly Licensed' (Class 5N) stage in Nova Scotia?
  choices:
    A: 12 months
    B: 18 months
    C: 24 months
    D: 36 months
  answer: C
  explanation: The Newly Licensed stage (Class 5N) lasts for a minimum of 24 months
    of safe driving.
- id: 8
  category: license_system
  question: In the 'Newly Licensed' (Class 5N) stage, how many passengers are allowed
    in the front seat of the vehicle?
  choices:
    A: Zero
    B: One
    C: Two
    D: As many as there are seatbelts
  answer: B
  explanation: A Newly Licensed driver is limited to only one passenger in the front
    seat, and the total number of passengers in the back is limited by the number
    of functioning seatbelts.
- id: 9
  category: license_system
  question: What happens to the time spent in a GDL stage if a driver's license is
    suspended?
  choices:
    A: The time is paused and resumes after the suspension
    B: The driver must wait an extra 6 months
    C: The time spent in that stage is lost and the driver must start the stage over
    D: The driver is permanently banned from the GDL program
  answer: C
  explanation: If a driver is suspended while in the GDL program, they lose all credit
    for the time they have already served in that stage and must start the duration
    of that stage over again once the suspension is lifted.
- id: 10
  category: license_system
  question: To exit the Graduated Driver Licensing program and move from 'Restricted
    Individual' (Class 5R) to a full license, what must a driver do?
  choices:
    A: Pass another road test
    B: Complete a 6-hour defensive driving course or a full driver education course
    C: Wait an additional 5 years
    D: Pay a $200 exit fee
  answer: B
  explanation: To remove the 'Restricted Individual' status, the driver must complete
    a recognized driver improvement program (like a 6-hour defensive driving course)
    and provide proof to Access Nova Scotia.
- id: 11
  category: license_system
  question: What is the BAC limit for the experienced driver who is supervising a
    Class 7 Learner?
  choices:
    A: 0.00%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: In Nova Scotia, the supervising driver for a person with a Learner's
    License must also maintain a blood alcohol level of 0.00%.
- id: 12
  category: license_system
  question: 'When you change your name or address, you must notify the Registry of
    Motor Vehicles within:'
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Nova Scotia law requires drivers to notify the Registry of Motor Vehicles
    within 30 days of a change in name or address.
- id: 13
  category: license_system
  question: What is the penalty for a first-offense conviction of using a hand-held
    cellular phone while driving in Nova Scotia?
  choices:
    A: A fine and 2 demerit points
    B: A fine and 4 demerit points
    C: A fine and 6 demerit points
    D: A fine only, no points
  answer: B
  explanation: Using a hand-held electronic device while driving in Nova Scotia carries
    a significant fine and results in 4 demerit points being added to your record.
- id: 14
  category: license_system
  question: A Class 7 Learner's license is valid for how long before it must be renewed?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: D
  explanation: In Nova Scotia, a Class 7 Learner's License is valid for 5 years.
- id: 15
  category: license_system
  question: Which of the following is NOT a requirement to obtain a Class 7 Learner's
    License?
  choices:
    A: Pass a vision screening
    B: Pass a written knowledge test
    C: Have parental consent if under 18
    D: Provide proof of vehicle insurance in your own name
  answer: D
  explanation: While you need insurance to drive a vehicle, you do not need to provide
    proof of personal vehicle insurance to obtain a Learner's License. You must pass
    vision and knowledge tests and have parental consent if under 18.
- id: 16
  category: license_system
  question: If you are a visitor to Nova Scotia, how long are you permitted to drive
    with a valid out-of-province driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: According to the Nova Scotia Driver's Handbook, visitors may drive
    in the province for up to 90 days with a valid license from another province or
    country.
- id: 17
  category: license_system
  question: A driver with a Class 5R (Restricted Individual) license must maintain
    a blood alcohol level of zero for how long?
  choices:
    A: 1 year
    B: 2 years
    C: The entire duration they hold the 5R status
    D: Only during the first 6 months
  answer: C
  explanation: A 'Restricted Individual' (Class 5R) is the final stage of the GDL
    program. They must maintain a zero blood alcohol level at all times while holding
    this classification, which lasts for 2 years unless a driver education course
    reduces the previous stage.
- id: 18
  category: license_system
  question: In Nova Scotia, how many demerit points are assigned to your record for
    speeding 16 to 30 km/h over the posted limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Nova Scotia's point system assigns 2 points for 1-15 km/h over, 3 points
    for 16-30 km/h over, and 4 points for more than 30 km/h over the limit.
- id: 19
  category: license_system
  question: If a driver in the Graduated Driver Licensing (GDL) program is suspended
    for accumulating 6 demerit points, how long is the suspension period?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: In Nova Scotia, a GDL driver who accumulates 6 demerit points will
    have their driving privilege suspended for a period of 6 months.
- id: 20
  category: license_system
  question: What is the minimum age requirement to apply for a Class 4 driver's license
    (Taxi, Ambulance, or Small Bus) in Nova Scotia?
  choices:
    A: 18 years
    B: 19 years
    C: 21 years
    D: 25 years
  answer: B
  explanation: To apply for a Class 4 license in Nova Scotia, the applicant must be
    at least 19 years of age.
- id: 21
  category: license_system
  question: The 'Master Number' found on a Nova Scotia driver's license is primarily
    based on what information?
  choices:
    A: The driver's social insurance number
    B: The driver's date of birth and name
    C: A random sequence generated by the Registry
    D: The driver's home postal code
  answer: B
  explanation: The Master Number is a unique identifier created using the first five
    letters of the surname and the date of birth of the driver.
- id: 22
  category: license_system
  question: How many demerit points are recorded against a driver's license for failing
    to stop for a school bus when its red lights are flashing?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to stop for a school bus is considered a major offense in Nova
    Scotia and results in 6 demerit points.
- id: 23
  category: license_system
  question: How many demerit points are assigned for 'Following too closely' (tailgating)
    in Nova Scotia?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Following another vehicle too closely results in 2 demerit points being
    added to a driver's record in Nova Scotia.
- id: 24
  category: license_system
  question: A standard Nova Scotia Class 5 driver's license (non-GDL) is typically
    valid for how many years before it expires?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: A regular Nova Scotia driver's license is valid for a 5-year period,
    expiring on the driver's birthday.
- id: 25
  category: license_system
  question: If you become a resident of Nova Scotia, within how many days must you
    register any vehicle you have brought into the province?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must register their vehicles with the Registry of Motor
    Vehicles within 30 days of taking up residence in Nova Scotia.
- id: 26
  category: license_system
  question: A person holding a Class 6L (Motorcycle Learner) license is subject to
    which of the following restrictions?
  choices:
    A: They may only drive during daylight hours
    B: They cannot carry any passengers
    C: They must be accompanied by another motorcyclist with 5 years experience
    D: Both A and B
  answer: D
  explanation: Class 6L learners in Nova Scotia are restricted to daylight driving
    only (one-half hour before sunrise to one-half hour after sunset) and are strictly
    prohibited from carrying passengers.
- id: 27
  category: license_system
  question: At what point level will a fully licensed (non-GDL) driver receive a warning
    letter from the Registry of Motor Vehicles?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: For regular (non-GDL) drivers, the Registry sends a warning letter
    once the driver has accumulated 4 demerit points.
- id: 28
  category: license_system
  question: A fully licensed (non-GDL) driver in Nova Scotia will have their license
    suspended if they accumulate how many demerit points?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: A non-GDL driver's license is suspended when they accumulate 10 or
    more demerit points.
- id: 29
  category: license_system
  question: What is the standard fee for the reinstatement of a driver's license that
    was suspended for a non-medical reason in Nova Scotia?
  choices:
    A: $50.00
    B: $95.40
    C: $124.60
    D: $250.00
  answer: C
  explanation: As per the current Nova Scotia Schedule of Fees, the reinstatement
    fee for a suspended driver's license is $124.60.
- id: 30
  category: license_system
  question: Which class of license is required to operate a bus with a seating capacity
    of 24 passengers or less?
  choices:
    A: Class 3
    B: Class 4
    C: Class 5
    D: Class 2
  answer: B
  explanation: A Class 4 license is required in Nova Scotia to operate buses with
    a seating capacity of up to 24 passengers, as well as taxis and ambulances.
- id: 31
  category: driver_testing
  question: To pass the vision screening for a Nova Scotia driver's license, what
    is the minimum visual acuity required in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the Nova Scotia Driver's Handbook, an applicant must have
    a visual acuity of at least 20/40 in at least one eye, with or without corrective
    lenses.
- id: 32
  category: driver_testing
  question: When taking a road test in Nova Scotia, which of the following must you
    provide for the vehicle you are using?
  choices:
    A: A valid motor vehicle inspection (MVI) sticker
    B: A valid insurance card (pink card)
    C: A valid vehicle registration permit
    D: All of the above
  answer: D
  explanation: The examiner will check for a valid registration, valid insurance,
    and a valid safety inspection sticker before the road test begins. If any are
    missing, the test will be canceled.
- id: 33
  category: driver_testing
  question: 'The Nova Scotia written knowledge test consists of two parts: Traffic
    Signs and Rules of the Road. How many questions must you answer correctly in each
    section to pass?'
  choices:
    A: 14 out of 20
    B: 16 out of 20
    C: 18 out of 20
    D: 20 out of 20
  answer: B
  explanation: To pass the Nova Scotia knowledge test, you must correctly identify
    16 out of 20 signs and correctly answer 16 out of 20 questions on the rules of
    the road.
- id: 34
  category: driver_testing
  question: In Nova Scotia, 'stunting' is defined as driving how many km/h over the
    posted speed limit?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: Under the Nova Scotia Motor Vehicle Act, stunting is defined as traveling
    50 km/h or more over the posted speed limit, carrying an immediate 7-day license
    suspension and vehicle impoundment.
- id: 35
  category: driver_testing
  question: According to Nova Scotia's 'Move Over' law, when passing a stopped emergency
    vehicle with its lights flashing, you must slow down to what speed (unless the
    posted limit is lower)?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: Drivers must slow down to 60 km/h, or obey the posted speed limit if
    it is lower than 60 km/h, when passing emergency vehicles or tow trucks stopped
    on the side of the road with lights flashing.
- id: 36
  category: driver_testing
  question: In Nova Scotia, what is the speed limit in a school zone when children
    are present, if the normal posted speed limit is 50 km/h?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 45 km/h
  answer: B
  explanation: In Nova Scotia, the speed limit in school zones is 30 km/h when children
    are present if the normal speed limit is 50 km/h. If the normal limit is higher
    than 50 km/h, the school zone limit is 50 km/h.
- id: 37
  category: driver_testing
  question: If a fully licensed driver in Nova Scotia is caught with a BAC between
    0.05 and 0.08 for the first time, how long is the immediate administrative license
    suspension?
  choices:
    A: 24 hours
    B: 7 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: Nova Scotia has an Administrative License Suspension (ALS) program
    where a first-time BAC between 0.05 and 0.08 results in an immediate 7-day license
    suspension.
- id: 38
  category: driver_testing
  question: If you fail your road test in Nova Scotia, how long must you wait before
    you are eligible to take the test again?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 14 days
  answer: C
  explanation: If you fail the road test, you must wait at least 7 days before you
    can attempt the test again, and you must pay for a new road test receipt.
- id: 39
  category: driver_testing
  question: When you purchase a vehicle privately in Nova Scotia, you must transfer
    the ownership and register the vehicle within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The Nova Scotia Motor Vehicle Act requires that the transfer of ownership
    be completed at the Registry of Motor Vehicles within 30 days of the sale.
- id: 40
  category: driver_testing
  question: How many demerit points are assigned to a driver for failing to wear a
    seatbelt in Nova Scotia?
  choices:
    A: 0 points
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: In Nova Scotia, a conviction for failing to wear a seatbelt results
    in 2 demerit points on your driving record.
- id: 41
  category: driver_testing
  question: In Nova Scotia, between which dates are studded tires permitted for use
    on vehicles?
  choices:
    A: November 1 to April 1
    B: October 15 to May 31
    C: December 1 to March 31
    D: October 1 to April 30
  answer: B
  explanation: Studded tires are permitted on Nova Scotia roads from October 15th
    to May 31st each year.
- id: 42
  category: driver_testing
  question: In Nova Scotia, it is illegal to park your vehicle within how many meters
    of a crosswalk?
  choices:
    A: 2 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: According to the Nova Scotia Motor Vehicle Act, you are not permitted
    to park within 5 meters of a crosswalk.
- id: 43
  category: driver_testing
  question: When driving at night, you must dim your high beam headlights when you
    are within how many meters of an oncoming vehicle?
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: The Nova Scotia Driver's Handbook states that you must switch to low
    beams when an oncoming vehicle is within 150 meters.
- id: 44
  category: driver_testing
  question: 'To meet the vision standards for a driver''s license in Nova Scotia,
    an applicant''s visual acuity must be at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/50 in both eyes
    D: 20/30 in the dominant eye
  answer: B
  explanation: According to the Nova Scotia Driver's Handbook, an applicant must have
    a visual acuity of at least 20/40 in at least one eye, with or without corrective
    lenses.
- id: 45
  category: driver_testing
  question: When appearing for a road test in Nova Scotia, which of the following
    is NOT a requirement for the vehicle provided by the applicant?
  choices:
    A: A valid motor vehicle inspection (MVI) sticker
    B: Proof of valid insurance and registration
    C: Dual-brake controls for the examiner
    D: Functioning signal lights and brake lights
  answer: C
  explanation: While the vehicle must be in good mechanical condition, have a valid
    MVI, and be properly insured and registered, dual-brake controls are not required
    for a standard Class 5 road test.
- id: 46
  category: driver_testing
  question: If you fail your first road test in Nova Scotia, what is the minimum waiting
    period before you can take the test again?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 14 days
  answer: C
  explanation: In Nova Scotia, if you fail your first road test, you must wait at
    least 7 days before you are eligible to attempt the test again.
- id: 47
  category: driver_testing
  question: 'The Nova Scotia written knowledge test consists of two parts: Traffic
    Signs and Rules of the Road. What is the minimum passing score for each section?'
  choices:
    A: 15 out of 20
    B: 16 out of 20
    C: 18 out of 20
    D: 20 out of 20
  answer: B
  explanation: To pass the knowledge test in Nova Scotia, you must correctly answer
    at least 16 out of 20 questions (80%) in each of the two sections.
- id: 48
  category: driver_testing
  question: In Nova Scotia, a Class 8 driver's license is specifically for operating
    which type of vehicle?
  choices:
    A: Motorcycles
    B: Mopeds
    C: Farm Tractors
    D: Snowmobiles
  answer: C
  explanation: A Class 8 license in Nova Scotia is a specialty license that permits
    the operation of farm tractors only.
- id: 49
  category: driver_testing
  question: How many demerit points can be removed from a Nova Scotia driving record
    if a driver successfully completes an approved Defensive Driving Course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: Nova Scotia allows drivers to have up to 2 demerit points removed from
    their record once every five years upon successful completion of a recognized
    defensive driving course.
- id: 50
  category: driver_testing
  question: Under the Nova Scotia Motor Vehicle Act, who is legally required to report
    a patient to the Registrar of Motor Vehicles if they have a medical condition
    that makes it unsafe for them to drive?
  choices:
    A: The patient's employer
    B: The patient's next of kin
    C: Any qualified medical practitioner (physician or optometrist)
    D: The local police department
  answer: C
  explanation: In Nova Scotia, medical practitioners and optometrists are legally
    mandated to report any person who has a condition that may make it dangerous for
    them to operate a motor vehicle.
- id: 51
  category: driver_testing
  question: For most private passenger vehicles in Nova Scotia, how often must a formal
    Motor Vehicle Inspection (MVI) be conducted?
  choices:
    A: Every year
    B: Every 2 years
    C: Only when the vehicle is sold
  answer: B
  explanation: In Nova Scotia, most passenger vehicles require a safety inspection
    (MVI) every two years.
- id: 52
  category: driver_testing
  question: What is the minimum amount of Third-Party Liability insurance coverage
    required by law for a motor vehicle in Nova Scotia?
  choices:
    A: $200,000
    B: $500,000
    C: $1,000,000
    D: $50,000
  answer: B
  explanation: Nova Scotia law requires all motor vehicles to be covered by a minimum
    of $500,000 in Third-Party Liability insurance.
- id: 53
  category: driver_testing
  question: When approaching a stopped emergency vehicle with its lights flashing
    on a Nova Scotia highway, drivers must slow down to what speed if the posted limit
    is 100 km/h?
  choices:
    A: 80 km/h
    B: 70 km/h
    C: 60 km/h
    D: 50 km/h
  answer: C
  explanation: Nova Scotia's 'Move Over' law requires drivers to slow to 60 km/h (or
    the posted limit if it is lower than 60 km/h) when passing emergency vehicles
    with flashing lights.
- id: 54
  category: driver_testing
  question: In Nova Scotia, when a transit bus has signaled its intention to pull
    out from a bus bay or the side of the road, what is the driver's obligation?
  choices:
    A: Maintain speed; the bus must wait for a gap
    B: Yield the right of way to the bus
    C: Honk to warn the bus driver of your presence
    D: Only yield if there are more than two lanes of traffic
  answer: B
  explanation: Nova Scotia law requires drivers to yield the right of way to a transit
    bus that is signaling its intention to re-enter the flow of traffic from a bus
    stop or bay.
- id: 55
  category: driver_responsibility
  question: 'In Nova Scotia, you must report a collision to the police or the Registry
    of Motor Vehicles if the total property damage is estimated to be at least:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: According to the Nova Scotia Motor Vehicle Act, any collision involving
    death, injury, or property damage of $2,000 or more must be reported to the nearest
    police station immediately.
- id: 56
  category: driver_responsibility
  question: When you sell a vehicle in Nova Scotia, what must you do with the license
    plates?
  choices:
    A: Leave them on the vehicle for the new owner.
    B: Return them to the Registry of Motor Vehicles or keep them for your next vehicle.
    C: Destroy them immediately.
    D: Give them to the police.
  answer: B
  explanation: In Nova Scotia, license plates belong to the owner, not the vehicle.
    When a vehicle is sold, the plates should be removed by the seller.
- id: 57
  category: driver_responsibility
  question: After purchasing a vehicle from a private seller, how many days do you
    have to transfer the registration into your name?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The Nova Scotia Motor Vehicle Act requires the buyer of a used vehicle
    to transfer the registration within 30 days of the date of sale.
- id: 58
  category: driver_responsibility
  question: If you are involved in a collision with an unattended vehicle and cannot
    find the owner, what is your legal responsibility?
  choices:
    A: Wait for 30 minutes, then leave if no one shows up.
    B: Drive to the nearest police station within 48 hours.
    C: Leave a written notice with your name, address, and plate number in a conspicuous
      place on the vehicle.
    D: No action is required if the damage is less than $500.
  answer: C
  explanation: If you hit an unattended vehicle, you must locate the owner or leave
    a note with your contact and vehicle information in a visible spot on the struck
    vehicle.
- id: 59
  category: driver_responsibility
  question: In Nova Scotia, how often must a passenger vehicle undergo a safety inspection
    (MVI) after its initial new-car inspection period?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Only when the vehicle is sold
  answer: B
  explanation: For most private passenger vehicles in Nova Scotia, a Motor Vehicle
    Inspection (MVI) is required every two years.
- id: 60
  category: driver_responsibility
  question: Who is legally responsible for ensuring a passenger under the age of 16
    is wearing a seat belt or is in a proper child restraint system?
  choices:
    A: The passenger
    B: The passenger's parents (even if not in the car)
    C: The driver of the vehicle
    D: The owner of the vehicle
  answer: C
  explanation: The driver is responsible for ensuring all passengers under the age
    of 16 are properly secured. If they are not, the driver can be fined and receive
    demerit points.
- id: 61
  category: driver_responsibility
  question: What is the penalty for a first-time conviction of driving without valid
    motor vehicle insurance in Nova Scotia?
  choices:
    A: A $100 fine and 1 demerit point.
    B: A fine of approximately $1,200 to $2,000 and a license suspension.
    C: A verbal warning and a 7-day grace period to get insurance.
    D: The vehicle is permanently seized by the Crown.
  answer: B
  explanation: Driving without insurance is a serious offense in Nova Scotia, carrying
    heavy fines (often exceeding $1,200 for a first offense) and an automatic license
    suspension.
- id: 62
  category: driver_responsibility
  question: How many demerit points are recorded on your driving record for 'Failing
    to remain at the scene of an accident'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a major offense and
    results in 6 demerit points being added to the driver's record in Nova Scotia.
- id: 63
  category: driver_responsibility
  question: 'When an emergency vehicle (police, fire, or ambulance) is stopped on
    the highway with its lights flashing, Nova Scotia''s ''Move Over'' law requires
    you to:'
  choices:
    A: Maintain your speed but honk to alert the emergency workers.
    B: Stop immediately in your lane.
    C: Slow down to a safe speed and move into the left lane if it is safe to do so.
    D: Speed up to pass the area as quickly as possible.
  answer: C
  explanation: Nova Scotia's 'Move Over' law requires drivers to slow down to a safe
    speed and, if there are two or more lanes going in the same direction, move into
    another lane away from the stopped emergency vehicle if safe.
- id: 64
  category: driver_responsibility
  question: In Nova Scotia, where must the vehicle's permit (registration) be kept?
  choices:
    A: At the owner's residence in a safe place.
    B: In the vehicle at all times while it is being operated.
    C: At the Registry of Motor Vehicles.
    D: In the driver's wallet at all times, even when not driving.
  answer: B
  explanation: The vehicle permit or a true copy of it must be carried in the vehicle
    at all times while it is being operated on a highway.
- id: 65
  category: driver_responsibility
  question: 'If you are convicted of littering from a motor vehicle on a Nova Scotia
    highway, the fine can be up to:'
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: C
  explanation: Under the Motor Vehicle Act, littering from a vehicle is an offense
    that can carry a fine of up to $500.
- id: 66
  category: driver_responsibility
  question: What document must you produce when a peace officer demands proof of financial
    responsibility?
  choices:
    A: Your birth certificate.
    B: A valid motor vehicle liability insurance card (Pink Card).
    C: Your vehicle's bill of sale.
    D: A bank statement showing at least $5,000.
  answer: B
  explanation: The 'Pink Card' is the standard proof of insurance in Nova Scotia and
    must be produced upon the request of a peace officer.
- id: 67
  category: driver_responsibility
  question: If you move to Nova Scotia from another province, how long do you have
    to register your vehicle in Nova Scotia?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: A
  explanation: New residents of Nova Scotia must register their vehicles with the
    Registry of Motor Vehicles within 30 days of taking up residency.
- id: 68
  category: driver_responsibility
  question: When a vehicle is sold privately in Nova Scotia, who is responsible for
    removing the license plates from the vehicle?
  choices:
    A: The buyer
    B: The seller
    C: The Registry of Motor Vehicles
    D: The plates stay with the vehicle
  answer: B
  explanation: In Nova Scotia, license plates belong to the owner, not the vehicle.
    The seller must remove their plates before the buyer takes possession of the vehicle.
- id: 69
  category: driver_responsibility
  question: How long does a new resident of Nova Scotia have to register their out-of-province
    vehicle after moving to the province?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must register their vehicles with the Nova Scotia Registry
    of Motor Vehicles within 30 days of taking up residence.
- id: 70
  category: driver_responsibility
  question: If you are involved in a collision where someone is injured, what is your
    first legal responsibility?
  choices:
    A: Call your insurance agent
    B: Take photos of the scene
    C: Stop and render all possible assistance
    D: Drive to the nearest police station
  answer: C
  explanation: Under the Motor Vehicle Act, you must stop at the scene of a collision
    and provide reasonable assistance to any person injured.
- id: 71
  category: driver_responsibility
  question: 'When you buy a vehicle privately, you must transfer the ownership at
    the Registry of Motor Vehicles within:'
  choices:
    A: 24 hours
    B: 10 days
    C: 30 days
    D: 6 months
  answer: C
  explanation: The buyer of a used vehicle must apply for a transfer of ownership
    and a new certificate of registration within 30 days of the purchase date.
- id: 72
  category: driver_responsibility
  question: If a police officer requests it, which of the following documents must
    a driver produce?
  choices:
    A: Driver's license only
    B: Driver's license and vehicle registration only
    C: Driver's license, vehicle registration, and valid motor vehicle liability insurance
      card
    D: Driver's license and birth certificate
  answer: C
  explanation: Drivers must be able to produce their license, the vehicle's registration
    permit, and proof of valid insurance (the 'pink card') whenever requested by a
    peace officer.
- id: 73
  category: driver_responsibility
  question: In Nova Scotia, if your Blood Alcohol Concentration (BAC) is found to
    be in the 'Warning Range' (0.05 to 0.08), what is the immediate administrative
    license suspension for a first offense?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: A driver caught with a BAC in the 0.05 to 0.08 range faces an immediate
    7-day administrative license suspension for a first offense.
- id: 74
  category: driver_responsibility
  question: If you fail a breathalyzer test (BAC over 0.08) or refuse to provide a
    sample, your license will be suspended administratively for how long before your
    court date?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: D
  explanation: In Nova Scotia, failing a breathalyzer or refusing to provide a sample
    results in an automatic, immediate 90-day administrative license suspension.
- id: 75
  category: driver_responsibility
  question: What must the seller of a vehicle provide to the Registry of Motor Vehicles
    immediately after a sale?
  choices:
    A: The vehicle's engine
    )B: The license plates
    C: A completed Notice of Sale (found on the back of the Certificate of Registration)
    D: A copy of the buyer's insurance
  answer: C
  explanation: To protect themselves from liability, the seller should complete the
    Notice of Sale portion of the Certificate of Registration and return it to the
    Registry immediately.
- id: 76
  category: driver_responsibility
  question: If you are involved in a minor collision with no injuries and the vehicles
    are blocking traffic, what should you do?
  choices:
    A: Leave the vehicles exactly where they are until police arrive
    B: Move the vehicles off the roadway to a safe location if it is safe to do so
    C: Abandon the vehicles and walk to a phone
    D: Wait for a tow truck before moving anything
  answer: B
  explanation: If there are no injuries and the vehicles are functional, you should
    move them off the traveled portion of the highway to prevent further collisions
    and traffic congestion.
- id: 77
  category: driver_responsibility
  question: What happens to your driver's license if you fail to pay a court-ordered
    judgment for damages resulting from a motor vehicle collision?
  choices:
    A: Nothing, it is a civil matter
    B: You are assigned 6 demerit points
    C: Your license is suspended until the judgment is paid or satisfied
    D: You must retake your road test
  answer: C
  explanation: Under Nova Scotia's financial responsibility laws, the Registry of
    Motor Vehicles will suspend the license of any driver who fails to satisfy a judgment
    for property damage or personal injury.
- id: 78
  category: driver_responsibility
  question: 'If you hit an unattended vehicle and cannot find the owner, you must:'
  choices:
    A: Drive away if there is no damage
    B: Leave a written notice with your name, address, and plate number in a conspicuous
      place on the vehicle
    C: Wait for 24 hours at the scene
    D: Only report it if the damage is over $5,000
  answer: B
  explanation: The law requires you to notify the owner of the property you damaged.
    If they cannot be found, you must leave a note with your contact and vehicle information.
- id: 79
  category: safe_driving_rules
  question: According to the Nova Scotia Motor Vehicle Act, what is the minimum distance
    you must park away from a fire hydrant?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: C
  explanation: You are prohibited from parking a vehicle within 5 meters of a fire
    hydrant in Nova Scotia.
- id: 80
  category: safe_driving_rules
  question: 'In Nova Scotia, you must stop for a school bus with red lights flashing
    and the stop arm extended EXCEPT when:'
  choices:
    A: You are traveling in the opposite direction on a divided highway
    B: You are traveling in the same direction on a multi-lane highway
    C: The bus is stopped in a designated 'no-stop' zone
    D: You are more than 10 meters away from the bus
  answer: A
  explanation: On a divided highway (where there is a median or barrier), drivers
    traveling in the opposite direction of a school bus do not have to stop. Drivers
    traveling in the same direction must always stop.
- id: 81
  category: safe_driving_rules
  question: What is the minimum distance you must maintain when parking near a crosswalk
    or a stop sign in Nova Scotia?
  choices:
    A: 5 meters from a crosswalk and 10 meters from a stop sign
    B: 2 meters from a crosswalk and 5 meters from a stop sign
    C: 10 meters from a crosswalk and 15 meters from a stop sign
    D: 3 meters from both
  answer: A
  explanation: In Nova Scotia, you must not park within 5 meters of a crosswalk or
    within 10 meters of a stop sign or traffic control signal.
- id: 82
  category: safe_driving_rules
  question: Under Nova Scotia law, 'stunting' is defined as traveling at what speed
    over the posted limit?
  choices:
    A: 30 km/h or more
    B: 40 km/h or more
    C: 50 km/h or more
    D: 60 km/h or more
  answer: C
  explanation: Stunting is defined as traveling 50 km/h or more over the posted speed
    limit. It carries a heavy fine, 6 demerit points, and an immediate 7-day license
    suspension.
- id: 83
  category: safe_driving_rules
  question: 'When driving at night, you must switch your high beams to low beams when
    an oncoming vehicle is within:'
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: Nova Scotia law requires drivers to dim their high beams to low beams
    when an oncoming vehicle is within 150 meters.
- id: 84
  category: safe_driving_rules
  question: In a Nova Scotia roundabout, which vehicle has the right of way?
  choices:
    A: The vehicle entering the roundabout
    B: The vehicle already in the roundabout
    C: The vehicle traveling at the highest speed
    D: The vehicle entering from the right
  answer: B
  explanation: Traffic entering a roundabout must yield the right of way to traffic
    already circulating within the roundabout.
- id: 85
  category: safe_driving_rules
  question: When two vehicles reach an uncontrolled intersection (no signs or signals)
    at approximately the same time, who must yield?
  choices:
    A: The driver on the left must yield to the driver on the right
    B: The driver on the right must yield to the driver on the left
    C: The driver on the smaller road must yield
    D: The driver turning left must yield to all other traffic
  answer: A
  explanation: At an uncontrolled intersection, the driver of the vehicle on the left
    must yield the right of way to the vehicle on the right.
- id: 86
  category: safe_driving_rules
  question: What is the recommended following distance behind another vehicle under
    normal driving conditions in Nova Scotia?
  choices:
    A: One car length
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: B
  explanation: The Nova Scotia Driver's Handbook recommends a minimum following distance
    of at least two seconds behind the vehicle in front of you.
- id: 87
  category: safe_driving_rules
  question: 'In Nova Scotia, you are permitted to pass a vehicle on the right only
    if:'
  choices:
    A: The vehicle ahead is making a left turn and there is a paved shoulder or lane
      available
    B: You are in a hurry and the vehicle ahead is slow
    C: The road is a gravel road with enough width
    D: Passing on the right is never permitted
  answer: A
  explanation: You may pass on the right only when the vehicle being overtaken is
    making or about to make a left turn and the movement can be made safely on the
    pavement.
- id: 88
  category: safe_driving_rules
  question: When parking a vehicle uphill on a two-way street with a curb, how should
    the front wheels be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    (to the left) so that if the vehicle rolls, the back of the tire will hit the
    curb and stop the car.
- id: 89
  category: safe_driving_rules
  question: 'A U-turn is prohibited in Nova Scotia when you cannot see clearly in
    both directions for at least:'
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: You must not make a U-turn on a curve or near the crest of a hill where
    you cannot be seen by other drivers approaching from either direction within 150
    meters.
- id: 90
  category: safe_driving_rules
  question: When approaching a railway crossing and the signals are flashing, you
    must stop your vehicle no closer than how many meters from the nearest rail?
  choices:
    A: 2 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: When a train is approaching, you must stop at least 5 meters from the
    nearest rail of the railway crossing.
- id: 91
  category: safe_driving_rules
  question: According to the Nova Scotia Driver's Handbook, how far must you park
    from a fire hydrant?
  choices:
    A: 2 meters
    B: 3 meters
    C: 5 meters
    D: 10 meters
  answer: C
  explanation: In Nova Scotia, it is illegal to park a vehicle within 5 meters of
    a fire hydrant.
- id: 92
  category: safe_driving_rules
  question: When entering a roundabout in Nova Scotia, who has the right-of-way?
  choices:
    A: Traffic entering the roundabout
    B: Traffic already in the roundabout
    C: The vehicle traveling at the highest speed
    D: The vehicle entering from the right
  answer: B
  explanation: In Nova Scotia, drivers entering a roundabout must yield the right-of-way
    to traffic already circulating in the roundabout.
- id: 93
  category: safe_driving_rules
  question: In Nova Scotia, you are prohibited from parking within how many meters
    of a stop sign?
  choices:
    A: 5 meters
    B: 10 meters
    C: 15 meters
    D: 20 meters
  answer: B
  explanation: Under Nova Scotia law, you must not park your vehicle within 10 meters
    of a stop sign or a traffic control signal.
- id: 94
  category: safe_driving_rules
  question: Unless a sign prohibits it, when are you allowed to turn left on a red
    light in Nova Scotia?
  choices:
    A: Never
    B: From a one-way street onto another one-way street after a complete stop
    C: From a two-way street onto a one-way street
    D: Anytime there is no oncoming traffic
  answer: B
  explanation: In Nova Scotia, you may turn left on a red light only if you are turning
    from a one-way street into another one-way street, provided you have come to a
    full stop and yielded to pedestrians and other traffic.
- id: 95
  category: safe_driving_rules
  question: What is the default speed limit in a business or residential district
    in Nova Scotia if no speed limit is posted?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: B
  explanation: The Nova Scotia Motor Vehicle Act sets the default speed limit at 50
    km/h in any business or residential district unless otherwise posted.
- id: 96
  category: safe_driving_rules
  question: What does a double solid yellow line in the center of the highway indicate
    in Nova Scotia?
  choices:
    A: Passing is permitted if safe
    B: Passing is permitted only during daylight hours
    C: Passing is prohibited for traffic in both directions
    D: One-way traffic only
  answer: C
  explanation: A double solid yellow line means that passing is prohibited for traffic
    traveling in either direction.
- id: 97
  category: safe_driving_rules
  question: In Nova Scotia, what happens to the fines for speeding in a designated
    work zone when workers are present?
  choices:
    A: The fines are tripled
    B: The fines are doubled
    C: The fines are reduced if you apologize
    D: The fines remain the same but points are doubled
  answer: B
  explanation: In Nova Scotia, speeding fines are doubled for offenses committed in
    work zones when workers are present.
- id: 98
  category: safe_driving_rules
  question: 'To maintain a safe following distance behind the vehicle in front of
    you under normal conditions, the Nova Scotia Driver''s Handbook recommends:'
  choices:
    A: A one-second following distance
    B: A two-second following distance
    C: A five-second following distance
    D: One car length for every 10 km/h of speed
  answer: B
  explanation: The Nova Scotia Driver's Handbook recommends using the 'two-second
    rule' to maintain a safe following distance under normal driving conditions.
- id: 99
  category: safe_driving_rules
  question: In Nova Scotia, when are you required to use your vehicle's headlights?
  choices:
    A: Only between midnight and sunrise
    B: From sunset to sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise, and whenever visibility
      is less than 300 meters
    D: Only when it is raining or snowing
  answer: C
  explanation: Nova Scotia law requires headlights to be on from a half-hour after
    sunset to a half-hour before sunrise, and at any other time when visibility is
    not clear for a distance of 300 meters.
- id: 100
  category: safe_driving_rules
  question: 'When a pedestrian is using a crosswalk in Nova Scotia, a driver must:'
  choices:
    A: Yield the right-of-way only if the crosswalk is marked with paint
    B: Yield the right-of-way in both marked and unmarked crosswalks
    C: Honk to warn the pedestrian to move faster
    D: Yield only if the pedestrian is a child or elderly
  answer: B
  explanation: Drivers in Nova Scotia must yield the right-of-way to pedestrians in
    both marked and unmarked crosswalks (unmarked crosswalks exist at every intersection).
- id: 101
  category: defensive_driving
  question: When following another vehicle at night in Nova Scotia, at what distance
    must you dim your high beam headlights?
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: You must switch to low beams when following another vehicle within
    60 meters to avoid blinding the driver ahead through their rearview mirror.
- id: 102
  category: defensive_driving
  question: 'When passing a bicycle traveling in the same direction, Nova Scotia law
    requires a minimum distance between your vehicle and the cyclist of:'
  choices:
    A: 0.5 meters
    B: 1 meter
    C: 1.5 meters
    D: 2 meters
  answer: B
  explanation: The Nova Scotia Motor Vehicle Act requires drivers to leave at least
    one meter (1m) of open space when passing a cyclist.
- id: 103
  category: defensive_driving
  question: When driving in heavy fog, which light setting should you use to ensure
    maximum visibility and safety?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture droplets, causing glare and reducing visibility further.
- id: 104
  category: defensive_driving
  question: 'Under Nova Scotia''s ''Move Over'' law, if you see an emergency vehicle
    stopped on the side of the road with its lights flashing, you must slow down to:'
  choices:
    A: 30 km/h
    B: 60 km/h or the posted limit if it is lower
    C: 80 km/h
    D: Half the posted speed limit
  answer: B
  explanation: Drivers must slow to 60 km/h, or the posted speed limit if it is lower
    than 60 km/h, when passing a stopped emergency vehicle with its lights flashing.
- id: 105
  category: defensive_driving
  question: To avoid hydroplaning on wet roads, what is the best defensive driving
    practice?
  choices:
    A: Speed up to get through the water quickly
    B: Brake hard as soon as you feel the car slide
    C: Reduce speed and ensure tires are properly inflated
    D: Drive in a lower gear with high RPMs
  answer: C
  explanation: Reducing speed is the most effective way to prevent hydroplaning. Properly
    inflated tires and good tread depth also help channel water away.
- id: 106
  category: defensive_driving
  question: In Nova Scotia, how far ahead should you scan the road (visual lead time)
    while driving in a city environment?
  choices:
    A: 2 to 5 seconds
    B: 5 to 8 seconds
    C: 12 to 15 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: The Nova Scotia Driver's Handbook recommends maintaining a visual lead
    of 12 to 15 seconds ahead to identify potential hazards early.
- id: 107
  category: defensive_driving
  question: If your vehicle begins to skid on an icy road, in which direction should
    you steer?
  choices:
    A: In the opposite direction of the skid
    B: In the direction you want the front of the vehicle to go
    C: Keep the steering wheel perfectly straight
    D: Toward the shoulder of the road
  answer: B
  explanation: If you skid, you should steer in the direction you want the vehicle
    to go. This helps the tires regain traction in the desired path of travel.
- id: 108
  category: defensive_driving
  question: 'When approaching a railway crossing in Nova Scotia where a signal is
    warning of an approaching train, you must stop your vehicle:'
  choices:
    A: At least 2 meters from the nearest rail
    B: Between 5 and 15 meters from the nearest rail
    C: Exactly 10 meters from the nearest rail
    D: As close to the tracks as possible
  answer: B
  explanation: According to the Nova Scotia Motor Vehicle Act, you must stop at least
    5 meters but no more than 15 meters from the nearest rail at a railway crossing.
- id: 109
  category: defensive_driving
  question: 'If you are driving a vehicle equipped with Anti-lock Braking System (ABS)
    and need to stop quickly on a slippery surface, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Apply the emergency brake
    D: Shift into neutral and coast to a stop
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Pumping the brakes
    is for older vehicles without ABS; doing so with ABS interferes with the system's
    operation.
- id: 110
  category: defensive_driving
  question: When driving in heavy rain, what is the primary danger of 'hydroplaning'?
  choices:
    A: The engine stalling due to water intake
    B: The brakes becoming wet and failing
    C: Tires losing contact with the road surface and riding on a film of water
    D: Visibility being reduced to zero
  answer: C
  explanation: Hydroplaning occurs when a layer of water builds up between the tires
    and the road surface, leading to a loss of traction and steering control.
- id: 111
  category: defensive_driving
  question: 'In Nova Scotia, if you are driving on a highway with a speed limit of
    100 km/h and you encounter a school bus with red lights flashing, you must stop:'
  choices:
    A: Only if you are traveling in the same direction as the bus
    B: Only if the bus is on your side of a divided highway
    C: Whether you are approaching from the front or following from the rear
    D: Only if there are more than two lanes of traffic
  answer: C
  explanation: In Nova Scotia, you must stop for a school bus with flashing red lights
    whether you are following the bus or approaching it from the front, unless the
    road is divided by a median.
- id: 112
  category: defensive_driving
  question: According to the Nova Scotia Driver's Handbook, what is the minimum recommended
    following distance behind another vehicle under ideal driving conditions?
  choices:
    A: One car length for every 10 km/h
    B: A two-second gap
    C: A four-second gap
    D: 50 meters
  answer: B
  explanation: Nova Scotia recommends the 'two-second rule' as a minimum following
    distance under ideal conditions to allow enough time to react to sudden stops.
- id: 113
  category: defensive_driving
  question: 'When driving at night in Nova Scotia, you must dim your high-beam headlights
    when an oncoming vehicle is within:'
  choices:
    A: 100 meters
    B: 150 meters
    C: 200 meters
    D: 300 meters
  answer: B
  explanation: Under the Nova Scotia Motor Vehicle Act, drivers must switch to low
    beams when an oncoming vehicle is within 150 meters to avoid blinding the other
    driver.
- id: 114
  category: defensive_driving
  question: To practice effective scanning, the Nova Scotia Driver's Handbook suggests
    that drivers should look how far ahead of their vehicle?
  choices:
    A: 5 to 8 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: Only at the vehicle directly in front
  answer: B
  explanation: Scanning 12 to 15 seconds ahead allows drivers to anticipate hazards
    and plan their path of travel well in advance.
- id: 115
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet road in Nova Scotia, what
    is the correct defensive driving action?
  choices:
    A: Brake hard to regain traction
    B: Accelerate to drive through the water
    C: Take your foot off the gas and steer straight
    D: Turn the steering wheel sharply toward the shoulder
  answer: C
  explanation: If hydroplaning, you should ease off the accelerator and keep the steering
    wheel straight. Do not brake, as this can cause a skid when the tires regain contact
    with the road.
- id: 116
  category: defensive_driving
  question: When driving in heavy fog in Nova Scotia, which lights should you use?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture droplets, creating glare and reducing visibility further.
- id: 117
  category: defensive_driving
  question: How many demerit points are assigned to a Nova Scotia driver's record
    for 'Following too closely'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Following too closely is a violation of the Motor Vehicle Act and results
    in 2 demerit points being added to the driver's record.
- id: 118
  category: defensive_driving
  question: In winter conditions, Nova Scotia law requires that you clear snow and
    ice from which parts of your vehicle before driving?
  choices:
    A: Only the windshield and front side windows
    B: The windshield, all windows, and all lights
    C: Only the roof and the hood
    D: Only the driver's side of the windshield
  answer: B
  explanation: The Nova Scotia Motor Vehicle Act requires that all windows and lights
    be clear of obstructions, including snow and ice, to ensure full visibility and
    safety.
- id: 119
  category: defensive_driving
  question: Nova Scotia's 'Move Over' law requires drivers to slow down and, if safe,
    move into the left lane when passing which type of vehicle stopped on the shoulder
    with lights flashing?
  choices:
    A: Only police cars
    B: Only ambulances and fire trucks
    C: All emergency vehicles and tow trucks
    D: Any vehicle with hazard lights on
  answer: C
  explanation: The law applies to all emergency vehicles (police, fire, ambulance)
    and service vehicles like tow trucks that are stopped on the roadside with their
    lights flashing.
- id: 120
  category: defensive_driving
  question: If your vehicle's brakes fail while driving, what is the first defensive
    action you should take?
  choices:
    A: Turn off the engine immediately
    B: Shift into neutral
    C: Pump the brake pedal rapidly
    D: Jump out of the vehicle
  answer: C
  explanation: Pumping the brake pedal can often build up enough hydraulic pressure
    to stop the vehicle if the failure is partial.
- id: 121
  category: defensive_driving
  question: 'If you are driving on a highway and a tire blows out, you should:'
  choices:
    A: Brake hard immediately to stop
    B: Grip the steering wheel firmly and ease off the gas
    C: Quickly steer toward the shoulder
    D: Shift into a lower gear and apply the parking brake
  answer: B
  explanation: Grip the wheel firmly to maintain control, keep the vehicle straight,
    and ease off the accelerator. Do not brake until the vehicle has slowed down significantly.
- id: 122
  category: defensive_driving
  question: Under the Nova Scotia Motor Vehicle Act, what is the penalty for failing
    to yield to a pedestrian in a crosswalk?
  choices:
    A: A fine and 2 demerit points
    B: A fine and 4 demerit points
    C: A fine and 6 demerit points
    D: A fine only, no points
  answer: B
  explanation: Failing to yield to a pedestrian in a crosswalk is a serious offense
    in Nova Scotia and results in 4 demerit points.
- id: 123
  category: defensive_driving
  question: 'When driving on a multi-lane highway in Nova Scotia, the ''blind spot''
    is best checked by:'
  choices:
    A: Looking in the rearview mirror
    B: Looking in the side-view mirrors
    C: Turning your head to look out the side windows
    D: Using a wide-angle clip-on mirror
  answer: C
  explanation: Mirrors cannot see everything. A shoulder check (turning your head)
    is required to see vehicles in the blind spots before changing lanes.
- id: 124
  category: alcohol_drugs_health
  question: 'In Nova Scotia, a fully licensed driver (non-GDL) who is found to have
    a Blood Alcohol Concentration (BAC) between 0.05 and 0.08 will face an immediate
    roadside license suspension of:'
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 7 days
  answer: B
  explanation: In Nova Scotia, if a fully licensed driver's BAC is in the 'warn' range
    (0.05 to 0.08), they are subject to an immediate 24-hour roadside license suspension.
- id: 125
  category: alcohol_drugs_health
  question: 'If a driver in Nova Scotia refuses to provide a breath, blood, or oral
    fluid sample upon a legal demand by a peace officer, the administrative penalty
    is:'
  choices:
    A: A 24-hour suspension and a $100 fine
    B: A 30-day license suspension
    C: An immediate 90-day Administrative License Suspension
    D: No immediate penalty until convicted in court
  answer: C
  explanation: Refusing a demand for a sobriety test in Nova Scotia results in an
    immediate 90-day Administrative License Suspension (ALS), the same penalty as
    blowing over 0.08.
- id: 126
  category: alcohol_drugs_health
  question: 'Upon a first-time Criminal Code conviction for impaired driving in Nova
    Scotia, the provincial license revocation period is:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: Under the Nova Scotia Motor Vehicle Act, a first-time conviction for
    a Criminal Code alcohol or drug-related driving offense results in a 1-year license
    revocation.
- id: 127
  category: alcohol_drugs_health
  question: Drivers convicted of impaired driving in Nova Scotia must complete which
    program before they can apply for license reinstatement?
  choices:
    A: The Defensive Driving Course
    B: The Alcohol and Drug Education Program (Driving While Impaired Program)
    C: A standard 6-hour driver training session
    D: The High-Risk Driver Exam
  answer: B
  explanation: Nova Scotia requires drivers convicted of alcohol or drug-related offenses
    to complete an addiction assessment and the 'Driving While Impaired' (DWI) education
    program through Addiction Services.
- id: 128
  category: alcohol_drugs_health
  question: What is the consequence for a third or subsequent Criminal Code conviction
    for impaired driving in Nova Scotia?
  choices:
    A: A 5-year revocation
    B: An indefinite revocation (minimum 5 years)
    C: A 10-year revocation
    D: A permanent revocation with no possibility of reinstatement
  answer: B
  explanation: A third or subsequent conviction results in an indefinite revocation,
    though the driver may be eligible to apply for reinstatement after 5 years under
    specific conditions.
- id: 129
  category: alcohol_drugs_health
  question: The Nova Scotia Alcohol Ignition Interlock Program is mandatory for which
    of the following?
  choices:
    A: All drivers with a Class 7 license
    B: Drivers convicted of impaired driving causing bodily harm or death
    C: Any driver who receives a 24-hour suspension
    D: Drivers who have reached 10 demerit points
  answer: B
  explanation: The Ignition Interlock Program is mandatory for certain high-risk offenders,
    including those convicted of impaired driving causing bodily harm or death, and
    repeat offenders.
- id: 130
  category: alcohol_drugs_health
  question: If you are taking prescription drugs and need to drive, what is your primary
    responsibility in Nova Scotia?
  choices:
    A: To drive only during daylight hours
    B: To drive 10 km/h below the speed limit
    C: To consult with a doctor or pharmacist about the drug's effects on driving
    D: To keep the prescription bottle in the glove box at all times
  answer: C
  explanation: Drivers are responsible for knowing how medications affect them. You
    must consult a medical professional to ensure the drug does not impair your ability
    to drive safely.
- id: 131
  category: alcohol_drugs_health
  question: In Nova Scotia, what is the immediate Administrative License Suspension
    (ALS) period if a driver's BAC is 0.08 or higher?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: D
  explanation: If a driver is caught with a BAC over 0.08, their license is immediately
    suspended for 90 days before the case even goes to court.
- id: 132
  category: alcohol_drugs_health
  question: What is the legal limit for THC (the psychoactive component of cannabis)
    in a driver's blood that triggers a summary conviction offense in Canada (and
    Nova Scotia)?
  choices:
    A: Between 2 nanograms (ng) and 5 nanograms (ng)
    B: Exactly 10 nanograms (ng)
    C: Any detectable amount for all drivers
    D: There is no blood limit for cannabis
  answer: A
  explanation: Having between 2ng and 5ng of THC per ml of blood is a summary conviction
    offense. Having 5ng or more is a more serious hybrid offense.
- id: 133
  category: alcohol_drugs_health
  question: 'If a driver is found to be impaired by a combination of alcohol and drugs,
    and has a BAC of 0.05 or higher and a THC level of 2.5ng or higher, the penalty
    is:'
  choices:
    A: The same as a 24-hour suspension
    B: A warning only
    C: Treated as a serious Criminal Code offense
    D: Only a small fine
  answer: C
  explanation: Combining alcohol and drugs significantly increases impairment. Federal
    law (applied in NS) sets strict limits for combined consumption (0.05 BAC + 2.5ng
    THC) which constitutes a Criminal Code offense.
- id: 134
  category: alcohol_drugs_health
  question: When a driver is reinstated after an alcohol-related revocation in Nova
    Scotia, they are placed in the 'Restricted Individual' (Condition H) stage. What
    is their BAC limit during this time?
  choices:
    A: '0.00'
    B: '0.03'
    C: '0.05'
    D: '0.08'
  answer: A
  explanation: Drivers reinstated after an alcohol-related revocation must maintain
    a 0.00 BAC for a period of one year (Condition H).
- id: 135
  category: alcohol_drugs_health
  question: 'If a driver is feeling fatigued or drowsy while driving on a Nova Scotia
    highway, the safest action is to:'
  choices:
    A: Turn up the radio and open the windows
    B: Drink a high-caffeine energy drink and continue
    C: Pull over in a safe area and rest or nap
    D: Increase speed to reach the destination faster
  answer: C
  explanation: Fatigue is a form of impairment. The only effective cure for drowsiness
    is sleep; tricks like loud music or fresh air provide only a very brief and unreliable
    sense of alertness.
- id: 136
  category: alcohol_drugs_health
  question: 'In Nova Scotia, if a driver is convicted of a Criminal Code impaired
    driving offense, they must pay a license reinstatement fee of approximately:'
  choices:
    A: No fee is required
    B: $25.00
    C: $124.60 (standard fee)
    D: $100.00 plus the cost of the DWI program and assessment
    E: The reinstatement fee is significantly higher for alcohol-related revocations
      (approx. $124.60) plus program costs.
  answer: C
  explanation: While fees change slightly with inflation, Nova Scotia requires a specific
    reinstatement fee (currently $124.60) in addition to completing all required addiction
    programs and assessments.
- id: 137
  category: alcohol_drugs_health
  question: In Nova Scotia, a fully licensed driver (not in the GDL program) will
    face an immediate 24-hour roadside license suspension if their Blood Alcohol Content
    (BAC) is within what range?
  choices:
    A: 0.01 to 0.04
    B: 0.05 to 0.08
    C: 0.08 to 0.10
    D: Above 0.10
  answer: B
  explanation: In Nova Scotia, fully licensed drivers face an immediate 24-hour administrative
    license suspension if their BAC is between 0.05 and 0.08 (the 'warning' range).
- id: 138
  category: alcohol_drugs_health
  question: Under the Nova Scotia Motor Vehicle Act, what is the minimum license revocation
    period for a first-time Criminal Code conviction related to impaired driving?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: A first-time conviction under the Criminal Code of Canada for impaired
    driving results in a minimum 1-year driver's license revocation in Nova Scotia.
- id: 139
  category: alcohol_drugs_health
  question: If a driver's breath or blood sample results in a BAC over 0.08, they
    will receive an immediate Administrative License Suspension (ALS) for how many
    days?
  choices:
    A: 7 days
    B: 30 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Nova Scotia law mandates an immediate 90-day Administrative License
    Suspension for drivers who blow over 0.08 or refuse a breathalyzer test.
- id: 140
  category: alcohol_drugs_health
  question: In Nova Scotia, what are the legal consequences of refusing to provide
    a breath or blood sample to a peace officer?
  choices:
    A: A small fine and a 24-hour suspension
    B: The same penalties as having a BAC over 0.08
    C: A warning for the first offense
    D: A mandatory 30-day jail sentence
  answer: B
  explanation: Refusing to provide a breath or blood sample is a criminal offense
    and carries the same penalties as driving with a BAC over 0.08, including license
    revocation and fines.
- id: 141
  category: alcohol_drugs_health
  question: If a driver is caught operating a vehicle with a BAC over 0.08, their
    vehicle will be impounded for a minimum of how many days?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: In Nova Scotia, if you are charged with an alcohol-related driving
    offense (BAC over 0.08 or refusal), the vehicle you are driving is subject to
    an immediate 7-day impoundment.
- id: 142
  category: alcohol_drugs_health
  question: Following a conviction for impaired driving in Nova Scotia, a driver may
    be required to participate in which program to regain their driving privileges?
  choices:
    A: The Defensive Driving Course
    B: The Alcohol Rehabilitation Program (Addictions Services)
    C: The High-Risk Driver Seminar
    D: The Driver Improvement Interview
  answer: B
  explanation: Drivers convicted of impaired driving must complete an addiction assessment
    and/or an Alcohol Rehabilitation Program through Nova Scotia Health Authority
    (Addictions Services) before license reinstatement.
- id: 143
  category: alcohol_drugs_health
  question: 'In Nova Scotia, a third or subsequent Criminal Code conviction for impaired
    driving results in a license revocation of at least:'
  choices:
    A: 5 years
    B: 10 years
    C: Indefinite (Permanent)
    D: 20 years
  answer: C
  explanation: A third or subsequent impaired driving conviction results in an indefinite
    (permanent) license revocation, though there are specific, strict conditions under
    which one might apply for a review after 10 years.
- id: 144
  category: alcohol_drugs_health
  question: Which of the following is true regarding the Nova Scotia Ignition Interlock
    Program?
  choices:
    A: It is strictly voluntary for all offenders
    B: It is mandatory for certain repeat offenders or those with high BAC levels
    C: It is only for drivers under the age of 19
    D: It is only used for speeding violations
  answer: B
  explanation: The Ignition Interlock Program is mandatory for some impaired driving
    offenders in Nova Scotia to regain partial driving privileges during their revocation
    period or as a condition of reinstatement.
- id: 145
  category: alcohol_drugs_health
  question: Who is legally responsible for reporting a medical condition that may
    make it unsafe for a person to drive in Nova Scotia?
  choices:
    A: Only the driver's insurance company
    B: Only the driver's employer
    C: Both the driver and their attending physician or optometrist
    D: Only the police
  answer: C
  explanation: In Nova Scotia, drivers are required to report any medical conditions
    that may affect their driving, and physicians/optometrists are also legally mandated
    to report patients who have conditions that make it dangerous for them to operate
    a motor vehicle.
- id: 146
  category: alcohol_drugs_health
  question: If you are taking a prescription drug or over-the-counter medication,
    what is your primary responsibility before driving?
  choices:
    A: Drive only during daylight hours
    B: Check the label or ask a pharmacist/doctor about side effects that could impair
      driving
    C: Wait at least one hour after taking the medication
    D: Drink extra water to flush the medication out faster
  answer: B
  explanation: It is the driver's responsibility to ensure they are not impaired by
    any substance. You must check for side effects like drowsiness or blurred vision
    before operating a vehicle.
- id: 147
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with even small amounts of drugs
    or medication?
  choices:
    A: The effects of the alcohol are cancelled out
    B: The effects of the drug are cancelled out
    C: The combined effect is often greater than the sum of the two (synergistic effect)
    D: There is no change in impairment levels
  answer: C
  explanation: Mixing alcohol and drugs can produce a synergistic effect, meaning
    the level of impairment is significantly higher than if either substance were
    used alone.
- id: 148
  category: alcohol_drugs_health
  question: 'In Nova Scotia, if a police officer suspects you are impaired by a drug,
    they can demand that you:'
  choices:
    A: Perform a Standardized Field Sobriety Test (SFST)
    B: Provide an oral fluid sample
    C: Undergo an evaluation by a Drug Recognition Expert (DRE)
    D: All of the above
  answer: D
  explanation: Police in Nova Scotia have the authority to use SFSTs, oral fluid drug
    screeners, and DRE evaluations to determine if a driver is impaired by drugs (including
    cannabis).
- id: 149
  category: alcohol_drugs_health
  question: How does fatigue affect your driving ability compared to alcohol?
  choices:
    A: Fatigue is not a serious concern for experienced drivers
    B: Being extremely tired can impair your reaction time and judgment as much as
      being legally drunk
    C: Fatigue only affects your vision, not your decision-making
    D: Coffee is a proven cure for driver fatigue
  answer: B
  explanation: Fatigue significantly slows reaction times and impairs judgment. Studies
    show that being awake for 17-19 hours can result in impairment levels similar
    to a BAC of 0.05.
- id: 150
  category: alcohol_drugs_health
  question: If you are convicted of an alcohol-related driving offense and your license
    is revoked, what must you pay before your license can be reinstated?
  choices:
    A: Only the court fine
    B: A license reinstatement fee and any applicable administrative fees
    C: Your insurance deductible
    D: A fee to the local police department
  answer: B
  explanation: To get your license back after a revocation in Nova Scotia, you must
    pay a reinstatement fee to the Registry of Motor Vehicles, in addition to completing
    any required programs and paying court-ordered fines.
- id: 151
  category: penalties_and_points
  question: For a fully licensed driver (non-GDL) in Nova Scotia, at what point total
    is their driver's license suspended for the first time?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: While GDL drivers are suspended at 6 points, a fully licensed driver
    in Nova Scotia will have their license suspended upon accumulating 10 demerit
    points.
- id: 152
  category: penalties_and_points
  question: If a driver is caught 'stunting' (driving 50 km/h or more over the speed
    limit) in Nova Scotia, what is the immediate roadside penalty?
  choices:
    A: A warning and a $200 fine
    B: Immediate 24-hour license suspension
    C: Immediate 7-day license suspension and vehicle impoundment
    D: No immediate penalty until a court date
  answer: C
  explanation: Under Nova Scotia law, stunting results in an immediate 7-day driver's
    license suspension, the vehicle is impounded for 7 days, and the driver faces
    a significant fine.
- id: 153
  category: penalties_and_points
  question: In Nova Scotia, how many demerit points are recorded for failing to yield
    the right of way to a pedestrian in a crosswalk?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Failing to yield to a pedestrian in a crosswalk is a serious violation
    in Nova Scotia, carrying a penalty of 4 demerit points.
- id: 154
  category: penalties_and_points
  question: If a fully licensed driver is found to have a Blood Alcohol Concentration
    (BAC) between 0.05 and 0.08, what is the immediate administrative penalty for
    a first offense?
  choices:
    A: A 24-hour roadside license suspension
    B: A 7-day license suspension
    C: A 90-day license suspension
    D: Permanent revocation of the license
  answer: B
  explanation: In Nova Scotia, a first-time administrative suspension for a BAC in
    the 'warn' range (0.05 to 0.08) results in an immediate 7-day license suspension.
- id: 155
  category: penalties_and_points
  question: If you are convicted of failing to remain at the scene of an accident
    in Nova Scotia, how many demerit points will be added to your record?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a major offense and
    carries a penalty of 6 demerit points.
- id: 156
  category: penalties_and_points
  question: How long do demerit points remain on a driver's record in Nova Scotia
    from the date of the violation?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: B
  explanation: In Nova Scotia, demerit points remain on your driving record for a
    period of 24 months (2 years) from the date of the conviction.
- id: 157
  category: penalties_and_points
  question: In Nova Scotia, how many demerit points are assigned for 'Passing where
    prohibited' (e.g., on a solid line or curve)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Improper passing or passing where prohibited by signs or markings results
    in 2 demerit points.
- id: 158
  category: penalties_and_points
  question: Under Nova Scotia's 'Move Over' law, drivers must slow down and move to
    the far lane when passing emergency vehicles with flashing lights. What is the
    demerit point penalty for failing to do so?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Failing to obey the 'Move Over' law in Nova Scotia results in a fine
    and 2 demerit points.
- id: 159
  category: penalties_and_points
  question: What is the penalty for a driver who fails to stop for a school bus when
    its red lights are flashing in Nova Scotia?
  choices:
    A: 2 demerit points and a $100 fine
    B: 4 demerit points and a $250 fine
    C: 6 demerit points and a fine starting at approximately $410
    D: Automatic license revocation for 1 year
  answer: C
  explanation: Failing to stop for a school bus with flashing red lights is a serious
    offense in Nova Scotia, carrying 6 demerit points and a significant fine (Category
    D offense).
- id: 160
  category: penalties_and_points
  question: Under Nova Scotia's 'Move Over' law, what must a driver do when approaching
    a stopped emergency vehicle with its lights flashing on a road with two or more
    lanes in the same direction?
  choices:
    A: Maintain speed but honk to alert the emergency workers
    B: Slow down to 60 km/h (or the posted limit if lower) and move into another lane
      if safe to do so
    C: Stop completely until the emergency vehicle turns off its lights
    D: Speed up to pass the area as quickly as possible
  answer: B
  explanation: Nova Scotia law requires drivers to slow to 60 km/h (or the posted
    limit) and move to the non-adjacent lane when passing emergency vehicles or tow
    trucks with flashing lights.
- id: 161
  category: penalties_and_points
  question: In Nova Scotia, a peace officer can issue an immediate 24-hour roadside
    suspension if a driver's Blood Alcohol Concentration (BAC) is within what range?
  choices:
    A: 0.01 to 0.04
    B: 0.05 to 0.08
    C: Above 0.10 only
  answer: B
  explanation: Nova Scotia has a 'warn range' where drivers with a BAC between 0.05
    and 0.08 can face an immediate 24-hour roadside license suspension.
- id: 162
  category: penalties_and_points
  question: What is the demerit point penalty for failing to remain at the scene of
    an accident in Nova Scotia?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Failing to remain at the scene of an accident (hit and run) results
    in 6 demerit points on a Nova Scotia driving record.
- id: 163
  category: penalties_and_points
  question: 'In Nova Scotia, an Administrative License Suspension (ALS) of 90 days
    is automatically triggered if a driver:'
  choices:
    A: Accumulates 10 demerit points
    B: Is caught speeding 30 km/h over the limit
    C: Fails a breathalyzer test (over 0.08) or refuses to provide a sample
    D: Is involved in any accident involving property damage
  answer: C
  explanation: The 90-day Administrative License Suspension is applied immediately
    if a driver is charged with having a BAC over 0.08 or refusing a breath/blood
    demand.
- id: 164
  category: penalties_and_points
  question: How many demerit points are assigned for 'Racing' or 'Betting on a horse
    race' on a Nova Scotia highway?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Racing on a highway is a major violation and carries 6 demerit points
    in Nova Scotia.
- id: 165
  category: sharing_the_road
  question: In Nova Scotia, when approaching a school bus from either direction that
    has its red lights flashing and stop arm extended, what must you do?
  choices:
    A: Slow down to 20 km/h and pass with caution
    B: Stop at least 5 metres away from the bus
    C: Stop at least 20 metres away from the bus
    D: Stop only if you are following the bus
  answer: C
  explanation: According to the Nova Scotia Driver's Handbook, drivers must stop at
    least 20 metres away from a school bus when its red lights are flashing, regardless
    of which direction they are coming from, unless the road is divided by a median.
- id: 166
  category: sharing_the_road
  question: Under Nova Scotia's 'Move Over' law, if you are passing a stopped emergency
    vehicle with its lights flashing on a highway with a speed limit of 100 km/h,
    what is the maximum speed you are permitted to drive?
  choices:
    A: 80 km/h
    B: 60 km/h
    C: 50 km/h
    D: The posted speed limit
  answer: B
  explanation: Nova Scotia law requires drivers to slow to 60 km/h (or the posted
    speed limit if it is lower than 60 km/h) when passing emergency vehicles or tow
    trucks stopped on the side of the road with lights flashing.
- id: 167
  category: sharing_the_road
  question: When passing a cyclist in Nova Scotia, what is the minimum distance a
    motorist must maintain between their vehicle and the cyclist?
  choices:
    A: 0.5 metres
    B: 1 metre
    C: 1.5 metres
    D: 2 metres
  answer: B
  explanation: The Nova Scotia Motor Vehicle Act requires drivers to maintain a minimum
    distance of one metre (1m) when passing a cyclist.
- id: 168
  category: sharing_the_road
  question: In Nova Scotia, which of the following vehicles are NOT covered under
    the 'Move Over' law requiring drivers to slow down and change lanes?
  choices:
    A: Police vehicles and Fire trucks
    B: Ambulances and Tow trucks
    C: Department of Natural Resources vehicles with flashing lights
    D: Mail delivery vehicles
  answer: D
  explanation: The 'Move Over' law applies to emergency vehicles (police, fire, ambulance),
    tow trucks, and public utility vehicles (like NS Power) when their lights are
    flashing. Mail delivery vehicles are not included.
- id: 169
  category: sharing_the_road
  question: When a school bus is stopped on a highway that is divided by a median,
    who is required to stop when the bus has its red lights flashing?
  choices:
    A: Drivers in all lanes must stop
    B: Only drivers approaching from the front must stop
    C: Only drivers following the bus must stop
    D: No one is required to stop on a divided highway
  answer: C
  explanation: On a highway divided by a median, only traffic following the bus is
    required to stop. Traffic approaching from the front in the opposite lanes (separated
    by the median) does not have to stop.
- id: 170
  category: sharing_the_road
  question: Is a driver permitted to cross a yellow line to pass a cyclist in Nova
    Scotia?
  choices:
    A: No, it is never permitted
    B: Yes, but only if the line is broken
    C: Yes, even if the line is solid, provided it is safe to do so
    D: Only if the cyclist signals you to pass
  answer: C
  explanation: Nova Scotia law allows drivers to cross a yellow line (even a solid
    one) to pass a cyclist, as long as it is safe and the driver can maintain the
    required 1-metre distance.
- id: 171
  category: sharing_the_road
  question: 'When following a motorcycle, you should allow for more following distance
    than you would for a car because:'
  choices:
    A: Motorcycles have a shorter stopping distance
    B: Motorcycles are faster than cars
    C: Motorcyclists are more likely to tail-gate
    D: Motorcycles are harder to see at night
  answer: A
  explanation: Motorcycles are lighter and have high-performance braking systems,
    allowing them to stop much more quickly than a car. Increasing your following
    distance prevents rear-end collisions.
- id: 172
  category: sharing_the_road
  question: In Nova Scotia, what is the legal requirement for cyclists regarding helmets?
  choices:
    A: Helmets are optional for adults over 18
    B: Helmets are only required on highways
    C: Helmets are mandatory for all ages
    D: Helmets are only required for children under 16
  answer: C
  explanation: In Nova Scotia, it is mandatory for everyone—regardless of age—to wear
    a helmet while cycling.
- id: 173
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may need to:'
  choices:
    A: Stay close to the right curb
    B: Swing wide to the left before turning
    C: Speed up to clear the intersection
    D: Turn from the left-most lane
  answer: B
  explanation: Large trucks have a wide turning radius and often need to swing wide
    to the left to clear the curb on a right-hand turn. Drivers should never try to
    squeeze between the truck and the curb.
- id: 174
  category: sharing_the_road
  question: 'If an emergency vehicle with sirens and flashing lights is approaching
    you from behind on a two-way street, you must:'
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are
    C: Pull to the right as far as possible and stop
    D: Pull to the left and stop
  answer: C
  explanation: Drivers must pull to the right-hand curb or edge of the road and come
    to a complete stop until the emergency vehicle has passed.
- id: 175
  category: sharing_the_road
  question: What does a pedestrian carrying a white cane signify in Nova Scotia?
  choices:
    A: The pedestrian is a senior citizen
    B: The pedestrian is visually impaired
    C: The pedestrian has a mobility issue
    D: The pedestrian is a crossing guard
  answer: B
  explanation: A white cane is used by people who are blind or visually impaired.
    Drivers must exercise extreme caution and yield the right of way.
- id: 176
  category: sharing_the_road
  question: 'When a transit bus has signaled its intention to pull back into the flow
    of traffic from a bus bay, you should:'
  choices:
    A: Speed up to pass the bus
    B: Maintain your speed; the bus must wait for a gap
    C: Yield the right of way and allow the bus to enter
    D: Honk to warn the bus driver you are there
  answer: C
  explanation: In Nova Scotia, drivers are encouraged (and in many jurisdictions required
    by signage) to yield to transit buses that are signaling to re-enter traffic from
    a stop or bus bay.
- id: 177
  category: sharing_the_road
  question: 'A ''No-Zone'' refers to:'
  choices:
    A: A school zone where no parking is allowed
    B: The blind spots around a large truck or bus
    C: An area where no pedestrians are permitted
    D: A construction zone with no speed limit
  answer: B
  explanation: The 'No-Zone' represents the large blind spots around trucks and buses
    where the driver cannot see other vehicles. If you cannot see the truck driver's
    mirrors, they cannot see you.
- id: 178
  category: sharing_the_road
  question: When a school bus is stopped with red lights flashing on a highway divided
    by a median, which of the following is true?
  choices:
    A: Traffic in both directions must stop.
    B: Only traffic following the bus must stop.
    C: Only traffic approaching from the front must stop.
    D: No one is required to stop on a divided highway.
  answer: B
  explanation: In Nova Scotia, on a highway divided by a median, only the drivers
    approaching from the rear (following the bus) are required to stop. Drivers in
    the oncoming lanes separated by the median do not need to stop.
- id: 179
  category: sharing_the_road
  question: In Nova Scotia, if you are following a motorcycle, what is the recommended
    minimum following distance in ideal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 6 seconds
  answer: B
  explanation: While 2 seconds is the minimum following distance for any vehicle in
    ideal conditions, it is especially important for motorcycles as they can stop
    much faster than cars.
- id: 180
  category: sharing_the_road
  question: When a pedestrian is crossing the street at an unmarked crosswalk (an
    intersection without painted lines), what must a driver do?
  choices:
    A: The driver has the right of way.
    B: The driver must yield to the pedestrian.
    C: The pedestrian must wait for a gap in traffic.
    D: The driver should honk to warn the pedestrian.
  answer: B
  explanation: In Nova Scotia, every intersection is considered a crosswalk, whether
    it is marked or unmarked. Drivers must yield the right of way to pedestrians in
    both marked and unmarked crosswalks.
- id: 181
  category: sharing_the_road
  question: When passing a cyclist in Nova Scotia, are you permitted to cross a solid
    yellow line?
  choices:
    A: No, you must never cross a solid yellow line.
    B: Yes, provided it is safe and you can give the cyclist 1 meter of space.
    C: Only if the cyclist signals you to pass.
    D: Only on multi-lane highways.
  answer: B
  explanation: The Nova Scotia Motor Vehicle Act allows drivers to cross a yellow
    line (solid or double solid) to pass a cyclist, provided it can be done safely
    and the driver maintains the required 1-meter distance.
- id: 182
  category: sharing_the_road
  question: Which of the following vehicles are covered under Nova Scotia's 'Move
    Over' law?
  choices:
    A: Police and Fire vehicles only
    B: Ambulances and Police vehicles only
    C: Emergency vehicles, tow trucks, and public utility vehicles with flashing lights
    D: Any vehicle with hazard lights on
  answer: C
  explanation: Nova Scotia's 'Move Over' law applies to emergency vehicles (police,
    fire, ambulance), tow trucks, and government public safety/utility vehicles when
    their lights are flashing.
- id: 183
  category: sharing_the_road
  question: What are the 'No-Zones' around a large truck?
  choices:
    A: Areas where parking is prohibited.
    B: Blind spots where the truck driver cannot see you.
    C: Speed-restricted zones for trucks.
    D: The area directly in front of the truck only.
  answer: B
  explanation: No-Zones are large blind spots around a truck (front, back, and both
    sides) where the truck driver's visibility is limited or non-existent.
- id: 184
  category: sharing_the_road
  question: 'In Nova Scotia, cyclists are required by law to:'
  choices:
    A: Ride on the sidewalk.
    B: Ride against the flow of traffic.
    C: Wear a helmet.
    D: Ride only on designated bike paths.
  answer: C
  explanation: In Nova Scotia, it is mandatory for all cyclists, regardless of age,
    to wear a certified bicycle helmet.
- id: 185
  category: sharing_the_road
  question: 'When a school bus is displaying flashing amber (yellow) lights, it means:'
  choices:
    A: The bus is about to stop and you should prepare to stop.
    B: You must stop immediately.
    C: You should speed up to pass the bus before it stops.
    D: The bus is experiencing mechanical trouble.
  answer: A
  explanation: Flashing amber lights on a school bus indicate that the bus is preparing
    to stop to load or unload passengers. Drivers should slow down and be prepared
    to stop when the lights change to red.
- id: 186
  category: vehicle_information
  question: In Nova Scotia, what is the minimum legal tread depth for tires on a passenger
    vehicle?
  choices:
    A: 1.0 millimetre
    B: 1.5 millimetres
    C: 2.5 millimetres
    D: 3.0 millimetres
  answer: B
  explanation: According to Nova Scotia vehicle equipment regulations, tires are considered
    unsafe if the tread depth is less than 1.5 millimetres (approximately 2/32 of
    an inch).
- id: 187
  category: vehicle_information
  question: According to the Nova Scotia Motor Vehicle Act, when must you turn on
    your headlights due to poor visibility conditions?
  choices:
    A: When you cannot see clearly for 100 metres
    B: When you cannot see clearly for 150 metres
    C: When you cannot see clearly for 200 metres
    D: Only when it is completely dark
  answer: B
  explanation: In Nova Scotia, headlights must be turned on from a half-hour after
    sunset to a half-hour before sunrise, and at any other time when visibility is
    not clear for a distance of 150 metres.
- id: 188
  category: vehicle_information
  question: What is the Nova Scotia requirement regarding rear-view mirrors for a
    standard passenger vehicle?
  choices:
    A: Only one interior mirror is required
    B: Only one exterior driver-side mirror is required
    C: One interior mirror and one exterior driver-side mirror are required
    D: Three mirrors are required at all times
  answer: C
  explanation: 'Nova Scotia law requires vehicles to have at least two mirrors: one
    interior mirror and one exterior mirror on the left (driver) side. If the interior
    view is obstructed, a right-side exterior mirror is also required.'
- id: 189
  category: vehicle_information
  question: Which of the following is true regarding window tinting in Nova Scotia?
  choices:
    A: Any level of tint is allowed on the windshield
    B: No tint is allowed on the windshield or the front side windows
    C: Tint is allowed on front side windows as long as it is 50% transparent
    D: Tint is only allowed on the windshield
  answer: B
  explanation: In Nova Scotia, it is illegal to apply any tinting film to the windshield
    or the windows to the direct left and right of the driver (front side windows).
- id: 190
  category: vehicle_information
  question: 'Under Nova Scotia law, every motor vehicle must have a parking brake
    capable of holding the vehicle:'
  choices:
    A: On a level surface only
    B: Only when the vehicle is empty
    C: On any grade (hill) upon which it is operated
    D: Only when the engine is running
  answer: C
  explanation: The Motor Vehicle Act specifies that the parking brake must be able
    to hold the vehicle on any grade it is driven on, regardless of the load.
- id: 191
  category: vehicle_information
  question: 'A motor vehicle''s horn in Nova Scotia must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: Nova Scotia regulations require a horn to be in good working order
    and capable of emitting sound audible from a distance of not less than 60 metres.
- id: 192
  category: vehicle_information
  question: 'In Nova Scotia, the rear license plate must be illuminated so that it
    is clearly legible from a distance of:'
  choices:
    A: 5 metres
    B: 10 metres
    C: 15 metres
    D: 25 metres
  answer: C
  explanation: The rear registration plate must be illuminated by a white light so
    that the characters are visible from a distance of 15 metres to the rear.
- id: 193
  category: vehicle_information
  question: If a load extends more than how many metres beyond the rear of the vehicle
    body in Nova Scotia, a red flag or red light must be attached?
  choices:
    A: 0.5 metres
    B: 1.0 metre
    C: 1.5 metres
    D: 2.0 metres
  answer: B
  explanation: In Nova Scotia, if a load extends 1.0 metre (approx. 3 feet) or more
    beyond the rear of the vehicle, a red flag (day) or red light (night) must be
    displayed at the end of the load.
- id: 194
  category: vehicle_information
  question: What is the Nova Scotia law regarding vehicle mufflers?
  choices:
    A: Mufflers are optional on vehicles older than 20 years
    B: Mufflers can be bypassed if the driver is in a rural area
    C: Every motor vehicle must have a muffler in good working order to prevent excessive
      noise
    D: Muffler cut-outs are permitted for better fuel efficiency
  answer: C
  explanation: Nova Scotia law requires all motor vehicles to be equipped with a muffler
    in good working order. Muffler cut-outs, bypasses, or similar devices are prohibited.
- id: 195
  category: vehicle_information
  question: How often must most private passenger vehicles undergo a safety inspection
    in Nova Scotia?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Every 5 years
  answer: C
  explanation: In Nova Scotia, most private passenger vehicles are required to undergo
    a formal safety inspection every two years.
- id: 196
  category: vehicle_information
  question: 'In Nova Scotia, tail lights must be red and must be visible from a distance
    of at least:'
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 250 metres
  answer: B
  explanation: The Nova Scotia Motor Vehicle Act requires tail lights to be visible
    from a distance of 150 metres to the rear.
- id: 197
  category: vehicle_information
  question: Which of the following is a requirement for a vehicle's windshield in
    Nova Scotia?
  choices:
    A: It must be made of safety glass
    B: It can have minor cracks as long as they are on the passenger side
    C: It must be covered with a protective plastic film
    D: It must be replaced every 5 years regardless of condition
  answer: A
  explanation: Nova Scotia law requires that all automotive glass, including the windshield,
    be made of approved safety glass to prevent shattering upon impact.
- id: 198
  category: vehicle_information
  question: 'In Nova Scotia, you must switch your headlights to low beams when following
    another vehicle within a distance of:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: When following another vehicle from behind, you must dim your high
    beams when you are within 60 metres of that vehicle.
- id: 199
  category: vehicle_information
  question: According to Nova Scotia law, when must a vehicle's headlights be turned
    on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when it is raining or snowing
  answer: C
  explanation: Headlights must be turned on from 30 minutes after sunset to 30 minutes
    before sunrise, and at any other time when visibility is less than 150 metres.
- id: 200
  category: vehicle_information
  question: What is the mirror requirement for a passenger vehicle registered in Nova
    Scotia?
  choices:
    A: Only one interior rearview mirror is required
    B: One interior mirror and one left-hand exterior mirror
    C: Two exterior mirrors only
    D: One interior mirror and two exterior mirrors
  answer: B
  explanation: 'Nova Scotia law requires every motor vehicle to have at least two
    mirrors: one interior rearview mirror and one exterior mirror on the left side.'
- id: 201
  category: vehicle_information
  question: 'Every motor vehicle in Nova Scotia must be equipped with two separate
    means of applying brakes. These are:'
  choices:
    A: A foot brake and an emergency/parking brake
    B: Front brakes and rear brakes
    C: Hydraulic brakes and air brakes
    D: Manual brakes and automatic brakes
  answer: A
  explanation: The Motor Vehicle Act requires vehicles to have a service brake (foot
    brake) and a parking brake, each capable of stopping the vehicle.
- id: 202
  category: vehicle_information
  question: 'In Nova Scotia, a vehicle''s muffler must be in good working order to
    prevent:'
  choices:
    A: Engine overheating
    B: Excessive or unusual noise and annoying smoke
    C: Loss of fuel efficiency
    D: Carbon dioxide emissions
  answer: B
  explanation: The Motor Vehicle Act specifies that mufflers must prevent excessive
    noise and annoying smoke; 'muffler cut-outs' or bypasses are illegal.
- id: 203
  category: vehicle_information
  question: What is the maximum width allowed for a vehicle (including load) on Nova
    Scotia highways without a special permit?
  choices:
    A: 2.4 metres
    B: 2.6 metres
    C: 3.0 metres
    D: 3.2 metres
  answer: B
  explanation: The maximum width for a vehicle and its load on Nova Scotia highways
    is 2.6 metres.
- id: 204
  category: vehicle_information
  question: 'High beam headlights in Nova Scotia must be powerful enough to reveal
    persons and vehicles at a distance of at least:'
  choices:
    A: 60 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: B
  explanation: The high beam (upper distribution of light) must be sufficient to reveal
    persons and vehicles at a distance of at least 100 metres ahead.
- id: 205
  category: vehicle_information
  question: If you are towing a trailer in Nova Scotia, what is the requirement for
    safety chains?
  choices:
    A: They are only required for trailers over 2000kg
    B: They are recommended but not legally required
    C: The trailer must be connected to the towing vehicle by at least one safety
      chain
    D: Safety chains must be used and must be crossed under the tongue of the trailer
  answer: D
  explanation: Nova Scotia regulations require trailers to be equipped with safety
    chains that are strong enough to hold the trailer if the hitch fails, and they
    should be crossed to support the tongue.
- id: 206
  category: signs_and_signals
  question: In Nova Scotia, what must you do when approaching a flashing red traffic
    light?
  choices:
    A: Slow down and proceed with caution
    B: Stop, and proceed only when it is safe to do so
    C: Stop and wait for the light to turn green
    D: Yield to all traffic but do not come to a full stop
  answer: B
  explanation: According to the Nova Scotia Driver's Handbook, a flashing red light
    means you must come to a full stop and yield the right-of-way to traffic in or
    approaching the intersection. You may proceed only when it is safe.
- id: 207
  category: signs_and_signals
  question: When a traffic signal shows a steady green arrow combined with a red light,
    what are you permitted to do?
  choices:
    A: Stop and wait for the red light to change
    B: Proceed with caution in the direction of the arrow only
    C: Turn in any direction as long as you yield to pedestrians
    D: Make a U-turn
  answer: B
  explanation: A green arrow shown with a red light means you may enter the intersection
    to make the movement indicated by the arrow, but you must yield to pedestrians
    and other traffic lawfully using the intersection.
- id: 208
  category: signs_and_signals
  question: What does a flashing yellow (amber) traffic light indicate in Nova Scotia?
  choices:
    A: Stop and wait for the light to turn green
    B: The light is about to change to red
    C: Slow down and proceed with caution
    D: Pedestrians are crossing ahead
  answer: C
  explanation: A flashing yellow light is a warning to slow down and be extra cautious
    of cross traffic or hazards.
- id: 209
  category: signs_and_signals
  question: You are driving on a multi-lane highway and see a solid white line between
    your lane and the one beside you. What does this indicate?
  choices:
    A: Lane changes are encouraged
    B: Lane changes are discouraged or prohibited
    C: Traffic is moving in opposite directions
    D: The lane is ending
  answer: B
  explanation: In Nova Scotia, a solid white line is used to discourage lane changes
    where they may be dangerous, such as near intersections or in tunnels.
- id: 210
  category: signs_and_signals
  question: What is the correct hand signal to indicate a right-hand turn?
  choices:
    A: Left arm extended straight out the window
    B: Left arm out and bent downward
    C: Left arm out and bent upward
    D: Right arm extended straight out the window
  answer: C
  explanation: To signal a right turn using hand signals, the driver should extend
    their left arm out the window and bend it upward at the elbow.
- id: 211
  category: signs_and_signals
  question: 'In Nova Scotia, a white vertical bar signal (transit priority signal)
    located above a regular traffic light means:'
  choices:
    A: All traffic must stop
    B: Only emergency vehicles may proceed
    C: Only transit buses may proceed
    D: The light is about to turn green for everyone
  answer: C
  explanation: A white vertical bar on a black background is a transit priority signal,
    allowing transit buses to proceed through the intersection while other traffic
    faces a red light.
- id: 212
  category: signs_and_signals
  question: When approaching a stop sign, where should you bring your vehicle to a
    full stop if there is no marked stop line or crosswalk?
  choices:
    A: 5 meters before the sign
    B: Directly beside the stop sign
    C: At the edge of the sidewalk or the intersection
    D: Anywhere as long as you can see cross traffic
  answer: C
  explanation: If there is no stop line or crosswalk, the Nova Scotia Motor Vehicle
    Act requires you to stop at the point nearest the intersecting roadway where you
    have a view of approaching traffic.
- id: 213
  category: signs_and_signals
  question: What does a yellow diamond-shaped sign with a black symbol of a person
    walking represent?
  choices:
    A: School zone ahead
    B: Pedestrian crosswalk ahead
    C: Playground area
    D: Hitchhiking zone
  answer: B
  explanation: A yellow diamond sign with a pedestrian symbol is a warning sign indicating
    a pedestrian crosswalk is ahead.
- id: 214
  category: signs_and_signals
  question: In Nova Scotia, what does a solid yellow line on your side of a broken
    yellow line mean?
  choices:
    A: You may pass if it is safe
    B: You are in a one-way zone
    C: Passing is prohibited for you
    D: Passing is prohibited for oncoming traffic
  answer: C
  explanation: A solid yellow line on your side of the center line means it is unsafe
    and illegal to pass other vehicles.
- id: 215
  category: signs_and_signals
  question: When you see an orange diamond-shaped sign, what should you expect?
  choices:
    A: A hospital zone
    B: A scenic route
    C: Construction or maintenance work ahead
    D: A provincial park entrance
  answer: C
  explanation: Orange signs are used specifically for construction and maintenance
    warnings in Nova Scotia.
- id: 216
  category: signs_and_signals
  question: What is the meaning of a 'Yield' sign (an inverted triangle with a red
    border)?
  choices:
    A: Stop and wait for a green light
    B: Slow down and be prepared to stop to let other traffic or pedestrians pass
    C: Speed up to merge with traffic
    D: You have the right of way over all other vehicles
  answer: B
  explanation: A yield sign means you must slow down and, if necessary, stop to give
    the right-of-way to any vehicle or pedestrian in the intersection or on the connecting
    road.
- id: 217
  category: signs_and_signals
  question: When a 'Don't Walk' or 'Hand' pedestrian signal is flashing, what does
    it mean for a driver?
  choices:
    A: Drivers must stop immediately
    B: Pedestrians already in the crosswalk should finish crossing; no new pedestrians
      should enter
    C: The traffic light is about to turn green
    D: Drivers may turn right without yielding
  answer: B
  explanation: A flashing 'Don't Walk' signal indicates that pedestrians should not
    start to cross, but those already in the crosswalk should continue to the other
    side. Drivers must still yield to those in the crosswalk.
- id: 218
  category: signs_and_signals
  question: In Nova Scotia, are you permitted to turn left on a red light?
  choices:
    A: Never
    B: Only when turning from a one-way street onto another one-way street
    C: Only if there is no 'No Left Turn' sign
    D: Only during the hours of 12:00 AM to 5:00 AM
  answer: B
  explanation: Under Nova Scotia law, you may turn left on a red light only if you
    are turning from a one-way street into another one-way street, after coming to
    a complete stop and yielding to pedestrians and other traffic.
- id: 219
  category: signs_and_signals
  question: What does a sign with a green circle around a black arrow pointing straight
    ahead mean?
  choices:
    A: You must go straight; no turns are allowed
    B: You may go straight or turn
    C: One-way street ahead
    D: Truck route only
  answer: A
  explanation: A green circle is a permissive sign. If it contains a straight arrow,
    it means that you are permitted to go straight only; turning is prohibited at
    that intersection.
- id: 220
  category: signs_and_signals
  question: What do double solid white lines on a roadway indicate?
  choices:
    A: Passing is allowed in both directions
    B: The road is for HOV vehicles only
    C: Crossing the lines to change lanes is prohibited
    D: You are approaching a railway crossing
  answer: C
  explanation: Double solid white lines indicate that lane changing is prohibited.
    You must stay within your lane.
- id: 221
  category: signs_and_signals
  question: In Nova Scotia, what does a flashing red light at an intersection mean?
  choices:
    A: Slow down and proceed with caution
    B: The signal is broken; treat it as a four-way stop
    C: Stop, yield the right-of-way to traffic and pedestrians, and proceed when it
      is safe
    D: Stop and wait for the light to turn green
  answer: C
  explanation: According to the Nova Scotia Driver's Handbook, a flashing red light
    means you must come to a full stop and yield to other traffic and pedestrians
    before proceeding when it is safe to do so.
- id: 222
  category: signs_and_signals
  question: What is the meaning of a flashing amber (yellow) light at an intersection
    in Nova Scotia?
  choices:
    A: Stop and wait for the light to turn green
    B: Slow down and proceed with caution
    C: Speed up to clear the intersection quickly
    D: Treat it as a stop sign
  answer: B
  explanation: A flashing amber light is a warning to slow down and be prepared to
    stop, proceeding through the intersection with caution.
- id: 223
  category: signs_and_signals
  question: 'A solid white line painted across an intersection lane indicates:'
  choices:
    A: A pedestrian crosswalk only
    B: A stop line where you must stop for a red light or stop sign
    C: The area where you should park
    D: A lane reserved for buses
  answer: B
  explanation: A solid white line across a lane is a stop line, indicating the exact
    point where a driver must stop for a traffic signal or stop sign.
- id: 224
  category: signs_and_signals
  question: In Nova Scotia, what does a 'Transit Priority' signal (a steady white
    vertical bar on a black background) mean?
  choices:
    A: All vehicles may proceed straight
    B: Only emergency vehicles may proceed
    C: Only transit buses may proceed while other traffic faces a red light
    D: The lane is closed for construction
  answer: C
  explanation: The white vertical bar is a transit priority signal that allows transit
    buses to move through the intersection while other traffic is held by a red light.
- id: 225
  category: signs_and_signals
  question: What does a diamond-shaped symbol painted on a road lane represent in
    Nova Scotia?
  choices:
    A: A high-speed passing lane
    B: A lane reserved for specific types of vehicles (e.g., buses or carpools)
    C: A dangerous intersection ahead
    D: A school zone
  answer: B
  explanation: The diamond symbol indicates a reserved lane, typically for buses,
    bicycles, or High Occupancy Vehicles (HOV).
- id: 226
  category: signs_and_signals
  question: When a driver extends their left arm out the window and points it straight
    up, which signal are they making?
  choices:
    A: Left turn
    B: Right turn
    C: Stopping or slowing down
    D: Yielding
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out and bent
    upward at the elbow.
- id: 227
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the roadway mean?
  choices:
    A: Passing is permitted in both directions
    B: Passing is permitted only during daylight hours
    C: Passing is prohibited in both directions
    D: One-way traffic only
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    traffic traveling in either direction.
- id: 228
  category: signs_and_signals
  question: 'In Nova Scotia, a traffic sign with an orange background and black symbols
    indicates:'
  choices:
    A: A regulatory requirement
    B: A school zone
    C: Construction or maintenance warning
    D: Directional information for tourists
  answer: C
  explanation: Orange signs are used specifically for construction and maintenance
    warnings to alert drivers to temporary road conditions.
- id: 229
  category: signs_and_signals
  question: What must you do when you see a 'Yield' sign at an intersection?
  choices:
    A: Stop completely every time
    B: Speed up to merge before other traffic
    C: Slow down and give the right-of-way to traffic in the intersection or on the
      intersecting road
    D: Ignore it if there are no other cars visible
  answer: C
  explanation: A yield sign requires you to slow down and be prepared to stop, giving
    the right-of-way to any vehicle or pedestrian in or approaching the intersection.
- id: 230
  category: signs_and_signals
  question: 'A flashing green light at an intersection in Nova Scotia (not a pedestrian-activated
    one) generally means:'
  choices:
    A: You have a protected left turn
    B: The light is about to turn red
    C: You may proceed straight, turn left, or turn right
    D: Emergency vehicles are approaching
  answer: C
  explanation: In Nova Scotia, a flashing green light (often called a 'stale' green
    or advanced green in other provinces) allows you to proceed straight or turn,
    but you must still yield to pedestrians and oncoming traffic if turning left unless
    a green arrow is present.
- id: 231
  category: signs_and_signals
  question: What does a broken (dotted) white line between two lanes of traffic mean?
  choices:
    A: Traffic is moving in opposite directions; passing is allowed
    B: Traffic is moving in the same direction; lane changing is permitted
    C: The lane is ending soon
    D: You must stop before crossing the line
  answer: B
  explanation: White lines separate traffic moving in the same direction. A broken
    white line indicates that lane changes are permitted when safe.
- id: 232
  category: signs_and_signals
  question: If you are approaching a railway crossing and the red lights are flashing,
    how far back must you stop your vehicle?
  choices:
    A: At least 1 metre from the nearest rail
    B: At least 5 metres from the nearest rail
    C: At least 15 metres from the nearest rail
    D: At least 30 metres from the nearest rail
  answer: B
  explanation: Under the Nova Scotia Motor Vehicle Act, when a signal device at a
    railroad crossing is giving warning, the driver must stop the vehicle at least
    five metres from the nearest rail.
- id: 233
  category: signs_and_signals
  question: 'A sign shaped like a pentagon (five-sided) with two people walking on
    it indicates:'
  choices:
    A: A playground area
    B: A hospital zone
    C: A school zone or school crosswalk
    D: A public park
  answer: C
  explanation: The pentagon-shaped sign is the standard warning sign for a school
    zone or school crossing.
- id: 234
  category: signs_and_signals
  question: 'When a traffic light turns from green to amber (yellow) as you approach
    an intersection, you should:'
  choices:
    A: Speed up to clear the intersection before the red light
    B: Stop if you can do so safely; otherwise, proceed with caution
    C: Always stop, even if you are in the middle of the intersection
    D: Honk your horn to warn others you are not stopping
  answer: B
  explanation: An amber light means the signal is about to turn red. You must stop
    if you can do so safely. If you are already in the intersection or too close to
    stop safely, you should proceed with caution.
