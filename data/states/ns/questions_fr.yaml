questions:
- id: 1
  category: license_system
  question: En Nouvelle-Écosse, quel est l'âge minimum pour demander un permis d'apprenti
    conducteur de classe 7 ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    '0': 17 ans
  answer: C
  explanation: En Nouvelle-Écosse, une personne doit avoir au moins 16 ans pour demander
    un permis d'apprenti conducteur de classe 7.
- id: 2
  category: license_system
  question: Une personne titulaire d'un permis d'apprenti conducteur de classe 7 doit
    être accompagnée d'un conducteur expérimenté. Quelles sont les exigences pour
    ce superviseur ?
  choices:
    A: Doit posséder un permis de classe 5 et être âgé d'au moins 19 ans
    B: Doit posséder un permis de classe 5 valide et ne pas être dans le programme
      GDL
    C: Doit avoir au moins 1 an d'expérience de conduite
    D: Doit être un membre de la famille possédant un permis valide
  answer: B
  explanation: Le conducteur superviseur doit détenir un permis de classe 5 valide
    (ou supérieur) et doit avoir terminé le programme de délivrance progressive des
    permis (GDL - Graduated Driver Licensing).
- id: 3
  category: license_system
  question: Pendant combien de temps un conducteur doit-il rester à l'étape d'apprenti
    (classe 7) avant de pouvoir passer un examen de conduite, s'il n'a PAS suivi de
    programme d'éducation routière reconnu ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 9 mois
    D: 12 mois
  answer: D
  explanation: La période d'attente standard pour l'étape d'apprenti est de 12 mois.
    Elle peut être réduite à 6 mois si le conducteur suit un cours d'éducation routière
    approuvé.
- id: 4
  category: license_system
  question: Quel est le taux d'alcoolémie (BAC) maximal autorisé pour un conducteur
    participant au programme de délivrance progressive des permis (GDL) de la Nouvelle-Écosse
    ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: La Nouvelle-Écosse applique une politique de tolérance zéro en matière
    d'alcool pour tous les conducteurs du programme GDL (étapes d'apprenti, de nouveau
    conducteur et de conducteur restreint).
- id: 5
  category: license_system
  question: Dans le cadre du programme GDL de la Nouvelle-Écosse, quel est le couvre-feu
    pour un conducteur « nouvellement titulaire d'un permis » (classe 5N) ?
  choices:
    A: Interdiction de conduire entre 22 h 00 et 6 h 00
    B: Interdiction de conduire entre 23 h 00 et 5 h 00
    C: Interdiction de conduire entre minuit et 5 h 00
    D: Il n'y a pas de couvre-feu pour les conducteurs de classe 5N
  answer: C
  explanation: Il est interdit aux nouveaux conducteurs (classe 5N) de conduire entre
    minuit et 5 h du matin, à moins d'être accompagnés d'un conducteur expérimenté
    ou de détenir une exemption écrite pour des raisons professionnelles.
- id: 6
  category: license_system
  question: Combien de points d'inaptitude entraînent la suspension du permis pour
    un conducteur participant au programme de délivrance progressive des permis (GDL)
    ?
  choices:
    A: 4 points
    B: 6 points
    C: 10 points
    D: 12 points
  answer: B
  explanation: En Nouvelle-Écosse, le permis d'un conducteur GDL est suspendu lorsqu'il
    accumule 6 points d'inaptitude. Pour les conducteurs titulaires d'un permis complet,
    le seuil est de 10 points.
- id: 7
  category: license_system
  question: Quelle est la durée de l'étape « nouvellement titulaire d'un permis »
    (classe 5N) en Nouvelle-Écosse ?
  choices:
    A: 12 mois
    B: 18 mois
    C: 24 mois
    D: 36 mois
  answer: C
  explanation: L'étape de nouveau conducteur (classe 5N) dure au minimum 24 mois de
    conduite prudente.
- id: 8
  category: license_system
  question: À l'étape « nouvellement titulaire d'un permis » (classe 5N), combien
    de passagers sont autorisés sur le siège avant du véhicule ?
  choices:
    A: Zéro
    B: Un
    C: Deux
    D: Autant qu'il y a de ceintures de sécurité
  answer: B
  explanation: Un nouveau conducteur est limité à un seul passager sur le siège avant,
    et le nombre total de passagers à l'arrière est limité par le nombre de ceintures
    de sécurité fonctionnelles.
- id: 9
  category: license_system
  question: Qu'advient-il du temps passé dans une étape du programme GDL si le permis
    d'un conducteur est suspendu ?
  choices:
    A: Le temps est mis en pause et reprend après la suspension
    B: Le conducteur doit attendre 6 mois supplémentaires
    C: Le temps passé dans cette étape est perdu et le conducteur doit recommencer
      l'étape depuis le début
    D: Le conducteur est définitivement banni du programme GDL
  answer: C
  explanation: Si un conducteur est suspendu alors qu'il est dans le programme GDL,
    il perd tout le crédit pour le temps déjà passé dans cette étape et doit recommencer
    la durée de cette étape depuis le début une fois la suspension levée.
- id: 10
  category: license_system
  question: Pour quitter le programme de délivrance progressive des permis et passer
    du statut de « conducteur restreint » (classe 5R) à un permis complet, que doit
    faire un conducteur ?
  choices:
    A: Passer un autre examen de conduite
    B: Suivre un cours de conduite préventive de 6 heures ou un programme complet
      d'éducation routière
    C: Attendre 5 ans de plus
    D: Payer des frais de sortie de 200 $
  answer: B
  explanation: Pour supprimer le statut de « conducteur restreint », le conducteur
    doit suivre un programme d'amélioration de la conduite reconnu (comme un cours
    de conduite préventive de 6 heures) et en fournir la preuve à Access Nouvelle-Écosse.
- id: 11
  category: license_system
  question: Quelle est la limite de taux d'alcoolémie (BAC) pour le conducteur expérimenté
    qui supervise un apprenti conducteur de classe 7 ?
  choices:
    A: 0,00 %
    B: 0,04 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: En Nouvelle-Écosse, le conducteur superviseur d'une personne titulaire
    d'un permis d'apprenti conducteur doit également maintenir un taux d'alcoolémie
    de 0,00 %.
- id: 12
  category: license_system
  question: 'Lorsque vous changez de nom ou d''adresse, vous devez en aviser le Bureau
    des véhicules automobiles (Registry of Motor Vehicles) dans un délai de :'
  choices:
    A: 10 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: La loi de la Nouvelle-Écosse exige que les conducteurs avisent le Bureau
    des véhicules automobiles dans les 30 jours suivant un changement de nom ou d'adresse.
- id: 13
  category: license_system
  question: Quelle est la sanction pour une condamnation pour une première infraction
    d'utilisation d'un téléphone cellulaire tenu à la main au volant en Nouvelle-Écosse
    ?
  choices:
    A: Une amende et 2 points d'inaptitude
    B: Une amende et 4 points d'inaptitude
    C: Une amende et 6 points d'inaptitude
    D: Une amende seulement, aucun point
  answer: B
  explanation: L'utilisation d'un appareil électronique tenu à la main en conduisant
    en Nouvelle-Écosse entraîne une amende importante et l'ajout de 4 points d'inaptitude
    à votre dossier.
- id: 14
  category: license_system
  question: Pendant combien de temps un permis d'apprenti conducteur de classe 7 est-il
    valide avant de devoir être renouvelé ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: D
  explanation: En Nouvelle-Écosse, un permis d'apprenti conducteur de classe 7 est
    valide pendant 5 ans.
- id: 15
  category: license_system
  question: Laquelle des conditions suivantes n'est PAS une exigence pour obtenir
    un permis d'apprenti conducteur de classe 7 ?
  choices:
    A: Réussir un examen de la vue
    B: Réussir un examen théorique écrit
    C: Avoir le consentement parental si vous avez moins de 18 ans
    D: Fournir une preuve d'assurance automobile à votre propre nom
  answer: D
  explanation: Bien que vous ayez besoin d'une assurance pour conduire un véhicule,
    vous n'avez pas besoin de fournir une preuve d'assurance automobile personnelle
    pour obtenir un permis d'apprenti conducteur. Vous devez réussir les examens de
    la vue et de connaissances, et avoir le consentement parental si vous avez moins
    de 18 ans.
- id: 16
  category: license_system
  question: Si vous êtes un visiteur en Nouvelle-Écosse, pendant combien de temps
    êtes-vous autorisé à conduire avec un permis de conduire valide d'une autre province
    ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 180 jours
  answer: C
  explanation: Selon le Guide du conducteur de la Nouvelle-Écosse, les visiteurs peuvent
    conduire dans la province pendant une période allant jusqu'à 90 jours avec un
    permis valide d'une autre province ou d'un autre pays.
- id: 17
  category: license_system
  question: Pendant combien de temps un conducteur titulaire d'un permis de classe
    5R (conducteur restreint) doit-il maintenir un taux d'alcoolémie de zéro ?
  choices:
    A: 1 an
    B: 2 ans
    C: Pendant toute la durée où il détient le statut 5R
    D: Seulement pendant les 6 premiers mois
  answer: C
  explanation: Le statut de « conducteur restreint » (classe 5R) est l'étape finale
    du programme de permis de conduire progressif (GDL). Ils doivent maintenir un
    taux d'alcoolémie de zéro en tout temps lorsqu'ils détiennent cette classification,
    qui dure 2 ans, à moins qu'un cours de conduite ne réduise l'étape précédente.
- id: 18
  category: license_system
  question: En Nouvelle-Écosse, combien de points d'inaptitude sont inscrits à votre
    dossier pour un excès de vitesse de 16 à 30 km/h au-dessus de la limite affichée
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Le système de points de la Nouvelle-Écosse attribue 2 points pour un
    excès de 1 à 15 km/h, 3 points pour 16 à 30 km/h, et 4 points pour plus de 30
    km/h au-dessus de la limite.
- id: 19
  category: license_system
  question: Si un conducteur du programme de permis de conduire progressif (GDL) est
    suspendu pour avoir accumulé 6 points d'inaptitude, quelle est la durée de la
    période de suspension ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 9 mois
    D: 12 mois
  answer: B
  explanation: En Nouvelle-Écosse, un conducteur GDL qui accumule 6 points d'inaptitude
    verra son privilège de conduire suspendu pour une période de 6 mois.
- id: 20
  category: license_system
  question: Quel est l'âge minimum requis pour demander un permis de conduire de classe
    4 (taxi, ambulance ou petit autobus) en Nouvelle-Écosse ?
  choices:
    A: 18 ans
    B: 19 ans
    C: 21 ans
    D: 25 ans
  answer: B
  explanation: Pour demander un permis de classe 4 en Nouvelle-Écosse, le demandeur
    doit être âgé d'au moins 19 ans.
- id: 21
  category: license_system
  question: Le « Numéro de maître » figurant sur un permis de conduire de la Nouvelle-Écosse
    est principalement basé sur quelles informations ?
  choices:
    A: Le numéro d'assurance sociale du conducteur
    B: La date de naissance et le nom du conducteur
    C: Une séquence aléatoire générée par le Bureau des véhicules automobiles
    D: Le code postal du domicile du conducteur
  answer: B
  explanation: Le numéro de maître est un identifiant unique créé à l'aide des cinq
    premières lettres du nom de famille et de la date de naissance du conducteur.
- id: 22
  category: license_system
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    pour avoir omis de s'arrêter devant un autobus scolaire dont les feux rouges clignotent
    ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire est considéré
    comme une infraction majeure en Nouvelle-Écosse et entraîne l'inscription de 6
    points d'inaptitude.
- id: 23
  category: license_system
  question: Combien de points d'inaptitude sont attribués pour avoir « suivi de trop
    près » (talonner) en Nouvelle-Écosse ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Suivre un autre véhicule de trop près entraîne l'ajout de 2 points
    d'inaptitude au dossier du conducteur en Nouvelle-Écosse.
- id: 24
  category: license_system
  question: Un permis de conduire standard de classe 5 de la Nouvelle-Écosse (non-GDL)
    est généralement valide pendant combien d'années avant d'expirer ?
  choices:
    A: 2 ans
    B: 3 ans
    C: 5 ans
    D: 10 ans
  answer: C
  explanation: Un permis de conduire régulier de la Nouvelle-Écosse est valide pour
    une période de 5 ans et expire le jour de l'anniversaire du conducteur.
- id: 25
  category: license_system
  question: Si vous devenez résident de la Nouvelle-Écosse, dans un délai de combien
    de jours devez-vous immatriculer tout véhicule que vous avez apporté dans la province
    ?
  choices:
    A: 15 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Les nouveaux résidents doivent immatriculer leurs véhicules auprès
    du Bureau des véhicules automobiles dans les 30 jours suivant leur établissement
    en Nouvelle-Écosse.
- id: 26
  category: license_system
  question: Une personne détenant un permis de classe 6L (apprenti conducteur de motocyclette)
    est soumise à laquelle des restrictions suivantes ?
  choices:
    A: Elle ne peut conduire que pendant les heures de clarté
    B: Elle ne peut transporter aucun passager
    C: Elle doit être accompagnée d'un autre motocycliste ayant 5 ans d'expérience
    D: A et B
  answer: D
  explanation: En Nouvelle-Écosse, les apprentis de classe 6L sont limités à la conduite
    de jour uniquement (une demi-heure avant le lever du soleil jusqu'à une demi-heure
    après le coucher du soleil) et il leur est strictement interdit de transporter
    des passagers.
- id: 27
  category: license_system
  question: À quel niveau de points un conducteur titulaire d'un permis complet (non-GDL)
    recevra-t-il une lettre d'avertissement du Bureau des véhicules automobiles ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Pour les conducteurs réguliers (non-GDL), le Bureau envoie une lettre
    d'avertissement dès que le conducteur a accumulé 4 points d'inaptitude.
- id: 28
  category: license_system
  question: Un conducteur titulaire d'un permis complet (non-GDL) en Nouvelle-Écosse
    verra son permis suspendu s'il accumule combien de points d'inaptitude ?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: Le permis d'un conducteur non-GDL est suspendu lorsqu'il accumule 10
    points d'inaptitude ou plus.
- id: 29
  category: license_system
  question: Quels sont les frais standard pour le rétablissement d'un permis de conduire
    qui a été suspendu pour une raison non médicale en Nouvelle-Écosse ?
  choices:
    A: 50,00 $
    B: 95,40 $
    C: 124,60 $
    D: 250,00 $
  answer: C
  explanation: Selon le barème des frais actuel de la Nouvelle-Écosse, les frais de
    rétablissement d'un permis de conduire suspendu sont de 124,60 $.
- id: 30
  category: license_system
  question: Quelle classe de permis est requise pour conduire un autobus d'une capacité
    d'accueil de 24 passagers ou moins ?
  choices:
    A: Classe 3
    B: Classe 4
    C: Classe 5
    D: Classe 2
  answer: B
  explanation: Un permis de classe 4 est requis en Nouvelle-Écosse pour conduire des
    autobus d'une capacité allant jusqu'à 24 passagers, ainsi que des taxis et des
    ambulances.
- id: 31
  category: driver_testing
  question: Pour réussir l'examen de la vue pour un permis de conduire de la Nouvelle-Écosse,
    quelle est l'acuité visuelle minimale requise dans au moins un œil ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Selon le Guide du conducteur de la Nouvelle-Écosse, un candidat doit
    avoir une acuité visuelle d'au moins 20/40 dans au moins un œil, avec ou sans
    lentilles correctrices.
- id: 32
  category: driver_testing
  question: Lors d'un examen de conduite en Nouvelle-Écosse, lequel des éléments suivants
    devez-vous fournir pour le véhicule que vous utilisez ?
  choices:
    A: Une vignette d'inspection des véhicules automobiles (MVI) valide
    B: Une carte d'assurance valide (carte rose)
    C: Un certificat d'immatriculation du véhicule valide
    D: Toutes ces réponses
  answer: D
  explanation: L'examinateur vérifiera l'immatriculation, l'assurance et la vignette
    d'inspection de sécurité avant le début de l'examen de conduite. Si l'un de ces
    documents manque, l'examen sera annulé.
- id: 33
  category: driver_testing
  question: 'L''examen théorique écrit de la Nouvelle-Écosse se compose de deux parties
    : la signalisation routière et les règles de la route. À combien de questions
    devez-vous répondre correctement dans chaque section pour réussir ?'
  choices:
    A: 14 sur 20
    B: 16 sur 20
    C: 18 sur 20
    D: 20 sur 20
  answer: B
  explanation: Pour réussir l'examen théorique de la Nouvelle-Écosse, vous devez identifier
    correctement 16 panneaux sur 20 et répondre correctement à 16 questions sur 20
    concernant les règles de la route.
- id: 34
  category: driver_testing
  question: En Nouvelle-Écosse, la « conduite acrobatique » (stunting) est définie
    comme le fait de conduire à combien de km/h au-dessus de la limite de vitesse
    affichée ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: En vertu de la loi sur les véhicules à moteur de la Nouvelle-Écosse
    (Motor Vehicle Act), la conduite acrobatique est définie comme le fait de rouler
    à 50 km/h ou plus au-dessus de la limite de vitesse affichée, ce qui entraîne
    une suspension immédiate du permis de 7 jours et la mise en fourrière du véhicule.
- id: 35
  category: driver_testing
  question: Selon la loi sur le corridor de sécurité (Move Over) de la Nouvelle-Écosse,
    lorsque vous dépassez un véhicule d'urgence arrêté avec ses gyrophares allumés,
    à quelle vitesse devez-vous ralentir (à moins que la limite affichée ne soit inférieure)
    ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: C
  explanation: Les conducteurs doivent ralentir à 60 km/h, ou respecter la limite
    de vitesse affichée si elle est inférieure à 60 km/h, lorsqu'ils dépassent des
    véhicules d'urgence ou des dépanneuses arrêtés sur le bord de la route avec leurs
    gyrophares allumés.
- id: 36
  category: driver_testing
  question: En Nouvelle-Écosse, quelle est la limite de vitesse dans une zone scolaire
    en présence d'enfants, si la limite de vitesse normale affichée est de 50 km/h
    ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 45 km/h
  answer: B
  explanation: En Nouvelle-Écosse, la limite de vitesse dans les zones scolaires est
    de 30 km/h en présence d'enfants si la limite de vitesse normale est de 50 km/h.
    Si la limite normale est supérieure à 50 km/h, la limite en zone scolaire est
    de 50 km/h.
- id: 37
  category: driver_testing
  question: Si un conducteur titulaire d'un permis complet en Nouvelle-Écosse est
    pris avec un taux d'alcoolémie (BAC) compris entre 0,05 et 0,08 pour la première
    fois, quelle est la durée de la suspension administrative immédiate du permis
    ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 15 jours
    D: 30 jours
  answer: B
  explanation: La Nouvelle-Écosse dispose d'un programme de suspension administrative
    du permis (ALS) où un premier taux d'alcoolémie compris entre 0,05 et 0,08 entraîne
    une suspension immédiate du permis de 7 jours.
- id: 38
  category: driver_testing
  question: Si vous échouez à votre examen de conduite en Nouvelle-Écosse, combien
    de temps devez-vous attendre avant de pouvoir repasser l'examen ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 7 jours
    D: 14 jours
  answer: C
  explanation: Si vous échouez à l'examen de conduite, vous devez attendre au moins
    7 jours avant de pouvoir tenter l'examen à nouveau, et vous devez payer pour un
    nouveau reçu d'examen de conduite.
- id: 39
  category: driver_testing
  question: Lorsque vous achetez un véhicule à un particulier en Nouvelle-Écosse,
    dans quel délai devez-vous transférer la propriété et immatriculer le véhicule
    ?
  choices:
    A: 10 jours
    B: 15 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: La loi sur les véhicules à moteur de la Nouvelle-Écosse exige que le
    transfert de propriété soit effectué au Bureau des véhicules automobiles dans
    les 30 jours suivant la vente.
- id: 40
  category: driver_testing
  question: Combien de points d'inaptitude sont attribués à un conducteur qui ne porte
    pas sa ceinture de sécurité en Nouvelle-Écosse ?
  choices:
    A: 0 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: En Nouvelle-Écosse, une condamnation pour défaut de port de la ceinture
    de sécurité entraîne l'inscription de 2 points d'inaptitude à votre dossier de
    conduite.
- id: 41
  category: driver_testing
  question: En Nouvelle-Écosse, entre quelles dates l'utilisation de pneus cloutés
    est-elle autorisée sur les véhicules ?
  choices:
    A: Du 1er novembre au 1er avril
    B: Du 15 octobre au 31 mai
    C: Du 1er décembre au 31 mars
    D: Du 1er octobre au 30 avril
  answer: B
  explanation: Les pneus cloutés sont autorisés sur les routes de la Nouvelle-Écosse
    du 15 octobre au 31 mai de chaque année.
- id: 42
  category: driver_testing
  question: En Nouvelle-Écosse, il est illégal de garer votre véhicule à moins de
    combien de mètres d'un passage pour piétons ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Selon la Loi sur les véhicules automobiles de la Nouvelle-Écosse, il
    est interdit de se garer à moins de 5 mètres d'un passage pour piétons.
- id: 43
  category: driver_testing
  question: Lorsque vous conduisez de nuit, vous devez passer des feux de route aux
    feux de croisement lorsque vous vous trouvez à moins de combien de mètres d'un
    véhicule venant en sens inverse ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Le Guide du conducteur de la Nouvelle-Écosse stipule que vous devez
    passer aux feux de croisement lorsqu'un véhicule venant en sens inverse se trouve
    à moins de 150 mètres.
- id: 44
  category: driver_testing
  question: 'Pour satisfaire aux normes de vision pour l''obtention d''un permis de
    conduire en Nouvelle-Écosse, l''acuité visuelle d''un candidat doit être d''au
    moins :'
  choices:
    A: 20/20 dans les deux yeux
    B: 20/40 dans au moins un œil
    C: 20/50 dans les deux yeux
    D: 20/30 dans l'œil dominant
  answer: B
  explanation: Selon le Guide du conducteur de la Nouvelle-Écosse, un candidat doit
    avoir une acuité visuelle d'au moins 20/40 dans au moins un œil, avec ou sans
    lentilles correctrices.
- id: 45
  category: driver_testing
  question: Lors de l'examen pratique en Nouvelle-Écosse, laquelle des conditions
    suivantes n'est PAS requise pour le véhicule fourni par le candidat ?
  choices:
    A: Une vignette d'inspection des véhicules automobiles (MVI) valide
    B: Une preuve d'assurance et d'immatriculation valides
    C: Une double commande de frein pour l'examinateur
    D: Des clignotants et des feux de freinage fonctionnels
  answer: C
  explanation: Bien que le véhicule doive être en bon état mécanique, posséder une
    vignette MVI valide et être correctement assuré et immatriculé, la double commande
    de frein n'est pas requise pour un examen pratique standard de classe 5.
- id: 46
  category: driver_testing
  question: Si vous échouez à votre premier examen pratique en Nouvelle-Écosse, quel
    est le délai d'attente minimal avant de pouvoir repasser l'examen ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 7 jours
    D: 14 jours
  answer: C
  explanation: En Nouvelle-Écosse, si vous échouez à votre premier examen pratique,
    vous devez attendre au moins 7 jours avant de pouvoir tenter l'examen à nouveau.
- id: 47
  category: driver_testing
  question: 'L''examen théorique écrit de la Nouvelle-Écosse se compose de deux parties
    : la signalisation routière et les règles de la route. Quel est le score minimal
    de passage pour chaque section ?'
  choices:
    A: 15 sur 20
    B: 16 sur 20
    C: 18 sur 20
    D: 20 sur 20
  answer: B
  explanation: Pour réussir l'examen théorique en Nouvelle-Écosse, vous devez répondre
    correctement à au moins 16 questions sur 20 (80 %) dans chacune des deux sections.
- id: 48
  category: driver_testing
  question: En Nouvelle-Écosse, un permis de conduire de classe 8 est spécifiquement
    destiné à la conduite de quel type de véhicule ?
  choices:
    A: Motocyclettes
    B: Ciclomoteurs
    C: Tracteurs agricoles
    D: Motoneiges
  answer: C
  explanation: Un permis de classe 8 en Nouvelle-Écosse est un permis spécialisé qui
    autorise uniquement la conduite de tracteurs agricoles.
- id: 49
  category: driver_testing
  question: Combien de points d'inaptitude peuvent être retirés du dossier de conduite
    de la Nouvelle-Écosse si un conducteur suit avec succès un cours de conduite préventive
    agréé ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: La Nouvelle-Écosse permet aux conducteurs de faire retirer jusqu'à
    2 points d'inaptitude de leur dossier une fois tous les cinq ans après avoir réussi
    un cours de conduite préventive reconnu.
- id: 50
  category: driver_testing
  question: En vertu de la Loi sur les véhicules automobiles de la Nouvelle-Écosse,
    qui est légalement tenu de signaler un patient au registraire des véhicules automobiles
    s'il présente un problème de santé rendant sa conduite dangereuse ?
  choices:
    A: L'employeur du patient
    B: Le plus proche parent du patient
    C: Tout professionnel de la santé qualifié (médecin ou optométriste)
    D: Le service de police local
  answer: C
  explanation: En Nouvelle-Écosse, les médecins et les optométristes ont l'obligation
    légale de signaler toute personne atteinte d'une condition qui pourrait rendre
    dangereuse la conduite d'un véhicule à moteur.
- id: 51
  category: driver_testing
  question: Pour la plupart des véhicules de tourisme privés en Nouvelle-Écosse, à
    quelle fréquence une inspection formelle des véhicules automobiles (MVI) doit-elle
    être effectuée ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Uniquement lors de la vente du véhicule
  answer: B
  explanation: En Nouvelle-Écosse, la plupart des véhicules de tourisme nécessitent
    une inspection de sécurité (MVI) tous les deux ans.
- id: 52
  category: driver_testing
  question: Quel est le montant minimum de la couverture d'assurance responsabilité
    civile (Third-Party Liability) requis par la loi pour un véhicule à moteur en
    Nouvelle-Écosse ?
  choices:
    A: 200 000 $
    B: 500 000 $
    C: 1 000 000 $
    D: 50 000 $
  answer: B
  explanation: La loi de la Nouvelle-Écosse exige que tous les véhicules à moteur
    soient couverts par un minimum de 500 000 $ en assurance responsabilité civile.
- id: 53
  category: driver_testing
  question: À l'approche d'un véhicule d'urgence arrêté avec ses gyrophares allumés
    sur une autoroute de la Nouvelle-Écosse, à quelle vitesse les conducteurs doivent-ils
    ralentir si la limite affichée est de 100 km/h ?
  choices:
    A: 80 km/h
    B: 70 km/h
    C: 60 km/h
    D: 50 km/h
  answer: C
  explanation: La loi « Move Over » (se tasser) de la Nouvelle-Écosse exige que les
    conducteurs ralentissent à 60 km/h (ou à la limite affichée si elle est inférieure
    à 60 km/h) lorsqu'ils dépassent des véhicules d'urgence dont les feux clignotent.
- id: 54
  category: driver_testing
  question: En Nouvelle-Écosse, lorsqu'un autobus de transport en commun a signalé
    son intention de quitter une baie d'autobus ou le bord de la route, quelle est
    l'obligation du conducteur ?
  choices:
    A: Maintenir sa vitesse ; l'autobus doit attendre une brèche
    B: Céder le passage à l'autobus
    C: Klaxonner pour avertir le chauffeur de l'autobus de votre présence
    D: Ne céder le passage que s'il y a plus de deux voies de circulation
  answer: B
  explanation: La loi de la Nouvelle-Écosse exige que les conducteurs cèdent le passage
    à un autobus de transport en commun qui signale son intention de réintégrer la
    circulation à partir d'un arrêt ou d'une baie d'autobus.
- id: 55
  category: driver_responsibility
  question: 'En Nouvelle-Écosse, vous devez signaler une collision à la police ou
    au Bureau des véhicules automobiles si les dommages matériels totaux sont estimés
    à au moins :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: Selon la loi sur les véhicules automobiles de la Nouvelle-Écosse (Motor
    Vehicle Act), toute collision impliquant un décès, des blessures ou des dommages
    matériels de 2 000 $ ou plus doit être signalée immédiatement au poste de police
    le plus proche.
- id: 56
  category: driver_responsibility
  question: Lorsque vous vendez un véhicule en Nouvelle-Écosse, que devez-vous faire
    des plaques d'immatriculation ?
  choices:
    A: Les laisser sur le véhicule pour le nouveau propriétaire.
    B: Les retourner au Bureau des véhicules automobiles ou les conserver pour votre
      prochain véhicule.
    C: Les détruire immédiatement.
    D: Les remettre à la police.
  answer: B
  explanation: En Nouvelle-Écosse, les plaques d'immatriculation appartiennent au
    propriétaire et non au véhicule. Lorsqu'un véhicule est vendu, les plaques doivent
    être retirées par le vendeur.
- id: 57
  category: driver_responsibility
  question: Après l'achat d'un véhicule auprès d'un vendeur privé, de combien de jours
    disposez-vous pour transférer l'immatriculation à votre nom ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: La loi sur les véhicules automobiles de la Nouvelle-Écosse exige que
    l'acheteur d'un véhicule d'occasion transfère l'immatriculation dans les 30 jours
    suivant la date de la vente.
- id: 58
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision avec un véhicule sans surveillance
    et que vous ne trouvez pas le propriétaire, quelle est votre responsabilité légale
    ?
  choices:
    A: Attendre 30 minutes, puis partir si personne ne se présente.
    B: Se rendre au poste de police le plus proche dans les 48 heures.
    C: Laisser un avis écrit avec votre nom, votre adresse et votre numéro de plaque
      dans un endroit bien en vue sur le véhicule.
    D: Aucune action n'est requise si les dommages sont inférieurs à 500 $.
  answer: C
  explanation: Si vous heurtez un véhicule sans surveillance, vous devez localiser
    le propriétaire ou laisser une note avec vos coordonnées et les informations sur
    votre véhicule dans un endroit visible sur le véhicule percuté.
- id: 59
  category: driver_responsibility
  question: En Nouvelle-Écosse, à quelle fréquence un véhicule de tourisme doit-il
    subir une inspection de sécurité (MVI) après sa période initiale d'inspection
    de voiture neuve ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Uniquement lors de la vente du véhicule
  answer: B
  explanation: Pour la plupart des véhicules de tourisme privés en Nouvelle-Écosse,
    une inspection des véhicules automobiles (MVI) est requise tous les deux ans.
- id: 60
  category: driver_responsibility
  question: Qui est légalement responsable de s'assurer qu'un passager de moins de
    16 ans porte sa ceinture de sécurité ou se trouve dans un système de retenue pour
    enfants approprié ?
  choices:
    A: Le passager
    B: Les parents du passager (même s'ils ne sont pas dans la voiture)
    C: Le conducteur du véhicule
    D: Le propriétaire du véhicule
  answer: C
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 16 ans sont correctement attachés. Si ce n'est pas le cas, le conducteur
    peut recevoir une amende et des points d'inaptitude.
- id: 61
  category: driver_responsibility
  question: Quelle est la sanction pour une première condamnation pour conduite sans
    assurance automobile valide en Nouvelle-Écosse ?
  choices:
    A: Une amende de 100 $ et 1 point d'inaptitude.
    B: Une amende d'environ 1 200 $ à 2 000 $ et une suspension du permis.
    C: Un avertissement verbal et un délai de grâce de 7 jours pour obtenir une assurance.
    D: Le véhicule est définitivement saisi par la Couronne.
  answer: B
  explanation: Conduire sans assurance est une infraction grave en Nouvelle-Écosse,
    entraînant de lourdes amendes (dépassant souvent 1 200 $ pour une première infraction)
    et une suspension automatique du permis de conduire.
- id: 62
  category: driver_responsibility
  question: Combien de points d'inaptitude sont inscrits à votre dossier de conduite
    pour « défaut de rester sur les lieux d'un accident » ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Le fait de ne pas rester sur les lieux d'un accident est une infraction
    majeure qui entraîne l'ajout de 6 points d'inaptitude au dossier du conducteur
    en Nouvelle-Écosse.
- id: 63
  category: driver_responsibility
  question: 'Lorsqu''un véhicule d''urgence (police, pompiers ou ambulance) est arrêté
    sur la route avec ses gyrophares allumés, la loi de la Nouvelle-Écosse sur le
    corridor de sécurité (« Move Over ») vous oblige à :'
  choices:
    A: Maintenir votre vitesse mais klaxonner pour alerter les secouristes.
    B: S'arrêter immédiatement dans votre voie.
    C: Ralentir à une vitesse sécuritaire et changer de voie vers la gauche si cela
      peut se faire en toute sécurité.
    D: Accélérer pour quitter la zone le plus rapidement possible.
  answer: C
  explanation: La loi sur le corridor de sécurité de la Nouvelle-Écosse exige que
    les conducteurs ralentissent à une vitesse sécuritaire et, s'il y a deux voies
    ou plus dans la même direction, qu'ils changent de voie pour s'éloigner du véhicule
    d'urgence arrêté si la manœuvre est sécuritaire.
- id: 64
  category: driver_responsibility
  question: En Nouvelle-Écosse, où doit être conservé le permis de circulation (immatriculation)
    du véhicule ?
  choices:
    A: À la résidence du propriétaire, dans un endroit sûr.
    B: Dans le véhicule en tout temps lorsqu'il est utilisé.
    C: Au Bureau des véhicules automobiles.
    D: Dans le portefeuille du conducteur en tout temps, même lorsqu'il ne conduit
      pas.
  answer: B
  explanation: Le permis de circulation du véhicule ou une copie conforme doit se
    trouver dans le véhicule en tout temps lorsqu'il circule sur une voie publique.
- id: 65
  category: driver_responsibility
  question: 'Si vous êtes reconnu coupable d''avoir jeté des déchets depuis un véhicule
    à moteur sur une route de la Nouvelle-Écosse, l''amende peut s''élever jusqu''à
    :'
  choices:
    A: 50 $
    B: 100 $
    C: 500 $
    D: 1 000 $
  answer: C
  explanation: En vertu de la loi sur les véhicules à moteur (Motor Vehicle Act),
    jeter des déchets depuis un véhicule est une infraction passible d'une amende
    pouvant aller jusqu'à 500 $.
- id: 66
  category: driver_responsibility
  question: Quel document devez-vous présenter lorsqu'un agent de la paix exige une
    preuve de responsabilité financière ?
  choices:
    A: Votre certificat de naissance.
    B: Une carte d'assurance responsabilité civile automobile valide (carte rose).
    C: L'acte de vente de votre véhicule.
    D: Un relevé bancaire montrant au moins 5 000 $.
  answer: B
  explanation: La « carte rose » est la preuve standard d'assurance en Nouvelle-Écosse
    et doit être présentée à la demande d'un agent de la paix.
- id: 67
  category: driver_responsibility
  question: Si vous déménagez en Nouvelle-Écosse en provenance d'une autre province,
    de combien de temps disposez-vous pour immatriculer votre véhicule en Nouvelle-Écosse
    ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 6 mois
  answer: A
  explanation: Les nouveaux résidents de la Nouvelle-Écosse doivent immatriculer leurs
    véhicules auprès du Bureau des véhicules automobiles dans les 30 jours suivant
    l'établissement de leur résidence.
- id: 68
  category: driver_responsibility
  question: Lorsqu'un véhicule est vendu par un particulier en Nouvelle-Écosse, qui
    est responsable de retirer les plaques d'immatriculation du véhicule ?
  choices:
    A: L'acheteur
    B: Le vendeur
    C: Le Bureau des véhicules automobiles
    D: Les plaques restent avec le véhicule
  answer: B
  explanation: En Nouvelle-Écosse, les plaques d'immatriculation appartiennent au
    propriétaire et non au véhicule. Le vendeur doit retirer ses plaques avant que
    l'acheteur ne prenne possession du véhicule.
- id: 69
  category: driver_responsibility
  question: De combien de temps dispose un nouveau résident de la Nouvelle-Écosse
    pour immatriculer son véhicule provenant d'une autre province après son arrivée
    dans la province ?
  choices:
    A: 10 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Les nouveaux résidents doivent immatriculer leurs véhicules auprès
    du Bureau des véhicules automobiles de la Nouvelle-Écosse dans les 30 jours suivant
    leur installation.
- id: 70
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision où quelqu'un est blessé, quelle
    est votre première responsabilité légale ?
  choices:
    A: Appeler votre agent d'assurance
    B: Prendre des photos de la scène
    C: S'arrêter et porter toute l'assistance possible
    D: Conduire jusqu'au poste de police le plus proche
  answer: C
  explanation: En vertu de la loi sur les véhicules à moteur (Motor Vehicle Act),
    vous devez vous arrêter sur les lieux d'une collision et fournir une assistance
    raisonnable à toute personne blessée.
- id: 71
  category: driver_responsibility
  question: 'Lorsque vous achetez un véhicule à un particulier, vous devez effectuer
    le transfert de propriété au Bureau des véhicules automobiles (Registry of Motor
    Vehicles) dans un délai de :'
  choices:
    A: 24 heures
    B: 10 jours
    C: 30 jours
    D: 6 mois
  answer: C
  explanation: L'acheteur d'un véhicule d'occasion doit demander un transfert de propriété
    et un nouveau certificat d'immatriculation dans les 30 jours suivant la date d'achat.
- id: 72
  category: driver_responsibility
  question: Si un agent de police le demande, quels documents un conducteur doit-il
    présenter ?
  choices:
    A: Le permis de conduire uniquement
    B: Le permis de conduire et le certificat d'immatriculation du véhicule uniquement
    C: Le permis de conduire, le certificat d'immatriculation du véhicule et une carte
      d'assurance responsabilité civile automobile valide
    D: Le permis de conduire et le certificat de naissance
  answer: C
  explanation: Les conducteurs doivent être en mesure de présenter leur permis, le
    certificat d'immatriculation du véhicule et une preuve d'assurance valide (la
    « carte rose ») à la demande d'un agent de la paix.
- id: 73
  category: driver_responsibility
  question: En Nouvelle-Écosse, si votre taux d'alcoolémie (BAC) se situe dans la
    « zone d'avertissement » (0,05 à 0,08), quelle est la durée de la suspension administrative
    immédiate du permis pour une première infraction ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: Un conducteur dont le taux d'alcoolémie (BAC) se situe entre 0,05 et
    0,08 s'expose à une suspension administrative immédiate de son permis de 7 jours
    pour une première infraction.
- id: 74
  category: driver_responsibility
  question: Si vous échouez à un test d'alcootest (BAC supérieur à 0,08) ou si vous
    refusez de fournir un échantillon, pendant combien de temps votre permis sera-t-il
    suspendu administrativement avant votre date de comparution au tribunal ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: D
  explanation: En Nouvelle-Écosse, l'échec à un alcootest ou le refus de fournir un
    échantillon entraîne une suspension administrative automatique et immédiate du
    permis de 90 jours.
- id: 75
  category: driver_responsibility
  question: Que doit fournir le vendeur d'un véhicule au Bureau des véhicules automobiles
    immédiatement après une vente ?
  choices:
    A: Le moteur du véhicule
    B: Les plaques d'immatriculation
    C: Un avis de vente rempli (situé au verso du certificat d'immatriculation)
    D: Une copie de l'assurance de l'acheteur
  answer: C
  explanation: Pour se protéger de toute responsabilité, le vendeur doit remplir la
    partie « Avis de vente » du certificat d'immatriculation et la retourner immédiatement
    au Bureau des véhicules automobiles.
- id: 76
  category: driver_responsibility
  question: Si vous êtes impliqué dans une collision mineure sans blessés et que les
    véhicules bloquent la circulation, que devez-vous faire ?
  choices:
    A: Laisser les véhicules exactement là où ils se trouvent jusqu'à l'arrivée de
      la police
    B: Déplacer les véhicules hors de la chaussée vers un endroit sûr si cela peut
      être fait en toute sécurité
    C: Abandonner les véhicules et marcher jusqu'à un téléphone
    D: Attendre une dépanneuse avant de déplacer quoi que ce soit
  answer: B
  explanation: S'il n'y a pas de blessés et que les véhicules sont en état de marche,
    vous devez les déplacer hors de la partie circulable de la route pour éviter d'autres
    collisions et l'encombrement de la circulation.
- id: 77
  category: driver_responsibility
  question: Qu'advient-il de votre permis de conduire si vous ne payez pas un jugement
    ordonné par le tribunal pour des dommages résultant d'une collision de véhicule
    à moteur ?
  choices:
    A: Rien, c'est une affaire civile
    B: On vous attribue 6 points d'inaptitude
    C: Votre permis est suspendu jusqu'à ce que le jugement soit payé ou réglé
    D: Vous devez repasser votre examen de conduite
  answer: C
  explanation: En vertu des lois sur la responsabilité financière de la Nouvelle-Écosse,
    le Bureau des véhicules automobiles suspendra le permis de tout conducteur qui
    ne satisfait pas à un jugement pour dommages matériels ou blessures corporelles.
- id: 78
  category: driver_responsibility
  question: 'Si vous heurtez un véhicule sans surveillance et que vous ne trouvez
    pas le propriétaire, vous devez :'
  choices:
    A: Partir s'il n'y a pas de dommages
    B: Laisser un avis écrit avec votre nom, votre adresse et votre numéro de plaque
      dans un endroit bien en vue sur le véhicule
    C: Attendre 24 heures sur les lieux
    D: Ne le signaler que si les dommages dépassent 5 000 $
  answer: B
  explanation: La loi vous oblige à informer le propriétaire des biens que vous avez
    endommagés. S'il est introuvable, vous devez laisser une note avec vos coordonnées
    et les informations sur votre véhicule.
- id: 79
  category: safe_driving_rules
  question: Selon la loi sur les véhicules à moteur de la Nouvelle-Écosse (Motor Vehicle
    Act), quelle est la distance minimale à respecter pour se stationner par rapport
    à une borne d'incendie ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: Il est interdit de stationner un véhicule à moins de 5 mètres d'une
    borne d'incendie en Nouvelle-Écosse.
- id: 80
  category: safe_driving_rules
  question: 'En Nouvelle-Écosse, vous devez vous arrêter pour un autobus scolaire
    dont les feux rouges clignotent et dont le bras d''arrêt est déployé, SAUF lorsque
    :'
  choices:
    A: Vous circulez dans la direction opposée sur une route à chaussées séparées
    B: Vous circulez dans la même direction sur une route à plusieurs voies
    C: L'autobus est arrêté dans une zone désignée « sans arrêt »
    D: Vous êtes à plus de 10 mètres de l'autobus
  answer: A
  explanation: Sur une route à chaussées séparées (où il y a un terre-plein ou une
    barrière), les conducteurs circulant dans la direction opposée à un autobus scolaire
    n'ont pas à s'arrêter. Les conducteurs circulant dans la même direction doivent
    toujours s'arrêter.
- id: 81
  category: safe_driving_rules
  question: Quelle est la distance minimale à respecter pour se stationner près d'un
    passage pour piétons ou d'un panneau d'arrêt en Nouvelle-Écosse ?
  choices:
    A: 5 mètres d'un passage pour piétons et 10 mètres d'un panneau d'arrêt
    B: 2 mètres d'un passage pour piétons et 5 mètres d'un panneau d'arrêt
    C: 10 mètres d'un passage pour piétons et 15 mètres d'un panneau d'arrêt
    D: 3 mètres pour les deux
  answer: A
  explanation: En Nouvelle-Écosse, il est interdit de se stationner à moins de 5 mètres
    d'un passage pour piétons ou à moins de 10 mètres d'un panneau d'arrêt ou d'un
    signal de contrôle de la circulation.
- id: 82
  category: safe_driving_rules
  question: Selon la loi de la Nouvelle-Écosse, la « conduite acrobatique » (stunting)
    est définie comme le fait de circuler à quelle vitesse au-dessus de la limite
    affichée ?
  choices:
    A: 30 km/h ou plus
    B: 40 km/h ou plus
    C: 50 km/h ou plus
    D: 60 km/h ou plus
  answer: C
  explanation: La conduite acrobatique (stunting) est définie comme le fait de circuler
    à 50 km/h ou plus au-dessus de la limite de vitesse affichée. Elle entraîne une
    amende importante, 6 points d'inaptitude et une suspension immédiate du permis
    de 7 jours.
- id: 83
  category: safe_driving_rules
  question: 'Lorsque vous conduisez de nuit, vous devez passer des feux de route aux
    feux de croisement lorsqu''un véhicule arrivant en sens inverse se trouve à moins
    de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: La loi de la Nouvelle-Écosse exige que les conducteurs passent des
    feux de route aux feux de croisement lorsqu'un véhicule arrivant en sens inverse
    se trouve à moins de 150 mètres.
- id: 84
  category: safe_driving_rules
  question: Dans un carrefour giratoire en Nouvelle-Écosse, quel véhicule a la priorité
    ?
  choices:
    A: Le véhicule entrant dans le carrefour giratoire
    B: Le véhicule déjà engagé dans le carrefour giratoire
    C: Le véhicule circulant à la vitesse la plus élevée
    D: Le véhicule entrant par la droite
  answer: B
  explanation: Les véhicules entrant dans un carrefour giratoire doivent céder le
    passage aux véhicules qui circulent déjà à l'intérieur du carrefour.
- id: 85
  category: safe_driving_rules
  question: Lorsque deux véhicules arrivent à une intersection non contrôlée (sans
    panneaux ni signaux) à peu près en même temps, qui doit céder le passage ?
  choices:
    A: Le conducteur à gauche doit céder le passage au conducteur à droite
    B: Le conducteur à droite doit céder le passage au conducteur à gauche
    C: Le conducteur sur la plus petite route doit céder le passage
    D: Le conducteur tournant à gauche doit céder le passage à tous les autres véhicules
  answer: A
  explanation: À une intersection non contrôlée, le conducteur du véhicule à gauche
    doit céder le passage au véhicule situé à sa droite.
- id: 86
  category: safe_driving_rules
  question: Quelle est la distance de sécurité recommandée derrière un autre véhicule
    dans des conditions de conduite normales en Nouvelle-Écosse ?
  choices:
    A: La longueur d'une voiture
    B: Deux secondes
    C: Trois secondes
    D: Four secondes
  answer: B
  explanation: Le Guide du conducteur de la Nouvelle-Écosse recommande une distance
    de suivi minimale d'au moins deux secondes derrière le véhicule qui vous précède.
- id: 87
  category: safe_driving_rules
  question: 'En Nouvelle-Écosse, vous n''êtes autorisé à dépasser un véhicule par
    la droite que si :'
  choices:
    A: Le véhicule devant effectue un virage à gauche et qu'un accotement pavé ou
      une voie est disponible
    B: Vous êtes pressé et le véhicule devant est lent
    C: La route est un chemin de gravier suffisamment large
    D: Le dépassement par la droite n'est jamais autorisé
  answer: A
  explanation: Vous ne pouvez dépasser par la droite que lorsque le véhicule dépassé
    effectue ou est sur le point d'effectuer un virage à gauche et que la manœuvre
    peut être faite en toute sécurité sur la chaussée.
- id: 88
  category: safe_driving_rules
  question: Lors du stationnement d'un véhicule en montée sur une rue à double sens
    avec une bordure de trottoir, comment les roues avant doivent-elles être tournées
    ?
  choices:
    A: Vers la bordure
    B: À l'opposé de la bordure
    C: Parallèlement à la bordure
    D: Cela n'a pas d'importance
  answer: B
  explanation: Lors d'un stationnement en montée avec une bordure, tournez vos roues
    à l'opposé de la bordure (vers la gauche) de sorte que si le véhicule recule,
    l'arrière du pneu frappe la bordure et arrête la voiture.
- id: 89
  category: safe_driving_rules
  question: 'Un demi-tour est interdit en Nouvelle-Écosse lorsque vous ne pouvez pas
    voir clairement dans les deux directions sur au moins :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Vous ne devez pas effectuer de demi-tour dans une courbe ou près du
    sommet d'une côte où vous ne pouvez pas être vu par les autres conducteurs arrivant
    de l'une ou l'autre direction à moins de 150 mètres.
- id: 90
  category: safe_driving_rules
  question: À l'approche d'un passage à niveau et lorsque les signaux clignotent,
    à quelle distance minimale du rail le plus proche devez-vous arrêter votre véhicule
    ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Lorsqu'un train approche, vous devez vous arrêter à au moins 5 mètres
    du rail le plus proche du passage à niveau.
- id: 91
  category: safe_driving_rules
  question: Selon le Guide du conducteur de la Nouvelle-Écosse, à quelle distance
    d'une borne d'incendie devez-vous vous stationner ?
  choices:
    A: 2 mètres
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: C
  explanation: En Nouvelle-Écosse, il est illégal de stationner un véhicule à moins
    de 5 mètres d'une borne d'incendie.
- id: 92
  category: safe_driving_rules
  question: Lorsque vous entrez dans un carrefour giratoire en Nouvelle-Écosse, qui
    a la priorité ?
  choices:
    A: La circulation entrant dans le carrefour giratoire
    B: La circulation déjà engagée dans le carrefour giratoire
    C: Le véhicule circulant à la vitesse la plus élevée
    D: Le véhicule entrant par la droite
  answer: B
  explanation: En Nouvelle-Écosse, les conducteurs qui entrent dans un carrefour giratoire
    doivent céder le passage aux véhicules qui y circulent déjà.
- id: 93
  category: safe_driving_rules
  question: En Nouvelle-Écosse, il est interdit de se stationner à moins de combien
    de mètres d'un panneau d'arrêt ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: B
  explanation: Selon la loi de la Nouvelle-Écosse, vous ne devez pas stationner votre
    véhicule à moins de 10 mètres d'un panneau d'arrêt ou d'un signal de contrôle
    de la circulation.
- id: 94
  category: safe_driving_rules
  question: À moins qu'une signalisation ne l'interdise, quand êtes-vous autorisé
    à tourner à gauche au feu rouge en Nouvelle-Écosse ?
  choices:
    A: Jamais
    B: D'une rue à sens unique vers une autre rue à sens unique après un arrêt complet
    C: D'une rue à double sens vers une rue à sens unique
    D: Chaque fois qu'il n'y a pas de circulation en sens inverse
  answer: B
  explanation: En Nouvelle-Écosse, vous pouvez tourner à gauche au feu rouge uniquement
    si vous passez d'une rue à sens unique à une autre rue à sens unique, à condition
    d'avoir marqué un arrêt complet et d'avoir cédé le passage aux piétons et aux
    autres véhicules.
- id: 95
  category: safe_driving_rules
  question: Quelle est la limite de vitesse par défaut dans un quartier commercial
    ou résidentiel en Nouvelle-Écosse si aucune limite n'est affichée ?
  choices:
    A: 40 km/h
    B: 50 km/h
    C: 60 km/h
    D: 70 km/h
  answer: B
  explanation: La loi sur les véhicules à moteur de la Nouvelle-Écosse fixe la limite
    de vitesse par défaut à 50 km/h dans tout quartier commercial ou résidentiel,
    sauf indication contraire.
- id: 96
  category: safe_driving_rules
  question: Que signifie une double ligne jaune continue au centre de la route en
    Nouvelle-Écosse ?
  choices:
    A: Le dépassement est autorisé si la sécurité le permet
    B: Le dépassement est autorisé uniquement pendant la journée
    C: Le dépassement est interdit pour la circulation dans les deux sens
    D: Circulation à sens unique uniquement
  answer: C
  explanation: Une double ligne jaune continue signifie que le dépassement est interdit
    pour les véhicules circulant dans les deux sens.
- id: 97
  category: safe_driving_rules
  question: En Nouvelle-Écosse, qu'advient-il des amendes pour excès de vitesse dans
    une zone de travaux désignée lorsque des travailleurs sont présents ?
  choices:
    A: Les amendes sont triplées
    B: Les amendes sont doublées
    C: Les amendes sont réduites si vous présentez des excuses
    D: Les amendes restent les mêmes mais les points sont doublés
  answer: B
  explanation: En Nouvelle-Écosse, les amendes pour excès de vitesse sont doublées
    pour les infractions commises dans les zones de travaux lorsque des travailleurs
    sont présents.
- id: 98
  category: safe_driving_rules
  question: 'Pour maintenir une distance de sécurité derrière le véhicule qui vous
    précède dans des conditions normales, le Guide du conducteur de la Nouvelle-Écosse
    recommande :'
  choices:
    A: Une distance de suivi d'une seconde
    B: Une distance de suivi de deux secondes
    C: Une distance de suivi de cinq secondes
    D: La longueur d'une voiture pour chaque tranche de 10 km/h de vitesse
  answer: B
  explanation: Le Guide du conducteur de la Nouvelle-Écosse recommande d'utiliser
    la « règle des deux secondes » pour maintenir une distance de sécurité dans des
    conditions de conduite normales.
- id: 99
  category: safe_driving_rules
  question: En Nouvelle-Écosse, quand êtes-vous tenu d'utiliser les phares de votre
    véhicule ?
  choices:
    A: Uniquement entre minuit et le lever du soleil
    B: Du coucher au lever du soleil
    C: De 30 minutes après le coucher du soleil à 30 minutes avant le lever du soleil,
      et chaque fois que la visibilité est inférieure à 300 mètres
    D: Uniquement lorsqu'il pleut ou qu'il neige
  answer: C
  explanation: La loi de la Nouvelle-Écosse exige que les phares soient allumés d'une
    demi-heure après le coucher du soleil à une demi-heure avant le lever du soleil,
    et à tout autre moment où la visibilité n'est pas claire sur une distance de 300
    mètres.
- id: 100
  category: safe_driving_rules
  question: 'Lorsqu''un piéton utilise un passage pour piétons en Nouvelle-Écosse,
    un conducteur doit :'
  choices:
    A: Céder le passage uniquement si le passage est marqué par de la peinture
    B: Céder le passage dans les passages pour piétons balisés et non balisés
    C: Klaxonner pour avertir le piéton de circuler plus vite
    D: Céder le passage uniquement si le piéton est un enfant ou une personne âgée
  answer: B
  explanation: En Nouvelle-Écosse, les conducteurs doivent céder le passage aux piétons
    dans les passages pour piétons balisés et non balisés (des passages non balisés
    existent à chaque intersection).
- id: 101
  category: defensive_driving
  question: Lorsque vous suivez un autre véhicule de nuit en Nouvelle-Écosse, à quelle
    distance devez-vous passer de vos feux de route aux feux de croisement ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Vous devez passer aux feux de croisement lorsque vous suivez un autre
    véhicule à moins de 60 mètres pour éviter d'éblouir le conducteur devant vous
    via son rétroviseur.
- id: 102
  category: defensive_driving
  question: 'Lorsque vous dépassez un cycliste circulant dans la même direction, la
    loi de la Nouvelle-Écosse exige une distance minimale entre votre véhicule et
    le cycliste de :'
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: La loi sur les véhicules à moteur de la Nouvelle-Écosse (Motor Vehicle
    Act) exige que les conducteurs laissent au moins un mètre (1 m) d'espace libre
    lors du dépassement d'un cycliste.
- id: 103
  category: defensive_driving
  question: Lorsque vous conduisez par brouillard épais, quel réglage de feux devez-vous
    utiliser pour assurer une visibilité et une sécurité maximales ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de position uniquement
    D: Feux de détresse
  answer: B
  explanation: Les feux de croisement doivent être utilisés par temps de brouillard
    car les feux de route se reflètent sur les gouttelettes d'humidité, provoquant
    un éblouissement et réduisant davantage la visibilité.
- id: 104
  category: defensive_driving
  question: 'En vertu de la loi « Move Over » (céder le passage) de la Nouvelle-Écosse,
    si vous voyez un véhicule d''urgence arrêté sur le bord de la route avec ses gyrophares
    allumés, vous devez ralentir à :'
  choices:
    A: 30 km/h
    B: 60 km/h ou la limite affichée si elle est inférieure
    C: 80 km/h
    D: La moitié de la limite de vitesse affichée
  answer: B
  explanation: Les conducteurs doivent ralentir à 60 km/h, ou à la limite de vitesse
    affichée si elle est inférieure à 60 km/h, lorsqu'ils dépassent un véhicule d'urgence
    arrêté dont les feux clignotent.
- id: 105
  category: defensive_driving
  question: Pour éviter l'aquaplanage (hydroplanage) sur des routes mouillées, quelle
    est la meilleure pratique de conduite préventive ?
  choices:
    A: Accélérer pour traverser l'eau rapidement
    B: Freiner brusquement dès que vous sentez la voiture glisser
    C: Réduire la vitesse et s'assurer que les pneus sont correctement gonflés
    D: Conduire sur un rapport inférieur avec un régime moteur élevé
  answer: C
  explanation: Réduire la vitesse est le moyen le plus efficace de prévenir l'aquaplanage.
    Des pneus correctement gonflés et une bonne profondeur de sculpture aident également
    à évacuer l'eau.
- id: 106
  category: defensive_driving
  question: En Nouvelle-Écosse, à quelle distance devant vous devez-vous balayer la
    route du regard (temps d'anticipation visuelle) lorsque vous conduisez en milieu
    urbain ?
  choices:
    A: 2 à 5 secondes
    B: 5 à 8 secondes
    C: 12 à 15 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: Le Guide du conducteur de la Nouvelle-Écosse recommande de maintenir
    une anticipation visuelle de 12 à 15 secondes vers l'avant pour identifier tôt
    les dangers potentiels.
- id: 107
  category: defensive_driving
  question: Si votre véhicule commence à déraper sur une route glacée, dans quelle
    direction devez-vous braquer le volant ?
  choices:
    A: Dans la direction opposée au dérapage
    B: Dans la direction où vous voulez que l'avant du véhicule aille
    C: Garder le volant parfaitement droit
    D: Vers l'accotement de la route
  answer: B
  explanation: Si vous dérapez, vous devez braquer dans la direction où vous voulez
    que le véhicule aille. Cela aide les pneus à retrouver de l'adhérence dans la
    trajectoire souhaitée.
- id: 108
  category: defensive_driving
  question: 'À l''approche d''un passage à niveau en Nouvelle-Écosse où un signal
    avertit de l''approche d''un train, vous devez arrêter votre véhicule :'
  choices:
    A: À au moins 2 mètres du rail le plus proche
    B: Entre 5 et 15 mètres du rail le plus proche
    C: À exactement 10 mètres du rail le plus proche
    D: Aussi près que possible des rails
  answer: B
  explanation: Selon la loi sur les véhicules à moteur de la Nouvelle-Écosse, vous
    devez vous arrêter à au moins 5 mètres mais pas à plus de 15 mètres du rail le
    plus proche à un passage à niveau.
- id: 109
  category: defensive_driving
  question: 'Si vous conduisez un véhicule équipé d''un système de freinage antiblocage
    (ABS) et que vous devez vous arrêter rapidement sur une surface glissante, vous
    devez :'
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et constante sur la pédale de frein
    C: Serrer le frein à main (frein d'urgence)
    D: Passer au point mort et laisser le véhicule s'arrêter en roue libre
  answer: B
  explanation: Avec l'ABS, vous devez appliquer une pression ferme et constante. Pomper
    les freins est réservé aux anciens véhicules sans ABS ; le faire avec l'ABS interfère
    avec le fonctionnement du système.
- id: 110
  category: defensive_driving
  question: Lorsque vous conduisez sous une pluie battante, quel est le principal
    danger de l'« aquaplanage » (hydroplanage) ?
  choices:
    A: Le calage du moteur dû à l'absorption d'eau
    B: Les freins qui deviennent mouillés et ne fonctionnent plus
    C: Les pneus qui perdent le contact avec la surface de la route et glissent sur
      une pellicule d'eau
    D: La visibilité qui devient nulle
  answer: C
  explanation: L'aquaplanage se produit lorsqu'une couche d'eau s'accumule entre les
    pneus et la surface de la route, entraînant une perte d'adhérence et de contrôle
    de la direction.
- id: 111
  category: defensive_driving
  question: 'En Nouvelle-Écosse, si vous conduisez sur une autoroute avec une limite
    de vitesse de 100 km/h et que vous rencontrez un autobus scolaire dont les feux
    rouges clignotent, vous devez vous arrêter :'
  choices:
    A: Seulement si vous circulez dans la même direction que l'autobus
    B: Seulement si l'autobus se trouve de votre côté d'une autoroute divisée
    C: Que vous arriviez de l'avant ou que vous suiviez de l'arrière
    D: Seulement s'il y a plus de deux voies de circulation
  answer: C
  explanation: En Nouvelle-Écosse, vous devez vous arrêter pour un autobus scolaire
    dont les feux rouges clignotent, que vous suiviez l'autobus ou que vous l'approchiez
    de l'avant, à moins que la route ne soit divisée par un terre-plein central.
- id: 112
  category: defensive_driving
  question: Selon le Guide du conducteur de la Nouvelle-Écosse, quelle est la distance
    de suivi minimale recommandée derrière un autre véhicule dans des conditions de
    conduite idéales ?
  choices:
    A: Une longueur de voiture pour chaque 10 km/h
    B: Un intervalle de deux secondes
    C: Un intervalle de quatre secondes
    D: 50 mètres
  answer: B
  explanation: La Nouvelle-Écosse recommande la « règle des deux secondes » comme
    distance de suivi minimale dans des conditions idéales afin de laisser suffisamment
    de temps pour réagir à des arrêts soudains.
- id: 113
  category: defensive_driving
  question: 'Lorsque vous conduisez de nuit en Nouvelle-Écosse, vous devez passer
    des feux de route aux feux de croisement lorsqu''un véhicule arrivant en sens
    inverse se trouve à moins de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: En vertu de la loi sur les véhicules à moteur (Motor Vehicle Act) de
    la Nouvelle-Écosse, les conducteurs doivent passer aux feux de croisement lorsqu'un
    véhicule arrivant en sens inverse se trouve à moins de 150 mètres afin d'éviter
    d'éblouir l'autre conducteur.
- id: 114
  category: defensive_driving
  question: Pour pratiquer un balayage visuel efficace, le Guide du conducteur de
    la Nouvelle-Écosse suggère que les conducteurs regardent à quelle distance devant
    leur véhicule ?
  choices:
    A: 5 à 8 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: Uniquement le véhicule qui précède directement
  answer: B
  explanation: Balayer du regard 12 à 15 secondes à l'avance permet aux conducteurs
    d'anticiper les dangers et de planifier leur trajectoire bien à l'avance.
- id: 115
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une route mouillée
    en Nouvelle-Écosse, quelle est l'action de conduite préventive correcte ?
  choices:
    A: Freiner brusquement pour retrouver de la traction
    B: Accélérer pour traverser l'eau
    C: Lever le pied de l'accélérateur et maintenir la direction droite
    D: Tourner brusquement le volant vers l'accotement
  answer: C
  explanation: En cas d'aquaplanage, vous devez relâcher l'accélérateur et maintenir
    le volant droit. Ne freinez pas, car cela peut provoquer un dérapage lorsque les
    pneus retrouvent le contact avec la route.
- id: 116
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais en Nouvelle-Écosse, quels
    feux devez-vous utiliser ?
  choices:
    A: Les feux de route
    B: Les feux de croisement
    C: Les feux de stationnement uniquement
    D: Les feux de détresse uniquement
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard car
    les feux de route se reflètent sur les gouttelettes d'humidité, créant un éblouissement
    et réduisant davantage la visibilité.
- id: 117
  category: defensive_driving
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    de la Nouvelle-Écosse pour avoir « suivi de trop près » ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Suivre de trop près est une infraction à la loi sur les véhicules à
    moteur (Motor Vehicle Act) et entraîne l'ajout de 2 points d'inaptitude au dossier
    du conducteur.
- id: 118
  category: defensive_driving
  question: Dans des conditions hivernales, la loi de la Nouvelle-Écosse exige que
    vous déneigiez et dégivriez quelles parties de votre véhicule avant de conduire
    ?
  choices:
    A: Uniquement le pare-brise et les vitres latérales avant
    B: Le pare-brise, toutes les vitres et tous les feux
    C: Uniquement le toit et le capot
    D: Uniquement le côté conducteur du pare-brise
  answer: B
  explanation: La loi sur les véhicules à moteur (Motor Vehicle Act) de la Nouvelle-Écosse
    exige que toutes les vitres et tous les feux soient exempts d'obstructions, y
    compris la neige et la glace, afin d'assurer une visibilité et une sécurité totales.
- id: 119
  category: defensive_driving
  question: La loi « Move Over » (se tasser) de la Nouvelle-Écosse exige que les conducteurs
    ralentissent et, si c'est sécuritaire, se déplacent dans la voie de gauche lorsqu'ils
    dépassent quel type de véhicule arrêté sur l'accotement avec ses feux clignotants
    ?
  choices:
    A: Uniquement les voitures de police
    B: Uniquement les ambulances et les camions de pompiers
    C: Tous les véhicules d'urgence et les dépanneuses
    D: Tout véhicule dont les feux de détresse sont allumés
  answer: C
  explanation: La loi s'applique à tous les véhicules d'urgence (police, pompiers,
    ambulance) et aux véhicules de service comme les dépanneuses qui sont arrêtés
    sur le bord de la route avec leurs feux clignotants.
- id: 120
  category: defensive_driving
  question: Si les freins de votre véhicule lâchent pendant que vous conduisez, quelle
    est la première action préventive que vous devriez prendre ?
  choices:
    A: Couper le moteur immédiatement
    B: Passer au point mort (neutre)
    C: Pomper la pédale de frein rapidement
    D: Sauter hors du véhicule
  answer: C
  explanation: Pomper la pédale de frein peut souvent accumuler suffisamment de pression
    hydraulique pour arrêter le véhicule si la défaillance est partielle.
- id: 121
  category: defensive_driving
  question: 'Si vous conduisez sur une autoroute et qu''un pneu éclate, vous devriez
    :'
  choices:
    A: Freiner brusquement immédiatement pour vous arrêter
    B: Tenir fermement le volant et relâcher l'accélérateur
    C: Diriger rapidement le véhicule vers l'accotement
    D: Passer à une vitesse inférieure et serrer le frein de stationnement
  answer: B
  explanation: Tenez fermement le volant pour garder le contrôle, maintenez le véhicule
    en ligne droite et relâchez l'accélérateur. Ne freinez pas tant que le véhicule
    n'a pas ralenti de manière significative.
- id: 122
  category: defensive_driving
  question: En vertu de la Loi sur les véhicules à moteur de la Nouvelle-Écosse, quelle
    est la sanction pour avoir omis de céder le passage à un piéton dans un passage
    pour piétons ?
  choices:
    A: Une amende et 2 points d'inaptitude
    B: Une amende et 4 points d'inaptitude
    C: Une amende et 6 points d'inaptitude
    D: Une amende seulement, aucun point
  answer: B
  explanation: Le fait de ne pas céder le passage à un piéton dans un passage pour
    piétons est une infraction grave en Nouvelle-Écosse et entraîne 4 points d'inaptitude.
- id: 123
  category: defensive_driving
  question: 'Lorsque vous conduisez sur une autoroute à plusieurs voies en Nouvelle-Écosse,
    la meilleure façon de vérifier l''angle mort est de :'
  choices:
    A: Regarder dans le rétroviseur intérieur
    B: Regarder dans les rétroviseurs extérieurs
    C: Tourner la tête pour regarder par les vitres latérales
    D: Utiliser un miroir d'appoint grand angle
  answer: C
  explanation: Les rétroviseurs ne permettent pas de tout voir. Une vérification par-dessus
    l'épaule (en tournant la tête) est nécessaire pour voir les véhicules dans les
    angles morts avant de changer de voie.
- id: 124
  category: alcohol_drugs_health
  question: 'En Nouvelle-Écosse, un conducteur titulaire d''un permis complet (non-GDL)
    dont le taux d''alcoolémie (BAC) se situe entre 0,05 et 0,08 s''expose à une suspension
    immédiate du permis sur le bord de la route de :'
  choices:
    A: 12 heures
    B: 24 heures
    C: 48 heures
    D: 7 jours
  answer: B
  explanation: En Nouvelle-Écosse, si le taux d'alcoolémie d'un conducteur titulaire
    d'un permis complet se situe dans la zone d'avertissement (0,05 à 0,08), il fait
    l'objet d'une suspension immédiate de son permis de 24 heures sur le bord de la
    route.
- id: 125
  category: alcohol_drugs_health
  question: 'Si un conducteur en Nouvelle-Écosse refuse de fournir un échantillon
    d''haleine, de sang ou de fluide oral suite à une demande légale d''un agent de
    la paix, la sanction administrative est :'
  choices:
    A: Une suspension de 24 heures et une amende de 100 $
    B: Une suspension de permis de 30 jours
    C: Une suspension administrative immédiate du permis de 90 jours
    D: Aucune sanction immédiate avant d'être reconnu coupable par un tribunal
  answer: C
  explanation: Le refus d'obtempérer à une demande de test de sobriété en Nouvelle-Écosse
    entraîne une suspension administrative immédiate du permis (ALS) de 90 jours,
    soit la même sanction que pour un taux supérieur à 0,08.
- id: 126
  category: alcohol_drugs_health
  question: 'Lors d''une première condamnation en vertu du Code criminel pour conduite
    avec facultés affaiblies en Nouvelle-Écosse, la période de révocation du permis
    provincial est de :'
  choices:
    A: 6 mois
    B: 1 an
    C: 2 ans
    D: 5 ans
  answer: B
  explanation: En vertu de la Loi sur les véhicules à moteur de la Nouvelle-Écosse,
    une première condamnation pour une infraction de conduite liée à l'alcool ou aux
    drogues en vertu du Code criminel entraîne une révocation du permis d'un an.
- id: 127
  category: alcohol_drugs_health
  question: Les conducteurs condamnés pour conduite avec facultés affaiblies en Nouvelle-Écosse
    doivent suivre quel programme avant de pouvoir demander le rétablissement de leur
    permis ?
  choices:
    A: Le cours de conduite préventive
    B: Le programme d'éducation sur l'alcool et les drogues (Programme de conduite
      avec facultés affaiblies)
    C: Une séance de formation standard de 6 heures pour les conducteurs
    D: L'examen pour conducteurs à haut risque
  answer: B
  explanation: La Nouvelle-Écosse exige que les conducteurs condamnés pour des infractions
    liées à l'alcool ou aux drogues effectuent une évaluation de la toxicomanie et
    suivent le programme d'éducation « Driving While Impaired » (DWI) par l'entremise
    des Services de toxicomanie.
- id: 128
  category: alcohol_drugs_health
  question: Quelle est la conséquence d'une troisième condamnation ou d'une condamnation
    subséquente en vertu du Code criminel pour conduite avec facultés affaiblies en
    Nouvelle-Écosse ?
  choices:
    A: Une révocation de 5 ans
    B: Une révocation indéfinie (minimum 5 ans)
    C: Une révocation de 10 ans
    D: Une révocation permanente sans possibilité de rétablissement
  answer: B
  explanation: Une troisième condamnation ou une condamnation subséquente entraîne
    une révocation indéfinie, bien que le conducteur puisse être admissible à demander
    le rétablissement de son permis après 5 ans sous certaines conditions spécifiques.
- id: 129
  category: alcohol_drugs_health
  question: Le programme d'antidémarrage avec éthylomètre de la Nouvelle-Écosse est
    obligatoire pour lequel des cas suivants ?
  choices:
    A: Tous les conducteurs titulaires d'un permis de classe 7
    B: Les conducteurs condamnés pour conduite avec facultés affaiblies causant des
      lésions corporelles ou la mort
    C: Tout conducteur qui reçoit une suspension de 24 heures
    D: Les conducteurs ayant atteint 10 points d'inaptitude
  answer: B
  explanation: Le programme d'antidémarrage est obligatoire pour certains contrevenants
    à haut risque, y compris ceux condamnés pour conduite avec facultés affaiblies
    causant des lésions corporelles ou la mort, ainsi que pour les récidivistes.
- id: 130
  category: alcohol_drugs_health
  question: Si vous prenez des médicaments sur ordonnance et que vous devez conduire,
    quelle est votre responsabilité principale en Nouvelle-Écosse ?
  choices:
    A: Conduire uniquement pendant les heures de clarté
    B: Conduire à 10 km/h en dessous de la limite de vitesse
    C: Consulter un médecin ou un pharmacien au sujet des effets du médicament sur
      la conduite
    D: Garder le flacon d'ordonnance dans la boîte à gants en tout temps
  answer: C
  explanation: Les conducteurs sont responsables de savoir comment les médicaments
    les affectent. Vous devez consulter un professionnel de la santé pour vous assurer
    que le médicament n'altère pas votre capacité à conduire en toute sécurité.
- id: 131
  category: alcohol_drugs_health
  question: En Nouvelle-Écosse, quelle est la période de suspension administrative
    immédiate du permis (ALS) si le taux d'alcoolémie (BAC) d'un conducteur est de
    0,08 ou plus ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: D
  explanation: Si un conducteur est pris avec un taux d'alcoolémie supérieur à 0,08,
    son permis est immédiatement suspendu pendant 90 jours avant même que l'affaire
    ne soit portée devant les tribunaux.
- id: 132
  category: alcohol_drugs_health
  question: Quelle est la limite légale de THC (le composant psychoactif du cannabis)
    dans le sang d'un conducteur qui déclenche une infraction punissable par voie
    de déclaration de culpabilité par procédure sommaire au Canada (et en Nouvelle-Écosse)
    ?
  choices:
    A: Entre 2 nanogrammes (ng) et 5 nanogrammes (ng)
    B: Exactement 10 nanogrammes (ng)
    C: Toute quantité détectable pour tous les conducteurs
    D: Il n'y a pas de limite sanguine pour le cannabis
  answer: A
  explanation: Le fait d'avoir entre 2 ng et 5 ng de THC par ml de sang constitue
    une infraction punissable par procédure sommaire. Avoir 5 ng ou plus est une infraction
    hybride plus grave.
- id: 133
  category: alcohol_drugs_health
  question: 'Si un conducteur est reconnu coupable de facultés affaiblies par une
    combinaison d''alcool et de drogues, et qu''il présente un taux d''alcoolémie
    de 0,05 ou plus et un taux de THC de 2,5 ng ou plus, la sanction est :'
  choices:
    A: La même qu'une suspension de 24 heures
    B: Un simple avertissement
    C: Traitée comme une infraction grave au Code criminel
    D: Seulement une petite amende
  answer: C
  explanation: La combinaison d'alcool et de drogues augmente considérablement les
    facultés affaiblies. La loi fédérale (appliquée en N.-É.) fixe des limites strictes
    pour la consommation combinée (0,05 d'alcoolémie + 2,5 ng de THC), ce qui constitue
    une infraction au Code criminel.
- id: 134
  category: alcohol_drugs_health
  question: Lorsqu'un conducteur est réintégré après une révocation liée à l'alcool
    en Nouvelle-Écosse, il est placé dans la phase de « conducteur restreint » (Condition
    H). Quelle est sa limite de taux d'alcoolémie pendant cette période ?
  choices:
    A: 0,00
    B: 0,03
    C: 0,05
    D: 0,08
  answer: A
  explanation: Les conducteurs réintégrés après une révocation liée à l'alcool doivent
    maintenir un taux d'alcoolémie de 0,00 pendant une période d'un an (Condition
    H).
- id: 135
  category: alcohol_drugs_health
  question: 'Si un conducteur se sent fatigué ou somnolent alors qu''il conduit sur
    une autoroute de la Nouvelle-Écosse, l''action la plus sûre est de :'
  choices:
    A: Monter le son de la radio et ouvrir les fenêtres
    B: Boire une boisson énergisante riche en caféine et continuer
    C: Se garer dans un endroit sûr et se reposer ou faire une sieste
    D: Augmenter la vitesse pour atteindre la destination plus rapidement
  answer: C
  explanation: La fatigue est une forme d'affaiblissement des facultés. Le seul remède
    efficace contre la somnolence est le sommeil ; les astuces comme la musique forte
    ou l'air frais ne procurent qu'un sentiment de vigilance très bref et peu fiable.
- id: 136
  category: alcohol_drugs_health
  question: 'En Nouvelle-Écosse, si un conducteur est reconnu coupable d''une infraction
    de conduite avec facultés affaiblies au titre du Code criminel, il doit payer
    des frais de rétablissement de permis d''environ :'
  choices:
    A: Aucun frais n'est requis
    B: 25,00 $
    C: 124,60 $ (frais standard)
    D: 100,00 $ plus le coût du programme DWI et de l'évaluation
    E: Les frais de rétablissement sont nettement plus élevés pour les révocations
      liées à l'alcool (environ 124,60 $) plus les coûts du programme.
  answer: C
  explanation: Bien que les frais varient légèrement avec l'inflation, la Nouvelle-Écosse
    exige des frais de rétablissement spécifiques (actuellement 124,60 $) en plus
    de la réussite de tous les programmes de toxicomanie et évaluations requis.
- id: 137
  category: alcohol_drugs_health
  question: En Nouvelle-Écosse, un conducteur titulaire d'un permis complet (ne faisant
    pas partie du programme GDL) fera l'objet d'une suspension immédiate de permis
    de 24 heures sur le bord de la route si son taux d'alcoolémie (BAC) se situe dans
    quelle fourchette ?
  choices:
    A: 0,01 à 0,04
    B: 0,05 à 0,08
    C: 0,08 à 0,10
    D: Au-dessus de 0,10
  answer: B
  explanation: En Nouvelle-Écosse, les conducteurs titulaires d'un permis complet
    font l'objet d'une suspension administrative immédiate de permis de 24 heures
    si leur taux d'alcoolémie se situe entre 0,05 et 0,08 (la zone d'avertissement).
- id: 138
  category: alcohol_drugs_health
  question: En vertu de la loi sur les véhicules à moteur de la Nouvelle-Écosse (Motor
    Vehicle Act), quelle est la période minimale de révocation du permis pour une
    première condamnation au Code criminel liée à la conduite avec facultés affaiblies
    ?
  choices:
    A: 6 mois
    B: 1 an
    C: 2 ans
    D: 5 ans
  answer: B
  explanation: Une première condamnation en vertu du Code criminel du Canada pour
    conduite avec facultés affaiblies entraîne une révocation minimale d'un an du
    permis de conduire en Nouvelle-Écosse.
- id: 139
  category: alcohol_drugs_health
  question: Si l'échantillon d'haleine ou de sang d'un conducteur révèle un taux d'alcoolémie
    supérieur à 0,08, il recevra une suspension administrative immédiate de son permis
    (ALS) pour combien de jours ?
  choices:
    A: 7 jours
    B: 30 jours
    C: 90 jours
    D: 180 jours
  answer: C
  explanation: La loi de la Nouvelle-Écosse impose une suspension administrative immédiate
    du permis de 90 jours pour les conducteurs qui présentent un taux supérieur à
    0,08 ou qui refusent un test d'alcootest.
- id: 140
  category: alcohol_drugs_health
  question: En Nouvelle-Écosse, quelles sont les conséquences juridiques du refus
    de fournir un échantillon d'haleine ou de sang à un agent de la paix ?
  choices:
    A: Une petite amende et une suspension de 24 heures
    B: Les mêmes sanctions que pour un taux d'alcoolémie supérieur à 0,08
    C: Un avertissement pour la première infraction
    D: Une peine de prison obligatoire de 30 jours
  answer: B
  explanation: Le refus de fournir un échantillon d'haleine ou de sang est une infraction
    criminelle et entraîne les mêmes sanctions que la conduite avec un taux d'alcoolémie
    supérieur à 0,08, y compris la révocation du permis et des amendes.
- id: 141
  category: alcohol_drugs_health
  question: Si un conducteur est surpris en train de conduire un véhicule avec un
    taux d'alcoolémie (BAC) supérieur à 0,08, son véhicule sera mis en fourrière pendant
    un minimum de combien de jours ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: En Nouvelle-Écosse, si vous êtes accusé d'une infraction de conduite
    liée à l'alcool (taux d'alcoolémie supérieur à 0,08 ou refus), le véhicule que
    vous conduisez fait l'objet d'une mise en fourrière immédiate de 7 jours.
- id: 142
  category: alcohol_drugs_health
  question: À la suite d'une condamnation pour conduite avec facultés affaiblies en
    Nouvelle-Écosse, un conducteur peut être tenu de participer à quel programme pour
    récupérer ses privilèges de conduite ?
  choices:
    A: Le cours de conduite préventive
    B: Le programme de réadaptation pour alcooliques (Services de toxicomanie)
    C: Le séminaire pour conducteurs à haut risque
    D: L'entretien d'amélioration du conducteur
  answer: B
  explanation: Les conducteurs condamnés pour conduite avec facultés affaiblies doivent
    subir une évaluation de la toxicomanie et/ou suivre un programme de réadaptation
    pour alcooliques par l'entremise de la Régie de la santé de la Nouvelle-Écosse
    (Services de toxicomanie) avant le rétablissement de leur permis.
- id: 143
  category: alcohol_drugs_health
  question: 'En Nouvelle-Écosse, une troisième condamnation ou une condamnation subséquente
    au Code criminel pour conduite avec facultés affaiblies entraîne une révocation
    du permis d''au moins :'
  choices:
    A: 5 ans
    B: 10 ans
    C: Indéfinie (permanente)
    D: 20 ans
  answer: C
  explanation: Une troisième condamnation ou une condamnation subséquente pour conduite
    avec facultés affaiblies entraîne une révocation indéfinie (permanente) du permis,
    bien qu'il existe des conditions spécifiques et strictes selon lesquelles on peut
    demander une révision après 10 ans.
- id: 144
  category: alcohol_drugs_health
  question: Laquelle des affirmations suivantes est vraie concernant le programme
    d'antidémarreur éthylométrique de la Nouvelle-Écosse ?
  choices:
    A: Il est strictement volontaire pour tous les contrevenants
    B: Il est obligatoire pour certains récidivistes ou ceux ayant un taux d'alcoolémie
      élevé
    C: Il s'adresse uniquement aux conducteurs de moins de 19 ans
    D: Il n'est utilisé que pour les excès de vitesse
  answer: B
  explanation: Le programme d'antidémarreur éthylométrique est obligatoire pour certains
    contrevenants pour conduite avec facultés affaiblies en Nouvelle-Écosse afin de
    regagner des privilèges de conduite partiels pendant leur période de révocation
    ou comme condition de rétablissement.
- id: 145
  category: alcohol_drugs_health
  question: Qui est légalement responsable de signaler un problème de santé qui pourrait
    rendre la conduite d'une personne dangereuse en Nouvelle-Écosse ?
  choices:
    A: Uniquement la compagnie d'assurance du conducteur
    B: Uniquement l'employeur du conducteur
    C: À la fois le conducteur et son médecin traitant ou optométriste
    D: Uniquement la police
  answer: C
  explanation: En Nouvelle-Écosse, les conducteurs sont tenus de signaler tout problème
    de santé pouvant affecter leur conduite, et les médecins/optométristes sont également
    légalement tenus de signaler les patients dont l'état de santé rend dangereuse
    la conduite d'un véhicule à moteur.
- id: 146
  category: alcohol_drugs_health
  question: Si vous prenez un médicament sur ordonnance ou en vente libre, quelle
    est votre principale responsabilité avant de conduire ?
  choices:
    A: Ne conduire que pendant les heures de clarté
    B: Vérifier l'étiquette ou demander à un pharmacien/médecin quels sont les effets
      secondaires qui pourraient nuire à la conduite
    C: Attendre au moins une heure après avoir pris le médicament
    D: Boire plus d'eau pour éliminer le médicament plus rapidement
  answer: B
  explanation: Il est de la responsabilité du conducteur de s'assurer qu'il n'est
    pas affaibli par une substance. Vous devez vérifier les effets secondaires tels
    que la somnolence ou la vision trouble avant de conduire un véhicule.
- id: 147
  category: alcohol_drugs_health
  question: Quel est l'effet du mélange d'alcool avec de petites quantités de drogues
    ou de médicaments ?
  choices:
    A: Les effets de l'alcool sont annulés
    B: Les effets de la drogue sont annulés
    C: L'effet combiné est souvent supérieur à la somme des deux (effet synergique)
    D: Il n'y a aucun changement dans les niveaux d'affaiblissement des facultés
  answer: C
  explanation: Le mélange d'alcool et de drogues peut produire un effet synergique,
    ce qui signifie que le niveau d'affaiblissement des facultés est nettement plus
    élevé que si l'une ou l'autre substance était utilisée seule.
- id: 148
  category: alcohol_drugs_health
  question: 'En Nouvelle-Écosse, si un agent de police soupçonne que vos facultés
    sont affaiblies par une drogue, il peut exiger que vous :'
  choices:
    A: Effectuiez un test de sobriété normalisé sur le terrain (SFST)
    B: Fournissiez un échantillon de fluide buccal
    C: Subissiez une évaluation par un expert en reconnaissance de drogues (DRE)
    D: Toutes les réponses ci-dessus
  answer: D
  explanation: La police de la Nouvelle-Écosse a le pouvoir d'utiliser des tests de
    sobriété normalisés (SFST), des dépisteurs de drogues par fluide buccal et des
    évaluations par des experts en reconnaissance de drogues (DRE) pour déterminer
    si les facultés d'un conducteur sont affaiblies par des drogues (y compris le
    cannabis).
- id: 149
  category: alcohol_drugs_health
  question: Comment la fatigue affecte-t-elle votre capacité de conduite par rapport
    à l'alcool ?
  choices:
    A: La fatigue n'est pas une préoccupation sérieuse pour les conducteurs expérimentés
    B: Être extrêmement fatigué peut nuire à votre temps de réaction et à votre jugement
      autant que d'être légalement ivre
    C: La fatigue n'affecte que votre vision, pas votre prise de décision
    D: Le café est un remède éprouvé contre la fatigue du conducteur
  answer: B
  explanation: La fatigue ralentit considérablement les temps de réaction et altère
    le jugement. Des études montrent que le fait d'être éveillé pendant 17 à 19 heures
    peut entraîner des niveaux d'affaiblissement similaires à un taux d'alcoolémie
    (BAC) de 0,05.
- id: 150
  category: alcohol_drugs_health
  question: Si vous êtes condamné pour une infraction de conduite liée à l'alcool
    et que votre permis est révoqué, que devez-vous payer avant que votre permis puisse
    être rétabli ?
  choices:
    A: Uniquement l'amende du tribunal
    B: Des frais de rétablissement de permis et tous les frais administratifs applicables
    C: Votre franchise d'assurance
    D: Des frais au service de police local
  answer: B
  explanation: Pour récupérer votre permis après une révocation en Nouvelle-Écosse,
    vous devez payer des frais de rétablissement au Bureau des véhicules automobiles,
    en plus de suivre les programmes requis et de payer les amendes ordonnées par
    le tribunal.
- id: 151
  category: penalties_and_points
  question: Pour un conducteur titulaire d'un permis complet (non-GDL) en Nouvelle-Écosse,
    à partir de quel total de points le permis de conduire est-il suspendu pour la
    première fois ?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: C
  explanation: Alors que les conducteurs du système de permis progressif (GDL) sont
    suspendus à 6 points, un conducteur titulaire d'un permis complet en Nouvelle-Écosse
    verra son permis suspendu après avoir accumulé 10 points d'inaptitude.
- id: 152
  category: penalties_and_points
  question: Si un conducteur est pris en flagrant délit de « conduite acrobatique
    » (stunting - conduire à 50 km/h ou plus au-dessus de la limite de vitesse) en
    Nouvelle-Écosse, quelle est la sanction immédiate sur les lieux ?
  choices:
    A: Un avertissement et une amende de 200 $
    B: Une suspension immédiate du permis de 24 heures
    C: Une suspension immédiate du permis de 7 jours et la mise en fourrière du véhicule
    D: Aucune sanction immédiate avant une date d'audience au tribunal
  answer: C
  explanation: Selon la loi de la Nouvelle-Écosse, la conduite acrobatique entraîne
    une suspension immédiate du permis de conduire de 7 jours, le véhicule est mis
    en fourrière pendant 7 jours et le conducteur s'expose à une amende importante.
- id: 153
  category: penalties_and_points
  question: En Nouvelle-Écosse, combien de points d'inaptitude sont inscrits au dossier
    pour avoir omis de céder le passage à un piéton dans un passage pour piétons ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Le fait de ne pas céder le passage à un piéton dans un passage pour
    piétons est une infraction grave en Nouvelle-Écosse, entraînant une pénalité de
    4 points d'inaptitude.
- id: 154
  category: penalties_and_points
  question: Si un conducteur titulaire d'un permis complet présente un taux d'alcoolémie
    (BAC) compris entre 0,05 et 0,08, quelle est la sanction administrative immédiate
    pour une première infraction ?
  choices:
    A: Une suspension de permis de 24 heures sur le bord de la route
    B: Une suspension de permis de 7 jours
    C: Une suspension de permis de 90 jours
    D: Une révocation permanente du permis
  answer: B
  explanation: En Nouvelle-Écosse, une première suspension administrative pour un
    taux d'alcoolémie (BAC) dans la zone d'avertissement (0,05 à 0,08) entraîne une
    suspension immédiate du permis de 7 jours.
- id: 155
  category: penalties_and_points
  question: Si vous êtes reconnu coupable de délit de fuite (omission de rester sur
    les lieux d'un accident) en Nouvelle-Écosse, combien de points d'inaptitude seront
    ajoutés à votre dossier ?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Le délit de fuite est une infraction majeure et entraîne une pénalité
    de 6 points d'inaptitude.
- id: 156
  category: penalties_and_points
  question: Pendant combien de temps les points d'inaptitude restent-ils au dossier
    d'un conducteur en Nouvelle-Écosse à compter de la date de l'infraction ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 5 ans
  answer: B
  explanation: En Nouvelle-Écosse, les points d'inaptitude restent à votre dossier
    de conduite pendant une période de 24 mois (2 ans) à compter de la date de la
    condamnation.
- id: 157
  category: penalties_and_points
  question: En Nouvelle-Écosse, combien de points d'inaptitude sont attribués pour
    un « dépassement interdit » (par exemple, sur une ligne continue ou dans une courbe)
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Un dépassement inapproprié ou un dépassement là où la signalisation
    ou le marquage l'interdisent entraîne 2 points d'inaptitude.
- id: 158
  category: penalties_and_points
  question: En vertu de la loi « Move Over » (se tasser) de la Nouvelle-Écosse, les
    conducteurs doivent ralentir et se déplacer vers la voie la plus éloignée lorsqu'ils
    dépassent des véhicules d'urgence dont les feux clignotent. Quelle est la pénalité
    en points d'inaptitude pour avoir omis de le faire ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Le non-respect de la loi « Move Over » en Nouvelle-Écosse entraîne
    une amende et 2 points d'inaptitude.
- id: 159
  category: penalties_and_points
  question: Quelle est la sanction pour un conducteur qui ne s'arrête pas pour un
    autobus scolaire dont les feux rouges clignotent en Nouvelle-Écosse ?
  choices:
    A: 2 points d'inaptitude et une amende de 100 $
    B: 4 points d'inaptitude et une amende de 250 $
    C: 6 points d'inaptitude et une amende commençant à environ 410 $
    D: Révocation automatique du permis pendant 1 an
  answer: C
  explanation: L'omission de s'arrêter pour un autobus scolaire dont les feux rouges
    clignotent est une infraction grave en Nouvelle-Écosse, entraînant 6 points d'inaptitude
    et une amende importante (infraction de catégorie D).
- id: 160
  category: penalties_and_points
  question: En vertu de la loi « Move Over » de la Nouvelle-Écosse, que doit faire
    un conducteur à l'approche d'un véhicule d'urgence arrêté dont les feux clignotent
    sur une route comportant deux voies ou plus dans la même direction ?
  choices:
    A: Maintenir sa vitesse mais klaxonner pour alerter les intervenants d'urgence
    B: Ralentir à 60 km/h (ou à la limite affichée si elle est inférieure) et changer
      de voie si cela peut être fait en toute sécurité
    C: S'arrêter complètement jusqu'à ce que le véhicule d'urgence éteigne ses feux
    D: Accélérer pour dépasser la zone le plus rapidement possible
  answer: B
  explanation: La loi de la Nouvelle-Écosse exige que les conducteurs ralentissent
    à 60 km/h (ou à la limite affichée) et se déplacent vers la voie non adjacente
    lorsqu'ils dépassent des véhicules d'urgence ou des dépanneuses dont les feux
    clignotent.
- id: 161
  category: penalties_and_points
  question: En Nouvelle-Écosse, un agent de la paix peut imposer une suspension immédiate
    de 24 heures sur le bord de la route si le taux d'alcoolémie (BAC) d'un conducteur
    se situe dans quelle fourchette ?
  choices:
    A: 0,01 à 0,04
    B: 0,05 à 0,08
    C: Au-dessus de 0,10 seulement
  answer: B
  explanation: La Nouvelle-Écosse a une « zone d'avertissement » où les conducteurs
    ayant un taux d'alcoolémie (BAC) compris entre 0,05 et 0,08 peuvent faire l'objet
    d'une suspension immédiate de leur permis de conduire de 24 heures sur le bord
    de la route.
- id: 162
  category: penalties_and_points
  question: Quelle est la pénalité en points d'inaptitude pour avoir omis de rester
    sur les lieux d'un accident en Nouvelle-Écosse ?
  choices:
    A: 3 points
    B: 4 points
    C: 5 points
    D: 6 points
  answer: D
  explanation: Le délit de fuite (omission de rester sur les lieux d'un accident)
    entraîne l'inscription de 6 points d'inaptitude au dossier de conduite de la Nouvelle-Écosse.
- id: 163
  category: penalties_and_points
  question: 'En Nouvelle-Écosse, une suspension administrative de permis (ALS) de
    90 jours est automatiquement déclenchée si un conducteur :'
  choices:
    A: Accumule 10 points d'inaptitude
    B: Est pris en flagrant délit d'excès de vitesse de 30 km/h au-dessus de la limite
    C: Échoue à un test d'alcootest (plus de 0,08) ou refuse de fournir un échantillon
    D: Est impliqué dans n'importe quel accident impliquant des dommages matériels
  answer: C
  explanation: La suspension administrative de permis (ALS) de 90 jours est appliquée
    immédiatement si un conducteur est accusé d'avoir un taux d'alcoolémie supérieur
    à 0,08 ou s'il refuse de se soumettre à une demande d'analyse d'haleine ou de
    sang.
- id: 164
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir participé à une
    « course » ou à un « pari sur une course de chevaux » sur une route de la Nouvelle-Écosse
    ?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Faire la course sur une route est une infraction majeure et entraîne
    6 points d'inaptitude en Nouvelle-Écosse.
- id: 165
  category: sharing_the_road
  question: En Nouvelle-Écosse, lorsque vous approchez d'un autobus scolaire, peu
    importe la direction, dont les feux rouges clignotent et le bras d'arrêt est déployé,
    que devez-vous faire ?
  choices:
    A: Ralentir à 20 km/h et dépasser avec prudence
    B: S'arrêter à au moins 5 mètres de l'autobus
    C: S'arrêter à au moins 20 mètres de l'autobus
    D: S'arrêter uniquement si vous suivez l'autobus
  answer: C
  explanation: Selon le Guide du conducteur de la Nouvelle-Écosse, les conducteurs
    doivent s'arrêter à au moins 20 mètres d'un autobus scolaire lorsque ses feux
    rouges clignotent, quelle que soit la direction d'où ils viennent, à moins que
    la route ne soit séparée par un terre-plein central.
- id: 166
  category: sharing_the_road
  question: En vertu de la loi sur l'obligation de se tasser (Move Over) de la Nouvelle-Écosse,
    si vous dépassez un véhicule d'urgence arrêté avec ses feux clignotants sur une
    autoroute où la limite de vitesse est de 100 km/h, quelle est la vitesse maximale
    autorisée ?
  choices:
    A: 80 km/h
    B: 60 km/h
    C: 50 km/h
    D: La limite de vitesse affichée
  answer: B
  explanation: La loi de la Nouvelle-Écosse exige que les conducteurs ralentissent
    à 60 km/h (ou à la limite de vitesse affichée si elle est inférieure à 60 km/h)
    lorsqu'ils dépassent des véhicules d'urgence ou des dépanneuses arrêtés sur le
    bord de la route avec leurs feux clignotants.
- id: 167
  category: sharing_the_road
  question: Lorsqu'il dépasse un cycliste en Nouvelle-Écosse, quelle est la distance
    minimale qu'un automobiliste doit maintenir entre son véhicule et le cycliste
    ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: La loi sur les véhicules à moteur de la Nouvelle-Écosse exige que les
    conducteurs maintiennent une distance minimale d'un mètre (1 m) lorsqu'ils dépassent
    un cycliste.
- id: 168
  category: sharing_the_road
  question: En Nouvelle-Écosse, parmi les véhicules suivants, lesquels ne sont PAS
    couverts par la loi sur l'obligation de se tasser exigeant que les conducteurs
    ralentissent et changent de voie ?
  choices:
    A: Véhicules de police et camions de pompiers
    B: Ambulances et dépanneuses
    C: Véhicules du ministère des Ressources naturelles avec feux clignotants
    D: Véhicules de livraison du courrier
  answer: D
  explanation: La loi sur l'obligation de se tasser s'applique aux véhicules d'urgence
    (police, pompiers, ambulance), aux dépanneuses et aux véhicules de services publics
    (comme NS Power) lorsque leurs feux clignotent. Les véhicules de livraison du
    courrier ne sont pas inclus.
- id: 169
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté sur une route divisée par un terre-plein
    central, qui est tenu de s'arrêter lorsque l'autobus a ses feux rouges clignotants
    ?
  choices:
    A: Les conducteurs de toutes les voies doivent s'arrêter
    B: Seuls les conducteurs venant de l'avant doivent s'arrêter
    C: Seuls les conducteurs qui suivent l'autobus doivent s'arrêter
    D: Personne n'est tenu de s'arrêter sur une route divisée
  answer: C
  explanation: Sur une route divisée par un terre-plein central, seul le trafic qui
    suit l'autobus est tenu de s'arrêter. Le trafic venant de l'avant dans les voies
    opposées (séparées par le terre-plein) n'a pas à s'arrêter.
- id: 170
  category: sharing_the_road
  question: Un conducteur est-il autorisé à franchir une ligne jaune pour dépasser
    un cycliste en Nouvelle-Écosse ?
  choices:
    A: Non, ce n'est jamais autorisé
    B: Oui, mais seulement si la ligne est discontinue
    C: Oui, même si la ligne est pleine, à condition de pouvoir le faire en toute
      sécurité
    D: Seulement si le cycliste vous fait signe de passer
  answer: C
  explanation: La loi de la Nouvelle-Écosse permet aux conducteurs de franchir une
    ligne jaune (même une ligne pleine) pour dépasser un cycliste, tant que cela est
    sécuritaire et que le conducteur peut maintenir la distance d'un mètre requise.
- id: 171
  category: sharing_the_road
  question: 'Lorsque vous suivez une motocyclette, vous devriez laisser une distance
    de sécurité plus grande que pour une voiture parce que :'
  choices:
    A: Les motocyclettes ont une distance de freinage plus courte
    B: Les motocyclettes sont plus rapides que les voitures
    C: Les motocyclistes sont plus susceptibles de coller au véhicule de devant
    D: Les motocyclettes sont plus difficiles à voir la nuit
  answer: A
  explanation: Les motocyclettes sont plus légères et possèdent des systèmes de freinage
    de haute performance, ce qui leur permet de s'arrêter beaucoup plus rapidement
    qu'une voiture. Augmenter votre distance de sécurité permet d'éviter les collisions
    arrière.
- id: 172
  category: sharing_the_road
  question: En Nouvelle-Écosse, quelle est l'exigence légale pour les cyclistes concernant
    le port du casque ?
  choices:
    A: Le casque est facultatif pour les adultes de plus de 18 ans
    B: Le casque n'est obligatoire que sur les autoroutes
    C: Le casque est obligatoire pour tous les âges
    D: Le casque n'est obligatoire que pour les enfants de moins de 16 ans
  answer: C
  explanation: En Nouvelle-Écosse, il est obligatoire pour tout le monde — quel que
    soit l'âge — de porter un casque à vélo.
- id: 173
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut avoir
    besoin de :'
  choices:
    A: Rester près de la bordure droite
    B: Faire un large détour vers la gauche avant de tourner
    C: Accélérer pour dégager l'intersection
    D: Tourner depuis la voie la plus à gauche
  answer: B
  explanation: Les gros camions ont un large rayon de braquage et doivent souvent
    s'écarter vers la gauche pour ne pas heurter le trottoir lors d'un virage à droite.
    Les conducteurs ne doivent jamais essayer de se faufiler entre le camion et le
    trottoir.
- id: 174
  category: sharing_the_road
  question: 'Si un véhicule d''urgence avec sirènes et gyrophares s''approche de vous
    par l''arrière sur une rue à double sens, vous devez :'
  choices:
    A: Accélérer pour libérer le passage
    B: Vous arrêter exactement là où vous êtes
    C: Vous ranger vers la droite le plus possible et vous arrêter
    D: Vous ranger vers la gauche et vous arrêter
  answer: C
  explanation: Les conducteurs doivent se ranger vers la bordure droite ou le bord
    de la route et s'arrêter complètement jusqu'à ce que le véhicule d'urgence soit
    passé.
- id: 175
  category: sharing_the_road
  question: Que signifie un piéton portant une canne blanche en Nouvelle-Écosse ?
  choices:
    A: Le piéton est une personne âgée
    B: Le piéton est une personne ayant une déficience visuelle
    C: Le piéton a un problème de mobilité
    D: Le piéton est un brigadier scolaire
  answer: B
  explanation: Une canne blanche est utilisée par les personnes aveugles ou ayant
    une déficience visuelle. Les conducteurs doivent faire preuve d'une extrême prudence
    et céder le passage.
- id: 176
  category: sharing_the_road
  question: 'Lorsqu''un autobus de transport en commun signale son intention de réintégrer
    la circulation à partir d''un arrêt d''autobus, vous devriez :'
  choices:
    A: Accélérer pour dépasser l'autobus
    B: Maintenir votre vitesse ; l'autobus doit attendre une ouverture
    C: Céder le passage et permettre à l'autobus de s'insérer
    D: Klaxonner pour avertir le chauffeur de l'autobus de votre présence
  answer: C
  explanation: En Nouvelle-Écosse, les conducteurs sont encouragés (et dans de nombreuses
    municipalités, obligés par la signalisation) à céder le passage aux autobus de
    transport en commun qui signalent leur intention de réintégrer la circulation
    après un arrêt.
- id: 177
  category: sharing_the_road
  question: 'Une « zone de danger » (No-Zone) fait référence à :'
  choices:
    A: Une zone scolaire où le stationnement est interdit
    B: Les angles morts autour d'un gros camion ou d'un autobus
    C: Une zone où les piétons ne sont pas autorisés
    D: Une zone de construction sans limite de vitesse
  answer: B
  explanation: La « zone de danger » représente les angles morts importants autour
    des camions et des autobus où le conducteur ne peut pas voir les autres véhicules.
    Si vous ne voyez pas les rétroviseurs du conducteur du camion, celui-ci ne peut
    pas vous voir.
- id: 178
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    sur une route divisée par un terre-plein central, laquelle des affirmations suivantes
    est vraie ?
  choices:
    A: La circulation dans les deux sens doit s'arrêter.
    B: Seule la circulation suivant l'autobus doit s'arrêter.
    C: Seule la circulation venant de l'avant doit s'arrêter.
    D: Personne n'est tenu de s'arrêter sur une route divisée.
  answer: B
  explanation: En Nouvelle-Écosse, sur une route divisée par un terre-plein central,
    seuls les conducteurs s'approchant par l'arrière (suivant l'autobus) sont tenus
    de s'arrêter. Les conducteurs circulant dans les voies opposées séparées par le
    terre-plein n'ont pas besoin de s'arrêter.
- id: 179
  category: sharing_the_road
  question: En Nouvelle-Écosse, si vous suivez une motocyclette, quelle est la distance
    de sécurité minimale recommandée dans des conditions idéales ?
  choices:
    A: 1 seconde
    B: 2 secondes
    C: 4 secondes
    D: 6 secondes
  answer: B
  explanation: Bien que 2 secondes soit la distance de sécurité minimale pour tout
    véhicule dans des conditions idéales, elle est particulièrement importante pour
    les motocyclettes car elles peuvent s'arrêter beaucoup plus rapidement que les
    voitures.
- id: 180
  category: sharing_the_road
  question: Lorsqu'un piéton traverse la rue à un passage pour piétons non marqué
    (une intersection sans lignes peintes), que doit faire le conducteur ?
  choices:
    A: Le conducteur a la priorité.
    B: Le conducteur doit céder le passage au piéton.
    C: Le piéton doit attendre une ouverture dans la circulation.
    D: Le conducteur devrait klaxonner pour avertir le piéton.
  answer: B
  explanation: En Nouvelle-Écosse, chaque intersection est considérée comme un passage
    pour piétons, qu'elle soit marquée ou non. Les conducteurs doivent céder le passage
    aux piétons dans les passages pour piétons marqués et non marqués.
- id: 181
  category: sharing_the_road
  question: Lorsque vous dépassez un cycliste en Nouvelle-Écosse, êtes-vous autorisé
    à franchir une ligne jaune continue ?
  choices:
    A: Non, vous ne devez jamais franchir une ligne jaune continue.
    B: Oui, à condition que cela soit sécuritaire et que vous puissiez laisser un
      espace de 1 mètre au cycliste.
    C: Seulement si le cycliste vous fait signe de passer.
    D: Uniquement sur les autoroutes à plusieurs voies.
  answer: B
  explanation: La Loi sur les véhicules à moteur de la Nouvelle-Écosse permet aux
    conducteurs de franchir une ligne jaune (simple ou double continue) pour dépasser
    un cycliste, à condition que cela puisse être fait en toute sécurité et que le
    conducteur maintienne la distance obligatoire de 1 mètre.
- id: 182
  category: sharing_the_road
  question: Quels véhicules sont couverts par la loi « Move Over » (tassez-vous) de
    la Nouvelle-Écosse ?
  choices:
    A: Les véhicules de police et de pompiers uniquement
    B: Les ambulances et les véhicules de police uniquement
    C: Les véhicules d'urgence, les dépanneuses et les véhicules de services publics
      munis de feux clignotants
    D: Tout véhicule dont les feux de détresse sont allumés
  answer: C
  explanation: La loi « Move Over » de la Nouvelle-Écosse s'applique aux véhicules
    d'urgence (police, pompiers, ambulance), aux dépanneuses et aux véhicules de sécurité
    publique ou de services publics du gouvernement lorsque leurs feux clignotent.
- id: 183
  category: sharing_the_road
  question: Que sont les « No-Zones » autour d'un gros camion ?
  choices:
    A: Des zones où le stationnement est interdit.
    B: Des angles morts où le conducteur du camion ne peut pas vous voir.
    C: Des zones de vitesse limitée pour les camions.
    D: Uniquement la zone située directement devant le camion.
  answer: B
  explanation: Les « No-Zones » sont de grands angles morts autour d'un camion (à
    l'avant, à l'arrière et des deux côtés) où la visibilité du conducteur est limitée
    ou inexistante.
- id: 184
  category: sharing_the_road
  question: 'En Nouvelle-Écosse, les cyclistes sont tenus par la loi de :'
  choices:
    A: Circuler sur le trottoir.
    B: Circuler à contre-sens du trafic.
    C: Porter un casque.
    D: Circuler uniquement sur les pistes cyclables désignées.
  answer: C
  explanation: En Nouvelle-Écosse, le port d'un casque de vélo homologué est obligatoire
    pour tous les cyclistes, quel que soit leur âge.
- id: 185
  category: sharing_the_road
  question: 'Lorsqu''un autobus scolaire affiche des feux jaunes (ambre) clignotants,
    cela signifie :'
  choices:
    A: L'autobus est sur le point de s'arrêter et vous devez vous préparer à stopper.
    B: Vous devez vous arrêter immédiatement.
    C: Vous devez accélérer pour dépasser l'autobus avant qu'il ne s'arrête.
    D: L'autobus a un problème mécanique.
  answer: A
  explanation: Les feux jaunes clignotants sur un autobus scolaire indiquent que l'autobus
    se prépare à s'arrêter pour faire monter ou descendre des passagers. Les conducteurs
    doivent ralentir et être prêts à s'arrêter lorsque les feux passent au rouge.
- id: 186
  category: vehicle_information
  question: En Nouvelle-Écosse, quelle est la profondeur de sculpture minimale légale
    pour les pneus d'un véhicule de tourisme ?
  choices:
    A: 1,0 millimètre
    B: 1,5 millimètre
    C: 2,5 millimètres
    D: 3,0 millimètres
  answer: B
  explanation: Selon les règlements sur l'équipement des véhicules de la Nouvelle-Écosse,
    les pneus sont considérés comme dangereux si la profondeur de la sculpture est
    inférieure à 1,5 millimètre (environ 2/32 de pouce).
- id: 187
  category: vehicle_information
  question: Selon la Loi sur les véhicules à moteur de la Nouvelle-Écosse, quand devez-vous
    allumer vos phares en raison de mauvaises conditions de visibilité ?
  choices:
    A: Lorsque vous ne pouvez pas voir clairement à 100 mètres
    B: Lorsque vous ne pouvez pas voir clairement à 150 mètres
    C: Lorsque vous ne pouvez pas voir clairement à 200 mètres
    D: Uniquement lorsqu'il fait nuit noire
  answer: B
  explanation: En Nouvelle-Écosse, les phares doivent être allumés d'une demi-heure
    après le coucher du soleil à une demi-heure avant le lever du soleil, et à tout
    autre moment où la visibilité n'est pas claire à une distance de 150 mètres.
- id: 188
  category: vehicle_information
  question: Quelle est l'exigence de la Nouvelle-Écosse concernant les rétroviseurs
    pour un véhicule de tourisme standard ?
  choices:
    A: Un seul rétroviseur intérieur est requis
    B: Un seul rétroviseur extérieur côté conducteur est requis
    C: Un rétroviseur intérieur et un rétroviseur extérieur côté conducteur sont requis
    D: Trois rétroviseurs sont requis en tout temps
  answer: C
  explanation: 'La loi de la Nouvelle-Écosse exige que les véhicules possèdent au
    moins deux rétroviseurs : un rétroviseur intérieur et un rétroviseur extérieur
    sur le côté gauche (conducteur). Si la vue intérieure est obstruée, un rétroviseur
    extérieur côté droit est également requis.'
- id: 189
  category: vehicle_information
  question: Laquelle des affirmations suivantes est vraie concernant le teintage des
    vitres en Nouvelle-Écosse ?
  choices:
    A: N'importe quel niveau de teinte est autorisé sur le pare-brise
    B: Aucune teinte n'est autorisée sur le pare-brise ou les vitres latérales avant
    C: La teinte est autorisée sur les vitres latérales avant tant qu'elle est transparente
      à 50 %
    D: La teinte n'est autorisée que sur le pare-brise
  answer: B
  explanation: En Nouvelle-Écosse, il est illégal d'appliquer tout film teinté sur
    le pare-brise ou sur les vitres situées directement à gauche et à droite du conducteur
    (vitres latérales avant).
- id: 190
  category: vehicle_information
  question: 'Selon la loi de la Nouvelle-Écosse, tout véhicule à moteur doit être
    équipé d''un frein de stationnement capable de maintenir le véhicule :'
  choices:
    A: Sur une surface plane uniquement
    B: Uniquement lorsque le véhicule est vide
    C: Sur n'importe quelle pente sur laquelle il circule
    D: Uniquement lorsque le moteur tourne
  answer: C
  explanation: La Loi sur les véhicules à moteur précise que le frein de stationnement
    doit être capable de maintenir le véhicule sur n'importe quelle pente où il est
    conduit, quelle que soit la charge.
- id: 191
  category: vehicle_information
  question: 'En Nouvelle-Écosse, l''avertisseur sonore d''un véhicule à moteur doit
    être audible dans des conditions normales à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Les règlements de la Nouvelle-Écosse exigent qu'un avertisseur sonore
    soit en bon état de fonctionnement et capable d'émettre un son audible à une distance
    d'au moins 60 mètres.
- id: 192
  category: vehicle_information
  question: 'En Nouvelle-Écosse, la plaque d''immatriculation arrière doit être éclairée
    de manière à être clairement lisible à une distance de :'
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 25 mètres
  answer: C
  explanation: La plaque d'immatriculation arrière doit être éclairée par une lumière
    blanche afin que les caractères soient visibles à une distance de 15 mètres vers
    l'arrière.
- id: 193
  category: vehicle_information
  question: En Nouvelle-Écosse, si un chargement dépasse de plus de combien de mètres
    l'arrière de la carrosserie du véhicule, un drapeau rouge ou un feu rouge doit
    y être fixé ?
  choices:
    A: 0,5 mètre
    B: 1,0 mètre
    C: 1,5 mètre
    D: 2,0 mètres
  answer: B
  explanation: En Nouvelle-Écosse, si un chargement dépasse de 1,0 mètre (environ
    3 pieds) ou plus l'arrière du véhicule, un drapeau rouge (le jour) ou un feu rouge
    (la nuit) doit être installé à l'extrémité du chargement.
- id: 194
  category: vehicle_information
  question: Quelle est la loi de la Nouvelle-Écosse concernant les silencieux de véhicule
    ?
  choices:
    A: Les silencieux sont facultatifs sur les véhicules de plus de 20 ans
    B: Les silencieux peuvent être contournés si le conducteur se trouve dans une
      zone rurale
    C: Chaque véhicule à moteur doit être muni d'un silencieux en bon état de fonctionnement
      pour éviter tout bruit excessif
    D: Les dispositifs de dérivation du silencieux sont autorisés pour une meilleure
      efficacité énergétique
  answer: C
  explanation: La loi de la Nouvelle-Écosse exige que tous les véhicules à moteur
    soient équipés d'un silencieux en bon état de fonctionnement. Les dispositifs
    de dérivation, les contournements ou autres dispositifs similaires sont interdits.
- id: 195
  category: vehicle_information
  question: À quelle fréquence la plupart des véhicules de tourisme privés doivent-ils
    subir une inspection de sécurité en Nouvelle-Écosse ?
  choices:
    A: Tous les 6 mois
    B: Chaque année
    C: Tous les 2 ans
    D: Tous les 5 ans
  answer: C
  explanation: En Nouvelle-Écosse, la plupart des véhicules de tourisme privés sont
    tenus de subir une inspection de sécurité officielle tous les deux ans.
- id: 196
  category: vehicle_information
  question: 'En Nouvelle-Écosse, les feux arrière doivent être rouges et doivent être
    visibles à une distance d''au moins :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 250 mètres
  answer: B
  explanation: La loi sur les véhicules à moteur de la Nouvelle-Écosse exige que les
    feux arrière soient visibles à une distance de 150 mètres vers l'arrière.
- id: 197
  category: vehicle_information
  question: Laquelle des conditions suivantes est une exigence pour le pare-brise
    d'un véhicule en Nouvelle-Écosse ?
  choices:
    A: Il doit être fait de verre de sécurité
    B: Il peut présenter des fissures mineures tant qu'elles se trouvent du côté passager
    C: Il doit être recouvert d'un film plastique protecteur
    D: Il doit être remplacé tous les 5 ans, quel que soit son état
  answer: A
  explanation: La loi de la Nouvelle-Écosse exige que tout le verre automobile, y
    compris le pare-brise, soit fait de verre de sécurité approuvé afin d'éviter qu'il
    ne vole en éclats en cas d'impact.
- id: 198
  category: vehicle_information
  question: 'En Nouvelle-Écosse, vous devez passer vos phares en feux de croisement
    lorsque vous suivez un autre véhicule à une distance de :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Lorsque vous suivez un autre véhicule par l'arrière, vous devez baisser
    vos feux de route (passer en feux de croisement) lorsque vous vous trouvez à moins
    de 60 mètres de ce véhicule.
- id: 199
  category: vehicle_information
  question: Selon la loi de la Nouvelle-Écosse, quand les phares d'un véhicule doivent-ils
    être allumés ?
  choices:
    A: Du coucher au lever du soleil
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: De 30 minutes après le coucher du soleil à 30 minutes avant le lever du soleil
    D: Uniquement lorsqu'il pleut ou qu'il neige
  answer: C
  explanation: Les phares doivent être allumés de 30 minutes après le coucher du soleil
    à 30 minutes avant le lever du soleil, et à tout autre moment où la visibilité
    est inférieure à 150 mètres.
- id: 200
  category: vehicle_information
  question: Quelle est l'exigence relative aux rétroviseurs pour un véhicule de tourisme
    immatriculé en Nouvelle-Écosse ?
  choices:
    A: Un seul rétroviseur intérieur est requis
    B: Un rétroviseur intérieur et un rétroviseur extérieur gauche
    C: Deux rétroviseurs extérieurs uniquement
    D: Un rétroviseur intérieur et deux rétroviseurs extérieurs
  answer: B
  explanation: 'La loi de la Nouvelle-Écosse exige que chaque véhicule à moteur soit
    équipé d''au moins deux rétroviseurs : un rétroviseur intérieur et un rétroviseur
    extérieur du côté gauche.'
- id: 201
  category: vehicle_information
  question: 'Tout véhicule à moteur en Nouvelle-Écosse doit être équipé de deux moyens
    distincts d''actionner les freins. Il s''agit de :'
  choices:
    A: Un frein au pied et un frein d'urgence ou de stationnement
    B: Des freins avant et des freins arrière
    C: Des freins hydrauliques et des freins à air
    D: Des freins manuels et des freins automatiques
  answer: A
  explanation: La Loi sur les véhicules à moteur exige que les véhicules soient équipés
    d'un frein de service (frein au pied) et d'un frein de stationnement, chacun étant
    capable d'arrêter le véhicule.
- id: 202
  category: vehicle_information
  question: 'En Nouvelle-Écosse, le silencieux d''un véhicule doit être en bon état
    de fonctionnement pour éviter :'
  choices:
    A: La surchauffe du moteur
    B: Un bruit excessif ou inhabituel et une fumée gênante
    C: Une perte d'efficacité énergétique
    D: Les émissions de dioxyde de carbone
  answer: B
  explanation: La Loi sur les véhicules à moteur précise que les silencieux doivent
    empêcher les bruits excessifs et la fumée gênante ; les dispositifs de dérivation
    ou de contournement du silencieux sont illégaux.
- id: 203
  category: vehicle_information
  question: Quelle est la largeur maximale autorisée pour un véhicule (chargement
    compris) sur les routes de la Nouvelle-Écosse sans permis spécial ?
  choices:
    A: 2,4 mètres
    B: 2,6 mètres
    C: 3,0 mètres
    D: 3,2 mètres
  answer: B
  explanation: La largeur maximale d'un véhicule et de son chargement sur les routes
    de la Nouvelle-Écosse est de 2,6 mètres.
- id: 204
  category: vehicle_information
  question: 'En Nouvelle-Écosse, les phares de route (pleins phares) doivent être
    assez puissants pour révéler des personnes et des véhicules à une distance d''au
    moins :'
  choices:
    A: 60 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: B
  explanation: Les phares de route (faisceau supérieur) doivent être suffisants pour
    révéler des personnes et des véhicules à une distance d'au moins 100 mètres devant
    le véhicule.
- id: 205
  category: vehicle_information
  question: Si vous remorquez une remorque en Nouvelle-Écosse, quelle est l'exigence
    concernant les chaînes de sécurité ?
  choices:
    A: Elles ne sont requises que pour les remorques de plus de 2 000 kg
    B: Elles sont recommandées mais pas légalement obligatoires
    C: La remorque doit être reliée au véhicule tracteur par au moins une chaîne de
      sécurité
    D: Des chaînes de sécurité doivent être utilisées et doivent être croisées sous
      le timon de la remorque
  answer: D
  explanation: Les règlements de la Nouvelle-Écosse exigent que les remorques soient
    équipées de chaînes de sécurité suffisamment solides pour retenir la remorque
    en cas de défaillance de l'attelage, et elles doivent être croisées pour soutenir
    le timon.
- id: 206
  category: signs_and_signals
  question: En Nouvelle-Écosse, que devez-vous faire à l'approche d'un feu rouge clignotant
    ?
  choices:
    A: Ralentir et avancer avec prudence
    B: S'arrêter et ne repartir que lorsqu'il est sécuritaire de le faire
    C: S'arrêter et attendre que le feu passe au vert
    D: Céder le passage à toute la circulation mais ne pas s'arrêter complètement
  answer: B
  explanation: Selon le Guide du conducteur de la Nouvelle-Écosse, un feu rouge clignotant
    signifie que vous devez effectuer un arrêt complet et céder le passage à la circulation
    qui se trouve dans l'intersection ou qui s'en approche. Vous ne pouvez repartir
    que lorsque c'est sécuritaire.
- id: 207
  category: signs_and_signals
  question: Lorsqu'un signal lumineux affiche une flèche verte fixe combinée à un
    feu rouge, qu'êtes-vous autorisé à faire ?
  choices:
    A: S'arrêter et attendre que le feu rouge change
    B: Avancer avec prudence dans la direction de la flèche uniquement
    C: Tourner dans n'importe quelle direction à condition de céder le passage aux
      piétons
    D: Faire un demi-tour
  answer: B
  explanation: Une flèche verte affichée avec un feu rouge signifie que vous pouvez
    entrer dans l'intersection pour effectuer le mouvement indiqué par la flèche,
    mais vous devez céder le passage aux piétons et aux autres véhicules utilisant
    légalement l'intersection.
- id: 208
  category: signs_and_signals
  question: Que signifie un feu jaune (ambre) clignotant en Nouvelle-Écosse ?
  choices:
    A: S'arrêter et attendre que le feu passe au vert
    B: Le feu est sur le point de passer au rouge
    C: Ralentir et avancer avec prudence
    D: Des piétons traversent devant
  answer: C
  explanation: Un feu jaune clignotant est un avertissement vous incitant à ralentir
    et à faire preuve d'une prudence accrue face à la circulation transversale ou
    aux dangers.
- id: 209
  category: signs_and_signals
  question: Vous conduisez sur une route à plusieurs voies et voyez une ligne blanche
    continue entre votre voie et celle d'à côté. Qu'est-ce que cela indique ?
  choices:
    A: Les changements de voie sont encouragés
    B: Les changements de voie sont déconseillés ou interdits
    C: La circulation se déplace dans des directions opposées
    D: La voie se termine
  answer: B
  explanation: En Nouvelle-Écosse, une ligne blanche continue est utilisée pour décourager
    les changements de voie là où ils pourraient être dangereux, comme à l'approche
    des intersections ou dans les tunnels.
- id: 210
  category: signs_and_signals
  question: Quel est le signal manuel correct pour indiquer un virage à droite ?
  choices:
    A: Le bras gauche tendu horizontalement par la fenêtre
    B: Le bras gauche sorti et plié vers le bas
    C: Le bras gauche sorti et plié vers le haut
    D: Le bras droit tendu horizontalement par la fenêtre
  answer: C
  explanation: Pour signaler un virage à droite à l'aide de signaux manuels, le conducteur
    doit sortir son bras gauche par la fenêtre et le plier vers le haut au niveau
    du coude.
- id: 211
  category: signs_and_signals
  question: 'En Nouvelle-Écosse, un signal à barre verticale blanche (signal de priorité
    au transport en commun) situé au-dessus d''un feu de circulation ordinaire signifie
    :'
  choices:
    A: Tout le trafic doit s'arrêter
    B: Seuls les véhicules d'urgence peuvent circuler
    C: Seuls les autobus de transport en commun peuvent circuler
    D: Le feu est sur le point de passer au vert pour tout le monde
  answer: C
  explanation: Une barre verticale blanche sur fond noir est un signal de priorité
    au transport en commun, permettant aux autobus de traverser l'intersection pendant
    que les autres véhicules font face à un feu rouge.
- id: 212
  category: signs_and_signals
  question: À l'approche d'un panneau d'arrêt, où devez-vous immobiliser complètement
    votre véhicule s'il n'y a pas de ligne d'arrêt marquée ni de passage pour piétons
    ?
  choices:
    A: 5 mètres avant le panneau
    B: Directement à côté du panneau d'arrêt
    C: À la limite du trottoir ou de l'intersection
    D: N'importe où, tant que vous pouvez voir la circulation transversale
  answer: C
  explanation: S'il n'y a pas de ligne d'arrêt ou de passage pour piétons, la loi
    sur les véhicules à moteur de la Nouvelle-Écosse (Motor Vehicle Act) exige que
    vous vous arrêtiez au point le plus proche de la chaussée transversale d'où vous
    avez une vue sur la circulation approchante.
- id: 213
  category: signs_and_signals
  question: Que représente un panneau jaune en forme de losange avec le symbole noir
    d'une personne qui marche ?
  choices:
    A: Zone scolaire à venir
    B: Passage pour piétons à venir
    C: Aire de jeux
    D: Zone d'auto-stop
  answer: B
  explanation: Un panneau jaune en forme de losange avec un symbole de piéton est
    un panneau d'avertissement indiquant qu'un passage pour piétons se trouve devant
    vous.
- id: 214
  category: signs_and_signals
  question: En Nouvelle-Écosse, que signifie une ligne jaune continue de votre côté
    d'une ligne jaune pointillée ?
  choices:
    A: Vous pouvez dépasser si c'est sécuritaire
    B: Vous êtes dans une zone à sens unique
    C: Le dépassement vous est interdit
    D: Le dépassement est interdit pour la circulation en sens inverse
  answer: C
  explanation: Une ligne jaune continue de votre côté de la ligne centrale signifie
    qu'il est dangereux et illégal de dépasser d'autres véhicules.
- id: 215
  category: signs_and_signals
  question: Lorsque vous voyez un panneau orange en forme de losange, à quoi devez-vous
    vous attendre ?
  choices:
    A: Une zone hospitalière
    B: Une route panoramique
    C: Des travaux de construction ou d'entretien à venir
    D: L'entrée d'un parc provincial
  answer: C
  explanation: Les panneaux oranges sont utilisés spécifiquement pour les avertissements
    de construction et d'entretien en Nouvelle-Écosse.
- id: 216
  category: signs_and_signals
  question: Quelle est la signification d'un panneau « Cédez le passage » (un triangle
    inversé avec une bordure rouge) ?
  choices:
    A: S'arrêter et attendre le feu vert
    B: Ralentir et se préparer à s'arrêter pour laisser passer les autres véhicules
      ou les piétons
    C: Accélérer pour s'insérer dans la circulation
    D: Vous avez la priorité sur tous les autres véhicules
  answer: B
  explanation: Un panneau de cédez-le-passage signifie que vous devez ralentir et,
    si nécessaire, vous arrêter pour accorder la priorité à tout véhicule ou piéton
    se trouvant dans l'intersection ou sur la route de raccordement.
- id: 217
  category: signs_and_signals
  question: Lorsqu'un signal pour piétons « Ne pas marcher » ou une « Main » clignote,
    qu'est-ce que cela signifie pour un conducteur ?
  choices:
    A: Les conducteurs doivent s'arrêter immédiatement
    B: Les piétons déjà engagés dans le passage doivent finir de traverser ; aucun
      nouveau piéton ne doit s'engager
    C: Le feu de circulation est sur le point de passer au vert
    D: Les conducteurs peuvent tourner à droite sans céder le passage
  answer: B
  explanation: Un signal « Ne pas marcher » clignotant indique que les piétons ne
    doivent pas commencer à traverser, mais que ceux qui sont déjà dans le passage
    doivent continuer jusqu'à l'autre côté. Les conducteurs doivent toujours céder
    le passage à ceux qui se trouvent dans le passage pour piétons.
- id: 218
  category: signs_and_signals
  question: En Nouvelle-Écosse, est-il permis de tourner à gauche au feu rouge ?
  choices:
    A: Jamais
    B: Uniquement lors d'un virage d'une rue à sens unique vers une autre rue à sens
      unique
    C: Uniquement s'il n'y a pas de panneau « Interdiction de tourner à gauche »
    D: Uniquement entre minuit et 5 h du matin
  answer: B
  explanation: Selon la loi de la Nouvelle-Écosse, vous ne pouvez tourner à gauche
    au feu rouge que si vous passez d'une rue à sens unique à une autre rue à sens
    unique, après avoir marqué un arrêt complet et cédé le passage aux piétons et
    aux autres véhicules.
- id: 219
  category: signs_and_signals
  question: Que signifie un panneau comportant un cercle vert autour d'une flèche
    noire pointant droit devant ?
  choices:
    A: Vous devez aller tout droit ; aucun virage n'est autorisé
    B: Vous pouvez aller tout droit ou tourner
    C: Rue à sens unique devant
    D: Route pour camions seulement
  answer: A
  explanation: Un cercle vert est un panneau d'autorisation. S'il contient une flèche
    droite, cela signifie que vous êtes autorisé à aller tout droit uniquement ; il
    est interdit de tourner à cette intersection.
- id: 220
  category: signs_and_signals
  question: Que indiquent les doubles lignes blanches continues sur une chaussée ?
  choices:
    A: Le dépassement est autorisé dans les deux sens
    B: La route est réservée aux véhicules multioccupants (VMO)
    C: Il est interdit de franchir les lignes pour changer de voie
    D: Vous approchez d'un passage à niveau
  answer: C
  explanation: Les doubles lignes blanches continues indiquent que le changement de
    voie est interdit. Vous devez rester dans votre voie.
- id: 221
  category: signs_and_signals
  question: En Nouvelle-Écosse, que signifie un feu rouge clignotant à une intersection
    ?
  choices:
    A: Ralentissez et avancez avec prudence
    B: Le signal est en panne ; traitez-le comme un arrêt multidirectionnel (four-way
      stop)
    C: Arrêtez-vous, cédez le passage à la circulation et aux piétons, et avancez
      quand cela est sécuritaire
    D: Arrêtez-vous et attendez que le feu passe au vert
  answer: C
  explanation: Selon le Guide du conducteur de la Nouvelle-Écosse, un feu rouge clignotant
    signifie que vous devez marquer un arrêt complet et céder le passage aux autres
    véhicules et aux piétons avant de repartir lorsque la voie est libre.
- id: 222
  category: signs_and_signals
  question: Quelle est la signification d'un feu jaune (ambre) clignotant à une intersection
    en Nouvelle-Écosse ?
  choices:
    A: Arrêtez-vous et attendez que le feu passe au vert
    B: Ralentissez et avancez avec prudence
    C: Accélérez pour dégager l'intersection rapidement
    D: Traitez-le comme un panneau d'arrêt
  answer: B
  explanation: Un feu jaune clignotant est un avertissement vous invitant à ralentir
    et à vous préparer à arrêter, tout en traversant l'intersection avec prudence.
- id: 223
  category: signs_and_signals
  question: 'Une ligne blanche continue tracée en travers d''une voie à une intersection
    indique :'
  choices:
    A: Un passage pour piétons uniquement
    B: Une ligne d'arrêt où vous devez vous arrêter pour un feu rouge ou un panneau
      d'arrêt
    C: La zone où vous devez vous stationner
    D: Une voie réservée aux autobus
  answer: B
  explanation: Une ligne blanche continue en travers d'une voie est une ligne d'arrêt,
    indiquant le point exact où un conducteur doit s'arrêter devant un signal de circulation
    ou un panneau d'arrêt.
- id: 224
  category: signs_and_signals
  question: En Nouvelle-Écosse, que signifie un signal de « priorité au transport
    en commun » (une barre verticale blanche fixe sur fond noir) ?
  choices:
    A: Tous les véhicules peuvent continuer tout droit
    B: Seuls les véhicules d'urgence peuvent passer
    C: Seuls les autobus de transport en commun peuvent passer alors que les autres
      véhicules font face à un feu rouge
    D: La voie est fermée pour cause de travaux
  answer: C
  explanation: La barre verticale blanche est un signal de priorité au transport en
    commun qui permet aux autobus de traverser l'intersection pendant que les autres
    véhicules sont immobilisés par un feu rouge.
- id: 225
  category: signs_and_signals
  question: Que représente un symbole en forme de losange peint sur une voie de circulation
    en Nouvelle-Écosse ?
  choices:
    A: Une voie de dépassement à grande vitesse
    B: 'Une voie réservée à certains types de véhicules (ex. : autobus ou covoiturage)'
    C: Une intersection dangereuse à venir
    D: Une zone scolaire
  answer: B
  explanation: Le symbole du losange indique une voie réservée, généralement pour
    les autobus, les vélos ou les véhicules à forte occupation (VFO).
- id: 226
  category: signs_and_signals
  question: Lorsqu'un conducteur sort son bras gauche par la fenêtre et le pointe
    vers le haut, quel signal donne-t-il ?
  choices:
    A: Virage à gauche
    B: Virage à droite
    C: Arrêt ou ralentissement
    D: Céder le passage
  answer: B
  explanation: Le signal manuel pour un virage à droite consiste à sortir le bras
    gauche et à le plier vers le haut au niveau du coude.
- id: 227
  category: signs_and_signals
  question: Que signifient les doubles lignes jaunes continues au centre de la chaussée
    ?
  choices:
    A: Le dépassement est autorisé dans les deux directions
    B: Le dépassement est autorisé uniquement pendant la journée
    C: Le dépassement est interdit dans les deux directions
    D: Circulation à sens unique seulement
  answer: C
  explanation: Les doubles lignes jaunes continues indiquent que le dépassement n'est
    pas autorisé pour les véhicules circulant dans l'une ou l'autre direction.
- id: 228
  category: signs_and_signals
  question: 'En Nouvelle-Écosse, un panneau de signalisation avec un fond orange et
    des symboles noirs indique :'
  choices:
    A: Une exigence réglementaire
    B: Une zone scolaire
    C: Un avertissement de travaux de construction ou d'entretien
    D: Des informations directionnelles pour les touristes
  answer: C
  explanation: Les panneaux oranges sont utilisés spécifiquement pour les avertissements
    de construction et d'entretien afin d'alerter les conducteurs des conditions routières
    temporaires.
- id: 229
  category: signs_and_signals
  question: Que devez-vous faire lorsque vous voyez un panneau « Cédez le passage
    » à une intersection ?
  choices:
    A: S'arrêter complètement à chaque fois
    B: Accélérer pour s'insérer avant les autres véhicules
    C: Ralentir et céder le passage aux véhicules se trouvant dans l'intersection
      ou sur la route transversale
    D: L'ignorer s'il n'y a pas d'autres voitures visibles
  answer: C
  explanation: Un panneau de céder le passage vous oblige à ralentir et à vous préparer
    à arrêter, en accordant la priorité à tout véhicule ou piéton se trouvant dans
    l'intersection ou s'en approchant.
- id: 230
  category: signs_and_signals
  question: 'Un feu vert clignotant à une intersection en Nouvelle-Écosse (qui n''est
    pas activé par un piéton) signifie généralement :'
  choices:
    A: Vous avez un virage à gauche protégé
    B: Le feu est sur le point de passer au rouge
    C: Vous pouvez continuer tout droit, tourner à gauche ou tourner à droite
    D: Des véhicules d'urgence approchent
  answer: C
  explanation: En Nouvelle-Écosse, un feu vert clignotant permet de continuer tout
    droit ou de tourner, mais vous devez tout de même céder le passage aux piétons
    et à la circulation venant en sens inverse si vous tournez à gauche, à moins qu'une
    flèche verte ne soit présente.
- id: 231
  category: signs_and_signals
  question: Que signifie une ligne blanche pointillée entre deux voies de circulation
    ?
  choices:
    A: La circulation se fait dans des directions opposées ; le dépassement est autorisé
    B: La circulation se fait dans la même direction ; le changement de voie est autorisé
    C: La voie se termine bientôt
    D: Vous devez vous arrêter avant de franchir la ligne
  answer: B
  explanation: Les lignes blanches séparent la circulation se déplaçant dans la même
    direction. Une ligne blanche pointillée indique que les changements de voie sont
    autorisés lorsque cela peut être fait en toute sécurité.
- id: 232
  category: signs_and_signals
  question: Si vous approchez d'un passage à niveau et que les feux rouges clignotent,
    à quelle distance devez-vous arrêter votre véhicule ?
  choices:
    A: À au moins 1 mètre du rail le plus proche
    B: À au moins 5 mètres du rail le plus proche
    C: À au moins 15 mètres du rail le plus proche
    D: À au moins 30 mètres du rail le plus proche
  answer: B
  explanation: En vertu de la loi sur les véhicules à moteur de la Nouvelle-Écosse
    (Nova Scotia Motor Vehicle Act), lorsqu'un dispositif de signalisation à un passage
    à niveau donne un avertissement, le conducteur doit arrêter le véhicule à au moins
    cinq mètres du rail le plus proche.
- id: 233
  category: signs_and_signals
  question: 'Un panneau en forme de pentagone (cinq côtés) représentant deux personnes
    qui marchent indique :'
  choices:
    A: Une aire de jeux
    B: Une zone hospitalière
    C: Une zone scolaire ou un passage pour écoliers
    D: Un parc public
  answer: C
  explanation: Le panneau en forme de pentagone est le signal d'avertissement standard
    pour une zone scolaire ou un passage pour écoliers.
- id: 234
  category: signs_and_signals
  question: 'Lorsqu''un feu de circulation passe du vert à l''ambre (jaune) à l''approche
    d''une intersection, vous devez :'
  choices:
    A: Accélérer pour dégager l'intersection avant le feu rouge
    B: S'arrêter si vous pouvez le faire en toute sécurité ; sinon, avancer avec prudence
    C: Toujours s'arrêter, même si vous êtes au milieu de l'intersection
    D: Klaxonner pour avertir les autres que vous ne vous arrêtez pas
  answer: B
  explanation: Un feu ambre signifie que le signal est sur le point de passer au rouge.
    Vous devez vous arrêter si vous pouvez le faire en toute sécurité. Si vous êtes
    déjà dans l'intersection ou trop proche pour vous arrêter en toute sécurité, vous
    devez avancer avec prudence.
