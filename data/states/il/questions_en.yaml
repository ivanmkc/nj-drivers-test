metadata:
  source: 2025 Illinois Rules of the Road (ilsos.gov)
  total_questions: 429
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: By what date will the federal government require your driver's license
    or ID card to be REAL ID compliant to board domestic flights?
  choices:
    A: May 7, 2024
    B: May 7, 2025
    C: January 1, 2025
    D: October 1, 2025
  answer: B
  explanation: The U.S. Department of Homeland Security extended the deadline to May
    7, 2025, meaning the federal government will require a REAL ID compliant card
    to board domestic flights by this date.
- id: 2
  category: license_system
  question: After May 7, 2025, which of the following will a standard Illinois driver's
    license NOT be accepted for?
  choices:
    A: Driving a vehicle
    B: General identification purposes
    C: Boarding a domestic flight
    D: Applying for a standard ID renewal
  answer: C
  explanation: According to the manual, a standard DL/ID will not be accepted for
    boarding a domestic flight (U.S.) or entering a military base/secure federal facility
    after May 7, 2025.
- id: 3
  category: license_system
  question: When applying for a REAL ID, how many current residency documents with
    your name must you provide?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Step 4 of the REAL ID application process requires you to provide two
    current residency documents with your name, such as a utility bill or rental agreement.
- id: 4
  category: license_system
  question: Which of the following is an acceptable document to provide proof of your
    full Social Security number (SSN) when applying for a REAL ID?
  choices:
    A: A utility bill
    B: A W-2 form
    C: A credit card
    D: A rental agreement
  answer: B
  explanation: Step 3 of the REAL ID application process states that examples of proof
    of full SSN include an SSN card, a W-2, or a pay stub with the full SSN.
- id: 5
  category: license_system
  question: Will the Transportation Security Administration (TSA) accept your temporary,
    secure paper REAL ID document for boarding a flight?
  choices:
    A: Yes, if accompanied by a credit card
    B: Yes, it is fully valid for all federal purposes
    C: No, the TSA and federal agents will not accept the paper document
    D: Yes, but only for international flights
  answer: C
  explanation: Step 6 of the REAL ID application process explicitly notes that the
    TSA and federal agents will not accept the temporary paper document.
- id: 6
  category: license_system
  question: How does the fee for a REAL ID compare to the fee for a standard driver's
    license or ID?
  choices:
    A: The REAL ID costs more
    B: The standard DL/ID costs more
    C: The fees for a REAL ID and a standard DL/ID are the same
    D: The REAL ID is free for all Illinois residents
  answer: C
  explanation: The manual states clearly that 'Fees for a REAL ID and a standard DL/ID
    are the same.'
- id: 7
  category: license_system
  question: If your name has changed and you are using a marriage certificate to prove
    your identity for a REAL ID, what type of marriage certificate is acceptable?
  choices:
    A: A photocopy of a marriage certificate
    B: A certificate issued by a church
    C: A certified marriage certificate from the County Clerk's office
    D: A notarized letter from your spouse
  answer: C
  explanation: The manual specifies that a certified marriage certificate must be
    certified by the County Clerk's office, and that a certificate issued by a church
    is not acceptable.
- id: 8
  category: license_system
  question: If the name on your birth certificate is different from your current legal
    name, in which situation are additional name change documents NOT required for
    a REAL ID?
  choices:
    A: If you have a valid passport with your current legal name
    B: If you have a utility bill with your current name
    C: If you have a canceled check with your current name
    D: If you have a standard Illinois driver's license
  answer: A
  explanation: The manual notes that if you have a valid passport with your current
    legal name, additional name change documents are NOT required.
- id: 9
  category: license_system
  question: After your documents have been reviewed and verified at the facility,
    when will you receive your new permanent REAL ID card?
  choices:
    A: Immediately at the facility
    B: It will be mailed within 5 business days
    C: It will be mailed within 15 business days
    D: It will be mailed within 30 business days
  answer: C
  explanation: Step 7 of the REAL ID application process states that your new permanent
    REAL ID card will be mailed to you within 15 business days.
- id: 10
  category: license_system
  question: You do NOT need to obtain a REAL ID to board domestic flights if you already
    possess which of the following?
  choices:
    A: A standard Illinois driver's license
    B: A valid U.S. passport or passport card
    C: A certified birth certificate
    D: A temporary paper ID
  answer: B
  explanation: 'The manual states ''You DO NOT NEED a REAL ID if: You have a valid
    U.S. passport or passport card.'''
- id: 11
  category: license_system
  question: Which of the following can be used as proof of signature when applying
    for a REAL ID?
  choices:
    A: A utility bill
    B: A birth certificate
    C: A canceled check
    D: A W-2 form
  answer: C
  explanation: Step 5 of the REAL ID application process lists examples of proof of
    signature, which include a credit/debit card, canceled check, or current Illinois
    DL/ID.
- id: 12
  category: license_system
  question: What is required if your legal name has changed multiple times since birth
    and you do not have a valid passport with your current name?
  choices:
    A: Only your most recent name change document is required
    B: Multiple name change documents will be required
    C: You cannot apply for a REAL ID
    D: A single utility bill with your current name is sufficient
  answer: B
  explanation: The manual explicitly states under the 'Has Your NAME CHANGED?' section
    that 'Multiple name change documents will be required if your name has changed
    multiple times.'
- id: 13
  category: license_system
  question: When providing a court-certified name change order to verify your identity
    for a REAL ID, are photocopies acceptable?
  choices:
    A: Yes, if they are clear and legible
    B: Yes, but only if they are in color
    C: No, copies of documents are not acceptable
    D: Yes, if accompanied by a utility bill
  answer: C
  explanation: The manual states under accepted documents to prove identity if your
    name has changed that 'Copies of documents are not acceptable.'
- id: 14
  category: alcohol_drugs_health
  question: What does the acronym BAC stand for in relation to driving under the influence?
  choices:
    A: Blood-Alcohol Content
    B: Blood-Alcohol Concentration
    C: Breath-Alcohol Concentration
    D: Basic Alcohol Consumption
  answer: B
  explanation: The manual refers to BAC as "Blood-Alcohol Concentration" in the section
    regarding driving under the influence.
- id: 15
  category: safe_driving_rules
  question: Which of the following terms is used alongside a "rotary" to describe
    a specific type of intersection?
  choices:
    A: Traffic circle
    B: Roundabout
    C: Cul-de-sac
    D: Turnaround
  answer: B
  explanation: The manual groups these intersection types together under the heading
    "Rotary and Roundabout."
- id: 16
  category: sharing_the_road
  question: According to the manual, bicycles shared on the road can be powered in
    which of the following ways?
  choices:
    A: Manual only
    B: Manual or gas powered only
    C: Manual, gas, or electric powered
    D: Electric powered only
  answer: C
  explanation: The manual specifically categorizes bicycles as "Manual, Gas or Electric
    Powered" when discussing sharing the road.
- id: 17
  category: penalties_and_points
  question: What are the four types of actions that can be taken against a driver's
    license as listed in the manual?
  choices:
    A: Revocation, Suspension, Denial, and Cancellation
    B: Suspension, Probation, Warning, and Revocation
    C: Cancellation, Confiscation, Suspension, and Denial
    D: Revocation, Restriction, Suspension, and Probation
  answer: A
  explanation: Chapter 8 of the manual covers "Driver’s License Revocation, Suspension,
    Denial and Cancellation."
- id: 18
  category: vehicle_information
  question: What are the two main categories of vehicle equipment discussed for safe
    driving?
  choices:
    A: Standard and Optional Equipment
    B: Required and Restricted Equipment
    C: Factory and Aftermarket Equipment
    D: Primary and Secondary Equipment
  answer: B
  explanation: The manual divides equipment for safe driving into "Required Equipment"
    and "Restricted Equipment."
- id: 19
  category: alcohol_drugs_health
  question: What types of cannabis (marijuana) are specifically addressed in the DUI
    section of the manual?
  choices:
    A: Recreational only
    B: Medical only
    C: Medical and Recreational
    D: Synthetic and Natural
  answer: C
  explanation: The manual includes a specific section on "Medical and Recreational
    Cannabis (Marijuana)" under Driving Under the Influence.
- id: 20
  category: driver_responsibility
  question: Which of the following laws is associated with traffic crashes and financial
    accountability?
  choices:
    A: Safety Responsibility Law
    B: Vehicle Protection Law
    C: Driver Accountability Act
    D: Highway Safety Law
  answer: A
  explanation: The "Safety Responsibility Law" is listed in the manual under the Traffic
    Violations/Crashes chapter.
- id: 21
  category: sharing_the_road
  question: Which of the following vehicles are grouped together with scooters in
    the manual's sharing the road guidelines?
  choices:
    A: Motorcycles
    B: Autocycles
    C: Mopeds
    D: Snowmobiles
  answer: C
  explanation: The manual pairs these vehicles together under the section "Scooters
    and Mopeds."
- id: 22
  category: signs_and_signals
  question: Which of the following is a specific type of sign used in construction
    and maintenance areas?
  choices:
    A: Portable Changeable Message Signs
    B: Permanent Digital Displays
    C: Temporary Painted Signs
    D: Reflective Barricade Signs
  answer: A
  explanation: '"Portable Changeable Message Signs" are specifically listed alongside
    Construction and Maintenance Signs in the manual.'
- id: 23
  category: sharing_the_road
  question: Which of the following is a specific category of pedestrians highlighted
    in the sharing the road chapter?
  choices:
    A: Teenagers
    B: Children
    C: Senior Citizens
    D: Construction Workers
  answer: B
  explanation: '"Children" are given their own specific section immediately following
    Pedestrians in the Sharing the Road chapter.'
- id: 24
  category: defensive_driving
  question: Which of the following is listed as a specific driver condition that affects
    safe driving?
  choices:
    A: Drowsy Driving
    B: Hungry Driving
    C: Distracted Driving
    D: Emotional Driving
  answer: A
  explanation: '"Drowsy Driving" is explicitly listed as a topic under Safe Driving
    Tips.'
- id: 25
  category: signs_and_signals
  question: Roadway signs are primarily categorized by their colors, functions (such
    as regulatory or warning), and what other physical characteristic?
  choices:
    A: Size
    B: Material
    C: Shapes
    D: Reflectivity
  answer: C
  explanation: The manual categorizes signs by "Shapes of Signs" and "Colors of Signs."
- id: 26
  category: defensive_driving
  question: What specific safety protocols are outlined for drivers whose vehicles
    break down on the road?
  choices:
    A: Disabled Vehicle Guidelines
    B: Stranded Motorists’ Safety Protocols
    C: Emergency Roadside Procedures
    D: Highway Breakdown Rules
  answer: B
  explanation: The manual includes a section specifically titled "Stranded Motorists’
    Safety Protocols" under Safe Driving Tips.
- id: 27
  category: driver_responsibility
  question: In addition to the Safety Responsibility Law, what other responsibility
    law is covered under Traffic Violations/Crashes?
  choices:
    A: Personal Responsibility Law
    B: Financial Responsibility Law
    C: Civil Responsibility Law
    D: Criminal Responsibility Law
  answer: B
  explanation: The "Financial Responsibility Law" is listed alongside the Safety Responsibility
    Law in Chapter 7.
- id: 28
  category: sharing_the_road
  question: Which of the following recreational vehicles is specifically mentioned
    in the chapter on sharing the road?
  choices:
    A: ATVs
    B: Snowmobiles
    C: Golf Carts
    D: Dirt Bikes
  answer: B
  explanation: '"Snowmobiles" are specifically listed as a category of vehicles in
    Chapter 5: Sharing the Road.'
- id: 29
  category: license_system
  question: What class of license is issued to a driver seeking a basic license to
    operate a car in Illinois?
  choices:
    A: Class A
    B: Class C
    C: Class D
    D: Class M
  answer: C
  explanation: According to the manual, a driver seeking a basic license to operate
    a car in Illinois is issued a Class D license.
- id: 30
  category: vehicle_information
  question: Under what conditions can a Class D license holder operate a rental vehicle
    up to 26,000 pounds?
  choices:
    A: For commercial business purposes across state lines
    B: When transporting personal property for non-business purposes within Illinois
    C: When transporting more than 15 passengers for hire
    D: Only if they also hold a Commercial Driver's License (CDL)
  answer: B
  explanation: Holders of a Class D license may operate rental vehicles up to 26,000
    pounds when transporting their own personal property or that of an immediate family
    member for non-business purposes within the state of Illinois.
- id: 31
  category: license_system
  question: Effective July 1, 2024, what change applies to Temporary Visitors Driver's
    Licenses (TVDLs) in Illinois?
  choices:
    A: They will be valid for 10 years
    B: They will no longer be issued
    C: They will require an additional written exam
    D: They will only be issued to drivers under 21
  answer: B
  explanation: Effective July 1, 2024, Temporary Visitors Driver's Licenses (TVDLs)
    will no longer be issued. Eligible individuals can apply for a standard driver's
    license instead.
- id: 32
  category: driver_testing
  question: What must a 16- or 17-year-old do to receive an Illinois driver's license?
  choices:
    A: Complete 50 hours of practice driving and pass the three parts of the exam
    B: Complete a state-approved driver education course
    C: Have an Affidavit/Consent signed by a legal guardian or responsible adult over
      21 if a parent cannot accompany them
    D: All of the above
  answer: D
  explanation: If you are age 16 or 17, you may receive your license if you successfully
    complete a state-approved driver education course, complete 50 hours of practice
    driving, pass the three parts of the exam, and have an Affidavit/Consent signed
    if a parent/guardian cannot accompany you.
- id: 33
  category: driver_testing
  question: If you are an 18-year-old first-time applicant in Illinois who has never
    completed a driver education program, what is required before obtaining a license?
  choices:
    A: Complete a six-hour Adult Driver Education Course
    B: Complete 100 hours of practice driving
    C: Wait until you are 21 years old
    D: Obtain a Temporary Visitors Driver's License
  answer: A
  explanation: First-time applicants age 18, 19, or 20 who have never been licensed
    or completed an approved driver education program must successfully complete a
    six-hour Adult Driver Education Course.
- id: 34
  category: safe_driving_rules
  question: 'A driver under the age of 18 in Illinois is NOT allowed to drive:'
  choices:
    A: A rental vehicle up to 10,000 pounds
    B: Any vehicle for-hire transporting property
    C: A vehicle with more than one passenger
    D: Between the hours of 8 PM and 6 AM
  answer: B
  explanation: A driver under age 18 is not allowed to drive any vehicle for-hire
    transporting property (e.g., delivery persons) or any vehicle requiring a commercial
    driver's license.
- id: 35
  category: safe_driving_rules
  question: Which of the following vehicles is a driver under age 21 prohibited from
    driving for-hire?
  choices:
    A: A vehicle transporting more than 10 passengers
    B: A commuter van or religious organization bus
    C: A school bus or child care vehicle
    D: All of the above
  answer: D
  explanation: A driver under age 21 is not allowed to drive any vehicle for-hire
    that is transporting more than 10 passengers, a commuter van, a religious organization
    bus, a school bus, a vehicle transporting senior citizens, or a child care vehicle.
- id: 36
  category: license_system
  question: If you permanently move to Illinois from another state, how long do you
    have to obtain an Illinois driver's license?
  choices:
    A: Within 30 days
    B: Within 60 days
    C: Within 90 days or before your out-of-state license expires, whichever comes
      first
    D: Within 120 days
  answer: C
  explanation: If you have permanently moved to Illinois from another state, you must
    obtain an Illinois license within 90 days or before your driver's license expires,
    whichever comes first.
- id: 37
  category: license_system
  question: Who is exempt from needing a valid Illinois driver's license while driving
    in Illinois?
  choices:
    A: An out-of-state student attending an Illinois college with a valid license
      from their home state
    B: A new resident who has lived in Illinois for 6 months
    C: A 17-year-old who has not completed driver's education
    D: A driver operating a commercial vehicle for the first time
  answer: A
  explanation: If you are an out-of-state student attending an Illinois college/university,
    you, your spouse, and your children may drive with a valid license from your home
    state or country.
- id: 38
  category: license_system
  question: How long does a legal resident of Illinois serving in the U.S. Armed Forces
    outside the U.S. have to drive on a deferred license upon returning?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: D
  explanation: If serving in the U.S. Armed Forces outside the United States but a
    legal resident of Illinois, you may drive during the first 120 days of your return
    if you previously obtained a deferral of your driver's license.
- id: 39
  category: driver_responsibility
  question: How many days do you have to apply for a corrected driver's license or
    ID card after legally changing your name?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: If you have legally changed your name, you must apply for a corrected
    driver's license/ID card within 30 days of the name change.
- id: 40
  category: driver_responsibility
  question: Within how many days must you notify the Secretary of State's office of
    an address change?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: A
  explanation: You must notify the Secretary of State's office of an address change
    within 10 days of any move.
- id: 41
  category: license_system
  question: What must you do to receive an updated physical driver's license reflecting
    a new address?
  choices:
    A: Call the Secretary of State's office
    B: Mail a letter to the Springfield office
    C: Visit a facility and present acceptable documents to prove residency
    D: Update your address online
  answer: C
  explanation: You will not receive an updated DL/ID reflecting the address change
    unless you visit a facility and present acceptable documents to prove residency,
    including a valid mailing address.
- id: 42
  category: license_system
  question: Which of the following is true regarding operating a farm tractor on a
    roadway in Illinois?
  choices:
    A: You must have a Class D driver's license
    B: You must have a Commercial Driver's License (CDL)
    C: You may operate it temporarily between farm buildings and nearby farmland without
      an Illinois driver's license
    D: You must be at least 21 years old
  answer: C
  explanation: You may drive in Illinois without a valid Illinois driver's license
    if you are operating a road machine temporarily on the roadway or farm tractor
    between the farm buildings and nearby farmland.
- id: 43
  category: license_system
  question: What is required for the application process of a REAL ID-compliant document
    in Illinois?
  choices:
    A: Only a valid out-of-state license
    B: Documentation confirming identity, Social Security number, residency, and signature
    C: A written exam and a driving test
    D: A 6-hour Adult Driver Education Course
  answer: B
  explanation: The application process for a REAL ID-compliant document requires enhanced
    security measures, meaning you must provide documentation confirming your identity,
    Social Security number, residency, and signature.
- id: 44
  category: license_system
  question: What change regarding Temporary Visitors Driver's Licenses (TVDLs) took
    effect on July 1, 2024?
  choices:
    A: They are now valid for 8 years.
    B: They require three proofs of residency.
    C: They will no longer be issued.
    D: They are only available to drivers under 21.
  answer: C
  explanation: The manual states that effective July 1, 2024, Temporary Visitors Driver's
    Licenses (TVDLs) will no longer be issued, and eligible individuals can now apply
    for a standard driver's license.
- id: 45
  category: license_system
  question: How many documents proving Illinois residency are required when applying
    for a first-time REAL ID-compliant driver's license compared to a standard-issued
    license?
  choices:
    A: One for REAL ID, two for standard
    B: Two for REAL ID, one for standard
    C: Three for REAL ID, two for standard
    D: Two for both REAL ID and standard
  answer: B
  explanation: A first-time REAL ID applicant must present two documents to prove
    Illinois residency, whereas a first-time standard-issued applicant must present
    one document.
- id: 46
  category: license_system
  question: Who must properly complete and sign the application form for an Illinois
    Person with a Disability Identification Card?
  choices:
    A: A licensed driving instructor
    B: A medical professional
    C: A notary public
    D: A Secretary of State facility manager
  answer: B
  explanation: The manual specifies that the Application for an Illinois Person with
    a Disability Identification Card must be properly completed and signed by a medical
    professional.
- id: 47
  category: license_system
  question: Under what condition can a person over age 60 receive a duplicate driver's
    license at no cost if it was stolen?
  choices:
    A: They must present a police report.
    B: They must apply online.
    C: They do not need a police report.
    D: They must wait until their next renewal date.
  answer: C
  explanation: The manual notes that while applicants under age 60 must present a
    police report to get a free duplicate for a stolen license, persons over age 60
    do not need a police report for a duplicate driver's license/ID card at no cost.
- id: 48
  category: driver_responsibility
  question: What should you do if you do not receive a driver's license renewal notice
    in the mail?
  choices:
    A: Wait until the notice arrives to renew.
    B: Continue driving because your license is automatically extended.
    C: It is your responsibility to renew the license before expiration regardless
      of the notice.
    D: Request a temporary 90-day extension online.
  answer: C
  explanation: 'The manual states: ''It is the driver''s responsibility to renew the
    license before expiration, regardless of whether a renewal letter is received.'''
- id: 49
  category: license_system
  question: When does a driver's license expire for a driver under the age of 21?
  choices:
    A: On their 21st birthday
    B: Three months after their 21st birthday
    C: Six months after their 21st birthday
    D: On their 22nd birthday
  answer: B
  explanation: For drivers under age 21, the driver's license expires three months
    after their 21st birthday.
- id: 50
  category: license_system
  question: How long is a driver's license valid for drivers between the ages of 81
    and 86?
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Four years
  answer: B
  explanation: According to the manual, for drivers ages 81-86, the license is valid
    for two years.
- id: 51
  category: license_system
  question: How often must drivers ages 87 and older renew their driver's license?
  choices:
    A: Every six months
    B: Annually
    C: Every two years
    D: Every four years
  answer: B
  explanation: The manual states that for drivers ages 87 and older, the license requires
    annual renewal.
- id: 52
  category: license_system
  question: After successfully completing the renewal process and paying the fee,
    how long is the temporary, secure paper driver's license valid?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: Upon payment and successful completion of any required testing, the
    Secretary of State will issue a temporary, secure paper driver's license/ID card,
    which is valid for 90 days.
- id: 53
  category: license_system
  question: Why might the post office fail to deliver your permanent driver's license
    to your provided address?
  choices:
    A: If you did not pay for expedited shipping.
    B: If there is a forwarding order or hold-on mail service at the address.
    C: If you are not home to sign for the delivery.
    D: If the temporary license has already expired.
  answer: B
  explanation: The manual explicitly states that driver's license and/or ID cards
    will not be delivered by the post office if there is a forwarding order or any
    type of hold-on mail service for the address you provided.
- id: 54
  category: license_system
  question: Which of the following is a requirement to be eligible for the Safe Driver
    Renewal Program?
  choices:
    A: The driver must be between the ages of 22 and 74.
    B: The driver must hold a commercial driver's license (CDL).
    C: The driver must have at least one minor traffic infraction.
    D: The driver must be applying for a REAL ID as a non-U.S. citizen.
  answer: A
  explanation: To be eligible for Safe Driver Renewal, a driver must be ages 22-74,
    not hold a CDL, have no traffic infractions, and have verified Social Security
    information.
- id: 55
  category: penalties_and_points
  question: What is a potential penalty for presenting another person's driver's license
    or ID card as your own?
  choices:
    A: A 30-day suspension of driving privileges.
    B: A fine of up to $500 and a warning.
    C: Possible imprisonment of up to five years and a 12-month suspension or revocation.
    D: Mandatory community service and a 6-month suspension.
  answer: C
  explanation: Persons are subject to arrest, possible imprisonment of up to five
    years, and a 12-month suspension or revocation of their driving privileges for
    offenses including presenting another person's driver's license/ID card as their
    own.
- id: 56
  category: alcohol_drugs_health
  question: If you have a physical or mental condition that may impair your safe operation
    of a motor vehicle, what might you be required to provide when applying for a
    driver's license?
  choices:
    A: A waiver signed by a family member.
    B: A Medical Report completed by a licensed physician.
    C: A certificate of completion from a defensive driving course.
    D: A special insurance policy document.
  answer: B
  explanation: In certain instances where physical or mental conditions may impair
    driving, you must provide a Medical Report completed by a licensed physician verifying
    your medical ability to safely operate a motor vehicle.
- id: 57
  category: license_system
  question: What must you do if your identity documents show a name different from
    your current legal name when applying for a first-time REAL ID?
  choices:
    A: Bring additional documentation indicating the reason for the name change, such
      as a marriage certificate.
    B: Apply for a standard-issued driver's license instead.
    C: Wait 30 days for a background check to clear.
    D: Provide a sworn affidavit signed by a notary public.
  answer: A
  explanation: If you bring identity documents with a name different from your current
    legal name, you must bring additional documentation indicating the reason for
    the name change (such as a certified marriage certificate, copy of divorce decree,
    etc.).
- id: 58
  category: driver_responsibility
  question: How many days do you have to present a completed Medical Report to DMV
    personnel after the physician signs it?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: According to the manual, the Medical Report must be presented to DMV
    personnel within 90 days from the date the physician signs it.
- id: 59
  category: alcohol_drugs_health
  question: If you develop a medical condition that is likely to cause a loss of consciousness,
    within how many days must you notify the Secretary of State's office?
  choices:
    A: 5 days
    B: 10 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: The manual states that if you develop a medical condition likely to
    cause a loss of consciousness or ability to operate a vehicle safely, you must
    notify the Secretary of State's office within 10 days of becoming aware of the
    condition.
- id: 60
  category: penalties_and_points
  question: What happens to your Illinois driving record if you are convicted of a
    traffic violation while driving in another state?
  choices:
    A: The offense will be ignored in Illinois.
    B: You must surrender your Illinois license immediately.
    C: The offense will be included on your Illinois driving record.
    D: You will be required to retake the driving exam.
  answer: C
  explanation: The manual specifies that if you are convicted of a traffic violation
    while driving in another state, the offense will be included on your Illinois
    driving record.
- id: 61
  category: license_system
  question: At what age will applicants be asked to join the Illinois Organ/Tissue
    Donor Registry during the driver's license application process?
  choices:
    A: Age 15 and older
    B: Age 16 and older
    C: Age 18 and older
    D: Age 21 and older
  answer: B
  explanation: The manual states that applicants age 16 and older will be asked to
    join the Illinois Organ/Tissue Donor Registry.
- id: 62
  category: license_system
  question: Who is NOT eligible to register to vote when applying for an Illinois
    driver's license?
  choices:
    A: Applicants applying for a Real ID-compliant license
    B: Non-U.S. citizens
    C: Applicants who are 18 years old
    D: Applicants updating their address
  answer: B
  explanation: According to the manual, non-U.S. citizens applying for a driver's
    license are not eligible to register to vote.
- id: 63
  category: license_system
  question: Federal law requires males of what age group to register with the Selective
    Service System when applying for a driver's license?
  choices:
    A: Ages 16-18
    B: Ages 18-21
    C: Ages 18-25
    D: Ages 21-30
  answer: C
  explanation: The manual notes that federal law requires all males ages 18-25 to
    register with the Selective Service System.
- id: 64
  category: driver_responsibility
  question: What additional information can individuals provide when registering with
    the Illinois Emergency Contact Database?
  choices:
    A: Their preferred hospital
    B: Information concerning disabilities or special medical needs
    C: Their vehicle registration details
    D: Their auto insurance policy number
  answer: B
  explanation: Individuals registering with the Emergency Contact Database may also
    provide information concerning disabilities or special medical needs.
- id: 65
  category: license_system
  question: What is the fee for a standard driver's license for an applicant between
    the ages of 21 and 68?
  choices:
    A: $5
    B: $20
    C: $30
    D: Free
  answer: C
  explanation: The fee schedule in the manual lists the fee for a Driver's License,
    ages 21-68, as $30.
- id: 66
  category: license_system
  question: What is the additional fee to add or renew an M or L motorcycle classification
    on a driver's license?
  choices:
    A: $2
    B: $4
    C: $5
    D: $10
  answer: C
  explanation: In addition to the regular driver's license fee, an applicant will
    pay an additional $5 fee to add/renew an M or L motorcycle classification.
- id: 67
  category: license_system
  question: What is the fee for a duplicate driver's license for a person under age
    60 if the license was stolen and a full police report is provided?
  choices:
    A: Free
    B: $2
    C: $5
    D: $20
  answer: A
  explanation: The manual states that a duplicate driver's license for someone under
    age 60 whose license was stolen is Free, provided a full police report is required.
- id: 68
  category: license_system
  question: Effective July 1, 2024, what happens to Temporary Visitor Driver's Licenses
    (TVDLs)?
  choices:
    A: The fee will increase to $30.
    B: They will no longer be issued.
    C: They will be required for all non-residents.
    D: They will be valid for 90 days only.
  answer: B
  explanation: Effective July 1, 2024, Temporary Visitor Driver's Licenses (TVDLs)
    will no longer be issued, and eligible individuals can apply for a standard driver's
    license.
- id: 69
  category: license_system
  question: Which of the following is required to obtain a driving record abstract
    by submitting a written request?
  choices:
    A: Social Security Number
    B: Proof of vehicle insurance
    C: Driver's license number
    D: A police report
  answer: C
  explanation: A written request for a driving record abstract must include your full
    name, date of birth, driver's license number, and the appropriate fee.
- id: 70
  category: license_system
  question: Where is the "GOLD STAR FAMILY" designation placed on an Illinois driver's
    license or ID card?
  choices:
    A: On the front of the card
    B: On the back of the card
    C: Across the applicant's photo
    D: Next to the driver's license number
  answer: B
  explanation: A "GOLD STAR FAMILY" designation may be placed on the back of an Illinois
    driver's license/ID card at the request of the applicant.
- id: 71
  category: license_system
  question: What is the fee for a driver's license for an applicant who is 87 years
    of age or older?
  choices:
    A: Free
    B: $2
    C: $5
    D: $30
  answer: A
  explanation: The fee schedule indicates that a Driver's License for ages 87 and
    older is Free.
- id: 72
  category: license_system
  question: Which of the following services can be completed online through the Secretary
    of State's expanded online services?
  choices:
    A: Renewing a license plate sticker
    B: Taking the written driving exam
    C: Applying for a first-time Real ID
    D: Submitting a Medical Report for the first time
  answer: A
  explanation: The expanded online services listed in the manual include renewing
    a license plate sticker.
- id: 73
  category: driver_testing
  question: How many attempts are allowed to pass each driver's license exam within
    one year from the date you paid your application fee?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: C
  explanation: The manual states, "You are allowed three attempts to pass each exam
    within one year from the date you paid your application fee."
- id: 74
  category: penalties_and_points
  question: What is the penalty for taking any part of the driver's license exam for
    another person?
  choices:
    A: A warning and a 30-day suspension
    B: A fine and a mandatory minimum seven days in jail
    C: A fine and a mandatory minimum 30 days in jail
    D: Permanent revocation of driving privileges
  answer: B
  explanation: According to the manual, "Taking any part of the driver's license exam
    for another person is a criminal offense punishable by a fine and a mandatory
    minimum seven days in jail."
- id: 75
  category: driver_testing
  question: What is the minimum visual acuity required to drive without a daylight
    driving restriction?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/70
  answer: C
  explanation: The manual requires a "Minimum visual acuity of 20/40 with or without
    corrective lenses." Acuity between 20/41 and 20/70 is limited to daylight driving
    only.
- id: 76
  category: driver_testing
  question: If a driver's visual acuity is between 20/41 and 20/70, what restriction
    will be placed on their driving privileges?
  choices:
    A: They must wear telescopic lenses.
    B: They are limited to daylight driving only.
    C: They can only drive with a licensed adult.
    D: They are restricted from driving on highways.
  answer: B
  explanation: The manual states, "A driver with acuity between 20/41 and 20/70 is
    limited to daylight driving only."
- id: 77
  category: driver_testing
  question: How often must a driver take a written exam if they have traffic convictions
    on their record?
  choices:
    A: Every 2 years
    B: Every 4 years
    C: Every 8 years
    D: Every 10 years
  answer: C
  explanation: The manual states, "Every driver must take a written exam every eight
    years, except for a driver having no traffic convictions."
- id: 78
  category: driver_testing
  question: Which drivers are required to take a driving exam when renewing their
    driver's license?
  choices:
    A: Drivers ages 65 and older
    B: Drivers ages 70 and older
    C: Drivers ages 75 and older
    D: Drivers ages 79 and older
  answer: D
  explanation: The manual specifies, "Drivers ages 79 and older and any driver turning
    79 or older who are renewing their driver's license must take a driving exam."
- id: 79
  category: driver_testing
  question: What will result in an automatic failure during the driving exam?
  choices:
    A: Asking the examiner to repeat a direction
    B: Committing any traffic violation or dangerous action
    C: Adjusting the mirrors before putting the vehicle in motion
    D: Using the parking brake when parking on a hill
  answer: B
  explanation: The manual states, "You will automatically fail the exam if you commit
    any traffic violation or any dangerous action while taking the exam."
- id: 80
  category: safe_driving_rules
  question: When performing the backing maneuver during the driving exam, where should
    the driver look?
  choices:
    A: Only in the rearview mirror
    B: Only in the side mirrors
    C: Turn their head to the right and watch to the rear
    D: Turn their head to the left and watch out the window
  answer: C
  explanation: When backing the vehicle approximately 50 feet, the manual instructs
    to "turn your head to the right and watch to the rear when performing this maneuver."
- id: 81
  category: license_system
  question: On what days of the week can an applicant request an oral examination
    for the written test in person at a facility?
  choices:
    A: Monday through Friday
    B: Monday through Thursday
    C: Weekends only
    D: Any day the facility is open
  answer: B
  explanation: The manual states, "Oral examinations (for the written test) can be
    requested in person at any Secretary of State driver's license facility, Monday
    through Thursday."
- id: 82
  category: license_system
  question: How long is an instruction permit valid for a driver under age 18?
  choices:
    A: 6 months
    B: 12 months
    C: 24 months
    D: 36 months
  answer: C
  explanation: The manual states, "The instruction permit is valid for 24 months..."
- id: 83
  category: license_system
  question: How long must a 15- to 17-year-old hold an instruction permit before obtaining
    a driver's license?
  choices:
    A: At least 3 consecutive months
    B: At least 6 consecutive months
    C: At least 9 consecutive months
    D: At least 12 consecutive months
  answer: C
  explanation: The manual states the permit "must be held for at least nine consecutive
    months before obtaining a driver's license if you are age 15-17."
- id: 84
  category: license_system
  question: At what age may an applicant apply for an instruction permit without taking
    a driver education course?
  choices:
    A: 16 years old
    B: 16 and 6 months or older
    C: 17 years old
    D: 17 and 3 months or older
  answer: D
  explanation: The manual states, "If you are age 17 and 3 months or older, you may
    apply for an instruction permit without taking a driver education course."
- id: 85
  category: safe_driving_rules
  question: What are the requirements for the supervising adult when a teen is driving
    with an instruction permit?
  choices:
    A: Age 18 or older with a valid license
    B: Age 21 or older, valid license, at least one year of driving experience, sitting
      in the front passenger seat
    C: Age 25 or older with a valid license, sitting anywhere in the vehicle
    D: Any licensed driver sitting in the front passenger seat
  answer: B
  explanation: The manual states the adult must be "age 21 or older, has a valid license,
    and has at least one year of driving experience. This individual must sit in the
    front passenger seat adjacent to you."
- id: 86
  category: license_system
  question: How many hours of behind-the-wheel supervised driving are required for
    drivers under age 18 before being eligible to obtain a driver's license?
  choices:
    A: 30 hours, including 5 hours at night
    B: 40 hours, including 10 hours at night
    C: 50 hours, including 10 hours at night
    D: 60 hours, including 15 hours at night
  answer: C
  explanation: '"Illinois law requires drivers under age 18 to have at least 50 hours
    of behind-the-wheel supervised driving, including 10 hours of nighttime supervised
    driving..."'
- id: 87
  category: penalties_and_points
  question: What happens if an applicant is found cheating on the written exam?
  choices:
    A: They fail the exam and are prohibited from retaking it for 30 days.
    B: They fail the exam and must pay a $500 fine.
    C: They fail the exam and are prohibited from retaking it for 6 months.
    D: They receive a warning and must restart the exam immediately.
  answer: A
  explanation: The manual states, "Any applicant found cheating will fail the exam
    and be prohibited from retaking it for 30 days."
- id: 88
  category: license_system
  question: Which of the following documents must you bring to the DMV when applying
    for a driver's license before age 18?
  choices:
    A: A 30-hour driving log
    B: A 50-hour driving log with proper signature
    C: A high school diploma
    D: Proof of vehicle ownership
  answer: B
  explanation: According to the manual, when applying for a license before age 18,
    you must bring several documents, including a 50-hour driving log with proper
    signature.
- id: 89
  category: driver_testing
  question: 'Even if a student passes a road test conducted by their driver education
    instructor, they may still be required to pass a driving exam at the DMV if:'
  choices:
    A: They received a B in the course.
    B: Their birthday falls on a certain spot check date.
    C: They are under 16 years old.
    D: They are applying for a REAL ID.
  answer: B
  explanation: 'The manual states: ''Students whose birthdays fall on certain spot
    check dates must pass a driving exam administered at a DMV even though they may
    have taken and passed a road test conducted by their driver education instructor.'''
- id: 90
  category: driver_testing
  question: 'Under the Cooperative Driver Testing Program, high school students may
    be exempt from taking a Secretary of State-administered driving exam if they complete
    their driver education course with a combined grade of:'
  choices:
    A: A or B
    B: A, B, or C
    C: Pass/Fail
    D: 90% or higher
  answer: A
  explanation: High school students who successfully complete an accredited driver
    education course with a combined grade of A or B may be exempt from taking a Secretary
    of State-administered driving exam.
- id: 91
  category: license_system
  question: When does a Cooperative Driver Testing Certificate expire?
  choices:
    A: One year from the date of issue
    B: On the student's 18th birthday
    C: On the same day as the student's instruction permit
    D: Six months after completing driver education
  answer: C
  explanation: The manual explicitly states that the Cooperative Driver Testing Certificate
    expires on the same day as the student's instruction permit and will not be extended.
- id: 92
  category: license_system
  question: 'If you are age 18, 19, or 20 and have not previously been licensed or
    completed an approved driver education program, you must:'
  choices:
    A: Complete a 6-hour Adult Driver Education Course
    B: Hold an instruction permit for 9 months
    C: Complete 50 hours of supervised driving
    D: Take a 12-hour defensive driving course
  answer: A
  explanation: First-Time Drivers ages 18-20 who have not previously been licensed
    or completed an approved driver education program must complete a six-hour Adult
    Driver Education Course.
- id: 93
  category: safe_driving_rules
  question: What are the nighttime driving restrictions for a driver in the Permit
    Phase (Age 15) from Sunday through Thursday?
  choices:
    A: 9 p.m. to 6 a.m.
    B: 10 p.m. to 6 a.m.
    C: 11 p.m. to 6 a.m.
    D: Midnight to 5 a.m.
  answer: B
  explanation: During the Permit Phase, nighttime driving restrictions are Sun.-Thurs.,
    10 p.m.-6 a.m., and Fri.-Sat., 11 p.m.-6 a.m.
- id: 94
  category: license_system
  question: How long must a driver in the Permit Phase hold their instruction permit
    before moving to the next phase?
  choices:
    A: A minimum of 3 months
    B: A minimum of 6 months
    C: A minimum of 9 months
    D: A minimum of 12 months
  answer: C
  explanation: Under the Permit Phase guidelines, the permit must be held for a minimum
    of nine months.
- id: 95
  category: safe_driving_rules
  question: Under Illinois law, any wireless/cellphone use while driving, including
    a hands-free device, is prohibited for drivers under what age (except in emergencies)?
  choices:
    A: Age 18
    B: Age 19
    C: Age 20
    D: Age 21
  answer: B
  explanation: The manual states across all GDL phases that any wireless/cellphone
    use while driving, including a hands-free device, is prohibited for a driver under
    age 19, except in the case of an emergency.
- id: 96
  category: safe_driving_rules
  question: 'During the first 12 months of the Initial Licensing Phase (Ages 16-17),
    the number of passengers is limited to:'
  choices:
    A: One person under age 20, unless they are a sibling, stepsibling, child, or
      stepchild
    B: Two people under age 18
    C: Only family members of any age
    D: No passengers are allowed
  answer: A
  explanation: For the first 12 months of licensing, or until the driver turns 18,
    the number of passengers is limited to one person under age 20, unless the passenger(s)
    is a sibling, stepsibling, child, or stepchild of the driver.
- id: 97
  category: penalties_and_points
  question: To move from the Initial Licensing Phase to the Full Licensing Phase without
    restrictions extending beyond age 18, a driver must maintain a conviction-free
    driving record for how long before turning 18?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A driver in the Initial Licensing Phase must maintain a conviction-free
    driving record for six months before turning 18. A traffic conviction may extend
    restrictions beyond age 18.
- id: 98
  category: driver_responsibility
  question: If a parent or legal guardian gives initial consent for a minor to obtain
    a driver's license, when can they cancel the minor's license?
  choices:
    A: Only if the minor receives a traffic ticket
    B: Only within the first 6 months of licensing
    C: At any time, for any reason, until the driver turns 18
    D: They cannot cancel it once the license is issued
  answer: C
  explanation: The parent/legal guardian who gave initial consent may cancel the minor's
    license at any time, for any reason, until the driver turns 18 by contacting the
    Secretary of State's office.
- id: 99
  category: penalties_and_points
  question: A driver under age 21 is limited to how many court supervisions for serious
    traffic offenses?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: According to the Related Laws section, a driver under age 21 is limited
    to one court supervision for serious traffic offenses.
- id: 100
  category: penalties_and_points
  question: 'If a driver under age 18 wishes to obtain court supervision for a traffic
    violation, they must attend traffic safety school and:'
  choices:
    A: Pay a $500 fine
    B: Surrender their license for 30 days
    C: Appear in court with a parent/legal guardian
    D: Retake the written driving exam
  answer: C
  explanation: To obtain court supervision for a traffic violation, a driver must
    attend traffic safety school. If they are under age 18, they must appear in court
    with a parent/legal guardian.
- id: 101
  category: license_system
  question: 'A student under age 18 who drops out of high school can have the driver
    education completion notation placed on their record if they:'
  choices:
    A: Pay an additional fee to the Secretary of State
    B: Have written verification of enrollment in a GED or alternative program
    C: Wait until they turn 19
    D: Complete 100 hours of supervised driving
  answer: B
  explanation: Students under age 18 who drop out of high school cannot have the completion
    notation placed on their record unless they meet certain exceptions, such as the
    instructor having written verification of enrollment in a GED or alternative program.
- id: 102
  category: license_system
  question: During the Permit Phase, a driver must practice driving for a minimum
    of 50 hours. How many of those hours must be at night?
  choices:
    A: 5 hours
    B: 10 hours
    C: 15 hours
    D: 20 hours
  answer: B
  explanation: The Permit Phase requires drivers to practice driving a minimum of
    50 hours, including 10 hours at night, supervised by a parent or adult age 21
    or older.
- id: 103
  category: penalties_and_points
  question: What is the penalty for a driver under age 21 who is convicted of two
    or more moving violations within a 24-month period?
  choices:
    A: A minimum 30-day driver's license suspension
    B: A minimum 6-month driver's license suspension
    C: Permanent revocation of driving privileges
    D: A warning letter and a mandatory fine
  answer: A
  explanation: According to the manual, a driver under age 21 who is convicted of
    two or more moving violations within a 24-month period will have their driver's
    license suspended for a minimum of 30 days.
- id: 104
  category: alcohol_drugs_health
  question: What happens if a person under age 21 receives court supervision for possession
    or consumption of alcohol while an occupant of a motor vehicle?
  choices:
    A: A warning is issued to their parents
    B: Their vehicle is impounded for 30 days
    C: They receive a three-month driver's license suspension
    D: They receive a minimum six-month driver's license suspension
  answer: C
  explanation: A person under age 21 who receives court supervision for possession,
    consumption, purchase, or receipt of alcohol will receive a three-month driver's
    license suspension if the offense occurred while the person was an occupant of
    a motor vehicle.
- id: 105
  category: safe_driving_rules
  question: When stopped by law enforcement, where should the driver keep their hands?
  choices:
    A: In their lap or pockets
    B: Reaching for the glove box to get their registration
    C: Clearly in sight on the steering wheel
    D: Outside the driver's side window
  answer: C
  explanation: During a traffic stop, you should stay in the vehicle with both hands
    clearly in sight on the steering wheel until the police officer instructs you
    otherwise.
- id: 106
  category: safe_driving_rules
  question: If you are being pulled over by an unmarked police vehicle and cannot
    identify the driver as law enforcement, what is an acceptable action?
  choices:
    A: Speed up to get away from the vehicle
    B: Stop immediately in the middle of the traffic lane
    C: Drive carefully to the nearest police station or call 911
    D: Exit your vehicle and approach the unmarked car to ask for ID
  answer: C
  explanation: If you cannot identify an unmarked police vehicle and/or the driver
    as law enforcement, drive slowly below the speed limit and pull over at a well-lit
    location, drive to the nearest police station, or call 911.
- id: 107
  category: safe_driving_rules
  question: What does signing a traffic ticket issued by a police officer mean?
  choices:
    A: It is an admission of guilt for the traffic violation.
    B: It is only an acknowledgment of receiving the ticket.
    C: It waives your right to present your case in traffic court.
    D: It means you agree to pay the fine immediately.
  answer: B
  explanation: Signing a ticket is not an admission of the driver's guilt — only an
    acknowledgment of receiving the ticket.
- id: 108
  category: safe_driving_rules
  question: At what age does Illinois law allow the use of hands-free devices or Bluetooth
    technology while driving?
  choices:
    A: Age 16 and older
    B: Age 18 and older
    C: Age 19 and older
    D: Age 21 and older
  answer: C
  explanation: Hands-free devices or Bluetooth technology is allowed for persons age
    19 and older.
- id: 109
  category: safe_driving_rules
  question: Which of the following headset configurations is permitted while driving
    in Illinois?
  choices:
    A: A dual-ear headset for listening to music
    B: A single-sided headset or earpiece
    C: Noise-canceling headphones over both ears
    D: No headsets of any kind are permitted
  answer: B
  explanation: Illinois law prohibits the use of headsets while driving, but using
    a single-sided headset or earpiece with a wireless/cellphone device is permitted.
- id: 110
  category: safe_driving_rules
  question: Under what circumstance is a driver allowed to use a cellphone that is
    NOT hands-free?
  choices:
    A: When stopped at a red traffic light in drive
    B: When reporting an emergency
    C: When driving on a rural highway with no other cars around
    D: When using the phone's speakerphone function while holding it
  answer: B
  explanation: The only time you can use a cellphone that is not hands-free is to
    report an emergency, while parked on the shoulder, or when stopped due to normal
    traffic being obstructed and the vehicle is in neutral or park.
- id: 111
  category: safe_driving_rules
  question: If your proof of insurance is stored on your cellphone, what should you
    do when a police officer requests it during a traffic stop?
  choices:
    A: Quickly reach for your phone before the officer approaches
    B: Inform the officer of that fact and follow their directions before retrieving
      it
    C: Refuse to show it because cellphones are prohibited while driving
    D: Toss the phone to the officer through the window
  answer: B
  explanation: If proof of insurance is stored for display on a cellphone, inform
    the police officer of that fact and then follow the officer's directions before
    retrieving the information.
- id: 112
  category: penalties_and_points
  question: What may happen to a person under age 18 who is charged with an offense
    due to a crash where a passenger was seriously injured or killed?
  choices:
    A: They may be denied issuance or renewal of their driver's license.
    B: They must pay a mandatory $5,000 fine.
    C: They will only receive a warning if alcohol was not involved.
    D: They must retake the written driving exam within 10 days.
  answer: A
  explanation: Persons under age 18 who are charged with an offense due to a crash
    where a passenger was seriously injured or killed may be denied issuance/renewal
    of their driver's license. Alcohol need not play a factor.
- id: 113
  category: safe_driving_rules
  question: If you are stopped by law enforcement at night, what is an acceptable
    action to take to assist the officer?
  choices:
    A: Turn off your headlights completely
    B: Turn on your vehicle's interior light
    C: Shine a flashlight at the approaching officer
    D: Exit the vehicle so the officer can see you clearly
  answer: B
  explanation: If you are being stopped at night, it is acceptable to turn on your
    vehicle's interior light.
- id: 114
  category: safe_driving_rules
  question: Is it legal in Illinois to use a cellphone while driving if you are holding
    the device and using the speakerphone feature?
  choices:
    A: Yes, because speakerphone is considered hands-free.
    B: Yes, as long as you are over age 18.
    C: No, holding the device and using speakerphone is not considered hands-free
      and is a violation.
    D: No, unless you are driving under 30 mph.
  answer: C
  explanation: Using a cellphone while holding the device and using the speaker phone
    is not considered hands-free and is a violation of Illinois law.
- id: 115
  category: safe_driving_rules
  question: Why should you NOT exit your vehicle during a traffic stop unless asked
    to do so by the police officer?
  choices:
    A: It is illegal to stand on the shoulder of a highway.
    B: Getting out of the vehicle can be perceived as aggressive behavior and a threat
      to the officer's safety.
    C: You might accidentally lock your keys inside the vehicle.
    D: The officer needs to inspect the exterior of your vehicle first.
  answer: B
  explanation: Do not exit your vehicle unless asked to do so. Getting out of the
    vehicle can be perceived as aggressive behavior and a threat to the police officer's
    safety.
- id: 116
  category: safe_driving_rules
  question: 'A driver may use a non-hands-free cellphone when stopped due to normal
    traffic being obstructed, provided that:'
  choices:
    A: The vehicle is in neutral or park.
    B: The driver keeps one foot firmly on the brake pedal.
    C: The delay is expected to last more than five minutes.
    D: The driver is over the age of 21.
  answer: A
  explanation: The only time you can use a cellphone that is not hands-free is...
    while stopped due to normal traffic being obstructed and the vehicle is in neutral
    or park.
- id: 117
  category: safe_driving_rules
  question: Under Illinois law, when is the only time you can legally use a cellphone
    that is not hands-free while driving?
  choices:
    A: When stopped at a red traffic light.
    B: To report an emergency.
    C: When driving on a rural highway with no other traffic.
    D: When making a quick phone call that lasts less than one minute.
  answer: B
  explanation: The manual states that the only time you can use a cellphone that is
    not hands-free is to report an emergency, while parked on the shoulder, or while
    stopped due to normal traffic being obstructed and the vehicle is in neutral or
    park.
- id: 118
  category: penalties_and_points
  question: What penalty may a driver face if they cause a crash involving a bicyclist
    or pedestrian due to distracted driving?
  choices:
    A: A mandatory written warning.
    B: A maximum fine of $100.
    C: Criminal penalties and incarceration.
    D: Immediate vehicle impoundment for 30 days.
  answer: C
  explanation: If you are in a crash with a motor vehicle, bicyclist, pedestrian,
    or any road user caused by distracted driving, you may face criminal penalties
    and incarceration.
- id: 119
  category: safe_driving_rules
  question: Who is required by Illinois law to wear a safety belt in a passenger vehicle?
  choices:
    A: Only the driver and front-seat passengers.
    B: All drivers and passengers age 8 and older in both the front and back seats.
    C: Only passengers under the age of 18.
    D: Only the driver, unless the vehicle lacks air bags.
  answer: B
  explanation: Illinois law requires all drivers and passengers (front and back seat)
    age 8 and older to wear safety belts even if the vehicle is equipped with air
    bags.
- id: 120
  category: safe_driving_rules
  question: What is the proper way to wear the shoulder strap of a safety belt?
  choices:
    A: Tucked under the arm to prevent neck irritation.
    B: Placed behind the back if it restricts movement.
    C: Snug across the body at or near the neck or face.
    D: Positioned loosely across the stomach.
  answer: C
  explanation: The shoulder strap should be comfortable and cross the body at or near
    the neck or face. It should never be placed behind the back or under the arm.
- id: 121
  category: vehicle_information
  question: What is the desirable distance a driver should maintain between themselves
    and the steering wheel air bag?
  choices:
    A: 5-7 inches
    B: 10-12 inches
    C: 15-18 inches
    D: 20-24 inches
  answer: B
  explanation: A distance of 10-12 inches between the driver and the air bag is desirable,
    especially for short, elderly, or pregnant drivers.
- id: 122
  category: safe_driving_rules
  question: Until what age does Illinois law require children to be properly secured
    in a rear-facing child restraint system?
  choices:
    A: Age 1, regardless of weight or height.
    B: Age 2, unless they weigh more than 40 pounds or are more than 40 inches tall.
    C: Age 4, unless they weigh more than 50 pounds.
    D: Age 8, regardless of weight or height.
  answer: B
  explanation: Effective Jan. 1, 2019, Illinois law requires children to be properly
    secured in a rear-facing child restraint system until age 2 unless they weigh
    more than 40 pounds or are more than 40 inches tall.
- id: 123
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit on interstates
    and tollways in Illinois?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: D
  explanation: The speed limit for interstates and tollways is 70 mph, unless otherwise
    posted.
- id: 124
  category: safe_driving_rules
  question: What is the standard speed limit in alleys in Illinois?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit in alleys is 15 mph, unless otherwise posted.
- id: 125
  category: safe_driving_rules
  question: When are motorists required to obey the posted construction zone speed
    limit?
  choices:
    A: Only when construction workers are visibly present.
    B: Only during daylight hours.
    C: 24 hours a day, seven days a week.
    D: Only Monday through Friday.
  answer: C
  explanation: Motorists must obey the posted construction zone speed limit 24 hours
    a day, seven days a week, regardless of the presence of workers.
- id: 126
  category: sharing_the_road
  question: What must a driver do when approaching a stationary emergency or maintenance
    vehicle using visual signals (flashing lights)?
  choices:
    A: Maintain speed and honk the horn to alert the workers.
    B: Yield, change to a lane away from the workers when possible, and proceed with
      caution.
    C: Stop immediately in the current lane and wait for instructions.
    D: Accelerate to pass the emergency scene as quickly as possible.
  answer: B
  explanation: Illinois law requires motorists to yield, change to a lane away from
    the emergency workers when possible, and proceed with caution while reducing speed.
- id: 127
  category: safe_driving_rules
  question: Illinois law prohibits photography and the use of wireless/cellphones
    within what distance of an emergency scene?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Illinois law prohibits photography and the use of wireless/cellphones
    within 500 feet of an emergency scene, except in certain circumstances.
- id: 128
  category: safe_driving_rules
  question: Under what conditions does the 20 mph school zone speed limit apply?
  choices:
    A: On school days between 6:30 a.m. and 4 p.m. when children are present and signs
      are posted.
    B: 24 hours a day on any day school is in session.
    C: On school days between 8:00 a.m. and 3:00 p.m. regardless of whether children
      are present.
    D: Only when a crossing guard is actively directing traffic.
  answer: A
  explanation: The school zone speed limit is 20 mph on school days between 6:30 a.m.
    and 4 p.m. when children are present and signs are posted.
- id: 129
  category: sharing_the_road
  question: How should a motorist react when encountering an organized funeral procession?
  choices:
    A: Drive between the vehicles in the procession to cross the intersection.
    B: Join the procession to secure the right of way through traffic.
    C: Yield the right of way to all vehicles in the procession.
    D: Pass the procession on the right shoulder.
  answer: C
  explanation: Motorists encountering a funeral procession must yield the right of
    way to all vehicles in the procession and should NOT drive between vehicles or
    join the procession.
- id: 130
  category: safe_driving_rules
  question: If two vehicles on different roadways arrive at a four-way stop intersection
    at the exact same time, who has the right of way?
  choices:
    A: The vehicle on the left.
    B: The vehicle on the right.
    C: The vehicle traveling at a higher speed.
    D: The vehicle making a left turn.
  answer: B
  explanation: When two vehicles on different roadways arrive at a four-way stop intersection
    at the same time, the vehicle on the left should yield to the vehicle on the right.
- id: 131
  category: safe_driving_rules
  question: What should you do if you are making a left-hand turn into oncoming traffic,
    enter the intersection while the light is green, and the light turns red before
    you can complete the turn?
  choices:
    A: Back up out of the intersection immediately.
    B: Stop in the middle of the intersection and wait for the next green light.
    C: You may finish the turn even though the light turns red.
    D: Abandon the left turn and turn right instead.
  answer: C
  explanation: When making a left-hand turn into oncoming traffic, if you enter an
    intersection while the light is green, you may finish the turn even though the
    light turns red.
- id: 132
  category: safe_driving_rules
  question: When two vehicles on different roadways reach an uncontrolled intersection
    at the same time, who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The vehicle turning left
  answer: B
  explanation: When two vehicles on different roadways reach an uncontrolled intersection
    at the same time, the vehicle on the left should yield to the vehicle on the right.
- id: 133
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane highway, you must return to
    your lane before getting within what distance of an oncoming vehicle?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: You must return to your lane before getting within 200 feet of an oncoming
    vehicle.
- id: 134
  category: safe_driving_rules
  question: Is it legal to flash your turn signals as a courtesy or 'do pass' signal
    to other drivers behind you?
  choices:
    A: Yes, but only on two-lane highways.
    B: Yes, if the vehicle behind you is tailgating.
    C: No, it is against the law.
    D: No, unless you are driving a commercial vehicle.
  answer: C
  explanation: It is against the law to flash turn signals as a courtesy or 'do pass'
    signal to other drivers.
- id: 135
  category: sharing_the_road
  question: What is the minimum distance you must keep between your vehicle and a
    bicyclist or pedestrian you are passing on the road?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: When passing a pedestrian or bicyclist on any road, including the shoulder
    or a dedicated bicycle lane, you must keep a minimum distance of 3 feet from them.
- id: 136
  category: safe_driving_rules
  question: In which of the following situations is passing on a two-lane, two-way
    roadway strictly prohibited?
  choices:
    A: In any construction zone.
    B: On a one-way street.
    C: When the vehicle ahead is making a left turn.
    D: When you have two or more clear lanes in each direction.
  answer: A
  explanation: Passing on a two-lane, two-way roadway is not allowed in a construction
    zone. All construction zones in Illinois are no passing zones.
- id: 137
  category: safe_driving_rules
  question: When driving on an interstate highway, when are you allowed to drive in
    the left lane?
  choices:
    A: At any time, as long as you are driving the speed limit.
    B: Only when passing another vehicle, or under specific exceptions like traffic
      congestion or weather conditions.
    C: Only when you are driving faster than the posted speed limit.
    D: Only when you are within 5 miles of your intended exit.
  answer: B
  explanation: When driving on an interstate highway, you may not drive in the left
    lane(s) except when passing another vehicle. Exceptions include congestion, weather
    conditions, hazards, or yielding to emergency vehicles.
- id: 138
  category: safe_driving_rules
  question: How far in advance must you give a continuous turn signal in a business
    or residential area?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: In a business or residential area, you must give a continuous turn
    signal for at least 100 feet before turning.
- id: 139
  category: safe_driving_rules
  question: What is the correct hand and arm signal for slowing down or stopping?
  choices:
    A: Left arm extended straight out to the left.
    B: Left arm extended straight up.
    C: Left arm extended down.
    D: Right arm extended straight out.
  answer: C
  explanation: To slow down or stop using hand and arm signals, the left hand and
    arm are extended down.
- id: 140
  category: defensive_driving
  question: When waiting at an intersection to make a left turn, how should your vehicle's
    wheels be positioned?
  choices:
    A: Pointed to the left.
    B: Pointed to the right.
    C: Pointed straight ahead until starting to make the turn.
    D: Turned slightly toward the curb.
  answer: C
  explanation: When making a left turn, you should point the wheels straight ahead
    until starting to make the turn.
- id: 141
  category: safe_driving_rules
  question: When you are on the terminating highway of a 'T' intersection with no
    traffic control signs or signals, what must you do?
  choices:
    A: Proceed without stopping, as you have the right-of-way.
    B: Yield to cross traffic.
    C: Sound your horn and proceed.
    D: Speed up to merge smoothly.
  answer: B
  explanation: You must yield to cross traffic when on the terminating highway of
    a 'T' intersection with no traffic control signs or signals.
- id: 142
  category: safe_driving_rules
  question: Passing on a two-lane, two-way roadway is not allowed within what distance
    of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Passing on a two-lane, two-way roadway is not allowed within 100 feet
    of an intersection or railroad crossing.
- id: 143
  category: defensive_driving
  question: What is the recommended method for opening a vehicle door on the side
    where traffic is moving, to help check for oncoming vehicles and bicyclists?
  choices:
    A: The French Swing
    B: The Dutch Reach
    C: The Blind Spot Check
    D: The Two-Hand Push
  answer: B
  explanation: You should consider using your right hand to open the vehicle door
    to allow you to turn and check for oncoming vehicles and bicyclists. This is more
    commonly known as the Dutch Reach.
- id: 144
  category: safe_driving_rules
  question: 'Even if you have a green light, you may not enter an intersection unless:'
  choices:
    A: You are turning right.
    B: There is enough space to allow passage of other vehicles and/or pedestrians.
    C: You are driving an emergency vehicle.
    D: You honk your horn to warn crossing traffic.
  answer: B
  explanation: A driver may not enter an intersection or drive within a marked crosswalk
    unless there is enough space to allow passage of other vehicles and/or pedestrians.
- id: 145
  category: safe_driving_rules
  question: Which of the following statements is true regarding backing up your vehicle
    on a controlled-access roadway?
  choices:
    A: You may back up on the shoulder if you miss your exit.
    B: You may back up in the right lane if traffic is clear.
    C: You may not back up on any shoulder or roadway of a controlled-access roadway.
    D: You may back up only during daylight hours.
  answer: C
  explanation: You may not back up on any shoulder or roadway of any controlled-access
    roadway.
- id: 146
  category: safe_driving_rules
  question: Under what condition are you prohibited from making a U-turn on curves
    and hills?
  choices:
    A: Unless you can see for at least 500 feet in all directions.
    B: Unless you can see for at least 200 feet in all directions.
    C: Unless you are in a rural area.
    D: Unless you use your hazard signals.
  answer: A
  explanation: The manual states you must not turn around on curves and hills unless
    you can see for at least 500 feet in all directions.
- id: 147
  category: safe_driving_rules
  question: Which turn signal should you use to let other drivers know you are exiting
    a roundabout?
  choices:
    A: Left turn signal
    B: Right turn signal
    C: Hazard signal
    D: No signal is required
  answer: B
  explanation: When exiting a roundabout, you must use your vehicle's right turn signal
    to let other drivers know you are exiting.
- id: 148
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus with flashing lights
    and an extended stop arm?
  choices:
    A: When traveling on a two-lane roadway in a rural area.
    B: When traveling in the opposite direction on a four-lane roadway.
    C: When you are in a parking lot located on school property.
    D: When traveling on a private road.
  answer: B
  explanation: A vehicle is not required to stop for a school bus when both vehicles
    are on a four-lane roadway and the bus is stopped in the opposite direction from
    which a driver is traveling.
- id: 149
  category: penalties_and_points
  question: What is the mandatory fine for a conviction of passing a stopped school
    bus with flashing lights and the stop arm extended?
  choices:
    A: $150
    B: $250
    C: $300
    D: $500
  answer: C
  explanation: If convicted of passing a stopped school bus with flashing lights and
    the stop arm extended, you will be subject to a mandatory fine of $300 and community
    service.
- id: 150
  category: safe_driving_rules
  question: What is the required stopping distance from a railroad crossing if there
    is a posted stop sign or flashing electric signal?
  choices:
    A: 5 to 10 feet
    B: 10 to 20 feet
    C: 15 to 50 feet
    D: 50 to 100 feet
  answer: C
  explanation: When approaching a railroad crossing, you must stop within 15-50 feet
    if there is a posted stop sign, if the electric signal is flashing, or if the
    crossing gate is lowered.
- id: 151
  category: defensive_driving
  question: If your vehicle stalls on railroad tracks, in which direction should you
    move after getting out?
  choices:
    A: Straight away from the tracks
    B: At a 45-degree angle in the direction of the train
    C: At a 45-degree angle away from the direction of the train
    D: Parallel to the tracks
  answer: B
  explanation: If your vehicle stalls on railroad tracks, get out immediately and
    move away from the tracks at a 45-degree angle in the direction of the train to
    stay safe from forward flying debris.
- id: 152
  category: vehicle_information
  question: What should a driver with a manual transmission do when crossing railroad
    tracks?
  choices:
    A: Shift into neutral while crossing
    B: Change gears while crossing to maintain speed
    C: Shift down before reaching the tracks and do not change gears while crossing
    D: Accelerate and upshift while crossing
  answer: C
  explanation: If a vehicle has a manual transmission, shift down before reaching
    the tracks. To avoid stalling, do not change gears while crossing the track.
- id: 153
  category: safe_driving_rules
  question: What must you do when moving out of an alley or driveway in an urban area
    before entering the sidewalk area?
  choices:
    A: Honk your horn and proceed slowly
    B: Come to a complete stop
    C: Yield only to vehicles on the street
    D: Flash your headlights
  answer: B
  explanation: In urban areas, you must come to a complete stop when moving out of
    an alley, building, private road, or driveway and before entering the sidewalk
    area.
- id: 154
  category: safe_driving_rules
  question: How should you turn your front wheels when parking facing downhill on
    a street with curbing?
  choices:
    A: Turn the wheels away from the curb
    B: Turn the wheels toward the curb
    C: Keep the wheels pointing straight ahead
    D: Turn the wheels toward the center of the road
  answer: B
  explanation: If you park on a street with curbing and your vehicle is facing downhill,
    turn the front wheels toward the curb so your vehicle will roll toward the curb.
- id: 155
  category: safe_driving_rules
  question: When parallel parking on a street with two-way traffic, how close must
    your right-hand wheels be to the curb?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: B
  explanation: When parking on streets with two-way traffic, park so the right-hand
    wheels are parallel to and within 12 inches of the curb.
- id: 156
  category: driver_responsibility
  question: Which of the following is true regarding the striped area on the pavement
    next to an accessible parking space?
  choices:
    A: It may be used for parking if you have a disabled parking placard.
    B: It may be used for parking only for less than 15 minutes.
    C: Vehicles may not use this striped area for parking under any circumstances.
    D: It is reserved for electric vehicles only.
  answer: C
  explanation: A striped area on the pavement next to an accessible parking space
    is part of the reserved space. Vehicles may not use this striped area for parking
    even if they have a disabled parking placard or disability license plates.
- id: 157
  category: safe_driving_rules
  question: Which of the following is a place where stopping, standing, or parking
    is prohibited?
  choices:
    A: On a one-way street
    B: In a marked, buffered, or barrel-protected bike lane
    C: Within 50 feet of a driveway
    D: On a street without curbing
  answer: B
  explanation: Stopping, standing, or parking is prohibited in a marked, buffered,
    or barrel-protected bike lane.
- id: 158
  category: sharing_the_road
  question: How far in advance will a school bus give a warning before a stop in a
    rural area?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: C
  explanation: A warning will be given by the school bus at least 100 feet (200 feet
    in rural areas) in advance of a stop.
- id: 159
  category: sharing_the_road
  question: Which of the following vehicles are required by law to stop at almost
    all railroad crossings?
  choices:
    A: Vehicles towing a trailer
    B: Vehicles carrying people for hire
    C: Electric vehicles
    D: Motorcycles
  answer: B
  explanation: Vehicles required by law to stop at most all railroad crossings are
    vehicles carrying people for hire, school buses, and vehicles carrying hazardous
    materials.
- id: 160
  category: safe_driving_rules
  question: How far away must a driver park or stand their vehicle from a fire hydrant?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 30 feet
  answer: B
  explanation: According to the manual, standing or parking a vehicle is prohibited
    within 15 feet of a fire hydrant.
- id: 161
  category: safe_driving_rules
  question: It is illegal to stand or park a vehicle within how many feet of a STOP
    sign, YIELD sign, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The manual states that standing or parking a vehicle is prohibited
    within 30 feet of a STOP sign, YIELD sign, or traffic control signal.
- id: 162
  category: driver_responsibility
  question: Under Illinois law, it is illegal to operate a vehicle's sound system
    at a volume that can be heard from what distance?
  choices:
    A: 50 feet or more
    B: 75 feet or more
    C: 100 feet or more
    D: 150 feet or more
  answer: B
  explanation: Illinois law states that you may not operate any sound system at a
    volume that can be heard 75 feet or more from a vehicle being driven on a highway.
- id: 163
  category: safe_driving_rules
  question: How should a driver proceed if they are waiting within an intersection
    to make a left turn and the traffic signal turns red?
  choices:
    A: Wait in the intersection until the light turns green again.
    B: Back up out of the intersection immediately.
    C: Yield to oncoming traffic and complete the turn.
    D: Stop and wait for a police officer to direct traffic.
  answer: C
  explanation: If a driver is within an intersection waiting to make a left turn and
    the traffic signal light turns red, they should yield to oncoming traffic and
    complete the turn.
- id: 164
  category: penalties_and_points
  question: What is the penalty for being convicted of illegally passing a stopped
    school bus?
  choices:
    A: A suspension of the vehicle registration.
    B: A suspension of driving privileges.
    C: A $30 fine.
    D: A warning for the first offense.
  answer: B
  explanation: The penalty for being convicted of illegally passing a stopped school
    bus is a suspension of driving privileges.
- id: 165
  category: safe_driving_rules
  question: In a business or residential district, for what distance should a continuous
    turn signal be given before making a left or right turn?
  choices:
    A: Not less than 50 feet
    B: Not less than 75 feet
    C: Not less than 100 feet
    D: Not less than 200 feet
  answer: C
  explanation: A continuous turn signal must be given for not less than 100 feet before
    turning in a business or residential district.
- id: 166
  category: sharing_the_road
  question: What must drivers do when approaching a construction area?
  choices:
    A: Increase their speed to get out of the way quickly.
    B: Honk their horn several times to alert workers.
    C: Turn on their hazard lights and maintain speed.
    D: Slow down, stop all wireless telephone communications, and yield the right
      of way.
  answer: D
  explanation: When approaching a construction area, drivers should slow down, stop
    all wireless telephone communications, and yield the right of way.
- id: 167
  category: safe_driving_rules
  question: When must a driver slow down for a school zone?
  choices:
    A: On school days between 6:30 a.m. and 4 p.m., when children are present and
      signs are posted.
    B: Only during school recess periods.
    C: At all times, including weekends and holidays.
    D: On school days between 8:00 a.m. and 3:00 p.m. regardless of signs.
  answer: A
  explanation: A driver must slow down for a school zone on school days between 6:30
    a.m. and 4 p.m., when children are present and signs are posted.
- id: 168
  category: driver_responsibility
  question: What should a driver do if they are pulled over by law enforcement and
    need to get their insurance or registration from the glove box?
  choices:
    A: Quickly reach into the glove box before the officer approaches.
    B: Exit the vehicle to hand the documents to the officer.
    C: Inform the police officer before reaching into the glove box.
    D: Wait for the officer to open the passenger door and check the glove box.
  answer: C
  explanation: If drivers need to obtain insurance or vehicle registration information
    from the glove box, they should inform the police officer before doing so.
- id: 169
  category: safe_driving_rules
  question: When a train is approaching, all vehicles are required to stop within
    how many feet of the nearest rail of a railroad crossing?
  choices:
    A: Between 5 and 10 feet
    B: Exactly 10 feet
    C: Between 15 and 50 feet
    D: Between 50 and 100 feet
  answer: C
  explanation: All vehicles are required to stop between 15 and 50 feet of the nearest
    rail of a railroad crossing when a train is approaching.
- id: 170
  category: sharing_the_road
  question: If a pedestrian must walk on a roadway with two-way traffic because there
    is no sidewalk or shoulder, how should they walk?
  choices:
    A: Facing away from oncoming traffic.
    B: Facing oncoming traffic.
    C: In the center of the roadway.
    D: On the right side of the lane with the flow of traffic.
  answer: B
  explanation: In two-way traffic, pedestrians walking on a roadway should walk facing
    oncoming traffic.
- id: 171
  category: sharing_the_road
  question: Which of the following statements about hitchhiking is true according
    to Illinois law?
  choices:
    A: It is legal as long as the pedestrian stays on the shoulder.
    B: It is illegal to stand on the roadway to ask for a ride.
    C: It is legal only during daylight hours.
    D: It is legal if the pedestrian wears reflective clothing.
  answer: B
  explanation: The manual explicitly states that standing on the roadway to ask for
    a ride (hitchhiking) is illegal.
- id: 172
  category: sharing_the_road
  question: Under what conditions may a pedestrian age 18 or older skate on a public
    roadway?
  choices:
    A: Where the posted speed limit is 45 mph or less, from sunrise to sunset.
    B: Where the posted speed limit is 55 mph or less, at any time of day.
    C: Only in designated residential districts with a 20 mph speed limit.
    D: Skating on public roadways is strictly prohibited for all ages.
  answer: A
  explanation: Pedestrians ages 18 or older may skate on public roadways where the
    posted speed limit is 45 mph or less from sunrise to sunset as long as vehicular
    traffic is not impeded.
- id: 173
  category: safe_driving_rules
  question: If a driver must stop their vehicle in an emergency on a highway outside
    a business or residential district, they must ensure there is a clear view of
    the vehicle for at least how many feet in each direction?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: In an emergency, drivers may stop their vehicle and park only if there
    is a clear view of 200 feet in each direction.
- id: 174
  category: safe_driving_rules
  question: What is the legal limit for the number of passengers allowed in the front
    and rear seats of a vehicle?
  choices:
    A: As many as can comfortably fit without obstructing the driver's view.
    B: No more people than there are seat belts available.
    C: A maximum of three people in the front seat and four in the rear.
    D: There is no limit as long as the vehicle is not overloaded with freight.
  answer: B
  explanation: Illinois law states there should be no more people in the front and
    rear seats as there are seat belts.
- id: 175
  category: sharing_the_road
  question: What is the most common situation that causes a motorcycle crash at an
    intersection?
  choices:
    A: A motorcycle rear-ending an automobile at a stop sign.
    B: An oncoming automobile making a left turn in front of a motorcycle.
    C: A motorcycle attempting to pass an automobile on the right.
    D: An automobile making a right turn while a motorcycle is in its blind spot.
  answer: B
  explanation: The manual states that more than 50% of all motorcycle crashes occur
    at intersections, and the most common situation occurs when an oncoming automobile
    makes a left turn in front of a motorcycle.
- id: 176
  category: signs_and_signals
  question: What may a motorcyclist do if a red light fails to turn green after 120
    seconds?
  choices:
    A: Proceed through the intersection after yielding the right of way to oncoming
      traffic.
    B: Treat the intersection as a four-way stop and proceed immediately.
    C: Make a right turn on red, but never proceed straight.
    D: Dismount and walk the motorcycle across the intersection.
  answer: A
  explanation: If a red light fails to turn green after 120 seconds, a motorcyclist
    may proceed through an intersection after yielding the right of way to oncoming
    traffic.
- id: 177
  category: sharing_the_road
  question: How should a driver handle lane sharing with a motorcycle?
  choices:
    A: Share the lane if the motorcycle is staying to the far right.
    B: Share the lane only in heavy traffic conditions.
    C: Never share the lane, as the motorcyclist is entitled to the entire lane.
    D: Share the lane if the road surface is dry and clear.
  answer: C
  explanation: 'The manual explicitly states: "Although there may be enough room in
    the traffic lane for an automobile and a motorcyclist, remember that the motorcyclist
    needs the room to maneuver safely and is entitled to the entire lane. Do not share
    the lane."'
- id: 178
  category: safe_driving_rules
  question: What is the recommended minimum following distance a driver should allow
    when behind a motorcycle?
  choices:
    A: One to two seconds
    B: Two to three seconds
    C: Three to four seconds
    D: Five to six seconds
  answer: C
  explanation: Drivers should allow at least three to four seconds following distance
    when behind a motorcycle so the motorcyclist has enough time to maneuver in an
    emergency.
- id: 179
  category: license_system
  question: Which of the following is required to legally operate an autocycle on
    Illinois roadways?
  choices:
    A: A Class M motorcycle license
    B: A valid Illinois driver's license
    C: A commercial driver's license (CDL)
    D: A special autocycle endorsement
  answer: B
  explanation: An autocycle is a three-wheeled vehicle with a steering wheel and seating
    that does not require straddling. The operator must have a valid Illinois driver’s
    license to legally operate it.
- id: 180
  category: sharing_the_road
  question: How much passing space must a motorist leave when passing a bicyclist?
  choices:
    A: At least 1 foot from the edge of the vehicle's side mirror.
    B: At least 2 feet from the edge of the vehicle's side mirror.
    C: At least 3 feet from the edge of the vehicle's side mirror.
    D: At least 5 feet from the edge of the vehicle's side mirror.
  answer: C
  explanation: When passing a bicyclist, motorists must do so slowly and leave at
    least 3 feet of passing space from the edge of the vehicle’s side mirror.
- id: 181
  category: sharing_the_road
  question: What should a motorist do if they are turning right and a bicyclist is
    approaching on the right?
  choices:
    A: Speed up and make the turn before the bicyclist reaches the intersection.
    B: Honk to warn the bicyclist to stop, then make the turn.
    C: Squeeze past the bicyclist on the left and turn sharply.
    D: Let the bicyclist go through the intersection first before making the right
      turn.
  answer: D
  explanation: If motorists are turning right and a bicyclist is approaching on the
    right, they should let the bicyclist go through the intersection first before
    making a right turn.
- id: 182
  category: defensive_driving
  question: Why should a driver consider using their right hand to open the vehicle
    door after parking?
  choices:
    A: It prevents the door from opening too wide into traffic.
    B: It forces the driver's upper body to turn and look behind for oncoming cyclists.
    C: It is required by Illinois state law for all drivers.
    D: It allows the driver to exit the vehicle more quickly.
  answer: B
  explanation: Using your right hand to open the car door will force your upper body
    to turn and look behind for oncoming cyclists, giving you a better opportunity
    to check your surroundings.
- id: 183
  category: sharing_the_road
  question: What is the minimum age required to operate a Class 3 low-speed electric
    bicycle?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: Persons may operate a Class 3 low-speed electric bicycle only if they
    are 16 years of age or older.
- id: 184
  category: sharing_the_road
  question: What is the maximum number of bicyclists allowed to ride side by side
    on a standard public roadway?
  choices:
    A: One (single file only)
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Bicyclists may ride side by side on the roadway as long as traffic
    is not impeded. Riding more than two abreast is prohibited except on paths or
    parts of roadways set aside for the exclusive use of bicycles.
- id: 185
  category: vehicle_information
  question: What is required if a moped or scooter is carrying two people?
  choices:
    A: A sidecar attached to the right side of the vehicle.
    B: A seat and footrest for the passenger.
    C: An engine with at least 2 horsepower.
    D: A special passenger permit from the DMV.
  answer: B
  explanation: According to the manual, mopeds or scooters carrying two people must
    have a seat and footrest for the passenger.
- id: 186
  category: safe_driving_rules
  question: What should you do when your vehicle is being passed by a motorcycle?
  choices:
    A: Speed up to prevent the motorcycle from passing.
    B: Move onto the shoulder to give the motorcycle more room.
    C: Maintain your lane position and speed.
    D: Brake sharply to let the motorcycle pass quickly.
  answer: C
  explanation: When being passed by a motorcycle, you should maintain your lane position
    and speed, allowing the motorcycle to complete the maneuver.
- id: 187
  category: sharing_the_road
  question: When is a vehicle allowed to park or idle in a designated bike lane?
  choices:
    A: Only when picking up or dropping off passengers.
    B: Only if there are no bicyclists currently present in the lane.
    C: Only during nighttime hours.
    D: Vehicles are never allowed to park or idle in designated bike lanes.
  answer: D
  explanation: Vehicles are not allowed to drive, park, idle, or drop off or pick
    up passengers in designated bike lanes even if bicyclists are not present.
- id: 188
  category: license_system
  question: What type of driver's license is required to operate a scooter with an
    engine displacement of 150cc or greater?
  choices:
    A: Any valid Illinois driver's license
    B: A Class L motorcycle license
    C: A Class M motorcycle license
    D: No license is required
  answer: C
  explanation: According to the manual, if a scooter has an engine with 150cc displacement
    or greater, it is considered a motorcycle and a Class M license is required.
- id: 189
  category: safe_driving_rules
  question: How old must you be to operate a low-speed electric scooter on Illinois
    roadways?
  choices:
    A: 15 years of age or older
    B: 16 years of age or older
    C: 18 years of age or older
    D: 21 years of age or older
  answer: C
  explanation: The manual states that you must be 18 years of age or older to operate
    a low-speed electric scooter.
- id: 190
  category: sharing_the_road
  question: Why should you always dim your headlights when following a truck at night?
  choices:
    A: Bright lights will drain your vehicle's battery faster.
    B: Bright lights will blind the drivers of large vehicles when they reflect off
      the large side mirrors.
    C: Bright lights make it difficult for oncoming traffic to see the truck.
    D: Bright lights can cause the truck's taillights to appear dimmer.
  answer: B
  explanation: You should always dim headlights when following a truck at night because
    bright lights will blind the drivers of large vehicles when they reflect off the
    large side mirrors.
- id: 191
  category: sharing_the_road
  question: What should a driver do when passing a large truck at night to let the
    truck driver know their intent?
  choices:
    A: Sound the horn continuously until the pass is complete.
    B: Turn on the hazard lights.
    C: Blink the vehicle's headlights.
    D: Drive closely alongside the truck's cab.
  answer: C
  explanation: The manual advises drivers to blink the vehicle's headlights when passing
    a truck to let the truck driver know, especially at night.
- id: 192
  category: safe_driving_rules
  question: What does Illinois law require you to do when approaching a disabled vehicle
    using hazard lights on a four-lane highway?
  choices:
    A: Stop immediately and offer assistance.
    B: Change lanes away from the disabled vehicle if it is safe to do so.
    C: Maintain your speed and stay in your current lane.
    D: Honk your horn to alert the disabled vehicle's driver.
  answer: B
  explanation: When approaching any disabled vehicle using hazard lights on a four-lane
    highway, Illinois law requires drivers to change lanes away from the disabled
    vehicle if it is safe to do so.
- id: 193
  category: vehicle_information
  question: When towing one vehicle with another using a drawbar, what is the maximum
    distance allowed between the two cars in most cases?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Illinois law states that when towing one vehicle with another, the
    distance between the two cars should not exceed 15 feet in most cases.
- id: 194
  category: penalties_and_points
  question: After how many hours can law enforcement request an abandoned vehicle
    be towed from a highway in an urban area at the owner's expense?
  choices:
    A: 2 hours
    B: 10 hours
    C: 24 hours
    D: 48 hours
  answer: B
  explanation: Law enforcement may request that a vehicle be towed at the owner's
    expense if it has been left along a highway in an urban area after 10 hours.
- id: 195
  category: safe_driving_rules
  question: 'Low-speed vehicles may operate on any street with a posted speed limit
    of:'
  choices:
    A: 25 mph or less.
    B: 30 mph or less.
    C: 35 mph or less.
    D: 45 mph or less.
  answer: B
  explanation: Low-speed vehicles may operate on any street with a posted speed limit
    of 30 mph or less unless prohibited by the local municipality.
- id: 196
  category: sharing_the_road
  question: What is the normal speed range for slow-moving vehicles such as farm vehicles
    and animal-drawn vehicles?
  choices:
    A: 5-20 mph
    B: 15-30 mph
    C: 20-35 mph
    D: 25-40 mph
  answer: A
  explanation: Normal speeds for slow-moving vehicles range from 5-20 mph.
- id: 197
  category: vehicle_information
  question: When lights are required, what type of signal must be mounted as high
    as possible on the rear of a slow-moving vehicle?
  choices:
    A: A solid red light visible for 100 feet.
    B: A flashing amber signal visible for 500 feet in sunlight.
    C: A rotating blue light visible for 300 feet.
    D: A flashing white light visible for 1000 feet.
  answer: B
  explanation: When lights are required, a flashing amber signal must be mounted as
    high as possible on the rear of the vehicle, visible for 500 feet in sunlight.
- id: 198
  category: sharing_the_road
  question: Why should you never sound a horn when near a horseback rider or other
    livestock?
  choices:
    A: It is a violation of local noise ordinances.
    B: The sound may frighten the animal and cause a crash.
    C: It will cause the rider to lose their right-of-way.
    D: It signals the rider to move to the left side of the road.
  answer: B
  explanation: Never sound a horn when near a horse or other livestock, as the sound
    may frighten it and cause a crash.
- id: 199
  category: alcohol_drugs_health
  question: In Illinois, it is illegal to drive if your Blood-Alcohol Concentration
    (BAC) is at or above what percentage?
  choices:
    A: .04%
    B: .05%
    C: .08%
    D: .10%
  answer: C
  explanation: It is illegal to drive if your BAC is .08% or more.
- id: 200
  category: alcohol_drugs_health
  question: Can you be convicted of Driving Under the Influence (DUI) if your Blood-Alcohol
    Concentration (BAC) is less than .08%?
  choices:
    A: No, you can only be convicted if your BAC is exactly .08% or higher.
    B: Yes, but only if you are under 21 years of age.
    C: Yes, you can be convicted if your driving ability is impaired.
    D: No, a BAC under .08% is considered legally safe in all circumstances.
  answer: C
  explanation: You can be convicted of Driving Under the Influence (DUI) if your BAC
    is less than .08% but your driving ability is impaired.
- id: 201
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to remove the effects
    of alcohol from your system?
  choices:
    A: Drinking strong coffee
    B: Taking a cold shower
    C: Eating a heavy meal
    D: Time
  answer: D
  explanation: Time is the only way to remove the effects of alcohol. Food, coffee,
    and showers do not speed up the process.
- id: 202
  category: license_system
  question: What type of driver's license is required to operate a moped on Illinois
    roadways?
  choices:
    A: A Class M motorcycle license
    B: A Class L motorcycle license
    C: Any valid Illinois driver's license
    D: A commercial driver's license (CDL)
  answer: C
  explanation: A moped may be operated with any valid Illinois driver's license, provided
    the engine does not exceed 50cc and does not require shifting gears.
- id: 203
  category: alcohol_drugs_health
  question: Under Illinois law, what is the legal limit for cannabis tetrahydrocannabinol
    (THC) concentration in whole blood while operating a motor vehicle?
  choices:
    A: 2 nanograms or more per milliliter
    B: 5 nanograms or more per milliliter
    C: 8 nanograms or more per milliliter
    D: 10 nanograms or more per milliliter
  answer: B
  explanation: It is illegal to operate a motor vehicle on Illinois highways with
    a cannabis tetrahydrocannabinol concentration (THC) of either 5 nanograms or more
    per milliliter of whole blood.
- id: 204
  category: safe_driving_rules
  question: How must cannabis be transported in a motor vehicle?
  choices:
    A: In the glove compartment or center console
    B: In a sealed, odor-proof, and child-resistant container
    C: In the trunk or behind the last row of seats
    D: In a clear, plastic bag placed on the passenger seat
  answer: B
  explanation: Cannabis may only be transported in a vehicle in a sealed, odor-proof,
    and child-resistant container.
- id: 205
  category: penalties_and_points
  question: How long will a DUI offense remain on your driving record in Illinois?
  choices:
    A: 5 years
    B: 10 years
    C: 20 years
    D: Permanently
  answer: D
  explanation: If you are convicted of DUI, the offense will permanently remain on
    your driving record.
- id: 206
  category: driver_responsibility
  question: What does the Implied Consent Law mean for drivers on Illinois roadways?
  choices:
    A: You automatically consent to submit to certain tests to determine if you are
      under the influence.
    B: You consent to having your vehicle searched at any traffic stop.
    C: You agree to pay all fines immediately upon receiving a citation.
    D: You consent to a mandatory license suspension if involved in any crash.
  answer: A
  explanation: When operating on Illinois roadways, you automatically consent to submit
    to certain tests. These can include breath, blood, urine, or other bodily substance
    tests to determine if you were under the influence.
- id: 207
  category: penalties_and_points
  question: If you are a first-time offender and refuse to submit to chemical testing,
    how long will your driving privileges be suspended?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 3 years
  answer: C
  explanation: If you refuse to submit to chemical testing, your driving privileges
    will be suspended for one year.
- id: 208
  category: penalties_and_points
  question: When a police officer takes your driver's license at the time of a DUI
    arrest, how many days does the temporary receipt allow you to drive before the
    suspension begins?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: C
  explanation: At the time of arrest, the officer will take your driver's license
    and, if valid, provide you with a temporary receipt allowing you to drive for
    45 days. The statutory summary suspension begins on the 46th day.
- id: 209
  category: penalties_and_points
  question: What is the minimum revocation period for a first DUI conviction in Illinois?
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 5 years
  answer: B
  explanation: A first DUI conviction results in a minimum one-year revocation of
    driving privileges.
- id: 210
  category: penalties_and_points
  question: How long must a driver file Financial Responsibility Insurance after a
    DUI conviction?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: A DUI conviction also requires you to file Financial Responsibility
    Insurance for three years.
- id: 211
  category: vehicle_information
  question: What does a Monitoring Device Driving Permit (MDDP) require a first-time
    DUI offender to have installed in their vehicle?
  choices:
    A: A GPS tracking system
    B: A Breath Alcohol Ignition Interlock Device (BAIID)
    C: A dashboard camera
    D: An electronic speed limiter
  answer: B
  explanation: An MDDP requires a Breath Alcohol Ignition Interlock Device (BAIID)
    to be installed on their vehicle(s) at an approved installation site as a condition
    of driving relief.
- id: 212
  category: penalties_and_points
  question: Which of the following situations could result in an Aggravated DUI charge?
  choices:
    A: Receiving a first-time DUI with a BAC of .09%.
    B: Committing a DUI while driving a school bus with children.
    C: Refusing a breath test during a routine traffic stop.
    D: Transporting an open container of alcohol in the trunk.
  answer: B
  explanation: You may be charged with Aggravated DUI if you committed DUI while driving
    a school bus with children or operating a vehicle for hire, such as a limousine.
- id: 213
  category: safe_driving_rules
  question: In which of the following vehicles is it legal for passengers to consume
    alcoholic beverages?
  choices:
    A: A standard passenger car
    B: A pickup truck
    C: A chartered bus used for nonschool purposes
    D: A school bus
  answer: C
  explanation: It is illegal for anyone to drink alcoholic beverages in a vehicle.
    Passengers on chartered buses used for nonschool purposes, motor homes, mini motor
    homes, and limousines are exempt.
- id: 214
  category: driver_responsibility
  question: What penalty may a medical cannabis registry card holder face if they
    drive while impaired by cannabis?
  choices:
    A: A mandatory 30-day jail sentence
    B: Revocation of their medical cannabis card for two years
    C: Confiscation of their vehicle
    D: A permanent ban from the medical cannabis program
  answer: B
  explanation: Driving while impaired by the use of cannabis... may result in the
    loss of driving privileges and, for a medical cannabis registry card holder, the
    revocation of the driver’s medical cannabis card for two years.
- id: 215
  category: driver_responsibility
  question: What are the potential consequences for a parent or legal guardian who
    allows persons under age 21 to consume alcohol on their private property if a
    death or personal injury occurs?
  choices:
    A: They may face criminal penalties.
    B: They will receive a warning citation.
    C: They must attend a mandatory parenting class.
    D: They will have their property confiscated.
  answer: A
  explanation: If a death or personal injury occurs as a result of consumption, the
    parent or legal guardian may face criminal penalties.
- id: 216
  category: alcohol_drugs_health
  question: 'If a driver under age 21 is found to have any trace of alcohol in their
    system while operating a motor vehicle, their driving privileges will be suspended
    for a minimum of:'
  choices:
    A: One month
    B: Three months
    C: Six months
    D: One year
  answer: B
  explanation: If you are under age 21 and found to have any trace of alcohol in your
    system while operating a motor vehicle, you will have your driving privileges
    suspended for a minimum of three months.
- id: 217
  category: penalties_and_points
  question: What is the minimum penalty for a driver under age 21 who receives their
    first conviction for a DUI?
  choices:
    A: Revocation of driving privileges for a minimum of two years
    B: Suspension of driving privileges for six months
    C: A $500 fine and 30 days in jail
    D: Revocation of driving privileges for a minimum of one year
  answer: A
  explanation: If you are under age 21 and convicted of DUI, you face the revocation
    of your driving privileges for a minimum of two years for a first conviction.
- id: 218
  category: driver_responsibility
  question: If a driver's license was suspended before they reached age 21, what are
    they required to successfully complete before it can be re-issued?
  choices:
    A: A 50-hour community service program
    B: A driver remedial education course
    C: An advanced defensive driving course
    D: A substance abuse rehabilitation program
  answer: B
  explanation: If your driver's license was suspended before age 21, you will be required
    to successfully complete a driver remedial education course.
- id: 219
  category: safe_driving_rules
  question: Regardless of fault, a crash report must be filed by the driver if the
    crash involves property damage of more than what amount (assuming all vehicles
    are insured)?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: C
  explanation: A crash report must be filed by the driver of a vehicle if the crash
    involves death, bodily injury, or property damage of more than $1,500.
- id: 220
  category: safe_driving_rules
  question: 'If any vehicle involved in a crash is uninsured, a crash report must
    be filed if the property damage is more than:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: If any vehicle involved in the crash is uninsured, a report must be
    filed if property damage is more than $500 or more.
- id: 221
  category: driver_responsibility
  question: How much time does a driver have to report a crash after it occurs?
  choices:
    A: 30 minutes
    B: 1 hour
    C: 12 hours
    D: 24 hours
  answer: A
  explanation: A driver has 30 minutes to report a crash after it occurs. If drivers
    are involved in a crash, they should notify the police immediately.
- id: 222
  category: penalties_and_points
  question: What is the potential penalty for a driver who fails to report a vehicle
    crash?
  choices:
    A: A fine up to $500 and 30 days in jail
    B: A fine up to $1,000 and 6 months in jail
    C: A fine up to $2,500 and a jail sentence of up to one year
    D: A fine up to $5,000 and a jail sentence of up to two years
  answer: C
  explanation: Drivers who fail to report a vehicle crash may be fined up to $2,500
    and given a jail sentence of up to one year.
- id: 223
  category: safe_driving_rules
  question: If you are involved in a crash that causes damage to an unattended vehicle
    and the owner cannot be found, what information must you leave on the vehicle?
  choices:
    A: Your name, address, phone number, and license plate number
    B: Your driver's license number and insurance policy number
    C: Your name, insurance company, and vehicle identification number (VIN)
    D: Only your phone number and first name
  answer: A
  explanation: If you are involved in a crash that causes damage to an unattended
    vehicle... Leave your name, address, phone number and license plate number on
    the vehicle or property if the owner cannot be found.
- id: 224
  category: penalties_and_points
  question: What action will the Secretary of State's office take if a driver is convicted
    of leaving the scene of a crash where a death or personal injury has occurred?
  choices:
    A: Suspend the driver's license for 6 months
    B: Revoke the individual's driver's license
    C: Require the driver to retake the driving exam
    D: Issue a warning and a $1,000 fine
  answer: B
  explanation: In cases where a death or personal injury has occurred, the Secretary
    of State's office is required to revoke the individual's driver's license.
- id: 225
  category: driver_responsibility
  question: If you are under age 18 and are required to appear in court for a traffic
    ticket, who must be present with you?
  choices:
    A: A licensed driver age 21 or older
    B: A driver's education instructor
    C: A parent or legal guardian
    D: An attorney
  answer: C
  explanation: If you are under age 18 and are required to appear in court, you must
    have a parent/legal guardian present at the court appearance.
- id: 226
  category: penalties_and_points
  question: Under the Safety Responsibility Law, if you are at fault in a crash resulting
    in injury or property damage and do not have liability insurance, what must you
    do?
  choices:
    A: Surrender your vehicle to the state
    B: Post security to cover damages suffered by the injured party
    C: Complete 100 hours of community service
    D: Pay a mandatory $5,000 fine to the Secretary of State
  answer: B
  explanation: The Safety Responsibility Law requires you to post security (a guarantee
    of payment) to cover damages suffered by the injured party if you are at fault
    in a crash and do not have liability insurance.
- id: 227
  category: penalties_and_points
  question: 'Individuals convicted of mandatory insurance violations will lose their
    driving privileges for a minimum of:'
  choices:
    A: One month
    B: Three months
    C: Six months
    D: One year
  answer: B
  explanation: Individuals convicted of mandatory insurance violations will lose their
    driving privileges for a minimum of three months and be required to pay a $100
    reinstatement fee.
- id: 228
  category: driver_responsibility
  question: Which of the following is an acceptable form of proof of financial responsibility?
  choices:
    A: A written promise to pay future damages
    B: A certificate of insurance (SR-22)
    C: A valid vehicle registration card
    D: A notarized letter from an employer
  answer: B
  explanation: Proof of financial responsibility may include a certificate of insurance
    (SR-22), a bond, or a deposit of securities.
- id: 229
  category: safe_driving_rules
  question: 'Drivers age 55 or over may receive a reduction in their motor vehicle
    liability insurance if they successfully complete:'
  choices:
    A: A four-hour highway safety seminar
    B: An eight-hour defensive driving course
    C: A written driver's license exam
    D: A vision and hearing screening
  answer: B
  explanation: If you are age 55 or over, you may receive a reduction in your motor
    vehicle liability insurance if you successfully complete an eight-hour defensive
    driving course.
- id: 230
  category: alcohol_drugs_health
  question: What are the potential penalties for providing alcohol to a person under
    age 21?
  choices:
    A: A warning and a mandatory education class
    B: A fine, jail sentence, and suspension of driving privileges
    C: Revocation of vehicle registration only
    D: A $100 fine and community service
  answer: B
  explanation: If you are convicted of providing alcohol to a person under age 21,
    you may be fined, be sentenced to jail, and have your driving privileges suspended.
- id: 231
  category: penalties_and_points
  question: What is the definition of a driver's license revocation?
  choices:
    A: The temporary loss of driving privileges for a specific length of time
    B: The indefinite withdrawal of driving privileges by the Secretary of State's
      office
    C: The termination of driving privileges due to an error or defect
    D: A mandatory warning issued for a first-time traffic offense
  answer: B
  explanation: The manual defines a revocation as the indefinite withdrawal of driving
    privileges by the Secretary of State's office.
- id: 232
  category: penalties_and_points
  question: After a driver's license is revoked, what is the minimum amount of time
    a driver must generally wait before they are eligible to reapply for a license?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Five years
  answer: B
  explanation: To regain driving privileges after a revocation, you may be eligible
    to reapply for a license after a minimum of one year unless otherwise noted.
- id: 233
  category: penalties_and_points
  question: Which of the following offenses will result in the immediate revocation
    of a person's driving privileges?
  choices:
    A: A moving violation that caused a crash resulting in the death of another person
    B: Receiving two traffic violations within a 12-month period
    C: Parking in a space designated for persons with disabilities
    D: Failure to pay three automated traffic violations
  answer: A
  explanation: The Secretary of State will immediately revoke the driving privileges
    of anyone who is convicted of a moving violation that caused a crash and resulted
    in the death of another person.
- id: 234
  category: penalties_and_points
  question: What must a driver do to regain their driving privileges after a suspension
    period has ended?
  choices:
    A: Retake the written and driving tests
    B: Pay a reinstatement fee
    C: Complete an eight-hour defensive driving course
    D: Surrender their vehicle registration
  answer: B
  explanation: When a suspension is for a specific length of time, you may regain
    your driving privileges after the suspension has ended and you have paid a reinstatement
    fee.
- id: 235
  category: alcohol_drugs_health
  question: A driver's license may be suspended if chemical testing following a DUI
    arrest discloses a THC level of at least how many nanograms per milliliter of
    whole blood?
  choices:
    A: 2 nanograms
    B: 5 nanograms
    C: 8 nanograms
    D: 10 nanograms
  answer: B
  explanation: A suspension may occur for a Drug/Alcohol Test Failure disclosing a
    THC level of either 5 nanograms or more per milliliter of whole blood.
- id: 236
  category: penalties_and_points
  question: For a driver under age 21, how many traffic violation convictions within
    a 24-month period will result in a driver's license suspension?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: A
  explanation: If you are under age 21 at the time of arrest, two traffic violations
    within any 24-month period will result in a suspension.
- id: 237
  category: penalties_and_points
  question: For a driver aged 21 or older, a driver's license suspension may occur
    upon receiving how many traffic violation convictions during a 12-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: For drivers 21 and older, a suspension may occur for three traffic
    violation convictions during a 12-month period.
- id: 238
  category: alcohol_drugs_health
  question: What constitutes a Zero Tolerance Violation for a person under age 21?
  choices:
    A: Having an alcohol concentration of exactly 0.08
    B: Having an alcohol concentration of greater than 0.00 but less than 0.08
    C: Refusing to take a chemical test
    D: Transporting alcohol illegally in a vehicle
  answer: B
  explanation: A Zero Tolerance Violation is defined as having an alcohol concentration
    of greater than 0.00, but less than 0.08, by a person under age 21.
- id: 239
  category: license_system
  question: Which action involves the termination of driving privileges because of
    an error or defect in the license?
  choices:
    A: Revocation
    B: Suspension
    C: Cancellation
    D: Denial
  answer: C
  explanation: Cancellation is the termination of driving privileges by formal action.
    It will occur because of an error or defect in the license or because the licensee
    is no longer entitled to the license.
- id: 240
  category: alcohol_drugs_health
  question: A driver aged 21 or older may have their license suspended for the illegal
    transportation of alcohol if they are convicted of the offense how many times
    in a 12-month period?
  choices:
    A: Once
    B: Twice
    C: Three times
    D: Four times
  answer: B
  explanation: A suspension may occur for the illegal transportation of alcohol twice
    in 12 months if the driver is age 21 or older.
- id: 241
  category: penalties_and_points
  question: A driver's license may be suspended for a second violation of speeding
    in a construction zone when workers are present if it occurs within what timeframe
    of the previous violation?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Three years
  answer: C
  explanation: A suspension may occur for a second violation within two years of the
    previous violation of speeding in a construction zone when workers are present.
- id: 242
  category: penalties_and_points
  question: How many unpaid automated traffic violations for red-light or speeding
    offenses can lead to a driver's license suspension?
  choices:
    A: Two or more
    B: Three or more
    C: Four or more
    D: Five or more
  answer: D
  explanation: Failure to pay five or more unpaid automated traffic violations for
    violating a red-light signal or speeding in a municipality can result in a suspension.
- id: 243
  category: penalties_and_points
  question: A driver's license may be revoked for reckless driving if the driver is
    convicted of how many reckless driving offenses within 12 months?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: A revocation may occur for a conviction of three reckless driving offenses
    in 12 months.
- id: 244
  category: penalties_and_points
  question: What is a potential consequence of driving while your driver's license
    is suspended or revoked?
  choices:
    A: The suspension or revocation period will be reduced
    B: You will be required to take an eight-hour defensive driving course
    C: The suspension or revocation period will be extended and you may face incarceration
    D: Your vehicle will be permanently confiscated
  answer: C
  explanation: Driving while a driver's license is suspended or revoked will result
    in an extension of the suspension or revocation period and may subject the driver
    to a period of incarceration.
- id: 245
  category: license_system
  question: Which of the following is a reason a driver's license may be canceled
    in Illinois?
  choices:
    A: Failing to pay a parking ticket.
    B: Being medically or visually unfit to safely operate a motor vehicle.
    C: Receiving one speeding ticket.
    D: Driving without insurance.
  answer: B
  explanation: According to the manual, a driver's license may be canceled for medical
    conditions, including being medically or visually unfit to safely operate a motor
    vehicle.
- id: 246
  category: penalties_and_points
  question: If an individual under age 18 is convicted of a serious moving violation,
    how long is the denial of their application for a driver's license?
  choices:
    A: 6 months or until their 21st birthday.
    B: 9 months or until their 18th birthday, whichever is shorter.
    C: 12 months.
    D: Until their 21st birthday.
  answer: B
  explanation: A denial for a serious moving violation for an individual under 18
    lasts for either nine months or until the person's 18th birthday, whichever is
    shorter.
- id: 247
  category: penalties_and_points
  question: Can the Secretary of State deny issuing or renewing a driver's license
    if a driver is charged with an offense due to a crash resulting in serious injury
    or death, even if alcohol was not involved?
  choices:
    A: Yes, alcohol does not need to be a factor in the crash.
    B: No, alcohol must be a factor for a denial to occur.
    C: Yes, but only if the driver is under age 18.
    D: No, a conviction is required before a denial can be issued.
  answer: A
  explanation: The Secretary of State's office may deny issuing or renewing a driver's
    license if charged with an offense due to a crash resulting in serious injury
    or death, and alcohol need not play a factor.
- id: 248
  category: license_system
  question: What is the minimum age to be issued a Restricted Driving Permit (RDP)?
  choices:
    A: '15'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: The manual states that a Restricted Driving Permit (RDP) cannot be
    issued to a person under age 16.
- id: 249
  category: license_system
  question: Who is eligible for an Occupational Driving Permit (ODP)?
  choices:
    A: Any driver suspended for a DUI
    B: A commercial driver suspended for three moving violations
    C: A professional driver whose license is suspended for three moving violations,
      provided they drive for a living
    D: A driver under age 18 suspended for a serious moving violation
  answer: C
  explanation: An ODP allows a professional driver whose license has been suspended
    for three moving violations to operate a vehicle in conjunction with employment.
    It does not apply to commercial drivers.
- id: 250
  category: penalties_and_points
  question: A Family Financial Responsibility Driving Permit (FRP) is issued to a
    driver whose license was suspended for which of the following reasons?
  choices:
    A: Nonpayment of child support
    B: Driving under the influence
    C: Three moving violations in 12 months
    D: Fleeing the scene of a crash
  answer: A
  explanation: An FRP allows a driver whose license was suspended for nonpayment of
    child support or child visitation abuse to operate a vehicle.
- id: 251
  category: signs_and_signals
  question: If you approach an intersection with an eight-sided red STOP sign but
    there is no stop line or crosswalk, where must you stop?
  choices:
    A: Ten feet before the intersection
    B: Before entering the intersection
    C: Next to the stop sign
    D: You do not need to stop if the intersection is clear
  answer: B
  explanation: 'The manual states for a STOP sign: "If there is no stop line, stop
    before entering the crosswalk. If there is no crosswalk, stop before entering
    the intersection."'
- id: 252
  category: signs_and_signals
  question: What shape is the advance warning sign for a railroad crossing?
  choices:
    A: Eight-sided
    B: Three-sided
    C: Round
    D: Diamond-shaped
  answer: C
  explanation: A round sign indicates a RAILROAD CROSSING ahead. It is an advance
    warning sign that means a railroad track will cross the roadway ahead.
- id: 253
  category: signs_and_signals
  question: What does a five-sided yellow or yellow-green sign with black symbols
    indicate?
  choices:
    A: No Passing Zone
    B: Railroad Crossing
    C: School Zone or School Crossing
    D: Yield Right of Way
  answer: C
  explanation: A five-sided sign is yellow or yellow-green with black symbols and
    means either SCHOOL ZONE or SCHOOL CROSSING.
- id: 254
  category: signs_and_signals
  question: Where will a three-sided yellow sign indicating a NO PASSING ZONE appear?
  choices:
    A: On the right side of a multi-lane highway
    B: On the left side of a two-lane, two-way roadway
    C: Suspended above the center of the intersection
    D: On the right side of a one-way street
  answer: B
  explanation: The NO PASSING ZONE sign will appear on the left side of a two-lane,
    two-way roadway at the beginning of the area where "no passing" pavement markings
    are also used.
- id: 255
  category: signs_and_signals
  question: What type of warning signs are usually ORANGE?
  choices:
    A: Pedestrian and bicycle crossings
    B: School bus stops
    C: Construction or maintenance zones
    D: Guide signs for upcoming destinations
  answer: C
  explanation: ORANGE is used for warning signs, usually found in construction or
    maintenance zones along streets and highways.
- id: 256
  category: signs_and_signals
  question: What is the purpose of GREEN roadway signs?
  choices:
    A: To warn of road conditions and dangers ahead
    B: To indicate regulatory rules that must be obeyed
    C: To alert drivers to school zones
    D: To tell you where you are, which way to go, and the distance to upcoming destinations
  answer: D
  explanation: GREEN is used for guide signs. These signs tell you where you are,
    which way to go, and the distance to upcoming destinations.
- id: 257
  category: license_system
  question: A Probationary License allows a driver to operate a vehicle during a suspension
    period. What is the minimum age requirement for this license?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: A Probationary License allows a driver age 21 and over whose license
    has been suspended for three moving violations in a 12-month period to operate
    a vehicle during the period of suspension.
- id: 258
  category: signs_and_signals
  question: YELLOW-GREEN signs are used to alert drivers to which of the following?
  choices:
    A: Construction and maintenance projects
    B: Pedestrian and bicycle crossings, playground areas, and school zones
    C: Wrong way or do not enter warnings
    D: Distances to upcoming destinations
  answer: B
  explanation: YELLOW-GREEN can be used for warning signs that alert you to pedestrian
    and bicycle crossings, playground areas, school bus stops, and school zones.
- id: 259
  category: signs_and_signals
  question: What color is used for guide signs that tell you about services along
    the roadway?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: Pink
  answer: B
  explanation: According to the manual, BLUE is used for guide signs that tell you
    about services along the roadway.
- id: 260
  category: signs_and_signals
  question: Which sign color is used to alert drivers to possible dangers ahead due
    to unplanned traffic incidents, such as traffic crashes?
  choices:
    A: Orange
    B: Brown
    C: Pink
    D: Yellow
  answer: C
  explanation: PINK may be used for traffic incident signing to alert you to possible
    dangers ahead due to unplanned traffic incidents, such as traffic crashes and
    natural disasters.
- id: 261
  category: safe_driving_rules
  question: When approaching an intersection with an All-Way Stop sign, how is the
    right-of-way determined?
  choices:
    A: The vehicle on the right always goes first.
    B: The first driver to stop is the first driver to go.
    C: The largest vehicle has the right-of-way.
    D: Vehicles turning left must go first.
  answer: B
  explanation: At an All-Way Stop, traffic from all directions must stop. The first
    driver to stop is the first driver to go, and other drivers must wait their turn.
- id: 262
  category: safe_driving_rules
  question: Under what circumstances is it legal to drive slower than the posted minimum
    speed limit on a controlled-access highway?
  choices:
    A: When driving in the far right lane.
    B: When it is necessary for safety.
    C: When driving a commercial vehicle.
    D: It is never legal to drive below the minimum speed limit.
  answer: B
  explanation: Driving slower than the minimum speed limit is illegal unless necessary
    for safety.
- id: 263
  category: safe_driving_rules
  question: Who is permitted to use the openings in a divided highway where "No U-Turn"
    signs are posted?
  choices:
    A: Any vehicle making a U-turn during daylight hours.
    B: Only passenger vehicles.
    C: Authorized vehicles such as police cars, ambulances, and snow plows.
    D: Vehicles that missed their exit.
  answer: C
  explanation: Openings in a divided highway are only for authorized vehicles, such
    as police cars, ambulances, snow plows, construction/maintenance equipment, and
    other emergency vehicles.
- id: 264
  category: sharing_the_road
  question: How are bicycle lanes sometimes painted to increase visibility?
  choices:
    A: Bright red
    B: Bright green
    C: Fluorescent yellow
    D: Solid orange
  answer: B
  explanation: Bicycle lanes are sometimes painted a bright green color to increase
    visibility.
- id: 265
  category: safe_driving_rules
  question: What is the rule regarding the use of wireless/cellphones while driving
    in a posted school speed zone?
  choices:
    A: It is allowed if using a hands-free device.
    B: It is prohibited.
    C: It is allowed only when children are not visible.
    D: It is allowed for making quick phone calls only.
  answer: B
  explanation: The use of wireless/cellphones is prohibited while driving in a posted
    school speed zone.
- id: 266
  category: safe_driving_rules
  question: What are the usual hours that a posted school zone speed limit applies
    on school days when children are present?
  choices:
    A: 7:00 a.m. to 3:00 p.m.
    B: 8:00 a.m. to 5:00 p.m.
    C: 6:30 a.m. to 4:00 p.m.
    D: 7:30 a.m. to 4:30 p.m.
  answer: C
  explanation: The posted speed applies only on school days when children are present,
    and the usual school hours are from 6:30 a.m. to 4 p.m.
- id: 267
  category: safe_driving_rules
  question: How should drivers handle a reduction in lanes during times of heavy traffic
    congestion?
  choices:
    A: Merge into the open lane as early as possible.
    B: Stop and wait for a gap in traffic.
    C: Use both lanes to advance to the lane reduction point and merge alternating
      turns.
    D: Drive on the shoulder to bypass the congestion.
  answer: C
  explanation: During times of congestion, it is advised that you use both lanes to
    advance to the lane reduction point and merge at that location, alternating turns
    (known as the "zipper merge").
- id: 268
  category: signs_and_signals
  question: A "Narrow Bridge" sign warns that the approaching bridge width is generally
    how much less than the width of the approach pavement?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 4 feet
  answer: B
  explanation: A bridge width is generally 2 feet less than the width of the approach
    pavement.
- id: 269
  category: signs_and_signals
  question: While most warning signs are yellow, what color may some communities use
    for pedestrian, bicycle, and school signs?
  choices:
    A: Fluorescent yellow-green
    B: Bright orange
    C: Neon pink
    D: Reflective white
  answer: A
  explanation: While most warning signs are yellow, some communities may use fluorescent
    yellow-green pedestrian, bicycle, and school signs.
- id: 270
  category: signs_and_signals
  question: What does a "Pass with Care" sign indicate to a driver?
  choices:
    A: You are entering a school zone.
    B: You have reached the end of a no-passing zone.
    C: You must pass all slower vehicles immediately.
    D: You are approaching a narrow bridge.
  answer: B
  explanation: The "Pass with Care" sign informs you that you have reached the end
    of the no-passing zone and may pass now only when it is safe.
- id: 271
  category: signs_and_signals
  question: Where will a three-sided yellow "No Passing Zone" sign appear on a two-lane,
    two-way roadway?
  choices:
    A: On the right side of the roadway.
    B: Suspended over the center of the roadway.
    C: On the left side of the roadway.
    D: On the shoulder of the right lane.
  answer: C
  explanation: The three-sided yellow "No Passing Zone" sign will appear on the left
    side of a two-lane, two-way roadway at the beginning of the area where "no passing"
    pavement markings are also used.
- id: 272
  category: signs_and_signals
  question: Why are advance warning signs like "Stop Ahead" or "Signal Ahead" often
    used in high-speed areas?
  choices:
    A: Because high-speed areas have more pedestrians.
    B: Because of the longer distance needed to slow down or stop.
    C: To warn drivers of upcoming toll booths.
    D: To indicate that the speed limit is about to increase.
  answer: B
  explanation: Advance warning signs are used in high-speed areas because of the longer
    distance needed to slow down or stop.
- id: 273
  category: safe_driving_rules
  question: What is the recommended procedure known as the 'zipper merge' during times
    of congestion?
  choices:
    A: Merging immediately as soon as you see a lane closed ahead sign.
    B: Using both lanes to advance to the lane reduction point and merging by alternating
      turns.
    C: Driving on the shoulder to bypass traffic congestion and merge at the front.
    D: Stopping in the open lane to let all merging traffic go first.
  answer: B
  explanation: During times of congestion, it is advised that you use both lanes to
    advance to the lane reduction point and merge at that location, alternating turns.
    This is known as the 'zipper merge'.
- id: 274
  category: signs_and_signals
  question: Where is a 'No Passing' sign typically posted on a two-lane, two-way road?
  choices:
    A: On the right side of the road at the end of a passing zone.
    B: In the center median of a divided highway.
    C: On the left side of the road at the beginning of a no passing zone.
    D: Suspended directly above the center of the roadway.
  answer: C
  explanation: The manual states that the 'No Passing' sign is posted on the left
    side of the road at the beginning of a no passing zone on two-lane, two-way roads.
- id: 275
  category: sharing_the_road
  question: When a driver on an expressway approaches a merge sign just before an
    expressway ramp, what should they do?
  choices:
    A: Speed up to pass the merging vehicle quickly.
    B: Stop immediately on the expressway to yield.
    C: Sound their horn to warn the merging driver to yield.
    D: Slow down to let the driver on the ramp merge.
  answer: D
  explanation: According to the manual, when merge signs appear on expressways just
    before ramps, the driver on the expressway should slow down to let the driver
    on the ramp merge.
- id: 276
  category: signs_and_signals
  question: What does a 'Two-Way Roadway' sign inform a driver?
  choices:
    A: They are entering a one-way street.
    B: They are leaving a divided roadway and approaching a two-way highway.
    C: They must turn around because the road is closed ahead.
    D: They are approaching a four-lane expressway.
  answer: B
  explanation: The 'Two-Way Roadway' sign informs you that you are leaving a divided
    roadway and approaching a two-way highway.
- id: 277
  category: safe_driving_rules
  question: What must you do if you are signaled to stop by a flagger in a construction
    zone?
  choices:
    A: Slow down to 10 mph and proceed cautiously.
    B: Stop only if there is oncoming traffic.
    C: You must stop if signaled to do so.
    D: Change lanes to avoid the flagger.
  answer: C
  explanation: When approaching a flagger, you must slow down and be prepared to obey
    their signals. The manual explicitly states, 'You must stop if signaled to do
    so.'
- id: 278
  category: signs_and_signals
  question: What determines the color of a guide sign?
  choices:
    A: The speed limit of the roadway.
    B: The type of information given on the sign.
    C: The county in which the sign is located.
    D: The physical size of the sign.
  answer: B
  explanation: Guide signs tell you where you are and how to get to a specific location.
    The manual notes that 'The type of information given determines the color of the
    sign.'
- id: 279
  category: defensive_driving
  question: What should you do if you approach a vehicle involved in a crash that
    has a hazardous materials placard and no emergency vehicles are present?
  choices:
    A: Approach the vehicle to check for injured passengers.
    B: Attempt to clean up any spilled materials to prevent environmental damage.
    C: Avoid the crash area and report the accident to emergency responders from a
      safe location.
    D: Direct traffic around the crash site until police arrive.
  answer: C
  explanation: If no emergency vehicles are present at a crash involving a hazardous
    materials placard, you should avoid the crash area and report the accident to
    emergency responders in a safe location.
- id: 280
  category: safe_driving_rules
  question: Is it legal to leave the roadway to avoid a traffic signal?
  choices:
    A: Yes, if the intersection is clear of traffic.
    B: Yes, but only to make a right turn.
    C: No, a driver may never leave the roadway to avoid a traffic signal.
    D: No, unless you are driving an emergency vehicle.
  answer: C
  explanation: 'The manual explicitly states: ''A driver may never leave the roadway
    to avoid a traffic signal.'''
- id: 281
  category: signs_and_signals
  question: How should you treat an intersection when the traffic control signals
    are not working?
  choices:
    A: Treat it as a yield sign for all directions.
    B: Treat it as an all-way stop by coming to a complete stop.
    C: The vehicle on the right always has the right of way without stopping.
    D: Proceed through the intersection at your normal speed.
  answer: B
  explanation: When traffic control signals are not working, you must always treat
    the intersection as an all-way stop by coming to a complete stop, unless directed
    otherwise by law enforcement.
- id: 282
  category: safe_driving_rules
  question: Under what condition may you turn left at a steady red light?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street onto another one-way street that has traffic
      moving to the left.
    C: When there is no oncoming traffic for at least 500 feet.
    D: Left turns are never permitted at a steady red light.
  answer: B
  explanation: You may turn left at a red light when turning from a one-way street
    onto another one-way street that has traffic moving to the left, after coming
    to a complete stop and yielding the right of way.
- id: 283
  category: signs_and_signals
  question: What does a flashing red traffic light mean?
  choices:
    A: Proceed into the intersection with caution without stopping.
    B: The traffic signal is about to turn green.
    C: You must stop, yield the right of way, and proceed when safe.
    D: Stop and wait for the light to turn solid green.
  answer: C
  explanation: A flashing red light means you must stop, yield the right of way to
    traffic within the intersection or crosswalk, and proceed when safe.
- id: 284
  category: signs_and_signals
  question: What does a flashing yellow arrow mean?
  choices:
    A: You may turn in the direction the arrow is pointed after yielding the right
      of way.
    B: You must stop and wait for a solid green arrow.
    C: The green arrow is ending and the light is about to turn red.
    D: You cannot make the movement shown by the arrow.
  answer: A
  explanation: The flashing yellow arrow means you may turn in the direction the arrow
    is pointed after yielding the right of way to any pedestrians and vehicles in
    the intersection or crosswalk.
- id: 285
  category: safe_driving_rules
  question: When approaching a steady red light where there is no marked stop line
    or crosswalk, where should you stop?
  choices:
    A: Just past the intersection.
    B: Before entering the intersection.
    C: Even with the traffic signal pole.
    D: Two car lengths before the intersection.
  answer: B
  explanation: At a steady red light, if there is not a marked stop line, stop before
    entering the crosswalk. If there is no crosswalk, stop before entering the intersection.
- id: 286
  category: signs_and_signals
  question: What does a constantly lit yellow arrow indicate?
  choices:
    A: You have the right of way to turn.
    B: The green arrow is ending or the light is about to turn red.
    C: You must yield to oncoming traffic before turning.
    D: The traffic signal is broken.
  answer: B
  explanation: The constantly lit yellow arrow means the green arrow is ending or
    the light is about to turn red.
- id: 287
  category: sharing_the_road
  question: What should a pedestrian do if they face a flashing orange upraised hand
    ('Don't Walk') signal but have already partially completed crossing?
  choices:
    A: Stop in the middle of the road and wait for the next walk signal.
    B: Turn around and return to the original sidewalk.
    C: Continue to a sidewalk or safety island.
    D: Run as fast as possible to the other side.
  answer: C
  explanation: If a pedestrian has partially completed crossing during the constantly
    lighted walk signal and the 'Don't Walk' signal begins flashing, they may continue
    to a sidewalk or safety island.
- id: 288
  category: sharing_the_road
  question: What should a pedestrian do if they are in the middle of a crosswalk and
    the pedestrian signal changes to a flashing orange upraised hand?
  choices:
    A: Stop immediately and wait in the roadway.
    B: Turn around and run back to the starting curb.
    C: Continue crossing to a sidewalk or safety island.
    D: Yield to oncoming vehicles and wait in the center lane.
  answer: C
  explanation: According to the manual, if you face a flashing 'Don't Walk' signal
    and have partially completed crossing, you may continue to a sidewalk or safety
    island.
- id: 289
  category: signs_and_signals
  question: When driving on a highway or expressway, what does a Yellow 'X' lane signal
    indicate?
  choices:
    A: The lane is open for passing only.
    B: The lane signal is going to change to red, so leave the lane safely.
    C: The lane may be used for approaching and making a left turn.
    D: You must come to a complete stop in that lane.
  answer: B
  explanation: A Yellow 'X' indicates the lane signal is going to change to red. Drivers
    should leave this lane safely before the red 'X' appears.
- id: 290
  category: signs_and_signals
  question: How are the left and right edges of divided streets or roadways marked?
  choices:
    A: Solid white lines on the left and solid yellow lines on the right.
    B: Solid yellow lines on the left and solid white lines on the right.
    C: Broken white lines on both sides.
    D: Solid yellow lines on both sides.
  answer: B
  explanation: Solid white lines are used on the right of the roadway edge, while
    solid yellow lines are used on the left edge of divided streets or roadways.
- id: 291
  category: safe_driving_rules
  question: What is the rule regarding solid double white lines separating lanes of
    traffic moving in the same direction?
  choices:
    A: Crossing is allowed only when passing.
    B: Crossing is allowed with special care.
    C: Crossing is prohibited.
    D: Crossing is allowed only to make a right turn.
  answer: C
  explanation: Solid double white lines separate lanes of traffic moving in the same
    direction, and crossing a double solid white line is prohibited.
- id: 292
  category: safe_driving_rules
  question: When are you permitted to cross solid double yellow lines in the center
    of the roadway?
  choices:
    A: To pass a slow-moving vehicle.
    B: To make a left turn to or from an alley, private road, driveway, or street.
    C: To make a U-turn at any time.
    D: You are never permitted to cross solid double yellow lines.
  answer: B
  explanation: Two solid yellow lines mark the center of the roadway and may be crossed
    to make a left turn to or from an alley, private road, driveway, or street.
- id: 293
  category: safe_driving_rules
  question: What is the only time a vehicle may be driven in a two-way left turn lane?
  choices:
    A: When passing a slower vehicle on the left.
    B: When preparing for or making a left turn or permitted U-turn.
    C: When parking temporarily to load or unload passengers.
    D: When merging into regular traffic from an intersection.
  answer: B
  explanation: A vehicle may not be driven in a two-way left turn lane except when
    preparing for or making a left turn from or into the roadway or when preparing
    for or making a U-turn when permitted by law.
- id: 294
  category: safe_driving_rules
  question: Where must a driver stop their vehicle when approaching a white stop line
    at an intersection?
  choices:
    A: Before any part of the vehicle crosses the line.
    B: With the front wheels resting on the line.
    C: Up to 4 feet past the line.
    D: Inside the crosswalk area.
  answer: A
  explanation: A white stop line shows where you must stop your vehicle for a stop
    sign or red light. You must stop your vehicle before any part of it crosses the
    line.
- id: 295
  category: signs_and_signals
  question: What does a round yellow sign with a black 'X' and the letters 'RR' indicate?
  choices:
    A: A railroad crossing is exactly 100 feet ahead.
    B: A highway-railway crossing is ahead, up to 750 feet away.
    C: You must come to a complete stop immediately.
    D: The railroad crossing ahead is currently closed.
  answer: B
  explanation: A Round Advance Warning Sign is a yellow sign with a black 'X' and
    'RR' that means a highway-railway crossing is ahead, and it may be placed up to
    750 feet before the crossing.
- id: 296
  category: signs_and_signals
  question: How should a driver treat a Railroad Crossbuck sign?
  choices:
    A: As a stop sign.
    B: As a warning sign to increase speed.
    C: As a yield sign.
    D: As a do not enter sign.
  answer: C
  explanation: A Railroad Crossbuck sign is considered a yield sign, and you must
    yield the right of way to any oncoming trains and railroad equipment.
- id: 297
  category: signs_and_signals
  question: What is the purpose of the Emergency Notification System (ENS) sign at
    a highway-rail grade crossing?
  choices:
    A: To provide the train schedule for the crossing.
    B: To give the public critical emergency contact information to reach the railroad.
    C: To indicate the speed limit for trains passing through.
    D: To warn drivers of an automated enforcement camera.
  answer: B
  explanation: The ENS sign gives the public critical emergency contact information
    at every highway-rail grade crossing to reach the railroad in the event of an
    emergency.
- id: 298
  category: defensive_driving
  question: What rule should drivers use to determine a safe following distance under
    good road and weather conditions?
  choices:
    A: The two-second rule.
    B: The three-second rule.
    C: The four-second rule.
    D: The one-car-length rule.
  answer: B
  explanation: The manual states to use the three-second rule to determine a safe
    following distance on a good road and during good weather conditions.
- id: 299
  category: defensive_driving
  question: What is the recommended action if your vehicle is being tailgated by another
    driver?
  choices:
    A: Tap your brakes quickly to warn the driver.
    B: Speed up to increase the distance between vehicles.
    C: Move to another lane or slowly pull off the road to allow the vehicle to pass.
    D: Turn on your hazard lights and maintain your current speed.
  answer: C
  explanation: If you are being tailgated, the manual advises to move to another lane
    or slowly pull off the road and allow the vehicle to pass.
- id: 300
  category: safe_driving_rules
  question: How does doubling your vehicle's speed affect its stopping distance?
  choices:
    A: It doubles the stopping distance.
    B: It triples the stopping distance.
    C: It quadruples the stopping distance.
    D: It has no effect on the stopping distance.
  answer: C
  explanation: According to the manual, doubling your speed quadruples your vehicle’s
    stopping distance.
- id: 301
  category: defensive_driving
  question: How can wind affect your vehicle's stopping distance?
  choices:
    A: A strong headwind makes it very difficult to stop.
    B: A strong tailwind can make it very difficult to stop.
    C: Crosswinds decrease stopping distance.
    D: Wind direction only affects large trucks, not passenger vehicles.
  answer: B
  explanation: When considering your speed and stopping distance, the manual notes
    that the direction of the wind and how fast it is blowing is a factor, specifically
    stating that a strong tailwind can make it very difficult to stop.
- id: 302
  category: safe_driving_rules
  question: What should you do if the fog is too dense to see safely while driving?
  choices:
    A: Drive at 5-10 mph with hazard lights on.
    B: Turn on your high beam headlights.
    C: Pull off the roadway and stop.
    D: Follow the vehicle in front of you closely.
  answer: C
  explanation: The manual states that if the fog is too dense, you should pull off
    the roadway and stop. It specifically warns drivers not to drive at 5-10 mph.
- id: 303
  category: safe_driving_rules
  question: Under Illinois law, when are you required to use your headlights?
  choices:
    A: Only when driving on expressways.
    B: When operating your windshield wipers.
    C: When driving above 50 mph.
    D: Only between sunset and sunrise.
  answer: B
  explanation: Illinois law requires you to use your headlights when operating your
    windshield wipers, such as during rain.
- id: 304
  category: defensive_driving
  question: What is the recommended action if your vehicle begins to skid while hydroplaning
    and you cannot regain control?
  choices:
    A: Pump the brakes rapidly.
    B: Accelerate to regain traction.
    C: Turn the steering wheel sharply in the opposite direction.
    D: Release the accelerator and ride out the skid.
  answer: D
  explanation: If your vehicle skids while hydroplaning and you cannot regain control,
    you should release the accelerator and ride out the skid.
- id: 305
  category: sharing_the_road
  question: What restriction applies on the Illinois Tollway System during high winds?
  choices:
    A: Motorcycles are prohibited.
    B: The hauling of house trailers is banned.
    C: Speed limits are reduced to 45 mph.
    D: Commercial trucks must use the left lane.
  answer: B
  explanation: The Illinois Tollway System bans the hauling of house trailers in high
    winds due to the difficulty of controlling them.
- id: 306
  category: safe_driving_rules
  question: How should you apply your brakes when driving on winter roads?
  choices:
    A: Hard and fast to test traction.
    B: Gently in slow, steady strokes.
    C: Only using the emergency brake.
    D: Pumping them rapidly before every stop.
  answer: B
  explanation: In winter driving conditions, you should gently apply brakes in slow,
    steady strokes. This helps you determine how much vehicle traction is available.
- id: 307
  category: defensive_driving
  question: If you become stranded in winter weather, why should you only run the
    engine for brief times and open the window?
  choices:
    A: To conserve battery power.
    B: To prevent the engine from freezing.
    C: To prevent carbon monoxide poisoning.
    D: To signal for help.
  answer: C
  explanation: If you become stranded, remain in your vehicle and run the engine only
    for brief times while opening the window to prevent carbon monoxide poisoning.
- id: 308
  category: safe_driving_rules
  question: What should you do if you miss your exit on an expressway?
  choices:
    A: Stop and back up on the shoulder.
    B: Make a U-turn at the next median crossover.
    C: Go to the next available exit.
    D: Put your vehicle in reverse and back up in the right lane.
  answer: C
  explanation: If you miss an exit, go to the next available exit. Backing up on an
    expressway is against the law.
- id: 309
  category: safe_driving_rules
  question: When driving at night, you must dim your bright lights how many feet before
    meeting an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: Bright lights must be dimmed 500 feet before meeting an oncoming vehicle
    or 300 feet before passing a vehicle.
- id: 310
  category: defensive_driving
  question: What should you do if a vehicle is approaching head-on in your lane?
  choices:
    A: Speed up and swerve to the left.
    B: Slow down, pull over to the right, and sound the horn.
    C: Stop immediately in your lane and flash your bright lights.
    D: Steer into the oncoming lane to avoid them.
  answer: B
  explanation: When a vehicle is approaching head-on in your lane, you should slow
    down, pull over to the right, and sound the horn.
- id: 311
  category: vehicle_information
  question: How should you steer if your vehicle starts to skid?
  choices:
    A: Steer in the opposite direction of the skid.
    B: Keep the steering wheel perfectly straight.
    C: Steer into the direction of the skid.
    D: Jerk the wheel sharply to the right.
  answer: C
  explanation: If your vehicle starts to skid, ease off the gas pedal or brakes, steer
    into the direction of the skid until regaining traction, and then straighten the
    vehicle.
- id: 312
  category: defensive_driving
  question: What is the correct procedure if your vehicle's wheels drift off the pavement
    onto the shoulder?
  choices:
    A: Jerk the steering wheel sharply to return to the road.
    B: Slam on the brakes and stop on the shoulder.
    C: Accelerate to get back onto the pavement quickly.
    D: Grip the wheel firmly, ease off the gas pedal, and brake gently.
  answer: D
  explanation: If your vehicle's wheels drift off the pavement, grip the wheel firmly,
    ease your foot off the gas pedal, and brake gently. You should not jerk the wheel
    to correct the steering.
- id: 313
  category: safe_driving_rules
  question: If your vehicle runs into water and sinks, where should you move to find
    an air pocket?
  choices:
    A: The front seat area.
    B: The back seat area.
    C: The trunk.
    D: Under the dashboard.
  answer: B
  explanation: If your vehicle does sink, move to the back seat area where an air
    pocket usually forms, and if possible, take a deep breath and exit from a rear
    window.
- id: 314
  category: defensive_driving
  question: If power lines fall on your vehicle during a crash and fire is an immediate
    danger, how should you exit the vehicle?
  choices:
    A: Step out slowly, keeping one foot on the vehicle and one on the ground.
    B: Jump clear, landing on both feet, and hop or shuffle away.
    C: Run away from the vehicle as fast as possible.
    D: Crawl out of the window and roll on the ground.
  answer: B
  explanation: When jumping clear of a vehicle with fallen power lines, do not allow
    any part of your body to touch the vehicle and the ground at the same time. Land
    on both feet and hop or shuffle while keeping your arms close to your body for
    50 feet.
- id: 315
  category: vehicle_information
  question: What sound may be a warning of an impending tire blowout?
  choices:
    A: A high-pitched squeal.
    B: A loud grinding noise.
    C: A thumping sound.
    D: A continuous hissing noise.
  answer: C
  explanation: According to the manual, a thumping sound may be a warning of a blowout.
- id: 316
  category: safe_driving_rules
  question: In dense, slow-moving traffic where lanes are reduced due to construction,
    how should you merge?
  choices:
    A: Merge as early as possible into the open lane.
    B: Use both lanes to advance to the lane reduction point and alternate turns merging.
    C: Drive on the shoulder to bypass the traffic.
    D: Stop in your lane until someone waves you over.
  answer: B
  explanation: In dense, slow-moving traffic, it is advised that you use both lanes
    to advance to the lane reduction point and merge at that location, alternating
    turns.
- id: 317
  category: defensive_driving
  question: What should you do if you hear a thumping sound and experience a tire
    blowout while driving?
  choices:
    A: Brake suddenly and pull over immediately.
    B: Ease your foot off the gas pedal and keep a firm grasp on the steering wheel.
    C: Turn off the ignition immediately to stop the engine.
    D: Shift into neutral and pump the brakes rapidly.
  answer: B
  explanation: If a blowout happens, ease your foot off the gas pedal and keep a firm
    grasp on the steering wheel. Pull safely off the roadway and check the tires.
    Do not brake suddenly.
- id: 318
  category: vehicle_information
  question: Why should you NOT turn off the ignition if you suddenly lose control
    of your steering wheel?
  choices:
    A: It will cause the engine to catch fire.
    B: Your vehicle will lose its power steering or its ability to steer due to a
      locking steering wheel.
    C: The emergency flashers will not work without the ignition on.
    D: The brakes will immediately lock up and cause a skid.
  answer: B
  explanation: If your vehicle has power steering or a locking steering wheel, do
    not turn off the ignition because your vehicle will lose either the power steering
    or its ability to steer.
- id: 319
  category: defensive_driving
  question: What is the first thing you should do if your brake pedal suddenly sinks
    to the floor?
  choices:
    A: Shift into a higher gear.
    B: Turn off the engine.
    C: Pump the brake pedal to build pressure.
    D: Apply the parking brake abruptly.
  answer: C
  explanation: If the brake pedal suddenly sinks to the floor, pump it to build pressure.
    If that does not work, use the emergency or parking brake.
- id: 320
  category: defensive_driving
  question: If your gas pedal becomes stuck and you cannot free it by hooking your
    toe under it, what should you do?
  choices:
    A: Shift your vehicle into neutral and brake gently to slow down.
    B: Turn off the ignition and remove the key.
    C: Shift into reverse to counter the forward momentum.
    D: Slam on the brakes as hard as possible.
  answer: A
  explanation: If your gas pedal becomes stuck and does not become free after hooking
    your toe under it, shift your vehicle into neutral and brake gently to slow down.
- id: 321
  category: safe_driving_rules
  question: Which of the following is recommended if you encounter an angry or aggressive
    motorist?
  choices:
    A: Make eye contact to show you are not intimidated.
    B: Retaliate by honking your horn.
    C: Keep your vehicle doors locked and windows up.
    D: Brake suddenly to force them to back off.
  answer: C
  explanation: If you encounter an angry or aggressive motorist, you should keep your
    vehicle doors locked and windows up, avoid eye contact, and not retaliate.
- id: 322
  category: safe_driving_rules
  question: If your vehicle breaks down on a high-capacity roadway like a highway,
    what is the safest protocol?
  choices:
    A: Exit the vehicle and stand on the shoulder.
    B: Remain in your vehicle with your seatbelt on and activate hazard lights.
    C: Walk along the highway to the nearest service station.
    D: Stand behind your vehicle to wave down traffic.
  answer: B
  explanation: For higher-capacity roads, if your vehicle breaks down, you should
    pull over, remain in your vehicle, keep your seatbelt on, activate your hazard
    lights, and call 911.
- id: 323
  category: safe_driving_rules
  question: What number should you call for assistance if your vehicle breaks down
    on the Illinois Tollway?
  choices:
    A: 311 or 411
    B: '*999 or 911'
    C: '*55 or 911'
    D: 800-TOLLWAY
  answer: B
  explanation: For the Illinois Tollway, if your vehicle breaks down or you have an
    emergency, activate your hazard lights and call *999 or 911 for assistance.
- id: 324
  category: vehicle_information
  question: According to Illinois law, the foot brake must be strong enough to stop
    a vehicle traveling at 20 mph within what distance?
  choices:
    A: 20 feet
    B: 30 feet
    C: 50 feet
    D: 55 feet
  answer: B
  explanation: The foot brake must be strong enough to stop a vehicle traveling at
    a speed of 20 mph within 30 feet.
- id: 325
  category: safe_driving_rules
  question: When must bright headlights be dimmed before meeting an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: Bright lights must be dimmed 500 feet before meeting an oncoming vehicle
    or 300 feet before passing a vehicle.
- id: 326
  category: safe_driving_rules
  question: In addition to sunset to sunrise, when else are headlights required to
    be used?
  choices:
    A: Only when driving on the highway.
    B: When rain, snow, fog, or other conditions require the use of windshield wipers.
    C: Whenever driving in a residential area.
    D: Only when objects 5,000 feet away cannot be seen.
  answer: B
  explanation: Headlights must be on from sunset to sunrise and be used when rain,
    snow, fog, or other conditions require windshield wipers.
- id: 327
  category: vehicle_information
  question: A vehicle's license plate light must make the license plate readable from
    what distance?
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 200 feet
  answer: B
  explanation: Vehicles must have a white light making the license plate readable
    from 50 feet away and must be on when headlights are on.
- id: 328
  category: vehicle_information
  question: What is the Illinois law regarding tinted windows on the front windshield?
  choices:
    A: Tinting is allowed on the entire windshield if it is light.
    B: Tinted windows are not allowed on the front windshield, except for a 6-inch
      strip at the top.
    C: Tinting is allowed up to 10 inches from the top.
    D: No tinting of any kind is allowed on the front windshield.
  answer: B
  explanation: Tinted windows are not allowed on the front windshield. A 6-inch strip
    of tinting is allowed along the entire length at the top of the front windshield.
- id: 329
  category: vehicle_information
  question: A motor vehicle's horn must be loud enough to be heard from what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Vehicles must have a horn that can be heard from 200 feet.
- id: 330
  category: defensive_driving
  question: What should a driver do if the front right wheel of their vehicle runs
    off the pavement?
  choices:
    A: Slam on the brakes and steer sharply left.
    B: Accelerate to get back on the road quickly.
    C: Ease off the accelerator, brake gently, and gently steer back onto the pavement.
    D: Shift into neutral and coast until the vehicle stops.
  answer: C
  explanation: If the front right wheel of a vehicle runs off the pavement, a driver
    should ease off the accelerator, brake gently, and gently steer back onto the
    pavement.
- id: 331
  category: vehicle_information
  question: Passenger vehicles must have two red taillights that are visible from
    how far behind?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Vehicles must have two red lights visible for 500 feet from behind.
- id: 332
  category: vehicle_information
  question: If a load extends 4 feet or more to the rear of a vehicle during the day,
    how must it be marked?
  choices:
    A: With a white light
    B: With a yellow hazard sign
    C: With a red flag
    D: With an amber reflector
  answer: C
  explanation: Loads extending 4 feet or more to the rear of a vehicle must be marked
    with a red flag during the day.
- id: 333
  category: vehicle_information
  question: It is illegal to alter the suspension system of a vehicle to lift the
    body from the chassis frame in excess of how many inches?
  choices:
    A: 2 inches
    B: 3 inches
    C: 4 inches
    D: 6 inches
  answer: B
  explanation: It is illegal to alter the suspension system of a vehicle to lift the
    body from the chassis frame in excess of 3 inches.
- id: 334
  category: safe_driving_rules
  question: What is the Illinois law regarding televisions or video recording monitors
    inside a moving vehicle?
  choices:
    A: They are allowed as long as the volume is muted.
    B: They are prohibited if they can be seen from the driver's seat.
    C: They are permitted only on interstate highways.
    D: They are allowed if the driver is using a hands-free device.
  answer: B
  explanation: Televisions or video recording monitors that can be seen from the driver’s
    seat are prohibited while the vehicle is in motion.
- id: 335
  category: vehicle_information
  question: Under what circumstances are pneumatic tires with metal studs generally
    permitted for regular passenger vehicles in Illinois?
  choices:
    A: During any winter month.
    B: They are illegal except for specific exemptions like rural mail carriers or
      certain disabled individuals between November 15 and April 1.
    C: Only when driving on interstate highways.
    D: Whenever there is visible snow on the roadway.
  answer: B
  explanation: Pneumatic tires with metal studs are illegal except for specific exemptions,
    such as vehicles used by mail carriers in rural areas or vehicles displaying Persons
    with Disabilities plates between November 15 and April 1.
- id: 336
  category: vehicle_information
  question: What is the rule regarding radar jamming devices in Illinois?
  choices:
    A: They are allowed only in commercial vehicles.
    B: They are permitted if the vehicle is traveling under the speed limit.
    C: Possession and use of radar jamming devices is prohibited in all vehicles.
    D: They are allowed only during daylight hours.
  answer: C
  explanation: Possession and use of radar jamming devices is prohibited in all vehicles.
- id: 337
  category: license_system
  question: When purchasing a vehicle from a dealer in Illinois, within how many days
    must the dealer send the required paperwork and fees to the Secretary of State's
    office?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: Within 20 days of purchase, a dealer must send the Application for
    Vehicle Transaction(s), Certificate of Title, and payments to the Secretary of
    State’s office.
- id: 338
  category: license_system
  question: What document is required to prove ownership of a vehicle or mobile home
    in Illinois?
  choices:
    A: Vehicle Registration ID Card
    B: Bill of Sale
    C: Temporary Registration Permit
    D: Certificate of Title
  answer: D
  explanation: To register a vehicle in Illinois, you must have an Illinois Certificate
    of Title. This document proves ownership.
- id: 339
  category: penalties_and_points
  question: What is the late fee assessed on vehicle registrations renewed more than
    one month past the expiration date?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: A $20 late fee is assessed on registrations renewed more than one month
    past the expiration date.
- id: 340
  category: vehicle_information
  question: How many license plates are required to be displayed on passenger vehicles,
    trucks, and vans in Illinois?
  choices:
    A: One on the rear
    B: One on the front
    C: Two plates, one on the front and one on the rear
    D: One on the rear and one inside the windshield
  answer: C
  explanation: Illinois law requires all passenger vehicles, trucks, and vans to display
    two plates, one on the front and one on the rear.
- id: 341
  category: license_system
  question: What should you do with your license plates when you sell your vehicle
    to a private owner?
  choices:
    A: Leave them on the vehicle for the new owner.
    B: Remove them and keep them, as plates remain with the owner.
    C: Return them immediately to the DMV.
    D: Destroy them.
  answer: B
  explanation: When a vehicle is sold, the license plates should be removed and kept
    by the seller. In Illinois, license plates remain with the owner, not the vehicle.
- id: 342
  category: license_system
  question: How long is a Temporary Registration Permit (TRP) valid from the date
    of issuance?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: D
  explanation: The TRP is valid for 90 days from the issuance date, although it may
    be reissued if the license plates do not arrive within 90 days.
- id: 343
  category: license_system
  question: Where should the registration renewal sticker be placed on the license
    plate?
  choices:
    A: Upper left side of the front plate
    B: Upper right side of the rear license plate
    C: Lower left side of the rear license plate
    D: Center of the rear license plate
  answer: B
  explanation: You are encouraged to immediately affix the renewal sticker to the
    upper right side of the rear license plate.
- id: 344
  category: license_system
  question: If you purchase a vehicle renewal sticker online before expiration but
    have not yet received it, how long is your printed receipt valid as proof of registration?
  choices:
    A: 15 days from the date of purchase
    B: 30 days from the expiration of the current sticker
    C: 60 days from the expiration of the current sticker
    D: 90 days from the date of purchase
  answer: B
  explanation: The printed receipt is only valid as proof of registration for 30 days
    from the expiration of the registration sticker currently displayed on the license
    plate.
- id: 345
  category: vehicle_information
  question: Which vehicles are permitted to have red lights visible from the front?
  choices:
    A: Any commercial vehicle
    B: Vehicles with projecting loads
    C: Police or designated emergency vehicles
    D: Antique vehicles over 25 years old
  answer: C
  explanation: Red lights visible from the front are prohibited, except for police
    or designated emergency vehicles.
- id: 346
  category: vehicle_information
  question: How long do military members serving in a non-combat capacity outside
    the United States have to renew their vehicle registration upon returning?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Vehicle owners who are members of the U.S. Armed Forces serving in
    a non-combat capacity outside the U.S. have 45 days from their date of return
    to obtain or renew their vehicle registration.
- id: 347
  category: vehicle_information
  question: Which veterans are eligible to have their standard vehicle registration
    fee waived for the renewal period immediately following their return to the United
    States?
  choices:
    A: All veterans who served overseas
    B: Veterans who served in a non-combat capacity
    C: Active duty or reservists who can show proof of service in a combat mission
    D: Civilian employees of the Armed Forces
  answer: C
  explanation: Members of the U.S. Armed Forces serving in active duty or as a reservist
    who can show proof of service in a combat mission can have their standard vehicle
    registration fee waived for the renewal period immediately following their return.
- id: 348
  category: vehicle_information
  question: How long should you allow to receive personalized or vanity license plates
    after placing an order?
  choices:
    A: At least 15 days
    B: At least 30 days
    C: At least 45 days
    D: At least 60 days
  answer: C
  explanation: The manual states to allow at least 45 days from the time the order
    is placed to receive personalized and vanity license plates.
- id: 349
  category: vehicle_information
  question: How many reduced-fee license plate discounts per year are allowed for
    qualifying senior citizens and persons with disabilities?
  choices:
    A: One
    B: Two
    C: Three
    D: Unlimited
  answer: A
  explanation: Senior citizens and persons with disabilities who qualify for the Benefit
    Access Program are eligible for reduced license plate fees, but only one discount
    per year is allowed.
- id: 350
  category: driver_responsibility
  question: What is the minimum liability insurance requirement for the injury or
    death of one person in a crash in Illinois?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum liability insurance limit in Illinois is $25,000 for the
    injury or death of one person in a crash.
- id: 351
  category: driver_responsibility
  question: Which of the following is an acceptable way to show evidence of liability
    insurance to a law enforcement officer?
  choices:
    A: Only a physical paper insurance card
    B: Only a certificate of insurance mailed directly by the state
    C: An insurance card displayed on a cellphone or other electronic device
    D: A verbal confirmation of your policy number
  answer: C
  explanation: Insurance companies must provide an insurance card that can be displayed
    on the driver's cellphone or other electronic device, which can be shown to law
    enforcement officers upon request.
- id: 352
  category: penalties_and_points
  question: What is a potential consequence of failing to carry the required vehicle
    insurance in Illinois?
  choices:
    A: A warning ticket for the first three offenses
    B: Suspension of driving privileges and vehicle registration
    C: Mandatory community service
    D: Immediate confiscation of the vehicle
  answer: B
  explanation: Failure to carry the required insurance will result in fines, the inability
    to renew the vehicle registration, suspension of driving privileges, and suspension
    of the vehicle registration.
- id: 353
  category: penalties_and_points
  question: What may happen if a vehicle owner provides false insurance information
    to the Secretary of State's office to renew their registration?
  choices:
    A: They will be required to take a defensive driving course
    B: They will receive a warning letter
    C: They may face criminal charges and a fine
    D: Their insurance premiums will be legally capped
  answer: C
  explanation: Providing false information to the Secretary of State's office or a
    remitter to renew the vehicle registration may result in criminal charges and
    a fine.
- id: 354
  category: vehicle_information
  question: If you move from an area in Illinois where vehicle emissions testing is
    required, what must you do?
  choices:
    A: Notify the Illinois Environmental Protection Agency immediately
    B: Notify the Secretary of State
    C: Continue getting emissions tests regardless of where you move
    D: Remove your license plates and return them
  answer: B
  explanation: If you move from the area in which emissions testing is required, you
    must notify the Secretary of State.
- id: 355
  category: vehicle_information
  question: Do Persons with Disabilities License Plates exempt the authorized holder
    from parking meter fees?
  choices:
    A: Yes, in all municipalities
    B: Yes, but only for the first 30 minutes
    C: No, they do not exempt the holder from parking meter fees
    D: Yes, if the disabled person is driving
  answer: C
  explanation: Persons with Disabilities License Plates DO NOT exempt the authorized
    holder from parking meter fees and time limitations at parking meters.
- id: 356
  category: vehicle_information
  question: Under what condition may a disability parking placard be used in a vehicle?
  choices:
    A: Only if the disabled person is the driver of the vehicle
    B: Any time the vehicle is running errands for the disabled person
    C: Only if the disabled person is present and entering or exiting the vehicle
    D: Whenever the vehicle is parked in a retail store parking lot
  answer: C
  explanation: Disability parking placards may only be used in a vehicle if the disabled
    person is present and entering or exiting the vehicle while parked at a designated
    accessible parking space.
- id: 357
  category: vehicle_information
  question: Which type of disability parking placard exempts the authorized holder
    from parking meter fees and time limitations exceeding 30 minutes?
  choices:
    A: Permanent Placard
    B: Meter-Exempt Permanent Placard
    C: Temporary Placard
    D: Organization Placard
  answer: B
  explanation: The Meter-Exempt Permanent placard exempts the holder from parking
    meter fees and time limitations at meters exceeding a 30-minute time limit.
- id: 358
  category: vehicle_information
  question: What is the maximum length of time a Temporary disability parking placard
    can be valid if issued by a local municipality?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: A Temporary placard is valid for the length of time indicated by the
    certifying physician, not to exceed six months if issued by the Secretary of State
    and 90 days if issued by a local municipality.
- id: 359
  category: license_system
  question: What rating is used to classify driver's licenses in Illinois?
  choices:
    A: Top speed rating
    B: Gross vehicle weight rating (GVWR)
    C: Engine displacement rating
    D: Passenger capacity rating
  answer: B
  explanation: According to the manual, driver's licenses are classified by the gross
    vehicle weight rating (GVWR) of the operator's vehicle.
- id: 360
  category: license_system
  question: 'A Class A driver''s license applies to any combination of motor vehicles
    with a gross combined weight rating (GCWR) of at least 26,001 pounds, provided
    the towed vehicle is in excess of:'
  choices:
    A: 5,000 pounds
    B: 10,000 pounds
    C: 15,000 pounds
    D: 20,000 pounds
  answer: B
  explanation: A Class A license is for any combination of motor vehicles with a GCWR
    of 26,001 pounds or more, providing that the vehicle being towed is in excess
    of 10,000 pounds.
- id: 361
  category: license_system
  question: Which license classification is required for a single motor vehicle with
    a GVWR of 26,001 pounds or more that is towing another vehicle not in excess of
    10,000 pounds?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: B
  explanation: A Class B license is for any single motor vehicle with a GVWR of 26,001
    pounds or more or any such vehicle towing another not in excess of 10,000 pounds.
- id: 362
  category: license_system
  question: A Class C driver's license is required for any vehicle designed to carry
    how many passengers, including the driver?
  choices:
    A: 8 or more
    B: 10 or more
    C: 12 or more
    D: 16 or more
  answer: D
  explanation: A Class C license is required for any vehicle designed to carry 16
    or more passengers, including the driver.
- id: 363
  category: license_system
  question: 'In addition to certain weight and passenger limits, a Class C license
    is required to operate a vehicle that:'
  choices:
    A: Is used for farming operations
    B: Carries hazardous materials that require placarding
    C: Tows a vehicle in excess of 10,000 pounds
    D: Has a motor-driven cycle attached
  answer: B
  explanation: A Class C license applies to vehicles carrying hazardous materials
    that require placarding.
- id: 364
  category: license_system
  question: 'A Class D driver''s license allows you to operate any motor vehicle with
    a GVWR of:'
  choices:
    A: 10,000 pounds or less
    B: 16,000 pounds or less
    C: 26,000 pounds or less
    D: 32,000 pounds or less
  answer: B
  explanation: A Class D license is for any motor vehicle with a GVWR of 16,000 pounds
    or less, except those requiring a Class A, B, C, L, or M license.
- id: 365
  category: license_system
  question: What is the maximum engine displacement for a motor-driven cycle operated
    under a Class L license?
  choices:
    A: Less than 50cc
    B: Less than 100cc
    C: Less than 150cc
    D: Less than 250cc
  answer: C
  explanation: A Class L license is for any motor-driven cycle with less than 150cc
    displacement.
- id: 366
  category: license_system
  question: Which driver's license classification is required to operate any motorcycle
    or motor-driven cycle regardless of engine displacement?
  choices:
    A: Class C
    B: Class D
    C: Class L
    D: Class M
  answer: D
  explanation: A Class M license is required for any motorcycle or motor-driven cycle.
- id: 367
  category: license_system
  question: To be eligible for a Probationary License during a period of suspension,
    a driver must be at least what age?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '65'
  answer: B
  explanation: A Probationary License grants full-driving privileges during a period
    of suspension for a driver age 21 and over.
- id: 368
  category: penalties_and_points
  question: A Probationary License may only be issued to a person who has been suspended
    for how many moving violations in a 12-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: The Probationary License may only be issued to a person suspended for
    three moving violations in a 12-month period.
- id: 369
  category: license_system
  question: What is the maximum duration for which a Probationary License can be issued?
  choices:
    A: One month
    B: Three months
    C: Six months
    D: Twelve months
  answer: B
  explanation: A Probationary License cannot be issued for more than three months.
- id: 370
  category: license_system
  question: 'A Restricted Local Driver''s License may be issued to a driver who lives
    in a community with a population of less than:'
  choices:
    A: 1,000 residents
    B: 3,500 residents
    C: 5,000 residents
    D: 10,000 residents
  answer: B
  explanation: A Restricted Local Driver's License is issued to a driver who lives
    in a community with less than 3,500 residents and drives only within certain areas
    of the community.
- id: 371
  category: license_system
  question: Which type of special license grants full-driving privileges in conjunction
    with a driver improvement activity during a period of suspension?
  choices:
    A: Restricted Local Driver's License
    B: Probationary License
    C: Class D License
    D: Temporary Visitor Driver's License
  answer: B
  explanation: A Probationary License is issued in conjunction with a driver improvement
    activity that grants full-driving privileges during a period of suspension.
- id: 372
  category: license_system
  question: According to the Illinois driver's manual, which two license classifications
    generally require a Commercial Driver's License (CDL)?
  choices:
    A: Class A and Class B
    B: Class B and Class C
    C: Class C and Class D
    D: Class L and Class M
  answer: A
  explanation: The manual notes that a CDL is generally required for both Class A
    and Class B licenses.
- id: 373
  category: license_system
  question: What is the maximum amount of time a Probationary License can be issued
    for?
  choices:
    A: One month
    B: Three months
    C: Six months
    D: One year
  answer: B
  explanation: The manual states that a Probationary License cannot be issued for
    more than three months.
- id: 374
  category: license_system
  question: Which of the following is a general rule regarding acceptable identification
    documents presented for verification?
  choices:
    A: Photocopies are accepted if notarized
    B: Photocopies are not accepted
    C: Expired documents are always accepted
    D: Digital copies on a smartphone are preferred
  answer: B
  explanation: According to the acceptable identification documents guidelines, photocopies
    are not accepted and all acceptable documents presented for verification or proof
    must be valid (current and unexpired).
- id: 375
  category: license_system
  question: Which of the following major brand credit cards is NOT explicitly listed
    as acceptable for signature verification (Group A)?
  choices:
    A: Visa
    B: Mastercard
    C: Discover
    D: Capital One
  answer: D
  explanation: Acceptable major brand credit cards (for signature verification only)
    include American Express, Diners Club, Discover, Mastercard and Visa.
- id: 376
  category: license_system
  question: What is required for a birth certificate to be accepted as a Group B (Date
    of Birth) document?
  choices:
    A: It must be a photocopy signed by a parent
    B: It must be original or certified by a Board of Health or Bureau of Vital Statistics
    C: It must be issued by a hospital
    D: It must be notarized by a local bank
  answer: B
  explanation: Birth Certificates must be original or certified by a Board of Health
    or Bureau of Vital Statistics within the U.S. or by the U.S. State Department,
    U.S. territories or Canada.
- id: 377
  category: license_system
  question: Under what condition is a foreign passport accepted as proof of Date of
    Birth (Group B)?
  choices:
    A: If it is translated into English by a certified translator
    B: If it is accompanied by any other item in Group B
    C: If it was issued within the last 5 years
    D: Foreign passports are never accepted for Group B
  answer: B
  explanation: Foreign passports and birth certificates are accepted as proof if accompanied
    by any other item in Group B.
- id: 378
  category: license_system
  question: If an applicant is applying for a Temporary Visitor Driver’s License (TVDL),
    what must they do regarding Group C (Social Security Number) documents?
  choices:
    A: Provide a W-2 form instead
    B: Sign a declaration that they are ineligible to obtain a Social Security number
    C: Provide a letter from their employer
    D: Submit a foreign tax return
  answer: B
  explanation: An applicant applying for a TVDL is not required to present documents
    from Group C. Instead, the applicant must sign a declaration on the TVDL application
    that they are ineligible to obtain a Social Security number.
- id: 379
  category: license_system
  question: How many Group D (Residency) documents are required to apply for a REAL
    ID?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: According to the Group D guidelines, two residency documents are required
    for REAL ID.
- id: 380
  category: license_system
  question: Consular Cards are only accepted for residency (Group D) if they are from
    which of the following groups of countries?
  choices:
    A: Canada, Mexico, and the UK
    B: Brazil, Columbia, Ecuador, Guatemala, and Mexico
    C: Any country in the European Union
    D: Any country that issues a Consular Card
  answer: B
  explanation: Only Consular Cards from Brazil, Columbia, Ecuador, Guatemala and Mexico
    are accepted as those countries issue cards in compliance with the Consular Identification
    Document Act.
- id: 381
  category: license_system
  question: Which of the following documents is considered UNACCEPTABLE for identification
    purposes?
  choices:
    A: Canceled Check within 90 days
    B: Medicare Card
    C: Illinois FOID Card
    D: W-2 Form
  answer: C
  explanation: The Illinois FOID Card is explicitly listed under the "Unacceptable
    Documents" section.
- id: 382
  category: license_system
  question: Which of the following cards will NOT be accepted as proof of identification
    by the Secretary of State?
  choices:
    A: College or University ID Card
    B: U.S. Military Driver’s License
    C: Social Security Card
    D: Cooperative Driver Testing Program Certificate
  answer: A
  explanation: A College or University ID Card is listed under the "Unacceptable Documents"
    list.
- id: 383
  category: license_system
  question: What information MUST be contained on a Group D (Residency) document?
  choices:
    A: The applicant's full name and date of birth
    B: The applicant's full name and residence address
    C: The applicant's signature and Social Security number
    D: A photograph of the applicant and their address
  answer: B
  explanation: Group D documents must contain the applicant’s full name and residence
    address.
- id: 384
  category: license_system
  question: After reviewing all identification presented, who has the right to accept
    or refuse any document?
  choices:
    A: The local police department
    B: The applicant's attorney
    C: Secretary of State management
    D: The federal government
  answer: C
  explanation: After review of all identification presented, Secretary of State management
    has the right to accept or refuse any document.
- id: 385
  category: license_system
  question: If using an Illinois driver’s license or ID record for Group C (Social
    Security Number), what condition must be met?
  choices:
    A: The record must be printed on official letterhead
    B: The Social Security number must have been previously verified with the SSA
    C: The applicant must also present a birth certificate
    D: The ID must have been issued within the last 30 days
  answer: B
  explanation: If using an Illinois driver’s license or ID record, the Social Security
    number must have been previously verified with the SSA.
- id: 386
  category: license_system
  question: What information must be contained in Group B identification documents?
  choices:
    A: The applicant's name and full Social Security number
    B: The applicant's full name and complete date of birth
    C: The applicant's full name and residence address
    D: The applicant's signature and photograph
  answer: B
  explanation: According to the manual, Group B documents must contain the applicant's
    full name and complete date of birth and must be verifiable.
- id: 387
  category: license_system
  question: Are photocopies of identification documents accepted when applying for
    a driver's license or ID?
  choices:
    A: Yes, if they are notarized
    B: Yes, but only for Group D residency documents
    C: No, photocopies are not accepted
    D: Yes, if they are clear and legible
  answer: C
  explanation: 'The manual explicitly states in bold capital letters: ''PHOTOCOPIES
    ARE NOT ACCEPTED''.'
- id: 388
  category: license_system
  question: What information is required to be on Group C identification documents?
  choices:
    A: The applicant's name and full Social Security number
    B: The applicant's full name and date of birth
    C: The applicant's name and current address
    D: The applicant's full name and signature
  answer: A
  explanation: The manual states that Group C documents must contain the applicant's
    name and full Social Security number.
- id: 389
  category: license_system
  question: How does an applicant for a Temporary Visitor Driver's License (TVDL)
    fulfill the Group C document requirement?
  choices:
    A: They must provide a valid Social Security Card.
    B: They must provide a W-2 form from their employer.
    C: They are exempt from all identification requirements.
    D: They must sign a declaration stating they are ineligible to obtain a Social
      Security number.
  answer: D
  explanation: An applicant applying for a TVDL is not required to present documents
    from Group C. Instead, they must sign a declaration on the application that they
    are ineligible to obtain a Social Security number.
- id: 390
  category: license_system
  question: Under what condition are foreign passports and birth certificates accepted
    as proof of identification?
  choices:
    A: Only if they are translated by a certified translator
    B: If they are accompanied by any other item in Group B
    C: Only if they were issued within the last 5 years
    D: They are never accepted under any circumstances
  answer: B
  explanation: Foreign passports and birth certificates are accepted as proof if accompanied
    by any other item in Group B.
- id: 391
  category: license_system
  question: What is a general requirement for all acceptable documents presented for
    verification or proof?
  choices:
    A: They must have been issued within the last 30 days
    B: They must be valid (current and unexpired)
    C: They must be notarized by an Illinois notary
    D: They must be laminated for protection
  answer: B
  explanation: 'The manual states: ''All acceptable documents presented for verification
    or proof must be valid (current and unexpired).'''
- id: 392
  category: license_system
  question: Which of the following is listed as an online Driver Service?
  choices:
    A: License Plate Renewal
    B: Title and Registration Status
    C: Safe Driver Renewal
    D: Refund Request
  answer: C
  explanation: Safe Driver Renewal is listed under the 'Driver Services' section of
    the online services list, whereas the others are Vehicle Services.
- id: 393
  category: license_system
  question: How recent must a bank statement be to be accepted as a Group D document?
  choices:
    A: Dated within 30 days prior to application
    B: Dated within 60 days prior to application
    C: Dated within 90 days prior to application
    D: Dated within 12 months prior to application
  answer: C
  explanation: The manual specifies that a Bank Statement must be dated within 90
    days prior to application.
- id: 394
  category: license_system
  question: Consular Cards from which of the following groups of countries are accepted
    as identification?
  choices:
    A: Canada, United Kingdom, France, Germany, and Spain
    B: Brazil, Colombia, Ecuador, Guatemala, and Mexico
    C: Any country that has a U.S. embassy
    D: Only Mexico and Canada
  answer: B
  explanation: Only Consular Cards from Brazil, Colombia, Ecuador, Guatemala and Mexico
    are accepted, as those countries issue cards in compliance with the Consular Identification
    Document Act.
- id: 395
  category: license_system
  question: Can a single identification document satisfy the requirements for more
    than one Group?
  choices:
    A: Yes, one document may satisfy more than one Group.
    B: No, each Group requires a completely separate document.
    C: Yes, but only for Groups A and B.
    D: No, unless specifically approved by a facility manager.
  answer: A
  explanation: 'The manual explicitly states: ''One document may satisfy more than
    one Group.'''
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 396
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 397
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 398
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 399
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 400
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 401
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 402
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 403
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 404
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 405
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 406
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 407
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 408
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 409
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 410
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 411
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 412
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 413
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 414
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 415
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 416
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 417
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 418
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 419
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 420
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 421
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 422
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 423
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 424
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 425
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 426
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 427
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 428
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 429
