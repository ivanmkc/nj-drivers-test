    C: Un permiso para que los conductores estudiantes practiquen por la noche
    D: Un permiso para que los conductores comerciales realicen un seguimiento de
      sus horas
  answer: B
  explanation: Un infractor de DUI por primera vez al que se le emite una Suspensión
    Sumaria Reglamentaria puede solicitar un MDDP, el cual le permite conducir siempre
