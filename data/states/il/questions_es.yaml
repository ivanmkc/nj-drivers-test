  choices:
    A: Narcóticos ilegales
    B: Medicamentos recetados que afecten la conducción
    C: Medicamentos de venta libre que causen somnolencia
    D: Todas las anteriores
  answer: D
  explanation: Las leyes de DUI de Illinois se aplican a cualquier sustancia que incapacite
    a una persona para conducir de manera segura, incluyendo drogas ilegales, medicamentos
    recetados y medicamentos de venta libre.
- id: 136
  category: alcohol_drugs_health
  question: 'Con respecto al transporte de cannabis medicinal en Illinois, el cannabis
    debe guardarse en un contenedor que esté:'
  choices:
    A: Guardado en la guantera
    B: Sellado, a prueba de olores y resistente a los niños
    C: Colocado en el asiento del pasajero delantero para mayor visibilidad
    D: Guardado únicamente en el maletero
  answer: B
  explanation: La ley de Illinois exige que el cannabis medicinal se transporte en
    un contenedor sellado, a prueba de olores y resistente a los niños. Es ilegal
    consumir cannabis en un vehículo motorizado.
- id: 137
  category: alcohol_drugs_health
  question: 'Si usted está involucrado en un accidente con lesiones personales o fatal
    en Illinois y un oficial de policía tiene causa probable para creer que usted
    estaba bajo los efectos de sustancias, usted debe:'
  choices:
    A: Someterse a pruebas químicas o enfrentar la suspensión de la licencia
    B: Solo someterse a las pruebas si es arrestado formalmente
    C: Solo someterse a las pruebas si el otro conductor lo solicita
    D: Esperar 24 horas antes de realizar las pruebas
  answer: A
  explanation: La ley de Illinois exige que los conductores involucrados en accidentes
    con lesiones personales o fatales se sometan a pruebas químicas si existe una
    causa probable de deterioro. La negativa resulta en una suspensión mínima de 1
    año.
- id: 138
  category: alcohol_drugs_health
  question: Bajo la ley de "Consentimiento Implícito" de Illinois, al conducir por
    las carreteras de Illinois, ¿usted acepta automáticamente cuál de los siguientes?
  choices:
    A: Un registro de su vehículo en busca de alcohol en cualquier momento
    B: Pruebas químicas (aliento, sangre u orina) para determinar el contenido de
      alcohol o drogas
    C: Una estancia obligatoria de 24 horas en la cárcel si lo detienen por exceso
      de velocidad
    D: La instalación de un dispositivo de interbloqueo de encendido en su vehículo
  answer: B
  explanation: La ley de Consentimiento Implícito de Illinois significa que, al conducir
    por las carreteras de Illinois, usted acepta automáticamente someterse a ciertas
    pruebas (aliento, sangre u orina) tras un arresto por DUI.
- id: 139
  category: alcohol_drugs_health
  question: Si un conductor de Illinois es condenado por una primera ofensa de DUI,
    sus privilegios de conducir serán revocados por un mínimo de ¿cuánto tiempo?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Una primera condena por DUI en Illinois resulta en una revocación mínima
    de 1 año de los privilegios de conducir (2 años si el conductor es menor de 21
    años).
- id: 140
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por una primera infracción de negarse a someterse
    a pruebas químicas (aliento, sangre u orina) en Illinois?
  choices:
    A: Suspensión de 6 meses de los privilegios de conducir
    B: Suspensión de 12 meses de los privilegios de conducir
    C: Automáticamente 48 horas en la cárcel
    D: Pérdida permanente de la licencia de conducir
  answer: B
  explanation: Bajo la ley de Suspensión Sumaria Reglamentaria, una primera infracción
    por negarse a someterse a pruebas químicas resulta en una suspensión de 12 meses.
- id: 141
  category: alcohol_drugs_health
  question: En Illinois, si la prueba química de un conductor indica un BAC de 0.08%
