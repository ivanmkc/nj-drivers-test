  choices:
    A: Un DUI que resulte en lesiones personales o muerte
    B: Un DUI mientras conduce un autobús escolar con niños a bordo
    C: Una tercera o subsiguiente condena por DUI
    D: Todas las anteriores
  answer: D
  explanation: El DUI agravado es un cargo más grave (delito grave) en Illinois que
