    de un BAIID. ¿Qué significan las siglas BAIID?
  choices:
    A: Breath Alcohol Internal Ignition Device
    B: Breath Alcohol Ignition Interlock Device
    C: Biological Alcohol Interlock Indicator Device
    D: Breathalyzer Automated Ignition Interlock Device
  answer: B
  explanation: BAIID significa Dispositivo de Interbloqueo de Encendido por Alcohol
    en el Aliento (Breath Alcohol Ignition Interlock Device). Es obligatorio para
    los infractores de DUI por primera vez que deseen conducir durante su Suspensión
    Sumaria Estatutaria.
- id: 169
  category: penalties_and_points
  question: En Illinois, abandonar la escena de un accidente que involucre lesiones
    personales o la muerte resulta en la ________ obligatoria de su licencia de conducir.
  choices:
    A: Suspensión
    B: Revocación
    C: Cancelación
    D: Restricción
  answer: B
  explanation: Abandonar la escena de un accidente que involucre lesiones personales
    o la muerte es una infracción grave en Illinois que resulta en la revocación permanente
    de los privilegios de conducir.
- id: 170
  category: penalties_and_points
  question: 'Si un conductor de Illinois es condenado por proporcionar información
    falsa a la Secretaría de Estado en una solicitud de licencia, sus privilegios
    de conducir serán suspendidos por al menos:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Proporcionar información falsa o usar una identificación fraudulenta
    para obtener una licencia en Illinois resulta en una suspensión obligatoria de
    12 meses.
- id: 171
  category: penalties_and_points
  question: Según la Ley de Scott (Scott's Law) en Illinois, si el hecho de que un
    conductor no ceda el paso a un vehículo de emergencia resulta en lesiones a otra
    persona, ¿por cuánto tiempo se puede suspender su licencia?
  choices:
    A: 90 días a 1 año
    B: 6 meses a 2 años
    C: 1 año a 3 años
    D: 2 años a 5 años
  answer: B
  explanation: Si una violación de la Ley de Scott resulta en lesiones a otra persona,
    el conductor se enfrenta a una suspensión obligatoria de la licencia de 6 meses
    a 2 años.
- id: 172
  category: penalties_and_points
  question: Para los conductores de 21 años o más en Illinois, los privilegios de
    conducir serán suspendidos si son condenados por ¿cuántas infracciones de tránsito
    (moving violations) en un período de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: A los conductores de 21 años o más se les suspenderá la licencia si
    reciben tres condenas por infracciones de tránsito dentro de cualquier período
    de 12 meses.
- id: 173
  category: sharing_the_road
  question: La Ley de Scott (Ley de "Hacerse a un lado" de Illinois) requiere que
    los conductores cambien de carril o reduzcan la velocidad al acercarse a ¿qué
    vehículos estacionarios?
  choices:
    A: Solo vehículos de la policía y del departamento de bomberos
    B: Solo ambulancias y grúas
    C: Cualquier vehículo con luces de emergencia intermitentes o luces de emergencia
      autorizadas
    D: Solo vehículos de mantenimiento de carreteras
  answer: C
  explanation: La Ley de Scott se aplica a cualquier vehículo estacionario con luces
    de advertencia intermitentes o luces de emergencia autorizadas, incluyendo camiones
    comerciales, automóviles de pasajeros y personal de respuesta a emergencias.
- id: 174
  category: sharing_the_road
  question: ¿Cuál es el límite de velocidad máximo en una zona escolar de Illinois
    los días de clase cuando hay niños presentes y hay señales publicadas?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: En Illinois, el límite de velocidad en una zona escolar es de 20 mph
    los días de clase entre las 7 a.m. y las 4 p.m. cuando hay niños presentes.
- id: 175
  category: sharing_the_road
  question: Si un conductor es condenado por violar la Ley de Scott (Ley de "Hacerse
    a un lado") por primera vez, ¿cuál es la multa mínima obligatoria?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Una primera violación de la Ley de Scott en Illinois conlleva una multa
    mínima obligatoria de $250. Si ocurren daños a la propiedad o lesiones, las sanciones
    aumentan significativamente.
- id: 176
  category: sharing_the_road
  question: En Illinois, cuando un cortejo fúnebre utiliza luces de emergencia y sigue
    a un vehículo de escolta con luces intermitentes, ¿quién tiene el derecho de paso
    en las intersecciones?
  choices:
    A: Solo el primer vehículo del cortejo
    B: Todo el cortejo tiene el derecho de paso independientemente de las señales
      de tráfico
    C: Otros automovilistas tienen el derecho de paso
    D: Solo el vehículo de escolta policial
  answer: B
  explanation: En Illinois, los cortejos fúnebres tienen el derecho de paso en las
    intersecciones. Los automovilistas deben ceder el paso a todo el cortejo y no
    conducir entre los vehículos del mismo.
- id: 177
  category: sharing_the_road
  question: Al seguir a una motocicleta, ¿cuál es la distancia de seguimiento recomendada
    para permitir que el motociclista tenga suficiente tiempo para maniobrar en una
    emergencia?
  choices:
    A: 1-2 segundos
    B: 3-4 segundos
    C: 5-6 segundos
    D: 10 segundos
  answer: B
  explanation: Las Reglas del Camino de Illinois recomiendan una distancia de seguimiento
    de 3 a 4 segundos cuando se circula detrás de una motocicleta para proporcionar
    más tiempo para reaccionar ante peligros que podrían afectar al ciclista.
- id: 178
  category: sharing_the_road
  question: Según la ley de Illinois, un conductor debe detenerse por completo ante
    un peatón en ¿cuál de los siguientes escenarios?
  choices:
    A: Solo si se encuentran en un cruce peatonal marcado
    B: Solo si se encuentran en un cruce peatonal no marcado en una intersección
    C: En cualquier cruce peatonal (marcado o no marcado) cuando el peatón se encuentra
      en el lado de la carretera por el que circula el conductor
    D: Solo si el peatón utiliza un bastón blanco
  answer: C
  explanation: La ley de Illinois exige que los conductores se detengan y cedan el
    derecho de paso a un peatón en un cruce peatonal, ya sea marcado o no, cuando
    el peatón se encuentre en la mitad de la calzada por la que circula el vehículo.
- id: 179
  category: sharing_the_road
  question: 'Si se le condena por rebasar un autobús escolar detenido en Illinois,
    su licencia de conducir será suspendida por un mínimo de:'
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Una primera condena por rebasar un autobús escolar detenido en Illinois
    resulta en una suspensión obligatoria de la licencia de conducir de 3 meses.
- id: 180
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión puede:'
  choices:
    A: Permanecer completamente en el carril derecho durante todo el giro
    B: Necesitar abrirse hacia el carril izquierdo para completar el giro
    C: Detenerse y esperar a que pase todo el tráfico que viene detrás
    D: Girar solo desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha. Los automovilistas deben evitar "apretarse"
    entre el camión y la acera.
- id: 181
  category: sharing_the_road
  question: En Illinois, es ilegal la "división de carril" (lane split). ¿A cuál de
    las siguientes acciones se refiere esto?
  choices:
    A: Conducir en dos carriles a la vez
    B: Una motocicleta que conduce entre dos filas de vehículos lentos o detenidos
      en el mismo carril
    C: Rebasar a un automóvil por la derecha en una carretera de dos carriles
    D: Cambiar de carril sin usar la señal de giro
  answer: B
  explanation: La división de carril (lane splitting), donde una motocicleta conduce
    entre los carriles de tráfico, es ilegal en Illinois. Las motocicletas tienen
    derecho al ancho total de un carril.
- id: 182
  category: sharing_the_road
  question: 'Al acercarse a un vehículo de emergencia estacionado con sus luces intermitentes
    encendidas, si no puede cambiar de carril de manera segura, usted debe:'
  choices:
    A: Mantener su velocidad y permanecer en su carril
    B: Detenerse inmediatamente en la calzada
    C: Reducir la velocidad y proceder con precaución
    D: Tocar la bocina para advertir a los socorristas de emergencia
  answer: C
  explanation: Según la Ley de Scott (Scott's Law), si no es posible o seguro cambiar
    de carril, el conductor debe reducir la velocidad y proceder con la debida precaución
    al pasar al vehículo de emergencia estacionado.
- id: 183
  category: sharing_the_road
  question: 'Un conductor que se aproxima a un peatón ciego que lleva un bastón blanco
    o que va acompañado de un perro guía debe:'
  choices:
    A: Tocar la bocina para hacerle saber que usted está allí
    B: Ceder el derecho de paso y detenerse si es necesario para permitirle cruzar
    C: Conducir alrededor de ellos rápidamente para despejar la intersección
    D: Solo detenerse si hay una señal de "Cruce de Peatones"
  answer: B
  explanation: La ley de Illinois establece que el conductor de un vehículo debe ceder
    el derecho de paso a cualquier peatón ciego o con discapacidad visual que lleve
    un bastón blanco o que vaya acompañado de un perro guía.
- id: 184
  category: sharing_the_road
  question: 'Cuando un automovilista va a girar a la derecha y un ciclista se aproxima
    por la parte trasera derecha, el automovilista debe:'
  choices:
    A: Acelerar para girar antes de que llegue el ciclista
    B: Tocar la bocina para advertir al ciclista que se detenga
    C: Esperar a que el ciclista pase antes de realizar el giro
    D: Girar de todos modos, ya que el ciclista debe ceder el paso a los automóviles
  answer: C
  explanation: Los automovilistas deben ceder el paso a los ciclistas al igual que
    lo harían con otros vehículos. Al girar a la derecha, verifique si hay ciclistas
    y espere a que pasen para evitar una colisión de "gancho a la derecha" (right
    hook).
- id: 185
  category: sharing_the_road
  question: En Illinois, ¿cuál es la multa mínima obligatoria por una primera condena
    por no detenerse ante un autobús escolar que tiene su brazo de parada extendido
    y las luces rojas intermitentes?
  choices:
    A: $100
    B: $150
    C: $250
    D: $500
  answer: B
  explanation: De acuerdo con las Reglas de la Carretera de Illinois, una primera
    condena por rebasar a un autobús escolar detenido con sus luces rojas intermitentes
    y el brazo de parada extendido resulta en una multa mínima de $150 y una suspensión
    de la licencia de conducir por tres meses.
- id: 186
  category: sharing_the_road
  question: Según la ley de Illinois (Ley de Scott), ¿qué debe hacer un conductor
    al acercarse a cualquier vehículo con luces de emergencia o de peligro intermitentes
    detenido a un lado de la carretera?
  choices:
    A: Mantener la velocidad pero tocar la bocina para alertar al vehículo
    B: Detenerse por completo hasta que el vehículo de emergencia se mueva
    C: Cambiar de carril si es seguro hacerlo o reducir la velocidad y proceder con
      precaución
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: La Ley de Scott (Scott's Law o Ley de Moverse a un Lado) requiere que
    los conductores de Illinois cambien de carril si es seguro hacerlo, o si no es
    posible cambiar de carril, reduzcan la velocidad y procedan con precaución al
    acercarse a cualquier vehículo estacionado con luces intermitentes.
- id: 187
  category: sharing_the_road
  question: En Illinois, ¿a qué se refiere el "Alcance Holandés" (Dutch Reach) al
    salir de un vehículo estacionado?
  choices:
    A: Revisar el espejo retrovisor dos veces
    B: Usar la mano más alejada de la puerta para abrirla, obligando al conductor
      a mirar si vienen ciclistas
    C: Apagar el motor antes de verificar el tráfico
    D: Abrir la puerta solo hasta la mitad para señalar la intención
  answer: B
  explanation: Las Reglas de la Carretera de Illinois fomentan el "Alcance Holandés"
    (Dutch Reach), que consiste en usar la mano más alejada de la puerta para abrirla,
    lo que gira naturalmente el cuerpo del conductor para mirar si se aproximan ciclistas
    y vehículos.
- id: 188
  category: sharing_the_road
  question: 'En Illinois, cuando un peatón usa un bastón blanco o un perro guía, el
    conductor debe:'
  choices:
    A: Tocar la bocina para hacerle saber que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo y ceder el derecho de paso
    D: Solo detenerse si el peatón se encuentra en un cruce de peatones marcado
  answer: C
  explanation: La ley de Illinois exige que los conductores se detengan por completo
    y cedan el derecho de paso a cualquier peatón ciego o con discapacidad visual
    que utilice un bastón blanco o un perro guía, independientemente de por dónde
    esté cruzando.
- id: 189
  category: sharing_the_road
  question: ¿Cuál es la sanción por una segunda condena por rebasar a un autobús escolar
    detenido en Illinois dentro de un período de cinco años?
  choices:
    A: Multa de $250 y suspensión de 6 meses
    B: Multa de $500 y suspensión de 1 año
    C: Multa de $1,000 y revocación permanente
    D: Multa de $750 y suspensión de 2 años
  answer: B
  explanation: Una segunda condena por rebasar a un autobús escolar detenido en Illinois
    dentro de un periodo de cinco años resulta en una multa obligatoria de $500 y
    una suspensión de los privilegios de conducir por un año.
- id: 190
  category: sharing_the_road
  question: Al seguir a una motocicleta en Illinois, ¿cuál es la distancia de seguimiento
    recomendada para permitir paradas repentinas o cambios en las condiciones de la
    carretera?
  choices:
    A: 1-2 segundos
    B: 3-4 segundos
    C: 5-6 segundos
    D: 10 segundos
  answer: B
  explanation: La Secretaría de Estado de Illinois recomienda una distancia de seguimiento
    de al menos 3 a 4 segundos cuando se circula detrás de una motocicleta para tener
    tiempo suficiente para reaccionar ante peligros que podrían afectar al motociclista
    más que a un automóvil.
- id: 191
  category: sharing_the_road
  question: En Illinois, ¿es legal la "división de carril" (lane splitting) (motocicletas
    que conducen entre dos carriles de tráfico lento o detenido)?
  choices:
    A: Sí, es legal en todo momento
    B: Sí, pero solo si el tráfico se mueve a menos de 20 mph
    C: No, es ilegal en Illinois
    D: Sí, pero solo en autopistas designadas
  answer: C
  explanation: La división de carril (lane splitting) es ilegal en Illinois. Las motocicletas
    tienen derecho al uso total de un carril de tráfico, y ningún vehículo motorizado
    debe conducirse de manera que prive a cualquier motocicleta del uso total de un
    carril.
- id: 192
  category: sharing_the_road
  question: Los camiones grandes tienen "Zonas No" (No-Zones) donde el conductor no
    puede ver otros vehículos. ¿Dónde se encuentra la Zona No más grande y peligrosa
    en un camión comercial?
  choices:
    A: Directamente detrás del camión
    B: La parte delantera del camión
    C: El lado izquierdo del camión
    D: El lado derecho del camión
  answer: D
  explanation: Aunque los camiones tienen puntos ciegos en todos los lados, el lado
    derecho es la Zona No más grande y peligrosa porque los camiones a menudo deben
    realizar giros amplios a la derecha.
- id: 193
  category: sharing_the_road
  question: 'Cuando un automovilista gira a la derecha y un ciclista está a la derecha
    del vehículo, el automovilista en Illinois debe:'
  choices:
    A: Acelerar para girar antes de que el ciclista llegue a la intersección
    '0': Tocar la bocina para advertir al ciclista que se detenga
    C: Ceder el paso al ciclista antes de realizar el giro
    D: Forzar al ciclista a subir a la acera
  answer: C
  explanation: Los automovilistas deben ceder el derecho de paso a los ciclistas al
    girar. Es ilegal y peligroso "cortar el paso" a un ciclista girando a la derecha
    inmediatamente delante de él.
- id: 194
  category: sharing_the_road
  question: 'En Illinois, si usted se ve involucrado en un choque con un peatón o
    una persona que monta en bicicleta, debe:'
  choices:
    A: Solo detenerse si la persona está visiblemente herida
    B: Detenerse inmediatamente en la escena y brindar asistencia
    C: Conducir hasta la estación de policía más cercana sin detenerse
    D: Dejar una nota si la persona está inconsciente
  answer: B
  explanation: La ley de Illinois exige que cualquier conductor involucrado en un
    choque se detenga inmediatamente en la escena, brinde asistencia a cualquier persona
    herida e intercambie información.
- id: 195
  category: vehicle_information
  question: Según la ley de Illinois, ¿cuándo deben estar encendidos los faros delanteros
    de un vehículo?
  choices:
    A: Solo entre el atardecer y el amanecer
    B: Solo cuando la visibilidad sea inferior a 1,000 pies
    C: Desde el atardecer hasta el amanecer y cuando los limpiaparabrisas estén en
      uso
    D: Solo cuando se conduce por carreteras rurales
  answer: C
  explanation: La ley de Illinois exige que los faros delanteros estén encendidos
    desde el atardecer hasta el amanecer, y en cualquier otro momento en que los limpiaparabrisas
    estén en uso debido a la lluvia, nieve, niebla u otras condiciones atmosféricas.
- id: 196
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima requerida de la banda de rodadura para
    los neumáticos de un vehículo de pasajeros en Illinois?
  choices:
    A: 1/32 de pulgada
    B: 2/32 (1/16) de pulgada
    C: 4/32 (1/8) de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Illinois exige que los neumáticos tengan una profundidad
    mínima de la banda de rodadura de 2/32 de pulgada (1/16 de pulgada) y deben estar
    libres de protuberancias o exposición de la lona.
- id: 197
  category: vehicle_information
  question: 'Bajo la ley de Illinois, todo vehículo motorizado debe estar equipado
    con una bocina que pueda escucharse desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Illinois exige que todos los vehículos motorizados tengan una bocina
    que pueda escucharse a una distancia de al menos 200 pies.
- id: 198
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es VERDADERA con respecto al polarizado
    de las ventanas para automóviles de pasajeros en Illinois?
  choices:
    A: Se permite el polarizado en todo el parabrisas delantero si es ligero
    B: No se permite el polarizado en ninguna ventana del vehículo
    C: Se permite el polarizado no reflectante en las 6 pulgadas superiores del parabrisas
      delantero
    D: Illinois no regula el polarizado de las ventanas
  answer: C
  explanation: En Illinois, se permite el polarizado no reflectante en las 6 pulgadas
    superiores del parabrisas delantero. Se aplican porcentajes específicos a las
    ventanas laterales y traseras, pero el parabrisas está estrictamente limitado.
- id: 199
  category: vehicle_information
  question: En Illinois, si una carga se extiende cuántos pies o más más allá de la
    parte trasera del vehículo, ¿se debe colocar una bandera roja o una luz roja al
    final de la carga?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: Si una carga se extiende 4 pies o más más allá de la parte trasera
    del vehículo, se debe mostrar una bandera roja (de día) o una luz roja (de noche)
    en el extremo posterior de la carga.
- id: 200
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos está prohibido en un vehículo que no es
    de emergencia en Illinois?
  choices:
    A: Una cámara de retroceso
    B: Una luz azul o una luz roja intermitente visible desde el frente
    C: Una unidad de GPS montada en el tablero
    D: Un enganche de remolque
  answer: B
  explanation: La ley de Illinois prohíbe el uso de luces intermitentes rojas o azules
    en la parte delantera de vehículos que no sean de emergencia, ya que estas están
    reservadas para la policía y los servicios de emergencia.
- id: 201
  category: vehicle_information
  question: En Illinois, ¿el freno de pie de un vehículo debe ser capaz de detenerlo
    en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 40 pies
  answer: B
  explanation: Los estándares de equipamiento de Illinois requieren que el freno de
    pie sea capaz de detener un vehículo que viaja a 20 mph en un máximo de 25 pies.
- id: 202
  category: vehicle_information
  question: ¿Cuál es la altura máxima legal para un parachoques delantero en un automóvil
    de pasajeros en Illinois?
  choices:
    A: 18 pulgadas
    B: 22 pulgadas
    C: 28 pulgadas
    D: 30 pulgadas
  answer: B
  explanation: En Illinois, la altura máxima del parachoques para un automóvil de
    pasajeros es de 22 pulgadas desde el suelo hasta la parte inferior del parachoques.
- id: 203
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el sistema de escape en Illinois?
  choices:
    A: Debe producir un sonido de "estruendo" para alertar a los peatones
    B: Debe estar equipado con un silenciador en buen estado de funcionamiento para
      evitar el ruido excesivo
    C: Se permiten recortes o derivaciones del silenciador en caminos rurales
    D: Los tubos de escape deben apuntar hacia arriba
  answer: B
  explanation: La ley de Illinois exige que todos los vehículos tengan un silenciador
    en funcionamiento constante para evitar el ruido y el humo excesivos. Los recortes
    y derivaciones del silenciador son ilegales.
- id: 204
  category: vehicle_information
  question: 'En Illinois, se debe mostrar un emblema de vehículo de movimiento lento
    (un triángulo naranja) en la parte trasera de cualquier vehículo diseñado para
    viajar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio para los
    vehículos diseñados para operar a velocidades de 25 mph o menos, como tractores
    agrícolas o equipos de construcción.
- id: 205
  category: vehicle_information
  question: La ley de Illinois exige que un espejo retrovisor debe proporcionar una
    vista de la carretera de al menos ¿cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo motorizado en Illinois debe tener un espejo que permita
    al conductor ver al menos 200 pies hacia atrás.
- id: 206
  category: vehicle_information
  question: ¿En cuál de las siguientes áreas de Illinois se requiere típicamente la
    prueba de emisiones del vehículo?
  choices:
    A: Solo en la ciudad de Springfield
    B: En los 102 condados de Illinois
    C: Áreas específicas que incluyen las zonas metropolitanas de Chicago y East St.
      Louis
    D: Solo para vehículos de más de 25 años
  answer: C
  explanation: La prueba de emisiones de vehículos en Illinois es obligatoria para
    la mayoría de los vehículos registrados en las áreas metropolitanas de Chicago
    y East St. Louis (específicamente partes de los condados de Cook, DuPage, Lake,
    Kane, Kendall, McHenry, Will, Madison y St. Clair).
- id: 207
  category: vehicle_information
  question: Al usar las luces altas (luces de carretera) en Illinois, debe bajarlas
    al menos ¿cuántos pies antes de encontrarse con un vehículo que viene en dirección
    contraria?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Illinois exige que los conductores bajen las luces altas
    al menos 500 pies antes de encontrarse con un vehículo que viene en dirección
    contraria.
- id: 208
  category: vehicle_information
  question: 'En Illinois, los neumáticos se consideran inseguros si la profundidad
    de la banda de rodadura es inferior a:'
  choices:
    A: 1/16 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/8 de pulgada
  answer: B
  explanation: La ley de Illinois establece que los neumáticos deben tener al menos
    2/32 de pulgada de profundidad de la banda de rodadura para ser considerados seguros
    y legales para su operación.
- id: 209
  category: vehicle_information
  question: 'En Illinois, la placa de matrícula en la parte trasera de un vehículo
    debe estar iluminada por una luz blanca para que sea visible desde al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 150 pies
  answer: B
  explanation: La ley de Illinois exige que una luz blanca ilumine la placa de matrícula
    trasera para que sea claramente legible desde una distancia de 50 pies.
- id: 210
  category: vehicle_information
  question: Según la ley de Illinois, ¿cuál es el porcentaje máximo permitido de polarizado
    en las ventanas laterales delanteras (a menos que se aplique una excepción médica)?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: El polarizado de las ventanas laterales delanteras está completamente prohibido
  answer: B
  explanation: En Illinois, la regla general para el polarizado de ventanas es que
    las ventanas laterales delanteras deben permitir el paso de más del 35% de la
    luz (35% VLT).
- id: 211
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de una televisión o monitor de video en un vehículo de Illinois?
  choices:
    A: Se permiten en cualquier lugar del vehículo siempre que el conductor sea mayor
      de 21 años
    B: Están prohibidos si se encuentran en un lugar donde el conductor pueda verlos
      mientras el vehículo está en movimiento
    C: Se permiten solo si el audio está silenciado
    D: Solo se permiten en el asiento delantero para fines de GPS
  answer: B
  explanation: La ley de Illinois prohíbe el funcionamiento de un monitor de video
    o televisión en un lugar donde sea visible para el conductor mientras el vehículo
    está en movimiento, con excepciones para los sistemas de navegación e información
    del vehículo.
- id: 212
  category: vehicle_information
  question: 'En Illinois, las señales de giro deben ser visibles desde una distancia
    de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Illinois exige que las señales de giro eléctricas sean visibles
    desde una distancia no menor a 300 pies bajo la luz solar normal.
- id: 213
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos NO es obligatorio en todos los vehículos
    de pasajeros en Illinois?
  choices:
    A: Limpiaparabrisas
    B: Silenciador
    C: Cámara de reversa
    D: Freno de estacionamiento
  answer: C
  explanation: Aunque muchos vehículos nuevos tienen cámaras de reversa, no son un
    requisito de equipo obligatorio por el estado para todos los vehículos bajo el
    código de vehículos de Illinois, a diferencia de los limpiaparabrisas, silenciadores
    y frenos.
- id: 214
  category: vehicle_information
  question: En Illinois, los vehículos que tienen cuatro años de antigüedad o más
    deben someterse a pruebas de emisiones cada dos años si están registrados en ¿cuál
    de las siguientes áreas?
  choices:
    A: Solo la ciudad de Chicago
    B: Todos los condados de Illinois
    C: Condados específicos en las áreas de Chicago y Metro-East (St. Louis)
    D: Solo vehículos utilizados para fines comerciales
  answer: C
  explanation: Las pruebas de emisiones son obligatorias para la mayoría de los vehículos
    en el área metropolitana de Chicago y el área Metro-East de Illinois cada dos
    años una vez que el vehículo tiene cuatro años de antigüedad.
- id: 215
  category: vehicle_information
  question: 'En Illinois, se debe exhibir un emblema de ''Vehículo de movimiento lento''
    en la parte trasera de cualquier vehículo que viaje a una velocidad inferior a:'
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: La ley de Illinois exige un emblema de Vehículo de movimiento lento
    (un triángulo fluorescente naranja con un borde reflectante rojo) en los vehículos
    diseñados para viajar a velocidades de 25 mph o menos.
- id: 216
  category: signs_and_signals
  question: 'En Illinois, una señal en forma de banderín colocada en el lado izquierdo
    de una carretera de dos carriles indica:'
  choices:
    A: Una zona escolar más adelante
    B: El comienzo de una zona de no rebasar (no-passing zone)
    C: Una curva cerrada a la izquierda
    D: Una zona de construcción
  answer: B
  explanation: En Illinois, se utiliza una señal amarilla en forma de banderín específicamente
    para marcar el comienzo de una zona de no rebasar y se ubica en el lado izquierdo
    de la carretera.
- id: 217
  category: signs_and_signals
  question: Al acercarse a un semáforo en Illinois que muestra una luz amarilla fija,
    ¿qué debe hacer?
  choices:
    A: Acelerar para despejar la intersección antes de que cambie a rojo
    B: Detenerse inmediatamente, incluso si está en medio de la intersección
    C: Prepararse para detenerse, ya que la luz está a punto de cambiar a rojo
    D: Tocar la bocina y proceder con precaución
  answer: C
  explanation: Una luz amarilla fija significa que la señal está cambiando de verde
    a rojo. La ley de Illinois exige que los conductores se preparen para detenerse
    si es seguro hacerlo.
- id: 218
  category: signs_and_signals
  question: En Illinois, ¿qué significa una luz de tráfico roja intermitente?
  choices:
    A: La señal está descompuesta; proceda con extrema precaución
    B: Ceda el paso a todo el tráfico, pero no se detenga por completo
    C: Deténgase, ceda el paso al tráfico y a los peatones, luego proceda cuando sea
      seguro
    D: Wait for the light to turn green before moving
  answer: C
  explanation: Según las Reglas de la Carretera de Illinois, una luz roja intermitente
    debe tratarse de la misma manera que una señal de alto (stop sign).
- id: 219
  category: signs_and_signals
  question: Si las señales de giro de su vehículo no funcionan, ¿cómo debe indicar
    un giro a la derecha utilizando señales manuales en Illinois?
  choices:
    A: Extienda su brazo izquierdo recto hacia afuera de la ventana
    B: Extienda su brazo izquierdo hacia afuera y dóblelo hacia arriba a la altura
      del codo
    C: Extienda su brazo izquierdo hacia afuera y dóblelo hacia abajo a la altura
      del codo
    D: Extienda su brazo derecho recto hacia afuera de la ventana del pasajero
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido hacia afuera y doblado hacia arriba en un ángulo de 90 grados.
- id: 220
  category: signs_and_signals
  question: Bajo la ley de Illinois, ¿cuándo es legal girar a la izquierda con luz
    roja?
  choices:
    A: Nunca; los giros a la izquierda en rojo están estrictamente prohibidos
    B: Solo cuando se gira desde una calle de un solo sentido hacia otra calle de
      un solo sentido
    C: En cualquier momento que no haya tráfico en sentido contrario
    D: Solo entre las 10:00 PM y las 6:00 AM
  answer: B
  explanation: En Illinois, se permite un giro a la izquierda en rojo solo cuando
    se gira desde una calle de un solo sentido hacia otra calle de un solo sentido
    después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 221
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla continua en su lado de la línea central
    discontinua en Illinois?
  choices:
    A: Usted se encuentra en una zona de alta velocidad
    B: Puede rebasar con precaución
    C: No se le permite rebasar
    D: Debe girar a la derecha en la próxima intersección
  answer: C
  explanation: Una línea amarilla continua en su lado de la línea central indica una
    zona de no rebasar en Illinois.
- id: 222
  category: signs_and_signals
  question: 'En Illinois, una señal en forma de pentágono (cinco lados) le advierte
    específicamente sobre:'
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Un requisito de ceder el paso
  answer: C
  explanation: Una señal en forma de pentágono se utiliza exclusivamente para zonas
    escolares y cruces escolares en Illinois.
- id: 223
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente en una intersección de
    Illinois?
  choices:
    A: Usted tiene el derecho de paso para girar
    B: Puede girar en la dirección de la flecha después de ceder el paso al tráfico
      en sentido contrario y a los peatones
    C: El giro está prohibido; espere a una flecha verde
    D: La intersección está cerrada por construcción
  answer: B
  explanation: Una flecha amarilla intermitente significa que puede girar a la izquierda
    (o en la dirección de la flecha), pero primero debe ceder el paso a todo el tráfico
    en sentido contrario y a los peatones.
- id: 224
  category: signs_and_signals
  question: ¿De qué color son las señales reglamentarias en Illinois, como 'Speed
    Limit' (Límite de velocidad) o 'No U-Turn' (Prohibido girar en U)?
  choices:
    A: Amarillo con letras negras
    B: Blanco con letras negras o rojas
    C: Naranja con letras negras
    D: Verde con letras blancas
  answer: B
  explanation: Las señales reglamentarias en Illinois suelen ser rectangulares y blancas
    con letras o símbolos en negro o rojo.
- id: 225
  category: signs_and_signals
  question: En Illinois, ¿qué indican las líneas blancas discontinuas en el pavimento?
  choices:
    A: Separan carriles de tráfico que se mueven en direcciones opuestas
    B: Indican el borde de la calzada
    C: Separan carriles de tráfico que se mueven en la misma dirección
    D: Indican un cruce peatonal
  answer: C
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección donde se permite el cambio de carril.
- id: 226
  category: signs_and_signals
  question: 'Cuando ve una señal naranja en forma de diamante en Illinois, debe:'
  choices:
    A: Buscar un hospital cercano
    B: Prepararse para un cruce escolar
    C: Estar atento a trabajadores y equipo de construcción o mantenimiento
    D: Detenerse y esperar a un banderillero
  answer: C
  explanation: El naranja es el color estándar para las señales de construcción y
    mantenimiento de carreteras en Illinois.
- id: 227
  category: signs_and_signals
  question: En Illinois, ¿qué significa una señal amarilla redonda con una 'X' negra
    y las letras 'RR'?
  choices:
    A: Hay un área de descanso adelante
    B: Hay un cruce de ferrocarril adelante
    C: La carretera termina en un callejón sin salida
    D: Comienza una ruta rural
  answer: B
  explanation: Una señal de advertencia amarilla redonda con una 'X' negra y 'RR'
    es la señal de advertencia anticipada para un cruce de ferrocarril.
- id: 228
  category: signs_and_signals
  question: ¿Qué significa una señal de 'Yield' (Ceda el paso) roja y blanca en Illinois?
  choices:
    A: Detenerse y esperar a que pase todo el tráfico antes de avanzar
    B: Reducir la velocidad y estar preparado para detenerse; dejar pasar primero
      al tráfico o peatones que tengan el derecho de paso
    C: Usted tiene el derecho de paso sobre todos los demás vehículos
    D: Acelerar para incorporarse al tráfico rápidamente
  answer: B
  explanation: Una señal de ceder el paso significa que debe reducir la velocidad
    y otorgar el derecho de paso a cualquier vehículo o peatón que se encuentre en
    la intersección o se aproxime a ella.
- id: 229
  category: signs_and_signals
  question: 'En Illinois, al acercarse a un semáforo con una luz roja intermitente,
    usted debe:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse solo si hay otro tráfico presente
    C: Detenerse por completo, ceder el derecho de paso y proceder cuando sea seguro
    D: Esperar a que la luz cambie a verde
  answer: C
  explanation: 'Una luz roja intermitente en Illinois conlleva los mismos requisitos
    que una señal de alto (Stop): se requiere una parada completa antes de proceder
    cuando sea seguro.'
- id: 230
  category: signs_and_signals
  question: Cuando un semáforo muestra una luz amarilla fija, ¿qué significa para
    un conductor de Illinois?
  choices:
    A: Acelerar para despejar la intersección
    B: La señal está cambiando a rojo y debe prepararse para detenerse si es seguro
      hacerlo
    C: Usted tiene el derecho de paso para girar a la izquierda
    D: Detenerse inmediatamente, incluso si está en medio de la intersección
  answer: B
  explanation: Una luz amarilla fija indica que la señal está a punto de cambiar a
    rojo. Los conductores deben detenerse si pueden hacerlo de manera segura; de lo
    contrario, deben despejar la intersección con precaución.
- id: 231
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico amarilla intermitente en una intersección
    en Illinois?
  choices:
    A: Detenerse y esperar la luz verde
    B: Lo mismo que una señal de alto (stop)
    C: Proceder con precaución
    D: Los peatones tienen el derecho de paso únicamente
  answer: C
  explanation: Una luz amarilla intermitente significa que debe proceder con precaución
    y estar alerta ante posibles peligros.
- id: 232
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en una carretera de Illinois?
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: Una zona donde no se permite rebasar
    C: El tráfico se mueve en la misma dirección y se permiten los cambios de carril
    D: El borde de la calzada
  answer: C
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Se permite cruzarlas cuando es seguro cambiar
    de carril.
- id: 233
  category: signs_and_signals
  question: Si un conductor en Illinois utiliza señales manuales, ¿cuál señal indica
    un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo y la
    mano izquierdos extendidos hacia arriba.
- id: 234
  category: signs_and_signals
  question: ¿Qué representa una señal de color naranja en forma de diamante en Illinois?
  choices:
    A: Información regulatoria
    B: Parques y recreación
    C: Advertencia de construcción o mantenimiento
    D: Cruce de peatones
  answer: C
  explanation: El naranja es el color estándar para las señales de advertencia de
    construcción y mantenimiento en Illinois.
- id: 235
  category: signs_and_signals
  question: En Illinois, si se aproxima a un cruce de ferrocarril con las barreras
    bajadas y las señales parpadeando, ¿cuál es la sanción por una primera condena
    por conducir a través o alrededor de las barreras?
  choices:
    A: Multa de $100
    B: Multa de $250 y 25 horas de servicio comunitario
    C: Multa de $500 o 50 horas de servicio comunitario
    D: Revocación obligatoria de la licencia por 1 año
  answer: C
  explanation: La ley de Illinois impone una multa de $500 o 50 horas de servicio
    comunitario por una primera condena por desobedecer una señal o barrera de cruce
    de ferrocarril.
- id: 236
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de 'Incorporación' (Merge) en Illinois?
  choices:
    A: Dos carriles de tráfico que se mueven en la misma dirección están a punto de
      convertirse en uno
    B: Debe detenerse por completo antes de entrar en la autopista
    C: El tráfico de otra carretera está entrando en su camino y debe ajustar la velocidad/posición
    D: Usted tiene el derecho de paso absoluto sobre el tráfico que entra
  answer: C
  explanation: Una señal de incorporación advierte a los conductores que dos carreteras
    separadas se unirán en una sola. Los conductores en ambas carreteras son responsables
    de ajustar la velocidad y la posición para incorporarse de manera segura.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce peatonal o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 237
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 238
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta carretera
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 239
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 240
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 241
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 242
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 243
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 244
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 245
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 246
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 247
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 248
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 249
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 250
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (roundabout) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 251
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 252
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 253
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 254
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta (roundabout) más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 255
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 256
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: Inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 257
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 258
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 259
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 260
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de sentido único o de una autopista dividida
    y se encuentre con vehículos que circulan en dirección opuesta.
  id: 261
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 262
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 263
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 264
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 265
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 266
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la carretera desde la calle lateral.
  id: 267
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse al tráfico existente. El tráfico que
    entra desde la rampa tiene su propio carril nuevo.
  id: 268
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 269
