- id: 132
  category: alcohol_drugs_health
  question: En Illinois, el "Transporte Ilegal de Bebidas Alcohólicas" (Contenedor
    Abierto) para un conductor resulta en una suspensión de la licencia por la segunda
    infracción ¿dentro de qué plazo?
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: Cualquier dos condenas en la vida
  answer: B
  explanation: Una segunda condena por transporte ilegal de alcohol dentro de un periodo
    de 12 meses resultará en la suspensión de los privilegios de conducir para el
    conductor.
- id: 133
  category: alcohol_drugs_health
  question: Según la ley de Illinois, ¿cuál de los siguientes se considera "DUI Agravado"?
  choices:
    A: DUI cometido mientras se conduce un autobús escolar con niños a bordo
    B: DUI que resulta en daños corporales graves o desfiguración permanente
    C: DUI cometido sin una licencia o permiso de conducir válido
    D: Todas las anteriores
  answer: D
  explanation: El DUI agravado es un delito grave en Illinois e incluye el DUI cometido
    mientras se conduce un autobús escolar, el DUI que causa lesiones graves o la
    muerte, y el DUI cometido sin licencia o sin seguro.
- id: 134
  category: alcohol_drugs_health
  question: ¿Cuál es la multa máxima por una primera condena de DUI en Illinois (excluyendo
    tarifas y evaluaciones adicionales)?
  choices:
    A: Hasta $500
    B: Hasta $1,000
    C: Hasta $2,500
    D: Hasta $5,000
  answer: C
  explanation: Una primera condena por DUI es un delito menor de Clase A en Illinois,
    que conlleva una multa máxima de $2,500.
- id: 135
  category: alcohol_drugs_health
  question: En Illinois, es ilegal que una persona conduzca si ha utilizado ¿cuál
