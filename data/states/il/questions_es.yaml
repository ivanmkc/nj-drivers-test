  choices:
    A: 2 nanogramos
    B: 5 nanogramos
    C: 10 nanogramos
    D: 15 nanogramos
  answer: B
  explanation: La ley de Illinois define el deterioro por cannabis para conducir como
    tener 5 nanogramos o más de THC por mililitro de sangre completa (o 10 nanogramos
