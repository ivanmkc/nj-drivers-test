    C: Su licencia será revocada por 1 año
    D: Su licencia será suspendida por 3 meses
  answer: B
  explanation: En Illinois, si es menor de 21 años y es condenado por comprar, poseer
    o consumir alcohol, sus privilegios de conducir serán suspendidos por 6 meses
    por una primera infracción.
- id: 149
  category: alcohol_drugs_health
  question: Si un conductor de Illinois se ve involucrado en un accidente con lesiones
    personales o fatal y se descubre que tiene algún rastro de una sustancia controlada
