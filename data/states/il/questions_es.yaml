- id: 167
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por operar un vehículo motorizado en Illinois
    sin el seguro de responsabilidad civil obligatorio requerido (primera infracción)?
  choices:
    A: '100'
    B: '250'
    C: '500'
