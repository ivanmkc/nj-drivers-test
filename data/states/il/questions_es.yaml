- id: 142
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al 'Transporte
    ilegal de bebidas alcohólicas' en Illinois?
  choices:
    A: El alcohol puede transportarse en el área de pasajeros si el sello está roto
      pero la tapa está puesta
    B: El alcohol debe estar en su envase original con el sello intacto
    C: Los pasajeros en un automóvil de pasajeros estándar pueden beber alcohol siempre
