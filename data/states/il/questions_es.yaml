questions:
- id: 1
  category: license_system
  question: ¿Para qué fecha exigirá el gobierno federal que su licencia de conducir
    o tarjeta de identificación cumpla con los requisitos de REAL ID para abordar
    vuelos nacionales?
  choices:
    A: 7 de mayo de 2024
    B: 7 de mayo de 2025
    C: 1 de enero de 2025
    D: 1 de octubre de 2025
  answer: B
  explanation: El Departamento de Seguridad Nacional de los EE. UU. extendió el plazo
    hasta el 7 de mayo de 2025, lo que significa que el gobierno federal exigirá una
    tarjeta que cumpla con REAL ID para abordar vuelos nacionales a partir de esta
    fecha.
- id: 2
  category: license_system
  question: Después del 7 de mayo de 2025, ¿para cuál de las siguientes actividades
    NO se aceptará una licencia de conducir estándar de Illinois?
  choices:
    A: Conducir un vehículo
    B: Fines de identificación general
    C: Abordar un vuelo nacional
    D: Solicitar una renovación de identificación estándar
  answer: C
  explanation: Según el manual, una licencia de conducir (DL) o identificación (ID)
    estándar no se aceptará para abordar un vuelo nacional (dentro de los EE. UU.)
    ni para ingresar a una base militar o instalación federal segura después del 7
    de mayo de 2025.
- id: 3
  category: license_system
  question: Al solicitar una REAL ID, ¿cuántos documentos de residencia actuales con
    su nombre debe proporcionar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: El paso 4 del proceso de solicitud de REAL ID requiere que proporcione
    dos documentos de residencia actuales con su nombre, como una factura de servicios
    públicos o un contrato de arrendamiento.
- id: 4
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para proporcionar prueba
    de su número de Seguro Social (SSN) completo al solicitar una REAL ID?
  choices:
    A: Una factura de servicios públicos
    B: Un formulario W-2
    C: Una tarjeta de crédito
    D: Un contrato de arrendamiento
  answer: B
  explanation: El paso 3 del proceso de solicitud de REAL ID establece que los ejemplos
    de prueba del SSN completo incluyen una tarjeta de Seguro Social, un W-2 o un
    talón de pago con el SSN completo.
- id: 5
  category: license_system
  question: ¿Aceptará la Administración de Seguridad en el Transporte (TSA) su documento
    temporal de papel de la REAL ID para abordar un vuelo?
  choices:
    A: Sí, si se acompaña de una tarjeta de crédito
    B: Sí, es totalmente válido para todos los fines federales
    C: No, la TSA y los agentes federales no aceptarán el documento de papel
    D: Sí, pero solo para vuelos internacionales
  answer: C
  explanation: El paso 6 del proceso de solicitud de REAL ID señala explícitamente
    que la TSA y los agentes federales no aceptarán el documento temporal de papel.
- id: 6
  category: license_system
  question: ¿Cómo se compara el costo de una REAL ID con el costo de una licencia
    de conducir o identificación estándar?
  choices:
    A: La REAL ID cuesta más
    B: La DL/ID estándar cuesta más
    C: Los costos de una REAL ID y una DL/ID estándar son los mismos
    D: La REAL ID es gratuita para todos los residentes de Illinois
  answer: C
  explanation: El manual establece claramente que 'Las tarifas para una REAL ID y
    una DL/ID estándar son las mismas'.
- id: 7
  category: license_system
  question: Si su nombre ha cambiado y está utilizando un certificado de matrimonio
    para demostrar su identidad para una REAL ID, ¿qué tipo de certificado de matrimonio
    es aceptable?
  choices:
    A: Una fotocopia de un certificado de matrimonio
    B: Un certificado emitido por una iglesia
    C: Un certificado de matrimonio certificado de la oficina del Secretario del Condado
      (County Clerk)
    D: Una carta notariada de su cónyuge
  answer: C
  explanation: El manual especifica que un certificado de matrimonio debe estar certificado
    por la oficina del Secretario del Condado, y que un certificado emitido por una
    iglesia no es aceptable.
- id: 8
  category: license_system
  question: Si el nombre en su certificado de nacimiento es diferente de su nombre
    legal actual, ¿en qué situación NO se requieren documentos adicionales de cambio
    de nombre para una REAL ID?
  choices:
    A: Si tiene un pasaporte válido con su nombre legal actual
    B: Si tiene una factura de servicios públicos con su nombre actual
    C: Si tiene un cheque cancelado con su nombre actual
    D: Si tiene una licencia de conducir estándar de Illinois
  answer: A
  explanation: El manual señala que si tiene un pasaporte válido con su nombre legal
    actual, NO se requieren documentos adicionales de cambio de nombre.
- id: 9
  category: license_system
  question: Después de que sus documentos hayan sido revisados y verificados en la
    oficina, ¿cuándo recibirá su nueva tarjeta REAL ID permanente?
  choices:
    A: Inmediatamente en la oficina
    B: Se enviará por correo en un plazo de 5 días hábiles
    C: Se enviará por correo en un plazo de 15 días hábiles
    D: Se enviará por correo en un plazo de 30 días hábiles
  answer: C
  explanation: El paso 7 del proceso de solicitud de REAL ID establece que su nueva
    tarjeta REAL ID permanente se le enviará por correo en un plazo de 15 días hábiles.
- id: 10
  category: license_system
  question: Usted NO necesita obtener una REAL ID para abordar vuelos nacionales si
    ya posee ¿cuál de los siguientes?
  choices:
    A: Una licencia de conducir estándar de Illinois
    B: Un pasaporte estadounidense o tarjeta de pasaporte válidos
    C: Un certificado de nacimiento certificado
    D: Una identificación temporal de papel
  answer: B
  explanation: 'El manual establece: ''Usted NO NECESITA una REAL ID si: Tiene un
    pasaporte estadounidense o tarjeta de pasaporte válidos''.'
- id: 11
  category: license_system
  question: ¿Cuál de los siguientes documentos puede utilizarse como prueba de firma
    al solicitar una REAL ID?
  choices:
    A: Una factura de servicios públicos
    B: Un acta de nacimiento
    C: Un cheque cancelado
    D: Un formulario W-2
  answer: C
  explanation: El paso 5 del proceso de solicitud de la REAL ID enumera ejemplos de
    pruebas de firma, que incluyen una tarjeta de crédito/débito, un cheque cancelado
    o una licencia de conducir (DL) o identificación (ID) vigente de Illinois.
- id: 12
  category: license_system
  question: ¿Qué se requiere si su nombre legal ha cambiado varias veces desde su
    nacimiento y no tiene un pasaporte válido con su nombre actual?
  choices:
    A: Solo se requiere el documento de cambio de nombre más reciente
    B: Se requerirán múltiples documentos de cambio de nombre
    C: No puede solicitar una REAL ID
    D: Una sola factura de servicios públicos con su nombre actual es suficiente
  answer: B
  explanation: El manual establece explícitamente en la sección "¿Ha CAMBIADO su NOMBRE?"
    que "se requerirán múltiples documentos de cambio de nombre si su nombre ha cambiado
    varias veces".
- id: 13
  category: license_system
  question: Al presentar una orden judicial certificada de cambio de nombre para verificar
    su identidad para una REAL ID, ¿son aceptables las fotocopias?
  choices:
    A: Sí, si son claras y legibles
    B: Sí, pero solo si son a color
    C: No, las copias de documentos no son aceptables
    D: Sí, si van acompañadas de una factura de servicios públicos
  answer: C
  explanation: El manual establece, bajo los documentos aceptados para probar la identidad
    si su nombre ha cambiado, que "no se aceptan copias de documentos".
- id: 14
  category: alcohol_drugs_health
  question: ¿Qué significan las siglas BAC en relación con la conducción bajo los
    efectos del alcohol?
  choices:
    A: Contenido de alcohol en sangre
    B: Concentración de alcohol en sangre (Blood-Alcohol Concentration)
    C: Concentración de alcohol en el aliento
    D: Consumo básico de alcohol
  answer: B
  explanation: El manual se refiere al BAC como "Concentración de alcohol en sangre"
    (Blood-Alcohol Concentration) en la sección relativa a la conducción bajo la influencia.
- id: 15
  category: safe_driving_rules
  question: ¿Cuál de los siguientes términos se utiliza junto con "rotary" para describir
    un tipo específico de intersección?
  choices:
    A: Círculo de tráfico
    B: Glorieta (Roundabout)
    C: Callejón sin salida (Cul-de-sac)
    D: Retorno
  answer: B
  explanation: El manual agrupa estos tipos de intersecciones bajo el título "Rotary
    y Roundabout".
- id: 16
  category: sharing_the_road
  question: Según el manual, ¿de qué maneras pueden estar propulsadas las bicicletas
    que circulan por la vía pública?
  choices:
    A: Solo manual
    B: Solo manual o a gasolina
    C: Manual, a gasolina o eléctrica
    D: Solo eléctrica
  answer: C
  explanation: El manual categoriza específicamente las bicicletas como "manuales,
    a gasolina o eléctricas" al tratar el tema de compartir la vía.
- id: 17
  category: penalties_and_points
  question: ¿Cuáles son los cuatro tipos de acciones que se pueden tomar contra una
    licencia de conducir según se enumeran en el manual?
  choices:
    A: Revocación, Suspensión, Denegación y Cancelación
    B: Suspensión, Libertad condicional, Advertencia y Revocación
    C: Cancelación, Confiscación, Suspensión y Denegación
    D: Revocación, Restricción, Suspensión y Libertad condicional
  answer: A
  explanation: El capítulo 8 del manual cubre la "Revocación, Suspensión, Denegación
    y Cancelación de la licencia de conducir".
- id: 18
  category: vehicle_information
  question: ¿Cuáles son las dos categorías principales de equipo del vehículo que
    se analizan para una conducción segura?
  choices:
    A: Equipo estándar y opcional
    B: Equipo requerido y restringido
    C: Equipo de fábrica y del mercado de accesorios
    D: Equipo primario y secundario
  answer: B
  explanation: El manual divide el equipo para una conducción segura en "Equipo requerido"
    y "Equipo restringido".
- id: 19
  category: alcohol_drugs_health
  question: ¿Qué tipos de cannabis (marihuana) se abordan específicamente en la sección
    de DUI (conducir bajo la influencia) del manual?
  choices:
    A: Solo recreativo
    B: Solo médico
    C: Médico y recreativo
    D: Sintético y natural
  answer: C
  explanation: El manual incluye una sección específica sobre "Cannabis médico y recreativo
    (marihuana)" bajo el tema de Conducir bajo la influencia.
- id: 20
  category: driver_responsibility
  question: ¿Cuál de las siguientes leyes está asociada con los choques de tráfico
    y la responsabilidad financiera?
  choices:
    A: Ley de Responsabilidad de Seguridad (Safety Responsibility Law)
    B: Ley de Protección del Vehículo
    C: Ley de Rendición de Cuentas del Conductor
    D: Ley de Seguridad en las Carreteras
  answer: A
  explanation: La "Ley de Responsabilidad de Seguridad" (Safety Responsibility Law)
    figura en el manual bajo el capítulo de Infracciones de Tránsito/Choques.
- id: 21
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos se agrupa con los scooters en las pautas
    del manual sobre cómo compartir la carretera?
  choices:
    A: Motocicletas
    B: Autociclos
    C: Ciclomotores
    D: Motos de nieve
  answer: C
  explanation: El manual agrupa estos vehículos en la sección "Scooters y ciclomotores".
- id: 22
  category: signs_and_signals
  question: ¿Cuál de los siguientes es un tipo específico de señal utilizada en áreas
    de construcción y mantenimiento?
  choices:
    A: Señales portátiles de mensaje variable
    B: Pantallas digitales permanentes
    C: Señales pintadas temporales
    D: Señales de barricada reflectantes
  answer: A
  explanation: Las "Señales portátiles de mensaje variable" se enumeran específicamente
    junto con las señales de construcción y mantenimiento en el manual.
- id: 23
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una categoría específica de peatones destacada
    en el capítulo sobre cómo compartir la carretera?
  choices:
    A: Adolescentes
    B: Niños
    C: Personas mayores
    D: Trabajadores de la construcción
  answer: B
  explanation: A los "Niños" se les asigna su propia sección específica inmediatamente
    después de la de Peatones en el capítulo sobre cómo compartir la carretera.
- id: 24
  category: defensive_driving
  question: ¿Cuál de las siguientes se enumera como una condición específica del conductor
    que afecta la conducción segura?
  choices:
    A: Conducir con somnolencia
    B: Conducir con hambre
    C: Conducir distraído
    D: Conducir con emociones fuertes
  answer: A
  explanation: '"Conducir con somnolencia" se enumera explícitamente como un tema
    en los Consejos para una conducción segura.'
- id: 25
  category: signs_and_signals
  question: Las señales de tráfico se categorizan principalmente por sus colores,
    funciones (como reglamentarias o de advertencia) y ¿qué otra característica física?
  choices:
    A: Tamaño
    B: Material
    C: Formas
    D: Reflectividad
  answer: C
  explanation: El manual categoriza las señales por "Formas de las señales" y "Colores
    de las señales".
- id: 26
  category: defensive_driving
  question: ¿Qué protocolos de seguridad específicos se describen para los conductores
    cuyos vehículos se averían en la carretera?
  choices:
    A: Pautas para vehículos averiados
    B: Protocolos de seguridad para automovilistas varados
    C: Procedimientos de emergencia en carretera
    D: Reglas de avería en autopista
  answer: B
  explanation: El manual incluye una sección titulada específicamente "Protocolos
    de seguridad para automovilistas varados" en los Consejos para una conducción
    segura.
- id: 27
  category: driver_responsibility
  question: Además de la Ley de Responsabilidad de Seguridad, ¿qué otra ley de responsabilidad
    se cubre en la sección de Infracciones de Tránsito/Choques?
  choices:
    A: Ley de Responsabilidad Personal
    B: Ley de Responsabilidad Financiera
    C: Ley de Responsabilidad Civil
    D: Ley de Responsabilidad Penal
  answer: B
  explanation: La "Ley de Responsabilidad Financiera" se enumera junto con la Ley
    de Responsabilidad de Seguridad en el Capítulo 7.
- id: 28
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos recreativos se menciona específicamente
    en el capítulo sobre cómo compartir la carretera?
  choices:
    A: Vehículos todo terreno (ATV)
    B: Motos de nieve
    C: Carritos de golf
    D: Motos de cross
  answer: B
  explanation: 'Las "Motos de nieve" se enumeran específicamente como una categoría
    de vehículos en el Capítulo 5: Cómo compartir la carretera.'
- id: 29
  category: license_system
  question: ¿Qué clase de licencia se le otorga a un conductor que busca una licencia
    básica para operar un automóvil en Illinois?
  choices:
    A: Clase A
    B: Clase C
    C: Clase D
    D: Clase M
  answer: C
  explanation: Según el manual, a un conductor que busca una licencia básica para
    operar un automóvil en Illinois se le otorga una licencia de Clase D.
- id: 30
  category: vehicle_information
  question: ¿Bajo qué condiciones puede el titular de una licencia de Clase D operar
    un vehículo de alquiler de hasta 26,000 libras?
  choices:
    A: Para fines comerciales a través de las fronteras estatales
    B: Al transportar propiedad personal para fines no comerciales dentro de Illinois
    C: Al transportar a más de 15 pasajeros por contrato
    D: Solo si también poseen una Licencia de Conducir Comercial (CDL)
  answer: B
  explanation: Los titulares de una licencia de Clase D pueden operar vehículos de
    alquiler de hasta 26,000 libras cuando transporten su propia propiedad personal
    o la de un familiar directo para fines no comerciales dentro del estado de Illinois.
- id: 31
  category: license_system
  question: A partir del 1 de julio de 2024, ¿qué cambio se aplica a las Licencias
    de Conducir para Visitantes Temporales (TVDL) en Illinois?
  choices:
    A: Serán válidas por 10 años
    B: Ya no se emitirán
    C: Requerirán un examen escrito adicional
    D: Solo se emitirán a conductores menores de 21 años
  answer: B
  explanation: A partir del 1 de julio de 2024, ya no se emitirán Licencias de Conducir
    para Visitantes Temporales (TVDL). Las personas elegibles pueden solicitar una
    licencia de conducir estándar en su lugar.
- id: 32
  category: driver_testing
  question: ¿Qué debe hacer una persona de 16 o 17 años para recibir una licencia
    de conducir de Illinois?
  choices:
    A: Completar 50 horas de práctica de manejo y aprobar las tres partes del examen
    B: Completar un curso de educación vial aprobado por el estado
    C: Tener una Declaración Jurada/Consentimiento firmado por un tutor legal o un
      adulto responsable mayor de 21 años si un padre no puede acompañarlos
    D: Todas las anteriores
  answer: D
  explanation: Si tiene 16 o 17 años, puede recibir su licencia si completa con éxito
    un curso de educación vial aprobado por el estado, completa 50 horas de práctica
    de manejo, aprueba las tres partes del examen y tiene una Declaración Jurada/Consentimiento
    firmado si un padre o tutor no puede acompañarlo.
- id: 33
  category: driver_testing
  question: Si usted es un solicitante por primera vez de 18 años en Illinois que
    nunca ha completado un programa de educación vial, ¿qué se requiere antes de obtener
    una licencia?
  choices:
    A: Completar un curso de educación vial para adultos de seis horas
    B: Completar 100 horas de práctica de manejo
    C: Esperar hasta tener 21 años
    D: Obtener una Licencia de Conducir para Visitantes Temporales (TVDL)
  answer: A
  explanation: Los solicitantes por primera vez de 18, 19 o 20 años que nunca han
    tenido licencia ni han completado un programa de educación vial aprobado deben
    completar con éxito un curso de educación vial para adultos de seis horas.
- id: 34
  category: safe_driving_rules
  question: 'A un conductor menor de 18 años en Illinois NO se le permite conducir:'
  choices:
    A: Un vehículo de alquiler de hasta 10,000 libras
    B: Cualquier vehículo de alquiler que transporte propiedad
    C: Un vehículo con más de un pasajero
    D: Entre las 8 PM y las 6 AM
  answer: B
  explanation: A un conductor menor de 18 años no se le permite conducir ningún vehículo
    de alquiler que transporte propiedad (por ejemplo, repartidores) ni ningún vehículo
    que requiera una licencia de conducir comercial (CDL).
- id: 35
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos tiene prohibido conducir de alquiler
    un conductor menor de 21 años?
  choices:
    A: Un vehículo que transporte a más de 10 pasajeros
    B: Una furgoneta de transporte compartido o un autobús de una organización religiosa
    C: Un autobús escolar o un vehículo de cuidado infantil
    D: Todas las anteriores
  answer: D
  explanation: A un conductor menor de 21 años no se le permite conducir ningún vehículo
    de alquiler que transporte a más de 10 pasajeros, una furgoneta de transporte
    compartido, un autobús de una organización religiosa, un autobús escolar, un vehículo
    que transporte a personas mayores o un vehículo de cuidado infantil.
- id: 36
  category: license_system
  question: Si se muda permanentemente a Illinois desde otro estado, ¿cuánto tiempo
    tiene para obtener una licencia de conducir de Illinois?
  choices:
    A: Dentro de los 30 días
    B: Dentro de los 60 días
    C: Dentro de los 90 días o antes de que expire su licencia de otro estado, lo
      que ocurra primero
    D: Dentro de los 120 días
  answer: C
  explanation: Si se ha mudado permanentemente a Illinois desde otro estado, debe
    obtener una licencia de Illinois dentro de los 90 días o antes de que expire su
    licencia de conducir, lo que ocurra primero.
- id: 37
  category: license_system
  question: ¿Quién está exento de necesitar una licencia de conducir válida de Illinois
    mientras conduce en Illinois?
  choices:
    A: Un estudiante de otro estado que asiste a una universidad de Illinois con una
      licencia válida de su estado de origen
    B: Un nuevo residente que ha vivido en Illinois durante 6 meses
    C: Un joven de 17 años que no ha completado la educación vial
    D: Un conductor que opera un vehículo comercial por primera vez
  answer: A
  explanation: Si usted es un estudiante de otro estado que asiste a un colegio o
    universidad de Illinois, usted, su cónyuge y sus hijos pueden conducir con una
    licencia válida de su estado o país de origen.
- id: 38
  category: license_system
  question: ¿Cuánto tiempo tiene un residente legal de Illinois que presta servicio
    en las Fuerzas Armadas de los EE. UU. fuera del país para conducir con una licencia
    diferida al regresar?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: D
  explanation: Si presta servicio en las Fuerzas Armadas de los EE. UU. fuera de los
    Estados Unidos pero es residente legal de Illinois, puede conducir durante los
    primeros 120 días de su regreso si obtuvo previamente un aplazamiento de su licencia
    de conducir.
- id: 39
  category: driver_responsibility
  question: ¿Cuántos días tiene para solicitar una licencia de conducir o tarjeta
    de identificación corregida después de cambiar legalmente su nombre?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si ha cambiado legalmente su nombre, debe solicitar una licencia de
    conducir o tarjeta de identificación corregida dentro de los 30 días posteriores
    al cambio de nombre.
- id: 40
  category: driver_responsibility
  question: ¿Dentro de cuántos días debe notificar a la oficina de la Secretaría de
    Estado sobre un cambio de dirección?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: A
  explanation: Debe notificar a la oficina de la Secretaría de Estado sobre un cambio
    de dirección dentro de los 10 días posteriores a cualquier mudanza.
- id: 41
  category: license_system
  question: ¿Qué debe hacer para recibir una licencia de conducir física actualizada
    que refleje una nueva dirección?
  choices:
    A: Llamar a la oficina de la Secretaría del Estado
    B: Enviar una carta por correo a la oficina de Springfield
    C: Visitar una instalación y presentar documentos aceptables para probar la residencia
    D: Actualizar su dirección en línea
  answer: C
  explanation: No recibirá una licencia de conducir (DL) o identificación (ID) actualizada
    que refleje el cambio de dirección a menos que visite una instalación y presente
    documentos aceptables para probar la residencia, incluyendo una dirección postal
    válida.
- id: 42
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la operación
    de un tractor agrícola en una calzada en Illinois?
  choices:
    A: Debe tener una licencia de conducir Clase D
    B: Debe tener una Licencia de Conducir Comercial (CDL)
    C: Puede operarlo temporalmente entre edificios agrícolas y tierras de cultivo
      cercanas sin una licencia de conducir de Illinois
    D: Debe tener al menos 21 años de edad
  answer: C
  explanation: Puede conducir en Illinois sin una licencia de conducir de Illinois
    válida si está operando una máquina de carretera temporalmente en la calzada o
    un tractor agrícola entre los edificios de la granja y las tierras de cultivo
    cercanas.
- id: 43
  category: license_system
  question: ¿Qué se requiere para el proceso de solicitud de un documento que cumpla
    con REAL ID en Illinois?
  choices:
    A: Solo una licencia válida de otro estado
    B: Documentación que confirme la identidad, el número de Seguro Social, la residencia
      y la firma
    C: Un examen escrito y una prueba de manejo
    D: Un curso de educación vial para adultos de 6 horas
  answer: B
  explanation: El proceso de solicitud para un documento que cumpla con REAL ID requiere
    medidas de seguridad mejoradas, lo que significa que debe proporcionar documentación
    que confirme su identidad, número de Seguro Social, residencia y firma.
- id: 44
  category: license_system
  question: ¿Qué cambio con respecto a las Licencias de Conducir para Visitantes Temporales
    (TVDL) entró en vigor el 1 de julio de 2024?
  choices:
    A: Ahora tienen una validez de 8 años.
    B: Requieren tres comprobantes de residencia.
    C: Ya no se emitirán.
    D: Solo están disponibles para conductores menores de 21 años.
  answer: C
  explanation: El manual establece que, a partir del 1 de julio de 2024, ya no se
    emitirán Licencias de Conducir para Visitantes Temporales (TVDL), y las personas
    elegibles ahora pueden solicitar una licencia de conducir estándar.
- id: 45
  category: license_system
  question: ¿Cuántos documentos que prueben la residencia en Illinois se requieren
    al solicitar una licencia de conducir que cumpla con REAL ID por primera vez en
    comparación con una licencia de emisión estándar?
  choices:
    A: Uno para REAL ID, dos para estándar
    B: Dos para REAL ID, uno para estándar
    C: Tres para REAL ID, dos para estándar
    D: Dos tanto para REAL ID como para estándar
  answer: B
  explanation: Un solicitante de REAL ID por primera vez debe presentar dos documentos
    para probar la residencia en Illinois, mientras que un solicitante de emisión
    estándar por primera vez debe presentar un documento.
- id: 46
  category: license_system
  question: ¿Quién debe completar y firmar debidamente el formulario de solicitud
    para una Tarjeta de Identificación para Personas con Discapacidad de Illinois?
  choices:
    A: Un instructor de manejo con licencia
    B: Un profesional médico
    C: Un notario público
    D: Un gerente de una instalación de la Secretaría del Estado
  answer: B
  explanation: El manual especifica que la Solicitud para una Tarjeta de Identificación
    para Personas con Discapacidad de Illinois debe ser completada y firmada debidamente
    por un profesional médico.
- id: 47
  category: license_system
  question: ¿Bajo qué condición puede una persona mayor de 60 años recibir un duplicado
    de la licencia de conducir sin costo si fue robada?
  choices:
    A: Debe presentar un informe policial.
    B: Debe solicitarlo en línea.
    C: No necesita un informe policial.
    D: Debe esperar hasta su próxima fecha de renovación.
  answer: C
  explanation: El manual señala que, si bien los solicitantes menores de 60 años deben
    presentar un informe policial para obtener un duplicado gratuito de una licencia
    robada, las personas mayores de 60 años no necesitan un informe policial para
    obtener un duplicado de la licencia de conducir o tarjeta de identificación sin
    costo.
- id: 48
  category: driver_responsibility
  question: ¿Qué debe hacer si no recibe un aviso de renovación de la licencia de
    conducir por correo?
  choices:
    A: Esperar hasta que llegue el aviso para renovar.
    B: Continuar conduciendo porque su licencia se extiende automáticamente.
    C: Es su responsabilidad renovar la licencia antes del vencimiento, independientemente
      del aviso.
    D: Solicitar una extensión temporal de 90 días en línea.
  answer: C
  explanation: 'El manual establece: ''Es responsabilidad del conductor renovar la
    licencia antes del vencimiento, independientemente de si se recibe una carta de
    renovación''.'
- id: 49
  category: license_system
  question: ¿Cuándo vence la licencia de conducir para un conductor menor de 21 años?
  choices:
    A: En su cumpleaños número 21
    B: Tres meses después de su cumpleaños número 21
    C: Seis meses después de su cumpleaños número 21
    D: En su cumpleaños número 22
  answer: B
  explanation: Para los conductores menores de 21 años, la licencia de conducir vence
    tres meses después de su cumpleaños número 21.
- id: 50
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir para conductores
    entre las edades de 81 y 86 años?
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cuatro años
  answer: B
  explanation: Según el manual, para los conductores de 81 a 86 años, la licencia
    es válida por dos años.
- id: 51
  category: license_system
  question: ¿Con qué frecuencia deben renovar su licencia de conducir los conductores
    de 87 años o más?
  choices:
    A: Cada seis meses
    B: Anualmente
    C: Cada dos años
    D: Cada cuatro años
  answer: B
  explanation: El manual establece que para los conductores de 87 años o más, la licencia
    requiere una renovación anual.
- id: 52
  category: license_system
  question: Después de completar con éxito el proceso de renovación y pagar la tarifa,
    ¿por cuánto tiempo es válida la licencia de conducir temporal de papel segura?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: Al realizar el pago y completar con éxito cualquier examen requerido,
    la Secretaría del Estado emitirá una licencia de conducir o tarjeta de identificación
    temporal de papel segura, la cual es válida por 90 días.
- id: 53
  category: license_system
  question: ¿Por qué podría la oficina de correos no entregar su licencia de conducir
    permanente en la dirección proporcionada?
  choices:
    A: Si no pagó por el envío acelerado.
    B: Si hay una orden de reenvío o un servicio de retención de correo en la dirección.
    C: Si no está en casa para firmar la entrega.
    D: Si la licencia temporal ya ha expirado.
  answer: B
  explanation: El manual establece explícitamente que las licencias de conducir y/o
    tarjetas de identificación no serán entregadas por la oficina de correos si existe
    una orden de reenvío o cualquier tipo de servicio de retención de correo para
    la dirección que usted proporcionó.
- id: 54
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para ser elegible para el Programa
    de Renovación de Conductor Seguro (Safe Driver Renewal Program)?
  choices:
    A: El conductor debe tener entre 22 y 74 años.
    B: El conductor debe poseer una licencia de conducir comercial (CDL).
    C: El conductor debe tener al menos una infracción de tráfico menor.
    D: El conductor debe estar solicitando una REAL ID como ciudadano no estadounidense.
  answer: A
  explanation: Para ser elegible para la Renovación de Conductor Seguro, un conductor
    debe tener entre 22 y 74 años, no poseer una CDL, no tener infracciones de tráfico
    y tener información de Seguro Social verificada.
- id: 55
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por presentar la licencia de conducir o tarjeta
    de identificación de otra persona como propia?
  choices:
    A: Una suspensión de 30 días de los privilegios de conducir.
    B: Una multa de hasta $500 y una advertencia.
    C: Posible encarcelamiento de hasta cinco años y una suspensión o revocación de
      12 meses.
    D: Servicio comunitario obligatorio y una suspensión de 6 meses.
  answer: C
  explanation: Las personas están sujetas a arresto, posible encarcelamiento de hasta
    cinco años y una suspensión o revocación de 12 meses de sus privilegios de conducir
    por delitos que incluyen presentar la licencia de conducir o tarjeta de identificación
    de otra persona como propia.
- id: 56
  category: alcohol_drugs_health
  question: Si tiene una condición física o mental que pueda afectar su capacidad
    para operar un vehículo motorizado de manera segura, ¿qué se le podría requerir
    que proporcione al solicitar una licencia de conducir?
  choices:
    A: Una exención firmada por un familiar.
    B: Un Informe Médico completado por un médico con licencia.
    C: Un certificado de finalización de un curso de conducción defensiva.
    D: Un documento de póliza de seguro especial.
  answer: B
  explanation: En ciertos casos donde las condiciones físicas o mentales puedan afectar
    la conducción, debe proporcionar un Informe Médico completado por un médico con
    licencia que verifique su capacidad médica para operar un vehículo motorizado
    de manera segura.
- id: 57
  category: license_system
  question: ¿Qué debe hacer si sus documentos de identidad muestran un nombre diferente
    a su nombre legal actual al solicitar una REAL ID por primera vez?
  choices:
    A: Traer documentación adicional que indique el motivo del cambio de nombre, como
      un certificado de matrimonio.
    B: Solicitar en su lugar una licencia de conducir de emisión estándar.
    C: Esperar 30 días para que se complete una verificación de antecedentes.
    D: Proporcionar una declaración jurada firmada por un notario público.
  answer: A
  explanation: Si presenta documentos de identidad con un nombre diferente a su nombre
    legal actual, debe traer documentación adicional que indique el motivo del cambio
    de nombre (como un certificado de matrimonio certificado, copia de la sentencia
    de divorcio, etc.).
- id: 58
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un Informe Médico completado al personal
    del DMV después de que el médico lo firme?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: Según el manual, el Informe Médico debe presentarse al personal del
    DMV dentro de los 90 días a partir de la fecha en que el médico lo firme.
- id: 59
  category: alcohol_drugs_health
  question: Si desarrolla una condición médica que probablemente cause una pérdida
    del conocimiento, ¿dentro de cuántos días debe notificar a la oficina de la Secretaría
    del Estado?
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 90 días
  answer: B
  explanation: El manual establece que si desarrolla una condición médica que probablemente
    cause una pérdida del conocimiento o de la capacidad para operar un vehículo de
    manera segura, debe notificar a la oficina de la Secretaría del Estado dentro
    de los 10 días posteriores a tener conocimiento de la condición.
- id: 60
  category: penalties_and_points
  question: ¿Qué sucede con su historial de conducción de Illinois si es condenado
    por una infracción de tráfico mientras conduce en otro estado?
  choices:
    A: La infracción será ignorada en Illinois.
    B: Debe entregar su licencia de Illinois de inmediato.
    C: La infracción se incluirá en su historial de conducción de Illinois.
    D: Se le requerirá que vuelva a tomar el examen de conducir.
  answer: C
  explanation: El manual especifica que si es condenado por una infracción de tráfico
    mientras conduce en otro estado, la infracción se incluirá en su historial de
    conducción de Illinois.
- id: 61
  category: license_system
  question: ¿A qué edad se les pedirá a los solicitantes que se unan al Registro de
    Donantes de Órganos y Tejidos de Illinois durante el proceso de solicitud de la
    licencia de conducir?
  choices:
    A: 15 años o más
    B: 16 años o más
    C: 18 años o más
    D: 21 años o más
  answer: B
  explanation: El manual establece que a los solicitantes de 16 años o más se les
    pedirá que se unan al Registro de Donantes de Órganos y Tejidos de Illinois.
- id: 62
  category: license_system
  question: ¿Quién NO es elegible para registrarse para votar al solicitar una licencia
    de conducir de Illinois?
  choices:
    A: Solicitantes que solicitan una licencia que cumple con Real ID
    B: Ciudadanos no estadounidenses
    C: Solicitantes que tienen 18 años
    D: Solicitantes que actualizan su dirección
  answer: B
  explanation: Según el manual, los ciudadanos no estadounidenses que solicitan una
    licencia de conducir no son elegibles para registrarse para votar.
- id: 63
  category: license_system
  question: ¿La ley federal requiere que los hombres de qué grupo de edad se registren
    en el Sistema de Servicio Selectivo al solicitar una licencia de conducir?
  choices:
    A: De 16 a 18 años
    B: De 18 a 21 años
    C: De 18 a 25 años
    D: De 21 a 30 años
  answer: C
  explanation: El manual señala que la ley federal exige que todos los hombres de
    18 a 25 años se registren en el Sistema de Servicio Selectivo.
- id: 64
  category: driver_responsibility
  question: ¿Qué información adicional pueden proporcionar las personas al registrarse
    en la Base de Datos de Contactos de Emergencia de Illinois?
  choices:
    A: Su hospital preferido
    B: Información sobre discapacidades o necesidades médicas especiales
    C: Los detalles del registro de su vehículo
    D: Su número de póliza de seguro de automóvil
  answer: B
  explanation: Las personas que se registran en la Base de Datos de Contactos de Emergencia
    también pueden proporcionar información sobre discapacidades o necesidades médicas
    especiales.
- id: 65
  category: license_system
  question: ¿Cuál es la tarifa de una licencia de conducir estándar para un solicitante
    de entre 21 y 68 años?
  choices:
    A: $5
    B: $20
    C: $30
    D: Gratis
  answer: C
  explanation: El programa de tarifas en el manual indica que la tarifa para una licencia
    de conducir, de 21 a 68 años, es de $30.
- id: 66
  category: license_system
  question: ¿Cuál es la tarifa adicional para agregar o renovar una clasificación
    de motocicleta M o L en una licencia de conducir?
  choices:
    A: $2
    B: $4
    C: $5
    D: $10
  answer: C
  explanation: Además de la tarifa regular de la licencia de conducir, el solicitante
    pagará una tarifa adicional de $5 para agregar o renovar una clasificación de
    motocicleta M o L.
- id: 67
  category: license_system
  question: ¿Cuál es la tarifa por un duplicado de la licencia de conducir para una
    persona menor de 60 años si la licencia fue robada y se proporciona un informe
    policial completo?
  choices:
    A: Gratis
    B: $2
    C: $5
    D: $20
  answer: A
  explanation: El manual establece que un duplicado de la licencia de conducir para
    alguien menor de 60 años cuya licencia fue robada es gratuito, siempre que se
    presente el informe policial completo requerido.
- id: 68
  category: license_system
  question: A partir del 1 de julio de 2024, ¿qué sucede con las Licencias de Conducir
    para Visitantes Temporales (TVDL)?
  choices:
    A: La tarifa aumentará a $30.
    B: Ya no se emitirán.
    C: Serán obligatorias para todos los no residentes.
    D: Serán válidas solo por 90 días.
  answer: B
  explanation: A partir del 1 de julio de 2024, ya no se emitirán Licencias de Conducir
    para Visitantes Temporales (TVDL), y las personas elegibles podrán solicitar una
    licencia de conducir estándar.
- id: 69
  category: license_system
  question: ¿Cuál de los siguientes es necesario para obtener un extracto del historial
    de conducción mediante la presentación de una solicitud por escrito?
  choices:
    A: Número de Seguro Social
    B: Comprobante de seguro del vehículo
    C: Número de licencia de conducir
    D: Un informe policial
  answer: C
  explanation: Una solicitud por escrito para un extracto del historial de conducción
    debe incluir su nombre completo, fecha de nacimiento, número de licencia de conducir
    y la tarifa correspondiente.
- id: 70
  category: license_system
  question: ¿Dónde se coloca la designación "GOLD STAR FAMILY" en una licencia de
    conducir o tarjeta de identificación de Illinois?
  choices:
    A: En el frente de la tarjeta
    B: En el reverso de la tarjeta
    C: A través de la foto del solicitante
    D: Junto al número de la licencia de conducir
  answer: B
  explanation: Se puede colocar una designación de "GOLD STAR FAMILY" en el reverso
    de una licencia de conducir o tarjeta de identificación de Illinois a petición
    del solicitante.
- id: 71
  category: license_system
  question: ¿Cuál es la tarifa de la licencia de conducir para un solicitante de 87
    años de edad o más?
  choices:
    A: Gratuita
    B: $2
    C: $5
    D: $30
  answer: A
  explanation: El programa de tarifas indica que la licencia de conducir para personas
    de 87 años o más es gratuita.
- id: 72
  category: license_system
  question: ¿Cuál de los siguientes servicios se puede completar en línea a través
    de los servicios en línea ampliados de la Secretaría del Estado?
  choices:
    A: Renovar la calcomanía de la placa de matrícula
    B: Realizar el examen de conducir escrito
    C: Solicitar una Real ID por primera vez
    D: Presentar un informe médico por primera vez
  answer: A
  explanation: Los servicios en línea ampliados enumerados en el manual incluyen la
    renovación de la calcomanía de la placa de matrícula.
- id: 73
  category: driver_testing
  question: ¿Cuántos intentos se permiten para aprobar cada examen de la licencia
    de conducir dentro de un año a partir de la fecha en que pagó la tarifa de solicitud?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: C
  explanation: 'El manual establece: "Se le permiten tres intentos para aprobar cada
    examen dentro de un año a partir de la fecha en que pagó la tarifa de solicitud".'
- id: 74
  category: penalties_and_points
  question: ¿Cuál es la sanción por realizar cualquier parte del examen de la licencia
    de conducir por otra persona?
  choices:
    A: Una advertencia y una suspensión de 30 días
    B: Una multa y un mínimo obligatorio de siete días en la cárcel
    C: Una multa y un mínimo obligatorio de 30 días en la cárcel
    D: Revocación permanente de los privilegios de conducir
  answer: B
  explanation: Según el manual, "Realizar cualquier parte del examen de la licencia
    de conducir por otra persona es un delito penal castigado con una multa y un mínimo
    obligatorio de siete días en la cárcel".
- id: 75
  category: driver_testing
  question: ¿Cuál es la agudeza visual mínima requerida para conducir sin una restricción
    de conducción diurna?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/70
  answer: C
  explanation: El manual requiere una "agudeza visual mínima de 20/40 con o sin lentes
    correctivos". La agudeza entre 20/41 y 20/70 se limita únicamente a la conducción
    diurna.
- id: 76
  category: driver_testing
  question: Si la agudeza visual de un conductor está entre 20/41 y 20/70, ¿qué restricción
    se aplicará a sus privilegios de conducir?
  choices:
    A: Deben usar lentes telescópicos.
    B: Están limitados únicamente a la conducción diurna.
    C: Solo pueden conducir con un adulto con licencia.
    D: Tienen restringido conducir en autopistas.
  answer: B
  explanation: 'El manual establece: "Un conductor con una agudeza entre 20/41 y 20/70
    está limitado únicamente a la conducción diurna".'
- id: 77
  category: driver_testing
  question: ¿Con qué frecuencia debe un conductor realizar un examen escrito si tiene
    condenas de tráfico en su historial?
  choices:
    A: Cada 2 años
    B: Cada 4 años
    C: Cada 8 años
    D: Cada 10 años
  answer: C
  explanation: 'El manual establece: "Cada conductor debe realizar un examen escrito
    cada ocho años, excepto aquel conductor que no tenga condenas de tráfico".'
- id: 78
  category: driver_testing
  question: ¿Qué conductores deben realizar un examen de conducir al renovar su licencia
    de conducir?
  choices:
    A: Conductores de 65 años o más
    B: Conductores de 70 años o más
    C: Conductores de 75 años o más
    D: Conductores de 79 años o más
  answer: D
  explanation: 'El manual especifica: "Los conductores de 79 años o más y cualquier
    conductor que cumpla 79 años o más que esté renovando su licencia de conducir
    deben realizar un examen de conducir".'
- id: 79
  category: driver_testing
  question: ¿Qué resultará en una reprobación automática durante el examen de conducir?
  choices:
    A: Pedirle al examinador que repita una instrucción
    B: Cometer cualquier infracción de tráfico o acción peligrosa
    C: Ajustar los espejos antes de poner el vehículo en movimiento
    D: Usar el freno de estacionamiento al estacionar en una colina
  answer: B
  explanation: 'El manual establece: "Reprobará automáticamente el examen si comete
    cualquier infracción de tráfico o cualquier acción peligrosa mientras realiza
    el examen".'
- id: 80
  category: safe_driving_rules
  question: Al realizar la maniobra de retroceso durante el examen de conducir, ¿hacia
    dónde debe mirar el conductor?
  choices:
    A: Solo por el espejo retrovisor
    B: Solo por los espejos laterales
    C: Girar la cabeza hacia la derecha y mirar hacia atrás
    D: Girar la cabeza hacia la izquierda y mirar por la ventana
  answer: C
  explanation: Al retroceder el vehículo aproximadamente 50 pies, el manual indica
    "girar la cabeza hacia la derecha y mirar hacia atrás al realizar esta maniobra".
- id: 81
  category: license_system
  question: ¿En qué días de la semana puede un solicitante solicitar un examen oral
    para la prueba escrita en persona en una instalación?
  choices:
    A: De lunes a viernes
    B: De lunes a jueves
    C: Solo los fines de semana
    D: Cualquier día que la instalación esté abierta
  answer: B
  explanation: 'El manual establece: "Los exámenes orales (para la prueba escrita)
    pueden solicitarse en persona en cualquier instalación de licencias de conducir
    de la Secretaría de Estado, de lunes a jueves".'
- id: 82
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción para un conductor
    menor de 18 años?
  choices:
    A: 6 meses
    B: 12 meses
    C: 24 meses
    D: 36 meses
  answer: C
  explanation: 'El manual establece: "El permiso de instrucción es válido por 24 meses...".'
- id: 83
  category: license_system
  question: ¿Cuánto tiempo debe un joven de 15 a 17 años mantener un permiso de instrucción
    antes de obtener una licencia de conducir?
  choices:
    A: Al menos 3 meses consecutivos
    B: Al menos 6 meses consecutivos
    C: Al menos 9 meses consecutivos
    D: Al menos 12 meses consecutivos
  answer: C
  explanation: El manual establece que el permiso "debe mantenerse durante al menos
    nueve meses consecutivos antes de obtener una licencia de conducir si tiene entre
    15 y 17 años".
- id: 84
  category: license_system
  question: ¿A qué edad puede un solicitante solicitar un permiso de instrucción sin
    tomar un curso de educación vial?
  choices:
    A: 16 años
    B: 16 años y 6 meses o más
    C: 17 años
    D: 17 años y 3 meses o más
  answer: D
  explanation: 'El manual establece: "Si tiene 17 años y 3 meses o más, puede solicitar
    un permiso de instrucción sin tomar un curso de educación vial".'
- id: 85
  category: safe_driving_rules
  question: ¿Cuáles son los requisitos para el adulto supervisor cuando un adolescente
    conduce con un permiso de instrucción?
  choices:
    A: 18 años o más con una licencia válida
    B: 21 años o más, licencia válida, al menos un año de experiencia de conducción,
      sentado en el asiento del pasajero delantero
    C: 25 años o más con una licencia válida, sentado en cualquier lugar del vehículo
    D: Cualquier conductor con licencia sentado en el asiento del pasajero delantero
  answer: B
  explanation: El manual establece que el adulto debe tener "21 años o más, tener
    una licencia válida y tener al menos un año de experiencia de conducción. Esta
    persona debe sentarse en el asiento del pasajero delantero junto a usted".
- id: 86
  category: license_system
  question: ¿Cuántas horas de conducción supervisada al volante se requieren para
    los conductores menores de 18 años antes de ser elegibles para obtener una licencia
    de conducir?
  choices:
    A: 30 horas, incluyendo 5 horas de noche
    B: 40 horas, incluyendo 10 horas de noche
    C: 50 horas, incluyendo 10 horas de noche
    D: 60 horas, incluyendo 15 horas de noche
  answer: C
  explanation: '"La ley de Illinois requiere que los conductores menores de 18 años
    tengan al menos 50 horas de conducción supervisada al volante, incluyendo 10 horas
    de conducción supervisada nocturna..."'
- id: 87
  category: penalties_and_points
  question: ¿Qué sucede si se descubre que un solicitante está haciendo trampa en
    el examen escrito?
  choices:
    A: Reprueba el examen y se le prohíbe volver a tomarlo durante 30 días.
    B: Reprueba el examen y debe pagar una multa de $500.
    C: Reprueba el examen y se le prohíbe volver a tomarlo durante 6 meses.
    D: Recibe una advertencia y debe reiniciar el examen de inmediato.
  answer: A
  explanation: 'El manual establece: "Cualquier solicitante que sea sorprendido haciendo
    trampa reprobará el examen y se le prohibirá volver a tomarlo durante 30 días".'
- id: 88
  category: license_system
  question: ¿Cuál de los siguientes documentos debe llevar al DMV al solicitar una
    licencia de conducir antes de los 18 años?
  choices:
    A: Un registro de conducción de 30 horas
    B: Un registro de conducción de 50 horas con la firma adecuada
    C: Un diploma de escuela secundaria
    D: Prueba de propiedad del vehículo
  answer: B
  explanation: Según el manual, al solicitar una licencia antes de los 18 años, debe
    traer varios documentos, incluido un registro de conducción de 50 horas con la
    firma adecuada.
- id: 89
  category: driver_testing
  question: 'Incluso si un estudiante aprueba una prueba de manejo realizada por su
    instructor de educación vial, es posible que se le requiera aprobar un examen
    de conducción en el DMV si:'
  choices:
    A: Recibió una B en el curso.
    B: Su cumpleaños cae en una fecha determinada de verificación aleatoria.
    C: Tiene menos de 16 años.
    D: Está solicitando una REAL ID.
  answer: B
  explanation: 'El manual establece: ''Los estudiantes cuyos cumpleaños caen en ciertas
    fechas de verificación aleatoria deben aprobar un examen de conducción administrado
    en un DMV, aunque hayan tomado y aprobado una prueba de manejo realizada por su
    instructor de educación vial''.'
- id: 90
  category: driver_testing
  question: 'Bajo el Programa Cooperativo de Pruebas para Conductores, los estudiantes
    de secundaria pueden estar exentos de tomar un examen de conducción administrado
    por la Secretaría de Estado si completan su curso de educación vial con una calificación
    combinada de:'
  choices:
    A: A o B
    B: A, B o C
    C: Aprobado/Reprobado
    D: 90% o superior
  answer: A
  explanation: Los estudiantes de secundaria que completen con éxito un curso de educación
    vial acreditado con una calificación combinada de A o B pueden estar exentos de
    tomar un examen de conducción administrado por la Secretaría de Estado.
- id: 91
  category: license_system
  question: ¿Cuándo vence un Certificado Cooperativo de Examen de Conducir?
  choices:
    A: Un año a partir de la fecha de emisión
    B: En el cumpleaños número 18 del estudiante
    C: El mismo día que el permiso de instrucción del estudiante
    D: Seis meses después de completar la educación vial
  answer: C
  explanation: El manual establece explícitamente que el Certificado Cooperativo de
    Examen de Conducir vence el mismo día que el permiso de instrucción del estudiante
    y no se extenderá.
- id: 92
  category: license_system
  question: 'Si tiene 18, 19 o 20 años y no ha tenido una licencia anteriormente ni
    ha completado un programa de educación vial aprobado, usted debe:'
  choices:
    A: Completar un curso de educación vial para adultos de 6 horas
    B: Mantener un permiso de instrucción durante 9 meses
    C: Completar 50 horas de conducción supervisada
    D: Tomar un curso de conducción defensiva de 12 horas
  answer: A
  explanation: Los conductores primerizos de entre 18 y 20 años que no hayan tenido
    una licencia anteriormente ni hayan completado un programa de educación vial aprobado
    deben completar un curso de educación vial para adultos de seis horas.
- id: 93
  category: safe_driving_rules
  question: ¿Cuáles son las restricciones de conducción nocturna para un conductor
    en la Fase de Permiso (15 años) de domingo a jueves?
  choices:
    A: De 9 p.m. a 6 a.m.
    B: De 10 p.m. a 6 a.m.
    C: De 11 p.m. a 6 a.m.
    D: De medianoche a 5 a.m.
  answer: B
  explanation: Durante la Fase de Permiso, las restricciones de conducción nocturna
    son de domingo a jueves, de 10 p.m. a 6 a.m., y de viernes a sábado, de 11 p.m.
    a 6 a.m.
- id: 94
  category: license_system
  question: ¿Cuánto tiempo debe un conductor en la Fase de Permiso mantener su permiso
    de instrucción antes de pasar a la siguiente fase?
  choices:
    A: Un mínimo de 3 meses
    B: Un mínimo de 6 meses
    C: Un mínimo de 9 meses
    D: Un mínimo de 12 meses
  answer: C
  explanation: Según las pautas de la Fase de Permiso, el permiso debe mantenerse
    durante un mínimo de nueve meses.
- id: 95
  category: safe_driving_rules
  question: Según la ley de Illinois, el uso de cualquier teléfono inalámbrico o celular
    mientras se conduce, incluido un dispositivo de manos libres, está prohibido para
    conductores menores de qué edad (excepto en emergencias)?
  choices:
    A: 18 años
    B: 19 años
    C: 20 años
    D: 21 años
  answer: B
  explanation: El manual establece en todas las fases del GDL que el uso de cualquier
    teléfono inalámbrico o celular mientras se conduce, incluido un dispositivo de
    manos libres, está prohibido para conductores menores de 19 años, excepto en caso
    de emergencia.
- id: 96
  category: safe_driving_rules
  question: 'Durante los primeros 12 meses de la Fase Inicial de Licencia (edades
    16-17), el número de pasajeros se limita a:'
  choices:
    A: Una persona menor de 20 años, a menos que sea un hermano, hermanastro, hijo
      o hijastro
    B: Dos personas menores de 18 años
    C: Solo familiares de cualquier edad
    D: No se permiten pasajeros
  answer: A
  explanation: Durante los primeros 12 meses de la licencia, o hasta que el conductor
    cumpla 18 años, el número de pasajeros se limita a una persona menor de 20 años,
    a menos que el pasajero o pasajeros sean hermanos, hermanastros, hijos o hijastros
    del conductor.
- id: 97
  category: penalties_and_points
  question: Para pasar de la Fase Inicial de Licencia a la Fase de Licencia Completa
    sin que las restricciones se extiendan más allá de los 18 años, ¿cuánto tiempo
    debe un conductor mantener un historial de conducción sin condenas antes de cumplir
    18 años?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Un conductor en la Fase Inicial de Licencia debe mantener un historial
    de conducción sin condenas durante seis meses antes de cumplir 18 años. Una condena
    de tráfico puede extender las restricciones más allá de los 18 años.
- id: 98
  category: driver_responsibility
  question: Si un padre o tutor legal otorga el consentimiento inicial para que un
    menor obtenga una licencia de conducir, ¿cuándo pueden cancelar la licencia del
    menor?
  choices:
    A: Solo si el menor recibe una multa de tráfico
    B: Solo dentro de los primeros 6 meses de la licencia
    C: En cualquier momento, por cualquier motivo, hasta que el conductor cumpla 18
      años
    D: No pueden cancelarla una vez que se emite la licencia
  answer: C
  explanation: El padre o tutor legal que otorgó el consentimiento inicial puede cancelar
    la licencia del menor en cualquier momento, por cualquier motivo, hasta que el
    conductor cumpla 18 años, comunicándose con la oficina de la Secretaría de Estado.
- id: 99
  category: penalties_and_points
  question: ¿A cuántas supervisiones judiciales por infracciones de tráfico graves
    está limitado un conductor menor de 21 años?
  choices:
    A: Cero
    B: Una
    C: Dos
    D: Tres
  answer: B
  explanation: Según la sección de Leyes Relacionadas, un conductor menor de 21 años
    está limitado a una supervisión judicial por infracciones de tráfico graves.
- id: 100
  category: penalties_and_points
  question: 'Si un conductor menor de 18 años desea obtener supervisión judicial por
    una infracción de tráfico, debe asistir a la escuela de seguridad vial y:'
  choices:
    A: Pagar una multa de $500
    B: Entregar su licencia por 30 días
    C: Comparecer ante el tribunal con un padre o tutor legal
    D: Volver a tomar el examen de conducir escrito
  answer: C
  explanation: Para obtener supervisión judicial por una infracción de tráfico, el
    conductor debe asistir a la escuela de seguridad vial. Si es menor de 18 años,
    debe comparecer ante el tribunal con un padre o tutor legal.
- id: 101
  category: license_system
  question: 'A un estudiante menor de 18 años que abandona la escuela secundaria se
    le puede colocar la anotación de finalización de educación vial en su registro
    si:'
  choices:
    A: Paga una tarifa adicional al Secretario de Estado
    B: Tiene una verificación por escrito de inscripción en un programa de GED o programa
      alternativo
    C: Espera hasta cumplir los 19 años
    D: Completa 100 horas de conducción supervisada
  answer: B
  explanation: Los estudiantes menores de 18 años que abandonan la escuela secundaria
    no pueden tener la anotación de finalización en su registro a menos que cumplan
    con ciertas excepciones, como que el instructor tenga una verificación por escrito
    de la inscripción en un programa de GED o un programa alternativo.
- id: 102
  category: license_system
  question: Durante la Fase de Permiso, un conductor debe practicar la conducción
    durante un mínimo de 50 horas. ¿Cuántas de esas horas deben ser de noche?
  choices:
    A: 5 horas
    B: 10 horas
    C: 15 horas
    D: 20 horas
  answer: B
  explanation: La Fase de Permiso requiere que los conductores practiquen la conducción
    un mínimo de 50 horas, incluyendo 10 horas de noche, supervisados por un padre
    o un adulto de 21 años o más.
- id: 103
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor menor de 21 años que es condenado
    por dos o más infracciones de tránsito en movimiento dentro de un período de 24
    meses?
  choices:
    A: Una suspensión mínima de 30 días de la licencia de conducir
    B: Una suspensión mínima de 6 meses de la licencia de conducir
    C: Revocación permanente de los privilegios de conducir
    D: Una carta de advertencia y una multa obligatoria
  answer: A
  explanation: De acuerdo con el manual, un conductor menor de 21 años que sea condenado
    por dos o más infracciones de tránsito en movimiento dentro de un período de 24
    meses tendrá su licencia de conducir suspendida por un mínimo de 30 días.
- id: 104
  category: alcohol_drugs_health
  question: ¿Qué sucede si una persona menor de 21 años recibe supervisión judicial
    por posesión o consumo de alcohol mientras es ocupante de un vehículo motorizado?
  choices:
    A: Se emite una advertencia a sus padres
    B: Su vehículo es confiscado por 30 días
    C: Recibe una suspensión de la licencia de conducir de tres meses
    D: Recibe una suspensión de la licencia de conducir de un mínimo de seis meses
  answer: C
  explanation: Una persona menor de 21 años que reciba supervisión judicial por posesión,
    consumo, compra o recepción de alcohol recibirá una suspensión de la licencia
    de conducir de tres meses si la infracción ocurrió mientras la persona era ocupante
    de un vehículo motorizado.
- id: 105
  category: safe_driving_rules
  question: Cuando lo detiene la policía, ¿dónde debe mantener el conductor sus manos?
  choices:
    A: En su regazo o en los bolsillos
    B: Buscando en la guantera para sacar su registro
    C: Claramente a la vista sobre el volante
    D: Fuera de la ventana del lado del conductor
  answer: C
  explanation: Durante una parada de tráfico, debe permanecer en el vehículo con ambas
    manos claramente a la vista sobre el volante hasta que el oficial de policía le
    indique lo contrario.
- id: 106
  category: safe_driving_rules
  question: Si lo detiene un vehículo policial no rotulado y no puede identificar
    al conductor como un oficial de la ley, ¿cuál es una acción aceptable?
  choices:
    A: Acelerar para alejarse del vehículo
    B: Detenerse inmediatamente en medio del carril de tráfico
    C: Conducir con cuidado hasta la estación de policía más cercana o llamar al 911
    D: Salir de su vehículo y acercarse al auto no rotulado para pedir identificación
  answer: C
  explanation: Si no puede identificar un vehículo policial no rotulado y/o al conductor
    como un oficial de la ley, conduzca lentamente por debajo del límite de velocidad
    y deténgase en un lugar bien iluminado, conduzca hasta la estación de policía
    más cercana o llame al 911.
- id: 107
  category: safe_driving_rules
  question: ¿Qué significa firmar una multa de tránsito emitida por un oficial de
    policía?
  choices:
    A: Es una admisión de culpabilidad por la infracción de tránsito.
    B: Es solo un acuse de recibo de la multa.
    C: Renuncia a su derecho de presentar su caso en el tribunal de tránsito.
    D: Significa que acepta pagar la multa de inmediato.
  answer: B
  explanation: Firmar una multa no es una admisión de culpabilidad del conductor,
    sino solo un acuse de recibo de la multa.
- id: 108
  category: safe_driving_rules
  question: ¿A qué edad permite la ley de Illinois el uso de dispositivos de manos
    libres o tecnología Bluetooth mientras se conduce?
  choices:
    A: 16 años o más
    B: 18 años o más
    C: 19 años o más
    D: 21 años o más
  answer: C
  explanation: El uso de dispositivos de manos libres o tecnología Bluetooth está
    permitido para personas de 19 años o más.
- id: 109
  category: safe_driving_rules
  question: ¿Cuál de las siguientes configuraciones de auriculares está permitida
    mientras se conduce en Illinois?
  choices:
    A: Un auricular doble para escuchar música
    B: Un auricular o pieza de oído de un solo lado
    C: Auriculares con cancelación de ruido en ambos oídos
    D: No se permite ningún tipo de auricular
  answer: B
  explanation: La ley de Illinois prohíbe el uso de auriculares mientras se conduce,
    pero se permite el uso de un auricular o pieza de oído de un solo lado con un
    dispositivo inalámbrico o teléfono celular.
- id: 110
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia se le permite a un conductor usar un teléfono
    celular que NO sea de manos libres?
  choices:
    A: Cuando está detenido en un semáforo en rojo con la marcha puesta (drive)
    B: Al informar una emergencia
    C: Al conducir por una carretera rural sin otros autos alrededor
    D: Al usar la función de altavoz del teléfono mientras lo sostiene
  answer: B
  explanation: El único momento en que puede usar un teléfono celular que no sea de
    manos libres es para informar una emergencia, mientras está estacionado en el
    acotamiento, o cuando está detenido debido a que el tráfico normal está obstruido
    y el vehículo está en punto muerto (neutral) o en estacionamiento (park).
- id: 111
  category: safe_driving_rules
  question: Si su comprobante de seguro está guardado en su teléfono celular, ¿qué
    debe hacer cuando un oficial de policía se lo solicite durante una parada de tráfico?
  choices:
    A: Alcanzar rápidamente su teléfono antes de que el oficial se acerque
    B: Informar al oficial de ese hecho y seguir sus instrucciones antes de retirarlo
    C: Negarse a mostrarlo porque los teléfonos celulares están prohibidos al conducir
    D: Lanzar el teléfono al oficial a través de la ventana
  answer: B
  explanation: Si el comprobante de seguro está guardado para mostrarse en un teléfono
    celular, informe al oficial de policía de ese hecho y luego siga las instrucciones
    del oficial antes de recuperar la información.
- id: 112
  category: penalties_and_points
  question: ¿Qué le puede suceder a una persona menor de 18 años que es acusada de
    una infracción debido a un choque donde un pasajero resultó gravemente herido
    o murió?
  choices:
    A: Se les puede negar la emisión o renovación de su licencia de conducir.
    B: Deben pagar una multa obligatoria de $5,000.
    C: Solo recibirán una advertencia si no hubo alcohol involucrado.
    D: Deben volver a tomar el examen de conducir escrito en un plazo de 10 días.
  answer: A
  explanation: A las personas menores de 18 años que sean acusadas de una infracción
    debido a un choque donde un pasajero resultó gravemente herido o murió se les
    puede negar la emisión o renovación de su licencia de conducir. No es necesario
    que el alcohol sea un factor.
- id: 113
  category: safe_driving_rules
  question: Si las autoridades lo detienen por la noche, ¿cuál es una acción aceptable
    para ayudar al oficial?
  choices:
    A: Apagar sus faros por completo
    B: Encender la luz interior de su vehículo
    C: Apuntar con una linterna al oficial que se acerca
    D: Salir del vehículo para que el oficial pueda verlo claramente
  answer: B
  explanation: Si lo detienen por la noche, es aceptable encender la luz interior
    de su vehículo.
- id: 114
  category: safe_driving_rules
  question: ¿Es legal en Illinois usar un teléfono celular mientras conduce si sostiene
    el dispositivo y usa la función de manos libres (altavoz)?
  choices:
    A: Sí, porque el altavoz se considera manos libres.
    B: Sí, siempre que sea mayor de 18 años.
    C: No, sostener el dispositivo y usar el altavoz no se considera manos libres
      y es una infracción.
    D: No, a menos que conduzca a menos de 30 mph.
  answer: C
  explanation: Usar un teléfono celular mientras se sostiene el dispositivo y se usa
    el altavoz no se considera manos libres y es una violación de la ley de Illinois.
- id: 115
  category: safe_driving_rules
  question: ¿Por qué NO debe salir de su vehículo durante una parada de tráfico a
    menos que el oficial de policía se lo pida?
  choices:
    A: Es ilegal estar de pie en el acotamiento de una carretera.
    B: Salir del vehículo puede percibirse como un comportamiento agresivo y una amenaza
      para la seguridad del oficial.
    C: Podría dejar accidentalmente sus llaves encerradas dentro del vehículo.
    D: El oficial necesita inspeccionar primero el exterior de su vehículo.
  answer: B
  explanation: No salga de su vehículo a menos que se lo pidan. Salir del vehículo
    puede percibirse como un comportamiento agresivo y una amenaza para la seguridad
    del oficial de policía.
- id: 116
  category: safe_driving_rules
  question: 'Un conductor puede usar un teléfono celular que no sea manos libres cuando
    esté detenido debido a que el tráfico normal está obstruido, siempre que:'
  choices:
    A: El vehículo esté en punto muerto (neutral) o en estacionamiento (park).
    B: El conductor mantenga un pie firmemente en el pedal del freno.
    C: Se espere que el retraso dure más de cinco minutos.
    D: El conductor sea mayor de 21 años.
  answer: A
  explanation: El único momento en que puede usar un teléfono celular que no sea manos
    libres es... mientras esté detenido debido a que el tráfico normal está obstruido
    y el vehículo esté en punto muerto (neutral) o en estacionamiento (park).
- id: 117
  category: safe_driving_rules
  question: Según la ley de Illinois, ¿cuál es el único momento en que puede usar
    legalmente un teléfono celular que no sea manos libres mientras conduce?
  choices:
    A: Cuando esté detenido en un semáforo en rojo.
    B: Para reportar una emergencia.
    C: Cuando conduzca por una carretera rural sin otro tráfico.
    D: Al hacer una llamada telefónica rápida que dure menos de un minuto.
  answer: B
  explanation: El manual establece que el único momento en que puede usar un teléfono
    celular que no sea manos libres es para reportar una emergencia, mientras está
    estacionado en el acotamiento, o mientras está detenido debido a que el tráfico
    normal está obstruido y el vehículo está en punto muerto (neutral) o en estacionamiento
    (park).
- id: 118
  category: penalties_and_points
  question: ¿Qué sanción puede enfrentar un conductor si causa un choque que involucre
    a un ciclista o peatón debido a la conducción distraída?
  choices:
    A: Una advertencia por escrito obligatoria.
    B: Una multa máxima de $100.
    C: Sanciones penales y encarcelamiento.
    D: Incautación inmediata del vehículo por 30 días.
  answer: C
  explanation: Si se ve involucrado en un choque con un vehículo motorizado, ciclista,
    peatón o cualquier usuario de la vía causado por la conducción distraída, puede
    enfrentar sanciones penales y encarcelamiento.
- id: 119
  category: safe_driving_rules
  question: ¿Quién está obligado por la ley de Illinois a usar el cinturón de seguridad
    en un vehículo de pasajeros?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero.
    B: Todos los conductores y pasajeros de 8 años o más, tanto en el asiento delantero
      como en el trasero.
    C: Solo los pasajeros menores de 18 años.
    D: Solo el conductor, a menos que el vehículo carezca de bolsas de aire.
  answer: B
  explanation: La ley de Illinois exige que todos los conductores y pasajeros (asiento
    delantero y trasero) de 8 años o más usen cinturones de seguridad, incluso si
    el vehículo está equipado con bolsas de aire.
- id: 120
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de usar la correa del hombro de un cinturón
    de seguridad?
  choices:
    A: Colocada debajo del brazo para evitar la irritación del cuello.
    B: Colocada detrás de la espalda si restringe el movimiento.
    C: Ajustada a través del cuerpo en o cerca del cuello o la cara.
    D: Colocada holgadamente sobre el estómago.
  answer: C
  explanation: La correa del hombro debe estar cómoda y cruzar el cuerpo en o cerca
    del cuello o la cara. Nunca debe colocarse detrás de la espalda o debajo del brazo.
- id: 121
  category: vehicle_information
  question: ¿Cuál es la distancia deseable que un conductor debe mantener entre sí
    mismo y la bolsa de aire del volante?
  choices:
    A: 5-7 pulgadas
    B: 10-12 pulgadas
    C: 15-18 pulgadas
    D: 20-24 pulgadas
  answer: B
  explanation: Es deseable mantener una distancia de 10 a 12 pulgadas entre el conductor
    y la bolsa de aire, especialmente para conductores de baja estatura, personas
    mayores o conductoras embarazadas.
- id: 122
  category: safe_driving_rules
  question: ¿Hasta qué edad exige la ley de Illinois que los niños estén debidamente
    asegurados en un sistema de retención infantil orientado hacia atrás?
  choices:
    A: 1 año de edad, independientemente del peso o la estatura.
    B: 2 años de edad, a menos que pesen más de 40 libras o midan más de 40 pulgadas
      de altura.
    C: 4 años de edad, a menos que pesen más de 50 libras.
    D: 8 años de edad, independientemente del peso o la estatura.
  answer: B
  explanation: A partir del 1 de enero de 2019, la ley de Illinois exige que los niños
    estén debidamente asegurados en un sistema de retención infantil orientado hacia
    atrás hasta los 2 años de edad, a menos que pesen más de 40 libras o midan más
    de 40 pulgadas de altura.
- id: 123
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en las carreteras interestatales y autopistas de peaje en Illinois?
  choices:
    A: 55 mph
    B: 60 mph
    C: 65 mph
    D: 70 mph
  answer: D
  explanation: El límite de velocidad para las carreteras interestatales y autopistas
    de peaje es de 70 mph, a menos que se indique lo contrario.
- id: 124
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad estándar en los callejones en Illinois?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad en los callejones es de 15 mph, a menos que
    se indique lo contrario.
- id: 125
  category: safe_driving_rules
  question: ¿Cuándo están obligados los automovilistas a obedecer el límite de velocidad
    indicado en una zona de construcción?
  choices:
    A: Solo cuando los trabajadores de la construcción están visiblemente presentes.
    B: Solo durante las horas del día.
    C: Las 24 horas del día, los siete días de la semana.
    D: Solo de lunes a viernes.
  answer: C
  explanation: Los automovilistas deben obedecer el límite de velocidad indicado en
    la zona de construcción las 24 horas del día, los siete días de la semana, independientemente
    de la presencia de trabajadores.
- id: 126
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al acercarse a un vehículo de emergencia
    o de mantenimiento estacionado que utiliza señales visuales (luces intermitentes)?
  choices:
    A: Mantener la velocidad y tocar la bocina para alertar a los trabajadores.
    B: Ceder el paso, cambiar a un carril alejado de los trabajadores cuando sea posible
      y proceder con precaución.
    C: Detenerse inmediatamente en el carril actual y esperar instrucciones.
    D: Acelerar para pasar la escena de emergencia lo más rápido posible.
  answer: B
  explanation: La ley de Illinois exige que los automovilistas cedan el paso, cambien
    a un carril alejado de los trabajadores de emergencia cuando sea posible y procedan
    con precaución reduciendo la velocidad.
- id: 127
  category: safe_driving_rules
  question: ¿A qué distancia de una escena de emergencia prohíbe la ley de Illinois
    la fotografía y el uso de teléfonos inalámbricos o celulares?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Illinois prohíbe la fotografía y el uso de teléfonos inalámbricos
    o celulares a menos de 500 pies de una escena de emergencia, excepto en ciertas
    circunstancias.
- id: 128
  category: safe_driving_rules
  question: ¿Bajo qué condiciones se aplica el límite de velocidad de 20 mph en zona
    escolar?
  choices:
    A: En los días escolares entre las 6:30 a.m. y las 4 p.m. cuando hay niños presentes
      y las señales están colocadas.
    B: Las 24 horas del día en cualquier día que haya clases.
    C: En los días escolares entre las 8:00 a.m. y las 3:00 p.m., independientemente
      de si hay niños presentes.
    D: Solo cuando un guardia de cruce está dirigiendo activamente el tráfico.
  answer: A
  explanation: El límite de velocidad en zona escolar es de 20 mph en los días escolares
    entre las 6:30 a.m. y las 4 p.m. cuando hay niños presentes y las señales están
    colocadas.
- id: 129
  category: sharing_the_road
  question: ¿Cómo debe reaccionar un automovilista al encontrarse con una procesión
    funeraria organizada?
  choices:
    A: Conducir entre los vehículos de la procesión para cruzar la intersección.
    B: Unirse a la procesión para asegurar el derecho de paso a través del tráfico.
    C: Ceder el derecho de paso a todos los vehículos de la procesión.
    D: Rebasar la procesión por el acotamiento derecho.
  answer: C
  explanation: Los automovilistas que se encuentren con una procesión funeraria deben
    ceder el derecho de paso a todos los vehículos de la procesión y NO deben conducir
    entre los vehículos ni unirse a la procesión.
- id: 130
  category: safe_driving_rules
  question: Si dos vehículos en diferentes calzadas llegan a una intersección con
    parada de cuatro vías exactamente al mismo tiempo, ¿quién tiene el derecho de
    paso?
  choices:
    A: El vehículo de la izquierda.
    B: El vehículo de la derecha.
    C: El vehículo que viaja a una velocidad mayor.
    D: El vehículo que realiza un giro a la izquierda.
  answer: B
  explanation: Cuando dos vehículos en diferentes calzadas llegan a una intersección
    con parada de cuatro vías al mismo tiempo, el vehículo de la izquierda debe ceder
    el paso al vehículo de la derecha.
- id: 131
  category: safe_driving_rules
  question: ¿Qué debe hacer si está realizando un giro a la izquierda hacia el tráfico
    en sentido contrario, entra en la intersección mientras la luz está en verde y
    la luz cambia a rojo antes de que pueda completar el giro?
  choices:
    A: Retroceder inmediatamente para salir de la intersección.
    B: Detenerse en medio de la intersección y esperar a la siguiente luz verde.
    C: Puede terminar el giro aunque la luz cambie a rojo.
    D: Abandonar el giro a la izquierda y girar a la derecha en su lugar.
  answer: C
  explanation: Al realizar un giro a la izquierda hacia el tráfico en sentido contrario,
    si entra en una intersección mientras la luz está en verde, puede terminar el
    giro aunque la luz cambie a rojo.
- id: 132
  category: safe_driving_rules
  question: Cuando dos vehículos en diferentes calzadas llegan a una intersección
    no controlada al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que viaja a una velocidad mayor
    D: El vehículo que gira a la izquierda
  answer: B
  explanation: Cuando dos vehículos en diferentes calzadas llegan a una intersección
    no controlada al mismo tiempo, el vehículo de la izquierda debe ceder el paso
    al vehículo de la derecha.
- id: 133
  category: safe_driving_rules
  question: Al adelantar a otro vehículo en una carretera de dos carriles, ¿antes
    de qué distancia de un vehículo que viene en sentido contrario debe regresar a
    su carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Debe regresar a su carril antes de estar a menos de 200 pies de un
    vehículo que viene en sentido contrario.
- id: 134
  category: safe_driving_rules
  question: ¿Es legal encender las luces direccionales como cortesía o señal de "puede
    adelantar" para otros conductores detrás de usted?
  choices:
    A: Sí, pero solo en carreteras de dos carriles.
    B: Sí, si el vehículo de atrás lo sigue muy de cerca.
    C: No, es contra la ley.
    D: No, a menos que esté conduciendo un vehículo comercial.
  answer: C
  explanation: Es contra la ley encender las luces direccionales como cortesía o señal
    de "puede adelantar" para otros conductores.
- id: 135
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que debe mantener entre su vehículo y un
    ciclista o peatón al que está adelantando en la carretera?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Al adelantar a un peatón o ciclista en cualquier carretera, incluyendo
    el arcén o un carril para bicicletas dedicado, debe mantener una distancia mínima
    de 3 pies de ellos.
- id: 136
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones está estrictamente prohibido adelantar
    en una calzada de dos carriles y dos sentidos?
  choices:
    A: En cualquier zona de construcción.
    B: En una calle de sentido único.
    C: Cuando el vehículo de adelante está girando a la izquierda.
    D: Cuando tiene dos o más carriles despejados en cada dirección.
  answer: A
  explanation: No se permite adelantar en una calzada de dos carriles y dos sentidos
    en una zona de construcción. Todas las zonas de construcción en Illinois son zonas
    donde no se permite adelantar.
- id: 137
  category: safe_driving_rules
  question: Al conducir en una autopista interestatal, ¿cuándo se le permite conducir
    en el carril izquierdo?
  choices:
    A: En cualquier momento, siempre que conduzca al límite de velocidad.
    B: Solo al adelantar a otro vehículo, o bajo excepciones específicas como congestión
      de tráfico o condiciones climáticas.
    C: Solo cuando conduce más rápido que el límite de velocidad establecido.
    D: Solo cuando se encuentra a menos de 5 millas de su salida prevista.
  answer: B
  explanation: Al conducir en una autopista interestatal, no puede conducir en el
    carril o carriles de la izquierda excepto al adelantar a otro vehículo. Las excepciones
    incluyen congestión, condiciones climáticas, peligros o ceder el paso a vehículos
    de emergencia.
- id: 138
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe dar una señal de giro continua en una zona
    comercial o residencial?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: En una zona comercial o residencial, debe dar una señal de giro continua
    durante al menos 100 pies antes de girar.
- id: 139
  category: safe_driving_rules
  question: ¿Cuál es la señal manual y de brazo correcta para reducir la velocidad
    o detenerse?
  choices:
    A: Brazo izquierdo extendido recto hacia la izquierda.
    B: Brazo izquierdo extendido recto hacia arriba.
    C: Brazo izquierdo extendido hacia abajo.
    D: Brazo derecho extendido recto hacia afuera.
  answer: C
  explanation: Para reducir la velocidad o detenerse usando señales manuales y de
    brazo, la mano y el brazo izquierdos se extienden hacia abajo.
- id: 140
  category: defensive_driving
  question: Al esperar en una intersección para realizar un giro a la izquierda, ¿cómo
    deben estar posicionadas las ruedas de su vehículo?
  choices:
    A: Apuntando hacia la izquierda.
    B: Apuntando hacia la derecha.
    C: Apuntando recto hacia adelante hasta comenzar a realizar el giro.
    D: Giradas ligeramente hacia el bordillo.
  answer: C
  explanation: Al realizar un giro a la izquierda, debe apuntar las ruedas recto hacia
    adelante hasta comenzar a realizar el giro.
- id: 141
  category: safe_driving_rules
  question: Cuando se encuentra en la carretera que termina en una intersección en
    "T" que no tiene señales o semáforos de control de tráfico, ¿qué debe hacer?
  choices:
    A: Continuar sin detenerse, ya que usted tiene el derecho de paso.
    B: Ceder el paso al tráfico transversal.
    C: Tocar la bocina y continuar.
    D: Aumentar la velocidad para incorporarse sin problemas.
  answer: B
  explanation: Debe ceder el paso al tráfico transversal cuando se encuentre en la
    carretera que termina en una intersección en "T" sin señales o semáforos de control
    de tráfico.
- id: 142
  category: safe_driving_rules
  question: ¿A qué distancia de una intersección o cruce de ferrocarril no se permite
    rebasar en una carretera de dos carriles y dos sentidos?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: No se permite rebasar en una carretera de dos carriles y dos sentidos
    a menos de 100 pies de una intersección o un cruce de ferrocarril.
- id: 143
  category: defensive_driving
  question: ¿Cuál es el método recomendado para abrir la puerta de un vehículo del
    lado donde circula el tráfico, para ayudar a verificar si vienen vehículos y ciclistas?
  choices:
    A: El giro francés (French Swing)
    B: El alcance holandés (Dutch Reach)
    C: La verificación del punto ciego
    D: El empuje con dos manos
  answer: B
  explanation: Debe considerar el uso de su mano derecha para abrir la puerta del
    vehículo para permitirle girar y verificar si se aproximan vehículos y ciclistas.
    Esto se conoce comúnmente como el alcance holandés (Dutch Reach).
- id: 144
  category: safe_driving_rules
  question: 'Incluso si tiene la luz verde, no puede entrar en una intersección a
    menos que:'
  choices:
    A: Esté girando a la derecha.
    B: Haya suficiente espacio para permitir el paso de otros vehículos y/o peatones.
    C: Esté conduciendo un vehículo de emergencia.
    D: Toque la bocina para advertir al tráfico que cruza.
  answer: B
  explanation: Un conductor no puede entrar en una intersección ni conducir dentro
    de un paso de peatones marcado a menos que haya suficiente espacio para permitir
    el paso de otros vehículos y/o peatones.
- id: 145
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a dar marcha
    atrás con su vehículo en una carretera de acceso controlado?
  choices:
    A: Puede dar marcha atrás en el acotamiento si se pasa de su salida.
    B: Puede dar marcha atrás en el carril derecho si no hay tráfico.
    C: No puede dar marcha atrás en ningún acotamiento ni calzada de una carretera
      de acceso controlado.
    D: Solo puede dar marcha atrás durante las horas del día.
  answer: C
  explanation: No puede dar marcha atrás en ningún acotamiento ni calzada de ninguna
    carretera de acceso controlado.
- id: 146
  category: safe_driving_rules
  question: ¿Bajo qué condición se le prohíbe realizar un giro en U en curvas y colinas?
  choices:
    A: A menos que pueda ver durante al menos 500 pies en todas las direcciones.
    B: A menos que pueda ver durante al menos 200 pies en todas las direcciones.
    C: A menos que se encuentre en una zona rural.
    D: A menos que utilice sus señales de emergencia.
  answer: A
  explanation: El manual establece que no debe dar la vuelta en curvas y colinas a
    menos que pueda ver durante al menos 500 pies en todas las direcciones.
- id: 147
  category: safe_driving_rules
  question: ¿Qué señal de giro debe usar para avisar a otros conductores que está
    saliendo de una rotonda?
  choices:
    A: Señal de giro a la izquierda
    B: Señal de giro a la derecha
    C: Señales de emergencia
    D: No se requiere ninguna señal
  answer: B
  explanation: Al salir de una rotonda, debe usar la señal de giro a la derecha de
    su vehículo para avisar a otros conductores que está saliendo.
- id: 148
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar con luces
    intermitentes y el brazo de parada extendido?
  choices:
    A: Cuando viaja en una carretera de dos carriles en una zona rural.
    B: Cuando viaja en la dirección opuesta en una carretera de cuatro carriles.
    C: Cuando se encuentra en un estacionamiento ubicado en una propiedad escolar.
    D: Cuando viaja por una carretera privada.
  answer: B
  explanation: No es obligatorio que un vehículo se detenga ante un autobús escolar
    cuando ambos vehículos están en una carretera de cuatro carriles y el autobús
    está detenido en la dirección opuesta a la que viaja el conductor.
- id: 149
  category: penalties_and_points
  question: ¿Cuál es la multa obligatoria por una condena por rebasar a un autobús
    escolar detenido con las luces intermitentes y el brazo de parada extendido?
  choices:
    A: $150
    B: $250
    C: $300
    D: $500
  answer: C
  explanation: Si es condenado por rebasar a un autobús escolar detenido con las luces
    intermitentes y el brazo de parada extendido, estará sujeto a una multa obligatoria
    de $300 y servicio comunitario.
- id: 150
  category: safe_driving_rules
  question: ¿Cuál es la distancia de parada requerida desde un cruce de ferrocarril
    si hay una señal de alto o una señal eléctrica intermitente?
  choices:
    A: De 5 a 10 pies
    B: De 10 a 20 pies
    C: De 15 a 50 pies
    D: De 50 a 100 pies
  answer: C
  explanation: Al acercarse a un cruce de ferrocarril, debe detenerse a una distancia
    de entre 15 y 50 pies si hay una señal de alto, si la señal eléctrica parpadea
    o si la barrera del cruce está bajada.
- id: 151
  category: defensive_driving
  question: ¿Si su vehículo se apaga en las vías del tren, en qué dirección debe moverse
    después de salir?
  choices:
    A: Directo lejos de las vías
    B: En un ángulo de 45 grados en la dirección del tren
    C: En un ángulo de 45 grados alejándose de la dirección del tren
    D: Paralelo a las vías
  answer: B
  explanation: Si su vehículo se apaga en las vías del tren, salga inmediatamente
    y aléjese de las vías en un ángulo de 45 grados en la dirección del tren para
    mantenerse a salvo de los escombros que salgan despedidos hacia adelante.
- id: 152
  category: vehicle_information
  question: ¿Qué debe hacer un conductor con transmisión manual al cruzar las vías
    del tren?
  choices:
    A: Poner punto muerto (neutral) al cruzar
    B: Cambiar de marcha al cruzar para mantener la velocidad
    C: Reducir la marcha antes de llegar a las vías y no cambiar de marcha al cruzar
    D: Acelerar y subir de marcha al cruzar
  answer: C
  explanation: Si un vehículo tiene transmisión manual, reduzca la marcha antes de
    llegar a las vías. Para evitar que el motor se apague, no cambie de marcha mientras
    cruza la vía.
- id: 153
  category: safe_driving_rules
  question: ¿Qué debe hacer al salir de un callejón o entrada particular en una zona
    urbana antes de entrar en el área de la acera?
  choices:
    A: Tocar la bocina y avanzar lentamente
    B: Detenerse por completo
    C: Ceder el paso solo a los vehículos en la calle
    D: Hacer destellos con los faros
  answer: B
  explanation: En zonas urbanas, debe detenerse por completo al salir de un callejón,
    edificio, camino privado o entrada particular y antes de entrar en el área de
    la acera.
- id: 154
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas delanteras al estacionar cuesta abajo
    en una calle con bordillo (curb)?
  choices:
    A: Girar las ruedas en dirección contraria al bordillo
    B: Girar las ruedas hacia el bordillo
    C: Mantener las ruedas apuntando hacia adelante
    D: Girar las ruedas hacia el centro de la carretera
  answer: B
  explanation: Si estaciona en una calle con bordillo y su vehículo está orientado
    cuesta abajo, gire las ruedas delanteras hacia el bordillo para que su vehículo
    ruede hacia el bordillo.
- id: 155
  category: safe_driving_rules
  question: Al estacionar en paralelo en una calle con tráfico de doble sentido, ¿a
    qué distancia deben estar las ruedas del lado derecho del bordillo?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: B
  explanation: Al estacionar en calles con tráfico de doble sentido, estacione de
    modo que las ruedas del lado derecho estén paralelas y a menos de 12 pulgadas
    del bordillo.
- id: 156
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al área
    rayada en el pavimento junto a un espacio de estacionamiento accesible?
  choices:
    A: Puede usarse para estacionar si tiene un permiso de estacionamiento para personas
      con discapacidad.
    B: Puede usarse para estacionar solo por menos de 15 minutos.
    C: Los vehículos no pueden usar esta área rayada para estacionar bajo ninguna
      circunstancia.
    D: Está reservada solo para vehículos eléctricos.
  answer: C
  explanation: Un área rayada en el pavimento junto a un espacio de estacionamiento
    accesible es parte del espacio reservado. Los vehículos no pueden usar esta área
    rayada para estacionar, incluso si tienen un permiso de estacionamiento para personas
    con discapacidad o placas de matrícula para personas con discapacidad.
- id: 157
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un lugar donde está prohibido detenerse, pararse
    o estacionar?
  choices:
    A: En una calle de un solo sentido
    B: En un carril para bicicletas marcado, con zona de amortiguamiento o protegido
      por barriles
    C: A menos de 50 pies de una entrada particular
    D: En una calle sin bordillo
  answer: B
  explanation: Está prohibido detenerse, pararse o estacionar en un carril para bicicletas
    marcado, con zona de amortiguamiento o protegido por barriles.
- id: 158
  category: sharing_the_road
  question: ¿Con cuánta antelación dará una advertencia un autobús escolar antes de
    una parada en una zona rural?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: C
  explanation: El autobús escolar dará una advertencia al menos 100 pies (200 pies
    en zonas rurales) antes de una parada.
- id: 159
  category: sharing_the_road
  question: ¿Cuáles de los siguientes vehículos están obligados por ley a detenerse
    en casi todos los cruces de ferrocarril?
  choices:
    A: Vehículos que remolcan un tráiler
    B: Vehículos que transportan personas por contrato
    C: Vehículos eléctricos
    D: Motocicletas
  answer: B
  explanation: Los vehículos obligados por ley a detenerse en casi todos los cruces
    de ferrocarril son los vehículos que transportan personas por contrato, los autobuses
    escolares y los vehículos que transportan materiales peligrosos.
- id: 160
  category: safe_driving_rules
  question: ¿A qué distancia debe un conductor estacionar o parar su vehículo de un
    hidrante de incendios?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 30 pies
  answer: B
  explanation: Según el manual, está prohibido parar o estacionar un vehículo a menos
    de 15 pies de un hidrante de incendios.
- id: 161
  category: safe_driving_rules
  question: ¿A cuántos pies de una señal de PARE (STOP), una señal de CEDA EL PASO
    (YIELD) o una señal de control de tráfico es ilegal detenerse o estacionar un
    vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El manual establece que está prohibido detenerse o estacionar un vehículo
    a menos de 30 pies de una señal de PARE, una señal de CEDA EL PASO o una señal
    de control de tráfico.
- id: 162
  category: driver_responsibility
  question: Según la ley de Illinois, ¿es ilegal operar el sistema de sonido de un
    vehículo a un volumen que se pueda escuchar desde qué distancia?
  choices:
    A: 50 pies o más
    B: 75 pies o más
    C: 100 pies o más
    D: 150 pies o más
  answer: B
  explanation: La ley de Illinois establece que no se puede operar ningún sistema
    de sonido a un volumen que se pueda escuchar a 75 pies o más de un vehículo que
    circula por una carretera.
- id: 163
  category: safe_driving_rules
  question: ¿Cómo debe proceder un conductor si está esperando dentro de una intersección
    para girar a la izquierda y el semáforo se pone en rojo?
  choices:
    A: Esperar en la intersección hasta que la luz se ponga verde de nuevo.
    B: Retroceder para salir de la intersección inmediatamente.
    C: Ceder el paso al tráfico que viene en sentido contrario y completar el giro.
    D: Detenerse y esperar a que un oficial de policía dirija el tráfico.
  answer: C
  explanation: Si un conductor está dentro de una intersección esperando para girar
    a la izquierda y la luz del semáforo se pone roja, debe ceder el paso al tráfico
    que viene en sentido contrario y completar el giro.
- id: 164
  category: penalties_and_points
  question: ¿Cuál es la sanción por ser condenado por rebasar ilegalmente un autobús
    escolar detenido?
  choices:
    A: Una suspensión del registro del vehículo.
    B: Una suspensión de los privilegios de conducir.
    C: Una multa de $30.
    D: Una advertencia por la primera infracción.
  answer: B
  explanation: La sanción por ser condenado por rebasar ilegalmente un autobús escolar
    detenido es la suspensión de los privilegios de conducir.
- id: 165
  category: safe_driving_rules
  question: En un distrito comercial o residencial, ¿durante qué distancia se debe
    dar una señal de giro continua antes de realizar un giro a la izquierda o a la
    derecha?
  choices:
    A: No menos de 50 pies
    B: No menos de 75 pies
    C: No menos de 100 pies
    D: No menos de 200 pies
  answer: C
  explanation: Se debe dar una señal de giro continua durante no menos de 100 pies
    antes de girar en un distrito comercial o residencial.
- id: 166
  category: sharing_the_road
  question: ¿Qué deben hacer los conductores al acercarse a una zona de construcción?
  choices:
    A: Aumentar su velocidad para salir del camino rápidamente.
    B: Tocar la bocina varias veces para alertar a los trabajadores.
    C: Encender las luces de emergencia y mantener la velocidad.
    D: Reducir la velocidad, detener todas las comunicaciones por teléfono inalámbrico
      y ceder el paso.
  answer: D
  explanation: Al acercarse a una zona de construcción, los conductores deben reducir
    la velocidad, detener todas las comunicaciones por teléfono inalámbrico y ceder
    el paso.
- id: 167
  category: safe_driving_rules
  question: ¿Cuándo debe un conductor reducir la velocidad en una zona escolar?
  choices:
    A: Los días de clase entre las 6:30 a. m. y las 4 p. m., cuando hay niños presentes
      y hay señales publicadas.
    B: Solo durante los períodos de recreo escolar.
    C: En todo momento, incluidos los fines de semana y días festivos.
    D: Los días de clase entre las 8:00 a. m. y las 3:00 p. m., independientemente
      de las señales.
  answer: A
  explanation: Un conductor debe reducir la velocidad en una zona escolar los días
    de clase entre las 6:30 a. m. y las 4 p. m., cuando hay niños presentes y hay
    señales publicadas.
- id: 168
  category: driver_responsibility
  question: ¿Qué debe hacer un conductor si es detenido por las fuerzas del orden
    y necesita sacar su seguro o registro de la guantera?
  choices:
    A: Alcanzar rápidamente la guantera antes de que el oficial se acerque.
    B: Salir del vehículo para entregar los documentos al oficial.
    C: Informar al oficial de policía antes de intentar alcanzar la guantera.
    D: Esperar a que el oficial abra la puerta del pasajero y revise la guantera.
  answer: C
  explanation: Si los conductores necesitan obtener información sobre el seguro o
    el registro del vehículo de la guantera, deben informar al oficial de policía
    antes de hacerlo.
- id: 169
  category: safe_driving_rules
  question: Cuando se acerca un tren, ¿a cuántos pies del riel más cercano de un cruce
    ferroviario deben detenerse todos los vehículos?
  choices:
    A: Entre 5 y 10 pies
    B: Exactamente 10 pies
    C: Entre 15 y 50 pies
    D: Entre 50 y 100 pies
  answer: C
  explanation: Todos los vehículos deben detenerse entre 15 y 50 pies del riel más
    cercano de un cruce ferroviario cuando se acerca un tren.
- id: 170
  category: sharing_the_road
  question: Si un peatón debe caminar por una calzada con tráfico de doble sentido
    porque no hay acera ni arcén, ¿cómo debe caminar?
  choices:
    A: De espaldas al tráfico que viene en sentido contrario.
    B: De frente al tráfico que viene en sentido contrario.
    C: En el centro de la calzada.
    D: En el lado derecho del carril con el flujo del tráfico.
  answer: B
  explanation: En el tráfico de doble sentido, los peatones que caminan por una calzada
    deben caminar de frente al tráfico que viene en sentido contrario.
- id: 171
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones sobre pedir aventón (hitchhiking)
    es verdadera según la ley de Illinois?
  choices:
    A: Es legal siempre que el peatón permanezca en el acotamiento.
    B: Es ilegal pararse en la calzada para pedir transporte.
    C: Es legal solo durante las horas del día.
    D: Es legal si el peatón usa ropa reflectante.
  answer: B
  explanation: El manual establece explícitamente que pararse en la calzada para pedir
    transporte (hitchhiking) es ilegal.
- id: 172
  category: sharing_the_road
  question: ¿Bajo qué condiciones puede un peatón de 18 años o más patinar en una
    vía pública?
  choices:
    A: Donde el límite de velocidad indicado sea de 45 mph o menos, desde el amanecer
      hasta el atardecer.
    B: Donde el límite de velocidad indicado sea de 55 mph o menos, en cualquier momento
      del día.
    C: Solo en distritos residenciales designados con un límite de velocidad de 20
      mph.
    D: Patinar en vías públicas está estrictamente prohibido para todas las edades.
  answer: A
  explanation: Los peatones de 18 años o más pueden patinar en las vías públicas donde
    el límite de velocidad indicado sea de 45 mph o menos, desde el amanecer hasta
    el atardecer, siempre que no se impida el tráfico vehicular.
- id: 173
  category: safe_driving_rules
  question: Si un conductor debe detener su vehículo en una emergencia en una carretera
    fuera de un distrito comercial o residencial, ¿debe asegurarse de que haya una
    vista despejada del vehículo por al menos cuántos pies en cada dirección?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: En una emergencia, los conductores pueden detener su vehículo y estacionarse
    solo si hay una vista despejada de 200 pies en cada dirección.
- id: 174
  category: safe_driving_rules
  question: ¿Cuál es el límite legal para el número de pasajeros permitidos en los
    asientos delanteros y traseros de un vehículo?
  choices:
    A: Tantos como quepan cómodamente sin obstruir la vista del conductor.
    B: No más personas que el número de cinturones de seguridad disponibles.
    C: Un máximo de tres personas en el asiento delantero y cuatro en el trasero.
    D: No hay límite siempre que el vehículo no esté sobrecargado con carga.
  answer: B
  explanation: La ley de Illinois establece que no debe haber más personas en los
    asientos delanteros y traseros que el número de cinturones de seguridad.
- id: 175
  category: sharing_the_road
  question: ¿Cuál es la situación más común que causa un choque de motocicleta en
    una intersección?
  choices:
    A: Una motocicleta chocando por detrás a un automóvil en una señal de alto.
    B: Un automóvil que viene en sentido contrario girando a la izquierda frente a
      una motocicleta.
    C: Una motocicleta intentando rebasar a un automóvil por la derecha.
    D: Un automóvil girando a la derecha mientras una motocicleta está en su punto
      ciego.
  answer: B
  explanation: El manual establece que más del 50% de todos los choques de motocicletas
    ocurren en las intersecciones, y la situación más común ocurre cuando un automóvil
    que viene en sentido contrario gira a la izquierda frente a una motocicleta.
- id: 176
  category: signs_and_signals
  question: ¿Qué puede hacer un motociclista si un semáforo en rojo no cambia a verde
    después de 120 segundos?
  choices:
    A: Cruzar la intersección después de ceder el paso al tráfico que viene en sentido
      contrario.
    B: Tratar la intersección como una parada de cuatro vías y avanzar de inmediato.
    C: Girar a la derecha en rojo, pero nunca seguir recto.
    D: Bajarse y caminar con la motocicleta a través de la intersección.
  answer: A
  explanation: Si un semáforo en rojo no cambia a verde después de 120 segundos, un
    motociclista puede cruzar la intersección después de ceder el paso al tráfico
    que viene en sentido contrario.
- id: 177
  category: sharing_the_road
  question: ¿Cómo debe manejar un conductor el compartir el carril con una motocicleta?
  choices:
    A: Compartir el carril si la motocicleta se mantiene en el extremo derecho.
    B: Compartir el carril solo en condiciones de tráfico pesado.
    C: Nunca compartir el carril, ya que el motociclista tiene derecho a todo el carril.
    D: Compartir el carril si la superficie de la carretera está seca y despejada.
  answer: C
  explanation: 'El manual establece explícitamente: "Aunque puede haber suficiente
    espacio en el carril de tráfico para un automóvil y un motociclista, recuerde
    que el motociclista necesita el espacio para maniobrar de manera segura y tiene
    derecho a todo el carril. No comparta el carril".'
- id: 178
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento recomendada que un conductor
    debe permitir cuando está detrás de una motocicleta?
  choices:
    A: Uno a dos segundos
    B: Dos a tres segundos
    C: Tres a cuatro segundos
    D: Cinco a seis segundos
  answer: C
  explanation: Los conductores deben permitir al menos tres a cuatro segundos de distancia
    de seguimiento cuando están detrás de una motocicleta para que el motociclista
    tenga suficiente tiempo para maniobrar en una emergencia.
- id: 179
  category: license_system
  question: ¿Cuál de los siguientes es necesario para operar legalmente un autociclo
    (autocycle) en las carreteras de Illinois?
  choices:
    A: Una licencia de motocicleta Clase M
    B: Una licencia de conducir de Illinois válida
    C: Una licencia de conducir comercial (CDL)
    D: Un endoso especial para autociclo
  answer: B
  explanation: Un autociclo es un vehículo de tres ruedas con volante y asientos que
    no requiere ir a horcajadas. El operador debe tener una licencia de conducir de
    Illinois válida para operarlo legalmente.
- id: 180
  category: sharing_the_road
  question: ¿Cuánto espacio de rebase debe dejar un automovilista al pasar a un ciclista?
  choices:
    A: Al menos 1 pie desde el borde del espejo lateral del vehículo.
    B: Al menos 2 pies desde el borde del espejo lateral del vehículo.
    C: Al menos 3 pies desde el borde del espejo lateral del vehículo.
    D: Al menos 5 pies desde el borde del espejo lateral del vehículo.
  answer: C
  explanation: Al rebasar a un ciclista, los automovilistas deben hacerlo lentamente
    y dejar al menos 3 pies de espacio de rebase desde el borde del espejo lateral
    del vehículo.
- id: 181
  category: sharing_the_road
  question: ¿Qué debe hacer un automovilista si va a girar a la derecha y un ciclista
    se aproxima por la derecha?
  choices:
    A: Acelerar y realizar el giro antes de que el ciclista llegue a la intersección.
    B: Tocar la bocina para advertir al ciclista que se detenga y luego realizar el
      giro.
    C: Pasar rozando al ciclista por la izquierda y girar bruscamente.
    D: Dejar que el ciclista pase primero por la intersección antes de realizar el
      giro a la derecha.
  answer: D
  explanation: Si los automovilistas van a girar a la derecha y un ciclista se aproxima
    por la derecha, deben dejar que el ciclista pase primero por la intersección antes
    de realizar el giro a la derecha.
- id: 182
  category: defensive_driving
  question: ¿Por qué un conductor debería considerar usar su mano derecha para abrir
    la puerta del vehículo después de estacionar?
  choices:
    A: Evita que la puerta se abra demasiado hacia el tráfico.
    B: Obliga a que la parte superior del cuerpo del conductor gire y mire hacia atrás
      para ver si vienen ciclistas.
    C: Es un requisito de la ley estatal de Illinois para todos los conductores.
    D: Permite al conductor salir del vehículo más rápidamente.
  answer: B
  explanation: Usar la mano derecha para abrir la puerta del automóvil obligará a
    que la parte superior de su cuerpo gire y mire hacia atrás para ver si vienen
    ciclistas, lo que le brindará una mejor oportunidad de revisar su entorno.
- id: 183
  category: sharing_the_road
  question: ¿Cuál es la edad mínima requerida para operar una bicicleta eléctrica
    de baja velocidad Clase 3?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: Las personas pueden operar una bicicleta eléctrica de baja velocidad
    Clase 3 solo si tienen 16 años de edad o más.
- id: 184
  category: sharing_the_road
  question: ¿Cuál es el número máximo de ciclistas permitidos para circular uno al
    lado del otro en una vía pública estándar?
  choices:
    A: Uno (solo en fila india)
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Los ciclistas pueden circular uno al lado del otro en la calzada siempre
    que no se impida el tráfico. Está prohibido circular más de dos a la par, excepto
    en senderos o partes de las calzadas reservadas para el uso exclusivo de bicicletas.
- id: 185
  category: vehicle_information
  question: ¿Qué se requiere si un ciclomotor o motoneta (scooter) transporta a dos
    personas?
  choices:
    A: Un sidecar acoplado al lado derecho del vehículo.
    B: Un asiento y un reposapiés para el pasajero.
    C: Un motor con al menos 2 caballos de fuerza.
    D: Un permiso especial para pasajeros del DMV.
  answer: B
  explanation: Según el manual, los ciclomotores o motonetas que transporten a dos
    personas deben tener un asiento y un reposapiés para el pasajero.
- id: 186
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando una motocicleta está rebasando su vehículo?
  choices:
    A: Acelerar para evitar que la motocicleta lo rebase.
    B: Moverse hacia el acotamiento para darle más espacio a la motocicleta.
    C: Mantener su posición en el carril y su velocidad.
    D: Frenar bruscamente para dejar que la motocicleta pase rápido.
  answer: C
  explanation: Cuando una motocicleta lo esté rebasando, debe mantener su posición
    en el carril y su velocidad, permitiendo que la motocicleta complete la maniobra.
- id: 187
  category: sharing_the_road
  question: ¿Cuándo se le permite a un vehículo estacionarse o permanecer en ralentí
    (detenido con el motor encendido) en un carril para bicicletas designado?
  choices:
    A: Solo al recoger o dejar pasajeros.
    B: Solo si no hay ciclistas presentes en el carril en ese momento.
    C: Solo durante las horas nocturnas.
    D: Nunca se permite que los vehículos se estacionen o permanezcan en ralentí en
      los carriles para bicicletas designados.
  answer: D
  explanation: No se permite que los vehículos circulen, se estacionen, permanezcan
    en ralentí, ni dejen o recojan pasajeros en los carriles para bicicletas designados,
    incluso si no hay ciclistas presentes.
- id: 188
  category: license_system
  question: ¿Qué tipo de licencia de conducir se requiere para operar una motoneta
    (scooter) con un desplazamiento de motor de 150 cc o superior?
  choices:
    A: Cualquier licencia de conducir válida de Illinois.
    B: Una licencia de motocicleta Clase L.
    C: Una licencia de motocicleta Clase M.
    D: No se requiere licencia.
  answer: C
  explanation: Según el manual, si una motoneta tiene un motor con un desplazamiento
    de 150 cc o superior, se considera una motocicleta y se requiere una licencia
    Clase M.
- id: 189
  category: safe_driving_rules
  question: ¿Qué edad debe tener para operar un monopatín (scooter) eléctrico de baja
    velocidad en las carreteras de Illinois?
  choices:
    A: 15 años de edad o más
    B: 16 años de edad o más
    C: 18 años de edad o más
    D: 21 años de edad o más
  answer: C
  explanation: El manual establece que debe tener 18 años de edad o más para operar
    un monopatín eléctrico de baja velocidad.
- id: 190
  category: sharing_the_road
  question: ¿Por qué siempre debe bajar la intensidad de sus faros (usar luces bajas)
    al seguir a un camión por la noche?
  choices:
    A: Las luces brillantes agotarán la batería de su vehículo más rápido.
    B: Las luces brillantes cegarán a los conductores de vehículos grandes cuando
      se reflejen en los espejos laterales de gran tamaño.
    C: Las luces brillantes dificultan que el tráfico que viene en sentido contrario
      vea al camión.
    D: Las luces brillantes pueden hacer que las luces traseras del camión parezcan
      más tenues.
  answer: B
  explanation: Siempre debe bajar la intensidad de los faros al seguir a un camión
    por la noche porque las luces brillantes cegarán a los conductores de vehículos
    grandes cuando se reflejen en los espejos laterales de gran tamaño.
- id: 191
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al rebasar un camión grande por la noche
    para informar al conductor del camión sobre su intención?
  choices:
    A: Tocar la bocina continuamente hasta completar el rebase.
    B: Encender las luces de emergencia.
    C: Hacer destellos con los faros del vehículo.
    D: Conducir muy cerca de la cabina del camión.
  answer: C
  explanation: El manual aconseja a los conductores hacer destellos con los faros
    del vehículo al rebasar un camión para avisar al conductor del camión, especialmente
    por la noche.
- id: 192
  category: safe_driving_rules
  question: ¿Qué exige la ley de Illinois que haga al acercarse a un vehículo averiado
    que utiliza luces de emergencia en una carretera de cuatro carriles?
  choices:
    A: Detenerse inmediatamente y ofrecer asistencia.
    B: Cambiar de carril alejándose del vehículo averiado si es seguro hacerlo.
    C: Mantener su velocidad y permanecer en su carril actual.
    D: Tocar la bocina para alertar al conductor del vehículo averiado.
  answer: B
  explanation: Al acercarse a cualquier vehículo averiado que utilice luces de emergencia
    en una carretera de cuatro carriles, la ley de Illinois exige que los conductores
    cambien de carril alejándose del vehículo averiado si es seguro hacerlo.
- id: 193
  category: vehicle_information
  question: Al remolcar un vehículo con otro utilizando una barra de tracción, ¿cuál
    es la distancia máxima permitida entre los dos vehículos en la mayoría de los
    casos?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Illinois establece que al remolcar un vehículo con otro,
    la distancia entre los dos vehículos no debe exceder los 15 pies en la mayoría
    de los casos.
- id: 194
  category: penalties_and_points
  question: ¿Después de cuántas horas pueden las autoridades solicitar que un vehículo
    abandonado sea remolcado de una carretera en un área urbana a expensas del propietario?
  choices:
    A: 2 horas
    B: 10 horas
    C: 24 horas
    D: 48 horas
  answer: B
  explanation: Las autoridades pueden solicitar que un vehículo sea remolcado a expensas
    del propietario si se ha dejado a lo largo de una carretera en un área urbana
    después de 10 horas.
- id: 195
  category: safe_driving_rules
  question: 'Los vehículos de baja velocidad pueden circular por cualquier calle con
    un límite de velocidad señalizado de:'
  choices:
    A: 25 mph o menos.
    B: 30 mph o menos.
    C: 35 mph o menos.
    D: 45 mph o menos.
  answer: B
  explanation: Los vehículos de baja velocidad pueden circular por cualquier calle
    con un límite de velocidad señalizado de 30 mph o menos, a menos que lo prohíba
    el municipio local.
- id: 196
  category: sharing_the_road
  question: ¿Cuál es el rango de velocidad normal para los vehículos de movimiento
    lento, como los vehículos agrícolas y los vehículos de tracción animal?
  choices:
    A: 5-20 mph
    B: 15-30 mph
    C: 20-35 mph
    D: 25-40 mph
  answer: A
  explanation: Las velocidades normales para los vehículos de movimiento lento oscilan
    entre 5 y 20 mph.
- id: 197
  category: vehicle_information
  question: Cuando se requieren luces, ¿qué tipo de señal debe montarse lo más alto
    posible en la parte trasera de un vehículo de movimiento lento?
  choices:
    A: Una luz roja fija visible a 100 pies.
    B: Una señal ámbar intermitente visible a 500 pies bajo la luz del sol.
    C: Una luz azul giratoria visible a 300 pies.
    D: Una luz blanca intermitente visible a 1000 pies.
  answer: B
  explanation: Cuando se requieren luces, se debe montar una señal ámbar intermitente
    lo más alto posible en la parte trasera del vehículo, visible a 500 pies bajo
    la luz del sol.
- id: 198
  category: sharing_the_road
  question: ¿Por qué nunca se debe tocar la bocina cuando se está cerca de un jinete
    o de otro tipo de ganado?
  choices:
    A: Es una violación de las ordenanzas locales sobre ruido.
    B: El sonido puede asustar al animal y provocar un choque.
    C: Hará que el jinete pierda su derecho de paso.
    D: Le indica al jinete que se mueva al lado izquierdo de la carretera.
  answer: B
  explanation: Nunca toque la bocina cuando esté cerca de un caballo u otro ganado,
    ya que el sonido puede asustarlo y provocar un choque.
- id: 199
  category: alcohol_drugs_health
  question: En Illinois, ¿es ilegal conducir si su concentración de alcohol en sangre
    (BAC) es igual o superior a qué porcentaje?
  choices:
    A: .04%
    B: .05%
    C: .08%
    D: .10%
  answer: C
  explanation: Es ilegal conducir si su BAC es de .08% o más.
- id: 200
  category: alcohol_drugs_health
  question: ¿Puede ser condenado por conducir bajo la influencia (DUI) si su concentración
    de alcohol en sangre (BAC) es inferior al .08%?
  choices:
    A: No, solo puede ser condenado si su BAC es exactamente .08% o superior.
    B: Sí, pero solo si es menor de 21 años.
    C: Sí, puede ser condenado si su capacidad para conducir se ve afectada.
    D: No, un BAC inferior al .08% se considera legalmente seguro en todas las circunstancias.
  answer: C
  explanation: Usted puede ser condenado por conducir bajo la influencia (DUI) si
    su BAC es inferior al .08% pero su capacidad para conducir se ve afectada.
- id: 201
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de eliminar los efectos
    del alcohol de su organismo?
  choices:
    A: Beber café cargado
    B: Tomar una ducha fría
    C: Comer una comida pesada
    D: El tiempo
  answer: D
  explanation: El tiempo es la única forma de eliminar los efectos del alcohol. La
    comida, el café y las duchas no aceleran el proceso.
- id: 202
  category: license_system
  question: ¿Qué tipo de licencia de conducir se requiere para operar un ciclomotor
    (moped) en las carreteras de Illinois?
  choices:
    A: Una licencia de motocicleta Clase M
    B: Una licencia de motocicleta Clase L
    C: Cualquier licencia de conducir válida de Illinois
    D: Una licencia de conducir comercial (CDL)
  answer: C
  explanation: Un ciclomotor puede operarse con cualquier licencia de conducir válida
    de Illinois, siempre que el motor no exceda los 50cc y no requiera cambios de
    marcha.
- id: 203
  category: alcohol_drugs_health
  question: Según la ley de Illinois, ¿cuál es el límite legal de concentración de
    tetrahidrocannabinol (THC) de cannabis en sangre completa mientras se opera un
    vehículo motorizado?
  choices:
    A: 2 nanogramos o más por mililitro
    B: 5 nanogramos o más por mililitro
    C: 8 nanogramos o más por mililitro
    D: 10 nanogramos o más por mililitro
  answer: B
  explanation: Es ilegal operar un vehículo motorizado en las carreteras de Illinois
    con una concentración de tetrahidrocannabinol (THC) de cannabis de 5 nanogramos
    o más por mililitro de sangre completa.
- id: 204
  category: safe_driving_rules
  question: ¿Cómo debe transportarse el cannabis en un vehículo motorizado?
  choices:
    A: En la guantera o consola central
    B: En un recipiente sellado, a prueba de olores y resistente a los niños
    C: En el maletero o detrás de la última fila de asientos
    D: En una bolsa de plástico transparente colocada en el asiento del pasajero
  answer: B
  explanation: El cannabis solo puede transportarse en un vehículo en un recipiente
    sellado, a prueba de olores y resistente a los niños.
- id: 205
  category: penalties_and_points
  question: ¿Cuánto tiempo permanecerá una infracción por DUI (conducir bajo la influencia)
    en su historial de manejo en Illinois?
  choices:
    A: 5 años
    B: 10 años
    C: 20 años
    D: Permanentemente
  answer: D
  explanation: Si es condenado por DUI, la infracción permanecerá permanentemente
    en su historial de manejo.
- id: 206
  category: driver_responsibility
  question: ¿Qué significa la Ley de Consentimiento Implícito (Implied Consent Law)
    para los conductores en las carreteras de Illinois?
  choices:
    A: Usted consiente automáticamente a someterse a ciertas pruebas para determinar
      si está bajo la influencia.
    B: Usted consiente que su vehículo sea registrado en cualquier parada de tráfico.
    C: Usted acepta pagar todas las multas inmediatamente al recibir una citación.
    D: Usted consiente una suspensión obligatoria de la licencia si se ve involucrado
      en cualquier choque.
  answer: A
  explanation: Al operar en las carreteras de Illinois, usted consiente automáticamente
    a someterse a ciertas pruebas. Estas pueden incluir pruebas de aliento, sangre,
    orina u otras sustancias corporales para determinar si estaba bajo la influencia.
- id: 207
  category: penalties_and_points
  question: Si es la primera vez que comete una infracción y se niega a someterse
    a pruebas químicas, ¿por cuánto tiempo se suspenderán sus privilegios de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 3 años
  answer: C
  explanation: Si se niega a someterse a pruebas químicas, sus privilegios de conducir
    serán suspendidos por un año.
- id: 208
  category: penalties_and_points
  question: Cuando un oficial de policía le retira su licencia de conducir al momento
    de un arresto por DUI, ¿cuántos días le permite conducir el recibo temporal antes
    de que comience la suspensión?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: C
  explanation: Al momento del arresto, el oficial tomará su licencia de conducir y,
    si es válida, le entregará un recibo temporal que le permitirá conducir durante
    45 días. La suspensión sumaria reglamentaria comienza el día 46.
- id: 209
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación por una primera condena por DUI
    en Illinois?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: B
  explanation: Una primera condena por DUI resulta en una revocación mínima de un
    año de los privilegios de conducir.
- id: 210
  category: penalties_and_points
  question: ¿Por cuánto tiempo debe un conductor presentar un Seguro de Responsabilidad
    Financiera (Financial Responsibility Insurance) después de una condena por DUI?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Una condena por DUI también requiere que presente un Seguro de Responsabilidad
    Financiera durante tres años.
- id: 211
  category: vehicle_information
  question: ¿Qué requiere un Permiso de Conducir con Dispositivo de Monitoreo (MDDP)
    que un infractor de DUI por primera vez tenga instalado en su vehículo?
  choices:
    A: Un sistema de rastreo GPS
    B: Un Dispositivo de Interbloqueo de Encendido por Alcohol en el Aliento (BAIID)
    C: Una cámara de tablero
    D: Un limitador de velocidad electrónico
  answer: B
  explanation: Un MDDP requiere que se instale un Dispositivo de Interbloqueo de Encendido
    por Alcohol en el Aliento (BAIID) en su(s) vehículo(s) en un sitio de instalación
    aprobado como condición para obtener un alivio de conducción.
- id: 212
  category: penalties_and_points
  question: ¿Cuál de las siguientes situaciones podría resultar en un cargo de DUI
    Agravado?
  choices:
    A: Recibir un primer DUI con un BAC de .09%.
    B: Cometer un DUI mientras conduce un autobús escolar con niños.
    C: Negarse a una prueba de aliento durante una parada de tráfico de rutina.
    D: Transportar un contenedor abierto de alcohol en el maletero.
  answer: B
  explanation: Se le puede acusar de DUI Agravado si cometió un DUI mientras conducía
    un autobús escolar con niños u operaba un vehículo de alquiler, como una limusina.
- id: 213
  category: safe_driving_rules
  question: ¿En cuál de los siguientes vehículos es legal que los pasajeros consuman
    bebidas alcohólicas?
  choices:
    A: Un automóvil de pasajeros estándar
    B: Una camioneta pickup
    C: Un autobús fletado utilizado para fines no escolares
    D: Un autobús escolar
  answer: C
  explanation: Es ilegal que cualquier persona beba bebidas alcohólicas en un vehículo.
    Los pasajeros en autobuses fletados utilizados para fines no escolares, casas
    rodantes, mini casas rodantes y limusinas están exentos.
- id: 214
  category: driver_responsibility
  question: ¿Qué sanción puede enfrentar el titular de una tarjeta de registro de
    cannabis medicinal si conduce bajo los efectos del cannabis?
  choices:
    A: Una sentencia de cárcel obligatoria de 30 días
    B: Revocación de su tarjeta de cannabis medicinal por dos años
    C: Confiscación de su vehículo
    D: Una prohibición permanente del programa de cannabis medicinal
  answer: B
  explanation: Conducir bajo los efectos del uso de cannabis... puede resultar en
    la pérdida de los privilegios de conducir y, para el titular de una tarjeta de
    registro de cannabis medicinal, la revocación de la tarjeta de cannabis medicinal
    del conductor por dos años.
- id: 215
  category: driver_responsibility
  question: ¿Cuáles son las posibles consecuencias para un padre o tutor legal que
    permite que personas menores de 21 años consuman alcohol en su propiedad privada
    si ocurre una muerte o lesiones personales?
  choices:
    A: Pueden enfrentar sanciones penales.
    B: Recibirán una citación de advertencia.
    C: Deben asistir a una clase de paternidad obligatoria.
    D: Se les confiscará su propiedad.
  answer: A
  explanation: Si ocurre una muerte o lesiones personales como resultado del consumo,
    el padre o tutor legal puede enfrentar sanciones penales.
- id: 216
  category: alcohol_drugs_health
  question: 'Si se descubre que un conductor menor de 21 años tiene algún rastro de
    alcohol en su sistema mientras opera un vehículo motorizado, sus privilegios de
    conducir serán suspendidos por un mínimo de:'
  choices:
    A: Un mes
    B: Tres meses
    C: Seis meses
    D: Un año
  answer: B
  explanation: Si es menor de 21 años y se descubre que tiene algún rastro de alcohol
    en su sistema mientras opera un vehículo motorizado, se le suspenderán sus privilegios
    de conducir por un mínimo de tres meses.
- id: 217
  category: penalties_and_points
  question: ¿Cuál es la sanción mínima para un conductor menor de 21 años que recibe
    su primera condena por un DUI?
  choices:
    A: Revocación de los privilegios de conducir por un mínimo de dos años
    B: Suspensión de los privilegios de conducir por seis meses
    C: Una multa de $500 y 30 días de cárcel
    D: Revocación de los privilegios de conducir por un mínimo de un año
  answer: A
  explanation: Si es menor de 21 años y es condenado por DUI, enfrenta la revocación
    de sus privilegios de conducir por un mínimo de dos años por una primera condena.
- id: 218
  category: driver_responsibility
  question: Si la licencia de un conductor fue suspendida antes de cumplir los 21
    años, ¿qué se le requiere completar con éxito antes de que pueda ser reemitida?
  choices:
    A: Un programa de servicio comunitario de 50 horas
    B: Un curso de educación correctiva para conductores
    C: Un curso avanzado de conducción defensiva
    D: Un programa de rehabilitación por abuso de sustancias
  answer: B
  explanation: Si su licencia de conducir fue suspendida antes de los 21 años, se
    le requerirá completar con éxito un curso de educación correctiva para conductores.
- id: 219
  category: safe_driving_rules
  question: Independientemente de la culpa, el conductor debe presentar un informe
    de accidente si el choque involucra daños a la propiedad de más de qué cantidad
    (asumiendo que todos los vehículos están asegurados)?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: C
  explanation: El conductor de un vehículo debe presentar un informe de accidente
    si el choque involucra muerte, lesiones corporales o daños a la propiedad de más
    de $1,500.
- id: 220
  category: safe_driving_rules
  question: 'Si algún vehículo involucrado en un choque no está asegurado, se debe
    presentar un informe de accidente si el daño a la propiedad es de más de:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: Si algún vehículo involucrado en el choque no está asegurado, se debe
    presentar un informe si el daño a la propiedad es de $500 o más.
- id: 221
  category: driver_responsibility
  question: ¿Cuánto tiempo tiene un conductor para reportar un choque después de que
    ocurre?
  choices:
    A: 30 minutos
    B: 1 hora
    C: 12 horas
    D: 24 horas
  answer: A
  explanation: Un conductor tiene 30 minutos para reportar un choque después de que
    ocurre. Si los conductores se ven involucrados en un choque, deben notificar a
    la policía de inmediato.
- id: 222
  category: penalties_and_points
  question: ¿Cuál es la posible sanción para un conductor que no reporta un choque
    de vehículos?
  choices:
    A: Una multa de hasta $500 y 30 días de cárcel
    B: Una multa de hasta $1,000 y 6 meses de cárcel
    C: Una multa de hasta $2,500 y una sentencia de cárcel de hasta un año
    D: Una multa de hasta $5,000 y una sentencia de cárcel de hasta dos años
  answer: C
  explanation: Los conductores que no reporten un choque de vehículos pueden ser multados
    con hasta $2,500 y recibir una sentencia de cárcel de hasta un año.
- id: 223
  category: safe_driving_rules
  question: Si usted se ve involucrado en un choque que causa daños a un vehículo
    desatendido y no se puede encontrar al propietario, ¿qué información debe dejar
    en el vehículo?
  choices:
    A: Su nombre, dirección, número de teléfono y número de placa
    B: Su número de licencia de conducir y número de póliza de seguro
    C: Su nombre, compañía de seguros y número de identificación del vehículo (VIN)
    D: Solo su número de teléfono y primer nombre
  answer: A
  explanation: Si usted se ve involucrado en un choque que causa daños a un vehículo
    desatendido... Deje su nombre, dirección, número de teléfono y número de placa
    en el vehículo o propiedad si no se puede encontrar al propietario.
- id: 224
  category: penalties_and_points
  question: ¿Qué medida tomará la oficina del Secretario de Estado si un conductor
    es declarado culpable de abandonar la escena de un choque donde ha ocurrido una
    muerte o lesiones personales?
  choices:
    A: Suspender la licencia de conducir por 6 meses
    B: Revocar la licencia de conducir de la persona
    C: Requerir que el conductor vuelva a tomar el examen de conducir
    D: Emitir una advertencia y una multa de $1,000
  answer: B
  explanation: En los casos en que haya ocurrido una muerte o lesiones personales,
    la oficina del Secretario de Estado está obligada a revocar la licencia de conducir
    de la persona.
- id: 225
  category: driver_responsibility
  question: Si usted es menor de 18 años y se le requiere comparecer ante el tribunal
    por una multa de tráfico, ¿quién debe estar presente con usted?
  choices:
    A: Un conductor con licencia de 21 años o más
    B: Un instructor de educación vial
    C: Un padre o tutor legal
    D: Un abogado
  answer: C
  explanation: Si usted es menor de 18 años y se le requiere comparecer ante el tribunal,
    debe contar con la presencia de un padre o tutor legal en la comparecencia judicial.
- id: 226
  category: penalties_and_points
  question: Bajo la Ley de Responsabilidad de Seguridad (Safety Responsibility Law),
    si usted es culpable en un choque que resulta en lesiones o daños a la propiedad
    y no tiene seguro de responsabilidad civil, ¿qué debe hacer?
  choices:
    A: Entregar su vehículo al estado
    B: Depositar una fianza (security) para cubrir los daños sufridos por la parte
      perjudicada
    C: Completar 100 horas de servicio comunitario
    D: Pagar una multa obligatoria de $5,000 al Secretario de Estado
  answer: B
  explanation: La Ley de Responsabilidad de Seguridad requiere que usted deposite
    una fianza (una garantía de pago) para cubrir los daños sufridos por la parte
    perjudicada si usted es culpable en un choque y no tiene seguro de responsabilidad
    civil.
- id: 227
  category: penalties_and_points
  question: 'Las personas condenadas por infracciones de seguro obligatorio perderán
    sus privilegios de conducir por un mínimo de:'
  choices:
    A: Un mes
    B: Tres meses
    C: Seis meses
    D: Un año
  answer: B
  explanation: Las personas condenadas por infracciones de seguro obligatorio perderán
    sus privilegios de conducir por un mínimo de tres meses y se les requerirá pagar
    una tarifa de restablecimiento de $100.
- id: 228
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma aceptable de prueba de responsabilidad
    financiera?
  choices:
    A: Una promesa por escrito de pagar daños futuros
    B: Un certificado de seguro (SR-22)
    C: Una tarjeta de registro de vehículo válida
    D: Una carta notariada de un empleador
  answer: B
  explanation: La prueba de responsabilidad financiera puede incluir un certificado
    de seguro (SR-22), una fianza o un depósito de valores.
- id: 229
  category: safe_driving_rules
  question: 'Los conductores de 55 años o más pueden recibir una reducción en su seguro
    de responsabilidad civil de vehículos motorizados si completan con éxito:'
  choices:
    A: Un seminario de seguridad vial de cuatro horas
    B: Un curso de conducción defensiva de ocho horas
    C: Un examen escrito de licencia de conducir
    D: Un examen de la vista y el oído
  answer: B
  explanation: Si tiene 55 años o más, puede recibir una reducción en su seguro de
    responsabilidad civil de vehículos motorizados si completa con éxito un curso
    de conducción defensiva de ocho horas.
- id: 230
  category: alcohol_drugs_health
  question: ¿Cuáles son las posibles sanciones por proporcionar alcohol a una persona
    menor de 21 años?
  choices:
    A: Una advertencia y una clase de educación obligatoria
    B: Una multa, sentencia de cárcel y suspensión de los privilegios de conducir
    C: Revocación del registro del vehículo únicamente
    D: Una multa de $100 y servicio comunitario
  answer: B
  explanation: Si es declarado culpable de proporcionar alcohol a una persona menor
    de 21 años, puede ser multado, sentenciado a la cárcel y se le pueden suspender
    sus privilegios de conducir.
- id: 231
  category: penalties_and_points
  question: ¿Cuál es la definición de la revocación de una licencia de conducir?
  choices:
    A: La pérdida temporal de los privilegios de conducir por un período de tiempo
      específico
    B: El retiro indefinido de los privilegios de conducir por parte de la oficina
      de la Secretaría de Estado
    C: La terminación de los privilegios de conducir debido a un error o defecto
    D: Una advertencia obligatoria emitida por una primera infracción de tránsito
  answer: B
  explanation: El manual define una revocación como el retiro indefinido de los privilegios
    de conducir por parte de la oficina de la Secretaría de Estado.
- id: 232
  category: penalties_and_points
  question: Después de que se revoca una licencia de conducir, ¿cuál es el tiempo
    mínimo que un conductor generalmente debe esperar antes de ser elegible para volver
    a solicitar una licencia?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Cinco años
  answer: B
  explanation: Para recuperar los privilegios de conducir después de una revocación,
    usted puede ser elegible para volver a solicitar una licencia después de un mínimo
    de un año, a menos que se indique lo contrario.
- id: 233
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la revocación inmediata
    de los privilegios de conducir de una persona?
  choices:
    A: Una infracción de tránsito en movimiento que causó un choque resultando en
      la muerte de otra persona
    B: Recibir dos infracciones de tránsito en un período de 12 meses
    C: Estacionarse en un espacio designado para personas con discapacidades
    D: No pagar tres infracciones de tránsito automatizadas
  answer: A
  explanation: La Secretaría de Estado revocará inmediatamente los privilegios de
    conducir de cualquier persona que sea condenada por una infracción de tránsito
    en movimiento que haya causado un choque y haya resultado en la muerte de otra
    persona.
- id: 234
  category: penalties_and_points
  question: ¿Qué debe hacer un conductor para recuperar sus privilegios de conducir
    después de que haya terminado un período de suspensión?
  choices:
    A: Volver a tomar los exámenes escrito y de conducir
    B: Pagar una tarifa de restablecimiento
    C: Completar un curso de conducción defensiva de ocho horas
    D: Entregar el registro de su vehículo
  answer: B
  explanation: Cuando una suspensión es por un período de tiempo específico, usted
    puede recuperar sus privilegios de conducir después de que la suspensión haya
    terminado y haya pagado una tarifa de restablecimiento.
- id: 235
  category: alcohol_drugs_health
  question: ¿Se puede suspender una licencia de conducir si las pruebas químicas tras
    un arresto por DUI (conducir bajo la influencia) revelan un nivel de THC de al
    menos cuántos nanogramos por mililitro de sangre completa?
  choices:
    A: 2 nanogramos
    B: 5 nanogramos
    C: 8 nanogramos
    D: 10 nanogramos
  answer: B
  explanation: Puede ocurrir una suspensión por fallar una prueba de drogas/alcohol
    que revele un nivel de THC de 5 nanogramos o más por mililitro de sangre completa.
- id: 236
  category: penalties_and_points
  question: Para un conductor menor de 21 años, ¿cuántas condenas por infracciones
    de tránsito en un período de 24 meses resultarán en la suspensión de la licencia
    de conducir?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: A
  explanation: Si usted es menor de 21 años al momento del arresto, dos infracciones
    de tránsito en cualquier período de 24 meses resultarán en una suspensión.
- id: 237
  category: penalties_and_points
  question: Para un conductor de 21 años o más, ¿puede ocurrir una suspensión de la
    licencia de conducir al recibir cuántas condenas por infracciones de tránsito
    durante un período de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Para conductores de 21 años o más, puede ocurrir una suspensión por
    tres condenas por infracciones de tránsito durante un período de 12 meses.
- id: 238
  category: alcohol_drugs_health
  question: ¿Qué constituye una infracción de Tolerancia Cero para una persona menor
    de 21 años?
  choices:
    A: Tener una concentración de alcohol de exactamente 0.08
    B: Tener una concentración de alcohol superior a 0.00 pero inferior a 0.08
    C: Negarse a realizar una prueba química
    D: Transportar alcohol ilegalmente en un vehículo
  answer: B
  explanation: Una infracción de Tolerancia Cero se define como tener una concentración
    de alcohol superior a 0.00, pero inferior a 0.08, por parte de una persona menor
    de 21 años.
- id: 239
  category: license_system
  question: ¿Qué acción implica la terminación de los privilegios de conducir debido
    a un error o defecto en la licencia?
  choices:
    A: Revocación
    B: Suspensión
    C: Cancelación
    D: Denegación
  answer: C
  explanation: La cancelación es la terminación de los privilegios de conducir mediante
    una acción formal. Ocurrirá debido a un error o defecto en la licencia o porque
    el titular ya no tiene derecho a la licencia.
- id: 240
  category: alcohol_drugs_health
  question: A un conductor de 21 años o más se le puede suspender la licencia por
    el transporte ilegal de alcohol si es condenado por la infracción ¿cuántas veces
    en un período de 12 meses?
  choices:
    A: Una vez
    B: Dos veces
    C: Tres veces
    D: Cuatro veces
  answer: B
  explanation: Puede ocurrir una suspensión por el transporte ilegal de alcohol dos
    veces en 12 meses si el conductor tiene 21 años o más.
- id: 241
  category: penalties_and_points
  question: ¿Se puede suspender la licencia de conducir por una segunda infracción
    de exceso de velocidad en una zona de construcción cuando hay trabajadores presentes
    si ocurre dentro de qué plazo respecto a la infracción anterior?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Tres años
  answer: C
  explanation: Se puede producir una suspensión por una segunda infracción dentro
    de los dos años posteriores a la infracción anterior por exceso de velocidad en
    una zona de construcción cuando hay trabajadores presentes.
- id: 242
  category: penalties_and_points
  question: ¿Cuántas infracciones de tráfico automatizadas no pagadas por pasarse
    un semáforo en rojo o por exceso de velocidad pueden provocar la suspensión de
    la licencia de conducir?
  choices:
    A: Dos o más
    B: Tres o más
    C: Cuatro o más
    D: Cinco o más
  answer: D
  explanation: El hecho de no pagar cinco o más infracciones de tráfico automatizadas
    por violar una señal de semáforo en rojo o por exceso de velocidad en un municipio
    puede dar lugar a una suspensión.
- id: 243
  category: penalties_and_points
  question: ¿Se puede revocar la licencia de conducir por conducción temeraria si
    el conductor es condenado por cuántas infracciones de conducción temeraria en
    un plazo de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Se puede producir una revocación por una condena de tres infracciones
    de conducción temeraria en 12 meses.
- id: 244
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de conducir mientras su licencia de
    conducir está suspendida o revocada?
  choices:
    A: El periodo de suspensión o revocación se reducirá
    B: Se le exigirá que realice un curso de conducción defensiva de ocho horas
    C: El periodo de suspensión o revocación se ampliará y podría enfrentarse a penas
      de cárcel
    D: Su vehículo será confiscado permanentemente
  answer: C
  explanation: Conducir mientras la licencia de conducir está suspendida o revocada
    resultará en una extensión del periodo de suspensión o revocación y puede someter
    al conductor a un periodo de encarcelamiento.
- id: 245
  category: license_system
  question: ¿Cuál de las siguientes es una razón por la que se puede cancelar una
    licencia de conducir en Illinois?
  choices:
    A: No pagar una multa de estacionamiento.
    B: No estar en condiciones médicas o visuales para operar un vehículo motorizado
      de manera segura.
    C: Recibir una multa por exceso de velocidad.
    D: Conducir sin seguro.
  answer: B
  explanation: Según el manual, una licencia de conducir puede ser cancelada por condiciones
    médicas, incluyendo el no estar en condiciones médicas o visuales para operar
    un vehículo motorizado de manera segura.
- id: 246
  category: penalties_and_points
  question: Si una persona menor de 18 años es condenada por una infracción de tráfico
    grave, ¿cuánto tiempo dura la denegación de su solicitud de licencia de conducir?
  choices:
    A: 6 meses o hasta que cumpla 21 años.
    B: 9 meses o hasta que cumpla 18 años, lo que sea más corto.
    C: 12 meses.
    D: Hasta que cumpla 21 años.
  answer: B
  explanation: La denegación por una infracción de tráfico grave para una persona
    menor de 18 años dura nueve meses o hasta que la persona cumpla 18 años, lo que
    sea más corto.
- id: 247
  category: penalties_and_points
  question: ¿Puede la Secretaría de Estado (Secretary of State) negar la emisión o
    renovación de una licencia de conducir si un conductor es acusado de una infracción
    debido a un choque que resultó en lesiones graves o la muerte, incluso si no hubo
    alcohol involucrado?
  choices:
    A: Sí, el alcohol no necesita ser un factor en el choque.
    B: No, el alcohol debe ser un factor para que ocurra una denegación.
    C: Sí, pero solo si el conductor es menor de 18 años.
    D: No, se requiere una condena antes de que se pueda emitir una denegación.
  answer: A
  explanation: La oficina de la Secretaría de Estado puede negar la emisión o renovación
    de una licencia de conducir si se le acusa de una infracción debido a un choque
    que resultó en lesiones graves o la muerte, y el alcohol no tiene por qué ser
    un factor.
- id: 248
  category: license_system
  question: ¿Cuál es la edad mínima para que se le otorgue un Permiso de Conducir
    Restringido (RDP)?
  choices:
    A: '15'
    B: '16'
    C: '18'
    D: '21'
  answer: B
  explanation: El manual establece que no se puede emitir un Permiso de Conducir Restringido
    (RDP) a una persona menor de 16 años.
- id: 249
  category: license_system
  question: ¿Quién es elegible para un Permiso de Conducir Ocupacional (ODP)?
  choices:
    A: Cualquier conductor suspendido por un DUI
    B: Un conductor comercial suspendido por tres infracciones de tráfico
    C: Un conductor profesional cuya licencia está suspendida por tres infracciones
      de tráfico, siempre que conduzca para ganarse la vida
    D: Un conductor menor de 18 años suspendido por una infracción de tráfico grave
  answer: C
  explanation: Un ODP permite a un conductor profesional cuya licencia ha sido suspendida
    por tres infracciones de tráfico operar un vehículo en relación con su empleo.
    No se aplica a los conductores comerciales.
- id: 250
  category: penalties_and_points
  question: ¿Se emite un Permiso de Conducir por Responsabilidad Financiera Familiar
    (FRP) a un conductor cuya licencia fue suspendida por cuál de las siguientes razones?
  choices:
    A: Falta de pago de la manutención de los hijos
    B: Conducir bajo la influencia
    C: Tres infracciones de tráfico en 12 meses
    D: Huir de la escena de un choque
  answer: A
  explanation: Un FRP permite que un conductor cuya licencia fue suspendida por falta
    de pago de la manutención de los hijos o por abuso de visitas a los hijos opere
    un vehículo.
- id: 251
  category: signs_and_signals
  question: ¿Si se aproxima a una intersección con una señal de PARE (STOP) roja de
    ocho lados pero no hay línea de parada ni cruce peatonal, dónde debe detenerse?
  choices:
    A: Diez pies antes de la intersección
    B: Antes de entrar en la intersección
    C: Al lado de la señal de pare
    D: No necesita detenerse si la intersección está despejada
  answer: B
  explanation: 'El manual establece para una señal de PARE (STOP): "Si no hay línea
    de parada, deténgase antes de entrar al cruce peatonal. Si no hay cruce peatonal,
    deténgase antes de entrar en la intersección".'
- id: 252
  category: signs_and_signals
  question: ¿Qué forma tiene la señal de advertencia avanzada para un cruce de ferrocarril?
  choices:
    A: De ocho lados
    B: De tres lados
    C: Redonda
    D: En forma de diamante
  answer: C
  explanation: Una señal redonda indica un CRUCE DE FERROCARRIL más adelante. Es una
    señal de advertencia avanzada que significa que una vía de ferrocarril cruzará
    la calzada más adelante.
- id: 253
  category: signs_and_signals
  question: ¿Qué indica una señal de cinco lados de color amarillo o amarillo-verde
    con símbolos negros?
  choices:
    A: Zona de no adelantar
    B: Cruce de ferrocarril
    C: Zona escolar o cruce escolar
    D: Ceder el paso
  answer: C
  explanation: Una señal de cinco lados es amarilla o amarillo-verde con símbolos
    negros y significa ZONA ESCOLAR o CRUCE ESCOLAR.
- id: 254
  category: signs_and_signals
  question: ¿Dónde aparecerá una señal amarilla de tres lados que indica una ZONA
    DE NO ADELANTAR (NO PASSING ZONE)?
  choices:
    A: En el lado derecho de una carretera de varios carriles
    B: En el lado izquierdo de una calzada de dos carriles y dos sentidos
    C: Suspendida sobre el centro de la intersección
    D: En el lado derecho de una calle de sentido único
  answer: B
  explanation: La señal de ZONA DE NO ADELANTAR (NO PASSING ZONE) aparecerá en el
    lado izquierdo de una calzada de dos carriles y dos sentidos al comienzo del área
    donde también se utilizan marcas en el pavimento de "no adelantar".
- id: 255
  category: signs_and_signals
  question: ¿Qué tipo de señales de advertencia suelen ser de color NARANJA?
  choices:
    A: Cruces de peatones y bicicletas
    B: Paradas de autobús escolar
    C: Zonas de construcción o mantenimiento
    D: Señales de guía para próximos destinos
  answer: C
  explanation: El NARANJA se utiliza para señales de advertencia, que generalmente
    se encuentran en zonas de construcción o mantenimiento a lo largo de calles y
    carreteras.
- id: 256
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales viales VERDES?
  choices:
    A: Advertir sobre las condiciones de la carretera y los peligros futuros
    B: Indicar reglas reglamentarias que deben obedecerse
    C: Alertar a los conductores sobre zonas escolares
    D: Decirle dónde se encuentra, qué camino tomar y la distancia a los próximos
      destinos
  answer: D
  explanation: El VERDE se utiliza para las señales de guía. Estas señales le indican
    dónde se encuentra, qué camino tomar y la distancia a los próximos destinos.
- id: 257
  category: license_system
  question: Una Licencia Probatoria permite a un conductor operar un vehículo durante
    un período de suspensión. ¿Cuál es el requisito de edad mínima para esta licencia?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: C
  explanation: Una Licencia Probatoria permite a un conductor de 21 años o más, cuya
    licencia haya sido suspendida por tres infracciones de movimiento en un período
    de 12 meses, operar un vehículo durante el período de suspensión.
- id: 258
  category: signs_and_signals
  question: ¿Las señales AMARILLO-VERDE se utilizan para alertar a los conductores
    sobre cuál de los siguientes?
  choices:
    A: Proyectos de construcción y mantenimiento
    B: Cruces de peatones y bicicletas, áreas de juego y zonas escolares
    C: Advertencias de contramano o no entrar
    D: Distancias a próximos destinos
  answer: B
  explanation: El AMARILLO-VERDE se puede utilizar para señales de advertencia que
    le alertan sobre cruces de peatones y bicicletas, áreas de juego, paradas de autobús
    escolar y zonas escolares.
- id: 259
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de guía que le informan sobre los
    servicios a lo largo de la carretera?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Rosado
  answer: B
  explanation: Según el manual, el AZUL se utiliza para las señales de guía que le
    informan sobre los servicios a lo largo de la carretera.
- id: 260
  category: signs_and_signals
  question: ¿Qué color de señal se utiliza para alertar a los conductores sobre posibles
    peligros más adelante debido a incidentes de tráfico no planificados, como choques
    de tráfico?
  choices:
    A: Naranja
    B: Marrón
    C: Rosado
    D: Amarillo
  answer: C
  explanation: El ROSADO puede usarse para la señalización de incidentes de tráfico
    para alertarle sobre posibles peligros más adelante debido a incidentes de tráfico
    no planificados, como choques de tráfico y desastres naturales.
- id: 261
  category: safe_driving_rules
  question: ¿Al acercarse a una intersección con una señal de alto en todas las direcciones
    (All-Way Stop), cómo se determina el derecho de paso?
  choices:
    A: El vehículo a la derecha siempre pasa primero.
    B: El primer conductor en detenerse es el primero en pasar.
    C: El vehículo más grande tiene el derecho de paso.
    D: Los vehículos que giran a la izquierda deben pasar primero.
  answer: B
  explanation: En un alto en todas las direcciones, el tráfico de todas las direcciones
    debe detenerse. El primer conductor en detenerse es el primero en pasar, y los
    demás conductores deben esperar su turno.
- id: 262
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias es legal conducir más lento que el límite de
    velocidad mínimo señalizado en una carretera de acceso controlado?
  choices:
    A: Al conducir en el carril del extremo derecho.
    B: Cuando sea necesario por seguridad.
    C: Al conducir un vehículo comercial.
    D: Nunca es legal conducir por debajo del límite de velocidad mínimo.
  answer: B
  explanation: Conducir más lento que el límite de velocidad mínimo es ilegal a menos
    que sea necesario por seguridad.
- id: 263
  category: safe_driving_rules
  question: ¿A quién se le permite usar las aberturas en una carretera dividida donde
    hay señales de "Prohibido dar vuelta en U" (No U-Turn)?
  choices:
    A: Cualquier vehículo que realice un giro en U durante las horas del día.
    B: Solo vehículos de pasajeros.
    C: Vehículos autorizados como patrullas de policía, ambulancias y quitanieves.
    D: Vehículos que se pasaron su salida.
  answer: C
  explanation: Las aberturas en una carretera dividida son solo para vehículos autorizados,
    como patrullas de policía, ambulancias, quitanieves, equipo de construcción/mantenimiento
    y otros vehículos de emergencia.
- id: 264
  category: sharing_the_road
  question: ¿De qué color se pintan a veces los carriles para bicicletas para aumentar
    la visibilidad?
  choices:
    A: Rojo brillante
    B: Verde brillante
    C: Amarillo fluorescente
    D: Naranja sólido
  answer: B
  explanation: Los carriles para bicicletas a veces se pintan de un color verde brillante
    para aumentar la visibilidad.
- id: 265
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto al uso de teléfonos inalámbricos o celulares
    mientras se conduce en una zona escolar con límite de velocidad señalizado?
  choices:
    A: Se permite si se utiliza un dispositivo de manos libres.
    B: Está prohibido.
    C: Se permite solo cuando no hay niños visibles.
    D: Se permite solo para hacer llamadas telefónicas rápidas.
  answer: B
  explanation: El uso de teléfonos inalámbricos o celulares está prohibido mientras
    se conduce en una zona escolar con límite de velocidad señalizado.
- id: 266
  category: safe_driving_rules
  question: ¿Cuáles son las horas habituales en las que se aplica el límite de velocidad
    de una zona escolar señalizada en los días de clase cuando hay niños presentes?
  choices:
    A: De 7:00 a.m. a 3:00 p.m.
    B: De 8:00 a.m. a 5:00 p.m.
    C: De 6:30 a.m. a 4:00 p.m.
    D: De 7:30 a.m. a 4:30 p.m.
  answer: C
  explanation: La velocidad señalizada se aplica solo en los días escolares cuando
    hay niños presentes, y el horario escolar habitual es de 6:30 a.m. a 4 p.m.
- id: 267
  category: safe_driving_rules
  question: ¿Cómo deben actuar los conductores ante una reducción de carriles durante
    momentos de gran congestión de tráfico?
  choices:
    A: Incorporarse al carril abierto lo antes posible.
    B: Detenerse y esperar un hueco en el tráfico.
    C: Usar ambos carriles para avanzar hasta el punto de reducción de carril e incorporarse
      alternando turnos.
    D: Conducir por el acotamiento para evitar la congestión.
  answer: C
  explanation: Durante momentos de congestión, se recomienda utilizar ambos carriles
    para avanzar hasta el punto de reducción de carril e incorporarse en ese lugar,
    alternando turnos (conocido como "incorporación en cremallera" o "zipper merge").
- id: 268
  category: signs_and_signals
  question: Una señal de "Puente Estrecho" (Narrow Bridge) advierte que el ancho del
    puente al que se aproxima es, por lo general, ¿cuánto menor que el ancho del pavimento
    de acceso?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 4 pies
  answer: B
  explanation: El ancho de un puente es generalmente 2 pies menor que el ancho del
    pavimento de acceso.
- id: 269
  category: signs_and_signals
  question: Aunque la mayoría de las señales de advertencia son amarillas, ¿qué color
    pueden usar algunas comunidades para las señales de peatones, bicicletas y escuelas?
  choices:
    A: Amarillo-verde fluorescente
    B: Naranja brillante
    C: Rosa neón
    D: Blanco reflectante
  answer: A
  explanation: Aunque la mayoría de las señales de advertencia son amarillas, algunas
    comunidades pueden utilizar señales de peatones, bicicletas y escuelas de color
    amarillo-verde fluorescente.
- id: 270
  category: signs_and_signals
  question: ¿Qué indica a un conductor una señal de "Rebase con Cuidado" (Pass with
    Care)?
  choices:
    A: Está entrando en una zona escolar.
    B: Ha llegado al final de una zona de no rebasar.
    C: Debe rebasar a todos los vehículos más lentos inmediatamente.
    D: Se está acercando a un puente estrecho.
  answer: B
  explanation: La señal de "Rebase con Cuidado" le informa que ha llegado al final
    de la zona de no rebasar y que ahora puede rebasar solo cuando sea seguro.
- id: 271
  category: signs_and_signals
  question: ¿Dónde aparecerá una señal amarilla de tres lados de "Zona de No Rebasar"
    (No Passing Zone) en una carretera de dos carriles y dos sentidos?
  choices:
    A: En el lado derecho de la carretera.
    B: Suspendida sobre el centro de la carretera.
    C: En el lado izquierdo de la carretera.
    D: En el acotamiento del carril derecho.
  answer: C
  explanation: La señal amarilla de tres lados de "Zona de No Rebasar" aparecerá en
    el lado izquierdo de una carretera de dos carriles y dos sentidos al comienzo
    del área donde también se utilizan marcas en el pavimento de "no rebasar".
- id: 272
  category: signs_and_signals
  question: ¿Por qué se utilizan a menudo señales de advertencia anticipada como "Pare
    Adelante" (Stop Ahead) o "Semáforo Adelante" (Signal Ahead) en zonas de alta velocidad?
  choices:
    A: Porque las zonas de alta velocidad tienen más peatones.
    B: Debido a la mayor distancia necesaria para reducir la velocidad o detenerse.
    C: Para advertir a los conductores sobre próximas casetas de cobro.
    D: Para indicar que el límite de velocidad está a punto de aumentar.
  answer: B
  explanation: Las señales de advertencia anticipada se utilizan en zonas de alta
    velocidad debido a la mayor distancia necesaria para reducir la velocidad o detenerse.
- id: 273
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento recomendado conocido como "incorporación en
    cremallera" (zipper merge) durante periodos de congestión?
  choices:
    A: Incorporarse inmediatamente tan pronto como vea una señal de carril cerrado
      adelante.
    B: Usar ambos carriles para avanzar hasta el punto de reducción de carril e incorporarse
      alternando turnos.
    C: Conducir por el acotamiento para evitar la congestión del tráfico e incorporarse
      al frente.
    D: Detenerse en el carril abierto para dejar que todo el tráfico que se incorpora
      pase primero.
  answer: B
  explanation: Durante periodos de congestión, se aconseja utilizar ambos carriles
    para avanzar hasta el punto de reducción de carril e incorporarse en ese lugar,
    alternando turnos. Esto se conoce como "incorporación en cremallera" (zipper merge).
- id: 274
  category: signs_and_signals
  question: ¿Dónde se coloca normalmente una señal de "No Rebasar" (No Passing) en
    una carretera de dos carriles y dos sentidos?
  choices:
    A: En el lado derecho de la carretera al final de una zona para rebasar.
    B: En la mediana central de una carretera dividida.
    C: En el lado izquierdo de la carretera al comienzo de una zona de no rebasar.
    D: Suspendida directamente sobre el centro de la carretera.
  answer: C
  explanation: El manual establece que la señal de "No Rebasar" se coloca en el lado
    izquierdo de la carretera al comienzo de una zona de no rebasar en carreteras
    de dos carriles y dos sentidos.
- id: 275
  category: sharing_the_road
  question: Cuando un conductor en una autopista se aproxima a una señal de incorporación
    justo antes de una rampa de la autopista, ¿qué debe hacer?
  choices:
    A: Acelerar para pasar rápidamente al vehículo que se incorpora.
    B: Detenerse inmediatamente en la autopista para ceder el paso.
    C: Tocar la bocina para advertir al conductor que se incorpora que debe ceder
      el paso.
    D: Reducir la velocidad para dejar que el conductor de la rampa se incorpore.
  answer: D
  explanation: Según el manual, cuando aparecen señales de incorporación en las autopistas
    justo antes de las rampas, el conductor en la autopista debe reducir la velocidad
    para permitir que el conductor en la rampa se incorpore.
- id: 276
  category: signs_and_signals
  question: ¿Qué le informa a un conductor una señal de "Carretera de Doble Sentido"
    (Two-Way Roadway)?
  choices:
    A: Que está entrando en una calle de un solo sentido.
    B: Que está saliendo de una carretera dividida y se aproxima a una carretera de
      doble sentido.
    C: Que debe dar la vuelta porque la carretera está cerrada más adelante.
    D: Que se está aproximando a una autopista de cuatro carriles.
  answer: B
  explanation: La señal de "Carretera de Doble Sentido" le informa que está saliendo
    de una carretera dividida y se aproxima a una carretera de doble sentido.
- id: 277
  category: safe_driving_rules
  question: ¿Qué debe hacer si un abanderado le indica que se detenga en una zona
    de construcción?
  choices:
    A: Reducir la velocidad a 10 mph y proceder con precaución.
    B: Detenerse solo si hay tráfico en sentido contrario.
    C: Debe detenerse si se le indica que lo haga.
    D: Cambiar de carril para evitar al abanderado.
  answer: C
  explanation: 'Al acercarse a un abanderado, debe reducir la velocidad y estar preparado
    para obedecer sus señales. El manual establece explícitamente: "Debe detenerse
    si se le indica que lo haga".'
- id: 278
  category: signs_and_signals
  question: ¿Qué determina el color de una señal de guía?
  choices:
    A: El límite de velocidad de la carretera.
    B: El tipo de información proporcionada en la señal.
    C: El condado en el que se encuentra la señal.
    D: El tamaño físico de la señal.
  answer: B
  explanation: Las señales de guía le indican dónde se encuentra y cómo llegar a un
    lugar específico. El manual señala que "el tipo de información proporcionada determina
    el color de la señal".
- id: 279
  category: defensive_driving
  question: ¿Qué debe hacer si se acerca a un vehículo involucrado en un choque que
    tiene un letrero de materiales peligrosos y no hay vehículos de emergencia presentes?
  choices:
    A: Acercarse al vehículo para revisar si hay pasajeros heridos.
    B: Intentar limpiar cualquier material derramado para evitar daños ambientales.
    C: Evitar el área del accidente y reportarlo a los servicios de emergencia desde
      un lugar seguro.
    D: Dirigir el tráfico alrededor del lugar del choque hasta que llegue la policía.
  answer: C
  explanation: Si no hay vehículos de emergencia presentes en un choque que involucre
    un letrero de materiales peligrosos, debe evitar el área del accidente y reportarlo
    a los servicios de emergencia desde un lugar seguro.
- id: 280
  category: safe_driving_rules
  question: ¿Es legal salirse de la calzada para evitar una señal de tráfico (semáforo)?
  choices:
    A: Sí, si la intersección está despejada de tráfico.
    B: Sí, pero solo para realizar un giro a la derecha.
    C: No, un conductor nunca puede salirse de la calzada para evitar una señal de
      tráfico.
    D: No, a menos que esté conduciendo un vehículo de emergencia.
  answer: C
  explanation: 'El manual establece explícitamente: "Un conductor nunca puede salirse
    de la calzada para evitar una señal de tráfico".'
- id: 281
  category: signs_and_signals
  question: ¿Cómo debe tratar una intersección cuando las señales de control de tráfico
    no funcionan?
  choices:
    A: Trátela como una señal de ceda el paso para todas las direcciones.
    B: Trátela como una parada en todas las direcciones (all-way stop) deteniéndose
      por completo.
    C: El vehículo a la derecha siempre tiene el derecho de paso sin detenerse.
    D: Continúe a través de la intersección a su velocidad normal.
  answer: B
  explanation: Cuando las señales de control de tráfico no funcionan, siempre debe
    tratar la intersección como una parada en todas las direcciones (all-way stop)
    deteniéndose por completo, a menos que un oficial de la ley indique lo contrario.
- id: 282
  category: safe_driving_rules
  question: ¿Bajo qué condición puede girar a la izquierda con una luz roja fija?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
      que tenga el tráfico moviéndose hacia la izquierda.
    C: Cuando no haya tráfico en sentido contrario durante al menos 500 pies.
    D: Los giros a la izquierda nunca están permitidos con una luz roja fija.
  answer: B
  explanation: Puede girar a la izquierda con una luz roja cuando gira desde una calle
    de un solo sentido hacia otra calle de un solo sentido que tenga el tráfico moviéndose
    hacia la izquierda, después de detenerse por completo y ceder el derecho de paso.
- id: 283
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico roja intermitente?
  choices:
    A: Entre en la intersección con precaución sin detenerse.
    B: La señal de tráfico está a punto de cambiar a verde.
    C: Debe detenerse, ceder el derecho de paso y continuar cuando sea seguro.
    D: Deténgase y espere a que la luz cambie a verde fijo.
  answer: C
  explanation: Una luz roja intermitente significa que debe detenerse, ceder el derecho
    de paso al tráfico dentro de la intersección o el cruce de peatones, y continuar
    cuando sea seguro.
- id: 284
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente?
  choices:
    A: Puede girar en la dirección que indica la flecha después de ceder el derecho
      de paso.
    B: Debe detenerse y esperar a una flecha verde fija.
    C: La flecha verde está terminando y la luz está a punto de cambiar a roja.
    D: No puede realizar el movimiento indicado por la flecha.
  answer: A
  explanation: La flecha amarilla intermitente significa que puede girar en la dirección
    que indica la flecha después de ceder el derecho de paso a cualquier peatón y
    vehículo en la intersección o el cruce de peatones.
- id: 285
  category: safe_driving_rules
  question: Al acercarse a una luz roja fija donde no hay una línea de parada marcada
    ni un cruce de peatones, ¿dónde debe detenerse?
  choices:
    A: Justo después de la intersección.
    B: Antes de entrar en la intersección.
    C: A la altura del poste de la señal de tráfico.
    D: Dos longitudes de automóvil antes de la intersección.
  answer: B
  explanation: En una luz roja fija, si no hay una línea de parada marcada, deténgase
    antes de entrar al cruce de peatones. Si no hay cruce de peatones, deténgase antes
    de entrar en la intersección.
- id: 286
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla encendida constantemente?
  choices:
    A: Usted tiene el derecho de paso para girar.
    B: La flecha verde está terminando o la luz está a punto de cambiar a roja.
    C: Debe ceder el paso al tráfico en sentido contrario antes de girar.
    D: La señal de tráfico está averiada.
  answer: B
  explanation: La flecha amarilla encendida constantemente significa que la flecha
    verde está terminando o que la luz está a punto de cambiar a roja.
- id: 287
  category: sharing_the_road
  question: ¿Qué debe hacer un peatón si se encuentra con una señal de mano levantada
    naranja intermitente ('Don't Walk' / No cruce) pero ya ha completado parcialmente
    el cruce?
  choices:
    A: Detenerse en medio de la calle y esperar a la siguiente señal de cruce.
    B: Dar la vuelta y regresar a la acera original.
    C: Continuar hasta una acera o una isla de seguridad.
    D: Correr lo más rápido posible hacia el otro lado.
  answer: C
  explanation: Si un peatón ha completado parcialmente el cruce durante la señal de
    caminar encendida constantemente y la señal de 'Don't Walk' comienza a parpadear,
    puede continuar hasta una acera o isla de seguridad.
- id: 288
  category: sharing_the_road
  question: ¿Qué debe hacer un peatón si está en medio de un cruce de peatones y la
    señal peatonal cambia a una mano levantada naranja intermitente?
  choices:
    A: Detenerse inmediatamente y esperar en la calzada.
    B: Dar la vuelta y correr de regreso a la acera de inicio.
    C: Continuar cruzando hasta una acera o isla de seguridad.
    D: Ceder el paso a los vehículos que se aproximan y esperar en el carril central.
  answer: C
  explanation: Según el manual, si se enfrenta a una señal de 'Don't Walk' intermitente
    y ha completado parcialmente el cruce, puede continuar hasta una acera o isla
    de seguridad.
- id: 289
  category: signs_and_signals
  question: Al conducir en una autopista o autovía, ¿qué indica una señal de carril
    con una 'X' amarilla?
  choices:
    A: El carril está abierto solo para rebasar.
    B: La señal del carril va a cambiar a roja, por lo que debe abandonar el carril
      de manera segura.
    C: El carril puede usarse para acercarse y realizar un giro a la izquierda.
    D: Debe detenerse por completo en ese carril.
  answer: B
  explanation: Una 'X' amarilla indica que la señal del carril va a cambiar a roja.
    Los conductores deben abandonar este carril de manera segura antes de que aparezca
    la 'X' roja.
- id: 290
  category: signs_and_signals
  question: ¿Cómo están marcados los bordes izquierdo y derecho de las calles o calzadas
    divididas?
  choices:
    A: Líneas blancas continuas a la izquierda y líneas amarillas continuas a la derecha.
    B: Líneas amarillas continuas a la izquierda y líneas blancas continuas a la derecha.
    C: Líneas blancas discontinuas en ambos lados.
    D: Líneas amarillas continuas en ambos lados.
  answer: B
  explanation: Se utilizan líneas blancas continuas en el borde derecho de la calzada,
    mientras que se utilizan líneas amarillas continuas en el borde izquierdo de las
    calles o calzadas divididas.
- id: 291
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a las líneas blancas continuas dobles que
    separan los carriles de tráfico que se mueven en la misma dirección?
  choices:
    A: Se permite cruzar solo al rebasar.
    B: Se permite cruzar con especial cuidado.
    C: Está prohibido cruzar.
    D: Se permite cruzar solo para realizar un giro a la derecha.
  answer: C
  explanation: Las líneas blancas continuas dobles separan los carriles de tráfico
    que se mueven en la misma dirección, y está prohibido cruzar una línea blanca
    continua doble.
- id: 292
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar líneas amarillas continuas dobles en el centro
    de la calzada?
  choices:
    A: Para rebasar a un vehículo que circula despacio.
    B: Para realizar un giro a la izquierda hacia o desde un callejón, camino privado,
      entrada o calle.
    C: Para realizar un giro en U en cualquier momento.
    D: Nunca se permite cruzar líneas amarillas continuas dobles.
  answer: B
  explanation: Dos líneas amarillas continuas marcan el centro de la calzada y pueden
    cruzarse para realizar un giro a la izquierda hacia o desde un callejón, camino
    privado, entrada o calle.
- id: 293
  category: safe_driving_rules
  question: ¿Cuál es el único momento en que un vehículo puede circular por un carril
    central de giro a la izquierda de dos sentidos?
  choices:
    A: Al rebasar a un vehículo más lento por la izquierda.
    B: Al prepararse para realizar o al realizar un giro a la izquierda o un giro
      en U permitido.
    C: Al estacionarse temporalmente para subir o bajar pasajeros.
    D: Al incorporarse al tráfico regular desde una intersección.
  answer: B
  explanation: Un vehículo no puede circular por un carril de giro a la izquierda
    de dos sentidos, excepto cuando se prepara para realizar o realiza un giro a la
    izquierda desde o hacia la calzada, o cuando se prepara para realizar o realiza
    un giro en U cuando la ley lo permite.
- id: 294
  category: safe_driving_rules
  question: ¿Dónde debe detener su vehículo un conductor al acercarse a una línea
    de parada blanca en una intersección?
  choices:
    A: Antes de que cualquier parte del vehículo cruce la línea.
    B: Con las ruedas delanteras apoyadas sobre la línea.
    C: Hasta 4 pies después de la línea.
    D: Dentro del área del paso de peatones.
  answer: A
  explanation: Una línea de parada blanca indica dónde debe detener su vehículo ante
    una señal de alto o una luz roja. Debe detener su vehículo antes de que cualquier
    parte de este cruce la línea.
- id: 295
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla redonda con una 'X' negra y las letras
    'RR'?
  choices:
    A: Un cruce de ferrocarril está exactamente a 100 pies adelante.
    B: Hay un cruce de carretera y ferrocarril más adelante, a una distancia de hasta
      750 pies.
    C: Debe detenerse por completo de inmediato.
    D: El cruce de ferrocarril que está más adelante se encuentra cerrado actualmente.
  answer: B
  explanation: Una señal redonda de advertencia avanzada es una señal amarilla con
    una 'X' negra y 'RR' que significa que hay un cruce de carretera y ferrocarril
    más adelante, y puede estar ubicada hasta 750 pies antes del cruce.
- id: 296
  category: signs_and_signals
  question: ¿Cómo debe tratar un conductor una señal de cruce de ferrocarril en forma
    de X (Crossbuck)?
  choices:
    A: Como una señal de alto.
    B: Como una señal de advertencia para aumentar la velocidad.
    C: Como una señal de ceda el paso.
    D: Como una señal de no entrar.
  answer: C
  explanation: Una señal de cruce de ferrocarril (Crossbuck) se considera una señal
    de ceda el paso, y usted debe ceder el paso a cualquier tren o equipo ferroviario
    que se aproxime.
- id: 297
  category: signs_and_signals
  question: ¿Cuál es el propósito de la señal del Sistema de Notificación de Emergencias
    (ENS) en un cruce a nivel de carretera y ferrocarril?
  choices:
    A: Proporcionar el horario de los trenes para el cruce.
    B: Brindar al público información crítica de contacto de emergencia para comunicarse
      con el ferrocarril.
    C: Indicar el límite de velocidad para los trenes que pasan.
    D: Advertir a los conductores sobre una cámara de vigilancia automatizada.
  answer: B
  explanation: La señal ENS (Sistema de Notificación de Emergencias) brinda al público
    información crítica de contacto de emergencia en cada cruce a nivel de carretera
    y ferrocarril para comunicarse con el ferrocarril en caso de una emergencia.
- id: 298
  category: defensive_driving
  question: ¿Qué regla deben usar los conductores para determinar una distancia de
    seguimiento segura en buenas condiciones de la carretera y del clima?
  choices:
    A: La regla de los dos segundos.
    B: La regla de los tres segundos.
    C: La regla de los cuatro segundos.
    D: La regla de la longitud de un vehículo.
  answer: B
  explanation: El manual establece que se debe usar la regla de los tres segundos
    para determinar una distancia de seguimiento segura en una buena carretera y durante
    buenas condiciones climáticas.
- id: 299
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si otro conductor lo sigue muy de cerca
    (tailgating)?
  choices:
    A: Pisar los frenos rápidamente para advertir al conductor.
    B: Aumentar la velocidad para incrementar la distancia entre los vehículos.
    C: Cambiarse a otro carril o salir lentamente de la carretera para permitir que
      el vehículo pase.
    D: Encender las luces de emergencia y mantener su velocidad actual.
  answer: C
  explanation: Si alguien lo sigue muy de cerca, el manual aconseja cambiarse a otro
    carril o salir lentamente de la carretera y permitir que el vehículo pase.
- id: 300
  category: safe_driving_rules
  question: ¿Cómo afecta el duplicar la velocidad de su vehículo a su distancia de
    frenado?
  choices:
    A: Duplica la distancia de frenado.
    B: Triplica la distancia de frenado.
    C: Cuadriplica la distancia de frenado.
    D: No tiene ningún efecto en la distancia de frenado.
  answer: C
  explanation: Según el manual, duplicar su velocidad cuadriplica la distancia de
    frenado de su vehículo.
- id: 301
  category: defensive_driving
  question: ¿Cómo puede afectar el viento la distancia de frenado de su vehículo?
  choices:
    A: Un fuerte viento de frente hace que sea muy difícil detenerse.
    B: Un fuerte viento de cola puede hacer que sea muy difícil detenerse.
    C: Los vientos cruzados disminuyen la distancia de frenado.
    D: La dirección del viento solo afecta a los camiones grandes, no a los vehículos
      de pasajeros.
  answer: B
  explanation: Al considerar su velocidad y distancia de frenado, el manual señala
    que la dirección del viento y la velocidad a la que sopla son factores, indicando
    específicamente que un fuerte viento de cola puede hacer que sea muy difícil detenerse.
- id: 302
  category: safe_driving_rules
  question: ¿Qué debe hacer si la niebla es demasiado densa para ver con seguridad
    mientras conduce?
  choices:
    A: Conducir a 5-10 mph con las luces de emergencia encendidas.
    B: Encender las luces altas.
    C: Salirse de la carretera y detenerse.
    D: Seguir de cerca al vehículo que va delante.
  answer: C
  explanation: El manual establece que si la niebla es demasiado densa, debe salirse
    de la carretera y detenerse. Advierte específicamente a los conductores que no
    conduzcan a 5-10 mph.
- id: 303
  category: safe_driving_rules
  question: Según la ley de Illinois, ¿cuándo es obligatorio usar los faros delanteros?
  choices:
    A: Solo cuando se conduce por autopistas.
    B: Cuando se operan los limpiaparabrisas.
    C: Al conducir a más de 50 mph.
    D: Solo entre el atardecer y el amanecer.
  answer: B
  explanation: La ley de Illinois exige el uso de los faros delanteros cuando se operan
    los limpiaparabrisas, como durante la lluvia.
- id: 304
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si su vehículo comienza a derrapar mientras
    ocurre el hidroplaneo (hydroplaning) y no puede recuperar el control?
  choices:
    A: Bombear los frenos rápidamente.
    B: Acelerar para recuperar la tracción.
    C: Girar el volante bruscamente en la dirección opuesta.
    D: Soltar el acelerador y dejar que el vehículo termine de derrapar.
  answer: D
  explanation: Si su vehículo derrapa mientras ocurre el hidroplaneo y no puede recuperar
    el control, debe soltar el acelerador y dejar que el vehículo termine de derrapar.
- id: 305
  category: sharing_the_road
  question: ¿Qué restricción se aplica en el Sistema de Autopistas de Peaje de Illinois
    (Illinois Tollway System) durante vientos fuertes?
  choices:
    A: Las motocicletas están prohibidas.
    B: Se prohíbe el remolque de casas rodantes (trailers).
    C: Los límites de velocidad se reducen a 45 mph.
    D: Los camiones comerciales deben usar el carril izquierdo.
  answer: B
  explanation: El Sistema de Autopistas de Peaje de Illinois prohíbe el remolque de
    casas rodantes cuando hay vientos fuertes debido a la dificultad para controlarlas.
- id: 306
  category: safe_driving_rules
  question: ¿Cómo debe aplicar los frenos al conducir en carreteras invernales?
  choices:
    A: De forma fuerte y rápida para probar la tracción.
    B: Suavemente con movimientos lentos y constantes.
    C: Usando solo el freno de emergencia.
    D: Bombeándolos rápidamente antes de cada parada.
  answer: B
  explanation: En condiciones de conducción invernal, debe aplicar los frenos suavemente
    con movimientos lentos y constantes. Esto le ayuda a determinar cuánta tracción
    tiene el vehículo disponible.
- id: 307
  category: defensive_driving
  question: Si se queda varado en clima invernal, ¿por qué solo debe encender el motor
    por períodos breves y abrir la ventana?
  choices:
    A: Para conservar la energía de la batería.
    B: Para evitar que el motor se congele.
    C: Para prevenir el envenenamiento por monóxido de carbono.
    D: Para pedir ayuda.
  answer: C
  explanation: Si se queda varado, permanezca en su vehículo y encienda el motor solo
    por períodos breves mientras abre la ventana para evitar el envenenamiento por
    monóxido de carbono.
- id: 308
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una autopista?
  choices:
    A: Detenerse y retroceder por el acotamiento.
    B: Dar una vuelta en U en el siguiente cruce de la mediana.
    C: Ir a la siguiente salida disponible.
    D: Poner el vehículo en reversa y retroceder en el carril derecho.
  answer: C
  explanation: Si se pasa de una salida, vaya a la siguiente salida disponible. Retroceder
    en una autopista es ilegal.
- id: 309
  category: safe_driving_rules
  question: Al conducir de noche, ¿a cuántos pies debe bajar las luces altas antes
    de encontrarse con un vehículo que viene en dirección contraria?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Las luces altas deben bajarse 500 pies antes de encontrarse con un
    vehículo que viene en dirección contraria o 300 pies antes de rebasar a un vehículo.
- id: 310
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo se aproxima de frente en su carril?
  choices:
    A: Acelerar y desviarse hacia la izquierda.
    B: Reducir la velocidad, hacerse a la derecha y tocar la bocina.
    C: Detenerse inmediatamente en su carril y parpadear las luces altas.
    D: Dirigirse al carril contrario para evitarlos.
  answer: B
  explanation: Cuando un vehículo se aproxima de frente en su carril, debe reducir
    la velocidad, hacerse a la derecha y tocar la bocina.
- id: 311
  category: vehicle_information
  question: ¿Cómo debe maniobrar el volante si su vehículo comienza a derrapar?
  choices:
    A: Gire el volante en la dirección opuesta al derrape.
    B: Mantenga el volante perfectamente recto.
    C: Gire el volante en la dirección del derrape.
    D: Gire el volante bruscamente hacia la derecha.
  answer: C
  explanation: Si su vehículo comienza a derrapar, deje de presionar el pedal del
    acelerador o los frenos, gire el volante en la dirección del derrape hasta recuperar
    la tracción y luego enderece el vehículo.
- id: 312
  category: defensive_driving
  question: ¿Cuál es el procedimiento correcto si las ruedas de su vehículo se salen
    del pavimento hacia el arcén (shoulder)?
  choices:
    A: Gire el volante bruscamente para regresar a la carretera.
    B: Frene de golpe y deténgase en el arcén.
    C: Acelere para volver al pavimento rápidamente.
    D: Sujete el volante con firmeza, deje de presionar el acelerador y frene suavemente.
  answer: D
  explanation: Si las ruedas de su vehículo se salen del pavimento, sujete el volante
    con firmeza, retire el pie del acelerador y frene suavemente. No debe girar el
    volante bruscamente para corregir la dirección.
- id: 313
  category: safe_driving_rules
  question: Si su vehículo cae al agua y se hunde, ¿hacia dónde debe moverse para
    encontrar una bolsa de aire?
  choices:
    A: El área del asiento delantero.
    B: El área del asiento trasero.
    C: El maletero.
    D: Debajo del tablero.
  answer: B
  explanation: Si su vehículo se hunde, muévase al área del asiento trasero, donde
    generalmente se forma una bolsa de aire y, si es posible, respire profundo y salga
    por una ventana trasera.
- id: 314
  category: defensive_driving
  question: Si caen cables eléctricos sobre su vehículo durante un choque y el incendio
    es un peligro inmediato, ¿cómo debe salir del vehículo?
  choices:
    A: Salga lentamente, manteniendo un pie en el vehículo y otro en el suelo.
    B: Salte para alejarse, cayendo con ambos pies, y aléjese saltando o arrastrando
      los pies.
    C: Corra lejos del vehículo lo más rápido posible.
    D: Salga gateando por la ventana y ruede por el suelo.
  answer: B
  explanation: Al saltar para alejarse de un vehículo con cables eléctricos caídos,
    no permita que ninguna parte de su cuerpo toque el vehículo y el suelo al mismo
    tiempo. Caiga con ambos pies y salte o arrastre los pies manteniendo los brazos
    pegados al cuerpo durante 50 pies.
- id: 315
  category: vehicle_information
  question: ¿Qué sonido puede ser una advertencia de un reventón de neumático inminente?
  choices:
    A: Un chirrido agudo.
    B: Un ruido fuerte de chirrido metálico.
    C: Un sonido de golpeteo (thumping).
    D: Un siseo continuo.
  answer: C
  explanation: Según el manual, un sonido de golpeteo puede ser una advertencia de
    un reventón.
- id: 316
  category: safe_driving_rules
  question: En tráfico denso y lento donde los carriles se reducen debido a una construcción,
    ¿cómo debe incorporarse?
  choices:
    A: Incorpórese lo antes posible al carril abierto.
    B: Use ambos carriles para avanzar hasta el punto de reducción de carril e incorpórese
      alternando turnos.
    C: Conduzca por el arcén para evitar el tráfico.
    D: Deténgase en su carril hasta que alguien le indique que pase.
  answer: B
  explanation: En tráfico denso y lento, se recomienda utilizar ambos carriles para
    avanzar hasta el punto de reducción de carril e incorporarse en ese lugar, alternando
    turnos.
- id: 317
  category: defensive_driving
  question: ¿Qué debe hacer si escucha un sonido de golpeteo y experimenta un reventón
    de neumático mientras conduce?
  choices:
    A: Frenar repentinamente y orillarse de inmediato.
    B: Retire el pie del acelerador y mantenga el volante sujeto con firmeza.
    C: Apagar el motor de inmediato para detener el vehículo.
    D: Poner el vehículo en punto muerto (neutral) y bombear los frenos rápidamente.
  answer: B
  explanation: Si ocurre un reventón, retire el pie del acelerador y mantenga el volante
    sujeto con firmeza. Salga de la carretera de forma segura y revise los neumáticos.
    No frene repentinamente.
- id: 318
  category: vehicle_information
  question: ¿Por qué NO debe apagar el motor si pierde repentinamente el control del
    volante?
  choices:
    A: Hará que el motor se incendie.
    B: Su vehículo perderá la dirección asistida (power steering) o la capacidad de
      maniobrar debido al bloqueo del volante.
    C: Las luces de emergencia no funcionarán sin el motor encendido.
    D: Los frenos se bloquearán de inmediato y causarán un derrape.
  answer: B
  explanation: Si su vehículo tiene dirección asistida o bloqueo de volante, no apague
    el motor porque el vehículo perderá la dirección asistida o la capacidad de maniobrar.
- id: 319
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si el pedal del freno se hunde repentinamente
    hasta el piso?
  choices:
    A: Cambiar a una marcha más alta.
    B: Apagar el motor.
    C: Bombear el pedal del freno para generar presión.
    D: Aplicar el freno de estacionamiento bruscamente.
  answer: C
  explanation: Si el pedal del freno se hunde repentinamente hasta el piso, bombéelo
    para generar presión. Si eso no funciona, use el freno de emergencia o de estacionamiento.
- id: 320
  category: defensive_driving
  question: Si el pedal del acelerador se queda atascado y no puede soltarlo enganchando
    la punta del pie debajo de él, ¿qué debe hacer?
  choices:
    A: Ponga el vehículo en punto muerto (neutral) y frene suavemente para reducir
      la velocidad.
    B: Apague el motor y retire la llave.
    C: Ponga marcha atrás (reversa) para contrarrestar el impulso hacia adelante.
    D: Frene de golpe con la mayor fuerza posible.
  answer: A
  explanation: Si el pedal del acelerador se queda atascado y no se suelta después
    de enganchar la punta del pie debajo de él, ponga el vehículo en punto muerto
    (neutral) y frene suavemente para reducir la velocidad.
- id: 321
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones se recomienda si se encuentra con un
    automovilista enojado o agresivo?
  choices:
    A: Hacer contacto visual para demostrar que no está intimidado.
    B: Tomar represalias tocando la bocina.
    C: Mantener las puertas del vehículo cerradas con seguro y las ventanillas subidas.
    D: Frenar repentinamente para obligarlos a retroceder.
  answer: C
  explanation: Si se encuentra con un automovilista enojado o agresivo, debe mantener
    las puertas del vehículo cerradas con seguro y las ventanillas subidas, evitar
    el contacto visual y no tomar represalias.
- id: 322
  category: safe_driving_rules
  question: Si su vehículo se avería en una vía de gran capacidad, como una autopista,
    ¿cuál es el protocolo más seguro?
  choices:
    A: Salir del vehículo y permanecer en el acotamiento (shoulder).
    B: Permanecer en su vehículo con el cinturón de seguridad abrochado y activar
      las luces de emergencia.
    C: Caminar por la autopista hasta la estación de servicio más cercana.
    D: Pararse detrás de su vehículo para hacer señas al tráfico.
  answer: B
  explanation: En vías de gran capacidad, si su vehículo se avería, debe orillarse,
    permanecer en su vehículo, mantener el cinturón de seguridad abrochado, activar
    las luces de emergencia y llamar al 911.
- id: 323
  category: safe_driving_rules
  question: ¿A qué número debe llamar para pedir ayuda si su vehículo se avería en
    la autopista de peaje de Illinois (Illinois Tollway)?
  choices:
    A: 311 o 411
    B: '*999 o 911'
    C: '*55 o 911'
    D: 800-TOLLWAY
  answer: B
  explanation: En la autopista de peaje de Illinois (Illinois Tollway), si su vehículo
    se avería o tiene una emergencia, active las luces de emergencia y llame al *999
    o al 911 para solicitar asistencia.
- id: 324
  category: vehicle_information
  question: Según la ley de Illinois, ¿el freno de pie debe ser lo suficientemente
    fuerte como para detener un vehículo que viaja a 20 mph en qué distancia?
  choices:
    A: 20 pies
    B: 30 pies
    C: 50 pies
    D: 55 pies
  answer: B
  explanation: El freno de pie debe ser lo suficientemente fuerte como para detener
    un vehículo que viaja a una velocidad de 20 mph en una distancia de 30 pies.
- id: 325
  category: safe_driving_rules
  question: ¿Cuándo se deben atenuar las luces altas (bright headlights) antes de
    encontrarse con un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Las luces altas deben atenuarse 500 pies antes de encontrarse con un
    vehículo que viene en sentido contrario o 300 pies antes de rebasar a un vehículo.
- id: 326
  category: safe_driving_rules
  question: Además de desde el atardecer hasta el amanecer, ¿en qué otros momentos
    es obligatorio el uso de los faros delanteros?
  choices:
    A: Solo cuando se conduce por la autopista.
    B: Cuando la lluvia, la nieve, la niebla u otras condiciones requieran el uso
      de los limpiaparabrisas.
    C: Siempre que se conduzca en una zona residencial.
    D: Solo cuando no se puedan ver objetos a 5,000 pies de distancia.
  answer: B
  explanation: Los faros delanteros deben estar encendidos desde el atardecer hasta
    el amanecer y utilizarse cuando la lluvia, la nieve, la niebla u otras condiciones
    requieran el uso de los limpiaparabrisas.
- id: 327
  category: vehicle_information
  question: ¿La luz de la placa de un vehículo debe permitir que la placa sea legible
    desde qué distancia?
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 200 pies
  answer: B
  explanation: Los vehículos deben tener una luz blanca que haga legible la placa
    desde 50 pies de distancia y debe estar encendida cuando los faros delanteros
    estén encendidos.
- id: 328
  category: vehicle_information
  question: ¿Cuál es la ley de Illinois con respecto a las ventanillas polarizadas
    (tinted windows) en el parabrisas delantero?
  choices:
    A: Se permite el polarizado en todo el parabrisas si es ligero.
    B: No se permiten ventanillas polarizadas en el parabrisas delantero, excepto
      por una franja de 6 pulgadas en la parte superior.
    C: Se permite el polarizado hasta 10 pulgadas desde la parte superior.
    D: No se permite ningún tipo de polarizado en el parabrisas delantero.
  answer: B
  explanation: No se permiten ventanillas polarizadas en el parabrisas delantero.
    Se permite una franja de polarizado de 6 pulgadas a lo largo de toda la parte
    superior del parabrisas delantero.
- id: 329
  category: vehicle_information
  question: ¿La bocina de un vehículo motorizado debe ser lo suficientemente fuerte
    como para ser escuchada desde qué distancia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los vehículos deben tener una bocina que pueda escucharse desde 200
    pies.
- id: 330
  category: defensive_driving
  question: ¿Qué debe hacer un conductor si la rueda delantera derecha de su vehículo
    se sale del pavimento?
  choices:
    A: Frenar bruscamente y girar bruscamente a la izquierda.
    B: Acelerar para volver a la carretera rápidamente.
    C: Soltar el acelerador, frenar suavemente y girar suavemente de regreso al pavimento.
    D: Poner el vehículo en punto muerto (neutral) y avanzar por inercia hasta que
      el vehículo se detenga.
  answer: C
  explanation: Si la rueda delantera derecha de un vehículo se sale del pavimento,
    el conductor debe soltar el acelerador, frenar suavemente y girar suavemente de
    regreso al pavimento.
- id: 331
  category: vehicle_information
  question: Los vehículos de pasajeros deben tener dos luces traseras rojas que sean
    visibles desde ¿qué distancia por detrás?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los vehículos deben tener dos luces rojas visibles a 500 pies por detrás.
- id: 332
  category: vehicle_information
  question: Si una carga se extiende 4 pies o más hacia la parte trasera de un vehículo
    durante el día, ¿cómo debe marcarse?
  choices:
    A: Con una luz blanca
    B: Con una señal de peligro amarilla
    C: Con una bandera roja
    D: Con un reflector ámbar
  answer: C
  explanation: Las cargas que se extiendan 4 pies o más hacia la parte trasera de
    un vehículo deben marcarse con una bandera roja durante el día.
- id: 333
  category: vehicle_information
  question: Es ilegal alterar el sistema de suspensión de un vehículo para elevar
    la carrocería del bastidor del chasis en más de ¿cuántas pulgadas?
  choices:
    A: 2 pulgadas
    B: 3 pulgadas
    C: 4 pulgadas
    D: 6 pulgadas
  answer: B
  explanation: Es ilegal alterar el sistema de suspensión de un vehículo para elevar
    la carrocería del bastidor del chasis en más de 3 pulgadas.
- id: 334
  category: safe_driving_rules
  question: ¿Cuál es la ley de Illinois con respecto a los televisores o monitores
    de grabación de video dentro de un vehículo en movimiento?
  choices:
    A: Se permiten siempre que el volumen esté silenciado.
    B: Están prohibidos si se pueden ver desde el asiento del conductor.
    C: Se permiten solo en autopistas interestatales.
    D: Se permiten si el conductor utiliza un dispositivo de manos libres.
  answer: B
  explanation: Los televisores o monitores de grabación de video que puedan verse
    desde el asiento del conductor están prohibidos mientras el vehículo está en movimiento.
- id: 335
  category: vehicle_information
  question: ¿Bajo qué circunstancias se permiten generalmente los neumáticos neumáticos
    con clavos metálicos para vehículos de pasajeros regulares en Illinois?
  choices:
    A: Durante cualquier mes de invierno.
    B: Son ilegales excepto por exenciones específicas como carteros rurales o ciertas
      personas con discapacidades entre el 15 de noviembre y el 1 de abril.
    C: Solo cuando se conduce por autopistas interestatales.
    D: Siempre que haya nieve visible en la calzada.
  answer: B
  explanation: Los neumáticos neumáticos con clavos metálicos son ilegales excepto
    por exenciones específicas, como los vehículos utilizados por carteros en áreas
    rurales o vehículos que exhiben placas para Personas con Discapacidades entre
    el 15 de noviembre y el 1 de abril.
- id: 336
  category: vehicle_information
  question: ¿Cuál es la regla con respecto a los dispositivos inhibidores de radar
    en Illinois?
  choices:
    A: Se permiten solo en vehículos comerciales.
    B: Se permiten si el vehículo viaja por debajo del límite de velocidad.
    C: La posesión y el uso de dispositivos inhibidores de radar están prohibidos
      en todos los vehículos.
    D: Se permiten solo durante las horas del día.
  answer: C
  explanation: La posesión y el uso de dispositivos inhibidores de radar están prohibidos
    en todos los vehículos.
- id: 337
  category: license_system
  question: Al comprar un vehículo a un concesionario en Illinois, ¿dentro de cuántos
    días debe el concesionario enviar la documentación y las tarifas requeridas a
    la oficina de la Secretaría de Estado?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: Dentro de los 20 días posteriores a la compra, un concesionario debe
    enviar la Solicitud de Transacción(es) de Vehículo, el Certificado de Título y
    los pagos a la oficina de la Secretaría de Estado.
- id: 338
  category: license_system
  question: ¿Qué documento se requiere para demostrar la propiedad de un vehículo
    o casa móvil en Illinois?
  choices:
    A: Tarjeta de identificación de registro del vehículo
    B: Factura de venta
    C: Permiso de registro temporal
    D: Certificado de título
  answer: D
  explanation: Para registrar un vehículo en Illinois, debe tener un Certificado de
    Título de Illinois. Este documento demuestra la propiedad.
- id: 339
  category: penalties_and_points
  question: ¿Cuál es el cargo por pago atrasado que se aplica a los registros de vehículos
    renovados más de un mes después de la fecha de vencimiento?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: Se aplica un cargo por pago atrasado de $20 a los registros renovados
    más de un mes después de la fecha de vencimiento.
- id: 340
  category: vehicle_information
  question: ¿Cuántas placas de matrícula se deben exhibir en los vehículos de pasajeros,
    camiones y camionetas en Illinois?
  choices:
    A: Una en la parte trasera
    B: Una en la parte delantera
    C: Dos placas, una en la parte delantera y otra en la trasera
    D: Una en la parte trasera y otra dentro del parabrisas
  answer: C
  explanation: La ley de Illinois exige que todos los vehículos de pasajeros, camiones
    y camionetas exhiban dos placas, una en la parte delantera y otra en la trasera.
- id: 341
  category: license_system
  question: ¿Qué debe hacer con sus placas de matrícula cuando vende su vehículo a
    un propietario privado?
  choices:
    A: Dejarlas en el vehículo para el nuevo propietario.
    B: Quitarlas y conservarlas, ya que las placas permanecen con el propietario.
    C: Devolverlas inmediatamente al DMV.
    D: Destruirlas.
  answer: B
  explanation: Cuando se vende un vehículo, el vendedor debe quitar las placas de
    matrícula y conservarlas. En Illinois, las placas permanecen con el propietario,
    no con el vehículo.
- id: 342
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Registro Temporal (TRP) a partir
    de la fecha de emisión?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: D
  explanation: El TRP es válido por 90 días a partir de la fecha de emisión, aunque
    puede ser reemitido si las placas de matrícula no llegan dentro de los 90 días.
- id: 343
  category: license_system
  question: ¿Dónde debe colocarse la calcomanía de renovación del registro en la placa
    de matrícula?
  choices:
    A: Parte superior izquierda de la placa delantera
    B: Parte superior derecha de la placa de matrícula trasera
    C: Parte inferior izquierda de la placa de matrícula trasera
    D: Centro de la placa de matrícula trasera
  answer: B
  explanation: Se recomienda adherir inmediatamente la calcomanía de renovación en
    la parte superior derecha de la placa de matrícula trasera.
- id: 344
  category: license_system
  question: Si compra una calcomanía de renovación de vehículo en línea antes de su
    vencimiento pero aún no la ha recibido, ¿por cuánto tiempo es válido su recibo
    impreso como prueba de registro?
  choices:
    A: 15 días a partir de la fecha de compra
    B: 30 días a partir del vencimiento de la calcomanía actual
    C: 60 días a partir del vencimiento de la calcomanía actual
    D: 90 días a partir de la fecha de compra
  answer: B
  explanation: El recibo impreso solo es válido como prueba de registro durante 30
    días a partir del vencimiento de la calcomanía de registro que se muestra actualmente
    en la placa de matrícula.
- id: 345
  category: vehicle_information
  question: ¿Qué vehículos tienen permitido tener luces rojas visibles desde la parte
    delantera?
  choices:
    A: Cualquier vehículo comercial
    B: Vehículos con cargas proyectadas
    C: Vehículos de policía o de emergencia designados
    D: Vehículos antiguos de más de 25 años
  answer: C
  explanation: Las luces rojas visibles desde la parte delantera están prohibidas,
    excepto para vehículos de policía o de emergencia designados.
- id: 346
  category: vehicle_information
  question: ¿Cuánto tiempo tienen los miembros militares que sirven en una capacidad
    que no es de combate fuera de los Estados Unidos para renovar el registro de su
    vehículo al regresar?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los propietarios de vehículos que son miembros de las Fuerzas Armadas
    de los EE. UU. y sirven en una capacidad que no es de combate fuera de los EE.
    UU. tienen 45 días a partir de su fecha de regreso para obtener o renovar el registro
    de su vehículo.
- id: 347
  category: vehicle_information
  question: ¿Qué veteranos son elegibles para que se les exonere el cargo estándar
    de registro de vehículo para el período de renovación inmediatamente posterior
    a su regreso a los Estados Unidos?
  choices:
    A: Todos los veteranos que sirvieron en el extranjero
    B: Veteranos que sirvieron en una capacidad que no es de combate
    C: Miembros en servicio activo o reservistas que puedan mostrar prueba de servicio
      en una misión de combate
    D: Empleados civiles de las Fuerzas Armadas
  answer: C
  explanation: Los miembros de las Fuerzas Armadas de los EE. UU. en servicio activo
    o como reservistas que puedan mostrar prueba de servicio en una misión de combate
    pueden obtener la exoneración del cargo estándar de registro de vehículo para
    el período de renovación inmediatamente posterior a su regreso.
- id: 348
  category: vehicle_information
  question: ¿Cuánto tiempo debe esperar para recibir placas de matrícula personalizadas
    o de vanidad después de realizar un pedido?
  choices:
    A: Al menos 15 días
    B: Al menos 30 días
    C: Al menos 45 días
    D: Al menos 60 días
  answer: C
  explanation: El manual establece que se debe esperar al menos 45 días desde el momento
    en que se realiza el pedido para recibir las placas de matrícula personalizadas
    y de vanidad.
- id: 349
  category: vehicle_information
  question: ¿Cuántos descuentos de cargo reducido para placas de matrícula al año
    se permiten para personas mayores y personas con discapacidades que califiquen?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ilimitados
  answer: A
  explanation: Las personas mayores y las personas con discapacidades que califican
    para el Programa de Acceso a Beneficios (Benefit Access Program) son elegibles
    para cargos reducidos en las placas de matrícula, pero solo se permite un descuento
    por año.
- id: 350
  category: driver_responsibility
  question: ¿Cuál es el requisito mínimo de seguro de responsabilidad civil por lesiones
    o muerte de una persona en un choque en Illinois?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El límite mínimo de seguro de responsabilidad civil en Illinois es
    de $25,000 por lesiones o muerte de una persona en un choque.
- id: 351
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma aceptable de mostrar evidencia de
    seguro de responsabilidad civil a un oficial de la ley?
  choices:
    A: Solo una tarjeta de seguro física en papel
    B: Solo un certificado de seguro enviado directamente por el estado
    C: Una tarjeta de seguro mostrada en un teléfono celular u otro dispositivo electrónico
    D: Una confirmación verbal de su número de póliza
  answer: C
  explanation: Las compañías de seguros deben proporcionar una tarjeta de seguro que
    pueda mostrarse en el teléfono celular u otro dispositivo electrónico del conductor,
    la cual puede presentarse a los oficiales de la ley si lo solicitan.
- id: 352
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de no portar el seguro de vehículo requerido
    en Illinois?
  choices:
    A: Una multa de advertencia por las primeras tres infracciones
    B: Suspensión de los privilegios de conducir y del registro del vehículo
    C: Servicio comunitario obligatorio
    D: Confiscación inmediata del vehículo
  answer: B
  explanation: No portar el seguro requerido resultará en multas, la imposibilidad
    de renovar el registro del vehículo, la suspensión de los privilegios de conducir
    y la suspensión del registro del vehículo.
- id: 353
  category: penalties_and_points
  question: ¿Qué puede suceder si el propietario de un vehículo proporciona información
    de seguro falsa a la oficina del Secretario de Estado para renovar su registro?
  choices:
    A: Se le requerirá tomar un curso de conducción defensiva
    B: Recibirá una carta de advertencia
    C: Puede enfrentar cargos penales y una multa
    D: Sus primas de seguro tendrán un límite legal
  answer: C
  explanation: Proporcionar información falsa a la oficina del Secretario de Estado
    o a un remitente para renovar el registro del vehículo puede resultar en cargos
    penales y una multa.
- id: 354
  category: vehicle_information
  question: Si se muda de un área en Illinois donde se requiere la prueba de emisiones
    de vehículos, ¿qué debe hacer?
  choices:
    A: Notificar a la Agencia de Protección Ambiental de Illinois de inmediato
    B: Notificar al Secretario de Estado
    C: Continuar realizando las pruebas de emisiones sin importar a dónde se mude
    D: Quitar sus placas de matrícula y devolverlas
  answer: B
  explanation: Si se muda del área en la que se requiere la prueba de emisiones, debe
    notificar al Secretario de Estado.
- id: 355
  category: vehicle_information
  question: ¿Las placas de matrícula para personas con discapacidades eximen al titular
    autorizado del pago de las tarifas de los parquímetros?
  choices:
    A: Sí, en todos los municipios
    B: Sí, pero solo durante los primeros 30 minutos
    C: No, no eximen al titular de las tarifas de los parquímetros
    D: Sí, si la persona con discapacidad está conduciendo
  answer: C
  explanation: Las placas de matrícula para personas con discapacidades NO eximen
    al titular autorizado de las tarifas de los parquímetros ni de las limitaciones
    de tiempo en los mismos.
- id: 356
  category: vehicle_information
  question: ¿Bajo qué condición se puede utilizar un cartel de estacionamiento para
    personas con discapacidad en un vehículo?
  choices:
    A: Solo si la persona con discapacidad es el conductor del vehículo
    B: En cualquier momento que el vehículo esté realizando mandados para la persona
      con discapacidad
    C: Solo si la persona con discapacidad está presente y entrando o saliendo del
      vehículo
    D: Siempre que el vehículo esté estacionado en el estacionamiento de una tienda
      minorista
  answer: C
  explanation: Los carteles de estacionamiento para personas con discapacidad solo
    pueden usarse en un vehículo si la persona con discapacidad está presente y entrando
    o saliendo del vehículo mientras está estacionado en un espacio de estacionamiento
    accesible designado.
- id: 357
  category: vehicle_information
  question: ¿Qué tipo de cartel de estacionamiento para personas con discapacidad
    exime al titular autorizado de las tarifas de los parquímetros y de las limitaciones
    de tiempo que excedan los 30 minutos?
  choices:
    A: Cartel permanente
    B: Cartel permanente exento de parquímetro
    C: Cartel temporal
    D: Cartel de organización
  answer: B
  explanation: El cartel permanente exento de parquímetro exime al titular de las
    tarifas de los parquímetros y de las limitaciones de tiempo en los parquímetros
    que excedan un límite de tiempo de 30 minutos.
- id: 358
  category: vehicle_information
  question: ¿Cuál es el tiempo máximo de validez de un cartel de estacionamiento temporal
    para personas con discapacidad si es emitido por un municipio local?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Un cartel temporal es válido por el tiempo indicado por el médico certificador,
    sin exceder los seis meses si es emitido por el Secretario de Estado y los 90
    días si es emitido por un municipio local.
- id: 359
  category: license_system
  question: ¿Qué clasificación se utiliza para categorizar las licencias de conducir
    en Illinois?
  choices:
    A: Clasificación de velocidad máxima
    B: Clasificación de peso bruto del vehículo (GVWR)
    C: Clasificación de cilindrada del motor
    D: Clasificación de capacidad de pasajeros
  answer: B
  explanation: Según el manual, las licencias de conducir se clasifican según la clasificación
    de peso bruto del vehículo (GVWR) del vehículo del operador.
- id: 360
  category: license_system
  question: 'Una licencia de conducir Clase A se aplica a cualquier combinación de
    vehículos motorizados con una clasificación de peso bruto combinado (GCWR) de
    al menos 26,001 libras, siempre que el vehículo remolcado exceda las:'
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 20,000 libras
  answer: B
  explanation: Una licencia Clase A es para cualquier combinación de vehículos motorizados
    con un GCWR de 26,001 libras o más, siempre que el vehículo remolcado exceda las
    10,000 libras.
- id: 361
  category: license_system
  question: ¿Qué clasificación de licencia se requiere para un solo vehículo motorizado
    con una clasificación de peso bruto vehicular (GVWR) de 26,001 libras o más que
    remolca a otro vehículo que no exceda las 10,000 libras?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: B
  explanation: Una licencia de Clase B es para cualquier vehículo motorizado individual
    con un GVWR de 26,001 libras o más, o cualquier vehículo de este tipo que remolque
    a otro que no exceda las 10,000 libras.
- id: 362
  category: license_system
  question: ¿Para cuántos pasajeros, incluyendo al conductor, debe estar diseñado
    un vehículo para que se requiera una licencia de conducir de Clase C?
  choices:
    A: 8 o más
    B: 10 o más
    C: 12 o más
    D: 16 o más
  answer: D
  explanation: Se requiere una licencia de Clase C para cualquier vehículo diseñado
    para transportar a 16 o más pasajeros, incluyendo al conductor.
- id: 363
  category: license_system
  question: 'Además de ciertos límites de peso y pasajeros, se requiere una licencia
    de Clase C para operar un vehículo que:'
  choices:
    A: Se utiliza para operaciones agrícolas
    B: Transporta materiales peligrosos que requieren carteles de señalización (placarding)
    C: Remolca un vehículo de más de 10,000 libras
    D: Tiene un ciclo impulsado por motor acoplado
  answer: B
  explanation: Una licencia de Clase C se aplica a los vehículos que transportan materiales
    peligrosos que requieren carteles de señalización (placarding).
- id: 364
  category: license_system
  question: 'Una licencia de conducir de Clase D le permite operar cualquier vehículo
    motorizado con un GVWR de:'
  choices:
    A: 10,000 libras o menos
    B: 16,000 libras o menos
    C: 26,000 libras o menos
    D: 32,000 libras o menos
  answer: C
  explanation: Una licencia de Clase D es para cualquier vehículo motorizado con un
    GVWR de 16,000 libras o menos, excepto aquellos que requieren una licencia de
    Clase A, B, C, L o M.
- id: 365
  category: license_system
  question: ¿Cuál es el desplazamiento máximo del motor para un ciclo impulsado por
    motor operado bajo una licencia de Clase L?
  choices:
    A: Menos de 50cc
    B: Menos de 100cc
    C: Menos de 150cc
    D: Menos de 250cc
  answer: C
  explanation: Una licencia de Clase L es para cualquier ciclo impulsado por motor
    con un desplazamiento de menos de 150cc.
- id: 366
  category: license_system
  question: ¿Qué clasificación de licencia de conducir se requiere para operar cualquier
    motocicleta o ciclo impulsado por motor, independientemente del desplazamiento
    del motor?
  choices:
    A: Clase C
    B: Clase D
    C: Clase L
    D: Clase M
  answer: D
  explanation: Se requiere una licencia de Clase M para cualquier motocicleta o ciclo
    impulsado por motor.
- id: 367
  category: license_system
  question: Para ser elegible para una Licencia Probatoria durante un período de suspensión,
    ¿qué edad mínima debe tener el conductor?
  choices:
    A: '18'
    B: '21'
    C: '25'
    D: '65'
  answer: B
  explanation: Una Licencia Probatoria otorga privilegios de conducción completos
    durante un período de suspensión para un conductor de 21 años o más.
- id: 368
  category: penalties_and_points
  question: Una Licencia Probatoria solo puede emitirse a una persona que haya sido
    suspendida por ¿cuántas infracciones de tránsito en un período de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: La Licencia Probatoria solo puede emitirse a una persona suspendida
    por tres infracciones de tránsito en un período de 12 meses.
- id: 369
  category: license_system
  question: ¿Cuál es la duración máxima por la cual se puede emitir una Licencia Probatoria?
  choices:
    A: Un mes
    B: Tres meses
    C: Seis meses
    D: Doce meses
  answer: B
  explanation: Una Licencia Probatoria no puede emitirse por más de tres meses.
- id: 370
  category: license_system
  question: 'Se puede emitir una Licencia de Conducir Local Restringida a un conductor
    que viva en una comunidad con una población de menos de:'
  choices:
    A: 1,000 residentes
    B: 3,500 residentes
    C: 5,000 residentes
    D: 10,000 residentes
  answer: B
  explanation: Se emite una Licencia de Conducir Local Restringida a un conductor
    que vive en una comunidad con menos de 3,500 residentes y conduce solo dentro
    de ciertas áreas de la comunidad.
- id: 371
  category: license_system
  question: ¿Qué tipo de licencia especial otorga privilegios de conducción completos
    junto con una actividad de mejora del conductor durante un período de suspensión?
  choices:
    A: Licencia de conducir local restringida
    B: Licencia probatoria
    C: Licencia Clase D
    D: Licencia de conducir para visitante temporal
  answer: B
  explanation: Se emite una Licencia Probatoria junto con una actividad de mejora
    del conductor que otorga privilegios de conducción completos durante un período
    de suspensión.
- id: 372
  category: license_system
  question: Según el manual del conductor de Illinois, ¿qué dos clasificaciones de
    licencia generalmente requieren una Licencia de Conducir Comercial (CDL)?
  choices:
    A: Clase A y Clase B
    B: Clase B y Clase C
    C: Clase C y Clase D
    D: Clase L y Clase M
  answer: A
  explanation: El manual señala que generalmente se requiere una CDL tanto para las
    licencias de Clase A como para las de Clase B.
- id: 373
  category: license_system
  question: ¿Cuál es el período máximo de tiempo por el cual se puede emitir una Licencia
    Probatoria?
  choices:
    A: Un mes
    B: Tres meses
    C: Seis meses
    D: Un año
  answer: B
  explanation: El manual establece que una Licencia Probatoria no puede emitirse por
    más de tres meses.
- id: 374
  category: license_system
  question: ¿Cuál es una regla general con respecto a los documentos de identificación
    aceptables presentados para verificación?
  choices:
    A: Se aceptan fotocopias si están notarizadas
    B: No se aceptan fotocopias
    C: Los documentos vencidos siempre se aceptan
    D: Se prefieren las copias digitales en un teléfono inteligente
  answer: B
  explanation: De acuerdo con las pautas de documentos de identificación aceptables,
    no se aceptan fotocopias y todos los documentos aceptables presentados para verificación
    o prueba deben ser válidos (vigentes y no vencidos).
- id: 375
  category: license_system
  question: ¿Cuál de las siguientes tarjetas de crédito de marcas principales NO figura
    explícitamente como aceptable para la verificación de firma (Grupo A)?
  choices:
    A: Visa
    B: Mastercard
    C: Discover
    D: Capital One
  answer: D
  explanation: Las tarjetas de crédito de marcas principales aceptables (solo para
    verificación de firma) incluyen American Express, Diners Club, Discover, Mastercard
    y Visa.
- id: 376
  category: license_system
  question: ¿Qué se requiere para que un certificado de nacimiento sea aceptado como
    un documento del Grupo B (Fecha de nacimiento)?
  choices:
    A: Debe ser una fotocopia firmada por un padre
    B: Debe ser original o certificado por una Junta de Salud o una Oficina de Estadísticas
      Vitales
    C: Debe ser emitido por un hospital
    D: Debe estar notarizado por un banco local
  answer: B
  explanation: Los certificados de nacimiento deben ser originales o certificados
    por una Junta de Salud o una Oficina de Estadísticas Vitales dentro de los EE.
    UU. o por el Departamento de Estado de los EE. UU., los territorios de los EE.
    UU. o Canadá.
- id: 377
  category: license_system
  question: ¿Bajo qué condición se acepta un pasaporte extranjero como prueba de fecha
    de nacimiento (Grupo B)?
  choices:
    A: Si es traducido al inglés por un traductor certificado
    B: Si va acompañado de cualquier otro elemento del Grupo B
    C: Si fue emitido dentro de los últimos 5 años
    D: Los pasaportes extranjeros nunca se aceptan para el Grupo B
  answer: B
  explanation: Los pasaportes extranjeros y los certificados de nacimiento se aceptan
    como prueba si van acompañados de cualquier otro elemento del Grupo B.
- id: 378
  category: license_system
  question: Si un solicitante está solicitando una Licencia de Conducir para Visitante
    Temporal (TVDL), ¿qué debe hacer con respecto a los documentos del Grupo C (Número
    de Seguro Social)?
  choices:
    A: Proporcionar un formulario W-2 en su lugar
    B: Firmar una declaración de que no es elegible para obtener un número de Seguro
      Social
    C: Proporcionar una carta de su empleador
    D: Presentar una declaración de impuestos extranjera
  answer: B
  explanation: Un solicitante que solicita una TVDL no está obligado a presentar documentos
    del Grupo C. En su lugar, el solicitante debe firmar una declaración en la solicitud
    de TVDL de que no es elegible para obtener un número de Seguro Social.
- id: 379
  category: license_system
  question: ¿Cuántos documentos del Grupo D (Residencia) se requieren para solicitar
    una REAL ID?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: De acuerdo con las pautas del Grupo D, se requieren dos documentos
    de residencia para la REAL ID.
- id: 380
  category: license_system
  question: ¿Las tarjetas consulares solo se aceptan para la residencia (Grupo D)
    si son de cuál de los siguientes grupos de países?
  choices:
    A: Canadá, México y el Reino Unido
    B: Brasil, Colombia, Ecuador, Guatemala y México
    C: Cualquier país de la Unión Europea
    D: Cualquier país que emita una tarjeta consular
  answer: B
  explanation: Solo se aceptan tarjetas consulares de Brasil, Colombia, Ecuador, Guatemala
    y México, ya que esos países emiten tarjetas de conformidad con la Ley de Documentos
    de Identificación Consular.
- id: 381
  category: license_system
  question: ¿Cuál de los siguientes documentos se considera INACEPTABLE para fines
    de identificación?
  choices:
    A: Cheque cancelado dentro de los últimos 90 días
    B: Tarjeta de Medicare
    C: Tarjeta FOID de Illinois
    D: Formulario W-2
  answer: C
  explanation: La tarjeta FOID de Illinois figura explícitamente en la sección de
    "Documentos inaceptables".
- id: 382
  category: license_system
  question: ¿Cuál de las siguientes tarjetas NO será aceptada como prueba de identificación
    por la Secretaría del Estado?
  choices:
    A: Tarjeta de identificación de colegio o universidad
    B: Licencia de conducir militar de EE. UU.
    C: Tarjeta de Seguro Social
    D: Certificado del Programa Cooperativo de Exámenes de Conducir
  answer: A
  explanation: Una tarjeta de identificación de colegio o universidad figura en la
    lista de "Documentos inaceptables".
- id: 383
  category: license_system
  question: ¿Qué información DEBE contener un documento del Grupo D (Residencia)?
  choices:
    A: El nombre completo y la fecha de nacimiento del solicitante
    B: El nombre completo y la dirección de residencia del solicitante
    C: La firma y el número de Seguro Social del solicitante
    D: Una fotografía del solicitante y su dirección
  answer: B
  explanation: Los documentos del Grupo D deben contener el nombre completo y la dirección
    de residencia del solicitante.
- id: 384
  category: license_system
  question: Después de revisar toda la identificación presentada, ¿quién tiene el
    derecho de aceptar o rechazar cualquier documento?
  choices:
    A: El departamento de policía local
    B: El abogado del solicitante
    C: La gerencia de la Secretaría del Estado
    D: El gobierno federal
  answer: C
  explanation: Después de revisar toda la identificación presentada, la gerencia de
    la Secretaría del Estado tiene el derecho de aceptar o rechazar cualquier documento.
- id: 385
  category: license_system
  question: Si se utiliza una licencia de conducir de Illinois o un registro de identificación
    para el Grupo C (Número de Seguro Social), ¿qué condición debe cumplirse?
  choices:
    A: El registro debe estar impreso en papel con membrete oficial
    B: El número de Seguro Social debe haber sido verificado previamente con la SSA
    C: El solicitante también debe presentar un certificado de nacimiento
    D: La identificación debe haber sido emitida dentro de los últimos 30 días
  answer: B
  explanation: Si se utiliza una licencia de conducir de Illinois o un registro de
    identificación, el número de Seguro Social debe haber sido verificado previamente
    con la SSA.
- id: 386
  category: license_system
  question: ¿Qué información deben contener los documentos de identificación del Grupo
    B?
  choices:
    A: El nombre del solicitante y su número de Seguro Social completo
    B: El nombre completo del solicitante y su fecha de nacimiento completa
    C: El nombre completo del solicitante y su dirección de residencia
    D: La firma y la fotografía del solicitante
  answer: B
  explanation: Según el manual, los documentos del Grupo B deben contener el nombre
    completo del solicitante y su fecha de nacimiento completa, y deben ser verificables.
- id: 387
  category: license_system
  question: ¿Se aceptan fotocopias de los documentos de identificación al solicitar
    una licencia de conducir o identificación?
  choices:
    A: Sí, si están ante notario
    B: Sí, pero solo para los documentos de residencia del Grupo D
    C: No, no se aceptan fotocopias
    D: Sí, si son claras y legibles
  answer: C
  explanation: 'El manual establece explícitamente en letras mayúsculas y negrita:
    "NO SE ACEPTAN FOTOCOPIAS".'
- id: 388
  category: license_system
  question: ¿Qué información se requiere que aparezca en los documentos de identificación
    del Grupo C?
  choices:
    A: El nombre del solicitante y su número de Seguro Social completo
    B: El nombre completo del solicitante y su fecha de nacimiento
    C: El nombre del solicitante y su dirección actual
    D: El nombre completo del solicitante y su firma
  answer: A
  explanation: El manual establece que los documentos del Grupo C deben contener el
    nombre del solicitante y su número de Seguro Social completo.
- id: 389
  category: license_system
  question: ¿Cómo cumple un solicitante de una Licencia de Conducir para Visitante
    Temporal (TVDL) con el requisito de documentos del Grupo C?
  choices:
    A: Deben proporcionar una tarjeta de Seguro Social válida.
    B: Deben proporcionar un formulario W-2 de su empleador.
    C: Están exentos de todos los requisitos de identificación.
    D: Deben firmar una declaración indicando que no son elegibles para obtener un
      número de Seguro Social.
  answer: D
  explanation: Un solicitante que solicita una TVDL no está obligado a presentar documentos
    del Grupo C. En su lugar, debe firmar una declaración en la solicitud indicando
    que no es elegible para obtener un número de Seguro Social.
- id: 390
  category: license_system
  question: ¿Bajo qué condición se aceptan los pasaportes extranjeros y los certificados
    de nacimiento como prueba de identificación?
  choices:
    A: Solo si están traducidos por un traductor certificado
    B: Si van acompañados de cualquier otro artículo del Grupo B
    C: Solo si fueron emitidos dentro de los últimos 5 años
    D: No se aceptan nunca bajo ninguna circunstancia
  answer: B
  explanation: Los pasaportes extranjeros y los certificados de nacimiento se aceptan
    como prueba si van acompañados de cualquier otro artículo del Grupo B.
- id: 391
  category: license_system
  question: ¿Cuál es un requisito general para todos los documentos aceptables presentados
    para verificación o prueba?
  choices:
    A: Deben haber sido emitidos en los últimos 30 días
    B: Deben ser válidos (vigentes y no vencidos)
    C: Deben estar notarizados por un notario de Illinois
    D: Deben estar laminados para su protección
  answer: B
  explanation: 'El manual establece: ''Todos los documentos aceptables presentados
    para verificación o prueba deben ser válidos (vigentes y no vencidos)''.'
- id: 392
  category: license_system
  question: ¿Cuál de los siguientes figura como un Servicio para Conductores (Driver
    Service) en línea?
  choices:
    A: Renovación de placas de matrícula
    B: Estado de título y registro
    C: Renovación de Conductor Seguro (Safe Driver Renewal)
    D: Solicitud de reembolso
  answer: C
  explanation: La Renovación de Conductor Seguro (Safe Driver Renewal) aparece en
    la sección de 'Servicios para Conductores' de la lista de servicios en línea,
    mientras que los otros son Servicios para Vehículos.
- id: 393
  category: license_system
  question: ¿Qué antigüedad debe tener un estado de cuenta bancario para ser aceptado
    como un documento del Grupo D?
  choices:
    A: Con fecha dentro de los 30 días anteriores a la solicitud
    B: Con fecha dentro de los 60 días anteriores a la solicitud
    C: Con fecha dentro de los 90 días anteriores a la solicitud
    D: Con fecha dentro de los 12 meses anteriores a la solicitud
  answer: C
  explanation: El manual especifica que un estado de cuenta bancario debe tener una
    fecha dentro de los 90 días anteriores a la solicitud.
- id: 394
  category: license_system
  question: ¿Las tarjetas consulares de cuál de los siguientes grupos de países se
    aceptan como identificación?
  choices:
    A: Canadá, Reino Unido, Francia, Alemania y España
    B: Brasil, Colombia, Ecuador, Guatemala y México
    C: Cualquier país que tenga una embajada de EE. UU.
    D: Solo México y Canadá
  answer: B
  explanation: Solo se aceptan tarjetas consulares de Brasil, Colombia, Ecuador, Guatemala
    y México, ya que esos países emiten tarjetas que cumplen con la Ley de Documentos
    de Identificación Consular.
- id: 395
  category: license_system
  question: ¿Puede un solo documento de identificación satisfacer los requisitos de
    más de un Grupo?
  choices:
    A: Sí, un documento puede satisfacer a más de un Grupo.
    B: No, cada Grupo requiere un documento completamente separado.
    C: Sí, pero solo para los Grupos A y B.
    D: No, a menos que sea aprobado específicamente por un gerente de la instalación.
  answer: A
  explanation: 'El manual establece explícitamente: ''Un documento puede satisfacer
    a más de un Grupo''.'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Hacer un alto total
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe hacer
    un alto total en la línea de parada, el cruce de peatones o antes de entrar a
    la intersección. Revise el tráfico y los peatones antes de continuar.
  id: 396
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Hacer un alto total
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen con seguridad.
  id: 397
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de
    forma segura.
  id: 398
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 399
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 400
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Dar una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 401
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que deben hacer los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 402
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 403
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 404
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 405
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 406
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 407
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 408
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 409
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 410
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 411
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 412
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel (placard) o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel de estacionamiento para personas con discapacidad o una placa de matrícula
    válida pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 413
