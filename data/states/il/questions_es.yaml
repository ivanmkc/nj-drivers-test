- id: 148
  category: alcohol_drugs_health
  question: Si es menor de 21 años y lo sorprenden comprando o poseyendo alcohol en
    Illinois, ¿qué sucede con sus privilegios de conducir?
  choices:
    A: Nada, siempre que no estuviera conduciendo
