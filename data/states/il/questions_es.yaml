questions:
- id: 1
  category: license_system
  question: En Illinois, ¿cuánto tiempo debe un conductor menor de 18 años tener un
    permiso de instrucción antes de poder solicitar una licencia de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: C
  explanation: Según el programa de Licencia de Conducir Graduada (GDL) de Illinois,
    los titulares de permisos menores de 18 años deben tener su permiso de instrucción
    por un mínimo de nueve meses antes de obtener una licencia.
- id: 2
  category: license_system
  question: Para obtener una licencia de conducir de Illinois, ¿cuántas horas de práctica
    al volante debe completar un titular de permiso menor de 18 años?
  choices:
    A: 30 horas en total, incluyendo 5 horas de noche
    B: 40 horas en total, incluyendo 10 horas de noche
    C: 50 horas en total, incluyendo 10 horas de noche
    D: 60 horas en total, incluyendo 15 horas de noche
  answer: C
  explanation: La ley de Illinois requiere 50 horas de práctica de manejo, las cuales
    deben incluir 10 horas de manejo nocturno, supervisadas por un adulto de 21 años
    o más.
- id: 3
  category: license_system
  question: Bajo el programa GDL de Illinois, ¿cuáles son las restricciones de manejo
    nocturno para conductores de 16 y 17 años los viernes y sábados por la noche?
  choices:
    A: 9 p.m. a 6 a.m.
    B: 10 p.m. a 6 a.m.
    C: 11 p.m. a 6 a.m.
    D: Medianoche a 5 a.m.
  answer: C
  explanation: Para los conductores de 16 a 17 años, las restricciones de manejo nocturno
    son de 10 p.m. a 6 a.m. de domingo a jueves, y de 11 p.m. a 6 a.m. los viernes
    y sábados.
- id: 4
  category: license_system
  question: Durante los primeros 12 meses de la licencia, o hasta que el conductor
    cumpla 18 años, ¿a cuántos pasajeros menores de 20 años está limitado un conductor
    (excluyendo a la familia)?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Sin límite, siempre que usen cinturones de seguridad
  answer: A
  explanation: Durante los primeros 12 meses de la licencia o hasta que el conductor
    cumpla 18 años, el número de pasajeros se limita a una persona menor de 20 años,
    a menos que el pasajero o pasajeros sean hermanos, hermanastros, hijos o hijastros
    del conductor.
- id: 5
  category: license_system
  question: Si cambia su nombre o dirección en Illinois, ¿dentro de cuántos días debe
    notificar a la oficina de la Secretaría de Estado sobre un cambio de dirección?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Illinois exige que notifique a la Secretaría de Estado sobre
    un cambio de dirección dentro de los 10 días. Los cambios de nombre deben informarse
    dentro de los 30 días.
- id: 6
  category: license_system
  question: En Illinois, ¿a qué edad puede una persona inscribirse por primera vez
    en el Registro de Donantes de Órganos y Tejidos de Consentimiento de Primera Persona?
  choices:
    A: '15'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: Los residentes de Illinois de 16 años o más pueden inscribirse en el
    Registro de Donantes de Órganos y Tejidos de Consentimiento de Primera Persona
    cuando soliciten su licencia de conducir o tarjeta de identificación.
- id: 7
  category: license_system
  question: Se prohíbe a las personas menores de 19 años usar un teléfono celular
    mientras conducen en Illinois, excepto en ¿qué situación?
  choices:
    A: Al usar un dispositivo de manos libres
    B: Al estar detenido en un semáforo en rojo
    C: Para contactar a una agencia del orden público o servicios de emergencia
    D: Al conducir en una carretera rural
  answer: C
  explanation: La ley de Illinois prohíbe el uso de todos los teléfonos celulares
    (portátiles o de manos libres) para conductores menores de 19 años, excepto en
    caso de una emergencia para contactar a las autoridades o a los servicios de emergencia.
- id: 8
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de instrucción de Illinois?
  choices:
    A: '14'
    B: '15'
    C: 15 años y 6 meses
    D: '16'
  answer: B
  explanation: La edad mínima para obtener un permiso de instrucción en Illinois es
    de 15 años, siempre que el solicitante esté inscrito en un curso de educación
    vial aprobado o lo haya completado.
- id: 9
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de instrucción de Illinois?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: Hasta que el conductor cumpla 21 años
  answer: B
  explanation: Un permiso de instrucción de Illinois es válido por dos años y debe
    mantenerse durante al menos nueve meses antes de que se pueda emitir una licencia
    a alguien menor de 18 años.
- id: 10
  category: license_system
  question: Los nuevos residentes que se muden a Illinois y tengan una licencia de
    conducir válida de otro estado deben solicitar una licencia de Illinois ¿dentro
    de cuántos días?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Los nuevos residentes deben solicitar una licencia de conducir de Illinois
    dentro de los 90 días posteriores a establecer su residencia en el estado.
- id: 11
  category: license_system
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido para un vehículo motorizado en Illinois?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: La ley de Illinois requiere un seguro de responsabilidad civil mínimo
    de $25,000 por lesiones o muerte de una persona, $50,000 por lesiones o muerte
    de más de una persona y $20,000 por daños a la propiedad.
- id: 12
  category: license_system
  question: 'Bajo la ley de Tolerancia Cero de Illinois, a un conductor menor de 21
    años se le suspenderán sus privilegios de conducir si es sorprendido con un nivel
    de alcohol en sangre (BAC) de:'
  choices:
    A: 0.01% o más
    B: 0.02% o más
    C: 0.05% o más
    D: Más de 0.00%
  answer: D
  explanation: Illinois tiene una ley de Tolerancia Cero para conductores menores
    de 21 años, lo que significa que cualquier rastro de alcohol (un BAC de más de
    0.00) resultará en la suspensión de los privilegios de conducir.
- id: 13
  category: license_system
  question: ¿Por cuántos años es válida normalmente una licencia de conducir de Illinois
    para una persona de entre 21 y 80 años?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: B
  explanation: Para la mayoría de los conductores de entre 21 y 80 años, la licencia
    de conducir de Illinois es válida por cuatro años y vence el día del cumpleaños
    del conductor.
- id: 14
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como prueba de residencia
    para una licencia de conducir estándar de Illinois?
  choices:
    A: Una factura de servicios públicos emitida dentro de los 90 días
    B: Un estado de cuenta bancario emitido dentro de los 90 días
    C: Una carta escrita a mano por un amigo
    D: Un expediente académico escolar certificado
  answer: C
  explanation: La prueba de residencia debe ser documentación oficial, como facturas
    de servicios públicos, estados de cuenta bancarios o expedientes escolares. La
    Secretaría de Estado no acepta cartas personales escritas a mano.
- id: 15
  category: license_system
  question: Un nuevo residente de Illinois debe registrar su vehículo en el estado
    dentro de ¿cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Aunque un nuevo residente tiene 90 días para obtener una licencia de
    conducir de Illinois, debe registrar su vehículo y obtener las placas de Illinois
    en un plazo de 30 días.
- id: 16
  category: license_system
  question: Bajo el Programa Cooperativo de Exámenes de Conducir de Illinois, los
    estudiantes de secundaria pueden estar exentos del examen de manejo de la Secretaría
    de Estado si obtienen ¿qué calificación tanto en la parte teórica como en la de
    práctica al volante de la educación vial?
  choices:
    A: A
    B: A o B
    C: C o superior
    D: Solo aprobado/reprobado (Pass/Fail)
  answer: B
  explanation: Los estudiantes de secundaria que obtengan una A o B tanto en la parte
    teórica como en la de práctica al volante de un curso de educación vial acreditado
    pueden estar exentos del examen de manejo al momento de obtener la licencia.
- id: 17
  category: license_system
  question: En Illinois, ¿con qué frecuencia debe renovar su licencia de conducir
    un conductor de entre 81 y 86 años?
  choices:
    A: Cada año
    B: Cada 2 años
    C: Cada 4 años
    D: Cada 8 años
  answer: B
  explanation: Los conductores de 81 a 86 años deben renovar su licencia de conducir
    de Illinois cada dos años. Los conductores de 87 años o más deben renovarla anualmente.
- id: 18
  category: license_system
  question: A un conductor de Illinois menor de 21 años se le suspenderá la licencia
    si es condenado por ¿cuántas infracciones de tránsito en movimiento dentro de
    cualquier período de 24 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: A
  explanation: Bajo el programa de Licencia de Conducir Graduada (GDL) de Illinois,
    a los conductores menores de 21 años que sean condenados por dos o más infracciones
    de tránsito en movimiento en un período de 24 meses se les suspenderán sus privilegios
    de conducir.
- id: 19
  category: license_system
  question: ¿Cuál es la agudeza visual mínima requerida en al menos un ojo, con o
    sin lentes correctivos, para obtener una licencia de conducir de Illinois sin
    restricción de conducción diurna?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Illinois requiere una agudeza visual mínima de 20/40 en al menos un
    ojo. Los solicitantes con una agudeza de 20/41 a 20/70 están limitados a conducir
    únicamente durante el día.
- id: 20
  category: license_system
  question: 'Una licencia de conducir estándar Clase D de Illinois le permite operar
    un vehículo con una Clasificación de Peso Bruto Vehicular (GVWR) de:'
  choices:
    A: 8,000 libras o menos
    B: 16,000 libras o menos
    C: 26,000 libras o menos
    D: Cualquier peso, siempre que no sea un camión semirremolque
  answer: B
  explanation: En Illinois, una licencia Clase D es para cualquier vehículo motorizado
    con un GVWR de 16,000 libras o menos, excepto aquellos que requieran una licencia
    Clase A, B o C o una clasificación de motocicleta L o M.
- id: 21
  category: license_system
  question: Si un conductor de Illinois es menor de 18 años y desea solicitar una
    licencia, su solicitud debe estar firmada por un padre o tutor legal. ¿Quién tiene
    el derecho de retirar este consentimiento en cualquier momento hasta que el conductor
    cumpla 18 años?
  choices:
    A: Solo el Secretario de Estado
    B: Solo un juez
    C: El padre o tutor legal que firmó la solicitud
    D: Cualquier familiar adulto
  answer: C
  explanation: El padre o tutor legal que firmó la solicitud de la licencia de un
    menor puede retirar el consentimiento en cualquier momento visitando una instalación
    de Servicios al Conductor (Driver Services), lo que resultará en la cancelación
    de la licencia del menor.
- id: 22
  category: license_system
  question: En Illinois, ¿cuál es el requisito mínimo de visión periférica (lateral)
    para tener una licencia de conducir sin restricciones adicionales?
  choices:
    A: 90 grados
    B: 110 grados
    C: 140 grados
    D: 180 grados
  answer: C
  explanation: Illinois requiere una visión periférica total de al menos 140 grados
    (la suma de ambos ojos) o 70 grados a la izquierda y 70 grados a la derecha desde
    el centro para una licencia sin restricciones.
- id: 23
  category: license_system
  question: ¿Qué clasificación de licencia de Illinois se requiere específicamente
    para operar una motocicleta con un desplazamiento de motor de más de 150cc?
  choices:
    A: Clase L
    B: Clase M
    C: Clase C
    D: Clase D con un endoso de motocicleta
  answer: B
  explanation: En Illinois, la Clase L es para ciclos impulsados por motor con menos
    de 150cc de desplazamiento. La Clase M es necesaria para cualquier motocicleta
    con un desplazamiento de motor de 150cc o más.
- id: 24
  category: license_system
  question: 'De acuerdo con la ley de Illinois, los solicitantes masculinos de entre
    18 y 25 años que solicitan una licencia de conducir o una tarjeta de identificación:'
  choices:
    A: Están obligados a pagar una 'tarifa de servicio' adicional
    B: Son registrados automáticamente en el Sistema de Servicio Selectivo (Selective
      Service System)
    C: Están exentos del examen escrito
    D: Están obligados a proporcionar prueba de alistamiento militar
  answer: B
  explanation: La ley de Illinois exige que el Secretario de Estado proporcione al
    Sistema de Servicio Selectivo la información necesaria para registrar a los solicitantes
    masculinos de entre 18 y 25 años que soliciten una licencia o identificación.
- id: 25
  category: license_system
  question: ¿Por cuántos años es válida una Licencia de Conducir para Visitante Temporal
    (TVDL) emitida en Illinois?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 4 años
  answer: C
  explanation: Una TVDL de Illinois es válida por tres años o por el período de tiempo
    que la persona esté autorizada a permanecer en los EE. UU., lo que termine primero.
- id: 26
  category: license_system
  question: Si es menor de 18 años y solicita un permiso de instrucción de Illinois,
    debe estar inscrito en un curso de educación vial. ¿Cuál es el otro requisito
    educativo?
  choices:
    A: Debe tener un promedio de calificaciones (GPA) de 3.0
    B: Debe estar inscrito en la escuela secundaria o tener un diploma de secundaria/GED
    C: Debe haber completado al menos 10 horas de servicio comunitario
    D: No hay otros requisitos educativos
  answer: B
  explanation: La ley de Illinois exige que un menor debe estar inscrito en la escuela
    y no ser un ausente escolar crónico, o tener un diploma de escuela secundaria
    o GED, para recibir una licencia de conducir.
- id: 27
  category: license_system
  question: En Illinois, si pierde su licencia de conducir, debe visitar una instalación
    de Servicios al Conductor y pagar una tarifa para obtener un duplicado. ¿Cuál
    es la tarifa estándar para una licencia duplicada para un conductor de 21 años
    o más?
  choices:
    A: $5
    B: $10
    C: $20
    D: $30
  answer: A
  explanation: 'La tarifa por un duplicado de la licencia de conducir en Illinois
    para la mayoría de los conductores es de $5. (Nota: Las tarifas están sujetas
    a cambios, pero $5 es el estándar de larga data para duplicados en las Reglas
    del Camino de IL).'
- id: 28
  category: license_system
  question: Al realizar el examen de manejo en Illinois, ¿de cuál de los siguientes
    es responsable el solicitante?
  choices:
    A: Un vehículo que tenga la licencia adecuada y sea seguro para su operación
    B: Un instructor de manejo certificado para sentarse en el asiento trasero
    C: Una grabación de cámara de tablero (dash-cam) de la prueba
    D: Un mapa impreso de la ruta de la prueba
  answer: A
  explanation: El solicitante es responsable de proporcionar un vehículo que tenga
    la licencia adecuada, esté asegurado y en condiciones de funcionamiento seguras
    para el examen de manejo. El examinador realizará una verificación de seguridad
    antes de que comience la prueba.
- id: 29
  category: license_system
  question: Si tiene una afección médica que pueda causar la pérdida del conocimiento
    (como epilepsia o diabetes), debe proporcionar un informe médico al Secretario
    de Estado. ¿Cuánto tiempo tiene para notificar al Secretario de Estado después
    de ser diagnosticado con tal afección?
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: La ley de Illinois exige que los conductores notifiquen al Secretario
    de Estado dentro de los 10 días posteriores a tener conocimiento de cualquier
    afección médica que pueda causar la pérdida del conocimiento.
- id: 30
  category: license_system
  question: En Illinois, ¿cuántos intentos en cada sección del examen de conducir
    (visión, escrito y práctico) se permiten dentro de un año a partir de la fecha
    en que se paga la tarifa de solicitud?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ilimitados
  answer: C
  explanation: Los solicitantes tienen permitido tres intentos para aprobar cada sección
    del examen de conducir dentro de un año a partir de la fecha en que se pagó la
    tarifa de solicitud.
- id: 31
  category: driver_testing
  question: ¿Para cumplir con los requisitos de visión periférica para una licencia
    de conducir de Illinois, un solicitante debe tener al menos qué campo visual total?
  choices:
    A: 100 grados
    B: 120 grados
    C: 140 grados
    D: 180 grados
  answer: C
  explanation: Illinois requiere una visión periférica total de al menos 140 grados
    para calificar para una licencia sin restricciones.
- id: 32
  category: driver_testing
  question: Durante el examen de conducir de Illinois, ¿cuál de las siguientes acciones
    resultará en una reprobación automática?
  choices:
    A: No usar una luz de giro una vez
    B: Conducir sobre un bordillo (acera)
    C: Ajustar los espejos mientras está detenido
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: B
  explanation: En Illinois, cualquier acción peligrosa o violación de la ley, como
    conducir sobre un bordillo o causar un accidente, resulta en una reprobación automática
    del examen de conducir.
- id: 33
  category: driver_testing
  question: Al practicar con un permiso de instrucción en Illinois, ¿cuál de los siguientes
    requisitos debe cumplir el conductor supervisor?
  choices:
    A: Tener al menos 18 años y poseer una licencia válida
    B: Tener al menos 21 años, poseer una licencia válida para el tipo de vehículo
      que se conduce y tener al menos un año de experiencia de conducción
    C: Ser padre o tutor legal independientemente de la edad
    D: Tener al menos 25 años y no tener infracciones de tránsito en su historial
  answer: B
  explanation: La ley de Illinois exige que el conductor supervisor tenga al menos
    21 años, posea una licencia válida para la clase específica de vehículo y tenga
    al menos un año de experiencia de conducción.
- id: 34
  category: driver_testing
  question: Si un conductor de Illinois desarrolla una condición médica que pueda
    afectar su capacidad para conducir de manera segura, ¿dentro de cuántos días debe
    notificar a la oficina del Secretario de Estado?
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: La ley de Illinois exige que los conductores notifiquen al Secretario
    de Estado por escrito dentro de los 10 días posteriores a tener conocimiento de
    cualquier condición médica que pueda causar una pérdida de conocimiento o afectar
    de otro modo la conducción segura.
- id: 35
  category: driver_testing
  question: En Illinois, ¿con qué frecuencia deben renovar su licencia de conducir
    los conductores de 87 años o más?
  choices:
    A: Cada 4 años
    B: Cada 2 años
    C: Cada año
    D: Cada 6 meses
  answer: C
  explanation: Mientras que los conductores más jóvenes renuevan cada 4 años, Illinois
    exige que los conductores de 87 años o más renueven sus licencias anualmente.
- id: 36
  category: driver_testing
  question: ¿Cuántos intentos se le permiten a un solicitante de una licencia de conducir
    de Illinois para aprobar los exámenes escrito, de visión y de conducir dentro
    de un año del pago de la tarifa de solicitud?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Ilimitados
  answer: B
  explanation: El Secretario de Estado de Illinois permite a los solicitantes tres
    intentos para aprobar cada uno de los exámenes requeridos dentro de un año después
    de pagar la tarifa de solicitud.
- id: 37
  category: driver_testing
  question: ¿Cuál es la sanción para un conductor de Illinois condenado por proporcionar
    información falsa en una solicitud de licencia de conducir?
  choices:
    A: Una multa de $50
    B: Una suspensión de 3 meses
    C: Una suspensión o revocación mínima de 12 meses
    D: Una estancia obligatoria de 24 horas en la cárcel
  answer: C
  explanation: Las solicitudes fraudulentas o el suministro de información falsa al
    Secretario de Estado resultan en una suspensión o revocación mínima de 12 meses
    de los privilegios de conducir.
- id: 38
  category: driver_testing
  question: ¿Cuál de los siguientes debe presentarse al examinador antes de realizar
    el examen de conducir de Illinois?
  choices:
    A: Un vehículo con un registro vigente y comprobante de seguro
    B: Un vehículo con transmisión manual
    C: Una carta de recomendación de un instructor de manejo
    D: Una copia certificada del título del vehículo
  answer: A
  explanation: Para el examen de conducir, el solicitante debe proporcionar un vehículo
    que esté debidamente registrado, en condiciones seguras de funcionamiento y que
    tenga un comprobante de seguro válido.
- id: 39
  category: driver_testing
  question: ¿Cuál es la tarifa estándar para una licencia de conducir básica de Clase
    D de Illinois para un solicitante de entre 21 y 68 años?
  choices:
    A: $10
    B: $20
    C: $30
    D: $50
  answer: C
  explanation: La tarifa estándar para una licencia de conducir de Illinois para personas
    en el rango de edad de 21 a 68 años es de $30.
- id: 40
  category: driver_testing
  question: En Illinois, ¿para qué tipo de vehículo se requiere una licencia de Clase
    L?
  choices:
    A: Cualquier motocicleta de más de 150cc
    B: Un ciclo impulsado por motor con menos de 150cc de cilindrada
    C: Un camión comercial de más de 26,000 libras
    D: Solo una bicicleta eléctrica
  answer: B
  explanation: En Illinois, una licencia de Clase L es para ciclos impulsados por
    motor (ciclomotores y scooters) con una cilindrada de menos de 150cc, mientras
    que la Clase M es para motocicletas de 150cc o más.
- id: 41
  category: driver_testing
  question: Si un conductor de Illinois tiene visión en un solo ojo, ¿cuál es el requisito
    mínimo de visión periférica para que ese ojo apruebe el examen de la vista?
  choices:
    A: 70 grados
    B: 105 grados
    C: 140 grados
    D: 160 grados
  answer: B
  explanation: Los solicitantes con visión monocular (visión en un solo ojo) deben
    tener al menos 105 grados de visión periférica para calificar para una licencia
    de Illinois.
- id: 42
  category: driver_testing
  question: Durante el examen de conducir de Illinois, ¿cuál de las siguientes maniobras
    se le requerirá realizar al solicitante?
  choices:
    A: Una incorporación a alta velocidad a una autopista interestatal
    B: Retroceder el vehículo en línea recta durante aproximadamente 50 pies
    C: Un giro de 360 grados en una intersección residencial
    D: Conducir en reversa durante una cuadra completa
  answer: B
  explanation: El examen de conducir de Illinois incluye el requisito de retroceder
    el vehículo en línea recta por una distancia de aproximadamente 50 pies de manera
    suave y segura.
- id: 43
  category: driver_testing
  question: Bajo la ley 'Motor Voter' en Illinois, ¿cuándo puede una persona registrarse
    para votar en una instalación de Servicios al Conductor?
  choices:
    A: Solo durante los años de elecciones presidenciales
    B: Solo si son mayores de 21 años
    C: Al solicitar o renovar una licencia de conducir o tarjeta de identificación
    D: Solo si tienen un historial de conducción limpio
  answer: C
  explanation: Illinois permite que los ciudadanos elegibles se registren para votar
    o actualicen su registro al mismo tiempo que solicitan o renuevan su licencia
    de conducir o tarjeta de identificación.
- id: 44
  category: driver_testing
  question: Un conductor de Illinois menor de 21 años que tiene su licencia suspendida
    por dos infracciones de tránsito en movimiento puede ser elegible para una 'Licencia
    de Prueba' (Probationary License) para asistir a la escuela o al trabajo. ¿Cuál
    es un requisito para esto?
  choices:
    A: Debe tener al menos 18 años de edad
    B: Debe completar un Curso de Educación Vial Correctiva de 4 horas
    C: Debe pagar una multa de $500
    D: Debe tener a uno de sus padres viajando con ellos en todo momento
  answer: B
  explanation: Los conductores menores de 21 años que enfrentan una suspensión por
    dos infracciones de tránsito en movimiento dentro de un período de 24 meses pueden
    ser elegibles para una licencia de prueba si completan un curso de educación correctiva
    requerido.
- id: 45
  category: driver_testing
  question: 'Para calificar para una licencia de conducir de Illinois sin restricciones
    de visión periférica, un conductor debe tener una visión periférica combinada
    de al menos:'
  choices:
    A: 100 grados
    B: 120 grados
    C: 140 grados
    D: 170 grados
  answer: C
  explanation: De acuerdo con las Normas de Circulación de Illinois, un conductor
    debe tener al menos 140 grados de visión periférica (total de ambos ojos) para
    ser elegible para una licencia sin restricciones.
- id: 46
  category: driver_testing
  question: 'Si un solicitante es sorprendido haciendo trampa en el examen escrito
    de conducir de Illinois, se le prohibirá volver a tomar el examen durante al menos:'
  choices:
    A: 7 días
    B: 30 días
    C: 90 días
    D: Un año
  answer: B
  explanation: Si se descubre que un solicitante está haciendo trampa o utilizando
    asistencia no autorizada durante un examen, reprobará y se le prohibirá volver
    a tomar el examen durante 30 días.
- id: 47
  category: driver_testing
  question: 'Durante el examen de conducir de Illinois, el solicitante debe demostrar
    la capacidad de retroceder el vehículo en línea recta por una distancia de al
    menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El examen de conducir de Illinois requiere que los solicitantes retrocedan
    el vehículo en línea recta durante aproximadamente 50 pies, demostrando control
    y mirando por encima del hombro.
- id: 48
  category: driver_testing
  question: 'Se requiere una licencia de Illinois Clase L para cualquier ciclo impulsado
    por motor con una cilindrada de:'
  choices:
    A: Menos de 50cc
    B: Menos de 150cc
    C: 150cc o más
    D: Exactamente 250cc
  answer: B
  explanation: En Illinois, una licencia Clase L es para ciclos impulsados por motor
    con una cilindrada menor a 150cc. Se requiere una licencia Clase M para motocicletas
    de 150cc o más.
- id: 49
  category: driver_testing
  question: Si tiene una condición médica que pueda causar la pérdida del conocimiento,
    la ley de Illinois le exige que notifique a la Secretaría de Estado dentro de
    ¿cuántos días después de tener conocimiento de la condición?
  choices:
    A: 5 días
    B: 10 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Los conductores deben notificar a la Secretaría de Estado dentro de
    los 10 días posteriores a tener conocimiento de cualquier condición médica que
    pueda causar la pérdida del conocimiento o de la capacidad para operar un vehículo
    de manera segura.
- id: 50
  category: driver_testing
  question: ¿Cuál de las siguientes situaciones constituye una reprobación automática
    en el examen de conducir de Illinois?
  choices:
    A: No usar una luz de giro una vez
    B: Ajustar los espejos antes de arrancar
    C: Una infracción de cualquier ley de tránsito
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: C
  explanation: Cometer una infracción de tránsito o realizar una acción peligrosa
    durante el examen de conducir resulta en una reprobación automática inmediata.
- id: 51
  category: driver_testing
  question: 'En Illinois, los solicitantes masculinos de entre 18 y 25 años de edad:'
  choices:
    A: Están obligados a presentar prueba de servicio militar
    B: Son registrados automáticamente en el Sistema de Servicio Selectivo al solicitar
      una licencia
    C: Están exentos del examen escrito
    D: Están obligados a pagar una tarifa de solicitud más alta
  answer: B
  explanation: La ley de Illinois exige que los solicitantes masculinos de 18 a 25
    años se registren en el Sistema de Servicio Selectivo al solicitar una licencia
    de conducir o una tarjeta de identificación.
- id: 52
  category: driver_testing
  question: Aunque los jóvenes de 16 y 17 años pueden inscribirse en el Registro de
    Donantes de Órganos y Tejidos de Illinois, ¿quién tiene la última palabra sobre
    la donación si la persona fallece antes de los 18 años?
  choices:
    A: El Secretario de Estado
    B: El médico tratante
    C: La escuela de la persona
    D: Los padres o tutores legales de la persona
  answer: D
  explanation: Aunque los jóvenes de 16 y 17 años pueden inscribirse en el registro,
    sus padres o tutores legales tienen el derecho legal de anular la decisión hasta
    que la persona cumpla 18 años.
- id: 53
  category: driver_testing
  question: 'Al realizar el examen práctico de manejo en Illinois, el vehículo proporcionado
    por el solicitante debe tener:'
  choices:
    A: Una transmisión manual
    B: Frenos dobles para el examinador
    C: Una placa de matrícula delantera y trasera (si lo requiere el estado de registro)
    D: Asientos de cuero
  answer: C
  explanation: El vehículo utilizado para el examen práctico debe tener la licencia
    adecuada, lo que incluye mostrar las placas de matrícula delantera y trasera si
    el estado de registro lo requiere (como ocurre en Illinois).
- id: 54
  category: driver_testing
  question: ¿Cuál es la tarifa por un duplicado de la licencia de conducir de Illinois
    si la original se pierde o es robada?
  choices:
    A: $5
    B: $15
    C: $25
    D: $30
  answer: A
  explanation: La tarifa para obtener un duplicado de la licencia de conducir en Illinois
    es de $5.
- id: 55
  category: driver_testing
  question: ¿Cuál de las siguientes maniobras se requiere específicamente durante
    el examen práctico de Illinois para demostrar el control del vehículo?
  choices:
    A: Estacionamiento en paralelo entre dos autos
    B: Un giro de tres puntos
    C: Estacionamiento en subida o bajada
    D: Incorporación a alta velocidad en una autopista
  answer: C
  explanation: El examen práctico de Illinois incluye el requisito de demostrar el
    estacionamiento adecuado en una colina (en subida o bajada), incluyendo el giro
    correcto de las ruedas.
- id: 56
  category: driver_responsibility
  question: 'En Illinois, si usted se ve involucrado en un accidente de tráfico que
    resulte en daños a la propiedad de cualquier persona por un monto superior a $1,500,
    debe presentar un informe de automovilista si:'
  choices:
    A: La policía no presenta un informe
    B: El otro conductor tiene la culpa
    C: Usted es mayor de 21 años
    D: El daño es solo a un vehículo del gobierno
  answer: A
  explanation: De acuerdo con las Reglas del Camino de Illinois, si un accidente resulta
    en lesiones corporales, muerte o daños a la propiedad de más de $1,500 ($500 si
    algún vehículo no tiene seguro), se debe presentar un informe ante el IDOT si
    un oficial de policía no presenta uno.
- id: 57
  category: driver_responsibility
  question: Si se le requiere presentar un Informe de Automovilista de Illinois después
    de un accidente, ¿cuántos días tiene para enviarlo al Departamento de Transporte
    de Illinois?
  choices:
    A: 3 días
    B: 10 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: La ley de Illinois exige que se envíe un informe de accidente al Departamento
    de Transporte de Illinois a más tardar 10 días después de que ocurra el accidente.
- id: 58
  category: driver_responsibility
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil requerido
    en Illinois por la lesión o muerte de una persona en un accidente?
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Illinois exige un seguro de responsabilidad civil mínimo
    de $25,000 por la lesión o muerte de una persona en un accidente.
- id: 59
  category: driver_responsibility
  question: En Illinois, ¿cuál es la multa mínima por una primera condena por conducir
    sin el seguro de responsabilidad civil obligatorio requerido?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Operar un vehículo motorizado en Illinois sin el seguro requerido conlleva
    una multa mínima de $500.
- id: 60
  category: driver_responsibility
  question: Cuando vende un vehículo en Illinois, ¿qué debe hacer con las placas de
    matrícula?
  choices:
    A: Dejarlas en el vehículo para el nuevo propietario
    B: Quitarlas y conservarlas o transferirlas a otro vehículo
    C: Destruirlas inmediatamente
    D: Entregarlas al departamento de policía local
  answer: B
  explanation: En Illinois, las placas de matrícula permanecen con el propietario,
    no con el vehículo. Cuando vende un automóvil, debe quitar las placas.
- id: 61
  category: driver_responsibility
  question: 'Si choca contra un vehículo estacionado en Illinois y no puede encontrar
    al propietario, debe dejar una nota y:'
  choices:
    A: Esperar 2 horas a que regrese el propietario
    B: Notificar a la policía o a la Secretaría de Estado
    C: Tomar una foto y publicarla en las redes sociales
    D: Solo dejar una nota; no se requiere ninguna otra acción
  answer: B
  explanation: La ley de Illinois exige que deje una nota con su nombre, dirección
    y número de placa, y también debe notificar a la policía.
- id: 62
  category: driver_responsibility
  question: 'Bajo la Ley de Responsabilidad de Seguridad de Illinois, si usted es
    el culpable en un accidente y no tiene seguro, su licencia de conducir puede ser
    suspendida hasta que:'
  choices:
    A: Pague una multa de $100
    B: Complete un curso de conducción correctiva
    C: Deposite una garantía (dinero) para cubrir los daños o llegue a un acuerdo
    D: Haya pasado un año
  answer: C
  explanation: La Ley de Responsabilidad de Seguridad exige que los conductores sin
    seguro que tengan la culpa en un accidente depositen una garantía para cubrir
    los daños, o de lo contrario se suspenderá su licencia y registro.
- id: 63
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma válida de demostrar que tiene seguro
    durante una parada de tráfico en Illinois?
  choices:
    A: Una declaración verbal al oficial
    B: Una imagen electrónica de la tarjeta de seguro en un teléfono inteligente
    C: Una carta firmada por su vecino
    D: Una copia del título de su vehículo
  answer: B
  explanation: Illinois permite a los conductores proporcionar una prueba de seguro
    en formato impreso o electrónico, como en un dispositivo móvil.
- id: 64
  category: driver_responsibility
  question: 'Una persona condenada por abandonar la escena de un choque que involucre
    lesiones personales o muerte en Illinois se enfrenta a:'
  choices:
    A: Solo una multa de $50
    B: Revocación obligatoria de su licencia de conducir
    C: Una advertencia en su historial de conducción
    D: Ninguna sanción si lo reporta al día siguiente
  answer: B
  explanation: Abandonar la escena de un accidente que involucre lesiones o muerte
    es un delito grave en Illinois que resulta en la revocación obligatoria de la
    licencia de conducir.
- id: 65
  category: driver_responsibility
  question: En Illinois, ¿cuántas placas de matrícula deben mostrar la mayoría de
    los vehículos de pasajeros?
  choices:
    A: Una solo en la parte trasera
    B: Una solo en la parte delantera
    C: Dos, una en la parte delantera y otra en la trasera
    D: Ninguna, siempre que el registro esté en la guantera
  answer: C
  explanation: 'La mayoría de los vehículos en Illinois deben mostrar dos placas de
    matrícula: una en la parte delantera y otra en la trasera.'
- id: 66
  category: driver_responsibility
  question: ¿Cuál es la sanción en Illinois por proporcionar información de seguro
    falsa a un oficial de policía?
  choices:
    A: Una advertencia verbal
    B: Una tarifa administrativa de $25
    C: Es un delito menor de Clase A y puede conllevar una multa y tiempo en la cárcel
    D: No hay sanción si obtiene el seguro en un plazo de 24 horas
  answer: C
  explanation: Proporcionar información de seguro falsa es un delito menor de Clase
    A en Illinois, lo que puede resultar en multas y hasta un año de cárcel.
- id: 67
  category: driver_responsibility
  question: En Illinois, ¿dónde debe colocarse la calcomanía de vencimiento del registro
    en la placa de matrícula?
  choices:
    A: En la esquina superior izquierda
    B: En la esquina superior derecha
    C: En la esquina inferior derecha
    D: En el centro de la placa
  answer: C
  explanation: La Secretaría de Estado de Illinois exige que la calcomanía de renovación
    del registro se coloque en la esquina inferior derecha de la placa trasera.
- id: 68
  category: driver_responsibility
  question: 'Si un conductor de Illinois es condenado por una segunda o subsiguiente
    infracción por conducir sin seguro, se enfrenta a una suspensión del registro
    y una multa de:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Una segunda o subsiguiente condena por conducir sin seguro en Illinois
    conlleva una multa mínima de $1,000.
- id: 69
  category: driver_responsibility
  question: 'En Illinois, la cobertura de ''Conductor sin seguro'' (Uninsured Motorist)
    es:'
  choices:
    A: Opcional para todos los conductores
    B: Obligatoria y debe estar incluida en su póliza de responsabilidad civil
    C: Solo requerida para conductores menores de 21 años
    D: Ilegal en el estado de Illinois
  answer: B
  explanation: La ley de Illinois exige que cada póliza de responsabilidad civil para
    vehículos motorizados incluya cobertura para conductores sin seguro con los límites
    legales mínimos.
- id: 70
  category: driver_responsibility
  question: En Illinois, si usted se ve involucrado en un choque que cause lesiones
    personales o la muerte, debe informarlo al Departamento de Transporte de Illinois
    si la policía no presenta un informe. ¿Cuál es el umbral de daños a la propiedad
    que también requiere que se presente un informe?
  choices:
    A: Más de $500
    B: Más de $1,000
    C: Más de $1,500 (si todos los conductores tienen seguro)
    D: Más de $2,500
  answer: C
  explanation: En Illinois, se debe presentar un informe de choque si el accidente
    involucra lesiones corporales, muerte o daños a la propiedad de más de $1,500.
    Si algún conductor no tiene seguro, el umbral de daños a la propiedad es de $500.
- id: 71
  category: driver_responsibility
  question: ¿Cuáles son los requisitos mínimos de seguro de responsabilidad civil
    por lesiones corporales o muerte en Illinois?
  choices:
    A: $15,000/$30,000
    B: $20,000/$40,000
    C: $25,000/$50,000
    D: $50,000/$100,000
  answer: C
  explanation: La ley de Illinois exige una cobertura mínima de responsabilidad civil
    de $25,000 por lesiones o muerte de una persona y $50,000 por lesiones o muerte
    de más de una persona en un accidente.
- id: 72
  category: driver_responsibility
  question: Si un conductor de Illinois es declarado culpable de operar un vehículo
    motorizado sin una póliza de seguro válida, ¿cuál es la multa mínima?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Conducir sin seguro en Illinois conlleva una multa mínima de $500 por
    una primera o segunda condena.
- id: 73
  category: driver_responsibility
  question: ¿De cuánto tiempo dispone un conductor de Illinois para presentar un informe
    de accidente (SR-1) ante el Departamento de Transporte de Illinois (IDOT) si el
    accidente cumple con los requisitos de notificación?
  choices:
    A: A más tardar 24 horas después del accidente
    B: A más tardar 3 días después del accidente
    C: A más tardar 10 días después del accidente
    D: A más tardar 30 días después del accidente
  answer: C
  explanation: Si un accidente cumple con los criterios de notificación y un oficial
    de policía no presenta un informe, el conductor debe presentar un informe ante
    el IDOT a más tardar 10 días después del accidente.
- id: 74
  category: driver_responsibility
  question: Bajo la Ley de Responsabilidad de Seguridad de Illinois, ¿qué sucede si
    un conductor sin seguro es responsable de un accidente y no puede pagar los daños?
  choices:
    A: Se le requiere realizar servicio comunitario
    B: Se suspenden sus privilegios de conducir y el registro de su vehículo
    C: Debe pagar únicamente una tarifa administrativa de $100
    D: Nada, siempre y cuando prometa pagar más tarde
  answer: B
  explanation: La Ley de Responsabilidad de Seguridad exige que el Secretario de Estado
    suspenda los privilegios de conducir y el registro del vehículo de una persona
    sin seguro que sea responsable de un accidente y no pague los daños.
- id: 75
  category: driver_responsibility
  question: En Illinois, ¿dónde debe guardarse el certificado de título de su vehículo?
  choices:
    A: En la guantera
    B: Pegado al interior del parabrisas
    C: En un lugar seguro, pero NO en el vehículo
    D: Con el conductor en todo momento
  answer: C
  explanation: El título de un vehículo debe guardarse en un lugar seguro, como una
    caja de seguridad, y nunca debe dejarse dentro del vehículo para evitar problemas
    en caso de robo.
- id: 76
  category: driver_responsibility
  question: ¿Cuál es la sanción para un conductor de Illinois por una segunda condena
    o condenas posteriores por conducir sin seguro?
  choices:
    A: Una multa de $1,000 y una suspensión de 4 meses del registro del vehículo
    B: Una multa de $200 y una advertencia
    C: Una sentencia de 1 año de cárcel
    D: Revocación permanente de la licencia de conducir
  answer: A
  explanation: Por una segunda condena o condenas posteriores por conducir sin seguro,
    el conductor se enfrenta a una multa de $1,000 y una suspensión de 4 meses del
    registro de su vehículo.
- id: 77
  category: driver_responsibility
  question: La ley de Illinois exige que la mayoría de los vehículos de pasajeros
    exhiban ¿cuántas placas de circulación?
  choices:
    A: Una placa, exhibida en la parte trasera
    B: Una placa, exhibida en la parte delantera
    C: Dos placas, una en la parte delantera y otra en la trasera
    D: Dos placas, ambas en la parte trasera
  answer: C
  explanation: 'La mayoría de los vehículos en Illinois, incluidos los automóviles
    de pasajeros y camiones, deben exhibir dos placas de circulación: una en la parte
    delantera y otra en la trasera.'
- id: 78
  category: driver_responsibility
  question: Si se le declara culpable de usar ilegalmente un cartel de estacionamiento
    o una placa de circulación para personas con discapacidades que no le pertenece,
    ¿cuál es la multa mínima en Illinois?
  choices:
    A: $100
    B: $250
    C: $600
    D: $1,000
  answer: C
  explanation: La multa mínima por el uso ilegal de un cartel o placa de discapacidad
    es de $600, y la licencia de conducir del infractor será suspendida por seis meses.
- id: 79
  category: driver_responsibility
  question: ¿Qué es un certificado SR-22 en Illinois?
  choices:
    A: Un certificado de graduación de la escuela secundaria
    B: Un comprobante de responsabilidad financiera futura requerido para conductores
      de alto riesgo
    C: Un permiso para conducir un vehículo comercial
    D: Un formulario de autorización médica para conductores de edad avanzada
  answer: B
  explanation: Un SR-22 es un certificado de responsabilidad financiera que demuestra
    que un conductor tiene el seguro de responsabilidad civil requerido. A menudo
    se requiere para conductores que buscan restablecer su licencia después de ciertas
    suspensiones o revocaciones.
- id: 80
  category: driver_responsibility
  question: En Illinois, ¿durante cuánto tiempo debe un conductor mantener un certificado
    SR-22 en archivo con el Secretario de Estado si se le requiere?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: C
  explanation: En Illinois, los conductores obligados a presentar un SR-22 generalmente
    deben mantenerlo durante 3 años.
- id: 81
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la prueba
    de emisiones de Illinois?
  choices:
    A: Todos los vehículos en Illinois deben ser probados cada año
    B: Solo los vehículos en ciertos condados (como Cook y DuPage) están obligados
      a someterse a la prueba
    C: La prueba solo es obligatoria para vehículos de más de 25 años
    D: La prueba de emisiones fue abolida en Illinois en 2020
  answer: B
  explanation: La prueba de emisiones es obligatoria para la mayoría de los vehículos
    en los condados de Cook, DuPage, Lake y partes de Kane, Kendall, McHenry, Will,
    Madison, Monroe y St. Clair.
- id: 82
  category: driver_responsibility
  question: Si se ve involucrado en un choque con un vehículo estacionado en Illinois,
    ¿qué debe hacer si no puede encontrar al propietario?
  choices:
    A: Irse si no hay daños visibles
    B: Esperar 10 minutos y luego irse
    C: Dejar una nota con su nombre, dirección y número de placa y notificar a la
      policía
    D: Llamar a una grúa para mover el otro vehículo
  answer: C
  explanation: Si choca contra un vehículo estacionado, debe detenerse e intentar
    encontrar al propietario. Si no puede, debe dejar un aviso por escrito en un lugar
    visible y notificar a la policía.
- id: 83
  category: driver_responsibility
  question: ¿Cuál es la sanción para un conductor de Illinois que es condenado por
    abandonar la escena de un choque que involucre lesiones personales o muerte?
  choices:
    A: Una multa de $50
    B: Una suspensión de 3 meses de los privilegios de conducir
    C: Revocación de los privilegios de conducir y posibles cargos por delitos graves
    D: 10 horas obligatorias de escuela de tránsito
  answer: C
  explanation: Abandonar la escena de un choque que involucre lesiones o muerte es
    una ofensa grave en Illinois, lo que resulta en la revocación de los privilegios
    de conducir y un posible procesamiento penal como delito grave.
- id: 84
  category: driver_responsibility
  question: En Illinois, ¿se puede mostrar el comprobante de seguro en un dispositivo
    electrónico móvil durante una parada de tráfico?
  choices:
    A: No, solo se acepta una tarjeta de papel
    B: Sí, el comprobante de seguro electrónico es legalmente aceptable
    C: Solo si el oficial tiene más de 40 años
    D: Solo si el conductor también lleva un respaldo en papel
  answer: B
  explanation: La ley de Illinois permite a los conductores proporcionar el comprobante
    de seguro en formato impreso o electrónico, como en un teléfono inteligente.
- id: 85
  category: safe_driving_rules
  question: En Illinois, ¿cuál es el límite de velocidad máximo en las autopistas
    interestatales rurales a menos que se indique lo contrario?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: De acuerdo con las Reglas del Camino de Illinois, el límite de velocidad
    máximo en las autopistas interestatales rurales es de 70 mph.
- id: 86
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en Illinois, ¿debe regresar a su carril antes
    de estar a cuántos pies de un vehículo que viene en sentido contrario?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Illinois exige que termine de rebasar y regrese a su carril
    antes de estar a menos de 200 pies de cualquier vehículo que venga en dirección
    opuesta.
- id: 87
  category: safe_driving_rules
  question: En una zona comercial o residencial en Illinois, ¿debe dar una señal de
    giro continua durante al menos cuántos pies antes de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: En zonas comerciales o residenciales, se debe dar una señal de giro
    al menos 100 pies antes de girar. En otras áreas (rurales), la señal debe darse
    al menos 200 pies antes de girar.
- id: 88
  category: safe_driving_rules
  question: Según la ley de Illinois, ¿cuál es el límite de velocidad máximo en un
    callejón urbano?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad legal para un callejón en un área urbana en
    Illinois es de 15 mph.
- id: 89
  category: safe_driving_rules
  question: Al acercarse a una zona escolar en días de clase cuando hay niños presentes,
    ¿cuál es el límite de velocidad entre las 7 a.m. y las 4 p.m.?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: En Illinois, el límite de velocidad en las zonas escolares es de 20
    mph en los días de clase cuando hay niños presentes y hay señales publicadas.
- id: 90
  category: safe_driving_rules
  question: En Illinois, ¿es ilegal estacionarse a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: La ley de Illinois prohíbe estacionarse a menos de 15 pies de un hidrante
    de incendios.
- id: 91
  category: safe_driving_rules
  question: ¿Cuándo un autobús escolar viaja por una carretera de cuatro carriles
    con al menos dos carriles en cada dirección, qué tráfico debe detenerse cuando
    el autobús tiene su brazo de señal de pare extendido y las luces rojas intermitentes?
  choices:
    A: El tráfico en los cuatro carriles debe detenerse
    B: Solo el tráfico que se mueve en la dirección opuesta al autobús debe detenerse
    C: Solo el tráfico que se mueve en la misma dirección que el autobús debe detenerse
    D: No se requiere que el tráfico se detenga si hay una mediana
  answer: C
  explanation: En una carretera de cuatro carriles con al menos dos carriles de tráfico
    en cada dirección, en Illinois solo se requiere que se detenga el tráfico que
    se mueve en la misma dirección que el autobús escolar.
- id: 92
  category: safe_driving_rules
  question: ¿Cuál es la multa mínima por una primera infracción de exceso de velocidad
    en una zona de construcción o mantenimiento cuando hay trabajadores presentes
    en Illinois?
  choices:
    A: '100'
    B: '250'
    C: '375'
    D: '500'
  answer: B
  explanation: En Illinois, la multa mínima por la primera infracción de exceso de
    velocidad en una zona de construcción es de $250.
- id: 93
  category: safe_driving_rules
  question: De acuerdo con la ley de Illinois, ¿cuándo debe usar sus faros delanteros?
  choices:
    A: Solo desde la puesta del sol hasta el amanecer
    B: Solo cuando está lloviendo o nevando
    C: Desde la puesta del sol hasta el amanecer, y siempre que los limpiaparabrisas
      sean necesarios
    D: Solo cuando la visibilidad es inferior a 1,000 pies
  answer: C
  explanation: La ley de Illinois exige que los faros delanteros estén encendidos
    desde la puesta del sol hasta el amanecer, y en cualquier otro momento en que
    las condiciones climáticas requieran el uso de los limpiaparabrisas.
- id: 94
  category: safe_driving_rules
  question: 'Al acercarse a un vehículo de emergencia estacionado con sus luces intermitentes
    encendidas (Ley de Scott), los conductores de Illinois deben:'
  choices:
    A: Mantener la velocidad y permanecer en el carril actual
    B: Aumentar la velocidad para rebasar el vehículo rápidamente
    C: Ceder el derecho de paso cambiando de carril si es seguro, o reduciendo la
      velocidad
    D: Detenerse por completo en la carretera
  answer: C
  explanation: La Ley de Scott (Ley de Moverse al otro carril) exige que los conductores
    cambien de carril si es seguro hacerlo o reduzcan la velocidad y procedan con
    precaución al acercarse a cualquier vehículo estacionado con luces intermitentes.
- id: 95
  category: safe_driving_rules
  question: 'Se le permite girar a la izquierda con luz roja en Illinois solo cuando:'
  choices:
    A: Gira desde una calle de doble sentido hacia una calle de sentido único
    B: Gira desde una calle de sentido único hacia otra calle de sentido único
    C: No hay tráfico en sentido contrario
    D: Es después de la medianoche
  answer: B
  explanation: En Illinois, solo se permite girar a la izquierda en rojo cuando se
    gira de una calle de sentido único a otra calle de sentido único después de detenerse
    por completo y ceder el paso al tráfico y a los peatones.
- id: 96
  category: safe_driving_rules
  question: Al detenerse en un cruce de ferrocarril en Illinois, ¿a cuántos pies del
    riel más cercano debe detenerse un conductor?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Exactamente 20 pies
  answer: C
  explanation: La ley de Illinois exige que los vehículos se detengan entre 15 y 50
    pies del riel más cercano en un cruce de ferrocarril cuando una señal parpadea
    o se acerca un tren.
- id: 97
  category: safe_driving_rules
  question: En Illinois, ¿es ilegal rebasar a otro vehículo a menos de cuántos pies
    de una intersección o cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Está prohibido rebasar a menos de 100 pies de una intersección o un
    cruce de ferrocarril en Illinois.
- id: 98
  category: safe_driving_rules
  question: Al estacionarse en paralelo en una calle nivelada en Illinois, ¿sus ruedas
    deben estar a menos de cuántas pulgadas del bordillo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Al estacionar en paralelo, el vehículo debe estacionarse con las ruedas
    del lado derecho paralelas y a menos de 12 pulgadas del bordillo.
- id: 99
  category: safe_driving_rules
  question: Bajo la 'Ley de Scott' de Illinois (Ley de Moverse al otro carril), ¿qué
    debe hacer un conductor al acercarse a cualquier vehículo estacionado con luces
    intermitentes?
  choices:
    A: Detenerse inmediatamente en el carril de tráfico
    B: Mantener la velocidad pero tocar la bocina
    C: Cambiar de carril si es seguro hacerlo, o reducir la velocidad y proceder con
      precaución
    D: Aumentar la velocidad para rebasar el vehículo rápidamente
  answer: C
  explanation: La Ley de Scott exige que los conductores cambien de carril si es seguro
    hacerlo, o si no es posible cambiar de carril, reduzcan la velocidad y procedan
    con precaución al acercarse a cualquier vehículo estacionado con luces intermitentes.
- id: 100
  category: safe_driving_rules
  question: En Illinois, ¿cuándo se le permite a un conductor girar a la izquierda
    con luz roja?
  choices:
    A: Nunca
    B: Solo al girar de una calle de sentido único a otra calle de sentido único
    C: En cualquier intersección después de detenerse por completo
    D: Solo entre las horas de medianoche y las 6 a.m.
  answer: B
  explanation: En Illinois, solo se permite girar a la izquierda con luz roja después
    de una parada completa al girar de una calle de sentido único a otra calle de
    sentido único donde el tráfico se mueve hacia la izquierda.
- id: 101
  category: safe_driving_rules
  question: Al conducir de noche en Illinois, ¿a cuántos pies de distancia de un vehículo
    que viene en sentido contrario debe bajar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Illinois exige que los conductores bajen las luces altas
    al menos 500 pies antes de encontrarse con un vehículo que viene en sentido contrario.
- id: 102
  category: safe_driving_rules
  question: Al rebasar a un ciclista en Illinois, ¿cuánto espacio como mínimo debe
    dejar un automovilista entre el vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Illinois exige que los automovilistas dejen al menos 3 pies
    de espacio al rebasar a un ciclista.
- id: 103
  category: safe_driving_rules
  question: Al acercarse a un cortejo fúnebre en Illinois, ¿cuál es el procedimiento
    correcto para los demás automovilistas?
  choices:
    A: Los automovilistas deben unirse al cortejo para avanzar más rápido en el tráfico
    B: Los automovilistas deben ceder el derecho de paso a todos los vehículos del
      cortejo
    C: Los automovilistas deben tocar la bocina para avisar al cortejo que están rebasando
    D: Los automovilistas solo ceden el paso si el cortejo tiene escolta policial
  answer: B
  explanation: En Illinois, los automovilistas deben ceder el derecho de paso a todos
    los vehículos de un cortejo fúnebre. Los vehículos del cortejo tienen el derecho
    de paso en las intersecciones cuando llevan las luces delanteras encendidas.
- id: 104
  category: defensive_driving
  question: Según las Normas de Circulación de Illinois (Rules of the Road), ¿cuál
    es la distancia de seguimiento recomendada detrás del vehículo que va delante
    de usted en condiciones ideales?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: B
  explanation: La ley de Illinois y el manual oficial del conductor recomiendan una
    distancia de seguimiento mínima de tres segundos para permitir suficiente tiempo
    para reaccionar ante situaciones delante de usted.
- id: 105
  category: defensive_driving
  question: En Illinois, ¿cuándo es obligatorio encender las luces delanteras al usar
    los limpiaparabrisas?
  choices:
    A: Solo durante aguaceros intensos
    B: Solo si es después del atardecer
    C: En todo momento en que se utilicen los limpiaparabrisas debido a las condiciones
      climáticas
    D: Solo en autopistas e interestatales
  answer: C
  explanation: La ley de Illinois exige que las luces delanteras estén encendidas
    cuando las condiciones atmosféricas requieran el uso de los limpiaparabrisas.
- id: 106
  category: defensive_driving
  question: En Illinois, ¿a cuántos pies de distancia debe bajar las luces altas cuando
    sigue a otro vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Al seguir a otro vehículo, la ley de Illinois exige que baje las luces
    altas cuando se encuentre a menos de 300 pies del vehículo de adelante.
- id: 107
  category: defensive_driving
  question: Para mantener una conciencia situacional adecuada, la Secretaría de Estado
    de Illinois recomienda observar el camino hacia adelante con al menos ¿cuánta
    anticipación?
  choices:
    A: 5 a 10 segundos
    B: 12 a 15 segundos
    C: 20 a 30 segundos
    D: Un minuto completo
  answer: B
  explanation: El manual de Normas de Circulación de Illinois sugiere observar de
    12 a 15 segundos hacia adelante para identificar posibles peligros con anticipación.
- id: 108
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a producirse el hidroplaneo (hydroplaning)
    en las carreteras de Illinois durante una lluvia intensa?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph,
    donde los neumáticos pueden perder contacto con la superficie de la carretera
    y deslizarse sobre el agua.
- id: 109
  category: defensive_driving
  question: Al conducir con niebla densa en Illinois, ¿qué ajuste de luces delanteras
    debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces, use las luces de emergencia (intermitentes)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la niebla y, de hecho, disminuyen la visibilidad.
- id: 110
  category: defensive_driving
  question: Bajo la 'Ley de Scott' (Scott's Law o Move Over Law) de Illinois, ¿cuál
    es la multa mínima por una primera infracción por no ceder el paso a un vehículo
    de emergencia con las luces intermitentes encendidas?
  choices:
    A: Solo una advertencia
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: Según las actualizaciones recientes de la Ley de Scott en Illinois,
    la multa mínima por una primera infracción es de $250.
- id: 111
  category: defensive_driving
  question: Fuera de los distritos comerciales o residenciales, ¿los camiones o vehículos
    que remolcan tráileres deben mantener una distancia de seguimiento de al menos
    cuántos pies detrás de otro vehículo similar?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Illinois exige que los camiones y vehículos que remolcan
    tráileres se mantengan al menos a 300 pies detrás de otros camiones o remolques
    cuando conducen fuera de áreas comerciales o residenciales.
- id: 112
  category: defensive_driving
  question: Al conducir en condiciones invernales en Illinois, ¿por qué son particularmente
    peligrosos los puentes y los pasos elevados?
  choices:
    A: Son más estrechos que otras carreteras
    B: Permanecen mojados más tiempo que otras carreteras
    C: Pueden permanecer congelados después de que el resto de la calzada esté despejada
      y seca
    D: Tienen un límite de velocidad más bajo en invierno
  answer: C
  explanation: Los puentes y pasos elevados pueden permanecer congelados porque carecen
    del aislamiento del suelo que mantiene más calientes otras superficies de la carretera,
    lo que hace que se congelen primero y permanezcan congelados por más tiempo.
- id: 113
  category: defensive_driving
  question: En Illinois, ¿entre qué horas deben estar encendidas las luces delanteras
    de su vehículo?
  choices:
    A: De 6:00 PM a 6:00 AM
    B: Desde una hora después del atardecer hasta una hora antes del amanecer
    C: Desde el atardecer hasta el amanecer
    D: Solo cuando está tan oscuro que no se puede ver a 1,000 pies
  answer: C
  explanation: La ley de Illinois exige que las luces delanteras estén encendidas
    desde el atardecer hasta el amanecer, así como durante los períodos de poca visibilidad.
- id: 114
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Illinois,
    ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Frenar bruscamente y girar en dirección opuesta al derrape
    B: Dejar de acelerar y girar el volante en la dirección del derrape
    C: Acelerar ligeramente para recuperar la tracción
    D: Poner punto muerto y bombear los frenos
  answer: B
  explanation: El manual del conductor de Illinois instruye a los conductores a dejar
    de acelerar o frenar y girar el volante en la dirección del derrape hasta que
    se recupere el control.
- id: 115
  category: defensive_driving
  question: Si un conductor agresivo lo sigue muy de cerca (tailgating) en Illinois,
    ¿cuál es la acción más segura?
  choices:
    A: Tocar los frenos repetidamente para advertirle
    B: Aumentar la velocidad para incrementar la distancia
    C: Reducir la velocidad y moverse a la derecha para permitirle pasar
    D: Detener su vehículo en el carril para confrontarlo
  answer: C
  explanation: La conducción defensiva implica reducir la tensión; reducir la velocidad
    y moverse a la derecha permite que el conductor agresivo pase de forma segura.
- id: 116
  category: defensive_driving
  question: 'Cuando un vehículo de emergencia que utiliza señales auditivas y visuales
    se aproxima a su vehículo por detrás en Illinois, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Orillarse al borde derecho de la carretera y detenerse
    C: Aumentar la velocidad para salir del camino
    D: Moverse al acotamiento izquierdo y detenerse
  answer: B
  explanation: La ley de Illinois exige que los conductores se orillen al borde derecho
    de la carretera y se detengan hasta que el vehículo de emergencia haya pasado.
- id: 117
  category: defensive_driving
  question: 'Al acercarse a un vehículo por detrás por la noche, la ley de Illinois
    exige que baje las luces altas cuando se encuentre a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Los conductores deben bajar las luces altas cuando se encuentren a
    menos de 300 pies del vehículo que están siguiendo.
- id: 118
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar a ocurrir el hidroplaneo (hydroplaning)
    en las condiciones climáticas de Illinois, haciendo que los neumáticos pierdan
    contacto con la carretera?
  choices:
    A: Tan solo a 35 mph
    B: Solo por encima de 55 mph
    C: A velocidades que superen las 65 mph
    D: Solo durante lluvia helada
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, los neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 119
  category: defensive_driving
  question: Para mantener un escaneo defensivo adecuado, ¿qué tan adelante recomienda
    mirar la Secretaría de Estado de Illinois?
  choices:
    A: 5 segundos
    B: 12 segundos
    C: 20 segundos
    D: 30 segundos
  answer: B
  explanation: Los conductores deben escanear la carretera al menos 12 segundos por
    delante de su vehículo para anticipar posibles peligros.
- id: 120
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Illinois,
    ¿hacia qué lado debe girar el volante para recuperar el control?
  choices:
    A: En la dirección opuesta al derrape
    B: Hacia adelante y frenar bruscamente
    C: En la dirección del derrape
    D: Hacia el acotamiento de la carretera
  answer: C
  explanation: Para corregir un derrape, debe girar el volante en la dirección del
    derrape y evitar frenar bruscamente.
- id: 121
  category: defensive_driving
  question: Al acercarse a un cruce de ferrocarril en Illinois con una señal intermitente,
    ¿dentro de qué distancia del riel más cercano debe detener su vehículo?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Exactamente 20 pies
  answer: C
  explanation: La ley de Illinois exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano cuando las señales parpadean o se aproxima un tren.
- id: 122
  category: defensive_driving
  question: En Illinois, al rebasar a un ciclista, ¿cuál es la distancia lateral mínima
    que un automovilista debe mantener entre el vehículo y la bicicleta?
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley de Illinois exige que los automovilistas dejen al menos 3 pies
    de espacio al rebasar a un ciclista.
- id: 123
  category: defensive_driving
  question: Si un vehículo que viene en sentido contrario no baja sus luces altas,
    ¿hacia dónde debe mirar un conductor de Illinois para evitar quedar temporalmente
    cegado?
  choices:
    A: A la línea central de la carretera
    B: Hacia el borde derecho del pavimento
    C: Directamente a los faros que se aproximan
    D: Al espejo retrovisor
  answer: B
  explanation: Para evitar el deslumbramiento de las luces altas que vienen en sentido
    contrario, mire hacia el borde derecho de su carril o hacia la línea blanca en
    el borde del pavimento.
- id: 124
  category: defensive_driving
  question: Al entrar en una curva en una carretera rural de Illinois, ¿cuándo debe
    ajustar su velocidad?
  choices:
    A: Antes de entrar en la curva
    B: En medio de la curva
    C: Al salir de la curva
    D: Solo si siente que los neumáticos se deslizan
  answer: A
  explanation: La conducción defensiva requiere reducir la velocidad antes de entrar
    en una curva para mantener la tracción y el control.
- id: 125
  category: alcohol_drugs_health
  question: En Illinois, se considera legalmente que un conductor está bajo la influencia
    (DUI) si su concentración de alcohol en sangre (BAC) es igual o superior a qué
    nivel?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Illinois, es ilegal conducir con un BAC de 0.08% o superior. Sin
    embargo, un conductor aún puede ser condenado por DUI con un BAC entre 0.05% y
    0.08% si evidencia adicional muestra que estaba incapacitado.
- id: 126
  category: alcohol_drugs_health
  question: 'Bajo la ley de Suspensión Sumaria Estatutaria de Illinois, si es la primera
    vez que comete una infracción y no pasa una prueba química (BAC de 0.08% o más),
    sus privilegios de conducir serán suspendidos por:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Un infractor por primera vez que no pasa una prueba química se enfrenta
    a una suspensión sumaria estatutaria obligatoria de 6 meses de sus privilegios
    de conducir.
- id: 127
  category: alcohol_drugs_health
  question: 'En Illinois, si un infractor por primera vez se niega a someterse a pruebas
    químicas (aliento, sangre u orina) después de ser arrestado por DUI, su licencia
    será suspendida por:'
  choices:
    A: 6 meses
    B: 12 meses
    C: 18 meses
    D: 24 meses
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito, negarse a someterse a pruebas
    químicas resulta en una suspensión más larga que no pasar la prueba. Para una
    primera infracción, la suspensión es de 12 meses.
- id: 128
  category: alcohol_drugs_health
  question: 'Si es condenado por DUI en Illinois por primera vez, sus privilegios
    de conducir serán revocados por un mínimo de:'
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Una primera condena por DUI resulta en una revocación mínima de 1 año
    de los privilegios de conducir (2 años si el conductor es menor de 21 años).
- id: 129
  category: alcohol_drugs_health
  question: ¿En Illinois, cuál es el límite legal de THC (cannabis) en la sangre de
    un conductor para usuarios no médicos?
  choices:
    A: 2 nanogramos por mililitro
    B: 5 nanogramos por mililitro
    C: 10 nanogramos por mililitro
    D: Cualquier cantidad detectable
  answer: B
  explanation: La ley de Illinois establece un límite de 5 nanogramos o más de THC
    por mililitro de sangre completa, o 10 nanogramos o más por mililitro de otra
    sustancia corporal, para que un conductor sea considerado bajo la influencia del
    cannabis.
- id: 130
  category: alcohol_drugs_health
  question: Si un conductor de Illinois es condenado por DUI mientras transporta a
    un niño menor de 16 años, ¿a cuál de las siguientes sanciones adicionales se enfrenta?
  choices:
    A: Servicio comunitario obligatorio y una multa mínima de $1,000
    B: Pérdida permanente inmediata de la licencia
    C: Una sentencia de cárcel obligatoria de 30 días
    D: Ninguna sanción adicional más allá del DUI estándar
  answer: A
  explanation: El DUI con un pasajero menor de 16 años es un factor agravante en Illinois,
    que conlleva una multa mínima obligatoria de $1,000 y 25 días de servicio comunitario
    en un programa que beneficie a los niños.
- id: 131
  category: alcohol_drugs_health
  question: ¿Qué es un Permiso de Conducir con Dispositivo de Monitoreo (MDDP) en
    el estado de Illinois?
  choices:
    A: Un permiso que permite a un conductor usar un teléfono celular solo para GPS
    B: Un permiso para infractores de DUI por primera vez para conducir vehículos
