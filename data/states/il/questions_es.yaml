- id: 157
  category: penalties_and_points
  question: 'Un conductor de Illinois condenado por una tercera o subsiguiente infracción
    de conducir sin un seguro válido enfrenta una multa obligatoria de:'
  choices:
    A: '250'
    B: '500'
    C: 1,000
    D: 2,500
  answer: C
  explanation: Una tercera o subsiguiente condena por conducir sin seguro en Illinois
