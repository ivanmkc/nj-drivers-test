- id: 151
  category: penalties_and_points
  question: ¿En Illinois, cuál es el tiempo mínimo por el cual se le revocará su licencia
    de conducir por una primera condena de Conducir Bajo la Influencia (DUI)?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
