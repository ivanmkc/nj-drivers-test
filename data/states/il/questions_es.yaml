  choices:
    A: Un delito menor de Clase C
    B: Un delito menor de Clase B
    C: Un delito menor de Clase A
    D: Un delito grave de Clase 4
  answer: C
  explanation: El exceso de velocidad agravado en Illinois de 35 mph o más sobre el
