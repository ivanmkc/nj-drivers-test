questions:
- id: 1
  category: license_system
  question: ¿En Rhode Island, cuál es la edad mínima que debe tener una persona para
    solicitar un Permiso de Instrucción Limitado (Limited Instructional Permit)?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 16 años
    D: 17 años
  answer: C
  explanation: Según el Manual del Conductor de Rhode Island, el solicitante debe
    tener al menos 16 años pero menos de 18 años para solicitar un Permiso de Instrucción
    Limitado después de completar el curso de educación vial requerido.
- id: 2
  category: license_system
  question: Para calificar para un Permiso de Instrucción Limitado de Rhode Island,
    una persona menor de 18 años debe completar un curso de educación vial que consista
    en ¿cuántas horas?
  choices:
    A: 24 horas
    B: 30 horas
    C: 33 horas
    D: 40 horas
  answer: C
  explanation: La ley de Rhode Island exige que los menores completen un curso de
    educación vial de 33 horas certificado por el Community College of Rhode Island
    (CCRI) para obtener un permiso.
- id: 3
  category: license_system
  question: ¿Cuánto tiempo debe tener un conductor de Rhode Island un Permiso de Instrucción
    Limitado antes de ser elegible para realizar el examen de manejo para una Licencia
    Provisional Limitada (Limited Provisional License)?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Una persona debe tener un Permiso de Instrucción Limitado durante al
    menos seis meses sin condenas ni infracciones de tránsito antes de solicitar una
    Licencia Provisional Limitada.
- id: 4
  category: license_system
  question: Bajo el sistema de Licencia de Conducir Graduada (GDL) de Rhode Island,
    un conductor con una Licencia Provisional Limitada no puede operar un vehículo
    entre qué horas, a menos que sea por trabajo o escuela?
  choices:
    A: 10:00 PM y 5:00 AM
    B: 11:00 PM y 6:00 AM
    C: 12:00 AM y 4:00 AM
    D: 1:00 AM y 5:00 AM
  answer: D
  explanation: La Licencia Provisional Limitada de Rhode Island restringe la conducción
    entre la 1:00 AM y las 5:00 AM, excepto cuando se viaja hacia o desde el trabajo
    o una actividad patrocinada por la escuela.
- id: 5
  category: license_system
  question: Durante los primeros 12 meses de tener una Licencia Provisional Limitada
    de Rhode Island, ¿cuántos pasajeros menores de 21 años (que no sean miembros de
    la familia) se le permite transportar al conductor?
  choices:
    A: Ningún pasajero
    B: Un pasajero
    C: Dos pasajeros
    D: Tres pasajeros
  answer: B
  explanation: Durante el primer año de una Licencia Provisional Limitada, el conductor
    está limitado a no más de un pasajero menor de 21 años, excluyendo a los miembros
    de la familia inmediata o del hogar.
- id: 6
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una Licencia de Operador Completa
    (Full Operator's License) en Rhode Island?
  choices:
    A: 17 años
    B: 17 años y 6 meses
    C: 18 años
    D: 21 años
  answer: B
  explanation: Un conductor es elegible para una Licencia de Operador Completa si
    tiene al menos 17 años y 6 meses de edad y ha tenido una Licencia Provisional
    Limitada durante al menos 12 meses sin infracciones.
- id: 7
  category: license_system
  question: Si cambia su dirección dentro de Rhode Island, debe notificar al DMV por
    escrito dentro de ¿cuántos días?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Rhode Island exige que cualquier persona que posea una licencia
    o registro debe notificar al DMV un cambio de dirección dentro de los 10 días.
- id: 8
  category: license_system
  question: ¿Cuáles son los requisitos mínimos de cobertura de seguro de responsabilidad
    civil por daños a la propiedad en Rhode Island?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Rhode Island requiere una cobertura mínima de responsabilidad civil
    de $25,000 por daños a la propiedad, $25,000 por lesiones corporales a una persona
    y $50,000 por lesiones corporales a dos o más personas.
- id: 9
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción Limitado de Rhode
    Island, o hasta que el conductor cumpla 18 años?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Un Permiso de Instrucción Limitado es válido por un año o hasta que
    el solicitante cumpla los 18 años, lo que ocurra primero.
- id: 10
  category: license_system
  question: Al conducir con un permiso en Rhode Island, el conductor supervisor debe
    tener al menos 21 años y haber tenido una licencia durante al menos ¿cuántos años?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: D
  explanation: El conductor supervisor debe tener al menos 21 años, tener una licencia
    válida y haber sido un conductor con licencia durante al menos cinco años.
- id: 11
  category: license_system
  question: ¿Cuál es el número total de horas de conducción supervisada que el titular
    de un permiso debe registrar antes de solicitar una licencia provisional en Rhode
    Island?
  choices:
    A: 30 horas (5 de noche)
    B: 40 horas (10 de noche)
    C: 50 horas (10 de noche)
    D: 60 horas (15 de noche)
  answer: C
  explanation: Rhode Island requiere que un padre o tutor certifique que el titular
    del permiso ha completado 50 horas de conducción, de las cuales al menos 10 horas
    deben ser nocturnas.
- id: 12
  category: license_system
  question: Los nuevos residentes de Rhode Island deben solicitar una licencia de
    conducir de RI dentro de ¿cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según el DMV de RI, los nuevos residentes deben obtener una licencia
    de conducir de Rhode Island dentro de los 30 días posteriores al establecimiento
    de su residencia.
- id: 13
  category: license_system
  question: En Rhode Island, si un conductor menor de 18 años es sorprendido usando
    un teléfono celular (ya sea de mano o manos libres) mientras conduce, ¿cuál es
    la multa por una primera infracción?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Los conductores menores de 18 años tienen prohibido usar teléfonos
    celulares mientras conducen. Una primera infracción resulta en una multa de $100
    y puede conllevar la suspensión de la licencia.
- id: 14
  category: license_system
  question: ¿A qué edad puede un residente de Rhode Island solicitar un permiso de
    conducir sin tener que tomar un curso de educación vial de 33 horas?
  choices:
    A: 17 años
    B: 18 años
    C: 19 años
    D: 21 años
  answer: B
  explanation: El requisito del curso de educación vial de 33 horas solo se aplica
    a los solicitantes menores de 18 años. Los mayores de 18 años no están obligados
    a tomar el curso, aunque deben aprobar los exámenes escrito y práctico.
- id: 15
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como prueba de residencia
    en Rhode Island para una licencia REAL ID?
  choices:
    A: Una factura de servicios públicos con fecha de los últimos 60 días
    B: Un estado de cuenta bancario con fecha de los últimos 60 días
    C: Una pieza de correo dirigida a un apartado postal (P.O. Box)
    D: Una tarjeta de registro de votante de RI válida
  answer: C
  explanation: La prueba de residencia debe mostrar una dirección física en Rhode
    Island; un apartado postal (P.O. Box) no es aceptable como prueba de residencia
    física para fines de trámites de licencia en el DMV.
- id: 16
  category: license_system
  question: En Rhode Island, una licencia de operador estándar (Clase D) para una
    persona menor de 75 años suele ser válida por ¿cuántos años?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: C
  explanation: Según el DMV de RI, una licencia de conducir estándar es válida por
    un período de cinco años. Para las personas mayores de 75 años, la licencia es
    válida por solo dos años.
- id: 17
  category: license_system
  question: ¿Cuál es el requisito mínimo de seguro de responsabilidad civil en Rhode
    Island por lesiones corporales o muerte de dos o más personas en un solo accidente?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $15,000
  answer: B
  explanation: 'La ley de Rhode Island exige una cobertura de 25/50/25: $25,000 por
    lesiones corporales por persona, $50,000 por lesiones corporales por accidente
    (dos o más personas) y $25,000 por daños a la propiedad.'
- id: 18
  category: license_system
  question: Para cumplir con los requisitos de visión para una licencia de conducir
    de Rhode Island, un solicitante debe tener al menos ¿qué agudeza visual en al
    menos un ojo?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Rhode Island requiere que los solicitantes tengan una visión de 20/40
    en al menos un ojo, con o sin lentes correctivos.
- id: 19
  category: license_system
  question: Si reprueba el examen de conducir (examen práctico) de Rhode Island, ¿cuántos
    días debe esperar antes de ser elegible para realizar el examen nuevamente por
    primera vez?
  choices:
    A: 7 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si un solicitante reprueba el examen práctico de RI, debe esperar al
    menos 30 días antes de su siguiente intento. Los fallos posteriores pueden requerir
    períodos de espera más largos.
- id: 20
  category: license_system
  question: ¿Una licencia Clase D de Rhode Island le permite operar un vehículo con
    una Clasificación de Peso Bruto Vehicular (GVWR) de hasta cuántas libras?
  choices:
    A: 10,000 lbs
    B: 15,000 lbs
    C: 26,000 lbs
    D: 33,000 lbs
  answer: C
  explanation: Una licencia Clase D en Rhode Island permite la operación de cualquier
    vehículo con un GVWR de 26,000 libras o menos, siempre que no se utilice para
    fines de alquiler o para transportar materiales peligrosos.
- id: 21
  category: license_system
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Rhode Island,
    al operar un vehículo motorizado, ¿usted ha aceptado qué?
  choices:
    A: Mantener su vehículo en buen estado mecánico
    B: Llevar al menos tres pasajeros en todo momento
    C: Someterse a una prueba química para determinar su BAC si lo solicita un oficial
    D: Permitir que cualquier oficial de policía registre su vehículo sin una orden
      judicial
  answer: C
  explanation: La ley de Consentimiento Implícito significa que al conducir en RI,
    usted ha dado su consentimiento para una prueba química (aliento, sangre u orina)
    para determinar su Concentración de Alcohol en Sangre (BAC).
- id: 22
  category: license_system
  question: Para que se coloque la designación de 'Veterano' (Veteran) en una licencia
    de conducir de Rhode Island, ¿qué documento debe presentarse al DMV?
  choices:
    A: Una carta del Gobernador
    B: Un formulario DD-214 que muestre una baja honorable
    C: Solo una tarjeta de identificación militar vigente
    D: Un certificado de nacimiento
  answer: B
  explanation: La ley de Rhode Island permite que los veteranos tengan una designación
    de 'Veterano' en su licencia si proporcionan un DD-214 o documentación equivalente
    que muestre una baja honorable.
- id: 23
  category: license_system
  question: En Rhode Island, ¿con qué frecuencia debe un vehículo motorizado someterse
    a una inspección de seguridad y emisiones?
  choices:
    A: Cada año
    B: Cada 2 años
    C: Cada 5 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: La mayoría de los vehículos en Rhode Island deben someterse a una inspección
    de seguridad y emisiones cada dos años.
- id: 24
  category: license_system
  question: Para un solicitante mayor de 18 años, ¿por cuánto tiempo es válido un
    Permiso de Instrucción de Rhode Island?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que el conductor cumpla 21 años
  answer: B
  explanation: Para personas de 18 años o más, el Permiso de Instrucción de RI es
    válido por un año.
- id: 25
  category: license_system
  question: Según la ley de Rhode Island, ¿cuál es la tarifa por un duplicado de la
    licencia si la suya se pierde o se destruye?
  choices:
    A: $10.00
    B: $25.00
    C: $50.00
    D: Gratis para el primer reemplazo
  answer: B
  explanation: El DMV de Rhode Island cobra una tarifa de $25.00 por un duplicado
    de la licencia para reemplazar una que se perdió, fue robada o destruida.
- id: 26
  category: license_system
  question: Bajo el sistema GDL, ¿cuántos meses debe estar libre de condenas por infracciones
    de tránsito el titular de una Licencia Provisional Limitada de Rhode Island para
    ser elegible para una Licencia de Operador Completa?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: C
  explanation: Para obtener una Licencia de Operador Completa, un conductor debe tener
    la Licencia Provisional Limitada durante al menos 12 meses y permanecer libre
    de condenas por infracciones de tránsito durante ese tiempo.
- id: 27
  category: license_system
  question: Al solicitar una licencia de Rhode Island, los solicitantes masculinos
    entre las edades de 18 y 25 años son registrados automáticamente en ¿qué?, a menos
    que opten por no participar.
  choices:
    A: La Milicia Estatal
    B: El Servicio de Jurado
    C: El Servicio Selectivo (Selective Service)
    D: El Registro de Donantes de Órganos
  answer: C
  explanation: La ley de Rhode Island exige que el DMV proporcione al Sistema del
    Servicio Selectivo la información necesaria para que los solicitantes masculinos
    entre 18 y 25 años sean registrados.
- id: 28
  category: license_system
  question: Si un conductor de Rhode Island es menor de 18 años y recibe dos o más
    condenas por infracciones de tránsito, ¿cuál es la acción obligatoria que toma
    el DMV?
  choices:
    A: Una carta de advertencia
    B: Una multa de $500
    C: Asistencia obligatoria a una audiencia y posible suspensión de la licencia
    D: Requisito de volver a tomar solo el examen escrito
  answer: C
  explanation: Para los conductores menores de 18 años, dos o más infracciones de
    tránsito resultarán en una entrevista/audiencia obligatoria con un oficial del
    DMV, lo que puede llevar a la suspensión de la licencia.
- id: 29
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un residente de Rhode
    Island se registre para votar a través del programa 'Motor Voter' en el DMV?
  choices:
    A: Debe tener al menos 16 años (para pre-registrarse)
    B: Debe tener un historial de conducción perfecto
    C: Debe haber vivido en RI durante al menos 5 años
    D: Debe poseer un vehículo registrado en RI
  answer: A
  explanation: Rhode Island permite a los residentes registrarse para votar en el
    DMV. Puede pre-registrarse a los 16 años, aunque no puede votar hasta los 18.
- id: 30
  category: license_system
  question: En Rhode Island, una persona que tiene una 'Licencia de Conducir Comercial'
    (CDL) está sujeta a un límite de BAC más estricto de ¿cuánto? mientras opera un
    vehículo comercial.
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Mientras que el límite legal para los conductores estándar es de 0.08%,
    el límite para los titulares de una CDL que operan un vehículo comercial en Rhode
    Island es de 0.04%.
- id: 31
  category: driver_testing
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    conductores de 21 años o más en Rhode Island?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Según la ley de Rhode Island, es ilegal que cualquier persona de 21
    años o más opere un vehículo motorizado con un BAC de 0.08% o superior.
- id: 32
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una zona escolar en Rhode Island?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: En Rhode Island, el límite de velocidad en una zona escolar es de 20
    mph, a menos que se indique lo contrario.
- id: 33
  category: driver_testing
  question: En Rhode Island, ¿está prohibido estacionar a menos de cuántos pies de
    un hidrante de incendios?
  choices:
    A: 8 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: A
  explanation: La ley de Rhode Island establece que no se puede estacionar un vehículo
    a menos de 8 pies de un hidrante de incendios.
- id: 34
  category: driver_testing
  question: Al tener la intención de girar, ¿con cuántos pies de antelación, como
    mínimo, debe señalizar un conductor en Rhode Island antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Rhode Island exige que los conductores den una señal continua
    durante al menos 100 pies antes de girar.
- id: 35
  category: driver_testing
  question: Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    y el brazo de parada extendido, ¿a cuántos pies de distancia del autobús, como
    mínimo, deben detenerse los conductores de Rhode Island?
  choices:
    A: 20 pies
    B: 30 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: Los conductores en Rhode Island deben detenerse al menos a 50 pies
    de distancia de un autobús escolar que esté cargando o descargando pasajeros con
    las luces rojas intermitentes.
- id: 36
  category: driver_testing
  question: Según la ley de Rhode Island, ¿un niño debe estar debidamente sujeto en
    un asiento de seguridad infantil si tiene menos de qué edad y estatura?
  choices:
    A: Menos de 6 años y menos de 50 pulgadas de altura
    B: Menos de 8 años y menos de 57 pulgadas de altura
    C: Menos de 10 años y menos de 60 pulgadas de altura
    D: Menos de 12 años y menos de 62 pulgadas de altura
  answer: B
  explanation: La ley de Rhode Island exige que los niños menores de 8 años que pesen
    menos de 80 libras y midan menos de 57 pulgadas de altura utilicen un sistema
    de sujeción para niños.
- id: 37
  category: driver_testing
  question: 'En Rhode Island, se debe presentar un informe de accidente ante el DMV
    si hay una muerte, lesiones personales o daños a la propiedad de cualquier persona
    que excedan los:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Se debe presentar un Informe de Reparaciones de Vehículos Motorizados
    dentro de los 21 días si un accidente resulta en lesiones, muerte o daños a la
    propiedad que superen los $1,000.
- id: 38
  category: driver_testing
  question: ¿La ley de Rhode Island exige que los conductores enciendan sus faros
    delanteros durante cuál de los siguientes horarios?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes del amanecer
    B: Desde la puesta del sol hasta el amanecer
    C: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes del amanecer
    D: Solo cuando está completamente oscuro
  answer: C
  explanation: En Rhode Island, los faros delanteros deben encenderse desde 30 minutos
    después de la puesta del sol hasta 30 minutos antes del amanecer, y siempre que
    la visibilidad sea deficiente.
- id: 39
  category: driver_testing
  question: Para mantener una distancia de seguimiento segura en Rhode Island, ¿qué
    regla se recomienda que utilicen los conductores?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cinco segundos
  answer: C
  explanation: El Manual del Conductor de Rhode Island recomienda una distancia de
    seguimiento de tres segundos para permitir suficiente tiempo para reaccionar ante
    los peligros.
- id: 40
  category: driver_testing
  question: Bajo la ley de 'Consentimiento Implícito' (Implied Consent) de Rhode Island,
    si se niega a realizarse una prueba química para determinar su BAC, ¿por cuánto
    tiempo se suspenderá su licencia por una primera infracción?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: La negativa a someterse a una prueba química en Rhode Island resulta
    en una suspensión automática de la licencia por 6 meses por una primera infracción.
- id: 41
  category: driver_testing
  question: ¿Qué exige la "Ley de Ceder el Paso" (Move Over Law) de Rhode Island a
    los conductores al acercarse a un vehículo de emergencia estacionado con luces
    intermitentes?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse a un carril no adyacente o reducir la velocidad si el cambio de carril
      no es seguro
    D: Acelerar para pasar el vehículo rápidamente
  answer: C
  explanation: La Ley de Ceder el Paso exige que los conductores dejen libre el carril
    más cercano a los vehículos de emergencia o de mantenimiento estacionados, o que
    reduzcan la velocidad si no es posible cambiar de carril.
- id: 42
  category: driver_testing
  question: En Rhode Island, ¿a cuántos pies de un paso de peatones en una intersección
    no se puede estacionar un vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: La ley de Rhode Island prohíbe estacionar a menos de 20 pies de un
    paso de peatones en una intersección.
- id: 43
  category: driver_testing
  question: Al conducir de noche en Rhode Island, ¿a cuántos pies de un vehículo que
    se aproxima en sentido contrario debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Rhode Island exige que los conductores bajen las luces altas
    cuando un vehículo que viene en sentido contrario se encuentra a menos de 500
    pies.
- id: 44
  category: driver_testing
  question: 'La ley de Rhode Island exige que encienda los faros siempre que use los
    limpiaparabrisas debido a la lluvia, nieve o aguanieve. Esto se conoce a menudo
    como la:'
  choices:
    A: Ley de Limpiaparabrisas Encendidos, Luces Encendidas (Wipers On, Lights On
      Law)
    B: Ley de Visibilidad Primero
    C: Mandato de Clima Inclemente
    D: Regulación de Vista Despejada
  answer: A
  explanation: La Ley General de Rhode Island 31-24-1 exige que los faros se enciendan
    cuando los limpiaparabrisas están en uso debido a la lluvia, el aguanieve o la
    nieve.
- id: 45
  category: driver_testing
  question: Según la "Ley de Ceder el Paso" (Move Over Law) de Rhode Island, ¿qué
    debe hacer un conductor al acercarse a un vehículo de emergencia estacionado con
    luces intermitentes en una autopista con dos o más carriles que circulan en la
    misma dirección?
  choices:
    A: Detenerse por completo hasta que el vehículo de emergencia se retire
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Moverse a un carril que no sea adyacente al vehículo de emergencia, si es seguro
      hacerlo
    D: Acelerar para pasar el vehículo de emergencia lo más rápido posible
  answer: C
  explanation: La Ley de Ceder el Paso de Rhode Island (31-14-4.1) exige que los conductores
    dejen libre el carril más cercano a los vehículos de emergencia estacionados,
    incluidos los camiones de remolque y los vehículos de mantenimiento de carreteras,
    si es seguro hacerlo.
- id: 46
  category: driver_testing
  question: 'En Rhode Island, se considera que una persona de 21 años o más está conduciendo
    bajo la influencia (DUI) si su concentración de alcohol en sangre (BAC) es igual
    o superior a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para los conductores de 21 años o más en Rhode Island, el límite legal
    de concentración de alcohol en sangre (BAC) es de 0.08%.
- id: 47
  category: driver_testing
  question: Si un conductor de Rhode Island menor de 21 años es sorprendido conduciendo
    con una concentración de alcohol en sangre (BAC) de ____ o superior, puede ser
    acusado de una infracción de "Conducir después de haber bebido".
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Rhode Island tiene una política de "Tolerancia Cero" para menores;
    un BAC de 0.02% o superior para un conductor menor de 21 años conlleva sanciones
    significativas.
- id: 48
  category: driver_testing
  question: ¿Cuál es la multa por no usar el cinturón de seguridad en Rhode Island
    para cualquier pasajero de 13 años de edad o más?
  choices:
    A: $25
    B: $40
    C: $85
    D: $100
  answer: B
  explanation: En Rhode Island, la multa por una infracción del cinturón de seguridad
    es de $40 por cada persona que no esté sujeta.
- id: 49
  category: driver_testing
  question: ¿Qué regla recomienda el Manual del Conductor de Rhode Island para mantener
    una distancia de seguimiento segura detrás del vehículo que está delante de usted?
  choices:
    A: Regla de la longitud de un automóvil
    B: Regla de los dos segundos
    C: Regla de los tres segundos
    D: Regla de los cuatro segundos
  answer: C
  explanation: El Manual del Conductor de Rhode Island recomienda la "regla de los
    tres segundos" para garantizar una distancia de seguimiento segura en condiciones
    normales de conducción.
- id: 50
  category: driver_testing
  question: En Rhode Island, ¿con cuántos pies de antelación se requiere que señalice
    su intención de girar antes de realizar el giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: La ley de Rhode Island exige que los conductores señalicen al menos
    100 pies antes de realizar un giro o cambiar de carril.
- id: 51
  category: driver_testing
  question: ¿Cuál es la multa máxima por una condena por primera infracción de arrojar
    basura desde un vehículo motorizado en Rhode Island?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: La Ley General de Rhode Island 37-15-7 establece que arrojar basura
    desde un vehículo motorizado puede resultar en una multa de hasta $500 por una
    primera infracción.
- id: 52
  category: driver_testing
  question: Si conduce por una autopista de Rhode Island y se pasa de su salida, ¿qué
    debe hacer?
  choices:
    A: Detenerse y retroceder por el acotamiento
    B: Hacer un giro en U cruzando la mediana
    C: Continuar hasta la siguiente salida
    D: Detenerse a un lado y esperar una escolta policial
  answer: C
  explanation: El Manual del Conductor de Rhode Island establece que si se pasa de
    una salida, nunca debe detenerse ni retroceder; debe continuar hasta la siguiente
    salida.
- id: 53
  category: driver_responsibility
  question: En Rhode Island, si se ve involucrado en un accidente que resulte en daños
    a la propiedad superiores a $1,000, ¿dentro de cuántos días debe presentar un
    informe de accidente (SR-1) ante el DMV?
  choices:
    A: 5 días
    B: 10 días
    C: 21 días
    D: 30 días
  answer: C
  explanation: Según el Manual del Conductor de Rhode Island, cualquier accidente
    que involucre lesiones personales, muerte o daños a la propiedad que excedan los
    $1,000 debe informarse al DMV dentro de los 21 días utilizando el formulario SR-1.
- id: 54
  category: driver_responsibility
  question: Bajo la ley de 'Consentimiento Implícito' de Rhode Island, ¿cuál es la
    sanción por una primera infracción de negarse a someterse a una prueba química
    (aliento, sangre u orina)?
  choices:
    A: Una advertencia verbal y una multa de $50
    B: Una suspensión de la licencia de 6 a 12 meses, una multa y servicio comunitario
    C: 48 horas obligatorias en la cárcel
    D: Revocación permanente de la licencia de conducir
  answer: B
  explanation: La ley de Consentimiento Implícito de Rhode Island significa que, al
    conducir, usted acepta someterse a pruebas químicas. Una primera negativa generalmente
    resulta en una suspensión de la licencia de 6 a 12 meses, una multa de $200 a
    $500 y de 10 a 60 horas de servicio comunitario.
- id: 55
  category: driver_responsibility
  question: En Rhode Island, ¿cuál es el límite específico de concentración de alcohol
    en sangre (BAC) para que un conductor menor de 21 años sea citado por conducir
    bajo la influencia (DUI)?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Rhode Island tiene una política de 'tolerancia cero' para menores.
    Cualquier conductor menor de 21 años con un BAC de 0.02% o superior puede ser
    acusado de conducir bajo la influencia (DUI).
- id: 56
  category: driver_responsibility
  question: Según la ley de Rhode Island, ¿cuál es la multa por una primera infracción
    de no detenerse ante un autobús escolar que tiene sus luces rojas intermitentes
    encendidas y el brazo de parada extendido?
  choices:
    A: Hasta $100
    B: Exactamente $300
    C: Exactamente $500
    D: Exactamente $1,000
  answer: B
  explanation: En Rhode Island, la multa por una primera infracción de rebasar ilegalmente
    a un autobús escolar detenido es de $300 y/o una suspensión de la licencia por
    hasta 30 días.
- id: 57
  category: driver_responsibility
  question: Bajo la 'Ley Colin Foote', ¿qué puede sucederle a un conductor de Rhode
    Island que sea condenado por cuatro o más infracciones de tránsito en movimiento
    específicas dentro de un período de 18 meses?
  choices:
    A: Se le exige comprar un auto nuevo
    B: Enfrenta una multa de hasta $1,000 y la posible revocación de la licencia
    C: Debe volver a tomar únicamente el examen escrito del permiso
    D: No se aplican sanciones adicionales más allá de las multas estándar
  answer: B
  explanation: La Ley Colin Foote se dirige a los infractores reincidentes. Cuatro
    o más infracciones de tránsito en movimiento en 18 meses pueden dar lugar a una
    multa de hasta $1,000, reentrenamiento obligatorio para conductores y la revocación
    de la licencia por hasta dos años.
- id: 58
  category: driver_responsibility
  question: ¿Cuál es la distancia mínima a la que debe estacionar su vehículo de un
    hidrante de incendios en Rhode Island?
  choices:
    A: 5 pies
    B: 8 pies
    C: 10 pies
    D: 15 pies
  answer: B
  explanation: La ley de Rhode Island prohíbe estacionar un vehículo a menos de 8
    pies de un hidrante de incendios.
- id: 59
  category: driver_responsibility
  question: Si es condenado por una primera infracción de arrojar basura desde un
    vehículo motorizado en Rhode Island, ¿cuál es la multa máxima que podría enfrentar?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Hasta $500
    D: Hasta $2,000
  answer: C
  explanation: Arrojar basura es ilegal en Rhode Island. Una primera infracción puede
    resultar en una multa de hasta $500 y el requisito de recoger basura.
- id: 60
  category: driver_responsibility
  question: 'Cuando un vehículo de emergencia con luces intermitentes y una sirena
    se aproxima desde cualquier dirección, la ley de Rhode Island le exige:'
  choices:
    A: Aumentar la velocidad para quitarse del camino
    B: Detenerse exactamente donde está en medio de la carretera
    C: Hacerse al lado derecho de la carretera y detenerse
    D: Seguir de cerca al vehículo de emergencia
  answer: C
  explanation: La ley de Rhode Island exige que los conductores se dirijan al borde
    derecho o al bordillo de la calzada, lejos de las intersecciones, y se detengan
    hasta que el vehículo de emergencia haya pasado.
- id: 61
  category: driver_responsibility
  question: En Rhode Island, ¿hasta qué hito debe estar asegurado un niño en un asiento
    de seguridad para niños orientado hacia atrás?
  choices:
    A: 1 año de edad o 20 libras
    B: 2 años de edad o el límite de peso/altura del asiento
    C: 4 años de edad
    D: 6 años de edad
  answer: B
  explanation: La ley de Rhode Island exige que los niños permanezcan en un asiento
    de seguridad orientado hacia atrás hasta que tengan al menos 2 años de edad o
    hasta que alcancen el límite máximo de peso o altura designado por el fabricante
    del asiento.
- id: 62
  category: driver_responsibility
  question: Si conduce en Rhode Island y los frenos de su vehículo fallan, ¿cuál es
    la primera acción recomendada que debe tomar?
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a una marcha más baja y bombear el pedal del freno de forma rápida
      y fuerte
    C: Saltar fuera del coche
    D: Poner el coche en Park (estacionamiento)
  answer: B
  explanation: El Manual del Conductor de Rhode Island recomienda cambiar a una marcha
    más baja y bombear el pedal del freno varias veces para generar presión. Si eso
    falla, use el freno de mano.
- id: 63
  category: driver_responsibility
  question: ¿Para qué se utiliza la 'regla de los tres segundos' en la educación vial
    de Rhode Island?
  choices:
    A: El tiempo que se tarda en cambiar una llanta
    B: La cantidad de tiempo que debe señalizar antes de girar
    C: Determinar una distancia de seguimiento segura detrás del vehículo que va delante
      de usted
    D: El tiempo que debe esperar en una luz verde antes de avanzar
  answer: C
  explanation: La 'regla de los tres segundos' es el método recomendado para mantener
    una distancia de seguimiento segura entre su vehículo y el que está delante en
    condiciones normales de conducción.
- id: 64
  category: driver_responsibility
  question: En Rhode Island, si le detiene la policía, ¿qué tres documentos debe poder
    proporcionar?
  choices:
    A: Licencia de conducir, registro del vehículo y comprobante de seguro
    B: Licencia de conducir, certificado de nacimiento y tarjeta de seguro social
    C: Título del vehículo, comprobante de seguro y registro de votante
    D: Licencia de conducir, registro del vehículo y título del vehículo
  answer: A
  explanation: Todo conductor en Rhode Island debe llevar una licencia de conducir
    válida, el certificado de registro del vehículo y un comprobante válido de responsabilidad
    financiera (seguro).
- id: 65
  category: driver_responsibility
  question: ¿Cuál es la sanción por una primera infracción por operar un vehículo
    motorizado en Rhode Island sin evidencia válida de responsabilidad financiera
    (seguro)?
  choices:
    A: Solo una advertencia verbal
    B: Una multa de hasta $100 y sin suspensión
    C: Suspensión de la licencia y el registro por 3 meses y una multa de hasta $500
    D: Revocación permanente de la licencia de conducir
  answer: C
  explanation: En Rhode Island, no proporcionar un comprobante de seguro puede resultar
    en la suspensión de la licencia y el registro por 3 meses y una multa que oscila
    entre $100 y $500 por una primera infracción.
- id: 66
  category: driver_responsibility
  question: ¿Con qué frecuencia se requiere que la mayoría de los vehículos en Rhode
    Island se sometan a una inspección de seguridad y emisiones?
  choices:
    A: Cada año
    B: Cada 2 años
    C: Cada 5 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: La ley de Rhode Island exige que la mayoría de los vehículos motorizados
    se sometan a una inspección de seguridad y emisiones al menos una vez cada 2 años.
- id: 67
  category: driver_responsibility
  question: Si es declarado culpable de rebasar ilegalmente un autobús escolar detenido
    con luces rojas intermitentes por primera vez en Rhode Island, ¿cuál es la multa?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: En Rhode Island, la multa por una primera infracción por rebasar a
    un autobús escolar con sus luces rojas intermitentes es de $300, y su licencia
    puede ser suspendida por hasta 30 días.
- id: 68
  category: driver_responsibility
  question: La 'Ley de Moverse a un Lado' (Move Over Law) de Rhode Island exige que
    los conductores reduzcan la velocidad o cambien de carril al acercarse a ¿cuál
    de los siguientes en el lado de la carretera?
  choices:
    A: Cualquier vehículo con las luces de emergencia parpadeando
    B: Solo patrullas de policía
    C: Vehículos de emergencia estacionados, grúas o vehículos de mantenimiento de
      carreteras con luces intermitentes
    D: Solo camiones de bomberos
  answer: C
  explanation: La Ley de Moverse a un Lado exige que los conductores se muevan a un
    carril adyacente (si es seguro) o reduzcan la velocidad al acercarse a vehículos
    de emergencia estacionados, grúas o vehículos de mantenimiento que muestren luces
    intermitentes.
- id: 69
  category: driver_responsibility
  question: 'La ley de Rhode Island exige que la placa trasera de un vehículo esté
    iluminada para que sea claramente visible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 200 pies
  answer: B
  explanation: El Manual del Conductor de Rhode Island especifica que la placa trasera
    debe estar iluminada por una luz blanca para que sea visible desde 50 pies hacia
    atrás.
- id: 70
  category: driver_responsibility
  question: 'En Rhode Island, debe encender los faros de su vehículo siempre que use
    los limpiaparabrisas y siempre que la visibilidad sea inferior a:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Rhode Island exige que los faros estén encendidos desde el
    atardecer hasta el amanecer, cuando los limpiaparabrisas están en uso y siempre
    que la visibilidad se reduzca a 500 pies o menos.
- id: 71
  category: driver_responsibility
  question: 'Si usted se ve involucrado en un accidente de vehículo motorizado en
    Rhode Island que resulte en lesiones personales o muerte, debe notificar de inmediato
    a:'
  choices:
    A: Solo al DMV
    B: Solo a su agente de seguros
    C: Al departamento de policía más cercano
    D: A la oficina del Gobernador
  answer: C
  explanation: La ley de Rhode Island exige la notificación inmediata al departamento
    de policía más cercano si un accidente involucra lesiones o muerte.
- id: 72
  category: driver_responsibility
  question: 'En Rhode Island, un vehículo se considera inseguro y no pasará la inspección
    si la profundidad de la banda de rodadura de los neumáticos es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 2/32 de pulgada de profundidad
    de banda de rodadura para ser considerados seguros y pasar la inspección estatal
    de Rhode Island.
- id: 73
  category: driver_responsibility
  question: Según la ley de Rhode Island, ¿quién es responsable de asegurar que todos
    los pasajeros menores de 18 años estén debidamente sujetos por un cinturón de
    seguridad o un asiento de seguridad para niños?
  choices:
    A: Los propios pasajeros
    B: El propietario del vehículo
    C: El conductor del vehículo
    D: Solo los padres de los pasajeros
  answer: C
  explanation: En Rhode Island, el conductor es legalmente responsable de asegurar
    que todos los pasajeros menores de 18 años usen cinturones de seguridad o estén
    en sistemas de sujeción para niños apropiados.
- id: 74
  category: safe_driving_rules
  question: En Rhode Island, ¿cuál es el límite de velocidad máximo en un distrito
    comercial o residencial a menos que se indique lo contrario?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: Según el Manual del Conductor de Rhode Island, el límite de velocidad
    en cualquier distrito comercial o residencial es de 25 millas por hora (mph) a
    menos que se indique lo contrario.
- id: 75
  category: safe_driving_rules
  question: Según la ley de Rhode Island, ¿a cuántos pies de un hidrante de incendios
    no debe estacionar su vehículo?
  choices:
    A: 8 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: A
  explanation: La Ley General de Rhode Island § 31-21-4 establece que ninguna persona
    debe detener, parar o estacionar un vehículo a menos de 8 pies de un hidrante
    de incendios.
- id: 76
  category: safe_driving_rules
  question: De acuerdo con las regulaciones de estacionamiento de Rhode Island, ¿no
    puede estacionar a menos de cuántos pies de una señal de pare (stop) o de una
    señal de control de tráfico?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La Ley General de Rhode Island § 31-21-4 prohíbe estacionar a menos
    de 30 pies al acercarse a cualquier señal intermitente, señal de pare (stop) o
    señal de control de tráfico ubicada al costado de una calzada.
- id: 77
  category: safe_driving_rules
  question: 'Al seguir a otro vehículo en Rhode Island, el manual recomienda mantener
    una distancia de seguimiento de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Rhode Island recomienda la 'regla de los
    tres segundos' para mantener una distancia de seguimiento segura detrás del vehículo
    que va delante.
- id: 78
  category: safe_driving_rules
  question: 'Para un conductor de 21 años o más, la ley de Rhode Island define Conducir
    Bajo la Influencia (DUI) como tener una Concentración de Alcohol en Sangre (BAC)
    de:'
  choices:
    A: 0.02% o superior
    B: 0.05% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: C
  explanation: En Rhode Island, el límite legal de BAC es de 0.08% para conductores
    de 21 años o más. Para conductores menores de 21 años, el límite es de 0.02%.
- id: 79
  category: safe_driving_rules
  question: ¿Cuál es la multa obligatoria por una primera infracción del uso del cinturón
    de seguridad para un adulto en Rhode Island?
  choices:
    A: $25
    B: $40
    C: $75
    D: $100
  answer: B
  explanation: En Rhode Island, la multa por no usar el cinturón de seguridad es de
    $40 por persona.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es la multa por una primera infracción por exceso de velocidad en
    una zona escolar en Rhode Island?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: El exceso de velocidad en una zona escolar en Rhode Island conlleva
    una multa obligatoria de $200 por la primera infracción.
- id: 81
  category: safe_driving_rules
  question: 'La ley ''Move Over'' (hacerse a un lado) de Rhode Island exige que los
    conductores se muevan a un carril adyacente, si es seguro hacerlo, o reduzcan
    la velocidad al acercarse a:'
  choices:
    A: Solo patrullas de policía con luces intermitentes
    B: Solo ambulancias con sirenas
    C: Cualquier vehículo estacionado con luces intermitentes, incluidos vehículos
      de emergencia y de mantenimiento
    D: Solo autobuses escolares
  answer: C
  explanation: La Ley Move Over de Rhode Island (31-14-4.1) exige que los conductores
    dejen libre el carril más cercano a cualquier vehículo estacionado con luces intermitentes
    (emergencia, asistencia en carretera o mantenimiento) o que reduzcan la velocidad
    a una velocidad segura.
- id: 82
  category: safe_driving_rules
  question: Si usted se ve involucrado en un accidente de vehículo motorizado en Rhode
    Island que resulte en daños a la propiedad que superen los ______, debe presentar
    un informe de accidente ante el DMV en un plazo de 21 días.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Se debe presentar un Informe de Accidente de Vehículos Motorizados
    del Estado de Rhode Island en un plazo de 21 días si hay una muerte, lesiones
    personales o daños a la propiedad de cualquier persona que superen los $1,000.
- id: 83
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias es legal conducir en el 'carril de avería' (breakdown
    lane/arcén) de una autopista en Rhode Island?
  choices:
    A: Durante el tráfico intenso de las horas pico para mantener la fluidez
    B: Para rebasar a un vehículo lento por la derecha
    C: Solo en una emergencia o cuando lo indique un oficial de policía
    D: Al salir de la autopista dentro de una distancia de 500 pies
  answer: C
  explanation: Es ilegal conducir en el carril de avería en Rhode Island, excepto
    para fines de emergencia o cuando lo indique específicamente la policía o la señalización
    oficial.
- id: 84
  category: safe_driving_rules
  question: 'En Rhode Island, realizar un giro a la derecha con luz roja después de
    una parada completa es:'
  choices:
    A: Siempre ilegal
    B: Legal solo entre las 9:00 PM y las 6:00 AM
    C: Legal a menos que una señal lo prohíba
    D: Legal solo si hay una flecha verde
  answer: C
  explanation: En Rhode Island, usted puede girar a la derecha con luz roja después
    de detenerse por completo y ceder el paso a los peatones y a otros vehículos,
    siempre que no haya una señal que prohíba el giro.
- id: 85
  category: safe_driving_rules
  question: 'Según el Manual del Conductor de Rhode Island, el hidroplaneo (hydroplaning)
    parcial puede comenzar a velocidades tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El manual establece que el hidroplaneo (cuando los neumáticos pierden
    contacto con la carretera debido al agua) puede comenzar a velocidades tan bajas
    como 35 mph.
- id: 86
  category: safe_driving_rules
  question: 'Al entrar en una rotonda (roundabout) en Rhode Island, usted debe ceder
    el paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo
    C: A nadie; usted tiene el derecho de paso al entrar
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: Los conductores que entran en una rotonda deben ceder el paso al tráfico
    que ya está circulando dentro de la rotonda.
- id: 87
  category: defensive_driving
  question: Según el Manual del Conductor de Rhode Island, ¿cuál es la distancia de
    seguimiento recomendada detrás del vehículo que va delante de usted en condiciones
    normales de conducción?
  choices:
    A: La longitud de un vehículo por cada 10 mph
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: C
  explanation: El Manual del Conductor de Rhode Island recomienda la 'regla de los
    tres segundos' para mantener una distancia de seguimiento segura en condiciones
    normales.
- id: 88
  category: defensive_driving
  question: 'Para evitar frenazos de último minuto o la necesidad de girar repentinamente,
    la ley de Rhode Island sugiere que usted debe mirar hacia adelante a qué distancia
    de su vehículo:'
  choices:
    A: De 5 a 8 segundos
    B: De 10 a 12 segundos
    C: De 15 a 20 segundos
    D: 30 segundos
  answer: B
  explanation: Las pautas de conducción defensiva de Rhode Island sugieren observar
    la carretera de 10 a 12 segundos hacia adelante para identificar posibles peligros
    con anticipación.
- id: 89
  category: defensive_driving
  question: En Rhode Island, ¿cuándo le exige la ley encender los faros delanteros
    en relación con las condiciones climáticas?
  choices:
    A: Solo cuando la visibilidad es inferior a 100 pies
    B: Siempre que esté utilizando los limpiaparabrisas
    C: Solo durante tormentas de nieve
    D: Solo entre la puesta y la salida del sol
  answer: B
  explanation: Las Leyes Generales de Rhode Island exigen que los automovilistas enciendan
    los faros delanteros siempre que los limpiaparabrisas estén en uso debido a la
    lluvia, el aguanieve o la nieve.
- id: 90
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning), donde los
    neumáticos pierden contacto con la carretera sobre una fina capa de agua, en las
    condiciones climáticas de Rhode Island?
  choices:
    A: Tan baja como 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente a 45 mph
    D: Solo durante vientos con fuerza de huracán
  answer: A
  explanation: Según el Manual del Conductor de RI, el hidroplaneo puede comenzar
    a velocidades tan bajas como 35 mph, y los neumáticos pueden perder todo contacto
    con la carretera a 50 mph.
- id: 91
  category: defensive_driving
  question: ¿En Rhode Island, cuántos pies antes de realizar un giro o cambiar de
    carril debe activar su luz direccional?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: La ley de Rhode Island exige que los conductores indiquen su intención
    de girar o cambiar de carril al menos 100 pies antes de realizar la maniobra.
- id: 92
  category: defensive_driving
  question: ¿En Rhode Island, es ilegal estacionar su vehículo a menos de cuántos
    pies de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 8 pies
    C: 10 pies
    D: 15 pies
  answer: B
  explanation: La ley estatal de Rhode Island prohíbe específicamente estacionar a
    menos de 8 pies de un hidrante de incendios.
- id: 93
  category: defensive_driving
  question: Al estacionar cerca de una intersección, ¿la ley de Rhode Island establece
    que debe estar al menos a cuántos pies de distancia de una señal de pare (stop),
    una baliza intermitente o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Se prohíbe a los conductores en Rhode Island estacionar a menos de
    30 pies de cualquier señal intermitente, señal de pare o señal de control de tráfico
    ubicada al costado de una calzada.
- id: 94
  category: defensive_driving
  question: Según las regulaciones de estacionamiento de Rhode Island, ¿cuál es la
    distancia mínima que debe mantener de un paso de peatones en una intersección?
  choices:
    A: 10 pies
    B: 20 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: En Rhode Island, no se permite estacionar a menos de 20 pies de un
    paso de peatones en una intersección.
- id: 95
  category: defensive_driving
  question: Al rebasar una bicicleta que viaja en la misma dirección en Rhode Island,
    ¿cuál es la distancia mínima que un automovilista debe mantener entre el automóvil
    y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de 'Paso Seguro' (Safe Passing) de Rhode Island exige que los
    automovilistas dejen al menos 3 pies de espacio al adelantar a una bicicleta.
- id: 96
  category: defensive_driving
  question: Al conducir con niebla densa en Rhode Island, ¿qué configuración de faros
    debe usar para mantener la mejor visibilidad?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces
  answer: B
  explanation: En condiciones de niebla, debe usar las luces bajas. Las luces altas
    se reflejan en la niebla y crean un resplandor que dificulta la visión.
- id: 97
  category: defensive_driving
  question: Si conduce por una autopista de Rhode Island y se aproxima a un vehículo
    de emergencia estacionario con luces intermitentes, ¿qué le exige hacer la ley
    de 'Moverse a un lado' (Move Over)?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener la velocidad pero tocar la bocina
    C: Moverse a un carril que no sea adyacente al vehículo si es seguro, o reducir
      la velocidad
    D: Acelerar para pasar el área rápidamente
  answer: C
  explanation: La Ley Move Over de Rhode Island exige que los conductores se muevan
    un carril para alejarse de los vehículos de emergencia estacionarios con luces
    intermitentes. Si no es seguro cambiarse de carril, el conductor debe reducir
    la velocidad.
- id: 98
  category: defensive_driving
  question: Para evitar el hidroplaneo (hydroplaning) en carreteras mojadas de Rhode
    Island, ¿a qué velocidad debería comenzar a tener precaución adicional, ya que
    sus neumáticos podrían empezar a perder contacto con el pavimento?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de Rhode Island establece que el hidroplaneo
    puede comenzar a velocidades tan bajas como 35 mph, y a 55 mph, los neumáticos
    pueden perder todo contacto con la carretera.
- id: 99
  category: defensive_driving
  question: El Manual del Conductor de Rhode Island sugiere observar el camino adelante
    para ser un conductor defensivo. ¿Con cuánta anticipación debe mirar en términos
    de tiempo?
  choices:
    A: 3 a 5 segundos
    B: 5 a 8 segundos
    C: 10 a 12 segundos
    D: 20 a 30 segundos
  answer: C
  explanation: Las pautas de conducción defensiva de RI sugieren mirar de 10 a 12
    segundos hacia adelante (aproximadamente dos cuadras en la ciudad o media milla
    en la autopista) para anticipar posibles peligros.
- id: 100
  category: defensive_driving
  question: Al acercarse a una intersección en Rhode Island, ¿cuál es la secuencia
    de observación adecuada para la conducción defensiva?
  choices:
    A: Derecha, Izquierda, Derecha
    B: Izquierda, Derecha, Izquierda
    C: Recto, Izquierda, Derecha
    D: Izquierda, Recto, Derecha
  answer: B
  explanation: Los conductores deben mirar a la izquierda, luego a la derecha y luego
    a la izquierda nuevamente antes de entrar en una intersección, ya que los vehículos
    que vienen por la izquierda están más cerca y representan una amenaza inmediata.
- id: 101
  category: defensive_driving
  question: ¿Al conducir en carreteras resbaladizas (hielo o nieve) en Rhode Island,
    cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantener la regla de los 3 segundos
    B: Aumentarla a al menos 6 segundos
    C: Disminuirla a 1 segundo para mantenerse en las huellas del auto de adelante
    D: Mantenerla exactamente en 4 segundos
  answer: B
  explanation: En condiciones adversas como hielo o nieve, el manual de Rhode Island
    aconseja duplicar o triplicar su distancia de seguimiento (a 6 segundos o más)
    para permitir una mayor distancia de frenado.
- id: 102
  category: defensive_driving
  question: Al estacionar un vehículo cuesta abajo en una calle de Rhode Island con
    acera (bordillo), ¿hacia qué lado debe girar las ruedas?
  choices:
    A: Hacia la acera
    B: En dirección contraria a la acera
    C: Mantenerlas rectas
    D: Hacia el centro de la carretera
  answer: A
  explanation: Al estacionar cuesta abajo, gire las ruedas hacia la acera para que,
    si el vehículo rueda, choque contra la acera y se detenga.
- id: 103
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Rhode
    Island, ¿cuál es la respuesta correcta de conducción defensiva?
  choices:
    A: Pisar los frenos a fondo inmediatamente
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección en la que se desliza la parte trasera del
      vehículo
    D: Acelerar para ganar tracción
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del automóvil
    (también conocido como girar hacia el derrape).
- id: 104
  category: alcohol_drugs_health
  question: ¿Cuál es el período de suspensión obligatoria de la licencia por una primera
    infracción de negarse a someterse a una prueba química en Rhode Island?
  choices:
    A: De 30 a 90 días
    B: De 6 meses a 1 año
    C: 2 años
    D: Permanentemente
  answer: B
  explanation: Una primera infracción por negarse a someterse a una prueba química
    resulta en una suspensión obligatoria de la licencia de seis meses a un año, junto
    con multas y servicio comunitario.
- id: 105
  category: alcohol_drugs_health
  question: 'En Rhode Island, una condena por primera infracción de DUI (conducir
    bajo los efectos del alcohol o drogas) para un conductor con un BAC (concentración
    de alcohol en sangre) entre 0.08% y 0.10% conlleva una suspensión de la licencia
    de:'
  choices:
    A: De 10 a 30 días
    B: De 30 a 180 días
    C: De 6 a 12 meses
    D: De 1 a 2 años
  answer: B
  explanation: Para una primera infracción de DUI con un BAC de 0.08% pero menos de
    0.10%, el conductor enfrenta una suspensión de la licencia de 30 a 180 días.
- id: 106
  category: alcohol_drugs_health
  question: ¿Cuál es el número mínimo de horas de servicio comunitario requeridas
    para una condena por primera infracción de DUI en Rhode Island?
  choices:
    A: 5 horas
    B: 10 horas
    C: 50 horas
    D: 100 horas
  answer: B
  explanation: La ley de Rhode Island requiere de 10 a 60 horas de servicio comunitario
    por una condena de DUI por primera vez.
- id: 107
  category: alcohol_drugs_health
  question: 'En Rhode Island, si un conductor menor de 21 años es sorprendido transportando
    alcohol en un vehículo sin un padre o tutor legal, puede enfrentar una suspensión
    de la licencia de hasta:'
  choices:
    A: 10 días
    B: 30 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Según la ley de RI, a un menor que transporte alcohol (a menos que
    sea por trabajo o con un padre) se le puede suspender la licencia por hasta 30
    días por una primera infracción.
- id: 108
  category: alcohol_drugs_health
  question: ¿Cuál es la multa por una primera infracción de DUI en Rhode Island si
    el BAC del conductor es de 0.15% o superior?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: C
  explanation: Una primera infracción de DUI con un BAC de 0.15% o superior resulta
    en una multa obligatoria de $500, que es más alta que la multa para niveles de
    BAC más bajos.
- id: 109
  category: alcohol_drugs_health
  question: ¿Qué tarifa debe pagar cualquier persona condenada por DUI o que se niegue
    a una prueba química en Rhode Island para apoyar la Evaluación de Seguridad Vial
    (Highway Safety Assessment)?
  choices:
    A: $50
    B: $200
    C: $500
    D: $1,000
  answer: C
  explanation: Rhode Island requiere una tarifa de Evaluación de Seguridad Vial de
    $500 para aquellos condenados por DUI o por negarse a una prueba química.
- id: 110
  category: alcohol_drugs_health
  question: Bajo la ley de 'Contenedor Abierto' (Open Container) de Rhode Island,
    ¿cuál es la multa por una primera infracción de poseer un recipiente de bebida
    alcohólica abierto en el área de pasajeros de un vehículo motorizado?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: La Ley General de Rhode Island 31-22-21.1 establece que una primera
    infracción por tener un recipiente abierto de alcohol en un vehículo resulta en
    una multa de $200.
- id: 111
  category: alcohol_drugs_health
  question: 'Si un conductor de Rhode Island es condenado por una segunda infracción
    de DUI dentro de un período de cinco años, la sentencia de cárcel puede ser de
    hasta:'
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 5 años
  answer: C
  explanation: Una segunda condena por DUI dentro de los 5 años en Rhode Island puede
    resultar en una sentencia de cárcel de hasta 1 año.
- id: 112
  category: alcohol_drugs_health
  question: 'En Rhode Island, un conductor puede ser acusado de DUI si está operando
    un vehículo bajo la influencia de:'
  choices:
    A: Solo alcohol
    B: Solo drogas ilegales
    C: Solo medicamentos recetados
    D: Cualquier droga, sustancia controlada o alcohol que afecte la conducción
  answer: D
  explanation: La ley de RI aplica cargos de DUI a cualquier sustancia que afecte
    la capacidad de una persona para operar un vehículo de manera segura, incluyendo
    alcohol, drogas ilegales y medicamentos recetados o de venta libre.
- id: 113
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' en el contexto de la seguridad al conducir?
  choices:
    A: El efecto de conducir cansado
    B: El efecto combinado del alcohol y otra droga, que es mayor que la suma de sus
      efectos por separado
    C: La capacidad de ver mejor de noche después de comer zanahorias
    D: La mejora del tiempo de reacción por la cafeína
  answer: B
  explanation: Como se indica en el Manual del Conductor de RI, mezclar alcohol y
    drogas crea un efecto sinérgico, lo que significa que el deterioro es mucho más
    grave que si se usara cualquiera de los dos por separado.
- id: 114
  category: alcohol_drugs_health
  question: 'Una condena por primera infracción de DUI para un conductor menor de
    21 años (con un BAC de 0.02% a 0.08%) resulta en una suspensión de la licencia
    de:'
  choices:
    A: 30 días
    B: 60 días
    C: 6 a 12 meses
    D: 2 años
  answer: C
  explanation: Según la Ley General de RI 31-27-2.8, una primera infracción para un
    menor con un BAC entre 0.02% y 0.08% resulta en una suspensión de la licencia
    de 6 a 12 meses.
- id: 115
  category: alcohol_drugs_health
  question: En Rhode Island, ¿por cuánto tiempo puede un juez exigir que un infractor
    de DUI por primera vez instale un dispositivo de bloqueo de encendido (IID) después
    de que se restablezca su licencia?
  choices:
    A: 1 mes
    B: 3 meses a 1 año
    C: 5 años
    D: El resto de su vida
  answer: B
  explanation: Para una primera infracción de DUI, un juez tiene la discreción de
    ordenar la instalación de un IID por un período de 3 meses a 1 año después del
    período de suspensión.
- id: 116
  category: alcohol_drugs_health
  question: Para una primera condena por DUI en Rhode Island con un BAC entre 0.08%
    y 0.10%, ¿cuál es el rango de la multa impuesta?
  choices:
    A: $50 a $100
    B: $100 a $300
    C: $1,000 a $5,000
  answer: B
  explanation: Una condena por DUI por primera vez con un BAC de 0.08% a 0.10% conlleva
    una multa de $100 a $300, además de otros cargos y evaluaciones.
- id: 117
  category: alcohol_drugs_health
  question: 'Una condena por DUI por primera vez en Rhode Island (BAC de 0.08% a 0.10%)
    generalmente resulta en una suspensión de la licencia de:'
  choices:
    A: 10 a 30 días
    B: 30 a 180 días
    C: 1 año
    D: 2 años
  answer: B
  explanation: Para una primera infracción de DUI con un BAC entre 0.08% y 0.10%,
    el tribunal puede suspender la licencia del conductor por un período de 30 a 180
    días.
- id: 118
  category: alcohol_drugs_health
  question: En Rhode Island, ¿cuántas horas de servicio comunitario son obligatorias
    para una condena por DUI por primera vez?
  choices:
    A: 5 a 10 horas
    B: 10 a 60 horas
    C: 100 horas
    D: El servicio comunitario no es obligatorio para una primera infracción
  answer: B
  explanation: La ley de Rhode Island exige de 10 a 60 horas de servicio comunitario
    para una condena por DUI por primera vez.
- id: 119
  category: alcohol_drugs_health
  question: Si un conductor menor de 21 años es condenado por una infracción por primera
    vez por un BAC de 0.02% a 0.08%, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 6 a 18 meses
    D: Hasta que cumplan 21 años
  answer: C
  explanation: Los conductores menores de 21 años condenados por una infracción de
    'tolerancia cero' por primera vez (BAC 0.02%-0.08%) enfrentan una suspensión de
    la licencia de 6 a 18 meses.
- id: 120
  category: alcohol_drugs_health
  question: ¿Qué prohíbe la ley de 'Contenedor Abierto' de Rhode Island?
  choices:
    A: Poseer un contenedor de bebida alcohólica abierto en el área de pasajeros de
      un vehículo motorizado
    B: Beber agua mientras se conduce
    C: Transportar alcohol sin abrir en el maletero
    D: Tener una lata de refresco vacía en el portavasos
  answer: A
  explanation: La ley de Rhode Island prohíbe la posesión de un contenedor de bebida
    alcohólica abierto por parte del conductor o cualquier pasajero dentro del área
    de pasajeros de un vehículo motorizado en una vía pública.
- id: 121
  category: alcohol_drugs_health
  question: 'En Rhode Island, si un conductor es condenado por una primera ofensa
    de DUI con un BAC (concentración de alcohol en sangre) de 0.15% o superior, la
    multa obligatoria es:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Para una primera ofensa de DUI con un BAC de 0.15% o superior, la ley
    de Rhode Island exige una multa de $500.
- id: 122
  category: alcohol_drugs_health
  question: 'Si una persona menor de 21 años se niega a realizarse una prueba química
    en Rhode Island por primera vez, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: La negativa a someterse a una prueba química por primera vez por parte
    de una persona menor de 21 años resulta en una suspensión obligatoria de la licencia
    por 6 meses.
- id: 123
  category: alcohol_drugs_health
  question: 'En Rhode Island, si es condenado por DUI mientras un niño menor de 13
    años se encuentra en el vehículo, podría enfrentar una suspensión adicional de
    la licencia de:'
  choices:
    A: 3 meses
    B: 6 meses
    C: Hasta 1 año
    D: 5 años
  answer: C
  explanation: La ley de Rhode Island impone sanciones más severas por DUI con un
    pasajero menor de edad, incluyendo una suspensión adicional de la licencia de
    hasta un año si el pasajero es menor de 13 años.
- id: 124
  category: alcohol_drugs_health
  question: 'Según la ley de Rhode Island, conducir bajo la influencia de cualquier
    droga (legal o ilegal) que lo incapacite para operar un vehículo de manera segura
    es:'
  choices:
    A: Permitido si la droga es recetada
    B: Sujeto a las mismas sanciones que el DUI relacionado con el alcohol
    C: Solo una infracción si está involucrado en un choque
    D: Una multa de tráfico menor
  answer: B
  explanation: Las leyes de DUI de Rhode Island se aplican al deterioro causado por
    cualquier droga, incluidos los medicamentos recetados y la marihuana, y conllevan
    las mismas sanciones que el DUI relacionado con el alcohol.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cuál es la tarifa para restablecer una licencia de conducir de Rhode
    Island que fue suspendida debido a una infracción relacionada con el alcohol?
  choices:
    A: $50
    B: $100
    C: $350
    D: $500
  answer: D
  explanation: La tarifa de restablecimiento de una licencia suspendida debido a infracciones
    relacionadas con el alcohol o las drogas en Rhode Island es de $500.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de reducir su concentración
    de alcohol en sangre (BAC) antes de conducir?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Darle tiempo a su cuerpo para procesar el alcohol
    D: Hacer ejercicio vigorosamente
  answer: C
  explanation: El tiempo es el único factor que reducirá el BAC. El café, las duchas
    y el ejercicio no aceleran la capacidad del hígado para oxidar el alcohol.
- id: 127
  category: penalties_and_points
  question: Bajo la 'Ley Colin Foote', ¿un conductor que es condenado por cuántas
    infracciones de tránsito en movimiento dentro de un período de 18 meses puede
    enfrentar una suspensión de licencia de hasta 60 días y una multa de hasta $1,000?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: C
  explanation: La Ley Colin Foote se dirige a los infractores reincidentes; cuatro
    infracciones de tránsito en movimiento en 18 meses activan el reentrenamiento
    obligatorio del conductor, multas elevadas y una posible suspensión de la licencia.
- id: 128
  category: penalties_and_points
  question: En Rhode Island, la 'conducción agresiva' se define como un solo incidente
    en el que un conductor comete ¿cuántas infracciones de tránsito específicas (como
    exceso de velocidad y seguir demasiado de cerca)?
  choices:
    A: Dos o más
    B: Tres o más
    C: Cuatro o más
    D: Cinco o más
  answer: A
  explanation: La conducción agresiva en Rhode Island se define como cometer dos o
    más infracciones específicas, incluyendo exceso de velocidad, no ceder el paso,
    seguir demasiado de cerca o cambios de carril inadecuados.
- id: 129
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de estacionarse en un espacio
    designado para personas con discapacidades sin el cartel o la placa correspondiente
    en Rhode Island?
  choices:
    A: $50
    B: $75
    C: $100
    D: $250
  answer: C
  explanation: La multa por una infracción por primera vez de estacionarse en un espacio
    accesible para personas con discapacidad en Rhode Island es de $100.
- id: 130
  category: penalties_and_points
  question: Bajo la ley 'Move Over' (Moverse de carril) de Rhode Island, ¿cuál es
    la multa por una primera infracción por no moverse a un carril adyacente (si es
    seguro) al acercarse a un vehículo de emergencia estacionado con luces intermitentes?
  choices:
    A: $40
    B: $85
    C: $150
    D: $250
  answer: B
  explanation: La multa por no moverse de carril o no reducir la velocidad ante un
    vehículo de emergencia en Rhode Island es de $85 por una primera infracción.
- id: 131
  category: penalties_and_points
  question: En Rhode Island, si se encuentra a un conductor con un recipiente abierto
    de una bebida alcohólica en el área de pasajeros de un vehículo mientras se encuentra
    en una vía pública, ¿a cuántos meses de suspensión de la licencia podría enfrentarse
    por una primera infracción?
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 12 meses
  answer: C
  explanation: Una primera infracción por violación de recipiente abierto en Rhode
    Island puede resultar en una suspensión de la licencia de hasta 6 meses.
- id: 132
  category: penalties_and_points
  question: Para un conductor adulto (mayor de 18 años), ¿cuál es la multa por una
    primera infracción por usar un dispositivo inalámbrico para redactar, leer o enviar
    un mensaje de texto mientras opera un vehículo motorizado en Rhode Island?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La ley de Rhode Island prohíbe enviar mensajes de texto mientras se
    conduce para todas las edades; la multa por una primera infracción es de $100.
- id: 133
  category: penalties_and_points
  question: ¿Cuántos "puntos" añade el DMV de Rhode Island a su historial de conducción
    por una multa estándar por exceso de velocidad?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 6 puntos
    D: Rhode Island no utiliza un sistema de puntos
  answer: D
  explanation: Rhode Island es uno de los pocos estados que no utiliza un sistema
    de puntos para rastrear las infracciones de tránsito; en su lugar, rastrean el
    número de condenas durante un período de tiempo específico (como la Ley Colin
    Foote).
- id: 134
  category: penalties_and_points
  question: En Rhode Island, las multas por exceso de velocidad se duplican cuando
    la infracción ocurre en ¿cuál de las siguientes áreas?
  choices:
    A: Zonas escolares y zonas de construcción
    B: Vecindarios residenciales
    C: Zonas hospitalarias
    D: Carreteras estatales
  answer: A
  explanation: Las multas por exceso de velocidad en Rhode Island se duplican si la
    infracción ocurre en una zona escolar designada o en una zona de construcción
    o mantenimiento de carreteras cuando hay trabajadores presentes.
- id: 135
  category: penalties_and_points
  question: Un conductor de Rhode Island debe presentar un informe de accidente (Formulario
    SR-1) ante el DMV si un accidente resulta en muerte, lesiones personales o daños
    a la propiedad que excedan ¿qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: La ley de Rhode Island exige que los conductores informen cualquier
    accidente al DMV dentro de los 21 días si hay lesiones, muerte o daños a la propiedad
    de cualquier persona que superen los $1,000.
- id: 136
  category: penalties_and_points
  question: ¿Cuál es la multa para un conductor o pasajero de Rhode Island (mayor
    de 13 años) que sea sorprendido sin usar el cinturón de seguridad?
  choices:
    A: $25
    B: $40
    C: $75
    D: $100
  answer: B
  explanation: La ley de Rhode Island exige una multa de $40 para cualquier persona
    de 13 años o más que no esté debidamente sujeta por un cinturón de seguridad mientras
    el vehículo está en funcionamiento.
- id: 137
  category: penalties_and_points
  question: Según la ley de Rhode Island, a un conductor con una Licencia Provisional
    Limitada se le suspenderán sus privilegios de conducción si es condenado por ¿cuántas
    infracciones de tránsito en movimiento dentro de un período de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Para los titulares de GDL (Permiso de Instrucción Limitado o Licencia
    Provisional Limitada), una condena por una tercera infracción de tránsito en movimiento
    resulta en la suspensión de la licencia hasta que el conductor cumpla 18 años.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de "Enviar mensajes de texto
    al conducir" para un conductor de Rhode Island que tiene 18 años de edad o más?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: En Rhode Island, la multa por una primera infracción de enviar mensajes
    de texto mientras se conduce para un adulto es de $100. Las infracciones posteriores
    conllevan multas más altas y una posible suspensión de la licencia.
- id: 139
  category: penalties_and_points
  question: En Rhode Island, ¿cuál es la tarifa de "Evaluación de Seguridad en las
    Carreteras" (Highway Safety Assessment) que debe pagar cualquier conductor condenado
    por DUI o por rechazo a una prueba química?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: La ley de Rhode Island exige una tarifa de Evaluación de Seguridad
    en las Carreteras de $500 para las personas condenadas por conducir bajo la influencia
    (DUI) o por rechazar una prueba química.
- id: 140
  category: penalties_and_points
  question: Si un conductor de Rhode Island es condenado por "Conducción agresiva",
    debe asistir a un curso de capacitación obligatorio y puede enfrentarse a una
    suspensión de la licencia de hasta ¿cuántos días por una primera infracción?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La conducción agresiva (cometer dos o más infracciones específicas
    como exceso de velocidad y cambios de carril inseguros) puede resultar en una
    suspensión de la licencia de 30 días y la asistencia obligatoria a un programa
    educativo.
- id: 141
  category: penalties_and_points
  question: 'En Rhode Island, si se le condena por conducir con una licencia suspendida,
    revocada o cancelada por primera vez, la multa generalmente oscila entre:'
  choices:
    A: $100 y $200
    B: $250 y $500
    C: $500 y $1,000
    D: $1,000 y $2,000
  answer: B
  explanation: Una primera condena por conducir con una licencia suspendida o revocada
    en Rhode Island suele conllevar una multa de $250 a $500.
- id: 142
  category: penalties_and_points
  question: 'Si un conductor de Rhode Island se ve involucrado en un accidente con
    un vehículo desatendido y no se puede encontrar al propietario, el conductor debe:'
  choices:
    A: Esperar en la escena durante al menos 2 horas
    B: Dejar una nota con su nombre, dirección y número de registro
    C: Alejarse si no hay daños visibles
    D: Informar solo si el daño parece ser superior a $2,000
  answer: B
  explanation: La ley de Rhode Island exige que los conductores que choquen contra
    un vehículo desatendido localicen al propietario o dejen un aviso por escrito
    con su información de contacto y el registro del vehículo.
- id: 143
  category: penalties_and_points
  question: En Rhode Island, se considera que un conductor es 'habitualmente temerario
    o negligente' y se le puede suspender la licencia si se ve involucrado en ¿cuántos
    accidentes 'con culpa' (at-fault) en un período de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: El DMV de RI puede suspender la licencia de cualquier persona que haya
    estado involucrada en tres accidentes 'con culpa' en un período de un año.
- id: 144
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en una carretera de cuatro carriles
    con sus luces rojas intermitentes, ¿qué conductores deben detenerse si no hay
    una barrera física o mediana?
  choices:
    A: Solo los conductores que siguen al autobús
    B: Solo los conductores en el carril inmediatamente al lado del autobús
    C: Los conductores en todos los carriles y en ambas direcciones de circulación
    D: Solo los conductores que viajan en la dirección opuesta
  answer: C
  explanation: En Rhode Island, los automovilistas deben detenerse ante un autobús
    escolar con luces rojas intermitentes, independientemente de la dirección de viaje,
    a menos que la carretera esté dividida por una barrera física o mediana.
- id: 145
  category: sharing_the_road
  question: 'Al rebasar una bicicleta que viaja en la misma dirección, la ley de Rhode
    Island exige que los automovilistas mantengan una distancia mínima de al menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La Ley General de Rhode Island § 31-15-18 exige que el conductor de
    un vehículo motorizado que rebase a una persona que opera una bicicleta deje una
    distancia de seguridad, que se define como no menos de tres (3) pies.
- id: 146
  category: sharing_the_road
  question: ¿Qué es la 'Zona No' (No-Zone) en relación con compartir la carretera
    con camiones grandes?
  choices:
    A: El área donde no se permite conducir camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: La zona de límite de velocidad para vehículos comerciales
    D: El límite de peso para puentes
  answer: B
  explanation: La 'Zona No' se refiere a los puntos ciegos significativos alrededor
    de un camión grande donde el conductor no puede ver a otros vehículos. Si no puede
    ver la cara del conductor del camión en sus espejos laterales, él no puede verlo
    a usted.
- id: 147
  category: sharing_the_road
  question: 'En Rhode Island, si un peatón está cruzando la calle en un paso de peatones
    marcado o no marcado, el conductor debe:'
  choices:
    A: Tocar la bocina para advertir al peatón que se mueva más rápido
    B: Ceder el paso y detenerse si es necesario
    C: Rodear al peatón si hay espacio
    D: Solo detenerse si el peatón usa un bastón blanco
  answer: B
  explanation: La ley de Rhode Island exige que los conductores cedan el paso a los
    peatones que cruzan la calzada dentro de cualquier paso de peatones marcado o
    no marcado en una intersección.
- id: 148
  category: sharing_the_road
  question: Al seguir a una motocicleta, ¿por qué debería dejar una distancia de seguimiento
    mayor que la que dejaría para un automóvil?
  choices:
    A: Las motocicletas son más pesadas y tardan más en detenerse
    B: Las motocicletas pueden detenerse mucho más rápido que otros vehículos
    C: La ley exige que los motociclistas sean seguidos a una distancia de 500 pies
    D: Las motocicletas tienen puntos ciegos más grandes
  answer: B
  explanation: Las motocicletas pueden detenerse más rápido que los automóviles. El
    manual del conductor de Rhode Island recomienda una distancia de seguimiento de
    al menos 4 segundos para permitir suficiente tiempo para reaccionar si el motociclista
    frena repentinamente.
- id: 149
  category: sharing_the_road
  question: 'Si un vehículo de emergencia (policía, bomberos o ambulancia) se le acerca
    por detrás con la sirena y las luces activadas, usted debe:'
  choices:
    A: Detenerse exactamente donde está en el carril
    B: Acelerar para mantenerse por delante
    C: Orillarse al borde derecho de la carretera y detenerse
    D: Orillarse a la mediana izquierda y detenerse
  answer: C
  explanation: La ley de Rhode Island exige que los conductores cedan el paso orillándose
    al borde o bordillo derecho de la calzada, fuera de cualquier intersección, y
    deteniéndose hasta que el vehículo de emergencia haya pasado.
- id: 150
  category: sharing_the_road
  question: ¿Cuál es la sanción por una segunda infracción de rebasar un autobús escolar
    detenido con luces rojas intermitentes dentro de un período de tres años en Rhode
    Island?
  choices:
    A: Una multa de $100 y sin suspensión
    B: Una multa de $300 a $500 y una suspensión de la licencia de 30 días a 1 año
    C: Una sentencia de prisión obligatoria de 5 años
    D: Revocación permanente de la licencia de conducir
  answer: B
  explanation: Según la Ley General de RI § 31-20-12, una segunda infracción dentro
    de los tres años resulta en una multa de $300 a $500 y una suspensión de la licencia
    de 30 días a un año.
- id: 151
  category: sharing_the_road
  question: 'Según la ley de Rhode Island, los ciclistas que circulan por la calzada
    tienen:'
  choices:
    A: Ningún derecho y deben ceder el paso a todos los vehículos motorizados
    B: Los mismos derechos y deberes que los operadores de vehículos motorizados
    C: El derecho a circular únicamente por la acera
    D: El derecho a ignorar los semáforos en rojo y las señales de alto
  answer: B
  explanation: A los ciclistas en Rhode Island se les otorgan todos los derechos y
    están sujetos a todos los deberes aplicables al conductor de un vehículo, incluyendo
    obedecer las señales de tráfico y los semáforos.
- id: 152
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión a menudo puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Abrirse hacia la izquierda para completar el giro
    C: Detenerse y retroceder para realizar el giro
    D: Girar únicamente desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes necesitan espacio adicional para girar. A menudo
    se abren hacia la izquierda para no chocar con el bordillo en un giro a la derecha.
    Los conductores nunca deben intentar meterse entre un camión que está girando
    y el bordillo.
- id: 153
  category: sharing_the_road
  question: ¿Es legal en Rhode Island el 'lane splitting' (conducir una motocicleta
    entre filas de vehículos detenidos o en movimiento)?
  choices:
    A: Sí, a velocidades inferiores a 20 mph
    B: Sí, pero solo en autopistas
    C: No, es ilegal
    D: Solo durante las horas pico de tráfico
  answer: C
  explanation: En Rhode Island, las motocicletas tienen derecho al uso completo de
    un carril, y el 'lane splitting' (filtrarse entre carriles) está prohibido.
- id: 154
  category: sharing_the_road
  question: La 'Ley de Moverse a un Lado' (Move Over Law) de Rhode Island se aplica
    a los vehículos de emergencia estacionados con luces intermitentes y ¿a cuál de
    los siguientes?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Vehículos de recuperación (grúas) y vehículos de mantenimiento de carreteras
      con luces intermitentes
    C: Cualquier vehículo estacionado en el arcén (hombro)
    D: Camiones de helados
  answer: B
  explanation: La ley (RI § 31-14-3) incluye específicamente vehículos de emergencia
    autorizados, grúas y vehículos de mantenimiento de carreteras que muestren luces
    intermitentes de color ámbar o rojo/blanco.
- id: 155
  category: sharing_the_road
  question: 'Cuando un peatón ciego cruza la calle usando un bastón blanco o un perro
    guía, la ley de Rhode Island exige que los conductores:'
  choices:
    A: Toquen la bocina para avisarles que usted está allí
    B: Tomen el derecho de paso si el semáforo está en verde
    C: Se detengan por completo y tomen precauciones para evitar lesiones
    D: Reduzcan la velocidad a 5 mph pero no se detengan
  answer: C
  explanation: La Ley General de Rhode Island § 31-18-13 establece que cualquier conductor
    que se aproxime a una persona total o parcialmente ciega que lleve un bastón o
    use un perro guía debe detener el vehículo por completo y tomar las precauciones
    necesarias.
- id: 156
  category: sharing_the_road
  question: 'En Rhode Island, NO es obligatorio detenerse ante un autobús escolar
    con luces rojas intermitentes si:'
  choices:
    A: Usted viaja en el lado opuesto de una carretera dividida separada por una barrera
      física
    B: El autobús está detenido en una zona residencial
    C: Hay al menos tres carriles de circulación y usted se encuentra en el carril
      del extremo izquierdo
    D: Usted viaja en la misma dirección pero el autobús está en un apartadero exclusivo
      para autobuses
  answer: A
  explanation: Los automovilistas no están obligados a detenerse ante un autobús escolar
    en una carretera dividida si el autobús se encuentra al otro lado de una barrera
    física o franja divisoria (mediana).
- id: 157
  category: sharing_the_road
  question: Según la ley de Rhode Island, ¿qué operadores de motocicletas están obligados
    a usar casco?
  choices:
    A: Solo los menores de 18 años
    B: Todos los operadores, independientemente de su edad o experiencia
    C: Todos los operadores durante su primer año de licencia y todos los pasajeros
    D: Solo los operadores de motocicletas con motores de más de 500 cc
  answer: C
  explanation: Las Leyes Generales de Rhode Island § 31-10.1-4 exigen que todos los
    pasajeros de motocicletas usen casco, y que todos los operadores usen casco durante
    el primer año después de que se les haya expedido la licencia.
- id: 158
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen 'Zonas Prohibidas' (No-Zones).
    ¿Dónde se encuentra la 'Zona Prohibida' más grande?
  choices:
    A: Directamente delante del camión
    B: En el lado izquierdo del camión
    C: En el lado derecho del camión
    D: Directamente detrás del camión
  answer: C
  explanation: El punto ciego del lado derecho (No-Zone) es el más grande y peligroso
    porque los camiones deben realizar giros amplios a la derecha, y la visibilidad
    del conductor es más limitada en ese lado.
- id: 159
  category: sharing_the_road
  question: En Rhode Island, ¿a cuántos pies debe mantenerse detrás de un aparato
    de bomberos (camión de bomberos) que responde a una alarma?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Las Leyes Generales de Rhode Island § 31-22-7 prohíben seguir a cualquier
    aparato de bomberos que viaje en respuesta a una alarma de incendio a menos de
    500 pies.
- id: 160
  category: sharing_the_road
  question: Cuando un autobús escolar muestra luces ámbar (amarillas) intermitentes,
    ¿qué indica esto a los conductores de Rhode Island?
  choices:
    A: El autobús está a punto de detenerse y los conductores deben prepararse para
      parar
    B: El autobús tiene un problema mecánico
    C: El autobús está cargando estudiantes y usted puede pasar con precaución
    D: El autobús circula por debajo del límite de velocidad
  answer: A
  explanation: Las luces ámbar intermitentes son una advertencia de que el autobús
    se está preparando para detenerse a cargar o descargar niños; los automovilistas
    deben reducir la velocidad y prepararse para detenerse cuando se activen las luces
    rojas.
- id: 161
  category: sharing_the_road
  question: ¿En Rhode Island, es legal la "división de carril" (lane splitting), es
    decir, una motocicleta conduciendo entre filas de vehículos detenidos o en movimiento
    en el mismo carril?
  choices:
    A: Sí, a velocidades inferiores a 15 mph
    B: Sí, pero solo en autopistas
    C: No, es ilegal
    D: Solo si la motocicleta tiene las luces de emergencia encendidas
  answer: C
  explanation: Las Leyes Generales de Rhode Island § 31-10.1-7 prohíben que las motocicletas
    operen entre carriles de tráfico o entre líneas o filas adyacentes de vehículos.
- id: 162
  category: sharing_the_road
  question: Si usted sigue a un cortejo fúnebre en Rhode Island, ¿cuál es la regla
    con respecto al vehículo guía y las señales de tráfico?
  choices:
    A: El vehículo guía debe detenerse ante todas las luces rojas
    B: Todo el cortejo debe detenerse ante todas las luces rojas
    C: El vehículo guía debe obedecer las señales, pero los vehículos que lo siguen
      en el cortejo pueden continuar a través de una luz roja si tienen sus faros
      encendidos
    D: No se reconoce que los cortejos fúnebres tengan ningún derecho de paso especial
  answer: C
  explanation: Según la ley de RI, una vez que el vehículo guía de un cortejo fúnebre
    ha entrado legalmente en una intersección, los vehículos restantes del cortejo
    pueden continuar a través de la intersección a pesar de una señal de tráfico,
    siempre que tengan los faros encendidos y sigan de cerca al vehículo que va delante.
- id: 163
  category: sharing_the_road
  question: 'Cuando un peatón es guiado por un animal de servicio o lleva un bastón
    blanco (con o sin punta roja), la ley de Rhode Island exige que los conductores:'
  choices:
    A: Toquen la bocina para avisarles que usted está allí
    B: Se detengan y tomen precauciones para evitar lesiones al peatón
    C: Solo se detengan si el peatón está en un cruce peatonal marcado
    D: Conduzcan alrededor de ellos lentamente
  answer: B
  explanation: Las Leyes Generales de Rhode Island § 31-18-13 exigen que los conductores
    tomen todas las precauciones necesarias para evitar lesiones a un peatón ciego
    o con discapacidad visual.
- id: 164
  category: sharing_the_road
  question: 'En Rhode Island, generalmente se requiere que los ciclistas circulen:'
  choices:
    A: Por la acera en todo momento
    B: En contra del flujo del tráfico (de frente a los autos)
    C: Con el flujo del tráfico, tan cerca del lado derecho de la calzada como sea
      practicable
    D: En el centro del carril independientemente de la velocidad
  answer: C
  explanation: Las bicicletas se consideran vehículos en Rhode Island y deben circular
    con el tráfico, tan a la derecha como sea seguro y practicable.
- id: 165
  category: sharing_the_road
  question: ¿Qué es el método "Dutch Reach", el cual se recomienda para proteger a
    los ciclistas en Rhode Island?
  choices:
    A: Una forma de señalar un giro a la izquierda
    B: Abrir la puerta de su automóvil con la mano más alejada para obligarlo a mirar
      hacia atrás en busca de ciclistas
    C: Un método para asegurar una bicicleta al portaequipajes de un vehículo
    D: Una técnica para rebasar a un camión por la derecha
  answer: B
  explanation: El "Dutch Reach" consiste en utilizar la mano más alejada de la puerta
    para abrirla, lo que hace que el cuerpo y la cabeza del conductor giren de forma
    natural para buscar ciclistas o tráfico que se aproxime.
- id: 166
  category: sharing_the_road
  question: 'En Rhode Island, si un vehículo de emergencia con sirenas y luces intermitentes
    se aproxima por detrás en una carretera de doble sentido, usted debe:'
  choices:
    A: Detenerse exactamente donde está
    B: Acelerar para quitarse del camino
    C: Hacerse a un lado hacia el borde derecho de la carretera y detenerse
    D: Hacerse a un lado hacia el borde izquierdo de la carretera y detenerse
  answer: C
  explanation: Las Leyes Generales de Rhode Island § 31-17-6 exigen que los conductores
    cedan el derecho de paso acercándose lo más posible al borde o bordillo derecho
    de la calzada y deteniéndose hasta que el vehículo de emergencia haya pasado.
- id: 167
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo de pasajeros en Rhode Island?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: En Rhode Island, los neumáticos se consideran inseguros y no pasarán
    la inspección si la profundidad de la banda de rodadura es inferior a 2/32 de
    pulgada.
- id: 168
  category: vehicle_information
  question: En Rhode Island, ¿a cuántos pies de distancia debe atenuar sus luces altas
    cuando sigue a otro vehículo por detrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los conductores en Rhode Island deben cambiar a luces bajas cuando
    sigan a otro vehículo a una distancia de 200 pies o menos.
- id: 169
  category: vehicle_information
  question: Según la ley de Rhode Island, el polarizado de las ventanas laterales
    y traseras (no original) debe permitir el paso de al menos qué porcentaje de luz?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 70%
  answer: D
  explanation: La Ley General de Rhode Island 31-23.3-2 establece que ninguna persona
    instalará ninguna reflectancia solar total de más del 70% en las ventanas laterales
    o traseras; efectivamente, las ventanas deben tener una transmitancia de luz total
    no inferior al 70%.
- id: 170
  category: vehicle_information
  question: ¿Entre qué fechas está legalmente permitido el uso de neumáticos para
    nieve con clavos en las carreteras de Rhode Island?
  choices:
    A: Del 1 de octubre al 1 de marzo
    B: Del 1 de noviembre al 1 de abril
    C: Del 15 de noviembre al 1 de abril
    D: Del 1 de diciembre al 31 de marzo
  answer: C
  explanation: En Rhode Island, los neumáticos para nieve con clavos solo son legales
    para su uso desde el 15 de noviembre hasta el 1 de abril.
- id: 171
  category: vehicle_information
  question: En Rhode Island, el freno de servicio de un vehículo (freno de pie) debe
    ser capaz de detener el vehículo en cuántos pies cuando viaja a 20 mph en un pavimento
    seco y nivelado?
  choices:
    A: 15 pies
    B: 25 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: Los estándares de seguridad de Rhode Island requieren que el freno
    de pie sea capaz de detener un vehículo de pasajeros que viaja a 20 mph en una
    distancia de 25 pies.
- id: 172
  category: vehicle_information
  question: Todo vehículo motorizado en Rhode Island debe estar equipado con un espejo
    ubicado de tal manera que refleje al conductor una vista de la carretera por una
    distancia de al menos ¿cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Rhode Island exige que los espejos proporcionen una vista
    de la carretera de al menos 200 pies hacia la parte trasera del vehículo.
- id: 173
  category: vehicle_information
  question: La bocina de un vehículo motorizado en Rhode Island debe ser audible en
    condiciones normales desde una distancia no menor a ¿cuántos pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley estatal exige que la bocina de un vehículo se escuche desde
    una distancia de al menos 200 pies, pero no debe usarse innecesariamente.
- id: 174
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones es ILEGAL con respecto al sistema de
    escape de un vehículo en Rhode Island?
  choices:
    A: Usar un silenciador que sea equipo original
    B: Usar un recorte de silenciador (muffler cutout), derivación (bypass) o dispositivo
      similar
    C: Tener un tubo de escape que se extienda hasta la parte trasera del vehículo
    D: Reemplazar un silenciador dañado con una versión comercial estándar
  answer: B
  explanation: La ley de Rhode Island prohíbe el uso de recortes de silenciador, derivaciones
    o dispositivos similares que aumenten el ruido o impidan la reducción efectiva
    del mismo.
- id: 175
  category: vehicle_information
  question: En Rhode Island, un niño debe estar debidamente sujeto en el asiento trasero
    de un vehículo si tiene menos de qué edad y peso (a menos que el vehículo no tenga
    asiento trasero)?
  choices:
    A: Menos de 5 años y menos de 40 libras
    B: Menos de 6 años y menos de 60 libras
    C: Menos de 8 años, menos de 57 pulgadas de altura y menos de 80 libras
    D: Menos de 10 años y menos de 100 libras
  answer: C
  explanation: La Ley de Restricción para Niños de Rhode Island exige que los niños
    menores de 8 años que pesen menos de 80 libras y midan menos de 57 pulgadas de
    alto sean transportados en el asiento trasero y debidamente sujetos.
- id: 176
  category: vehicle_information
  question: Las luces de las señales de giro en un vehículo en Rhode Island deben
    ser visibles desde una distancia de al menos ¿cuántos pies bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Las regulaciones de Rhode Island exigen que las señales de giro sean
    visibles durante al menos 100 pies bajo la luz solar normal.
- id: 177
  category: vehicle_information
  question: Todo vehículo motorizado en Rhode Island debe tener al menos dos luces
    traseras rojas montadas en la parte posterior que sean visibles desde una distancia
    de ¿cuántos pies?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las luces traseras deben ser rojas y visibles desde una distancia de
    500 pies hacia la parte trasera del vehículo bajo condiciones atmosféricas normales.
- id: 178
  category: vehicle_information
  question: Según la ley de Rhode Island, ¿cuál es el tinte de ventana máximo permitido
    (transmitancia de luz mínima) para las ventanas laterales de un automóvil de pasajeros?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: D
  explanation: La Ley General de Rhode Island § 31-23.3-2 prohíbe el uso de dispositivos
    de protección solar en ventanas que tengan una transmitancia de luz total inferior
    al 70%.
- id: 179
  category: vehicle_information
  question: La ley de Rhode Island exige que todo vehículo motorizado esté equipado
    con una bocina que se pueda escuchar desde una distancia de al menos ¿cuántos
    pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: Según la Ley General de RI § 31-23-8, todo vehículo motorizado debe
    estar equipado con una bocina en buen estado de funcionamiento capaz de emitir
    un sonido audible en condiciones normales desde una distancia no menor a 200 pies.
- id: 180
  category: vehicle_information
  question: La ley de Rhode Island exige que los vehículos tengan un espejo retrovisor
    que proporcione una vista de la carretera de al menos ¿cuántos pies hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La Ley General de RI § 31-23-15 establece que todo vehículo motorizado
    debe estar equipado con un espejo ubicado de tal manera que refleje al conductor
    una vista de la carretera por una distancia de al menos 200 pies hacia atrás.
- id: 181
  category: vehicle_information
  question: ¿La placa trasera de un vehículo en Rhode Island debe estar iluminada
    por una luz blanca de modo que sea claramente legible desde una distancia de al
    menos cuántos pies?
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La Ley General de Rhode Island § 31-24-9 exige que una luz blanca ilumine
    la placa de registro trasera y la haga claramente legible desde una distancia
    de 50 pies hacia atrás.
- id: 182
  category: vehicle_information
  question: Según el Manual del Conductor de Rhode Island, las luces delanteras deben
    encenderse si no puede ver a una persona o vehículo a una distancia de ¿cuántos
    pies?
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: La ley de Rhode Island exige que las luces delanteras estén encendidas
    desde el atardecer hasta el amanecer y siempre que la visibilidad sea inferior
    a 500 pies.
- id: 183
  category: vehicle_information
  question: En Rhode Island, ¿es ilegal conducir un vehículo que tenga un silenciador
    con cuál de las siguientes modificaciones?
  choices:
    A: Una punta de cromo
    B: Un recorte (cutout), derivación (bypass) o dispositivo similar
    C: Un protector térmico
    D: Un sistema de escape doble instalado por el fabricante
  answer: B
  explanation: La Ley General de Rhode Island § 31-23-13 prohíbe el uso de un recorte
    de silenciador, derivación o dispositivo similar en cualquier vehículo motorizado
    que circule por una carretera.
- id: 184
  category: vehicle_information
  question: La ley de Rhode Island exige que las luces de las señales de giro sean
    visibles por delante y por detrás desde una distancia de al menos ¿cuántos pies?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Según la Ley General de RI § 31-24-16, las luces de señalización utilizadas
    para indicar un giro deben ser visibles desde una distancia de 100 pies tanto
    por delante como por detrás.
- id: 185
  category: vehicle_information
  question: ¿Cuál es el requisito de Rhode Island para el freno de estacionamiento
    (freno de mano) en un vehículo motorizado?
  choices:
    A: Solo es obligatorio para vehículos de transmisión manual
    B: Debe ser capaz de sujetar el vehículo en cualquier pendiente en la que se opere
    C: Debe usarse solo al estacionar en una colina
    D: Debe revisarse cada dos años
  answer: B
  explanation: La Ley General de Rhode Island § 31-23-4 exige que los frenos de servicio
    y el freno de estacionamiento sean adecuados para detener y sujetar el vehículo
    en cualquier pendiente en la que se opere.
- id: 186
  category: signs_and_signals
  question: En Rhode Island, al usar señales manuales para indicar un giro, ¿qué significa
    cuando el brazo izquierdo del conductor está doblado hacia arriba por el codo?
  choices:
    A: El conductor se está deteniendo
    B: El conductor está girando a la izquierda
    C: El conductor está girando a la derecha
    D: El conductor está disminuyendo la velocidad
  answer: C
  explanation: Según el Manual del Conductor de Rhode Island, el brazo izquierdo doblado
    hacia arriba por el codo indica un giro a la derecha.
- id: 187
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla intermitente en una intersección
    en Rhode Island?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Reducir la velocidad y proceder con precaución
    C: Aumentar la velocidad para despejar la intersección rápidamente
    D: Tratarla como una parada de cuatro vías (four-way stop)
  answer: B
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y cruzar la intersección con precaución.
- id: 188
  category: signs_and_signals
  question: 'Una señal en forma de banderín (un triángulo isósceles que apunta a la
    derecha) situada en el lado izquierdo de la carretera en Rhode Island indica:'
  choices:
    A: Una zona escolar
    B: Un requisito de ceder el paso
    C: Una zona de no rebasar (no-passing zone)
    D: Una zona de construcción
  answer: C
  explanation: Una señal en forma de banderín se utiliza específicamente para marcar
    el inicio de una zona de no rebasar y se coloca en el lado izquierdo de la carretera.
- id: 189
  category: signs_and_signals
  question: Al estacionar en una vía pública en Rhode Island, ¿su vehículo debe estar
    a menos de cuántas pulgadas de la acera (bordillo)?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: La ley de Rhode Island exige que, al estacionar en una calle de doble
    sentido, las ruedas del lado derecho deben estar paralelas y a menos de 12 pulgadas
    de la acera derecha.
- id: 190
  category: signs_and_signals
  question: ¿Cuál es el significado de una línea blanca continua pintada en el pavimento
    entre carriles de tráfico que se mueven en la misma dirección?
  choices:
    A: Los cambios de carril están prohibidos
    B: Se desaconsejan los cambios de carril
    C: La carretera es de un solo sentido
    D: Debe girar en la dirección de la línea
  answer: B
  explanation: Una línea blanca continua indica que se desaconsejan los cambios de
    carril por razones de seguridad, aunque no están estrictamente prohibidos como
    en el caso de una línea blanca continua doble.
- id: 191
  category: signs_and_signals
  question: 'En Rhode Island, una luz amarilla circular fija significa:'
  choices:
    A: Debe acelerar para ganarle a la luz roja
    B: La luz está a punto de cambiar a verde
    C: Debe detenerse si puede hacerlo de manera segura; la luz está a punto de cambiar
      a roja
    D: La intersección está despejada para todos los giros
  answer: C
  explanation: Una luz amarilla fija advierte que la señal está cambiando a rojo.
    Debe detenerse si es seguro hacerlo; de lo contrario, despeje la intersección.
- id: 192
  category: signs_and_signals
  question: ¿Qué indica generalmente en Rhode Island una señal en forma de diamante
    con fondo amarillo?
  choices:
    A: Información reglamentaria (ej., límite de velocidad)
    B: Advertencia o peligro más adelante
    C: Información de guía (ej., números de salida)
    D: Área de recreación pública
  answer: B
  explanation: Las señales amarillas en forma de diamante son señales de advertencia
    estándar que se utilizan para alertar a los conductores sobre peligros o cambios
    en las condiciones de la carretera más adelante.
- id: 193
  category: signs_and_signals
  question: En Rhode Island, ¿qué significa una luz roja intermitente?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: La luz está a punto de cambiar a verde
    C: Deténgase, luego proceda cuando sea seguro hacerlo
    D: Deténgase y espere a la luz verde
  answer: C
  explanation: Según el Manual del Conductor de Rhode Island, una luz roja intermitente
    significa lo mismo que una señal de alto. Debe detenerse por completo y luego
    avanzar cuando sea seguro hacerlo.
- id: 194
  category: signs_and_signals
  question: Cuando un conductor extiende el brazo izquierdo recto hacia afuera de
    la ventana, ¿qué señal manual está haciendo?
  choices:
    A: Giro a la derecha
    B: Giro a la izquierda
    C: Detenerse o reducir la velocidad
    D: Giro en U
  answer: B
  explanation: En Rhode Island, la señal manual estándar para un giro a la izquierda
    es el brazo izquierdo extendido recto hacia afuera de la ventana.
- id: 195
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal en forma de banderín que se encuentra
    en el lado izquierdo de la carretera?
  choices:
    A: Zona escolar más adelante
    B: Ceder el paso
    C: Zona de no adelantar
    D: Cruce de ferrocarril
  answer: C
  explanation: Una señal en forma de banderín (un triángulo isósceles que apunta a
    la derecha) se coloca en el lado izquierdo de la carretera para indicar el inicio
    de una zona de no adelantar (No Passing Zone).
- id: 196
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de pentágono (cinco lados)?
  choices:
    A: Una zona de construcción
    B: Un hospital cercano
    C: Una zona escolar o cruce escolar
    D: Un callejón sin salida
  answer: C
  explanation: La forma de pentágono de cinco lados se reserva exclusivamente para
    zonas escolares y cruces escolares en Rhode Island.
- id: 197
  category: signs_and_signals
  question: 'Si se aproxima a una intersección con una luz amarilla intermitente,
    debe:'
  choices:
    A: Detenerse por completo y esperar a que cambie
    B: Reducir la velocidad y proceder con precaución
    C: Acelerar para evitar una colisión
    D: Tratarla como una parada de cuatro vías
  answer: B
  explanation: Una luz amarilla intermitente advierte a los conductores que reduzcan
    la velocidad y estén especialmente alertas al cruzar la intersección.
- id: 198
  category: signs_and_signals
  question: ¿Qué significan las líneas amarillas continuas dobles en el centro de
    la calzada?
  choices:
    A: Se permite adelantar desde cualquier lado
    B: Se permite adelantar solo por la derecha
    C: Se prohíbe adelantar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles indican que no se permite adelantar
    al tráfico en ninguna de las dos direcciones.
- id: 199
  category: signs_and_signals
  question: ¿Qué tipo de información transmite una señal en forma de diamante?
  choices:
    A: Información reglamentaria (como límites de velocidad)
    B: Advertencia/Precaución sobre peligros más adelante
    C: Guía hacia destinos
    D: Información de recreación pública
  answer: B
  explanation: Las señales en forma de diamante son señales de advertencia que alertan
    a los conductores sobre posibles peligros o cambios en las condiciones de la carretera
    más adelante.
- id: 200
  category: signs_and_signals
  question: 'Para señalar un giro a la derecha usando señales manuales, un conductor
    de Rhode Island debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo
    D: Extender el brazo derecho recto hacia afuera
  answer: B
  explanation: La señal manual correcta para un giro a la derecha es el brazo izquierdo
    doblado en el codo con la mano apuntando hacia arriba.
- id: 201
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla redonda con una 'X' negra y las letras
    'RR'?
  choices:
    A: Calzada restringida más adelante
    B: Cruce de ferrocarril más adelante
    C: Reparaciones en la carretera más adelante
    D: Carretera en mal estado más adelante
  answer: B
  explanation: Una señal amarilla redonda con una 'X' negra y 'RR' es una señal de
    advertencia circular que indica que hay un cruce de ferrocarril más adelante.
- id: 202
  category: signs_and_signals
  question: 'Cuando vea una señal de "Ceda el paso" (Yield) en una intersección, usted
    debe:'
  choices:
    A: Detenerse y esperar una luz verde
    B: Reducir la velocidad y estar preparado para detenerse para dejar pasar a cualquier
      vehículo o peatón
    C: Mantener su velocidad y esperar que los demás se detengan por usted
    D: Detenerse por completo siempre, independientemente del tráfico
  answer: B
  explanation: Una señal de ceda el paso significa que debe reducir la velocidad y
    ceder el derecho de paso al tráfico en la intersección o en la carretera que cruza.
- id: 203
  category: signs_and_signals
  question: ¿Qué significa una flecha verde fija apuntando hacia la izquierda?
  choices:
    A: Puede girar a la izquierda después de ceder el paso al tráfico que viene en
      sentido contrario
    B: Debe detenerse y esperar una luz verde circular
    C: Puede girar a la izquierda; el tráfico que viene en sentido contrario está
      detenido por una luz roja
    D: Los giros a la izquierda están prohibidos en esta intersección
  answer: C
  explanation: Una flecha verde significa que tiene un giro "protegido". El tráfico
    que viene en sentido contrario está detenido, lo que le permite girar en la dirección
    de la flecha.
- id: 204
  category: signs_and_signals
  question: ¿Qué señal manual debe usar un conductor para indicar que está reduciendo
    la velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia arriba
    B: Brazo izquierdo extendido hacia afuera
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido hacia afuera
  answer: C
  explanation: Para señalar una parada o una disminución de velocidad mediante señales
    manuales, el conductor debe extender el brazo izquierdo hacia abajo con la palma
    de la mano hacia atrás.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 205
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de forma segura.
  id: 206
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 207
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de forma
    segura.
  id: 208
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UNA VÍA (ONE WAY) con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    apunta la flecha.'
  id: 209
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 210
- image: no_left_turn.png
  category: signs_and_signals
  id: 211
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
- image: no_right_turn.png
  category: signs_and_signals
  id: 212
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
- image: no_passing.png
  category: signs_and_signals
  id: 213
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico en ambos sentidos más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal blanca y negra en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
- image: keep_right.png
  category: signs_and_signals
  id: 214
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
- image: speed_limit_25.png
  category: signs_and_signals
  id: 215
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
- image: deer_crossing.png
  category: signs_and_signals
  id: 216
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
- image: pedestrian_crossing.png
  category: signs_and_signals
  id: 217
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la carretera.
- image: school_zone.png
  category: signs_and_signals
  id: 218
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
- image: railroad_crossing.png
  category: signs_and_signals
  id: 219
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
- image: railroad_crossbuck.png
  category: signs_and_signals
  id: 220
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces ferroviarios. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 221
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 222
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que el camino curve
    primero en un sentido y luego en el otro.
  id: 223
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte sobre una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 224
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 225
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 226
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 227
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 228
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 229
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Camino sinuoso más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 230
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 231
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo
    donde el semáforo puede no ser visible desde la distancia.
  id: 232
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (bache)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 233
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las calles laterales.
  id: 234
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 235
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir que los conductores se incorporen o fusionen. El tráfico
    que entra desde la rampa tiene su propio carril nuevo.
  id: 236
