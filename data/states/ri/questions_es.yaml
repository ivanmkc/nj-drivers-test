questions:
- id: 1
  category: driver_responsibility
  question: ¿Cuál es el costo para el donante o su familia para que se lleve a cabo
    una donación de órganos, según el Manual del Conductor de Rhode Island?
  choices:
    A: Una tarifa fija de $25.00
    B: Depende del procedimiento médico requerido
    C: No hay costo para el donante ni para su familia
    D: El costo está cubierto por un recargo obligatorio del DMV
  answer: C
  explanation: 'El manual establece como un hecho: ''No hay costo para el donante
    ni para su familia para que se lleve a cabo la donación''.'
- id: 2
  category: driver_responsibility
  question: ¿Cómo afecta el registrarse como donante de órganos a la atención médica
    que usted recibe?
  choices:
    A: Garantiza tiempos de respuesta de emergencia más rápidos.
    B: No afectará su atención médica.
    C: Reduce el costo de sus facturas médicas.
    D: Requiere que usted utilice hospitales específicos aprobados por el estado.
  answer: B
  explanation: 'El manual establece explícitamente: ''Hecho: Decir "Sí" a la donación
    no afectará su atención médica''.'
- id: 3
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones sobre la donación de órganos en los
    Estados Unidos es verdadera?
  choices:
    A: Es ilegal comprar o vender órganos para trasplantes.
    B: Solo ciertas religiones importantes apoyan la donación de órganos.
    C: Los donantes deben pagar una tarifa de registro al solicitar una licencia.
    D: La donación de órganos afecta negativamente la calidad de la atención médica
      recibida.
  answer: A
  explanation: 'El manual señala: ''Hecho: En los Estados Unidos, es ilegal comprar
    o vender órganos para trasplantes''.'
- id: 4
  category: license_system
  question: La División de Vehículos Motorizados (DMV) de Rhode Island es una agencia
    gubernamental dentro de ¿qué departamento estatal?
  choices:
    A: Departamento de Transporte
    B: Departamento de Educación
    C: Departamento de Ingresos
    D: Departamento de Seguridad Pública
  answer: C
  explanation: 'El manual establece: ''La División de Vehículos Motorizados (DMV)
    es una agencia gubernamental dentro del Departamento de Ingresos (Department of
    Revenue) del Estado de Rhode Island''.'
- id: 5
  category: driver_testing
  question: ¿Qué institución es responsable de operar los programas estatales de Educación
    Vial y seguridad de Motocicletas de Rhode Island?
  choices:
    A: La Policía Estatal de Rhode Island
    B: El Departamento de Transporte
    C: El Colegio Comunitario de Rhode Island (CCRI)
    D: La División de Vehículos Motorizados (DMV)
  answer: C
  explanation: El manual establece que bajo los auspicios de la Oficina de Educación
    Superior de Rhode Island, el Colegio Comunitario de Rhode Island (CCRI) opera
    los programas estatales de Educación Vial y seguridad de Motocicletas.
- id: 6
  category: driver_testing
  question: ¿Cuál es la tarifa cobrada por la División de Vehículos Motorizados por
    un examen de conducir (road test) de operador?
  choices:
    A: Una tarifa no reembolsable de $25.00 más un recargo tecnológico de $2.50
    B: Una tarifa reembolsable de $25.00
    C: Una tarifa fija de $50.00
    D: No hay tarifa por el examen de conducir de operador
  answer: A
  explanation: A partir del 12 de octubre de 2010, se cobrará una tarifa no reembolsable
    de $25.00 (más un recargo tecnológico de $2.50) en todos los exámenes de conducir
    de operador realizados por la División de Vehículos Motorizados.
- id: 7
  category: driver_testing
  question: ¿Cuándo puede un conductor programar su examen de conducir de operador?
  choices:
    A: Solo después de completar 50 horas de práctica de manejo
    B: Al momento del examen de conocimientos computarizado o en cualquier momento
      en cualquier instalación del DMV
    C: Solo llamando al Departamento de Transporte
    D: Exactamente seis meses después de recibir un permiso de instrucción
  answer: B
  explanation: Según el manual, 'Se puede programar un examen de conducir al momento
    del examen de conocimientos computarizado o en cualquier momento en cualquier
    instalación del DMV'.
- id: 8
  category: license_system
  question: A partir del 1 de julio de 2013, las licencias y los registros de vehículos
    motorizados de Rhode Island están sujetos a recargos como parte de ¿qué ley?
  choices:
    A: La Ley de Carreteras y Puentes Seguros
    B: La Ley de Educación y Seguridad Vial
    C: La Ley de Inversión en Transporte y Reducción de Deuda de 2011
    D: La Ley de Titulación y Registro de Vehículos Motorizados
  answer: C
  explanation: 'El manual señala: ''A partir del 1 de julio de 2013, las licencias
    y los registros de vehículos motorizados de Rhode Island están sujetos a recargos
    como parte de la Ley de Inversión en Transporte y Reducción de Deuda de 2011 (Transportation
    Investment and Debt Reduction Act of 2011)''.'
- id: 9
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al Manual
    del Conductor de Rhode Island?
  choices:
    A: Es un documento legalmente vinculante en los tribunales.
    B: Es producido únicamente por la Policía Estatal de Rhode Island.
    C: No es un documento legal.
    D: Contiene únicamente leyes federales de conducción.
  answer: C
  explanation: 'El manual establece explícitamente: ''Si bien el manual contiene una
    gran cantidad de información útil sobre las leyes estatales y los procedimientos
    de conducción, este no es un documento legal''.'
- id: 10
  category: safe_driving_rules
  question: Según el mensaje del Director del DOT, ¿cuál es la principal causa de
    muerte para todos los jóvenes de 15 a 20 años?
  choices:
    A: Sobredosis de drogas y alcohol
    B: Choques de vehículos motorizados
    C: Accidentes de peatones
    D: Caminar distraído
  answer: B
  explanation: 'El Director del DOT afirma: ''Los choques de vehículos motorizados
    son la principal causa de muerte para todos los jóvenes de 15 a 20 años''.'
- id: 11
  category: driver_responsibility
  question: 'Según el Manual del Conductor de Rhode Island, conducir en Rhode Island
    se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio, no un derecho
    C: Un derecho para cualquier persona mayor de 18 años
    D: Un requisito opcional para los residentes
  answer: B
  explanation: 'El mensaje del Director del DOT enfatiza: ''Y un GRAN conductor sabe
    que conducir en Rhode Island es un privilegio, no un derecho...'''
- id: 12
  category: safe_driving_rules
  question: Según el Director del DOT, ¿cuál de las siguientes es una característica
    de un 'buen conductor'?
  choices:
    A: Solo permiten pasajeros con el cinturón de seguridad puesto en su vehículo.
    B: Ocasionalmente revisan mensajes telefónicos en los semáforos en rojo.
    C: Conducen hasta 5 mph por encima del límite de velocidad establecido.
    D: Creen que conducir es un derecho garantizado.
  answer: A
  explanation: 'El Director del DOT enumera varios rasgos de un buen conductor, incluyendo:
    ''Un buen conductor siempre usa su cinturón de seguridad y solo permite pasajeros
    con el cinturón puesto en su vehículo''.'
- id: 13
  category: penalties_and_points
  question: ¿Qué dos programas principales de reentrenamiento de conductores son administrados
    por el Community College of Rhode Island (CCRI)?
  choices:
    A: Los cursos de Exceso de Velocidad y Conducción Temeraria
    B: El curso de DWI (conducir bajo los efectos del alcohol) y el curso de conducción
      defensiva
    C: Los cursos de seguridad para CDL y motocicletas
    D: Los cursos de Conducción para Adolescentes y Conducción para Personas Mayores
  answer: B
  explanation: El manual establece que el CCRI 'administra los dos programas principales
    de reentrenamiento de conductores del estado, el curso de DWI y el curso de conducción
    defensiva'.
- id: 14
  category: license_system
  question: Según el índice del manual, ¿cuál es la credencial de 'Nivel Uno' en el
    proceso de obtención de la licencia de Rhode Island?
  choices:
    A: Licencia de Operador Completa
    B: Licencia Provisional Limitada
    C: Licencia de Conducir Comercial (CDL)
    D: Permiso de Instrucción Limitado
  answer: D
  explanation: 'El índice enumera el ''Nivel Uno: Permiso de Instrucción Limitado''
    como el primer paso para solicitar una licencia de conducir de Rhode Island.'
- id: 15
  category: license_system
  question: ¿Qué es el Nivel Uno del Sistema de Licencias Graduadas (GDL) de Rhode
    Island?
  choices:
    A: Licencia Provisional Limitada
    B: Licencia de Operador Completa
    C: Permiso de Instrucción Limitado
    D: Permiso de Aprendizaje
  answer: C
  explanation: De acuerdo con el Sistema de Licencias Graduadas (GDL) de Rhode Island
    descrito en el manual, el Nivel Uno es el Permiso de Instrucción Limitado.
- id: 16
  category: safe_driving_rules
  question: Según el Manual del Conductor de Rhode Island, ¿qué regla se utiliza para
    determinar una distancia de seguimiento segura?
  choices:
    A: La regla de los dos (2) segundos
    B: La regla de los tres (3) segundos
    C: La regla de los cuatro (4) segundos
    D: La regla de la longitud de un vehículo
  answer: B
  explanation: El manual especifica 'La regla de los tres (3) segundos' para mantener
    una distancia de seguimiento segura bajo la sección de Sistemas para una Conducción
    Segura, Cortés y Defensiva.
- id: 17
  category: defensive_driving
  question: ¿Cuál de las siguientes situaciones se categoriza explícitamente como
    una emergencia de conducción en el Manual del Conductor de Rhode Island?
  choices:
    A: Arrancar en una colina
    B: Procedimientos adecuados para retroceder
    C: Acelerador atascado
    D: Entrar en una calzada
  answer: C
  explanation: 'Un ''Acelerador atascado'' aparece explícitamente en la Sección V:
    Emergencias de Conducción en el manual.'
- id: 18
  category: alcohol_drugs_health
  question: ¿Qué tipo específico de rechazo a una prueba se aborda en la sección de
    Alcohol y Conducción del manual?
  choices:
    A: Negarse a realizar la prueba de sobriedad en el campo
    B: Negarse a realizar la prueba del alcoholímetro (Breathalyzer)
    C: Negarse a realizar el análisis de sangre
    D: Negarse a realizar el análisis de orina
  answer: B
  explanation: La sección de Alcohol y Conducción del manual cubre específicamente
    la 'Negativa a realizar la prueba del alcoholímetro'.
- id: 19
  category: vehicle_information
  question: ¿Cuál de los siguientes tipos de envenenamiento se enumera específicamente
    como una emergencia de conducción?
  choices:
    A: Intoxicación alimentaria
    B: Envenenamiento por monóxido de carbono
    C: Envenenamiento por plomo
    D: Envenenamiento por anticongelante
  answer: B
  explanation: 'El envenenamiento por monóxido de carbono se enumera específicamente
    como un tema bajo la Sección V: Emergencias de Conducción.'
- id: 20
  category: sharing_the_road
  question: Al compartir la carretera de manera segura, ¿el manual incluye una subsección
    específica para qué tipo de peatón?
  choices:
    A: Corredores (joggers)
    B: Niños
    C: Peatones ciegos
    D: Peatones de la tercera edad
  answer: C
  explanation: 'En la Sección VIII: Compartir la Carretera de Manera Segura, hay una
    subsección específica dedicada a los ''Peatones ciegos''.'
- id: 21
  category: defensive_driving
  question: ¿Cuál de las siguientes amenazas de colisión NO aparece explícitamente
    en la sección de Emergencias de Conducción?
  choices:
    A: Amenaza de colisión frontal
    B: Amenaza de colisión de impacto lateral
    C: Amenaza de colisión por alcance (trasera)
    D: Amenaza de colisión por vuelco
  answer: D
  explanation: El manual enumera explícitamente las amenazas de colisiones frontales,
    de impacto lateral y por alcance en la sección de Emergencias de Conducción, pero
    no incluye las colisiones por vuelco.
- id: 22
  category: alcohol_drugs_health
  question: ¿Qué concepto legal relacionado con el alcohol y las pruebas químicas
    se trata en la sección de Conducir y Beber?
  choices:
    A: Tolerancia Cero
    B: Consentimiento Implícito (Implied Consent)
    C: Sobriedad Absoluta
    D: Ley de Responsabilidad de Establecimientos (Dram Shop Law)
  answer: B
  explanation: 'El concepto de ''Consentimiento Implícito'' (Implied Consent) está
    cubierto explícitamente en la Sección X: Conducir y Beber.'
- id: 23
  category: sharing_the_road
  question: Según la sección del manual sobre cómo compartir la carretera de forma
    segura, ¿con cuál de los siguientes vehículos grandes deben saber compartir la
    carretera los conductores?
  choices:
    A: Camiones grandes
    B: Tranvías
    C: Trenes ligeros
    D: Tractores
  answer: A
  explanation: La Sección VIII del manual incluye específicamente una subsección sobre
    'Compartir la carretera con camiones grandes'.
- id: 24
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un tema cubierto en 'Habilidades Básicas de
    Conducción y Reglas de Seguridad'?
  choices:
    A: La regla de los tres (3) segundos
    B: Ley de cinturones de seguridad y sistemas de retención infantil de Rhode Island
    C: Concentración de alcohol en sangre (BAC)
    D: Consentimiento implícito
  answer: B
  explanation: 'La ''Ley de cinturones de seguridad y sistemas de retención infantil
    de Rhode Island'' se trata en la Sección III: Habilidades Básicas de Conducción
    y Reglas de Seguridad.'
- id: 25
  category: vehicle_information
  question: ¿Qué tipo específico de falla del vehículo se agrupa con un 'Reventón'
    (Blowout) en la sección de Emergencias de Conducción?
  choices:
    A: Neumático desinflado (ponchadura)
    B: Eje roto
    C: Falla en la dirección
    D: Falla en la suspensión
  answer: A
  explanation: El manual enumera 'Reventón o neumático desinflado' juntos como un
    tema específico en la sección de Emergencias de Conducción.
- id: 26
  category: license_system
  question: ¿Cuáles son los tres niveles del sistema de licencias graduadas (GDL)
    de Rhode Island para personas menores de 18 años?
  choices:
    A: Permiso de aprendizaje, licencia junior y licencia senior
    B: Permiso de instrucción limitado, licencia provisional limitada y licencia de
      operador completa
    C: Permiso de estudiante, licencia provisional y licencia sin restricciones
    D: Permiso de instrucción, licencia restringida y licencia de operador completa
  answer: B
  explanation: 'Según el manual, los tres niveles del sistema de licencias graduadas
    son: permiso de instrucción limitado, licencia provisional limitada y licencia
    de operador completa.'
- id: 27
  category: driver_testing
  question: ¿Cuántas horas de clase de educación vial acreditada se requieren para
    personas de entre 16 y 18 años?
  choices:
    A: 20 horas
    B: 30 horas
    C: 33 horas
    D: 40 horas
  answer: C
  explanation: Si tiene entre 16 y 18 años, debe aprobar una clase de educación vial
    acreditada de treinta y tres (33) horas antes de poder obtener su Permiso de Instrucción
    Limitado.
- id: 28
  category: license_system
  question: Si usted es mayor de 18 años y solicita un Permiso de Instrucción Limitado,
    ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Debe completar un curso presencial de 33 horas.
    B: Está exento de realizar el examen computarizado.
    C: No está obligado a asistir al curso presencial, pero debe realizar el examen
      computarizado.
    D: Debe tomar un curso de conducción defensiva de 10 horas.
  answer: C
  explanation: El manual establece que si es mayor de dieciocho (18) años, no está
    obligado a asistir al curso presencial, pero debe realizar el examen computarizado.
- id: 29
  category: license_system
  question: ¿Cuál es la edad mínima que debe tener al comenzar una clase de educación
    vial para ser elegible para inscribirse?
  choices:
    A: 15 años
    B: 15 años y 6 meses
    C: 15 años y 10 meses
    D: 16 años
  answer: C
  explanation: Usted es elegible para inscribirse en una clase de educación vial cuando
    tiene entre 15 y 18 años, siempre que tenga al menos quince años y diez (10) meses
    al momento de comenzar la clase.
- id: 30
  category: driver_testing
  question: ¿Cuál es el tiempo máximo permitido para completar el examen computarizado
    del DMV?
  choices:
    A: 30 minutos
    B: 45 minutos
    C: 60 minutos
    D: 90 minutos
  answer: D
  explanation: El examen computarizado tiene un máximo de 90 minutos, aunque generalmente
    toma entre 20 y 30 minutos completarlo.
- id: 31
  category: license_system
  question: ¿Qué deben hacer los solicitantes con licencia de otros estados al solicitar
    una licencia de Rhode Island?
  choices:
    A: Realizar el examen computarizado y una prueba de manejo.
    B: Entregar sus licencias de otros estados para su cancelación.
    C: Completar un curso de educación vial de 33 horas.
    D: Conservar su licencia de otro estado y solicitar una licencia dual.
  answer: B
  explanation: Los solicitantes con licencia de otros estados están exentos de realizar
    el examen, pero deben entregar sus licencias de otros estados para su cancelación.
- id: 32
  category: license_system
  question: 'Los solicitantes que posean licencias activas de países extranjeros y
    deseen solicitar una licencia de Rhode Island deben:'
  choices:
    A: Entregar su licencia extranjera de inmediato.
    B: Realizar únicamente el examen computarizado.
    C: Realizar tanto el examen computarizado como una prueba de manejo.
    D: Completar una clase de educación vial de 33 horas.
  answer: C
  explanation: Los solicitantes que posean licencias activas de países extranjeros
    pueden conservar su licencia del país extranjero, pero deben realizar el examen
    así como una prueba de manejo.
- id: 33
  category: license_system
  question: Al solicitar un Permiso de Instrucción Limitado (Limited Instructional
    Permit), ¿cuál de las siguientes es una forma aceptable de identificación?
  choices:
    A: Una fotocopia de un certificado de nacimiento
    B: Una tarjeta de Seguro Social laminada
    C: Una fotocopia de un pasaporte
    D: Una tarjeta de Seguro Social original
  answer: D
  explanation: Los solicitantes deben mostrar una tarjeta de seguro social original
    (no una copia); no se aceptan tarjetas laminadas. Las fotocopias de los documentos
    de identidad no son aceptables.
- id: 34
  category: license_system
  question: ¿Cuál es el costo de un Permiso de Instrucción Limitado en el DMV?
  choices:
    A: $10.00
    B: $12.50
    C: $25.00
    D: $85.00
  answer: B
  explanation: El costo de un Permiso de Instrucción Limitado es de $12.50 en efectivo,
    cheque (no se aceptan cheques de terceros) o giro postal.
- id: 35
  category: safe_driving_rules
  question: ¿Cuáles son los requisitos para un conductor supervisor que acompaña a
    un conductor con un Permiso de Instrucción Limitado?
  choices:
    A: Debe tener al menos 18 años y licencia por 1 año.
    B: Debe tener al menos 21 años y licencia por al menos 5 años.
    C: Debe tener al menos 25 años y licencia por al menos 3 años.
    D: Debe tener al menos 21 años y licencia por al menos 10 años.
  answer: B
  explanation: Un conductor supervisor debe ser un conductor con licencia que haya
    tenido licencia para conducir durante al menos cinco (5) años y debe tener veintiún
    (21) años de edad o más.
- id: 36
  category: safe_driving_rules
  question: Si un padre que no posee una licencia válida de Rhode Island firma la
    solicitud para un hijo menor de 18 años, ¿dónde debe sentarse el padre durante
    la práctica de manejo?
  choices:
    A: En el asiento del pasajero delantero.
    B: En el asiento trasero.
    C: No se les permite estar en el vehículo.
    D: En el asiento del conductor mientras el hijo observa.
  answer: B
  explanation: Un padre que no posee una licencia válida de Rhode Island puede firmar
    la solicitud para un hijo menor de dieciocho (18) años, pero debe estar sentado
    en el asiento trasero durante la práctica de manejo.
- id: 37
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión con lentes correctivos para aprobar
    el examen de la vista del DMV?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Todos los solicitantes deben realizar un examen de la vista. Su visión
    debe ser de al menos 20/40 con lentes correctivos.
- id: 38
  category: safe_driving_rules
  question: ¿Dónde debe sentarse el conductor supervisor cuando una persona con un
    Permiso de Instrucción Limitado está conduciendo?
  choices:
    A: En cualquier lugar del vehículo.
    B: En el asiento trasero directamente detrás del conductor.
    C: Al lado del conductor en todo momento.
    D: Fuera del vehículo observando al conductor.
  answer: C
  explanation: Con un Permiso de Instrucción Limitado, el conductor supervisor con
    licencia debe estar sentado a su lado en todo momento y estar listo para tomar
    el control del vehículo en caso de emergencia.
- id: 39
  category: driver_responsibility
  question: ¿Quién es legalmente responsable de cualquier infracción de tránsito cometida
    por un conductor que opera con un Permiso de Instrucción Limitado?
  choices:
    A: El conductor con el permiso.
    B: El conductor supervisor.
    C: El dueño del vehículo.
    D: El instructor de educación vial.
  answer: B
  explanation: El manual establece que el conductor supervisor con licencia es legalmente
    responsable de cualquier infracción de tránsito que usted pueda cometer mientras
    conduce con un Permiso de Instrucción Limitado.
- id: 40
  category: safe_driving_rules
  question: ¿Cuál es el requisito del cinturón de seguridad para un conductor con
    un Permiso de Instrucción Limitado y sus pasajeros?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero deben usar cinturones
      de seguridad.
    B: Solo los pasajeros menores de 18 años deben usar cinturones de seguridad.
    C: El conductor y todos los pasajeros deben usar un cinturón de seguridad o estar
      en un sistema de sujeción para niños.
    D: Los cinturones de seguridad son opcionales si el vehículo tiene bolsas de aire.
  answer: C
  explanation: Debe usar un cinturón de seguridad según lo exige la ley, a menos que
    presente una carta de un médico. TODOS los pasajeros deben usar un cinturón de
    seguridad o estar en un sistema de sujeción para niños según lo exige la ley.
- id: 41
  category: safe_driving_rules
  question: ¿Bajo qué condición está un conductor exento de usar el cinturón de seguridad
    según la ley de Rhode Island?
  choices:
    A: Si conducen un vehículo fabricado antes de 1970.
    B: Si proporcionan al DMV una carta de un médico que indique una razón médica.
    C: Si conducen a velocidades inferiores a 25 mph.
    D: Si son mayores de 18 años.
  answer: B
  explanation: 'El manual establece: ''Debe usar un cinturón de seguridad según lo
    exige la ley, a menos que proporcione al DMV una carta de un médico que indique
    que no puede usar un cinturón de seguridad por razones médicas''.'
- id: 42
  category: license_system
  question: ¿Cuánto tiempo debe tener un Permiso de Instrucción Limitado antes de
    poder realizar el examen de conducir del DMV de Rhode Island?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 1 año
  answer: B
  explanation: Según el manual, debe tener un Permiso de Instrucción Limitado durante
    al menos seis (6) meses antes de poder realizar un examen de conducir del DMV
    de Rhode Island.
- id: 43
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Instrucción Limitado?
  choices:
    A: Seis meses o hasta que cumpla 18 años.
    B: Un año o hasta que cumpla 18 años, lo que ocurra primero.
    C: Dos años a partir de la fecha de emisión.
    D: Hasta que apruebe el examen de conducir, independientemente del tiempo.
  answer: B
  explanation: El manual especifica que el permiso es válido por un (1) año O hasta
    que cumpla los dieciocho (18) años, lo que ocurra primero.
- id: 44
  category: license_system
  question: Para obtener una Licencia Provisional Limitada, ¿cuántas horas de experiencia
    de manejo deben completarse y ser firmadas por un padre o tutor?
  choices:
    A: 30 horas, con 5 por la noche
    B: 40 horas, con 10 por la noche
    C: 50 horas, con 10 por la noche
    D: 60 horas, con 15 por la noche
  answer: C
  explanation: Debe presentar una declaración firmada por un padre o tutor que indique
    que ha completado un mínimo de cincuenta (50) horas de experiencia de manejo con
    un conductor supervisor, siendo diez (10) de esas horas por la noche.
- id: 45
  category: driver_testing
  question: ¿Cuál de las siguientes situaciones resultará en una reprobación inmediata
    del examen de conducir?
  choices:
    A: Pedirle al examinador que repita una instrucción.
    B: Salirse de la calzada designada o conducir sobre la acera.
    C: Realizar el examen bajo la lluvia.
    D: Usar los limpiaparabrisas.
  answer: B
  explanation: Los motivos de reprobación inmediata incluyen salirse de la calzada
    designada (conducir sobre la acera, salirse de la calzada con carriles o salirse
    del carril de circulación y conducir en una zona de seguridad).
- id: 46
  category: driver_testing
  question: Si el propietario registrado del vehículo utilizado para el examen de
    conducir no está presente, ¿qué se debe proporcionar al examinador del DMV?
  choices:
    A: Una llamada telefónica del propietario.
    B: Una carta notariada del propietario otorgando permiso para usar el vehículo.
    C: El certificado de nacimiento original del propietario.
    D: Una copia del historial de manejo del propietario.
  answer: B
  explanation: Si el propietario no está presente, se debe presentar al examinador
    del DMV una carta notariada del propietario otorgando permiso para usar el vehículo
    para este propósito.
- id: 47
  category: driver_testing
  question: Los vehículos utilizados para el examen de conducir deben tener una calcomanía
    de inspección válida. ¿Cuál es una excepción a esta regla?
  choices:
    A: Vehículos que tengan menos de 2 años de antigüedad o tengan 24,000 millas o
      menos.
    B: Vehículos registrados en otro estado.
    C: Vehículos fabricados antes de 2010.
    D: Vehículos de alquiler.
  answer: A
  explanation: 'El manual enumera una excepción al requisito de la calcomanía de inspección
    válida: vehículos que tengan menos de 2 años de antigüedad o 24,000 millas o menos,
    lo que ocurra primero.'
- id: 48
  category: driver_testing
  question: ¿Cuál de los siguientes NO está permitido en un vehículo utilizado para
    el examen de conducir?
  choices:
    A: Un freno de emergencia central.
    B: Un registro de Rhode Island válido.
    C: Mascotas.
    D: Vidrios polarizados legales.
  answer: C
  explanation: 'Los requisitos del vehículo para el examen de conducir establecen
    explícitamente: ''No se permiten mascotas en los vehículos utilizados para el
    examen de conducir''.'
- id: 49
  category: driver_testing
  question: Si reprueba su examen de conducir, ¿cuánto tiempo debe esperar antes de
    su próxima cita?
  choices:
    A: 7 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Si reprueba su examen de conducir, no se le permitirá volver a realizar
    el examen de inmediato. Debe esperar al menos 30 días antes de su próxima cita.
- id: 50
  category: license_system
  question: ¿Entre qué horas no puede conducir por sí sola una persona con una Licencia
    Provisional Limitada?
  choices:
    A: 10:00 PM y 5:00 AM
    B: 11:00 PM y 6:00 AM
    C: 12:00 AM y 5:00 AM
    D: 1:00 AM y 5:00 AM
  answer: D
  explanation: 'El manual establece en letras mayúsculas y negrita: ''UNA PERSONA
    CON UNA LICENCIA PROVISIONAL LIMITADA NO PUEDE CONDUCIR POR SÍ SOLA ENTRE LAS
    HORAS DE 1:00 AM Y 5:00 AM''.'
- id: 51
  category: license_system
  question: ¿Bajo qué circunstancia se le permite a un conductor con una Licencia
    Provisional Limitada conducir sin supervisión entre la 1:00 AM y las 5:00 AM?
  choices:
    A: Al conducir hacia o desde un baile escolar.
    B: Al conducir hacia o desde el trabajo.
    C: Al conducir a un familiar al aeropuerto.
    D: Al conducir a la casa de un amigo.
  answer: B
  explanation: Un conductor con una Licencia Provisional Limitada puede conducir sin
    supervisión entre las 5:00 AM y la 1:00 AM, o cuando conduce hacia o desde el
    trabajo, o para actividades voluntarias de bomberos, rescate o servicios médicos
    de emergencia (EMS).
- id: 52
  category: license_system
  question: Para calificar como conductor supervisor de un menor que solicita una
    Licencia Provisional Limitada, una persona debe tener al menos 21 años y haber
    tenido licencia para conducir durante al menos ¿cuántos años?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: Un conductor supervisor debe ser un conductor que haya tenido licencia
    para conducir durante al menos cinco (5) años y tenga veintiún (21) años de edad
    o más.
- id: 53
  category: driver_testing
  question: Al llegar para el examen de conducir, ¿en qué formato debe estar su permiso?
  choices:
    A: Una copia digital en un teléfono inteligente.
    B: Una fotocopia en blanco y negro.
    C: Una fotocopia a color.
    D: El permiso original.
  answer: D
  explanation: Los requisitos de documentos establecen que debe traer el 'Permiso
    original; no se aceptan fotocopias'.
- id: 54
  category: driver_testing
  question: Antes del examen de conducir, el examinador realizará una inspección de
    seguridad del vehículo. ¿Cuál de los siguientes elementos se revisa durante esta
    inspección?
  choices:
    A: La radio y el sistema de sonido.
    B: El aire acondicionado.
    C: Las luces de emergencia (hazard lights).
    D: El pestillo de la guantera.
  answer: C
  explanation: La inspección de seguridad incluye la revisión de las luces de freno,
    luces direccionales, faros delanteros, luces de emergencia, neumáticos y el polarizado
    legal.
- id: 55
  category: driver_testing
  question: ¿Quién NO está obligado a realizar el examen de conducir de Rhode Island?
  choices:
    A: Todos los solicitantes por primera vez mayores de 18 años.
    B: Personas con una licencia de conducir válida de otro estado.
    C: Solicitantes que hayan completado 100 horas de conducción supervisada.
    D: Solicitantes que hayan tenido un Permiso de Instrucción Limitado por más de
      un año.
  answer: B
  explanation: 'El manual establece: ''Las personas con una licencia de conducir válida
    de otro estado no están obligadas a realizar el examen de conducir''.'
- id: 56
  category: license_system
  question: Bajo una Licencia Provisional Limitada de Nivel 2, ¿durante qué horas
    se le permite conducir sin supervisión (excluyendo excepciones de trabajo o voluntariado)?
  choices:
    A: 6:00 AM a 10:00 PM
    B: 5:00 AM a 1:00 AM
    C: 6:00 AM a medianoche
    D: 7:00 AM a 11:00 PM
  answer: B
  explanation: Según el manual, una Licencia Provisional Limitada de Nivel 2 permite
    conducir sin supervisión entre las 5:00 AM y la 1:00 AM.
- id: 57
  category: license_system
  question: Durante los primeros doce meses de tener una Licencia Provisional Limitada,
    ¿cuál es la restricción sobre los pasajeros?
  choices:
    A: No se permiten pasajeros bajo ninguna circunstancia.
    B: Solo se permiten pasajeros mayores de 25 años.
    C: No se permite más de un pasajero menor de 21 años, excluyendo a la familia
      inmediata.
    D: Puede tener hasta tres pasajeros menores de 21 años.
  answer: C
  explanation: Durante los primeros doce meses de una licencia provisional limitada,
    no se permite más de un pasajero menor de 21 años en el vehículo, aunque los miembros
    de la familia inmediata y del hogar están exentos.
- id: 58
  category: license_system
  question: ¿Cuál de las siguientes es la edad mínima requerida para obtener una Licencia
    de Operador Completa de Nivel 3 en Rhode Island?
  choices:
    A: 16 años
    B: 17 años
    C: 17 años y 6 meses
    D: 18 años
  answer: C
  explanation: Para obtener su licencia de operador completa, debe tener al menos
    diecisiete (17) años y seis (6) meses de edad.
- id: 59
  category: license_system
  question: Para calificar para una Licencia de Operador Completa, ¿durante cuánto
    tiempo debe estar libre de infracciones de tránsito en movimiento o infracciones
    del cinturón de seguridad?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: B
  explanation: Para recibir una Licencia de Operador Completa de Nivel 3, no debe
    haber sido condenado por una infracción de tránsito en movimiento o una infracción
    del cinturón de seguridad durante los seis (6) meses anteriores.
- id: 60
  category: penalties_and_points
  question: ¿Cuándo comienza oficialmente el período de suspensión de una licencia
    de conducir?
  choices:
    A: El día en que ocurrió la infracción
    B: El día en que el tribunal emite la orden de suspensión
    C: Solo después de que la licencia haya sido entregada o enviada al DMV
    D: 30 días después de recibir un aviso por correo
  answer: C
  explanation: El manual establece que el período de suspensión no comienza hasta
    que su licencia haya sido entregada o enviada al Departamento de Vehículos Motorizados
    (DMV).
- id: 61
  category: license_system
  question: ¿Cuáles son los requisitos para un 'conductor supervisor' de un titular
    de un Permiso de Instrucción Limitado de Nivel 1?
  choices:
    A: Debe ser mayor de 18 años y tener una licencia válida.
    B: Debe ser mayor de 21 años y haber tenido una licencia durante al menos 5 años.
    C: Debe ser un padre o tutor legal con una licencia válida.
    D: Debe ser un instructor de manejo certificado.
  answer: B
  explanation: Un conductor supervisor se define como un conductor debidamente licenciado
    que ha tenido una licencia durante al menos cinco (5) años y tiene más de veintiún
    (21) años de edad.
- id: 62
  category: license_system
  question: Al conducir con un Permiso de Instrucción Limitado de Nivel 1, ¿quién
    tiene permitido sentarse en el asiento delantero junto al conductor?
  choices:
    A: Cualquier pasajero con licencia
    B: Solo el conductor supervisor
    C: Hasta dos pasajeros
    D: Solo familiares directos
  answer: B
  explanation: En el Nivel 1, ninguna persona que no sea el conductor supervisor puede
    estar ubicada en el asiento delantero del automóvil.
- id: 63
  category: driver_testing
  question: ¿Cuántas horas de conducción supervisada se deben completar antes de solicitar
    una Licencia Provisional Limitada de Nivel 2?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Para recibir una Licencia Provisional Limitada de Nivel 2, debe completar
    cincuenta (50) horas de conducción supervisada con un conductor supervisor calificado.
- id: 64
  category: license_system
  question: Si se muda a Rhode Island con una licencia de conducir válida de otro
    estado, ¿bajo qué condición está exento de realizar un examen computarizado o
    de carretera?
  choices:
    A: Si su licencia de otro estado es válida actualmente o ha expirado hace menos
      de un año.
    B: Si ha estado conduciendo durante más de cinco años.
    C: Si es mayor de 21 años.
    D: Siempre debe realizar un examen computarizado al transferir una licencia.
  answer: A
  explanation: Si su licencia de otro estado es válida actualmente o no ha expirado
    por más de un (1) año, no se le requerirá realizar un examen computarizado ni
    un examen de carretera.
- id: 65
  category: defensive_driving
  question: Según el manual, apartar la vista de la trayectoria de viaje durante dos
    segundos o más, ¿qué efecto tiene en la probabilidad de un choque?
  choices:
    A: Aumenta la probabilidad en un 10 por ciento.
    B: Duplica la probabilidad de un choque.
    C: Triplica la probabilidad de un choque.
    D: No tiene un efecto medible si se conduce a menos de 30 mph.
  answer: B
  explanation: El manual establece que apartar la vista de la trayectoria de viaje
    durante dos segundos o más duplica la probabilidad de un choque.
- id: 66
  category: defensive_driving
  question: ¿Cómo distingue el manual entre distracción e inatención?
  choices:
    A: La distracción es causada por los pasajeros, mientras que la inatención es
      causada por los teléfonos celulares.
    B: La distracción es una acción física, mientras que la inatención es una acción
      visual.
    C: La distracción es atraída por una situación, evento o persona, mientras que
      la inatención es cuando la atención se desvía sin influencia externa.
    D: La distracción solo les ocurre a los conductores jóvenes, mientras que la inatención
      les ocurre a los conductores mayores.
  answer: C
  explanation: La distracción resulta cuando una situación, evento o persona aleja
    el enfoque del conductor de la conducción. La inatención ocurre cuando la atención
    de un conductor se desvía sin haber sido influenciada por una situación, evento
    o persona.
- id: 67
  category: defensive_driving
  question: ¿Cuál de las siguientes es una forma en que las distracciones pueden afectar
    el desempeño al conducir?
  choices:
    A: Aumento del tiempo de reacción
    B: Percepción lenta de eventos de tráfico importantes
    C: Visión periférica mejorada
    D: Toma de decisiones más rápida
  answer: B
  explanation: Las distracciones pueden afectar el desempeño al conducir a través
    de una percepción lenta, lo que hace que los conductores se retrasen en percibir
    o no perciban por completo un evento de tráfico importante.
- id: 68
  category: license_system
  question: ¿Cuál es el requisito de edad para recibir un Permiso de Instrucción Limitado
    de Nivel 1?
  choices:
    A: 15 a 17 años de edad
    B: 15 años y medio a 18 años de edad
    C: 16 a 18 años de edad
    D: 17 a 21 años de edad
  answer: C
  explanation: Para recibir un Permiso de Instrucción Limitado de Nivel 1, debe tener
    entre dieciséis (16) y dieciocho (18) años de edad.
- id: 69
  category: license_system
  question: ¿Cuál es la tarifa para transferir una licencia de conducir de otro estado
    a una licencia de Rhode Island?
  choices:
    A: $27.50
    B: $39.50
    C: $44.50
    D: $62.50
  answer: C
  explanation: El manual establece que la tarifa para transferir su licencia de otro
    estado es de $44.50.
- id: 70
  category: defensive_driving
  question: ¿Qué sucede con el riesgo de un choque fatal de un conductor adolescente
    cuando agrega solo un pasajero adolescente al vehículo?
  choices:
    A: Se mantiene igual
    B: Aumenta en un 50 por ciento
    C: Se duplica
    D: Se triplica
  answer: C
  explanation: Según el manual, para los conductores adolescentes, la adición de solo
    un pasajero adolescente duplica la probabilidad de experimentar un choque fatal.
- id: 71
  category: defensive_driving
  question: ¿Cuánto aumenta el riesgo de un choque fatal para un conductor adolescente
    con dos o más pasajeros adolescentes?
  choices:
    A: 100 por ciento
    B: 200 por ciento
    C: 300 por ciento
    D: 400 por ciento
  answer: C
  explanation: Con dos o más pasajeros adolescentes, el riesgo de un choque fatal
    aumenta en un 300 por ciento.
- id: 72
  category: defensive_driving
  question: ¿Cuál de los siguientes es un ejemplo de una distracción física al conducir?
  choices:
    A: Pensar en algo que sucedió durante el día
    B: Entablar una conversación con un pasajero
    C: Alcanzar un objeto
    D: Escuchar la radio
  answer: C
  explanation: Una distracción física es aquella que hace que el conductor quite las
    manos del volante o la vista de la carretera, como alcanzar un objeto.
- id: 73
  category: defensive_driving
  question: ¿Cómo afecta el uso de un teléfono celular al conducir el riesgo general
    de una colisión?
  choices:
    A: Aumenta el riesgo en un 100 por ciento
    B: Aumenta el riesgo en un 200 por ciento
    C: Aumenta el riesgo en un 300 por ciento
    D: Aumenta el riesgo en un 400 por ciento
  answer: D
  explanation: El manual establece que el riesgo general de una colisión al usar un
    teléfono celular aumenta en un 400 por ciento.
- id: 74
  category: defensive_driving
  question: ¿Qué indican las investigaciones sobre la diferencia de riesgo entre usar
    un teléfono celular de mano y un dispositivo de manos libres al conducir?
  choices:
    A: Los dispositivos de manos libres son significativamente más seguros
    B: Los dispositivos de mano son ligeramente más seguros
    C: No hay diferencia de riesgo entre los dos modos
    D: Los dispositivos de manos libres reducen el riesgo de un choque a la mitad
  answer: C
  explanation: Las investigaciones indican que no hay diferencias en el riesgo entre
    los dos modos; ambos métodos de uso del teléfono celular son totalmente capaces
    de desviar la atención del conductor lo suficiente como para causar una colisión.
- id: 75
  category: defensive_driving
  question: ¿Por qué se considera que enviar mensajes de texto es incluso más riesgoso
    que hablar por teléfono celular al conducir?
  choices:
    A: Requiere que el conductor mire el teléfono y manipule el teclado
    B: Utiliza más energía de la batería del teléfono
    C: Hace que el conductor conduzca más rápido
    D: Se tarda más en enviar un texto que en hacer una llamada telefónica
  answer: A
  explanation: La evidencia sugiere que enviar mensajes de texto es más riesgoso porque
    a menudo requiere que el conductor mire el teléfono y manipule el teclado con
    las manos.
- id: 76
  category: defensive_driving
  question: ¿Qué sucede con el riesgo de una colisión cuando un conductor aparta la
    vista de la carretera durante dos segundos o más?
  choices:
    A: Aumenta en un 25 por ciento
    B: Aumenta en un 50 por ciento
    C: Se duplica
    D: Se triplica
  answer: C
  explanation: Cuando un conductor aparta la vista de la carretera durante dos segundos
    o más, el riesgo de una colisión se duplica.
- id: 77
  category: defensive_driving
  question: ¿Cuál es el término que a veces se utiliza para reducir la velocidad y
    desviar la atención hacia la escena de un choque cercano?
  choices:
    A: Seguir muy de cerca (Tailgating)
    B: Curiosear (Rubbernecking)
    C: Hidroplaneo (Hydroplaning)
    D: Turismo
  answer: B
  explanation: Puede ser tentador reducir la velocidad y desviar la atención hacia
    la escena de un choque cercano. A veces esto se conoce como 'curiosear' (rubbernecking).
- id: 78
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una técnica recomendada para prevenir y manejar
    las distracciones?
  choices:
    A: Revisar mapas y direcciones de conducción mientras está detenido en un semáforo
      en rojo
    B: Preajustar las estaciones de radio y el control de clima antes de ponerse al
      volante
    C: Mantener objetos sueltos en el asiento del pasajero para facilitar el acceso
    D: Realizar su aseo personal mientras conduce por carreteras rectas
  answer: B
  explanation: Las técnicas para prevenir y manejar las distracciones incluyen preajustar
    las estaciones de radio, los dispositivos MP3 y el control de clima antes de ponerse
    al volante.
- id: 79
  category: safe_driving_rules
  question: Si se encuentra en la necesidad de atender a niños mientras conduce, ¿cuál
    es la acción más segura?
  choices:
    A: Darse la vuelta para dirigirse a ellos mientras mantiene una mano en el volante
    B: Pedirles que esperen hasta que llegue a su destino
    C: Detenerse de manera segura fuera de la carretera y del tráfico para atenderlos
    D: Usar el espejo retrovisor para hacer contacto visual mientras habla con ellos
  answer: C
  explanation: El manual aconseja a los conductores detenerse de manera segura fuera
    de la carretera y del tráfico para atender a los niños.
- id: 80
  category: defensive_driving
  question: ¿Cómo puede la conducción distraída afectar el proceso de toma de decisiones
    de un conductor?
  choices:
    A: Mejora el tiempo de reacción en situaciones de emergencia
    B: Hace que el conductor tome decisiones demasiado rápido
    C: Puede retrasar el proceso de toma de decisiones o causar una acción inapropiada
    D: Ayuda al conductor a concentrarse mejor en la trayectoria inmediata
  answer: C
  explanation: La distracción puede causar que el proceso de toma de decisiones de
    un conductor se retrase, o causar que un conductor elija una acción inapropiada
    para la situación en cuestión.
- id: 81
  category: safe_driving_rules
  question: ¿Según el manual, cuál es la mejor manera de manejar conversaciones emocionales
    por teléfono celular mientras se conduce?
  choices:
    A: Mantener la conversación corta y colgar rápidamente
    B: Usar un auricular manos libres para hablar
    C: Salirse de la carretera a un lugar seguro
    D: Reducir la velocidad y moverse al carril derecho
  answer: C
  explanation: 'El manual establece: ''No participe en conversaciones emocionales
    mientras conduce. Sálgase de la carretera a un lugar seguro''.'
- id: 82
  category: safe_driving_rules
  question: ¿Qué debe hacer si debe usar un teléfono celular mientras conduce?
  choices:
    A: Entablar conversaciones casuales para mantenerse despierto
    B: Informar a la persona con la que está hablando que usted está conduciendo
    C: Sostener el teléfono con su mano no dominante
    D: Usarlo solo mientras conduce en la autopista
  answer: B
  explanation: Si debe usar un teléfono celular, uno de los consejos proporcionados
    es 'Informar a la persona con la que está hablando que usted está conduciendo'.
- id: 83
  category: defensive_driving
  question: ¿Cómo se compara hablar por teléfono celular con otras causas frecuentes
    de distracción en términos de causar un casi choque?
  choices:
    A: Es menos probable que cause un casi choque que ajustar la radio
    B: Es igual de probable que cause un casi choque que comer
    C: Es más de cuatro veces más probable que cause un casi choque que la siguiente
      causa más frecuente
    D: Rara vez causa casi choques si se utiliza un dispositivo de manos libres
  answer: C
  explanation: Un estudio indicó que hablar por teléfono celular era más de cuatro
    veces más probable que causara un casi choque que la siguiente causa más frecuente
    de distracción.
- id: 84
  category: safe_driving_rules
  question: ¿Qué debe hacer para evitar que su teléfono celular se convierta en un
    proyectil en un choque?
  choices:
    A: Mantenerlo en su regazo mientras conduce
    B: Asegurar su teléfono en el automóvil
    C: Sostenerlo firmemente en su mano
    D: Colocarlo suelto sobre el tablero
  answer: B
  explanation: El manual establece que debe 'Asegurar su teléfono en el automóvil
    para que no se convierta en un proyectil en un choque'.
- id: 85
  category: defensive_driving
  question: Si necesita tener una conversación emocional mientras conduce, ¿cuál es
    la acción recomendada?
  choices:
    A: Hablar fuerte por encima de la radio para mantenerse concentrado
    B: Pedirle a un pasajero que sostenga el teléfono por usted
    C: Salirse de la carretera a un lugar seguro antes de continuar
    D: Reducir la velocidad en 10 mph para disminuir el riesgo de choque
  answer: C
  explanation: 'El manual aconseja: ''No participe en conversaciones emocionales mientras
    conduce. Sálgase de la carretera a un lugar seguro antes de continuar este tipo
    de conversación''.'
- id: 86
  category: driver_responsibility
  question: ¿Qué es un 'microsueño' (microsleep)?
  choices:
    A: Una siesta de 10 minutos tomada en una parada de descanso
    B: Un breve estallido de sueño que dura solo unos segundos
    C: Una condición causada por la apnea del sueño no tratada
    D: Un ciclo de sueño que ocurre entre las 2 am y las 4 am
  answer: B
  explanation: Según el manual, los conductores pueden experimentar 'breves estallidos
    de sueño que duran solo unos segundos (microsueños)'.
- id: 87
  category: driver_responsibility
  question: ¿Según la Fundación AAA para la Seguridad del Tráfico, cuánto aumenta
    el riesgo de una colisión dormir menos de cinco horas?
  choices:
    A: Por dos veces
    B: Por tres veces
    C: De cuatro a cinco veces
    D: Por casi seis veces
  answer: C
  explanation: El manual establece que 'las personas que duermen menos de cinco horas
    aumentan su riesgo de colisión de cuatro a cinco veces'.
- id: 88
  category: alcohol_drugs_health
  question: ¿En qué momentos del día la mayoría de las personas experimentan los 'puntos
    bajos' naturales de su cuerpo (ritmo circadiano)?
  choices:
    A: Entre las 6 am y las 10 am
    B: Entre la medianoche y las 6 am, y nuevamente entre las 2 pm y las 4 pm
    C: Entre las 8 pm y la medianoche
    D: Entre las 10 am y el mediodía, y nuevamente entre las 6 pm y las 8 pm
  answer: B
  explanation: El manual explica que la mayoría de las personas experimentan 'puntos
    bajos' del ritmo circadiano entre aproximadamente la medianoche y las 6 am, y
    nuevamente entre aproximadamente las 2 y las 4 pm.
- id: 89
  category: alcohol_drugs_health
  question: 'Las investigaciones muestran que estar despierto durante 18 horas produce
    un deterioro aproximadamente igual a una concentración de alcohol en sangre (BAC)
    de:'
  choices:
    A: .02 por ciento
    B: .05 por ciento
    C: .08 por ciento
    D: .10 por ciento
  answer: B
  explanation: Según el manual, 'estar despierto durante 18 horas produce un deterioro
    aproximadamente igual a una concentración de alcohol en sangre (BAC) del .05 por
    ciento'.
- id: 90
  category: alcohol_drugs_health
  question: 'Si un conductor permanece despierto durante 24 horas, su deterioro aumenta
    a un nivel aproximadamente igual a una concentración de alcohol en sangre (BAC)
    de:'
  choices:
    A: .04 por ciento
    B: .05 por ciento
    C: .08 por ciento
    D: .10 por ciento
  answer: D
  explanation: El manual establece que 'Después de 24 horas despierto, el deterioro
    aumenta a un nivel aproximadamente igual a un BAC del .10 por ciento'.
- id: 91
  category: driver_responsibility
  question: ¿En qué fracción de todos los choques por quedarse dormido están involucrados
    los conductores menores de 30 años?
  choices:
    A: Más de un cuarto
    B: Más de un tercio
    C: Más de la mitad
    D: Más de dos tercios
  answer: D
  explanation: El manual señala que 'los conductores menores de 30 años están involucrados
    en más de dos tercios de todos los choques por quedarse dormido'.
- id: 92
  category: driver_responsibility
  question: ¿En cuánto aumenta aproximadamente el riesgo de colisión de un conductor
    el trabajar en el turno nocturno?
  choices:
    A: Dos veces
    B: Cuatro veces
    C: Seis veces
    D: Diez veces
  answer: C
  explanation: Según el manual, 'trabajar en el turno nocturno aumenta el riesgo de
    colisión casi seis veces'.
- id: 93
  category: defensive_driving
  question: ¿Cuál de los siguientes entornos de conducción es más probable que cause
    una disminución de la alerta mental del conductor debido a la monotonía?
  choices:
    A: Una intersección concurrida de la ciudad con múltiples semáforos
    B: Una carretera de montaña sinuosa con curvas cerradas
    C: Una carretera recta y vacía sin señales ni vallas publicitarias
    D: Una zona de construcción con cierres de carriles
  answer: C
  explanation: El manual explica que conducir en una carretera recta y vacía sin señales
    ni vallas publicitarias carece de estimulación, lo que, combinado con el ronroneo
    del motor y el zumbido de los neumáticos, hace que la alerta mental disminuya.
- id: 94
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una señal de advertencia de que puede estar
    en riesgo de quedarse dormido al volante?
  choices:
    A: Revisar sus espejos con frecuencia
    B: Dificultad para recordar las últimas millas recorridas
    C: Mantener una distancia de seguimiento constante
    D: Sentarse derecho y sujetar el volante con firmeza
  answer: B
  explanation: El manual enumera la 'dificultad para recordar las últimas millas recorridas;
    saltarse salidas o señales de tráfico' como una señal de advertencia de somnolencia.
- id: 95
  category: alcohol_drugs_health
  question: ¿Cuántas horas de sueño por noche recomiendan los expertos en sueño para
    los adolescentes con el fin de ayudar a prevenir la somnolencia?
  choices:
    A: De 6 a 7 horas
    B: De 7 a 8 horas
    C: De 7 a 9 horas
    D: De 8½ a 9½ horas
  answer: D
  explanation: Para ayudar a prevenir la somnolencia, los expertos en sueño recomiendan
    'de 8½ a 9½ horas para los adolescentes' según el manual.
- id: 96
  category: safe_driving_rules
  question: 'Al realizar un viaje largo, una buena regla general es tomar un descanso
    y dejar de conducir cada:'
  choices:
    A: 50 millas o cada hora
    B: 100 millas o cada dos horas
    C: 150 millas o cada tres horas
    D: 200 millas o cada cuatro horas
  answer: B
  explanation: 'El manual establece: ''Una buena regla general es detenerse cada 100
    millas o cada dos horas''.'
- id: 97
  category: defensive_driving
  question: ¿Cuál de las siguientes acciones se considera ineficaz para prevenir la
    somnolencia por más de unos pocos minutos?
  choices:
    A: Tomar un descanso de 10 minutos cada dos horas
    B: Cambiar de conductor con un pasajero
    C: Poner la radio a un volumen alto
    D: Detenerse para descansar una noche
  answer: C
  explanation: El manual enumera 'poner la radio a un volumen alto' bajo 'acciones
    ineficaces' que no ayudarán a prevenir la somnolencia por más de unos pocos minutos.
- id: 98
  category: safe_driving_rules
  question: Si debe detenerse a lo largo de la carretera para descansar después de
    que oscurezca, ¿cuál es la mejor práctica?
  choices:
    A: Buscar un área poblada e iluminada
    B: Estacionarse lo más cerca posible del carril de tráfico de la autopista
    C: Mantener todas las ventanas completamente cerradas
    D: Dejar el vehículo encendido con las puertas sin seguro
  answer: A
  explanation: El manual aconseja que si debe detenerse a lo largo de la carretera
    para descansar, 'después de que oscurezca, busque un área poblada e iluminada'.
- id: 99
  category: defensive_driving
  question: Según el manual, ¿cuál es una consecuencia potencial de dormir en su vehículo
    por más de 20 minutos?
  choices:
    A: Restaura completamente su tiempo de reacción y alerta.
    B: Puede hacerlo sentir aturdido durante al menos cinco minutos después de despertar.
    C: Es ilegal en todas las autopistas de Rhode Island.
    D: Requiere que deje el motor encendido por seguridad.
  answer: B
  explanation: El manual establece que se debe tener en cuenta que dormir por más
    de 20 minutos puede hacerlo sentir aturdido durante al menos cinco minutos después
    de despertar.
- id: 100
  category: safe_driving_rules
  question: Si debe detenerse a lo largo de la carretera para descansar, ¿cuál de
    las siguientes es una práctica recomendada?
  choices:
    A: Dejar el motor encendido para el control del clima.
    B: Encender las luces altas.
    C: Encender las luces de estacionamiento y apagar otros equipos eléctricos.
    D: Bajar las ventanas por completo para que entre aire fresco.
  answer: C
  explanation: Al detenerse a lo largo de la carretera para descansar, el manual aconseja
    cerrar todas las puertas con seguro, apagar el motor, encender las luces de estacionamiento
    y apagar otros equipos eléctricos.
- id: 101
  category: driver_responsibility
  question: 'Un estudio importante sobre el desempeño de los conductores indica que
    el factor más crítico en un historial de conducción, independientemente de la
    capacitación, es:'
  choices:
    A: La edad y el género del conductor.
    B: El estado mecánico del vehículo.
    C: El autoconocimiento de un individuo y su capacidad para interactuar con otras
      personas.
    D: La cantidad de tiempo dedicado a las clases de educación vial.
  answer: C
  explanation: Según el manual, un estudio importante indica que el factor más crítico
    en un historial de conducción es el autoconocimiento de un individuo y su capacidad
    para interactuar con otras personas.
- id: 102
  category: defensive_driving
  question: ¿Cómo pueden las emociones fuertes, como la ira, afectar su conducción?
  choices:
    A: Mejoran su tiempo de reacción en situaciones de emergencia.
    B: Le ayudan a concentrarse mejor en el camino que tiene por delante.
    C: Pueden desviar su atención de la conducción y perjudicar su capacidad para
      procesar información.
    D: Solo afectan su conducción si también está físicamente cansado.
  answer: C
  explanation: El manual explica que las emociones pueden desviar la atención del
    conductor de la conducción, reducir la concentración y perjudicar la capacidad
    de procesar información y tomar las medidas necesarias.
- id: 103
  category: defensive_driving
  question: ¿Cuál de los siguientes comportamientos se define específicamente como
    un ejemplo de 'furia al volante' (road rage) en lugar de simplemente conducción
    agresiva?
  choices:
    A: Exceder el límite de velocidad.
    B: Seguir a otro vehículo demasiado de cerca.
    C: No obedecer los controles de tráfico.
    D: Intentar embestir a otro vehículo.
  answer: D
  explanation: El manual define la furia al volante como el uso del vehículo o de
    un arma para amenazar o causar daño, dando ejemplos como lanzar objetos, gritar
    a un usuario específico e intentar embestir a otro vehículo.
- id: 104
  category: driver_responsibility
  question: El manual establece que 'las emociones son contagiosas' en situaciones
    de tráfico. ¿Qué significa esto para los conductores?
  choices:
    A: Puede contagiarse de una enfermedad de un conductor enfermo si sus ventanas
      están bajas.
    B: Las sonrisas y la cortesía pueden propagarse entre los conductores con la misma
      facilidad que los disgustos y la ira.
    C: Siempre debe conducir con pasajeros para mantener su estado de ánimo elevado.
    D: La furia al volante es una infección viral que afecta al cerebro.
  answer: B
  explanation: Bajo la directriz 'Las emociones son contagiosas', el manual señala
    que así como la ira de una persona puede contagiarse a otros, las sonrisas y la
    cortesía pueden propagarse entre los conductores con la misma facilidad.
- id: 105
  category: defensive_driving
  question: Si experimenta un altercado emocional temporal, ¿cuál es la mejor medida
    a tomar antes de conducir?
  choices:
    A: Conducir inmediatamente para superar su frustración.
    B: Esperar hasta que la intensidad de la emoción haya disminuido antes de conducir.
    C: Conducir un poco más rápido de lo normal para llegar antes a su destino.
    D: Poner música fuerte y agresiva para desahogar su ira.
  answer: B
  explanation: El manual aconseja 'Retrasar la conducción cuando esté alterado' y
    esperar hasta que la intensidad de la emoción haya disminuido para que sea más
    probable que conduzca de manera segura y cortés.
- id: 106
  category: safe_driving_rules
  question: Para ayudar a prevenir la conducción agresiva y la furia al volante, ¿cuál
    es el uso adecuado del carril del extremo izquierdo?
  choices:
    A: Úselo para toda la conducción normal para evitar el tráfico que se incorpora.
    B: Manténgase fuera del carril del extremo izquierdo excepto cuando vaya a rebasar.
    C: Conduzca en él solo cuando viaje por debajo del límite de velocidad.
    D: Úselo exclusivamente para realizar giros a la derecha.
  answer: B
  explanation: 'Para prevenir la conducción agresiva, el manual instruye a los conductores:
    ''No bloquee el carril de rebase. Excepto cuando vaya a rebasar, manténgase fuera
    del carril del extremo izquierdo''.'
- id: 107
  category: defensive_driving
  question: ¿Cómo debe usar la bocina para evitar provocar una conducción agresiva
    en los demás?
  choices:
    A: Use un toque largo y continuo para asegurarse de que lo escuchen.
    B: Toque la bocina repetidamente cada vez que alguien disminuya la velocidad delante
      de usted.
    C: Úsela con moderación, ya que un par de toques cortos pueden percibirse como
      menos agresivos.
    D: Nunca use la bocina bajo ninguna circunstancia.
  answer: C
  explanation: El manual sugiere usar la bocina con moderación, señalando que 'Un
    par de toques cortos pueden percibirse como menos agresivos que un toque largo'.
- id: 108
  category: safe_driving_rules
  question: ¿Cuál es la etiqueta adecuada para el uso de las luces altas para evitar
    enojar a otros conductores?
  choices:
    A: Manténgalas encendidas en todo momento durante la noche.
    B: Cambie a luces bajas tan pronto como detecte un vehículo que viene en sentido
      contrario.
    C: Haga destellos rápidos cuando siga a un vehículo que se mueve lentamente.
    D: Úselas cuando conduzca directamente detrás de otro vehículo para iluminar su
      camino.
  answer: B
  explanation: 'El manual establece: ''Cuando use luces altas, vuelva a usar luces
    bajas tan pronto como detecte un vehículo que viene en sentido contrario. No conduzca
    detrás de otro vehículo con las luces altas encendidas''.'
- id: 109
  category: defensive_driving
  question: Si se enfrenta a un conductor que muestra comportamientos agresivos hacia
    usted, ¿qué debe hacer con respecto al contacto visual?
  choices:
    A: Mantenga la mirada fija para demostrar que no se deja intimidar.
    B: Evite el contacto visual con el otro conductor o los pasajeros.
    C: Haga un contacto visual breve y mueva la cabeza.
    D: Baje la ventanilla y mírelos directamente mientras se disculpa.
  answer: B
  explanation: 'Al responder a la conducción agresiva, el manual aconseja explícitamente:
    ''Evite el contacto visual con el otro conductor o los pasajeros''.'
- id: 110
  category: defensive_driving
  question: Si otro conductor lo desafía en la carretera, ¿por qué debería permanecer
    dentro de su vehículo?
  choices:
    A: Es ilegal bajarse de su vehículo en una vía pública.
    B: Su vehículo le ofrece protección, al igual que en un choque.
    C: Salir del vehículo resultará automáticamente en la suspensión de la licencia.
    D: El otro conductor podría robar su vehículo.
  answer: B
  explanation: 'El manual aconseja: ''No salga de su vehículo; este le ofrece protección''.
    Además, explica que, al igual que en un choque, su vehículo puede brindarle protección,
    por lo que no debe perder esa protección al bajarse.'
- id: 111
  category: defensive_driving
  question: Si necesita buscar ayuda debido a un conductor agresivo, ¿cuál es el mejor
    lugar para conducir?
  choices:
    A: Una calle residencial tranquila y sin iluminación.
    B: Un lugar público concurrido donde haya testigos, como una estación de bomberos
      o un hospital.
    C: Un callejón estrecho donde no puedan seguirlo.
    D: El arcén de la autopista más cercana.
  answer: B
  explanation: El manual recomienda que, si es necesario, debe "conducir a un lugar
    público concurrido donde haya testigos, como un hospital, una estación de bomberos
    o una tienda de conveniencia o gasolinera concurrida".
- id: 112
  category: safe_driving_rules
  question: Según el manual, ¿dónde ocurren la mayoría de las colisiones de vehículos
    motorizados?
  choices:
    A: En autopistas interestatales.
    B: En intersecciones concurridas del centro de la ciudad.
    C: A pocas millas de los hogares de las personas.
    D: En zonas rurales con carreteras sinuosas.
  answer: C
  explanation: El manual establece que "la mayoría de las colisiones de vehículos
    motorizados son causadas por errores del conductor y ocurren a pocas millas de
    los hogares de las personas".
- id: 113
  category: safe_driving_rules
  question: ¿Qué debe hacer inmediatamente antes de entrar a su vehículo para conducir?
  choices:
    A: Revisar delante y detrás del vehículo en busca de objetos, animales o personas
      en su camino.
    B: Arrancar el motor de forma remota para calentarlo.
    C: Tocar la bocina dos veces para advertir a los peatones.
    D: Revisar la presión de los neumáticos con un manómetro.
  answer: A
  explanation: 'El manual indica: "Antes de entrar a su vehículo, revise delante y
    detrás del vehículo en busca de objetos, animales o personas en su camino".'
- id: 114
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer antes de entrar a su vehículo?
  choices:
    A: Encender el motor
    B: Ajustar los espejos interiores y exteriores
    C: Revisar delante y detrás del vehículo en busca de objetos, animales o personas
    D: Abrocharse el cinturón de seguridad
  answer: C
  explanation: Según el manual, antes de entrar a su vehículo, debe revisar delante
    y detrás del vehículo en busca de objetos, animales o personas en su camino.
- id: 115
  category: driver_responsibility
  question: ¿Cómo clasifica Rhode Island su Ley de Uso del Cinturón de Seguridad?
  choices:
    A: Como una ley secundaria para adultos
    B: Como una ley primaria para todas las edades
    C: Como una ley primaria solo para menores
    D: Como una guía de seguridad voluntaria
  answer: B
  explanation: El manual especifica que la Ley de Uso del Cinturón de Seguridad es
    una ley primaria para todas las edades, lo que significa que pueden detenerlo
    si alguien no lleva puesto el cinturón.
- id: 116
  category: penalties_and_points
  question: ¿Cuál es la multa para un ocupante adulto que infringe la ley de uso del
    cinturón de seguridad en Rhode Island?
  choices:
    A: $25.00 por ocupante
    B: $40.00 por ocupante
    C: $85.00 por ocupante
    D: $100.00 por ocupante
  answer: B
  explanation: El manual establece que el operador del vehículo es responsable del
    cumplimiento, y la multa por la infracción de esta sección es de $40.00 por ocupante.
- id: 117
  category: safe_driving_rules
  question: ¿Bajo qué condiciones debe transportarse a un niño en un asiento trasero
    en un sistema de retención infantil aprobado?
  choices:
    A: Menor de 8 años, menos de 57 pulgadas de altura y menos de 80 libras de peso
    B: Menor de 10 años y menos de 100 libras
    C: Menor de 6 años y menos de 60 libras
    D: Menor de 12 años independientemente de su altura o peso
  answer: A
  explanation: La Ley de Retención Infantil exige que cualquier persona que transporte
    a un niño menor de ocho (8) años, de menos de cincuenta y siete (57) pulgadas
    de altura y menos de ochenta (80) libras, utilice un asiento trasero y un sistema
    de retención infantil aprobado.
- id: 118
  category: vehicle_information
  question: ¿Cuál de las siguientes es una excepción válida que permite que un niño
    menor de ocho años esté exento de ser transportado en un asiento trasero?
  choices:
    A: El niño prefiere sentarse en el asiento delantero
    B: El vehículo no tiene asiento trasero (por ejemplo, una camioneta pickup o un
      auto deportivo)
    C: El viaje es de menos de 5 millas
    D: El niño pesa más de 50 libras
  answer: B
  explanation: Las excepciones al requisito de asiento trasero para niños menores
    de ocho años incluyen si el vehículo no tiene asiento trasero (es decir, camioneta
    pickup, auto deportivo, etc.) o si todos los asientos traseros ya están siendo
    utilizados por otros niños.
- id: 119
  category: penalties_and_points
  question: ¿Cuál es la sanción por transportar a un niño que no está en un sistema
    de retención infantil requerido?
  choices:
    A: Una multa de $40
    B: Una multa de $50 y una advertencia por escrito
    C: Una comparecencia obligatoria ante el tribunal
    D: Suspensión de la licencia por 30 días
  answer: C
  explanation: El manual establece explícitamente que una infracción por transportar
    a un niño que no esté en un sistema de retención infantil exige una comparecencia
    ante el tribunal.
- id: 120
  category: safe_driving_rules
  question: ¿Cómo debe asegurarse a un bebé (desde el nacimiento hasta al menos un
    año de edad y al menos 20 libras) en un vehículo?
  choices:
    A: Mirando hacia adelante en el asiento delantero
    B: Mirando hacia atrás y/o en un asiento de seguridad convertible en el asiento
      trasero
    C: Mirando hacia adelante en un asiento de seguridad convertible en el asiento
      trasero
    D: En un asiento elevado (booster seat) en el asiento trasero
  answer: B
  explanation: La Ley de Uso de Asientos Elevadores/Asientos de Seguridad/Cinturones
    de Seguridad exige que los bebés (desde el nacimiento hasta al menos 1 año de
    edad y al menos 20 libras) estén en un asiento de seguridad orientado hacia atrás
    y/o convertible, solo para uso en el asiento trasero.
- id: 121
  category: defensive_driving
  question: ¿La distancia total de parada se calcula sumando qué tres componentes?
  choices:
    A: Distancia visual, distancia de reacción y distancia de frenado
    B: Distancia de percepción, distancia de reacción y distancia de frenado
    C: Distancia de reconocimiento, distancia mecánica y distancia de parada
    D: Distancia de percepción, distancia de hidroplaneo y distancia de frenado
  answer: B
  explanation: 'El manual establece: ''La distancia de percepción más la distancia
    de reacción más la distancia de frenado es igual a la distancia total de parada''.'
- id: 122
  category: driver_responsibility
  question: Después de ver un peligro, ¿aproximadamente cuánto tiempo le toma al conductor
    promedio aplicar el freno?
  choices:
    A: 1/4 de segundo
    B: 1/2 de segundo
    C: 3/4 de segundo
    D: 1 segundo completo
  answer: C
  explanation: Según el manual, después de ver un peligro, al conductor promedio le
    toma unos 3/4 de segundo aplicar el freno.
- id: 123
  category: defensive_driving
  question: ¿Qué es el 'velocitizing' (efecto de velocidad)?
  choices:
    A: Cuando los neumáticos delanteros pierden contacto con la superficie mojada
      de la carretera
    B: Cuando empiezas a sentir que vas más lento que tu velocidad real
    C: Cuando aceleras demasiado rápido en una rampa de salida
    D: Cuando tu distancia de frenado aumenta debido a carreteras con hielo
  answer: B
  explanation: El manual define el 'velocitizing' como algo que ocurre 'cuando empiezas
    a sentir que vas más lento que tu velocidad real'. Se puede evitar variando ligeramente
    la velocidad en la autopista.
- id: 124
  category: safe_driving_rules
  question: ¿Cómo puede un conductor protegerse contra el hidroplaneo (hydroplaning)?
  choices:
    A: Manteniendo la presión de los neumáticos inflados al estándar recomendado por
      el fabricante y reduciendo la velocidad
    B: Frenando con fuerza al conducir a través de charcos de agua
    C: Aumentando la velocidad para alejar el agua de los neumáticos
    D: Desinflando ligeramente los neumáticos durante las tormentas de lluvia
  answer: A
  explanation: El manual aconseja protegerse contra el hidroplaneo manteniendo la
    presión de los neumáticos inflados al estándar recomendado por el fabricante,
    reduciendo la velocidad y teniendo cuidado al conducir bajo la lluvia.
- id: 125
  category: safe_driving_rules
  question: ¿Qué fracción de todos los choques ocurre cuando un vehículo está girando
    a la izquierda?
  choices:
    A: Un medio (1/2)
    B: Un tercio (1/3)
    C: Un cuarto (1/4)
    D: Un sexto (1/6)
  answer: D
  explanation: El manual señala que un sexto (1/6) de todos los choques ocurren cuando
    un vehículo está girando a la izquierda.
- id: 126
  category: defensive_driving
  question: Al esperar en una intersección para girar a la izquierda, ¿qué debe hacer
    con las ruedas de su vehículo?
  choices:
    A: Girarlas hacia la izquierda para prepararse para el giro
    B: Girarlas hacia la derecha para mantener el equilibrio
    C: No gire las ruedas hacia su trayectoria prevista hasta que esté libre para
      realizar el giro
    D: Mantenerlas giradas ligeramente a la izquierda y avanzar lentamente hacia el
      tráfico que viene en sentido contrario
  answer: C
  explanation: 'Al realizar un giro a la izquierda, el manual indica: ''No gire las
    ruedas hacia su trayectoria prevista hasta que esté libre para realizar el giro''.'
- id: 127
  category: safe_driving_rules
  question: Cuando se está preparando para girar a la izquierda en una intersección,
    ¿qué vehículos tienen el derecho de paso?
  choices:
    A: Solo el vehículo que se aproxima directamente hacia usted
    B: Solo el vehículo que se aproxima por su derecha
    C: Tanto el vehículo que se aproxima directamente hacia usted como el vehículo
      que se aproxima por su derecha
    D: El vehículo que realiza el giro a la izquierda tiene el derecho de paso
  answer: C
  explanation: El manual establece que al realizar un giro a la izquierda, 'Tanto
    el vehículo motorizado que se aproxima directamente hacia usted como el vehículo
    que se aproxima por su derecha tienen el derecho de paso'.
- id: 128
  category: safe_driving_rules
  question: ¿Por qué debe evitar desviarse hacia la izquierda antes de realizar un
    giro a la derecha?
  choices:
    A: Le da un radio de giro más amplio y ocupa demasiado espacio.
    B: Es probable que haga que el conductor detrás de usted asuma que va a girar
      a la izquierda.
    C: Causa un desgaste innecesario en la columna de dirección de su vehículo.
    D: Es ilegal cruzar la línea central mientras se gira a la derecha.
  answer: B
  explanation: Según el manual, desviarse hacia la izquierda antes de girar a la derecha
    es un hábito peligroso porque es probable que haga que el conductor del vehículo
    que le sigue asuma que usted va a girar a la izquierda.
- id: 129
  category: safe_driving_rules
  question: En los conceptos básicos para realizar un giro, ¿qué significa la 'C'?
  choices:
    A: Check (Revisar) sus espejos y puntos ciegos.
    B: Cancel (Cancelar) su señal direccional.
    C: Coast (Avanzar por inercia) en la primera mitad del giro, cubriendo el freno.
    D: Cross (Cruzar) la intersección de manera segura.
  answer: C
  explanation: El manual establece que la 'C' significa 'Avanzar por inercia (Coast)
    en la primera mitad del giro, cubriendo el freno (presión suave en el pedal del
    freno) en caso de que surja la necesidad de aplicar los frenos'.
- id: 130
  category: safe_driving_rules
  question: 'Al planificar un cambio de sentido (turnabout), debe tener visibilidad
    clara en cada dirección por una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Para planificar un cambio de sentido, debe asegurarse de tener visibilidad
    clara en cada dirección por una distancia de quinientos (500) pies.
- id: 131
  category: safe_driving_rules
  question: ¿A qué distancia debe estar de una intersección para realizar un cambio
    de sentido (turnabout) de manera segura?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: C
  explanation: El manual establece que al planificar un cambio de sentido, debe asegurarse
    de estar al menos a doscientos pies (200') de una intersección.
- id: 132
  category: defensive_driving
  question: ¿Por qué se considera más peligroso entrar en una calle o entrada a la
    izquierda para realizar un cambio de sentido?
  choices:
    A: Estará retrocediendo hacia el carril de circulación.
    B: Es difícil ver a los peatones en el lado izquierdo.
    C: Requiere cruzar una línea amarilla doble.
    D: Debe ceder el paso a los vehículos que vienen detrás.
  answer: A
  explanation: El manual señala que entrar en una calle o entrada a la izquierda es
    más peligroso porque estará retrocediendo hacia el carril de circulación.
- id: 133
  category: safe_driving_rules
  question: 'Al detenerse ante una señal de alto (stop), los conductores deben cesar
    por completo todo movimiento hacia adelante durante un mínimo de:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Al detenerse, los conductores deben cesar por completo todo movimiento
    hacia adelante durante un mínimo de tres segundos para dar tiempo a mirar a la
    izquierda, a la derecha y a la izquierda de nuevo.
- id: 134
  category: safe_driving_rules
  question: Si dos vehículos llegan al mismo tiempo a una intersección con parada
    de cuatro vías, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo de la izquierda
    B: El vehículo de la derecha
    C: El vehículo que viaja a una velocidad más rápida
    D: El vehículo que hace la señal primero
  answer: B
  explanation: En una parada de cuatro vías, si dos vehículos llegan a la intersección
    al mismo tiempo, debe ceder el derecho de paso al vehículo que está a su derecha.
- id: 135
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios no se puede estacionar ni
    detener su vehículo?
  choices:
    A: 8 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: A
  explanation: El manual enumera los lugares donde no se puede estacionar ni detenerse,
    lo que incluye a menos de 8 pies de un hidrante de incendios.
- id: 136
  category: safe_driving_rules
  question: ¿A cuántos pies de un paso de peatones en una intersección es ilegal estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: No puede estacionarse ni detenerse a menos de 20 pies de un paso de
    peatones en una intersección.
- id: 137
  category: safe_driving_rules
  question: ¿A cuántos pies de una luz roja o amarilla intermitente, una señal de
    alto o un semáforo no debe estacionarse?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: El manual establece que no puede estacionarse ni detenerse a menos
    de 30 pies de una luz roja o amarilla intermitente, una señal de alto o un semáforo.
- id: 138
  category: safe_driving_rules
  question: A menos que esté cargando o descargando pasajeros o paquetes por un corto
    tiempo, ¿a cuántos pies del riel más cercano de un cruce de ferrocarril no puede
    estacionarse?
  choices:
    A: 20 pies
    B: 30 pies
    C: 50 pies
    D: 75 pies
  answer: C
  explanation: No puede estacionarse ni detenerse a menos de 50 pies del riel más
    cercano de un cruce de ferrocarril, a menos que se detenga por un corto tiempo
    para cargar o descargar.
- id: 139
  category: safe_driving_rules
  question: Cuando se estaciona en una carretera de dos carriles, ¿a qué distancia
    máxima en pulgadas deben estar las ruedas derechas del lado derecho de la carretera
    o del bordillo (curb)?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: A menos que una ley prohíba el estacionamiento, un vehículo estacionado
    en una carretera de dos carriles debe tener las ruedas derechas a un máximo de
    doce (12) pulgadas del lado derecho de la carretera o del bordillo.
- id: 140
  category: defensive_driving
  question: Al incorporarse a un carril de circulación desde una posición de estacionamiento,
    ¿qué debe hacer para cubrir sus puntos ciegos?
  choices:
    A: Tocar la bocina antes de moverse.
    B: Encender y apagar las luces delanteras para advertir al tráfico que se aproxima.
    C: Mirar por encima de su hombro izquierdo.
    D: Confiar únicamente en su espejo retrovisor.
  answer: C
  explanation: Para incorporarse a un carril de circulación desde una posición de
    estacionamiento, debe revisar los espejos retrovisores interiores y exteriores
    y mirar por encima de su hombro izquierdo para cubrir los puntos ciegos.
- id: 141
  category: defensive_driving
  question: ¿Al esperar en una intersección para realizar un giro a la derecha, por
    qué debe esperar para girar las ruedas hacia su trayectoria de viaje prevista?
  choices:
    A: Provoca un desgaste innecesario de los neumáticos.
    B: Debe esperar hasta que el camino esté despejado para realizar el giro.
    C: Bloquea la columna de dirección.
    D: Confunde a los peatones que cruzan la calle.
  answer: B
  explanation: 'El manual indica: ''Cuando llegue a la intersección, espere hasta
    que el camino esté despejado. No gire las ruedas hacia su trayectoria de viaje
    prevista hasta que esté libre para realizar el giro''.'
- id: 142
  category: driver_testing
  question: Durante su examen de conducir, si se le indica que detenga y arranque
    su vehículo en una colina, ¿qué debe hacer inmediatamente después de detenerse
    en el lado derecho de la carretera?
  choices:
    A: Encender las luces de emergencia.
    B: Poner el freno de estacionamiento y cambiar a punto muerto (neutral).
    C: Mantener el pie firmemente en el freno y permanecer en marcha (drive).
    D: Cambiar a estacionamiento (park) y apagar el motor.
  answer: B
  explanation: Cuando el examinador le indique que se dirija al lado derecho de la
    carretera y se detenga en una colina, debe poner el freno de estacionamiento y
    cambiar a punto muerto (neutral).
- id: 143
  category: safe_driving_rules
  question: ¿Qué debe hacer al entrar en una calzada desde un camino privado o una
    entrada para vehículos (driveway)?
  choices:
    A: Detenerse solo en la línea del bordillo.
    B: Detenerse en la acera y luego detenerse nuevamente en la línea del bordillo.
    C: Ceder el paso sin detenerse si la carretera está despejada.
    D: Tocar la bocina y avanzar a baja velocidad.
  answer: B
  explanation: Al entrar en la calzada desde un camino privado o una entrada para
    vehículos, debe detenerse en la acera antes de continuar hasta la línea del bordillo,
    donde es obligatorio detenerse nuevamente.
- id: 144
  category: safe_driving_rules
  question: Al adelantar a un vehículo por la izquierda, ¿cómo sabe que es seguro
    volver al lado derecho de la carretera?
  choices:
    A: Cuando esté a una distancia de un vehículo por delante del vehículo adelantado.
    B: Cuando pueda ver al conductor del vehículo adelantado en su espejo lateral.
    C: Cuando pueda ver los neumáticos del vehículo adelantado sobre el pavimento
      en su espejo retrovisor interior.
    D: Tres segundos después de haber pasado el parachoques delantero del vehículo.
  answer: C
  explanation: Debe alejarse lo suficiente del vehículo que está adelantando para
    poder ver los neumáticos sobre el pavimento del vehículo adelantado en su espejo
    retrovisor interior antes de regresar al lado derecho de la carretera.
- id: 145
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones es permisible adelantar a un
    vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad.
    B: Cuando el vehículo de adelante está realizando o está a punto de realizar un
      giro a la izquierda.
    C: Cuando conduce por un camino de tierra de un solo carril.
    D: Cuando el vehículo de adelante está realizando un giro a la derecha.
  answer: B
  explanation: Un conductor puede adelantar por la derecha a otro vehículo cuando
    el vehículo motorizado de adelante está realizando o está a punto de realizar
    un giro a la izquierda.
- id: 146
  category: defensive_driving
  question: ¿Qué se recomienda si está retrocediendo una distancia superior a 30 pies?
  choices:
    A: Tocar la bocina cada 10 pies.
    B: Activar las luces de emergencia.
    C: Bajar la ventanilla y usar señales manuales.
    D: Hacer destellos con las luces altas.
  answer: B
  explanation: Si está retrocediendo una distancia superior a 30 pies, se recomienda
    activar las luces de emergencia para advertir a otros automovilistas sobre sus
    maniobras.
- id: 147
  category: defensive_driving
  question: ¿Qué es la condición conocida como "velocitizing" (velocitización)?
  choices:
    A: Quedarse dormido al volante durante viajes largos.
    B: Sentir que viaja más lento que su velocidad real.
    C: Perder tracción en superficies mojadas de la autopista.
    D: Acelerar demasiado rápido en una rampa de entrada.
  answer: B
  explanation: La velocitización ocurre cuando comienza a sentir que va más lento
    que su velocidad real, especialmente al prepararse para salir de una autopista.
- id: 148
  category: defensive_driving
  question: ¿Qué es la "hipnosis de carretera" (highway hypnosis)?
  choices:
    A: Una condición causada por largos períodos de conducción.
    B: Una ilusión visual causada por los faros de los vehículos que vienen en sentido
      contrario.
    C: La tendencia a seguir al vehículo de adelante demasiado de cerca.
    D: La sensación de ir más lento que su velocidad real.
  answer: A
  explanation: La hipnosis de carretera es una condición causada por largos períodos
    de conducción. Para evitar sus efectos, debe salir de su vehículo por un tiempo
    para relajarse.
- id: 149
  category: safe_driving_rules
  question: En una autopista, ¿para qué se utiliza principalmente el carril del extremo
    izquierdo?
  choices:
    A: Tráfico que se mueve más lento.
    B: Vehículos que entran y salen de la autopista.
    C: Adelantar a otros vehículos.
    D: Camiones y autobuses.
  answer: C
  explanation: El carril del extremo izquierdo es para adelantar a otros vehículos.
    Los camiones, autobuses y otros vehículos especiales tienen prohibido circular
    por este carril.
- id: 150
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad estándar en zonas residenciales en Rhode
    Island?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: La ley de Rhode Island establece límites de velocidad de 25 millas
    por hora (mph) en zonas residenciales.
- id: 151
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo sigue demasiado de cerca (tailgating)?
  choices:
    A: Aumentar la velocidad para incrementar la distancia entre usted y el vehículo
      que lo sigue.
    B: Frenar bruscamente para advertir al conductor.
    C: Cambiar de carril para dejar pasar al vehículo.
    D: Provocar al conductor para que se aleje.
  answer: C
  explanation: Si lo siguen demasiado de cerca, cambie de carril. Nunca aumente la
    velocidad porque lo seguirán a una velocidad mayor, y nunca frene bruscamente.
- id: 152
  category: safe_driving_rules
  question: Si debe detenerse en la autopista y necesita ayuda, ¿qué debe hacer para
    avisar a otros conductores?
  choices:
    A: Pararse en el carril de emergencia y agitar los brazos.
    B: Levantar el capó de su vehículo y atar un paño blanco en la manija de la puerta.
    C: Dejar las puertas sin seguro y caminar hasta la salida más cercana.
    D: Tocar la bocina continuamente hasta que llegue ayuda.
  answer: B
  explanation: Si necesita ayuda en una autopista, levante el capó de su vehículo,
    ate un paño blanco en la manija de la puerta y permanezca dentro de su vehículo
    con las puertas cerradas.
- id: 153
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta a seguir si se pasa de su rampa de salida
    en una autopista?
  choices:
    A: Detenerse y retroceder con cuidado hasta la salida perdida.
    B: Hacer un giro en U a través de la mediana.
    C: Detenerse en el carril de emergencia y esperar a que el tráfico se despeje
      antes de retroceder.
    D: Continuar hasta la siguiente salida.
  answer: D
  explanation: Si se pasa de su rampa de salida, continúe hasta la siguiente salida.
    Nunca se detenga ni retroceda hacia la salida perdida.
- id: 154
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de seguimiento que debe mantener detrás de
    un vehículo de emergencia?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Siempre conduzca a 500 pies de distancia detrás de los vehículos de
    emergencia.
- id: 155
  category: safe_driving_rules
  question: ¿Qué exige la Ley de Velocidad Básica (Basic Speed Law) en Rhode Island
    que hagan los automovilistas?
  choices:
    A: Conducir siempre exactamente al límite de velocidad indicado.
    B: Conducir 5 mph por debajo del límite de velocidad indicado por la noche.
    C: Conducir solo a la velocidad que las condiciones de la carretera dicten.
    D: Mantener una velocidad mínima de 45 mph en todas las autopistas.
  answer: C
  explanation: La Ley de Velocidad Básica en Rhode Island exige que los automovilistas
    conduzcan solo a la velocidad que las condiciones de la carretera dicten, ajustándose
    a la nieve, lluvia, aguanieve, hielo o construcción de carreteras.
- id: 156
  category: driver_responsibility
  question: ¿Cuál es la ley de Rhode Island con respecto al uso de teléfonos celulares
    para conductores menores de 18 años?
  choices:
    A: Pueden usar un teléfono celular solo si es un dispositivo de manos libres.
    B: Tienen completamente prohibido usar un teléfono celular mientras operan un
      vehículo motorizado.
    C: Pueden usar un teléfono celular solo para navegación GPS.
    D: Pueden usar un teléfono celular siempre que no conduzcan en una autopista.
  answer: B
  explanation: Los conductores menores de 18 años tienen prohibido usar un teléfono
    celular mientras operan un vehículo motorizado, según R.I.G.L. 31-22-11.9.
- id: 157
  category: safe_driving_rules
  question: Al prepararse para rebasar a un vehículo por la noche, ¿qué podría ser
    necesario para advertir al conductor que está delante de usted?
  choices:
    A: Tocar la bocina tres veces.
    B: Encender las luces de emergencia temporalmente.
    C: Cambiar las luces delanteras de luz de cruce (baja) a luz de carretera (alta)
      y volver a luz de cruce.
    D: Apagar las luces delanteras durante un segundo.
  answer: C
  explanation: Por la noche, puede ser necesario cambiar las luces delanteras de luz
    de cruce a luz de carretera y volver a luz de cruce para advertir al conductor
    de adelante que tiene la intención de rebasar.
- id: 158
  category: safe_driving_rules
  question: Según la Ley de Velocidad Básica, ¿qué indica una señal de límite de velocidad?
  choices:
    A: La velocidad mínima requerida en la carretera.
    B: La velocidad máxima para condiciones ideales.
    C: La velocidad recomendada durante el mal tiempo.
    D: La velocidad que debe mantener independientemente del tráfico.
  answer: B
  explanation: El manual establece que los automovilistas deben comprender que la
    señal de límite de velocidad es la velocidad máxima para condiciones ideales y,
    por lo tanto, deben ajustar su velocidad a las condiciones.
- id: 159
  category: penalties_and_points
  question: ¿Cuál es la sanción por una tercera infracción por usar un teléfono celular
    mientras conduce si es menor de 18 años?
  choices:
    A: Multa de $50
    B: Multa de $85
    C: Multa de $100 y pérdida de la licencia hasta los 18 años de edad
    D: Multa de $125 y servicio comunitario obligatorio
  answer: C
  explanation: Si un menor comete una tercera infracción de la ley de teléfonos celulares,
    está sujeto a una multa de $100.00 y perderá su licencia hasta los 18 años de
    edad.
- id: 160
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia se le permite a un conductor menor de 18 años
    usar un teléfono celular mientras opera un vehículo motorizado?
  choices:
    A: Cuando usa un dispositivo de manos libres o el altavoz
    B: Cuando está detenido en un semáforo en rojo
    C: En caso de una emergencia
    D: Al llamar a un padre o tutor
  answer: C
  explanation: El único momento en que se le permite a un menor usar un teléfono celular
    es en caso de una emergencia. Los dispositivos de manos libres y los altavoces
    también están prohibidos para los menores.
- id: 161
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción por enviar mensajes de texto
    mientras se conduce en Rhode Island?
  choices:
    A: $50.00
    B: $85.00
    C: $100.00
    D: $125.00
  answer: B
  explanation: Según las sanciones por mensajes de texto en el manual, una primera
    infracción por enviar mensajes de texto mientras se conduce resulta en una multa
    de $85.00.
- id: 162
  category: safe_driving_rules
  question: Como mínimo, ¿con cuánta anticipación debe un conductor hacer una señal
    antes de realizar un giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley establece que un conductor debe hacer una señal con la mano
    o usando las luces direccionales al menos 100 pies antes de realizar un giro como
    mínimo.
- id: 163
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar un giro a la derecha?
  choices:
    A: Extender la mano y el brazo izquierdos hacia afuera.
    B: Poner la mano y el brazo izquierdos hacia abajo.
    C: Poner la mano y el brazo izquierdos hacia arriba.
    D: Extender la mano y el brazo derechos hacia afuera.
  answer: C
  explanation: Para girar a la derecha, la señal manual correcta es poner la mano
    y el brazo izquierdos hacia arriba, manteniendo la mano y el brazo quietos.
- id: 164
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas pintadas en la calzada?
  choices:
    A: Separan el tráfico que viaja en la misma dirección.
    B: Separan el tráfico que viaja en direcciones opuestas.
    C: Marcan los bordes exteriores de la calzada.
    D: Indican un cruce de peatones.
  answer: B
  explanation: Las líneas amarillas separan el tráfico que viaja en direcciones opuestas.
- id: 165
  category: signs_and_signals
  question: Al usar un carril de giro compartido, ¿un automovilista no debe entrar
    en el carril a menos que tenga la intención de girar dentro de qué distancia mínima?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Los automovilistas que deseen girar no deben entrar en un carril de
    giro compartido a menos que tengan la intención de girar dentro de 100 pies (mínimo).
- id: 166
  category: sharing_the_road
  question: ¿Qué indica a los automovilistas un 'sharrow' o marca de carril compartido?
  choices:
    A: El carril está restringido solo para vehículos de alta ocupación.
    B: Un ciclista puede utilizar el carril completo.
    C: El carril está terminando y los vehículos deben incorporarse a la derecha.
    D: Los peatones tienen el derecho de paso en el carril.
  answer: B
  explanation: Un 'sharrow' es una marca de carril compartido instalada en el centro
    de un carril de circulación para indicar que un ciclista puede utilizar el carril
    completo.
- id: 167
  category: safe_driving_rules
  question: ¿En qué dirección fluye el tráfico alrededor de la isla central de una
    rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En un patrón de figura en ocho
    D: Directo a través del centro
  answer: B
  explanation: Las rotondas son intersecciones que dirigen el tráfico en sentido contrario
    a las agujas del reloj alrededor de una isla central.
- id: 168
  category: sharing_the_road
  question: ¿Cómo deben navegar por una rotonda los ciclistas experimentados si deciden
    circular por ella como un automovilista?
  choices:
    A: Circular lo más cerca posible de la línea del bordillo.
    B: Circular por el medio del carril para evitar que los vehículos los adelanten.
    C: Circular sobre la isla central.
    D: Circular en contra del flujo del tráfico.
  answer: B
  explanation: Los ciclistas experimentados pueden navegar por las rotondas como los
    automovilistas. Los ciclistas deben circular por el medio del carril, no cerca
    de la línea del bordillo, para evitar que los vehículos los adelanten.
- id: 169
  category: safe_driving_rules
  question: ¿Cuál es el deber de un peatón al cruzar una rotonda?
  choices:
    A: Caminar directamente a través de la isla central.
    B: Cruzar hasta el divisor o refugio elevado o pintado, y luego terminar de cruzar.
    C: Ceder el derecho de paso a todos los vehículos motorizados que entren.
    D: Cruzar por donde elijan, ya que siempre tienen el derecho de paso.
  answer: B
  explanation: Los peatones deben cruzar hasta el divisor o refugio elevado o pintado.
    Luego, mirar a la derecha y terminar de cruzar hasta la acera opuesta. Nunca deben
    caminar a través de una rotonda ni cruzar la isla central.
- id: 170
  category: safe_driving_rules
  question: Según la ley de Rhode Island, ¿quién tiene el derecho de paso cuando un
    vehículo está a punto de entrar en una glorieta (rotary)?
  choices:
    A: El vehículo que entra en la glorieta.
    B: Los vehículos que ya están en la glorieta.
    C: El vehículo más grande.
    D: El vehículo que se aproxima por la derecha.
  answer: B
  explanation: La ley R.I.G.L. 31-17-8 establece que el conductor de un vehículo que
    está a punto de entrar en una glorieta debe ceder el derecho de paso a todos los
    vehículos que ya se encuentren en ella.
- id: 171
  category: safe_driving_rules
  question: ¿Cómo debe tratar un automovilista una intersección no controlada que
    no tiene señales de tráfico ni semáforos?
  choices:
    A: Como si hubiera una señal de alto (stop) presente.
    B: Como si hubiera una señal de ceda el paso (yield) presente.
    C: Como un alto de cuatro vías.
    D: Pueden continuar sin reducir la velocidad.
  answer: B
  explanation: Al acercarse a intersecciones no controladas, los automovilistas deben
    tratar la intersección como si hubiera una señal de ceda el paso (yield) presente.
- id: 172
  category: signs_and_signals
  question: ¿Qué señal manual debe usar un conductor para indicar que se va a detener
    o a reducir la velocidad?
  choices:
    A: Poner la mano y el brazo izquierdos extendidos hacia afuera.
    B: Poner la mano y el brazo izquierdos hacia arriba.
    C: Poner la mano y el brazo izquierdos hacia abajo.
    D: Mover la mano izquierda en un movimiento circular.
  answer: C
  explanation: Para detenerse o reducir la velocidad, la señal manual correcta es
    poner la mano y el brazo izquierdos hacia abajo, manteniendo la mano y el brazo
    quietos.
- id: 173
  category: signs_and_signals
  question: ¿Cómo debe tratar un automovilista una intersección no controlada?
  choices:
    A: Como un alto de cuatro vías
    B: Como si hubiera una señal de ceda el paso (yield) presente
    C: Como una luz roja intermitente
    D: Como un carril de giro protegido
  answer: B
  explanation: Según el manual, al acercarse a intersecciones no controladas (intersecciones
    sin señales ni semáforos), los automovilistas deben tratar la intersección como
    si hubiera una señal de ceda el paso (yield) presente.
- id: 174
  category: defensive_driving
  question: ¿Qué significa 'cubrir el freno' al acercarse a una intersección?
  choices:
    A: Presionar el pedal del freno firmemente hasta el fondo
    B: Tocar ligeramente el pedal del freno para advertir a otros conductores
    C: Quitar el pie del acelerador y mantenerlo sobre el pedal del freno sin tocarlo
    D: Usar ambos pies para presionar el freno y el embrague simultáneamente
  answer: C
  explanation: Cubrir el freno significa quitar el pie del pedal del acelerador y
    mantenerlo sobre el pedal del freno sin tocarlo, preparándose para presionar el
    pedal del freno si surgiera un peligro.
- id: 175
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a un semáforo con luz roja intermitente?
  choices:
    A: Reducir la velocidad y continuar con precaución
    B: Hacer una parada completa y tratarla como una señal de alto
    C: Ceder el paso solo a los vehículos a su derecha
    D: Mantener su velocidad pero cubrir el freno
  answer: B
  explanation: Al acercarse a un semáforo con luz roja intermitente, debe hacer una
    parada completa y ceder el derecho de paso a todos los vehículos a su derecha
    e izquierda. Debe tratar la señal roja intermitente como una señal de alto.
- id: 176
  category: signs_and_signals
  question: ¿Cuándo se le permite girar a la derecha con una luz roja continua?
  choices:
    A: En cualquier momento, sin detenerse
    B: Solo cuando también hay una flecha verde
    C: Después de detenerse por completo y ceder el paso, a menos que una señal lo
      prohíba
    D: Nunca se permiten los giros a la derecha en rojo
  answer: C
  explanation: Excepto cuando hay una señal que prohíbe el giro a la derecha en rojo,
    los vehículos pueden girar a la derecha con una luz roja continua después de que
    el conductor se haya detenido por completo y haya cedido el derecho de paso a
    los peatones y otros vehículos.
- id: 177
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente para los giros a la izquierda?
  choices:
    A: Tiene un giro protegido y el derecho de paso
    B: Debe detenerse y esperar a una luz verde continua
    C: Puede girar solo después de ceder el paso al tráfico que viene en sentido contrario
      y a los peatones
    D: Los giros a la izquierda están prohibidos temporalmente
  answer: C
  explanation: Cuando se muestra una flecha amarilla intermitente, puede proceder
    a girar en la dirección de la flecha solo después de ceder el paso al tráfico
    que viene en sentido contrario y a los peatones.
- id: 178
  category: signs_and_signals
  question: ¿Cuál es el propósito de una señal HAWK?
  choices:
    A: Advertir a los conductores de una próxima salida de la autopista
    B: Permitir que los peatones crucen una calle de manera segura
    C: Indicar un cruce de ferrocarril activo
    D: Controlar el tráfico en zonas escolares durante el recreo
  answer: B
  explanation: HAWK significa Cruce Peatonal Activado de Alta Intensidad (High-Intensity
    Activated Crosswalk) y se utiliza para permitir que los peatones crucen una calle
    de manera segura.
- id: 179
  category: safe_driving_rules
  question: ¿Qué debe hacer si conduce por una carretera resbaladiza y su vehículo
    está equipado con un Sistema de Frenos Antibloqueo (ABS)?
  choices:
    A: Bombear los frenos suavemente para evitar derrapar
    B: Presionar el pedal firmemente y mantener la presión hasta que el vehículo se
      detenga
    C: Pisar el freno y soltarlo repetidamente
    D: Usar el freno de mano para reducir la velocidad de manera segura
  answer: B
  explanation: Si su vehículo está equipado con frenos antibloqueo (ABS), no bombee
    el freno. Presione el pedal firmemente y mantenga la presión hasta que el vehículo
    se detenga.
- id: 180
  category: defensive_driving
  question: ¿Cuál es el primer paso que debe dar para controlar un vehículo cuando
    comienza a derrapar?
  choices:
    A: Pisar los frenos bruscamente
    B: Poner el vehículo en punto muerto (neutral)
    C: Quitar el pie del acelerador
    D: Girar el volante bruscamente en la dirección opuesta
  answer: C
  explanation: Para controlar un vehículo cuando comienza a derrapar, el primer paso
    que figura en el manual es 'Quitar el pie del acelerador'.
- id: 181
  category: defensive_driving
  question: ¿En qué dirección debe girar el volante si su vehículo comienza a derrapar?
  choices:
    A: En la dirección opuesta al derrape
    B: Hacia adelante en todo momento
    C: Hacia el lado derecho de la carretera
    D: En la dirección en la que desea que vaya el vehículo
  answer: D
  explanation: Al intentar controlar un vehículo en un derrape, debe 'girar en la
    dirección en la que desea que vaya el vehículo'.
- id: 182
  category: vehicle_information
  question: ¿Qué debe hacer si experimenta una falla total de los frenos mientras
    conduce?
  choices:
    A: Cambiar a una marcha más alta y acelerar
    B: Bombear el pedal del freno y reducir a una marcha más baja
    C: Apagar el motor inmediatamente
    D: Dirigirse directamente hacia el tráfico en sentido contrario para detenerse
  answer: B
  explanation: Si el pedal del freno se va hasta el fondo, debe bombear el pedal para
    intentar restaurar la presión del fluido, reducir a una marcha más baja para usar
    el frenado de motor y activar el freno de estacionamiento.
- id: 183
  category: defensive_driving
  question: ¿Cómo debe reaccionar si experimenta el reventón de un neumático mientras
    conduce?
  choices:
    A: Frenar bruscamente de inmediato para detener el vehículo
    B: Sujetar el volante con firmeza y soltar gradualmente el acelerador sin frenar
    C: Girar el volante bruscamente hacia el acotamiento
    D: Poner el vehículo en punto muerto (neutral) y aplicar el freno de estacionamiento
  answer: B
  explanation: Si experimenta una falla en los neumáticos, sujete el volante con firmeza
    con ambas manos y suelte el acelerador para reducir la velocidad del vehículo.
    No frene, ya que frenar puede hacer que el vehículo se desvíe bruscamente.
- id: 184
  category: defensive_driving
  question: ¿Qué debe hacer si el pedal del acelerador se queda pegado al piso?
  choices:
    A: Poner el vehículo en NEUTRAL (punto muerto) al mismo tiempo que aplica el freno
    B: Apagar el motor mientras aún conduce a alta velocidad
    C: Tirar del freno de emergencia con la mayor fuerza posible
    D: Cambiar a una marcha más baja y bombear el pedal del acelerador
  answer: A
  explanation: Si el pedal del acelerador se queda pegado, debe darle un golpe lateral
    rápido para intentar liberarlo y poner el vehículo en NEUTRAL (punto muerto) al
    mismo tiempo que aplica el freno.
- id: 185
  category: vehicle_information
  question: ¿Cuál es la acción recomendada si el motor se apaga repentinamente mientras
    conduce?
  choices:
    A: Cambiar a PARK (estacionamiento) inmediatamente
    B: Frenar bruscamente para detenerse lo más rápido posible
    C: Cambiar a NEUTRAL (punto muerto) e intentar reiniciar el motor mientras está
      en movimiento
    D: Girar el volante de un lado a otro para mantener la dirección asistida
  answer: C
  explanation: Si el motor se apaga repentinamente, cambie a NEUTRAL (punto muerto)
    cuando el motor empiece a fallar o se detenga, comience a salir del tráfico, encienda
    las luces de emergencia e intente reiniciar el motor mientras se desplaza.
- id: 186
  category: defensive_driving
  question: Al realizar una recuperación tras salirse de la carretera, ¿a qué velocidad
    debe frenar suavemente antes de regresar a la calzada?
  choices:
    A: 15 a 20 mph
    B: 5 a 10 mph
    C: 25 a 30 mph
    D: 0 mph (parada completa)
  answer: B
  explanation: Durante una recuperación tras salirse de la carretera, debe soltar
    el acelerador y frenar suavemente hasta alcanzar las cinco (5) o diez (10) mph
    antes de posicionar su vehículo para regresar a la calzada.
- id: 187
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla fija en un semáforo?
  choices:
    A: La siguiente luz será verde
    B: Debe detenerse inmediatamente sin importar la seguridad
    C: La siguiente luz será roja; reduzca la velocidad y proceda con precaución si
      no puede detenerse de manera segura
    D: Usted tiene el derecho de paso para despejar la intersección
  answer: C
  explanation: Una luz amarilla fija le indica al conductor que la siguiente luz será
    roja. Debe reducir la velocidad y proceder con precaución si no puede detenerse
    de manera segura.
- id: 188
  category: safe_driving_rules
  question: Al regresar a la calzada después de haberse salido al acotamiento, ¿qué
    debe hacer en el instante en que sus neumáticos delanteros toquen la calzada?
  choices:
    A: Frenar bruscamente hasta detenerse por completo
    B: Realizar un contravolanteo brusco
    C: Acelerar rápidamente
    D: Girar bruscamente hacia la izquierda
  answer: B
  explanation: El manual instruye a los conductores a 'realizar un contravolanteo
    brusco en el instante en que los neumáticos delanteros toquen la calzada' al regresar
    desde el acotamiento.
- id: 189
  category: defensive_driving
  question: Si se ve amenazado por una colisión frontal, ¿hacia qué dirección debe
    girar para evitar al otro vehículo?
  choices:
    A: Girar a la izquierda hacia la línea central
    B: Girar a la derecha hacia el acotamiento o la línea de la acera
    C: Mantener el volante perfectamente recto
    D: Desviarse en zigzag
  answer: B
  explanation: Para evitar una colisión frontal, el manual aconseja 'girar a la derecha
    hacia el acotamiento o la línea de la acera. No gire a la izquierda'.
- id: 190
  category: defensive_driving
  question: ¿Qué debe hacer justo antes de que ocurra una colisión por alcance (trasera)
    inevitable?
  choices:
    A: Bloquear los frenos con firmeza
    B: Soltar los frenos para suavizar el impacto
    C: Poner el vehículo en reversa
    D: Apagar el motor
  answer: B
  explanation: Si una colisión trasera es inevitable, debe 'soltar los frenos justo
    antes de que ocurra la colisión. Esto ayuda a suavizar el impacto'.
- id: 191
  category: vehicle_information
  question: ¿Qué es lo primero que debe hacer si sus faros delanteros se apagan repentinamente
    mientras conduce?
  choices:
    A: Encender sus luces de estacionamiento, las luces de emergencia (hazard flashers)
      o la luz direccional
    B: Frenar bruscamente y detenerse en su carril
    C: Cerrar los ojos para adaptarse a la oscuridad
    D: Acelerar para llegar más rápido a su destino
  answer: A
  explanation: Si sus faros fallan, el primer paso es "Encender sus luces de estacionamiento,
    las luces de emergencia (hazard flashers) o la luz direccional".
- id: 192
  category: safe_driving_rules
  question: Si su vehículo se apaga en las vías del tren y se aproxima un tren, ¿en
    qué dirección debe correr después de salir del vehículo?
  choices:
    A: En la misma dirección en la que se mueve el tren
    B: Directamente hacia el tren que se aproxima
    C: En una línea paralela en la dirección opuesta a la que se mueve el tren
    D: Perpendicular a las vías hacia la carretera más cercana
  answer: C
  explanation: Para evitar ser golpeado por los escombros, debe salir de su vehículo
    y correr "en una línea paralela en la dirección opuesta a la que se mueve el tren".
- id: 193
  category: sharing_the_road
  question: Aproximadamente, ¿cuánto tiempo puede tardar un tren en detenerse por
    completo después de aplicar el freno?
  choices:
    A: Un cuarto de milla
    B: Media milla
    C: Una milla
    D: Una milla y media
  answer: D
  explanation: 'El manual establece: "Un tren puede tardar una milla y media en detenerse
    por completo después de aplicar el freno".'
- id: 194
  category: vehicle_information
  question: ¿Qué debe hacer si ve que sale humo de debajo del capó de su vehículo?
  choices:
    A: Conducir hasta la estación de bomberos más cercana
    B: Abrir el capó inmediatamente para localizar el fuego
    C: Salirse de la carretera, apagar el motor y alejarse del vehículo
    D: Acelerar para que el aire disipe el humo
  answer: C
  explanation: Si su vehículo se incendia, debe "Salirse inmediatamente de la carretera,
    colocar el encendido en la posición de apagado (off) y alejarse del vehículo".
- id: 195
  category: safe_driving_rules
  question: ¿Por qué debe evitar abrir la puerta si su vehículo se queda varado en
    una carretera inundada por la lluvia o si cae al agua?
  choices:
    A: La manija de la puerta se cargará eléctricamente
    B: El agua llenará el interior y podría causar que el vehículo se voltee sobre
      su techo
    C: La puerta estará demasiado pesada para volver a cerrarla
    D: Atrapará la bolsa de aire en el asiento delantero
  answer: B
  explanation: 'El manual advierte: "Evite abrir la puerta, ya que el agua llenará
    el interior de su vehículo y podría causar que su vehículo se voltee sobre el
    techo".'
- id: 196
  category: safe_driving_rules
  question: ¿Cómo debe frenar en carreteras resbaladizas en invierno si su vehículo
    está equipado con frenos antibloqueo (ABS)?
  choices:
    A: Bombear el pedal suavemente
    B: Presionar el pedal firmemente y mantenerlo presionado
    C: Frenar bruscamente de forma repetida
    D: Tocar ligeramente los frenos cada pocos segundos
  answer: B
  explanation: 'Para la conducción en invierno, el manual establece: "Si tiene frenos
    antibloqueo (ABS), presione el pedal firmemente y manténgalo presionado".'
- id: 197
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de intoxicación por monóxido de
    carbono?
  choices:
    A: Sudoración excesiva
    B: Bostezos, mareos o náuseas
    C: Un fuerte olor a gases de escape en la cabina
    D: Ceguera repentina
  answer: B
  explanation: El manual señala que si usted "comienza a bostezar o se siente mareado
    o con náuseas, es posible que esté experimentando los síntomas de la intoxicación".
    También menciona que los gases son inodoros.
- id: 198
  category: defensive_driving
  question: ¿Por qué NUNCA debe conducir bajo la lluvia o la nieve con el control
    de crucero (cruise control) activado?
  choices:
    A: Agota la batería del vehículo más rápido en climas fríos
    B: Desactiva el sistema de frenos antibloqueo (ABS)
    C: Si su automóvil experimenta hidroplaneo (hydroplanes), acelerará y hará que
      pierda el control
    D: Hace que los limpiaparabrisas funcionen mal
  answer: C
  explanation: El manual advierte que si el control de crucero está activado cuando
    su automóvil comienza a hidroplanear, "su automóvil acelerará a una velocidad
    mayor, lo que le hará perder el control".
- id: 199
  category: sharing_the_road
  question: ¿Por qué debe permitir una distancia de seguimiento mayor, de tres a cuatro
    segundos, detrás de una motocicleta?
  choices:
    A: Los motociclistas suelen reducir la velocidad bajando de marcha, lo que no
      activa la luz de freno
    B: Las motocicletas tienen una distancia de frenado mucho más larga que los automóviles
    C: Las motocicletas se apagan con frecuencia en las intersecciones
    D: Los motociclistas no pueden ver los vehículos que están directamente detrás
      de ellos
  answer: A
  explanation: El manual explica que "los motociclistas a menudo reducen la velocidad
    bajando de marcha o simplemente soltando el acelerador, por lo que no se activa
    la luz de freno", lo que requiere una distancia de seguimiento de 3 a 4 segundos.
- id: 200
  category: sharing_the_road
  question: Debido al tamaño pequeño de una motocicleta, ¿cómo se les aparece a otros
    conductores en la carretera?
  choices:
    A: Parece moverse más lento de lo que realmente va
    B: Parece estar más lejos de lo que realmente está
    C: Parece estar más cerca de lo que realmente está
    D: Parece tener un radio de giro más amplio
  answer: B
  explanation: 'El manual establece: "Debido a su pequeño tamaño, una motocicleta
    puede parecer que está más lejos de lo que realmente está".'
- id: 201
  category: sharing_the_road
  question: ¿Cómo afectan los espejos de una motocicleta la visión que tiene el motociclista
    de su vehículo?
  choices:
    A: Hacen que su vehículo parezca más cercano de lo que realmente está
    B: Crean una imagen ampliada de su vehículo
    C: Dan una imagen más pequeña de usted y hacen que parezca estar más atrás de
      lo que realmente está
    D: Eliminan por completo los puntos ciegos del motociclista
  answer: C
  explanation: Los espejos de las motocicletas suelen ser convexos, lo que "le da
    al ciclista una imagen más pequeña de usted y hace que parezca estar más atrás
    de lo que realmente está".
- id: 202
  category: sharing_the_road
  question: ¿Cómo afecta el llevar a un pasajero el rendimiento de una motocicleta?
  choices:
    A: Aumenta la maniobrabilidad
    B: Disminuye la distancia de frenado
    C: Hace que el equilibrio sea más fácil de mantener
    D: Hace que el equilibrio sea más difícil y aumenta la distancia de frenado
  answer: D
  explanation: El manual establece que al llevar a un pasajero, "el equilibrio es
    más difícil, la distancia de frenado aumenta y la maniobrabilidad se reduce".
- id: 203
  category: safe_driving_rules
  question: Según la ley de Rhode Island, ¿qué operadores de motocicletas están obligados
    a usar un casco certificado?
  choices:
    A: Solo los operadores menores de 18 años
    B: Solo los pasajeros están obligados a usar casco
    C: Los operadores menores de 21 años y los nuevos operadores durante su primer
      año de licencia
    D: Todos los operadores de motocicletas, independientemente de su edad o experiencia
  answer: C
  explanation: La ley de Rhode Island exige que cualquier operador menor de veintiún
    (21) años use un casco certificado en todo momento, y los nuevos operadores, independientemente
    de su edad, deben usar un casco aprobado durante su primer año de licencia.
- id: 204
  category: safe_driving_rules
  question: ¿Cuál es la ley de Rhode Island con respecto a la protección ocular para
    los operadores de motocicletas?
  choices:
    A: Solo se requiere para operadores menores de 21 años.
    B: Se requiere para todos los operadores.
    C: Se recomienda pero no es legalmente obligatorio.
    D: Solo se requiere cuando se conduce de noche.
  answer: B
  explanation: La ley de Rhode Island exige que todos los operadores usen adecuadamente
    protección ocular en forma de anteojos, gafas protectoras o un protector facial.
- id: 205
  category: defensive_driving
  question: En el sistema de conducción defensiva IPDE, ¿qué significa la 'P'?
  choices:
    A: Proteger (Protect)
    B: Posición (Position)
    C: Predecir (Predict)
    D: Prevenir (Prevent)
  answer: C
  explanation: En el sistema IPDE, la 'P' significa Predecir (Predict), lo que significa
    juzgar dónde pueden ocurrir posibles puntos de conflicto.
- id: 206
  category: defensive_driving
  question: Según el sistema de zonas de conducción defensiva, ¿qué es una "zona cerrada"
    (closed zone)?
  choices:
    A: Un espacio en el que se puede conducir sin restricciones.
    B: Un espacio que no está abierto debido a restricciones en su línea de visión
      o en la trayectoria de viaje prevista.
    C: Una zona de estacionamiento donde el estacionamiento está estrictamente prohibido.
    D: Un carril designado solo para camiones grandes y autobuses.
  answer: B
  explanation: Una zona cerrada se define como un espacio que no está abierto debido
    a restricciones en su línea de visión o en la trayectoria de viaje prevista.
- id: 207
  category: defensive_driving
  question: ¿Cuál de los siguientes NO es una de las cinco claves del Sistema Smith
    para una conducción sin colisiones?
  choices:
    A: Dejarse una salida (Leave Yourself an Out)
    B: Mirar lejos hacia adelante al conducir (Aim High In Steering)
    C: Mantener los ojos en movimiento (Keep Your Eyes Moving)
    D: Frenar temprano y con frecuencia (Brake Early and Often)
  answer: D
  explanation: 'Las cinco claves del Sistema Smith son: Dejarse una salida, Mirar
    lejos hacia adelante al conducir, Obtener el panorama general, Mantener los ojos
    en movimiento y Asegurarse de que lo vean. "Frenar temprano y con frecuencia"
    no es una de ellas.'
- id: 208
  category: safe_driving_rules
  question: ¿Cuántos segundos debe utilizar para medir una distancia de seguimiento
    segura en condiciones normales de conducción?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: B
  explanation: El manual recomienda utilizar la "Regla de los tres (3) segundos" para
    mantener una distancia de seguimiento segura en condiciones normales.
- id: 209
  category: safe_driving_rules
  question: Al conducir en condiciones climáticas o de carretera adversas, ¿cómo debe
    ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla igual que en condiciones normales.
    B: Reducirla en un segundo para mantenerse más cerca del vehículo de adelante.
    C: Añadir otro segundo o dos a su distancia de seguimiento.
    D: Duplicar su velocidad para atravesar el mal tiempo más rápido.
  answer: C
  explanation: Al conducir en condiciones climáticas o de carretera adversas, asegúrese
    de añadir otro segundo o dos a su distancia de seguimiento.
- id: 210
  category: safe_driving_rules
  question: ¿Qué se considera una distancia de frenado segura que le brinde la oportunidad
    de detenerse de manera segura sin chocar con un objeto?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Una distancia de frenado segura dentro de los cuatro (4) segundos le
    brinda la oportunidad de detenerse de manera segura sin chocar con una persona,
    vehículo u objeto.
- id: 211
  category: defensive_driving
  question: Si hay peligros a la derecha de su vehículo o tiene la intención de girar
    a la izquierda, ¿qué posición del carril debe utilizar?
  choices:
    A: Posición de carril 1 (centro del carril)
    B: Posición de carril 2 (de 3 a 6 pulgadas de la línea izquierda)
    C: Posición de carril 3 (de 3 a 6 pulgadas de la línea derecha)
    D: Situarse sobre la línea central
  answer: B
  explanation: La posición de carril 2 (de tres a seis pulgadas de la línea izquierda)
    es la posición en la que se debe conducir si existen peligros a la derecha del
    vehículo o si se tiene la intención de girar a la izquierda.
- id: 212
  category: sharing_the_road
  question: ¿A qué distancia debe mantenerse detrás de un camión grande o un semirremolque
    si espera que el conductor lo vea?
  choices:
    A: Al menos 20 pies
    B: Al menos 30 pies
    C: Al menos 40 pies
    D: Al menos 50 pies
  answer: D
  explanation: Debe mantenerse al menos a 50 pies de distancia si espera que el conductor
    de un camión o semirremolque lo vea.
- id: 213
  category: sharing_the_road
  question: ¿Cómo puede saber si tiene suficiente distancia de seguimiento detrás
    de un camión grande?
  choices:
    A: Puede leer claramente la placa de matrícula del camión.
    B: Puede ver los espejos retrovisores laterales del camión que está siguiendo.
    C: Puede ver la parte superior del remolque del camión.
    D: Puede escuchar claramente el motor del camión.
  answer: B
  explanation: Usted sabe que tiene suficiente distancia detrás de un camión o semirremolque
    cuando puede ver los espejos retrovisores laterales del camión que está siguiendo.
- id: 214
  category: sharing_the_road
  question: ¿Qué puede suceder si conduce demasiado cerca del costado de un camión
    grande en carriles estrechos?
  choices:
    A: El escape del camión detendrá su motor.
    B: El flujo de aire entre los dos vehículos puede tender a atraerlos entre sí.
    C: Sus faros cegarán al conductor del camión.
    D: Los neumáticos del camión lanzarán escombros hacia su parabrisas.
  answer: B
  explanation: Si los carriles estrechos lo obligan a conducir cerca de un camión,
    sujete el volante con firmeza porque el flujo de aire entre los dos vehículos
    puede tender a atraerlos entre sí.
- id: 215
  category: safe_driving_rules
  question: La ley de Rhode Island exige que los automovilistas enciendan sus faros
    desde el atardecer hasta el amanecer y siempre que no puedan ver a qué distancia
    hacia adelante?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: La ley exige que los automovilistas enciendan sus faros cuando conduzcan
    desde el atardecer hasta el amanecer, y en cualquier momento en que no puedan
    ver a 500 pies delante de ellos.
- id: 216
  category: safe_driving_rules
  question: Al conducir en condiciones climáticas adversas como nieve, lluvia o niebla,
    ¿qué luces está obligado a usar?
  choices:
    A: Luces altas (faros de largo alcance)
    B: Luces bajas (faros de corto alcance)
    C: Solo luces de estacionamiento
    D: Luces de emergencia (luces intermitentes)
  answer: B
  explanation: La ley exige que use sus luces bajas durante condiciones climáticas
    adversas como nieve, lluvia y niebla, o siempre que haya condiciones que reduzcan
    la visibilidad.
- id: 217
  category: safe_driving_rules
  question: ¿Por qué es obligatorio usar luces bajas en lugar de luces altas durante
    la niebla, la lluvia o la nieve?
  choices:
    A: Las luces altas agotan la batería del vehículo más rápido en climas fríos.
    B: Las luces bajas son más brillantes que las luces altas.
    C: Las luces altas pueden reflejarse en la precipitación y acortar la distancia
      que usted puede ver.
    D: Las luces altas derretirán la nieve en el parabrisas demasiado rápido.
  answer: C
  explanation: En situaciones de mal tiempo, las luces altas pueden reflejarse en
    la nieve, la lluvia o la niebla en el aire y acortar la distancia que usted puede
    ver.
- id: 218
  category: safe_driving_rules
  question: ¿Qué faros debe usar durante condiciones climáticas adversas como nieve,
    lluvia o niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Luces de estacionamiento
    D: Luces de emergencia
  answer: B
  explanation: La ley exige que use sus luces bajas durante condiciones climáticas
    adversas como nieve, lluvia y niebla porque las luces altas pueden reflejarse
    en la precipitación y acortar la distancia que usted puede ver.
- id: 219
  category: vehicle_information
  question: ¿Desde qué distancia debe estar iluminada y ser legible la placa de matrícula
    trasera de su vehículo?
  choices:
    A: 30 pies
    B: 50 pies
    C: 60 pies
    D: 100 pies
  answer: C
  explanation: La placa de matrícula trasera de su vehículo debe estar iluminada para
    que pueda verse y leerse al menos a 60 pies de la parte trasera del vehículo.
- id: 220
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar sus luces altas al acercarse a otro vehículo?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Debe bajar sus luces altas rápidamente a una distancia de al menos
    500 pies hacia adelante cuando se acerque a otro vehículo.
- id: 221
  category: defensive_driving
  question: ¿Qué debe hacer para evitar quedar cegado temporalmente por los faros
    de los vehículos que se aproximan?
  choices:
    A: Mirar directamente a los faros del vehículo que viene en sentido contrario
    B: Encender las luces altas para ver mejor
    C: Mirar hacia el borde derecho de la calzada o la línea de niebla (fog line)
    D: Cerrar los ojos por unos segundos
  answer: C
  explanation: Para evitar quedar cegado temporalmente por los faros que se aproximan,
    mire hacia el borde derecho de la calzada (o la línea de niebla) hasta que las
    luces brillantes hayan pasado y su visión haya vuelto a la normalidad.
- id: 222
  category: sharing_the_road
  question: Si no hay aceras disponibles, ¿por dónde deben caminar los peatones?
  choices:
    A: En el lado derecho de la carretera con el tráfico
    B: En el lado izquierdo de la carretera de frente al tráfico
    C: En el centro de la carretera
    D: Lo más cerca posible de la mediana
  answer: B
  explanation: Si no hay aceras, los peatones deben caminar por el lado izquierdo
    de la carretera de frente al tráfico.
- id: 223
  category: safe_driving_rules
  question: Según el manual, ¿cuál de los siguientes constituye un cruce de peatones
    legal?
  choices:
    A: Solo las intersecciones con líneas blancas pintadas
    B: Cualquier intersección de vías públicas, esté marcada o no
    C: Solo las áreas con señales de cruce de peatones
    D: Cualquier sección de una calle residencial
  answer: B
  explanation: Cualquier intersección de vías públicas constituye un cruce de peatones
    legal, esté marcada o no.
- id: 224
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por no ceder el paso a un peatón ciego o con
    visión reducida?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: D
  explanation: Las multas por no ceder el paso a un peatón ciego o con visión reducida
    pueden resultar en una multa de hasta $1,000.
- id: 225
  category: sharing_the_road
  question: ¿Por qué nunca debe asumir que un peatón ciego espera que usted gire a
    la derecha con el semáforo en rojo?
  choices:
    A: No pueden oír su señal de giro
    B: Utilizan el sonido del tráfico para determinar cuándo es seguro cruzar
    C: Siempre tienen el derecho de paso en los semáforos en rojo
    D: Los giros a la derecha en rojo son ilegales cuando hay peatones presentes
  answer: B
  explanation: Los peatones ciegos o con visión reducida utilizan el sonido del tráfico
    (incluido el de su motor) como guía para determinar cuándo es seguro cruzar una
    calle, por lo que nunca asuma que esperarán que usted gire a la derecha con el
    semáforo en rojo.
- id: 226
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por no detenerse ante un
    autobús escolar con luces rojas intermitentes?
  choices:
    A: Una multa de hasta $100 y hasta 10 días de suspensión de la licencia
    B: Una multa de hasta $300 y/o hasta 30 días de suspensión de la licencia
    C: Una multa de hasta $500 y hasta 60 días de suspensión de la licencia
    D: Una multa de hasta $1,000 y hasta 90 días de suspensión de la licencia
  answer: B
  explanation: Se impondrá una multa de hasta $300 y/o la suspensión de su licencia
    de conducir por un período de hasta treinta (30) días por la primera infracción
    de esta ley.
- id: 227
  category: safe_driving_rules
  question: ¿En qué situación NO se requiere que se detenga ante un autobús escolar
    con luces rojas intermitentes?
  choices:
    A: Cuando el autobús está en un estacionamiento
    B: Cuando el autobús está en un camino privado
    C: Cuando el autobús está en el lado opuesto de su vehículo en una carretera dividida
    D: Cuando viaja en la misma dirección que el autobús
  answer: C
  explanation: Los automovilistas no tienen que detenerse ante las luces rojas intermitentes
    del autobús escolar cuando el autobús se encuentra en el lado opuesto de su vehículo
    en una carretera dividida.
- id: 228
  category: sharing_the_road
  question: ¿Cuál es el número máximo de bicicletas que pueden circular una al lado
    de la otra en la carretera?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: No más de dos (2) bicicletas pueden circular una al lado de la otra.
- id: 229
  category: safe_driving_rules
  question: ¿A qué edad se requiere que una persona use un casco de bicicleta certificado
    cuando circula por una carretera o sendero público?
  choices:
    A: 12 años de edad o menos
    B: 15 años de edad o menos
    C: 18 años de edad o menos
    D: Se requiere el uso de casco para todas las edades
  answer: B
  explanation: Cualquier persona de quince (15) años de edad o menos que conduzca
    una bicicleta o sea pasajero en una bicicleta en una carretera pública, sendero
    para bicicletas u otro derecho de paso público debe usar un casco de bicicleta
    certificado.
- id: 230
  category: signs_and_signals
  question: ¿Cuál es uno de los propósitos de una marca de 'carril compartido' (shared
    lane) en una calzada?
  choices:
    A: Indicar un carril exclusivamente para bicicletas
    B: Advertir a los automovilistas sobre un próximo cruce de peatones
    C: Ayudar a los ciclistas con el posicionamiento lateral para evitar las puertas
      de los vehículos estacionados
    D: Designar un carril para maquinaria agrícola de movimiento lento
  answer: C
  explanation: Las marcas de carril compartido ayudan a los ciclistas con el posicionamiento
    lateral en un carril compartido con estacionamiento paralelo en la calle para
    reducir la posibilidad de que un ciclista golpee la puerta de un vehículo estacionado.
- id: 231
  category: sharing_the_road
  question: ¿Cuánto espacio libre debe dejar al rebasar a un ciclista?
  choices:
    A: De 1 a 2 pies
    B: De 3 a 5 pies
    C: De 6 a 8 pies
    D: Al menos 10 pies
  answer: B
  explanation: Deje tanto espacio libre como sea posible (3-5 pies) al rebasar para
    evitar el contacto con un ciclista y esté preparado para detenerse repentinamente
    si la persona cayera en el carril del conductor.
- id: 232
  category: sharing_the_road
  question: ¿Qué debe hacer si una carretera es demasiado estrecha para que los autos
    y las bicicletas circulen uno al lado del otro y un ciclista que va delante "ocupa
    el carril de circulación"?
  choices:
    A: Toque la bocina repetidamente hasta que se mueva.
    B: Rebáselo inmediatamente por el lado derecho.
    C: Esté preparado para reducir la velocidad o detenerse.
    D: Use las luces altas para advertirle.
  answer: C
  explanation: Cuando una carretera es demasiado estrecha y un ciclista avanza por
    el centro de la vía (ocupa el carril de circulación), usted debe estar preparado
    para reducir la velocidad o detenerse.
- id: 233
  category: sharing_the_road
  question: ¿Bajo qué circunstancias puede conducir en un carril para bicicletas claramente
    marcado?
  choices:
    A: Nunca puede conducir en un carril para bicicletas, pero puede cruzarlo al girar
      o al entrar en una entrada para vehículos.
    B: Puede conducir en un carril para bicicletas si el tráfico es pesado y usted
      se mueve lentamente.
    C: Puede conducir en un carril para bicicletas para rebasar a un vehículo que
      gira a la izquierda.
    D: Puede estacionarse en un carril para bicicletas hasta por 15 minutos.
  answer: A
  explanation: 'El manual establece explícitamente: "No conduzca en un carril para
    bicicletas. Puede cruzar un carril para bicicletas cuando esté girando en una
    esquina o entrando o saliendo de un callejón, camino privado o entrada para vehículos".'
- id: 234
  category: sharing_the_road
  question: ¿Cuál es la definición de "dooring"?
  choices:
    A: Seguir a un ciclista demasiado de cerca.
    B: Abrir descuidadamente la puerta de un vehículo estacionado y chocar con un
      ciclista que pasa.
    C: Obligar a un ciclista a salirse de la carretera hacia un auto estacionado.
    D: Conducir por un vecindario residencial con las puertas abiertas.
  answer: B
  explanation: El "dooring" ocurre cuando el conductor o el pasajero abre descuidadamente
    la puerta de un vehículo estacionado o detenido y choca con un ciclista que pasa.
- id: 235
  category: defensive_driving
  question: ¿Cuál de los siguientes se considera un comportamiento de conducción agresiva
    que ha resultado en violencia en el pasado?
  choices:
    A: Usar las luces altas (high beams) en áreas de tráfico pesado.
    B: Ceder el derecho de paso en intersecciones no controladas.
    C: Dejar suficiente espacio para salir cuando se está detenido en el tráfico.
    D: Tomar descansos en viajes largos.
  answer: A
  explanation: El manual enumera "Usar las luces altas en áreas de tráfico pesado"
    como un comportamiento que puede poner en peligro o enfurecer a otros automovilistas
    y que ha resultado en violencia.
- id: 236
  category: defensive_driving
  question: ¿Qué debe hacer para evitar convertirse en víctima de una conducción agresiva
    si otro conductor continúa acosándolo o siguiéndolo?
  choices:
    A: Detenerse a un lado de la carretera y confrontarlo.
    B: Conducir hasta la estación de policía más cercana o un lugar concurrido para
      obtener ayuda.
    C: Acelerar y desviarse repentinamente para perderlo.
    D: Hacer contacto visual para demostrar que no se siente intimidado.
  answer: B
  explanation: Para evitar convertirse en víctima de una conducción agresiva, si un
    conductor continúa acosándolo o siguiéndolo, conduzca hasta la estación de policía
    más cercana o a un lugar concurrido para obtener ayuda.
- id: 237
  category: safe_driving_rules
  question: ¿Cuál es la regla para girar a la derecha en un semáforo en rojo en Rhode
    Island?
  choices:
    A: Está obligado a girar a la derecha en rojo si no hay una señal publicada.
    B: Puede girar a la derecha en rojo sin detenerse si la intersección está despejada.
    C: Se permite girar a la derecha en rojo después de una parada completa, a menos
      que haya una señal de "no girar en rojo" (no turn on red).
    D: Los giros a la derecha en rojo están estrictamente prohibidos en el estado.
  answer: C
  explanation: A los conductores en Rhode Island se les permite, pero no se les exige,
    girar a la derecha en un semáforo en rojo después de una parada completa, a menos
    que haya una señal de "no girar en rojo" publicada, y deben ceder el paso al tráfico
    y a los peatones.
- id: 238
  category: safe_driving_rules
  question: ¿Los niños menores de qué edad deben ser transportados en un asiento de
    seguridad aprobado por el gobierno federal en el asiento trasero del vehículo?
  choices:
    A: Menores de 5 años
    B: Menores de 7 años
    C: Menores de 9 años
    D: Menores de 12 años
  answer: B
  explanation: Los niños menores de siete (7) años deben ser transportados en un asiento
    de seguridad aprobado por el gobierno federal en el asiento trasero del vehículo.
- id: 239
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima a la que debe comenzar a usar sus señales
    direccionales antes de realizar un giro o cambiar de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Debe comenzar a usar sus señales direccionales a una distancia mínima
    de al menos 100 pies antes de realizar giros o cambiar de carril.
- id: 240
  category: safe_driving_rules
  question: Cuando dos vehículos se aproximan a una intersección no controlada desde
    calles diferentes aproximadamente al mismo tiempo, ¿quién tiene el derecho de
    paso?
  choices:
    A: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    B: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    C: El vehículo que viaja más rápido tiene el derecho de paso.
    D: El vehículo que toca la bocina primero tiene el derecho de paso.
  answer: B
  explanation: En ausencia de señales o semáforos, cuando dos vehículos se aproximan
    a una intersección aproximadamente al mismo tiempo, el conductor del vehículo
    de la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 241
  category: safe_driving_rules
  question: Además de la noche y las condiciones de baja visibilidad, ¿en qué otro
    momento exige la ley de Rhode Island que encienda los faros delanteros?
  choices:
    A: Solo cuando se conduce por la autopista interestatal.
    B: En cualquier momento en que los limpiaparabrisas del vehículo estén encendidos.
    C: Solo cuando se conduce por una zona escolar.
    D: En cualquier momento en que se conduzca un vehículo comercial.
  answer: B
  explanation: El manual establece que los faros delanteros deben estar encendidos
    siempre que los limpiaparabrisas estén en funcionamiento.
- id: 242
  category: penalties_and_points
  question: ¿Cuál es la multa por no llevar el comprobante de seguro de responsabilidad
    civil para vehículos motorizados en su vehículo?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: El comprobante de seguro (multa de $500 por incumplimiento) debe llevarse
    en el vehículo junto con el registro en todo momento.
- id: 243
  category: sharing_the_road
  question: ¿Qué le exige la ley que haga al acercarse a un caballo que es conducido
    o montado en una vía pública?
  choices:
    A: Tocar la bocina para alertar al jinete de su presencia.
    B: Mantener su velocidad pero moverse al lado opuesto de la carretera.
    C: Reducir su velocidad y abstenerse de tocar la bocina.
    D: Usar las luces altas para advertir al caballo.
  answer: C
  explanation: La ley le exige reducir su velocidad y abstenerse de tocar la bocina
    o causar otros ruidos fuertes al acercarse a un caballo que es conducido o montado
    en una vía pública.
- id: 244
  category: safe_driving_rules
  question: ¿Cuál es la ley de Rhode Island con respecto al uso de auriculares o cascos
    mientras se conduce?
  choices:
    A: Se permiten solo si se escuchan las indicaciones del GPS.
    B: Se permiten si se usan solo en un oído.
    C: Se permiten en autopistas pero no dentro de los límites de la ciudad.
    D: No se permite a los conductores operar un vehículo motorizado en una vía pública
      mientras los usan.
  answer: D
  explanation: Los conductores en Rhode Island no tienen permitido operar un vehículo
    motorizado en una vía pública mientras usan auriculares o cascos.
- id: 245
  category: driver_responsibility
  question: Si un oficial de la ley lo detiene por la noche, ¿qué se le exige hacer
    con respecto a la iluminación de su vehículo?
  choices:
    A: Apagar todas las luces para evitar cegar al oficial.
    B: Encender las luces interiores del vehículo y dejarlas encendidas.
    C: Usar las luces altas para reconocer al oficial.
    D: Encender las luces de emergencia y apagar los faros delanteros.
  answer: B
  explanation: Si un oficial de la ley detiene a un automovilista por la noche, este
    debe encender las luces interiores del vehículo y dejarlas encendidas hasta que
    el oficial le permita retirarse.
- id: 246
  category: driver_responsibility
  question: ¿Qué debe hacer un automovilista si es detenido por un oficial de la ley
    por la noche?
  choices:
    A: Apagar el motor y salir del vehículo inmediatamente.
    B: Encender las luces interiores del vehículo y dejarlas encendidas.
    C: Usar las luces altas para reconocer al oficial.
    D: Apagar todas las luces para evitar cegar al oficial.
  answer: B
  explanation: Según el manual, si un oficial de la ley detiene a un automovilista
    por la noche, este debe encender las luces interiores del vehículo y dejarlas
    encendidas hasta que el oficial le permita retirarse.
- id: 247
  category: penalties_and_points
  question: ¿Cuál es la multa por una infracción del cinturón de seguridad o del sistema
    de retención infantil?
  choices:
    A: $50.00
    B: $75.00
    C: $85.00
    D: $195.00
  answer: C
  explanation: El programa de multas establece que una infracción del cinturón de
    seguridad o del sistema de retención infantil conlleva una multa de $85.00.
- id: 248
  category: alcohol_drugs_health
  question: Si bebe aunque sea un poco de alcohol, ¿cuántas veces más aumentan sus
    probabilidades de sufrir una colisión en comparación con si no bebe?
  choices:
    A: Dos veces más
    B: Cuatro veces más
    C: Siete veces más
    D: Diez veces más
  answer: C
  explanation: 'El manual establece: "Si bebe, aunque sea un poco, sus probabilidades
    de sufrir una colisión son siete (7) veces mayores que si no bebe".'
- id: 249
  category: alcohol_drugs_health
  question: Al llegar al cerebro, ¿qué es lo primero que afecta el alcohol?
  choices:
    A: La visión y la audición
    B: El control del juicio y la habilidad
    C: El ritmo cardíaco y la respiración
    D: La memoria muscular y la digestión
  answer: B
  explanation: El manual explica que el alcohol llega al cerebro en segundos y, al
    llegar, afecta primero el control del juicio y la habilidad.
- id: 250
  category: alcohol_drugs_health
  question: ¿Qué es lo único que reducirá los efectos del alcohol y le ayudará a recuperar
    la sobriedad?
  choices:
    A: Beber café solo (negro)
    B: Comer una comida pesada
    C: Tomar aire fresco y hacer ejercicio
    D: El tiempo
  answer: D
  explanation: 'El manual establece: "Después de beber, no hay nada que reduzca los
    efectos del alcohol excepto el tiempo. El café, la comida, el aire fresco o el
    ejercicio pueden despertar a una persona intoxicada, pero no le devolverán la
    sobriedad".'
- id: 251
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes contiene aproximadamente la misma cantidad de
    alcohol que un envase de cerveza de 12 onzas?
  choices:
    A: Una copa de vino de 4 a 5 onzas
    B: Una cerveza de 24 onzas (tallboy)
    C: Un trago (shot) de licor fuerte de 3 onzas
    D: Media botella de vino
  answer: A
  explanation: Un envase de cerveza de 12 onzas, una copa de vino de 4 a 5 onzas y
    un trago (shot) de licor fuerte de 1 a 1 1/2 onzas tienen aproximadamente la misma
    cantidad de alcohol.
- id: 252
  category: alcohol_drugs_health
  question: ¿Qué sucede cuando se combina el alcohol con otra droga, como un remedio
    para la alergia o el resfriado?
  choices:
    A: El alcohol anula los efectos de la droga.
    B: Provoca un efecto sinérgico (aditivo) donde los efectos se multiplican.
    C: El cuerpo procesa el alcohol el doble de rápido.
    D: Mejora su estado de alerta y su capacidad de conducción.
  answer: B
  explanation: Combinar alcohol con otra droga puede causar un efecto sinérgico (aditivo),
    por el cual los efectos se multiplican, representando un grave peligro para su
    salud y su capacidad de conducción.
- id: 253
  category: alcohol_drugs_health
  question: En Rhode Island, ¿a partir de qué nivel se considera que una persona de
    cualquier edad está legalmente intoxicada y será acusada de Conducir Bajo la Influencia
    (DUI) si su Concentración de Alcohol en Sangre (BAC) es igual o superior a?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: 'Cualquier persona de cualquier edad con un BAC de .08% o más está
    intoxicada y será acusada de conducir ebria: Conducir Bajo la Influencia (DUI).'
- id: 254
  category: alcohol_drugs_health
  question: 'Un conductor menor de 21 años será acusado de Conducir con Facultades
    Disminuidas (DWI) si su Concentración de Alcohol en Sangre (BAC) es:'
  choices:
    A: 0.00% a 0.01%
    B: 0.02% pero menos de 0.08%
    C: 0.08% o superior
    D: 0.10% o superior
  answer: B
  explanation: Cualquier persona menor de veintiún (21) años con un BAC de .02% pero
    menos de .08% tiene sus facultades disminuidas y será acusada de Conducir con
    Facultades Disminuidas (DWI).
- id: 255
  category: license_system
  question: ¿Qué significa la ley de Consentimiento Implícito para los conductores
    en Rhode Island?
  choices:
    A: Usted consiente que se registre su vehículo en cualquier parada de tráfico.
    B: Usted consiente someterse a una prueba química de sangre, aliento u orina si
      es arrestado por sospecha de DWI.
    C: Usted consiente pagar todas las multas de tráfico en un plazo de 30 días.
    D: Usted consiente la donación de órganos si se ve involucrado en un accidente
      fatal.
  answer: B
  explanation: El consentimiento implícito significa que cualquier persona que conduzca
    un vehículo motorizado en Rhode Island ha dado su consentimiento para una prueba
    química (alcoholímetro-sangre-orina) para determinar la cantidad de alcohol/droga
    en su sangre si es arrestado por sospecha de DWI.
- id: 256
  category: penalties_and_points
  question: ¿Cuál es el periodo mínimo de suspensión de la licencia si se niega a
    realizarse una prueba química (alcoholímetro) en Rhode Island?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Si se niega a realizarse una prueba química, su licencia será suspendida
    por un mínimo de seis meses.
- id: 257
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por conducir a 11 mph por encima del límite de
    velocidad señalizado?
  choices:
    A: $75.00
    B: $85.00
    C: $150.00
    D: $195.00
  answer: D
  explanation: El programa de multas indica que el exceso de velocidad de 11 mph por
    encima del límite señalizado, con una multa de $10.00 por cada milla de exceso,
    tiene una multa mínima de $195.00.
- id: 258
  category: alcohol_drugs_health
  question: Según los estudios, ¿cómo afecta el consumo de marihuana a un conductor?
  choices:
    A: Mejora su capacidad para adaptarse al deslumbramiento de los faros.
    B: Hace que conduzcan más rápido y de forma más agresiva.
    C: Cometen más errores y tienen más dificultades para adaptarse al deslumbramiento
      de los faros.
    D: Aumenta su estado de alerta y su tiempo de reacción.
  answer: C
  explanation: Los estudios han demostrado que las personas que conducen después de
    fumar marihuana cometen más errores, son arrestadas más por infracciones de tráfico
    y tienen más dificultades para adaptarse al deslumbramiento de los faros.
- id: 259
  category: penalties_and_points
  question: Para un conductor menor de 18 años, ¿cuál es el periodo de suspensión
    de la licencia por una primera infracción de Conducir con Facultades Disminuidas
    (DWI) con un BAC de 0.02% - 0.08%?
  choices:
    A: 1 a 3 meses
    B: 3 a 6 meses
    C: 6 a 12 meses
    D: Suspensión de la licencia hasta los 21 años
  answer: C
  explanation: La sección de sanciones establece que para un conductor menor de 18
    años, una primera infracción de Conducir con Facultades Disminuidas (DWI) con
    un BAC de 0.02% - 0.08% resulta en una suspensión de la licencia de 6 a 12 meses.
- id: 260
  category: alcohol_drugs_health
  question: ¿Es legal que un conductor de 21 años o más consuma una bebida alcohólica
    mientras conduce?
  choices:
    A: Sí, siempre que su BAC se mantenga por debajo del 0.08%.
    B: Sí, si conduce por un camino privado.
    C: No, es contra la ley que un conductor de cualquier edad consuma una bebida
      alcohólica mientras conduce.
    D: No, a menos que esté acompañado por un pasajero con licencia.
  answer: C
  explanation: 'El manual establece explícitamente: ''ES CONTRA LA LEY QUE UN CONDUCTOR
    DE CUALQUIER EDAD CONSUMA UNA BEBIDA ALCOHÓLICA MIENTRAS CONDUCE''.'
- id: 261
  category: penalties_and_points
  question: ¿Cuál es la clasificación de una tercera o subsiguiente infracción por
    DUI (BAC 0.08% - 0.15%) dentro de un período de 5 años?
  choices:
    A: Delito menor (Misdemeanor)
    B: Delito grave (Felony)
    C: Infracción civil
    D: Infracción de tráfico
  answer: B
  explanation: Una tercera o subsiguiente infracción por DUI (BAC 0.08% - 0.15% o
    desconocido) dentro de un período de 5 años se clasifica como un Delito grave
    (Felony).
- id: 262
  category: penalties_and_points
  question: Si un conductor adulto comete una primera infracción por rechazo a la
    prueba química (Chemical Test Refusal), ¿cuál es el período obligatorio de suspensión
    de la licencia?
  choices:
    A: 30 a 90 días
    B: 3 a 6 meses
    C: 6 meses a 1 año
    D: 1 a 2 años
  answer: C
  explanation: Una primera infracción por rechazo a la prueba química (Chemical Test
    Refusal) para adultos resulta en una suspensión de la licencia de 6 meses a 1
    año.
- id: 263
  category: penalties_and_points
  question: ¿Qué sucede con el vehículo de un conductor tras una tercera o subsiguiente
    infracción por DUI dentro de un período de 5 años?
  choices:
    A: Es retenido por 30 días.
    B: Es confiscado por el estado.
    C: Es remolcado a expensas del propietario.
    D: Debe venderse dentro de los 90 días.
  answer: B
  explanation: Para una tercera o subsiguiente infracción por DUI dentro de un período
    de 5 años, las sanciones incluyen la 'Confiscación del vehículo por parte del
    estado'.
- id: 264
  category: alcohol_drugs_health
  question: ¿Bajo qué condición puede una persona de entre 16 y 21 años transportar
    legalmente bebidas alcohólicas cerradas en un vehículo sin un padre o tutor legal?
  choices:
    A: Si se dirige a una fiesta privada.
    B: Si transporta las bebidas en el curso de su empleo.
    C: Si las bebidas se guardan en el maletero del vehículo.
    D: Si tiene permiso por escrito de un padre.
  answer: B
  explanation: La ley R.I.G.L. 3-8-9 establece que la restricción de transporte no
    se aplica a personas de entre 16 y 21 años que transporten bebidas alcohólicas
    cerradas en el curso de su empleo.
- id: 265
  category: safe_driving_rules
  question: ¿Qué debe hacer si se ve involucrado en una colisión menor?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía.
    B: Conducir su vehículo hacia un lado de la carretera si es posible y notificar
      a la policía.
    C: Intercambiar información del seguro e irse sin notificar a la policía.
    D: Esperar a que el otro conductor reporte la colisión.
  answer: B
  explanation: 'El manual establece: ''En caso de una colisión menor, si es posible,
    conduzca su vehículo hacia un lado de la carretera y notifique a la policía''.'
- id: 266
  category: safe_driving_rules
  question: Si choca con un vehículo estacionado desatendido, ¿qué está obligado a
    hacer?
  choices:
    A: Esperar junto al vehículo hasta que regrese el dueño.
    B: Dejar su nombre y dirección por escrito bien sujetos al vehículo y reportarlo
      a la policía.
    C: Tomar una fotografía de los daños e irse de la escena.
    D: Solo reportar la colisión a su compañía de seguros.
  answer: B
  explanation: Si choca con un vehículo estacionado, debe dejar su nombre y dirección
    por escrito bien sujetos al vehículo y reportar la colisión a la policía estatal
    o local más cercana de inmediato.
- id: 267
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes circunstancias se requiere explícitamente
    un informe policial después de una colisión?
  choices:
    A: Cuando los daños a la propiedad superan los $500.
    B: Cuando los daños a la propiedad superan los $1,000.
    C: Solo cuando alguien resulta herido.
    D: Solo cuando ambos vehículos están gravemente dañados.
  answer: B
  explanation: Se requiere un informe policial si alguien resulta herido, si los daños
    a la propiedad superan los $1,000 o si choca contra un vehículo desatendido.
- id: 268
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de conducir bajo los efectos
    del alcohol o drogas (DUI) con resultado de muerte?
  choices:
    A: 1 a 5 años de prisión y una revocación de la licencia por 2 años
    B: 5 a 15 años de prisión y una revocación de la licencia por 5 años
    C: Hasta 1 año de prisión y una suspensión de la licencia por 1 año
    D: 10 a 20 años de prisión y una revocación de la licencia de por vida
  answer: B
  explanation: Una primera infracción por DUI con resultado de muerte es un Delito
    grave (Felony) que conlleva de 5 a 15 años de prisión, una revocación de la licencia
    por 5 años, una multa de $5,000 a $10,000 y tratamiento por alcohol/drogas.
- id: 269
  category: defensive_driving
  question: ¿Cuál de las siguientes opciones figura en el manual como una causa común
    de colisiones?
  choices:
    A: Conducir con las luces interiores encendidas
    B: Conducir demasiado cerca del vehículo que tiene delante (seguir de cerca)
    C: Usar la radio mientras conduce
    D: Conducir por debajo del límite de velocidad indicado
  answer: B
  explanation: El manual enumera 'Conducir demasiado cerca del vehículo que tiene
    delante (seguir de cerca)' como una de las causas más comunes de colisiones de
    vehículos motorizados.
- id: 270
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de suspensión de la licencia de conducir para
    una persona menor de edad (menor de 21 años) que sea encontrada en posesión de
    una bebida alcohólica?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: B
  explanation: Según la ley R.I.G.L. 3-8-10, cualquier persona menor de 21 años en
    posesión de una bebida alcohólica estará sujeta a una suspensión mínima de sesenta
    (60) días de su licencia de conducir.
- id: 271
  category: penalties_and_points
  question: 'Abandonar la escena de una colisión sin identificarse adecuadamente se
    conoce comúnmente como:'
  choices:
    A: Conducción temeraria
    B: Chocar y huir (Hit and run)
    C: Evadir a la policía
    D: Conducción agresiva
  answer: B
  explanation: 'El manual establece: ''Se imponen sanciones severas a los conductores
    que deciden abandonar la escena de una colisión (“hit and run”) sin identificarse
    adecuadamente''.'
- id: 272
  category: safe_driving_rules
  question: Al registrar información después de una colisión, ¿cuál de los siguientes
    detalles debe anotar sobre el otro conductor?
  choices:
    A: El nombre y número de teléfono de su empleador
    B: Su nombre, dirección, licencia, compañía de seguros y registro
    C: Su número de seguro social y fecha de nacimiento
    D: El historial de mantenimiento de su vehículo
  answer: B
  explanation: El manual aconseja registrar 'El nombre, dirección, licencia, compañía
    de seguros y número de póliza, y el estado y número de registro del otro conductor'.
- id: 273
  category: safe_driving_rules
  question: Cuando un oficial de policía le ordena detenerse, ¿cuál es el procedimiento
    adecuado con respecto a sus documentos?
  choices:
    A: Entregarle al oficial su billetera para que él retire la licencia.
    B: Tenerlos listos en la mano antes de detenerse por completo.
    C: Esperar a que el oficial le pida su licencia, registro y tarjeta de seguro,
      y sacarlos de cualquier portadocumentos.
    D: Salir del vehículo para entregar los documentos al oficial.
  answer: C
  explanation: 'El manual aconseja: ''Espere a que él/ella le pida su licencia, registro
    y tarjeta de seguro... No le entregue al oficial su licencia u otros documentos
    en un portadocumentos. Sáquelos''.'
- id: 274
  category: penalties_and_points
  question: Si un oficial de policía le pide que firme una citación de tráfico, ¿qué
    significa su firma?
  choices:
    A: Es una admisión de culpabilidad.
    B: Es una renuncia a su derecho a una audiencia judicial.
    C: Es únicamente un reconocimiento de que ha recibido la citación.
    D: Significa que acepta pagar la multa de inmediato.
  answer: C
  explanation: 'Según el manual: ''Si se le pide que firme una citación, hágalo. No
    es una admisión de culpabilidad, sino únicamente un reconocimiento de que ha recibido
    la citación''.'
- id: 275
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    permitida en Rhode Island?
  choices:
    A: 1/16 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: C
  explanation: 'El manual establece: ''No puede conducir con un neumático que tenga
    menos de 3/32 de pulgada de banda de rodadura (mida la profundidad de la banda
    de rodadura con una moneda de un centavo)''.'
- id: 276
  category: vehicle_information
  question: ¿Cuándo es el mejor momento para medir la presión de los neumáticos para
    obtener una lectura precisa?
  choices:
    A: Inmediatamente después de conducir por la autopista
    B: Mientras el neumático está frío
    C: Durante la parte más calurosa del día
    D: Mientras el motor está en marcha
  answer: B
  explanation: 'El manual aconseja: ''Mida la presión de los neumáticos mientras el
    neumático está frío para obtener una lectura precisa''.'
- id: 277
  category: vehicle_information
  question: 'Según el manual, los cinturones de regazo y de hombro trabajando juntos
    reducen el riesgo de muerte y lesiones graves en casi un:'
  choices:
    A: 25%
    B: 50%
    C: 75%
    D: 90%
  answer: B
  explanation: 'El manual establece: ''Los cinturones de regazo y de hombro trabajando
    juntos reducen el riesgo de muerte y lesiones graves en casi un 50%''.'
- id: 278
  category: driver_responsibility
  question: Si es menor de 18 años y desea ser donante de órganos y tejidos, ¿qué
    se requiere?
  choices:
    A: Un examen médico especial
    B: Una tarifa pagada al DMV
    C: Consentimiento de los padres
    D: Una orden judicial
  answer: C
  explanation: 'El manual señala con respecto a la donación de órganos: ''Si es menor
    de 18 años, necesita el consentimiento de los padres''.'
- id: 279
  category: driver_responsibility
  question: ¿Cómo afecta la firma de una tarjeta de donante de órganos a la calidad
    de la atención médica que recibe si resulta herido?
  choices:
    A: Los médicos priorizarán la preservación de órganos sobre salvar su vida.
    B: No afectará la calidad de la atención médica que reciba; la primera prioridad
      es salvar su vida.
    C: Será trasladado a un hospital especializado en trasplantes de inmediato.
    D: Recibirá tratamientos experimentales primero.
  answer: B
  explanation: 'El manual establece: ''Firmar una tarjeta de donante o tener una designación
    de donante en su licencia no afectará la calidad de la atención médica que reciba.
    Si está enfermo o herido... la primera prioridad de cualquier proveedor de atención
    médica es salvar su vida''.'
- id: 280
  category: driver_testing
  question: ¿Bajo qué condición está un vehículo exento de necesitar una calcomanía
    de inspección válida para el examen de conducción?
  choices:
    A: Si el vehículo es un auto de alquiler
    B: Si el vehículo tiene menos de dos (2) años o tiene menos de 24,000 millas
    C: Si el vehículo está registrado fuera del estado
    D: Si el vehículo tiene una placa de registro temporal
  answer: B
  explanation: 'El manual establece una excepción para el requisito de la calcomanía
    de inspección: ''Excepción: Los vehículos de menos de dos (2) años o con menos
    de 24,000 millas no están obligados a tener una calcomanía de inspección''.'
- id: 281
  category: driver_responsibility
  question: 'El Manual del Conductor de Rhode Island establece que conducir un vehículo
    motorizado es:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio y no un derecho
    C: Un requisito para todos los ciudadanos mayores de 18 años
    D: Un derecho otorgado al aprobar el examen escrito
  answer: B
  explanation: 'La Sección XVI del manual establece: ''Conducir un vehículo motorizado
    es un privilegio y no un derecho''.'
- id: 282
  category: penalties_and_points
  question: ¿Cuál es la multa por una violación de la ley de parabrisas y ventanas
    no transparentes (polarizado ilegal de ventanas)?
  choices:
    A: $100.00
    B: $150.00
    C: $250.00
    D: $500.00
  answer: C
  explanation: 'Según R.I.G.L. 31-23.3-2 en el manual: ''La multa por una violación
    de esta ley es de $250.00''.'
- id: 283
  category: vehicle_information
  question: 'Rhode Island sigue los Estándares Federales de Seguridad de Vehículos
    Motorizados para el polarizado de ventanas, que requieren una transmitancia total
    de luz visible no menor al:'
  choices:
    A: 30%
    B: 50%
    C: 70%
    D: 85%
  answer: C
  explanation: 'El manual establece: ''Rhode Island sigue los Estándares Federales
    de Seguridad de Vehículos Motorizados de una transmitancia total de luz visible
    no menor al setenta por ciento (70%)''.'
- id: 284
  category: vehicle_information
  question: 'Si escucha ruidos al girar el volante, puede ser una indicación de que:'
  choices:
    A: Sus pastillas de freno están desgastadas.
    B: Necesita líquido para la dirección asistida.
    C: Sus neumáticos están demasiado inflados.
    D: Sus bolsas de aire están funcionando mal.
  answer: B
  explanation: 'El manual establece en la sección de Dirección: ''Si se producen ruidos
    al girar el volante, puede ser una indicación de que necesita líquido para la
    dirección asistida''.'
- id: 285
  category: vehicle_information
  question: ¿Cuál es la transmitancia total mínima de luz visible requerida para las
    ventanas de los vehículos según la ley de Rhode Island?
  choices:
    A: 50%
    B: 60%
    C: 70%
    D: 80%
  answer: C
  explanation: Rhode Island sigue los Estándares Federales de Seguridad de Vehículos
    Motorizados de una transmitancia total de luz visible no menor al setenta por
    ciento (70%).
- id: 286
  category: vehicle_information
  question: ¿Por cuántas pulgadas es legalmente permisible elevar o bajar el chasis
    o la carrocería de un vehículo con respecto a la altura especificada por el fabricante?
  choices:
    A: No más de 2 pulgadas
    B: No más de 4 pulgadas
    C: No más de 6 pulgadas
    D: No más de 8 pulgadas
  answer: B
  explanation: Ninguna persona alterará la altura de un vehículo motorizado elevando
    o bajando el chasis o la carrocería en más de cuatro pulgadas (4") con respecto
    a la altura original especificada por el fabricante.
- id: 287
  category: vehicle_information
  question: ¿Cuál es el límite máximo de ruido permitido para un vehículo motorizado
    en una zona de velocidad de 35 mph o menos?
  choices:
    A: 76 dbA
    B: 86 dbA
    C: 90 dbA
    D: 96 dbA
  answer: B
  explanation: En zonas de velocidad de treinta y cinco millas por hora (35 mph) o
    menos, el límite de ruido no es superior a ochenta y seis (86) dbA.
- id: 288
  category: safe_driving_rules
  question: Cuando un oficial de la ley le indique que se detenga a un lado, ¿qué
    luces debe usar después de salir de la carretera?
  choices:
    A: Luces altas
    B: Solo la luz interior del techo
    C: Su luz de giro y luego encienda sus luces de emergencia
    D: Solo luces de estacionamiento
  answer: C
  explanation: Al detenerse a un lado, debe usar su luz de giro y luego encender sus
    luces de emergencia.
- id: 289
  category: safe_driving_rules
  question: ¿Qué debe hacer con respecto a su cinturón de seguridad cuando un oficial
    de la ley lo detiene?
  choices:
    A: Desabrocharlo inmediatamente para poder alcanzar su registro.
    B: Mantenerlo abrochado hasta que el oficial lo haya visto usándolo.
    C: Desabrocharlo solo si se le pide que salga del vehículo.
    D: Quitárselo para mostrarle al oficial que está relajado.
  answer: B
  explanation: Debe mantener su cinturón de seguridad abrochado hasta que el oficial
    lo haya visto usándolo.
- id: 290
  category: safe_driving_rules
  question: Si un oficial de la ley lo detiene cuando está oscuro, ¿qué debe hacer
    para ayudar al oficial a ver el interior de su vehículo?
  choices:
    A: Encender las luces altas.
    B: Encender solo las luces de emergencia.
    C: Encender las luces interiores.
    D: Bajar todas las ventanas hasta la mitad.
  answer: C
  explanation: Encienda las luces interiores si la detención ocurre cuando está oscuro
    para que el oficial pueda verlo fácilmente y ver que todo está en orden.
- id: 291
  category: safe_driving_rules
  question: ¿Dónde deben mantener las manos usted y sus pasajeros durante una parada
    de tráfico?
  choices:
    A: En sus bolsillos.
    B: Fuera de las ventanas.
    C: Buscando algo en la guantera.
    D: A la vista, como en el volante o en el regazo.
  answer: D
  explanation: Mantenga sus manos a la vista, preferiblemente sobre el volante. Pida
    a sus pasajeros que coloquen sus manos a la vista, por ejemplo, sobre sus regazos.
- id: 292
  category: safe_driving_rules
  question: ¿Cuándo es el momento adecuado para buscar su identificación en la guantera
    o consola durante una parada de tráfico?
  choices:
    A: Tan pronto como se detenga, antes de que el oficial se acerque.
    B: Mientras el oficial camina hacia su vehículo.
    C: Espere a que el oficial solicite su identificación y luego proceda a buscarla.
    D: Solo después de haber salido del vehículo.
  answer: C
  explanation: No intente alcanzar inmediatamente la guantera, la consola o el asiento
    trasero. Espere a que el oficial solicite su identificación y luego muévase para
    obtenerla.
- id: 293
  category: driver_responsibility
  question: ¿Qué significa cuando firma una citación de tráfico emitida por un oficial
    de la ley?
  choices:
    A: Está admitiendo su culpabilidad por la infracción.
    B: Está aceptando pagar la multa de inmediato.
    C: Está renunciando a su derecho a una audiencia judicial.
    D: Solo está reconociendo que recibió la citación.
  answer: D
  explanation: Si recibe una citación, se le pedirá que la firme. Esto no es una admisión
    de culpabilidad. Solo significa que usted recibió la citación.
- id: 294
  category: signs_and_signals
  question: ¿De qué color y forma suelen ser las señales de construcción?
  choices:
    A: Amarillas y circulares
    B: Naranjas y con forma de diamante o rectangulares
    C: Rojas y octogonales
    D: Blancas y rectangulares
  answer: B
  explanation: Las señales de construcción son de color naranja, tienen forma de diamante
    o rectangular, y se colocan antes, dentro y después de las zonas de obras.
- id: 295
  category: penalties_and_points
  question: ¿Cómo se ven afectadas las multas si recibe una infracción por exceso
    de velocidad dentro de una zona de obras de construcción designada?
  choices:
    A: Las multas se reducen a la mitad.
    B: Las multas se duplican solo durante las horas de trabajo activas.
    C: Las multas se duplican las veinticuatro (24) horas del día.
    D: Las multas siguen siendo las mismas pero los puntos se duplican.
  answer: C
  explanation: Las multas se duplican para las infracciones por exceso de velocidad
    emitidas dentro de estas áreas designadas las veinticuatro (24) horas del día.
- id: 296
  category: defensive_driving
  question: ¿Cuáles son dos de las causas más comunes de choques en zonas de obras?
  choices:
    A: Velocidad y falta de atención
    B: Mala visibilidad y mal tiempo
    C: Fallas del vehículo y escombros en la vía
    D: Conducir ebrio y fatiga
  answer: A
  explanation: La velocidad y la falta de atención son dos (2) de las causas más comunes
    de choques en zonas de obras.
- id: 297
  category: defensive_driving
  question: ¿Por qué es importante no seguir de cerca (tailgate) en una zona de obras
    de construcción?
  choices:
    A: Bloquea la vista de los trabajadores de la construcción.
    B: La mayoría de los choques en zonas de obras son colisiones por alcance (traseras).
    C: Evita que los vehículos de construcción entren en la calzada.
    D: Hace que el polvo y los escombros golpeen su parabrisas.
  answer: B
  explanation: No siga de cerca a otros vehículos; la mayoría de los choques en zonas
    de obras son colisiones por alcance (traseras).
- id: 298
  category: defensive_driving
  question: ¿Cuál es el tipo de choque más común en una zona de obras en la carretera?
  choices:
    A: Colisiones frontales
    B: Colisiones por alcance (traseras)
    C: Raspaduras laterales (sideswipes)
    D: Vuelcos
  answer: B
  explanation: 'El manual establece: "No siga de cerca; la mayoría de los choques
    en zonas de obras son colisiones por alcance".'
- id: 299
  category: safe_driving_rules
  question: Al acercarse a una zona de obras que requiere una fusión de carriles,
    ¿qué debe hacer un automovilista?
  choices:
    A: Esperar hasta el último minuto para fusionarse
    B: Fusionarse lo antes posible
    C: Acelerar para pasar la zona de obras rápidamente
    D: Detenerse por completo antes de fusionarse
  answer: B
  explanation: 'El manual aconseja: "Fusiónese lo antes posible; los automovilistas
    pueden ayudar a mantener el flujo de tráfico moviéndose al carril apropiado al
    primer aviso".'
- id: 300
  category: signs_and_signals
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los banderilleros
    (flaggers) en una zona de obras?
  choices:
    A: Sus instrucciones son solo sugerencias.
    B: Tienen la autoridad legal para controlar el tráfico.
    C: Solo pueden dirigir vehículos comerciales.
    D: Deben estar acompañados por un oficial de policía para dirigir el tráfico.
  answer: B
  explanation: Según el manual, "Los banderilleros tienen la autoridad legal para
    controlar el tráfico".
- id: 301
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir de Rhode Island si
    el conductor tiene 68 años o más?
  choices:
    A: 1 año
    B: 2 años
    C: 4 años
    D: 5 años
  answer: B
  explanation: 'El manual establece: "Si usted tiene 68 años o más, su licencia solo
    será válida por dos (2) años".'
- id: 302
  category: license_system
  question: Cuando renueva su licencia de conducir en el DMV, se le expedirá una licencia
    temporal que es válida por ¿cuántos días?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: 'El manual señala: "Cuando renueve su licencia en el DMV, se le expedirá
    una licencia temporal válida por sesenta (60) días".'
- id: 303
  category: license_system
  question: ¿Qué documento específico debe traer para fines de verificación al renovar
    su licencia de conducir en persona?
  choices:
    A: Su certificado de nacimiento
    B: Su tarjeta de Seguro Social
    C: Su pasaporte
    D: El registro de su vehículo
  answer: B
  explanation: 'Al renovar su licencia, el manual especifica: "También debe traer
    su tarjeta de Seguro Social para fines de verificación".'
- id: 304
  category: license_system
  question: ¿Qué debe hacer primero antes de cambiar su nombre en su licencia de conducir
    de Rhode Island?
  choices:
    A: Cambiar su nombre ante la Administración del Seguro Social
    B: Actualizar el registro de su vehículo
    C: Notificar a su compañía de seguros
    D: Solicitar un nuevo certificado de nacimiento
  answer: A
  explanation: 'El manual establece: "Para cambiar su nombre en su licencia de Rhode
    Island, se requiere que primero cambie su nombre ante la Administración del Seguro
    Social".'
- id: 305
  category: license_system
  question: ¿Cuál es el cargo por cambiar cualquier información, como su nombre, en
    una licencia de conducir de Rhode Island?
  choices:
    A: $5.00
    B: $7.50
    C: $10.00
    D: $27.50
  answer: B
  explanation: Según el manual, "El cargo por cambiar cualquier información en una
    licencia es de $7.50".
- id: 306
  category: license_system
  question: ¿Cuál es el cargo para obtener una nueva copia de una licencia de conducir
    de Rhode Island perdida o dañada?
  choices:
    A: $7.50
    B: $10.00
    C: $24.50
    D: $27.50
  answer: D
  explanation: 'Para licencias perdidas o dañadas, el manual establece: "El cargo
    es de $27.50".'
- id: 307
  category: license_system
  question: Al solicitar una licencia de conducir, ¿cuál es el número mínimo de documentos
    separados que debe presentar para cumplir con los requisitos de Identidad, Firma
    y Residencia?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: 'El manual especifica: "Se deben presentar al menos dos (2) documentos
    separados" para cumplir con los requisitos de Identidad, Firma y Residencia.'
- id: 308
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los documentos
    utilizados como prueba de identificación en el DMV?
  choices:
    A: Se aceptan fotocopias si están notarizadas.
    B: Se permiten copias digitales en un teléfono inteligente.
    C: No se aceptarán fotocopias.
    D: Se aceptan fotocopias solo para la prueba de residencia.
  answer: C
  explanation: 'El manual establece explícitamente: "No se aceptarán fotocopias como
    prueba de identificación".'
- id: 309
  category: license_system
  question: ¿Qué tipo de certificado de nacimiento NO es aceptable como documento
    de identidad en el DMV?
  choices:
    A: Un certificado original con sello
    B: Una copia certificada de la Oficina de Estadísticas Vitales
    C: Un certificado emitido por un hospital
    D: Un certificado emitido por una agencia gubernamental autorizada
  answer: C
  explanation: 'Bajo Documentos de Identidad, el manual señala con respecto a los
    certificados de nacimiento: "Los certificados emitidos por hospitales no son aceptables".'
- id: 310
  category: driver_testing
  question: ¿Cuántas horas mínimas de experiencia en el aula debe tener un curso de
    educación vial de otro estado para ser elegible para la certificación de Rhode
    Island?
  choices:
    A: 20 horas
    B: 30 horas
    C: 33 horas
    D: 40 horas
  answer: C
  explanation: 'El manual establece: "Para recibir la certificación de Rhode Island,
    aquellos que hayan tomado cursos fuera del estado deben haber participado en una
    experiencia en el aula de 33 horas como mínimo".'
- id: 311
  category: license_system
  question: ¿Cómo puede cambiar su dirección registrada en el DMV si NO desea una
    nueva licencia con fotografía?
  choices:
    A: Debe presentarse en persona en una sucursal de AAA.
    B: Puede completar una tarjeta de Cambio de Dirección y enviarla por correo al
      DMV.
    C: Debe solicitar una nueva licencia en línea.
    D: Debe esperar hasta que su licencia expire para cambiarla.
  answer: B
  explanation: 'El manual explica: "Si no desea una nueva licencia con fotografía,
    simplemente puede completar la tarjeta de Cambio de Dirección... y enviarla por
    correo al DMV".'
- id: 312
  category: safe_driving_rules
  question: ¿Cuál es una regla crucial con respecto a los cambios de carril al conducir
    por una zona de obras?
  choices:
    A: Debe cambiar de carril con frecuencia para encontrar la ruta más rápida.
    B: Solo puede cambiar de carril si no hay un oficial de policía presente.
    C: No cambie de carril dentro de la zona de obras.
    D: Cambie de carril solo al rebasar camiones grandes.
  answer: C
  explanation: El manual instruye a los conductores a "prestar mucha atención a las
    señales de incorporación y a los banderilleros, y no cambiar de carril dentro
    de la zona de obras".
- id: 313
  category: license_system
  question: Al proporcionar un cheque personal o un estado de cuenta bancario como
    comprobante de domicilio, ¿qué es lo que específicamente NO se permite?
  choices:
    A: Una dirección escrita a máquina
    B: Un apartado postal (P.O. Box)
    C: Una cuenta bancaria conjunta
    D: Un banco de otro estado
  answer: B
  explanation: Según el manual, un cheque personal o un estado de cuenta bancario
    debe tener su nombre y dirección, y no se acepta un apartado postal (P.O. Box).
- id: 314
  category: license_system
  question: ¿Qué tipo de tarjeta de Seguro Social NO es aceptable al solicitar una
    licencia de conducir?
  choices:
    A: Una tarjeta de papel de reemplazo
    B: Una tarjeta laminada o de metal
    C: Una tarjeta emitida hace más de 10 años
    D: Una tarjeta con una inicial del segundo nombre
  answer: B
  explanation: El manual establece que todos los nuevos solicitantes deben proporcionar
    una tarjeta oficial de Seguro Social, y las tarjetas laminadas o de metal no son
    aceptables.
- id: 315
  category: license_system
  question: Si un solicitante no tiene un número de Seguro Social válido, ¿qué debe
    presentar para validar su inelegibilidad?
  choices:
    A: Un certificado de nacimiento y una factura de servicios públicos
    B: Un pasaporte extranjero y la visa o documentación correspondiente
    C: Una carta de un empleador de los EE. UU.
    D: Un permiso de conducir internacional
  answer: B
  explanation: Si no tiene un número de seguro social válido, debe presentar un pasaporte
    extranjero y la visa o documentación correspondiente para validar la inelegibilidad.
- id: 316
  category: license_system
  question: ¿Cuál de los siguientes es un comprobante de domicilio aceptable para
    un menor?
  choices:
    A: Una nota escrita a mano de un maestro
    B: Un boletín de calificaciones escolar de hace tres años
    C: Registros escolares del año escolar actual junto con la licencia/identificación
      de un padre con la misma dirección
    D: Una tarjeta de biblioteca
  answer: C
  explanation: Para un menor, los registros aceptables incluyen registros escolares
    del año escolar actual (como un boletín de calificaciones) junto con la licencia/identificación
    de un padre con la misma dirección.
- id: 317
  category: license_system
  question: Si utiliza un contrato de arrendamiento original válido como comprobante
    de domicilio, ¿qué información adicional debe proporcionarse?
  choices:
    A: El nombre, la dirección y el número de teléfono del arrendador
    B: El número de Seguro Social del arrendador
    C: Una copia de la licencia de conducir del arrendador
    D: Comprobante del seguro de la propiedad del arrendador
  answer: A
  explanation: Un contrato de arrendamiento original válido debe incluir su nombre
    y dirección, y también se debe proporcionar el nombre, la dirección y el número
    de teléfono del arrendador.
- id: 318
  category: vehicle_information
  question: Según el índice del manual, ¿qué significan las siglas 'ABS'?
  choices:
    A: Sistema de Frenado Automático (Automatic Braking System)
    B: Sistema de Frenos Antibloqueo (Anti-lock Braking System)
    C: Sistema de Batería Avanzado (Advanced Battery System)
    D: Secuencia de Frenado Alterno (Alternating Brake Sequence)
  answer: B
  explanation: El índice del Manual del Conductor de Rhode Island enumera ABS como
    'Anti-lock Braking System' (Sistema de Frenos Antibloqueo).
- id: 319
  category: license_system
  question: ¿Qué agencia verifica electrónicamente todos los números de Seguro Social
    de los solicitantes de licencias de conducir?
  choices:
    A: El Departamento de Seguridad Nacional (Department of Homeland Security)
    B: El Servicio de Impuestos Internos (Internal Revenue Service)
    C: La Administración del Seguro Social (Social Security Administration)
    D: La Oficina Federal de Investigaciones (Federal Bureau of Investigation)
  answer: C
  explanation: El manual establece que todos los números de seguro social se verifican
    electrónicamente con la Administración del Seguro Social.
- id: 320
  category: license_system
  question: ¿Dónde se encuentra la oficina principal de la División de Vehículos Motorizados
    (DMV) de Rhode Island?
  choices:
    A: 52 Valley Road, Middletown
    B: 600 New London Avenue, Cranston
    C: 1 Joyce Street, Warren
    D: 217 Pond Street, Woonsocket
  answer: B
  explanation: La sección de Ubicaciones y Horarios del DMV indica que la dirección
    de la oficina principal es 600 New London Avenue, Cranston, RI 02920.
- id: 321
  category: driver_testing
  question: ¿Según el directorio del DMV, en qué ubicación se administran los exámenes
    de conducción (Road Tests)?
  choices:
    A: 600 New London Avenue, Cranston
    B: 4808 Tower Hill Road, Wakefield
    C: 325 Melrose Street, Providence
    D: 45 Broad Street, Westerly
  answer: C
  explanation: La sección de Números de Teléfono de la Oficina Comercial del DMV indica
    que los exámenes de conducción (Road Tests) se realizan en 325 Melrose Street,
    Providence.
- id: 322
  category: license_system
  question: ¿Cuál de los siguientes documentos figura como un comprobante de domicilio
    aceptable?
  choices:
    A: Una factura de impuestos sobre la propiedad de su residencia
    B: Una etiqueta de suscripción a una revista
    C: Una carta escrita a mano de un compañero de cuarto
    D: Una licencia vencida de otro estado
  answer: A
  explanation: El manual incluye una 'factura de impuestos sobre la propiedad de su
    residencia' como un documento aceptable para el comprobante de domicilio.
- id: 323
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales figura explícitamente como un tipo de
    señal de advertencia en el manual?
  choices:
    A: Límite de velocidad 55 (Speed Limit 55)
    B: Resbaladizo cuando está mojado (Slippery When Wet)
    C: No estacionar en ningún momento (No Parking Any Time)
    D: Manténgase a la derecha excepto para rebasar (Keep Right Except To Pass)
  answer: B
  explanation: '''Slippery When Wet'' (Resbaladizo cuando está mojado) se encuentra
    entre las señales de advertencia en la sección de señales del manual.'
- id: 324
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales se clasifica junto con las señales de
    construcción como 'Road Work' (Obras en la vía) y 'Detour' (Desvío)?
  choices:
    A: Persona con bandera más adelante (Flagperson Ahead)
    B: Cruce de ciervos
    C: Cruce escolar
    D: Estación de bomberos
  answer: A
  explanation: '''Flagperson Ahead'' se agrupa con señales de construcción como ''Detour'',
    ''Road Work'' y ''Construction Speed'' en la sección de señales.'
- id: 325
  category: vehicle_information
  question: ¿Según el directorio del DMV, dónde se encuentra el taller de Control
    de Seguridad y Emisiones (Safety & Emission Control)?
  choices:
    A: Cranston
    B: Middletown
    C: Providence
    D: Warren
  answer: C
  explanation: La oficina y el taller de Control de Seguridad y Emisiones se encuentran
    en 325 Melrose Street, Providence.
- id: 326
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para demostrar su domicilio?
  choices:
    A: Un talón de cheque de asistencia social o una tarjeta de cupones de alimentos
      con su nombre y dirección
    B: Una tarjeta de Seguro Social laminada
    C: Una tarjeta de Seguro Social de metal
    D: Un cheque personal en blanco
  answer: A
  explanation: Un talón de cheque de asistencia social o una tarjeta de cupones de
    alimentos con su nombre y dirección figura como un documento aceptable para el
    comprobante de domicilio.
- id: 327
  category: safe_driving_rules
  question: ¿Según el índice del manual, qué regla está asociada con la distancia
    de frenado?
  choices:
    A: La regla de los dos segundos
    B: La regla de frenado de cuatro (4) segundos
    C: La regla de los diez segundos
    D: La regla de la longitud de un vehículo
  answer: B
  explanation: El índice enumera la 'Regla de frenado de cuatro (4) segundos' como
    un tema cubierto en el manual.
- id: 328
  category: driver_responsibility
  question: '¿Según la carta del Gobernador en el manual, conducir se considera un(a):'
  choices:
    A: Derecho
    B: Privilegio
    C: Requisito
    D: Pasatiempo
  answer: B
  explanation: 'El manual establece explícitamente: "Conducir es un privilegio y es
    importante que aprenda las reglas de la carretera..."'
- id: 329
  category: safe_driving_rules
  question: Cada vez que se pone al volante, ¿cuál debe ser su máxima prioridad?
  choices:
    A: Llegar a su destino rápidamente
    B: La seguridad
    C: Explorar el estado
    D: La eficiencia de combustible
  answer: B
  explanation: La carta del Gobernador enfatiza que "Cada vez que se pone al volante,
    la seguridad debe ser su máxima prioridad".
- id: 330
  category: driver_responsibility
  question: Según el manual, ¿qué vale la pena para poner en peligro su vida y la
    de quienes lo rodean?
  choices:
    A: Una llamada telefónica urgente
    B: Un mensaje de texto rápido
    C: Ninguna llamada telefónica ni mensaje de texto
    D: Ajustar el radio
  answer: C
  explanation: El texto establece claramente que "ninguna llamada telefónica ni mensaje
    de texto vale la pena para poner en peligro su vida y la de quienes lo rodean".
- id: 331
  category: alcohol_drugs_health
  question: 'El manual le aconseja explícitamente que nunca conduzca si se siente:'
  choices:
    A: Somnoliento o bajo la influencia de drogas o alcohol
    B: Enojado o molesto
    C: Hambriento o sediento
    D: Estresado por el trabajo
  answer: A
  explanation: El manual pide a los conductores que pongan de su parte "nunca conduciendo
    si se sienten somnolientos o están bajo la influencia de drogas o alcohol".
- id: 332
  category: safe_driving_rules
  question: ¿Qué acción le pide la carta del Gobernador que haga siempre al subir
    a un vehículo?
  choices:
    A: Revisar sus espejos
    B: Abrocharse el cinturón
    C: Encender sus faros
    D: Cerrar sus puertas con llave
  answer: B
  explanation: La carta le pide que ponga de su parte "abrochándose siempre el cinturón"
    y limitando las distracciones cada vez que se abroche el cinturón.
- id: 333
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales de cruce de animales se menciona explícitamente
    en esta sección del manual?
  choices:
    A: Cruce de osos
    B: Cruce de alces
    C: Cruce de ciervos
    D: Cruce de patos
  answer: C
  explanation: El texto enumera "Cruce de ciervos" (Deer Crossing) entre las señales
    de tráfico reconocidas.
- id: 334
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales de cruce de vehículos se identifica en
    el texto proporcionado?
  choices:
    A: Cruce de camiones
    B: Cruce de tractores
    C: Cruce de trenes
    D: Cruce de motos de nieve
  answer: B
  explanation: El manual enumera específicamente "Cruce de tractores" (Tractor Crossing)
    en su sección sobre señales de tráfico.
- id: 335
  category: signs_and_signals
  question: ¿Cuál de las siguientes señales indica que un trabajador está dirigiendo
    el tráfico más adelante?
  choices:
    A: Obras en la carretera
    B: Desvío
    C: Banderillero más adelante (Flagperson Ahead)
    D: Velocidad de construcción
  answer: C
  explanation: El texto enumera "Banderillero más adelante" (Flagperson Ahead) como
    una de las señales de construcción y obras viales.
- id: 336
  category: signs_and_signals
  question: ¿Qué tipo de marcador se indica específicamente en el texto como utilizado
    para puentes?
  choices:
    A: Marcadores de fin de carretera
    B: Marcadores de objetos
    C: Marcadores de millaje
    D: Marcadores de despeje
  answer: B
  explanation: El manual enumera "Marcadores de objetos (puentes)" en su índice de
    señales.
- id: 337
  category: signs_and_signals
  question: ¿Qué señal indica que la carretera se está estrechando por el lado derecho?
  choices:
    A: Carril añadido (por la derecha)
    B: La carretera se estrecha (por la derecha)
    C: Camino lateral (derecha)
    D: Puente estrecho
  answer: B
  explanation: El manual incluye la señal "La carretera se estrecha (por la derecha)"
    (Road Narrows from right) en su lista.
- id: 338
  category: signs_and_signals
  question: ¿Cuál de las siguientes áreas recreativas o comunitarias tiene una señal
    de advertencia específica mencionada en el texto?
  choices:
    A: Hospital
    B: Biblioteca
    C: Parque infantil (Playground)
    D: Estación de policía
  answer: C
  explanation: El texto enumera "Parque infantil" (Playground) como una de las señales
    de tráfico reconocidas.
- id: 339
  category: signs_and_signals
  question: ¿Qué señal se utiliza para indicar que los vehículos se moverán en direcciones
    opuestas en la misma carretera?
  choices:
    A: Intersección
    B: Carril añadido
    C: Desvío
    D: Tráfico de doble sentido
  answer: D
  explanation: El manual incluye "Tráfico de doble sentido" (Two-Way Traffic) en su
    lista de señales de tráfico.
- id: 340
  category: driver_responsibility
  question: ¿Qué establece la carta del Gobernador que debe hacer para que su experiencia
    de conducción sea lo más segura posible?
  choices:
    A: Aprender las reglas de la carretera
    B: Comprar un vehículo nuevo
    C: Conducir solo durante las horas del día
    D: Evitar conducir en autopistas
  answer: A
  explanation: 'La carta establece: "es importante que aprenda las reglas de la carretera
    para que su experiencia de conducción sea lo más segura posible".'
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Hacer una parada completa
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe hacer
    una parada completa en la línea de parada, el cruce de peatones o antes de entrar
    en la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 341
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Hacer una parada completa
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 342
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 343
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 344
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal en blanco y negro de UNA VÍA (ONE WAY) con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección hacia
    la que apunta la flecha.'
  id: 345
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 346
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 347
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 348
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 349
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 350
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, basándose en su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 351
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 352
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan la calle.
  id: 353
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 354
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 355
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de vías férreas. Significa que debe ceder el paso a los trenes.
    Si se aproxima un tren, debe detenerse.
  id: 356
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 357
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 358
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera curve
    primero en un sentido y luego en el otro.
  id: 359
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 360
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica este letrero que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 361
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 362
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 363
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 364
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que viajan en la dirección opuesta.
  id: 365
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 366
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 367
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de pare (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 368
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de pare (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de pare (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de pare.
  id: 369
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 370
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 371
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un carril nuevo; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 372
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 373
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 374
