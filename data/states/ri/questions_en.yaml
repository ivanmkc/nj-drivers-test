  explanation: One study indicated that talking on a cell phone was over four times
    more likely to cause a near crash than the next-most frequent cause of distraction.
- id: 84
  category: safe_driving_rules
  question: What should you do to prevent your cell phone from becoming a projectile
    in a crash?
  choices:
    A: Keep it in your lap while driving
    B: Secure your phone in the car
    C: Hold it firmly in your hand
    D: Place it loosely on the dashboard
  answer: B
  explanation: The manual states that you should 'Secure your phone in the car so
    that it does not become a projectile in a crash.'
- id: 85
  category: defensive_driving
  question: If you need to have an emotional conversation while driving, what is the
    recommended action?
  choices:
    A: Speak loudly over the radio to stay focused
    B: Ask a passenger to hold the phone for you
    C: Pull off the road to a safe spot before continuing
    D: Slow down by 10 mph to reduce your crash risk
  answer: C
  explanation: 'The manual advises: ''Do not engage in emotional conversations while
    driving. Pull off the road to a safe spot before continuing this type of conversation.'''
- id: 86
  category: driver_responsibility
  question: What is a 'microsleep'?
  choices:
    A: A 10-minute nap taken at a rest stop
    B: A short burst of sleep lasting only a few seconds
    C: A condition caused by untreated sleep apnea
    D: A sleep cycle that occurs between 2 am and 4 am
  answer: B
  explanation: According to the manual, drivers may experience 'short bursts of sleep
    lasting only a few seconds (microsleeps).'
- id: 87
  category: driver_responsibility
  question: According to the AAA Foundation for Traffic Safety, how much does sleeping
    fewer than five hours increase your risk of a collision?
  choices:
    A: By two times
    B: By three times
    C: By four to five times
