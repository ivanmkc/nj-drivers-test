  explanation: The manual lists 'Trouble remembering the last few miles driven; missing
    exits or traffic signs' as a warning sign of drowsiness.
- id: 95
  category: alcohol_drugs_health
  question: How many hours of sleep per night do sleep experts recommend for teens
    to help prevent drowsiness?
  choices:
    A: 6 to 7 hours
    B: 7 to 8 hours
    C: 7 to 9 hours
    D: 8½ to 9½ hours
  answer: D
  explanation: To help prevent becoming drowsy, sleep experts recommend '8½ to 9½
    hours for teens' according to the manual.
- id: 96
  category: safe_driving_rules
  question: 'When taking a long trip, a good rule of thumb is to take a break and
    stop driving every:'
  choices:
    A: 50 miles or every hour
    B: 100 miles or every two hours
    C: 150 miles or every three hours
    D: 200 miles or every four hours
  answer: B
  explanation: 'The manual states: ''A good rule of thumb is to stop every 100 miles
    or every two hours.'''
- id: 97
  category: defensive_driving
  question: Which of the following actions is considered ineffective at preventing
    drowsiness for longer than just a few minutes?
  choices:
    A: Taking a 10-minute break every two hours
    B: Switching drivers with a passenger
    C: Playing the radio at high volume
    D: Stopping for a night of rest
