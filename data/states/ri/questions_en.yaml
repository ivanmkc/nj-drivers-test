  explanation: The manual lists 'Playing the radio at high volume' under 'Ineffective
    actions' that will not help prevent drowsiness longer than just a few minutes.
- id: 98
  category: safe_driving_rules
  question: If you must stop along the roadway to rest after dark, what is the best
    practice?
  choices:
    A: Find a populated, lighted area
    B: Park as close to the highway traffic lane as possible
    C: Keep all windows completely sealed
    D: Leave your vehicle running with the doors unlocked
  answer: A
  explanation: The manual advises that if you must stop along the roadway to rest,
    'After dark, find a populated, lighted area.'
- id: 99
  category: defensive_driving
  question: According to the manual, what is a potential consequence of sleeping in
    your vehicle for more than 20 minutes?
  choices:
    A: It fully restores your reaction time and alertness.
    B: It can make you groggy for at least five minutes after awakening.
    C: It is illegal on all Rhode Island highways.
