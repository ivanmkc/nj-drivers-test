  question: If you need to seek help due to an aggressive driver, where is the best
    place to drive?
  choices:
    A: A quiet, unlit residential street.
    B: A busy public place where there are witnesses, such as a fire station or hospital.
    C: A narrow alleyway where they cannot follow you.
    D: The shoulder of the nearest highway.
  answer: B
  explanation: The manual recommends that if necessary, you should 'drive to a busy
    public place where there are witnesses, such as a hospital, fire station or busy
    convenience store or gas station.'
- id: 112
  category: safe_driving_rules
  question: According to the manual, where do most motor vehicle collisions occur?
  choices:
    A: On interstate highways.
    B: In busy downtown intersections.
    C: Within a few miles of people's homes.
    D: In rural areas with winding roads.
  answer: C
  explanation: The manual states that 'Most motor vehicle collisions are caused by
    errors of the driver and occur within a few miles of people’s homes.'
- id: 113
  category: safe_driving_rules
  question: What should you do immediately before entering your vehicle to drive?
  choices:
    A: Check in front and behind the vehicle for objects, animals, or persons in your
      path.
    B: Start the engine remotely to warm it up.
    C: Honk the horn twice to warn pedestrians.
    D: Check your tire pressure with a gauge.
  answer: A
  explanation: 'The manual instructs: ''Before entering your vehicle, check in front
    and behind the vehicle for objects, animals, or persons in your path.'''
- id: 114
  category: defensive_driving
  question: What is the first thing you should do before entering your vehicle?
  choices:
    A: Turn on the engine
    B: Adjust the inside and outside mirrors
    C: Check in front and behind the vehicle for objects, animals, or persons
    D: Fasten your seat belt
  answer: C
  explanation: According to the manual, before entering your vehicle, you should check
    in front and behind the vehicle for objects, animals, or persons in your path.
- id: 115
  category: driver_responsibility
  question: How does Rhode Island classify its Seat Belt Use Law?
  choices:
    A: As a secondary law for adults
    B: As a primary law for all ages
    C: As a primary law only for minors
    D: As a voluntary safety guideline
  answer: B
  explanation: The manual specifies that the Seat Belt Use Law is a primary law for
    all ages, meaning you can be pulled over if anyone is unbuckled.
- id: 116
  category: penalties_and_points
  question: What is the fine for an adult occupant violating the safety belt use law
    in Rhode Island?
  choices:
    A: $25.00 per occupant
    B: $40.00 per occupant
    C: $85.00 per occupant
    D: $100.00 per occupant
  answer: B
  explanation: The manual states that the vehicle operator is responsible for compliance,
    and the fine for violation of this section is $40.00 per occupant.
- id: 117
  category: safe_driving_rules
  question: Under what conditions must a child be transported in a rear seating position
    in an approved child restraint system?
  choices:
    A: Under age 8, less than 57 inches tall, and less than 80 pounds
    B: Under age 10 and less than 100 pounds
    C: Under age 6 and less than 60 pounds
    D: Under age 12 regardless of height or weight
  answer: A
  explanation: The Child Restraint Law requires any person transporting a child under
    the age of eight (8), less than fifty-seven (57) inches in height, and less than
    eighty (80) pounds to use a rear seating position and an approved child restraint
    system.
- id: 118
  category: vehicle_information
  question: Which of the following is a valid exception that allows a child under
    age eight to be exempt from being transported in a rear seating position?
  choices:
    A: The child prefers to sit in the front seat
    B: The vehicle has no backseat (e.g., a pickup truck or sports car)
    C: The trip is less than 5 miles long
    D: The child weighs more than 50 pounds
  answer: B
  explanation: Exceptions to the rear seating requirement for children under eight
    include if the vehicle has no backseat (i.e., pickup truck, sports car, etc.)
    or if all rear seating positions are already being utilized by other children.
- id: 119
  category: penalties_and_points
  question: What is the penalty for transporting a child who is not in a required
    child restraint system?
  choices:
    A: A $40 fine
    B: A $50 fine and a written warning
    C: A mandatory court appearance
    D: License suspension for 30 days
  answer: C
  explanation: The manual explicitly states that a violation for transporting a child
    not in a child restraint system mandates a court appearance.
- id: 120
  category: safe_driving_rules
  question: How must an infant (birth to at least one year old and at least 20 lbs)
    be secured in a vehicle?
  choices:
    A: Forward-facing in the front seat
    B: Rear-facing and/or convertible car seat in the back seat
    C: Forward-facing convertible car seat in the back seat
    D: In a booster seat in the back seat
  answer: B
  explanation: The Booster Seat/Safety Seat/Safety Belt Use Law requires infants (birth
    to at least 1 year old and at least 20 lbs) to be in a rear-facing and/or convertible
    car seat, for back seat use only.
- id: 121
  category: defensive_driving
  question: Total stopping distance is calculated by adding which three components
    together?
  choices:
    A: Visual distance, reaction distance, and braking distance
    B: Perception distance, reaction distance, and braking distance
    C: Recognition distance, mechanical distance, and stopping distance
    D: Perception distance, hydroplaning distance, and braking distance
  answer: B
  explanation: 'The manual states: ''The perception distance plus the reaction distance
    plus the braking distance equals the total stopping distance.'''
- id: 122
  category: driver_responsibility
  question: After seeing danger, approximately how long does it take the average driver
    to apply the brake?
  choices:
    A: 1/4 of a second
    B: 1/2 of a second
    C: 3/4 of a second
    D: 1 full second
  answer: C
  explanation: According to the manual, after seeing danger, it takes the average
    driver about 3/4 of a second to apply the brake.
- id: 123
  category: defensive_driving
  question: What is 'velocitizing'?
  choices:
    A: When the front tires lose contact with a wet road surface
    B: When you begin to feel that you are going slower than your actual speed
    C: When you accelerate too quickly on an exit ramp
    D: When your braking distance increases due to icy roads
  answer: B
  explanation: The manual defines velocitizing as occurring 'when you begin to feel
    that you are going slower than your actual speed.' It can be avoided by varying
    your speed slightly on the highway.
- id: 124
  category: safe_driving_rules
  question: How can a driver guard against hydroplaning?
  choices:
    A: By keeping tire pressure inflated to the manufacturer's recommended standard
      and reducing speed
    B: By braking hard when driving through pools of water
    C: By increasing speed to push water away from the tires
    D: By slightly deflating tires during rainstorms
  answer: A
  explanation: The manual advises to guard against hydroplaning by keeping tire pressure
    inflated to the manufacturer's recommended standard, reducing speed, and being
    careful while driving in the rain.
- id: 125
  category: safe_driving_rules
  question: What fraction of all crashes happen when one vehicle is turning left?
  choices:
    A: One-half (1/2)
    B: One-third (1/3)
    C: One-fourth (1/4)
    D: One-sixth (1/6)
  answer: D
  explanation: The manual notes that one-sixth (1/6) of all crashes happen when one
    vehicle is turning left.
- id: 126
  category: defensive_driving
  question: When waiting at an intersection to make a left turn, what should you do
    with your vehicle's wheels?
  choices:
    A: Turn them to the left to prepare for the turn
    B: Turn them to the right to maintain balance
    C: Do not turn your wheels in your intended path of travel until you are clear
      to make your turn
    D: Keep them turned slightly left and slowly inch forward into oncoming traffic
  answer: C
  explanation: 'When making a left turn, the manual instructs: ''Do not turn your
    wheels in your intended path of travel until you are clear to make your turn.'''
- id: 127
  category: safe_driving_rules
  question: When you are preparing to make a left turn at an intersection, which vehicles
    have the right-of-way?
  choices:
    A: Only the vehicle directly approaching you
    B: Only the vehicle approaching on your right
    C: Both the vehicle directly approaching you and the vehicle approaching on your
      right
    D: The vehicle making the left turn has the right-of-way
  answer: C
  explanation: The manual states that when making a left turn, 'Both the motor vehicle
    directly approaching you and the vehicle approaching on your right has the right-of-way.'
- id: 128
  category: safe_driving_rules
  question: Why should you avoid swinging to the left before making a right turn?
  choices:
    A: It gives you a wider turning radius and takes up too much space.
    B: It is likely to make the driver behind you assume you are going to turn left.
    C: It causes unnecessary wear on your vehicle's steering column.
    D: It is illegal to cross the center line while turning right.
  answer: B
  explanation: According to the manual, swinging to the left before turning right
    is a dangerous habit because it is likely to make the driver of the vehicle following
    you assume you are going to turn left.
- id: 129
  category: safe_driving_rules
  question: In the basics of making a turn, what does the 'C' stand for?
  choices:
    A: Check your mirrors and blind spots.
    B: Cancel your directional signal.
    C: Coast into the first half of the turn, covering the brake.
    D: Cross the intersection safely.
  answer: C
  explanation: The manual states that 'C' stands for 'Coast into the first half of
    the turn, covering the brake (gentle pressure on the brake pedal) in case the
    need to apply the brakes arises.'
- id: 130
  category: safe_driving_rules
  question: 'When planning a turnabout, you must have clear visibility in each direction
    for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: To plan a turnabout, you should make certain that you have clear visibility
    in each direction for a distance of five hundred (500) feet.
- id: 131
  category: safe_driving_rules
  question: How far must you be from an intersection to safely perform a turnabout?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: C
  explanation: The manual states that when planning a turnabout, you must make certain
    you are at least two hundred feet (200') from an intersection.
- id: 132
  category: defensive_driving
  question: Why is pulling into a street or driveway on the left to perform a turnabout
    considered more hazardous?
  choices:
    A: You will be backing into the travel lane.
    B: It is difficult to see pedestrians on the left side.
    C: It requires crossing a double yellow line.
    D: You must yield to vehicles behind you.
  answer: A
  explanation: The manual notes that pulling into a street or driveway on the left
    is more hazardous because you will be backing into the travel lane.
- id: 133
  category: safe_driving_rules
  question: 'When stopping at a stop sign, drivers should completely cease all forward
    motion for a minimum of:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: When stopping, drivers should completely cease all forward motion for
    a minimum of three seconds to give time to look left, right, and left again.
- id: 134
  category: safe_driving_rules
  question: If two vehicles arrive at a four-way stop intersection at the same time,
    who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a faster speed
    D: The vehicle that signals first
  answer: B
  explanation: At a four-way stop, if two vehicles arrive at the intersection at the
    same time, you must yield the right of way to the vehicle on your right.
- id: 135
  category: safe_driving_rules
  question: You may not park or stop your vehicle within how many feet of a fire hydrant?
  choices:
    A: 8 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: A
  explanation: The manual lists places where you may not park or stop, which includes
    within 8 feet of a fire hydrant.
- id: 136
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: You may not park or stop within 20 feet of a crosswalk at an intersection.
- id: 137
  category: safe_driving_rules
  question: You must not park within how many feet of a flashing red or yellow light,
    a stop sign, or a traffic light?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: The manual states you may not park or stop within 30 feet of a flashing
    red or yellow light, a stop sign, or a traffic light.
- id: 138
  category: safe_driving_rules
  question: Unless loading or unloading passengers or packages for a short time, you
    may not park within how many feet of the nearest rail of a railroad crossing?
  choices:
    A: 20 feet
    B: 30 feet
    C: 50 feet
    D: 75 feet
  answer: C
  explanation: You may not park or stop within 50 feet of the nearest rail or a railroad
    crossing, unless stopping for a short time to load/unload.
- id: 139
  category: safe_driving_rules
  question: When parked on a two-lane road, your right wheels must be a maximum of
    how many inches from the right side of the road or curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: Unless a law prohibits parking, a vehicle parked on a two-lane road
    must have the right wheels a maximum of twelve (12) inches from the right side
    of the road or curb.
- id: 140
  category: defensive_driving
  question: When entering a traffic lane from a parked position, what should you do
    to cover your blind spots?
  choices:
    A: Honk your horn before moving.
    B: Flash your headlights to warn oncoming traffic.
    C: Look over your left shoulder.
    D: Rely solely on your rearview mirror.
  answer: C
  explanation: To enter a traffic lane from a parked position, you must check the
    rear view and side view mirrors and look over your left shoulder to cover the
    blind spots.
- id: 141
  category: defensive_driving
  question: When waiting at an intersection to make a right turn, why should you wait
    to turn your wheels in your intended path of travel?
  choices:
    A: It causes unnecessary tire wear.
    B: You must wait until you are clear to make your turn.
    C: It locks the steering column.
    D: It confuses pedestrians crossing the street.
  answer: B
  explanation: 'The manual instructs: ''When you reach the intersection, wait until
    the way is clear. Do not turn your wheels in your intended path of travel until
    you are clear to make your turn.'''
- id: 142
  category: driver_testing
  question: During your driving test, if you are instructed to stop and start your
    vehicle on a hill, what must you do immediately after stopping on the right side
    of the road?
  choices:
    A: Turn your hazard lights on.
    B: Set your parking brake and shift to neutral.
    C: Keep your foot firmly on the brake and stay in drive.
    D: Shift to park and turn off the engine.
  answer: B
  explanation: When instructed by the examiner to drive to the right side of the road
    and stop on a hill, you must then set your parking brake and shift to neutral.
- id: 143
  category: safe_driving_rules
  question: What must you do when entering a roadway from a private road or driveway?
  choices:
    A: Stop only at the curb line.
    B: Stop at the sidewalk, then stop again at the curb line.
    C: Yield without stopping if the road is clear.
    D: Sound your horn and proceed at a slow speed.
  answer: B
  explanation: When entering the roadway from a private road or driveway, you must
    stop at the sidewalk before continuing to the curb line where you are mandated
    to stop again.
- id: 144
  category: safe_driving_rules
  question: When passing a vehicle on the left, how do you know it is safe to return
    to the right side of the road?
  choices:
    A: When you are one car length ahead of the passed vehicle.
    B: When you can see the driver of the passed vehicle in your side mirror.
    C: When you can see the tires of the passed vehicle on the pavement in your inside
      rear view mirror.
    D: Three seconds after you have passed the vehicle's front bumper.
  answer: C
  explanation: You should go far enough past the vehicle you are passing so that you
    are able to see the tires on the pavement of the vehicle you passed in your inside
    rear view mirror before returning to the right side of the road.
- id: 145
  category: safe_driving_rules
  question: Under which of the following conditions is it permissible to pass a vehicle
    on the right?
  choices:
    A: When the vehicle ahead is traveling below the speed limit.
    B: When the vehicle ahead is making or about to make a left turn.
    C: When you are driving on a single-lane dirt road.
    D: When the vehicle ahead is making a right turn.
  answer: B
  explanation: A driver may pass on the right of another vehicle when the motor vehicle
    ahead is making or about to make a left turn.
- id: 146
  category: defensive_driving
  question: What is recommended if you are backing up for a distance greater than
    30 feet?
  choices:
    A: Sound your horn every 10 feet.
    B: Activate your hazard lights.
    C: Roll down your window and use hand signals.
    D: Flash your high beam headlights.
  answer: B
  explanation: If you are backing up for a distance greater than 30 feet, it is recommended
    that you activate your hazard lights to warn other motorists of your maneuvers.
- id: 147
  category: defensive_driving
  question: What is the condition known as "velocitizing"?
  choices:
    A: Falling asleep at the wheel during long trips.
    B: Feeling that you are traveling slower than your actual speed.
    C: Losing traction on wet freeway surfaces.
    D: Accelerating too quickly on an entrance ramp.
  answer: B
  explanation: Velocitizing happens when you begin to feel that you are going slower
    than your actual speed, especially when preparing to leave a freeway.
- id: 148
  category: defensive_driving
  question: What is "highway hypnosis"?
  choices:
    A: A condition caused by long periods of driving.
    B: A visual illusion caused by oncoming headlights.
    C: The tendency to follow the vehicle ahead too closely.
    D: The feeling of going slower than your actual speed.
  answer: A
  explanation: Highway hypnosis is a condition caused by long periods of driving.
    To avoid its effects, you should get out of your vehicle for a while to relax.
- id: 149
  category: safe_driving_rules
  question: On a freeway, what is the far left lane primarily used for?
  choices:
    A: Slower moving traffic.
    B: Vehicles entering and exiting the freeway.
    C: Passing other vehicles.
    D: Trucks and buses.
  answer: C
  explanation: The far left lane is for passing other vehicles. Trucks, busses, and
    other special vehicles are prohibited from traveling in this lane.
- id: 150
  category: safe_driving_rules
  question: What is the standard speed limit in residential areas in Rhode Island?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Rhode Island law sets speed limits at 25 miles per hour (mph) in residential
    areas.
- id: 151
  category: defensive_driving
  question: What should you do if you are being tailgated by another vehicle?
  choices:
    A: Speed up to increase the distance between you and the tailgater.
    B: Slam on your brakes to warn the driver.
    C: Change lanes to let the vehicle pass.
    D: Antagonize the driver to back off.
  answer: C
  explanation: If you are being tailgated, change lanes. Never speed up because you
    will be tailgated at a higher speed, and never slam on your brakes.
- id: 152
  category: safe_driving_rules
  question: If you must stop on the highway and need help, what should you do to signal
    other drivers?
  choices:
    A: Stand in the breakdown lane and wave your arms.
    B: Raise the hood of your vehicle and tie a white cloth on the door handle.
    C: Leave your doors unlocked and walk to the nearest exit.
    D: Sound your horn continuously until help arrives.
  answer: B
  explanation: If you need help on a highway, raise the hood of your vehicle, tie
    a white cloth on the door handle and stay in your locked vehicle.
- id: 153
  category: safe_driving_rules
  question: What is the correct action to take if you miss your exit ramp on a highway?
  choices:
    A: Stop and carefully back up to the missed exit.
    B: Make a U-turn through the median.
    C: Pull into the breakdown lane and wait for traffic to clear before backing up.
    D: Go on to the next exit.
  answer: D
  explanation: If you miss your exit ramp, go on to the next exit. Never stop and
    back up to the missed exit.
- id: 154
  category: sharing_the_road
  question: What is the minimum following distance you must maintain behind an emergency
    vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Always drive 500 feet behind emergency vehicles.
- id: 155
  category: safe_driving_rules
  question: What does the Basic Speed Law in Rhode Island require motorists to do?
  choices:
    A: Always drive exactly at the posted speed limit.
    B: Drive 5 mph below the posted speed limit at night.
    C: Drive only as fast as the road conditions dictate.
    D: Maintain a minimum speed of 45 mph on all highways.
  answer: C
  explanation: The Basic Speed Law in Rhode Island requires motorists to drive only
    as fast as the road conditions dictate, adjusting for snow, rain, sleet, ice,
    or road construction.
- id: 156
  category: driver_responsibility
  question: What is the Rhode Island law regarding cellular phone usage for drivers
    under the age of 18?
  choices:
    A: They may use a cell phone only if it is a hands-free device.
    B: They are completely prohibited from using a cell phone while operating a motor
      vehicle.
    C: They may use a cell phone only for GPS navigation.
    D: They may use a cell phone as long as they are not driving on a freeway.
  answer: B
  explanation: Drivers under the age of 18 are prohibited from using a cell phone
    while operating a motor vehicle, per R.I.G.L. 31-22-11.9.
- id: 157
  category: safe_driving_rules
  question: When preparing to pass a vehicle at night, what might be necessary to
    warn the driver in front of you?
  choices:
    A: Honk your horn three times.
    B: Turn on your hazard lights temporarily.
    C: Blink your headlights from low beam to high beam and back to low beam.
    D: Turn off your headlights for one second.
  answer: C
  explanation: At night it might be necessary to blink your headlights from low beam
    to high beam and back to low beam to warn the driver in front of you that you
    intend to pass.
- id: 158
  category: safe_driving_rules
  question: According to the Basic Speed Law, what does a speed limit sign indicate?
  choices:
    A: The minimum speed required on the roadway.
    B: The maximum speed for ideal conditions.
    C: The recommended speed during inclement weather.
    D: The speed you must maintain regardless of traffic.
  answer: B
  explanation: The manual states that motorists must realize the speed limit sign
    is the maximum speed for ideal conditions and therefore, they must adjust their
    speed to the conditions.
- id: 159
  category: penalties_and_points
  question: What is the penalty for a third offense of using a cellular phone while
    driving if you are under 18 years of age?
  choices:
    A: $50 fine
    B: $85 fine
    C: $100 fine and loss of license until 18 years of age
    D: $125 fine and mandatory community service
  answer: C
  explanation: If a minor is found in violation of the cell phone law for a third
    offense, they are subject to a $100.00 fine and lose their license until 18 years
    of age.
- id: 160
  category: safe_driving_rules
  question: Under what circumstance is a driver under the age of 18 permitted to use
    a cell phone while operating a motor vehicle?
  choices:
    A: When using a hands-free device or speakerphone
    B: When stopped at a red light
    C: In the case of an emergency
    D: When calling a parent or guardian
  answer: C
  explanation: The only time a minor is permitted to use a cell phone is in the case
    of an emergency. Hands-free devices and speakerphones are also prohibited for
    minors.
- id: 161
  category: penalties_and_points
  question: What is the fine for a first offense of texting while driving in Rhode
    Island?
  choices:
    A: $50.00
    B: $85.00
    C: $100.00
    D: $125.00
  answer: B
  explanation: According to the texting penalties in the manual, a first offense for
    texting while driving results in an $85.00 fine.
- id: 162
  category: safe_driving_rules
  question: At a minimum, how far in advance must a driver signal before making a
    turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: The law states that a driver has to make a signal by hand or by using
    directional lights at least 100 feet at a minimum before making a turn.
- id: 163
  category: signs_and_signals
  question: What is the correct hand signal to indicate a right turn?
  choices:
    A: Put left hand and arm straight out.
    B: Put left hand and arm down.
    C: Put left hand and arm up.
    D: Put right hand and arm straight out.
  answer: C
  explanation: To turn right, the correct hand signal is to put your left hand and
    arm up, keeping hand and arm still.
- id: 164
  category: signs_and_signals
  question: What do yellow lines painted on the roadway indicate?
  choices:
    A: They separate traffic traveling in the same direction.
    B: They separate traffic traveling in opposite directions.
    C: They mark the outer edges of the roadway.
    D: They indicate a pedestrian crosswalk.
  answer: B
  explanation: Yellow lines separate traffic traveling in opposite directions.
- id: 165
  category: signs_and_signals
  question: When using a shared turn lane, a motorist should not enter the lane unless
    they intend to turn within what minimum distance?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Motorists wishing to turn shall not enter a shared turn lane unless
    they intend to turn within 100 feet (minimum).
- id: 166
  category: sharing_the_road
  question: What does a 'sharrow' or shared-lane marking indicate to motorists?
  choices:
    A: The lane is restricted to high-occupancy vehicles only.
    B: A bicyclist may use the full lane.
    C: The lane is ending and vehicles must merge right.
    D: Pedestrians have the right-of-way in the lane.
  answer: B
  explanation: A sharrow is a shared-lane marking installed in the center of a travel
    lane to indicate that a bicyclist may use the full lane.
- id: 167
  category: safe_driving_rules
  question: In which direction does traffic flow around the center island of a roundabout?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a figure-eight pattern
    D: Straight through the center
  answer: B
  explanation: Roundabouts are intersections that direct traffic in a counterclockwise
    direction around a center island.
- id: 168
  category: sharing_the_road
  question: How should experienced cyclists navigate a roundabout if they choose to
    ride through it like a motorist?
  choices:
    A: Ride as close to the curb line as possible.
    B: Ride in the middle of the lane to prevent vehicles from passing them.
    C: Ride on the center island.
    D: Ride against the flow of traffic.
  answer: B
  explanation: Experienced cyclists may navigate roundabouts like motorists. Bicyclists
    should ride in the middle of the lane, not near the curb line, to prevent vehicles
    from passing them.
- id: 169
  category: safe_driving_rules
  question: What is a pedestrian's duty when crossing a roundabout?
  choices:
    A: Walk directly through the center island.
    B: Cross to the raised or painted splitter or refuge, then finish crossing.
    C: Yield the right-of-way to all entering motor vehicles.
    D: Cross anywhere they choose, as they always have the right-of-way.
  answer: B
  explanation: Pedestrians should cross to the raised or painted splitter or refuge.
    Then, look right and finish crossing to the opposite sidewalk. They should never
    walk through a roundabout or cross the center island.
- id: 170
  category: safe_driving_rules
  question: According to Rhode Island law, who has the right-of-way when a vehicle
    is about to enter a rotary?
  choices:
    A: The vehicle entering the rotary.
    B: Vehicles already in the rotary.
    C: The larger vehicle.
    D: The vehicle approaching from the right.
  answer: B
  explanation: R.I.G.L. 31-17-8 states that the driver of a vehicle about to enter
    a rotary shall yield the right-of-way to all vehicles already in the rotary.
- id: 171
  category: safe_driving_rules
  question: How must a motorist treat an uncontrolled intersection that has no traffic
    signs or signals?
  choices:
    A: As if there is a stop sign present.
    B: As if there is a yield sign present.
    C: As a four-way stop.
    D: They may proceed without slowing down.
  answer: B
  explanation: When approaching uncontrolled intersections, motorists must treat the
    intersection as if there were a yield sign present.
- id: 172
  category: signs_and_signals
  question: What hand signal should a driver use to indicate they are stopping or
    slowing down?
  choices:
    A: Put left hand and arm straight out.
    B: Put left hand and arm up.
    C: Put left hand and arm down.
    D: Wave the left hand in a circular motion.
  answer: C
  explanation: To stop or slow down, the correct hand signal is to put your left hand
    and arm down, keeping hand and arm still.
- id: 173
  category: signs_and_signals
  question: How should a motorist treat an uncontrolled intersection?
  choices:
    A: As a four-way stop
    B: As if a yield sign were present
    C: As a flashing red light
    D: As a protected turn lane
  answer: B
  explanation: According to the manual, when approaching uncontrolled intersections
    (intersections without signs or signals), motorists must treat the intersection
    as if there were a yield sign present.
- id: 174
  category: defensive_driving
  question: What does it mean to 'cover the brake' when approaching an intersection?
  choices:
    A: Pressing the brake pedal firmly to the floor
    B: Lightly tapping the brake pedal to warn other drivers
    C: Taking your foot off the accelerator and hovering it over the brake pedal without
      touching it
    D: Using both feet to press the brake and clutch simultaneously
  answer: C
  explanation: Cover the brake means taking your foot off the accelerator pedal and
    hovering it over the brake pedal without touching it, preparing to push the brake
    pedal if a hazard should arise.
- id: 175
  category: signs_and_signals
  question: What must you do when approaching a flashing red traffic light?
  choices:
    A: Slow down and proceed with caution
    B: Make a full stop and treat it as a stop sign
    C: Yield only to vehicles on your right
    D: Maintain your speed but cover the brake
  answer: B
  explanation: When nearing a flashing red traffic light, you must make a full stop
    and yield the right-of-way to all vehicles on your right and left. You should
    treat the flashing red signal as a stop sign.
- id: 176
  category: signs_and_signals
  question: When are you permitted to make a right turn on a steady red light?
  choices:
    A: Anytime, without stopping
    B: Only when a green arrow is also present
    C: After stopping completely and yielding, unless a sign prohibits it
    D: Right turns on red are never permitted
  answer: C
  explanation: Except when a sign is placed prohibiting a right turn on red, vehicles
    may turn right on a steady red light after the driver has stopped completely and
    yielded the right-of-way to pedestrians and other vehicles.
- id: 177
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate for left-hand turns?
  choices:
    A: You have a protected turn and the right-of-way
    B: You must stop and wait for a solid green light
    C: You may turn only after yielding to oncoming traffic and pedestrians
    D: Left turns are temporarily prohibited
  answer: C
  explanation: When a flashing yellow arrow is displayed, you may proceed with turning
    in the direction of the arrow only after yielding to oncoming traffic and pedestrians.
- id: 178
  category: signs_and_signals
  question: What is the purpose of a HAWK signal?
  choices:
    A: To warn drivers of an upcoming highway exit
    B: To let pedestrians safely cross a street
    C: To indicate an active railroad crossing
    D: To control traffic in school zones during recess
  answer: B
  explanation: HAWK stands for High-Intensity Activated Crosswalk and is used to let
    pedestrians safely cross a street.
- id: 179
  category: safe_driving_rules
  question: What should you do if you are driving on a slippery road and your vehicle
    is equipped with an Anti-lock Braking System (ABS)?
  choices:
    A: Pump the brakes gently to avoid skidding
    B: Press the pedal firmly and maintain pressure until the vehicle stops
    C: Stomp on the brake and release it repeatedly
    D: Use the parking brake to slow down safely
  answer: B
  explanation: If your vehicle is equipped with anti-lock brakes, do not pump the
    brake. Press the pedal firmly and maintain pressure until the vehicle stops.
- id: 180
  category: defensive_driving
  question: What is the first step you should take to control a vehicle as it begins
    to skid?
  choices:
    A: Slam on the brakes
    B: Shift into neutral
    C: Let off the gas
    D: Turn the steering wheel sharply in the opposite direction
  answer: C
  explanation: To control a vehicle as it begins to skid, the first step listed in
    the manual is to 'Let off the gas.'
- id: 181
  category: defensive_driving
  question: In which direction should you steer if your vehicle begins to skid?
  choices:
    A: In the opposite direction of the skid
    B: Straight ahead at all times
    C: Toward the right side of the road
    D: In the direction you want the vehicle to go
  answer: D
  explanation: When trying to control a vehicle in a skid, you should 'Turn in the
    direction you want the vehicle to go.'
- id: 182
  category: vehicle_information
  question: What should you do if you experience total brake failure while driving?
  choices:
    A: Shift into a higher gear and accelerate
    B: Pump the brake pedal and downshift to a lower gear
    C: Turn off the ignition immediately
    D: Steer directly into oncoming traffic to stop
  answer: B
  explanation: If your brake pedal goes to the floor, you should pump the brake pedal
    to try to restore fluid pressure, downshift to a lower gear to use engine braking,
    and engage the parking brake.
- id: 183
  category: defensive_driving
  question: How should you react if you experience a tire blowout while driving?
  choices:
    A: Brake hard immediately to stop the vehicle
    B: Grip the steering wheel firmly and ease up on the accelerator without braking
    C: Turn the steering wheel sharply to the shoulder
    D: Shift into neutral and apply the parking brake
  answer: B
  explanation: If you experience tire failure, grip the steering wheel firmly with
    two hands and ease up on the accelerator to slow the vehicle. Do not brake, as
    braking can cause the vehicle to swerve.
- id: 184
  category: defensive_driving
  question: What should you do if your accelerator pedal sticks to the floor?
  choices:
    A: Shift the car to NEUTRAL at the same time you apply the brake
    B: Turn off the ignition while still driving at high speed
    C: Pull the emergency brake as hard as possible
    D: Shift into a lower gear and pump the gas pedal
  answer: A
  explanation: If your accelerator pedal sticks, you should kick the side of it once
    to try to jar it free, and shift the car to NEUTRAL at the same time you apply
    the brake.
- id: 185
  category: vehicle_information
  question: What is the recommended action if your engine suddenly shuts off while
    driving?
  choices:
    A: Shift to PARK immediately
    B: Slam on the brakes to stop as quickly as possible
    C: Shift to NEUTRAL and try to restart the engine while moving
    D: Turn the steering wheel back and forth to maintain power steering
  answer: C
  explanation: If the engine suddenly shuts off, shift to NEUTRAL when the engine
    first sputters or stops, begin moving out of traffic, turn on hazard flashers,
    and try to restart the engine while you are moving.
- id: 186
  category: defensive_driving
  question: When performing an off-road recovery, what speed should you gently brake
    to before returning to the roadway?
  choices:
    A: 15 to 20 mph
    B: 5 to 10 mph
    C: 25 to 30 mph
    D: 0 mph (complete stop)
  answer: B
  explanation: During an off-road recovery, you should let up on the accelerator and
    brake gently to five (5) or ten (10) mph before positioning your vehicle to return
    to the roadway.
- id: 187
  category: signs_and_signals
  question: What does a steady yellow traffic light indicate?
  choices:
    A: A green light is next
    B: You must stop immediately regardless of safety
    C: A red light is next; slow down and proceed with caution if you cannot stop
      safely
    D: You have the right-of-way to clear the intersection
  answer: C
  explanation: A steady yellow light tells a driver that a red light is next. You
    should slow down and proceed with caution if a stop cannot be made safely.
- id: 188
  category: safe_driving_rules
  question: When returning to the roadway after dropping off the shoulder, what should
    you do the instant your front tires touch the roadway?
  choices:
    A: Brake hard to a complete stop
    B: Counter-steer sharply
    C: Accelerate rapidly
    D: Steer sharply to the left
  answer: B
  explanation: The manual instructs drivers to 'Counter-steer sharply the instant
    the front tires touch the roadway' when returning from the shoulder.
- id: 189
  category: defensive_driving
  question: If you are threatened with a head-on collision, which direction should
    you steer to avoid the other vehicle?
  choices:
    A: Steer left toward the center line
    B: Steer right toward the shoulder or curb-line
    C: Keep your steering wheel perfectly straight
    D: Swerve in a zigzag pattern
  answer: B
  explanation: To avoid a head-on collision, the manual advises to 'Steer right toward
    the shoulder or curb-line. Do not steer left.'
- id: 190
  category: defensive_driving
  question: What should you do just before an unavoidable rear-end collision occurs?
  choices:
    A: Lock your brakes firmly
    B: Release your brakes to soften the impact
    C: Shift your vehicle into reverse
    D: Turn off your engine
  answer: B
  explanation: If a rear-end collision is unavoidable, you should 'release your brakes
    just before the collision occurs. This helps soften the impact.'
- id: 191
  category: vehicle_information
  question: If your headlights suddenly go out while driving, what is the first step
    you should take?
  choices:
    A: Turn on your parking lights, hazard flashers, or turn signal
    B: Slam on your brakes and stop in your lane
    C: Close your eyes to adjust to the darkness
    D: Accelerate to reach your destination faster
  answer: A
  explanation: If your headlights fail, the first step is to 'Turn on your parking
    lights, hazard (emergency) flashers, or turn signal.'
- id: 192
  category: safe_driving_rules
  question: If your vehicle stalls on railroad tracks and a train is approaching,
    in which direction should you run after exiting the vehicle?
  choices:
    A: In the same direction the train is moving
    B: Directly toward the approaching train
    C: In a parallel line in the opposite direction from which the train is moving
    D: Perpendicular to the tracks toward the nearest road
  answer: C
  explanation: To avoid being hit by debris, you should exit your vehicle and run
    'in a parallel line in the opposite direction from which the train is moving.'
- id: 193
  category: sharing_the_road
  question: Approximately how long may it take for a train to come to a complete stop
    after applying the brake?
  choices:
    A: A quarter of a mile
    B: Half a mile
    C: One mile
    D: A mile and a half
  answer: D
  explanation: The manual states, 'It may take a train a mile and a half to come to
    a complete stop after applying the brake.'
- id: 194
  category: vehicle_information
  question: What should you do if you see smoke coming from under the hood of your
    vehicle?
  choices:
    A: Drive to the nearest fire station
    B: Open the hood immediately to locate the fire
    C: Pull off the road, turn off the ignition, and move away from the vehicle
    D: Accelerate to blow the smoke away
  answer: C
  explanation: If your vehicle catches fire, you must 'Pull immediately off the road,
    turn your ignition to the off position, and move away from the vehicle.'
- id: 195
  category: safe_driving_rules
  question: Why should you avoid opening your door if your vehicle becomes stalled
    in a rain-swelled roadway or drives into water?
  choices:
    A: The door handle will become electrically charged
    B: Water will fill the inside and could cause the vehicle to flip onto its roof
    C: The door will be too heavy to close again
    D: It will trap the air pocket in the front seat
  answer: B
  explanation: The manual warns to 'Avoid opening your door as water will fill the
    inside of your vehicle and could cause your vehicle to flip onto the roof.'
- id: 196
  category: safe_driving_rules
  question: How should you brake on slippery winter roads if your vehicle is equipped
    with anti-lock brakes (ABS)?
  choices:
    A: Gently pump the pedal
    B: Press the pedal down firmly and hold it
    C: Slam on the brakes repeatedly
    D: Lightly tap the brakes every few seconds
  answer: B
  explanation: 'For winter driving, the manual states: ''If you have anti-lock brakes,
    press the pedal down firmly and hold it.'''
- id: 197
  category: alcohol_drugs_health
  question: Which of the following is a symptom of carbon monoxide poisoning?
  choices:
    A: Excessive sweating
    B: Yawning, dizziness, or nausea
    C: A strong smell of exhaust fumes in the cabin
    D: Sudden blindness
  answer: B
  explanation: The manual notes that if you 'begin to yawn or feel dizzy or nauseous,
    you may be experiencing the symptoms of the poisoning.' It also mentions the fumes
    are odorless.
- id: 198
  category: defensive_driving
  question: Why should you NEVER drive in the rain or snow with your cruise control
    on?
  choices:
    A: It drains the vehicle's battery faster in cold weather
    B: It disables the anti-lock braking system
    C: If your car hydroplanes, it will accelerate and cause you to lose control
    D: It causes the windshield wipers to malfunction
  answer: C
  explanation: The manual warns that if cruise control is on when your car begins
    to hydroplane, 'your car will accelerate to a higher rate of speed making you
    lose control.'
- id: 199
  category: sharing_the_road
  question: Why should you allow a greater following distance of three to four seconds
    behind a motorcycle?
  choices:
    A: Motorcyclists often slow down by downshifting, which does not activate the
      brake light
    B: Motorcycles have a much longer stopping distance than cars
    C: Motorcycles frequently stall at intersections
    D: Motorcyclists cannot see vehicles directly behind them
  answer: A
  explanation: The manual explains that 'Motorcyclists often slow by downshifting
    or merely rolling off the throttle, thus not activating the brake light,' requiring
    a 3 to 4 second following distance.
- id: 200
  category: sharing_the_road
  question: Because of a motorcycle's small size, how does it appear to other drivers
    on the road?
  choices:
    A: It appears to be moving slower than it really is
    B: It appears farther away than it actually is
    C: It appears closer than it actually is
    D: It appears to have a wider turning radius
  answer: B
  explanation: The manual states, 'Because of its small size, a motorcycle may look
    farther away than it is.'
- id: 201
  category: sharing_the_road
  question: How do the mirrors on a motorcycle affect the motorcyclist's view of your
    vehicle?
  choices:
    A: They make your vehicle appear closer than it actually is
    B: They create a magnified image of your vehicle
    C: They give a smaller image of you and make you appear farther back than you
      actually are
    D: They completely eliminate the motorcyclist's blind spots
  answer: C
  explanation: Motorcycle mirrors are usually convex, which 'gives the cyclist a smaller
    image of you and makes you appear farther back than you actually are.'
- id: 202
  category: sharing_the_road
  question: How does carrying a passenger affect a motorcycle's performance?
  choices:
    A: It increases maneuverability
    B: It decreases the stopping distance
    C: It makes balance easier to maintain
    D: It makes balance more difficult and increases stopping distance
  answer: D
  explanation: The manual states that when carrying a passenger, 'Balance is more
    difficult, stopping distance is increased, and maneuverability is reduced.'
- id: 203
  category: safe_driving_rules
  question: According to Rhode Island law, which motorcycle operators are required
    to wear a certified helmet?
  choices:
    A: Only operators under the age of 18
    B: Only passengers are required to wear helmets
    C: Operators under 21 and new operators for their first year of licensure
    D: All motorcycle operators regardless of age or experience
  answer: C
  explanation: Rhode Island law requires any operator under twenty-one (21) to wear
    a certified helmet at all times, and new operators, regardless of age, must wear
    an approved helmet for their first year of license.
- id: 204
  category: safe_driving_rules
  question: What is the Rhode Island law regarding eye protection for motorcycle operators?
  choices:
    A: It is only required for operators under 21 years old.
    B: It is required for all operators.
    C: It is recommended but not legally required.
    D: It is only required when driving at night.
  answer: B
  explanation: Rhode Island law requires all operators to properly wear eye protection
    in the form of glasses, goggles, or a face shield.
- id: 205
  category: defensive_driving
  question: In the IPDE defensive driving system, what does the 'P' stand for?
  choices:
    A: Protect
    B: Position
    C: Predict
    D: Prevent
  answer: C
  explanation: In the IPDE system, the 'P' stands for Predict, which means to judge
    where possible points of conflict may occur.
- id: 206
  category: defensive_driving
  question: According to the zone system of defensive driving, what is a 'closed zone'?
  choices:
    A: A space you can drive without restrictions.
    B: A space not open because of restrictions in your line of sight or intended
      path of travel.
    C: A parking zone where parking is strictly prohibited.
    D: A lane designated only for large trucks and buses.
  answer: B
  explanation: A closed zone is defined as a space not open because of restrictions
    in your line of sight or intended path of travel.
- id: 207
  category: defensive_driving
  question: Which of the following is NOT one of the five keys of the Smith System
    for collision-free driving?
  choices:
    A: Leave Yourself an Out
    B: Aim High In Steering
    C: Keep Your Eyes Moving
    D: Brake Early and Often
  answer: D
  explanation: 'The five keys of the Smith System are: Leave Yourself an Out, Aim
    High In Steering, Get The Overall Picture, Keep Your Eyes Moving, and Make Sure
    They See You. ''Brake Early and Often'' is not one of them.'
- id: 208
  category: safe_driving_rules
  question: How many seconds should you use to measure a safe following distance under
    normal driving conditions?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: B
  explanation: The manual recommends using the 'Three (3) Second Rule' to maintain
    a safe following distance under normal conditions.
- id: 209
  category: safe_driving_rules
  question: When driving under adverse weather or road conditions, how should you
    adjust your following distance?
  choices:
    A: Keep it the same as normal conditions.
    B: Reduce it by one second to stay closer to the vehicle ahead.
    C: Add another second or two to your following distance.
    D: Double your speed to get through the weather faster.
  answer: C
  explanation: When driving under adverse weather/road conditions, be sure to add
    another second or two to your following distance.
- id: 210
  category: safe_driving_rules
  question: What is considered a safe stopping distance that gives you the opportunity
    to stop safely without colliding with an object?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: A safe stopping distance within four (4) seconds gives you the opportunity
    to stop safely without colliding with a person, vehicle, or object.
- id: 211
  category: defensive_driving
  question: If there are hazards to the right of your vehicle or you intend to turn
    left, which lane position should you use?
  choices:
    A: Lane position 1 (middle of the lane)
    B: Lane position 2 (3 to 6 inches from the left line)
    C: Lane position 3 (3 to 6 inches from the right line)
    D: Straddling the center line
  answer: B
  explanation: Lane position 2 (three to six inches from the left line) is the position
    to drive if hazards exist to the right of the vehicle or you intend to turn left.
- id: 212
  category: sharing_the_road
  question: How far back should you stay behind a large truck or semi-tractor-trailer
    if you expect the driver to see you?
  choices:
    A: At least 20 feet
    B: At least 30 feet
    C: At least 40 feet
    D: At least 50 feet
  answer: D
  explanation: You should stay at least 50 feet back if you expect the driver of a
    truck or semi-tractor-trailer to see you.
- id: 213
  category: sharing_the_road
  question: How can you tell if you have enough following distance behind a large
    truck?
  choices:
    A: You can read the truck's license plate clearly.
    B: You can see the side-view mirrors of the truck you are following.
    C: You can see the top of the truck's trailer.
    D: You can hear the truck's engine clearly.
  answer: B
  explanation: You know you have enough distance behind a truck or semi-tractor-trailer
    when you can see the side-view mirrors of the truck you are following.
- id: 214
  category: sharing_the_road
  question: What can happen if you drive too close to the side of a large truck in
    narrow lanes?
  choices:
    A: The truck's exhaust will stall your engine.
    B: The airflow between the two vehicles may tend to draw them together.
    C: Your headlights will blind the truck driver.
    D: The truck's tires will throw debris onto your windshield.
  answer: B
  explanation: If narrow lanes force you to drive close to a truck, grip the steering
    wheel firmly because the airflow between the two vehicles may tend to draw them
    together.
- id: 215
  category: safe_driving_rules
  question: Rhode Island law requires motorists to turn on their headlights from sunset
    to sunrise and whenever they cannot see how far ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: The law requires motorists to turn their headlights on when driving
    from sunset to sunrise, and any time you cannot see 500 feet ahead of you.
- id: 216
  category: safe_driving_rules
  question: When driving in bad weather conditions such as snow, rain, or fog, which
    lights are you required to use?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: The law requires that you use your low beam headlights during bad weather
    conditions such as snow, rain, and fog or whenever there are conditions that reduce
    visibility.
- id: 217
  category: safe_driving_rules
  question: Why is it required to use low beam headlights instead of high beams during
    fog, rain, or snow?
  choices:
    A: High beams drain the vehicle's battery faster in cold weather.
    B: Low beams are brighter than high beams.
    C: High beams may reflect off the precipitation and shorten the distance you can
      see.
    D: High beams will melt the snow on the windshield too quickly.
  answer: C
  explanation: In bad weather situations, high beams may reflect off the snow, rain,
    or fog in the air and shorten the distance you can see.
- id: 218
  category: safe_driving_rules
  question: Which headlights should you use during bad weather conditions such as
    snow, rain, or fog?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights
    D: Hazard lights
  answer: B
  explanation: The law requires that you use your low beam headlights during bad weather
    conditions such as snow, rain, and fog because high beams may reflect off the
    precipitation and shorten the distance you can see.
- id: 219
  category: vehicle_information
  question: From what distance must the back license plate on your vehicle be lighted
    and readable?
  choices:
    A: 30 feet
    B: 50 feet
    C: 60 feet
    D: 100 feet
  answer: C
  explanation: The back license plate on your vehicle must be lighted so it can be
    seen and read at least 60 feet from the back of the vehicle.
- id: 220
  category: safe_driving_rules
  question: At what distance must you dim your high beam headlights when approaching
    another vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You must dim your high beam headlights promptly at a distance of at
    least 500 feet ahead when approaching another vehicle.
- id: 221
  category: defensive_driving
  question: What should you do to avoid being temporarily blinded by approaching headlights?
  choices:
    A: Stare directly at the oncoming vehicle's headlights
    B: Turn on your high beams to see better
    C: Glance at the right edge of the roadway or fog line
    D: Close your eyes for a few seconds
  answer: C
  explanation: To avoid being temporarily blinded by approaching headlights, glance
    at the right edge of the roadway (or fog line) until the bright lights have gone
    by and your vision has returned to normal.
- id: 222
  category: sharing_the_road
  question: If there are no sidewalks available, where should pedestrians walk?
  choices:
    A: On the right side of the road with traffic
    B: On the left side of the road facing traffic
    C: In the center of the road
    D: As close to the median as possible
  answer: B
  explanation: If there are no sidewalks, pedestrians should walk on the left side
    of the road facing traffic.
- id: 223
  category: safe_driving_rules
  question: According to the manual, which of the following constitutes a legal crosswalk?
  choices:
    A: Only intersections with painted white lines
    B: Any intersection of public roads whether marked or not
    C: Only areas with pedestrian crossing signs
    D: Any section of a residential street
  answer: B
  explanation: Any intersection of public roads constitutes a legal crosswalk whether
    it is marked or not.
- id: 224
  category: penalties_and_points
  question: What is the maximum fine for failing to yield to a blind or low vision
    pedestrian?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: D
  explanation: Fines for failing to yield to a blind or low vision pedestrian may
    result in a fine up to $1,000.
- id: 225
  category: sharing_the_road
  question: Why should you never assume a blind pedestrian expects you to make a right
    turn on a red light?
  choices:
    A: They cannot hear your turn signal
    B: They use the sound of traffic to determine when it is safe to cross
    C: They always have the right-of-way on red lights
    D: Right turns on red are illegal when pedestrians are present
  answer: B
  explanation: Pedestrians who are blind or have low vision use the sound of traffic
    (including your engine) as a guide in determining when it is safe to cross a street,
    so never assume they will expect you to make a right turn on a red light.
- id: 226
  category: penalties_and_points
  question: What is the penalty for a first violation of failing to stop for a school
    bus with flashing red lights?
  choices:
    A: A fine up to $100 and up to 10 days license suspension
    B: A fine up to $300 and/or up to 30 days license suspension
    C: A fine up to $500 and up to 60 days license suspension
    D: A fine up to $1,000 and up to 90 days license suspension
  answer: B
  explanation: A fine of up to $300 and/or suspension of your driver’s license for
    a period up to thirty (30) days will be imposed for the first violation of this
    law.
- id: 227
  category: safe_driving_rules
  question: In which situation are you NOT required to stop for a school bus with
    flashing red lights?
  choices:
    A: When the bus is in a parking lot
    B: When the bus is on a private road
    C: When the bus is opposite your vehicle on a divided highway
    D: When you are traveling in the same direction as the bus
  answer: C
  explanation: Motorists do not have to stop for the flashing red lights of the school
    bus when the bus is opposite your vehicle on a divided highway.
- id: 228
  category: sharing_the_road
  question: What is the maximum number of bicycles that may ride side by side on the
    road?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: No more than two (2) bicycles may ride side by side.
- id: 229
  category: safe_driving_rules
  question: At what age is a person required to wear a certified bicycle helmet when
    riding on a public highway or path?
  choices:
    A: 12 years of age or younger
    B: 15 years of age or younger
    C: 18 years of age or younger
    D: All ages are required to wear a helmet
  answer: B
  explanation: Any person fifteen (15) years of age or younger riding a bicycle or
    a passenger on a bicycle on a public highway, bicycle path, or other public right-of-way
    must wear a certified bicycle helmet.
- id: 230
  category: signs_and_signals
  question: What is one purpose of a 'shared lane' marking on a roadway?
  choices:
    A: To indicate a lane exclusively for bicycles
    B: To warn motorists of an upcoming crosswalk
    C: To assist bicyclists with lateral positioning to avoid parked vehicle doors
    D: To designate a lane for slow-moving farm equipment
  answer: C
  explanation: Shared lane markings assist bicyclists with lateral positioning in
    a shared lane with on-street parallel parking in order to reduce the chance of
    a bicyclist impacting the door of a parked vehicle.
- id: 231
  category: sharing_the_road
  question: How much clearance should you allow when passing a bicyclist?
  choices:
    A: 1 to 2 feet
    B: 3 to 5 feet
    C: 6 to 8 feet
    D: At least 10 feet
  answer: B
  explanation: Allow as much clearance as possible (3-5 feet) when passing to prevent
    contact with a bicyclist and be prepared to stop suddenly if the person were to
    fall into the driver’s lane.
- id: 232
  category: sharing_the_road
  question: What should you do if a road is too narrow for cars and bicycles to travel
    side by side and a bicyclist ahead 'takes the travel lane'?
  choices:
    A: Honk your horn repeatedly until they move over.
    B: Pass them immediately on the right side.
    C: Be prepared to slow down or stop.
    D: Flash your high beams to warn them.
  answer: C
  explanation: When a road is too narrow and a bicyclist proceeds in the center of
    the road (takes the travel lane), you must be prepared to slow down or stop.
- id: 233
  category: sharing_the_road
  question: Under what circumstances may you drive in a clearly marked bicycle lane?
  choices:
    A: You may never drive in a bicycle lane, but you may cross it when turning or
      entering a driveway.
    B: You may drive in a bicycle lane if traffic is heavy and you are moving slowly.
    C: You may drive in a bicycle lane to pass a vehicle turning left.
    D: You may park in a bicycle lane for up to 15 minutes.
  answer: A
  explanation: 'The manual explicitly states: ''Do not drive in a bicycle lane. You
    may cross a bicycle lane when you are turning a corner or entering or leaving
    an alley, private road or driveway.'''
- id: 234
  category: sharing_the_road
  question: What is the definition of 'dooring'?
  choices:
    A: Tailgating a bicyclist too closely.
    B: Carelessly opening the door of a parked vehicle and colliding with a passing
      cyclist.
    C: Forcing a bicyclist off the road into a parked car.
    D: Driving through a residential neighborhood with open doors.
  answer: B
  explanation: Dooring is when the driver or passenger carelessly opens the door of
    a parked or stopped vehicle and collides with a passing cyclist.
- id: 235
  category: defensive_driving
  question: Which of the following is considered an aggressive driving behavior that
    has resulted in violence in the past?
  choices:
    A: Using high beam headlights in heavy traffic areas.
    B: Yielding the right-of-way at uncontrolled intersections.
    C: Leaving enough room to pull out when stopped in traffic.
    D: Taking breaks on long drives.
  answer: A
  explanation: The manual lists 'Using high beam headlights in heavy traffic areas'
    as a behavior that can endanger or anger other motorists and has resulted in violence.
- id: 236
  category: defensive_driving
  question: What should you do to avoid becoming a victim of aggressive driving if
    another driver continues to hassle or follow you?
  choices:
    A: Pull over to the side of the road and confront them.
    B: Drive to the nearest police station or busy place to get help.
    C: Speed up and swerve suddenly to lose them.
    D: Make eye contact to show you are not intimidated.
  answer: B
  explanation: To avoid becoming a victim of aggressive driving, if a driver continues
    to hassle or follow you, drive to the nearest police station or busy place to
    get help.
- id: 237
  category: safe_driving_rules
  question: What is the rule for turning right at a red light in Rhode Island?
  choices:
    A: You are required to turn right on red if there is no sign posted.
    B: You may turn right on red without stopping if the intersection is clear.
    C: You are permitted to turn right on red after a full stop unless a 'no turn
      on red' sign is posted.
    D: Right turns on red are strictly prohibited in the state.
  answer: C
  explanation: Drivers in Rhode Island are permitted, but not required, to turn right
    at a red light after a full stop unless there is a 'no turn on red' sign posted,
    and must yield to traffic and pedestrians.
- id: 238
  category: safe_driving_rules
  question: Children under what age must be transported in a federally approved restraint
    seat in the back seat of the vehicle?
  choices:
    A: Less than 5 years old
    B: Less than 7 years old
    C: Less than 9 years old
    D: Less than 12 years old
  answer: B
  explanation: Children who are less than seven (7) years old must be transported
    in a federally approved restraint seat in the back seat of the vehicle.
- id: 239
  category: safe_driving_rules
  question: What is the minimum distance you must begin to use your directional signals
    before making a turn or changing lanes?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You must begin to use your directional signals a minimum distance of
    at least 100 feet before making turns or changing lanes.
- id: 240
  category: safe_driving_rules
  question: When two vehicles approach an uncontrolled intersection from different
    streets at approximately the same time, who has the right-of-way?
  choices:
    A: The vehicle on the right must yield to the vehicle on the left.
    B: The vehicle on the left must yield to the vehicle on the right.
    C: The vehicle traveling faster has the right-of-way.
    D: The vehicle that sounds its horn first has the right-of-way.
  answer: B
  explanation: In the absence of signs or signals, when two vehicles approach an intersection
    at approximately the same time, the driver of the vehicle on the left must yield
    the right-of-way to the vehicle on the right.
- id: 241
  category: safe_driving_rules
  question: In addition to nighttime and low visibility conditions, when else does
    Rhode Island law require you to turn on your headlights?
  choices:
    A: Only when driving on the interstate highway.
    B: Anytime the vehicle's windshield wipers are on.
    C: Only when driving through a school zone.
    D: Anytime you are driving a commercial vehicle.
  answer: B
  explanation: The manual states that headlights must be on anytime wipers are on.
- id: 242
  category: penalties_and_points
  question: What is the fine for failing to carry proof of motor vehicle liability
    insurance in your vehicle?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Proof of insurance ($500 fine for failure to comply) must be carried
    in your vehicle along with the registration at all times.
- id: 243
  category: sharing_the_road
  question: What are you required by law to do when approaching a horse being driven
    or ridden upon a public highway?
  choices:
    A: Sound your horn to alert the rider of your presence.
    B: Maintain your speed but move to the opposite side of the road.
    C: Reduce your speed and refrain from sounding a horn.
    D: Flash your headlights to warn the horse.
  answer: C
  explanation: You are required by law to reduce your speed and refrain from sounding
    a horn or causing other loud noises when approaching a horse being driven or ridden
    upon a public highway.
- id: 244
  category: safe_driving_rules
  question: What is the Rhode Island law regarding wearing earphones or headsets while
    driving?
  choices:
    A: They are allowed only if listening to GPS directions.
    B: They are allowed if only worn in one ear.
    C: They are allowed on highways but not within city limits.
    D: Drivers are not allowed to operate a motor vehicle on a public highway while
      wearing them.
  answer: D
  explanation: Drivers in Rhode Island are not allowed to operate a motor vehicle
    upon a public highway while wearing earphones or headsets.
- id: 245
  category: driver_responsibility
  question: If you are stopped by a law enforcement officer at night, what are you
    required to do regarding your vehicle's lighting?
  choices:
    A: Turn off all lights to avoid blinding the officer.
    B: Turn on the vehicle's interior lights and leave them on.
    C: Flash your high beams to acknowledge the officer.
    D: Turn on your hazard lights and turn off your headlights.
  answer: B
  explanation: If stopped by a law enforcement officer at night, a motorist is required
    to turn on the vehicle's interior lights and leave them on until the officer allows
    the driver to drive off.
- id: 246
  category: driver_responsibility
  question: What must a motorist do if stopped by a law enforcement officer at night?
  choices:
    A: Turn off the engine and step out of the vehicle immediately.
    B: Turn on the vehicle's interior lights and leave them on.
    C: Flash the headlights to acknowledge the officer.
    D: Turn off all lights to avoid blinding the officer.
  answer: B
  explanation: According to the manual, if stopped by a law enforcement officer at
    night, a motorist is required to turn on the vehicle's interior lights and leave
    them on until the officer allows the driver to drive off.
- id: 247
  category: penalties_and_points
  question: What is the fine for a safety belt or child restraint violation?
  choices:
    A: $50.00
    B: $75.00
    C: $85.00
    D: $195.00
  answer: C
  explanation: The fine schedule states that a safety belt/child restraint violation
    carries an $85.00 fine.
- id: 248
  category: alcohol_drugs_health
  question: If you drink even just a little alcohol, how much greater are your chances
    of being in a collision compared to if you do not drink?
  choices:
    A: Two times greater
    B: Four times greater
    C: Seven times greater
    D: Ten times greater
  answer: C
  explanation: The manual states, "If you drink, even just a little, your chances
    of a collision are seven (7) times greater than if you don't drink."
- id: 249
  category: alcohol_drugs_health
  question: Upon reaching the brain, what does alcohol affect first?
  choices:
    A: Vision and hearing
    B: Control of judgment and skill
    C: Heart rate and breathing
    D: Muscle memory and digestion
  answer: B
  explanation: The manual explains that alcohol reaches your brain in seconds, and
    upon reaching the brain, it affects first the control of your judgment and skill.
- id: 250
  category: alcohol_drugs_health
  question: What is the only thing that will reduce the effects of alcohol and sober
    you up?
  choices:
    A: Drinking black coffee
    B: Eating a heavy meal
    C: Getting fresh air and exercise
    D: Time
  answer: D
  explanation: The manual states, "After drinking, there is nothing that will reduce
    the effects of alcohol except time. Coffee, food, fresh air, or exercise might
    wake an intoxicated person up, but it will not sober them up."
- id: 251
  category: alcohol_drugs_health
  question: Which of the following contains about the same amount of alcohol as a
    12-ounce container of beer?
  choices:
    A: A 4 to 5 ounce glass of wine
    B: A 24-ounce tallboy of beer
    C: A 3-ounce shot of hard liquor
    D: A half-bottle of wine
  answer: A
  explanation: A 12 ounce container of beer, a 4 to 5 ounce glass of wine and a 1
    to 1 1/2 ounce shot of hard liquor have about the same amount of alcohol.
- id: 252
  category: alcohol_drugs_health
  question: What happens when you combine alcohol with another drug, such as an allergy
    or cold remedy?
  choices:
    A: The alcohol cancels out the effects of the drug.
    B: It causes a synergistic (additive) effect where the effects are multiplied.
    C: The body processes the alcohol twice as fast.
    D: It improves your alertness and driving ability.
  answer: B
  explanation: Combining alcohol with another drug can cause a synergistic (additive)
    effect, whereby the effects are multiplied, posing a serious hazard to your health
    and driving ability.
- id: 253
  category: alcohol_drugs_health
  question: In Rhode Island, a person of any age is considered legally intoxicated
    and will be charged with Driving Under the Influence (DUI) if their Blood Alcohol
    Concentration (BAC) is at or above what level?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Any person of any age with a BAC of .08% or more is intoxicated and
    will be charged with drunk driving – Driving Under the Influence (DUI).
- id: 254
  category: alcohol_drugs_health
  question: 'A driver under the age of 21 will be charged with Driving While Impaired
    (DWI) if their Blood Alcohol Concentration (BAC) is:'
  choices:
    A: 0.00% to 0.01%
    B: 0.02% but less than 0.08%
    C: 0.08% or higher
    D: 0.10% or higher
  answer: B
  explanation: Any person under the age of twenty-one (21) with a BAC of .02% but
    less than .08% is impaired and will be charged with Driving While Impaired (DWI).
- id: 255
  category: license_system
  question: What does the Implied Consent law mean for drivers in Rhode Island?
  choices:
    A: You consent to having your vehicle searched at any traffic stop.
    B: You consent to a chemical test of your blood, breath, or urine if arrested
      for suspected DWI.
    C: You consent to paying all traffic fines within 30 days.
    D: You consent to organ donation if involved in a fatal crash.
  answer: B
  explanation: Implied consent means that any person who drives a motor vehicle in
    Rhode Island has given consent to a chemical (breathalyzer-blood-urine) test to
    determine the amount of alcohol/drug in his/her blood if arrested for suspected
    DWI.
- id: 256
  category: penalties_and_points
  question: What is the minimum license suspension period if you refuse to take a
    chemical test (breathalyzer) in Rhode Island?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: If you refuse to take a chemical test, your license will be suspended
    for a minimum of six months.
- id: 257
  category: penalties_and_points
  question: What is the minimum fine for speeding 11 mph in excess of the posted speed
    limit?
  choices:
    A: $75.00
    B: $85.00
    C: $150.00
    D: $195.00
  answer: D
  explanation: The fine schedule lists speeding 11 mph in excess of the posted speed
    limit with a fine of $10.00 per mile over as having a $195.00 minimum fine.
- id: 258
  category: alcohol_drugs_health
  question: According to studies, how does smoking marijuana affect a driver?
  choices:
    A: It improves their ability to adjust to headlight glare.
    B: It makes them drive faster and more aggressively.
    C: They make more mistakes and have more trouble adjusting to headlight glare.
    D: It increases their alertness and reaction time.
  answer: C
  explanation: Studies have shown that people who drive after smoking marijuana make
    more mistakes, get arrested for traffic violations more, and have more trouble
    adjusting to headlight glare.
- id: 259
  category: penalties_and_points
  question: For a driver under 18 years of age, what is the license suspension period
    for a first violation of Driving While Impaired (DWI) with a BAC of 0.02% - 0.08%?
  choices:
    A: 1 to 3 months
    B: 3 to 6 months
    C: 6 to 12 months
    D: License suspension until age 21
  answer: C
  explanation: The penalties section states that for a driver under 18 years of age,
    a 1st Violation of Driving While Impaired (DWI) with a BAC of 0.02% - 0.08% results
    in a 6 – 12 month license suspension.
- id: 260
  category: alcohol_drugs_health
  question: Is it legal for a driver who is 21 years of age or older to consume an
    alcoholic beverage while driving?
  choices:
    A: Yes, as long as their BAC remains under 0.08%.
    B: Yes, if they are driving on a private road.
    C: No, it is against the law for a driver of any age to consume an alcoholic beverage
      while driving.
    D: No, unless they are accompanied by a licensed passenger.
  answer: C
  explanation: The manual explicitly states, 'IT IS AGAINST THE LAW FOR A DRIVER OF
    ANY AGE TO CONSUME AN ALCOHOLIC BEVERAGE WHILE DRIVING.'
- id: 261
  category: penalties_and_points
  question: What is the classification of a third or subsequent DUI violation (BAC
    0.08% - 0.15%) within a 5-year period?
  choices:
    A: Misdemeanor
    B: Felony
    C: Civil violation
    D: Traffic infraction
  answer: B
  explanation: A 3rd or subsequent DUI violation (BAC 0.08% - 0.15% or unknown) within
    a 5-year period is classified as a Felony.
- id: 262
  category: penalties_and_points
  question: If an adult driver commits a first violation for Chemical Test Refusal,
    what is the mandatory license suspension period?
  choices:
    A: 30 to 90 days
    B: 3 to 6 months
    C: 6 months to 1 year
    D: 1 to 2 years
  answer: C
  explanation: A first violation for Chemical Test Refusal for adults results in a
    6 month to 1 year license suspension.
- id: 263
  category: penalties_and_points
  question: What happens to a driver's vehicle upon a third or subsequent DUI violation
    within a 5-year period?
  choices:
    A: It is impounded for 30 days.
    B: It is seized by the state.
    C: It is towed at the owner's expense.
    D: It must be sold within 90 days.
  answer: B
  explanation: For a 3rd or subsequent DUI violation within a 5-year period, the penalties
    include 'Seizure of the vehicle by the state.'
- id: 264
  category: alcohol_drugs_health
  question: Under what condition may a person between the ages of 16 and 21 legally
    transport unopened alcoholic beverages in a vehicle without a parent or legal
    guardian?
  choices:
    A: If they are driving to a private party.
    B: If they are transporting the beverages in the course of their employment.
    C: If the beverages are stored in the trunk of the vehicle.
    D: If they have written permission from a parent.
  answer: B
  explanation: R.I.G.L. 3-8-9 states the transportation restriction does not apply
    to persons between 16 and 21 who are transporting unopened alcoholic beverages
    in the course of their employment.
- id: 265
  category: safe_driving_rules
  question: What should you do if you are involved in a minor collision?
  choices:
    A: Leave the vehicles exactly where they are until police arrive.
    B: Drive your vehicle off to the side of the roadway if possible and notify the
      police.
    C: Exchange insurance information and leave without notifying the police.
    D: Wait for the other driver to report the collision.
  answer: B
  explanation: 'The manual states: ''In the event of a minor collision, if possible,
    drive your vehicle off to the side of the roadway and notify the police.'''
- id: 266
  category: safe_driving_rules
  question: If you collide with an unattended parked vehicle, what are you required
    to do?
  choices:
    A: Wait by the vehicle until the owner returns.
    B: Leave your name and address in writing securely attached to the vehicle and
      report it to the police.
    C: Take a photograph of the damage and leave the scene.
    D: Only report the collision to your insurance company.
  answer: B
  explanation: If you collide with a parked vehicle, you must leave your name and
    address in writing attached securely to the vehicle and report the collision to
    the nearest state or local police immediately.
- id: 267
  category: safe_driving_rules
  question: Under which of the following circumstances is a police report explicitly
    required after a collision?
  choices:
    A: When property damage is over $500.
    B: When property damage is over $1,000.
    C: Only when someone is injured.
    D: Only when both vehicles are severely damaged.
  answer: B
  explanation: A police report is required if someone is injured, property damage
    is over $1,000, or you hit an unattended vehicle.
- id: 268
  category: penalties_and_points
  question: What is the penalty for a first violation of Driving Under the Influence
    (DUI) resulting in death?
  choices:
    A: 1 to 5 years in prison and a 2-year license revocation
    B: 5 to 15 years in prison and a 5-year license revocation
    C: Up to 1 year in prison and a 1-year license suspension
    D: 10 to 20 years in prison and a lifetime license revocation
  answer: B
  explanation: A first violation for DUI Death Resulting is a Felony that carries
    5 - 15 years in prison, a 5-year license revocation, a $5,000 - $10,000 fine,
    and alcohol/drug treatment.
- id: 269
  category: defensive_driving
  question: Which of the following is listed in the manual as a common cause of collisions?
  choices:
    A: Driving with the interior lights on
    B: Driving too close to the vehicle in front of you (tailgating)
    C: Using the radio while driving
    D: Driving below the posted speed limit
  answer: B
  explanation: The manual lists 'Driving too close to the vehicle in front of you
    – tailgating' as one of the most common causes of motor vehicle collisions.
- id: 270
  category: penalties_and_points
  question: What is the minimum driver's license suspension period for an underage
    person (under 21) found in possession of an alcoholic beverage?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: B
  explanation: According to R.I.G.L. 3-8-10, any person under 21 in possession of
    an alcoholic beverage shall be subject to a minimum sixty (60) day suspension
    of his or her driver’s license.
- id: 271
  category: penalties_and_points
  question: 'Leaving the scene of a collision without properly identifying yourself
    is commonly known as:'
  choices:
    A: Reckless driving
    B: Hit and run
    C: Evading police
    D: Aggressive driving
  answer: B
  explanation: 'The manual states: ''Severe penalties are imposed against drivers
    who choose to leave the scene of a collision (‘hit and run’) without properly
    identifying themselves.'''
- id: 272
  category: safe_driving_rules
  question: When recording information after a collision, which of the following details
    should you note about the other driver?
  choices:
    A: Their employer's name and phone number
    B: Their name, address, license, insurance carrier, and registration
    C: Their social security number and date of birth
    D: Their vehicle's maintenance history
  answer: B
  explanation: The manual advises recording 'The name, address, license, insurance
    carrier and policy number, and registration state and number of the other driver.'
- id: 273
  category: safe_driving_rules
  question: When pulled over by a police officer, what is the proper procedure regarding
    your documents?
  choices:
    A: Hand the officer your wallet so they can remove the license.
    B: Have them ready in your hand before pulling over.
    C: Wait for the officer to ask for your license, registration, and insurance card,
      and take them out of any holder.
    D: Step out of the vehicle to hand the documents to the officer.
  answer: C
  explanation: 'The manual advises: ''Wait for him/her to ask for your license, registration
    and insurance card... Do not hand the officer your license or other documents
    in a holder. Take them out.'''
- id: 274
  category: penalties_and_points
  question: If a police officer asks you to sign a traffic citation, what does your
    signature mean?
  choices:
    A: It is an admission of guilt.
    B: It is a waiver of your right to a court hearing.
    C: It is solely an acknowledgement that you have received the citation.
    D: It means you agree to pay the fine immediately.
  answer: C
  explanation: 'According to the manual: ''If asked to sign a citation, do so. It
    is not an admission of guilt, solely an acknowledgement that you have received
    the citation.'''
- id: 275
  category: vehicle_information
  question: What is the minimum legal tire tread depth allowed in Rhode Island?
  choices:
    A: 1/16 of an inch
    B: 2/32 of an inch
    C: 3/32 of an inch
    D: 4/32 of an inch
  answer: C
  explanation: 'The manual states: ''You may not drive on a tire that has less than
    3/32 of an inch of tread (measure the depth of the tread with a penny).'''
- id: 276
  category: vehicle_information
  question: When is the best time to measure your tire pressure to get an accurate
    reading?
  choices:
    A: Immediately after driving on the highway
    B: While your tire is cold
    C: During the hottest part of the day
    D: While the engine is running
  answer: B
  explanation: 'The manual advises: ''Measure tire pressure while your tire is cold
    to get an accurate reading.'''
- id: 277
  category: vehicle_information
  question: 'According to the manual, lap and shoulder belts working together reduce
    the risk of death and serious injury by almost:'
  choices:
    A: 25%
    B: 50%
    C: 75%
    D: 90%
  answer: B
  explanation: 'The manual states: ''Lap and shoulder belts working together reduce
    the risk of death and serious injury by almost 50%.'''
- id: 278
  category: driver_responsibility
  question: If you are under 18 years old and wish to be an organ and tissue donor,
    what is required?
  choices:
    A: A special medical examination
    B: A fee paid to the DMV
    C: Parental consent
    D: A court order
  answer: C
  explanation: 'The manual notes regarding organ donation: ''If you are under 18 years
    old, you need parental consent.'''
- id: 279
