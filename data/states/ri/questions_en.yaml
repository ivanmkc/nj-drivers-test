  explanation: According to the manual, 'being awake for 18 hours produces impairment
    approximately equal to a blood alcohol concentration (BAC) of .05 percent.'
- id: 90
  category: alcohol_drugs_health
  question: 'If a driver remains awake for 24 hours, their impairment rises to a level
    roughly equal to a blood alcohol concentration (BAC) of:'
  choices:
    A: .04 percent
    B: .05 percent
    C: .08 percent
    D: .10 percent
  answer: D
  explanation: The manual states that 'After 24 hours awake, the impairment rises
    to that roughly equal to a BAC of .10 percent.'
- id: 91
  category: driver_responsibility
  question: Drivers under the age of 30 are involved in what fraction of all fall-asleep
    crashes?
  choices:
    A: Over one-quarter
    B: Over one-third
    C: Over one-half
    D: Over two-thirds
