  explanation: The manual notes that 'Drivers under age 30 are involved in over two-thirds
    of all fall-asleep crashes.'
- id: 92
  category: driver_responsibility
  question: Working the night shift increases a driver's collision risk by nearly
    how much?
  choices:
    A: Two times
    B: Four times
    C: Six times
    D: Ten times
  answer: C
  explanation: According to the manual, 'Working the night shift increases collision
    risk by nearly six times.'
- id: 93
  category: defensive_driving
  question: Which of the following driving environments is most likely to cause a
