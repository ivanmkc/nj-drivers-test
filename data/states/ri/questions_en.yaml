  answer: B
  explanation: The manual states to keep in mind that sleeping for more than 20 minutes
    can make you groggy for at least five minutes after awakening.
- id: 100
  category: safe_driving_rules
  question: If you must stop along the roadway to rest, which of the following is
    a recommended practice?
  choices:
    A: Leave your engine running for climate control.
    B: Turn on your high-beam headlights.
    C: Turn on your parking lights and turn off other electrical equipment.
    D: Roll your windows all the way down for fresh air.
  answer: C
  explanation: When stopping along the roadway to rest, the manual advises to lock
