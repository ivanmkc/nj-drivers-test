- id: 101
  category: driver_responsibility
  question: 'A major study of driver performance indicates that the most critical
    factor in a driving record, regardless of training, is:'
  choices:
    A: The driver's age and gender.
    B: The mechanical condition of the vehicle.
    C: An individual's self-awareness and ability to interact with other people.
    D: The amount of time spent in driver's education classes.
  answer: C
  explanation: According to the manual, a major study indicates that the most critical
    factor in a driving record is an individual's self-awareness and ability to interact
    with other people.
- id: 102
  category: defensive_driving
  question: How can strong emotions like anger affect your driving?
  choices:
    A: They improve your reaction time in emergency situations.
    B: They help you focus better on the road ahead.
    C: They can draw your attention away from driving and impair your ability to process
      information.
    D: They only affect your driving if you are also physically tired.
  answer: C
  explanation: The manual explains that emotions can draw a driver's attention away
    from driving, reduce concentration, and impair the ability to process information
    and take necessary actions.
- id: 103
  category: defensive_driving
  question: Which of the following behaviors is specifically defined as an example
    of 'road rage' rather than just aggressive driving?
  choices:
    A: Exceeding the speed limit.
    B: Following another vehicle too closely.
    C: Failing to obey traffic controls.
    D: Attempting to ram another vehicle.
  answer: D
  explanation: The manual defines road rage as using the vehicle or a weapon to threaten
    or cause harm, giving examples such as throwing objects, yelling at a specific
    user, and attempting to ram another vehicle.
- id: 104
  category: driver_responsibility
  question: The manual states that 'emotions are contagious' in traffic situations.
    What does this mean for drivers?
  choices:
    A: You can catch an illness from a sick driver if your windows are down.
    B: Smiles and courtesy can spread among drivers just as easily as upsets and anger
      can.
    C: You should always drive with passengers to keep your mood elevated.
    D: Road rage is a viral infection that affects the brain.
  answer: B
  explanation: Under the guideline 'Emotions are contagious,' the manual notes that
    just as one person's anger can spread to others, smiles and courtesy can be spread
    among drivers just as easily.
- id: 105
  category: defensive_driving
  question: If you experience a temporary emotional upset, what is the best course
    of action before driving?
  choices:
    A: Drive immediately to work through your frustration.
    B: Wait until the strength of the emotion has faded before you drive.
    C: Drive slightly faster than normal to reach your destination sooner.
    D: Turn on loud, aggressive music to vent your anger.
  answer: B
  explanation: The manual advises to 'Delay driving when upset' and wait until the
    strength of the emotion has faded so that you are more likely to drive safely
    and courteously.
- id: 106
  category: safe_driving_rules
  question: To help prevent aggressive driving and road rage, what is the proper use
    of the far left lane?
  choices:
    A: Use it for all normal driving to avoid merging traffic.
    B: Stay out of the far left lane except when passing.
    C: Drive in it only when you are traveling below the speed limit.
    D: Use it exclusively for making right turns.
  answer: B
  explanation: 'To prevent aggressive driving, the manual instructs drivers: ''Do
    not block the passing lane. Except when passing, stay out of the far left lane.'''
- id: 107
  category: defensive_driving
  question: How should you use your horn to avoid provoking aggressive driving in
    others?
  choices:
    A: Use one long, continuous blast to ensure you are heard.
    B: Honk repeatedly whenever someone slows down in front of you.
    C: Use it sparingly, as a couple of short taps may be perceived as less aggressive.
    D: Never use your horn under any circumstances.
  answer: C
  explanation: The manual suggests using your horn sparingly, noting that 'A couple
    of short taps may be perceived as less aggressive than one long blast.'
- id: 108
  category: safe_driving_rules
  question: What is the proper etiquette for using high-beam headlights to avoid angering
    other drivers?
  choices:
    A: Keep them on at all times during the night.
    B: Return to low-beam headlights as soon as you detect an oncoming vehicle.
    C: Flash them rapidly when following a slow-moving vehicle.
    D: Use them when driving directly behind another vehicle to illuminate their path.
  answer: B
  explanation: 'The manual states: ''When using high-beam headlights, return to using
    low-beam headlights as soon as you detect an oncoming vehicle. Do not drive behind
    another vehicle with your high-beam headlights on.'''
- id: 109
  category: defensive_driving
  question: If you are confronted by a driver displaying aggressive behaviors toward
    you, what should you do regarding eye contact?
  choices:
    A: Stare them down to show you are not intimidated.
    B: Avoid eye contact with the other driver or passengers.
    C: Make brief eye contact and shake your head.
    D: Roll down your window and look directly at them while apologizing.
  answer: B
  explanation: When responding to aggressive driving, the manual explicitly advises
    to 'Avoid eye contact with the other driver or passengers.'
- id: 110
  category: defensive_driving
  question: If another driver challenges you on the road, why should you remain inside
    your vehicle?
  choices:
    A: It is illegal to step out of your vehicle on a public road.
    B: Your vehicle offers you protection, just as it does in a crash.
    C: Getting out of the vehicle will automatically result in a license suspension.
    D: The other driver might steal your vehicle.
  answer: B
  explanation: 'The manual advises: ''Do not get out of your vehicle — it offers protection.''
    It further explains that just as in a crash, your vehicle can give you protection,
    so you should not lose that protection by getting out.'
- id: 111
