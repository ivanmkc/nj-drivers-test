metadata:
  source: 2025 Rhode Island Driver's Manual
  total_questions: 235
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Rhode Island, what is the minimum age an individual must be to apply
    for a Limited Instructional Permit?
  choices:
    A: 15 years old
    B: 15 years and 6 months old
    C: 16 years old
    D: 17 years old
  answer: C
  explanation: According to the Rhode Island Driver's Manual, an applicant must be
    at least 16 years old but less than 18 years old to apply for a Limited Instructional
    Permit after completing the required driver education course.
- id: 2
  category: license_system
  question: To qualify for a Rhode Island Limited Instructional Permit, a person under
    18 must complete a driver education course consisting of how many hours?
  choices:
    A: 24 hours
    B: 30 hours
    C: 33 hours
    D: 40 hours
  answer: C
  explanation: Rhode Island law requires minors to complete a 33-hour driver education
    course certified by the Community College of Rhode Island (CCRI) to obtain a permit.
- id: 3
  category: license_system
  question: How long must a Rhode Island driver hold a Limited Instructional Permit
    before they are eligible to take the road test for a Limited Provisional License?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: A person must hold a Limited Instructional Permit for at least six
    months without any convictions or moving violations before applying for a Limited
    Provisional License.
- id: 4
  category: license_system
  question: Under the Rhode Island GDL system, a driver with a Limited Provisional
    License may not operate a vehicle between which hours, unless for work or school?
  choices:
    A: 10:00 PM and 5:00 AM
    B: 11:00 PM and 6:00 AM
    C: 12:00 AM and 4:00 AM
    D: 1:00 AM and 5:00 AM
  answer: D
  explanation: Rhode Island's Limited Provisional License restricts driving between
    1:00 AM and 5:00 AM, except when traveling to or from work or a school-sponsored
    activity.
- id: 5
  category: license_system
  question: During the first 12 months of holding a Rhode Island Limited Provisional
    License, how many passengers under the age of 21 (who are not family members)
    is the driver allowed to transport?
  choices:
    A: No passengers
    B: One passenger
    C: Two passengers
    D: Three passengers
  answer: B
  explanation: For the first year of a Limited Provisional License, the driver is
    limited to no more than one passenger under age 21, excluding immediate family
    or household members.
- id: 6
  category: license_system
  question: What is the minimum age to obtain a Full Operator's License in Rhode Island?
  choices:
    A: 17 years old
    B: 17 years and 6 months old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: A driver is eligible for a Full Operator's License if they are at least
    17 years and 6 months old and have held a Limited Provisional License for at least
    12 months without violations.
- id: 7
  category: license_system
  question: If you change your address within Rhode Island, you must notify the DMV
    in writing within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Rhode Island law requires that any person holding a license or registration
    must notify the DMV of an address change within 10 days.
- id: 8
  category: license_system
  question: What are the minimum liability insurance coverage requirements for property
    damage in Rhode Island?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Rhode Island requires minimum liability coverage of $25,000 for property
    damage, $25,000 for bodily injury to one person, and $50,000 for bodily injury
    to two or more people.
- id: 9
  category: license_system
  question: A Rhode Island Limited Instructional Permit is valid for how long, or
    until the driver reaches age 18?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: A Limited Instructional Permit is valid for one year or until the applicant
    reaches the age of 18, whichever comes first.
- id: 10
  category: license_system
  question: When driving with a permit in Rhode Island, the supervising driver must
    be at least 21 years old and have held a license for at least how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: D
  explanation: The supervising driver must be at least 21 years old, have a valid
    license, and have been a licensed driver for at least five years.
- id: 11
  category: license_system
  question: What is the total number of supervised driving hours a permit holder must
    log before applying for a provisional license in Rhode Island?
  choices:
    A: 30 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (10 at night)
    D: 60 hours (15 at night)
  answer: C
  explanation: Rhode Island requires a parent or guardian to certify that the permit
    holder has completed 50 hours of driving, with at least 10 of those hours being
    at night.
- id: 12
  category: license_system
  question: New residents to Rhode Island must apply for a RI driver's license within
    how many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the RI DMV, new residents must obtain a Rhode Island driver's
    license within 30 days of establishing residency.
- id: 13
  category: license_system
  question: In Rhode Island, if a driver under age 18 is caught using a cell phone
    (handheld or hands-free) while driving, what is the fine for a first offense?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Drivers under 18 are prohibited from using cell phones while driving.
    A first offense results in a $100 fine and may lead to license suspension.
- id: 14
  category: license_system
  question: At what age can a Rhode Island resident apply for a driver's permit without
    being required to take a 33-hour driver education course?
  choices:
    A: 17 years old
    B: 18 years old
    C: 19 years old
    D: 21 years old
  answer: B
  explanation: The 33-hour driver education requirement only applies to applicants
    under the age of 18. Those 18 and older are not required to take the course, though
    they must still pass the written and road tests.
- id: 15
  category: license_system
  question: Which of the following documents is NOT acceptable as proof of Rhode Island
    residency for a REAL ID license?
  choices:
    A: A utility bill dated within 60 days
    B: A bank statement dated within 60 days
    C: A piece of mail addressed to a P.O. Box
    D: A valid RI voter registration card
  answer: C
  explanation: Proof of residency must show a physical Rhode Island address; a P.O.
    Box is not acceptable as proof of a physical residence for DMV licensing purposes.
- id: 16
  category: license_system
  question: In Rhode Island, a standard operator's license (Class D) for an individual
    under the age of 75 is typically valid for how many years?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: C
  explanation: According to the RI DMV, a standard driver's license is valid for a
    period of five years. For individuals over the age of 75, the license is valid
    for only two years.
- id: 17
  category: license_system
  question: What is the minimum Rhode Island liability insurance requirement for bodily
    injury to or death of two or more persons in any one accident?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $15,000
  answer: B
  explanation: 'Rhode Island law requires 25/50/25 coverage: $25,000 for bodily injury
    per person, $50,000 for bodily injury per accident (two or more people), and $25,000
    for property damage.'
- id: 18
  category: license_system
  question: To meet the vision requirements for a Rhode Island driver's license, an
    applicant must have at least what visual acuity in at least one eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Rhode Island requires applicants to have 20/40 vision in at least one
    eye, with or without corrective lenses.
- id: 19
  category: license_system
  question: If you fail the Rhode Island road test, how many days must you wait before
    you are eligible to take the test again for the first time?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: If an applicant fails the RI road test, they must wait at least 30
    days before their next attempt. Subsequent failures may require longer wait periods.
- id: 20
  category: license_system
  question: A Rhode Island Class D license allows you to operate a vehicle with a
    Gross Vehicle Weight Rating (GVWR) of up to how many pounds?
  choices:
    A: 10,000 lbs
    B: 15,000 lbs
    C: 26,000 lbs
    D: 33,000 lbs
  answer: C
  explanation: A Class D license in Rhode Island permits the operation of any vehicle
    with a GVWR of 26,000 lbs. or less, provided it is not used for hire or to transport
    hazardous materials.
- id: 21
  category: license_system
  question: Under Rhode Island's 'Implied Consent' law, by operating a motor vehicle,
    you have agreed to what?
  choices:
    A: Keep your vehicle in good mechanical condition
    B: Carry at least three passengers at all times
    C: Take a chemical test to determine your BAC if requested by an officer
    D: Allow any police officer to search your vehicle without a warrant
  answer: C
  explanation: The Implied Consent law means that by driving in RI, you have given
    consent to a chemical test (breath, blood, or urine) to determine your Blood Alcohol
    Concentration (BAC).
- id: 22
  category: license_system
  question: To have the 'Veteran' designation placed on a Rhode Island driver's license,
    what document must be presented to the DMV?
  choices:
    A: A letter from the Governor
    B: A DD-214 showing honorable discharge
    C: A current military ID card only
    D: A birth certificate
  answer: B
  explanation: Rhode Island law allows veterans to have a 'Veteran' designation on
    their license if they provide a DD-214 or equivalent documentation showing an
    honorable discharge.
- id: 23
  category: license_system
  question: In Rhode Island, how often must a motor vehicle undergo a safety and emissions
    inspection?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Only when the vehicle is sold
  answer: B
  explanation: Most vehicles in Rhode Island are required to undergo a safety and
    emissions inspection every two years.
- id: 24
  category: license_system
  question: For an applicant over the age of 18, a Rhode Island Instruction Permit
    is valid for how long?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until the driver turns 21
  answer: B
  explanation: For individuals 18 years of age or older, the RI Instruction Permit
    is valid for one year.
- id: 25
  category: license_system
  question: According to Rhode Island law, what is the fee for a duplicate license
    if yours is lost or destroyed?
  choices:
    A: $10.00
    B: $25.00
    C: $50.00
    D: Free for the first replacement
  answer: B
  explanation: The Rhode Island DMV charges a $25.00 fee for a duplicate license to
    replace one that was lost, stolen, or destroyed.
- id: 26
  category: license_system
  question: Under the GDL system, a Rhode Island Limited Provisional License holder
    must be conviction-free of moving violations for how many months to be eligible
    for a Full Operator's License?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: To graduate to a Full Operator's License, a driver must hold the Limited
    Provisional License for at least 12 months and remain conviction-free of moving
    violations during that time.
- id: 27
  category: license_system
  question: When applying for a Rhode Island license, male applicants between the
    ages of 18 and 25 are automatically registered for what, unless they opt out?
  choices:
    A: The State Militia
    B: Jury Duty
    C: Selective Service
    D: The Organ Donor Registry
  answer: C
  explanation: Rhode Island law requires the DMV to provide the Selective Service
    System with the necessary information for male applicants between 18 and 25 to
    be registered.
- id: 28
  category: license_system
  question: If a Rhode Island driver is under 18 and receives two or more moving violation
    convictions, what is the mandatory action taken by the DMV?
  choices:
    A: A warning letter
    B: A $500 fine
    C: Mandatory attendance at a hearing and potential license suspension
    D: Requirement to retake the written exam only
  answer: C
  explanation: For drivers under 18, two or more moving violations will result in
    a mandatory interview/hearing with a DMV official, which can lead to license suspension.
- id: 29
  category: license_system
  question: Which of the following is a requirement for a Rhode Island resident to
    register to vote through the 'Motor Voter' program at the DMV?
  choices:
    A: Must be at least 16 years old (to pre-register)
    B: Must have a perfect driving record
    C: Must have lived in RI for at least 5 years
    D: Must own a vehicle registered in RI
  answer: A
  explanation: Rhode Island allows residents to register to vote at the DMV. You can
    pre-register at age 16, though you cannot vote until you are 18.
- id: 30
  category: license_system
  question: In Rhode Island, a person who has a 'Commercial Driver's License' (CDL)
    is held to a stricter BAC limit of what while operating a commercial vehicle?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: While the legal limit for standard drivers is 0.08%, the limit for
    CDL holders operating a commercial vehicle in Rhode Island is 0.04%.
- id: 31
  category: driver_testing
  question: In Rhode Island, what is the legal Blood Alcohol Concentration (BAC) limit
    for drivers age 21 or older?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: According to Rhode Island law, it is illegal for anyone age 21 or older
    to operate a motor vehicle with a BAC of 0.08% or higher.
- id: 32
  category: driver_testing
  question: Unless otherwise posted, what is the speed limit in a school zone in Rhode
    Island?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: In Rhode Island, the speed limit in a school zone is 20 mph unless
    otherwise posted.
- id: 33
  category: driver_testing
  question: In Rhode Island, you are prohibited from parking within how many feet
    of a fire hydrant?
  choices:
    A: 8 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: A
  explanation: Rhode Island law states that you may not park a vehicle within 8 feet
    of a fire hydrant.
- id: 34
  category: driver_testing
  question: When intending to turn, a driver in Rhode Island must signal at least
    how many feet before making the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Rhode Island law requires drivers to give a continuous signal for at
    least 100 feet before turning.
- id: 35
  category: driver_testing
  question: When a school bus is stopped with its red lights flashing and stop arm
    extended, Rhode Island drivers must stop at least how many feet away from the
    bus?
  choices:
    A: 20 feet
    B: 30 feet
    C: 50 feet
    D: 100 feet
  answer: C
  explanation: Drivers in Rhode Island must stop at least 50 feet away from a school
    bus that is loading or unloading passengers with red lights flashing.
- id: 36
  category: driver_testing
  question: According to Rhode Island law, a child must be properly restrained in
    a child safety seat if they are under what age and height?
  choices:
    A: Under 6 years old and less than 50 inches tall
    B: Under 8 years old and less than 57 inches tall
    C: Under 10 years old and less than 60 inches tall
    D: Under 12 years old and less than 62 inches tall
  answer: B
  explanation: Rhode Island law requires children under 8 years of age who weigh less
    than 80 pounds and are less than 57 inches tall to be in a child restraint system.
- id: 37
  category: driver_testing
  question: 'In Rhode Island, an accident report must be filed with the DMV if there
    is a death, personal injury, or property damage to any one person in excess of:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: A Motor Vehicle Reparations Report must be filed within 21 days if
    an accident results in injury, death, or property damage exceeding $1,000.
- id: 38
  category: driver_testing
  question: Rhode Island law requires drivers to turn on their headlights during which
    of the following times?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: From sunset to sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when it is completely dark
  answer: C
  explanation: In Rhode Island, headlights must be turned on from 30 minutes after
    sunset to 30 minutes before sunrise, and whenever visibility is poor.
- id: 39
  category: driver_testing
  question: To maintain a safe following distance in Rhode Island, drivers are encouraged
    to use which rule?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The three-second rule
    D: The five-second rule
  answer: C
  explanation: The Rhode Island Driver's Manual recommends a three-second following
    distance to allow enough time to react to hazards.
- id: 40
  category: driver_testing
  question: Under Rhode Island's 'Implied Consent' law, if you refuse to take a chemical
    test to determine your BAC, your license will be suspended for how long for a
    first offense?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Refusal to submit to a chemical test in Rhode Island results in an
    automatic 6-month license suspension for a first offense.
- id: 41
  category: driver_testing
  question: Rhode Island's 'Move Over Law' requires drivers to do what when approaching
    a stationary emergency vehicle with flashing lights?
  choices:
    A: Stop immediately in the lane of travel
    B: Maintain speed but honk the horn
    C: Move to a non-adjacent lane or slow down if a lane change is unsafe
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The Move Over Law requires drivers to vacate the lane closest to stationary
    emergency or maintenance vehicles, or slow down if changing lanes is not possible.
- id: 42
  category: driver_testing
  question: In Rhode Island, you may not park your vehicle within how many feet of
    a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: C
  explanation: Rhode Island law prohibits parking within 20 feet of a crosswalk at
    an intersection.
- id: 43
  category: driver_testing
  question: When driving at night in Rhode Island, you must dim your high beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Rhode Island law requires drivers to dim high beams when an oncoming
    vehicle is within 500 feet.
- id: 44
  category: driver_testing
  question: 'Rhode Island law requires that you turn on your headlights whenever you
    are using your windshield wipers due to rain, snow, or sleet. This is often referred
    to as the:'
  choices:
    A: Wipers On, Lights On Law
    B: Visibility First Act
    C: Inclement Weather Mandate
    D: Clear Sight Regulation
  answer: A
  explanation: Rhode Island General Law 31-24-1 requires that headlights be turned
    on when windshield wipers are in use due to rain, sleet, or snow.
- id: 45
  category: driver_testing
  question: Under Rhode Island's 'Move Over Law,' what must a driver do when approaching
    a stationary emergency vehicle with flashing lights on a highway with two or more
    lanes moving in the same direction?
  choices:
    A: Stop completely until the emergency vehicle leaves
    B: Maintain speed but honk to alert the emergency workers
    C: Move to a lane that is not adjacent to the emergency vehicle, if it is safe
      to do so
    D: Speed up to pass the emergency vehicle as quickly as possible
  answer: C
  explanation: The Rhode Island Move Over Law (31-14-4.1) requires drivers to vacate
    the lane closest to stationary emergency vehicles, including tow trucks and highway
    maintenance vehicles, if safe to do so.
- id: 46
  category: driver_testing
  question: 'In Rhode Island, a person 21 years of age or older is considered to be
    driving under the influence (DUI) if their Blood Alcohol Concentration (BAC) is
    at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers 21 and older in Rhode Island, the legal limit for Blood
    Alcohol Concentration (BAC) is 0.08%.
- id: 47
  category: driver_testing
  question: If a Rhode Island driver under the age of 21 is caught driving with a
    Blood Alcohol Concentration (BAC) of ____ or higher, they may be charged with
    a 'Driving After Drinking' violation.
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Rhode Island has a 'Zero Tolerance' policy for minors; a BAC of 0.02%
    or higher for a driver under 21 results in significant penalties.
- id: 48
  category: driver_testing
  question: What is the fine for failing to wear a seat belt in Rhode Island for any
    passenger 13 years of age or older?
  choices:
    A: $25
    B: $40
    C: $85
    D: $100
  answer: B
  explanation: In Rhode Island, the fine for a seat belt violation is $40 per person
    who is not buckled up.
- id: 49
  category: driver_testing
  question: The Rhode Island Driver's Manual recommends using which rule to maintain
    a safe following distance behind the vehicle in front of you?
  choices:
    A: One-car-length rule
    B: Two-second rule
    C: Three-second rule
    D: Four-second rule
  answer: C
  explanation: The Rhode Island Driver's Manual recommends the 'three-second rule'
    to ensure a safe following distance under normal driving conditions.
- id: 50
  category: driver_testing
  question: In Rhode Island, you are required to signal your intention to turn at
    least how many feet before making the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Rhode Island law requires drivers to signal at least 100 feet before
    making a turn or changing lanes.
- id: 51
  category: driver_testing
  question: What is the maximum fine for a first-offense littering conviction from
    a motor vehicle in Rhode Island?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Rhode Island General Law 37-15-7 states that littering from a motor
    vehicle can result in a fine of up to $500 for a first offense.
- id: 52
  category: driver_testing
  question: If you are driving on a Rhode Island highway and you miss your exit, what
    should you do?
  choices:
    A: Stop and back up on the shoulder
    B: Make a U-turn across the median
    C: Proceed to the next exit
    D: Pull over and wait for a police escort
  answer: C
  explanation: The Rhode Island Driver's Manual states that if you miss an exit, you
    must never stop or back up; you must continue to the next exit.
- id: 53
  category: driver_responsibility
  question: In Rhode Island, if you are involved in an accident resulting in property
    damage over $1,000, you must file an accident report (SR-1) with the DMV within
    how many days?
  choices:
    A: 5 days
    B: 10 days
    C: 21 days
    D: 30 days
  answer: C
  explanation: According to the Rhode Island Driver's Manual, any accident involving
    personal injury, death, or property damage in excess of $1,000 must be reported
    to the DMV within 21 days using form SR-1.
- id: 54
  category: driver_responsibility
  question: Under Rhode Island's 'Implied Consent' law, what is the penalty for a
    first offense of refusing to submit to a chemical test (breath, blood, or urine)?
  choices:
    A: A verbal warning and a $50 fine
    B: A 6 to 12 month license suspension, a fine, and community service
    C: Mandatory 48 hours in jail
    D: Permanent revocation of the driver's license
  answer: B
  explanation: Rhode Island's Implied Consent law means that by driving, you agree
    to chemical testing. A first refusal typically results in a license suspension
    of 6 to 12 months, a fine of $200 to $500, and 10 to 60 hours of community service.
- id: 55
  category: driver_responsibility
  question: In Rhode Island, what is the specific blood alcohol concentration (BAC)
    limit for a driver under the age of 21 to be cited for driving under the influence?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Rhode Island has a 'zero tolerance' policy for minors. Any driver under
    21 with a BAC of 0.02% or higher can be charged with a DUI.
- id: 56
  category: driver_responsibility
  question: According to Rhode Island law, what is the fine for a first offense of
    failing to stop for a school bus with its red lights flashing and stop arm extended?
  choices:
    A: Up to $100
    B: Exactly $300
    C: Exactly $500
    D: Exactly $1,000
  answer: B
  explanation: In Rhode Island, the fine for a first offense of illegally passing
    a stopped school bus is $300 and/or a license suspension for up to 30 days.
- id: 57
  category: driver_responsibility
  question: Under the 'Colin Foote Act,' what can happen to a Rhode Island driver
    who is convicted of four or more specific moving violations within an 18-month
    period?
  choices:
    A: They are required to buy a new car
    B: They face a fine of up to $1,000 and possible license revocation
    C: They must retake the written permit test only
    D: No additional penalties are applied beyond the standard fines
  answer: B
  explanation: The Colin Foote Act targets repeat offenders. Four or more moving violations
    within 18 months can lead to a fine of up to $1,000, mandatory driver retraining,
    and license revocation for up to two years.
- id: 58
  category: driver_responsibility
  question: What is the minimum distance you must park your vehicle from a fire hydrant
    in Rhode Island?
  choices:
    A: 5 feet
    B: 8 feet
    C: 10 feet
    D: 15 feet
  answer: B
  explanation: Rhode Island law prohibits parking a vehicle within 8 feet of a fire
    hydrant.
- id: 59
  category: driver_responsibility
  question: If you are convicted of a first offense of littering from a motor vehicle
    in Rhode Island, what is the maximum fine you could face?
  choices:
    A: Up to $50
    B: Up to $100
    C: Up to $500
    D: Up to $2,000
  answer: C
  explanation: Littering is illegal in Rhode Island. A first offense can result in
    a fine of up to $500 and a requirement to pick up litter.
- id: 60
  category: driver_responsibility
  question: 'When an emergency vehicle with flashing lights and a siren is approaching
    from any direction, Rhode Island law requires you to:'
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are in the middle of the road
    C: Pull to the right side of the road and stop
    D: Follow the emergency vehicle closely
  answer: C
  explanation: Rhode Island law requires drivers to pull to the right-hand edge or
    curb of the roadway, clear of intersections, and stop until the emergency vehicle
    has passed.
- id: 61
  category: driver_responsibility
  question: In Rhode Island, a child must be secured in a rear-facing child safety
    seat until they reach which of the following milestones?
  choices:
    A: 1 year of age or 20 pounds
    B: 2 years of age or the weight/height limit of the seat
    C: 4 years of age
    D: 6 years of age
  answer: B
  explanation: Rhode Island law requires children to be in a rear-facing car seat
    until they are at least 2 years old or until they reach the maximum weight or
    height limit designated by the seat manufacturer.
- id: 62
  category: driver_responsibility
  question: If you are driving in Rhode Island and your vehicle's brakes fail, what
    is the first recommended action to take?
  choices:
    A: Turn off the engine immediately
    B: Shift to a lower gear and pump the brake pedal fast and hard
    C: Jump out of the car
    D: Shift the car into Park
  answer: B
  explanation: The Rhode Island Driver's Manual recommends shifting to a lower gear
    and pumping the brake pedal several times to build up pressure. If that fails,
    use the parking brake.
- id: 63
  category: driver_responsibility
  question: What is the 'three-second rule' used for in Rhode Island driver education?
  choices:
    A: The time it takes to change a tire
    B: The amount of time you should signal before turning
    C: Determining a safe following distance behind the vehicle in front of you
    D: The time you must wait at a green light before proceeding
  answer: C
  explanation: The 'three-second rule' is the recommended method to maintain a safe
    following distance between your vehicle and the one in front of you under normal
    driving conditions.
- id: 64
  category: driver_responsibility
  question: What is the penalty for a first offense of operating a motor vehicle in
    Rhode Island without valid evidence of financial responsibility (insurance)?
  choices:
    A: A verbal warning only
    B: A fine of up to $100 and no suspension
    C: License and registration suspension for 3 months and a fine of up to $500
    D: Permanent revocation of the driver's license
  answer: C
  explanation: In Rhode Island, failure to provide proof of insurance can result in
    a license and registration suspension for 3 months and a fine ranging from $100
    to $500 for a first offense.
- id: 65
  category: driver_responsibility
  question: How often are most vehicles in Rhode Island required to undergo a safety
    and emissions inspection?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Only when the vehicle is sold
  answer: B
  explanation: Rhode Island law requires that most motor vehicles undergo a safety
    and emissions inspection at least once every 2 years.
- id: 66
  category: driver_responsibility
  question: If you are convicted of illegally passing a stopped school bus with flashing
    red lights for the first time in Rhode Island, what is the fine?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: In Rhode Island, the fine for a first offense of passing a school bus
    with its red lights flashing is $300, and your license may be suspended for up
    to 30 days.
- id: 67
  category: driver_responsibility
  question: Rhode Island's 'Move Over Law' requires drivers to slow down or change
    lanes when approaching which of the following on the side of the road?
  choices:
    A: Any vehicle with hazard lights flashing
    B: Only police cars
    C: Stationary emergency vehicles, tow trucks, or highway maintenance vehicles
      with flashing lights
    D: Only fire trucks
  answer: C
  explanation: The Move Over Law requires drivers to move into an adjacent lane (if
    safe) or slow down when approaching stationary emergency vehicles, tow trucks,
    or maintenance vehicles displaying flashing lights.
- id: 68
  category: driver_responsibility
  question: 'Rhode Island law requires that the rear license plate on a vehicle be
    illuminated so it is clearly visible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 200 feet
  answer: B
  explanation: The Rhode Island Driver's Manual specifies that the rear license plate
    must be illuminated by a white light so that it is visible from 50 feet to the
    rear.
- id: 69
  category: driver_responsibility
  question: 'In Rhode Island, you must turn on your vehicle''s headlights whenever
    you use your windshield wipers and whenever visibility is less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Rhode Island law requires headlights to be on from sunset to sunrise,
    when windshield wipers are in use, and whenever visibility is reduced to 500 feet
    or less.
- id: 70
  category: driver_responsibility
  question: 'If you are involved in a motor vehicle accident in Rhode Island that
    results in personal injury or death, you must immediately notify:'
  choices:
    A: The DMV only
    B: Your insurance agent only
    C: The nearest police department
    D: The Governor's office
  answer: C
  explanation: Rhode Island law requires immediate notification of the nearest police
    department if an accident involves injury or death.
- id: 71
  category: driver_responsibility
  question: 'In Rhode Island, a vehicle is considered unsafe and will fail inspection
    if the tire tread depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires must have at least 2/32 of an inch of tread depth to be considered
    safe and pass the Rhode Island state inspection.
- id: 72
  category: driver_responsibility
  question: Under Rhode Island law, who is responsible for ensuring that all passengers
    under the age of 18 are properly restrained by a seat belt or child safety seat?
  choices:
    A: The passengers themselves
    B: The owner of the vehicle
    C: The driver of the vehicle
    D: The parents of the passengers only
  answer: C
  explanation: In Rhode Island, the driver is legally responsible for ensuring that
    all passengers under the age of 18 are wearing seat belts or are in appropriate
    child restraint systems.
- id: 73
  category: safe_driving_rules
  question: In Rhode Island, what is the maximum speed limit in a business or residential
    district unless otherwise posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: According to the Rhode Island Driver's Manual, the speed limit in any
    business or residential district is 25 miles per hour unless otherwise posted.
- id: 74
  category: safe_driving_rules
  question: Under Rhode Island law, you must not park your vehicle within how many
    feet of a fire hydrant?
  choices:
    A: 8 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: A
  explanation: Rhode Island General Law § 31-21-4 states that no person shall stop,
    stand, or park a vehicle within 8 feet of a fire hydrant.
- id: 75
  category: safe_driving_rules
  question: According to Rhode Island parking regulations, you may not park within
    how many feet of a stop sign or traffic-control signal?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Rhode Island General Law § 31-21-4 prohibits parking within 30 feet
    upon the approach to any flashing signal, stop sign, or traffic-control signal
    located at the side of a roadway.
- id: 76
  category: safe_driving_rules
  question: 'When following another vehicle in Rhode Island, the manual recommends
    maintaining a following distance of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Rhode Island Driver's Manual recommends the 'three-second rule'
    to maintain a safe following distance behind the vehicle in front of you.
- id: 77
  category: safe_driving_rules
  question: 'For a driver 21 years of age or older, Rhode Island law defines Driving
    Under the Influence (DUI) as having a Blood Alcohol Concentration (BAC) of:'
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In Rhode Island, the legal limit for BAC is 0.08% for drivers 21 and
    older. For drivers under 21, the limit is 0.02%.
- id: 78
  category: safe_driving_rules
  question: What is the mandatory fine for a first-time seat belt violation for an
    adult in Rhode Island?
  choices:
    A: $25
    B: $40
    C: $75
    D: $100
  answer: B
  explanation: In Rhode Island, the fine for failing to wear a seat belt is $40 per
    person.
- id: 79
  category: safe_driving_rules
  question: What is the fine for a first offense of speeding in a school zone in Rhode
    Island?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Speeding in a school zone in Rhode Island carries a mandatory fine
    of $200 for the first offense.
- id: 80
  category: safe_driving_rules
  question: 'Rhode Island''s ''Move Over'' law requires drivers to move over one lane,
    if safe to do so, or slow down when approaching:'
  choices:
    A: Only police cars with flashing lights
    B: Only ambulances with sirens
    C: Any stationary vehicle with flashing lights, including emergency and maintenance
      vehicles
    D: School buses only
  answer: C
  explanation: Rhode Island's Move Over Law (31-14-4.1) requires drivers to vacate
    the lane closest to any stationary vehicle with flashing lights (emergency, roadside
    assistance, or maintenance) or slow down to a safe speed.
- id: 81
  category: safe_driving_rules
  question: If you are involved in a motor vehicle accident in Rhode Island that results
    in property damage in excess of ______, you must file an accident report with
    the DMV within 21 days.
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: A State of Rhode Island Motor Vehicle Crash Report must be filed within
    21 days if there is death, personal injury, or property damage to any one person
    in excess of $1,000.
- id: 82
  category: safe_driving_rules
  question: In Rhode Island, under what circumstances is it legal to drive in the
    'breakdown lane' (shoulder) of a highway?
  choices:
    A: During heavy rush hour traffic to maintain flow
    B: To pass a slow-moving vehicle on the right
    C: Only in an emergency or when directed by a police officer
    D: When exiting the highway within 500 feet
  answer: C
  explanation: It is illegal to drive in the breakdown lane in Rhode Island except
    for emergency purposes or when specifically directed by law enforcement or official
    signage.
- id: 83
  category: safe_driving_rules
  question: 'In Rhode Island, making a right turn on a red light after a complete
    stop is:'
  choices:
    A: Always illegal
    B: Legal only between the hours of 9:00 PM and 6:00 AM
    C: Legal unless a sign prohibits it
    D: Legal only if there is a green arrow
  answer: C
  explanation: In Rhode Island, you may turn right on a red light after coming to
    a complete stop and yielding to pedestrians and other traffic, provided there
    is no sign prohibiting the turn.
- id: 84
  category: safe_driving_rules
  question: 'According to the Rhode Island Driver''s Manual, partial hydroplaning
    can begin at speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The manual states that hydroplaning (tires losing contact with the
    road due to water) can begin at speeds as low as 35 mph.
- id: 85
  category: safe_driving_rules
  question: 'When entering a roundabout (traffic circle) in Rhode Island, you must
    yield the right-of-way to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right of way when entering
    D: Only emergency vehicles
  answer: B
  explanation: Drivers entering a roundabout must yield to the traffic already circulating
    within the roundabout.
- id: 86
  category: defensive_driving
  question: According to the Rhode Island Driver's Manual, what is the recommended
    following distance behind the vehicle in front of you under normal driving conditions?
  choices:
    A: One car length for every 10 mph
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: C
  explanation: The Rhode Island Driver's Manual recommends the 'three-second rule'
    to maintain a safe following distance under normal conditions.
- id: 87
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, Rhode Island
    law suggests you should look how far ahead of your vehicle?
  choices:
    A: 5 to 8 seconds
    B: 10 to 12 seconds
    C: 15 to 20 seconds
    D: 30 seconds
  answer: B
  explanation: Rhode Island defensive driving guidelines suggest scanning the road
    10 to 12 seconds ahead to identify potential hazards early.
- id: 88
  category: defensive_driving
  question: In Rhode Island, when are you required by law to turn on your headlights
    in relation to weather conditions?
  choices:
    A: Only when visibility is less than 100 feet
    B: Whenever you are using your windshield wipers
    C: Only during snowstorms
    D: Only between sunset and sunrise
  answer: B
  explanation: Rhode Island General Laws require motorists to turn on headlights whenever
    windshield wipers are in use due to rain, sleet, or snow.
- id: 89
  category: defensive_driving
  question: At what speed can hydroplaning (where tires lose contact with the road
    on a thin film of water) begin in Rhode Island weather conditions?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Exactly 45 mph
    D: Only during hurricane-force winds
  answer: A
  explanation: According to the RI Driver's Manual, hydroplaning can begin at speeds
    as low as 35 mph, and tires may lose all contact with the road at 50 mph.
- id: 90
  category: defensive_driving
  question: In Rhode Island, how many feet before making a turn or changing lanes
    must you activate your turn signal?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: Rhode Island law requires drivers to signal their intention to turn
    or change lanes at least 100 feet before the maneuver.
- id: 91
  category: defensive_driving
  question: In Rhode Island, it is illegal to park your vehicle within how many feet
    of a fire hydrant?
  choices:
    A: 5 feet
    B: 8 feet
    C: 10 feet
    D: 15 feet
  answer: B
  explanation: Rhode Island state law specifically prohibits parking within 8 feet
    of a fire hydrant.
- id: 92
  category: defensive_driving
  question: When parking near an intersection, Rhode Island law states you must be
    at least how many feet away from a stop sign, flashing beacon, or traffic control
    signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers in Rhode Island are prohibited from parking within 30 feet
    of any flashing signal, stop sign, or traffic control signal located at the side
    of a roadway.
- id: 93
  category: defensive_driving
  question: According to Rhode Island parking regulations, what is the minimum distance
    you must maintain from a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 20 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: In Rhode Island, you may not park within 20 feet of a crosswalk at
    an intersection.
- id: 94
  category: defensive_driving
  question: When passing a bicycle traveling in the same direction in Rhode Island,
    what is the minimum distance a motorist must maintain between the car and the
    bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Rhode Island's 'Safe Passing' law requires motorists to leave at least
    3 feet of space when overtaking a bicycle.
- id: 95
  category: defensive_driving
  question: When driving in heavy fog in Rhode Island, which headlight setting should
    you use to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights
  answer: B
  explanation: In fog, you should use low beams. High beams reflect off the fog and
    create glare, making it harder to see.
- id: 96
  category: defensive_driving
  question: If you are driving on a Rhode Island highway and approach a stationary
    emergency vehicle with flashing lights, what does the 'Move Over' law require
    you to do?
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but honk your horn
    C: Move to a lane not adjacent to the vehicle if safe, or slow down
    D: Speed up to pass the area quickly
  answer: C
  explanation: Rhode Island's Move Over Law requires drivers to move over one lane
    for stationary emergency vehicles with flashing lights. If moving over is unsafe,
    the driver must slow down.
- id: 97
  category: defensive_driving
  question: To avoid hydroplaning on wet Rhode Island roads, at what speed should
    you begin to take extra caution as your tires may start to lose contact with the
    pavement?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Rhode Island Driver's Manual states that hydroplaning can begin
    at speeds as low as 35 mph, and at 55 mph, tires may lose all contact with the
    road.
- id: 98
  category: defensive_driving
  question: The Rhode Island Driver's Manual suggests scanning the road ahead to be
    a defensive driver. How far ahead should you look in terms of time?
  choices:
    A: 3 to 5 seconds
    B: 5 to 8 seconds
    C: 10 to 12 seconds
    D: 20 to 30 seconds
  answer: C
  explanation: RI defensive driving guidelines suggest looking 10 to 12 seconds ahead
    (about two blocks in the city or half a mile on the highway) to anticipate hazards.
- id: 99
  category: defensive_driving
  question: When approaching an intersection in Rhode Island, what is the proper scanning
    sequence for defensive driving?
  choices:
    A: Right, Left, Right
    B: Left, Right, Left
    C: Straight, Left, Right
    D: Left, Straight, Right
  answer: B
  explanation: Drivers should look left, then right, then left again before entering
    an intersection, as vehicles from the left are closer and pose an immediate threat.
- id: 100
  category: defensive_driving
  question: When driving on slippery roads (ice or snow) in Rhode Island, how should
    you adjust your following distance?
  choices:
    A: Maintain the 3-second rule
    B: Increase it to at least 6 seconds
    C: Decrease it to 1 second to stay in the tracks of the car ahead
    D: Keep it at exactly 4 seconds
  answer: B
  explanation: In adverse conditions like ice or snow, the Rhode Island manual advises
    doubling or tripling your following distance (to 6 seconds or more) to allow for
    increased stopping distance.
- id: 101
  category: defensive_driving
  question: When parking a vehicle facing downhill on a Rhode Island street with a
    curb, which way should you turn your wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Keep them straight
    D: Toward the center of the road
  answer: A
  explanation: When parking downhill, turn your wheels toward the curb so that if
    the vehicle rolls, it will roll into the curb and stop.
- id: 102
  category: defensive_driving
  question: If your vehicle starts to skid on a slippery Rhode Island road, what is
    the correct defensive driving response?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the direction the rear of the vehicle is sliding
    D: Accelerate to gain traction
  answer: C
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction the back of the car is sliding (also known as steering into the
    skid).
- id: 103
  category: alcohol_drugs_health
  question: What is the mandatory license suspension period for a first-offense refusal
    to submit to a chemical test in Rhode Island?
  choices:
    A: 30 to 90 days
    B: 6 months to 1 year
    C: 2 years
    D: Permanently
  answer: B
  explanation: A first-offense refusal to submit to a chemical test results in a mandatory
    license suspension of six months to one year, along with fines and community service.
- id: 104
  category: alcohol_drugs_health
  question: 'In Rhode Island, a first-offense DUI conviction for a driver with a BAC
    between 0.08% and 0.10% carries a license suspension of:'
  choices:
    A: 10 to 30 days
    B: 30 to 180 days
    C: 6 to 12 months
    D: 1 to 2 years
  answer: B
  explanation: For a first DUI offense with a BAC of 0.08% but less than 0.10%, the
    driver faces a license suspension of 30 to 180 days.
- id: 105
  category: alcohol_drugs_health
  question: What is the minimum number of community service hours required for a first-offense
    DUI conviction in Rhode Island?
  choices:
    A: 5 hours
    B: 10 hours
    C: 50 hours
    D: 100 hours
  answer: B
  explanation: Rhode Island law requires 10 to 60 hours of community service for a
    first-offense DUI conviction.
- id: 106
  category: alcohol_drugs_health
  question: 'In Rhode Island, if a driver under 21 is caught transporting alcohol
    in a vehicle without a parent or legal guardian, they may face a license suspension
    of up to:'
  choices:
    A: 10 days
    B: 30 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: Under RI law, a minor transporting alcohol (unless for work or with
    a parent) can have their license suspended for up to 30 days for a first offense.
- id: 107
  category: alcohol_drugs_health
  question: What is the fine for a first-offense DUI in Rhode Island if the driver's
    BAC is 0.15% or higher?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: C
  explanation: A first-offense DUI with a BAC of 0.15% or higher results in a mandatory
    fine of $500, which is higher than the fine for lower BAC levels.
- id: 108
  category: alcohol_drugs_health
  question: Which fee must be paid by any person convicted of DUI or who refuses a
    chemical test in Rhode Island to support the Highway Safety Assessment?
  choices:
    A: $50
    B: $200
    C: $500
    D: $1,000
  answer: C
  explanation: Rhode Island requires a $500 Highway Safety Assessment fee for those
    convicted of DUI or chemical test refusal.
- id: 109
  category: alcohol_drugs_health
  question: Under Rhode Island's 'Open Container' law, what is the fine for a first
    offense of possessing an open alcoholic beverage container in the passenger area
    of a motor vehicle?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Rhode Island General Law 31-22-21.1 states that a first offense for
    having an open container of alcohol in a vehicle results in a $200 fine.
- id: 110
  category: alcohol_drugs_health
  question: 'If a Rhode Island driver is convicted of a second DUI offense within
    a five-year period, the jail sentence can be up to:'
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 5 years
  answer: C
  explanation: A second DUI conviction within 5 years in Rhode Island can result in
    a jail sentence of up to 1 year.
- id: 111
  category: alcohol_drugs_health
  question: 'In Rhode Island, a driver may be charged with DUI if they are operating
    a vehicle under the influence of:'
  choices:
    A: Alcohol only
    B: Illegal drugs only
    C: Prescription drugs only
    D: Any drug, controlled substance, or alcohol that impairs driving
  answer: D
  explanation: RI law applies DUI charges to any substance that impairs a person's
    ability to safely operate a vehicle, including alcohol, illegal drugs, and prescription
    or over-the-counter medications.
- id: 112
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' in the context of driving safety?
  choices:
    A: The effect of driving while tired
    B: The combined effect of alcohol and another drug, which is greater than the
      sum of their separate effects
    C: The ability to see better at night after eating carrots
    D: The reaction time improvement from caffeine
  answer: B
  explanation: As noted in the RI Driver's Manual, mixing alcohol and drugs creates
    a synergistic effect, meaning the impairment is much more severe than if either
    were used alone.
- id: 113
  category: alcohol_drugs_health
  question: 'A first-offense DUI conviction for a driver under age 21 (with a BAC
    of 0.02% to 0.08%) results in a license suspension of:'
  choices:
    A: 30 days
    B: 60 days
    C: 6 to 12 months
    D: 2 years
  answer: C
  explanation: Under RI General Law 31-27-2.8, a first offense for a minor with a
    BAC between 0.02% and 0.08% results in a license suspension of 6 to 12 months.
- id: 114
  category: alcohol_drugs_health
  question: In Rhode Island, a judge may require a first-time DUI offender to install
    an Ignition Interlock Device (IID) for how long after their license is reinstated?
  choices:
    A: 1 month
    B: 3 months to 1 year
    C: 5 years
    D: The rest of their life
  answer: B
  explanation: For a first DUI offense, a judge has the discretion to order the installation
    of an IID for a period of 3 months to 1 year following the suspension period.
- id: 115
  category: alcohol_drugs_health
  question: 'A first-offense DUI conviction in Rhode Island (BAC 0.08% to 0.10%) typically
    results in a license suspension of:'
  choices:
    A: 10 to 30 days
    B: 30 to 180 days
    C: 1 year
    D: 2 years
  answer: B
  explanation: For a first DUI offense with a BAC between 0.08% and 0.10%, the court
    may suspend the driver's license for a period of 30 to 180 days.
- id: 116
  category: alcohol_drugs_health
  question: In Rhode Island, how many hours of community service are mandatory for
    a first-offense DUI conviction?
  choices:
    A: 5 to 10 hours
    B: 10 to 60 hours
    C: 100 hours
    D: Community service is not required for a first offense
  answer: B
  explanation: Rhode Island law requires 10 to 60 hours of community service for a
    first-offense DUI conviction.
- id: 117
  category: alcohol_drugs_health
  question: If a driver under 21 is convicted of a first-offense violation for a BAC
    of 0.02% to 0.08%, how long will their license be suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 6 to 18 months
    D: Until they turn 21
  answer: C
  explanation: Drivers under 21 convicted of a first-offense 'zero tolerance' violation
    (BAC 0.02%-0.08%) face a license suspension of 6 to 18 months.
- id: 118
  category: alcohol_drugs_health
  question: Rhode Island's 'Open Container' law prohibits which of the following?
  choices:
    A: Possessing an open alcoholic beverage container in the passenger area of a
      motor vehicle
    B: Drinking water while driving
    C: Transporting unopened alcohol in the trunk
    D: Having an empty soda can in the cup holder
  answer: A
  explanation: Rhode Island law prohibits the possession of an open alcoholic beverage
    container by the driver or any passenger within the passenger area of a motor
    vehicle on a public highway.
- id: 119
  category: alcohol_drugs_health
  question: 'In Rhode Island, if a driver is convicted of a first-offense DUI with
    a BAC of 0.15% or higher, the mandatory fine is:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: For a first-offense DUI with a BAC of 0.15% or higher, Rhode Island
    law mandates a fine of $500.
- id: 120
  category: alcohol_drugs_health
  question: 'If a person under 21 years of age refuses to take a chemical test in
    Rhode Island for the first time, their license will be suspended for:'
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: A first-offense refusal to submit to a chemical test by a person under
    age 21 results in a mandatory 6-month license suspension.
- id: 121
  category: alcohol_drugs_health
  question: 'In Rhode Island, if you are convicted of DUI while a child under the
    age of 13 is in the vehicle, you may face an additional license suspension of:'
  choices:
    A: 3 months
    B: 6 months
    C: Up to 1 year
    D: 5 years
  answer: C
  explanation: Rhode Island law imposes harsher penalties for DUI with a minor passenger,
    including an additional license suspension of up to one year if the passenger
    is under 13.
- id: 122
  category: alcohol_drugs_health
  question: 'Under Rhode Island law, driving while under the influence of any drug
    (legal or illegal) that renders you incapable of safely operating a vehicle is:'
  choices:
    A: Permitted if the drug is a prescription
    B: Subject to the same penalties as alcohol-related DUI
    C: Only a violation if you are involved in a crash
    D: A minor traffic ticket
  answer: B
  explanation: Rhode Island DUI laws apply to impairment by any drug, including prescription
    medications and marijuana, and carry the same penalties as alcohol-related DUI.
- id: 123
  category: alcohol_drugs_health
  question: What is the fee to reinstate a Rhode Island driver's license that was
    suspended due to an alcohol-related offense?
  choices:
    A: $50
    B: $100
    C: $350
    D: $500
  answer: D
  explanation: The reinstatement fee for a license suspended due to alcohol or drug-related
    offenses in Rhode Island is $500.
- id: 124
  category: alcohol_drugs_health
  question: Which of the following is the only way to reduce your Blood Alcohol Concentration
    (BAC) before driving?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Giving your body time to process the alcohol
    D: Exercising vigorously
  answer: C
  explanation: Time is the only factor that will lower BAC. Coffee, showers, and exercise
    do not speed up the liver's ability to oxidize alcohol.
- id: 125
  category: penalties_and_points
  question: Under the 'Colin Foote Act,' a driver who is convicted of how many moving
    violations within an 18-month period may face a license suspension of up to 60
    days and a fine of up to $1,000?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: C
  explanation: The Colin Foote Act targets repeat offenders; four moving violations
    within 18 months triggers mandatory driver retraining, heavy fines, and potential
    license suspension.
- id: 126
  category: penalties_and_points
  question: In Rhode Island, 'Aggressive Driving' is defined as a single incident
    where a driver commits how many specific moving violations (such as speeding and
    following too closely)?
  choices:
    A: Two or more
    B: Three or more
    C: Four or more
    D: Five or more
  answer: A
  explanation: Aggressive driving in Rhode Island is defined as committing two or
    more specific violations, including speeding, failing to yield, following too
    closely, or improper lane changes.
- id: 127
  category: penalties_and_points
  question: What is the fine for a first offense of parking in a space designated
    for persons with disabilities without a proper placard or plate in Rhode Island?
  choices:
    A: $50
    B: $75
    C: $100
    D: $250
  answer: C
  explanation: The fine for a first-time violation of parking in a handicap-accessible
    space in Rhode Island is $100.
- id: 128
  category: penalties_and_points
  question: Under Rhode Island's 'Move Over' law, what is the fine for a first offense
    of failing to move into an adjacent lane (if safe) when approaching a stationary
    emergency vehicle with flashing lights?
  choices:
    A: $40
    B: $85
    C: $150
    D: $250
  answer: B
  explanation: The fine for failing to move over or slow down for an emergency vehicle
    in Rhode Island is $85 for a first offense.
- id: 129
  category: penalties_and_points
  question: In Rhode Island, if a driver is found with an open container of an alcoholic
    beverage in the passenger area of a vehicle while on a public highway, they may
    face a license suspension of up to how many months for a first offense?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 12 months
  answer: C
  explanation: A first offense for an open container violation in Rhode Island can
    lead to a license suspension of up to 6 months.
- id: 130
  category: penalties_and_points
  question: For an adult driver (over 18), what is the fine for a first offense of
    using a wireless handset to compose, read, or send a text message while operating
    a motor vehicle in Rhode Island?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Rhode Island law prohibits texting while driving for all ages; the
    fine for a first offense is $100.
- id: 131
  category: penalties_and_points
  question: How many 'points' does the Rhode Island DMV add to your driving record
    for a standard speeding ticket?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: Rhode Island does not use a point system
  answer: D
  explanation: Rhode Island is one of the few states that does not use a point system
    to track driving violations; instead, they track the number of convictions over
    a specific timeframe (like the Colin Foote Act).
- id: 132
  category: penalties_and_points
  question: In Rhode Island, speeding fines are doubled when the violation occurs
    in which of the following areas?
  choices:
    A: School zones and construction zones
    B: Residential neighborhoods
    C: Hospital zones
    D: State highways
  answer: A
  explanation: Fines for speeding in Rhode Island are doubled if the offense occurs
    in a designated school zone or a highway construction/maintenance zone when workers
    are present.
- id: 133
  category: penalties_and_points
  question: A Rhode Island driver must file an accident report (Form SR-1) with the
    DMV if an accident results in death, personal injury, or property damage exceeding
    what amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Rhode Island law requires drivers to report any accident to the DMV
    within 21 days if there is injury, death, or property damage to any one person
    in excess of $1,000.
- id: 134
  category: penalties_and_points
  question: What is the fine for a Rhode Island driver or passenger (over age 13)
    who is found not wearing a safety belt?
  choices:
    A: $25
    B: $40
    C: $75
    D: $100
  answer: B
  explanation: Rhode Island law mandates a $40 fine for any person 13 years of age
    or older who is not properly restrained by a safety belt while the vehicle is
    in operation.
- id: 135
  category: penalties_and_points
  question: Under Rhode Island law, a driver with a Limited Provisional License will
    have their driving privileges suspended if they are convicted of how many moving
    violations within a 12-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: For GDL holders (Limited Instructional Permit or Limited Provisional
    License), a conviction for a third moving violation results in a license suspension
    until the driver reaches age 18.
- id: 136
  category: penalties_and_points
  question: What is the fine for a first offense of 'Texting While Driving' for a
    Rhode Island driver who is 18 years of age or older?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: In Rhode Island, the fine for a first offense of texting while driving
    for an adult is $100. Subsequent offenses carry higher fines and potential license
    suspension.
- id: 137
  category: penalties_and_points
  question: In Rhode Island, what is the 'Highway Safety Assessment' fee that must
    be paid by any driver convicted of DUI or Refusal of a Chemical Test?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Rhode Island law requires a $500 Highway Safety Assessment fee for
    individuals convicted of driving under the influence or refusing a chemical test.
- id: 138
  category: penalties_and_points
  question: If a Rhode Island driver is convicted of 'Aggressive Driving,' they must
    attend a mandatory training course and may face a license suspension of up to
    how many days for a first offense?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Aggressive driving (committing two or more specific violations like
    speeding and unsafe lane changes) can result in a 30-day license suspension and
    mandatory attendance at an educational program.
- id: 139
  category: penalties_and_points
  question: 'In Rhode Island, if you are convicted of driving with a suspended, revoked,
    or cancelled license for the first time, the fine is generally between:'
  choices:
    A: $100 and $200
    B: $250 and $500
    C: $500 and $1,000
    D: $1,000 and $2,000
  answer: B
  explanation: A first conviction for driving on a suspended or revoked license in
    Rhode Island typically carries a fine of $250 to $500.
- id: 140
  category: penalties_and_points
  question: 'If a Rhode Island driver is involved in an accident with an unattended
    vehicle, and the owner cannot be found, the driver must:'
  choices:
    A: Wait at the scene for at least 2 hours
    B: Leave a note with their name, address, and registration number
    C: Drive away if there is no visible damage
    D: Only report it if the damage looks like it is over $2,000
  answer: B
  explanation: Rhode Island law requires drivers who hit an unattended vehicle to
    locate the owner or leave a written notice providing their contact information
    and vehicle registration.
- id: 141
  category: penalties_and_points
  question: In Rhode Island, a driver is considered 'habitually reckless or negligent'
    and may have their license suspended if they are involved in how many 'at-fault'
    accidents within a 12-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: The RI DMV may suspend the license of any person who has been involved
    in three 'at-fault' accidents within a one-year period.
- id: 142
  category: sharing_the_road
  question: When a school bus is stopped on a four-lane highway with its red lights
    flashing, which drivers must stop if there is no physical barrier or median?
  choices:
    A: Only drivers following the bus
    B: Only drivers in the lane immediately next to the bus
    C: Drivers in all lanes and both directions of travel
    D: Only drivers traveling in the opposite direction
  answer: C
  explanation: In Rhode Island, motorists must stop for a school bus with flashing
    red lights regardless of the direction of travel, unless the road is divided by
    a physical barrier or median.
- id: 143
  category: sharing_the_road
  question: 'When passing a bicycle traveling in the same direction, Rhode Island
    law requires motorists to maintain a minimum distance of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Rhode Island General Law § 31-15-18 requires that a driver of a motor
    vehicle passing a person operating a bicycle shall leave a safe distance, which
    is defined as not less than three (3) feet.
- id: 144
  category: sharing_the_road
  question: What is the 'No-Zone' in regards to sharing the road with large trucks?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, rear, and sides of the truck
    C: The speed limit zone for commercial vehicles
    D: The weight limit for bridges
  answer: B
  explanation: The 'No-Zone' refers to the significant blind spots around a large
    truck where the driver cannot see other vehicles. If you cannot see the truck
    driver's face in their side mirrors, they cannot see you.
- id: 145
  category: sharing_the_road
  question: 'In Rhode Island, if a pedestrian is crossing the street in a marked or
    unmarked crosswalk, a driver must:'
  choices:
    A: Honk to warn the pedestrian to move faster
    B: Yield the right-of-way and stop if necessary
    C: Drive around the pedestrian if there is room
    D: Only stop if the pedestrian is using a white cane
  answer: B
  explanation: Rhode Island law requires drivers to yield the right-of-way to pedestrians
    crossing the roadway within any marked or unmarked crosswalk at an intersection.
- id: 146
  category: sharing_the_road
  question: When following a motorcycle, why should you allow for a greater following
    distance than you would for a car?
  choices:
    A: Motorcycles are heavier and take longer to stop
    B: Motorcycles can stop much more quickly than other vehicles
    C: Motorcyclists are required by law to be followed by 500 feet
    D: Motorcycles have larger blind spots
  answer: B
  explanation: Motorcycles can stop more quickly than cars. Rhode Island's driver
    manual recommends a following distance of at least 4 seconds to allow enough time
    to react if the motorcyclist brakes suddenly.
- id: 147
  category: sharing_the_road
  question: 'If an emergency vehicle (police, fire, or ambulance) is approaching you
    from behind with its siren and lights activated, you should:'
  choices:
    A: Stop exactly where you are in the lane
    B: Speed up to stay ahead of it
    C: Pull over to the right edge of the road and stop
    D: Pull over to the left median and stop
  answer: C
  explanation: Rhode Island law requires drivers to yield the right-of-way by pulling
    to the right-hand edge or curb of the roadway, clear of any intersection, and
    stopping until the emergency vehicle has passed.
- id: 148
  category: sharing_the_road
  question: What is the penalty for a second offense of passing a stopped school bus
    with red lights flashing within a three-year period in Rhode Island?
  choices:
    A: A fine of $100 and no suspension
    B: A fine of $300 to $500 and a 30-day to 1-year license suspension
    C: A mandatory 5-year prison sentence
    D: Permanent revocation of the driver's license
  answer: B
  explanation: Under RI General Law § 31-20-12, a second offense within three years
    results in a fine of $300 to $500 and a license suspension of 30 days to one year.
- id: 149
  category: sharing_the_road
  question: 'Under Rhode Island law, bicyclists riding on the roadway have:'
  choices:
    A: No rights and must yield to all motor vehicles
    B: The same rights and duties as the operators of motor vehicles
    C: The right to ride on the sidewalk only
    D: The right to ignore red lights and stop signs
  answer: B
  explanation: Bicyclists in Rhode Island are granted all of the rights and are subject
    to all of the duties applicable to the driver of a vehicle, including obeying
    traffic signals and signs.
- id: 150
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may often:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide to the left to complete the turn
    C: Stop and back up to make the turn
    D: Turn from the left lane only
  answer: B
  explanation: Large trucks need extra space to turn. They often swing wide to the
    left to clear the curb on a right turn. Drivers should never try to squeeze between
    a turning truck and the curb.
- id: 151
  category: sharing_the_road
  question: Is 'lane splitting' (operating a motorcycle between rows of stopped or
    moving vehicles) legal in Rhode Island?
  choices:
    A: Yes, at speeds under 20 mph
    B: Yes, but only on highways
    C: No, it is illegal
    D: Only during peak rush hour traffic
  answer: C
  explanation: In Rhode Island, motorcycles are entitled to the full use of a lane,
    and lane splitting (filtering between lanes) is prohibited.
- id: 152
  category: sharing_the_road
  question: Rhode Island's 'Move Over Law' applies to stationary emergency vehicles
    with flashing lights and which of the following?
  choices:
    A: Only police and fire vehicles
    B: Recovery vehicles (tow trucks) and highway maintenance vehicles with flashing
      lights
    C: Any vehicle parked on the shoulder
    D: Ice cream trucks
  answer: B
  explanation: The law (RI § 31-14-3) specifically includes authorized emergency vehicles,
    tow trucks, and highway maintenance vehicles displaying flashing amber or red/white
    lights.
- id: 153
  category: sharing_the_road
  question: 'When a blind pedestrian is crossing the street using a white cane or
    a guide dog, Rhode Island law requires drivers to:'
  choices:
    A: Honk to let them know you are there
    B: Take the right-of-way if the light is green
    C: Come to a full stop and take precautions to avoid injury
    D: Slow down to 5 mph but do not stop
  answer: C
  explanation: Rhode Island General Law § 31-18-13 states that any driver approaching
    a person wholly or partially blind carrying a cane or using a guide dog must bring
    the vehicle to a full stop and take necessary precautions.
- id: 154
  category: sharing_the_road
  question: 'In Rhode Island, you are NOT required to stop for a school bus with flashing
    red lights if:'
  choices:
    A: You are traveling on the opposite side of a divided highway separated by a
      physical barrier
    B: The bus is stopped in a residential zone
    C: There are at least three lanes of travel and you are in the far left lane
    D: You are traveling in the same direction but the bus is in a 'bus-only' turnout
  answer: A
  explanation: Motorists are not required to stop for a school bus on a divided highway
    if the bus is on the opposite side of a physical barrier or median strip.
- id: 155
  category: sharing_the_road
  question: According to Rhode Island law, which motorcycle operators are required
    to wear a helmet?
  choices:
    A: Only those under the age of 18
    B: All operators regardless of age or experience
    C: All operators during their first year of licensure and all passengers
    D: Only operators of motorcycles with engines larger than 500cc
  answer: C
  explanation: Rhode Island General Laws § 31-10.1-4 requires all motorcycle passengers
    to wear a helmet, and all operators to wear a helmet during the first year after
    being issued their license.
- id: 156
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' Where is the largest 'No-Zone'
    located?
  choices:
    A: Directly in front of the truck
    B: On the left side of the truck
    C: On the right side of the truck
    D: Directly behind the truck
  answer: C
  explanation: The right-side blind spot (No-Zone) is the largest and most dangerous
    because trucks must make wide right turns, and the driver's visibility is most
    limited on that side.
- id: 157
  category: sharing_the_road
  question: In Rhode Island, how many feet must you stay behind a fire apparatus (fire
    truck) that is responding to an alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Rhode Island General Laws § 31-22-7 prohibits following any fire apparatus
    traveling in response to a fire alarm closer than 500 feet.
- id: 158
  category: sharing_the_road
  question: When a school bus is displaying flashing amber (yellow) lights, what does
    this indicate to Rhode Island drivers?
  choices:
    A: The bus is about to stop and drivers should prepare to stop
    B: The bus has a mechanical problem
    C: The bus is loading students and you may pass with caution
    D: The bus is traveling below the speed limit
  answer: A
  explanation: Flashing amber lights are a warning that the bus is preparing to stop
    to load or unload children; motorists should slow down and prepare to stop when
    the red lights activate.
- id: 159
  category: sharing_the_road
  question: In Rhode Island, is 'lane splitting' (a motorcycle driving between rows
    of stopped or moving vehicles in the same lane) legal?
  choices:
    A: Yes, at speeds under 15 mph
    B: Yes, but only on highways
    C: No, it is illegal
    D: Only if the motorcycle has its hazard lights on
  answer: C
  explanation: Rhode Island General Laws § 31-10.1-7 prohibits motorcycles from being
    operated between lanes of traffic or between adjacent lines or rows of vehicles.
- id: 160
  category: sharing_the_road
  question: If you are following a funeral procession in Rhode Island, what is the
    rule regarding the lead vehicle and traffic signals?
  choices:
    A: The lead vehicle must stop for all red lights
    B: The entire procession must stop for all red lights
    C: The lead vehicle must obey signals, but the following vehicles in the procession
      may proceed through a red light if their headlights are on
    D: Funeral processions are not recognized as having any special right-of-way
  answer: C
  explanation: Under RI law, once the lead vehicle in a funeral procession has lawfully
    entered an intersection, the remaining vehicles in the procession may continue
    through the intersection despite a traffic signal, provided they have headlights
    on and follow the vehicle ahead closely.
- id: 161
  category: sharing_the_road
  question: 'When a pedestrian is guided by a service animal or carrying a white cane
    (with or without a red tip), Rhode Island law requires drivers to:'
  choices:
    A: Honk to let them know you are there
    B: Stop and take precautions to avoid injury to the pedestrian
    C: Only stop if the pedestrian is in a marked crosswalk
    D: Drive around them slowly
  answer: B
  explanation: Rhode Island General Laws § 31-18-13 requires drivers to take all necessary
    precautions to avoid injury to a blind or visually impaired pedestrian.
- id: 162
  category: sharing_the_road
  question: 'In Rhode Island, bicyclists are generally required to ride:'
  choices:
    A: On the sidewalk at all times
    B: Against the flow of traffic (facing cars)
    C: With the flow of traffic, as near to the right side of the roadway as practicable
    D: In the center of the lane regardless of speed
  answer: C
  explanation: Bicycles are considered vehicles in Rhode Island and must ride with
    traffic, as far to the right as is safe and practicable.
- id: 163
  category: sharing_the_road
  question: What is the 'Dutch Reach' method, which is recommended to protect cyclists
    in Rhode Island?
  choices:
    A: A way of signaling a left turn
    B: Opening your car door with your far hand to force you to look back for cyclists
    C: A method for securing a bicycle to a vehicle rack
    D: A technique for passing a truck on the right
  answer: B
  explanation: The 'Dutch Reach' involves using the hand furthest from the door to
    open it, which naturally turns the driver's body and head to look for approaching
    cyclists or traffic.
- id: 164
  category: sharing_the_road
  question: 'In Rhode Island, if an emergency vehicle with sirens and flashing lights
    is approaching from behind on a two-way road, you should:'
  choices:
    A: Stop exactly where you are
    B: Speed up to get out of the way
    C: Pull over to the right edge of the road and stop
    D: Pull over to the left edge of the road and stop
  answer: C
  explanation: Rhode Island General Laws § 31-17-6 requires drivers to yield the right-of-way
    by pulling as close as possible to the right-hand edge or curb of the roadway
    and stopping until the emergency vehicle has passed.
- id: 165
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a passenger vehicle in
    Rhode Island?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: In Rhode Island, tires are considered unsafe and will fail inspection
    if the tread depth is less than 2/32 of an inch.
- id: 166
  category: vehicle_information
  question: In Rhode Island, you must dim your high beam headlights when following
    another vehicle from behind within how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Drivers in Rhode Island must switch to low beams when following another
    vehicle within 200 feet.
- id: 167
  category: vehicle_information
  question: According to Rhode Island law, aftermarket window tinting on the side
    and rear windows must allow at least what percentage of light to pass through?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 70%
  answer: D
  explanation: Rhode Island General Law 31-23.3-2 states that no person shall install
    any total solar reflectance of more than 70% on side or rear windows; effectively,
    the windows must have a total light transmittance of not less than 70%.
- id: 168
  category: vehicle_information
  question: Between which dates are studded snow tires legally permitted for use on
    Rhode Island roads?
  choices:
    A: October 1 to March 1
    B: November 1 to April 1
    C: November 15 to April 1
    D: December 1 to March 31
  answer: C
  explanation: In Rhode Island, studded snow tires are only legal for use from November
    15th through April 1st.
- id: 169
  category: vehicle_information
  question: In Rhode Island, a vehicle's service brake (foot brake) must be capable
    of stopping the vehicle within how many feet when traveling at 20 mph on a dry,
    level pavement?
  choices:
    A: 15 feet
    B: 25 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: Rhode Island safety standards require that the foot brake must be able
    to stop a passenger vehicle traveling at 20 mph within a distance of 25 feet.
- id: 170
  category: vehicle_information
  question: Every motor vehicle in Rhode Island must be equipped with a mirror so
    located as to reflect to the driver a view of the highway for a distance of at
    least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Rhode Island law requires mirrors to provide a view of the highway
    for at least 200 feet to the rear of the vehicle.
- id: 171
  category: vehicle_information
  question: A motor vehicle's horn in Rhode Island must be audible under normal conditions
    from a distance of not less than how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: State law requires that a vehicle horn must be heard from a distance
    of at least 200 feet, but it should not be used unnecessarily.
- id: 172
  category: vehicle_information
  question: Which of the following is ILLEGAL regarding a vehicle's exhaust system
    in Rhode Island?
  choices:
    A: Using a muffler that is original equipment
    B: Using a muffler cutout, bypass, or similar device
    C: Having an exhaust pipe that extends to the rear of the vehicle
    D: Replacing a damaged muffler with a standard retail version
  answer: B
  explanation: Rhode Island law prohibits the use of muffler cutouts, bypasses, or
    similar devices that increase noise or prevent the effective reduction of noise.
- id: 173
  category: vehicle_information
  question: In Rhode Island, a child must be properly restrained in the rear seat
    of a vehicle if they are under what age and weight (unless the vehicle has no
    rear seat)?
  choices:
    A: Under 5 years old and less than 40 pounds
    B: Under 6 years old and less than 60 pounds
    C: Under 8 years old, less than 57 inches tall, and less than 80 pounds
    D: Under 10 years old and less than 100 pounds
  answer: C
  explanation: Rhode Island's Child Restraint Law requires children under 8 years
    old who weigh less than 80 pounds and are less than 57 inches tall to be transported
    in the rear seat and properly restrained.
- id: 174
  category: vehicle_information
  question: Turn signal lights on a vehicle in Rhode Island must be visible from a
    distance of at least how many feet in normal sunlight?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Rhode Island regulations require that turn signals be visible for at
    least 100 feet in normal sunlight.
- id: 175
  category: vehicle_information
  question: Every motor vehicle in Rhode Island must have at least two red tail lamps
    mounted on the rear that are visible from a distance of how many feet?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Tail lamps must be red and visible from a distance of 500 feet to the
    rear of the vehicle under normal atmospheric conditions.
- id: 176
  category: vehicle_information
  question: Under Rhode Island law, what is the maximum allowable window tint (minimum
    light transmittance) for the side windows of a passenger car?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: D
  explanation: Rhode Island General Law § 31-23.3-2 prohibits the use of sun screening
    devices on windows that have a total light transmittance of less than 70%.
- id: 177
  category: vehicle_information
  question: Rhode Island law requires every motor vehicle to be equipped with a horn
    that can be heard from a distance of at least how many feet?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: According to RI General Law § 31-23-8, every motor vehicle must be
    equipped with a horn in good working order capable of emitting sound audible under
    normal conditions from a distance of not less than 200 feet.
- id: 178
  category: vehicle_information
  question: Rhode Island law requires vehicles to have a rearview mirror that provides
    a view of the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: RI General Law § 31-23-15 states that every motor vehicle must be equipped
    with a mirror so located as to reflect to the driver a view of the highway for
    a distance of at least 200 feet to the rear.
- id: 179
  category: vehicle_information
  question: A vehicle's rear license plate in Rhode Island must be illuminated by
    a white light so that it is clearly legible from a distance of at least how many
    feet?
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Rhode Island General Law § 31-24-9 requires a white light to illuminate
    the rear registration plate and render it clearly legible from a distance of 50
    feet to the rear.
- id: 180
  category: vehicle_information
  question: According to the Rhode Island Driver's Manual, headlights must be turned
    on if you cannot see a person or vehicle at a distance of how many feet?
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Rhode Island law requires headlights to be on from sunset to sunrise
    and whenever visibility is less than 500 feet.
- id: 181
  category: vehicle_information
  question: In Rhode Island, it is illegal to drive a vehicle that has a muffler with
    which of the following modifications?
  choices:
    A: A chrome tip
    B: A cutout, bypass, or similar device
    C: A heat shield
    D: A dual-exhaust system installed by the manufacturer
  answer: B
  explanation: Rhode Island General Law § 31-23-13 prohibits the use of a muffler
    cutout, bypass, or similar device on any motor vehicle operated on a highway.
- id: 182
  category: vehicle_information
  question: Rhode Island law requires that turn signal lights be visible to the front
    and rear from a distance of at least how many feet?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Per RI General Law § 31-24-16, signal lamps used to indicate a turn
    must be visible from a distance of 100 feet both to the front and rear.
- id: 183
  category: vehicle_information
  question: What is the Rhode Island requirement for the parking brake (hand brake)
    on a motor vehicle?
  choices:
    A: It is only required for manual transmission vehicles
    B: It must be able to hold the vehicle on any grade on which it is operated
    C: It must be used only when parking on a hill
    D: It must be checked every two years
  answer: B
  explanation: Rhode Island General Law § 31-23-4 requires that the service brakes
    and the parking brake be adequate to stop and hold the vehicle on any grade on
    which it is operated.
- id: 184
  category: signs_and_signals
  question: In Rhode Island, when using hand signals to indicate a turn, what does
    it mean when the driver's left arm is bent upward at the elbow?
  choices:
    A: The driver is stopping
    B: The driver is turning left
    C: The driver is turning right
    D: The driver is slowing down
  answer: C
  explanation: According to the Rhode Island Driver's Manual, a left arm bent upward
    at the elbow indicates a right turn.
- id: 185
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean at an intersection in Rhode
    Island?
  choices:
    A: Stop and wait for the light to turn green
    B: Slow down and proceed with caution
    C: Speed up to clear the intersection quickly
    D: Treat it like a four-way stop
  answer: B
  explanation: A flashing yellow light means you should slow down and proceed through
    the intersection with caution.
- id: 186
  category: signs_and_signals
  question: 'A pennant-shaped sign (an isosceles triangle pointing right) found on
    the left side of the road in Rhode Island indicates:'
  choices:
    A: A school zone
    B: A yield requirement
    C: A no-passing zone
    D: A construction area
  answer: C
  explanation: A pennant-shaped sign is used specifically to mark the beginning of
    a no-passing zone and is placed on the left side of the road.
- id: 187
  category: signs_and_signals
  question: When parking on a public road in Rhode Island, your vehicle must be within
    how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: Rhode Island law requires that when you park on a two-way street, your
    right-hand wheels must be parallel to and within 12 inches of the right-hand curb.
- id: 188
  category: signs_and_signals
  question: What is the meaning of a solid white line painted on the pavement between
    lanes of traffic moving in the same direction?
  choices:
    A: Lane changes are prohibited
    B: Lane changes are discouraged
    C: The road is one-way only
    D: You must turn in the direction of the line
  answer: B
  explanation: A solid white line indicates that lane changes are discouraged for
    safety reasons, though not strictly prohibited like a double solid white line.
- id: 189
  category: signs_and_signals
  question: 'In Rhode Island, a steady circular yellow light means:'
  choices:
    A: You should speed up to beat the red light
    B: The light is about to turn green
    C: You must stop if you can do so safely; the light is about to turn red
    D: The intersection is clear for all turns
  answer: C
  explanation: A steady yellow light warns that the signal is changing to red. You
    should stop if it is safe to do so; otherwise, clear the intersection.
- id: 190
  category: signs_and_signals
  question: What does a diamond-shaped sign with a yellow background generally indicate
    in Rhode Island?
  choices:
    A: Regulatory information (e.g., Speed Limit)
    B: Warning or hazard ahead
    C: Guide information (e.g., Exit numbers)
    D: Public recreation area
  answer: B
  explanation: Diamond-shaped yellow signs are standard warning signs used to alert
    drivers to hazards or changes in road conditions ahead.
- id: 191
  category: signs_and_signals
  question: In Rhode Island, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn green
    C: Stop, then proceed when it is safe to do so
    D: Stop and wait for a green light
  answer: C
  explanation: According to the Rhode Island Driver's Manual, a flashing red light
    means the same as a stop sign. You must come to a complete stop and then proceed
    when it is safe to do so.
- id: 192
  category: signs_and_signals
  question: When a driver extends their left arm straight out the window, which hand
    signal are they making?
  choices:
    A: Right turn
    B: Left turn
    C: Stop or slow down
    D: U-turn
  answer: B
  explanation: In Rhode Island, the standard hand signal for a left turn is the left
    arm extended straight out the window.
- id: 193
  category: signs_and_signals
  question: What is the meaning of a pennant-shaped sign found on the left side of
    the road?
  choices:
    A: School zone ahead
    B: Yield right-of-way
    C: No passing zone
    D: Railroad crossing
  answer: C
  explanation: A pennant-shaped sign (an isosceles triangle pointing right) is placed
    on the left side of the road to indicate the start of a No Passing Zone.
- id: 194
  category: signs_and_signals
  question: A pentagon-shaped sign (five-sided) indicates which of the following?
  choices:
    A: A construction zone
    B: A hospital nearby
    C: A school zone or school crossing
    D: A dead end
  answer: C
  explanation: The five-sided pentagon shape is reserved exclusively for school zones
    and school crossings in Rhode Island.
- id: 195
  category: signs_and_signals
  question: 'If you are approaching an intersection with a flashing yellow light,
    you should:'
  choices:
    A: Stop completely and wait for it to change
    B: Slow down and proceed with caution
    C: Speed up to avoid a collision
    D: Treat it like a four-way stop
  answer: B
  explanation: A flashing yellow light warns drivers to slow down and be especially
    alert as they proceed through the intersection.
- id: 196
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the roadway signify?
  choices:
    A: Passing is allowed from either side
    B: Passing is allowed only on the right
    C: Passing is prohibited in both directions
    D: The road is one-way only
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    traffic in either direction.
- id: 197
  category: signs_and_signals
  question: A diamond-shaped sign is used to convey what type of information?
  choices:
    A: Regulatory information (like speed limits)
    B: Warning/Caution about hazards ahead
    C: Guidance to destinations
    D: Public recreation information
  answer: B
  explanation: Diamond-shaped signs are warning signs that alert drivers to potential
    hazards or changes in road conditions ahead.
- id: 198
  category: signs_and_signals
  question: 'To signal a right turn using hand signals, a Rhode Island driver should:'
  choices:
    A: Extend the left arm straight out
    B: Extend the left arm upward
    C: Extend the left arm downward
    D: Extend the right arm straight out
  answer: B
  explanation: The correct hand signal for a right turn is the left arm bent at the
    elbow with the hand pointing upward.
- id: 199
  category: signs_and_signals
  question: What does a round yellow sign with a black 'X' and the letters 'RR' indicate?
  choices:
    A: Restricted Roadway ahead
    B: Railroad crossing ahead
    C: Road Repairs ahead
    D: Rough Road ahead
  answer: B
  explanation: A round yellow sign with a black 'X' and 'RR' is a circular warning
    sign indicating a railroad crossing is ahead.
- id: 200
  category: signs_and_signals
  question: 'When you see a ''Yield'' sign at an intersection, you must:'
  choices:
    A: Stop and wait for a green light
    B: Slow down and be prepared to stop to let any vehicle or pedestrian pass
    C: Maintain your speed and expect others to stop for you
    D: Always come to a complete stop regardless of traffic
  answer: B
  explanation: A yield sign means you must slow down and yield the right-of-way to
    traffic in the intersection or on the intersecting road.
- id: 201
  category: signs_and_signals
  question: What does a steady green arrow pointing left mean?
  choices:
    A: You may turn left after yielding to oncoming traffic
    B: You must stop and wait for a circular green light
    C: You may turn left; oncoming traffic is stopped by a red light
    D: Left turns are prohibited at this intersection
  answer: C
  explanation: A green arrow means you have a 'protected' turn. Oncoming traffic is
    stopped, allowing you to turn in the direction of the arrow.
- id: 202
  category: signs_and_signals
  question: Which hand signal should a driver use to indicate they are slowing down
    or stopping?
  choices:
    A: Left arm extended upward
    B: Left arm extended straight out
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: C
  explanation: To signal a stop or a decrease in speed using hand signals, the driver
    should extend their left arm downward with the palm facing the rear.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 203
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 204
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 205
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 206
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 207
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 208
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 209
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 210
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 211
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 212
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 213
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 214
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 215
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 216
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 217
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 218
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 219
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 220
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 221
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 222
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 223
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 224
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 225
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 226
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 227
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 228
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 229
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 230
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
