  explanation: The manual states that the fee to transfer your out-of-state license
    is $44.50.
- id: 70
  category: defensive_driving
  question: What happens to a teen driver's risk of a fatal crash when they add just
    one teen passenger to the vehicle?
  choices:
    A: It remains the same
    B: It increases by 50 percent
    C: It doubles
    D: It triples
