  explanation: According to the manual, for teen drivers, the addition of just one
    teen passenger doubles the likelihood of experiencing a fatal crash.
- id: 71
  category: defensive_driving
  question: How much does the risk of a fatal crash increase for a teen driver with
    two or more teen passengers?
  choices:
    A: 100 percent
    B: 200 percent
    C: 300 percent
    D: 400 percent
  answer: C
  explanation: With two or more teen passengers, the risk of a fatal crash jumps by
    300 percent.
- id: 72
  category: defensive_driving
  question: Which of the following is an example of a physical distraction while driving?
  choices:
    A: Thinking about something that happened during the day
    B: Engaging in a conversation with a passenger
    C: Reaching for an object
    D: Listening to the radio
  answer: C
  explanation: A physical distraction is one that causes a driver to take his or her
    hands off the wheel or eyes off the road, such as reaching for an object.
- id: 73
  category: defensive_driving
  question: How does using a cell phone while driving affect the overall risk of a
    collision?
  choices:
    A: It increases the risk by 100 percent
    B: It increases the risk by 200 percent
    C: It increases the risk by 300 percent
    D: It increases the risk by 400 percent
  answer: D
  explanation: The manual states that the overall risk of a collision while using
    a cell phone increases by 400 percent.
- id: 74
  category: defensive_driving
  question: What does research indicate about the difference in risk between using
    a hand-held cell phone and a hands-free device while driving?
  choices:
    A: Hands-free devices are significantly safer
    B: Hand-held devices are slightly safer
    C: There is no difference in risk between the two modes
    D: Hands-free devices reduce the risk of a crash by half
  answer: C
  explanation: Research indicates no differences in risk between the two modes; both
    methods of cell phone use are fully capable of diverting a driver's attention
    enough to cause a collision.
- id: 75
  category: defensive_driving
  question: Why is text messaging considered even riskier than talking on a cell phone
    while driving?
  choices:
    A: It requires the driver to both look at the phone and manipulate the keypad
    B: It uses more of the phone's battery power
    C: It causes the driver to drive faster
    D: It takes longer to send a text than to make a phone call
  answer: A
  explanation: Evidence suggests text messaging is riskier because it often requires
    the driver to both look at the phone and manipulate the keypad with one's hands.
- id: 76
  category: defensive_driving
  question: What happens to the risk of a collision when a driver looks away from
    the roadway for two or more seconds?
  choices:
    A: It increases by 25 percent
    B: It increases by 50 percent
    C: It doubles
    D: It triples
  answer: C
  explanation: When a driver looks away from the roadway for two or more seconds,
    the risk of a collision doubles.
- id: 77
  category: defensive_driving
  question: What is the term sometimes used for reducing speed and diverting attention
    to a nearby crash scene?
  choices:
    A: Tailgating
    B: Rubbernecking
    C: Hydroplaning
    D: Sightseeing
  answer: B
  explanation: It can be tempting to reduce speed and divert attention to a nearby
    crash scene. Sometimes this is referred to as 'rubbernecking.'
- id: 78
  category: safe_driving_rules
  question: Which of the following is a recommended technique for preventing and managing
    distractions?
  choices:
    A: Review maps and driving directions while stopped at a red light
    B: Preset radio stations and climate control before you get behind the wheel
    C: Keep loose items on the passenger seat for easy access
    D: Do your personal grooming while driving on straight roads
  answer: B
  explanation: Techniques for preventing and managing distractions include presetting
    radio stations, MP3 devices, and climate control before getting behind the wheel.
- id: 79
  category: safe_driving_rules
  question: If you find yourself needing to deal with children while driving, what
    is the safest course of action?
  choices:
    A: Turn around to address them while keeping one hand on the wheel
    B: Ask them to wait until you reach your destination
    C: Pull safely off the road and out of traffic to deal with them
    D: Use the rearview mirror to make eye contact while talking to them
  answer: C
  explanation: The manual advises drivers to pull safely off the road and out of traffic
    to deal with children.
- id: 80
  category: defensive_driving
  question: How can distracted driving affect a driver's decision-making process?
  choices:
    A: It improves reaction time in emergency situations
    B: It causes the driver to make decisions too quickly
    C: It can delay the decision-making process or cause an inappropriate action
    D: It helps the driver focus better on the immediate path of travel
  answer: C
  explanation: Distraction can cause a driver's decision-making process to be delayed,
    or cause a driver to choose an action inappropriate for the situation at hand.
- id: 81
  category: safe_driving_rules
  question: According to the manual, what is the best way to handle emotional conversations
    on a cell phone while driving?
  choices:
    A: Keep the conversation short and hang up quickly
    B: Use a hands-free headset to talk
    C: Pull off the road to a safe spot
    D: Slow down and move to the right lane
  answer: C
  explanation: 'The manual states: ''Do not engage in emotional conversations while
    driving. Pull off the road to a safe spot.'''
- id: 82
  category: safe_driving_rules
  question: What should you do if you must use a cellular phone while driving?
  choices:
    A: Engage in casual conversations to stay awake
    B: Let the person you are speaking with know you are driving
    C: Hold the phone with your non-dominant hand
    D: Only use it while driving on the highway
  answer: B
  explanation: If you must use a cell phone, one of the tips provided is to 'Let the
    person you are speaking with know you are driving.'
- id: 83
  category: defensive_driving
  question: How does talking on a cell phone compare to other frequent causes of distraction
    in terms of causing a near crash?
  choices:
    A: It is less likely to cause a near crash than adjusting the radio
