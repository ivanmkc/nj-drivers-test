metadata:
  source: Rhode Island Driver's Manual (dmv.ri.gov)
  total_questions: 374
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: According to the Rhode Island Driver's Manual, what is the cost to the
    donor or their family for an organ donation to take place?
  choices:
    A: A flat fee of $25.00
    B: It depends on the medical procedure required
    C: There is no cost to the donor or their family
    D: The cost is covered by a mandatory DMV surcharge
  answer: C
  explanation: 'The manual states as a fact: ''There is no cost to the donor or their
    family for donation to take place.'''
- id: 2
  category: driver_responsibility
  question: How does registering as an organ donor affect the medical care you receive?
  choices:
    A: It guarantees faster emergency response times.
    B: It will not affect your medical care.
    C: It reduces the cost of your medical bills.
    D: It requires you to use specific state-approved hospitals.
  answer: B
  explanation: 'The manual explicitly states: ''Fact: Saying "Yes" to donation will
    not affect your medical care.'''
- id: 3
  category: driver_responsibility
  question: Which of the following statements about organ donation in the United States
    is true?
  choices:
    A: It is illegal to buy or sell organs for transplantation.
    B: Only certain major religions support organ donation.
    C: Donors must pay a registration fee when applying for a license.
    D: Organ donation negatively affects the quality of medical care received.
  answer: A
  explanation: 'The manual notes: ''Fact: In the United States, it is illegal to buy
    or sell organs for transplantation.'''
- id: 4
  category: license_system
  question: The Rhode Island Division of Motor Vehicles (DMV) is a governmental agency
    within which state department?
  choices:
    A: Department of Transportation
    B: Department of Education
    C: Department of Revenue
    D: Department of Public Safety
  answer: C
  explanation: 'The manual states: ''The Division of Motor Vehicles (DMV) is a governmental
    agency within the Department of Revenue for the State of Rhode Island.'''
- id: 5
  category: driver_testing
  question: Which institution is responsible for operating Rhode Island's statewide
    Driver Education and Motorcycle safety programs?
  choices:
    A: The Rhode Island State Police
    B: The Department of Transportation
    C: The Community College of Rhode Island (CCRI)
    D: The Division of Motor Vehicles (DMV)
  answer: C
  explanation: The manual states that under the auspices of the Rhode Island Office
    of Higher Education, the Community College of Rhode Island (CCRI) operates the
    statewide Driver Education and Motorcycle safety programs.
- id: 6
  category: driver_testing
  question: What is the fee charged by the Division of Motor Vehicles for an operator
    road test?
  choices:
    A: A non-refundable fee of $25.00 plus a $2.50 technology surcharge
    B: A refundable fee of $25.00
    C: A flat fee of $50.00
    D: There is no fee for the operator road test
  answer: A
  explanation: Effective October 12, 2010, a non-refundable fee of $25.00 (plus a
    $2.50 technology surcharge) will be charged on all operator road tests conducted
    by the Division of Motor Vehicles.
- id: 7
  category: driver_testing
  question: When can a driver schedule their operator road test?
  choices:
    A: Only after completing 50 hours of driving practice
    B: At the time of the computerized knowledge exam or anytime at any DMV facility
    C: Only by calling the Department of Transportation
    D: Exactly six months after receiving an instructional permit
  answer: B
  explanation: According to the manual, 'A road test may be scheduled at the time
    of the computerized knowledge exam or anytime at any DMV facility.'
- id: 8
  category: license_system
  question: As of July 1, 2013, Rhode Island licenses and motor vehicle registrations
    are subject to surcharges as part of which act?
  choices:
    A: The Safe Roads and Bridges Act
    B: The Highway Safety and Education Act
    C: The Transportation Investment and Debt Reduction Act of 2011
    D: The Motor Vehicle Titling and Registration Act
  answer: C
  explanation: 'The manual notes: ''Effective July 1, 2013, Rhode Island licenses
    and motor vehicle registrations are subject to surcharges as part of the Transportation
    Investment and Debt Reduction Act of 2011.'''
- id: 9
  category: license_system
  question: Which of the following is true regarding the Rhode Island Driver's Manual?
  choices:
    A: It is a legally binding document in court.
    B: It is produced solely by the Rhode Island State Police.
    C: It is not a legal document.
    D: It contains only federal driving laws.
  answer: C
  explanation: 'The manual explicitly states: ''While the manual contains a great
    deal of useful information about state laws and driving procedures, this is not
    a legal document.'''
- id: 10
  category: safe_driving_rules
  question: According to the DOT Director's message, what is the leading cause of
    death for all 15-20 year olds?
  choices:
    A: Drug and alcohol overdoses
    B: Motor vehicle crashes
    C: Pedestrian accidents
    D: Distracted walking
  answer: B
  explanation: 'The DOT Director states: ''Motor vehicle crashes are the leading cause
    of death for all 15-20 year olds.'''
- id: 11
  category: driver_responsibility
  question: 'According to the Rhode Island Driver''s Manual, driving in Rhode Island
    is considered:'
  choices:
    A: A constitutional right
    B: A privilege, not a right
    C: A right for anyone over 18
    D: An optional requirement for residents
  answer: B
  explanation: 'The DOT Director''s message emphasizes: ''And a GREAT driver knows
    that driving in Rhode Island is a privilege, not a right...'''
- id: 12
  category: safe_driving_rules
  question: According to the DOT Director, which of the following is a characteristic
    of a 'good driver'?
  choices:
    A: They only allow belted passengers in their vehicle.
    B: They occasionally check phone messages at red lights.
    C: They drive up to 5 mph over the posted speed limit.
    D: They believe driving is a guaranteed right.
  answer: A
  explanation: 'The DOT Director lists several traits of a good driver, including:
    ''A good driver always wears his/her seatbelt and only allows belted passengers
    in their vehicle.'''
- id: 13
  category: penalties_and_points
  question: Which two primary driver retraining programs are managed by the Community
    College of Rhode Island (CCRI)?
  choices:
    A: The Speeding and Reckless Driving courses
    B: The DWI course and the defensive driving course
    C: The CDL and Motorcycle safety courses
    D: The Teen Driving and Senior Driving courses
  answer: B
  explanation: The manual states that CCRI 'manages the state’s two primary driver
    retraining programs, the DWI course and the defensive driving course.'
- id: 14
  category: license_system
  question: According to the manual's Table of Contents, what is the 'Level One' credential
    in the Rhode Island licensing process?
  choices:
    A: Full Operator's License
    B: Limited Provisional License
    C: Commercial Driver's License
    D: Limited Instructional Permit
  answer: D
  explanation: 'The Table of Contents lists ''Level One: Limited Instructional Permit''
    as the first step in applying for a Rhode Island Driver''s License.'
- id: 15
  category: license_system
  question: What is Level One of Rhode Island's Graduated Licensing System?
  choices:
    A: Limited Provisional License
    B: Full Operator's License
    C: Limited Instructional Permit
    D: Learner's Permit
  answer: C
  explanation: According to the Rhode Island Graduated Licensing System outlined in
    the manual, Level One is the Limited Instructional Permit.
- id: 16
  category: safe_driving_rules
  question: According to the Rhode Island Driver's Manual, what rule is used to determine
    a safe following distance?
  choices:
    A: The Two (2) Second Rule
    B: The Three (3) Second Rule
    C: The Four (4) Second Rule
    D: The One Car Length Rule
  answer: B
  explanation: The manual specifies 'The Three (3) Second Rule' for maintaining a
    safe following distance under the Systems for Safe, Courteous, and Defensive Driving
    section.
- id: 17
  category: defensive_driving
  question: Which of the following is explicitly categorized as a driving emergency
    in the Rhode Island Driver's Manual?
  choices:
    A: Starting on a Hill
    B: Proper Backing Procedures
    C: Stuck Accelerator
    D: Entering a Roadway
  answer: C
  explanation: 'A ''Stuck Accelerator'' is explicitly listed under Section V: Driving
    Emergencies in the manual.'
- id: 18
  category: alcohol_drugs_health
  question: What specific type of test refusal is addressed in the Drinking and Driving
    section of the manual?
  choices:
    A: Refusal to Take the Field Sobriety Test
    B: Refusal to Take the Breathalyzer Test
    C: Refusal to Take the Blood Test
    D: Refusal to Take the Urine Test
  answer: B
  explanation: The Drinking and Driving section of the manual specifically covers
    the 'Refusal to Take the Breathalyzer Test'.
- id: 19
  category: vehicle_information
  question: Which of the following types of poisoning is specifically listed as a
    driving emergency?
  choices:
    A: Food Poisoning
    B: Carbon Monoxide Poisoning
    C: Lead Poisoning
    D: Antifreeze Poisoning
  answer: B
  explanation: 'Carbon Monoxide Poisoning is specifically listed as a topic under
    Section V: Driving Emergencies.'
- id: 20
  category: sharing_the_road
  question: When sharing the road safely, the manual includes a specific subsection
    for which type of pedestrian?
  choices:
    A: Joggers
    B: Children
    C: Blind Pedestrians
    D: Elderly Pedestrians
  answer: C
  explanation: 'Under Section VIII: Sharing the Road Safely, there is a specific subsection
    dedicated to ''Blind Pedestrians''.'
- id: 21
  category: defensive_driving
  question: Which of the following collision threats is NOT explicitly listed in the
    Driving Emergencies section?
  choices:
    A: Threat of a Head-On Collision
    B: Threat of a Side-Impact Collision
    C: Threat of a Rear-End Collision
    D: Threat of a Rollover Collision
  answer: D
  explanation: The manual explicitly lists the threat of Head-On, Side-Impact, and
    Rear-End collisions under Driving Emergencies, but does not list Rollover Collisions.
- id: 22
  category: alcohol_drugs_health
  question: What legal concept regarding alcohol and chemical testing is covered in
    the Drinking and Driving section?
  choices:
    A: Zero Tolerance
    B: Implied Consent
    C: Absolute Sobriety
    D: Dram Shop Law
  answer: B
  explanation: 'The concept of ''Implied Consent'' is explicitly covered under Section
    X: Drinking and Driving.'
- id: 23
  category: sharing_the_road
  question: According to the manual's section on sharing the road safely, drivers
    must know how to share the road with which of the following large vehicles?
  choices:
    A: Large Trucks
    B: Streetcars
    C: Light Rail Trains
    D: Tractors
  answer: A
  explanation: Section VIII of the manual specifically includes a subsection on 'Sharing
    the Road with Large Trucks'.
- id: 24
  category: safe_driving_rules
  question: Which of the following is a topic covered under 'Basic Driving Skills
    and Safety Rules'?
  choices:
    A: The Three (3) Second Rule
    B: Rhode Island Safety Belt/Child Restraint Law
    C: Blood Alcohol Concentration
    D: Implied Consent
  answer: B
  explanation: 'The ''Rhode Island Safety Belt/Child Restraint Law'' is covered under
    Section III: Basic Driving Skills and Safety Rules.'
- id: 25
  category: vehicle_information
  question: What specific type of vehicle failure is paired with a 'Blowout' in the
    Driving Emergencies section?
  choices:
    A: Flat Tire
    B: Broken Axle
    C: Steering Failure
    D: Suspension Failure
  answer: A
  explanation: The manual lists 'Blowout or Flat Tire' together as a specific topic
    under Driving Emergencies.
- id: 26
  category: license_system
  question: What are the three levels of Rhode Island's graduated licensing system
    for persons under age 18?
  choices:
    A: Learner's permit, junior license, and senior license
    B: Limited instructional permit, limited provisional license, and full operator's
      license
    C: Student permit, provisional license, and unrestricted license
    D: Instructional permit, restricted license, and full operator's license
  answer: B
  explanation: 'According to the manual, the three levels of the graduated licensing
    system are: limited instructional permit, limited provisional license and full
    operator''s license.'
- id: 27
  category: driver_testing
  question: How many hours is the accredited classroom driver education class required
    for individuals between the ages of 16 and 18?
  choices:
    A: 20 hours
    B: 30 hours
    C: 33 hours
    D: 40 hours
  answer: C
  explanation: If you are between the ages of 16 and 18, you must pass an accredited
    thirty-three (33) hour classroom driver education class before you can get your
    Limited Instructional Permit.
- id: 28
  category: license_system
  question: If you are over the age of 18 and applying for a Limited Instructional
    Permit, which of the following is true?
  choices:
    A: You must complete a 33-hour classroom course.
    B: You are exempt from taking the computerized test.
    C: You are not required to attend the classroom course, but must take the computerized
      test.
    D: You must take a 10-hour defensive driving course.
  answer: C
  explanation: The manual states that if you are over age eighteen (18), you are not
    required to attend the classroom course, but you must take the computerized test.
- id: 29
  category: license_system
  question: What is the minimum age you must be when a driver education class begins
    in order to be eligible to register?
  choices:
    A: 15 years old
    B: 15 years and 6 months old
    C: 15 years and 10 months old
    D: 16 years old
  answer: C
  explanation: You are eligible to register for a driver education class when you
    are between 15 and 18 years of age, provided you will be at least fifteen years
    and ten (10) months old when the class begins.
- id: 30
  category: driver_testing
  question: What is the maximum amount of time allowed to complete the DMV computerized
    test?
  choices:
    A: 30 minutes
    B: 45 minutes
    C: 60 minutes
    D: 90 minutes
  answer: D
  explanation: The computerized test has a 90-minute maximum, but usually takes 20-30
    minutes to complete.
- id: 31
  category: license_system
  question: What must licensed applicants from other states do when applying for a
    Rhode Island license?
  choices:
    A: Take the computerized test and a road test.
    B: Turn in their out-of-state licenses for cancellation.
    C: Complete a 33-hour driver education course.
    D: Keep their out-of-state license and apply for a dual license.
  answer: B
  explanation: Licensed applicants from other states are exempt from taking the test,
    but must turn in their out-of-state licenses for cancellation.
- id: 32
  category: license_system
  question: 'Applicants holding active licenses from foreign countries who wish to
    apply for a Rhode Island license must:'
  choices:
    A: Surrender their foreign license immediately.
    B: Take only the computerized examination.
    C: Take both the computerized examination and a driving test.
    D: Complete a 33-hour driver education class.
  answer: C
  explanation: Applicants holding active licenses from foreign countries may retain
    their foreign country license but must take the examination as well as a driving
    test.
- id: 33
  category: license_system
  question: When applying for a Limited Instructional Permit, which of the following
    is an acceptable form of identification?
  choices:
    A: A photocopy of a birth certificate
    B: A laminated Social Security card
    C: A photocopy of a passport
    D: An original Social Security card
  answer: D
  explanation: Applicants must show an original social security card (not a copy);
    no laminated cards are accepted. Photocopies of identity documents are not acceptable.
- id: 34
  category: license_system
  question: What is the fee for a Limited Instructional Permit at the DMV?
  choices:
    A: $10.00
    B: $12.50
    C: $25.00
    D: $85.00
  answer: B
  explanation: The fee for a Limited Instructional Permit is $12.50 cash, check (no
    third party checks accepted), or money order.
- id: 35
  category: safe_driving_rules
  question: What are the requirements for a supervising driver who accompanies a driver
    with a Limited Instructional Permit?
  choices:
    A: Must be at least 18 years old and licensed for 1 year.
    B: Must be at least 21 years old and licensed for at least 5 years.
    C: Must be at least 25 years old and licensed for at least 3 years.
    D: Must be at least 21 years old and licensed for at least 10 years.
  answer: B
  explanation: A supervising driver must be a licensed driver who has been licensed
    to drive for at least five (5) years and must be twenty-one (21) years of age
    or older.
- id: 36
  category: safe_driving_rules
  question: If a parent who does not hold a valid Rhode Island license signs the application
    for a child under 18, where must the parent sit during practice driving?
  choices:
    A: In the front passenger seat.
    B: In the back seat.
    C: They are not allowed in the vehicle.
    D: In the driver's seat while the child observes.
  answer: B
  explanation: A parent who does not hold a valid Rhode Island license can sign the
    application for a child who is under eighteen (18) years old, but must be seated
    in the back seat during practice driving.
- id: 37
  category: driver_testing
  question: What is the minimum vision requirement with corrected lenses to pass the
    DMV vision test?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: All applicants must take a vision test. Your vision must be at least
    20/40 with corrected lenses.
- id: 38
  category: safe_driving_rules
  question: Where must the supervising driver sit when a person with a Limited Instructional
    Permit is driving?
  choices:
    A: Anywhere in the vehicle.
    B: In the back seat directly behind the driver.
    C: Beside the driver at all times.
    D: Outside the vehicle observing the driver.
  answer: C
  explanation: With a Limited Instructional Permit, the licensed supervising driver
    must be sitting beside you at all times and be ready to take control of the vehicle
    in an emergency.
- id: 39
  category: driver_responsibility
  question: Who is legally responsible for any driving violation committed by a driver
    operating with a Limited Instructional Permit?
  choices:
    A: The driver with the permit.
    B: The supervising driver.
    C: The owner of the vehicle.
    D: The driver education instructor.
  answer: B
  explanation: The manual states that the licensed supervising driver is legally responsible
    for any driving violation you may commit while driving with a Limited Instructional
    Permit.
- id: 40
  category: safe_driving_rules
  question: What is the seatbelt requirement for a driver with a Limited Instructional
    Permit and their passengers?
  choices:
    A: Only the driver and front-seat passengers must wear seatbelts.
    B: Only passengers under 18 must wear seatbelts.
    C: The driver and all passengers must wear a safety belt or be in a child restraint
      system.
    D: Seatbelts are optional if the vehicle has airbags.
  answer: C
  explanation: You must wear a safety belt as required by law unless you provide a
    physician's letter. ALL passengers must wear a safety belt or be in a child restraint
    system as required by law.
- id: 41
  category: safe_driving_rules
  question: Under what condition is a driver exempt from wearing a safety belt according
    to Rhode Island law?
  choices:
    A: If they are driving a vehicle manufactured before 1970.
    B: If they provide the DMV with a physician’s letter indicating a medical reason.
    C: If they are driving at speeds under 25 mph.
    D: If they are over the age of 18.
  answer: B
  explanation: 'The manual states: ''You must wear a safety belt as required by law
    unless you provide the DMV with a physician’s letter indicating you cannot wear
    a safety belt for medical reasons.'''
- id: 42
  category: license_system
  question: How long must you hold a Limited Instructional Permit before you can take
    the Rhode Island DMV road test?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 1 year
  answer: B
  explanation: According to the manual, you must hold a Limited Instructional Permit
    for at least six (6) months before you can take a Rhode Island DMV road test.
- id: 43
  category: license_system
  question: How long is a Limited Instructional Permit valid?
  choices:
    A: Six months or until you reach age 18.
    B: One year or until you reach age 18, whichever comes first.
    C: Two years from the date of issue.
    D: Until you pass the driving test, regardless of time.
  answer: B
  explanation: The manual specifies that the permit is valid for one (1) year OR until
    you reach the age of eighteen (18), whichever comes first.
- id: 44
  category: license_system
  question: To get a Limited Provisional License, how many hours of driving experience
    must be completed and signed off by a parent or guardian?
  choices:
    A: 30 hours, with 5 at night
    B: 40 hours, with 10 at night
    C: 50 hours, with 10 at night
    D: 60 hours, with 15 at night
  answer: C
  explanation: You must present a statement signed by a parent or guardian stating
    that you have completed a minimum of fifty (50) hours of driving experience with
    a supervising driver with ten (10) of those hours at night.
- id: 45
  category: driver_testing
  question: Which of the following will result in an immediate failure of the driving
    test?
  choices:
    A: Asking the examiner to repeat an instruction.
    B: Leaving the designated roadway or driving on the sidewalk.
    C: Taking the test in the rain.
    D: Using the windshield wipers.
  answer: B
  explanation: Reasons for immediate failure include leaving the designated roadway
    (driving on the sidewalk, leaving the laned roadway or leaving the lane of travel,
    and driving in safety zone).
- id: 46
  category: driver_testing
  question: If the registered owner of the vehicle used for the driving test is not
    present, what must be provided to the DMV examiner?
  choices:
    A: A phone call from the owner.
    B: A notarized letter from the owner giving permission to use the vehicle.
    C: The owner's original birth certificate.
    D: A copy of the owner's driving record.
  answer: B
  explanation: If the owner is not present, a notarized letter from the owner giving
    permission to use the vehicle for this purpose must be presented to the DMV examiner.
- id: 47
  category: driver_testing
  question: Vehicles used for the driving test must have a valid inspection sticker.
    What is an exception to this rule?
  choices:
    A: Vehicles that are less than 2 years old or have 24,000 miles or less.
    B: Vehicles registered in another state.
    C: Vehicles manufactured before 2010.
    D: Rental vehicles.
  answer: A
  explanation: 'The manual lists an exception for the valid inspection sticker requirement:
    vehicles that are less than 2 years old or 24,000 miles or less, whichever comes
    first.'
- id: 48
  category: driver_testing
  question: Which of the following is NOT allowed in a vehicle used for the driving
    test?
  choices:
    A: A center emergency brake.
    B: A valid Rhode Island registration.
    C: Pets.
    D: Legal window tint.
  answer: C
  explanation: 'The vehicle requirements for the driving test explicitly state: ''No
    pets allowed in vehicles used for the driving test.'''
- id: 49
  category: driver_testing
  question: If you fail your driving test, how long must you wait before your next
    appointment?
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: If you fail your driving test, you will not be allowed to re-take the
    test immediately. You must wait at least 30 days before your next appointment.
- id: 50
  category: license_system
  question: A person with a Limited Provisional License cannot drive by themselves
    between what hours?
  choices:
    A: 10:00 PM and 5:00 AM
    B: 11:00 PM and 6:00 AM
    C: 12:00 AM and 5:00 AM
    D: 1:00 AM and 5:00 AM
  answer: D
  explanation: 'The manual states in bold capital letters: ''A PERSON WITH A LIMITED
    PROVISIONAL LICENSE CANNOT DRIVE BY THEMSELVES BETWEEN THE HOURS OF 1:00AM AND
    5:00AM.'''
- id: 51
  category: license_system
  question: Under what circumstance is a driver with a Limited Provisional License
    allowed to drive without supervision between 1:00 AM and 5:00 AM?
  choices:
    A: When driving to or from a school dance.
    B: When driving to or from work.
    C: When driving a family member to the airport.
    D: When driving to a friend's house.
  answer: B
  explanation: A driver with a Limited Provisional License may drive without supervision
    between 5:00am and 1:00am, or when driving to or from work, or for volunteer fire/rescue/EMS
    activities.
- id: 52
  category: license_system
  question: To qualify as a supervising driver for a minor applying for a Limited
    Provisional License, a person must be at least 21 years old and have been licensed
    to drive for at least how many years?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: A supervising driver must be a driver who has been licensed to drive
    for at least five (5) years and twenty-one (21) years of age or older.
- id: 53
  category: driver_testing
  question: When arriving for the driving test, what format must your permit be in?
  choices:
    A: A digital copy on a smartphone.
    B: A black and white photocopy.
    C: A color photocopy.
    D: The original permit.
  answer: D
  explanation: The document requirements state you must bring the 'Original permit
    – photocopies are not acceptable.'
- id: 54
  category: driver_testing
  question: Prior to the driving exam, the examiner will conduct a vehicle safety
    inspection. Which of the following is checked during this inspection?
  choices:
    A: The radio and sound system.
    B: The air conditioning.
    C: The hazard lights.
    D: The glove compartment latch.
  answer: C
  explanation: The safety inspection includes checking brake lights, directional lights,
    headlights, hazard lights, tires, and legal tint.
- id: 55
  category: driver_testing
  question: Who is NOT required to take the Rhode Island driving test?
  choices:
    A: All first-time applicants over the age of 18.
    B: Persons with a valid driver’s license from another state.
    C: Applicants who have completed 100 hours of supervised driving.
    D: Applicants who have held a Limited Instructional Permit for over a year.
  answer: B
  explanation: 'The manual states: ''Persons with a valid driver’s license from another
    state are not required to take the driving test.'''
- id: 56
  category: license_system
  question: Under a Level 2 Limited Provisional License, during what hours are you
    permitted to drive without supervision (excluding work or volunteer exceptions)?
  choices:
    A: 6:00 AM to 10:00 PM
    B: 5:00 AM to 1:00 AM
    C: 6:00 AM to midnight
    D: 7:00 AM to 11:00 PM
  answer: B
  explanation: According to the manual, a Level 2 Limited Provisional License allows
    driving without supervision between 5:00 AM and 1:00 AM.
- id: 57
  category: license_system
  question: During the first twelve months of holding a Limited Provisional License,
    what is the restriction on passengers?
  choices:
    A: No passengers are allowed under any circumstances.
    B: Only passengers over the age of 25 are allowed.
    C: No more than one passenger younger than 21 is allowed, excluding immediate
      family.
    D: You may have up to three passengers under 21.
  answer: C
  explanation: During the first twelve months of a limited provisional license, no
    more than one passenger younger than 21 years of age is allowed in the vehicle,
    though immediate family and household members are exempt.
- id: 58
  category: license_system
  question: What is the minimum age required to obtain a Level 3 Full Operator’s License
    in Rhode Island?
  choices:
    A: 16 years old
    B: 17 years old
    C: 17 years and 6 months old
    D: 18 years old
  answer: C
  explanation: In order to get your full operator’s license, you must be at least
    seventeen (17) years and six (6) months old.
- id: 59
  category: license_system
  question: To qualify for a Full Operator’s License, how long must you be free of
    moving violations or safety belt infractions?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: B
  explanation: To receive a Level 3 Full Operator's License, you must have not been
    convicted of a motor vehicle moving violation or safety belt infraction during
    the previous six (6) months.
- id: 60
  category: penalties_and_points
  question: When does a driver's license suspension period officially begin?
  choices:
    A: The day the violation occurred
    B: The day the court issues the suspension order
    C: Only after the license has been surrendered or forwarded to the DMV
    D: 30 days after receiving a notice in the mail
  answer: C
  explanation: The manual states that the suspension period does not begin until your
    license has been surrendered or forwarded to the DMV.
- id: 61
  category: license_system
  question: What are the requirements for a 'supervising driver' for a Level 1 Limited
    Instructional Permit holder?
  choices:
    A: Must be over 18 and hold a valid license.
    B: Must be over 21 and have held a license for at least 5 years.
    C: Must be a parent or legal guardian with a valid license.
    D: Must be a certified driving instructor.
  answer: B
  explanation: A supervising driver is defined as a properly licensed driver who has
    held a license for at least five (5) years and is over twenty-one (21) years old.
- id: 62
  category: license_system
  question: When driving with a Level 1 Limited Instructional Permit, who is allowed
    to sit in the front seat next to the driver?
  choices:
    A: Any licensed passenger
    B: Only the supervising driver
    C: Up to two passengers
    D: Immediate family members only
  answer: B
  explanation: At Level 1, no person other than the supervising driver is located
    in the front seat of the automobile.
- id: 63
  category: driver_testing
  question: How many hours of supervised driving must be completed before applying
    for a Level 2 Limited Provisional License?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: To receive a Level 2 Limited Provisional License, you must complete
    fifty (50) hours of supervised driving with a qualified supervising driver.
- id: 64
  category: license_system
  question: If you move to Rhode Island with a valid out-of-state driver's license,
    under what condition are you exempt from taking a computerized or road test?
  choices:
    A: If your out-of-state license is currently valid or expired for less than one
      year.
    B: If you have been driving for more than five years.
    C: If you are over the age of 21.
    D: You must always take a computerized test when transferring a license.
  answer: A
  explanation: If your out-of-state license is currently valid or has not been expired
    for more than one (1) year, you will not be required to take a computerized test
    or a road test.
- id: 65
  category: defensive_driving
  question: According to the manual, looking away from the path of travel for two
    or more seconds has what effect on the likelihood of a crash?
  choices:
    A: It increases the likelihood by 10 percent.
    B: It doubles the likelihood of a crash.
    C: It triples the likelihood of a crash.
    D: It has no measurable effect if driving under 30 mph.
  answer: B
  explanation: The manual states that looking away from the path of travel for two
    or more seconds doubles the likelihood of a crash.
- id: 66
  category: defensive_driving
  question: How does the manual distinguish between distraction and inattention?
  choices:
    A: Distraction is caused by passengers, while inattention is caused by cell phones.
    B: Distraction is a physical action, while inattention is a visual action.
    C: Distraction is drawn by a situation, event, or person, while inattention is
      when attention drifts without outside influence.
    D: Distraction only happens to young drivers, while inattention happens to older
      drivers.
  answer: C
  explanation: Distraction results when a situation, event or person draws a driver’s
    focus away from driving. Inattention occurs when a driver’s attention drifts away
    without having been influenced by a situation, event or person.
- id: 67
  category: defensive_driving
  question: Which of the following is a way that distractions can affect driving performance?
  choices:
    A: Increased reaction time
    B: Slowed perception of important traffic events
    C: Enhanced peripheral vision
    D: Faster decision-making
  answer: B
  explanation: Distractions can affect driving performance through slowed perception,
    causing drivers to be delayed in perceiving or completely fail to perceive an
    important traffic event.
- id: 68
  category: license_system
  question: What is the age requirement to receive a Level 1 Limited Instructional
    Permit?
  choices:
    A: 15 to 17 years of age
    B: 15 and a half to 18 years of age
    C: 16 to 18 years of age
    D: 17 to 21 years of age
  answer: C
  explanation: To receive a Level 1 Limited Instructional Permit, you must be sixteen
    (16) to eighteen (18) years of age.
- id: 69
  category: license_system
  question: What is the fee to transfer an out-of-state driver's license to a Rhode
    Island license?
  choices:
    A: $27.50
    B: $39.50
    C: $44.50
    D: $62.50
