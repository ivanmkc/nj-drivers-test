  question: 'Si un conducteur est pris en train de faire du « stunting » (ex. : conduire
    à 50 km/h ou plus au-dessus de la limite de vitesse), quelle est la sanction immédiate
    sur la route ?'
  choices:
    A: Un avertissement verbal et une amende de 100 $
    B: Une suspension de permis de 24 heures
    C: Mise en fourrière immédiate du véhicule pendant 7 jours et suspension du permis
      pendant 7 jours
    D: Révocation permanente du permis de conduire
  answer: C
  explanation: À T.-N.-L., le « stunting » ou la conduite à 50 km/h ou plus au-dessus
    de la limite entraîne une mise en fourrière immédiate du véhicule pendant 7 jours
    et une suspension administrative du permis de conduire de 7 jours.
- id: 161
  category: penalties_and_points
  question: 'Un conducteur titulaire d''un permis complet qui fournit un échantillon
    d''haleine dans la « zone d''avertissement » (0,05 à 0,08 d''alcoolémie [BAC])
    pour la première fois fera l''objet d''une suspension immédiate sur le champ de
    :'
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: À Terre-Neuve-et-Labrador, un premier résultat dans la « zone d'avertissement
    » (0,05 à 0,08 d'alcoolémie [BAC]) entraîne une suspension administrative immédiate
    du permis de 7 jours.
- id: 162
  category: penalties_and_points
  question: Combien de points d'inaptitude sont ajoutés à votre dossier pour une condamnation
    pour « conduite imprudente » ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: La conduite imprudente est une infraction grave à Terre-Neuve-et-Labrador,
    entraînant 6 points d'inaptitude.
- id: 163
  category: penalties_and_points
  question: À Terre-Neuve-et-Labrador, combien de points d'inaptitude sont attribués
    pour avoir suivi un autre véhicule de trop près ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Suivre de trop près (talonnage) entraîne l'ajout de 2 points d'inaptitude
    au dossier du conducteur.
- id: 164
  category: penalties_and_points
  question: Si un conducteur est accusé d'une infraction liée à l'alcool en vertu
    du Code criminel (alcoolémie supérieure à 0,08), quelle est la durée de la suspension
    administrative immédiate du permis ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: D
  explanation: Les conducteurs accusés d'une alcoolémie supérieure à 0,08 ou refusant
    de passer un alcootest font l'objet d'une suspension administrative immédiate
    de permis de 90 jours à Terre-Neuve-et-Labrador.
