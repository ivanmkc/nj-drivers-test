- id: 167
  category: sharing_the_road
  question: À Terre-Neuve-et-Labrador, lorsqu'un autobus scolaire est arrêté avec
    ses feux rouges clignotants et son bras d'arrêt déployé, que doivent faire les
    conducteurs sur une route qui n'est PAS divisée par un terre-plein central ?
  choices:
    A: S'arrêter uniquement s'ils circulent dans la même direction que l'autobus
    B: Ralentir à 20 km/h et dépasser avec prudence
    C: S'arrêter dans les deux sens jusqu'à ce que les feux cessent de clignoter
    D: S'arrêter uniquement si des enfants traversent actuellement la route
  answer: C
  explanation: En vertu du Code de la route de Terre-Neuve-et-Labrador, les conducteurs
    s'approchant par l'avant et par l'arrière doivent s'arrêter pour un autobus scolaire
    dont les feux rouges clignotent, à moins que la route ne soit divisée par un terre-plein
    central.
- id: 168
  category: sharing_the_road
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    pour avoir omis de s'arrêter pour un autobus scolaire dont les feux rouges clignotent
    à Terre-Neuve-et-Labrador ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: L'omission de s'arrêter pour un autobus scolaire est considérée comme
    une infraction grave à Terre-Neuve-et-Labrador et entraîne l'ajout de 6 points
    d'inaptitude au dossier du conducteur.
- id: 169
  category: sharing_the_road
  question: Lors d'un dépassement d'un cycliste sur une route dont la limite de vitesse
    est de 60 km/h ou moins, quelle est la distance minimale qu'un conducteur doit
    maintenir entre le véhicule et le cycliste ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: La loi de Terre-Neuve-et-Labrador exige que les conducteurs maintiennent
    une distance minimale de 1 mètre lors du dépassement d'un cycliste. Si la limite
    de vitesse est supérieure à 60 km/h, la distance recommandée passe à 1,5 mètre.
- id: 170
  category: sharing_the_road
  question: Lorsqu'un piéton traverse la rue à un passage pour piétons balisé ou non
    balisé, qui a la priorité à Terre-Neuve-et-Labrador ?
  choices:
    A: L'automobiliste, sauf si le piéton se trouve dans une zone scolaire
    B: Le piéton
    C: L'automobiliste, s'il est arrivé à l'intersection en premier
    D: Le piéton, mais seulement s'il utilise un passage contrôlé par des signaux
  answer: B
  explanation: À Terre-Neuve-et-Labrador, les piétons ont la priorité aux passages
    pour piétons balisés et non balisés aux intersections. Les conducteurs doivent
    céder le passage aux piétons qui se sont engagés dans le passage pour piétons.
- id: 171
  category: sharing_the_road
  question: Les gros camions commerciaux ont des « No-Zones » (zones de non-visibilité).
    À quoi ce terme fait-il référence ?
  choices:
    A: Aux zones où les camions ne sont pas autorisés à circuler
    B: À la zone de chargement du camion
    C: Aux angles morts autour du camion où votre voiture peut disparaître de la vue
      du conducteur
    D: À des voies spécifiques réservées uniquement aux véhicules d'urgence
  answer: C
  explanation: Les « No-Zones » sont de grands angles morts situés derrière, devant
    et des deux côtés d'un camion commercial, où le conducteur du camion ne peut pas
    voir les autres véhicules.
- id: 172
  category: sharing_the_road
  question: Lorsque vous suivez une motocyclette, pourquoi devriez-vous maintenir
    une distance de suivi plus grande que pour une voiture ?
  choices:
    A: Les motocyclettes s'arrêtent beaucoup plus lentement que les voitures
    B: Les motocyclettes sont plus légères et peuvent s'arrêter ou manœuvrer plus
      rapidement
    C: Les motocyclistes sont tenus par la loi d'avoir plus d'espace
    D: Pour éviter les gaz d'échappement de la motocyclette
  answer: B
  explanation: Les motocyclettes peuvent s'arrêter très rapidement. Maintenir une
    distance de suivi de 3 secondes (ou plus) vous assure d'avoir assez de temps pour
    réagir si le motocycliste freine soudainement.
- id: 173
  category: sharing_the_road
  question: 'Si un véhicule d''urgence (ambulance, camion de pompiers ou voiture de
    police) s''approche de vous par l''arrière avec des sirènes et des feux clignotants,
    vous devez :'
  choices:
    A: Vous arrêter exactement là où vous êtes
    B: Accélérer pour rester devant lui
    C: Vous ranger à droite aussi loin que possible et vous arrêter
    D: Tourner dans l'entrée la plus proche et attendre
  answer: C
  explanation: Les conducteurs doivent immédiatement se ranger vers le trottoir de
    droite ou le bord de la chaussée, à l'écart de toute intersection, et s'arrêter
    jusqu'à ce que le véhicule d'urgence soit passé.
- id: 174
  category: sharing_the_road
  question: À Terre-Neuve-et-Labrador, un conducteur qui ne cède pas le passage à
    un piéton dans un passage pour piétons est passible de combien de points d'inaptitude
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: Selon le système de points d'inaptitude de T.-N.-L., le fait de ne
    pas céder le passage à un piéton entraîne 2 points d'inaptitude.
- id: 175
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut avoir
    besoin de :'
  choices:
    A: Rester près du trottoir de droite
    B: Faire un virage large vers la gauche avant de tourner à droite
    C: S'arrêter et attendre que tout le trafic ait libéré l'intersection
    D: Tourner à partir de la voie la plus à gauche
  answer: B
  explanation: En raison de leur longueur, les gros camions doivent souvent faire
    un virage large vers la gauche pour éviter le trottoir lors d'un virage à droite.
    Les conducteurs ne doivent jamais essayer de se faufiler entre le camion et le
    trottoir.
- id: 176
  category: sharing_the_road
  question: 'Une personne portant une canne blanche avec un bout rouge est probablement
    :'
  choices:
    A: Un travailleur de la construction routière
    B: Un piéton ayant une déficience visuelle
    C: Un policier en civil
    D: Une personne perdue qui cherche de l'aide
  answer: B
  explanation: Une canne blanche, souvent avec un bout rouge, indique que le piéton
    est malvoyant. Les conducteurs doivent faire preuve d'une extrême prudence et
    céder le passage.
- id: 177
  category: sharing_the_road
  question: Lorsque vous suivez un véhicule lourd la nuit, à quelle distance de ce
    véhicule devez-vous baisser vos feux de route (passer en feux de croisement) ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: À T.-N.-L., vous devez passer aux feux de croisement lorsque vous suivez
    n'importe quel véhicule à moins de 150 mètres pour éviter d'éblouir le conducteur
    via ses rétroviseurs.
- id: 178
  category: sharing_the_road
  question: Laquelle des affirmations suivantes est vraie concernant les cyclistes
    à Terre-Neuve-et-Labrador ?
  choices:
    A: Ils doivent rouler sur le trottoir en tout temps
    B: Ils ont les mêmes droits et responsabilités que les conducteurs de véhicules
      à moteur
    C: Ils ne sont pas autorisés à utiliser des signaux manuels
    D: Ils doivent toujours rouler à contre-sens de la circulation
  answer: B
  explanation: Les cyclistes sont considérés comme des véhicules en vertu du Code
    de la route (Highway Traffic Act) et ont les mêmes droits et devoirs que les conducteurs
    de véhicules à moteur.
- id: 179
  category: sharing_the_road
  question: Si vous conduisez derrière un autobus scolaire, quelle est la distance
    minimale à laquelle vous devez vous arrêter à l'arrière de l'autobus lorsque ses
    feux rouges clignotent ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 10 mètres
    D: 20 mètres
  answer: D
  explanation: À T.-N.-L., vous devez vous arrêter à au moins 20 mètres de l'arrière
    d'un autobus scolaire lorsque ses feux rouges clignotent pour assurer la sécurité
    des enfants qui montent ou descendent.
- id: 180
  category: sharing_the_road
  question: Lorsque vous partagez la route avec une motocyclette, pourquoi est-il
    souvent difficile de juger sa vitesse et sa distance ?
  choices:
    A: Elles sont tenues de rouler plus vite que les voitures
    B: Leur taille réduite les fait paraître plus éloignées qu'elles ne le sont réellement
    C: Elles n'ont pas de feux stop
    D: Elles changent constamment de voie
  answer: B
  explanation: Parce que les motocyclettes ont un profil plus petit, il est plus difficile
    pour les autres conducteurs de juger avec précision leur vitesse ou leur distance.
- id: 181
  category: sharing_the_road
  question: Selon la « Loi d'Ellen » à Terre-Neuve-et-Labrador, quelle est la distance
    minimale qu'un véhicule à moteur doit maintenir lorsqu'il dépasse un cycliste
    ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 1,5 mètre
    D: 2 mètres
  answer: B
  explanation: La Loi d'Ellen exige que les conducteurs de Terre-Neuve-et-Labrador
    maintiennent une distance minimale d'un mètre entre leur véhicule et une bicyclette
    lors d'un dépassement.
- id: 182
  category: sharing_the_road
  question: Lorsqu'un autobus scolaire est arrêté sur une route divisée par un terre-plein
    central, quels conducteurs sont tenus de s'arrêter pour les feux rouges clignotants
    ?
  choices:
    A: Les conducteurs de toutes les voies dans les deux directions
    B: Uniquement les conducteurs arrivant de l'avant
    C: Uniquement les conducteurs suivant l'autobus dans la même direction
    D: Aucun conducteur n'est tenu de s'arrêter s'il y a un terre-plein
  answer: C
  explanation: Sur une route divisée où il y a un terre-plein physique ou une barrière,
    seul le trafic suivant l'autobus scolaire est tenu de s'arrêter. Le trafic circulant
    dans la direction opposée de l'autre côté du terre-plein n'a pas besoin de s'arrêter.
- id: 183
  category: sharing_the_road
  question: 'Un piéton utilisant une canne blanche à bout rouge indique qu''il est
    :'
  choices:
    A: Un travailleur de la construction
    B: Une personne ayant une déficience auditive
    C: Une personne ayant une déficience visuelle
    D: Un policier hors service
  answer: C
  explanation: Une canne blanche, souvent avec un bout rouge, est utilisée par les
    personnes aveugles ou malvoyantes. Les conducteurs doivent faire preuve d'une
    extrême prudence et céder la priorité de passage.
- id: 184
  category: sharing_the_road
  question: En vertu du Code de la route de Terre-Neuve-et-Labrador, qui a la priorité
    de passage lorsqu'un piéton se trouve dans un passage pour piétons marqué ou non
    marqué à une intersection ?
  choices:
    A: Le conducteur, s'il tourne à droite
    B: Le piéton
    C: Le conducteur, s'il va tout droit
    D: La personne qui est arrivée à l'intersection en premier
  answer: B
  explanation: Les conducteurs doivent céder la priorité de passage aux piétons qui
    se trouvent légalement dans un passage pour piétons, qu'il soit marqué ou non.
- id: 185
  category: sharing_the_road
  question: Lors du dépassement d'un cycliste, s'il n'y a pas assez d'espace pour
    respecter la distance de 1 mètre requise par la loi, que doit faire le conducteur
    ?
  choices:
    A: Klaxonner pour avertir le cycliste de se tasser
    B: Passer de près mais lentement
    C: Attendre derrière le cycliste jusqu'à ce qu'il soit possible de dépasser en
      toute sécurité avec l'espace requis de 1 mètre
    D: Rouler sur l'accotement pour dépasser
  answer: C
  explanation: Si un conducteur ne peut pas maintenir en toute sécurité la distance
    d'un mètre requise par la Loi d'Ellen, il doit attendre derrière le cycliste jusqu'à
    ce que les conditions de circulation permettent un dépassement sécuritaire.
- id: 186
  category: sharing_the_road
  question: Que sont les « No-Zones » autour d'un gros camion commercial ?
  choices:
    A: Les zones où le camion n'est pas autorisé à circuler
    B: Les angles morts du camion où le conducteur ne peut pas voir les autres véhicules
    C: Les voies réservées aux véhicules d'urgence
    D: Uniquement la zone située directement devant le camion
  answer: B
  explanation: Les « No-Zones » sont les grands angles morts situés à l'avant, à l'arrière
    et sur les côtés d'un camion, où le conducteur du camion a une visibilité limitée
    ou nulle.
- id: 187
  category: sharing_the_road
  question: À Terre-Neuve-et-Labrador, quand est-il permis de circuler à côté d'une
    motocyclette dans la même voie ?
  choices:
    A: Lorsque la voie est assez large
    B: Jamais ; les motocyclettes ont droit à l'utilisation complète d'une voie
    C: Uniquement lorsque la motocyclette circule lentement
    D: Uniquement pendant les heures de clarté
  answer: B
  explanation: Les motocyclettes ont droit à toute la largeur d'une voie. Le partage
    de voie ou la circulation entre les files n'est pas autorisé, et les véhicules
    ne doivent pas empiéter sur la voie de la motocyclette.
- id: 188
  category: sharing_the_road
  question: 'À Terre-Neuve-et-Labrador, la loi exige que les cyclistes :'
  choices:
    A: Roulent sur le trottoir en tout temps
    B: Roulent à contresens de la circulation
    C: Suivent les mêmes règles de la route que les véhicules à moteur
    D: Roulent uniquement sur les pistes cyclables désignées
  answer: C
  explanation: Les cyclistes sont considérés comme des conducteurs de véhicules en
    vertu du Code de la route et ont les mêmes droits et responsabilités que les automobilistes,
    y compris l'obligation d'obéir aux signaux et panneaux de signalisation.
- id: 189
  category: vehicle_information
  question: À Terre-Neuve-et-Labrador, quelle est la profondeur minimale légale de
    la bande de roulement des pneus d'un véhicule de tourisme ?
  choices:
    A: 3,0 millimètres
    B: 1,5 millimètre
    C: 0,5 millimètre
    D: 2,5 millimètres
  answer: B
  explanation: Selon les règlements sur les véhicules de Terre-Neuve-et-Labrador,
    les pneus sont considérés comme dangereux si la profondeur de la bande de roulement
    est inférieure à 1,5 millimètre (environ 1/16 de pouce).
- id: 190
  category: vehicle_information
  question: Entre quelles dates l'utilisation de pneus à clous est-elle autorisée
    sur les véhicules à Terre-Neuve-et-Labrador ?
  choices:
    A: Du 1er octobre au 1er avril
    B: Du 1er novembre au 30 avril
    C: Du 1er décembre au 31 mars
    D: Du 15 novembre au 15 mai
  answer: B
  explanation: À Terre-Neuve-et-Labrador, les pneus à clous sont légalement autorisés
    du 1er novembre au 30 avril de chaque année. L'utilisation en dehors de ces dates
    peut entraîner une amende, à moins qu'une prolongation ne soit accordée en raison
    des conditions météorologiques.
- id: 191
  category: vehicle_information
  question: À quel moment un conducteur de Terre-Neuve-et-Labrador doit-il allumer
    les phares de son véhicule ?
  choices:
    A: Uniquement entre le coucher et le lever du soleil
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: D'une demi-heure après le coucher du soleil à une demi-heure avant le lever
      du soleil, ou chaque fois que la visibilité est inférieure à 150 mètres
    D: Uniquement lorsqu'il pleut ou qu'il neige
  answer: C
  explanation: Le Code de la route de T.-N.-L. exige que les phares soient allumés
    d'une demi-heure après le coucher du soleil à une demi-heure avant le lever du
    soleil, et à tout moment où la visibilité est réduite à moins de 150 mètres.
- id: 192
  category: vehicle_information
  question: Tout véhicule à moteur à Terre-Neuve-et-Labrador doit être équipé de quel
    système de freinage parmi les suivants ?
  choices:
    A: Uniquement un frein au pied (frein de service)
    B: Uniquement un frein à main d'urgence
    C: 'Deux moyens distincts d''appliquer les freins : un frein de service et un
      frein de stationnement'
    D: Un système de freinage antiblocage (ABS) est la seule exigence légale
  answer: C
  explanation: 'La loi exige que les véhicules soient équipés de deux systèmes de
    freinage indépendants : le frein de service (frein au pied) et un frein de stationnement
    capable de maintenir le véhicule sur n''importe quelle pente.'
- id: 193
  category: vehicle_information
  question: 'Le klaxon d''un véhicule à moteur doit être audible dans des conditions
    normales à une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: À Terre-Neuve-et-Labrador, un véhicule à moteur doit être muni d'un
    klaxon en bon état de fonctionnement pouvant être entendu à une distance d'au
    moins 60 mètres.
- id: 194
  category: vehicle_information
  question: Quelle est l'exigence concernant les rétroviseurs si le rétroviseur intérieur
    est obstrué par un chargement ou une remorque ?
  choices:
    A: Aucun rétroviseur supplémentaire n'est requis si vous utilisez un signaleur
    B: Vous devez avoir un rétroviseur sur le côté gauche uniquement
    C: Vous devez avoir des rétroviseurs sur les côtés extérieurs gauche et droit
    D: Vous n'êtes pas autorisé à conduire si le rétroviseur intérieur est obstrué
  answer: C
  explanation: Si la vue depuis le rétroviseur intérieur est obstruée, le véhicule
    doit être équipé de rétroviseurs extérieurs à gauche et à droite pour offrir une
    vue claire de la route vers l'arrière.
- id: 195
  category: vehicle_information
  question: 'La plaque d''immatriculation arrière d''un véhicule doit être éclairée
    par une lumière blanche de manière à être clairement visible à une distance de
    :'
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 25 mètres
  answer: C
  explanation: Le Code de la route de T.-N.-L. précise que la plaque d'immatriculation
    arrière doit être éclairée par une lumière blanche la rendant visible à une distance
    de 15 mètres.
- id: 196
  category: vehicle_information
  question: À Terre-Neuve-et-Labrador, quelle est l'exigence légale concernant le
    système d'échappement d'un véhicule ?
  choices:
    A: Il doit être muni d'un silencieux qui empêche le bruit et la fumée excessifs
    B: Les dispositifs d'échappement libre (cut-outs) sont autorisés pour la conduite
      sur autoroute
    C: L'échappement peut être évacué directement par le côté du moteur
    D: Aucun silencieux n'est requis si le véhicule a plus de 20 ans
  answer: A
  explanation: Tout véhicule à moteur doit être équipé d'un silencieux en bon état
    de fonctionnement pour éviter les bruits excessifs ou inhabituels et la fumée
    gênante. Les dispositifs de dérivation ou d'échappement libre sont interdits.
- id: 197
  category: vehicle_information
  question: Quand êtes-vous tenu de faire effectuer une inspection mécanique professionnelle
    sur un véhicule à T.-N.-L. ?
  choices:
    A: Chaque année pour tous les véhicules personnels
    B: Uniquement lorsque le véhicule est impliqué dans un accident majeur
    C: Lors du transfert de propriété d'un véhicule d'occasion
    D: Uniquement si le véhicule a plus de 10 ans
  answer: C
  explanation: À Terre-Neuve-et-Labrador, un poste d'inspection des véhicules doit
    délivrer un certificat d'inspection officiel avant que la propriété d'un véhicule
    d'occasion ne puisse être transférée à un nouveau propriétaire.
- id: 198
  category: vehicle_information
  question: De quelle couleur doivent être les feux de changement de direction (clignotants)
    avant d'un véhicule à Terre-Neuve-et-Labrador ?
  choices:
    A: Blanc ou ambre
    B: Rouge ou ambre
    C: Bleu ou blanc
    D: Vert ou ambre
  answer: A
  explanation: Selon les normes d'équipement des véhicules, les clignotants avant
    doivent être blancs ou ambres, tandis que les clignotants arrière doivent être
    rouges ou ambres.
- id: 199
  category: vehicle_information
  question: Si un véhicule est équipé d'un pare-brise, quel autre équipement est obligatoire
    par la loi ?
  choices:
    A: Une caméra de tableau de bord
    B: Une bande solaire teintée
    C: Des essuie-glaces en bon état de fonctionnement
    D: Un support de montage GPS
  answer: C
  explanation: Le Code de la route exige que tout véhicule à moteur équipé d'un pare-brise
    soit également muni d'un dispositif permettant de nettoyer la pluie, la neige
    ou toute autre humidité du pare-brise (essuie-glaces) contrôlé par le conducteur.
- id: 200
  category: vehicle_information
  question: 'À Terre-Neuve-et-Labrador, les feux arrière doivent être rouges et visibles
    à une distance d''au moins :'
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Les feux arrière d'un véhicule à moteur doivent être rouges et clairement
    visibles à une distance de 150 mètres vers l'arrière.
- id: 201
  category: vehicle_information
  question: Lorsque vous suivez un autre véhicule la nuit, à quelle distance devez-vous
    passer de vos feux de route aux feux de croisement ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: À Terre-Neuve-et-Labrador, vous devez baisser vos feux de route lorsque
    vous suivez un autre véhicule à moins de 60 mètres pour éviter l'éblouissement
    dans les rétroviseurs du conducteur qui vous précède.
- id: 202
  category: vehicle_information
  question: Selon la loi de Terre-Neuve-et-Labrador, quand les phares d'un véhicule
    doivent-ils être allumés ?
  choices:
    A: Du coucher au lever du soleil
    B: D'une heure après le coucher du soleil à une heure avant le lever du soleil
    C: De 30 minutes après le coucher du soleil à 30 minutes avant le lever du soleil
    D: Uniquement lorsqu'il pleut ou qu'il neige
  answer: C
  explanation: Les phares doivent être allumés de 30 minutes après le coucher du soleil
    jusqu'à 30 minutes avant le lever du soleil, et à tout autre moment où la visibilité
    est réduite à moins de 150 mètres.
- id: 203
  category: vehicle_information
  question: 'Tout véhicule à moteur à Terre-Neuve-et-Labrador doit être équipé d''un
    klaxon pouvant être entendu d''une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Le Code de la route (Highway Traffic Act) exige un klaxon en bon état
    de fonctionnement capable d'émettre un son audible dans des conditions normales
    à une distance d'au moins 60 mètres.
- id: 204
  category: vehicle_information
  question: Laquelle des affirmations suivantes est vraie concernant le teintage des
    vitres du pare-brise et des vitres latérales avant à Terre-Neuve-et-Labrador ?
  choices:
    A: Tout niveau de teinte est autorisé tant que le conducteur porte des lunettes.
    B: Le teintage est autorisé s'il a été installé par le fabricant.
    C: Nul ne doit conduire un véhicule dont le pare-brise ou les vitres latérales
      avant sont recouverts d'un film ou d'une teinte non transparente.
    D: Seule une teinte de 50 % est autorisée sur le pare-brise.
  answer: C
  explanation: À Terre-Neuve-et-Labrador, il est illégal d'appliquer une teinte après-vente
    ou tout matériau non transparent sur le pare-brise ou sur les vitres situées directement
    à gauche et à droite du conducteur.
- id: 205
  category: vehicle_information
  question: Si un véhicule remorque une remorque qui obstrue la vue dans le rétroviseur
    intérieur, quel équipement est requis ?
  choices:
    A: Un rétroviseur intérieur grand angle
    B: Une caméra de recul uniquement
    C: Des rétroviseurs fixés sur les côtés gauche et droit du véhicule
    D: Aucun équipement supplémentaire n'est nécessaire si la remorque est petite
  answer: C
  explanation: Si la vue vers l'arrière est obstruée par une remorque ou un chargement,
    le véhicule doit être équipé de rétroviseurs sur les côtés gauche et droit pour
    offrir une vue dégagée de la route vers l'arrière.
- id: 206
  category: vehicle_information
  question: À Terre-Neuve-et-Labrador, le frein de service (frein à pied) d'un véhicule
    à moteur doit être capable d'arrêter le véhicule sur une surface sèche, plane
    et dure à quelle distance à une vitesse de 30 km/h ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: B
  explanation: Selon les règlements du Code de la route de Terre-Neuve-et-Labrador,
    le frein de service doit pouvoir arrêter le véhicule en moins de 10 mètres lorsqu'il
    roule à une vitesse de 30 km/h.
- id: 207
  category: vehicle_information
  question: De quelle couleur doit être la lumière qui éclaire la plaque d'immatriculation
    arrière ?
  choices:
    A: Rouge
    B: Bleue
    C: Blanche
    D: Jaune
  answer: C
  explanation: La plaque d'immatriculation arrière doit être éclairée par une lumière
    blanche afin que la plaque soit clairement visible d'une distance d'au moins 15
    mètres.
- id: 208
  category: vehicle_information
  question: Qui est légalement responsable de s'assurer qu'un passager de moins de
    16 ans porte sa ceinture de sécurité à Terre-Neuve-et-Labrador ?
  choices:
    A: Le passager
    B: Les parents du passager (même s'ils ne sont pas dans la voiture)
    C: Le conducteur du véhicule
    D: Le propriétaire du véhicule uniquement
  answer: C
  explanation: À Terre-Neuve-et-Labrador, le conducteur est responsable de s'assurer
    que tous les passagers de moins de 16 ans sont correctement attachés.
- id: 209
  category: vehicle_information
  question: 'Tout véhicule à moteur doit être équipé d''un rétroviseur situé de manière
    à refléter au conducteur une vue de la route sur une distance d''au moins :'
  choices:
    A: 30 mètres vers l'arrière
    B: 60 mètres vers l'arrière
    C: 100 mètres vers l'arrière
    D: 200 mètres vers l'arrière
  answer: B
  explanation: La loi exige un rétroviseur qui offre une vue de la route vers l'arrière
    sur une distance d'au moins 60 mètres.
- id: 210
  category: vehicle_information
  question: Quelle est l'exigence concernant les garde-boue (ailes) sur les véhicules
    à Terre-Neuve-et-Labrador ?
  choices:
    A: Ils ne sont requis que pour les camions commerciaux.
    B: Ils ne sont requis que pendant les mois d'hiver.
    C: Tout véhicule à moteur et toute remorque doivent être équipés de garde-boue
      ou d'ailes pour réduire les projections des roues.
    D: Ils sont facultatifs pour toutes les voitures de tourisme.
  answer: C
  explanation: Le Code de la route exige que tous les véhicules à moteur et remorques
    soient équipés de garde-boue, d'ailes ou de bavettes pour réduire les projections
    d'eau et de boue vers l'arrière.
- id: 211
  category: signs_and_signals
  question: À Terre-Neuve-et-Labrador, que devez-vous faire à l'approche d'un feu
    rouge clignotant ?
  choices:
    A: Ralentir et avancer avec prudence
    B: S'arrêter et attendre que le feu passe au vert
    C: S'arrêter, céder le passage à la circulation et aux piétons, et avancer quand
      cela est sécuritaire
    D: Céder le passage à la circulation venant de la droite uniquement
  answer: C
  explanation: 'Selon le Guide du conducteur de Terre-Neuve-et-Labrador, un feu rouge
    clignotant doit être traité de la même manière qu''un panneau d''arrêt : faites
    un arrêt complet et n''avancez que lorsque c''est sécuritaire.'
- id: 212
  category: signs_and_signals
  question: Que signifie un feu jaune (ambre) clignotant à une intersection à Terre-Neuve-et-Labrador
    ?
  choices:
    A: S'arrêter et attendre que le feu passe au vert
    B: Accélérer pour dégager l'intersection rapidement
    C: Le feu est sur le point de passer au rouge
    D: Ralentir et avancer avec prudence
  answer: D
  explanation: Un feu jaune clignotant indique que vous devez réduire votre vitesse
    et faire preuve d'une prudence accrue en entrant ou en traversant l'intersection.
- id: 213
  category: signs_and_signals
  question: Lorsqu'un conducteur sort son bras gauche par la fenêtre et le pointe
    vers le haut, qu'indique ce signal manuel ?
  choices:
    A: Un virage à gauche
    B: Un virage à droite
    C: Un arrêt ou une diminution soudaine de la vitesse
    D: Le conducteur fait signe à quelqu'un
  answer: B
  explanation: Le signal manuel standard pour un virage à droite est le bras gauche
    tendu vers l'extérieur et plié vers le haut au niveau du coude.
- id: 214
  category: signs_and_signals
  question: Que signifie une ligne jaune continue de votre côté de la ligne médiane
    à Terre-Neuve-et-Labrador ?
  choices:
    A: Le dépassement est autorisé si la route est libre
    B: Le dépassement est interdit
    C: Vous êtes dans une zone à sens unique
    D: Vous devez tourner à gauche
  answer: B
  explanation: Une ligne jaune continue de votre côté de la route indique qu'il est
    dangereux et illégal de dépasser d'autres véhicules.
- id: 215
  category: signs_and_signals
  question: Lorsque vous voyez un panneau « Travaux » avec un fond orange, à quoi
    devez-vous vous attendre concernant les amendes pour excès de vitesse dans cette
    zone ?
  choices:
    A: Les amendes sont les mêmes que sur n'importe quelle autre route
    B: Les amendes sont réduites de moitié pour encourager la fluidité du trafic
    C: Les amendes sont doublées dans les zones de construction
    D: Les amendes ne s'appliquent que si des travailleurs sont visibles
  answer: C
  explanation: En vertu de la loi de Terre-Neuve-et-Labrador, les amendes pour excès
    de vitesse sont doublées lorsque l'infraction se produit dans une zone de construction
    désignée.
- id: 216
  category: signs_and_signals
  question: Que signifie un symbole de losange blanc peint sur une voie à Terre-Neuve-et-Labrador
    ?
  choices:
    A: La voie est réservée uniquement à la circulation à grande vitesse
    B: La voie est réservée à des véhicules spécifiques comme les autobus ou le covoiturage
    C: La voie se termine bientôt
    D: La voie est réservée uniquement aux véhicules d'urgence
  answer: B
  explanation: Le symbole du losange indique une voie réservée, généralement pour
    les autobus, les taxis ou les véhicules multioccupants (VMO).
- id: 217
  category: signs_and_signals
  question: Si un feu de circulation affiche simultanément une flèche verte et un
    feu rouge, qu'êtes-vous autorisé à faire ?
  choices:
    A: S'arrêter et attendre le feu vert complet
    B: Avancer uniquement dans la direction de la flèche, en cédant le passage aux
      piétons
    C: Tourner dans n'importe quelle direction tant que c'est sécuritaire
    D: Le feu est en panne ; traitez-le comme un arrêt à quatre sens
  answer: B
  explanation: Une flèche verte avec un feu rouge signifie que vous ne pouvez avancer
    que dans la direction de la flèche, à condition de céder le passage aux piétons
    et aux autres véhicules déjà engagés dans l'intersection.
- id: 218
  category: signs_and_signals
  question: Qu'indique un signal du bras et de la main pointés vers le bas de la part
    d'un conducteur ?
  choices:
    A: Un virage à droite
    B: Un virage à gauche
    C: Un arrêt ou un ralentissement
    D: Le conducteur signale un danger
  answer: C
  explanation: Le signal manuel pour s'arrêter ou ralentir est le bras gauche tendu
    vers l'extérieur et vers le bas.
- id: 219
  category: signs_and_signals
  question: À Terre-Neuve-et-Labrador, que signifient les doubles lignes jaunes continues
    au centre de la route ?
  choices:
    A: Le dépassement est autorisé de jour seulement
    B: Le dépassement est autorisé des deux côtés
    C: Le dépassement est interdit dans les deux directions
    D: Le dépassement est autorisé s'il n'y a pas de circulation en sens inverse
  answer: C
  explanation: Les doubles lignes jaunes continues signifient que le dépassement est
    strictement interdit pour la circulation circulant dans les deux sens.
- id: 220
  category: signs_and_signals
  question: Quelle est la signification d'un signal de priorité au transport en commun
    affichant une barre blanche verticale sur fond noir ?
  choices:
    A: Toute la circulation doit s'arrêter
    B: Seuls les véhicules d'urgence peuvent passer
    C: Seuls les autobus de transport en commun peuvent passer
    D: Le signal est sur le point de passer au rouge
  answer: C
  explanation: Une barre blanche verticale sur fond noir est un signal de priorité
    au transport en commun, permettant aux autobus de traverser l'intersection alors
    que les autres véhicules font face à un feu rouge.
- id: 221
  category: signs_and_signals
  question: À l'approche d'un passage à niveau où les feux de signalisation clignotent,
    quelle est la distance minimale à laquelle vous devez vous arrêter par rapport
    au rail le plus proche ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: À Terre-Neuve-et-Labrador, lorsqu'un train approche, vous devez vous
    arrêter à au moins 5 mètres (15 pieds) du rail le plus proche.
- id: 222
  category: signs_and_signals
  question: Que signifie une ligne blanche continue entre deux voies de circulation
    circulant dans la même direction ?
  choices:
    A: Le changement de voie est encouragé
    B: Le changement de voie est déconseillé et doit être évité
    C: La voie est réservée au stationnement uniquement
    D: Vous devez accélérer
  answer: B
  explanation: Une ligne blanche continue entre des voies circulant dans la même direction
    indique que les changements de voie sont déconseillés en raison de dangers potentiels.
- id: 223
  category: signs_and_signals
  question: Quelle est la signification principale d'un panneau « Cédez le passage
    » ?
  choices:
    A: S'arrêter complètement et attendre 3 secondes
    B: Accélérer pour s'insérer dans la circulation
    C: Ralentir et s'arrêter si nécessaire pour céder le passage aux autres usagers
    D: Vous avez la priorité sur tous les autres véhicules
  answer: C
  explanation: Un panneau « Cédez le passage » signifie que vous devez ralentir et
    être prêt à vous arrêter pour laisser passer tout véhicule ou piéton se trouvant
    dans l'intersection ou sur la route de raccordement avant de continuer.
- id: 224
  category: signs_and_signals
  question: À Terre-Neuve-et-Labrador, que signifie un feu de circulation rouge clignotant
    ?
  choices:
    A: Ralentir et avancer avec prudence
    B: Le feu est sur le point de passer au vert
    C: S'arrêter et ne repartir que lorsque cela peut se faire en toute sécurité
    D: S'arrêter et attendre le feu vert
  answer: C
  explanation: 'Selon le Guide du conducteur de T.-N.-L., un feu rouge clignotant
    a la même signification qu''un panneau d''arrêt : vous devez marquer un arrêt
    complet et ne repartir que lorsque c''est sécuritaire.'
- id: 225
  category: signs_and_signals
  question: Lorsqu'un conducteur tend le bras gauche horizontalement par la fenêtre,
    quel signal donne-t-il ?
  choices:
    A: Virage à droite
    B: Arrêt ou ralentissement
    C: Virage à gauche
    D: Demi-tour
  answer: C
  explanation: Le signal manuel standard pour un virage à gauche est le bras gauche
    tendu horizontalement par la fenêtre.
- id: 226
  category: signs_and_signals
  question: Que signifie un feu de circulation jaune (ambre) clignotant ?
  choices:
    A: S'arrêter et attendre que le feu passe au vert
    B: Accélérer pour dégager l'intersection
    C: Ralentir et avancer avec prudence
    D: Céder le passage à tous les piétons mais pas aux véhicules
  answer: C
  explanation: Un feu jaune clignotant est un avertissement incitant à ralentir et
    à se tenir prêt à s'arrêter, tout en traversant l'intersection avec prudence.
- id: 227
  category: signs_and_signals
  question: À l'approche d'un autobus scolaire dont les feux rouges clignotent et
    dont le bras d'arrêt est déployé, à quelle distance devez-vous vous arrêter à
    Terre-Neuve-et-Labrador ?
  choices:
    A: 3 mètres
    B: 6 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Les conducteurs doivent s'arrêter à au moins 6 mètres de l'avant ou
    de l'arrière d'un autobus scolaire lorsque ses feux rouges clignotent.
- id: 228
  category: signs_and_signals
  question: À Terre-Neuve-et-Labrador, de quelle couleur sont les panneaux utilisés
    pour indiquer des travaux de construction ou d'entretien à venir ?
  choices:
    A: Jaune
    B: Rouge
    C: Orange
    D: Vert
  answer: C
  explanation: Les panneaux de signalisation temporaire, comme ceux pour la construction
    ou l'entretien des routes, ont un fond orange avec des symboles ou du texte noirs.
- id: 229
  category: signs_and_signals
  question: 'Une ligne blanche continue sur le côté droit de la route (la ligne de
    rive) indique :'
  choices:
    A: La limite de la partie carrossable de la chaussée
    B: Une voie réservée aux vélos uniquement
    C: Que vous pouvez vous stationner sur l'accotement
    D: Un passage pour piétons
  answer: A
  explanation: Les lignes blanches continues sur le bord droit de la route guident
    les conducteurs et indiquent où se termine la chaussée et où commence l'accotement.
- id: 230
  category: signs_and_signals
  question: Que indique un panneau en forme de « X » (croix de Saint-André) ?
  choices:
    A: Une intersection à quatre voies
    B: Un hôpital à proximité
    C: Un passage à niveau
    D: Un passage pour piétons
  answer: C
  explanation: Le panneau en forme de croix est un panneau de prescription utilisé
    pour identifier l'emplacement d'un passage à niveau.
- id: 231
  category: signs_and_signals
  question: Si les clignotants de votre véhicule ne fonctionnent pas, comment devez-vous
    signaler un virage à droite à l'aide de signaux manuels ?
  choices:
    A: Bras gauche tendu horizontalement
    B: Bras gauche tendu vers le haut
    C: Bras gauche tendu vers le bas
    D: Bras droit tendu horizontalement
  answer: B
  explanation: Pour signaler un virage à droite, le conducteur doit sortir son bras
    gauche par la fenêtre et le plier vers le haut au niveau du coude.
- id: 232
  category: signs_and_signals
  question: Quelle est la signification d'une flèche verte affichée avec un feu rouge
    ?
  choices:
    A: Vous devez vous arrêter et attendre que le feu rouge devienne vert
    B: Vous pouvez avancer avec prudence dans la direction de la flèche
    C: La flèche est un avertissement que le feu est sur le point de passer au rouge
    D: Seuls les véhicules d'urgence peuvent circuler
  answer: B
  explanation: Une flèche verte avec un feu rouge signifie que vous pouvez tourner
    dans la direction de la flèche, en cédant le passage aux piétons et aux autres
    véhicules déjà engagés dans l'intersection.
- id: 233
  category: signs_and_signals
  question: 'Un panneau avec un fond blanc, un cercle noir et une barre diagonale
    rouge traversant un symbole signifie :'
  choices:
    A: L'action illustrée est recommandée
    B: L'action illustrée est interdite
    C: Un danger se trouve devant
    D: Fin d'une zone réglementée
  answer: B
  explanation: Dans le système de signalisation canadien utilisé à Terre-Neuve-et-Labrador
    (NL), un cercle rouge avec une barre diagonale indique que l'action spécifique
    (comme un virage ou une entrée) est interdite.
- id: 234
  category: signs_and_signals
  question: Que signifie une ligne blanche discontinue (pointillée) sur une autoroute
    à plusieurs voies ?
  choices:
    A: Elle sépare la circulation circulant dans des directions opposées
    B: Elle indique le bord de la route
    C: Elle sépare les voies de circulation circulant dans la même direction
    D: Elle indique une zone de stationnement interdit
  answer: C
  explanation: Les lignes blanches discontinues sont utilisées pour séparer les voies
    de circulation circulant dans la même direction, indiquant que les changements
    de voie sont autorisés lorsque cela est sécuritaire.
- id: 235
  category: signs_and_signals
  question: 'Lorsque vous voyez un véhicule d''urgence arrêté sur l''autoroute avec
    ses feux rouges ou bleus clignotants, la loi de Terre-Neuve-et-Labrador vous oblige
    à :'
  choices:
    A: Maintenir votre vitesse et rester dans votre voie
    B: Vous arrêter immédiatement sur la chaussée
    C: Ralentir et, si c'est sécuritaire, vous déplacer dans une voie non adjacente
    D: Accélérer pour dépasser le véhicule rapidement
  answer: C
  explanation: La loi « Move Over » (se tasser) de Terre-Neuve-et-Labrador exige que
    les conducteurs ralentissent et se déplacent vers une voie libre (si elle existe
    et si c'est sécuritaire) lorsqu'ils dépassent des véhicules d'urgence dont les
    feux clignotent.
