questions:
- id: 1
  category: license_system
  question: À Terre-Neuve-et-Labrador, quel est l'âge minimum requis pour demander
    un permis de conduire de classe 5, niveau I (apprenti) ?
  choices:
    A: 15 ans
    B: 16 ans
    C: 17 ans
    D: 18 ans
  answer: B
  explanation: Selon le Guide de l'usager de la route de T.-N.-L., une personne doit
    être âgée d'au moins 16 ans pour demander un permis de conduire de classe 5, niveau
    I.
- id: 2
  category: license_system
  question: Un conducteur de classe 5, niveau I (apprenti) doit être accompagné d'un
    conducteur titulaire d'un permis de conduire valide depuis au moins combien d'années
    ?
  choices:
    A: 1 an
    B: 2 ans
    C: 4 ans
    D: 5 ans
  answer: C
  explanation: Le conducteur accompagnateur d'un conducteur de classe 5, niveau I
    doit être titulaire d'un permis de conduire valide depuis un minimum de 4 ans.
- id: 3
  category: license_system
  question: Quel est le taux d'alcoolémie (BAC) requis pour tous les conducteurs du
    programme de permis de conduire progressif (GDL) à Terre-Neuve-et-Labrador ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Dans le cadre du programme GDL de T.-N.-L., les conducteurs de niveau
    I et de niveau II doivent maintenir un taux d'alcoolémie (BAC) de 0,00 % en tout
    temps lorsqu'ils conduisent.
- id: 4
  category: license_system
  question: Entre quelles heures est-il interdit à un conducteur de classe 5, niveau
    I (apprenti) de conduire un véhicule à moteur ?
  choices:
    A: 22 h 00 à 6 h 00
    B: 23 h 00 à 7 h 00
    C: Minuit à 5 h 00
    D: Minuit à 6 h 00
  answer: C
  explanation: Les conducteurs de classe 5, niveau I ont l'interdiction de conduire
    entre minuit et 5 h 00 du matin.
- id: 5
  category: license_system
  question: Pendant combien de temps un conducteur doit-il rester à l'étape de la
    classe 5, niveau I (apprenti) s'il n'a PAS suivi un cours de conduite reconnu
    ?
  choices:
    A: 6 mois
    B: 8 mois
    C: 12 mois
    D: 24 mois
  answer: C
  explanation: La durée standard de l'étape de niveau I est de 12 mois, ce qui peut
    être réduit à 8 mois après avoir réussi un cours de conduite reconnu.
- id: 6
  category: license_system
  question: À Terre-Neuve-et-Labrador, où doit être affiché le panneau « Novice Driver
    » (conducteur novice) pour les conducteurs de niveau I et de niveau II ?
  choices:
    A: Sur le pare-brise avant
    B: Sur le pare-chocs arrière
    C: Dans la lunette arrière
    D: Sur la portière du conducteur
  answer: C
  explanation: Les conducteurs du programme GDL sont tenus d'afficher un panneau «
    Novice Driver » dans la lunette arrière du véhicule qu'ils conduisent.
- id: 7
  category: license_system
  question: Un conducteur de classe 5, niveau II (novice) doit rester à cette étape
    pendant au moins combien de mois avant d'obtenir un permis de conduire complet
    ?
  choices:
    A: 6 mois
    B: 12 mois
    C: 18 mois
    D: 24 mois
  answer: B
  explanation: L'étape de niveau II (novice) du programme de permis de conduire progressif
    dure au minimum 12 mois.
- id: 8
  category: license_system
  question: Selon le système de points de T.-N.-L., combien de points d'inaptitude
    entraînent une suspension automatique du permis de conduire pour un conducteur
    titulaire d'un permis complet ?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Un permis de conduire sera suspendu lorsque 12 points d'inaptitude
    ou plus ont été accumulés sur une période de 24 mois.
- id: 9
  category: license_system
  question: Si vous changez de nom ou d'adresse, vous devez en informer la Division
    de l'immatriculation des véhicules (Motor Registration Division) dans un délai
    de combien de jours ?
  choices:
    A: 7 jours
    B: 10 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: La loi de T.-N.-L. exige que les conducteurs informent la Division
    de l'immatriculation des véhicules de tout changement de nom ou d'adresse dans
    les 10 jours.
- id: 10
  category: license_system
  question: Quelle classe de permis est requise pour conduire une motocyclette à Terre-Neuve-et-Labrador
    ?
  choices:
    A: Classe 4
    B: Classe 5
    C: Classe 6
    D: Classe 8
  answer: C
  explanation: Un permis de classe 6 est spécifiquement désigné pour la conduite de
    motocyclettes.
- id: 11
  category: license_system
  question: Quel est le nombre maximum de passagers qu'un conducteur de classe 5,
    niveau I (Apprenti) est autorisé à transporter ?
  choices:
    A: Seulement le conducteur titulaire d'un permis qui l'accompagne
    B: Le conducteur accompagnateur plus deux membres de la famille
    C: Autant qu'il y a de ceintures de sécurité
    D: Aucun passager n'est autorisé
  answer: A
  explanation: Un conducteur de niveau I n'est autorisé à avoir que le conducteur
    titulaire d'un permis qui l'accompagne sur le siège avant. Aucun autre passager
    n'est autorisé dans le véhicule.
- id: 12
  category: license_system
  question: Pour un conducteur de classe 5, niveau II (Novice), quelle est la restriction
    concernant la conduite entre minuit et 5 h 00 ?
  choices:
    A: Il leur est strictement interdit de conduire pendant ces heures
    B: Ils ne peuvent conduire seuls que pour des raisons professionnelles
    C: Ils doivent être accompagnés d'un conducteur titulaire d'un permis ayant au
      moins 4 ans d'expérience, sauf pour des raisons professionnelles
    D: Il n'y a aucune restriction pour les conducteurs de niveau II
  answer: C
  explanation: Les conducteurs de niveau II ne peuvent conduire entre minuit et 5
    h 00 que s'ils sont accompagnés d'un conducteur titulaire d'un permis ayant au
    moins 4 ans d'expérience, à moins qu'ils ne conduisent à des fins professionnelles
    (une preuve d'emploi peut être exigée).
- id: 13
  category: license_system
  question: À Terre-Neuve-et-Labrador, à quel âge un conducteur est-il tenu de fournir
    un rapport médical pour renouveler son permis pour la première fois ?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: Les conducteurs de Terre-Neuve-et-Labrador doivent déposer un rapport
    médical à l'âge de 75 ans, puis à 80 ans, et tous les deux ans par la suite.
- id: 14
  category: license_system
  question: Indépendamment de la classe de permis ou de l'étape du programme de permis
    de conduire progressif (GDL), tout conducteur de moins de quel âge doit maintenir
    un taux d'alcoolémie (BAC) de 0,00 % ?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '22'
  answer: D
  explanation: À Terre-Neuve-et-Labrador, tous les conducteurs de moins de 22 ans
    doivent maintenir un taux d'alcoolémie (BAC) de 0,00 %, même s'ils ont terminé
    le programme de permis de conduire progressif (GDL).
- id: 15
  category: license_system
  question: Combien de points d'inaptitude sont attribués pour avoir omis d'afficher
    le panneau « Novice Driver » (conducteur novice) sur la lunette arrière ?
  choices:
    A: 0 point (amende seulement)
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Le fait de ne pas afficher le panneau « Novice Driver » comme l'exige
    le programme de permis de conduire progressif (GDL) entraîne l'attribution de
    2 points d'inaptitude.
- id: 16
  category: license_system
  question: 'À Terre-Neuve-et-Labrador, si un conducteur de classe 5, niveau I (Apprenti)
    suit un cours d''éducation routière approuvé, la période d''attente de 12 mois
    pour l''examen de conduite est réduite à :'
  choices:
    A: 6 mois
    B: 8 mois
    C: 9 mois
    D: 10 mois
  answer: B
  explanation: Selon le programme de permis de conduire progressif (GDL) de Terre-Neuve-et-Labrador,
    la durée de l'étape de niveau I est réduite de 12 mois à 8 mois si le conducteur
    réussit un cours d'éducation routière reconnu.
- id: 17
  category: license_system
  question: Selon le système de points de Terre-Neuve-et-Labrador, un conducteur participant
    au programme de permis de conduire progressif (GDL) verra son permis suspendu
    s'il accumule combien de points ?
  choices:
    A: 4 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: B
  explanation: Alors que les conducteurs titulaires d'un permis complet voient leur
    permis suspendu à 12 points, les conducteurs novices (niveau I et niveau II) à
    Terre-Neuve-et-Labrador font l'objet d'une suspension dès qu'ils accumulent 6
    points d'inaptitude.
- id: 18
  category: license_system
  question: Une personne qui s'installe à Terre-Neuve-et-Labrador en provenance d'une
    autre province et qui détient un permis de conduire valide doit l'échanger contre
    un permis de la province dans un délai de combien de jours ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 120 jours
  answer: C
  explanation: Les nouveaux résidents de Terre-Neuve-et-Labrador sont autorisés à
    conduire avec leur permis valide d'une autre province pendant une période allant
    jusqu'à 3 mois (90 jours) avant de devoir l'échanger.
- id: 19
  category: license_system
  question: Quelle classe de permis est requise à Terre-Neuve-et-Labrador pour conduire
    un taxi, une ambulance ou un autobus d'une capacité allant jusqu'à 24 passagers
    ?
  choices:
    A: Classe 3
    B: Classe 4
    C: Classe 5
    D: Classe 2
  answer: B
  explanation: Un permis de classe 4 est spécifiquement requis pour conduire des taxis,
    des ambulances et des petits autobus (jusqu'à 24 passagers) à Terre-Neuve-et-Labrador.
- id: 20
  category: license_system
  question: À Terre-Neuve-et-Labrador, un demandeur de permis de conduire qui a moins
    de quel âge doit fournir le consentement écrit d'un parent ou d'un tuteur légal
    ?
  choices:
    A: '17'
    B: '18'
    C: '19'
    D: '21'
  answer: C
  explanation: Comme l'âge de la majorité à Terre-Neuve-et-Labrador est de 19 ans,
    tout demandeur de moins de 19 ans doit faire signer la section de consentement
    de la demande par un parent ou un tuteur.
- id: 21
  category: license_system
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    pour un excès de vitesse compris entre 1 et 15 km/h au-dessus de la limite affichée
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 point
  answer: A
  explanation: Dans le système de points d'inaptitude de Terre-Neuve-et-Labrador (T.-N.-L.),
    un excès de vitesse de 1 à 15 km/h au-dessus de la limite entraîne 2 points ;
    16 à 30 km/h entraîne 3 points ; 31 à 45 km/h entraîne 4 points ; et 46 km/h ou
    plus entraîne 6 points.
- id: 22
  category: license_system
  question: Si vous échouez à un examen de conduite à Terre-Neuve-et-Labrador, quel
    est le délai minimal d'attente avant de pouvoir repasser l'examen ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 21 jours
    D: 30 jours
  answer: B
  explanation: Si un candidat échoue à l'examen de conduite, il doit attendre au moins
    14 jours avant d'être admissible à une nouvelle tentative.
- id: 23
  category: license_system
  question: Pour demander un premier permis de conduire à T.-N.-L., vous devez fournir
    au moins deux pièces d'identité. Lequel des documents suivants est considéré comme
    un document « primaire » ?
  choices:
    A: Carte d'assurance sociale
    B: Certificat de naissance
    C: Carte de crédit
    D: Carte d'identité scolaire
  answer: B
  explanation: Un certificat de naissance (original ou copie certifiée) ou un passeport
    valide est requis comme document d'identification primaire pour une demande de
    permis à T.-N.-L.
- id: 24
  category: license_system
  question: Combien de points d'inaptitude sont attribués à un conducteur pour l'utilisation
    d'un téléphone cellulaire tenu à la main ou d'un autre appareil de communication
    en conduisant ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: La distraction au volant, plus précisément l'utilisation d'un appareil
    de communication sans fil tenu à la main, entraîne une pénalité de 4 points d'inaptitude
    à Terre-Neuve-et-Labrador.
- id: 25
  category: license_system
  question: Quelle classe de permis est requise pour conduire un camion à trois essieux
    ou plus, mais pas un ensemble semi-remorque ?
  choices:
    A: Classe 1
    B: Classe 2
    C: Classe 3
    D: Classe 4
  answer: C
  explanation: Un permis de classe 3 à T.-N.-L. permet de conduire des camions à 3
    essieux ou plus, y compris toute combinaison de véhicules où le véhicule remorqué
    ne dépasse pas 4 500 kg.
- id: 26
  category: license_system
  question: Une fois qu'un conducteur a obtenu un permis complet de classe 5 à Terre-Neuve-et-Labrador,
    à quelle fréquence doit-il être renouvelé ?
  choices:
    A: Tous les 2 ans
    B: Tous les 3 ans
    C: Tous les 5 ans
    D: Tous les 10 ans
  answer: C
  explanation: À Terre-Neuve-et-Labrador, les permis de conduire sont généralement
    valides pour une période de 5 ans et expirent le jour de l'anniversaire du conducteur.
- id: 27
  category: license_system
  question: 'Pour satisfaire aux normes de vision pour un permis de classe 5 ou de
    classe 6 à T.-N.-L., l''acuité visuelle d''un candidat doit être d''au moins :'
  choices:
    A: 20/20 dans les deux yeux
    B: 20/30 dans le meilleur œil
    C: 20/40 dans au moins un œil
    D: 20/50 dans les deux yeux
  answer: C
  explanation: L'exigence visuelle minimale pour un permis de classe 5 (véhicule de
    tourisme) ou de classe 6 (moto) est de 20/40 dans au moins un œil, avec ou sans
    lentilles correctrices.
- id: 28
  category: license_system
  question: Quand êtes-vous légalement tenu de signaler un problème de santé à la
    Division de l'immatriculation des véhicules (Motor Registration Division) ?
  choices:
    A: Seulement lorsque vous atteignez l'âge de 75 ans
    B: Seulement s'il en résulte un accident
    C: Immédiatement, si vous développez un problème susceptible de nuire à votre
      capacité de conduire en toute sécurité
    D: Seulement pendant votre période de renouvellement de 5 ans
  answer: C
  explanation: Les conducteurs sont légalement tenus de signaler à la Division de
    l'immatriculation des véhicules tout problème de santé ou handicap physique susceptible
    de nuire à la conduite sécuritaire d'un véhicule à moteur dès que le problème
    survient.
- id: 29
  category: license_system
  question: Combien de points d'inaptitude sont attribués pour avoir omis de s'arrêter
    pour un autobus scolaire dont les feux rouges clignotent ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Le fait de ne pas s'arrêter pour un autobus scolaire lorsque les feux
    rouges clignotent est considéré comme une infraction grave et entraîne 6 points
    d'inaptitude à T.-N.-L.
- id: 30
  category: license_system
  question: Quel est l'âge minimal requis pour demander un permis de conduire commercial
    (classe 1, 2, 3 ou 4) à Terre-Neuve-et-Labrador ?
  choices:
    A: 17 ans
    B: 18 ans
    C: 19 ans
    D: 21 ans
  answer: B
  explanation: Pour être admissible à n'importe quelle classe de permis commercial
    (classes 1 à 4) à T.-N.-L., le candidat doit être âgé d'au moins 18 ans et détenir
    un permis de classe 5 valide.
- id: 31
  category: driver_testing
  question: Pour réussir le test de vision pour un permis de classe 5 à Terre-Neuve-et-Labrador,
    quelle est l'acuité visuelle minimale requise pour votre meilleur œil ?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Selon le Guide de l'usager de la route de Terre-Neuve-et-Labrador,
    un candidat doit avoir une acuité visuelle d'au moins 20/40 dans le meilleur œil,
    avec ou sans lentilles correctrices.
- id: 32
  category: driver_testing
  question: L'examen théorique écrit de Terre-Neuve-et-Labrador se compose de deux
    parties (Signalisation routière et Règles de la route). Quel est le score minimal
    de passage pour chaque section ?
  choices:
    A: 75 %
    B: 80 %
    C: 85 %
    D: 90 %
  answer: C
  explanation: Pour réussir l'examen théorique écrit, vous devez répondre correctement
    à au moins 17 questions sur 20 (85 %) dans chacune des deux sections.
- id: 33
  category: driver_testing
  question: Laquelle des conditions suivantes est obligatoire pour le véhicule que
    vous fournissez pour votre examen de conduite à Terre-Neuve-et-Labrador ?
  choices:
    A: Il doit avoir moins de 5 ans
    B: Il doit posséder une vignette d'inspection valide et une assurance
    C: Il doit être équipé d'un double système de freinage
    D: Il doit s'agir d'un véhicule à transmission manuelle
  answer: B
  explanation: Le véhicule utilisé pour un examen de conduite doit être dans un état
    mécanique sûr, posséder une vignette d'inspection valide et être correctement
    assuré et immatriculé.
- id: 34
  category: driver_testing
  question: À Terre-Neuve-et-Labrador, quel est le montant minimal obligatoire de
    la couverture d'assurance responsabilité civile requis pour tous les véhicules
    à moteur ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: Le Highway Traffic Act (Loi sur la circulation routière) de Terre-Neuve-et-Labrador
    exige que tous les conducteurs détiennent une assurance responsabilité civile
    d'un montant minimal de 200 000 $.
- id: 35
  category: driver_testing
  question: Combien de points d'inaptitude sont inscrits à votre dossier de conduite
    pour avoir dépassé la limite de vitesse de 1 à 15 km/h à Terre-Neuve-et-Labrador
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: À Terre-Neuve-et-Labrador, un excès de vitesse de 1 à 15 km/h au-dessus
    de la limite entraîne 2 points d'inaptitude.
- id: 36
  category: driver_testing
  question: À Terre-Neuve-et-Labrador, combien de points d'inaptitude sont attribués
    pour avoir omis de rester sur les lieux d'un accident ?
  choices:
    A: 4 points
    B: 6 points
    C: 7 points
    D: 9 points
  answer: B
  explanation: Le fait de ne pas rester sur les lieux d'un accident est une infraction
    grave à Terre-Neuve-et-Labrador et entraîne 6 points d'inaptitude.
- id: 37
  category: driver_testing
  question: Quelle est l'exigence minimale en matière de champ visuel horizontal (vision
    périphérique) pour détenir un permis de classe 5 à Terre-Neuve-et-Labrador ?
  choices:
    A: 90 degrés
    B: 100 degrés
    C: 120 degrés
    D: 150 degrés
  answer: C
  explanation: Pour être admissible à un permis de classe 5, un conducteur doit avoir
    un champ visuel horizontal d'au moins 120 degrés.
- id: 38
  category: driver_testing
  question: Si vous échouez à votre examen de conduite pour la deuxième fois, combien
    de temps devez-vous attendre avant de pouvoir réserver une troisième tentative
    ?
  choices:
    A: 7 jours
    B: 14 jours
    C: 21 jours
    D: 30 jours
  answer: B
  explanation: Alors que le premier échec nécessite une attente de 7 jours, un deuxième
    échec à Terre-Neuve-et-Labrador exige une période d'attente de 14 jours.
- id: 39
  category: driver_testing
  question: À Terre-Neuve-et-Labrador, quelle classe de permis est requise pour conduire
    un véhicule de plus de deux essieux, comme un gros camion à benne basculante,
    mais pas un semi-remorque ?
  choices:
    A: Classe 1
    B: Classe 2
    C: Classe 3
    D: Classe 4
  answer: C
  explanation: Un permis de classe 3 est requis pour conduire des camions de plus
    de deux essieux, à condition qu'ils ne remorquent pas une remorque de plus de
    4 500 kg.
- id: 40
  category: driver_testing
  question: Pendant l'examen de conduite à Terre-Neuve-et-Labrador, laquelle des actions
    suivantes entraînera un échec automatique immédiat ?
  choices:
    A: Oublier d'utiliser un clignotant une seule fois
    B: Régler ses rétroviseurs tout en conduisant
    C: Une action qui oblige l'examinateur à prendre le contrôle du véhicule pour
      éviter une collision
    D: Se garer à plus de 30 cm du trottoir
  answer: C
  explanation: Toute action dangereuse qui oblige l'examinateur à intervenir ou à
    prendre le contrôle du véhicule entraîne un échec immédiat de l'examen de conduite.
- id: 41
  category: driver_testing
  question: Combien de points d'inaptitude sont attribués à un conducteur à Terre-Neuve-et-Labrador
    pour ne pas avoir porté sa ceinture de sécurité ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Le fait de ne pas porter sa ceinture de sécurité ou de ne pas s'assurer
    qu'un passager de moins de 16 ans en porte une entraîne 2 points d'inaptitude
    à Terre-Neuve-et-Labrador.
- id: 42
  category: driver_testing
  question: Lors de l'immatriculation d'un véhicule à Terre-Neuve-et-Labrador, où
    doit être placé l'autocollant de validation ?
  choices:
    A: Sur la plaque d'immatriculation avant
    B: Sur la plaque d'immatriculation arrière
    C: En bas à gauche du pare-brise
    D: En bas à droite du pare-brise
  answer: B
  explanation: À Terre-Neuve-et-Labrador, l'autocollant de validation de l'immatriculation
    doit être placé sur la plaque d'immatriculation arrière du véhicule.
- id: 43
  category: driver_testing
  question: Quels sont les frais standard pour le rétablissement d'un permis de conduire
    qui a été suspendu en raison d'une condamnation pour alcoolémie en vertu du Code
    criminel à Terre-Neuve-et-Labrador ?
  choices:
    A: 50 $
    B: 100 $
    C: 250 $
    D: 500 $
  answer: B
  explanation: Les frais standard de rétablissement du permis à Terre-Neuve-et-Labrador
    après une suspension sont de 100 $.
- id: 44
  category: driver_testing
  question: En arrivant pour un examen de conduite à Terre-Neuve-et-Labrador, lequel
    des documents suivants doit être présenté pour le véhicule utilisé ?
  choices:
    A: Un certificat d'immatriculation et une attestation d'assurance valides
    B: Un acte de vente et un permis de conduire valide
    C: Le manuel du propriétaire d'origine du véhicule
    D: Une lettre d'autorisation du fabricant du véhicule
  answer: A
  explanation: Avant que l'examen de conduite ne puisse commencer, le candidat doit
    fournir un certificat d'immatriculation valide et une attestation d'assurance
    valide pour le véhicule.
- id: 45
  category: driver_testing
  question: Quelle est la note de passage minimale pour l'examen théorique écrit à
    Terre-Neuve-et-Labrador ?
  choices:
    A: 70 %
    B: 75 %
    C: 80 %
    D: 85 %
  answer: D
  explanation: L'examen théorique écrit comprend des questions sur la signalisation
    routière et les règles de la route ; une note de passage de 85 % est requise.
- id: 46
  category: driver_testing
  question: À Terre-Neuve-et-Labrador, quelle classe de permis est spécifiquement
    requise pour conduire un moteur de traction ou tout véhicule non classé par ailleurs
    ?
  choices:
    A: Classe 4
    B: Classe 6
    C: Classe 8
    D: Classe 3
  answer: C
  explanation: Un permis de classe 8 permet à son titulaire de conduire des moteurs
    de traction et tout autre véhicule non classé dans les autres classes de permis.
- id: 47
  category: driver_testing
  question: Après avoir atteint l'âge de 80 ans, à quelle fréquence un conducteur
    de Terre-Neuve-et-Labrador doit-il déposer un rapport médical pour conserver son
    permis ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 5 ans
    D: Uniquement si un médecin le demande
  answer: B
  explanation: À Terre-Neuve-et-Labrador, des rapports médicaux sont requis à l'âge
    de 75 ans, 80 ans, puis tous les deux ans par la suite.
- id: 48
  category: driver_testing
  question: Combien de points d'inaptitude sont attribués pour des « cascades » ou
    des « courses » sur une route à Terre-Neuve-et-Labrador ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Les infractions graves telles que les courses ou les cascades (stunting)
    entraînent la pénalité maximale de 6 points d'inaptitude.
- id: 49
  category: driver_testing
  question: Pour réussir l'examen de la vue pour un permis de conduire à Terre-Neuve-et-Labrador,
    quel est le champ de vision horizontal minimal requis ?
  choices:
    A: 80 degrés
    B: 100 degrés
    C: 120 degrés
    D: 150 degrés
  answer: B
  explanation: Les candidats doivent avoir un champ de vision horizontal d'au moins
    100 degrés pour être admissibles à un permis de conduire.
- id: 50
  category: driver_testing
  question: 'Un examen de conduite sera annulé immédiatement si le véhicule fourni
    par le candidat présente l''un des défauts suivants :'
  choices:
    A: Un extérieur sale
    B: Une radio qui ne fonctionne pas
    C: Des feux de freinage ou des clignotants défectueux
    D: Un faible niveau de carburant
  answer: C
  explanation: Le véhicule utilisé pour l'examen de conduite doit être dans un état
    mécanique sûr. Un équipement défectueux comme les feux de freinage ou les clignotants
    entraînera l'annulation immédiate de l'examen.
- id: 51
  category: driver_testing
  question: Lors de la demande d'un permis d'apprenti conducteur, que doit fournir
    un demandeur à la Division de l'immatriculation des véhicules (Motor Registration
    Division) pour prouver son identité ?
  choices:
    A: Une déclaration verbale de son nom et de son âge
    B: Une carte de bibliothèque et une facture de services publics
    C: Deux pièces d'identité, dont au moins une doit être un document primaire comme
      un certificat de naissance ou un passeport
    D: Une lettre signée par un voisin
  answer: C
  explanation: 'Les demandeurs doivent fournir deux pièces d''identité. L''une d''elles
    doit être un document primaire (ex. : certificat de naissance, passeport ou documents
    de résident permanent).'
- id: 52
  category: driver_responsibility
  question: 'À Terre-Neuve-et-Labrador, un accident de véhicule à moteur doit être
    signalé à la police si les dommages matériels totaux sont estimés à au moins :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: Selon le Code de la route de Terre-Neuve-et-Labrador (Highway Traffic
    Act), les accidents impliquant des dommages matériels de 2 000 $ ou plus doivent
    être signalés immédiatement à la police.
- id: 53
  category: driver_responsibility
  question: À Terre-Neuve-et-Labrador, quelle est l'amende minimale pour une première
    infraction de conduite sans assurance automobile valide ?
  choices:
    A: 500 $
    B: 1 000 $
    C: 2 000 $
    D: 5 000 $
  answer: C
  explanation: En vertu de la Loi sur l'assurance automobile de T.-N.-L., l'amende
    pour une première infraction de conduite sans assurance varie de 2 000 $ à 4 000
    $.
- id: 54
  category: driver_responsibility
  question: Lorsqu'un véhicule est vendu à Terre-Neuve-et-Labrador, dans quel délai
    le vendeur doit-il informer la Division de l'immatriculation des véhicules du
    transfert de propriété ?
  choices:
    A: 24 heures
    B: 5 jours
    C: 10 jours
    D: 30 jours
  answer: C
  explanation: Le vendeur d'un véhicule à moteur est tenu par le Code de la route
    d'informer la Division de l'immatriculation des véhicules dans les 10 jours suivant
    la vente.
- id: 55
  category: driver_responsibility
  question: Lequel des documents suivants un conducteur doit-il être en mesure de
    présenter à la demande d'un agent de la paix à Terre-Neuve-et-Labrador ?
  choices:
    A: Un permis de conduire valide uniquement
    B: Un permis de conduire valide et l'immatriculation du véhicule uniquement
    C: Un permis de conduire valide, l'immatriculation du véhicule et une preuve d'assurance
    D: Un permis de conduire valide et l'acte de vente original du véhicule
  answer: C
  explanation: Les conducteurs doivent avoir sur eux et être en mesure de présenter
    leur permis de conduire, le certificat d'immatriculation du véhicule et une carte
    rose valide (preuve d'assurance).
- id: 56
  category: driver_responsibility
  question: 'Si un conducteur est surpris en train de conduire un véhicule sans assurance
    valide à T.-N.-L., la police a le pouvoir de mettre le véhicule en fourrière pour
    une période minimale de :'
  choices:
    A: 24 heures
    B: 48 heures
    C: 72 heures
    D: 7 jours
  answer: C
  explanation: À Terre-Neuve-et-Labrador, si un conducteur ne peut pas présenter de
    preuve d'assurance, le véhicule peut être mis en fourrière pour un minimum de
    72 heures.
- id: 57
  category: driver_responsibility
  question: À Terre-Neuve-et-Labrador, le conducteur d'un véhicule est responsable
    de s'assurer que tous les passagers de moins de quel âge sont correctement attachés
    ?
  choices:
    A: 12 ans
    B: 16 ans
    C: 18 ans
    D: 19 ans
  answer: B
  explanation: Le conducteur est légalement responsable de s'assurer que tout passager
    de moins de 16 ans est correctement attaché par une ceinture de sécurité ou un
    dispositif de retenue pour enfants approprié.
- id: 58
  category: driver_responsibility
  question: 'Si vous êtes impliqué dans un accident de véhicule à moteur entraînant
    des blessures ou un décès, vous devez signaler l''accident à la police :'
  choices:
    A: Immédiatement
    B: Dans les 24 heures
    C: Dans les 48 heures
    D: Uniquement si les dommages matériels dépassent 2 000 $
  answer: A
  explanation: Le Code de la route exige que tout accident impliquant des blessures
    ou un décès soit signalé immédiatement à l'agent de police le plus proche.
- id: 59
  category: driver_responsibility
  question: Si vous entrez en collision avec un véhicule sans surveillance et que
    vous ne parvenez pas à localiser le propriétaire, quelle est votre responsabilité
    légale à T.-N.-L. ?
  choices:
    A: Attendre sur les lieux pendant au moins une heure
    B: Laisser une note avec votre nom, votre adresse et votre numéro de plaque d'immatriculation
    C: Rien, si les dommages semblent être inférieurs à 2 000 $
    D: Le signaler uniquement à votre compagnie d'assurance
  answer: B
  explanation: Si vous heurtez un véhicule sans surveillance, vous devez soit localiser
    le propriétaire, soit laisser un avis écrit dans un endroit bien en vue sur le
    véhicule avec vos coordonnées.
- id: 60
  category: driver_responsibility
  question: Où le certificat d'immatriculation d'un véhicule à moteur doit-il être
    conservé à Terre-Neuve-et-Labrador ?
  choices:
    A: Au domicile du conducteur pour plus de sécurité
    B: Dans le véhicule en tout temps
    C: À la Division de l'immatriculation des véhicules
    D: Auprès de la compagnie d'assurance
  answer: B
  explanation: Le certificat d'immatriculation d'un véhicule doit être transporté
    dans le véhicule auquel il se rapporte afin de pouvoir être présenté sur demande
    à un agent de la paix.
- id: 61
  category: driver_responsibility
  question: 'Fournir de fausses informations à la Division de l''immatriculation des
    véhicules (Motor Registration Division) lors d''une demande de permis ou d''immatriculation
    peut entraîner une amende allant jusqu''à :'
  choices:
    A: 100 $
    B: 250 $
    C: 500 $
    D: 1 000 $
  answer: D
  explanation: En vertu de l'article 14 du Code de la route (Highway Traffic Act),
    le fait de fournir de fausses informations peut entraîner une amende allant jusqu'à
    1 000 $, une peine d'emprisonnement ou la suspension du permis.
- id: 62
  category: driver_responsibility
  question: Si un conducteur non assuré est impliqué dans un accident et qu'un jugement
    est rendu contre lui, qu'advient-il de ses privilèges de conduite à T.-N.-L. ?
  choices:
    A: Il dispose de 90 jours pour payer avant la suspension
    B: Son permis et son immatriculation sont suspendus jusqu'à ce que le jugement
      soit payé
    C: Il peut continuer à conduire mais ne peut pas acheter de nouvelle voiture
    D: Il doit payer une amende de 100 $ pour conserver son permis
  answer: B
  explanation: À T.-N.-L., si un conducteur non assuré ne satisfait pas à un jugement
    résultant d'un accident, son permis et son immatriculation sont suspendus jusqu'à
    ce que le jugement soit payé ou qu'un plan de paiement soit approuvé.
- id: 63
  category: driver_responsibility
  question: 'Si vous changez le moteur ou la carrosserie de votre véhicule à moteur
    immatriculé, vous devez en informer la Division de l''immatriculation des véhicules
    dans un délai de :'
  choices:
    A: 24 heures
    B: 10 jours
    C: 30 jours
    D: Au moment de votre prochain renouvellement
  answer: B
  explanation: Tout changement important apporté à la description du véhicule, tel
    qu'un changement de moteur ou de carrosserie, doit être signalé à la Division
    de l'immatriculation des véhicules (MRD) dans les 10 jours.
- id: 64
  category: driver_responsibility
  question: Lorsque vous vendez un véhicule à moteur à une autre personne, vous devez
    en informer la Division de l'immatriculation des véhicules dans les combien de
    jours suivant la vente ?
  choices:
    A: 24 heures
    B: 5 jours
    C: 10 jours
    D: 30 jours
  answer: C
  explanation: Le vendeur d'un véhicule est tenu d'en informer la Division de l'immatriculation
    des véhicules dans les 10 jours suivant la date de la vente ou du transfert.
- id: 65
  category: driver_responsibility
  question: 'Lors de l''achat d''un véhicule auprès d''un particulier, l''acheteur
    doit enregistrer le transfert de propriété auprès de la Division de l''immatriculation
    des véhicules dans un délai de :'
  choices:
    A: 10 jours
    B: 15 jours
    C: 20 jours
    D: 30 jours
  answer: A
  explanation: À T.-N.-L., l'acheteur d'un véhicule doit enregistrer le transfert
    de propriété dans les 10 jours suivant la date d'achat.
- id: 66
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident où une personne est blessée, quelle
    est votre première responsabilité légale ?
  choices:
    A: Appeler votre compagnie d'assurance
    B: Prendre des photos des dommages
    C: Prêter toute l'assistance nécessaire et appeler les secours médicaux
    D: Déplacer immédiatement votre véhicule sur le côté de la route
  answer: C
  explanation: En vertu du Code de la route (Highway Traffic Act), les conducteurs
    impliqués dans un accident doivent rester sur les lieux et prêter toute l'assistance
    raisonnable à toute personne blessée.
- id: 67
  category: driver_responsibility
  question: Lorsqu'un véhicule d'occasion est vendu par un particulier à T.-N.-L.,
    quel document doit être fourni à l'acheteur pour compléter le transfert d'immatriculation
    ?
  choices:
    A: Une garantie du fabricant
    B: Un certificat d'inspection de véhicule à moteur (MVI) valide
    C: Une lettre de la compagnie d'assurance précédente
    D: L'acte de naissance original du conducteur
  answer: B
  explanation: Un certificat d'inspection de véhicule à moteur (MVI) valide, délivré
    au cours des 30 derniers jours, est requis pour transférer la propriété d'un véhicule
    d'occasion à T.-N.-L.
- id: 68
  category: driver_responsibility
  question: Si un agent de la paix le demande, lequel des documents suivants un conducteur
    doit-il présenter ?
  choices:
    A: Permis de conduire, immatriculation du véhicule et preuve d'assurance
    B: Permis de conduire et acte de naissance
    C: Immatriculation du véhicule et copie du contrat de vente
    D: Preuve d'assurance et certificat médical
  answer: A
  explanation: Les conducteurs doivent avoir sur eux et être en mesure de présenter
    leur permis de conduire valide, l'immatriculation du véhicule et une preuve d'assurance
    valide (carte rose) à la demande d'un agent de la paix.
- id: 69
  category: driver_responsibility
  question: À T.-N.-L., si le taux d'alcoolémie (BAC) d'un conducteur se situe entre
    0,05 et 0,08, son permis sera suspendu immédiatement pour combien de temps lors
    d'une première infraction ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: Dans le cadre du programme de suspension administrative de permis,
    un premier taux d'alcoolémie (BAC) compris entre 0,05 et 0,08 entraîne une suspension
    immédiate du permis de 7 jours.
- id: 70
  category: driver_responsibility
  question: Qu'arrive-t-il à un véhicule si le conducteur est pris en train de le
    conduire alors que son permis est suspendu ?
  choices:
    A: Le véhicule est mis en fourrière pendant 30 jours
    B: Le véhicule est vendu aux enchères
    C: Le véhicule est broyé
    D: L'immatriculation du véhicule est définitivement annulée
  answer: A
  explanation: À Terre-Neuve-et-Labrador, si vous êtes pris à conduire alors que votre
    permis est suspendu, le véhicule que vous conduisez sera mis en fourrière pendant
    30 jours, quel qu'en soit le propriétaire.
- id: 71
  category: driver_responsibility
  question: 'Lorsque vous approchez d''un véhicule d''urgence arrêté avec ses feux
    rouges ou bleus clignotants sur une autoroute comportant deux voies ou plus dans
    votre direction, vous devez :'
  choices:
    A: S'arrêter et attendre que l'agent vous fasse signe de passer
    B: Maintenir votre vitesse mais klaxonner
    C: Ralentir et vous déplacer vers la voie non adjacente s'il est sécuritaire de
      le faire
    D: Accélérer pour dépasser le véhicule rapidement
  answer: C
  explanation: La loi sur le corridor de sécurité à Terre-Neuve-et-Labrador exige
    que les conducteurs ralentissent et, si cela est sécuritaire, se déplacent vers
    la voie qui n'est pas adjacente au véhicule d'urgence.
- id: 72
  category: driver_responsibility
  question: Combien de points d'inaptitude sont inscrits à votre dossier de conduite
    pour « omission de rester sur les lieux d'un accident » ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: Le fait de ne pas rester sur les lieux d'un accident est une infraction
    grave qui entraîne l'ajout de 6 points d'inaptitude à votre dossier de conduite
    à Terre-Neuve-et-Labrador.
- id: 73
  category: driver_responsibility
  question: 'Si vous êtes impliqué dans un accident avec un véhicule sans surveillance
    (par exemple, dans un parking), vous devez :'
  choices:
    A: Quitter les lieux immédiatement si personne ne vous a vu
    B: Attendre 10 minutes puis partir
    C: Localiser le propriétaire ou laisser un avis écrit avec votre nom, votre adresse
      et votre numéro de permis
    D: Ne le signaler que si les dommages semblent dépasser 5 000 $
  answer: C
  explanation: Si le propriétaire d'un véhicule ou d'un bien endommagé ne peut être
    localisé, la loi vous oblige à laisser un avis écrit contenant vos coordonnées
    et les informations relatives à votre véhicule.
- id: 74
  category: driver_responsibility
  question: 'À Terre-Neuve-et-Labrador, si un conducteur est reconnu coupable d''une
    infraction au Code criminel liée à la conduite (telle que la conduite avec facultés
    affaiblies), l''interdiction de conduire minimale ordonnée par le tribunal pour
    une première infraction est de :'
  choices:
    A: 3 mois
    B: 6 mois
    C: 12 mois
    D: 24 mois
  answer: C
  explanation: Une première condamnation au Code criminel pour conduite avec facultés
    affaiblies entraîne une interdiction de conduire fédérale minimale de 12 mois,
    qui est purgée simultanément aux suspensions provinciales.
- id: 75
  category: safe_driving_rules
  question: À Terre-Neuve-et-Labrador, quelle est la limite de vitesse par défaut
    dans une municipalité, sauf indication contraire ?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: Selon le Highway Traffic Act de Terre-Neuve-et-Labrador, la limite
    de vitesse à l'intérieur d'une municipalité est de 50 km/h, à moins que des panneaux
    n'indiquent le contraire.
- id: 76
  category: safe_driving_rules
  question: À Terre-Neuve-et-Labrador, il est interdit de se stationner à quelle distance
    d'une borne d'incendie ?
  choices:
    A: 1 mètre
    B: 3 mètres
    C: 5 mètres
    D: 10 mètres
  answer: A
  explanation: Le Highway Traffic Act de Terre-Neuve-et-Labrador précise qu'une personne
    ne doit pas arrêter, immobiliser ou stationner un véhicule à moins d'un mètre
    d'une borne d'incendie.
- id: 77
  category: safe_driving_rules
  question: Lorsque vous vous stationnez près d'un panneau d'arrêt ou d'un feu de
    circulation, quelle est la distance minimale que vous devez respecter ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: B
  explanation: En vertu de la loi de Terre-Neuve-et-Labrador, vous ne devez pas stationner
    un véhicule à moins de 10 mètres du côté de l'approche d'un panneau d'arrêt ou
    d'un feu de circulation.
- id: 78
  category: safe_driving_rules
  question: Quelle est la distance minimale à laquelle vous devez vous stationner
    par rapport au côté de l'approche d'un passage pour piétons ?
  choices:
    A: 3 mètres
    B: 6 mètres
    C: 9 mètres
    D: 12 mètres
  answer: B
  explanation: À Terre-Neuve-et-Labrador, le stationnement est interdit à moins de
    6 mètres du côté de l'approche d'un passage pour piétons.
- id: 79
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse dans une zone
    scolaire à Terre-Neuve-et-Labrador entre 8 h 00 et 17 h 00 les jours d'école ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: La limite de vitesse standard dans les zones scolaires à Terre-Neuve-et-Labrador
    est de 30 km/h pendant les heures de classe (de 8 h 00 à 17 h 00) lorsque l'école
    est en session.
- id: 80
  category: safe_driving_rules
  question: Combien de points d'inaptitude sont inscrits à votre dossier de conduite
    pour l'utilisation d'un appareil cellulaire tenu à la main tout en conduisant
    à Terre-Neuve-et-Labrador ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: L'utilisation d'un appareil de communication sans fil tenu à la main
    en conduisant à Terre-Neuve-et-Labrador entraîne l'inscription de 4 points d'inaptitude.
- id: 81
  category: safe_driving_rules
  question: Lorsque vous conduisez de nuit, à quelle distance d'un véhicule venant
    en sens inverse devez-vous passer des feux de route aux feux de croisement ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Les conducteurs de Terre-Neuve-et-Labrador doivent passer aux feux
    de croisement lorsqu'un véhicule venant en sens inverse se trouve à moins de 150
    mètres pour éviter d'éblouir l'autre conducteur.
- id: 82
  category: safe_driving_rules
  question: À Terre-Neuve-et-Labrador, la « conduite acrobatique » (stunting) inclut
    le fait de conduire à une vitesse qui dépasse la limite de vitesse de combien
    ?
  choices:
    A: 30 km/h ou plus
    B: 40 km/h ou plus
    C: 50 km/h ou plus
    D: 60 km/h ou plus
  answer: C
  explanation: Conduire à 50 km/h ou plus au-dessus de la limite de vitesse est classé
    comme une conduite acrobatique à T.-N.-L., ce qui entraîne de lourdes sanctions,
    y compris la mise en fourrière immédiate du véhicule.
- id: 83
  category: safe_driving_rules
  question: 'Un demi-tour est interdit à Terre-Neuve-et-Labrador si vous n''avez pas
    une vue dégagée de la circulation dans les deux sens sur au moins :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 250 mètres
  answer: B
  explanation: Le Code de la route interdit les demi-tours dans les virages ou près
    du sommet d'une colline où le conducteur n'a pas une vue dégagée d'au moins 150
    mètres dans chaque direction.
- id: 84
  category: safe_driving_rules
  question: Lorsqu'un véhicule d'urgence dont la sirène ou les gyrophares fonctionnent
    s'approche, que doit faire le conducteur ?
  choices:
    A: Accélérer pour libérer le passage
    B: S'arrêter immédiatement au milieu de la voie
    C: Se ranger vers la droite aussi loin que possible et s'arrêter
    D: Allumer les feux de détresse et maintenir sa vitesse
  answer: C
  explanation: Les conducteurs doivent céder le passage et se diriger immédiatement
    vers une position parallèle et aussi près que possible de la bordure ou du bord
    droit de la chaussée et s'arrêter.
- id: 85
  category: safe_driving_rules
  question: Si vous êtes impliqué dans une collision où les dommages matériels totaux
    s'élèvent à 2 000 $ ou plus, que devez-vous faire ?
  choices:
    A: Le signaler immédiatement à la police
    B: Attendre 24 heures avant de le signaler à la police
    C: Le signaler uniquement à votre compagnie d'assurance
    D: Échanger les informations et partir si personne n'est blessé
  answer: A
  explanation: À T.-N.-L., tout accident impliquant des blessures, un décès ou des
    dommages matériels dépassant apparemment 2 000 $ doit être signalé immédiatement
    à la police.
- id: 86
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse maximale sur
    les routes rurales à Terre-Neuve-et-Labrador ?
  choices:
    A: 80 km/h
    B: 90 km/h
    C: 100 km/h
    D: 110 km/h
  answer: A
  explanation: Dans les zones rurales de Terre-Neuve-et-Labrador, la limite de vitesse
    par défaut est de 80 km/h, sauf indication contraire.
- id: 87
  category: safe_driving_rules
  question: Lorsque vous traversez une zone scolaire à Terre-Neuve-et-Labrador, quelle
    est la limite de vitesse lorsque des enfants sont présents ou pendant les heures
    de classe ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: La limite de vitesse dans les zones scolaires à T.-N.-L. est de 30
    km/h entre 8 h 00 et 17 h 00 les jours où l'école est en session, ou selon l'affichage.
- id: 88
  category: safe_driving_rules
  question: Vous ne devez pas stationner votre véhicule à moins de combien de mètres
    d'un panneau d'arrêt ou d'un signal de circulation ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 6 mètres
    D: 10 mètres
  answer: C
  explanation: À Terre-Neuve-et-Labrador, le stationnement est interdit à moins de
    6 mètres d'un panneau d'arrêt, d'un panneau de cédez le passage ou d'un signal
    de circulation.
- id: 89
  category: safe_driving_rules
  question: En approchant d'un carrefour giratoire à Terre-Neuve-et-Labrador, à qui
    devez-vous céder le passage ?
  choices:
    A: Céder le passage à la circulation entrant par la droite
    B: Céder le passage à la circulation déjà engagée dans le carrefour arrivant par
      votre gauche
    C: Céder le passage à la circulation derrière vous
    D: Vous avez la priorité au moment d'entrer
  answer: B
  explanation: Les conducteurs entrant dans un carrefour giratoire doivent céder le
    passage à la circulation déjà engagée dans le carrefour, qui arrivera par la gauche.
- id: 90
  category: safe_driving_rules
  question: En vertu de la loi « Move Over » (se tasser) de T.-N.-L., que devez-vous
    faire en approchant d'un véhicule d'urgence arrêté dont les gyrophares bleus ou
    rouges clignotent ?
  choices:
    A: Maintenir sa vitesse mais klaxonner
    B: S'arrêter immédiatement au milieu de la route
    C: Ralentir et, si cela peut être fait en toute sécurité, changer de voie pour
      une voie non adjacente
    D: Accélérer pour dépasser le véhicule rapidement
  answer: C
  explanation: La loi exige que les conducteurs ralentissent et changent de voie (si
    cela est sécuritaire) lorsqu'ils dépassent des véhicules d'urgence ou des dépanneuses
    arrêtés sur le bord de la route avec leurs gyrophares allumés.
- id: 91
  category: safe_driving_rules
  question: À Terre-Neuve-et-Labrador, quand êtes-vous autorisé à utiliser des pneus
    à clous ?
  choices:
    A: Toute l'année
    B: Du 1er octobre au 30 avril
    C: Du 1er novembre au 31 mai
    D: Du 1er décembre au 31 mars
  answer: C
  explanation: Les pneus à clous sont autorisés à Terre-Neuve-et-Labrador du 1er novembre
    au 31 mai de chaque année.
- id: 92
  category: safe_driving_rules
  question: Lorsque deux véhicules arrivent à une intersection sans panneau d'arrêt
    ni signalisation à peu près en même temps, qui a la priorité ?
  choices:
    A: Le véhicule à gauche
    B: Le véhicule à droite
    C: Le véhicule circulant à une vitesse plus élevée
    D: Le véhicule le plus gros
  answer: B
  explanation: À une intersection non contrôlée, le conducteur à gauche doit céder
    le passage au conducteur à droite.
- id: 93
  category: safe_driving_rules
  question: Quelle est la sanction pour une première condamnation pour utilisation
    d'un téléphone cellulaire tenu à la main au volant à Terre-Neuve-et-Labrador ?
  choices:
    A: Une amende et 1 point d'inaptitude
    B: Une amende et 4 points d'inaptitude
    C: Une amende et 0 point d'inaptitude
    D: Un avertissement seulement
  answer: B
  explanation: La conduite distraite (utilisation d'un appareil tenu à la main) à
    Terre-Neuve-et-Labrador entraîne une amende importante et 4 points d'inaptitude
    lors de la condamnation.
- id: 94
  category: safe_driving_rules
  question: À Terre-Neuve-et-Labrador, à quelle distance devez-vous suivre un véhicule
    d'urgence dont les sirènes ou les gyrophares sont activés ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: Le Code de la route (Highway Traffic Act) précise que les conducteurs
    ne doivent pas suivre un véhicule d'urgence à une distance inférieure à 150 mètres.
- id: 95
  category: safe_driving_rules
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    et son signal visuel en marche, que doit faire un conducteur ?
  choices:
    A: S'arrêter uniquement s'il se trouve derrière l'autobus
    B: S'arrêter dans les deux sens, sauf si les voies sont séparées par un terre-plein
      central
    C: Ralentir à 10 km/h et dépasser prudemment
    D: Klaxonner et avancer avec prudence
  answer: B
  explanation: Les conducteurs s'approchant par l'avant ou par l'arrière doivent s'arrêter
    pour un autobus scolaire dont les feux rouges clignotent, sauf si la route est
    divisée par un terre-plein central.
- id: 96
  category: safe_driving_rules
  question: Quelle est la règle concernant le « virage à droite au feu rouge » à Terre-Neuve-et-Labrador
    ?
  choices:
    A: Ce n'est jamais autorisé
    B: C'est autorisé uniquement si une flèche verte est présente
    C: C'est autorisé après un arrêt complet et après avoir cédé le passage aux piétons
      et à la circulation, à moins qu'un panneau ne l'interdise
    D: C'est autorisé sans s'arrêter tant qu'il n'y a pas de circulation
  answer: C
  explanation: À Terre-Neuve-et-Labrador, vous pouvez tourner à droite au feu rouge
    après avoir marqué un arrêt complet et cédé le passage aux piétons et aux autres
    véhicules, à condition qu'aucun panneau n'interdise le virage.
- id: 97
  category: safe_driving_rules
  question: Lors du stationnement d'un véhicule dans une pente descendante, comment
    les roues avant doivent-elles être positionnées ?
  choices:
    A: Tournées vers la bordure (ou le bord de la route)
    B: Tournées à l'opposé de la bordure
    C: Maintenues droites
    D: Cela n'a pas d'importance
  answer: A
  explanation: Lors d'un stationnement en descente, vous devez tourner vos roues vers
    la bordure de sorte que si le véhicule roule, il se dirigera hors de la route
    ou contre la bordure plutôt que vers la circulation.
- id: 98
  category: safe_driving_rules
  question: À Terre-Neuve-et-Labrador, qu'advient-il des amendes pour excès de vitesse
    dans une zone de construction désignée lorsque des travailleurs sont présents
    ?
  choices:
    A: Elles sont réduites de moitié
    B: Elles restent les mêmes que les amendes d'excès de vitesse standard
    C: Elles sont doublées
    D: Elles sont triplées
  answer: C
  explanation: En vertu du Code de la route (Highway Traffic Act) de Terre-Neuve-et-Labrador,
    les amendes pour excès de vitesse dans une zone de construction sont doublées
    lorsque des travailleurs sont présents.
- id: 99
  category: defensive_driving
  question: À Terre-Neuve-et-Labrador, quelle est la distance de suivi minimale recommandée
    derrière un autre véhicule dans des conditions de conduite idéales ?
  choices:
    A: La longueur d'une voiture
    B: Deux secondes
    C: Quatre secondes
    D: 50 mètres
  answer: B
  explanation: Le Guide du conducteur de Terre-Neuve-et-Labrador recommande la « règle
    des deux secondes » pour maintenir une distance de suivi sécuritaire dans des
    conditions météorologiques et routières idéales.
- id: 100
  category: defensive_driving
  question: En raison du risque élevé de collisions entre orignaux et véhicules à
    Terre-Neuve-et-Labrador, à quels moments les orignaux sont-ils les plus actifs
    et susceptibles de se trouver sur la route ?
  choices:
    A: En milieu de journée quand le soleil est au plus haut
    B: Entre 11 h 00 et 14 h 00
    C: Entre le coucher et le lever du soleil (crépuscule et aube)
    D: Uniquement pendant les mois d'hiver
  answer: C
  explanation: À Terre-Neuve-et-Labrador, les orignaux sont les plus actifs pendant
    les heures d'obscurité, plus précisément à l'aube et au crépuscule, moments où
    se produisent la majorité des collisions.
- id: 101
  category: defensive_driving
  question: À Terre-Neuve-et-Labrador, pendant quelle période les pneus à clous sont-ils
    légalement autorisés sur les véhicules ?
  choices:
    A: Du 1er octobre au 30 avril
    B: Du 1er novembre au 31 mai
    C: Du 1er décembre au 31 mars
    D: Du 15 novembre au 15 avril
  answer: B
  explanation: Selon les réglementations provinciales de T.-N.-L., les pneus à clous
    ne sont autorisés que du 1er novembre au 31 mai de chaque année afin de protéger
    la surface des routes pendant l'été.
- id: 102
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une route mouillée
    à T.-N.-L., quelle est la bonne réaction de conduite préventive ?
  choices:
    A: Freiner brusquement pour regagner de la traction
    B: Tourner le volant brusquement vers l'accotement
    C: Relâcher la pédale d'accélérateur et diriger le véhicule tout droit
    D: Accélérer légèrement pour fendre l'eau
  answer: C
  explanation: Pour se rétablir d'un aquaplanage, vous devez lever le pied de l'accélérateur
    et diriger le volant dans la direction où vous voulez aller. Ne freinez pas, car
    cela pourrait provoquer un dérapage.
- id: 103
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais, ce qui est courant dans
    les zones côtières de T.-N.-L., quels feux devez-vous utiliser ?
  choices:
    A: Les feux de route (pleins phares)
    B: Les feux de stationnement uniquement
    C: Les feux de croisement (codes)
    D: Les feux de détresse
  answer: C
  explanation: Les feux de croisement doivent être utilisés dans le brouillard. Les
    feux de route se reflètent sur l'humidité du brouillard, créant un effet de «
    mur blanc » qui réduit davantage la visibilité.
- id: 104
  category: defensive_driving
  question: Pour maintenir un « temps d'anticipation visuelle » adéquat en conduisant
    dans les zones urbaines de T.-N.-L., à quelle distance devant vous devez-vous
    balayer la route du regard ?
  choices:
    A: 2 à 5 secondes
    B: 12 à 15 secondes
    C: 20 à 30 secondes
    D: 500 mètres
  answer: B
  explanation: Les directives de conduite préventive à T.-N.-L. suggèrent de regarder
    de 12 à 15 secondes devant soi pour identifier les dangers potentiels avant qu'ils
    ne deviennent des problèmes immédiats.
- id: 105
  category: defensive_driving
  question: En vertu du Code de la route de T.-N.-L. (Highway Traffic Act), combien
    de points d'inaptitude sont attribués pour l'infraction « Suivre de trop près
    » ?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: À Terre-Neuve-et-Labrador, une condamnation pour avoir suivi un véhicule
    de trop près entraîne l'ajout de 2 points d'inaptitude à votre dossier de conduite.
- id: 106
  category: defensive_driving
  question: 'Lorsque vous conduisez sur une autoroute à T.-N.-L. pendant une forte
    tempête de pluie, votre distance de sécurité doit être augmentée à au moins :'
  choices:
    A: 3 secondes
    B: 4 secondes
    C: 6 secondes
    D: 10 secondes
  answer: B
  explanation: Dans des conditions défavorables comme la pluie, la neige ou le verglas,
    la règle standard des deux secondes doit être doublée pour atteindre au moins
    quatre secondes afin de tenir compte de l'augmentation des distances de freinage.
- id: 107
  category: defensive_driving
  question: Quelle est la meilleure technique de conduite préventive pour éviter une
    collision avec un orignal sur les autoroutes de T.-N.-L. la nuit ?
  choices:
    A: Conduire avec les feux de route allumés dès que possible et surveiller les
      accotements
    B: Conduire à la vitesse maximale autorisée pour traverser rapidement les zones
      à orignaux
    C: Regarder uniquement la ligne centrale pour rester dans sa voie
    D: Klaxonner continuellement dans les zones boisées
  answer: A
  explanation: L'utilisation des feux de route (lorsque c'est légal) et la surveillance
    des accotements de la route vous permettent de repérer plus tôt le reflet des
    yeux d'un orignal ou sa silhouette.
- id: 108
  category: defensive_driving
  question: Lorsque les routes sont glissantes à cause de la glace ou de la neige
    à T.-N.-L., comment devez-vous freiner si votre véhicule est équipé d'un système
    de freinage antiblocage (ABS) ?
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et continue sur la pédale de frein
    C: Utiliser uniquement le frein d'urgence
    D: Appuyer légèrement une seule fois sur les freins
  answer: B
  explanation: Avec l'ABS, vous devez appliquer une pression constante et ferme. Pomper
    les freins est une technique réservée aux anciens véhicules sans ABS et peut en
    fait désactiver l'efficacité du système ABS.
- id: 109
  category: defensive_driving
  question: À T.-N.-L., la « glace noire » est un danger hivernal fréquent. Où est-elle
    la plus susceptible de se former en premier ?
  choices:
    A: Au milieu des champs dégagés
    B: Sur les routes de gravier
    C: Sur les ponts et les viaducs
    D: Dans les garages de stationnement souterrains
  answer: C
  explanation: Les ponts et les viaducs gèlent avant le reste de la chaussée car l'air
    froid circule à la fois au-dessus et au-dessous de la surface de la route.
- id: 110
  category: defensive_driving
  question: 'Avant de changer de voie sur une autoroute à plusieurs voies comme la
    route Transcanadienne à T.-N.-L., un conducteur préventif doit :'
  choices:
    A: Signaler et changer de voie immédiatement
    B: Vérifier les rétroviseurs, signaler et effectuer une vérification de l'angle
      mort (coup d'œil par-dessus l'épaule)
    C: Ralentir considérablement avant de tourner le volant
    D: Attendre qu'un autre conducteur fasse un appel de phares
  answer: B
  explanation: La séquence appropriée pour un changement de voie sécuritaire consiste
    à vérifier les rétroviseurs, à signaler votre intention et à effectuer une vérification
    de l'angle mort pour s'assurer que l'espace est libre.
- id: 111
  category: defensive_driving
  question: La distance totale d'arrêt est composée de quels trois facteurs ?
  choices:
    A: La vitesse, le poids et la pression des pneus
    B: La visibilité, la surface de la route et la météo
    C: La distance de perception, la distance de réaction et la distance de freinage
    D: La distance de freinage, la longueur de la voiture et la distance de sécurité
  answer: C
  explanation: La distance totale d'arrêt est la somme de la distance parcourue pendant
    que vous percevez un danger (perception), la distance parcourue pendant que vous
    déplacez votre pied vers le frein (réaction) et la distance parcourue une fois
    les freins actionnés (freinage).
- id: 112
  category: defensive_driving
  question: Pour maintenir une bonne conscience de la situation en conduisant à T.-N.-L.,
    à quelle distance devant vous devriez-vous balayer la route pour détecter les
    dangers potentiels ?
  choices:
    A: 5 à 8 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: 30 à 40 secondes
  answer: B
  explanation: Il est conseillé aux conducteurs de balayer du regard 12 à 15 secondes
    devant eux afin d'identifier les dangers suffisamment tôt pour réagir en toute
    sécurité.
- id: 113
  category: defensive_driving
  question: À Terre-Neuve-et-Labrador, à quelle distance devez-vous passer des feux
    de route aux feux de croisement lorsque vous croisez un véhicule venant en sens
    inverse la nuit ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 250 mètres
  answer: B
  explanation: En vertu du Code de la route de T.-N.-L., vous devez passer aux feux
    de croisement lorsqu'un véhicule venant en sens inverse se trouve à moins de 150
    mètres pour éviter d'éblouir l'autre conducteur.
- id: 114
  category: defensive_driving
  question: Lorsque vous suivez un autre véhicule par l'arrière la nuit à T.-N.-L.,
    à quelle distance devez-vous passer aux feux de croisement ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Vous devez passer aux feux de croisement lorsque vous suivez un autre
    véhicule à moins de 60 mètres pour éviter l'éblouissement dans ses rétroviseurs.
- id: 115
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais ou sous la neige à T.-N.-L.,
    quel réglage de feux devriez-vous utiliser pour assurer une visibilité maximale
    ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Aucun feu, pour réduire l'éblouissement
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard ou
    la neige. Les feux de route se reflètent sur l'humidité ou les flocons, créant
    un effet de « mur blanc » qui réduit la visibilité.
- id: 116
  category: defensive_driving
  question: En conditions hivernales à T.-N.-L., quelle partie de la chaussée est
    susceptible de geler en premier et de rester glacée même après le dégel du reste
    de la route ?
  choices:
    A: Les intersections
    B: Les collines escarpées
    C: Les tabliers de ponts et les viaducs
    D: Les accotements en gravier
  answer: C
  explanation: Les tabliers de ponts et les viaducs gèlent en premier car l'air froid
    circule à la fois au-dessus et au-dessous de la surface de la route.
- id: 117
  category: defensive_driving
  question: Si vous êtes ébloui par les feux de route d'un véhicule venant en sens
    inverse la nuit, où devriez-vous regarder pour maintenir votre position dans la
    voie ?
  choices:
    A: Directement vers les feux du véhicule en sens inverse
    B: Vers la ligne centrale de la route
    C: Vers le bord droit de la chaussée
    D: Vers le rétroviseur du véhicule
  answer: C
  explanation: Pour éviter d'être ébloui, regardez vers le bord droit de votre voie
    (la ligne blanche ou le bord de la chaussée) pour guider votre direction.
- id: 118
  category: defensive_driving
  question: 'Avant de changer de voie, un conducteur prudent à T.-N.-L. doit effectuer
    une « vérification par-dessus l''épaule » pour :'
  choices:
    A: Vérifier le rétroviseur intérieur
    B: Vérifier le rétroviseur extérieur
    C: Vérifier les angles morts non visibles dans les rétroviseurs
    D: Signaler son intention aux autres conducteurs
  answer: C
  explanation: Une vérification par-dessus l'épaule (en tournant la tête) est le seul
    moyen de voir les véhicules situés dans vos angles morts que les rétroviseurs
    ne peuvent pas capter.
- id: 119
  category: defensive_driving
  question: 'Lorsque vous conduisez sous une pluie battante ou sur des routes couvertes
    de gadoue à T.-N.-L., la distance de sécurité de deux secondes doit être augmentée
    à au moins :'
  choices:
    A: Trois secondes
    B: Quatre secondes
    C: Cinq secondes
    D: Six secondes
  answer: B
  explanation: Dans de mauvaises conditions comme une pluie battante ou de la gadoue,
    la distance de sécurité doit être doublée pour atteindre au moins quatre secondes
    afin de permettre une distance d'arrêt accrue.
- id: 120
  category: defensive_driving
  question: 'Lors d''un arrêt d''urgence dans un véhicule équipé d''un système de
    freinage antiblocage (ABS) sur une route glissante à T.-N.-L., vous devriez :'
  choices:
    A: Pomper les freins rapidement
    B: Appliquer une pression ferme et continue sur la pédale de frein
    C: Utiliser le frein à main
    D: Passer au point mort et laisser rouler
  answer: B
  explanation: Avec l'ABS, vous devez appliquer une pression ferme et constante. Le
    système « pompera » automatiquement les freins pour vous afin d'empêcher le blocage
    des roues.
- id: 121
  category: defensive_driving
  question: Qu'est-ce que la « glace noire » et pourquoi représente-t-elle un danger
    important pour les conducteurs de T.-N.-L. ?
  choices:
    A: De la glace mélangée à de la saleté provenant de la route
    B: Une fine couche de glace transparente qui ressemble à une route mouillée
    C: De la glace qui ne se forme sur l'asphalte que pendant la nuit
    D: De la neige fondue gelée se trouvant au centre de la voie
  answer: B
  explanation: La glace noire est une fine couche de glace transparente. Elle est
    dangereuse car elle est presque invisible et donne à la route l'apparence d'un
    asphalte mouillé.
- id: 122
  category: defensive_driving
  question: Lors de l'approche d'une intersection, quelle est la séquence de balayage
    visuel correcte pour un conducteur pratiquant la conduite préventive ?
  choices:
    A: À gauche, puis à droite
