  category: penalties_and_points
  question: À Terre-Neuve-et-Labrador, combien de points d'inaptitude sont attribués
    pour avoir fait marche arrière avec un véhicule sur une route où il n'est pas
    sécuritaire de le faire ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Faire marche arrière de manière inappropriée sur une route entraîne
    2 points d'inaptitude.
- id: 166
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir fait la course
    avec un véhicule à moteur sur une route ?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Faire la course ou effectuer une cascade sur une route entraîne une
