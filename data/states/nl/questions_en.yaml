metadata:
  source: Newfoundland and Labrador Driver Handbook
  total_questions: 235
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Newfoundland and Labrador, what is the minimum age required to apply
    for a Class 5 Level I (Learner's) driver's license?
  choices:
    A: 15 years old
    B: 16 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: According to the NL Road Users Guide, an individual must be at least
    16 years of age to apply for a Class 5 Level I driver's license.
- id: 2
  category: license_system
  question: A Class 5 Level I (Learner) driver must be accompanied by a licensed driver
    who has held a valid driver's license for at least how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 4 years
    D: 5 years
  answer: C
  explanation: The accompanying driver for a Class 5 Level I driver must have held
    a valid driver's license for a minimum of 4 years.
- id: 3
  category: license_system
  question: What is the required Blood Alcohol Content (BAC) level for all drivers
    in the Graduated Driver Licensing (GDL) program in Newfoundland and Labrador?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Under the NL GDL program, both Level I and Level II drivers must maintain
    a 0.00% BAC level at all times while driving.
- id: 4
  category: license_system
  question: Between what hours is a Class 5 Level I (Learner) driver prohibited from
    operating a motor vehicle?
  choices:
    A: 10:00 PM to 6:00 AM
    B: 11:00 PM to 7:00 AM
    C: Midnight to 5:00 AM
    D: Midnight to 6:00 AM
  answer: C
  explanation: Class 5 Level I drivers are restricted from driving between the hours
    of 12:00 midnight and 5:00 AM.
- id: 5
  category: license_system
  question: How long must a driver remain in the Class 5 Level I (Learner) stage if
    they have NOT completed a recognized driver education course?
  choices:
    A: 6 months
    B: 8 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: The standard duration for the Level I stage is 12 months, which can
    be reduced to 8 months upon successful completion of a recognized driver education
    course.
- id: 6
  category: license_system
  question: In Newfoundland and Labrador, where must the 'Novice Driver' sign be displayed
    for Level I and Level II drivers?
  choices:
    A: On the front windshield
    B: On the rear bumper
    C: In the rear window
    D: On the driver's side door
  answer: C
  explanation: Drivers in the GDL program are required to display a 'Novice Driver'
    sign in the rear window of the vehicle they are operating.
- id: 7
  category: license_system
  question: A Class 5 Level II (Novice) driver must remain in this stage for at least
    how many months before becoming a fully licensed driver?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: The Level II (Novice) stage of the Graduated Driver Licensing program
    lasts for a minimum of 12 months.
- id: 8
  category: license_system
  question: Under the NL point system, how many demerit points will result in an automatic
    driver's license suspension for a fully licensed driver?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: A driver's license will be suspended when 12 or more demerit points
    have been accumulated within a 24-month period.
- id: 9
  category: license_system
  question: If you change your name or address, you must notify the Motor Registration
    Division within how many days?
  choices:
    A: 7 days
    B: 10 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: NL law requires drivers to notify the Motor Registration Division of
    any change in name or address within 10 days.
- id: 10
  category: license_system
  question: Which class of license is required to operate a motorcycle in Newfoundland
    and Labrador?
  choices:
    A: Class 4
    B: Class 5
    C: Class 6
    D: Class 8
  answer: C
  explanation: A Class 6 license is specifically designated for the operation of motorcycles.
- id: 11
  category: license_system
  question: What is the maximum number of passengers a Class 5 Level I (Learner) driver
    is permitted to carry?
  choices:
    A: Only the accompanying licensed driver
    B: The accompanying driver plus two family members
    C: As many as there are seat belts
    D: No passengers are allowed
  answer: A
  explanation: A Level I driver is only permitted to have the accompanying licensed
    driver in the front seat. No other passengers are allowed in the vehicle.
- id: 12
  category: license_system
  question: For a Class 5 Level II (Novice) driver, what is the restriction regarding
    driving between midnight and 5:00 AM?
  choices:
    A: They are strictly prohibited from driving during these hours
    B: They can drive alone only for work purposes
    C: They must be accompanied by a licensed driver with 4+ years experience unless
      for work purposes
    D: There are no restrictions for Level II drivers
  answer: C
  explanation: Level II drivers may only drive between midnight and 5:00 AM if they
    are accompanied by a licensed driver with at least 4 years of experience, unless
    they are driving for employment purposes (proof of employment may be required).
- id: 13
  category: license_system
  question: In Newfoundland and Labrador, at what age is a driver required to provide
    a medical report to renew their license for the first time?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: Drivers in NL must file a medical report at age 75, again at age 80,
    and every two years thereafter.
- id: 14
  category: license_system
  question: Regardless of license class or GDL stage, any driver under what age must
    maintain a 0.00% BAC level?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '22'
  answer: D
  explanation: In Newfoundland and Labrador, all drivers under the age of 22 must
    maintain a 0.00% Blood Alcohol Content level, even if they have completed the
    GDL program.
- id: 15
  category: license_system
  question: How many demerit points are assigned for failing to display the 'Novice
    Driver' sign in the rear window?
  choices:
    A: 0 points (fine only)
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Failure to display the 'Novice Driver' sign as required by the GDL
    program results in 2 demerit points.
- id: 16
  category: license_system
  question: 'In Newfoundland and Labrador, if a Class 5 Level I (Learner) driver completes
    an approved driver education course, the 12-month waiting period for the road
    test is reduced to:'
  choices:
    A: 6 months
    B: 8 months
    C: 9 months
    D: 10 months
  answer: B
  explanation: According to the NL Graduated Driver Licensing (GDL) program, the Level
    I stage is reduced from 12 months to 8 months if the driver successfully completes
    a recognized driver education course.
- id: 17
  category: license_system
  question: Under the Newfoundland and Labrador point system, a driver in the Graduated
    Driver Licensing (GDL) program will have their license suspended if they accumulate
    how many points?
  choices:
    A: 4 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: B
  explanation: While fully licensed drivers are suspended at 12 points, novice drivers
    (Level I and Level II) in NL face suspension once they accumulate 6 demerit points.
- id: 18
  category: license_system
  question: A person who moves to Newfoundland and Labrador from another province
    and holds a valid driver's license must exchange it for an NL license within how
    many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: New residents to Newfoundland and Labrador are permitted to drive on
    their valid out-of-province license for a period of up to 3 months (90 days) before
    they must exchange it.
- id: 19
  category: license_system
  question: Which class of license is required in Newfoundland and Labrador to operate
    a taxi, an ambulance, or a bus with a seating capacity of up to 24 passengers?
  choices:
    A: Class 3
    B: Class 4
    C: Class 5
    D: Class 2
  answer: B
  explanation: A Class 4 license is specifically required for operating taxis, ambulances,
    and small buses (up to 24 passengers) in Newfoundland and Labrador.
- id: 20
  category: license_system
  question: In Newfoundland and Labrador, an applicant for a driver's license who
    is under what age must provide the written consent of a parent or legal guardian?
  choices:
    A: '17'
    B: '18'
    C: '19'
    D: '21'
  answer: C
  explanation: Because the age of majority in Newfoundland and Labrador is 19, any
    applicant under 19 years of age must have a parent or guardian sign the consent
    section of the application.
- id: 21
  category: license_system
  question: How many demerit points are recorded against a driver's record for speeding
    between 1 and 15 km/h over the posted limit?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 0 points
  answer: A
  explanation: In the NL demerit point system, speeding 1-15 km/h over the limit results
    in 2 points; 16-30 km/h results in 3 points; 31-45 km/h results in 4 points; and
    46+ km/h results in 6 points.
- id: 22
  category: license_system
  question: If you fail a road test in Newfoundland and Labrador, what is the minimum
    amount of time you must wait before you can take the test again?
  choices:
    A: 7 days
    B: 14 days
    C: 21 days
    D: 30 days
  answer: B
  explanation: If an applicant fails the road test, they must wait at least 14 days
    before they are eligible to attempt the test again.
- id: 23
  category: license_system
  question: To apply for a first-time driver's license in NL, you must provide at
    least two pieces of identification. Which of the following is considered a 'Primary'
    document?
  choices:
    A: Social Insurance Card
    B: Birth Certificate
    C: Credit Card
    D: School ID Card
  answer: B
  explanation: A Birth Certificate (original or certified copy) or a valid Passport
    is required as a primary identification document for a license application in
    NL.
- id: 24
  category: license_system
  question: How many demerit points are assigned to a driver for using a handheld
    cellular phone or other communication device while driving?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Distracted driving, specifically using a handheld wireless communication
    device, carries a penalty of 4 demerit points in Newfoundland and Labrador.
- id: 25
  category: license_system
  question: Which class of license is required to operate a truck with three or more
    axles, but not a semi-trailer combination?
  choices:
    A: Class 1
    '0': Class 2
    C: Class 3
    D: Class 4
  answer: C
  explanation: A Class 3 license in NL permits the operation of trucks with 3 or more
    axles, including any combination of vehicles where the towed vehicle is not over
    4,500 kg.
- id: 26
  category: license_system
  question: Once a driver has obtained a full Class 5 license in Newfoundland and
    Labrador, how often must it be renewed?
  choices:
    A: Every 2 years
    B: Every 3 years
    C: Every 5 years
    D: Every 10 years
  answer: C
  explanation: In Newfoundland and Labrador, driver's licenses are typically valid
    for a period of 5 years and expire on the driver's birthday.
- id: 27
  category: license_system
  question: 'To meet the vision standards for a Class 5 or Class 6 license in NL,
    an applicant''s visual acuity must be at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/30 in the better eye
    C: 20/40 in at least one eye
    D: 20/50 in both eyes
  answer: C
  explanation: The minimum vision requirement for a Class 5 (passenger vehicle) or
    Class 6 (motorcycle) license is 20/40 in at least one eye, with or without corrective
    lenses.
- id: 28
  category: license_system
  question: When are you legally required to report a medical condition to the Motor
    Registration Division?
  choices:
    A: Only when you reach age 75
    B: Only if it results in an accident
    C: Immediately, if you develop any condition that may affect your ability to drive
      safely
    D: Only during your 5-year renewal period
  answer: C
  explanation: Drivers are legally obligated to report any medical condition or physical
    disability that may interfere with the safe operation of a motor vehicle to the
    Motor Registration Division as soon as the condition arises.
- id: 29
  category: license_system
  question: How many demerit points are assigned for failing to stop for a school
    bus that has its red lights flashing?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to stop for a school bus when the red lights are flashing is
    considered a serious offense and results in 6 demerit points in NL.
- id: 30
  category: license_system
  question: What is the minimum age required to apply for a commercial driver's license
    (Class 1, 2, 3, or 4) in Newfoundland and Labrador?
  choices:
    A: 17 years
    B: 18 years
    C: 19 years
    D: 21 years
  answer: B
  explanation: To be eligible for any commercial class of license (Classes 1 through
    4) in NL, the applicant must be at least 18 years of age and hold a valid Class
    5 license.
- id: 31
  category: driver_testing
  question: To pass the vision test for a Class 5 license in Newfoundland and Labrador,
    what is the minimum required visual acuity in your better eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the NL Road Users Guide, an applicant must have a visual
    acuity of at least 20/40 in the better eye, with or without corrective lenses.
- id: 32
  category: driver_testing
  question: The Newfoundland and Labrador written knowledge test consists of two parts
    (Road Signs and Rules of the Road). What is the minimum passing score for each
    section?
  choices:
    A: 75%
    B: 80%
    C: 85%
    D: 90%
  answer: C
  explanation: To pass the written knowledge test, you must correctly answer at least
    17 out of 20 questions (85%) in each of the two sections.
- id: 33
  category: driver_testing
  question: Which of the following is a mandatory requirement for the vehicle you
    provide for your NL road test?
  choices:
    A: It must be less than 5 years old
    B: It must have a valid inspection sticker and insurance
    C: It must be equipped with dual brakes
    D: It must be a manual transmission vehicle
  answer: B
  explanation: The vehicle used for a road test must be in safe mechanical condition,
    have a valid inspection sticker, and be properly insured and registered.
- id: 34
  category: driver_testing
  question: In Newfoundland and Labrador, what is the minimum mandatory third-party
    liability insurance coverage required for all motor vehicles?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: The Highway Traffic Act of Newfoundland and Labrador requires all drivers
    to carry a minimum of $200,000 in third-party liability insurance.
- id: 35
  category: driver_testing
  question: How many demerit points are recorded on your driving record for exceeding
    the speed limit by 1 to 15 km/h in NL?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: In Newfoundland and Labrador, speeding 1-15 km/h over the limit results
    in 2 demerit points.
- id: 36
  category: driver_testing
  question: In Newfoundland and Labrador, how many demerit points are assigned for
    failing to remain at the scene of an accident?
  choices:
    A: 4 points
    B: 6 points
    C: 7 points
    D: 9 points
  answer: B
  explanation: Failing to remain at the scene of an accident is a serious offense
    in NL and results in 6 demerit points.
- id: 37
  category: driver_testing
  question: What is the minimum horizontal visual field requirement (peripheral vision)
    to hold a Class 5 license in NL?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 150 degrees
  answer: C
  explanation: To qualify for a Class 5 license, a driver must have a horizontal visual
    field of at least 120 degrees.
- id: 38
  category: driver_testing
  question: If you fail your road test for the second time, how long must you wait
    before you can book a third attempt?
  choices:
    A: 7 days
    B: 14 days
    C: 21 days
    D: 30 days
  answer: B
  explanation: While the first failure requires a 7-day wait, a second failure in
    Newfoundland and Labrador requires a 14-day waiting period.
- id: 39
  category: driver_testing
  question: In Newfoundland and Labrador, which class of license is required to operate
    a vehicle with more than two axles, such as a large dump truck, but not a tractor-trailer?
  choices:
    A: Class 1
    B: Class 2
    C: Class 3
    D: Class 4
  answer: C
  explanation: A Class 3 license is required to operate trucks with more than two
    axles, provided they are not towing a trailer exceeding 4,500 kg.
- id: 40
  category: driver_testing
  question: During the NL road test, which of the following actions will result in
    an immediate automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Adjusting your mirrors while driving
    C: An action that requires the examiner to take control of the vehicle to avoid
      a collision
    D: Parking more than 30cm from the curb
  answer: C
  explanation: Any dangerous action that requires the examiner to intervene or take
    control of the vehicle results in an immediate failure of the road test.
- id: 41
  category: driver_testing
  question: How many demerit points are assigned to a driver in NL for failing to
    wear a seatbelt?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failing to wear a seatbelt or failing to ensure a passenger under 16
    is wearing one results in 2 demerit points in NL.
- id: 42
  category: driver_testing
  question: When registering a vehicle in Newfoundland and Labrador, where must the
    validation sticker be placed?
  choices:
    A: On the front license plate
    B: On the rear license plate
    C: On the bottom left of the windshield
    D: On the bottom right of the windshield
  answer: B
  explanation: In NL, the registration validation sticker must be placed on the rear
    license plate of the vehicle.
- id: 43
  category: driver_testing
  question: What is the standard fee for the reinstatement of a driver's license that
    was suspended due to a Criminal Code alcohol conviction in NL?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: The standard license reinstatement fee in Newfoundland and Labrador
    following a suspension is $100.
- id: 44
  category: driver_testing
  question: When arriving for a road test in Newfoundland and Labrador, which of the
    following must be presented for the vehicle being used?
  choices:
    A: A valid vehicle registration and insurance certificate
    B: A bill of sale and a valid driver's license
    C: The vehicle's original owner's manual
    D: A letter of permission from the vehicle manufacturer
  answer: A
  explanation: Before a road test can begin, the applicant must provide a valid vehicle
    registration and a valid insurance certificate for the vehicle.
- id: 45
  category: driver_testing
  question: What is the minimum passing grade for the written knowledge test in Newfoundland
    and Labrador?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: D
  explanation: The written knowledge test consists of questions on road signs and
    rules of the road; a passing grade of 85% is required.
- id: 46
  category: driver_testing
  question: In Newfoundland and Labrador, which class of license is specifically required
    to operate a traction engine or any vehicle not otherwise classified?
  choices:
    A: Class 4
    B: Class 6
    C: Class 8
    D: Class 3
  answer: C
  explanation: A Class 8 license permits the holder to operate traction engines and
    any other vehicle not classified in other license classes.
- id: 47
  category: driver_testing
  question: After reaching the age of 80, how often must a driver in Newfoundland
    and Labrador file a medical report to maintain their license?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 5 years
    D: Only if requested by a doctor
  answer: B
  explanation: In NL, medical reports are required at age 75, 80, and every two years
    thereafter.
- id: 48
  category: driver_testing
  question: How many demerit points are assigned for 'stunting' or 'racing' on a highway
    in Newfoundland and Labrador?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Serious offenses such as racing or stunting carry the maximum demerit
    point penalty of 6 points.
- id: 49
  category: driver_testing
  question: To pass the vision test for a driver's license in NL, what is the minimum
    required horizontal field of vision?
  choices:
    A: 80 degrees
    B: 100 degrees
    C: 120 degrees
    D: 150 degrees
  answer: B
  explanation: Applicants must have a horizontal field of vision of at least 100 degrees
    to qualify for a driver's license.
- id: 50
  category: driver_testing
  question: A road test will be cancelled immediately if the vehicle provided by the
    applicant has which of the following defects?
  choices:
    A: A dirty exterior
    B: A non-functioning radio
    C: Defective brake lights or turn signals
    D: Low fuel level
  answer: C
  explanation: The vehicle used for the road test must be in safe mechanical condition.
    Defective equipment like brake lights or turn signals will result in the cancellation
    of the test.
- id: 51
  category: driver_testing
  question: When applying for a learner's permit, what must an applicant provide to
    the Motor Registration Division to prove their identity?
  choices:
    A: A verbal statement of their name and age
    B: A library card and a utility bill
    C: Two pieces of identification, at least one of which must be a primary document
      like a birth certificate or passport
    D: A signed letter from a neighbor
  answer: C
  explanation: Applicants must provide two pieces of identification. One must be a
    primary document (e.g., birth certificate, passport, or landed immigrant papers).
- id: 52
  category: driver_responsibility
  question: 'In Newfoundland and Labrador, a motor vehicle accident must be reported
    to the police if the total property damage is estimated to be at least:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: According to the Newfoundland and Labrador Highway Traffic Act, accidents
    involving property damage of $2,000 or more must be reported to the police immediately.
- id: 53
  category: driver_responsibility
  question: In Newfoundland and Labrador, what is the minimum fine for a first-time
    offense of driving without valid motor vehicle insurance?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Under the Automobile Insurance Act of NL, the fine for a first offense
    of driving without insurance ranges from $2,000 to $4,000.
- id: 54
  category: driver_responsibility
  question: When a vehicle is sold in Newfoundland and Labrador, within how many days
    must the seller notify the Motor Registration Division of the transfer of ownership?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: The seller of a motor vehicle is required by the Highway Traffic Act
    to notify the Motor Registration Division within 10 days of the sale.
- id: 55
  category: driver_responsibility
  question: Which of the following documents must a driver be able to produce when
    requested by a peace officer in Newfoundland and Labrador?
  choices:
    A: A valid driver's license only
    B: A valid driver's license and vehicle registration only
    C: A valid driver's license, vehicle registration, and proof of insurance
    D: A valid driver's license and the vehicle's original bill of sale
  answer: C
  explanation: Drivers must carry and be able to produce their driver's license, the
    vehicle's registration certificate, and a valid pink card (proof of insurance).
- id: 56
  category: driver_responsibility
  question: 'If a driver is caught operating a vehicle without valid insurance in
    NL, the police have the authority to impound the vehicle for a minimum of:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 7 days
  answer: C
  explanation: In Newfoundland and Labrador, if a driver cannot produce proof of insurance,
    the vehicle may be impounded for a minimum of 72 hours.
- id: 57
  category: driver_responsibility
  question: In Newfoundland and Labrador, the driver of a vehicle is responsible for
    ensuring that all passengers under what age are properly buckled up?
  choices:
    A: 12 years
    B: 16 years
    C: 18 years
    D: 19 years
  answer: B
  explanation: The driver is legally responsible for ensuring that any passenger under
    the age of 16 is properly secured in a seatbelt or appropriate child restraint
    system.
- id: 58
  category: driver_responsibility
  question: 'If you are involved in a motor vehicle accident that results in injury
    or death, you must report the accident to the police:'
  choices:
    A: Immediately
    B: Within 24 hours
    C: Within 48 hours
    D: Only if property damage exceeds $2,000
  answer: A
  explanation: The Highway Traffic Act requires that any accident involving injury
    or death must be reported to the nearest police officer immediately.
- id: 59
  category: driver_responsibility
  question: If you collide with an unattended vehicle and cannot locate the owner,
    what is your legal responsibility in NL?
  choices:
    A: Wait at the scene for at least one hour
    B: Leave a note with your name, address, and license plate number
    C: Nothing, if the damage appears to be less than $2,000
    D: Report it to your insurance company only
  answer: B
  explanation: If you hit an unattended vehicle, you must either locate the owner
    or leave a written notice in a conspicuous place on the vehicle with your contact
    information.
- id: 60
  category: driver_responsibility
  question: Where is the registration certificate for a motor vehicle required to
    be kept in Newfoundland and Labrador?
  choices:
    A: In the driver's home for safekeeping
    B: In the vehicle at all times
    C: At the Motor Registration Division
    D: With the insurance company
  answer: B
  explanation: The registration certificate for a vehicle must be carried in the vehicle
    to which it refers so it can be produced upon demand by a peace officer.
- id: 61
  category: driver_responsibility
  question: 'Providing false information to the Motor Registration Division on an
    application for a license or registration can result in a fine of up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Under Section 14 of the Highway Traffic Act, providing false information
    can lead to a fine of up to $1,000, imprisonment, or license suspension.
- id: 62
  category: driver_responsibility
  question: If an uninsured driver is involved in an accident and a judgment is made
    against them, what happens to their driving privileges in NL?
  choices:
    A: They are given 90 days to pay before suspension
    B: Their license and registration are suspended until the judgment is paid
    C: They can continue driving but cannot buy a new car
    D: They must pay a $100 fine to keep their license
  answer: B
  explanation: In NL, if an uninsured driver fails to satisfy a judgment resulting
    from an accident, their license and registration are suspended until the judgment
    is paid or a payment plan is approved.
- id: 63
  category: driver_responsibility
  question: 'If you change the engine or the body of your registered motor vehicle,
    you must notify the Motor Registration Division within:'
  choices:
    A: 24 hours
    B: 10 days
    C: 30 days
    D: The time of your next renewal
  answer: B
  explanation: Any significant changes to the vehicle's description, such as a change
    in engine or body, must be reported to the MRD within 10 days.
- id: 64
  category: driver_responsibility
  question: When you sell a motor vehicle to another person, you must notify the Motor
    Registration Division within how many days of the sale?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: The seller of a vehicle is required to notify the Motor Registration
    Division within 10 days of the date of sale or transfer.
- id: 65
  category: driver_responsibility
  question: 'When purchasing a vehicle privately, the buyer must register the transfer
    of ownership with the Motor Registration Division within:'
  choices:
    A: 10 days
    B: 15 days
    C: 20 days
    D: 30 days
  answer: A
  explanation: In NL, the purchaser of a vehicle must register the transfer of ownership
    within 10 days of the purchase date.
- id: 66
  category: driver_responsibility
  question: If you are involved in an accident where a person is injured, what is
    your first legal responsibility?
  choices:
    A: Call your insurance company
    B: Take photos of the damage
    C: Render all necessary assistance and call for medical help
    D: Move your vehicle to the side of the road immediately
  answer: C
  explanation: Under the Highway Traffic Act, drivers involved in an accident must
    remain at the scene and render all reasonable assistance to any person injured.
- id: 67
  category: driver_responsibility
  question: When a used vehicle is sold privately in NL, what document must be provided
    to the buyer to complete the registration transfer?
  choices:
    A: A manufacturer's warranty
    B: A valid Motor Vehicle Inspection (MVI) Certificate
    C: A letter from the previous insurance company
    D: The driver's original birth certificate
  answer: B
  explanation: A valid Motor Vehicle Inspection (MVI) Certificate, issued within the
    last 30 days, is required to transfer ownership of a used vehicle in NL.
- id: 68
  category: driver_responsibility
  question: If a peace officer requests it, which of the following documents must
    a driver produce?
  choices:
    A: Driver's license, vehicle registration, and proof of insurance
    B: Driver's license and birth certificate
    C: Vehicle registration and a copy of the sales contract
    D: Proof of insurance and a medical certificate
  answer: A
  explanation: Drivers must carry and be able to produce their valid driver's license,
    vehicle registration, and valid insurance (pink card) upon request by a peace
    officer.
- id: 69
  category: driver_responsibility
  question: In NL, if a driver's BAC is between 0.05 and 0.08, their license will
    be suspended immediately for how long for a first offense?
  choices:
    A: 24 hours
    B: 7 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: Under the administrative license suspension program, a first-time BAC
    reading between 0.05 and 0.08 results in an immediate 7-day license suspension.
- id: 70
  category: driver_responsibility
  question: What happens to a vehicle if the driver is caught operating it while their
    license is suspended?
  choices:
    A: The vehicle is impounded for 30 days
    B: The vehicle is sold at auction
    C: The vehicle is crushed
    D: The vehicle's registration is permanently cancelled
  answer: A
  explanation: In Newfoundland and Labrador, if you are caught driving while your
    license is suspended, the vehicle you are driving will be impounded for 30 days,
    regardless of who owns it.
- id: 71
  category: driver_responsibility
  question: 'When approaching a stopped emergency vehicle with its red or blue lights
    flashing on a highway with two or more lanes in your direction, you must:'
  choices:
    A: Stop and wait for the officer to wave you through
    B: Maintain speed but honk your horn
    C: Slow down and move to the non-adjacent lane if it is safe to do so
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The 'Move Over' law in NL requires drivers to slow down and, if safe,
    move into the lane that is not adjacent to the emergency vehicle.
- id: 72
  category: driver_responsibility
  question: How many demerit points are recorded on your driving record for 'Failing
    to remain at the scene of an accident'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: Failing to remain at the scene of an accident is a serious offense
    and results in 6 demerit points being added to your driving record in NL.
- id: 73
  category: driver_responsibility
  question: 'If you are involved in an accident with an unattended vehicle (e.g.,
    in a parking lot), you must:'
  choices:
    A: Leave the scene immediately if no one saw you
    B: Wait for 10 minutes and then leave
    C: Locate the owner or leave a written notice with your name, address, and license
      number
    D: Only report it if the damage looks like it's over $5,000
  answer: C
  explanation: If the owner of a damaged vehicle or property cannot be located, you
    are legally required to leave a written notice with your contact and vehicle information.
- id: 74
  category: driver_responsibility
  question: 'In NL, if a driver is convicted of a Criminal Code offense related to
    driving (such as Impaired Driving), the minimum court-ordered driving prohibition
    for a first offense is:'
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 24 months
  answer: C
  explanation: A first-time Criminal Code conviction for impaired driving carries
    a minimum 12-month federal driving prohibition, which is served concurrently with
    provincial suspensions.
- id: 75
  category: safe_driving_rules
  question: In Newfoundland and Labrador, what is the default speed limit in a municipality
    unless otherwise posted?
  choices:
    A: 30 km/h
    B: 40 km/h
    C: 50 km/h
    D: 60 km/h
  answer: C
  explanation: According to the NL Highway Traffic Act, the speed limit within a municipality
    is 50 km/h unless signs indicate otherwise.
- id: 76
  category: safe_driving_rules
  question: In Newfoundland and Labrador, you are prohibited from parking within what
    distance of a fire hydrant?
  choices:
    A: 1 metre
    B: 3 metres
    C: 5 metres
    D: 10 metres
  answer: A
  explanation: The NL Highway Traffic Act specifies that a person shall not stop,
    stand, or park a vehicle within 1 metre of a fire hydrant.
- id: 77
  category: safe_driving_rules
  question: When parking near a stop sign or traffic control signal, what is the minimum
    distance you must maintain?
  choices:
    A: 5 metres
    B: 10 metres
    C: 15 metres
    D: 20 metres
  answer: B
  explanation: Under NL law, you must not park a vehicle within 10 metres of the approach
    side of a stop sign or traffic control signal.
- id: 78
  category: safe_driving_rules
  question: What is the minimum distance you must park away from the approach side
    of a crosswalk?
  choices:
    A: 3 metres
    B: 6 metres
    C: 9 metres
    D: 12 metres
  answer: B
  explanation: In Newfoundland and Labrador, parking is prohibited within 6 metres
    of the approach side of a crosswalk.
- id: 79
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit in a school zone in Newfoundland
    and Labrador between 8:00 AM and 5:00 PM on school days?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: The standard speed limit in school zones in NL is 30 km/h during school
    hours (8:00 AM to 5:00 PM) when school is in session.
- id: 80
  category: safe_driving_rules
  question: How many demerit points are recorded against your driving record for using
    a hand-held cellular device while driving in NL?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Using a hand-held wireless communication device while driving in Newfoundland
    and Labrador results in 4 demerit points.
- id: 81
  category: safe_driving_rules
  question: When driving at night, you must dim your high beam headlights when you
    are within what distance of an oncoming vehicle?
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 300 metres
  answer: B
  explanation: Drivers in NL must switch to low beams when an oncoming vehicle is
    within 150 metres to avoid blinding the other driver.
- id: 82
  category: safe_driving_rules
  question: In Newfoundland and Labrador, 'stunting' includes driving at a speed that
    exceeds the speed limit by how much?
  choices:
    A: 30 km/h or more
    B: 40 km/h or more
    C: 50 km/h or more
    D: 60 km/h or more
  answer: C
  explanation: Driving 50 km/h or more over the speed limit is classified as stunting
    in NL, which carries severe penalties including immediate vehicle impoundment.
- id: 83
  category: safe_driving_rules
  question: 'A U-turn is prohibited in Newfoundland and Labrador if you do not have
    a clear view of traffic in both directions for at least:'
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 250 metres
  answer: B
  explanation: The Highway Traffic Act prohibits U-turns on curves or near the crest
    of a hill where the driver does not have a clear view of at least 150 metres in
    either direction.
- id: 84
  category: safe_driving_rules
  question: When an emergency vehicle with its siren or lights flashing is approaching,
    what must a driver do?
  choices:
    A: Speed up to get out of the way
    B: Stop immediately in the middle of the lane
    C: Pull to the right as far as possible and stop
    D: Turn on hazard lights and maintain speed
  answer: C
  explanation: Drivers must yield the right-of-way and immediately drive to a position
    parallel to and as close as possible to the right-hand edge or curb and stop.
- id: 85
  category: safe_driving_rules
  question: If you are involved in a collision where the total property damage is
    $2,000 or more, what must you do?
  choices:
    A: Report it to the police immediately
    B: Wait 24 hours before reporting to the police
    C: Only report it to your insurance company
    D: Exchange information and leave if no one is hurt
  answer: A
  explanation: In NL, any accident involving injury, death, or property damage apparently
    exceeding $2,000 must be reported to the police immediately.
- id: 86
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit on rural highways
    in Newfoundland and Labrador?
  choices:
    A: 80 km/h
    B: 90 km/h
    C: 100 km/h
    D: 110 km/h
  answer: A
  explanation: In rural areas of Newfoundland and Labrador, the default speed limit
    is 80 km/h unless otherwise posted.
- id: 87
  category: safe_driving_rules
  question: When driving through a school zone in Newfoundland and Labrador, what
    is the speed limit when children are present or during school hours?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: The speed limit in school zones in NL is 30 km/h between the hours
    of 8:00 am and 5:00 pm on days when school is in session, or as posted.
- id: 88
  category: safe_driving_rules
  question: You must not park your vehicle within how many metres of a stop sign or
    a traffic control signal?
  choices:
    A: 3 metres
    B: 5 metres
    C: 6 metres
    D: 10 metres
  answer: C
  explanation: In Newfoundland and Labrador, parking is prohibited within 6 metres
    of a stop sign, yield sign, or traffic control signal.
- id: 89
  category: safe_driving_rules
  question: When approaching a roundabout in Newfoundland and Labrador, which way
    must you yield?
  choices:
    A: Yield to traffic entering from the right
    B: Yield to traffic already in the roundabout approaching from your left
    C: Yield to traffic behind you
    D: You have the right of way when entering
  answer: B
  explanation: Drivers entering a roundabout must yield the right-of-way to traffic
    already circulating in the roundabout, which will be coming from the left.
- id: 90
  category: safe_driving_rules
  question: Under the NL 'Move Over' law, what must you do when approaching a stopped
    emergency vehicle with its blue or red lights flashing?
  choices:
    A: Maintain speed but honk your horn
    B: Stop immediately in the middle of the road
    C: Slow down and, if safe to do so, move into a non-adjacent lane
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: The law requires drivers to slow down and move to an alternate lane
    (if safe) when passing emergency vehicles or tow trucks stopped on the roadside
    with flashing lights.
- id: 91
  category: safe_driving_rules
  question: In Newfoundland and Labrador, when are you permitted to use studded tires?
  choices:
    A: All year round
    B: From October 1 to April 30
    C: From November 1 to May 31
    D: From December 1 to March 31
  answer: C
  explanation: Studded tires are permitted in Newfoundland and Labrador from November
    1st to May 31st each year.
- id: 92
  category: safe_driving_rules
  question: When two vehicles reach an intersection with no stop signs or signals
    at approximately the same time, who has the right of way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The larger vehicle
  answer: B
  explanation: At an uncontrolled intersection, the driver on the left must yield
    the right-of-way to the driver on the right.
- id: 93
  category: safe_driving_rules
  question: What is the penalty for a first-time conviction of using a handheld cellular
    phone while driving in NL?
  choices:
    A: A fine and 1 demerit point
    B: A fine and 4 demerit points
    C: A fine and 0 demerit points
    D: A warning only
  answer: B
  explanation: Distracted driving (using a handheld device) in NL carries a significant
    fine and 4 demerit points upon conviction.
- id: 94
  category: safe_driving_rules
  question: In Newfoundland and Labrador, how far back must you follow an emergency
    vehicle that has its sirens or lights engaged?
  choices:
    A: 50 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: C
  explanation: The Highway Traffic Act specifies that drivers must not follow an emergency
    vehicle closer than 150 metres.
- id: 95
  category: safe_driving_rules
  question: When a school bus is stopped with its red lights flashing and visual sign
    operating, what must a driver do?
  choices:
    A: Stop only if they are behind the bus
    B: Stop from either direction, unless separated by a median
    C: Slow down to 10 km/h and pass carefully
    D: Honk and proceed with caution
  answer: B
  explanation: Drivers approaching from both the front and rear must stop for a school
    bus with flashing red lights, unless the road is divided by a median strip.
- id: 96
  category: safe_driving_rules
  question: What is the rule regarding 'Right Turn on Red' in Newfoundland and Labrador?
  choices:
    A: It is never allowed
    B: It is allowed only if a green arrow is present
    C: It is allowed after a complete stop and yielding to pedestrians/traffic, unless
      a sign prohibits it
    D: It is allowed without stopping as long as no traffic is coming
  answer: C
  explanation: In NL, you may turn right on a red light after coming to a complete
    stop and yielding to pedestrians and other traffic, provided no sign prohibits
    the turn.
- id: 97
  category: safe_driving_rules
  question: When parking a vehicle on a downhill grade, how should the front wheels
    be positioned?
  choices:
    A: Turned towards the curb (or edge of the road)
    B: Turned away from the curb
    C: Kept straight
    D: It does not matter
  answer: A
  explanation: When parking downhill, you should turn your wheels toward the curb
    so that if the vehicle rolls, it will roll off the road or into the curb rather
    than into traffic.
- id: 98
  category: safe_driving_rules
  question: In Newfoundland and Labrador, what happens to the fines for speeding in
    a designated construction zone when workers are present?
  choices:
    A: They are reduced by half
    B: They remain the same as standard speeding fines
    C: They are doubled
    D: They are tripled
  answer: C
  explanation: Under the Highway Traffic Act in NL, fines for speeding in a construction
    zone are doubled when workers are present.
- id: 99
  category: defensive_driving
  question: In Newfoundland and Labrador, what is the recommended minimum following
    distance behind another vehicle under ideal driving conditions?
  choices:
    A: One car length
    B: Two seconds
    C: Four seconds
    D: 50 meters
  answer: B
  explanation: The Newfoundland and Labrador Driver's Handbook recommends the 'two-second
    rule' to maintain a safe following distance under ideal weather and road conditions.
- id: 100
  category: defensive_driving
  question: Because of the high risk of moose-vehicle collisions in NL, at what times
    are moose most active and likely to be on the road?
  choices:
    A: Mid-day when the sun is highest
    B: Between 11:00 AM and 2:00 PM
    C: Between sunset and sunrise (dusk and dawn)
    D: Only during the winter months
  answer: C
  explanation: In Newfoundland and Labrador, moose are most active during the hours
    of darkness, specifically around dusk and dawn, which is when the majority of
    collisions occur.
- id: 101
  category: defensive_driving
  question: In Newfoundland and Labrador, during which period are studded tires legally
    permitted on vehicles?
  choices:
    A: October 1 to April 30
    B: November 1 to May 31
    C: December 1 to March 31
    D: November 15 to April 15
  answer: B
  explanation: Under provincial regulations in NL, studded tires are permitted only
    from November 1 to May 31 each year to protect road surfaces during the summer.
- id: 102
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet road in NL, what is the
    correct defensive driving response?
  choices:
    A: Brake hard to regain traction
    B: Turn the steering wheel sharply toward the shoulder
    C: Ease off the gas pedal and steer straight
    D: Accelerate slightly to cut through the water
  answer: C
  explanation: To recover from hydroplaning, you should take your foot off the gas
    and steer in the direction you want to go. Do not brake, as this can cause a skid.
- id: 103
  category: defensive_driving
  question: When driving in heavy fog, which is common in coastal areas of NL, which
    lights should you use?
  choices:
    A: High-beam headlights
    B: Parking lights only
    C: Low-beam headlights
    D: Hazard lights
  answer: C
  explanation: Low beams should be used in fog. High beams reflect off the moisture
    in the fog, creating a 'white wall' effect that reduces visibility further.
- id: 104
  category: defensive_driving
  question: To maintain proper 'visual lead time' while driving in urban areas of
    NL, how far ahead should you be scanning the road?
  choices:
    A: 2 to 5 seconds
    B: 12 to 15 seconds
    C: 20 to 30 seconds
    D: 500 meters
  answer: B
  explanation: Defensive driving guidelines in NL suggest scanning 12 to 15 seconds
    ahead to identify potential hazards before they become immediate problems.
- id: 105
  category: defensive_driving
  question: Under the NL Highway Traffic Act, how many demerit points are assigned
    for the offense of 'Following too closely'?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: In Newfoundland and Labrador, a conviction for following too closely
    results in 2 demerit points being added to your driving record.
- id: 106
  category: defensive_driving
  question: 'When driving on a highway in NL during a heavy rainstorm, your following
    distance should be increased to at least:'
  choices:
    A: 3 seconds
    B: 4 seconds
    C: 6 seconds
    D: 10 seconds
  answer: B
  explanation: In adverse conditions like rain, snow, or ice, the standard two-second
    rule should be doubled to at least four seconds to account for increased stopping
    distances.
- id: 107
  category: defensive_driving
  question: What is the best defensive driving technique for avoiding a moose collision
    on NL highways at night?
  choices:
    A: Drive with high beams on whenever possible and scan the shoulders
    B: Drive at the maximum posted speed limit to pass through moose zones quickly
    C: Watch the center line only to stay in your lane
    D: Honk your horn continuously in wooded areas
  answer: A
  explanation: Using high beams (when legal) and scanning the road shoulders allows
    you to spot the reflection of a moose's eyes or its silhouette earlier.
- id: 108
  category: defensive_driving
  question: When roads are slippery due to ice or snow in NL, how should you apply
    the brakes if your vehicle is equipped with Anti-lock Braking System (ABS)?
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, continuous pressure to the brake pedal
    C: Use the emergency brake only
    D: Lightly tap the brakes once
  answer: B
  explanation: With ABS, you should apply steady, firm pressure. Pumping the brakes
    is for older vehicles without ABS and can actually deactivate the ABS system's
    effectiveness.
- id: 109
  category: defensive_driving
  question: In NL, 'Black Ice' is a frequent winter hazard. Where is it most likely
    to form first?
  choices:
    A: In the middle of open fields
    B: On gravel roads
    C: On bridges and overpasses
    D: In underground parking garages
  answer: C
  explanation: Bridges and overpasses freeze before the rest of the roadway because
    cold air circulates both above and below the road surface.
- id: 110
  category: defensive_driving
  question: 'Before changing lanes on a multi-lane highway like the Trans-Canada Highway
    in NL, a defensive driver must:'
  choices:
    A: Signal and immediately move over
    B: Check mirrors, signal, and perform a shoulder check (blind spot check)
    C: Slow down significantly before turning the wheel
    D: Wait for another driver to flash their lights
  answer: B
  explanation: The proper sequence for a safe lane change is to check mirrors, signal
    your intent, and perform a shoulder check to ensure the blind spot is clear.
- id: 111
  category: defensive_driving
  question: Total stopping distance is made up of which three factors?
  choices:
    A: Speed, weight, and tire pressure
    B: Visibility, road surface, and weather
    C: Perception distance, reaction distance, and braking distance
    D: Braking distance, car length, and following distance
  answer: C
  explanation: Total stopping distance is the sum of the distance traveled while you
    see a hazard (perception), the distance traveled while moving your foot to the
    brake (reaction), and the distance traveled once the brakes are applied (braking).
- id: 112
  category: defensive_driving
  question: To maintain proper situational awareness while driving in NL, how far
    ahead should you scan the road for potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 12 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: Drivers are advised to scan 12 to 15 seconds ahead to identify hazards
    early enough to react safely.
- id: 113
  category: defensive_driving
  question: In Newfoundland and Labrador, at what distance must you dim your high
    beam headlights when approaching an oncoming vehicle at night?
  choices:
    A: 100 metres
    B: 150 metres
    C: 200 metres
    D: 250 metres
  answer: B
  explanation: Under the NL Highway Traffic Act, you must switch to low beams when
    an oncoming vehicle is within 150 metres to avoid blinding the other driver.
- id: 114
  category: defensive_driving
  question: When following another vehicle from behind at night in NL, at what distance
    should you dim your high beam headlights?
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: You must dim your high beams when following another vehicle within
    60 metres to prevent glare in their rearview mirrors.
- id: 115
  category: defensive_driving
  question: When driving in heavy fog or snow in NL, which light setting should you
    use to ensure maximum visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights, to reduce glare
  answer: B
  explanation: Low beams should be used in fog or snow. High beams reflect off the
    moisture or flakes, creating a 'white wall' effect that reduces visibility.
- id: 116
  category: defensive_driving
  question: In winter conditions in NL, which part of the roadway is likely to freeze
    first and remain icy even after the rest of the road has thawed?
  choices:
    A: Intersections
    B: Steep hills
    C: Bridge decks and overpasses
    D: Gravel shoulders
  answer: C
  explanation: Bridge decks and overpasses freeze first because cold air circulates
    both above and below the road surface.
- id: 117
  category: defensive_driving
  question: If you are blinded by the high beam headlights of an oncoming vehicle
    at night, where should you look to maintain your lane position?
  choices:
    A: Directly at the oncoming lights
    B: At the center line of the road
    C: To the right edge of the roadway
    D: At the vehicle's rear-view mirror
  answer: C
  explanation: To avoid being blinded, look toward the right edge of your lane (the
    white line or the edge of the pavement) to guide your steering.
- id: 118
  category: defensive_driving
  question: 'Before changing lanes, a defensive driver in NL must perform a ''shoulder
    check'' to:'
  choices:
    A: Check the rearview mirror
    B: Check the side-view mirror
    C: Check the blind spots not visible in mirrors
    D: Signal their intention to other drivers
  answer: C
  explanation: A shoulder check (turning your head) is the only way to see vehicles
    located in your blind spots that mirrors cannot capture.
- id: 119
  category: defensive_driving
  question: 'When driving in heavy rain or on slushy roads in NL, the two-second following
    distance should be increased to at least:'
  choices:
    A: Three seconds
    B: Four seconds
    C: Five seconds
    D: Six seconds
  answer: B
  explanation: In poor conditions like heavy rain or slush, the following distance
    should be doubled to at least four seconds to allow for increased stopping distance.
- id: 120
  category: defensive_driving
  question: 'When performing an emergency stop in a vehicle equipped with Anti-lock
    Braking System (ABS) on a slippery NL road, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, continuous pressure to the brake pedal
    C: Apply the parking brake
    D: Shift into neutral and coast
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. The system will automatically
    'pump' the brakes for you to prevent wheel lock-up.
- id: 121
  category: defensive_driving
  question: What is 'black ice' and why is it a significant hazard for NL drivers?
  choices:
    A: Ice mixed with dirt from the road
    B: A thin, transparent layer of ice that looks like a wet road
    C: Ice that only forms on asphalt during the night
    D: Frozen slush found in the center of the lane
  answer: B
  explanation: Black ice is a thin, transparent coating of ice. It is dangerous because
