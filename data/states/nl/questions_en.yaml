- id: 122
  category: defensive_driving
  question: When approaching an intersection, what is the correct scanning sequence
    for a defensive driver?
  choices:
    A: Left, then right
    B: Right, then left
    C: Left, right, and left again
    D: Straight ahead only
  answer: C
  explanation: You should look left, then right, then left again. The first danger
    comes from the left because those vehicles are closer to you.
- id: 123
  category: defensive_driving
  question: Why should you increase your following distance when driving behind a
    large truck or bus on the Trans-Canada Highway?
  choices:
    A: To allow the truck driver to see you in their mirrors
    B: To avoid wind turbulence from the truck
    C: To get a better view of the road ahead
    D: All of the above
  answer: D
  explanation: Increasing following distance behind large vehicles improves your line
    of sight, keeps you out of their blind spots (No-Zones), and reduces the impact
    of wind turbulence.
- id: 124
  category: alcohol_drugs_health
  question: 'In Newfoundland and Labrador, an experienced driver (non-GDL and over
