- id: 235
  category: signs_and_signals
  question: 'When you see an emergency vehicle stopped on the highway with its red
    or blue lights flashing, NL law requires you to:'
  choices:
    A: Maintain your speed and stay in your lane
    B: Stop immediately on the roadway
    C: Slow down and, if safe, move into a non-adjacent lane
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Newfoundland and Labrador's 'Move Over' law requires drivers to slow
