- id: 174
  category: sharing_the_road
  question: In Newfoundland and Labrador, a driver who fails to yield the right-of-way
    to a pedestrian in a crosswalk is subject to how many demerit points?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: Under the NL demerit point system, failing to yield the right-of-way
    to a pedestrian results in 2 demerit points.
- id: 175
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may need to:'
  choices:
    A: Stay close to the right curb
    B: Swing wide to the left before turning right
    C: Stop and wait for all traffic to clear the intersection
    D: Turn from the left-most lane
  answer: B
  explanation: Because of their length, large trucks often need to swing wide to the
    left to clear the curb when making a right turn. Drivers should never try to squeeze
    between the truck and the curb.
- id: 176
  category: sharing_the_road
  question: 'A person carrying a white cane with a red tip is likely:'
  choices:
    A: A road construction worker
    B: A pedestrian who is visually impaired
    C: A police officer in plain clothes
    D: A person lost and looking for help
  answer: B
  explanation: A white cane, often with a red tip, indicates that the pedestrian is
    visually impaired. Drivers must exercise extreme caution and yield the right-of-way.
- id: 177
  category: sharing_the_road
  question: When following a large vehicle at night, you should dim your high-beam
    headlights when you are within what distance of the vehicle?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: In NL, you must switch to low beams when following any vehicle within
    150 meters to avoid blinding the driver through their mirrors.
- id: 178
  category: sharing_the_road
  question: Which of the following is true regarding cyclists in Newfoundland and
    Labrador?
  choices:
    A: They must ride on the sidewalk at all times
    B: They have the same rights and responsibilities as motor vehicle drivers
    C: They are not allowed to use hand signals
    D: They must always ride against the flow of traffic
  answer: B
  explanation: Cyclists are considered vehicles under the Highway Traffic Act and
    have the same rights and duties as drivers of motor vehicles.
- id: 179
  category: sharing_the_road
  question: If you are driving behind a school bus, what is the minimum distance you
    should stop from the rear of the bus when its lights are flashing red?
  choices:
    A: 3 meters
    B: 5 meters
    C: 10 meters
    D: 20 meters
  answer: D
  explanation: In NL, you must stop at least 20 meters away from the rear of a school
    bus when its red lights are flashing to ensure the safety of children boarding
    or exiting.
- id: 180
  category: sharing_the_road
  question: When sharing the road with a motorcycle, why is it often difficult to
    judge their speed and distance?
  choices:
    A: They are required to drive faster than cars
    B: Their smaller size makes them appear further away than they actually are
    C: They do not have brake lights
    D: They are always changing lanes
  answer: B
  explanation: Because motorcycles have a smaller profile, it is harder for other
    drivers to accurately judge how fast they are traveling or how far away they are.
- id: 181
  category: sharing_the_road
  question: According to 'Ellen's Law' in Newfoundland and Labrador, what is the minimum
    distance a motor vehicle must maintain when passing a cyclist?
  choices:
    A: 0.5 metres
    B: 1 metre
    C: 1.5 metres
    D: 2 metres
  answer: B
  explanation: Ellen's Law requires drivers in NL to maintain a minimum distance of
    one metre between their vehicle and a bicycle when passing.
- id: 182
  category: sharing_the_road
  question: When a school bus is stopped on a highway divided by a median strip, which
    drivers are required to stop for the flashing red lights?
  choices:
    A: Drivers in all lanes in both directions
    B: Only drivers approaching from the front
    C: Only drivers following the bus in the same direction
    D: No drivers are required to stop if there is a median
  answer: C
  explanation: On a divided highway where there is a physical median or barrier, only
    traffic following the school bus is required to stop. Traffic traveling in the
    opposite direction on the other side of the median does not need to stop.
- id: 183
  category: sharing_the_road
  question: 'A pedestrian using a white cane with a red tip indicates that they are:'
  choices:
    A: A construction worker
    B: A person with a hearing impairment
    C: A person with a visual impairment
    D: An off-duty police officer
  answer: C
  explanation: A white cane, often with a red tip, is used by individuals who are
    blind or visually impaired. Drivers must exercise extreme caution and yield the
    right-of-way.
- id: 184
  category: sharing_the_road
  question: Under the NL Highway Traffic Act, who has the right-of-way when a pedestrian
    is in a marked or unmarked crosswalk at an intersection?
  choices:
    A: The driver, if they are turning right
    B: The pedestrian
    C: The driver, if they are going straight
    D: Whomever arrived at the intersection first
  answer: B
  explanation: Drivers must yield the right-of-way to pedestrians who are lawfully
    within a crosswalk, whether it is marked or unmarked.
- id: 185
  category: sharing_the_road
  question: When passing a cyclist, if there is not enough room to provide the 1-metre
    distance required by law, what should the driver do?
  choices:
    A: Honk to warn the cyclist to move over
    B: Pass closely but slowly
    C: Wait behind the cyclist until it is safe to pass with the required 1-metre
      clearance
    D: Drive onto the shoulder to pass
  answer: C
  explanation: If a driver cannot safely provide the 1-metre clearance required by
    Ellen's Law, they must wait behind the cyclist until traffic conditions allow
    for a safe pass.
- id: 186
  category: sharing_the_road
  question: What are the 'No-Zones' around a large commercial truck?
  choices:
    A: Areas where the truck is not allowed to drive
    B: The truck's blind spots where the driver cannot see other vehicles
    C: The lanes reserved for emergency vehicles
    D: The area directly in front of the truck only
  answer: B
  explanation: No-Zones are the large blind spots located at the front, back, and
    sides of a truck where the truck driver has limited or no visibility.
- id: 187
  category: sharing_the_road
  question: In Newfoundland and Labrador, when are you permitted to drive beside a
    motorcycle in the same lane?
  choices:
    A: When the lane is wide enough
    B: Never; motorcycles are entitled to the full use of a lane
    C: Only when the motorcycle is traveling slowly
    D: Only during daylight hours
  answer: B
  explanation: Motorcycles are entitled to the full width of a lane. Lane sharing
    or 'lane splitting' is not permitted, and vehicles must not crowd the motorcycle's
    lane.
- id: 188
  category: sharing_the_road
  question: 'Bicycle riders in Newfoundland and Labrador are required by law to:'
  choices:
    A: Ride on the sidewalk at all times
    B: Ride against the flow of traffic
    C: Follow the same rules of the road as motor vehicles
    D: Only ride on designated bike paths
  answer: C
  explanation: Cyclists are considered vehicles under the Highway Traffic Act and
    have the same rights and responsibilities as motorists, including obeying traffic
    signals and signs.
- id: 189
  category: vehicle_information
  question: In Newfoundland and Labrador, what is the minimum legal tread depth for
    tires on a passenger vehicle?
  choices:
    A: 3.0 millimeters
    B: 1.5 millimeters
    C: 0.5 millimeters
    D: 2.5 millimeters
  answer: B
  explanation: According to Newfoundland and Labrador vehicle regulations, tires are
    considered unsafe if the tread depth is less than 1.5 millimeters (approximately
    1/16 of an inch).
- id: 190
  category: vehicle_information
  question: Between which dates are studded tires permitted to be used on vehicles
    in Newfoundland and Labrador?
  choices:
    A: October 1 to April 1
    B: November 1 to April 30
    C: December 1 to March 31
    D: November 15 to May 15
  answer: B
  explanation: In Newfoundland and Labrador, studded tires are legally permitted for
    use from November 1st to April 30th each year. Use outside these dates may result
    in a fine unless an extension is granted due to weather.
- id: 191
  category: vehicle_information
  question: When must a driver in Newfoundland and Labrador turn on their vehicle's
    headlights?
  choices:
    A: Only between sunset and sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From one-half hour after sunset to one-half hour before sunrise, or whenever
      visibility is less than 150 meters
    D: Only when it is raining or snowing
  answer: C
  explanation: The NL Highway Traffic Act requires headlights to be on from a half-hour
    after sunset to a half-hour before sunrise, and at any time when visibility is
    reduced to less than 150 meters.
- id: 192
  category: vehicle_information
  question: Every motor vehicle in Newfoundland and Labrador must be equipped with
    which of the following braking systems?
  choices:
    A: Only a foot brake (service brake)
    B: Only an emergency hand brake
    C: Two separate means of applying brakes, a service brake and a parking brake
    D: An anti-lock braking system (ABS) is the only legal requirement
  answer: C
  explanation: 'The law requires vehicles to have two independent braking systems:
    the service brake (foot brake) and a parking brake capable of holding the vehicle
    on any grade.'
- id: 193
  category: vehicle_information
  question: 'A motor vehicle''s horn must be audible under normal conditions from
    a distance of at least:'
  choices:
    A: 30 meters
    B: 60 meters
    C: 100 meters
    D: 150 meters
  answer: B
  explanation: In Newfoundland and Labrador, a motor vehicle must have a horn in good
    working order that can be heard from a distance of no less than 60 meters.
- id: 194
  category: vehicle_information
  question: What is the requirement for mirrors if the interior rearview mirror is
    obstructed by a load or trailer?
  choices:
    A: No extra mirrors are required if you use a spotter
    B: You must have a mirror on the left side only
    C: You must have mirrors on both the left and right sides of the exterior
    D: You are not allowed to drive if the interior mirror is obstructed
  answer: C
  explanation: If the view from the interior mirror is obstructed, the vehicle must
    be equipped with mirrors on both the left and right exterior sides to provide
    a clear view of the highway to the rear.
- id: 195
  category: vehicle_information
  question: 'A vehicle''s rear license plate must be illuminated by a white light
    so that it is clearly visible from a distance of:'
  choices:
    A: 5 meters
    B: 10 meters
    C: 15 meters
    D: 25 meters
  answer: C
  explanation: The NL Highway Traffic Act specifies that the rear license plate must
    be illuminated by a white light making it visible from 15 meters away.
- id: 196
  category: vehicle_information
  question: In Newfoundland and Labrador, what is the legal requirement for a vehicle's
    exhaust system?
  choices:
    A: It must have a muffler that prevents excessive noise and smoke
    B: Muffler 'cut-outs' are permitted for highway driving
    C: Exhaust can be vented directly out the side of the engine
    D: No muffler is required if the vehicle is over 20 years old
  answer: A
  explanation: Every motor vehicle must be equipped with a muffler in good working
    order to prevent excessive or unusual noise and annoying smoke. Bypass or cut-out
    devices are prohibited.
- id: 197
  category: vehicle_information
  question: When are you required to have a professional mechanical inspection performed
    on a vehicle in NL?
  choices:
    A: Every year for all personal vehicles
    B: Only when the vehicle is involved in a major accident
    C: Upon the transfer of ownership of a used vehicle
    D: Only if the vehicle is more than 10 years old
  answer: C
  explanation: In Newfoundland and Labrador, a vehicle inspection station must issue
    an official inspection certificate before a used vehicle's ownership can be transferred
    to a new owner.
- id: 198
  category: vehicle_information
  question: What color must the front turn signal lights be on a vehicle in Newfoundland
    and Labrador?
  choices:
    A: White or Amber
    B: Red or Amber
    C: Blue or White
    D: Green or Amber
  answer: A
  explanation: According to vehicle equipment standards, front turn signals must be
    white or amber, while rear turn signals must be red or amber.
- id: 199
  category: vehicle_information
  question: If a vehicle is equipped with a windshield, what other equipment is mandatory
    by law?
  choices:
    A: A dash camera
    B: A tinted sun strip
    C: Windshield wipers in good working order
    D: A GPS mounting bracket
  answer: C
  explanation: The Highway Traffic Act requires every motor vehicle equipped with
    a windshield to also have a device for cleaning rain, snow, or other moisture
    from the windshield (wipers) controlled by the driver.
- id: 200
  category: vehicle_information
  question: 'In Newfoundland and Labrador, tail lights must be red and visible from
    a distance of at least:'
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: Tail lights on a motor vehicle must be red and clearly visible from
    a distance of 150 meters to the rear.
- id: 201
  category: vehicle_information
  question: When following another vehicle at night, you must switch your headlights
    from high beam to low beam within what distance?
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: In NL, you must dim your high beams when following another vehicle
    within 60 metres to prevent glare in the lead driver's mirrors.
- id: 202
  category: vehicle_information
  question: According to NL law, when must a vehicle's headlights be turned on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when it is raining or snowing
  answer: C
  explanation: Headlights must be turned on from 30 minutes after sunset to 30 minutes
    before sunrise, and at any other time when visibility is reduced to less than
    150 metres.
- id: 203
  category: vehicle_information
  question: 'Every motor vehicle in Newfoundland and Labrador must be equipped with
    a horn that can be heard from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: The Highway Traffic Act requires a horn in good working order capable
    of emitting sound audible under normal conditions from a distance of not less
    than 60 metres.
- id: 204
  category: vehicle_information
  question: Which of the following is true regarding window tinting on the windshield
    and front side windows in NL?
  choices:
    A: Any level of tint is allowed as long as the driver wears glasses.
    B: Tinting is allowed if it was installed by the manufacturer.
    C: No person shall drive a vehicle with any non-transparent film or tint applied
      to the windshield or front side windows.
    D: Only 50% tint is allowed on the windshield.
  answer: C
  explanation: In Newfoundland and Labrador, it is illegal to apply any aftermarket
    tint or non-transparent material to the windshield or the windows to the direct
    left and right of the driver.
- id: 205
  category: vehicle_information
  question: If a vehicle is towing a trailer that obstructs the view through the interior
    rear-view mirror, what equipment is required?
  choices:
    A: A wide-angle interior mirror
    B: A rearview camera only
    C: Mirrors attached to both the left and right sides of the vehicle
    D: No extra equipment is needed if the trailer is small
  answer: C
  explanation: If the view to the rear is obstructed by a trailer or load, the vehicle
    must be equipped with mirrors on both the left and right sides to provide a clear
    view of the highway to the rear.
- id: 206
  category: vehicle_information
  question: In NL, a motor vehicle's service brake (foot brake) must be capable of
    stopping the vehicle on a dry, level, hard surface within what distance at 30
    km/h?
  choices:
    A: 5 metres
    B: 10 metres
    C: 15 metres
    D: 20 metres
  answer: B
  explanation: Under the NL Highway Traffic Act regulations, the service brake must
    be able to stop the vehicle within 10 metres when traveling at a speed of 30 km/h.
- id: 207
  category: vehicle_information
  question: What color must the light be that illuminates the rear license plate?
  choices:
    A: Red
    B: Blue
    C: White
    D: Yellow
  answer: C
  explanation: The rear license plate must be illuminated by a white light so that
    the plate is clearly visible from a distance of at least 15 metres.
- id: 208
  category: vehicle_information
  question: Who is legally responsible for ensuring a passenger under the age of 16
    is wearing a seatbelt in NL?
  choices:
    A: The passenger
    B: The passenger's parents (even if not in the car)
    C: The driver of the vehicle
    D: The vehicle owner only
  answer: C
  explanation: In Newfoundland and Labrador, the driver is responsible for ensuring
    that all passengers under the age of 16 are properly buckled up.
- id: 209
  category: vehicle_information
  question: 'Every motor vehicle must be equipped with a mirror so located as to reflect
    to the driver a view of the highway for a distance of at least:'
  choices:
    A: 30 metres to the rear
    B: 60 metres to the rear
    C: 100 metres to the rear
    D: 200 metres to the rear
  answer: B
  explanation: The law requires a mirror that provides a view of the highway to the
    rear for at least 60 metres.
- id: 210
  category: vehicle_information
  question: What is the requirement for mudguards (fenders) on vehicles in NL?
  choices:
    A: They are only required for commercial trucks.
    B: They are only required during the winter months.
    C: Every motor vehicle and trailer must be equipped with mudguards or fenders
      to reduce wheel spray.
    D: They are optional for all passenger cars.
  answer: C
  explanation: The Highway Traffic Act requires that all motor vehicles and trailers
    be equipped with mudguards, fenders, or flaps to reduce the spray or splash of
    water and mud to the rear.
- id: 211
  category: signs_and_signals
  question: In Newfoundland and Labrador, what must you do when approaching a flashing
    red traffic light?
  choices:
    A: Slow down and proceed with caution
    B: Stop and wait for the light to turn green
    C: Stop, yield to traffic and pedestrians, and proceed when it is safe
    D: Yield to traffic on the right only
  answer: C
  explanation: 'According to the NL Driver''s Handbook, a flashing red light must
    be treated the same as a stop sign: come to a complete stop and proceed only when
    safe.'
- id: 212
  category: signs_and_signals
  question: What does a flashing amber (yellow) light at an intersection mean in Newfoundland
    and Labrador?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection quickly
    C: The light is about to turn red
    D: Slow down and proceed with caution
  answer: D
  explanation: A flashing amber light indicates that you should reduce speed and be
    extra cautious as you enter or pass through the intersection.
- id: 213
  category: signs_and_signals
  question: When a driver extends their left arm out the window and points it straight
    up, what does this hand signal indicate?
  choices:
    A: A left turn
    B: A right turn
    C: A stop or sudden decrease in speed
    D: The driver is waving to someone
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out and bent upward at the elbow.
- id: 214
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center line mean in
    Newfoundland and Labrador?
  choices:
    A: Passing is permitted if the road is clear
    B: Passing is prohibited
    C: You are in a one-way zone
    D: You must turn left
  answer: B
  explanation: A solid yellow line on your side of the road indicates that it is unsafe
    and illegal to pass other vehicles.
- id: 215
  category: signs_and_signals
  question: When you see a 'Road Work' sign with an orange background, what should
    you expect regarding fines for speeding in that area?
  choices:
    A: Fines are the same as any other road
    B: Fines are halved to encourage traffic flow
    C: Fines are doubled in construction zones
    D: Fines are only applicable if workers are visible
  answer: C
  explanation: Under Newfoundland and Labrador law, fines for speeding are doubled
    when the offense occurs in a designated construction zone.
- id: 216
  category: signs_and_signals
  question: What does a white diamond symbol painted on a lane in Newfoundland and
    Labrador indicate?
  choices:
    A: The lane is for high-speed traffic only
    B: The lane is reserved for specific vehicles like buses or carpools
    C: The lane is ending soon
    D: The lane is for emergency vehicles only
  answer: B
  explanation: The diamond symbol indicates a reserved lane, typically for buses,
    taxis, or high-occupancy vehicles (HOV).
- id: 217
  category: signs_and_signals
  question: If a traffic signal shows a green arrow and a red light simultaneously,
    what are you permitted to do?
  choices:
    A: Stop and wait for the full green light
    B: Proceed in the direction of the arrow only, yielding to pedestrians
    C: Turn in any direction as long as it is safe
    D: The light is broken; treat it as a four-way stop
  answer: B
  explanation: A green arrow with a red light means you may proceed only in the direction
    of the arrow, provided you yield to pedestrians and other traffic already in the
    intersection.
- id: 218
  category: signs_and_signals
  question: What does a downward-pointing hand and arm signal from a driver indicate?
  choices:
    A: A right turn
    B: A left turn
    C: Stopping or slowing down
    D: The driver is pointing at a hazard
  answer: C
  explanation: The hand signal for stopping or slowing down is the left arm extended
    out and downward.
- id: 219
  category: signs_and_signals
  question: In Newfoundland and Labrador, what do double solid yellow lines in the
    center of the highway mean?
  choices:
    A: Passing is permitted in the daytime only
    B: Passing is permitted from either side
    C: Passing is prohibited from either direction
    D: Passing is permitted if there is no oncoming traffic
  answer: C
  explanation: Double solid yellow lines mean that passing is strictly prohibited
    for traffic moving in both directions.
- id: 220
  category: signs_and_signals
  question: What is the meaning of a transit priority signal showing a vertical white
    bar on a black background?
  choices:
    A: All traffic must stop
    B: Only emergency vehicles may proceed
    C: Only transit buses may proceed
    D: The signal is about to turn red
  answer: C
  explanation: A vertical white bar on a black background is a transit priority signal,
    allowing buses to proceed through the intersection while other traffic faces a
    red light.
- id: 221
  category: signs_and_signals
  question: When approaching a railway crossing where the signal lights are flashing,
    what is the minimum distance you must stop from the nearest rail?
  choices:
    A: 2 meters
    B: 5 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: In NL, when a train is approaching, you must stop at least 5 meters
    (15 feet) from the nearest rail.
- id: 222
  category: signs_and_signals
  question: What does a solid white line between two lanes of traffic moving in the
    same direction mean?
  choices:
    A: Lane changing is encouraged
    B: Lane changing is discouraged and should be avoided
    C: The lane is for parking only
    D: You must speed up
  answer: B
  explanation: A solid white line between lanes moving in the same direction indicates
    that lane changes are discouraged due to potential hazards.
- id: 223
  category: signs_and_signals
  question: What is the primary meaning of a yield sign?
  choices:
    A: Stop completely and wait for 3 seconds
    B: Speed up to merge into traffic
    C: Slow down and stop if necessary to give the right-of-way to other traffic
    D: You have the right of way over all other vehicles
  answer: C
  explanation: A yield sign means you must slow down and be prepared to stop to let
    any vehicle or pedestrian in the intersection or on the connecting road pass before
    you proceed.
- id: 224
  category: signs_and_signals
  question: In Newfoundland and Labrador, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn green
    C: Stop and proceed only when it is safe to do so
    D: Stop and wait for a green light
  answer: C
  explanation: 'According to the NL Driver''s Handbook, a flashing red light has the
    same meaning as a stop sign: you must come to a complete stop and proceed only
    when it is safe.'
- id: 225
  category: signs_and_signals
  question: When a driver extends their left arm straight out the window, which signal
    are they making?
  choices:
    A: Right turn
    B: Stop or slow down
    C: Left turn
    D: U-turn
  answer: C
  explanation: The standard hand signal for a left turn is the left arm extended horizontally
    out the window.
- id: 226
  category: signs_and_signals
  question: What does a flashing amber (yellow) traffic light mean?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection
    C: Slow down and proceed with caution
    D: Yield to all pedestrians but not vehicles
  answer: C
  explanation: A flashing amber light is a warning to slow down and be prepared to
    stop, proceeding through the intersection with caution.
- id: 227
  category: signs_and_signals
  question: When approaching a school bus with its red lights flashing and stop arm
    extended, how far back must you stop in Newfoundland and Labrador?
  choices:
    A: 3 meters
    B: 6 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: Drivers must stop at least 6 meters from the front or rear of a school
    bus when its red lights are flashing.
- id: 228
  category: signs_and_signals
  question: In NL, what color are signs used to indicate construction or maintenance
    work ahead?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: Green
  answer: C
  explanation: Temporary condition signs, such as those for construction or road maintenance,
    have an orange background with black symbols or text.
- id: 229
  category: signs_and_signals
  question: 'A solid white line on the right side of the road (the ''fog line'') indicates:'
  choices:
    A: The edge of the traveled portion of the highway
    B: A lane for bicycles only
    C: That you may park on the shoulder
    D: A pedestrian crosswalk
  answer: A
  explanation: Solid white lines at the right edge of the road guide drivers and indicate
    where the roadway ends and the shoulder begins.
- id: 230
  category: signs_and_signals
  question: What does a 'crossbuck' sign (an X-shaped sign) indicate?
  choices:
    A: A four-way intersection
    B: A hospital nearby
    C: A railway crossing
    D: A pedestrian crossing
  answer: C
  explanation: The crossbuck sign is a regulatory sign used to identify the location
    of a railway crossing.
- id: 231
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, how should you signal
    a right turn using hand signals?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: B
  explanation: To signal a right turn, the driver should extend their left arm out
    the window and bend it upward at the elbow.
- id: 232
  category: signs_and_signals
  question: What is the meaning of a green arrow shown with a red traffic light?
  choices:
    A: You must stop and wait for the red light to turn green
    B: You may proceed with caution in the direction of the arrow
    C: The arrow is a warning that the light is about to turn red
    D: Only emergency vehicles may proceed
  answer: B
  explanation: A green arrow with a red light means you may turn in the direction
    of the arrow, yielding to pedestrians and other traffic already in the intersection.
- id: 233
