questions:
- id: 1
  category: driver_responsibility
  question: マニュアルの2024年のデータによると、バージニア州の衝突事故による全死亡者のうち、男性が占める割合は何パーセントですか？
  choices:
    A: 31%
    B: 50%
    C: 71%
    D: 85%
  answer: C
  explanation: マニュアルによると、2024年にバージニア州の衝突事故で死亡した人の71%が男性でした。これは、男性が人口の半分弱であるにもかかわらず高い割合となっています。
- id: 2
  category: safe_driving_rules
  question: 2024年にバージニア州で発生した衝突事故で死亡した乗員のうち、シートベルトを着用していなかった人の割合は何パーセントですか？
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 71%
  answer: C
  explanation: マニュアルによると、2024年に衝突事故で死亡した乗員の50%がシートベルトを着用していませんでした。
- id: 3
  category: alcohol_drugs_health
  question: 未成年の飲酒に対するバージニア州の法的立場は何ですか？
  choices:
    A: BAC（血中アルコール濃度）0.08%の制限が適用される
    B: ゼロ・トレランス法（不寛容政策）である
    C: BAC 0.02%の制限が適用される
    D: 成人が同伴していれば許可される
  answer: B
  explanation: マニュアルには、「バージニア州には未成年の飲酒に対するゼロ・トレランス法（不寛容政策）があることを忘れないでください」と明記されています。
- id: 4
  category: safe_driving_rules
  question: 運転中にテキストメッセージを読んだり送信したりする場合、通常、視線はどのくらいの時間道路から外れますか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: D
  explanation: マニュアルには、テキストを読んだり送信したりする際、視線は5秒間道路から外れると記載されています。
- id: 5
  category: defensive_driving
  question: 時速55マイル（約88km/h）で走行中にテキスト送信のために道路から目を離した場合、実質的に目隠しをした状態でフットボール場の長さ分を移動するのにかかる時間は何秒ですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: D
  explanation: 時速55マイルで走行中、テキストを読んだり送信したりするために5秒間道路から目を離すと、実質的に目隠しをした状態でフットボール場の長さ分を移動するのに十分な時間となります。
- id: 6
  category: safe_driving_rules
  question: 2024年にバージニア州で発生した速度関連の衝突事故による死亡者数は何人ですか？
  choices:
    A: '318'
    B: '410'
    C: '500'
    D: '71'
  answer: B
  explanation: マニュアルによると、2024年にバージニア州では410人が速度関連の衝突事故で亡くなりました。
- id: 7
  category: defensive_driving
  question: 前方の車両との安全な車間距離を判断するために使用すべきルールは何ですか？
  choices:
    A: 車1台分の長さルール
    B: 2秒・3秒・4秒ルール
    C: 5秒ルール
    D: 10フィート・ルール
  answer: B
  explanation: マニュアルでは、前方の車両との車間距離を判断する際、2秒・3秒・4秒ルールを使用することを推奨しています。
- id: 8
  category: driver_testing
  question: バージニア州運転免許マニュアルの試験セクションによると、知識試験（学科試験）の形式はどのようなものですか？
  choices:
    A: 1部構成の試験
    B: 2部構成の試験
    C: 3部構成의 試験
    D: 4部構成の試験
  answer: B
  explanation: マニュアルの目次の第1セクションには、「2部構成の知識試験」と記載されています。
- id: 9
  category: penalties_and_points
  question: マニュアルによると、運転以外の違反のうち、免許停止の原因となる可能性があるのは次のどれですか？
  choices:
    A: 駐車違反切符の未払い
    B: 養育費関連の要件を満たさないこと
    C: 有権者登録を行わないこと
    D: パスポートの更新を行わないこと
  answer: B
  explanation: マニュアルの第5セクションのDMVの要件、停止および取り消しの項目に、「養育費関連の要件を満たさないことによる停止」が記載されています。
- id: 10
  category: safe_driving_rules
  question: バージニア州運転免許マニュアルで「危険な運転行動」として明記されているのは、次のうちどれですか？
  choices:
    A: 車内にペットを乗せて運転すること
    B: 居眠り運転（Drowsy driving）
    C: 大音量で音楽を聴くこと
    D: 運転中に食事をすること
  answer: B
  explanation: マニュアルの第3セクションでは、「危険な運転行動」として、攻撃的な運転、わき見運転、居眠り運転、および飲酒運転が挙げられています。
- id: 11
  category: penalties_and_points
  question: マニュアルに記載されているDMVの要件のうち、免許の停止や取り消しにつながる可能性があるプログラムはどれですか？
  choices:
    A: 車両排出ガスプログラム
    B: 保険監視プログラム (Insurance monitoring program)
    C: ハイウェイ清掃プログラム
    D: 運転者教育プログラム
  answer: B
  explanation: マニュアルの第5章では、「保険監視プログラム」がその他のDMV要件、免許の停止および取り消しの項目に記載されています。
- id: 12
  category: sharing_the_road
  question: バージニア州運転者マニュアルには、次のうちどれと道路を共有するための具体的な指示が含まれていますか？
  choices:
    A: 飛行機
    B: ライトレール（軽快電車）
    C: ホバーボード
    D: 全地形対応車 (ATV)
  answer: B
  explanation: マニュアルの第3章には、「ライトレール」と道路を共有するための具体的なサブセクションが含まれています。
- id: 13
  category: penalties_and_points
  question: バージニア州において、アルコールと法律に特に関連する免許停止の種類は何ですか？
  choices:
    A: 行政上の免許停止 (Administrative License Suspension)
    B: 財務責任不履行による停止
    C: 医療審査による停止
    D: 累積点数による停止
  answer: A
  explanation: マニュアルの第5章では、「アルコールと法律」のセクションに「行政上の免許停止」が記載されています。
- id: 14
  category: driver_testing
  question: マニュアルの第1章によると、試験プロセスにおいて必須とされているスクリーニング（検査）は何ですか？
  choices:
    A: 聴力検査
    B: 反射神経検査
    C: 視力検査 (Vision screening)
    D: 色盲検査
  answer: C
  explanation: マニュアル第1章の目次には、試験プロセスの一部として「視力検査」と「視力基準」が記載されています。
- id: 15
  category: driver_testing
  question: 知識試験の第1部で、第2部に進むためには交通標識に関する問題を何問正解する必要がありますか？
  choices:
    A: 10問中7問
    B: 10問中8問
    C: 10問中9問
    D: 10問すべて
  answer: D
  explanation: 試験の第2部に進む前に、第1部の交通標識に関する10問すべてに正解する必要があります。
- id: 16
  category: driver_testing
  question: 一般知識試験の第2部の最低合格スコアは何パーセントですか？
  choices:
    A: 70パーセント
    B: 75パーセント
    C: 80パーセント
    D: 85パーセント
  answer: C
  explanation: 第2部では、多肢選択式の問題で一般知識がテストされます。合格するには、これらの問題の少なくとも80パーセントに正解する必要があります。
- id: 17
  category: driver_testing
  question: 18歳未満で知識試験に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: 2日間
    B: 5日間
    C: 10日間
    D: 15日間
  answer: D
  explanation: 18歳未満で試験に不合格となった場合、法律により再受験まで丸15日間待機する必要があります。
- id: 18
  category: driver_testing
  question: 知識試験に3回不合格になるとどうなりますか？
  choices:
    A: 永久に免許取得が禁止される。
    B: 再試験まで1年間待たなければならない。
    C: 運転者教育の座学課程を修了し、合格しなければならない。
    D: 再試験のために100ドルの罰金を支払わなければならない。
  answer: C
  explanation: 知識試験に3回不合格になった場合、運転者教育の座学課程を修了し合格するまで、4回目の受験をすることはできません。
- id: 19
  category: vehicle_information
  question: 路上実技試験（road skills test）に使用することが許可されていない車両は次のうちどれですか？
  choices:
    A: ピックアップトラック
    B: 4ドアセダン
    C: オートサイクル (Autocycle)
    D: マニュアル車
  answer: C
  explanation: 路上実技試験には車両を自分で用意する必要がありますが、オートサイクルで受験することはできません。
- id: 20
  category: driver_testing
  question: 18歳以上で運転者教育コースを受講しないことを選択した場合、最初の路上実技試験の前に学習許可証（learner's permit）をどのくらいの期間保持する必要がありますか？
  choices:
    A: 15日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: C
  explanation: 18歳以上の申請者は、最初の路上実技試験の前に学習許可証を60日間保持するか、運転者教育コースを修了する必要があります。
- id: 21
  category: driver_testing
  question: 路上技能試験に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: 2日
    B: 5日
    C: 7日
    D: 15日
  answer: A
  explanation: 路上技能試験に不合格となった場合、再受験するには2日間待つ必要があります。
- id: 22
  category: license_system
  question: 運転免許証の制限事項「C」は何を示していますか？
  choices:
    A: 日中のみの運転に制限されている。
    B: 運転時に眼鏡またはコンタクトレンズを着用しなければならない。
    C: 商用車のみ運転できる。
    D: 免許を保有する成人が同乗していなければならない。
  answer: B
  explanation: 視力検査に合格するために眼鏡やコンタクトレンズの着用が必要な場合は、運転時にもそれらを着用しなければなりません。この制限がある場合、免許証に「C」と表示されます。
- id: 23
  category: license_system
  question: バージニア州における無制限運転免許（unrestricted driver's license）の視力基準は何ですか？
  choices:
    A: 両眼とも20/20の視力と、180度の水平視野。
    B: 片眼または両眼で20/40以上の視力と、110度以上の水平視野。
    C: 片眼で20/70以上の視力と、70度の水平視野。
    D: 両眼とも20/50の視力と、90度の水平視野。
  answer: B
  explanation: 無制限運転免許の基準は、片眼または両眼で20/40以上の視力、および110度以上の水平視野です。
- id: 24
  category: license_system
  question: 日中限定（daylight driving only）の制限付き免許で運転が許可される時間はいつですか？
  choices:
    A: 午前6時から午後6時まで。
    B: 日の出から日没まで。
    C: 日の出の30分後から日没の30分前まで。
    D: 日の出の30分前から日没の30分後まで。
  answer: C
  explanation: 日中限定の制限付き免許では、日の出の30分後に始まり、日没の30分前に終わる時間帯のみ運転が許可されます。
- id: 25
  category: safe_driving_rules
  question: 交通規制（信号や標識）を避けるために、駐車場や野原を通り抜けることは合法ですか？
  choices:
    A: はい、交差点が事故で塞がっている場合は合法です。
    B: はい、商用車を運転している場合は合法です。
    C: いいえ、このように交通規制を避けることは違法です。
    D: いいえ、右折する場合を除き違法です。
  answer: C
  explanation: 駐車場や野原を通り抜けて交通規制を避けることは違法です。
- id: 26
  category: signs_and_signals
  question: 赤信号での右折が許可されないのはどのような時ですか？
  choices:
    A: 「No Turn on Red（赤信号での右折禁止）」の標識があるか、右向きの赤色の矢印が表示されている時。
    B: 一方通行の道路から別の一方通行の道路へ曲がる時。
    C: 横断歩道に歩行者がいない時。
    D: マニュアル車を運転している時。
  answer: A
  explanation: 交差点に「No Turn on Red」という標識がある場合、または右向きの赤色の矢印が表示されている場合は、赤信号で右折することはできません。
- id: 27
  category: signs_and_signals
  question: 赤信号での左折が許可されるのはどのような条件の時ですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ曲がる時。
    B: 一方通行の道路から別の一方通行の道路へ曲がる時。
    C: 対面通行の道路から別の対面通行の道路へ曲がる時。
    D: 赤信号での左折は決して許可されない。
  answer: B
  explanation: 一方通行の道路にいて、信号が赤の時に別の一方通行の道路へ左折する場合は、赤信号でも左折することができます。
- id: 28
  category: signs_and_signals
  question: 信号が赤であるにもかかわらず、警察官から交差点を通過するように指示された場合、どうすべきですか？
  choices:
    A: 停止して、信号が青に変わるのを待つ。
    B: 警察官の指示に従う。
    C: 進む前にクラクションを鳴らして他のドライバーに警告する。
    D: 車を路肩に寄せて、警察官が立ち去るのを待つ。
  answer: B
  explanation: 警察官の指示がある場合を除き、すべての標識や信号に従ってください。警察官の指示がある場合は、常にその指示に従ってください。
- id: 29
  category: driver_testing
  question: DMVでの路上技能試験に3回不合格となった場合、何が必要ですか？
  choices:
    A: 再受験まで60日間待たなければならない。
    B: 2部構成の知識試験を再受験しなければならない。
    C: 運転教育（ドライバー・エデュケーション）の実技講習を修了し、合格しなければならない。
    D: 50ドルの罰金を支払わなければならない。
  answer: C
  explanation: DMVでの路上技能試験に3回不合格となった場合、DMVまたは教育局が承認した運転教習所で運転教育の実技講習を修了し、合格するまで、4回目の試験を受けることはできません。
- id: 30
  category: signs_and_signals
  question: バージニア州において、赤信号で左折ができるのはどのような条件の時ですか？
  choices:
    A: 交差点に対向車がいない時はいつでも。
    B: 一時停止した後、一方通行の道路から別の一方通行の道路へ曲がる時。
    C: 対面通行の道路から一方通行の道路へ曲がる時。
    D: いかなる状況においても、赤信号での左折は決して許可されない。
  answer: B
  explanation: 一方通行の道路から別の一方通行の道路へ左折する場合、信号が赤であっても、まず完全に停止すれば左折することができます。
- id: 31
  category: signs_and_signals
  question: 赤色の矢印信号は何を意味しますか？
  choices:
    A: 歩行者に道を譲った後、矢印の方向に進むことができる。
    B: 必ず停止しなければならず、標識で許可されていない限り、矢印の方向に進むことはできない。
    C: 完全に停止した後であれば、矢印の方向に曲がることができる。
    D: 信号がまもなく青に変わるため、加速の準備をする。
  answer: B
  explanation: 赤色の矢印は、その矢印の方向に進もうとする場合は停止しなければならないことを意味します。「停止後、赤色の矢印でも右折可（Right on
    Red Arrow After Stop）」または「停止後、赤色の矢印でも左折可（Left on Red Arrow After Stop）」という標識がない限り、進むことはできません。
- id: 32
  category: safe_driving_rules
  question: 停電のために交通信号機が作動していない交差点に差し掛かった場合、どのように進むべきですか？
  choices:
    A: 右側の車両に道を譲り、停止せずに進む。
    B: 減速し、完全に停止することなく注意して進む。
    C: 停止し、その交差点を全方向一時停止（all-way stop）の交差点であるかのように進む。
    D: 警察官が到着するまで交差点で待機する。
  answer: C
  explanation: 停電やその他の問題で交通信号機が作動しておらず、灯火が表示されていない場合は、停止する必要があります。その後、その交差点を全方向一時停止（all-way
    stop）の交差点として扱って進んでください。
- id: 33
  category: signs_and_signals
  question: 黄色の「X」または黄色の斜め下向き矢印の車線利用信号は何を示していますか？
  choices:
    A: 安全が確認でき次第、速やかにその車線から出なければならない。
    B: 掲示された制限速度でその車線を走行することが許可されている。
    C: その車線内で完全に停止しなければならない。
    D: その車線は左折専用としてのみ使用できる。
  answer: A
  explanation: 黄色の「X」または黄色の斜め下向き矢印は、安全が確認でき次第、速やかにその車線から移動すべきであることを意味します。
- id: 34
  category: signs_and_signals
  question: 歩行者ハイブリッドビーコン（PHB）が赤色の交互点滅を表示しているとき、運転者はどうすべきですか？
  choices:
    A: 信号がまもなく赤の点灯に変わるため、停止の準備をする。
    B: 横断歩道に歩行者がいなければ、注意して進む。
    C: 停止し、信号が青に変わるまでいつまでも待つ。
    D: 交差点を素早く通過するために加速する。
  answer: B
  explanation: 歩行者用の歩行信号がカウントダウンしている間、PHBの2つの赤色灯が交互に点滅します。これは、横断歩道に歩行者がいなくなれば、注意して進んでもよいことを運転者に伝えています。
- id: 35
  category: signs_and_signals
  question: ピンク色と黒色の交通標識はどのような情報を伝えていますか？
  choices:
    A: 工事区域。
    B: ドライバー向けサービス（休憩所など）。
    C: 歴史的または文化的関心事。
    D: 事故や緊急事態が発生している区域（インシデント・エリア）。
  answer: D
  explanation: ピンク色と黒色の標識は、事故や緊急事態が発生している区域において、助言や警告を与えるために使用されます。
- id: 36
  category: signs_and_signals
  question: 五角形の交通標識は何を示していますか？
  choices:
    A: 止まれ（一時停止）。
    B: 譲れ。
    C: スクールゾーンおよび学校付近の横断歩道。
    D: 前方にある特別な状況や危険。
  answer: C
  explanation: 五角形の形状はスクールゾーンを示し、学校付近の横断歩道について警告します。
- id: 37
  category: signs_and_signals
  question: ひし形の交通標識の意味は何ですか？
  choices:
    A: 指示を与えたり、法律を伝えたりする。
    B: 前方にある特別な状況や危険を警告する。
    C: 追い越し禁止区間の始まりを示す。
    D: 前方に踏切があることを示す。
  answer: B
  explanation: ひし形の標識は、前方にある特別な状況や危険を警告します。減速し、注意して運転する必要があります。
- id: 38
  category: safe_driving_rules
  question: 制限速度の標識と天候状態に関して、正しいものはどれですか？
  choices:
    A: 天候に関わらず、掲示された制限速度で走行していれば違反切符を切られることはない。
    B: 掲示された制限速度は、雨、雪、または凍結時のみ適用される。
    C: 掲示された制限速度以下で走行していても、状況に対して速すぎる場合は違反切符を切られることがある。
    D: 雨が降ると制限速度は自動的に時速10マイル下がる。
  answer: C
  explanation: 雨、雪、凍結時には、掲示された制限速度以下で走行していても、その時の状況に対して速度が速すぎると判断されれば、違反切符を切られることがあります。
- id: 39
  category: safe_driving_rules
  question: バージニア州では、「左折禁止（No Left Turn）」の標識がある交差点でUターンは許可されていますか？
  choices:
    A: はい。「Uターン禁止」の標識も併せて設置されていない限り許可される。
    B: はい。ただし、交差点に全く車両がいない場合に限る。
    C: いいえ。Uターンは2回の左折とみなされるため、「左折禁止」の標識がある場所では違法となる。
    D: いいえ。バージニア州のすべての交差点でUターンは違法である。
  answer: C
  explanation: バージニア州では、Uターンは2回の左折とみなされます。そのため、「左折禁止」の標識が掲示されている場所でのUターンは違法です。
- id: 40
  category: signs_and_signals
  question: 黄色の点滅信号は何を意味しますか？
  choices:
    A: 完全に停止し、対向車に道を譲る。
    B: 減速し、注意して進む。
    C: 信号機が故障している。
    D: 矢印の方向に進もうとする場合は停止する。
  answer: B
  explanation: 黄色の点滅信号は、減速して注意深く進むことを意味します。黄色の点滅信号は、通常よりも危険度が高い場所に設置されています。
- id: 41
  category: signs_and_signals
  question: 茶色と白の交通標識の目的は何ですか？
  choices:
    A: 目的地に関する情報を提供するため。
    B: ドライバー向けのサービスについて知らせるため。
    C: その地域の歴史的または文化的な名所を案内するため。
    D: 工事中であることを警告するため。
  answer: C
  explanation: 茶色の標識は、その地域にある歴史的または文化的な名所を案内するために使用されます。
- id: 42
  category: signs_and_signals
  question: 交差点に近づいた際、信号が黄色の点灯に変わり、まだ交差点内に入っていない場合、どうすべきですか？
  choices:
    A: 赤に変わる前に通過できるよう加速する。
    B: 安全に停止できない場合を除き、停止する。
    C: 現在の速度のまま交差点を通過する。
    D: 路肩に車を寄せて停車する。
  answer: B
  explanation: 黄色の信号は、信号がもうすぐ変わることを示す注意喚起です。まだ交差点に入っていない場合は停止してください。ただし、安全に停止できない場合は、注意して通過してください。
- id: 43
  category: sharing_the_road
  question: 歩行者が交差点内にいるときに、信号が赤から黄色の矢印の点滅に変わった場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして、歩行者に素早く動くよう促す。
    B: 優先権があるため、すぐに右左折する。
    C: 右左折する前に、歩行者が通り過ぎるのを待つ。
    D: 交差点を空けるため、歩行者の周りをゆっくりと走行する。
  answer: C
  explanation: 歩行者が交差点内にいるときに信号が赤から黄色の矢印の点滅に変わった場合は、右左折する前に歩行者が道を渡りきるのを待ってください。
- id: 44
  category: safe_driving_rules
  question: 4方向一時停止（4-Way stop）の交差点に他の車両と同時に到着した場合、どちらが譲らなければなりませんか？
  choices:
    A: 右側のドライバーが左側のドライバーに譲らなければならない。
    B: 左側のドライバーが右側のドライバーに譲らなければならない。
    C: 直進するドライバーが右左折するドライバーに譲らなければならない。
    D: 大型車両のドライバーに優先権がある。
  answer: B
  explanation: 「全方向（All Way）」または「4方向（4 Way）」一時停止の交差点に他の車両と同時に到着した場合、左側のドライバーは右側のドライバーに道を譲らなければなりません。
- id: 45
  category: signs_and_signals
  question: 推奨速度（Advisory Speed）標識は何を示していますか？
  choices:
    A: 高速道路の最低速度制限。
    B: 高速道路の出口における安全な最大速度。
    C: 学校周辺（スクールゾーン）の速度制限。
    D: 追い越し時の推奨速度。
  answer: B
  explanation: マニュアルによると、推奨速度標識は高速道路の出口における安全な最大速度を示しています。
- id: 46
  category: sharing_the_road
  question: 州法では、馬車を追い越す際にどの程度の距離を空けることが義務付けられていますか？
  choices:
    A: 少なくとも2フィート
    B: 少なくとも3フィート
    C: 少なくとも4フィート
    D: 少なくとも5フィート
  answer: B
  explanation: 州法では、道が開けている場合に馬車を追い越す際、少なくとも3フィートの間隔を空けることがドライバーに義務付けられています。
- id: 47
  category: safe_driving_rules
  question: 「濡れているとき滑りやすい（Slippery When Wet）」の標識がある道路を走行中、路面が濡れている場合はどうすべきですか？
  choices:
    A: 急ブレーキをかけて、タイヤのグリップ力を確認する。
    B: 前の車との車間距離を詰める。
    C: 前の車との車間距離を広げる。
    D: 通常の速度を維持し、頻繁に車線変更を行う。
  answer: C
  explanation: 路面が濡れている場合、マニュアルでは速度を落とし、急ブレーキや急な進路変更を避け、前の車との車間距離を広げるよう定めています。
- id: 48
  category: signs_and_signals
  question: ラウンドアバウト（環状交差点）に近づく際の正しい手順は何ですか？
  choices:
    A: 譲らずに進入し、時計回りに走行する。
    B: すでに環状交差点内にいる車両に譲り、反時計回りに走行する。
    C: 完全に停止し、青信号を待つ。
    D: 環状交差点に進入しようとしている車両に譲り、時計回りに走行する。
  answer: B
  explanation: ラウンドアバウトでは、進入する車両はすでに環状交差点内にいる車両に優先権を譲り、反時計回りに走行しなければなりません。
- id: 49
  category: defensive_driving
  question: 踏切内で車が動かなくなった（エンストした）場合、どうすべきですか？
  choices:
    A: 車内にとどまり、911に通報する。
    B: 車から降りて、列車が進んでくる方向と同じ方向に走る。
    C: 自力で車を線路から押し出そうとする。
    D: すぐに車から降りて、線路から離れるように、かつ向かってくる列車の方へ斜めに走る。
  answer: D
  explanation: 線路上で車が動かなくなった場合、マニュアルではすぐに車から降りて、線路から離れるように、かつ向かってくる列車の方へ斜めに走るよう指示しています。
- id: 50
  category: penalties_and_points
  question: 高速道路の工事区間（ワークゾーン）で手持ちの通信機器を使用したことにより有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 100ドルの罰金
    B: 250ドルの罰金
    C: 500ドルの罰金
    D: 30日間の免許停止
  answer: B
  explanation: 高速道路の工事区間で手持ちの通信機器を使用したことにより有罪判決を受けた場合、250ドルの罰金が科せられます。
- id: 51
  category: penalties_and_points
  question: 高速道路の工事区間（work zone）で速度制限を超過した場合の最大罰金額はいくらですか？
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: 高速道路の工事区間での速度制限超過で有罪判決を受けた場合、最大500ドルの罰金が科せられることがあります。
- id: 52
  category: signs_and_signals
  question: 「追い越し禁止区間（No Passing Zone）」の標識は何を意味していますか？
  choices:
    A: 道が開けていれば、車を追い越してもよい。
    B: 道が開けていたとしても、自分の車線内の前走車を追い越してはいけない。
    C: 商用車のみ追い越しが禁止されている。
    D: 前走車が制限速度以下で走行している場合に限り、追い越してもよい。
  answer: B
  explanation: 「追い越し禁止区間」の標識は、前方の道が開けていたとしても、自分の車線内の前走車を追い越してはいけない区間の始まりを示しています。
- id: 53
  category: sharing_the_road
  question: 信号が点滅していない場合でも、踏切で常に停止しなければならない車両はどれですか？
  choices:
    A: 乗用車
    B: オートバイ
    C: スクールバス
    D: 配送トラック
  answer: C
  explanation: マニュアルには、スクールバスは信号が点滅していない場合でも、常に踏切で停止しなければならないと記されています。
- id: 54
  category: safe_driving_rules
  question: バリケードやコーンなどの交通規制装置がある工事区間を走行する際、どのようにすべきですか？
  choices:
    A: 車線の中央を維持し、完全に通過するまで車線変更をしない。
    B: 他の車両に道を譲るため、規制装置にできるだけ近づいて走行する。
    C: 規制装置を避けるために頻繁に車線変更を行う。
    D: 工事区間を早く抜けるために速度を上げる。
  answer: A
  explanation: 工事区間の交通規制装置の近くを走行する際は、車線の中央を走り、制限速度を守り、工事区間を完全に抜けるまで車線変更を控えてください。
- id: 55
  category: signs_and_signals
  question: 工事区間（work zone）を示し、減速と注意を促す標識の色は何色ですか？
  choices:
    A: 赤
    B: 黄色
    C: オレンジ色
    D: 緑
  answer: C
  explanation: オレンジ色は工事区間を示しており、減速して注意を払う必要があることを意味します。
- id: 56
  category: sharing_the_road
  question: 「路面の継ぎ目（Open Joints）」の標識が、オートバイの運転者にとって特に重要なのはなぜですか？
  choices:
    A: 指定されたオートバイ専用駐車場があることを示しているため。
    B: 継ぎ目によってオートバイの制御を失う可能性があるため。
    C: オートバイ専用車線であることを示しているため。
    D: オートバイにのみ影響する強風を警告しているため。
  answer: B
  explanation: 橋やランプにある路面の継ぎ目は、オートバイの制御を失わせる原因となる可能性があるため、マニュアルでは減速するよう警告しています。
- id: 57
  category: safe_driving_rules
  question: 同じ方向に進む2つの車線が1つに合流（Merge）する場合、安全に合流する責任は誰にありますか？
  choices:
    A: 右車線の運転者のみ。
    B: 左車線の運転者のみ。
    C: 両方の車線の運転者に安全に合流する責任がある。
    D: より大きな車両の運転者。
  answer: C
  explanation: 2つの車線が1つになる合流地点では、両方の車線の運転者が安全に合流する責任を負います。
- id: 58
  category: signs_and_signals
  question: 「低床車両注意踏切（Low Ground Railroad Crossing）」の標識は、運転者に何を警告していますか？
  choices:
    A: 線路が現在工事中であること。
    B: このエリアでは列車が低速で走行すること。
    C: 急勾配のため、車高の低い車両の底が線路に引っかかったり、引きずったりする可能性があること。
    D: 車高の低い車両のみが通行を許可されていること。
  answer: C
  explanation: この標識は、道路と交差する線路部分に急な勾配があり、車高の低い車両の底部が線路に接触したり、動けなくなったりする恐れがあることを警告しています。
- id: 59
  category: safe_driving_rules
  question: 工事区間を抜ける際、どのようにすべきですか？
  choices:
    A: 通常の交通の流れに戻るため、すぐに加速する。
    B: 工事車両を避けるために車線変更をする。
    C: 完全に通過するまで、車線を維持し速度を保つ。
    D: 停車して、車両に破片による損傷がないか確認する。
  answer: C
  explanation: 工事区間を離れる際は、車線を維持し、速度を保ちます。工事区間を完全に抜けるまで、車線変更はしないでください。
- id: 60
  category: signs_and_signals
  question: 「低速車両（slow-moving vehicle）」の標識を掲示している車両の最大速度はどれくらいですか？
  choices:
    A: 15 MPH
    B: 25 MPH
    C: 35 MPH
    D: 45 MPH
  answer: B
  explanation: 農耕器具、馬車、道路作業車など、時速25マイル（25 MPH）以下で走行する低速車両は、公道を走行する際にこの標識を掲示しなければなりません。
- id: 61
  category: signs_and_signals
  question: 路面の赤色の反射板は何を示していますか？
  choices:
    A: 近くに消火栓がある。
    B: 4方向の一時停止交差点に近づいている。
    C: 逆方向に進んでおり、進入してはならない。
    D: この先に学校区域がある。
  answer: C
  explanation: 路面の赤色の反射板は、進入禁止または使用禁止の区域を示しています。これらは、逆走している車両からのみ見えるように路面に設置されています。
- id: 62
  category: safe_driving_rules
  question: 道路中央の2本の黄色い実線を越えてもよいのはどのような時ですか？
  choices:
    A: 低速で走行するトラクターを追い越す時。
    B: 左折する時、または歩行者や自転車を追い越す時。
    C: 前方の車両が制限速度以下で走行している時。
    D: 黄色い実線を越えることは決して許されない。
  answer: B
  explanation: どちらの方向からも追い越しは禁止されています。対向車線に車がいない状態で、左折する場合、または歩行者、自転車、スクーターやスケートボードの利用者を追い越す場合を除き、線を越えることはできません。
- id: 63
  category: signs_and_signals
  question: 間隔の狭い小さな長方形で構成される点線の白線の目的は何ですか？
  choices:
    A: 横断歩道を示すため。
    B: 交差点やインターチェンジでの車線割り当てを示すため。
    C: 路面の右端をマークするため。
    D: 反対方向に進む交通を分けるため。
  answer: B
  explanation: 点線の白線は、実際には一連の小さな長方形です。これらは、車線から逸脱しやすい交差点やインターチェンジにおいて、車線の割り当てを示すために使用されます。
- id: 64
  category: safe_driving_rules
  question: 3車線の道路で、中央車線の両側が黄色い実線と黄色い破線でマークされている場合、この車線を最大でどのくらいの距離走行できますか？
  choices:
    A: 50フィートまで。
    B: 100フィートまで。
    C: 150フィートまで。
    D: 200フィートまで。
  answer: C
  explanation: 中央車線の両側が黄色い実線と黄色い破線でマークされている場合、どちらの方向に進む運転者も左折のためにその車線を使用できます。ただし、この車線を150フィート以上走行することはできません。
- id: 65
  category: sharing_the_road
  question: 共有車線マーク（シャロウ/sharrow）は何を示していますか？
  choices:
    A: その車線は自転車専用である。
    B: その車線は自動車と自転車が並んで走るには狭すぎる。
    C: 自転車は常に自動車に道を譲らなければならない。
    D: 自動車はその車線への進入を禁止されている。
  answer: B
  explanation: 共有車線マーク（シャロウ/sharrow）は、自動車と自転車が並んで走行するには道幅が狭すぎる走行車線で使用されます。
- id: 66
  category: sharing_the_road
  question: 自転車ボックス（bicycle box）が描かれた交差点で赤信号に遭遇した場合、どこで停止しなければなりませんか？
  choices:
    A: 自転車ボックスの中で。
    B: すべての自転車ボックスの手前で。
    C: 自転車ボックスを越えた交差点内で。
    D: 右折する場合は停止する必要はない。
  answer: B
  explanation: 運転者は赤信号の場合、自転車ボックスの中ではなく、すべての自転車ボックスの手前で停止しなければなりません。
- id: 67
  category: sharing_the_road
  question: 自転車ボックスがある交差点で、赤信号での右折は許可されていますか？
  choices:
    A: はい、最初に自転車に道を譲るなら許可される。
    B: はい、ただし自転車ボックスが緑色に塗られている場合のみ。
    C: いいえ、これらの交差点では赤信号での右折は許可されていない。
    D: いいえ、高占有車両を運転している場合を除き許可されない。
  answer: C
  explanation: 自転車ボックスのある交差点では、赤信号での右折は許可されていません。
- id: 68
  category: safe_driving_rules
  question: 交通渋滞時に、高占有車両（HOV）車線の使用が一般的に許可されているのは次のうちどれですか？
  choices:
    A: 時速65マイル以上で走行しているすべての車両。
    B: 商業用貨物トラック。
    C: オートバイ。
    D: トレーラーを牽引している車両。
  answer: C
  explanation: 交通渋滞時、HOV車線はバス、バンプール、相乗り車両（カープール）、その他の高占有車両、オートバイ、および特定のクリーン特別燃料車両のために予約されています。
- id: 69
  category: safe_driving_rules
  question: トランスポンダー（車載器）を持たずに誤って高速E-ZPass料金所に進入してしまった場合、どうすべきですか？
  choices:
    A: すぐに停止してバックする。
    B: 路肩に寄せて料金所の係員を待つ。
    C: 停止してカメラのところで現金で支払う。
    D: 停止してはいけない。登録済みの所有者に通行料金が請求される。
  answer: D
  explanation: 誤ってそれらの車線に進入してしまった場合、停止してはいけません。停止することは危険であり、追突事故の原因となる可能性があります。カメラが車のナンバープレートを撮影し、登録された車両所有者に通行料金が請求されます。
- id: 70
  category: signs_and_signals
  question: 黄色く塗られた縁石は何を意味しますか？
  choices:
    A: 乗客の乗り降りのために必要な時間だけ停車できる。
    B: 荷物の積み降ろしのための時間だけ停車でき、車から離れてはならない。
    C: 停車、停車待機、駐車は禁止されている。
    D: 30分までの駐車が許可されている。
  answer: B
  explanation: 黄色 — 荷物の積み降ろしに必要な時間だけ停車してください。車から離れないでください。
- id: 71
  category: safe_driving_rules
  question: 工事区域の手前で、走行車線を横切るように設置されているランブルストリップ（rumble strips）には、ドライバーはどのように対処すべきですか？
  choices:
    A: タイヤの損傷を避けるため、ハンドルを切って避ける。
    B: 素早く通過するために加速する。
    C: ハンドルを切って避けたりせず、その上をゆっくりと走行する。
    D: 通過する直前に直ちに停止する。
  answer: C
  explanation: ランブルストリップは、ハンドルを切って避けるのではなく、ゆっくりと走行して通過する必要があります。
- id: 72
  category: signs_and_signals
  question: 二重の実線の白線を越える際のルールは何ですか？
  choices:
    A: 車線変更のために注意して越えてもよい。
    B: 低速車両を追い越す場合に限り、越えてもよい。
    C: これらの線を越えてはならない。
    D: Uターンのために越えてもよい。
  answer: C
  explanation: 二重の実線の白線は、同じ方向に進む車線を区分しています。これらの線を越えて走行することは禁止されています。
- id: 73
  category: signs_and_signals
  question: 道路を横切って設置される「譲れライン（yield line）」には、どのような形状が使われますか？
  choices:
    A: 正方形
    B: 円形
    C: 三角形
    D: ひし形
  answer: C
  explanation: 譲れライン（yield line）は、道路を横切って並ぶ三角形の列で、「譲れ（yield）」の標識とともに使用され、譲歩または停止すべき地点を示します。
- id: 74
  category: safe_driving_rules
  question: ハンドルを握る際の推奨される手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置
    C: 8時と4時の位置
    D: 7時と5時の位置
  answer: C
  explanation: マニュアルによると、ハンドルを時計に見立てた場合、両手は8時と4時の位置にあるべきだとされています。
- id: 75
  category: penalties_and_points
  question: バージニア州法において、どのような運転をした場合に無謀運転（reckless driving）で起訴される可能性がありますか？
  choices:
    A: 制限速度を時速10マイル以上上回って走行した場合。
    B: 制限速度を時速15マイル以上上回って走行した場合。
    C: 制限速度を時速20マイル以上上回る、または時速85マイル（MPH）を超えて走行した場合。
    D: いかなるハイウェイでも時速75マイルを超えて走行した場合。
  answer: C
  explanation: バージニア州法によれば、制限速度を時速20マイル（MPH）以上上回る、または時速85マイル（MPH）を超える速度で走行している場合、法執行官によって無謀運転（reckless
    driving）で起訴される可能性があります。
- id: 76
  category: safe_driving_rules
  question: 特に標識がない限り、未舗装路における乗用車の最高速度制限はいくらですか？
  choices:
    A: 時速25マイル（MPH）
    B: 時速35マイル（MPH）
    C: 時速45マイル（MPH）
    D: 時速55マイル（MPH）
  answer: B
  explanation: 速度制限の標識で別途定められていない限り、未舗装路における乗用車およびオートバイの最高速度制限は時速35マイル（MPH）です。
- id: 77
  category: safe_driving_rules
  question: バージニア州におけるレーダー探知機（radar detectors）に関する記述のうち、正しいものはどれですか？
  choices:
    A: 州間高速道路（インターステート）でのみ合法である。
    B: 乗用車では合法だが、商用車では違法である。
    C: バージニア州でレーダー探知機を使用することは違法である。
    D: 制限速度以下で走行している場合に限り許可される。
  answer: C
  explanation: マニュアルには、「バージニア州でレーダー探知機を使用することは違法である」と明記されています。
- id: 78
  category: penalties_and_points
  question: 法執行官の停止信号に従わず、追跡された結果、直接的な原因で法執行官が死亡した場合、どのような罰則が科されますか？
  choices:
    A: 第1級軽罪（Class 1 misdemeanor）
    B: 第4級重罪（Class 4 felony）
    C: 500ドルの罰金と免許停止
    D: 交通違反（traffic infraction）
  answer: B
  explanation: 法執行官の停止信号に従わず、追跡の結果として法執行官が死亡した場合、第4級重罪（Class 4 felony）に問われます。
- id: 79
  category: sharing_the_road
  question: 赤色の点滅灯を点けて停車しているスクールバスに対して、停止する必要がないのはどのような時ですか？
  choices:
    A: 多車線道路で同じ方向に走行している時。
    B: 中央分離帯や障壁で道路が仕切られており、反対方向を走行している時。
    C: 私道や学校のドライブウェイにいる時。
    D: バスが乗客を乗せているが、停止サイン（ストップアーム）が出ていない時。
  answer: B
  explanation: 中央分離帯や障壁で道路が仕切られている道路において、反対方向を走行しており、バスが反対側に停車している場合は、停止する必要はありません。
- id: 80
  category: safe_driving_rules
  question: 「反応距離（reaction distance）」の説明として正しいものはどれですか？
  choices:
    A: 危険を認識するまでにかかる時間。
    B: 問題を認識してからブレーキを踏むまでの間に車両が走行する距離。
    C: ブレーキを踏んだ後に車が走行する距離。
    D: 時速60マイルから車両が停止するまでに必要な総距離。
  answer: B
  explanation: 反応距離（reaction distance）とは、問題を認識してからブレーキを踏むまでの間に車両が走行する距離と定義されています。
- id: 81
  category: safe_driving_rules
  question: 濡れた路面は車両の停止距離にどのような影響を与えますか？
  choices:
    A: 制動距離が2倍になる可能性があります。
    B: 知覚時間が短縮されます。
    C: 反応距離が短くなります。
    D: アンチロックブレーキ（ABS）を装備していれば影響はありません。
  answer: A
  explanation: マニュアルには、路面の状態が制動距離に影響を与えると記載されており、例えば、濡れた路面では制動距離が2倍になる可能性があります。
- id: 82
  category: vehicle_information
  question: アンチロックブレーキ（ABS）を装備している車両を運転する際、どのようなことに注意すべきですか？
  choices:
    A: 滑りやすい路面で停止するときは、ブレーキを軽くポンピングしてください。
    B: アンチロックブレーキを絶対にポンピングしてはいけません。
    C: 同時にパーキングブレーキをかけてください。
    D: 雨天時はシステムをオフにしてください。
  answer: B
  explanation: マニュアルでは、ドライバーに対して「アンチロックブレーキを絶対にポンピングしないこと」と明示的に警告しています。
- id: 83
  category: sharing_the_road
  question: 4車線未満のハイウェイで停車中のゴミ収集車を追い越す際、車線変更ができない場合はどうしなければなりませんか？
  choices:
    A: 停車し、その車両が移動するのを待ちます。
    B: クラクションを鳴らし、速度を維持します。
    C: 掲示されている制限速度より時速10マイル減速し、左側を少なくとも2フィート離れて通過します。
    D: できるだけ早く車両を追い越すために加速します。
  answer: C
  explanation: 4車線未満のハイウェイである場合、または車線変更ができない場合は、掲示されている制限速度より時速10マイル減速し、車両の左側を少なくとも2フィート離れて通過してください。
- id: 84
  category: safe_driving_rules
  question: 赤色灯を点滅させている緊急車両の後方を走行する場合、維持しなければならない最小の車間距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: マニュアルには次のように記載されています。「赤色灯を点滅させている緊急車両の後方を、500フィート以内の距離で追従してはいけません。」
- id: 85
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に進入した後、ドライバーはどの方向に進まなければなりませんか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 中央島を直進
    D: 出口までの最短方向
  answer: B
  explanation: ラウンドアバウトに進入した後、ドライバーは反時計回りに走行しなければなりません。
- id: 86
  category: safe_driving_rules
  question: 標識や信号機のない交差点に、異なる方向から2台の車両が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側のドライバーは、右側のドライバーを先に通行させなければなりません。
    B: 右側のドライバーは、左側のドライバーを先に通行させなければなりません。
    C: より速い速度で走行している車両が先に通行します。
    D: 左折する車両が先に通行します。
  answer: A
  explanation: 標識や信号機のない交差点に、異なる方向から車両が同時に到着した場合、左側のドライバーは右側のドライバーを先に通行させなければなりません。
- id: 87
  category: signs_and_signals
  question: 交差点の交通信号機が作動していない場合、どうしなければなりませんか？
  choices:
    A: 道が空いていれば、停止せずに交差点を通過します。
    B: 交差点を「譲れ（Yield）」の標識があるものとして扱います。
    C: すべての車両が停止しなければならず、左側のドライバーは右側のドライバーに道を譲らなければなりません。
    D: 右側のドライバーは左側のドライバーに道を譲らなければなりません。
  answer: C
  explanation: 交差点の交通信号機が作動していない場合、その交差点に進入するすべての車両は停止しなければなりません。左側のドライバーは右側のドライバーに道を譲る必要があります。
- id: 88
  category: safe_driving_rules
  question: 私道やドライブウェイから車道に入る際、どうしなければなりませんか？
  choices:
    A: 素早く加速して交通の流れに合流します。
    B: 停止し、すべての車両と歩行者に道を譲ります。
    C: クラクションを鳴らし、停止せずに進みます。
    D: 左から接近してくる車両にのみ道を譲ります。
  answer: B
  explanation: マニュアルには、私道やドライブウェイから車道に入る際は、停止してすべての車両と歩行者に道を譲らなければならないと記載されています。
- id: 89
  category: sharing_the_road
  question: 道路上で葬列（葬儀の列）に遭遇した場合、どのように対応すべきですか？
  choices:
    A: 急いでいる場合は、列を横切ってもよい。
    B: 葬列に道を譲らなければならず、列を横切ったり加わったりしてはいけません。
    C: 信号を回避するために葬列に加わるべきです。
    D: 葬列の右側を追い越さなければなりません。
  answer: B
  explanation: 葬列には道を譲らなければなりません。マニュアルには、葬列を横切ったり、加わったり、妨害したりしてはならないと明記されています。
- id: 90
  category: penalties_and_points
  question: 赤色灯を点滅させて停車している緊急車両に接近する際、注意して進まなかったり、安全に車線変更を行わなかったりした場合の罰則は何ですか？
  choices:
    A: 初回違反の場合は書面による警告。
    B: 義務的な社会奉仕活動。
    C: 裁判所による運転免許の停止処分および運転記録への減点（デメリットポイント）。
    D: 即時の車両押収。
  answer: C
  explanation: 赤色灯を点滅させて停車している車両に接近する際のルールに違反すると、裁判所による運転免許の停止処分や、運転記録への減点（デメリットポイント）が科される可能性があります。
- id: 91
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内で、出口から出たいことを他のドライバーに知らせるために、どのような合図を出すべきですか？
  choices:
    A: 左の方向指示器。
    B: 右の方向指示器。
    C: 非常点滅表示灯（ハザードランプ）。
    D: ラウンドアバウト内では合図は必要ない。
  answer: B
  explanation: ラウンドアバウト内では、出口から出る準備ができたときに、周囲のドライバーに自分の意図を知らせるため、車両の右の方向指示器（ウィンカー）を使用しなければなりません。
- id: 92
  category: safe_driving_rules
  question: 多車線道路の高速道路を走行中、左車線は主に何のために使用されますか？
  choices:
    A: 制限速度での巡航。
    B: 低速走行車両用。
    C: 追い越し専用。
    D: 高速道路からの出口用。
  answer: C
  explanation: マニュアルでは、多車線道路の高速道路を走行する場合、左車線は巡航用ではなく、追い越し専用であると規定されています。
- id: 93
  category: safe_driving_rules
  question: 他の車両を追い越す際、右車線に戻っても安全なのはいつですか？
  choices:
    A: 追い越す車両と並んだ直後。
    B: バックミラー越しに、追い越した車両のフロント部分が見えたとき。
    C: 相手の車両の後部バンパーを通過してから3秒後。
    D: 追い越された車両がヘッドライトを点滅させたとき。
  answer: B
  explanation: バックミラーで追い越した車両のフロント部分が見えるようになったら、すぐに右車線に戻るべきです。
- id: 94
  category: sharing_the_road
  question: 自転車に乗っている人に接近したり追い越したりする場合、どの程度の距離（間隔）を空ける必要がありますか？
  choices:
    A: 左側に少なくとも2フィート。
    B: 左側に少なくとも3フィート。
    C: 左側に少なくとも4フィート。
    D: 左側に少なくとも5フィート。
  answer: B
  explanation: 自転車、モペッド、または電動アシスト自転車に乗っている人に接近したり追い越したりする場合は、速度を落とし、左側に少なくとも3フィートの間隔を空けて通過しなければなりません。
- id: 95
  category: defensive_driving
  question: 他の車両があなたを追い越そうとしているとき、どうすべきですか？
  choices:
    A: 追い越しを阻止するために加速する。
    B: 左車線に移動する。
    C: 一定の速度を保つか、減速する。
    D: ハイビームを点滅させる。
  answer: C
  explanation: マニュアルでは、追い越される際は加速してはならないと助言しています。一定の速度を保つか、減速するようにしてください。
- id: 96
  category: safe_driving_rules
  question: 次の状況のうち、追い越しが違法かつ危険とみなされるのはどれですか？
  choices:
    A: 同じ方向に交通が流れている多車線道路。
    B: 自車線の左側に実線があるとき。
    C: 前方の車両が左折しようとしており、自車が舗装路面上にとどまっているとき。
    D: 前方500フィートがはっきりと見渡せるとき。
  answer: B
  explanation: 自車線の左側に実線がある場合、追い越しは違法であり危険です。
- id: 97
  category: defensive_driving
  question: カーブや直進道路で道路から外れてしまった場合、制御不能になるのを避けるためにどうすべきですか？
  choices:
    A: パニックになって、すぐに急ブレーキをかける。
    B: ステアリングホイールを道路の方へ急激に切る。
    C: トラクションを回復させるために加速する。
    D: 徐々に速度を落とし、進みたい方向を見て、ゆっくりとハンドルを戻す。
  answer: D
  explanation: 道路から外れてしまっても、パニックにならないでください。過剰な修正（急ハンドル）を避けるため、徐々に速度を落とし、進みたい方向を見ながら、ゆっくりと車道にハンドルを戻してください。
- id: 98
  category: defensive_driving
  question: 左折待ちの間、前輪をまっすぐ前に向けておくべきなのはなぜですか？
  choices:
    A: 信号が青になったときに、より速く加速できるため。
    B: 追突された場合に、対向車線に押し出されるのを防ぐため。
    C: パワーステアリングシステムの摩耗を抑えるため。
    D: 他のドライバーに道を譲っていることを知らせるため。
  answer: B
  explanation: 実際に左折を開始するまで前輪をまっすぐ前に向けておくことで、万が一後ろから他の車両に追突された場合でも、対向車線に押し出されるのを防ぐことができます。
- id: 99
  category: safe_driving_rules
  question: 向かい合って接近している2台の車両が、共に左折の合図を出している場合、どのように進むべきですか？
  choices:
    A: 両方の車両が、お互いの後ろ側を通って曲がるべきである。
    B: 右側の車両に優先権がある。
    C: 両方の車両が、お互いの助手席側が隣り合うように、それぞれの前方を通過して曲がるべきである。
    D: 両方の車両が停止し、青の矢印信号を待たなければならない。
  answer: C
  explanation: 2台の車両が向かい合って接近し、共に左折の合図を出している場合、両方の車両はお互いの助手席側が隣り合うように、それぞれの前方を通過して曲がるべきです。
- id: 100
  category: safe_driving_rules
  question: 商業地区、都市、および町において、Uターン（転回）が許可されているのはどこですか？
  choices:
    A: 黄色の破線がある場所ならどこでも。
    B: 交差点のみ。
    C: いかなる幹線道路上。
    D: 道が空いていればブロック（区画）の中間地点。
  answer: B
  explanation: 商業地区、都市、および町では、Uターンは交差点でのみ許可されています。
- id: 101
  category: safe_driving_rules
  question: 右左折の際、曲がるどれくらい前から合図を出すべきですか？
  choices:
    A: 少なくとも1〜2秒前、50フィート手前。
    B: 少なくとも3〜4秒前、100フィート手前。
    C: 少なくとも5〜6秒前、200フィート手前。
    D: ハンドルを切り始めるのと同時。
  answer: B
  explanation: 曲がる少なくとも3〜4秒前、または100フィート手前から合図を出す必要があります。
- id: 102
  category: signs_and_signals
  question: 左手と腕を下に向けた手信号は何を示していますか？
  choices:
    A: 左折
    B: 右折
    C: 徐行または停止
    D: 注意して進行
  answer: C
  explanation: マニュアルの手信号ガイドによると、左手と腕を下に向けた状態は「徐行または停止」を示します。
- id: 103
  category: safe_driving_rules
  question: 乾燥した路面で時速35〜45マイル（MPH）で走行する場合、推奨される車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: マニュアルによると、時速35〜45マイルでの推奨車間距離は3秒です。
- id: 104
  category: defensive_driving
  question: 次のうち、車間距離を広げるべき状況はどれですか？
  choices:
    A: 視界を遮る大型車両の後ろを走行しているとき。
    B: 舗装したての道路を走行しているとき。
    C: 高速道路に入るとき。
    D: 排気音の大きい車両の後ろを走行しているとき。
  answer: A
  explanation: マニュアルでは、視界を遮る大型車両の後ろを走行する場合や、悪天候、あおり運転を受けている場合などに車間距離を広げるよう指示しています。
- id: 105
  category: defensive_driving
  question: 他の車両にあおり運転（車間距離を詰められる行為）をされた場合、どうすべきですか？
  choices:
    A: 後続車に警告するために急ブレーキをかける。
    B: 車間距離を広げるために加速する。
    C: 別の車線に移動するか、軽くブレーキを踏んでブレーキランプを点滅させる。
    D: ハザードランプを点灯させ、走行車線内で停止する。
  answer: C
  explanation: あおり運転をされた場合、急ブレーキをかけてはいけません。可能であれば別の車線に移動するか、軽くブレーキを踏んでブレーキランプを点滅させ、減速してください。
- id: 106
  category: defensive_driving
  question: 熟練したドライバーは、道路を走る際、どれくらい先を注視するようにしていますか？
  choices:
    A: 5〜10秒先
    B: 10〜15秒先
    C: 20〜30秒先
    D: 45〜60秒先
  answer: C
  explanation: 前方を注視することで、リスクを早期に発見できます。熟練したドライバーは20〜30秒先を注視するようにしており、これは市街地では約1ブロック先に相当します。
- id: 107
  category: safe_driving_rules
  question: 交差点に差し掛かった際、どの順序で交通状況を確認すべきですか？
  choices:
    A: 右、左、そしてもう一度右
    B: 左、右、そしてもう一度左
    C: 直進方向、そして左
    D: 右、直進方向、そして左
  answer: B
  explanation: 交差点では、まず左側を確認します。左から来る車の方が自分に近いからです。次に右を確認し、通過する前にもう一度素早く左を確認します。
- id: 108
  category: defensive_driving
  question: 後方の交通状況を確認するために、バックミラー（ルームミラー）をどれくらいの頻度で見るべきですか？
  choices:
    A: 約5秒ごと
    B: 約10秒ごと
    C: 約30秒ごと
    D: 車線変更をするときだけ
  answer: B
  explanation: マニュアルには、頻繁に（約10秒ごとに）バックミラーで後方の交通状況を確認するように記載されています。
- id: 109
  category: defensive_driving
  question: 死角にいる車を確認する最善の方法は何ですか？
  choices:
    A: ルームミラーをより広い角度に調整する。
    B: 車両のバックカメラを頼りにする。
    C: 素早く頭を回して肩越しに目視する。
    D: 路面の影を確認する。
  answer: C
  explanation: 死角にいる車を確認する最善の方法は、車線変更や追い越しをする前に、素早く頭を回して肩越しに目視し、安全を確認することです。
- id: 110
  category: penalties_and_points
  question: 適法に横断中の歩行者に対して停止せず、重大な身体的損傷または死亡事故を引き起こした場合の罰則は何ですか？
  choices:
    A: クラス3の重罪（Class 3 felony）
    B: クラス1の軽罪（Class 1 misdemeanor）
    C: 500ドルの罰金のみ（禁錮刑なし）
    D: 初犯の場合は警告のみ
  answer: B
  explanation: 道路を適法に横断している歩行者に対して停止せず、重大な身体的損傷または死亡事故を引き起こした場合、クラス1の軽罪（Class 1 misdemeanor）に問われる可能性があります。
- id: 111
  category: sharing_the_road
  question: 自転車が車線の中央を走行することが許可されるのは、どのような状況ですか？
  choices:
    A: 州間高速道路（interstate highway）を走行しているときはいつでも。
    B: 掲示された制限速度で走行しているときのみ。
    C: 左折しようとしているとき、または車線が狭すぎて車と並んで走行できないとき。
    D: 自転車が車線の中央を走行することは決して許可されない。
  answer: C
  explanation: 自転車は、左折しようとしているときや、車線が狭すぎて車と並んで走行できないときなど、必要な場合には車線の中央を走行することが許可されています。
- id: 112
  category: sharing_the_road
  question: 悪天候時にモーターサイクルの後ろを走行する場合、車間距離をどのように調整すべきですか？
  choices:
    A: 標準の2秒の車間距離を維持する。
    B: 車間距離のルールにさらに1秒追加する。
    C: 1秒追加した後の車間距離を2倍にする。
    D: モーターサイクルのスリップストリーム（draft）に入るために車間距離を縮める。
  answer: C
  explanation: マニュアルには、モーターサイクルに対しては車間距離のルールに1秒追加して十分な制動距離を確保し、悪天候時にはその距離を2倍にするよう記載されています。
- id: 113
  category: sharing_the_road
  question: 交通の流れに入る前に、モーターサイクルに道を譲ることが特に重要なのはなぜですか？
  choices:
    A: モーターサイクルは常に掲示された制限速度よりも速く走行するため。
    B: モーターサイクルの大きさにより、その速度や距離を見誤る可能性があるため。
    C: モーターサイクルはすべての交差点で優先権を持っているため。
    D: モーターサイクルは車ほど効果的にブレーキを使えないため。
  answer: B
  explanation: モーターサイクルの大きさによって、その速度や距離を見誤る可能性があるため、モーターサイクルに道を譲ってください。
- id: 114
  category: sharing_the_road
  question: 杖を使用している、または盲導犬を連れている歩行者に遭遇した際、運転者は何をしなければなりませんか？
  choices:
    A: 車両の存在を歩行者に知らせるためにクラクションを鳴らす。
    B: 時速10マイル（10 MPH）まで減速し、注意して進む。
    C: 完全に停止する。これは失明または視覚障害があることを示しているため。
    D: 歩行者が横断歩道内にいる場合にのみ道を譲る。
  answer: C
  explanation: 杖を使用している、または盲導犬を連れている歩行者は、失明または視覚障害があることを示しているため、運転者は完全に停止する必要があります。
- id: 115
  category: sharing_the_road
  question: ライトレール（次世代型路面電車）の線路周辺を走行する際に守るべき重要な安全規則は何ですか？
  choices:
    A: 線路上で他の車両を追い越してもよい。
    B: 線路上で停止、追い越し、またはギアチェンジを決して行ってはならない。
    C: 電車が見えない場合は、下がっている遮断機を避けて運転してもよい。
    D: 電車は単線上を一方向にしか走行しない。
  answer: B
  explanation: ライトレールの近くを走行する際は、線路上で停止、追い越し、またはギアチェンジを決して行ってはいけません。
- id: 116
  category: vehicle_information
  question: 低速車両（LSV）は、最高制限速度がいくらの公道で運転できますか？
  choices:
    A: 25 MPH以下
    B: 35 MPH以下
    C: 45 MPH以下
    D: 55 MPH以下
  answer: B
  explanation: 低速車両は、免許保持者または免許保持者が同乗する仮免許（learner's permit）保持者により、制限速度が35 MPH以下の公道で運転することができます。
- id: 117
  category: sharing_the_road
  question: 大型トラックの側面の死角、つまり「ノーゾーン（No-Zone）」を走行しているかどうかを、どのように判断できますか？
  choices:
    A: トラックの後方500フィート以内を走行している。
    B: トラックの方向指示器が点滅している。
    C: トラックのサイドミラーに運転手の顔が見えない。
    D: 片側一車線の道路を走行している。
  answer: C
  explanation: トラックの両側には大きなノーゾーンがあります。サイドミラーに運転手の顔が見えない場合、運転手からもあなたの姿は見えていません。
- id: 118
  category: sharing_the_road
  question: 大型トラック、バス、またはRV車を追い越す際、その車両の前の車線に戻っても安全なのはいつですか？
  choices:
    A: 自分の車のリアバンパーがトラックのフロントバンパーを通過したらすぐに。
    B: バックミラーにトラックの前面全体が見えたとき。
    C: トラックのちょうど50フィート前方に達したとき。
    D: トラックの運転手がヘッドライトを点滅させたとき。
  answer: B
  explanation: 追い越す際は、前方のノーゾーンを避けるため、バックミラーにトラックの前面全体が見えるようになってから、その前に入るようにしてください。
- id: 119
  category: vehicle_information
  question: 牽引している小型または中型のトレーラーが左右に揺れ始めたら、どうすべきですか？
  choices:
    A: トレーラーをまっすぐにするために加速する。
    B: ハンドルを左右に急に切る。
    C: ブレーキを強く踏む。
    D: 減速する。
  answer: D
  explanation: 小型または中型のトレーラーを連結して走行中、トレーラーが揺れ始めたら、減速する必要があります。
- id: 120
  category: safe_driving_rules
  question: バック（後退）する際に運転者が犯す最も一般的な間違いは何ですか？
  choices:
    A: バックミラーだけに頼ること。
    B: 後方の両側を確認しないこと。
    C: バックする速度が遅すぎること。
    D: ハンドルを両手で握り続けること。
  answer: B
  explanation: バックする際に運転者が犯す最も一般的な間違いは、後方の両側を確認しないことです。
- id: 121
  category: safe_driving_rules
  question: 公道で縁石の横に駐車する場合、車両と縁石の間の最大距離はどれくらいですか？
  choices:
    A: 6インチ
    B: 1フィート
    C: 18インチ
    D: 2フィート
  answer: B
  explanation: 縁石の横に駐車する場合は、縁石に近づけて停めてください。縁石から1フィート（約30センチ）以上離れて駐車することはできません。
- id: 122
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、前輪はどのように向けるべきですか？
  choices:
    A: 前輪を左に向ける
    B: 前輪を右に向ける
    C: 車輪を完全に真っ直ぐにする
    D: 後輪を左に向ける
  answer: A
  explanation: 縁石のある上り坂で駐車する場合、車両が車道に転がり落ちるのを防ぐために、前輪を左（縁石とは反対側、道路の中央側）に向けます。
- id: 123
  category: safe_driving_rules
  question: 消火栓から何フィート以内の場所に駐車することは禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: B
  explanation: 消火栓から15フィート（約4.5メートル）以内の場所に駐車することはできません。
- id: 124
  category: safe_driving_rules
  question: 踏切から何フィート以内の場所に車両を駐車することは違法ですか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 50フィート
    D: 500フィート
  answer: C
  explanation: 踏切から50フィート（約15メートル）以内の場所に駐車することはできません。
- id: 125
  category: defensive_driving
  question: マニュアルによると、衝突事故の最大の要因は何ですか？
  choices:
    A: スピード違反
    B: 飲酒・薬物運転（DUI）
    C: リスクの特定に失敗すること
    D: 車間距離の詰めすぎ（あおり運転）
  answer: C
  explanation: 衝突事故の最大の要因は、リスクの特定に失敗することです。優れたドライバーになるためには、何に注意すべきか、どこを見るべきかを知る必要があります。
- id: 126
  category: safe_driving_rules
  question: バージニア州の法律では、悪天候により視界が何フィート以下に低下した場合、ヘッドライトの使用が義務付けられていますか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: バージニア州の法律では、雨、霧、雪、みぞれなどの悪天候で視界が500フィート（約150メートル）以下に低下した場合、ヘッドライトの使用が義務付けられています。
- id: 127
  category: safe_driving_rules
  question: ワイパーの使用に関連して、いつヘッドライトを使用しなければなりませんか？
  choices:
    A: 夜間に運転する場合のみ。
    B: 悪天候の結果としてワイパーを使用するときはいつでも。
    C: ワイパーが最高速設定になっているときのみ。
    D: 日中にワイパーを使用する場合、ヘッドライトは必要ない。
  answer: B
  explanation: 悪天候のためにワイパーを使用する場合は、常にヘッドライトを点灯させなければなりません。
- id: 128
  category: safe_driving_rules
  question: 夜間に前走車に追従する場合、前走車から何フィート以内の距離にいるときはロービームを使用しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 前走車に追従する場合は、車間距離が200フィート（約60メートル）以内になったらロービームを使用してください。
- id: 129
  category: defensive_driving
  question: 対向車のハイビームがついている場合、どうすべきですか？
  choices:
    A: 自分の車のハイビームを点灯させて、相手のドライバーに警告する。
    B: 車両を追跡するために、明るい光を直接見る。
    C: 道路の脇（右端）に目を向け、その後すぐに前方を見て確認する。
    D: ヘッドライトを素早く点滅させ、クラクションを鳴らす。
  answer: C
  explanation: 対向車のハイビームがついている場合は、眩しい光を直接見ないようにしてください。道路の脇に目を向け、その後すぐに前方を見て他車の位置を確認するようにします。
- id: 130
  category: safe_driving_rules
  question: ハイウェイを走行中、対向車が何フィート以内に近づいたときにハイビームを減光（ロービームに切り替え）しなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1,000フィート
  answer: C
  explanation: マニュアルには、対向車が500フィート（約150メートル）以内に近づいた場合は、ハイウェイであってもロービームを使用するように記載されています。
- id: 131
  category: defensive_driving
  question: 対向車がハイビーム（遠目）を下げない場合、どうすべきですか？
  choices:
    A: 警告するために自分のハイビームをつける
    B: 道路の端の方に目を向け、素早く前方を確認する
    C: 距離を測るためにヘッドライトを直視する
    D: すぐに路肩に寄せて、通り過ぎるのを待つ
  answer: B
  explanation: 対向車のハイビームがついている場合は、眩しい光を直視しないようにしてください。道路の端の方に目を向け、その後すぐに前方を確認します。自分のハイビームをつけないでください。
- id: 132
  category: safe_driving_rules
  question: 濃霧の中を運転する際は、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライトのみ
    D: 非常点滅表示灯（ハザードランプ）
  answer: B
  explanation: 濃霧の中ではロービームを使用してください。霧が光を反射し、自分のヘッドライトの光が目に跳ね返ってくる可能性があるためです。
- id: 133
  category: safe_driving_rules
  question: 雨が降り始めてからの30分間、道路が滑りやすくなりやすいのはなぜですか？
  choices:
    A: 雨が道路上の摩擦材を洗い流すため
    B: 路面の油分が水と混ざるため
    C: 気温が急激に下がり、氷が形成されるため
    D: タイヤは深い水よりも浅い水の方がハイドロプレーニング現象を起こしやすいため
  answer: B
  explanation: 雨が降り始めてからの30分間は、路面の油分が水と混ざるため、道路が滑りやすくなります。
- id: 134
  category: vehicle_information
  question: 雪道で運転する前に、車両のどの部分から雪や氷を取り除かなければなりませんか？
  choices:
    A: フロントガラスとフロントウィンドウのみ
    B: 前後のライトのみ
    C: 屋根、ボンネット、後部を含む車全体
    D: ワイパーとミラーのみ
  answer: C
  explanation: 運転を開始する前に、雪や氷が飛んで危険を招かないよう、屋根、ボンネット、車両後部を含む車全体から雪や氷を取り除いてください。
- id: 135
  category: safe_driving_rules
  question: 寒い時期、道路上の氷に特に注意すべき場所はどこですか？
  choices:
    A: 橋の上や日陰の場所
    B: トンネルやアンダーパス
    C: 信号機のある交差点
    D: 丘の頂上
  answer: A
  explanation: 橋の上や日陰の場所での氷に注意してください。橋は他の路面よりも先に凍結します。
- id: 136
  category: penalties_and_points
  question: バージニア州で「あおり運転（aggressive driving）」で有罪判決を受けた場合、免許停止期間はどのくらいになる可能性がありますか？
  choices:
    A: 5日から30日
    B: 10日から6ヶ月
    C: 30日から1年
    D: 6ヶ月から2年
  answer: B
  explanation: あおり運転で有罪判決を受けた場合、免許は10日間、または最長で6ヶ月間停止される可能性があります。
- id: 137
  category: defensive_driving
  question: 道路で攻撃的なドライバーに遭遇した場合、どのように対処すべきですか？
  choices:
    A: 相手の前に居続けるためにスピードを上げる
    B: 威圧されていないことを示すために目を合わせる
    C: 相手を出し抜こうとする
    D: 邪魔にならないようにし、目を合わせないようにする
  answer: D
  explanation: 攻撃的なドライバーを見かけたら、邪魔にならないようにしてください。攻撃的なドライバーに挑んだり、目を合わせたりせず、相手のジェスチャーや怒鳴り声は無視してください。
- id: 138
  category: driver_responsibility
  question: 居眠り運転を防ぐための効果的で信頼できる方法は次のうちどれですか？
  choices:
    A: 窓を開ける
    B: ガムを噛んだり、ラジオの音量を上げたりする
    C: カフェインやエナジードリンクを摂取する
    D: 安全な場所に停車し、10分から20分の仮眠をとる
  answer: D
  explanation: 安全な場所に停車して仮眠をとってください。わずか10分から20分の睡眠でも大きな違いがあります。窓を開ける、ガムを噛む、ラジオの音を大きくする、カフェインを摂取するといった方法は信頼できるものではありません。
- id: 139
  category: alcohol_drugs_health
  question: バージニア州では、21歳以上のドライバーの血中アルコール濃度（BAC）が少なくとも何パーセント以上であれば、法的に飲酒運転（DUI）とみなされますか？
  choices:
    A: .02パーセント
    B: .04パーセント
    C: .08パーセント
    D: .10パーセント
  answer: C
  explanation: 法律上、21歳以上のドライバーは、血中アルコール濃度（BAC）が.08パーセント以上の場合、飲酒運転（DUI）とみなされます。
- id: 140
  category: alcohol_drugs_health
  question: 21歳未満の場合、BAC（血中アルコール濃度）がどの範囲であれば、アルコールの不法摂取で有罪判決を受ける可能性がありますか？
  choices:
    A: .02以上.08未満
    B: .01以上.05未満
    C: .05以上.10未満
    D: 正確に.00
  answer: A
  explanation: 21歳未満の場合、BAC（血中アルコール濃度）が.02以上.08未満であれば、アルコールの不法摂取で有罪判決を受ける可能性があります。
- id: 141
  category: alcohol_drugs_health
  question: 12オンスのビール1杯と同じ量のアルコールが含まれているのは、次のうちどれですか？
  choices:
    A: 12オンスのワイン1杯
    B: 5オンスのワイン1杯
    C: 蒸留酒のショット2杯
    D: 8オンスのワイン1杯
  answer: B
  explanation: 12オンスのビールは、蒸留酒のショット1杯、または5オンスのワイン1杯と同じアルコール量です。
- id: 142
  category: alcohol_drugs_health
  question: 酔い（酩酊状態）を軽減するための唯一の効果的な方法は何ですか？
  choices:
    A: ブラックコーヒーを飲む
    B: 冷たいシャワーを浴びる
    C: 激しい運動をする
    D: 時間をおく
  answer: D
  explanation: 酔いを軽減できるのは時間だけです。コーヒー、冷たいシャワー、運動では酔いはさめません。
- id: 143
  category: safe_driving_rules
  question: バージニア州法において、運転中にドライバーが携帯電話を手に持つことが許可されるのはどのような時ですか？
  choices:
    A: ナビゲーション目的で使用している時
    B: 赤信号で停車している時
    C: 緊急時、または合法的に駐車・停車している時のみ
    D: スピーカーフォンで話している時
  answer: C
  explanation: バージニア州法では、緊急時、または車両が合法的に駐車・停車している場合を除き、運転中に携帯電話やその他の無線通信機器を手に持つことを禁止しています。
- id: 144
  category: driver_responsibility
  question: バージニア州で毎年発生する全交通事故のうち、ドライバーの注意散漫（わき見運転等）が原因であるものは約何パーセントを占めますか？
  choices:
    A: 10パーセント
    B: 17パーセント
    C: 25パーセント
    D: 33パーセント
  answer: B
  explanation: バージニア州では毎年、全交通事故の約17パーセントがドライバーの注意散漫によって引き起こされています。
- id: 145
  category: alcohol_drugs_health
  question: アルコールをアレルギー薬や風邪薬などの他の薬と併用した場合、どのような影響がありますか？
  choices:
    A: アルコールの効果が打ち消される
    B: 通常、両方の効果が倍増する
    C: 運転能力に影響はない
    D: 反応時間が改善される
  answer: B
  explanation: アルコールを他の薬と併用すると、通常、両方の効果が倍増し、運転能力に壊滅的な影響を及ぼす可能性があります。アレルギー薬や風邪薬と一緒に飲むわずか1杯のお酒でも、数杯のアルコール飲料を飲んだのと同じ影響が出ることがあります。
- id: 146
  category: driver_responsibility
  question: 交通事故を起こした場合、直ちに道路から車両を移動させなければならないのはどのような時ですか？
  choices:
    A: 警察官に指示された時のみ
    B: 車両が移動可能で、負傷者がおらず、安全に行える場合
    C: 警察が到着するまで車両を移動させてはならない
    D: 損害額が3,000ドル未満の場合のみ
  answer: B
  explanation: 車両が移動可能で、負傷者がおらず、ドライバーが安全に移動させることができる場合は、直ちに道路から車両を移動させなければなりません。
- id: 147
  category: driver_responsibility
  question: 交通事故により負傷、死亡、または合計いくらを超える物損が生じた場合、警察官はDMVに書面による事故報告書を送付する必要がありますか？
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $3,000
  answer: D
  explanation: 交通事故により負傷者や死亡者が出た場合、または物損の総額が3,000ドルを超える場合、警察官はDMVに書面による事故報告書を送付しなければなりません。
- id: 148
  category: driver_responsibility
  question: 無人の車両に衝突し、所有者を見つけることができない場合、どうしなければなりませんか？
  choices:
    A: 現場を離れ、所有者からの連絡を待つ
    B: 連絡先を記したメモを残し、24時間以内に警察に事故を報告する
    C: どんなに時間がかかっても、所有者が戻るまで現場で待つ
    D: 48時間以内に保険会社に事故を報告して立ち去る
  answer: B
  explanation: 損傷を与えた無人車両の所有者が見つからない場合は、現場の分かりやすい場所に連絡先と事故の詳細を記したメモを残し、24時間以内に警察に事故を報告しなければなりません。
- id: 149
  category: defensive_driving
  question: シカなどの大型動物との衝突が避けられない場合、どうすべきですか？
  choices:
    A: 対向車線へ急ハンドルを切る
    B: 衝撃時間を最小限にするために加速する
    C: ブレーキをしっかりかけ、車線を維持し、制御しながら停車する
    D: 道路脇の溝へハンドルを切る
  answer: C
  explanation: シカなどの動物との衝突が避けられない場合、急ハンドルを切ってはいけません。ブレーキをしっかりかけ、車線を維持し、制御しながら停車してください。
- id: 150
  category: safe_driving_rules
  question: 夜間に警察官に車を止められた際、取るべき行動の一つは何ですか？
  choices:
    A: 直ちにヘッドライトを消す
    B: 車内の照明（インテリアライト）を点灯させる
    C: 警察官に挨拶するために車から出る
    D: 身分証を求められるまで手を見えないようにしておく
  answer: B
  explanation: 夜間の交通取り締まりで停車した際は、警察官が車内を確認しやすいように、車内の照明を点灯させるべきです。
- id: 151
  category: driver_responsibility
  question: 警察官から発行された交通違反の召喚状（チケット）に署名することは何を意味しますか？
  choices:
    A: 罪を認めることである
    B: 法廷審問を受ける権利を放棄することである
    C: 罪を認めることではないが、署名を拒否すると逮捕される可能性がある
    D: 即座に罰金を支払うことに同意することを意味する
  answer: C
  explanation: 召喚状に署名するよう求められます。署名してください。これは罪を認めることではありません。署名を拒否すると、逮捕される可能性があります。
- id: 152
  category: safe_driving_rules
  question: バージニア州の法律の下で、車内でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転手と前部座席の同乗者のみ
    B: 18歳未満の同乗者のみ
    C: 運転手と、前部・後部両方のすべての同乗者
    D: 運転手のみ
  answer: C
  explanation: バージニア州の法律では、運転手と、前部・後部両方のすべての同乗者がシートベルトを着用しなければなりません。
- id: 153
  category: safe_driving_rules
  question: 妊婦はどのようにシートベルトを着用すべきですか？
  choices:
    A: 腰ベルトを骨盤のできるだけ低い位置に合わせる
    B: 腰ベルトをお腹の真ん中に通す
    C: 肩ベルトを着用しない
    D: 妊婦はシートベルトの着用を免除されている
  answer: A
  explanation: 妊婦は、ベルトを骨盤のできるだけ低い位置に着用して固定することで、より安全になります。
- id: 154
  category: penalties_and_points
  question: バージニア州において、チャイルドシート使用法違反の初犯で有罪となった場合の罰金はいくらですか？
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: B
  explanation: チャイルドシート使用法違反で有罪となった場合、50ドルの罰金が科せられます。2回目以降の違反は500ドルの罰金となる可能性があります。
- id: 155
  category: safe_driving_rules
  question: 車内でチャイルドシートを設置するのに最も安全な場所はどこですか？
  choices:
    A: 助手席
    B: 後部座席の中央
    C: 運転席側の後部座席
    D: 助手席側の後部座席
  answer: B
  explanation: チャイルドシートを設置するのに最も安全な場所は、後部座席の中央です。
- id: 156
  category: safe_driving_rules
  question: バージニア州では、何歳未満の子供をピックアップトラックの荷台に乗せて走行することは違法ですか？
  choices:
    A: 12歳
    B: 14歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: ピックアップトラックの荷台に16歳未満の子供を乗せて走行することは、たとえキャンパーシェルが装備されていても違法です。
- id: 157
  category: vehicle_information
  question: 車にエアバッグが装備されている場合、ハンドルから座席を少なくともどのくらい離すべきですか？
  choices:
    A: 少なくとも5インチ
    B: 少なくとも10インチ
    C: 少なくとも15インチ
    D: 座席が下がる一番後ろまで
  answer: B
  explanation: 車にエアバッグが装備されている場合、ハンドルから少なくとも10インチ（約25cm）離れるように座席を後ろに下げる必要があります。
- id: 158
  category: vehicle_information
  question: 車にエアバッグが装備されている場合、ハンドルをどのように調整すべきですか？
  choices:
    A: 頭の方に向けて上向きに傾ける
    B: 胸の方に向けて下向きに傾ける
    C: 体にできるだけ近づける
    D: 最も高い位置で固定する
  answer: B
  explanation: ハンドルが調整可能な場合は、下向きに傾ける必要があります。これにより、エアバッグが頭や首ではなく胸の方を向くようになります。
- id: 159
  category: safe_driving_rules
  question: すべての子供は何歳までチャイルドシートまたはブースターシートで適切に固定される必要がありますか？
  choices:
    A: 5歳未満
    B: 6歳未満
    C: 8歳未満
    D: 10歳未満
  answer: C
  explanation: 1968年1月1日以降に製造された車両に乗る場合、8歳未満のすべての子供はチャイルドシートまたはブースターシートで適切に固定されなければなりません。
- id: 160
  category: safe_driving_rules
  question: マニュアルによると、子供はどのくらいの期間、後ろ向きのチャイルドシートに乗るべきですか？
  choices:
    A: 出生から1歳まで
    B: 出生から2歳まで
    C: 出生から3歳まで
    D: 出生から4歳まで
  answer: B
  explanation: 子供は出生から2歳まで、またはチャイルドシートのメーカーが許可する限り、後ろ向きで乗るべきです。
- id: 161
  category: safe_driving_rules
  question: 助手席に後ろ向きのチャイルドシートを設置してもよいのはどのような場合ですか？
  choices:
    A: 運転手が子供をよく見ていたいときはいつでも
    B: 車両に後部座席がなく、助手席エアバッグがオフになっているか、装備されていない場合のみ
    C: 子供が1歳以上の場合のみ
    D: いかなる状況においても認められない
  answer: B
  explanation: 車両に後部座席がない場合、助手席エアバッグが装備されていないか、または助手席エアバッグがオフになっていれば、助手席に後ろ向きのチャイルドシートを設置することができます。
- id: 162
  category: penalties_and_points
  question: 運転免許の「停止（suspension）」と「取消（revocation）」の違いは何ですか？
  choices:
    A: 停止は永久的で、取消は一時的である。
    B: 停止は運転資格が一時的に取り消されることを意味し、取消は運転資格が終了することを意味する。
    C: 停止は路上試験の再受験が必要だが、取消は手数料のみで済む。
    D: 違いはない。どちらも免許が永久に無効になることを意味する。
  answer: B
  explanation: 免許が停止（suspended）された場合、運転資格は一時的に取り消されます。取消（revocation）は、運転資格が終了したことを意味します。
- id: 163
  category: penalties_and_points
  question: 次の有罪判決のうち、裁判所またはDMVが自動的に運転資格を停止または取り消すのはどれですか？
  choices:
    A: DMVに対して虚偽の申告をすること
    B: 有効な運転免許証なしで運転すること
    C: 血液・呼気検査を拒否すること
    D: 無謀運転またはあおり運転
  answer: A
  explanation: DMVに対して虚偽の申告をしたことで有罪判決を受けた場合、裁判所またはDMVは運転資格を停止または取り消します。他の選択肢は、裁判所が運転資格を停止または取り消す「可能性がある（MAY）」違反です。
- id: 164
  category: penalties_and_points
  question: 次の違反のうち、自動的な義務ではなく、裁判所が運転資格を停止または取り消す「可能性がある（MAY）」ものはどれですか？
  choices:
    A: 警察からの逃走
    B: 自動車が関与する重罪を犯すこと
    C: 無謀運転またはあおり運転
    D: アルコールまたは薬物の影響下での運転（DUI）
  answer: C
  explanation: マニュアルでは、「無謀運転またはあおり運転」は裁判所が運転資格を停止または取り消す「可能性がある（MAY）」違反としてリストされています。これに対し、DUI、警察からの逃走、または車両を使用した重罪は、停止または取消が必ず行われます。
- id: 165
  category: penalties_and_points
  question: 18歳未満の場合、減点対象となる交通違反で2回目の有罪判決を受けた際の罰則は何ですか？
  choices:
    A: 30日間の運転資格停止
    B: 90日間の運転資格停止
    C: 1年間の運転資格取消
    D: DMVからの警告書
  answer: B
  explanation: 18歳未満の時に犯した減点対象の交通違反で2回目の有罪判決を受けた後、DMVは運転資格を90日間停止します。
- id: 166
  category: penalties_and_points
  question: 18歳未満の運転者が、減点対象となる交通違反で3回目の有罪判決を受けた場合はどうなりますか？
  choices:
    A: 運転資格が1年間、または18歳になるまでのいずれか長い期間、取り消される。
    B: 運転資格が90日間停止される。
    C: 500ドルの罰金を支払い、路上試験を再受験しなければならない。
    D: 運転資格が永久に取り消される。
  answer: A
  explanation: 18歳未満の運転者の場合、3回目の有罪判決を受けると、1年間または18歳に達するまでのいずれか長い期間、運転資格が取り消されます。
- id: 167
  category: penalties_and_points
  question: 18歳以上の場合、何点の減点ポイントが累積すると、DMVから運転改善講習の受講を義務付けられますか？
  choices:
    A: 12ヶ月以内に10点
    B: 12ヶ月以内に12点、または24ヶ月以内に18点
    C: 12ヶ月以内に15点
    D: 12ヶ月以内に18点、または24ヶ月以内に24点
  answer: B
  explanation: 18歳以上の運転者の場合、12ヶ月以内に12点、または24ヶ月以内に18点の減点ポイントが累積すると、DMVは運転改善講習の受講を義務付けます。
- id: 168
  category: penalties_and_points
  question: 12ヶ月以内に18点の減点ポイントを累積させた成人運転者（18歳以上）に対する罰則は何ですか？
  choices:
    A: 30日間の停止
    B: 60日間の停止
    C: 90日間の停止および運転改善講習の受講義務
    D: 1年間の運転資格取消
  answer: C
  explanation: 12ヶ月以内に18点、または24ヶ月以内に24点の減点ポイントを受けた場合、DMVは運転資格を90日間停止し、運転改善講習の受講を義務付けます。
- id: 169
  category: driver_responsibility
  question: 医療審査プログラム（Medical Review Program）において、DMVが懸念するのは、運転者の以下のどの能力を損なう身体的または精神的状態ですか？
  choices:
    A: 聴覚、言語、および反射神経
    B: 意識レベル、知覚、判断力、または運動能力
    C: 道路標識を英語で読む能力
    D: 心血管の健康状態および呼吸数
  answer: B
  explanation: DMVは、運転者の意識レベル、知覚（視覚）、判断力、および運動能力を損なうあらゆる状態を懸念しています。
- id: 170
  category: penalties_and_points
  question: バージニア州で自動車を登録する際、その車両の賠償責任保険に加入していない場合はどうしなければなりませんか？
  choices:
    A: 500ドルの無保険車手数料を支払う。
    B: 運転免許証を返納する。
    C: 250ドルの罰金を支払い、運転改善講習を受ける。
    D: いかなる状況においても、賠償責任保険なしで車両を登録することはできない。
  answer: A
  explanation: 自動車を登録する際は、賠償責任保険に加入しているという声明書に署名するか、500ドルの無保険車手数料を支払う必要があります。
- id: 171
  category: license_system
  question: 免許停止期間中に免許の有効期限が1年以上経過した場合、運転資格を回復させるためには何をしなければなりませんか？
  choices:
    A: 必要な再交付手数料を支払うだけでよい。
    B: 適法な在留証明（legal presence）を提示し、視力試験、知識試験、および技能試験に合格する。
    C: 運転改善講習を修了し、500ドルの手数料を支払う。
    D: 再申請するまでに追加で90日間待機する。
  answer: B
  explanation: 免許停止期間中に免許の有効期限が1年以上経過した場合、運転資格を回復させるには、適法な在留証明を提示し、2部構成の知識試験、技能試験、および視力試験に合格する必要があります。
- id: 172
  category: penalties_and_points
  question: 養育費の支払いが以下の期間または金額分遅れた場合、DMVは運転資格を停止します。
  choices:
    A: 30日または1,000ドル
    B: 60日または2,500ドル
    C: 90日または5,000ドル
    D: 120日または10,000ドル
  answer: C
  explanation: 養育費の支払いが90日または5,000ドル遅れた場合、養育費履行強制局（Division of Child Support Enforcement）はDMVに対し、該当者の運転資格を停止するよう指示します。
- id: 173
  category: alcohol_drugs_health
  question: バージニア州の黙示の同意法（implied consent laws）に基づき、公道で自動車を運転することは、以下のことに同意したとみなされます。
  choices:
    A: 法執行機関がいつでも車両を捜索することを許可すること
    B: 要求に応じて呼気検査を受けること
    C: 自身が引き起こしたあらゆる事故に対して賠償金を支払うこと
    D: 国際運転免許証を携帯すること
  answer: B
  explanation: 黙示の同意法に基づき、バージニア州の公道で自動車を運転する場合、要求に応じて呼気検査を受けることに同意したものとみなされます。
- id: 174
  category: penalties_and_points
  question: 飲酒運転（DUI）の初回違反で起訴され、BAC（血中アルコール濃度）が0.08パーセント以上であった場合、運転資格は自動的に何日間停止されますか？
  choices:
    A: 7日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: A
  explanation: 運転中にBACが0.08パーセント以上であり、法執行機関によって飲酒運転（DUI）で起訴された場合、初回違反であれば運転資格は自動的に7日間停止されます。
- id: 175
  category: alcohol_drugs_health
  question: 自動車の運転中に開封された容器（open container）から飲酒したとして起訴される対象となるには、容器が乗車エリアにある必要があります。このエリアに含まれるのはどれですか？
  choices:
    A: 車両のトランク
    B: 鍵のかかったグローブボックス
    C: 鍵のかかっていないグローブボックス
    D: ピックアップトラックの荷台
  answer: C
  explanation: 乗車エリアとは、運転者と乗客が座るエリア、および鍵のかかっていないグローブボックスを含む、運転者の手が届く範囲のすべてのエリアを指します。
- id: 176
  category: penalties_and_points
  question: 17歳以下の未成年の同乗者がいる状態での飲酒運転（DUI）違反の有罪判決には、追加で以下の期間の義務的な禁錮刑が科されます。
  choices:
    A: 48時間
    B: 5日間
    C: 10日間
    D: 30日間
  answer: B
  explanation: 違反時に17歳以下の未成年の同乗者が車内にいた場合のDUI違反の有罪判決には、他のすべての罰金や禁錮刑に加えて、5日間の義務的な禁錮刑が追加で科されます。
- id: 177
  category: penalties_and_points
  question: アルコール関連の違反で免許停止中に運転しているところを摘発された場合、車両は直ちに何日間押収されますか？
  choices:
    A: 3日間
    B: 7日間
    C: 30日間
    D: 90日間
  answer: C
  explanation: アルコール関連の違反で免許が停止されている間に運転して摘発された場合、車両は直ちに30日間押収されます。
- id: 178
  category: driver_responsibility
  question: 自身の飲酒運転（DUI）違反による事故に対応した緊急要員の費用として、最大いくらまで支払う責任が生じる可能性がありますか？
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: 自身のDUI違反に起因する事故や事件に対応した警察、救急医療サービス、消防士、および救助隊員の費用（最大1,000ドル）を支払う責任が生じる場合があります。
- id: 179
  category: alcohol_drugs_health
  question: 21歳未満で、BAC（血中アルコール濃度）が0.02パーセント以上0.08パーセント未満の状態で運転し有罪判決を受けた場合、運転資格は何期間停止されますか？
  choices:
    A: 6ヶ月
    B: 1年間
    C: 2年間
    D: 21歳になるまで
  answer: B
  explanation: 不法にアルコールを摂取した後に運転し、BACが0.02パーセント以上0.08パーセント未満で有罪判決を受けた場合、裁判所による罰則には、判決日から1年間の運転資格停止が含まれます。
- id: 180
  category: penalties_and_points
  question: 21歳未満で、アルコールを購入するために偽造身分証（fake ID）を使用、または使用しようとした場合、運転免許の義務的な停止期間はどれくらいですか？
  choices:
    A: 少なくとも30日間
    B: 少なくとも90日間
    C: 少なくとも6ヶ月、かつ1年以内
    D: ちょうど2年間
  answer: C
  explanation: 21歳未満で偽造身分証を使用または使用しようとした場合、少なくとも6ヶ月、かつ1年以内の義務的な運転免許停止処分を受けることになります。
- id: 181
  category: license_system
  question: 学習許可証（ラーナーズ・パーミット）で運転する場合、助手席に同乗する免許保持者は21歳以上である必要がありますが、その人物があなたの法定後見人または兄弟姉妹である場合は、何歳であればよいですか？
  choices:
    A: 16歳、17歳、または18歳
    B: 18歳、19歳、または20歳
    C: 免許を持っていれば何歳でもよい
    D: 25歳
  answer: B
  explanation: 同乗する免許保持者が、あなたの法定後見人、兄弟、姉妹、異母・異父兄弟、または義理の兄弟姉妹である場合は、18歳、19歳、または20歳であっても認められます。
- id: 182
  category: license_system
  question: 19歳以上の場合、運転教育修了証明書を提示しない限り、運転免許を申請する前に学習許可証（ラーナーズ・パーミット）をどのくらいの期間保持する必要がありますか？
  choices:
    A: 30日間
    B: 60日間
    C: 9ヶ月間
    D: 1年間
  answer: B
  explanation: 19歳以上の場合は、運転免許を申請するために、学習許可証を60日間保持するか、運転教育の修了証明書を提示する必要があります。
- id: 183
  category: license_system
  question: 標準的な運転免許証では、商業運転免許（CDL）の要件が免除されており、重量が何ポンド未満の車両または小型トラックを運転することができますか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 26,001ポンド
    D: 32,000ポンド
  answer: C
  explanation: 運転免許証があれば、商業運転免許（CDL）の要件が免除されている26,001ポンド未満の車両または小型トラックを運転することができます。
- id: 184
  category: license_system
  question: 15人の乗員（運転手を含む）を運ぶように設計されたスクールバスを運転するには、どうすればよいですか？
  choices:
    A: 完全な商業運転免許（CDL）を取得する
    B: 資格付加（エンドースメント）のために商業ドライバー試験とスクールバス試験を受ける
    C: 少なくとも25歳以上である必要がある
    D: 国際運転免許証を所持している
  answer: B
  explanation: 15人の乗員（運転手を含む）を運ぶように設計されたスクールバスを運転する場合、商業運転免許（CDL）を取得する必要はありません。ただし、運転免許証にスクールバスの資格付加（エンドースメント）を受けるために、商業ドライバー試験とスクールバス試験を受ける必要があります。
- id: 185
  category: license_system
  question: 国際運転免許証に関して、正しいものはどれですか？
  choices:
    A: 米国内のどこでも運転できる有効な運転免許証である
    B: 州が発行する運転免許証に代わるものである
    C: 既存の有効な運転免許証の外国語翻訳に過ぎない
    D: 民間企業から合法的に購入することができる
  answer: C
  explanation: 国際運転免許証は有効な運転免許証ではなく、それだけで運転ができるわけではありません。これは、米国外を旅行する際に使用するための、既存の有効な運転免許証の外国語翻訳に過ぎません。
- id: 186
  category: license_system
  question: バージニア州において、民間企業が販売している国際運転免許証の法的地位はどうなっていますか？
  choices:
    A: 米国到着後60日間有効である
    B: 外国から訪問している場合に必要となる
    C: 有効ではなく、自動車を合法的に運転することはできない
    D: 有効なパスポートを携帯している場合に限り有効である
  answer: C
  explanation: マニュアルによると、民間企業が販売している国際運転免許証は有効ではなく、自動車を合法的に運転することは認められません。
- id: 187
  category: license_system
  question: 新しいバージニア州の運転免許証はどのように受け取りますか？
  choices:
    A: DMVカスタマーサービスセンターで即座に印刷される
    B: 郵送で送られてくる
    C: 地元の警察署で受け取らなければならない
    D: 一時的なデジタルコピーとしてメールで送られてくる
  answer: B
  explanation: マニュアルには、セキュリティ上の理由からDMVはカスタマーサービスセンターで免許証を発行しないため、新しい運転免許証は郵送で届くと記載されています。
- id: 188
  category: driver_responsibility
  question: 住所を変更した場合、何日以内にDMVに住所変更を届け出る必要がありますか？
  choices:
    A: 10日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: B
  explanation: 住所を変更した場合は、30日以内にDMVに届け出る必要があります。郵便局は免許証を新しい住所へ転送しません。
- id: 189
  category: license_system
  question: バージニア州の新しい居住者が運転をする場合、何日以内にバージニア州の運転免許証を取得しなければなりませんか？
  choices:
    A: 30日間
    B: 45日間
    C: 60日間
    D: 90日間
  answer: C
  explanation: バージニア州の新しい居住者が運転をする場合、転入から60日以内にバージニア州の運転免許証を取得する必要があります。
- id: 190
  category: vehicle_information
  question: バージニア州に転入してから何日以内に、車両の所有権登録（タイトル）と車両登録を行い、バージニア州のナンバープレートを取得する必要がありますか？
  choices:
    A: 15日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: B
  explanation: バージニア州に転入してから30日以内に、車両の所有権登録（タイトル）と車両登録を行い、バージニア州のナンバープレートを取得する必要があります。
- id: 191
  category: vehicle_information
  question: バージニア州で登録された車両のナンバープレートはどこに表示しなければなりませんか？
  choices:
    A: 車両の後部のみ。
    B: 車両の前部のみ。
    C: 車両の前部と後部。
    D: 車両の後部とフロントガラスの内側。
  answer: C
  explanation: マニュアルには、ナンバープレートは車両の前部と後部の両方に表示しなければならないと規定されています。
- id: 192
  category: vehicle_information
  question: ペニーテスト（硬貨を使った点検）でタイヤの溝を確認する際、安全な溝の深さがあることを示すのはどれですか？
  choices:
    A: エイブラハム・リンカーンの頭がすべて見える。
    B: リンカーンの頭の一部が溝に隠れている。
    C: ペニーが溝から落ちる。
    D: 溝がペニーに対して完全に平らである。
  answer: B
  explanation: ペニーテストでは、リンカーンの頭の一部が溝に隠れていれば、安全な溝の深さで走行していることになります。
- id: 193
  category: vehicle_information
  question: 車両のタイヤの推奨空気圧（PSI）はどこで確認できますか？
  choices:
    A: 車両のナンバープレート。
    B: 車両の取扱説明書、または運転席側のドアジャム（ドアの枠部分）。
    C: ハンドル。
    D: 車両の登録証に記載されている。
  answer: B
  explanation: 推奨空気圧（PSI）は、車両の取扱説明書または運転席側のドアジャムに記載されています。
- id: 194
  category: driver_responsibility
  question: 500ドルの無保険車両料（uninsured motor vehicle fee）を支払うと、どのような権利が得られますか？
  choices:
    A: 1年間の最低限の賠償責任保険。
    B: 1年間のフルカバー保険。
    C: 保険に加入せずに、バージニア州で1年間車両を登録し運転することができる。
    D: 対物賠償はカバーされるが、対人賠償はカバーされない。
  answer: C
  explanation: 無保険車両料を支払っても保険が提供されるわけではありませんが、1年間バージニア州で車両を登録し、運転することが許可されます。
- id: 195
  category: driver_responsibility
  question: バージニア州で車両の保険契約を解約する前に、何をしなければなりませんか？
  choices:
    A: 500ドルの解約手数料を支払う。
    B: ナンバープレートをDMV（陸運局）に返却し、登録を抹消する。
    C: 地元の警察署に通知する。
    D: DMVの担当者から署名をもらう。
  answer: B
  explanation: 保険を解約する前に、ナンバープレートをDMVに返却し、登録を抹消しなければなりません。
- id: 196
  category: penalties_and_points
  question: 無保険で運転し、かつ無保険車両料を支払っていなかった場合、運転資格を回復するための要件の一つは何ですか？
  choices:
    A: 600ドルの不履行手数料（noncompliance fee）を支払う。
    B: 500ドルの無保険車両料を支払う。
    C: 30日間の禁錮刑に服す。
    D: 車両を州に没収される。
  answer: A
  explanation: 無保険で運転し、手数料を支払っていなかった場合、DMVは600ドルの不履行手数料の支払い（または支払い計画の承認）と、3年間の保険証明書の提出が行われるまで、運転資格を停止します。
- id: 197
  category: driver_responsibility
  question: 18歳未満で、申請書に臓器提供者になることに「はい」とチェックした場合、提供に関する最終決定は誰が行いますか？
  choices:
    A: DMVの局長。
    B: 両親または保護者。
    C: 病院のスタッフ。
    D: 年齢に関わらず、本人が最終決定を行う。
  answer: B
  explanation: 18歳未満の場合、「はい」にチェックすることで提供の意思を示すことはできますが、法律により、両親または保護者が最終決定を下さなければなりません。
- id: 198
  category: safe_driving_rules
  question: 凍結した道路や滑りやすい道路を走行中に停止しなければならない場合、どうすべきですか？
  choices:
    A: ブレーキを強く踏む。
    B: ブレーキを穏やかにかける。
    C: ブレーキから足を離し、エンジンブレーキで停止する。
    D: できるだけ速くポンピングブレーキを行う。
  answer: B
  explanation: マニュアルの知識試験サンプルによると、凍結した道路や滑りやすい道路で停止する必要がある場合は、ブレーキを穏やかにかけるべきです。
- id: 199
  category: safe_driving_rules
  question: 停止を示す正しい手信号はどれですか？
  choices:
    A: 左手と腕を真横に伸ばす。
    B: 左手と腕を上に向ける。
    C: 右手と腕を下に向ける。
    D: 左手と腕を下に向ける。
  answer: D
  explanation: 知識試験サンプルによれば、停止を示す正しい手信号は、左手と腕を下に向けることです。
- id: 200
  category: driver_responsibility
  question: 事故（クラッシュ）に巻き込まれた場合、どのような行動が求められますか？
  choices:
    A: 直ちに負傷者を最寄りの病院へ連れて行く。
    B: そのまま帰宅し、オンラインで事故報告書を提出する。
    C: 停車し、負傷者を救護し、警察に事故を報告し、情報を交換し、保険会社に通知する。
    D: 車の損傷を確認し、走行可能であれば立ち去る。
  answer: C
  explanation: 知識試験サンプルによれば、事故に巻き込まれた場合は、停車し、負傷者を救護し、警察に事故を報告し、情報を交換し、保険会社に通知しなければなりません。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行し、注意して進む
    B: 一時停止（完全停止）する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤色の八角形の「一時停止（STOP）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に、交通状況と歩行者を確認してください。
  id: 201
- image: yield.png
  category: signs_and_signals
  question: この標識はどのような行動を求めていますか？
  choices:
    A: 一時停止（完全停止）する
    B: 加速して交通の流れに合流する
    C: 徐行し、車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「譲れ（YIELD）」標識は、徐行して車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 202
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけた場合、どうすべきですか？
  choices:
    A: Uターン（転回）する
    B: 注意しながら運転を続ける
    C: 停止して後退するか、向きを変える。あなたは逆走しています
    D: 加速してそのエリアから素早く立ち去る
  answer: C
  explanation: 赤と白の「進入禁止／逆走（WRONG WAY）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に向きを変えるか後退してください。
  id: 203
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白色の規制標識は、その交差点での左折が禁止されていることを意味します。
  id: 204
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白色の長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのその区域の法定最高速度を示しています。
  id: 205
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やサファリパークがある
    B: この区域ではシカが頻繁に道路を横断する
    C: この先が狩猟区域である
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色のひし形の標識は、この区域でシカが頻繁に道路を横断することを警告しています。徐行し、特に夜明けや夕暮れ時は動物に注意してください。
  id: 206
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: スクールゾーン（学校周辺）または通学路
    D: 病院区域
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは通学路を示しています。徐行し、子供に注意してください。
  id: 207
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白色のX字型のクロスバック標識は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 208
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大きな減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（角度の急な矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 209
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 中央分離帯のある道路（ディバイデッド・ハイウェイ）の始まり
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線と分離された道路になることを警告しています。右側を通行してください。
  id: 210
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースであることを示しています。有効な障害者用駐車許可証またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 211
