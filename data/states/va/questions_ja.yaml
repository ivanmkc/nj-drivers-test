  question: 路上技能試験のために車両を持ち込む際、マニュアルに記載されている具体的な要件は次のうちどれですか？
  choices:
    A: 車両が製造から10年未満であること。
    B: 車両に正常に作動するスピードメーターが備わっていること。
    C: 車両にGPSナビゲーションシステムが備わっていること。
    D: 車両が4ドアのセダンであること。
  answer: B
  explanation: マニュアルには、車両には「正常に作動するブレーキ、シートベルト、ホーン、ライト、方向指示器、ミラー、およびスピードメーター」が備わっていなければならないと記されています。
- id: 233
  category: driver_testing
  question: DMVのフォーム CSMA 19（運転実技チェックリスト）の目的は何ですか？
  choices:
    A: 仮の学習許可証（ラーナーズパーミット）として機能する。
    B: すべての運転者に義務付けられている医学的証明書である。
    C: 免許を保有する運転者が、申請者が特定の運転タスクを練習したことを証明するために使用する。
    D: オンラインで運転者教育コースを受講するための申請書である。
  answer: C
  explanation: マニュアルでは、CSMA 19をチェックリストとして説明しており、「免許を保有する運転者が、あなたが運転タスクを練習している間、その運転者が同乗していたことをフォーム上で証明する必要があります」と述べています。
- id: 234
  category: driver_testing
  question: 18歳未満の運転免許申請者の場合、路上技能試験は通常どこで実施されますか？
  choices:
    A: 任意のDMVカスタマーサービスセンター。
    B: 指定されたDMV試験施設のみ。
    C: 公立、私立、または民間の運転者教育コースの一部として。
    D: 法執行官（警察官など）によって。
  answer: C
  explanation: マニュアルには、「18歳未満の申請者の場合、路上技能試験は、公立、私立、または民間のドライビングスクールで受講する運転者教育コースの一部として行われます」と記されています。
- id: 235
  category: driver_testing
  question: 18歳未満の運転免許申請者が知識試験に3回不合格になった場合、8時間のドライバーズマニュアル講習を受ける前に何をしなければなりませんか？
  choices:
    A: 90日間待機する。
    B: 新しい学習許可証を取得する。
    C: 運転者教育の座学部分の修了証明書を提示する。
    D: 20時間の監督下での運転練習を完了する。
  answer: C
  explanation: マニュアルには、講習を受ける前に、18歳未満の顧客は「運転者教育の座学部分の修了証明書を、ドライバーズマニュアル講習を実施するドライビングスクールに提示しなければならない」と記されています。
- id: 236
  category: driver_testing
  question: バージニア州のドライバーズマニュアルには、試験中に他人に試験問題や解答を教えてはならないと記されています。その他に明示的に禁止されている行為は何ですか？
  choices:
    A: 騒音を遮断するためにヘッドフォンを着用すること。
    B: 試験エリアに水筒を持ち込むこと。
    C: 試験前に試験問題や解答を入手しようとすること。
    D: 不合格だった場合に、別の日に再試験を依頼すること。
  answer: C
  explanation: マニュアルには、試験を受ける際に「試験前に試験問題や解答を入手しようとする」ことはできないと明示されています。
- id: 237
  category: driver_testing
  question: DMVで路上技能試験を受ける資格を得るために、試験官は運転者教育の修了証明書の提示、またはどのような代替手段を求めますか？
  choices:
    A: 追加の試験手数料を支払う。
    B: 免許を保有する運転者からの書面による推薦状を提出する。
    C: 運転実技チェックリスト（フォーム CSMA 19）を完了させる。
    D: 認定整備士による試験前の車両点検に合格する。
  answer: C
  explanation: マニュアルには、路上技能試験を受けるには、DMVの試験官が「適切な運転者教育の修了証明書を提示するか、運転実技チェックリスト（DMVフォーム
    CSMA 19）を完了させること」を求めると記されています。
- id: 238
  category: driver_testing
  question: 2部構成の知識試験では、交通標識、自動車法、および安全運転に関する知識が問われます。試験問題はどこから出題されますか？
  choices:
    A: バージニア州の車両法規。
    B: 連邦輸送ガイドライン。
    C: バージニア州ドライバーズマニュアル内の情報。
    D: 全国標準試験問題バンク。
  answer: C
  explanation: マニュアルには、「試験問題はこのマニュアル内の情報から作成されています」と明記されています。
- id: 239
  category: driver_testing
  question: 免許を保有する運転者が運転実技チェックリスト（CSMA 19）を証明する際、申請者の練習を観察したことに加えて、何を認めていることになりますか？
  choices:
    A: 申請者の車両が路上走行において安全であること。
    B: 申請者が専門的な運転コースに合格したこと。
    C: 申請者が保険に加入していること。
    D: 申請者が自動車の運転中に学習許可証のすべての要件を遵守したこと。
  answer: D
  explanation: マニュアルには、免許を保有する運転者が「あなたが運転タスクを練習している間、その運転者が同乗していたこと、およびあなたが自動車の運転中に学習許可証保持者のためのすべての要件を遵守したこと」を証明すると記されています。
- id: 240
  category: driver_testing
  question: 路上技能試験の受験に関する情報を探しているホームスクール（自宅学習）の申請者に対して、マニュアルはどの特定の文書を参照することを推奨していますか？
  choices:
    A: DMVフォーム CSMA 19。
    B: ホームスクール車内運転者教育情報シート（HS 3）。
    C: バージニア州ドライバーズマニュアル第8節。
    D: 公立学校システムの運転者教育カリキュラム。
  answer: B
  explanation: マニュアルには、「ホームスクールの場合は、路上技能試験の受験に関する詳細について、ホームスクール車内運転者教育情報シート（HS 3）を参照してください」と記されています。
- id: 241
  category: driver_testing
  question: 18歳以上で運転教育コースを修了していない申請者が、初めて路上試験を受けるための要件は何ですか？
  choices:
    A: 学習許可証を30日間保持しなければならない。
    B: 学習許可証を60日間保持しなければならない。
    C: 視力検査に2回合格しなければならない。
    D: オンラインの安全コースを修了しなければならない。
  answer: B
  explanation: 18歳以上の申請者は、最初の路上試験を受ける前に学習許可証を60日間保持するか、運転教育コースを修了する必要があります。
- id: 242
  category: driver_testing
  question: マニュアルによると、申請者はどのくらいの頻度で路上試験を受けることができますか？
  choices:
    A: 1営業日に2回。
    B: 週に1回。
    C: 1営業日に1回のみ。
    D: 予約できる限り何度でも。
  answer: C
  explanation: マニュアルには、「試験は1営業日に1回のみ受けることができます」と記載されています。
- id: 243
  category: license_system
  question: 日中のみに制限された免許に必要な最小の水平視野はどれくらいですか？
  choices:
    A: 40度以上
    B: 70度以上
    C: 100度以上
    D: 110度以上
  answer: B
  explanation: 日中のみに制限された免許の資格を得るには、70度以上の水平視野が必要です。
- id: 244
  category: signs_and_signals
  question: バージニア州の法律の下で、赤の矢印信号で合法的に右左折ができる唯一の状況は何ですか？
  choices:
    A: 完全に停止した後、道が空いている場合。
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合。
    C: 交差点に、停止後の右左折を明確に許可する標識が掲示されている場合。
    D: 日中のみ。
  answer: C
  explanation: 交差点に「Right on Red Arrow After Stop（停止後、赤の矢印で右折可）」または「Left on Red Arrow
    After Stop（停止後、赤の矢印で左折可）」という標識が掲示されていない限り、赤の矢印の方向に進むことはできません。
- id: 245
  category: signs_and_signals
  question: 赤の矢印が点滅している交差点に近づいた際、正しい手順は何ですか？
  choices:
    A: 徐行し、停止せずに注意して進む。
    B: 完全に停止し、車両や歩行者に道を譲り、安全が確認できたら進む。
    C: 停止し、信号が青になるのを待つ。
    D: 一時停止の標識として扱い、必要な場合のみ停止する。
  answer: B
  explanation: マニュアルには、赤の矢印が点滅している場所では、完全に停止し、車両や歩行者に優先権を譲り、道が空いている時に矢印の方向に進まなければならないと記載されています。
- id: 246
  category: signs_and_signals
  question: 踏切で赤色の点滅信号に遭遇した際、運転者は何をしなければなりませんか？
  choices:
    A: 徐行し、渡る前に列車が来ていないか確認する。
    B: 列車が近づいているのが見える場合のみ停止する。
    C: 列車が見えなくても、完全に停止する。
    D: 遮断機が上がっていれば注意して進む。
  answer: C
  explanation: 赤色の点滅信号がある踏切では、列車が見えなくても完全に停止しなければなりません。
- id: 247
  category: license_system
  question: 視力を矯正するためにレーザー手術を受け、免許証から「C」制限を解除したい場合、何をしなければなりませんか？
  choices:
    A: 医師からの手紙をDMV本部に郵送する。
    B: 運転中に眼鏡をかけるのを単にやめる。
    C: 免許の有効期限が切れるのを待ち、対面で更新する。
    D: DMVセンターを訪れ、レンズなしで視力検査に合格するか、視力検査報告書（MED 4）を提出する。
  answer: D
  explanation: レーザー手術後に「C」制限を解除するには、DMVカスタマーサービスセンターを訪れ、眼鏡やコンタクトレンズを着用せずに視力検査に合格するか、視力検査報告書（MED
    4）を提出する必要があります。
- id: 248
  category: license_system
  question: バージニア州の制限なしの運転免許証に必要な最小の水平視野基準は何ですか？
  choices:
    A: 片目または両目で70度。
    B: 片目または両目で90度。
    C: 片目または両目で110度。
    D: 片目または両目で140度。
  answer: C
  explanation: 制限なしの運転免許証の視力基準は、視力が20/40以上、かつ片目または両目の水平視野が110度以上です。
- id: 249
  category: sharing_the_road
  question: 赤信号での合法的な右左折を準備する際、完全に停止した直後に何をしなければなりませんか？
  choices:
    A: 歩行者に知らせるためにクラクションを鳴らす。
    B: ハザードランプを点灯させる。
    C: 視界を良くするために横断歩道内に少し進む。
    D: 両方向を確認し、歩行者や車両に優先権を譲る。
  answer: D
  explanation: 赤信号で曲がる前に、完全に停止し、「両方向を確認し、歩行者や他の車両に優先権を譲らなければなりません。オートバイ、自転車、モペッドなどの見えにくい車両がないか必ず確認してください」とあります。
- id: 250
  category: driver_testing
  question: 申請者がDMVでの路上試験に不合格となった場合、再受験が可能になるまでの最小待機期間はどれくらいですか？
  choices:
    A: 24時間
    B: 2日間
    C: 1週間
    D: 待機期間はない。
  answer: B
  explanation: マニュアルには、「路上試験に不合格となった場合、再受験するには2日間待たなければなりません」と記載されています。
- id: 251
  category: license_system
  question: 片目のみの視力を持つ運転手が日中限定免許を取得するための、具体的な水平視野の要件は何ですか？
  choices:
    A: 鼻側に少なくとも70度、こめかみ側に70度以上。
    B: 鼻側に少なくとも40度、こめかみ側に30度以上。
    C: 鼻側に少なくとも30度、こめかみ側に40度以上。
    D: 合計の水平視野が少なくとも90度以上。
  answer: C
  explanation: 片目のみの視力を持つ人が日中限定免許を取得するには、鼻側を見たときに30度以上、こめかみ側を見たときに40度以上の水平視野が必要です。
- id: 252
  category: driver_responsibility
  question: マニュアルによると、バイオプティック望遠レンズを着用している運転手が、特定の免許情報を取得するにはどうすればよいですか？
  choices:
    A: DMVの監督者との特別予約を入れる。
    B: DMVの刊行物「MED 44」を読むか、DMVに電話で問い合わせる。
    C: 専門の運転教育コースに入学する。
    D: 医師の診断書を添えて、標準的な運転免許申請書を提出する。
  answer: B
  explanation: マニュアルには次のように記載されています。「バイオプティック望遠レンズを着用している場合は、dmv.virginia.govで入手可能なDMV刊行物『バイオプティック望遠レンズ着用者のための運転免許情報（MED
    44）』を読むか、DMV（804-497-7100）までお問い合わせください」。
- id: 253
  category: safe_driving_rules
  question: 交通信号、標識、路面標示に従うことに加えて、交通規制を回避するために違法とされる具体的な行為は何ですか？
  choices:
    A: 交差点でUターンをすること。
    B: 掲示された制限速度よりも遅く走ること。
    C: 駐車場や野原を通り抜けること。
    D: 交差点の手前100フィート以内で車線変更をすること。
  answer: C
  explanation: マニュアルには、「駐車場や野原を通り抜けてこれらの交通規制を回避することは違法です」と明記されています。
- id: 254
  category: safe_driving_rules
  question: 右左折の青い矢印信号がなく、青信号が点灯している交差点で曲がる際、どうしなければなりませんか？
  choices:
    A: 対向車に対して優先権がある。
    B: 対向車や交差点内の歩行者に道を譲らなければならない。
    C: 曲がるために交差点に入る前に、完全に停止しなければならない。
    D: 信号が変わる前に素早く曲がる。
  answer: B
  explanation: マニュアルには、「青い矢印信号なしで曲がる場合は、反対方向から来る車両や交差点内の歩行者に道を譲らなければなりません」と記載されています。
- id: 255
  category: signs_and_signals
  question: 赤色の×印が表示されている車線利用制御信号は何を示していますか？
  choices:
    A: その車線はまもなく閉鎖されるため、安全に移動せよ。
    B: その車線は緊急車両専用である。
    C: その車線を走行することは決して許可されない。
    D: その車線は進行方向に走行可能である。
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「赤色の×印：赤色の×印が表示されている車線は、決して走行しないでください」。
- id: 256
  category: signs_and_signals
  question: 歩行者用ハイブリッドビーコン（PHB）の作動順序において、最初の1つの黄色の点滅信号の直後に何が起こりますか？
  choices:
    A: 信号が黄色の点灯に変わる。
    B: 2つの赤色の点灯が表示される。
    C: 青い矢印が表示され、進行が許可される。
    D: ビーコンが完全に消灯する。
  answer: A
  explanation: マニュアルではその順序を次のように説明しています。「歩行者がPHBを作動させると、下部の1つの黄色いライトが点滅します。次に、黄色いライトが点灯に変わり、運転手に停止の準備をするよう警告します」。
- id: 257
  category: signs_and_signals
  question: マニュアルによると、赤と白を組み合わせた色の標識はどのようなメッセージを伝えていますか？
  choices:
    A: カーブなどの前方の危険に対する警告。
    B: ドライバー向けサービスの情報。
    C: 停止、譲れ、進入禁止、および禁止の概念。
    D: 目的地や距離の情報。
  answer: C
  explanation: マニュアルには、「赤と白の組み合わせは、停止（stop）、譲れ（yield）、進入禁止（do not enter）、および禁止（no）を伝えます。一時停止標識、譲れ標識、進入禁止や逆走標識などがその例です」と記載されています。
- id: 258
  category: signs_and_signals
  question: 通常、黒と白の標識にはどのような種類の情報が表示されますか？
  choices:
    A: 歴史的または文化的な関心事。
    B: 速度制限や追い越し規則などの規制情報。
    C: スクールゾーンや歩行者横断に関する警告。
    D: 工事区域の案内。
  answer: B
  explanation: マニュアルには、「黒と白の組み合わせは規制情報を伝えます。速度制限、追い越し禁止、右左折禁止などは、法律によって運用が規制されている例です」と規定されています。
- id: 259
  category: signs_and_signals
  question: 警告標識の特別な区分として、黒色と組み合わせて蛍光黄緑色が使用される標識は何を知らせるためのものですか？
  choices:
    A: 前方の事故処理区域。
    B: 前方の休憩所やガソリンスタンド。
    C: スクールゾーン、歩行者、および/または自転車利用者の活動。
    D: 頭上注意（高さ制限）。
  answer: C
  explanation: マニュアルには、「警告標識の特別な区分として、スクールゾーン、歩行者、および/または自転車利用者の活動を知らせるために、黒色と組み合わせた蛍光黄緑色が使用されます」と記載されています。
- id: 260
  category: safe_driving_rules
  question: 誤って「進入禁止（Do Not Enter）」または「逆走（Wrong Way）」の標識を通り過ぎてしまったことに気づいた場合、正しい対処法は何ですか？
  choices:
    A: 次の出口が見つかるまで運転を続ける。
    B: 停車し、標識の手前までバックで戻る。
    C: 他の運転手に警告するために、継続的にクラクションを鳴らす。
    D: 直ちに減速して路肩に寄せ、慎重に向きを変える。
  answer: D
  explanation: マニュアルには次のように指示されています。「これらの標識を通り過ぎてしまった場合は……直ちに減速して路肩に寄せ、慎重に向きを変えてください」。
- id: 261
  category: safe_driving_rules
  question: 「Left Turn Yield on Green（青信号での左折は譲れ）」の標識は何を示していますか？
  choices:
    A: 左折車が対向車に対して優先権を持つ。
    B: 対向車は停止してあなたに道を譲らなければならない。
    C: 左折する車両には優先権がなく、対向車に道を譲らなければならない。
    D: 交差点のすべての車両は進行前に停止しなければならない。
  answer: C
  explanation: マニュアルには、この標識は「青信号で左折する車両には優先権がなく、反対方向から来る車両に道を譲らなければならないことを示している」と記載されています。
- id: 262
  category: signs_and_signals
  question: 車線利用規制標識（Lane Use Control signs）の主な目的は何ですか？
  choices:
    A: 特定の車線の法定最高速度を示すため。
    B: バスや高乗車人数車両（HOV）専用の車線を確保するため。
    C: 特定の車線から右左折が必要な場所、または許可されている場所を示すため。
    D: 特定の車線の先で工事が行われていることを警告するため。
  answer: C
  explanation: マニュアルには、「車線利用規制：これらの標識は、特定の車線において右左折が義務付けられている場所、または特別な右左折動作が許可されている場所で使用されます」と記載されています。
- id: 263
  category: safe_driving_rules
  question: 障害者用駐車標識がある駐車スペースは、誰のために予約されていますか？
  choices:
    A: ハザードランプを点灯させていれば、15分以内なら誰でも。
    B: 障害者用駐車許可証を発行された人のみ。
    C: 許可証の有無にかかわらず、70歳以上のすべての運転者。
    D: 営業時間内に配達を行う商用車。
  answer: B
  explanation: マニュアルには明確に記載されています。「障害者用駐車場：これらの標識で示された駐車スペースは、障害者用駐車許可証を持つ人のために予約されています。」
- id: 264
  category: signs_and_signals
  question: 規制標識において、シンボルに斜線が入った赤い円は一般的に何を意味しますか？
  choices:
    A: シンボルで示された動作が推奨される。
    B: シンボルで示された動作に対して注意が促される。
    C: シンボルで示された動作が禁止されている。
    D: シンボルで示された動作は特定の時間帯のみ許可される。
  answer: C
  explanation: マニュアルには、「斜線のある赤い円は『禁止（NO）』を意味することを覚えておいてください。円の中のシンボルが、何が禁止されているかを示しています」と記載されています。
- id: 265
  category: signs_and_signals
  question: 一方向または双方向の左折矢印の車線利用信号がある車線のルールは何ですか？
  choices:
    A: 誰も曲がっていない場合は、その車線を直進してもよい。
    B: 矢印の方向に曲がる目的でのみ、その車線に入ることが許可される。
    C: この車線はピーク時間帯、すべての交通に対して閉鎖される。
    D: 車線に入る前に、他のすべての交通に道を譲らなければならない。
  answer: B
  explanation: マニュアルには、「左折矢印：一方向または双方向の矢印で示された車線には、矢印の方向に曲がる目的でのみ入ることが許可されます」と記載されています。
- id: 266
  category: signs_and_signals
  question: 「Divided Highway Begins（中央分離帯のある道路の始まり）」の標識は何を示しており、適切な対応は何ですか？
  choices:
    A: 高速道路が1車線に合流するため、合流の準備をする。
    B: 高速道路が終了するため、停止の準備をする。
    C: 道路が中央分離帯によって2つの別々の車道に分かれており、各車道は一方通行である。右側を通行しなければならない。
    D: 前方の道路が対面通行であるため、道路の中央に移動する。
  answer: C
  explanation: マニュアルには、「前方の道路は中央分離帯や仕切りによって2つの別々の車道に分かれており、各車道は一方通行です。右側を通行してください」と記載されています。
- id: 267
  category: signs_and_signals
  question: 右車線が終了することを示す「Lane Reduction（車線減少）」の標識を見たとき、正しい手順は何ですか？
  choices:
    A: 右車線の運転手には、直ちに左に合流する優先権がある。
    B: 左車線の運転手は、他車が合流できるように停止しなければならない。
    C: 右車線の運転手はスペースが空いたときに左に合流し、左車線の運転手はスムーズに合流できるように協力すべきである。
    D: すべての交通は完全に停止し、交代で合流しなければならない。
  answer: C
  explanation: マニュアルには、「右車線はまもなく終了します。右車線の運転手は、スペースが空いたときに左に合流しなければなりません。左車線の運転手は、他の車両がスムーズに合流できるようにすべきです」と記載されています。
- id: 268
  category: signs_and_signals
  question: 急な坂道にトラックが描かれた標識（「Hill（坂道）」標識）を見たとき、推奨される行動は何ですか？
  choices:
    A: 勢いを維持するために加速する。
    B: ハザードランプを点灯させる。
    C: ブレーキを点検する。
    D: 他の運転手に警告するためにクラクションを鳴らす。
  answer: C
  explanation: マニュアルには、坂道の標識について「前方に急勾配があります。ブレーキを点検してください」と記載されています。
- id: 269
  category: sharing_the_road
  question: 馬車に接近したり追い越したりする際、特に避けるべき行動は何ですか？
  choices:
    A: 減速すること。
    B: クラクションを鳴らすこと。
    C: 少なくとも3フィート（約90cm）の間隔を空けること。
    D: 前方がクリアなときにのみ追い越すこと。
  answer: B
  explanation: マニュアルには馬車に関して、「減速し、クラクションを使用しないでください」と記載されています。
- id: 270
  category: signs_and_signals
  question: 「T字路（T Intersection）」の標識は何を意味しますか？
  choices:
    A: 道路が続いていないため、Uターンしなければならない。
    B: 走行中の道路がこの先で突き当たり、一時停止して譲った後、右折または左折しなければならない。
    C: 脇道が鋭角で幹線道路に合流している。
    D: 前方の道路が工事のため一時的に閉鎖されている。
  answer: B
  explanation: マニュアルでは、T字路の標識について「走行中の道路は前方の停止標識で突き当たります。対向車や歩行者に道を譲った後、右折または左折しなければなりません」と説明されています。
- id: 271
  category: signs_and_signals
  question: マニュアルによると、「曲がりくねった道」の標識がある道路を安全に走行するための鍵は何ですか？
  choices:
    A: すべてのカーブで一定の速度を維持する。
    B: ハイビームを使用して、より遠くまで見えるようにする。
    C: すべてのカーブで、コントロールを良くするために減速する。
    D: 車線の中央に留まり、速度を調整しない。
  answer: C
  explanation: マニュアルでは、曲がりくねった道について「すべてのカーブで、コントロールを良くするために減速してください」とアドバイスしています。
- id: 272
  category: signs_and_signals
  question: 標識にある緊急電話番号を使用して踏切の危険な状態を報告する場合、場所を特定するためにどのような具体的な情報を提供する必要がありますか？
  choices:
    A: 時刻と進行方向。
    B: 最寄りの町村の名前。
    C: 車両のナンバープレート番号。
    D: 掲示されている踏切番号。
  answer: D
  explanation: マニュアルには、「危険箇所を正しく特定できるよう、掲示されている踏切番号を必ず伝えてください」と記載されています。
- id: 273
  category: signs_and_signals
  question: 「中央分離帯終了（Divided Highway Ends）」の標識は何を警告していますか？
  choices:
    A: 料金所に近づいていること。
    B: 高速道路が終点であり、出口に向かわなければならないこと。
    C: 中央分離帯や仕切りが終わり、同じ道路を双方向の交通が走るようになること。
    D: 高速道路が始まるため、右車線に移動すべきであること。
  answer: C
  explanation: マニュアルには、「この先の道路には中央分離帯や仕切りがなくなります。交通は双方向になります。右側を通行してください」と記載されています。
- id: 274
  category: signs_and_signals
  question: 「歩行者横断」または「自転車横断」の標識に、矢印の付いた2つ目の標識が伴っている場合、その矢印は何を示していますか？
  choices:
    A: 歩行者や自転車が来る方向。
    B: 横断歩道や自転車横断帯の実際の場所。
    C: 車両の義務的な右左折。
    D: 横断エリアの制限速度。
  answer: B
  explanation: マニュアルには、歩行者および自転車横断標識の両方について、「矢印の付いた2つ目の標識は、横断歩道（または自転車横断帯）の実際の場所を示している場合があります」と記されています。
- id: 275
  category: signs_and_signals
  question: 踏切警報機、点滅灯、遮断機のある踏切において、遮断機に関する規則は何ですか？
  choices:
    A: 列車が見えなければ、注意して進んでもよい。
    B: 遮断機が1分以上降りている場合は、遮断機を避けて運転してもよい。
    C: 灯火が点滅したら停止し、降りている遮断機を避けて運転しようとしてはならない。
    D: 遮断機が完全に降りている場合のみ停止する。動いている最中なら横断できる。
  answer: C
  explanation: マニュアルには明確にこう記されています。「灯火が点滅し始めたら、遮断機が降りる前に停止してください。遮断機が上がり、灯火の点滅が止まるまで停止したままでいてください。降りている遮断機を避けて運転しようとしないでください。」
- id: 276
  category: signs_and_signals
  question: 右に急カーブし、その直後に左に曲がる矢印の標識は何を警告していますか？
  choices:
    A: この先にラウンドアバウトがあることへの備え。
    B: 右への急カーブと、それに続く左への急カーブに備えた減速。
    C: この先の分岐路で、右車線か左車線のいずれかを選択すること。
    D: 左右両方からの合流車両への注意。
  answer: B
  explanation: 「右左急カーブ」の標識の説明には、「減速し、この先の道路が右、次に左へと急に曲がることに備えてください」とあります。
- id: 277
  category: signs_and_signals
  question: 「桁下制限（Low Clearance）」の標識がある跨道橋に近づく場合、どうしなければなりませんか？
  choices:
    A: 減速し、進む前にクラクションを鳴らす。
    B: 車両の高さが標識に表示されている高さよりも高い場合は、進んではならない。
    C: 停止して先導車を待つ。
    D: すべてのトラックは停止しなければならないが、乗用車は高さを確認せずに進んでもよい。
  answer: B
  explanation: マニュアルには、桁下制限標識について「車両の高さが標識に表示されている高さよりも高い場合は、進んではならない」と記載されています。
- id: 278
  category: signs_and_signals
  question: 「伸縮継手（Expansion Joints）」の標識は、車線を横切る継手についてドライバーに何を警告していますか？
  choices:
    A: バスの指定停車場所であること。
    B: 段差が生じたり、雨天時にトラクション（路面を捉える力）を失う原因になったりすること。
    C: 凍結しやすい橋の始まりを示していること。
    D: オートバイが特にコントロールを失いやすい場所であること。
  answer: B
  explanation: マニュアルには、「この標識は、車線を横切る継手が段差を作っている場合や、雨天時にトラクションを失うほど幅が広い場合に使用されます」と記載されています。オートバイ専用の危険標識は「開口継手（Open
    Joints）」の標識です。
- id: 279
  category: signs_and_signals
  question: 「右カーブ・側道あり（Right Curve - Side Road）」の標識は、どのような具体的な危険を警告していますか？
  choices:
    A: 道路が右にカーブしており、そのカーブ内で左側から側道が合流していること。
    B: 本道が終点となるため、右側に出なければならないこと。
    C: 道路が右にカーブしており、左折して側道に入らなければならないこと。
    D: 右カーブの直後に丁字路（T字路）があること。
  answer: A
  explanation: マニュアルにはこの標識について次のように説明されています。「この先の道路は右にカーブしており、そのカーブ内で左側から側道が合流しています。走行中の道路に進入してくる車両に注意してください。」
