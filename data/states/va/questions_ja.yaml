questions:
- id: 3
  category: alcohol_drugs_health
  question: バージニア州の未成年者の飲酒に対する法的立場は何ですか？
  choices:
    A: 0.08%の血中アルコール濃度(BAC)制限が適用される
    B: ゼロ・トレランス法（不寛容方式）である
    C: 0.02%の血中アルコール濃度(BAC)制限が適用される
    D: 成人が同伴していれば許可される
  answer: B
  explanation: マニュアルには「バージニア州には未成年者の飲酒に対するゼロ・トレランス法（zero-tolerance law）があることを忘れないでください」と明記されています。
- id: 7
  category: defensive_driving
  question: 前方の車両との安全な車間距離を判断するために、どのルールを使用すべきですか？
  choices:
    A: 車1台分の長さルール
    B: 2秒・3秒・4秒ルール
    C: 5秒ルール
    D: 10フィート（約3メートル）ルール
  answer: B
  explanation: マニュアルでは、前方の車両との車間距離を判断する際、2秒・3秒・4秒ルールを使用することを推奨しています。
- id: 8
  category: driver_testing
  question: バージニア州ドライバーズ・マニュアルの試験セクションによると、学科試験はどのような形式ですか？
  choices:
    A: 1部構成の試験
    B: 2部構成の試験
    C: 3部構成の試験
    D: 4部構成の試験
  answer: B
  explanation: マニュアルの目次第1節には「2部構成の学科試験」と記載されています。
- id: 9
  category: penalties_and_points
  question: マニュアルによると、運転以外の違反のうち、免許停止の原因となる可能性があるのはどれですか？
  choices:
    A: 駐車違反切符の未払い
    B: 養育費関連の要件を満たさないこと
    C: 有権者登録を行わないこと
    D: パスポートの更新を行わないこと
  answer: B
  explanation: マニュアルの第5節「DMVの要件、停止および取り消し」の項目に、「養育費関連の要件を満たさないことによる停止」が記載されています。
- id: 10
  category: safe_driving_rules
  question: バージニア州ドライバーズ・マニュアルにおいて、「危険な運転行為」として明記されているのは次のうちどれですか？
  choices:
    A: ペットを車に乗せて運転する
    B: 居眠り運転
    C: 大音量で音楽を聴く
    D: 運転中に食事をする
  answer: B
  explanation: マニュアルの第3節では、「危険な運転行為」として、あおり運転、わき見運転、居眠り運転、飲酒運転が挙げられています。
- id: 11
  category: penalties_and_points
  question: 免許の停止や取り消しにつながる可能性があるDMVの要件として、マニュアルに記載されているプログラムはどれですか？
  choices:
    A: 車両排ガスプログラム
    B: 保険監視プログラム
    C: ハイウェイ清掃プログラム
    D: 運転者教育プログラム
  answer: B
  explanation: マニュアルの第5節「その他のDMVの要件、停止および取り消し」の項目に、「保険監視プログラム」が記載されています。
- id: 12
  category: sharing_the_road
  question: バージニア州ドライバーズ・マニュアルには、次のうちどれと道路を共有するための具体的な指示が含まれていますか？
  choices:
    A: 飛行機
    B: ライトレール（軽軌道）
    C: ホバーボード
    D: ATVs（全地形対応車）
  answer: B
  explanation: マニュアルの第3節には、「ライトレール」と道路を共有するための特定の小項目が含まれています。
- id: 13
  category: penalties_and_points
  question: バージニア州において、アルコールと法律に特に関連付けられている免許停止の種類は何ですか？
  choices:
    A: 行政上の免許停止 (Administrative License Suspension)
    B: 財務責任不履行による停止
    C: 医療的審査による停止
    D: 累積点数による停止
  answer: A
  explanation: マニュアルの第5節「アルコールと法律」の項目に、「行政上の免許停止（Administrative License Suspension）」が記載されています。
- id: 14
  category: driver_testing
  question: マニュアルの第1節によると、試験プロセスの一部として義務付けられているスクリーニング（検査）は何ですか？
  choices:
    A: 聴力検査
    B: 反射神経検査
    C: 視力検査
    D: 色覚検査
  answer: C
  explanation: マニュアルの目次第1節には、試験プロセスの一部として「視力検査」と「視力基準」が記載されています。
- id: 15
  category: driver_testing
  question: 学科試験の第1部で、第2部に進むためには何問の交通標識の問題に正解する必要がありますか？
  choices:
    A: 10問中7問
    B: 10問中8問
    C: 10問中9問
    D: 10問すべて
  answer: D
  explanation: 試験の第2部に進む前に、第1部の交通標識の問題10問すべてに正解する必要があります。
- id: 16
  category: driver_testing
  question: 一般知識試験の第2部の合格に必要な最低スコアは何パーセントですか？
  choices:
    A: 70パーセント
    B: 75パーセント
    C: 80パーセント
    D: 85パーセント
  answer: C
  explanation: 第2部では、選択式の問題で一般知識がテストされます。合格するには、これらの問題の少なくとも80パーセントに正解する必要があります。
- id: 17
  category: driver_testing
  question: 18歳未満で知識試験に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: 2日間
    B: 5日間
    C: 10日間
    D: 15日間
  answer: D
  explanation: 試験に不合格となり、かつ18歳未満である場合、法律により再受験までに丸15日間待機しなければなりません。
- id: 18
  category: driver_testing
  question: 知識試験に3回不合格になるとどうなりますか？
  choices:
    A: 永久に免許取得が禁止される。
    B: 再受験まで1年間待たなければならない。
    C: 運転教育の座学課程を修了し、合格しなければならない。
    D: 再受験のために100ドルの罰金を支払わなければならない。
  answer: C
  explanation: 知識試験に3回不合格になった場合、運転教育の座学課程を修了し合格するまで、4回目の受験をすることはできません。
- id: 19
  category: vehicle_information
  question: 路上技能試験（ロードスキルテスト）に使用することが許可されていない車両は次のうちどれですか？
  choices:
    A: ピックアップトラック
    B: 4ドアセダン
    C: オートサイクル（autocycle）
    D: マニュアルトランスミッション車
  answer: C
  explanation: 路上技能試験には車両を自分で用意する必要があります（オートサイクルでの受験はできません）。
- id: 20
  category: driver_testing
  question: 18歳以上で運転教育コースを受講しないことを選択した場合、最初の路上技能試験を受ける前に、仮免許（ラーナーズパーミット）をどのくらいの期間保持する必要がありますか？
  choices:
    A: 15日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: C
  explanation: 18歳以上の申請者は、最初の路上技能試験を受ける前に60日間仮免許を保持するか、運転教育コースを修了する必要があります。
- id: 21
  category: driver_testing
  question: 路上技能試験に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: 2日間
    B: 5日間
    C: 7日間
    D: 15日間
  answer: A
  explanation: 路上技能試験に不合格となった場合、再受験までに2日間待機する必要があります。
- id: 22
  category: license_system
  question: 運転免許証の制限事項「C」は何を示していますか？
  choices:
    A: 日中の運転のみに制限されている。
    B: 運転時に眼鏡またはコンタクトレンズを着用しなければならない。
    C: 商用車のみ運転できる。
    D: 免許を持つ成人が同乗していなければならない。
  answer: B
  explanation: 視力検査に合格するために眼鏡やコンタクトレンズの着用が必要な場合は、運転時にそれらを着用しなければなりません。この制限がある場合、免許証には「C」と表示されます。
- id: 23
  category: license_system
  question: バージニア州における無制限運転免許の視力基準は何ですか？
  choices:
    A: 両眼とも20/20の視力と、180度の水平視野。
    B: 片眼または両眼で20/40以上の視力と、110度以上の水平視野。
    C: 片眼で20/70以上の視力と、70度の水平視野。
    D: 両眼とも20/50の視力と、90度の水平視野。
  answer: B
  explanation: 無制限運転免許の基準は、片目または両目の視力が20/40以上、かつ水平視野が110度以上であることです。
- id: 24
  category: license_system
  question: 日中走行限定の制限付き免許を持つドライバーが運転を許可されている時間はいつですか？
  choices:
    A: 午前6時から午後6時まで。
    B: 日の出から日没まで。
    C: 日の出の30分後から日没の30分前まで。
    D: 日の出の30分前から日没の30分後まで。
  answer: C
  explanation: 日中走行限定の制限付き免許では、日の出の30分後から日没の30分前までの期間のみ運転が許可されます。
- id: 25
  category: safe_driving_rules
  question: 駐車場や野原を通り抜けて交通規制（信号や標識など）を避けることは合法ですか？
  choices:
    A: はい、交差点が事故で塞がっている場合は可能です。
    B: はい、商用車を運転している場合は可能です。
    C: いいえ、このような方法で交通規制を避けることは違法です。
    D: いいえ、右折する場合を除き違法です。
  answer: C
  explanation: 駐車場や野原を通り抜けて、これらの交通規制を避けることは違法です。
- id: 26
  category: signs_and_signals
  question: 赤信号での右折が許可されないのはどのような場合ですか？
  choices:
    A: 「赤信号での右折禁止（No Turn on Red）」の標識がある場合、または右向きの赤の矢印が表示されている場合。
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合。
    C: 横断歩道に歩行者がいない場合。
    D: マニュアル車（MT車）を運転している場合。
  answer: A
  explanation: 交差点に「赤信号での右折禁止（No Turn on Red）」の標識が設置されている場合、または右向きの赤の矢印が表示されている場合は、赤信号で右折することはできません。
- id: 27
  category: signs_and_signals
  question: 赤信号での左折が許可されるのはどのような条件のときですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ曲がる場合。
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合。
    C: 対面通行の道路から別の対面通行の道路へ曲がる場合。
    D: 赤信号での左折は決して許可されません。
  answer: B
  explanation: 一方通行の道路を走行中で、信号が赤のときに別の一方通行の道路へ左折する場合に限り、赤信号での左折が可能です。
- id: 28
  category: signs_and_signals
  question: 信号が赤であるにもかかわらず、警察官から交差点を通過するように指示された場合、どうすべきですか？
  choices:
    A: 停止して、信号が青になるのを待つ。
    B: 警察官の指示に従う。
    C: 進行する前に、他の運転者に警告するためにクラクションを鳴らす。
    D: 車を寄せて停止し、警察官がいなくなるのを待つ。
  answer: B
  explanation: 警察官による指示がある場合を除き、すべての標識や信号に従わなければなりませんが、警察官がいる場合は常にその指示が優先されます。
- id: 29
  category: driver_testing
  question: DMVでの路上試験（実技試験）に3回不合格となった場合、何が必要ですか？
  choices:
    A: 再試験を受けるまで60日間待たなければならない。
    B: 2部構成の知識試験（学科試験）を再受験しなければならない。
    C: 運転教育の実技講習を修了し、合格しなければならない。
    D: 50ドルの罰金を支払わなければならない。
  answer: C
  explanation: DMVでの路上試験に3回不合格となった場合、DMVまたは教育局が承認した自動車教習所で運転教育の実技講習を修了し合格するまで、4回目の試験を受けることはできません。
- id: 30
  category: signs_and_signals
  question: バージニア州において、赤信号で左折ができるのはどのような条件のときですか？
  choices:
    A: 交差点に対向車がいないときはいつでも可能。
    B: 一方通行の道路から別の一方通行の道路へ、完全に一時停止した後に曲がる場合。
    C: 対面通行の道路から一方通行の道路へ曲がる場合。
    D: いかなる状況においても、赤信号での左折は許可されない。
  answer: B
  explanation: 一方通行の道路から別の一方通行の道路へ左折する場合、信号が赤であっても、まず完全に一時停止をした後であれば左折することができます。
- id: 31
  category: signs_and_signals
  question: 赤の矢印信号は何を意味しますか？
  choices:
    A: 歩行者に道を譲った後であれば、矢印の方向に進むことができる。
    B: 停止しなければならず、標識で許可されていない限り、矢印の方向に進むことはできない。
    C: 完全に一時停止した後であれば、矢印の方向に曲がることができる。
    D: 信号がまもなく青に変わるため、加速の準備をすることを意味する。
  answer: B
  explanation: 赤の矢印は、その矢印の方向に進もうとする場合に停止しなければならないことを意味します。「一時停止後、赤の矢印で右折可」または「一時停止後、赤の矢印で左折可」という標識がない限り、進むことはできません。
- id: 32
  category: safe_driving_rules
  question: 停電により交通信号が作動していない交差点に差し掛かった場合、どのように進行すべきですか？
  choices:
    A: 右側の車両に道を譲り、停止せずに進行する。
    B: 減速し、完全に停止することなく注意して進行する。
    C: 一時停止し、全方向一時停止（all-way stop）の交差点であるかのように進行する。
    D: 警察官が到着するまで交差点で待機する。
  answer: C
  explanation: 停電などの問題で信号機が作動しておらず、灯火が表示されていない場合は、一時停止が必要です。その際、全方向一時停止の交差点と同じルールで進行してください。
- id: 33
  category: signs_and_signals
  question: 車線利用制御信号の「黄色のX印」または「斜め下向きの黄色い矢印」は何を示していますか？
  choices:
    A: 安全が確認でき次第、速やかにその車線から移動すべきであること。
    B: 掲示された制限速度でその車線を走行してよいこと。
    C: その車線内で完全に一時停止しなければならないこと。
    D: その車線は左折専用としてのみ使用できること。
  answer: A
  explanation: 黄色のX印または斜め下向きの黄色い矢印は、その車線が閉鎖されるか進行方向が変わる準備段階であることを示しており、安全が確認でき次第速やかにその車線から出る必要があります。
- id: 34
  category: signs_and_signals
  question: 歩行者ハイブリッドビーコン（PHB）が赤色で交互に点滅しているとき、運転者はどうすべきですか？
  choices:
    A: 信号がまもなく赤の点灯に変わるため、停止の準備をする。
    B: 横断歩道に歩行者がいなければ、注意して進行する。
    C: 停止し、信号が青に変わるまで無期限に待つ。
    D: 交差点を素早く通過するために加速する。
  answer: B
  explanation: 歩行者用信号がカウントダウンしている間、PHBの2つの赤色灯が交互に点滅します。これは、横断歩道に歩行者がいなくなれば、注意して進行してもよいことを運転者に示しています。
- id: 35
  category: signs_and_signals
  question: ピンクと黒の交通標識はどのような情報を伝えていますか？
  choices:
    A: 工事区域。
    B: ドライバー向けサービス（休憩所など）。
    C: 歴史的または文化的関心事。
    D: 事故・事案発生エリア（インシデントエリア）。
  answer: D
  explanation: ピンクと黒の標識は、事故や災害などの事案が発生しているエリアにおいて、運転者に助言や警告を与えるために使用されます。
- id: 36
  category: signs_and_signals
  question: 五角形の交通標識は何を示していますか？
  choices:
    A: 一時停止。
    B: 譲れ。
    C: スクールゾーンおよび通学路の横断歩道。
    D: 前方の特殊な状況または危険。
  answer: C
  explanation: 5つの辺を持つ五角形はスクールゾーンを示し、通学路の横断歩道について警告します。
- id: 37
  category: signs_and_signals
  question: ひし形の交通標識の意味は何ですか？
  choices:
    A: 指示を与える、または法律を伝える。
    B: 前方の特殊な状況や危険を警告する。
    C: 追い越し禁止区間の始まりを示す。
    D: 前方に踏切があることを示す。
  answer: B
  explanation: ひし形の標識は、前方の特殊な状況や危険を警告します。速度を落とし、注意して運転する必要があります。
- id: 38
  category: safe_driving_rules
  question: 制限速度の標識と天候条件に関して、次のうち正しいものはどれですか？
  choices:
    A: 天候に関わらず、掲示された制限速度で走行していれば違反切符を切られることはない。
    B: 掲示された制限速度は、雨、雪、または凍結時のみ適用される。
    C: 掲示された制限速度以下で走行していても、状況に対して速すぎる場合は違反切符を切られることがある。
    D: 雨が降ると制限速度は自動的に時速10マイル下がる。
  answer: C
  explanation: 雨、雪、凍結時には、掲示された制限速度以下で走行していても、その状況に対して速度が速すぎる場合は違反切符を切られることがあります。
- id: 39
  category: safe_driving_rules
  question: バージニア州では、「左折禁止（No Left Turn）」の標識がある交差点でUターンは許可されていますか？
  choices:
    A: はい。「Uターン禁止」の標識も掲示されていない限り、許可される。
    B: はい。ただし交差点に全く車両がいない場合に限る。
    C: いいえ。Uターンは2回の左折とみなされるため、左折禁止の標識がある場合は違法となる。
    D: いいえ。バージニア州のすべての交差点でUターンは違法である。
  answer: C
  explanation: バージニア州では、Uターンは2回の左折とみなされるため、「左折禁止」の標識がある場所でのUターンは違法です。
- id: 40
  category: signs_and_signals
  question: 黄色の点滅信号は何を意味しますか？
  choices:
    A: 完全に停止し、対向車に道を譲る。
    B: 徐行し、注意して進む。
    C: 信号機が故障している。
    D: 矢印の方向に進む場合は停止する。
  answer: B
  explanation: 黄色の点滅信号は、徐行して注意深く進むことを意味します。黄色の点滅信号は、通常よりも危険な状況にある場所に設置されています。
- id: 41
  category: signs_and_signals
  question: 茶色と白の交通標識の目的は何ですか？
  choices:
    A: 目的地に関する情報を提供する。
    B: ドライバー向けのサービスについて知らせる。
    C: その地域の歴史的または文化的関心事について案内する。
    D: 工事中であることを警告する。
  answer: C
  explanation: 茶色の標識は、その地域に存在する可能性のある歴史的または文化的関心事について案内するために使用されます。
- id: 42
  category: signs_and_signals
  question: 黄色の点灯信号の交差点に近づき、まだ交差点に進入していない場合、どうすべきですか？
  choices:
    A: 赤信号になる前に通過できるよう加速する。
    B: 安全に停止できない場合を除き、停止する。
    C: 現在の速度のまま交差点を通過する。
    D: 路肩に車を寄せる。
  answer: B
  explanation: 黄色の信号は、信号がもうすぐ変わることを知らせる警告です。まだ交差点に進入していない場合は停止してください。ただし、安全に停止できない場合は、注意して通過してください。
- id: 43
  category: sharing_the_road
  question: 歩行者が交差点内にいるときに、信号が赤から黄色の点滅矢印に変わった場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして、歩行者に素早く動くよう促す。
    B: 優先権があるため、すぐに曲がる。
    C: 歩行者が通りを渡り終えてから曲がる。
    D: 交差点を空けるために、歩行者の周りをゆっくりと運転する。
  answer: C
  explanation: 歩行者が交差点内にいるときに信号が赤から黄色の点滅矢印に変わった場合は、歩行者が通りを渡り終えるのを待ってから曲がってください。
- id: 44
  category: safe_driving_rules
  question: 4方向一時停止（4-Way stop）の交差点で、他の車両と同時に到着した場合、どちらが譲らなければなりませんか？
  choices:
    A: 右側のドライバーが左側のドライバーに譲らなければならない。
    B: 左側のドライバーが右側のドライバーに譲らなければならない。
    C: 直進するドライバーが右左折するドライバーに譲らなければならない。
    D: 大きい車両のドライバーが優先権を持つ。
  answer: B
  explanation: 「全方向（All Way）」または「4方向（4 Way）」一時停止の交差点に他の車両と同時に到着した場合、左側のドライバーは右側のドライバーに道を譲らなければなりません。
- id: 45
  category: signs_and_signals
  question: 推奨速度（Advisory Speed）標識は何を示していますか？
  choices:
    A: 高速道路の最低速度制限。
    B: 高速道路の出口における最大安全速度。
    C: スクールゾーンの制限速度。
    D: 追い越し時の推奨速度。
  answer: B
  explanation: マニュアルによると、推奨速度標識は高速道路の出口における最大安全速度を示しています。
- id: 46
  category: sharing_the_road
  question: 州法では、馬車を追い越す際にどのくらいの距離を空けることが義務付けられていますか？
  choices:
    A: 少なくとも2フィート
    B: 少なくとも3フィート
    C: 少なくとも4フィート
    D: 少なくとも5フィート
  answer: B
  explanation: 州法では、前方が安全な場合、自動車は馬車を追い越す際に少なくとも3フィートの距離を空けることが義務付けられています。
- id: 47
  category: safe_driving_rules
  question: 「濡れているとき滑りやすい（Slippery When Wet）」の標識がある道路を走行中に路面が濡れている場合、どうすべきですか？
  choices:
    A: 急ブレーキをかけてトラクションを確認する。
    B: 前の車との車間距離を詰める。
    C: 前の車との車間距離を広げる。
    D: 通常の速度を維持し、頻繁に車線変更を行う。
  answer: C
  explanation: 路面が濡れている場合、マニュアルでは速度を落とし、急ブレーキや急な方向転換を避け、前の車との車間距離を広げるよう指示されています。
- id: 48
  category: signs_and_signals
  question: ラウンドアバウト（環状交差点）に接近する際の適切な手順は何ですか？
  choices:
    A: 譲り合いをせずに進入し、時計回りに走行する。
    B: すでに環状交差点内にいる車両に道を譲り、反時計回りに走行する。
    C: 完全に停止し、青信号を待つ。
    D: 環状交差点に進入してくる車両に道を譲り、時計回りに走行する。
  answer: B
  explanation: ラウンドアバウトでは、進入する車両はすでに環状交差点内にいる車両に優先権を譲り、反時計回りに走行しなければなりません。
- id: 49
  category: defensive_driving
  question: 踏切内で車が動かなくなった（エンストした）場合、どうすべきですか？
  choices:
    A: 車内にとどまり、911に通報する。
    B: 車から降りて、列車が進んでいる方向と同じ方向に走る。
    C: 自分で車を線路から押し出そうとする。
    D: すぐに車から降りて、線路から離れるように、近づいてくる列車の方向へ斜めに走る。
  answer: D
  explanation: 線路上で車が動かなくなった場合、マニュアルではすぐに車から降りて、線路から離れるように、近づいてくる列車の方向へ斜めに走るよう指示されています。
- id: 50
  category: penalties_and_points
  question: ハイウェイの工事区域（ワークゾーン）で手持ちの通信機器を使用したことで有罪判決を受けた場合の罰金はいくらですか？
  choices:
    A: 100ドルの罰金
    B: 250ドルの罰金
    C: 500ドルの罰金
    D: 30日間の免許停止
  answer: B
  explanation: ハイウェイの工事区域で手持ちの通信機器を使用したことで有罪判決を受けた場合、250ドルの罰金が科せられます。
- id: 51
  category: penalties_and_points
  question: ハイウェイの工事区域（ワークゾーン）で速度制限を超過した場合の最大罰金はいくらですか？
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: ハイウェイの工事区域で速度制限を超過して有罪判決を受けた場合、最大500ドルの罰金が科せられることがあります。
- id: 52
  category: signs_and_signals
  question: 「追い越し禁止区域（No Passing Zone）」の標識は何を意味しますか？
  choices:
    A: 前方が安全であれば、車を追い越してもよい。
    B: 前方が安全であっても、自分の車線の前方を走る車を追い越してはならない。
    C: 商用車のみ追い越しが禁止されている。
    D: 前方の車両が制限速度以下で走行している場合に限り、追い越してもよい。
  answer: B
  explanation: 「追い越し禁止区域」の標識は、前方が安全であっても、自分の車線の前方を走る車を追い越してはならない区域の始まりを示しています。
- id: 53
  category: sharing_the_road
  question: 信号が点滅していないときでも、常に踏切で停止しなければならない車両はどれですか？
  choices:
    A: 乗用車
    B: オートバイ
    C: スクールバス
    D: 配送トラック
  answer: C
  explanation: マニュアルには、スクールバスは信号が点滅していないときでも、常に踏切で停止しなければならないと記されています。
- id: 54
  category: safe_driving_rules
  question: バリケードやコーンなどの交通規制装置がある工事区域（ワークゾーン）を走行する際、どうすべきですか？
  choices:
    A: 車両を車線の中央に保ち、完全に通過するまで車線変更をしない。
    B: 他の車両のためにスペースを空けるよう、規制装置にできるだけ近づいて走行する。
    C: 規制装置を避けるために頻繁に車線変更を行う。
    D: 工事区域を素早く抜けるために速度を上げる。
  answer: A
  explanation: 工事区域内の交通規制装置の近くを走行する際は、車両を車線の中央に保ち、制限速度を守り、工事区域を完全に抜けるまで車線変更をしないでください。
- id: 55
  category: signs_and_signals
  question: 工事区域（ワークゾーン）を示し、減速して注意を払う必要があることを意味する色はどれですか？
  choices:
    A: 赤
    B: 黄
    C: オレンジ
    D: 緑
  answer: C
  explanation: オレンジ色は工事区域を示し、減速して注意を払うことを意味します。
- id: 56
  category: sharing_the_road
  question: 「路面ジョイントあり（Open Joints）」の標識が、特に二輪車（モーターサイクル）の運転者にとって重要なのはなぜですか？
  choices:
    A: 指定された二輪車専用の駐輪場であることを示しているため。
    B: 路面の継ぎ目（ジョイント）によって、二輪車の運転者がコントロールを失う可能性があるため。
    C: 二輪車専用の車線であることを示しているため。
    D: 二輪車にのみ影響を与える強風を警告しているため。
  answer: B
  explanation: マニュアルでは、橋やランプ（接続道路）にある路面の継ぎ目によって二輪車の運転者がコントロールを失う可能性があるため、減速するように警告しています。
- id: 57
  category: safe_driving_rules
  question: 同じ方向に進む2つの車線が1つに合流（Merge）しようとしている場合、安全に合流する責任は誰にありますか？
  choices:
    A: 右側車線の運転者のみ。
    B: 左側車線の運転者のみ。
    C: 両方の車線の運転者に、安全に合流する責任がある。
    D: より大きな車両の運転者。
  answer: C
  explanation: 2車線が1車線になる合流地点では、両方の車線の運転者が安全に合流する責任を負います。
- id: 58
  category: signs_and_signals
  question: 「低床車両注意（Low Ground Railroad Crossing）」の標識は、運転者に何を警告していますか？
  choices:
    A: 踏切が現在工事中であること。
    B: この区域では列車が低速で走行していること。
    C: 急な勾配のため、車高の低い車両の底が線路に引っかかったり、引きずったりする可能性があること。
    D: 車高の低い車両のみが通行を許可されていること。
  answer: C
  explanation: この標識は、道路が線路を横切る場所で勾配が急になっており、車高の低い車両の底が線路に引っかかったり引きずったりする可能性があることを警告しています。
- id: 59
  category: safe_driving_rules
  question: 工事区間（work zone）を離れる際、どのようにすべきですか？
  choices:
    A: 通常の交通の流れに戻るため、すぐに加速する。
    B: 工事車両を避けるために車線を変更する。
    C: 完全に離れるまで、現在の車線を維持し、速度を保つ。
    D: 停車して、車両に破片による損傷がないか確認する。
  answer: C
  explanation: 工事区間を離れる際は、現在の車線を維持し、速度を保ってください。工事区間を完全に抜けるまでは車線を変更しないでください。
- id: 60
  category: signs_and_signals
  question: 低速車両（slow-moving vehicle）の標識を表示している車両の最高速度はどれくらいですか？
  choices:
    A: 15 MPH
    B: 25 MPH
    C: 35 MPH
    D: 45 MPH
  answer: B
  explanation: 農耕器具、馬車、道路工事車両など、25 MPH以下で走行する低速車両が公道を使用する場合は、この標識を表示しなければなりません。
- id: 61
  category: signs_and_signals
  question: 路面にある赤色の反射板は何を示していますか？
  choices:
    A: 近くに消火栓があること。
    B: 4方向一時停止（four-way stop）に近づいていること。
    C: 逆走（間違った方向へ進行）しており、進入してはならないこと。
    D: この先にスクールゾーンがあること。
  answer: C
  explanation: 路面の赤色の反射板は、進入禁止または使用禁止の区域を示しています。これらは、間違った方向に進んでいる車両からのみ見えるように路面に配置されています。
- id: 62
  category: safe_driving_rules
  question: 道路中央の二重の実線の黄線を越えてもよいのはどのような時ですか？
  choices:
    A: 低速で走行するトラクターを追い越す時。
    B: 左折する場合、または歩行者や自転車を追い越す時。
    C: 前方の車両が制限速度以下で走行している時。
    D: 二重の実線の黄線を越えることは決して許されない。
  answer: B
  explanation: どちらの方向からも追い越しは禁止されています。ただし、左折する場合、または対向車線に車がいない状態で歩行者、自転車、スクーターやスケートボードの利用者を追い越す場合を除き、この線を越えることはできません。
- id: 63
  category: signs_and_signals
  question: 間隔の狭い小さな長方形で構成される点線の白線の目的は何ですか？
  choices:
    A: 歩行者用横断歩道を示すため。
    B: 交差点やインターチェンジ内での車線指定を示すため。
    C: 路面の右端の境界を示すため。
    D: 反対方向に進む交通を分けるため。
  answer: B
  explanation: この点線の白線は、実際には一連の小さな長方形です。これらは、車線を逸脱しやすい交差点やインターチェンジにおいて、車線の割り当てを示すために使用されます。
- id: 64
  category: safe_driving_rules
  question: 3車線の道路で、中央車線の両側が実線の黄線と破線の黄線でマークされている場合、この車線をどれくらいの距離まで走行できますか？
  choices:
    A: 50フィートまで。
    B: 100フィートまで。
    C: 150フィートまで。
    D: 200フィートまで。
  answer: C
  explanation: 中央車線の両側が実線の黄線と破線の黄線でマークされている場合、どちらの方向から来る運転者も左折のためにこの車線を使用できます。ただし、この車線を150フィートを超えて走行することはできません。
- id: 65
  category: sharing_the_road
  question: 共有車線マーク（sharrow）は何を示していますか？
  choices:
    A: その車線は自転車専用であること。
    B: その車線は、自動車と自転車が並んで走行するには幅が狭すぎること。
    C: 自転車は常に自動車に道を譲らなければならないこと。
    D: 自動車のその車線への進入は禁止されていること。
  answer: B
  explanation: 共有車線マーク（シャロウ）は、自動車と自転車が安全に並んで走行するには幅が狭すぎる走行車線で使用されます。
- id: 66
  category: sharing_the_road
  question: 自転車用停止スペース（バイシクルボックス）が描かれ、赤信号である交差点に差し掛かった場合、どこで停止しなければなりませんか？
  choices:
    A: 自転車用停止スペースの中。
    B: すべての自転車用停止スペースの手前（後ろ）。
    C: 自転車用停止スペースを越えた交差点内。
    D: 右折する場合は停止する必要はない。
  answer: B
  explanation: 運転者は赤信号の場合、自転車用停止スペースの中ではなく、すべてのスペースの手前で停止しなければなりません。
- id: 67
  category: sharing_the_road
  question: 自転車用停止スペースがある交差点で、赤信号での右折は許可されていますか？
  choices:
    A: はい、最初に自転車に道を譲れば可能です。
    B: はい、ただし自転車用停止スペースが緑色に塗られている場合に限ります。
    C: いいえ、これらの交差点では赤信号での右折は許可されていません。
    D: いいえ、高占有車両（HOV）を運転している場合を除き許可されません。
  answer: C
  explanation: これらの交差点（自転車用停止スペースがある場所）では、赤信号での右折は許可されていません。
- id: 68
  category: safe_driving_rules
  question: 交通渋滞時に、一般的に高占有車両（HOV）車線の使用が許可されているのは次のうちどの車両ですか？
  choices:
    A: 65 MPH以上で走行しているすべての車両。
    B: 商業用貨物トラック。
    C: オートバイ。
    D: トレーラーを牽引している車両。
  answer: C
  explanation: 交通渋滞時、HOVレーンはバス、バンプール、相乗り車両（カープール）、その他の高占有車両、オートバイ、および特定のクリーン燃料車専用となります。
- id: 69
  category: safe_driving_rules
  question: トランスポンダー（車載器）を持たずに誤って高速E-ZPass料金所に進入してしまった場合、どうすべきですか？
  choices:
    A: すぐに停止してバックする。
    B: 路肩に寄せて料金所の係員を待つ。
    C: 停止してカメラの場所で現金で支払う。
    D: 停止しないでください。登録されている車両所有者に通行料金の請求書が送られます。
  answer: D
  explanation: 誤ってそれらの車線に進入してしまった場合は、停止しないでください。停止することは危険であり、追突事故の原因となる可能性があります。カメラが車のナンバープレートを撮影し、登録されている車両所有者に通行料金の請求書が送られます。
- id: 70
  category: signs_and_signals
  question: 黄色く塗られた縁石は何を意味しますか？
  choices:
    A: 乗客の乗り降りのための短時間の停車のみ可能。
    B: 荷物の積み降ろしのための短時間の停車のみ可能であり、車を離れてはいけない。
    C: 停車、駐停車禁止。
    D: 30分以内の駐車が可能。
  answer: B
  explanation: 黄色 — 荷物の積み降ろしのための短時間の停車のみ可能です。車から離れないでください。
- id: 71
  category: safe_driving_rules
  question: 道路工事区域の手前で走行車線を横切るように設置されたランブルストリップス（路面凹凸）に対し、運転者はどのように対処すべきですか？
  choices:
    A: タイヤの損傷を避けるために避けて通る。
    B: 素早く通過するために加速する。
    C: 避けたりせず、ゆっくりとその上を走行する。
    D: 通過する直前に停止する。
  answer: C
  explanation: ランブルストリップスは、避けて通るのではなく、ゆっくりとその上を走行する必要があります。
- id: 72
  category: signs_and_signals
  question: 二重の実線の白線を越えることに関する規則は何ですか？
  choices:
    A: 車線変更のために注意して越えてもよい。
    B: 低速車両を追い越す時のみ越えてもよい。
    C: これらの線を越えてはならない。
    D: Uターンのために越えてもよい。
  answer: C
  explanation: 二重の実線の白線は、同じ方向に進む車線を区分しています。これらの線を越えることは禁止されています。
- id: 73
  category: signs_and_signals
  question: 路面を横切って引かれる「譲れ（Yield）」ラインには、どのような形が使われますか？
  choices:
    A: 正方形
    B: 円形
    C: 三角形
    D: 菱形
  answer: C
  explanation: 譲れラインは路面を横切る三角形の列で、譲れ（Yield）の標識とともに使用され、譲るか停止しなければならない地点を示すために使われることがあります。
- id: 74
  category: safe_driving_rules
  question: ハンドルを握る際の推奨される手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置
    C: 8時と4時の位置
    D: 7時と5時の位置
  answer: C
  explanation: マニュアルには、ハンドルを時計に見立てた場合、両手は8時と4時の位置にあるべきだと記載されています。
- id: 75
  category: penalties_and_points
  question: バージニア州法において、どのような運転をした場合に無謀運転（reckless driving）で起訴される可能性がありますか？
  choices:
    A: 制限速度を10 MPH以上超えて走行した場合。
    B: 制限速度を15 MPH以上超えて走行した場合。
    C: 制限速度を20 MPH以上超えて走行した場合、または85 MPHを超えて走行した場合。
    D: あらゆる幹線道路で75 MPHを超えて走行した場合。
  answer: C
  explanation: バージニア州法によれば、制限速度を20マイル毎時（MPH）以上超えて走行した場合、または85 MPHを超えて走行した場合、法執行官によって無謀運転で起訴される可能性があります。
- id: 76
  category: safe_driving_rules
  question: 標識による指定がない場合、未舗装路における乗用車の最高速度制限は何マイルですか？
  choices:
    A: 25 MPH
    B: 35 MPH
    C: 45 MPH
    D: 55 MPH
  answer: B
  explanation: 速度制限の標識で別途定められていない限り、未舗装路における乗用車およびオートバイの最高速度制限は35 MPHです。
- id: 77
  category: safe_driving_rules
  question: バージニア州におけるレーダー探知機に関する記述のうち、正しいものはどれですか？
  choices:
    A: 州間高速道路でのみ合法である。
    B: 乗用車では合法だが、商用車では違法である。
    C: バージニア州でレーダー探知機を使用することは違法である。
    D: 制限速度以下で走行している場合は許可される。
  answer: C
  explanation: マニュアルには「バージニア州でレーダー探知機を使用することは違法である」と明記されています。
- id: 78
  category: penalties_and_points
  question: 法執行官の停止信号に従わず、その結果として追跡を行った官吏が死亡した場合、どのような罰則が科されますか？
  choices:
    A: 第1級軽罪 (Class 1 misdemeanor)
    B: 第4級重罪 (Class 4 felony)
    C: 500ドルの罰金と免許停止
    D: 交通違反 (traffic infraction)
  answer: B
  explanation: 法執行官の停止信号に従わず、追跡の結果として官吏が死亡した場合、第4級重罪（Class 4 felony）に問われます。
- id: 79
  category: sharing_the_road
  question: 赤色の点滅灯を点灯させて停車しているスクールバスに対して、停止する必要が「ない」のはどのような場合ですか？
  choices:
    A: 多車線道路で同じ方向に走行している場合。
    B: 中央分離帯や障壁で仕切られた道路で、反対方向を走行している場合。
    C: 私道や学校のドライブウェイにいる場合。
    D: バスが乗客を乗せているが、停止サイン（ストップアーム）が出ていない場合。
  answer: B
  explanation: 中央分離帯や障壁で仕切られた道路で反対方向を走行しており、バスが反対側にいる場合は、停止する必要はありません。
- id: 80
  category: safe_driving_rules
  question: 「反応距離 (reaction distance)」について説明しているのはどれですか？
  choices:
    A: 危険を認識するまでにかかる時間。
    B: 問題を認識してからブレーキを踏むまでの間に車両が走行する距離。
    C: ブレーキを踏んだ後に車が走行する距離。
    D: 時速60マイルから車両が停止するまでに必要な総距離。
  answer: B
  explanation: 反応距離とは、問題を認識してからブレーキを踏むまでの間に車両が走行する距離と定義されています。
- id: 81
  category: safe_driving_rules
  question: 濡れた路面は車両の停止距離にどのような影響を与えますか？
  choices:
    A: 制動距離が2倍になる可能性がある。
    B: 知覚時間が短縮される。
    C: 反応距離が短くなる。
    D: アンチロックブレーキ（ABS）を装備していれば影響はない。
  answer: A
  explanation: マニュアルには、路面の状態が制動距離に影響を与えると記されており、例えば濡れた路面では制動距離が2倍になる可能性があります。
- id: 82
  category: vehicle_information
  question: アンチロックブレーキ（ABS）を装備した車両を運転する際、覚えておくべきことは何ですか？
  choices:
    A: 滑りやすい路面で停止するときは、ブレーキを軽くポンピングする。
    B: アンチロックブレーキをポンピングしてはいけない。
    C: パーキングブレーキを同時にかける。
    D: 雨天時はシステムをオフにする。
  answer: B
  explanation: マニュアルには「アンチロックブレーキをポンピングしてはいけない」と明記されています。
- id: 83
  category: sharing_the_road
  question: 4車線未満の道路で停車中のゴミ収集車を追い越す際、車線変更ができない場合はどうしなければなりませんか？
  choices:
    A: 停車して、その車両が移動するのを待つ。
    B: クラクションを鳴らし、速度を維持する。
    C: 制限速度より時速10マイル低い速度まで減速し、左側を少なくとも2フィート離れて通過する。
    D: できるだけ早く車両を追い越すために加速する。
  answer: C
  explanation: 4車線未満の道路、または車線変更ができない場合は、制限速度より時速10マイル低い速度まで減速し、車両の左側を少なくとも2フィート離れて通過してください。
- id: 84
  category: safe_driving_rules
  question: 緊急車両がライトを点滅させている場合、維持しなければならない最小車間距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: マニュアルには「ライトを点滅させている緊急車両の後方を走行する際は、500フィート以上の車間距離を保つこと」と記されています。
- id: 85
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に入った後、運転者はどの方向に進まなければなりませんか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 中央島を直進
    D: 出口までの最短方向
  answer: B
  explanation: ラウンドアバウトに入った後、運転者は反時計回りに進まなければなりません。
- id: 86
  category: safe_driving_rules
  question: 標識や信号のない交差点に、異なる方向から2台の車両が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転手は、右側の運転手が先に進むのを待たなければならない。
    B: 右側の運転手は、左側の運転手が先に進むのを待たなければならない。
    C: より速い速度で走行している車両が先に進む。
    D: 左折する車両が先に進む。
  answer: A
  explanation: 標識や信号のない交差点に異なる方向から車両が同時に到着した場合、左側の運転手は右側の運転手に道を譲らなければなりません。
- id: 87
  category: signs_and_signals
  question: 交差点の信号機が作動していない場合、どうしなければなりませんか？
  choices:
    A: 道が空いていれば、停止せずに交差点を通過する。
    B: 交差点を「譲れ（yield）」の標識があるものとして扱う。
    C: すべての車両が停止しなければならず、左側の運転手は右側の運転手に道を譲らなければならない。
    D: 右側の運転手は、左側の運転手に道を譲らなければならない。
  answer: C
  explanation: 交差点の信号機が作動していない場合、その交差点に入るすべての車両は停止しなければなりません。その際、左側の運転手は右側の運転手に道を譲る必要があります。
- id: 88
  category: safe_driving_rules
  question: 私道やドライブウェイから車道に入る際、どうしなければなりませんか？
  choices:
    A: 素早く加速して交通の流れに合流する。
    B: 停止し、すべての交通と歩行者に道を譲る。
    C: クラクションを鳴らし、停止せずに進む。
    D: 左から接近してくる車両にのみ道を譲る。
  answer: B
  explanation: マニュアルには、私道やドライブウェイから車道に入る際は、停止してすべての交通と歩行者に道を譲らなければならないと記載されています。
- id: 89
  category: sharing_the_road
  question: 道路上で葬列（葬儀の列）に遭遇した場合、どのように対応すべきですか？
  choices:
    A: 急いでいる場合は、列を横切ってもよい。
    B: 葬列に道を譲り、決して列を横切ったり加わったりしてはならない。
    C: 信号を避けるために、葬列に加わるべきである。
    D: 葬列の右側を追い越さなければならない。
  answer: B
  explanation: 葬列には道を譲らなければなりません。マニュアルには、葬列を横切ったり、加わったり、妨害したりしてはならないと明記されています。
- id: 90
  category: penalties_and_points
  question: 点滅灯をつけた停車中の緊急車両に接近する際、注意して進まなかったり安全に車線変更しなかったりした場合の罰則は何ですか？
  choices:
    A: 初回違反時は書面による警告。
    B: 義務的な社会奉仕活動。
    C: 裁判所による運転免許の停止および違反点数の加算。
    D: 即時の車両押収。
  answer: C
  explanation: 点滅灯をつけた停車中の車両に接近する際の規則に違反すると、裁判所による運転免許の停止や、運転記録への違反点数の加算が科される可能性があります。
- id: 91
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内で、出口から出たいことを他の運転手に知らせるためにどの合図を使うべきですか？
  choices:
    A: 左のウィンカー。
    B: 右のウィンカー。
    C: ハザードランプ。
    D: ラウンドアバウト内では合図は不要。
  answer: B
  explanation: ラウンドアバウト内では、出口から出る準備ができたときに、周囲の運転手に自分の意図を知らせるために右のウィンカー（右折信号）を使用しなければなりません。
- id: 92
  category: safe_driving_rules
  question: 多車線の高速道路を走行中、左車線は主に何のために使用されますか？
  choices:
    A: 制限速度での巡航。
    B: 低速の交通用。
    C: 追い越し専用。
    D: 高速道路の出口用。
  answer: C
  explanation: マニュアルでは、多車線の高速道路を走行する場合、左車線は巡航用ではなく追い越し専用であると規定されています。
- id: 93
  category: safe_driving_rules
  question: 他の車両を追い越した後、右車線に戻っても安全なのはいつですか？
  choices:
    A: 追い越した車両と並んだ直後。
    B: バックミラーに追い越した車両のフロント部分が見えたとき。
    C: 相手のリアバンパーを通り過ぎて3秒後。
    D: 追い越された車両がヘッドライトを点滅させたとき。
  answer: B
  explanation: バックミラーに追い越した車両のフロント部分が見えたら、すぐに右車線に戻るべきです。
- id: 94
  category: sharing_the_road
  question: 自転車に乗っている人に接近または追い越す際、どの程度の間隔を空けなければなりませんか？
  choices:
    A: 左側に少なくとも2フィート。
    B: 左側に少なくとも3フィート。
    C: 左側に少なくとも4フィート。
    D: 左側に少なくとも5フィート。
  answer: B
  explanation: 自転車、モペッド、または電動アシスト自転車に乗っている人に接近または追い越す際は、速度を落とし、左側に少なくとも3フィート（約0.9メートル）の間隔を空けて通過しなければなりません。
- id: 95
  category: defensive_driving
  question: 他の車両に追い越されているとき、どうすべきですか？
  choices:
    A: 追い越しを防ぐために加速する。
    B: 左車線に移動する。
    C: 一定の速度を維持するか、速度を落とす。
    D: ハイビームを点滅させる。
  answer: C
  explanation: マニュアルでは、追い越される際は加速してはならないと助言しています。一定の速度を維持するか、必要に応じて速度を落とすべきです。
- id: 96
  category: safe_driving_rules
  question: 追い越しが違法かつ危険とみなされるのは、次のうちどの状況ですか？
  choices:
    A: 同じ方向に進む複数の車線がある高速道路。
    B: 車線の左側に実線があるとき。
    C: 前方の車両が左折中で、自車が舗装路上にとどまっているとき。
    D: 前方500フィートがはっきりと見通せるとき。
  answer: B
  explanation: 車線の左側に実線がある場合、追い越しは違法で危険です。
- id: 97
  category: defensive_driving
  question: コントロールを失うのを避けるため、カーブや直線の道路から外れてしまった場合はどうすべきですか？
  choices:
    A: パニックになり、すぐに急ブレーキをかける。
    B: ハンドルを道路の方へ急激に切る。
    C: トラクションを回復させるために加速する。
    D: 徐々に速度を落とし、進みたい方向を見て、ゆっくりとハンドルを戻す。
  answer: D
  explanation: 道路から外れてしまった場合、パニックにならないでください。過剰な修正（急ハンドル）を避けるため、徐々に速度を落とし、進みたい方向を見て、ゆっくりと車道にハンドルを戻します。
- id: 98
  category: defensive_driving
  question: 左折待ちの間、前輪をまっすぐ前に向けておくべきなのはなぜですか？
  choices:
    A: 信号が青になったときに、より速く加速できるから。
    B: 後ろから追突された際に、対向車線に押し出されるのを防ぐため。
    C: パワーステアリングシステムの摩耗を抑えるため。
    D: 他のドライバーに道を譲っていることを知らせるため。
  answer: B
  explanation: 実際に左折を開始するまで前輪をまっすぐ前に向けておくことで、後続車に追突された際に対向車線へ押し出されるのを防ぐことができます。
- id: 99
  category: safe_driving_rules
  question: 2台の車両が互いに接近し、共に左折の合図を出している場合、どのように進むべきですか？
  choices:
    A: 両方の車両が互いの後ろを通って曲がる。
    B: 右側の車両に優先権がある。
    C: 両方の車両が互いの前を通って、助手席側が隣り合うように曲がる。
    D: 両方の車両が停止し、青の矢印信号を待たなければならない。
  answer: C
  explanation: 2台の車両が互いに接近し、共に左折の合図を出している場合、両方の車両は互いの前を通り、助手席側が隣り合うように曲がる必要があります。
- id: 100
  category: safe_driving_rules
  question: 商業地区、市街地、および町において、Uターン（転回）が許可されているのはどこですか？
  choices:
    A: 黄色の破線がある場所ならどこでも。
    B: 交差点のみ。
    C: あらゆる高速道路上。
    D: 道が空いていればブロックの中ほど。
  answer: B
  explanation: 商業地区、市街地、および町では、Uターンは交差点でのみ許可されています。
- id: 101
  category: safe_driving_rules
  question: 曲がる何秒前、または何フィート手前で合図を出すべきですか？
  choices:
    A: 少なくとも1〜2秒前、50フィート手前。
    B: 少なくとも3〜4秒前、100フィート手前。
    C: 少なくとも5〜6秒前、200フィート手前。
    D: ハンドルを切り始めると同時。
  answer: B
  explanation: 曲がる少なくとも3〜4秒前、または100フィート手前で合図を出す必要があります。
- id: 102
  category: signs_and_signals
  question: 左手と腕を下に向けている合図は何を示していますか？
  choices:
    A: 左折。
    B: 右折。
    C: 徐行または停止。
    D: 注意して進む。
  answer: C
  explanation: マニュアルの手信号ガイドによると、左手と腕を下に向ける合図は「徐行または停止」を示します。
- id: 103
  category: safe_driving_rules
  question: 乾燥した路面を時速35〜45マイル（MPH）で走行する場合、推奨される車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: マニュアルによると、時速35〜45マイル（MPH）での推奨車間距離は3秒です。
- id: 104
  category: defensive_driving
  question: 次のうち、車間距離を広げるべき状況はどれですか？
  choices:
    A: 視界を遮る大型車両の後ろを走行しているとき。
    B: 新しく舗装された道路を走行しているとき。
    C: 高速道路に入るとき。
    D: 排気音の大きい車両の後ろを走行しているとき。
  answer: A
  explanation: マニュアルでは、悪天候やあおり運転を受けている場合などのほか、視界を遮る大型車両の後ろを走行しているときには車間距離を広げるよう指示しています。
- id: 105
  category: defensive_driving
  question: 後続車にあおり運転（車間距離を極端に詰められる行為）をされた場合、どうすべきですか？
  choices:
    A: 警告のために急ブレーキをかける。
    B: 車間距離を広げるために加速する。
    C: 他の車線に移動するか、軽くブレーキを踏んでブレーキランプを点滅させる。
    D: ハザードランプを点灯させ、車線内で停止する。
  answer: C
  explanation: あおり運転をされた場合、マニュアルでは急ブレーキをかけないようアドバイスしています。代わりに、可能であれば他の車線に移動するか、軽くブレーキを踏んでブレーキランプを点滅させ、速度を落とします。
- id: 106
  category: defensive_driving
  question: 熟練したドライバーは、道路を確認する際、どのくらい先を注視するようにしていますか？
  choices:
    A: 5〜10秒先
    B: 10〜15秒先
    C: 20〜30秒先
    D: 45〜60秒先
  answer: C
  explanation: 前方遠くを見ることは、リスクを早期に発見するのに役立ちます。熟練したドライバーは20〜30秒先を注視するように努めており、これは市街地では約1ブロック先に相当します。
- id: 107
  category: safe_driving_rules
  question: 交差点に差し掛かった際、どのような順序で交通状況を確認すべきですか？
  choices:
    A: 右、左、そしてもう一度右
    B: 左、右、そしてもう一度左
    C: 直進方向、そして左
    D: 右、直進方向、そして左
  answer: B
  explanation: いかなる交差点でも、まずは左を確認してください。左から来る車の方が自分に近いからです。次に右を確認し、通り抜ける前にもう一度素早く左を確認します。
- id: 108
  category: defensive_driving
  question: 後方の交通状況を確認するために、どのくらいの頻度でバックミラー（ルームミラー）を確認すべきですか？
  choices:
    A: 約5秒ごと
    B: 約10秒ごと
    C: 約30秒ごと
    D: 車線変更をするときのみ
  answer: B
  explanation: マニュアルでは、後方の交通状況を確認するために、頻繁に（約10秒ごとに）バックミラーを使用するように記載されています。
- id: 109
  category: defensive_driving
  question: 死角にいる車を確認するための最善の方法は何ですか？
  choices:
    A: 車内のバックミラーをより広い角度に調整する。
    B: 車両のバックカメラを頼りにする。
    C: 素早く頭を回して肩越しに目視する。
    D: 路面の影に注意する。
  answer: C
  explanation: 死角にいる車を確認する最善の方法は、車線変更や追い越しを行う前に、素早く頭を回して肩越しに目視し、進路が安全であることを確認することです。
- id: 110
  category: penalties_and_points
  question: 適法に横断中の歩行者に対して停止せず、重大な身体的損傷または死亡事故を引き起こした場合の罰則は何ですか？
  choices:
    A: 第3級重罪 (Class 3 felony)
    B: 第1級軽罪 (Class 1 misdemeanor)
    C: 500ドルの罰金のみで禁錮刑なし
    D: 初犯の場合は警告のみ
  answer: B
  explanation: 道路を適法に横断している歩行者に対して停止せず、重大な身体的損傷または死亡事故を引き起こした場合、第1級軽罪（Class 1 misdemeanor）に問われる可能性があります。
- id: 111
  category: sharing_the_road
  question: 自転車が車線の中央を走行することが許可されるのは、どのような状況ですか？
  choices:
    A: 州間高速道路（インターステート）を走行しているときはいつでも。
    B: 掲示された制限速度で走行しているときのみ。
    C: 左折しようとしているとき、または車線が狭すぎて車と並んで走行できないとき。
    D: 自転車が車線の中央を走行することは決して許可されない。
  answer: C
  explanation: 自転車は、左折しようとしているときや、車線が狭すぎて自動車と並んで安全に走行できないときなど、必要な場合には車線の中央を走行することが許可されています。
- id: 112
  category: sharing_the_road
  question: 悪天候時にオートバイの後方を走行する場合、車間距離をどのように調整すべきですか？
  choices:
    A: 標準の2秒の車間距離を維持する。
    B: 車間距離のルールに1秒追加する。
    C: 1秒追加した後の車間距離をさらに2倍にする。
    D: オートバイのスリップストリームに入るために車間距離を詰める。
  answer: C
  explanation: マニュアルでは、オートバイに対しては車間距離のルールに1秒追加して十分な制動距離を確保し、悪天候時にはその距離をさらに2倍にするよう定めています。
- id: 113
  category: sharing_the_road
  question: 交通の流れに入る前に、特にオートバイに道を譲ることが重要なのはなぜですか？
  choices:
    A: オートバイは常に制限速度を超えて走行しているため。
    B: オートバイの大きさにより、その速度や距離を見誤る可能性があるため。
    C: オートバイはすべての交差点で優先権を持っているため。
    D: オートバイは自動車ほど効果的にブレーキをかけることができないため。
  answer: B
  explanation: オートバイの大きさにより、その速度や距離を正しく判断できないことがあるため、オートバイには必ず道を譲ってください。
- id: 114
  category: sharing_the_road
  question: 杖を使用している、または盲導犬を連れている歩行者に遭遇した際、ドライバーはどうしなければなりませんか？
  choices:
    A: クラクションを鳴らして、車両の存在を歩行者に知らせる。
    B: 時速10マイル（10 MPH）まで減速し、注意して進む。
    C: 完全に停止する。これは視覚障害があることを示しているため。
    D: 歩行者が標識のある横断歩道にいる場合のみ道を譲る。
  answer: C
  explanation: 杖を使用している、または盲導犬を連れている歩行者は、視覚障害があることを示しているため、ドライバーは完全に停止することが義務付けられています。
- id: 115
  category: sharing_the_road
  question: ライトレール（路面電車等）の線路周辺を走行する際の重要な安全規則は何ですか？
  choices:
    A: 線路上で他の車両を追い越してもよい。
    B: 線路上で停止、追い越し、またはギアチェンジを決して行わない。
    C: 列車が見えない場合は、降りている遮断機を避けて走行できる。
    D: 列車は単線上を一方向にしか走行しない。
  answer: B
  explanation: ライトレールの列車の周辺を走行する際は、線路上で停止したり、追い越しをしたり、ギアチェンジを行ったりしてはいけません。
- id: 116
  category: vehicle_information
  question: 低速車両（Low speed vehicles）を運転できる公道の最高速度制限はどれですか？
  choices:
    A: 25 MPH以下
    B: 35 MPH以下
    C: 45 MPH以下
    D: 55 MPH以下
  answer: B
  explanation: 低速車両は、免許保持者または免許保持者が同乗する仮免許（learner's permit）保持者であれば、制限速度が35 MPH以下の公道で運転することができます。
- id: 117
  category: sharing_the_road
  question: 大型トラックの側面の死角、いわゆる「ノーゾーン（No-Zone）」を走行しているかどうかを判断するにはどうすればよいですか？
  choices:
    A: トラックの後方500フィート以内を走行している。
    B: トラックの方向指示器が点滅している。
    C: トラックのサイドミラーに運転手の顔が見えない。
    D: 2車線の道路を走行している。
  answer: C
  explanation: トラックの両側には大きなノーゾーン（死角）があります。サイドミラーに運転手の顔が見えない場合、運転手からもあなたの姿は見えていません。
- id: 118
  category: sharing_the_road
  question: 大型トラック、バス、またはRV車を追い越す際、その車両の前の車線に戻っても安全なタイミングはいつですか？
  choices:
    A: 自分の車のリアバンパーがトラックのフロントバンパーを通過した直後。
    B: バックミラーにトラックの前面全体が見えたとき。
    C: トラックのちょうど50フィート前方に達したとき。
    D: トラックの運転手がヘッドライトを点滅させたとき。
  answer: B
  explanation: 追い越す際は、前方のノーゾーン（死角）を避けるため、バックミラーでトラックの前面全体を確認してから前方の車線に戻るようにしてください。
- id: 119
  category: vehicle_information
  question: 牽引している小型または中型のトレーラーが左右に揺れ始めた場合、どうすべきですか？
  choices:
    A: 加速してトレーラーを真っ直ぐにする。
    B: ハンドルを左右に急に切る。
    C: ブレーキを強く踏む。
    D: 減速する。
  answer: D
  explanation: 小型または中型のトレーラーを牽引して走行中にトレーラーが揺れ始めた場合は、速度を落としてください。
- id: 120
  category: safe_driving_rules
  question: バック（後退）する際に運転者が犯す最も一般的な間違いは何ですか？
  choices:
    A: バックミラーだけに頼ること。
    B: 後方の左右両方の確認を怠ること。
    C: バックする速度が遅すぎること。
    D: ハンドルを両手で握り続けること。
  answer: B
  explanation: バックする際に運転者が犯す最も一般的な間違いは、後方の左右両方の確認を怠ることです。
- id: 121
  category: safe_driving_rules
  question: 公道の縁石の横に駐車する場合、車両と縁石の間の最大距離はどれくらいですか？
  choices:
    A: 6インチ
    B: 1フィート
    C: 18インチ
    D: 2フィート
  answer: B
  explanation: 縁石の横に駐車する場合は、縁石に近づけて停めてください。縁石から1フィート以上離れて駐車してはいけません。
- id: 122
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、前輪はどの向きにするべきですか？
  choices:
    A: 前輪を左に向ける
    B: 前輪を右に向ける
    C: 車輪を完全に真っ直ぐにする
    D: 後輪を左に向ける
  answer: A
  explanation: 縁石のある上り坂で駐車する際は、車両が道路に転がり出るのを防ぐため、前輪を左（道路の中央側）に向けてください。
- id: 123
  category: safe_driving_rules
  question: 消火栓から何フィート以内の場所に駐車することは禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: B
  explanation: 消火栓から15フィート以内の場所に駐車してはいけません。
- id: 124
  category: safe_driving_rules
  question: 踏切から何フィート以内の場所に車両を駐車することは違法ですか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 50フィート
    D: 500フィート
  answer: C
  explanation: 踏切から50フィート以内の場所に駐車してはいけません。
- id: 125
  category: defensive_driving
  question: マニュアルによると、事故の最大の要因は何ですか？
  choices:
    A: スピード違反
    B: 飲酒・薬物影響下の運転
    C: リスクの特定ミス
    D: 車間距離の詰めすぎ
  answer: C
  explanation: 事故の最大の要因は、リスクの特定ミス（危険予測の欠如）です。優れた運転者になるためには、何に注意し、どこを見るべきかを知る必要があります。
- id: 126
  category: safe_driving_rules
  question: バージニア州の法律では、悪天候により視界が以下の距離まで低下した場合、運転者はヘッドライトを使用することが義務付けられています。
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: バージニア州の法律では、雨、霧、雪、みぞれなどの悪天候により視界が500フィート（約152メートル）以下になった場合、運転者はヘッドライトを使用することが義務付けられています。
- id: 127
  category: safe_driving_rules
  question: ワイパーの使用に関連して、いつヘッドライトを使用しなければなりませんか？
  choices:
    A: 夜間に運転する場合のみ。
    B: 悪天候のためにワイパーを使用する場合は常に。
    C: ワイパーが最高速設定になっている場合のみ。
    D: 日中にワイパーを使用する場合、ヘッドライトは必要ない。
  answer: B
  explanation: 悪天候のためにワイパーを使用する場合は、常にヘッドライトを使用しなければなりません。
- id: 128
  category: safe_driving_rules
  question: 夜間に前走車に追従する場合、前走車からどのくらいの距離以内に近づいたときにロービーム（すれ違い用前照灯）を使用しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 前走車に追従する場合、前走車から200フィート（約61メートル）以内に近づいたときはロービームを使用してください。
- id: 129
  category: defensive_driving
  question: 対向車のハイビームがついている場合、どうすべきですか？
  choices:
    A: 自分のハイビームをつけて、相手の運転者に警告する。
    B: 車両を追跡するために、まぶしい光を直視する。
    C: 道路の端の方に目を向け、その後すぐ前方を見る。
    D: ヘッドライトを素早く点滅させ、クラクションを鳴らす。
  answer: C
  explanation: 対向車のハイビームがついている場合は、まぶしい光を直視しないようにしてください。道路の端の方に目を向け、その後すぐ前方を見て他車の位置を確認します。
- id: 130
  category: safe_driving_rules
  question: ハイウェイを走行中、対向車がどのくらいの距離以内に近づいたときにハイビームを減光（ロービームに切り替え）しなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1,000フィート
  answer: C
  explanation: マニュアルでは、対向車が500フィート（約152メートル）以内に近づかない限り、ハイウェイではロービームを使用することとされています。
- id: 131
  category: defensive_driving
  question: 対向車がハイビームを減光（ロービームに切り替え）しない場合、どうすべきですか？
  choices:
    A: 自分のハイビームをつけて警告する。
    B: 道路の端の方に目を向け、その後すぐ前方を確認する。
    C: 距離を測るためにヘッドライトを直視する。
    D: すぐに路肩に寄せて停車し、相手が通り過ぎるのを待つ。
  answer: B
  explanation: 対向車のハイビームがついている場合は、まぶしい光を直視しないようにしてください。道路の端の方に目を向け、その後すぐ前方を確認します。自分のハイビームをつけて対抗してはいけません。
- id: 132
  category: safe_driving_rules
  question: 濃霧の中を走行する際は、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム（走行用前照灯）
    B: ロービーム（すれ違い用前照灯）
    C: パーキングライト（車幅灯）のみ
    D: 非常点滅表示灯（ハザードランプ）
  answer: B
  explanation: 濃霧の中ではロービームを使用してください。霧は光を反射するため、ハイビームを使うと自分のヘッドライトの光が目に跳ね返ってくる可能性があるからです。
- id: 133
  category: safe_driving_rules
  question: 雨が降り始めてからの30分間、道路が滑りやすくなりやすいのはなぜですか？
  choices:
    A: 雨が路面の摩擦材を洗い流してしまうため。
    B: 路面の油分が水と混ざり合うため。
    C: 気温が急激に下がり、氷が形成されるため。
    D: タイヤは深い水たまりよりも浅い水の方がハイドロプレーニング現象を起こしやすいため。
  answer: B
  explanation: 雨が降り始めた最初の30分間は、路面の油分が水と混ざり合うため、道路が滑りやすくなります。
- id: 134
  category: vehicle_information
  question: 雪道を走行する前に、車両のどの部分から雪や氷を取り除かなければなりませんか？
  choices:
    A: フロントガラスとフロントウィンドウのみ。
    B: フロントライトとリアライトのみ。
    C: 屋根、ボンネット、後部を含む車全体。
    D: ワイパーとミラーのみ。
  answer: C
  explanation: 走行中に雪や氷が飛散して危険を引き起こさないよう、屋根、ボンネット、後部を含む車全体から雪や氷を取り除いてから運転を開始してください。
- id: 135
  category: safe_driving_rules
  question: 寒い時期、道路上の氷に特に注意すべき場所はどこですか？
  choices:
    A: 橋の上や日陰の場所
    B: トンネルやアンダーパスの中
    C: 信号機のある交差点
    D: 丘の頂上付近
  answer: A
  explanation: 橋の上や日陰の場所に氷がないか注意してください。橋は他の路面よりも先に凍結します。
- id: 136
  category: penalties_and_points
  question: バージニア州で「あおり運転（aggressive driving）」で有罪判決を受けた場合、免許停止期間はどのくらいになる可能性がありますか？
  choices:
    A: 5日から30日
    B: 10日から6ヶ月
    C: 30日から1年
    D: 6ヶ月から2年
  answer: B
  explanation: あおり運転で有罪判決を受けた場合、免許は10日間、または最長で6ヶ月間停止される可能性があります。
- id: 137
  category: defensive_driving
  question: 道路であおり運転（aggressive driver）をするドライバーに遭遇した場合、どのように対処すべきですか？
  choices:
    A: 相手より先に進むためにスピードを上げる
    B: 威圧されていないことを示すために目を合わせる
    C: 相手を追い越すような操作を試みる
    D: 邪魔にならないように道を譲り、目を合わせないようにする
  answer: D
  explanation: あおり運転をするドライバーを見かけたら、邪魔にならないように道を譲ってください。相手を挑発せず、目を合わせるのを避け、相手のジェスチャーや怒鳴り声は無視しましょう。
- id: 138
  category: driver_responsibility
  question: 居眠り運転を防ぐための効果的で信頼できる方法はどれですか？
  choices:
    A: 窓を開ける
    B: ガムを噛んだり、ラジオの音量を上げたりする
    C: カフェインやエナジードリンクを摂取する
    D: 安全な場所に停車し、10分から20分の仮眠をとる
  answer: D
  explanation: 安全な場所に停車して仮眠をとってください。わずか10分から20分の睡眠でも大きな違いがあります。窓を開ける、ガムを噛む、ラジオの音を大きくする、カフェインを摂取するといった方法は、信頼できる解決策ではありません。
- id: 139
  category: alcohol_drugs_health
  question: バージニア州では、21歳以上のドライバーの血中アルコール濃度（BAC）が少なくとも何パーセントであれば、法的に酒気帯び運転（DUI）とみなされますか？
  choices:
    A: .02パーセント
    B: .04パーセント
    C: .08パーセント
    D: .10パーセント
  answer: C
  explanation: 法律上、21歳以上のドライバーは、血中アルコール濃度（BAC）が0.08パーセント以上の場合、酒気帯び運転（DUI）とみなされます。
- id: 140
  category: alcohol_drugs_health
  question: 21歳未満の場合、血中アルコール濃度（BAC）がどの範囲であれば、アルコールの不法摂取で有罪となる可能性がありますか？
  choices:
    A: 0.02パーセント以上0.08パーセント未満
    B: 0.01パーセント以上0.05パーセント未満
    C: 0.05パーセント以上0.10パーセント未満
    D: ちょうど0.00パーセント
  answer: A
  explanation: 21歳未満の場合、BACが0.02パーセント以上0.08パーセント未満であれば、アルコールの不法摂取で有罪となる可能性があります。
- id: 141
  category: alcohol_drugs_health
  question: 12オンス（約355ml）のビール1杯と同じアルコール量を含んでいるのはどれですか？
  choices:
    A: 12オンスのワイン1杯
    B: 5オンス（約148ml）のワイン1杯
    C: ショットグラス2杯の蒸留酒
    D: 8オンスのワイン1杯
  answer: B
  explanation: 12オンスのビールは、ショットグラス1杯の蒸留酒、または5オンスのワイン1杯と同じアルコール量です。
- id: 142
  category: alcohol_drugs_health
  question: 酔いを覚ますための唯一の効果的な方法は何ですか？
  choices:
    A: ブラックコーヒーを飲む
    B: 冷たいシャワーを浴びる
    C: 激しい運動をする
    D: 時間の経過
  answer: D
  explanation: 酔いを覚ますことができるのは時間だけです。コーヒー、冷たいシャワー、運動では酔いは覚めません。
- id: 143
  category: safe_driving_rules
  question: バージニア州の法律の下で、運転中にドライバーが携帯電話を手に持つことが許可されるのはどのような時ですか？
  choices:
    A: ナビゲーション目的で使用している時
    B: 赤信号で停車している時
    C: 緊急時、または合法的に駐車もしくは停車している時のみ
    D: スピーカーフォンで話している時
  answer: C
  explanation: バージニア州の法律では、緊急時、または車両が合法的に駐車もしくは停車している場合を除き、運転中に携帯電話やその他の無線通信機器を手に持つことを禁止しています。
- id: 144
  category: driver_responsibility
  question: バージニア州で毎年発生する全交通事故のうち、わき見運転（ドライバーの注意散漫）が占める割合はおよそ何パーセントですか？
  choices:
    A: 10パーセント
    B: 17パーセント
    C: 25パーセント
    D: 33パーセント
  answer: B
  explanation: バージニア州では、毎年全交通事故の約17パーセントがドライバーの注意散漫によって引き起こされています。
- id: 145
  category: alcohol_drugs_health
  question: アルコールをアレルギー薬や風邪薬などの他の薬物と併用した場合、どのような影響がありますか？
  choices:
    A: アルコールの効果を打ち消す
    B: 通常、両方の効果が倍増する
    C: 運転能力には影響しない
    D: 反応速度が向上する
  answer: B
  explanation: アルコールを他の薬物と併用すると、通常、両方の効果が倍増し、運転能力に壊滅的な影響を及ぼす可能性があります。アレルギー薬や風邪薬と一緒に飲んだわずか1杯のお酒でも、数杯のアルコール飲料を飲んだのと同じ影響を与えることがあります。
- id: 146
  category: driver_responsibility
  question: 交通事故に遭った際、直ちに車両を道路から移動させなければならないのはどのような場合ですか？
  choices:
    A: 警察官に指示された場合のみ
    B: 車両の移動が可能で、負傷者がおらず、安全に行える場合
    C: 警察が到着するまで車両を移動させてはならない
    D: 損害額が3,000ドル未満の場合のみ
  answer: B
  explanation: 車両の移動が可能で、負傷者がおらず、運転者が安全に行うことができる場合は、直ちに車両を道路から移動させなければなりません。
- id: 147
  category: driver_responsibility
  question: 交通事故により負傷、死亡、または合計いくらを超える物的損害が発生した場合、警察官はDMVに書面による事故報告書を送付する必要がありますか？
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $3,000
  answer: D
  explanation: 交通事故により負傷者や死亡者が出た場合、または物的損害の合計が3,000ドルを超える場合、警察官はDMVに書面による事故報告書を送付しなければなりません。
- id: 148
  category: driver_responsibility
  question: 無人の車両に衝突し、所有者を見つけることができない場合、どうしなければなりませんか？
  choices:
    A: 現場を離れ、所有者からの連絡を待つ
    B: 連絡先を記したメモを残し、24時間以内に警察に事故を報告する
    C: 所有者が戻るまで、どれだけ時間がかかっても現場で待つ
    D: 48時間以内に保険会社に事故を報告して立ち去る
  answer: B
  explanation: 損傷させた無人車両の所有者を見つけられない場合は、連絡先と事故の詳細を記したメモを現場の見えやすい場所に残し、24時間以内に警察に事故を報告しなければなりません。
- id: 149
  category: defensive_driving
  question: シカなどの大型動物との衝突が避けられない場合、どうすべきですか？
  choices:
    A: 対向車線へ急ハンドルを切る
    B: 衝撃時間を最小限にするために加速する
    C: しっかりとブレーキをかけ、車線を維持し、制御しながら停車する
    D: 道路を外れて溝の方へハンドルを切る
  answer: C
  explanation: シカなどの動物との衝突が避けられない場合、急ハンドルを切ってはいけません。しっかりとブレーキをかけ、車線を維持し、制御しながら停車してください。
- id: 150
  category: safe_driving_rules
  question: 夜間に警察官に車を止められた際、取るべき行動の一つは何ですか？
  choices:
    A: 直ちにヘッドライトを消す
    B: 車内の照明（ルームランプ）を点灯させる
    C: 警察官に挨拶するために車から降りる
    D: 身分証明書を求められるまで手を見えないようにしておく
  answer: B
  explanation: 夜間の交通取り締まりの際は、警察官が車内を確認しやすいように、車内の照明を点灯させる必要があります。
- id: 151
  category: driver_responsibility
  question: 警察官から発行された交通違反切符（召喚状）に署名することは何を意味しますか？
  choices:
    A: 罪を認めることである
    B: 法廷審問を受ける権利を放棄することである
    C: 罪を認めることではないが、署名を拒否すると逮捕される可能性がある
    D: 即座に罰金を支払うことに同意することである
  answer: C
  explanation: 違反切符への署名を求められますが、署名してください。これは罪を認めることではありません。署名を拒否すると、逮捕される可能性があります。
- id: 152
  category: safe_driving_rules
  question: バージニア州の法律の下で、車内でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転者と助手席の乗客のみ
    B: 18歳未満の乗客のみ
    C: 運転者および前後部座席のすべての乗客
    D: 運転者のみ
  answer: C
  explanation: バージニア州の法律では、運転者および前後部座席のすべての乗客がシートベルトを着用しなければなりません。
- id: 153
  category: safe_driving_rules
  question: 妊婦はどのようにシートベルトを着用すべきですか？
  choices:
    A: 腰ベルトを骨盤のできるだけ低い位置にかける
    B: 腰ベルトをお腹の中央にかける
    C: 肩ベルトを使用せずに着用する
    D: 妊婦はシートベルトの着用を免除されている
  answer: A
  explanation: 妊婦は、ベルトを骨盤のできるだけ低い位置にかけることで、より安全に保護されます。
- id: 154
  category: penalties_and_points
  question: バージニア州において、チャイルドシート（幼児用補助装置）法違反の初回有罪判決に対する罰金はいくらですか？
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: B
  explanation: チャイルドシート法違反で有罪となった場合、50ドルの罰金が科せられます。2回目以降の違反では500ドルの罰金となる可能性があります。
- id: 155
  category: safe_driving_rules
  question: 車内でチャイルドシートを設置するのに最も安全な場所はどこですか？
  choices:
    A: 助手席
    B: 後部座席の中央
    C: 運転席側の後部座席
    D: 助手席側の後部座席
  answer: B
  explanation: チャイルドシートを設置するのに最も安全な場所は、後部座席の中央です。
- id: 156
  category: safe_driving_rules
  question: バージニア州では、何歳未満の子供をピックアップトラックの荷台に乗せて運ぶことは違法ですか？
  choices:
    A: 12歳
    B: 14歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: 16歳未満の子供をピックアップトラックの荷台に乗せて運ぶことは、キャンパーシェル（荷台のカバー）が装備されていても違法です。
- id: 157
  category: vehicle_information
  question: 車両にエアバッグが装備されている場合、ハンドルから少なくともどのくらいシートを後ろに下げるべきですか？
  choices:
    A: 少なくとも5インチ
    B: 少なくとも10インチ
    C: 少なくとも15インチ
    D: シートが下がる一番後ろまで
  answer: B
  explanation: 車両にエアバッグが装備されている場合、ハンドルから少なくとも10インチ（約25cm）離れるようにシートを後ろに下げる必要があります。
- id: 158
  category: vehicle_information
  question: 車両にエアバッグが装備されている場合、ハンドルをどのように調整すべきですか？
  choices:
    A: 頭の方に向けて上向きに傾ける
    B: 胸の方に向けて下向きに傾ける
    C: できるだけ体に近づける
    D: 最も高い位置でロックする
  answer: B
  explanation: ハンドルが調整可能な場合は、下向きに傾ける必要があります。これにより、エアバッグが頭や首ではなく胸の方を向くようになります。
- id: 159
  category: safe_driving_rules
  question: すべての子供は何歳まで、チャイルドシートまたはジュニアシート（ブースターシート）で適切に固定される必要がありますか？
  choices:
    A: 5歳未満
    B: 6歳未満
    C: 8歳未満
    D: 10歳未満
  answer: C
  explanation: 1968年1月1日以降に製造された車両に乗る場合、8歳未満のすべての子供はチャイルドシートまたはジュニアシート（ブースターシート）で適切に固定されなければなりません。
- id: 160
  category: safe_driving_rules
  question: マニュアルによると、子供はいつまで後ろ向きのチャイルドシートに乗るべきですか？
  choices:
    A: 誕生から1歳まで
    B: 誕生から2歳まで
    C: 誕生から3歳まで
    D: 誕生から4歳まで
  answer: B
  explanation: 子供は誕生から2歳まで、またはチャイルドシートのメーカーが許可する限り、後ろ向きで乗るべきです。
- id: 161
  category: safe_driving_rules
  question: 後ろ向きのチャイルドシートを助手席に設置してもよいのはどのような場合ですか？
  choices:
    A: 運転者が子供を注意深く見守りたいときはいつでも
    B: 車両に後部座席がなく、助手席のエアバッグがオフになっているか装備されていない場合のみ
    C: 子供が1歳以上の場合のみ
    D: いかなる状況においても認められない
  answer: B
  explanation: 車両に後部座席がない場合、助手席側のエアバッグが装備されていないか、または助手席のエアバッグがオフになっていれば、後ろ向きのチャイルドシートを助手席に設置することができます。
- id: 162
  category: penalties_and_points
  question: 運転免許の「停止（Suspension）」と「取り消し（Revocation）」の違いは何ですか？
  choices:
    A: 停止は永久的なものであり、取り消しは一時的なものである。
    B: 停止は運転の特権が一時的に取り下げられることを意味し、取り消しは特権が終了（失効）することを意味する。
    C: 停止は路上試験の再受験が必要だが、取り消しは手数料の支払いのみで済む。
    D: 違いはない。どちらも免許が永久に無効になることを意味する。
  answer: B
  explanation: 免許が停止（Suspension）された場合、運転の特権が一時的に取り下げられます。取り消し（Revocation）は、運転の特権が終了（失効）したことを意味します。
- id: 163
  category: penalties_and_points
  question: 次の有罪判決のうち、裁判所またはDMVが自動的に運転特権を停止または取り消すのはどれですか？
  choices:
    A: DMVに対して虚偽の申告をすること
    B: 有効な運転免許証なしで運転すること
    C: 血液・呼気検査（アルコール検査）を拒否すること
    D: 無謀運転または威圧的運転
  answer: A
  explanation: DMVに対して虚偽の申告をしたことで有罪判決を受けた場合、裁判所またはDMVは運転特権を停止または取り消します。他の選択肢は、裁判所が特権を停止または取り消す「可能性がある」違反です。
- id: 164
  category: penalties_and_points
  question: 次の違反のうち、自動的な義務ではなく、裁判所が運転特権を停止または取り消す「可能性がある」ものはどれですか？
  choices:
    A: 警察からの逃走
    B: 自動車が関与する重罪を犯すこと
    C: 無謀運転または威圧的運転
    D: アルコールや薬物の影響下での運転（DUI）
  answer: C
  explanation: マニュアルでは、「無謀運転または威圧的運転」は裁判所が運転特権を停止または取り消す「可能性がある」違反としてリストされています。一方、DUI、警察からの逃走、車両を用いた重罪などは、停止または取り消しが自動的に行われる違反です。
- id: 165
  category: penalties_and_points
  question: 18歳未満の場合、減点対象となる交通違反で2回目の有罪判決を受けた際の罰則は何ですか？
  choices:
    A: 運転特権の30日間の停止
    B: 運転特権の90日間の停止
    C: 運転特権の1年間の取り消し
    D: DMVからの警告書
  answer: B
  explanation: 18歳未満の時に犯した減点対象の交通違反で2回目の有罪判決を受けた場合、DMVは運転特権を90日間停止します。
- id: 166
  category: penalties_and_points
  question: 18歳未満の運転者が、減点対象となる交通違反で3回目の有罪判決を受けた場合、どうなりますか？
  choices:
    A: 運転資格が1年間、または18歳になるまでの期間のうち、いずれか長い方の期間取り消されます。
    B: 運転資格が90日間停止されます。
    C: 500ドルの罰金を支払い、路上試験を再受験しなければなりません。
    D: 運転資格が永久に取り消されます。
  answer: A
  explanation: 18歳未満の運転者の場合、3回目の有罪判決を受けると、運転資格が1年間、または18歳に達するまでの期間のうち、いずれか長い方の期間取り消されます。
- id: 167
  category: penalties_and_points
  question: 18歳以上の場合、何ポイントの減点ポイント（demerit points）が累積すると、DMVから運転改善講習（driver improvement
    clinic）の受講を義務付けられますか？
  choices:
    A: 12ヶ月以内に10ポイント
    B: 12ヶ月以内に12ポイント、または24ヶ月以内に18ポイント
    C: 12ヶ月以内に15ポイント
    D: 12ヶ月以内に18ポイント、または24ヶ月以内に24ポイント
  answer: B
  explanation: 18歳以上の運転者の場合、12ヶ月以内に12ポイント、または24ヶ月以内に18ポイントの減点ポイントが累積すると、DMVは運転改善講習の受講を義務付けます。
- id: 168
  category: penalties_and_points
  question: 18歳以上の成人運転者が、12ヶ月以内に18ポイントの減点ポイントを累積させた場合の罰則は何ですか？
  choices:
    A: 30日間の免許停止
    B: 60日間の免許停止
    C: 90日間の免許停止および運転改善講習の受講義務
    D: 1年間の運転資格取り消し
  answer: C
  explanation: 12ヶ月以内に18ポイント、または24ヶ月以内に24ポイントの減点ポイントを受けた場合、DMVは運転資格を90日間停止し、運転改善講習の受講を義務付けます。
- id: 169
  category: driver_responsibility
  question: 医療審査プログラム（Medical Review Program）において、DMVが懸念するのは、運転者のどのような能力を損なう身体的または精神的状態ですか？
  choices:
    A: 聴覚、言語能力、および反射神経
    B: 意識レベル、知覚、判断力、または運動能力
    C: 英語の道路標識を読む能力
    D: 心血管の健康状態および呼吸数
  answer: B
  explanation: DMVは、運転者の意識レベル、知覚（視覚）、判断力、および運動能力を損なうあらゆる状態を懸念の対象としています。
- id: 170
  category: penalties_and_points
  question: バージニア州で自動車を登録する際、その車両の賠償責任保険（liability insurance）に加入していない場合はどうしなければなりませんか？
  choices:
    A: 500ドルの無保険車両手数料を支払う。
    B: 運転免許証を返納する。
    C: 250ドルの罰金を支払い、運転改善講習を受ける。
    D: いかなる状況においても、賠償責任保険なしで車両を登録することはできない。
  answer: A
  explanation: 自動車を登録する際は、賠償責任保険に加入しているという声明書に署名するか、500ドルの無保険車両手数料を支払う必要があります。
- id: 171
  category: license_system
  question: 免許停止期間中に免許の有効期限が1年以上切れてしまった場合、運転資格を回復させるためには何をしなければなりませんか？
  choices:
    A: 所定の再交付手数料を支払うだけでよい。
    B: 法的居住資格の証明を提示し、視力検査、知識試験、および路上試験に合格する。
    C: 運転改善講習を修了し、500ドルの手数料を支払る。
    D: 再申請する前に、さらに90日間待機する。
  answer: B
  explanation: 免許停止期間中に免許の有効期限が1年以上経過した場合、運転資格を回復させるには、法的居住資格の証明を提示し、2部構成の知識試験、路上試験、および視力検査に合格する必要があります。
- id: 172
  category: penalties_and_points
  question: 養育費の支払いがどの程度遅れると、DMVは運転資格を停止しますか？
  choices:
    A: 30日または1,000ドル
    B: 60日または2,500ドル
    C: 90日または5,000ドル
    D: 120日または10,000ドル
  answer: C
  explanation: 養育費執行局（Division of Child Support Enforcement）は、養育費の支払いが90日または5,000ドル遅れた場合、DMVに対して運転資格を停止するよう指示します。
- id: 173
  category: alcohol_drugs_health
  question: バージニア州の黙示的同意法（implied consent laws）に基づき、公道で自動車を運転することは、何に同意したことになりますか？
  choices:
    A: 法執行官がいつでも車両を捜索することを許可すること
    B: 要求された場合に呼気検査を受けること
    C: 自分が引き起こした事故に対して賠償金を支払うこと
    D: 国際運転免許証を携帯すること
  answer: B
  explanation: 黙示的同意法に基づき、バージニア州の公道で自動車を運転する場合、要求に応じて呼気検査を受けることに同意したものとみなされます。
- id: 174
  category: penalties_and_points
  question: 酒気帯び運転（DUI）の初回違反で起訴され、血中アルコール濃度（BAC）が0.08パーセント以上であった場合、運転資格は自動的に何日間停止されますか？
  choices:
    A: 7日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: A
  explanation: 運転中にBACが0.08パーセント以上であり、法執行機関によって酒気帯び運転で起訴された場合、初回違反であれば運転資格は自動的に7日間停止されます。
- id: 175
  category: alcohol_drugs_health
  question: 開封された容器（open container）による運転中の飲酒で起訴される対象となる「乗員エリア（passenger area）」には、以下のどこが含まれますか？
  choices:
    A: 車両のトランク
    B: 鍵のかかったグローブボックス
    C: 鍵のかかっていないグローブボックス
    D: ピックアップトラックの荷台
  answer: C
  explanation: 乗員エリアとは、運転者と乗客が座るエリア、および鍵のかかっていないグローブボックスを含む、運転者の手が届く範囲のすべてのエリアを指します。
- id: 176
  category: penalties_and_points
  question: 未成年の同乗者（17歳以下）がいる状態でのDUI（酒気帯び・薬物影響下運転）違反で有罪判決を受けた場合、追加で科される義務的な禁錮刑の期間はどれくらいですか？
  choices:
    A: 48時間
    B: 5日間
    C: 10日間
    D: 30日間
  answer: B
  explanation: 違反時に17歳以下の未成年の同乗者が車内にいた状態でのDUI違反で有罪判決を受けた場合、他のすべての罰金や禁錮刑に加えて、さらに5日間の義務的な禁錮刑が科されます。
- id: 177
  category: penalties_and_points
  question: アルコール関連の違反で免許停止中に運転して摘発された場合、車両は直ちに何日間差し押さえられますか？
  choices:
    A: 3日間
    B: 7日間
    C: 30日間
    D: 90日間
  answer: C
  explanation: アルコール関連の違反で免許停止処分を受けている間に運転して摘発された場合、車両は直ちに30日間差し押さえられます。
- id: 178
  category: driver_responsibility
  question: 自身のDUI（酒気帯び・薬物影響下運転）違反による衝突事故に対応した緊急要員の費用として、最大いくらまで支払う責任が生じる可能性がありますか？
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: 自身のDUI違反に起因する衝突事故や事案に対応した法執行機関、救急医療サービス、消防士、および救助隊員の費用（最大1,000ドルまで）を支払う責任が生じる場合があります。
- id: 179
  category: alcohol_drugs_health
  question: 21歳未満で、BAC（血中アルコール濃度）が0.02%以上0.08%未満の状態で運転し有罪判決を受けた場合、運転免許はどのくらいの期間停止されますか？
  choices:
    A: 6ヶ月
    B: 1年間
    C: 2年間
    D: 21歳になるまで
  answer: B
  explanation: 不法にアルコールを摂取した後に運転して有罪判決を受け、その際のBACが0.02%以上0.08%未満であった場合、裁判所による罰則には、有罪判決の日から1年間の運転免許停止が含まれます。
- id: 180
  category: penalties_and_points
  question: 21歳未満で、アルコールを購入するために偽造身分証明書（フェイクID）を使用または使用しようとした場合、義務的な運転免許停止期間はどれくらいですか？
  choices:
    A: 少なくとも30日間
    B: 少なくとも90日間
    C: 少なくとも6ヶ月以上1年以内
    D: ちょうど2年間
  answer: C
  explanation: 21歳未満で偽造身分証明書を使用または使用しようとした場合、少なくとも6ヶ月以上1年以内の義務的な運転免許停止処分を受けることになります。
- id: 181
  category: license_system
  question: 学習許可証（ラーナーズパーミット）で運転する場合、助手席に同乗する免許保持者は21歳以上である必要がありますが、その人物が法定後見人または兄弟姉妹である場合に限り、何歳であれば認められますか？
  choices:
    A: 16歳、17歳、または18歳
    B: 18歳、19歳、または20歳
    C: 免許を持っていれば何歳でもよい
    D: 25歳
  answer: B
  explanation: 同乗する免許保持者が法定後見人、兄弟、姉妹、異母・異父兄弟、または義理の兄弟姉妹である場合は、18歳、19歳、または20歳であっても認められます。
- id: 182
  category: license_system
  question: 19歳以上の場合、運転教育修了証を提示しないのであれば、運転免許を申請する前に学習許可証（ラーナーズパーミット）をどのくらいの期間保持しなければなりませんか？
  choices:
    A: 30日間
    B: 60日間
    C: 9ヶ月間
    D: 1年間
  answer: B
  explanation: 19歳以上の場合、運転免許を申請するには、学習許可証を60日間保持するか、運転教育修了証を提示する必要があります。
- id: 183
  category: license_system
  question: 標準的な運転免許証では、CDL（商業運転免許）の要件から除外されており、かつ重量が何ポンド未満の車両または小型トラックを運転できますか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 26,001ポンド
    D: 32,000ポンド
  answer: C
  explanation: 運転免許証があれば、商業運転免許（CDL）の要件から除外されている26,001ポンド未満のあらゆる車両または小型トラックを運転することができます。
- id: 184
  category: license_system
  question: 15人乗り（運転手を含む）のスクールバスを運転するには、どうすればよいですか？
  choices:
    A: 完全な商業運転免許（CDL）を取得する
    B: エンドースメント（資格の裏書き）を得るために、商業ドライバー試験とスクールバス試験を受ける
    C: 少なくとも25歳以上である必要がある
    D: 国際運転免許証を所持する
  answer: B
  explanation: 15人乗り（運転手を含む）のスクールバスを運転する場合、商業運転免許を取得する必要はありません。ただし、運転免許証にスクールバスのエンドースメント（資格の裏書き）を取得するために、商業ドライバー試験とスクールバス試験を受ける必要があります。
- id: 185
  category: license_system
  question: 国際運転免許証に関して、正しいものはどれですか？
  choices:
    A: 米国内のどこでも運転できる有効な運転免許証である
    B: 州発行の運転免許証に代わるものである
    C: 既存の有効な運転免許証の外国語翻訳に過ぎない
    D: 民間企業から合法的に購入できる
  answer: C
  explanation: 国際運転免許証はそれ自体で有効な運転免許証ではなく、それだけで運転が許可されるものでもありません。これは、米国外を旅行する際に使用するための、既存の有効な運転免許証の外国語翻訳に過ぎません。
- id: 186
  category: license_system
  question: バージニア州において、民間企業が販売している国際運転免許証の法的地位はどうなっていますか？
  choices:
    A: 米国到着後60日間有効である。
    B: 外国から訪問している場合に必要である。
    C: それらは無効であり、合法的に自動車を運転することはできない。
    D: 有効なパスポートを携帯している場合にのみ有効である。
  answer: C
  explanation: マニュアルによると、民間企業が販売している国際運転免許証は無効であり、合法的に自動車を運転することはできません。
- id: 187
  category: license_system
  question: 新しいバージニア州の運転免許証はどのように受け取りますか？
  choices:
    A: DMVカスタマーサービスセンターで即座に発行される。
    B: 郵送で送られてくる。
    C: 地元の警察署で受け取らなければならない。
    D: 一時的なデジタルコピーとしてメールで送られてくる。
  answer: B
  explanation: マニュアルには、セキュリティ上の理由からDMVはカスタマーサービスセンターで免許証を発行しないため、新しい運転免許証は郵送で届くと記載されています。
- id: 188
  category: driver_responsibility
  question: 引っ越しをした場合、何日以内にDMVに住所変更を届け出る必要がありますか？
  choices:
    A: 10日以内
    B: 30日以内
    C: 60日以内
    D: 90日以内
  answer: B
  explanation: 引っ越しをした場合、30日以内にDMVに通知する必要があります。郵便局は免許証を別の住所へ転送しません。
- id: 189
  category: license_system
  question: バージニア州の新しい居住者が運転する場合、何日以内にバージニア州の運転免許証を取得しなければなりませんか？
  choices:
    A: 30日以内
    B: 45日以内
    C: 60日以内
    D: 90日以内
  answer: C
  explanation: バージニア州の新しい居住者が運転する場合、転入から60日以内にバージニア州の運転免許証を取得しなければなりません。
- id: 190
  category: vehicle_information
  question: バージニア州に転入してから何日以内に、車両のタイトル（所有権証明）取得と登録を行い、バージニア州のナンバープレートを取得しなければなりませんか？
  choices:
    A: 15日以内
    B: 30日以内
    C: 60日以内
    D: 90日以内
  answer: B
  explanation: バージニア州に転入してから30日以内に、車両のタイトル取得と登録を行い、バージニア州のナンバープレートを取得しなければなりません。
- id: 191
  category: vehicle_information
  question: バージニア州で登録された車両のどこにナンバープレートを表示しなければなりませんか？
  choices:
    A: 車両の後部のみ。
    B: 車両の前部のみ。
    C: 車両の前部と後部。
    D: 後部とフロントガラスの内側。
  answer: C
  explanation: マニュアルでは、ナンバープレートは車両の前部と後部の両方に表示しなければならないと規定されています。
- id: 192
  category: vehicle_information
  question: ペニー硬貨を使ってタイヤの溝（トレッド）を確認する際、安全な溝の深さで運転していることを示すのはどのような状態ですか？
  choices:
    A: エイブラハム・リンカーンの頭がすべて見える。
    B: リンカーンの頭の一部が溝に隠れている。
    C: ペニー硬貨が溝から落ちる。
    D: 溝がペニー硬貨に対して完全に平らである。
  answer: B
  explanation: ペニーテストにおいて、リンカーンの頭の一部が溝に隠れていれば、安全な溝の深さで運転していることになります。
- id: 193
  category: vehicle_information
  question: 車両のタイヤの推奨空気圧（PSI）はどこで確認できますか？
  choices:
    A: 車両のナンバープレート。
    B: 車両のオーナーズマニュアル（取扱説明書）または運転席側のドアジャム（ドアの枠部分）。
    C: ハンドル（ステアリングホイール）。
    D: 車両の登録証に印刷されている。
  answer: B
  explanation: 推奨空気圧（PSI）は、車両のオーナーズマニュアルまたは運転席側のドアジャムに記載されています。
- id: 194
  category: driver_responsibility
  question: 500ドルの無保険車両料（uninsured motor vehicle fee）を支払うと、どのような権利が得られますか？
  choices:
    A: 1年間の最低限の賠償責任保険。
    B: 1年間のフルカバー保険。
    C: 保険に加入せずに、バージニア州で1年間車両を登録し運転することができる。
    D: 物損はカバーされるが、対人賠償はカバーされない。
  answer: C
  explanation: 無保険車両料を支払っても保険が提供されるわけではありませんが、1年間にわたりバージニア州で車両を登録し運転することが許可されます。
- id: 195
  category: driver_responsibility
  question: バージニア州で車両の保険契約を解約する前に、何をしなければなりませんか？
  choices:
    A: 500ドルの解約手数料を支払う。
    B: ナンバープレートをDMVに返却し、登録を抹消する。
    C: 地元の警察署に通知する。
    D: DMV担当者の署名をもらう。
  answer: B
  explanation: 保険を解約する前に、ナンバープレートをDMVに返却し、登録を抹消しなければなりません。
- id: 196
  category: penalties_and_points
  question: 無保険で運転中に摘発され、かつ無保険車両手数料（uninsured motor vehicle fee）を支払っていなかった場合、運転資格を回復するための要件の一つは何ですか？
  choices:
    A: 600ドルの不遵守手数料（noncompliance fee）を支払う。
    B: 500ドルの無保険車両手数料を支払う。
    C: 30日間の禁錮刑に服す。
    D: 車両を州に没収される。
  answer: A
  explanation: 無保険で運転中に摘発され、手数料を支払っていなかった場合、DMVは、600ドルの不遵守手数料の支払い（または支払い計画の承認）と、3年間の保険証明書の提出が完了するまで、運転資格を停止します。
- id: 197
  category: driver_responsibility
  question: 18歳未満で、申請書に臓器提供者（ドナー）になることを「はい」と回答した場合、提供に関する最終的な決定権は誰にありますか？
  choices:
    A: DMVのコミッショナー（局長）。
    B: あなたの両親および保護者。
    C: 病院のスタッフ。
    D: 年齢に関わらず、あなたが最終決定を下す。
  answer: B
  explanation: 18歳未満の場合、「はい」にチェックを入れることで提供の意思を示すことはできますが、法律により、最終的な決定は両親および保護者が行わなければなりません。
- id: 198
  category: safe_driving_rules
  question: 凍結した道路や滑りやすい道路を走行中に停止しなければならない場合、どのようにすべきですか？
  choices:
    A: ブレーキを強く踏み込む。
    B: ブレーキを軽くかける。
    C: ブレーキから足を離し、エンジンブレーキで停止する。
    D: できるだけ速くポンピングブレーキを繰り返す。
  answer: B
  explanation: マニュアルの知識試験サンプルによると、凍結した道路や滑りやすい道路で停止する必要がある場合は、ブレーキを軽くかける必要があります。
- id: 199
  category: safe_driving_rules
  question: 停止を示す正しい手信号はどれですか？
  choices:
    A: 左手と腕を真横に伸ばす。
    B: 左手と腕を上に向ける。
    C: 右手と腕を下に向ける。
    D: 左手と腕を下に向ける。
  answer: D
  explanation: 知識試験サンプルには、停止を示す正しい手信号は、左手と腕を下に向けることであると記載されています。
- id: 200
  category: driver_responsibility
  question: 衝突事故を起こした場合、どのような行動が義務付けられていますか？
  choices:
    A: 直ちに負傷者を最寄りの病院へ連れて行く。
    B: そのまま帰宅し、オンラインで事故報告書を提出する。
    C: 停車し、負傷者を救護し、警察に事故を報告し、情報を交換し、保険会社に通知する。
    D: 車の損傷を確認し、走行可能であればその場を離れる。
  answer: C
  explanation: 知識試験サンプルによると、衝突事故に関与した場合は、停車し、負傷者を救護し、警察に事故を報告し、情報を交換し、保険会社に通知しなければなりません。
- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 徐行して注意深く進む
    B: 完全に一時停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。進む前に、交通状況と歩行者を確認してください。
  id: 201
- image: yield.png
  category: signs_and_signals
  question: この標識は何をすることを求めていますか？
  choices:
    A: 完全に一時停止する
    B: 加速して交通流に合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速し、他の車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 202
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意しながら運転を続ける
    C: 停止してバックするか、向きを変える。あなたは逆走しています。
    D: 加速して速やかにそのエリアから出る
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止/逆走）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に向きを変えるかバックしてください。
  id: 203
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が禁止されていることを意味します。
  id: 204
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識（Warning sign）
    B: 案内標識（Guide sign）
    C: 規制標識（Regulatory sign）
    D: 工事標識（Construction sign）
  answer: C
  explanation: 白地に黒い文字の長方形の標識は規制標識です。速度制限標識は、理想的な条件下においてその区域で法的に許容される最高速度を示しています。
  id: 205
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園またはアニマルパークがある
    B: この地域ではシカが頻繁に道路を横断する
    C: この先に狩猟区域がある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色のひし形の標識は、この地域でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 206
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは通学路
    D: 病院周辺
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路であることを示しています。速度を落とし、子供に注意してください。
  id: 207
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスパーク標識（踏切警標）は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 208
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大きな減速が必要な急カーブを警告している
    C: 右折専用を意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角であることを示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 209
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 分離ハイウェイ（中央分離帯のある道路）の始まり
    D: ハイウェイの出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線が分離されたハイウェイになることを警告しています。右側を通行してください。
  id: 210
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車標章またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転手
  answer: C
  explanation: 車椅子マークの付いた青い標識は、障害者のために予約された駐車スペースを示しています。有効な障害者用駐車標章またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反には高額な罰金が科せられます。
  id: 211
