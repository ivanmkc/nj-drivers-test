    A: 仮免許証（learner's permit）を30日間保持しなければならない。
    B: 仮免許証（learner's permit）を60日間保持しなければならない。
    C: 視力検査に2回合格しなければならない。
    D: オンラインの安全講習を完了しなければならない。
  answer: B
  explanation: 18歳以上の申請者は、最初の路上技能試験を受ける前に、仮免許証を60日間保持するか、運転教育コースを修了する必要があります。
- id: 242
  category: driver_testing
  question: マニュアルによると、申請者はどのくらいの頻度で路上技能試験を受けることができますか？
  choices:
    A: 1営業日に2回。
    B: 1週間に1回。
    C: 1営業日に1回のみ。
    D: 予約が取れる限り何度でも。
  answer: C
  explanation: マニュアルには、「試験は1営業日に1回のみ受けることができます」と記載されています。
- id: 243
  category: license_system
  question: 日中のみに限定された免許に必要な最小の水平視野はどれくらいですか？
  choices:
    A: 40度以上
    B: 70度以上
    C: 100度以上
    D: 110度以上
  answer: B
  explanation: 日中のみに限定された免許の資格を得るには、70度以上の水平視野が必要です。
- id: 244
  category: signs_and_signals
  question: バージニア州の法律において、赤の矢印信号で合法的に右左折ができる唯一の状況は何ですか？
  choices:
    A: 完全に停止した後、道が空いている場合。
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合。
    C: 停止後の右左折を明確に許可する標識が交差点に設置されている場合。
    D: 日中のみ。
  answer: C
  explanation: 「停止後、赤の矢印信号で右折可（Right on Red Arrow After Stop）」または「停止後、赤の矢印信号で左折可（Left
    on Red Arrow After Stop）」という標識が交差点に設置されていない限り、赤の矢印の方向に進むことはできません。
- id: 245
  category: signs_and_signals
  question: 赤の点滅矢印信号がある交差点に近づいた際、正しい手順は何ですか？
  choices:
    A: 徐行し、停止せずに注意して進む。
    B: 完全に停止し、車両や歩行者に道を譲り、安全が確認できたら進む。
    C: 停止し、信号が青になるのを待つ。
    D: 一時停止標識（yield sign）として扱い、必要な場合のみ停止する。
  answer: B
  explanation: マニュアルによると、赤の点滅矢印信号では、完全に停止し、車両や歩行者に優先権を譲り、道が空いている時に矢印の方向に進まなければなりません。
- id: 246
  category: signs_and_signals
  question: 踏切で赤の点滅灯に遭遇した場合、運転者はどうしなければなりませんか？
  choices:
    A: 徐行し、列車が来ていないか確認してから渡る。
    B: 列車が近づいているのが見える場合のみ停止する。
    C: 列車が見えなくても、完全に停止する。
    D: 遮断機が上がっていれば、注意して進む。
  answer: C
  explanation: 赤の点滅灯がある踏切では、列車が見えなくても完全に停止しなければなりません。
- id: 247
  category: license_system
  question: 視力矯正のためにレーザー手術を受け、免許証から「C」制限（眼鏡等の使用）を解除したい場合、どうすればよいですか？
  choices:
    A: 医師からの手紙をDMV本部に郵送する。
    B: 単に運転中に眼鏡をかけるのをやめる。
    C: 免許証の有効期限が切れるのを待ち、対面で更新する。
    D: DMVセンターを訪れ、レンズなしで視力検査に合格するか、視力検査報告書（MED 4）を提出する。
  answer: D
  explanation: レーザー手術後に「C」制限を解除するには、DMVカスタマーサービスセンターを訪れ、眼鏡やコンタクトレンズを着用せずに視力検査に合格するか、視力検査報告書（MED
    4）を提出する必要があります。
- id: 248
  category: license_system
  question: バージニア州の制限なし運転免許証における、最低限の水平視野基準は何ですか？
  choices:
    A: 片目または両目で70度。
    B: 片目または両目で90度。
    C: 片目または両目で110度。
    D: 片目または両目で140度。
  answer: C
  explanation: 制限なし運転免許証の視力基準は、視力が20/40以上、かつ片目または両目の水平視野が110度以上です。
- id: 249
  category: sharing_the_road
  question: 赤信号で合法的に曲がる準備をする際、完全に停止した直後に何をしなければなりませんか？
  choices:
    A: 歩行者に知らせるためにクラクションを鳴らす。
    B: ハザードランプを点灯させる。
    C: 視界を良くするために、横断歩道内に少しずつ進み出る。
    D: 両方向を確認し、歩行者や他の車両に優先権を譲る。
  answer: D
  explanation: 赤信号で曲がる前に、完全に停止し、「両方向を確認し、歩行者や他の車両に優先権を譲らなければなりません。オートバイ、自転車、モペッド（原動機付自転車）などの見えにくい車両も必ず確認してください。」
- id: 250
  category: driver_testing
  question: DMVでの路上試験に不合格となった場合、再受験が可能になるまでの最低待機期間はどれくらいですか？
  choices:
    A: 24時間。
    B: 2日間。
    C: 1週間。
    D: 待機期間はない。
  answer: B
  explanation: マニュアルには、「路上試験に不合格となった場合、再受験まで2日間待たなければならない」と記載されています。
- id: 251
  category: license_system
  question: 片目のみの視力を持つ運転者が日中限定の制限付き免許を取得するための、具体的な水平視野の要件は何ですか？
  choices:
    A: 鼻側に少なくとも70度、耳側に70度。
    B: 鼻側に少なくとも40度、耳側に30度。
    C: 鼻側に少なくとも30度、耳側に40度。
    D: 合計の水平視野が少なくとも90度。
  answer: C
  explanation: 片目のみの視力を持つ人が日中限定の免許を取得するには、鼻側に30度以上、耳側に40度以上の水平視野が必要です。
- id: 252
  category: driver_responsibility
  question: マニュアルによると、バイオプティック望遠レンズを着用している運転者が、特定の免許情報を得るためにはどうすべきですか？
  choices:
    A: DMVの監督者との特別予約を入れる。
    B: DMVの刊行物MED 44を読むか、DMVに電話する。
    C: 専門の運転教育コースに入学する。
    D: 医師の診断書を添えて標準の運転免許申請書を提出する。
  answer: B
  explanation: マニュアルでは次のようにアドバイスしています。「バイオプティック望遠レンズを着用している場合は、dmv.virginia.govで入手可能なDMVの刊行物『バイオプティック望遠レンズ着用者のための運転免許情報（MED
    44）』を読むか、(804) 497-7100でDMVに問い合わせてください。」
- id: 253
  category: safe_driving_rules
  question: 交通信号、標識、路面標示に従うことに加え、交通規制を避けるための行為として具体的に違法とされているのはどれですか？
  choices:
    A: 交差点でのUターン。
    B: 掲示された制限速度よりも遅く走ること。
    C: 駐車場や空き地を通り抜けること。
    D: 交差点から100フィート以内で車線変更すること。
  answer: C
  explanation: マニュアルには、「駐車場や空き地を通り抜けてこれらの交通規制を避けることは違法である」と明記されています。
- id: 254
  category: safe_driving_rules
  question: 交差点で、青信号が点灯しているが特定の矢印信号がない場合に曲がる際、どうしなければなりませんか？
  choices:
    A: 対向車に対して優先権がある。
    B: 対向車や交差点内の歩行者に道を譲らなければならない。
    C: 曲がる前に交差点の手前で完全に停止しなければならない。
    D: 信号が変わる前に素早く曲がる。
  answer: B
  explanation: マニュアルには、「矢印信号なしで曲がる場合は、反対方向から来る車両や交差点内の歩行者に道を譲らなければならない」と記載されています。
- id: 255
  category: signs_and_signals
  question: 赤色の×印が表示されている車線利用信号は何を示していますか？
  choices:
    A: 車線が間もなく閉鎖されるため、安全に車線を変更すること。
    B: 緊急車両専用の車線であること。
    C: この車線を走行することは決して許可されない。
    D: 進行方向に対して車線が開放されていること。
  answer: C
  explanation: マニュアルには、「赤色の×印：赤色の×印が表示されている車線を走行してはならない」と明確に記載されています。
- id: 256
  category: signs_and_signals
  question: 歩行者用ハイブリッドビーコン（PHB）の作動順序において、最初の黄色の一つ点滅の直後に何が起こりますか？
  choices:
    A: 黄色信号が点灯（点滅から点灯に変化）する。
    B: 二つの赤色信号が点灯する。
    C: 緑色の矢印が表示され、進行が許可される。
    D: ビーコンが完全に消灯する。
  answer: A
  explanation: マニュアルではその順序を次のように説明しています。「歩行者がPHBを作動させると、下部にある一つの黄色信号が点滅します。次に、黄色信号が点灯に変わり、ドライバーに停止の準備をするよう警告します。」
- id: 257
  category: signs_and_signals
  question: マニュアルによると、赤色と白色を組み合わせた標識はどのようなメッセージを伝えていますか？
  choices:
    A: カーブなどの前方の危険に対する警告。
    B: ドライバー向けのサービス情報。
    C: 「停止」、「譲れ」、「進入禁止」、「不可」の概念。
    D: 目的地や距離の情報。
  answer: C
  explanation: マニュアルには、「白色と共に使用される赤色は、停止、譲れ、進入禁止、不可を伝えます。一時停止標識、譲れ標識、進入禁止または逆走標識などがその例です」と記載されています。
- id: 258
  category: signs_and_signals
  question: 通常、黒色と白色の標識にはどのような種類の情報が表示されますか？
  choices:
    A: 歴史的または文化的な関心事。
    B: 速度制限や追い越し規則などの規制情報。
    C: スクールゾーンや歩行者横断に関する警告。
    D: 工事区間の案内。
  answer: B
  explanation: マニュアルには、「白色と共に使用される黒色は規制情報を伝えます。速度制限、追い越し禁止、回転禁止などは、法律によって運転が規制されている例です...」と明記されています。
- id: 259
  category: signs_and_signals
  question: 警告標識の特殊な区分で、黒色と組み合わせて強い蛍光黄緑色を使用しているものは、何を知らせるためのものですか？
  choices:
    A: 前方の事故処理エリア。
    B: 前方の休憩所やガソリンスタンド。
    C: スクールゾーン、歩行者、および/または自転車利用者の活動。
    D: 頭上注意（低い桁下制限）。
  answer: C
  explanation: マニュアルには、「警告標識の特殊な区分では、スクールゾーン、歩行者、および/または自転車利用者の活動を知らせるために、黒色と組み合わせて強い蛍光黄緑色が使用されます」と記載されています。
- id: 260
  category: safe_driving_rules
  question: 「進入禁止（Do Not Enter）」または「逆走（Wrong Way）」の標識を誤って通り過ぎてしまったことに気付いた場合、正しい対処法は何ですか？
  choices:
    A: 次の出口が見つかるまで走行を続ける。
    B: 停車し、標識を通り過ぎるまでバックで戻る。
    C: 他のドライバーに警告するためにクラクションを鳴らし続ける。
    D: 直ちに減速して路肩に寄せ、注意深く向きを変える。
  answer: D
  explanation: マニュアルには次のように指示されています。「これらの標識を通り過ぎてしまった場合は... 直ちに減速して路肩に寄せ、注意深く向きを変えてください。」
- id: 261
  category: safe_driving_rules
  question: 「青信号での左折は譲れ（Left Turn Yield on Green）」という標識は何を示していますか？
  choices:
    A: 左折車は対向車に対して優先権がある。
    B: 対向車は停止して自車に道を譲らなければならない。
    C: 左折する車両に優先権はなく、対向車に道を譲らなければならない。
    D: 交差点のすべての車両は、進行する前に一時停止しなければならない。
  answer: C
  explanation: マニュアルには、この標識は「青信号で左折する車両には優先権がなく、反対方向から来る車両に道を譲らなければならないことを示している」と記載されています。
- id: 262
  category: signs_and_signals
  question: 車線利用規制標識（Lane Use Control signs）の主な目的は何ですか？
  choices:
    A: 特定の車線の法定最高速度を示すため。
    B: バスや相乗り車両（HOV）専用の車線を確保するため。
    C: 特定の車線から曲がることが義務付けられている、または許可されている場所を示すため。
    D: 特定の車線の前方の工事を警告するため。
  answer: C
  explanation: マニュアルには、「車線利用規制：これらの標識は、特定の車線において曲がることが義務付けられている場所、または特別な右左折動作が許可されている場所で使用されます」とあります。
- id: 263
  category: safe_driving_rules
  question: 障害者用駐車標識がある駐車スペースは、誰のために予約されていますか？
  choices:
    A: ハザードランプを点灯させていれば、誰でも15分間まで。
    B: 障害者用駐車許可証を発行されている人のみ。
    C: 許可証の有無にかかわらず、70歳以上のすべてのドライバー。
    D: 営業時間内に配達を行う商用車。
  answer: B
  explanation: マニュアルには明確に記載されています。「障害者用駐車場：これらの標識がある駐車スペースは、障害者用駐車許可証を持つ人のために予約されています。」
- id: 264
  category: signs_and_signals
  question: 規制標識において、シンボルに赤い斜線が入った赤い円は世界共通で何を意味しますか？
  choices:
    A: シンボルで示された行動が推奨されている。
    B: シンボルで示された行動について注意が促されている。
    C: シンボルで示された行動が禁止されている。
    D: シンボルで示された行動は特定の時間帯のみ許可されている。
  answer: C
  explanation: マニュアルには、「赤い斜線が入った赤い円は『禁止』を意味することを覚えておいてください。円の中のシンボルが、何が禁止されているかを示しています」と記載されています。
- id: 265
  category: signs_and_signals
  question: 一方向または双方向の左折矢印の車線使用信号がある車線のルールは何ですか？
  choices:
    A: 誰も曲がろうとしていない場合は、この車線を直進してもよい。
    B: 矢印の方向に曲がる目的でのみ、この車線に進入することが許可される。
    C: この車線はピーク時間帯、すべての交通に対して閉鎖される。
    D: 車線に入る前に、他のすべての交通に道を譲らなければならない。
  answer: B
  explanation: マニュアルには、「左折矢印：一方向または双方向の矢印で示された車線には、矢印の方向に曲がる目的でのみ進入が許可されます」と記載されています。
- id: 266
  category: signs_and_signals
  question: 「中央分離帯始点（Divided Highway Begins）」の標識は何を示しており、どのように対応すべきですか？
  choices:
    A: 幹線道路が1車線に合流するため、合流の準備をする。
    B: 幹線道路が終了するため、停止の準備をする。
    C: 道路が中央分離帯で分割されており、それぞれの車道は一方通行である。右側通行を維持しなければならない。
    D: この先の道路は対面通行である。道路の中央に移動する。
  answer: C
  explanation: マニュアルには、「前方で道路が中央分離帯によって2つの別々の車道に分かれており、それぞれの車道は一方通行です。右側を走行してください」と記載されています。
- id: 267
  category: signs_and_signals
  question: 右車線が終了することを示す「車線減少（Lane Reduction）」の標識を見た場合、正しい手順は何ですか？
  choices:
    A: 右車線のドライバーには、直ちに左へ合流する優先権がある。
    B: 左車線のドライバーは、他車が合流できるように停止しなければならない。
    C: 右車線のドライバーはスペースができ次第左へ合流し、左車線のドライバーはスムーズに合流できるように協力すべきである。
    D: すべての交通は完全に停止し、交互に合流しなければならない。
  answer: C
  explanation: マニュアルには、「まもなく右車線が終了します。右車線のドライバーは、スペースができ次第、左側に合流しなければなりません。左車線のドライバーは、他の車両がスムーズに合流できるように協力してください」と記載されています。
- id: 268
  category: signs_and_signals
  question: 急勾配のトラックが描かれた標識（「坂道（Hill）」標識）を見たとき、推奨される行動は何ですか？
  choices:
    A: 勢いを維持するために加速する。
    B: ハザードランプを点灯させる。
    C: ブレーキを点検する。
    D: 他のドライバーに警告するためにクラクションを鳴らす。
  answer: C
  explanation: マニュアルの「坂道（Hill）」標識の項目には、「この先に急勾配があります。ブレーキを点検してください」と記載されています。
- id: 269
  category: sharing_the_road
  question: 馬車に接近または追い越す際、特に「避けるべき」行動は何ですか？
  choices:
    A: 速度を落とすこと。
    B: クラクションを使用すること。
    C: 少なくとも3フィートの間隔を空けること。
    D: 道が開いているときのみ追い越すこと。
  answer: B
  explanation: マニュアルには、馬車に関して「速度を落とし、クラクションを鳴らさないでください」と記載されています。
- id: 270
  category: signs_and_signals
  question: 「T字路（T Intersection）」の標識は何を意味しますか？
  choices:
    A: 道路が続いていないため、Uターンしなければならない。
    B: 走行中の道路がこの先で突き当たりとなり、一時停止・譲った後に右折または左折しなければならない。
    C: 側道が鋭角に幹線道路へ合流している。
    D: 前方の道路は建設工事のため一時的に閉鎖されている。
  answer: B
  explanation: マニュアルでは、T字路の標識について「走行中の道路が前方の停止標識で終わります。対向車や歩行者に道を譲った後、右折または左折しなければなりません」と説明されています。
- id: 271
  category: signs_and_signals
  question: マニュアルによると、「屈曲あり（Winding Road）」の標識がある道路を安全に走行するための鍵は何ですか？
  choices:
    A: すべてのカーブを通して一定の速度を維持する。
    B: より遠くを見るためにハイビームを使用する。
    C: すべてのカーブで、より確実にコントロールするために速度を落とす。
    D: 車線の中央を維持し、速度を調整しない。
  answer: C
  explanation: マニュアルでは、屈曲路について「すべてのカーブにおいて、より確実にコントロールするために速度を落としてください」とアドバイスしています。
- id: 272
  category: signs_and_signals
  question: 標識にある緊急連絡先を使用して踏切の危険な状態を報告する場合、場所を特定するためにどの具体的な情報を提供する必要がありますか？
  choices:
    A: 時刻と進行方向。
    B: 最寄りの町や市の名前。
    C: 自分の車両のナンバープレート番号。
    D: 掲示されている踏切番号。
  answer: D
  explanation: マニュアルには、「危険箇所を正しく特定できるように、掲示されている踏切番号を必ず伝えてください」と記載されています。
- id: 273
  category: signs_and_signals
  question: 「中央分離帯終点（Divided Highway Ends）」の標識は何を警告していますか？
  choices:
    A: 料金所に近づいていること。
    B: 道路が閉鎖されるため、出口を出なければならないこと。
    C: 中央分離帯がなくなり、交通が同じ車道で双方向（対面通行）になること。
    D: 幹線道路が始まるため、右車線に移動すべきであること。
  answer: C
  explanation: マニュアルには、「前方で道路の中央分離帯がなくなります。交通は双方向（対面通行）になります。右側を走行してください」と記載されています。
- id: 274
  category: signs_and_signals
  question: 「歩行者横断」または「自転車横断」の標識に、矢印が描かれた2枚目の標識が添えられている場合、その矢印は何を示していますか？
  choices:
    A: 歩行者や自転車が来る方向。
    B: 横断歩道や自転車横断帯の実際の場所。
    C: 車両の義務的な右左折。
    D: 横断エリアの制限速度。
  answer: B
  explanation: マニュアルには、歩行者および自転車横断標識の両方について次のように記されています。「矢印の付いた2枚目の標識は、横断歩道（または自転車横断帯）の実際の場所を示している場合があります。」
- id: 275
  category: signs_and_signals
  question: クロスマーク（踏切警報標識）、点滅灯、遮断機のある踏切において、遮断機に関するルールは何ですか？
  choices:
    A: 列車が見えない場合は、注意して進むことができる。
    B: 遮断機が1分以上下がっている場合は、遮断機を避けて運転してもよい。
    C: 灯火が点滅したら停止し、下がっている遮断機を避けて運転しようとしてはならない。
    D: 遮断機が完全に下がっている場合のみ停止する。動いている最中であれば横断できる。
  answer: C
  explanation: マニュアルには明確にこう記されています。「灯火が点滅し始めたら、遮断機が下がる前に停止してください。遮断機が上がり、灯火の点滅が止まるまで停止したままでいてください。下がっている遮断機を避けて運転しようとしてはなりません。」
- id: 276
  category: signs_and_signals
  question: 右に急カーブし、その直後に左に曲がる矢印の標識は、何に注意するよう警告していますか？
  choices:
    A: この先のラウンドアバウト（環状交差点）に備える。
    B: 急な右カーブと、それに続く急な左カーブのために減速する。
    C: この先の分岐路のために、右車線か左車線のいずれかを選択する。
    D: 左右両側からの合流車両に注意する。
  answer: B
  explanation: 「急な右左折」標識の説明には次のようにあります。「減速し、前方の道路が右に急カーブし、次に左に曲がることに備えてください。」
- id: 277
  category: signs_and_signals
  question: 「高さ制限（Low Clearance）」の標識がある高架下に近づく場合、どうしなければなりませんか？
  choices:
    A: 進行する前に減速し、クラクションを鳴らす。
    B: 車両の高さが標識に表示されている高さよりも高い場合は、進行してはならない。
    C: 停止して、誘導車の到着を待つ。
    D: すべてのトラックは停止しなければならないが、乗用車は高さを確認せずに進んでもよい。
  answer: B
  explanation: マニュアルには、高さ制限標識について次のように記されています。「車両の高さが標識に表示されている高さよりも高い場合は、進行してはなりません。」
- id: 278
  category: signs_and_signals
  question: 「伸縮継手（Expansion Joints）」の標識は、車線を横切る継手についてドライバーに何を警告していますか？
  choices:
    A: バスの指定停車場所であること。
    B: 段差が生じたり、雨天時にタイヤのグリップ力（トラクション）が失われたりする可能性があること。
    C: 凍結しやすい橋の始まりであること。
    D: 特に二輪車がコントロールを失いやすい場所であること。
  answer: B
  explanation: マニュアルには、「この標識は、車線を横切る継手が段差を作っている場合や、雨天時にトラクションを失うほど幅が広い場合に使用されます」と記されています。二輪車特有の危険を示す標識は「開口継手（Open
    Joints）」標識です。
- id: 279
  category: signs_and_signals
  question: 「右カーブ・側道あり（Right Curve - Side Road）」の標識は、具体的にどのような危険を警告していますか？
  choices:
    A: 道路が右にカーブしており、そのカーブ内で左側から側道が合流している。
    B: 本道が終点となるため、右側に降りなければならない。
    C: 道路が右にカーブしており、左側の側道へ曲がらなければならない。
    D: 右カーブの直後に丁字路（T字路）がある。
  answer: A
  explanation: マニュアルにはこの標識について次のように説明されています。「前方の道路が右にカーブしており、そのカーブ内で左側から側道が合流しています。走行中の道路に進入してくる車両に注意してください。」
