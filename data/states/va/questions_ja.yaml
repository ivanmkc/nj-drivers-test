questions:
- id: 1
  category: driver_responsibility
  question: マニュアルの2024年のデータによると、バージニア州の交通事故による全死者のうち、男性が占める割合は何パーセントですか？
  choices:
    A: 31%
    B: 50%
    C: 71%
    D: 85%
  answer: C
  explanation: マニュアルには、男性は人口の半数よりわずかに少ないにもかかわらず、2024年のバージニア州における交通事故による全死者の71%を占めていると記載されています。
- id: 2
  category: safe_driving_rules
  question: 2024年にバージニア州で発生した交通事故で死亡した乗員のうち、シートベルトを着用していなかった人の割合は何パーセントですか？
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 71%
  answer: C
  explanation: マニュアルによると、2024年に交通事故で死亡した乗員の50%がシートベルトを着用していませんでした。
- id: 3
  category: alcohol_drugs_health
  question: 2024年にバージニア州で発生した飲酒関連の交通事故で死亡した人は何人ですか？
  choices:
    A: '318'
    B: '410'
    C: '500'
    D: '710'
  answer: A
  explanation: マニュアルには、飲酒運転による事故は100%防ぐことができるにもかかわらず、2024年にバージニア州で発生した飲酒関連の交通事故で318人が死亡したと記されています。
- id: 4
  category: alcohol_drugs_health
  question: 未成年者の飲酒に対するバージニア州の法的な立場はどのようなものですか？
  choices:
    A: 血中アルコール濃度(BAC)0.08%の制限が適用される
    B: ゼロ・トレランス（不寛容）法である
    C: 血中アルコール濃度(BAC)0.02%の制限が適用される
    D: 大人が同伴していれば許可される
  answer: B
  explanation: マニュアルには、「バージニア州には未成年者の飲酒に対するゼロ・トレランス（不寛容）法があることを覚えておいてください」と明記されています。
- id: 5
  category: safe_driving_rules
  question: 運転中にテキストメッセージを読んだり送信したりする場合、通常、道路から目を離す時間はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: D
  explanation: マニュアルには、テキストメッセージを読んだり送信したりする際、道路から目を離す時間は5秒間であると記載されています。
- id: 6
  category: defensive_driving
  question: 時速55マイル(mph)で走行中にテキストメッセージを送るために道路から目を離した場合、実質的に目隠しをした状態でアメリカンフットボールのフィールドと同じ距離を進むことになりますが、それは何秒間ですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: D
  explanation: 時速55マイル(mph)で走行中にテキストメッセージを読んだり送信したりすると、5秒間道路から目を離すことになります。これは、実質的に目隠しをした状態でアメリカンフットボールのフィールドと同じ距離を進むのに十分な時間です。
- id: 7
  category: safe_driving_rules
  question: 2024年にバージニア州で発生した速度超過に関連する交通事故による死者数は何人ですか？
  choices:
    A: '318'
    B: '410'
    C: '500'
    D: '71'
  answer: B
  explanation: マニュアルには、2024年にバージニア州で発生した速度超過に関連する交通事故で410人が死亡したと記載されています。
- id: 8
  category: defensive_driving
  question: 前方の車両との安全な車間距離を決定するために、どのようなルールを使用すべきですか？
  choices:
    A: 車両1台分の距離のルール
    B: 2秒、3秒、4秒のルール
    C: 5秒のルール
    D: 10フィートのルール
  answer: B
  explanation: マニュアルでは、前方の車両との車間距離を決定する際、「2秒、3秒、4秒のルール」を使用するよう運転者に推奨しています。
- id: 9
  category: driver_testing
  question: バージニア州運転マニュアルの試験に関するセクションによると、学科試験はどのような形式ですか？
  choices:
    A: 1部構成の試験
    B: 2部構成の試験
    C: 3部構成の試験
    D: 4部構成の試験
  answer: B
  explanation: マニュアルの目次のセクション1には、「2部構成の学科試験 (Two-part knowledge exam)」と記載されています。
- id: 10
  category: penalties_and_points
  question: マニュアルによると、運転以外の違反で運転免許の停止処分につながる可能性があるのは次のうちどれですか？
  choices:
    A: 駐車違反の罰金未払い
    B: 養育費に関する要件の不履行
    C: 有権者登録の不履行
    D: パスポート更新の不履行
  answer: B
  explanation: マニュアルのセクション5では、DMVの要件、免許停止および取り消しの項目に「養育費に関する要件の不履行による免許停止」が挙げられています。
- id: 11
  category: safe_driving_rules
  question: バージニア州運転マニュアルにおいて、「危険な運転行動（Dangerous driving behavior）」として明確に記載されているのは次のうちどれですか？
  choices:
    A: ペットを車に乗せての運転
    B: 居眠り運転
    C: 大音量で音楽を聴くこと
    D: 運転中の飲食
  answer: B
  explanation: マニュアルの第3章では、「危険な運転行動」として、攻撃的な運転（Aggressive driving）、注意散漫な運転（Distracted
    driving）、居眠り運転（Drowsy driving）、および飲酒運転（Drinking and driving）が挙げられています。
- id: 12
  category: penalties_and_points
  question: マニュアルにおいて、運転免許の停止や取り消しにつながる可能性のあるDMV（車両管理局）の要件として記載されているプログラムはどれですか？
  choices:
    A: 車両排ガスプログラム
    B: 保険監視プログラム
    C: 高速道路清掃プログラム
    D: 運転者教育プログラム
  answer: B
  explanation: マニュアルの第5章では、その他のDMV要件、免許停止および取り消しの項目に「保険監視プログラム（Insurance monitoring
    program）」が記載されています。
- id: 13
  category: sharing_the_road
  question: バージニア州運転マニュアルには、次のうちどれと道路を共有（シェア）するための具体的な指示が含まれていますか？
  choices:
    A: 飛行機
    B: ライトレール（次世代型路面電車）
    C: ホバーボード
    D: ATV（四輪バギー）
  answer: B
  explanation: マニュアルの第3章には、「ライトレール（Light rail）」と道路を共有するための具体的な小節が含まれています。
- id: 14
  category: penalties_and_points
  question: バージニア州において、アルコールに関する法律と特に関連している運転免許停止の種類は何ですか？
  choices:
    A: 行政的免許停止 (Administrative License Suspension)
    B: 経済的責任による免許停止 (Financial Responsibility Suspension)
    C: 医学的審査による免許停止 (Medical Review Suspension)
    D: 累積違反点数による免許停止 (Point Accumulation Suspension)
  answer: A
  explanation: マニュアルの第5章では、「アルコールと法律」のセクションに「行政的免許停止（Administrative License Suspension）」が記載されています。
- id: 15
  category: driver_testing
  question: マニュアルの第1章によると、試験プロセスの一部として義務付けられている検査はどの種類ですか？
  choices:
    A: 聴力検査
    B: 反射神経検査
    C: 視力検査
    D: 色覚検査
  answer: C
  explanation: マニュアル第1章の目次には、試験プロセスの一部として「視力検査（Vision screening）」および「視力基準（Vision standards）」が記載されています。
- id: 16
  category: driver_testing
  question: 知識試験のパート1で、パート2に進むためには交通標識の問題に何問正解しなければなりませんか？
  choices:
    A: 10問中7問
    B: 10問中8問
    C: 10問中9問
    D: 10問全問
  answer: D
  explanation: 試験のパート2を受ける前に、パート1の交通標識に関する10問すべての問題に正解する必要があります。
- id: 17
  category: driver_testing
  question: 一般知識試験のパート2の最低合格点は何パーセントですか？
  choices:
    A: 70パーセント
    B: 75パーセント
    C: 80パーセント
    D: 85パーセント
  answer: C
  explanation: パート2では、多肢選択式の問題で一般知識がテストされます。パート2に合格するには、これらの問題の少なくとも80パーセントに正解する必要があります。
- id: 18
  category: driver_testing
  question: 18歳未満で知識試験に不合格となった場合、再受験できるようになるまでどのくらい待たなければなりませんか？
  choices:
    A: 2日間
    B: 5日間
    C: 10日間
    D: 15日間
  answer: D
  explanation: 18歳未満で試験に不合格となった場合、法律により、再受験するまでに丸15日間待たなければなりません。
- id: 19
  category: driver_testing
  question: 知識試験に3回不合格になるとどうなりますか？
  choices:
    A: 永久に免許を取得できなくなる。
    B: 再受験するまでに1年間待たなければならない。
    C: 運転者教育の座学課程を修了し、合格しなければならない。
    D: 再受験のために100ドルの罰金を支払わなければならない。
  answer: C
  explanation: 知識試験に3回不合格になった場合、運転者教育の座学課程を修了して合格するまで、4回目の受験はできません。
- id: 20
  category: vehicle_information
  question: 路上技能試験での使用が許可されていない車両は次のうちどれですか？
  choices:
    A: ピックアップトラック
    B: 4ドアセダン
    C: オートサイクル（三輪自動車）
    D: マニュアルトランスミッション（MT）車
  answer: C
  explanation: 路上技能試験には車両を自分で用意する必要があります（オートサイクルでの受験はできません）。
- id: 21
  category: driver_testing
  question: 18歳以上で、運転者教育（ドライバーズ・エデュケーション）コースを受講しないことを選択した場合、最初の路上実技試験を受ける前に仮免許証（ラーナーズ・パーミット）をどのくらいの期間保持しなければなりませんか？
  choices:
    A: 15日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: C
  explanation: 18歳以上の申請者は、最初の路上実技試験の前に仮免許証を60日間保持するか、運転者教育コースを修了する必要があります。
- id: 22
  category: driver_testing
  question: 路上実技試験に不合格となった場合、再受験できるようになるまでどのくらい待たなければなりませんか？
  choices:
    A: 2日間
    B: 5日間
    C: 7日間
    D: 15日間
  answer: A
  explanation: 路上実技試験に不合格となった場合、再受験するには2日間待たなければなりません。
- id: 23
  category: license_system
  question: 運転免許証の「C」の制限（restriction）は何を示していますか？
  choices:
    A: 昼間のみの運転に制限されています。
    B: 運転時は眼鏡またはコンタクトレンズを着用しなければなりません。
    C: 商用車のみ運転できます。
    D: 免許を持った大人が同乗していなければなりません。
  answer: B
  explanation: 視力検査に合格するために眼鏡やコンタクトレンズの着用が必要な場合、運転時にもそれらを着用しなければなりません。この制限がある場合、免許証には「C」と表示されます。
- id: 24
  category: license_system
  question: バージニア州における無制限の運転免許証の視力基準は何ですか？
  choices:
    A: 両眼の視力が20/20で、水平視野が180度。
    B: 片眼または両眼の視力が20/40以上で、水平視野が110度。
    C: 片眼の視力が20/70以上で、水平視野が70度。
    D: 両眼の視力が20/50で、水平視野が90度。
  answer: B
  explanation: 無制限の運転免許証の基準は、片眼または両眼の視力が20/40以上であり、かつ水平視野が110度以上であることです。
- id: 25
  category: license_system
  question: 昼間運転限定の制限付き免許証を持つ運転者が運転を許可されている時間帯はいつですか？
  choices:
    A: 午前6時から午後6時まで。
    B: 日の出から日没まで。
    C: 日の出の30分後から日没の30分前まで。
    D: 日の出の30分前から日没の30分後まで。
  answer: C
  explanation: 昼間運転限定の制限付き免許証では、日の出の30分後から始まり、日没の30分前に終わる時間帯のみ運転が許可されます。
- id: 26
  category: safe_driving_rules
  question: 駐車場や空き地を通り抜けて交通規制を回避することは合法ですか？
  choices:
    A: はい、交差点が事故で塞がれている場合は合法です。
    B: はい、商用車を運転している場合は合法です。
    C: いいえ、このような方法で交通規制を回避することは違法です。
    D: いいえ、右折する場合を除き違法です。
  answer: C
  explanation: 駐車場や空き地を通り抜けてこれらの交通規制を回避することは違法です。
- id: 27
  category: signs_and_signals
  question: 赤信号での右折が許可されないのはどのような場合ですか？
  choices:
    A: 「赤信号での右折禁止（No Turn on Red）」の標識がある場合、または右向きの赤色矢印信号が点灯している場合。
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合。
    C: 横断歩道に歩行者がいない場合。
    D: マニュアルトランスミッション車を運転している場合。
  answer: A
  explanation: 交差点に「赤信号での右折禁止（No Turn on Red）」の標識が設置されている場合、または右向きの赤色矢印信号が表示されている場合は、赤信号で右折してはいけません。
- id: 28
  category: signs_and_signals
  question: 赤信号での左折が許可されるのはどのような条件のときですか？
  choices:
    A: 対面通行（双方向）の道路から一方通行の道路へ曲がる場合。
    B: 一方通行の道路から別の一方通行の道路へ曲がる場合。
    C: 対面通行の道路から別の対面通行の道路へ曲がる場合。
    D: 赤信号での左折は決して許可されません。
  answer: B
  explanation: 一方通行の道路を走行しており、交通信号が赤のときに別の一方通行の道路へ左折する場合に限り、赤信号での左折が許可されます。
- id: 29
  category: signs_and_signals
  question: 交通信号が赤であるにもかかわらず、警察官から交差点を通過するよう指示された場合、どうするべきですか？
  choices:
    A: 停止し、信号が青になるのを待つ。
    B: 警察官の指示に従う。
    C: 前進する前にクラクションを鳴らして他の運転者に警告する。
    D: 車を路肩に寄せ、警察官が立ち去るのを待つ。
  answer: B
  explanation: 警察官による指示がない限り、すべての標識や信号に従わなければなりませんが、指示がある場合は常に警察官の指示に従ってください。
- id: 30
  category: driver_testing
  question: DMV（車両管理局）での路上実技試験に3回不合格となった場合、何が必要になりますか？
  choices:
    A: 再受験する前に60日間待たなければならない。
    B: 2部構成の学科試験を再受験しなければならない。
    C: 運転者教育の車内実技部分を修了し、合格しなければならない。
    D: 50ドルの罰金を支払わなければならない。
  answer: C
  explanation: DMVでの路上実技試験に3回不合格となった場合、DMVまたは教育省が承認した自動車教習所で運転者教育の車内実技部分を修了し合格するまで、4回目の試験を受けることはできません。
- id: 31
  category: signs_and_signals
  question: バージニア州において、赤信号で左折できるのはどのような条件のときですか？
  choices:
    A: 交差点に対向車がいない場合はいつでも。
    B: 完全に一時停止した後、一方通行の道路から別の一方通行の道路へ左折する場合。
    C: 対面通行（双方向）の道路から一方通行の道路へ左折する場合。
    D: いかなる状況でも赤信号での左折は許可されていない。
  answer: B
  explanation: 赤信号のときに一方通行の道路から別の一方通行の道路へ左折する場合、最初に完全に一時停止することを条件として、左折することが認められています。
- id: 32
  category: signs_and_signals
  question: 赤色の矢印の交通信号は何を意味していますか？
  choices:
    A: 歩行者に道を譲った後、矢印の方向に進むことができる。
    B: 停止しなければならず、標識で許可されていない限り矢印の方向に進むことはできない。
    C: 完全に一時停止した後、矢印の方向に曲がることができる。
    D: 信号がまもなく青に変わるため、加速する準備をする。
  answer: B
  explanation: 赤色の矢印は、矢印の方向に進む場合は停止しなければならないことを意味します。「Right on Red Arrow After Stop（停止後、赤色矢印での右折可）」または「Left
    on Red Arrow After Stop（停止後、赤色矢印での左折可）」という標識がない限り、進むことはできません。
- id: 33
  category: safe_driving_rules
  question: 停電のため交通信号が機能していない交差点に近づいた場合、どのように進むべきですか？
  choices:
    A: 右側の車両に道を譲り、停止せずに進む。
    B: 減速し、完全に停止することなく注意して進む。
    C: 停止し、全方向一時停止（オールウェイ・ストップ）の交差点であるかのように進む。
    D: 警察官が到着するまで交差点で待機する。
  answer: C
  explanation: 停電やその他の問題で交通信号が機能しておらず、何も点灯していない場合、停止することが義務付けられており、全方向一時停止（オールウェイ・ストップ）の交差点であるかのように進まなければなりません。
- id: 34
  category: signs_and_signals
  question: 黄色の「X」または黄色の「斜め下向き矢印」の車線利用信号は何を示していますか？
  choices:
    A: 安全が確認でき次第、できるだけ早くその車線から移動しなければならない。
    B: 制限速度内でその車線を走行することが許可されている。
    C: その車線で完全に一時停止しなければならない。
    D: その車線は左折にのみ使用できる。
  answer: A
  explanation: 黄色の「X」または黄色の「斜め下向き矢印」は、安全が確認でき次第、できるだけ早くその車線から移動しなければならないことを意味します。
- id: 35
  category: signs_and_signals
  question: 歩行者用ハイブリッド信号（PHB）が交互に点滅する赤色灯を表示している場合、運転手はどうすべきですか？
  choices:
    A: 信号がまもなく赤の点灯に変わるため、停止する準備をする。
    B: 横断歩道に誰もいない場合は、注意して進む。
    C: 停止し、信号が青に変わるまで待ち続ける。
    D: 交差点を早く通過するために加速する。
  answer: B
  explanation: 歩行者用の横断信号がカウントダウンしている間、PHBの2つの赤色灯は交互に点滅し、横断歩道に誰もいない場合は注意して進むことができることを運転手に伝えます。
- id: 36
  category: signs_and_signals
  question: ピンク色と黒色の交通標識はどのような情報を伝えていますか？
  choices:
    A: 工事区域。
    B: 運転者向けのサービス。
    C: 歴史的または文化的な名所。
    D: 事故・事件などの発生区域。
  answer: D
  explanation: ピンク色と黒色の標識は、事故・事件などの発生区域（インシデントエリア）での助言や警告に使用されます。
- id: 37
  category: signs_and_signals
  question: 五角形の交通標識は何を示していますか？
  choices:
    A: 一時停止。
    B: 前方優先（道を譲れ）。
    C: スクールゾーンおよび学校横断歩道。
    D: 前方の特殊な状況や危険。
  answer: C
  explanation: 5つの辺を持つ五角形の標識は、スクールゾーンを示し、学校横断歩道について警告するものです。
- id: 38
  category: signs_and_signals
  question: ひし形の交通標識の意味は何ですか？
  choices:
    A: 指示を与えたり、法律を伝えたりする。
    B: 前方の特殊な状況や危険を警告する。
    C: 追い越し禁止区域の始まりを示す。
    D: 前方に踏切があることを示す。
  answer: B
  explanation: ひし形の標識は、前方の特殊な状況や危険を警告するものです。減速し、注意して運転する必要があります。
- id: 39
  category: safe_driving_rules
  question: 制限速度の標識と天候条件に関して、次のうち正しいものはどれですか？
  choices:
    A: 天候に関係なく、標識の制限速度で運転していれば違反切符を切られることはない。
    B: 標識の制限速度は、雨、雪、または路面凍結時にのみ適用される。
    C: 標識の制限速度以下で運転していても、状況に対して速すぎる場合は違反切符を切られることがある。
    D: 雨が降ると、制限速度は自動的に時速10マイル下がる。
  answer: C
  explanation: 雨、雪、路面凍結の際は、標識の制限速度以下で運転していても、その状況に対して速すぎる運転をしたとして違反切符を切られることがあります。
- id: 40
  category: safe_driving_rules
  question: バージニア州では、「No Left Turn（左折禁止）」の標識がある交差点でUターンは許可されていますか？
  choices:
    A: はい。「No U-Turn（Uターン禁止）」の標識も設置されていない限り許可される。
    B: はい。ただし、交差点に他の車両が全くいない場合に限る。
    C: いいえ。Uターンは2回の左折とみなされるため、「No Left Turn（左折禁止）」の標識がある場合は違法となる。
    D: いいえ。バージニア州ではすべての交差点でUターンが違法である。
  answer: C
  explanation: バージニア州では、Uターンは2回の左折とみなされるため、「No Left Turn（左折禁止）」の標識がある場合は違法となります。
- id: 41
  category: signs_and_signals
  question: 黄色の点滅信号は何を意味しますか？
  choices:
    A: 完全に停止し、対向車に道を譲る。
    B: 減速し、注意して進む。
    C: 信号機が故障している。
    D: 矢印の方向に進むつもりなら停止する。
  answer: B
  explanation: 黄色の点滅信号は、減速して注意しながら進むことを意味します。黄色の点滅信号は、通常よりも危険度が高い場所に設置されています。
- id: 42
  category: signs_and_signals
  question: 茶色と白の交通標識の目的は何ですか？
  choices:
    A: 目的地に関する情報を提供する。
    B: 運転手向けのサービスについて知らせる。
    C: その地域の歴史的または文化的な名所を案内する。
    D: 工事について警告する。
  answer: C
  explanation: 茶色の標識は、その地域にある歴史的または文化的な名所を案内するために使用されます。
- id: 43
  category: signs_and_signals
  question: 黄色の点灯信号がある交差点に近づき、まだ交差点に進入していない場合、どうすべきですか？
  choices:
    A: 赤になる前に通過できるよう加速する。
    B: 停止することが危険でない限り、停止する。
    C: 現在の速度のまま交差点を通過する。
    D: 道路の端に車を寄せる。
  answer: B
  explanation: 黄色信号は、信号がまもなく変わることを知らせる注意警告です。まだ交差点に進入していない場合は停止してください。ただし、停止するのが危険な場合は、注意して通過してください。
- id: 44
  category: sharing_the_road
  question: 歩行者が交差点内にいる間に、信号が赤から黄色の点滅矢印に変わった場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして、歩行者に早く動くよう警告する。
    B: 自分に優先権があるため、すぐに曲がる。
    C: 歩行者が道路を渡り終えるのを待ってから曲がる。
    D: 歩行者を避けてゆっくりと運転し、交差点を通過する。
  answer: C
  explanation: 歩行者が交差点内にいる間に信号が赤から黄色の点滅矢印に変わった場合は、歩行者が道路を渡り終えるのを待ってから曲がってください。
- id: 45
  category: safe_driving_rules
  question: 4方向一時停止（4-Way stop）の交差点で、他の車両と同時に到着した場合、誰が道を譲らなければなりませんか？
  choices:
    A: 右側の運転手が左側の運転手に道を譲らなければならない。
    B: 左側の運転手が右側の運転手に道を譲らなければならない。
    C: 直進する運転手が曲がる運転手に道を譲らなければならない。
    D: より大きな車両の運転手に優先権がある。
  answer: B
  explanation: 「全方向（All Way）」または「4方向（4 Way）」一時停止の交差点で、他の車両と同時に到着した場合、左側の運転手が右側の運転手に道を譲らなければなりません。
- id: 46
  category: signs_and_signals
  question: 勧告速度標識（Advisory Speed sign）は何を示していますか？
  choices:
    A: 高速道路の最低制限速度。
    B: 高速道路の出口における安全な最高速度。
    C: スクールゾーンの制限速度。
    D: 追い越し時の推奨速度。
  answer: B
  explanation: マニュアルによると、勧告速度標識は高速道路の出口における安全な最高速度を示しています。
- id: 47
  category: sharing_the_road
  question: 州法では、馬車（horse-drawn buggies）を追い越す際、どのくらいの間隔を空けることが義務付けられていますか？
  choices:
    A: 少なくとも2フィート
    B: 少なくとも3フィート
    C: 少なくとも4フィート
    D: 少なくとも5フィート
  answer: B
  explanation: 州法では、進路が安全な場合、運転手は馬車を追い越す際に少なくとも3フィートの間隔を空けることが義務付けられています。
- id: 48
  category: safe_driving_rules
  question: 「雨天スリップ注意（Slippery When Wet）」の標識がある道路を走行中で、路面が濡れている場合、どうすべきですか？
  choices:
    A: 急ブレーキをかけてタイヤのグリップ力を試す。
    B: 前の車との車間距離を縮める。
    C: 前の車との車間距離を広げる。
    D: 通常の速度を維持し、頻繁に車線変更をする。
  answer: C
  explanation: 路面が濡れている場合、マニュアルでは、速度を落とし、急ブレーキや急な方向転換を避け、前の車との車間距離を広げるべきだと記載されています。
- id: 49
  category: signs_and_signals
  question: ラウンドアバウト（環状交差点）に近づく際の正しい手順は何ですか？
  choices:
    A: 道を譲らずに進入し、時計回りに進む。
    B: すでに交差点内にいる車両に道を譲り、反時計回りに進む。
    C: 完全に停止し、青信号を待つ。
    D: 交差点に進入してくる車両に道を譲り、時計回りに進む。
  answer: B
  explanation: ラウンドアバウトでは、進入する車両はすでに交差点内にいる車両に優先権を譲り、反時計回りに進まなければなりません。
- id: 50
  category: defensive_driving
  question: 踏切内で車がエンスト（立ち往生）した場合、どうすべきですか？
  choices:
    A: 車内に留まり、911に電話する。
    B: 車から降りて、列車の進行方向と同じ方向に走る。
    C: 自分で車を押して線路から出そうとする。
    D: すぐに車から降りて、近づいてくる列車の方向に向かって、線路から斜めに離れるように走る。
  answer: D
  explanation: 踏切内で車が立ち往生した場合、マニュアルでは、すぐに車から降りて、近づいてくる列車の方向に向かって、線路から斜めに離れるように走るよう指示しています。
- id: 51
  category: penalties_and_points
  question: 高速道路の作業区間（ワークゾーン）で携帯通信機器を使用したとして有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 100ドルの罰金
    B: 250ドルの罰金
    C: 500ドルの罰金
    D: 30日間の免許停止
  answer: B
  explanation: 高速道路の作業区間で携帯通信機器を使用したとして有罪判決を受けた場合、250ドルの罰金が科せられます。
- id: 52
  category: penalties_and_points
  question: 高速道路の作業区間で制限速度を超過した場合の最大罰金額はいくらですか？
  choices:
    A: 100ドル
    B: 250ドル
    C: 500ドル
    D: 1,000ドル
  answer: C
  explanation: 高速道路の作業区間で制限速度を超過したとして有罪判決を受けた場合、最大500ドルの罰金が科せられる可能性があります。
- id: 53
  category: signs_and_signals
  question: 「追い越し禁止区間（No Passing Zone）」の標識は何を意味していますか？
  choices:
    A: 安全が確認できれば、車を追い越してもよい。
    B: 安全が確認できる場合でも、同じ車線の前方を走る車を追い越してはならない。
    C: 商用車のみ追い越しが禁止されている。
    D: 前方の車が制限速度以下で走行している場合のみ追い越してもよい。
  answer: B
  explanation: 追い越し禁止区間の標識は、安全が確認できる場合でも、同じ車線の前方を走る車を追い越してはならない区間の始まりを示しています。
- id: 54
  category: sharing_the_road
  question: 踏切の警報機が点滅していない場合でも、常に踏切で一時停止することが義務付けられているのはどの車両ですか？
  choices:
    A: 乗用車
    B: オートバイ
    C: スクールバス
    D: 配達用トラック
  answer: C
  explanation: マニュアルには、スクールバスは警報機が点滅していない場合でも、常に踏切で一時停止しなければならないと記載されています。
- id: 55
  category: safe_driving_rules
  question: バリケードやコーンなどの交通規制設備がある作業区間を走行する際、どうするべきですか？
  choices:
    A: 車両を車線の中央に保ち、完全に通過するまで車線を変更しない。
    B: 他の車両のためのスペースを空けるため、できるだけ設備に近づいて走行する。
    C: 設備を避けるために頻繁に車線を変更する。
    D: 作業区間を早く抜けるために速度を上げる。
  answer: A
  explanation: 作業区間で交通規制設備の近くを走行する際は、車両を車線の中央に保ち、制限速度を守り、作業区間を完全に通過するまで車線を変更しないでください。
- id: 56
  category: signs_and_signals
  question: 作業区間を示し、減速して注意を払うべきことを意味する色は何色ですか？
  choices:
    A: 赤色
    B: 黄色
    C: オレンジ色
    D: 緑色
  answer: C
  explanation: オレンジ色は作業区間を示し、減速して注意を払うことを意味します。
- id: 57
  category: sharing_the_road
  question: 「継ぎ目あり（Open Joints）」の標識がオートバイの運転手にとって特に重要である理由は何ですか？
  choices:
    A: オートバイ専用の駐車スペースを示しているため。
    B: 継ぎ目によってオートバイの運転手がコントロールを失う可能性があるため。
    C: オートバイ専用車線を示しているため。
    D: オートバイにのみ影響を与える強風を警告しているため。
  answer: B
  explanation: マニュアルでは、橋やランプ（傾斜路）の継ぎ目によってオートバイの運転手がコントロールを失う可能性があるため、減速するよう警告しています。
- id: 58
  category: safe_driving_rules
  question: 同じ方向に進む2つの車線が1つになる（合流する）場合、安全に合流する責任は誰にありますか？
  choices:
    A: 右車線の運転手のみ。
    B: 左車線の運転手のみ。
    C: 両方の車線の運転手に安全に合流する責任がある。
    D: より大型の車両の運転手。
  answer: C
  explanation: 2つの車線が1つになる合流地点では、両方の車線の運転手に安全に合流する責任があります。
- id: 59
  category: signs_and_signals
  question: 「低床車踏切注意（Low Ground Railroad Crossing）」の標識は、運転手に何を警告していますか？
  choices:
    A: 踏切が現在工事中であること。
    B: このエリアでは列車が低速で走行すること。
    C: 急な傾斜のため、車高の低い車両の底が線路に引っかかったり擦れたりする可能性があること。
    D: 車高の低い車両のみが横断を許可されていること。
  answer: C
  explanation: この標識は、線路が道路と交差する場所の急な傾斜により、車高の低い車両の底が線路に引っかかったり擦れたりする可能性があることを警告しています。
- id: 60
  category: safe_driving_rules
  question: 作業区間を抜ける際、どうするべきですか？
  choices:
    A: 通常の交通の流れに戻るため、すぐに速度を上げる。
    B: 工事車両を避けるために車線を変更する。
    C: 完全に通過するまで車線を維持し、速度を保つ。
    D: 停止して、破片による車両の損傷がないか確認する。
  answer: C
  explanation: 作業区間を抜ける際は、車線を維持し、速度を保ってください。作業区間を完全に通過するまで車線を変更しないでください。
- id: 61
  category: signs_and_signals
  question: 低速車両標識（低速車マーク）を表示している車両は、最高時速何マイルで走行していますか？
  choices:
    A: 15 MPH
    B: 25 MPH
    C: 35 MPH
    D: 45 MPH
  answer: B
  explanation: 農機具、馬車、高速道路の作業車両など、時速25マイル以下で走行する低速車両は、公道を利用する際にこれらの標識を表示しなければなりません。
- id: 62
  category: signs_and_signals
  question: 路面にある赤色の反射板は何を示していますか？
  choices:
    A: 近くに消火栓がある。
    B: 4方向一時停止の交差点に近づいている。
    C: 進行方向が間違っており、進入してはならない。
    D: この先にスクールゾーンがある。
  answer: C
  explanation: 路面の赤色の反射板は、進入や使用をしてはならないエリアを示しています。これらは、間違った方向に進行している車両からのみ見えるように路面に配置されています。
- id: 63
  category: safe_driving_rules
  question: 道路の中央にある黄色の二重実線を越えることが許可されるのはどのような場合ですか？
  choices:
    A: 低速のトラクターを追い越すとき。
    B: 左折するとき、または歩行者や自転車を追い越すとき。
    C: 前方の車両が制限速度未満で走行しているとき。
    D: 黄色の二重実線を越えることはいかなる場合も許可されない。
  answer: B
  explanation: どちらの方向への追い越しも禁止されています。ただし、対向車線がクリアな状態で、左折する場合、または歩行者、自転車、スクーターやスケートボードの利用者を追い越す場合を除き、この線を越えてはなりません。
- id: 64
  category: signs_and_signals
  question: 間隔の狭い小さな長方形で構成される白の点線の目的は何ですか？
  choices:
    A: 横断歩道を示すため。
    B: 交差点やインターチェンジでの車線割り当てを示すため。
    C: 舗装路の右端を示すため。
    D: 対向する交通を分離するため。
  answer: B
  explanation: 白の点線は、実際には連続した小さな長方形です。これらは、車線を逸脱しやすい交差点やインターチェンジにおいて、車線の割り当てを示すために使用されます。
- id: 65
  category: safe_driving_rules
  question: 3車線道路で、中央車線の両側が黄色の実線と黄色の破線で区切られている場合、この車線をどのくらいの距離まで走行できますか？
  choices:
    A: 最大50フィート。
    B: 最大100フィート。
    C: 最大150フィート。
    D: 最大200フィート。
  answer: C
  explanation: 中央車線の両側が黄色の実線と黄色の破線で区切られている場合、どちらの方向に進行する運転者も左折のためにその車線を使用できます。ただし、この車線を150フィートを超えて走行することはできません。
- id: 66
  category: sharing_the_road
  question: 共有車線表示（シャロウ）は何を示していますか？
  choices:
    A: その車線は自転車専用である。
    B: その車線は狭いため、自動車と自転車が並走することはできない。
    C: 自転車は常に自動車に道を譲らなければならない。
    D: 自動車はその車線への進入が禁止されている。
  answer: B
  explanation: 共有車線表示（シャロウ）は、自動車と自転車が並走するには狭すぎる走行車線で使用されます。
- id: 67
  category: sharing_the_road
  question: ペイントされた自転車専用ボックス（バイクボックス）がある交差点に赤信号で接近した場合、どこで停止しなければなりませんか？
  choices:
    A: 自転車専用ボックスの中。
    B: すべての自転車専用ボックスの後方。
    C: 自転車専用ボックスを越えた、交差点の中。
    D: 右折する場合は停止する必要はない。
  answer: B
  explanation: 運転者は赤信号の際、自転車専用ボックスの中ではなく、すべての自転車専用ボックスの後方で停止しなければなりません。
- id: 68
  category: sharing_the_road
  question: 自転車専用ボックスがある交差点で、赤信号での右折は許可されていますか？
  choices:
    A: はい、先に自転車に道を譲る場合は許可される。
    B: はい、ただし自転車専用ボックスが緑色にペイントされている場合のみ許可される。
    C: いいえ、これらの交差点では赤信号での右折は許可されていない。
    D: いいえ、多人数乗車車両（HOV）を運転していない限り許可されない。
  answer: C
  explanation: これらの交差点（自転車専用ボックスがある交差点）では、赤信号での右折は許可されていません。
- id: 69
  category: safe_driving_rules
  question: 交通渋滞時に、多人数乗車車両（HOV）専用車線の使用が一般的に許可されている車両は次のうちどれですか？
  choices:
    A: 時速65マイル以上で走行しているすべての車両。
    B: 商業用貨物トラック。
    C: オートバイ。
    D: トレーラーを牽引している車両。
  answer: C
  explanation: 交通渋滞時、HOV車線はバス、バンプール、カープール、その他の多人数乗車車両、オートバイ、および特定のクリーン特殊燃料車両専用となります。
- id: 70
  category: safe_driving_rules
  question: トランスポンダ（車載器）を持たずに、誤って高速E-ZPass（自動料金収受システム）専用レーンに進入してしまった場合、どうすればよいですか？
  choices:
    A: すぐに停止して後退する。
    B: 路肩に車を寄せて料金所の係員を待つ。
    C: 停止してカメラの場所で現金で支払う。
    D: 停止しない。登録されている車両の所有者に通行料が請求される。
  answer: D
  explanation: 誤ってこれらのレーンに進入してしまった場合でも、停止しないでください。停止するのは危険であり、追突事故を引き起こす可能性があります。カメラが車のナンバープレートを撮影し、登録されている車両の所有者に通行料が請求されます。
- id: 71
  category: signs_and_signals
  question: 黄色く塗られた縁石は何を意味しますか？
  choices:
    A: 乗客の乗降に必要な時間のみ停車する。
    B: 荷物の積み下ろしに必要な時間のみ停車し、車から離れない。
    C: 停車、駐車、または駐停車をしてはならない。
    D: 最大30分間の駐車が許可されている。
  answer: B
  explanation: 黄色 — 荷物の積み下ろしに必要な時間のみ停車します。車から離れないでください。
- id: 72
  category: safe_driving_rules
  question: 作業区間の手前の車線を横切るように設置されたランブルストリップス（減速帯）を通過する際、運転手はどのように対応すべきですか？
  choices:
    A: タイヤの損傷を防ぐため、避けて通る。
    B: 早く通過するために加速する。
    C: 避けずに、ゆっくりと上を通過する。
    D: 通過する直前で停止する。
  answer: C
  explanation: ランブルストリップスは避けて通るのではなく、ゆっくりと上を通過する必要があります。
- id: 73
  category: signs_and_signals
  question: 二重の白の実線を越える際のルールは何ですか？
  choices:
    A: 車線変更のために注意して越えてもよい。
    B: 低速車両を追い越す場合にのみ越えてもよい。
    C: これらの線を越えてはならない。
    D: Uターンをするために越えてもよい。
  answer: C
  explanation: 二重の白の実線は、同じ方向に進む車線を区切るものです。これらの線を越えることはできません。
- id: 74
  category: signs_and_signals
  question: 道路を横切るように引かれる「ゆずり合い線（yield line）」には、どのような図形が使われますか？
  choices:
    A: 正方形
    B: 円
    C: 三角形
    D: ひし形
  answer: C
  explanation: ゆずり合い線（yield line）は、道路を横切るように描かれた三角形の線であり、ゆずり合い（yield）の標識とともに使用され、道を譲るか停止しなければならない位置を示します。
- id: 75
  category: safe_driving_rules
  question: ハンドルを握る際、推奨される手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置
    C: 8時と4時の位置
    D: 7時と5時の位置
  answer: C
  explanation: マニュアルには、ハンドルを時計に見立てた場合、両手は8時と4時の位置にあるべきだと記載されています。
- id: 76
  category: penalties_and_points
  question: バージニア州法では、次のように運転した場合、無謀運転（reckless driving）で告発される可能性があります：
  choices:
    A: 制限速度を時速10マイル以上超過している。
    B: 制限速度を時速15マイル以上超過している。
    C: 制限速度を時速20マイル以上超過している、または時速85マイルを超えている。
    D: いかなる高速道路でも時速75マイルを超えている。
  answer: C
  explanation: バージニア州法によると、制限速度を時速20マイル（MPH）以上超過して運転している場合、または時速85マイルを超えて運転している場合、警察官は無謀運転として告発することができます。
- id: 77
  category: safe_driving_rules
  question: 特に標識がない場合、未舗装道路での乗用車の最高制限速度はどれくらいですか？
  choices:
    A: 時速25マイル (25 MPH)
    B: 時速35マイル (35 MPH)
    C: 時速45マイル (45 MPH)
    D: 時速55マイル (55 MPH)
  answer: B
  explanation: 別の速度制限を示す標識がない限り、未舗装道路における乗用車およびオートバイの最高制限速度は時速35マイル（35 MPH）です。
- id: 78
  category: safe_driving_rules
  question: バージニア州におけるレーダー探知機に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 州間高速道路でのみ合法である。
    B: 乗用車では合法だが、商用車では違法である。
    C: バージニア州ではレーダー探知機の使用は違法である。
    D: 制限速度内で運転している場合は許可される。
  answer: C
  explanation: マニュアルには「バージニア州ではレーダー探知機の使用は違法である」と明記されています。
- id: 79
  category: penalties_and_points
  question: 警察官の停止合図に従わず、追跡した警察官がその直接的な結果として死亡した場合、どのような罰則が科せられますか？
  choices:
    A: 第1級軽犯罪 (Class 1 misdemeanor)
    B: 第4級重罪 (Class 4 felony)
    C: 500ドルの罰金および免許停止
    D: 交通違反 (Traffic infraction)
  answer: B
  explanation: 警察官の停止合図に従わず、追跡した警察官がその追跡の直接的な結果として死亡した場合、第4級重罪（Class 4 felony）となります。
- id: 80
  category: sharing_the_road
  question: 赤いライトを点滅させて停車しているスクールバスに対して、停止しなくてもよいのはどのような場合ですか？
  choices:
    A: 多車線道路で同じ方向に進行している場合。
    B: 中央分離帯や防護柵で区切られた道路で、反対方向に進行している場合。
    C: 私道や学校の敷地内の道路にいる場合。
    D: バスが乗客を乗せているが、一時停止標識（ストップサイン）が出されていない場合。
  answer: B
  explanation: 中央分離帯や防護柵で区切られた道路で反対方向に進行しており、バスが反対車線にいる場合は、停止する必要はありません。
- id: 81
  category: safe_driving_rules
  question: 次のうち、「空走距離（reaction distance）」を説明しているものはどれですか？
  choices:
    A: 危険を認識するのにかかる時間。
    B: 問題を認識してからブレーキをかけるまでの間に車両が進む距離。
    C: ブレーキをかけてから車が進む距離。
    D: 時速60マイル（60 MPH）から車両が停止するまでにかかる総距離。
  answer: B
  explanation: 空走距離（reaction distance）は、問題を認識してからブレーキをかけるまでの間に車両が進む距離として定義されています。
- id: 82
  category: safe_driving_rules
  question: 濡れた路面は車両の停止距離にどのような影響を与えますか？
  choices:
    A: 制動距離が2倍になる可能性がある。
    B: 認知時間が短縮される。
    C: 空走距離が短くなる。
    D: アンチロックブレーキ（ABS）が装備されていれば影響はない。
  answer: A
  explanation: マニュアルには、路面の状態が制動距離に影響を与えると記載されており、例えば、濡れた路面では制動距離が2倍になる可能性があるとされています。
- id: 83
  category: vehicle_information
  question: 車両にアンチロックブレーキ（ABS）が装備されている場合、何を覚えておくべきですか？
  choices:
    A: 滑りやすい道路で停止する際は、ブレーキを軽くポンピングする。
    B: アンチロックブレーキを絶対にポンピングしない。
    C: 同時にパーキングブレーキをかける。
    D: 雨天時はシステムをオフにする。
  answer: B
  explanation: マニュアルでは、「アンチロックブレーキを絶対にポンピングしてはいけない」と運転者に明確に警告しています。
- id: 84
  category: sharing_the_road
  question: 4車線未満の幹線道路（ハイウェイ）で停車中のゴミ収集車を追い越す際、車線変更ができない場合はどうしなければなりませんか？
  choices:
    A: 停止して、その車両が動くのを待つ。
    B: クラクションを鳴らし、速度を維持する。
    C: 制限速度より時速10マイル（10 MPH）遅い速度まで減速し、少なくとも2フィート左側を通過する。
    D: 加速して、できるだけ早くその車両を追い越す。
  answer: C
  explanation: 4車線未満の幹線道路（ハイウェイ）にいる場合、または車線変更ができない場合は、制限速度より時速10マイル（10 MPH）遅い速度まで減速し、車両の少なくとも2フィート左側を通過しなければなりません。
- id: 85
  category: safe_driving_rules
  question: ライトを点滅させている緊急車両の後ろを走行する際、維持しなければならない最小車間距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: マニュアルには、「ライトを点滅させている緊急車両の後ろを500フィート未満の距離で追従してはならない」と記載されています。
- id: 86
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）に進入した後、運転者はどの方向に進まなければなりませんか？
  choices:
    A: 時計回り
    B: 反時計回り
    C: 中央の島をまっすぐ通り抜ける
    D: 出口まで最も短い方向
  answer: B
  explanation: ラウンドアバウトに進入した後、運転者は反時計回りに進まなければなりません。
- id: 87
  category: safe_driving_rules
  question: 標識や信号のない交差点に、異なる方向から2台の車両が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転者は、右側の運転者を先に進ませなければならない。
    B: 右側の運転者は、左側の運転者を先に進ませなければならない。
    C: より速い速度で走行している車両が先に進む。
    D: 左折する車両が先に進む。
  answer: A
  explanation: 標識や信号のない交差点に、異なる方向から車両が同時に到着した場合、左側の運転者は右側の運転者を先に進ませなければなりません。
- id: 88
  category: signs_and_signals
  question: 交差点の信号機が機能していない場合、どうしなければなりませんか？
  choices:
    A: 道が空いていれば、停止せずに交差点を通過する。
    B: 交差点を「ゆずれ（Yield）」の標識として扱う。
    C: すべての車両は停止し、左側の運転者は右側の運転者に道を譲らなければならない。
    D: 右側の運転者は左側の運転者に道を譲らなければならない。
  answer: C
  explanation: 交差点の信号機が機能していない場合、交差点に進入するすべての車両は停止しなければなりません。左側の運転者は右側の運転者に道を譲る必要があります。
- id: 89
  category: safe_driving_rules
  question: 私道やドライブウェイから車道に出る際、どうしなければなりませんか？
  choices:
    A: 急加速して交通に合流する。
    B: 停止し、すべての車両と歩行者に道を譲る。
    C: クラクションを鳴らし、停止せずに進む。
    D: 左から接近する車両にのみ道を譲る。
  answer: B
  explanation: マニュアルには、私道やドライブウェイから車道に出る際は、停止してすべての車両と歩行者に道を譲らなければならないと記載されています。
- id: 90
  category: sharing_the_road
  question: 道路上で葬列（funeral procession）に遭遇した場合、どのように対応すべきですか？
  choices:
    A: 急いでいる場合は、葬列を横切ってもよい。
    B: 葬列に道を譲らなければならず、絶対に横切ったり加わったりしてはならない。
    C: 信号を避けるために葬列に加わるべきである。
    D: 葬列の右側を追い越さなければならない。
  answer: B
  explanation: 葬列には道を譲らなければなりません。マニュアルには、葬列を横切ったり、加わったり、妨害したりしてはならないと明確に記載されています。
- id: 91
  category: penalties_and_points
  question: 点滅するライトをつけて停車している緊急車両に近づく際、注意して安全に車線変更を怠った場合の罰則として考えられるものは何ですか？
  choices:
    A: 初回違反に対する書面での警告。
    B: 義務的な社会奉仕活動。
    C: 裁判所による運転免許の停止および違反点数の加算。
    D: 即時の車両押収。
  answer: C
  explanation: 点滅するライトをつけて停車している車両に近づく際の規則に違反すると、裁判所による運転免許の停止や運転記録への違反点数の加算につながる可能性があります。
- id: 92
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内で、出口に向かうことを他の運転手に知らせるためにどの合図を使用すべきですか？
  choices:
    A: 左折の合図（ウィンカー）。
    B: 右折の合図（ウィンカー）。
    C: ハザードランプ。
    D: ラウンドアバウト内では合図は必要ない。
  answer: B
  explanation: ラウンドアバウト内にいる間、出口に向かう準備ができた際に自分の意図を周囲の運転手に知らせるため、車両の右折の合図（ウィンカー）を使用しなければなりません。
- id: 93
  category: safe_driving_rules
  question: 複数車線の幹線道路（ハイウェイ）を運転する際、左側車線は主に何のために使用されますか？
  choices:
    A: 制限速度での巡航。
    B: 低速車両。
    C: 追い越し専用。
    D: 幹線道路（ハイウェイ）の出口に向かうため。
  answer: C
  explanation: マニュアルには、複数車線の幹線道路（ハイウェイ）を運転する際、左側車線は巡航用ではなく、追い越し専用であると明記されています。
- id: 94
  category: safe_driving_rules
  question: 他の車両を追い越す際、右側車線に戻るのが安全なのはいつですか？
  choices:
    A: 他の車両と並走した直後。
    B: ルームミラーに追い越した車両の前部が見えた時。
    C: その車両のリアバンパーを通り過ぎてから3秒後。
    D: 追い越された車両がヘッドライトを点滅させた時。
  answer: B
  explanation: ルームミラーに追い越した車両の前部が見えるようになったら、すぐに右側車線に戻るべきです。
- id: 95
  category: sharing_the_road
  question: 自転車に乗っている人に近づいたり追い越したりする際、どのくらいの間隔を空けなければなりませんか？
  choices:
    A: 左側に少なくとも2フィート（約0.6メートル）。
    B: 左側に少なくとも3フィート（約0.9メートル）。
    C: 左側に少なくとも4フィート（約1.2メートル）。
    D: 左側に少なくとも5フィート（約1.5メートル）。
  answer: B
  explanation: 自転車、モペッド、または電動アシスト自転車に乗っている人に近づいたり追い越したりする際は、速度を落とし、左側に少なくとも3フィート（約0.9メートル）の間隔を空けて追い越さなければなりません。
- id: 96
  category: defensive_driving
  question: 他の車両があなたを追い越そうとしている時、どうすべきですか？
  choices:
    A: 追い越しを防ぐために加速する。
    B: 左側車線に移動する。
    C: 一定の速度を保つか、減速する。
    D: ハイビームを点滅させる。
  answer: C
  explanation: マニュアルでは、追い越される際には加速してはいけないとアドバイスしています。一定の速度を保つか、減速するべきです。
- id: 97
  category: safe_driving_rules
  question: 次のうち、追い越しが違法かつ危険と見なされる状況はどれですか？
  choices:
    A: 交通が同じ方向に進んでいる複数車線の幹線道路（ハイウェイ）上。
    B: 自分の車線の左側に実線が引かれている場合。
    C: 前方の車両が左折しようとしており、自分が舗装路内に留まっている場合。
    D: 前方500フィート（約150メートル）がはっきりと見通せる場合。
  answer: B
  explanation: 自分の車線の左側に実線が引かれている場合、追い越しは違法であり危険です。
- id: 98
  category: defensive_driving
  question: コントロールを失うのを防ぐために、カーブまたは直線の道路から逸脱してしまった場合、どうすべきですか？
  choices:
    A: 慌ててすぐに急ブレーキをかける。
    B: ハンドルを道路に向かって急に切る。
    C: トラクション（駆動力）を取り戻すために加速する。
    D: 徐々に減速し、進みたい方向を見て、ゆっくりとハンドルを切って戻る。
  answer: D
  explanation: 道路から逸脱してしまった場合は、慌てないでください。過剰なハンドル操作（オーバーコレクト）を避けるため、徐々に減速し、進みたい方向を見て、ゆっくりとハンドルを切って車道に戻ります。
- id: 99
  category: defensive_driving
  question: 左折待ちをしている間、前輪をまっすぐ前に向けておくべきなのはなぜですか？
  choices:
    A: 信号が青になった時に早く加速できるから。
    B: 後ろから追突された場合に、対向車線に押し出されるのを防ぐため。
    C: パワーステアリングシステムの摩耗や劣化を減らすため。
    D: 他の運転手に道を譲っていることを知らせるため。
  answer: B
  explanation: 実際に左折を始めるまで前輪をまっすぐ前に向けておくことで、後方から別の車両に追突された場合に、対向車線に押し出されるのを防ぐことができます。
- id: 100
  category: safe_driving_rules
  question: 互いに近づいてきて、両方とも左折の合図を出している2台の車両は、どのように進むべきですか？
  choices:
    A: 両方の車両が互いの後ろを回って曲がるべきである。
    B: 右側の車両に優先権がある。
    C: 両方の車両が互いの前を曲がり、助手席側が隣り合うようにするべきである。
    D: 両方の車両が停止し、青の矢印信号を待たなければならない。
  answer: C
  explanation: 2台の車両が互いに近づいてきて左折の合図を出している場合、両方の車両は互いの前を曲がり、車両の助手席側が隣り合うようにして進むべきです。
- id: 101
  category: safe_driving_rules
  question: 商業地域、市、町において、Uターンが許可されているのはどこですか？
  choices:
    A: 黄色の破線がある場所ならどこでも。
    B: 交差点のみ。
    C: 任意の幹線道路（ハイウェイ）上。
    D: 安全が確認できれば、区画（ブロック）の中間でも。
  answer: B
  explanation: 商業地域、市、町では、Uターンは交差点でのみ許可されています。
- id: 102
  category: safe_driving_rules
  question: 曲がる意図を知らせる方向指示器（ウィンカー）は、曲がる地点のどれくらい手前で出すべきですか？
  choices:
    A: 少なくとも1〜2秒前、50フィート手前。
    B: 少なくとも3〜4秒前、100フィート手前。
    C: 少なくとも5〜6秒前、200フィート手前。
    D: ハンドルを切り始めた直後。
  answer: B
  explanation: 曲がる地点の少なくとも3〜4秒前、100フィート手前で方向指示器を出す必要があります。
- id: 103
  category: signs_and_signals
  question: 左腕と手を下に向けている手信号は、何を示していますか？
  choices:
    A: 左折。
    B: 右折。
    C: 減速または停止。
    D: 注意して進め。
  answer: C
  explanation: マニュアルの手信号ガイドによると、左腕と手を下に向ける動作は「減速または停止」を示しています。
- id: 104
  category: safe_driving_rules
  question: 乾燥した路面を時速35〜45マイル（MPH）で走行する場合、推奨される車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: マニュアルによると、時速35〜45マイル（MPH）での推奨車間距離は3秒です。
- id: 105
  category: defensive_driving
  question: 次のうち、車間距離を広げるべき状況はどれですか？
  choices:
    A: 視界を遮る大型車の後ろを走行している時。
    B: 新しく舗装された道路を走行している時。
    C: 高速道路（エクスプレスウェイ）に進入する時。
    D: 排気音が大きい車の後ろを走行している時。
  answer: A
  explanation: マニュアルでは、悪天候や後続車に煽られている時などの状況に加え、視界を遮る大型車の後ろを走行する際には車間距離を広げるよう指示しています。
- id: 106
  category: defensive_driving
  question: 他の車に煽られている（車間距離を詰められている）ことに気づいた場合、どうするべきですか？
  choices:
    A: 急ブレーキをかけて後続車の運転手に警告する。
    B: 加速して車間距離を広げる。
    C: 別の車線に移動するか、ブレーキペダルを軽く踏んでブレーキランプを点滅させる。
    D: ハザードランプを点灯させ、その車線で停止する。
  answer: C
  explanation: 煽られている場合、マニュアルでは急ブレーキをかけないようアドバイスしています。代わりに、可能であれば別の車線に移動するか、ブレーキペダルを軽く踏んでブレーキランプを点滅させ、減速してください。
- id: 107
  category: defensive_driving
  question: 熟練した運転手は、道路の状況を確認する際、どれくらい先を見るようにしていますか？
  choices:
    A: 5〜10秒先
    B: 10〜15秒先
    C: 20〜30秒先
    D: 45〜60秒先
  answer: C
  explanation: 前方を見ることで、危険を早期に発見できます。熟練した運転手は20〜30秒先を見るようにしており、これは市街地ではおよそ1区画（ブロック）分に相当します。
- id: 108
  category: safe_driving_rules
  question: 交差点に到達した際、どのような順番で交通状況を確認するべきですか？
  choices:
    A: 右、左、そしてもう一度右
    B: 左、右、そしてもう一度左
    C: 正面、そして左
    D: 右、正面、そして左
  answer: B
  explanation: どの交差点でも、左から来る車の方が自分に近い位置にいるため、まず左を見ます。次に右を見て、通過する前にもう一度素早く左を確認します。
- id: 109
  category: defensive_driving
  question: 後方の交通状況を確認するために、どれくらいの頻度でバックミラー（ルームミラー）を使用するべきですか？
  choices:
    A: 約5秒ごと
    B: 約10秒ごと
    C: 約30秒ごと
    D: 車線変更する時のみ
  answer: B
  explanation: マニュアルには、後方の交通状況を確認するために、約10秒ごとに頻繁にバックミラーを使用するよう記載されています。
- id: 110
  category: defensive_driving
  question: 死角にいる車を確認する最も良い方法は何ですか？
  choices:
    A: 車内のバックミラーをより広い角度に調整する。
    B: 車のバックカメラに頼る。
    C: 素早く首を回し、肩越しに目視する。
    D: 路面の影に注意する。
  answer: C
  explanation: 死角にいる車を確認する最も良い方法は、車線変更や追い越しをする前に、素早く首を回して肩越しに目視し、安全を確認することです。
- id: 111
  category: penalties_and_points
  question: 合法的に横断している歩行者のために一時停止せず、重傷または死亡事故を引き起こした場合の潜在的な罰則は何ですか？
  choices:
    A: 第3級重罪
    B: 第1級軽犯罪
    C: 500ドルの罰金および懲役なし
    D: 初犯に対する警告
  answer: B
  explanation: 合法的に道路を横断している歩行者のために一時停止せず、重傷または死亡事故を引き起こした場合、第1級軽犯罪（Class 1 misdemeanor）に問われる可能性があります。
- id: 112
  category: sharing_the_road
  question: 自転車が車線の中央を走ることが許可されるのはどのような状況ですか？
  choices:
    A: 州間高速道路を走行しているときはいつでも。
    B: 制限速度で走行している場合のみ。
    C: 左折しようとしているとき、または車線が狭すぎて車と並走できないとき。
    D: 自転車が車線の中央を走ることは決して許可されていない。
  answer: C
  explanation: 自転車は、左折しようとしているときや、車線が狭すぎて車と並走できないときなど、必要な場合には車線の中央を走ることが許可されています。
- id: 113
  category: sharing_the_road
  question: 悪天候時にオートバイの後ろを走行する場合、車間距離をどのように調整すべきですか？
  choices:
    A: 標準の2秒間の車間距離を保つ。
    B: 車間距離のルールにさらに1秒追加する。
    C: 1秒追加した後の車間距離を2倍にする。
    D: オートバイのスリップストリームに入るために車間距離を縮める。
  answer: C
  explanation: マニュアルには、オートバイに対する車間距離のルールに1秒追加して十分な制動距離を確保し、悪天候時にはその距離を2倍にするよう記載されています。
- id: 114
  category: sharing_the_road
  question: 車道に出る前にオートバイに道を譲ることが特に重要なのはなぜですか？
  choices:
    A: オートバイは常に制限速度より速く走行するから。
    B: オートバイのサイズにより、その速度と距離を見誤る可能性があるから。
    C: オートバイはすべての交差点で優先権を持っているから。
    D: オートバイは車ほど効果的にブレーキを使用できないから。
  answer: B
  explanation: オートバイのサイズにより、その速度と距離を見誤る可能性があるため、オートバイには道を譲ってください。
- id: 115
  category: sharing_the_road
  question: 杖や盲導犬を使用している歩行者に遭遇した場合、運転手は何をしなければなりませんか？
  choices:
    A: クラクションを鳴らして歩行者に車の存在を知らせる。
    B: 時速10マイル（10 MPH）に減速し、注意して進む。
    C: 完全に停止する。これは失明または視覚障害を示しているためである。
    D: 歩行者が標示のある横断歩道にいる場合のみ道を譲る。
  answer: C
  explanation: 杖や盲導犬を使用している歩行者は失明または視覚障害を示しているため、運転手は完全に停止することが義務付けられています。
- id: 116
  category: sharing_the_road
  question: ライトレール（次世代型路面電車）の線路周辺を運転する際に従うべき重要な安全ルールは何ですか？
  choices:
    A: 線路上にいる間は他の車両を追い越してもよい。
    B: 線路上では絶対に停止、追い越し、またはギアチェンジをしてはならない。
    C: 電車が見えない場合は、下りている遮断機を迂回して運転できる。
    D: 電車は単線上で一方向にのみ走行する。
  answer: B
  explanation: ライトレールの周辺を運転する際は、線路上で絶対に停止、追い越し、またはギアチェンジをしてはなりません。
- id: 117
  category: vehicle_information
  question: 低速車両（Low speed vehicles）は、最高制限速度が以下の公道で運転できます：
  choices:
    A: 時速25マイル（25 MPH）以下
    B: 時速35マイル（35 MPH）以下
    C: 時速45マイル（45 MPH）以下
    D: 時速55マイル（55 MPH）以下
  answer: B
  explanation: 低速車両は、免許を持った運転手、または免許を持った運転手が同乗する仮免許所持者によって、制限速度が時速35マイル（35 MPH）以下の公道で運転することができます。
- id: 118
  category: sharing_the_road
  question: 大型トラックの側面の死角、または「ノーゾーン（No-Zone）」を走行しているかどうかは、どのようにして分かりますか？
  choices:
    A: トラックの後方500フィート以内を走行している。
    B: トラックの方向指示器が点滅している。
    C: トラックのサイドミラーに運転手の顔が見えない。
    D: 2車線道路を走行している。
  answer: C
  explanation: トラックの両側面には大きなノーゾーン（死角）があります。サイドミラーに運転手の顔が見えない場合、運転手からもあなたの車は見えていません。
- id: 119
  category: sharing_the_road
  question: 大型トラック、バス、またはRV（キャンピングカー）を追い越す際、その車両の前の車線に戻るのが安全なのはいつですか？
  choices:
    A: 自分の車のリアバンパーがトラックのフロントバンパーを通り過ぎたらすぐ。
    B: ルームミラーにトラックの前面全体が見えるようになったとき。
    C: トラックのちょうど50フィート前方にいるとき。
    D: トラックの運転手がヘッドライトをパッシングしたとき。
  answer: B
  explanation: 追い越しをする際は、前方のノーゾーン（死角）を避けるため、ルームミラーにトラックの前面全体が見えるのを確認してから前に入ってください。
- id: 120
  category: vehicle_information
  question: 牽引している小型から中型のトレーラーが揺れ始めた場合、どうすべきですか？
  choices:
    A: 加速してトレーラーをまっすぐに引っ張る。
    B: ハンドルを左右に急に切る。
    C: ブレーキを強く踏む。
    D: 減速する。
  answer: D
  explanation: 小型から中型のトレーラーを連結した車両を運転している際、トレーラーが揺れ始めた場合は、減速する必要があります。
- id: 121
  category: safe_driving_rules
  question: 後退（バック）する際に、運転手が犯す最も一般的な間違いは何ですか？
  choices:
    A: ルームミラー（後写鏡）だけに頼ること。
    B: 後方の左右両方を確認しないこと。
    C: 後退する速度が遅すぎること。
    D: 両手をハンドルに置いたままにすること。
  answer: B
  explanation: 後退（バック）する際に運転手が犯す最も一般的な間違いは、後方の左右両方を確認しないことです。
- id: 122
  category: safe_driving_rules
  question: 公道で縁石に沿って駐車する場合、車両と縁石の間の最大距離はどれくらいですか？
  choices:
    A: 6インチ
    B: 1フィート
    C: 18インチ
    D: 2フィート
  answer: B
  explanation: 縁石に沿って駐車する場合は、縁石に寄せてください。縁石から1フィート以上離れて駐車してはいけません。
- id: 123
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、前輪をどのように向けるべきですか？
  choices:
    A: 前輪を左に向ける
    B: 前輪を右に向ける
    C: 車輪を完全にまっすぐにしておく
    D: 後輪を左に向ける
  answer: A
  explanation: 縁石のある上り坂で駐車する場合は、車両が車道に転がり出るのを防ぐため、前輪を左に向けます。
- id: 124
  category: safe_driving_rules
  question: 消火栓から何フィート以内の駐車が禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: B
  explanation: 消火栓から15フィート以内に駐車してはいけません。
- id: 125
  category: safe_driving_rules
  question: 踏切から何フィート以内に車両を駐車することは違法ですか？
  choices:
    A: 15フィート
    B: 20フィート
    C: 50フィート
    D: 500フィート
  answer: C
  explanation: 踏切から50フィート以内に駐車してはいけません。
- id: 126
  category: defensive_driving
  question: マニュアルによると、衝突事故の最大の原因は何ですか？
  choices:
    A: スピード違反
    B: 飲酒・薬物影響下での運転（DUI）
    C: 危険を認識できないこと
    D: 車間距離の詰めすぎ（あおり運転）
  answer: C
  explanation: 衝突事故の最大の原因は、危険を認識できないことです。優れた運転手になるためには、何を見るべきか、どこを見るべきかを知っておく必要があります。
- id: 127
  category: safe_driving_rules
  question: バージニア州法では、悪天候時に視界がどのくらいまで低下した場合、運転手にヘッドライトの使用を義務付けていますか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: バージニア州法では、雨、霧、雪、みぞれなどの悪天候時に視界が500フィートまで低下した場合、運転手にヘッドライトの使用を義務付けています。
- id: 128
  category: safe_driving_rules
  question: ワイパーの使用に関連して、いつヘッドライトを使用しなければなりませんか？
  choices:
    A: 夜間運転時のみ。
    B: 悪天候によりワイパーを使用する時はいつでも。
    C: ワイパーを最高速度に設定している時のみ。
    D: 日中にワイパーを使用する場合、ヘッドライトは必要ない。
  answer: B
  explanation: 悪天候によりワイパーを使用する時はいつでも、ヘッドライトを使用しなければなりません。
- id: 129
  category: safe_driving_rules
  question: 夜間に他の車両の後ろを走行する場合、前方の車両からどのくらいの距離以内にいる時にロービームを使用しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 後続して走行する場合、前方の車両から200フィート以内にいる時はいつでもロービームを使用してください。
- id: 130
  category: defensive_driving
  question: 対向車がハイビームを点灯している場合、どうするべきですか？
  choices:
    A: 運転手に警告するため、自分のハイビームを点灯する。
    B: 車両を追跡するため、明るい光を直接見る。
    C: 道路の端（路肩）に視線を向け、その後すぐに前方に視線を戻す。
    D: ヘッドライトを素早く点滅させ、クラクションを鳴らす。
  answer: C
  explanation: 対向車がハイビームを点灯している場合は、明るい光を直接見ないようにしてください。道路の端（路肩）に視線を向け、その後すぐに前方に視線を戻して、相手の車両の位置を確認します。
- id: 131
  category: safe_driving_rules
  question: 高速道路を走行中、対向車がどのくらいの距離に近づいたときにハイビームを減光しなければ（ロービームに切り替えなければ）なりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 500フィート
    D: 1,000フィート
  answer: C
  explanation: マニュアルには、対向車が500フィート以内に近づいてきた場合は、高速道路でロービームを使用するように記載されています。
- id: 132
  category: defensive_driving
  question: 対向車がハイビームを減光しない（ロービームに切り替えない）場合、どうすればよいですか？
  choices:
    A: 警告するために自分のハイビームを点灯する
    B: 道路の端のほうをちらっと見て、すぐに前方に視線を戻す
    C: 距離を測るためにヘッドライトを直視する
    D: すぐに車を停めて、対向車が通り過ぎるのを待つ
  answer: B
  explanation: 対向車がハイビームをつけている場合は、明るい光を直視しないようにしてください。道路の端のほうをちらっと見て、すぐに前方に視線を戻します。自分のハイビームを点灯してはいけません。
- id: 133
  category: safe_driving_rules
  question: 濃霧の中で運転する場合、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライトのみ
    D: ハザードランプ（非常点滅表示灯）
  answer: B
  explanation: 濃霧の中ではロービームを使用してください。霧は光を反射するため、自分の車のヘッドライトの光が反射して目に入り、視界を妨げる可能性があるからです。
- id: 134
  category: safe_driving_rules
  question: 雨が降り始めてからの最初の30分間、道路が滑りやすくなるのはなぜですか？
  choices:
    A: 雨が道路の摩擦材を洗い流すため
    B: 路面の油分が水と混ざるため
    C: 気温が急激に下がり、氷が形成されるため
    D: 深い水たまりよりも浅い水たまりの方が、タイヤがハイドロプレーニング現象を起こしやすいため
  answer: B
  explanation: 雨が降り始めたとき、最初の30分間は路面の油分が水と混ざるため、道路が滑りやすくなります。
- id: 135
  category: vehicle_information
  question: 雪の日に運転する前、車のどの部分から雪や氷を取り除かなければなりませんか？
  choices:
    A: フロントガラスとフロントウィンドウのみ
    B: 前後のライトのみ
    C: 屋根、ボンネット、後部を含む車全体
    D: ワイパーとミラーのみ
  answer: C
  explanation: 運転を始める前に、屋根、ボンネット、車の後部を含む車全体から雪や氷を取り除いてください。これにより、走行中に雪や氷が飛んで危険を引き起こすのを防ぎます。
- id: 136
  category: safe_driving_rules
  question: 寒い時期、道路上の氷に特に注意すべき場所はどこですか？
  choices:
    A: 橋の上や日陰の場所
    B: トンネルや地下道
    C: 信号機のある交差点
    D: 丘の頂上
  answer: A
  explanation: 橋の上や日陰の場所では氷に注意してください。橋は他の路面よりも先に凍結します。
- id: 137
  category: penalties_and_points
  question: バージニア州でアグレッシブ・ドライビング（あおり運転や乱暴な運転）で有罪判決を受けた場合、運転免許証はどのくらいの期間停止される可能性がありますか？
  choices:
    A: 5日間から30日間
    B: 10日間から6ヶ月間
    C: 30日間から1年間
    D: 6ヶ月間から2年間
  answer: B
  explanation: アグレッシブ・ドライビングで有罪判決を受けた場合、運転免許証は10日間、最長で6ヶ月間停止される可能性があります。
- id: 138
  category: defensive_driving
  question: 道路上でアグレッシブ・ドライバー（乱暴な運転をする人）に遭遇した場合、どのように対応すべきですか？
  choices:
    A: 相手より先を走るためにスピードを上げる
    B: 怯えていないことを示すためにアイコンタクトをとる
    C: 運転技術で相手を出し抜こうとする
    D: 道を譲り、アイコンタクトを避ける
  answer: D
  explanation: アグレッシブ・ドライバーを見かけたら、道を譲って近づかないようにしましょう。相手を挑発せず、アイコンタクトを避け、身振りや怒鳴り声は無視してください。
- id: 139
  category: driver_responsibility
  question: 居眠り運転を防ぐための効果的で確実な方法は、次のうちどれですか？
  choices:
    A: 窓を開ける
    B: ガムを噛み、ラジオの音量を上げる
    C: カフェインやエナジードリンクを摂取する
    D: 安全な場所に停車し、10〜20分間の仮眠をとる
  answer: D
  explanation: 安全な場所に停車して仮眠をとってください。わずか10〜20分の睡眠でも大きな効果があります。窓を開ける、ガムを噛む、ラジオの音量を上げる、カフェインを摂取するなどは確実な方法ではありません。
- id: 140
  category: alcohol_drugs_health
  question: バージニア州では、21歳以上の運転者の血中アルコール濃度（BAC）が何パーセント以上の場合、法的に飲酒運転（DUI）とみなされますか？
  choices:
    A: 0.02パーセント
    B: 0.04パーセント
    C: 0.08パーセント
    D: 0.10パーセント
  answer: C
  explanation: 法的には、21歳以上の運転者の血中アルコール濃度（BAC）が0.08パーセント以上の場合、飲酒運転（DUI）とみなされます。
- id: 141
  category: alcohol_drugs_health
  question: 21歳未満の場合、血中アルコール濃度（BAC）が次のどの範囲にあると、違法なアルコール消費で有罪となる可能性がありますか？
  choices:
    A: 0.02以上0.08未満
    B: 0.01以上0.05未満
    C: 0.05以上0.10未満
    D: ちょうど0.00
  answer: A
  explanation: 21歳未満の場合、血中アルコール濃度（BAC）が0.02以上0.08未満であると、違法なアルコール消費で有罪となる可能性があります。
- id: 142
  category: alcohol_drugs_health
  question: 次のうち、12オンスのグラス1杯のビールと同じアルコール量が含まれているものはどれですか？
  choices:
    A: 12オンスのグラス1杯のワイン
    B: 5オンスのグラス1杯のワイン
    C: 2ショットの蒸留酒（リカー）
    D: 8オンスのグラス1杯のワイン
  answer: B
  explanation: 12オンスのビールは、1ショットの蒸留酒（リカー）または5オンスのグラス1杯のワインと同じアルコール量です。
- id: 143
  category: alcohol_drugs_health
  question: 酔いを覚ますための唯一の有効な方法は何ですか？
  choices:
    A: ブラックコーヒーを飲む
    B: 冷たいシャワーを浴びる
    C: 激しい運動をする
    D: 時間
  answer: D
  explanation: 酔いを覚ますことができるのは時間だけです。コーヒー、冷たいシャワー、または運動では酔いは覚めません。
- id: 144
  category: safe_driving_rules
  question: バージニア州法において、運転中にドライバーが携帯電話を手に持つことが許可されるのはどのような場合ですか？
  choices:
    A: ナビゲーション目的で使用する場合
    B: 赤信号で停車している場合
    C: ドライバーの緊急時、または合法的に駐車・停車している場合のみ
    D: スピーカーフォンで通話している場合
  answer: C
  explanation: バージニア州法では、ドライバーの緊急時、または車両が合法的に駐車・停車している場合を除き、運転中に携帯電話やその他のワイヤレス通信機器を手に持つことを禁止しています。
- id: 145
  category: driver_responsibility
  question: バージニア州で毎年発生するすべての交通事故のうち、ドライバーの不注意（わき見運転など）が原因となる割合は約何パーセントですか？
  choices:
    A: 10パーセント
    B: 17パーセント
    C: 25パーセント
    D: 33パーセント
  answer: B
  explanation: バージニア州では毎年、ドライバーの不注意がすべての交通事故の約17パーセントを占めています。
- id: 146
  category: alcohol_drugs_health
  question: アルコールと、アレルギー薬や風邪薬などの他の薬を組み合わせると、どのような影響がありますか？
  choices:
    A: アルコールの影響を中和する
    B: 通常、両方の影響を増大（相乗）させる
    C: 運転能力には影響しない
    D: 反応時間を改善する
  answer: B
  explanation: アルコールと他の薬を組み合わせると、通常は両方の影響が増大し、運転能力に壊滅的な影響を及ぼす可能性があります。アレルギー薬や風邪薬と一緒に飲んだ1杯のお酒でも、数杯のアルコール飲料と同じ影響をもたらすことがあります。
- id: 147
  category: driver_responsibility
  question: 交通事故に巻き込まれた場合、直ちに車両を道路から移動させなければならないのはどのような時ですか？
  choices:
    A: 警察官に指示された場合のみ
    B: 車両が移動可能で、負傷者がおらず、安全に移動できる場合
    C: 警察が到着するまで絶対に車両を移動させるべきではない
    D: 損害額が3,000ドル未満の場合のみ
  answer: B
  explanation: 車両が移動可能で、負傷者がおらず、ドライバーが安全に移動できる場合、ドライバーは直ちに車両を道路から移動させなければなりません。
- id: 148
  category: driver_responsibility
  question: 交通事故により負傷者や死者が出た場合、または総物的損害額がいくらを超えた場合、警察官はDMV（車両管理局）に書面による事故報告書を提出することが義務付けられていますか？
  choices:
    A: 500ドル
    B: 1,000ドル
    C: 2,000ドル
    D: 3,000ドル
  answer: D
  explanation: 交通事故により負傷者や死者が出た場合、または総物的損害額が3,000ドルを超える場合、警察官はDMVに書面による事故報告書を提出しなければなりません。
- id: 149
  category: driver_responsibility
  question: 駐車中の無人車両にぶつかり、所有者が見つからない場合、どうしなければなりませんか？
  choices:
    A: 現場を離れ、所有者からの連絡を待つ
    B: 連絡先を記したメモを残し、24時間以内に警察に事故を報告する
    C: どれだけ時間がかかっても、所有者が戻るまで現場で待つ
    D: 48時間以内に保険会社に事故を報告して現場を離れる
  answer: B
  explanation: 損害を与えた無人車両の所有者が見つからない場合は、現場の見つけやすい場所に連絡先と事故の詳細を記したメモを残し、24時間以内に警察に事故を報告しなければなりません。
- id: 150
  category: defensive_driving
  question: シカなどの大型動物との衝突が避けられない場合、どうするべきですか？
  choices:
    A: 対向車線に急ハンドルを切る
    B: 衝突時間を最小限にするために加速する
    C: しっかりとブレーキを踏み、車線を維持して、コントロールを保ちながら停止する
    D: 道路から外れて溝に急ハンドルを切る
  answer: C
  explanation: シカなどの動物との衝突が避けられない場合は、急ハンドルを切ってはいけません。しっかりとブレーキを踏み、車線を維持して、コントロールを保ちながら停止してください。
- id: 151
  category: safe_driving_rules
  question: 夜間に警察官に車を止められた場合、取るべき行動の1つは何ですか？
  choices:
    A: すぐにヘッドライトを消す
    B: 車内のルームランプ（室内灯）を点灯させる
    C: 車から降りて警察官に挨拶する
    D: 身分証明書を求められるまで手を隠しておく
  answer: B
  explanation: 夜間の交通取り締まりで車を止められた際は、警察官が車内を見やすくするために、車のルームランプ（室内灯）を点灯させる必要があります。
- id: 152
  category: driver_responsibility
  question: 警察官から発行された交通違反切符（トラフィック・サイテーション）に署名することは何を意味しますか？
  choices:
    A: 罪を認めることである
    B: 裁判所の審問を受ける権利を放棄することである
    C: 罪を認めることではないが、署名を拒否すると逮捕される可能性がある
    D: 直ちに罰金を支払うことに同意することである
  answer: C
  explanation: 違反切符への署名を求められます。署名してください。これは罪を認めるものではありません。署名を拒否すると逮捕される可能性があります。
- id: 153
  category: safe_driving_rules
  question: バージニア州法において、車内でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転手と助手席の乗客のみ
    B: 18歳未満の乗客のみ
    C: 運転手と、前部・後部座席のすべての乗客
    D: 運転手のみ
  answer: C
  explanation: バージニア州法では、運転手および前部・後部座席のすべての乗客にシートベルトの着用が義務付けられています。
- id: 154
  category: safe_driving_rules
  question: 妊娠中の女性はどのようにシートベルトを着用すべきですか？
  choices:
    A: ラップベルト（腰ベルト）を骨盤のできるだけ低い位置に合わせる
    B: ラップベルトをお腹の中央に合わせる
    C: ショルダーベルト（肩ベルト）を着用しない
    D: 妊娠中の女性はシートベルトの着用が免除されている
  answer: A
  explanation: 妊娠中の女性は、ラップベルトを骨盤のできるだけ低い位置に合わせて着用することで、安全性が大幅に高まります。
- id: 155
  category: penalties_and_points
  question: バージニア州のチャイルドシート（子供用拘束装置）法違反で初めて有罪判決を受けた場合の罰金はいくらですか？
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: B
  explanation: チャイルドシート法違反で有罪となった場合、$50の罰金が科せられます。2回目以降の違反では、$500の罰金が科せられる可能性があります。
- id: 156
  category: safe_driving_rules
  question: 車内でチャイルドシートを設置するのに最も安全な場所はどこですか？
  choices:
    A: 助手席
    B: 後部座席の中央
    C: 運転席側の後部座席
    D: 助手席側の後部座席
  answer: B
  explanation: チャイルドシートを設置するのに最も安全な場所は、後部座席の中央です。
- id: 157
  category: safe_driving_rules
  question: バージニア州では、何歳未満の子供をピックアップトラックの荷台に乗せて運ぶことが違法とされていますか？
  choices:
    A: 12歳
    B: 14歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: キャンパーシェルが装備されている場合でも、16歳未満の子供をピックアップトラックの荷台に乗せて運ぶことは違法です。
- id: 158
  category: vehicle_information
  question: 車にエアバッグが装備されている場合、座席をハンドルからどのくらい離すべきですか？
  choices:
    A: 少なくとも5インチ
    B: 少なくとも10インチ
    C: 少なくとも15インチ
    D: 座席が下がる限界まで
  answer: B
  explanation: 車にエアバッグが装備されている場合、ハンドルから少なくとも10インチ離れるように座席を下げる必要があります。
- id: 159
  category: vehicle_information
  question: 車にエアバッグが装備されている場合、ハンドルをどのように調整すべきですか？
  choices:
    A: 頭に向けて上向きに傾ける
    B: 胸に向けて下向きに傾ける
    C: できるだけ体に近づける
    D: 最も高い位置で固定する
  answer: B
  explanation: ハンドルが調整可能な場合は、下向きに傾ける必要があります。これにより、エアバッグが頭や首ではなく胸に向くようになります。
- id: 160
  category: safe_driving_rules
  question: すべての子供は、何歳までチャイルドシートまたはブースターシートに適切に固定されなければなりませんか？
  choices:
    A: 5歳未満
    B: 6歳未満
    C: 8歳未満
    D: 10歳未満
  answer: C
  explanation: 1968年1月1日以降に製造された車に乗る場合、8歳未満のすべての子供はチャイルドシートまたはブースターシートに適切に固定されなければなりません。
- id: 161
  category: safe_driving_rules
  question: マニュアルによると、子供はいつまで後ろ向きのチャイルドシートに乗せるべきですか？
  choices:
    A: 誕生から1歳まで
    B: 誕生から2歳まで
    C: 誕生から3歳まで
    D: 誕生から4歳まで
  answer: B
  explanation: 子供は誕生から2歳まで、またはチャイルドシートのメーカーが許容する期間、後ろ向きに乗せる必要があります。
- id: 162
  category: safe_driving_rules
  question: 後ろ向きのチャイルドシートを助手席に設置することが認められるのはどのような場合ですか？
  choices:
    A: 運転手が子供から目を離したくない場合はいつでも
    B: 車両に後部座席がなく、助手席のエアバッグがオフになっているか、装備されていない場合のみ
    C: 子供が1歳以上の場合のみ
    D: いかなる状況でも認められない
  answer: B
  explanation: 車両に後部座席がない場合、助手席側にエアバッグが装備されていないか、助手席のエアバッグがオフになっていれば、後ろ向きのチャイルドシートを助手席に設置することができます。
- id: 163
  category: penalties_and_points
  question: 運転免許の停止（suspended）と取り消し（revoked）の違いは何ですか？
  choices:
    A: 停止は永久的であり、取り消しは一時的である。
    B: 停止は運転の特権が一時的に取り下げられることを意味し、取り消しは特権が終了することを意味する。
    C: 停止は路上試験の再受験を必要とするが、取り消しは手数料のみを必要とする。
    D: 違いはない。どちらも免許が永久に無効になることを意味する。
  answer: B
  explanation: 免許が停止（suspended）された場合、運転する特権は一時的に取り下げられます。取り消し（revocation）は、運転する特権が終了したことを意味します。
- id: 164
  category: penalties_and_points
  question: 次の有罪判決のうち、裁判所またはDMVが自動的に運転の特権を停止または取り消すものはどれですか？
  choices:
    A: DMVに虚偽の申告をした場合
    B: 有効な運転免許証なしで運転した場合
    C: 血液/呼気検査を拒否した場合
    D: 無謀または攻撃的な運転をした場合
  answer: A
  explanation: DMVに虚偽の申告をして有罪判決を受けた場合、裁判所またはDMVは運転の特権を「必ず」停止または取り消します。他の選択肢は、裁判所が特権を停止または取り消す「可能性がある」違反です。
- id: 165
  category: penalties_and_points
  question: 次の違反のうち、自動的な要件ではなく、裁判所が運転の特権を停止または取り消す「可能性がある」ものはどれですか？
  choices:
    A: 警察からの逃走
    B: 自動車が関与する重罪を犯すこと
    C: 無謀または攻撃的な運転
    D: アルコールまたは薬物の影響下での自動車の運転（DUI）
  answer: C
  explanation: マニュアルでは、「無謀または攻撃的な運転」は裁判所が運転の特権を停止または取り消す「可能性がある」違反として挙げられています。これは、必ず停止または取り消しとなるDUI、警察からの逃走、または車両を使った重罪とは異なります。
- id: 166
  category: penalties_and_points
  question: 18歳未満の場合、減点対象となる交通違反で2回目の有罪判決を受けた場合の罰則は何ですか？
  choices:
    A: 運転の特権の30日間の停止
    B: 運転の特権の90日間の停止
    C: 運転の特権の1年間の取り消し
    D: DMVからの警告状
  answer: B
  explanation: 18歳未満のときに犯した減点対象の交通違反で2回目の有罪判決を受けた後、DMVは運転の特権を90日間停止します。
- id: 167
  category: penalties_and_points
  question: 18歳未満の運転者が、減点対象となる交通違反で3回目の有罪判決を受けた場合、どうなりますか？
  choices:
    A: 運転の特権が1年間、または18歳になるまでのいずれか長い方の期間取り消される。
    B: 運転の特権が90日間停止される。
    C: 500ドルの罰金を支払い、路上試験を再受験しなければならない。
    D: 運転の特権が永久に取り消される。
  answer: A
  explanation: 18歳未満の運転者の場合、3回目の有罪判決を受けると、運転の特権が1年間、または18歳になるまでのいずれか長い方の期間取り消されます。
- id: 168
  category: penalties_and_points
  question: 18歳以上の場合、減点が何点に達すると、DMVから運転改善講習（driver improvement clinic）の受講を義務付けられますか？
  choices:
    A: 12ヶ月以内に10点
    B: 12ヶ月以内に12点、または24ヶ月以内に18点
    C: 12ヶ月以内に15点
    D: 12ヶ月以内に18点、または24ヶ月以内に24点
  answer: B
  explanation: 18歳以上の運転者の場合、12ヶ月以内に12点、または24ヶ月以内に18点の減点が累積すると、DMVから運転改善講習の受講が義務付けられます。
- id: 169
  category: penalties_and_points
  question: 12ヶ月以内に18点の減点が累積した成人運転者（18歳以上）に対する罰則は何ですか？
  choices:
    A: 30日間の停止
    B: 60日間の停止
    C: 90日間の停止および運転改善講習の受講義務
    D: 運転の特権の1年間の取り消し
  answer: C
  explanation: 12ヶ月以内に18点、または24ヶ月以内に24点の減点を受けた場合、DMVは運転の特権を90日間停止し、運転改善講習の受講を義務付けます。
- id: 170
  category: driver_responsibility
  question: 医療審査プログラム（Medical Review Program）において、DMVは運転者の何を損なう身体的または精神的状態を懸念していますか？
  choices:
    A: 聴覚、発話、および反射神経
    B: 意識レベル、知覚、判断力、または運動能力
    C: 英語の道路標識を読む能力
    D: 心血管の健康と呼吸数
  answer: B
  explanation: DMVは、運転者の意識レベル、知覚（視覚）、判断力、および運動能力を損なうあらゆる状態を懸念しています。
- id: 171
  category: penalties_and_points
  question: バージニア州で自動車を登録する際、その車両に賠償責任保険（liability insurance）が適用されていない場合、どうしなければなりませんか？
  choices:
    A: 500ドルの無保険車両手数料を支払う。
    B: 運転免許証を返納する。
    C: 250ドルの罰金を支払い、運転改善クリニックを受講する。
    D: いかなる状況でも、賠償責任保険なしで車両を登録することはできない。
  answer: A
  explanation: 自動車を登録する際、賠償責任保険に加入していることを証明する書類に署名するか、500ドルの無保険車両手数料を支払う必要があります。
- id: 172
  category: license_system
  question: 免許停止期間中に免許証の有効期限が1年以上切れていた場合、運転の特権（driving privilege）を回復させるためには何をしなければなりませんか？
  choices:
    A: 必要な回復手数料のみを支払う。
    B: 合法的な滞在証明を提示し、視力、知識、および実技試験に合格する。
    C: 運転改善クリニックを修了し、500ドルの手数料を支払う。
    D: 再申請する前にさらに90日間待つ。
  answer: B
  explanation: 免許停止期間中に免許証の有効期限が1年以上切れていた場合、運転の特権を回復させるためには、合法的な滞在証明を提示し、2部構成の知識試験、実技試験、および視力試験に合格する必要があります。
- id: 173
  category: penalties_and_points
  question: 養育費の支払いが以下の基準で遅れた場合、DMV（車両管理局）はあなたの運転の特権を停止します：
  choices:
    A: 30日または1,000ドル
    B: 60日または2,500ドル
    C: 90日または5,000ドル
    D: 120日または10,000ドル
  answer: C
  explanation: 養育費の支払いが90日または5,000ドル遅れた場合、児童扶養強制局（Division of Child Support Enforcement）はDMVに対し、あなたの運転の特権を停止するよう指示します。
- id: 174
  category: alcohol_drugs_health
  question: バージニア州の黙示の同意法（implied consent laws）の下では、公道で自動車を運転することは、以下に同意したことを意味します：
  choices:
    A: 警察官がいつでも車両を捜索することを許可する
    B: 要求に応じて呼気検査を受ける
    C: 自分が引き起こした事故に対する賠償金を支払う
    D: 国際運転免許証を携帯する
  answer: B
  explanation: 黙示の同意法の下では、バージニア州の公道で自動車を運転する場合、要求に応じて呼気検査を受けることに同意したものとみなされます。
- id: 175
  category: penalties_and_points
  question: 初回の飲酒運転（DUI）で告発され、血中アルコール濃度（BAC）が0.08%以上であった場合、運転の特権は自動的に以下の期間停止されます：
  choices:
    A: 7日間
    B: 30日間
    C: 60日間
    D: 90日間
  answer: A
  explanation: 運転中の血中アルコール濃度（BAC）が0.08%以上であり、警察官から飲酒運転（DUI）で告発された場合、初犯であれば運転の特権は自動的に7日間停止されます。
- id: 176
  category: alcohol_drugs_health
  question: 開封済みの容器があることによる運転中の飲酒で告発されるには、その容器が乗車エリアにある必要があります。乗車エリアには以下が含まれます：
  choices:
    A: 車両のトランク
    B: 施錠されたグローブボックス
    C: 施錠されていないグローブボックス
    D: ピックアップトラックの荷台
  answer: C
  explanation: 乗車エリアとは、運転手と乗客が座るエリア、および施錠されていないグローブボックスを含む、運転手の手の届く範囲のすべてのエリアを指します。
- id: 177
  category: penalties_and_points
  question: 未成年（17歳以下）の同乗者がいる状態での飲酒運転（DUI）で有罪判決を受けた場合、追加で義務付けられる禁錮刑の期間はどれくらいですか？
  choices:
    A: 48時間
    B: 5日間
    C: 10日間
    D: 30日間
  answer: B
  explanation: 違反時に未成年（17歳以下）の同乗者が車両にいた状態での飲酒運転（DUI）で有罪判決を受けた場合、他のすべての罰金や禁錮刑に加えて、さらに5日間の義務的な禁錮刑が科せられます。
- id: 178
  category: penalties_and_points
  question: アルコール関連の違反で免許が停止されている間に運転して捕まった場合、あなたの車両は直ちに以下の期間押収されます：
  choices:
    A: 3日間
    B: 7日間
    C: 30日間
    D: 90日間
  answer: C
  explanation: アルコール関連の違反で免許が停止されている間に運転して捕まった場合、あなたの車両は直ちに30日間押収されます。
- id: 179
  category: driver_responsibility
  question: あなたの飲酒運転（DUI）違反が原因で発生した事故に対応する救急隊員の費用として、最大いくらまで支払う責任を負う可能性がありますか？
  choices:
    A: 500ドル
    B: 1,000ドル
    C: 2,500ドル
    D: 5,000ドル
  answer: B
  explanation: あなたの飲酒運転（DUI）違反が原因で発生した事故や事件に対応する警察、救急医療サービス、消防士、および救助隊員の費用（最大1,000ドル）を支払う責任を負う可能性があります。
- id: 180
  category: alcohol_drugs_health
  question: 21歳未満で、血中アルコール濃度（BAC）が0.02%以上0.08%未満の状態で運転して有罪判決を受けた場合、運転の特権は以下の期間停止されます：
  choices:
    A: 6ヶ月間
    B: 1年間
    C: 2年間
    D: 21歳になるまで
  answer: B
  explanation: 違法にアルコールを摂取した後に運転し、血中アルコール濃度（BAC）が0.02%以上0.08%未満で有罪判決を受けた場合、裁判所の罰則には、有罪判決の日から1年間の運転の特権の停止が含まれます。
- id: 181
  category: penalties_and_points
  question: 21歳未満で、アルコールを購入しようとして偽造身分証明書（フェイクID）を使用した場合、運転免許証は以下の期間、義務的に免停（一時停止）となります：
  choices:
    A: 少なくとも30日間
    B: 少なくとも90日間
    C: 少なくとも6ヶ月以上、1年以内
    D: ちょうど2年間
  answer: C
  explanation: 21歳未満で偽造身分証明書を使用、または使用しようとした場合、運転免許証は少なくとも6ヶ月以上1年以下の期間、義務的に免停（一時停止）となります。
- id: 182
  category: license_system
  question: 仮免許（ラーナーズ・パーミット）で運転する場合、助手席に乗る免許所持者は21歳以上でなければなりませんが、その人があなたの法定後見人または兄弟姉妹である場合は例外として以下の年齢でも認められます：
  choices:
    A: 16歳、17歳、または18歳
    B: 18歳、19歳、または20歳
    C: 免許を持っていれば年齢は問わない
    D: 25歳
  answer: B
  explanation: 同乗する免許所持者があなたの法定後見人、兄弟、姉妹、異父（異母）兄弟姉妹、または義理の兄弟姉妹である場合、その年齢は18歳、19歳、または20歳でも認められます。
- id: 183
  category: license_system
  question: 19歳以上の場合、運転免許証を申請する前に仮免許（ラーナーズ・パーミット）をどのくらいの期間保持しなければなりませんか（運転教育修了証明書を提出しない場合）？
  choices:
    A: 30日間
    B: 60日間
    C: 9ヶ月間
    D: 1年間
  answer: B
  explanation: 19歳以上の場合、運転免許証を申請するには、仮免許を60日間保持するか、運転教育修了証明書を提出する必要があります。
- id: 184
  category: license_system
  question: 標準の運転免許証では、商用運転免許（CDL）の要件が免除されており、重量が以下の数値未満の車両または小型トラックを運転することができます：
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 26,001ポンド
    D: 32,000ポンド
  answer: C
  explanation: 運転免許証があれば、商用運転免許（CDL）の要件が免除されている26,001ポンド未満の車両または小型トラックを運転することができます。
- id: 185
  category: license_system
  question: 15人乗り（運転手を含む）のスクールバスを運転するには、以下のどれが必要ですか：
  choices:
    A: 正式な商用運転免許（CDL）を取得する
    B: エンドースメント（追加資格）のために商用ドライバーおよびスクールバスの試験を受ける
    C: 25歳以上である
    D: 国際運転免許証を持っている
  answer: B
  explanation: 15人乗り（運転手を含む）のスクールバスを運転する場合、商用運転免許（CDL）を取得する必要はありません。ただし、運転免許証にスクールバスのエンドースメント（追加資格）を取得するために、商用ドライバーおよびスクールバスの試験を受ける必要があります。
- id: 186
  category: license_system
  question: 国際運転免許証に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 米国内のどこでも運転できる有効な運転免許証である。
    B: 州発行の運転免許証の代わりになる。
    C: 既存の有効な運転免許証の外国語翻訳にすぎない。
    D: 民間企業から合法的に購入できる。
  answer: C
  explanation: 国際運転免許証は有効な運転免許証ではなく、それだけで運転することはできません。これは、米国外を旅行する際に使用するための、既存の有効な運転免許証の外国語翻訳にすぎません。
- id: 187
  category: license_system
  question: バージニア州において、民間企業によって販売されている国際運転免許証の法的な扱いはどうなっていますか？
  choices:
    A: 米国到着後、最大60日間有効である。
    B: 外国から訪問している場合は必須である。
    C: 無効であり、自動車を合法的に運転することはできない。
    D: 有効なパスポートを携帯している場合のみ有効である。
  answer: C
  explanation: マニュアルによると、民間企業によって販売されている国際運転免許証は無効であり、自動車を合法的に運転することはできません。
- id: 188
  category: license_system
  question: 新しいバージニア州の運転免許証はどのように受け取りますか？
  choices:
    A: DMVカスタマーサービスセンターですぐに印刷される。
    B: 郵送される。
    C: 地元の警察署で受け取らなければならない。
    D: 一時的なデジタルコピーとしてメールで送信される。
  answer: B
  explanation: マニュアルには、セキュリティ上の理由からDMVはカスタマーサービスセンターで免許証を発行しないため、新しい運転免許証は郵送で受け取ることになると記載されています。
- id: 189
  category: driver_responsibility
  question: 引っ越しをした場合、何日以内にDMVに住所変更を通知しなければなりませんか？
  choices:
    A: 10日以内
    B: 30日以内
    C: 60日以内
    D: 90日以内
  answer: B
  explanation: 引っ越しをした場合、30日以内にDMVに通知する義務があります。郵便局は免許証を別の住所に転送しません。
- id: 190
  category: license_system
  question: バージニア州の新しい居住者となり運転をする場合、何日以内にバージニア州の運転免許証を取得しなければなりませんか？
  choices:
    A: 30日以内
    B: 45日以内
    C: 60日以内
    D: 90日以内
  answer: C
  explanation: バージニア州の新しい居住者となり運転をする場合、引っ越してから60日以内にバージニア州の運転免許証を取得する必要があります。
- id: 191
  category: vehicle_information
  question: バージニア州に引っ越してから何日以内に、車両の権原（タイトル）登録および車両登録を行い、バージニア州のナンバープレートを取得する必要がありますか？
  choices:
    A: 15日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: バージニア州に引っ越してから30日以内に、車両の権原（タイトル）登録および車両登録を行い、バージニア州のナンバープレートを取得する必要があります。
- id: 192
  category: vehicle_information
  question: バージニア州で登録された車両のナンバープレートは、どこに表示しなければなりませんか？
  choices:
    A: 車両の後部のみ。
    B: 車両の前部のみ。
    C: 車両の前部と後部。
    D: 車両の後部とフロントガラスの内側。
  answer: C
  explanation: マニュアルには、ナンバープレートは車両の前部と後部に表示しなければならないと規定されています。
- id: 193
  category: vehicle_information
  question: タイヤの溝（トレッド）を確認するためにペニー硬貨テスト（1セント硬貨を使ったテスト）を行う際、安全な溝の深さがあることを示すのはどれですか？
  choices:
    A: エイブラハム・リンカーンの頭全体が見える。
    B: リンカーンの頭の一部が溝に隠れている。
    C: ペニー硬貨が溝から落ちる。
    D: 溝がペニー硬貨に対して完全に平らになっている。
  answer: B
  explanation: ペニー硬貨テストの際、リンカーンの頭の一部が溝に隠れていれば、安全な溝の深さで運転していることになります。
- id: 194
  category: vehicle_information
  question: 車両のタイヤの推奨PSI（空気圧）はどこで確認できますか？
  choices:
    A: 車両のナンバープレート。
    B: 車両の取扱説明書、または運転席側のドアの開口部（ドアジャム）。
    C: ステアリングホイール（ハンドル）。
    D: 車両の登録証に印刷されている。
  answer: B
  explanation: 推奨PSIは、車両の取扱説明書、または車両の運転席側のドアの開口部（ドアジャム）に記載されています。
- id: 195
  category: driver_responsibility
  question: 500ドルの無保険車両手数料（uninsured motor vehicle fee）を支払うと、どうなりますか？
  choices:
    A: 1年間の最低限の賠償責任保険が適用される。
    B: 1年間のフルカバー保険が適用される。
    C: 保険に加入していなくても、バージニア州で1年間車両を登録して運転することができる。
    D: 物的損害は補償されるが、人身傷害は補償されない。
  answer: C
  explanation: 無保険車両手数料を支払っても保険が適用されるわけではありませんが、バージニア州で1年間車両を登録して運転することが許可されます。
- id: 196
  category: driver_responsibility
  question: バージニア州で車両の保険契約を解約する前に、何をしなければなりませんか？
  choices:
    A: 500ドルの解約手数料を支払う。
    B: ナンバープレートをDMVに返却し、車両登録をキャンセルする。
    C: 地元の警察署に通知する。
    D: DMVの担当者から署名をもらう。
  answer: B
  explanation: 保険を解約する前に、ナンバープレートをDMVに返却し、車両登録をキャンセルする必要があります。
- id: 197
  category: penalties_and_points
  question: 保険に加入しておらず、無保険車両手数料も支払わずに運転しているところを摘発された場合、運転免許を回復するための要件の1つは何ですか？
  choices:
    A: 600ドルの違反金（noncompliance fee）を支払う。
    B: 500ドルの無保険車両手数料を支払う。
    C: 30日間服役する。
    D: 車両を州に引き渡す。
  answer: A
  explanation: 保険なしで運転し、手数料も支払っていなかった場合、DMVは600ドルの違反金（noncompliance fee）を支払う（または支払いプランの承認を得る）とともに、3年間の保険証明書を提出するまで、あなたの運転特権を停止します。
- id: 198
  category: driver_responsibility
  question: 18歳未満で、申請書で臓器提供者（臓器ドナー）になることに「はい」とチェックした場合、提供に関する最終決定を下すのは誰ですか？
  choices:
    A: DMVの長官。
    B: あなたの親および保護者。
    C: 病院のスタッフ。
    D: 年齢に関係なく、あなたが最終決定を下す。
  answer: B
  explanation: 18歳未満の場合、「はい」にチェックを入れて提供の意思を示すことはできますが、法律により、親および保護者が最終決定を下さなければなりません。
- id: 199
  category: safe_driving_rules
  question: 凍結した道路や滑りやすい道路を運転中に停止しなければならない場合、どうするべきですか？
  choices:
    A: ブレーキを強く踏む。
    B: ブレーキを優しく（軽く）踏む。
    C: ブレーキから足を離し、エンジンブレーキで停止する。
    D: できるだけ速くポンピングブレーキをする。
  answer: B
  explanation: マニュアルのサンプル知識試験によると、凍結した道路や滑りやすい道路を運転中に停止しなければならない場合は、ブレーキを優しく踏む必要があります。
- id: 200
  category: safe_driving_rules
  question: 停止する際の正しい手信号（ハンドシグナル）はどれですか？
  choices:
    A: 左手と左腕をまっすぐ外に伸ばす。
    B: 左手と左腕を上に向ける。
    C: 右手と右腕を下に向ける。
    D: 左手と左腕を下に向ける。
  answer: D
  explanation: サンプル知識試験には、停止する際の正しい手信号は左手と左腕を下に向けることであると記載されています。
- id: 201
  category: driver_responsibility
  question: 交通事故に巻き込まれた場合、どのような行動をとる必要がありますか？
  choices:
    A: 直ちにその人を最寄りの病院に連れて行く。
    B: そのまま帰宅し、オンラインで事故報告書を提出する。
    C: 停車し、負傷者を救護し、警察に事故を報告し、情報を交換し、保険会社に連絡する。
    D: 車の損傷を確認し、運転可能であればその場を離れる。
  answer: C
  explanation: サンプル学科試験では、交通事故に巻き込まれた場合、停車し、負傷者を救護し、警察に事故を報告し、情報を交換し、保険会社に連絡しなければならないと示されています。
- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 減速し、注意して進む
    B: 完全に一時停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に進入する前に完全に一時停止しなければならないことを意味します。交通状況や歩行者を確認してから進んでください。
  id: 202
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 完全に一時停止する
    B: 加速して交通に合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 止まらずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（ゆずれ）」の標識は、減速して他の車両や歩行者に優先権を譲らなければならないことを意味します。他の人が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 203
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車と衝突する危険がある場所に設置されています。
  id: 204
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見たら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意して運転を続ける
    C: 停止して後退するか、方向転換する（逆走しているため）
    D: 加速してそのエリアを早く抜け出す
  answer: C
  explanation: 赤と白の「WRONG WAY（逆走）」の標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 205
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）に流れている
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」の標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 206
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターンが禁止されていることを意味します。
  id: 207
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が許可されていないことを意味します。
  id: 208
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 209
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側を通行する
  answer: B
  explanation: ペナント型（三角旗型）の白黒の「NO PASSING ZONE（追い越し禁止区間）」の標識は、このエリアで他の車両を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 210
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転手に何を指示していますか？
  choices:
    A: 右に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線減少
  answer: C
  explanation: 矢印が描かれた白地の「右側通行（KEEP RIGHT）」の規制標識は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 211
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色から判断して、これはどのような種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 白地の長方形に黒字で書かれた標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 212
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先、動物園またはアニマルパークあり
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟エリアあり
    D: 近くに野生動物保護区あり
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。特に夜明けや夕暮れ時は速度を落とし、動物に注意してください。
  id: 213
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーンあり
    B: この先、横断歩道あり
    C: 近くにハイキングコースあり
    D: この先、バス停あり
  answer: B
  explanation: 歩行者の図が描かれた黄色いひし形の標識は、この先に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 214
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは学校の横断歩道
    D: 病院周辺の区域
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは学校の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 215
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い丸型の標識は何を警告していますか？
  choices:
    A: この先、ラウンドアバウト（環状交差点）あり
    B: 病院周辺の区域
    C: この先、踏切あり
    D: 追い越し禁止区域
  answer: C
  explanation: 黒いXと2つのRが描かれた黄色い丸型の標識は、この先に踏切があることを示す事前警告標識です。速度を落とし、列車が来ないか目と耳で確認してください。
  id: 216
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の踏切標識（クロスバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は停止しなければなりません。
  id: 217
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: この先、行き止まり
    B: 右折必須
    C: この先、右カーブあり
    D: この先、迂回路あり
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、この先にカーブがあることを警告しています。カーブに入る前に速度を落としてください。
  id: 218
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどう違いますか？
  choices:
    A: より緩やかな曲がり角を示す
    B: より大幅な減速を必要とする急な曲がり角を警告する
    C: 右折専用を意味する
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角を示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 219
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: つづら折りの道路
    B: この先、単一のカーブあり
    C: 逆方向の2つの連続するカーブ
    D: この先、ラウンドアバウト（環状交差点）あり
  answer: C
  explanation: リバースカーブ（S字カーブ）の標識は、この先に逆方向の2つのカーブがあることを警告しています。速度を落とし、道路が一方に曲がった後、もう一方に曲がることに備えてください。
  id: 220
- image: winding_road.png
  category: signs_and_signals
  question: この標識は前方に何があることを警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: 前方に連続するカーブや曲がり角
    D: 前方に坂道
  answer: C
  explanation: つづら折りの標識は、前方に連続するカーブや曲がり角があることを警告しています。速度を落とし、変化する道路状況に注意してください。
  id: 221
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう指示していますか？
  choices:
    A: 車線の減少
    B: 別の道路からの合流交通
    C: 中央分離帯のある幹線道路の始まり
    D: 1車線への幅員減少
  answer: B
  explanation: 黄色いひし形の合流標識は、別の道路からの交通があなたの車線に合流してくることを警告しています。速度と位置を調整する準備をしてください。
  id: 222
- image: road_narrows.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 前方に橋
    B: 前方の道路幅減少
    C: 車線の減少
    D: 中央分離帯のある幹線道路の終わり
  answer: B
  explanation: この警戒標識は、前方の道路が狭くなることを示しています。道路幅の減少に備え、車線内の位置を調整してください。
  id: 223
- image: divided_highway.png
  category: signs_and_signals
  question: この標識は前方に何があることを示していますか？
  choices:
    A: 道路の終わり
    B: 対面通行
    C: 中央分離帯のある幹線道路の始まり
    D: 幹線道路の出口
  answer: C
  explanation: この標識は、前方の道路が中央分離帯や防護柵で対向車線と区切られた幹線道路（ディバイデッド・ハイウェイ）になることを警告しています。右側を通行してください。
  id: 224
- image: divided_highway_ends.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: 中央分離帯のある幹線道路が終わり、対面通行に戻る
    C: 前方に合流エリア
    D: 前方で道路工事
  answer: B
  explanation: この標識は、中央分離帯のある幹線道路が終わることを警告しています。対向車線との間を区切る中央分離帯がなくなります。対面通行に備えてください。
  id: 225
- image: two_way_traffic.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 中央分離帯のある幹線道路の始まり
    B: 前方に追い越し区間
    C: 前方は対面通行 — 車両が双方向に通行する
    D: 前方に車線変更（シフト）
  answer: C
  explanation: この標識は、前方が対面通行であることを警告しています。一方通行の道路や中央分離帯のある幹線道路から外れ、反対方向に進む車両とすれ違うことになります。
  id: 226
- image: slippery_when_wet.png
  category: signs_and_signals
  question: この標識はどのような道路状況について警告していますか？
  choices:
    A: 凍結した道路状況
    B: 濡れると滑りやすくなる道路
    C: 前方に連続カーブ
    D: でこぼこした舗装
  answer: B
  explanation: 「濡れると滑りやすい（Slippery when wet）」の標識は、雨天時や路面が濡れている時に非常に滑りやすくなることを警告しています。速度を落とし、急ブレーキや急ハンドルを避けてください。
  id: 227
- image: hill.png
  category: signs_and_signals
  question: この標識は何について警告していますか？
  choices:
    A: 道路の段差
    B: でこぼこした路面
    C: 前方に急な坂道や勾配
    D: 道路工事
  answer: C
  explanation: この標識は、前方に急な坂道や勾配があることを警告しています。特にトラックを運転している場合や牽引している場合は、速度を調整し、低速ギアにシフトダウンする必要があるかもしれません。
  id: 228
- image: signal_ahead.png
  category: signs_and_signals
  question: この標識は何に備えるよう警告していますか？
  choices:
    A: 前方に一時停止標識
    B: 前方に信号機
    C: 横断歩道（スクールゾーン）
    D: 警察の検問所
  answer: B
  explanation: この標識は、前方に信号機があることを警告しています。信号が赤や黄色の場合は停止する準備をしてください。この標識は、遠くから信号機が見えにくい場所によく設置されます。
  id: 229
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識は前方に何があることを示していますか？
  choices:
    A: ゆずりあいの標識 (Yield sign)
    B: 信号機
    C: 必ず停止しなければならない一時停止標識
    D: スピードバンプ（減速帯）
  answer: C
  explanation: この標識は、前方に一時停止標識があることを警告しています。減速を始め、一時停止標識で完全に停止する準備をしてください。
  id: 230
- image: cross_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 前方に踏切あり
    B: 前方に十字路または交差点あり
    C: 前方に病院あり
    D: 横断歩道
  answer: B
  explanation: この標識は、前方に十字路または4差路の交差点があることを警告しています。側道から進入してくる車両に注意してください。
  id: 231
- image: side_road.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: 前方にT字路あり
    B: 右側から合流する側道あり
    C: 道路のカーブ
    D: 行き止まり
  answer: B
  explanation: この標識は、右側から側道が合流していることを警告しています。側道から本線に進入してくる車両に注意してください。
  id: 232
- image: added_lane.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 車線が合流している
    B: 車線が減少している
    C: 新しい車線が追加される（合流の必要なし）
    D: 右折必須
  answer: C
  explanation: 車線追加の標識は、合流を必要とせずに新しい車線が本線に加わることを意味します。ランプ（進入路）から進入する車両には専用の新しい車線があります。
  id: 233
- image: no_parking.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 常時駐停車禁止
    B: このエリアでの駐車
    C: 停車またはアイドリング
    D: 荷物の積み下ろし
  answer: B
  explanation: 赤と白の「駐車禁止（NO PARKING）」の標識は、このエリアに車を駐車してはならないことを意味します。乗客の乗り降りのために短時間停車することは許可されています。
