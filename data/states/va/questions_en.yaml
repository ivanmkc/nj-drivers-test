metadata:
  source: 2025 Virginia Driver's Manual (dmv.virginia.gov)
  total_questions: 278
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: According to 2024 data in the manual, what percentage of all people killed
    in crashes in Virginia were men?
  choices:
    A: 31%
    B: 50%
    C: 71%
    D: 85%
  answer: C
  explanation: The manual states that 71% of all people killed in crashes in 2024
    in Virginia were men, despite being slightly less than half the population.
- id: 2
  category: safe_driving_rules
  question: What percentage of vehicle occupants killed in a crash in Virginia in
    2024 were NOT wearing a seat belt?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 71%
  answer: C
  explanation: According to the manual, in 2024, 50% of vehicle occupants killed in
    a crash weren't wearing a seat belt.
- id: 3
  category: alcohol_drugs_health
  question: What is Virginia's legal stance on underage drinking?
  choices:
    A: A limit of 0.08% BAC applies
    B: It is a zero-tolerance law
    C: A limit of 0.02% BAC applies
    D: It is allowed if accompanied by an adult
  answer: B
  explanation: The manual explicitly states, "Remember, Virginia has a zero-tolerance
    law for underage drinking."
- id: 4
  category: safe_driving_rules
  question: When reading or sending a text message while driving, how long are your
    eyes typically off the road?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: D
  explanation: The manual states that when reading or sending a text, your eyes are
    off the road for five seconds.
- id: 5
  category: defensive_driving
  question: If you are traveling at 55 mph and take your eyes off the road to text,
    you will travel the length of a football field essentially blindfolded in how
    many seconds?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: D
  explanation: At 55 mph, when reading or sending a text, your eyes are off the road
    for five seconds, which is enough time to travel the length of a football field
    essentially blindfolded.
- id: 6
  category: safe_driving_rules
  question: How many fatalities occurred in speed-related crashes in Virginia in 2024?
  choices:
    A: '318'
    B: '410'
    C: '500'
    D: '71'
  answer: B
  explanation: The manual states that in 2024, 410 people died in speed-related crashes
    in Virginia.
- id: 7
  category: defensive_driving
  question: What rule should you use to determine a safe following distance behind
    the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-, three-, and four-second rule
    C: The five-second rule
    D: The ten-foot rule
  answer: B
  explanation: The manual advises drivers to use the two-, three-, and four-second
    rule when trying to determine the space behind the vehicle in front of them.
- id: 8
  category: driver_testing
  question: According to the testing section of the Virginia Driver's Manual, what
    format is the knowledge exam?
  choices:
    A: A single-part exam
    B: A two-part exam
    C: A three-part exam
    D: A four-part exam
  answer: B
  explanation: Section 1 of the manual's Table of Contents lists a "Two-part knowledge
    exam."
- id: 9
  category: penalties_and_points
  question: According to the manual, which of the following non-driving offenses can
    result in a license suspension?
  choices:
    A: Failing to pay parking tickets
    B: Failing to satisfy child support-related requirements
    C: Failing to register to vote
    D: Failing to renew a passport
  answer: B
  explanation: Section 5 of the manual lists "Suspension for failing to satisfy child
    support-related requirements" under DMV requirements, suspensions and revocations.
- id: 10
  category: safe_driving_rules
  question: Which of the following is explicitly listed as a "Dangerous driving behavior"
    in the Virginia Driver's Manual?
  choices:
    A: Driving with pets in the car
    B: Drowsy driving
    C: Listening to loud music
    D: Eating while driving
  answer: B
  explanation: Section 3 of the manual lists Aggressive driving, Distracted driving,
    Drowsy driving, and Drinking and driving under "Dangerous driving behaviors."
- id: 11
  category: penalties_and_points
  question: Which program is listed in the manual as a DMV requirement that can lead
    to license suspensions and revocations?
  choices:
    A: Vehicle emissions program
    B: Insurance monitoring program
    C: Highway cleanup program
    D: Driver education program
  answer: B
  explanation: Section 5 of the manual lists the "Insurance monitoring program" under
    other DMV requirements, suspensions and revocations.
- id: 12
  category: sharing_the_road
  question: The Virginia Driver's Manual includes specific instructions for sharing
    the road with which of the following?
  choices:
    A: Airplanes
    B: Light rail
    C: Hoverboards
    D: ATVs
  answer: B
  explanation: Section 3 of the manual includes a specific subsection for sharing
    the road with "Light rail."
- id: 13
  category: penalties_and_points
  question: What type of license suspension is specifically associated with alcohol
    and the law in Virginia?
  choices:
    A: Administrative License Suspension
    B: Financial Responsibility Suspension
    C: Medical Review Suspension
    D: Point Accumulation Suspension
  answer: A
  explanation: Section 5 of the manual lists "Administrative License Suspension" under
    the "Alcohol and the law" section.
- id: 14
  category: driver_testing
  question: What type of screening is a required part of the testing process according
    to Section 1 of the manual?
  choices:
    A: Hearing screening
    B: Reflex screening
    C: Vision screening
    D: Colorblindness screening
  answer: C
  explanation: Section 1 of the manual's Table of Contents lists "Vision screening"
    and "Vision standards" as part of the testing process.
- id: 15
  category: driver_testing
  question: How many traffic sign questions must you answer correctly in part one
    of the knowledge exam to proceed to part two?
  choices:
    A: 7 out of 10
    B: 8 out of 10
    C: 9 out of 10
    D: All 10
  answer: D
  explanation: You must correctly answer all ten traffic sign questions in part one
    of the exam before you can take part two of the exam.
- id: 16
  category: driver_testing
  question: What is the minimum passing score for part two of the general knowledge
    exam?
  choices:
    A: 70 percent
    B: 75 percent
    C: 80 percent
    D: 85 percent
  answer: C
  explanation: Part two tests your general knowledge with multiple choice questions.
    You must answer at least 80 percent of these questions correctly to pass part
    two.
- id: 17
  category: driver_testing
  question: If you are under age 18 and fail the knowledge exam, how long must you
    wait before you can retake it?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 15 days
  answer: D
  explanation: If you fail the exam and you are under age 18, by law you must wait
    a full 15 days before you can retake the exam.
- id: 18
  category: driver_testing
  question: What happens if you fail the knowledge exam three times?
  choices:
    A: You are permanently barred from getting a license.
    B: You must wait one year before testing again.
    C: You must complete and pass the classroom component of driver education.
    D: You must pay a $100 fine to retake the test.
  answer: C
  explanation: If you fail the knowledge exam three times, you will not be able to
    take it a fourth time until you complete and pass the classroom component of driver
    education.
- id: 19
  category: vehicle_information
  question: Which of the following vehicles is NOT permitted to be used for the road
    skills test?
  choices:
    A: A pickup truck
    B: A four-door sedan
    C: An autocycle
    D: A vehicle with a manual transmission
  answer: C
  explanation: You must provide a vehicle for the road skills test (cannot be taken
    in an autocycle).
- id: 20
  category: driver_testing
  question: If you are age 18 or older and choose not to take a driver's education
    course, how long must you hold a learner's permit prior to your first road skills
    test?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: Applicants age 18 or older must hold the learner's permit for 60 days
    prior to the first road skills test or complete a course of driver's education.
- id: 21
  category: driver_testing
  question: If you fail the road skills test, how long must you wait before you can
    take it again?
  choices:
    A: 2 days
    B: 5 days
    C: 7 days
    D: 15 days
  answer: A
  explanation: If you fail the road skills test, you must wait two days to take it
    again.
- id: 22
  category: license_system
  question: What does a "C" restriction on your driver's license indicate?
  choices:
    A: You are restricted to daylight driving only.
    B: You must wear glasses or contact lenses when you drive.
    C: You can only drive a commercial vehicle.
    D: You must have a licensed adult in the vehicle.
  answer: B
  explanation: If you need to wear glasses or contact lenses to pass the vision screening,
    you must wear them when you drive. Your license will display a C for this restriction.
- id: 23
  category: license_system
  question: What are the vision standards for an unrestricted driver's license in
    Virginia?
  choices:
    A: 20/20 vision in both eyes and 180 degrees horizontal vision.
    B: 20/40 or better vision in one or both eyes and 110 degrees horizontal vision.
    C: 20/70 or better vision in one eye and 70 degrees horizontal vision.
    D: 20/50 vision in both eyes and 90 degrees horizontal vision.
  answer: B
  explanation: The standard for an unrestricted driver's license is 20/40 or better
    vision in one or both eyes, and 110 degrees, or better, horizontal vision.
- id: 24
  category: license_system
  question: What are the permitted driving hours for a driver with a daylight driving
    only restricted license?
  choices:
    A: From 6:00 AM to 6:00 PM.
    B: From sunrise to sunset.
    C: A half-hour after sunrise to a half-hour before sunset.
    D: A half-hour before sunrise to a half-hour after sunset.
  answer: C
  explanation: A daylight driving only restricted license permits you to drive only
    during the period of time beginning a half-hour after sunrise and ending a half-hour
    before sunset.
- id: 25
  category: safe_driving_rules
  question: Is it legal to avoid traffic controls by cutting through a parking lot
    or field?
  choices:
    A: Yes, if the intersection is blocked by an accident.
    B: Yes, if you are driving a commercial vehicle.
    C: No, it is illegal to avoid traffic controls this way.
    D: No, unless you are making a right turn.
  answer: C
  explanation: It is illegal to avoid these traffic controls by cutting through a
    parking lot or field.
- id: 26
  category: signs_and_signals
  question: When are you NOT permitted to make a right turn on red?
  choices:
    A: When there is a "No Turn on Red" sign or a red arrow pointing right.
    B: When you are turning from a one-way street onto another one-way street.
    C: When there are no pedestrians in the crosswalk.
    D: When you are driving a vehicle with a manual transmission.
  answer: A
  explanation: You may not turn right on red if signs are posted at the intersection
    that read "No Turn on Red," or if a red arrow pointing to the right is displayed.
- id: 27
  category: signs_and_signals
  question: Under what condition is a left turn on red permitted?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street onto another one-way street.
    C: When turning from a two-way street onto a two-way street.
    D: A left turn on red is never permitted.
  answer: B
  explanation: You may turn left at a red light if you are on a one-way street and
    turning left onto another one-way street while the traffic signal displays a red
    light.
- id: 28
  category: signs_and_signals
  question: If a police officer directs you to go through an intersection despite
    a red traffic signal, what should you do?
  choices:
    A: Stop and wait for the light to turn green.
    B: Follow the police officer's direction.
    C: Honk your horn to warn other drivers before proceeding.
    D: Pull over and wait for the officer to leave.
  answer: B
  explanation: Obey all signs and signals unless directed by a police officer; always
    follow the officer's direction.
- id: 29
  category: driver_testing
  question: What is required if you fail the road skills test at the DMV three times?
  choices:
    A: You must wait 60 days before retaking the test.
    B: You must retake the two-part knowledge exam.
    C: You must complete and pass the in-vehicle part of driver education.
    D: You must pay a penalty fee of $50.
  answer: C
  explanation: If you fail the road skills test at DMV three times, you will not be
    able to take it a fourth time until you complete and pass the in-vehicle part
    of driver education at a driver training school approved by DMV or the Department
    of Education.
- id: 30
  category: signs_and_signals
  question: Under what conditions may you make a left turn at a red light in Virginia?
  choices:
    A: Anytime the intersection is clear of oncoming traffic.
    B: When turning from a one-way street onto another one-way street after a complete
      stop.
    C: When turning from a two-way street onto a one-way street.
    D: Left turns on red are never permitted under any circumstances.
  answer: B
  explanation: You may turn left at a red light if you are on a one-way street and
    turning left onto another one-way street while the traffic signal displays a red
    light, provided you come to a complete stop first.
- id: 31
  category: signs_and_signals
  question: What does a red arrow traffic signal mean?
  choices:
    A: You may proceed in the direction of the arrow after yielding to pedestrians.
    B: You must stop and cannot proceed in the direction of the arrow unless a sign
      permits it.
    C: You may turn in the direction of the arrow after coming to a complete stop.
    D: The light is about to change to green, so prepare to accelerate.
  answer: B
  explanation: A red arrow means you must stop if you intend to move in the direction
    of the arrow. You may not proceed unless signs are posted that read 'Right on
    Red Arrow After Stop' or 'Left on Red Arrow After Stop.'
- id: 32
  category: safe_driving_rules
  question: How should you proceed if you approach an intersection where the traffic
    signals are not working due to a power outage?
  choices:
    A: Yield to the vehicle on your right and proceed without stopping.
    B: Slow down and proceed with caution without coming to a full stop.
    C: Stop and proceed through the intersection as though it were an all-way stop.
    D: Wait at the intersection until a law enforcement officer arrives.
  answer: C
  explanation: When traffic signals are not working because of a power outage or other
    problem and not displaying any lights, you are required to stop, proceeding through
    the intersection as though it were an all-way stop.
- id: 33
  category: signs_and_signals
  question: What does a Yellow X or Yellow Diagonal Downward Arrow lane use signal
    indicate?
  choices:
    A: You should move out of the lane as soon as safely possible.
    B: You are permitted to drive in that lane at the posted speed limit.
    C: You must come to a complete stop in that lane.
    D: You may only use that lane for making left turns.
  answer: A
  explanation: A Yellow X or Yellow Diagonal Downward Arrow means that you should
    move out of the lane as soon as safely possible.
- id: 34
  category: signs_and_signals
  question: What should a driver do when a Pedestrian Hybrid Beacon (PHB) displays
    alternating flashing red lights?
  choices:
    A: Prepare to stop because the light is about to turn solid red.
    B: Proceed with caution if the crosswalk is now clear.
    C: Stop and wait indefinitely for the lights to turn green.
    D: Speed up to clear the intersection quickly.
  answer: B
  explanation: While the walk signal counts down for the pedestrians, the PHB's two
    red lights alternate flashing, telling the driver that if the crosswalk is now
    clear, they may proceed with caution.
- id: 35
  category: signs_and_signals
  question: What type of information do pink and black traffic signs convey?
  choices:
    A: Construction areas.
    B: Motorist services.
    C: Historical or cultural interests.
    D: Incident areas.
  answer: D
  explanation: Pink and black signs are used to advise and warn in incident areas.
- id: 36
  category: signs_and_signals
  question: What does a pentagon-shaped traffic sign indicate?
  choices:
    A: Stop.
    B: Yield.
    C: School zones and school crossings.
    D: Special conditions or hazards ahead.
  answer: C
  explanation: The five-sided pentagon shape marks school zones and warns you about
    school crossings.
- id: 37
  category: signs_and_signals
  question: What is the meaning of a diamond-shaped traffic sign?
  choices:
    A: It gives instructions or tells you the law.
    B: It warns you of special conditions or hazards ahead.
    C: It marks the beginning of a no-passing zone.
    D: It indicates an upcoming railroad crossing.
  answer: B
  explanation: Diamond signs warn you of special conditions or hazards ahead. You
    should slow down and drive with caution.
- id: 38
  category: safe_driving_rules
  question: Which of the following is true regarding speed limit signs and weather
    conditions?
  choices:
    A: You cannot receive a ticket if you are driving at the posted speed limit, regardless
      of weather.
    B: The posted speed limit applies only during rain, snow, or ice.
    C: You may receive a ticket for driving too fast for conditions even if driving
      at or below the posted speed limit.
    D: Speed limits automatically decrease by 10 mph when it rains.
  answer: C
  explanation: During rain, snow and ice, you may receive a ticket for driving too
    fast for the conditions even if you are driving at or less than the posted speed
    limit.
- id: 39
  category: safe_driving_rules
  question: In Virginia, are U-turns permitted at an intersection where a 'No Left
    Turn' sign is posted?
  choices:
    A: Yes, unless a 'No U-Turn' sign is also posted.
    B: Yes, but only if the intersection is completely clear of traffic.
    C: No, because U-turns are considered two left turns and are illegal if a 'No
      Left Turn' sign is posted.
    D: No, U-turns are illegal at all intersections in Virginia.
  answer: C
  explanation: In Virginia, U-turns are considered as two left turns and are illegal
    if a 'No Left Turn' sign is posted.
- id: 40
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean?
  choices:
    A: Come to a complete stop and yield to oncoming vehicles.
    B: Slow down and proceed with caution.
    C: The traffic signal is out of service.
    D: Stop if you intend to move in the direction of the arrow.
  answer: B
  explanation: A flashing yellow light means slow down and proceed with caution. Flashing
    yellow lights are at locations with higher-than-normal hazardous conditions.
- id: 41
  category: signs_and_signals
  question: What is the purpose of brown and white traffic signs?
  choices:
    A: To provide destination types of information.
    B: To inform regarding motorist services.
    C: To advise of historical or cultural interests in the area.
    D: To warn of construction efforts.
  answer: C
  explanation: The brown sign is used to advise of historical or cultural interests
    that might exist in the area.
- id: 42
  category: signs_and_signals
  question: What should you do if you approach an intersection with a solid yellow
    light and you have not yet entered the intersection?
  choices:
    A: Speed up to beat the light before it turns red.
    B: Stop, unless it is unsafe to do so.
    C: Proceed through the intersection at your current speed.
    D: Pull over to the side of the road.
  answer: B
  explanation: A yellow light is a caution warning that the light is about to change.
    If you have not entered the intersection, stop; or, if unsafe to stop, cautiously
    go through it.
- id: 43
  category: sharing_the_road
  question: If a traffic light changes from red to a flashing yellow arrow while a
    pedestrian is in the intersection, what must you do?
  choices:
    A: Honk your horn to alert the pedestrian to move quickly.
    B: Turn immediately, as you have the right-of-way.
    C: Allow the pedestrian to cross the street before turning.
    D: Slowly drive around the pedestrian to clear the intersection.
  answer: C
  explanation: If a traffic light changes from red to flashing yellow arrow while
    a pedestrian is in the intersection, allow the pedestrian to cross the street
    before turning.
- id: 44
  category: safe_driving_rules
  question: At a 4-Way stop, if you arrive at the intersection at the same time as
    another vehicle, who must yield?
  choices:
    A: The driver on the right must yield to the driver on the left.
    B: The driver on the left must yield to the driver on the right.
    C: The driver going straight must yield to the turning driver.
    D: The driver in the larger vehicle has the right-of-way.
  answer: B
  explanation: At intersections with an 'All Way' or '4 Way' stop, if you get to the
    intersection at the same time as other vehicles, the driver on the left must yield
    to the driver on the right.
- id: 45
  category: signs_and_signals
  question: What does an Advisory Speed sign indicate?
  choices:
    A: The minimum speed limit on a highway.
    B: The maximum safe speed for a highway exit.
    C: The speed limit for a school zone.
    D: The recommended speed for passing.
  answer: B
  explanation: According to the manual, an Advisory Speed sign indicates the maximum
    safe speed for a highway exit.
- id: 46
  category: sharing_the_road
  question: How much clearance does state law require when passing horse-drawn buggies?
  choices:
    A: At least two feet
    B: At least three feet
    C: At least four feet
    D: At least five feet
  answer: B
  explanation: State law requires motorists to pass horse-drawn buggies with at least
    three feet of clearance when the way is clear.
- id: 47
  category: safe_driving_rules
  question: What should you do if you are driving on a road marked with a 'Slippery
    When Wet' sign and the pavement is wet?
  choices:
    A: Brake hard to test your traction.
    B: Decrease the distance between your car and the one ahead.
    C: Increase the distance between your car and the vehicle ahead.
    D: Maintain your normal speed and change lanes frequently.
  answer: C
  explanation: When pavement is wet, the manual states you should reduce your speed,
    not brake hard or change direction suddenly, and increase the distance between
    your car and the one ahead of you.
- id: 48
  category: signs_and_signals
  question: What is the proper procedure when approaching a roundabout?
  choices:
    A: Enter without yielding and travel clockwise.
    B: Yield to traffic already in the circle and travel counter-clockwise.
    C: Stop completely and wait for a green light.
    D: Yield to traffic entering the circle and travel clockwise.
  answer: B
  explanation: At a roundabout, entering traffic must yield the right-of-way to traffic
    already in the circle and travel in a counter-clockwise direction.
- id: 49
  category: defensive_driving
  question: What should you do if your car stalls on railroad tracks?
  choices:
    A: Stay in the car and call 911.
    B: Get out and run in the same direction the train is traveling.
    C: Try to push the car off the tracks yourself.
    D: Get out right away and run diagonally away from the tracks in the direction
      of the oncoming train.
  answer: D
  explanation: If your car stalls on the tracks, the manual instructs you to get out
    of the car right away and run diagonally away from the tracks in the direction
    of the oncoming train.
- id: 50
  category: penalties_and_points
  question: What is the penalty for being convicted of using a handheld communications
    device in a highway work zone?
  choices:
    A: A $100 fine
    B: A $250 fine
    C: A $500 fine
    D: License suspension for 30 days
  answer: B
  explanation: If you are convicted of using a handheld communications device in a
    highway work zone, you will be fined $250.
- id: 51
  category: penalties_and_points
  question: What is the maximum fine for exceeding the speed limit in a highway work
    zone?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: If you are convicted of exceeding the speed limit in a highway work
    zone, you may be fined up to $500.
- id: 52
  category: signs_and_signals
  question: What does a 'No Passing Zone' sign mean?
  choices:
    A: You may pass cars if the way is clear.
    B: You may not pass cars ahead of you in your lane, even if the way is clear.
    C: Only commercial vehicles are prohibited from passing.
    D: You may pass only if the vehicle ahead is moving below the speed limit.
  answer: B
  explanation: A No Passing Zone sign marks the beginning of a zone where you may
    not pass cars ahead of you in your lane, even if the way is clear.
- id: 53
  category: sharing_the_road
  question: Which vehicles are required to always stop at railroad crossings, even
    when the lights are not flashing?
  choices:
    A: Passenger cars
    B: Motorcycles
    C: School buses
    D: Delivery trucks
  answer: C
  explanation: The manual notes that school buses must always stop at railroad crossings,
    even when the lights are not flashing.
- id: 54
  category: safe_driving_rules
  question: When driving through a work zone near traffic control devices like barricades
    and cones, what should you do?
  choices:
    A: Keep your vehicle in the middle of the lane and do not change lanes until completely
      clear.
    B: Drive as close to the devices as possible to leave room for other vehicles.
    C: Change lanes frequently to avoid the devices.
    D: Increase your speed to exit the work zone quickly.
  answer: A
  explanation: When driving near traffic control devices in a work zone, keep your
    vehicle in the middle of the lane, obey the speed limit, and don't change lanes
    until you are completely clear of the work zone.
- id: 55
  category: signs_and_signals
  question: What color marks a work zone and means you should slow down and be alert?
  choices:
    A: Red
    B: Yellow
    C: Orange
    D: Green
  answer: C
  explanation: The color orange marks a work zone and means slow down and be alert.
- id: 56
  category: sharing_the_road
  question: Why is an 'Open Joints' sign particularly important for motorcyclists?
  choices:
    A: It indicates a designated motorcycle parking area.
    B: Open joints can cause a motorcyclist to lose control of the motorcycle.
    C: It marks a lane exclusively for motorcycles.
    D: It warns of high winds that only affect motorcycles.
  answer: B
  explanation: The manual warns to slow down because open joints on bridges or ramps
    could cause a motorcyclist to lose control of the motorcycle.
- id: 57
  category: safe_driving_rules
  question: When two lanes of traffic moving in the same direction are about to become
    one (Merge), who is responsible for merging safely?
  choices:
    A: Only the driver in the right lane.
    B: Only the driver in the left lane.
    C: Drivers in both lanes are responsible for merging safely.
    D: The driver of the larger vehicle.
  answer: C
  explanation: At a merge where two lanes become one, drivers in both lanes are responsible
    for merging safely.
- id: 58
  category: signs_and_signals
  question: What does a 'Low Ground Railroad Crossing' sign warn drivers about?
  choices:
    A: The railroad tracks are currently under construction.
    B: Trains travel at lower speeds in this area.
    C: The bottom of low vehicles may get caught or drag on the tracks due to a steep
      slope.
    D: Only low-clearance vehicles are permitted to cross.
  answer: C
  explanation: This sign warns of a steep slope where the railroad tracks cross the
    road, which may cause the bottom of low vehicles to get caught or drag on the
    tracks.
- id: 59
  category: safe_driving_rules
  question: What should you do as you leave a work zone?
  choices:
    A: Speed up immediately to resume normal traffic flow.
    B: Change lanes to avoid construction vehicles.
    C: Stay in your lane and maintain your speed until completely clear.
    D: Stop and check your vehicle for debris damage.
  answer: C
  explanation: As you leave the work zone, stay in your lane and maintain your speed.
    Don't change lanes until you are completely clear of the work zone.
- id: 60
  category: signs_and_signals
  question: Vehicles displaying a slow-moving vehicle sign are traveling at what maximum
    speed?
  choices:
    A: 15 MPH
    B: 25 MPH
    C: 35 MPH
    D: 45 MPH
  answer: B
  explanation: Slow Moving Vehicles traveling at 25 MPH or less, such as farm equipment,
    horse-drawn vehicles or highway work vehicles, must display these signs when using
    a public highway.
- id: 61
  category: signs_and_signals
  question: What do red reflectors on the pavement indicate?
  choices:
    A: A fire hydrant is located nearby.
    B: You are approaching a four-way stop.
    C: You are flowing in the wrong direction and should not enter.
    D: A school zone is ahead.
  answer: C
  explanation: Red reflectors on the pavement show areas not to be entered or used.
    They are positioned on the road surface so that only traffic flowing in the wrong
    direction would observe them.
- id: 62
  category: safe_driving_rules
  question: When are you allowed to cross double solid yellow lines in the center
    of the road?
  choices:
    A: When passing a slow-moving tractor.
    B: When making a left turn or passing pedestrians and bicyclists.
    C: When the vehicle ahead is traveling under the speed limit.
    D: You are never allowed to cross double solid yellow lines.
  answer: B
  explanation: Passing is not allowed in either direction. You may not cross the lines
    unless you are making a left turn or passing pedestrians, bicyclists, and riders
    of scooters or skateboards, when the opposite lane is clear.
- id: 63
  category: signs_and_signals
  question: What is the purpose of dotted white lines consisting of closely spaced
    small rectangles?
  choices:
    A: To indicate a pedestrian crosswalk.
    B: To show lane assignment in intersections and interchanges.
    C: To mark the right edge of the pavement.
    D: To separate traffic moving in opposite directions.
  answer: B
  explanation: Dotted white lines are actually small rectangles in a series... They
    are used to show lane assignment in intersections and interchanges where there
    might otherwise be a tendency to drift out of a lane.
- id: 64
  category: safe_driving_rules
  question: On a three-lane road, if both sides of the center lane are marked by a
    solid yellow line and a broken yellow line, how far may you travel in this lane?
  choices:
    A: Up to 50 feet.
    B: Up to 100 feet.
    C: Up to 150 feet.
    D: Up to 200 feet.
  answer: C
  explanation: If both sides of the center lane are marked by a solid yellow line
    and a broken yellow line, drivers traveling in either direction may use the lane
    for making left turns. However, they may not travel further than 150 feet in this
    lane.
- id: 65
  category: sharing_the_road
  question: What does a shared lane marking (sharrow) indicate?
  choices:
    A: The lane is reserved exclusively for bicycles.
    B: The lane is too narrow for motor vehicles and bicycles to share side-by-side.
    C: Bicycles must yield to motor vehicles at all times.
    D: Motor vehicles are prohibited from entering the lane.
  answer: B
  explanation: A shared lane marking, or sharrow... is used on travel lanes too narrow
    for motor vehicles and bicycles to share side-by-side.
- id: 66
  category: sharing_the_road
  question: If you approach an intersection with a painted bicycle box and a red traffic
    signal, where must you stop?
  choices:
    A: Inside the bicycle box.
    B: Behind all bicycle boxes.
    C: Beyond the bicycle box, inside the intersection.
    D: You do not have to stop if turning right.
  answer: B
  explanation: Drivers must stop for a red traffic signal behind all bicycle boxes,
    not inside the box.
- id: 67
  category: sharing_the_road
  question: Are you allowed to make a right turn on red at an intersection with a
    bicycle box?
  choices:
    A: Yes, if you yield to bicycles first.
    B: Yes, but only if the bike box is painted green.
    C: No, right turns on red are not allowed at these intersections.
    D: No, unless you are driving a high occupancy vehicle.
  answer: C
  explanation: Right turns on red are not allowed at these intersections [with bicycle
    boxes].
- id: 68
  category: safe_driving_rules
  question: Which of the following vehicles is generally permitted to use High Occupancy
    Vehicle (HOV) lanes during heavy traffic periods?
  choices:
    A: Any vehicle traveling over 65 MPH.
    B: Commercial freight trucks.
    C: Motorcycles.
    D: Vehicles towing trailers.
  answer: C
  explanation: During heavy traffic periods, HOV lanes are reserved for buses, vanpools,
    carpools, other high occupancy vehicles, motorcycles, and certain clean special
    fuel vehicles.
- id: 69
  category: safe_driving_rules
  question: What should you do if you mistakenly enter a high-speed E-ZPass toll lane
    without a transponder?
  choices:
    A: Stop immediately and back up.
    B: Pull over to the shoulder and wait for a toll employee.
    C: Stop and pay with cash at the camera.
    D: Do not stop; the registered owner will be billed for the toll.
  answer: D
  explanation: If you do enter one of those lanes by mistake, do not stop. Stopping
    is unsafe and could cause a rear-end crash. Cameras will photograph the car's
    license plate number and the registered vehicle's owner will be billed for the
    toll.
- id: 70
  category: signs_and_signals
  question: What does a yellow painted curb mean?
  choices:
    A: Stop only long enough to pick up or drop off passengers.
    B: Stop only long enough to load or unload, and stay with your car.
    C: Do not stop, stand, or park.
    D: Parking is permitted for up to 30 minutes.
  answer: B
  explanation: Yellow — Stop only long enough to load or unload. Stay with your car.
- id: 71
  category: safe_driving_rules
  question: How should a driver handle rumble strips placed across travel lanes in
    advance of a work zone?
  choices:
    A: Swerve around them to avoid tire damage.
    B: Speed up to pass over them quickly.
    C: Drive over them slowly, not swerving around them.
    D: Stop immediately before crossing them.
  answer: C
  explanation: Rumble strips should be slowly driven over, not swerved around.
- id: 72
  category: signs_and_signals
  question: What is the rule for crossing double solid white lines?
  choices:
    A: You may cross them with caution to change lanes.
    B: You may cross them only when passing a slow-moving vehicle.
    C: You may not cross these lines.
    D: You may cross them to make a U-turn.
  answer: C
  explanation: Double solid white lines separate lanes of traffic going in the same
    direction... You may not cross these lines.
- id: 73
  category: signs_and_signals
  question: What shape is used to create a yield line extending across the roadway?
  choices:
    A: Squares
    B: Circles
    C: Triangles
    D: Diamonds
  answer: C
  explanation: Yield line is a line of triangles extending across the roadway that
    may be used with a yield sign to show the point at which you must yield or stop.
- id: 74
  category: safe_driving_rules
  question: What is the recommended hand position on the steering wheel?
  choices:
    A: 10 o'clock and 2 o'clock
    B: 9 o'clock and 3 o'clock
    C: 8 o'clock and 4 o'clock
    D: 7 o'clock and 5 o'clock
  answer: C
  explanation: The manual states that if your steering wheel were a clock, your hands
    should be at the 8 o'clock and 4 o'clock positions.
- id: 75
  category: penalties_and_points
  question: 'Under Virginia law, you can be charged with reckless driving if you are
    driving:'
  choices:
    A: 10 or more miles per hour above the speed limit.
    B: 15 or more miles per hour above the speed limit.
    C: 20 or more miles per hour above the speed limit, or over 85 MPH.
    D: Over 75 MPH on any highway.
  answer: C
  explanation: According to Virginia law, if you are driving 20 or more miles per
    hour (MPH) above the speed limit, or over 85 MPH, a law enforcement officer may
    charge you with reckless driving.
- id: 76
  category: safe_driving_rules
  question: Unless posted otherwise, what is the maximum speed limit for passenger
    vehicles on unpaved roads?
  choices:
    A: 25 MPH
    B: 35 MPH
    C: 45 MPH
    D: 55 MPH
  answer: B
  explanation: Unless there is a speed limit sign stating otherwise, the maximum speed
    limit for passenger vehicles and motorcycles is 35 MPH for unpaved roads.
- id: 77
  category: safe_driving_rules
  question: Which of the following statements about radar detectors is true in Virginia?
  choices:
    A: They are legal only on interstate highways.
    B: They are legal for passenger vehicles but not commercial vehicles.
    C: It is illegal to use radar detectors in Virginia.
    D: They are permitted if you are driving under the speed limit.
  answer: C
  explanation: 'The manual explicitly states: "It is illegal to use radar detectors
    in Virginia."'
- id: 78
  category: penalties_and_points
  question: If you fail to obey a law enforcement officer's signal to stop, and the
    officer pursues you and is killed as a direct result, what is the penalty?
  choices:
    A: A Class 1 misdemeanor
    B: A Class 4 felony
    C: A $500 fine and license suspension
    D: A traffic infraction
  answer: B
  explanation: If you don't obey a law enforcement officer's signal to stop and the
    officer pursues you and is killed as a direct result of the pursuit, you will
    be guilty of a Class 4 felony.
- id: 79
  category: sharing_the_road
  question: When are you NOT required to stop for a stopped school bus with flashing
    red lights?
  choices:
    A: When you are traveling in the same direction on a multi-lane highway.
    B: When you are traveling in the opposite direction on a roadway with a median
      or barrier dividing the road.
    C: When you are on a private road or school driveway.
    D: When the bus is loading passengers but the stop sign is not extended.
  answer: B
  explanation: You do not have to stop if you are traveling in the opposite direction
    on a roadway with a median or barrier dividing the road and the bus is on the
    opposite side.
- id: 80
  category: safe_driving_rules
  question: Which of the following describes 'reaction distance'?
  choices:
    A: The time it takes you to recognize a hazard.
    B: The distance your vehicle travels between the time you recognize a problem
      and the time you apply the brakes.
    C: The distance your car travels after you apply the brakes.
    D: The total distance it takes to stop your vehicle from 60 MPH.
  answer: B
  explanation: Reaction distance is defined as the distance your vehicle travels between
    the time you recognize a problem and the time you apply the brakes.
- id: 81
  category: safe_driving_rules
  question: How can wet pavement affect your vehicle's stopping distance?
  choices:
    A: It can double your braking distance.
    B: It reduces your perception time.
    C: It decreases your reaction distance.
    D: It has no effect if you have antilock brakes.
  answer: A
  explanation: The manual states that pavement condition affects braking distance,
    and for example, wet pavement can double your braking distance.
- id: 82
  category: vehicle_information
  question: What should you remember to do if your vehicle is equipped with antilock
    brakes?
  choices:
    A: Pump the brakes gently when stopping on slippery roads.
    B: Never pump antilock brakes.
    C: Apply the parking brake simultaneously.
    D: Turn off the system in wet weather.
  answer: B
  explanation: The manual explicitly warns drivers to "never pump antilock brakes."
- id: 83
  category: sharing_the_road
  question: When passing a stationary trash collection vehicle on a highway with fewer
    than four lanes, what must you do if you cannot change lanes?
  choices:
    A: Stop and wait for the vehicle to move.
    B: Honk your horn and maintain your speed.
    C: Slow down to 10 miles per hour below the posted speed limit and pass at least
      two feet to the left.
    D: Accelerate to pass the vehicle as quickly as possible.
  answer: C
  explanation: If on a highway of fewer than four lanes or if you are unable to change
    lanes, slow down to 10 miles per hour below the posted speed limit and pass at
    least two feet to the left of the vehicle.
- id: 84
  category: safe_driving_rules
  question: What is the minimum following distance you must maintain behind an emergency
    vehicle when its lights are flashing?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: 'The manual states: "Never follow an emergency vehicle closer than
    500 feet when its lights are flashing."'
- id: 85
  category: safe_driving_rules
  question: In which direction must drivers travel after entering a roundabout?
  choices:
    A: Clockwise
    B: Counter-clockwise
    C: Straight through the center island
    D: Whichever direction is shortest to their exit
  answer: B
  explanation: After entering the roundabout, drivers must travel in a counter-clockwise
    direction.
- id: 86
  category: safe_driving_rules
  question: When two vehicles from different directions arrive at the same time at
    an intersection with no signs or signals, who has the right-of-way?
  choices:
    A: The driver on the left must allow the driver on the right to go first.
    B: The driver on the right must allow the driver on the left to go first.
    C: The vehicle traveling at a faster speed goes first.
    D: The vehicle turning left goes first.
  answer: A
  explanation: When vehicles from different directions arrive at the same time at
    an intersection with no signs or signals, the driver on the left must allow the
    driver on the right to go first.
- id: 87
  category: signs_and_signals
  question: What must you do if the traffic lights at an intersection are not working?
  choices:
    A: Proceed through the intersection without stopping if the way is clear.
    B: Treat the intersection as a yield sign.
    C: All vehicles must stop, and the driver on the left must yield to the driver
      on the right.
    D: The driver on the right must yield to the driver on the left.
  answer: C
  explanation: If the traffic lights at an intersection are not working, all vehicles
    coming to the intersection must stop. The driver on the left must yield to the
    driver on the right.
- id: 88
  category: safe_driving_rules
  question: What must you do when entering a roadway from a private road or driveway?
  choices:
    A: Accelerate quickly to merge with traffic.
    B: Stop and yield to all traffic and pedestrians.
    C: Sound your horn and proceed without stopping.
    D: Yield only to vehicles approaching from the left.
  answer: B
  explanation: The manual states that when entering a roadway from a private road
    or driveway, you must stop and yield to all traffic and pedestrians.
- id: 89
  category: sharing_the_road
  question: How should you interact with a funeral procession on the road?
  choices:
    A: You may cut through the procession if you are in a hurry.
    B: You must yield to the procession and never cut through or join it.
    C: You should join the procession to bypass traffic signals.
    D: You must pass the procession on the right side.
  answer: B
  explanation: You must yield to funeral processions. The manual explicitly states
    to never cut through, join, or interfere with a funeral procession.
- id: 90
  category: penalties_and_points
  question: What is a potential penalty for failing to proceed with caution and safely
    change lanes when approaching a stationary emergency vehicle with flashing lights?
  choices:
    A: A written warning for the first offense.
    B: Mandatory community service.
    C: Court suspension of your driver's license and demerit points.
    D: Immediate vehicle impoundment.
  answer: C
  explanation: Violations of the rules for approaching stationary vehicles with flashing
    lights can result in court suspension of your driver's license and demerit points
    on your driving record.
- id: 91
  category: safe_driving_rules
  question: What signal should you use while inside a roundabout to let drivers know
    you want to exit?
  choices:
    A: Left turn signal.
    B: Right turn signal.
    C: Hazard lights.
    D: No signal is required in a roundabout.
  answer: B
  explanation: While inside the roundabout, you must use your vehicle's right turn
    signal to let drivers around you know what you want to do when you are ready to
    exit.
- id: 92
  category: safe_driving_rules
  question: When driving on a multi-lane highway, what is the left lane primarily
    used for?
  choices:
    A: Cruising at the speed limit.
    B: Slower traffic.
    C: Passing only.
    D: Exiting the highway.
  answer: C
  explanation: The manual specifies that when driving on a multi-lane highway, the
    left lane is for passing only, not cruising.
- id: 93
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to return to the right lane?
  choices:
    A: As soon as you are parallel with the other vehicle.
    B: When you can see the front of the passed vehicle in your rearview mirror.
    C: Three seconds after you pass the vehicle's rear bumper.
    D: When the passed vehicle flashes its headlights.
  answer: B
  explanation: You should return to the right lane as soon as you can see the front
    of the passed vehicle in your rearview mirror.
- id: 94
  category: sharing_the_road
  question: How much clearance must you provide when approaching or passing a person
    riding a bicycle?
  choices:
    A: At least two feet to the left.
    B: At least three feet to the left.
    C: At least four feet to the left.
    D: At least five feet to the left.
  answer: B
  explanation: When approaching or passing a person riding a bicycle, moped, or power-assisted
    bicycle, you must reduce speed and pass at least three feet to the left.
- id: 95
  category: defensive_driving
  question: What should you do when another vehicle is passing you?
  choices:
    A: Speed up to prevent them from passing.
    B: Move into the left lane.
    C: Maintain a steady speed or slow down.
    D: Flash your high beams.
  answer: C
  explanation: The manual advises that when being passed, you shouldn't speed up.
    You should maintain a steady speed or slow down.
- id: 96
  category: safe_driving_rules
  question: In which of the following situations is passing considered unlawful and
    unsafe?
  choices:
    A: On a multi-lane highway with traffic moving in the same direction.
    B: When a solid line marks the left side of your lane.
    C: When the vehicle ahead is making a left turn and you stay on the pavement.
    D: When you can see clearly for 500 feet ahead.
  answer: B
  explanation: Passing is unlawful and unsafe when a solid line marks the left side
    of your lane.
- id: 97
  category: defensive_driving
  question: What should you do if you veer off a curved or straight road to avoid
    losing control?
  choices:
    A: Panic and brake hard immediately.
    B: Turn the steering wheel sharply back toward the road.
    C: Accelerate to regain traction.
    D: Gradually reduce speed, look in the direction you want to go, and slowly steer
      back.
  answer: D
  explanation: If you veer off the road, do not panic. Gradually reduce your speed,
    look in the direction you want to go, and slowly steer back onto the roadway to
    avoid over-correcting.
- id: 98
  category: defensive_driving
  question: Why should you keep your front wheels pointed straight ahead while waiting
    to make a left turn?
  choices:
    A: It helps you accelerate faster when the light turns green.
    B: It prevents you from being pushed into oncoming traffic if hit from behind.
    C: It reduces wear and tear on your power steering system.
    D: It signals to other drivers that you are yielding.
  answer: B
  explanation: Keeping your front wheels pointed straight ahead until you are actually
    going to make the left turn prevents you from being pushed into oncoming traffic
    if another vehicle crashes into you from behind.
- id: 99
  category: safe_driving_rules
  question: How should two vehicles approaching each other and signaling to turn left
    proceed?
  choices:
    A: Both vehicles should turn behind each other.
    B: The vehicle on the right has the right-of-way.
    C: Both vehicles should turn in front of each other so their passenger sides are
      beside each other.
    D: Both vehicles must stop and wait for a green arrow.
  answer: C
  explanation: When two vehicles are approaching each other and signaling to turn
    left, both vehicles should turn in front of each other so that the passenger sides
    of the vehicles are beside each other.
- id: 100
  category: safe_driving_rules
  question: Where are U-turns allowed in business districts, cities, and towns?
  choices:
    A: Anywhere there is a broken yellow line.
    B: Only at intersections.
    C: On any highway.
    D: In the middle of the block if the way is clear.
  answer: B
  explanation: In business districts, cities and towns, U-turns are allowed only at
    intersections.
- id: 101
  category: safe_driving_rules
  question: How far ahead of a turn should you signal your intent to turn?
  choices:
    A: At least one to two seconds, 50 feet ahead.
    B: At least three to four seconds, 100 feet ahead.
    C: At least five to six seconds, 200 feet ahead.
    D: Just as you begin to turn the steering wheel.
  answer: B
  explanation: You should signal at least three or four seconds, 100 feet, ahead of
    the turn.
- id: 102
  category: signs_and_signals
  question: What does a left hand and arm pointing downward indicate?
  choices:
    A: Left turn.
    B: Right turn.
    C: Slow or stop.
    D: Proceed with caution.
  answer: C
  explanation: According to the hand signals guide in the manual, a left hand and
    arm pointing downward indicates 'Slow or Stop'.
- id: 103
  category: safe_driving_rules
  question: What is the recommended following distance when driving at speeds between
    35 and 45 MPH on dry surfaces?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: According to the manual, the recommended following distance is 3 seconds
    for speeds of 35-45 MPH.
- id: 104
  category: defensive_driving
  question: In which of the following situations should you increase your following
    distance?
  choices:
    A: When driving behind a large vehicle that blocks your vision.
    B: When driving on a newly paved road.
    C: When entering an expressway.
    D: When driving behind a vehicle with a loud exhaust.
  answer: A
  explanation: The manual instructs drivers to increase their following distance when
    driving behind a large vehicle that blocks their vision, among other situations
    like bad weather or being tailgated.
- id: 105
  category: defensive_driving
  question: What should you do if you find yourself being tailgated by another vehicle?
  choices:
    A: Brake suddenly to warn the driver.
    B: Speed up to increase the distance between you.
    C: Move over to another lane or gently tap your brakes to flash your brake lights.
    D: Turn on your hazard lights and stop in your lane.
  answer: C
  explanation: If you are being tailgated, the manual advises not to brake suddenly.
    Instead, move over to another lane if possible, or gently tap your brakes to flash
    your brake lights and slow down.
- id: 106
  category: defensive_driving
  question: How far ahead do expert drivers try to focus their eyes when searching
    the road?
  choices:
    A: 5 to 10 seconds ahead
    B: 10 to 15 seconds ahead
    C: 20 to 30 seconds ahead
    D: 45 to 60 seconds ahead
  answer: C
  explanation: Looking ahead helps identify risks early. Expert drivers try to focus
    their eyes 20 to 30 seconds ahead, which equals approximately one block in the
    city.
- id: 107
  category: safe_driving_rules
  question: When reaching an intersection, in which order should you check for traffic?
  choices:
    A: Right, left, then right again
    B: Left, right, then left again
    C: Straight ahead, then left
    D: Right, straight ahead, then left
  answer: B
  explanation: At any intersection, look to the left first, since cars coming from
    the left will be closer to you. Then look to the right and take one more quick
    look to the left before you drive through.
- id: 108
  category: defensive_driving
  question: How often should you use your rearview mirror to check the traffic behind
    you?
  choices:
    A: About every 5 seconds
    B: About every 10 seconds
    C: About every 30 seconds
    D: Only when changing lanes
  answer: B
  explanation: The manual states to use your rearview mirror to check the traffic
    behind you frequently, about every 10 seconds.
- id: 109
  category: defensive_driving
  question: What is the best way to see a car in your blind spot?
  choices:
    A: Adjust your inside rearview mirror to a wider angle.
    B: Rely on your vehicle's backup camera.
    C: Quickly turn your head and glance over your shoulder.
    D: Watch for shadows on the road surface.
  answer: C
  explanation: The best way to see a car in your blind spot is by quickly turning
    your head and glancing over your shoulder to ensure the way is clear before changing
    lanes or passing.
- id: 110
  category: penalties_and_points
  question: What is the potential penalty for failing to stop for a lawfully crossing
    pedestrian and causing serious bodily damage or death?
  choices:
    A: A Class 3 felony
    B: A Class 1 misdemeanor
    C: A $500 fine and no jail time
    D: A warning for the first offense
  answer: B
  explanation: Failing to stop for pedestrians who are lawfully crossing a roadway
    and causing serious bodily damage or death can result in a Class 1 misdemeanor.
- id: 111
  category: sharing_the_road
  question: Under what circumstances is a bicyclist allowed to ride in the center
    of the lane?
  choices:
    A: Whenever they are riding on an interstate highway.
    B: Only when traveling at the posted speed limit.
    C: When they are about to turn left or when the lane is too narrow to share side-by-side
      with a car.
    D: Bicyclists are never allowed to ride in the center of the lane.
  answer: C
  explanation: Bicyclists are allowed to ride in the center of the lane when necessary,
    such as when they are about to turn left or when the lane is too narrow to share
    side-by-side with a car.
- id: 112
  category: sharing_the_road
  question: How should you adjust your following distance when driving behind a motorcycle
    in inclement weather?
  choices:
    A: Keep the standard 2-second following distance.
    B: Add an extra second to the following distance rule.
    C: Double the following distance after adding an extra second.
    D: Reduce your following distance to stay in the motorcycle's draft.
  answer: C
  explanation: The manual states to allow plenty of braking distance by adding an
    extra second to the following distance rule for motorcycles, and in inclement
    weather, to double this distance.
- id: 113
  category: sharing_the_road
  question: Why is it especially important to yield to motorcycles before pulling
    out into traffic?
  choices:
    A: Motorcycles always travel faster than the posted speed limit.
    B: The size of a motorcycle can cause you to misjudge its speed and distance.
    C: Motorcycles have the right-of-way at all intersections.
    D: Motorcycles cannot use their brakes as effectively as cars.
  answer: B
  explanation: Yield to motorcycles because the size of a motorcycle can cause you
    to misjudge the motorcycle’s speed and distance.
- id: 114
  category: sharing_the_road
  question: What must a driver do when encountering a pedestrian using a cane or guide
    dog?
  choices:
    A: Honk the horn to alert the pedestrian of the vehicle's presence.
    B: Slow down to 10 MPH and proceed with caution.
    C: Come to a full stop, as this indicates blindness or vision impairment.
    D: Yield only if the pedestrian is in a marked crosswalk.
  answer: C
  explanation: Drivers are required to come to a full stop for a pedestrian using
    a cane or guide dog, as this indicates blindness or vision impairment.
- id: 115
  category: sharing_the_road
  question: What is an important safety rule to follow when driving around light rail
    train tracks?
  choices:
    A: You may pass other vehicles while on the train tracks.
    B: Never stop, pass or shift on train tracks.
    C: You can drive around lowered crossing gates if no train is visible.
    D: Trains only travel in one direction on a single track.
  answer: B
  explanation: When driving around light rail trains, you must never stop, pass or
    shift on train tracks.
- id: 116
  category: vehicle_information
  question: 'Low speed vehicles may be operated on public roads with a maximum speed
    limit of:'
  choices:
    A: 25 MPH or less
    B: 35 MPH or less
    C: 45 MPH or less
    D: 55 MPH or less
  answer: B
  explanation: Low speed vehicles may be operated on public roads with speed limits
    of 35 MPH or less by licensed drivers or learner's permit holders accompanied
    by a licensed driver.
- id: 117
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck's side blind spot
    or 'No-Zone'?
  choices:
    A: You are driving within 500 feet of the rear of the truck.
    B: The truck's turn signals are flashing.
    C: You cannot see the truck driver's face in his side view mirror.
    D: You are driving on a two-lane road.
  answer: C
  explanation: Trucks have big No-Zones on both sides. If you can't see the driver's
    face in his side view mirror, then he can't see you.
- id: 118
  category: sharing_the_road
  question: When passing a large truck, bus, or RV, when is it safe to pull back into
    the lane in front of the vehicle?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper.
    B: When you can see the entire front of the truck in your rearview mirror.
    C: When you are exactly 50 feet ahead of the truck.
    D: When the truck driver flashes their headlights.
  answer: B
  explanation: When passing, look for the entire front of the truck in your rearview
    mirror before pulling in front to avoid the front No-Zone.
- id: 119
  category: vehicle_information
  question: What should you do if the light to medium trailer you are towing starts
    to sway?
  choices:
    A: Accelerate to pull the trailer straight.
    B: Steer sharply from side to side.
    C: Apply the brakes firmly.
    D: Slow down.
  answer: D
  explanation: When driving a vehicle with a light to medium trailer attached, if
    your trailer starts to sway, you should slow down.
- id: 120
  category: safe_driving_rules
  question: What is the most common mistake that drivers make when backing up?
  choices:
    A: Relying only on the rearview mirror.
    B: Failing to look both ways behind them.
    C: Backing up too slowly.
    D: Keeping both hands on the steering wheel.
  answer: B
  explanation: The most common mistake that drivers make when backing up is failing
    to look both ways behind them.
- id: 121
  category: safe_driving_rules
  question: When parking next to a curb on a public road, what is the maximum distance
    your vehicle may be from the curb?
  choices:
    A: 6 inches
    B: 1 foot
    C: 18 inches
    D: 2 feet
  answer: B
  explanation: If you park next to a curb, pull close to it. You may not park more
    than one foot from the curb.
- id: 122
  category: safe_driving_rules
  question: How should you position your front wheels when parking uphill next to
    a curb?
  choices:
    A: Turn the front wheels left
    B: Turn the front wheels right
    C: Keep the wheels perfectly straight
    D: Turn the rear wheels left
  answer: A
  explanation: When parking uphill with a curb, turn the front wheels left to prevent
    the vehicle from rolling into the street.
- id: 123
  category: safe_driving_rules
  question: You are prohibited from parking within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: You may not park within 15 feet of a fire hydrant.
- id: 124
  category: safe_driving_rules
  question: It is illegal to park your vehicle within how many feet of a railroad
    crossing?
  choices:
    A: 15 feet
    B: 20 feet
    C: 50 feet
    D: 500 feet
  answer: C
  explanation: You may not park within 50 feet of a railroad crossing.
- id: 125
  category: defensive_driving
  question: According to the manual, what is the single biggest contributor to crashes?
  choices:
    A: Speeding
    B: Driving under the influence
    C: Failing to identify a risk
    D: Tailgating
  answer: C
  explanation: The single biggest contributor to crashes is failing to identify a
    risk. To be a good driver, you need to know what to look for and where to look.
- id: 126
  category: safe_driving_rules
  question: 'Virginia law requires motorists to use headlights during inclement weather
    when visibility is reduced to:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: Virginia law requires motorists to use headlights during inclement
    weather such as rain, fog, snow or sleet when visibility is reduced to 500 feet.
- id: 127
  category: safe_driving_rules
  question: When must you use your headlights in relation to your windshield wipers?
  choices:
    A: Only when driving at night.
    B: Whenever you use your windshield wipers as a result of bad weather.
    C: Only when the wipers are on the highest speed setting.
    D: Headlights are not required when using wipers during the day.
  answer: B
  explanation: You must use your headlights whenever you use your windshield wipers
    as a result of bad weather.
- id: 128
  category: safe_driving_rules
  question: When following another vehicle at night, you must use low-beams whenever
    you are within what distance of the vehicle ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: When following, use low-beams whenever you are within 200 feet of the
    vehicle ahead.
- id: 129
  category: defensive_driving
  question: What should you do if the high-beams of an oncoming car are on?
  choices:
    A: Turn on your high-beam headlights to warn the driver.
    B: Look directly at the bright lights to track the vehicle.
    C: Glance toward the side of the road, then look quickly ahead.
    D: Flash your headlights rapidly and honk your horn.
  answer: C
  explanation: If the high-beams of an oncoming car are on, avoid looking directly
    at the bright lights. Glance toward the side of the road, then look quickly ahead
    to determine the other vehicle's position.
- id: 130
  category: safe_driving_rules
  question: When driving on a highway, you must dim your high-beam headlights when
    an oncoming vehicle is within what distance?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: The manual states to use low-beam headlights on highways unless another
    vehicle is within 500 feet coming toward you.
- id: 131
  category: defensive_driving
  question: What should you do if an oncoming vehicle fails to dim their high-beam
    headlights?
  choices:
    A: Turn on your high-beam headlights to warn them
    B: Glance toward the side of the road and look quickly ahead
    C: Look directly at the headlights to gauge their distance
    D: Pull over immediately and wait for them to pass
  answer: B
  explanation: If the high-beams of an oncoming car are on, avoid looking directly
    at the bright lights. Glance toward the side of the road, then look quickly ahead.
    Do not turn on your high-beam headlights.
- id: 132
  category: safe_driving_rules
  question: Which headlights should you use when driving in heavy fog?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Emergency flashers
  answer: B
  explanation: Use low-beam headlights in heavy fog because fog reflects light and
    can reflect your own headlights back into your eyes.
- id: 133
  category: safe_driving_rules
  question: Why are roads more likely to be slippery during the first half-hour after
    rain begins?
  choices:
    A: The rain washes away the traction material on the road
    B: Oil on the road surface mixes with water
    C: The temperature drops rapidly causing ice to form
    D: Tires hydroplane more easily in shallow water than deep water
  answer: B
  explanation: When rain begins, during the first half-hour, roads are more likely
    to be slippery due to oil on the road surface mixing with water.
- id: 134
  category: vehicle_information
  question: Before driving in snowy conditions, from which parts of your vehicle must
    you remove snow and ice?
  choices:
    A: Only the windshield and front windows
    B: Only the front and rear lights
    C: The entire car, including the roof, hood, and rear
    D: The windshield wipers and mirrors only
  answer: C
  explanation: Remove snow and ice from your entire car, including the roof, hood
    and rear of the vehicle, before you start driving so it doesn't fly off and create
    a hazard.
- id: 135
  category: safe_driving_rules
  question: Where should you be especially watchful for ice on the road during cold
    weather?
  choices:
    A: On bridges and in shady areas
    B: In tunnels and underpasses
    C: At intersections with traffic lights
    D: On the crests of hills
  answer: A
  explanation: Watch for ice on bridges and in shady areas. Bridges freeze before
    other road surfaces.
- id: 136
  category: penalties_and_points
  question: 'If you are convicted of aggressive driving in Virginia, your license
    could be suspended for:'
  choices:
    A: 5 days to 30 days
    B: 10 days to 6 months
    C: 30 days to 1 year
    D: 6 months to 2 years
  answer: B
  explanation: If you are convicted of aggressive driving, your license could be suspended
    for ten days or for as long as six months.
- id: 137
  category: defensive_driving
  question: How should you react if you encounter an aggressive driver on the road?
  choices:
    A: Speed up to stay ahead of them
    B: Make eye contact to show you are not intimidated
    C: Try to out-maneuver them
    D: Stay out of the way and avoid eye contact
  answer: D
  explanation: If you see an aggressive driver, stay out of the way. Don't challenge
    the aggressive driver, avoid eye contact, and ignore his gestures and shouting.
- id: 138
  category: driver_responsibility
  question: Which of the following is an effective and reliable way to prevent drowsy
    driving?
  choices:
    A: Rolling down a window
    B: Chewing gum and turning up the radio
    C: Consuming caffeine or energy drinks
    D: Stopping at a safe place and taking a 10 to 20 minute nap
  answer: D
  explanation: Stop at a safe place and take a nap. As little as 10 to 20 minutes
    of sleep can make a big difference. Rolling down a window, chewing gum, turning
    up the radio, or consuming caffeine are not reliable methods.
- id: 139
  category: alcohol_drugs_health
  question: 'In Virginia, a driver age 21 or older is legally considered to be driving
    under the influence (DUI) if their blood alcohol content (BAC) is at least:'
  choices:
    A: .02 percent
    B: .04 percent
    C: .08 percent
    D: .10 percent
  answer: C
  explanation: Legally, drivers age 21 or older are considered to be driving under
    the influence (DUI) if your blood alcohol content (BAC) is .08 percent or higher.
- id: 140
  category: alcohol_drugs_health
  question: 'If you are under age 21, you can be convicted of illegal consumption
    of alcohol if your BAC is:'
  choices:
    A: At least .02 but less than .08
    B: At least .01 but less than .05
    C: At least .05 but less than .10
    D: Exactly .00
  answer: A
  explanation: If under age 21, you can be convicted of illegal consumption of alcohol
    if your BAC is at least .02 but less than .08.
- id: 141
  category: alcohol_drugs_health
  question: Which of the following contains the same amount of alcohol as a 12-ounce
    glass of beer?
  choices:
    A: A 12-ounce glass of wine
    B: A 5-ounce glass of wine
    C: Two shots of liquor
    D: An 8-ounce glass of wine
  answer: B
  explanation: Twelve ounces of beer is the same as a shot of liquor or a five-ounce
    glass of wine.
- id: 142
  category: alcohol_drugs_health
  question: What is the only effective way to decrease intoxication?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Time
  answer: D
  explanation: Only time can decrease intoxication. Coffee, cold showers or exercise
    will not sober you up.
- id: 143
  category: safe_driving_rules
  question: Under Virginia law, when is a driver permitted to hold a cell phone while
    driving?
  choices:
    A: When using it for navigation purposes
    B: When stopped at a red traffic light
    C: Only in a driver emergency or when lawfully parked or stopped
    D: When talking on speakerphone
  answer: C
  explanation: Virginia law prohibits drivers from holding cell phones or any other
    wireless communication devices while driving except in a driver emergency or the
    vehicle is lawfully parked or stopped.
- id: 144
  category: driver_responsibility
  question: Driver distraction accounts for approximately what percentage of all traffic
    crashes in Virginia annually?
  choices:
    A: 10 percent
    B: 17 percent
    C: 25 percent
    D: 33 percent
  answer: B
  explanation: Annually, driver distraction accounts for roughly 17 percent of all
    traffic crashes in Virginia.
- id: 145
  category: alcohol_drugs_health
  question: What is the effect of combining alcohol with other drugs, such as allergy
    or cold medicine?
  choices:
    A: It neutralizes the effects of the alcohol
    B: It usually multiplies the effects of both
    C: It has no impact on your driving ability
    D: It improves your reaction time
  answer: B
  explanation: Combining alcohol with other drugs usually multiplies the effects of
    both and can have a disastrous effect on your ability to drive. Even one drink
    taken with an allergy or cold medicine can have the same effect as several alcoholic
    beverages.
- id: 146
  category: driver_responsibility
  question: If you are involved in a traffic crash, when must you move your vehicle
    from the road immediately?
  choices:
    A: Only if a law enforcement officer tells you to
    B: If the vehicles are able to be moved, no one is injured, and it is safe to
      do so
    C: You should never move your vehicle until the police arrive
    D: Only if the damage is less than $3,000
  answer: B
  explanation: Drivers must move vehicles from the road immediately if the vehicles
    are able to be moved, no one is injured and the driver is capable of safely doing
    so.
- id: 147
  category: driver_responsibility
  question: Law enforcement officers are required to forward a written crash report
    to the DMV when a traffic crash results in injury, death, or total property damage
    in excess of what amount?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $3,000
  answer: D
  explanation: Law enforcement officers must forward a written crash report to DMV
    when a traffic crash results in injury or the death of any person or total property
    damage is in excess of $3,000.
- id: 148
  category: driver_responsibility
  question: If you hit an unattended vehicle and cannot locate the owner, what must
    you do?
  choices:
    A: Leave the scene and wait for the owner to contact you
    B: Leave a note with your contact info and report the crash to the police within
      24 hours
    C: Wait at the scene until the owner returns, no matter how long it takes
    D: Report the crash to your insurance company within 48 hours and leave
  answer: B
  explanation: If you cannot locate the owner of an unattended vehicle you damaged,
    you must leave a note that can be found easily at the scene with your contact
    info and crash details, and report the crash to the police within 24 hours.
- id: 149
  category: defensive_driving
  question: If a collision with a deer or other large animal is unavoidable, what
    should you do?
  choices:
    A: Swerve sharply into the oncoming lane
    B: Accelerate to minimize the impact time
    C: Brake firmly, stay in your lane, and come to a controlled stop
    D: Swerve off the road into the ditch
  answer: C
  explanation: If a collision with a deer or other animal is unavoidable, do not swerve.
    Brake firmly, stay in your lane, and come to a controlled stop.
- id: 150
  category: safe_driving_rules
  question: If you are pulled over by a police officer at night, what is one of the
    actions you should take?
  choices:
    A: Turn off your headlights immediately
    B: Turn on your vehicle's interior lights
    C: Step out of the vehicle to greet the officer
    D: Keep your hands hidden until asked for identification
  answer: B
  explanation: During a traffic stop at night, you should turn on your vehicle's interior
    lights to help the officer see inside.
- id: 151
  category: driver_responsibility
  question: What does signing a traffic citation issued by a police officer mean?
  choices:
    A: It is an admission of guilt
    B: It is a waiver of your right to a court hearing
    C: It is not an admission of guilt, but refusal to sign may result in your arrest
    D: It means you agree to pay the fine immediately
  answer: C
  explanation: You will be asked to sign the citation. Sign the citation; this is
    not an admission of guilt. Refusal to sign the citation may result in your arrest.
- id: 152
  category: safe_driving_rules
  question: Under Virginia law, who is required to wear safety belts in a vehicle?
  choices:
    A: Only the driver and front-seat passengers
    B: Only passengers under the age of 18
    C: The driver and all passengers, both front and rear
    D: Only the driver
  answer: C
  explanation: Under Virginia law, the driver and all passengers, both front and rear,
    must wear safety belts.
- id: 153
  category: safe_driving_rules
  question: How should a pregnant woman wear her seat belt?
  choices:
    A: With the lap belt as low on the pelvis as possible
    B: With the lap belt across the middle of the stomach
    C: Without the shoulder belt
    D: Pregnant women are exempt from wearing seat belts
  answer: A
  explanation: Pregnant women are much safer if buckled up by wearing the belt as
    low on the pelvis as possible.
- id: 154
  category: penalties_and_points
  question: What is the fine for a first offense conviction of violating the child
    restraint law in Virginia?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: B
  explanation: If you are convicted of violating the child restraint law, you will
    be fined $50. A second or subsequent offense could mean a $500 penalty.
- id: 155
  category: safe_driving_rules
  question: Where is the safest place to install a child safety seat in a vehicle?
  choices:
    A: The front passenger seat
    B: The center of the back seat
    C: The driver's side back seat
    D: The passenger's side back seat
  answer: B
  explanation: The safest place to install a child safety seat is in the center of
    the back seat.
- id: 156
  category: safe_driving_rules
  question: In Virginia, it is illegal to transport children under what age in the
    bed of a pickup truck?
  choices:
    A: Age 12
    B: Age 14
    C: Age 16
    D: Age 18
  answer: C
  explanation: It is illegal to transport children under age 16 in the bed of a pickup
    truck, even if equipped with a camper shell.
- id: 157
  category: vehicle_information
  question: If your vehicle is equipped with air bags, how far should you move your
    seat back from the steering wheel?
  choices:
    A: At least 5 inches
    B: At least 10 inches
    C: At least 15 inches
    D: As far back as the seat will go
  answer: B
  explanation: If your vehicle is equipped with air bags, you should move your seat
    back so that you are at least ten inches from the steering wheel.
- id: 158
  category: vehicle_information
  question: How should you adjust your steering wheel if your vehicle is equipped
    with air bags?
  choices:
    A: Tilt it upward toward your head
    B: Tilt it downward toward your chest
    C: Pull it as close to your body as possible
    D: Lock it in the highest position
  answer: B
  explanation: If your steering wheel is adjustable, you should tilt it downward.
    This points the air bag toward your chest instead of your head and neck.
- id: 159
  category: safe_driving_rules
  question: Up to what age must all children be properly secured in a child safety
    seat or booster seat?
  choices:
    A: Under age 5
    B: Under age 6
    C: Under age 8
    D: Under age 10
  answer: C
  explanation: All children under age 8 must be properly secured in a child safety
    seat or booster seat when riding in vehicles manufactured after January 1, 1968.
- id: 160
  category: safe_driving_rules
  question: According to the manual, how long should children ride in a rear-facing
    child safety seat?
  choices:
    A: From birth to 1 year
    B: From birth to 2 years
    C: From birth to 3 years
    D: From birth to 4 years
  answer: B
  explanation: Children should ride rear facing from birth to 2 years, or as long
    as the safety seat manufacturer allows.
- id: 161
  category: safe_driving_rules
  question: When is it acceptable to place a rear-facing child seat in the front passenger
    seat?
  choices:
    A: Whenever the driver wants to keep a close eye on the child
    B: Only if the vehicle has no back seat and the passenger air bag is turned off
      or not equipped
    C: Only if the child is over 1 year old
    D: It is never acceptable under any circumstances
  answer: B
  explanation: If the vehicle does not have a back seat, a rear facing child seat
    may be placed in the front passenger seat if the vehicle is not equipped with
    a passenger side air bag or if the passenger air bag is turned off.
- id: 162
  category: penalties_and_points
  question: What is the difference between having your driver's license suspended
    and having it revoked?
  choices:
    A: Suspension is permanent, while revocation is temporary.
    B: Suspension means your privilege is withdrawn temporarily, while revocation
      means it is terminated.
    C: Suspension requires you to retake the road test, while revocation only requires
      a fee.
    D: There is no difference; both mean your license is permanently canceled.
  answer: B
  explanation: If your license is suspended, your privilege to drive has been withdrawn
    temporarily. Revocation means that your privilege to drive has been terminated.
- id: 163
  category: penalties_and_points
  question: For which of the following convictions will the court or DMV automatically
    suspend or revoke your driving privilege?
  choices:
    A: Making a false statement to DMV
    B: Driving without a valid driver's license
    C: Refusing to take a blood/breath test
    D: Reckless or aggressive driving
  answer: A
  explanation: The court or DMV WILL suspend or revoke your privilege to drive if
    you are convicted of making a false statement to DMV. The other choices are offenses
    for which the court MAY suspend or revoke your privilege.
- id: 164
  category: penalties_and_points
  question: Which of the following offenses MAY result in the court suspending or
    revoking your driving privilege, rather than it being an automatic requirement?
  choices:
    A: Eluding police
    B: Committing a felony involving a motor vehicle
    C: Reckless or aggressive driving
    D: Operating a motor vehicle while under the influence of alcohol or drugs (DUI)
  answer: C
  explanation: The manual lists 'reckless or aggressive driving' under the offenses
    where the court MAY suspend or revoke your driving privilege, unlike DUI, eluding
    police, or committing a felony with a vehicle, which WILL result in suspension
    or revocation.
- id: 165
  category: penalties_and_points
  question: If you are under age 18, what is the penalty for your second conviction
    of a demerit point traffic violation?
  choices:
    A: A 30-day suspension of your driving privilege
    B: A 90-day suspension of your driving privilege
    C: Revocation of your driving privilege for one year
    D: A warning letter from the DMV
  answer: B
  explanation: After your second conviction for a demerit point traffic violation
    committed when you were under age 18, DMV will suspend your driving privilege
    for 90 days.
- id: 166
  category: penalties_and_points
  question: What happens if a driver under age 18 receives a third conviction for
    a demerit point traffic violation?
  choices:
    A: Their driving privilege is revoked for one year or until age 18, whichever
      is longer.
    B: Their driving privilege is suspended for 90 days.
    C: They must pay a $500 fine and retake the road test.
    D: Their driving privilege is permanently revoked.
  answer: A
  explanation: For a driver under 18, a third conviction will result in a revocation
    of your driving privilege for one year or until you reach age 18, whichever is
    longer.
- id: 167
  category: penalties_and_points
  question: If you are 18 or older, the DMV will require you to complete a driver
    improvement clinic if you accumulate how many demerit points?
  choices:
    A: 10 points within 12 months
    B: 12 points within 12 months or 18 points within 24 months
    C: 15 points within 12 months
    D: 18 points within 12 months or 24 points within 24 months
  answer: B
  explanation: For drivers age 18 or older, DMV will require you to complete a driver
    improvement clinic if you accumulate 12 demerit points within 12 months or 18
    points within 24 months.
- id: 168
  category: penalties_and_points
  question: What is the penalty for an adult driver (18 or older) who accumulates
    18 demerit points within 12 months?
  choices:
    A: A 30-day suspension
    B: A 60-day suspension
    C: A 90-day suspension and required completion of a driver improvement clinic
    D: A 1-year revocation of driving privileges
  answer: C
  explanation: If you receive 18 demerit points within 12 months or 24 points within
    24 months, DMV will suspend your driving privilege for 90 days and require that
    you complete a driver improvement clinic.
- id: 169
  category: driver_responsibility
  question: 'Under the Medical Review Program, the DMV is concerned about any physical
    or mental condition that impairs a driver''s:'
  choices:
    A: Hearing, speech, and reflexes
    B: Level of consciousness, perception, judgment, or motor skills
    C: Ability to read road signs in English
    D: Cardiovascular health and respiratory rate
  answer: B
  explanation: The DMV is concerned about any condition that impairs the driver's
    level of consciousness, perception (vision), judgment, and motor skills.
- id: 170
  category: penalties_and_points
  question: When registering a motor vehicle in Virginia, what must you do if you
    do not have liability insurance coverage for the vehicle?
  choices:
    A: Pay a $500 uninsured motor vehicle fee.
    B: Surrender your driver's license.
    C: Pay a $250 penalty and take a driver improvement clinic.
    D: You cannot register a vehicle without liability insurance under any circumstances.
  answer: A
  explanation: When registering a motor vehicle, you must sign a statement that you
    have liability insurance coverage, or pay the $500 uninsured motor vehicle fee.
- id: 171
  category: license_system
  question: What must you do to reinstate your driving privilege if your license has
    been expired for one year or more during a suspension period?
  choices:
    A: Only pay the required reinstatement fees.
    B: Show proof of legal presence and pass the vision, knowledge, and road skills
      exams.
    C: Complete a driver improvement clinic and pay a $500 fee.
    D: Wait an additional 90 days before reapplying.
  answer: B
  explanation: During the suspension period, if your license has been expired for
    one year or more, you must show proof of legal presence and pass the two-part
    knowledge, road skills and vision exams to have your driving privilege reinstated.
- id: 172
  category: penalties_and_points
  question: 'DMV will suspend your driving privilege if you are late making child
    support payments by:'
  choices:
    A: 30 days or $1,000
    B: 60 days or $2,500
    C: 90 days or $5,000
    D: 120 days or $10,000
  answer: C
  explanation: The Division of Child Support Enforcement will direct DMV to suspend
    your driving privilege if you are late making child support payments by 90 days
    or $5,000.
- id: 173
  category: alcohol_drugs_health
  question: 'Under Virginia''s implied consent laws, operating a motor vehicle on
    public roads means you agree to:'
  choices:
    A: Allow law enforcement to search your vehicle at any time
    B: Take a breath test upon request
    C: Pay restitution for any crash you cause
    D: Carry an international driver's license
  answer: B
  explanation: Under implied consent laws, if you operate a motor vehicle on Virginia's
    public roads, you agree to take a breath test upon request.
- id: 174
  category: penalties_and_points
  question: 'If you are charged with a first offense of driving under the influence
    and your BAC is .08 percent or higher, your driving privilege will be automatically
    suspended for:'
  choices:
    A: 7 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: A
  explanation: If your BAC is .08 percent or higher while you are driving and law
    enforcement charges you with driving while under the influence... your driving
    privilege will be automatically suspended for seven days, for a first offense.
- id: 175
  category: alcohol_drugs_health
  question: 'To be charged with drinking while operating a motor vehicle due to an
    open container, the container must be located in the passenger area, which includes:'
  choices:
    A: The trunk of the vehicle
    B: A locked glove compartment
    C: An unlocked glove compartment
    D: The bed of a pickup truck
  answer: C
  explanation: The passenger area means the area that seats the driver and passengers
    and any area within the driver's reach, including an unlocked glove compartment.
- id: 176
  category: penalties_and_points
  question: 'A conviction of a DUI offense involving a juvenile passenger (age 17
    or younger) carries an additional mandatory jail term of:'
  choices:
    A: 48 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: B
  explanation: Conviction of any DUI offense involving a juvenile passenger (age 17
    or younger) in the vehicle at the time of the offense carries an additional mandatory
    five-day jail term plus all other fines and jail sentences.
- id: 177
  category: penalties_and_points
  question: 'If you are caught driving after your license has been suspended for an
    alcohol-related offense, your vehicle will be immediately impounded for:'
  choices:
    A: 3 days
    B: 7 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: Your vehicle will be impounded immediately for 30 days if you are caught
    driving after your license has been suspended for an alcohol-related offense.
- id: 178
  category: driver_responsibility
  question: You may be responsible for paying up to what amount for emergency personnel
    responding to a crash resulting from your DUI violation?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: You may be responsible for paying the cost (up to $1,000) for law enforcement,
    emergency medical services, fire fighters and rescue personnel who respond to
    a crash or incident resulting from your DUI violation.
- id: 179
  category: alcohol_drugs_health
  question: 'If you are under age 21 and convicted of driving with a BAC of at least
    .02 percent but less than .08 percent, your driving privilege will be suspended
    for:'
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until you turn 21
  answer: B
  explanation: If you are convicted of driving after illegally consuming alcohol,
    and your BAC was at least .02 percent and less than .08 percent, the court penalty
    will include a suspension of your driving privilege for one year from the date
    of conviction.
- id: 180
  category: penalties_and_points
  question: 'If you are under age 21 and use a fake ID to attempt to purchase alcohol,
    you face a mandatory suspension of your driver''s license for:'
  choices:
    A: At least 30 days
    B: At least 90 days
    C: At least six months but not more than one year
    D: Exactly two years
  answer: C
  explanation: If you are under age 21 and you use or attempt to use a fake ID...
    you will face mandatory suspension of your driver's license for at least six months
    but not more than one year.
- id: 181
  category: license_system
  question: 'When driving with a learner''s permit, the licensed driver in the front
    passenger seat must be at least 21 years old, UNLESS they are your legal guardian
    or sibling, in which case they can be:'
  choices:
    A: 16, 17, or 18 years old
    B: 18, 19, or 20 years old
    C: Any age as long as they have a license
    D: 25 years old
  answer: B
  explanation: The licensed driver with you may be age 18, 19, or 20 if he or she
    is your legal guardian, brother, sister, half-brother, half-sister, step brother
    or stepsister.
- id: 182
  category: license_system
  question: If you are age 19 or older, how long must you hold a learner's permit
    before applying for a driver's license (if you do not present a driver's education
    certificate)?
  choices:
    A: 30 days
    B: 60 days
    C: 9 months
    D: 1 year
  answer: B
  explanation: If you are age 19 or older, you must hold a learner's permit for 60
    days, or present a driver's education certificate of completion to apply for a
    driver's license.
- id: 183
  category: license_system
  question: 'A standard driver''s license allows you to operate any vehicle or small
    truck that is exempt from CDL requirements and weighs less than:'
  choices:
    A: 10,000 pounds
    B: 16,000 pounds
    C: 26,001 pounds
    D: 32,000 pounds
  answer: C
  explanation: A driver's license allows you to operate any vehicle or small truck
    less than 26,001 pounds that is exempt from commercial driver's license (CDL)
    requirements.
- id: 184
  category: license_system
  question: 'To operate a school bus designed to carry 15 occupants (including the
    driver), you must:'
  choices:
    A: Obtain a full Commercial Driver's License (CDL)
    B: Take the commercial driver and school bus tests for an endorsement
    C: Be at least 25 years old
    D: Have an international driver's license
  answer: B
  explanation: If you wish to operate a school bus designed to carry 15 occupants
    (including the driver), you do not need to obtain a commercial driver's license.
    However, you will need to take the commercial driver and school bus tests to obtain
    the school bus endorsement on your driver's license.
- id: 185
  category: license_system
  question: Which of the following is true regarding an international driver's license?
  choices:
    A: It is a valid driver's license that allows you to drive anywhere in the U.S.
    B: It replaces your state-issued driver's license
    C: It is only a foreign translation of your existing valid driver's license
    D: It can be legally purchased from private sector businesses
  answer: C
  explanation: An international driver's license is not a valid driver's license and
    does not allow you to drive. It is only a foreign translation of your existing
    valid driver's license to be used when you are traveling outside of the U.S.
- id: 186
  category: license_system
  question: What is the legal status of international driver's licenses marketed by
    private sector businesses in Virginia?
  choices:
    A: They are valid for up to 60 days after arriving in the U.S.
    B: They are required if you are visiting from a foreign country.
    C: They are not valid and do not allow you to legally operate a motor vehicle.
    D: They are valid only if accompanied by a valid passport.
  answer: C
  explanation: According to the manual, international driver's licenses marketed by
    private sector businesses are not valid and do not allow you to legally operate
    a motor vehicle.
- id: 187
  category: license_system
  question: How will you receive your new Virginia driver's license?
  choices:
    A: It will be printed immediately at the DMV customer service center.
    B: It will be mailed to you.
    C: You must pick it up at a local police station.
    D: It will be emailed to you as a temporary digital copy.
  answer: B
  explanation: The manual states that you will receive your new driver's license in
    the mail, as the DMV does not issue licenses in customer service centers for security
    reasons.
- id: 188
  category: driver_responsibility
  question: If you move, how many days do you have to notify the DMV of your address
    change?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: If you move, you are required to notify the DMV within 30 days. The
    postal service will not forward your license to another address.
- id: 189
  category: license_system
  question: If you are a new Virginia resident and drive, within how many days must
    you obtain a Virginia driver's license?
  choices:
    A: 30 days
    B: 45 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: If you are a new Virginia resident and drive, you must obtain a Virginia
    driver's license within 60 days of moving there.
- id: 190
  category: vehicle_information
  question: Within how many days of moving to Virginia must you title and register
    your vehicle and obtain Virginia license plates?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: You must title and register your vehicle and obtain Virginia license
    plates within 30 days of moving to Virginia.
- id: 191
  category: vehicle_information
  question: Where must license plates be displayed on a vehicle registered in Virginia?
  choices:
    A: Only on the rear of the vehicle.
    B: Only on the front of the vehicle.
    C: On the front and rear of the vehicle.
    D: On the rear and inside the front windshield.
  answer: C
  explanation: The manual specifies that license plates must be displayed on the front
    and rear of the vehicle.
- id: 192
  category: vehicle_information
  question: When using the penny test to check tire tread, what indicates that you
    are driving with a safe amount of tread?
  choices:
    A: You can see all of Abraham Lincoln's head.
    B: Any part of Lincoln's head is covered by the tread.
    C: The penny falls out of the groove.
    D: The tread is completely flat against the penny.
  answer: B
  explanation: During the penny test, if any part of Lincoln's head is covered by
    the tread, you're driving with the safe amount of tread.
- id: 193
  category: vehicle_information
  question: Where can you find the recommended PSI (pounds per square inch) for your
    vehicle's tires?
  choices:
    A: On the vehicle's license plate.
    B: In the vehicle owner's manual or the driver's side door jamb.
    C: On the steering wheel.
    D: Printed on the vehicle's registration card.
  answer: B
  explanation: The recommended PSI is located in the vehicle owner's manual or the
    driver's side door jamb of the vehicle.
- id: 194
  category: driver_responsibility
  question: What does paying the $500 uninsured motor vehicle fee provide?
  choices:
    A: Minimum liability insurance coverage for one year.
    B: Full coverage insurance for one year.
    C: It allows you to register and operate the vehicle in Virginia for one year
      without insurance coverage.
    D: It covers property damage but not bodily injury.
  answer: C
  explanation: Paying the uninsured motor vehicle fee does not provide insurance coverage,
    but it allows you to register and operate the vehicle in Virginia for a one-year
    period.
- id: 195
  category: driver_responsibility
  question: What must you do before you cancel your vehicle's insurance policy in
    Virginia?
  choices:
    A: Pay a $500 cancellation fee.
    B: Return the license plates to the DMV and cancel the registration.
    C: Notify your local police department.
    D: Obtain a signature from a DMV representative.
  answer: B
  explanation: Before you cancel your insurance, you must return the license plates
    to DMV and cancel the registration.
- id: 196
  category: penalties_and_points
  question: If you are caught driving without insurance and did not pay the uninsured
    motor vehicle fee, what is one of the requirements to regain your driving privileges?
  choices:
    A: Pay a $600 noncompliance fee.
    B: Pay a $500 uninsured motor vehicle fee.
    C: Serve 30 days in jail.
    D: Surrender your vehicle to the state.
  answer: A
  explanation: If caught driving without insurance and you didn't pay the fee, DMV
    will suspend your driving privilege until you pay a $600 noncompliance fee (or
    get approved for a payment plan) and file a certificate of insurance for three
    years.
- id: 197
  category: driver_responsibility
  question: If you are under age 18 and check 'yes' to become an organ donor on your
    application, who makes the final decision regarding donation?
  choices:
    A: The DMV commissioner.
    B: Your parents and guardians.
    C: The hospital staff.
    D: You make the final decision regardless of age.
  answer: B
  explanation: If you are under age 18, you can indicate your wishes to donate by
    checking yes; however, by law, your parents and guardians must make the final
    decision.
- id: 198
  category: safe_driving_rules
  question: If you are driving on an icy or slippery road and have to stop, what should
    you do?
  choices:
    A: Press the brakes firmly.
    B: Apply the brakes gently.
    C: Keep your foot off the brake and let compression stop you.
    D: Pump the brakes as fast as possible.
  answer: B
  explanation: According to the sample knowledge exam in the manual, if you are driving
    on an icy or slippery road and have to stop, you should apply brakes gently.
- id: 199
  category: safe_driving_rules
  question: What is the correct hand signal for stopping?
  choices:
    A: Left hand and arm pointing straight out.
    B: Left hand and arm pointing upward.
    C: Right hand and arm pointing downward.
    D: Left hand and arm pointing downward.
  answer: D
  explanation: The sample knowledge exam states that the correct hand signal for stopping
    is the left hand and arm pointing downward.
- id: 200
  category: driver_responsibility
  question: If you are involved in a crash, what are your required actions?
  choices:
    A: Take the person to the nearest hospital immediately.
    B: Continue home and file a crash report online.
    C: Stop, help any injured, report the crash to the police, exchange information,
      and notify your insurance company.
    D: Check your car for damages and leave if it is drivable.
  answer: C
  explanation: The sample knowledge exam indicates that if you are involved in a crash,
    you must stop, help any injured, report the crash to the police, exchange information
    and notify your insurance company.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 201
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 202
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 203
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 204
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 205
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 206
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 207
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 208
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 209
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 210
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 211
- id: 212
  category: alcohol_drugs_health
  question: According to the driver's manual, how many people died in alcohol-related
    crashes in Virginia in 2024?
  choices:
    A: '100'
    B: '318'
    C: '410'
    D: '50'
  answer: B
  explanation: The introductory letter states that in 2024, 318 people died in alcohol-related
    crashes in Virginia.
- id: 213
  category: safe_driving_rules
  question: According to the manual's Table of Contents, in which section would you
    find information about the danger of 'Over-correcting'?
  choices:
    A: Section 1 – Testing
    B: Section 2 – Signals, Signs and Pavement Markings
    C: Section 3 – Safe Driving
    D: Section 4 – Seat Belts, Airbags, and Child Safety Seats
  answer: C
  explanation: The Table of Contents lists 'Over-correcting' on page 18, which falls
    under Section 3 – Safe Driving.
- id: 214
  category: driver_responsibility
  question: Who is identified in the introductory letter as the DMV Commissioner who
    authored the message to new drivers?
  choices:
    A: The Governor of Virginia
    B: The Secretary of Transportation
    C: Gerald F. Lackey, Ph.D.
    D: The Chief of the Virginia State Police
  answer: C
  explanation: The introductory letter to new drivers is signed by 'Gerald F. Lackey,
    Ph.D. DMV Commissioner.'
- id: 215
  category: safe_driving_rules
  question: The introductory letter notes that men are disproportionately killed in
    crashes. Which of the following is NOT listed as a common deadly driving habit
    for this group in the manual's introduction?
  choices:
    A: Driving too fast
    B: Driving under the influence
    C: Failing to yield the right-of-way
    D: Not wearing seat belts
  answer: C
  explanation: The manual's introduction states, 'Men are driving too fast, they’re
    driving under the influence, they’re driving distracted and they’re not wearing
    their seat belts.' Failing to yield is not specifically mentioned in this list.
- id: 216
  category: driver_responsibility
  question: According to the introductory letter, what is the stated goal of the Virginia
    DMV Highway Safety Office?
  choices:
    A: To issue driver's licenses and vehicle titles.
    B: To use data to understand deadly driving habits and keep drivers safe.
    C: To collect traffic fines and manage the demerit point system.
    D: To design and maintain Virginia's highway system.
  answer: B
  explanation: The introduction states, 'At the Virginia DMV Highway Safety Office,
    we study data to understand the driving habits that are most likely to kill Virginians.
    Our goal is to use this information to keep you safe.'
- id: 217
  category: safe_driving_rules
  question: In the Virginia Driver's Manual, information on driving in fog, rain,
    and snow is grouped under which main heading in the Table of Contents?
  choices:
    A: Dangerous driving behaviors
    B: Visibility
    C: Hazardous conditions
    D: Sharing the road
  answer: C
  explanation: The Table of Contents shows that Fog, Rain, and Snow are sub-topics
    under the main heading 'Hazardous conditions' on page 23.
- id: 218
  category: driver_responsibility
  question: The introductory letter concludes by emphasizing a core principle for
    all road users. What is this principle?
  choices:
    A: The driver is always right.
    B: Speed limits are only suggestions.
    C: Safety is everyone’s responsibility.
    D: Passing is always permitted on the left.
  answer: C
  explanation: The letter concludes with the statement, 'Safety is everyone’s responsibility
    and, as a new driver, it’s now yours too.'
- id: 219
  category: vehicle_information
  question: According to the Table of Contents, which section of the driver's manual
    is dedicated entirely to occupant protection systems like seat belts and air bags?
  choices:
    A: Section 1
    B: Section 2
    C: Section 3
    D: Section 4
  answer: D
  explanation: The Table of Contents clearly shows that Section 4 is titled 'Seat
    Belts, Airbags, and Child Safety Seats.'
- id: 220
  category: alcohol_drugs_health
  question: According to the introductory letter in the driver's manual, what percentage
    of drunk driving crashes are considered preventable?
  choices:
    A: 50%
    B: 75%
    C: 90%
    D: 100%
  answer: D
  explanation: The manual states, 'Drunk driving crashes are 100% preventable...'
- id: 221
  category: signs_and_signals
  question: In the driver's manual, traffic signs are broken down into sub-categories.
    Under which section would you find these categories, such as 'Regulatory signs'
    and 'Warning signs'?
  choices:
    A: Section 1 – Testing
    B: Section 2 – Signals, Signs and Pavement Markings
    C: Section 3 – Safe Driving
    D: Section 4 – Seat Belts, Airbags, and Child Safety Seats
  answer: B
  explanation: The Table of Contents shows that 'Regulatory signs' and 'Warning signs'
    are sub-topics within Section 2 – Signals, Signs and Pavement Markings.
- id: 222
  category: safe_driving_rules
  question: The manual's introduction highlights several deadly driving habits. Which
    of the following is one of the specific habits mentioned as a key to protecting
    your life?
  choices:
    A: Avoiding highways during rush hour
    B: Planning ahead for a sober ride home
    C: Only driving during daylight hours
    D: Using a GPS for all trips
  answer: B
  explanation: The introduction lists five key ways to protect your life, including
    'Plan ahead for a sober ride home if you’re going out drinking.'
- id: 223
  category: driver_responsibility
  question: According to the Table of Contents, information on what to do after 'Traffic
    crashes' and how to handle 'Deer/large animal hazards' can be found in which section?
  choices:
    A: Section 1 – Testing
    B: Section 2 – Pavement Markings
    C: Section 3 – Safe Driving
    D: Section 4 – Child Safety Seats
  answer: C
  explanation: The Table of Contents lists both 'Traffic crashes' and 'Deer/large
    animal hazards' on page 25, under Section 3 – Safe Driving.
- id: 224
  category: driver_testing
  question: According to the Table of Contents, Section 1 of the manual covers Testing.
    Which of the following is NOT listed as one of the three main testing components
    in this section?
  choices:
    A: Two-part knowledge exam
    B: Road skills test
    C: Vision screening
    D: Drug screening
  answer: D
  explanation: The Table of Contents for Section 1 lists 'Two-part knowledge exam,'
    'Road skills test,' and 'Vision screening.' It does not list drug screening.
- id: 225
  category: driver_responsibility
  question: The introductory letter from the DMV Commissioner states that the 'most
    important part' of the driver's manual is about what topic?
  choices:
    A: The specific point values for traffic violations
    B: The actions you must take to protect your life while driving
    C: The different shapes and colors of traffic signs
    D: The process for renewing your license online
  answer: B
  explanation: The introduction states, '...what you’re about to read in the next
    few paragraphs is the most important part of this driver’s manual – the actions
    you must take to protect your life while driving.'
- id: 227
  category: driver_testing
  question: According to the manual, you are exempt from taking the two-part knowledge
    exam if you hold a valid driver's license from which of the following countries?
  choices:
    A: The United Kingdom
    B: Mexico
    C: Germany
    D: Australia
  answer: C
  explanation: The manual states that you do not need to take the knowledge exam if
    you hold a valid driver's license from another U.S. state, Canada, Germany, France,
    or the Republic of Korea.
- id: 228
  category: driver_testing
  question: In addition to several other countries, Virginia exempts drivers with
    a valid license from which of the following countries from the road skills test?
  choices:
    A: Taiwan
    B: Japan
    C: Spain
    D: Italy
  answer: A
  explanation: The manual specifies that you will need to take the road skills test
    if you do not hold a valid driver’s license from another U.S. state, Canada, Germany,
    France, the Republic of Korea, or Taiwan.
- id: 229
  category: driver_testing
  question: Which of the following is true regarding language options for the Virginia
    knowledge exam?
  choices:
    A: You must bring your own certified translator for any non-English language.
    B: The exam is only offered in English and Spanish.
    C: Translators are not permitted for tests in languages that are already offered
      by the DMV.
    D: American Sign Language is not an available option for the exam.
  answer: C
  explanation: The manual states that the exam is offered in many different languages
    and American Sign Language, and therefore, 'translators may not be used for tests
    in offered languages.'
- id: 230
  category: driver_testing
  question: If you fail the knowledge exam three times and must complete the 8-hour
    course based on the Virginia Driver's Manual, what is the rule regarding the course
    completion date?
  choices:
    A: The course must be completed within 30 days of the third failure.
    B: The course completion date must be after the date of the third failure.
    C: You must enroll in the course before your third attempt.
    D: The course can be completed at any time, before or after the third failure.
  answer: B
  explanation: The manual specifies for both age groups that 'The completion date
    of the driver’s manual course must be after the date that you failed the knowledge
    exam the third time.'
- id: 231
  category: driver_testing
  question: Which of the following actions is explicitly prohibited while taking the
    Virginia knowledge exam?
  choices:
    A: Asking the DMV staff for clarification on a question's wording.
    B: Getting help while taking the exam.
    C: Requesting an audio version of the test.
    D: Taking the exam once per business day.
  answer: B
  explanation: The manual lists several prohibited actions, including 'get help while
    taking the exam'.
- id: 232
  category: driver_testing
  question: When providing a vehicle for the road skills test, which of the following
    is a specific requirement mentioned in the manual?
  choices:
    A: The vehicle must be less than 10 years old.
    B: The vehicle must have a working speedometer.
    C: The vehicle must have a GPS navigation system.
    D: The vehicle must be a four-door sedan.
  answer: B
  explanation: The manual states the vehicle must have 'working brakes, safety belts,
    horn, lights, turn signals, mirrors and speedometer.'
- id: 233
  category: driver_testing
  question: What is the purpose of the DMV form CSMA 19, the behind-the-wheel checklist?
  choices:
    A: It serves as a temporary learner's permit.
    B: It is a medical certification form required for all drivers.
    C: A licensed driver uses it to certify that an applicant has practiced specific
      driving tasks.
    D: It is an application to take the driver education course online.
  answer: C
  explanation: The manual describes the CSMA 19 as a checklist where 'A licensed driver
    will need to certify on the form that he/she has been with you while you practiced
    the driving tasks.'
- id: 234
  category: driver_testing
  question: For driver's license applicants under the age of 18, where is the road
    skills test typically administered?
  choices:
    A: At any DMV customer service center.
    B: Only at a designated DMV testing facility.
    C: As part of their public, private, or commercial driver education course.
    D: By a law enforcement officer.
  answer: C
  explanation: The manual states, 'For applicants under 18, the road skills test will
    be given as part of the driver education course taken at a public, private or
    commercial driving school.'
- id: 235
  category: driver_testing
  question: If a driver's license applicant younger than 18 fails the knowledge exam
    three times, what must they do before taking the 8-hour driver's manual course?
  choices:
    A: Wait a period of 90 days.
    B: Obtain a new learner's permit.
    C: Present their certificate of completion for the classroom component of driver
      education.
    D: Complete 20 hours of supervised driving practice.
  answer: C
  explanation: The manual states that before taking the course, customers younger
    than 18 must 'present your certificate of completion for the classroom component
    of driver education to the driver training school that will be conducting the
    driver’s manual course.'
- id: 236
  category: driver_testing
  question: The Virginia Driver's Manual states that when testing, you cannot give
    another person exam questions or answers. What is another explicitly forbidden
    action?
  choices:
    A: Wearing headphones to block out noise.
    B: Bringing a bottle of water into the testing area.
    C: Trying to get test questions or answers before the exam.
    D: Asking to retake the test on a different day if you fail.
  answer: C
  explanation: The manual explicitly states that when testing, you cannot 'try to
    get test questions or answers before the exam'.
- id: 237
  category: driver_testing
  question: To be eligible to take the road skills test at a DMV, the examiner will
    require you to either present a driver's education certificate of completion or
    what alternative?
  choices:
    A: Pay an additional testing fee.
    B: Provide a written recommendation from a licensed driver.
    C: Complete a behind-the-wheel checklist (form CSMA 19).
    D: Pass a pre-test vehicle inspection performed by a certified mechanic.
  answer: C
  explanation: The manual states that to take the road skills test, the DMV examiner
    requires you to either 'present an acceptable driver’s education certificate of
    completion, or complete a behind-the-wheel checklist (DMV form CSMA 19).'
- id: 238
  category: driver_testing
  question: The two-part knowledge exam tests your knowledge of traffic signs, motor
    vehicle laws, and safe driving. From where are the exam questions taken?
  choices:
    A: The Virginia state vehicle code.
    B: Federal transportation guidelines.
    C: Information in the Virginia Driver's Manual.
    D: A national standardized test question bank.
  answer: C
  explanation: The manual specifies, 'Exam questions are taken from information in
    this manual.'
- id: 239
  category: driver_testing
  question: When a licensed driver certifies the behind-the-wheel checklist (CSMA
    19), what are they confirming in addition to observing the applicant's practice?
  choices:
    A: That the applicant's vehicle is safe for the road.
    B: That the applicant has passed a professional driving course.
    C: That the applicant has insurance.
    D: That the applicant has complied with all learner’s permit requirements.
  answer: D
  explanation: The manual states a licensed driver certifies 'that he/she has been
    with you while you practiced the driving tasks and that you have complied with
    all requirements for learner’s permit holders while operating a motor vehicle.'
- id: 240
  category: driver_testing
  question: For home-schooled applicants seeking information about taking the road
    skills test, what specific document does the manual recommend they refer to?
  choices:
    A: The DMV form CSMA 19.
    B: The Home-Schooled In-Car Driver Education Information Sheet (HS 3).
    C: The Virginia Driver's Manual, Section 8.
    D: The public school system's driver education curriculum.
  answer: B
  explanation: The manual states, 'If you are home schooled, refer to the Home-Schooled
    In-Car Driver Education Information Sheet (HS 3) for more information about taking
    the road skills test.'
- id: 241
  category: driver_testing
  question: For an applicant age 18 or older who has not completed a driver's education
    course, what is the requirement before they can take the road skills test for
    the first time?
  choices:
    A: They must hold a learner's permit for 30 days.
    B: They must hold a learner's permit for 60 days.
    C: They must pass the vision screening twice.
    D: They must complete an online safety course.
  answer: B
  explanation: Applicants age 18 or older must hold the learner’s permit for 60 days
    prior to the first road skills test or complete a course of driver’s education.
- id: 242
  category: driver_testing
  question: According to the manual, how frequently may an applicant take the road
    skills test?
  choices:
    A: Twice per business day.
    B: Once per week.
    C: Only once per business day.
    D: As many times as they can schedule it.
  answer: C
  explanation: The manual states, 'The test may be taken only once per business day.'
- id: 243
  category: license_system
  question: What is the minimum horizontal vision required for a license restricted
    to daylight hours only?
  choices:
    A: 40 degrees or better
    B: 70 degrees or better
    C: 100 degrees or better
    D: 110 degrees or better
  answer: B
  explanation: To qualify for a license restricted to daylight hours only, you must
    have 70 degrees, or better, horizontal vision.
- id: 244
  category: signs_and_signals
  question: Under Virginia law, what is the only situation in which you may legally
    make a turn at a red arrow light?
  choices:
    A: After coming to a complete stop, if the way is clear.
    B: If you are turning from a one-way street onto another one-way street.
    C: If a sign is posted at the intersection specifically allowing the turn after
      a stop.
    D: During daylight hours only.
  answer: C
  explanation: You may not proceed in the direction of a red arrow unless a sign is
    posted at the intersection that reads 'Right on Red Arrow After Stop' or 'Left
    on Red Arrow After Stop.'
- id: 245
  category: signs_and_signals
  question: What is the correct procedure when you approach an intersection with a
    flashing red arrow?
  choices:
    A: Slow down and proceed with caution without stopping.
    B: Stop completely, yield to traffic and pedestrians, then proceed when clear.
    C: Stop and wait for the light to turn green.
    D: Treat it as a yield sign and only stop if necessary.
  answer: B
  explanation: The manual states that at a flashing red arrow, you must come to a
    complete stop, yield the right-of-way to vehicles and pedestrians, and proceed
    in the direction of the arrow when the way is clear.
- id: 246
  category: signs_and_signals
  question: What must a driver do when encountering a flashing red light at a railroad
    crossing?
  choices:
    A: Slow down and look for a train before crossing.
    B: Stop only if a train is visibly approaching.
    C: Come to a complete stop, even if you don't see a train.
    D: Proceed with caution if the crossing gates are up.
  answer: C
  explanation: At a railroad crossing with a flashing red light, you must come to
    a complete stop even if you don’t see a train.
- id: 247
  category: license_system
  question: If you have laser surgery to correct your vision and want to remove the
    'C' restriction from your license, what must you do?
  choices:
    A: Mail a letter from your doctor to the DMV headquarters.
    B: Simply stop wearing your glasses while driving.
    C: Wait for your license to expire and renew it in person.
    D: Visit a DMV center and pass the vision screening without lenses or submit a
      Vision Screening Report (MED 4).
  answer: D
  explanation: To have the 'C' restriction removed after laser surgery, you must visit
    a DMV customer service center and pass the vision screening without wearing glasses
    or contact lenses or submit a Vision Screening Report (MED 4).
- id: 248
  category: license_system
  question: What is the minimum horizontal vision standard for an unrestricted Virginia
    driver's license?
  choices:
    A: 70 degrees in one or both eyes.
    B: 90 degrees in one or both eyes.
    C: 110 degrees in one or both eyes.
    D: 140 degrees in one or both eyes.
  answer: C
  explanation: The vision standards for an unrestricted driver's license are 20/40
    or better vision and 110 degrees, or better, horizontal vision in one or both
    eyes.
- id: 249
  category: sharing_the_road
  question: When preparing to make a legal turn on a red light, what must you do immediately
    after coming to a complete stop?
  choices:
    A: Honk your horn to alert pedestrians.
    B: Turn on your hazard lights.
    C: Inch forward into the crosswalk to get a better view.
    D: Look both ways and yield the right-of-way to pedestrians and traffic.
  answer: D
  explanation: Before turning on red, you must come to a complete stop, then 'Look
    both ways and yield the right-of-way to pedestrians and other traffic. Be sure
    to check for less visible vehicles such as motorcycles, bicycles and mopeds.'
- id: 250
  category: driver_testing
  question: If an applicant fails the road skills test at the DMV, what is the minimum
    waiting period before they are allowed to take it again?
  choices:
    A: 24 hours
    B: Two days
    C: One week
    D: There is no waiting period.
  answer: B
  explanation: The manual states, 'If you fail the road skills test, you must wait
    two days to take it again.'
- id: 251
  category: license_system
  question: For a driver with vision in only one eye to qualify for a daylight-only
    restricted license, what are the specific horizontal vision requirements?
  choices:
    A: At least 70 degrees toward the nose and 70 degrees toward the temple.
    B: At least 40 degrees toward the nose and 30 degrees toward the temple.
    C: At least 30 degrees toward the nose and 40 degrees toward the temple.
    D: A total horizontal vision of at least 90 degrees.
  answer: C
  explanation: For a person with vision in only one eye to get a daylight-only license,
    they must have horizontal vision of at least 30 degrees or better when looking
    toward their nose and 40 degrees or better when looking toward their temple.
- id: 252
  category: driver_responsibility
  question: According to the manual, what should a driver who wears bioptic telescopic
    lenses do to obtain specific licensing information?
  choices:
    A: Schedule a special appointment with a DMV supervisor.
    B: Read the DMV publication MED 44 or call the DMV.
    C: Enroll in a specialized driver education course.
    D: Submit a standard driver's license application with a doctor's note.
  answer: B
  explanation: 'The manual advises: ''If you wear bioptic telescopic lenses, read
    the DMV publication Driver’s Licensing Information for Bioptic Telescopic Lense
    Wearers (MED 44) available at dmv.virginia.gov or contact DMV at (804) 497-7100.'''
- id: 253
  category: safe_driving_rules
  question: In addition to obeying traffic signals, signs, and markings, what specific
    action is mentioned as being illegal for avoiding traffic controls?
  choices:
    A: Making a U-turn at an intersection.
    B: Driving slower than the posted speed limit.
    C: Cutting through a parking lot or field.
    D: Changing lanes within 100 feet of an intersection.
  answer: C
  explanation: The manual explicitly states, 'It is illegal to avoid these traffic
    controls by cutting through a parking lot or field.'
- id: 254
  category: safe_driving_rules
  question: When turning at an intersection with a solid green light but no specific
    green turn arrow, what must you do?
  choices:
    A: You have the right-of-way over oncoming traffic.
    B: Yield the right-of-way to oncoming vehicles and pedestrians.
    C: Stop completely before entering the intersection to turn.
    D: Turn quickly before the light changes.
  answer: B
  explanation: The manual states, 'If you are turning without a green arrow, you must
    yield the right-of-way to vehicles coming from the other direction and pedestrians
    in the intersection.'
- id: 255
  category: signs_and_signals
  question: What does a lane use signal displaying a solid Red X indicate?
  choices:
    A: The lane is about to close, so move out safely.
    B: The lane is for emergency vehicles only.
    C: You are never permitted to drive in this lane.
    D: The lane is open for travel in your direction.
  answer: C
  explanation: 'The manual clearly states: ''Red X: Never drive in a lane marked with
    a red X signal.'''
- id: 256
  category: signs_and_signals
  question: In the sequence of a Pedestrian Hybrid Beacon (PHB), what happens immediately
    after the initial single flashing yellow light?
  choices:
    A: The light turns solid yellow.
    B: Two solid red lights appear.
    C: A green arrow appears, permitting you to go.
    D: The beacon turns off completely.
  answer: A
  explanation: 'The manual describes the sequence: ''One yellow light at the bottom
    flashes when a pedestrian activates the PHB. Next, the yellow light turns solid
    to alert drivers to prepare to stop.'''
- id: 257
  category: signs_and_signals
  question: According to the manual, what message is conveyed by signs that use the
    color red combined with white?
  choices:
    A: Warning of upcoming hazards like a curve.
    B: Motorist services information.
    C: The concepts of stop, yield, do not, and no.
    D: Destination and distance information.
  answer: C
  explanation: The manual states, 'Red used with white conveys stop, yield, do not,
    and no. Stop signs, yield signs, do not enter or wrong way signs... are examples.'
- id: 258
  category: signs_and_signals
  question: What type of information is typically displayed on signs that are black
    and white?
  choices:
    A: Historical or cultural interests.
    B: Regulatory information, such as speed limits and passing rules.
    C: Warnings about school zones or pedestrian crossings.
    D: Guidance for construction zones.
  answer: B
  explanation: The manual specifies, 'Black used with white conveys regulatory information.
    Speed limit, do not pass, no turns are examples where the operation is regulated
    by law...'
- id: 259
  category: signs_and_signals
  question: A specialized class of warning signs uses a strong yellow/green color
    with black to advise of what?
  choices:
    A: Incident management areas ahead.
    B: Upcoming rest areas and gas stations.
    C: School zones, pedestrian, and/or bicyclist activities.
    D: Low overhead clearances.
  answer: C
  explanation: The manual states, 'A specialized class of warning signs uses a strong
    yellow/green color with black to advise of school zone, pedestrian and/or bicyclist
    activities.'
- id: 260
  category: safe_driving_rules
  question: If you realize you have accidentally driven past a 'Do Not Enter' or 'Wrong
    Way' sign, what is the correct procedure?
  choices:
    A: Continue driving until you find the next exit.
    B: Stop and reverse back past the sign.
    C: Honk your horn continuously to warn other drivers.
    D: Immediately slow down, pull over, and cautiously turn around.
  answer: D
  explanation: 'The manual instructs: ''If you drive past these signs... Immediately
    slow down, pull over, and cautiously turn around.'''
- id: 261
  category: safe_driving_rules
  question: What does a 'Left Turn Yield on Green' sign indicate?
  choices:
    A: Left-turning traffic has the right-of-way over oncoming cars.
    B: Oncoming traffic must stop and yield to you.
    C: Traffic turning left does not have the right-of-way and must yield to oncoming
      traffic.
    D: All traffic at the intersection must stop before proceeding.
  answer: C
  explanation: The manual states this sign 'tells you that the traffic turning left
    at a green light does not have the right-of-way and must yield to traffic coming
    from the other direction.'
- id: 262
  category: signs_and_signals
  question: What is the primary purpose of Lane Use Control signs?
  choices:
    A: To indicate the maximum legal speed for a particular lane.
    B: To reserve lanes for buses and high occupancy vehicles.
    C: To show where turns are required or permitted from specific lanes.
    D: To warn of construction ahead in a specific lane.
  answer: C
  explanation: 'The manual says, ''Lane Use Control: These signs are used where turns
    are required or where special turning movements are permitted for specific lanes.'''
- id: 263
  category: safe_driving_rules
  question: Parking spaces marked with a disabled parking sign are reserved for whom?
  choices:
    A: Anyone for up to 15 minutes if they have their hazard lights on.
    B: Only people who have been issued disabled parking permits.
    C: Any driver over the age of 70, regardless of permit status.
    D: Commercial vehicles making deliveries during business hours.
  answer: B
  explanation: 'The manual is clear: ''Disabled Parking: Parking spaces marked with
    these signs are reserved for people with disabled parking permits.'''
- id: 264
  category: signs_and_signals
  question: On a regulatory sign, what does a red circle with a slash through a symbol
    universally mean?
  choices:
    A: The action shown by the symbol is recommended.
    B: Caution is advised for the action shown by the symbol.
    C: The action shown by the symbol is prohibited.
    D: The action shown by the symbol is only allowed at certain times.
  answer: C
  explanation: The manual states, 'Remember that a red circle with a slash means NO
    — the symbol inside the circle tells you what is prohibited.'
- id: 265
  category: signs_and_signals
  question: What is the rule for a lane marked with a one-way or two-way left-turn
    arrow lane use signal?
  choices:
    A: You may drive straight through in this lane if no one is turning.
    B: You are only permitted to enter this lane to turn in the direction of the arrow.
    C: This lane is closed to all traffic during peak hours.
    D: You must yield to all other traffic before entering the lane.
  answer: B
  explanation: 'The manual states, ''Left-turn Arrow: You are permitted to enter in
    a lane marked with a one-way or two-way arrow only to turn in the direction of
    the arrow.'''
- id: 266
  category: signs_and_signals
  question: What does a 'Divided Highway Begins' sign indicate, and what is the proper
    response?
  choices:
    A: The highway is merging into one lane; prepare to merge.
    B: The highway is ending; prepare to stop.
    C: The highway is split by a median, and each roadway is one-way; you must keep
      right.
    D: The highway ahead has two-way traffic; move to the center of the road.
  answer: C
  explanation: The manual states, 'The highway ahead is split into two separate roadways
    by a median or divider and each roadway is one-way. Keep right.'
- id: 267
  category: signs_and_signals
  question: When you see a 'Lane Reduction' sign indicating the right lane is ending,
    what is the correct procedure?
  choices:
    A: Drivers in the right lane have the right-of-way to merge left immediately.
    B: Drivers in the left lane must stop to allow others to merge.
    C: Drivers in the right lane must merge left when space opens, and drivers in
      the left lane should allow them to merge smoothly.
    D: All traffic must come to a complete stop and take turns merging.
  answer: C
  explanation: The manual states, 'The right lane ends soon. Drivers in the right
    lane must merge left when space opens up. Drivers in the left lane should allow
    other vehicles to merge smoothly.'
- id: 268
  category: signs_and_signals
  question: What is the recommended action when you see a sign depicting a truck on
    a steep incline (a 'Hill' sign)?
  choices:
    A: Speed up to maintain momentum.
    B: Turn on your hazard lights.
    C: Check your brakes.
    D: Honk your horn to warn other drivers.
  answer: C
  explanation: 'The manual states for a Hill sign: ''A steep grade is ahead. Check
    your brakes.'''
- id: 269
  category: sharing_the_road
  question: When approaching or passing horse-drawn buggies, what action should you
    specifically AVOID doing?
  choices:
    A: Slowing down.
    B: Using your horn.
    C: Providing at least three feet of clearance.
    D: Passing only when the way is clear.
  answer: B
  explanation: 'The manual states regarding horse-drawn buggies: ''Slow down and don’t
    use the horn.'''
- id: 270
  category: signs_and_signals
  question: What does a 'T Intersection' sign mean?
  choices:
    A: You must make a U-turn as the road does not continue.
    B: The roadway you are on ends ahead, and you must turn right or left after yielding.
    C: A side road enters the highway at a sharp angle.
    D: The highway ahead is temporarily closed for construction.
  answer: B
  explanation: The manual explains that for a T Intersection sign, 'The roadway you
    are traveling on ends ahead at a stop sign. You must turn right or left after
    yielding to oncoming traffic and pedestrians.'
- id: 271
  category: signs_and_signals
  question: According to the manual, what is the key to safely navigating a road marked
    with a 'Winding Road' sign?
  choices:
    A: Maintain a constant speed throughout all turns.
    B: Use your high-beam headlights to see farther ahead.
    C: Slow down for better control on all curves.
    D: Stay in the center of your lane and do not adjust speed.
  answer: C
  explanation: 'The manual advises for a Winding Road: ''On all curves, slow down
    for better control.'''
- id: 272
  category: signs_and_signals
  question: If you report a dangerous condition at a railroad crossing using the emergency
    phone number on the sign, what specific information must you provide to identify
    the location?
  choices:
    A: The time of day and direction of travel.
    B: The name of the nearest town or city.
    C: Your vehicle's license plate number.
    D: The posted crossing number.
  answer: D
  explanation: The manual states, 'Be sure to give the posted crossing number so that
    the hazard can be identified correctly.'
- id: 273
  category: signs_and_signals
  question: 'A ''Divided Highway Ends'' sign warns you that:'
  choices:
    A: You are approaching a toll booth.
    B: The highway is closing and you must exit.
    C: The median or divider is ending and traffic will now travel in both directions
      on the same roadway.
    D: The highway is beginning and you should move to the right lane.
  answer: C
  explanation: The manual states, 'The highway ahead no longer has a median or divider.
    Traffic goes in both directions. Keep right.'
- id: 274
  category: signs_and_signals
  question: When a 'Pedestrian Crossing' or 'Bicycle Crossing' sign is accompanied
    by a second sign with an arrow, what does the arrow indicate?
  choices:
    A: The direction pedestrians or cyclists are coming from.
    B: The actual location of the crosswalk or bike crossing.
    C: A mandatory turn for vehicles.
    D: The speed limit for the crossing area.
  answer: B
  explanation: 'The manual notes for both Pedestrian and Bicycle Crossing signs: ''A
    second sign with an arrow may show the actual location of the crosswalk [or bike
    crossing].'''
- id: 275
  category: signs_and_signals
  question: At a railroad crossing with a crossbuck, flashing lights, and a gate,
    what is the rule regarding the gate?
  choices:
    A: You may proceed with caution if you don't see a train.
    B: You may drive around the gate if it has been down for more than a minute.
    C: Stop when the lights flash and do not attempt to drive around the lowered gate.
    D: Stop only if the gate is fully lowered; if it is still moving, you can cross.
  answer: C
  explanation: 'The manual is explicit: ''Stop when the lights begin to flash and
    before the gate lowers. Remain stopped until the gates are raised and the lights
    stop flashing. Do not attempt to drive around the lowered gate.'''
- id: 276
  category: signs_and_signals
  question: 'A sign showing a sharp arrow bending right and then immediately left
    warns you to:'
  choices:
    A: Prepare for a roundabout ahead.
    B: Slow down for a sharp right turn, followed by a sharp left turn.
    C: Choose either the right or left lane for an upcoming fork in the road.
    D: Watch for merging traffic from both the right and left.
  answer: B
  explanation: 'The ''Sharp Right and Left Turns'' sign description says: ''Slow down
    and be prepared for the road ahead to turn sharply right, then left.'''
- id: 277
  category: signs_and_signals
  question: What must you do if you approach an overpass with a 'Low Clearance' sign?
  choices:
    A: Slow down and honk your horn before proceeding.
    B: Do not proceed if your vehicle is taller than the height shown on the sign.
    C: Stop and wait for an escort vehicle.
    D: All trucks must stop, but passenger cars may proceed without checking height.
  answer: B
  explanation: 'The manual states for a Low Clearance Sign: ''Do not proceed if your
    vehicle is taller than the height shown on the sign.'''
- id: 278
  category: signs_and_signals
  question: 'An ''Expansion Joints'' sign warns drivers that a joint across the road
    lanes:'
  choices:
    A: Is a designated stopping point for buses.
    B: Creates a bump or may cause a loss of traction in wet weather.
    C: Indicates the beginning of a bridge that freezes easily.
    D: Is a place where motorcyclists are especially likely to lose control.
  answer: B
  explanation: The manual states, 'This sign is used when a joint across lanes creates
    a bump or is wide enough to cause loss of traction in wet weather.' The sign specifically
    for motorcyclist hazard is the 'Open Joints' sign.
- id: 279
  category: signs_and_signals
  question: What specific hazard does the 'Right Curve - Side Road' sign alert you
    to?
  choices:
    A: The road curves right and a side road joins from the left within the curve.
    B: You must exit to the right because the main road ends.
    C: The road curves right, and you must turn left onto a side road.
    D: A T-intersection is located immediately after a right curve.
  answer: A
  explanation: 'The manual describes this sign: ''The road ahead curves right and
    a side road joins from the left within the curve. Be alert for vehicles entering
    the roadway you are traveling on.'''
