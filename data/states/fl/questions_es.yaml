questions:
- id: 1
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por usar un nombre falso u ocultar un hecho
    material en una solicitud para una licencia de conducir o tarjeta de identificación
    de Florida?
  choices:
    A: 1 año de prisión y una multa de $1,000
    B: Hasta cinco años de prisión, una multa de $5,000 y la suspensión del privilegio
      de conducir por al menos un año
    C: 60 días de cárcel y una multa de $500
    D: Revocación permanente de los privilegios de conducir y una multa de $10,000
  answer: B
  explanation: Según el manual, cometer fraude en una solicitud para una licencia
    de conducir o tarjeta de identificación puede resultar en hasta cinco años de
    prisión, una multa de $5,000 y la suspensión de cualquier privilegio de conducir
    existente por al menos un año.
- id: 2
  category: penalties_and_points
  question: ¿Cuál es la sanción por permitir o autorizar a una persona sin licencia
    a conducir un vehículo motorizado?
  choices:
    A: Una sentencia de 30 días de cárcel y una multa de $200
    B: Una sentencia de 60 días de cárcel y una multa de $500
    C: Una sentencia de 90 días de cárcel y una multa de $1,000
    D: Una sentencia de 1 año de cárcel y una multa de $5,000
  answer: B
  explanation: El manual establece que es ilegal permitir o autorizar a una persona
    sin licencia a conducir un vehículo motorizado, y hacerlo puede resultar en una
    sentencia de 60 días de cárcel y una multa de $500.
- id: 3
  category: penalties_and_points
  question: Si usted permite que una persona sin licencia conduzca su vehículo y esta
    se ve involucrada en un choque que resulta en lesiones corporales o la muerte,
    ¿qué puede pasar con sus privilegios de conducir?
  choices:
    A: Su licencia puede ser suspendida por un año.
    B: Su vehículo será confiscado permanentemente.
    C: Enfrentará una sentencia obligatoria de 5 años de prisión.
    D: Deberá volver a tomar el examen de habilidades de manejo.
  answer: A
  explanation: Si el vehículo se ve involucrado en un choque que resulta en lesiones
    corporales o la muerte, a la persona que permitió que la persona sin licencia
    condujera se le puede suspender la licencia por un año.
- id: 4
  category: license_system
  question: Según la Ley de Registros Públicos de Florida, ¿cuál de los siguientes
    datos recopilados durante el proceso de obtención de la licencia está exento de
    divulgación pública pero puede ser proporcionado a las agencias de aplicación
    de la ley?
  choices:
    A: Número de seguro social
    B: Información médica
    C: Número de licencia de conducir
    D: Información de contacto de emergencia
  answer: C
  explanation: El manual especifica que la información personal, incluyendo el nombre,
    la dirección y el número de licencia de conducir, está exenta de divulgación pública
    pero puede ser proporcionada a las agencias de aplicación de la ley.
- id: 5
  category: license_system
  question: ¿Cómo pueden los conductores menores de 18 años evitar la suspensión de
    la licencia de conducir relacionada con el ausentismo escolar?
  choices:
    A: Pagando una multa de $100
    B: Presentando prueba de un Plan de Educación Individualizado (IEP)
    C: Completando un curso de manejo defensivo
    D: Obteniendo una licencia por dificultades (hardship license)
  answer: B
  explanation: Bajo la ley HB 0001, los conductores menores de 18 años pueden presentar
    prueba de su Plan de Educación Individualizado (IEP) como alternativa a la asistencia
    escolar tradicional para evitar la suspensión de la licencia de conducir relacionada
    con el ausentismo escolar.
- id: 6
  category: safe_driving_rules
  question: La Ley de Hacerse a un Lado (Move Over Law) ampliada (HB 425) requiere
    que los conductores se hagan a un lado para ¿cuál de los siguientes?
  choices:
    A: Cualquier vehículo estacionado en la entrada de una zona residencial
    B: Un vehículo motorizado averiado que esté detenido y muestre luces de advertencia
      o luces intermitentes de peligro
    C: Un camión de reparto en movimiento
    D: Un autobús escolar con su señal de alto retraída
  answer: B
  explanation: La ley HB 425 amplía la Ley de Hacerse a un Lado (Move Over Law) para
    incluir hacerse a un lado por un vehículo motorizado averiado que esté detenido
    y muestre luces de advertencia o luces intermitentes de peligro.
- id: 7
  category: penalties_and_points
  question: ¿Cuál es la multa para el propietario registrado de un vehículo motorizado
    que sea sorprendido violando el límite de velocidad en una zona escolar, detectado
    por un dispositivo de radar equipado con cámara?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: B
  explanation: Según la ley HB 657, el propietario registrado de un vehículo motorizado
    que sea sorprendido violando los límites de velocidad en una zona escolar mediante
    un radar equipado con cámara está sujeto a una multa de $100.
- id: 8
  category: penalties_and_points
  question: ¿Cuál es la sanción civil por rebasar a un autobús escolar mientras muestra
    una señal de alto, según lo captado por un sistema de detección de infracciones?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: B
  explanation: La ley SB 766 establece que el propietario registrado de un vehículo
    motorizado que cometa la infracción está sujeto a una sanción civil de $200 por
    rebasar a un autobús escolar mientras muestra una señal de alto.
- id: 9
  category: signs_and_signals
  question: Los autobuses escolares equipados con sistemas de detección de infracciones
    para captar a los conductores que los rebasan ilegalmente mostrarán ¿cuál de las
    siguientes frases?
  choices:
    A: '"SPEED CHECKED BY RADAR" (Velocidad controlada por radar)'
    B: '"CAMERA ENFORCED" (Vigilado por cámara)'
    C: '"YIELD TO BUS" (Ceda el paso al autobús)'
    D: '"DO NOT TAILGATE" (No siga muy de cerca)'
  answer: B
  explanation: Los autobuses equipados con el sistema de detección de infracciones
    tendrán las palabras "CAMERA ENFORCED" (Vigilado por cámara) junto con un símbolo
    gráfico de una cámara y advertencias sobre luces rojas intermitentes.
- id: 10
  category: license_system
  question: 'Bajo la ley HB 1087, un deudor (obligor) puede evitar la suspensión de
    su licencia de conducir al celebrar un acuerdo de pago con una fecha de inicio
    diferida si participa de buena fe en:'
  choices:
    A: Capacitación laboral
    B: Un programa de abuso de sustancias
    C: Una escuela de tránsito
    D: Servicio comunitario
  answer: A
  explanation: La ley HB 1087 amplía las razones por las que un deudor puede celebrar
    un acuerdo de pago con una fecha de inicio diferida para evitar la suspensión
    de la licencia, incluyendo cuando el deudor participa de buena fe en una capacitación
    laboral.
- id: 11
  category: license_system
  question: A partir del 1 de octubre de 2023, ¿qué debe poseer una persona menor
    de 18 años para conducir legalmente un carrito de golf en vías o calles públicas?
  choices:
    A: Una tarjeta de identificación escolar válida
    B: Una licencia de aprendizaje válida o una licencia de conducir válida
    C: Un certificado de seguridad para bicicletas
    D: Consentimiento de los padres por escrito
  answer: B
  explanation: La ley HB 949 requiere que una persona menor de 18 años que conduzca
    un carrito de golf en vías públicas debe poseer una licencia de aprendizaje válida
    o una licencia de conducir válida.
- id: 12
  category: penalties_and_points
  question: 'Transportar a sabiendas y voluntariamente a Florida a una persona que
    ha ingresado ilegalmente a los Estados Unidos y no ha sido inspeccionada por el
    Gobierno Federal se clasifica como:'
  choices:
    A: Delito menor de primer grado
    B: Delito menor de segundo grado
    C: Delito grave de tercer grado
    D: Infracción civil de tránsito
  answer: C
  explanation: La ley SB 1718 modifica el delito de tráfico de personas para establecer
    que una persona comete un delito grave de tercer grado cuando transporta a sabiendas
    y voluntariamente a dicha persona al estado.
- id: 13
  category: penalties_and_points
  question: 'El delito de tráfico de personas hacia Florida se agrava a un delito
    grave de segundo grado si la persona transporta a:'
  choices:
    A: Un menor de edad al estado
    B: Más de dos adultos en un solo vehículo
    C: Alguien a través de los límites del condado
    D: Alguien durante horas de la noche
  answer: A
  explanation: La ley SB 1718 agrava el delito a un delito grave de segundo grado
    si una persona transporta a un menor al estado en violación de esta sección.
- id: 14
  category: driver_responsibility
  question: 'Según el descargo de responsabilidad del manual, el Manual Oficial de
    Licencias de Conducir de Florida es:'
  choices:
    A: Un documento legalmente vinculante destinado a ser utilizado en los tribunales
    B: No es una autoridad legal y no está destinado a ser utilizado en los tribunales
    C: Actualizado diariamente para reflejar todos los cambios legislativos
    D: Una copia completa e íntegra de las leyes de tránsito de Florida
  answer: B
  explanation: 'El descargo de responsabilidad establece explícitamente: ''El manual
    no es una autoridad legal y no está destinado a ser utilizado en los tribunales''.'
- id: 15
  category: license_system
  question: Según el manual del conductor de Florida, ¿cuál de las siguientes se considera
    una 'Designación Opcional' en una licencia de conducir o tarjeta de identificación?
  choices:
    A: Delincuente Habitual (Career Offender)
    B: Servicio Selectivo
    C: Designación de Veterano
    D: Depredador Sexual
  answer: C
  explanation: El manual enumera 'Donante de Órganos y Tejidos de Florida' y 'Designación
    de Veterano' bajo Designaciones Opcionales, mientras que los Delincuentes Habituales
    y el Servicio Selectivo se enumeran bajo Designaciones Obligatorias.
- id: 16
  category: license_system
  question: ¿Cuál de las siguientes opciones figura como una 'Designación Obligatoria'
    para una tarjeta de identificación o licencia de conducir de Florida?
  choices:
    A: Contribuciones Voluntarias
    B: Servicio Selectivo
    C: Designación de Veterano
    D: Donante de Órganos y Tejidos de Florida
  answer: B
  explanation: Según el manual, el Servicio Selectivo, los Delincuentes Habituales
    y los Delincuentes Sexuales y Depredadores Sexuales se clasifican como Designaciones
    Obligatorias.
- id: 17
  category: driver_testing
  question: En el contexto de los cursos de manejo de Florida, ¿qué significan las
    siglas 'BDI'?
  choices:
    A: Mejora Básica del Conductor (Basic Driver Improvement)
    B: Instrucción para Conductores Principiantes
    C: Información Básica de Manejo
    D: Inspección del Conductor al Volante
  answer: A
  explanation: El manual enumera el 'Curso de Mejora Básica del Conductor (BDI)' en
    la sección de Escuelas de Manejo y Proveedores de Exámenes.
- id: 18
  category: driver_testing
  question: ¿Qué tipo de curso de manejo se designa con las siglas 'ADI'?
  choices:
    A: Instrucción Automática para Conductores
    B: Mejora Avanzada del Conductor (Advanced Driver Improvement)
    C: Información Adicional de Manejo
    D: Inspección Aprobada del Conductor
  answer: B
  explanation: El manual incluye una sección específica para los 'Cursos de Mejora
    Avanzada del Conductor (ADI)'.
- id: 19
  category: driver_responsibility
  question: ¿Qué dos leyes se enumeran específicamente bajo las Leyes de Seguros de
    Florida en el manual del conductor?
  choices:
    A: La Ley de Colisión y la Ley de Responsabilidad Civil
    B: La Ley Sin Culpa (No-Fault Law) y la Ley de Responsabilidad Financiera
    C: La Ley de Hacerse a un Lado (Move Over Law) y la Ley de Exceso de Velocidad
    D: La Ley de Cobertura a Todo Riesgo y la Ley de Automovilista No Asegurado
  answer: B
  explanation: El manual clasifica la 'Ley Sin Culpa' (No-Fault Law) y la 'Ley de
    Responsabilidad Financiera' directamente en la sección de Leyes de Seguros.
- id: 20
  category: driver_responsibility
  question: Según el manual, ¿qué tipo específico de restricción se impone a los conductores
    menores de edad?
  choices:
    A: Solo límites de pasajeros
    B: Toques de queda para conducir
    C: Conducir solo de día
    D: Prohibiciones de conducir en autopistas
  answer: B
  explanation: El manual enumera explícitamente las 'Restricciones para Menores (Toques
    de queda para conducir)' en el capítulo de Su Privilegio de Conducir.
- id: 21
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una forma en que una persona puede perder su
    privilegio de conducir en Florida?
  choices:
    A: Suspensiones
    B: Revocaciones
    C: Cancelaciones
    D: Todas las anteriores
  answer: D
  explanation: El manual enumera las Suspensiones, Revocaciones y Cancelaciones como
    las tres subcategorías bajo 'Pérdida del privilegio de conducir'.
- id: 22
  category: vehicle_information
  question: Al referirse a los estándares de equipamiento del vehículo, ¿qué significan
    las siglas 'ADAS'?
  choices:
    A: Conducción y dirección automáticas
    B: Sistemas avanzados de asistencia al conductor (ADAS)
    C: Sistema de alerta al conductor antibloqueo
    D: Distancia y velocidad automatizadas
  answer: B
  explanation: El manual incluye una sección sobre 'Sistemas avanzados de asistencia
    al conductor (ADAS)' bajo los Estándares de equipamiento.
- id: 23
  category: alcohol_drugs_health
  question: ¿Qué significa el acrónimo 'DUI' en el manual del conductor de Florida?
  choices:
    A: Conducir bajo intoxicación
    B: Conducir bajo la influencia (DUI)
    C: Conducir usando intoxicantes
    D: Conductor bajo investigación
  answer: B
  explanation: El manual se refiere a 'Conducir bajo la influencia (DUI)' en sus secciones
    sobre infracciones de tránsito y programas autorizados.
- id: 24
  category: license_system
  question: ¿Para cuál de los siguientes grupos contiene el manual del conductor de
    Florida secciones específicas sobre los requisitos de la tarjeta de identificación
    (ID)?
  choices:
    A: Estudiantes universitarios y residentes de otros estados
    B: Personas sin hogar y personas en o por debajo del nivel de pobreza
    C: Empleados del gobierno y personal militar
    D: Menores emancipados y niños en hogares de acogida
  answer: B
  explanation: El manual enumera 'Tarjetas de identificación para personas sin hogar'
    y 'Tarjetas de identificación para personas en o por debajo del nivel de pobreza'
    en la sección de Requisitos de la tarjeta de identificación.
- id: 25
  category: license_system
  question: En la sección de Renovación de la licencia, ¿el manual contiene información
    específica para conductores mayores a partir de qué edad?
  choices:
    A: 65 años de edad y mayores
    B: 70 años de edad y mayores
    C: 75 años de edad y mayores
    D: 80 años de edad y mayores
  answer: D
  explanation: El manual incluye una sección específica titulada 'Conductores de 80
    años de edad y mayores' bajo la Renovación de la licencia.
- id: 26
  category: safe_driving_rules
  question: ¿Cuál de las siguientes leyes se enumera específicamente en el capítulo
    de Seguridad al conducir del manual?
  choices:
    A: La ley de mantenerse a la derecha
    B: La ley de hacerse a un lado (Move Over Law)
    C: La ley de manos libres
    D: La ley de faros
  answer: B
  explanation: 'La ''Ley de hacerse a un lado'' (Move Over Law) se enumera explícitamente
    como una sección en el Capítulo 7: Seguridad al conducir.'
- id: 27
  category: signs_and_signals
  question: ¿Cuál de las siguientes opciones está categorizada como una 'Señal y letrero
    especializado' en el manual del conductor de Florida?
  choices:
    A: Señales de alto (Stop)
    B: Señales de ceder el paso (Yield)
    C: Señales y letreros de puentes levadizos
    D: Señales de rutas interestatales
  answer: C
  explanation: El manual enumera las Señales y letreros de puentes levadizos, junto
    con las señales de Construcción, Peatones, Ferrocarril y Zona escolar, bajo 'Señales
    y letreros especializados'.
- id: 28
  category: defensive_driving
  question: Según el capítulo de Manejo de emergencias, ¿cuál de los siguientes es
    un procedimiento de primeros auxilios enumerado?
  choices:
    A: RCP (Reanimación cardiopulmonar)
    B: Tratamiento para el estado de shock
    C: Aplicación de un torniquete
    D: Entablillado de huesos rotos
  answer: B
  explanation: 'El ''Tratamiento para el estado de shock'' se enumera específicamente
    en la sección de Primeros auxilios del Capítulo 9: Manejo de emergencias.'
- id: 29
  category: sharing_the_road
  question: ¿Cuál de los siguientes tipos de vehículos tiene una sección específica
    dedicada a él en el capítulo 'Compartir el camino'?
  choices:
    A: Motocicletas
    B: Ciclomotores
    C: Carritos de golf
    D: Vehículos todo terreno (ATV)
  answer: C
  explanation: El capítulo 'Compartir el camino' enumera explícitamente secciones
    para Ciclistas, Vehículos comerciales de motor, Vehículos de emergencia, Procesiones
    fúnebres, Carritos de golf y Vehículos de baja velocidad.
- id: 30
  category: license_system
  question: ¿Cuáles son las restricciones de horario de conducción para un conductor
    con una Licencia de aprendizaje durante sus primeros tres meses de conducción?
  choices:
    A: Pueden conducir de 6 a.m. a 11 p.m.
    B: Solo pueden conducir durante las horas de luz diurna.
    C: Pueden conducir de 5 a.m. a 1 a.m.
    D: Pueden conducir en cualquier momento si están acompañados por un conductor
      con licencia.
  answer: B
  explanation: Según el manual, un conductor con una Licencia de aprendizaje solo
    debe conducir durante las horas de luz diurna durante los primeros tres meses.
- id: 31
  category: license_system
  question: ¿Cuántas horas de experiencia de manejo debe completar el titular de una
    licencia de aprendizaje antes de obtener una licencia de conducir?
  choices:
    A: 30 horas, incluyendo 5 horas de noche
    B: 40 horas, incluyendo 10 horas de noche
    C: 50 horas, incluyendo 10 horas de noche
    D: 60 horas, incluyendo 15 horas de noche
  answer: C
  explanation: El manual establece que el titular de una licencia de aprendizaje debe
    tener al menos 50 horas de experiencia de manejo antes de obtener una licencia
    de conducir, y 10 horas deben ser de noche.
- id: 32
  category: license_system
  question: ¿Cuáles son las restricciones de horario de manejo para un joven de 16
    años con licencia de conducir que maneja sin acompañante y no viaja hacia o desde
    el trabajo?
  choices:
    A: De 5 am a 1 am
    B: De 6 am a 11 pm
    C: Solo durante las horas de luz diurna
    D: De 6 am a 10 pm
  answer: B
  explanation: Un joven de 16 años con licencia de conducir puede manejar de 6 am
    a 11 pm, a menos que conduzca hacia o desde el trabajo O esté acompañado por un
    conductor con licencia que tenga 21 años o más.
- id: 33
  category: license_system
  question: ¿Entre qué horas puede manejar sin acompañante un joven de 17 años con
    licencia de conducir, asumiendo que no viaja hacia o desde el trabajo?
  choices:
    A: De 6 am a 11 pm
    B: De 5 am a 1 am
    C: De 6 am a la medianoche
    D: Solo durante las horas de luz diurna
  answer: B
  explanation: Un joven de 17 años con licencia de conducir puede manejar de 5 am
    a 1 am, a menos que conduzca hacia o desde el trabajo O esté acompañado por un
    conductor con licencia que tenga 21 años o más.
- id: 34
  category: penalties_and_points
  question: ¿Qué sanción se aplica a los conductores menores de 18 años que acumulan
    seis o más puntos en un período de 12 meses?
  choices:
    A: Su licencia es revocada por 6 meses.
    B: Deben volver a tomar el examen de habilidades de manejo.
    C: Se les restringe automáticamente a conducir 'SOLO para propósitos de negocios'
      durante un año.
    D: Deben pagar una multa de $500 y asistir a la escuela de tráfico.
  answer: C
  explanation: Los conductores menores de 18 años que acumulan seis o más puntos en
    un período de 12 meses son restringidos automáticamente a conducir 'SOLO para
    propósitos de negocios' durante un año.
- id: 35
  category: driver_responsibility
  question: ¿Cuáles de los siguientes documentos debe llevar siempre consigo en el
    vehículo al conducir?
  choices:
    A: Licencia de conducir, comprobante de registro del vehículo y seguro
    B: Licencia de conducir, certificado de nacimiento y tarjeta de seguro social
    C: Comprobante de seguro, título del vehículo y licencia de conducir
    D: Registro del vehículo, pasaporte y licencia de conducir
  answer: A
  explanation: Siempre debe llevar consigo su licencia de conducir al manejar, y siempre
    debe tener el comprobante de registro del vehículo y el seguro en el vehículo
    que está conduciendo.
- id: 36
  category: license_system
  question: Si un no residente acepta un empleo en Florida, ¿cuántos días tiene para
    obtener una licencia de conducir de Florida?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Un no residente que acepta un empleo o se dedica a un oficio, profesión
    u ocupación en este estado debe obtener una licencia de conducir de Florida dentro
    de 30 días para poder operar un vehículo motorizado.
- id: 37
  category: license_system
  question: ¿Cuál de las siguientes personas NO está exenta de obtener una licencia
    de conducir de Florida?
  choices:
    A: Un no residente que asiste a la universidad en Florida.
    B: Un miembro de las Fuerzas Armadas destinado en Florida.
    C: Un no residente que inscribe a su hijo en una escuela pública de Florida.
    D: Un empleado del gobierno de EE. UU. que conduce un vehículo no comercial del
      gobierno de EE. UU. por asuntos oficiales.
  answer: C
  explanation: Un no residente que inscribe a su hijo en una escuela pública de Florida
    debe obtener una licencia de conducir de Florida dentro de 30 días. Los estudiantes
    universitarios, los miembros de las Fuerzas Armadas y los empleados del gobierno
    de EE. UU. en asuntos oficiales están exentos.
- id: 38
  category: driver_testing
  question: Si usted tiene una licencia de conducir válida de Alemania, ¿qué examen
    para la licencia de conducir de Florida se le exime (por reciprocidad)?
  choices:
    A: Tanto el examen de conocimientos como el de habilidades de manejo
    B: Solo el examen de habilidades de manejo
    C: Solo el examen de conocimientos
    D: El examen de la vista
  answer: B
  explanation: El manual especifica que para las personas con una licencia de conducir
    válida de Alemania, solo se exime (por reciprocidad) el examen de habilidades
    de manejo.
- id: 39
  category: driver_testing
  question: ¿Qué examen sigue siendo obligatorio para todos los solicitantes, incluso
    si se les eximen los exámenes de conocimientos y habilidades de manejo por reciprocidad?
  choices:
    A: Examen de audición
    B: Examen escrito de conocimientos
    C: Examen de la vista
    D: Examen de señales de tránsito
  answer: C
  explanation: 'En la sección de Reciprocidad, el manual señala: ''Nota: Aún se requiere
    un examen de la vista''.'
- id: 40
  category: vehicle_information
  question: 'Una licencia de conducir Clase E le permite operar vehículos no comerciales
    con una Clasificación de Peso Bruto del Vehículo (GVWR) de menos de:'
  choices:
    A: 10,001 libras
    B: 16,001 libras
    C: 26,001 libras
    D: 32,001 libras
  answer: C
  explanation: La Clase E permite a los conductores operar vehículos no comerciales
    con una Clasificación de Peso Bruto del Vehículo (GVWR) de menos de 26,001 libras.
- id: 41
  category: vehicle_information
  question: 'Para conducir una motocicleta de dos o tres ruedas, debe tener un endoso
    de motocicleta o una licencia "Solo para motocicletas" (Motorcycle Only) si el
    tamaño del motor es mayor de:'
  choices:
    A: 30 cc
    B: 50 cc
    C: 100 cc
    D: 150 cc
  answer: B
  explanation: Para conducir cualquier motocicleta de dos o tres ruedas cuyo tamaño
    de motor sea mayor de 50 cc, se requiere tener un endoso de motocicleta en su
    licencia de conducir o tener una licencia "Solo para motocicletas" (Motorcycle
    Only).
- id: 42
  category: vehicle_information
  question: ¿Para operar un vehículo diseñado para transportar a cuántos pasajeros
    (incluyendo al conductor) debe tener una Licencia de Conducir Comercial (CDL)?
  choices:
    A: 10 o más
    B: 12 o más
    C: 15 o más
    D: 16 o más
  answer: D
  explanation: Debe tener una Licencia de Conducir Comercial (CDL) Clase A, B o C
    para operar un vehículo diseñado para transportar 16 o más pasajeros (incluyendo
    al conductor).
- id: 43
  category: license_system
  question: Al solicitar una licencia de conducir o tarjeta de identificación de Florida,
    ¿cuántos documentos debe presentar para demostrar su dirección residencial en
    Florida?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Todos los solicitantes de una licencia de conducir o tarjeta de identificación
    de Florida deben presentar dos documentos que muestren su dirección residencial
    en Florida.
- id: 44
  category: license_system
  question: Si su nombre ha cambiado desde que se emitió su identificación principal,
    ¿qué debe presentar al solicitar una licencia de conducir de Florida?
  choices:
    A: Una carta notariada explicando el cambio de nombre
    B: Una fotocopia de su nueva tarjeta de seguro social
    C: Un documento de cambio de nombre, como un certificado de matrimonio o una orden
      judicial
    D: Dos pruebas adicionales de dirección residencial
  answer: C
  explanation: Si su nombre ha cambiado desde que se emitió la identificación principal,
    deberá presentar un documento de cambio de nombre, como un certificado de matrimonio,
    un decreto de divorcio o una orden judicial.
- id: 45
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para obtener una Licencia de Aprendiz
    Clase E en Florida?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: Según el manual, un solicitante debe tener al menos 15 años para obtener
    una Licencia de Aprendiz Clase E.
- id: 46
  category: license_system
  question: Si es menor de 18 años, ¿cuántas horas de experiencia de manejo debe certificar
    un padre o tutor que ha completado antes de obtener una licencia de conducir?
  choices:
    A: 30 horas, de las cuales 5 fueron de noche
    B: 40 horas, de las cuales 10 fueron de noche
    C: 50 horas, de las cuales 10 fueron de noche
    D: 60 horas, de las cuales 15 fueron de noche
  answer: C
  explanation: Un padre, tutor legal o adulto responsable de 21 años o más debe certificar
    que el conductor ha tenido al menos 50 horas de experiencia de manejo, de las
    cuales 10 horas fueron de noche.
- id: 47
  category: license_system
  question: ¿Por cuánto tiempo debe un conductor menor de 18 años tener una licencia
    de aprendiz antes de solicitar una Licencia de Conducir Clase E?
  choices:
    A: 6 meses
    B: 9 meses
    C: 12 meses o hasta cumplir los 18 años
    D: 18 meses
  answer: C
  explanation: Si es menor de 18 años, debe tener una licencia de aprendiz durante
    12 meses o hasta cumplir los 18 años, lo que ocurra primero.
- id: 48
  category: license_system
  question: ¿Cuál de los siguientes es un documento original o certificado aceptable
    para probar su Número de Seguro Social?
  choices:
    A: Una factura de servicios públicos
    B: Un formulario W-2
    C: Una tarjeta de registro de votante de Florida
    D: Un expediente académico
  answer: B
  explanation: Los documentos aceptables para probar un Número de Seguro Social incluyen
    una tarjeta de Seguro Social, un formulario W-2, un cheque de pago que contenga
    el SSN completo, un formulario 1099 o una identificación militar.
- id: 49
  category: license_system
  question: ¿Cuál de los siguientes documentos NO se acepta como Identificación Principal
    para un ciudadano estadounidense?
  choices:
    A: Pasaporte estadounidense válido
    B: Certificado de Naturalización
    C: Certificado de nacimiento del hospital
    D: Reporte Consular de Nacimiento en el Extranjero
  answer: C
  explanation: El manual establece explícitamente que "No se aceptarán certificados
    de nacimiento de hospitales" como identificación principal para ciudadanos estadounidenses.
- id: 50
  category: license_system
  question: A los inmigrantes, ciudadanos canadienses y otros no inmigrantes que solicitan
    una licencia de conducir de Florida se les puede emitir un permiso de conducir
    temporal sin foto, ¿por cuántos días?
  choices:
    A: 30 días
    B: 45 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: A los inmigrantes, ciudadanos canadienses y otros no inmigrantes que
    solicitan una licencia de conducir de Florida se les puede emitir un permiso de
    conducir temporal de 60 días sin foto.
- id: 51
  category: license_system
  question: ¿Qué significan las siglas TLSAE en el contexto de los requisitos para
    la licencia de conducir de Florida?
  choices:
    A: Educación sobre Leyes de Tránsito y Abuso de Sustancias (Traffic Law and Substance
      Abuse Education)
    B: Educación para Conductores Adolescentes y Automóviles Seguros
    C: Examen de Concientización sobre Seguridad y Licencias de Tránsito
    D: Evaluación de la Administración de Seguridad y Leyes de Transporte
  answer: A
  explanation: TLSAE significa Curso de Educación sobre Leyes de Tránsito y Abuso
    de Sustancias (Traffic Law and Substance Abuse Education), el cual es un requisito
    para obtener una licencia de aprendizaje o de conducir.
- id: 52
  category: license_system
  question: ¿Quién está exento del requisito del curso TLSAE al solicitar una licencia
    de aprendizaje o de conducir?
  choices:
    A: Los solicitantes mayores de 21 años
    B: Los solicitantes que aprueben con éxito un curso de educación vial en una escuela
      certificada por DELAP
    C: Los solicitantes que posean una tarjeta de identificación válida de otro estado
    D: Los solicitantes que tengan un título universitario
  answer: B
  explanation: Los solicitantes que aprueben con éxito un curso de educación vial
    en una escuela certificada por DELAP están exentos del requisito del curso TLSAE.
- id: 53
  category: license_system
  question: Si es menor de 18 años, ¿cuál es la regla con respecto a las infracciones
    de tránsito en movimiento durante los 12 meses que posee una licencia de aprendizaje?
  choices:
    A: Puede tener hasta tres infracciones en movimiento.
    B: NO debe tener condenas por infracciones de tránsito en movimiento, pero puede
      tener UNA si se suspende el fallo (adjudication withheld).
    C: Puede tener dos infracciones en movimiento siempre y cuando no hayan ocurrido
      accidentes.
    D: Las infracciones en movimiento no afectan su capacidad para obtener una licencia
      de conducir.
  answer: B
  explanation: Si es menor de 18 años, NO debe tener condenas por infracciones de
    tránsito en movimiento durante los 12 meses posteriores a la fecha de emisión
    de la licencia de aprendizaje. Puede tener UNA infracción de tránsito en movimiento
    si se suspende el fallo (adjudication withheld).
- id: 54
  category: driver_responsibility
  question: Si es menor de 18 años y no está casado, ¿quién debe firmar su solicitud
    de licencia?
  choices:
    A: El director de su escuela secundaria
    B: Un instructor de manejo
    C: Un padre o tutor legal
    D: Un hermano mayor de 18 años
  answer: C
  explanation: Si es menor de 18 años y no está casado, un padre o tutor legal debe
    firmar su solicitud de licencia frente a un agente de licencias de conducir o
    un notario público.
- id: 55
  category: license_system
  question: ¿Qué debe presentar como comprobante de domicilio residencial si vive
    con otra persona?
  choices:
    A: Solo una carta de esa persona
    B: Dos documentos a su nombre y una declaración jurada notariada
    C: Dos documentos y una carta de la persona con la que vive
    D: Un documento a nombre de la otra persona
  answer: C
  explanation: Las personas que viven con otra persona deben presentar dos documentos
    y una carta de esa persona para comprobar su domicilio residencial.
- id: 56
  category: license_system
  question: Si cambió de nombre recientemente, ¿qué debe hacer antes de solicitar
    una licencia de conducir o tarjeta de identificación?
  choices:
    A: Actualizar primero sus registros en la Administración del Seguro Social
    B: Llevar una nota escrita a mano explicando el cambio de nombre
    C: Solicitar un permiso temporal de 60 días
    D: Volver a tomar el examen de conocimientos de Clase E
  answer: A
  explanation: 'El manual establece: "Si cambió de nombre recientemente, debe actualizar
    primero sus registros en la Administración del Seguro Social".'
- id: 57
  category: license_system
  question: Si nunca se le ha emitido un número de Seguro Social y es ciudadano estadounidense,
    ¿cuál de los siguientes documentos puede usarse como Identificación Secundaria?
  choices:
    A: Un certificado de nacimiento del hospital
    B: Una tarjeta de la biblioteca
    C: Un certificado de matrimonio
    D: Una factura de servicios públicos
  answer: C
  explanation: Un certificado de matrimonio figura como uno de los documentos secundarios
    aceptables para las personas a las que nunca se les ha emitido un número de Seguro
    Social.
- id: 58
  category: license_system
  question: ¿Quién debe firmar la solicitud de licencia de conducir de un menor de
    18 años soltero?
  choices:
    A: Un instructor de educación vial
    B: Un padre o tutor legal
    C: Solo un notario público
    D: El propio menor
  answer: B
  explanation: Si es menor de 18 años y no está casado, un padre o tutor legal debe
    firmar su solicitud de licencia frente a un agente de licencias de conducir o
    un notario público.
- id: 59
  category: driver_responsibility
  question: ¿Cómo puede un padre o tutor retirar su consentimiento y cancelar la licencia
    de conducir de un menor?
  choices:
    A: Llamando al departamento de policía local
    B: Confiscando la licencia física del menor
    C: Escribiendo una carta al FLHSMV o usando MyDMVPortal
    D: Esperando hasta que el menor cumpla 18 años
  answer: C
  explanation: Para cancelar la licencia, el firmante debe escribir una carta al FLHSMV
    solicitando retirar su consentimiento... El firmante también puede ingresar a
    MyDMVPortal.flhsmv.gov para cancelar la licencia.
- id: 60
  category: alcohol_drugs_health
  question: ¿Qué designación opcional puede solicitar una persona diabética que usa
    insulina para que se indique en su licencia de conducir?
  choices:
    A: Pulsera de Alerta Médica
    B: Dependiente de Insulina (Insulin Dependent)
    C: Conductor Diabético
    D: Restricción de Código 3
  answer: B
  explanation: Si es diabético y usa insulina, puede solicitar que se indique "Dependiente
    de Insulina" (Insulin Dependent) en su licencia de conducir.
- id: 61
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de no cumplir con un código de restricción
    en su licencia de conducir?
  choices:
    A: Se le exigirá que vuelva a tomar el examen de manejo
    B: Podría recibir una multa y que le suspendan la licencia
    C: Su vehículo será confiscado por 30 días
    D: Recibirá una carta de advertencia del DMV
  answer: B
  explanation: Si tiene una restricción en su licencia y no cumple con los requisitos,
    podría recibir una multa y que le suspendan la licencia.
- id: 62
  category: license_system
  question: ¿Qué indica el Código de Restricción G en una licencia de conducir de
    Florida?
  choices:
    A: Lentes correctivos
    B: Solo para fines comerciales
    C: Solo conducción diurna
    D: Solo para fines de empleo
  answer: C
  explanation: El Código de Restricción G significa 'Solo conducción diurna. (Del
    amanecer al anochecer)'.
- id: 63
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una tarjeta de identificación estándar
    de Florida, asumiendo que no se está solicitando un permiso de estacionamiento
    para discapacitados?
  choices:
    A: 5 años de edad
    B: 12 años de edad
    C: 15 años de edad
    D: 16 años de edad
  answer: A
  explanation: Para obtener una tarjeta de identificación, debe tener 5 años de edad
    o más (a menos que solicite un permiso de estacionamiento para discapacitados,
    el cual no tiene restricción de edad).
- id: 64
  category: license_system
  question: ¿Por cuánto tiempo es válida una tarjeta de identificación de Florida
    para una persona de 10 años de edad?
  choices:
    A: 2 años
    B: 4 años
    C: 6 años
    D: 8 años
  answer: B
  explanation: Las tarjetas de identificación emitidas a personas de 5 a 14 años de
    edad serán válidas por cuatro años; todas las demás serán válidas por ocho años.
- id: 65
  category: license_system
  question: ¿Puede una persona tener una licencia de conducir de Florida y una tarjeta
    de identificación de Florida al mismo tiempo?
  choices:
    A: Sí, si pagan una tarifa de emisión doble
    B: Sí, pero solo si son mayores de 18 años
    C: No, deben entregar su licencia de conducir para obtener una tarjeta de identificación
    D: No, a menos que tengan un permiso de estacionamiento para discapacitados
  answer: C
  explanation: Las personas que tienen una licencia de conducir y desean obtener una
    tarjeta de identificación de Florida deben entregar su licencia de conducir. Está
    prohibido tener una licencia de conducir y una tarjeta de identificación al mismo
    tiempo.
- id: 66
  category: license_system
  question: ¿Cómo puede una persona sin hogar obtener una tarjeta de identificación
    de Florida sin costo?
  choices:
    A: Proporcionando una carta de un refugio local para personas sin hogar que verifique
      su situación
    B: Mostrando una tarjeta EBT de cupones de alimentos
    C: Prestando juramento ante un notario público
    D: Solicitándola en línea a través de MyDMVPortal
  answer: A
  explanation: Si no tiene hogar, puede obtener una tarjeta de identificación sin
    costo. Debe proporcionar una carta actualizada de un refugio local para personas
    sin hogar que verifique que no tiene hogar.
- id: 67
  category: license_system
  question: ¿A quién le exige la ley estatal cumplir con los requisitos del Sistema
    de Servicio Selectivo Federal al solicitar una licencia de conducir o una tarjeta
    de identificación?
  choices:
    A: A todos los ciudadanos estadounidenses mayores de 18 años
    B: A cualquier hombre ciudadano estadounidense o inmigrante que tenga al menos
      18 años pero menos de 26 años
    C: A cualquier persona que solicite una licencia de conducir comercial
    D: A cualquier hombre de 16 años que solicite una licencia de aprendizaje
  answer: B
  explanation: La ley estatal exige que cualquier hombre que sea ciudadano estadounidense
    o inmigrante, que tenga al menos 18 años pero menos de 26 años, cumpla con los
    requisitos del Sistema de Servicio Selectivo Federal.
- id: 68
  category: driver_responsibility
  question: ¿Cuánto tiempo tienen los depredadores y delincuentes sexuales para presentarse
    en persona en un centro de servicio de licencias de conducir después de un cambio
    de nombre o dirección?
  choices:
    A: 24 horas
    B: 48 horas
    C: 2 días hábiles
    D: 30 días calendario
  answer: B
  explanation: Los depredadores y delincuentes sexuales deben presentarse en persona
    en un centro de servicio de licencias de conducir... dentro de las 48 horas posteriores
    a cualquier cambio de nombre o dirección.
- id: 69
  category: driver_responsibility
  question: Según el manual, ¿cuántas vidas podría salvar al registrarse como donante
    de órganos y tejidos?
  choices:
    A: Hasta 4 vidas
    B: Hasta 6 vidas
    C: Hasta 8 vidas
    D: Hasta 10 vidas
  answer: C
  explanation: Al registrarse como donante, podría salvar hasta ocho vidas.
- id: 70
  category: license_system
  question: ¿Qué documento debe proporcionar un veterano de los EE. UU. con baja honorable
    para obtener la designación de 'Veterano' (Veteran) en su licencia?
  choices:
    A: Una tarjeta de identificación militar
    B: Una carta de un hospital de Asuntos de Veteranos (VA)
    C: Una copia de su DD214 u otro documento de baja aprobado
    D: Un certificado de nacimiento emitido por el estado
  answer: C
  explanation: El veterano deberá proporcionar una copia de su DD214 u otro documento
    de baja aprobado en el momento de la emisión para que se coloque la designación
    de 'Veterano' (Veteran) en su licencia.
- id: 71
  category: driver_responsibility
  question: ¿Cuántos días tiene para obtener una nueva licencia de conducir después
    de cambiar su dirección postal o residencial?
  choices:
    A: 10 días calendario
    B: 15 días calendario
    C: 30 días calendario
    D: 60 días calendario
  answer: C
  explanation: Debe obtener una nueva licencia de conducir dentro de los 30 días calendario
    posteriores a cualquier cambio en su dirección postal o residencial.
- id: 72
  category: license_system
  question: ¿Cuál de los siguientes documentos es aceptable para cambiar su nombre
    en su licencia de conducir?
  choices:
    A: Una carta notariada de un padre
    B: Una factura de servicios públicos a su nuevo nombre
    C: Un certificado de matrimonio original o certificado emitido por el gobierno
    D: Una nueva tarjeta de Seguro Social
  answer: C
  explanation: Para cambiar su nombre, deberá presentar un certificado de matrimonio
    original o certificado emitido por el gobierno, un decreto de divorcio o una orden
    judicial como documento de cambio de nombre.
- id: 73
  category: license_system
  question: ¿Qué deben hacer los ciudadanos canadienses antes de solicitar un cambio
    de nombre en su licencia de conducir o tarjeta de identificación de Florida?
  choices:
    A: Cambiar su nombre en su pasaporte canadiense
    B: Entregar su pasaporte canadiense al DMV
    C: Solicitar un pasaporte de los Estados Unidos
    D: Cambiar su nombre en sus documentos de USCIS
  answer: A
  explanation: Según el manual, los ciudadanos canadienses deben cambiar su nombre
    en su pasaporte canadiense antes de solicitar un cambio de nombre en su licencia
    de conducir o tarjeta de identificación.
- id: 74
  category: license_system
  question: ¿Bajo qué condición se exime la tarifa de reemplazo por una licencia de
    conducir de Florida robada?
  choices:
    A: Si solicita un reemplazo en línea dentro de las 24 horas
    B: Si proporciona una copia del informe policial en persona y no realiza cambios
      en la tarjeta
    C: Si ha mantenido un historial de manejo limpio durante los últimos tres años
    D: Si es un estudiante menor de 18 años
  answer: B
  explanation: Si la tarjeta fue robada y usted proporciona una copia del informe
    policial (en persona), se exime la tarifa de reemplazo siempre y cuando no realice
    ningún cambio en la tarjeta.
- id: 75
  category: license_system
  question: ¿Por cuánto tiempo son generalmente válidas las licencias de conducir
    Clase E en Florida?
  choices:
    A: 4 a 6 años
    B: 5 a 10 años
    C: 6 a 8 años
    D: 8 a 10 años
  answer: C
  explanation: El manual establece que las licencias de conducir Clase E son válidas
    por seis a ocho años.
- id: 76
  category: license_system
  question: ¿Cuál de las siguientes es una razón por la que su licencia de conducir
    de Florida podría NO ser renovada?
  choices:
    A: Tiene una multa de estacionamiento sin pagar de otro estado
    B: No respondió a una citación que involucraba una infracción de tránsito
    C: Es mayor de 80 años
    D: Perdió su licencia de conducir anterior
  answer: B
  explanation: Su licencia podría no ser renovada si no respondió a una citación que
    involucraba una infracción de tránsito, entre otras razones como suspensión o
    falta de documentación.
- id: 77
  category: license_system
  question: 'Usted NO es elegible para renovar su licencia de conducir en línea si:'
  choices:
    A: Es ciudadano estadounidense
    B: Su renovación anterior se realizó en persona en una oficina local
    C: Su renovación anterior fue por teléfono, correo o en línea
    D: Es mayor de 65 años
  answer: C
  explanation: No es elegible para la renovación en línea si su renovación anterior
    fue por teléfono, correo o en línea.
- id: 78
  category: driver_testing
  question: ¿Qué se requiere para todos los conductores de 80 años de edad o más al
    renovar su licencia de conducir?
  choices:
    A: Deben aprobar un examen de habilidades de manejo
    B: Deben aprobar un examen de la vista
    C: Deben aprobar un examen de conocimientos escrito
    D: Deben completar un curso de Mejora Básica para Conductores
  answer: B
  explanation: Todos los conductores de 80 años de edad o más que renuevan su licencia
    de conducir deben aprobar un examen de la vista.
- id: 79
  category: license_system
  question: ¿Cuál es la tarifa para una licencia de conducir inicial Clase E de Florida?
  choices:
    A: $25
    B: $48
    C: $60
    D: $75
  answer: B
  explanation: La tarifa de licencia inicial para una primera licencia de Florida
    es de $48.
- id: 80
  category: penalties_and_points
  question: ¿Cuál es la tarifa por morosidad para una solicitud de renovación de licencia
    de conducir recibida después de la fecha de vencimiento?
  choices:
    A: $10
    B: $15
    C: $25
    D: $48
  answer: B
  explanation: La solicitud de renovación recibida después de la fecha de vencimiento
    de la licencia (la medianoche de su cumpleaños) requiere un cargo por pago atrasado
    de $15.
- id: 81
  category: penalties_and_points
  question: ¿Cuál es la tarifa administrativa para restablecer una licencia de conducir
    después de una infracción relacionada con el alcohol y las drogas?
  choices:
    A: $45
    B: $75
    C: $130
    D: $180
  answer: C
  explanation: La tarifa administrativa de restablecimiento por infracciones relacionadas
    con el alcohol y las drogas es de $130.
- id: 82
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento del seguro por una primera suspensión
    debido a la falta de mantenimiento del seguro de Protección contra Lesiones Personales
    (PIP)?
  choices:
    A: $15
    B: $45
    C: $150
    D: $250
  answer: C
  explanation: La tarifa por no mantener el seguro PIP para una primera suspensión
    es de $150.
- id: 83
  category: driver_testing
  question: ¿Cuánto cuesta una repetición del examen escrito (Examen de Conocimientos
    de Clase E) en Florida?
  choices:
    A: $7
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: La tarifa para las repeticiones del examen escrito (Examen de Conocimientos
    de Clase E) es de $10.
- id: 84
  category: license_system
  question: ¿Quién está exento de pagar ciertas tarifas de la licencia de conducir,
    como las tarifas iniciales y de renovación?
  choices:
    A: Todos los conductores mayores de 80 años
    B: Cualquier veterano dado de baja con honores con una discapacidad del 100% relacionada
      con el servicio
    C: Oficiales de la ley en servicio activo
    D: Cualquier conductor que no haya recibido una multa de tránsito en 10 años
  answer: B
  explanation: Cualquier veterano dado de baja con honores de las Fuerzas Armadas
    que haya sido determinado por la Administración de Veteranos con una discapacidad
    del 100% relacionada con el servicio está exento de pagar ciertas tarifas de la
    licencia de conducir.
- id: 85
  category: driver_testing
  question: Si nunca ha tenido una licencia de conducir en ninguna jurisdicción, ¿qué
    debe completar antes de solicitar una licencia de conducir de Florida?
  choices:
    A: Un curso de Mejoramiento Básico del Conductor (BDI)
    B: Un curso de Educación sobre Leyes de Tránsito y Abuso de Sustancias (TLSAE)
    C: Un curso avanzado de manejo defensivo
    D: Un registro de 50 horas de manejo supervisado
  answer: B
  explanation: Si nunca ha tenido una licencia de conducir en ningún estado, país
    o jurisdicción, debe completar un curso TLSAE antes de solicitar una licencia
    de conducir en el estado de Florida.
- id: 86
  category: alcohol_drugs_health
  question: Si es menor de 21 años y recibe un aviso de suspensión por conducir con
    un Nivel de Alcohol en la Sangre (BAL) de .02 a .05, ¿qué debe hacer para restablecer
    su licencia de conducir por motivos de dificultad (hardship)?
  choices:
    A: Pagar una multa de $500 y cumplir 10 días en la cárcel
    B: Completar un curso de Educación sobre Leyes de Tránsito y Abuso de Sustancias
      (TLSAE)
    C: Volver a tomar el examen de habilidades de manejo
    D: Esperar hasta cumplir los 21 años
  answer: B
  explanation: Si es menor de 21 años y recibe un aviso de suspensión por conducir
    con un BAL de .02 a .05, debe completar un curso TLSAE para poder restablecer
    su licencia de conducir por motivos de dificultad.
- id: 87
  category: driver_responsibility
  question: ¿Bajo cuál de las siguientes circunstancias se le exige completar un curso
    de Mejoramiento Básico del Conductor (BDI)?
  choices:
    A: Tuvo un choque que resultó en $200 de daños a la propiedad.
    B: Tuvo la culpa en un choque y alguien fue transportado al hospital.
    C: Recibió una multa de estacionamiento en una zona escolar.
    D: Su vehículo se averió en la carretera.
  answer: B
  explanation: Según el manual, debe completar un curso de mejoramiento básico del
    conductor si fue el conductor en un choque, se determinó que tuvo la culpa y alguien
    fue transportado al hospital.
- id: 88
  category: penalties_and_points
  question: ¿Cuántas veces en la vida puede una persona elegir asistir a un curso
    de Mejoramiento Básico del Conductor para evitar puntos en su historial de manejo?
  choices:
    A: '3'
    B: '5'
    C: '8'
    D: Ilimitadas
  answer: B
  explanation: El manual establece que una persona no puede hacer más de cinco elecciones
    en su vida para asistir a un curso de mejoramiento básico del conductor para retener
    los puntos.
- id: 89
  category: penalties_and_points
  question: 'NO puede elegir asistir a un curso de Mejoramiento Básico del Conductor
    por una infracción de tránsito no penal si fue acusado de exceder el límite de
    velocidad por más de:'
  choices:
    A: 10 MPH
    B: 15 MPH
    C: 20 MPH
    D: 30 MPH
  answer: D
  explanation: El manual especifica que no puede elegir asistir a un curso de mejoramiento
    básico del conductor si fue acusado de exceder el límite de velocidad por más
    de 30 MPH.
- id: 90
  category: penalties_and_points
  question: ¿Qué curso debe completar para restablecer sus privilegios de manejo si
    su licencia de conducir de Florida fue suspendida por puntos o como infractor
    de tránsito habitual (no relacionado con DUI)?
  choices:
    A: Curso de Mejoramiento Básico del Conductor (BDI)
    B: Curso de Mejoramiento Avanzado del Conductor (ADI)
    C: Educación sobre Leyes de Tránsito y Abuso de Sustancias (TLSAE)
    D: Programa de DUI con licencia
  answer: B
  explanation: Si su licencia de conducir de Florida fue suspendida por puntos, como
    infractor de tránsito habitual (no relacionado con DUI) o por orden judicial,
    debe completar un curso de mejoramiento avanzado del conductor.
- id: 91
  category: driver_testing
  question: ¿Cuál es el campo de visión mínimo aceptable para un solicitante o conductor
    con licencia en Florida?
  choices:
    A: 100 grados
    B: 110 grados
    C: 130 grados
    D: 150 grados
  answer: C
  explanation: El manual establece que el campo de visión mínimo aceptable para un
    solicitante o conductor con licencia es de 130 grados.
- id: 92
  category: driver_testing
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al examen
    de la vista y los lentes correctivos en Florida?
  choices:
    A: Se reconoce el uso de lentes telescópicos para cumplir con los estándares visuales.
    B: No se reconoce el uso de lentes telescópicos para cumplir con los estándares
      visuales.
    C: Debe tener una visión de 20/20 en ambos ojos para conducir.
    D: No se permiten lentes de contacto durante el examen de la vista.
  answer: B
  explanation: 'El manual señala explícitamente: ''No se reconoce el uso de lentes
    telescópicos para cumplir con los estándares visuales en Florida''.'
- id: 93
  category: driver_testing
  question: ¿Cuántas preguntas hay en el Examen de Conocimientos de Clase E?
  choices:
    A: '30'
    B: '40'
    C: '50'
    D: '60'
  answer: C
  explanation: El Examen de Conocimientos de Clase E consta de 50 preguntas de opción
    múltiple sobre las leyes de tránsito de Florida, prácticas de manejo seguro y
    la identificación de controles de tránsito.
- id: 94
  category: driver_testing
  question: ¿Cuál de los siguientes defectos del vehículo hará que el examinador se
    niegue a realizarle el examen de habilidades de manejo?
  choices:
    A: El vehículo tiene transmisión automática.
    B: El vehículo no tiene limpiaparabrisas en el lado del conductor.
    C: El vehículo tiene ventanas polarizadas.
    D: El vehículo tiene más de 10 años de antigüedad.
  answer: B
  explanation: No se realizará el examen de habilidades de manejo si el examinador
    determina que no hay limpiaparabrisas en el lado del conductor.
- id: 95
  category: safe_driving_rules
  question: 'Durante la maniobra de marcha atrás en el examen de habilidades de manejo,
    debe retroceder una distancia de 50 pies a baja velocidad mientras:'
  choices:
    A: Mira exclusivamente el monitor de la cámara de visión trasera.
    B: Usa solo sus espejos laterales.
    C: Mira hacia atrás sin usar el espejo retrovisor ni el monitor de la cámara.
    D: Mantiene una mano en el freno de emergencia.
  answer: C
  explanation: Para la maniobra de marcha atrás, debe retroceder 50 pies a baja velocidad
    mientras mira hacia atrás, y no debe usar el espejo retrovisor ni el monitor de
    la cámara de visión trasera.
- id: 96
  category: safe_driving_rules
  question: En el examen de habilidades de manejo, ¿cuál es la distancia mínima de
    seguimiento que debe mantener detrás de otros vehículos?
  choices:
    A: De uno a dos segundos
    B: De dos a tres segundos
    C: De tres a cuatro segundos
    D: De cinco a seis segundos
  answer: C
  explanation: Durante el examen de manejo, debe mantener una distancia mínima de
    seguimiento de tres a cuatro segundos para seguir a una distancia segura.
- id: 97
  category: safe_driving_rules
  question: 'Al realizar la maniobra de señalización y giro en el examen de manejo,
    debe indicar su giro durante los últimos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: El manual requiere que se ubique en el carril adecuado e indique su
    giro durante los últimos 100 pies.
- id: 98
  category: penalties_and_points
  question: Si elige asistir a un curso de Mejora Básica del Conductor por una multa
    de tránsito, ¿dentro de cuántos días después de recibir la multa debe informar
    al Secretario del Tribunal (Clerk of Court) y pagar la tarifa de elección?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: Dentro de los 30 días a partir de la fecha en que recibió la multa
    de tránsito y antes de asistir a la clase, debe informar al Secretario del Tribunal
    y pagar una tarifa de elección.
- id: 99
  category: driver_testing
  question: ¿Quién es elegible para tomar el Examen de Conocimientos de Clase E en
    línea a través de un proveedor externo aprobado?
  choices:
    A: Estudiantes menores de 18 años
    B: Cualquier persona que solicite una licencia de conducir comercial
    C: Conductores mayores de 65 años
    D: Todos los solicitantes sin importar la edad
  answer: A
  explanation: El manual establece que los estudiantes menores de 18 años pueden tomar
    el examen de conocimientos en línea a través de proveedores externos aprobados.
- id: 100
  category: driver_testing
  question: Si un solicitante es ciego de un ojo o tiene una visión de 20/200 o peor
    en un ojo, ¿cuál debe ser la visión en el otro ojo para aprobar el examen?
  choices:
    A: 20/20 o mejor
    B: 20/30 o mejor
    C: 20/40 o mejor
    D: 20/50 o mejor
  answer: C
  explanation: Si un ojo es ciego o tiene una visión de 20/200 o peor, el otro ojo
    debe tener una visión de 20/40 o mejor, con o sin lentes correctivos.
- id: 101
  category: driver_testing
  question: ¿A quién se le permite viajar en el vehículo con usted durante el examen
    práctico de manejo?
  choices:
    A: Un padre o tutor con licencia
    B: Un instructor de educación vial
    C: Ningún otro pasajero, a menos que sea necesario un intérprete de idiomas
    D: Hasta un familiar
  answer: C
  explanation: El manual especifica que no se permiten otros pasajeros durante el
    examen a menos que sea necesario un intérprete de idiomas.
- id: 102
  category: safe_driving_rules
  question: Al prepararse para hacer un giro, ¿con qué distancia de anticipación debe
    señalizar antes de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Según las pautas del examen práctico de manejo, debe ubicarse en el
    carril adecuado y poner la luz direccional para su giro durante los últimos 100
    pies.
- id: 103
  category: driver_testing
  question: Durante el examen práctico de manejo, ¿en qué tamaño de espacio se le
    pedirá que dé la vuelta a su vehículo para el giro de tres puntos?
  choices:
    A: Espacio de 10 a 20 pies
    B: Espacio de 20 a 40 pies
    C: Espacio de 40 a 60 pies
    D: Espacio de 50 a 70 pies
  answer: B
  explanation: El manual establece que para un giro de tres puntos, debe dar la vuelta
    al vehículo en un espacio de 20 a 40 pies.
- id: 104
  category: vehicle_information
  question: ¿Cuáles son los requisitos mínimos de cobertura de seguro para los vehículos
    motorizados que circulan por las carreteras de Florida?
  choices:
    A: $5,000 de PIP y $10,000 de PDL
    B: $10,000 de PIP y $10,000 de PDL
    C: $15,000 de PIP y $15,000 de PDL
    D: $20,000 de PIP y $20,000 de PDL
  answer: B
  explanation: Todo propietario o persona a cargo de operar un vehículo motorizado
    en las carreteras de Florida debe tener un mínimo de $10,000 en Protección contra
    Lesiones Personales (PIP) Y un mínimo de $10,000 en cobertura de Responsabilidad
    por Daños a la Propiedad (PDL).
- id: 105
  category: vehicle_information
  question: ¿Durante cuántos días en los últimos 365 días debe haber estado su vehículo
    motorizado en el estado para que usted tenga que cumplir con las leyes de seguros
    de Florida?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: Debe cumplir con las leyes de seguros si es propietario de un vehículo
    motorizado que ha estado en el estado durante 90 días (consecutivos o no consecutivos)
    durante los últimos 365 días.
- id: 106
  category: driver_responsibility
  question: ¿Qué debe hacer antes de cancelar el seguro de su vehículo motorizado
    de Florida para evitar la suspensión de su licencia de conducir?
  choices:
    A: Notificar a su departamento de policía local.
    B: Entregar la placa de su vehículo en un centro de servicio de licencias de conducir.
    C: Pagar una tarifa de cancelación de $150.
    D: Obtener un permiso de conducir temporal.
  answer: B
  explanation: El manual requiere que entregue su placa en cualquier centro de servicio
    de licencias de conducir antes de cancelar su seguro para evitar la suspensión
    de su licencia y evitar tarifas de restablecimiento.
- id: 107
  category: penalties_and_points
  question: ¿Cuál es la sanción por mostrarle a un oficial de la ley una tarjeta de
    seguro falsificada o una que usted sabe que ha sido cancelada?
  choices:
    A: Una advertencia y una multa de $50
    B: Un delito menor de primer grado
    C: Un delito menor de segundo grado
    D: Un delito grave de tercer grado
  answer: C
  explanation: Si le muestra a un oficial de la ley una tarjeta de seguro cuando sabe
    que el seguro ha sido cancelado, o si falsifica la tarjeta, puede ser arrestado
    y acusado de un delito menor de segundo grado.
- id: 108
  category: alcohol_drugs_health
  question: Si es condenado por conducir bajo la influencia (DUI) en Florida, ¿por
    cuánto tiempo debe mantener los límites de cobertura de seguro más altos requeridos?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: La ley de Florida requiere que tenga límites de cobertura más altos
    (como $100,000 de Responsabilidad por Lesiones Corporales o BIL por persona) cuando
    es condenado por un DUI, y esta cobertura más alta debe estar vigente durante
    tres años después de su condena por DUI.
- id: 109
  category: license_system
  question: ¿Cuáles son las restricciones de horario de conducción para un menor que
    tiene una licencia de aprendizaje durante sus primeros 3 meses?
  choices:
    A: Puede conducir hasta las 10 pm.
    B: Solo puede conducir durante las horas de luz del día.
    C: Puede conducir hasta la medianoche.
    D: Puede conducir en cualquier momento si está acompañado por alguien de 18 años
      o más.
  answer: B
  explanation: Los menores que tienen una licencia de aprendizaje deben estar acompañados
    por un conductor con licencia de 21 años o más, y solo deben conducir durante
    las horas de luz del día durante los primeros 3 meses.
- id: 110
  category: license_system
  question: ¿Entre qué horas se le prohíbe conducir a un conductor con licencia de
    16 años, a menos que conduzca hacia/desde el trabajo o esté acompañado por un
    conductor con licencia de 21 años o más?
  choices:
    A: 10 pm y 5 am
    B: 11 pm y 6 am
    C: 12 am y 6 am
    D: 1 am y 5 am
  answer: B
  explanation: Un conductor con licencia de 16 años no puede conducir entre las 11
    pm y las 6 am a menos que conduzca hacia o desde el trabajo o esté acompañado
    por un conductor con licencia de 21 años o más.
- id: 111
  category: license_system
  question: ¿Cuál es el toque de queda de conducción para un conductor con licencia
    de 17 años que no conduce al trabajo y no está acompañado?
  choices:
    A: De 10 pm a 6 am
    B: De 11 pm a 6 am
    C: De medianoche a 5 am
    D: De 1 am a 5 am
  answer: D
  explanation: Un conductor con licencia de 17 años no puede conducir entre la 1 am
    y las 5 am, a menos que conduzca hacia o desde el trabajo o esté acompañado por
    un conductor con licencia de 21 años o más.
- id: 112
  category: penalties_and_points
  question: ¿Cuál es la sanción por usar ilegalmente un permiso de estacionamiento
    para personas con discapacidad que no le pertenece?
  choices:
    A: Una multa de $100 y 1 punto en su licencia
    B: Un delito menor de segundo grado castigado con una multa de $500 o hasta 6
      meses de cárcel
    C: Un delito menor de primer grado castigado con una multa de $1,000
    D: Revocación inmediata de su licencia de conducir por 1 año
  answer: B
  explanation: Cualquier persona que obtenga o use un permiso que no le pertenece
    puede ser acusada de un delito menor de segundo grado, castigado con una multa
    de $500 o hasta 6 meses de cárcel, y el vehículo puede ser remolcado.
- id: 113
  category: driver_testing
  question: Durante el examen de habilidades de conducción, ¿qué se considera una
    postura adecuada?
  choices:
    A: Apoyar el codo izquierdo en la ventana mientras conduce con la mano derecha.
    B: Mantener ambas manos en el volante y no apoyar el codo en la ventana.
    C: Inclinarse hacia atrás cómodamente con una mano en la posición de las 12 en
      punto.
    D: Mantener las manos en las posiciones de las 10 y las 2 mientras apoya el codo
      en la consola central.
  answer: B
  explanation: 'El manual indica a los conductores que usen una postura adecuada:
    ''Mantenga ambas manos en el volante y no apoye el codo en la ventana''.'
- id: 114
  category: penalties_and_points
  question: Si su licencia de conducir es suspendida por no mantener un seguro adecuado,
    ¿puede obtener una licencia temporal para conducir al trabajo?
  choices:
    A: Sí, pero solo si paga una tarifa de $150.
    B: Sí, puede obtener una licencia por dificultad (hardship license) solo para
      fines laborales.
    C: No, no podrá obtener una licencia temporal por ningún motivo.
    D: No, a menos que obtenga una exención firmada por su empleador.
  answer: C
  explanation: 'El manual establece explícitamente: ''Si su licencia de conducir o
    placa es suspendida por no tener seguro, no podrá obtener una licencia temporal
    por ningún motivo, ni siquiera para ir a trabajar''.'
- id: 115
  category: safe_driving_rules
  question: Según las pautas del examen de habilidades de conducción, ¿en qué carril
    debe conducir generalmente a menos que esté en una calle de un solo sentido?
  choices:
    A: El carril izquierdo
    B: El carril central
    C: El carril derecho
    D: El carril con menos tráfico
  answer: C
  explanation: Bajo la sección 'Manténgase en el carril adecuado', el manual indica
    'Conduzca en el carril derecho excepto en una calle de un solo sentido'.
- id: 116
  category: driver_responsibility
  question: ¿Cuál de las siguientes acciones es una violación de la Ley de Licencias
    de Conducir que puede resultar en tiempo de cárcel o una multa?
  choices:
    A: Permitir que una persona sin licencia use su automóvil.
    B: Olvidar su licencia de conducir en casa mientras conduce.
    C: Conducir un automóvil de alquiler fuera del estado.
    D: Estacionar en un espacio con parquímetro sin pagar.
  answer: A
  explanation: Bajo 'Violaciones de la Ley de Licencias de Conducir', las ofensas
    que pueden llevarlo a la cárcel o requerir una multa incluyen 'Permitir que una
    persona sin licencia use su automóvil, o alquilar un vehículo motorizado a alguien
    sin licencia'.
- id: 117
  category: alcohol_drugs_health
  question: Según la Ley de Consentimiento Implícito de Florida, ¿qué sucede si se
    niega a someterse a una prueba de aliento, sangre u orina por primera vez?
  choices:
    A: Su licencia será suspendida automáticamente por un año.
    B: Será multado con $500.
    C: Su licencia será suspendida por 18 meses.
    D: Se le exigirá asistir a una escuela de DUI de 12 horas.
  answer: A
  explanation: El manual establece que si se niega a realizar las pruebas cuando se
    le solicite, su licencia será suspendida automáticamente por un año.
- id: 118
  category: penalties_and_points
  question: ¿Cuál es la sanción por una segunda negativa a someterse a una prueba
    de aliento, sangre u orina?
  choices:
    A: Una suspensión de licencia de 6 meses
    B: Una suspensión de licencia de 18 meses y un delito menor de primer grado
    C: Una multa de $1,000 y 50 horas de servicio comunitario
    D: Revocación permanente de su licencia de conducir
  answer: B
  explanation: Según el manual, una segunda negativa resultará en una suspensión de
    18 meses y un delito menor de primer grado.
- id: 119
  category: alcohol_drugs_health
  question: En casos de DUI que involucran muerte o lesiones graves, ¿cuál de las
    siguientes afirmaciones es cierta con respecto a los análisis de sangre?
  choices:
    A: Solo se le exige someterse a un análisis de sangre si da su consentimiento.
    B: Se le exigirá someterse a un análisis de sangre con o sin su consentimiento.
    C: Solo se puede extraer sangre si está consciente.
    D: Un análisis de sangre es opcional si pasa una prueba de aliento.
  answer: B
  explanation: El manual establece que en casos de DUI que involucran muerte o lesiones
    graves, se le exigirá someterse a un análisis de sangre con o sin su consentimiento,
    y se le puede extraer sangre incluso si está inconsciente.
- id: 120
  category: alcohol_drugs_health
  question: Según la ley de Tolerancia Cero, ¿qué sucede si un conductor menor de
    21 años es detenido y tiene un nivel de alcohol en la sangre o aliento (BAL) de
    .02 o más?
  choices:
    A: Su privilegio de conducir será suspendido por seis meses.
    B: Será multado con $500.
    C: Deberá instalar un dispositivo de bloqueo de encendido (ignition interlock)
      por un año.
    D: Su licencia será revocada permanentemente.
  answer: A
  explanation: El manual especifica que a cualquier conductor menor de 21 años que
    sea detenido por las autoridades y tenga un BAL de .02 o más, se le suspenderá
    automáticamente su privilegio de conducir por seis meses.
- id: 121
  category: penalties_and_points
  question: ¿Cuál es la sanción por arrojar más de 15 libras de basura en una carretera
    en Florida?
  choices:
    A: Una multa de $100
    B: Una multa de $500 y 2 puntos en su historial de manejo
    C: Un delito menor de primer grado, una multa de hasta $1,000 y 3 puntos en su
      historial de manejo
    D: Un delito menor de segundo grado y una suspensión de la licencia por 6 meses
  answer: C
  explanation: Si arroja más de 15 libras de basura, puede ser acusado de un delito
    menor de primer grado, recibir una multa de hasta $1,000 y recibir 3 puntos en
    su historial de manejo.
- id: 122
  category: penalties_and_points
  question: ¿Cuántos puntos recibirá en su licencia de conducir por rebasar un autobús
    escolar detenido?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Las sanciones por rebasar un autobús escolar detenido incluyen cuatro
    puntos en su licencia de conducir.
- id: 123
  category: penalties_and_points
  question: Si rebasar un autobús escolar detenido resulta en lesiones graves o la
    muerte de otra persona, ¿cuál es el período mínimo de suspensión de la licencia?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Si rebasar resulta en lesiones graves o la muerte, las sanciones incluyen
    la suspensión de la licencia por un mínimo de un año.
- id: 124
  category: safe_driving_rules
  question: Según la ley de Florida, ¿cuáles son los requisitos de sistemas de retención
    de seguridad para niños de 4 y 5 años?
  choices:
    A: Deben estar en un asiento de seguridad orientado hacia atrás.
    B: Deben estar en un asiento de seguridad o en un asiento elevado (booster seat).
    C: Solo se les exige usar un cinturón de regazo estándar.
    D: Están exentos de las leyes de retención de seguridad si viajan en el asiento
      trasero.
  answer: B
  explanation: La ley de Florida exige que los niños de 4 y 5 años deben estar en
    un asiento de seguridad o en un asiento elevado (booster seat).
- id: 125
  category: driver_responsibility
  question: ¿Quién será acusado de una infracción del cinturón de seguridad si un
    pasajero de 16 años no está debidamente sujeto en un vehículo?
  choices:
    A: El pasajero de 16 años
    B: El conductor del vehículo
    C: Los padres del pasajero
    D: Tanto el conductor como el pasajero
  answer: B
  explanation: Los conductores serán acusados de una infracción del cinturón de seguridad
    o del sistema de retención infantil si algún pasajero menor de 18 años no está
    debidamente sujeto.
- id: 126
  category: safe_driving_rules
  question: ¿Cuál de los siguientes está exento de los requisitos del cinturón de
    seguridad de Florida?
  choices:
    A: Un pasajero en el asiento delantero de un automóvil de pasajeros
    B: Un empleado de un servicio de entrega de periódicos a domicilio mientras entrega
      periódicos
    C: Un niño de 10 años que viaja en el asiento trasero
    D: Un conductor con un permiso de aprendizaje
  answer: B
  explanation: La ley de Florida exime a los empleados de un servicio de entrega de
    periódicos a domicilio de los requisitos del cinturón de seguridad mientras entregan
    periódicos.
- id: 127
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo permitido en cualquier carretera
    de Florida?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: El manual establece que en Florida, el límite de velocidad nunca será
    superior a 70 mph.
- id: 128
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación de la licencia por una primera
    condena por DUI?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Para una primera condena por DUI, la sanción incluye la revocación
    de la licencia por un mínimo de 180 días.
- id: 129
  category: penalties_and_points
  question: ¿Qué le puede pasar a su vehículo si se utiliza para transportar, vender
    o distribuir drogas?
  choices:
    A: Debe ser repintado.
    B: Puede ser incautado y confiscado como contrabando por la agencia que realiza
      el arresto.
    C: Será incautado por exactamente 30 días.
    D: Debe estar equipado con un dispositivo de bloqueo de encendido.
  answer: B
  explanation: Si hay drogas en su vehículo porque lo está utilizando para transportar,
    vender o distribuir drogas, su automóvil puede ser incautado y confiscado como
    contrabando por la agencia que realiza el arresto.
- id: 130
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones se considera daño ilegal a la carretera
    en Florida?
  choices:
    A: Conducir un vehículo que pese más de 10,000 libras
    B: Conducir sobre el rin de una llanta desinflada
    C: Conducir con cadenas para la nieve durante una tormenta
    D: Estacionar un camión pesado en una calle residencial
  answer: B
  explanation: El manual establece que es ilegal dañar las carreteras al conducir
    sobre el rin de una llanta desinflada o por cualquier otro medio.
- id: 131
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción de exceder el límite de velocidad
    por más de 50 MPH?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: La multa por exceder el límite de velocidad por más de 50 MPH es de
    $1,000 por la primera infracción y de $2,500 por la segunda.
- id: 132
  category: penalties_and_points
  question: ¿Qué sucede con las multas por exceso de velocidad cuando la infracción
    ocurre dentro de una zona escolar o una zona de construcción?
  choices:
    A: Se anulan si toma un curso de manejo.
    B: Se reducen a la mitad.
    C: Se duplican.
    D: Se triplican.
  answer: C
  explanation: Las multas se duplican cuando las infracciones por exceso de velocidad
    ocurren dentro de una zona escolar o de construcción, con posibles sanciones civiles
    de hasta $1,000.
- id: 133
  category: driver_responsibility
  question: ¿Bajo qué condición la ley le exige asistir a un Curso de Prevención de
    Colisiones de Tráfico?
  choices:
    A: Si se le declara culpable en un choque donde alguien resultó herido y fue transportado
      a un centro de tratamiento médico.
    B: Si recibe una multa de estacionamiento en una zona escolar.
    C: Si está involucrado en cualquier choque, independientemente de quién tenga
      la culpa.
    D: Si lo sorprenden conduciendo a 10 mph por encima del límite de velocidad.
  answer: A
  explanation: La ley le exige asistir a un Curso de Prevención de Colisiones de Tráfico
    si se le declara culpable en un choque donde alguien resultó herido y fue transportado
    a un centro de tratamiento médico, o si es su segunda colisión en un período de
    dos años.
- id: 134
  category: penalties_and_points
  question: Si es condenado por su tercera infracción de tráfico que causó un choque
    dentro de un período de 36 meses, ¿cuál de las siguientes opciones debe completar?
  choices:
    A: Una sentencia de 30 días de cárcel
    B: 4 horas de entrenamiento práctico al volante
    C: Entregar su vehículo al estado
    D: Pagar una multa obligatoria de $5,000
  answer: B
  explanation: Según la Ley de Tres Choques en Tres Años, debe completar un curso
    ADI de 12 horas, recibir 4 horas de entrenamiento práctico al volante de una escuela
    de manejo comercial autorizada y aprobar un examen de manejo extendido.
- id: 135
  category: penalties_and_points
  question: ¿Cuál es la sanción si acumula 18 puntos en su historial de manejo dentro
    de un período de 18 meses?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 3 meses
    C: Una suspensión de 6 meses
    D: Una suspensión de 1 año
  answer: B
  explanation: Acumular 18 puntos dentro de un período de 18 meses resulta en una
    suspensión de 3 meses de sus privilegios de manejo.
- id: 136
  category: penalties_and_points
  question: ¿Cuántos puntos se agregan a su historial de manejo por rebasar un autobús
    escolar detenido (que no resulte en lesiones graves o la muerte)?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Según la tabla de Infracciones Comunes y Valor de Puntos Asociados,
    rebasar un autobús escolar detenido resulta en 4 puntos.
- id: 137
  category: penalties_and_points
  question: ¿Cuántos puntos se evalúan si enviar mensajes de texto mientras conduce
    resulta en un choque?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos agregados a la infracción principal
    D: 9 puntos agregados a la infracción principal
  answer: C
  explanation: Si enviar mensajes de texto resultó en un choque, se agregan +6 puntos
    a la infracción principal.
- id: 138
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en que su licencia sea
    SUSPENDIDA en lugar de revocada?
  choices:
    A: No pagar la manutención infantil
    B: Un delito grave por posesión de drogas
    C: Hacer carreras en la autopista
    D: Tres casos de manejo imprudente en un año
  answer: A
  explanation: No pagar la manutención infantil figura entre las razones por las que
    se suspenderá su licencia. La posesión de drogas, las carreras y tres casos de
    manejo imprudente son motivos de revocación.
- id: 139
  category: license_system
  question: ¿Bajo qué circunstancia puede ser CANCELADA su licencia de conducir?
  choices:
    A: No paga una multa de tráfico.
    B: Proporciona información o identificación falsa.
    C: Es condenado por hacer carreras en la autopista.
    D: No se detiene ante un autobús escolar.
  answer: B
  explanation: Su licencia puede ser cancelada (anulada y terminada) si proporciona
    información o identificación falsa, si fue emitida por error o si no completa
    una escuela requerida.
- id: 140
  category: penalties_and_points
  question: Si se niega a someterse a una prueba de alcoholemia y desea apelar su
    suspensión administrativa, ¿dentro de cuántos días después de su arresto debe
    solicitar una audiencia?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si se niega a someterse a una prueba de aliento, orina o sangre y desea
    apelar esta suspensión, debe solicitar una audiencia de revisión formal o informal
    dentro de los 10 días posteriores a la fecha de su arresto.
- id: 141
  category: safe_driving_rules
  question: ¿Qué ajuste en el vehículo se recomienda para los conductores mayores
    que tienen dificultad para girar la cabeza y revisar los puntos ciegos?
  choices:
    A: Usar una perilla para el volante
    B: Instalar un espejo lateral más grande
    C: Usar un dispositivo de asistencia para el cinturón de seguridad
    D: Quitar el espejo retrovisor
  answer: B
  explanation: El manual sugiere que si tiene dificultad para girar la cabeza y revisar
    los puntos ciegos, debe considerar instalar un espejo lateral más grande.
- id: 142
  category: defensive_driving
  question: ¿Cuál de los siguientes se considera un horario de conducción riesgoso
    que se aconseja evitar a los conductores mayores?
  choices:
    A: El tráfico del mediodía
    B: Conducir en calles residenciales locales
    C: El anochecer, el amanecer y la noche
    D: El clima despejado y soleado
  answer: C
  explanation: Se aconseja a los conductores mayores evitar horarios de conducción
    riesgosos, que incluyen el anochecer, el amanecer y la noche, así como el mal
    clima, el tráfico en horas pico y las autopistas de alta velocidad.
- id: 143
  category: safe_driving_rules
  question: ¿Cuáles son las tres categorías principales de distracción del conductor?
  choices:
    A: Visual, manual y cognitiva
    B: Visual, auditiva y física
    C: Mental, física y emocional
    D: Cognitiva, auditiva y manual
  answer: A
  explanation: Según el manual, las tres categorías principales de distracción del
    conductor son visual (quitar los ojos de la carretera), manual (quitar las manos
    del volante) y cognitiva (pensar en cualquier otra cosa que no sea conducir).
- id: 144
  category: safe_driving_rules
  question: ¿Por qué enviar mensajes de texto se considera uno de los comportamientos
    de conducción distraída más peligrosos?
  choices:
    A: Requiere que el conductor mire hacia abajo durante al menos 5 segundos.
    B: Involucra distracciones visuales, manuales y cognitivas simultáneamente.
    C: Hace que el conductor quite ambas manos del volante.
    D: Es la única distracción que es ilegal en Florida.
  answer: B
  explanation: El manual establece que enviar mensajes de texto involucra las tres
    categorías de distracciones (visual, manual y cognitiva), lo que lo convierte
    en uno de los comportamientos de conducción distraída más peligrosos.
- id: 145
  category: safe_driving_rules
  question: En Florida, ¿en cuáles de las siguientes áreas es ilegal operar un vehículo
    motorizado mientras se usa un dispositivo de comunicación inalámbrica sosteniéndolo
    con la mano?
  choices:
    A: Vecindarios residenciales
    B: Autopistas interestatales
    C: Cruces escolares designados, zonas escolares o zonas de trabajo
    D: Cualquier carretera con un límite de velocidad inferior a 30 mph
  answer: C
  explanation: La ley de Florida prohíbe a una persona operar un vehículo motorizado
    mientras usa un dispositivo de comunicación inalámbrica sosteniéndolo con la mano
    en un cruce escolar designado, zona escolar o zona de trabajo.
- id: 146
  category: alcohol_drugs_health
  question: ¿Qué es lo primero que se ve afectado después de que una persona consume
    una bebida alcohólica?
  choices:
    A: El tiempo de reacción
    B: La visión
    C: El juicio
    D: El equilibrio
  answer: C
  explanation: El manual establece explícitamente que el juicio de una persona es
    lo primero que se ve afectado después de beber una bebida alcohólica.
- id: 147
  category: penalties_and_points
  question: ¿Cuánto tiempo debe permanecer una condena por DUI (Conducir bajo la influencia)
    en su historial de manejo en Florida?
  choices:
    A: 10 años
    B: 25 años
    C: 50 años
    D: 75 años
  answer: D
  explanation: Debido a que beber alcohol y conducir es muy peligroso, las sanciones
    son muy severas. Una condena por DUI debe permanecer en su historial de manejo
    durante 75 años.
- id: 148
  category: defensive_driving
  question: Para evitar conducir somnoliento en viajes largos, ¿con qué frecuencia
    debe tomar un descanso?
  choices:
    A: Cada 50 millas o 1 hora
    B: Cada 100 millas o 2 horas
    C: Cada 200 millas o 4 horas
    D: Solo cuando empiece a sentir que se le cierran los ojos
  answer: B
  explanation: Para evitar conducir somnoliento en viajes largos, el manual recomienda
    tomar un descanso cada 100 millas o 2 horas.
- id: 149
  category: alcohol_drugs_health
  question: ¿Cuál es una consecuencia probable de mezclar alcohol con medicamentos
    para la alergia o el resfriado?
  choices:
    A: El medicamento anulará los efectos del alcohol.
    B: A menudo multiplica los efectos del alcohol y los medicamentos.
    C: Solo afectará su visión, pero no su juicio.
    D: El alcohol evitará que el medicamento funcione.
  answer: B
  explanation: El alcohol y los medicamentos o drogas no deben consumirse al mismo
    tiempo. Mezclar alcohol y medicamentos a menudo multiplica los efectos de ambos.
- id: 150
  category: defensive_driving
  question: Si otro conductor lo está amenazando o conduce intencionalmente de manera
    peligrosa a su alrededor, ¿qué debe hacer?
  choices:
    A: Hacer contacto visual para demostrar que no está intimidado.
    B: Acelerar para mantenerse delante de él.
    C: Mantener la calma, poner distancia entre ustedes y llamar a la *FHP o al 911
      si necesita ayuda.
    D: Parpadear las luces delanteras y tocar la bocina para advertirle.
  answer: C
  explanation: Si otro conductor lo está amenazando, mantenga la calma y trate de
    poner la mayor distancia posible entre usted y él. Reduzca la velocidad y déjelo
    pasar. No haga contacto visual ni gestos obscenos. Si necesita ayuda, llame a
    la *FHP (*347) o al 911.
- id: 151
  category: vehicle_information
  question: Si usted es un no residente que acepta un empleo o inscribe a sus hijos
    en una escuela pública de Florida, ¿cuántos días tiene para obtener un certificado
    de registro y una placa de Florida?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: A
  explanation: Los no residentes que aceptan un empleo o inscriben a sus hijos en
    una escuela pública de Florida deben obtener el certificado de registro y la placa
    dentro de los 10 días posteriores al inicio del empleo o la inscripción.
- id: 152
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos requiere una verificación del Número
    de Identificación del Vehículo (VIN) antes de que pueda ser titulado y registrado
    en Florida?
  choices:
    A: Un vehículo nuevo comprado fuera del estado
    B: Un vehículo usado previamente titulado o registrado en otro estado
    C: Una casa móvil nueva
    D: Un remolque con un peso menor a 2,000 libras
  answer: B
  explanation: El VIN de cualquier vehículo previamente titulado o registrado en otro
    estado debe ser verificado. No se requiere la verificación del VIN en vehículos
    nuevos, casas móviles nuevas/usadas o remolques con un peso menor a 2,000 libras.
- id: 153
  category: vehicle_information
  question: Para la mayoría de los vehículos de propiedad privada, ¿cuándo vence el
    registro del vehículo?
  choices:
    A: El 31 de diciembre de cada año
    B: A la medianoche del cumpleaños del primer propietario que figura en el registro
    C: Exactamente un año después de la fecha de compra
    D: El 30 de junio de cada año
  answer: B
  explanation: Los registros vencen a la medianoche del cumpleaños del primer propietario
    que figura en el formulario de registro, con excepciones para ciertos vehículos
    como casas móviles o vehículos de empresa.
- id: 154
  category: vehicle_information
  question: ¿Con cuánta anticipación puede renovar el registro de su vehículo antes
    de su fecha de vencimiento?
  choices:
    A: Hasta 30 días antes
    B: Hasta 60 días antes
    C: Hasta 90 días antes
    D: Hasta 120 días antes
  answer: C
  explanation: Según el manual, los registros pueden renovarse hasta 90 días antes
    de la fecha de vencimiento.
- id: 155
  category: driver_responsibility
  question: ¿Cuál es el propósito del programa Movilidad Segura para la Vida (Safe
    Mobility for Life) de Florida?
  choices:
    A: Proporcionar registro de vehículos gratuito para familias de bajos ingresos.
    B: Mejorar la seguridad, el acceso y las necesidades de movilidad de los usuarios
      de edad avanzada en las vías de Florida.
    C: Capacitar a los nuevos conductores adolescentes sobre la seguridad en las carreteras.
    D: Ofrecer seguros de auto con descuento para conductores con un historial limpio.
  answer: B
  explanation: El programa Movilidad Segura para la Vida de Florida proporciona información
    y recursos para crear conciencia y mejorar la seguridad, el acceso y las necesidades
    de movilidad de los usuarios de edad avanzada en las vías de Florida.
- id: 156
  category: alcohol_drugs_health
  question: ¿Cómo pueden las drogas ilegales y las sustancias controladas, como la
    marihuana, afectar las habilidades de conducción de una persona?
  choices:
    A: Mejoran el tiempo de reacción en situaciones de emergencia.
    B: Agudizan la visión durante la conducción nocturna.
    C: Pueden dar una falsa sensación de alerta y confianza en sí mismo o causar somnolencia.
    D: Solo afectan a un conductor si se consumen con alcohol.
  answer: C
  explanation: Las drogas ilegales y las sustancias controladas, como la marihuana,
    afectan los reflejos, el juicio y el estado de alerta de una persona. Pueden dar
    una falsa sensación de alerta y confianza en sí mismo o causar somnolencia e incapacidad
    para reaccionar.
- id: 157
  category: vehicle_information
  question: Aunque la mayoría de los registros de vehículos vencen en el cumpleaños
    del propietario, ¿cuándo vencen los registros de las casas móviles y los camiones
    semirremolques?
  choices:
    A: 30 de junio
    B: 30 de septiembre
    C: 31 de diciembre
    D: 31 de marzo
  answer: C
  explanation: Los registros vencen en el cumpleaños del primer propietario, excepto
    para las casas móviles y los camiones semirremolques/semirremolques, que se renuevan
    anualmente antes del 31 de diciembre.
- id: 158
  category: vehicle_information
  question: ¿Cuándo vencen típicamente los registros de vehículos estándar en Florida?
  choices:
    A: A la medianoche del cumpleaños del primer propietario que figura en el registro
    B: El 31 de diciembre de cada año
    C: El 30 de junio de cada año
    D: Exactamente un año después de la fecha de compra
  answer: A
  explanation: Según el manual, los registros vencen a la medianoche del cumpleaños
    del primer propietario que figura en el formulario de registro, con algunas excepciones.
- id: 159
  category: vehicle_information
  question: ¿Cuál es la fecha límite anual de renovación del registro para casas móviles
    y camiones semirremolques/semirremolques?
  choices:
    A: 30 de junio
    B: 31 de diciembre
    C: El cumpleaños del primer propietario
    D: 1 de enero
  answer: B
  explanation: El manual establece que las casas móviles y los camiones semirremolques/semirremolques
    se renuevan anualmente antes del 31 de diciembre.
- id: 160
  category: vehicle_information
  question: Según los estándares de equipamiento de Florida, ¿a qué distancia hacia
    adelante deben iluminar los objetos las luces bajas?
  choices:
    A: 150 pies
    B: 300 pies
    C: 450 pies
    D: 1,000 pies
  answer: A
  explanation: Las luces bajas deben iluminar objetos a 150 pies hacia adelante y
    ser visibles desde 1,000 pies.
- id: 161
  category: vehicle_information
  question: ¿Desde qué distancia deben ser visibles las luces de freno de su vehículo
    durante el día?
  choices:
    A: 150 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Un vehículo debe tener dos luces rojas de freno que sean visibles desde
    300 pies durante el día.
- id: 162
  category: vehicle_information
  question: 'La bocina de su vehículo debe ser lo suficientemente fuerte como para
    escucharse desde una distancia de:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Los estándares de equipamiento requieren una bocina que pueda escucharse
    desde una distancia de 200 pies.
- id: 163
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima requerida para la banda de rodadura de
    las llantas (neumáticos) en los vehículos?
  choices:
    A: 1/16 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: C
  explanation: Las llantas deben tener una banda de rodadura mínima de al menos 3/32
    de pulgada o más, y no presentar áreas desgastadas que muestren las lonas (capas).
- id: 164
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos de iluminación NO está permitido en un
    vehículo civil estándar?
  choices:
    A: Señales direccionales de color ámbar
    B: Luces blancas en la placa de matrícula
    C: Luces rojas visibles desde la parte delantera
    D: Dos luces traseras rojas
  answer: C
  explanation: Las luces rojas visibles desde la parte delantera o las luces azules
    no están permitidas, ya que son exclusivas para vehículos de emergencia y de las
    fuerzas del orden.
- id: 165
  category: safe_driving_rules
  question: ¿Cuál de los siguientes elementos está estrictamente prohibido que un
    conductor use mientras opera un vehículo?
  choices:
    A: Gafas de sol
    B: Un sombrero de ala ancha
    C: Auriculares o audífonos
    D: Gafas graduadas (de receta)
  answer: C
  explanation: El manual enumera 'Auriculares/audífonos usados por el conductor mientras
    opera un vehículo' bajo la sección de Equipamiento NO Permitido.
- id: 166
  category: safe_driving_rules
  question: ¿Qué afirmación es verdadera con respecto al uso de bolsas de aire (airbags)
    en un vehículo?
  choices:
    A: Son un reemplazo para el uso del cinturón de seguridad.
    B: Están diseñadas para funcionar junto con los cinturones de seguridad, no para
      reemplazarlos.
    C: Eliminan la necesidad de sistemas de advertencia de colisión.
    D: Solo se despliegan cuando fallan los frenos convencionales.
  answer: B
  explanation: Las bolsas de aire están diseñadas para funcionar junto con los cinturones
    de seguridad para proteger a los ocupantes durante una colisión y NO son un reemplazo
    para el uso del cinturón de seguridad.
- id: 167
  category: vehicle_information
  question: ¿Cuál es la principal diferencia entre los Sistemas de Advertencia de
    Colisión y los Sistemas de Intervención de Colisión?
  choices:
    A: Los sistemas de advertencia toman medidas para evitar un choque, mientras que
      los sistemas de intervención solo alertan al conductor.
    B: Los sistemas de advertencia solo alertan al conductor, mientras que los sistemas
      de intervención toman medidas para evitar un choque.
    C: Los sistemas de advertencia usan cámaras, mientras que los sistemas de intervención
      usan radar.
    D: Los sistemas de advertencia solo funcionan en reversa, mientras que los sistemas
      de intervención funcionan al avanzar.
  answer: B
  explanation: Los Sistemas de Advertencia de Colisión solo proporcionan advertencias
    a los conductores y NO toman medidas para evitar un choque, mientras que los Sistemas
    de Intervención de Colisión están diseñados para tomar medidas y evitar un choque.
- id: 168
  category: defensive_driving
  question: ¿Cómo debe usar un conductor el Sistema de Frenos Antibloqueo (ABS) en
    una situación de emergencia?
  choices:
    A: Bombear los frenos rápidamente para evitar derrapar.
    B: Presionar fuertemente el pedal del freno, mantenerlo presionado y maniobrar
      para salir del peligro.
    C: Quitar la presión constante del pedal del freno para activar el sistema.
    D: Tocar ligeramente los frenos mientras gira el volante bruscamente.
  answer: B
  explanation: Los conductores con ABS deben presionar fuertemente el pedal del freno,
    mantenerlo presionado y maniobrar para salir del peligro. Bombear los frenos desactivará
    el ABS.
- id: 169
  category: defensive_driving
  question: Si su vehículo tiene frenos convencionales (sin ABS) y pierde tracción
    en una emergencia, ¿qué debe hacer para detenerse?
  choices:
    A: Presionar y mantener el pedal del freno firmemente hasta el fondo.
    B: Bombear los frenos.
    C: Aplicar el freno de estacionamiento inmediatamente.
    D: Poner el vehículo en punto muerto (neutral) y dejar que se detenga por inercia.
  answer: B
  explanation: Los conductores con frenos convencionales deben bombear los frenos
    para detenerse en una situación de emergencia donde se pierde la tracción y el
    vehículo se desliza.
- id: 170
  category: vehicle_information
  question: 'Los límites de altura de los parachoques para automóviles y camionetas
    en Florida se rigen por:'
  choices:
    A: El peso modificado o alterado
    B: La clasificación de peso bruto del vehículo (GVWR)
    C: El peso neto de envío
    D: La capacidad de pasajeros
  answer: C
  explanation: Los límites de altura se rigen por el peso neto de envío del vehículo,
    no por el peso modificado o alterado.
- id: 171
  category: vehicle_information
  question: ¿Cuál es una posible consecuencia de alterar los dispositivos de control
    de emisiones de su vehículo?
  choices:
    A: Mayor rendimiento de combustible
    B: Mayor eficiencia del vehículo
    C: Menor contaminación del aire
    D: Menor rendimiento de combustible y mayor contaminación del aire
  answer: D
  explanation: Alterar los dispositivos de control de contaminación puede causar daños
    a su vehículo, mayor contaminación del aire, menor rendimiento de combustible
    y menor eficiencia del vehículo.
- id: 172
  category: vehicle_information
  question: 'Su vehículo debe tener al menos un espejo retrovisor que le permita ver
    la carretera hacia atrás a una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: C
  explanation: Las normas de equipamiento exigen al menos un espejo retrovisor con
    una visibilidad de 200 pies hacia atrás.
- id: 173
  category: vehicle_information
  question: 'Al remolcar otro vehículo o remolque, la barra de tracción o conexión
    de remolque generalmente no debe medir más de:'
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La barra de tracción o conexión de remolque no debe tener más de 15
    pies de largo, a menos que esté remolcando postes, tuberías, maquinaria u otros
    objetos que no se puedan desarmar fácilmente.
- id: 174
  category: safe_driving_rules
  question: En un vehículo de pasajeros, una carga no puede sobresalir más allá de
    los guardabarros del lado izquierdo ni más de ¿cuántas pulgadas más allá de los
    guardabarros del lado derecho?
  choices:
    A: 4 pulgadas
    B: 6 pulgadas
    C: 8 pulgadas
    D: 12 pulgadas
  answer: B
  explanation: Los vehículos de pasajeros no deben conducirse en ninguna carretera
    con una carga que sobresalga más allá de los guardabarros del lado izquierdo del
    vehículo o que sobresalga más de 6 pulgadas más allá de la línea de los guardabarros
    del lado derecho.
- id: 175
  category: safe_driving_rules
  question: 'Durante el día, si una carga sobresale más de cuatro pies por la parte
    trasera de un vehículo, debe estar marcada con:'
  choices:
    A: Banderas rojas de al menos 18 pulgadas cuadradas
    B: Banderas blancas de al menos 12 pulgadas cuadradas
    C: Dos luces rojas
    D: Una luz ámbar tipo estroboscópica
  answer: A
  explanation: Durante el día, se deben usar banderas rojas de al menos 18 pulgadas
    cuadradas para marcar los extremos de una carga que sobresalga por los lados de
    un vehículo y más de cuatro pies por su parte trasera.
- id: 176
  category: signs_and_signals
  question: ¿Qué indica una doble línea blanca continua en la calzada?
  choices:
    A: Puede cruzar para cambiar de carril cuando sea seguro.
    B: No está permitido cruzar la línea ni cambiar de carril.
    C: Separa los carriles de tráfico que se mueven en direcciones opuestas.
    D: Solo puede cruzar para rebasar a un ciclista.
  answer: B
  explanation: Las dobles líneas blancas continuas separan los carriles de tráfico
    que se mueven en la misma dirección, y no está permitido cruzar una doble línea
    continua ni cambiar de carril.
- id: 177
  category: signs_and_signals
  question: Si conduce por una carretera con dobles líneas amarillas donde la línea
    de su lado es discontinua y la línea de la izquierda es continua, ¿qué se le permite
    hacer?
  choices:
    A: No puede rebasar bajo ninguna circunstancia.
    B: Puede rebasar cuando sea seguro hacerlo.
    C: Está en un carril reversible.
    D: Debe girar a la izquierda en la próxima intersección.
  answer: B
  explanation: Cuando las dobles líneas amarillas son discontinuas a la derecha ('su
    lado' de la línea) y continuas a la izquierda, se permite rebasar en este carril
    cuando sea seguro hacerlo.
- id: 178
  category: sharing_the_road
  question: ¿Cuándo se permite a los vehículos motorizados conducir en carriles exclusivos
    para bicicletas?
  choices:
    A: Al rebasar a un vehículo más lento.
    B: Durante el tráfico de la hora pico.
    C: Nunca se les permite conducir en carriles para bicicletas, pero pueden cruzarlos
      al girar.
    D: Cuando el carril está marcado con 'sharrows' (flechas compartidas).
  answer: C
  explanation: A los vehículos motorizados no se les permite conducir en carriles
    para bicicletas; pueden cruzarlos al girar en las intersecciones, pero solo cuando
    no haya ciclistas presentes en el carril para bicicletas.
- id: 179
  category: signs_and_signals
  question: ¿Qué tipo de información indica una señal de tráfico de color amarillo
    verdoso fluorescente?
  choices:
    A: Advertencia de construcción y mantenimiento
    B: Información de guía o direccional
    C: Advertencia de alto énfasis sobre actividad escolar, de peatones y de ciclistas
    D: Áreas de recreación pública y de importancia cultural
  answer: C
  explanation: Las señales de color amarillo verdoso fluorescente proporcionan una
    advertencia de alto énfasis sobre la actividad escolar, de peatones y de ciclistas.
- id: 180
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de tráfico que lo dirigen a áreas
    de recreación pública y de importancia cultural e histórica?
  choices:
    A: Azul
    B: Verde
    C: Naranja
    D: Marrón
  answer: D
  explanation: Las señales de color marrón indican áreas de recreación pública y de
    importancia cultural e histórica.
- id: 181
  category: signs_and_signals
  question: En las señales de guía verdes en Florida, ¿qué indican las rutas con números
    pares?
  choices:
    A: Rutas de norte a sur
    B: Rutas de este a oeste
    C: Rutas panorámicas
    D: Carreteras de peaje
  answer: B
  explanation: En las señales de guía verdes, las rutas de este a oeste tienen números
    pares y las rutas de norte a sur tienen números impares.
- id: 182
  category: vehicle_information
  question: ¿Qué requisito de frenos se aplica a un remolque o semirremolque que pesa
    más de 3,000 libras?
  choices:
    A: No requiere sus propios frenos.
    B: Debe tener frenos que puedan ser operados por el conductor desde el vehículo
      remolcador.
    C: Solo requiere un freno de estacionamiento de emergencia.
    D: Debe tener frenos hidráulicos independientes del vehículo remolcador.
  answer: B
  explanation: Un remolque o semirremolque que pese más de 3,000 libras debe tener
    frenos que puedan ser operados por el conductor desde el vehículo remolcador,
    diseñados para detener automáticamente el remolque si se desprende.
- id: 183
  category: safe_driving_rules
  question: ¿Qué debe usar al transportar cargas como tierra, arena o grava que podrían
    caer o volar hacia la carretera?
  choices:
    A: Cadenas de seguridad
    B: Una bandera blanca de al menos 12 pulgadas cuadradas
    C: Una cubierta ajustada
    D: Una lámpara tipo estroboscópica de color ámbar
  answer: C
  explanation: Debe usar una cubierta ajustada al transportar cargas que podrían caer
    o volar hacia la carretera (por ejemplo, tierra, arena, grava).
- id: 184
  category: signs_and_signals
  question: En una carretera de doble sentido con un carril central marcado para giros
    a la izquierda, ¿qué es cierto sobre el carril central?
  choices:
    A: Se puede usar para rebasar vehículos más lentos.
    B: Los conductores de ambas direcciones pueden usarlo para girar a la izquierda.
    C: Es un carril reversible para el tráfico en horas pico.
    D: Solo los vehículos que viajan hacia el norte o el este pueden usarlo.
  answer: B
  explanation: En una carretera de doble sentido con un carril central, los conductores
    de ambas direcciones pueden usar el carril central para girar a la izquierda;
    no debe usarlo para rebasar.
- id: 185
  category: signs_and_signals
  question: ¿Qué indica típicamente un bordillo (borde de la acera) pintado de amarillo?
  choices:
    A: Una zona de carga para vehículos comerciales.
    B: Una zona de no estacionar cerca de bocas de incendio (hidrantes) o intersecciones.
    C: Un área de estacionamiento designada para conductores discapacitados.
    D: Un carril de uso compartido para bicicletas.
  answer: B
  explanation: Los bordillos a menudo se pintan de amarillo para indicar zonas donde
    se prohíbe estacionar cerca de bocas de incendio (hidrantes) o intersecciones.
- id: 186
  category: signs_and_signals
  question: ¿Qué marca una sola línea amarilla continua a lo largo del borde de la
    carretera?
  choices:
    A: El borde derecho de la calzada.
    B: Una zona de no rebasar en una calle de doble sentido.
    C: El borde izquierdo de la calzada en autopistas divididas y calles de un solo
      sentido.
    D: Un carril para bicicletas.
  answer: C
  explanation: Una sola línea amarilla continua marca el borde izquierdo de la calzada
    en autopistas divididas y calles de un solo sentido.
- id: 187
  category: signs_and_signals
  question: ¿Cómo se numeran las rutas de este a oeste en las señales de guía verdes
    en Florida?
  choices:
    A: Con números impares
    B: Con números pares
    C: Con letras
    D: Con números romanos
  answer: B
  explanation: Según el manual, las rutas de este a oeste tienen números pares y las
    de norte a sur tienen números impares.
- id: 188
  category: signs_and_signals
  question: ¿Qué tipo de información proporcionan las señales marrones y blancas a
    los conductores?
  choices:
    A: Direcciones a servicios como gasolina y comida
    B: Advertencias sobre próximos peligros
    C: Direcciones a áreas panorámicas, parques y sitios históricos
    D: Velocidades máximas seguras para rampas de salida
  answer: C
  explanation: Las señales marrones y blancas lo dirigen a áreas panorámicas, parques
    y áreas de importancia cultural/histórica.
- id: 189
  category: safe_driving_rules
  question: Si dos vehículos llegan a una intersección con señales de alto en todas
    las direcciones (All Way Stop) aproximadamente al mismo tiempo, ¿quién tiene el
    derecho de paso?
  choices:
    A: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    B: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    C: El conductor que va en línea recta debe ceder el paso al conductor que gira.
    D: El primer conductor en tocar la bocina tiene el derecho de paso.
  answer: A
  explanation: En una intersección con señales de alto en todas las direcciones (All
    Way Stop), si los vehículos llegan aproximadamente al mismo tiempo, cada conductor
    debe ceder el paso al conductor que está a su derecha.
- id: 190
  category: penalties_and_points
  question: ¿En cuáles de las siguientes áreas se duplican las multas por exceso de
    velocidad?
  choices:
    A: Vecindarios residenciales
    B: Zonas escolares y de trabajo activas
    C: Autopistas interestatales
    D: Rutas panorámicas
  answer: B
  explanation: La señal de 'Multas por exceso de velocidad duplicadas' (Speeding Fines
    Doubled) se coloca en zonas escolares y de trabajo activas, y las multas se duplicarán
    si es citado por exceso de velocidad en estas áreas.
- id: 191
  category: sharing_the_road
  question: ¿Qué debe hacer al entrar en un carril de giro a la derecha si se encuentra
    con ciclistas que van en línea recta?
  choices:
    A: Tocar la bocina para advertirles que se aparten del camino.
    B: Acelerar para rebasarlos antes de girar.
    C: Ceder el paso a los ciclistas.
    D: Obligarlos a entrar al carril de giro a la derecha con usted.
  answer: C
  explanation: Al entrar en un carril de giro a la derecha, puede encontrarse con
    ciclistas que van en línea recta; debe ceder el paso a los ciclistas.
- id: 192
  category: safe_driving_rules
  question: ¿Cuál es la regla para el tráfico más lento con respecto al carril izquierdo?
  choices:
    A: El tráfico más lento debe permanecer en el carril izquierdo en todo momento.
    B: El tráfico más lento debe salir del carril izquierdo cuando sea alcanzado por
      un vehículo más rápido.
    C: El tráfico más lento puede usar el carril izquierdo si viaja al menos a 10
      mph por debajo del límite de velocidad.
    D: El tráfico más lento solo está permitido en el carril izquierdo durante la
      hora pico.
  answer: B
  explanation: El tráfico más lento debe permanecer en el carril derecho a menos que
    esté rebasando y debe salir del carril izquierdo cuando sea alcanzado por un vehículo
    más rápido.
- id: 193
  category: signs_and_signals
  question: ¿Cuál es la forma y el color normales de una señal de advertencia?
  choices:
    A: Roja y octagonal
    B: Blanca y rectangular
    C: Amarilla y en forma de diamante
    D: Verde y cuadrada
  answer: C
  explanation: Las señales de advertencia normalmente son amarillas y en forma de
    diamante. Alertan a los conductores sobre las condiciones más adelante y a qué
    deben prestar atención.
- id: 194
  category: signs_and_signals
  question: ¿Qué indica la señal de 'Fin de carretera dividida' (Divided Highway Ends)?
  choices:
    A: La carretera se unirá en un solo carril.
    B: La carretera dividida termina de 350 a 500 pies más adelante y usted estará
      en una vía de doble sentido.
    C: Debe salir de la carretera inmediatamente.
    D: El límite de velocidad aumentará en 500 pies.
  answer: B
  explanation: La señal de 'Fin de carretera dividida' indica que la carretera dividida
    termina de 350 a 500 pies más adelante, y luego estará en una vía con tráfico
    en ambos sentidos.
- id: 195
  category: vehicle_information
  question: ¿Qué acción debe estar preparado para tomar cuando vea una señal de advertencia
    de colina/pendiente descendente (Hill/Downgrade)?
  choices:
    A: Cambiar a una marcha más alta para aumentar la velocidad.
    B: Cambiar a una marcha más baja para controlar la velocidad.
    C: Apagar el motor para ahorrar combustible.
    D: Aplicar el freno de estacionamiento inmediatamente.
  answer: B
  explanation: La señal de colina/pendiente descendente significa que el camino va
    cuesta abajo más adelante. Debe reducir la velocidad y estar preparado para cambiar
    a una marcha más baja para controlar la velocidad.
- id: 196
  category: safe_driving_rules
  question: ¿Cómo debe tratar una intersección si el semáforo no funciona y no hay
    presencia de la policía?
  choices:
    A: Tratarla como una señal de ceda el paso.
    B: Continuar sin detenerse si el camino está despejado.
    C: Tratar el semáforo/intersección como una señal de alto de cuatro vías (four-way
      stop).
    D: Detenerse solo si va a girar a la izquierda.
  answer: C
  explanation: Si un semáforo no funciona y no hay presencia de la policía, trate
    el semáforo/intersección como una señal de alto de cuatro vías.
- id: 197
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite hacer un giro a la izquierda con luz
    roja?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
      que tiene tráfico moviéndose hacia la izquierda.
    C: Cuando no hay tráfico en sentido contrario en una calle de doble sentido.
    D: Los giros a la izquierda con luz roja nunca están permitidos.
  answer: B
  explanation: Después de detenerse ante una luz roja, puede girar a la izquierda
    desde una calle de un solo sentido hacia otra calle de un solo sentido que tenga
    tráfico moviéndose hacia la izquierda.
- id: 198
  category: defensive_driving
  question: ¿Qué debe hacer al acercarse a una intersección y el semáforo cambia a
    amarillo?
  choices:
    A: Acelerar para despejar la intersección rápidamente.
    B: Detenerse si puede hacerlo de manera segura.
    C: Tocar la bocina para advertir al tráfico que cruza.
    D: Desviarse al carril adyacente para evitar detenerse.
  answer: B
  explanation: Una luz amarilla es una advertencia de que el semáforo está cambiando
    a rojo. Debe detenerse si puede hacerlo de manera segura, ya que es extremadamente
    peligroso estar en una intersección cuando la luz cambia a rojo.
- id: 199
  category: defensive_driving
  question: ¿Qué precauciones debe tomar cuando vea una señal de 'Superficie resbaladiza'
    (Slippery Surface) en clima húmedo?
  choices:
    A: Acelerar para mantener la tracción.
    B: Frenar rápidamente si necesita detenerse.
    C: Conducir lentamente, no acelerar ni frenar rápidamente, y hacer los giros a
      baja velocidad.
    D: Cambiar a neutral mientras conduce sobre la superficie resbaladiza.
  answer: C
  explanation: Al encontrar una señal de 'Superficie resbaladiza' en clima húmedo,
    debe conducir lentamente, evitar acelerar o frenar rápidamente, y hacer los giros
    a baja velocidad.
- id: 200
  category: signs_and_signals
  question: ¿Cuál es el propósito de un carril central de giro?
  choices:
    A: Es un carril de rebase para vehículos más rápidos.
    B: Es compartido, permitiendo giros a la izquierda en ambas direcciones de viaje.
    C: Está reservado exclusivamente para vehículos de emergencia.
    D: Es un carril dedicado solo para giros en U.
  answer: B
  explanation: El carril central de giro es un carril compartido que permite giros
    a la izquierda en ambas direcciones de viaje.
- id: 201
  category: safe_driving_rules
  question: ¿Qué le exige hacer la señal de 'No estacionar en el pavimento' (No Parking
    on Pavement) si debe detenerse?
  choices:
    A: Detenerse en el carril central con las luces de emergencia encendidas.
    B: Estacionar en el pavimento solo si tiene un permiso para personas con discapacidades.
    C: Estacionar siempre fuera del pavimento de la calzada.
    D: Detenerse en el pavimento por no más de 5 minutos.
  answer: C
  explanation: La señal de 'No estacionar en el pavimento' significa que si se detiene,
    siempre debe estacionar fuera del pavimento de la calzada.
- id: 202
  category: signs_and_signals
  question: ¿Cómo debe tratar un semáforo en rojo intermitente en una intersección?
  choices:
    A: Ceder el paso al tráfico en sentido contrario sin detenerse.
    B: Tratarlo como una señal de alto (STOP); detenerse y avanzar cuando sea seguro.
    C: Reducir la velocidad y avanzar con precaución.
    D: Detenerse y esperar a que la luz cambie a verde.
  answer: B
  explanation: Una luz roja intermitente se usa en intersecciones peligrosas. El manual
    indica que debe tratarla como una señal de alto (STOP); detenerse y avanzar cuando
    sea seguro.
- id: 203
  category: signs_and_signals
  question: ¿Qué indica una señal de carril con una X roja?
  choices:
    A: El carril está reservado solo para vehículos de emergencia.
    B: Debe reducir la velocidad y avanzar con precaución en este carril.
    C: La señal del carril está a punto de cambiar a amarillo.
    D: Nunca debe conducir en un carril debajo de una X roja.
  answer: D
  explanation: 'Las señales de carril muestran qué carriles están abiertos o cerrados.
    El manual establece explícitamente: "X roja. Nunca conduzca en un carril debajo
    de la X roja".'
- id: 204
  category: signs_and_signals
  question: ¿Cuál es el propósito de los semáforos de rampa (ramp signals)?
  choices:
    A: Advertir a los conductores de una cabina de peaje más adelante.
    B: Controlar el flujo de vehículos que ingresan a una autopista.
    C: Indicar que un puente levadizo está en funcionamiento.
    D: Advertir a los conductores de zonas de construcción más adelante.
  answer: B
  explanation: Los semáforos de rampa controlan el flujo de vehículos que ingresan
    a una autopista y alternan entre rojo y verde.
- id: 205
  category: signs_and_signals
  question: En una zona de construcción, ¿qué indican las franjas inclinadas hacia
    abajo en las barricadas y paneles?
  choices:
    A: La dirección en la que debe circular el tráfico.
    B: La presencia de un abanderado más adelante.
    C: Que el carril está cerrado más adelante.
    D: La ubicación de un cruce peatonal.
  answer: A
  explanation: Los dispositivos de canalización alertan a los conductores sobre condiciones
    inusuales. El manual señala que las franjas en las barricadas y paneles se inclinan
    hacia abajo en la dirección en la que debe circular el tráfico.
- id: 206
  category: signs_and_signals
  question: ¿Qué debe hacer si ve una señal amarilla intermitente en un puente levadizo?
  choices:
    A: Detenerse por completo en la línea de alto marcada.
    B: Acelerar para cruzar el puente antes de que se abra.
    C: Reducir la velocidad y prepararse para detenerse porque el puente levadizo
      está en funcionamiento.
    D: Avanzar a su velocidad normal ya que el puente está cerrado al tráfico marítimo.
  answer: C
  explanation: Cuando la luz amarilla parpadea en un puente levadizo, significa que
    el puente está en funcionamiento. Debe reducir la velocidad y prepararse para
    detenerse.
- id: 207
  category: sharing_the_road
  question: ¿Qué debe hacer si ya está en el cruce peatonal cuando la señal de NO
    CAMINE (DON'T WALK) o la mano levantada comienza a parpadear?
  choices:
    A: Detenerse y esperar en el medio del cruce peatonal.
    B: Terminar de cruzar la calle rápidamente.
    C: Dar la vuelta y regresar a la acera de donde partió.
    D: Esperar a que la señal de cuenta regresiva llegue a cero antes de moverse.
  answer: B
  explanation: El manual establece que si ya se encuentra en el cruce peatonal cuando
    la señal de NO CAMINE o la mano levantada comienza a parpadear, debe terminar
    de cruzar la calle rápidamente.
- id: 208
  category: signs_and_signals
  question: Al acercarse a un semáforo híbrido para peatones (Pedestrian Hybrid Beacon),
    ¿qué indica una luz roja intermitente?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Avanzar con precaución; si no hay peatones presentes y la intersección está
      despejada, continúe.
    C: Reducir la velocidad porque un peatón ha activado el botón.
    D: Detenerse ante los peatones en el cruce y permanecer detenido hasta que la
      luz se apague.
  answer: B
  explanation: En un semáforo híbrido para peatones, si hay una luz roja intermitente,
    debe avanzar con precaución. Si no hay peatones presentes y la intersección está
    despejada, puede continuar.
- id: 209
  category: safe_driving_rules
  question: Al detenerse en un cruce de ferrocarril, ¿cuál es la distancia mínima
    que debe mantener entre su vehículo y las vías del tren?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: Al acercarse a un cruce de ferrocarril, debe reducir la velocidad y
    estar preparado para detenerse. No se detenga sobre las vías del tren ni a menos
    de 15 pies del cruce.
- id: 210
  category: signs_and_signals
  question: ¿Qué indican las marcas viales blancas en forma de X conectadas en un
    cruce de ferrocarril?
  choices:
    A: Un cruce peatonal más adelante.
    B: La envolvente dinámica (dynamic envelope), que es una zona de peligro donde
      los usuarios de la vía no deben detenerse.
    C: El lugar donde debe detenerse si se acerca un tren.
    D: Una zona donde se permite rebasar.
  answer: B
  explanation: La envolvente dinámica consiste en marcas viales blancas en forma de
    X conectadas que se utilizan para resaltar visualmente la zona de peligro donde
    los usuarios de la vía no deben detenerse.
- id: 211
  category: sharing_the_road
  question: ¿Por qué debe estar especialmente preparado para detenerse cuando sigue
    a autobuses o camiones cerca de un cruce de ferrocarril?
  choices:
    A: Tienen la obligación de detenerse en los cruces de ferrocarril incluso cuando
      las barreras están levantadas y las luces no parpadean.
    B: Tardan más en cruzar las vías debido a su tamaño.
    C: No se les permite cruzar las vías del ferrocarril y deben dar la vuelta.
    D: Deben esperar a que un abanderado humano los guíe para cruzar.
  answer: A
  explanation: Debe estar preparado para detenerse, especialmente cuando sigue a autobuses
    o camiones, porque muchos tienen la obligación de detenerse en los cruces de ferrocarril
    incluso cuando las barreras están levantadas y las luces no parpadean.
- id: 212
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente en una intersección?
  choices:
    A: La luz está a punto de cambiar a rojo; deténgase inmediatamente.
    B: Se permiten los giros en la dirección de la flecha, pero debe ceder el paso
      al tráfico en sentido contrario y a los peatones.
    C: Tiene el derecho de paso para girar; el tráfico en sentido contrario tiene
      luz roja.
    D: No puede girar en la dirección de la flecha hasta que la luz cambie a verde.
  answer: B
  explanation: Una flecha amarilla intermitente significa que se permiten los giros
    en la dirección de la flecha, pero el tráfico en sentido contrario tiene luz verde,
    por lo que debe ceder el paso al tráfico en sentido contrario y a los peatones.
- id: 213
  category: signs_and_signals
  question: ¿Cuál es el propósito de la señal de "Parada de autobús escolar más adelante"
    (School Bus Stop Ahead)?
  choices:
    A: Marcar el final de una zona escolar de velocidad reducida.
    B: Indicar que debe detenerse inmediatamente por un autobús escolar.
    C: Alertar a los conductores de una próxima parada de autobús escolar que puede
      ser inesperada o estar oculta.
    D: Advertir a los conductores que hay niños cruzando la calle en ese momento.
  answer: C
  explanation: La señal de "Parada de autobús escolar más adelante" se utiliza para
    alertar a los conductores de una próxima parada de autobús escolar que puede ser
    inesperada o estar oculta por la geometría de la carretera, como una curva o una
    colina.
- id: 214
  category: defensive_driving
  question: ¿Cómo debe acercarse a una intersección con una luz verde fija?
  choices:
    A: Acelerar para despejar la intersección rápidamente.
    B: Acercarse a una velocidad que le permita reducir la velocidad si la luz cambia.
    C: Detenerse antes de entrar a la intersección para verificar el tráfico transversal.
    D: Mantener su velocidad, ya que tiene el derecho de paso absoluto.
  answer: B
  explanation: Al acercarse a una luz verde, solo debe avanzar si la intersección
    está despejada, y acercarse a una velocidad que le permita reducir la velocidad
    si la luz cambia.
- id: 215
  category: safe_driving_rules
  question: ¿Cuál es la regla sobre conducir alrededor o por debajo de una barrera
    de cruce de ferrocarril bajada?
  choices:
    A: Está permitido si puede ver claramente que no se acerca ningún tren.
    B: Está permitido solo para motocicletas y bicicletas.
    C: Es ilegal conducir alrededor o por debajo de una barrera de cruce que está
      bajada o que se está abriendo/cerrando.
    D: Está permitido si las luces de advertencia han dejado de parpadear.
  answer: C
  explanation: 'El manual establece explícitamente: "Es ilegal conducir alrededor
    o por debajo de una barrera de cruce, ya sea que esté bajada o mientras se abre
    o se cierra".'
- id: 216
  category: vehicle_information
  question: Si la ventana trasera de su vehículo está tratada con un material que
    la hace no transparente, ¿qué se requiere legalmente?
  choices:
    A: Una cámara de marcha atrás con una vista de 180 grados.
    B: Espejos laterales en ambos lados que permitan una visión trasera de al menos
      200 pies.
    C: Un pitido de advertencia que suene cuando el vehículo esté en marcha atrás.
    D: Un permiso especial del Departamento de Seguridad en las Carreteras.
  answer: B
  explanation: Según el manual, si la ventana trasera está cubierta o tratada con
    algún material que la haga no transparente, el vehículo debe estar equipado con
    espejos laterales en ambos lados que permitan al conductor una visión trasera
    de al menos 200 pies.
- id: 217
  category: safe_driving_rules
  question: ¿Cuál es la postura física recomendada para un conductor al dar marcha
    atrás?
  choices:
    A: Mantener ambas manos en el volante y mirar la cámara de marcha atrás.
    B: Colocar el brazo izquierdo en el marco de la ventana y mirar por el espejo
      lateral.
    C: Colocar el brazo derecho en el respaldo del asiento del pasajero y darse la
      vuelta para mirar a través de la ventana trasera.
    D: Inclinarse hacia adelante y mirar exclusivamente a través del espejo retrovisor.
  answer: C
  explanation: El manual indica a los conductores que coloquen su brazo derecho en
    el respaldo del asiento del pasajero y se den la vuelta para poder mirar directamente
    a través de la ventana trasera al dar marcha atrás.
- id: 218
  category: defensive_driving
  question: ¿Cómo afecta duplicar la velocidad de conducción a su distancia de frenado
    y al impacto?
  choices:
    A: Son 2 veces mayores.
    B: Son 3 veces mayores.
    C: Son 4 veces mayores.
    D: Son 8 veces mayores.
  answer: C
  explanation: El manual establece que duplicar la velocidad significa que la distancia
    de frenado y el impacto son 4 veces mayores.
- id: 219
  category: defensive_driving
  question: ¿Qué tres componentes conforman la distancia total de parada de un vehículo?
  choices:
    A: Distancia visual, distancia mecánica y distancia de frenado.
    B: Distancia de percepción, distancia de reacción y distancia de frenado.
    C: Distancia de observación, distancia de reacción y distancia de parada.
    D: Distancia del punto ciego, distancia de seguimiento y distancia de frenado.
  answer: B
  explanation: La distancia total de parada se define como la distancia mínima total
    que recorrerá su vehículo, la cual incluye la distancia de percepción, la distancia
    de reacción y la distancia de frenado.
- id: 220
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento recomendada durante condiciones
    climáticas y de tráfico favorables?
  choices:
    A: Dos segundos.
    B: Tres segundos.
    C: Cuatro segundos.
    D: Seis segundos.
  answer: C
  explanation: El manual aconseja mantener una distancia mínima de seguimiento de
    cuatro segundos durante condiciones climáticas y de tráfico favorables.
- id: 221
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima legal de seguimiento cuando se conduce detrás
    de un camión de bomberos que responde a una emergencia?
  choices:
    A: 100 pies.
    B: 200 pies.
    C: 300 pies.
    D: 500 pies.
  answer: D
  explanation: Es ilegal seguir a un camión de bomberos que responde a una emergencia
    a menos de 500 pies de distancia.
- id: 222
  category: sharing_the_road
  question: Fuera de las ciudades o pueblos, ¿cuál es la distancia mínima de seguimiento
    para un camión que sigue a otro camión?
  choices:
    A: 100 pies.
    B: 200 pies.
    C: 300 pies.
    D: 500 pies.
  answer: C
  explanation: Un camión o cualquier vehículo que remolque a otro vehículo no debe
    seguir a menos de 300 pies a otro camión u otro vehículo remolcado, excepto al
    rebasar o dentro de ciudades o pueblos.
- id: 223
  category: safe_driving_rules
  question: ¿Qué debe hacer si usted y otro vehículo llegan a una intersección aproximadamente
    al mismo tiempo?
  choices:
    A: El vehículo más grande tiene el derecho de paso.
    B: El vehículo de la izquierda debe ceder el paso al vehículo de la derecha.
    C: El vehículo de la derecha debe ceder el paso al vehículo de la izquierda.
    D: El vehículo que viaja más rápido tiene el derecho de paso.
  answer: B
  explanation: Si los vehículos llegan aproximadamente al mismo tiempo, cada conductor
    debe ceder el paso a los conductores a su derecha.
- id: 224
  category: safe_driving_rules
  question: Al ingresar a una intersección abierta, ¿en cuál de las siguientes situaciones
    debe ceder el derecho de paso?
  choices:
    A: Cuando usted viaja en línea recta y otro vehículo está girando a la derecha.
    B: Cuando ingresa a una vía pavimentada desde una vía no pavimentada.
    C: Cuando ingresa a una vía no pavimentada desde una vía pavimentada.
    D: Cuando usted es el primer vehículo en llegar a la intersección.
  answer: B
  explanation: En una intersección abierta, debe ceder el derecho de paso si ingresa
    a una vía pavimentada desde una vía no pavimentada.
- id: 225
  category: safe_driving_rules
  question: ¿En qué dirección fluye el tráfico en una rotonda (glorieta)?
  choices:
    A: En el sentido de las agujas del reloj.
    B: En sentido contrario a las agujas del reloj.
    C: En ambas direcciones dependiendo del carril.
    D: Recto por el centro.
  answer: B
  explanation: En las rotondas se circula en un solo sentido, en dirección contraria
    a las agujas del reloj.
- id: 226
  category: safe_driving_rules
  question: ¿Qué carril debe usar si desea hacer un giro en U en una rotonda de varios
    carriles?
  choices:
    A: El carril derecho.
    B: El carril izquierdo.
    C: El carril central.
    D: El arcén (hombro).
  answer: B
  explanation: En una rotonda de varios carriles, para seguir recto o a la izquierda,
    y para hacer un giro en U, debe usar el carril izquierdo.
- id: 227
  category: defensive_driving
  question: ¿Cuál es la mejor manera de revisar sus puntos ciegos antes de cambiar
    de carril?
  choices:
    A: Mirar exclusivamente por el espejo retrovisor.
    B: Revisar los espejos laterales durante al menos tres segundos.
    C: Girar la cabeza para asegurarse de que las áreas estén despejadas.
    D: Confiar en la cámara de marcha atrás de su vehículo.
  answer: C
  explanation: Antes de moverse para cambiar de carril, rebasar o hacer ciertos giros,
    debe girar la cabeza para asegurarse de que sus puntos ciegos estén despejados.
- id: 228
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo sigue demasiado de cerca?
  choices:
    A: Acelerar para aumentar la distancia.
    B: Tocar los frenos repetidamente para advertir al conductor.
    C: Reducir la velocidad y mantenerse a la derecha.
    D: Moverse al carril izquierdo y mantener su velocidad.
  answer: C
  explanation: El manual indica que si su vehículo es seguido demasiado de cerca,
    debe reducir la velocidad y mantenerse a la derecha.
- id: 229
  category: defensive_driving
  question: Si triplica su velocidad de conducción, ¿cuánto mayor será su distancia
    de frenado y el impacto?
  choices:
    A: 3 veces mayor.
    B: 6 veces mayor.
    C: 9 veces mayor.
    D: 12 veces mayor.
  answer: C
  explanation: Triplicar la velocidad significa que la distancia de frenado y el impacto
    son 9 veces mayores.
- id: 230
  category: safe_driving_rules
  question: En una parada de dos vías (señal de alto en dos direcciones), ¿quién tiene
    el derecho de paso cuando un vehículo está girando y otro sigue recto?
  choices:
    A: El vehículo que gira debe ceder el paso al vehículo que sigue recto.
    B: El vehículo que sigue recto debe ceder el paso al vehículo que gira.
    C: El vehículo que llega en segundo lugar tiene el derecho de paso.
    D: El vehículo de la izquierda siempre tiene el derecho de paso.
  answer: A
  explanation: En una parada de dos vías, el vehículo que gira cede el paso al vehículo
    que sigue recto.
- id: 231
  category: vehicle_information
  question: ¿Cuáles de los siguientes vehículos NO están permitidos en las autopistas
    de acceso limitado?
  choices:
    A: Motonetas (scooters) con una cilindrada de 150 centímetros cúbicos o menos
    B: Motocicletas con una cilindrada de 250 centímetros cúbicos
    C: Furgonetas de pasajeros
    D: Grúas
  answer: A
  explanation: Los peatones, autoestopistas, bicicletas, vehículos de tracción animal
    y los ciclos a motor/motonetas (con una cilindrada de 150 centímetros cúbicos
    o menos) no están permitidos en las autopistas de acceso limitado.
- id: 232
  category: safe_driving_rules
  question: ¿Qué debe hacer si llega al final del carril de aceleración al entrar
    a una autopista de acceso limitado?
  choices:
    A: Detenerse inmediatamente y esperar un espacio en el tráfico
    B: Ajustar su velocidad para incorporarse al tráfico de manera segura
    C: Forzar su entrada al carril derecho
    D: Retroceder e intentar entrar por la rampa de nuevo
  answer: B
  explanation: Debe ajustar su velocidad para incorporarse al tráfico de manera segura
    cuando llegue al final del carril de aceleración. No se detenga a menos que el
    tráfico sea demasiado denso y no haya espacio.
- id: 233
  category: defensive_driving
  question: ¿Qué tipo de colisión se considera el mayor peligro en las autopistas
    de acceso limitado?
  choices:
    A: Colisiones frontales
    B: Colisiones por alcance (choques por detrás)
    C: Colisiones laterales (roces)
    D: Vuelcos
  answer: B
  explanation: 'El manual indica: ''No siga a otros vehículos demasiado de cerca.
    Las colisiones por alcance son el mayor peligro en las autopistas de acceso limitado.'''
- id: 234
  category: sharing_the_road
  question: Según la Ley de Hacerse a un Lado (Move Over Law), ¿qué debe hacer en
    una vía de dos carriles al acercarse a un vehículo de emergencia estacionado con
    luces intermitentes?
  choices:
    A: Desocupar el carril más cercano al vehículo
    B: Detener su vehículo por completo hasta que se resuelva la emergencia
    C: Reducir la velocidad a 20 MPH por debajo del límite de velocidad publicado
    D: Mantener su velocidad pero tocar la bocina para alertar a los trabajadores
  answer: C
  explanation: En una vía de dos carriles, la Ley de Hacerse a un Lado (Move Over
    Law) requiere que reduzca la velocidad a 20 MPH por debajo del límite de velocidad
    publicado.
- id: 235
  category: sharing_the_road
  question: Si el límite de velocidad publicado es de 20 MPH o menos, ¿a qué velocidad
    debe viajar al pasar junto a un vehículo de servicios públicos estacionado con
    luces de advertencia en una carretera de dos carriles?
  choices:
    A: 15 MPH
    B: 10 MPH
    C: 5 MPH
    D: Debe detenerse por completo
  answer: C
  explanation: En una vía de dos carriles, si el límite de velocidad es de 20 MPH
    o menos, debe viajar a 5 MPH para cumplir con la Ley de Hacerse a un Lado (Move
    Over Law).
- id: 236
  category: safe_driving_rules
  question: Al estacionarse en paralelo junto a un bordillo (acera), ¿qué tan cerca
    deben estar las ruedas derechas del bordillo?
  choices:
    A: A no más de 6 pulgadas
    B: A no más de 12 pulgadas
    C: A no más de 18 pulgadas
    D: A no más de 24 pulgadas
  answer: B
  explanation: Debe estacionarse en paralelo al bordillo en la dirección del tráfico,
    con las ruedas derechas paralelas y a no más de 12 pulgadas del bordillo o borde
    de la calzada.
- id: 237
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante al estacionarse cuesta arriba con
    un bordillo (acera)?
  choices:
    A: Girar las ruedas hacia la derecha
    B: Girar las ruedas hacia el bordillo
    C: Girar las ruedas en dirección opuesta al bordillo
    D: Mantener las ruedas perfectamente rectas
  answer: C
  explanation: Al estacionarse cuesta arriba con un bordillo, debe girar las ruedas
    en dirección opuesta al bordillo.
- id: 238
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante (boca de incendios) es ilegal estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: Es ilegal estacionarse a menos de 15 pies de un hidrante (boca de incendios).
- id: 239
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es seguro regresar al lado derecho
    de la carretera?
  choices:
    A: Tan pronto como su parachoques delantero pase al otro vehículo
    B: Cuando pueda ver las llantas del vehículo rebasado en su espejo retrovisor
    C: Después de haber recorrido 100 pies más allá del vehículo
    D: Cuando el otro conductor parpadee sus faros
  answer: B
  explanation: No regrese al lado derecho de la carretera hasta que pueda ver las
    llantas del vehículo que rebasó en su espejo retrovisor.
- id: 240
  category: safe_driving_rules
  question: Al rebasar, ¿debe regresar al lado derecho de la carretera antes de acercarse
    a cuántos pies de cualquier vehículo que se aproxime?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Debe regresar al lado derecho de la carretera antes de acercarse a
    menos de 200 pies de cualquier vehículo que se aproxime.
- id: 241
  category: safe_driving_rules
  question: Usted NO debe rebasar en colinas o curvas donde no pueda ver al menos
    ¿a qué distancia hacia adelante?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: No debe rebasar en colinas o curvas donde no pueda ver al menos a 500
    pies hacia adelante.
- id: 242
  category: sharing_the_road
  question: ¿Qué exige la ley de Florida que haga si conduce por el carril izquierdo
    y un vehículo más rápido lo alcanza por detrás?
  choices:
    A: Aumentar su velocidad para igualar al vehículo que lo rebasa
    B: Salir del carril izquierdo
    C: Tocar los frenos para advertir al conductor
    D: Encender las luces de emergencia
  answer: B
  explanation: La ley de Florida establece que un conductor debe salir del carril
    izquierdo cuando es alcanzado por detrás por otro vehículo que viaja a mayor velocidad.
- id: 243
  category: safe_driving_rules
  question: ¿Bajo qué condición está legalmente permitido rebasar por la derecha?
  choices:
    A: Cuando el vehículo de adelante conduce demasiado lento en el carril derecho
    B: Cuando conduce en una carretera de un solo carril con un arcén ancho
    C: Cuando el vehículo que está rebasando está haciendo un giro a la izquierda
    D: Rebasar por la derecha nunca es legal
  answer: C
  explanation: Rebasar por la derecha solo es legal cuando hay dos o más carriles
    de tráfico moviéndose en la misma dirección o el vehículo que está rebasando está
    haciendo un giro a la izquierda.
- id: 244
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad estándar en un área municipal, comercial
    o residencial en Florida?
  choices:
    A: 20 MPH
    B: 30 MPH
    C: 45 MPH
    D: 55 MPH
  answer: B
  explanation: Según los Límites de Velocidad Estándar de Florida, la velocidad máxima
    en un área municipal, comercial o residencial es de 30 MPH a menos que se indique
    lo contrario.
- id: 245
  category: defensive_driving
  question: ¿Qué sucede con la fuerza de impacto cuando se duplica la velocidad de
    un automóvil?
  choices:
    A: Se duplica.
    B: Se triplica.
    C: Aumenta cuatro veces.
    D: Aumenta nueve veces.
  answer: C
  explanation: El manual establece que cuando se duplica la velocidad de un automóvil,
    su fuerza de impacto aumenta cuatro veces.
- id: 246
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad mínimo en una autopista donde el límite
    de velocidad publicado es de 70 MPH?
  choices:
    A: 40 MPH
    B: 45 MPH
    C: 50 MPH
    D: 55 MPH
  answer: C
  explanation: En las autopistas, cuando el límite de velocidad publicado es de 70
    MPH, el límite de velocidad mínimo es de 50 MPH.
- id: 247
  category: safe_driving_rules
  question: ¿Para qué se utiliza el carril central de una carretera de tres o cinco
    carriles?
  choices:
    A: Para rebasar vehículos más lentos
    B: Para vehículos de alta ocupación (HOV)
    C: Solo para vehículos de emergencia
    D: Solo para girar a la izquierda
  answer: D
  explanation: El carril central de una carretera de tres o cinco carriles se utiliza
    únicamente para girar a la izquierda.
- id: 248
  category: signs_and_signals
  question: ¿Qué significa si ve reflectores rojos frente a usted en las líneas del
    carril?
  choices:
    A: Se está acercando a una cabina de peaje.
    B: Está en el lado equivocado de la carretera.
    C: El carril está cerrado por construcción.
    D: Se está acercando a una línea de alto.
  answer: B
  explanation: Si ve reflectores rojos frente a usted en las líneas del carril, está
    en el lado equivocado de la carretera y podría tener una colisión frontal.
- id: 249
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe poner la luz direccional antes de hacer
    un giro?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 150 pies
    D: Al menos 200 pies
  answer: B
  explanation: Debe poner la luz direccional al menos 100 pies ANTES de hacer su giro.
- id: 250
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al carril
    correcto para terminar un giro?
  choices:
    A: Un giro a la izquierda siempre debe completarse en el carril más a la izquierda.
    B: Un giro a la derecha puede completarse en cualquier carril legalmente disponible.
    C: Un giro a la derecha debe terminarse en el carril derecho de la vía a la que
      se ingresa.
    D: Puede usar sus luces direccionales para indicar a los conductores detrás de
      usted que pueden rebasar.
  answer: C
  explanation: Debe terminar su giro en el carril correcto. Gire a la derecha hacia
    el carril derecho de la vía a la que ingresa. Un giro a la izquierda puede completarse
    en cualquier carril legalmente disponible.
- id: 251
  category: safe_driving_rules
  question: ¿Cuándo es apropiado hacer un giro de tres puntos?
  choices:
    A: En una curva o colina donde la visibilidad es baja.
    B: Solo si la calle es demasiado estrecha para dar una vuelta en U y no puede
      rodear la manzana.
    C: En una autopista para cambiar de dirección rápidamente.
    D: Siempre que haya una señal que prohíba las vueltas en U.
  answer: B
  explanation: Use un giro de tres puntos solo si la calle es demasiado estrecha para
    dar una vuelta en U y no puede rodear la manzana. Nunca debe hacer un giro de
    tres puntos en una curva, una colina, la autopista o donde las vueltas en U estén
    prohibidas.
- id: 252
  category: defensive_driving
  question: ¿Qué debe hacer si una colisión con un animal es inevitable?
  choices:
    A: Desviarse hacia el tráfico en sentido contrario para evitarlo.
    B: Desviarse de la calzada hacia el arcén.
    C: No se desvíe; mantenga su vehículo bajo control y en la calzada.
    D: Bloquear los frenos inmediatamente para detenerse lo más rápido posible.
  answer: C
  explanation: Si la colisión es inevitable, no se desvíe para evitar al animal. Mantenga
    su vehículo bajo control y en la calzada, ya que desviarse puede resultar en un
    choque más grave.
- id: 253
  category: safe_driving_rules
  question: ¿Qué luces debe usar al conducir en condiciones de poca visibilidad, como
    niebla o lluvia intensa?
  choices:
    A: Luces de estacionamiento
    B: Luces altas
    C: Luces bajas
    D: Luces de emergencia
  answer: C
  explanation: Conduzca con las luces bajas encendidas. Las luces altas se reflejarán
    en la niebla y empeorarán aún más la visibilidad. Las luces de estacionamiento
    no son un sustituto.
- id: 254
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando enciende los limpiaparabrisas bajo la lluvia?
  choices:
    A: Encender las luces de emergencia.
    B: Encender los faros.
    C: Aumentar la velocidad para despejar el agua de la banda de rodadura.
    D: Cambiar a una marcha más baja.
  answer: B
  explanation: 'El manual establece: ''Cuando encienda los limpiaparabrisas, encienda
    los faros''.'
- id: 255
  category: vehicle_information
  question: ¿Qué debe hacer si sus frenos se mojan después de conducir bajo lluvia
    intensa y no responden bien?
  choices:
    A: Bombear los frenos rápida y fuertemente.
    B: Hacerse a un lado y esperar a que se sequen al aire.
    C: Reducir la velocidad y presionar suavemente el pedal del freno hasta que vuelvan
      a funcionar.
    D: Conducir a mayor velocidad para generar calor en las pastillas de freno.
  answer: C
  explanation: Si los frenos se mojan, pueden tirar hacia un lado o no responder en
    absoluto. Si esto sucede, reduzca la velocidad y presione suavemente el pedal
    del freno hasta que sus frenos vuelvan a funcionar.
- id: 256
  category: safe_driving_rules
  question: ¿Hasta qué distancia pueden revelar objetos las luces altas?
  choices:
    A: 250 pies
    B: 300 pies
    C: 450 pies
    D: 500 pies
  answer: C
  explanation: Las luces altas pueden revelar objetos hasta una distancia de al menos
    450 pies y son más efectivas para velocidades superiores a 25 MPH.
- id: 257
  category: sharing_the_road
  question: ¿A qué vehículos se les permite usar los carriles para Vehículos de Alta
    Ocupación (HOV)?
  choices:
    A: Cualquier vehículo que viaje por encima del límite de velocidad.
    B: Vehículos con dos o más ocupantes o vehículos híbridos/de bajas emisiones registrados.
    C: Solo camiones comerciales y autobuses.
    D: Vehículos que se preparan para girar a la izquierda.
  answer: B
  explanation: Algunas autopistas reservan el carril izquierdo para vehículos con
    dos o más ocupantes o vehículos híbridos/de bajas emisiones (LEV).
- id: 258
  category: safe_driving_rules
  question: ¿Qué debe hacer si llega a una calle inundada?
  choices:
    A: Conducir a través de ella lentamente para evitar salpicar.
    B: Dar la vuelta y buscar otra ruta.
    C: Cambiar a una marcha más baja y proceder con precaución.
    D: Esperar a que un vehículo más grande cruce primero y seguir su camino.
  answer: B
  explanation: Si llega a una calle inundada, dé la vuelta y busque otra ruta. No
    intente conducir a través del agua, ya que su vehículo podría quedar sumergido
    o ser arrastrado.
- id: 259
  category: safe_driving_rules
  question: Según la ley de Florida, ¿a qué distancia de un vehículo que se aproxima
    en sentido contrario no debe usar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: La ley de Florida establece que no debe usar las luces altas a menos
    de 500 pies de un vehículo que se aproxima en sentido contrario; use las luces
    bajas.
- id: 260
  category: safe_driving_rules
  question: 'Al conducir detrás de otro vehículo por la noche, debe cambiar a luces
    bajas si se encuentra a menos de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: La ley de Florida requiere que no use las luces altas a menos de 300
    pies del vehículo que va delante de usted; use las luces bajas.
- id: 261
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de las luces de estacionamiento en Florida?
  choices:
    A: Puede conducir usando solo las luces de estacionamiento al amanecer o al anochecer.
    B: Debe encenderlas al estacionar en una vía fuera de las ciudades por la noche.
    C: Deben usarse en lugar de las luces bajas en caso de niebla espesa.
    D: Debe usarlas al acercarse a un vehículo que viene en sentido contrario.
  answer: B
  explanation: La ley de Florida establece que debe encender las luces de estacionamiento
    por la noche al estacionar en una vía o arcén fuera de las ciudades y pueblos,
    y no debe conducir usando solo las luces de estacionamiento en lugar de los faros
    delanteros.
- id: 262
  category: defensive_driving
  question: Según el manual, ¿dónde ocurren los choques con más frecuencia que en
    cualquier otro lugar?
  choices:
    A: Autopistas
    B: Estacionamientos
    C: Intersecciones
    D: Zonas escolares
  answer: C
  explanation: Debe tener especial precaución al acercarse a una intersección, ya
    que los choques ocurren en las intersecciones con más frecuencia que en cualquier
    otro lugar.
- id: 263
  category: defensive_driving
  question: Si un choque es inevitable, ¿cuál de las siguientes es la mejor opción
    de manejo defensivo?
  choices:
    A: Desviarse hacia el tráfico en sentido contrario en lugar de salirse de la vía.
    B: Chocar contra un objeto sólido como un árbol en lugar de un objeto blando.
    C: Chocar contra un vehículo que se mueve en la misma dirección en lugar de chocar
      de frente contra un vehículo.
    D: Derrapar fuera de la vía en lugar de salirse de la vía conduciendo.
  answer: C
  explanation: Si un choque es inevitable, chocar contra un vehículo que se mueve
    en su misma dirección es mejor que chocar de frente contra un vehículo.
- id: 264
  category: driver_responsibility
  question: ¿Qué debe hacer si es detenido por las autoridades policiales por la noche?
  choices:
    A: Apagar los faros delanteros inmediatamente.
    B: Encender las luces interiores para ayudar con la visibilidad.
    C: Salir del vehículo para saludar al oficial.
    D: Buscar el registro en la guantera antes de que el oficial se acerque.
  answer: B
  explanation: Durante una parada de tráfico por la noche, debe encender las luces
    interiores para ayudar con la visibilidad.
- id: 265
  category: penalties_and_points
  question: ¿Qué significa su firma en una multa de tráfico?
  choices:
    A: Una admisión de culpa.
    B: Una renuncia a su derecho a una audiencia en la corte.
    C: La aceptación de la multa, pero no una admisión de culpa.
    D: Un acuerdo para pagar la multa en un plazo de 10 días.
  answer: C
  explanation: Su aceptación y firma en una multa de tráfico no es una admisión de
    culpa. Sin embargo, negarse a firmar una multa de tráfico puede resultar en su
    arresto.
- id: 266
  category: driver_responsibility
  question: Si tiene un arma en su vehículo durante una parada de tráfico, ¿cuándo
    debe informárselo al oficial?
  choices:
    A: Solo si el oficial pide registrar el vehículo.
    B: En el primer contacto con el oficial.
    C: Después de entregar su licencia de conducir y el registro.
    D: No está obligado a revelar esta información.
  answer: B
  explanation: Cuando el oficial se acerque al vehículo, recuerde informarle si tiene
    un arma en el vehículo en el primer contacto.
- id: 267
  category: driver_responsibility
  question: ¿Qué debe hacer si tiene un choque menor y su vehículo está bloqueando
    el flujo del tráfico?
  choices:
    A: Dejar el vehículo exactamente donde está hasta que llegue la policía.
    B: Moverlo o hacer que lo muevan.
    C: Esperar a una grúa antes de intentar moverlo.
    D: Pararse en la vía para dirigir el tráfico alrededor de él.
  answer: B
  explanation: Si el choque es menor y su vehículo está bloqueando el flujo del tráfico,
    debe moverlo o hacer que lo muevan.
- id: 268
  category: driver_responsibility
  question: Si un choque resulta en daños al vehículo pero no requiere un informe
    policial, ¿cuánto tiempo tiene para presentar un informe por escrito al FLHSMV?
  choices:
    A: 24 horas
    B: 3 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Si el choque resulta en daños al vehículo o a la propiedad y no requiere
    un informe policial, debe presentar un informe por escrito del choque al FLHSMV
    dentro de 10 días.
- id: 269
  category: driver_responsibility
  question: Si choca contra un vehículo desatendido y no puede localizar al propietario,
    ¿qué debe hacer?
  choices:
    A: Esperar junto al vehículo hasta que regrese el propietario.
    B: Dejar una nota con su nombre, información de contacto y número de placa.
    C: Llamar a su compañía de seguros y abandonar el lugar.
    D: Reportarlo al DMV dentro de 30 días.
  answer: B
  explanation: Si no puede localizar al propietario, debe dejar una nota que incluya
    su nombre, información de contacto y número de placa (registro).
- id: 270
  category: penalties_and_points
  question: ¿Cuál es la sanción por abandonar el lugar de un choque que resulta en
    muerte?
  choices:
    A: Delito grave de 1er grado y un mínimo de 4 años de prisión.
    B: Delito grave de 2do grado y un mínimo de 2 años de prisión.
    C: Delito grave de 3er grado y suspensión de la licencia por 1 año.
    D: Delito menor de 1er grado y una multa de $5,000.
  answer: A
  explanation: Si abandona el lugar y resulta en muerte, es un delito grave de 1er
    grado con un mínimo de 4 años de prisión.
- id: 271
  category: penalties_and_points
  question: 'Abandonar la escena de un choque que resulte en lesiones, lesiones corporales
    graves o la muerte resultará en la pérdida de su licencia de conducir por un mínimo
    de:'
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: C
  explanation: Abandonar la escena de un choque que resulte en lesiones, lesiones
    corporales graves o la muerte incluye la pérdida de su licencia de conducir por
    un mínimo de 3 años.
- id: 272
  category: safe_driving_rules
  question: ¿Cómo debe tratar a una persona herida por estado de shock después de
    un choque?
  choices:
    A: Darle mucha agua para beber.
    B: Hacer que se siente erguida y mantenerla fresca.
    C: Hacer que se acueste boca arriba, elevarle las piernas y cubrirla con mantas.
    D: Moverla inmediatamente a un lado de la carretera.
  answer: C
  explanation: Para tratar el estado de shock, haga que la persona se acueste boca
    arriba y eleve sus piernas, cúbrala con mantas para conservar el calor corporal,
    manténgala calmada y no le dé nada de beber.
- id: 273
  category: defensive_driving
  question: ¿Cuál es la distancia mínima de seguimiento recomendada para evitar colisiones
    por detrás en condiciones normales?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Para evitar golpear al vehículo que va delante de usted, mantenga una
    distancia de seguimiento de al menos cuatro segundos y auméntela durante condiciones
    climáticas desfavorables o tráfico pesado.
- id: 274
  category: safe_driving_rules
  question: Si su vehículo se descompone, ¿a qué distancia en cada dirección debe
    ser visible cuando esté estacionado?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Si es posible, estacione donde el vehículo averiado pueda ser visto
    a 200 pies en cada dirección.
- id: 275
  category: vehicle_information
  question: ¿Cómo debe detenerse en una situación de emergencia si su vehículo está
    equipado con frenos antibloqueo (ABS)?
  choices:
    A: Bombear los frenos rápidamente.
    B: Presionar firmemente el pedal del freno, mantenerlo presionado y maniobrar
      para salir del peligro.
    C: Tocar ligeramente los frenos mientras maniobra.
    D: Aplicar el freno de estacionamiento inmediatamente.
  answer: B
  explanation: Los conductores con frenos antibloqueo (ABS) deben presionar firmemente
    el pedal del freno, mantenerlo presionado y maniobrar para salir del peligro.
    Si el conductor bombea los frenos, el sistema ABS se desactivará.
- id: 276
  category: defensive_driving
  question: ¿Qué NUNCA debe hacer si está tratando de extinguir el incendio de un
    vehículo?
  choices:
    A: Llamar al 911 para pedir ayuda.
    B: Usar un extintor de incendios portátil.
    C: Aplicar agua a un fuego de gasolina o diésel.
    D: Salir del vehículo inmediatamente.
  answer: C
  explanation: Intente extinguir el fuego solo si tiene un extintor portátil y el
    fuego es pequeño. NUNCA aplique agua a un fuego de gasolina o diésel.
- id: 277
  category: defensive_driving
  question: ¿Cuál es el primer paso que debe tomar si su pedal del acelerador se atasca?
  choices:
    A: Apagar el motor inmediatamente.
    B: Pisar los frenos a fondo.
    C: Cambiar a la posición de estacionamiento (Park).
    D: Quitar el pie del pedal del acelerador.
  answer: D
  explanation: Si su pedal del acelerador se atasca, el primer paso es quitar el pie
    del pedal del acelerador, seguido de presionar el embrague o cambiar a neutral.
- id: 278
  category: safe_driving_rules
  question: ¿Cómo debe tratar una intersección donde los semáforos están inactivos
    debido a un corte de energía?
  choices:
    A: Tratarla como una señal de ceda el paso.
    B: Tratarla como una parada de cuatro vías (four-way stop).
    C: Continuar sin detenerse si está en la carretera principal.
    D: Esperar a que llegue la policía antes de cruzar.
  answer: B
  explanation: En circunstancias donde no hay energía y los semáforos no están activos,
    trate las intersecciones como una parada de cuatro vías (four-way stop).
- id: 279
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a patinar o a planear sobre el
    agua (hydroplane)?
  choices:
    A: Pisar los frenos a fondo inmediatamente.
    B: Girar las llantas delanteras en la dirección opuesta al patinazo.
    C: Quitar el pie del pedal del acelerador y maniobrar en la dirección del patinazo.
    D: Acelerar para recuperar la tracción.
  answer: C
  explanation: Si patina o planea sobre el agua (hydroplane), quite el pie del pedal
    del acelerador, no use los frenos si es posible, y gire las llantas delanteras
    del vehículo en la dirección a la que desea ir (maniobre en la dirección del patinazo).
- id: 280
  category: defensive_driving
  question: Si su vehículo se apaga en las vías del tren y se acerca un tren, ¿en
    qué dirección debe correr?
  choices:
    A: En la misma dirección en la que viaja el tren.
    B: En un ángulo de 45 grados alejándose de las vías, en dirección hacia el tren.
    C: En un ángulo de 45 grados alejándose de las vías, en dirección opuesta al tren.
    D: Perpendicular a las vías.
  answer: B
  explanation: Si viene un tren, corra en un ángulo de 45 grados alejándose de las
    vías, pero en dirección hacia el tren; será menos probable que sea golpeado por
    su vehículo o por los escombros de la colisión.
- id: 281
  category: defensive_driving
  question: ¿Aproximadamente cuánto tiempo flotará un vehículo en la superficie si
    choca y cae en un cuerpo de agua?
  choices:
    A: De 10 a 20 segundos
    B: De 30 a 60 segundos
    C: De 2 a 3 minutos
    D: 5 minutos
  answer: B
  explanation: Si choca y cae en un estanque, río u otro cuerpo de agua, su vehículo
    solo flotará en la superficie de 30 a 60 segundos. Debe salir inmediatamente.
- id: 282
  category: defensive_driving
  question: ¿Cuál es la respuesta adecuada ante un reventón de neumático?
  choices:
    A: Frenar bruscamente y girar hacia el arcén.
    B: Quitar el pie del acelerador, concentrarse en la dirección y frenar suavemente
      cuando tenga el control.
    C: Acelerar ligeramente para mantener el impulso.
    D: Bombear los frenos rápidamente.
  answer: B
  explanation: Durante un reventón de neumático, quite el pie del acelerador, no use
    los frenos, concéntrese en la dirección, disminuya la velocidad gradualmente y
    frene suavemente cuando el automóvil esté bajo control.
- id: 283
  category: vehicle_information
  question: ¿Cómo puede secar los frenos mojados?
  choices:
    A: Conducir a alta velocidad para secarlos al aire.
    B: Cambiar a punto muerto (neutral) y dejarse llevar.
    C: Conducir lentamente en marcha baja y aplicar los frenos.
    D: Bombear los frenos rápidamente mientras está detenido.
  answer: C
  explanation: Puede secar los frenos mojados conduciendo lentamente en marcha baja
    y aplicando los frenos.
- id: 284
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima de separación que la ley de Florida exige
    a los conductores dar a los ciclistas al conducir junto a ellos o rebasarlos?
  choices:
    A: Dos pies
    B: Tres pies
    C: Cuatro pies
    D: Cinco pies
  answer: B
  explanation: La ley de Florida exige que se dé a los ciclistas un mínimo de tres
    pies de separación y que se tenga precaución/se reduzca la velocidad al conducir
    junto a ellos o rebasarlos.
- id: 285
  category: sharing_the_road
  question: Cuando deba cruzar un carril para bicicletas para hacer un giro, ¿cuál
    es el procedimiento adecuado?
  choices:
    A: Acelerar para rebasar al ciclista antes de girar.
    B: Tocar la bocina para advertir al ciclista que ceda el paso.
    C: Ceder el paso a cualquier ciclista y hacer el giro detrás del ciclista.
    D: Hacer el giro delante del ciclista.
  answer: C
  explanation: Cuando deba cruzar un carril para bicicletas para hacer un giro, ceda
    el paso a cualquier ciclista y haga su giro detrás del ciclista.
- id: 286
  category: sharing_the_road
  question: ¿Bajo qué condición puede un ciclista usar todo el carril de circulación?
  choices:
    A: Solo cuando viaja exactamente al límite de velocidad.
    B: Cuando el carril es demasiado estrecho para que un automóvil y una bicicleta
      lo compartan de manera segura.
    C: Solo en autopistas de acceso limitado.
    D: Siempre que prefieran no usar el carril para bicicletas.
  answer: B
  explanation: Un ciclista puede usar todo el carril incluso si viaja por debajo de
    la velocidad del tráfico si el carril es demasiado estrecho para que un automóvil
    y una bicicleta lo compartan.
- id: 287
  category: sharing_the_road
  question: Entre el atardecer y el amanecer, ¿qué iluminación se requiere en la parte
    trasera de una bicicleta?
  choices:
    A: Un reflector rojo y una luz roja visible desde 600 pies
    B: Una luz blanca visible desde 500 pies
    C: Una luz roja visible desde 300 pies
    D: Luces intermitentes de peligro
  answer: A
  explanation: El manual establece que, entre el atardecer y el amanecer, los ciclistas
    deben tener un reflector rojo y una luz roja visible desde 600 pies en la parte
    trasera de su bicicleta.
- id: 288
  category: safe_driving_rules
  question: ¿Cuál es la regla sobre el uso de auriculares mientras se anda en bicicleta
    en la vía pública?
  choices:
    A: Están permitidos si el volumen se mantiene bajo
    B: Están permitidos solo cuando se conduce por las aceras
    C: Los ciclistas no deben usar auriculares o audífonos en ambos oídos
    D: Los ciclistas pueden usarlos si son mayores de 18 años
  answer: C
  explanation: Según el manual, los ciclistas no deben usar auriculares/audífonos
    en ambos oídos mientras andan en bicicleta en la vía pública.
- id: 289
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a un vehículo motorizado comercial (CMV)
    en una pendiente descendente?
  choices:
    A: Es más probable que los frenos del CMV fallen en una pendiente descendente
    B: El peso y el impulso del CMV harán que aumente su velocidad
    C: El conductor del CMV no puede verlo en sus espejos en una pendiente descendente
    D: Es ilegal rebasar a cualquier vehículo en una pendiente descendente
  answer: B
  explanation: El manual aconseja evitar rebasar a un CMV en una pendiente descendente
    porque su peso y su impulso harán que aumente su velocidad.
- id: 290
  category: sharing_the_road
  question: 'Cuando un vehículo motorizado comercial (CMV) se prepara para hacer un
    giro a la derecha, usted debe:'
  choices:
    A: Rebasar al CMV por el lado derecho rápidamente
    B: Tocar la bocina para que el conductor sepa que usted está ahí
    C: No conducir entre el CMV y el bordillo (acera)
    D: Moverse al carril izquierdo para rebasarlo inmediatamente
  answer: C
  explanation: Los CMV a menudo necesitan abrirse hacia la izquierda para poder hacer
    un giro a la derecha. El manual advierte que no se debe conducir entre el CMV
    y el bordillo porque no podrán verlo.
- id: 291
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando se acerca un vehículo de emergencia usando sirenas
    o luces intermitentes?
  choices:
    A: Reducir la velocidad a 10 MPH y encender las luces de emergencia
    B: Hacerse a un lado en el borde más cercano de la calzada inmediatamente y detenerse
    C: Detenerse exactamente donde está en su carril actual
    D: Acelerar para despejar el camino delante del vehículo de emergencia
  answer: B
  explanation: Los conductores deben ceder el paso a los vehículos de emergencia que
    usan sirenas o luces intermitentes haciéndose a un lado en el borde más cercano
    de la calzada inmediatamente y deteniéndose hasta que el vehículo haya pasado.
- id: 292
  category: sharing_the_road
  question: ¿Cómo indican los vehículos en un cortejo fúnebre a otros conductores
    que no conduzcan entre ellos?
  choices:
    A: Tocando la bocina continuamente
    B: Conduciendo con los faros encendidos o usando las luces intermitentes de emergencia
    C: Colocando una bandera negra en la antena de su vehículo
    D: Conduciendo exactamente a 15 MPH
  answer: B
  explanation: Todos los vehículos en un cortejo fúnebre deben tener los faros encendidos
    o pueden usar las luces intermitentes de emergencia como señal para que otros
    no conduzcan entre el cortejo.
- id: 293
  category: license_system
  question: ¿Qué se requiere para que una persona de 18 años o más conduzca un carrito
    de golf en una vía pública?
  choices:
    A: Solo una licencia de conducir válida
    B: Una licencia de conducir comercial
    C: Una forma válida de identificación con fotografía emitida por el gobierno
    D: Un permiso especial para carritos de golf
  answer: C
  explanation: El manual establece que los conductores de 18 años o más deben poseer
    una forma válida de identificación con fotografía emitida por el gobierno para
    conducir un carrito de golf en una vía pública.
- id: 294
  category: safe_driving_rules
  question: ¿Bajo qué condiciones puede un carrito de golf cruzar una carretera estatal?
  choices:
    A: Si el límite de velocidad es de 55 MPH o menos
    B: En cualquier intersección, independientemente de los dispositivos de control
      de tráfico
    C: Solo si el carrito de golf tiene una velocidad máxima de 25 MPH
    D: Si el límite de velocidad publicado es de 45 MPH o menos y en una intersección
      con un dispositivo de control de tráfico
  answer: D
  explanation: Puede cruzar carreteras estatales en un carrito de golf si el límite
    de velocidad publicado es de 45 MPH o menos y solo en una intersección con un
    dispositivo de control de tráfico.
- id: 295
  category: vehicle_information
  question: ¿En qué tipos de calles se permite operar vehículos de baja velocidad
    (LSV)?
  choices:
    A: Calles con un límite de velocidad publicado de 35 MPH o menos
    B: Calles con un límite de velocidad publicado de 45 MPH o menos
    C: Cualquier calle excepto las autopistas interestatales
    D: Solo en caminos privados y campos de golf
  answer: A
  explanation: Los vehículos de baja velocidad (LSV) solo deben operarse en calles
    con un límite de velocidad publicado de 35 MPH o menos.
- id: 296
  category: sharing_the_road
  question: ¿Por qué no debe seguir muy de cerca a una motocicleta?
  choices:
    A: Las motocicletas se apagan con frecuencia en el tráfico pesado
    B: Tienen la capacidad de detenerse más rápido que otros vehículos
    C: Los gases de escape pueden afectar su visibilidad
    D: Se requiere que las motocicletas conduzcan por debajo del límite de velocidad
  answer: B
  explanation: El manual aconseja no seguir muy de cerca a una motocicleta porque
    tienen la capacidad de detenerse más rápido que otros vehículos.
- id: 297
  category: defensive_driving
  question: ¿Cómo podría un motociclista reducir la velocidad sin activar su luz de
    freno?
  choices:
    A: Aplicando solo el freno delantero
    B: Arrastrando los pies por el suelo
    C: Reduciendo la marcha o soltando el acelerador
    D: Apagando el motor
  answer: C
  explanation: Los motociclistas a menudo reducen la velocidad reduciendo la marcha
    o soltando el acelerador, lo cual no activa la luz de freno.
- id: 298
  category: sharing_the_road
  question: Al andar en bicicleta por una acera o cruce peatonal, ¿qué debe hacer
    el ciclista antes de rebasar a un peatón?
  choices:
    A: Bajarse y caminar con la bicicleta para rebasar al peatón
    B: Dar una señal audible antes de rebasar
    C: Parpadear su luz blanca delantera
    D: Rebasar solo por el lado derecho
  answer: B
  explanation: Ya sea que circulen por una acera o un cruce peatonal, los ciclistas
    deben ceder el paso a los peatones y deben dar una señal audible antes de rebasar.
- id: 299
  category: safe_driving_rules
  question: ¿Qué debe evitar hacer al seguir a un vehículo motorizado comercial (CMV)
    de noche?
  choices:
    A: Conducir en el carril derecho
    B: Usar las luces altas
    C: Parpadear los faros para indicar que va a rebasar
    D: Mantener una distancia de seguimiento de cuatro segundos
  answer: B
  explanation: No debe usar las luces altas al seguir a un CMV de noche porque las
    luces brillantes cegarán al conductor cuando se reflejen en los grandes espejos
    laterales del CMV.
- id: 300
  category: sharing_the_road
  question: ¿Cuál es la regla para los conductores de automóviles con respecto a compartir
    un carril con una motocicleta?
  choices:
    A: Puede compartir el carril si la motocicleta circula en el extremo derecho
    B: Puede compartir el carril si conduce un automóvil compacto
    C: No debe intentar compartir un carril con una motocicleta
    D: Puede compartir el carril durante una fuerte congestión de tráfico
  answer: C
  explanation: Los conductores de automóviles no deben intentar compartir un carril
    con una motocicleta. El motociclista tiene derecho a todo el carril.
- id: 301
  category: safe_driving_rules
  question: ¿Qué se requiere cuando un ciclista transporta a un niño menor de cuatro
    años o que pesa 40 libras o menos?
  choices:
    A: El niño debe viajar en el manubrio
    B: El ciclista debe usar una mochila/portabebés, un asiento infantil o un remolque
      diseñado para transportar niños
    C: El niño debe poder alcanzar los pedales
    D: El niño debe viajar en una bicicleta separada
  answer: B
  explanation: Si transporta a un niño menor de cuatro años o que pesa 40 libras o
    menos, los ciclistas deben usar una mochila/portabebés, un asiento infantil o
    un remolque diseñado para transportar niños.
- id: 302
  category: license_system
  question: ¿Cuál es la edad mínima requerida para operar una motocicleta o ciclomotor
    en una vía pública en Florida?
  choices:
    A: 15 años
    B: 16 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: Según el manual, debe tener 16 años de edad o más para operar una motocicleta
    o ciclomotor en una vía pública.
- id: 303
  category: license_system
  question: ¿Qué tipo de licencia se requiere para operar un ciclomotor?
  choices:
    A: Una licencia solo para motocicletas
    B: Una licencia de conducir de Clase E con un endoso de motocicleta
    C: Una licencia de conducir de Clase E
    D: Una Licencia de Conducir Comercial (CDL)
  answer: C
  explanation: Los operadores de ciclomotores deben tener una licencia de conducir
    de Clase E. No se requiere un endoso de motocicleta.
- id: 304
  category: safe_driving_rules
  question: ¿Bajo qué condiciones un operador de motocicleta está exento de usar casco?
  choices:
    A: Si tiene 18 años o más y tiene un endoso de motocicleta válido
    B: Si tiene 21 años o más Y cuenta con una póliza de seguro médico que proporcione
      al menos $10,000 en beneficios médicos por lesiones
    C: Si conduce a menos de 30 MPH en una zona residencial
    D: Si cuenta con un seguro de Protección contra Lesiones Personales (PIP)
  answer: B
  explanation: Los operadores de motocicletas deben usar casco a menos que tengan
    21 años o más Y cuenten con una póliza de seguro médico que proporcione al menos
    $10,000 en beneficios médicos por lesiones.
- id: 305
  category: sharing_the_road
  question: ¿Qué debe hacer si se acerca por detrás a un vehículo que está detenido
    en un cruce peatonal?
  choices:
    A: Tocar la bocina para alertar al conductor que se mueva
    B: Rebasar al vehículo por la izquierda si el carril está despejado
    C: Asumir que un peatón puede estar cruzando y no adelantar ni rebasar al vehículo
      detenido
    D: Rebasar al vehículo lentamente por el lado derecho
  answer: C
  explanation: No puede adelantar ni rebasar a un vehículo que está detenido en un
    cruce peatonal. Un conductor que se acerca por detrás debe asumir que un peatón
    puede estar cruzando, incluso cuando no se vea a ninguno.
- id: 306
  category: safe_driving_rules
  question: Si no hay una acera disponible, ¿por dónde debe caminar un peatón en una
    vía?
  choices:
    A: En el arcén (hombro) derecho, moviéndose con el tráfico
    B: En el arcén (hombro) izquierdo, de frente al tráfico
    C: En el centro del carril
    D: En cualquier arcén, siempre y cuando use ropa reflectante
  answer: B
  explanation: Al caminar por una vía sin acera, los peatones siempre deben caminar
    por el arcén del lado izquierdo, de frente al tráfico.
- id: 307
  category: sharing_the_road
  question: ¿Cuándo debe un conductor ceder el derecho de paso a un autobús de transporte
    público?
  choices:
    A: Siempre que el autobús viaje en dirección opuesta
    B: Cuando el autobús viaja en la misma dirección, ha puesto la luz direccional
      y se está reincorporando al flujo de tráfico desde una bahía de parada específicamente
      designada
    C: Solo cuando el autobús muestra una señal de alto roja intermitente
    D: Siempre que el autobús esté detenido en un semáforo en rojo
  answer: B
  explanation: Todos los conductores deben ceder el derecho de paso a los autobuses
    de transporte público que viajan en la misma dirección, que han puesto la luz
    direccional y se están reincorporando al flujo de tráfico desde una bahía de parada
    específicamente designada.
- id: 308
  category: safe_driving_rules
  question: ¿Cuándo NO está obligado a detenerse ante un autobús escolar que está
    recogiendo o dejando niños?
  choices:
    A: Cuando se mueve en dirección opuesta en una carretera dividida por una barrera
      elevada o una mediana sin pavimentar de al menos cinco pies de ancho
    B: Cuando se mueve en dirección opuesta en una carretera dividida por líneas pintadas
    C: Cuando se mueve en la misma dirección que el autobús en una carretera de varios
      carriles
    D: Cuando conduce en una calle de doble sentido y el autobús está en el otro lado
  answer: A
  explanation: Si la carretera está dividida por una barrera elevada o una mediana
    sin pavimentar de al menos cinco pies de ancho, no tiene que detenerse si se mueve
    en dirección opuesta al autobús.
- id: 309
  category: sharing_the_road
  question: ¿Una línea pintada o marca en el pavimento de una carretera cuenta como
    una barrera que exime a los conductores en dirección opuesta de detenerse ante
    un autobús escolar?
  choices:
    A: Sí, si la línea pintada es amarilla continua
    B: Sí, si es una doble línea blanca continua
    C: No, las líneas pintadas o marcas en el pavimento no se consideran barreras
    D: Sí, siempre y cuando la carretera tenga al menos cuatro carriles
  answer: C
  explanation: Las líneas pintadas o marcas en el pavimento no se consideran barreras.
    Los conductores en dirección opuesta deben detenerse a menos que haya una barrera
    elevada o una mediana sin pavimentar de al menos cinco pies de ancho.
- id: 310
  category: vehicle_information
  question: Los vehículos agrícolas diseñados para operar a velocidades inferiores
    a 25 MPH deben mostrar un letrero de vehículo de movimiento lento en la parte
    trasera cuando usan ¿cuál de las siguientes opciones?
  choices:
    A: Autopistas de acceso limitado e interestatales
    B: Carreteras públicas (no de acceso limitado/interestatales)
    C: Ciclovías y senderos peatonales
    D: Solo caminos privados
  answer: B
  explanation: Los vehículos agrícolas diseñados para operar a velocidades inferiores
    a 25 MPH deben mostrar este letrero en la parte trasera cuando usan carreteras
    públicas (no de acceso limitado/interestatales).
- id: 311
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al acercarse a un peatón con discapacidad
    visual que lleva un bastón blanco con la punta roja?
  choices:
    A: Tocar la bocina para advertir al peatón
    B: Reducir la velocidad y rebasar con cuidado por la izquierda
    C: Detenerse por completo, ceder el paso y tener extrema precaución
    D: Continuar al límite de velocidad normal si el peatón no está en un cruce peatonal
  answer: C
  explanation: Los conductores deben detenerse por completo, ceder el paso y tener
    extrema precaución al acercarse a un peatón con discapacidad visual que lleva
    un bastón blanco con la punta roja.
- id: 312
  category: vehicle_information
  question: ¿Qué tipo de seguro NO están obligados a tener los operadores de motocicletas
    y ciclomotores en Florida?
  choices:
    A: Responsabilidad civil por daños a la propiedad
    B: Seguro de protección contra lesiones personales (PIP)
    C: Responsabilidad civil por lesiones corporales
    D: Seguro de colisión
  answer: B
  explanation: Los operadores de motocicletas y ciclomotores no tienen que tener seguro
    de protección contra lesiones personales (PIP).
- id: 313
  category: safe_driving_rules
  question: Cuando hay niños o guardias de cruce escolar presentes en un cruce peatonal,
    ¿dónde debe detenerse un conductor?
  choices:
    A: Dentro del cruce peatonal
    B: En la línea de alto y no en el cruce peatonal
    C: Al menos a 20 pies antes de la intersección
    D: Solo si el guardia de cruce levanta una señal roja de alto
  answer: B
  explanation: Cuando hay niños o guardias de cruce escolar presentes en un cruce
    peatonal, debe ceder el paso y detenerse en la línea de alto y no dentro del cruce
    peatonal.
- id: 314
  category: sharing_the_road
  question: ¿Qué debe hacer al entrar o salir de un callejón, entrada de vehículos
    o camino privado?
  choices:
    A: Tocar la bocina y continuar sin detenerse
    B: Detenerse para ceder el paso a los peatones en la acera
    C: Ceder el paso solo a los vehículos en la vía principal
    D: Parpadear las luces delanteras para advertir a los peatones
  answer: B
  explanation: Al entrar o salir de un callejón, entrada de vehículos o camino privado,
    debe detenerse para ceder el paso a los peatones en la acera.
- id: 315
  category: license_system
  question: Si es menor de 18 años, ¿qué se requiere antes de que se le pueda emitir
    una licencia exclusiva para motocicletas (Motorcycle Only license)?
  choices:
    A: Debe tener una licencia de aprendizaje durante 6 meses sin condenas por infracciones
      de tránsito
    B: Debe tener una licencia de aprendizaje durante 12 meses sin condenas por infracciones
      de tránsito
    C: Debe tener a un padre viajando con usted en todo momento
    D: Debe completar 50 horas de conducción supervisada
  answer: B
  explanation: Si es menor de 18 años, debe tener una licencia de aprendizaje durante
    12 meses sin condenas por infracciones de tránsito antes de la emisión de una
    licencia exclusiva para motocicletas.
- id: 316
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima a la que puede estacionarse de un bordillo
    (acera)?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Según las reglas de estacionamiento de Florida, cuando se estaciona
    en paralelo a un bordillo, sus ruedas no deben estar a más de 12 pulgadas de distancia
    del bordillo.
- id: 317
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas si se estaciona cuesta abajo?
  choices:
    A: Hacia el bordillo o borde de la carretera
    B: Lejos del bordillo
    C: Recto hacia adelante
    D: Ligeramente hacia la izquierda
  answer: A
  explanation: Al estacionarse cuesta abajo, debe girar las ruedas hacia el bordillo
    o borde de la carretera para que el vehículo ruede fuera de la vía si fallan los
    frenos.
- id: 318
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que debe dejar un automovilista al viajar
    junto a un ciclista?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: La ley de Florida exige que los automovilistas dejen un mínimo de 3
    pies de espacio libre al conducir junto a un ciclista o al rebasarlo.
- id: 319
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene para dejar niños en una carretera
    dividida por una barrera elevada, ¿están obligados a detenerse los vehículos que
    viajan en dirección opuesta?
  choices:
    A: Sí, todo el tráfico debe detenerse por un autobús escolar.
    B: Sí, a menos que estén en el carril del extremo derecho.
    C: No, los vehículos que viajan en dirección opuesta no están obligados a detenerse.
    D: No, pero deben reducir la velocidad a 15 mph.
  answer: C
  explanation: Si la carretera está dividida por una barrera elevada o una mediana
    sin pavimentar de al menos 5 pies de ancho, los vehículos que viajan en dirección
    opuesta al autobús escolar no tienen que detenerse.
- id: 320
  category: sharing_the_road
  question: ¿Qué es una 'No Zone' (Zona ciega)?
  choices:
    A: Un área donde el estacionamiento está estrictamente prohibido.
    B: Una zona donde es ilegal rebasar.
    C: Los grandes puntos ciegos alrededor de los vehículos comerciales y camiones.
    D: Una zona escolar durante el horario activo.
  answer: C
  explanation: Una 'No Zone' se refiere a los grandes puntos ciegos en la parte delantera,
    trasera y en los lados de un vehículo comercial o camión donde el conductor no
    puede ver a otros vehículos.
- id: 321
  category: safe_driving_rules
  question: Por la noche, ¿a cuántos pies de distancia al acercarse a un vehículo
    por la parte trasera debe bajar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Debe cambiar las luces altas a luces bajas cuando se encuentre a menos
    de 300 pies de un vehículo al que se acerca por la parte trasera.
- id: 322
  category: safe_driving_rules
  question: Al conducir bajo la lluvia, niebla o humo durante el día, ¿qué luces debe
    usar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Luces de estacionamiento
    D: Luces de emergencia
  answer: B
  explanation: Debe usar las luces bajas al conducir bajo la lluvia, niebla o humo
    durante el día para aumentar la visibilidad sin causar deslumbramiento.
- id: 323
  category: alcohol_drugs_health
  question: ¿Cuáles son las sanciones por negarse a someterse a un análisis de sangre,
    de orina o de aliento cuando se sospecha que conduce bajo los efectos del alcohol
    o drogas (DUI)?
  choices:
    A: Una advertencia por la primera infracción
    B: Suspensión automática de su licencia de conducir por un año
    C: Una multa de $500 y servicio comunitario obligatorio
    D: Incautación inmediata del vehículo por 30 días
  answer: B
  explanation: Bajo la ley de Consentimiento Implícito de Florida, negarse a someterse
    a una prueba de aliento, orina o sangre cuando se sospecha de DUI resultará en
    la suspensión automática de su licencia de conducir por un año.
- id: 324
  category: license_system
  question: Si tiene una licencia de aprendizaje, ¿cuántas horas de experiencia de
    manejo se requieren para obtener la licencia de conducir Clase E?
  choices:
    A: 30 horas (5 de noche)
    B: 40 horas (10 de noche)
    C: 50 horas (10 de noche)
    D: 60 horas (15 de noche)
  answer: C
  explanation: Un conductor con una licencia de aprendizaje debe completar 50 horas
    de experiencia de manejo, de las cuales 10 horas deben ser de noche, para obtener
    una licencia de conducir Clase E.
- id: 325
  category: license_system
  question: ¿Qué curso de educación debe tomar si está solicitando una licencia de
    aprendizaje (o si nunca ha tenido una licencia de conducir)?
  choices:
    A: Curso Básico de Mejoramiento del Conductor
    B: Educación sobre Leyes de Tránsito y Abuso de Sustancias (TLSAE)
    C: Curso Avanzado de Manejo Defensivo
    D: Curso de Seguridad en las Carreteras de Florida
  answer: B
  explanation: Debe completar el curso de Educación sobre Leyes de Tránsito y Abuso
    de Sustancias (TLSAE) antes de solicitar una licencia de aprendizaje o si nunca
    ha tenido una licencia de conducir.
- id: 326
  category: license_system
  question: ¿Cuál de los siguientes servicios se puede completar en línea en MyDMVPortal.flhsmv.gov?
  choices:
    A: Tomar el examen físico de habilidades de manejo
    B: Renovar o reemplazar su licencia de conducir
    C: Apelar una multa de tránsito en la corte
    D: Inspeccionar las emisiones de su vehículo
  answer: B
  explanation: Según el Departamento de Seguridad Vial y Vehículos Motorizados de
    Florida, puede renovar o reemplazar su licencia de conducir o tarjeta de identificación
    en línea en MyDMVPortal.flhsmv.gov.
- id: 327
  category: vehicle_information
  question: ¿Qué aplicación móvil permite a los clientes renovar de forma segura el
    registro de un vehículo o embarcación elegible y recibir un comprobante de la
    transacción?
  choices:
    A: FLHSMV Drive
    B: MyFlorida
    C: Florida DMV Mobile
    D: SunPass App
  answer: B
  explanation: La aplicación móvil MyFlorida del FLHSMV permite a los clientes renovar
    de forma segura el registro de un vehículo o embarcación elegible y recibir un
    comprobante de la transacción para usarlo hasta que el registro llegue por correo.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal roja octagonal de ALTO (STOP) significa que debe detenerse
    por completo en la línea de alto, en el cruce peatonal o antes de ingresar a la
    intersección. Verifique si hay tráfico y peatones antes de continuar.
  id: 328
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 329
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre a esta vía
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la calle o rampa donde está colocada esta señal. Por lo general,
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde ingresar lo pondría en la trayectoria del tráfico en sentido contrario.
  id: 330
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 331
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de autopista a la izquierda
  answer: B
  explanation: Una señal en blanco y negro de UN SOLO SENTIDO (ONE WAY) con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    que señala la flecha.
  id: 332
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en esta ubicación.
  id: 333
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Ir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 334
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en esta
    ubicación.
  id: 335
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde se prohíbe rebasar.
  id: 336
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye a hacer esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 337
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 338
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente el camino en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente el camino en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 339
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte sobre un cruce de peatones más adelante. Esté preparado para detenerse
    ante los peatones que cruzan la calle.
  id: 340
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 341
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no adelantar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 342
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 343
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva hacia la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 344
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa solo girar a la derecha
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 345
