- id: 41
  category: vehicle_information
  question: 2輪または3輪のオートバイを運転する際、エンジンの排気量が次のどれを超える場合に、運転免許証への二輪車免状（motorcycle endorsement）の追加、または「二輪車専用（Motorcycle
    Only）」免許が必要になりますか？
  choices:
    A: 30 cc
    B: 50 cc
    C: 100 cc
    D: 150 cc
  answer: B
  explanation: エンジン排気量が50 ccを超える2輪または3輪のオートバイを運転するには、運転免許証に二輪車免状（motorcycle endorsement）を追加するか、「二輪車専用（Motorcycle
    Only）」免許を所持している必要があります。
- id: 42
  category: vehicle_information
  question: 運転手を含めて何人以上の乗客を輸送するように設計された車両を運転する場合、商用運転免許証（CDL）が必要になりますか？
  choices:
