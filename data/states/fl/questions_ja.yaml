    D: 年齢を問わずすべての申請者
  answer: A
  explanation: マニュアルには、18歳未満の学生は承認されたサードパーティの提供機関を通じてオンラインで学科試験を受験できると記載されています。
- id: 100
  category: driver_testing
  question: 申請者の片目が失明している、または片目の視力が20/200以下の場合、視力検査に合格するためにはもう片方の目の視力はどのくらいでなければなりませんか？
  choices:
    A: 20/20以上
    B: 20/30以上
    C: 20/40以上
    D: 20/50以上
  answer: C
  explanation: 片目が失明しているか20/200以下の場合、もう片方の目は視力矯正レンズの有無にかかわらず20/40以上でなければなりません。
- id: 101
  category: driver_testing
  question: 運転技能試験中、車に同乗することが許可されているのは誰ですか？
  choices:
    A: 免許を持った親または保護者
    B: 運転教習所の指導員
    C: 言語通訳が必要な場合を除き、他の乗客は同乗できない
    D: 家族1名まで
  answer: C
  explanation: マニュアルには、言語通訳が必要な場合を除き、試験中に他の乗客の同乗は許可されないと明記されています。
- id: 102
  category: safe_driving_rules
  question: 曲がる準備をする際、曲がる前のどのくらいの距離で合図（ウィンカー）を出さなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 150フィート
    D: 200フィート
  answer: B
  explanation: 運転技能試験のガイドラインによると、適切な車線に入り、曲がる前の最後の100フィートで合図を出さなければなりません。
- id: 103
  category: driver_testing
  question: 運転技能試験中、スリーポイントターン（方向転換）を行う際、どのくらいの広さのスペースで車を転回させる必要がありますか？
  choices:
    A: 10〜20フィートのスペース
    B: 20〜40フィートのスペース
    C: 40〜60フィートのスペース
    D: 50〜70フィートのスペース
  answer: B
  explanation: マニュアルには、スリーポイントターンでは20〜40フィートのスペースで車を転回させなければならないと記載されています。
- id: 104
  category: vehicle_information
  question: フロリダ州の道路を走行する自動車に義務付けられている最低限の保険補償額はいくらですか？
  choices:
    A: $5,000のPIPおよび$10,000のPDL
    B: $10,000のPIPおよび$10,000のPDL
    C: $15,000のPIPおよび$15,000のPDL
    D: $20,000のPIPおよび$20,000のPDL
  answer: B
  explanation: フロリダ州の道路で自動車を運転するすべての所有者または責任者は、最低$10,000の個人傷害保護（PIP）および最低$10,000の対物賠償責任（PDL）の補償に加入していなければなりません。
- id: 105
  category: vehicle_information
  question: 過去365日間のうち、何日間フロリダ州内にあった自動車を所有している場合、フロリダ州の保険法を遵守しなければなりませんか？
  choices:
    A: 30日間
    B: 60日間
    C: 90日間
    D: 120日間
  answer: C
  explanation: 過去365日間のうち、90日間（連続または非連続を問わず）州内にあった自動車を所有している場合、保険法を遵守しなければなりません。
- id: 106
  category: driver_responsibility
  question: 運転免許証の停止を防ぐために、フロリダ州の自動車保険を解約する前に何をしなければなりませんか？
  choices:
    A: 地元の警察署に通知する。
    B: 運転免許サービスセンターに車のナンバープレートを返納する。
    C: $150の解約手数料を支払う。
    D: 一時的な運転許可証を取得する。
  answer: B
  explanation: マニュアルでは、免許の停止を防ぎ、免許の回復手数料を避けるために、保険を解約する前にいずれかの運転免許サービスセンターにナンバープレートを返納することが義務付けられています。
- id: 107
  category: penalties_and_points
  question: 偽造された保険証、または解約されていることを知っている保険証を法執行官（警察官）に提示した場合の罰則は何ですか？
  choices:
    A: 警告および$50の罰金
    B: 第1級軽犯罪
    C: 第2級軽犯罪
    D: 第3級重犯罪
  answer: C
  explanation: 保険が解約されていることを知りながら法執行官に保険証を提示した場合、または保険証を偽造した場合、逮捕され第2級軽犯罪として起訴される可能性があります。
- id: 108
  category: alcohol_drugs_health
  question: フロリダ州で飲酒・薬物運転（DUI）で有罪判決を受けた場合、引き上げられた保険補償限度額をどのくらいの期間維持しなければなりませんか？
  choices:
    A: 1年間
    B: 3年間
    C: 5年間
    D: 10年間
  answer: B
  explanation: フロリダ州法では、DUIで有罪判決を受けた場合、より高い補償限度額（1人につき$100,000の対人賠償責任保険（BIL）など）に加入することが義務付けられており、この引き上げられた補償はDUIの有罪判決後3年間有効でなければなりません。
- id: 109
  category: license_system
  question: 仮免許（learner's license）を所持する未成年者の、最初の3ヶ月間の運転時間制限は何ですか？
  choices:
    A: 午後10時まで運転できる。
    B: 日中（明るい時間帯）のみ運転できる。
    C: 真夜中（午前0時）まで運転できる。
    D: 18歳以上の人が同乗していれば、いつでも運転できる。
  answer: B
  explanation: 仮免許を所持する未成年者は、21歳以上の免許を持った運転手が同乗しなければならず、最初の3ヶ月間は日中（明るい時間帯）のみ運転しなければなりません。
- id: 110
  category: license_system
  question: 16歳の免許所持者が、通勤の往復、または21歳以上の免許を持った運転手が同乗している場合を除き、運転を禁止されている時間帯はいつですか？
  choices:
    A: 午後10時から午前5時
    B: 午後11時から午前6時
    C: 午前0時から午前6時
    D: 午前1時から午前5時
  answer: B
  explanation: 16歳の免許所持者は、通勤の往復、または21歳以上の免許を持った運転手が同乗している場合を除き、午後11時から午前6時までの間は運転してはいけません。
- id: 111
  category: license_system
  question: 仕事に行く途中ではなく、同乗者がいない場合、17歳の免許所持者の運転禁止時間帯（カーフュー）は何時ですか？
  choices:
    A: 午後10時から午前6時
    B: 午後11時から午前6時
    C: 深夜0時から午前5時
    D: 午前1時から午前5時
  answer: D
  explanation: 17歳の免許所持者は、仕事の行き帰りである場合、または21歳以上の免許所持者が同乗している場合を除き、午前1時から午前5時までの間は運転してはいけません。
- id: 112
  category: penalties_and_points
  question: 自分のものではない障害者用駐車許可証を不法に使用した場合の罰則は何ですか？
  choices:
    A: 100ドルの罰金と運転免許証への1点の違反点数加算
    B: 第2級軽犯罪として、500ドルの罰金または最長6ヶ月の禁錮刑
    C: 第1級軽犯罪として、1,000ドルの罰金
    D: 運転免許証の1年間の即時取り消し
  answer: B
  explanation: 自分のものではない許可証を取得または使用した者は、第2級軽犯罪に問われる可能性があり、500ドルの罰金または最長6ヶ月の禁錮刑が科せられ、車両がレッカー移動される場合があります。
- id: 113
  category: driver_testing
  question: 運転技能試験において、適切な姿勢とみなされるのはどれですか？
  choices:
    A: 左肘を窓にかけ、右手でハンドルを操作する。
    B: 両手をハンドルに置き、肘を窓にかけない。
    C: 快適に後ろにもたれかかり、片手を12時の位置に置く。
    D: 両手を10時と2時の位置に置き、肘をセンターコンソールに乗せる。
  answer: B
  explanation: マニュアルでは、ドライバーに適切な姿勢をとるよう指示しています。「両手をハンドルに置き、肘を窓にかけないこと。」
- id: 114
  category: penalties_and_points
  question: 適切な保険を維持しなかったために運転免許証が停止された場合、仕事に行くための仮免許証を取得することはできますか？
  choices:
    A: はい。ただし、150ドルの手数料を支払う場合のみ。
    B: はい。仕事目的のみの救済免許（hardship license）を取得できます。
    C: いいえ。いかなる理由であっても仮免許証を取得することはできません。
    D: いいえ。ただし、雇用主から署名入りの免除証明書をもらった場合は除きます。
  answer: C
  explanation: マニュアルには次のように明記されています。「保険に加入していないために運転免許証またはナンバープレートが停止された場合、仕事に行くためであっても、いかなる理由でも仮免許証を取得することはできません。」
- id: 115
  category: safe_driving_rules
  question: 運転技能試験のガイドラインによると、一方通行の道路でない限り、通常はどの車線を運転すべきですか？
  choices:
    A: 左車線
    B: 中央車線
    C: 右車線
    D: 最も交通量の少ない車線
  answer: C
  explanation: 「適切な車線の維持」の項目で、マニュアルには「一方通行の道路を除き、右車線を運転すること」と記載されています。
- id: 116
  category: driver_responsibility
  question: 次の行動のうち、禁錮刑または罰金刑につながる可能性のある運転免許法違反はどれですか？
  choices:
    A: 無免許の人に自分の車を使用させること。
    B: 運転中に運転免許証を家に忘れること。
    C: レンタカーを州外で運転すること。
    D: パーキングメーターのある駐車スペースに料金を払わずに駐車すること。
  answer: A
  explanation: 「運転免許法違反」の項目において、禁錮刑や罰金刑が科される可能性のある違反には、「無免許の人に自分の車を使用させること、または無免許の人に自動車を貸すこと」が含まれます。
- id: 117
  category: alcohol_drugs_health
  question: フロリダ州の黙示の同意法（Implied Consent Law）の下で、呼気、血液、または尿の検査を初めて拒否した場合、どうなりますか？
  choices:
    A: 免許証が自動的に1年間停止される。
    B: 500ドルの罰金が科せられる。
    C: 免許証が18ヶ月間停止される。
    D: 12時間の飲酒運転（DUI）講習への参加が義務付けられる。
  answer: A
  explanation: マニュアルには、求められた検査を拒否した場合、免許証は自動的に1年間停止されると記載されています。
- id: 118
  category: penalties_and_points
  question: 呼気、血液、または尿の検査を2回目に拒否した場合の罰則は何ですか？
  choices:
    A: 6ヶ月の免許停止
    B: 18ヶ月の免許停止および第1級軽犯罪
    C: 1,000ドルの罰金および50時間の社会奉仕活動
    D: 運転免許証の永久取り消し
  answer: B
  explanation: マニュアルによると、2回目の拒否は18ヶ月の免許停止および第1級軽犯罪となります。
- id: 119
  category: alcohol_drugs_health
  question: 死亡または重傷を伴う飲酒・薬物運転（DUI）事件において、血液検査に関して正しいのは次のうちどれですか？
  choices:
    A: 同意した場合にのみ血液検査を受ける義務がある。
    B: 同意の有無にかかわらず血液検査を受けることが義務付けられる。
    C: 意識がある場合にのみ採血できる。
    D: 呼気検査に合格した場合、血液検査は任意である。
  answer: B
  explanation: マニュアルには、死亡または重傷を伴うDUI事件では、同意の有無にかかわらず血液検査を受けることが義務付けられており、意識不明であっても採血される場合があると記載されています。
- id: 120
  category: alcohol_drugs_health
  question: ゼロ・トレランス法（Zero Tolerance law）の下で、21歳未満のドライバーが警察に止められ、呼気または血中アルコール濃度（BAL）が0.02以上であった場合、どうなりますか？
  choices:
    A: 運転の特権が6ヶ月間停止される。
    B: 500ドルの罰金が科せられる。
    C: イグニッション・インターロック装置（呼気吹込み式エンジン始動制限装置）を1年間設置しなければならない。
    D: 免許証が永久に取り消される。
  answer: A
  explanation: マニュアルには、法執行機関に止められた21歳未満のドライバーで、BALが0.02以上の場合、自動的に運転の特権が6ヶ月間停止されると明記されています。
- id: 121
  category: penalties_and_points
  question: フロリダ州の道路に15ポンド以上のゴミを投げ捨てた場合の罰則は何ですか？
  choices:
    A: 100ドルの罰金
    B: 500ドルの罰金および運転記録への2点の加点
    C: 第1級軽犯罪、最大1,000ドルの罰金、および運転記録への3点の加点
    D: 第2級軽犯罪および6ヶ月の免許停止
  answer: C
  explanation: 15ポンド以上のゴミを投げ捨てた場合、第1級軽犯罪として起訴され、最大1,000ドルの罰金が科せられ、運転記録に3点が加点される可能性があります。
- id: 122
  category: penalties_and_points
  question: 停車中のスクールバスを追い越した場合、運転免許証に何点加点されますか？
  choices:
    A: 2点
    B: 3点
    C: 4点
    D: 6点
  answer: C
  explanation: 停車中のスクールバスを追い越した場合の罰則には、運転免許証への4点の加点が含まれます。
- id: 123
  category: penalties_and_points
  question: 停車中のスクールバスを追い越した結果、他人に重傷を負わせたり死亡させたりした場合、免許停止期間の最短はどれくらいですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: B
  explanation: 追い越しによって重傷または死亡事故を引き起こした場合、罰則として最低1年間の免許停止が含まれます。
- id: 124
  category: safe_driving_rules
  question: フロリダ州法によると、4歳および5歳の子供に対する安全拘束装置の要件は何ですか？
  choices:
    A: 後ろ向きのチャイルドシートに乗せなければならない。
    B: チャイルドシートまたはジュニアシート（ブースターシート）のいずれかに乗せなければならない。
    C: 標準のラップベルト（腰ベルト）の着用のみが義務付けられている。
    D: 後部座席に乗る場合、安全拘束装置の法律から免除される。
  answer: B
  explanation: フロリダ州法では、4歳および5歳の子供はチャイルドシートまたはジュニアシート（ブースターシート）のいずれかに乗せることが義務付けられています。
- id: 125
  category: driver_responsibility
  question: 16歳の同乗者が車内で適切にシートベルトを着用していない場合、誰がシートベルト違反に問われますか？
  choices:
    A: 16歳の同乗者
    B: 車の運転手
    C: 同乗者の両親
    D: 運転手と同乗者の両方
  answer: B
  explanation: 18歳未満の同乗者が適切にシートベルトやチャイルドシートを使用していない場合、運転手がシートベルト/チャイルドシート違反に問われます。
- id: 126
  category: safe_driving_rules
  question: 次のうち、フロリダ州のシートベルト着用義務が免除されるのはどれですか？
  choices:
    A: 乗用車の助手席の同乗者
    B: 新聞配達中の新聞宅配サービスの従業員
    C: 後部座席に乗っている10歳の子供
    D: 仮免許（仮免）を持つ運転手
  answer: B
  explanation: フロリダ州法では、新聞配達中の新聞宅配サービスの従業員はシートベルト着用義務が免除されます。
- id: 127
  category: safe_driving_rules
  question: フロリダ州の道路で許可されている最高制限速度はどれくらいですか？
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: マニュアルには、フロリダ州では制限速度が70 mphを超えることはないと記載されています。
- id: 128
  category: penalties_and_points
  question: 初めての飲酒・薬物運転（DUI）での有罪判決に対する、免許取り消し期間の最短はどれくらいですか？
  choices:
    A: 30日
    B: 90日
    C: 180日
    D: 1年
  answer: C
  explanation: 初めてのDUI有罪判決の場合、罰則には最低180日間の免許取り消しが含まれます。
- id: 129
  category: penalties_and_points
  question: 薬物の輸送、販売、または配布に車両が使用された場合、その車両はどうなる可能性がありますか？
  choices:
    A: 塗り替えられなければならない。
    B: 禁制品として押収され、逮捕した機関に没収される可能性がある。
    C: ちょうど30日間押収される。
    D: イグニッション・インターロック・デバイス（呼気吹込み式エンジン始動装置）を装備しなければならない。
  answer: B
  explanation: 薬物の輸送、販売、または配布に車を使用しているために車内に薬物がある場合、車は禁制品として押収され、逮捕した機関に没収される可能性があります。
- id: 130
  category: safe_driving_rules
  question: フロリダ州において、違法な道路の損傷とみなされる行為は次のうちどれですか？
  choices:
    A: 重量10,000ポンド以上の車両を運転すること
    B: パンクしたタイヤのリムで走行すること
    C: 嵐の間にスノーチェーンを装着して運転すること
    D: 住宅街の通りに大型トラックを駐車すること
  answer: B
  explanation: マニュアルには、パンクしたタイヤのリムで走行したり、その他の方法で道路を損傷させたりすることは法律違反であると記載されています。
- id: 131
  category: penalties_and_points
  question: 制限速度を時速50マイル（MPH）以上超過した最初の違反に対する罰金はいくらですか？
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: 制限速度を時速50マイル（MPH）以上超過した場合の罰金は、初回の違反で1,000ドル、2回目の違反で2,500ドルです。
- id: 132
  category: penalties_and_points
  question: スクールゾーンまたは工事区間内でスピード違反が発生した場合、罰金はどうなりますか？
  choices:
    A: 運転講習を受講すれば免除される。
    B: 半額に減額される。
    C: 2倍になる。
    D: 3倍になる。
  answer: C
  explanation: スクールゾーンまたは工事区間内でスピード違反が発生した場合、罰金は2倍になり、最大1,000ドルの民事制裁金が科される可能性があります。
- id: 133
  category: driver_responsibility
  question: 法律により、交通事故回避講習（Traffic Collision Avoidance Course）の受講が義務付けられるのはどのような条件の場合ですか？
  choices:
    A: 負傷者が医療機関に搬送された事故で、あなたに過失があると判断された場合。
    B: スクールゾーンで駐車違反切符を切られた場合。
    C: 過失の有無にかかわらず、何らかの事故に関与した場合。
    D: 制限速度を時速10マイル超過して捕まった場合。
  answer: A
  explanation: 負傷者が医療機関に搬送された事故であなたに過失があると判断された場合、または2年以内に2回目の衝突事故を起こした場合、法律により交通事故回避講習の受講が義務付けられています。
- id: 134
  category: penalties_and_points
  question: 36ヶ月以内に事故を引き起こした交通違反で3回目の有罪判決を受けた場合、次のうちどれを完了しなければなりませんか？
  choices:
    A: 30日間の懲役
    B: 4時間の実車運転訓練
    C: 州への車両の引き渡し
    D: 義務的な5,000ドルの罰金の支払い
  answer: B
  explanation: 「3年間に3回の事故に関する法律（Three Crashes in Three Years Law）」に基づき、12時間の高度運転改善（ADI）講習を修了し、認可された民間の自動車学校で4時間の実車運転訓練を受け、延長された運転免許試験に合格する必要があります。
- id: 135
  category: penalties_and_points
  question: 18ヶ月以内に運転記録に18ポイントが累積した場合の罰則は何ですか？
  choices:
    A: 30日間の免許停止
    B: 3ヶ月間の免許停止
    C: 6ヶ月間の免許停止
    D: 1年間の免許停止
  answer: B
  explanation: 18ヶ月以内に18ポイントが累積すると、運転免許が3ヶ月間停止されます。
- id: 136
  category: penalties_and_points
  question: 停車中のスクールバスを追い越した場合（重傷や死亡に至らない場合）、運転記録に何ポイント加算されますか？
  choices:
    A: 3ポイント
    B: 4ポイント
    C: 6ポイント
    D: 8ポイント
  answer: B
  explanation: 「一般的な違反と関連するポイント値」の表によると、停車中のスクールバスを追い越した場合は4ポイントが加算されます。
- id: 137
  category: penalties_and_points
  question: 運転中のテキストメッセージ送信が原因で事故を起こした場合、何ポイントが科されますか？
  choices:
    A: 3ポイント
    B: 4ポイント
    C: 主たる違反に6ポイント加算
    D: 主たる違反に9ポイント加算
  answer: C
  explanation: テキストメッセージ送信が原因で事故を起こした場合、主たる違反に加えて6ポイントが加算されます。
- id: 138
  category: penalties_and_points
  question: 次の違反のうち、免許が「取り消し（revoked）」ではなく「停止（suspended）」されるものはどれですか？
  choices:
    A: 養育費の支払い不履行
    B: 薬物所持の重罪
    C: 高速道路でのレース行為
    D: 1年以内に3回の無謀運転
  answer: A
  explanation: 養育費の支払い不履行は、免許停止の理由として挙げられています。薬物所持、レース行為、および3回の無謀運転は、免許取り消しの理由です。
- id: 139
  category: license_system
  question: どのような状況で運転免許証が「無効（canceled）」になる可能性がありますか？
  choices:
    A: 交通違反の罰金を支払わなかった場合。
    B: 虚偽の情報または身分証明を提供した場合。
    C: 高速道路でのレース行為で有罪判決を受けた場合。
    D: スクールバスのために停車しなかった場合。
  answer: B
  explanation: 虚偽の情報や身分証明を提供した場合、誤って発行された場合、または義務付けられた講習を修了しなかった場合、免許証は無効（無効化および終了）になる可能性があります。
- id: 140
  category: penalties_and_points
  question: 呼気検査を拒否し、行政処分による免許停止に対して不服申し立てを行いたい場合、逮捕から何日以内に聴聞会（ヒアリング）を申請しなければなりませんか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 30日
  answer: B
  explanation: 呼気、尿、または血液検査を拒否し、この免許停止に対して不服申し立てを行いたい場合は、逮捕日から10日以内に公式または非公式の審査聴聞会を申請する必要があります。
- id: 141
  category: safe_driving_rules
  question: 死角を確認するために首を回すのが困難な高齢ドライバーには、どのような車両の調整が推奨されますか？
  choices:
    A: ステアリングノブ（ハンドルスピンナー）を取り付ける
    B: より大きなサイドミラーを取り付ける
    C: シートベルト用の補助器具を使用する
    D: ルームミラーを取り外す
  answer: B
  explanation: マニュアルでは、死角を確認するために首を回すのが困難な場合は、より大きなサイドミラーの導入を検討するよう推奨しています。
- id: 142
  category: defensive_driving
  question: 高齢ドライバーが避けるべきとされる危険な運転時間帯は、次のうちどれですか？
  choices:
    A: 日中の交通
    B: 地域の住宅街での運転
    C: 夕暮れ時、夜明け、および夜間
    D: 晴天時
  answer: C
  explanation: 高齢ドライバーは危険な運転時間帯を避けるよう推奨されています。これには、夕暮れ時、夜明け、夜間のほか、悪天候、ラッシュアワーの渋滞、流れの速い高速道路が含まれます。
- id: 143
  category: safe_driving_rules
  question: ドライバーの注意散漫（ディストラクション）の3つの主なカテゴリーは何ですか？
  choices:
    A: 視覚的、手動的、および認知的
    B: 視覚的、聴覚的、および身体的
    C: 精神的、身体的、および感情的
    D: 認知的、聴覚的、および手動的
  answer: A
  explanation: マニュアルによると、ドライバーの注意散漫の3つの主なカテゴリーは、視覚的（道路から目を離すこと）、手動的（ハンドルから手を離すこと）、および認知的（運転以外のことを考えること）です。
- id: 144
  category: safe_driving_rules
  question: テキストメッセージの送信が、最も危険な「ながら運転（注意散漫な運転）」の行動の1つと見なされているのはなぜですか？
  choices:
    A: ドライバーが少なくとも5秒間下を向く必要があるため。
    B: 視覚的、手動的、および認知的な注意散漫が同時に発生するため。
    C: ドライバーがハンドルから両手を離す原因となるため。
    D: フロリダ州で違法とされている唯一の注意散漫行為であるため。
  answer: B
  explanation: マニュアルには、テキストメッセージの送信には3つのカテゴリーの注意散漫（視覚的、手動的、認知的）すべてが含まれており、それが最も危険な「ながら運転」の行動の1つであると記載されています。
- id: 145
  category: safe_driving_rules
  question: フロリダ州において、次のどのエリアでワイヤレス通信機器を手に持って操作しながら自動車を運転することが違法とされていますか？
  choices:
    A: 住宅街
    B: 州間高速道路
    C: 指定された横断歩道（スクールクロッシング）、スクールゾーン、または工事区間（ワークゾーン）
    D: 制限速度が30 mph未満のすべての道路
  answer: C
  explanation: フロリダ州法では、指定された横断歩道（スクールクロッシング）、スクールゾーン、または工事区間（ワークゾーン）において、ワイヤレス通信機器を手に持って操作しながら自動車を運転することを禁じています。
- id: 146
  category: alcohol_drugs_health
  question: アルコール飲料を摂取した後、最初に影響を受けるものは何ですか？
  choices:
    A: 反応時間
    B: 視力
    C: 判断力
    D: バランス感覚
  answer: C
  explanation: マニュアルには、アルコール飲料を飲んだ後に最初に影響を受けるのは人の判断力であると明記されています。
- id: 147
  category: penalties_and_points
  question: フロリダ州では、DUI（飲酒・薬物影響下での運転）の有罪判決は運転記録にどのくらいの期間残りますか？
  choices:
    A: 10年間
    B: 25年間
    C: 50年間
    D: 75年間
  answer: D
  explanation: 飲酒運転は非常に危険であるため、罰則は非常に厳しくなっています。DUIの有罪判決は、運転記録に75年間残らなければなりません。
- id: 148
  category: defensive_driving
  question: 長距離ドライブでの居眠り運転を防ぐため、どのくらいの頻度で休憩を取るべきですか？
  choices:
    A: 50マイルまたは1時間ごと
    B: 100マイルまたは2時間ごと
    C: 200マイルまたは4時間ごと
    D: 目が閉じそうになり始めた時のみ
  answer: B
  explanation: 長距離ドライブでの居眠り運転を防ぐため、マニュアルでは100マイルまたは2時間ごとに休憩を取ることを推奨しています。
- id: 149
  category: alcohol_drugs_health
  question: アルコールとアレルギー薬や風邪薬を混ぜて摂取した場合、どのような結果を招く可能性が高いですか？
  choices:
    A: 薬がアルコールの影響を打ち消す。
    B: アルコールと薬の影響が相乗的に増大することが多い。
    C: 視力にのみ影響し、判断力には影響しない。
    D: アルコールが薬の効き目を妨げる。
  answer: B
  explanation: アルコールと薬を同時に摂取してはいけません。アルコールと薬を混ぜると、アルコールと薬の影響が相乗的に増大することがよくあります。
- id: 150
  category: defensive_driving
  question: 他のドライバーがあなたを脅したり、あなたの周りで意図的に危険な運転をしている場合、どうするべきですか？
  choices:
    A: 怯えていないことを示すためにアイコンタクトをとる。
    B: スピードを上げて相手の前に留まる。
    C: 冷静さを保ち、距離を置き、助けが必要な場合は*FHPまたは911に電話する。
    D: ヘッドライトを点滅させ、クラクションを鳴らして警告する。
  answer: C
  explanation: 他のドライバーがあなたを脅している場合は、冷静さを保ち、できるだけ相手との距離を置くようにしてください。スピードを落として相手を先に行かせます。アイコンタクトをとったり、卑猥なジェスチャーをしたりしないでください。助けが必要な場合は、*FHP（*347）または911に電話してください。
- id: 151
  category: vehicle_information
  question: あなたが非居住者であり、フロリダ州で就労を開始する、または子供をフロリダ州の公立学校に入学させる場合、何日以内にフロリダ州の自動車登録証とナンバープレートを取得する必要がありますか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: A
  explanation: フロリダ州で就労を開始する、または子供を公立学校に入学させる非居住者は、就労または入学の開始から10日以内に自動車登録証とナンバープレートを取得しなければなりません。
- id: 152
  category: vehicle_information
  question: フロリダ州で権原（タイトル）を取得し登録する前に、車両識別番号（VIN）の確認が必要な車両は次のうちどれですか？
  choices:
    A: 州外で購入した新車
    B: 以前に他州で権原取得または登録された中古車
    C: 新品のモバイルホーム（移動住宅）
    D: 重量が2,000ポンド未満のトレーラー
  answer: B
  explanation: 以前に他州で権原取得または登録されたすべての車両は、VINの確認が必要です。新車、新品/中古のモバイルホーム、または重量が2,000ポンド未満のトレーラーには、VINの確認は必要ありません。
- id: 153
  category: vehicle_information
  question: ほとんどの自家用車の場合、車両登録の有効期限はいつ切れますか？
  choices:
    A: 毎年12月31日
    B: 登録証に記載されている最初の所有者の誕生日の深夜（午前0時）
    C: 購入日からちょうど1年後
    D: 毎年6月30日
  answer: B
  explanation: モバイルホームや社用車などの特定の車両の例外を除き、登録は登録用紙に記載されている最初の所有者の誕生日の深夜（午前0時）に有効期限が切れます。
- id: 154
  category: vehicle_information
  question: 車両登録の更新は、有効期限の何日前から行うことができますか？
  choices:
    A: 最大30日前から
    B: 最大60日前から
    C: 最大90日前から
    D: 最大120日前から
  answer: C
  explanation: マニュアルによると、登録は有効期限の最大90日前から更新することができます。
- id: 155
  category: driver_responsibility
  question: フロリダ州の「Safe Mobility for Life（生涯にわたる安全な移動）」プログラムの目的は何ですか？
  choices:
    A: 低所得世帯に無料の車両登録を提供する。
    B: フロリダ州の高齢の道路利用者の安全性、アクセス、および移動のニーズを向上させる。
    C: 10代の初心者ドライバーに高速道路の安全に関する訓練を行う。
    D: 無事故無違反のドライバーに割引された自動車保険を提供する。
  answer: B
  explanation: フロリダ州の「Safe Mobility for Life」プログラムは、フロリダ州の高齢の道路利用者の安全性、アクセス、および移動のニーズに対する意識を高め、それらを向上させるための情報とリソースを提供します。
- id: 156
  category: alcohol_drugs_health
  question: マリファナなどの違法薬物や規制薬物は、人の運転能力にどのような影響を与えますか？
  choices:
    A: 緊急時の反応時間を改善する。
    B: 夜間運転時の視力を鋭くする。
    C: 誤った覚醒感や自信を与えたり、眠気を引き起こしたりする可能性がある。
    D: アルコールと一緒に摂取した場合にのみドライバーに影響を与える。
  answer: C
  explanation: マリファナなどの違法薬物や規制薬物は、人の反射神経、判断力、および注意力に影響を与えます。これらは人に誤った覚醒感や自信を与えたり、眠気を引き起こして反応できなくさせたりする可能性があります。
- id: 157
  category: vehicle_information
  question: ほとんどの車両登録は所有者の誕生日に有効期限が切れますが、モバイルホームやセミトラックの登録の有効期限はいつですか？
  choices:
    A: 6月30日
    B: 9月30日
    C: 12月31日
    D: 3月31日
  answer: C
  explanation: 登録は最初の所有者の誕生日に有効期限が切れますが、モバイルホームおよびセミトラック/セミトレーラーは例外であり、毎年12月31日までに更新する必要があります。
- id: 158
  category: vehicle_information
  question: フロリダ州において、標準的な車両登録は通常いつ有効期限が切れますか？
  choices:
    A: 登録証に記載されている最初の所有者の誕生日の深夜（午前0時）
    B: 毎年12月31日
    C: 毎年6月30日
    D: 購入日からちょうど1年後
  answer: A
  explanation: マニュアルによると、いくつかの例外を除き、登録は登録用紙に記載されている最初の所有者の誕生日の深夜（午前0時）に有効期限が切れます。
- id: 159
  category: vehicle_information
  question: モバイルホームおよびセミトラック/セミトレーラーの毎年の登録更新期限はいつですか？
  choices:
    A: 6月30日
    B: 12月31日
    C: 最初の所有者の誕生日
    D: 1月1日
  answer: B
  explanation: マニュアルには、モバイルホームおよびセミトラック/セミトレーラーは毎年12月31日までに更新すると記載されています。
- id: 160
  category: vehicle_information
  question: フロリダ州の装備基準によると、ロービームのヘッドライトは前方のどのくらい先にある物体を照らし出さなければなりませんか？
  choices:
    A: 150フィート
    B: 300フィート
    C: 450フィート
    D: 1,000フィート
  answer: A
  explanation: ロービームのヘッドライトは、150フィート前方の物体を照らし出し、かつ1,000フィート離れた場所から視認できるものでなければなりません。
- id: 161
  category: vehicle_information
  question: 日中、車のブレーキランプ（制動灯）はどの距離から見える必要がありますか？
  choices:
    A: 150フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: 車には、日中に300フィート離れた場所から見える2つの赤いブレーキランプ（制動灯）が装備されている必要があります。
- id: 162
  category: vehicle_information
  question: 車のクラクション（警音器）は、どの距離から聞こえる十分な音量である必要がありますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 装備基準により、200フィート離れた場所から聞こえるクラクションの装備が義務付けられています。
- id: 163
  category: vehicle_information
  question: 車のタイヤの溝の深さは、最低限どのくらい必要ですか？
  choices:
    A: 1/16インチ
    B: 2/32インチ
    C: 3/32インチ
    D: 4/32インチ
  answer: C
  explanation: タイヤの溝は最低でも3/32インチ以上必要であり、プライ（内部のコード層）が見えるような摩耗箇所があってはいけません。
- id: 164
  category: vehicle_information
  question: 一般の民間車両に装備することが許可されていない照明器具は次のうちどれですか？
  choices:
    A: 琥珀色（アンバー）の方向指示器
    B: 白色のナンバープレート灯
    C: 前方から見える赤いライト
    D: 2つの赤いテールランプ（尾灯）
  answer: C
  explanation: 前方から見える赤いライトや青いライトは、緊急車両や法執行機関の車両専用であるため、一般車両への装備は許可されていません。
- id: 165
  category: safe_driving_rules
  question: 運転者が車を運転中に着用することが厳しく禁止されているものは次のうちどれですか？
  choices:
    A: サングラス
    B: つばの広い帽子
    C: ヘッドセットまたはヘッドホン
    D: 処方された眼鏡
  answer: C
  explanation: マニュアルの「許可されていない装備」の項目に、「運転中の運転者によるヘッドセット/ヘッドホンの着用」が記載されています。
- id: 166
  category: safe_driving_rules
  question: 車のエアバッグの使用に関して、正しい説明はどれですか？
  choices:
    A: シートベルトの着用の代わりになる。
    B: シートベルトと連動して機能するように設計されており、代わりになるものではない。
    C: 衝突警告システムの必要性をなくす。
    D: 従来のブレーキが故障したときにのみ作動する。
  answer: B
  explanation: エアバッグは、衝突時に乗員を保護するためにシートベルトと連動して機能するように設計されており、シートベルトの着用の代わりになるものではありません。
- id: 167
  category: vehicle_information
  question: 衝突警告システム（Collision Warning Systems）と衝突回避支援システム（Collision Intervention
    Systems）の主な違いは何ですか？
  choices:
    A: 警告システムは衝突を避けるための行動をとり、回避支援システムは運転者に警告するだけである。
    B: 警告システムは運転者に警告するだけであり、回避支援システムは衝突を避けるための行動をとる。
    C: 警告システムはカメラを使用し、回避支援システムはレーダーを使用する。
    D: 警告システムは後退時にのみ機能し、回避支援システムは前進時に機能する。
  answer: B
  explanation: 衝突警告システムは運転者に警告を提供するだけで衝突を避けるための行動はとりませんが、衝突回避支援システムは衝突を避けるための行動をとるように設計されています。
- id: 168
  category: defensive_driving
  question: 緊急時にアンチロック・ブレーキ・システム（ABS）をどのように使用すべきですか？
  choices:
    A: 横滑りを防ぐためにブレーキを素早くポンピングする。
    B: ブレーキペダルを強く踏み込み、そのまま保持して、ハンドル操作で危険を回避する。
    C: システムを作動させるために、ブレーキペダルから一定の圧力を抜く。
    D: ハンドルを急に切りながら、ブレーキを軽く叩くように踏む。
  answer: B
  explanation: ABS搭載車を運転する場合、ブレーキペダルを強く踏み込み、そのまま保持して、ハンドル操作で危険を回避する必要があります。ポンピングブレーキを行うとABSが解除されてしまいます。
- id: 169
  category: defensive_driving
  question: 従来のブレーキ（ABSなし）を搭載した車で、緊急時にトラクション（グリップ力）を失った場合、停止するために何をしなければなりませんか？
  choices:
    A: ブレーキペダルを床までしっかりと踏み込み、保持する。
    B: ポンピングブレーキを行う。
    C: 直ちにパーキングブレーキをかける。
    D: ギアをニュートラルに入れ、惰性で停止する。
  answer: B
  explanation: 従来のブレーキを搭載した車の運転者は、トラクションを失い車が滑るような緊急事態で停止するためには、ポンピングブレーキを行わなければなりません。
- id: 170
  category: vehicle_information
  question: フロリダ州における自動車およびピックアップトラックのバンパーの高さ制限は、車両の何によって規定されていますか？
  choices:
    A: 改造または変更後の重量
    B: 車両総重量定格（GVWR）
    C: 正味出荷重量
    D: 乗車定員
  answer: C
  explanation: 高さ制限は、改造または変更後の重量ではなく、車両の正味出荷重量によって規定されています。
- id: 171
  category: vehicle_information
  question: 車両の排出ガス制御装置（エミッションコントロールデバイス）を不正に改造した場合、どのような結果を招く可能性がありますか？
  choices:
    A: 燃費の向上
    B: 車両効率の向上
    C: 大気汚染の減少
    D: 燃費の悪化と大気汚染の増加
  answer: D
  explanation: 公害防止装置を不正に改造すると、車両の損傷、大気汚染の増加、燃費の悪化、および車両効率の低下を引き起こす可能性があります。
- id: 172
  category: vehicle_information
  question: 車両には、後方の道路を少なくともどのくらいの距離まで確認できるバックミラーを1つ以上装備する必要がありますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 300フィート
  answer: C
  explanation: 装備基準により、後方200フィートの視界を確保できるバックミラーを少なくとも1つ装備することが義務付けられています。
- id: 173
  category: vehicle_information
  question: 他の車両やトレーラーを牽引する場合、ドローバー（牽引棒）や牽引接続部の長さは通常、どのくらいを超えてはなりませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 25フィート
  answer: B
  explanation: 簡単に分解できない電柱、パイプ、機械などを牽引している場合を除き、ドローバーや牽引接続部の長さは15フィートを超えてはなりません。
- id: 174
  category: safe_driving_rules
  question: 乗用車において、積載物は左側のフェンダーを越えてはみ出してはならず、右側のフェンダーからは何インチを超えてはみ出してはなりませんか？
  choices:
    A: 4インチ
    B: 6インチ
    C: 8インチ
    D: 12インチ
  answer: B
  explanation: 乗用車は、積載物が車両の左側のフェンダーを越えてはみ出している状態、または右側のフェンダーのラインから6インチを超えてはみ出している状態で公道を走行してはなりません。
- id: 175
  category: safe_driving_rules
  question: 日中、積載物が車両の後部から4フィートを超えてはみ出している場合、何で標示しなければなりませんか？
  choices:
    A: 1辺が少なくとも18インチの赤い旗
    B: 1辺が少なくとも12インチの白い旗
    C: 2つの赤いランプ
    D: 1つの琥珀色（アンバー）のストロボ型ランプ
  answer: A
  explanation: 日中、積載物が車両の側面を越え、かつ後部から4フィートを超えてはみ出している場合、その先端を1辺が少なくとも18インチの赤い旗で標示しなければなりません。
- id: 176
  category: signs_and_signals
  question: 道路上の二重の白の実線は何を示していますか？
  choices:
    A: 安全な場合は、線を越えて車線変更をしてもよい。
    B: 線を越えたり、車線変更をしたりすることは禁止されている。
    C: 対面通行の車線を分離している。
    D: 自転車を追い越す場合にのみ線を越えてもよい。
  answer: B
  explanation: 二重の白の実線は同じ方向に進む車線を分離しており、二重の実線を越えたり車線変更をしたりすることは禁止されています。
- id: 177
  category: signs_and_signals
  question: 二重の黄色の線がある道路を走行中で、自分の側の線が破線で、左側の線が実線である場合、何が許可されていますか？
  choices:
    A: いかなる状況でも追い越しをしてはならない。
    B: 安全であれば追い越しをしてもよい。
    C: リバーシブルレーン（進行方向が変わる車線）を走行している。
    D: 次の交差点で左折しなければならない。
  answer: B
  explanation: 二重の黄色の線が右側（自分の側）で破線、左側で実線になっている場合、安全であればその車線での追い越しが許可されています。
- id: 178
  category: sharing_the_road
  question: 自動車が自転車専用レーンを走行することが許可されるのはいつですか？
  choices:
    A: 遅い車両を追い越すとき。
    B: ラッシュアワーの渋滞時。
    C: 自転車レーンを走行することは決して許可されないが、曲がる際に横切ることはできる。
    D: レーンに「シャロウ（共有レーン標示）」が描かれているとき。
  answer: C
  explanation: 自動車は自転車レーンを走行することは許可されていません。交差点で曲がる際に自転車レーンを横切ることはできますが、自転車レーンに自転車がいない場合に限られます。
- id: 179
  category: signs_and_signals
  question: 蛍光黄緑色の交通標識はどのような情報を示していますか？
  choices:
    A: 工事および保守作業の警告
    B: 案内または方向に関する情報
    C: 学校、歩行者、および自転車の活動に対する強調された警告
    D: 公共のレクリエーションエリアや文化的に重要な場所
  answer: C
  explanation: 蛍光黄緑色の標識は、学校、歩行者、および自転車の活動に対する強調された警告を提供します。
- id: 180
  category: signs_and_signals
  question: 公共のレクリエーションエリア、文化的、および歴史的に重要な場所へ案内する交通標識には何色が使われますか？
  choices:
    A: 青色
    B: 緑色
    C: オレンジ色
    D: 茶色
  answer: D
  explanation: 茶色の標識は、公共のレクリエーションエリア、文化的、および歴史的に重要な場所を示します。
- id: 181
  category: signs_and_signals
  question: フロリダ州の緑色の案内標識において、偶数の路線番号は何を示していますか？
  choices:
    A: 南北の路線
    B: 東西の路線
    C: 景観ルート
    D: 有料道路
  answer: B
  explanation: 緑色の案内標識では、東西の路線には偶数が、南北の路線には奇数が割り当てられています。
- id: 182
  category: vehicle_information
  question: 重量が3,000ポンドを超えるトレーラーまたはセミトレーラーには、どのようなブレーキの要件が適用されますか？
  choices:
    A: 独自のブレーキは必要ありません。
    B: 牽引する車両の運転手が操作できるブレーキを備えていなければなりません。
    C: 緊急用パーキングブレーキのみが必要です。
    D: 牽引車両から独立した油圧ブレーキを備えていなければなりません。
  answer: B
  explanation: 重量が3,000ポンドを超えるトレーラーまたはセミトレーラーは、牽引車両の運転手が操作でき、かつ連結が外れた場合に自動的にトレーラーを停止させるように設計されたブレーキを備えていなければなりません。
- id: 183
  category: safe_driving_rules
  question: 道路上に落下したり吹き飛ばされたりする可能性のある土、砂、砂利などの積載物を運搬する場合、何を使用しなければなりませんか？
  choices:
    A: ロックチェーン
    B: 少なくとも12インチ四方の白い旗
    C: ぴったりと密着するカバー
    D: 琥珀色のストロボ型ランプ
  answer: C
  explanation: 道路上に落下したり吹き飛ばされたりする可能性のある積載物（土、砂、砂利など）を運搬する場合は、ぴったりと密着するカバーを使用しなければなりません。
- id: 184
  category: signs_and_signals
  question: 左折用に標示された中央車線がある対面通行の道路において、中央車線について正しいものはどれですか？
  choices:
    A: 遅い車両を追い越すために使用できる。
    B: どちらの方向からの運転手も左折のために使用できる。
    C: ラッシュアワーの交通用のリバーシブルレーン（可逆車線）である。
    D: 北または東に向かって走行している車両のみが使用できる。
  answer: B
  explanation: 中央車線がある対面通行の道路では、どちらの方向からの運転手も左折のために中央車線を使用できます。追い越しのために使用してはいけません。
- id: 185
  category: signs_and_signals
  question: 通常、黄色く塗られた縁石は何を示していますか？
  choices:
    A: 商用車の荷積みゾーン。
    B: 消火栓や交差点付近の駐車禁止区域。
    C: 障害のある運転手のための専用駐車区域。
    D: 自転車との共用車線。
  answer: B
  explanation: 縁石は、消火栓や交差点付近の駐車禁止区域を示すために黄色く塗られていることがよくあります。
- id: 186
  category: signs_and_signals
  question: 道路の側面に沿って引かれた1本の実線の黄色い線は何を示していますか？
  choices:
    A: 道路の右端。
    B: 対面通行道路の追い越し禁止区域。
    C: 分離道路および一方通行道路の左端。
    D: 自転車専用レーン。
  answer: C
  explanation: 1本の実線の黄色い線は、分離道路および一方通行道路の左端を示しています。
- id: 187
  category: signs_and_signals
  question: フロリダ州の緑色の案内標識において、東西の路線はどのように番号付けされていますか？
  choices:
    A: 奇数
    B: 偶数
    C: アルファベット
    D: ローマ数字
  answer: B
  explanation: マニュアルによると、東西の路線には偶数が、南北の路線には奇数が割り当てられています。
- id: 188
  category: signs_and_signals
  question: 茶色と白の標識は、運転手にどのような情報を提供しますか？
  choices:
    A: ガソリンスタンドや飲食店などのサービスへの案内
    B: 前方の危険に関する警告
    C: 景勝地、公園、史跡への案内
    D: 出口ランプの最高安全速度
  answer: C
  explanation: 茶色と白の標識は、景勝地、公園、および文化的・歴史的に重要な地域への案内を示します。
- id: 189
  category: safe_driving_rules
  question: 2台の車両がほぼ同時に全方向一時停止（All Way Stop）の交差点に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転手は右側の運転手に道を譲らなければならない。
    B: 右側の運転手は左側の運転手に道を譲らなければならない。
    C: 直進する運転手は曲がる運転手に道を譲らなければならない。
    D: 最初にクラクションを鳴らした運転手に優先権がある。
  answer: A
  explanation: 全方向一時停止（All Way Stop）の交差点で、車両がほぼ同時に到着した場合、各運転手は自分の右側にいる運転手に道を譲らなければなりません。
- id: 190
  category: penalties_and_points
  question: 次のうち、スピード違反の罰金が2倍になるのはどの区域ですか？
  choices:
    A: 住宅街
    B: 稼働中のスクールゾーンおよび作業区域（ワークゾーン）
    C: 州間高速道路
    D: 景観ルート
  answer: B
  explanation: 「スピード違反罰金2倍（Speeding Fines Doubled）」の標識は、稼働中のスクールゾーンおよび作業区域に設置されており、これらの区域でスピード違反で摘発された場合、罰金は2倍になります。
- id: 191
  category: sharing_the_road
  question: 直進する自転車に遭遇した場合、右折車線に入る際に何をしなければなりませんか？
  choices:
    A: クラクションを鳴らして、道を空けるよう警告する。
    B: 加速して、曲がる前に自転車を追い越す。
    C: 自転車に道を譲る。
    D: 自転車を自分と一緒に右折車線に無理やり押し込む。
  answer: C
  explanation: 右折車線に入る際、直進する自転車に遭遇することがあります。その場合は自転車に道を譲らなければなりません。
- id: 192
  category: safe_driving_rules
  question: 左側車線に関する、速度の遅い車のルールは何ですか？
  choices:
    A: 速度の遅い車は常に左側車線を走行しなければならない。
    B: 速度の遅い車は、より速い車に追い越される際、左側車線から出なければならない。
    C: 速度の遅い車は、制限速度より少なくとも10 mph遅く走行している場合、左側車線を使用できる。
    D: 速度の遅い車は、ラッシュアワーの間のみ左側車線の走行が許可される。
  answer: B
  explanation: 速度の遅い車は、追い越しをする場合を除き右側車線を走行しなければならず、より速い車に追い越される際は左側車線から出なければなりません。
- id: 193
  category: signs_and_signals
  question: 警戒標識の通常の形状と色は何ですか？
  choices:
    A: 赤色の八角形
    B: 白色の長方形
    C: 黄色のひし形
    D: 緑色の正方形
  answer: C
  explanation: 警戒標識は通常、黄色のひし形です。これらは前方の道路状況や注意すべきことを運転手に警告します。
- id: 194
  category: signs_and_signals
  question: 「分離道路終り (Divided Highway Ends)」の標識は何を示していますか？
  choices:
    A: 高速道路が1車線に合流する。
    B: 分離道路が350〜500フィート先で終わり、対面通行の道路になる。
    C: 直ちに高速道路を降りなければならない。
    D: 500フィート先で制限速度が上がる。
  answer: B
  explanation: 「分離道路終り」の標識は、分離道路が350〜500フィート先で終わり、その後は対面通行の道路になることを示しています。
- id: 195
  category: vehicle_information
  question: 「急な下り坂 (Hill/Downgrade)」の警戒標識を見たとき、どのような行動をとる準備をするべきですか？
  choices:
    A: 高いギアに変速して速度を上げる。
    B: 低いギアに変速して速度をコントロールする。
    C: 燃料を節約するためにエンジンを切る。
    D: 直ちにパーキングブレーキをかける。
  answer: B
  explanation: 「急な下り坂」の標識は、前方の道路が下り坂になっていることを意味します。減速し、速度をコントロールするために低いギアに変速する準備をするべきです。
- id: 196
  category: safe_driving_rules
  question: 交通信号が故障しており、警察官もいない場合、交差点をどのように通行するべきですか？
  choices:
    A: 「ゆずれ (Yield)」の標識があるものとして扱う。
    B: 道路が空いていれば、止まらずに通過する。
    C: その信号/交差点を四方向一時停止 (four-way stop) の標識があるものとして扱う。
    D: 左折する場合のみ一時停止する。
  answer: C
  explanation: 交通信号が故障しており、警察官がいない場合、その信号/交差点を四方向一時停止の標識があるものとして扱います。
- id: 197
  category: safe_driving_rules
  question: 赤信号での左折が許可されるのはどのような条件のときですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ左折するとき。
    B: 一方通行の道路から、左方向に交通が流れている一方通行の道路へ左折するとき。
    C: 対面通行の道路で対向車がいないとき。
    D: 赤信号での左折は決して許可されない。
  answer: B
  explanation: 赤信号で一時停止した後、一方通行の道路から、左方向に交通が流れている一方通行の道路へ左折することができます。
- id: 198
  category: defensive_driving
  question: 交差点に近づいているときに信号が黄色に変わった場合、どうするべきですか？
  choices:
    A: 加速して素早く交差点を通過する。
    B: 安全に停止できる場合は停止する。
    C: クラクションを鳴らして交差する車両に警告する。
    D: 停止を避けるために隣の車線に急ハンドルを切る。
  answer: B
  explanation: 黄色の信号は、信号が赤に変わるという警告です。信号が赤に変わったときに交差点内にいることは非常に危険であるため、安全に停止できる場合は停止しなければなりません。
- id: 199
  category: defensive_driving
  question: 雨天時に「滑りやすい路面 (Slippery Surface)」の標識を見た場合、どのような予防措置をとるべきですか？
  choices:
    A: トラクションを維持するために加速する。
    B: 停止する必要がある場合は急ブレーキをかける。
    C: ゆっくり運転し、急加速や急ブレーキを避け、低速で曲がる。
    D: 滑りやすい路面を走行中はニュートラルにシフトする。
  answer: C
  explanation: 雨天時に「滑りやすい路面」の標識に遭遇した場合は、ゆっくり運転し、急加速や急ブレーキを避け、低速で曲がるようにするべきです。
- id: 200
  category: signs_and_signals
  question: 中央左折車線 (Center Turn Lane) の目的は何ですか？
  choices:
    A: より速い車のための追い越し車線である。
    B: 共有車線であり、両方向からの左折を可能にする。
    C: 緊急車両専用に確保されている。
    D: Uターン専用の車線である。
  answer: B
  explanation: 中央左折車線は、両方向からの左折を可能にする共有車線です。
- id: 201
  category: safe_driving_rules
  question: 「舗装路面駐車禁止（No Parking on Pavement）」の標識がある場所で停車しなければならない場合、どうすることが求められますか？
  choices:
    A: ハザードランプを点灯させて中央車線に停車する。
    B: 障害者用駐車許可証を持っている場合のみ、舗装路面に駐車する。
    C: 常に車道の舗装路面から外れて駐車する。
    D: 舗装路面に5分以内で停車する。
  answer: C
  explanation: 「舗装路面駐車禁止（No Parking on Pavement）」の標識は、停車する場合、常に車道の舗装路面から外れて駐車しなければならないことを意味します。
- id: 202
  category: signs_and_signals
  question: 交差点での赤の点滅信号にはどのように対応すべきですか？
  choices:
    A: 停止せずに、対向車に道を譲る。
    B: 一時停止標識と同じように扱い、停止して安全が確認できたら進む。
    C: 減速し、注意して進む。
    D: 停止し、信号が青になるのを待つ。
  answer: B
  explanation: 赤の点滅信号は危険な交差点で使用されます。運転マニュアルには、一時停止標識と同じように扱い、停止して安全が確認できたら進む必要があると記載されています。
- id: 203
  category: signs_and_signals
  question: 赤の「X」の車線信号は何を示していますか？
  choices:
    A: その車線は緊急車両専用である。
    B: その車線では減速し、注意して進まなければならない。
    C: 車線信号がまもなく黄色に変わる。
    D: 赤の「X」が表示されている車線を絶対に走行してはならない。
  answer: D
  explanation: 車線信号は、どの車線が通行可能か、または閉鎖されているかを示します。運転マニュアルには「赤のX：赤のXが表示されている車線は絶対に走行してはならない」と明記されています。
- id: 204
  category: signs_and_signals
  question: ランプ信号（合流部信号）の目的は何ですか？
  choices:
    A: 前方に料金所があることを運転手に警告するため。
    B: 高速道路に進入する車両のペースを制御するため。
    C: 跳ね橋が作動中であることを示すため。
    D: 前方に工事区間があることを運転手に警告するため。
  answer: B
  explanation: ランプ信号は、高速道路に進入する車両のペースを制御するもので、赤と青（緑）が交互に点灯します。
- id: 205
  category: signs_and_signals
  question: 工事区間において、バリケードやパネルに描かれた下向きの斜線は何を示していますか？
  choices:
    A: 車両が進行すべき方向。
    B: 前方に交通誘導員がいること。
    C: 前方の車線が閉鎖されていること。
    D: 横断歩道の位置。
  answer: A
  explanation: 誘導標識は、通常とは異なる状況を運転手に警告します。運転マニュアルには、バリケードやパネルの斜線は、車両が進行すべき方向に向かって下向きに傾斜していると記載されています。
- id: 206
  category: signs_and_signals
  question: 跳ね橋で黄色の点滅信号を見た場合、どうすべきですか？
  choices:
    A: 標示された停止線で完全に停止する。
    B: 橋が開く前に渡り切るために加速する。
    C: 跳ね橋が作動中であるため、減速して停止する準備をする。
    D: 橋は船舶の通行に対して閉じられているため、通常の速度で進む。
  answer: C
  explanation: 跳ね橋で黄色のランプが点滅している場合、跳ね橋が作動中であることを意味します。減速して停止する準備をしなければなりません。
- id: 207
  category: sharing_the_road
  question: 「歩行者横断禁止（DON'T WALK）」または「手のひら」の信号が点滅し始めたとき、すでに横断歩道内にいる場合はどうすべきですか？
  choices:
    A: 横断歩道の中央で立ち止まって待つ。
    B: 速やかに通りを渡り切る。
    C: 引き返して、渡り始めた歩道に戻る。
    D: カウントダウン信号がゼロになるのを待ってから動く。
  answer: B
  explanation: 運転マニュアルには、「歩行者横断禁止（DON'T WALK）」または「手のひら」の信号が点滅し始めたときにすでに横断歩道内にいる場合は、速やかに通りを渡り切るべきであると記載されています。
- id: 208
  category: signs_and_signals
  question: 歩行者用ハイブリッド信号（Pedestrian Hybrid Beacon）に近づく際、赤の点滅信号は何を示していますか？
  choices:
    A: 停止し、信号が青になるのを待つ。
    B: 注意して進む。歩行者がおらず、交差点の安全が確認できれば進んでよい。
    C: 歩行者が押しボタンを作動させたため、減速する。
    D: 横断歩道内の歩行者のために停止し、信号が消えるまで停止したままにする。
  answer: B
  explanation: 歩行者用ハイブリッド信号で赤の点滅信号が表示されている場合は、注意して進む必要があります。歩行者がおらず、交差点の安全が確認できれば、進むことができます。
- id: 209
  category: safe_driving_rules
  question: 踏切で停止する場合、車両と線路の間に保たなければならない最小距離はどれくらいですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: B
  explanation: 踏切に近づく際は、減速して停止する準備をしなければなりません。線路上、または踏切から15フィート以内の場所で停止してはいけません。
- id: 210
  category: signs_and_signals
  question: 踏切にある、連続する「X」の形をした白い路面標示は何を示していますか？
  choices:
    A: 前方に横断歩道があること。
    B: ダイナミック・エンベロープ（車両限界）。道路利用者が停止してはならない危険区域。
    C: 列車が接近している場合に停止しなければならない位置。
    D: 追い越しが許可されている区域。
  answer: B
  explanation: ダイナミック・エンベロープ（車両限界）は、連続する「X」の形をした白い路面標示で構成されており、道路利用者が停止してはならない危険区域を視覚的に強調するために使用されます。
- id: 211
  category: sharing_the_road
  question: 踏切付近でバスやトラックの後ろを走行している場合、なぜ特に停止する準備をしておくべきなのですか？
  choices:
    A: 遮断機が上がっており、警報機が点滅していない場合でも、踏切での一時停止が義務付けられているため。
    B: 車体が大きいため、線路を渡るのに時間がかかるため。
    C: 踏切を渡ることが禁止されており、Uターンしなければならないため。
    D: 誘導員が横断を案内するのを待たなければならないため。
  answer: A
  explanation: 多くのバスやトラックは、遮断機が上がっており警報機が点滅していない場合でも踏切での一時停止が義務付けられているため、これらの車両の後ろを走行する際は特に停止する準備をしておく必要があります。
- id: 212
  category: signs_and_signals
  question: 交差点での黄色の点滅矢印信号は何を意味しますか？
  choices:
    A: 信号がまもなく赤になります。直ちに停止してください。
    B: 矢印の方向への進行は許可されていますが、対向車や歩行者に道を譲らなければなりません。
    C: あなたに曲がる優先権があります。対向車の信号は赤です。
    D: 信号が青になるまで、矢印の方向に曲がることはできません。
  answer: B
  explanation: 黄色の点滅矢印は、矢印の方向への進行が許可されていることを意味しますが、対向車の信号は青であるため、対向車や歩行者に道を譲らなければなりません。
- id: 213
  category: signs_and_signals
  question: 「School Bus Stop Ahead（この先スクールバス停留所あり）」の標識の目的は何ですか？
  choices:
    A: 減速が求められるスクールゾーンの終わりを示すため。
    B: スクールバスのために直ちに停止しなければならないことを示すため。
    C: 予期しにくかったり、見えにくかったりするスクールバスの停留所がこの先にあることを運転手に警告するため。
    D: 現在子供たちが道路を横断していることを運転手に警告するため。
  answer: C
  explanation: 「School Bus Stop Ahead」の標識は、カーブや坂道などの道路形状によって予期しにくかったり見えにくかったりするスクールバスの停留所がこの先にあることを運転手に警告するために使用されます。
- id: 214
  category: defensive_driving
  question: 青の点灯信号がある交差点にはどのように接近すべきですか？
  choices:
    A: 加速して交差点を素早く通過する。
    B: 信号が変わった場合に減速できる速度で接近する。
    C: 交差点に入る前に停止し、交差する交通を確認する。
    D: 絶対的な優先権があるため、速度を維持する。
  answer: B
  explanation: 青信号に接近する際は、交差点内がクリアな場合のみ進行し、信号が変わった場合に減速できる速度で接近する必要があります。
- id: 215
  category: safe_driving_rules
  question: 降りている踏切の遮断機を迂回したり、その下をくぐって運転することに関する規則は何ですか？
  choices:
    A: 電車が接近していないことがはっきりと確認できる場合は許可されています。
    B: オートバイと自転車にのみ許可されています。
    C: 降りている、または開閉中の遮断機を迂回したり、その下をくぐって運転することは法律違反です。
    D: 警報機の点滅が止まっていれば許可されています。
  answer: C
  explanation: マニュアルには「降りている、または開閉中の遮断機を迂回したり、その下をくぐって運転することは法律違反である」と明記されています。
- id: 216
  category: vehicle_information
  question: 車両のリアウィンドウ（後部窓）が不透明になる素材で加工されている場合、法的に何が義務付けられていますか？
  choices:
    A: 180度の視野を持つバックカメラ。
    B: 少なくとも後方200フィートの視界を確保できる両側のサイドミラー。
    C: 車両がバックする際に鳴る警告音。
    D: 幹線道路安全局からの特別な許可。
  answer: B
  explanation: マニュアルによると、リアウィンドウが不透明になる素材で覆われたり加工されたりしている場合、車両には運転手が少なくとも後方200フィートの視界を確保できるサイドミラーを両側に装備しなければなりません。
- id: 217
  category: safe_driving_rules
  question: バックする際、運転手に推奨される姿勢は何ですか？
  choices:
    A: 両手をハンドルに置いたまま、バックカメラを見る。
    B: 左腕を窓枠に置き、サイドミラーを見る。
    C: 右腕を助手席の背もたれに置き、後ろを振り返ってリアウィンドウ（後部窓）から直接見る。
    D: 前のめりになり、ルームミラーだけを見る。
  answer: C
  explanation: マニュアルでは、バックする際は右腕を助手席の背もたれに置き、後ろを振り返ってリアウィンドウから直接後方を見るよう運転手に指示しています。
- id: 218
  category: defensive_driving
  question: 走行速度を2倍にすると、制動距離と衝撃にどのような影響がありますか？
  choices:
    A: 2倍になる。
    B: 3倍になる。
    C: 4倍になる。
    D: 8倍になる。
  answer: C
  explanation: マニュアルには、速度を2倍にすると制動距離と衝撃は4倍になると記載されています。
- id: 219
  category: defensive_driving
  question: 車両の総停止距離を構成する3つの要素は何ですか？
  choices:
    A: 視覚距離、機械的距離、制動距離。
    B: 認知距離、空走距離（反応距離）、制動距離。
    C: 観察距離、反応距離、停止距離。
    D: 死角距離、車間距離、制動距離。
  answer: B
  explanation: 総停止距離は、車両が移動する最小の合計距離として定義されており、これには認知距離、空走距離（反応距離）、および制動距離が含まれます。
- id: 220
  category: safe_driving_rules
  question: 天候や交通状況が良好な場合、推奨される最小車間距離はどれくらいですか？
  choices:
    A: 2秒。
    B: 3秒。
    C: 4秒。
    D: 6秒。
  answer: C
  explanation: マニュアルでは、天候や交通状況が良好な場合、最低4秒の車間距離を保つことを推奨しています。
- id: 221
  category: sharing_the_road
  question: 緊急走行中の消防車の後ろを走行する場合、法律で定められた最小車間距離はどれくらいですか？
  choices:
    A: 100フィート。
    B: 200フィート。
    C: 300フィート。
    D: 500フィート。
  answer: D
  explanation: 緊急走行中の消防車に500フィート未満まで接近して追従することは法律で禁止されています。
- id: 222
  category: sharing_the_road
  question: 市街地や町以外の場所で、トラックが別のトラックの後ろを走行する場合の最小車間距離はどれくらいですか？
  choices:
    A: 100フィート。
    B: 200フィート。
    C: 300フィート。
    D: 500フィート。
  answer: C
  explanation: トラックや他の車両を牽引している車両は、追い越し時や市街地・町の中を除き、別のトラックや牽引中の車両から300フィート以内の距離で追従してはなりません。
- id: 223
  category: safe_driving_rules
  question: あなたと別の車両がほぼ同時に交差点に到着した場合、どうするべきですか？
  choices:
    A: 大きい車両に優先権がある。
    B: 左側の車両は右側の車両に道を譲らなければならない。
    C: 右側の車両は左側の車両に道を譲らなければならない。
    D: 走行速度が速い車両に優先権がある。
  answer: B
  explanation: 複数の車両がほぼ同時に到着した場合、各運転手は右側にいる運転手に道を譲らなければなりません。
- id: 224
  category: safe_driving_rules
  question: 信号や標識のない交差点（オープン・インターセクション）に進入する際、次のどの状況で優先権を譲らなければなりませんか？
  choices:
    A: 自分が直進しており、別の車両が右折している場合。
    B: 未舗装の道路から舗装された道路に進入する場合。
    C: 舗装された道路から未舗装の道路に進入する場合。
    D: 自分が最初に交差点に到着した車両である場合。
  answer: B
  explanation: 信号や標識のない交差点では、未舗装の道路から舗装された道路に進入する場合、優先権を譲らなければなりません。
- id: 225
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、交通はどの方向に流れますか？
  choices:
    A: 時計回り。
    B: 反時計回り。
    C: 車線に応じて両方向。
    D: 中央を直進。
  answer: B
  explanation: ラウンドアバウトは、反時計回りの一方通行で進行します。
- id: 226
  category: safe_driving_rules
  question: 複数車線のあるラウンドアバウトでUターンをしたい場合、どの車線を使用するべきですか？
  choices:
    A: 右車線。
    B: 左車線。
    C: 中央車線。
    D: 路肩。
  answer: B
  explanation: 複数車線のあるラウンドアバウトで、直進、左折、またはUターンをする場合は、左車線を使用しなければなりません。
- id: 227
  category: defensive_driving
  question: 車線変更をする前に死角（ブラインドスポット）を確認する最良の方法は何ですか？
  choices:
    A: ルームミラーだけを見る。
    B: サイドミラーを少なくとも3秒間確認する。
    C: 頭を向けて、そのエリアに車両がいないことを確認する。
    D: 車のバックカメラに頼る。
  answer: C
  explanation: 車線変更、追い越し、または特定の方向転換を行う前に、頭を向けて死角に車両がいないことを確認しなければなりません。
- id: 228
  category: defensive_driving
  question: 別の車両が車間距離を詰めすぎている場合、どうするべきですか？
  choices:
    A: 速度を上げて距離を広げる。
    B: ブレーキを何度も軽く踏んで運転手に警告する。
    C: 減速して右側に寄る。
    D: 左車線に移動して速度を維持する。
  answer: C
  explanation: マニュアルには、後続車に車間距離を詰められすぎている場合は、減速して右側に寄るべきだと記載されています。
- id: 229
  category: defensive_driving
  question: 走行速度を3倍にした場合、制動距離と衝突時の衝撃はどれくらい大きくなりますか？
  choices:
    A: 3倍大きくなる。
    B: 6倍大きくなる。
    C: 9倍大きくなる。
    D: 12倍大きくなる。
  answer: C
  explanation: 速度を3倍にすると、制動距離と衝突時の衝撃は9倍になります。
- id: 230
  category: safe_driving_rules
  question: 2方向の一時停止交差点で、一方の車両が曲がろうとし、もう一方の車両が直進しようとしている場合、どちらに優先権がありますか？
  choices:
    A: 曲がる車両は直進する車両に道を譲らなければならない。
    B: 直進する車両は曲がる車両に道を譲らなければならない。
    C: 2番目に到着した車両に優先権がある。
    D: 常に左側の車両に優先権がある。
  answer: A
  explanation: 2方向の一時停止交差点では、曲がる車両が直進する車両に道を譲ります。
- id: 231
  category: vehicle_information
  question: 次の車両のうち、自動車専用道路（limited-access highways）の通行が許可されていないものはどれですか？
  choices:
    A: 排気量150cc以下のモータースクーター
    B: 排気量250ccのオートバイ
    C: 乗用バン
    D: レッカー車
  answer: A
  explanation: 歩行者、ヒッチハイカー、自転車、動物牽引車両、および原動機付自転車/モータースクーター（排気量150cc以下）は、自動車専用道路の通行が許可されていません。
- id: 232
  category: safe_driving_rules
  question: 自動車専用道路に進入する際、加速車線の終点に達した場合はどうすべきですか？
  choices:
    A: 直ちに停止し、車列の切れ目を待つ
    B: 安全に合流できるように速度を調整する
    C: 無理やり右車線に割り込む
    D: 後退して、もう一度ランプ（進入路）から入り直す
  answer: B
  explanation: 加速車線の終点に達した際は、安全に合流できるように速度を調整する必要があります。交通量が多すぎてスペースがない場合を除き、停止してはいけません。
- id: 233
  category: defensive_driving
  question: 自動車専用道路において、最も危険性が高いとされる衝突事故のタイプはどれですか？
  choices:
    A: 正面衝突
    B: 追突事故
    C: 側面衝突（こすり合わせ）
    D: 横転事故
  answer: B
  explanation: マニュアルには次のように記載されています。「車間距離を詰めすぎないでください。自動車専用道路では、追突事故が最も大きな危険です。」
- id: 234
  category: sharing_the_road
  question: ムーブ・オーバー法（Move Over Law）に基づき、2車線道路で点滅灯をつけて停車している緊急車両に近づく際、何をしなければなりませんか？
  choices:
    A: その車両に最も近い車線を空ける
    B: 緊急事態が解決するまで車を完全に停止させる
    C: 制限速度より20 MPH低い速度まで減速する
    D: 速度を維持しつつ、作業員に警告するためにクラクションを鳴らす
  answer: C
  explanation: 2車線道路では、ムーブ・オーバー法により、制限速度より20 MPH低い速度まで減速することが義務付けられています。
- id: 235
  category: sharing_the_road
  question: 制限速度が20 MPH以下の場合、2車線道路で警告灯をつけて停車している作業車両（utility vehicle）を追い越す際、どのくらいの速度で走行しなければなりませんか？
  choices:
    A: 15 MPH
    B: 10 MPH
    C: 5 MPH
    D: 完全に停止しなければならない
  answer: C
  explanation: 2車線道路において制限速度が20 MPH以下の場合は、ムーブ・オーバー法を遵守するため、5 MPHで走行しなければなりません。
- id: 236
  category: safe_driving_rules
  question: 縁石に沿って縦列駐車をする際、右側の車輪は縁石からどのくらい近づけなければなりませんか？
  choices:
    A: 6インチ以内
    B: 12インチ以内
    C: 18インチ以内
    D: 24インチ以内
  answer: B
  explanation: 交通の進行方向に向かって縁石と平行に駐車し、右側の車輪を縁石または道路の端から12インチ以内に平行に保たなければなりません。
- id: 237
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、ハンドルをどちらの方向に切るべきですか？
  choices:
    A: 車輪を右に向ける
    B: 車輪を縁石に向ける
    C: 車輪を縁石から遠ざける方向に向ける
    D: 車輪を完全にまっすぐに保つ
  answer: C
  explanation: 縁石のある上り坂で駐車する場合は、車輪を縁石から遠ざける方向（車道側）に向けなければなりません。
- id: 238
  category: safe_driving_rules
  question: 消火栓から何フィート以内に駐車することは法律で禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: B
  explanation: 消火栓から15フィート以内に駐車することは法律で禁止されています。
- id: 239
  category: safe_driving_rules
  question: 他の車両を追い越す際、道路の右側に戻るのが安全とされるのはいつですか？
  choices:
    A: 自分の車のフロントバンパーが他の車両を通り過ぎたらすぐ
    B: 追い越した車両のタイヤがルームミラーで見えるようになったとき
    C: その車両を通り過ぎてから100フィート進んだ後
    D: 他のドライバーがヘッドライトをパッシングしたとき
  answer: B
  explanation: 追い越した車両のタイヤがルームミラーで見えるようになるまでは、道路の右側に戻ってはいけません。
- id: 240
  category: safe_driving_rules
  question: 追い越しをする際、対向車から何フィート以内に近づく前に道路の右側に戻らなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 対向車から200フィート以内に近づく前に、道路の右側に戻らなければなりません。
- id: 241
  category: safe_driving_rules
  question: 坂道やカーブで、前方が少なくともどのくらい先まで見えない場合は追い越しをしてはいけませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: 坂道やカーブで、前方が少なくとも500フィート先まで見えない場合は、追い越しをしてはいけません。
- id: 242
  category: sharing_the_road
  question: 左側車線を走行中、後方からより速い車両に追い越されそうになった場合、フロリダ州法ではどうすることが義務付けられていますか？
  choices:
    A: 追い越そうとする車両に合わせて速度を上げる
    B: 左側車線から移動する（車線を譲る）
    C: ブレーキを軽く踏んで後続車の運転手に警告する
    D: ハザードランプを点灯させる
  answer: B
  explanation: フロリダ州法では、より速い速度で走行する別の車両に後方から追い越されそうになった場合、運転手は左側車線から移動して道を譲らなければならないと定められています。
- id: 243
  category: safe_driving_rules
  question: 右側からの追い越しが法的に許可されるのはどのような条件のときですか？
  choices:
    A: 前方の車両が右側車線を遅すぎる速度で走行しているとき
    B: 広い路肩のある片側1車線の道路を走行しているとき
    C: 追い越そうとしている車両が左折しようとしているとき
    D: 右側からの追い越しは常に違法である
  answer: C
  explanation: 右側からの追い越しが合法となるのは、同じ方向に進む車線が2つ以上ある場合、または追い越そうとしている車両が左折しようとしている場合のみです。
- id: 244
  category: safe_driving_rules
  question: フロリダ州の市街地、商業地域、または住宅街における標準的な制限速度は時速何マイルですか？
  choices:
    A: 時速20マイル (20 MPH)
    B: 時速30マイル (30 MPH)
    C: 時速45マイル (45 MPH)
    D: 時速55マイル (55 MPH)
  answer: B
  explanation: フロリダ州の標準制限速度によると、市街地、商業地域、または住宅街での最高速度は、別の標識がない限り時速30マイル（30 MPH）です。
- id: 245
  category: defensive_driving
  question: 車の速度を2倍にすると、衝突時の衝撃力はどうなりますか？
  choices:
    A: 2倍になる。
    B: 3倍になる。
    C: 4倍になる。
    D: 9倍になる。
  answer: C
  explanation: マニュアルには、車の速度を2倍にすると、衝突時の衝撃力は4倍になると記載されています。
- id: 246
  category: safe_driving_rules
  question: 制限速度が時速70マイル（70 MPH）と標識で示されている幹線道路（ハイウェイ）での最低制限速度は時速何マイルですか？
  choices:
    A: 時速40マイル (40 MPH)
    B: 時速45マイル (45 MPH)
    C: 時速50マイル (50 MPH)
    D: 時速55マイル (55 MPH)
  answer: C
  explanation: 幹線道路（ハイウェイ）で制限速度が時速70マイル（70 MPH）と示されている場合、最低制限速度は時速50マイル（50 MPH）です。
- id: 247
  category: safe_driving_rules
  question: 3車線または5車線の幹線道路（ハイウェイ）の中央車線は何のために使用されますか？
  choices:
    A: 遅い車両を追い越すため
    B: 多人数乗車車両（HOV）のため
    C: 緊急車両専用
    D: 左折専用
  answer: D
  explanation: 3車線または5車線の幹線道路（ハイウェイ）の中央車線は、左折専用として使用されます。
- id: 248
  category: signs_and_signals
  question: 車線上の反射板（リフレクター）が赤色で自分の方を向いている場合、それは何を意味しますか？
  choices:
    A: 料金所に近づいている。
    B: 道路の逆走（反対車線）をしている。
    C: その車線は工事のため閉鎖されている。
    D: 停止線に近づいている。
  answer: B
  explanation: 車線上の反射板が赤色で自分の方を向いている場合、あなたは道路を逆走しており、正面衝突を起こす危険性があります。
- id: 249
  category: safe_driving_rules
  question: 曲がる前に、少なくともどのくらい手前から方向指示器（ウィンカー）を出さなければなりませんか？
  choices:
    A: 少なくとも50フィート
    B: 少なくとも100フィート
    C: 少なくとも150フィート
    D: 少なくとも200フィート
  answer: B
  explanation: 曲がる少なくとも100フィート手前で、方向指示器（ウィンカー）を出さなければなりません。
- id: 250
  category: safe_driving_rules
  question: 曲がり終える際の適切な車線について、次のうち正しいものはどれですか？
  choices:
    A: 左折は常に一番左の車線で完了しなければならない。
    B: 右折は法的に利用可能な車線であればどの車線で完了してもよい。
    C: 右折は、進入する道路の右側車線で完了しなければならない。
    D: 後続車の運転手に追い越し可能であることを伝えるために、方向指示器を使用してもよい。
  answer: C
  explanation: 適切な車線で曲がり終えなければなりません。右折の場合は、進入する道路の右側車線に入ります。左折の場合は、法的に利用可能な車線であればどの車線で完了しても構いません。
- id: 251
  category: safe_driving_rules
  question: 3点ターン（スリーポイントターン）を使用するのが適切なのはいつですか？
  choices:
    A: 視界の悪いカーブや坂道。
    B: 道路が狭すぎてUターンできず、ブロックを迂回できない場合のみ。
    C: 高速道路で素早く方向転換するため。
    D: Uターン禁止の標識がある場合はいつでも。
  answer: B
  explanation: 3点ターンは、道路が狭すぎてUターンできず、ブロックを迂回できない場合のみ使用してください。カーブ、坂道、高速道路、またはUターンが禁止されている場所では、絶対に3点ターンを行ってはいけません。
- id: 252
  category: defensive_driving
  question: 動物との衝突が避けられない場合、どうすべきですか？
  choices:
    A: 避けるために対向車線に急ハンドルを切る。
    B: 道路から路肩へ急ハンドルを切る。
    C: 急ハンドルを切らず、車をコントロールして車道内を維持する。
    D: できるだけ早く止まるために、すぐにブレーキをロックさせる。
  answer: C
  explanation: 衝突が避けられない場合は、動物を避けるために急ハンドルを切らないでください。急ハンドルはより深刻な事故につながる可能性があるため、車をコントロールして車道内を維持してください。
- id: 253
  category: safe_driving_rules
  question: 霧や大雨など、視界が悪い状況で運転する場合、どのライトを使用すべきですか？
  choices:
    A: パーキングライト（車幅灯）
    B: ハイビームヘッドライト
    C: ロービームヘッドライト
    D: ハザードランプ
  answer: C
  explanation: ロービームを点灯して運転してください。ハイビームは霧に反射して視界をさらに悪化させます。パーキングライトは代用にはなりません。
- id: 254
  category: safe_driving_rules
  question: 雨天時にワイパーを作動させる際、何をしなければなりませんか？
  choices:
    A: ハザードランプを点灯する。
    B: ヘッドライトを点灯する。
    C: タイヤの溝から水を飛ばすために速度を上げる。
    D: 低いギアにシフトダウンする。
  answer: B
  explanation: マニュアルには「ワイパーを作動させる際は、ヘッドライトを点灯すること」と記載されています。
- id: 255
  category: vehicle_information
  question: 大雨の中を運転した後にブレーキが濡れて効きが悪くなった場合、どうすべきですか？
  choices:
    A: ブレーキを素早く強くポンピングする。
    B: 車を停めて自然乾燥するのを待つ。
    C: 減速し、ブレーキが再び効くようになるまでブレーキペダルを優しく踏む。
    D: ブレーキパッドに熱を発生させるために高速で運転する。
  answer: C
  explanation: ブレーキが濡れると、片側に寄ったり全く効かなくなったりすることがあります。このような場合は、減速し、ブレーキが再び効くようになるまでブレーキペダルを優しく踏んでください。
- id: 256
  category: safe_driving_rules
  question: ハイビームヘッドライトは最大でどのくらいの距離の物体を照らすことができますか？
  choices:
    A: 250フィート
    B: 300フィート
    C: 450フィート
    D: 500フィート
  answer: C
  explanation: ハイビームヘッドライトは少なくとも450フィート先の物体を照らすことができ、時速25マイル（25 MPH）以上の速度で最も効果的です。
- id: 257
  category: sharing_the_road
  question: 多人数乗車車両（HOV）レーンの使用が許可されているのはどの車両ですか？
  choices:
    A: 制限速度を超えて走行しているすべての車両。
    B: 2人以上が乗車している車両、または登録済みのハイブリッド車/低排出ガス車。
    C: 商用トラックとバスのみ。
    D: 左折の準備をしている車両。
  answer: B
  explanation: 一部の高速道路では、左側車線を2人以上が乗車している車両、またはハイブリッド車/低排出ガス車（LEV）専用としています。
- id: 258
  category: safe_driving_rules
  question: 冠水した道路に遭遇した場合、どうすべきですか？
  choices:
    A: 水しぶきを上げないようにゆっくりと通り抜ける。
    B: 引き返して別のルートを探す。
    C: 低いギアにシフトダウンし、注意して進む。
    D: 大型車が先に渡るのを待ち、その跡をたどる。
  answer: B
  explanation: 冠水した道路に遭遇した場合は、引き返して別のルートを探してください。車が水没したり流されたりする可能性があるため、水の中を通り抜けようとしないでください。
- id: 259
  category: safe_driving_rules
  question: フロリダ州法では、対向車からどのくらいの距離以内でハイビームヘッドライトを使用してはいけませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: D
  explanation: フロリダ州法では、対向車から500フィート以内ではハイビームヘッドライトを使用してはならないと定められています。ロービームヘッドライトを使用してください。
- id: 260
  category: safe_driving_rules
  question: 夜間に他の車両の後ろを走行する際、どのくらいの距離以内に近づいた場合にロービームヘッドライトに切り替えなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: B
  explanation: フロリダ州法では、前方の車両から300フィート以内ではハイビームヘッドライトを使用してはならないと義務付けられています。ロービームヘッドライトを使用してください。
- id: 261
  category: safe_driving_rules
  question: フロリダ州での車幅灯（パーキングライト）の使用について、正しいものは次のうちどれですか？
  choices:
    A: 夜明けや夕暮れ時は、車幅灯のみを使用して運転してもよい。
    B: 夜間、市街地以外の道路に駐車する場合は点灯しなければならない。
    C: 濃霧の際は、ロービームの代わりに使用すべきである。
    D: 対向車に接近する際は使用しなければならない。
  answer: B
  explanation: フロリダ州法では、夜間に市街地や町以外の道路や路肩に駐車する場合は車幅灯を点灯しなければならず、ヘッドライトの代わりに車幅灯のみを使用して運転してはならないと定められています。
- id: 262
  category: defensive_driving
  question: マニュアルによると、他のどの場所よりも衝突事故が多く発生するのはどこですか？
  choices:
    A: 高速道路
    B: 駐車場
    C: 交差点
    D: スクールゾーン
  answer: C
  explanation: 交差点では他のどの場所よりも衝突事故が多く発生するため、交差点に接近する際は特に注意を払う必要があります。
- id: 263
  category: defensive_driving
  question: 衝突が避けられない場合、防衛運転の選択として最も適切なものは次のうちどれですか？
  choices:
    A: 道路外に出るよりも、対向車線にハンドルを切る。
    B: 柔らかい物体よりも、木のような硬い物体にぶつかる。
    C: 正面衝突するよりも、同じ方向に進んでいる車両にぶつかる。
    D: 道路外へ運転して逃れるよりも、スリップして道路外に出る。
  answer: C
  explanation: 衝突が避けられない場合、正面衝突するよりも、自分と同じ方向に進んでいる車両にぶつかる方が安全です。
- id: 264
  category: driver_responsibility
  question: 夜間に警察官に車を止められた場合、どうすべきですか？
  choices:
    A: すぐにヘッドライトを消す。
    B: 視認性を高めるために車内灯を点ける。
    C: 車から降りて警察官に挨拶する。
    D: 警察官が近づいてくる前に、グローブボックスに手を入れて車両登録証を取り出す。
  answer: B
  explanation: 夜間の交通取締りで車を止められた際は、視認性を高めるために車内灯を点灯させるべきです。
- id: 265
  category: penalties_and_points
  question: 交通違反切符への署名は何を意味しますか？
  choices:
    A: 罪を認めること。
    B: 裁判所の審問を受ける権利の放棄。
    C: 切符の受け取りを意味するが、罪を認めるものではない。
    D: 10日以内に罰金を支払うことへの同意。
  answer: C
  explanation: 交通違反切符を受け取り署名することは、罪を認めることではありません。ただし、交通違反切符への署名を拒否すると、逮捕される可能性があります。
- id: 266
  category: driver_responsibility
  question: 交通取締りで車を止められた際、車内に武器がある場合、いつ警察官に知らせるべきですか？
  choices:
    A: 警察官が車内の捜索を求めた場合のみ。
    B: 警察官と最初に接触した時。
    C: 運転免許証と車両登録証を渡した後。
    D: この情報を開示する義務はない。
  answer: B
  explanation: 警察官が車に近づいてきたら、最初の接触時に車内に武器があることを警察官に知らせることを忘れないでください。
- id: 267
  category: driver_responsibility
  question: 軽微な衝突事故を起こし、自分の車が交通の妨げになっている場合、どうしなければなりませんか？
  choices:
    A: 警察が到着するまで、車をそのままの場所に置いておく。
    B: 車を移動させるか、移動してもらう。
    C: 車を移動させる前にレッカー車を待つ。
    D: 道路に立って、車を避けるように交通整理をする。
  answer: B
  explanation: 事故が軽微で、自分の車が交通の妨げになっている場合は、車を移動させるか、移動してもらわなければなりません。
- id: 268
  category: driver_responsibility
  question: 衝突事故により車両に損害が生じたが、警察の報告書が必要ない場合、フロリダ州幹線道路安全・自動車局（FLHSMV）に書面で報告する期限はどれくらいですか？
  choices:
    A: 24時間以内
    B: 3日以内
    C: 10日以内
    D: 30日以内
  answer: C
  explanation: 衝突事故により車両または財産に損害が生じ、警察の報告書が必要ない場合、10日以内にFLHSMVに事故の書面報告を行わなければなりません。
- id: 269
  category: driver_responsibility
  question: 無人の車両に衝突し、所有者が見つからない場合、どうしなければなりませんか？
  choices:
    A: 所有者が戻るまで車のそばで待つ。
    B: 自分の名前、連絡先、ナンバープレートの番号を記したメモを残す。
    C: 保険会社に電話して現場を離れる。
    D: 30日以内にDMV（車両管理局）に報告する。
  answer: B
  explanation: 所有者が見つからない場合は、自分の名前、連絡先、ナンバープレート（登録）番号を記したメモを残さなければなりません。
- id: 270
  category: penalties_and_points
  question: 死亡事故を引き起こし、現場から逃走した場合の罰則は何ですか？
  choices:
    A: 第1級重罪および最低4年の懲役刑。
    B: 第2級重罪および最低2年の懲役刑。
    C: 第3級重罪および1年間の免許停止。
    D: 第1級軽犯罪および5,000ドルの罰金。
  answer: A
  explanation: 死亡事故を引き起こして現場から逃走した場合、第1級重罪となり、最低4年の懲役刑が科せられます。
- id: 271
  category: penalties_and_points
  question: 負傷、重傷、または死亡を伴う交通事故の現場から逃走した場合、運転免許証は最低でも次の期間取り消されます：
  choices:
    A: 6ヶ月
    B: 1年
    C: 3年
    D: 5年
  answer: C
  explanation: 負傷、重傷、または死亡を伴う交通事故の現場から逃走した場合、いずれも最低3年間の運転免許取り消し処分となります。
- id: 272
  category: safe_driving_rules
  question: 衝突事故の後、ショック状態にある負傷者をどのように手当てすべきですか？
  choices:
    A: たっぷりと水を飲ませる。
    B: 上体を起こして座らせ、涼しく保つ。
    C: 仰向けに寝かせて脚を高くし、毛布を掛ける。
    D: 直ちに道路の端へ移動させる。
  answer: C
  explanation: ショック状態の手当てをするには、負傷者を仰向けに寝かせて脚を高くし、体温を保つために毛布を掛け、落ち着かせます。また、飲み物は一切与えてはいけません。
- id: 273
  category: defensive_driving
  question: 通常の状況下で追突事故を防ぐために推奨される、最小限の車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 6秒
  answer: C
  explanation: 前方の車両への追突を避けるため、少なくとも4秒の車間距離を保ち、悪天候時や交通渋滞時にはさらに距離を広げてください。
- id: 274
  category: safe_driving_rules
  question: 車両が故障した場合、駐車した車は前後どちらの方向からもどのくらいの距離から見えるようにすべきですか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 可能であれば、故障した車両が前後両方向から200フィート離れた場所からでも見える位置に駐車してください。
- id: 275
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）を装備した車両で緊急停止する場合、どのように操作すべきですか？
  choices:
    A: ブレーキを小刻みに踏む（ポンピングブレーキ）。
    B: ブレーキペダルを強く踏み込み、そのまま保持してハンドル操作で危険を回避する。
    C: ハンドル操作をしながらブレーキを軽く叩くように踏む。
    D: 直ちにパーキングブレーキをかける。
  answer: B
  explanation: アンチロック・ブレーキ・システム（ABS）を装備した車両の運転者は、ブレーキペダルを強く踏み込み、そのまま保持してハンドル操作で危険を回避しなければなりません。ブレーキを小刻みに踏む（ポンピングする）と、ABSが解除されてしまいます。
- id: 276
  category: defensive_driving
  question: 車両の火災を消火しようとする際、絶対にやってはいけないことは何ですか？
  choices:
    A: 911に電話して助けを呼ぶ。
    B: 携帯用消火器を使用する。
    C: ガソリンやディーゼル燃料の火災に水をかける。
    D: 直ちに車から降りる。
  answer: C
  explanation: 携帯用消火器を持っており、かつ火が小さい場合にのみ消火を試みてください。ガソリンやディーゼル燃料の火災には、絶対に水をかけてはいけません。
- id: 277
  category: defensive_driving
  question: アクセルペダルが戻らなくなった（引っかかった）場合、最初に取るべき行動は何ですか？
  choices:
    A: 直ちにエンジンを切る。
    B: 急ブレーキをかける。
    C: ギアをパーキング（P）に入れる。
    D: アクセルペダルから足を離す。
  answer: D
  explanation: アクセルペダルが戻らなくなった場合、最初のステップはアクセルペダルから足を離すことです。その後、クラッチを踏むか、ギアをニュートラル（N）に入れます。
- id: 278
  category: safe_driving_rules
  question: 停電により信号機が作動していない交差点では、どのように対応すべきですか？
  choices:
    A: 「ゆずれ（Yield）」の標識があるものとして扱う。
    B: 四方向一時停止（Four-way stop）として扱う。
    C: 自分が優先道路にいる場合は、停止せずに進行する。
    D: 警察官が到着するまで交差点の通過を待つ。
  answer: B
  explanation: 停電などで信号機が作動していない状況では、交差点を四方向一時停止（Four-way stop）として扱ってください。
- id: 279
  category: defensive_driving
  question: 車両がスキッド（横滑り）またはハイドロプレーニング現象を起こし始めた場合、どうすべきですか？
  choices:
    A: 直ちに急ブレーキをかける。
    B: 前輪をスキッドしている方向とは逆の方向に向ける。
    C: アクセルペダルから足を離し、スキッドしている方向にハンドルを切る。
    D: 加速してトラクション（駆動力）を回復させる。
  answer: C
  explanation: スキッドやハイドロプレーニング現象が起きた場合は、アクセルペダルから足を離し、できるだけブレーキを使用せず、進みたい方向に前輪を向けます（スキッドしている方向にハンドルを切ります）。
- id: 280
  category: defensive_driving
  question: 踏切内で車がエンストし、列車が接近している場合、どの方向に逃げるべきですか？
  choices:
    A: 列車の進行方向と同じ方向。
    B: 線路から離れるように45度の角度で、列車に向かう方向。
    C: 線路から離れるように45度の角度で、列車から遠ざかる方向。
    D: 線路に対して垂直の方向。
  answer: B
  explanation: 列車が接近している場合は、線路から離れるように45度の角度で、かつ列車に向かう方向に走って逃げてください。これにより、衝突で飛ばされた自分の車や破片に当たる危険性が低くなります。
- id: 281
  category: defensive_driving
  question: 車が水域（池や川など）に転落した場合、およそどのくらいの時間水面に浮いていますか？
  choices:
    A: 10〜20秒
    B: 30〜60秒
    C: 2〜3分
    D: 5分
  answer: B
  explanation: 池や川などの水域に転落した場合、車は30〜60秒間しか水面に浮いていません。直ちに脱出しなければなりません。
- id: 282
  category: defensive_driving
  question: タイヤがパンク（バースト）した場合の適切な対応は何ですか？
  choices:
    A: 急ブレーキをかけ、路肩にハンドルを切る。
    B: アクセルから足を離し、ハンドル操作に集中し、車をコントロールできるようになってから優しくブレーキをかける。
    C: 勢いを保つために少し加速する。
    D: ブレーキを素早くポンピングする。
  answer: B
  explanation: タイヤがパンク（バースト）した際は、アクセルから足を離し、ブレーキは使用せず、ハンドル操作に集中して徐々に減速し、車をコントロールできるようになってから優しくブレーキをかけます。
- id: 283
  category: vehicle_information
  question: 濡れたブレーキを乾かすにはどうすればよいですか？
  choices:
    A: 高速で走行し、風で乾かす。
    B: ニュートラルに入れて惰性で走行する。
    C: 低速ギアでゆっくり走行し、ブレーキをかける。
    D: 停車中にブレーキを素早くポンピングする。
  answer: C
  explanation: 低速ギアでゆっくり走行しながらブレーキをかけることで、濡れたブレーキを乾かすことができます。
- id: 284
  category: sharing_the_road
  question: フロリダ州法では、自転車の横を走行したり追い越したりする際、運転者は自転車に対して最低どれくらいの間隔（クリアランス）を空けることが義務付けられていますか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 5フィート
  answer: B
  explanation: フロリダ州法では、自転車の横を走行したり追い越したりする際、最低3フィートの間隔を空け、注意を払いながら低速で走行することが義務付けられています。
- id: 285
  category: sharing_the_road
  question: 曲がるために自転車専用レーンを横切らなければならない場合、適切な手順は何ですか？
  choices:
    A: 曲がる前にスピードを上げて自転車を追い越す。
    B: クラクションを鳴らして自転車に道を譲るよう警告する。
    C: すべての自転車に道を譲り、自転車の後ろで曲がる。
    D: 自転車の前で曲がる。
  answer: C
  explanation: 曲がるために自転車専用レーンを横切らなければならない場合は、すべての自転車に道を譲り、自転車の後ろで曲がります。
- id: 286
  category: sharing_the_road
  question: 自転車が車線全体を使用できるのはどのような条件のときですか？
  choices:
    A: 制限速度と全く同じ速度で走行している場合のみ。
    B: 車線が狭すぎて、車と自転車が安全に共有できない場合。
    C: 自動車専用道路（アクセス制限のある高速道路）のみ。
    D: 自転車専用レーンを使用したくない場合はいつでも。
  answer: B
  explanation: 車線が狭すぎて車と自転車が共有できない場合、自転車は交通の流れより遅い速度で走行していても、車線全体を使用することができます。
- id: 287
  category: sharing_the_road
  question: 日没から日の出までの間、自転車の後部に義務付けられている照明は何ですか？
  choices:
    A: 赤色反射板と、600フィート先から見える赤色灯
    B: 500フィート先から見える白色灯
    C: 300フィート先から見える赤色灯
    D: 点滅するハザードランプ
  answer: A
  explanation: マニュアルには、日没から日の出までの間、自転車の後部には赤色反射板と、600フィート先から見える赤色灯を装備しなければならないと記載されています。
- id: 288
  category: safe_driving_rules
  question: 車道で自転車に乗る際のヘッドホンの着用に関する規則は何ですか？
  choices:
    A: 音量を低く保てば許可される
    B: 歩道を走行する場合にのみ許可される
    C: 自転車の運転者は、両耳にヘッドホンやイヤホンを着用してはならない
    D: 18歳以上であれば着用できる
  answer: C
  explanation: マニュアルによると、車道で自転車に乗る際、運転者は両耳にヘッドホンやイヤホンを着用してはなりません。
- id: 289
  category: sharing_the_road
  question: 下り坂で商用自動車（CMV）を追い越すのを避けるべき理由は何ですか？
  choices:
    A: 下り坂ではCMVのブレーキが故障しやすいため
    B: CMVの重量と勢いにより速度が増すため
    C: 下り坂ではCMVの運転手がミラーであなたの車を確認できないため
    D: 下り坂で車両を追い越すことは違法であるため
  answer: B
  explanation: マニュアルでは、重量と勢いによって速度が増すため、下り坂で商用自動車（CMV）を追い越すことは避けるよう推奨しています。
- id: 290
  category: sharing_the_road
  question: 商用自動車（CMV）が右折の準備をしている場合、あなたはどうするべきですか？
  choices:
    A: CMVの右側を素早く追い越す
    B: クラクションを鳴らして運転手に自分の存在を知らせる
    C: CMVと縁石の間を走行しない
    D: すぐに左車線に移動して追い越す
  answer: C
  explanation: CMVは右折するために、左に大きく膨らむ必要があることがよくあります。マニュアルでは、運転手から見えなくなるため、CMVと縁石の間を走行しないよう警告しています。
- id: 291
  category: safe_driving_rules
  question: サイレンを鳴らしたり赤色灯を点滅させたりしている緊急車両が接近してきた場合、どうしなければなりませんか？
  choices:
    A: 時速10マイルまで減速し、ハザードランプを点灯させる
    B: 直ちに道路の最も近い端に寄せて停車する
    C: 現在の車線のその場に正確に停止する
    D: 加速して緊急車両の前方の道路を空ける
  answer: B
  explanation: 運転者は、サイレンを鳴らしたり赤色灯を点滅させたりしている緊急車両に対して、直ちに道路の最も近い端に寄せて停車し、車両が通過するまで待つことで、通行権（優先権）を譲らなければなりません。
- id: 292
  category: sharing_the_road
  question: 葬列の車両は、他の運転者に対して列の間に割り込まないようどのように合図しますか？
  choices:
    A: クラクションを鳴らし続ける
    B: ヘッドライトを点灯させるか、ハザードランプを点滅させて走行する
    C: 車のアンテナに黒い旗を立てる
    D: 正確に時速15マイルで走行する
  answer: B
  explanation: 葬列に参加するすべての車両は、他の車両が列の間に割り込まないようにするための合図として、ヘッドライトを点灯させるか、ハザードランプを点滅させて走行する必要があります。
- id: 293
  category: license_system
  question: 18歳以上の人が公道でゴルフカートを運転する場合、何が必要ですか？
  choices:
    A: 有効な運転免許証のみ
    B: 商用運転免許証
    C: 政府発行の有効な写真付き身分証明書
    D: 特別なゴルフカート許可証
  answer: C
  explanation: マニュアルには、18歳以上の運転者が公道でゴルフカートを運転する場合、政府発行の有効な写真付き身分証明書を所持していなければならないと記載されています。
- id: 294
  category: safe_driving_rules
  question: どのような条件の下で、ゴルフカートは州道を横断することができますか？
  choices:
    A: 制限速度が時速55マイル以下の場合
    B: 交通管制装置の有無にかかわらず、すべての交差点
    C: ゴルフカートの最高速度が時速25マイルの場合のみ
    D: 標識の制限速度が時速45マイル以下で、かつ交通管制装置のある交差点の場合
  answer: D
  explanation: 標識の制限速度が時速45マイル以下で、かつ交通管制装置（信号機など）のある交差点でのみ、ゴルフカートで州道を横断することができます。
- id: 295
  category: vehicle_information
  question: 低速車両（LSV）はどのような種類の道路で走行が許可されていますか？
  choices:
    A: 標識の制限速度が時速35マイル以下の道路
    B: 標識の制限速度が時速45マイル以下の道路
    C: 州間高速道路を除くすべての道路
    D: 私道およびゴルフコースのみ
  answer: A
  explanation: 低速車両（LSV）は、標識の制限速度が時速35マイル以下の道路でのみ走行しなければなりません。
- id: 296
  category: sharing_the_road
  question: オートバイの後ろを近すぎる距離で追従してはいけないのはなぜですか？
  choices:
    A: オートバイは渋滞時にエンストしやすいから
    B: 他の車両よりも早く停止する能力があるから
    C: 排気ガスが視界を妨げる可能性があるから
    D: オートバイは制限速度未満で走行することが義務付けられているから
  answer: B
  explanation: マニュアルでは、オートバイは他の車両よりも早く停止する能力があるため、近すぎる距離で追従しないようアドバイスしています。
- id: 297
  category: defensive_driving
  question: オートバイの運転者は、ブレーキランプを点灯させずにどのように減速することがありますか？
  choices:
    A: フロントブレーキのみをかけることによって
    B: 地面に足を引きずることによって
    C: シフトダウンするか、スロットルを戻すことによって
    D: エンジンを切ることによって
  answer: C
  explanation: オートバイの運転者は、シフトダウンしたりスロットルを戻したりして減速することがよくありますが、これらを行ってもブレーキランプは点灯しません。
- id: 298
  category: sharing_the_road
  question: 歩道や横断歩道で自転車に乗っている場合、自転車の運転者は歩行者を追い越す前に何をしなければなりませんか？
  choices:
    A: 自転車から降りて、歩いて歩行者を追い越す
    B: 追い越す前に音で合図を送る
    C: 前方の白いライトを点滅させる
    D: 右側からのみ追い越す
  answer: B
  explanation: 歩道や横断歩道を走行する場合、自転車の運転者は歩行者に通行権（優先権）を譲らなければならず、追い越す前には音で合図を送らなければなりません。
- id: 299
  category: safe_driving_rules
  question: 夜間に大型商用車（CMV）の後ろを走行する際、避けるべきことは何ですか？
  choices:
    A: 右車線を走行すること
    B: ハイビームのヘッドライトを使用すること
    C: 追い越しの合図としてヘッドライトを点滅させること
    D: 4秒間の車間距離を保つこと
  answer: B
  explanation: 夜間に大型商用車（CMV）の後ろを走行する際は、ハイビームのヘッドライトを使用してはいけません。強い光がCMVの大きなサイドミラーに反射し、運転者の目を眩ませてしまうためです。
- id: 300
  category: sharing_the_road
  question: 自動車の運転者がオートバイと同じ車線を共有することに関する規則は何ですか？
  choices:
    A: オートバイが一番右側を走行している場合は車線を共有してもよい
    B: 小型車を運転している場合は車線を共有してもよい
    C: オートバイと車線を共有しようとしてはいけない
    D: 激しい交通渋滞の際は車線を共有できる
  answer: C
  explanation: 自動車の運転者は、オートバイと車線を共有しようとしてはいけません。オートバイの運転者には、車線全体を使用する権利があります。
- id: 301
  category: safe_driving_rules
  question: 自転車の運転者が、4歳未満または体重40ポンド以下の子供を乗せる場合、何が義務付けられていますか？
  choices:
    A: 子供をハンドルバーに乗せなければならない
    B: 運転者は、子供を乗せるために設計されたバックパック/スリング、チャイルドシート、またはトレーラーを使用しなければならない
    C: 子供の足がペダルに届かなければならない
    D: 子供は別の自転車に乗らなければならない
  answer: B
  explanation: 4歳未満または体重40ポンド以下の子供を乗せる場合、自転車の運転者は、子供を乗せるために設計されたバックパック/スリング、チャイルドシート、またはトレーラーを使用しなければなりません。
- id: 302
  category: license_system
  question: フロリダ州の公道でオートバイまたはモペッド（原動機付自転車）を運転するために必要な最低年齢は何歳ですか？
  choices:
    A: 15歳
    B: 16歳
    C: 18歳
    D: 21歳
  answer: B
  explanation: マニュアルによると、公道でオートバイまたはモペッドを運転するには、16歳以上である必要があります。
- id: 303
  category: license_system
  question: モペッドを運転するには、どの種類の免許が必要ですか？
  choices:
    A: オートバイ専用免許
    B: オートバイの裏書（自動二輪免許の付記）があるクラスE運転免許証
    C: クラスE運転免許証
    D: 商業用運転免許証 (CDL)
  answer: C
  explanation: モペッドの運転者は、クラスE運転免許証を所持している必要があります。オートバイの裏書（自動二輪免許の付記）は必要ありません。
- id: 304
  category: safe_driving_rules
  question: オートバイの運転者がヘルメットの着用を免除されるのは、どのような条件の場合ですか？
  choices:
    A: 18歳以上で、有効なオートバイの裏書がある場合
    B: 21歳以上であり、かつ負傷に対して少なくとも10,000ドルの医療給付を提供する医療保険に加入している場合
    C: 住宅街を時速30マイル未満で運転している場合
    D: 個人傷害補償（PIP）保険に加入している場合
  answer: B
  explanation: オートバイの運転者は、21歳以上であり、かつ負傷に対して少なくとも10,000ドルの医療給付を提供する医療保険に加入していない限り、ヘルメットを着用しなければなりません。
- id: 305
  category: sharing_the_road
  question: 横断歩道で停止している車両に後方から近づいた場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして運転者に動くよう警告する
    B: 車線が空いていれば、左側からその車両を追い越す
    C: 歩行者が横断している可能性があると考え、停止している車両を追い越したり通り抜けたりしない
    D: 右側からゆっくりとその車両を追い越す
  answer: C
  explanation: 横断歩道で停止している車両を追い越したり通り抜けたりしてはいけません。後方から近づく運転者は、歩行者が見えなくても、横断している可能性があると考えなければなりません。
- id: 306
  category: safe_driving_rules
  question: 歩道がない場合、歩行者は車道のどこを歩くべきですか？
  choices:
    A: 右側の路肩を、交通の流れと同じ方向に歩く
    B: 左側の路肩を、交通の流れに対面して歩く
    C: 車線の中央を歩く
    D: 反射材のついた服を着ていれば、どちらの路肩でもよい
  answer: B
  explanation: 歩道のない車道を歩く場合、歩行者は常に左側の路肩を、交通の流れに対面して歩かなければなりません。
- id: 307
  category: sharing_the_road
  question: 運転者はどのような場合に、公共交通機関のバスに通行権を譲らなければなりませんか？
  choices:
    A: バスが反対方向を走行しているときはいつでも
    B: バスが同じ方向を走行しており、合図を出し、専用の停車帯から交通の流れに再合流しようとしているとき
    C: バスが赤色の点滅停止信号を表示しているときのみ
    D: バスが赤信号で停止しているときはいつでも
  answer: B
  explanation: すべての運転者は、同じ方向を走行しており、合図を出して専用の停車帯から交通の流れに再合流しようとしている公共交通機関のバスに通行権を譲らなければなりません。
- id: 308
  category: safe_driving_rules
  question: 子供の乗降を行っているスクールバスに対して、停止しなくてもよいのはどのような場合ですか？
  choices:
    A: 隆起した分離帯、または幅5フィート以上の未舗装の中央分離帯によって分割された幹線道路で、反対方向を走行している場合
    B: ペイントされた線によって分割された幹線道路で、反対方向を走行している場合
    C: 複数車線の幹線道路で、バスと同じ方向を走行している場合
    D: 対面通行の道路を運転しており、バスが反対側にいる場合
  answer: A
  explanation: 幹線道路が隆起した分離帯、または幅5フィート以上の未舗装の中央分離帯によって分割されている場合、バスと反対方向を走行していれば停止する必要はありません。
- id: 309
  category: sharing_the_road
  question: 幹線道路上のペイントされた線や路面標示は、反対方向の運転者がスクールバスのために停止することを免除される「分離帯」とみなされますか？
  choices:
    A: はい。ペイントされた線が黄色の実線である場合
    B: はい。二重の白色実線である場合
    C: いいえ。ペイントされた線や路面標示は分離帯とはみなされません
    D: はい。道路に少なくとも4つの車線がある場合
  answer: C
  explanation: ペイントされた線や路面標示は分離帯とはみなされません。隆起した分離帯、または幅5フィート以上の未舗装の中央分離帯がない限り、反対方向の運転者は停止しなければなりません。
- id: 310
  category: vehicle_information
  question: 時速25マイル未満で走行するように設計された農業用車両は、次のどれを使用する際に、後部に低速車マークを表示しなければなりませんか？
  choices:
    A: アクセス制限のある幹線道路および州間高速道路
    B: 公道（アクセス制限のある幹線道路/州間高速道路を除く）
    C: 自転車道および歩道
    D: 私道のみ
  answer: B
  explanation: 時速25マイル未満で走行するように設計された農業用車両は、公道（アクセス制限のある幹線道路/州間高速道路を除く）を使用する際、後部にこのマークを表示しなければなりません。
- id: 311
  category: sharing_the_road
  question: 先端が赤い白杖を持った視覚障害のある歩行者に近づく際、運転手は何をしなければなりませんか？
  choices:
    A: クラクションを鳴らして歩行者に警告する
    B: 減速し、左側を注意深く追い越す
    C: 完全に停止し、通行権を譲り、細心の注意を払う
    D: 歩行者が横断歩道にいない場合は、通常の制限速度で進む
  answer: C
  explanation: 先端が赤い白杖を持った視覚障害のある歩行者に近づく際、運転手は完全に停止し、通行権を譲り、細心の注意を払わなければなりません。
- id: 312
  category: vehicle_information
  question: フロリダ州において、オートバイやモペッドの運転手が加入を義務付けられていない保険はどれですか？
  choices:
    A: 対物賠償責任保険
    B: 個人傷害保護（PIP）保険
    C: 対人賠償責任保険
    D: 車両保険（衝突保険）
  answer: B
  explanation: オートバイやモペッドの運転手は、個人傷害保護（PIP）保険に加入する義務はありません。
- id: 313
  category: safe_driving_rules
  question: 横断歩道に子供や学校の交通指導員（クロッシングガード）がいる場合、運転手はどこで停止しなければなりませんか？
  choices:
    A: 横断歩道の中
    B: 横断歩道の中ではなく、停止線で
    C: 交差点の少なくとも20フィート手前で
    D: 交通指導員が赤い一時停止標識を掲げた場合のみ
  answer: B
  explanation: 横断歩道に子供や学校の交通指導員がいる場合、道を譲り、横断歩道の中ではなく停止線で停止しなければなりません。
- id: 314
  category: sharing_the_road
  question: 路地、私道（ドライブウェイ）、または専用道路に出入りする際、何をしなければなりませんか？
  choices:
    A: クラクションを鳴らし、止まらずに進む
    B: 歩道にいる歩行者のために停止する
    C: 本線を走る車両にのみ道を譲る
    D: ヘッドライトを点滅させて歩行者に警告する
  answer: B
  explanation: 路地、私道、または専用道路に出入りする際は、歩道にいる歩行者のために停止しなければなりません。
- id: 315
  category: license_system
  question: 18歳未満の場合、二輪車専用免許（Motorcycle Only license）の交付を受ける前に何が必要ですか？
  choices:
    A: 交通違反の有罪判決を受けずに、仮免許を6ヶ月間保持しなければならない
    B: 交通違反の有罪判決を受けずに、仮免許を12ヶ月間保持しなければならない
    C: 常に親が同乗していなければならない
    D: 50時間の監督付き運転を完了しなければならない
  answer: B
  explanation: 18歳未満の場合、二輪車専用免許の交付を受ける前に、交通違反の有罪判決を受けずに仮免許を12ヶ月間保持しなければなりません。
- id: 316
  category: safe_driving_rules
  question: 縁石から車を停めることができる最大距離はどれくらいですか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: B
  explanation: フロリダ州の駐車規則によると、縁石に平行駐車する場合、車輪は縁石から12インチ以内でなければなりません。
- id: 317
  category: safe_driving_rules
  question: 下り坂で駐車する場合、車輪をどちらの方向に向けなければなりませんか？
  choices:
    A: 縁石または道路の端の方向
    B: 縁石から離れる方向
    C: まっすぐ前
    D: 少し左
  answer: A
  explanation: 下り坂で駐車する場合、ブレーキが故障した際に車が道路外に転がるように、車輪を縁石または道路の端に向けなければなりません。
- id: 318
  category: sharing_the_road
  question: 自動車の運転手が自転車の横を走行する際、最低限空けなければならない距離はどれくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 5フィート
  answer: B
  explanation: フロリダ州法では、自動車の運転手が自転車の横を走行したり追い越したりする際、最低3フィートの安全間隔を空けることが義務付けられています。
- id: 319
  category: sharing_the_road
  question: 隆起した分離帯で区切られた幹線道路で、スクールバスが子供を降ろすために停車している場合、反対方向を走行している車両は停止する必要がありますか？
  choices:
    A: はい、すべての車両はスクールバスのために停止しなければなりません。
    B: はい、一番右の車線にいない限り停止しなければなりません。
    C: いいえ、反対方向を走行している車両は停止する必要はありません。
    D: いいえ、ただし時速15マイル（15 mph）まで減速しなければなりません。
  answer: C
  explanation: 幹線道路が隆起した分離帯、または幅5フィート以上の舗装されていない中央分離帯で区切られている場合、スクールバスと反対方向を走行する車両は停止する必要はありません。
- id: 320
  category: sharing_the_road
  question: 「ノーゾーン（No Zone）」とは何ですか？
  choices:
    A: 駐車が厳しく禁止されている区域。
    B: 追い越しが違法となる区域。
    C: 商用車やトラックの周囲にある大きな死角。
    D: 稼働時間中のスクールゾーン。
  answer: C
  explanation: 「ノーゾーン」とは、商用車やトラックの前後および側面にあり、運転手が他の車両を確認できない大きな死角のことを指します。
- id: 321
  category: safe_driving_rules
  question: 夜間、後方から他の車両に接近する際、何フィート以内でハイビームを減光しなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 400フィート
    D: 500フィート
  answer: B
  explanation: 後方から他の車両に接近する際、300フィート以内に入った場合は、ハイビームをロービームに減光しなければなりません。
- id: 322
  category: safe_driving_rules
  question: 日中、雨、霧、または煙の中で運転する場合、どのライトを使用すべきですか？
  choices:
    A: ハイビームヘッドライト
    B: ロービームヘッドライト
    C: パーキングライト（車幅灯）
    D: ハザードランプ
  answer: B
  explanation: 日中の雨、霧、または煙の中で運転する際は、まぶしさ（グレア）を引き起こすことなく視認性を高めるために、ロービームヘッドライトを使用しなければなりません。
- id: 323
  category: alcohol_drugs_health
  question: 飲酒・薬物影響下での運転（DUI）が疑われた際、血液検査、尿検査、または呼気検査を拒否した場合の罰則は何ですか？
  choices:
    A: 初回違反に対する警告
    B: 運転免許証の1年間の自動停止
    C: 500ドルの罰金と義務的な社会奉仕活動
    D: 30日間の即時車両押収
  answer: B
  explanation: フロリダ州の黙示の同意（Implied Consent）法に基づき、DUIが疑われた際に呼気、尿、または血液検査を拒否すると、運転免許証が自動的に1年間停止されます。
- id: 324
  category: license_system
  question: 仮免許（learner's license）を持っている場合、Eクラス運転免許（Class E driver license）を取得するには何時間の運転経験が必要ですか？
  choices:
    A: 30時間（うち夜間5時間）
    B: 40時間（うち夜間10時間）
    C: 50時間（うち夜間10時間）
    D: 60時間（うち夜間15時間）
  answer: C
  explanation: 仮免許を持つ運転者がEクラス運転免許を取得するには、50時間の運転経験（そのうち10時間は夜間）を完了しなければなりません。
- id: 325
  category: license_system
  question: 仮免許を申請する場合（またはこれまで運転免許証を持ったことがない場合）、どの教育コースを受講する必要がありますか？
  choices:
    A: 基本運転者改善コース（Basic Driver Improvement Course）
    B: 交通法および薬物乱用教育（TLSAE）
    C: 上級防衛運転コース（Advanced Defensive Driving Course）
    D: フロリダ州幹線道路安全コース（Florida Highway Safety Course）
  answer: B
  explanation: 仮免許を申請する前、またはこれまで運転免許証を持ったことがない場合は、交通法および薬物乱用教育（TLSAE）コースを修了しなければなりません。
- id: 326
  category: license_system
  question: MyDMVPortal.flhsmv.govでオンラインで完了できるサービスは次のうちどれですか？
  choices:
    A: 実技運転試験の受験
    B: 運転免許証の更新または再発行
    C: 裁判所での交通違反切符に対する異議申し立て
    D: 車両の排ガス検査
  answer: B
  explanation: フロリダ州幹線道路安全・自動車局（FLHSMV）によると、MyDMVPortal.flhsmv.govで運転免許証または身分証明書の更新や再発行をオンラインで行うことができます。
- id: 327
  category: vehicle_information
  question: 対象となる車両や船舶の登録を安全に更新し、取引証明を受け取ることができるモバイルアプリは何ですか？
  choices:
    A: FLHSMV Drive
    B: MyFlorida
    C: Florida DMV Mobile
    D: SunPass App
  answer: B
  explanation: FLHSMVの「MyFlorida」モバイルアプリを使用すると、対象となる車両や船舶の登録を安全に更新し、登録証が郵送で届くまでの間に使用できる取引証明を受け取ることができます。
- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（止まれ）」の標識は、停止線、横断歩道、または交差点に入る前に完全に停止しなければならないことを意味します。交通や歩行者を確認してから進んでください。
  id: 328
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通に合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」の標識は、減速して他の車両や歩行者に優先権（通行権）を譲らなければならないことを意味します。他の人や車が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 329
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「DO NOT ENTER（進入禁止）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車と衝突する危険がある場所に設置されています。
  id: 330
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見たら、どうするべきですか？
  choices:
    A: Uターンをする
    B: 注意して運転を続ける
    C: 停止して後退するか、方向転換する（逆走しているため）
    D: 速度を上げてそのエリアを早く抜け出す
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止/逆走）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 331
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）に流れている
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 332
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターン（転回）が禁止されていることを意味します。
  id: 333
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が禁止されていることを意味します。
  id: 334
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 335
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 白黒のペナント型（三角旗型）の「NO PASSING ZONE（追い越し禁止区間）」標識は、このエリアで他の車両を追い越すことが禁止されていることを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 336
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線が終了する
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 337
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色から判断して、これはどのような種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 338
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先、動物園やアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟エリアがある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 339
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーンがある
    B: この先、横断歩道がある
    C: 近くにハイキングコースがある
    D: この先、バス停がある
  answer: B
  explanation: 歩行者の図が描かれた黄色いひし形の標識は、この先に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 340
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは学校の横断歩道
    D: 病院の区域
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは学校の横断歩道を示しています。減速し、子供に注意してください。
  id: 341
- image: railroad_crossing.png
  category: signs_and_signals
  question: この円形の黄色い標識は何を警告していますか？
  choices:
    A: 前方にラウンドアバウト（環状交差点）
    B: 病院の区域
    C: 前方に踏切
    D: 追い越し禁止区間
  answer: C
  explanation: 黒いXと2つのRが描かれた円形の黄色い標識は、前方に踏切があることを示す事前警告標識です。減速し、列車の接近を目と耳で確認してください。
  id: 342
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の踏切標識（クロスバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 343
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: 前方の行き止まり
    B: 右折必須
    C: 前方に右カーブ
    D: 前方に迂回路
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、前方の道路にカーブがあることを警告しています。カーブに入る前に減速してください。
  id: 344
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大幅な減速を必要とする急な曲がり角を警告している
    C: 右折専用を意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急な曲がり角の標識（より角度のついた矢印）は、カーブの標識よりも急な曲がり角を示しています。この曲がり角の手前では、より大幅に減速する必要があります。
  id: 345
