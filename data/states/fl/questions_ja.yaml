- id: 57
  category: license_system
  question: 米国市民であり、これまでに社会保障番号（SSN）を発行されたことがない場合、次のうちどれを二次的な身分証明書（Secondary Identification）として使用できますか？
  choices:
    A: 病院発行の出生証明書
    B: 図書館のカード
    C: 婚姻証明書
    D: 公共料金の請求書
  answer: C
  explanation: 婚姻証明書は、社会保障番号を発行されたことがない人が使用できる有効な二次書類の一つとしてリストされています。
- id: 58
  category: license_system
  question: 18歳未満の未婚の未成年者の運転免許申請書には、誰が署名しなければなりませんか？
  choices:
    A: 運転者教育の指導員
    B: 親または法定後見人
    C: 公証人のみ
    D: 未成年者本人
  answer: B
  explanation: 18歳未満で未婚の場合、親または法定後見人が運転免許エージェントまたは公証人の前で免許申請書に署名する必要があります。
- id: 59
  category: driver_responsibility
  question: 親または後見人は、どのようにして同意を撤回し、未成年者の運転免許をキャンセルすることができますか？
  choices:
    A: 地元の警察署に電話する
    B: 未成年者から物理的な免許証を没収する
    C: FLHSMV（フロリダ州幹線道路安全・自動車局）に手紙を書くか、MyDMVPortalを使用する
    D: 未成年者が18歳になるまで待つ
  answer: C
  explanation: 免許をキャンセルするには、署名者がFLHSMVに同意の撤回を求める手紙を書く必要があります。また、署名者はMyDMVPortal.flhsmv.govにアクセスして免許をキャンセルすることもできます。
- id: 60
  category: alcohol_drugs_health
  question: インスリンを使用している糖尿病患者は、運転免許証にどのような任意の指定（表示）を記載するようリクエストできますか？
  choices:
    A: Medical Alert Bracelet（医療アラートブレスレット）
    B: Insulin Dependent（インスリン依存症）
    C: Diabetic Driver（糖尿病ドライバー）
    D: Code 3 Restriction（コード3制限）
  answer: B
  explanation: 糖尿病でインスリンを使用している場合、運転免許証に「Insulin Dependent（インスリン依存症）」と記載するようリクエストすることができます。
- id: 61
  category: penalties_and_points
  question: 運転免許証の制限コード（restriction code）に従わなかった場合、どのような結果を招く可能性がありますか？
  choices:
    A: 運転免許試験の再受験が義務付けられる
    B: 交通違反切符（citation）を切られ、免許が停止される可能性がある
    C: 車両が30日間押収される
    D: DMVから警告状が届く
