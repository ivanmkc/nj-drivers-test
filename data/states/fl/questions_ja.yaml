- id: 63
  category: license_system
  question: 障害者用駐車許可証を申請しない場合、標準のフロリダ州身分証明書（IDカード）を取得できる最低年齢は何歳ですか？
  choices:
    A: 5歳
    B: 12歳
    C: 15歳
    D: 16歳
  answer: A
  explanation: IDカードを取得するには、5歳以上である必要があります（年齢制限のない障害者用駐車許可証を申請する場合を除く）。
- id: 64
  category: license_system
  question: 10歳の人が取得するフロリダ州身分証明書（IDカード）の有効期間はどのくらいですか？
  choices:
    A: 2年
    B: 4年
    C: 6年
    D: 8年
  answer: B
  explanation: 5歳から14歳の人に発行されるIDカードの有効期間は4年間です。それ以外の人の有効期間は8年間となります。
- id: 65
  category: license_system
  question: フロリダ州の運転免許証とフロリダ州身分証明書（IDカード）を同時に所持することはできますか？
  choices:
    A: はい、二重発行手数料を支払えば可能です
