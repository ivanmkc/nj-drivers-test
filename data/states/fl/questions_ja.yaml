    B: 運転技能試験を再受験しなければならない。
    C: 1年間、自動的に「業務目的のみ（Business Purposes ONLY）」の運転に制限される。
    D: 500ドルの罰金を支払い、交通学校に通わなければならない。
  answer: C
  explanation: 18歳未満の運転者が12ヶ月以内に6点以上の違反点数を累積した場合、1年間自動的に「業務目的のみ（Business Purposes
    ONLY）」の運転に制限されます。
- id: 35
  category: driver_responsibility
  question: 運転中、常に車内に携帯しなければならない書類は次のうちどれですか？
  choices:
    A: 運転免許証、車両登録証、および保険証明書
    B: 運転免許証、出生証明書、およびソーシャルセキュリティーカード
    C: 保険証明書、車両権利書（タイトル）、および運転免許証
    D: 車両登録証、パスポート、および運転免許証
  answer: A
  explanation: 運転する際は常に運転免許証を携帯し、運転している車内には常に車両登録証と保険証明書を保管しておかなければなりません。
- id: 36
  category: license_system
  question: 非居住者がフロリダ州で就労する場合、何日以内にフロリダ州の運転免許証を取得しなければなりませんか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: C
  explanation: 非居住者がフロリダ州で就労、または商業、専門職、職業に従事する場合、自動車を運転するためには30日以内にフロリダ州の運転免許証を取得しなければなりません。
- id: 37
  category: license_system
  question: フロリダ州の運転免許証の取得が免除されないのは、次のうち誰ですか？
  choices:
    A: フロリダ州の大学に通う非居住者。
    B: フロリダ州に駐留する軍の構成員。
    C: 子供をフロリダ州の公立学校に入学させる非居住者。
    D: 公務で非商用の米国政府車両を運転する米国政府職員。
  answer: C
  explanation: 子供をフロリダ州の公立学校に入学させる非居住者は、30日以内にフロリダ州の運転免許証を取得しなければなりません。大学生、軍の構成員、および公務中の米国政府職員は免除されます。
- id: 38
  category: driver_testing
  question: ドイツの有効な運転免許証を所持している場合、フロリダ州の運転免許試験のうち免除（相互承認）されるのはどれですか？
  choices:
    A: 筆記試験（知識試験）と運転技能試験の両方
    B: 運転技能試験のみ
    C: 筆記試験（知識試験）のみ
    D: 視力試験
  answer: B
  explanation: マニュアルには、ドイツの有効な運転免許証を持つ個人の場合、運転技能試験のみが相互承認（免除）されると明記されています。
- id: 39
  category: driver_testing
  question: 相互承認により筆記試験（知識試験）と運転技能試験が免除される場合でも、すべての申請者に引き続き義務付けられている試験はどれですか？
  choices:
    A: 聴力試験
    B: 筆記試験（知識試験）
    C: 視力試験
    D: 道路標識試験
  answer: C
