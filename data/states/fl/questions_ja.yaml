  explanation: 他の人と同居している人は、居住地を証明するために、その人からの手紙と書類2点を提示する必要があります。
- id: 56
  category: license_system
  question: 最近名前を変更した場合、運転免許証または身分証明書（IDカード）を申請する前に何をしなければなりませんか？
  choices:
