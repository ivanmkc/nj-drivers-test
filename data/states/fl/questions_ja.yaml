  explanation: 免許証に制限があり、その要件に従わない場合、交通違反切符を切られ、免許が停止される可能性があります。
- id: 62
  category: license_system
  question: フロリダ州の運転免許証における制限コードGは何を示していますか？
  choices:
    A: 視力矯正レンズ
    B: 業務目的のみ
    C: 昼間の運転のみ
    D: 雇用目的のみ
  answer: C
