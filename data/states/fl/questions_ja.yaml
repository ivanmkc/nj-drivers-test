- id: 43
  category: license_system
  question: フロリダ州の運転免許証または身分証明書（IDカード）を申請する際、フロリダ州の居住地住所を示す書類をいくつ提示する必要がありますか？
  choices:
    A: 1つ
    B: 2つ
    C: 3つ
    D: 4つ
  answer: B
  explanation: フロリダ州の運転免許証または身分証明書（IDカード）のすべての申請者は、フロリダ州の居住地住所を示す書類を2つ提示する必要があります。
- id: 44
  category: license_system
  question: 主要な身分証明書が発行されてから名前が変わった場合、フロリダ州の運転免許証を申請する際に何を提示する必要がありますか？
  choices:
    A: 名前変更を説明する公証済みの手紙
    B: 新しいソーシャルセキュリティカード（社会保障カード）のコピー
    C: 婚姻証明書や裁判所命令などの名前変更を証明する書類
    D: 居住地住所の追加証明書2つ
  answer: C
  explanation: 主要な身分証明書が発行されてから名前が変わった場合、婚姻証明書、離婚判決書、裁判所命令などの名前変更を証明する書類を提示する必要があります。
- id: 45
  category: license_system
  question: フロリダ州でクラスEの仮免許証（Learner's License）を取得するための最低年齢要件は何歳ですか？
