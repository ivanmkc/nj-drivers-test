questions:
- id: 1
  category: penalties_and_points
  question: フロリダ州の運転免許証または身分証明書（IDカード）の申請において、偽名を使用したり重要な事実を隠蔽したりした場合の最高刑罰は何ですか？
  choices:
    A: 懲役1年および罰金1,000ドル
    B: 最大5年の懲役、罰金5,000ドル、および最低1年間の運転特権の停止
    C: 禁錮60日および罰金500ドル
    D: 運転特権の永久取消しおよび罰金10,000ドル
  answer: B
  explanation: マニュアルによると、運転免許証または身分証明書（IDカード）の申請で詐欺行為を行うと、最大5年の懲役、5,000ドルの罰金、および既存の運転特権の最低1年間の停止が科される可能性があります。
- id: 2
  category: penalties_and_points
  question: 無免許の人物に自動車の運転を許可または承認した場合の罰則は何ですか？
  choices:
    A: 禁錮30日および罰金200ドル
    B: 禁錮60日および罰金500ドル
    C: 禁錮90日および罰金1,000ドル
    D: 禁錮1年および罰金5,000ドル
  answer: B
  explanation: マニュアルには、無免許の人物に自動車の運転を許可または承認することは違法であり、これを行うと禁錮60日および500ドルの罰金が科される可能性があると記載されています。
- id: 3
  category: penalties_and_points
  question: 無免許の人物に自分の車両の運転を許可し、その人物が人身傷害または死亡を伴う衝突事故を起こした場合、あなたの運転特権はどうなる可能性がありますか？
  choices:
    A: 免許が1年間停止される可能性がある。
    B: 車両が永久に没収される。
    C: 義務的な5年の懲役刑に直面する。
    D: 運転技能試験を再受験しなければならない。
  answer: A
  explanation: 車両が人身傷害または死亡を伴う衝突事故に関与した場合、無免許の人物に運転を許可した人は、免許が1年間停止される可能性があります。
- id: 4
  category: license_system
  question: フロリダ州の公記録法（Public Records Law）によると、免許取得プロセスで収集される以下の情報のうち、一般公開は免除されるものの、法執行機関には提供される可能性があるものはどれですか？
  choices:
    A: 社会保障番号
    B: 医療情報
    C: 運転免許証番号
    D: 緊急連絡先情報
  answer: C
  explanation: マニュアルには、氏名、住所、運転免許証番号などの個人情報は一般公開が免除されるものの、法執行機関には提供される可能性があると明記されています。
- id: 5
  category: license_system
  question: 18歳未満の運転者は、無断欠席（truancy）に関連する運転免許の停止をどのように防ぐことができますか？
  choices:
    A: 100ドルの罰金を支払うことによって
    B: 個別教育計画（IEP）の証明書を提出することによって
    C: 防衛運転講習を修了することによって
    D: 救済免許（hardship license）を取得することによって
  answer: B
  explanation: 下院法案0001（HB 0001）に基づき、18歳未満の運転者は、無断欠席に関連する運転免許の停止を防ぐため、従来の学校出席の代替として個別教育計画（IEP）の証明書を提出することができます。
- id: 6
  category: safe_driving_rules
  question: 拡大されたムーブオーバー法（Move Over Law：車線変更義務法、HB 425）では、運転者は以下のどれに対して車線を変更（または減速）することが義務付けられていますか？
  choices:
    A: 住宅の私道に駐車しているすべての車両
    B: 停止しており、警告灯またはハザードランプを点灯している故障車両
    C: 走行中の配達トラック
    D: 停止標識を格納したスクールバス
  answer: B
  explanation: HB 425により、ムーブオーバー法が拡大され、停止して警告灯またはハザードランプを点灯している故障車両に対しても車線を変更することが含まれるようになりました。
- id: 7
  category: penalties_and_points
  question: カメラ搭載のレーダー検知装置によって取り締まられているスクールゾーンの制限速度に違反したことが判明した場合、自動車の登録所有者に科される罰金はいくらですか？
  choices:
    A: 50ドル
    B: 100ドル
    C: 200ドル
    D: 500ドル
  answer: B
  explanation: HB 657によると、カメラ搭載レーダーによって取り締まられているスクールゾーンの制限速度に違反したことが判明した自動車の登録所有者には、100ドルの罰金が科されます。
- id: 8
  category: penalties_and_points
  question: 違反検知システムによって捉えられた、停止信号を表示しているスクールバスを追い越した場合の民事罰はいくらですか？
  choices:
    A: 100ドル
    B: 200ドル
    C: 300ドル
    D: 500ドル
  answer: B
  explanation: 上院法案766（SB 766）には、停止信号を表示しているスクールバスを追い越す違反が判明した自動車の登録所有者には、200ドルの民事罰が科されると記載されています。
- id: 9
  category: signs_and_signals
  question: 違法に追い越す運転者を捉えるための違反検知システムを搭載したスクールバスには、以下のどのフレーズが表示されますか？
  choices:
    A: SPEED CHECKED BY RADAR（レーダーによる速度取締り中）
    B: CAMERA ENFORCED（カメラによる取締り中）
    C: YIELD TO BUS（バスに道を譲れ）
    D: DO NOT TAILGATE（車間距離を詰めないこと）
  answer: B
  explanation: 違反検知システムを搭載したバスには、「CAMERA ENFORCED」という文字とともに、カメラの図記号や赤色点滅灯に関する警告が表示されます。
- id: 10
  category: license_system
  question: HB 1087に基づき、義務者（支払義務のある者）が誠実に以下に参加している場合、開始日を延期した支払い合意を結ぶことで運転免許の停止を回避できる可能性があります。それは次のうちどれですか？
  choices:
    A: 職業訓練
    B: 薬物乱用プログラム
    C: 交通学校
    D: 社会奉仕活動
  answer: A
  explanation: HB 1087は、義務者が免許停止を回避するために開始日を延期した支払い合意を結ぶことができる理由を拡大し、義務者が誠実に職業訓練に参加している場合を含めました。
- id: 11
  category: license_system
  question: 2023年10月1日以降、18歳未満の人が公道や市街地でゴルフカートを合法的に運転するためには、何を所持していなければなりませんか？
  choices:
    A: 有効な学生証
    B: 有効な仮免許証または有効な運転免許証
    C: 自転車安全証明書
    D: 親の書面による同意書
  answer: B
  explanation: 下院法案949（HB 949）により、公道でゴルフカートを運転する18歳未満の人は、有効な仮免許証または有効な運転免許証を所持することが義務付けられています。
- id: 12
  category: penalties_and_points
  question: 米国に不法入国し、連邦政府の審査を受けていない個人を、故意かつ意図的にフロリダ州内に輸送することは、次のように分類されます：
  choices:
    A: 第1級軽犯罪
    B: 第2級軽犯罪
    C: 第3級重罪
    D: 民事交通違反
  answer: C
  explanation: 上院法案1718（SB 1718）は密入国斡旋犯罪を改正し、そのような個人を故意かつ意図的に州内に輸送した場合、第3級重罪を犯したことになると規定しています。
- id: 13
  category: penalties_and_points
  question: フロリダ州への密入国斡旋の罪は、輸送する対象が次の場合、第2級重罪に加重されます：
  choices:
    A: 未成年者を州内に輸送した場合
    B: 2人を超える大人を1台の車両で輸送した場合
    C: 郡の境界を越えて誰かを輸送した場合
    D: 夜間に誰かを輸送した場合
  answer: A
  explanation: 上院法案1718（SB 1718）により、本条項に違反して未成年者を州内に輸送した場合、その犯罪は第2級重罪に加重されます。
- id: 14
  category: driver_responsibility
  question: ハンドブックの免責事項によると、フロリダ州公式運転免許ハンドブックは次のように位置付けられています：
  choices:
    A: 法的拘束力を持ち、法廷での使用を目的とした文書
    B: 法的権威ではなく、法廷での使用を目的としていない
    C: すべての法改正を反映するために毎日更新される
    D: フロリダ州交通法の完全かつ省略のないコピー
  answer: B
  explanation: 免責事項には、「このハンドブックは法的権威ではなく、法廷での使用を目的としたものではありません」と明記されています。
- id: 15
  category: license_system
  question: フロリダ州の運転マニュアルによると、運転免許証または身分証明書（IDカード）の「任意の指定（Optional Designation）」と見なされるのは次のうちどれですか？
  choices:
    A: 常習的犯罪者 (Career Offender)
    B: 選抜徴兵登録 (Selective Service)
    C: 退役軍人の指定 (Veteran Designation)
    D: 性的捕食者 (Sexual Predator)
  answer: C
  explanation: マニュアルでは、「フロリダ州臓器・組織ドナー」および「退役軍人の指定」が任意の指定として記載されていますが、常習的犯罪者や選抜徴兵登録は必須の指定（Required
    Designations）として記載されています。
- id: 16
  category: license_system
  question: フロリダ州の身分証明書（ID）または運転免許証の「必須の指定（Required Designation）」として記載されているのは次のうちどれですか？
  choices:
    A: 任意の寄付 (Voluntary Contributions)
    B: 選抜徴兵登録 (Selective Service)
    C: 退役軍人の指定 (Veteran Designation)
    D: フロリダ州臓器・組織ドナー (Florida Organ & Tissue Donor)
  answer: B
  explanation: マニュアルによると、選抜徴兵登録、常習的犯罪者、および性犯罪者・性的捕食者は必須の指定として分類されています。
- id: 17
  category: driver_testing
  question: フロリダ州の運転講習の文脈において、「BDI」という略語は何の略ですか？
  choices:
    A: Basic Driver Improvement（基本運転改善）
    B: Beginner Driver Instruction（初心者運転指導）
    C: Basic Driving Information（基本運転情報）
    D: Behind-the-wheel Driver Inspection（実車運転検査）
  answer: A
  explanation: マニュアルの「自動車学校および試験提供者」のセクションに、「Basic Driver Improvement (BDI) Course（基本運転改善講習）」が記載されています。
- id: 18
  category: driver_testing
  question: 「ADI」という略語で指定される運転講習はどの種類ですか？
  choices:
    A: Automatic Driver Instruction（自動運転指導）
    B: Advanced Driver Improvement（上級運転改善）
    C: Additional Driving Information（追加運転情報）
    D: Approved Driver Inspection（承認済み運転検査）
  answer: B
  explanation: マニュアルには、「Advanced Driver Improvement (ADI) Courses（上級運転改善講習）」に関する特定のセクションが含まれています。
- id: 19
  category: driver_responsibility
  question: 運転マニュアルのフロリダ州保険法の項目に具体的に記載されている2つの法律はどれですか？
  choices:
    A: 衝突法と賠償責任法
    B: 無過失法（No-Fault Law）と自動車損害賠償保障法（Financial Responsibility Law）
    C: ムーブオーバー法（車線変更義務法）とスピード違反法
    D: 総合法と無保険運転者法
  answer: B
  explanation: マニュアルでは、「無過失法（No-Fault Law）」と「自動車損害賠償保障法（Financial Responsibility Law）」を保険法のセクションに直接分類しています。
- id: 20
  category: driver_responsibility
  question: マニュアルによると、未成年の運転者にはどのような特定の制限が課せられていますか？
  choices:
    A: 同乗者数の制限のみ
    B: 運転の門限（夜間運転制限）
    C: 昼間の運転のみ
    D: 高速道路の運転禁止
  answer: B
  explanation: マニュアルの「運転の特権（Your Driving Privilege）」の章には、「未成年者の制限（運転の門限）」が明記されています。
- id: 21
  category: penalties_and_points
  question: フロリダ州で運転する特権（運転免許）を失う理由となるのは、次のうちどれですか？
  choices:
    A: 免許停止 (Suspensions)
    B: 免許取消し (Revocations)
    C: 免許無効 (Cancellations)
    D: 上記のすべて
  answer: D
  explanation: マニュアルでは、「運転する特権の喪失（Losing the Privilege to Drive）」の3つのサブカテゴリーとして、免許停止（Suspensions）、免許取消し（Revocations）、免許無効（Cancellations）が挙げられています。
- id: 22
  category: vehicle_information
  question: 車両の装備基準に関して、「ADAS」は何の略ですか？
  choices:
    A: Automatic Driving and Steering（自動運転およびステアリング）
    B: Advanced Driver Assistance Systems（先進運転支援システム）
    C: Anti-lock Driver Alert System（アンチロック・ドライバー警告システム）
    D: Automated Distance and Speed（自動車間距離および速度）
  answer: B
  explanation: マニュアルの装備基準の項目には、「先進運転支援システム（ADAS）」に関するセクションが含まれています。
- id: 23
  category: alcohol_drugs_health
  question: フロリダ州の運転マニュアルにおいて、「DUI」という頭字語は何の略ですか？
  choices:
    A: Driving Under Intoxication
    B: Driving Under the Influence（飲酒・薬物影響下での運転）
    C: Driving Using Intoxicants
    D: Driver Under Investigation
  answer: B
  explanation: マニュアルでは、交通違反や認可プログラムに関するセクションで「飲酒・薬物影響下での運転（DUI）」について言及しています。
- id: 24
  category: license_system
  question: フロリダ州の運転マニュアルには、次のどのグループに対する特定のIDカード要件のセクションが含まれていますか？
  choices:
    A: 大学生および州外居住者
    B: ホームレスの人々および貧困層以下の人々
    C: 政府職員および軍関係者
    D: 独立した未成年者および里子
  answer: B
  explanation: マニュアルのIDカード要件のセクションには、「ホームレスの人々のためのIDカード」および「貧困層以下の人々のためのIDカード」が記載されています。
- id: 25
  category: license_system
  question: 免許更新のセクションにおいて、マニュアルには何歳以上の高齢ドライバー向けの特定情報が含まれていますか？
  choices:
    A: 65歳以上
    B: 70歳以上
    C: 75歳以上
    D: 80歳以上
  answer: D
  explanation: マニュアルの免許更新の項目には、「80歳以上のドライバー」という特定のセクションが含まれています。
- id: 26
  category: safe_driving_rules
  question: マニュアルの「安全運転（Driving Safety）」の章に明確に記載されている法律は、次のうちどれですか？
  choices:
    A: 右側通行法 (The Keep Right Law)
    B: ムーブ・オーバー法 (The Move Over Law：車線変更義務法)
    C: ハンズフリー法 (The Hands-Free Law)
    D: ヘッドライト法 (The Headlight Law)
  answer: B
  explanation: 「第7章：安全運転」のセクションとして、「ムーブ・オーバー法（The Move Over Law）」が明記されています。
- id: 27
  category: signs_and_signals
  question: フロリダ州の運転マニュアルにおいて、「特殊な標識および信号（Specialized Sign and Signal）」に分類されているものは、次のうちどれですか？
  choices:
    A: 一時停止標識
    B: ゆずりあい標識
    C: 跳ね橋の標識および信号
    D: 州間高速道路の路線標識
  answer: C
  explanation: マニュアルでは、「特殊な標識および信号」の項目に、工事、歩行者、踏切、スクールゾーンの標識とともに、跳ね橋の標識および信号が記載されています。
- id: 28
  category: defensive_driving
  question: 「緊急時の対応（Handling Emergencies）」の章によると、記載されている応急処置の手順は次のうちどれですか？
  choices:
    A: 心肺蘇生法 (CPR)
    B: ショック状態の処置
    C: 止血帯の適用
    D: 骨折の副子固定
  answer: B
  explanation: 「第9章：緊急時の対応」の応急処置のセクションには、「ショック状態の処置（Treat For Shock）」が明確に記載されています。
- id: 29
  category: sharing_the_road
  question: 「道路の共有（Sharing the Road）」の章において、専用のセクションが設けられている車両タイプは次のうちどれですか？
  choices:
    A: オートバイ
    B: モペッド（原動機付自転車）
    C: ゴルフカート
    D: ATV（四輪バギー）
  answer: C
  explanation: 「道路の共有」の章には、自転車、商用自動車、緊急車両、葬列、ゴルフカート、および低速車両のセクションが明記されています。
- id: 30
  category: license_system
  question: 仮免許（Learner's License）を取得したドライバーが、運転開始から最初の3ヶ月間に受ける運転時間の制限は何ですか？
  choices:
    A: 午前6時から午後11時まで運転できる。
    B: 日中（明るい時間帯）のみ運転できる。
    C: 午前5時から午前1時まで運転できる。
    D: 免許を持ったドライバーが同乗していれば、いつでも運転できる。
  answer: B
  explanation: マニュアルによると、仮免許を持つドライバーは、最初の3ヶ月間は日中（明るい時間帯）のみ運転しなければなりません。
- id: 31
  category: license_system
  question: 仮免許（Learner's License）の所持者が運転免許を取得する前に完了しなければならない運転練習は何時間ですか？
  choices:
    A: 30時間（うち夜間5時間を含む）
    B: 40時間（うち夜間10時間を含む）
    C: 50時間（うち夜間10時間を含む）
    D: 60時間（うち夜間15時間を含む）
  answer: C
  explanation: マニュアルには、仮免許の所持者が運転免許を取得する前に少なくとも50時間の運転経験が必要であり、そのうち10時間は夜間でなければならないと記載されています。
- id: 32
  category: license_system
  question: 運転免許を持つ16歳の運転者が、同乗者なしで通勤・退勤以外の目的で運転する場合の運転時間制限はどれですか？
  choices:
    A: 午前5時から午前1時まで
    B: 午前6時から午後11時まで
    C: 日中のみ
    D: 午前6時から午後10時まで
  answer: B
  explanation: 運転免許を持つ16歳の運転者は、通勤・退勤のため、または21歳以上の免許所持者が同乗している場合を除き、午前6時から午後11時まで運転することができます。
- id: 33
  category: license_system
  question: 運転免許を持つ17歳の運転者が、同乗者なしで通勤・退勤以外の目的で運転できる時間帯はどれですか？
  choices:
    A: 午前6時から午後11時まで
    B: 午前5時から午前1時まで
    C: 午前6時から深夜0時まで
    D: 日中のみ
  answer: B
  explanation: 運転免許を持つ17歳の運転者は、通勤・退勤のため、または21歳以上の免許所持者が同乗している場合を除き、午前5時から午前1時まで運転することができます。
- id: 34
  category: penalties_and_points
  question: 18歳未満の運転者が12ヶ月以内に6点以上の違反点数を累積した場合、どのような罰則が適用されますか？
  choices:
