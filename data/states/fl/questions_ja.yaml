    D: 大学の学位を持っている申請者
  answer: B
  explanation: 認定されたDELAP校で運転者教育課程に合格した申請者は、TLSAEの要件が免除されます。
- id: 53
  category: license_system
  question: 18歳未満の場合、仮免許を保持している12ヶ月間の走行中の交通違反（moving traffic violations）に関する規則は何ですか？
  choices:
    A: 走行中の違反は最大3回まで許容されます。
    B: 走行中の交通違反による有罪判決が「ゼロ」でなければなりませんが、判決保留（adjudication withheld）の場合は1回のみ許容されます。
    C: 事故を起こさなければ、走行中の違反は2回まで許容されます。
    D: 走行中の違反は運転免許証の取得に影響しません。
  answer: B
