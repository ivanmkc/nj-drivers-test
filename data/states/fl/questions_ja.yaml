- id: 50
  category: license_system
  question: フロリダ州の運転免許証を申請する移民、カナダ市民、およびその他の非移民には、写真なしの一時運転許可証が何日間発行される場合がありますか？
  choices:
    A: 30日間
    B: 45日間
    C: 60日間
    D: 90日間
  answer: C
  explanation: フロリダ州の運転免許証を申請する移民、カナダ市民、およびその他の非移民には、写真なしの60日間有効な一時運転許可証が発行される場合があります。
- id: 51
  category: license_system
  question: フロリダ州の運転免許要件において、TLSAEは何の略ですか？
  choices:
    A: Traffic Law and Substance Abuse Education（交通法規および薬物乱用教育）
    B: Teen Learner and Safe Automobile Education（10代の学習者および安全自動車教育）
    C: Traffic Licensing and Safety Awareness Exam（交通免許および安全意識試験）
    D: Transportation Law and Safety Administration Evaluation（交通法規および安全局評価）
  answer: A
  explanation: TLSAEは「Traffic Law and Substance Abuse Education Course（交通法規および薬物乱用教育講習）」の略であり、仮免許または運転免許証の取得に必要です。
- id: 52
  category: license_system
  question: 仮免許または運転免許証を申請する際、TLSAEの要件が免除されるのは誰ですか？
  choices:
