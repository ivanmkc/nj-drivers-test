questions:
- id: 1
  category: license_system
  question: ¿En qué año se estableció la Oficina de Vehículos Motorizados de Maine
    (BMV) por preocupación por la seguridad pública?
  choices:
    A: '1905'
    B: '1920'
    C: '1895'
    D: '1950'
  answer: A
  explanation: Según la introducción, la Oficina de Vehículos Motorizados de Maine
    se estableció en 1905 por preocupación por la seguridad pública al comenzar la
    era del automóvil.
- id: 2
  category: license_system
  question: ¿Cuál de las siguientes opciones se enumera como parte de la misión de
    la Oficina de Vehículos Motorizados de Maine?
  choices:
    A: Construir nuevas autopistas estatales
    B: Mantener registros del historial del conductor y el registro de vehículos
    C: Establecer los límites de velocidad estatales
    D: Fabricar vehículos motorizados
  answer: B
  explanation: El manual establece que la misión de la BMV incluye calificar y otorgar
    licencias a los conductores, además de mantener registros del historial del conductor,
    la propiedad del vehículo y el registro del vehículo.
- id: 3
  category: driver_responsibility
  question: Según la introducción del manual, ¿qué aporta una licencia de conducir
    además de nueva libertad e independencia?
  choices:
    A: Una responsabilidad solemne
    B: Propiedad garantizada del vehículo
    C: Inmunidad frente a leyes de tránsito menores
    D: Registro de vehículo gratuito
  answer: A
  explanation: 'La introducción establece explícitamente: ''Una licencia de conducir
    aporta nueva libertad e independencia, y también una responsabilidad solemne''.'
- id: 4
  category: safe_driving_rules
  question: ¿Qué describe el manual como un 'compromiso de por vida' que debe reafirmar
    cada vez que se pone al volante?
  choices:
    A: Mantenimiento del vehículo
    B: Conducción segura
    C: Pagar peajes
    D: Renovar su licencia
  answer: B
  explanation: La introducción recuerda a los conductores que 'La conducción segura
    es un compromiso de por vida que debe reafirmar cada vez que se pone al volante'.
- id: 5
  category: alcohol_drugs_health
  question: Según la introducción, ¿cuál de los siguientes comportamientos pone en
    riesgo la vida?
  choices:
    A: Conducir con pasajeros en el vehículo
    B: Conducir de noche o con mal tiempo
    C: Estar bajo los efectos de las drogas o el alcohol, o enviar mensajes de texto
    D: Escuchar la radio mientras conduce
  answer: C
  explanation: 'El manual advierte: ''Si está bajo los efectos de las drogas o el
    alcohol, o si está enviando mensajes de texto o prestando atención a cualquier
    otra cosa que no sea su conducción, está poniendo vidas en riesgo''.'
- id: 6
  category: defensive_driving
  question: Para evitar una colisión, el manual establece que siempre debe estar preparado
    para la posibilidad de que necesite hacer ¿qué?
  choices:
    A: Detenerse, dar un volantazo, acelerar o reducir la velocidad
    B: Cerrar los ojos y prepararse para el impacto
    C: Tocar la bocina y mantener su velocidad actual
    D: Salir del vehículo inmediatamente
  answer: A
  explanation: 'La introducción establece: ''Siempre debe estar preparado para la
    posibilidad de que necesite detenerse, dar un volantazo, acelerar o reducir la
    velocidad para evitar una colisión''.'
- id: 7
  category: sharing_the_road
  question: 'Según el índice del manual, ¿cuál de los siguientes temas se trata en
    la Sección 10: ''Compartir la carretera''?'
  choices:
    A: Estacionamiento en paralelo
    B: Bicicletas
    C: Hidroplaneo
    D: Bolsas de aire
  answer: B
  explanation: El índice enumera 'Bicicletas' como una subsección de la Sección 10
    - Compartir la carretera.
- id: 8
  category: vehicle_information
  question: ¿Cuál de los siguientes se clasifica como un 'Problema del vehículo' en
    la Sección 9 del manual?
  choices:
    A: Conducción agresiva
    B: Ruido excesivo del sistema de sonido
    C: Pedal del acelerador atascado
    D: Fatiga
  answer: C
  explanation: Según el índice de la Sección 9 (Evitar choques), 'Pedal del acelerador
    atascado' aparece en la subsección 'Problemas del vehículo'.
- id: 9
  category: defensive_driving
  question: Según el índice, ¿cuál de los siguientes se considera un 'Desafío especial
    de conducción' (Sección 11)?
  choices:
    A: Seguridad con la vida silvestre
    B: Arrancar el motor
    C: Uso de cinturones de seguridad
    D: Señales de tráfico
  answer: A
  explanation: El índice enumera 'Seguridad con la vida silvestre' como un tema de
    la Sección 11 - Desafíos especiales de conducción.
- id: 10
  category: safe_driving_rules
  question: En la sección 'Control de la velocidad' del índice, ¿qué condición específica
    de la carretera se aborda?
  choices:
    A: Baches
    B: Hidroplaneo
    C: Caminos de tierra
    D: Hielo negro
  answer: B
  explanation: El índice enumera el 'Hidroplaneo' como un tema específico bajo 'Control
    de la velocidad' en la Sección 8.
- id: 11
  category: license_system
  question: '¿Cuál de los siguientes es un tema cubierto en la Sección 2: "Leyes y
    normas estatales"?'
  choices:
    A: Asegurar su vehículo motorizado
    B: Cambiar de carril
    C: Conducir en autopistas
    D: Primeros auxilios de emergencia
  answer: A
  explanation: Según el índice, "Asegurar su vehículo motorizado" es una subsección
    de la Sección 2 - Leyes y normas estatales.
- id: 12
  category: driver_responsibility
  question: 'Según el índice, ¿cuál de los siguientes es un factor analizado en la
    Sección 3: "Listo para conducir"?'
  choices:
    A: Señales de número de ruta
    B: Marcas en el pavimento
    C: Visión y audición
    D: Ceder el paso
  answer: C
  explanation: El índice enumera "Visión y audición" como el primer tema de la Sección
    3 - Listo para conducir.
- id: 13
  category: signs_and_signals
  question: ¿En qué sección del manual encontraría información sobre "Señales de zona
    de obras"?
  choices:
    A: Sección 6 - Reglas de la carretera
    B: Sección 5 - Primeros pasos
    C: Sección 9 - Cómo evitar choques
    D: Sección 8 - Manejo del tiempo y el espacio
  answer: A
  explanation: El índice muestra que "Señales de zona de obras" es una subsección
    de "Señales de tráfico" en la Sección 6 - Reglas de la carretera.
- id: 14
  category: driver_testing
  question: ¿Qué información se proporciona en el Apéndice A del manual del conductor?
  choices:
    A: Una lista de todas las multas de tráfico de Maine
    B: Razones típicas para el rechazo del examen de conducir
    C: Instrucciones para cambiar una llanta
    D: La historia del BMV de Maine
  answer: B
  explanation: El índice indica que el Apéndice A incluye "Razones típicas para el
    rechazo del examen de conducir", junto con información e instrucciones sobre el
    examen de conducir.
- id: 15
  category: safe_driving_rules
  question: '¿Qué tipo de estacionamiento figura específicamente como tema en la Sección
    7: "Conducción general"?'
  choices:
    A: Estacionamiento con valet
    B: Estacionamiento en garaje
    C: Estacionamiento en paralelo o desplazado
    D: Estacionamiento en la entrada de la casa
  answer: C
  explanation: El índice enumera el "Estacionamiento en paralelo o desplazado" como
    una subsección específica dentro de "Estacionamiento" en la Sección 7 - Conducción
    general.
- id: 16
  category: license_system
  question: ¿Cuántos días tiene un nuevo residente para solicitar una licencia de
    conducir de Maine después de establecer su residencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes que posean una licencia de conducir válida de
    otro estado deben entregar esa licencia y solicitar una licencia de conducir de
    Maine dentro de los 30 días posteriores al establecimiento de la residencia.
- id: 17
  category: driver_testing
  question: ¿Cuáles son los requisitos para el conductor con licencia que debe acompañar
    al titular de un permiso de aprendizaje?
  choices:
    A: Al menos 18 años de edad con 1 año de experiencia de conducción
    B: Al menos 21 años de edad con 3 años de experiencia de conducción
    C: Al menos 20 años de edad y haber tenido una licencia válida por un mínimo de
      2 años
    D: Un padre o tutor legal mayor de 25 años
  answer: C
  explanation: Un permiso de aprendizaje permite a una persona operar un vehículo
    cuando está acompañada por un conductor con licencia que tiene al menos 20 años
    de edad y ha tenido una licencia válida durante 2 años.
- id: 18
  category: license_system
  question: ¿Cuál de la edad mínima requerida para obtener un permiso de aprendizaje
    en Maine?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 15 años y medio de edad
    D: 16 años de edad
  answer: B
  explanation: Para obtener un permiso en Maine, debe tener al menos 15 años de edad.
- id: 19
  category: license_system
  question: ¿Por cuánto tiempo es válido generalmente un permiso de aprendizaje de
    Maine?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Según el manual, un permiso de aprendizaje es generalmente válido por
    2 años.
- id: 20
  category: license_system
  question: Al presentar un certificado de nacimiento para una solicitud de licencia,
    ¿cuál de las siguientes afirmaciones es cierta con respecto a las fotocopias?
  choices:
    A: Se recomiendan encarecidamente las copias notarizadas
    B: Las fotocopias deben tener un sello en relieve o un sello de una agencia emisora
    C: Cualquier fotocopia clara en blanco y negro es aceptable
    D: Las fotocopias están estrictamente prohibidas en cualquier circunstancia
  answer: B
  explanation: Las fotocopias de los certificados de nacimiento deben tener un sello
    en relieve o un sello de una agencia emisora. No se aceptan copias notarizadas.
- id: 21
  category: license_system
  question: ¿Qué clasificación de licencia es la licencia estándar emitida a la mayoría
    de los operadores de vehículos motorizados en Maine?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: C
  explanation: La Clase C es la clasificación de licencia estándar emitida a la mayoría
    de los operadores de vehículos motorizados, y cubre cualquier vehículo individual
    o combinación de vehículos que no cumpla con la definición de Clase A o B.
- id: 22
  category: license_system
  question: ¿Cuál de los siguientes factores hace que una persona no sea elegible
    para recibir una licencia de operador de autobús escolar?
  choices:
    A: Tener 22 años de edad
    B: Tener solo dos años de experiencia de conducción con licencia
    C: Una condena por una infracción de O.U.I. (conducir bajo la influencia) dentro
      del período de diez años anterior
    D: Poseer una licencia de conducir comercial Clase C
  answer: C
  explanation: Cualquier persona condenada por una infracción de O.U.I. (conducir
    bajo la influencia) dentro del período de diez años anterior no es elegible para
    recibir una licencia de operador de autobús escolar.
- id: 23
  category: driver_testing
  question: Antes de que una persona menor de 21 años pueda solicitar un examen de
    conducción, ¿cuántas horas de práctica de conducción debe completar?
  choices:
    A: 40 horas, incluyendo 5 horas de conducción nocturna
    B: 50 horas, incluyendo 10 horas de conducción nocturna
    C: 70 horas, incluyendo 10 horas de conducción nocturna
    D: 100 horas, incluyendo 20 horas de conducción nocturna
  answer: C
  explanation: Una persona menor de 21 años debe completar un mínimo de 70 horas de
    conducción, incluyendo 10 horas de conducción nocturna, mientras esté acompañada
    por un conductor con licencia calificado.
- id: 24
  category: safe_driving_rules
  question: ¿Entre qué horas no puede operar un vehículo motorizado una persona menor
    de 18 años a la que se le ha emitido una licencia de conducir de Maine?
  choices:
    A: 10 p.m. y 5 a.m.
    B: 11 p.m. y 6 a.m.
    C: 12 a.m. y 5 a.m.
    D: 1 a.m. y 4 a.m.
  answer: C
  explanation: Una persona menor de 18 años a la que se le ha emitido una licencia
    de conducir de Maine no puede operar un vehículo motorizado entre las 12 a.m.
    y las 5 a.m.
- id: 25
  category: license_system
  question: ¿Durante cuánto tiempo están vigentes las restricciones de conducción
    iniciales para una persona menor de 18 años después de aprobar su examen de conducción?
  choices:
    A: 90 días
    B: 180 días
    C: 270 días
    D: 1 año
  answer: C
  explanation: Estas restricciones están vigentes por un período de 270 días a partir
    de la fecha en que se aprobó el examen de conducción.
- id: 26
  category: license_system
  question: ¿Durante cuánto tiempo se considera provisional la primera licencia emitida
    a un nuevo solicitante menor de 21 años?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que cumpla 21 años
  answer: C
  explanation: La primera licencia emitida a un nuevo solicitante menor de 21 años
    es provisional por un período de dos años.
- id: 27
  category: penalties_and_points
  question: ¿Cuál es la sanción si una persona es condenada por una primera infracción
    de tránsito mientras opera con una licencia provisional?
  choices:
    A: Se emite una carta de advertencia
    B: La licencia se suspende por 30 días
    C: La licencia se suspende por 90 días
    D: La licencia se revoca permanentemente
  answer: B
  explanation: Si una persona es condenada por una infracción de tránsito ocurrida
    mientras operaba con una licencia provisional, la licencia será suspendida por
    30 días.
- id: 28
  category: driver_testing
  question: ¿Qué dos aspectos de su visión se miden durante el examen de la vista?
  choices:
    A: Daltonismo y percepción de profundidad
    B: Agudeza visual y visión periférica
    C: Visión nocturna y sensibilidad a la luz
    D: Seguimiento de distancia y longitud focal
  answer: B
  explanation: El examen de la vista medirá su agudeza visual (qué tan claro ve) y
    su visión periférica (qué tan lejos puede ver a cada lado mientras mira hacia
    adelante).
- id: 29
  category: safe_driving_rules
  question: ¿Cuál es la ley con respecto al uso de teléfonos móviles o dispositivos
    electrónicos portátiles mientras se conduce con un permiso de aprendizaje en Maine?
  choices:
    A: Se permiten solo para navegación GPS
    B: Se permiten si se utiliza un accesorio de manos libres
    C: Están prohibidos por ley al conducir
    D: Se permiten solo durante las horas del día
  answer: C
  explanation: El uso de un teléfono móvil o dispositivos electrónicos portátiles
    está prohibido por ley al conducir en Maine con un permiso de aprendizaje.
- id: 30
  category: driver_testing
  question: Al llegar para un examen de conducción programado, ¿qué debe proporcionar
    el conductor?
  choices:
    A: Un vehículo de educación vial de doble control
    B: Su propio vehículo debidamente registrado e inspeccionado
    C: Un vehículo proporcionado por la Oficina de Vehículos Motorizados (BMV)
    D: Un vehículo comercial que pese más de 10,000 libras
  answer: B
  explanation: Los conductores deben proporcionar su propio vehículo, debidamente
    registrado (traer el registro) e inspeccionado, para el examen de conducción.
- id: 31
  category: driver_testing
  question: ¿Qué mide el examen de la vista para una licencia de conducir de Maine?
  choices:
    A: Agudeza visual y visión periférica
    B: Daltonismo y percepción de profundidad
    C: Visión nocturna y resistencia al deslumbramiento
    D: Tiempo de reacción y agudeza visual
  answer: A
  explanation: Según el manual, el examen de la vista medirá su agudeza visual (qué
    tan claramente ve) y su visión periférica (qué tan lejos puede ver hacia cada
    lado mientras mira hacia adelante).
- id: 32
  category: driver_testing
  question: ¿Cuándo se le realiza el examen práctico de manejo al solicitante?
  choices:
    A: Antes de realizar el examen escrito
    B: Al mismo tiempo que el examen de la vista
    C: Solo después de haber completado con éxito todos los demás exámenes
    D: Después de que el solicitante pague la tarifa final de la licencia
  answer: C
  explanation: 'El manual establece: ''El examen de manejo no se realizará hasta que
    todos los demás exámenes se hayan completado con éxito''.'
- id: 33
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar una licencia de conducir
    de Maine?
  choices:
    A: 15 años de edad
    B: 15 años y medio de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: 'El manual establece explícitamente: ''Debe tener al menos 16 años
    de edad para solicitar una licencia de Maine''.'
- id: 34
  category: license_system
  question: ¿Debe solicitar una Licencia de Conducir Comercial (CDL) si espera operar
    un vehículo diseñado para transportar a cuántos pasajeros?
  choices:
    A: Más de 10 pasajeros, incluido el conductor
    B: Más de 12 pasajeros, incluido el conductor
    C: Más de 15 pasajeros, incluido el conductor
    D: Más de 20 pasajeros, incluido el conductor
  answer: C
  explanation: Se requiere una Licencia de Conducir Comercial (CDL) si espera operar
    'un vehículo diseñado para transportar a más de 15 pasajeros, incluido el conductor'.
- id: 35
  category: penalties_and_points
  question: ¿Cuál es la sanción por hacer una declaración falsa en su solicitud de
    licencia de conducir?
  choices:
    A: Una multa de $500
    B: Revocación inmediata de su licencia y del privilegio de conducir
    C: Una suspensión de 30 días de su licencia
    D: Seis puntos de demérito en su historial de manejo
  answer: B
  explanation: El manual establece que 'Cualquier declaración falsa en la solicitud
    de licencia resultará en la revocación inmediata de su licencia y de su privilegio
    para operar en el Estado de Maine'.
- id: 36
  category: driver_responsibility
  question: ¿Cómo puede un padre o tutor legal que firmó la solicitud de un menor
    solicitar la suspensión de la licencia o permiso del menor?
  choices:
    A: Llamando al departamento de policía local
    B: Confiscando la licencia física del menor
    C: Presentando una solicitud por escrito ante notario al departamento
    D: Negándose a pagar el seguro de auto del menor
  answer: C
  explanation: Cualquier persona que haya firmado la solicitud de un menor puede presentar
    ante el departamento una solicitud por escrito ante notario pidiendo que se suspenda
    la licencia o el permiso de instrucción del menor.
- id: 37
  category: license_system
  question: Para un conductor menor de 65 años, ¿por cuánto tiempo es válida una nueva
    licencia con fotografía?
  choices:
    A: Hasta su cuarto cumpleaños después de la fecha de emisión
    B: Hasta su quinto cumpleaños después de la fecha de emisión
    C: Hasta su sexto cumpleaños después de la fecha de emisión
    D: Hasta su octavo cumpleaños después de la fecha de emisión
  answer: C
  explanation: Puede adquirir una licencia con fotografía que es válida hasta su sexto
    cumpleaños después de la fecha de emisión de la licencia (o el cuarto cumpleaños
    si tiene 65 años o más).
- id: 38
  category: license_system
  question: Si su nombre o dirección cambian, ¿cuánto tiempo tiene para notificar
    a la Oficina de Vehículos Motorizados (BMV)?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Maine exige que notifique a la Oficina de Vehículos Motorizados
    (BMV) dentro de los 30 días posteriores a un cambio de nombre o dirección.
- id: 39
  category: driver_responsibility
  question: ¿El Secretario de Estado está autorizado a suspender su licencia al recibir
    qué?
  choices:
    A: Una queja verbal de un vecino
    B: Un informe escrito adverso sobre su conducción por parte de un oficial de la
      ley o un miembro del público
    C: Una sola multa de estacionamiento
    D: Una llamada telefónica anónima
  answer: B
  explanation: 'El manual establece: ''El Secretario de Estado está autorizado a suspender
    su licencia al recibir un informe escrito adverso sobre su conducción por parte
    de un oficial de la ley u otro miembro del público''.'
- id: 40
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de revocación por homicidio vehicular si NO
    hay alcohol involucrado?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: Revocación permanente
  answer: C
  explanation: Para el homicidio vehicular, el manual especifica una revocación de
    al menos 5 años. (Si hay alcohol involucrado, la revocación es permanente).
- id: 41
  category: penalties_and_points
  question: ¿Qué sucede con su privilegio de conducir si es condenado por homicidio
    vehicular y hay alcohol involucrado?
  choices:
    A: Su licencia se suspende por 90 días
    B: Su licencia se revoca por 5 años
    C: Su licencia se revoca por 10 años
    D: Su licencia se revoca permanentemente
  answer: D
  explanation: 'El manual establece con respecto al homicidio vehicular: ''Si hay
    alcohol involucrado, la revocación es permanente''.'
- id: 42
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones puede resultar en una suspensión
    de la licencia de hasta 90 días?
  choices:
    A: Operar después de una suspensión
    B: Eludir a un oficial de policía
    C: Exceso de velocidad de 30 mph sobre el límite
    D: Abandonar la escena de un accidente
  answer: B
  explanation: La licencia de cualquier persona condenada por eludir a un oficial
    de policía, pasar un bloqueo de carretera o participar en carreras callejeras
    puede ser suspendida por un período de hasta 90 días.
- id: 43
  category: penalties_and_points
  question: ¿Por cuánto tiempo puede suspenderse su licencia si es condenado por operar
    después de una suspensión?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Cualquier persona que sea condenada por operar después de una suspensión
    puede tener su licencia suspendida por un período de 60 días.
- id: 44
  category: penalties_and_points
  question: ¿Pasar un autobús escolar detenido con sus luces rojas intermitentes puede
    resultar en una suspensión de la licencia por cuántos días?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: A
  explanation: Las personas condenadas por pasar un autobús escolar detenido con sus
    luces rojas intermitentes pueden tener sus licencias suspendidas por un período
    de 30 días.
- id: 45
  category: alcohol_drugs_health
  question: ¿Cuántos puntos de demérito se asignan si una persona menor de 21 años
    es sentenciada por usar una identificación falsa para obtener licor?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: El manual establece que la infracción de usar credenciales falsas o
    fraudulentas para obtener licor o ingresar a un establecimiento de bebidas conllevará
    seis puntos de demérito.
- id: 46
  category: penalties_and_points
  question: ¿En qué nivel de puntos emitirá el Secretario de Estado de Maine una advertencia
    a un conductor?
  choices:
    A: 3 puntos
    B: 6 puntos
    C: 9 puntos
    D: 12 puntos
  answer: B
  explanation: De acuerdo con el Sistema de Puntos de Maine, una vez que un conductor
    alcanza los 6 puntos, el Secretario de Estado emite una advertencia.
- id: 47
  category: penalties_and_points
  question: ¿Cuánto tiempo tardan los puntos de demérito en borrarse del registro
    de un conductor en Maine?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Tres años
  answer: B
  explanation: Los puntos se borrarán del registro de un conductor cuando cumplan
    un año de antigüedad.
- id: 48
  category: safe_driving_rules
  question: ¿Intentar eludir a un oficial de la ley resultando en una persecución
    a alta velocidad se clasifica como qué tipo de delito si nadie resulta herido?
  choices:
    A: Delito de Clase A
    B: Delito de Clase B
    C: Delito de Clase C
    D: Delito de Clase D
  answer: C
  explanation: Intentar eludir a un oficial de la ley conduciendo a una velocidad
    temeraria resultando en una persecución a alta velocidad es un delito de Clase
    C.
- id: 49
  category: penalties_and_points
  question: ¿Cuál es el número máximo de puntos de crédito por ausencia de infracciones
    que un conductor puede acumular?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: C
  explanation: El sistema de crédito por ausencia de infracciones permite a un conductor
    acumular hasta cuatro puntos de crédito por ausencia de infracciones, ganando
    un punto por cada año calendario libre de condenas o suspensiones.
- id: 50
  category: driver_responsibility
  question: ¿Cuántos puntos se deducen del total de un conductor al completar con
    éxito el Curso de Dinámica de Conducción de Maine (Maine Driving Dynamics Course)?
  choices:
    A: Un punto
    B: Dos puntos
    C: Tres puntos
    D: Cuatro puntos
  answer: C
  explanation: La finalización exitosa de un Curso de Dinámica de Conducción de Maine
    u otro curso aprobado de mejora del conductor deducirá tres puntos del total de
    puntos de un conductor.
- id: 51
  category: penalties_and_points
  question: ¿Un conductor puede estar sujeto a una suspensión adicional de hasta 120
    días si su licencia ha sido suspendida cuántas veces en un período de tres años?
  choices:
    A: Dos veces
    B: Tres veces
    C: Cuatro veces
    D: Cinco veces
  answer: B
  explanation: Cualquier persona cuya licencia haya sido suspendida tres veces en
    un período de tres años por el Secretario de Estado o por un tribunal puede estar
    sujeta a una suspensión adicional por un período de hasta 120 días.
- id: 52
  category: alcohol_drugs_health
  question: ¿Cuál es el período mínimo de suspensión de la licencia para un menor
    condenado por transporte ilegal de bebidas alcohólicas en un vehículo motorizado?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: El transporte, la posesión o el consumo ilegal de bebidas alcohólicas
    por parte de un menor en un vehículo motorizado requiere una suspensión obligatoria
    de al menos 30 días.
- id: 53
  category: penalties_and_points
  question: ¿Cuál de las siguientes situaciones resultará en una suspensión obligatoria
    de la licencia sin opción a una licencia de "trabajo"?
  choices:
    A: Acumular 4 puntos de demérito
    B: No responder a una citación judicial por un vehículo motorizado
    C: Una multa de estacionamiento por primera vez
    D: Conducir un vehículo de más de 25 años de antigüedad
  answer: B
  explanation: No responder a una citación judicial por un vehículo motorizado o no
    pagar cualquier multa relacionada requiere una suspensión obligatoria total sin
    excepciones y sin opción a una licencia de "trabajo".
- id: 54
  category: penalties_and_points
  question: Si un conductor utiliza un vehículo motorizado para cometer un delito
    de Clase D que crea un riesgo sustancial de lesiones corporales graves, ¿por cuánto
    tiempo se le revocará la licencia?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Tres años
  answer: C
  explanation: Los períodos de revocación de la licencia por delitos penales designados
    que involucran un vehículo motorizado son de tres años para delitos de Clase A,
    B o C, dos años para un delito de Clase D y un año para un delito de Clase E.
- id: 55
  category: vehicle_information
  question: ¿Dónde debe guardar el certificado de título de su vehículo?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En un lugar seguro, nunca en el vehículo
    D: Pegado con cinta en el interior del parabrisas
  answer: C
  explanation: El manual establece que el certificado de título debe guardarse en
    un lugar seguro y nunca en el vehículo.
- id: 56
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos debe tener un título en Maine?
  choices:
    A: Un vehículo de 30 años de antigüedad
    B: Una motocicleta con un motor de 250 cc
    C: Un remolque con un peso sin carga de 2,000 libras
    D: Un automóvil de pasajeros de 10 años de antigüedad
  answer: D
  explanation: Los vehículos de más de 25 años, las motocicletas de menos de 300 cc
    y los remolques de 3,000 libras o menos están exentos de necesitar un título.
    Un automóvil de pasajeros de 10 años no cumple con estas exenciones y debe tener
    título.
- id: 57
  category: vehicle_information
  question: ¿Cuál es el primer paso para registrar un vehículo motorizado en Maine?
  choices:
    A: Aprobar un examen de conducir
    B: Pagar el impuesto especial (excise tax) a un recaudador de impuestos municipal
    C: Enviar una solicitud de título a la Oficina de Vehículos Motorizados (BMV)
    D: Obtener una inspección del vehículo
  answer: B
  explanation: El pago del impuesto especial (excise tax) a un recaudador de impuestos
    municipal es el primer paso para registrar su vehículo motorizado.
- id: 58
  category: vehicle_information
  question: ¿De qué dos factores depende el monto del impuesto especial (excise tax)
    a pagar al registrar un vehículo en Maine?
  choices:
    A: El peso y el color del vehículo
    B: La edad del propietario y su historial de conducción
    C: La antigüedad del vehículo y el precio de lista de fábrica
    D: El condado de residencia y el tamaño del motor
  answer: C
  explanation: El monto del impuesto especial (excise tax) a pagar depende de la antigüedad
    y el precio de lista de fábrica del vehículo que se está registrando.
- id: 59
  category: license_system
  question: Si una persona es menor de 18 años, ¿quién debe firmar su formulario de
    registro de vehículo?
  choices:
    A: Un instructor de manejo
    B: Un padre o tutor
    C: Un recaudador de impuestos municipal
    D: Un oficial de policía
  answer: B
  explanation: Si usted es menor de 18 años, un padre o tutor también debe firmar
    el formulario de registro.
- id: 60
  category: penalties_and_points
  question: ¿Puede un juez suspender la licencia de conducir por no pagar una multa
    en un proceso de infracción civil no relacionado con vehículos motorizados?
  choices:
    A: Sí, un juez tiene autoridad discrecional para ordenar una suspensión por delitos
      no relacionados con vehículos motorizados.
    B: No, las suspensiones de licencia solo pueden ordenarse por infracciones de
      tránsito.
    C: Sí, pero solo si la multa es superior a $500.
    D: No, solo el Secretario de Estado puede suspender una licencia.
  answer: A
  explanation: Un juez tiene autoridad discrecional para suspender la licencia de
    conducir de cualquier persona declarada en desacato por no pagar una multa, y
    puede ordenar la suspensión de la licencia de conducir por delitos no relacionados
    con la operación de vehículos motorizados.
- id: 61
  category: vehicle_information
  question: ¿Cuál es el costo de la tarifa de registro para un vehículo de pasajeros
    estándar en Maine y por cuánto tiempo es válida?
  choices:
    A: $25.00 por un año
    B: $35.00 por un año
    C: $50.00 por dos años
    D: $35.00 por dos años
  answer: B
  explanation: Según el manual, la tarifa de registro para un vehículo de pasajeros
    es de $35.00, y el registro permanece válido por un año a partir del mes en que
    se emite.
- id: 62
  category: vehicle_information
  question: 'Al registrar un vehículo por primera vez en Maine, se debe presentar
    una solicitud de título si el vehículo tiene:'
  choices:
    A: 10 años de antigüedad o menos
    B: 15 años de antigüedad o menos
    C: 25 años de antigüedad o menos
    D: Cualquier edad
  answer: C
  explanation: Al momento del primer registro, se debe presentar una solicitud de
    título para un vehículo que tenga 25 años de antigüedad o menos.
- id: 63
  category: vehicle_information
  question: ¿Cuánto tiempo después de declarar o establecer su residencia en Maine
    debe solicitar el registro de un vehículo motorizado de Maine?
  choices:
    A: Dentro de 10 días
    B: Dentro de 30 días
    C: Dentro de 60 días
    D: Dentro de 90 días
  answer: B
  explanation: La ley de Maine exige que se solicite el registro de un vehículo motorizado
    de Maine dentro de los 30 días posteriores a la declaración o establecimiento
    de la residencia en el estado de Maine.
- id: 64
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de no presentar el comprobante de seguro
    del vehículo cuando lo solicita un oficial de la ley?
  choices:
    A: Una advertencia y una multa de $50
    B: Suspensión de su licencia y de los privilegios de registro
    C: Confiscación inmediata de su vehículo
    D: Servicio comunitario obligatorio
  answer: B
  explanation: No presentar el comprobante de seguro cuando se requiere puede resultar
    en un cargo por operación sin seguro y en la suspensión de la licencia y de los
    privilegios de registro.
- id: 65
  category: vehicle_information
  question: En Maine, ¿cuál de las siguientes afirmaciones es verdadera con respecto
    a la cobertura de "conductor no asegurado"?
  choices:
    A: Es opcional para todos los conductores
    B: Solo se requiere para vehículos comerciales
    C: Está incluida por ley en todas las pólizas de responsabilidad civil de automóviles
      emitidas en Maine
    D: Debe comprarse por separado a través del estado
  answer: C
  explanation: Por ley, todas las pólizas de responsabilidad civil de automóviles
    emitidas en Maine incluyen cobertura de "conductor no asegurado" para proteger
    al asegurado por daños por lesiones corporales.
- id: 66
  category: vehicle_information
  question: Si un conductor no puede obtener cobertura de seguro a través de los canales
    regulares, ¿cómo puede obtener cobertura en Maine?
  choices:
    A: A través del Plan de Seguro de Automóviles de Maine
    B: Solicitando una exención de seguro estatal
    C: A través del Fondo para No Asegurados de la Oficina de Vehículos Motorizados
    D: Registrando el vehículo como un vehículo de uso agrícola
  answer: A
  explanation: Cualquier persona que no pueda obtener cobertura de seguro a través
    de los canales regulares puede obtenerla a través del Plan de Seguro de Automóviles
    de Maine (Riesgo Asignado).
- id: 67
  category: vehicle_information
  question: ¿Con qué frecuencia debe inspeccionarse un vehículo motorizado con registro
    de Maine en una estación de inspección oficial?
  choices:
    A: Cada 6 meses
    B: Una vez al año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Todos los vehículos motorizados con registro de Maine deben tener una
    inspección de Maine vigente antes de ser operados en cualquier vía pública, y
    estas inspecciones deben realizarse una vez al año.
- id: 68
  category: driver_testing
  question: 'Durante la verificación de seguridad del vehículo motorizado para un
    examen de conducir, el examen NO se realizará si:'
  choices:
    A: El radio está roto
    B: La puerta de la guantera no está bien sujeta en posición cerrada
    C: El vehículo tiene alfombrillas de repuesto
    D: El aire acondicionado no funciona
  answer: B
  explanation: Los exámenes no se realizarán si los vehículos no pasan los criterios
    de examen regular, o si alguna puerta no funciona, los asientos no están bien
    sujetos, o si la puerta de la guantera no está bien sujeta en posición cerrada.
- id: 69
  category: vehicle_information
  question: Para pasar la inspección de vehículos del estado de Maine, ¿la bocina
    de un vehículo debe ser lo suficientemente fuerte como para ser escuchada desde
    qué distancia?
  choices:
    A: 50 pies de distancia
    B: 100 pies de distancia
    C: 200 pies de distancia
    D: 500 pies de distancia
  answer: C
  explanation: El manual establece que la bocina debe ser lo suficientemente fuerte
    como para escucharse desde 200 pies de distancia para pasar la inspección.
- id: 70
  category: vehicle_information
  question: Según los estándares de inspección de Maine, ¿el freno de pie de un vehículo
    debe ser capaz de detener el vehículo a una distancia de 30 pies cuando viaja
    a qué velocidad?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 30 millas por hora
  answer: B
  explanation: El freno de pie debe ser capaz de detener el vehículo a una distancia
    de 30 pies cuando el vehículo circula a 20 millas por hora.
- id: 71
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima requerida de la banda de rodadura de los
    neumáticos para que un vehículo de pasajeros estándar pase la inspección en Maine?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: Los neumáticos deben tener una banda de rodadura de 2/32 de pulgada
    y estar libres de cortes, desgarros u otras condiciones peligrosas. (Los vehículos
    comerciales de 10,000 libras de GVW requieren 4/32).
- id: 72
  category: vehicle_information
  question: Al revisar la dirección de su vehículo, ¿cuánto debe girar el volante
    sin que el vehículo se mueva para considerar que tiene demasiado juego y podría
    impedirle girar lo suficientemente rápido como para evitar una colisión?
  choices:
    A: Media pulgada o más
    B: Una pulgada o más
    C: Dos pulgadas o más
    D: Cuatro pulgadas o más
  answer: C
  explanation: Si el volante gira dos pulgadas o más sin mover el vehículo, tiene
    demasiado juego y es posible que no pueda girar lo suficientemente rápido para
    evitar una colisión.
- id: 73
  category: safe_driving_rules
  question: Un silenciador con fugas puede descargar monóxido de carbono de manera
    inadecuada. ¿Cuál de las siguientes opciones describe el monóxido de carbono?
  choices:
    A: Un gas inofensivo que huele a azufre
    B: Un gas mortal e inodoro que causa cansancio y dolores de cabeza
    C: Un humo negro visible que causa irritación en los ojos
    D: Un gas de olor dulce que mejora el rendimiento del motor
  answer: B
  explanation: El monóxido de carbono es un gas mortal e inodoro que se encuentra
    en el escape de todos los motores de gasolina y que provoca cansancio, dolores
    de cabeza, mareos, náuseas y zumbidos en los oídos.
- id: 74
  category: vehicle_information
  question: 'Es ilegal operar un vehículo de motor a gasolina en una vía pública si
    emite humo visible (que no sea vapor de agua) por el escape durante un período
    de más de:'
  choices:
    A: 3 segundos consecutivos
    B: 5 segundos consecutivos
    C: 10 segundos consecutivos
    D: 15 segundos consecutivos
  answer: B
  explanation: Una persona no puede operar un vehículo de motor a gasolina en una
    vía pública si el vehículo emite humo visible, que no sea vapor de agua, en la
    emisión del escape durante un período de más de 5 segundos consecutivos.
- id: 75
  category: vehicle_information
  question: ¿Cómo puede probar si su vehículo podría necesitar amortiguadores nuevos?
  choices:
    A: Escuchando si hay un chirrido al aplicar los frenos
    B: Comprobando si el volante gira más de dos pulgadas sin mover los neumáticos
    C: Presionando hacia abajo en la parte delantera y trasera del vehículo para ver
      si rebota más de dos veces
    D: Comprobando si el vehículo se desvía hacia un lado al acelerar
  answer: C
  explanation: Para revisar la suspensión, presione hacia abajo en la parte delantera
    y trasera de su vehículo. Si rebota más de dos veces, es posible que necesite
    amortiguadores nuevos.
- id: 76
  category: vehicle_information
  question: Para maximizar el rendimiento y prevenir problemas comunes, ¿con qué frecuencia
    debe realizar el mantenimiento de su vehículo con cambios de aceite frecuentes?
  choices:
    A: Cada 1,000 - 2,000 millas
    B: Cada 3,000 - 5,000 millas
    C: Cada 7,000 - 10,000 millas
    D: Una vez al año independientemente del millaje
  answer: B
  explanation: Mantener su vehículo con cambios de aceite frecuentes cada 3,000 -
    5,000 millas sirve como prevención contra muchos problemas comunes de los vehículos
    de motor.
- id: 77
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por operar un sistema de
    sonido a un volumen excesivo?
  choices:
    A: Una multa de $25
    B: Una multa de $50
    C: Una multa de $100
    D: Una multa de $150
  answer: B
  explanation: La violación de la ley de ruido excesivo del sistema de sonido es una
    infracción de tránsito y se tasará en $50 por una primera infracción.
- id: 78
  category: safe_driving_rules
  question: ¿Por qué los conductores deben evitar el uso de gafas de sol o lentes
    teñidos por la noche?
  choices:
    A: Hacen que el conductor se fatigue fácilmente
    B: Reducen la visión nocturna crítica
    C: Aumentan el deslumbramiento de los faros que vienen en sentido contrario
    D: Dificultan la audición de las sirenas de emergencia
  answer: B
  explanation: El manual indica que no se deben usar gafas de sol ni lentes teñidos
    por la noche, ya que reducirán su visión nocturna crítica.
- id: 79
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla con respecto a la audición y la conducción
    segura?
  choices:
    A: Debe usar auriculares para bloquear el ruido molesto de la carretera
    B: Debe conducir con las ventanas bajas para escuchar las sirenas
    C: Debe mantener el volumen del radio bajo y no usar cascos ni auriculares
    D: Debe realizarse una prueba de audición cada vez que renueve su licencia
  answer: C
  explanation: El manual aconseja mantener el volumen del radio bajo y no usar cascos
    ni auriculares mientras conduce.
- id: 80
  category: safe_driving_rules
  question: ¿Qué es un 'microsueño'?
  choices:
    A: Una siesta breve que dura de 4 a 5 segundos y que el conductor puede no darse
      cuenta de que ocurrió
    B: Una siesta reparadora de 15 a 20 minutos tomada en una parada de descanso
    C: Un estado de distracción donde el conductor olvida las últimas millas recorridas
    D: Una condición médica causada por tomar medicamentos de venta libre
  answer: A
  explanation: Los 'microsueños' son siestas breves que duran solo cuatro o cinco
    segundos; un conductor somnoliento puede quedarse dormido brevemente y ni siquiera
    saberlo.
- id: 81
  category: safe_driving_rules
  question: Al realizar un viaje largo, ¿con qué frecuencia debe programar un descanso
    para evitar la fatiga?
  choices:
    A: Cada hora o 50 millas
    B: Cada dos horas o 100 millas
    C: Cada cuatro horas o 200 millas
    D: Solo cuando empiece a bostezar continuamente
  answer: B
  explanation: Debe programar un descanso cada dos horas o 100 millas, pero deténgase
    antes si experimenta cualquier señal de peligro de fatiga.
- id: 82
  category: safe_driving_rules
  question: 'Para evitar conducir durante el "tiempo de inactividad" de su cuerpo,
    debe buscar un lugar seguro para dormir entre las horas de:'
  choices:
    A: 8 p.m. y medianoche
    B: Medianoche y 6 a.m.
    C: 1 p.m. y 3 p.m.
    D: 4 a.m. y 8 a.m.
  answer: B
  explanation: El manual recomienda evitar conducir durante el "tiempo de inactividad"
    de su cuerpo tomando un descanso necesario y buscando un lugar seguro para dormir
    entre la medianoche y las 6 a.m.
- id: 83
  category: safe_driving_rules
  question: Si usted está conduciendo y su pasajero del asiento delantero necesita
    descansar, ¿qué debe hacer este?
  choices:
    A: Reclinar el asiento del pasajero delantero completamente hacia atrás
    B: Permanecer en el asiento delantero pero alejarse del conductor
    C: Ir al asiento trasero, abrocharse el cinturón y tomar una siesta
    D: Hablar con el conductor hasta llegar al destino
  answer: C
  explanation: Un pasajero que necesite descansar debe ir al asiento trasero, abrocharse
    el cinturón y tomar una siesta, para que ambas personas en los asientos delanteros
    permanezcan despiertas y alerta.
- id: 84
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una señal de peligro de somnolencia al conducir?
  choices:
    A: Está revisando sus espejos con frecuencia
    B: No recuerda haber conducido las últimas millas
    C: Está sujetando el volante con fuerza
    D: Siente la necesidad de bajar el volumen de la radio
  answer: B
  explanation: No recordar haber conducido las últimas millas se menciona explícitamente
    en el manual como una de las señales de peligro de somnolencia.
- id: 85
  category: safe_driving_rules
  question: ¿Cómo deben asegurarse las mascotas en un vehículo para evitar la distracción
    del conductor?
  choices:
    A: Sujetadas de forma segura en el regazo del pasajero delantero
    B: Atadas al asiento trasero con una correa
    C: Permitir que deambulen libremente solo en el asiento trasero
    D: Mantenerlas en un transportador de mascotas, no sueltas en el vehículo
  answer: D
  explanation: Para evitar distracciones, el manual instruye a los conductores a mantener
    a las mascotas en un transportador de mascotas, no sueltas en el vehículo.
- id: 86
  category: penalties_and_points
  question: 'El sistema de sonido de un vehículo se considera excesivamente ruidoso
    e ilegal si supera los 85 decibelios y es audible a una distancia superior a:'
  choices:
    A: 10 pies
    B: 25 pies
    C: 50 pies
    D: 100 pies
  answer: B
  explanation: Una persona no puede operar un sistema de sonido a un volumen que sea
    audible a una distancia superior a 25 pies y que exceda los 85 decibelios.
- id: 87
  category: safe_driving_rules
  question: ¿Cuál es la única forma de eliminar una "deuda de sueño"?
  choices:
    A: Beber bebidas con cafeína
    B: Abrir un poco la ventana para que entre aire fresco
    C: Dormir más
    D: Poner música a todo volumen
  answer: C
  explanation: El manual establece que la única forma de eliminar una deuda de sueño
    es dormir más; no se puede eliminar con cafeína, música alta o aire fresco.
- id: 88
  category: vehicle_information
  question: ¿Cuál de los siguientes artículos se recomienda tener en su automóvil
    en caso de una avería o emergencia?
  choices:
    A: Una batería de repuesto
    B: Una llave de cruz
    C: Refrigerante de motor adicional
    D: Un compresor de aire portátil
  answer: B
  explanation: El manual enumera una llave de cruz (junto con el manual del propietario,
    neumático de repuesto, gato, botiquín de primeros auxilios, manta, linterna y
    mapas de carreteras) como herramientas y suministros recomendables para emergencias.
- id: 89
  category: safe_driving_rules
  question: ¿Cómo deben asegurarse las mascotas cuando usted está conduciendo?
  choices:
    A: En el regazo del pasajero
    B: En un transportador de mascotas, no sueltas en el vehículo
    C: En el asiento delantero con cinturón de seguridad
    D: Sueltas en el asiento trasero
  answer: B
  explanation: El manual establece que al conducir, debe mantener a las mascotas en
    un transportador de mascotas, no sueltas en el vehículo.
- id: 90
  category: defensive_driving
  question: Según un estudio del Instituto de Transporte de Virginia Tech, ¿cuánto
    mayor era el riesgo de los conductores de camiones que enviaban mensajes de texto
    mientras conducían de verse involucrados en un choque o casi choque?
  choices:
    A: 5 veces el riesgo
    B: 10 veces el riesgo
    C: 23 veces el riesgo
    D: 50 veces el riesgo
  answer: C
  explanation: Un estudio de conducción en cabina reveló que los conductores de camiones
    que enviaban mensajes de texto mientras conducían tenían 23 veces más riesgo de
    verse involucrados en un choque o en un incidente de casi choque.
- id: 91
  category: safe_driving_rules
  question: ¿Qué define una distracción cognitiva al conducir?
  choices:
    A: Quitar una o ambas manos del volante
    B: Pensamientos y sentimientos mentales como la ira o la preocupación
    C: Apartar la vista de la carretera para ver las señales de las calles
    D: Ajustar los espejos del vehículo
  answer: B
  explanation: Las distracciones cognitivas son pensamientos y sentimientos mentales
    (ira, ansiedad, preocupación, etc.) que distraen al conductor y desvían la atención
    de la carretera.
- id: 92
  category: defensive_driving
  question: 'Los vistazos rápidos a la instrumentación del vehículo o a los espejos
    pueden realizarse de forma segura si se limitan a:'
  choices:
    A: Menos de un segundo
    B: De dos a tres segundos
    C: Menos de cinco segundos
    D: Solo cuando se está detenido en un semáforo en rojo
  answer: A
  explanation: Los vistazos rápidos a la instrumentación del vehículo, los espejos
    u otra tecnología pueden realizarse de forma segura si estos escaneos se limitan
    a menos de un segundo y están relacionados únicamente con la tarea de conducir.
- id: 93
  category: safe_driving_rules
  question: ¿Por qué debería colocar los teléfonos portátiles en sus soportes (cradles)
    mientras conduce?
  choices:
    A: Para cargar la batería más rápido
    B: Para que no se conviertan en proyectiles en un choque
    C: Para mejorar la señal celular
    D: Para que los pasajeros no puedan alcanzarlos
  answer: B
  explanation: El manual aconseja colocar los teléfonos portátiles en sus soportes
    para que no se conviertan en proyectiles en caso de un choque.
- id: 94
  category: penalties_and_points
  question: 'Si un conductor menor de 18 años opera un vehículo motorizado mientras
    usa un dispositivo electrónico portátil, la infracción se considera una:'
  choices:
    A: Delito grave (Felony)
    B: Delito menor de Clase C (Class C Misdemeanor)
    C: Infracción de tráfico
    D: Ofensa criminal
  answer: C
  explanation: Se prohíbe a una persona menor de 18 años operar un vehículo motorizado
    mientras usa un teléfono móvil o un dispositivo electrónico portátil, y la violación
    de este estatuto se considera una infracción de tráfico.
- id: 95
  category: driver_responsibility
  question: ¿Cuál de los siguientes comportamientos se considera conducción agresiva?
  choices:
    A: Conducir por debajo del límite de velocidad
    B: Cambios de carril inseguros y seguir demasiado de cerca
    C: Usar un dispositivo celular de manos libres
    D: Mirar la instrumentación del vehículo por menos de un segundo
  answer: B
  explanation: La conducción agresiva incluye el exceso de velocidad, seguir demasiado
    de cerca, cambios de carril inseguros, no señalizar al girar y no obedecer los
    controles de tráfico.
- id: 96
  category: alcohol_drugs_health
  question: ¿En qué porcentaje aproximado de todos los choques fatales el alcohol
    y otras drogas son factores contribuyentes?
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: Según el manual, el alcohol y otras drogas son factores contribuyentes
    en aproximadamente el 40% de todos los choques fatales.
- id: 97
  category: penalties_and_points
  question: 'Si usted es menor de 21 años y es condenado por operar un vehículo motorizado
    bajo la influencia (OUI), perderá su licencia de conducir por al menos:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Si usted es menor de 21 años y es condenado por operar un vehículo
    motorizado bajo la influencia (OUI), perderá su licencia de conducir por al menos
    un año.
- id: 98
  category: penalties_and_points
  question: 'Si un conductor menor de 21 años es condenado por operar bajo la influencia
    (OUI) mientras transporta pasajeros menores de 21 años, su licencia será suspendida
    por un tiempo adicional de:'
  choices:
    A: 30 días
    B: 60 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Si usted es menor de 21 años y es condenado por OUI con pasajeros menores
    de 21 años con usted, su licencia será suspendida por 180 días adicionales.
- id: 99
  category: alcohol_drugs_health
  question: ¿A qué nivel de contenido de alcohol en sangre (BAC) se ve afectada la
    visión de todos los conductores?
  choices:
    A: '.02'
    B: '.04'
    C: '.06'
    D: '.08'
  answer: A
  explanation: El manual establece que la visión se ve afectada a un .02 de BAC para
    todos los conductores.
- id: 100
  category: safe_driving_rules
  question: 'Una buena percepción es especialmente importante por la noche porque
    la visión normal se reduce en un:'
  choices:
    A: 10%
    B: 25%
    C: 50%
    D: 75%
  answer: C
  explanation: La capacidad de ver bien se vuelve aún más importante por la noche,
    ya que la visión normal se reduce en un 50% debido a que no hay suficiente luz
    para que sus ojos funcionen correctamente.
- id: 101
  category: defensive_driving
  question: ¿En condiciones normales, aproximadamente cuánto tiempo tardan sus ojos
    en recuperarse del resplandor de los faros que vienen en sentido contrario?
  choices:
    A: 2 segundos
    B: 4 segundos
    C: 7 segundos
    D: 12 segundos
  answer: C
  explanation: Normalmente, los ojos tardan unos siete segundos en recuperarse del
    resplandor de los faros, lo que a 55 mph es casi la longitud de dos campos de
    fútbol americano.
- id: 102
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de alcohol su percepción visual al conducir?
  choices:
    A: Agudiza su capacidad para juzgar la distancia
    B: Reduce su capacidad para identificar objetos a los lados
    C: Disminuye el tiempo necesario para recuperarse del resplandor de los faros
    D: Mejora su capacidad para ver diferentes colores
  answer: B
  explanation: El alcohol afecta su capacidad para identificar objetos a los lados
    cuando mira hacia adelante, reduciendo su capacidad para ver vehículos que se
    incorporan, rebasan o están estacionados, y/o peatones o ciclistas.
- id: 103
  category: alcohol_drugs_health
  question: ¿Qué cantidad de alcohol hay en una lata de cerveza de 12 oz. en comparación
    con un trago (shot) de 1 oz. de licor fuerte de 100 grados (100 proof)?
  choices:
    A: La mitad
    B: El doble
    C: Aproximadamente la misma cantidad
    D: Un tercio
  answer: C
  explanation: Según el manual, hay aproximadamente la misma cantidad de alcohol en
    una lata de cerveza de 12 oz. que en un trago de 1 oz. de licor fuerte de 100
    grados o en una copa de vino de mesa de 4 oz.
- id: 104
  category: alcohol_drugs_health
  question: Según el manual, ¿cuál es la única forma efectiva de recuperar la sobriedad
    después de beber alcohol?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigoroso
    D: Permitir que pase el tiempo
  answer: D
  explanation: Debido a que el hígado de cada persona oxida el alcohol a un ritmo
    constante, nada más que el tiempo le devolverá la sobriedad. El café, las duchas
    o el ejercicio solo darán como resultado un borracho bien despierto, mojado o
    sudoroso.
- id: 105
  category: alcohol_drugs_health
  question: ¿Cuánto aumenta la probabilidad de sufrir un accidente automovilístico
    si su nivel de alcohol alcanza los 0.15 gramos?
  choices:
    A: 1 vez
    B: 6 veces
    C: 15 veces
    D: 25 veces
  answer: D
  explanation: El manual establece que sus posibilidades de sufrir un accidente aumentan
    a medida que aumenta su BrAC (concentración de alcohol en el aliento), señalando
    específicamente que a 0.15 gramos, la probabilidad aumenta 25 veces.
- id: 106
  category: penalties_and_points
  question: ¿Qué sucede inmediatamente si es arrestado por conducir con un nivel de
    alcohol de 0.08 gramos o superior?
  choices:
    A: Se le emite una advertencia y se le permite conducir a casa.
    B: El Secretario de Estado suspenderá inmediatamente su licencia antes de cualquier
      comparecencia ante el tribunal.
    C: Debe pagar una multa de $500 en el acto para evitar la suspensión.
    D: Su vehículo es confiscado permanentemente por el estado.
  answer: B
  explanation: Tras su arresto y basándose únicamente en el informe policial y el
    resultado de una prueba de nivel de alcohol, el Secretario de Estado suspenderá
    inmediatamente su licencia antes de cualquier comparecencia ante el tribunal.
- id: 107
  category: penalties_and_points
  question: ¿Qué significa la ley de 'Consentimiento Implícito' (Implied Consent)
    de Maine?
  choices:
    A: Usted consiente automáticamente a una prueba química en cualquier momento que
      las autoridades deseen administrarla.
    B: Usted consiente que se registre su vehículo en cualquier parada de tráfico
      rutinaria.
    C: Usted tiene el derecho de rechazar una prueba de aliento sin ninguna sanción.
    D: Usted consiente pagar todas las multas de tráfico dentro de los 30 días posteriores
      a una citación.
  answer: A
  explanation: Explicado brevemente, cuando usted opera un vehículo motorizado en
    Maine, otorga automáticamente su consentimiento para una prueba en cualquier momento
    que las autoridades deseen administrarla.
- id: 108
  category: penalties_and_points
  question: Bajo la ley de Consentimiento Implícito, ¿cuál es la sanción administrativa
    por negarse a realizar una prueba de alcohol?
  choices:
    A: Una sentencia de cárcel obligatoria de 30 días
    B: Suspensión inmediata de su licencia de conducir por hasta seis años
    C: Una revocación permanente de su licencia de conducir
    D: Una multa de $5,000 y 100 horas de servicio comunitario
  answer: B
  explanation: No se le obligará a realizar dicha prueba, pero su licencia de conducir
    será suspendida inmediatamente si se niega. La suspensión será por un período
    de hasta seis años por parte del Secretario de Estado.
- id: 109
  category: penalties_and_points
  question: ¿Cuál es el período mínimo de suspensión de la licencia por una primera
    condena por OUI (conducir bajo la influencia) con un nivel de alcohol entre 0.08
    y 0.14?
  choices:
    A: 30 días
    B: 90 días
    C: 150 días
    D: 1 año
  answer: C
  explanation: Si es condenado por OUI y su nivel de alcohol es de 0.08 a 0.14 gramos...
    perderá su licencia por al menos 150 días.
- id: 110
  category: penalties_and_points
  question: ¿Cuál de las siguientes situaciones resultará en al menos 48 horas de
    cárcel por una primera condena por OUI?
  choices:
    A: Tener un nivel de alcohol de 0.10
    B: Viajar a 30 mph o más por encima del límite de velocidad
    C: No bajar la intensidad de los faros ante el tráfico que viene en sentido contrario
    D: Realizar cambios frecuentes de carril
  answer: B
  explanation: Si es condenado por OUI y... viaja a 30 mph o más por encima del límite
    de velocidad... pasará al menos 48 horas en la cárcel.
- id: 111
  category: penalties_and_points
  question: ¿Qué sanción adicional se añade a una suspensión por OUI (conducir bajo
    la influencia) o por negarse a la prueba si un pasajero menor de 21 años estaba
    en el vehículo?
  choices:
    A: Una suspensión de 275 días
    B: Una suspensión de 150 días
    C: Una multa de $1,000
    D: 30 días de cárcel
  answer: A
  explanation: Se debe añadir un periodo de suspensión de 275 días a la suspensión
    por OUI o por negarse a la prueba si un pasajero menor de 21 años estaba en el
    vehículo.
- id: 112
  category: license_system
  question: Después de su primera condena por OUI, ¿por cuánto tiempo es condicional
    su licencia restablecida?
  choices:
    A: 6 meses
    B: 1 año
    C: 5 años
    D: 10 años
  answer: B
  explanation: Después de la primera condena por OUI, la licencia restablecida es
    condicional durante un año.
- id: 113
  category: penalties_and_points
  question: ¿Qué sucede si el titular de una licencia condicional opera un vehículo
    motorizado con cualquier cantidad de alcohol en su sistema?
  choices:
    A: Recibe una advertencia por escrito.
    B: Su licencia se suspende por 30 días.
    C: Su licencia se suspende por un año sin una audiencia preliminar.
    D: Debe volver a tomar el examen de conducir.
  answer: C
  explanation: A un titular de licencia condicional se le suspenderá la licencia de
    conducir por un año, sin audiencia preliminar, si opera un vehículo motorizado
    con cualquier cantidad de alcohol.
- id: 114
  category: license_system
  question: ¿Existen disposiciones para una licencia de trabajo o limitada durante
    el periodo mínimo de suspensión por una condena de OUI?
  choices:
    A: Sí, si necesita conducir al trabajo.
    B: Sí, pero solo para emergencias médicas.
    C: Sí, si paga una tarifa adicional.
    D: No, a los infractores se les prohíbe absolutamente conducir inicialmente.
  answer: D
  explanation: No existen disposiciones de ningún tipo para una licencia de trabajo
    o limitada durante el periodo mínimo de suspensión por una condena de OUI. ¡A
    los infractores se les prohíbe absolutamente conducir inicialmente!
- id: 115
  category: alcohol_drugs_health
  question: ¿Puede el uso de un medicamento de venta libre o un fármaco recetado utilizarse
    como defensa ante el tribunal por conducir bajo los efectos de sustancias?
  choices:
    A: Sí, si fue recetado por un médico.
    B: Sí, si es un medicamento de venta libre.
    C: No, el uso de estos medicamentos no constituye una defensa ante el tribunal.
    D: Sí, pero solo para infractores por primera vez.
  answer: C
  explanation: 'El manual establece explícitamente: "El uso de un medicamento de venta
    libre o un fármaco recetado no constituye una defensa ante el tribunal".'
- id: 116
  category: alcohol_drugs_health
  question: ¿Qué factores determinan la concentración de alcohol en el aliento (BrAC)
    de una persona?
  choices:
    A: La cantidad de alcohol consumida, el tiempo y el peso de la persona
    B: El tipo de alcohol consumido y la altura de la persona
    C: La edad y el género de la persona
    D: La cantidad de comida ingerida antes de beber
  answer: A
  explanation: El BrAC se determina por la cantidad de alcohol consumida, el tiempo
    requerido por el cuerpo para eliminar el alcohol y el peso de la persona.
- id: 117
  category: safe_driving_rules
  question: Según el manual, ¿cuál de las siguientes acciones es más probable que
    realice una persona que ha estado bebiendo?
  choices:
    A: Frenar demasiado pronto ante las señales de tráfico
    B: Conducir demasiado rápido o demasiado lento para las condiciones imperantes
    C: Mantener una posición estricta en el centro del carril
    D: Volverse excesivamente cauteloso en emergencias
  answer: B
  explanation: 'En pocas palabras, una persona que ha estado bebiendo es más probable
    que: conduzca demasiado rápido o demasiado lento para las condiciones imperantes;
    no permanezca en el centro del carril; tarde demasiado en frenar; y pierda el
    estado de alerta y la adaptabilidad en emergencias.'
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de combinar alcohol y otras drogas en el cuerpo?
  choices:
    A: Las drogas anulan los efectos del alcohol.
    B: El riesgo de tener un accidente de tráfico se vuelve aún mayor.
    C: Es seguro siempre que las drogas sean recetadas por un médico.
    D: Solo afecta su conducción si toma drogas ilegales.
  answer: B
  explanation: Cuando el alcohol y otras drogas se combinan en el cuerpo, el riesgo
    de tener un accidente de tráfico se vuelve aún mayor, ya que las drogas pueden
    aumentar los efectos del alcohol.
- id: 119
  category: penalties_and_points
  question: ¿Cuál es la sanción por negarse a someterse a una prueba química si está
    involucrado en un accidente de vehículo motorizado fatal?
  choices:
    A: Una suspensión de la licencia por 6 meses
    B: Una suspensión de la licencia por 1 año
    C: Una multa de $500 y ninguna suspensión
    D: Revocación permanente de su licencia
  answer: B
  explanation: Todo conductor involucrado en un accidente de vehículo motorizado fatal
    debe someterse a una prueba química. No hacerlo resultará en una suspensión de
    la licencia por un año.
- id: 120
  category: alcohol_drugs_health
  question: Según el manual, ¿cómo afecta el alcohol al cuerpo humano?
  choices:
    A: Actúa como un estimulante para mejorar los reflejos.
    B: Es un depresor que adormece el cerebro.
    C: Aumenta su capacidad para juzgar el tiempo y el espacio.
    D: Solo afecta al cuerpo si se consume con medicamentos recetados.
  answer: B
  explanation: Aunque una o dos bebidas pueden hacer que algunas personas se sientan
    más animadas, el alcohol es un depresor y cuanto más se ingiere, más se adormece
    el cerebro.
- id: 121
  category: penalties_and_points
  question: ¿Si es condenado por homicidio vehicular y estaba bajo la influencia de
    sustancias embriagantes al momento de la infracción, qué sucederá con su licencia
    de conducir?
  choices:
    A: Será suspendida por 1 año.
    B: Será revocada por 5 años.
    C: Será revocada permanentemente.
    D: Será suspendida hasta que complete un curso de educación sobre el alcohol.
  answer: C
  explanation: Si estaba bajo la influencia de sustancias embriagantes al momento
    de una infracción de homicidio vehicular, su licencia será revocada permanentemente.
- id: 122
  category: safe_driving_rules
  question: ¿Si su vehículo no tiene maletero (baúl), dónde es legal llevar un recipiente
    de bebida alcohólica abierto?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: Detrás del último asiento vertical o en un área que no esté ocupada normalmente
    D: En el portavasos de la consola central
  answer: C
  explanation: Una excepción a la Ley de Recipientes Abiertos (Open Container Law)
    permite un recipiente abierto en un vehículo sin maletero si se encuentra detrás
    del último asiento vertical o en un área que no esté ocupada normalmente por el
    conductor o el pasajero.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cómo pueden las anfetaminas afectar su capacidad para conducir?
  choices:
    A: Mejoran permanentemente su concentración.
    B: Disminuyen su capacidad de concentración y pueden causar alucinaciones.
    C: Reducen su presión arterial y cortan el oxígeno al cerebro.
    D: Mejoran su capacidad para juzgar el tiempo y el espacio.
  answer: B
  explanation: Las anfetaminas pueden disminuir la capacidad de concentración y causar
    alucinaciones. Cuando el efecto desaparece, es probable que la persona se sienta
    muy cansada y deprimida.
- id: 124
  category: penalties_and_points
  question: Según el manual, ¿aproximadamente cuánto podría costarle a un conductor
    una bebida por encima del límite legal en gastos totales de OUI?
  choices:
    A: $500
    B: $2,000
    C: $4,000
    D: Más de $7,000
  answer: D
  explanation: Operar bajo la influencia (OUI) es costoso; de hecho, una bebida por
    encima del límite legal podría costar mucho más de $7,000 (estimado específicamente
    en $7,240.00).
- id: 125
  category: license_system
  question: ¿Cómo clasifica la ley de Maine las licencias de conducir de personas
    menores de 21 años con respecto a las leyes de OUI?
  choices:
    A: Se consideran sin restricciones.
    B: Se consideran provisionales y están sujetas a suspensión inmediata.
    C: Están exentos de pruebas químicas.
    D: Solo son válidas para conducir hacia y desde el trabajo.
  answer: B
  explanation: Con respecto a las leyes de OUI de Maine, todas las licencias emitidas
    a menores (personas menores de 21 años) se consideran provisionales y están sujetas
    a suspensión inmediata hasta que la persona cumpla los 21 años.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál es la principal causa de muerte para los jóvenes de 16 a 24 años
    en los Estados Unidos?
  choices:
    A: Sobredosis de drogas
    B: Accidentes automovilísticos relacionados con el alcohol
    C: Accidentes por conducción distraída
    D: Insuficiencia cardíaca
  answer: B
  explanation: La principal causa de muerte para los jóvenes en los Estados Unidos
    (de 16 a 24 años) son los accidentes automovilísticos relacionados con el alcohol.
- id: 127
  category: penalties_and_points
  question: Si se descubre a un conductor menor de 21 años operando un vehículo motorizado
    con cualquier cantidad de alcohol en la sangre, ¿cuál es el período mínimo de
    suspensión de la licencia?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 5 años
  answer: C
  explanation: Si alguna vez se descubre que está operando un vehículo motorizado
    con cualquier cantidad de alcohol en la sangre (o se niega a someterse a la prueba),
    perderá su licencia de conducir por al menos un año.
- id: 128
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias es legal que una persona menor de 21 años transporte
    alcohol en un vehículo motorizado?
  choices:
    A: Si el alcohol está en un recipiente sellado en el maletero.
    B: Si están acompañados por un amigo mayor de 21 años.
    C: En el ámbito del empleo o a petición de un padre o tutor.
    D: Nunca es legal bajo ninguna circunstancia.
  answer: C
  explanation: Es ilegal que una persona menor de 21 años transporte alcohol en un
    vehículo motorizado, a menos que sea en el ámbito de su empleo o a petición de
    un padre o tutor.
- id: 129
  category: driver_responsibility
  question: ¿Cómo debe manejar las emociones fuertes como la ira o la preocupación
    antes de conducir?
  choices:
    A: Conducir más rápido para llegar antes a su destino.
    B: Dar un paseo corto o una siesta y mantenerse fuera de la carretera hasta que
      se sienta en control.
    C: Escuchar música a todo volumen para distraerse mientras conduce.
    D: Tomar un medicamento calmante de venta libre justo antes de conducir.
  answer: B
  explanation: Las emociones pueden afectar su capacidad para pensar, ver y responder.
    Las formas de lidiar con las emociones incluyen darse tiempo para calmarse, dar
    un paseo corto o una siesta, y mantenerse fuera de la carretera hasta que se sienta
    con más control.
- id: 130
  category: penalties_and_points
  question: ¿Cuál es una consecuencia potencial si es arrestado por operar bajo la
    influencia (OUI) o por operar después de la suspensión por un OUI anterior?
  choices:
    A: Se le pedirá que vuelva a tomar su examen de manejo de inmediato.
    B: Su vehículo está sujeto a incautación.
    C: Solo recibirá una advertencia por la primera infracción.
    D: Sus tarifas de seguro disminuirán.
  answer: B
  explanation: Una persona arrestada por operar bajo la influencia (OUI) o por operar
    después de la suspensión si la suspensión fue por una infracción de OUI anterior
    está sujeta a la incautación del vehículo y al pago de las tarifas de remolque
    y almacenamiento.
- id: 131
  category: safe_driving_rules
  question: ¿Cuál de las siguientes situaciones es una excepción a la Ley de Envase
    Abierto (Open Container Law)?
  choices:
    A: Un pasajero consumiendo alcohol en el asiento delantero de un automóvil personal.
    B: Un pasajero consumiendo alcohol en las áreas de vivienda de una casa rodante.
    C: El conductor consumiendo alcohol mientras está estacionado en una vía pública.
    D: Un pasajero que posee un envase abierto en un taxi.
  answer: B
  explanation: Las excepciones a la Ley de Envase Abierto incluyen a un pasajero que
    posee un envase de bebida alcohólica abierto o que consume alcohol en las áreas
    de vivienda de una casa rodante, remolque, semirremolque o casa rodante sobre
    camioneta (truck camper).
- id: 132
  category: driver_responsibility
  question: ¿Quién comparte la decisión sobre si usted puede conducir de manera segura
    si tiene una condición médica a largo plazo?
  choices:
    A: Su médico de atención primaria
    B: La Oficina de Vehículos Motorizados (Bureau of Motor Vehicles)
    C: Su compañía de seguros
    D: El departamento de policía local
  answer: B
  explanation: Según el manual, en el caso de condiciones a largo plazo que podrían
    afectar su conducción, la Oficina de Vehículos Motorizados compartirá la decisión
    de si usted puede conducir de manera segura.
- id: 133
  category: driver_testing
  question: ¿Qué se puede requerir si su condición médica ha cambiado o si ha comenzado
    a usar equipo especial?
  choices:
    A: Un examen escrito
    B: Una evaluación de conducción
    C: Un nuevo registro del vehículo
    D: Solo un examen de la vista
  answer: B
  explanation: Si su condición médica ha cambiado, o si ha comenzado a usar equipo
    especial, se puede requerir una evaluación de conducción para determinar sus habilidades
    de manejo.
- id: 134
  category: vehicle_information
  question: ¿Cuánto espacio debe dejar entre su pecho y el volante para permitir el
    despliegue seguro de la bolsa de aire (airbag)?
  choices:
    A: 5 pulgadas
    B: 10 pulgadas
    C: 12 pulgadas
    D: 15 pulgadas
  answer: B
  explanation: El manual establece que se deben dejar 10 pulgadas entre el pecho y
    el volante debido a la bolsa de aire.
- id: 135
  category: safe_driving_rules
  question: ¿Dónde debe colocarse la parte superior del volante en relación con su
    cuerpo?
  choices:
    A: Por encima del nivel de su barbilla
    B: No más arriba de sus hombros, pero por debajo del nivel de su barbilla
    C: A la altura de sus ojos
    D: Por debajo del nivel de su pecho
  answer: B
  explanation: La parte superior del volante no debe estar más arriba de sus hombros,
    pero también debe estar por debajo del nivel de su barbilla.
- id: 136
  category: vehicle_information
  question: ¿Cómo debe posicionar su cabeza para ajustar correctamente el espejo lateral
    izquierdo?
  choices:
    A: Inclínese hacia la derecha para que su cabeza quede debajo del espejo retrovisor
    B: Apoye su cabeza contra la ventana izquierda cerrada
    C: Siéntese perfectamente derecho y mire a la izquierda
    D: Gire la cabeza para mirar por encima de su hombro izquierdo
  answer: B
  explanation: Para ajustar el espejo lateral izquierdo, apoye la cabeza contra la
    ventana izquierda cerrada y ajuste el espejo de modo que apenas pueda ver el borde
    trasero izquierdo de su vehículo.
- id: 137
  category: safe_driving_rules
  question: 'Si usa tanto el cinturón de regazo como la correa del hombro, sus probabilidades
    de sobrevivir a una colisión son:'
  choices:
    A: Aproximadamente el doble de buenas
    B: De tres a cuatro veces mejores
    C: De cinco a seis veces mejores
    D: Diez veces mejores
  answer: B
  explanation: Si usa tanto el cinturón de regazo como la correa del hombro, sus probabilidades
    de salir con vida de una colisión son de tres a cuatro veces mejores.
- id: 138
  category: defensive_driving
  question: 'Estar en una colisión a 30 MPH sin usar el cinturón de seguridad equivale
    a golpear el suelo desde la parte superior de un:'
  choices:
    A: Edificio de dos pisos
    B: Edificio de tres pisos
    C: Edificio de cuatro pisos
    D: Edificio de cinco pisos
  answer: B
  explanation: Si no usa los cinturones de seguridad y tiene una colisión a 30 MPH,
    es como golpear el suelo desde la parte superior de un edificio de tres pisos.
- id: 139
  category: safe_driving_rules
  question: ¿Cómo debe ajustarse el arnés de hombro de un cinturón de seguridad?
  choices:
    A: Colocado debajo del brazo para mayor comodidad
    B: Colocado detrás de la espalda si le roza el cuello
    C: Ajustado pero lo suficientemente flojo como para que quepa su puño entre el
      cinturón y su pecho
    D: Lo más apretado posible a través de la clavícula
  answer: C
  explanation: Ajuste la correa del hombro para que quede firme pero lo suficientemente
    floja como para que quepa su puño entre el cinturón y su pecho. No debe ir debajo
    del brazo ni detrás de la espalda.
- id: 140
  category: safe_driving_rules
  question: ¿Dónde debe descansar el cinturón de regazo en su cuerpo?
  choices:
    A: A través de su estómago
    B: En la parte alta de su cintura
    C: A través de sus muslos
    D: Debajo de su estómago y sobre los huesos de la cadera
  answer: D
  explanation: Mantenga el cinturón de regazo apretado, pero cómodo, a través de su
    regazo y caderas. Asegúrese de que esté debajo de su estómago y descanse sobre
    los huesos de su cadera.
- id: 141
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el lugar más seguro para que viaje un niño de
    cualquier edad?
  choices:
    A: El asiento del pasajero delantero
    B: El asiento trasero
    C: El asiento delantero central
    D: Cualquier asiento con una bolsa de aire (airbag) activa
  answer: B
  explanation: El manual establece que el asiento trasero es el lugar más seguro para
    que viaje un niño de cualquier edad.
- id: 142
  category: safe_driving_rules
  question: ¿Cómo deben viajar los bebés menores de 2 años en un vehículo?
  choices:
    A: En el asiento delantero mirando hacia adelante
    B: En el asiento trasero mirando hacia adelante
    C: En el asiento trasero mirando hacia atrás
    D: En el asiento delantero mirando hacia atrás
  answer: C
  explanation: Los bebés menores de 2 años siempre deben viajar en el asiento trasero
    mirando hacia atrás.
- id: 143
  category: safe_driving_rules
  question: ¿Qué es lo que NUNCA debe hacer con respecto a un asiento de seguridad
    para niños orientado hacia atrás?
  choices:
    A: Colocarlo en el asiento trasero de un sedán
    B: Colocarlo frente a una bolsa de aire (airbag) del pasajero activa
    C: Asegurarlo usando los cinturones de seguridad del vehículo
    D: Usarlo para un bebé menor de 2 años
  answer: B
  explanation: Nunca coloque un asiento de seguridad para niños orientado hacia atrás
    frente a una bolsa de aire (airbag) del pasajero activa, ya que los niños cerca
    de las bolsas de aire corren riesgo.
- id: 144
  category: vehicle_information
  question: ¿Dónde debe hacer contacto el reposacabezas con la parte posterior de
    su cabeza?
  choices:
    A: En la base del cuello
    B: Por debajo del nivel de las orejas
    C: Por encima del nivel de las orejas
    D: En la parte superior de la cabeza
  answer: C
  explanation: El reposacabezas debe hacer contacto con la parte posterior de su cabeza
    por encima del nivel de las orejas.
- id: 145
  category: defensive_driving
  question: Estadísticamente, ¿cuál es la probabilidad de que cada ciudadano sufra
    un accidente grave en su vida?
  choices:
    A: Una de cada dos
    B: Una de cada tres
    C: Una de cada cuatro
    D: Una de cada cinco
  answer: B
  explanation: Estadísticamente, cada ciudadano tiene una probabilidad de una entre
    tres de sufrir un accidente grave en su vida.
- id: 146
  category: safe_driving_rules
  question: ¿Quién debe sentarse lo más lejos posible del volante o del tablero debido
    a los riesgos de la bolsa de aire (airbag)?
  choices:
    A: Solo los niños menores de 12 años
    B: Solo los conductores de camiones grandes
    C: Todos los conductores o pasajeros del asiento delantero, especialmente los
      de baja estatura, embarazadas o ancianos
    D: Solo los pasajeros que no llevan puesto el cinturón de seguridad
  answer: C
  explanation: Todos los conductores o pasajeros del asiento delantero, especialmente
    los de baja estatura, embarazadas o ancianos, deben sentarse lo más lejos posible
    del volante o del tablero para minimizar los riesgos de la bolsa de aire (airbag).
- id: 147
  category: safe_driving_rules
  question: ¿Cuál es el requisito para transportar a un niño que pesa menos de 55
    libras en un vehículo motorizado?
  choices:
    A: Deben estar asegurados con un cinturón de seguridad estándar.
    B: Deben estar debidamente asegurados en un asiento de seguridad para niños.
    C: Pueden sentarse en el asiento delantero sin un sistema de retención.
    D: Deben ser sostenidos por un pasajero adulto.
  answer: B
  explanation: Según el manual, cuando se transporta a un niño que pesa menos de 55
    libras, el conductor debe tener al niño debidamente asegurado en un asiento de
    seguridad para niños.
- id: 148
  category: safe_driving_rules
  question: Según la ley de Maine, ¿qué niños deben estar debidamente asegurados en
    el asiento trasero de un vehículo, si es posible?
  choices:
    A: Niños menores de 12 años y que pesen menos de 100 libras.
    B: Niños menores de 8 años y que pesen menos de 80 libras.
    C: Niños menores de 15 años.
    D: Todos los niños menores de 18 años.
  answer: A
  explanation: El manual establece que el conductor debe asegurarse de que un niño
    menor de 12 años y que pese menos de 100 libras esté debidamente asegurado en
    el asiento trasero de un vehículo, si es posible.
- id: 149
  category: safe_driving_rules
  question: ¿Cuál de las siguientes personas está exenta del requisito de usar cinturón
    de seguridad mientras desempeña sus funciones?
  choices:
    A: Un conductor de autobús escolar.
    B: Un cartero rural del Servicio Postal de los Estados Unidos mientras entrega
      el correo.
    C: Un adolescente que conduce a la escuela.
    D: Un pasajero en un vehículo personal.
  answer: B
  explanation: El manual enumera excepciones a la ley del cinturón de seguridad, incluyendo
    a un cartero rural del Servicio Postal de los Estados Unidos que no está obligado
    a estar asegurado con un cinturón de seguridad mientras se dedica a la entrega
    de correo.
- id: 150
  category: vehicle_information
  question: Al arrancar el motor de un vehículo, ¿qué debe hacer inmediatamente después
    de girar el interruptor de encendido a la posición de arranque y encender el motor?
  choices:
    A: Encender las luces altas.
    B: Poner la marcha atrás (reversa).
    C: Encender las luces bajas y cerrar las puertas con seguro.
    D: Presionar el acelerador hasta el fondo.
  answer: C
  explanation: El manual instruye a los conductores a girar el interruptor de encendido
    a la posición de arranque (encender el motor), encender las luces bajas y cerrar
    las puertas con seguro.
- id: 151
  category: vehicle_information
  question: ¿En un vehículo de transmisión manual, qué es el "punto de fricción"?
  choices:
    A: El punto donde las pastillas de freno se encuentran con los rotores.
    B: El punto en el que el motor y la transmisión se acoplan al soltar el pedal
      del embrague (clutch).
    C: El punto donde los neumáticos pierden tracción en una carretera resbaladiza.
    D: El punto en el que el acelerador se presiona hasta el fondo.
  answer: B
  explanation: El manual define el punto de fricción como el punto en el que, al soltar
    el pedal del embrague (clutch), el motor y la transmisión se acoplan.
- id: 152
  category: safe_driving_rules
  question: ¿Qué marcha se recomienda para arrancar un vehículo de transmisión manual
    sobre hielo o nieve espesa?
  choices:
    A: Primera marcha
    B: Segunda marcha
    C: Tercera marcha
    D: Cuarta marcha
  answer: B
  explanation: Según el manual, se puede utilizar la segunda marcha para arrancar
    sobre hielo o conducir en nieve espesa.
- id: 153
  category: defensive_driving
  question: 'Al conducir un vehículo de transmisión manual en una pendiente descendente,
    debe reducir la marcha para frenar el automóvil EXCEPTO cuando:'
  choices:
    A: La carretera está resbaladiza.
    B: Se está aproximando a una señal de alto.
    C: Necesita maniobrar el volante con eficacia.
    D: Está intentando ganar potencia.
  answer: A
  explanation: El manual establece que una razón para reducir la marcha es frenar
    el automóvil en una pendiente descendente, excepto cuando la carretera está resbaladiza.
- id: 154
  category: sharing_the_road
  question: ¿Cómo debe señalar su intención al conductor que viene detrás si va a
    detenerse o reducir la velocidad inesperadamente?
  choices:
    A: Encender las luces de emergencia.
    B: Tocar la bocina tres veces.
    C: Presionar el pedal del freno tres o cuatro veces rápidamente.
    D: Sacar la mano por la ventana.
  answer: C
  explanation: Si va a detenerse o reducir la velocidad en un lugar donde otro conductor
    no lo espera, el manual aconseja presionar el pedal del freno tres o cuatro veces
    rápidamente para señalar su intención al conductor que viene detrás.
- id: 155
  category: safe_driving_rules
  question: Para evitar lesiones por el despliegue de una bolsa de aire (air bag)
    y mantener el mejor control, ¿dónde debe colocar las manos en el volante?
  choices:
    A: A las 10 y a las 2
    B: A las 9 y a las 3, o a las 8 y a las 4
    C: A las 12 y a las 6
    D: Solo en la posición de las 6 en punto
  answer: B
  explanation: El manual instruye a los conductores a poner las manos a las 9 y a
    las 3, o a las 8 y a las 4, para evitar lesiones por el despliegue de una bolsa
    de aire y para un mejor control.
- id: 156
  category: vehicle_information
  question: ¿Cuál de las siguientes es una técnica correcta para sujetar el volante?
  choices:
    A: Sujetar el interior del volante para mantener un mejor control.
    B: Usar las palmas de las manos al maniobrar el volante.
    C: Mantener los pulgares metidos dentro del volante.
    D: Mantener los pulgares hacia arriba a lo largo de la cara del volante.
  answer: D
  explanation: El manual indica que debe usar los dedos, no las palmas de las manos,
    mantener los pulgares hacia arriba a lo largo de la cara del volante y nunca sujetar
    el interior del volante al conducir.
- id: 157
  category: safe_driving_rules
  question: Al retroceder un vehículo, ¿dónde debe colocar la mano izquierda en el
    volante?
  choices:
    A: A las 9 en punto
    B: A las 6 en punto
    C: A las 12 en punto
    D: A las 3 en punto
  answer: C
  explanation: Al retroceder, el manual instruye sujetar el volante a las 12 en punto
    con la mano izquierda.
- id: 158
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima recomendada al retroceder un vehículo?
  choices:
    A: 10 millas por hora
    B: 5 millas por hora
    C: No más rápido que una caminata lenta
    D: La misma velocidad que el ralentí hacia adelante
  answer: C
  explanation: El manual establece explícitamente retroceder despacio y "no retroceder
    más rápido que una caminata lenta".
- id: 159
  category: driver_responsibility
  question: Para conservar combustible y reducir la contaminación, ¿cuánto tiempo
    como máximo debe dejar el motor en ralentí al detenerse o arrancar?
  choices:
    A: Un minuto
    B: Tres minutos
    C: Cinco minutos
    D: Diez minutos
  answer: A
  explanation: 'El manual establece: "Cuando detenga o arranque el automóvil, no lo
    deje en ralentí por más de un minuto".'
- id: 160
  category: vehicle_information
  question: ¿Cuál es la forma más eficiente de calentar el motor de un automóvil?
  choices:
    A: Dejar el motor en ralentí durante al menos cinco minutos.
    B: Acelerar el motor mientras está en posición de estacionamiento (P).
    C: Conducir lentamente durante los primeros minutos.
    D: Encender la calefacción al máximo antes de conducir.
  answer: C
  explanation: Según el manual, "conducir lentamente durante los primeros minutos
    es una forma más eficiente de calentar el motor".
- id: 161
  category: defensive_driving
  question: ¿Por qué no debe depender únicamente de sus espejos o de una cámara de
    reversa al retroceder?
  choices:
    A: Consumen demasiada energía de la batería.
    B: No muestran el área directamente detrás de su vehículo y proporcionan una visión
      limitada.
    C: Es ilegal usarlos mientras el vehículo está en reversa.
    D: Distorsionan la distancia de los objetos detrás de usted.
  answer: B
  explanation: El manual advierte que sus espejos no muestran el área directamente
    detrás de su vehículo y que una cámara de reversa proporciona una visión limitada,
    por lo que no debe depender únicamente de ellos al retroceder.
- id: 162
  category: vehicle_information
  question: ¿Cuánta gasolina consume el automóvil promedio cuando está en ralentí
    (marcha en vacío) durante seis minutos?
  choices:
    A: Un galón
    B: Una taza
    C: Una pinta
    D: Un cuarto de galón
  answer: B
  explanation: Según el manual, el automóvil promedio consume una taza de gasolina
    cada seis minutos cuando está en ralentí.
- id: 163
  category: safe_driving_rules
  question: Si dos vehículos llegan al mismo tiempo a una parada de cuatro vías (four-way
    stop) uno al lado del otro, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que va derecho
    D: El conductor que señaliza primero
  answer: B
  explanation: El conductor a su derecha en una parada de cuatro vías tiene el derecho
    de paso si ambos llegan al mismo tiempo uno al lado del otro.
- id: 164
  category: safe_driving_rules
  question: Al entrar en una glorieta o rotonda, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que entra a la glorieta
    B: El vehículo que ya está en la glorieta
    C: El vehículo a la derecha
    D: El vehículo más grande
  answer: B
  explanation: Al entrar en una glorieta, el vehículo que ya se encuentra en ella
    tiene el derecho de paso.
- id: 165
  category: penalties_and_points
  question: ¿Cuál es la sanción por no ceder el paso y detenerse ante un vehículo
    de emergencia que se aproxima haciendo sonar una sirena y emitiendo una luz intermitente?
  choices:
    A: Un delito de Clase E
    B: Un delito de Clase D
    C: Una infracción de tráfico con una multa de $50
    D: Una suspensión de la licencia por 30 días
  answer: A
  explanation: Debe dirigirse inmediatamente al lado derecho de la calzada y detenerse
    ante un vehículo de emergencia. No hacerlo es un delito de Clase E.
- id: 166
  category: sharing_the_road
  question: Al girar a la izquierda, ¿a quiénes de los siguientes que se aproximan
    en dirección opuesta debe cederles el paso?
  choices:
    A: Solo a otros vehículos motorizados
    B: Solo a peatones
    C: A ciclistas y operadores de esquí de ruedas (roller ski)
    D: Solo a vehículos de emergencia
  answer: C
  explanation: Los operadores de vehículos motorizados que giran a la izquierda deben
    ceder el paso a los ciclistas y operadores de esquí de ruedas que se aproximan
    en dirección opuesta.
- id: 167
  category: safe_driving_rules
  question: ¿Es legal conducir un vehículo motorizado a través de un área de estacionamiento
    para evitar un dispositivo de control de tráfico?
  choices:
    A: Sí, si la intersección está congestionada.
    B: Sí, pero solo durante las horas del día.
    C: No, un operador no puede conducir a través de un área de estacionamiento para
      evitar obedecer un dispositivo de control de tráfico.
    D: No, a menos que lo indique un pasajero.
  answer: C
  explanation: Un operador no puede conducir un vehículo motorizado a través de un
    área de estacionamiento para evitar obedecer los requisitos de un dispositivo
    de control de tráfico.
- id: 168
  category: signs_and_signals
  question: Si los semáforos están dispuestos horizontalmente, ¿cuál es el orden correcto
    de los colores de izquierda a derecha?
  choices:
    A: Verde, amarillo, rojo
    B: Rojo, amarillo, verde
    C: Amarillo, rojo, verde
    D: Rojo, verde, amarillo
  answer: B
  explanation: Si los semáforos son horizontales, la luz roja está a la izquierda,
    la luz amarilla en el medio y la luz verde a la derecha.
- id: 169
  category: signs_and_signals
  question: ¿Qué indica una luz de tráfico amarilla intermitente?
  choices:
    A: Deténgase y mire a ambos lados antes de entrar en la intersección.
    B: La luz está a punto de cambiar a rojo.
    C: Reduzca la velocidad y proceda con precaución.
    D: Debe esperar detrás de la línea de parada hasta que la luz cambie a verde.
  answer: C
  explanation: Una luz de tráfico AMARILLA intermitente significa reducir la velocidad
    y proceder con precaución, y estar preparado para detenerse ante cualquier tráfico.
- id: 170
  category: signs_and_signals
  question: ¿Qué significa una flecha roja fija en un semáforo?
  choices:
    A: Puede girar en la dirección de la flecha después de detenerse por completo.
    B: El tráfico que realiza el giro indicado por la flecha debe detenerse hasta
      que la flecha cambie a verde.
    C: Puede avanzar con precaución en la dirección de la flecha, cediendo el paso
      a todo el tráfico.
    D: El carril está cerrado y debe incorporarse a otro carril.
  answer: B
  explanation: Una flecha roja fija significa que el tráfico que realiza el giro indicado
    por la flecha debe detenerse hasta que la flecha cambie a verde.
- id: 171
  category: signs_and_signals
  question: ¿Qué indica una 'X' amarilla intermitente en una luz de control de uso
    de carril elevada?
  choices:
    A: No conduzca en este carril.
    B: Despeje este carril, la señal está a punto de cambiar a rojo.
    C: Este carril solo puede usarse para girar a la izquierda.
    D: Puede usar este carril para seguir recto.
  answer: C
  explanation: Una 'X' amarilla intermitente indica que este carril solo puede usarse
    para girar a la izquierda.
- id: 172
  category: signs_and_signals
  question: ¿Cuál es la forma y el color general de una señal de advertencia?
  choices:
    A: Redonda y amarilla con letras negras
    B: En forma de diamante y amarilla con letras o símbolos negros
    C: Rectangular y naranja con letras negras
    D: En forma de octágono y roja con letras blancas
  answer: B
  explanation: Las señales de advertencia advierten sobre peligros más adelante. Por
    lo general, tienen forma de diamante y suelen ser amarillas con letras o símbolos
    negros.
- id: 173
  category: signs_and_signals
  question: ¿Qué indica una señal de color naranja en forma de diamante o rectangular
    con letras o símbolos negros?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Una zona escolar
    C: Una zona de obras con personas trabajando en la carretera o cerca de ella
    D: Una zona de no rebasar
  answer: C
  explanation: Las señales de zona de obras son señales de color naranja en forma
    de diamante o rectangulares con letras o símbolos negros. Estas señales le advierten
    sobre zonas de obras y personas trabajando en la carretera o cerca de ella.
- id: 174
  category: safe_driving_rules
  question: Si dos autos se aproximan a una intersección al mismo tiempo desde direcciones
    opuestas y un conductor está señalizando un giro, ¿quién tiene el derecho de paso?
  choices:
    A: El auto que realiza el giro
    B: El auto que sigue recto
    C: El auto a la derecha
    D: El auto que llegó un poco más tarde
  answer: B
  explanation: Si dos autos se aproximan a una intersección al mismo tiempo desde
    direcciones opuestas y un conductor está señalizando un giro, el derecho de paso
    pertenece al auto que sigue recto.
- id: 175
  category: safe_driving_rules
  question: Si debe detenerse por el tráfico o una señal cerca de un cruce de ferrocarril,
    ¿dónde debe esperar?
  choices:
    A: Sobre las vías si la barrera está levantada
    B: En la línea de parada antes de las vías
    C: Justo después de las vías
    D: Tan cerca de las vías como sea posible sin tocarlas
  answer: B
  explanation: Si debe detenerse por el tráfico o una señal cerca de un cruce de ferrocarril,
    espere en la línea de parada antes de las vías (no sobre las vías).
- id: 176
  category: signs_and_signals
  question: ¿De qué forma y color son las señales de zona de obras?
  choices:
    A: Octágonos rojos y blancos
    B: Diamantes o rectángulos naranjas con letras negras
    C: Banderines amarillos con letras negras
    D: Rectángulos verdes con letras blancas
  answer: B
  explanation: Las señales de zona de obras son señales de color naranja en forma
    de diamante o rectangulares con letras o símbolos negros.
- id: 177
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceso de velocidad en una zona de obras?
  choices:
    A: Las multas se duplican.
    B: Su licencia se suspende por 30 días.
    C: Recibe una advertencia por la primera infracción.
    D: Las multas se triplican.
  answer: A
  explanation: Las multas por exceso de velocidad en una zona de obras se duplican.
- id: 178
  category: signs_and_signals
  question: ¿Qué indica una señal reglamentaria con un círculo rojo y una franja roja
    que cruza un símbolo?
  choices:
    A: Debe ceder el derecho de paso.
    B: Se está aproximando a una zona de obras.
    C: No puede realizar ciertas acciones.
    D: Debe detenerse por completo.
  answer: C
  explanation: Algunas señales reglamentarias tienen un círculo rojo con una franja
    roja que cruza el símbolo. Esto significa que no puede realizar ciertas acciones.
- id: 179
  category: safe_driving_rules
  question: ¿Dónde debe detenerse ante una señal de alto si no hay un paso de peatones
    o una línea de parada?
  choices:
    A: Directamente debajo de la señal de alto.
    B: En el punto más cercano a la intersección que le permita ver el tráfico que
      se aproxima.
    C: Diez pies antes de que comience la intersección.
    D: No necesita detenerse por completo si la carretera está despejada.
  answer: B
  explanation: Si no hay un paso de peatones o una línea de parada, deténgase en el
    punto más cercano a la intersección que le permita ver el tráfico que se aproxima
    por la vía transversal.
- id: 180
  category: signs_and_signals
  question: ¿Cuál es el uso adecuado de un carril central compartido?
  choices:
    A: Se utiliza para rebasar vehículos más lentos.
    B: Es un carril solo para vehículos que giran a la izquierda.
    C: Es un carril para el tráfico directo durante las horas pico.
    D: Es un carril de estacionamiento para vehículos de emergencia.
  answer: B
  explanation: Un carril central compartido marca un carril que es solo para vehículos
    que giran a la izquierda. No es para el tráfico directo ni para rebasar a otros
    vehículos.
- id: 181
  category: driver_responsibility
  question: ¿Cuál es la consecuencia de intentar huir o escapar de un oficial de policía
    que está dirigiendo el tráfico?
  choices:
    A: Se le requerirá tomar un curso de conducción defensiva.
    B: Puede perder su licencia.
    C: Recibirá una advertencia.
    D: Su vehículo será confiscado por 30 días.
  answer: B
  explanation: Puede perder su licencia por intentar huir o escapar de un oficial
    de policía.
- id: 182
  category: signs_and_signals
  question: ¿Qué colores se utilizan normalmente para las señales de guía que lo dirigen
    a ciudades, pueblos y puntos de interés?
  choices:
    A: Rojo, blanco y negro
    B: Naranja y negro
    C: Verde, marrón o azul
    D: Amarillo y verde
  answer: C
  explanation: Las señales de guía son cuadradas o rectangulares y son de color verde,
    marrón o azul. Le informan sobre carreteras que se cruzan, ayudan a dirigirlo
    a ciudades y pueblos, y marcan puntos de interés.
- id: 183
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal adelantar a otro vehículo motorizado por
    el lado derecho?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad en
      una carretera de dos carriles.
    B: Cuando el automóvil al que está adelantando está girando a la izquierda y hay
      espacio para que dos o más carriles se muevan en la misma dirección.
    C: Cuando está conduciendo fuera del pavimento o de la parte principal transitada
      de la calzada.
    D: Cuando se encuentra en un carril central compartido para girar.
  answer: B
  explanation: Nunca puede adelantar a otro vehículo motorizado por el lado derecho,
    excepto cuando el automóvil al que está adelantando está girando a la izquierda
    y hay espacio para que dos o más carriles se muevan en la misma dirección, o cuando
    el automóvil está en el carril izquierdo en una calle con dos o más carriles marcados
    que se mueven en la misma dirección.
- id: 184
  category: sharing_the_road
  question: En una sección de la autopista Maine Turnpike con tres carriles en cada
    dirección, ¿por dónde tienen restringido conducir los camiones grandes (excluyendo
    las camionetas pickup)?
  choices:
    A: Solo en el carril central.
    B: Solo en el carril del extremo izquierdo.
    C: Solo en los dos carriles situados más a la derecha.
    D: Pueden conducir por cualquier carril.
  answer: C
  explanation: En cualquier sección de la Maine Turnpike o de la Interestatal-95 que
    conste de tres carriles en cualquier dirección, los camiones, incluidos los tractocamiones,
    pero excluyendo las camionetas pickup, solo pueden circular por los dos carriles
    situados más a la derecha.
- id: 185
  category: defensive_driving
  question: ¿Por qué debe mantener las ruedas rectas mientras espera para girar a
    la izquierda en una intersección?
  choices:
    A: Evita que el líquido de la dirección asistida se sobrecaliente.
    B: Le permite acelerar más rápido cuando la luz cambia a verde.
    C: Si lo golpean por detrás, no será empujado hacia el tráfico que viene en sentido
      contrario.
    D: Indica a otros conductores que usted está cediendo el derecho de paso.
  answer: C
  explanation: No gire las ruedas antes de realizar el giro. Si lo golpean por detrás,
    podría ser empujado hacia el tráfico que viene en sentido contrario.
- id: 186
  category: safe_driving_rules
  question: ¿Qué debe hacer si ha comenzado a realizar un giro en una intersección
    pero se da cuenta de que cometió un error?
  choices:
    A: Detenerse inmediatamente y retroceder.
    B: Hacer un giro en U en medio de la intersección.
    C: Completar el giro y regresar desde la siguiente intersección.
    D: Poner su vehículo en reversa y regresar a su carril original.
  answer: C
  explanation: Si ha comenzado a realizar un giro, debe completarlo, ya que los cambios
    de último segundo pueden causar accidentes. Si ha cometido un error, continúe
    hasta la siguiente intersección y regrese al lugar donde quería ir.
- id: 187
  category: signs_and_signals
  question: ¿Cuál es la diferencia entre las líneas blancas continuas y las líneas
    blancas discontinuas pintadas en la calzada?
  choices:
    A: Las líneas continuas separan el tráfico que se mueve en direcciones opuestas,
      mientras que las líneas discontinuas separan el tráfico que se mueve en la misma
      dirección.
    B: Las líneas continuas desalientan el cambio de carril, mientras que las líneas
      discontinuas permiten cambios de carril seguros.
    C: Las líneas continuas indican una zona de adelantamiento, mientras que las líneas
      discontinuas indican una zona de no adelantar.
    D: Las líneas continuas solo se usan en zonas escolares, mientras que las líneas
      discontinuas se usan en autopistas.
  answer: B
  explanation: Las líneas blancas continuas pintadas en la calzada separan los carriles
    de tráfico que van en la misma dirección y que tienen diferentes usos. También
    desalientan el cambio de carril. Las líneas blancas discontinuas simplemente indican
    múltiples carriles que van en la misma dirección y permiten cambios de carril
    seguros.
- id: 188
  category: safe_driving_rules
  question: Al realizar un giro a la derecha, ¿en qué carril debe entrar?
  choices:
    A: El carril más a la izquierda en su dirección.
    B: El carril central.
    C: El carril más a la derecha en su dirección.
    D: Cualquier carril que esté libre de tráfico en ese momento.
  answer: C
  explanation: Al realizar un giro a la derecha, gire hacia el carril situado más
    a la derecha en su dirección.
- id: 189
  category: signs_and_signals
  question: ¿Qué indica una señal de ceder el paso (yield)?
  choices:
    A: Debe detenerse por completo independientemente del tráfico.
    B: Debe acelerar para incorporarse suavemente al tráfico.
    C: Debe reducir la velocidad para esperar a que el tráfico se despeje y ceder
      el paso al tráfico o a los peatones.
    D: Usted tiene el derecho de paso sobre todo el resto del tráfico.
  answer: C
  explanation: Una señal de ceder el paso significa que debe reducir la velocidad
    para esperar a que se despeje el tráfico en la carretera por la que va a entrar
    o cruzar. Debe reducir la velocidad y ceder el paso al tráfico o a los peatones
    que tengan el derecho de paso antes de continuar.
- id: 190
  category: penalties_and_points
  question: ¿Cuál es la sanción por no ceder el derecho de paso a un peatón con discapacidad
    visual?
  choices:
    A: Multa mínima de $25 y máxima de $500
    B: Multa mínima de $50 y máxima de $1,000
    C: Suspensión de la licencia por 30 días
    D: Multa mínima de $100 y máxima de $2,000
  answer: B
  explanation: Un conductor que no ceda el derecho de paso a un peatón con discapacidad
    visual es responsable de una infracción de tráfico con una multa mínima de $50
    y máxima de $1,000.
- id: 191
  category: sharing_the_road
  question: ¿Si ve a alguien en la calzada con un bastón blanco o un perro guía, a
    qué distancia mínima debe detenerse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: Si ve a alguien en la calzada con un bastón blanco o un perro guía,
    deténgase al menos a 10 pies de distancia y espere hasta que la persona esté fuera
    de peligro.
- id: 192
  category: signs_and_signals
  question: Al acercarse a un carril reversible, ¿qué indica una señal de X roja sobre
    el carril?
  choices:
    A: Puede usar el carril
    B: Debe ceder el paso al tráfico en sentido contrario
    C: No puede usar el carril
    D: El carril es solo para giros a la izquierda
  answer: C
  explanation: En un carril reversible, una flecha verde significa que puede usar
    el carril. Una X roja significa que no puede usar el carril.
- id: 193
  category: safe_driving_rules
  question: ¿Dónde debe detener su vehículo al acercarse a una intersección con una
    línea de parada pintada?
  choices:
    A: Justo después de la línea de parada
    B: Antes de la línea de parada pintada
    C: En medio del paso de peatones
    D: En el borde de la calzada que se cruza
  answer: B
  explanation: Las líneas de parada suelen estar pintadas en la calzada a cierta distancia
    de una intersección para dar a los peatones un camino para cruzar. Debe detener
    su automóvil antes de las líneas de parada pintadas.
- id: 194
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla correcta para realizar un giro a
    la derecha?
  choices:
    A: Abrirse hacia la izquierda antes de girar a la derecha
    B: Girar siempre a la derecha desde la parte más a la izquierda de su carril
    C: No abrirse hacia la izquierda antes de un giro a la derecha
    D: Acelerar rápidamente antes de entrar en el giro
  answer: C
  explanation: Al realizar un giro a la derecha, no debe abrirse hacia la izquierda
    antes de girar, y siempre debe girar a la derecha desde la parte más a la derecha
    de su carril.
- id: 195
  category: safe_driving_rules
  question: 'Al girar desde una calzada con múltiples carriles de giro a la izquierda
    o a la derecha, usted debe:'
  choices:
    A: Cambiar de carril mientras está en medio de la intersección
    B: Entrar en el mismo carril desde el que está girando y permanecer en él hasta
      terminar
    C: Girar siempre hacia el carril del extremo derecho independientemente de su
      carril de inicio
    D: Ceder el paso a los vehículos en el carril de giro adyacente e incorporarse
      a su carril
  answer: B
  explanation: Al circular por múltiples carriles de giro a la izquierda o a la derecha,
    debe entrar en el mismo carril desde el que está girando y permanecer en ese carril
    hasta que termine el giro.
- id: 196
  category: defensive_driving
  question: Antes de avanzar después de una parada en una intersección, ¿en qué orden
    debe verificar el tráfico?
  choices:
    A: Mirar a la derecha, luego a la izquierda, luego a la derecha otra vez
    B: Mirar a la izquierda, luego a la derecha, luego a la izquierda otra vez
    C: Mirar hacia adelante, luego a la izquierda, luego a la derecha
    D: Mirar por el espejo retrovisor, luego a la izquierda
  answer: B
  explanation: Antes de avanzar después de una parada, verifique el tráfico y los
    ciclistas. Mire a la izquierda, luego a la derecha y luego a la izquierda otra
    vez antes de entrar en la intersección.
- id: 197
  category: defensive_driving
  question: ¿Por qué debe evitar girar hacia un carril solo porque un vehículo que
    viene en sentido contrario tiene encendida su luz de giro?
  choices:
    A: Las luces de giro suelen ser difíciles de ver a la luz del día
    B: El conductor puede planear girar después de pasarle a usted o puede haber olvidado
      apagar la señal
    C: Los vehículos que vienen en sentido contrario siempre tienen el derecho de
      paso incluso si están girando
    D: La ley exige que espere hasta que haya pasado todo el tráfico en sentido contrario
  answer: B
  explanation: No gire hacia un carril solo porque un vehículo que viene en sentido
    contrario tenga una luz de giro encendida. El conductor puede planear girar después
    de pasarle a usted o puede haber olvidado apagar su señal.
- id: 198
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso en una glorieta o rotonda?
  choices:
    A: Los vehículos que entran en la glorieta
    B: Los vehículos que ya están en la glorieta
    C: Los vehículos que se acercan por la derecha
    D: Los vehículos que viajan a velocidades más altas
  answer: B
  explanation: Todos los vehículos que se acerquen a glorietas o rotondas deben ceder
    el derecho de paso a los vehículos que ya se encuentren en la glorieta o rotonda,
    a menos que un oficial de policía o dispositivos de control de tráfico indiquen
    lo contrario.
- id: 199
  category: safe_driving_rules
  question: 'En las grandes glorietas, llamadas rotondas (rotaries), los conductores
    deben ceder el derecho de paso a:'
  choices:
    A: Un vehículo a la derecha del conductor
    B: Un vehículo a la izquierda del conductor
    C: Solo a los peatones
    D: Los vehículos que entran en la rotonda
  answer: B
  explanation: En las grandes glorietas, llamadas rotondas (rotaries), los vehículos
    avanzan hacia la derecha o en sentido contrario a las agujas del reloj alrededor
    de la isla central. Los conductores deben ceder el derecho de paso a un vehículo
    que esté a la izquierda del conductor.
- id: 200
  category: safe_driving_rules
  question: ¿Cómo debe salir de una glorieta o rotonda?
  choices:
    A: Realizando un giro a la izquierda
    B: Deteniéndose y esperando un espacio
    C: Realizando un giro a la derecha
    D: Acelerando rápidamente en línea recta
  answer: C
  explanation: La salida de la glorieta o rotonda se realiza haciendo un giro a la
    derecha.
- id: 201
  category: safe_driving_rules
  question: ¿Al cambiar de carril, con cuánta anticipación debe señalizar siempre
    su intención antes de realizar el cambio?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Siempre señalice lo que pretende hacer al menos 100 pies antes de realizar
    un cambio.
- id: 202
  category: defensive_driving
  question: ¿Por qué debe girar la cabeza y mirar por encima del hombro al cambiar
    de carril?
  choices:
    A: Para verificar la velocidad de su vehículo
    B: Para asegurarse de que su luz de giro esté funcionando
    C: Para revisar las áreas no cubiertas por los espejos retrovisores y laterales
    D: Para comunicarse con otros conductores
  answer: C
  explanation: Los puntos ciegos son áreas alrededor de su vehículo causadas por los
    reposacabezas y los pilares de las puertas que bloquean su visión. No están cubiertos
    por sus espejos, por lo que debe girar la cabeza y mirar por encima del hombro.
- id: 203
  category: safe_driving_rules
  question: ¿Cuál es el propósito del carril de aceleración al entrar en una autopista?
  choices:
    A: Proporcionar un lugar para estacionar en caso de emergencia
    B: Permitirle alcanzar la velocidad del tráfico antes de incorporarse
    C: Permitir que los vehículos que salen reduzcan la velocidad
    D: Evitar el tráfico pesado en la calzada principal
  answer: B
  explanation: El carril de aceleración, que varía en longitud, le permite alcanzar
    la velocidad del tráfico antes de incorporarse a los carriles normales.
- id: 204
  category: defensive_driving
  question: Si su visión de una calle transversal está bloqueada por edificios, árboles
    o autos estacionados en una intersección, ¿qué debe hacer?
  choices:
    A: Tocar la bocina y avanzar rápidamente
    B: Avanzar lentamente hacia adelante hasta que pueda ver
    C: Esperar a que otro vehículo entre primero en la intersección
    D: Encender las luces de emergencia y avanzar al límite de velocidad
  answer: B
  explanation: Asegúrese de tener una buena visión. Si su vista de una calle transversal
    está bloqueada por edificios, árboles, una cerca o una fila de autos estacionados,
    avance lentamente hacia adelante hasta que pueda ver.
- id: 205
  category: safe_driving_rules
  question: ¿Qué debe hacer si está entrando en una autopista que no tiene carril
    de aceleración?
  choices:
    A: Acelerar rápidamente en el arcén (hombro) antes de incorporarse.
    B: Detenerse antes de entrar, esperar un espacio en el tráfico y luego acelerar
      e incorporarse.
    C: Forzar su entrada al carril derecho ya que el tráfico de la autopista debe
      ceder el paso.
    D: Conducir a una velocidad lenta y constante hasta que se abra un espacio.
  answer: B
  explanation: Según el manual, si una entrada a una autopista no tiene carril de
    aceleración, debe detenerse antes de entrar, esperar un espacio en el tráfico
    y luego acelerar e incorporarse.
- id: 206
  category: safe_driving_rules
  question: Al adelantar a otro vehículo, ¿cuándo es seguro volver al carril derecho?
  choices:
    A: Tan pronto como su parachoques delantero esté por delante del vehículo adelantado.
    B: Cuando pueda ver el vehículo adelantado completo en su espejo retrovisor.
    C: Después de haber viajado al menos tres segundos en el carril izquierdo.
    D: Cuando el conductor del vehículo adelantado parpadee sus faros.
  answer: B
  explanation: 'El manual establece: "Asegúrese de poder ver el vehículo adelantado
    completo en su espejo retrovisor antes de volver al carril derecho".'
- id: 207
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de reducir la velocidad al salir de una carretera
    de varios carriles?
  choices:
    A: Frenar firmemente mientras aún está en el carril principal de la autopista.
    B: Comenzar a reducir la velocidad tan pronto como entre en el carril de desaceleración.
    C: Dejarse llevar hasta detenerse antes de entrar en la rampa de salida.
    D: Mantener su velocidad de carretera hasta que esté completamente en la rampa
      de salida.
  answer: B
  explanation: Al salir de una carretera de varios carriles, no debe reducir la velocidad
    en la autopista principal. En su lugar, comience a reducir la velocidad tan pronto
    como entre en el carril de desaceleración y continúe reduciéndola al comienzo
    de la rampa de salida.
- id: 208
  category: defensive_driving
  question: Si debe detenerse en una autopista debido a una emergencia, ¿cómo debe
    señalar su necesidad de asistencia?
  choices:
    A: Pararse en la parte transitada de la autopista y agitar los brazos.
    B: Tocar la bocina repetidamente.
    C: Levantar el capó.
    D: Caminar por el arcén (hombro) hasta la salida más cercana.
  answer: C
  explanation: Si ocurre una emergencia en una autopista, debe retirarse del pavimento
    tanto como el arcén (hombro) lo permita y levantar el capó para señalar su necesidad
    de asistencia.
- id: 209
  category: defensive_driving
  question: ¿Cuál de las siguientes es una forma recomendada de evitar la "hipnosis
    de autopista"?
  choices:
    A: Mantener el interior del auto lo más cálido posible.
    B: Mirar fijamente hacia adelante a un punto fijo en la carretera.
    C: Variar su velocidad ligeramente de vez en cuando.
    D: Confiar en medicamentos para mantenerse despierto para mantener la concentración.
  answer: C
  explanation: Para mantenerse alerta y evitar la hipnosis de autopista, el manual
    recomienda mantener el auto fresco, escanear constantemente la carretera, hablar
    o escuchar música y variar su velocidad ligeramente de vez en cuando.
- id: 210
  category: safe_driving_rules
  question: ¿Aproximadamente cuánto tiempo necesita para completar un adelantamiento
    de manera segura a velocidades de carretera de 50 a 55 mph?
  choices:
    A: 3 a 5 segundos
    B: 6 a 8 segundos
    C: 10 a 12 segundos
    D: 15 a 20 segundos
  answer: C
  explanation: A velocidades de carretera de 50 a 55 mph, necesita de 10 a 12 segundos
    para completar un adelantamiento de manera segura.
- id: 211
  category: sharing_the_road
  question: ¿Qué debe hacer cuando otro vehículo lo está rebasando?
  choices:
    A: Acelerar para que el rebase sea más rápido.
    B: Moverse hacia el acotamiento derecho.
    C: Permanecer en su carril y mantener una velocidad constante.
    D: Frenar bruscamente para dejarlos entrar.
  answer: C
  explanation: Al ser rebasado, debe permanecer en su carril y mantener una velocidad
    constante para permitir que el rebase ocurra de manera segura.
- id: 212
  category: safe_driving_rules
  question: ¿A qué distancia de una colina o curva no debe comenzar a rebasar a un
    vehículo?
  choices:
    A: Un cuarto de milla
    B: Un tercio de milla
    C: Media milla
    D: Una milla
  answer: B
  explanation: Siempre que su vista esté bloqueada por una curva o una colina, debe
    asumir que viene un automóvil en sentido contrario. No debe comenzar a rebasar
    si se encuentra a menos de un tercio de milla de una colina o curva.
- id: 213
  category: safe_driving_rules
  question: Según la ley de Maine, ¿cuándo debe completar una maniobra de rebase?
  choices:
    A: Antes de llegar al comienzo de una zona de no rebasar.
    B: Dentro de los 100 pies de una intersección.
    C: Antes de que el vehículo rebasado comience a acelerar.
    D: Solo después de haber entrado en la zona de no rebasar.
  answer: A
  explanation: La ley de Maine exige que complete un rebase antes de llegar al comienzo
    de una zona de no rebasar.
- id: 214
  category: signs_and_signals
  question: ¿Qué forma y color tiene la señal de "NO PASSING ZONE" (ZONA DE NO REBASAR)
    que aparece en el lado izquierdo de la carretera?
  choices:
    A: Una señal blanca rectangular
    B: Una señal amarilla en forma de banderín
    C: Una señal roja octagonal
    D: Una señal amarilla circular
  answer: B
  explanation: No puede rebasar donde aparezca una señal amarilla en forma de banderín
    de NO PASSING ZONE en el lado izquierdo de la carretera.
- id: 215
  category: sharing_the_road
  question: ¿Cuánto espacio exige la ley de Maine entre el lado derecho de su vehículo
    y una bicicleta cuando la está rebasando?
  choices:
    A: Al menos un pie
    B: Al menos dos pies
    C: Al menos tres pies
    D: Al menos cinco pies
  answer: C
  explanation: La ley de Maine exige que haya al menos tres pies de espacio entre
    el lado derecho de su vehículo y la bicicleta al rebasar.
- id: 216
  category: safe_driving_rules
  question: Al acercarse a un autobús escolar detenido con las luces rojas intermitentes
    en una carretera dividida de varios carriles, ¿cuándo NO es obligatorio detenerse?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera no dividida.
    B: Cuando llega tarde al trabajo.
    C: Cuando hay un divisor sólido entre usted y el autobús.
    D: Cuando se encuentra en un área de estacionamiento marcada.
  answer: C
  explanation: Si la carretera tiene un divisor sólido entre usted y el autobús escolar
    detenido, no tiene que detenerse.
- id: 217
  category: safe_driving_rules
  question: Al estacionarse en paralelo, ¿cuánto espacio debe dejar entre su automóvil
    y los vehículos estacionados delante y detrás de usted?
  choices:
    A: Al menos un pie
    B: Al menos dos pies
    C: Al menos tres pies
    D: Al menos cuatro pies
  answer: B
  explanation: Al estacionarse en paralelo a la carretera, debe dejar al menos dos
    pies de espacio entre su automóvil y los vehículos estacionados delante o detrás.
- id: 218
  category: safe_driving_rules
  question: Al estacionarse junto a una acera (bordillo), ¿cuál es la distancia máxima
    a la que puede estar su vehículo de la acera?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: Si hay una acera, debe estacionarse lo más cerca posible de ella, y
    a no más de 18 pulgadas de distancia.
- id: 219
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar el volante cuando se estacione cuesta arriba
    junto a una acera?
  choices:
    A: Hacia adelante (recto)
    B: Hacia la derecha
    C: Hacia la izquierda
    D: Hacia el centro de la carretera
  answer: C
  explanation: Al estacionarse cuesta arriba con una acera, debe girar las ruedas
    hacia la izquierda para que, si el automóvil se mueve, las ruedas sean detenidas
    por la acera.
- id: 220
  category: penalties_and_points
  question: ¿Cuál es la multa por estacionarse en un área reservada para personas
    con discapacidades sin un permiso o placas especiales de estacionamiento?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: B
  explanation: Las ordenanzas municipales no permiten estacionarse en un área reservada
    para personas con discapacidades a menos que tenga un permiso o placas especiales,
    lo cual conlleva una multa de $100.
- id: 221
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios está prohibido estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: A
  explanation: Algunas ordenanzas municipales no permiten estacionarse a menos de
    10 pies de un hidrante de incendios.
- id: 222
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de un cruce peatonal?
  choices:
    A: Al menos 5 pies
    B: Al menos 10 pies
    C: Al menos 15 pies
    D: Al menos 20 pies
  answer: C
  explanation: No se permite estacionarse a menos de 15 pies de un cruce peatonal.
- id: 223
  category: penalties_and_points
  question: ¿Cuál es la sanción por el uso indebido de un pasillo de acceso junto
    a un espacio de estacionamiento para personas con discapacidad?
  choices:
    A: Una multa de exactamente $100
    B: Una multa de no menos de $200
    C: Una advertencia por la primera infracción
    D: Una suspensión de la licencia por 30 días
  answer: B
  explanation: El uso indebido de un pasillo de acceso se considera una infracción
    de tránsito y está sujeto a una multa de no menos de $200.00.
- id: 224
  category: safe_driving_rules
  question: Cuando termine de estacionarse en paralelo, ¿a qué distancia debe estar
    su vehículo del bordillo (curb)?
  choices:
    A: Tocando el bordillo
    B: Aproximadamente 6 pulgadas, pero no más de 18 pulgadas
    C: Exactamente 24 pulgadas
    D: Entre 18 y 24 pulgadas
  answer: B
  explanation: Al terminar de estacionarse, debe estar a unas 6 pulgadas del bordillo,
    pero a no más de 18 pulgadas de distancia del mismo.
- id: 225
  category: safe_driving_rules
  question: Al prepararse para estacionarse en paralelo detrás de otro vehículo, ¿a
    qué distancia de ese vehículo debe detenerse antes de retroceder?
  choices:
    A: Aproximadamente 1 pie
    B: Aproximadamente 2 pies
    C: Aproximadamente 3 pies
    D: Aproximadamente 4 pies
  answer: B
  explanation: Al entrar en un espacio de estacionamiento en paralelo, debe colocarse
    en paralelo al vehículo detrás del cual se estacionará y detenerse a la par de
    ese vehículo, pero a unos 2 pies de distancia de este.
- id: 226
  category: safe_driving_rules
  question: Si está estacionado en el lado derecho de la carretera, ¿qué debe hacer
    antes de incorporarse a la calle?
  choices:
    A: Mirar solo por el espejo retrovisor
    B: Mirar sobre su hombro derecho
    C: Mirar sobre su hombro izquierdo
    D: Tocar la bocina e incorporarse rápidamente
  answer: C
  explanation: Si está estacionado en el lado derecho de la carretera, después de
    arrancar su vehículo, mire sobre su hombro izquierdo (no solo a través del espejo
    retrovisor) antes de incorporarse.
- id: 227
  category: safe_driving_rules
  question: ¿Bajo qué condiciones se debe utilizar un giro de tres puntos?
  choices:
    A: En cualquier carretera de cuatro carriles
    B: Solo si la carretera es demasiado estrecha para un giro en U y es una carretera
      de dos carriles
    C: Siempre que se pase su salida en la interestatal
    D: En una intersección concurrida
  answer: B
  explanation: Un giro de tres puntos debe usarse solo si la carretera es demasiado
    estrecha para un giro en U, y solo debe usarse en una carretera de dos carriles.
- id: 228
  category: defensive_driving
  question: ¿Por qué debe evitar el uso de líquido limpiaparabrisas en un día muy
    frío?
  choices:
    A: Puede agrietar el vidrio del parabrisas
    B: La mezcla puede congelarse en el parabrisas
    C: Dañará las escobillas del limpiaparabrisas
    D: Hace que se acumule una película permanente en el vidrio
  answer: B
  explanation: El manual aconseja no usar líquido limpiaparabrisas en un día muy frío,
    ya que la mezcla puede congelarse en el parabrisas.
- id: 229
  category: driver_responsibility
  question: ¿Qué establece el manual sobre colgar objetos del espejo retrovisor o
    colocar calcomanías en el parabrisas?
  choices:
    A: Se recomienda para personalizar su vehículo
    B: Se permite siempre que los objetos sean pequeños
    C: Es una violación de la ley porque bloquea la visión del conductor
    D: Solo es ilegal si las calcomanías están en el lado del conductor
  answer: C
  explanation: No cuelgue cosas del espejo ni llene el parabrisas con calcomanías.
    Cualquier cosa en el automóvil que bloquee la visión del conductor es una violación
    de la ley.
- id: 230
  category: defensive_driving
  question: ¿Por qué debe evitar seguir de cerca a vehículos grandes?
  choices:
    A: Viajan a velocidades más lentas
    B: Bloquearán su visión de la carretera por delante
    C: Crean fuertes corrientes de aire
    D: Realizan paradas repentinas con frecuencia
  answer: B
  explanation: No siga de cerca a los vehículos grandes, ya que bloquearán su visión.
    Dése espacio para poder ver.
- id: 231
  category: sharing_the_road
  question: ¿Si debe usar el lado de la calle para salir de su auto estacionado, qué
    debe tener especial cuidado de revisar detrás de usted?
  choices:
    A: Peatones en la acera
    B: Bicicletas
    C: Autos estacionados
    D: Señales de tráfico
  answer: B
  explanation: Si debe usar el lado de la calle para salir de su auto, revise el tráfico
    detrás de usted, especialmente las bicicletas, antes de abrir la puerta.
- id: 232
  category: driver_responsibility
  question: Si su licencia de conducir le restringe al uso de anteojos o lentes de
    contacto, ¿cuál es una práctica recomendada?
  choices:
    A: Usarlos solo cuando conduzca de noche
    B: Mantener un par extra de anteojos en el auto
    C: Usarlos solo cuando conduzca en áreas desconocidas
    D: Mantener una copia de su receta en la guantera
  answer: B
  explanation: Si usa anteojos o lentes de contacto, debe mantener un par extra de
    anteojos en el auto en caso de que sus anteojos habituales se rompan o se pierdan.
- id: 233
  category: defensive_driving
  question: Según el manual, ¿qué tan adelante debe tratar de mirar un conductor experto?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: De 1 a 2 minutos
  answer: C
  explanation: Para evitar maniobras de último minuto, necesita mirar lo suficientemente
    lejos para ver las cosas con anticipación. Un conductor experto trata de mirar
    de 20 a 30 segundos hacia adelante.
- id: 234
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar durante las horas
    de entrada o salida de la escuela?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Una señal de 5 lados significa que se encuentra en una zona escolar
    y debe reducir la velocidad a 15 mph durante el recreo, o cuando los niños van
    o salen de la escuela, durante las horas de apertura o cierre escolar.
- id: 235
  category: safe_driving_rules
  question: Si las luces rojas están parpadeando en un cruce de ferrocarril, ¿cuál
    es la distancia mínima a la que debe detenerse del cruce?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: B
  explanation: Si las luces rojas están parpadeando, deténgase al menos a 15 pies
    del cruce y espere hasta que se apaguen o hasta que vea que el camino está despejado
    en ambas direcciones.
- id: 236
  category: vehicle_information
  question: ¿Por qué debe evitar cambiar de marcha en una transmisión manual mientras
    cruza las vías del ferrocarril?
  choices:
    A: Es ilegal y conlleva una multa elevada.
    B: Aumenta el riesgo de que el motor se apague en las vías.
    C: Estar en marcha le da un mejor control sobre la superficie irregular.
    D: Causa un desgaste innecesario en el embrague.
  answer: C
  explanation: No cambie de marcha en una transmisión manual mientras cruza las vías
    del ferrocarril. Estar en marcha le da un mejor control sobre la superficie irregular.
- id: 237
  category: defensive_driving
  question: ¿Con qué frecuencia debe revisar su espejo retrovisor para ver el tráfico
    detrás de usted?
  choices:
    A: Cada 2 a 4 segundos
    B: Cada 6 a 8 segundos
    C: Cada 10 a 15 segundos
    D: Solo cuando se prepare para cambiar de carril
  answer: B
  explanation: Revise su espejo con frecuencia para ver el tráfico detrás de usted,
    cada 6 a 8 segundos. De esta manera sabrá si alguien lo sigue demasiado de cerca
    o se acerca demasiado rápido.
- id: 238
  category: safe_driving_rules
  question: ¿Cuánto debe reducir su velocidad al conducir en una carretera mojada?
  choices:
    A: De 5 a 10 mph
    B: A la mitad de su velocidad normal
    C: De 15 a 20 mph
    D: A paso muy lento
  answer: A
  explanation: 'El manual proporciona pautas sobre cuánto reducir la velocidad del
    auto según las condiciones: para una carretera mojada, reduzca la velocidad de
    5 a 10 mph.'
- id: 239
  category: safe_driving_rules
  question: ¿Cuál es el ajuste de velocidad recomendado al conducir sobre nieve compactada?
  choices:
    A: Reducir la velocidad de 5 a 10 mph
    B: Reducir la velocidad a la mitad
    C: Reducir a paso muy lento
    D: Mantener el límite de velocidad indicado pero aumentar la distancia de seguimiento
  answer: B
  explanation: De acuerdo con las pautas sobre cuánto reducir la velocidad del auto,
    en nieve compactada debe reducir la velocidad a la mitad.
- id: 240
  category: defensive_driving
  question: ¿Por qué debe tener especial cuidado en puentes y pasos elevados en días
    fríos y húmedos?
  choices:
    A: Acumulan más agua estancada que las carreteras normales.
    B: Tienden a congelarse primero y secarse al último.
    C: Suelen estar hechos de concreto más liso que carece de tracción.
    D: Son propensos a fuertes vientos cruzados.
  answer: B
  explanation: En días fríos y húmedos, los puentes y pasos elevados pueden ocultar
    placas de hielo. Tenga en cuenta que los puentes y pasos elevados tienden a congelarse
    primero y secarse al último.
- id: 241
  category: safe_driving_rules
  question: ¿Qué sucede cuando un vehículo experimenta hidroplaneo (hydroplaning)?
  choices:
    A: Los frenos se bloquean debido al exceso de humedad en las líneas de freno.
    B: El motor se apaga porque entra agua en el sistema de escape.
    C: Los neumáticos se deslizan sobre una capa de agua y pierden contacto con la
      carretera.
    D: El volante se vuelve rígido e imposible de girar.
  answer: C
  explanation: A medida que aumenta la velocidad, los neumáticos no pueden despejar
    el agua de la carretera tan bien. Comienzan a deslizarse sobre una capa de agua,
    como esquís acuáticos. Esto se llama "hidroplaneo" (hydroplaning).
- id: 242
  category: defensive_driving
  question: ¿Por qué el pavimento puede estar muy resbaladizo durante los primeros
    minutos cuando empieza a llover?
  choices:
    A: La lluvia se mezcla con la tierra para crear un lodo espeso.
    B: El calor hace que el aceite del asfalto suba a la superficie.
    C: El agua aún no ha lavado las líneas pintadas de la carretera.
    D: Los neumáticos necesitan tiempo para adaptarse al cambio repentino de temperatura.
  answer: B
  explanation: Cuando empieza a llover, el pavimento puede estar muy resbaladizo durante
    los primeros minutos. El calor hace que el aceite del asfalto suba a la superficie.
- id: 243
  category: safe_driving_rules
  question: ¿Cuál es la forma adecuada de manejar su velocidad al acercarse y conducir
    a través de una curva?
  choices:
    A: Mantener la velocidad en la curva y frenar fuerte en el ápice.
    B: Acelerar antes de entrar en la curva y dejarse llevar por ella.
    C: Reducir la velocidad antes de entrar en la curva y acelerar ligeramente a través
      de ella.
    D: Frenar continuamente durante toda la curva.
  answer: C
  explanation: Siempre reduzca la velocidad antes de entrar en una curva. Una velocidad
    segura le permite acelerar ligeramente a través de la curva.
- id: 244
  category: safe_driving_rules
  question: El límite de velocidad de 15 mph en zona escolar se aplica durante el
    recreo y ¿en qué otro período de tiempo?
  choices:
    A: De 7:00 AM a 4:00 PM en días escolares
    B: 1 hora antes hasta 1 hora después de la jornada escolar
    C: 1/2 hora antes del inicio de la jornada escolar hasta 1/2 hora después del
      final de la jornada escolar
    D: Solo cuando hay niños visiblemente presentes en el cruce de peatones
  answer: C
  explanation: Debe reducir la velocidad a 15 mph durante el recreo, o cuando los
    niños van o salen de la escuela, durante las horas de apertura o cierre de la
    escuela (1/2 hora antes del inicio de la jornada escolar hasta 1/2 hora después
    del final de la jornada escolar).
- id: 245
  category: defensive_driving
  question: ¿Cómo afecta la temperatura a lo resbaladizo del hielo en la carretera?
  choices:
    A: El hielo es más resbaladizo cuando las temperaturas están muy por debajo de
      cero.
    B: El hielo es más resbaladizo cuando la temperatura está cerca del punto de congelación
      porque está mojado y fangoso.
    C: La temperatura no afecta lo resbaladizo del hielo.
    D: El hielo se vuelve completamente seco y menos resbaladizo cerca del punto de
      congelación.
  answer: B
  explanation: Cuando la temperatura está cerca del punto de congelación, el hielo
    de la carretera está mojado (fangoso), por lo que es más resbaladizo que a temperaturas
    más frías.
- id: 246
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a vías de ferrocarril marcadas como 'Exempt'
    (Exento)?
  choices:
    A: Ignorarlas ya que están permanentemente fuera de servicio.
    B: Revisar las vías de todos modos porque aún podrían estar en uso.
    C: Detenerse solo si conduce un autobús escolar.
    D: Acelerar para cruzarlas lo más rápido posible.
  answer: B
  explanation: Las vías marcadas como 'Exempt' no se usan con frecuencia, pero pueden
    estar en uso. Revise todas las vías independientemente de estas señales.
- id: 247
  category: sharing_the_road
  question: ¿Por qué debería revisar sus espejos al subir una colina larga o empinada?
  choices:
    A: Para asegurarse de que su carga esté segura.
    B: Para vigilar vehículos de emergencia que puedan estar atrapados.
    C: Para detectar camiones y autobuses que aumentan la velocidad para llegar a
      la cima.
    D: Para ver si su escape echa humo por el esfuerzo del motor.
  answer: C
  explanation: 'Cuando suba una colina larga o empinada: revise sus espejos. Los conductores
    de camiones y autobuses a menudo intentan aumentar la velocidad para poder llegar
    a la cima de la siguiente colina.'
- id: 248
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en Maine fuera de cualquier zona
    comercial, residencial o edificada, a menos que se indique lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: B
  explanation: Las velocidades máximas en Maine, a menos que se indique lo contrario,
    son de 45 millas por hora fuera de cualquier zona comercial, residencial o edificada.
- id: 249
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    en un distrito comercial o residencial en Maine?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: El manual establece que la velocidad máxima es de 25 millas por hora
    en un distrito comercial, distrito residencial o zona edificada del estado.
- id: 250
  category: defensive_driving
  question: ¿Cuál es el tiempo promedio de percepción para que un conductor alerta
    reconozca que debe detenerse?
  choices:
    A: 1/4 a 1/2 segundo
    B: 1/2 a 3/4 de segundo
    C: 3/4 a 1 segundo
    D: 1 a 2 segundos
  answer: C
  explanation: El tiempo de percepción es el tiempo que le toma reconocer que debe
    detenerse. El tiempo promedio de percepción para un conductor alerta es de 3/4
    a 1 segundo.
- id: 251
  category: vehicle_information
  question: ¿En cualquier momento dado, cuánta área de contacto total tienen los cuatro
    neumáticos de un automóvil con la superficie de la carretera?
  choices:
    A: Un pie cuadrado
    B: Dos pies cuadrados
    C: Cuatro pies cuadrados
    D: Ocho pies cuadrados
  answer: A
  explanation: El único contacto que su automóvil tiene con la carretera es a través
    de los neumáticos. En cualquier momento, los cuatro neumáticos juntos tienen solo
    un pie cuadrado de caucho sobre la superficie de la carretera.
- id: 252
  category: safe_driving_rules
  question: Debido a que los faros delanteros solo le permiten ver con claridad a
    unos 250 pies de distancia, ¿conducir a una velocidad superior a cuál se considera
    "conducir a ciegas" en una carretera oscura?
  choices:
    A: 40 mph
    B: 50 mph
    C: 60 mph
    D: 70 mph
  answer: B
  explanation: Los faros delanteros le permitirán ver con claridad solo a unos 250
    pies de distancia. Por lo tanto, si conduce a más de 50 mph en una carretera oscura,
    realmente está "conduciendo a ciegas".
- id: 253
  category: defensive_driving
  question: Para mantener un margen de espacio seguro frente a su vehículo, ¿cuántos
    segundos de distancia de seguimiento debe mantener entre su automóvil y el vehículo
    de adelante?
  choices:
    A: Al menos 2 segundos
    B: Al menos 3 segundos
    C: Al menos 4 segundos
    D: Al menos 6 segundos
  answer: C
  explanation: Seguir demasiado de cerca limita su visión de la carretera. Mantenga
    al menos 4 segundos entre su automóvil y el vehículo de adelante.
- id: 254
  category: sharing_the_road
  question: ¿Qué indica un triángulo naranja con bordes rojos en la parte trasera
    de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es un vehículo de movimiento lento que generalmente circula a 25
      mph o menos
    C: El vehículo está realizando giros amplios a la derecha
    D: El vehículo es de respuesta a emergencias
  answer: B
  explanation: Los tractores agrícolas, los carros tirados por animales y los vehículos
    de mantenimiento de carreteras suelen circular a 25 mph o menos. Estos vehículos
    llevan un triángulo naranja con bordes rojos (señal de vehículo de movimiento
    lento) colocado en la parte trasera.
- id: 255
  category: defensive_driving
  question: ¿Cuál es la forma adecuada de entrar de forma segura a una autopista desde
    un carril de acceso?
  choices:
    A: Detenerse al final del carril de entrada y esperar un espacio
    B: Buscar un espacio, aumentar la velocidad en el carril de entrada y entrar a
      la velocidad de la autopista
    C: Entrar a la autopista inmediatamente y obligar a otros conductores a ceder
      el paso
    D: Conducir lentamente en el carril de entrada e incorporarse a 25 mph
  answer: B
  explanation: Se necesita habilidad y precaución para entrar de forma segura a una
    autopista desde un carril de acceso. Busque un espacio, luego aumente la velocidad
    en el carril de entrada y entre en el espacio a la velocidad de la autopista.
- id: 256
  category: defensive_driving
  question: Al salir de una autopista, ¿cuándo debe comenzar a reducir la velocidad?
  choices:
    A: Un cuarto de milla antes de la salida
    B: Mientras todavía está en el carril de tráfico principal
    C: Solo después de pasar al carril de salida
    D: Justo antes de girar el volante
  answer: C
  explanation: En una autopista, no reduzca la velocidad hasta que pase al carril
    de salida. Reducir mucho la velocidad o detenerse antes de tiempo aumentará sus
    posibilidades de ser golpeado por detrás.
- id: 257
  category: safe_driving_rules
  question: Según la ley de Maine, ¿es legal conducir significativamente más lento
    que el flujo normal de tráfico?
  choices:
    A: Sí, conducir despacio siempre es más seguro
    B: Sí, siempre que se mantenga en el carril derecho
    C: No, no debe conducir tan despacio que interfiera con el movimiento normal del
      tráfico
    D: No, siempre debe conducir exactamente al límite de velocidad indicado
  answer: C
  explanation: La ley de Maine establece que no debe conducir tan despacio que interfiera
    con el movimiento normal y razonable del tráfico, excepto cuando la velocidad
    reducida sea necesaria por seguridad.
- id: 258
  category: defensive_driving
  question: ¿Qué debe hacer si la lluvia intensa, una tormenta de nieve o la niebla
    espesa le impiden ver correctamente incluso cuando conduce despacio?
  choices:
    A: Encender las luces altas y continuar
    B: Seguir de cerca las luces traseras del automóvil que va delante
    C: Salirse de la carretera y esperar hasta que las condiciones mejoren
    D: Tocar la bocina continuamente mientras conduce
  answer: C
  explanation: En una lluvia muy intensa, una tormenta de nieve o niebla espesa, es
    posible que no pueda ver correctamente, incluso cuando conduce despacio. Si esto
    sucede, sálgase de la carretera y espere hasta que las condiciones mejoren.
- id: 259
  category: defensive_driving
  question: ¿Cuál de los siguientes factores se combinan para formar la distancia
    total de frenado de un vehículo?
  choices:
    A: Tiempo de percepción, tiempo de reacción y distancia de frenado
    B: Peso del vehículo, banda de rodadura de los neumáticos y superficie de la carretera
    C: Límite de velocidad, condiciones climáticas y estado de alerta del conductor
    D: Distancia de frenado y distancia de seguimiento
  answer: A
  explanation: Varias cosas afectan la distancia de frenado, incluyendo el tiempo
    de percepción, su tiempo de reacción y la distancia de frenado. Sumar el tiempo
    de percepción y el tiempo de reacción casi duplica la distancia de frenado.
- id: 260
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo al pasar por una escuela durante
    el recreo o cuando los niños van o vienen de la escuela?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: La velocidad máxima es de 15 millas por hora al pasar por una escuela
    durante el recreo, o cuando los niños van o vienen de la escuela durante las horas
    de apertura o cierre de la misma.
- id: 261
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento mínima recomendada que debe mantener
    entre su automóvil y el vehículo de adelante en condiciones normales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: El manual establece mantener al menos 4 segundos entre su automóvil
    y el vehículo de adelante para permitir suficiente tiempo de reacción para evitar
    una colisión.
- id: 262
  category: sharing_the_road
  question: ¿Por qué debería aumentar su distancia de seguimiento al conducir detrás
    de una motocicleta o bicicleta?
  choices:
    A: Pueden detenerse mucho más rápido que los vehículos de pasajeros.
    B: Si el ciclista llegara a caerse, necesitará una distancia adicional para evitar
      atropellarlo.
    C: Las motocicletas tienen puntos ciegos más grandes que los automóviles.
    D: La ley les exige conducir más lento que el resto del tráfico.
  answer: B
  explanation: Debe aumentar su distancia de seguimiento detrás de motocicletas o
    bicicletas porque si el ciclista llegara a caerse, necesitará una distancia adicional
    para evitar atropellarlo. Las posibilidades de una caída son mayores en superficies
    mojadas, heladas o irregulares.
- id: 263
  category: sharing_the_road
  question: ¿Cuál es un factor importante a tener en cuenta al seguir a camiones grandes
    o autobuses?
  choices:
    A: A menudo realizan giros amplios, dejando un espacio abierto a su derecha.
    B: Aceleran muy rápido al subir colinas.
    C: Tienen una excelente visibilidad trasera.
    D: Pierden impulso al ir cuesta abajo.
  answer: A
  explanation: Los camiones y autobuses a menudo realizan giros amplios, dejando un
    espacio abierto a su derecha en el proceso. No debe rebasar a dichos vehículos
    por la derecha si existe la posibilidad de que estén realizando un giro a la derecha.
- id: 264
  category: safe_driving_rules
  question: ¿Cuáles de los siguientes vehículos están obligados a detenerse en todos
    los cruces de ferrocarril?
  choices:
    A: Automóviles de pasajeros y camionetas (pickup)
    B: Autobuses escolares y camiones cisterna que transportan líquidos inflamables
    C: Motocicletas y bicicletas
    D: Todos los vehículos que arrastran un remolque
  answer: B
  explanation: Los autobuses escolares y los camiones cisterna que transportan líquidos
    inflamables deben detenerse en todos los cruces de ferrocarril, por lo que debe
    prever las paradas y reducir la velocidad con anticipación.
- id: 265
  category: defensive_driving
  question: ¿Por qué debe evitar conducir al lado de otros vehículos en calles de
    varios carriles?
  choices:
    A: Es ilegal conducir en paralelo a otro vehículo.
    B: Disminuye la eficiencia de combustible de su vehículo.
    C: Es posible que se encuentre en su punto ciego y esto reduce el espacio que
      necesita para evitar una colisión.
    D: Hace que conduzca demasiado lento para el flujo del tráfico.
  answer: C
  explanation: No conduzca al lado de otros vehículos en calles de varios carriles,
    ya que podría estar en su punto ciego. Conducir al lado reduce el espacio que
    podría necesitar para evitar una colisión si alguien invade su carril o intenta
    cambiar de carril repentinamente.
- id: 266
  category: defensive_driving
  question: ¿Qué debe hacer si lo siguen demasiado de cerca y no hay un carril derecho
    al cual moverse?
  choices:
    A: Acelerar para aumentar la distancia entre usted y el conductor que lo sigue
      de cerca.
    B: Frenar repentinamente para advertir al conductor que está detrás de usted.
    C: Esperar hasta que el camino de adelante esté despejado, luego reducir la velocidad
      lentamente para animar al conductor de atrás a rebasarlo.
    D: Encender las luces de emergencia y detenerse por completo en su carril.
  answer: C
  explanation: Si lo siguen demasiado de cerca y no hay un carril derecho, espere
    hasta que el camino de adelante esté despejado, luego reduzca la velocidad lentamente
    para animar al conductor de atrás a rebasarlo.
- id: 267
  category: defensive_driving
  question: ¿Qué significa la técnica de conducción defensiva de 'dividir la diferencia'
    (splitting the difference)?
  choices:
    A: Conducir directamente sobre la línea central de la carretera.
    B: Dirigir un curso intermedio entre peligros a ambos lados de la carretera, como
      autos que vienen en sentido contrario y autos estacionados.
    C: Compartir un solo carril con una motocicleta o bicicleta.
    D: Alternar su velocidad entre los límites mínimo y máximo.
  answer: B
  explanation: Dividir la diferencia significa que cuando hay peligros a ambos lados
    de la carretera (como autos estacionados a la derecha y autos que vienen en sentido
    contrario a la izquierda), usted dirige un curso intermedio entre ellos.
- id: 268
  category: sharing_the_road
  question: Si se enfrenta a un automóvil que viene en sentido contrario a su izquierda
    y a un ciclista a su derecha, ¿cómo debe manejar la situación?
  choices:
    A: Acelerar para rebasar al ciclista antes de que el automóvil llegue a usted.
    B: Conducir exactamente entre el automóvil y la bicicleta a su velocidad actual.
    C: Reducir la velocidad, dejar pasar al automóvil y luego moverse hacia la izquierda
      para dejar suficiente espacio al rebasar al ciclista.
    D: Tocar la bocina para que tanto el automóvil como el ciclista se aparten de
      su camino.
  answer: C
  explanation: En lugar de conducir entre el automóvil y la bicicleta, tómelos uno
    a la vez. Reduzca la velocidad, deje pasar al automóvil y luego muévase hacia
    la izquierda para dejar suficiente espacio (tres pies) al rebasar al ciclista.
- id: 269
  category: safe_driving_rules
  question: ¿Qué tan grande debe ser el espacio que necesita para incorporarse de
    manera segura al tráfico, cambiar de carril o entrar en una autopista?
  choices:
    A: Un espacio de 2 segundos
    B: Un espacio de 3 segundos
    C: Un espacio de 4 segundos
    D: Un espacio de 5 segundos
  answer: C
  explanation: Cada vez que se incorpore al tráfico, necesita un espacio de cuatro
    segundos para hacerlo de manera segura. Necesita un espacio de cuatro segundos
    cada vez que cambie de carril o entre en una autopista.
- id: 270
  category: safe_driving_rules
  question: 'Para ponerse en marcha desde una parada total y cruzar el tráfico en
    una calle de la ciudad, necesita un espacio de aproximadamente:'
  choices:
    A: Un cuarto de cuadra
    B: Media cuadra
    C: Una cuadra completa
    D: Dos cuadras
  answer: B
  explanation: Para ponerse en marcha desde una parada total, necesita un espacio
    de aproximadamente media cuadra en las calles de la ciudad.
- id: 271
  category: safe_driving_rules
  question: 'Para incorporarse a un carril de tráfico existente en la autopista y
    alcanzar la velocidad de los otros autos, necesita un espacio de aproximadamente:'
  choices:
    A: Media cuadra
    B: Una cuadra completa
    C: Dos cuadras
    D: Tres cuadras
  answer: C
  explanation: Para incorporarse a un carril de tráfico existente, necesita un poco
    más de tiempo para completar su giro y alcanzar la velocidad de los otros autos.
    Necesita un espacio de aproximadamente dos cuadras en la autopista.
- id: 272
  category: safe_driving_rules
  question: 'Incluso si tiene la luz verde en una intersección, no debe comenzar a
    cruzar si:'
  choices:
    A: Hay autos bloqueando su camino.
    B: Hay un vehículo esperando detrás de usted.
    C: Usted planea girar a la derecha.
    D: El cruce de peatones está vacío.
  answer: A
  explanation: Incluso si tiene la luz verde, no comience a cruzar si hay autos bloqueando
    su camino. Si se queda atrapado en la intersección cuando la luz cambie, bloqueará
    el tráfico.
- id: 273
  category: defensive_driving
  question: ¿Por qué nunca debe asumir que otro conductor girará solo porque su luz
    direccional está encendida?
  choices:
    A: Las luces direccionales suelen romperse en los vehículos modernos.
    B: Es ilegal confiar en las luces direccionales de otro conductor.
    C: El conductor puede planear girar justo después de usted, o la señal puede haber
      quedado encendida de un giro anterior.
    D: Las luces direccionales solo indican que un conductor está disminuyendo la
      velocidad.
  answer: C
  explanation: No gire solo porque un auto que se aproxima tiene una luz direccional
    encendida. El conductor puede planear girar justo después de usted, o su señal
    puede haber quedado encendida de un giro anterior.
- id: 274
  category: safe_driving_rules
  question: Según la ley de Maine, ¿cuándo debe encender sus faros delanteros durante
    el día?
  choices:
    A: Siempre que conduzca por una carretera interestatal.
    B: Siempre que la visibilidad sea demasiado escasa para ver a 1000 pies de distancia
      o cuando los limpiaparabrisas estén en uso constante.
    C: Siempre que conduzca en una zona escolar designada.
    D: Siempre que esté adelantando a otro vehículo en una carretera de dos carriles.
  answer: B
  explanation: Según la ley de Maine, siempre que la visibilidad sea demasiado escasa
    para que usted vea a 1000 pies de distancia o en cualquier momento en que los
    limpiaparabrisas estén en uso constante, debe encender los faros delanteros.
- id: 275
  category: safe_driving_rules
  question: Según la ley de Maine, ¿durante qué horas se requiere que tenga encendidos
    los faros delanteros?
  choices:
    A: De 8 PM a 6 AM
    B: Desde la puesta del sol hasta el amanecer
    C: Solo cuando esté completamente oscuro
    D: Desde el anochecer hasta el amanecer
  answer: B
  explanation: Según la ley de Maine, debe tener los faros encendidos al conducir
    en cualquier momento desde la puesta del sol hasta el amanecer.
- id: 276
  category: safe_driving_rules
  question: Según la ley de Maine, ¿cuándo debe tener encendidos los faros delanteros
    mientras conduce?
  choices:
    A: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes del amanecer
    B: En cualquier momento desde la puesta del sol hasta el amanecer
    C: Solo cuando la visibilidad sea inferior a 500 pies
    D: Entre las 8 PM y las 6 AM
  answer: B
  explanation: Según la ley de Maine, debe tener los faros encendidos al conducir
    en cualquier momento desde la puesta del sol hasta el amanecer.
- id: 277
  category: vehicle_information
  question: ¿Cuándo se requiere que los motociclistas tengan sus faros encendidos
    mientras operan en las carreteras de Maine?
  choices:
    A: Solo por la noche
    B: Solo durante las inclemencias del tiempo
    C: Siempre
    D: Solo cuando conducen a velocidades de autopista
  answer: C
  explanation: Los motociclistas siempre deben tener sus faros encendidos cuando operan
    una motocicleta en las carreteras de Maine.
- id: 278
  category: safe_driving_rules
  question: ¿A qué distancia debe atenuar sus faros o cambiar a luz de cruce (baja)
    al acercarse a un vehículo que viene en sentido contrario?
  choices:
    A: A menos de 200 pies
    B: A menos de 300 pies
    C: A menos de 400 pies
    D: A menos de 500 pies
  answer: D
  explanation: Cuando un vehículo equipado con luces de carretera de haz múltiple
    se acerca a un vehículo que viene en sentido contrario a menos de 500 pies, el
    operador debe atenuar los faros o cambiar a luz de cruce.
- id: 279
  category: safe_driving_rules
  question: ¿A qué distancia debe atenuar sus faros o cambiar a luces de cruce (bajas)
    cuando sigue a otro vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: El operador debe atenuar los faros o cambiar a luz de cruce cuando
    siga a un vehículo a menos de 300 pies.
- id: 280
  category: defensive_driving
  question: ¿Por qué debería usar luces de cruce (bajas) en lugar de luces de carretera
    (altas) en condiciones de niebla, nieve o lluvia intensa?
  choices:
    A: Las luces altas agotarán la batería del vehículo más rápido en climas fríos.
    B: La luz de las luces altas se reflejará en la precipitación y causará un resplandor.
    C: Las luces bajas son obligatorias por ley en todas las precipitaciones.
    D: Las luces altas cegarán a los conductores detrás de usted en el espejo retrovisor.
  answer: B
  explanation: Use luces de cruce (bajas) en condiciones de niebla, nieve o lluvia
    intensa, ya que la luz de sus propias luces altas se reflejará hacia usted desde
    dicha precipitación y causará un resplandor que afectará su visión.
- id: 281
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo que viene en sentido contrario no baja
    sus luces altas?
  choices:
    A: Hacer destellos con sus luces altas rápidamente para advertirle.
    B: Mantener sus luces brillantes encendidas para desquitarse con el conductor.
    C: Reducir la velocidad y mirar hacia el lado derecho de la carretera.
    D: Detenerse en el arcén inmediatamente y parar.
  answer: C
  explanation: Si un vehículo viene hacia usted con las luces altas encendidas y no
    las baja, reduzca la velocidad y mire hacia el lado derecho de la carretera. Esto
    evitará que las luces del otro auto lo deslubren.
- id: 282
  category: sharing_the_road
  question: ¿Por qué debe intentar evitar el uso de la bocina cuando esté cerca de
    ciclistas o caballos?
  choices:
    A: Es ilegal tocar la bocina al tráfico no motorizado.
    B: Los jinetes, ciclistas o el caballo pueden asustarse, perder el control y desviarse
      hacia la calzada.
    C: Las bicicletas y los caballos siempre tienen el derecho de paso.
    D: El sonido de la bocina se amplifica por el casco del ciclista.
  answer: B
  explanation: Intente evitar el uso de la bocina cuando esté cerca de ciclistas o
    caballos porque los jinetes o el caballo pueden asustarse, perder el control y
    desviarse hacia la calzada.
- id: 283
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar antes de realizar un cambio de
    dirección o un giro?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Señalice tan pronto como pueda, al menos 100 pies antes de cualquier
    cambio o giro.
- id: 284
  category: defensive_driving
  question: Si planea girar en una entrada privada justo después de una intersección,
    ¿cuándo debe activar su señal?
  choices:
    A: 100 pies antes de la intersección.
    B: Tan pronto como vea la entrada.
    C: Mientras esté en medio de la intersección.
    D: Después de pasar la intersección.
  answer: D
  explanation: Si planea girar después de una intersección, señalice después de esa
    intersección. Si señaliza antes de la intersección, otro conductor podría confundirse
    y cruzarse en su camino.
- id: 285
  category: safe_driving_rules
  question: Si su automóvil se avería y tiene bengalas de emergencia, ¿a qué distancia
    detrás del automóvil debe colocarlas?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Si tiene bengalas de emergencia, colóquelas al menos a 100 pies detrás
    del automóvil. Esto permite que otros conductores cambien de carril si es necesario.
- id: 286
  category: defensive_driving
  question: ¿Cuál es la mejor práctica al rebasar a otro vehículo para evitar permanecer
    en su punto ciego?
  choices:
    A: Tocar la bocina continuamente mientras rebasa.
    B: Igualar su velocidad mientras está en el punto ciego.
    C: Pasar por el punto ciego del otro conductor lo más rápido posible.
    D: Hacer destellos con sus luces altas antes de entrar en el punto ciego.
  answer: C
  explanation: Al rebasar a otro vehículo, pase por el punto ciego del otro conductor
    lo más rápido posible.
- id: 287
  category: vehicle_information
  question: ¿Cuál es la forma correcta de utilizar los Sistemas de Frenos Antibloqueo
    (ABS) en una parada de emergencia?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Presionar el pedal del freno con toda su fuerza y mantener la presión.
    C: Presionar el freno ligeramente para evitar que las ruedas se bloqueen.
    D: Aplicar el freno de mano mientras gira el volante.
  answer: B
  explanation: 'Las reglas para usar el ABS son: presione el pedal del freno con toda
    su fuerza y mantenga la presión.'
- id: 288
  category: defensive_driving
  question: Si está maniobrando alrededor de un peligro para evitar una colisión,
    ¿por qué debería intentar no frenar mientras gira?
  choices:
    A: Frenar hará que el volante se bloquee.
    B: Disminuye la posibilidad de un derrape, particularmente en un arcén blando.
    C: Permite que el ABS se reinicie.
    D: Frenar aumenta el radio de giro de su vehículo.
  answer: B
  explanation: Si puede, no frene mientras gira. Esto disminuye la posibilidad de
    un derrape, especialmente si está girando hacia un arcén blando.
- id: 289
  category: safe_driving_rules
  question: ¿Cuándo debe tocar ligeramente el pedal del freno para avisar a los demás
    que está disminuyendo la velocidad?
  choices:
    A: Al conducir a través de una luz verde.
    B: Al salir de una carretera que no tiene un carril de giro o salida separado.
    C: Al acelerar para entrar en una autopista.
    D: Al pasar a un ciclista.
  answer: B
  explanation: 'Toque ligeramente el pedal del freno cuando: vaya a salir de una carretera
    que no tiene un carril de giro o salida separado, o al estacionar o girar antes
    de una intersección.'
- id: 290
  category: vehicle_information
  question: Al aplicar una presión fuerte a un Sistema de Frenos Antibloqueo (ABS),
    ¿qué debería esperar que suceda?
  choices:
    A: El pedal puede vibrar y emitir un sonido de clic.
    B: El volante se bloqueará en su lugar.
    C: El vehículo acelerará automáticamente.
    D: El pedal del freno bajará completamente hasta el suelo.
  answer: A
  explanation: El ABS solo funciona si mantiene la presión sobre el pedal del freno.
    El pedal puede vibrar y es posible que escuche un sonido de clic. Esto es normal.
- id: 291
  category: safe_driving_rules
  question: ¿Cuáles son las posiciones correctas de las manos en el volante, según
    las agujas del reloj, para asegurar que pueda girar rápidamente?
  choices:
    A: Las 10 y las 2 o las 9 y las 3
    B: Las 9 y las 3 o las 8 y las 4
    C: Las 11 y la 1 o las 7 y las 5
    D: Las 8 y las 4 o las 10 y las 2
  answer: B
  explanation: Según el manual, sus manos deben estar en lados opuestos del volante,
    en las posiciones de las 9 y 3 o las 8 y 4 del reloj.
- id: 292
  category: safe_driving_rules
  question: ¿Cuál de los siguientes materiales impresos tiene permitido leer legalmente
    un conductor mientras opera un vehículo motorizado?
  choices:
    A: Un periódico o revista
    B: Un mensaje de texto impreso en papel
    C: Un mapa o instrucciones escritas para llegar a un lugar específico
    D: Un libro
  answer: C
  explanation: Es ilegal que un operador lea material impreso mientras conduce, pero
    el material impreso no incluye un mapa o instrucciones escritas para llegar a
    un lugar específico.
- id: 293
  category: defensive_driving
  question: ¿Qué debe hacer para protegerse si está a punto de ser golpeado por detrás?
  choices:
    A: Lanzarse sobre el asiento del pasajero.
    B: Soltar el freno y girar bruscamente a la derecha.
    C: Estar listo para aplicar el freno para no ser empujado contra otro vehículo.
    D: Poner el vehículo en punto muerto (neutral) y apagar el motor.
  answer: C
  explanation: Si está a punto de ser golpeado por detrás, debe estar listo para aplicar
    el freno para no ser empujado contra otro vehículo, prepararse para el impacto
    y presionar la cabeza contra el reposacabezas.
- id: 294
  category: defensive_driving
  question: Si está a punto de ser golpeado por delante y NO lleva puesto el cinturón
    de hombro, ¿qué debe hacer?
  choices:
    A: Usar sus brazos y manos para protegerse la cara.
    B: Lanzarse sobre el asiento para no golpear la columna de dirección o el parabrisas.
    C: Apoyarse firmemente entre el volante y el respaldo del asiento.
    D: Presionar la parte posterior de la cabeza firmemente contra el reposacabezas.
  answer: B
  explanation: Si está a punto de ser golpeado por delante y no está usando el cinturón
    de hombro, el manual aconseja lanzarse sobre el asiento para no golpear la columna
    de dirección o el parabrisas.
- id: 295
  category: driver_responsibility
  question: ¿Debe reportar un accidente a la policía o al alguacil local si este involucra
    lesiones o daños a la propiedad de al menos qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Si el accidente involucra lesiones o daños a la propiedad de $1,000
    o más, los conductores deben reportarlo a la policía o al alguacil local.
- id: 296
  category: driver_responsibility
  question: Si daña un vehículo estacionado y no puede encontrar al dueño, ¿qué información
    debe dejar en una nota?
  choices:
    A: Su nombre, dirección, número de licencia de conducir, número de placa, fecha/hora
      y una descripción de los daños.
    B: Solo su número de teléfono y el nombre de su compañía de seguros.
    C: Su nombre, número de teléfono y la marca/modelo de su vehículo.
    D: Su número de póliza de seguro y una descripción del accidente.
  answer: A
  explanation: Si no se puede encontrar al dueño, deje una nota que contenga su nombre
    y dirección, número de licencia de conducir, número de placa, fecha y hora del
    accidente, y una descripción de los daños a la propiedad.
- id: 297
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un accidente no reportable que
    lesiona o mata a un perro, gato o ganado?
  choices:
    A: Mover al animal a un lado de la carretera y seguir conduciendo.
    B: Tomar medidas razonables para notificar al dueño, a las autoridades locales
      o al control de animales.
    C: Transportar al animal a la clínica veterinaria más cercana de inmediato.
    D: Reportar el accidente al Departamento de Vehículos Motorizados (DMV) en un
      plazo de 24 horas.
  answer: B
  explanation: Los operadores involucrados en accidentes no reportables que impliquen
    lesiones o la muerte de un perro, un gato o ganado deben “tomar medidas razonables”
    para notificar al dueño, o si el dueño no puede ser localizado, a las autoridades
    locales o al control de animales.
- id: 298
  category: safe_driving_rules
  question: Si llega a la escena de un accidente y hay cables caídos tocando un vehículo,
    ¿qué debe hacer?
  choices:
    A: Usar un palo de madera para quitar los cables del vehículo.
    B: Sacar con cuidado a los ocupantes del vehículo.
    C: Advertir a los ocupantes que permanezcan adentro hasta que lleguen los equipos
      de emergencia.
    D: Apagar el encendido del vehículo desde el exterior.
  answer: C
  explanation: Si hay cables caídos tocando el vehículo o cerca de él, no se acerque.
    Advierta a los ocupantes que permanezcan adentro hasta que llegue ayuda.
- id: 299
  category: safe_driving_rules
  question: ¿Cómo debe tratar a una víctima de quemaduras en la escena de un accidente
    si la ayuda de emergencia no está disponible de inmediato?
  choices:
    A: Aplicar ungüento o grasa a la quemadura.
    B: Aplicar agua fría a la quemadura y cubrirla con un paño limpio.
    C: Darle a la víctima mucha agua para beber.
    D: Envolver la quemadura apretadamente con una manta pesada.
  answer: B
  explanation: No ponga ungüento ni grasa en las quemaduras. Puede aplicar agua fría
    a las quemaduras y cubrirlas con un paño limpio.
- id: 300
  category: vehicle_information
  question: ¿Qué es lo primero que debe hacer si su vehículo comienza a derrapar?
  choices:
    A: Pisar los frenos a fondo para detenerse rápidamente.
    B: Girar el volante en la dirección opuesta al derrape.
    C: Dejar de presionar el freno o el acelerador para recuperar el control de la
      dirección.
    D: Cambiar a una marcha más baja y acelerar.
  answer: C
  explanation: Si su vehículo comienza a derrapar, deje de presionar el freno o el
    acelerador para recuperar el control de la dirección y mire hacia donde desea
    ir.
- id: 301
  category: defensive_driving
  question: 'Si sus ruedas derechas se salen inesperadamente de la carretera pavimentada
    hacia el arcén (shoulder), usted debe:'
  choices:
    A: Pisar el pedal del freno de forma repentina y fuerte.
    B: Girar el volante rápidamente hacia la izquierda.
    C: Acelerar para volver al pavimento rápidamente.
    D: Sujetar el volante con firmeza, soltar el acelerador y pisar los frenos suavemente.
  answer: D
  explanation: Si sus ruedas se salen, no entre en pánico. Sujete el volante con firmeza,
    disminuya la presión sobre el pedal del acelerador y no pise el pedal del freno
    de forma repentina y fuerte; pise los frenos suavemente.
- id: 302
  category: vehicle_information
  question: Si sus frenos dejan de funcionar mientras conduce, ¿cuál es el primer
    paso que debe tomar?
  choices:
    A: Cambiar a punto muerto (neutral) y apagar el motor.
    B: Bombear el pedal del freno rápida y fuertemente varias veces.
    C: Aplicar el freno de estacionamiento tan rápido y fuerte como sea posible.
    D: Dirigirse hacia el arcén blando o la zanja más cercana.
  answer: B
  explanation: Si sus frenos dejan de funcionar, el primer paso es bombear el pedal
    del freno rápida y fuertemente varias veces. Si eso no funciona, entonces use
    el freno de estacionamiento lentamente.
- id: 303
  category: vehicle_information
  question: ¿Cómo puede "secar" sus frenos después de conducir a través de agua profunda?
  choices:
    A: Conduciendo a velocidades de autopista durante al menos dos millas.
    B: Bombeando los frenos rápidamente mientras está en punto muerto (neutral).
    C: Conduciendo lentamente y aplicando los frenos ligeramente durante una distancia
      corta.
    D: Estacionando el automóvil y dejando el motor en ralentí durante 10 minutos.
  answer: C
  explanation: Puede "secar" los frenos conduciendo lentamente y aplicando los frenos
    ligeramente durante una distancia corta.
- id: 304
  category: vehicle_information
  question: ¿Qué debe hacer si experimenta el reventón de un neumático mientras conduce?
  choices:
    A: Pisar los frenos a fondo inmediatamente y dirigirse al arcén.
    B: Sujetar el volante con firmeza, mantener la dirección recta y reducir la velocidad
      gradualmente levantando el pie del acelerador.
    C: Acelerar ligeramente para mantener el control de la dirección del vehículo.
    D: Girar el volante bruscamente en la dirección del neumático reventado.
  answer: B
  explanation: Si un neumático se desinfla, no entre en pánico ni pise los frenos
    a fondo. Sujete el volante con firmeza y mantenga la dirección recta, reduzca
    la velocidad gradualmente y retire el pie del pedal del acelerador.
- id: 305
  category: vehicle_information
  question: Si el pedal del acelerador se queda atascado y su vehículo acelera fuera
    de control, ¿a qué marcha debe cambiar?
  choices:
    A: Primera marcha
    B: Marcha atrás (reversa)
    C: Estacionamiento (Park)
    D: Punto muerto (Neutral)
  answer: D
  explanation: Si su vehículo acelera fuera de control debido a un pedal de acelerador
    atascado, debe mantener la vista en la carretera y cambiar a punto muerto (neutral).
- id: 306
  category: vehicle_information
  question: ¿Cuál es el procedimiento correcto para arrancar un motor ahogado?
  choices:
    A: Bombear el pedal del acelerador rápidamente mientras gira la llave.
    B: Presionar el pedal del acelerador hasta el fondo y mantenerlo ahí mientras
      gira la llave.
    C: Girar la llave sin tocar el pedal del acelerador.
    D: Cambiar a punto muerto (neutral) y bombear los frenos.
  answer: B
  explanation: Para arrancar un motor ahogado, presione el pedal del acelerador hasta
    el fondo y manténgalo allí. No bombee el pedal del acelerador. Gire la llave y
    suelte el pedal cuando el motor arranque.
- id: 307
  category: defensive_driving
  question: Si su automóvil se detiene en las vías del tren y se aproxima un tren,
    ¿en qué dirección debe correr después de salir de su vehículo?
  choices:
    A: Lejos del tren en la misma dirección en la que este viaja.
    B: Directamente lejos de las vías en un ángulo de 90 grados.
    C: Hacia el tren que se aproxima y lejos de las vías en un ángulo de 45 grados.
    D: Paralelo a las vías hacia el cruce más cercano.
  answer: C
  explanation: Para evitar los escombros de cualquier choque, salga de su vehículo
    y diríjase rápidamente hacia el tren que se aproxima y lejos de las vías en un
    ángulo de 45 grados.
- id: 308
  category: defensive_driving
  question: Si hay un automóvil que viene en sentido contrario en su carril, ¿qué
    es lo que NUNCA debe hacer?
  choices:
    A: Tocar la bocina y hacer destellos con las luces.
    B: Frenar rápidamente sin bloquear las ruedas.
    C: Salirse hacia el arcén derecho o la zanja.
    D: Conducir hacia el carril izquierdo para esquivarlo.
  answer: D
  explanation: Si hay un automóvil que viene en sentido contrario en su carril, diríjase
    rápidamente hacia el arcén derecho o la zanja. No conduzca hacia el carril izquierdo.
- id: 309
  category: vehicle_information
  question: Al arrancar un vehículo con cables de puente (jump-start) debido a una
    batería descargada, ¿dónde debe colocarse la última pinza?
  choices:
    A: Al terminal positivo de la batería descargada.
    B: Al terminal negativo de la batería descargada.
    C: Al bloque del motor del motor detenido.
    D: Al terminal negativo de la batería en buen estado.
  answer: C
  explanation: Al arrancar un automóvil con cables de puente, conecte la última pinza
    al bloque del motor del motor detenido.
- id: 310
  category: defensive_driving
  question: Si su vehículo se sumerge en el agua, ¿cuál es la mejor ruta de escape?
  choices:
    A: A través de una puerta, empujándola para abrirla inmediatamente.
    B: A través de una ventana, abriéndola lo antes posible.
    C: A través del maletero del vehículo.
    D: Esperando hasta que el automóvil se llene de agua para abrir la puerta.
  answer: B
  explanation: La mejor ruta de escape es a través de una ventana, porque la presión
    del agua dificulta la apertura de una puerta. Las ventanas eléctricas deben abrirse
    lo antes posible antes de que el agua cause un cortocircuito.
- id: 311
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un peatón cruza una calle con un perro guía o lleva
    un bastón blanco?
  choices:
    A: Tocar la bocina para avisarles que usted está allí.
    B: Reducir la velocidad y proceder con precaución.
    C: Detenerse por completo.
    D: Maniobrar para rodearlos con cuidado.
  answer: C
  explanation: Siempre ceda el paso a las personas con discapacidad visual. Cuando
    un peatón cruza una calle con un perro guía o lleva un bastón blanco, usted debe
    detenerse por completo.
- id: 312
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a rebasar a un vehículo que se ha detenido
    para ceder el paso a un peatón en un cruce peatonal?
  choices:
    A: Puede rebasar si el carril izquierdo está despejado.
    B: No debe adelantar ni rebasar al vehículo detenido.
    C: Puede rebasar si toca la bocina primero.
    D: Puede rebasar a una velocidad de 15 mph o menos.
  answer: B
  explanation: No debe adelantar ni rebasar a otros vehículos que se hayan detenido
    o que estén reduciendo la velocidad para ceder el paso a peatones en un cruce
    peatonal.
- id: 313
  category: sharing_the_road
  question: ¿Cómo se clasifican las bicicletas en las carreteras de Maine?
  choices:
    A: Como peatones.
    B: Como scooters motorizados.
    C: Como vehículos con los mismos derechos y responsabilidades que los conductores.
    D: Como equipo recreativo restringido a las aceras.
  answer: C
  explanation: Las bicicletas se consideran vehículos. Los ciclistas deben seguir
    las mismas reglas de la carretera que los demás vehículos y tienen los mismos
    derechos y responsabilidades que los conductores de vehículos.
- id: 314
  category: sharing_the_road
  question: ¿Por qué debe evitar usar la bocina cerca de un ciclista a menos que haya
    posibilidad de un choque?
  choices:
    A: Es ilegal usar la bocina en zonas residenciales.
    B: La bocina podría asustarlos y hacer que se desvíen hacia su trayectoria.
    C: Los ciclistas no pueden oír las bocinas por el ruido del viento.
    D: Hará que el ciclista se detenga repentinamente.
  answer: B
  explanation: No use la bocina cerca de las bicicletas a menos que haya posibilidad
    de un choque. Su bocina podría asustarlos y hacer que se desvíen hacia su trayectoria.
- id: 315
  category: sharing_the_road
  question: ¿Qué debe hacer un ciclista cuando una carretera es demasiado estrecha
    para que los autos y las bicicletas circulen de forma segura uno al lado del otro?
  choices:
    A: Circular por la acera.
    B: Orillarse y detenerse para dejar pasar a los autos.
    C: Circular en el centro o cerca del centro del carril para "tomar el carril de
      circulación".
    D: Circular lo más cerca posible de la cuneta.
  answer: C
  explanation: Cuando una carretera es demasiado estrecha para que los autos y las
    bicicletas circulen de forma segura uno al lado del otro, las bicicletas deben
    "tomar el carril de circulación", lo que significa circular en el centro o cerca
    del centro del carril.
- id: 316
  category: sharing_the_road
  question: Al cruzar una acera con su vehículo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo motorizado.
    B: Todos los peatones o ciclistas en la acera.
    C: Cualquier vehículo o persona que llegue primero.
    D: Solo los peatones, pero no los ciclistas.
  answer: B
  explanation: Al cruzar una acera, debe ceder el paso a todos los peatones o ciclistas
    que se encuentren en ella.
- id: 317
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la velocidad
    de los ciclistas experimentados?
  choices:
    A: Están restringidos a una velocidad máxima de 15 mph.
    B: Pueden viajar fácilmente a más de 30 mph.
    C: Siempre deben circular más despacio que el tráfico de vehículos motorizados.
    D: No pueden exceder las 20 mph en vías públicas.
  answer: B
  explanation: Los ciclistas pueden estar moviéndose más rápido de lo que usted cree
    (los ciclistas experimentados pueden viajar fácilmente a más de 30 mph).
- id: 318
  category: sharing_the_road
  question: ¿Qué es el método "Dutch Reach" (alcance holandés) recomendado para los
    conductores?
  choices:
    A: Un método para asegurar la carga en un portabicicletas.
    B: Abrir la puerta del vehículo con la mano derecha para obligar al conductor
      a mirar por encima del hombro en busca de ciclistas.
    C: Una señal manual utilizada por los ciclistas cuando no pueden quitar ambas
      manos del manubrio.
    D: Una técnica para que las motocicletas crucen de forma segura las vías del tren.
  answer: B
  explanation: Usando el método "Dutch Reach", el conductor abrirá su puerta usando
    la mano derecha. Esto hace que el cuerpo gire hacia la izquierda, obligando al
    conductor a mirar por encima del hombro del lado de la carretera, lo que facilita
    ver a los ciclistas que se aproximan.
- id: 319
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los ciclistas
    y las leyes de tránsito en Maine?
  choices:
    A: Los ciclistas deben tener una licencia para circular por las carreteras.
    B: Los ciclistas están exentos de detenerse en los semáforos en rojo.
    C: Los ciclistas no necesitan licencia, pero están sujetos a multas por infringir
      las leyes de tránsito.
    D: Los ciclistas no se consideran vehículos y no tienen las mismas responsabilidades
      que los conductores.
  answer: C
  explanation: Aunque no se requiere una licencia para conducir una bicicleta en las
    carreteras de Maine, los conductores de bicicletas deben obedecer todas las reglas
    de la carretera. Si infringe alguna ley de tránsito... está sujeto a multas.
- id: 320
  category: safe_driving_rules
  question: ¿Bajo qué condiciones se debe reemplazar un casco de bicicleta?
  choices:
    A: Solo después de haber sufrido un impacto severo en un choque.
    B: Cada dos años, independientemente de su estado.
    C: Si ha sufrido algún impacto, tiene cinco años o más, o si se deja en un auto
      caliente.
    D: Cuando el ciclista cumple 16 años.
  answer: C
  explanation: Una vez que un casco ha sufrido cualquier impacto, debe ser reemplazado.
    Los cascos también deben reemplazarse si tienen cinco años o más, o si se dejan
    en un auto caliente.
- id: 321
  category: sharing_the_road
  question: ¿Quién está legalmente obligado a usar casco mientras monta en bicicleta
    en las vías públicas de Maine?
  choices:
    A: Todas las personas menores de 16 años.
    B: Solo los ciclistas sin experiencia.
    C: Todos los ciclistas, independientemente de su edad.
    D: Solo los pasajeros que viajan en bicicletas.
  answer: A
  explanation: Todas las personas menores de 16 años que circulen en bicicleta están
    obligadas a usar casco y a sentarse en asientos para pasajeros cuando transiten
    por vías públicas.
- id: 322
  category: sharing_the_road
  question: ¿Cómo debe un ciclista navegar una intersección con un carril de giro
    a la derecha si tiene la intención de seguir recto?
  choices:
    A: Entrar en el carril de giro a la derecha y seguir recto a través de la intersección.
    B: Subirse a la acera para evitar la intersección.
    C: No entrar en el carril de giro a la derecha; circular con el tráfico que sigue
      recto.
    D: Zigzaguear entre los autos estacionados a la izquierda del carril de giro.
  answer: C
  explanation: Si se aproxima a una intersección con un carril de giro a la derecha
    y tiene la intención de continuar recto, no entre en el carril de giro a la derecha.
    Circule con el tráfico que sigue recto.
- id: 323
  category: vehicle_information
  question: ¿Qué equipo de iluminación se requiere para una bicicleta que se opera
    de noche?
  choices:
    A: Una luz blanca delantera visible a una distancia de al menos 500 pies y un
      reflector rojo trasero.
    B: Una luz blanca delantera visible a una distancia de al menos 200 pies y una
      luz o reflector rojo o ámbar trasero visible a una distancia de al menos 200
      pies.
    C: Una luz ámbar intermitente tanto en la parte delantera como en la trasera.
    D: Solo material reflectante en los pedales y los tobillos.
  answer: B
  explanation: Una bicicleta debe tener una luz delantera que emita una luz blanca
    visible desde una distancia de al menos 200 pies hacia adelante. Además, una luz
    o reflector rojo o ámbar en la parte trasera que sea visible al menos a 200 pies
    hacia atrás.
- id: 324
  category: defensive_driving
  question: ¿Por qué no debe asumir que una motocicleta va a girar solo porque su
    luz direccional está parpadeando?
  choices:
    A: Las motocicletas usan señales intermitentes para indicar que están disminuyendo
      la velocidad.
    B: Las luces direccionales de las motocicletas pueden no cancelarse automáticamente,
      y el conductor puede haber olvidado que la señal está encendida.
    C: Las señales intermitentes en una motocicleta indican que el conductor está
      reclamando el derecho de paso.
    D: Las motocicletas están legalmente obligadas a circular con sus luces direccionales
      parpadeando en todo momento.
  answer: B
  explanation: No crea que una motocicleta va a girar cuando tiene una luz direccional
    parpadeando. Las luces direccionales en una motocicleta pueden no cancelarse automáticamente,
    por lo que el conductor puede haber olvidado que la señal está encendida.
- id: 325
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada al conducir detrás
    de una motocicleta?
  choices:
    A: Al menos 2 segundos
    B: Al menos 3 segundos
    C: Al menos 4 segundos
    D: Al menos 6 segundos
  answer: C
  explanation: Al seguir a una motocicleta, manténgase al menos a 4 segundos de distancia.
    Cuando el pavimento esté mojado, aumente la distancia de seguimiento.
- id: 326
  category: sharing_the_road
  question: Aunque las motocicletas representan solo el 4% de los vehículos en la
    carretera, ¿en qué porcentaje de todas las muertes por vehículos motorizados están
    involucradas?
  choices:
    A: Casi el 5%
    B: Casi el 10%
    C: Casi el 15%
    D: Casi el 25%
  answer: B
  explanation: Las motocicletas no ofrecen protección a sus conductores. Por lo tanto,
    están involucradas en casi el 10% de todas las muertes por vehículos motorizados,
    aunque representan solo el 4% de los vehículos en la carretera.
- id: 327
  category: defensive_driving
  question: ¿Cuál es una causa común de accidentes entre automóviles y motocicletas?
  choices:
    A: Motocicletas que chocan por detrás a camiones grandes.
    B: Conductores que giran a la izquierda frente a una motocicleta que se aproxima.
    C: Automóviles que adelantan a motocicletas por el lado derecho.
    D: Motocicletas que no se detienen ante los semáforos en rojo.
  answer: B
  explanation: En muchos accidentes de motocicleta, los conductores de otros vehículos
    tienen la culpa. Los conductores que giran a la izquierda frente a una motocicleta
    que se aproxima causan muchos de los accidentes.
- id: 328
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego de un vehículo
    grande?
  choices:
    A: Si se encuentra a menos de 50 pies de la parte trasera del camión.
    B: Si las luces direccionales del camión están parpadeando.
    C: Si no puede ver los espejos del vehículo grande que está delante de usted.
    D: Si el camión está viajando cuesta arriba.
  answer: C
  explanation: Si no puede ver los espejos del vehículo grande que está delante de
    usted, es probable que el conductor no pueda verlo, así que manténgase fuera de
    los puntos ciegos.
- id: 329
  category: vehicle_information
  question: ¿Cómo afecta el peso de un vehículo grande a su velocidad en las colinas?
  choices:
    A: Mantiene una velocidad constante independientemente del terreno.
    B: Su velocidad cae bruscamente al subir y aumenta rápidamente al bajar.
    C: Su velocidad aumenta al subir y disminuye al bajar.
    D: Requiere menos espacio para detenerse cuando viaja cuesta abajo.
  answer: B
  explanation: La velocidad de un vehículo grande puede caer bruscamente cuando el
    vehículo va cuesta arriba; este mismo vehículo a menudo puede ganar velocidad
    rápidamente al comenzar a bajar.
- id: 330
  category: safe_driving_rules
  question: ¿Qué es lo que nunca debe hacer cuando un camión grande o un autobús está
    dando marcha atrás?
  choices:
    A: Intentar pasar por detrás del vehículo.
    B: Tocar la bocina para alertarlos de su presencia.
    C: Hacer cambio de luces con los faros.
    D: Detenerse en el lado derecho de la carretera.
  answer: A
  explanation: Nunca intente pasar por detrás de un camión o autobús que esté dando
    marcha atrás.
- id: 331
  category: safe_driving_rules
  question: ¿Cómo debe un ciclista cruzar las vías del tren para evitar peligros?
  choices:
    A: En un ángulo de 45 grados.
    B: Zigzagueando entre las vías.
    C: En ángulo recto.
    D: Desmontando y cargando la bicicleta.
  answer: C
  explanation: Siempre observe la carretera de 50 a 100 pies adelante para detectar
    peligros en la vía como... vías de tren (crúcelas en ángulo recto).
- id: 332
  category: defensive_driving
  question: ¿Cuánto espacio debe dejar un ciclista entre su bicicleta y los vehículos
    estacionados para evitar las puertas de los autos que se abren?
  choices:
    A: Uno o dos pies
    B: Tres o cuatro pies
    C: Cinco o seis pies
    D: Al menos diez pies
  answer: B
  explanation: Evite las puertas de los autos que se abren. Deje tres o cuatro pies
    de espacio entre usted y los vehículos estacionados.
- id: 333
  category: sharing_the_road
  question: ¿Por qué los vehículos grandes a veces se desvían hacia la izquierda antes
    de girar a la derecha?
  choices:
    A: Para ganar más velocidad antes de entrar en el giro.
    B: Para no golpear la acera u objetos como postes de teléfono a un lado de la
      carretera.
    C: Para permitir que los vehículos más pequeños los rebasen por la derecha.
    D: Para revisar su punto ciego del lado derecho antes de girar.
  answer: B
  explanation: Muchas veces, los vehículos grandes se verán obligados a desviarse
    hacia la izquierda antes de girar a la derecha. Esto es necesario para no golpear
    la acera o cualquier objeto, como un poste de teléfono, que pueda estar a un lado
    de la carretera.
- id: 334
  category: vehicle_information
  question: ¿Cuál es la distancia mínima de frenado para un camión cargado que viaja
    a 55 mph?
  choices:
    A: 150 pies
    B: 200 pies
    C: 335 pies
    D: 500 pies
  answer: C
  explanation: Debido a que son tan grandes y pesados, los vehículos más grandes tardan
    más en detenerse que los automóviles. Un camión cargado a 55 mph tarda al menos
    335 pies en detenerse.
- id: 335
  category: defensive_driving
  question: ¿En qué consiste la práctica peligrosa conocida como 'drafting' (ir a
    rebufo)?
  choices:
    A: Rebasar a un vehículo grande por el lado derecho.
    B: Seguir de cerca a un camión pensando que la resistencia del viento arrastrará
      su automóvil.
    C: Moverse al extremo derecho de su carril para evitar la ráfaga de viento de
      un camión que viene en sentido contrario.
    D: Usar las luces altas para indicarle a un vehículo grande que tiene la intención
      de rebasarlo.
  answer: B
  explanation: Algunos conductores practican el 'drafting' detrás de un vehículo grande.
    Esta es la práctica de seguir tan de cerca a un camión pensando que la resistencia
    del viento creada por el camión arrastrará su automóvil. No haga esto; es extremadamente
    peligroso.
- id: 336
  category: safe_driving_rules
  question: ¿Hasta qué distancia detrás de un vehículo grande puede extenderse su
    punto ciego trasero?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 200 pies
    D: Hasta 335 pies
  answer: C
  explanation: Los vehículos grandes tienen puntos ciegos enormes, de hasta 200 pies
    detrás de ellos. Si está demasiado cerca, el conductor no puede ver su automóvil.
- id: 337
  category: defensive_driving
  question: Al rebasar a un vehículo grande, ¿cuándo es seguro volver al carril delante
    de él?
  choices:
    A: Cuando esté exactamente a la longitud de un automóvil por delante del camión.
    B: Tan pronto como su vehículo pase el parachoques delantero del camión.
    C: Cuando pueda ver toda la parte delantera del vehículo en su espejo retrovisor.
    D: Cuando el conductor del camión use sus luces para darle una señal.
  answer: C
  explanation: Al rebasar, asegúrese de poder ver toda la parte delantera del vehículo
    en su espejo retrovisor antes de volver al carril que ocupa el vehículo más grande.
- id: 338
  category: safe_driving_rules
  question: ¿Por qué debe detenerse siempre detrás de las líneas de parada en las
    intersecciones?
  choices:
    A: Para dar a los vehículos más grandes más espacio para girar.
    B: Para evitar bloquear el cruce de peatones.
    C: Para activar los sensores magnéticos del semáforo.
    D: Para permitir que los vehículos de emergencia pasen de forma segura.
  answer: A
  explanation: Las líneas de parada en las intersecciones están diseñadas para dar
    a los vehículos más grandes más espacio para girar. Deténgase siempre detrás de
    las líneas de parada.
- id: 339
  category: defensive_driving
  question: ¿Qué debe hacer con sus luces delanteras cuando sigue a un vehículo grande
    por la noche?
  choices:
    A: Encender las luces altas para aumentar su visibilidad.
    B: Bajar la intensidad de sus luces para que no se reflejen en los espejos del
      vehículo grande.
    C: Apagarlas temporalmente si el camión se detiene por completo.
    D: Usarlas repetidamente para que el conductor del camión sepa que usted está
      en su punto ciego.
  answer: B
  explanation: Siempre baje la intensidad de sus luces delanteras (use luces bajas)
    cuando siga a un vehículo grande por la noche. Las luces brillantes se reflejarán
    en los espejos del vehículo grande y dificultarán que el conductor vea la carretera
    adelante.
- id: 340
  category: defensive_driving
  question: ¿Cuál es la acción recomendada cuando un vehículo grande lo está rebasando?
  choices:
    A: Acelerar para salir del camino del vehículo más grande.
    B: Mantener su velocidad o disminuirla ligeramente para permitir que el vehículo
      pase.
    C: Moverse al carril izquierdo para darle más espacio al vehículo.
    D: Usar sus luces altas para alertar al conductor.
  answer: B
  explanation: No acelere cuando un vehículo grande lo rebase. Mantenga su velocidad
    o disminuya la velocidad ligeramente para permitir que el vehículo más grande
    pase.
- id: 341
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima legal de seguimiento para un camión de bomberos
    que responde a una alarma de incendio?
  choices:
    A: 100 pies
    B: 200 pies
    C: 335 pies
    D: 500 pies
  answer: D
  explanation: Es ilegal seguir a menos de 500 pies de cualquier camión de bomberos
    que responda a una alarma de incendio.
- id: 342
  category: safe_driving_rules
  question: ¿Qué debe hacer si se encuentra en una intersección cuando se aproxima
    un vehículo de emergencia con las luces y sirenas encendidas?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Hacerse a un lado a la derecha mientras aún está dentro de la intersección.
    C: Salir de la intersección antes de hacerse a un lado de la carretera.
    D: Acelerar y girar en la calle lateral más cercana.
  answer: C
  explanation: Si se encuentra en una intersección, salga de ella antes de hacerse
    a un lado. Evite bloquear las intersecciones.
- id: 343
  category: driver_responsibility
  question: Si la policía lo detiene por la noche, ¿qué debe hacer con respecto a
    las luces interiores de su vehículo?
  choices:
    A: Apagarlas para reducir el deslumbramiento del oficial que se aproxima.
    B: Encenderlas para que el oficial pueda ver el interior del vehículo.
    C: Hacerles destellos dos veces para reconocer la presencia del oficial.
    D: Dejarlas exactamente como estaban antes de la detención de tráfico.
  answer: B
  explanation: Si la policía lo detiene por la noche, encienda las luces interiores
    para que el oficial pueda ver el interior del vehículo.
- id: 344
  category: safe_driving_rules
  question: De acuerdo con las leyes de "Hacerse a un lado" (Move-Over Laws), ¿qué
    debe hacer al encontrarse con un vehículo de emergencia detenido a un lado de
    la carretera?
  choices:
    A: Detenerse inmediatamente en su carril y esperar a que el vehículo se retire.
    B: Mantener su velocidad actual y permanecer en su carril.
    C: Reducir la velocidad, ceder el paso y cambiarse al siguiente carril si es posible.
    D: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia.
  answer: C
  explanation: Cuando encuentre un vehículo de emergencia detenido a un lado de la
    carretera, debe reducir la velocidad y ceder el paso. Si es posible, cámbiese
    al siguiente carril.
- id: 345
  category: sharing_the_road
  question: ¿Qué debe evitar hacer al compartir la carretera con vehículos de tracción
    animal o jinetes?
  choices:
    A: Rebasarlos por el lado izquierdo.
    B: Cederles el derecho de paso.
    C: Usar la bocina o acelerar el motor cerca de ellos.
    D: Reducir la velocidad al acercarse a ellos.
  answer: C
  explanation: Los animales que son conducidos, montados o guiados por el lado de
    una carretera se asustan fácilmente con los vehículos que pasan. No use la bocina
    ni "acelere" el motor cuando esté cerca de un animal.
- id: 346
  category: sharing_the_road
  question: ¿Qué debe evitar hacer al conducir cerca de un animal que esté en la carretera
    o cerca de ella?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Pasar al animal con cuidado
    C: Usar la bocina o acelerar el motor
    D: Estar atento a los giros a la izquierda hacia los campos
  answer: C
  explanation: No debe usar la bocina ni "acelerar" el motor cuando esté cerca de
    un animal, ya que esto puede asustarlos y causar un choque.
- id: 347
  category: safe_driving_rules
  question: ¿Qué tanto más lejos puede ver cuando usa las luces altas en comparación
    con las luces bajas?
  choices:
    A: Una vez y media más lejos
    B: El doble de lejos
    C: Tres veces más lejos
    D: Cuatro veces más lejos
  answer: B
  explanation: Según el manual, las luces altas le permiten ver el doble de lejos
    que las luces bajas.
- id: 348
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar al conducir con niebla, lluvia o nieve?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia (intermitentes)
  answer: B
  explanation: En condiciones de niebla, lluvia o nieve, debe usar las luces bajas
    para evitar el deslumbramiento.
- id: 349
  category: defensive_driving
  question: Al conducir de noche por carreteras desconocidas, ¿cuánto debe añadir
    a su distancia de seguimiento?
  choices:
    A: Al menos un segundo
    B: Al menos dos segundos
    C: Al menos tres segundos
    D: Al menos cuatro segundos
  answer: B
  explanation: El manual establece que se debe aumentar la distancia de seguimiento
    en al menos un segundo por la noche, y añadir al menos dos segundos para la conducción
    nocturna en carreteras desconocidas.
- id: 350
  category: signs_and_signals
  question: ¿Cómo son normalmente las señales de advertencia de construcción?
  choices:
    A: Símbolos blancos sobre un fondo verde
    B: Símbolos o letras negras sobre un fondo naranja
    C: Letras rojas sobre un fondo blanco
    D: Símbolos amarillos sobre un fondo negro
  answer: B
  explanation: Las señales de advertencia de construcción son símbolos o letras negras
    sobre un fondo naranja y a menudo tienen forma de diamante.
- id: 351
  category: safe_driving_rules
  question: 'Al conducir cerca de dispositivos de canalización como barricadas y conos
    en una zona de obras, usted debe:'
  choices:
    A: Cambiar de carril con frecuencia para evitarlos
    B: Conducir lo más cerca posible de ellos
    C: Mantener su vehículo en el centro del carril y mantener una velocidad responsable
    D: Acelerar para salir rápidamente de la zona de obras
  answer: C
  explanation: Al conducir cerca de dispositivos de canalización, mantenga su vehículo
    en el centro del carril y mantenga una velocidad responsable. No cambie de carril
    hasta que esté completamente fuera de la zona de obras.
- id: 352
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso al acercarse a un puente de un solo carril
    en una carretera rural?
  choices:
    A: El vehículo más grande
    B: El vehículo que viaja cuesta arriba
    C: El primer conductor en llegar al puente
    D: El vehículo que viaja a una velocidad más rápida
  answer: C
  explanation: Al cruzar un puente de un solo carril, el primer conductor en llegar
    al puente tiene el derecho de paso.
- id: 353
  category: defensive_driving
  question: 'Al conducir sobre rejillas abiertas de puentes o puentes de acero, usted
    debe:'
  choices:
    A: Aumentar su velocidad para cruzar rápidamente
    B: Reducir su velocidad y sujetar firmemente el volante
    C: Disminuir su distancia de seguimiento
    D: Frenar bruscamente mientras cruza
  answer: B
  explanation: En rejillas abiertas de puentes o puentes de acero, debe reducir su
    velocidad, aumentar su distancia de seguimiento y sujetar firmemente el volante.
- id: 354
  category: vehicle_information
  question: Según el manual, ¿cuánto tiempo suele ser suficiente para dejar el motor
    en ralentí y que se caliente en invierno?
  choices:
    A: Treinta segundos
    B: Dos minutos
    C: Cinco minutos
    D: Diez minutos
  answer: A
  explanation: Treinta segundos suele ser tiempo suficiente para dejar el motor en
    ralentí. Un motor frío se calentará más rápido al ser conducido que cuando se
    deja en ralentí por períodos prolongados.
- id: 355
  category: defensive_driving
  question: ¿Hacia dónde debe girar el volante cuando intenta recuperarse de un derrape?
  choices:
    A: Gire el volante en la dirección opuesta a la que desea que vaya el automóvil
    B: Mantenga el volante perfectamente recto
    C: Gire el volante en la dirección en la que desea que vaya el automóvil
    D: Gire el volante rápidamente de un lado a otro
  answer: C
  explanation: Para salir de un derrape, gire el volante en la dirección en la que
    desea que vaya el automóvil, ya que esto alineará la parte delantera del automóvil
    con la trasera.
- id: 356
  category: safe_driving_rules
  question: En nieve o hielo, ¿cuánta más distancia se necesita para detener su automóvil
    en comparación con el pavimento seco?
  choices:
    A: De dos a tres veces más distancia
    B: De tres a doce veces más distancia
    C: De cinco a diez veces más distancia
    D: De diez a quince veces más distancia
  answer: B
  explanation: Recuerde que en nieve o hielo se necesita de tres a doce veces más
    distancia para detener su automóvil que en pavimento seco.
- id: 357
  category: vehicle_information
  question: ¿Cómo debe detenerse en carreteras con hielo o cubiertas de nieve si su
    vehículo NO tiene frenos antibloqueo (ABS)?
  choices:
    A: Presione firmemente el pedal del freno y manténgalo presionado
    B: Bombee los frenos de manera intermitente y muy suave
    C: Cambie a la posición de estacionamiento (P) mientras se mueve
    D: Tire del freno de emergencia inmediatamente
  answer: B
  explanation: 'Al detenerse en carreteras con hielo o cubiertas de nieve, bombee
    los frenos de manera intermitente y muy suave. (Nota: Si tiene frenos antibloqueo,
    debe presionar firmemente en su lugar).'
- id: 358
  category: defensive_driving
  question: ¿Por qué siempre debe reducir la velocidad en una zona de obras incluso
    si no hay trabajadores visibles?
  choices:
    A: Porque los carriles estrechos y el pavimento irregular pueden ser un peligro
    B: Porque el límite de velocidad es siempre de 15 mph en las zonas de obras
    C: Porque se requiere que se detenga en todas las señales de zona de obras
    D: Porque los vehículos de construcción siempre tienen el derecho de paso
  answer: A
  explanation: Siempre debe reducir la velocidad incluso si no hay trabajadores visibles
    porque los carriles estrechos y el pavimento irregular pueden ser un peligro en
    las zonas de obras.
- id: 359
  category: defensive_driving
  question: Si su vehículo se queda atascado en la nieve, ¿cuál es la forma recomendada
    de salir?
  choices:
    A: Haga girar sus ruedas rápidamente para derretir la nieve
    B: Mantenga las ruedas lo más rectas posible y balancee el vehículo hacia adelante
      y hacia atrás
    C: Gire el volante bruscamente de un lado a otro mientras acelera
    D: Abandone el vehículo inmediatamente y camine en busca de ayuda
  answer: B
  explanation: El manual aconseja que si se queda atascado, no debe hacer girar las
    ruedas. Manténgalas lo más rectas posible, quite la nieve con una pala, use ayudas
    de tracción y balancee el vehículo alternando entre reversa y marcha directa (drive).
- id: 360
  category: safe_driving_rules
  question: Si se queda varado en su automóvil durante una tormenta de invierno esperando
    ayuda, ¿qué es algo crítico que NO debe hacer?
  choices:
    A: Encender el motor y la calefacción hasta que esté caliente
    B: Envolverse en mantas
    C: Dejar que alguien se quede dormido
    D: Poner una bandera roja en su antena
  answer: C
  explanation: 'Al esperar ayuda en un vehículo varado durante el invierno, el manual
    establece explícitamente: "Manténgase usted y sus pasajeros lo más activos posible.
    NO DEJE QUE NADIE SE QUEDE DORMIDO".'
- id: 361
  category: safe_driving_rules
  question: 'Al conducir con niebla, debe encender las luces delanteras en:'
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (intermitentes)
  answer: B
  explanation: El manual indica que debe encender las luces delanteras y "ponerlas
    en luces bajas para evitar el reflejo deslumbrante de sus propias luces en la
    niebla".
- id: 362
  category: defensive_driving
  question: ¿Cuándo suelen ser más peligrosas las carreteras mojadas?
  choices:
    A: Después de varias horas de lluvia intensa
    B: Al comienzo de una lluvia ligera
    C: Al conducir a través de charcos profundos
    D: Cuando la lluvia se ha detenido por completo
  answer: B
  explanation: Las carreteras son más peligrosas al comienzo de una lluvia ligera,
    cuando el aceite de la carretera y el agua se mezclan para formar una película
    grasienta sobre el pavimento.
- id: 363
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (hydroplaning) en la mayoría
    de los automóviles?
  choices:
    A: 15 a 25 MPH
    B: 30 a 40 MPH
    C: 50 a 60 MPH
    D: 65 a 75 MPH
  answer: B
  explanation: En la mayoría de los automóviles, el hidroplaneo puede comenzar a velocidades
    tan bajas como 30 a 40 MPH, y los neumáticos pueden perder todo contacto con la
    carretera a 50 a 60 MPH.
- id: 364
  category: safe_driving_rules
  question: ¿Cuánta agua en una carretera inundada se necesita para que algunos automóviles
    pequeños floten?
  choices:
    A: Dos pulgadas
    B: Seis pulgadas
    C: Un pie
    D: Dos pies
  answer: B
  explanation: El manual advierte que nunca se debe intentar conducir a través de
    una carretera inundada, señalando que "tan solo seis pulgadas de agua pueden hacer
    flotar algunos automóviles pequeños".
- id: 365
  category: driver_responsibility
  question: 'La tasa de accidentes fatales al conducir de noche es:'
  choices:
    A: Aproximadamente la misma que al conducir de día
    B: Casi el doble que al conducir de día
    C: Casi tres veces mayor que al conducir de día
    D: Menor que al conducir de día debido a que hay menos tráfico
  answer: C
  explanation: La tasa de accidentes fatales al conducir de noche es casi tres veces
    mayor que al conducir de día, a pesar de que se conducen menos millas por la noche.
- id: 366
  category: defensive_driving
  question: ¿Cuáles son los dos meses de mayor incidencia de colisiones con alces
    en Maine?
  choices:
    A: Septiembre y octubre
    B: Noviembre y diciembre
    C: Marzo y abril
    D: Mayo y junio
  answer: D
  explanation: Según el manual, las colisiones con alces aumentan drásticamente en
    los meses de mayo y junio, lo que los convierte en los meses de mayor incidencia
    de colisiones con alces.
- id: 367
  category: defensive_driving
  question: ¿Por qué suele ser más difícil ver a un alce por la noche en comparación
    con un ciervo?
  choices:
    A: El pelaje del alce absorbe toda la luz
    B: Los alces son más altos, por lo que sus ojos normalmente no se reflejan en
      los faros delanteros
    C: Los alces viajan mucho más rápido que los ciervos
    D: Los alces solo viajan durante lluvias intensas o niebla
  answer: B
  explanation: Los ojos de los ciervos reflejan muy bien la luz de los faros, pero
    debido a que los alces son mucho más altos, los conductores normalmente no verán
    sus ojos reflejados en las luces delanteras.
- id: 368
  category: defensive_driving
  question: Si un choque con un animal grande es inevitable, ¿por qué debería soltar
    los frenos justo antes del impacto?
  choices:
    A: Para permitir que la parte delantera de su vehículo se eleve ligeramente
    B: Para hacer que el vehículo derrape de lado
    C: Para que las bolsas de aire se desplieguen más rápido
    D: Para bajar la parte delantera del vehículo por debajo del animal
  answer: A
  explanation: Debe soltar los frenos justo antes del impacto para permitir que la
    parte delantera de su vehículo se eleve ligeramente mientras intenta golpear la
    parte trasera del animal, reduciendo el riesgo de que este impacte contra el parabrisas.
- id: 369
  category: vehicle_information
  question: La carga de un vehículo de pasajeros NO debe extenderse más allá de la
    línea de los guardabarros en el lado izquierdo, ¿y no más de cuántas pulgadas
    más allá de los guardabarros en el lado derecho?
  choices:
    A: 2 pulgadas
    B: 6 pulgadas
    C: 10 pulgadas
    D: 12 pulgadas
  answer: B
  explanation: Ningún vehículo de tipo pasajero debe transportar una carga que se
    extienda sobre los lados del vehículo más allá de la línea de los guardabarros
    en el lado izquierdo, o que se extienda más de seis pulgadas más allá de la línea
    de los guardabarros en el lado derecho.
- id: 370
  category: safe_driving_rules
  question: ¿En cuál de los siguientes se le permite legalmente a una persona viajar
    mientras es movido en una carretera?
  choices:
    A: Un remolque de campamento
    B: Una casa móvil
    C: Un remolque de carga (utility trailer)
    D: Ninguno de los anteriores
  answer: D
  explanation: 'El manual establece: "Ninguna persona puede viajar en un remolque
    de campamento, casa móvil, semirremolque, remolque de carga o en el maletero de
    un vehículo mientras este es conducido o movido por cualquier carretera".'
- id: 371
  category: safe_driving_rules
  question: 'Un pasajero menor de 19 años que viaje en una camioneta (pick-up) debe
    viajar en el compartimiento de pasajeros A MENOS que sea:'
  choices:
    A: Viajando con un conductor con licencia mayor de 21 años
    B: Un participante en un desfile
    C: Sentado en la puerta trasera (tailgate)
    D: Viajando menos de 5 millas
  answer: B
  explanation: Un pasajero menor de 19 años debe viajar en el compartimiento de pasajeros
    de una camioneta a menos que cumpla con excepciones específicas, como ser participante
    en un desfile, trabajador agrícola o un cazador con licencia.
- id: 372
  category: vehicle_information
  question: 'Para evitar la intoxicación por monóxido de carbono si se queda varado
    en una tormenta de nieve y mantiene el motor encendido para mantenerse caliente,
    usted debe:'
  choices:
    A: Mantener todas las ventanas bien cerradas
    B: Abrir un poco las ventanas y mantener el tubo de escape libre de nieve
    C: Hacer funcionar el motor continuamente durante al menos dos horas
    D: Encender el aire acondicionado
  answer: B
  explanation: Si está esperando ayuda en un automóvil varado, debe abrir un poco
    las ventanas para permitir la entrada de aire fresco y mantener el tubo de escape
    libre de nieve para evitar la intoxicación por monóxido de carbono.
- id: 373
  category: safe_driving_rules
  question: ¿Cuándo se puede transportar a un perro en la parte abierta de un convertible
    o vehículo en una vía pública?
  choices:
    A: En cualquier momento, siempre que el perro se comporte bien.
    B: Solo si el perro está asegurado de manera que se evite que se caiga, salte
      o sea arrojado.
    C: Solo si el vehículo viaja a menos de 35 mph.
    D: Nunca se permiten perros en la parte abierta de un vehículo.
  answer: B
  explanation: Según el manual, no se puede transportar a un perro en la parte abierta
    de un vehículo a menos que el perro esté asegurado de manera que se evite que
    se caiga, salte o sea arrojado del vehículo.
- id: 374
  category: safe_driving_rules
  question: ¿Cuál de las siguientes personas está exenta del requisito de asegurar
    a un perro en la parte abierta de un vehículo?
  choices:
    A: Un conductor que viaja menos de 5 millas hacia un veterinario.
    B: Un oficial de policía que transporta una unidad K-9.
    C: Un cazador con licencia que transporta un perro de caza entre sitios de caza.
    D: Una persona que conduce una camioneta con cabina cerrada (cap).
  answer: C
  explanation: Las excepciones a la regla de asegurar perros incluyen a un agricultor
    o empleado agrícola para actividades agrícolas, o un perro de caza en un sitio
    de caza o que sea transportado entre sitios de caza por un cazador con licencia.
- id: 375
  category: alcohol_drugs_health
  question: ¿Cómo afectan el alcohol y otras drogas sus capacidades de conducción?
  choices:
    A: Mejoran su capacidad de concentración.
    B: Disminuyen su tiempo de reacción.
    C: Agudizan su visión.
    D: Reducen su capacidad de juicio.
  answer: D
  explanation: Las preguntas de práctica del manual establecen que el alcohol y otras
    drogas reducen su capacidad de juicio.
- id: 376
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla discontinua en su lado de la calzada?
  choices:
    A: Está prohibido adelantar en ambos lados.
    B: Se permite adelantar en ambos lados.
    C: Se permite adelantar en su lado.
    D: Se está acercando a una zona de no adelantar.
  answer: C
  explanation: Una línea amarilla discontinua en su lado de la calzada solo significa
    que se permite adelantar en su lado.
- id: 377
  category: safe_driving_rules
  question: Si llega a una intersección de cuatro vías controlada por señales de alto
    al mismo tiempo que otro conductor, ¿qué debe hacer?
  choices:
    A: Continuar por la intersección inmediatamente.
    B: Ceder el paso al conductor que está a su derecha.
    C: Ceder el paso al conductor que está a su izquierda.
    D: Tocar la bocina para indicar que usted pasará primero.
  answer: B
  explanation: Si llega a una intersección de cuatro vías controlada por señales de
    alto al mismo tiempo que otro conductor, debe ceder el paso al conductor que está
    a su derecha.
- id: 378
  category: signs_and_signals
  question: ¿De qué color son las señales reglamentarias?
  choices:
    A: Verde
    B: Amarillo
    C: Blanco
    D: Naranja
  answer: C
  explanation: Según las preguntas de práctica del manual, las señales reglamentarias
    son blancas.
- id: 379
  category: sharing_the_road
  question: Si un peatón está cruzando en medio de la calle (cruce imprudente), ¿qué
    debe hacer usted?
  choices:
    A: Tocar la bocina y mantener su velocidad.
    B: No tiene que detenerse porque no están en un cruce de peatones.
    C: Virar bruscamente hacia el carril contrario para evitarlos.
    D: Debe detenerse por ellos incluso si es ilegal.
  answer: D
  explanation: Si un peatón está cruzando en medio de la calle, no en un cruce de
    peatones (cruce imprudente), incluso si es ilegal, usted debe detenerse por él.
- id: 380
  category: sharing_the_road
  question: 'Al acercarse o adelantar a un ciclista, usted debe:'
  choices:
    A: Acelerar y adelantar rápidamente al ciclista.
    B: Tocar la bocina para alertar de su presencia.
    C: Reducir la velocidad y dejar tanto espacio como sea posible.
    D: Conducir lo más cerca posible para evitar que se desvíen.
  answer: C
  explanation: Al acercarse o adelantar a un ciclista, debe reducir la velocidad y
    dejar tanto espacio como sea posible.
- id: 381
  category: safe_driving_rules
  question: 'Al conducir de noche, debe usar las luces altas cuando:'
  choices:
    A: Haya niebla, lluvia o nieve.
    B: Esté siguiendo a otro vehículo.
    C: Esté conduciendo en una zona urbana bien iluminada.
    D: No se aproxime tráfico en sentido contrario.
  answer: D
  explanation: Al conducir de noche, use las luces altas cuando no se aproxime tráfico
    en sentido contrario.
- id: 382
  category: driver_testing
  question: ¿Cuál de las siguientes es una razón por la que un examinador de conducción
    podría negarse a realizarle un examen práctico?
  choices:
    A: La guantera del vehículo no está debidamente asegurada.
    B: El vehículo tiene transmisión automática.
    C: El solicitante le hace una pregunta al examinador antes del examen.
    D: El vehículo tiene neumáticos para nieve durante condiciones invernales.
  answer: A
  explanation: El manual enumera 'la guantera no está debidamente asegurada' como
    una de las razones típicas para rechazar un examen práctico.
- id: 383
  category: driver_testing
  question: 'Un examinador puede negarse a realizar un examen práctico si el solicitante:'
  choices:
    A: Ajusta sus espejos antes de arrancar el vehículo.
    B: Se niega a retirar mascotas del vehículo.
    C: Trae un vehículo con una calcomanía de inspección válida.
    D: Pide bajar las ventanillas.
  answer: B
  explanation: Se puede rechazar un examen práctico si el 'solicitante se niega a
    retirar mascotas del vehículo'.
- id: 384
  category: driver_testing
  question: 'Durante el examen práctico, el examinador NO le pedirá que:'
  choices:
    A: Conduzca en reversa.
    B: Mantenga la posición adecuada en el carril.
    C: Haga algo que sea extraordinario o ilegal.
    D: Reaccione ante peatones y señales de tráfico.
  answer: C
  explanation: 'El manual establece con respecto al examen práctico: ''No se le pedirá
    que haga nada que sea extraordinario o ilegal''.'
- id: 385
  category: license_system
  question: Al proporcionar evidencia documental de residencia en Maine, ¿cuál de
    los siguientes NO se considera suficiente por sí solo?
  choices:
    A: Un formulario W-2.
    B: Una dirección de apartado postal (P.O. Box).
    C: Una factura de servicios públicos.
    D: Un talón de cheque de pago.
  answer: B
  explanation: 'La evidencia documental aceptable debe incluir la dirección física
    de la residencia de la persona. El manual establece explícitamente: ''Un apartado
    postal u otra dirección de entrega de correo no es suficiente''.'
- id: 386
  category: license_system
  question: 'El Secretario de Estado puede eximir a alguien de los requisitos documentales
    estándar de residencia si establece que es:'
  choices:
    A: Un turista que visita por más de 30 días.
    B: Un empleado de un estado vecino.
    C: Un estudiante matriculado en una universidad, colegio o escuela dentro del
      Estado.
    D: Una persona que planea mudarse a Maine dentro del próximo año.
  answer: C
  explanation: El Secretario de Estado puede eximir a alguien que esté en servicio
    activo en las Fuerzas Armadas de los EE. UU., a su cónyuge/hijo, o a 'un estudiante
    matriculado en una universidad, colegio o escuela dentro del Estado'.
- id: 387
  category: license_system
  question: ¿Cuál es el período mínimo autorizado de admisión requerido para que a
    un no ciudadano se le emita una licencia de conducir o una tarjeta de identificación
    de no conductor?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: D
  explanation: Según el manual, no se emitirá una credencial si el período de admisión
    autorizado es inferior a 120 días.
- id: 388
  category: license_system
  question: Si el período de admisión autorizado de un no ciudadano es 'duración de
    estatus' (duration of status), ¿cuándo vencerá su credencial emitida?
  choices:
    A: 1 año a partir de la fecha de emisión
    B: 2 años a partir de la fecha de emisión
    C: 4 años a partir de la fecha de emisión
    D: 120 días a partir de la fecha de emisión
  answer: C
  explanation: El manual establece que si el período de admisión autorizado es por
    duración de estatus, la credencial emitida vencerá cuatro (4) años después de
    la fecha de emisión.
- id: 389
  category: license_system
  question: ¿Cuándo vencerá una credencial si el período de admisión autorizado del
    no ciudadano no es 'duración de estatus' ni está indicado por una fecha específica?
  choices:
    A: 30 días a partir de la fecha de emisión
    B: 90 días a partir de la fecha de emisión
    C: 120 días a partir de la fecha de emisión
    D: 4 años a partir de la fecha de emisión
  answer: C
  explanation: Si el período de admisión autorizado no es por duración de estatus
    ni está indicado por una fecha específica, la credencial emitida vencerá 120 días
    después de la fecha de emisión.
- id: 390
  category: license_system
  question: Si un no ciudadano tiene una fecha de vencimiento específica para su período
    de admisión autorizado, ¿cuándo vencerá su licencia de conducir?
  choices:
    A: Cuatro años a partir de la fecha de emisión
    B: En la fecha indicada como la fecha de vencimiento del período de admisión autorizado
    C: 120 días a partir de la fecha de emisión
    D: Al final del término legal estándar para todos los conductores
  answer: B
  explanation: El manual especifica que una credencial vencerá en la fecha indicada
    como la fecha de vencimiento del período de admisión autorizado.
- id: 391
  category: license_system
  question: ¿Cómo se compara el periodo de emisión de una licencia de conducir para
    un no ciudadano con los términos legales estándar?
  choices:
    A: Debe ser siempre exactamente igual al término legal estándar.
    B: Puede emitirse por un periodo menor a los términos descritos en el estatuto.
    C: Siempre se emite por exactamente un año.
    D: Siempre se emite por exactamente cuatro años, independientemente del estatus.
  answer: B
  explanation: 'El manual establece: ''Una licencia de conducir o tarjeta de identificación
    de no conductor emitida a un no ciudadano puede emitirse por un periodo menor
    a los términos descritos en el estatuto''.'
- id: 392
  category: license_system
  question: ¿Qué formularios están debidamente avalados o sellados para mostrar el
    estatus del Sistema de Información de Estudiantes y Visitantes de Intercambio
    (SEVIS)?
  choices:
    A: Formulario I-94 o Formulario I-551
    B: Formulario I-20 o DS-2019
    C: Formulario I-130 o I-140
    D: Formulario I-765 o I-485
  answer: B
  explanation: El manual enumera el 'Sistema de Información de Estudiantes y Visitantes
    de Intercambio (SEVIS) (Formulario I-20) o (DS-2019) debidamente avalado o sellado'
    como un documento aceptable.
- id: 393
  category: license_system
  question: ¿Qué documento es aceptable para establecer que una persona es un indígena
    americano nacido en Canadá?
  choices:
    A: Una licencia de conducir canadiense estándar
    B: Una carta o documento tribal
    C: Un pasaporte canadiense sin ningún código específico
    D: Un certificado de nacimiento provincial
  answer: B
  explanation: El manual enumera una 'Carta o documento tribal que establezca que
    la persona es un indígena americano nacido en Canadá' como documentación aceptable.
- id: 394
  category: license_system
  question: ¿Se considera una solicitud de asilo pendiente como un documento aceptable
    para demostrar la presencia legal?
  choices:
    A: No, no es aceptable hasta que esté completamente aprobada.
    B: Sí, una solicitud de asilo aprobada o pendiente es aceptable.
    C: Sí, pero solo si va acompañada de una licencia de conducir extranjera válida.
    D: No, solo es aceptable una solicitud pendiente de estatus de protección temporal.
  answer: B
  explanation: El manual enumera explícitamente 'Una solicitud de asilo aprobada o
    pendiente' como un documento aceptable.
- id: 395
  category: license_system
  question: ¿Qué departamentos federales emiten 'otros documentos' que indican la
    presencia legal bajo la Ley de Inmigración y Nacionalidad?
  choices:
    A: Departamento de Educación o Departamento de Trabajo
    B: Departamento de Transporte o Departamento de Estado
    C: Departamento de Justicia o Seguridad Nacional (Homeland Security)
    D: Departamento del Tesoro o Departamento de Defensa
  answer: C
  explanation: El manual acepta 'Cualquier otro documento emitido por el Departamento
    de Justicia o Seguridad Nacional (Homeland Security) de los Estados Unidos...
    que indique la presencia legal en los Estados Unidos'.
- id: 396
  category: license_system
  question: ¿Qué significan las siglas del sello ADIT en relación con el documento
    I-551?
  choices:
    A: Alien Documentation and Identification System (Sistema de Documentación e Identificación
      de Extranjeros)
    B: Authorized Departure and Immigration Tracking
    C: American Document of Immigration and Travel
    D: Alien Departure and Identification Tracker
  answer: A
  explanation: El manual se refiere al 'sello I-551 del Sistema de Documentación e
    Identificación de Extranjeros (ADIT)'.
- id: 397
  category: license_system
  question: ¿Cuál de los siguientes se enumera como un documento aceptable para demostrar
    la presencia legal?
  choices:
    A: Una licencia de conducir extranjera vencida
    B: Una Tarjeta de Autorización de Empleo
    C: Una tarjeta de registro de votante extranjero
    D: Un permiso de conducir internacional
  answer: B
  explanation: La 'Tarjeta de Autorización de Empleo' se enumera explícitamente como
    un documento aceptable (Ítem E) en el manual.
- id: 398
  category: license_system
  question: ¿Una carta o notificación que reconozca a una persona como víctima de
    un delito es aceptable de conformidad con qué Ley?
  choices:
    A: La Ley de Reforma y Control de la Inmigración de 1986
    B: La Ley REAL ID de 2005
    C: La Ley de Protección a Víctimas de la Trata y la Violencia de 2000
    D: La Ley Patriota (Patriot Act)
  answer: C
  explanation: El manual acepta una 'Carta o notificación que reconozca a la persona
    como víctima de un delito de conformidad con la Ley de Protección a Víctimas de
    la Trata y la Violencia de 2000'.
- id: 399
  category: license_system
  question: Si un Formulario de Llegada/Salida I-94 o un pasaporte extranjero está
    sellado con la Sección 207, ¿qué estatus indica esto?
  choices:
    A: Persona con permiso de permanencia temporal (Parolee)
    B: Asilado (Asylee)
    C: Refugiado (Refugee)
    D: Entrante condicional
  answer: C
  explanation: El manual enumera los documentos sellados con 'Sección 207 Refugiado'
    como aceptables.
- id: 400
  category: license_system
  question: ¿Qué tipo de pasaporte con código S13 es aceptable junto con un Formulario
    de Llegada/Salida I-94?
  choices:
    A: Pasaporte mexicano
    B: Pasaporte británico
    C: Pasaporte canadiense
    D: Pasaporte francés
  answer: C
  explanation: El manual enumera el 'Formulario de Llegada/Salida I-94 o pasaporte
    canadiense con código S13' como un documento aceptable.
- id: 401
  category: license_system
  question: ¿Una carta que demuestre que una persona tiene un caso prima facie como
    cónyuge autopeticionario es aceptable de conformidad con qué Ley?
  choices:
    A: La Ley de Violencia Contra la Mujer (Violence Against Women Act)
    B: La Ley de Igualdad de Oportunidades de Crédito (Equal Credit Opportunity Act)
    C: La Ley de Derechos Civiles (Civil Rights Act)
    D: La Ley de Licencia Médica y Familiar (Family and Medical Leave Act)
  answer: A
  explanation: El manual acepta una 'carta o notificación que demuestre que la persona
    tiene un caso prima facie como cónyuge autopeticionario de conformidad con la
    Ley de Violencia Contra la Mujer (Violence Against Women Act)'.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y continúe con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 402
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 403
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 404
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 405
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 406
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 407
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 408
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 409
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona donde está prohibido adelantar.
  id: 410
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que deben hacer los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 411
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 412
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos animales cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 413
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 414
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 415
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 416
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 417
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 418
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 419
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera gire
    primero en un sentido y luego en el otro.
  id: 420
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 421
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 422
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la vía y ajuste
    su posición en el carril.
  id: 423
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 424
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 425
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 426
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 427
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 428
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca
    donde el semáforo puede no ser visible desde la distancia.
  id: 429
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 430
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 431
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 432
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 433
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 434
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 435
