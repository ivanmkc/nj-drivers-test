questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de aprendizaje en Maine?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: Según el Manual del Conductor de Maine, una persona debe tener al menos
    15 años de edad para solicitar un permiso de aprendizaje.
- id: 2
  category: license_system
  question: Para una persona menor de 21 años, ¿cuánto tiempo debe tener el permiso
    de aprendizaje antes de ser elegible para realizar el examen de conducir?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Maine exige que los titulares de permisos menores de 21 años
    mantengan su permiso durante al menos seis meses antes de poder realizar el examen
    de manejo.
- id: 3
  category: license_system
  question: Bajo las leyes de Licencia de Conducir Graduada (GDL) de Maine, ¿cuántas
    horas de práctica de manejo debe completar el titular de un permiso menor de 21
    años antes de realizar el examen de conducir?
  choices:
    A: 40 horas, incluyendo 5 de noche
    B: 50 horas, incluyendo 10 de noche
    C: 70 horas, incluyendo 10 de noche
    D: 100 horas, incluyendo 20 de noche
  answer: C
  explanation: Maine requiere 70 horas de práctica de manejo, y al menos 10 de esas
    horas deben ser nocturnas.
- id: 4
  category: license_system
  question: ¿Cuánto tiempo duran las restricciones de una licencia intermedia para
    un conductor de Maine que es menor de 21 años?
  choices:
    A: 180 días
    B: 270 días
    C: 1 año
    D: Hasta que cumpla 18 años
  answer: B
  explanation: En Maine, las restricciones de la licencia intermedia (como los límites
    de pasajeros y de conducción nocturna) permanecen en vigor durante 270 días.
- id: 5
  category: license_system
  question: ¿A un conductor de Maine con una licencia intermedia se le prohíbe operar
    un vehículo motorizado entre qué horas?
  choices:
    A: 10:00 PM y 4:00 AM
    B: 11:00 PM y 5:00 AM
    C: 12:00 AM (medianoche) y 5:00 AM
    D: 1:00 AM y 6:00 AM
  answer: C
  explanation: Los titulares de licencias intermedias en Maine tienen restringido
    conducir entre las 12 a.m. y las 5 a.m.
- id: 6
  category: license_system
  question: En Maine, ¿quién tiene permitido sentarse en el asiento delantero para
    supervisar al titular de un permiso de aprendizaje?
  choices:
    A: Cualquier conductor con licencia mayor de 18 años
    B: Un conductor con licencia de al menos 20 años de edad que haya tenido una licencia
      válida durante al menos 2 años
    C: Solo un padre o tutor legal
    D: Cualquier conductor con licencia que tenga al menos 21 años
  answer: B
  explanation: La persona que acompaña al titular del permiso debe tener al menos
    20 años de edad, haber tenido una licencia válida durante al menos dos años y
    ocupar el asiento al lado del conductor.
- id: 7
  category: license_system
  question: Si se muda a Maine y tiene una licencia de conducir válida de otro estado,
    ¿cuántos días tiene para obtener una licencia de conducir de Maine?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes de Maine deben obtener una licencia de conducir
    de Maine dentro de los 30 días posteriores a la fecha en que establezcan su residencia.
- id: 8
  category: license_system
  question: ¿Cuál es la agudeza visual mínima requerida para obtener una licencia
    de conducir de Maine sin restricciones?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Maine requiere una agudeza visual mínima de 20/40 en el mejor ojo para
    calificar para una licencia sin restricciones.
- id: 9
  category: license_system
  question: Bajo el sistema de puntos de Maine, ¿cuántos puntos de demérito en un
    período de 12 meses resultarán en la suspensión de la licencia?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: Si un conductor acumula 12 o más puntos de demérito en un período de
    12 meses, su licencia será suspendida.
- id: 10
  category: license_system
  question: ¿Cuánto tiempo permanecen los puntos de demérito en el registro de un
    conductor en Maine para fines de cálculo de suspensión?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: En Maine, los puntos de demérito se cuentan para la suspensión si se
    obtuvieron dentro de los 12 meses anteriores.
- id: 11
  category: license_system
  question: ¿Cuál es el monto mínimo de cobertura de seguro de responsabilidad civil
    requerido en Maine por lesiones o muerte de una persona?
  choices:
    A: $25,000
    B: $50,000
    C: $100,000
    D: $20,000
  answer: B
  explanation: La ley de Maine exige un seguro de responsabilidad civil mínimo de
    $50,000 por lesiones o muerte de una persona.
- id: 12
  category: license_system
  question: Para un conductor menor de 21 años, ¿cuál es el límite legal de contenido
    de alcohol en sangre (BAC) en Maine?
  choices:
    A: 0.00% (Tolerancia Cero)
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: Maine tiene una ley de tolerancia cero para conductores menores de
    21 años; es ilegal que operen un vehículo con cualquier cantidad medible de alcohol
    en su sistema.
- id: 13
  category: license_system
  question: ¿Cuál de las siguientes es una restricción para un conductor con una licencia
    intermedia de Maine?
  choices:
    A: No pueden conducir en la autopista Maine Turnpike
    B: No pueden llevar a ningún pasajero que no sea miembro de su familia inmediata
    C: Siempre deben conducir con un adulto con licencia mayor de 21 años
    D: No pueden conducir a más de 45 mph
  answer: B
  explanation: Los titulares de licencias intermedias tienen restringido el transporte
    de pasajeros que no sean miembros de la familia inmediata, a menos que vayan acompañados
    por un conductor con licencia que cumpla con los requisitos de supervisión.
- id: 14
  category: license_system
  question: En Maine, ¿cuántos días tiene para notificar a la Oficina de Vehículos
    Motorizados (BMV) sobre un cambio de nombre o dirección?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Maine exige que notifique a la BMV dentro de los 30 días
    posteriores a un cambio en su nombre o dirección permanente.
- id: 15
  category: license_system
  question: ¿Cuál es la duración estándar de una licencia de conducir de Maine para
    una persona menor de 65 años?
  choices:
    A: 4 años
    B: 5 años
    C: 6 años
    D: 8 años
  answer: C
  explanation: En Maine, una licencia de conducir estándar se emite típicamente por
    un período de 6 años para conductores menores de 65 años.
- id: 16
  category: license_system
  question: En Maine, si reprueba su examen práctico de conducción, ¿cuántos días
    debe esperar antes de ser elegible para realizar el examen nuevamente?
  choices:
    A: 7 días
    B: 14 días
    C: 30 días
    D: 45 días
  answer: D
  explanation: Según el Manual del Conductor de Maine, si un solicitante reprueba
    el examen práctico, debe esperar al menos 45 días antes de poder ser reexaminado.
- id: 17
  category: license_system
  question: Para una persona de 21 años o más, ¿durante qué período de tiempo se considera
    'provisional' la primera licencia de conducir de Maine emitida?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: En Maine, si tiene 21 años o más, su primera licencia es provisional
    por un período de un año. Para los menores de 21 años, es de dos años.
- id: 18
  category: license_system
  question: Según la ley de Maine, ¿una persona es clasificada como 'Infractor Habitual'
    si acumula cuántas condenas graves por vehículos motorizados en un período de
    tres años?
  choices:
    A: '2'
    B: '3'
    C: '4'
    D: '5'
  answer: B
  explanation: La ley de Infractor Habitual de Maine se aplica a personas que han
    sido condenadas por tres o más infracciones graves de vehículos motorizados (como
    OUI o conducir con la licencia suspendida) en un período de tres años.
- id: 19
  category: license_system
  question: Una licencia de conducir estándar Clase C de Maine le permite operar un
    solo vehículo con una Clasificación de Peso Bruto del Vehículo (GVWR) de hasta
    ¿cuántas libras?
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: Una licencia Clase C es la licencia de operador estándar en Maine y
    cubre cualquier vehículo individual con un GVWR de menos de 26,001 libras (lbs).
- id: 20
  category: license_system
  question: Si un conductor de Maine es arrestado por OUI (conducir bajo la influencia)
    y se niega a someterse a una prueba química, su licencia será suspendida inmediatamente
    por al menos ¿cuántos días por una primera negativa?
  choices:
    A: 90 días
    B: 150 días
    C: 275 días
    D: 1 año
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito de Maine, una primera negativa
    a someterse a una prueba química resulta en una suspensión administrativa de la
    licencia de 275 días.
- id: 21
  category: license_system
  question: ¿Cuál es la tarifa estándar para restablecer una licencia de conducir
    de Maine tras una suspensión por una infracción de OUI (conducir bajo los efectos
    del alcohol o drogas)?
  choices:
    A: $25
    B: $50
    C: $100
    D: $200
  answer: B
  explanation: La ley de Maine exige una tarifa de restablecimiento de $50 para la
    mayoría de las suspensiones, incluido el OUI, aunque también se aplican otras
    tarifas, como una de $50 por no pagar la manutención infantil o una de $50 por
    suspensiones generales.
- id: 22
  category: license_system
  question: En Maine, ¿con qué frecuencia deben inspeccionarse los vehículos motorizados
    por motivos de seguridad en una estación de inspección oficial?
  choices:
    A: Cada 6 meses
    B: Una vez al año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: La ley de Maine exige que todos los vehículos motorizados registrados
    en el estado se sometan a una inspección de seguridad una vez al año.
- id: 23
  category: license_system
  question: En Maine, se requiere un Certificado de Título para todos los vehículos
    motorizados, excepto para aquellos que sean anteriores a qué año de modelo?
  choices:
    A: '1985'
    B: '1990'
    C: '1995'
    D: '2000'
  answer: C
  explanation: Maine no exige títulos para vehículos que sean del año de modelo 1994
    o anteriores. Los vehículos de 1995 y posteriores deben tener un título.
- id: 24
  category: license_system
  question: Bajo el sistema de puntos de demérito de Maine, ¿cuántos puntos se asignan
    por una condena por operar un vehículo motorizado de 15 a 29 millas por hora por
    encima del límite de velocidad?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Exceder el límite de velocidad entre 15 y 29 mph en Maine resulta en
    la adición de 6 puntos de demérito al registro del conductor.
- id: 25
  category: license_system
  question: Para obtener una licencia de Maine que cumpla con la ley REAL ID, ¿cuántos
    documentos que acrediten la residencia en Maine debe presentar el solicitante?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Ninguno, si tiene un certificado de nacimiento
  answer: B
  explanation: Para cumplir con los requisitos de REAL ID en Maine, los solicitantes
    deben presentar dos documentos distintos que establezcan la residencia en Maine.
- id: 26
  category: license_system
  question: Para que se añada la designación de 'Veterano' a una licencia de conducir
    de Maine, ¿qué documento debe proporcionar normalmente el solicitante al BMV?
  choices:
    A: Una tarjeta de identificación militar
    B: Una carta del VA (Administración de Veteranos)
    C: Un Formulario DD 214 (Documentos de baja)
    D: Un pasaporte estadounidense válido
  answer: C
  explanation: Los conductores de Maine que son veteranos con baja honorable pueden
    solicitar que se imprima 'Veterano' en su licencia presentando su Formulario DD
    214 o un documento de baja equivalente.
- id: 27
  category: license_system
  question: En Maine, una persona que tiene una condición médica que causa 'desmayos'
    o 'pérdida del conocimiento', ¿cuánto tiempo debe pasar sin sufrir convulsiones
    antes de poder obtener la licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 24 meses
  answer: B
  explanation: Las normas médicas de Maine generalmente exigen que una persona con
    antecedentes de convulsiones o pérdida del conocimiento esté libre de tales episodios
    durante 6 meses antes de ser elegible para una licencia.
- id: 28
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje de motocicleta
    de Maine?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: D
  explanation: Un permiso de aprendizaje de motocicleta de Maine es válido por dos
    años a partir de la fecha de emisión.
- id: 29
  category: license_system
  question: 'Para una primera infracción de OUI (conducir bajo los efectos del alcohol
    o drogas) en Maine (mayores de 21 años), el período de suspensión administrativa
    de la licencia por parte del BMV es normalmente de:'
  choices:
    A: 30 días
    B: 90 días
    C: 150 días
    D: 275 días
  answer: C
  explanation: Para una primera infracción de OUI en la que el conductor tiene 21
    años o más y no se negó a la prueba, el BMV impone una suspensión administrativa
    de 150 días.
- id: 30
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una Licencia de Conducir Comercial
    (CDL) Clase A o Clase B en Maine para operaciones intraestatales (solo dentro
    de Maine)?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: En Maine, debe tener al menos 18 años para solicitar una CDL para operación
    intraestatal, pero debe tener 21 años para operar un vehículo comercial a través
    de las fronteras estatales (interestatal).
- id: 31
  category: driver_testing
  question: ¿Para aprobar el examen escrito de conocimientos de Maine, cuál es el
    número mínimo de preguntas que debe responder correctamente de un total de 30?
  choices:
    A: '15'
    B: '20'
    C: '24'
    D: '28'
  answer: C
  explanation: Según el Manual del Automovilista de Maine, el examen de conocimientos
    consta de 30 preguntas y debe responder correctamente al menos 24 preguntas para
    aprobar (80%).
- id: 32
  category: driver_testing
  question: 'En Maine, debe presentar un informe oficial de accidente ante el BMV
    si los daños a la propiedad de cualquier persona parecen ser de al menos:'
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $2,500
  answer: B
  explanation: La ley de Maine exige que cualquier accidente que resulte en lesiones
    corporales, muerte o daños a la propiedad de $1,000 o más debe ser reportado al
    Secretario de Estado.
- id: 33
  category: driver_testing
  question: Si un conductor de Maine es condenado por rebasar por primera vez un autobús
    escolar detenido con sus luces rojas intermitentes, ¿cuál es el período de suspensión
    obligatoria de la licencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Según la ley de Maine, una primera infracción por rebasar ilegalmente
    un autobús escolar detenido con las luces rojas intermitentes resulta en una suspensión
    obligatoria de la licencia de 30 días y una multa mínima de $250.
- id: 34
  category: driver_testing
  question: La ley de "Hacerse a un lado" (Move Over) de Maine exige que los conductores
    reduzcan la velocidad o cambien de carril al acercarse a ¿cuál de los siguientes
    vehículos estacionarios con luces activadas?
  choices:
    A: Solo vehículos de policía y bomberos
    B: Solo ambulancias y vehículos de rescate
    C: Vehículos de emergencia, remolque y servicios públicos
    D: Solo quitanieves
  answer: C
  explanation: La ley de Maine exige que los conductores se muevan a otro carril o
    reduzcan la velocidad ante todos los vehículos de emergencia estacionarios, incluidos
    los de policía, bomberos, médicos, remolque y vehículos de servicios públicos.
- id: 35
  category: driver_testing
  question: ¿Cuál es la multa mínima por una primera infracción por usar un dispositivo
    electrónico portátil mientras se conduce en Maine?
  choices:
    A: $25
    B: $50
    C: $150
    D: $500
  answer: B
  explanation: La ley de Maine prohíbe el uso de dispositivos electrónicos portátiles
    mientras se opera un vehículo motorizado. La multa por una primera infracción
    no es inferior a $50.
- id: 36
  category: driver_testing
  question: ¿Con qué frecuencia debe someterse a una inspección de seguridad un vehículo
    motorizado registrado en Maine?
  choices:
    A: Cada 6 meses
    B: Una vez al año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Todos los vehículos motorizados registrados en Maine deben ser inspeccionados
    una vez al año para garantizar que cumplen con los estándares de seguridad.
- id: 37
  category: driver_testing
  question: En Maine, ¿a cuántos pies de distancia de un vehículo que viene en sentido
    contrario debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Maine exige que los conductores bajen las luces altas cuando
    se encuentren a menos de 500 pies de un vehículo que viene en sentido contrario
    y a menos de 300 pies de un vehículo al que están siguiendo.
- id: 38
  category: driver_testing
  question: Según la ley de Maine, ¿es ilegal estacionar a menos de cuántos pies de
    un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Maine prohíbe estacionar a menos de 10 pies de un hidrante
    de incendios.
- id: 39
  category: driver_testing
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo de pasajeros en Maine?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Maine exige que los neumáticos tengan una profundidad de
    banda de rodadura de al menos 2/32 de pulgada para ser considerados seguros y
    legales.
- id: 40
  category: driver_testing
  question: Al estacionar en paralelo en una vía pública en Maine, ¿sus ruedas deben
    estar a menos de cuántas pulgadas de la acera?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: El Manual del Automovilista de Maine establece que cuando se estaciona
    en una vía pública, se debe estacionar de forma paralela y a menos de 12 pulgadas
    de la acera.
- id: 41
  category: driver_testing
  question: En Maine, ¿con cuántos pies de antelación, como mínimo, debe activar la
    luz de giro antes de realizar un giro o cambiar de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Maine exige que los conductores indiquen su intención de
    girar o cambiar de carril al menos 100 pies antes de realizar la maniobra.
- id: 42
  category: driver_testing
  question: ¿Qué sucede con la multa por exceso de velocidad en una zona de obras
    designada en Maine cuando hay trabajadores presentes?
  choices:
    A: Aumenta en $50
    B: Se duplica
    C: Se triplica
    D: Sigue siendo la misma que una multa estándar
  answer: B
  explanation: En Maine, las multas por exceso de velocidad en una zona de obras designada
    se duplican para proteger a los trabajadores viales y a los conductores.
- id: 43
  category: driver_testing
  question: La ley de Maine exige que los conductores enciendan sus faros delanteros
    en ¿cuál de las siguientes condiciones climáticas?
  choices:
    A: Solo cuando está nevando
    B: Solo cuando hay niebla
    C: Siempre que los limpiaparabrisas estén en uso constante
    D: Solo durante una tormenta eléctrica
  answer: C
  explanation: La ley de Maine exige que los faros se enciendan siempre que los limpiaparabrisas
    estén en uso constante debido a la lluvia, la neblina o la nieve.
- id: 44
  category: driver_testing
  question: Durante el examen de conducción de Maine, ¿cuál de las siguientes acciones
    resultará en una reprobación automática?
  choices:
    A: No usar la luz de giro una vez
    B: Un accidente o casi accidente que requiera la intervención del examinador
    C: Ajustar el asiento antes de arrancar el motor
    D: Conducir ligeramente por debajo del límite de velocidad
  answer: B
  explanation: Durante el examen de conducción, cualquier acción que resulte en un
    accidente, o un casi accidente donde el examinador deba tomar el control del vehículo,
    se considera una reprobación automática.
- id: 45
  category: driver_testing
  question: Si un conductor no aprueba el examen de la vista en una oficina del BMV
    de Maine, ¿cuál es el procedimiento requerido?
  choices:
    A: Debe esperar un año para volver a realizarlo
    B: Queda descalificado permanentemente para conducir
    C: Debe presentar un formulario de visión completado por un oculista
    D: Puede omitir el examen de la vista si tiene un historial limpio
  answer: C
  explanation: Si un solicitante no aprueba el examen de la vista, debe presentar
    un formulario de visión completado por un profesional de la salud visual para
    determinar si puede conducir de manera segura con o sin restricciones.
- id: 46
  category: driver_testing
  question: En Maine, ¿cuál es el límite de velocidad máximo en una zona escolar cuando
    hay niños presentes o cuando las luces amarillas están parpadeando?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según el Manual del Automovilista de Maine, el límite de velocidad
    en una zona escolar es de 15 mph cuando hay niños presentes o cuando las luces
    están parpadeando.
- id: 47
  category: driver_testing
  question: Según la ley de Maine, ¿cuándo debe encender los faros delanteros en relación
    con la puesta del sol y el amanecer?
  choices:
    A: Desde la puesta del sol hasta el amanecer
    B: Una hora después de la puesta del sol hasta una hora antes del amanecer
    C: Desde media hora después de la puesta del sol hasta media hora antes del amanecer
    D: Solo cuando está lo suficientemente oscuro como para no poder ver a 200 pies
      de distancia
  answer: C
  explanation: La ley de Maine exige que los faros se enciendan desde media hora después
    de la puesta del sol hasta media hora antes del amanecer.
- id: 48
  category: driver_testing
  question: ¿Cuál es la distancia de seguimiento recomendada detrás del vehículo que
    va delante de usted en condiciones normales de conducción en Maine?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: La longitud de un automóvil por cada 10 mph
  answer: B
  explanation: El Manual del Automovilista de Maine recomienda una distancia de seguimiento
    de al menos 3 segundos para permitir suficiente tiempo para reaccionar ante peligros.
- id: 49
  category: driver_testing
  question: ¿A cuántos pies de distancia de un hidrante de incendios debe estacionarse
    en el estado de Maine?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: En Maine, es ilegal estacionarse a menos de 10 pies de un hidrante
    de incendios.
- id: 50
  category: driver_testing
  question: ¿Entre qué fechas se permite el uso de neumáticos para nieve con clavos
    en las carreteras de Maine?
  choices:
    A: Del 1 de noviembre al 1 de abril
    B: Del 1 de octubre al 1 de mayo
    C: Del 1 de diciembre al 15 de marzo
    D: Del 15 de octubre al 15 de abril
  answer: B
  explanation: En Maine, los neumáticos con clavos están permitidos desde el 1 de
    octubre hasta el 1 de mayo.
- id: 51
  category: driver_testing
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima desde cualquier dirección, la ley de Maine le exige:'
  choices:
    A: Reducir la velocidad y permanecer en su carril
    B: Aumentar la velocidad para despejar el camino
    C: Orillarse a la derecha lo más posible y detenerse
    D: Detenerse exactamente donde se encuentra
  answer: C
  explanation: La ley de Maine exige que los conductores se orillen a la derecha y
    se detengan ante los vehículos de emergencia que utilicen sirenas o luces.
- id: 52
  category: driver_testing
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad civil por daños
    a la propiedad requerido por la ley de Maine?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Maine exige un mínimo de $25,000 en cobertura de responsabilidad
    civil por daños a la propiedad.
- id: 53
  category: driver_testing
  question: 'En Maine, debe informar un accidente de tráfico a la policía si los daños
    a la propiedad parecen ser de:'
  choices:
    A: $500 o más
    B: $1,000 o más
    C: $2,000 o más
    D: $5,000 o más
  answer: B
  explanation: La ley de Maine exige que los accidentes se informen a la policía si
    hay heridos, muertes o daños a la propiedad de $1,000 o más.
- id: 54
  category: driver_responsibility
  question: ¿Cuánto requiere la ley de Maine, como mínimo, que cubra el seguro de
    responsabilidad civil de un vehículo motorizado por la lesión o muerte de más
    de una persona en un solo accidente?
  choices:
    A: $50,000
    B: $75,000
    C: $100,000
    D: $150,000
  answer: C
  explanation: Los requisitos mínimos de seguro de responsabilidad civil de Maine
    a menudo se denominan 50/100/25, donde $100,000 es el mínimo por la lesión o muerte
    de más de una persona.
- id: 55
  category: driver_responsibility
  question: 'Además de la cobertura de responsabilidad civil, la ley de Maine exige
    que las pólizas de seguro de vehículos motorizados incluyan una cobertura mínima
    de pagos médicos de:'
  choices:
    A: $1,000
    B: $2,000
    C: $5,000
    D: $10,000
  answer: B
  explanation: La ley de Maine (Título 24-A §2902-D) exige un mínimo de $2,000 en
    cobertura de pagos médicos para la protección del asegurado y los pasajeros.
- id: 56
  category: driver_responsibility
  question: Si establece su residencia en Maine, ¿cuántos días tiene para registrar
    su vehículo motorizado ante la Oficina de Vehículos Motorizados (BMV) de Maine?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes deben registrar sus vehículos en Maine dentro
    de los 30 días posteriores a la fecha en que establezcan su residencia.
- id: 57
  category: driver_responsibility
  question: ¿Con qué frecuencia deben los vehículos motorizados registrados en Maine
    pasar una inspección oficial de seguridad?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En Maine, la mayoría de los vehículos motorizados deben ser inspeccionados
    anualmente en una estación de inspección oficial para garantizar que cumplan con
    los estándares de seguridad.
- id: 58
  category: driver_responsibility
  question: Si un conductor de Maine se ve involucrado en un accidente y no puede
    proporcionar una prueba de responsabilidad financiera (seguro), ¿qué medida tomará
    el Secretario de Estado?
  choices:
    A: Emitir una advertencia
    B: Suspender la licencia de conducir y el registro del vehículo
    C: Imponer una sentencia de cárcel obligatoria de 10 días
    D: Requerir que el conductor vuelva a tomar el examen escrito
  answer: B
  explanation: No proporcionar una prueba de seguro cuando se está involucrado en
    un accidente o cuando lo solicita la policía resulta en la suspensión tanto de
    la licencia de conducir como del registro del vehículo.
- id: 59
  category: driver_responsibility
  question: Según la ley de Maine, ¿cuál es la multa máxima por una primera condena
    por arrojar basura desde un vehículo motorizado?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Arrojar basura es ilegal en Maine, y una primera condena puede resultar
    en una multa de hasta $500.
- id: 60
  category: driver_responsibility
  question: La ley de 'Recipiente Abierto' (Open Container) de Maine prohíbe la posesión
    de un recipiente de bebida alcohólica abierto en qué parte del vehículo?
  choices:
    A: Solo en el maletero
    B: Solo en la guantera
    C: En el área de pasajeros de un vehículo motorizado en una vía pública
    D: En cualquier lugar dentro del vehículo, incluido el maletero
  answer: C
  explanation: La ley de Maine prohíbe la posesión de un recipiente abierto de alcohol
    en el área de pasajeros de un vehículo motorizado mientras se encuentra en una
    vía pública. Esto incluye al conductor y a todos los pasajeros.
- id: 61
  category: driver_responsibility
  question: 'Si un accidente reportable en Maine NO es investigado por un oficial
    de policía, el conductor debe presentar un informe por escrito a la Secretaría
    de Estado en un plazo de:'
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 7 días
  answer: B
  explanation: Si un accidente que cumple con el umbral de reporte no es investigado
    por un oficial de policía, el conductor está obligado a presentar un informe a
    la Secretaría de Estado en un plazo de 48 horas.
- id: 62
  category: driver_responsibility
  question: ¿Cuándo se requiere que un conductor de Maine muestre evidencia de seguro?
  choices:
    A: Solo cuando está involucrado en un accidente
    B: Solo al registrar un vehículo
    C: Al registrar un vehículo, durante la inspección y cuando lo solicite un oficial
      de la ley
    D: Solo al renovar una licencia de conducir
  answer: C
  explanation: En Maine se requiere prueba de seguro durante el registro del vehículo,
    en el momento de la inspección anual de seguridad y siempre que un oficial de
    policía lo solicite.
- id: 63
  category: driver_responsibility
  question: En Maine, ¿cuál es la tarifa para restablecer una licencia de conducir
    que fue suspendida específicamente por una infracción de OUI (Operar Bajo la Influencia)?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: D
  explanation: Si bien la tarifa estándar de restablecimiento es de $50, la ley de
    Maine establece que la tarifa de restablecimiento para suspensiones relacionadas
    con el alcohol o las drogas (OUI) es de $200.
- id: 64
  category: driver_responsibility
  question: 'Según los estándares de inspección de vehículos de Maine, un neumático
    se considera inseguro y no pasará la inspección si la profundidad de la banda
    de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Las normas de inspección de seguridad de Maine requieren que los neumáticos
    tengan al menos 2/32 de pulgada de profundidad en la banda de rodadura.
- id: 65
  category: driver_responsibility
  question: En Maine, ¿cuál es la transmitancia de luz mínima permitida para el polarizado
    de las ventanas laterales a la izquierda y derecha del conductor?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La ley de Maine exige que el polarizado de las ventanas laterales delanteras
    permita el paso de al menos el 35% de la luz.
- id: 66
  category: driver_responsibility
  question: En Maine, ¿se debe presentar un informe por escrito a la Secretaría de
    Estado si un accidente resulta en daños a la propiedad estimados en o por encima
    de qué cantidad?
  choices:
    A: $500
    B: $750
    C: $1,000
    D: $2,000
  answer: C
  explanation: Según el Manual del Conductor de Maine, cualquier accidente que involucre
    una lesión, muerte o daños a la propiedad de $1,000 o más debe informarse a la
    Secretaría de Estado.
- id: 67
  category: driver_responsibility
  question: En Maine, ¿cuál es el requisito mínimo de seguro de responsabilidad civil
    por la lesión o muerte de más de una persona en un solo accidente?
  choices:
    A: $50,000
    B: $100,000
    C: $150,000
    D: $200,000
  answer: B
  explanation: Maine requiere un mínimo de $100,000 por la lesión o muerte de más
    de una persona en cualquier accidente (parte del requisito 50/100/25).
- id: 68
  category: driver_responsibility
  question: Si un conductor de Maine es condenado por operar un vehículo motorizado
    sin seguro, ¿cuál es la multa mínima por una primera infracción?
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: B
  explanation: No presentar evidencia de seguro en Maine puede resultar en una multa
    de entre $100 y $500 y la suspensión de la licencia de conducir y el registro.
- id: 69
  category: driver_responsibility
  question: Si se ve involucrado en un accidente en Maine y no tiene el seguro de
    responsabilidad civil requerido, ¿qué debe hacer para evitar la suspensión de
    la licencia?
  choices:
    A: Pagar una multa de $500 de inmediato
    B: Presentar un certificado 'SR-22' y depositar una fianza o efectivo por los
      daños
    C: Realizar 100 horas de servicio comunitario
    D: No hay forma de evitar la suspensión si no tiene seguro
  answer: B
  explanation: Según la Ley de Responsabilidad Financiera de Maine, si no tiene seguro
    durante un accidente, debe proporcionar prueba de responsabilidad financiera futura
    (SR-22) y cumplir con los requisitos de daños mediante una fianza o depósito.
- id: 70
  category: driver_responsibility
  question: ¿A quién pagan típicamente los residentes de Maine el impuesto especial
    (excise tax) anual sobre vehículos antes de poder registrar su vehículo?
  choices:
    A: La Policía Estatal de Maine
    B: La Secretaría de Estado
    C: La oficina municipal o del ayuntamiento local
    D: El Servicio de Impuestos Internos (IRS)
  answer: C
  explanation: Los residentes de Maine deben pagar un impuesto especial a su ciudad
    o pueblo de residencia antes de que el vehículo pueda registrarse en la Oficina
    de Vehículos Motorizados.
- id: 71
  category: driver_responsibility
  question: ¿Si un conductor de Maine elige una póliza de seguro de "Límite Único
    Combinado" (CSL) en lugar de límites divididos, cuál es el monto mínimo requerido?
  choices:
    A: $100,000
    B: $125,000
    C: $150,000
    D: $200,000
  answer: B
  explanation: La ley de Maine permite una póliza de Límite Único Combinado de al
    menos $125,000 como alternativa a los límites divididos de 50/100/25.
- id: 72
  category: driver_responsibility
  question: En Maine, ¿el conductor es legalmente responsable de asegurar que todos
    los pasajeros menores de qué edad estén debidamente sujetos con un cinturón de
    seguridad o un asiento de seguridad para niños?
  choices:
    A: Menores de 12 años
    B: Menores de 16 años
    C: Menores de 18 años
    D: Menores de 21 años
  answer: C
  explanation: En Maine, el conductor es responsable de cualquier pasajero menor de
    18 años. Los pasajeros de 18 años o más son responsables de sí mismos.
- id: 73
  category: driver_responsibility
  question: Si desarrolla una condición médica que pueda afectar su capacidad para
    conducir de manera segura, ¿cuántos días tiene para notificar a la Oficina de
    Vehículos Motorizados (BMV) de Maine?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La ley de Maine exige que los conductores notifiquen a la BMV dentro
    de los 30 días si desarrollan una condición física o mental que pueda afectar
    su capacidad para operar un vehículo motorizado de manera segura.
- id: 74
  category: driver_responsibility
  question: En Maine, ¿durante qué período de tiempo es legal usar neumáticos para
    nieve con clavos en un vehículo motorizado?
  choices:
    A: Del 1 de noviembre al 1 de abril
    B: Del 1 de octubre al 1 de mayo
    C: Del 1 de diciembre al 1 de marzo
    D: Del 15 de octubre al 15 de abril
  answer: B
  explanation: La ley de Maine permite el uso de neumáticos con clavos desde el 1
    de octubre hasta el 1 de mayo de cada año.
- id: 75
  category: safe_driving_rules
  question: Según la ley de Maine, ¿a cuántos pies de distancia debe estacionarse
    de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Maine prohíbe estacionarse a menos de 10 pies de un hidrante
    de incendios.
- id: 76
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    y el brazo de parada extendido, ¿la ley de Maine exige que los conductores se
    detengan al menos a cuántos pies de distancia?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: En Maine, debe detenerse al menos a 30 pies de un autobús escolar que
    esté recibiendo o dejando pasajeros con sus luces rojas intermitentes.
- id: 77
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad predeterminado en un distrito comercial
    o residencial de Maine, a menos que se indique lo contrario?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: A menos que se indique lo contrario, el límite de velocidad legal en
    los distritos comerciales y residenciales de Maine es de 25 mph.
- id: 78
  category: safe_driving_rules
  question: ¿Qué exige la ley de "Hacerse a un lado" (Move Over) de Maine que hagan
    los conductores al acercarse a un vehículo de emergencia autorizado que esté detenido
    con sus luces intermitentes en una carretera de varios carriles?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Moverse a un carril no adyacente si es seguro hacerlo, o reducir la velocidad
      a una velocidad razonable
    D: Acelerar para rebasar el vehículo lo más rápido posible
  answer: C
  explanation: La ley Move Over de Maine exige que los conductores se muevan a un
    carril que no sea adyacente al vehículo de emergencia si es posible; de lo contrario,
    deben reducir la velocidad a una velocidad segura y razonable.
- id: 79
  category: safe_driving_rules
  question: En Maine, ¿se prohíbe estacionar a menos de cuántos pies de un cruce de
    peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Maine establece que no se puede estacionar a menos de 15
    pies de un cruce de peatones en una intersección.
- id: 80
  category: safe_driving_rules
  question: Al operar los limpiaparabrisas en Maine debido a la lluvia, la nieve o
    la niebla, ¿qué más debe hacer por ley?
  choices:
    A: Encender las luces de emergencia (luces de advertencia)
    B: Encender la luz interior del techo
    C: Encender los faros delanteros
    D: Conducir al menos 15 mph por debajo del límite de velocidad
  answer: C
  explanation: La ley de Maine exige que se enciendan los faros delanteros cuando
    los limpiaparabrisas estén en uso constante debido a las condiciones climáticas.
- id: 81
  category: safe_driving_rules
  question: ¿Cuál es la sanción por una primera infracción por exceso de velocidad
    en una zona de obras designada en Maine?
  choices:
    A: Solo una advertencia
    B: Una multa fija de $500
    C: La multa se duplica
    D: Revocación inmediata de la licencia
  answer: C
  explanation: En Maine, las multas por exceso de velocidad en una zona de obras se
    duplican cuando hay trabajadores presentes.
- id: 82
  category: safe_driving_rules
  question: ¿Qué 'regla' recomienda el Manual del Automovilista de Maine para mantener
    una distancia de seguimiento segura detrás del vehículo que va delante de usted?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cinco segundos
  answer: C
  explanation: El manual del conductor de Maine recomienda una distancia de seguimiento
    mínima de tres segundos en condiciones normales de conducción.
- id: 83
  category: safe_driving_rules
  question: En Maine, ¿a cuántos pies de la entrada de la vía de acceso de una estación
    de bomberos está prohibido estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: La ley de Maine prohíbe estacionar a menos de 20 pies de la entrada
    de la vía de acceso de cualquier estación de bomberos.
- id: 84
  category: safe_driving_rules
  question: ¿A cuántos pies de distancia debe estacionar de una señal de alto (stop),
    una señal de ceda el paso (yield) o una señal de control de tráfico en Maine?
  choices:
    A: 20 pies
    B: 30 pies
    C: 40 pies
    D: 50 pies
  answer: B
  explanation: La ley de Maine prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto, señal de ceda el paso o señal de control de
    tráfico.
- id: 85
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en las carreteras rurales de Maine
    a menos que se indique lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: En Maine, el límite de velocidad legal para todas las demás carreteras
    (caminos rurales que no tienen otra señalización) es de 45 mph.
- id: 86
  category: safe_driving_rules
  question: Al planear girar, ¿con cuántos pies de antelación requiere la ley de Maine
    que señalice su intención antes del giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: En Maine, debe señalizar al menos 100 pies antes de realizar un giro
    para proporcionar una advertencia adecuada a otros conductores.
- id: 87
  category: safe_driving_rules
  question: En Maine, ¿a cuántos pies de una intersección o un cruce de ferrocarril
    no se permite desplazarse al lado izquierdo de la carretera para adelantar a otro
    vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: La ley de Maine prohíbe adelantar por la izquierda cuando se encuentra
    a menos de 100 pies de una intersección o un cruce de ferrocarril.
- id: 88
  category: safe_driving_rules
  question: Al adelantar a una bicicleta en Maine, ¿cuál es la distancia mínima que
    debe dejar entre su vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Maine exige que los automovilistas dejen al menos 3 pies
    de espacio libre al adelantar a un ciclista.
- id: 89
  category: safe_driving_rules
  question: Según el Manual del Automovilista de Maine, ¿a qué velocidad puede comenzar
    el hidroplaneo (cuando los neumáticos pierden contacto con la carretera sobre
    el agua)?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Automovilista de Maine establece que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph bajo lluvia intensa.
- id: 90
  category: safe_driving_rules
  question: Al entrar en una rotonda en Maine, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que entra en la rotonda
    B: El vehículo que ya está en la rotonda
    C: El vehículo que viaja a la velocidad más alta
    D: El vehículo que entra por la derecha
  answer: B
  explanation: En las rotondas de Maine, el tráfico que entra debe ceder el derecho
    de paso a los vehículos que ya están circulando dentro de la intersección.
- id: 91
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de virar bruscamente,
    ¿con cuánta anticipación debe observar el camino mientras conduce en Maine?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: Solo hasta donde alcancen sus faros delanteros
  answer: B
  explanation: El manual de conducción de Maine recomienda mirar de 10 a 15 segundos
    hacia adelante. Esto le permite ver los peligros con anticipación y ajustar su
    velocidad o posición de manera segura.
- id: 92
  category: defensive_driving
  question: Según la ley de Maine, ¿cuándo debe atenuar sus luces altas (cambiar a
    luces bajas) al acercarse a un vehículo que viene en sentido contrario?
  choices:
    A: Dentro de los 200 pies
    B: Dentro de los 300 pies
    C: Dentro de los 500 pies
    D: Dentro de los 1,000 pies
  answer: C
  explanation: La ley de Maine exige que los conductores atenúen sus luces altas cuando
    un vehículo que se aproxima está a menos de 500 pies para evitar cegar al otro
    conductor.
- id: 93
  category: defensive_driving
  question: Cuando sigue a otro vehículo por la noche en Maine, ¿a qué distancia debe
    atenuar sus luces altas (cambiar a luces bajas)?
  choices:
    A: Dentro de los 100 pies
    B: Dentro de los 300 pies
    C: Dentro de los 500 pies
    D: Dentro de los 600 pies
  answer: B
  explanation: La ley de Maine exige que cambie a luces bajas cuando siga a otro vehículo
    a una distancia de 300 pies o menos, para que sus luces no se reflejen en el espejo
    retrovisor del otro conductor.
- id: 94
  category: defensive_driving
  question: 'La ley de Maine exige que encienda los faros delanteros siempre que use
    los limpiaparabrisas debido a la lluvia, nieve o aguanieve. Esto se conoce como:'
  choices:
    A: La Regla de Visibilidad
    B: La Ley de Limpiaparabrisas Encendidos, Luces Encendidas (Wipers-On, Lights-On
      Law)
    C: El Mandato de Clima Adverso
    D: La Ley de Iluminación de Seguridad
  answer: B
  explanation: De acuerdo con el Título 29-A §2091 de Maine, los faros delanteros
    deben estar encendidos cuando los limpiaparabrisas están en uso debido a condiciones
    atmosféricas como lluvia, nieve o neblina.
- id: 95
  category: defensive_driving
  question: En Maine, ¿cuál es el requisito legal con respecto a la nieve y el hielo
    en su vehículo antes de conducir?
  choices:
    A: Solo necesita limpiar el lado del conductor del parabrisas
    B: Debe limpiar solo las ventanas delanteras y traseras
    C: Debe limpiar todas las ventanas y cualquier acumulación de nieve o hielo que
      pueda representar un peligro para los demás
    D: No existe una ley específica siempre que pueda ver el camino
  answer: C
  explanation: La ley de Maine (Título 29-A §2396) prohíbe operar un vehículo con
    cualquier cantidad de nieve o hielo que pueda caer y poner en peligro a otros
    automovilistas o peatones. Todas las ventanas también deben estar despejadas para
    la visibilidad.
- id: 96
  category: defensive_driving
  question: Si un animal grande, como un alce o un ciervo, corre frente a su vehículo
    en una carretera de Maine, ¿cuál es la acción de conducción defensiva más segura?
  choices:
    A: Virar bruscamente hacia el carril opuesto para evitarlo
    B: Frenar firmemente, permanecer en su carril y no virar bruscamente
    C: Acelerar para pasar al animal antes de que lo golpee
    D: Usar las luces altas y tocar la bocina continuamente
  answer: B
  explanation: El Manual del Conductor de Maine aconseja que si una colisión con un
    animal es inevitable, debe frenar y permanecer en su carril. Virar bruscamente
    puede provocar una colisión frontal más grave o un vuelco.
- id: 97
  category: defensive_driving
  question: Al conducir con niebla densa en Maine, ¿qué luces debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (intermitentes)
  answer: B
  explanation: Se deben usar las luces bajas en la niebla. Las luces altas se reflejan
    en la niebla y crean un resplandor que dificulta la visión.
- id: 98
  category: defensive_driving
  question: Cuando las carreteras están resbaladizas debido a la lluvia o la nieve
    en Maine, ¿cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla igual que en clima seco
    B: Disminuirla para mantenerse más cerca de las huellas del auto de adelante
    C: Aumentarla al menos al doble de la distancia de seguimiento normal
    D: Mantener siempre exactamente 100 pies
  answer: C
  explanation: En condiciones adversas, debe aumentar su distancia de seguimiento
    (a menudo a 6 segundos o más) para compensar el aumento de las distancias de frenado
    en superficies resbaladizas.
- id: 99
  category: defensive_driving
  question: Al acercarse a una curva cerrada en un camino rural de Maine, ¿cuándo
    debe reducir su velocidad?
  choices:
    A: Cuando esté a mitad de la curva
    B: Antes de entrar en la curva
    C: Solo si siente que los neumáticos se deslizan
    D: Inmediatamente después de salir de la curva
  answer: B
  explanation: La conducción defensiva requiere reducir la velocidad antes de entrar
    en una curva. Frenar mientras se está en la curva puede hacer que el vehículo
    derrape.
- id: 100
  category: defensive_driving
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad 'prima
    facie' en Maine para campo abierto o caminos rurales?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: En Maine, el límite de velocidad predeterminado para carreteras fuera
    de distritos comerciales o residenciales es de 45 mph, a menos que se indique
    lo contrario mediante señales.
- id: 101
  category: defensive_driving
  question: La distancia total de parada es la suma de la distancia de reacción y
    la distancia de frenado. A 50 mph, ¿aproximadamente cuántos pies recorrerá un
    vehículo antes de detenerse por completo en pavimento seco?
  choices:
    A: 50 pies
    B: 100 pies
    C: 188 a 200 pies
    D: 400 pies
  answer: C
  explanation: Según el Manual del Conductor de Maine, a 50 mph, la distancia total
    de parada es de aproximadamente 188 a 200 pies, incluyendo el tiempo de reacción
    y el frenado.
- id: 102
  category: defensive_driving
  question: En Maine, ¿a qué velocidad puede comenzar el hidroplaneo (donde los neumáticos
    pierden contacto con la carretera y se desplazan sobre una fina capa de agua)?
  choices:
    A: Tan baja como 35 mph
    B: Solo por encima de 55 mph
    C: Exactamente 45 mph
    D: Solo cuando se usa el control de crucero
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    En una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 50 mph.
- id: 103
  category: defensive_driving
  question: En Maine, al seguir a otro vehículo por la noche, ¿a cuántos pies de distancia
    de ese vehículo debe cambiar a las luces bajas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Maine exige que baje las luces altas cuando siga a otro vehículo
    a menos de 300 pies.
- id: 104
  category: defensive_driving
  question: ¿Qué configuración de faros debe usar para obtener la mejor visibilidad
    al conducir con niebla densa, lluvia o nieve en Maine?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: No se requieren luces durante el día
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla, lluvia o nieve.
    Las luces altas se reflejan en la humedad del aire, lo que provoca deslumbramiento
    y dificulta la visión.
- id: 105
  category: defensive_driving
  question: Maine es conocido por su fauna de gran tamaño. Si un alce o un ciervo
    salta repentinamente frente a su vehículo, ¿cuál es la acción defensiva recomendada?
  choices:
    A: Virar bruscamente hacia el carril opuesto
    B: Acelerar para minimizar el tiempo de impacto
    C: Frenar firmemente y permanecer en su carril
    D: Cerrar los ojos y soltar el volante
  answer: C
  explanation: La reacción más segura es frenar firmemente y permanecer en su carril.
    Virar bruscamente puede provocar una colisión frontal más grave o un vuelco.
- id: 106
  category: defensive_driving
  question: Según la ley de Maine, ¿qué debe hacer un conductor con respecto a la
    nieve y el hielo en su vehículo antes de conducir?
  choices:
    A: Limpiar solo el lado del conductor del parabrisas
    B: Limpiar solo las ventanas; la nieve en el techo está bien
    C: Limpiar toda la nieve y el hielo que puedan representar un peligro para los
      demás o dificultar la visión
    D: Nada, ya que el viento la quitará de forma natural
  answer: C
  explanation: La ley de Maine (Título 29-A § 2396) exige que los conductores se aseguren
    de que su vehículo no sea un peligro. Conducir con nieve o hielo que pueda salir
    volando y golpear a otro vehículo o dificultar su propia visión es ilegal.
- id: 107
  category: defensive_driving
  question: Al cambiar de carril en Maine, ¿por qué es importante revisar su 'punto
    ciego' mirando por encima del hombro?
  choices:
    A: Para revisar si hay peatones en la acera
    B: Porque los espejos no muestran los vehículos en ciertas áreas cerca de las
      esquinas traseras de su automóvil
    C: Para asegurarse de que su señal de giro esté funcionando
    D: Es un requisito legal solo para conductores comerciales
  answer: B
  explanation: Los espejos tienen límites. Mirar por encima del hombro es la única
    forma de asegurarse de que un vehículo no esté escondido en su punto ciego antes
    de moverse.
- id: 108
  category: alcohol_drugs_health
  question: En Maine, para un conductor de 21 años o más, ¿cuál es el nivel específico
    de contenido de alcohol en sangre (BAC) a partir del cual es ilegal operar un
    vehículo motorizado?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En Maine, es ilegal que cualquier persona de 21 años o más opere un
    vehículo motorizado con un BAC de 0.08% o superior.
- id: 109
  category: alcohol_drugs_health
  question: ¿Cuál es la multa mínima ordenada por el tribunal por una primera condena
    por OUI (Operar Bajo la Influencia) en Maine?
  choices:
    A: $250
    B: $400
    C: $500
    D: $1,000
  answer: C
  explanation: Una primera condena por OUI en Maine conlleva una multa mínima ordenada
    por el tribunal de $500.
- id: 110
  category: alcohol_drugs_health
  question: Según la ley de Maine, una infracción por OUI se considera 'agravada'
    y conlleva un mínimo obligatorio de 48 horas de cárcel si el BAC del conductor
    es igual o superior a qué nivel?
  choices:
    A: 0.08%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: En Maine, un BAC de 0.15% o superior es un factor agravante que resulta
    en un mínimo obligatorio de 48 horas de cárcel por una primera infracción.
- id: 111
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de "Consentimiento Implícito" (Implied Consent)
    de Maine para todos los conductores del estado?
  choices:
    A: Usted acepta que su vehículo sea registrado en cualquier momento.
    B: Usted acepta someterse a una prueba química de aliento, sangre u orina si se
      sospecha de OUI.
    C: Usted acepta tener un seguro mínimo de $100,000 por daños a la propiedad.
    D: Usted acepta ser grabado por cámaras de tráfico en todas las intersecciones.
  answer: B
  explanation: El Consentimiento Implícito significa que, al operar un vehículo en
    Maine, usted ha aceptado automáticamente someterse a una prueba química de aliento,
    sangre u orina si un oficial de la ley tiene una causa probable para creer que
    sus facultades están disminuidas.
- id: 112
  category: alcohol_drugs_health
  question: Antes de que se pueda restablecer una licencia de conducir de Maine tras
    una suspensión por OUI, ¿qué programa debe completar el individuo?
  choices:
    A: El Curso de Mejora del Conductor de Maine
    B: El Programa de Evaluación y Educación para Conductores (DEEP)
    C: El Seminario para Conductores de Alto Riesgo
    D: La Clínica de Concientización sobre Seguridad de Maine
  answer: B
  explanation: La ley de Maine exige que todas las personas suspendidas por OUI completen
    el Programa de Evaluación y Educación para Conductores (DEEP) antes de que se
    pueda restablecer su licencia.
- id: 113
  category: alcohol_drugs_health
  question: ¿Cómo trata la ley de Maine el conducir bajo la influencia de la marihuana
    en comparación con el alcohol?
  choices:
    A: La marihuana es legal, por lo que no se considera una infracción de OUI.
    B: Solo es una infracción si el conductor es menor de 21 años.
    C: Se trata igual que el deterioro por alcohol y está sujeto a las leyes de OUI.
    D: Se considera una infracción secundaria y solo conlleva una pequeña multa.
  answer: C
  explanation: Operar un vehículo motorizado mientras se está bajo los efectos de
    cualquier droga, incluida la marihuana (recreativa o medicinal), se trata igual
    que el deterioro por alcohol bajo las leyes de OUI de Maine.
- id: 114
  category: alcohol_drugs_health
  question: Si un conductor de Maine es condenado por una segunda infracción de OUI
    en un periodo de 10 años, ¿cuál es el periodo de suspensión obligatoria de la
    licencia?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Una segunda condena por OUI dentro de un periodo de 10 años en Maine
    resulta en una suspensión obligatoria de la licencia por 3 años.
- id: 115
  category: alcohol_drugs_health
  question: En Maine, un OUI se clasifica automáticamente como "agravado" si el conductor
    lleva un pasajero en el vehículo que es menor de ¿qué edad?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 12 años
  answer: C
  explanation: Operar bajo la influencia con un pasajero menor de 21 años es un factor
    agravante en Maine, lo que conlleva sanciones obligatorias más severas.
- id: 116
  category: alcohol_drugs_health
  question: ¿Puede un conductor de Maine ser acusado de OUI si conduce bajo la influencia
    de un medicamento recetado legalmente?
  choices:
    A: No, siempre que tenga una receta válida.
    B: No, el OUI solo se aplica a drogas ilegales y alcohol.
    C: Sí, si el medicamento afecta su capacidad para operar el vehículo de manera
      segura.
    D: Sí, pero solo si también tiene alcohol en su sistema.
  answer: C
  explanation: En Maine, se le puede acusar de OUI si cualquier sustancia (legal,
    ilegal o recetada) afecta sus facultades físicas o mentales.
- id: 117
  category: alcohol_drugs_health
  question: Cuando se consume alcohol, ¿cuál de los siguientes aspectos suele verse
    afectado primero?
  choices:
    A: La coordinación física
    B: La visión y la audición
    C: El juicio y el autocontrol
    D: El tiempo de reacción
  answer: C
  explanation: El juicio y el autocontrol son las primeras facultades que se ven afectadas
    por el alcohol, a menudo antes de que el conductor se dé cuenta de que se está
    intoxicando.
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de BAC para una persona que opera un vehículo
    motorizado comercial en Maine?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: En Maine, el límite legal de BAC para conductores comerciales (titulares
    de CDL) que operan un vehículo comercial es de 0.04%.
- id: 119
  category: alcohol_drugs_health
  question: Si un conductor de Maine se niega a someterse a una prueba química por
    segunda vez en un periodo de 10 años, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 1 año
    B: 18 meses
    C: 2 años
    D: 3 años
  answer: B
  explanation: Una segunda negativa a someterse a una prueba química en un plazo de
    10 años resulta en una suspensión de la licencia de 18 meses en Maine.
- id: 120
  category: alcohol_drugs_health
  question: 'En Maine, una infracción de OUI que resulta en la muerte de otra persona
    se clasifica como:'
  choices:
    A: Delito menor de Clase D
    B: Delito grave de Clase C
    C: Delito de Clase B
    D: Delito menor de Clase E
  answer: C
  explanation: Un OUI con resultado de muerte es un delito de Clase B en Maine, que
    puede conllevar una pena de prisión de hasta 10 años y una multa de hasta $20,000.
- id: 121
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' en relación con la conducción en Maine?
  choices:
    A: El efecto del alcohol que desaparece con el tiempo.
    B: El efecto combinado del alcohol y otras drogas que es mayor que la suma de
      sus partes.
    C: La velocidad a la que el hígado procesa el alcohol.
    D: El efecto psicológico de la presión de grupo al beber.
  answer: B
  explanation: El efecto sinérgico ocurre cuando se consumen alcohol y otras drogas
    (incluso las de venta libre) al mismo tiempo, lo que provoca un deterioro mucho
    mayor que el que causaría cualquiera de las sustancias por sí sola.
- id: 122
  category: alcohol_drugs_health
  question: Según la ley de Maine, si un conductor es condenado por una primera ofensa
    de OUI (conducir bajo la influencia) con un BAC (concentración de alcohol en sangre)
    de 0.15% o más, ¿cuál es la sentencia mínima obligatoria de cárcel?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: Una semana
  answer: B
  explanation: La ley de Maine exige un mínimo de 48 horas de cárcel por una primera
    condena de OUI si existen factores agravantes, como un BAC de 0.15% o más.
- id: 123
  category: alcohol_drugs_health
  question: Si un conductor de Maine es condenado por OUI mientras transporta a un
    pasajero menor de 21 años, ¿qué sanción adicional impone el tribunal?
  choices:
    A: Una sentencia obligatoria de 30 días de cárcel
    B: Una suspensión adicional de 275 días de su licencia de conducir
    C: Una revocación permanente de los privilegios de conducir
    D: Una multa obligatoria de $2,000
  answer: B
  explanation: En Maine, si se le condena por OUI y llevaba a un pasajero menor de
    21 años en el vehículo, el tribunal suspenderá su licencia por 275 días adicionales
    a la suspensión estándar.
- id: 124
  category: alcohol_drugs_health
  question: Con respecto al uso de marihuana y la conducción en Maine, ¿cuál de las
    siguientes afirmaciones es verdadera?
  choices:
    A: Es legal conducir bajo la influencia de la marihuana porque es legal para uso
      recreativo.
    B: Las leyes de OUI se aplican a la marihuana y otras drogas de la misma manera
      que al alcohol.
    C: Un conductor solo puede ser acusado de OUI si también está consumiendo alcohol.
    D: La marihuana no afecta la capacidad de conducir según la ley de Maine.
  answer: B
  explanation: En Maine, el cargo de Operar Bajo la Influencia (OUI) se aplica a cualquier
    sustancia intoxicante, incluyendo la marihuana, medicamentos recetados y medicamentos
    de venta libre, independientemente de su estatus legal.
- id: 125
  category: alcohol_drugs_health
  question: Para una primera condena por OUI en Maine (conductor de 21 años o más),
    ¿cuál es el período estándar de suspensión de la licencia ordenado por el tribunal?
  choices:
    A: 30 días
    B: 90 días
    C: 150 días
    D: Un año
  answer: C
  explanation: Una primera condena por OUI para un conductor de 21 años o más en Maine
    generalmente resulta en una suspensión de la licencia ordenada por el tribunal
    de 150 días.
- id: 126
  category: alcohol_drugs_health
  question: 'Bajo la ley de Consentimiento Implícito de Maine, al operar un vehículo
    motorizado, usted ha dado automáticamente su consentimiento para:'
  choices:
    A: Un registro del maletero de su vehículo
    B: Una prueba química de su aliento, sangre u orina
    C: Un registro de su casa
    D: Permitir que un oficial de policía conduzca su automóvil
  answer: B
  explanation: El Consentimiento Implícito significa que, al poseer una licencia de
    conducir de Maine u operar un vehículo en Maine, usted acepta someterse a pruebas
    químicas si un oficial de la ley tiene una causa probable para creer que usted
    está bajo los efectos de alguna sustancia.
- id: 127
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otras drogas, como medicamentos
    para el resfriado o recetas médicas, al conducir?
  choices:
    A: Los efectos del alcohol se anulan.
    B: No hay cambios en el nivel de deterioro.
    C: Puede multiplicar los efectos del alcohol y aumentar el deterioro.
    D: Hace que el conductor esté más alerta.
  answer: C
  explanation: Combinar alcohol con otras drogas puede crear un efecto sinérgico,
    lo que significa que el deterioro combinado es mucho mayor que el efecto de cualquiera
    de las sustancias por sí sola.
- id: 128
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de 'recuperar la sobriedad'
    o bajar su BAC antes de conducir?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Permitir que pase el tiempo para que su cuerpo procese el alcohol
  answer: D
  explanation: El tiempo es el único factor que reducirá el BAC de una persona. El
    café, las duchas y el ejercicio no aceleran la eliminación del alcohol del torrente
    sanguíneo.
- id: 129
  category: alcohol_drugs_health
  question: Si se descubre que un conductor de Maine menor de 21 años tiene cualquier
    'cantidad medible' de alcohol en su sistema, ¿cuál es el período de suspensión
    administrativa obligatoria de la licencia por una primera ofensa?
  choices:
    A: 90 días
    B: 180 días
    C: Un año
    D: Dos años
  answer: C
  explanation: Maine tiene una política de tolerancia cero para los conductores menores
    de 21 años. Cualquier cantidad medible de alcohol resultará en una suspensión
    administrativa de la licencia por un año.
- id: 130
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados y no está seguro de si afectarán
    su conducción, ¿qué debe hacer?
  choices:
    A: Conducir solo por carreteras familiares
    B: Preguntar a su médico o farmacéutico sobre los efectos secundarios
    C: Beber café para mantenerse despierto mientras conduce
    D: Esperar 30 minutos después de tomar la pastilla antes de conducir
  answer: B
  explanation: Es responsabilidad del conductor saber cómo le afectan los medicamentos.
    Siempre debe consultar a un profesional médico o leer las etiquetas de advertencia
    antes de operar un vehículo.
- id: 131
  category: alcohol_drugs_health
  question: ¿Si un oficial de la ley de Maine le pide que se someta a una prueba de
    sangre, aliento u orina y usted se niega, qué puede suceder en el tribunal?
  choices:
    A: La negativa no puede mencionarse en el tribunal.
    B: La negativa puede utilizarse como prueba en su contra en un juicio.
    C: El tribunal desestimará automáticamente el cargo de OUI.
    D: Solo se le multará con $50.
  answer: B
  explanation: Según la ley de Maine, si usted se niega a una prueba química, esa
    negativa es admisible como prueba en el tribunal y probablemente resultará en
    una suspensión administrativa de la licencia más larga que si hubiera fallado
    la prueba.
- id: 132
  category: penalties_and_points
  question: En Maine, ¿cuántos puntos de demérito se asignan a su historial de conducción
    por exceder el límite de velocidad indicado entre 15 y 29 millas por hora?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Según la Oficina de Vehículos Motorizados (BMV) de Maine, exceder el
    límite de velocidad entre 15 y 29 mph resulta en la adición de 6 puntos de demérito
    a su licencia.
- id: 133
  category: penalties_and_points
  question: Si un conductor de Maine es condenado por una primera infracción de OUI
    (conducir bajo la influencia) teniendo 21 años de edad o más, ¿por cuánto tiempo
    se suspenderá su licencia?
  choices:
    A: 30 días
    B: 90 días
    C: 150 días
    D: 1 año
  answer: C
  explanation: Una condena por primera infracción de OUI para un conductor de 21 años
    o más en Maine resulta en una suspensión de la licencia ordenada por el tribunal
    de 150 días.
- id: 134
  category: penalties_and_points
  question: En Maine, ¿cuántos puntos de demérito se imponen por 'seguir demasiado
    de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: La BMV de Maine asigna 4 puntos de demérito al historial de un conductor
    por la infracción de seguir demasiado de cerca.
- id: 135
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se añaden a un historial de conducción de
    Maine por no detenerse ante un autobús escolar con sus luces rojas intermitentes?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: Revocación automática
  answer: C
  explanation: No detenerse ante un autobús escolar es una infracción grave en Maine
    y conlleva una penalización de 6 puntos de demérito.
- id: 136
  category: penalties_and_points
  question: En Maine, ¿cuántos puntos de demérito se pueden eliminar del historial
    de un conductor por completar con éxito un curso aprobado de mejora del conductor?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: Los conductores en Maine pueden obtener una reducción de 3 puntos en
    su historial de conducción al completar un curso de mejora del conductor aprobado
    por el estado, aunque esto solo se puede hacer una vez cada 12 meses.
- id: 137
  category: penalties_and_points
  question: ¿Cuál es la multa mínima en Maine por una primera infracción de no detenerse
    ante un autobús escolar con sus luces rojas intermitentes?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: La ley de Maine exige una multa mínima de $250 por la primera infracción
    de rebasar a un autobús escolar detenido con sus luces rojas intermitentes.
- id: 138
  category: penalties_and_points
  question: Si un conductor con una licencia provisional de Maine es condenado por
    una infracción de tránsito por primera vez, ¿por cuánto tiempo se suspenderá su
    licencia?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Para una persona que posee una licencia provisional, la primera condena
    por una infracción de tránsito resulta en una suspensión de la licencia de 30
    días.
- id: 139
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan por 'no ceder el paso a un vehículo
    de emergencia' en Maine?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: No ceder el paso a un vehículo de emergencia es una infracción de 6
    puntos en el estado de Maine.
- id: 140
  category: penalties_and_points
  question: En Maine, ¿cuál es la multa por una primera infracción del uso del cinturón
    de seguridad para un conductor adulto?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: La multa por una primera infracción del cinturón de seguridad en Maine
    es de $50.
- id: 141
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan por 'Rebase ilegal' (Illegal Passing)
    en Maine?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: El BMV de Maine asigna 4 puntos de demérito por infracciones de rebase
    ilegal.
- id: 142
  category: penalties_and_points
  question: En Maine, si se le condena por exceso de velocidad de 30 millas por hora
    o más sobre el límite, se considera un delito penal. ¿Cuál es la suspensión administrativa
    de la licencia típica por esta infracción?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Exceder el límite de velocidad por 30 mph o más en Maine es un delito
    de Clase E y generalmente conlleva una suspensión de la licencia de 30 días.
- id: 143
  category: penalties_and_points
  question: ¿Cuántos puntos de demérito se asignan por 'Operar un vehículo motorizado
    sin licencia' (si la licencia está vencida o el conductor no tiene licencia)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: A
  explanation: Operar un vehículo motorizado sin licencia resulta en 2 puntos de demérito
    en el historial de conducción de Maine.
- id: 144
  category: penalties_and_points
  question: Un conductor de Maine que reciba un total de 6 puntos de demérito en un
    período de 12 meses recibirá ¿cuál de los siguientes?
  choices:
    A: Una suspensión obligatoria de la licencia
    B: Una carta de advertencia del Secretario de Estado
    C: El requisito de volver a tomar el examen de conducir
    D: Una multa de $500
  answer: B
  explanation: En Maine, cuando un conductor acumula 6 puntos de demérito en un período
    de 12 meses, el BMV envía una carta de advertencia al conductor.
- id: 145
  category: penalties_and_points
  question: En Maine, ¿cuál es el período de suspensión administrativa de la licencia
    por una primera condena por OUI (Operar bajo la influencia)?
  choices:
    A: 30 días
    B: 90 días
    C: 150 días
    D: 1 año
  answer: C
  explanation: Para una primera infracción de OUI en Maine, el período de suspensión
    administrativa de la licencia es de 150 días.
- id: 146
  category: penalties_and_points
  question: Bajo el sistema de puntos de Maine, ¿cuántos puntos se asignan por 'No
    ceder el paso a un vehículo de emergencia'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: No ceder el paso a un vehículo de emergencia es una infracción grave
    en Maine y conlleva 6 puntos de demérito.
- id: 147
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera condena por violar la ley de
    conducción manos libres de Maine (enviar mensajes de texto o usar un dispositivo
    portátil mientras conduce)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: La multa mínima por una primera infracción de la ley de conducción
    distraída/manos libres de Maine es de $250.
- id: 148
  category: penalties_and_points
  question: En Maine, ¿cuántos puntos de demérito se asignan por 'No detenerse ante
    una luz roja'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No detenerse ante una luz roja o una señal de alto resulta en 4 puntos
    de demérito en el historial de conducción de Maine.
- id: 149
  category: penalties_and_points
  question: Para una primera infracción de OUI en Maine, si el conductor llevaba a
    un pasajero menor de 21 años en el vehículo, ¿cuántos días adicionales se agregan
    al período de suspensión?
  choices:
    A: 90 días
    B: 180 días
    C: 275 días
    D: 365 días
  answer: C
  explanation: La ley de Maine impone una suspensión adicional de 275 días si una
    persona es condenada por OUI mientras transporta a un pasajero menor de 21 años.
- id: 150
  category: penalties_and_points
  question: ¿Cuál es el tiempo mínimo obligatorio de cárcel por una primera infracción
    de OUI en Maine si el BAC del conductor era de 0.15% o superior?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: B
  explanation: En Maine, una primera infracción de OUI conlleva un mínimo obligatorio
    de 48 horas de cárcel si el BAC es de 0.15% o más, o si el conductor excedía el
    límite de velocidad por 30 mph o más o eludía a un oficial.
- id: 151
  category: penalties_and_points
  question: ¿En Maine, cuántos puntos de demérito se asignan por 'Operar un vehículo
    motorizado con una licencia vencida' (vencida por menos de 90 días)?
  choices:
    A: 0 puntos
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: Operar con una licencia vencida (hasta 90 días) resulta en 2 puntos
    de demérito en Maine.
- id: 152
  category: penalties_and_points
  question: ¿En Maine, por cuántas condenas por exceso de velocidad en un período
    de 12 meses se suspenderá la licencia de conducir por 15 días?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Según las reglas del BMV de Maine, tres condenas por exceso de velocidad
    en un período de 12 meses resultarán en una suspensión de la licencia de 15 días.
- id: 153
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en una vía pública en Maine con sus
    luces rojas parpadeando y el brazo de parada extendido, ¿a qué distancia debe
    detener su vehículo?
  choices:
    A: Al menos 10 pies
    B: Al menos 20 pies
    C: Al menos 30 pies
    D: Al menos 50 pies
  answer: C
  explanation: En Maine, debe detenerse al menos a 30 pies de un autobús escolar que
    esté detenido con sus luces rojas parpadeando y el brazo de parada extendido,
    ya sea que se acerque por delante o por detrás.
- id: 154
  category: sharing_the_road
  question: ¿Cuál es la multa mínima por una primera infracción de la ley 'Move Over'
    (hacerse a un lado) de Maine?
  choices:
    A: Esperar una advertencia
    B: $100
    C: $250
    D: $500
  answer: C
  explanation: En Maine, la multa mínima por una primera infracción de la ley 'Move
    Over' es de $250.
- id: 155
  category: sharing_the_road
  question: Según la ley de Maine, ¿cuáles de los siguientes operadores de motocicletas
    están OBLIGADOS a usar un casco protector?
  choices:
    A: Solo los menores de 18 años
    B: Solo aquellos que operan con un permiso de aprendizaje
    C: Operadores en su primer año de licencia, menores de 18 años y titulares de
      permisos
    D: Todos los operadores de motocicletas independientemente de su edad o experiencia
  answer: C
  explanation: La ley de Maine exige el uso de casco para los operadores y pasajeros
    de motocicletas menores de 18 años, cualquier persona que opere con un permiso
    de aprendizaje y cualquier persona dentro del primer año de haber completado su
    examen de conducir de motocicleta.
- id: 156
  category: sharing_the_road
  question: 'Cuando un peatón cruza una calle guiado por un animal de servicio o lleva
    un bastón blanco (con o sin punta roja), la ley de Maine le exige:'
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Ceder el paso y detener su vehículo
    C: Rodearlos lentamente
    D: Solo detenerse si hay un cruce peatonal marcado
  answer: B
  explanation: La ley de Maine establece que los conductores deben ceder el paso y
    detenerse por completo ante cualquier peatón ciego o con discapacidad visual guiado
    por un animal de servicio o que lleve un bastón blanco.
- id: 157
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen 'No-Zones' (Zonas Prohibidas).
    ¿Dónde se encuentran estas zonas?
  choices:
    A: Solo directamente detrás del camión
    B: Solo en el lado izquierdo del camión
    C: Directamente en frente, directamente detrás y a ambos lados del camión
    D: Solo en los espejos del conductor
  answer: C
  explanation: Las 'No-Zones' son los grandes puntos ciegos alrededor de un camión
    donde el conductor no puede verlo. Estas se encuentran en la parte delantera,
    trasera y a ambos lados del vehículo.
- id: 158
  category: sharing_the_road
  question: En Maine, ¿es legal el 'lane splitting' (una motocicleta que circula entre
    dos carriles de tráfico detenido o en movimiento)?
  choices:
    A: Sí, si el tráfico se mueve a menos de 10 mph
    B: Sí, se recomienda para reducir la congestión
    C: No, es ilegal en Maine
    D: Solo para el personal de respuesta a emergencias
  answer: C
  explanation: El 'lane splitting' es ilegal en Maine. Las motocicletas tienen derecho
    al uso total de un carril y deben seguir las mismas reglas de tránsito que otros
    vehículos con respecto al uso de carriles.
- id: 159
  category: sharing_the_road
  question: 'Al seguir a un camión grande por la noche, siempre debe:'
  choices:
    A: Mantener las luces altas para que el conductor del camión pueda verlo
    B: Bajar la intensidad de sus faros para evitar cegar al conductor del camión
      a través de sus grandes espejos laterales
    C: Seguir lo más cerca posible para mantenerse en su corriente de aire
    D: Parpadear sus luces repetidamente antes de rebasar
  answer: B
  explanation: Los grandes espejos laterales de los camiones pueden reflejar la luz
    brillante hacia los ojos del conductor. Debe bajar la intensidad de sus faros
    al seguir a cualquier vehículo, especialmente a los camiones grandes.
- id: 160
  category: sharing_the_road
  question: 'En Maine, se requiere un emblema de vehículo de movimiento lento (un
    triángulo naranja con borde rojo) en los vehículos diseñados para viajar a velocidades
    de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio en todos
    los vehículos diseñados para viajar a velocidades de 25 mph o menos, como maquinaria
    agrícola o equipo de construcción.
- id: 161
  category: sharing_the_road
  question: 'Si usted conduce en una carretera de Maine con una mediana física o barrera
    que separa el tráfico, y un autobús escolar se detiene con las luces rojas intermitentes
    en el lado OPUESTO de la barrera, usted debe:'
  choices:
    A: Detenerse al menos a 30 pies de distancia
    B: Detenerse y esperar a que el conductor le haga una señal
    C: Reducir la velocidad a 15 mph
    D: Continuar con precaución; no es obligatorio detenerse
  answer: D
  explanation: En Maine, si se encuentra en una carretera dividida donde las calzadas
    están separadas por una barrera física (como una mediana), no es necesario detenerse
    ante un autobús escolar que esté en el otro lado de la barrera.
- id: 162
  category: sharing_the_road
  question: 'Cuando un ciclista realiza un giro a la izquierda en una intersección
    en Maine, se le permite:'
  choices:
    A: Girar únicamente desde la acera
    B: Usar el carril de giro a la izquierda al igual que un vehículo motorizado
    C: Cruzar únicamente como peatón en el paso de cebra
    D: Girar únicamente desde el extremo derecho del arcén
  answer: B
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    automovilistas. Se les permite desplazarse al carril de giro a la izquierda para
    realizar un giro.
- id: 163
  category: sharing_the_road
  question: Según la ley de Maine, ¿cuál es la distancia mínima que un automovilista
    debe mantener al adelantar a un ciclista o peatón?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Maine (Título 29-A, §2060) exige que los automovilistas dejen
    al menos 3 pies de distancia al adelantar a un ciclista o a un peatón.
- id: 164
  category: sharing_the_road
  question: En Maine, ¿a cuántos pies de distancia debe permanecer detrás de un camión
    de bomberos u otro equipo de bomberos que esté respondiendo a una alarma?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Maine (Título 29-A, §2054) prohíbe seguir a menos de 500
    pies a cualquier equipo de bomberos que esté respondiendo a una alarma.
- id: 165
  category: sharing_the_road
  question: Al acercarse a un peatón que lleva un bastón blanco o utiliza un perro
    guía en Maine, ¿qué acción debe tomar el conductor?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo
    D: Mantener la velocidad pero permanecer en el carril más alejado
  answer: C
  explanation: La ley de Maine exige que los conductores se detengan por completo
    cuando un peatón con un bastón blanco o un perro guía está cruzando o intentando
    cruzar la calle.
- id: 166
  category: sharing_the_road
  question: Al seguir a una motocicleta en Maine, ¿cuál es la distancia de seguimiento
    recomendada bajo condiciones ideales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 10 segundos
  answer: C
  explanation: El Manual del Conductor de Maine recomienda una distancia de seguimiento
    de al menos 4 segundos cuando se circula detrás de una motocicleta para tener
    en cuenta su capacidad de detenerse rápidamente y sortear los peligros de la carretera.
- id: 167
  category: sharing_the_road
  question: Si conduce por una carretera con una franja mediana o barrera física,
    ¿debe detenerse ante un autobús escolar que se encuentre en el lado opuesto de
    la barrera?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no es necesario detenerse si hay una barrera física
    C: Sí, pero solo si el conductor del autobús le hace una señal
    D: No, pero debe reducir la velocidad a 15 mph
  answer: B
  explanation: En Maine, los conductores que viajan en la dirección opuesta en una
    carretera dividida con una mediana física o barrera no están obligados a detenerse
    ante un autobús escolar.
- id: 168
  category: sharing_the_road
  question: 'Al adelantar a un vehículo tirado por caballos o a una persona que monta
    a caballo en Maine, usted debe:'
  choices:
    A: Tocar la bocina para advertir al jinete
    B: Acelerar el motor para pasar rápidamente
    C: Reducir la velocidad y evitar hacer ruidos fuertes
    D: Encender las luces altas
  answer: C
  explanation: La ley de Maine exige que los conductores actúen con un cuidado razonable,
    reduzcan la velocidad y eviten cualquier acción que pueda asustar al animal, como
    tocar la bocina o acelerar el motor.
- id: 169
  category: sharing_the_road
  question: ¿Qué es la 'No-Zone' (Zona Prohibida) en relación con los camiones grandes
    y autobuses?
  choices:
    A: El área donde no se permite circular a los camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      vehículo
    C: La zona de velocidad restringida para vehículos comerciales
    D: El límite de peso para los puentes
  answer: B
  explanation: La 'No-Zone' se refiere a los grandes puntos ciegos alrededor de un
    camión o autobús donde el conductor no puede ver a otros vehículos. Si no puede
    ver la cara del conductor del camión en su espejo lateral, él no puede verlo a
    usted.
- id: 170
  category: sharing_the_road
  question: 'En Maine, si no hay aceras, los peatones están legalmente obligados a
    caminar:'
  choices:
    A: En el lado derecho, con el flujo del tráfico
    B: En el lado izquierdo, de frente al tráfico que viene en sentido contrario
    C: En el centro de la carretera
    D: En el lado que tenga más sombra
  answer: B
  explanation: La ley de Maine exige que los peatones caminen por el lado izquierdo
    de la carretera de frente al tráfico cuando no hay aceras disponibles, para que
    puedan ver los vehículos que se aproximan.
- id: 171
  category: sharing_the_road
  question: ¿Cuando un ciclista circula por una carretera de Maine por la noche, se
    requiere que tenga una luz delantera visible desde al menos cuántos pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Maine (Título 29-A, §2063) exige que las bicicletas estén
    equipadas con una luz delantera visible desde una distancia de al menos 500 pies
    cuando se utilicen de noche.
- id: 172
  category: sharing_the_road
  question: ¿Qué suelen necesitar hacer los camiones grandes al realizar un giro a
    la derecha en una intersección?
  choices:
    A: Acelerar para despejar la intersección
    B: Abrirse hacia la izquierda antes de girar a la derecha
    C: Girar desde el carril del extremo izquierdo
    D: Detenerse y esperar a que todo el tráfico se despeje
  answer: B
  explanation: Debido a su longitud, los camiones grandes a menudo deben abrirse hacia
    la izquierda para completar un giro a la derecha sin que las ruedas traseras golpeen
    el bordillo.
- id: 173
  category: sharing_the_road
  question: En Maine, ¿cuántos puntos de demérito se asignan por la infracción de
    no ceder el paso a un vehículo de emergencia?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: Bajo el sistema de puntos de Maine, no ceder el paso a un vehículo
    de emergencia es una infracción grave que conlleva 6 puntos de demérito.
- id: 174
  category: sharing_the_road
  question: 'El emblema de vehículo de movimiento lento es una señal naranja triangular
    que debe exhibirse en la parte trasera de los vehículos que viajan a velocidades
    de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento (triángulo naranja con borde
    rojo) es obligatorio en los vehículos diseñados para viajar a velocidades de 25
    mph o menos.
- id: 175
  category: vehicle_information
  question: En Maine, ¿con qué frecuencia debe un vehículo motorizado someterse a
    una inspección de seguridad en una estación de inspección oficial?
  choices:
    A: Cada seis meses
    B: Una vez al año
    C: Cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Según la ley de Maine, los vehículos motorizados deben inspeccionarse
    una vez al año para garantizar que cumplen con los estándares de seguridad y emisiones.
- id: 176
  category: vehicle_information
  question: Según el Manual del Conductor de Maine, ¿cuál es la profundidad mínima
    legal de la banda de rodadura de los neumáticos?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: La ley de Maine exige que los neumáticos tengan al menos 2/32 de pulgada
    de profundidad en la banda de rodadura, medida en dos ranuras adyacentes principales.
- id: 177
  category: vehicle_information
  question: La ley de Maine exige que el freno de pie de un vehículo debe ser capaz
    de detener el vehículo en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Los estándares de inspección de vehículos motorizados de Maine exigen
    que el freno de servicio (freno de pie) sea capaz de detener el vehículo en un
    espacio de 30 pies a una velocidad de 20 mph.
- id: 178
  category: vehicle_information
  question: Según la ley de Maine, ¿cuál es el porcentaje mínimo de transmisión de
    luz requerido para el tintado de las ventanas laterales delanteras?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La ley de Maine especifica que el tintado de las ventanas laterales
    delanteras (a la izquierda y derecha del conductor) debe permitir el paso de al
    menos el 35% de la luz.
- id: 179
  category: vehicle_information
  question: 'La ley de Maine exige que la placa de matrícula trasera esté iluminada
    de modo que sea visible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La placa de matrícula trasera debe estar iluminada por una luz blanca
    para que los caracteres sean claramente visibles desde una distancia de al menos
    50 pies.
- id: 180
  category: vehicle_information
  question: 'Todo vehículo motorizado en Maine debe estar equipado con un espejo que
    permita al conductor ver la carretera hacia atrás a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Maine exige al menos un espejo retrovisor que proporcione
    una visión clara de la carretera hacia atrás durante al menos 200 pies.
- id: 181
  category: vehicle_information
  question: 'La bocina de un vehículo motorizado en Maine debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las normas de seguridad de Maine requieren una bocina que pueda escucharse
    desde una distancia no menor a 200 pies.
- id: 182
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones es ilegal con respecto al sistema de
    escape de un vehículo en Maine?
  choices:
    A: Usar un silenciador estándar
    B: Tener un tubo de escape que se extienda hasta el parachoques trasero
    C: Equipar el escape con un dispositivo de derivación (bypass) o de corte (cutout)
    D: Usar una punta de escape de acero inoxidable
  answer: C
  explanation: La ley de Maine prohíbe el uso de un dispositivo de corte (cutout),
    derivación (bypass) o un dispositivo similar que impida que el silenciador funcione
    para reducir el ruido.
- id: 183
  category: vehicle_information
  question: 'En Maine, los niños deben estar asegurados en un sistema de retención
    infantil aprobado por el gobierno federal hasta que tengan al menos:'
  choices:
    A: 40 libras
    B: 6 años de edad
    C: 8 años de edad u 80 libras y 57 pulgadas de altura
    D: 12 años de edad
  answer: C
  explanation: La ley de Maine exige que los niños utilicen un sistema de retención
    infantil hasta que pesen 80 libras, tengan 8 años de edad o midan 57 pulgadas
    de altura.
- id: 184
  category: vehicle_information
  question: 'Las señales de giro de un vehículo deben ser visibles para otros conductores
    desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Según las normas de inspección de Maine, las señales de giro deben
    ser visibles desde una distancia de al menos 100 pies bajo la luz solar normal.
- id: 185
  category: vehicle_information
  question: En Maine, el centro de los faros delanteros de un vehículo debe estar
    montado a una altura de no más de ¿cuántas pulgadas del suelo?
  choices:
    A: 36 pulgadas
    B: 48 pulgadas
    C: 54 pulgadas
    D: 60 pulgadas
  answer: C
  explanation: La ley de Maine especifica que los faros delanteros deben estar montados
    entre 22 y 54 pulgadas del suelo, medidos hasta el centro del lente.
- id: 186
  category: vehicle_information
  question: Además de la noche y el uso de los limpiaparabrisas, la ley de Maine exige
    que los faros delanteros se enciendan cuando no se puede ver al menos a ¿cuántos
    pies de distancia?
  choices:
    A: 500 pies
    B: 800 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Las reglas de conducción de Maine exigen el uso de faros delanteros
    siempre que no se pueda ver a 1,000 pies de distancia debido a la niebla, lluvia,
    nieve u otras condiciones.
- id: 187
  category: vehicle_information
  question: 'En Maine, debe cambiar de luces altas a luces bajas cuando siga a otro
    vehículo a una distancia de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: Ninguna; las luces altas siempre están permitidas al seguir a otro vehículo
  answer: A
  explanation: Según el Manual del Conductor de Maine, debe cambiar a luces bajas
    cuando siga a otro vehículo a una distancia de 100 pies o menos.
- id: 188
  category: vehicle_information
  question: Según la ley de Maine, ¿durante qué período está prohibido operar un vehículo
    equipado con neumáticos que tengan clavos metálicos?
  choices:
    A: Entre el 1 de mayo y el 1 de octubre
    B: Entre el 1 de abril y el 1 de noviembre
    C: Entre el 1 de junio y el 1 de septiembre
    D: Entre el 1 de marzo y el 1 de diciembre
  answer: A
  explanation: La ley de Maine (Título 29-A, §1919) prohíbe el uso de neumáticos con
    clavos entre el 1 de mayo y el 1 de octubre.
- id: 189
  category: vehicle_information
  question: 'En Maine, los faros de luces altas de su vehículo deben ser capaces de
    revelar personas y vehículos a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 350 pies
    D: 500 pies
  answer: C
  explanation: Las leyes de equipamiento de vehículos de Maine exigen que las luces
    altas sean lo suficientemente potentes como para revelar objetos a una distancia
    de al menos 350 pies.
- id: 190
  category: signs_and_signals
  question: Cuando se encuentre con un semáforo en rojo intermitente en Maine, ¿cómo
    debe proceder?
  choices:
    A: Reduzca la velocidad y proceda con precaución sin detenerse.
    B: Deténgase solo si hay tráfico transversal.
    C: Trátelo como una señal de alto; deténgase por completo y ceda el derecho de
      paso.
    D: Deténgase y espere a que la luz cambie a verde.
  answer: C
  explanation: Una luz roja intermitente significa lo mismo que una señal de alto.
    Debe detenerse por completo, ceder el paso al tráfico transversal o a los peatones,
    y avanzar cuando sea seguro.
- id: 191
  category: signs_and_signals
  question: ¿Qué indica una luz de tráfico amarilla intermitente a un conductor en
    Maine?
  choices:
    A: La luz está a punto de cambiar a rojo; deténgase inmediatamente.
    B: Reduzca la velocidad y proceda con precaución.
    C: Usted tiene el derecho de paso sobre todo el resto del tráfico.
    '0': Deténgase y espere a que la luz cambie a verde.
  answer: B
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y estar especialmente alerta. No es necesario detenerse, pero debe proceder con
    precaución.
- id: 192
  category: signs_and_signals
  question: En Maine, ¿qué indica una señal amarilla en forma de banderín ubicada
    en el lado izquierdo de la carretera?
  choices:
    A: Zona escolar
    B: Ceda el paso adelante
    C: Zona de no adelantar (No Passing Zone)
    D: Cruce de ferrocarril
  answer: C
  explanation: Una señal en forma de banderín se utiliza específicamente para marcar
    el inicio de una "Zona de no adelantar". Se coloca en el lado izquierdo de la
    carretera para que sea visible para los conductores que intentan adelantar.
- id: 193
  category: signs_and_signals
  question: Si está utilizando señales manuales porque sus luces direccionales no
    funcionan, ¿qué señal indica un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana.
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados.
    C: Brazo izquierdo extendido hacia abajo en un ángulo de 90 grados.
    D: Brazo derecho extendido recto hacia afuera de la ventana.
  answer: B
  explanation: Para señalar un giro a la derecha mediante señales manuales, el conductor
    debe extender su brazo izquierdo por la ventana y doblarlo hacia arriba en un
    ángulo de 90 grados.
- id: 194
  category: signs_and_signals
  question: ¿Qué significan las líneas amarillas sólidas dobles en el centro de la
    calzada?
  choices:
    A: Se permite adelantar desde cualquier lado.
    B: Se permite adelantar solo por la derecha.
    C: Se prohíbe adelantar en ambas direcciones.
    D: La carretera es una calle de sentido único.
  answer: C
  explanation: Las líneas amarillas sólidas dobles indican que no se permite adelantar
    a los vehículos que viajan en cualquier dirección.
- id: 195
  category: signs_and_signals
  question: Una señal en forma de diamante con fondo amarillo, ¿qué tipo de señal
    es?
  choices:
    A: Señal reglamentaria
    B: Señal de guía
    C: Señal de advertencia
    D: Señal de servicio
  answer: C
  explanation: Las señales amarillas en forma de diamante son señales de advertencia
    que alertan a los conductores sobre posibles peligros o cambios en las condiciones
    de la carretera más adelante.
- id: 196
  category: signs_and_signals
  question: ¿Cuál es el significado de una línea blanca sólida pintada en el borde
    derecho de la carretera?
  choices:
    A: Marca el borde del carril de circulación (línea de niebla).
    B: Indica un carril donde se permite adelantar.
    C: Marca el centro de una carretera de doble sentido.
    D: Indica un cruce de peatones.
  answer: A
  explanation: Una línea blanca sólida en el lado derecho de la carretera se llama
    línea de niebla o línea de borde. Ayuda a los conductores a mantenerse en su carril
    durante periodos de poca visibilidad.
- id: 197
  category: signs_and_signals
  question: En Maine, ¿se le permite girar a la derecha con luz roja?
  choices:
    A: No, debe esperar a que la luz cambie a verde.
    B: Sí, pero solo si no hay tráfico transversal.
    C: Sí, después de detenerse por completo y ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba.
    D: Sí, pero solo entre las 9 PM y las 6 AM.
  answer: C
  explanation: La ley de Maine permite girar a la derecha en rojo después de una parada
    completa y ceder el paso a los demás, siempre que no haya una señal que indique
    específicamente "No Turn on Red" (No girar en rojo).
- id: 198
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla fija?
  choices:
    A: Acelere para despejar la intersección antes de que cambie a rojo.
    B: La luz está a punto de cambiar a rojo; debe detenerse si es seguro hacerlo.
    C: Deténgase inmediatamente, incluso si se encuentra en medio de la intersección.
    D: La luz está a punto de cambiar a verde.
  answer: B
  explanation: Una luz amarilla fija indica que la señal está cambiando a rojo. Los
    conductores deben detenerse si pueden hacerlo de manera segura; de lo contrario,
    deben despejar la intersección con precaución.
- id: 199
  category: signs_and_signals
  question: ¿Qué señal manual es la correcta para reducir la velocidad o detenerse?
  choices:
    A: Brazo izquierdo hacia afuera y apuntando hacia el suelo con la palma abierta.
    B: Brazo izquierdo hacia afuera y apuntando hacia el cielo.
    C: Brazo izquierdo extendido recto.
    D: Brazo derecho agitándose en movimiento circular.
  answer: A
  explanation: Para señalar que está reduciendo la velocidad o deteniéndose, extienda
    el brazo izquierdo por la ventana y apúntelo hacia abajo con la palma de la mano
    hacia atrás.
- id: 200
  category: signs_and_signals
  question: ¿De qué color son las señales utilizadas para proporcionar información
    sobre parques estatales y áreas recreativas en Maine?
  choices:
    A: Azul
    B: Verde
    C: Marrón
    D: Naranja
  answer: C
  explanation: En Maine y en todo Estados Unidos, las señales de color marrón se utilizan
    para proporcionar orientación hacia áreas de recreación pública y puntos de interés
    panorámicos.
- id: 201
  category: signs_and_signals
  question: ¿Qué se le permite hacer cuando un semáforo muestra una luz roja fija
    y una flecha verde fija?
  choices:
    A: Detenerse y esperar a que la luz roja cambie a verde antes de avanzar.
    B: Avanzar con precaución en la dirección de la flecha, cediendo el paso a los
      peatones.
    C: Avanzar en cualquier dirección siempre que sea seguro.
    D: El semáforo está averiado; trátelo como una parada de cuatro vías.
  answer: B
  explanation: Una flecha verde significa que tiene un giro "protegido". Puede avanzar
    en la dirección de la flecha incluso si la señal principal está en rojo, pero
    aún debe ceder el paso a los peatones en el cruce peatonal.
- id: 202
  category: signs_and_signals
  question: Según el Manual del Conductor de Maine, ¿cuál es la señal manual correcta
    para indicar que está disminuyendo la velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo, con la palma hacia atrás
    D: Brazo derecho extendido hacia afuera de la ventana del pasajero
  answer: C
  explanation: En Maine, la señal manual para disminuir la velocidad o detenerse es
    el brazo izquierdo extendido hacia abajo con la palma hacia atrás.
- id: 203
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en el estado de Maine?
  choices:
    A: Disminuir la velocidad y avanzar con precaución
    B: La luz está a punto de cambiar a rojo fijo
    C: Detenerse y ceder el paso como lo haría en una señal de alto (stop)
    D: El semáforo está averiado; ignórelo
  answer: C
  explanation: Una luz roja intermitente en Maine tiene el mismo significado que una
    señal de alto. Debe detenerse por completo y ceder el paso al tráfico transversal
    antes de avanzar.
- id: 204
  category: signs_and_signals
  question: 'Una señal en forma de banderín (un triángulo isósceles que apunta a la
    derecha) situada en el lado izquierdo de la carretera indica:'
  choices:
    A: Una zona escolar
    B: Una zona de no rebasar (prohibido adelantar)
    C: Un requisito de ceder el paso
    D: Un cruce de ferrocarril
  answer: B
  explanation: Una señal en forma de banderín se coloca en el lado izquierdo de la
    carretera para marcar el inicio de una zona de no rebasar.
- id: 205
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para un giro a la derecha en Maine?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho moviéndose en círculo
  answer: B
  explanation: Para señalar un giro a la derecha mediante señales manuales en Maine,
    debe extender el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 206
  category: signs_and_signals
  question: 'Una señal de cinco lados (pentágono) indica que está entrando en:'
  choices:
    A: Una zona de construcción
    B: Una zona hospitalaria
    C: Una zona escolar o cruce escolar
    D: Un parque público
  answer: C
  explanation: Una señal con forma de pentágono se utiliza exclusivamente para advertir
    a los conductores de una zona escolar o un cruce escolar más adelante.
- id: 207
  category: signs_and_signals
  question: En Maine, ¿qué significa una señal de X amarilla fija sobre un carril
    de circulación?
  choices:
    A: El carril es solo para vehículos de emergencia
    B: Debe prepararse para abandonar el carril porque la señal está a punto de cambiar
      a una X roja
    C: El carril está abierto a todo el tráfico
    D: Debe acelerar para despejar el carril
  answer: B
  explanation: Una X amarilla fija sobre un carril indica que la señal de control
    de carril está a punto de cambiar a una X roja, y usted debe salir de ese carril
    de manera segura.
- id: 208
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla redonda con una 'X' negra y las letras
    'RR'?
  choices:
    A: Una intersección de camino rural
    B: Una zona de descanso más adelante
    C: Una advertencia anticipada de cruce de ferrocarril
    D: Una superficie de carretera irregular
  answer: C
  explanation: La señal amarilla redonda con una 'X' negra y 'RR' es una señal de
    advertencia anticipada de cruce de ferrocarril, que le indica que mire, escuche
    y disminuya la velocidad.
- id: 209
  category: signs_and_signals
  question: 'Cuando ve un emblema de ''Vehículo de movimiento lento'' (un triángulo
    naranja reflectante con un borde rojo) en la parte trasera de un vehículo, significa
    que el vehículo viaja a:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de vehículo de movimiento lento es obligatorio en los vehículos
    diseñados para viajar a velocidades de 25 mph o menos, como maquinaria agrícola
    o carruajes tirados por caballos.
- id: 210
  category: signs_and_signals
  question: 'En Maine, a menos que una señal lo prohíba, puede girar a la derecha
    con luz roja después de:'
  choices:
    A: Disminuir la velocidad a 5 mph
    B: Detenerse por completo y ceder el paso a los peatones y al tráfico transversal
    C: Esperar al menos 5 segundos
    D: Tocar la bocina para alertar a los demás
  answer: B
  explanation: La ley de Maine permite girar a la derecha en rojo después de una parada
    completa, siempre que no haya una señal que lo prohíba y el camino esté libre
    de peatones y otro tráfico.
- id: 211
  category: signs_and_signals
  question: 'Las señales en forma de diamante con fondo naranja se utilizan para alertar
    a los conductores sobre:'
  choices:
    A: Instalaciones de servicio como gasolineras y comida
    B: Áreas recreativas
    C: Zonas de trabajo de construcción y mantenimiento
    D: Límites estatales
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para zonas de construcción, mantenimiento u otras zonas de control de tráfico
    temporal.
- id: 212
  category: signs_and_signals
  question: 'Al acercarse a una intersección con una luz amarilla intermitente, la
    ley de Maine le exige:'
  choices:
    A: Detenerse por completo antes de continuar
    B: Acelerar para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: Ceder el paso a todo el tráfico, incluso si tienen luz roja
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y estar más alerta al cruzar la intersección.
- id: 213
  category: signs_and_signals
  question: 'Una señal que presenta un círculo rojo con una barra horizontal blanca
    en el medio significa:'
  choices:
    A: Prohibido girar a la izquierda
    B: No entrar (Do Not Enter)
    C: Ceder el derecho de paso
    D: Calle de un solo sentido
  answer: B
  explanation: La señal de 'No entrar' (Do Not Enter) es un cuadrado con un círculo
    rojo y una franja horizontal blanca, lo que indica que no puede entrar a la carretera
    desde esa dirección.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 214
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 215
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 216
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 217
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 218
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 219
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 220
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar vuelta en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 221
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de "ZONA DE NO REBASAR"
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 222
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha únicamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 223
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 224
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los venados cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un venado
    advierte que estos animales cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 225
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 226
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 227
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 228
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 229
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 230
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha únicamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 231
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte sobre dos curvas en direcciones
    opuestas más adelante. Reduzca la velocidad y prepárese para que la carretera
    gire primero en un sentido y luego en el otro.
  id: 232
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 233
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 234
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 235
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 236
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 237
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Es
    posible que esté saliendo de una carretera de un solo sentido o de una autopista
    dividida y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 238
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 239
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 240
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Prepárese para
    detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 241
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (yield)
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 242
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 243
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 244
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 245
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 246
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 247
