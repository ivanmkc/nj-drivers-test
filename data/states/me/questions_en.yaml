metadata:
  source: Maine Motorist Handbook (maine.gov/sos/bmv)
  total_questions: 435
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In what year was the Maine Bureau of Motor Vehicles established out of
    concern for public safety?
  choices:
    A: '1905'
    B: '1920'
    C: '1895'
    D: '1950'
  answer: A
  explanation: According to the introduction, the Maine Bureau of Motor Vehicles was
    established in 1905 out of concern for public safety as the age of the automobile
    began.
- id: 2
  category: license_system
  question: Which of the following is listed as part of the Maine Bureau of Motor
    Vehicles' mission?
  choices:
    A: Building new state highways
    B: Maintaining records of driver history and vehicle registration
    C: Setting state speed limits
    D: Manufacturing motor vehicles
  answer: B
  explanation: The manual states that the BMV's mission includes qualifying and licensing
    drivers, along with maintaining records of driver history, vehicle ownership,
    and vehicle registration.
- id: 3
  category: driver_responsibility
  question: According to the manual's introduction, what does a driver's license bring
    in addition to new freedom and independence?
  choices:
    A: A solemn responsibility
    B: Guaranteed vehicle ownership
    C: Immunity from minor traffic laws
    D: Free vehicle registration
  answer: A
  explanation: 'The introduction explicitly states: ''A driver''s license brings new
    freedom and independence - and also a solemn responsibility.'''
- id: 4
  category: safe_driving_rules
  question: What does the manual describe as a 'life-long commitment' that you must
    reaffirm every time you get behind the wheel?
  choices:
    A: Vehicle maintenance
    B: Safe driving
    C: Paying tolls
    D: Renewing your license
  answer: B
  explanation: The introduction reminds drivers that 'Safe driving is a life-long
    commitment and one that you must reaffirm every time you get behind the wheel.'
- id: 5
  category: alcohol_drugs_health
  question: According to the introduction, which of the following behaviors puts lives
    at risk?
  choices:
    A: Driving with passengers in the vehicle
    B: Driving at night or in bad weather
    C: Being impaired by drugs or alcohol, or texting
    D: Listening to the radio while driving
  answer: C
  explanation: 'The manual warns: ''If you are impaired by drugs or alcohol, or if
    you''re texting or paying attention to anything other than your driving, you are
    putting lives at risk.'''
- id: 6
  category: defensive_driving
  question: To avoid a collision, the manual states you must always be prepared for
    the possibility that you will need to do what?
  choices:
    A: Stop, swerve, speed up or slow down
    B: Close your eyes and brace for impact
    C: Honk your horn and maintain your current speed
    D: Exit the vehicle immediately
  answer: A
  explanation: 'The introduction states: ''You must always be prepared for the possibility
    that you will need to stop, swerve, speed up or slow down to avoid a collision.'''
- id: 7
  category: sharing_the_road
  question: 'According to the manual''s Table of Contents, which of the following
    topics is covered under Section 10: ''Sharing the Road''?'
  choices:
    A: Parallel Parking
    B: Bicycles
    C: Hydroplaning
    D: Air Bags
  answer: B
  explanation: The Table of Contents lists 'Bicycles' as a subsection under Section
    10 - Sharing the Road.
- id: 8
  category: vehicle_information
  question: Which of the following is classified as a 'Vehicle Problem' in Section
    9 of the manual?
  choices:
    A: Aggressive Driving
    B: Excessive Sound System Noise
    C: Stuck Gas Pedal
    D: Fatigue
  answer: C
  explanation: According to the Table of Contents for Section 9 (Avoiding Crashes),
    'Stuck Gas Pedal' is listed under the 'Vehicle Problems' subsection.
- id: 9
  category: defensive_driving
  question: Based on the Table of Contents, which of the following is considered a
    'Special Driving Challenge' (Section 11)?
  choices:
    A: Wildlife Safety
    B: Starting the Engine
    C: Using Safety Belts
    D: Traffic Signals
  answer: A
  explanation: The Table of Contents lists 'Wildlife Safety' as a topic under Section
    11 - Special Driving Challenges.
- id: 10
  category: safe_driving_rules
  question: Under the 'Managing Speed' section in the Table of Contents, which specific
    road condition is addressed?
  choices:
    A: Potholes
    B: Hydroplaning
    C: Dirt roads
    D: Black ice
  answer: B
  explanation: The Table of Contents lists 'Hydroplaning' as a specific topic under
    'Managing Speed' in Section 8.
- id: 11
  category: license_system
  question: 'Which of the following is a topic covered under Section 2: ''State Laws
    and Rules''?'
  choices:
    A: Insuring Your Motor Vehicle
    B: Changing Lanes
    C: Expressway Driving
    D: Emergency First Aid
  answer: A
  explanation: According to the Table of Contents, 'Insuring Your Motor Vehicle' is
    a subsection of Section 2 - State Laws and Rules.
- id: 12
  category: driver_responsibility
  question: 'According to the Table of Contents, which of the following is a factor
    discussed in Section 3: ''Ready to Drive''?'
  choices:
    A: Route Number Signs
    B: Pavement Markings
    C: Vision and Hearing
    D: Yielding Right-of-Way
  answer: C
  explanation: The Table of Contents lists 'Vision and Hearing' as the first topic
    under Section 3 - Ready to Drive.
- id: 13
  category: signs_and_signals
  question: In which section of the manual would you find information about 'Work
    Zone Signs'?
  choices:
    A: Section 6 - Rules of the Road
    B: Section 5 - Getting Started
    C: Section 9 - Avoiding Crashes
    D: Section 8 - Managing Time and Space
  answer: A
  explanation: The Table of Contents shows that 'Work Zone Signs' is a subsection
    under 'Traffic Signs' in Section 6 - Rules of the Road.
- id: 14
  category: driver_testing
  question: What information is provided in Appendix A of the driver's manual?
  choices:
    A: A list of all Maine traffic fines
    B: Typical Reasons for Road Test Refusals
    C: Instructions for changing a tire
    D: The history of the Maine BMV
  answer: B
  explanation: The Table of Contents indicates that Appendix A includes 'Typical Reasons
    for Road Test Refusals', along with road test information and instructions.
- id: 15
  category: safe_driving_rules
  question: 'Which type of parking is specifically listed as a topic in Section 7:
    ''General Driving''?'
  choices:
    A: Valet Parking
    B: Garage Parking
    C: Parallel or Offset Parking
    D: Driveway Parking
  answer: C
  explanation: The Table of Contents lists 'Parallel or Offset Parking' as a specific
    subsection under 'Parking' in Section 7 - General Driving.
- id: 16
  category: license_system
  question: How many days does a new resident have to apply for a Maine driver's license
    after establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents who hold a valid driver's license from another state
    must surrender that license and apply for a Maine driver's license within 30 days
    of establishing residency.
- id: 17
  category: driver_testing
  question: What are the requirements for the licensed driver who must accompany a
    learner's permit holder?
  choices:
    A: At least 18 years old with 1 year of driving experience
    B: At least 21 years old with 3 years of driving experience
    C: At least 20 years old and has held a valid license for a minimum of 2 years
    D: A parent or legal guardian over 25 years old
  answer: C
  explanation: A learner's permit allows a person to operate a vehicle when accompanied
    by a licensed driver who is at least 20 years of age and has held a valid license
    for 2 years.
- id: 18
  category: license_system
  question: What is the minimum age required to obtain a learner's permit in Maine?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 15 and a half years of age
    D: 16 years of age
  answer: B
  explanation: To obtain a permit in Maine, you must be at least 15 years of age.
- id: 19
  category: license_system
  question: How long is a Maine learner's permit generally valid for?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: According to the manual, a learner's permit is generally valid for
    2 years.
- id: 20
  category: license_system
  question: When providing a birth certificate for a license application, which of
    the following is true regarding photocopies?
  choices:
    A: Notarized copies are highly recommended
    B: Photocopies must have an embossed seal or stamp of an issuing agency
    C: Any clear black-and-white photocopy is acceptable
    D: Photocopies are strictly prohibited under all circumstances
  answer: B
  explanation: Photocopies of birth certificates must have an embossed seal or stamp
    of an issuing agency. Notarized copies are not acceptable.
- id: 21
  category: license_system
  question: Which license classification is the standard license issued to most motor
    vehicle operators in Maine?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: C
  explanation: Class C is the standard license classification issued to most motor
    vehicle operators, covering any single vehicle or combination of vehicles that
    does not meet the definition of Class A or B.
- id: 22
  category: license_system
  question: Which of the following makes an individual ineligible to receive a school
    bus operator's license?
  choices:
    A: Being 22 years of age
    B: Having only two years of licensed driving experience
    C: A conviction of an O.U.I. offense within the preceding ten-year period
    D: Holding a Class C commercial driver's license
  answer: C
  explanation: Any individual convicted of an O.U.I. offense within the preceding
    ten-year period is ineligible to receive a school bus operator's license.
- id: 23
  category: driver_testing
  question: Before a person under 21 can apply for a road test, how many hours of
    practice driving must they complete?
  choices:
    A: 40 hours, including 5 hours of night driving
    B: 50 hours, including 10 hours of night driving
    C: 70 hours, including 10 hours of night driving
    D: 100 hours, including 20 hours of night driving
  answer: C
  explanation: A person under 21 years of age must complete a minimum of 70 hours
    of driving, including 10 hours of night driving, while accompanied by a qualified
    licensed driver.
- id: 24
  category: safe_driving_rules
  question: A person under 18 years of age who has been issued a Maine driver's license
    may not operate a motor vehicle between which hours?
  choices:
    A: 10 p.m. and 5 a.m.
    B: 11 p.m. and 6 a.m.
    C: 12 a.m. and 5 a.m.
    D: 1 a.m. and 4 a.m.
  answer: C
  explanation: A person under 18 years of age who has been issued a Maine driver's
    license may not operate a motor vehicle between the hours of 12 a.m. and 5 a.m.
- id: 25
  category: license_system
  question: How long are the initial driving restrictions in effect for a person under
    18 after passing their road test?
  choices:
    A: 90 days
    B: 180 days
    C: 270 days
    D: 1 year
  answer: C
  explanation: These restrictions are in effect for a period of 270 days from when
    the road test was passed.
- id: 26
  category: license_system
  question: How long is the first license issued to a new applicant under 21 years
    of age considered provisional?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until they turn 21
  answer: C
  explanation: The first license issued to a new applicant under 21 years of age is
    provisional for a period of two years.
- id: 27
  category: penalties_and_points
  question: What is the penalty if a person is convicted of a first-offense moving
    violation while operating with a provisional license?
  choices:
    A: A warning letter is issued
    B: The license is suspended for 30 days
    C: The license is suspended for 90 days
    D: The license is permanently revoked
  answer: B
  explanation: If a person is convicted of a moving violation that occurred while
    operating with a provisional license, the license will be suspended for 30 days.
- id: 28
  category: driver_testing
  question: What two aspects of your vision are measured during the vision screening?
  choices:
    A: Color blindness and depth perception
    B: Visual acuity and peripheral vision
    C: Night vision and light sensitivity
    D: Distance tracking and focal length
  answer: B
  explanation: The vision screening will measure your visual acuity (how clearly you
    see) and your peripheral vision (how far you can see to either side while looking
    straight ahead).
- id: 29
  category: safe_driving_rules
  question: What is the law regarding the use of mobile telephones or handheld electronic
    devices while driving on a learner's permit in Maine?
  choices:
    A: They are allowed only for GPS navigation
    B: They are allowed if using a hands-free accessory
    C: They are prohibited by law when driving
    D: They are allowed only during daylight hours
  answer: C
  explanation: Use of a mobile telephone or handheld electronic devices are prohibited
    by law when driving in Maine on a learner's permit.
- id: 30
  category: driver_testing
  question: When arriving for a scheduled road test, what must the driver provide?
  choices:
    A: A dual-control driver education vehicle
    B: Their own properly registered and inspected vehicle
    C: A vehicle provided by the Bureau of Motor Vehicles
    D: A commercial vehicle weighing over 10,000 pounds
  answer: B
  explanation: Drivers must furnish their own vehicle, properly registered (bring
    registration) and inspected, for the road test.
- id: 31
  category: driver_testing
  question: What does the vision screening for a Maine driver's license measure?
  choices:
    A: Visual acuity and peripheral vision
    B: Color blindness and depth perception
    C: Night vision and glare resistance
    D: Reaction time and visual acuity
  answer: A
  explanation: According to the manual, the vision screening will measure your visual
    acuity (how clearly you see) and your peripheral vision (how far you can see to
    either side while looking straight ahead).
- id: 32
  category: driver_testing
  question: When is the actual road test given to an applicant?
  choices:
    A: Before the written test is taken
    B: At the same time as the vision screening
    C: Only after all other tests have been successfully completed
    D: After the applicant pays the final license fee
  answer: C
  explanation: 'The manual states: ''The road test will not be given until all other
    tests have been successfully completed.'''
- id: 33
  category: license_system
  question: What is the minimum age required to apply for a Maine driver's license?
  choices:
    A: 15 years of age
    B: 15 and a half years of age
    C: 16 years of age
    D: 18 years of age
  answer: C
  explanation: 'The manual explicitly states: ''You must be at least 16 years of age
    to apply for a Maine license.'''
- id: 34
  category: license_system
  question: You must apply for a Commercial Driver's License (CDL) if you expect to
    operate a vehicle designed to carry how many passengers?
  choices:
    A: Over 10 passengers including the driver
    B: Over 12 passengers including the driver
    C: Over 15 passengers including the driver
    D: Over 20 passengers including the driver
  answer: C
  explanation: A Commercial Driver's License is required if you expect to operate
    'A vehicle designed to carry over 15 passengers including the driver.'
- id: 35
  category: penalties_and_points
  question: What is the penalty for making a misstatement on your driver's license
    application?
  choices:
    A: A $500 fine
    B: Immediate revocation of your license and driving privilege
    C: A 30-day suspension of your license
    D: Six demerit points on your driving record
  answer: B
  explanation: The manual states that 'Any misstatement on the license application
    will result in the immediate revocation of your license and your privilege to
    operate in the State of Maine.'
- id: 36
  category: driver_responsibility
  question: How can a parent or legal guardian who signed a minor's application have
    the minor's license or permit suspended?
  choices:
    A: By calling the local police department
    B: By confiscating the minor's physical license
    C: By filing a notarized written request with the department
    D: By refusing to pay the minor's auto insurance
  answer: C
  explanation: Any person who has signed the application of a minor can file with
    the department a notarized written request asking that the minor's license or
    instruction permit be suspended.
- id: 37
  category: license_system
  question: For a driver who is under age 65, how long is a new picture license valid?
  choices:
    A: Until their fourth birthday following the date of issue
    B: Until their fifth birthday following the date of issue
    C: Until their sixth birthday following the date of issue
    D: Until their eighth birthday following the date of issue
  answer: C
  explanation: You may purchase a picture license which is valid until your sixth
    birthday following the date of issue of the license (or fourth birthday if age
    65 or older).
- id: 38
  category: license_system
  question: If your name or address changes, how long do you have to notify the Bureau
    of Motor Vehicles?
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Maine law requires that you notify the Bureau of Motor Vehicles within
    30 days of a change of name or address.
- id: 39
  category: driver_responsibility
  question: The Secretary of State is authorized to suspend your license upon receipt
    of what?
  choices:
    A: A verbal complaint from a neighbor
    B: A written adverse report of your driving from a law enforcement officer or
      public member
    C: A single parking ticket
    D: An anonymous phone call
  answer: B
  explanation: 'The manual states: ''The Secretary of State is authorized to suspend
    your license upon receipt of a written adverse report of your driving from a law
    enforcement officer or other member of the public.'''
- id: 40
  category: penalties_and_points
  question: What is the minimum revocation period for Vehicular Manslaughter if alcohol
    is NOT involved?
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanent revocation
  answer: C
  explanation: For Vehicular Manslaughter, the manual specifies a revocation for at
    least 5 years. (If alcohol is involved, it is permanent).
- id: 41
  category: penalties_and_points
  question: What happens to your driving privilege if you are convicted of Vehicular
    Manslaughter and alcohol is involved?
  choices:
    A: Your license is suspended for 90 days
    B: Your license is revoked for 5 years
    C: Your license is revoked for 10 years
    D: Your license is permanently revoked
  answer: D
  explanation: 'The manual states regarding Vehicular Manslaughter: ''If alcohol is
    involved revocation is permanent.'''
- id: 42
  category: penalties_and_points
  question: Which of the following offenses may result in a license suspension of
    up to 90 days?
  choices:
    A: Operating after suspension
    B: Eluding a police officer
    C: Speeding by 30 mph over the limit
    D: Leaving the scene of an accident
  answer: B
  explanation: The license of any person convicted of eluding a police officer, passing
    a roadblock, or street racing may be suspended for a period of up to 90 days.
- id: 43
  category: penalties_and_points
  question: How long may your license be suspended if you are convicted of operating
    after suspension?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: B
  explanation: Any person who is convicted of operating after suspension may have
    their license suspended for a period of 60 days.
- id: 44
  category: penalties_and_points
  question: Passing a stopped school bus with its red lights flashing may result in
    a license suspension for how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: A
  explanation: Persons convicted of passing a stopped school bus with its red lights
    flashing may have their licenses suspended for a period of 30 days.
- id: 45
  category: alcohol_drugs_health
  question: How many demerit points are assessed if a person under 21 is adjudicated
    of using false identification to obtain liquor?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: The manual states that the offense of using false or fraudulent credentials
    to obtain liquor or gain entrance into a drinking establishment will carry six
    demerit points.
- id: 46
  category: penalties_and_points
  question: At what point level will the Maine Secretary of State issue a warning
    to a driver?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: B
  explanation: According to the Maine Point System, once a driver reaches 6 points,
    a warning is issued by the Secretary of State.
- id: 47
  category: penalties_and_points
  question: How long does it take for demerit points to be erased from a driver's
    record in Maine?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Three years
  answer: B
  explanation: Points will be erased from a driver's record when they become one year
    old.
- id: 48
  category: safe_driving_rules
  question: Attempting to elude a law enforcement officer resulting in a high-speed
    chase is classified as what type of crime if no one is injured?
  choices:
    A: Class A crime
    B: Class B crime
    C: Class C crime
    D: Class D crime
  answer: C
  explanation: Attempting to elude a law enforcement officer by driving at a reckless
    rate of speed resulting in a high-speed chase is a Class C crime.
- id: 49
  category: penalties_and_points
  question: What is the maximum number of violation-free credit points a driver can
    accumulate?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: C
  explanation: The violation free credit system permits a driver to accumulate up
    to four violation free credit points, earning one point for each calendar year
    free of convictions or suspensions.
- id: 50
  category: driver_responsibility
  question: How many points are deducted from a driver's total upon successful completion
    of the Maine Driving Dynamics Course?
  choices:
    A: One point
    B: Two points
    C: Three points
    D: Four points
  answer: C
  explanation: Successful completion of a Maine Driving Dynamics Course or other approved
    driver improvement course will deduct three points from a driver's point total.
- id: 51
  category: penalties_and_points
  question: A driver may be subject to a further suspension of up to 120 days if their
    license has been suspended how many times within a three-year period?
  choices:
    A: Two times
    B: Three times
    C: Four times
    D: Five times
  answer: B
  explanation: Any person whose license has been suspended three times within a three-year
    period by the Secretary of State or by a court may be subject to a further suspension
    for a period up to 120 days.
- id: 52
  category: alcohol_drugs_health
  question: What is the minimum license suspension period for a minor convicted of
    illegal transportation of liquor in a motor vehicle?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Illegal transportation, possession, or consumption of liquor by a minor
    in a motor vehicle requires a mandatory suspension for at least 30 days.
- id: 53
  category: penalties_and_points
  question: Which of the following will result in a mandatory license suspension with
    no "work" license option?
  choices:
    A: Accumulating 4 demerit points
    B: Failing to answer a motor vehicle summons to court
    C: A first-time parking ticket
    D: Driving a vehicle older than 25 years
  answer: B
  explanation: Failure to answer to a motor vehicle summons to court or pay any related
    fine requires a total mandatory suspension with no exceptions and no "work" license
    option.
- id: 54
  category: penalties_and_points
  question: If a driver uses a motor vehicle to commit a Class D crime that creates
    a substantial risk of serious bodily injury, how long will their license be revoked?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Three years
  answer: C
  explanation: The license revocation periods for designated criminal offenses involving
    a motor vehicle are three years for Class A, B or C crimes, two years for a Class
    D crime, and one year for a Class E offense.
- id: 55
  category: vehicle_information
  question: Where should you keep your vehicle's certificate of title?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In a safe place, never in the vehicle
    D: Taped to the inside of the windshield
  answer: C
  explanation: The manual states that the certificate of title should be kept in a
    safe place, and never in the vehicle.
- id: 56
  category: vehicle_information
  question: Which of the following vehicles is required to have a title in Maine?
  choices:
    A: A vehicle that is 30 years old
    B: A motorcycle with a 250 cc engine
    C: A trailer with an unloaded weight of 2,000 pounds
    D: A 10-year-old passenger car
  answer: D
  explanation: Vehicles more than 25 years old, motorcycles under 300 cc, and trailers
    3,000 pounds or less are exempt from needing a title. A 10-year-old passenger
    car does not meet these exemptions and must be titled.
- id: 57
  category: vehicle_information
  question: What is the first step in registering a motor vehicle in Maine?
  choices:
    A: Passing a road test
    B: Paying the excise tax to a municipal tax collector
    C: Submitting a title application to the Bureau of Motor Vehicles
    D: Getting a vehicle inspection
  answer: B
  explanation: Payment of the excise tax to a municipal tax collector is the first
    step in registering your motor vehicle.
- id: 58
  category: vehicle_information
  question: The amount of excise tax due when registering a vehicle in Maine depends
    on what two factors?
  choices:
    A: The vehicle's weight and color
    B: The owner's age and driving record
    C: The vehicle's age and factory list price
    D: The county of residence and engine size
  answer: C
  explanation: The amount of excise tax due depends upon the age and factory list
    price of the vehicle being registered.
- id: 59
  category: license_system
  question: If a person is under 18 years of age, who must sign their vehicle registration
    form?
  choices:
    A: A driving instructor
    B: A parent or guardian
    C: A municipal tax collector
    D: A police officer
  answer: B
  explanation: If you are less than 18 years of age, a parent or guardian must also
    sign the registration form.
- id: 60
  category: penalties_and_points
  question: Can a judge suspend a driver's license for failing to pay a fine in a
    civil violation proceeding unrelated to motor vehicles?
  choices:
    A: Yes, a judge has discretionary authority to order a suspension for offenses
      unrelated to motor vehicles.
    B: No, license suspensions can only be ordered for traffic violations.
    C: Yes, but only if the fine is over $500.
    D: No, only the Secretary of State can suspend a license.
  answer: A
  explanation: A judge has discretionary authority to suspend the driver's license
    of any person found in contempt for failing to pay a fine, and may order a driver
    license suspension for offenses unrelated to the operation of motor vehicles.
- id: 61
  category: vehicle_information
  question: How much is the registration fee for a standard passenger vehicle in Maine,
    and how long is it valid?
  choices:
    A: $25.00 for one year
    B: $35.00 for one year
    C: $50.00 for two years
    D: $35.00 for two years
  answer: B
  explanation: According to the manual, the registration fee for a passenger vehicle
    is $35.00, and a registration remains valid for one year from the month it is
    issued.
- id: 62
  category: vehicle_information
  question: 'When registering a vehicle for the first time in Maine, an application
    for title must be submitted if the vehicle is:'
  choices:
    A: 10 years old or newer
    B: 15 years old or newer
    C: 25 years old or newer
    D: Any age
  answer: C
  explanation: At the time of first registration, an application for title must be
    submitted for a vehicle that is 25 years old or newer.
- id: 63
  category: vehicle_information
  question: How soon after declaring or establishing residence in Maine must you apply
    for a Maine motor vehicle registration?
  choices:
    A: Within 10 days
    B: Within 30 days
    C: Within 60 days
    D: Within 90 days
  answer: B
  explanation: Maine law requires that a Maine motor vehicle registration must be
    applied for within 30 days once residence in the state of Maine is declared or
    established.
- id: 64
  category: penalties_and_points
  question: What is a potential consequence of failing to produce evidence of vehicle
    insurance when requested by a law enforcement officer?
  choices:
    A: A warning and a $50 fine
    B: Suspension of your license and registration privileges
    C: Immediate confiscation of your vehicle
    D: Mandatory community service
  answer: B
  explanation: Failure to produce evidence of insurance when required can result in
    a charge of uninsured operation and suspension of license and registration privileges.
- id: 65
  category: vehicle_information
  question: In Maine, which of the following is true regarding 'uninsured motorist'
    coverage?
  choices:
    A: It is optional for all drivers
    B: It is only required for commercial vehicles
    C: It is included by law in all automobile liability policies written in Maine
    D: It must be purchased separately through the state
  answer: C
  explanation: By law, all automobile liability policies written in Maine include
    'uninsured motorist' coverage to protect the insured for bodily injury damages.
- id: 66
  category: vehicle_information
  question: If a driver is unable to obtain insurance coverage through regular channels,
    how can they obtain coverage in Maine?
  choices:
    A: Through the Maine Automobile Insurance Plan
    B: By applying for a state insurance waiver
    C: Through the Bureau of Motor Vehicles Uninsured Fund
    D: By registering the vehicle as a farm use vehicle
  answer: A
  explanation: Any individual unable to procure insurance coverage through regular
    channels can obtain coverage through the Maine Automobile Insurance Plan (Assigned
    Risk).
- id: 67
  category: vehicle_information
  question: How often must a motor vehicle bearing a Maine registration be inspected
    at an official inspection station?
  choices:
    A: Every 6 months
    B: Once a year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: All motor vehicles bearing a Maine registration must have a current
    Maine inspection before being operated on any public way, and these inspections
    must be done once a year.
- id: 68
  category: driver_testing
  question: 'During the motor vehicle safety check for a driver examination, the exam
    will NOT be given if:'
  choices:
    A: The radio is broken
    B: The glove compartment door is not securely fastened in a closed position
    C: The vehicle has aftermarket floor mats
    D: The air conditioning is inoperative
  answer: B
  explanation: Examinations will not be given if vehicles do not pass the regular
    examination criteria, or if any doors are inoperative, seats are not securely
    fastened, or if the glove compartment door is not securely fastened in a closed
    position.
- id: 69
  category: vehicle_information
  question: To pass the Maine state vehicle inspection, a vehicle's horn must be loud
    enough to be heard from what distance?
  choices:
    A: 50 feet away
    B: 100 feet away
    C: 200 feet away
    D: 500 feet away
  answer: C
  explanation: The manual states that the horn must be loud enough to hear from 200
    feet away to pass inspection.
- id: 70
  category: vehicle_information
  question: According to Maine inspection standards, a vehicle's foot brake must be
    able to stop the vehicle within 30 feet when traveling at what speed?
  choices:
    A: 15 miles per hour
    B: 20 miles per hour
    C: 25 miles per hour
    D: 30 miles per hour
  answer: B
  explanation: The foot brake must be able to stop the vehicle within 30 feet when
    the vehicle is going 20 miles per hour.
- id: 71
  category: vehicle_information
  question: What is the minimum required tire tread depth for a standard passenger
    vehicle to pass inspection in Maine?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 3/32 of an inch
    D: 4/32 of an inch
  answer: B
  explanation: Tires must have 2/32 of an inch tread and be free of cuts, tears, or
    other dangerous conditions. (Commercial vehicles of 10,000 lbs GVW require 4/32).
- id: 72
  category: vehicle_information
  question: When checking your vehicle's steering, it has too much play and may prevent
    you from turning fast enough to avoid a collision if the steering wheel turns
    how far without moving the vehicle?
  choices:
    A: Half an inch or more
    B: One inch or more
    C: Two inches or more
    D: Four inches or more
  answer: C
  explanation: If your steering wheel turns two inches or more without moving the
    vehicle it has too much play and you may not be able to turn fast enough to avoid
    a collision.
- id: 73
  category: safe_driving_rules
  question: A leaky muffler can improperly discharge carbon monoxide. Which of the
    following describes carbon monoxide?
  choices:
    A: A harmless gas that smells like sulfur
    B: A deadly, odorless gas that causes weariness and headaches
    C: A visible black smoke that causes eye irritation
    D: A sweet-smelling gas that improves engine performance
  answer: B
  explanation: Carbon monoxide is a deadly, odorless gas found in the exhaust of all
    gas-powered engines which causes weariness, headaches, dizziness, nausea and ringing
    in the ears.
- id: 74
  category: vehicle_information
  question: 'It is illegal to operate a gasoline-powered motor vehicle on a public
    way if it emits visible smoke (other than water vapor) in the exhaust for a period
    of more than:'
  choices:
    A: 3 consecutive seconds
    B: 5 consecutive seconds
    C: 10 consecutive seconds
    D: 15 consecutive seconds
  answer: B
  explanation: A person may not operate a gasoline-powered motor vehicle on a public
    way if the motor vehicle emits visible smoke, other than water vapor, in the exhaust
    emission for a period more than 5 consecutive seconds.
- id: 75
  category: vehicle_information
  question: How can you test if your vehicle might need new shocks?
  choices:
    A: Listen for a squealing noise when applying the brakes
    B: Check if the steering wheel turns more than two inches without moving the tires
    C: Push down on the front and rear of the vehicle to see if it bounces more than
      twice
    D: Check if the vehicle pulls to one side when accelerating
  answer: C
  explanation: To check the suspension, push down on the front and rear of your vehicle.
    If it bounces more than twice, you may need new shocks.
- id: 76
  category: vehicle_information
  question: To maximize performance and prevent common problems, how often should
    you maintain your vehicle with frequent oil changes?
  choices:
    A: Every 1,000 - 2,000 miles
    B: Every 3,000 - 5,000 miles
    C: Every 7,000 - 10,000 miles
    D: Once a year regardless of mileage
  answer: B
  explanation: Maintaining your vehicle with frequent oil changes every 3,000 - 5,000
    miles serves as prevention against many common motor vehicle problems.
- id: 77
  category: penalties_and_points
  question: What is the penalty for a first offense of operating a sound system at
    an excessive volume?
  choices:
    A: A $25 fine
    B: A $50 fine
    C: A $100 fine
    D: A $150 fine
  answer: B
  explanation: Violation of the excessive sound system noise law is a traffic infraction
    and will be assessed $50 for a first offense.
- id: 78
  category: safe_driving_rules
  question: Why should drivers avoid wearing sunglasses or tinted glasses at night?
  choices:
    A: They cause the driver to become easily fatigued
    B: They reduce critical nighttime vision
    C: They increase the glare from oncoming headlights
    D: They make it difficult to hear emergency sirens
  answer: B
  explanation: The manual states not to wear sunglasses or tinted glasses at night
    as they will reduce your critical nighttime vision.
- id: 79
  category: safe_driving_rules
  question: Which of the following is a rule regarding hearing and safe driving?
  choices:
    A: You should wear ear buds to block out distracting road noise
    B: You must drive with the windows down to hear sirens
    C: You should keep the radio turned down and not wear headsets or ear buds
    D: You must take a hearing test every time you renew your license
  answer: C
  explanation: The manual advises to keep the radio turned down and do not wear headsets
    or ear buds while driving.
- id: 80
  category: safe_driving_rules
  question: What is a 'micro-sleep'?
  choices:
    A: A brief nap lasting 4 to 5 seconds that a driver may not even realize happened
    B: A 15 to 20-minute refresher nap taken at a rest stop
    C: A state of daydreaming where the driver forgets the last few miles
    D: A medical condition caused by taking over-the-counter medications
  answer: A
  explanation: '''Micro-sleeps'' are brief naps that last only four to five seconds,
    and a drowsy driver can fall asleep briefly and never even know it.'
- id: 81
  category: safe_driving_rules
  question: When taking a long trip, how often should you schedule a break to avoid
    fatigue?
  choices:
    A: Every hour or 50 miles
    B: Every two hours or 100 miles
    C: Every four hours or 200 miles
    D: Only when you start to yawn continuously
  answer: B
  explanation: You should schedule a break every two hours or 100 miles, but stop
    sooner if you experience any danger signs of fatigue.
- id: 82
  category: safe_driving_rules
  question: 'To avoid driving during your body''s ''downtime,'' you should find a
    safe place to sleep between the hours of:'
  choices:
    A: 8 p.m. and midnight
    B: Midnight and 6 a.m.
    C: 1 p.m. and 3 p.m.
    D: 4 a.m. and 8 a.m.
  answer: B
  explanation: The manual recommends avoiding driving during your body's 'downtime'
    by taking a needed break and finding a safe place to sleep between midnight and
    6 a.m.
- id: 83
  category: safe_driving_rules
  question: If you are driving and your front-seat passenger needs to rest, what should
    they do?
  choices:
    A: Recline the front passenger seat all the way back
    B: Stay in the front seat but turn away from the driver
    C: Go to the back seat, buckle up, and nap
    D: Talk to the driver until they reach the destination
  answer: C
  explanation: A driver who needs rest should go to the back seat, buckle up and nap,
    so both people in the front seats remain awake and alert.
- id: 84
  category: safe_driving_rules
  question: Which of the following is a danger sign of drowsiness while driving?
  choices:
    A: You are checking your mirrors frequently
    B: You don't remember driving the last few miles
    C: You are gripping the steering wheel tightly
    D: You feel the need to turn down the radio
  answer: B
  explanation: Not remembering driving the last few miles is explicitly listed in
    the manual as one of the danger signs of drowsiness.
- id: 85
  category: safe_driving_rules
  question: How should pets be secured in a vehicle to prevent driver distraction?
  choices:
    A: Held securely in the front passenger's lap
    B: Tied to the back seat with a leash
    C: Allowed to roam freely in the back seat only
    D: Kept in a pet carrier, not loose in the vehicle
  answer: D
  explanation: To prevent distractions, the manual instructs drivers to keep pets
    in a pet carrier, not loose in the vehicle.
- id: 86
  category: penalties_and_points
  question: 'A vehicle''s sound system is considered excessively noisy and illegal
    if it exceeds 85 decibels and is audible at a distance greater than:'
  choices:
    A: 10 feet
    B: 25 feet
    C: 50 feet
    D: 100 feet
  answer: B
  explanation: A person may not operate a sound system at a volume that is audible
    at a distance greater than 25 feet and that exceeds 85 decibels.
- id: 87
  category: safe_driving_rules
  question: What is the only way to erase a 'sleep debt'?
  choices:
    A: Drinking caffeinated beverages
    B: Cracking the window for fresh air
    C: Getting more sleep
    D: Playing loud music
  answer: C
  explanation: The manual states that the only way to erase a sleep debt is to get
    more sleep; you cannot shake it off with caffeine, loud music, or fresh air.
- id: 88
  category: vehicle_information
  question: Which of the following items is recommended to be kept in your car in
    the event of a breakdown or emergency?
  choices:
    A: A spare battery
    B: A lug wrench
    C: Extra engine coolant
    D: A portable air compressor
  answer: B
  explanation: The manual lists a lug wrench (along with an owner's manual, spare
    tire, tire jack, first aid kit, blanket, flashlight, and road maps) as advisable
    tools and supplies for emergencies.
- id: 89
  category: safe_driving_rules
  question: How should pets be secured when you are driving?
  choices:
    A: On the passenger's lap
    B: In a pet carrier, not loose in the vehicle
    C: In the front seat with a seatbelt
    D: Loose in the back seat
  answer: B
  explanation: The manual states that when driving, you should keep pets in a pet
    carrier, not loose in the vehicle.
- id: 90
  category: defensive_driving
  question: According to a study by the Virginia Tech Transportation Institute, truck
    drivers who texted while driving had how much greater risk of being involved in
    a crash or near-crash?
  choices:
    A: 5 times the risk
    B: 10 times the risk
    C: 23 times the risk
    D: 50 times the risk
  answer: C
  explanation: An in-cab driving study revealed that truck drivers who texted while
    driving had 23 times the risk of being involved in a crash or a near-crash incident.
- id: 91
  category: safe_driving_rules
  question: What defines a cognitive distraction while driving?
  choices:
    A: Removing one or both hands from the steering wheel
    B: Mental thoughts and feelings such as anger or worry
    C: Looking away from the road to view street signs
    D: Adjusting the vehicle's mirrors
  answer: B
  explanation: Cognitive distractions are mental thoughts and feelings (anger, anxiety,
    worry, etc.) that distract the driver and divert attention from the road.
- id: 92
  category: defensive_driving
  question: 'Short glances at vehicle instrumentation or mirrors can be done safely
    if they are limited to:'
  choices:
    A: Less than one second
    B: Two to three seconds
    C: Less than five seconds
    D: Only when stopped at a red light
  answer: A
  explanation: Short glances at vehicle instrumentation, mirrors, or other technology
    can be done safely if these scans are limited to less than one second and are
    related only to the driving task.
- id: 93
  category: safe_driving_rules
  question: Why should you put portable phones in their cradles while driving?
  choices:
    A: To charge the battery faster
    B: So they do not become projectiles in a crash
    C: To improve the cellular signal
    D: So passengers cannot reach them
  answer: B
  explanation: The manual advises putting portable phones in their cradles so they
    do not become projectiles in a crash.
- id: 94
  category: penalties_and_points
  question: 'If a driver under the age of 18 operates a motor vehicle while using
    a handheld electronic device, the violation is considered a:'
  choices:
    A: Felony
    B: Class C Misdemeanor
    C: Traffic infraction
    D: Criminal offense
  answer: C
  explanation: A person under 18 is prohibited from operating a motor vehicle while
    using a mobile telephone or handheld electronic device, and a violation of this
    statute is considered a traffic infraction.
- id: 95
  category: driver_responsibility
  question: Which of the following behaviors is considered aggressive driving?
  choices:
    A: Driving under the speed limit
    B: Unsafe lane changes and following too closely
    C: Using a hands-free cellular device
    D: Looking at vehicle instrumentation for less than one second
  answer: B
  explanation: Aggressive driving includes speeding, following too close, unsafe lane
    changes, not signaling when you turn, and not obeying traffic controls.
- id: 96
  category: alcohol_drugs_health
  question: Alcohol and other drugs are contributing factors in approximately what
    percentage of all fatal crashes?
  choices:
    A: 15%
    B: 25%
    C: 40%
    D: 60%
  answer: C
  explanation: According to the manual, alcohol and other drugs are contributing factors
    in about 40% of all fatal crashes.
- id: 97
  category: penalties_and_points
  question: 'If you are under 21 and convicted of operating a motor vehicle while
    under the influence, you will lose your driver''s license for at least:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: If you are under 21 and convicted of operating a motor vehicle while
    under the influence, you will lose your driver's license for at least one year.
- id: 98
  category: penalties_and_points
  question: 'If a driver under 21 is convicted of operating under the influence while
    carrying passengers under the age of 21, their license will be suspended for an
    additional:'
  choices:
    A: 30 days
    B: 60 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: If you are under 21 and convicted of OUI with passengers under the
    age of 21 with you, your license will be suspended for an additional 180 days.
- id: 99
  category: alcohol_drugs_health
  question: At what Blood Alcohol Content (BAC) level is vision impacted for all drivers?
  choices:
    A: '.02'
    B: '.04'
    C: '.06'
    D: '.08'
  answer: A
  explanation: The manual states that vision is impacted at .02 BAC for all drivers.
- id: 100
  category: safe_driving_rules
  question: 'Good perception is especially important at night because normal vision
    is reduced by:'
  choices:
    A: 10%
    B: 25%
    C: 50%
    D: 75%
  answer: C
  explanation: The ability to see well becomes even more important at night since
    normal vision is reduced by 50% because there is not enough light for your eyes
    to function properly.
- id: 101
  category: defensive_driving
  question: Under normal conditions, approximately how long does it take for your
    eyes to recover from the glare of oncoming headlights?
  choices:
    A: 2 seconds
    B: 4 seconds
    C: 7 seconds
    D: 12 seconds
  answer: C
  explanation: It normally takes about seven seconds for your eyes to recover from
    headlight glare, which at 55 mph is almost the length of two football fields.
- id: 102
  category: alcohol_drugs_health
  question: How does consuming alcohol affect your visual perception while driving?
  choices:
    A: It sharpens your ability to judge distance
    B: It reduces your ability to identify objects to the side
    C: It decreases the time needed to recover from headlight glare
    D: It improves your ability to see different colors
  answer: B
  explanation: Alcohol affects your ability to identify objects to the side when looking
    ahead, reducing your ability to see merging, passing or parked vehicles, and/or
    pedestrians or bicyclists.
- id: 103
  category: alcohol_drugs_health
  question: How much alcohol is in a 12 oz. can of beer compared to a 1 oz. shot of
    100 proof hard liquor?
  choices:
    A: Half as much
    B: Twice as much
    C: Approximately the same amount
    D: One-third as much
  answer: C
  explanation: According to the manual, there is approximately the same amount of
    alcohol in a 12 oz. can of beer as there is in a 1 oz. shot of 100 proof hard
    liquor or a 4 oz. glass of table wine.
- id: 104
  category: alcohol_drugs_health
  question: According to the manual, what is the only effective way to sober up after
    drinking alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time to pass
  answer: D
  explanation: Because everyone's liver oxidizes alcohol at a constant rate, nothing
    but time will sober you up. Coffee, showers, or exercise will only result in a
    wide awake, wet, or sweating drunk.
- id: 105
  category: alcohol_drugs_health
  question: How much does your likelihood of a car crash increase if your alcohol
    level reaches 0.15 grams?
  choices:
    A: 1 time
    B: 6 times
    C: 15 times
    D: 25 times
  answer: D
  explanation: The manual states that your chances of an accident increase as your
    BrAC rises, specifically noting that at 0.15 grams, the likelihood increases 25
    times.
- id: 106
  category: penalties_and_points
  question: What happens immediately if you are arrested for driving with an alcohol
    level of 0.08 grams or higher?
  choices:
    A: You are issued a warning and allowed to drive home.
    B: The Secretary of State will immediately suspend your license prior to any court
      appearance.
    C: You must pay a $500 fine on the spot to avoid suspension.
    D: Your vehicle is permanently confiscated by the state.
  answer: B
  explanation: Following your arrest and based solely on the police report and an
    alcohol level test result, the Secretary of State will immediately suspend your
    license prior to any court appearance.
- id: 107
  category: penalties_and_points
  question: What does Maine's 'Implied Consent' law mean?
  choices:
    A: You automatically consent to a chemical test at any time authorities wish to
      administer it.
    B: You consent to having your vehicle searched at any routine traffic stop.
    C: You have the right to refuse a breath test without any penalty.
    D: You consent to paying all traffic fines within 30 days of a citation.
  answer: A
  explanation: Stated briefly, when you operate a motor vehicle in Maine you automatically
    consent to a test at any time the authorities wish to administer it.
- id: 108
  category: penalties_and_points
  question: Under the Implied Consent law, what is the administrative penalty for
    refusing to take an alcohol test?
  choices:
    A: A mandatory 30-day jail sentence
    B: Immediate suspension of your driver's license for up to six years
    C: A permanent revocation of your driver's license
    D: A $5,000 fine and 100 hours of community service
  answer: B
  explanation: You will not be forced to take such a test, but your driver's license
    will be immediately suspended if you refuse. The suspension will be for a period
    of up to six years by the Secretary of State.
- id: 109
  category: penalties_and_points
  question: What is the minimum license suspension period for a first OUI conviction
    with an alcohol level between 0.08 and 0.14?
  choices:
    A: 30 days
    B: 90 days
    C: 150 days
    D: 1 year
  answer: C
  explanation: If you are convicted of OUI and your alcohol level is 0.08 to 0.14
    grams... you lose your license for at least 150 days.
- id: 110
  category: penalties_and_points
  question: Which of the following will result in at least 48 hours in jail for a
    first OUI conviction?
  choices:
    A: Having an alcohol level of 0.10
    B: Traveling 30 mph or more over the speed limit
    C: Failing to dim headlights for oncoming traffic
    D: Making frequent lane changes
  answer: B
  explanation: If you are convicted of OUI and... you are traveling 30 mph or more
    over the speed limit... you will spend at least 48 hours in jail.
- id: 111
  category: penalties_and_points
  question: What additional penalty is added to an OUI or refusal suspension if a
    passenger under the age of 21 was in the vehicle?
  choices:
    A: A 275-day suspension
    B: A 150-day suspension
    C: A $1,000 fine
    D: 30 days in jail
  answer: A
  explanation: A suspension period of 275 days must be added to the OUI or refusal
    suspension if a passenger under the age of 21 was in the vehicle.
- id: 112
  category: license_system
  question: After your first OUI conviction, how long is your reinstated license conditional?
  choices:
    A: 6 months
    B: 1 year
    C: 5 years
    D: 10 years
  answer: B
  explanation: After the first OUI conviction, the reinstated license is conditional
    for one year.
- id: 113
  category: penalties_and_points
  question: What happens if a conditional licensee operates a motor vehicle with any
    amount of alcohol in their system?
  choices:
    A: They receive a written warning.
    B: Their license is suspended for 30 days.
    C: Their license is suspended for one year without a preliminary hearing.
    D: They must retake the driving test.
  answer: C
  explanation: A conditional licensee will have their driver's license suspended for
    one year, without preliminary hearing, if operating a motor vehicle with any amount
    of alcohol.
- id: 114
  category: license_system
  question: Are there provisions for a work or limited license during the minimum
    period of suspension for an OUI conviction?
  choices:
    A: Yes, if you need to drive to work.
    B: Yes, but only for medical emergencies.
    C: Yes, if you pay an extra fee.
    D: No, offenders are initially absolutely prohibited from driving.
  answer: D
  explanation: There are no provisions whatsoever for a work or limited license during
    the minimum period of suspension for an OUI conviction. Offenders are initially
    absolutely prohibited from driving!
- id: 115
  category: alcohol_drugs_health
  question: Can the use of an over-the-counter medication or prescription drug be
    used as a defense in court for impaired driving?
  choices:
    A: Yes, if prescribed by a doctor.
    B: Yes, if it is an over-the-counter medication.
    C: No, the use of these medications does not constitute a defense in court.
    D: Yes, but only for first-time offenders.
  answer: C
  explanation: 'The manual explicitly states: ''The use of an over-the-counter medication
    or a prescription drug does not constitute a defense in court.'''
- id: 116
  category: alcohol_drugs_health
  question: What factors determine a person's Breath Alcohol Concentration (BrAC)?
  choices:
    A: The amount of alcohol consumed, time, and the person's weight
    B: The type of alcohol consumed and the person's height
    C: The person's age and gender
    D: The amount of food eaten before drinking
  answer: A
  explanation: BrAC is determined by the amount of alcohol consumed, the time required
    by the body to rid itself of alcohol, and the person's weight.
- id: 117
  category: safe_driving_rules
  question: According to the manual, a person who has been drinking is more likely
    to do which of the following?
  choices:
    A: Brake too early for traffic signals
    B: Drive too fast or too slow for prevailing conditions
    C: Maintain a strict center lane position
    D: Become overly cautious in emergencies
  answer: B
  explanation: 'Simply put, a person who has been drinking is more likely to: Drive
    too fast or too slow for prevailing conditions; Fail to remain in the center of
    the lane; Take too long to brake; and Lose alertness and adaptability in emergencies.'
- id: 118
  category: alcohol_drugs_health
  question: What is the effect of combining alcohol and other drugs in the body?
  choices:
    A: The drugs cancel out the effects of the alcohol.
    B: The risk of having a traffic accident becomes even greater.
    C: It is safe as long as the drugs are prescribed by a doctor.
    D: It only affects your driving if you take illegal drugs.
  answer: B
  explanation: When alcohol and other drugs combine in the body, the risk of having
    a traffic accident becomes even greater, as drugs can increase the effects of
    alcohol.
- id: 119
  category: penalties_and_points
  question: What is the penalty for refusing to submit to a chemical test if you are
    involved in a fatal motor vehicle accident?
  choices:
    A: A 6-month license suspension
    B: A 1-year license suspension
    C: A $500 fine and no suspension
    D: Permanent revocation of your license
  answer: B
  explanation: Every driver involved in a fatal motor vehicle accident must submit
    to a chemical test. Failure to do so will result in a one-year license suspension.
- id: 120
  category: alcohol_drugs_health
  question: According to the manual, how does alcohol affect the human body?
  choices:
    A: It acts as a stimulant to improve reflexes.
    B: It is a depressant that puts the brain to sleep.
    C: It increases your ability to judge time and space.
    D: It only affects the body if consumed with prescription drugs.
  answer: B
  explanation: Though one or two drinks may make some people feel livelier, alcohol
    is a depressant and the more you take in, the more your brain is put to sleep.
- id: 121
  category: penalties_and_points
  question: If you are convicted of vehicular homicide and were under the influence
    of intoxicants at the time of the offense, what will happen to your driver's license?
  choices:
    A: It will be suspended for 1 year.
    B: It will be revoked for 5 years.
    C: It will be permanently revoked.
    D: It will be suspended until you complete an alcohol education course.
  answer: C
  explanation: If you were under the influence of intoxicants at the time of a vehicular
    homicide offense, your license will be revoked permanently.
- id: 122
  category: safe_driving_rules
  question: If your vehicle does not have a trunk, where is it legal to carry an open
    alcoholic beverage container?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: Behind the last upright seat or in an area not normally occupied
    D: In the center console cup holder
  answer: C
  explanation: An exception to the Open Container Law allows an open container in
    a vehicle without a trunk if it is located behind the last upright seat or in
    an area not normally occupied by the operator or passenger.
- id: 123
  category: alcohol_drugs_health
  question: How can amphetamines affect your ability to drive?
  choices:
    A: They permanently improve your concentration.
    B: They decrease your ability to concentrate and can cause hallucinations.
    C: They lower your blood pressure and cut off oxygen to the brain.
    D: They improve your ability to judge time and space.
  answer: B
  explanation: Amphetamines can decrease one's ability to concentrate and cause hallucinations.
    When the effect wears off, one is likely to be very tired and depressed.
- id: 124
  category: penalties_and_points
  question: According to the manual, approximately how much could one drink over the
    legal limit cost a driver in total OUI expenses?
  choices:
    A: $500
    B: $2,000
    C: $4,000
    D: Over $7,000
  answer: D
  explanation: Operating Under the Influence is costly; in fact, one drink over the
    legal limit could cost well over $7,000 (specifically estimated at $7,240.00).
- id: 125
  category: license_system
  question: How does Maine law classify the driver's licenses of individuals under
    21 years of age regarding OUI laws?
  choices:
    A: They are considered unrestricted.
    B: They are considered provisional and subject to immediate suspension.
    C: They are exempt from chemical testing.
    D: They are only valid for driving to and from work.
  answer: B
  explanation: Regarding Maine's OUI laws, all licenses issued to minors (people under
    21 years of age) are considered provisional and subject to immediate suspension
    until the individual attains the age of 21.
- id: 126
  category: alcohol_drugs_health
  question: What is the leading cause of death for young people ages 16 to 24 in the
    United States?
  choices:
    A: Drug overdoses
    B: Alcohol-related automobile accidents
    C: Distracted driving accidents
    D: Heart failure
  answer: B
  explanation: The leading cause of death for young people in the United States (ages
    16 to 24) is alcohol-related automobile accidents.
- id: 127
  category: penalties_and_points
  question: If a driver under 21 years of age is found operating a motor vehicle with
    any amount of alcohol in their blood, what is the minimum license suspension period?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 5 years
  answer: C
  explanation: If you are ever found to be operating a motor vehicle with any amount
    of alcohol in your blood (or refuse to submit to the test) you will lose your
    driver's license for at least one year.
- id: 128
  category: safe_driving_rules
  question: Under what circumstances is it legal for a person under 21 to transport
    alcohol in a motor vehicle?
  choices:
    A: If the alcohol is in a sealed container in the trunk.
    B: If they are accompanied by a friend who is over 21.
    C: In the scope of employment or at the request of a parent or guardian.
    D: It is never legal under any circumstances.
  answer: C
  explanation: It is illegal for a person under 21 to transport alcohol in a motor
    vehicle unless in the scope of employment or at the request of a parent or guardian.
- id: 129
  category: driver_responsibility
  question: How should you handle strong emotions like anger or worry before driving?
  choices:
    A: Drive faster to reach your destination sooner.
    B: Take a short walk or nap and stay off the road until you feel in control.
    C: Listen to loud music to distract yourself while driving.
    D: Take an over-the-counter calming medication right before driving.
  answer: B
  explanation: Emotions can affect your ability to think, see, and respond. Ways to
    deal with emotions include giving yourself time to cool off, taking a short walk
    or a nap, and staying off the road until you feel more in control.
- id: 130
  category: penalties_and_points
  question: What is a potential consequence if you are arrested for operating under
    the influence (OUI) or operating after suspension for a previous OUI?
  choices:
    A: You will be required to retake your road test immediately.
    B: Your vehicle is subject to seizure.
    C: You will only receive a warning for the first offense.
    D: Your insurance rates will decrease.
  answer: B
  explanation: A person arrested for operating under the influence or operating after
    suspension if the suspension was for a previous OUI offense is subject to vehicle
    seizure and payment of towing and storage fees.
- id: 131
  category: safe_driving_rules
  question: Which of the following situations is an exception to the Open Container
    Law?
  choices:
    A: A passenger consuming alcohol in the front seat of a personal car.
    B: A passenger consuming alcohol in the living quarters of a motor home.
    C: The driver consuming alcohol while parked on a public way.
    D: A passenger possessing an open container in a taxicab.
  answer: B
  explanation: Exceptions to the Open Container Law include a passenger possessing
    an open alcoholic beverage container or consuming alcohol in the living quarters
    of a motor home, trailer, semi-trailer, or truck camper.
- id: 132
  category: driver_responsibility
  question: Who shares the decision on whether you can safely drive if you have a
    long-term medical condition?
  choices:
    A: Your primary care physician
    B: The Bureau of Motor Vehicles
    C: Your insurance company
    D: The local police department
  answer: B
  explanation: According to the manual, with long-term conditions that could affect
    your driving, the Bureau of Motor Vehicles will share in the decision of whether
    you can safely drive.
- id: 133
  category: driver_testing
  question: What may be required if your medical condition has changed or you have
    started to use special equipment?
  choices:
    A: A written test
    B: A driving evaluation
    C: A new vehicle registration
    D: An eye exam only
  answer: B
  explanation: If your medical condition has changed, or you have started to use special
    equipment, a driving evaluation may be required to assess your driving abilities.
- id: 134
  category: vehicle_information
  question: How much space should you leave between your chest and the steering wheel
    to allow for safe airbag deployment?
  choices:
    A: 5 inches
    B: 10 inches
    C: 12 inches
    D: 15 inches
  answer: B
  explanation: The manual states to leave 10 inches between your chest and the steering
    wheel because of the airbag.
- id: 135
  category: safe_driving_rules
  question: Where should the top of the steering wheel be positioned in relation to
    your body?
  choices:
    A: Above your chin level
    B: No higher than your shoulders but below your chin level
    C: Even with your eyes
    D: Below your chest level
  answer: B
  explanation: The top of the steering wheel should be no higher than your shoulders
    but should also be below your chin level.
- id: 136
  category: vehicle_information
  question: How should you position your head to properly set the left side mirror?
  choices:
    A: Lean to the right so your head is below the rearview mirror
    B: Rest your head against the closed left window
    C: Sit perfectly straight and look left
    D: Turn your head to look over your left shoulder
  answer: B
  explanation: To set the left side mirror, rest your head against the closed left
    window and set the mirror so you can barely see the rear left edge of your vehicle.
- id: 137
  category: safe_driving_rules
  question: 'If you are wearing both a lap belt and a shoulder strap, your chances
    of surviving a collision are:'
  choices:
    A: About twice as good
    B: Three to four times as good
    C: Five to six times as good
    D: Ten times as good
  answer: B
  explanation: If you are wearing both a lap belt and shoulder strap, your chances
    of coming out of a collision alive are three to four times as good.
- id: 138
  category: defensive_driving
  question: 'Being in a collision at 30 MPH without wearing a safety belt is equivalent
    to hitting the ground from the top of a:'
  choices:
    A: Two-story building
    B: Three-story building
    C: Four-story building
    D: Five-story building
  answer: B
  explanation: If you are not wearing safety belts and have a collision at 30 MPH,
    it is like hitting the ground from the top of a three-story building.
- id: 139
  category: safe_driving_rules
  question: How should the shoulder harness of a safety belt be adjusted?
  choices:
    A: Tucked under your arm for comfort
    B: Placed behind your back if it rubs your neck
    C: Snug but loose enough to let your fist go between the belt and your chest
    D: As tight as possible across your collarbone
  answer: C
  explanation: Adjust the shoulder strap so it is snug but just loose enough to let
    your fist go between the belt and your chest. It should not be under your arm
    or behind your back.
- id: 140
  category: safe_driving_rules
  question: Where should the lap belt rest on your body?
  choices:
    A: Across your stomach
    B: High on your waist
    C: Across your thighs
    D: Below your stomach and on your hip bones
  answer: D
  explanation: Keep the lap belt tight, but comfortable, across your lap and hips.
    Make sure it is below your stomach and rests on your hip bones.
- id: 141
  category: safe_driving_rules
  question: According to the manual, what is the safest place for a child of any age
    to ride?
  choices:
    A: The front passenger seat
    B: The back seat
    C: The middle front seat
    D: Any seat with an active airbag
  answer: B
  explanation: The manual states that the back seat is the safest place for a child
    of any age to ride.
- id: 142
  category: safe_driving_rules
  question: How should infants under the age of 2 ride in a vehicle?
  choices:
    A: In the front seat facing forward
    B: In the back seat facing forward
    C: In the back seat facing the rear
    D: In the front seat facing the rear
  answer: C
  explanation: Infants, under age 2, should always ride in the back seat facing the
    rear.
- id: 143
  category: safe_driving_rules
  question: What must you NEVER do regarding a rear-facing child safety seat?
  choices:
    A: Place it in the back seat of a sedan
    B: Place it in front of an active passenger air bag
    C: Secure it using the vehicle's safety belts
    D: Use it for an infant under age 2
  answer: B
  explanation: Never place a rear-facing child safety seat in front of an active passenger
    air bag, as children near airbags are at risk.
- id: 144
  category: vehicle_information
  question: Where should your head rest contact the back of your head?
  choices:
    A: At the base of your neck
    B: Below the level of your ears
    C: Above the level of your ears
    D: At the very top of your head
  answer: C
  explanation: Your head rest should contact the back of your head above the level
    of your ears.
- id: 145
  category: defensive_driving
  question: Statistically, what is the chance that every citizen will be in a serious
    accident in his or her life?
  choices:
    A: One in two
    B: One in three
    C: One in four
    D: One in five
  answer: B
  explanation: Statistically, every citizen has a one in three chance of being in
    a serious accident in his or her life.
- id: 146
  category: safe_driving_rules
  question: Who should sit as far back as possible from the steering wheel or dashboard
    due to airbag risks?
  choices:
    A: Only children under 12
    B: Only drivers of large trucks
    C: All drivers or front seat passengers, especially short, pregnant, or elderly
      ones
    D: Only passengers who are not wearing seatbelts
  answer: C
  explanation: All drivers or front seat passengers, especially short, pregnant, or
    elderly ones should sit as far back as possible from the steering wheel or dashboard
    to minimize airbag risks.
- id: 147
  category: safe_driving_rules
  question: What is the requirement for transporting a child who weighs less than
    55 pounds in a motor vehicle?
  choices:
    A: They must be secured in a standard seat belt.
    B: They must be properly secured in a child safety seat.
    C: They can sit in the front seat without a restraint.
    D: They must be held by an adult passenger.
  answer: B
  explanation: According to the manual, when a child who weighs less than 55 pounds
    is being transported, the operator must have the child properly secured in a child
    safety seat.
- id: 148
  category: safe_driving_rules
  question: According to Maine law, which children should be properly secured in the
    rear seat of a vehicle, if possible?
  choices:
    A: Children less than 12 years of age and weighing less than 100 pounds.
    B: Children less than 8 years of age and weighing less than 80 pounds.
    C: Children less than 15 years of age.
    D: All children under 18 years of age.
  answer: A
  explanation: The manual states that the operator shall ensure that a child who is
    less than 12 years of age and who weighs less than 100 pounds is properly secured
    in the rear seat of a vehicle, if possible.
- id: 149
  category: safe_driving_rules
  question: Which of the following individuals is exempt from the requirement to wear
    a seat belt while performing their duties?
  choices:
    A: A school bus driver.
    B: A rural mail carrier of the United States Postal Service while delivering mail.
    C: A teenager driving to school.
    D: A passenger in a personal vehicle.
  answer: B
  explanation: The manual lists exceptions to the seat belt law, including a rural
    mail carrier of the United States Postal Service who is not required to be secured
    in a seat belt while engaged in the delivery of mail.
- id: 150
  category: vehicle_information
  question: When starting the engine of a vehicle, what should you do immediately
    after turning the ignition switch to start and engaging the engine?
  choices:
    A: Turn on the high beam headlights.
    B: Shift into reverse.
    C: Turn on the low beam headlights and lock the doors.
    D: Press the accelerator to the floor.
  answer: C
  explanation: The manual instructs drivers to turn the ignition switch to start (engage
    the engine), turn on the low beam headlights, and lock the doors.
- id: 151
  category: vehicle_information
  question: In a manual transmission vehicle, what is the "friction point"?
  choices:
    A: The point where the brake pads meet the rotors.
    B: The point when the engine and the transmission engage as you let up the clutch
      pedal.
    C: The point where the tires lose traction on a slippery road.
    D: The point when the accelerator is pressed to the floor.
  answer: B
  explanation: The manual defines the friction point as the point when, as you let
    up the clutch pedal, the engine and the transmission engage.
- id: 152
  category: safe_driving_rules
  question: Which gear is recommended to start a manual transmission vehicle on ice
    or in heavy snow?
  choices:
    A: First gear
    B: Second gear
    C: Third gear
    D: Fourth gear
  answer: B
  explanation: According to the manual, you can use second gear to start on ice or
    drive in heavy snow.
- id: 153
  category: defensive_driving
  question: 'When driving a manual transmission vehicle on a down slope, you should
    downshift to slow the car EXCEPT when:'
  choices:
    A: The road is slippery.
    B: You are approaching a stop sign.
    C: You need to steer effectively.
    D: You are trying to gain power.
  answer: A
  explanation: The manual states that one reason to downshift is slowing the car on
    a down slope, except when the road is slippery.
- id: 154
  category: sharing_the_road
  question: How should you signal your intention to the driver behind you if you are
    going to stop or slow down unexpectedly?
  choices:
    A: Turn on your hazard lights.
    B: Honk your horn three times.
    C: Tap your brake pedal three or four times quickly.
    D: Wave your hand out the window.
  answer: C
  explanation: If you are going to stop or slow down at a place where another driver
    doesn't expect it, the manual advises to tap your brake pedal three or four times
    quickly in order to signal your intention to the driver behind you.
- id: 155
  category: safe_driving_rules
  question: To avoid injury from an air bag deployment and maintain the best control,
    where should you place your hands on the steering wheel?
  choices:
    A: 10 and 2
    B: 9 and 3 or 8 and 4
    C: 12 and 6
    D: Only at the 6 o'clock position
  answer: B
  explanation: The manual instructs drivers to put their hands at 9 and 3 or 8 and
    4 to avoid injury from an air bag deployment and for best control.
- id: 156
  category: vehicle_information
  question: Which of the following is a correct technique for gripping the steering
    wheel?
  choices:
    A: Hold the inside of the wheel to maintain better control.
    B: Use the palms of your hands when steering.
    C: Keep your thumbs tucked inside the steering wheel.
    D: Keep your thumbs up along the face of the steering wheel.
  answer: D
  explanation: The manual states to use your fingers, not the palms of your hands,
    keep your thumbs up along the face of the steering wheel, and never hold the inside
    of the wheel when driving.
- id: 157
  category: safe_driving_rules
  question: When backing up a vehicle, where should you place your left hand on the
    steering wheel?
  choices:
    A: At 9 o'clock
    B: At 6 o'clock
    C: At 12 o'clock
    D: At 3 o'clock
  answer: C
  explanation: When backing, the manual instructs to grasp the steering wheel at 12
    o’clock with your left hand.
- id: 158
  category: safe_driving_rules
  question: What is the maximum recommended speed when backing up a vehicle?
  choices:
    A: 10 miles per hour
    B: 5 miles per hour
    C: No faster than a slow walk
    D: The same speed as forward idle
  answer: C
  explanation: The manual explicitly states to back slowly and "Back no faster than
    a slow walk."
- id: 159
  category: driver_responsibility
  question: To conserve fuel and reduce pollution, you should not idle your car for
    more than how long when stopping or starting?
  choices:
    A: One minute
    B: Three minutes
    C: Five minutes
    D: Ten minutes
  answer: A
  explanation: 'The manual states: "When you stop or start the car, don''t idle for
    more than one minute."'
- id: 160
  category: vehicle_information
  question: What is the most efficient way to warm up a car's motor?
  choices:
    A: Idle the engine for at least five minutes.
    B: Rev the engine while in park.
    C: Drive slowly for the first few minutes.
    D: Turn on the heater to maximum before driving.
  answer: C
  explanation: According to the manual, "Driving slowly for the first few minutes
    is a more efficient way to warm the motor."
- id: 161
  category: defensive_driving
  question: Why should you not depend solely on your mirrors or a back-up camera while
    backing?
  choices:
    A: They use too much battery power.
    B: They do not show the area directly behind your vehicle and provide a limited
      view.
    C: They are illegal to use while the vehicle is in reverse.
    D: They distort the distance of objects behind you.
  answer: B
  explanation: The manual warns that your mirrors do not show the area directly behind
    your vehicle and a back-up camera provides a limited view, so you should not depend
    solely on them while backing.
- id: 162
  category: vehicle_information
  question: How much gas does the average car use when idling for six minutes?
  choices:
    A: A gallon
    B: A cup
    C: A pint
    D: A quart
  answer: B
  explanation: According to the manual, the average car uses a cup of gas every six
    minutes when idling.
- id: 163
  category: safe_driving_rules
  question: If two vehicles arrive at a four-way stop at the same time beside each
    other, who has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver going straight
    D: The driver who signals first
  answer: B
  explanation: The driver on your right at a four-way stop has the right-of-way if
    both of you arrive at the same time beside each other.
- id: 164
  category: safe_driving_rules
  question: When entering a traffic circle, who has the right-of-way?
  choices:
    A: The vehicle entering the circle
    B: The vehicle already in the circle
    C: The vehicle on the right
    D: The larger vehicle
  answer: B
  explanation: When entering a traffic circle, the vehicle which is already in the
    circle has the right-of-way.
- id: 165
  category: penalties_and_points
  question: What is the penalty for failing to yield and stop for an approaching emergency
    vehicle sounding a siren and emitting a flashing light?
  choices:
    A: A Class E crime
    B: A Class D crime
    C: A traffic infraction with a $50 fine
    D: A license suspension of 30 days
  answer: A
  explanation: You must immediately drive to the right side of the roadway and stop
    for an emergency vehicle. Failure to do so is a Class E crime.
- id: 166
  category: sharing_the_road
  question: When you are turning left, you must yield to which of the following approaching
    from the opposite direction?
  choices:
    A: Only other motor vehicles
    B: Pedestrians only
    C: Bicycle and roller ski operators
    D: Only emergency vehicles
  answer: C
  explanation: Motor vehicle operators turning left must yield to bicycle and roller
    ski operators approaching from the opposite direction.
- id: 167
  category: safe_driving_rules
  question: Is it legal to drive a motor vehicle through a parking area to avoid a
    traffic control device?
  choices:
    A: Yes, if the intersection is congested.
    B: Yes, but only during daylight hours.
    C: No, an operator may not drive through a parking area to avoid obeying a traffic
      control device.
    D: No, unless directed by a passenger.
  answer: C
  explanation: An operator may not drive a motor vehicle through a parking area to
    avoid obeying the requirements of a traffic control device.
- id: 168
  category: signs_and_signals
  question: If traffic lights are arranged horizontally, what is the correct order
    of colors from left to right?
  choices:
    A: Green, yellow, red
    B: Red, yellow, green
    C: Yellow, red, green
    D: Red, green, yellow
  answer: B
  explanation: If traffic lights are horizontal, the red light is on the left, the
    yellow light is in the middle and the green light is on the right.
- id: 169
  category: signs_and_signals
  question: What does a flashing yellow traffic light indicate?
  choices:
    A: Stop and look both ways before entering the intersection.
    B: The light is about to change to red.
    C: Slow down and proceed with caution.
    D: You must wait behind the stop line until the light turns green.
  answer: C
  explanation: A Flashing YELLOW Traffic Light means to slow down and proceed with
    caution, and be prepared to stop for any traffic.
- id: 170
  category: signs_and_signals
  question: What does a steady red arrow on a traffic light mean?
  choices:
    A: You may turn in the direction of the arrow after coming to a complete stop.
    B: Traffic making the turn indicated by the arrow must stop until the arrow changes
      to green.
    C: You may go cautiously in the direction of the arrow, yielding to all traffic.
    D: The lane is closed and you must merge into another lane.
  answer: B
  explanation: A steady red arrow means traffic making the turn indicated by the arrow
    must stop until the arrow changes to green.
- id: 171
  category: signs_and_signals
  question: What does a flashing yellow 'X' in a special overhead lane use control
    light indicate?
  choices:
    A: Do not drive in this lane.
    B: Clear this lane, the signal is about to change to red.
    C: This lane may only be used for a left turn.
    D: You may use this lane to go straight.
  answer: C
  explanation: A Flashing Yellow 'X' indicates that this lane may only be used for
    a left turn.
- id: 172
  category: signs_and_signals
  question: What is the general shape and color of a warning sign?
  choices:
    A: Round and yellow with black lettering
    B: Diamond shaped and yellow with black lettering or symbols
    C: Rectangular and orange with black letters
    D: Octagon shaped and red with white letters
  answer: B
  explanation: Warning signs warn of danger ahead. They are usually diamond shaped
    and are usually yellow with black lettering or symbols.
- id: 173
  category: signs_and_signals
  question: What does an orange diamond or rectangular shaped sign with black letters
    or symbols indicate?
  choices:
    A: A railroad crossing ahead
    B: A school zone
    C: A work zone with people working on or near the road
    D: A no passing zone
  answer: C
  explanation: Work Zone Signs are orange diamond or rectangular shaped signs with
    black letters or symbols. These signs warn you of work zones and people working
    on or near the road.
- id: 174
  category: safe_driving_rules
  question: If two cars approach an intersection at the same time from opposite directions
    and one driver is signaling for a turn, who has the right-of-way?
  choices:
    A: The car making the turn
    B: The car going straight
    C: The car on the right
    D: The car that arrived slightly later
  answer: B
  explanation: If two cars approach an intersection at the same time from opposite
    directions and one driver is signaling for a turn, the right-of-way belongs to
    the car going straight.
- id: 175
  category: safe_driving_rules
  question: If you must stop for traffic or a signal near a railroad crossing, where
    should you wait?
  choices:
    A: On the tracks if the gate is up
    B: At the stop line before the tracks
    C: Just past the tracks
    D: As close to the tracks as possible without touching them
  answer: B
  explanation: If you must stop for traffic or a signal near a railroad crossing,
    wait at the stop line before the tracks (not on the tracks).
- id: 176
  category: signs_and_signals
  question: What shape and color are work zone signs?
  choices:
    A: Red and white octagons
    B: Orange diamonds or rectangles with black letters
    C: Yellow pennants with black letters
    D: Green rectangles with white letters
  answer: B
  explanation: Work zone signs are orange diamond or rectangular shaped signs with
    black letters or symbols.
- id: 177
  category: penalties_and_points
  question: What is the penalty for speeding in a work zone?
  choices:
    A: Fines are doubled.
    B: Your license is suspended for 30 days.
    C: You receive a warning for the first offense.
    D: Fines are tripled.
  answer: A
  explanation: Fines for speeding in a work zone are doubled.
- id: 178
  category: signs_and_signals
  question: What does a regulatory sign with a red circle and a red slash across a
    symbol indicate?
  choices:
    A: You must yield the right-of-way.
    B: You are approaching a work zone.
    C: You cannot do certain things.
    D: You must come to a complete stop.
  answer: C
  explanation: Some regulatory signs have a red circle with a red slash across the
    symbol. This means you cannot do certain things.
- id: 179
  category: safe_driving_rules
  question: Where must you stop at a stop sign if there is no crosswalk or stop line?
  choices:
    A: Directly underneath the stop sign.
    B: At the point nearest the intersection to enable you to see approaching traffic.
    C: Ten feet before the intersection begins.
    D: You do not need to stop completely if the road is clear.
  answer: B
  explanation: If there is no crosswalk or stop line, stop at the point nearest the
    intersection to enable you to see approaching traffic on the intersecting roadway.
- id: 180
  category: signs_and_signals
  question: What is the proper use of a shared center lane?
  choices:
    A: It is used for passing slower vehicles.
    B: It is a lane only for left turning vehicles.
    C: It is a lane for through traffic during rush hour.
    D: It is a parking lane for emergency vehicles.
  answer: B
  explanation: A shared center lane marks a lane that is only for left turning vehicles.
    It is not for through traffic or for passing other vehicles.
- id: 181
  category: driver_responsibility
  question: What is the consequence of trying to flee or escape a police officer who
    is directing traffic?
  choices:
    A: You will be required to take a defensive driving course.
    B: You can lose your license.
    C: You will receive a warning.
    D: Your vehicle will be impounded for 30 days.
  answer: B
  explanation: You can lose your license for trying to flee or escape a police officer.
- id: 182
  category: signs_and_signals
  question: Which colors are typically used for guide signs that direct you to cities,
    towns, and points of interest?
  choices:
    A: Red, white, and black
    B: Orange and black
    C: Green, brown, or blue
    D: Yellow and green
  answer: C
  explanation: Guide signs are square or rectangular and are green, brown, or blue.
    They advise you of intersecting roads, help direct you to cities and towns, and
    mark points of interest.
- id: 183
  category: safe_driving_rules
  question: Under what condition is it legal to pass another motor vehicle on the
    right side?
  choices:
    A: When the vehicle ahead is driving below the speed limit on a two-lane road.
    B: When the car you are passing is making a left turn and there is room for two
      or more lanes to move in the same direction.
    C: When you are driving off the pavement or main traveled portion of the roadway.
    D: When you are in a shared center turn lane.
  answer: B
  explanation: You may never pass another motor vehicle on the right side except when
    the car you are passing is making a left turn and there is room for two or more
    lanes to move in the same direction, or when the car is in the left lane on a
    street with two or more marked lanes moving in the same direction.
- id: 184
  category: sharing_the_road
  question: On a section of the Maine Turnpike with three lanes in either direction,
    where are large trucks (excluding pickups) restricted to driving?
  choices:
    A: Only in the center lane.
    B: Only in the far left lane.
    C: Only in the two farthest right-hand lanes.
    D: They may drive in any lane.
  answer: C
  explanation: On any section of the Maine Turnpike or Interstate-95 that consists
    of three lanes in either direction, trucks, including truck tractors, but excluding
    pickup trucks may only operate in the two farthest right-hand lanes.
- id: 185
  category: defensive_driving
  question: Why should you keep your wheels straight while waiting to make a left
    turn at an intersection?
  choices:
    A: It prevents your power steering fluid from overheating.
    B: It allows you to accelerate faster when the light turns green.
    C: If you are struck from behind, you will not be pushed forward into oncoming
      traffic.
    D: It signals to other drivers that you are yielding the right-of-way.
  answer: C
  explanation: Don't turn the wheels before you make the turn. If you are struck from
    behind, you may be pushed forward into oncoming traffic.
- id: 186
  category: safe_driving_rules
  question: What should you do if you have started to make a turn at an intersection
    but realize you made a mistake?
  choices:
    A: Stop immediately and back up.
    B: Make a U-turn in the middle of the intersection.
    C: Follow through with the turn and work your way back from the next intersection.
    D: Put your vehicle in reverse and return to your original lane.
  answer: C
  explanation: If you have started to make a turn you should follow through as last
    second changes can cause accidents. If you have made a mistake, go on to the next
    intersection and work your way back to where you wanted to go.
- id: 187
  category: signs_and_signals
  question: What is the difference between solid white lines and broken white lines
    painted on the roadway?
  choices:
    A: Solid lines separate traffic moving in opposite directions, while broken lines
      separate traffic moving in the same direction.
    B: Solid lines discourage changing lanes, while broken lines allow safe lane changes.
    C: Solid lines indicate a passing zone, while broken lines indicate a no-passing
      zone.
    D: Solid lines are only used in school zones, while broken lines are used on highways.
  answer: B
  explanation: Solid white lines painted on the roadway separate lanes of traffic
    going in the same direction that have different uses. They also discourage changing
    lanes. Broken white lines simply indicate multiple lanes going in the same direction
    and they allow safe lane changes.
- id: 188
  category: safe_driving_rules
  question: When making a right turn, which lane should you turn into?
  choices:
    A: The leftmost lane going in your direction.
    B: The center lane.
    C: The rightmost lane going in your direction.
    D: Any lane that is currently free of traffic.
  answer: C
  explanation: When making a right turn, turn into the rightmost lane going in your
    direction.
- id: 189
  category: signs_and_signals
  question: What does a yield sign indicate?
  choices:
    A: You must come to a complete stop regardless of traffic.
    B: You should speed up to merge smoothly with traffic.
    C: You should slow down to wait for traffic to clear and yield to traffic or pedestrians.
    D: You have the right-of-way over all other traffic.
  answer: C
  explanation: A yield sign means you should slow down to wait for traffic to clear
    on the road you are entering or crossing. You must slow and yield to traffic or
    pedestrians that have the right-of-way before proceeding.
- id: 190
  category: penalties_and_points
  question: What is the penalty for failing to yield the right-of-way to a visually
    impaired pedestrian?
  choices:
    A: Minimum $25 and maximum $500 fine
    B: Minimum $50 and maximum $1,000 fine
    C: License suspension for 30 days
    D: Minimum $100 and maximum $2,000 fine
  answer: B
  explanation: An operator who fails to yield the right-of-way to a visually impaired
    pedestrian is liable for a traffic infraction with a minimum $50 and maximum $1,000
    fine.
- id: 191
  category: sharing_the_road
  question: If you see anyone in the roadway with a white cane or guide dog, you must
    stop at least how far away?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: If you see anyone in the roadway with a white cane or guide dog, stop
    at least 10 feet away and wait until the person is out of danger.
- id: 192
  category: signs_and_signals
  question: When approaching a reversible lane, what does a red X signal above the
    lane indicate?
  choices:
    A: You can use the lane
    B: You must yield to oncoming traffic
    C: You cannot use the lane
    D: The lane is for left turns only
  answer: C
  explanation: In a reversible lane, a green arrow means you can use the lane. A red
    X means you cannot use the lane.
- id: 193
  category: safe_driving_rules
  question: Where should you stop your vehicle when approaching an intersection with
    a painted stop line?
  choices:
    A: Just past the stop line
    B: Before the painted stop line
    C: In the middle of the crosswalk
    D: At the edge of the intersecting roadway
  answer: B
  explanation: Stop lines are usually painted on the roadway at a distance from an
    intersection to give pedestrians a walkway. You must stop your car before the
    painted stop lines.
- id: 194
  category: safe_driving_rules
  question: Which of the following is a correct rule for making a right turn?
  choices:
    A: Swing wide to the left before turning right
    B: Always turn right from the leftmost portion of your lane
    C: Do not swing wide to the left before a right turn
    D: Accelerate rapidly before entering the turn
  answer: C
  explanation: When making a right turn, you should not swing wide to the left before
    a right turn, and you should always turn right from the rightmost portion of your
    lane.
- id: 195
  category: safe_driving_rules
  question: 'When turning from a roadway with multiple left or right turn lanes, you
    should:'
  choices:
    A: Change lanes while in the middle of the intersection
    B: Enter the same lane from which you are turning and stay in it until finished
    C: Always turn into the far right lane regardless of your starting lane
    D: Yield to vehicles in the adjacent turn lane and merge into their lane
  answer: B
  explanation: When navigating multiple left or right turn lanes, you must enter the
    same lane from which you are turning and stay in that lane until the turn is finished.
- id: 196
  category: defensive_driving
  question: Before moving after a stop at an intersection, in which order should you
    check for traffic?
  choices:
    A: Look right, then left, then right again
    B: Look left, then right, then left again
    C: Look straight ahead, then left, then right
    D: Look in your rearview mirror, then left
  answer: B
  explanation: Before moving after a stop, check for traffic and bicyclists. Look
    left, then right, then left again before you enter the intersection.
- id: 197
  category: defensive_driving
  question: Why should you avoid turning into a lane just because an oncoming vehicle
    has its turn signal on?
  choices:
    A: Turn signals are often difficult to see in daylight
    B: The driver may plan to turn after passing you or may have forgotten to turn
      the signal off
    C: Oncoming vehicles always have the right-of-way even if turning
    D: The law requires you to wait until all oncoming traffic has passed
  answer: B
  explanation: Do not turn into a lane just because an oncoming vehicle has a turn
    signal on. The driver may plan to turn after they pass you or they may have forgotten
    to turn their signal off.
- id: 198
  category: safe_driving_rules
  question: Who has the right-of-way at a traffic circle or roundabout?
  choices:
    A: Vehicles entering the traffic circle
    B: Vehicles already in the traffic circle
    C: Vehicles approaching from the right
    D: Vehicles traveling at higher speeds
  answer: B
  explanation: All vehicles approaching traffic circles or roundabouts must yield
    the right-of-way to vehicles already in the circle or roundabout unless otherwise
    directed by a police officer or traffic control devices.
- id: 199
  category: safe_driving_rules
  question: 'At large traffic circles, called rotaries, drivers must yield the right-of-way
    to:'
  choices:
    A: A vehicle on the operator's right
    B: A vehicle on the operator's left
    C: Pedestrians only
    D: Vehicles entering the rotary
  answer: B
  explanation: At large traffic circles, called rotaries, vehicles proceed to the
    right or counterclockwise around the center island. Drivers must yield the right-of-way
    to a vehicle on the operator's left.
- id: 200
  category: safe_driving_rules
  question: How should you exit a traffic circle or roundabout?
  choices:
    A: By making a left turn
    B: By stopping and waiting for a gap
    C: By making a right turn
    D: By accelerating rapidly straight ahead
  answer: C
  explanation: Exit from the circle or roundabout is then made by making a right turn.
- id: 201
  category: safe_driving_rules
  question: When changing lanes, you should always signal your intention at least
    how far before making a change?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Always signal what you intend to do at least 100 feet before making
    a change.
- id: 202
  category: defensive_driving
  question: Why must you turn your head and look over your shoulder when changing
    lanes?
  choices:
    A: To check your vehicle's speed
    B: To ensure your turn signal is working
    C: To check areas not covered by your rearview and side mirrors
    D: To communicate with other drivers
  answer: C
  explanation: Blind spots are areas around your vehicle caused by headrests and door
    pillars that block your vision. They are not covered by your mirrors, so you must
    turn your head and look over your shoulder.
- id: 203
  category: safe_driving_rules
  question: What is the purpose of the acceleration lane when entering an expressway?
  choices:
    A: To provide a place to park in an emergency
    B: To allow you to get up to the speed of traffic before merging
    C: To allow exiting vehicles to slow down
    D: To bypass heavy traffic on the main roadway
  answer: B
  explanation: The acceleration lane, which varies in length, enables you to get up
    to the speed of traffic before merging into the regular lanes.
- id: 204
  category: defensive_driving
  question: If your view of a cross street is blocked by buildings, trees, or parked
    cars at an intersection, what should you do?
  choices:
    A: Sound your horn and proceed quickly
    B: Edge forward slowly until you can see
    C: Wait for another vehicle to enter the intersection first
    D: Turn on your hazard lights and proceed at the speed limit
  answer: B
  explanation: Make sure you have a good view. If your view of a cross street is blocked
    by buildings, trees, a fence or a row of parked cars, edge forward slowly until
    you can see.
- id: 205
  category: safe_driving_rules
  question: What should you do if you are entering an expressway that does not have
    an acceleration lane?
  choices:
    A: Accelerate rapidly on the shoulder before merging.
    B: Stop before entering, wait for a break in traffic, and then speed up and merge.
    C: Force your way into the right lane since expressway traffic must yield.
    D: Drive at a slow, steady speed until a gap opens up.
  answer: B
  explanation: According to the manual, if an entrance to an expressway does not have
    an acceleration lane, you should stop before entering, wait for a break in the
    traffic, and then speed up and merge.
- id: 206
  category: safe_driving_rules
  question: When passing another vehicle, when is it safe to move back into the right
    lane?
  choices:
    A: As soon as your front bumper is ahead of the passed vehicle.
    B: When you can see the entire passed vehicle in your rearview mirror.
    C: After you have traveled for at least three seconds in the left lane.
    D: When the driver of the passed vehicle flashes their headlights.
  answer: B
  explanation: 'The manual states: "Make sure you can see the entire passed vehicle
    in your rearview mirror before moving back to the right lane."'
- id: 207
  category: safe_driving_rules
  question: What is the proper way to slow down when exiting a multi-lane highway?
  choices:
    A: Brake firmly while still in the main expressway lane.
    B: Start slowing down as soon as you enter the deceleration lane.
    C: Coast to a stop before entering the exit ramp.
    D: Maintain your highway speed until you are completely on the exit ramp.
  answer: B
  explanation: When exiting a multi-lane highway, you should not slow down on the
    main expressway. Instead, start slowing down as soon as you enter the deceleration
    lane and continue slowing at the beginning of the exit ramp.
- id: 208
  category: defensive_driving
  question: If you must stop on an expressway due to an emergency, how should you
    signal your need for assistance?
  choices:
    A: Stand on the traveled portion of the expressway and wave your arms.
    B: Honk your horn repeatedly.
    C: Raise your hood.
    D: Walk along the shoulder to the nearest exit.
  answer: C
  explanation: If an emergency occurs on an expressway, you should pull off the pavement
    as far as the shoulder permits and raise your hood to signal your need for assistance.
- id: 209
  category: defensive_driving
  question: Which of the following is a recommended way to avoid "Expressway Hypnosis"?
  choices:
    A: Keep the interior of the car as warm as possible.
    B: Stare straight ahead at a fixed point on the road.
    C: Vary your speed slightly from time to time.
    D: Rely on stay-awake drugs to maintain focus.
  answer: C
  explanation: To stay alert and avoid expressway hypnosis, the manual recommends
    keeping the car cool, constantly scanning the road, talking or listening to music,
    and varying your speed slightly from time to time.
- id: 210
  category: safe_driving_rules
  question: Approximately how much time do you need to safely complete a pass at highway
    speeds of 50 to 55 mph?
  choices:
    A: 3 to 5 seconds
    B: 6 to 8 seconds
    C: 10 to 12 seconds
    D: 15 to 20 seconds
  answer: C
  explanation: At highway speeds of 50 to 55 mph, you need from 10 to 12 seconds to
    complete a pass safely.
- id: 211
  category: sharing_the_road
  question: What should you do when another vehicle is passing you?
  choices:
    A: Speed up to make the pass quicker.
    B: Move onto the right shoulder.
    C: Stay in your lane and hold a steady speed.
    D: Brake sharply to let them in.
  answer: C
  explanation: When being passed, you must stay in your lane and hold a steady speed
    to allow the pass to occur safely.
- id: 212
  category: safe_driving_rules
  question: You should not start to pass a vehicle if you are within what distance
    of a hill or curve?
  choices:
    A: One-quarter of a mile
    B: One-third of a mile
    C: One-half of a mile
    D: One mile
  answer: B
  explanation: Any time your view is blocked by a curve or a hill, you should assume
    there is an oncoming car. You should not start to pass if you are within one-third
    of a mile of a hill or curve.
- id: 213
  category: safe_driving_rules
  question: According to Maine law, when must you complete a passing maneuver?
  choices:
    A: Before you reach the beginning of a no passing zone.
    B: Within 100 feet of an intersection.
    C: Before the passed vehicle begins to accelerate.
    D: Only after you have entered the no passing zone.
  answer: A
  explanation: Maine law requires that you complete a pass before you reach the beginning
    of a no passing zone.
- id: 214
  category: signs_and_signals
  question: What shape and color is the "NO PASSING ZONE" sign that appears on the
    left side of the road?
  choices:
    A: A rectangular white sign
    B: A yellow pennant sign
    C: A red octagonal sign
    D: A yellow circular sign
  answer: B
  explanation: You may not pass where a yellow pennant NO PASSING ZONE sign appears
    on the left of the road.
- id: 215
  category: sharing_the_road
  question: How much space does Maine law require between the right side of your vehicle
    and a bicycle when you are passing?
  choices:
    A: At least one foot
    B: At least two feet
    C: At least three feet
    D: At least five feet
  answer: C
  explanation: Maine law requires that there be at least three feet of space between
    the right side of your vehicle and the bicycle as you pass.
- id: 216
  category: safe_driving_rules
  question: When approaching a stopped school bus with red lights flashing on a multi-lane
    divided highway, when are you NOT required to stop?
  choices:
    A: When you are traveling in the opposite direction on an undivided highway.
    B: When you are running late for work.
    C: When there is a solid divider between you and the bus.
    D: When you are in a marked parking area.
  answer: C
  explanation: If the roadway has a solid divider between you and the stopped school
    bus, you do not have to stop.
- id: 217
  category: safe_driving_rules
  question: When parallel parking, how much space should you leave between your car
    and the vehicles parked in front and behind you?
  choices:
    A: At least one foot
    B: At least two feet
    C: At least three feet
    D: At least four feet
  answer: B
  explanation: When parking parallel to the road, you must leave at least two feet
    of space between your car and vehicles parked in front or behind.
- id: 218
  category: safe_driving_rules
  question: When parking next to a curb, what is the maximum distance your vehicle
    can be from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: If there is a curb, you must park as close to it as you can, and no
    more than 18 inches away.
- id: 219
  category: safe_driving_rules
  question: Which way should you turn your steering wheel when parking uphill next
    to a curb?
  choices:
    A: Straight ahead
    B: To the right
    C: To the left
    D: Toward the center of the road
  answer: C
  explanation: When parking uphill with a curb, you should turn the wheels to the
    left so that if the car moves, the wheels will be stopped by the curb.
- id: 220
  category: penalties_and_points
  question: What is the fine for parking in an area reserved for persons with disabilities
    without a special parking permit or plates?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: B
  explanation: Municipal ordinances do not allow you to park in an area reserved for
    persons with disabilities unless you have a special permit or plates, which carries
    a $100 fine.
- id: 221
  category: safe_driving_rules
  question: You are prohibited from parking within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: A
  explanation: Some municipal ordinances do not allow you to park within 10 feet of
    a fire hydrant.
- id: 222
  category: safe_driving_rules
  question: How far away must you park from a crosswalk?
  choices:
    A: At least 5 feet
    B: At least 10 feet
    C: At least 15 feet
    D: At least 20 feet
  answer: C
  explanation: You are not allowed to park within 15 feet of a crosswalk.
- id: 223
  category: penalties_and_points
  question: What is the penalty for misusing an access aisle next to a disability
    parking spot?
  choices:
    A: A fine of exactly $100
    B: A fine of not less than $200
    C: A warning for the first offense
    D: A 30-day license suspension
  answer: B
  explanation: Misuse of an access aisle is considered a traffic infraction and subject
    to a fine of not less than $200.00.
- id: 224
  category: safe_driving_rules
  question: When you are finished parallel parking, how far should your vehicle be
    from the curb?
  choices:
    A: Touching the curb
    B: About 6 inches, but not more than 18 inches
    C: Exactly 24 inches
    D: Between 18 and 24 inches
  answer: B
  explanation: When done parking, you should be about 6 inches from the curb but not
    more than 18 inches away from the curb.
- id: 225
  category: safe_driving_rules
  question: When setting up to parallel park behind another vehicle, how far away
    from that vehicle should you stop before backing up?
  choices:
    A: About 1 foot
    B: About 2 feet
    C: About 3 feet
    D: About 4 feet
  answer: B
  explanation: When entering a parallel parking space, you should pull up parallel
    to the vehicle you will be parking behind and stop even with that vehicle but
    about 2 feet away from it.
- id: 226
  category: safe_driving_rules
  question: If you are parked on the right-hand side of the road, what should you
    do before pulling out into the street?
  choices:
    A: Look through your rearview mirror only
    B: Look over your right shoulder
    C: Look over your left shoulder
    D: Honk your horn and pull out quickly
  answer: C
  explanation: If parked on the right-hand side of the road, after starting your vehicle,
    look over your left shoulder (not through your rearview mirror only) before pulling
    out.
- id: 227
  category: safe_driving_rules
  question: Under what conditions should a three-point turnaround be used?
  choices:
    A: On any four-lane highway
    B: Only if the road is too narrow for a U-turn and it is a two-lane road
    C: Whenever you miss your exit on the interstate
    D: In a busy intersection
  answer: B
  explanation: A three-point turnaround should be used only if the road is too narrow
    for a U-turn, and it should only be used on a two-lane road.
- id: 228
  category: defensive_driving
  question: Why should you avoid using windshield washer fluid on a very cold day?
  choices:
    A: It can crack the windshield glass
    B: The mixture may freeze on the windshield
    C: It will damage the wiper blades
    D: It causes a permanent film to build up on the glass
  answer: B
  explanation: The manual advises not to use washer fluid on a very cold day as the
    mixture may freeze on the windshield.
- id: 229
  category: driver_responsibility
  question: What does the manual state about hanging items from the rearview mirror
    or placing decals on the windshield?
  choices:
    A: It is recommended for personalizing your vehicle
    B: It is allowed as long as the items are small
    C: It is a violation of the law because it blocks the driver's vision
    D: It is only illegal if the decals are on the driver's side
  answer: C
  explanation: Don't hang things from the mirror or clutter the windshield with decals.
    Anything in the car that blocks a driver's vision is a violation of the law.
- id: 230
  category: defensive_driving
  question: Why should you avoid following closely behind larger vehicles?
  choices:
    A: They travel at slower speeds
    B: They will block your vision of the road ahead
    C: They create strong wind drafts
    D: They make frequent sudden stops
  answer: B
  explanation: Don’t follow closely behind larger vehicles as they will block your
    vision. Give yourself space so you can see.
- id: 231
  category: sharing_the_road
  question: If you must use the street side to get out of your parked car, what should
    you be especially careful to check for behind you?
  choices:
    A: Pedestrians on the sidewalk
    B: Bicycles
    C: Parked cars
    D: Traffic signs
  answer: B
  explanation: If you must use the street side to get out of your car, check for traffic
    behind you, especially bicycles, before you open the door.
- id: 232
  category: driver_responsibility
  question: If your driver's license restricts you to wearing glasses or contact lenses,
    what is a recommended practice?
  choices:
    A: Only wear them when driving at night
    B: Keep an extra pair of glasses in the car
    C: Wear them only when driving in unfamiliar areas
    D: Keep a copy of your prescription in the glove box
  answer: B
  explanation: If you wear glasses or contact lenses, you should keep an extra pair
    of glasses in the car in case your regular glasses are broken or lost.
- id: 233
  category: defensive_driving
  question: According to the manual, how far ahead should an expert driver try to
    keep looking?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 1 to 2 minutes
  answer: C
  explanation: To avoid last minute moves, you need to look far enough ahead to see
    things early. An expert driver tries to keep looking 20 to 30 seconds ahead.
- id: 234
  category: safe_driving_rules
  question: What is the speed limit in a school zone during school opening or closing
    hours?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: A 5-sided sign means you are in a school zone and must slow to 15 mph
    during recess, or when children are going to or leaving school, during school
    opening or closing hours.
- id: 235
  category: safe_driving_rules
  question: If red lights are flashing at a railroad crossing, what is the minimum
    distance you must stop from the crossing?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: B
  explanation: If red lights are flashing, stop at least 15 feet from the crossing
    and wait until they go out or until you see that the way is clear in both directions.
- id: 236
  category: vehicle_information
  question: Why should you avoid shifting a manual transmission while crossing railroad
    tracks?
  choices:
    A: It is illegal and carries a heavy fine.
    B: It increases the risk of stalling the engine on the tracks.
    C: Being in gear gives you better control on the uneven surface.
    D: It causes unnecessary wear and tear on the clutch.
  answer: C
  explanation: Don't shift a manual transmission while crossing the railroad tracks.
    Being in gear gives you better control on the uneven surface.
- id: 237
  category: defensive_driving
  question: How often should you check your rearview mirror for traffic behind you?
  choices:
    A: Every 2 to 4 seconds
    B: Every 6 to 8 seconds
    C: Every 10 to 15 seconds
    D: Only when preparing to change lanes
  answer: B
  explanation: Check your mirror often for traffic behind you - every 6 to 8 seconds.
    This way you will know if someone is following too closely or coming up too fast.
- id: 238
  category: safe_driving_rules
  question: How much should you reduce your speed when driving on a wet road?
  choices:
    A: 5 to 10 mph
    B: To half your normal speed
    C: 15 to 20 mph
    D: To a crawl
  answer: A
  explanation: 'The manual provides guidelines for how much to slow the car based
    on conditions: for a wet road, slow down 5 to 10 mph.'
- id: 239
  category: safe_driving_rules
  question: What is the recommended speed adjustment when driving on packed snow?
  choices:
    A: Slow down 5 to 10 mph
    B: Slow down to half speed
    C: Slow to a crawl
    D: Maintain the posted speed limit but increase following distance
  answer: B
  explanation: According to the guidelines for how much to slow the car, on packed
    snow you should slow down to half speed.
- id: 240
  category: defensive_driving
  question: Why should you be especially careful on bridges and overpasses on cold,
    wet days?
  choices:
    A: They accumulate more standing water than regular roads.
    B: They tend to freeze first and dry out last.
    C: They are usually made of smoother concrete that lacks traction.
    D: They are prone to severe crosswinds.
  answer: B
  explanation: On cold, wet days, bridges and overpasses can hide spots of ice. Be
    aware that bridges and overpasses tend to freeze first and dry out last.
- id: 241
  category: safe_driving_rules
  question: What happens when a vehicle hydroplanes?
  choices:
    A: The brakes lock up due to excess moisture in the brake lines.
    B: The engine stalls from water entering the exhaust system.
    C: The tires ride up on a film of water and lose contact with the road.
    D: The steering wheel becomes stiff and impossible to turn.
  answer: C
  explanation: As you go faster, your tires cannot wipe the road as well. They start
    to ride up on a film of water, like water skis. This is called 'hydroplaning.'
- id: 242
  category: defensive_driving
  question: Why can pavement be very slippery for the first few minutes when it starts
    to rain?
  choices:
    A: The rain mixes with dirt to create thick mud.
    B: Heat causes oil in the asphalt to come to the surface.
    C: The water has not yet washed away the painted road lines.
    D: Tires need time to adjust to the sudden change in temperature.
  answer: B
  explanation: When it starts to rain, pavement can be very slippery for the first
    few minutes. Heat causes oil in the asphalt to come to the surface.
- id: 243
  category: safe_driving_rules
  question: What is the proper way to handle your speed when approaching and driving
    through a curve?
  choices:
    A: Maintain speed into the curve and brake hard at the apex.
    B: Accelerate before entering the curve and coast through it.
    C: Slow down before entering the curve and slightly accelerate through it.
    D: Brake continuously throughout the entire curve.
  answer: C
  explanation: Always slow before entering a curve. A safe speed allows you to slightly
    accelerate through the curve.
- id: 244
  category: safe_driving_rules
  question: The 15 mph school zone speed limit applies during recess and what other
    time period?
  choices:
    A: From 7:00 AM to 4:00 PM on school days
    B: 1 hour before to 1 hour after the school day
    C: 1/2 hour before the start of the school day to 1/2 hour after the end of the
      school day
    D: Only when children are visibly present in the crosswalk
  answer: C
  explanation: You must slow to 15 mph during recess, or when children are going to
    or leaving school, during school opening or closing hours (1/2 hour before the
    start of the school day to 1/2 hour after the end of the school day).
- id: 245
  category: defensive_driving
  question: How does the temperature affect the slipperiness of ice on the road?
  choices:
    A: Ice is most slippery when temperatures are well below zero.
    B: Ice is more slippery when the temperature is near freezing because it is wet
      and slushy.
    C: Temperature has no effect on the slipperiness of ice.
    D: Ice becomes completely dry and less slippery near freezing.
  answer: B
  explanation: When the temperature is near freezing, road ice is wet (slushy) so
    is more slippery than at colder temperatures.
- id: 246
  category: signs_and_signals
  question: What should you do when approaching railroad tracks marked 'Exempt'?
  choices:
    A: Ignore them as they are permanently out of service.
    B: Check the tracks anyway because they may still be in use.
    C: Stop only if you are driving a school bus.
    D: Accelerate to cross them as quickly as possible.
  answer: B
  explanation: Tracks marked 'Exempt' are not used often but may be in use. Check
    all tracks regardless of these signs.
- id: 247
  category: sharing_the_road
  question: Why should you check your mirrors when going up a long or steep hill?
  choices:
    A: To ensure your cargo is secure.
    B: To watch for emergency vehicles that might be stuck.
    C: To spot trucks and buses building up speed to make it to the top.
    D: To see if your exhaust is smoking from engine strain.
  answer: C
  explanation: 'When You Are Going Up a Long or Steep Hill: Check your mirrors. Drivers
    of trucks and buses often try to build up speed so that they can make it to the
    top of the next hill.'
- id: 248
  category: safe_driving_rules
  question: What is the maximum speed limit in Maine outside any business, residential,
    or built-up area unless posted otherwise?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 55 mph
  answer: B
  explanation: Maximum speeds in Maine, unless posted otherwise, are 45 miles per
    hour outside any business or residential or built-up area.
- id: 249
  category: safe_driving_rules
  question: Unless posted otherwise, what is the maximum speed limit in a business
    or residential district in Maine?
  choices:
    A: 15 mph
    B: 25 mph
    C: 35 mph
    D: 45 mph
  answer: B
  explanation: The manual states that the maximum speed is 25 miles per hour in a
    business district, residential district, or built-up area of the state.
- id: 250
  category: defensive_driving
  question: What is the average perception time for an alert driver to recognize they
    must stop?
  choices:
    A: 1/4 to 1/2 second
    B: 1/2 to 3/4 second
    C: 3/4 to 1 second
    D: 1 to 2 seconds
  answer: C
  explanation: Perception time is the time it takes you to recognize you must stop.
    The average perception time for an alert driver is 3/4 to 1 second.
- id: 251
  category: vehicle_information
  question: At any given time, how much total contact area do all four tires of a
    car have with the surface of the road?
  choices:
    A: One square foot
    B: Two square feet
    C: Four square feet
    D: Eight square feet
  answer: A
  explanation: The only contact your car has with the road is through the tires. At
    any time, the four tires together have only one square foot of rubber on the surface
    of the road.
- id: 252
  category: safe_driving_rules
  question: Because headlights only let you see clearly about 250 feet ahead, driving
    faster than what speed on a dark road is considered "driving blind"?
  choices:
    A: 40 mph
    B: 50 mph
    C: 60 mph
    D: 70 mph
  answer: B
  explanation: Headlights will let you see clearly only about 250 feet ahead. Therefore,
    if you drive faster than about 50 mph on a dark road, you are really "driving
    blind."
- id: 253
  category: defensive_driving
  question: To maintain a safe space cushion in front of your vehicle, how many seconds
    of following distance should you keep between your car and the vehicle in front?
  choices:
    A: At least 2 seconds
    B: At least 3 seconds
    C: At least 4 seconds
    D: At least 6 seconds
  answer: C
  explanation: Following too closely limits your view of the road. Keep at least 4
    seconds between your car and the vehicle in front.
- id: 254
  category: sharing_the_road
  question: What does a red-edged orange triangle on the back of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a slow-moving vehicle that usually goes 25 mph or less
    C: The vehicle is making wide right turns
    D: The vehicle is an emergency responder
  answer: B
  explanation: Farm tractors, animal-drawn carts and roadway maintenance vehicles
    usually go 25 mph or less. These vehicles have a red edged orange triangle (slow-moving
    vehicle sign) posted on the back.
- id: 255
  category: defensive_driving
  question: What is the proper way to enter a freeway safely from an access lane?
  choices:
    A: Stop at the end of the entrance lane and wait for a gap
    B: Look for a gap, increase speed in the entrance lane, and enter at highway speed
    C: Enter the highway immediately and force other drivers to yield
    D: Drive slowly in the entrance lane and merge at 25 mph
  answer: B
  explanation: You need skill and caution to enter a freeway safely from an access
    lane. Look for a gap, then increase speed in the entrance lane and enter the gap
    at highway speed.
- id: 256
  category: defensive_driving
  question: When leaving an expressway, when should you begin to slow down?
  choices:
    A: A quarter-mile before the exit
    B: While you are still in the main traffic lane
    C: Only after you move into the exit lane
    D: Right before you turn your steering wheel
  answer: C
  explanation: On an expressway, do not slow down until you move into the exit lane.
    Slowing way down or stopping early will increase your chances of being hit from
    behind.
- id: 257
  category: safe_driving_rules
  question: According to Maine law, is it legal to drive significantly slower than
    the normal flow of traffic?
  choices:
    A: Yes, driving slowly is always safer
    B: Yes, as long as you stay in the right lane
    C: No, you must not drive so slowly that you interfere with normal traffic movement
    D: No, you must always drive exactly at the posted speed limit
  answer: C
  explanation: Maine law says you must not drive so slowly that you interfere with
    the normal and reasonable movement of traffic except where reduced speed is necessary
    for safety.
- id: 258
  category: defensive_driving
  question: What should you do if heavy rain, a snowstorm, or thick fog prevents you
    from seeing properly even when driving slowly?
  choices:
    A: Turn on your high beams and continue
    B: Follow the taillights of the car in front of you closely
    C: Pull off the road and wait until conditions improve
    D: Honk your horn continuously while driving
  answer: C
  explanation: In a very heavy rain, a snowstorm or thick fog, you may not be able
    to properly see, even when you drive slowly. If this happens, pull off the road
    and wait until the conditions improve.
- id: 259
  category: defensive_driving
  question: Which of the following factors combine to make up the total stopping distance
    of a vehicle?
  choices:
    A: Perception time, reaction time, and braking distance
    B: Vehicle weight, tire tread, and road surface
    C: Speed limit, weather conditions, and driver alertness
    D: Braking distance and following distance
  answer: A
  explanation: Several things affect stopping distance, including perception time,
    your reaction time, and braking distance. Adding perception time and reaction
    time nearly doubles the braking distance.
- id: 260
  category: safe_driving_rules
  question: What is the maximum speed limit when passing a school during recess or
    when children are going to or from school?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The maximum speed is 15 miles per hour when passing a school during
    recess, or when children are going to or from school during the school's opening
    or closing hours.
- id: 261
  category: defensive_driving
  question: What is the minimum recommended following distance you should keep between
    your car and the vehicle in front of you under normal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 5 seconds
  answer: C
  explanation: The manual states to keep at least 4 seconds between your car and the
    vehicle in front to allow enough reaction time to avoid a collision.
- id: 262
  category: sharing_the_road
  question: Why should you increase your following distance when driving behind a
    motorcycle or bicycle?
  choices:
    A: They can stop much faster than passenger vehicles.
    B: If the cyclist should fall, you will need extra distance to avoid striking
      the rider.
    C: Motorcycles have larger blind spots than cars.
    D: They are required by law to drive slower than other traffic.
  answer: B
  explanation: You should increase your following distance behind motorcycles or bicycles
    because if the cyclist should fall, you will need extra distance to avoid striking
    the rider. The chances of a fall are greatest on wet, icy, or uneven surfaces.
- id: 263
  category: sharing_the_road
  question: What is an important factor to keep in mind when following large trucks
    or buses?
  choices:
    A: They often make wide turns, leaving an open space to their right.
    B: They accelerate very quickly when climbing hills.
    C: They have excellent rear visibility.
    D: They lose momentum when going downhill.
  answer: A
  explanation: Trucks and buses often make wide turns, leaving an open space to their
    right in the process. You should not pass such vehicles on the right if there
    is a chance they are making a right-hand turn.
- id: 264
  category: safe_driving_rules
  question: Which of the following vehicles are required to stop at all railroad crossings?
  choices:
    A: Passenger cars and pickup trucks
    B: School buses and tank trucks carrying flammable liquids
    C: Motorcycles and bicycles
    D: All vehicles pulling a trailer
  answer: B
  explanation: School buses and tank trucks carrying flammable liquids must stop at
    all railroad crossings, so you should expect the stops and slow down early.
- id: 265
  category: defensive_driving
  question: Why should you avoid driving alongside other vehicles on multi-lane streets?
  choices:
    A: It is illegal to drive parallel to another vehicle.
    B: It decreases your vehicle's fuel efficiency.
    C: You may be in their blind spot and it reduces the space you need to avoid a
      collision.
    D: It causes you to drive too slowly for the flow of traffic.
  answer: C
  explanation: Don’t drive alongside other vehicles on multi-lane streets as you may
    be in their blind spot. Driving alongside reduces the space you may need to avoid
    a collision if someone crowds your lane or tries to suddenly change lanes.
- id: 266
  category: defensive_driving
  question: What should you do if you are being followed too closely and there is
    no right lane to move into?
  choices:
    A: Speed up to increase the distance between you and the tailgater.
    B: Brake suddenly to warn the driver behind you.
    C: Wait until the way ahead is clear, then reduce speed slowly to encourage the
      tailgater to pass.
    D: Turn on your hazard lights and come to a complete stop in your lane.
  answer: C
  explanation: If you are being followed too closely and there is no right lane, wait
    until the way ahead is clear, then reduce speed slowly to encourage the tailgater
    to pass.
- id: 267
  category: defensive_driving
  question: What does the defensive driving technique of 'splitting the difference'
    mean?
  choices:
    A: Driving directly on the center line of the road.
    B: Steering a middle course between dangers on both sides of the road, such as
      oncoming cars and parked cars.
    C: Sharing a single lane with a motorcycle or bicycle.
    D: Alternating your speed between the minimum and maximum limits.
  answer: B
  explanation: Splitting the difference means that when there are dangers on both
    sides of the road (like parked cars to the right and oncoming cars to the left),
    you steer a middle course between them.
- id: 268
  category: sharing_the_road
  question: If you are facing an oncoming car to your left and a bicyclist to your
    right, how should you handle the situation?
  choices:
    A: Speed up to pass the bicyclist before the car reaches you.
    B: Drive exactly between the car and the bike at your current speed.
    C: Slow down, let the car pass, and then move to the left to allow plenty of room
      as you pass the bicyclist.
    D: Honk your horn so both the car and the bicyclist move out of your way.
  answer: C
  explanation: Instead of driving between the car and the bike, take them one at a
    time. Slow down, let the car pass, and then move to the left to allow plenty of
    room (three feet) as you pass the bicyclist.
- id: 269
  category: safe_driving_rules
  question: How large of a gap do you need to safely merge with other traffic, change
    lanes, or enter a freeway?
  choices:
    A: A 2-second gap
    B: A 3-second gap
    C: A 4-second gap
    D: A 5-second gap
  answer: C
  explanation: Anytime you merge with other traffic, you need a gap of four seconds
    to merge safely. You need a four-second gap whenever you change lanes or enter
    a freeway.
- id: 270
  category: safe_driving_rules
  question: 'To get moving from a full stop and cross traffic on a city street, you
    need a gap that is about:'
  choices:
    A: A quarter of a block
    B: A half a block
    C: A full block
    D: Two blocks
  answer: B
  explanation: To get moving from a full stop, you need a gap that is about a half
    a block on city streets.
- id: 271
  category: safe_driving_rules
  question: 'To enter a lane of existing traffic on the highway and get up to the
    speed of other cars, you need a gap that is about:'
  choices:
    A: A half a block
    B: One full block
    C: Two blocks
    D: Three blocks
  answer: C
  explanation: To enter a lane of existing traffic, you need a little more time to
    complete your turn and to get up to the speed of the other cars. You need a gap
    that is about two blocks on the highway.
- id: 272
  category: safe_driving_rules
  question: 'Even if you have a green light at an intersection, you should not start
    across if:'
  choices:
    A: There are cars blocking your way.
    B: There is a vehicle waiting behind you.
    C: You are planning to turn right.
    D: The crosswalk is empty.
  answer: A
  explanation: Even if you have the green light, don't start across if there are cars
    blocking your way. If you are caught in the intersection when the light changes,
    you will block traffic.
- id: 273
  category: defensive_driving
  question: Why should you never assume another driver will turn just because their
    turn signal is on?
  choices:
    A: Turn signals are often broken on modern vehicles.
    B: It is illegal to trust another driver's turn signals.
    C: The driver may plan to turn just beyond you, or the signal may have been left
      on from an earlier turn.
    D: Turn signals only indicate that a driver is slowing down.
  answer: C
  explanation: Don't turn just because an approaching car has a turn signal on. The
    driver may plan to turn just beyond you. Or their signal may have been left on
    from an earlier turn.
- id: 274
  category: safe_driving_rules
  question: Under Maine law, when must you turn on your headlights during the daytime?
  choices:
    A: Whenever you are driving on an interstate highway.
    B: Whenever visibility is too dim to see 1000 feet ahead or when windshield wipers
      are in constant use.
    C: Whenever you are driving in a designated school zone.
    D: Whenever you are passing another vehicle on a two-lane road.
  answer: B
  explanation: By Maine law whenever visibility is too dim for you to see 1000 feet
    ahead or at any time when windshield wipers are in constant use you must turn
    on the headlights.
- id: 275
  category: safe_driving_rules
  question: According to Maine law, during what hours are you required to have your
    headlights turned on?
  choices:
    A: From 8 PM to 6 AM
    B: From sunset to sunrise
    C: Only when it is completely dark
    D: From dusk to dawn
  answer: B
  explanation: By Maine law you must have headlights on when driving anytime from
    sunset to sunrise.
- id: 276
  category: safe_driving_rules
  question: By Maine law, when must you have your headlights turned on while driving?
  choices:
    A: From 30 minutes after sunset to 30 minutes before sunrise
    B: Anytime from sunset to sunrise
    C: Only when visibility is less than 500 feet
    D: Between 8 PM and 6 AM
  answer: B
  explanation: By Maine law you must have headlights on when driving anytime from
    sunset to sunrise.
- id: 277
  category: vehicle_information
  question: When are motorcyclists required to have their headlights on while operating
    on Maine roadways?
  choices:
    A: Only at night
    B: Only during inclement weather
    C: Always
    D: Only when driving at highway speeds
  answer: C
  explanation: Motorcyclists are always required to have their headlights on when
    operating a motorcycle on Maine roadways.
- id: 278
  category: safe_driving_rules
  question: At what distance must you dim your headlights or switch to a low beam
    when approaching an oncoming vehicle?
  choices:
    A: Within 200 feet
    B: Within 300 feet
    C: Within 400 feet
    D: Within 500 feet
  answer: D
  explanation: When a vehicle equipped with multiple beam road lights approaches an
    oncoming vehicle within 500 feet, the operator shall dim the headlights or switch
    to a low beam.
- id: 279
  category: safe_driving_rules
  question: You must dim your headlights or switch to low beams when following another
    vehicle within what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: The operator shall dim the headlights or switch to a low beam when
    following a vehicle within 300 feet.
- id: 280
  category: defensive_driving
  question: Why should you use low beams instead of high beams in fog, snow, or heavy
    rain?
  choices:
    A: High beams will drain the vehicle's battery faster in cold weather.
    B: Light from high beams will reflect back from precipitation and cause a glare.
    C: Low beams are required by law in all precipitation.
    D: High beams will blind drivers behind you in the rearview mirror.
  answer: B
  explanation: Use low beams in fog, snow, or heavy rain as light from your own high
    beams will reflect back on you from such precipitation and cause a glare that
    will affect your vision.
- id: 281
  category: defensive_driving
  question: What should you do if an oncoming vehicle fails to dim their high beams?
  choices:
    A: Flash your high beams rapidly to warn them.
    B: Keep your bright lights on to get back at the driver.
    C: Slow down and look toward the right side of the road.
    D: Pull over to the shoulder immediately and stop.
  answer: C
  explanation: If a vehicle comes toward you with high beams on, and fails to dim
    the lights, slow down and look toward the right side of the road. This will keep
    you from being blinded by the other car's headlights.
- id: 282
  category: sharing_the_road
  question: Why should you try to avoid using your horn when near bicyclists or horses?
  choices:
    A: It is illegal to honk at non-motorized traffic.
    B: The riders or horse may become startled, lose control, and veer into the roadway.
    C: Bicycles and horses always have the right-of-way.
    D: The horn sound is amplified by the rider's helmet.
  answer: B
  explanation: Try to avoid using the horn when near bicyclists or horses because
    the riders or horse may become startled, lose control, and veer out into the roadway.
- id: 283
  category: safe_driving_rules
  question: How early should you signal before making a change of direction or turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: Signal as early as you can-at least 100 feet before any change or turn.
- id: 284
  category: defensive_driving
  question: If you plan to turn into a driveway just beyond an intersection, when
    should you turn on your signal?
  choices:
    A: 100 feet before the intersection.
    B: As soon as you see the driveway.
    C: While you are in the middle of the intersection.
    D: After passing the intersection.
  answer: D
  explanation: If you plan to turn beyond an intersection, signal after that intersection.
    If you signal before the intersection, another driver might get the wrong idea
    at that intersection and pull into your path.
- id: 285
  category: safe_driving_rules
  question: If your car breaks down and you have emergency flares, how far behind
    the car should you place them?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: If you have emergency flares place them at least 100 feet behind the
    car. This allows other drivers to change lanes if they need to.
- id: 286
  category: defensive_driving
  question: What is the best practice when passing another vehicle to avoid lingering
    in their blind spot?
  choices:
    A: Honk your horn continuously while passing.
    B: Match their speed while in the blind spot.
    C: Get through the other driver's blind spot as quickly as you can.
    D: Flash your high beams before entering the blind spot.
  answer: C
  explanation: When passing another vehicle, get through the other driver's blind
    spot as quickly as you can.
- id: 287
  category: vehicle_information
  question: What is the correct way to use Anti-lock Braking Systems (ABS) in an emergency
    stop?
  choices:
    A: Pump the brake pedal rapidly.
    B: Press on the brake pedal as hard as you can and keep applying pressure.
    C: Press the brake lightly to avoid locking the wheels.
    D: Apply the parking brake while steering.
  answer: B
  explanation: 'Rules for using ABS are: Press on the brake pedal as hard as you can
    and keep applying pressure.'
- id: 288
  category: defensive_driving
  question: If you are steering around a hazard to avoid a collision, why should you
    try to stay off the brakes while turning?
  choices:
    A: Braking will cause the steering wheel to lock.
    B: It lessens the chance of a skid, particularly on a soft shoulder.
    C: It allows the ABS to reset.
    D: Braking increases your vehicle's turning radius.
  answer: B
  explanation: If you can, stay off the brakes while turning. This lessens the chance
    of a skid, particularly if you are turning onto a soft shoulder.
- id: 289
  category: safe_driving_rules
  question: When should you tap your brake pedal to let others know you are slowing
    down?
  choices:
    A: When driving through a green light.
    B: When turning off a road that does not have a separate turn or exit lane.
    C: When accelerating onto a freeway.
    D: When passing a bicyclist.
  answer: B
  explanation: 'Tap your brake pedal when: Turning off a road that does not have a
    separate turn or exit lane, or parking or turning before an intersection.'
- id: 290
  category: vehicle_information
  question: When applying hard pressure to an Anti-lock Braking System (ABS), what
    should you expect to happen?
  choices:
    A: The pedal may vibrate and make a clicking noise.
    B: The steering wheel will lock in place.
    C: The vehicle will automatically accelerate.
    D: The brake pedal will drop completely to the floor.
  answer: A
  explanation: ABS only work if you keep pressure on the brake pedal. The pedal may
    vibrate, and you may hear a clicking noise. This is normal.
- id: 291
  category: safe_driving_rules
  question: What are the correct clock positions for your hands on the steering wheel
    to ensure you can turn quickly?
  choices:
    A: 10 and 2 or 9 and 3
    B: 9 and 3 or 8 and 4
    C: 11 and 1 or 7 and 5
    D: 8 and 4 or 10 and 2
  answer: B
  explanation: According to the manual, your hands must be on opposite sides of the
    steering wheel, at the 9 and 3 or 8 and 4 clock positions.
- id: 292
  category: safe_driving_rules
  question: Which of the following printed materials is a driver legally allowed to
    read while operating a motor vehicle?
  choices:
    A: A newspaper or magazine
    B: A text message printed on paper
    C: A map or written directions to a specific location
    D: A book
  answer: C
  explanation: It is illegal for an operator to read printed material while driving,
    but printed material does not include a map or written directions to a specific
    location.
- id: 293
  category: defensive_driving
  question: What should you do to protect yourself if you are about to be hit from
    the rear?
  choices:
    A: Throw yourself across the passenger seat.
    B: Release the brake and steer sharply to the right.
    C: Be ready to apply your brake so you won't be pushed into another car.
    D: Shift into neutral and turn off the engine.
  answer: C
  explanation: If you are about to be hit from the rear, you should be ready to apply
    your brake so that you won't be pushed into another car, brace yourself, and press
    your head against the head restraint.
- id: 294
  category: defensive_driving
  question: If you are about to be hit from the front and you are NOT wearing a shoulder
    strap, what should you do?
  choices:
    A: Use your arms and hands to protect your face.
    B: Throw yourself across the seat so you don't hit the steering column or windshield.
    C: Brace yourself between the steering wheel and the seat back.
    D: Press the back of your head firmly against the head restraint.
  answer: B
  explanation: If you are about to be hit from the front and are not using a shoulder
    strap, the manual advises to throw yourself across the seat so that you don't
    hit the steering column or the windshield.
- id: 295
  category: driver_responsibility
  question: You must report an accident to the police or local sheriff if it involves
    any injuries or property damage of at least what amount?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: If the accident involves any injuries, or property damage of $1,000
    or more, the drivers must report it to the police or local sheriff.
- id: 296
  category: driver_responsibility
  question: If you damage a parked car and cannot find the owner, what information
    must you leave in a note?
  choices:
    A: Your name, address, driver's license number, license plate number, date/time,
      and a description of damage.
    B: Only your phone number and insurance company name.
    C: Your name, phone number, and the make/model of your vehicle.
    D: Your insurance policy number and a description of the accident.
  answer: A
  explanation: If the owner can't be found, leave a note containing your name and
    address, driver's license number, license plate number, date and time of accident,
    and a description of property damage.
- id: 297
  category: driver_responsibility
  question: What must you do if you are involved in a non-reportable accident that
    injures or kills a dog, cat, or livestock?
  choices:
    A: Move the animal to the side of the road and continue driving.
    B: Take reasonable steps to notify the owner, local law enforcement, or animal
      control.
    C: Transport the animal to the nearest veterinary clinic immediately.
    D: Report the accident to the Department of Motor Vehicles within 24 hours.
  answer: B
  explanation: Operators involved in non-reportable accidents involving injury or
    death of a dog, a cat or livestock must “take reasonable steps” to notify the
    owner, or if the owner cannot be located, local law enforcement or animal control.
- id: 298
  category: safe_driving_rules
  question: If you come upon an accident and there are downed wires touching a vehicle,
    what should you do?
  choices:
    A: Use a wooden stick to move the wires off the vehicle.
    B: Carefully pull the occupants out of the vehicle.
    C: Warn the occupants to stay inside until emergency crews arrive.
    D: Turn off the vehicle's ignition from the outside.
  answer: C
  explanation: If downed wires are touching the vehicle or lying near it, don't go
    near them. Warn occupants to stay inside until help arrives.
- id: 299
  category: safe_driving_rules
  question: How should you treat a burn victim at an accident scene if emergency help
    is not immediately available?
  choices:
    A: Apply ointment or grease to the burn.
    B: Apply cold water to the burn and cover it with a clean cloth.
    C: Give the victim plenty of water to drink.
    D: Wrap the burn tightly with a heavy blanket.
  answer: B
  explanation: Do not put ointment or grease on burns. You may apply cold water to
    burns and cover them with a clean cloth.
- id: 300
  category: vehicle_information
  question: What is the first thing you should do if your vehicle begins to skid?
  choices:
    A: Slam on the brakes to stop quickly.
    B: Steer in the opposite direction of the skid.
    C: Release pressure from the brake or accelerator to regain steering.
    D: Shift into a lower gear and accelerate.
  answer: C
  explanation: If your vehicle begins to skid, release pressure from the brake or
    accelerator to regain steering, and look where you want to go.
- id: 301
  category: defensive_driving
  question: 'If your right wheels unexpectedly run off the paved road onto the shoulder,
    you should:'
  choices:
    A: Hit the brake pedal suddenly and hard.
    B: Jerk the steering wheel quickly to the left.
    C: Accelerate to get back onto the pavement quickly.
    D: Grip the steering wheel firmly, ease up on the gas, and step on the brakes
      gently.
  answer: D
  explanation: If your wheels drop off, don't panic. Grip the steering wheel firmly,
    ease up on the gas pedal, and don't hit the brake pedal suddenly and hard; step
    on the brakes gently.
- id: 302
  category: vehicle_information
  question: If your brakes stop working while driving, what is the first step you
    should take?
  choices:
    A: Shift into neutral and turn off the engine.
    B: Pump the brake pedal rapidly and hard several times.
    C: Apply the parking brake as fast and hard as possible.
    D: Steer into the nearest soft shoulder or ditch.
  answer: B
  explanation: If your brakes stop working, the first step is to pump the brake pedal
    rapidly and hard several times. If that doesn't work, then use the parking brake
    slowly.
- id: 303
  category: vehicle_information
  question: How can you "dry" your brakes after driving through deep water?
  choices:
    A: By driving at highway speeds for at least two miles.
    B: By pumping the brakes rapidly while in neutral.
    C: By driving slowly and putting your brakes on lightly for a short distance.
    D: By parking the car and letting the engine idle for 10 minutes.
  answer: C
  explanation: You can "dry" the brakes by driving slowly and putting your brakes
    on lightly for a short distance.
- id: 304
  category: vehicle_information
  question: What should you do if you experience a tire blowout while driving?
  choices:
    A: Slam on the brakes immediately and steer to the shoulder.
    B: Grip the steering wheel firmly, steer straight, and slow gradually by taking
      your foot off the gas.
    C: Accelerate slightly to maintain control of the vehicle's steering.
    D: Turn the steering wheel sharply in the direction of the blown tire.
  answer: B
  explanation: If a tire goes flat, don't panic or slam on the brakes. Grip the steering
    wheel firmly and steer straight, slow gradually, and take your foot off the gas
    pedal.
- id: 305
  category: vehicle_information
  question: If your gas pedal gets stuck and your vehicle is speeding out of control,
    what gear should you shift into?
  choices:
    A: First gear
    B: Reverse
    C: Park
    D: Neutral
  answer: D
  explanation: If your vehicle is speeding out of control due to a stuck gas pedal,
    you should keep your eyes on the road and shift to neutral.
- id: 306
  category: vehicle_information
  question: What is the correct procedure to start a flooded engine?
  choices:
    A: Pump the gas pedal rapidly while turning the key.
    B: Press the gas pedal to the floor and hold it there while turning the key.
    C: Turn the key without touching the gas pedal.
    D: Shift to neutral and pump the brakes.
  answer: B
  explanation: To start a flooded engine, press the gas pedal to the floor and hold
    it there. Do not pump the gas pedal. Turn the key and let off on the pedal when
    the engine starts.
- id: 307
  category: defensive_driving
  question: If your car stalls on railroad tracks and a train is coming, in which
    direction should you run after leaving your vehicle?
  choices:
    A: Away from the train in the same direction it is traveling.
    B: Directly away from the tracks at a 90-degree angle.
    C: Toward the oncoming train and away from the tracks at a 45-degree angle.
    D: Parallel to the tracks toward the nearest crossing.
  answer: C
  explanation: To avoid debris from any crash, leave your vehicle and head quickly
    toward the oncoming train and away from the tracks at a 45-degree angle.
- id: 308
  category: defensive_driving
  question: If there is an oncoming car in your lane, what is one thing you should
    NEVER do?
  choices:
    A: Blow your horn and flash your lights.
    B: Brake quickly without locking your wheels.
    C: Pull off into the right shoulder or ditch.
    D: Drive into the left lane to avoid them.
  answer: D
  explanation: If there is an oncoming car in your lane, quickly pull off into the
    right shoulder or ditch. Do not drive into the left lane.
- id: 309
  category: vehicle_information
  question: When jump-starting a vehicle with a dead battery, where should the final
    clamp be attached?
  choices:
    A: To the positive terminal of the dead battery.
    B: To the negative terminal of the dead battery.
    C: To the engine block of the stalled engine.
    D: To the negative terminal of the good battery.
  answer: C
  explanation: When jump-starting a car, attach the last clamp to the engine block
    of the stalled engine.
- id: 310
  category: defensive_driving
  question: If your vehicle plunges into water, what is the best escape route?
  choices:
    A: Through a door, by pushing it open immediately.
    B: Through a window, opening it as soon as possible.
    C: Through the trunk of the vehicle.
    D: By waiting until the car fills with water to open the door.
  answer: B
  explanation: The best escape route is through a window, because water pressure makes
    it hard to open a door. Power windows should be opened ASAP before the water causes
    a short circuit.
- id: 311
  category: sharing_the_road
  question: What must you do when a pedestrian is crossing a street with a guide dog
    or carrying a white cane?
  choices:
    A: Honk your horn to let them know you are there.
    B: Slow down and proceed with caution.
    C: Come to a complete stop.
    D: Steer around them carefully.
  answer: C
  explanation: Always yield to the vision impaired. When a pedestrian is crossing
    a street with a guide dog or carrying a white cane, you must come to a complete
    stop.
- id: 312
  category: sharing_the_road
  question: What is the rule regarding passing a vehicle that is stopped to yield
    to a pedestrian in a crosswalk?
  choices:
    A: You may pass if the left lane is clear.
    B: You must not overtake or pass the stopped vehicle.
    C: You may pass if you honk your horn first.
    D: You may pass at a speed of 15 mph or less.
  answer: B
  explanation: You must not overtake or pass other vehicles stopped or slowing to
    yield to pedestrians in a crosswalk.
- id: 313
  category: sharing_the_road
  question: How are bicycles classified on Maine roadways?
  choices:
    A: As pedestrians.
    B: As motorized scooters.
    C: As vehicles with the same rights and responsibilities as drivers.
    D: As recreational equipment restricted to sidewalks.
  answer: C
  explanation: Bicycles are considered vehicles. Bicyclists must follow the same rules
    of the road as other vehicles and have the same rights and responsibilities as
    vehicle drivers.
- id: 314
  category: sharing_the_road
  question: Why should you avoid using your horn close to a bicyclist unless there
    is a chance of a crash?
  choices:
    A: It is illegal to use a horn in residential areas.
    B: The horn could startle them and cause them to steer into your path.
    C: Bicyclists cannot hear horns over the wind.
    D: It will cause the bicyclist to stop suddenly.
  answer: B
  explanation: Do not use your horn close to bicycles unless there is a chance of
    a crash. Your horn could startle them and cause them to steer into your path.
- id: 315
  category: sharing_the_road
  question: What should a bicyclist do when a road is too narrow for cars and bikes
    to ride safely side by side?
  choices:
    A: Ride on the sidewalk.
    B: Pull over and stop to let cars pass.
    C: Ride in or near the center of the lane to 'take the travel lane'.
    D: Ride as close to the ditch as possible.
  answer: C
  explanation: When a road is too narrow for cars and bikes to ride safely side by
    side, bicycles should 'take the travel lane,' which means riding in or near the
    center of the lane.
- id: 316
  category: sharing_the_road
  question: When crossing a sidewalk in your vehicle, who has the right-of-way?
  choices:
    A: The motor vehicle.
    B: All pedestrians or bicyclists on the sidewalk.
    C: Whichever vehicle or person arrives first.
    D: Pedestrians only, but not bicyclists.
  answer: B
  explanation: When crossing a sidewalk, you must yield to all pedestrians or bicyclists
    on the sidewalk.
- id: 317
  category: sharing_the_road
  question: Which of the following is true regarding the speed of experienced bicyclists?
  choices:
    A: They are restricted to a maximum speed of 15 mph.
    B: They can easily travel over 30 mph.
    C: They must always ride slower than motor vehicle traffic.
    D: They cannot exceed 20 mph on public roads.
  answer: B
  explanation: Bicyclists may be moving faster than you realize (experienced bicyclists
    can easily travel over 30 mph).
- id: 318
  category: sharing_the_road
  question: What is the 'Dutch Reach' method recommended for drivers?
  choices:
    A: A method for securing loads on a bicycle rack.
    B: Opening the vehicle door with the right hand to force the driver to look over
      their shoulder for bicyclists.
    C: A hand signal used by bicyclists when they cannot take both hands off the handlebars.
    D: A technique for motorcycles to safely cross railroad tracks.
  answer: B
  explanation: Using the Dutch reach method, the driver will open their door using
    the right hand. This causes the body to twist left, forcing the driver to look
    over their road-side shoulder making it easier to see oncoming bicyclists.
- id: 319
  category: sharing_the_road
  question: Which of the following is true regarding bicyclists and traffic laws in
    Maine?
  choices:
    A: Bicyclists must have a license to ride on roadways.
    B: Bicyclists are exempt from stopping at red lights.
    C: Bicyclists do not need a license but are subject to fines for breaking traffic
      laws.
    D: Bicyclists are not considered vehicles and do not have the same responsibilities
      as drivers.
  answer: C
  explanation: Although a license isn't required to drive a bicycle on Maine's roadways,
    bicycle drivers must obey all the rules of the road. If you break any traffic
    laws... you are subject to fines.
- id: 320
  category: safe_driving_rules
  question: Under what conditions should a bicycle helmet be replaced?
  choices:
    A: Only after it has sustained a severe impact in a crash.
    B: Every two years, regardless of its condition.
    C: If it has sustained any impact, is five years old or older, or is left in a
      hot car.
    D: When the bicyclist turns 16 years of age.
  answer: C
  explanation: Once a helmet has sustained any impact it should be replaced. Helmets
    should also be replaced if they are five years old or older or are left in a hot
    car.
- id: 321
  category: sharing_the_road
  question: Who is legally required to wear a helmet while riding a bicycle on public
    ways in Maine?
  choices:
    A: All persons under 16 years of age.
    B: Only inexperienced riders.
    C: All bicyclists, regardless of age.
    D: Only passengers riding on bicycles.
  answer: A
  explanation: All persons under 16 years of age riding on bicycles are required to
    wear helmets and sit on passenger seats when traversing public ways.
- id: 322
  category: sharing_the_road
  question: How should a bicyclist navigate an intersection with a right turning lane
    if they intend to travel straight?
  choices:
    A: Enter the right turn lane and proceed straight through the intersection.
    B: Move onto the sidewalk to bypass the intersection.
    C: Do not enter the right turn lane; ride with the through traffic.
    D: Weave between the parked cars to the left of the turn lane.
  answer: C
  explanation: If you approach an intersection with a right turning lane and intend
    to continue straight, do not enter the right turn lane. Ride with the through
    traffic.
- id: 323
  category: vehicle_information
  question: What lighting equipment is required for a bicycle operated at night?
  choices:
    A: A front white light visible for at least 500 feet and a rear red reflector.
    B: A front white light visible for at least 200 feet and a rear red or amber light
      or reflector visible for at least 200 feet.
    C: A flashing amber light on both the front and the rear.
    D: Only reflective material on the pedals and ankles.
  answer: B
  explanation: A bicycle must have a front light that emits a white light visible
    from a distance of at least 200 feet to the front. Also, a red or amber light
    or reflector to the rear that is visible at least 200 feet to the rear.
- id: 324
  category: defensive_driving
  question: Why should you not assume a motorcycle is turning just because its turn
    signal is flashing?
  choices:
    A: Motorcycles use flashing signals to indicate they are slowing down.
    B: Motorcycle turn signals may not self-cancel, and the rider may have forgotten
      the signal is on.
    C: Flashing signals on a motorcycle indicate the rider is claiming the right-of-way.
    D: Motorcycles are legally required to ride with their turn signals flashing at
      all times.
  answer: B
  explanation: Do not believe a motorcycle is turning when it has a turn signal flashing.
    Turn signals on a motorcycle may not self-cancel so the rider may have forgotten
    the signal is on.
- id: 325
  category: safe_driving_rules
  question: What is the minimum recommended following distance when driving behind
    a motorcycle?
  choices:
    A: At least 2 seconds
    B: At least 3 seconds
    C: At least 4 seconds
    D: At least 6 seconds
  answer: C
  explanation: When following a motorcycle, stay at least 4 seconds back. When it
    is wet, increase the following distance.
- id: 326
  category: sharing_the_road
  question: Although motorcycles make up only 4% of vehicles on the road, they are
    involved in what percentage of all motor vehicle deaths?
  choices:
    A: Nearly 5%
    B: Nearly 10%
    C: Nearly 15%
    D: Nearly 25%
  answer: B
  explanation: Motorcycles give their riders no protection. Therefore, they are involved
    in nearly 10% of all motor vehicle deaths, although they make up only 4% of the
    vehicles on the road.
- id: 327
  category: defensive_driving
  question: What is a common cause of accidents between cars and motorcycles?
  choices:
    A: Motorcycles rear-ending large trucks.
    B: Drivers turning left in front of an oncoming motorcycle.
    C: Cars passing motorcycles on the right side.
    D: Motorcycles failing to stop at red lights.
  answer: B
  explanation: In many motorcycle accidents, drivers of other vehicles are at fault.
    Drivers turning left in front of an oncoming motorcycle cause many of the accidents.
- id: 328
  category: sharing_the_road
  question: How can you tell if you are driving in a large vehicle's blind spot?
  choices:
    A: If you are within 50 feet of the rear of the truck.
    B: If the truck's turn signals are flashing.
    C: If you cannot see the mirrors of the large vehicle ahead of you.
    D: If the truck is traveling uphill.
  answer: C
  explanation: If you cannot see the mirrors of the large vehicle ahead of you, the
    driver probably can't see you so stay out of the blind spots.
- id: 329
  category: vehicle_information
  question: How does the weight of a large vehicle affect its speed on hills?
  choices:
    A: It maintains a constant speed regardless of the terrain.
    B: Its speed drops sharply going uphill and gains quickly going downhill.
    C: Its speed increases going uphill and decreases going downhill.
    D: It requires less space to stop when traveling downhill.
  answer: B
  explanation: The speed of a large vehicle might drop sharply when the vehicle is
    going uphill; this same vehicle might often gain speed quickly when starting downhill.
- id: 330
  category: safe_driving_rules
  question: What should you never do when a large truck or bus is backing up?
  choices:
    A: Attempt to pass behind the vehicle.
    B: Honk your horn to alert them of your presence.
    C: Flash your headlights.
    D: Pull over to the right side of the road.
  answer: A
  explanation: Never attempt to pass behind a truck or bus that is backing.
- id: 331
  category: safe_driving_rules
  question: How should a bicyclist cross railroad tracks to avoid hazards?
  choices:
    A: At a 45-degree angle.
    B: By weaving between the tracks.
    C: At right angles.
    D: By dismounting and carrying the bicycle.
  answer: C
  explanation: Always scan the road 50 to 100 feet ahead for road hazards like...
    railroad tracks (cross them at right angles).
- id: 332
  category: defensive_driving
  question: How much room should a bicyclist give themselves between their bicycle
    and parked vehicles to avoid opening car doors?
  choices:
    A: One or two feet
    B: Three or four feet
    C: Five or six feet
    D: At least ten feet
  answer: B
  explanation: Avoid opening car doors. Give yourself three or four feet of room between
    yourself and parked vehicles.
- id: 333
  category: sharing_the_road
  question: Why do large vehicles sometimes swing to the left before making a right
    turn?
  choices:
    A: To gain more speed before entering the turn.
    B: To clear the sidewalk or objects like telephone poles on the side of the road.
    C: To allow smaller vehicles to pass them on the right.
    D: To check their right-side blind spot before turning.
  answer: B
  explanation: Many times, large vehicles will be forced to swing to the left before
    turning to the right. This is necessary to clear the sidewalk or any objects,
    such as a telephone pole, that may be on the side of the road.
- id: 334
  category: vehicle_information
  question: What is the minimum stopping distance for a loaded truck traveling at
    55 mph?
  choices:
    A: 150 feet
    B: 200 feet
    C: 335 feet
    D: 500 feet
  answer: C
  explanation: Because they are so big and heavy, larger vehicles take longer to stop
    than cars. A loaded truck at 55 mph takes at least 335 feet to stop.
- id: 335
  category: defensive_driving
  question: What is the dangerous practice known as 'drafting'?
  choices:
    A: Passing a large vehicle on the right side.
    B: Following closely behind a truck thinking the wind drag will pull your car
      along.
    C: Moving to the far right of your lane to avoid wind blast from an oncoming truck.
    D: Flashing your headlights to signal a large vehicle that you intend to pass.
  answer: B
  explanation: Some drivers 'draft' off a large vehicle. This is the practice of following
    so closely behind a truck thinking the wind drag created by the truck will pull
    your car along. Do not do this; it is extremely dangerous.
- id: 336
  category: safe_driving_rules
  question: How far behind a large vehicle can its rear blind spot extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 200 feet
    D: Up to 335 feet
  answer: C
  explanation: Large vehicles have huge blind spots-up to 200 feet behind them. If
    you are too close, the driver cannot see your car.
- id: 337
  category: defensive_driving
  question: When passing a large vehicle, when is it safe to pull back into the lane
    in front of it?
  choices:
    A: When you are exactly one car length ahead of the truck.
    B: As soon as your vehicle clears the truck's front bumper.
    C: When you can see the whole front of the vehicle in your rearview mirror.
    D: When the truck driver flashes their headlights to signal you.
  answer: C
  explanation: When passing, make sure you can see the whole front of the vehicle
    in your rear-view mirror before pulling back into the lane the larger vehicle
    occupies.
- id: 338
  category: safe_driving_rules
  question: Why must you always stop behind the stop lines at intersections?
  choices:
    A: To give larger vehicles more turning space.
    B: To avoid blocking the pedestrian crosswalk.
    C: To trigger the magnetic traffic light sensors.
    D: To allow emergency vehicles to pass safely.
  answer: A
  explanation: Stop lines at intersections are designed to give larger vehicles more
    turning space. Always stop behind the stop lines.
- id: 339
  category: defensive_driving
  question: What should you do with your headlights when following a large vehicle
    at night?
  choices:
    A: Turn on your high beams to increase your visibility.
    B: Dim your headlights so they do not reflect off the large vehicle's mirrors.
    C: Turn them off temporarily if the truck comes to a complete stop.
    D: Flash them repeatedly to let the truck driver know you are in their blind spot.
  answer: B
  explanation: Always dim your headlights when following a large vehicle at night.
    Bright lights will reflect off the mirrors of the large vehicle and make it difficult
    for the driver to see the road ahead.
- id: 340
  category: defensive_driving
  question: What is the recommended action when a large vehicle is passing you?
  choices:
    A: Speed up to get out of the larger vehicle's way.
    B: Maintain your speed or slow down slightly to allow the vehicle to pass.
    C: Move into the left lane to give the vehicle more room.
    D: Flash your high beams to alert the driver.
  answer: B
  explanation: Do not speed up when a large vehicle passes you. Maintain your speed
    or slow down slightly to allow the larger vehicle to pass.
- id: 341
  category: safe_driving_rules
  question: What is the minimum legal following distance for a fire truck responding
    to a fire alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 335 feet
    D: 500 feet
  answer: D
  explanation: It is unlawful to follow within 500 feet of any fire truck responding
    to a fire alarm.
- id: 342
  category: safe_driving_rules
  question: What should you do if you are in an intersection when an emergency vehicle
    approaches with its lights and sirens on?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Pull over to the right side while still inside the intersection.
    C: Get out of the intersection before you pull over to the side of the road.
    D: Speed up and turn down the nearest side street.
  answer: C
  explanation: If you are at an intersection, get out of it before you pull over.
    Avoid blocking intersections.
- id: 343
  category: driver_responsibility
  question: If you are pulled over by the police at night, what should you do regarding
    your vehicle's interior lights?
  choices:
    A: Turn them off to reduce glare for the approaching officer.
    B: Turn them on so the officer can see inside the vehicle.
    C: Flash them twice to acknowledge the officer's presence.
    D: Leave them exactly as they were before the traffic stop.
  answer: B
  explanation: If you are pulled over by the police at night, turn on your inside
    lights so the officer can see inside the vehicle.
- id: 344
  category: safe_driving_rules
  question: According to Move-Over Laws, what must you do when encountering an emergency
    vehicle stopped on the roadside?
  choices:
    A: Stop immediately in your lane and wait for the vehicle to leave.
    B: Maintain your current speed and stay in your lane.
    C: Slow down, yield the right-of-way, and move over to the next lane if possible.
    D: Honk your horn to alert the emergency workers of your presence.
  answer: C
  explanation: When you encounter an emergency vehicle that is stopped on the roadside
    you must slow and yield the right-of-way. If possible, move over to the next lane.
- id: 345
  category: sharing_the_road
  question: What should you avoid doing when sharing the road with animal-drawn vehicles
    or horseback riders?
  choices:
    A: Passing them on the left side.
    B: Yielding the right-of-way to them.
    C: Using your horn or revving your engine near them.
    D: Slowing down as you approach them.
  answer: C
  explanation: Animals driven, ridden, or led along the side of a roadway are easily
    frightened by passing vehicles. Do not use your horn or “rev” the engine when
    near an animal.
- id: 346
  category: sharing_the_road
  question: What should you avoid doing when driving near an animal on or near the
    roadway?
  choices:
    A: Slowing down and proceeding cautiously
    B: Passing the animal with care
    C: Using your horn or revving the engine
    D: Watching for left turns into fields
  answer: C
  explanation: You should not use your horn or 'rev' the engine when near an animal,
    as this may scare them and cause a crash.
- id: 347
  category: safe_driving_rules
  question: How much farther can you see when using your high beam headlights compared
    to low beams?
  choices:
    A: One and a half times as far
    B: Twice as far
    C: Three times as far
    D: Four times as far
  answer: B
  explanation: According to the manual, high beams let you see twice as far as low
    beams.
- id: 348
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog, rain, or snow?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: In fog, rain, or snow, you should use your low beams to avoid glare.
- id: 349
  category: defensive_driving
  question: When driving at night on unfamiliar roads, how much should you add to
    your following distance?
  choices:
    A: At least one second
    B: At least two seconds
    C: At least three seconds
    D: At least four seconds
  answer: B
  explanation: The manual states to increase your following distance by at least a
    second at night, and add at least two seconds for night driving on unfamiliar
    roads.
- id: 350
  category: signs_and_signals
  question: What do construction warning signs typically look like?
  choices:
    A: White symbols on a green background
    B: Black symbols or lettering on an orange background
    C: Red lettering on a white background
    D: Yellow symbols on a black background
  answer: B
  explanation: Construction warning signs are black symbols or lettering on an orange
    background and are often diamond shaped.
- id: 351
  category: safe_driving_rules
  question: 'When driving near channeling devices like barricades and cones in a work
    zone, you should:'
  choices:
    A: Change lanes frequently to avoid them
    B: Drive as close to them as possible
    C: Keep your vehicle in the middle of the lane and maintain a responsible speed
    D: Speed up to exit the work zone quickly
  answer: C
  explanation: When driving near channeling devices, keep your vehicle in the middle
    of the lane and maintain a responsible speed. Do not change lanes until you are
    completely clear of the work zone.
- id: 352
  category: safe_driving_rules
  question: Who has the right-of-way when approaching a single lane bridge on a rural
    road?
  choices:
    A: The larger vehicle
    B: The vehicle traveling uphill
    C: The first driver to the bridge
    D: The vehicle traveling at a faster speed
  answer: C
  explanation: When crossing a single lane bridge, the first driver to the bridge
    has the right-of-way.
- id: 353
  category: defensive_driving
  question: 'When driving over open bridge gratings or steel bridges, you should:'
  choices:
    A: Increase your speed to cross quickly
    B: Reduce your speed and keep a firm grip on the steering wheel
    C: Decrease your following distance
    D: Brake hard while crossing
  answer: B
  explanation: On open bridge gratings or steel bridges, you should reduce your speed,
    increase your following distance, and keep a firm grip on the steering wheel.
- id: 354
  category: vehicle_information
  question: According to the manual, how long is usually enough time to allow your
    engine to idle and warm up in winter?
  choices:
    A: Thirty seconds
    B: Two minutes
    C: Five minutes
    D: Ten minutes
  answer: A
  explanation: Thirty seconds is usually enough time to allow your engine to idle.
    A cold engine will warm up faster when being driven than when left to idle for
    long periods.
- id: 355
  category: defensive_driving
  question: How should you steer when trying to recover from a skid?
  choices:
    A: Turn the steering wheel in the opposite direction you want the car to go
    B: Keep the steering wheel perfectly straight
    C: Turn the steering wheel in the direction you want the car to go
    D: Rapidly turn the wheel back and forth
  answer: C
  explanation: To steer out of a skid, turn the steering wheel in the direction you
    want the car to go, as this will line the front of the car up with the back.
- id: 356
  category: safe_driving_rules
  question: On snow or ice, how much more distance does it take to stop your car compared
    to dry pavement?
  choices:
    A: Two to three times as much distance
    B: Three to twelve times as much distance
    C: Five to ten times as much distance
    D: Ten to fifteen times as much distance
  answer: B
  explanation: Remember that on snow or ice it takes three to twelve times as much
    distance to stop your car as it does on dry pavement.
- id: 357
  category: vehicle_information
  question: How should you stop on icy or snow-covered roads if your vehicle does
    NOT have anti-lock brakes?
  choices:
    A: Press firmly on the brake pedal and hold it down
    B: Pump the brakes on and off very gently
    C: Shift into park while moving
    D: Pull the emergency brake immediately
  answer: B
  explanation: 'When stopping on icy or snow-covered roads, pump brakes on and off
    very gently. (Note: If you have anti-lock brakes, you should press firmly instead).'
- id: 358
  category: defensive_driving
  question: Why should you always slow down in a work zone even if no workers are
    visible?
  choices:
    A: Because narrow lanes and rough pavement can be a hazard
    B: Because the speed limit is always 15 mph in work zones
    C: Because you are required to stop at all work zone signs
    D: Because construction vehicles always have the right-of-way
  answer: A
  explanation: You should always slow down even if no workers are visible because
    narrow lanes and rough pavement can be a hazard in work zones.
- id: 359
  category: defensive_driving
  question: If your vehicle gets stuck in the snow, what is the recommended way to
    get out?
  choices:
    A: Spin your wheels rapidly to melt the snow
    B: Keep your wheels as straight as possible and rock the vehicle back and forth
    C: Turn the steering wheel sharply from side to side while accelerating
    D: Abandon the vehicle immediately and walk for help
  answer: B
  explanation: The manual advises that if you get stuck, you should not spin your
    wheels. Keep them as straight as possible, shovel snow out, use traction aids,
    and rock the vehicle by going back and forth from reverse to drive.
- id: 360
  category: safe_driving_rules
  question: If you are stranded in your car during a winter storm waiting for help,
    what is one critical thing you must NOT do?
  choices:
    A: Run the engine and heater until warm
    B: Wrap yourself in blankets
    C: Let anyone go to sleep
    D: Put a red flag on your antenna
  answer: C
  explanation: 'When waiting for help in a stranded vehicle during winter, the manual
    explicitly states: "Keep yourself and your passengers as active as possible. DO
    NOT LET ANYONE GO TO SLEEP."'
- id: 361
  category: safe_driving_rules
  question: 'When driving in fog, you should turn your headlights on to:'
  choices:
    A: High beam
    B: Low beam
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: The manual states to turn your headlights on and "Put them on low beam
    to prevent the glaring reflection of your own lights in the fog."
- id: 362
  category: defensive_driving
  question: When do wet roads tend to be the most dangerous?
  choices:
    A: After several hours of heavy rain
    B: At the start of a light rain
    C: When driving through deep puddles
    D: When the rain has completely stopped
  answer: B
  explanation: Roads are more dangerous at the start of a light rain when road oil
    and water mix to form a greasy film on the road.
- id: 363
  category: defensive_driving
  question: At what speed can hydroplaning begin in most cars?
  choices:
    A: 15 to 25 MPH
    B: 30 to 40 MPH
    C: 50 to 60 MPH
    D: 65 to 75 MPH
  answer: B
  explanation: In most cars, hydroplaning may begin at speeds as low as 30 to 40 MPH,
    and tires may lose all contact with the road at 50 to 60 MPH.
- id: 364
  category: safe_driving_rules
  question: How much water on a flooded roadway does it take to float some small cars?
  choices:
    A: Two inches
    B: Six inches
    C: One foot
    D: Two feet
  answer: B
  explanation: The manual warns to never attempt to drive across a flooded roadway,
    noting that "As little as six inches of water can float some small cars."
- id: 365
  category: driver_responsibility
  question: 'The fatal accident rate for night driving is:'
  choices:
    A: About the same as daytime driving
    B: Nearly twice as great as daytime driving
    C: Nearly three times greater than daytime driving
    D: Lower than daytime driving due to less traffic
  answer: C
  explanation: The fatal accident rate for night driving is nearly three times greater
    than for daytime driving, even though there are fewer miles driven at night.
- id: 366
  category: defensive_driving
  question: Which two months are the peak months for moose collisions in Maine?
  choices:
    A: September and October
    B: November and December
    C: March and April
    D: May and June
  answer: D
  explanation: According to the manual, collisions with moose increase dramatically
    in the months of May and June, making them the peak moose collision months.
- id: 367
  category: defensive_driving
  question: Why is it often harder to see a moose at night compared to a deer?
  choices:
    A: Moose fur absorbs all light
    B: Moose are taller, so their eyes typically do not reflect in headlights
    C: Moose travel much faster than deer
    D: Moose only travel during heavy rain or fog
  answer: B
  explanation: Deer eyes reflect light from headlights very well, but because moose
    are so much taller, drivers typically won't see their eyes reflected in the headlights.
- id: 368
  category: defensive_driving
  question: If a crash with a large animal is unavoidable, why should you let up on
    the brakes just before impact?
  choices:
    A: To allow the front of your vehicle to rise slightly
    B: To cause the vehicle to skid sideways
    C: To deploy the airbags faster
    D: To lower the front of the vehicle under the animal
  answer: A
  explanation: You should let up on the brakes just before impact to allow the front
    of your vehicle to rise slightly while trying to hit the tail end of the animal,
    reducing the risk of windshield strikes.
- id: 369
  category: vehicle_information
  question: A passenger vehicle's load must NOT extend beyond the line of the fenders
    on the left side, and no more than how many inches beyond the fenders on the right
    side?
  choices:
    A: 2 inches
    B: 6 inches
    C: 10 inches
    D: 12 inches
  answer: B
  explanation: No passenger type vehicle should carry a load which extends over the
    sides of the vehicle beyond the line of the fenders on the left side, or extends
    more than six inches beyond the line of the fenders on the right side.
- id: 370
  category: safe_driving_rules
  question: In which of the following is a person legally allowed to ride while it
    is being moved on a highway?
  choices:
    A: A camp trailer
    B: A mobile home
    C: A utility trailer
    D: None of the above
  answer: D
  explanation: 'The manual states: "No person may ride in a camp trailer, mobile home,
    semi-trailer, utility trailer or trunk of a vehicle while it is being driven or
    moved on any highway."'
- id: 371
  category: safe_driving_rules
  question: 'A passenger under 19 years of age riding in a pick-up truck must ride
    in the passenger compartment UNLESS they are:'
  choices:
    A: Riding with a licensed driver over 21
    B: A participant in a parade
    C: Sitting on the tailgate
    D: Traveling less than 5 miles
  answer: B
  explanation: A passenger under 19 must ride in the passenger compartment of a pick-up
    truck unless they meet specific exceptions, such as being a participant in a parade,
    an agricultural worker, or a licensed hunter.
- id: 372
  category: vehicle_information
  question: 'To avoid carbon monoxide poisoning if you are stranded in a snowstorm
    and running your engine to stay warm, you should:'
  choices:
    A: Keep all windows tightly closed
    B: Crack your windows slightly and keep the exhaust pipe clear of snow
    C: Run the engine continuously for at least two hours
    D: Turn on the air conditioning
  answer: B
  explanation: If waiting for help in a stranded car, you should crack your windows
    slightly to allow fresh air and keep the exhaust pipe clear of snow to avoid carbon
    monoxide poisoning.
- id: 373
  category: safe_driving_rules
  question: When can a dog be transported in the open portion of a convertible or
    vehicle on a public way?
  choices:
    A: Anytime, as long as the dog is well-behaved.
    B: Only if the dog is secured in a manner that prevents it from falling, jumping,
      or being thrown.
    C: Only if the vehicle is traveling under 35 mph.
    D: Dogs are never allowed in the open portion of a vehicle.
  answer: B
  explanation: According to the manual, you may not transport a dog in the open portion
    of a vehicle unless the dog is secured in a manner that prevents it from falling,
    jumping or being thrown from the vehicle.
- id: 374
  category: safe_driving_rules
  question: Which of the following individuals is exempt from the requirement to secure
    a dog in the open portion of a vehicle?
  choices:
    A: A driver traveling less than 5 miles to a veterinarian.
    B: A police officer transporting a K-9 unit.
    C: A licensed hunter transporting a hunting dog between hunting sites.
    D: A person driving a pickup truck with a cap.
  answer: C
  explanation: Exceptions to the dog-securing rule include a farmer/farm employee
    for agricultural activities, or a hunting dog at a hunting site or being transported
    between hunting sites by a licensed hunter.
- id: 375
  category: alcohol_drugs_health
  question: How do alcohol and other drugs affect your driving abilities?
  choices:
    A: They improve your ability to focus.
    B: They decrease your reaction time.
    C: They sharpen your vision.
    D: They reduce your judgment.
  answer: D
  explanation: The manual's practice questions state that alcohol and other drugs
    reduce your judgment.
- id: 376
  category: signs_and_signals
  question: What does a yellow dashed line on your side of the roadway mean?
  choices:
    A: Passing is prohibited on both sides.
    B: Passing is permitted on both sides.
    C: Passing is permitted on your side.
    D: You are approaching a no-passing zone.
  answer: C
  explanation: A yellow dashed line on your side of the roadway only means that passing
    is permitted on your side.
- id: 377
  category: safe_driving_rules
  question: If you arrive at a four-way intersection controlled by stop signs at the
    same time as another driver, what should you do?
  choices:
    A: Continue through the intersection immediately.
    B: Yield the right-of-way to the driver on your right.
    C: Yield the right-of-way to the driver on your left.
    D: Honk your horn to indicate you are going first.
  answer: B
  explanation: If you arrive at a four-way intersection controlled by stop signs at
    the same time as another driver, you should yield the right-of-way to the driver
    on your right.
- id: 378
  category: signs_and_signals
  question: What color are regulatory signs?
  choices:
    A: Green
    B: Yellow
    C: White
    D: Orange
  answer: C
  explanation: According to the practice questions in the manual, regulatory signs
    are white.
- id: 379
  category: sharing_the_road
  question: If a pedestrian is crossing in the middle of the street (jaywalking),
    what must you do?
  choices:
    A: Honk your horn and maintain your speed.
    B: You do not have to stop because they are not in a crosswalk.
    C: Swerve into the oncoming lane to avoid them.
    D: Must stop for them even if it is illegal.
  answer: D
  explanation: If a pedestrian is crossing in the middle of the street, not at a crosswalk
    (jaywalking), even if it is illegal, you must stop for them.
- id: 380
  category: sharing_the_road
  question: 'When approaching or passing a bicyclist, you should:'
  choices:
    A: Speed up and quickly pass the bicyclist.
    B: Sound your horn to alert your presence.
    C: Slow down and allow as much space as possible.
    D: Drive as close as possible to prevent them from swerving.
  answer: C
  explanation: When approaching or passing a bicyclist you should slow down and allow
    as much space as possible.
- id: 381
  category: safe_driving_rules
  question: 'When driving at night, you should use your high beams when:'
  choices:
    A: Fog, rain or snow is present.
    B: Following another vehicle.
    C: Driving in a well-lit urban area.
    D: There is no oncoming traffic approaching.
  answer: D
  explanation: When driving at night, use your high beams when there is no oncoming
    traffic approaching.
- id: 382
  category: driver_testing
  question: Which of the following is a reason a driving examiner may refuse to give
    you a road test?
  choices:
    A: The vehicle's glove compartment is not properly secured.
    B: The vehicle has an automatic transmission.
    C: The applicant asks the examiner a question before the test.
    D: The vehicle has snow treads during winter conditions.
  answer: A
  explanation: The manual lists 'Glove compartment not properly secured' as one of
    the typical reasons for road test refusals.
- id: 383
  category: driver_testing
  question: 'An examiner may refuse to conduct a road test if the applicant:'
  choices:
    A: Adjusts their mirrors before starting the vehicle.
    B: Refuses to remove pets from the vehicle.
    C: Brings a vehicle with a valid inspection sticker.
    D: Asks to roll down the windows.
  answer: B
  explanation: A road test may be refused if the 'Applicant refuses to remove pets
    from vehicle.'
- id: 384
  category: driver_testing
  question: 'During the road test, the examiner will NOT ask you to:'
  choices:
    A: Drive backward.
    B: Maintain proper lane position.
    C: Do anything that is extraordinary or illegal.
    D: React to pedestrians and traffic signs.
  answer: C
  explanation: 'The manual states regarding the road test: ''You will not be asked
    to do anything that is extraordinary or illegal.'''
- id: 385
  category: license_system
  question: When providing documentary evidence of residence in Maine, which of the
    following is NOT considered sufficient on its own?
  choices:
    A: A W-2 form.
    B: A post office box address.
    C: A utility bill.
    D: A paycheck stub.
  answer: B
  explanation: Acceptable documentary evidence must include the physical address of
    the person's residence. The manual explicitly states, 'A post office box or other
    mail drop address is not sufficient.'
- id: 386
  category: license_system
  question: 'The Secretary of State may exempt someone from standard residency documentary
    requirements if they establish they are:'
  choices:
    A: A tourist visiting for more than 30 days.
    B: An employee of a neighboring state.
    C: A student enrolled in a university, college or school within the State.
    D: A person planning to move to Maine within the next year.
  answer: C
  explanation: The Secretary of State may exempt someone who is on active duty in
    the US Armed Forces, their spouse/child, or 'a student enrolled in a university,
    college or school within the State.'
- id: 387
  category: license_system
  question: What is the minimum authorized period of admission required for a non-citizen
    to be issued a driver's license or non-driver identification card?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: D
  explanation: According to the manual, a credential will not be issued if the authorized
    period of admission is less than 120 days.
- id: 388
  category: license_system
  question: If a non-citizen's authorized period of admission is 'duration of status',
    when will their issued credential expire?
  choices:
    A: 1 year from the date of issuance
    B: 2 years from the date of issuance
    C: 4 years from the date of issuance
    D: 120 days from the date of issuance
  answer: C
  explanation: The manual states that if the authorized period of admission is duration
    of status, the issued credential will expire four (4) years from the date of issuance.
- id: 389
  category: license_system
  question: When will a credential expire if the non-citizen's authorized period of
    admission is neither 'duration of status' nor indicated by a specific date?
  choices:
    A: 30 days from the date of issuance
    B: 90 days from the date of issuance
    C: 120 days from the date of issuance
    D: 4 years from the date of issuance
  answer: C
  explanation: If the authorized period of admission is neither duration of status
    nor indicated by a specific date, the issued credential will expire 120 days from
    the date of issuance.
- id: 390
  category: license_system
  question: If a non-citizen has a specific expiration date for their authorized period
    of admission, when will their driver's license expire?
  choices:
    A: Four years from the date of issuance
    B: On the date indicated as the expiration date of the authorized period of admission
    C: 120 days from the date of issuance
    D: At the end of the standard statutory term for all drivers
  answer: B
  explanation: The manual specifies that a credential will expire on the date indicated
    as the expiration date of the authorized period of admission.
- id: 391
  category: license_system
  question: How does the issuance period of a driver's license for a non-citizen compare
    to the standard statutory terms?
  choices:
    A: It must always be exactly the same as the standard statutory term.
    B: It may be issued for a period less than the terms described in statute.
    C: It is always issued for exactly one year.
    D: It is always issued for exactly four years regardless of status.
  answer: B
  explanation: 'The manual states: ''A driver''s license or non-driver identification
    card issued to a non-citizen may be issued for a period less than the terms described
    in statute.'''
- id: 392
  category: license_system
  question: Which forms are properly endorsed or stamped to show Student and Exchange
    Visitor Information System (SEVIS) status?
  choices:
    A: Form I-94 or Form I-551
    B: Form I-20 or DS-2019
    C: Form I-130 or I-140
    D: Form I-765 or I-485
  answer: B
  explanation: The manual lists 'Student and Exchange Visitor Information System (SEVIS)
    (Form I-20) or (DS-2019) properly endorsed or stamped' as an acceptable document.
- id: 393
  category: license_system
  question: What document is acceptable to establish that a person is an American
    Indian born in Canada?
  choices:
    A: A standard Canadian driver's license
    B: A letter or tribal document
    C: A Canadian passport without any specific codes
    D: A provincial birth certificate
  answer: B
  explanation: The manual lists a 'Letter or tribal document establishing person is
    an American Indian born in Canada' as acceptable documentation.
- id: 394
  category: license_system
  question: Is a pending application for asylum considered an acceptable document
    for proving legal presence?
  choices:
    A: No, it is not acceptable until it is fully approved.
    B: Yes, an approved or pending application for asylum is acceptable.
    C: Yes, but only if accompanied by a valid foreign driver's license.
    D: No, only a pending application for temporary protected status is acceptable.
  answer: B
  explanation: The manual explicitly lists 'An approved or pending application for
    asylum' as an acceptable document.
- id: 395
  category: license_system
  question: Which federal departments issue 'other documents' that indicate legal
    presence under the Immigration and Nationality Act?
  choices:
    A: Department of Education or Department of Labor
    B: Department of Transportation or Department of State
    C: Department of Justice or Homeland Security
    D: Department of the Treasury or Department of Defense
  answer: C
  explanation: The manual accepts 'Any other documents issued by the United States
    Department of Justice or Homeland Security... which indicates legal presence in
    the United States.'
- id: 396
  category: license_system
  question: What does the ADIT stamp stand for in relation to the I-551 document?
  choices:
    A: Alien Documentation and Identification System
    B: Authorized Departure and Immigration Tracking
    C: American Document of Immigration and Travel
    D: Alien Departure and Identification Tracker
  answer: A
  explanation: The manual refers to the 'I-551 Alien Documentation and Identification
    System (ADIT) stamp'.
- id: 397
  category: license_system
  question: Which of the following is listed as an acceptable document for proving
    legal presence?
  choices:
    A: An expired foreign driver's license
    B: An Employment Authorization Card
    C: A foreign voter registration card
    D: An international driving permit
  answer: B
