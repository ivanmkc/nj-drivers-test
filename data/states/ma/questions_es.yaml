questions:
- id: 1
  category: license_system
  question: ¿En Massachusetts, cuál es la edad mínima que una persona debe alcanzar
    antes de ser elegible para solicitar un permiso de aprendizaje?
  choices:
    A: 15 años
    B: 15 años y medio
    C: 16 años
    D: 16 años y medio
  answer: C
  explanation: Según el RMV de Massachusetts, una persona debe tener al menos 16 años
    para solicitar un permiso de aprendizaje de Clase D.
- id: 2
  category: license_system
  question: Bajo la ley de Licencia de Operador Junior (JOL) de Massachusetts, ¿por
    cuánto tiempo tiene restringido un conductor nuevo transportar pasajeros menores
    de 18 años (que no sean familiares inmediatos)?
  choices:
    A: Los primeros 3 meses
    B: Los primeros 6 meses
    C: El primer año
    D: Hasta que cumplan 18 años
  answer: B
  explanation: La restricción de pasajeros de la JOL prohíbe a un operador junior
    transportar pasajeros menores de 18 años (excepto familiares inmediatos) durante
    los primeros 6 meses de tener la licencia, a menos que esté acompañado por un
    conductor con licencia de al menos 21 años con un año de experiencia.
- id: 3
  category: license_system
  question: ¿Cuáles son las horas de conducción restringidas para un Operador Junior
    en Massachusetts?
  choices:
    A: 11:00 PM a 4:00 AM
    B: 12:00 AM a 6:00 AM
    C: 12:30 AM a 5:00 AM
    D: 1:00 AM a 5:00 AM
  answer: C
  explanation: Un Operador Junior no puede operar un vehículo motorizado entre las
    12:30 AM y las 5:00 AM a menos que esté acompañado por un padre o tutor legal.
- id: 4
  category: license_system
  question: Si un Operador Junior es declarado culpable de exceso de velocidad por
    primera vez, ¿cuál es el período de suspensión obligatoria de la licencia en Massachusetts?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Por una primera infracción de exceso de velocidad, un Operador Junior
    enfrenta una suspensión de la licencia de 90 días, un cargo por restablecimiento
    de $500 y debe completar un curso SCARR (Cortes Estatales Contra la Furia al Volante)
    y un Reentrenamiento Actitudinal.
- id: 5
  category: license_system
  question: El titular de un permiso de aprendizaje en Massachusetts debe estar acompañado
    por un conductor con licencia que tenga al menos ____ años de edad y al menos
    ____ año(s) de experiencia de conducción.
  choices:
    A: 18; 1
    B: 21; 1
    C: 21; 2
    D: 25; 5
  answer: B
  explanation: El conductor supervisor de un titular de permiso debe tener al menos
    21 años, tener al menos un año de experiencia de conducción y estar sentado en
    el asiento del pasajero junto al conductor.
- id: 6
  category: license_system
  question: En Massachusetts, si cambia su nombre o dirección, ¿dentro de cuántos
    días debe notificar al RMV?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Massachusetts exige que notifique al RMV cualquier cambio
    de dirección o nombre dentro de los 30 días posteriores al cambio.
- id: 7
  category: license_system
  question: ¿Cuál es el límite de Contenido de Alcohol en Sangre (BAC) para un conductor
    menor de 21 años en Massachusetts?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Massachusetts tiene una política de 'Tolerancia Cero' para conductores
    menores de 21 años; un BAC de 0.02% o superior resultará en sanciones administrativas
    y suspensión de la licencia.
- id: 8
  category: license_system
  question: ¿Cuál es la sanción por una primera condena por carreras de velocidad
    (drag racing) para un Operador Junior?
  choices:
    A: Suspensión de 90 días
    B: Suspensión de 180 días
    C: Suspensión de 1 año
    D: Suspensión de 3 años
  answer: C
  explanation: Una primera condena por carreras de velocidad (drag racing) para un
    Operador Junior resulta en una suspensión de la licencia de 1 año y un cargo por
    restablecimiento de $500.
- id: 9
  category: license_system
  question: Para obtener una Licencia de Operador Junior, ¿cuántas horas de conducción
    supervisada debe completar un solicitante con un padre o tutor (además de las
    lecciones profesionales)?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: Los solicitantes de una JOL deben completar 40 horas de conducción
    supervisada documentadas por un padre o tutor (30 horas si el solicitante completa
    un programa de desarrollo de habilidades de conducción).
- id: 10
  category: license_system
  question: Según la ley de Massachusetts, ¿cuál de las siguientes afirmaciones es
    verdadera con respecto al uso de dispositivos electrónicos móviles para conductores
    menores de 18 años?
  choices:
    A: Pueden usar dispositivos de manos libres únicamente.
    B: Pueden usar dispositivos solo para navegación GPS.
    C: Tienen estrictamente prohibido el uso de cualquier dispositivo electrónico
      móvil, incluso en modo manos libres.
    D: Pueden usar dispositivos solo cuando están detenidos en un semáforo en rojo.
  answer: C
  explanation: Los operadores menores de 18 años tienen prohibido el uso de cualquier
    dispositivo electrónico móvil mientras conducen, incluida la tecnología de manos
    libres, excepto en caso de emergencia.
- id: 11
  category: license_system
  question: ¿Cuál es el período de suspensión de la licencia por una primera infracción
    de la ley de dispositivos electrónicos móviles para un Operador Junior (JOL)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Una primera infracción por usar un dispositivo electrónico móvil mientras
    conduce como Operador Junior resulta en una suspensión de 60 días, una multa de
    $100 y un curso obligatorio de reeducación actitudinal.
- id: 12
  category: license_system
  question: En Massachusetts, ¿una licencia Clase D le permite operar cuál de los
    siguientes?
  choices:
    A: Cualquier vehículo de más de 26,001 libras
    B: Vehículos de pasajeros, camionetas (vans) y camiones pequeños
    C: Solo motocicletas
    D: Autobuses comerciales
  answer: B
  explanation: Una licencia Clase D es la licencia estándar para vehículos de pasajeros
    utilizada para automóviles, SUV y camiones pequeños.
- id: 13
  category: license_system
  question: Si un Operador Junior viola la restricción de pasajeros por primera vez,
    ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Una primera infracción de la restricción de pasajeros de la Licencia
    de Operador Junior (JOL) resulta en una suspensión de la licencia de 60 días.
- id: 14
  category: license_system
  question: ¿Cuál de los siguientes NO es un requisito para solicitar una REAL ID
    en Massachusetts?
  choices:
    A: Número de Seguro Social (SSN)
    B: Prueba de residencia en Massachusetts
    C: Prueba de presencia legal en los EE. UU.
    D: Prueba de un historial de conducción limpio durante 5 años
  answer: D
  explanation: Para obtener una REAL ID, necesita prueba de SSN, residencia y presencia
    legal. Un historial de conducción limpio no es un requisito para la identificación
    en sí, aunque afecta el seguro y el estado de la licencia.
- id: 15
  category: license_system
  question: ¿Por cuántos años es válida una licencia de conducir estándar de Massachusetts
    antes de que expire?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: Una licencia de conducir estándar de Massachusetts suele ser válida
    por cinco años y expira en su cumpleaños.
- id: 16
  category: license_system
  question: Para un examen de manejo en Massachusetts, si el vehículo no tiene un
    freno de pie para el examinador, ¿qué debe tener para ser aceptable?
  choices:
    A: Un freno de estacionamiento electrónico montado en el tablero
    B: Un freno de estacionamiento ubicado en una consola central accesible para el
      examinador
    C: Volantes de dirección dobles
    D: Una transmisión manual
  answer: B
  explanation: Según el RMV, el vehículo del examen de manejo debe tener un freno
    de estacionamiento que el examinador pueda alcanzar en caso de emergencia, generalmente
    ubicado entre los asientos delanteros.
- id: 17
  category: license_system
  question: Un padre o tutor debe asistir a un curso profesional de educación vial
    de dos horas como parte de los requisitos de la Licencia de Operador Junior (JOL).
    ¿Por cuánto tiempo es válida esta certificación de la clase para padres?
  choices:
    A: 1 año
    B: 2 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: El RMV de Massachusetts establece que la participación de un padre
    en el módulo de educación vial es válida por cinco años y puede usarse para otros
    hijos de la familia durante ese período.
- id: 18
  category: license_system
  question: El examen del permiso de aprendizaje de Massachusetts consta de 25 preguntas.
    ¿Cuál es el número mínimo de respuestas correctas requeridas para aprobar?
  choices:
    A: '15'
    B: '18'
    C: '20'
    D: '22'
  answer: B
  explanation: Para aprobar el examen del permiso de aprendizaje Clase D o Clase M,
    debe responder correctamente al menos 18 de las 25 preguntas dentro del límite
    de tiempo de 20 minutos.
- id: 19
  category: license_system
  question: En Massachusetts, un conductor es designado como 'Infractor de Tráfico
    Habitual' si acumula un total de ¿cuántas infracciones de movimiento graves dentro
    de un período de cinco años?
  choices:
    A: '2'
    B: '3'
    C: '5'
    D: '10'
  answer: B
  explanation: Un Infractor de Tráfico Habitual es alguien que tiene un total de 3
    infracciones de movimiento graves o cualquier combinación de 12 infracciones graves
    y leves dentro de un período de cinco años.
- id: 20
  category: license_system
  question: ¿Cuál es el cargo por restablecimiento de la licencia para un Operador
    Junior cuya licencia fue suspendida por una condena de exceso de velocidad por
    primera vez?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Si bien la suspensión por una condena de exceso de velocidad por primera
    vez para un titular de JOL es de 90 días, el cargo por restablecimiento es de
    $500 obligatorios.
- id: 21
  category: license_system
  question: Para cumplir con los requisitos de visión para una licencia Clase D en
    Massachusetts, el solicitante debe tener al menos ______ de agudeza visual en
    su mejor ojo (con o sin lentes correctores).
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Massachusetts requiere al menos 20/40 de agudeza visual en el mejor
    ojo y al menos 120 grados de visión periférica horizontal combinada.
- id: 22
  category: license_system
  question: ¿Si reprueba el examen de conducir en Massachusetts, cuánto tiempo debe
    esperar antes de ser elegible para realizar el examen nuevamente?
  choices:
    A: 24 horas
    B: 7 días
    C: 2 semanas
    D: 30 días
  answer: C
  explanation: Según el Manual del Conductor del RMV, si reprueba el examen de conducir,
    debe esperar al menos dos semanas antes de realizar otro.
- id: 23
  category: license_system
  question: En Massachusetts, bajo el Plan de Seguro para Conductores Seguros (SDIP),
    ¿cuántos puntos se asignan a su historial de conducción por una 'infracción de
    tránsito menor'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Bajo el SDIP, una infracción de tránsito menor (como el exceso de velocidad)
    añade 2 puntos a su historial de conducción.
- id: 24
  category: license_system
  question: Bajo la ley 'Motor Voter' de Massachusetts, ¿a qué edad puede una persona
    preinscribirse para votar por primera vez en el RMV?
  choices:
    A: '14'
    B: '16'
    C: '17'
    D: '18'
  answer: B
  explanation: La ley de Massachusetts permite a los residentes preinscribirse para
    votar a partir de los 16 años, y esto se puede hacer durante el proceso de solicitud
    del permiso de aprendizaje.
- id: 25
  category: license_system
  question: En Massachusetts, ¿a qué edad puede un residente elegir por primera vez
    que se coloque la designación de 'Donante de Órganos' en su permiso de aprendizaje
    o tarjeta de identificación?
  choices:
    A: '14'
    B: '15'
    C: '16'
    D: '18'
  answer: C
  explanation: Los residentes pueden inscribirse en el registro de donantes de órganos
    a partir de los 16 años cuando solicitan su permiso de aprendizaje.
- id: 26
  category: license_system
  question: Para ser elegible para una Licencia de Operador Junior (JOL), ¿durante
    cuántos meses consecutivos inmediatamente anteriores al examen de conducir debe
    el solicitante mantener un historial de conducción limpio?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Un solicitante de JOL debe tener un historial de conducción limpio
    durante los seis meses consecutivos inmediatamente anteriores a la fecha del examen
    de conducir.
- id: 27
  category: license_system
  question: Si se muda a Massachusetts y tiene una licencia de conducir válida de
    otro estado que ha estado vencida por más de ______, debe realizar el examen del
    permiso de aprendizaje y un examen de conducir.
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Si una licencia de otro estado ha estado vencida por más de un año,
    el RMV requiere que el solicitante apruebe tanto el examen escrito como el de
    conducir.
- id: 28
  category: license_system
  question: Para que se agregue el indicador de 'Veterano' a una licencia de Massachusetts,
    ¿qué documento debe presentar el solicitante al RMV?
  choices:
    A: Una tarjeta de identificación militar
    B: Una carta del VA (Departamento de Asuntos de Veteranos)
    C: Un formulario DD-214 que muestre una baja honorable
    D: Un certificado de nacimiento
  answer: C
  explanation: Para obtener el indicador de Veterano, debe presentar un formulario
    DD-214 que indique una baja honorable (Honorable Discharge) del servicio activo.
- id: 29
  category: license_system
  question: ¿Cuál de las siguientes es una restricción para el titular de una Licencia
    de Operador Junior (JOL) con respecto al tipo de vehículo que puede operar?
  choices:
    A: No puede conducir un vehículo con transmisión manual
    B: No puede conducir un vehículo de más de 4 cilindros
    C: No puede conducir ningún vehículo que requiera una Licencia de Conducir Comercial
      (CDL)
    D: No puede conducir un vehículo con un peso bruto superior a 6,000 libras
  answer: C
  explanation: Un Operador Junior tiene prohibido operar cualquier vehículo que requiera
    una Licencia de Conducir Comercial (CDL), incluidos aquellos que transporten materiales
    peligrosos.
- id: 30
  category: driver_testing
  question: En Massachusetts, si acumula tres eventos con recargo (surchargeable events)
    en un período de dos años, ¿cuál es el requisito obligatorio para evitar la suspensión
    de la licencia?
  choices:
    A: Pagar una multa de $500
    B: Completar un Curso de Reentrenamiento para Conductores dentro de 90 días
    C: Volver a tomar el examen escrito del permiso de aprendizaje
    D: Instalar un dispositivo de bloqueo de encendido (IID)
  answer: B
  explanation: Los conductores que acumulen tres eventos con recargo (infracciones
    de tránsito o accidentes con culpa) en un período de dos años deben completar
    un Curso de Reentrenamiento para Conductores aprobado por el Registrador dentro
    de los 90 días o su licencia será suspendida.
- id: 31
  category: driver_testing
  question: ¿Cuál es el período de suspensión de la licencia para un conductor de
    Massachusetts que acumula siete eventos con recargo (surchargeable events) en
    un período de tres años?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: Según la ley de Massachusetts, acumular siete eventos con recargo en
    un período de tres años resulta en una suspensión automática de la licencia por
    60 días.
- id: 32
  category: driver_testing
  question: Bajo la Ley de Consentimiento Implícito (Implied Consent Law) de Massachusetts,
    si un conductor de 21 años o más se niega a realizarse una prueba química de BAC,
    ¿cuál es el período de suspensión automática de la licencia por una primera infracción?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Para conductores de 21 años o más sin infracciones previas por conducir
    bajo la influencia (OUI), negarse a una prueba química de aliento o sangre resulta
    en una suspensión automática de la licencia por 180 días.
- id: 33
  category: driver_testing
  question: ¿Con qué frecuencia debe someterse a una inspección de seguridad y emisiones
    un vehículo registrado en Massachusetts?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: La ley de Massachusetts exige que todos los vehículos motorizados pasen
    una inspección combinada de seguridad y emisiones cada año.
- id: 34
  category: driver_testing
  question: En Massachusetts, ¿cuándo es obligatorio encender los faros delanteros
    en relación con las condiciones climáticas?
  choices:
    A: Solo cuando la visibilidad es inferior a 100 pies
    B: Solo durante tormentas de nieve
    C: Siempre que use los limpiaparabrisas
    D: Solo después del atardecer
  answer: C
  explanation: La ley de Massachusetts exige que los conductores enciendan los faros
    delanteros y las luces traseras siempre que los limpiaparabrisas estén en uso
    debido a la precipitación (lluvia, nieve, etc.).
- id: 35
  category: driver_testing
  question: ¿Cuál es la multa por una primera infracción de la "Ley de Moverse a un
    Lado" (Move Over Law) de Massachusetts con respecto a los vehículos de emergencia?
  choices:
    A: Hasta $50
    B: Hasta $100
    C: Hasta $250
    D: Hasta $500
  answer: B
  explanation: Una infracción de la Ley de Moverse a un Lado, que exige que los conductores
    cambien de carril o reduzcan la velocidad ante vehículos de emergencia con luces
    intermitentes, se castiga con una multa de hasta $100.
- id: 36
  category: driver_testing
  question: ¿Cuál es el límite de tiempo otorgado para completar el examen de 25 preguntas
    para el permiso de aprendizaje de Massachusetts?
  choices:
    A: 15 minutos
    B: 20 minutos
    C: 30 minutos
    D: Sin límite de tiempo
  answer: B
  explanation: El RMV (Registro de Vehículos Motorizados) otorga a los solicitantes
    20 minutos para completar el examen de conocimientos automatizado para el permiso
    de aprendizaje.
- id: 37
  category: driver_testing
  question: ¿Cuál es la multa máxima por una condena de primera infracción por Conducir
    Bajo la Influencia (OUI) en Massachusetts?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: Una condena por OUI por primera vez en Massachusetts conlleva una multa
    que oscila entre $500 y $5,000, además de una posible pena de prisión y la suspensión
    de la licencia.
- id: 38
  category: driver_testing
  question: Bajo la "Ley de Transferencia de Siete Días" (Seven-Day Transfer Law)
    de Massachusetts, ¿cuántos días tiene para transferir un registro de un vehículo
    viejo a un vehículo recién adquirido?
  choices:
    A: 3 días
    B: 7 días
    C: 10 días
    D: 14 días
  answer: B
  explanation: La Ley de Transferencia de Siete Días permite a una persona transferir
    el registro de un vehículo a un vehículo recién adquirido por hasta siete días,
    siempre que se cumplan ciertas condiciones (como la venta del vehículo anterior).
- id: 39
  category: driver_testing
  question: Para aprobar el examen de la vista de Massachusetts, ¿cuál es el campo
    de visión periférica horizontal combinado mínimo requerido?
  choices:
    A: 90 grados
    B: 100 grados
    C: 120 grados
    D: 140 grados
  answer: C
  explanation: El RMV requiere un campo de visión periférica horizontal combinado
    de al menos 120 grados para calificar para una licencia de conducir.
- id: 40
  category: driver_testing
  question: Para evitar que se le cobre la tarifa del examen de manejo, ¿con cuánta
    anticipación debe notificar al RMV para cancelar o reprogramar una cita para el
    examen de manejo?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: C
  explanation: El RMV requiere un aviso de al menos 72 horas (3 días) para cancelar
    o reprogramar un examen de manejo; de lo contrario, al solicitante se le cobrará
    la tarifa del examen de manejo.
- id: 41
  category: driver_testing
  question: Si un conductor con licencia de Massachusetts es condenado por una infracción
    de tráfico en otro estado, ¿cómo afecta esto a su historial de conducción de Massachusetts?
  choices:
    A: No se registra en Massachusetts
    B: Se registra pero no conlleva puntos
    C: Se trata como si hubiera ocurrido en Massachusetts
    D: Solo afecta al conductor si es un Operador Junior (Junior Operator)
  answer: C
  explanation: El RMV registra las condenas fuera del estado y las trata como si hubieran
    ocurrido en Massachusetts a efectos de eventos con recargo y suspensiones de licencia.
- id: 42
  category: driver_testing
  question: ¿Cuál es el monto mínimo de cobertura del seguro obligatorio de lesiones
    corporales a terceros (Compulsory Bodily Injury to Others) requerido para un vehículo
    registrado en Massachusetts?
  choices:
    A: $10,000 por persona / $20,000 por accidente
    B: $20,000 por persona / $40,000 por accidente
    C: $25,000 por persona / $50,000 por accidente
    D: $50,000 por persona / $100,000 por accidente
  answer: B
  explanation: La ley de Massachusetts exige un mínimo de $20,000 por persona y $40,000
    por accidente para el Seguro Obligatorio de Lesiones Corporales a Terceros (Parte
    1 de la póliza).
- id: 43
  category: driver_testing
  question: Para aprobar el examen de la vista de Massachusetts, ¿cuál es la agudeza
    visual mínima requerida en al menos un ojo (con o sin lentes correctivos)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según el Manual del Conductor de Massachusetts, un solicitante debe
    tener al menos una agudeza visual lejana de 20/40 en al menos un ojo, con o sin
    lentes correctivos, para cumplir con los requisitos estándar de visión.
- id: 44
  category: driver_testing
  question: Durante un examen de conducir en Massachusetts, ¿cuál de los siguientes
    es un requisito para su patrocinador (sponsor)?
  choices:
    A: Debe tener al menos 18 años de edad
    B: Debe tener su licencia de conducir física en su posesión
    C: Debe sentarse en el asiento trasero del vehículo
    D: Debe tener al menos 5 años de experiencia de conducción
  answer: B
  explanation: El patrocinador para un examen de conducir en Massachusetts debe tener
    al menos 21 años de edad, tener al menos un año de experiencia de conducción y
    debe tener su licencia de conducir física en su posesión para presentarla al examinador.
- id: 45
  category: driver_testing
  question: ¿Cuál es el número máximo de exámenes de conducir que un solicitante de
    Massachusetts puede tomar dentro de un período de 12 meses?
  choices:
    A: '3'
    B: '4'
    C: '6'
    D: Ilimitado
  answer: C
  explanation: La ley de Massachusetts limita a los solicitantes a no más de seis
    exámenes de conducir en cualquier período de 12 meses.
- id: 46
  category: driver_testing
  question: Durante el examen de conducir de Massachusetts, se le pedirá que demuestre
    su capacidad para retroceder su vehículo en línea recta durante aproximadamente
    ¿cuántos pies?
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El examen de conducir de Massachusetts incluye una maniobra en la que
    el solicitante debe retroceder el vehículo en línea recta durante unos 50 pies.
- id: 47
  category: driver_testing
  question: Si bien la licencia de Massachusetts es válida por 5 años, ¿con qué frecuencia
    debe un conductor visitar un centro del RMV en persona para volver a tomar el
    examen de la vista y tomarse una foto nueva?
  choices:
    A: Cada 5 años
    B: Cada 10 años
    C: Solo después de los 75 años
  answer: B
  explanation: Los conductores de Massachusetts pueden renovar en línea una vez, pero
    deben renovar en persona cada 10 años (cada dos renovaciones) para aprobar un
    examen de la vista y actualizar su foto.
- id: 48
  category: driver_testing
  question: Durante el examen de conducir, el examinador le pedirá que demuestre las
    señales manuales. ¿Cuál es la señal manual correcta para 'Disminuir la velocidad
    o detenerse'?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo extendido hacia arriba en un ángulo de 90 grados
    C: Brazo extendido hacia abajo en un ángulo de 90 grados
    D: Brazo agitándose en movimiento circular
  answer: C
  explanation: En Massachusetts, la señal manual para disminuir la velocidad o detenerse
    es el brazo extendido hacia abajo por la ventana en un ángulo de 90 grados.
- id: 49
  category: driver_testing
  question: Si un solicitante de permiso de Massachusetts no es elegible para un Número
    de Seguro Social (SSN), ¿qué debe proporcionar al RMV?
  choices:
    A: Una declaración jurada por escrito de uno de los padres
    B: Solo un certificado de nacimiento de su país de origen
    C: Una carta de denegación de la Administración del Seguro Social
    D: Nada; el SSN es opcional
  answer: C
  explanation: Los solicitantes que no tienen un SSN deben proporcionar una carta
    de denegación de la Administración del Seguro Social (emitida dentro de los últimos
    60 días) junto con una prueba de presencia legal y residencia.
- id: 50
  category: driver_testing
  question: ¿Cuál de las siguientes acciones durante un examen de conducir en Massachusetts
    resultará en una reprobación automática?
  choices:
    A: No usar una señal de giro una vez
    B: Subirse o conducir sobre un bordillo o acera
    C: Ajustar los espejos antes de comenzar
    D: Tardar más de 3 minutos en estacionar en paralelo
  answer: B
  explanation: Subirse o conducir sobre un bordillo o acera, causar una colisión o
    cometer cualquier 'acción peligrosa' son motivos de reprobación inmediata en el
    examen de conducir de Massachusetts.
- id: 51
  category: driver_testing
  question: Para aprobar el examen de la vista de Massachusetts, ¿entre qué colores
    utilizados en las señales de tráfico debe ser capaz de distinguir?
  choices:
    A: Rojo, verde y azul
    B: Rojo, amarillo y blanco
    C: Rojo, verde y ámbar
    D: Rojo, verde y amarillo
  answer: C
  explanation: El Manual del Conductor de Massachusetts establece específicamente
    que los solicitantes deben ser capaces de distinguir los colores rojo, verde y
    ámbar.
- id: 52
  category: driver_testing
  question: Al llevar un vehículo para un examen de manejo en Massachusetts, el vehículo
    debe tener una calcomanía de inspección válida. ¿Cuál es la sanción si el vehículo
    no cumple con este requisito?
  choices:
    A: El examinador le dará 30 minutos para encontrar otro auto
    B: El examen será rechazado y deberá pagar otra tarifa de examen
    C: El examinador realizará el examen pero lo anotará en su licencia
    D: Se le emitirá una citación pero el examen continuará
  answer: B
  explanation: Si el vehículo no tiene una calcomanía de inspección válida, el examen
    de manejo será cancelado y el solicitante deberá pagar la tarifa del examen de
    manejo nuevamente al reprogramarlo.
- id: 53
  category: driver_testing
  question: Durante la parte de estacionamiento en paralelo del examen de manejo de
    Massachusetts, ¿a cuántas pulgadas de la acera debe estar estacionado su vehículo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: En Massachusetts, el estándar para el estacionamiento en paralelo es
    que el vehículo debe estar estacionado a menos de 12 pulgadas de la acera.
- id: 54
  category: driver_responsibility
  question: En Massachusetts, debe presentar un Informe del Operador de Accidente
    de Vehículo Motorizado (Motor Vehicle Crash Operator Report) si el daño a cualquier
    vehículo u otra propiedad supera ¿qué cantidad?
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Según el Manual del Conductor de Massachusetts, se debe presentar un
    informe de accidente ante el Registrador, la policía local y la compañía de seguros
    si los daños a cualquier vehículo o propiedad superan los $1,000.
- id: 55
  category: driver_responsibility
  question: Según la ley de Massachusetts, ¿cuál es el monto mínimo de seguro obligatorio
    de Responsabilidad por Lesiones Corporales (Bodily Injury Liability) requerido
    para una persona en un accidente?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: B
  explanation: Massachusetts requiere un mínimo de $20,000 por persona por Lesiones
    Corporales a Terceros (Parte 1 de la póliza de seguro obligatorio).
- id: 56
  category: driver_responsibility
  question: Cuando compra un vehículo a un concesionario o a un particular, ¿cuántos
    días tiene para que el vehículo sea inspeccionado en una estación de inspección
    autorizada de Massachusetts?
  choices:
    A: 3 días
    B: 7 días
    C: 10 días
    D: 14 días
  answer: B
  explanation: Todo vehículo registrado en Massachusetts debe aprobar una inspección
    de seguridad y emisiones dentro de los siete días posteriores al registro.
- id: 57
  category: driver_responsibility
  question: Si tiene 21 años de edad o más y es condenado por una primera ofensa de
    Operar Bajo la Influencia (OUI), ¿por cuánto tiempo se suspenderá su licencia
    de conducir?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: D
  explanation: Para una condena por primera ofensa de OUI en Massachusetts para un
    conductor de 21 años o más, el período de suspensión de la licencia es de un año.
- id: 58
  category: driver_responsibility
  question: En Massachusetts, ¿cuál es la multa máxima por una condena por primera
    ofensa de tener un recipiente abierto de alcohol en el área de pasajeros de un
    vehículo motorizado?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: La multa por una infracción de recipiente abierto en Massachusetts
    oscila entre $100 y $500.
- id: 59
  category: driver_responsibility
  question: Si un conductor mayor de 21 años se niega a una prueba química (alcoholímetro)
    y no tiene ofensas previas de OUI, ¿por cuánto tiempo se suspenderá su licencia
    automáticamente?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 3 años
  answer: B
  explanation: Según la Ley de Consentimiento Implícito, un conductor de 21 años o
    más sin ofensas previas de OUI que se niega a una prueba química se enfrenta a
    una suspensión automática de la licencia de 180 días.
- id: 60
  category: driver_responsibility
  question: ¿Cuántos eventos con recargo (surchargeable events) dentro de un período
    de dos años darán lugar a que un conductor deba completar un Curso de Reentrenamiento
    para Conductores?
  choices:
    A: 2 eventos
    B: 3 eventos
    C: 5 eventos
    D: 7 eventos
  answer: B
  explanation: Si acumula tres eventos con recargo (infracciones de tránsito o accidentes
    con culpa) en un período de dos años, debe completar un Curso de Reentrenamiento
    para Conductores o enfrentar la suspensión de la licencia.
- id: 61
  category: driver_responsibility
  question: ¿En Massachusetts, cuántos eventos con recargo (surchargeable events)
    dentro de un período de tres años resultarán en una suspensión automática de la
    licencia por 60 días?
  choices:
    A: 3 eventos
    B: 5 eventos
    C: 7 eventos
    D: 10 eventos
  answer: C
  explanation: El RMV suspenderá su licencia por 60 días si acumula siete eventos
    con recargo dentro de un período de tres años.
- id: 62
  category: driver_responsibility
  question: Bajo el Plan de Seguro para Conductores Seguros (SDIP) de Massachusetts,
    ¿cuántos puntos de recargo se asignan por una infracción grave de las leyes de
    tránsito (como OUI)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: D
  explanation: Una infracción grave de las leyes de tránsito resulta en la adición
    de 5 puntos de recargo al registro del conductor.
- id: 63
  category: driver_responsibility
  question: Si su vehículo no pasa una prueba de emisiones de Massachusetts, ¿cuántos
    días tiene para solucionar el problema y hacer que el vehículo sea inspeccionado
    nuevamente?
  choices:
    A: 20 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: Si un vehículo no pasa la prueba de emisiones, el propietario tiene
    60 días para reparar el vehículo y pasar una nueva prueba.
- id: 64
  category: driver_responsibility
  question: ¿En Massachusetts, dentro de cuántos días se debe presentar un Informe
    de Operador por Accidente de Vehículo Motorizado al RMV después de un accidente?
  choices:
    A: 2 días
    B: 5 días
    C: 7 días
    D: 10 días
  answer: B
  explanation: Debe presentar un informe de accidente dentro de los cinco días posteriores
    al accidente si cumple con los criterios de notificación (lesiones, muerte o daños
    a la propiedad de más de $1,000).
- id: 65
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima obligatoria de Protección contra Lesiones
    Personales (PIP) requerida para una póliza de seguro de auto en Massachusetts?
  choices:
    A: $2,000
    B: $5,000
    C: $8,000
    D: $10,000
  answer: C
  explanation: La Protección contra Lesiones Personales (PIP) es una parte obligatoria
    del seguro de auto de Massachusetts, y la cobertura mínima requerida es de $8,000.
- id: 66
  category: driver_responsibility
  question: 'Bajo la ''Ley de Transferencia de Siete Días'', usted puede conducir
    un vehículo recién adquirido con sus placas antiguas por hasta siete días si ha
    perdido la posesión de su vehículo anterior y el nuevo vehículo es:'
  choices:
    A: De la misma marca y modelo que el anterior
    B: Del mismo tipo de registro (por ejemplo, vehículo de pasajeros)
    C: Asegurado por una compañía diferente
    D: Comprado únicamente a un familiar
  answer: B
  explanation: La ley de transferencia de 7 días le permite transferir un registro
    de un vehículo a otro del mismo tipo de registro, siempre que se haya deshecho
    del primer vehículo.
- id: 67
  category: driver_responsibility
  question: ¿En Massachusetts, cuántos puntos de recargo se asignan a su registro
    de conducir por un accidente menor con culpa (daños entre $1,000 y $5,000)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Bajo el sistema SDIP, un accidente menor con culpa (más de $1,000 pero
    menos de $5,000 en daños) resulta en 3 puntos de recargo.
- id: 68
  category: driver_responsibility
  question: En Massachusetts, si usted está involucrado en un choque donde alguien
    resulta herido o hay daños a la propiedad que superan los $1,000, ¿dentro de cuántos
    días debe presentar un Informe de Operador por Accidente de Vehículo Motorizado?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Según el RMV de Massachusetts, se debe presentar un informe de accidente
    dentro de los 5 días si alguna persona muere, resulta herida o si hay daños que
    superen los $1,000 en cualquier vehículo u otra propiedad.
- id: 69
  category: driver_responsibility
  question: ¿Cuál es el monto mínimo de cobertura de seguro por 'Daños a la Propiedad
    de Otra Persona' requerido por ley en Massachusetts?
  choices:
    A: $1,000
    B: $5,000
    C: $10,000
    D: $20,000
  answer: B
  explanation: La ley de Massachusetts requiere un mínimo de $5,000 en cobertura para
    daños a la propiedad de otra persona (Parte 4 de la póliza estándar).
- id: 70
  category: driver_responsibility
  question: Cuando compra un vehículo y lo registra en Massachusetts, ¿dentro de cuántos
    días debe someter el vehículo a una inspección estatal de seguridad y emisiones?
  choices:
    A: 3 días
    B: 7 días
    C: 14 días
    D: 30 días
  answer: B
  explanation: Todos los vehículos registrados en Massachusetts deben pasar una inspección
    de seguridad y emisiones dentro de los 7 días posteriores al registro.
- id: 71
  category: driver_responsibility
  question: ¿Cuál es la multa para un conductor o pasajero (de 16 años o más) que
    no use el cinturón de seguridad en Massachusetts?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: En Massachusetts, la multa por violar la ley del cinturón de seguridad
    es de $25 por persona.
- id: 72
  category: driver_responsibility
  question: Si se le condena por no "Ceder el paso" (Move Over) a un vehículo de emergencia
    con luces intermitentes en Massachusetts, ¿cuál es la multa por una primera infracción?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La Ley de Ceder el Paso (Move Over Law) de Massachusetts exige que
    los conductores reduzcan la velocidad y, si es seguro, se muevan a un carril no
    adyacente para los vehículos de emergencia. Una infracción conlleva una multa
    de hasta $100.
- id: 73
  category: driver_responsibility
  question: ¿Cuál es la multa obligatoria por una primera infracción por no detenerse
    ante un autobús escolar con sus luces rojas intermitentes y el brazo de parada
    extendido en Massachusetts?
  choices:
    A: $100
    B: $200
    C: $250
    D: $500
  answer: C
  explanation: En Massachusetts, la multa por una primera infracción por rebasar ilegalmente
    a un autobús escolar es de $250.
- id: 74
  category: driver_responsibility
  question: En Massachusetts, ¿cuál es la sanción por abandonar un vehículo motorizado
    en una vía pública o privada sin permiso?
  choices:
    A: Solo una multa de $50
    B: Una multa de $250–$500 y la suspensión de la licencia por hasta 2 años
    C: 30 días obligatorios de cárcel
    D: No hay sanción si el vehículo tiene más de 10 años
  answer: B
  explanation: Abandonar un vehículo en Massachusetts puede resultar en una multa
    de $250 a $500 y una suspensión de la licencia de hasta dos años.
- id: 75
  category: driver_responsibility
  question: ¿Cuál es la multa mínima por una primera infracción por estacionarse en
    un espacio designado para personas con discapacidades sin un cartel (placard)
    o placa válida en Massachusetts?
  choices:
    A: $50
    B: $100
    C: $300
    D: $500
  answer: C
  explanation: La multa por una primera infracción de estacionamiento no autorizado
    en un espacio accesible para personas con discapacidad en Massachusetts es de
    $300.
- id: 76
  category: driver_responsibility
  question: ¿Cuál es la multa mínima por arrojar basura desde un vehículo motorizado
    en Massachusetts?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: Según la ley de Massachusetts, arrojar basura desde un vehículo motorizado
    es ilegal y conlleva una multa mínima de $100.
- id: 77
  category: driver_responsibility
  question: Si vende su automóvil y compra uno nuevo, ¿cuántos días tiene para transferir
    su registro al nuevo vehículo, siempre que cumpla con criterios específicos (como
    tener al menos 18 años y que los tipos de vehículos sean los mismos)?
  choices:
    A: 3 días
    B: 7 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Massachusetts permite un período de gracia de 7 días para transferir
    un registro de un vehículo vendido o entregado como parte de pago a un vehículo
    recién adquirido.
- id: 78
  category: safe_driving_rules
  question: En Massachusetts, ¿cuál es el límite de velocidad en un distrito "densamente
    poblado" (thickly settled) o comercial a menos que se indique lo contrario?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: Según el Manual del Conductor de Massachusetts, el límite de velocidad
    en un distrito densamente poblado o comercial es de 30 mph, a menos que las señales
    indiquen lo contrario.
- id: 79
  category: safe_driving_rules
  question: Al conducir en una autopista en Massachusetts, ¿cuántos pies antes de
    una salida o giro debe señalizar su intención de moverse?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: En Massachusetts, debe señalizar al menos 500 pies antes de un giro
    o salida en una autopista, y 100 pies en otras carreteras.
- id: 80
  category: safe_driving_rules
  question: Según la ley de Massachusetts, debe encender los faros delanteros y las
    luces traseras siempre que use los limpiaparabrisas. ¿En qué otra condición específica
    deben estar encendidos?
  choices:
    A: Solo cuando está nevando
    B: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol
    C: Solo cuando se conduce por carreteras rurales sin iluminación
    D: Exactamente desde la puesta del sol hasta la salida del sol
  answer: B
  explanation: La ley de Massachusetts exige que los faros delanteros y las luces
    traseras estén encendidos desde media hora después de la puesta del sol hasta
    media hora antes de la salida del sol, y siempre que la visibilidad se reduzca
    o los limpiaparabrisas estén en uso.
- id: 81
  category: safe_driving_rules
  question: ¿En Massachusetts, cuál es la distancia mínima a la que debe estacionarse
    de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley estatal prohíbe estacionarse a menos de 10 pies de un hidrante
    de incendios.
- id: 82
  category: safe_driving_rules
  question: Al entrar en una glorieta (rotary) en Massachusetts, ¿quién tiene el derecho
    de paso?
  choices:
    A: El tráfico que entra a la glorieta
    B: El tráfico que ya está en la glorieta
    C: El vehículo que se aproxima por la derecha
    D: El vehículo que viaja a la velocidad más alta
  answer: B
  explanation: En Massachusetts, el tráfico que ya se encuentra dentro de la glorieta
    tiene el derecho de paso sobre los vehículos que intentan entrar.
- id: 83
  category: safe_driving_rules
  question: La "Ley de Moverse a un Lado" (Move Over Law) de Massachusetts exige que
    los conductores hagan ¿qué al acercarse a un vehículo de emergencia o de mantenimiento
    estacionado con luces intermitentes?
  choices:
    A: Detenerse inmediatamente en el carril de circulación
    B: Mantener la velocidad pero tocar la bocina para advertir a los trabajadores
    C: Cambiarse a un carril no adyacente si es seguro, o reducir la velocidad a un
      ritmo razonable
    D: Acelerar para rebasar el vehículo lo más rápido posible
  answer: C
  explanation: La Ley de Moverse a un Lado exige que los conductores se cambien de
    carril si es posible, o reduzcan la velocidad a un nivel seguro ante vehículos
    de emergencia, mantenimiento o recuperación que tengan luces intermitentes.
- id: 84
  category: safe_driving_rules
  question: Si conduce por una carretera con una barrera física o mediana que divide
    la autopista, ¿está obligado a detenerse ante un autobús escolar con luces rojas
    intermitentes en el lado opuesto?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no es necesario detenerse si hay una barrera física o mediana
    C: Sí, pero solo si el conductor del autobús le indica que se detenga
    D: No, pero debe reducir la velocidad a 10 mph
  answer: B
  explanation: En Massachusetts, no tiene que detenerse ante un autobús escolar con
    luces rojas intermitentes si este se encuentra al otro lado de una carretera dividida
    por una barrera física o mediana.
- id: 85
  category: safe_driving_rules
  question: Al estacionar su vehículo en una pendiente cuesta abajo con bordillo (acera),
    ¿en qué dirección debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: Hacia afuera del bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo con bordillo, debe girar las ruedas hacia
    el bordillo para que el auto ruede contra él en caso de que fallen los frenos.
- id: 86
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad estándar en una zona escolar en Massachusetts?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El límite de velocidad en una zona escolar es de 20 mph en todo el
    estado de Massachusetts.
- id: 87
  category: safe_driving_rules
  question: En Massachusetts, si se le condena por exceso de velocidad en una zona
    de obras designada, ¿qué sucede con la multa?
  choices:
    A: La multa se exonera para infractores por primera vez
    B: La multa se duplica
    C: La multa se triplica
    D: La multa aumenta en un monto fijo de $500
  answer: B
  explanation: Según la ley de Massachusetts, las multas por exceso de velocidad se
    duplican en las zonas de obras activas.
- id: 88
  category: safe_driving_rules
  question: Al usar las luces altas (luces largas) por la noche, ¿a cuántos pies de
    distancia debe cambiar a luces bajas cuando se aproxima un vehículo en sentido
    contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Debe bajar las luces altas cuando un vehículo se aproxima en sentido
    contrario a menos de 500 pies, y cuando sigue a un vehículo a menos de 200 pies.
- id: 89
  category: safe_driving_rules
  question: En Massachusetts, ¿en cuál de las siguientes circunstancias se le permite
    rebasar a un vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante está girando a la izquierda
    B: Para rebasar a un conductor lento en una carretera de un solo carril
    C: Cuando tiene prisa y el carril izquierdo está bloqueado
    D: Nunca se permite rebasar por la derecha
  answer: A
  explanation: Rebasar por la derecha está permitido en Massachusetts únicamente en
    calles de un solo sentido o cuando el vehículo que se pretende rebasar está realizando
    un giro a la izquierda.
- id: 90
  category: safe_driving_rules
  question: En Massachusetts, ¿cuál es la multa mínima por una infracción de exceso
    de velocidad?
  choices:
    A: $50
    B: $75
    C: $105
    D: $150
  answer: C
  explanation: En Massachusetts, la multa mínima por exceso de velocidad es de $105.
    Esto cubre las primeras 10 mph por encima del límite (más un recargo de $5 para
    el Fondo Fiduciario de Servicios de Tratamiento de Lesiones en la Cabeza y un
    recargo de $50 para el Fondo General).
- id: 91
  category: safe_driving_rules
  question: ¿En Massachusetts, a cuántos pies de un hidrante de incendios es ilegal
    estacionarse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Massachusetts prohíbe estacionarse a menos de 10 pies de
    un hidrante de incendios.
- id: 92
  category: safe_driving_rules
  question: ¿La ley de Massachusetts requiere que encienda sus faros delanteros en
    cuál de las siguientes situaciones?
  choices:
    A: Siempre que use los limpiaparabrisas
    B: Solo entre la puesta del sol y el amanecer
    C: Solo cuando la visibilidad sea inferior a 100 pies
    D: Solo en autopistas
  answer: A
  explanation: La ley de Massachusetts exige que los conductores utilicen los faros
    delanteros y las luces traseras siempre que los limpiaparabrisas estén en uso.
    También deben usarse desde media hora después de la puesta del sol hasta media
    hora antes del amanecer.
- id: 93
  category: safe_driving_rules
  question: 'En Massachusetts, debe presentar un Informe de Operador por Accidente
    de Vehículo Motorizado si se ve involucrado en un accidente que resulte en muerte,
    lesiones personales o daños a la propiedad que superen los:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: B
  explanation: Se debe presentar un informe de accidente ante el RMV en un plazo de
    cinco días si alguna persona fallece o resulta herida, o si hay daños superiores
    a $1,000 en cualquier vehículo u otra propiedad.
- id: 94
  category: safe_driving_rules
  question: Al conducir de noche, ¿a cuántos pies de un vehículo que viene en dirección
    contraria debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: En Massachusetts, debe cambiar de luces altas a luces bajas cuando
    se encuentre a menos de 500 pies de un vehículo que viene en dirección contraria.
- id: 95
  category: safe_driving_rules
  question: Al estacionar en una vía pública en Massachusetts, ¿a cuántas pulgadas
    del bordillo (acera) como máximo debe estar su vehículo?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: La ley de Massachusetts exige que un vehículo estacionado no esté a
    más de 12 pulgadas del bordillo.
- id: 96
  category: safe_driving_rules
  question: ¿En Massachusetts, se prohíbe estacionar a menos de cuántos pies de una
    intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: La ley de Massachusetts prohíbe estacionarse a menos de 20 pies de
    una intersección.
- id: 97
  category: defensive_driving
  question: En Massachusetts, ¿a qué velocidad puede comenzar el hidroplaneo (cuando
    los neumáticos pierden contacto con la carretera sobre una capa de agua)?
  choices:
    A: Tan baja como 35 mph
    B: Solo por encima de 55 mph
    C: A cualquier velocidad superior a 20 mph
    D: Solo al frenar a 50 mph
  answer: A
  explanation: Según el Manual del Conductor de Massachusetts, el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph. En una lluvia intensa, los neumáticos
    pueden perder todo contacto con la carretera a 50 mph.
- id: 98
  category: defensive_driving
  question: Al seguir a otro vehículo de noche en Massachusetts, ¿a cuántos pies del
    vehículo de adelante debe cambiar a luces bajas?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Debe bajar las luces altas cuando siga a otro vehículo a menos de 200
    pies para no causar deslumbramiento en su espejo retrovisor.
- id: 99
  category: defensive_driving
  question: ¿Qué regla recomienda el Manual del Conductor de Massachusetts para mantener
    una distancia de seguimiento segura en condiciones normales?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los tres segundos
    D: La regla de los cinco segundos
  answer: C
  explanation: El RMV recomienda una distancia de seguimiento mínima de tres segundos
    detrás del vehículo que tiene delante en condiciones normales de clima y tráfico.
- id: 100
  category: defensive_driving
  question: Para observar la carretera eficazmente en busca de peligros, ¿qué tan
    adelante sugiere mirar el Manual del Conductor de Massachusetts?
  choices:
    A: 5 segundos adelante
    B: De 10 a 15 segundos adelante
    C: De 20 a 30 segundos adelante
    D: Solo al vehículo que está directamente delante de usted
  answer: B
  explanation: La conducción defensiva requiere mirar de 10 a 15 segundos por delante
    de su vehículo para identificar posibles peligros antes de llegar a ellos.
- id: 101
  category: defensive_driving
  question: En Massachusetts, si conduce por una autopista, debe señalizar su intención
    de girar o cambiar de carril al menos ____ antes de hacerlo.
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: En una autopista, debe señalizar al menos 500 pies antes de un giro
    o cambio de carril. En calles urbanas o residenciales, el requisito es de 100
    pies.
- id: 102
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza en Massachusetts,
    ¿cuál es la técnica correcta de conducción defensiva para recuperar el control?
  choices:
    A: Frenar bruscamente y girar en dirección opuesta al derrape
    B: Girar el volante en la dirección en la que se desliza la parte trasera del
      automóvil
    C: Poner el vehículo en punto muerto (neutral) y cerrar los ojos
    D: Acelerar rápidamente para salir del derrape
  answer: B
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del vehículo.
- id: 103
  category: defensive_driving
  question: ¿Qué establece la 'Ley de Velocidad Fundamental' (Fundamental Speed Law)
    de Massachusetts?
  choices:
    A: Siempre debe conducir al límite de velocidad indicado
    B: Nunca debe conducir más rápido de lo que sea razonable y adecuado para las
      condiciones actuales
    C: Debe conducir al menos a 40 mph en todas las autopistas estatales
    D: Los límites de velocidad no se aplican durante situaciones de emergencia
  answer: B
  explanation: La Ley de Velocidad Fundamental le exige ajustar su velocidad en función
    del tráfico, las condiciones de la carretera, el clima y la visibilidad, incluso
    si eso significa conducir por debajo del límite indicado.
- id: 104
  category: defensive_driving
  question: Al conducir con niebla densa en Massachusetts, ¿qué ajuste de los faros
    delanteros debe utilizar?
  choices:
    A: Luces altas para ver más lejos
    B: Luces bajas para reducir el deslumbramiento
    C: Solo las luces de estacionamiento
    D: Ninguna luz, ya que se reflejan en la niebla
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla. Las luces altas
    se reflejan en las gotas de agua de la niebla, lo que provoca deslumbramiento
    y dificulta la visión.
- id: 105
  category: defensive_driving
  question: 'En Massachusetts, los faros delanteros de su vehículo deben estar encendidos
    desde:'
  choices:
    A: El atardecer hasta el amanecer
    B: Una hora después del atardecer hasta una hora antes del amanecer
    C: Media hora después del atardecer hasta media hora antes del amanecer
    D: De 8:00 PM a 6:00 AM
  answer: C
  explanation: La ley de Massachusetts exige que los faros estén encendidos desde
    media hora después del atardecer hasta media hora antes del amanecer.
- id: 106
  category: defensive_driving
  question: Según el Manual del Conductor de Massachusetts, ¿cuándo es obligatorio
    encender los faros delanteros?
  choices:
    A: Solo desde el atardecer hasta el amanecer
    B: Desde media hora después del atardecer hasta media hora antes del amanecer
    C: Solo cuando la visibilidad es inferior a 100 pies
    D: Desde una hora después del atardecer hasta una hora antes del amanecer
  answer: B
  explanation: En Massachusetts, debe encender los faros desde media hora después
    del atardecer hasta media hora antes del amanecer, y siempre que utilice los limpiaparabrisas.
- id: 107
  category: defensive_driving
  question: 'Para mantener una distancia de seguimiento segura en condiciones normales
    de conducción en Massachusetts, debe utilizar la:'
  choices:
    A: Regla de un segundo
    B: Regla de dos segundos
    C: Regla de tres segundos
    D: Regla de cinco segundos
  answer: C
  explanation: El Manual del Conductor de Massachusetts recomienda la 'regla de los
    tres segundos' como distancia mínima de seguimiento en condiciones normales para
    permitir suficiente tiempo para reaccionar ante peligros.
- id: 108
  category: defensive_driving
  question: 'En Massachusetts, debe atenuar las luces altas cuando siga a otro vehículo
    por detrás a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Debe cambiar a luces bajas cuando siga a otro vehículo a menos de 200
    pies para que sus luces no se reflejen en el espejo retrovisor del otro conductor.
- id: 109
  category: defensive_driving
  question: Para ser un conductor defensivo en Massachusetts, ¿con cuánta antelación
    debe observar la carretera en busca de posibles peligros?
  choices:
    A: 5 a 10 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: Al menos una milla
  answer: B
  explanation: El manual del RMV sugiere observar la carretera de 10 a 15 segundos
    por delante de su vehículo para anticipar problemas antes de que ocurran.
- id: 110
  category: defensive_driving
  question: 'En Massachusetts, no limpiar la nieve o el hielo de su vehículo antes
    de conducir puede resultar en una multa por:'
  choices:
    A: Equipo inadecuado
    B: Carga no asegurada u operación negligente
    C: Obstrucción del tráfico
    D: No existe una multa específica por nieve en un vehículo
  answer: B
  explanation: Conducir con nieve o hielo en su vehículo es peligroso. Puede ser citado
    por carga no asegurada u operación negligente si la nieve o el hielo se caen y
    causan un peligro o bloquean su visión.
- id: 111
  category: defensive_driving
  question: ¿Cuál es la distancia mínima que debe mantener entre su vehículo y el
    ciclista al rebasar una bicicleta en Massachusetts?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: A partir de 2023, la ley de Massachusetts exige que los conductores
    mantengan al menos 4 pies de distancia al rebasar a 'usuarios vulnerables', incluidos
    los ciclistas.
- id: 112
  category: defensive_driving
  question: En Massachusetts, si lo sorprenden conduciendo a 15 mph por encima del
    límite de velocidad en una zona de 65 mph, ¿cuál es la multa total por una primera
    infracción?
  choices:
    A: $105
    B: $150
    C: $155
    D: $200
  answer: C
  explanation: La multa mínima por exceso de velocidad es de $105. Por cada mph por
    encima de las primeras 10 mph, se le cobrarán $10 adicionales. (15 mph por encima
    = $105 + 5 * $10 = $155).
- id: 113
  category: defensive_driving
  question: 'En Massachusetts, debe detenerse ante un autobús escolar con luces rojas
    intermitentes y un brazo de parada extendido, a menos que:'
  choices:
    A: Usted se encuentre en el lado opuesto de una autopista dividida con una barrera
      física
    B: Usted tenga prisa y no se vean niños
    C: El autobús esté detenido en un cruce de ferrocarril
    D: Usted esté conduciendo un vehículo comercial
  answer: A
  explanation: Debe detenerse ante un autobús escolar en cualquier carretera no dividida.
    Solo no tiene que detenerse si viaja por el lado opuesto de una autopista dividida
    separada por una barrera física, como una mediana.
- id: 114
  category: defensive_driving
  question: ¿Cuál es la regla con respecto a los cortejos fúnebres en Massachusetts?
  choices:
    A: No tienen un derecho de paso especial
    B: Puede atravesar el cortejo si hay un espacio
    C: Los cortejos tienen el derecho de paso en las intersecciones, independientemente
      de las señales de tráfico
    D: Debe hacerse a la derecha y detenerse hasta que pase todo el cortejo
  answer: C
  explanation: En Massachusetts, los vehículos en un cortejo fúnebre tienen el derecho
    de paso en las intersecciones. Otros conductores no deben conducir entre los vehículos
    del cortejo ni interferir con ellos.
- id: 115
  category: defensive_driving
  question: En Massachusetts, es ilegal seguir a menos de ____ pies de distancia a
    un vehículo de emergencia que responda a una alarma.
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: De acuerdo con la Ley General de Massachusetts, no puede seguir a menos
    de 300 pies de distancia a un vehículo de emergencia que tenga sus luces intermitentes
    o sirenas encendidas.
- id: 116
  category: alcohol_drugs_health
  question: ¿Qué significa la 'Ley de Consentimiento Implícito' (Implied Consent Law)
    de Massachusetts para los conductores?
  choices:
    A: Usted acepta que su vehículo sea registrado en cualquier momento.
    B: Al conducir, usted acepta someterse a una prueba de alcoholemia o de sangre
      si la policía lo solicita.
    C: Usted acepta portar un seguro de responsabilidad civil mínimo.
    D: Usted acepta permitir que los pasajeros consuman alcohol en su vehículo.
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que, al operar un vehículo
    motorizado en Massachusetts, usted ha dado su consentimiento para una prueba química
    (aliento o sangre) para determinar su contenido de alcohol en sangre (BAC) si
    se sospecha de OUI (conducir bajo la influencia).
- id: 117
  category: alcohol_drugs_health
  question: En Massachusetts, ¿en qué número de infracción por OUI se requiere que
    un conductor instale un Dispositivo de Bloqueo de Encendido (IID) en su vehículo?
  choices:
    A: Primera infracción
    B: Segunda y posteriores infracciones
    C: Solo en la tercera infracción
    D: Solo si el BAC era superior al 0.20%
  answer: B
  explanation: Bajo la Ley de Melanie (Melanie's Law), cualquier conductor con dos
    o más condenas por OUI que sea elegible para una licencia por dificultades económicas
    o para la reinstalación de la licencia debe tener instalado un Dispositivo de
    Bloqueo de Encendido (IID).
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál es la multa máxima para una persona condenada por comprar alcohol
    para un menor en Massachusetts?
  choices:
    A: $500
    B: $1,000
    C: $2,000
    D: $5,000
  answer: C
  explanation: Comprar alcohol para una persona menor de 21 años es un delito penal
    en Massachusetts, punible con una multa de hasta $2,000 y/o hasta un año de cárcel.
- id: 119
  category: alcohol_drugs_health
  question: Cuando el alcohol se combina con otras drogas, como antidepresivos o medicamentos
    para el resfriado, ¿cuál es el efecto probable en la capacidad de conducción?
  choices:
    A: Los efectos de las drogas se anulan.
    B: Los efectos del alcohol se reducen.
    C: Los efectos se multiplican (efecto sinérgico).
    D: No hay cambios en la capacidad de conducción.
  answer: C
  explanation: Combinar alcohol con otras drogas puede causar un efecto sinérgico,
    donde el impacto en el sistema nervioso central es mucho mayor que la suma de
    los efectos individuales.
- id: 120
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de reducir su contenido de alcohol
    en sangre (BAC) antes de conducir?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Esperar a que pase el tiempo
  answer: D
  explanation: Solo el tiempo puede reducir el BAC. El cuerpo procesa el alcohol a
    un ritmo constante (aproximadamente una bebida por hora), y los estimulantes como
    el café no aceleran este proceso.
- id: 121
  category: alcohol_drugs_health
  question: ¿Qué afirmación es verdadera con respecto al uso de marihuana y la conducción
    en Massachusetts?
  choices:
    A: Es legal conducir bajo los efectos de la marihuana si tiene una tarjeta de
      marihuana medicinal.
    B: Es ilegal operar un vehículo motorizado mientras se está bajo la influencia
      de la marihuana.
    C: La marihuana no afecta el tiempo de reacción ni la coordinación.
    D: Los conductores pueden fumar marihuana mientras conducen siempre que sean mayores
      de 21 años.
  answer: B
  explanation: En Massachusetts, es ilegal operar un vehículo motorizado mientras
    se está incapacitado por el consumo de marihuana, independientemente de si se
    utilizó con fines medicinales o recreativos.
- id: 122
  category: alcohol_drugs_health
  question: Si tiene una condición médica que pueda afectar su capacidad para conducir
    de manera segura, ¿cuál es su responsabilidad en Massachusetts?
  choices:
    A: No necesita hacer nada a menos que tenga un accidente.
    B: Debe informar la condición a la División de Asuntos Médicos del RMV.
    C: Solo necesita informar a su compañía de seguros.
    D: Debe dejar de conducir inmediatamente y entregar su licencia de forma permanente.
  answer: B
  explanation: Los conductores están legalmente obligados a informar cualquier condición
    física o mental que pueda afectar su capacidad para conducir a la División de
    Asuntos Médicos del RMV.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción para una persona menor de 21 años condenada por transportar
    alcohol en un vehículo (sin la presencia de un padre)?
  choices:
    A: Solo una multa de $50
    B: Suspensión de la licencia de 90 días a un año
    C: 30 días obligatorios de cárcel
    D: No hay sanción si el recipiente está sellado
  answer: B
  explanation: Una persona menor de 21 años que transporte alcohol (a menos que esté
    acompañada por un padre o tutor) se enfrenta a una suspensión de la licencia de
    90 días a un año.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores afecta el Contenido de Alcohol en la
    Sangre (BAC) de una persona?
  choices:
    A: El peso corporal
    B: La cantidad de comida ingerida antes de beber
    C: El tiempo transcurrido bebiendo
    D: Todas las anteriores
  answer: D
  explanation: El BAC se determina por el peso corporal, la cantidad de alcohol consumido,
    la cantidad de comida en el estómago y el tiempo transcurrido desde que se comenzó
    a beber.
- id: 125
  category: alcohol_drugs_health
  question: Bajo la ley de 'Consentimiento Implícito' de Massachusetts, al conducir
    en una vía pública, ¿usted ha aceptado cuál de las siguientes opciones?
  choices:
    A: Permitir el registro de su vehículo en cualquier momento
    B: Someterse a un alcoholímetro o prueba de sangre si lo solicita la policía
    C: Contar con al menos $50,000 en seguro por daños a la propiedad
    D: Ceder siempre el paso a los peatones independientemente del semáforo
  answer: B
  explanation: La ley de Consentimiento Implícito significa que cuando usted conduce
    en Massachusetts, acepta someterse a una prueba de aliento o de sangre si un oficial
    de policía sospecha que está conduciendo bajo la influencia.
- id: 126
  category: alcohol_drugs_health
  question: Con respecto al uso de marihuana, ¿cuál de las siguientes afirmaciones
    es verdadera para los conductores en Massachusetts?
  choices:
    A: Es legal fumar marihuana mientras se conduce siempre que no esté incapacitado
    B: La marihuana debe guardarse en un recipiente sellado o en una guantera o maletero
      cerrados con llave
    C: Se permiten recipientes abiertos de marihuana en el asiento trasero
    D: Los conductores están exentos de las leyes de OUI si tienen una tarjeta de
      marihuana medicinal
  answer: B
  explanation: Al igual que el alcohol, la marihuana debe guardarse en un recipiente
    sellado o mantenerse en una guantera o maletero cerrados con llave. Es ilegal
    conducir bajo la influencia de la marihuana.
- id: 127
  category: alcohol_drugs_health
  question: Bajo la 'Ley de Melanie' (Melanie's Law), ¿qué dispositivo debe tener
    instalado en su vehículo un conductor con dos o más condenas por OUI?
  choices:
    A: Un dispositivo de rastreo GPS
    B: Un Dispositivo de Bloqueo de Encendido (IID)
    C: Un regulador automático de velocidad
    D: Una cámara de tablero
  answer: B
  explanation: La Ley de Melanie exige que cualquier conductor con dos o más condenas
    por OUI instale un Dispositivo de Bloqueo de Encendido (IID) en su vehículo para
    evitar que arranque si se detecta alcohol.
- id: 128
  category: alcohol_drugs_health
  question: 'En Massachusetts, si es menor de 21 años y es condenado por comprar o
    intentar comprar alcohol, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Incluso si no está conduciendo, una condena por comprar o intentar
    comprar alcohol siendo menor de 21 años resulta en una suspensión de la licencia
    de 180 días.
- id: 129
  category: alcohol_drugs_health
  question: ¿Qué es el 'efecto sinérgico' en el contexto de la seguridad vial?
  choices:
    A: El efecto de mezclar dos tipos diferentes de gasolina
    B: El aumento del deterioro causado por mezclar alcohol y drogas
    C: El beneficio de beber café después de consumir alcohol
    D: La mejora del tiempo de reacción por las bebidas energéticas
  answer: B
  explanation: El efecto sinérgico ocurre cuando se combinan alcohol y drogas, creando
    un nivel de deterioro mucho mayor que el que causaría cualquiera de las sustancias
    por sí sola.
- id: 130
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados, ¿quién es responsable de garantizar
    que sea seguro para usted conducir?
  choices:
    A: El farmacéutico que despachó la receta
    B: El médico que escribió la receta
    C: El oficial de policía que lo detiene
    D: Usted, el conductor
  answer: D
  explanation: Es responsabilidad del conductor conocer los efectos secundarios de
    cualquier medicamento que esté tomando y asegurarse de que está en condiciones
    de operar un vehículo de manera segura.
- id: 131
  category: alcohol_drugs_health
  question: ¿Según la ley de Massachusetts, cuál de los siguientes puede utilizarse
    como prueba de deterioro por conducir bajo la influencia (OUI) además de un alcoholímetro?
  choices:
    A: Pruebas de sobriedad en el campo y observaciones del oficial
    B: La edad y el género del conductor
    C: El tipo de vehículo que se conduce
    D: La hora del día en que ocurrió la detención
  answer: A
  explanation: Los oficiales de policía utilizan pruebas de sobriedad en el campo
    (como caminar en línea recta) y observaciones del comportamiento (habla arrastrada,
    olor a alcohol) como evidencia de deterioro.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes factores afecta la forma en que su cuerpo procesa
    el alcohol y su nivel de concentración de alcohol en sangre (BAC) resultante?
  choices:
    A: Su peso corporal
    B: La cantidad de comida en su estómago
    C: Qué tan rápido consumió el alcohol
    D: Todas las anteriores
  answer: D
  explanation: El BAC se ve influenciado por el peso corporal, la cantidad de comida
    ingerida, la velocidad de consumo y la cantidad de bebidas consumidas.
- id: 133
  category: alcohol_drugs_health
  question: ¿Cuál es la única manera de reducir su nivel de concentración de alcohol
    en sangre (BAC) y "recuperar la sobriedad"?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Permitir que pase el tiempo para que su cuerpo procese el alcohol
    D: Hacer ejercicio vigorosamente
  answer: C
  explanation: Solo el tiempo puede reducir el BAC. El café, las duchas frías y el
    ejercicio no aceleran el proceso del hígado para metabolizar el alcohol.
- id: 134
  category: penalties_and_points
  question: En Massachusetts, ¿cuál es la multa mínima por exceso de velocidad, incluyendo
    el recargo de $50 para el Fondo Fiduciario de Servicios de Tratamiento de Lesiones
    en la Cabeza?
  choices:
    A: $50
    B: $75
    C: $105
    D: $150
  answer: C
  explanation: Según el Manual del Conductor de Massachusetts, la sanción más baja
    por conducir por encima del límite de velocidad es una multa de $105. Esto incluye
    un recargo de $50 para el Fondo Fiduciario de Servicios de Tratamiento de Lesiones
    en la Cabeza.
- id: 135
  category: penalties_and_points
  question: Si es condenado por conducir a 16 mph por encima del límite de velocidad
    en Massachusetts, ¿cuál es la multa total que se le exigirá pagar?
  choices:
    A: $105
    B: $165
    C: $160
    D: $210
  answer: B
  explanation: 'La multa es de $105 por las primeras 10 mph por encima del límite,
    más $10 por cada mph adicional. Para 16 mph por encima: $105 + (6 mph x $10) =
    $165.'
- id: 136
  category: penalties_and_points
  question: Según la Ley de Manos Libres de Massachusetts, ¿cuál es la multa por una
    primera infracción para un conductor de 18 años o más?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Para conductores de 18 años o más, la primera infracción por usar un
    dispositivo electrónico móvil que no sea de manos libres es una multa de $100.
- id: 137
  category: penalties_and_points
  question: ¿Cuál es la tarifa estándar de reinstalación de la licencia para la mayoría
    de las suspensiones generales (que no sean por OUI o JOL) en Massachusetts?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Aunque las tarifas varían para infracciones graves específicas, la
    tarifa estándar de reinstalación para muchas suspensiones generales de licencia
    en Massachusetts es de $100.
- id: 138
  category: penalties_and_points
  question: En Massachusetts, ¿cuántos puntos se agregan a su historial de manejo
    por una infracción de tránsito mayor, como conducir bajo la influencia (OUI)?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 5 puntos
    D: 7 puntos
  answer: C
  explanation: Las infracciones de tránsito mayores, incluyendo OUI y abandonar la
    escena de un accidente, resultan en la adición de 5 puntos a su historial de manejo.
- id: 139
  category: penalties_and_points
  question: Si es condenado por conducir a 75 mph en una zona de 55 mph en Massachusetts,
    ¿cuál es la multa total (incluyendo el recargo de seguridad pública de $5)?
  choices:
    A: $105
    B: $155
    C: $205
    D: $255
  answer: C
  explanation: La multa mínima por exceso de velocidad es de $105 (por 1-10 mph por
    encima). Por cada mph por encima de las primeras 10, se le cobra un adicional
    de $10. Conducir a 20 mph por encima resulta en $105 + (10 x $10) = $205.
- id: 140
  category: penalties_and_points
  question: Si un Operador Junior (JOL) es condenado por una segunda infracción por
    exceso de velocidad, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: Indefinidamente
  answer: C
  explanation: Mientras que una primera infracción por exceso de velocidad para un
    JOL resulta en una suspensión de 90 días, una segunda o posterior infracción resulta
    en una suspensión de la licencia por un año.
- id: 141
  category: penalties_and_points
  question: ¿Cuántos puntos SDIP se asignan por un accidente "con culpa" (at-fault)
    en el que la compañía de seguros paga más de $2,000 por daños a la propiedad?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: Un accidente grave con culpa (reclamación de más de $2,000) resulta
    en 4 puntos SDIP. Un accidente leve con culpa (reclamación de entre $1,000 y $2,000)
    resulta en 3 puntos.
- id: 142
  category: penalties_and_points
  question: Un Operador Junior (JOL) que viole la restricción de conducción nocturna
    por primera vez, ¿por cuántos días se le suspenderá la licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Una primera infracción de la restricción nocturna de JOL (12:30 a.m.
    a 5:00 a.m.) resulta en una suspensión de la licencia de 60 días.
- id: 143
  category: penalties_and_points
  question: Según la Ley de Melanie (Melanie's Law), si es declarado culpable de una
    segunda o posterior infracción por conducir bajo la influencia (OUI), ¿qué dispositivo
    debe tener instalado en su vehículo para recuperar su licencia?
  choices:
    A: Un rastreador GPS
    B: Un dispositivo de bloqueo de encendido (IID)
    C: Un regulador de velocidad electrónico
    D: Una cámara de tablero
  answer: B
  explanation: La Ley de Melanie exige que cualquier conductor con dos o más condenas
    por OUI tenga instalado un dispositivo de bloqueo de encendido (IID) en su vehículo
    como condición para el restablecimiento de la licencia.
- id: 144
  category: penalties_and_points
  question: 'Si acumula siete eventos con recargo (surchargeable events) en su historial
    de conducción de Massachusetts dentro de un período de tres años, su licencia
    será suspendida automáticamente por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: B
  explanation: El RMV suspenderá automáticamente su licencia por 60 días si acumula
    siete eventos con recargo (infracciones de tránsito o accidentes con culpa) dentro
    de un período de tres años.
- id: 145
  category: sharing_the_road
  question: De acuerdo con la ley de "Usuarios Vulnerables de la Vía" de Massachusetts,
    ¿cuál es la distancia mínima de seguridad que un automovilista debe mantener al
    rebasar a una bicicleta o a un peatón?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: A partir de 2023, la ley de Massachusetts exige que los automovilistas
    mantengan una "distancia de paso segura" de al menos 4 pies al rebasar a usuarios
    vulnerables de la vía, incluidos ciclistas y peatones.
- id: 146
  category: sharing_the_road
  question: 'Al acercarse a un vehículo de emergencia estacionado con luces intermitentes
    en una carretera con al menos dos carriles en su dirección, la "Ley de Moverse
    a un Lado" (Move Over Law) de Massachusetts le exige:'
  choices:
    A: Mantener la velocidad pero moverse al carril izquierdo
    B: Detenerse por completo hasta que se le indique pasar
    C: Reducir la velocidad y, si es seguro hacerlo, dejar el carril adyacente al
      vehículo de emergencia
    D: Aumentar la velocidad para rebasar el vehículo lo más rápido posible
  answer: C
  explanation: La Ley de Moverse a un Lado de Massachusetts exige que los conductores
    reduzcan la velocidad y, si es seguro y posible, se muevan a un carril que no
    esté adyacente al vehículo de emergencia o de mantenimiento estacionado.
- id: 147
  category: sharing_the_road
  question: En Massachusetts, debe detenerse ante un peatón en un cruce peatonal si
    se encuentra a cuántos pies del carril por el que usted circula?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La ley de Massachusetts exige que los automovilistas cedan el paso
    a un peatón en un cruce peatonal si el peatón se encuentra en la mitad de la vía
    por la que circula el vehículo o a menos de 10 pies de esa mitad de la vía.
- id: 148
  category: sharing_the_road
  question: Al seguir a un camión grande, ¿cómo puede asegurarse de no estar en la
    "Zona Prohibida" (No-Zone o punto ciego) del conductor?
  choices:
    A: Si puede ver los espejos laterales del camión, el conductor puede verlo a usted
    B: Si está al menos a 10 pies detrás del camión
    C: Si hace parpadear sus luces altas
    D: Si se mantiene en el carril del extremo derecho del camión
  answer: A
  explanation: 'Una regla general para compartir la carretera con camiones es: "Si
    no puede ver la cara del conductor en su espejo retrovisor lateral, él no puede
    verlo a usted". Estas áreas se conocen como Zonas Prohibidas (No-Zones).'
- id: 149
  category: sharing_the_road
  question: En Massachusetts, ¿cuál es la multa máxima por "dooring" (abrir la puerta
    de un vehículo en la trayectoria de un ciclista u otro tráfico)?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Según MGL c.90 §14, abrir una puerta en la trayectoria de un ciclista
    u otro tráfico (dooring) es una infracción civil sancionable con una multa de
    hasta $100.
- id: 150
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene en el lado opuesto de una carretera
    dividida con una barrera física (como una mediana), ¿es necesario detenerse?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no es necesario detenerse si hay una barrera física
    C: Sí, pero solo si el conductor del autobús le indica que se detenga
    D: No, pero debe reducir la velocidad a 5 mph
  answer: B
  explanation: En Massachusetts, no es necesario detenerse ante un autobús escolar
    con luces rojas intermitentes si se encuentra en el lado opuesto de una carretera
    dividida que está separada por una barrera física o mediana.
- id: 151
  category: sharing_the_road
  question: 'Si ve a un peatón usando un bastón blanco o un perro guía en una intersección,
    usted debe:'
  choices:
    A: Tocar la bocina para hacerles saber que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo y permanecer detenido hasta que el peatón haya cruzado
      de manera segura
    D: Conducir alrededor de ellos si hay suficiente espacio
  answer: C
  explanation: La ley de Massachusetts exige que los conductores se detengan por completo
    ante un peatón ciego que use un perro guía o lleve un bastón blanco (con o sin
    punta roja) y permanezcan detenidos hasta que hayan cruzado todo el camino.
- id: 152
  category: sharing_the_road
  question: ¿A cuántos pies de distancia debe mantenerse detrás de un camión de bomberos
    u otro vehículo de emergencia que esté respondiendo a una alarma en Massachusetts?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: De acuerdo con la ley de Massachusetts, es ilegal seguir a menos de
    300 pies a un camión de bomberos u otro vehículo de emergencia que responda a
    una alarma.
- id: 153
  category: sharing_the_road
  question: ¿Cuándo puede un ciclista circular legalmente por una acera en Massachusetts?
  choices:
    A: En cualquier lugar, en cualquier momento
    B: Solo si son menores de 12 años
    C: En todas partes, excepto en distritos comerciales donde esté prohibido por
      ordenanza local
    D: Nunca; las bicicletas están estrictamente prohibidas en las aceras
  answer: C
  explanation: La ley de Massachusetts permite que las bicicletas circulen por las
    aceras fuera de los distritos comerciales, a menos que las ordenanzas locales
    lo prohíban específicamente. Los ciclistas deben ceder el paso a los peatones
    en las aceras.
- id: 154
  category: sharing_the_road
  question: 'Un emblema de "Vehículo de movimiento lento" (un triángulo naranja con
    borde rojo) debe mostrarse en la parte trasera de los vehículos diseñados para
    viajar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema de Vehículo de Movimiento Lento es obligatorio en la parte
    trasera de todos los vehículos diseñados para viajar a velocidades de 25 mph o
    menos, como maquinaria agrícola o carruajes tirados por caballos.
- id: 155
  category: sharing_the_road
  question: En Massachusetts, ¿cuándo se requiere que los ciclistas usen un faro delantero
    blanco y una luz trasera roja o reflector?
  choices:
    A: Solo cuando circulan por autopistas
    B: Solo durante la lluvia o la niebla
    C: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    D: En todo momento mientras circulan
  answer: C
  explanation: La ley de Massachusetts exige que los ciclistas usen una luz blanca
    en la parte delantera y una luz roja o reflector en la parte trasera cuando circulen
    desde media hora después de la puesta del sol hasta media hora antes de la salida
    del sol.
- id: 156
  category: sharing_the_road
  question: 'Si está conduciendo y se encuentra con un vehículo tirado por caballos
    o una persona montando a caballo, usted debe:'
  choices:
    A: Tocar la bocina para advertirles que va a pasar
    B: Acelerar para pasarlos rápidamente
    C: Reducir la velocidad y detenerse si el caballo parece asustado
    D: Encender las luces altas para aumentar la visibilidad
  answer: C
  explanation: Según la ley de Massachusetts, los conductores deben tener precaución
    al acercarse a los caballos. Debe reducir la velocidad y, si el caballo parece
    asustado o el jinete hace una señal, debe detener su vehículo hasta que el caballo
    pase.
- id: 157
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera sobre el derecho de
    los ciclistas a usar la carretera en Massachusetts?
  choices:
    A: Siempre deben circular por el arcén (hombro)
    B: Pueden circular de a dos (uno al lado del otro) pero no deben impedir el flujo
      del tráfico
    C: Están obligados a usar un carril para bicicletas si hay uno disponible
    D: Deben circular en sentido contrario al tráfico para una mejor visibilidad
  answer: B
  explanation: En Massachusetts, los ciclistas tienen derecho a circular de a dos
    (uno al lado del otro) siempre que no impidan el movimiento normal y razonable
    del tráfico.
- id: 158
  category: sharing_the_road
  question: Bajo la "Ley de Moverse a un Lado" (Move Over Law) de Massachusetts, ¿qué
    debe hacer un conductor al acercarse a un vehículo de emergencia estacionado con
    luces intermitentes en una autopista de al menos tres carriles?
  choices:
    A: Detenerse por completo hasta que se le indique que puede avanzar
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Moverse a un carril no adyacente si es seguro hacerlo, o reducir la velocidad
    D: Acelerar para pasar el área lo más rápido posible
  answer: C
  explanation: La Ley de Moverse a un Lado de Massachusetts (MGL c.89 § 7C) exige
    que los conductores se muevan a un carril que no esté al lado del vehículo de
    emergencia si es seguro hacerlo. Si no es posible cambiar de carril, el conductor
    debe reducir la velocidad a un ritmo razonable y adecuado.
- id: 159
  category: sharing_the_road
  question: 'En Massachusetts, es ilegal cortarle el paso a un ciclista girando a
    la derecha inmediatamente después de pasarlo. Esto se conoce comúnmente como:'
  choices:
    A: Gancho a la derecha (Right hook)
    B: Lado ciego (Blind side)
    C: Choque en T (T-bone)
    D: Puertazo (Dooring)
  answer: A
  explanation: Un "gancho a la derecha" (right hook) ocurre cuando un automovilista
    rebasa a un ciclista y luego gira inmediatamente a la derecha en la trayectoria
    del ciclista. La ley de Massachusetts prohíbe específicamente esta maniobra para
    proteger a los usuarios vulnerables de la vía.
- id: 160
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio que un automovilista se detenga ante un autobús
    escolar con luces rojas intermitentes en Massachusetts?
  choices:
    A: Cuando el autobús está en el lado opuesto de una autopista dividida con una
      mediana o barrera
    B: Cuando el conductor tiene prisa y no se ven niños
    C: Cuando el autobús está detenido en el estacionamiento de una escuela
    D: Un automovilista siempre debe detenerse ante un autobús escolar con luces rojas
      intermitentes, independientemente del tipo de carretera
  answer: A
  explanation: De acuerdo con el Manual del Conductor de Massachusetts, no es necesario
    detenerse ante un autobús escolar con luces rojas intermitentes si este se encuentra
    al otro lado de una autopista dividida separada por una barrera física o una franja
    de mediana.
- id: 161
  category: sharing_the_road
  question: ¿En Massachusetts, cuál es la distancia mínima que debe mantener al seguir
    a un vehículo de emergencia que responde a una alarma?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: La ley de Massachusetts (MGL c.89 § 7A) prohíbe a los conductores seguir
    a menos de 300 pies a un vehículo de emergencia (camión de bomberos, policía,
    ambulancia) que esté respondiendo a una alarma.
- id: 162
  category: sharing_the_road
  question: Al andar en bicicleta de noche en Massachusetts, la bicicleta debe estar
    equipada con una luz delantera visible desde al menos ____ pies y una luz roja
    trasera o reflector visible desde al menos ____ pies.
  choices:
    A: 100; 200
    B: 500; 600
    C: 200; 300
    D: 1,000; 1,000
  answer: B
  explanation: La ley de Massachusetts (MGL c.85 § 11B) exige que para circular de
    noche, una bicicleta debe tener una luz delantera blanca visible desde 500 pies
    y una luz roja trasera o reflector visible desde 600 pies.
- id: 163
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al acercarse a un peatón con un bastón blanco
    o un perro guía en Massachusetts?
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Reducir la velocidad y proceder con precaución si no están en la carretera
    C: Detenerse por completo
    D: Solo detenerse si el peatón está en un cruce de peatones marcado
  answer: C
  explanation: La ley de Massachusetts (MGL c.90 § 14A) exige que los automovilistas
    se detengan por completo al acercarse a un peatón que está cruzando o intentando
    cruzar una vía y que es guiado por un animal de servicio o utiliza un bastón blanco.
- id: 164
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el camión a menudo puede:'
  choices:
    A: Permanecer completamente en el carril derecho
    B: Abrirse hacia el carril izquierdo para completar el giro
    C: Detenerse y esperar a que todo el tráfico se despeje antes de girar
    D: Girar únicamente desde el carril izquierdo
  answer: B
  explanation: Debido a su longitud, los camiones grandes a menudo deben abrirse hacia
    la izquierda para no chocar con el bordillo al hacer un giro a la derecha. Los
    automovilistas nunca deben intentar meterse entre un camión que gira y el bordillo.
- id: 165
  category: sharing_the_road
  question: 'En Massachusetts, a los ciclistas generalmente se les permite circular
    por las aceras EXCEPTO:'
  choices:
    A: En zonas residenciales
    B: Dentro de un distrito comercial donde esté prohibido por ordenanza local
    C: Después de la puesta del sol
    D: Si son mayores de 16 años
  answer: B
  explanation: Según la ley MGL c.85 § 11B, los ciclistas pueden circular por las
    aceras fuera de los distritos comerciales, a menos que las leyes locales lo prohíban.
    Siempre deben ceder el paso a los peatones en las aceras.
- id: 166
  category: sharing_the_road
  question: Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, ¿cuál es el procedimiento correcto en Massachusetts?
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para salir del camino
    C: Orillarse a la derecha lo más posible y detenerse
    D: Orillarse a la mediana de la izquierda y detenerse
  answer: C
  explanation: La ley de Massachusetts exige que los conductores se dirijan al bordillo
    o borde derecho de la carretera, fuera de cualquier intersección, y se detengan
    hasta que el vehículo de emergencia haya pasado.
- id: 167
  category: sharing_the_road
  question: Según la ley de Massachusetts, ¿qué señal manual es aceptable para un
    ciclista que tiene la intención de girar a la derecha?
  choices:
    A: Brazo izquierdo extendido hacia arriba
    B: Brazo derecho extendido horizontalmente
    C: Ya sea la A o la B
    D: Brazo izquierdo extendido hacia abajo
  answer: C
  explanation: La ley de Massachusetts (MGL c.85 § 11B) permite a los ciclistas señalar
    un giro a la derecha extendiendo el brazo izquierdo hacia arriba o extendiendo
    el brazo derecho horizontalmente.
- id: 168
  category: vehicle_information
  question: Según la ley de Massachusetts, ¿cuándo debe encender los faros delanteros
    en relación con el uso de los limpiaparabrisas?
  choices:
    A: Solo durante aguaceros intensos
    B: Solo si también está oscuro afuera
    C: Siempre que use los limpiaparabrisas
    D: Solo en autopistas
  answer: C
  explanation: La ley de Massachusetts exige que encienda los faros delanteros y las
    luces traseras siempre que use los limpiaparabrisas, incluso durante el día.
- id: 169
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    en Massachusetts?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 2/32 de pulgada de profundidad
    de banda de rodadura en las ranuras adecuadas y no mostrar tela ni cordones para
    pasar la inspección de seguridad estatal.
- id: 170
  category: vehicle_information
  question: En Massachusetts, ¿cuál es el porcentaje máximo legal de tinte para las
    ventanas laterales y traseras (tinte de mercado secundario)?
  choices:
    A: 25% de transmisión de luz
    B: 30% de transmisión de luz
    C: 35% de transmisión de luz
    D: 50% de transmisión de luz
  answer: C
  explanation: La ley de Massachusetts prohíbe el tinte de ventanas de mercado secundario
    que reduzca la transmisión total de luz a menos del 35%.
- id: 171
  category: vehicle_information
  question: Si compra un vehículo en una venta privada, ¿dentro de cuántos días después
    del registro debe realizarle la inspección?
  choices:
    A: 3 días
    B: 7 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: En Massachusetts, debe realizar la inspección de su vehículo dentro
    de los siete días posteriores a su registro.
- id: 172
  category: vehicle_information
  question: ¿Qué significa una calcomanía 'R roja' (Red R) en un informe de inspección
    de vehículos de Massachusetts?
  choices:
    A: El vehículo falló únicamente la prueba de emisiones
    B: El vehículo falló la inspección de seguridad y no es seguro para conducir
    C: El vehículo está registrado como un auto clásico
    D: El vehículo pasó pero necesita reparaciones menores
  answer: B
  explanation: Una calcomanía 'R roja' indica una falla de seguridad. El vehículo
    se considera inseguro y no debe conducirse hasta que se reparen los defectos de
    seguridad.
- id: 173
  category: vehicle_information
  question: 'En Massachusetts, la bocina de su vehículo debe ser lo suficientemente
    fuerte como para ser escuchada desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los estándares de seguridad de Massachusetts requieren una bocina que
    pueda escucharse desde una distancia de 200 pies.
- id: 174
  category: vehicle_information
  question: 'La placa de matrícula trasera de su vehículo debe estar iluminada por
    una luz blanca para que sea visible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 60 pies
    D: 100 pies
  answer: C
  explanation: La ley de Massachusetts exige que la placa de registro trasera esté
    iluminada por una luz blanca para que los caracteres sean visibles desde una distancia
    de 60 pies.
- id: 175
  category: vehicle_information
  question: ¿Cuándo debe usar sus faros delanteros en Massachusetts, independientemente
    de las condiciones climáticas?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: Desde 1/2 hora después de la puesta del sol hasta 1/2 hora antes de la salida
      del sol
    C: Desde 1 hora después de la puesta del sol hasta 1 hora antes de la salida del
      sol
    D: Solo cuando la visibilidad es inferior a 100 pies
  answer: B
  explanation: La ley de Massachusetts exige que los faros delanteros estén encendidos
    desde media hora después de la puesta del sol hasta media hora antes de la salida
    del sol.
- id: 176
  category: vehicle_information
  question: En Massachusetts, ¿cuántas luces de freno deben funcionar en la parte
    trasera de un vehículo fabricado después de 1967?
  choices:
    A: Al menos una
    B: Al menos dos
    C: Al menos tres
    D: Ninguna, siempre que se utilicen señales manuales
  answer: B
  explanation: Los vehículos fabricados después de 1967 deben tener al menos dos luces
    de freno rojas funcionales en la parte trasera del vehículo.
- id: 177
  category: vehicle_information
  question: Si su vehículo no pasa una inspección de seguridad, recibirá una calcomanía
    'R roja'. Si falla solo por emisiones, ¿qué color de calcomanía recibirá?
  choices:
    A: Una calcomanía 'R negra' (Black R)
    B: Una calcomanía 'R amarilla' (Yellow R)
    C: Una calcomanía 'R verde' (Green R)
    D: Ninguna calcomanía
  answer: A
  explanation: Se emite una calcomanía 'R negra' si un vehículo falla la prueba de
    emisiones pero pasa la inspección de seguridad.
- id: 178
  category: vehicle_information
  question: En Massachusetts, ¿cuál es el nivel máximo legal de polarizado de ventanas
    permitido en las ventanas laterales a la izquierda y derecha del conductor?
  choices:
    A: 25% de transmisión de luz
    B: 35% de transmisión de luz
    C: 50% de transmisión de luz
    D: No se permite ningún tipo de polarizado
  answer: B
  explanation: La ley de Massachusetts (540 CMR 4.04) establece que el polarizado
    de ventanas instalado posteriormente debe permitir que al menos el 35% de la luz
    pase a través del vidrio.
- id: 179
  category: vehicle_information
  question: En Massachusetts, ¿debe cambiar de luces altas a luces bajas cuando sigue
    a otro vehículo por detrás a una distancia de cuántos pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: Debe bajar las luces altas cuando siga a otro vehículo a menos de 200
    pies para no cegar al conductor de adelante a través de sus espejos.
- id: 180
  category: vehicle_information
  question: Para pasar la inspección de seguridad de Massachusetts, su freno de pie
    debe ser capaz de detener el vehículo dentro de cuántos pies cuando viaja a 20
    mph?
  choices:
    A: 15 pies
    B: 30 pies
    C: 50 pies
    D: 80 pies
  answer: B
  explanation: El Manual del Conductor del RMV de Massachusetts establece que el freno
    de pie debe ser capaz de detener su vehículo dentro de 30 pies cuando circula
    a 20 mph.
- id: 181
  category: vehicle_information
  question: ¿Qué vehículos están generalmente exentos de la parte de emisiones de
    la inspección de vehículos de Massachusetts?
  choices:
    A: Vehículos con menos de 2 años de antigüedad
    B: Vehículos con más de 15 años de antigüedad
    C: Todos los vehículos diésel independientemente de su antigüedad
    D: Vehículos conducidos menos de 5,000 millas por año
  answer: B
  explanation: En Massachusetts, la mayoría de los vehículos de 15 años o más están
    exentos de las pruebas de emisiones, pero aún deben aprobar la inspección de seguridad
    anual.
- id: 182
  category: vehicle_information
  question: Según las regulaciones de equipamiento de Massachusetts, ¿la bocina de
    un vehículo motorizado debe ser audible desde una distancia de al menos cuántos
    pies?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Massachusetts exige que todo vehículo motorizado esté equipado
    con una bocina en buen estado de funcionamiento, capaz de emitir un sonido audible
    en condiciones normales desde una distancia no inferior a 200 pies.
- id: 183
  category: vehicle_information
  question: ¿Cuál es el requisito de Massachusetts para los espejos retrovisores en
    un vehículo de pasajeros?
  choices:
    A: Solo se requiere un espejo en el lado del conductor
    B: Solo se requiere un espejo central interior
    C: Se requiere al menos un espejo que proporcione una visión clara de la carretera
      hacia atrás
    D: Tres espejos (izquierdo, derecho y central) son obligatorios para todos los
      vehículos
  answer: C
  explanation: La ley de Massachusetts exige al menos un espejo que permita al conductor
    ver la carretera hacia atrás. Si la ventana trasera está obstruida, se requieren
    espejos laterales.
- id: 184
  category: vehicle_information
  question: ¿Cuál de las siguientes modificaciones del sistema de escape es ilegal
    en Massachusetts?
  choices:
    A: Reemplazar un silenciador con una pieza original (OEM) estándar
    B: Usar un recorte de silenciador (muffler cutout) o derivación (bypass)
    C: Instalar una punta de escape cromada
    D: Reemplazar un convertidor catalítico con una versión aprobada por el estado
  answer: B
  explanation: La ley de Massachusetts prohíbe el uso de un recorte de silenciador
    (muffler cutout), derivación (bypass) o dispositivo similar que impida que el
    silenciador funcione eficazmente o que aumente los niveles de ruido.
- id: 185
  category: vehicle_information
  question: Después de registrar un vehículo en Massachusetts, ¿cuántos días tiene
    para que el vehículo sea inspeccionado?
  choices:
    A: 3 días
    B: 7 días
    C: 10 días
    D: 30 días
  answer: B
  explanation: Cuando registra un vehículo en Massachusetts, tiene exactamente 7 días
    a partir de la fecha de registro para obtener una inspección estatal.
- id: 186
  category: vehicle_information
  question: ¿Dónde debe colocarse la calcomanía de inspección de Massachusetts en
    un vehículo con un parabrisas estándar?
  choices:
    A: En la esquina superior izquierda del parabrisas
    B: En la esquina inferior izquierda del parabrisas
    C: En la esquina inferior derecha del parabrisas
    D: En la esquina superior derecha del parabrisas
  answer: C
  explanation: En Massachusetts, la calcomanía de inspección debe colocarse en la
    esquina inferior derecha del parabrisas (lado del pasajero).
- id: 187
  category: signs_and_signals
  question: En Massachusetts, ¿qué significa una luz roja intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Lo mismo que una señal de pare (stop sign)
    C: Ceder el paso únicamente al tráfico que viene en sentido contrario
    D: La señal está averiada; trátela como una parada de cuatro vías
  answer: B
  explanation: Según el Manual del Conductor de Massachusetts, una luz roja intermitente
    significa lo mismo que una señal de pare. Debe detenerse por completo, obedecer
    las leyes de derecho de paso y proceder cuando sea seguro.
- id: 188
  category: signs_and_signals
  question: Cuando un semáforo muestra una luz amarilla fija, ¿cuál es la acción correcta
    para un conductor en Massachusetts?
  choices:
    A: Acelerar para despejar la intersección antes de la luz roja
    B: Detenerse inmediatamente, incluso si está en medio de la intersección
    C: Detenerse si es seguro hacerlo, ya que la luz está a punto de cambiar a rojo
    D: Continuar a través de la intersección a su velocidad actual independientemente
      de su ubicación
  answer: C
  explanation: Una luz amarilla fija indica que la señal está cambiando a rojo. La
    ley de Massachusetts exige que los conductores se detengan si es seguro hacerlo.
    Si ya se encuentra en la intersección, debe continuar con precaución.
- id: 189
  category: signs_and_signals
  question: ¿Cuál es la señal manual adecuada para indicar un giro a la derecha en
    Massachusetts?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: Para señalar un giro a la derecha utilizando señales manuales en Massachusetts,
    el conductor debe extender el brazo izquierdo por la ventana y doblarlo hacia
    arriba a la altura del codo.
- id: 190
  category: signs_and_signals
  question: En Massachusetts, ¿qué significa una señal de flecha roja fija?
  choices:
    A: Puede girar en la dirección de la flecha después de detenerse
    B: Debe detenerse y no puede girar en la dirección de la flecha
    C: Ceda el paso a los peatones, luego gire en la dirección de la flecha
    D: La flecha es solo una sugerencia para la ubicación del carril
  answer: B
  explanation: Una flecha roja fija significa que no puede realizar el movimiento
    indicado por la flecha. Debe detenerse y permanecer detenido hasta que aparezca
    una luz verde o una flecha verde.
- id: 191
  category: signs_and_signals
  question: ¿Qué indica una señal amarilla en forma de banderín en el lado izquierdo
    de la carretera?
  choices:
    A: Zona escolar más adelante
    B: Ceder el paso
    C: Zona de no rebasar (No Passing Zone)
    D: Cruce de ferrocarril
  answer: C
  explanation: Se coloca una señal amarilla en forma de banderín en el lado izquierdo
    de la carretera para marcar el inicio de una 'Zona de no rebasar' (No Passing
    Zone).
- id: 192
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas continuas dobles pintadas en el pavimento
    en Massachusetts?
  choices:
    A: Se permite cruzar las líneas para rebasar a otros vehículos
    B: Está prohibido cruzar las líneas
    C: La carretera es de un solo sentido
    D: Se está aproximando únicamente a un carril para vehículos de alta ocupación
      (HOV)
  answer: B
  explanation: Las líneas blancas continuas dobles separan los carriles de tráfico
    que van en la misma dirección, y está prohibido cruzarlas.
- id: 193
  category: signs_and_signals
  question: En Massachusetts, ¿cuál es la multa máxima por no ceder el paso a un peatón
    en un cruce peatonal?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Según las Leyes Generales de Massachusetts, la multa por no ceder el
    derecho de paso a un peatón en un cruce peatonal es de $200.
- id: 194
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de pentágono?
  choices:
    A: Una zona de construcción
    B: Una zona escolar o cruce escolar
    C: Un hospital cercano
    D: Un cruce de peatones en un distrito comercial
  answer: B
  explanation: Una señal de cinco lados (pentágono) indica una zona escolar o un cruce
    escolar. Los conductores deben reducir la velocidad y estar atentos a los niños.
- id: 195
  category: signs_and_signals
  question: 'Una señal amarilla intermitente en una intersección significa:'
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Lo mismo que una señal de ceder el paso
    C: Proceder con precaución
    D: Los peatones tienen el derecho de paso en todas las direcciones
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para proceder con
    precaución. No es necesario detenerse, pero debe estar alerta y reducir la velocidad.
- id: 196
  category: signs_and_signals
  question: En Massachusetts, ¿cuándo se le permite girar a la derecha con luz roja?
  choices:
    A: Nunca; el rojo siempre significa detenerse y quedarse
    B: Solo si hay una flecha verde
    C: Después de detenerse por completo y ceder el paso a los peatones y al resto
      del tráfico, a menos que haya una señal de 'No girar en rojo' (No Turn on Red)
    D: Solo entre las 10:00 PM y las 6:00 AM
  answer: C
  explanation: La ley de Massachusetts permite girar a la derecha en rojo después
    de una parada completa y de ceder el paso al tráfico y a los peatones, siempre
    que no haya una señal que prohíba el giro.
- id: 197
  category: signs_and_signals
  question: ¿Qué significa una señal naranja en forma de diamante?
  choices:
    A: Información reglamentaria
    B: Advertencia de construcción o mantenimiento
    C: Parque estatal o área recreativa
    D: Guía direccional hacia una autopista
  answer: B
  explanation: Las señales naranjas en forma de diamante se utilizan para advertir
    a los conductores sobre operaciones de construcción, mantenimiento o servicios
    públicos en la carretera o cerca de ella.
- id: 198
  category: signs_and_signals
  question: ¿Cuál es la señal manual adecuada para reducir la velocidad o detenerse?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido hacia abajo
  answer: C
  explanation: Para indicar que está reduciendo la velocidad o deteniéndose, extienda
    el brazo izquierdo hacia abajo con la palma hacia los conductores que vienen detrás.
- id: 199
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas en una autopista de varios
    carriles?
  choices:
    A: El tráfico se mueve en direcciones opuestas
    B: El tráfico se mueve en la misma dirección y se permiten los cambios de carril
    C: El borde de la calzada
    D: Un carril restringido solo para autobuses
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Puede cruzar estas líneas para cambiar de carril
    cuando sea seguro hacerlo.
- id: 200
  category: signs_and_signals
  question: En Massachusetts, ¿cuál es el procedimiento correcto para girar a la derecha
    en un semáforo en rojo?
  choices:
    A: Nunca puede girar a la derecha en un semáforo en rojo.
    B: Puede girar a la derecha después de reducir la velocidad, siempre que no haya
      una señal de 'No girar en rojo' (No Turn on Red).
    C: Debe detenerse por completo, ceder el paso a los peatones y al resto del tráfico,
      y luego puede girar si no hay una señal que lo prohíba.
    D: Puede girar a la derecha solo si hay una flecha verde que acompaña a la luz
      roja.
  answer: C
  explanation: Según el Manual del Conductor de Massachusetts, puede girar a la derecha
    en rojo después de detenerse por completo y ceder el paso a los peatones y otros
    vehículos, a menos que haya una señal que prohíba el giro.
- id: 201
  category: signs_and_signals
  question: Según la ley de Massachusetts, ¿cuándo se permite girar a la izquierda
    con luz roja?
  choices:
    A: Nunca.
    B: Solo al girar desde una calle de sentido único hacia otra calle de sentido
      único.
    C: Solo al girar desde una calle de doble sentido hacia una calle de sentido único.
    D: En cualquier intersección donde no haya una señal de 'No Turn on Red' (No girar
      en rojo).
  answer: B
  explanation: En Massachusetts, puede girar a la izquierda en rojo solo cuando gire
    desde una calle de sentido único hacia otra calle de sentido único, después de
    detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 202
  category: signs_and_signals
  question: ¿Qué señal manual es la forma correcta de indicar un giro a la derecha?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana.
    B: Brazo izquierdo extendido hacia afuera y doblado hacia arriba en el codo.
    C: Brazo izquierdo extendido hacia afuera y doblado hacia abajo en el codo.
    D: Brazo derecho extendido recto hacia afuera de la ventana.
  answer: B
  explanation: Para señalar un giro a la derecha mediante señales manuales, el conductor
    debe extender el brazo izquierdo por la ventana y doblarlo hacia arriba a la altura
    del codo.
- id: 203
  category: signs_and_signals
  question: ¿Qué significan las líneas amarillas dobles continuas en el centro de
    la carretera en Massachusetts?
  choices:
    A: Se permite adelantar desde cualquier lado.
    B: Se permite adelantar solo por la derecha.
    C: Se prohíbe adelantar en ambas direcciones.
    D: La carretera es de un solo sentido.
  answer: C
  explanation: Las líneas amarillas dobles continuas significan que está prohibido
    adelantar para el tráfico en ambas direcciones.
- id: 204
  category: signs_and_signals
  question: 'En Massachusetts, un símbolo de diamante blanco pintado en el pavimento
    indica:'
  choices:
    A: Un cruce de peatones más adelante.
    B: Un carril para vehículos de alta ocupación (HOV) o un carril restringido.
    C: Un cruce de ferrocarril más adelante.
    D: Una zona escolar.
  answer: B
  explanation: El símbolo de diamante en el pavimento marca carriles restringidos,
    como los carriles HOV para autobuses y vehículos compartidos, o carriles para
    bicicletas.
- id: 205
  category: signs_and_signals
  question: ¿Qué forma tiene una señal estándar de 'No Passing Zone' (Zona de no adelantar)
    en Massachusetts?
  choices:
    A: Diamante
    B: Rectángulo
    C: Banderín (Pennant)
    D: Círculo
  answer: C
  explanation: Una señal de 'No Passing Zone' tiene forma de banderín (un triángulo
    isósceles que apunta a la derecha) y se coloca en el lado izquierdo de la carretera
    al comienzo de la zona.
- id: 206
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de pentágono (cinco lados)?
  choices:
    A: Una zona de construcción.
    B: Una zona escolar o un cruce escolar.
    C: Una zona de hospital.
    D: Un parque público.
  answer: B
  explanation: Una señal de pentágono de cinco lados se utiliza exclusivamente para
    advertir a los conductores que están entrando en una zona escolar o acercándose
    a un cruce escolar.
- id: 207
  category: signs_and_signals
  question: Si se aproxima a una intersección con una luz roja fija y una flecha verde
    fija que apunta a la izquierda, ¿qué se le permite hacer?
  choices:
    A: Debe detenerse y esperar a la luz verde circular.
    B: Puede girar a la izquierda, ya que la flecha verde proporciona un giro 'protegido'.
    C: Puede girar a la izquierda solo después de detenerse por completo.
    D: Puede seguir recto o girar a la izquierda.
  answer: B
  explanation: Una flecha verde significa que tiene un giro 'protegido' en la dirección
    de la flecha. Puede avanzar en esa dirección, pero aún debe ceder el paso a los
    peatones o vehículos que ya se encuentren en la intersección.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, en el cruce de peatones o antes de entrar
    en la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 208
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para dejar que otros pasen con seguridad.
  id: 209
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal de NO ENTRAR (DO NOT ENTER) roja y blanca significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 210
- image: wrong_way.png
  category: signs_and_signals
  question: ¿Qué debe hacer si ve esta señal?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está circulando en contra del tráfico en una calle de un solo sentido o en
    una rampa de autopista. Deténgase de inmediato y dé la vuelta o retroceda de manera
    segura.
  id: 211
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 212
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 213
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 214
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 215
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 216
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 217
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 218
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 219
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan la carretera.
  id: 220
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal fluorescente de color amarillo verdoso en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 221
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (roundabout) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 222
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 223
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 224
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 225
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    en un sentido y luego en el otro.
  id: 226
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 227
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación (merge) en forma de diamante advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 228
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: Fin del carril
    D: Fin de la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 229
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 230
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción vial más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    en sentido contrario ya no estará separado por una mediana. Esté preparado para
    el tráfico en ambos sentidos.
  id: 231
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una vía de un solo sentido o de una autopista dividida y
    se encuentre con vehículos que circulan en dirección opuesta.
  id: 232
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 233
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción vial
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 234
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 235
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 236
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las carreteras
    laterales.
  id: 237
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 238
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 239
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o con el motor encendido
    D: Carga o descarga
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 240
