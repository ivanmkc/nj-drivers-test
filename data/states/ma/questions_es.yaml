questions:
- id: 1
  category: safe_driving_rules
  question: ¿Bajo la ley de Massachusetts, cómo se les permite a los conductores adultos
    usar teléfonos móviles mientras operan un vehículo motorizado?
  choices:
    A: Pueden sostener el teléfono si realizan una llamada rápida.
    B: Solo pueden usar el dispositivo en modo manos libres.
    C: Tienen estrictamente prohibido el uso de teléfonos móviles en cualquier modo.
    D: Pueden sostener el teléfono solo mientras están detenidos en un semáforo en
      rojo.
  answer: B
  explanation: La ley de Massachusetts prohíbe a los operadores de vehículos motorizados
    el uso de cualquier dispositivo electrónico, incluidos los teléfonos móviles,
    a menos que el dispositivo se utilice en modo manos libres. A los conductores
    no se les permite sostener ni apoyar el dispositivo.
- id: 2
  category: safe_driving_rules
  question: ¿Cuál es la política de Massachusetts con respecto al uso de dispositivos
    electrónicos para conductores adolescentes?
  choices:
    A: Pueden usar dispositivos solo en modo manos libres.
    B: Se les permite usar aplicaciones de GPS si sostienen el teléfono.
    C: No se les permite usar ningún dispositivo electrónico, incluso en modo manos
      libres.
    D: Pueden usar dispositivos electrónicos solo cuando están acompañados por un
      adulto.
  answer: C
  explanation: Según el manual, a los conductores adolescentes no se les permite usar
    ningún dispositivo electrónico, incluso en modo manos libres.
- id: 3
  category: penalties_and_points
  question: ¿Cómo maneja el RMV de Massachusetts las infracciones de vehículos motorizados
    cometidas fuera del estado?
  choices:
    A: Se ignoran a menos que involucren un delito grave.
    B: Resultan en una advertencia pero no afectan su registro.
    C: Afectan su registro exactamente como si hubieran ocurrido en Massachusetts.
    D: Solo afectan sus tarifas de seguro, no su registro de conducir.
  answer: C
  explanation: Las infracciones de vehículos motorizados fuera del estado afectan
    su registro tal como si hubieran ocurrido en Massachusetts. El manual advierte
    explícitamente a los conductores que no las ignoren.
- id: 4
  category: license_system
  question: A partir del 7 de mayo de 2025, ¿qué necesitará para volar dentro de los
    Estados Unidos?
  choices:
    A: Una tarjeta de identificación estándar de Massachusetts.
    B: Una REAL ID u otra identificación aceptable, como un pasaporte válido.
    C: Un certificado de nacimiento y una licencia de conducir estándar.
    D: Una tarjeta de registro de votante.
  answer: B
  explanation: A partir del 7 de mayo de 2025, necesitará una REAL ID u otra identificación
    aceptable, como un pasaporte válido, para volar dentro de los Estados Unidos.
- id: 5
  category: license_system
  question: Si no tiene una REAL ID después del 7 de mayo de 2025, ¿cuál de las siguientes
    es una alternativa aceptable para volar dentro de los Estados Unidos?
  choices:
    A: Un pasaporte válido.
    B: Una tarjeta de seguro social.
    C: Una licencia de conducir estándar.
    D: Una tarjeta de identificación estudiantil.
  answer: A
  explanation: El manual establece que a partir del 7 de mayo de 2025, necesitará
    una REAL ID u otra identificación aceptable, como un pasaporte válido, para volar
    dentro de los Estados Unidos.
- id: 6
  category: sharing_the_road
  question: ¿Cuáles de las siguientes vías públicas están diseñadas exclusivamente
    para el uso de vehículos motorizados y remolques que viajan a altas velocidades?
  choices:
    A: Calles urbanas y caminos rurales.
    B: Carreteras secundarias y caminos suburbanos.
    C: Autopistas interestatales y vías rápidas (expressways).
    D: Vías públicas con carriles para bicicletas y aceras.
  answer: C
  explanation: Algunas vías, como las autopistas interestatales y las vías rápidas,
    están diseñadas exclusivamente para el uso de vehículos motorizados y remolques
    que viajan a altas velocidades.
- id: 7
  category: sharing_the_road
  question: Según el manual, ¿quiénes deben compartir la mayoría de las vías públicas?
  choices:
    A: Solo vehículos de pasajeros y camiones comerciales.
    B: Peatones, bicicletas, motocicletas, vehículos de pasajeros, autobuses y vehículos
      comerciales.
    C: Solo vehículos motorizados capaces de viajar a más de 40 mph.
    D: Solo residentes locales y vehículos de transporte público.
  answer: B
  explanation: La mayoría de las vías públicas están destinadas a ser compartidas
    por 'nosotros', lo que incluye a peatones, personas en bicicletas o motocicletas,
    personas en vehículos de pasajeros o autobuses, y personas que operan vehículos
    motorizados comerciales o remolques.
- id: 8
  category: signs_and_signals
  question: Las vías públicas cuentan con diversas características. ¿Qué significan
    las siglas 'HOV' en el contexto de los carriles de autopista?
  choices:
    A: Vehículo de Ocupación Pesada (Heavy Occupancy Vehicle)
    B: Vehículo de Alta Ocupación (High Occupancy Vehicle)
    C: Vehículo de Paso Elevado de Autopista (Highway Overpass Vehicle)
    D: Infracción de Operación Peligrosa (Hazardous Operation Violation)
  answer: B
  explanation: El manual enumera varias características de las vías públicas, incluidos
    los 'carriles para vehículos de alta ocupación (HOV)'.
- id: 9
  category: penalties_and_points
  question: ¿Qué sucederá si no paga o no comparece en otra jurisdicción por una infracción
    de vehículo motorizado?
  choices:
    A: La infracción se descarta después de 30 días.
    B: El RMV de Massachusetts tomará medidas en su contra al enterarse de estos eventos.
    C: Solo será penalizado si regresa a ese estado específico.
    D: Su vehículo será incautado inmediatamente en Massachusetts.
  answer: B
  explanation: Si no paga o no comparece en otra jurisdicción por una infracción,
    el RMV tomará medidas en su contra al enterarse de estos eventos.
- id: 10
  category: driver_responsibility
  question: Además de inglés, español, portugués, chino y vietnamita, ¿en qué otro
    idioma está disponible actualmente en línea el Manual del Conductor de Massachusetts?
  choices:
    A: Francés
    B: Alemán
    C: Creole haitiano
    D: Italiano
  answer: C
  explanation: El manual está disponible actualmente en línea en inglés, español,
    portugués, chino, creole haitiano y vietnamita.
- id: 11
  category: license_system
  question: ¿Según el Índice, a qué se refiere el acrónimo 'JOL' en el sistema de
    licencias de Massachusetts?
  choices:
    A: Licencia de Operador Junior (Junior Operator License)
    B: Licencia de Propiedad Conjunta (Joint Ownership License)
    C: Orden Judicial de Licencia (Judicial Order of Licensing)
    D: Ley de Delincuentes Juveniles (Juvenile Offender Law)
  answer: A
  explanation: El Índice enumera la 'Ley de Licencia de Operador Junior' y posteriormente
    se refiere a ella como 'JOL' en secciones como 'Requisitos para obtener una JOL'.
- id: 13
  category: penalties_and_points
  question: ¿Cuál es la consecuencia para los conductores que infringen la ley al
    sostener o apoyar un dispositivo electrónico mientras conducen?
  choices:
    A: Se les exigirá volver a tomar el examen práctico.
    B: Se impondrán multas y otras sanciones.
    C: Su vehículo será confiscado permanentemente.
    D: Recibirán una advertencia por las primeras tres infracciones.
  answer: B
  explanation: El manual establece que 'se impondrán multas y otras sanciones a los
    infractores de la ley de manos libres'.
- id: 14
  category: driver_responsibility
  question: ¿Cómo pueden los automovilistas seguir al Registro de Vehículos Motorizados
    de Massachusetts en Twitter para obtener las últimas noticias?
  choices:
    A: '@MassDOT'
    B: '@MassRMV'
    C: '@DriveMass'
    D: '@BostonRMV'
  answer: B
  explanation: El manual aconseja a los automovilistas 'seguir al RMV en Twitter @MassRMV'
    para obtener las últimas noticias del RMV.
- id: 15
  category: sharing_the_road
  question: Según la sección del manual sobre compartir la vía, ¿por qué los conductores
    siempre deben prestar atención al ciclismo y a la caminata?
  choices:
    A: Porque las bicicletas están permitidas en las autopistas interestatales.
    B: Porque los peatones siempre tienen el derecho de paso en las autopistas.
    C: Porque el ciclismo y la caminata pueden usarse en conjunto con el transporte
      público.
    D: Porque las bicicletas viajan a las mismas velocidades que los vehículos motorizados.
  answer: C
  explanation: 'El manual establece: ''El ciclismo y la caminata pueden usarse en
    conjunto con el transporte público, así que siempre preste atención''.'
- id: 16
  category: sharing_the_road
  question: Según la Ley de Usuarios Vulnerables de la Vía, ¿cómo debe un conductor
    rebasar a un ciclista de manera segura?
  choices:
    A: Tocar la bocina para alertarlos antes de pasar cerca
    B: Pasar a una distancia cercana para evitar el tráfico que viene en sentido contrario
    C: Dejar una distancia de seguridad de al menos 4 pies al rebasar
    D: Acelerar para pasarlos lo más rápido posible
  answer: C
  explanation: Bajo la Ley de Usuarios Vulnerables de la Vía, los conductores deben
    dejar una distancia de seguridad de al menos 4 pies al rebasar a usuarios vulnerables
    de la vía, como los ciclistas.
- id: 17
  category: penalties_and_points
  question: ¿Cuál de las siguientes se clasifica como una Infracción Civil de Vehículos
    Motorizados (CMVI) en lugar de una violación penal?
  choices:
    A: Operar bajo la influencia (OUI)
    B: Exceso de velocidad
    C: Abandonar la escena de un choque
    D: Homicidio vehicular
  answer: B
  explanation: El exceso de velocidad se considera una Infracción Civil de Vehículos
    Motorizados (CMVI). El OUI, abandonar la escena de un choque y el homicidio vehicular
    son violaciones penales graves.
- id: 18
  category: penalties_and_points
  question: ¿Cuál es la sanción si un conductor acumula tres incidentes con recargo
    (surchargeable events) en un período de dos años?
  choices:
    A: Una revocación permanente de la licencia
    B: Instalación obligatoria de un Dispositivo de Interbloqueo de Encendido (IID)
    C: Finalización de un curso obligatorio de reentrenamiento para conductores
    D: Una sentencia de 30 días de cárcel
  answer: C
  explanation: Si acumula tres o más incidentes con recargo en un período de dos años,
    su licencia será suspendida a menos que complete un curso obligatorio de reentrenamiento
    para conductores.
- id: 19
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión obligatoria del permiso o licencia para
    un Operador Junior (de 16 1/2 a 18 años) citado por su primera infracción por
    exceso de velocidad?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Según las Suspensiones Obligatorias para Operadores Junior, una primera
    infracción por exceso de velocidad resulta en una suspensión de la licencia de
    90 días.
- id: 20
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de contenido de alcohol en sangre (BAC) para
    conductores de 21 años de edad o más?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para conductores de 21 años o más, es ilegal operar un vehículo motorizado
    con un contenido de alcohol en sangre (BAC) de 0.08% o superior.
- id: 21
  category: alcohol_drugs_health
  question: ¿Cuál es el período de suspensión de la licencia para un conductor mayor
    de 21 años que se niega a una prueba química por primera vez?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Bajo la Ley de Consentimiento Implícito, un conductor mayor de 21 años
    que se niega a una prueba química por primera vez enfrenta una suspensión automática
    de la licencia de 180 días.
- id: 22
  category: safe_driving_rules
  question: ¿A menos que se indique lo contrario, cuál es el límite de velocidad estándar
    en un distrito comercial o densamente poblado?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: La ley fundamental de velocidad establece el límite de velocidad en
    un distrito comercial o densamente poblado en 30 mph, a menos que las señales
    indiquen lo contrario.
- id: 23
  category: signs_and_signals
  question: ¿Cómo debe reaccionar un conductor ante una señal de tráfico roja intermitente?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo, ceder el paso y avanzar cuando sea seguro
    C: Mantener la velocidad pero estar atento a los peatones que cruzan
    D: Detenerse y esperar a que la luz cambie a verde
  answer: B
  explanation: Una señal de tráfico roja intermitente se trata igual que una señal
    de alto (stop). Debe detenerse por completo, ceder el paso al tráfico con derecho
    de vía y avanzar cuando sea seguro.
- id: 24
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas continuas en una calzada?
  choices:
    A: El tráfico se mueve en la misma dirección y se permite rebasar
    B: El tráfico se mueve en direcciones opuestas y está prohibido rebasar
    C: El carril está terminando y debe incorporarse a la derecha
    D: Se está acercando a un cruce de ferrocarril
  answer: B
  explanation: Las líneas amarillas continuas separan el tráfico que se mueve en direcciones
    opuestas e indican que no se permite rebasar.
- id: 25
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección con señales
    de alto en las cuatro esquinas (four-way stop), ¿quién tiene el derecho de vía?
  choices:
    A: El vehículo a la izquierda
    B: El vehículo a la derecha
    C: El vehículo que está girando a la izquierda
    D: El vehículo más grande
  answer: B
  explanation: En una parada de cuatro vías, si dos vehículos llegan al mismo tiempo,
    el vehículo de la derecha tiene el derecho de vía.
- id: 26
  category: safe_driving_rules
  question: Según las reglas para rebasar, ¿cuándo es legalmente permisible rebasar
    a otro vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    B: Cuando el vehículo de adelante está girando a la izquierda y hay suficiente
      espacio pavimentado a la derecha
    C: Cuando tiene prisa y el carril izquierdo está bloqueado
    D: Rebasar por la derecha nunca es legalmente permisible
  answer: B
  explanation: Puede rebasar por la derecha solo cuando el vehículo de adelante esté
    realizando un giro a la izquierda y usted pueda hacerlo de manera segura sin salirse
    de la calzada pavimentada.
- id: 27
  category: safe_driving_rules
  question: De acuerdo con las regulaciones de estacionamiento, ¿cuál es la distancia
    mínima que debe mantener al estacionarse cerca de un hidrante de incendios?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: Las regulaciones de estacionamiento prohíben estacionarse a menos de
    10 pies de un hidrante de incendios para garantizar que los vehículos de emergencia
    tengan un acceso adecuado.
- id: 28
  category: defensive_driving
  question: Al conducir en condiciones invernales, ¿cuál es la técnica recomendada
    para detenerse de manera segura en una carretera con hielo?
  choices:
    A: Frenar bruscamente en el último momento
    B: Bombear los frenos rápidamente y girar el volante con fuerza
    C: Comenzar a reducir la velocidad con mucha antelación y aplicar los frenos suavemente
    D: Poner el vehículo en punto muerto (neutral) y dejar que ruede hasta detenerse
  answer: C
  explanation: Durante la conducción en invierno, las carreteras pueden estar resbaladizas.
    Lo más seguro es comenzar a reducir la velocidad con mucha antelación y aplicar
    los frenos suavemente para evitar derrapes.
- id: 29
  category: penalties_and_points
  question: ¿A qué conductores se les exige tener instalado un dispositivo de bloqueo
    de encendido (IID) en su vehículo?
  choices:
    A: Conductores con una sola multa por exceso de velocidad
    B: Conductores que buscan la restitución de la licencia después de dos o más infracciones
      por conducir bajo la influencia (OUI)
    C: Todos los Operadores Junior durante sus primeros seis meses de conducción
    D: Conductores que han estado involucrados en un choque con culpa
  answer: B
  explanation: Un dispositivo de bloqueo de encendido (IID) es obligatorio para los
    conductores que tienen dos o más infracciones por conducir bajo la influencia
    (OUI) y buscan una licencia por dificultades económicas o la restitución total.
- id: 30
  category: signs_and_signals
  question: ¿Cuál es el propósito de una isla de canalización en una calzada?
  choices:
    A: Proporcionar un área de estacionamiento designada para vehículos averiados
    B: Dirigir el flujo de tráfico y separar los vehículos que se mueven en la misma
      dirección o en direcciones opuestas
    C: Indicar la presencia de una zona escolar
    D: Marcar el inicio de una rampa de salida de la autopista
  answer: B
  explanation: Las islas de canalización se utilizan para dirigir el flujo de tráfico,
    separar carriles de tráfico opuestos o guiar a los vehículos hacia los carriles
    adecuados en las intersecciones.
- id: 31
  category: safe_driving_rules
  question: Bajo la Ley de Manos Libres (Hands-Free Law), ¿cuándo es permisible usar
    un dispositivo electrónico móvil portátil?
  choices:
    A: Cuando está detenido en una luz roja.
    B: Cuando está detenido en una señal de alto.
    C: Cuando el vehículo está estacionario y no se encuentra en un carril de circulación
      pública.
    D: Cuando se detiene a un lado de una carretera concurrida.
  answer: C
  explanation: De acuerdo con la Ley de Manos Libres, el uso de dispositivos portátiles
    solo está permitido si el vehículo está estacionario y no se encuentra en un carril
    de circulación pública. No está permitido en semáforos en rojo ni en señales de
    alto.
- id: 32
  category: driver_responsibility
  question: Según el manual, ¿cuál es la ÚNICA forma verdadera de protegerse contra
    la conducción con somnolencia?
  choices:
    A: Beber bebidas con cafeína.
    B: Dormir lo suficiente y no conducir cuando esté cansado.
    C: Bajar las ventanillas para que entre aire fresco.
    D: Subir el volumen de la radio.
  answer: B
  explanation: El manual establece que la ÚNICA forma verdadera de protegerse contra
    la conducción con somnolencia es dormir lo suficiente y no conducir cuando se
    sienta cansado.
- id: 33
  category: driver_responsibility
  question: Para ayudar a prevenir la conducción con somnolencia, ¿entre qué horas
    recomienda el manual evitar conducir si es posible?
  choices:
    A: 10 p.m. y 4 a.m.
    B: Medianoche y 6 a.m.
    C: 2 a.m. y 8 a.m.
    D: 8 p.m. y medianoche.
  answer: B
  explanation: Cuando sea posible, evite conducir entre la medianoche y las 6 a.m.
    Si debe conducir a esa hora, esté alerta a los signos de somnolencia.
- id: 34
  category: sharing_the_road
  question: Al rebasar a un usuario vulnerable de la vía, como un ciclista o un peatón,
    ¿cuál es la distancia mínima de seguridad que debe dejar?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: La Ley de Usuarios Vulnerables de la Vía requiere que, al rebasar a
    un usuario vulnerable, debe dejar una distancia de seguridad de al menos 4 pies
    entre su vehículo y el usuario de la vía.
- id: 35
  category: sharing_the_road
  question: Al rebasar a un usuario vulnerable de la vía, ¿qué acción está legalmente
    permitida si es seguro hacerlo?
  choices:
    A: Tocar la bocina continuamente hasta que pase.
    B: Acelerar para pasarlos rápidamente.
    C: Cruzar la línea central para usar parte del carril contiguo.
    D: Rebasarlos por el arcén derecho.
  answer: C
  explanation: Si es seguro, puede usar todo o parte del carril contiguo y puede cruzar
    la línea central si es necesario al rebasar a un usuario vulnerable de la vía.
- id: 36
  category: safe_driving_rules
  question: ¿Cómo afecta el aumento de la velocidad a la visión del conductor?
  choices:
    A: Mejora la visión periférica.
    B: Reduce el "cono de visión" del conductor.
    C: Elimina los puntos ciegos.
    D: No tiene ningún efecto en la visión del conductor.
  answer: B
  explanation: Un aumento en la velocidad reduce el "cono de visión" del conductor
    y aumenta los riesgos de choques y lesiones graves.
- id: 37
  category: defensive_driving
  question: ¿Cuál es una causa común de un "choque por cortesía" (courtesy crash)?
  choices:
    A: Ceder el paso en una parada de cuatro vías.
    B: Hacer señas a las personas para que pasen a través del tráfico detenido.
    C: Usar las señales de giro demasiado pronto.
    D: Dejar demasiada distancia de seguimiento.
  answer: B
  explanation: Hacer señas a las personas para que pasen a través del tráfico detenido,
    o conducir a través del tráfico cuando alguien le hace señas, crea una situación
    peligrosa y puede resultar fácilmente en un "choque por cortesía".
- id: 38
  category: driver_responsibility
  question: Bajo la Ley de Retiro del Conductor (Driver Removal Law), ¿qué debe hacer
    después de un choque que involucre solo daños a la propiedad?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía.
    B: Mover los vehículos fuera de los carriles de circulación a un lugar seguro.
    C: Esperar a una grúa antes de mover los vehículos.
    D: Intercambiar información mientras está parado en el carril de circulación.
  answer: B
  explanation: Después de un choque que involucre solo daños a la propiedad, la Ley
    de Retiro del Conductor exige que los vehículos se muevan fuera de los carriles
    de circulación a un lugar seguro para que no causen accidentes adicionales.
- id: 39
  category: license_system
  question: ¿Qué clase de licencia de conducir de Massachusetts es la más común y
    se utiliza para vehículos de pasajeros, camionetas y camiones pequeños?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: D
  explanation: La licencia Clase D, que es la más común, es para vehículos de pasajeros,
    camionetas y camiones pequeños.
- id: 40
  category: license_system
  question: ¿Qué clase de licencia le permite operar una motocicleta en Massachusetts?
  choices:
    A: Clase A
    B: Clase C
    C: Clase D
    D: Clase M
  answer: D
  explanation: La licencia Clase M le permite operar motocicletas.
- id: 41
  category: license_system
  question: ¿Qué clases de licencia se conocen como licencias de conducir comerciales
    (CDL) y le permiten operar vehículos grandes como camiones y autobuses?
  choices:
    A: Clases A, B y C
    B: Clases B, C y D
    C: Clases C, D y M
    D: Clases A, D y M
  answer: A
  explanation: Las licencias Clase A, B y C, que se conocen como licencias de conducir
    comerciales (CDL), le permiten operar vehículos grandes, como camiones y autobuses.
- id: 42
  category: license_system
  question: ¿Cuál es la edad mínima para que un residente de los EE. UU. que vive
    fuera de Massachusetts conduzca en el estado utilizando una licencia de conducir
    válida de otro estado?
  choices:
    A: 15 años de edad
    B: 16 años de edad
    C: 17 años de edad
    D: 18 años de edad
  answer: B
  explanation: Un residente de los EE. UU., que tenga al menos 16 años de edad y viva
    fuera de Massachusetts, puede conducir en Massachusetts utilizando una licencia
    de conducir válida de otro estado.
- id: 43
  category: license_system
  question: Debido a la Ley de Movilidad Familiar y Laboral (Work and Family Mobility
    Act), ¿qué es lo que ya no se requiere para obtener una Licencia de Conducir Estándar
    (Clase D o M) en Massachusetts?
  choices:
    A: Prueba de presencia legal
    B: Una puntuación aprobatoria en el examen de carretera
    C: Prueba de residencia en Massachusetts
    D: Pago de las tasas de la licencia
  answer: A
  explanation: A partir del 1 de julio de 2023, el RMV de Massachusetts no exigirá
    que los clientes proporcionen pruebas de presencia legal para obtener una Licencia
    de Conducir Estándar (Clase D o M), debido a la Ley de Movilidad Familiar y Laboral.
- id: 44
  category: safe_driving_rules
  question: Si necesita utilizar un dispositivo electrónico móvil, ¿qué prohíbe explícitamente
    la Ley de Manos Libres (Hands-Free Law)?
  choices:
    A: Usar comandos de voz para hacer una llamada.
    B: Detenerse a un lado de una carretera o autopista transitada para usar el dispositivo.
    C: Usar el dispositivo mientras está estacionado en un estacionamiento designado.
    D: Usar un sistema de navegación GPS montado en el tablero.
  answer: B
  explanation: 'El manual establece explícitamente: "NO se detenga a un lado de una
    carretera o autopista transitada para usar un dispositivo electrónico móvil".'
- id: 45
  category: defensive_driving
  question: ¿Cuál de los siguientes se menciona en el manual como una señal de somnolencia
    al conducir?
  choices:
    A: Conducir por encima del límite de velocidad.
    B: Cruzar las líneas o pisar las bandas sonoras (rumble strips).
    C: Revisar el espejo retrovisor con frecuencia.
    D: Sujetar el volante con fuerza.
  answer: B
  explanation: El manual aconseja a los conductores estar alerta a las señales de
    somnolencia, como cruzar las líneas o pisar las bandas sonoras (rumble strips).
- id: 46
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por conducir sin tener
    en su posesión su licencia de conducir válida de otro estado o de otro país en
    Massachusetts?
  choices:
    A: Una multa de $100
    B: Una multa de $250
    C: Una multa de $500
    D: Una multa de $1,000
  answer: C
  explanation: Según el manual, una violación de la Sección 10 (no tener en su posesión
    su licencia de conducir válida de otro estado o de otro país) es una infracción
    penal y una primera ofensa está sujeta a una multa de $500.
- id: 47
  category: license_system
  question: Si se muda a Massachusetts y se convierte en residente, ¿de cuánto tiempo
    es el período de gracia para obtener una licencia de conducir de Massachusetts?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: No hay período de gracia
  answer: D
  explanation: 'El manual establece: "Si se convierte en residente de Massachusetts,
    debe obtener una licencia de conducir de Massachusetts para conservar sus privilegios
    de conducción. No hay un período de gracia".'
- id: 48
  category: license_system
  question: Si su licencia de conducir de Massachusetts vence durante el servicio
    militar activo, ¿durante cuánto tiempo puede usarla para operar un vehículo motorizado
    después de su baja honorable?
  choices:
    A: Hasta 30 días
    B: Hasta 45 días
    C: Hasta 60 días
    D: Hasta 90 días
  answer: C
  explanation: Si tiene una licencia de conducir de Massachusetts que venció durante
    su servicio activo, puede usar esa licencia para operar un vehículo motorizado
    hasta 60 días después de su baja honorable del servicio militar.
- id: 49
  category: safe_driving_rules
  question: Si tiene 15 años y posee una licencia de conducir válida de otro estado
    que le permite conducir, ¿se le permite conducir en Massachusetts?
  choices:
    A: Sí, siempre que tenga su licencia de otro estado en su posesión.
    B: Sí, pero solo si está acompañado por un padre o tutor.
    C: No, ninguna persona menor de 16 años puede conducir en Massachusetts.
    D: No, a menos que obtenga un permiso de aprendizaje de Massachusetts.
  answer: C
  explanation: 'El manual establece explícitamente: "Ninguna persona menor de 16 años
    puede conducir en Massachusetts. Esto es cierto incluso si tiene una licencia
    de conducir (o permiso de aprendizaje) emitida en un estado o territorio de los
    EE. UU. o en otro país que permita la operación de un vehículo motorizado a una
    persona menor de 16 años".'
- id: 50
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para recibir una licencia de conducir
    Clase D o Clase M en Massachusetts?
  choices:
    A: 16 años
    B: 16 años y medio
    C: 17 años
    D: 18 años
  answer: B
  explanation: Puede obtener un permiso de aprendizaje a los 16 años, pero no puede
    recibir una licencia de conducir Clase D o una Clase M hasta que tenga al menos
    16 años y medio (16 1/2) y haya cumplido con todos los demás requisitos.
- id: 51
  category: license_system
  question: ¿Qué edad debe tener para solicitar una Licencia de Conducir Comercial
    (Class A, B, o C) en Massachusetts?
  choices:
    A: 16 años
    B: 18 años
    C: 21 años
    D: 25 años
  answer: B
  explanation: 'Una nota en el manual especifica: "Debe tener al menos 18 años para
    solicitar una Licencia de Conducir Comercial (Clase A, B o C)".'
- id: 52
  category: penalties_and_points
  question: ¿Cuál es una posible consecuencia de falsificar la firma de un padre o
    tutor en una solicitud de permiso de aprendizaje o licencia?
  choices:
    A: Una multa de $500
    B: Suspensión o revocación de la licencia
    C: Servicio comunitario obligatorio
    D: Una advertencia por escrito
  answer: B
  explanation: El manual establece que para los menores que solicitan permisos o licencias,
    "Falsificar una firma puede resultar en la suspensión o revocación de la licencia".
- id: 53
  category: license_system
  question: Según la política de imagen facial del RMV, ¿se les permite a los solicitantes
    usar anteojos para la foto de su licencia de conducir?
  choices:
    A: Sí, si son anteojos recetados.
    B: Sí, siempre que no haya reflejos en los lentes.
    C: No, no se permiten anteojos, incluso si el solicitante los usa normalmente.
    D: No, a menos que sean anteojos de lectura.
  answer: C
  explanation: 'La política de imagen facial establece claramente: "No se permiten
    anteojos, incluidos los de lectura o recetados, incluso si el solicitante los
    usa normalmente".'
- id: 54
  category: license_system
  question: ¿Cuál de los siguientes es aceptable según la política de imagen facial
    del RMV para una foto de licencia de conducir?
  choices:
    A: Tatuajes faciales temporales
    B: Tatuajes faciales permanentes
    C: Auriculares Bluetooth
    D: Mascarillas quirúrgicas
  answer: B
  explanation: El manual señala que "Los tatuajes faciales permanentes son aceptables,
    pero los tatuajes temporales no lo son. Los auriculares Bluetooth no son aceptables".
    También establece que las mascarillas quirúrgicas no son aceptables.
- id: 55
  category: driver_testing
  question: Para ser elegible para una licencia completa de Clase D o M, ¿cuál es
    la agudeza visual mínima requerida en su mejor ojo (corregida)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Para ser elegible para una licencia de Clase D o M, su visión debe
    tener al menos una agudeza visual de 20/40 en su mejor ojo (corregida) para una
    licencia completa.
- id: 56
  category: driver_testing
  question: ¿Bajo qué condición podría ser elegible para una licencia de conducir
    "solo para el día" (daylight only)?
  choices:
    A: Si su visión corregida está entre 20/50 y 20/70 en el mejor ojo.
    B: Si su visión periférica horizontal es inferior a 90 grados.
    C: Si no aprueba el examen de visión de colores.
    D: Si es menor de 18 años.
  answer: A
  explanation: 'El manual establece: "Si su visión corregida está entre 20/50 y 20/70
    en el mejor ojo, puede ser elegible para una licencia solo para el día".'
- id: 57
  category: driver_testing
  question: ¿Cuántos grados de visión periférica horizontal (ambos ojos juntos) se
    requieren para ser elegible para una licencia completa de Clase D o M?
  choices:
    A: 90 grados
    B: 100 grados
    C: 120 grados
    D: 140 grados
  answer: C
  explanation: Debe tener al menos 120 grados de visión periférica horizontal (ambos
    ojos juntos) para una licencia completa.
- id: 58
  category: license_system
  question: Cuando solicita una licencia, el RMV verifica su información con el Sistema
    de Indicadores de Conductores con Problemas (PDPS). ¿Qué hace este sistema?
  choices:
    A: Verifica su puntaje de crédito por multas de estacionamiento no pagadas.
    B: Almacena información sobre suspensiones y revocaciones de licencias para conductores
      en los 50 estados.
    C: Verifica su estatus de residencia legal en Massachusetts.
    D: Rastrea el registro de su vehículo y su historial de seguros.
  answer: B
  explanation: El Sistema de Indicadores de Conductores con Problemas (PDPS) almacena
    información sobre suspensiones y revocaciones de licencias para conductores en
    los 50 estados.
- id: 59
  category: license_system
  question: ¿Qué sucede si solicita una licencia de conducir de Massachusetts mientras
    posee una licencia válida de otro estado que participa en el programa de Estado
    a Estado (State-to-State)?
  choices:
    A: Se le permitirá conservar ambas licencias.
    B: Debe entregar su licencia de Massachusetts cuando viaje fuera del estado.
    C: El otro estado participante cancelará la licencia de conducir emitida por ellos.
    D: Se le cobrará el doble de la tarifa estándar de la licencia.
  answer: C
  explanation: Massachusetts es parte del programa de Estado a Estado, el cual cancelará
    cualquier licencia de conducir o tarjeta de identificación estatal emitida por
    el otro estado participante cuando se emita una licencia o tarjeta de identificación
    de Massachusetts.
- id: 60
  category: license_system
  question: ¿Cuál es la diferencia de costo entre una Licencia de Conducir REAL ID
    de Massachusetts y una Licencia de Conducir Estándar de Massachusetts?
  choices:
    A: La REAL ID cuesta $25 más.
    B: La licencia Estándar cuesta $10 más.
    C: La REAL ID cuesta el doble.
    D: El costo es el mismo para ambos tipos de tarjeta.
  answer: D
  explanation: 'El manual establece explícitamente con respecto a las tarjetas REAL
    ID y Estándar de Massachusetts: "El costo es el mismo para ambos tipos de tarjeta".'
- id: 61
  category: license_system
  question: Bajo la Ley de Movilidad Laboral y Familiar (WFMA), ¿cuál de las siguientes
    credenciales aún requiere prueba de presencia legal para obtenerse?
  choices:
    A: Una Licencia de Conducir Estándar Clase D
    B: Una Licencia de Conducir Estándar Clase M
    C: Una Licencia de Conducir Comercial (CDL)
    D: Una Licencia de Conducir Estándar de 5 años
  answer: C
  explanation: La WFMA no afecta a las Licencias de Conducir Comerciales (CDL), las
    REAL ID, las tarjetas de identificación estándar o las identificaciones de licores.
    Todavía se requiere prueba de presencia legal para todas estas.
- id: 62
  category: license_system
  question: ¿Qué clase de licencia se requiere normalmente para operar vehículos de
    pasajeros estándar, como automóviles, SUV o camionetas familiares?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: D
  explanation: Una licencia de Clase D es para cualquier vehículo individual o combinación
    de vehículos que no cumpla con la definición de Clase A, B, C o M, lo que normalmente
    incluye vehículos de pasajeros como automóviles, SUV o camionetas familiares.
- id: 63
  category: license_system
  question: Se requiere una licencia de conducir de Clase C para un vehículo que no
    cumple con la definición de Clase A o B, pero que está diseñado para transportar
    ¿a cuántos pasajeros (incluido el conductor)?
  choices:
    A: 8 o más
    B: 10 o más
    C: 16 o más
    D: 20 o más
  answer: C
  explanation: Se requiere una licencia de Clase C para un vehículo diseñado para
    transportar 16 o más pasajeros, incluido el conductor, o uno que deba llevar carteles
    por transporte de materiales peligrosos.
- id: 64
  category: license_system
  question: ¿Cuál es el período máximo de validez de una licencia de conducir estándar
    de Massachusetts?
  choices:
    A: 3 años
    B: 4 años
    C: 5 años
    D: 10 años
  answer: C
  explanation: Una licencia de conducir de Massachusetts es válida por un máximo de
    cinco años y generalmente vence en su cumpleaños. Una Licencia Estándar siempre
    será válida por cinco años.
- id: 65
  category: license_system
  question: Si renueva su licencia antes de cumplir 21 años y recibe una licencia
    vertical con la leyenda "Under 21" (Menor de 21) impresa, ¿qué sucede con la tarjeta
    cuando cumple 21 años?
  choices:
    A: La licencia se vuelve inválida inmediatamente y debe ser reemplazada.
    B: Sigue siendo válida hasta su fecha de vencimiento.
    C: Debe obtener una licencia horizontal en un plazo de 30 días.
    D: Está restringido a conducir solo durante las horas del día.
  answer: B
  explanation: Si renueva su licencia o tarjeta de identificación antes de cumplir
    21 años, recibirá una licencia o tarjeta de identificación vertical. Esta licencia
    o tarjeta de identificación seguirá siendo válida hasta su vencimiento, incluso
    después de que cumpla 21 años.
- id: 66
  category: safe_driving_rules
  question: Si aprueba el examen de la vista para la licencia de conducir usando anteojos
    o lentes de contacto, ¿con qué código de restricción se emitirá su licencia?
  choices:
    A: Código A
    B: Código B
    C: Código C
    D: Código I
  answer: B
  explanation: Si aprueba el examen de la vista para la licencia de conducir usando
    anteojos o lentes de contacto, su licencia de conducir se emitirá con una restricción
    de "Lentes correctivos" (Corrective Lenses), que corresponde a la letra de código
    B.
- id: 67
  category: driver_responsibility
  question: ¿Qué debe hacer si desarrolla una condición médica que afecte su capacidad
    para conducir?
  choices:
    A: Esperar hasta que su licencia venza para notificar al RMV.
    B: Dejar de conducir inmediatamente y entregar su licencia a la policía.
    C: Informar la condición a la unidad de Asuntos Médicos (Medical Affairs) del
      RMV.
    D: Solo conducir con un pasajero con licencia que sea mayor de 21 años.
  answer: C
  explanation: El manual establece que si desarrolla una condición médica que afecte
    su capacidad para conducir, debe informar la condición al RMV llamando a la unidad
    de Asuntos Médicos (Medical Affairs).
- id: 68
  category: license_system
  question: En Massachusetts, ¿entre qué edades se considera que cualquier operador
    de vehículo motorizado o motociclista es un Operador Junior (Junior Operator)?
  choices:
    A: 15 y 17 años
    B: 16 y 18 años
    C: 16 años y medio y 18 años
    D: 17 y 21 años
  answer: C
  explanation: Cualquier operador de vehículo motorizado o motociclista que tenga
    entre 16 años y medio (16 1/2) y 18 años se considera un Operador Junior (Junior
    Operator).
- id: 69
  category: driver_testing
  question: ¿Cuánto tiempo debe tener un solicitante de una Licencia de Operador Junior
    (JOL) un permiso de aprendizaje válido antes de realizar el examen de manejo?
  choices:
    A: Al menos 3 meses consecutivos
    B: Al menos 6 meses consecutivos
    C: Al menos 9 meses consecutivos
    D: Al menos 12 meses consecutivos
  answer: B
  explanation: Un solicitante de una JOL debe tener un permiso de aprendizaje válido
    durante al menos seis meses consecutivos antes de realizar el examen de manejo.
- id: 70
  category: penalties_and_points
  question: ¿Qué sucede con el requisito de seis meses del permiso de aprendizaje
    para un Operador Junior si su permiso es suspendido?
  choices:
    A: El tiempo de suspensión cuenta para los seis meses.
    B: El período de seis meses se reduce a tres meses.
    C: El permiso se invalida y los seis meses comenzarán de nuevo cuando se levante
      la suspensión.
    D: El solicitante debe esperar hasta cumplir los 18 años para realizar el examen
      de manejo.
  answer: C
  explanation: Cualquier suspensión invalidará el permiso y el período de seis meses
    comenzará a correr de nuevo desde cero cuando se levante la suspensión.
- id: 71
  category: driver_testing
  question: ¿Cuántas horas de instrucción en el aula incluye un programa de educación
    y capacitación vial aprobado por el RMV para un Operador Junior?
  choices:
    A: 12 horas
    B: 20 horas
    C: 30 horas
    D: 40 horas
  answer: C
  explanation: Un solicitante de Operador Junior debe completar con éxito un programa
    de educación y capacitación vial aprobado por el RMV, el cual incluye 30 horas
    de instrucción en el aula.
- id: 72
  category: driver_testing
  question: Además de la educación vial, ¿cuántas horas de conducción supervisada
    al volante debe completar un solicitante de Operador Junior (según lo demuestre
    una declaración certificada de un padre o tutor)?
  choices:
    A: 12 horas
    B: 20 horas
    C: 30 horas
    D: 40 horas
  answer: D
  explanation: Los solicitantes deben completar al menos 40 horas adicionales de conducción
    supervisada al volante, según lo demuestre una declaración certificada proporcionada
    por un padre o tutor.
- id: 73
  category: license_system
  question: ¿Cuántas licencias de conducir o tarjetas de identificación se le permite
    tener al mismo tiempo en Massachusetts?
  choices:
    A: Solo una
    B: Dos, siempre que una sea una REAL ID y la otra una identificación estándar
    C: Dos, siempre que sean de estados diferentes
    D: Hasta tres, incluyendo una identificación de licores (Liquor ID)
  answer: A
  explanation: 'El manual establece explícitamente: ''Solo puede tener una licencia
    de conducir o tarjeta de identificación a la vez''.'
- id: 74
  category: driver_testing
  question: ¿Cuántas horas de conducción supervisada al volante debe completar un
    estudiante con un padre o tutor si NO toma un programa de desarrollo de habilidades
    de conducción?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: B
  explanation: El manual establece que debe completar al menos 40 horas adicionales
    de conducción supervisada al volante, según lo demuestre una declaración certificada
    proporcionada por un padre o tutor.
- id: 75
  category: license_system
  question: 'Durante los primeros seis meses de tener una Licencia de Operador Junior
    (JOL), no puede conducir con pasajeros menores de 18 años a menos que esté acompañado
    por un conductor con licencia que tenga al menos:'
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: B
  explanation: No puede operar un vehículo motorizado con pasajeros menores de 18
    años a menos que esté acompañado por una persona que tenga al menos 21 años, tenga
    al menos un año de experiencia en la conducción, posea una licencia válida y esté
    sentada a su lado.
- id: 76
  category: safe_driving_rules
  question: 'Un Operador Junior no puede operar un vehículo motorizado sin un padre
    o tutor legal entre las horas de:'
  choices:
    A: 11:00 p.m. y 5:00 a.m.
    B: 12:00 a.m. y 6:00 a.m.
    C: 12:30 a.m. y 5:00 a.m.
    D: 1:00 a.m. y 4:00 a.m.
  answer: C
  explanation: Como titular de una JOL, no puede operar un vehículo motorizado entre
    las 12:30 a.m. y las 5:00 a.m. a menos que esté acompañado por uno de sus padres
    o su tutor legal.
- id: 77
  category: penalties_and_points
  question: 'Entre las 12:30 a.m. y la 1:00 a.m., la restricción nocturna para Operadores
    Junior se aplica como una ''aplicación secundaria'' (secondary enforcement), lo
    que significa que:'
  choices:
    A: Solo recibirá una advertencia por su primera infracción.
    B: Las autoridades solo pueden citarlo si es detenido legalmente por otra infracción.
    C: La sanción se reduce a una multa secundaria.
    D: Solo los policías estatales pueden hacer cumplir la restricción.
  answer: B
  explanation: La aplicación secundaria significa que las disposiciones de la ley
    serán aplicadas por las agencias del orden público solo cuando un Operador Junior
    haya sido detenido legalmente por una infracción de las leyes de vehículos motorizados
    o alguna otra falta.
- id: 78
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión de la licencia por la primera infracción
    de un Operador Junior al violar la restricción de pasajeros o la restricción nocturna?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Si viola la restricción de pasajeros o la restricción nocturna, estará
    sujeto a una suspensión de la licencia de 60 días por una primera infracción.
- id: 79
  category: penalties_and_points
  question: 'Si un Operador Junior comete una primera infracción por exceso de velocidad,
    su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Por una primera infracción por exceso de velocidad, se le suspenderá
    por 90 días; por una infracción posterior, se le suspenderá por un año.
- id: 80
  category: safe_driving_rules
  question: ¿Bajo qué condición puede un conductor menor de 18 años usar un dispositivo
    electrónico móvil mientras opera un vehículo motorizado?
  choices:
    A: Cuando usa un accesorio de manos libres
    B: Cuando está detenido en un semáforo en rojo
    C: Solo para informar una emergencia
    D: Cuando usa una aplicación de navegación GPS
  answer: C
  explanation: Los conductores menores de 18 años no pueden usar ningún dispositivo
    electrónico móvil por ningún motivo mientras operan un vehículo motorizado. La
    única excepción es para informar una emergencia.
- id: 81
  category: license_system
  question: Para obtener una licencia de conducir REAL ID, ¿cuántos documentos debe
    presentar que demuestren su residencia en Massachusetts?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Para solicitar una licencia de conducir REAL ID, debe presentar 2 documentos
    que demuestren su residencia en Massachusetts.
- id: 82
  category: license_system
  question: ¿Al presentar documentos de identificación al RMV, cuál de los siguientes
    es aceptable?
  choices:
    A: Una fotocopia de alta calidad
    B: Una fotocopia notarizada
    C: Un documento original laminado
    D: Un documento original no laminado
  answer: D
  explanation: El manual establece que todos los documentos deben ser originales a
    menos que se indique lo contrario. No se aceptarán fotocopias y los documentos
    laminados no son aceptables.
- id: 83
  category: license_system
  question: 'Si se le ha denegado un Número de Seguro Social, su Notificación de Denegación
    por escrito de la SSA no debe tener una antigüedad superior a:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Si ha solicitado un SSN a la SSA y se le ha denegado, debe presentar
    la Notificación de Denegación por escrito (de no más de 60 días de antigüedad)
    que le proporcionó la SSA.
- id: 84
  category: license_system
  question: Si el RMV deniega su solicitud de licencia, ¿dentro de cuántos días debe
    presentar una apelación?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si su solicitud es denegada, puede presentar una apelación dentro de
    los diez días posteriores a la recepción de una denegación por escrito del RMV.
- id: 85
  category: license_system
  question: ¿Cuál es la tarifa requerida para presentar una apelación formal ante
    la Junta de Apelaciones sobre Pólizas de Responsabilidad y Fianzas (Board of Appeals
    on Liability Policies and Bonds)?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: Una apelación formal solo puede presentarse ante la Junta de Apelaciones
    sobre Pólizas de Responsabilidad y Fianzas en la dirección indicada con un cheque
    o giro postal de $50.
- id: 86
  category: penalties_and_points
  question: ¿Cuál es la sanción por la primera infracción de carreras de velocidad
    (drag racing) de un Operador Junior (JOL)?
  choices:
    A: Suspensión de 90 días
    B: Suspensión de 180 días
    C: Suspensión de un año
    D: Suspensión de tres años
  answer: C
  explanation: Se enfrentará a periodos de suspensión adicionales de un año por una
    primera infracción de carreras de velocidad y de tres años por una infracción
    posterior.
- id: 87
  category: driver_testing
  question: ¿En cuántas horas de instrucción sobre el plan de estudios de educación
    vial debe participar un padre o tutor (a menos que se haya completado en los últimos
    5 años)?
  choices:
    A: 2 horas
    B: 4 horas
    C: 6 horas
    D: 12 horas
  answer: A
  explanation: Un padre o tutor debe participar en dos horas de instrucción sobre
    el plan de estudios de educación vial (a menos que haya participado en los últimos
    cinco años).
- id: 88
  category: license_system
  question: ¿Qué sucede con el periodo de restricción de pasajeros de seis meses si
    se suspende la licencia de un Operador Junior (JOL)?
  choices:
    A: El periodo de restricción se reinicia por completo.
    B: El periodo de restricción deja de correr temporalmente durante la suspensión.
    C: La restricción se levanta permanentemente.
    D: El periodo de restricción continúa corriendo durante la suspensión.
  answer: B
  explanation: El periodo de restricción de pasajeros de seis meses dejará de correr,
    temporalmente, durante cualquier suspensión. Cuando se restablezca su JOL, aún
    tendrá que completar el resto del periodo de restricción de seis meses.
- id: 89
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje de Massachusetts?
  choices:
    A: Hasta un año
    B: Hasta dos años
    C: Hasta cuatro años
    D: Hasta cinco años
  answer: B
  explanation: El manual establece que un permiso de aprendizaje es válido hasta por
    dos años mientras practica sus habilidades de conducción.
- id: 90
  category: driver_testing
  question: ¿Cuál es la tarifa requerida para tomar el examen del permiso de aprendizaje?
  choices:
    A: $20
    B: $25
    C: $30
    D: $50
  answer: C
  explanation: Para obtener su permiso de aprendizaje, debe pagar una tarifa de examen
    de permiso de aprendizaje de $30, que cubre el costo de su examen.
- id: 91
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el examen
    del permiso de aprendizaje?
  choices:
    A: 15 de 25
    B: 18 de 25
    C: 20 de 25
    D: 25 de 25
  answer: B
  explanation: Para aprobar el examen, debe responder correctamente 18 preguntas de
    las 25 preguntas de opción múltiple.
- id: 92
  category: driver_testing
  question: ¿Cuál es el límite de tiempo asignado para completar el examen de permiso
    de aprendizaje de Clase D o M?
  choices:
    A: 15 minutos
    B: 20 minutos
    C: 25 minutos
    D: 30 minutos
  answer: C
  explanation: Debe responder correctamente 18 preguntas dentro del tiempo asignado
    de 25 minutos.
- id: 93
  category: penalties_and_points
  question: ¿Cuál es la sanción si se le encuentra responsable de hacer trampa en
    el examen de permiso de aprendizaje?
  choices:
    A: No se le permitirá tener ningún tipo de licencia de conducir o permiso durante
      30 días.
    B: No se le permitirá tener ningún tipo de licencia de conducir o permiso durante
      60 días.
    C: Debe pagar una multa de $100 y volver a tomar el examen.
    D: Se le prohibirá permanentemente obtener una licencia de conducir.
  answer: B
  explanation: Si se le encuentra responsable de hacer trampa, no se le permitirá
    tener ningún tipo de licencia de conducir o permiso durante 60 días.
- id: 94
  category: safe_driving_rules
  question: Al conducir con un permiso de aprendizaje de Clase D, debe estar acompañado
    por un operador con licencia que cumpla con ¿cuál de los siguientes requisitos?
  choices:
    A: Al menos 18 años de edad con 6 meses de experiencia en la conducción
    B: Al menos 21 años de edad con al menos un año de experiencia en la conducción
    C: Al menos 25 años de edad con un historial de conducción limpio
    D: Cualquier conductor con licencia, independientemente de su edad o experiencia
  answer: B
  explanation: Debe estar acompañado por un operador con licencia que ocupe el asiento
    del pasajero junto a usted, tenga al menos 21 años, posea una licencia válida
    y tenga al menos un año de experiencia en la conducción.
- id: 95
  category: safe_driving_rules
  question: 'Si es menor de 18 años y tiene un permiso de aprendizaje de Clase D,
    no puede conducir entre las 12:00 a.m. y las 5:00 a.m. a menos que esté acompañado
    por:'
  choices:
    A: Un conductor con licencia que tenga al menos 21 años.
    B: Un hermano que tenga al menos 18 años.
    C: Un padre o tutor legal que sea un operador con licencia válida y tenga al menos
      un año de experiencia en la conducción.
    D: Un instructor de conducción certificado.
  answer: C
  explanation: Si es menor de 18 años, no puede conducir entre las 12:00 a.m. y las
    5:00 a.m. a menos que esté acompañado por un padre o tutor legal que sea un operador
    con licencia válida y tenga al menos un año de experiencia en la conducción.
- id: 96
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una limitación al operar una motocicleta con
    un permiso de aprendizaje de Clase M?
  choices:
    A: Solo puede llevar a un pasajero.
    B: Solo puede conducir durante las horas del día (entre la salida y la puesta
      del sol).
    C: No está obligado a usar casco si es mayor de 21 años.
    D: Puede conducir en cualquier momento del día o de la noche.
  answer: B
  explanation: Un permiso de aprendizaje de Clase M le permite operar una motocicleta
    con limitaciones, incluyendo que solo puede conducir durante las horas del día
    (entre la salida y la puesta del sol).
- id: 97
  category: license_system
  question: ¿Se puede utilizar un permiso de aprendizaje de Massachusetts como documento
    de identificación para viajar en la mayoría de las aerolíneas y cruceros?
  choices:
    A: Sí, es una identificación con foto emitida por el estado plenamente aceptada
      para todos los viajes.
    B: Sí, pero solo para vuelos nacionales dentro de los Estados Unidos.
    C: No, es un documento que otorga privilegios de conducción condicionales y no
      está destinado a la identificación para viajes.
    D: No, a menos que vaya acompañado de un certificado de nacimiento.
  answer: C
  explanation: El manual establece que un permiso de aprendizaje no está destinado
    a ser utilizado como documento de identificación para viajes y no será aceptado
    por la mayoría de las aerolíneas o cruceros.
- id: 98
  category: driver_testing
  question: ¿Quién es elegible para elegir tomar una versión en audio del examen de
    permiso de aprendizaje?
  choices:
    A: Solo personas con una condición médica documentada.
    B: Solo personas que no hablan inglés como su idioma principal.
    C: Cualquier persona puede elegir tomar un examen en audio sin documentación adicional.
    D: Solo personas que programen el examen con al menos dos semanas de anticipación.
  answer: C
  explanation: Según el manual, cualquier persona puede elegir tomar un examen en
    audio. El examen no necesita programarse con anticipación y no es necesario presentar
    ninguna documentación adicional para ser elegible.
- id: 99
  category: license_system
  question: Si es menor de 18 años, ¿qué requisito adicional debe cumplirse al presentar
    una solicitud de permiso de aprendizaje?
  choices:
    A: Debe hacer que un padre o tutor firme su solicitud.
    B: Debe proporcionar una carta de recomendación de su escuela secundaria.
    C: Debe pagar por adelantado las tarifas del examen de conducir.
    D: Debe haber completado un curso de educación vial antes de presentar la solicitud.
  answer: A
  explanation: El manual especifica que si es menor de 18 años, debe hacer que su
    padre, madre o tutor firme su solicitud.
- id: 100
  category: driver_testing
  question: ¿En qué idioma(s) están disponibles los exámenes de permiso de aprendizaje
    de Clase A, B y C (CDL)?
  choices:
    A: Inglés y español solamente
    B: Inglés solamente
    C: Más de 30 idiomas diferentes
    D: Cualquier idioma solicitado con anticipación
  answer: B
  explanation: El manual establece que los exámenes de permiso de aprendizaje de Clase
    A, B y C solo están disponibles en inglés (según la regulación federal).
- id: 101
  category: license_system
  question: ¿Qué debe hacer si su permiso de aprendizaje vence antes de que apruebe
    el examen de conducir (road test)?
  choices:
    A: Pagar una tarifa de renovación de $15 para extenderlo por un año.
    B: Volver a tomar el examen de permiso de aprendizaje y pagar las tarifas requeridas.
    C: Solicitar una extensión en línea sin tomar ningún examen.
    D: Tomar el examen de conducir inmediatamente antes de solicitar un nuevo permiso.
  answer: B
  explanation: 'El manual establece explícitamente: ''Si su permiso de aprendizaje
    vence, debe volver a tomar el examen de permiso de aprendizaje y pagar las tarifas
    requeridas''.'
- id: 102
  category: safe_driving_rules
  question: ¿Si es menor de 18 años, entre qué horas tiene prohibido conducir a menos
    que esté acompañado por un padre o tutor legal?
  choices:
    A: 10:00 p.m. y 4:00 a.m.
    B: 11:00 p.m. y 5:00 a.m.
    C: 12:00 a.m. y 5:00 a.m.
    D: 1:00 a.m. y 6:00 a.m.
  answer: C
  explanation: Según el manual, los conductores menores de 18 años no pueden conducir
    entre las 12:00 a.m. y las 5:00 a.m. a menos que estén acompañados por un padre
    o tutor legal que tenga una licencia válida con al menos un año de experiencia
    de conducción.
- id: 103
  category: license_system
  question: Al conducir una motocicleta con un permiso de aprendizaje Clase M, ¿cuándo
    NO es obligatorio usar anteojos, gafas protectoras o una careta protectora?
  choices:
    A: Al conducir a velocidades inferiores a 30 mph.
    B: Cuando usa un casco estándar del DOT de los EE. UU.
    C: Cuando la motocicleta tiene un parabrisas o pantalla.
    D: Al conducir durante las horas del día.
  answer: C
  explanation: Debe usar anteojos, gafas protectoras o una careta protectora a menos
    que la motocicleta que esté conduciendo tenga un parabrisas o pantalla.
- id: 104
  category: driver_testing
  question: ¿Cuántas horas de conducción supervisada debe completar un conductor menor
    de 18 años antes de solicitar una licencia Clase D (asumiendo que no ha completado
    un programa de desarrollo de habilidades de conducción)?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: Debe completar 40 horas de conducción supervisada, las cuales se reducen
    a 30 horas si completó un programa de desarrollo de habilidades de conducción.
- id: 105
  category: driver_testing
  question: ¿Cuál es el número máximo de exámenes de manejo de Clase D que se le permite
    intentar en un período de 12 meses?
  choices:
    A: Tres
    B: Cuatro
    C: Cinco
    D: Seis
  answer: D
  explanation: Para una licencia Clase D, no se le permite intentar más de seis exámenes
    de manejo en un período de 12 meses.
- id: 106
  category: driver_testing
  question: ¿Qué debe hacer si reprueba dos exámenes de manejo de Clase M?
  choices:
    A: Esperar 6 meses antes de programar otro examen.
    B: Inscribirse y completar con éxito un curso para motociclistas principiantes.
    C: Pagar una tarifa doble por el tercer examen.
    D: Entregar su permiso de aprendizaje Clase M.
  answer: B
  explanation: Para una licencia Clase M, si reprueba dos exámenes de manejo, debe
    inscribirse y completar con éxito un curso para motociclistas principiantes antes
    de poder programar otro examen.
- id: 107
  category: driver_testing
  question: ¿Con cuánta anticipación debe avisar para cancelar o reprogramar un examen
    de manejo sin pagar un cargo adicional?
  choices:
    A: Más de 24 horas
    B: Más de 48 horas
    C: Más de 72 horas
    D: Más de 1 semana
  answer: C
  explanation: No hay ningún cargo adicional si cancela o reprograma con más de 72
    horas de anticipación.
- id: 108
  category: driver_testing
  question: Si reprueba un examen de manejo o no se presenta a su examen programado,
    ¿cuánto tiempo debe esperar antes de realizar otro examen?
  choices:
    A: Al menos 7 días
    B: Al menos 14 días
    C: Al menos 21 días
    D: Al menos 30 días
  answer: B
  explanation: Si reprueba un examen de manejo o no se presenta a su examen programado,
    debe esperar al menos 14 días antes de realizar otro examen.
- id: 109
  category: license_system
  question: ¿Cuál es un beneficio de completar con éxito el Programa de Educación
    para Motociclistas de Massachusetts (MREP)?
  choices:
    A: No necesita realizar un examen de manejo de Clase M del RMV.
    B: Está exento de usar casco durante el primer año.
    C: Puede llevar pasajeros con un permiso de aprendizaje.
    D: Recibe un descuento en el registro de su vehículo.
  answer: A
  explanation: Si completa con éxito un curso del MREP, no necesita realizar un examen
    de manejo de Clase M del RMV.
- id: 110
  category: driver_testing
  question: ¿Cuál de los siguientes animales está permitido en el vehículo durante
    un examen de manejo?
  choices:
    A: Un animal de apoyo emocional
    B: Un animal de servicio entrenado
    C: Una mascota pequeña en un transportín
    D: No se permiten animales bajo ninguna circunstancia
  answer: B
  explanation: Los examinadores de exámenes de manejo pueden rechazar los exámenes
    si hay animales presentes, pero se permiten animales de servicio entrenados en
    el vehículo. Los animales de apoyo emocional no están permitidos.
- id: 111
  category: driver_testing
  question: ¿Cuál de los siguientes exámenes de manejo NO requiere que traiga a un
    patrocinador calificado?
  choices:
    A: Un examen de manejo de Clase D
    B: Un examen de manejo de Clase M
    C: Un examen de manejo para licencia de conducir comercial
    D: Un examen de manejo para conversión de licencia
  answer: B
  explanation: Según la sección del manual sobre la preparación para el examen de
    manejo, no se requiere un patrocinador para un examen de manejo de Clase M.
- id: 112
  category: driver_responsibility
  question: ¿Si es menor de 18 años, durante cuánto tiempo debe mantener un historial
    de conducción limpio inmediatamente antes de la fecha en que solicita un examen
    de manejo?
  choices:
    A: 3 meses consecutivos
    B: 6 meses consecutivos
    C: 9 meses consecutivos
    D: 12 meses consecutivos
  answer: B
  explanation: Si es menor de 18 años, debe mantener un historial de conducción limpio
    durante los seis meses consecutivos inmediatamente anteriores a la fecha en que
    solicita el examen.
- id: 113
  category: driver_testing
  question: ¿Qué sucede si llega tarde a su cita programada para el examen de manejo?
  choices:
    A: Se le examinará pero se le penalizará con 10 puntos.
    B: Se le examinará si llega dentro de los 15 minutos.
    C: No se le examinará y se le exigirá pagar la tarifa del examen de manejo.
    D: No se le examinará pero se le reembolsará la tarifa.
  answer: C
  explanation: Los exámenes de manejo se programan con poco tiempo de diferencia;
    debe ser puntual. Si llega tarde a su cita, no se le examinará y se le exigirá
    pagar la tarifa del examen de manejo.
- id: 114
  category: alcohol_drugs_health
  question: ¿Qué debe hacer antes de realizar un examen de manejo si declara una condición
    médica que podría afectar su capacidad para operar un vehículo motorizado?
  choices:
    A: Presentar una autorización médica de su médico.
    B: Realizar un examen escrito especializado.
    C: Traer a un enfermero registrado como su patrocinador.
    D: Completar 10 horas adicionales de conducción supervisada.
  answer: A
  explanation: Si declara una condición física, mental o médica, o si está tomando
    medicamentos que podrían afectar su capacidad de conducción, debe presentar una
    autorización médica de su médico antes de realizar un examen de manejo.
- id: 115
  category: driver_testing
  question: ¿Qué se requiere para que un solicitante menor de 18 años obtenga una
    licencia Clase M?
  choices:
    A: Traer un patrocinador al examen de manejo
    B: Completar el curso básico para motociclistas del MREP
    C: Realizar el examen de manejo en un vehículo de pasajeros
    D: Tener un historial de conducción limpio durante un año
  answer: B
  explanation: Según el manual, si es menor de 18 años, no es elegible para un examen
    de manejo de Clase M del RMV y debe completar el curso básico para motociclistas
    del MREP para obtener una licencia Clase M.
- id: 116
  category: driver_testing
  question: ¿Cuál de los siguientes es un requisito para un patrocinador de un examen
    de manejo de Clase D?
  choices:
    A: Debe tener al menos 18 años de edad
    B: Debe tener al menos un año de experiencia en la conducción
    C: Debe poseer una licencia de conducir extranjera válida
    D: Debe sentarse en el asiento del pasajero delantero
  answer: B
  explanation: Un patrocinador debe tener al menos 21 años de edad, tener al menos
    un año de experiencia en la conducción y poseer una licencia de conducir válida
    emitida por su estado de origen.
- id: 117
  category: driver_testing
  question: Sin la aprobación del Programa de Exámenes de Manejo del RMV, ¿cuál es
    el número máximo de solicitantes que una persona puede patrocinar en un período
    de un año?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cinco
  answer: C
  explanation: Los operadores no tienen permitido patrocinar a más de tres solicitantes
    diferentes en un período de un año sin la aprobación del Programa de Exámenes
    de Manejo del RMV.
- id: 118
  category: driver_testing
  question: ¿Dónde debe sentarse su patrocinador durante un examen de manejo de Clase
    D?
  choices:
    A: En el asiento del pasajero delantero junto al conductor
    B: En el asiento trasero detrás del conductor
    C: En el asiento trasero detrás del examinador
    D: En la caja de una camioneta pickup si no hay asiento trasero disponible
  answer: B
  explanation: El manual establece que el examinador se sentará a su lado y su patrocinador
    debe sentarse en el asiento trasero detrás del conductor.
- id: 119
  category: vehicle_information
  question: ¿Por qué el vehículo utilizado para un examen de manejo debe tener un
    freno de estacionamiento accesible?
  choices:
    A: Para que el patrocinador pueda ayudar con el estacionamiento
    B: Para que el examinador pueda realizar una parada de emergencia
    C: Para probar la capacidad del conductor para estacionar en una colina
    D: Para asegurar que el vehículo pase la inspección estatal
  answer: B
  explanation: El vehículo debe tener un freno de estacionamiento accesible para que
    el examinador pueda realizar una parada de emergencia si es necesario.
- id: 120
  category: vehicle_information
  question: Si utiliza un vehículo registrado fuera del estado para su examen de manejo,
    ¿cuál es la cobertura mínima requerida de seguro por daños a la propiedad que
    debe demostrar?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $30,000
  answer: D
  explanation: Si su vehículo de prueba está registrado fuera del estado, debe mostrar
    al examinador un comprobante de cobertura de seguro igual a los límites mínimos
    de Massachusetts, que son $25,000/$50,000 por lesiones corporales y $30,000 por
    daños a la propiedad.
- id: 121
  category: driver_testing
  question: ¿Qué documentación adicional se requiere si utiliza un vehículo alquilado
    para su examen de manejo?
  choices:
    A: Una factura de venta de la compañía de alquiler
    B: Una carta de la compañía de alquiler que autorice el uso para un examen de
      manejo
    C: Comprobante de una licencia de conducir comercial
    D: Un segundo freno de pie instalado en el vehículo
  answer: B
  explanation: Si alquila el vehículo, debe mostrar el contrato de alquiler y una
    carta de la compañía de alquiler en su papel con membrete que lo autorice a usted
    y a su patrocinador a utilizar el vehículo para un examen de manejo de licencia
    de conducir.
- id: 122
  category: vehicle_information
  question: ¿Qué tipo de placa de matrícula está estrictamente prohibida en un vehículo
    utilizado para un examen de conducción?
  choices:
    A: Placas de fuera del estado
    B: Placas de concesionario
    C: Placas agrícolas
    D: Placas de reparación
  answer: D
  explanation: 'El manual establece explícitamente: "No se le permitirá realizar un
    examen de conducción en un vehículo con una placa de reparación".'
- id: 123
  category: driver_testing
  question: ¿Cómo maneja el RMV los vehículos equipados con funciones especializadas,
    como cámaras de retroceso, durante un examen de conducción?
  choices:
    A: Los dispositivos deben desactivarse por completo antes de que comience el examen
    B: El vehículo será rechazado y el examen cancelado
    C: Los dispositivos no necesitan desactivarse, pero se evaluarán sus habilidades
      sin depender únicamente de ellos
    D: Es obligatorio utilizar estas funciones para aprobar el examen
  answer: C
  explanation: Las funciones especializadas, como las cámaras de retroceso, no necesitan
    desactivarse, pero el examinador evaluará sus habilidades y capacidades de conducción
    sin depender únicamente de estas funciones.
- id: 124
  category: driver_testing
  question: Durante el examen de conducción, ¿aproximadamente qué distancia le pedirá
    el examinador que retroceda el vehículo?
  choices:
    A: 20 pies
    B: 50 pies
    C: 100 pies
    D: 200 pies
  answer: B
  explanation: Durante un examen de conducción, debe estar preparado para demostrar
    su capacidad para retroceder el vehículo aproximadamente 50 pies.
- id: 125
  category: driver_testing
  question: Si usted es sordo o tiene dificultades auditivas, ¿quién organiza un intérprete
    para su examen de conducción?
  choices:
    A: El solicitante debe contratar a su propio intérprete
    B: El patrocinador debe actuar como intérprete
    C: La Comisión para Sordos y Personas con Dificultades Auditivas
    D: El examinador del RMV asignado al examen
  answer: C
  explanation: Una vez reservado el examen, el Departamento de Licencias de Conducir
    se comunicará con la Comisión para Sordos y Personas con Dificultades Auditivas
    para organizar un intérprete.
- id: 126
  category: driver_testing
  question: ¿Cuál de las siguientes se menciona como una razón común para reprobar
    un examen de conducción?
  choices:
    A: Llegar exactamente a tiempo en lugar de 15 minutos antes
    B: No conocer las señales manuales
    C: Utilizar un vehículo con un freno de estacionamiento ubicado en el centro
    D: Pagar las tarifas del examen de conducción en línea
  answer: B
  explanation: No conocer las señales manuales figura explícitamente en el manual
    bajo la sección de "Razones comunes para reprobar un examen de conducción".
- id: 127
  category: vehicle_information
  question: ¿Un vehículo no puede utilizarse para un examen de conducción si tiene
    cuál de los siguientes?
  choices:
    A: Una cámara de retroceso
    B: Un neumático tipo "dona" (repuesto de uso limitado)
    C: Un freno de estacionamiento ubicado en el centro
    D: Operación independiente guiada por GPS
  answer: B
  explanation: El manual establece que un vehículo no puede utilizarse para un examen
    de conducción si uno de sus neumáticos ha sido reemplazado por un neumático tipo
    "dona" (repuesto de uso limitado).
- id: 128
  category: driver_testing
  question: ¿Cuál es la regla con respecto a la conversación entre usted y su patrocinador
    durante el examen de conducción?
  choices:
    A: Pueden conversar libremente para ayudar a calmar sus nervios
    B: Su patrocinador puede darle instrucciones verbales sobre cómo estacionar
    C: Usted y su patrocinador no tienen permitido conversar a menos que el examinador
      lo autorice
    D: Debe comunicarse con su patrocinador utilizando únicamente señales manuales
  answer: C
  explanation: Durante el examen de conducción, usted y su patrocinador/intérprete
    no tienen permitido conversar a menos que el examinador lo autorice.
- id: 129
  category: driver_testing
  question: ¿Qué puede suceder si aprueba su examen de conducción pero no paga las
    tarifas de su licencia en un plazo de 60 días?
  choices:
    A: Su permiso de aprendizaje será revocado permanentemente.
    B: Es posible que deba volver a realizar el examen de conducción a su cargo.
    C: Se le cobrará un cargo por pago atrasado de $50.
    D: Su licencia temporal se extenderá automáticamente.
  answer: B
  explanation: Según el manual, si no paga dentro de los 60 días posteriores a la
    aprobación de su examen de conducción, es posible que deba volver a realizar el
    examen de conducción a su cargo.
- id: 130
  category: license_system
  question: ¿Puede el recibo que recibe en el Centro de Servicio del RMV utilizarse
    como una identificación con foto emitida por el estado para abordar un avión?
  choices:
    A: Sí, es válido para todos los viajes nacionales e internacionales.
    B: Sí, pero solo si se acompaña de un acta de nacimiento.
    C: No, el recibo no es válido para identificación.
    D: No, a menos que tenga un sello de viaje especial del RMV.
  answer: C
  explanation: El manual establece que el recibo sirve como una licencia temporal
    pero no es válido para identificación, lo que significa que la mayoría de las
    aerolíneas o barcos de crucero no lo aceptarán para viajar como una identificación
    con foto emitida por el estado.
- id: 131
  category: driver_responsibility
  question: ¿Dónde exige la ley de Massachusetts que guarde su licencia de conducir
    al operar un vehículo motorizado?
  choices:
    A: En la guantera del vehículo.
    B: Con usted o al alcance de la mano dentro de su vehículo.
    C: Exhibida visiblemente en el tablero.
    D: En un lugar seguro en su casa.
  answer: B
  explanation: Siempre que opere un vehículo motorizado en Massachusetts, la ley exige
    que lleve una licencia de conducir válida con usted o al alcance de la mano dentro
    de su vehículo.
- id: 132
  category: license_system
  question: ¿Al convertir una Licencia de Operador Junior (Junior Operator License)
    de otro estado, cuántas horas de conducción supervisada debe registrar si NO ha
    completado un programa de desarrollo de habilidades de conducción?
  choices:
    A: 20 horas
    B: 30 horas
    C: 40 horas
    D: 50 horas
  answer: C
  explanation: El manual requiere que registre 40 horas adicionales de conducción
    supervisada, las cuales se reducen a 30 horas solo si completó un programa de
    desarrollo de habilidades de conducción.
- id: 133
  category: license_system
  question: ¿Bajo qué condición estará exento de la restricción de pasajeros al convertir
    una Licencia de Operador Junior (Junior Operator License) de otro estado?
  choices:
    A: Si tiene al menos 17 años de edad.
    B: Si ha tenido una licencia válida durante seis meses completos sin suspensión
      ni revocación.
    C: Si aprueba un examen escrito en Massachusetts.
    D: Si ha completado 50 horas de conducción supervisada.
  answer: B
  explanation: Si su historial de conducción indica que ha tenido una licencia válida
    durante seis meses completos, sin suspensión ni revocación, no estará sujeto a
    la restricción de pasajeros.
- id: 134
  category: license_system
  question: Para ser elegible para convertir un permiso de aprendizaje de otro estado
    a un permiso de Massachusetts, ¿hace cuánto tiempo como máximo debe haber sido
    emitido el permiso de otro estado?
  choices:
    A: Hace seis meses
    B: Hace un año
    C: Hace dos años
    D: Hace cinco años
  answer: C
  explanation: Para ser elegible para la conversión del permiso, debe presentar el
    permiso actual de otro estado emitido hace menos de dos años.
- id: 135
  category: license_system
  question: ¿Por qué se requiere un registro de conducción certificado original al
    convertir una licencia de Canadá, México o un territorio de los EE. UU.?
  choices:
    A: Porque sus registros de conducción no están disponibles para revisión electrónica
      por parte del RMV a través del Sistema de Puntero de Conductores con Problemas
      (Problem Driver Pointer System).
    B: Porque sus exámenes de conducción no cumplen con los estándares mínimos de
      Massachusetts.
    C: Porque utilizan un sistema de clasificación de vehículos diferente.
    D: Porque no requieren un examen escrito para el permiso de aprendizaje.
  answer: A
  explanation: Se requiere un registro de conducción certificado original de estas
    jurisdicciones porque sus registros de conducción no están disponibles para revisión
    electrónica por parte del RMV a través del Sistema de Puntero de Conductores con
    Problemas (Problem Driver Pointer System).
- id: 136
  category: license_system
  question: ¿Un certificado de nacimiento de Puerto Rico solo será aceptado para identificación
    por el RMV si fue emitido en o después de qué fecha?
  choices:
    A: 1 de enero de 2000
    B: 11 de septiembre de 2001
    C: 1 de julio de 2010
    D: 1 de mayo de 2015
  answer: C
  explanation: El manual especifica que un certificado de nacimiento de Puerto Rico
    solo se aceptará para identificación si fue emitido el 1 de julio de 2010 o después.
- id: 137
  category: driver_responsibility
  question: ¿Qué edad debe tener un ciudadano estadounidense para registrarse para
    votar al realizar una transacción de permiso, licencia o identificación en Massachusetts?
  choices:
    A: Al menos 15 años de edad
    B: Al menos 16 años de edad
    C: Al menos 18 años de edad
    D: Al menos 21 años de edad
  answer: B
  explanation: 'El manual establece: ''Debe ser ciudadano de los EE. UU. y tener al
    menos 16 años para registrarse para votar''. (Debe tener al menos 18 años para
    votar realmente).'
- id: 138
  category: license_system
  question: ¿Cuál es la tarifa para agregar el indicador de 'Veterano' (Veteran) a
    su licencia de conducir o tarjeta de identificación de Massachusetts?
  choices:
    A: $5
    B: $10
    C: $15
    D: No hay tarifa adicional
  answer: D
  explanation: 'El manual establece explícitamente: ''No hay ningún cargo adicional
    por el Indicador de Veterano''.'
- id: 139
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para demostrar la baja
    honorable para el Indicador de Veterano?
  choices:
    A: Un formulario de Baja Honorable escrito a mano
    B: Un DD-214 escrito a máquina que indique baja honorable
    C: Una tarjeta de identificación militar estándar
    D: Una carta de recomendación de un oficial al mando
  answer: B
  explanation: Las pruebas aceptables incluyen un DD-214, DD-215 o un formulario de
    Baja Honorable. El manual señala que la información en el formulario debe estar
    escrita a máquina (no a mano).
- id: 140
  category: license_system
  question: ¿Qué representa el símbolo del corazón en una licencia de conducir o identificación
    de Massachusetts?
  choices:
    A: El conductor tiene una afección cardíaca médica.
    B: El conductor es un veterano de las Fuerzas Armadas de los EE. UU.
    C: El conductor está en el Registro de Donantes de Massachusetts y ha dado su
      consentimiento para la donación de órganos/tejidos.
    D: El conductor ha completado un programa avanzado de desarrollo de habilidades
      de conducción.
  answer: C
  explanation: El símbolo del corazón indica que usted está en el Registro de Donantes
    de Massachusetts y ha dado su consentimiento para la donación de órganos/tejidos.
- id: 141
  category: license_system
  question: Si actualmente es un donante de órganos registrado, ¿qué debe hacer al
    renovar su licencia o tarjeta de identificación para permanecer en el registro?
  choices:
    A: Pagar una tarifa adicional de $5.
    B: Marcar 'sí' en la pregunta uno del formulario de renovación de licencia o tarjeta
      de identificación.
    C: Presentar un nuevo formulario de evaluación médica.
    D: Tomarse una nueva fotografía en el RMV.
  answer: B
  explanation: 'El manual establece: ''Incluso si actualmente es un donante registrado,
    aún debe marcar ''sí'' en la pregunta uno del formulario de renovación de licencia
    o tarjeta de identificación para permanecer en el registro de donantes''.'
- id: 142
  category: driver_testing
  question: ¿Cuál es la política del RMV con respecto a la conducta violenta o abusiva
    por parte de los solicitantes del examen de manejo y sus patrocinadores?
  choices:
    A: Se emite una advertencia por la primera infracción.
    B: El solicitante debe pagar una multa antes de continuar con el examen.
    C: El RMV tiene una política de tolerancia cero.
    D: El examen de manejo se retrasa 30 días.
  answer: C
  explanation: 'El manual señala: ''El RMV tiene una política de tolerancia cero para
    la conducta violenta o abusiva por parte de los solicitantes del examen de manejo
    y sus patrocinadores''.'
- id: 143
  category: license_system
  question: ¿Puede ser donante de órganos y tejidos si actualmente no tiene el símbolo
    del corazón en su licencia o identificación?
  choices:
    A: Sí, puede registrarse en cualquier momento en línea y su nombre estará en la
      base de datos del Registro de Donantes.
    B: No, debe solicitar una nueva licencia con el símbolo de inmediato para ser
      donante.
    C: Sí, pero solo si lleva una tarjeta física de donante por separado en todo momento.
    D: No, el símbolo del corazón es legalmente requerido para autorizar la donación.
  answer: A
  explanation: 'El manual establece: ''Sí. Puede registrarse como donante de órganos/tejidos
    en cualquier momento en Mass.Gov/RMV. No necesita obtener una nueva licencia/identificación.
    Su licencia/identificación no tendrá el símbolo del corazón, pero su nombre estará
    en la base de datos del Registro de Donantes''.'
- id: 144
  category: license_system
  question: ¿Necesita llevar una tarjeta de donante por separado si tiene el símbolo
    del corazón en su licencia de Massachusetts?
  choices:
    A: Sí, en todo momento.
    B: Sí, pero solo cuando conduzca fuera del estado.
    C: No, el símbolo del corazón indica que usted está en el Registro de Donantes.
    D: No, a menos que sea menor de 18 años.
  answer: C
  explanation: Según el manual, no es necesario llevar una tarjeta de donante si tiene
    el símbolo del corazón en su licencia, ya que este indica que usted está en el
    Registro de Donantes de Massachusetts.
- id: 145
  category: license_system
  question: ¿Con cuánta antelación debe cancelar una cita para el examen de manejo
    para evitar que se le cobre el cargo de $35?
  choices:
    A: 24 horas
    B: 48 horas
    C: 72 horas
    D: 1 semana
  answer: C
  explanation: El manual establece que si cancela su cita con menos de 72 horas de
    antelación, se le seguirá cobrando el cargo de $35.
- id: 146
  category: license_system
  question: ¿Qué grupo está exento de pagar los cargos por trámites de la licencia
    de conducir en Massachusetts?
  choices:
    A: Personas mayores de 65 años
    B: Veteranos discapacitados con placas de Veterano Discapacitado o que califiquen
      para ellas
    C: Personal militar en servicio activo
    D: Empleados estatales
  answer: B
  explanation: Los veteranos discapacitados no pagan ningún cargo por los trámites
    de la licencia de conducir si tienen placas de Veterano Discapacitado o si han
    calificado para ellas a través de Asuntos Médicos (Medical Affairs).
- id: 147
  category: vehicle_information
  question: ¿Qué debe hacer si las señales direccionales o las luces de freno de su
    vehículo dejan de funcionar?
  choices:
    A: Conducir solo durante las horas del día.
    B: Usar señales manuales al girar o disminuir la velocidad hasta que se reparen.
    C: Encender las luces de emergencia (hazards) de forma continua.
    D: Dejar de conducir el vehículo inmediatamente y pedir una grúa.
  answer: B
  explanation: Si las señales direccionales o las luces de freno de su vehículo dejan
    de funcionar, debe repararlas de inmediato y usar señales manuales al girar o
    disminuir la velocidad hasta que estén arregladas.
- id: 148
  category: vehicle_information
  question: ¿Cuál de las siguientes es una restricción legal sobre el polarizado (tintado)
    de vidrios para vehículos de pasajeros?
  choices:
    A: No puede polarizar las ventanas laterales en absoluto.
    B: Puede oscurecer su parabrisas hasta un 35 por ciento.
    C: Es ilegal polarizar el parabrisas.
    D: Las ventanas traseras se pueden oscurecer hasta un 50 por ciento.
  answer: C
  explanation: El manual establece que se pueden oscurecer las ventanas laterales
    y traseras hasta un 35 por ciento, pero es ilegal polarizar el parabrisas.
- id: 149
  category: penalties_and_points
  question: ¿Cuál es la multa para un conductor que no lleva puesto el cinturón de
    seguridad?
  choices:
    A: $25
    B: $35
    C: $50
    D: $100
  answer: A
  explanation: Cualquier conductor que no lleve puesto el cinturón de seguridad puede
    ser multado con $25.
- id: 150
  category: penalties_and_points
  question: Según la ley de Massachusetts, un conductor puede ser multado con $25
    por ¿cuál de los siguientes pasajeros que no lleve puesto el cinturón?
  choices:
    A: Cualquier pasajero mayor de 18 años
    B: Un pasajero que tenga 16 o 17 años
    C: Cada pasajero de 12, 13, 14 o 15 años
    D: Pasajeros que viajen en un taxi
  answer: C
  explanation: Un conductor puede ser multado con $25 por cada pasajero de 12, 13,
    14 o 15 años que no lleve puesto el cinturón de seguridad. Los pasajeros de 16
    años o más son multados directamente.
- id: 151
  category: safe_driving_rules
  question: ¿Cuál de las siguientes personas está obligada a usar el cinturón de seguridad
    según la ley de Massachusetts?
  choices:
    A: El conductor de un vehículo fabricado antes de julio de 1966
    B: Un pasajero en un vehículo de emergencia
    C: El conductor de un vehículo motorizado de pasajeros de menos de 18,000 libras
    D: Un empleado del Servicio Postal de los EE. UU. que conduce mientras trabaja
  answer: C
  explanation: La ley de Massachusetts exige que toda persona en un vehículo motorizado
    de pasajeros (incluidas camionetas y camiones pequeños de menos de 18,000 libras)
    use el cinturón de seguridad. Las otras opciones figuran como exenciones específicas.
- id: 152
  category: safe_driving_rules
  question: Los bebés y niños pequeños deben sentarse en sistemas de retención infantil
    aprobados por el gobierno federal hasta que alcancen ¿qué edad o estatura?
  choices:
    A: 6 años de edad o 50 pulgadas de estatura
    B: 7 años de edad o 54 pulgadas de estatura
    C: 8 años de edad o 57 pulgadas de estatura
    D: 9 años de edad o 60 pulgadas de estatura
  answer: C
  explanation: Los bebés y niños pequeños deben sentarse en sistemas de retención
    infantil aprobados por el gobierno federal hasta que tengan al menos ocho años
    de edad o al menos cincuenta y siete pulgadas de estatura.
- id: 153
  category: safe_driving_rules
  question: ¿Cuál es el lugar más seguro para que un niño se siente en un vehículo
    de pasajeros?
  choices:
    A: El asiento del pasajero delantero
    B: El asiento central trasero
    C: El asiento trasero derecho
    D: El asiento trasero izquierdo
  answer: B
  explanation: El manual establece que el lugar más seguro para que un niño se siente
    es en el asiento trasero, y el asiento central trasero es el mejor.
- id: 154
  category: safe_driving_rules
  question: Según la Guía de Asientos de Seguridad para Niños, ¿cuál es el límite
    de peso para un asiento de bebé?
  choices:
    A: Hasta 15 libras
    B: Hasta 20 libras
    C: De 20 a 40 libras
    D: De 40 a 80 libras
  answer: B
  explanation: La Guía de Asientos de Seguridad para Niños especifica que un asiento
    de bebé es para niños de hasta 20 libras.
- id: 155
  category: defensive_driving
  question: 'Cuando se usan correctamente, los cinturones de seguridad reducen la
    probabilidad de muerte o lesiones graves en un choque en aproximadamente un:'
  choices:
    A: 25 por ciento
    B: 50 por ciento
    C: 75 por ciento
    D: 90 por ciento
  answer: B
  explanation: Cuando se usan correctamente, los cinturones de seguridad reducen la
    probabilidad de muerte o lesiones graves en un choque en aproximadamente un 50
    por ciento.
- id: 156
  category: vehicle_information
  question: ¿Cuántas luces rojas de parada (freno) debe tener un vehículo de pasajeros
    en la parte trasera?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: C
  explanation: El manual establece que el vehículo debe tener tres luces rojas de
    parada (freno) en la parte trasera.
- id: 157
  category: driver_responsibility
  question: ¿Cómo se aplica la ley del cinturón de seguridad de Massachusetts?
  choices:
    A: Puede ser detenido y multado únicamente por no usar el cinturón de seguridad.
    B: Solo puede recibir una multa por la ley del cinturón de seguridad cuando es
      detenido por una infracción de tránsito.
    C: Las multas por el cinturón de seguridad solo se emiten si usted está involucrado
      en un choque.
    D: La policía utiliza cámaras de tráfico para emitir citaciones por el cinturón
      de seguridad por correo.
  answer: B
  explanation: El manual señala que solo puede recibir una multa por la ley del cinturón
    de seguridad cuando es detenido por una infracción de tránsito (aplicación secundaria).
- id: 158
  category: vehicle_information
  question: ¿Cuál es la restricción para el uso de un faro buscador (spot light) en
    un vehículo de pasajeros?
  choices:
    A: Solo puede usarse para leer señales o como luz de emergencia si los faros delanteros
      están rotos.
    B: Puede usarse en cualquier momento para mejorar la visibilidad en la niebla.
    C: Debe brillar al menos cuatro pies por encima de la calzada.
    D: Puede usarse para advertir a los conductores que vienen en sentido contrario
      sobre un peligro.
  answer: A
  explanation: Un vehículo de pasajeros puede tener un faro buscador que solo puede
    usarse para leer señales o como luz de emergencia si los faros delanteros no funcionan.
- id: 159
  category: safe_driving_rules
  question: ¿Cómo debe usarse correctamente un cinturón de seguridad de regazo?
  choices:
    A: Holgado a través del estómago
    B: Bajo, ajustado y plano sobre las caderas
    C: Debajo del brazo y a través del pecho
    D: Ajustado a través de los muslos y las rodillas
  answer: B
  explanation: Según el manual, el cinturón de regazo debe quedar bajo, ajustado y
    plano sobre las caderas y no debe estar torcido.
- id: 160
  category: safe_driving_rules
  question: Según el manual, chocar contra el parabrisas a 30 mph es comparable a
    ¿qué?
  choices:
    A: Caer desde el techo de una casa de un piso
    B: Caer desde el tercer piso de un edificio
    C: Ser tacleado por un jugador de fútbol americano profesional
    D: Chocar contra una pared de ladrillos a 60 mph
  answer: B
  explanation: El manual establece que chocar contra el parabrisas a 30 mph es como
    caer desde el tercer piso de un edificio y golpear el pavimento.
- id: 161
  category: vehicle_information
  question: ¿Dónde debe colocarse a un bebé en un asiento de seguridad para niños
    orientado hacia atrás si el vehículo tiene una bolsa de aire (airbag) en el lado
    del pasajero?
  choices:
    A: En el asiento delantero con el asiento echado totalmente hacia atrás
    B: En el asiento delantero con la bolsa de aire desactivada
    C: En el asiento trasero del vehículo
    D: En el asiento delantero orientado hacia adelante
  answer: C
  explanation: El manual establece explícitamente que los bebés en asientos de seguridad
    para niños orientados hacia atrás nunca deben estar en el asiento delantero de
    un vehículo con bolsa de aire en el lado del pasajero. Los niños siempre están
    más seguros cuando viajan en el asiento trasero.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es la excepción legal para usar un tapón para los oídos mientras
    se conduce en Massachusetts?
  choices:
    A: Los conductores de cualquier edad pueden usar dos tapones si escuchan instrucciones
      de GPS
    B: Los conductores de 18 años o más pueden usar un tapón para usar con un teléfono
      celular
    C: Los conductores menores de 18 años pueden usar un tapón para escuchar música
    D: Cualquier conductor puede usar auriculares con cancelación de ruido para reducir
      el estrés
  answer: B
  explanation: Es ilegal usar un equipo de radio o auriculares que restrinjan la atención,
    pero si tiene 18 años o más, puede usar un tapón para los oídos para usar con
    un teléfono celular.
- id: 163
  category: vehicle_information
  question: ¿Cuál es la regla con respecto a los televisores instalados dentro de
    un vehículo motorizado?
  choices:
    A: Deben estar montados en el tablero para el pasajero delantero
    B: Pueden ser visibles para el conductor siempre que el volumen esté silenciado
    C: Deben estar detrás del asiento delantero y no ser visibles para el conductor
    D: Es completamente ilegal tenerlos en cualquier parte del vehículo
  answer: C
  explanation: Cualquier televisor instalado en un vehículo debe estar detrás del
    asiento delantero y no ser visible para el conductor para evitar distracciones.
- id: 164
  category: safe_driving_rules
  question: ¿Bajo qué condiciones se permite generalmente que los niños menores de
    12 años viajen en la caja de una camioneta (pickup)?
  choices:
    A: Cuando están acompañados por un adulto
    B: Cuando viajan por calles residenciales a cualquier velocidad
    C: No se les permite, con excepciones muy limitadas que nunca superan las 5 mph
    D: Cuando están sentados directamente sobre la caja de la camioneta
  answer: C
  explanation: No se permite que los niños menores de 12 años viajen en las cajas
    de las camionetas, con excepciones muy limitadas, y nunca a velocidades superiores
    a cinco mph.
- id: 165
  category: safe_driving_rules
  question: ¿Cuándo se le permite a un conductor de 18 años o más usar un dispositivo
    electrónico móvil portátil?
  choices:
    A: Cuando está detenido en un semáforo en rojo o en una señal de pare
    B: Cuando conduce a menos de 15 mph en tráfico pesado
    C: Cuando el vehículo está estacionario y no se encuentra en un carril de circulación
      pública
    D: Cuando se detiene en el arcén (hombro) de una autopista concurrida
  answer: C
  explanation: El uso de dispositivos portátiles solo está permitido si el vehículo
    está estacionario y no se encuentra en un carril de circulación pública. No se
    permite en semáforos en rojo, señales de pare o al costado de una calle o autopista
    concurrida.
- id: 166
  category: safe_driving_rules
  question: ¿Cuál es la ÚNICA excepción que permite a un conductor menor de 18 años
    usar un dispositivo electrónico móvil mientras conduce?
  choices:
    A: Para responder una llamada de un padre o tutor
    B: Para usar una aplicación de navegación GPS
    C: Para informar una emergencia
    D: Para cambiar la lista de reproducción de música mientras está detenido en un
      semáforo en rojo
  answer: C
  explanation: Los conductores menores de 18 años no pueden usar ningún dispositivo
    electrónico móvil por ningún motivo mientras conducen. La única excepción es para
    informar una emergencia.
- id: 167
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por usar un dispositivo
    electrónico móvil portátil mientras se conduce?
  choices:
    A: Una multa de $50
    B: Una multa de $100
    C: Una multa de $250 y un programa de conducción distraída
    D: Una suspensión de la licencia por 30 días
  answer: B
  explanation: La sanción por una primera infracción de violar la ley de dispositivos
    electrónicos móviles portátiles es una multa de $100.
- id: 168
  category: safe_driving_rules
  question: Según el manual, ¿a qué velocidades ocurren ocho de cada diez choques
    de vehículos motorizados?
  choices:
    A: 25 mph o menos
    B: 40 mph o menos
    C: 55 mph o menos
    D: 65 mph o más
  answer: B
  explanation: El manual establece que ocho de cada diez choques ocurren a velocidades
    de 40 mph o menos.
- id: 169
  category: vehicle_information
  question: ¿De qué tipo de choque están diseñadas específicamente para protegerle
    las bolsas de aire (airbags) delanteras?
  choices:
    A: Choques por alcance (traseros)
    B: Choques de impacto lateral
    C: Choques por vuelco
    D: Choques frontales
  answer: D
  explanation: Las bolsas de aire delanteras solo están fabricadas para choques frontales
    y no le protegen en choques laterales o traseros.
- id: 170
  category: safe_driving_rules
  question: ¿Cómo debe usar un dispositivo GPS o un teléfono celular para la navegación
    un conductor adulto?
  choices:
    A: Debe sostenerse en la mano derecha del conductor
    B: Debe estar fijado al vehículo de forma temporal o permanente
    C: Debe mantenerse en el asiento del pasajero
    D: Debe ser operado únicamente por un pasajero
  answer: B
  explanation: Los dispositivos GPS (incluidos los teléfonos celulares) se pueden
    usar si el dispositivo está fijado, ya sea de forma temporal o permanente, en
    el vehículo motorizado con el fin de proporcionar asistencia de navegación.
- id: 171
  category: defensive_driving
  question: ¿Por qué es importante mantener espacio alrededor de su vehículo mientras
    conduce?
  choices:
    A: Para permitir que los peatones crucen la calle en cualquier lugar
    B: Para evitar que otros conductores le adelanten
    C: En caso de que necesite cambiar de carril repentinamente para evitar un choque
    D: Para mejorar la eficiencia de combustible de su vehículo
  answer: C
  explanation: La conducción defensiva requiere que mantenga espacio alrededor de
    su vehículo en caso de que necesite cambiar de carril repentinamente para evitar
    un choque.
- id: 172
  category: driver_responsibility
  question: ¿Cuáles son las consecuencias si choca y lesiona a alguien o daña la propiedad
    porque estaba usando un dispositivo electrónico móvil?
  choices:
    A: Recibirá una advertencia y una multa pequeña
    B: Enfrentará cargos penales y perderá su licencia
    C: Solo tendrá que pagar por los daños a la propiedad
    D: Se le pedirá que vuelva a tomar el examen de conducir
  answer: B
  explanation: Es un delito lesionar a una persona o dañar la propiedad debido a una
    conducción negligente. Si choca porque estaba usando un dispositivo electrónico
    móvil, enfrentará cargos penales y perderá su licencia.
- id: 173
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por seguir a otro vehículo demasiado cerca (tailgating)?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: Seguir a otro vehículo demasiado cerca (tailgating) es ilegal y es
    la causa principal de los choques por alcance. La multa por esta infracción puede
    ser de hasta $100.
- id: 174
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    de su vehículo?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 2/32 de pulgada de profundidad
    de la banda de rodadura en los surcos adecuados y no presentar roturas de tejido
    ni cuerdas expuestas.
- id: 175
  category: safe_driving_rules
  question: ¿Cuándo está obligado a usar sus faros delanteros y luces traseras según
    la hora del día?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    B: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol
    C: Desde la puesta del sol hasta la salida del sol
    D: Solo cuando esté completamente oscuro afuera
  answer: B
  explanation: Debe usar sus faros delanteros y luces traseras desde media hora después
    de la puesta del sol hasta media hora antes de la salida del sol.
- id: 176
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de los faros durante el día?
  choices:
    A: Debe encender sus faros siempre que use los limpiaparabrisas.
    B: Las luces de circulación diurna son suficientes cuando está lloviendo.
    C: Los faros solo son obligatorios si no puede ver a 1,000 pies de distancia.
    D: Solo necesita usar los faros durante el día si conduce por una autopista.
  answer: A
  explanation: Debe usar sus faros siempre que use los limpiaparabrisas (las luces
    de circulación diurna no son suficientes).
- id: 177
  category: sharing_the_road
  question: ¿Cuánta distancia de seguimiento debe mantener detrás de una motocicleta?
  choices:
    A: Al menos dos segundos
    B: Al menos tres segundos
    C: Al menos cuatro segundos
    D: Al menos cinco segundos
  answer: C
  explanation: Debe mantener más espacio (al menos cuatro segundos) detrás de una
    motocicleta de lo que mantendría para otro vehículo.
- id: 178
  category: vehicle_information
  question: ¿Dónde deben colocarse las calcomanías de registro en su placa de matrícula?
  choices:
    A: En la esquina superior izquierda
    B: En la esquina inferior izquierda
    C: En la esquina superior derecha
    D: En la esquina inferior derecha
  answer: C
  explanation: Las calcomanías de registro solo deben colocarse en la esquina superior
    derecha de la placa.
- id: 179
  category: vehicle_information
  question: ¿Qué debe hacer si necesita detenerse rápidamente y su vehículo está equipado
    con frenos antibloqueo (ABS)?
  choices:
    A: Bombear los frenos rápidamente
    B: Nunca bombear los frenos
    C: Presionar ligeramente los frenos hasta detenerse
    D: Aplicar el freno de mano simultáneamente
  answer: B
  explanation: Si su vehículo tiene frenos antibloqueo (ABS), nunca bombee los frenos.
- id: 180
  category: defensive_driving
  question: Para evitar el deslumbramiento de los faros de los vehículos que vienen
    en sentido contrario por la noche, ¿hacia dónde debe mirar?
  choices:
    A: Directamente a los faros que vienen de frente
    B: Hacia el lado inferior izquierdo de su carril
    C: Hacia el lado inferior derecho de su carril
    D: A la línea central de la carretera
  answer: C
  explanation: Al conducir de noche, no mire directamente a los faros. Mire hacia
    el lado inferior derecho de su carril.
- id: 181
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si otro conductor lo sigue demasiado cerca
    (tailgating)?
  choices:
    A: Presione sus frenos ligeramente para advertirle
    B: Aumente la velocidad para incrementar la distancia
    C: Cámbiese a otro carril o hágase a un lado de la carretera para dejarlo pasar
    D: Encienda sus luces de emergencia y mantenga su velocidad
  answer: C
  explanation: Si alguien lo sigue demasiado cerca, cámbiese a otro carril o hágase
    a un lado de la carretera para dejar que el conductor pase.
- id: 182
  category: sharing_the_road
  question: En comparación con los vehículos de pasajeros, ¿cuánta distancia de frenado
    podrían requerir los camiones grandes?
  choices:
    A: La misma distancia de frenado
    B: Una vez y media la distancia de frenado
    C: Dos veces la distancia de frenado
    D: Tres veces la distancia de frenado
  answer: C
  explanation: Los camiones grandes pueden requerir dos veces la distancia de frenado
    de los vehículos de pasajeros.
- id: 183
  category: driver_responsibility
  question: ¿En cuál de las siguientes situaciones es apropiado usar la bocina?
  choices:
    A: Para intentar que un conductor más lento se mueva más rápido
    B: Para advertir a peatones u otros conductores de un posible problema
    C: Para mostrar enojo por el error de otro conductor
    D: Para intentar que otros vehículos se muevan en un embotellamiento
  answer: B
  explanation: Debe usar la bocina para advertir a los peatones u otros conductores
    de un posible problema o para evitar choques. No debe usarla para mostrar enojo,
    hacer que un conductor lento se mueva más rápido o en un embotellamiento.
- id: 184
  category: vehicle_information
  question: ¿Desde qué distancia debe ser visible el número de su placa de matrícula
    por la noche?
  choices:
    A: 30 pies
    B: 50 pies
    C: 60 pies
    D: 100 pies
  answer: C
  explanation: Sus placas de matrícula deben mantenerse limpias y sin obstrucciones,
    y el número de su placa debe ser visible desde 60 pies por la noche.
- id: 185
  category: defensive_driving
  question: ¿Cuál de los siguientes es un principio clave de la conducción defensiva
    con respecto al derecho de paso?
  choices:
    A: El derecho de paso es algo que siempre debe tomar si la ley lo permite.
    B: El derecho de paso es algo que usted cede para evitar situaciones de tráfico
      inseguras.
    C: El derecho de paso pertenece al vehículo más grande.
    D: El derecho de paso debe determinarse por quién llega primero a la intersección,
      sin excepción.
  answer: B
  explanation: Recuerde que el derecho de paso es algo que usted cede. Una gran parte
    de la conducción defensiva es ceder el derecho de paso para evitar situaciones
    de tráfico inseguras.
- id: 186
  category: vehicle_information
  question: ¿A qué distancia aproximada hacia adelante le permiten ver normalmente
    las luces altas?
  choices:
    A: 150 pies
    B: 250 pies
    C: 350 pies
    D: 500 pies
  answer: C
  explanation: Las luces altas normalmente le permiten ver a unos 350 pies de distancia.
- id: 187
  category: vehicle_information
  question: ¿Con qué frecuencia debe ser inspeccionado su vehículo de pasajeros o
    motocicleta para seguridad y emisiones?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada dos años
    D: Solo cuando vende el vehículo
  answer: B
  explanation: Su vehículo de pasajeros o motocicleta debe ser inspeccionado por seguridad
    y emisiones cada año.
- id: 188
  category: safe_driving_rules
  question: ¿Cuándo debe cambiar sus luces altas a luces bajas?
  choices:
    A: A menos de 300 pies de un vehículo que viene en sentido contrario o a 100 pies
      de un vehículo que va adelante
    B: A menos de 500 pies de un vehículo que viene en sentido contrario o a 200 pies
      de un vehículo que va adelante
    C: A menos de 400 pies de un vehículo que viene en sentido contrario o a 300 pies
      de un vehículo que va adelante
    D: A menos de 200 pies de un vehículo que viene en sentido contrario o a 500 pies
      de un vehículo que va adelante
  answer: B
  explanation: El manual establece que debe cambiar sus luces altas a luces bajas
    cuando se encuentre a menos de 500 pies de un vehículo que viene en sentido contrario
    o a menos de 200 pies de un vehículo que circula delante de usted.
- id: 189
  category: defensive_driving
  question: Si un conductor que viene en sentido contrario no cambia sus luces altas
    a bajas, ¿hacia dónde debe mirar para evitar el deslumbramiento?
  choices:
    A: Directamente a los faros que vienen en sentido contrario
    B: Hacia el lado superior izquierdo de su carril
    C: Hacia el lado inferior derecho de su carril
    D: A su espejo retrovisor interior
  answer: C
  explanation: 'Para reducir el deslumbramiento de los faros que vienen en sentido
    contrario, el manual aconseja: "No mire directamente a los faros. Mire hacia el
    lado inferior derecho de su carril".'
- id: 190
  category: safe_driving_rules
  question: 'Según el manual, los choques por conducir con sueño involucran con mayor
    frecuencia:'
  choices:
    A: Múltiples vehículos colisionando en intersecciones durante la hora pico
    B: Un solo conductor que se sale de la carretera a una alta velocidad
    C: Colisiones por alcance en tráfico intermitente
    D: Peatones siendo atropellados en cruces peatonales
  answer: B
  explanation: El manual señala que los choques por conducir con sueño involucran
    con mayor frecuencia a un solo conductor (y sin pasajeros) que se sale de la carretera
    a una alta velocidad.
- id: 191
  category: safe_driving_rules
  question: ¿Qué le exige la ley que haga siempre que use los limpiaparabrisas?
  choices:
    A: Encender las luces de emergencia
    B: Usar solo las luces de circulación diurna
    C: Encender los faros delanteros y las luces traseras
    D: Conducir al menos 15 mph por debajo del límite de velocidad
  answer: C
  explanation: La ley exige que use los faros delanteros y las luces traseras siempre
    que use los limpiaparabrisas. Las luces de circulación diurna no son suficientes.
- id: 192
  category: defensive_driving
  question: ¿Si su vehículo comienza a deslizarse sobre el agua (hydroplane), cuál
    es la acción correcta a tomar?
  choices:
    A: Frenar inmediatamente
    B: Girar el volante repentinamente para recuperar tracción
    C: Soltar lentamente el pedal del acelerador y nunca frenar ni girar repentinamente
    D: Acelerar para atravesar el agua
  answer: C
  explanation: Si su vehículo comienza a deslizarse sobre el agua (hydroplane), debe
    soltar lentamente el pedal del acelerador. Nunca debe frenar ni girar repentinamente,
    ya que podría perder el control y derrapar.
- id: 193
  category: vehicle_information
  question: ¿Qué debe hacer después de conducir a través de un charco grande para
    asegurarse de que sus frenos funcionen correctamente?
  choices:
    A: Presionar los frenos ligeramente tan pronto como pueda para secarlos
    B: Bombear los frenos rápidamente durante 30 segundos
    C: Detenerse a un lado y esperar a que los frenos se sequen al aire
    D: Acelerar rápidamente para que el agua salga de las pastillas de freno
  answer: A
  explanation: Los frenos mojados no funcionan bien. Si conduce a través de un charco
    grande, el manual aconseja presionar los frenos ligeramente tan pronto como pueda
    para secarlos hasta que sienta que vuelven a funcionar normalmente.
- id: 194
  category: defensive_driving
  question: ¿Por qué los puentes y los pasos elevados de las autopistas se congelan
    antes que el resto de la carretera?
  choices:
    A: Están expuestos a más viento que las carreteras normales
    B: El suelo no los aísla
    C: Generalmente están hechos de concreto más liso
    D: Las quitanieves no pueden limpiarlos eficazmente
  answer: B
  explanation: Los puentes y los pasos elevados de las autopistas se congelan antes
    que el resto de la carretera y pueden estar muy resbaladizos porque el suelo no
    los aísla.
- id: 195
  category: penalties_and_points
  question: ¿Cuál es una consecuencia potencial de no limpiar todo el hielo y la nieve
    del techo, el capó y el maletero de su vehículo antes de conducir?
  choices:
    A: Su vehículo no pasará la inspección anual
    B: Puede ser acusado de operación negligente
    C: Su licencia será suspendida automáticamente por 30 días
    D: Se le requerirá tomar un curso de conducción en invierno
  answer: B
  explanation: Es muy importante limpiar el techo, el capó y el maletero para que
    el hielo y la nieve no salgan volando hacia los vehículos que vienen detrás. Si
    no lo hace, puede ser acusado de operación negligente.
- id: 196
  category: vehicle_information
  question: ¿Por qué debe mantener su tanque de gasolina al menos a la mitad durante
    la conducción en invierno?
  choices:
    A: Para añadir peso extra al vehículo para una mejor tracción
    B: Para evitar que la línea de gasolina se congele
    C: Para asegurar que la calefacción funcione a su máxima capacidad
    D: Para evitar pagar precios de combustible de invierno más altos
  answer: B
  explanation: Durante la conducción en invierno, debe mantener su tanque de gasolina
    al menos a la mitad para evitar que la línea de gasolina se congele.
- id: 197
  category: sharing_the_road
  question: Según la Ley de Usuarios Vulnerables de la Vía Pública, ¿cuál es la distancia
    mínima de seguridad que debe dejar al rebasar entre su vehículo y un usuario vulnerable?
  choices:
    A: Al menos dos pies
    B: Al menos tres pies
    C: Al menos cuatro pies
    D: Al menos seis pies
  answer: C
  explanation: Cuando rebasa a un usuario vulnerable de la vía pública, debe dejar
    una distancia de seguridad de al menos cuatro pies entre su vehículo y el usuario
    de la vía.
- id: 198
  category: sharing_the_road
  question: ¿Cuál de los siguientes se considera un 'usuario vulnerable de la vía
    pública' según la ley de Massachusetts?
  choices:
    A: Un conductor en un automóvil compacto
    B: Una persona montando a caballo o en un carruaje tirado por caballos
    C: Un pasajero en un autobús comercial
    D: Un conductor operando una quitanieves
  answer: B
  explanation: La ley de Massachusetts define a los 'usuarios vulnerables de la vía
    pública' para incluir a peatones, trabajadores viales, ciclistas y personas que
    montan a caballo o en carruajes tirados por caballos, entre otros.
- id: 199
  category: sharing_the_road
  question: Según la Ley del Bastón Blanco (White Cane Law), ¿qué debe hacer ante
    un peatón ciego que cruza una calle?
  choices:
    A: Tocar la bocina ligeramente para que sepan que usted está allí
    B: Detenerse por completo y permanecer detenido hasta que la persona haya cruzado
      con seguridad
    C: Hacerle señas a la persona para que sepa que es seguro cruzar
    D: Reducir la velocidad y maniobrar con cuidado alrededor de ellos
  answer: B
  explanation: La Ley del Bastón Blanco le exige detenerse por completo ante un peatón
    ciego que cruza una calle. Debe permanecer detenido hasta que la persona haya
    cruzado con seguridad, y nunca debe tocar la bocina ni hacer señas a la persona
    para que avance.
- id: 200
  category: sharing_the_road
  question: ¿Cómo puede identificar visualmente a un peatón que es sordo o tiene dificultades
    auditivas?
  choices:
    A: Siempre llevarán un bastón blanco
    B: Se les exige usar un chaleco amarillo reflectante
    C: Estarán acompañados por un perro guía
    D: Es imposible identificar visualmente a alguien que es sordo o tiene dificultades
      auditivas
  answer: D
  explanation: 'El manual establece explícitamente: ''Es imposible identificar visualmente
    a alguien que es sordo o tiene dificultades auditivas''.'
- id: 201
  category: sharing_the_road
  question: ¿Por qué es importante reducir la velocidad al rebasar una bicicleta o
    un ciclomotor (moped)?
  choices:
    A: El viento causado por su vehículo puede hacer que el conductor pierda el equilibrio
    B: Le permite comunicarse con el conductor
    C: Evita que el ruido de su motor asuste al conductor
    D: Los ciclomotores están obligados legalmente a viajar a velocidades muy bajas
  answer: A
  explanation: Al rebasar una bicicleta o un ciclomotor, debe reducir su velocidad
    porque el viento causado por su vehículo puede hacer que el conductor pierda el
    equilibrio.
- id: 202
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar al conducir con niebla y por qué?
  choices:
    A: Luces altas para ver lo más lejos posible
    B: Luces bajas para reducir el deslumbramiento
    C: Luces de circulación diurna para ahorrar batería
    D: Luces de estacionamiento para evitar cegar a otros conductores
  answer: B
  explanation: El manual establece que, en condiciones de niebla, debe usar las luces
    bajas para reducir el deslumbramiento.
- id: 203
  category: sharing_the_road
  question: ¿Qué debe hacer al rebasar una bicicleta o un ciclomotor (moped) en la
    carretera?
  choices:
    A: Tocar la bocina para alertarles de que se aparten.
    B: Reducir la velocidad porque el viento causado por su vehículo puede hacer que
      el conductor pierda el equilibrio.
    C: Acelerar para rebasarlos lo más rápido posible.
    D: Moverse a su carril para obligarlos a ir al arcén.
  answer: B
  explanation: El manual establece que al rebasar una bicicleta o un ciclomotor, debe
    reducir la velocidad porque el viento causado por su vehículo puede hacer que
    el conductor pierda el equilibrio.
- id: 204
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento recomendada que debe dejar entre
    su vehículo y una motocicleta delante de usted?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: C
  explanation: El manual aconseja usar una distancia de seguimiento de cuatro segundos
    cuando se circula detrás de una motocicleta, en comparación con la distancia de
    tres segundos para otros vehículos motorizados.
- id: 205
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a compartir
    un carril con una motocicleta?
  choices:
    A: Puede compartir un carril si este es lo suficientemente ancho.
    B: Nunca debe compartir un carril con una motocicleta.
    C: Puede compartir un carril si el motociclista circula hacia un lado.
    D: Las motocicletas están obligadas a compartir carriles con otras motocicletas.
  answer: B
  explanation: El manual establece que nunca debe compartir un carril con una motocicleta,
    incluso si el carril es ancho y el motociclista circula hacia un lado, ya que
    invadir un carril es ilegal y muy peligroso.
- id: 206
  category: sharing_the_road
  question: ¿Qué acción común de los conductores de automóviles o camiones causa muchos
    choques con motocicletas en las intersecciones?
  choices:
    A: Girar a la derecha con luz roja
    B: Girar a la izquierda frente a una motocicleta que viene en sentido contrario
    C: Detenerse demasiado rápido en una señal de alto
    D: No usar las señales de giro al cambiar de carril
  answer: B
  explanation: Según el manual, los automóviles o camiones que giran a la izquierda
    frente a una motocicleta que viene en sentido contrario causan muchos choques
    en las intersecciones.
- id: 207
  category: safe_driving_rules
  question: Al operar una bicicleta motorizada (ciclomotor o moped), ¿cuál es la velocidad
    máxima a la que se le permite conducir legalmente?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: 'Las reglas para conducir un ciclomotor establecen explícitamente:
    ''No conduzca a más de 25 mph''.'
- id: 208
  category: safe_driving_rules
  question: Si está operando un ciclomotor (moped) con un permiso de aprendizaje,
    ¿cuál es la regla con respecto a los pasajeros?
  choices:
    A: Puede llevar a un pasajero si este usa casco.
    B: Puede llevar a un pasajero solo si es mayor de 18 años.
    C: No debe llevar a ningún pasajero.
    D: Solo puede llevar pasajeros en caminos recreativos fuera de la calle.
  answer: C
  explanation: El manual establece explícitamente que al operar un ciclomotor con
    un permiso de aprendizaje, no debe llevar a ningún pasajero.
- id: 209
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera sobre el registro de
    un escúter motorizado (motorized scooter) en Massachusetts?
  choices:
    A: Debe registrarse como una motocicleta.
    B: Debe registrarse si tiene un motor de gasolina.
    C: El Registro de Vehículos Motorizados (RMV) no registrará escúteres motorizados.
    D: Requiere un registro especial para vehículos de baja velocidad.
  answer: C
  explanation: 'El manual establece: ''El Registro de Vehículos Motorizados no registrará
    escúteres motorizados''.'
- id: 210
  category: safe_driving_rules
  question: ¿Cuándo se le prohíbe conducir un escúter motorizado (motorized scooter)?
  choices:
    A: Durante las horas pico de tráfico
    B: Después del atardecer o antes del amanecer
    C: Los fines de semana
    D: Cuando está lloviendo
  answer: B
  explanation: Las reglas para conducir un escúter motorizado establecen que 'No debe
    conducir después del atardecer o antes del amanecer'.
- id: 211
  category: safe_driving_rules
  question: 'Un vehículo de uso limitado (limited use vehicle) no puede conducirse
    en ninguna carretera con un límite de velocidad superior a:'
  choices:
    A: 30 mph
    B: 40 mph
    C: 50 mph
    D: 55 mph
  answer: B
  explanation: El manual establece que no se puede conducir un vehículo de uso limitado
    en una autopista estatal de acceso limitado o expresa, ni en ninguna carretera
    con un límite de velocidad superior a 40 mph.
- id: 212
  category: license_system
  question: ¿Qué tipo de licencia de conducir o permiso se requiere para conducir
    un Vehículo de Baja Velocidad (LSV)?
  choices:
    A: Clase M
    B: Clase D
    C: Licencia de Conducir Comercial (CDL)
    D: No se requiere licencia
  answer: B
  explanation: 'El manual establece: ''Debe tener una licencia de conducir Clase D
    o un permiso de aprendizaje válido para conducir un vehículo de baja velocidad''.'
- id: 213
  category: penalties_and_points
  question: Si un ciclista es citado por un oficial de policía por una infracción
    de tránsito, ¿cómo afecta esto a su historial de conducción?
  choices:
    A: Agrega puntos a su historial de conducción.
    B: Resultará en la suspensión de la licencia.
    C: No afectará su historial de conducción.
    D: Cuenta como una infracción penal.
  answer: C
  explanation: El manual establece que si un ciclista comete una infracción de tránsito,
    'El ciclista puede ser multado, pero esto no afectará su historial de conducción'.
- id: 214
  category: driver_responsibility
  question: ¿Qué puede suceder si un ciclista se niega a dar su nombre y dirección
    reales a un oficial de policía cuando se le solicita?
  choices:
    A: Puede ser arrestado.
    B: Su bicicleta puede ser confiscada permanentemente.
    C: Su licencia de conducir será revocada de inmediato.
    D: Se le prohibirá andar en bicicleta durante un año.
  answer: A
  explanation: 'El manual establece: ''Un ciclista también puede ser arrestado por
    negarse a dar su nombre''.'
- id: 215
  category: penalties_and_points
  question: ¿Cuál de los siguientes es uno de los tres tipos de eventos enumerados
    en el manual que pueden causar la pérdida de sus privilegios de conducción?
  choices:
    A: Recibir una multa de estacionamiento
    B: Accidentes de vehículos motorizados en los que se determine que usted tiene
      más del 50 por ciento de la culpa
    C: No renovar el registro de su vehículo a tiempo
    D: Conducir una motoneta (scooter) motorizada sin casco
  answer: B
  explanation: 'El manual enumera tres eventos que pueden causar la pérdida de los
    privilegios de conducción: infracciones civiles de vehículos motorizados, infracciones
    penales y accidentes de vehículos motorizados en los que se determine que usted
    tiene más del 50 por ciento de la culpa.'
- id: 216
  category: license_system
  question: ¿No puede renovar una licencia de conducir vencida si tiene cuál de los
    siguientes?
  choices:
    A: Infracciones de estacionamiento impagas
    B: Una sola advertencia por exceso de velocidad
    C: Una motoneta (scooter) motorizada registrada
    D: Un permiso de aprendizaje Clase M
  answer: A
  explanation: 'El manual establece: ''No puede renovar una licencia vencida si tiene
    infracciones de estacionamiento impagas, impuestos especiales (excise taxes) impagos,
    órdenes judiciales pendientes, infracciones pendientes de E-ZPass/Fast Lane o
    infracciones del Puente Tobin''.'
- id: 217
  category: sharing_the_road
  question: ¿Qué debe hacer si conduce de noche y un ciclista viene hacia usted?
  choices:
    A: Encender las luces altas para advertirles de su presencia.
    B: Bajar la intensidad de sus faros (usar luces cortas).
    C: Apagar sus faros temporalmente.
    D: Tocar la bocina.
  answer: B
  explanation: 'El manual instruye a los conductores a: ''Bajar la intensidad de sus
    faros (luces cortas) por la noche si un ciclista viene hacia usted''.'
- id: 218
  category: penalties_and_points
  question: ¿Cuál es una consecuencia de tener infracciones de estacionamiento impagas
    en Massachusetts?
  choices:
    A: Su vehículo será confiscado de inmediato.
    B: No puede renovar su licencia de conducir ni el registro de su vehículo.
    C: Se le acusará de un delito penal.
    D: Sus tarifas de seguro se duplicarán automáticamente.
  answer: B
  explanation: Según el manual, si no paga una infracción de estacionamiento, no podrá
    renovar su licencia de conducir ni el registro de su vehículo.
- id: 219
  category: penalties_and_points
  question: ¿Cuántos días tiene para pagar la multa requerida o solicitar una audiencia
    por una infracción civil de vehículos motorizados (CMVI)?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: B
  explanation: Si recibe una citación de un oficial de policía por una infracción
    civil de vehículos motorizados (CMVI), debe pagar la multa requerida o solicitar
    una audiencia para impugnarla dentro de los 20 días.
- id: 220
  category: penalties_and_points
  question: ¿Qué sucede con la tarifa de presentación de $25 si solicita una audiencia
    por una citación civil y el tribunal lo declara NO RESPONSABLE de TODAS las infracciones?
  choices:
    A: Se mantiene como una tarifa administrativa.
    B: Se aplica a su próximo registro de vehículo.
    C: Se le reembolsa.
    D: Se dona al Fondo Fiduciario de Servicios de Tratamiento de Lesiones en la Cabeza.
  answer: C
  explanation: Si el tribunal lo declara NO RESPONSABLE de TODAS las infracciones
    en la citación civil, se le reembolsará la tarifa de presentación de $25.
- id: 221
  category: safe_driving_rules
  question: ¿Cuál es la sanción mínima por conducir por encima del límite de velocidad
    en Massachusetts?
  choices:
    A: $50
    B: $75
    C: $105
    D: $150
  answer: C
  explanation: La sanción mínima por conducir por encima del límite de velocidad es
    una multa de $105.
- id: 222
  category: penalties_and_points
  question: Si conduce a más de 10 millas por hora (mph) por encima del límite de
    velocidad, ¿cuánto debe pagar por cada mph adicional por encima de las primeras
    10?
  choices:
    A: $5
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: Si conduce a más de diez millas por hora (mph) por encima del límite
    de velocidad, debe pagar $10 adicionales por cada mph que viajaba por encima de
    las primeras diez.
- id: 223
  category: penalties_and_points
  question: Por ley, todas las multas por infracciones de exceso de velocidad incluyen
    un recargo de $50 que se destina a ¿cuál de los siguientes?
  choices:
    A: El Fondo de Mantenimiento de Carreteras
    B: El Fondo Fiduciario de Servicios de Tratamiento de Lesiones en la Cabeza
    C: El Fondo de Capacitación en Seguridad Pública
    D: El Plan de Seguro para Conductores Seguros
  answer: B
  explanation: Por ley, todas las multas por infracciones de exceso de velocidad incluyen
    un recargo de $50. La totalidad del recargo se destina al Fondo Fiduciario de
    Servicios de Tratamiento de Lesiones en la Cabeza (Head Injury Treatment Services
    Trust Fund).
- id: 224
  category: safe_driving_rules
  question: ¿Qué sucede con la multa por exceso de velocidad si lo sorprenden excediendo
    el límite en una zona de obras señalizada?
  choices:
    A: Se duplica.
    B: Se triplica.
    C: Se agregan $100 adicionales.
    D: Su licencia es revocada inmediatamente.
  answer: A
  explanation: Si lo sorprenden excediendo el límite de velocidad en una zona de obras
    señalizada, la multa por exceso de velocidad se duplica.
- id: 225
  category: penalties_and_points
  question: ¿Su licencia será suspendida por 30 días si es declarado culpable de cuántas
    infracciones por exceso de velocidad en un período de 12 meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Su licencia será suspendida por 30 días si es declarado culpable de
    tres infracciones por exceso de velocidad en un período de 12 meses.
- id: 226
  category: penalties_and_points
  question: Si tiene una Licencia de Operador Junior (Junior Operator's License),
    ¿cuál es la sanción por una primera infracción por exceso de velocidad?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una suspensión de la licencia por 60 días
    C: Una suspensión de la licencia por 90 días
    D: Una suspensión de la licencia por un año
  answer: C
  explanation: Si tiene una Licencia de Operador Junior, una primera infracción causará
    una suspensión de la licencia por 90 días.
- id: 227
  category: driver_responsibility
  question: Un oficial de policía puede arrestarlo y usted puede enfrentar cargos
    penales si se niega a hacer ¿cuál de los siguientes?
  choices:
    A: Responder preguntas sobre su destino
    B: Firmar con su nombre frente al oficial
    C: Permitir que el oficial registre su maletero
    D: Realizar una prueba de alcoholemia en la carretera
  answer: B
  explanation: Un oficial de policía puede arrestarlo y usted puede enfrentar cargos
    penales si se niega a firmar con su nombre frente al oficial, mostrar su licencia
    o dar su nombre y dirección.
- id: 228
  category: penalties_and_points
  question: Se considera que usted tiene más del 50 por ciento de la culpa en un choque
    si su compañía de seguros lo encuentra culpable y ha pagado más de ¿qué cantidad
    por colisión o daños?
  choices:
    A: $500
    B: $1000
    C: $1500
    D: $2000
  answer: B
  explanation: Usted tiene más del 50 por ciento de la culpa en un choque si su compañía
    de seguros lo encuentra culpable de acuerdo con los Estándares de Culpa y ha pagado
    más de $1000 por colisión, colisión limitada o daños a la propiedad de otra persona.
- id: 229
  category: penalties_and_points
  question: Debe completar el Curso de Reentrenamiento para Conductores de Massachusetts
    si acumula ¿cuántos eventos con recargo (surchargeable events) en un período de
    dos años?
  choices:
    A: Dos
    B: Tres
    C: Cinco
    D: Siete
  answer: B
  explanation: Si tiene tres eventos con recargo en un período de dos años, su licencia
    puede ser suspendida y el RMV le enviará una carta indicándole que complete un
    curso de Reentrenamiento para Conductores.
- id: 230
  category: penalties_and_points
  question: ¿Cuál es la duración del programa de Reentrenamiento para Conductores
    para los conductores que han acumulado tres o más eventos con recargo?
  choices:
    A: Una sesión de cuatro horas
    B: Un programa de ocho horas
    C: Un programa de doce horas
    D: Dos sesiones de ocho horas
  answer: B
  explanation: El manual establece que el programa de Reentrenamiento para Conductores
    es un programa de ocho horas, que generalmente se lleva a cabo en dos sesiones
    de cuatro horas o en una sesión de ocho horas los sábados.
- id: 231
  category: penalties_and_points
  question: ¿Completar el curso de Reentrenamiento para Conductores elimina las infracciones
    o los recargos de su historial de manejo?
  choices:
    A: Sí, elimina la infracción más reciente.
    B: Sí, elimina todos los recargos.
    C: No, no elimina las infracciones ni los recargos.
    D: No, pero reduce la prima de su seguro a la mitad.
  answer: C
  explanation: Según el manual, completar el curso de Reentrenamiento para Conductores
    no elimina las infracciones ni los recargos de su historial de manejo.
- id: 232
  category: license_system
  question: ¿Cuál es el costo de un registro de conducir no certificado solicitado
    en línea?
  choices:
    A: $8
    B: $10
    C: $20
    D: $50
  answer: A
  explanation: El manual establece que si no necesita que el registro de conducir
    sea certificado, puede solicitar un registro de conducir no certificado en línea
    por $8.
- id: 233
  category: penalties_and_points
  question: Si lo sorprenden usando la licencia o identificación de otra persona,
    ¿por cuánto tiempo puede el RMV suspender sus privilegios de conducir incluso
    si no es condenado?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: El RMV puede suspender sus privilegios de conducir por seis meses (o
    un año después de una condena) por usar la licencia o identificación de otra persona,
    incluso si no es condenado.
- id: 234
  category: penalties_and_points
  question: Para un conductor de 18 años o más, ¿cuál es el período de suspensión
    obligatoria por tres infracciones por exceso de velocidad dentro de cualquier
    período de un año?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: A
  explanation: Para conductores de 18 años o más, tres infracciones por exceso de
    velocidad en un período de un año resultan en una suspensión obligatoria de 30
    días.
- id: 235
  category: penalties_and_points
  question: ¿Cuál de las siguientes situaciones convierte a un conductor en un 'Infractor
    de Tránsito Habitual' según la ley de Massachusetts?
  choices:
    A: Tres incidentes con recargo (surchargeable events) en un período de dos años
    B: Siete incidentes con recargo en un período de tres años
    C: Tres infracciones de tránsito graves (major moving violations) en un período
      de cinco años
    D: Tres infracciones por exceso de velocidad en un período de un año
  answer: C
  explanation: Un Infractor de Tránsito Habitual se define como aquel que tiene un
    total de tres infracciones de tránsito graves o cualquier combinación de doce
    infracciones de tránsito graves o leves dentro de un período de cinco años.
- id: 236
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión obligatoria para un Infractor de Tránsito
    Habitual?
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cuatro años
  answer: D
  explanation: El período de suspensión obligatoria para un Infractor de Tránsito
    Habitual es de cuatro años.
- id: 237
  category: penalties_and_points
  question: Si un Operador Junior (Junior Operator) es condenado por violar la restricción
    de pasajeros por primera vez, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Una condena por primera ofensa por violar la restricción de pasajeros
    o la restricción nocturna resulta en una suspensión de 60 días para un Operador
    Junior.
- id: 238
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión para un Operador Junior (Junior Operator)
    condenado por su primera infracción por exceso de velocidad?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una primera condena por exceso de velocidad para un Operador Junior
    resulta en una suspensión obligatoria de 90 días.
- id: 239
  category: penalties_and_points
  question: ¿Cuál de los siguientes es necesario para restablecer la licencia de un
    Operador Junior (Junior Operator) después de una primera condena por exceso de
    velocidad?
  choices:
    A: Pagar una tarifa de restablecimiento de $100
    B: Tomar un nuevo examen de permiso de aprendizaje y un nuevo examen de manejo
    C: Completar un programa de educación sobre el alcohol
    D: Cumplir una suspensión de un año
  answer: B
  explanation: El restablecimiento después de una primera condena por exceso de velocidad
    para un Operador Junior requiere un nuevo examen de permiso de aprendizaje, un
    curso de Reentrenamiento de Actitud del Conductor (Driver Attitudinal Retraining)
    y un nuevo examen de manejo.
- id: 240
  category: penalties_and_points
  question: Para un conductor de 18 años o más, ¿cuál es la sanción por acumular siete
    incidentes con recargo (surchargeable events) en un período de tres años?
  choices:
    A: Una suspensión de 30 días
    B: Una suspensión de 60 días
    C: Una suspensión de 90 días
    D: Una suspensión de cuatro años
  answer: B
  explanation: Cualquier combinación de infracciones de tránsito y choques con recargo
    que sumen siete incidentes con recargo en un período de tres años resulta en una
    suspensión de 60 días.
- id: 241
  category: penalties_and_points
  question: Según la ley de Massachusetts, ¿qué suspensión adicional se aplica a un
    Operador Junior (Junior Operator) condenado por una primera ofensa de Conducir
    para Poner en Peligro o Abandonar la Escena de un Choque?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: D
  explanation: Las Leyes Generales de Massachusetts, capítulo 90, sección 24p, requieren
    una suspensión de 180 días por una primera ofensa de Conducir para Poner en Peligro,
    Abandonar la Escena de un Choque y otras ofensas específicas para Operadores Junior,
    además de cualquier otra sanción requerida por la ley.
- id: 242
  category: penalties_and_points
  question: ¿Cuántas veces debe un Operador Junior (Junior Operator) tomar el curso
    de los Tribunales Estatales Contra la Furia al Volante (SCARR) si se le ordena?
  choices:
    A: Cada vez que cometan una infracción de tránsito
    B: Una vez al año
    C: Solo una vez
    D: Hasta que cumplan 21 años
  answer: C
  explanation: 'El manual establece: ''A un Operador Junior solo se le requerirá tomar
    el curso SCARR una vez''.'
- id: 243
  category: license_system
  question: ¿Cuál de los siguientes motivos no relacionados con la conducción puede
    causar que el RMV suspenda su licencia de conducir?
  choices:
    A: No pagar una multa de estacionamiento
    B: No pagar el impuesto sobre la renta de Massachusetts
    C: Abandonar la escuela secundaria
    D: No votar en una elección estatal
  answer: B
  explanation: La ley exige que el RMV suspenda la licencia de conducir por varios
    motivos no relacionados con la conducción, incluyendo si usted 'no ha pagado el
    impuesto sobre la renta de Massachusetts'.
- id: 244
  category: penalties_and_points
  question: Si su licencia es suspendida por realizar un pago fallido al RMV, ¿qué
    cargo adicional debe pagar para liquidar el pago fallido?
  choices:
    A: $15
    B: $35
    C: $50
    D: $100
  answer: A
  explanation: Si su licencia fue suspendida por un pago fallido, debe pagar el cargo
    original, una tarifa de reinstalación de la licencia y un cargo de $15 para liquidar
    su pago fallido.
- id: 245
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión de la licencia por una condena de homicidio
    con vehículo motorizado?
  choices:
    A: 1 a 5 años
    B: 5 a 10 años
    C: 15 años a cadena perpetua
    D: 10 años
  answer: C
  explanation: La tabla de delitos penales y suspensiones enumera el período de suspensión
    por homicidio con vehículo motorizado como '15 años a cadena perpetua'.
- id: 246
  category: penalties_and_points
  question: ¿Cuál es el cargo para reinstalar su licencia después de una tercera condena
    por operar bajo la influencia (OUI) de alcohol o drogas?
  choices:
    A: $500
    B: $700
    C: $1,000
    D: $1,200
  answer: D
  explanation: El cargo para reinstalar una licencia después de una tercera condena
    por operar bajo la influencia de alcohol o drogas es de $1,200.
- id: 247
  category: license_system
  question: Si su licencia es suspendida en otro estado, ¿qué documento debe llevar
    al RMV para demostrar que ha sido reinstalada?
  choices:
    A: Una carta de reinstalación o un registro de conducción que tenga menos de 30
      días de antigüedad
    B: Una carta firmada por un juez del otro estado
    C: Un recibo que demuestre que pagó sus multas fuera del estado
    D: Una nueva licencia de conducir del otro estado
  answer: A
  explanation: Cuando su licencia sea reinstalada en el otro estado, debe traer una
    carta de reinstalación o un registro de conducción actual de ese estado, el cual
    no puede tener más de 30 días de antigüedad.
- id: 248
  category: penalties_and_points
  question: ¿Cómo trata el RMV de Massachusetts las infracciones de tránsito que usted
    comete en otro estado?
  choices:
    A: Se ignoran a menos que involucren un choque.
    B: Se tratan como si hubieran ocurrido en Massachusetts si son una infracción
      'similar'.
    C: Solo resultan en una multa, no en una suspensión.
    D: Se registran pero no afectan su historial de conducción de Massachusetts.
  answer: B
  explanation: Cada estado de los EE. UU. debe informar al RMV de Massachusetts sobre
    cualquier infracción de tránsito que usted cometa allí. Estas infracciones se
    tratarán como si hubieran ocurrido en Massachusetts si son una infracción 'similar'.
- id: 249
  category: license_system
  question: ¿Qué debe hacer para reinstalar su licencia si ha estado suspendida por
    dos años o más?
  choices:
    A: Pagar una multa de $5,000.
    B: Completar 100 horas de servicio comunitario.
    C: Aprobar un examen de permiso de aprendizaje y una prueba de manejo.
    D: Entregar el registro de su vehículo.
  answer: C
  explanation: Para suspensiones de licencia de dos años o más, también debe aprobar
    un examen de permiso de aprendizaje y una prueba de manejo para reinstalar su
    licencia.
- id: 250
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol su capacidad para conducir de manera segura?
  choices:
    A: Actúa como un estimulante y mejora el tiempo de reacción.
    B: Es un depresor que afecta la visión, el tiempo de reacción, la coordinación
      y el juicio.
    C: Solo afecta su conducción si bebe más de tres porciones.
    D: Mejora su coordinación pero perjudica su visión.
  answer: B
  explanation: El alcohol es una droga. Es un depresor que afecta su visión, tiempo
    de reacción, coordinación y juicio.
- id: 252
  category: penalties_and_points
  question: ¿Cuál es la pena máxima de prisión por una condena de primera infracción
    por Operar Bajo la Influencia (OUI)?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 1/2 años
    D: 5 años
  answer: C
  explanation: La tabla de sanciones para una primera infracción por Operar un Vehículo
    Motorizado Bajo la Influencia de Alcohol o Drogas enumera la pena máxima de prisión
    como 2 1/2 años.
- id: 253
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión de la licencia para un Operador Junior
    (Junior Operator) condenado por una primera infracción por el uso de un dispositivo
    electrónico móvil (texto o teléfono)?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: B
  explanation: Un Operador Junior (Junior Operator) condenado por una primera infracción
    por el uso de un dispositivo electrónico móvil (texto o teléfono) enfrenta una
    suspensión de la licencia de 60 días.
- id: 254
  category: penalties_and_points
  question: Incluso si no se requiere la operación de un vehículo, ¿cuál es el período
    de suspensión de la licencia por dañar propiedad real o personal con grafiti?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: Un año
  answer: D
  explanation: El manual establece que dañar propiedad real o personal, rociar pintura
    o aplicar calcomanías u otros grafitis resulta en una suspensión de un año (o
    un retraso de un año para obtener una licencia).
- id: 255
  category: driver_responsibility
  question: ¿Qué tipo de infracción es conducir con una licencia suspendida o revocada
    en Massachusetts?
  choices:
    A: Una infracción civil menor
    B: Una infracción penal de vehículo motorizado
    C: Una infracción que no es de movimiento
    D: Una infracción de estacionamiento
  answer: B
  explanation: Conducir con una licencia suspendida o revocada es una infracción penal
    de vehículo motorizado. Puede enfrentar una multa elevada y/o una sentencia de
    cárcel, así como sanciones adicionales.
- id: 256
  category: penalties_and_points
  question: ¿Cuál es el rango de multa para una primera infracción por Operar Bajo
    la Influencia (OUI) de alcohol o drogas?
  choices:
    A: $500–$5,000
    B: $600–$10,000
    C: $1,000–$15,000
    D: $1,500–$25,000
  answer: A
  explanation: Según la tabla de sanciones, la multa por una primera infracción de
    OUI es de $500 a $5,000.
- id: 257
  category: alcohol_drugs_health
  question: Según el manual, ¿qué tan probable es el riesgo de un choque cuando el
    consumo de alcohol se combina con el consumo de marihuana?
  choices:
    A: Dos veces más probable
    B: Cinco veces más probable
    C: Diez veces más probable
    D: Doce veces más probable
  answer: D
  explanation: El manual establece que el consumo de alcohol combinado con el consumo
    de marihuana hace que el riesgo de un choque sea doce veces más probable.
- id: 258
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes bebidas contiene aproximadamente la misma cantidad
    de alcohol que una cerveza de 12 onzas?
  choices:
    A: Una copa de vino de 12 onzas
    B: Una copa de vino de 5 onzas
    C: Una porción de 3 onzas de licor de 80 grados (80-proof)
    D: Una copa de vino de 8 onzas
  answer: B
  explanation: Una cerveza de 12 onzas, una copa de vino de 5 onzas y una porción
    de 1.5 onzas de licor de 80 grados (80-proof) contienen aproximadamente la misma
    cantidad de alcohol (aproximadamente 1/2 onza).
- id: 259
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de eliminar el alcohol de su cuerpo y
    recuperar la sobriedad?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Dejar pasar el tiempo
    D: Comer una comida pesada
  answer: C
  explanation: No hay una forma rápida de recuperar la sobriedad. Beber café, tomar
    una ducha fría, hacer ejercicio o comer pueden hacer que se sienta más alerta,
    pero solo el tiempo lo librará de los efectos del alcohol.
- id: 260
  category: penalties_and_points
  question: Si es mayor de 21 años y no pasa una prueba química, ¿por cuánto tiempo
    se suspenderá su licencia?
  choices:
    A: 30 días o hasta la conclusión del caso judicial, lo que sea más corto
    B: 180 días
    C: Un año
    D: 30 días más 180 días adicionales
  answer: A
  explanation: Para los conductores mayores de 21 años, la licencia se suspende por
    30 días o hasta la conclusión del caso judicial, lo que sea más corto, por no
    pasar una prueba química.
- id: 261
  category: penalties_and_points
  question: ¿Qué exige la Ley de Consentimiento Implícito (Implied Consent Law) de
    Massachusetts a cada conductor con licencia?
  choices:
    A: Llevar prueba de seguro en todo momento
    B: Aceptar dar su consentimiento para una prueba de alcoholemia o de sangre en
      ciertos casos
    C: Permitir que la policía registre su vehículo sin una orden judicial
    D: Tomar un curso de educación sobre el alcohol antes de obtener una licencia
  answer: B
  explanation: Massachusetts tiene una Ley de Consentimiento Implícito (Implied Consent
    Law), lo que significa que cada conductor con licencia en el estado debe aceptar
    dar su consentimiento para una prueba de alcoholemia o de sangre en ciertos casos.
- id: 262
  category: penalties_and_points
  question: 'Bajo la ley de ''tolerancia cero'' de Massachusetts, los conductores
    menores de 21 años enfrentarán sanciones por tener un contenido de alcohol en
    sangre (BAC) tan bajo como:'
  choices:
    A: '0.01'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: Massachusetts tiene una ley de 'tolerancia cero' para conductores menores
    de 21 años. Cualquier conductor menor de 21 años enfrentará sanciones por tener
    un BAC de 0.02 o superior.
- id: 263
  category: penalties_and_points
  question: ¿Cuántas infracciones por conducir bajo la influencia (OUI) debe tener
    para que se le exija instalar un dispositivo de bloqueo de encendido (Ignition
    Interlock Device) para obtener una licencia por dificultades económicas o para
    el restablecimiento de la misma?
  choices:
    A: Una o más
    B: Dos o más
    C: Tres o más
    D: Cuatro o más
  answer: B
  explanation: Si tuvo dos o más infracciones por conducir bajo la influencia y es
    elegible para una licencia por dificultades económicas o para el restablecimiento
    de la licencia, debe tener un dispositivo de bloqueo de encendido.
- id: 264
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes NO es un factor que afecta su contenido de alcohol
    en sangre (BAC)?
  choices:
    A: Su peso corporal
    B: El tipo de bebida alcohólica que consume
    C: La cantidad de comida que ingirió antes de beber
    D: El tiempo que ha estado bebiendo
  answer: B
  explanation: 'Su BAC depende del peso corporal, la cantidad de alcohol, la comida
    ingerida antes de beber, el tiempo dedicado a beber y la velocidad de procesamiento.
    El manual establece explícitamente: ''El tipo de bebida que consuma no importa''.'
- id: 265
  category: penalties_and_points
  question: ¿Cuál es la sanción de suspensión de la licencia por una condena de quinta
    infracción por conducir bajo la influencia (OUI)?
  choices:
    A: Cinco años
    B: Ocho años
    C: Diez años
    D: De por vida
  answer: D
  explanation: Según la tabla de Sanciones por Conducir un Vehículo Motorizado Bajo
    la Influencia, una quinta infracción (delito grave) resulta en una suspensión
    de la licencia de por vida.
- id: 266
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto puede aumentar el contenido de alcohol en sangre
    (BAC) de una persona promedio una bebida estándar (por ejemplo, una cerveza de
    12 onzas)?
  choices:
    A: '0.01'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: Cualquiera de las bebidas estándar enumeradas (12 oz de cerveza, 5
    oz de vino, 1.5 oz de licor) puede aumentar el BAC de una persona promedio en
    0.02.
- id: 267
  category: penalties_and_points
  question: Si se le exige usar un dispositivo de bloqueo de encendido, ¿durante cuánto
    tiempo debe seguir usándolo después de que su licencia haya sido restablecida
    por completo?
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Cinco años
  answer: C
  explanation: Debe seguir usando el dispositivo de bloqueo de encendido durante dos
    años más después de que se haya restablecido su licencia.
- id: 268
  category: penalties_and_points
  question: ¿Cuál es el período inicial de suspensión de la licencia para un conductor
    menor de 18 años que no pasa una prueba química, antes de cualquier reducción
    por un programa de educación sobre el alcohol?
  choices:
    A: 30 días
    B: 180 días
    C: 30 días más 180 días adicionales
    D: 30 días más un año adicional
  answer: D
  explanation: Para los conductores menores de 18 años, la licencia se suspende por
    30 días, más un año adicional por no pasar una prueba química.
- id: 269
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol física y mentalmente sus habilidades de conducción?
  choices:
    A: Mejora sus reflejos pero distorsiona su visión
    B: Ralentiza sus reflejos y aumenta el tiempo que necesita para reaccionar
    C: Disminuye su confianza y lo hace excesivamente cauteloso
    D: Le ayuda a concentrarse mejor en la carretera
  answer: B
  explanation: El alcohol es un depresor. Ralentiza sus reflejos, aumenta el tiempo
    que necesita para reaccionar y distorsiona su visión y juicio. También suele hacer
    que se sienta más confiado, lo que le lleva a correr riesgos.
- id: 270
  category: driver_testing
  question: Si se le exige usar un dispositivo de bloqueo de encendido, ¿qué debe
    tener su vehículo para programar un examen práctico en línea?
  choices:
    A: Un freno en la consola central y un asiento para el patrocinador
    B: Una cámara de visión trasera y controles dobles
    C: Una transmisión manual y un freno en el lado del pasajero
    D: Un instructor de manejo certificado como patrocinador
  answer: A
  explanation: Para programar un examen práctico en línea con un dispositivo de bloqueo
    de encendido, debe proporcionar un vehículo que tenga el dispositivo instalado,
    tenga un freno en la consola central y tenga un asiento para el patrocinador.
- id: 271
  category: penalties_and_points
  question: Si es menor de 21 años y compra, o intenta comprar, alcohol, ¿por cuánto
    tiempo se suspenderá su licencia?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: Un año
  answer: C
  explanation: Según el manual, si es menor de 21 años y compra, o intenta comprar,
    alcohol, su licencia será suspendida por 180 días.
- id: 272
  category: alcohol_drugs_health
  question: Según la Ley de Contenedor Abierto (Open Container Law), ¿cuál es la multa
    si se le condena por tener una bebida alcohólica abierta dentro de su vehículo?
  choices:
    A: $50 a $100
    B: $100 a $500
    C: $500 a $1,000
    D: $1,000 a $5,000
  answer: B
  explanation: Si se le condena por tener una bebida alcohólica abierta dentro de
    su vehículo, se le multará con entre $100 y $500.
- id: 273
  category: penalties_and_points
  question: ¿Si utiliza una licencia o identificación falsa, por cuánto tiempo puede
    el RMV suspender su licencia incluso sin una condena?
  choices:
    A: 30 días
    B: 60 días
    C: Seis meses
    D: Un año
  answer: C
  explanation: La ley M.G.L.c.90,§22(e) permite al RMV suspender su licencia o derecho
    a operar en Massachusetts por hasta seis meses por usar una identificación falsa.
    No se requiere una condena.
- id: 274
  category: alcohol_drugs_health
  question: ¿Cómo afecta el fumar o comer marihuana sus habilidades de conducción?
  choices:
    A: Mejora su tiempo de reacción ante eventos repentinos.
    B: Disminuye su capacidad para manejar una serie rápida de tareas y causa una
      pérdida grave de la visión nocturna.
    C: Le hace sentir más despierto y consciente por un corto tiempo.
    D: No tiene efecto en la conducción porque ha sido despenalizada.
  answer: B
  explanation: La marihuana disminuye su capacidad para manejar una serie rápida de
    tareas y dificulta la respuesta ante eventos inesperados. También causa una pérdida
    grave de la visión nocturna.
- id: 275
  category: alcohol_drugs_health
  question: ¿Cuál es un efecto secundario peligroso de usar estimulantes como pastillas
    para adelgazar o pastillas de energía (pep pills) antes de conducir?
  choices:
    A: Causan una pérdida inmediata de la audición.
    B: Le hacen sentir inconsciente de dónde está y que no le importa.
    C: El estado de alerta inicial siempre va seguido de fatiga, nerviosismo, mareos
      y falta de concentración.
    D: Mejoran permanentemente su visión nocturna.
  answer: C
  explanation: Los estimulantes le hacen sentir más despierto y consciente por un
    corto tiempo, pero esto siempre va seguido de fatiga, nerviosismo, mareos y falta
    de concentración.
- id: 276
  category: license_system
  question: ¿Cuál de las siguientes es una razón por la cual el RMV se negará a renovar
    su licencia de conducir?
  choices:
    A: Multas impagas por infracciones de estacionamiento
    B: Una sola multa por exceso de velocidad de hace tres años
    C: No lavar su vehículo regularmente
    D: Tener un vehículo de más de 15 años
  answer: A
  explanation: El RMV se negará a renovar su licencia si tiene multas impagas por
    infracciones de estacionamiento, entre otras multas, impuestos impagos u órdenes
    de arresto pendientes.
- id: 277
  category: safe_driving_rules
  question: A una velocidad del vehículo de 40 mph, ¿qué porcentaje de peatones resultan
    gravemente heridos o mueren en un choque?
  choices:
    A: 13%
    B: 40%
    C: 73%
    D: 95%
  answer: C
  explanation: El manual establece que a una velocidad de 40 mph, el 73% de los peatones
    resultan gravemente heridos o mueren en un choque.
- id: 278
  category: safe_driving_rules
  question: ¿Qué le exige hacer la ley de velocidad fundamental?
  choices:
    A: Conducir siempre exactamente al límite de velocidad indicado.
    B: Nunca viajar tan rápido que no sea seguro, independientemente del límite de
      velocidad indicado.
    C: Conducir 10 mph por debajo del límite de velocidad en todo momento.
    D: Igualar la velocidad de los vehículos a su alrededor, incluso si exceden el
      límite.
  answer: B
  explanation: La ley de velocidad fundamental establece que nunca debe viajar tan
    rápido que no sea seguro. Debe reducir su velocidad si las condiciones de conducción
    son deficientes, incluso si el límite indicado es mayor.
- id: 279
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad mínimo en los túneles del puerto de Boston
    (Callahan, Sumner y Ted Williams)?
  choices:
    A: 15 mph
    B: 20 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: Existe una velocidad mínima de 20 mph en los túneles del puerto de
    Boston (Callahan, Sumner y Ted Williams).
- id: 280
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    una zona escolar?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: A menos que se indique lo contrario, su velocidad no sería razonable
    ni adecuada si conduce a más de 20 mph en una zona escolar.
- id: 281
  category: safe_driving_rules
  question: ¿Cómo se define un "distrito densamente poblado" (thickly settled district)
    en Massachusetts?
  choices:
    A: Un área donde los edificios están a menos de 200 pies de distancia por una
      distancia de 1/4 de milla o más.
    B: Cualquier carretera que tenga una acera.
    C: Un área donde los edificios están a menos de 500 pies de distancia por una
      distancia de 1 milla.
    D: Una zona a menos de 1,000 pies de una escuela u hospital.
  answer: A
  explanation: Un "distrito densamente poblado" es un área donde los edificios están
    a menos de 200 pies de distancia por una distancia de 1/4 de milla o más.
- id: 282
  category: alcohol_drugs_health
  question: ¿Puede recibir un cargo por Operar Bajo la Influencia (OUI) por conducir
    mientras toma medicamentos recetados?
  choices:
    A: No, los medicamentos recetados son legales y están exentos de las leyes de
      OUI.
    B: Sí, es ilegal operar un vehículo motorizado mientras se está incapacitado por
      cualquier sustancia, incluidos los medicamentos recetados.
    C: Solo si el medicamento recetado se mezcla con alcohol.
    D: Solo si la receta no está a su nombre.
  answer: B
  explanation: Se le puede considerar OUI con medicamentos recetados. Es ilegal operar
    un vehículo motorizado mientras se está incapacitado por cualquier sustancia.
- id: 283
  category: license_system
  question: ¿Si tiene una orden judicial pendiente, qué debe presentar al RMV antes
    de renovar su licencia?
  choices:
    A: Una carta de su abogado
    B: Un aviso de retiro (recall notice) del tribunal
    C: Un recibo que demuestre que pagó una multa
    D: Un nuevo pasaporte o certificado de nacimiento
  answer: B
  explanation: Para una orden judicial pendiente, se requiere un aviso de retiro del
    tribunal antes de renovar su licencia. El RMV no aceptará ningún otro documento.
- id: 284
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en las carreteras cerca de las escuelas
    en Massachusetts?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: El manual establece que el límite de velocidad en las carreteras cerca
    de las escuelas es de 20 mph.
- id: 285
  category: safe_driving_rules
  question: ¿Cómo se define un 'distrito densamente poblado' (thickly settled district)
    en el manual del conductor?
  choices:
    A: Un área donde los edificios están a menos de 200 pies de distancia por una
      distancia de 1/4 de milla o más.
    B: Un área donde los edificios están a menos de 100 pies de distancia por una
      distancia de 1/2 milla o más.
    C: Cualquier zona residencial con un límite de velocidad publicado de 30 mph.
    D: Un distrito comercial con más de 500 residentes por milla cuadrada.
  answer: A
  explanation: Un 'distrito densamente poblado' es un área donde los edificios están
    a menos de 200 pies de distancia por una distancia de 1/4 de milla o más.
- id: 286
  category: safe_driving_rules
  question: Si conduce a 40 mph en una fuerte tormenta de lluvia en una autopista
    con un límite de velocidad de 50 mph, ¿qué podría suceder?
  choices:
    A: Está conduciendo de manera segura dentro del límite legal y no puede ser sancionado.
    B: Puede recibir una multa por conducir demasiado rápido.
    C: Debe encender sus luces de emergencia para mantener esa velocidad.
    D: Se le requiere detenerse a un lado del camino hasta que pare la lluvia.
  answer: B
  explanation: Según el manual, si conduce a 40 mph en una fuerte tormenta de lluvia
    en una autopista con un límite de velocidad de 50 mph, puede recibir una multa
    por conducir demasiado rápido.
- id: 287
  category: signs_and_signals
  question: ¿Bajo qué circunstancias puede realizar un giro a la izquierda con una
    luz roja fija?
  choices:
    A: Siempre que no haya tráfico en sentido contrario.
    B: Solo entre las horas de medianoche y las 6 AM.
    C: Cuando conduzca en una calle de un solo sentido y gire a la izquierda hacia
      otra calle de un solo sentido.
    D: Nunca puede realizar un giro a la izquierda con luz roja en Massachusetts.
  answer: C
  explanation: Puede girar a la izquierda con luz roja cuando conduzca en una calle
    de un solo sentido y gire a la izquierda hacia otra calle de un solo sentido,
    después de detenerse y ceder el paso a peatones y vehículos.
- id: 288
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico de círculo rojo intermitente?
  choices:
    A: La señal de tráfico está averiada y debe proceder con precaución.
    B: Significa lo mismo que una señal de PARE (STOP); debe detenerse por completo.
    C: Ceda el paso al tráfico en sentido contrario, pero no necesita detenerse.
    D: Deténgase solo si hay peatones en el cruce peatonal.
  answer: B
  explanation: Un círculo rojo intermitente significa lo mismo que una señal de PARE
    (STOP). Debe detenerse por completo, obedecer las leyes de derecho de paso y proceder
    cuando sea seguro.
- id: 289
  category: signs_and_signals
  question: ¿Qué acción debe tomar al acercarse a una señal de tráfico de círculo
    amarillo fijo?
  choices:
    A: Acelerar para despejar la intersección antes de que cambie a rojo.
    B: Detenerse si es seguro hacerlo, ya que la señal está cambiando de verde a rojo.
    C: Proceder con precaución sin reducir su velocidad.
    D: Tratarla como una señal de ceder el paso e incorporarse al tráfico.
  answer: B
  explanation: Un círculo amarillo fijo significa que la señal de tráfico está cambiando
    de verde a rojo. Debe detenerse si es seguro.
- id: 290
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente?
  choices:
    A: Usted tiene el derecho de paso para girar y todo el resto del tráfico debe
      ceder el paso.
    B: No puede realizar un giro en la dirección de la flecha.
    C: Puede girar en la dirección de la flecha cuando haya un espacio adecuado en
      el tráfico en sentido contrario.
    D: El carril está cerrado más adelante y debe incorporarse a la derecha.
  answer: C
  explanation: Una flecha amarilla intermitente le permite girar a la izquierda o
    a la derecha en la dirección de la flecha cuando el tráfico en sentido contrario
    tiene luz verde pero hay un espacio en el tráfico. Debe asegurarse de que haya
    un espacio adecuado.
- id: 291
  category: signs_and_signals
  question: ¿Qué debe hacer si se acerca a una intersección donde las señales de tráfico
    están apagadas y no funcionan?
  choices:
    A: Proceder a través de la intersección a su velocidad normal.
    B: Ceder el paso al vehículo a su izquierda.
    C: Esperar en la intersección hasta que llegue un oficial de policía.
    D: Proceder como si hubiera una señal de pare en todas las direcciones.
  answer: D
  explanation: Si las señales están apagadas y no funcionan, sea cauteloso y proceda
    como si hubiera una señal de pare en todas las direcciones.
- id: 292
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla con respecto a los peatones y los
    cruces peatonales?
  choices:
    A: Puede rebasar a un vehículo detenido por un peatón si el carril izquierdo está
      despejado.
    B: Nunca debe rebasar a un vehículo que esté detenido o disminuyendo la velocidad
      por un peatón.
    C: Los peatones deben ceder el paso a los vehículos si el cruce peatonal no tiene
      señal.
    D: Puede bloquear un cruce peatonal si está esperando para realizar un giro a
      la derecha.
  answer: B
  explanation: 'Bajo ''Leyes para Conductores'', el manual establece explícitamente:
    ''Nunca rebase a un vehículo que esté detenido o disminuyendo la velocidad por
    un peatón''.'
- id: 293
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de color marrón?
  choices:
    A: Servicios para el conductor, como gasolina o comida.
    B: Advertencia de construcción o mantenimiento.
    C: Sitio recreativo, histórico o panorámico.
    D: Gestión de incidentes.
  answer: C
  explanation: Según la sección del manual sobre los colores de las señales, una señal
    marrón indica un sitio recreativo, histórico o panorámico.
- id: 294
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de gestión de incidentes?
  choices:
    A: Naranja
    B: Rosa fluorescente
    C: Púrpura
    D: Amarillo-verde fluorescente
  answer: B
  explanation: El manual especifica que el rosa fluorescente se utiliza para las señales
    de gestión de incidentes.
- id: 295
  category: signs_and_signals
  question: Al acercarse a una Baliza Híbrida para Peatones (PHB), ¿qué debe hacer
    cuando las dos luces rojas superiores están fijas?
  choices:
    A: Proceder con precaución.
    B: Prepararse para detenerse.
    C: Detenerse para los peatones.
    D: Detenerse y proceder con precaución si el camino está despejado.
  answer: C
  explanation: Cuando las dos luces rojas superiores están fijas en una Baliza Híbrida
    para Peatones, debe detenerse para los peatones.
- id: 296
  category: sharing_the_road
  question: Al girar hacia una entrada privada o un estacionamiento, ¿quién tiene
    el derecho de paso?
  choices:
    A: El vehículo que gira tiene el derecho de paso sobre los peatones.
    B: Debe ceder el paso a los peatones al girar hacia una entrada privada o un estacionamiento.
    C: Los peatones deben esperar a que pasen todos los vehículos que giran.
    D: El vehículo que sale del estacionamiento tiene el derecho de paso.
  answer: B
  explanation: 'Bajo la sección ''Leyes para conductores'', el manual establece: ''Debe
    ceder el paso a los peatones al girar hacia una entrada privada o un estacionamiento''.'
- id: 297
  category: signs_and_signals
  question: ¿Cuál es el procedimiento adecuado al acercarse a una señal de PARE (STOP)?
  choices:
    A: Reducir la velocidad a 5 mph y proceder si la intersección está despejada.
    B: Detenerse por completo antes de cualquier cruce peatonal o línea de parada
      pintada en el pavimento.
    C: Detenerse solo si se aproxima tráfico transversal.
    D: Tocar la bocina para advertir a otros conductores antes de pasar sin detenerse.
  answer: B
  explanation: Al acercarse a una señal de pare, debe detenerse antes de cualquier
    cruce peatonal o línea de parada pintada en el pavimento. Deténgase por completo;
    simplemente reducir la velocidad no es suficiente.
- id: 298
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor cuando se activa una Baliza Rectangular de
    Destello Rápido y sus luces ámbar están parpadeando?
  choices:
    A: Acelerar para despejar el cruce peatonal rápidamente.
    B: Detenerse para los peatones.
    C: Moverse al carril izquierdo para evitar el cruce peatonal.
    D: Tratarla como una señal de ceda el paso y proceder si no hay peatones visibles.
  answer: B
  explanation: Cuando se activa una Baliza Rectangular de Destello Rápido, las luces
    ámbar parpadean en un patrón irregular y usted debe detenerse para los peatones.
- id: 299
  category: signs_and_signals
  question: En una intersección controlada por una señal de PARE DE 4 VÍAS o TODAS
    LAS VÍAS (4-WAY o ALL WAY STOP), ¿qué vehículo tiene el derecho de paso?
  choices:
    A: El vehículo a la derecha
    B: El primer vehículo en llegar a la intersección
    C: El vehículo que viaja en línea recta
    D: El vehículo más grande
  answer: B
  explanation: Según el manual, en una parada de 4 vías o de todas las vías, el primer
    vehículo en la intersección o en la parada de cuatro vías tiene el derecho de
    paso.
- id: 300
  category: signs_and_signals
  question: ¿Qué tipo de información proporcionan las señales de guía azules a los
    automovilistas?
  choices:
    A: Direcciones de autopistas e intercambios
    B: Áreas recreativas públicas y parques estatales
    C: Servicios para el conductor, como gasolina, comida y alojamiento
    D: Leyes y reglamentos de tránsito
  answer: C
  explanation: El manual establece que las señales azules enumeran los servicios para
    el conductor, como gasolina, comida y alojamiento.
- id: 301
  category: signs_and_signals
  question: ¿Qué color de señal de guía dirige a los conductores a áreas recreativas
    públicas, parques estatales y nacionales, y puntos de interés?
  choices:
    A: Verde
    B: Azul
    C: Marrón
    D: Amarillo
  answer: C
  explanation: Las señales marrones lo dirigen a áreas recreativas públicas, parques
    estatales y nacionales, puntos de interés y sitios panorámicos.
- id: 302
  category: signs_and_signals
  question: ¿Qué indica una señal reglamentaria que presenta un círculo rojo con una
    barra diagonal?
  choices:
    A: Hay un peligro adelante
    B: Algo está prohibido
    C: Debe ceder el derecho de paso
    D: Se requiere un desvío
  answer: B
  explanation: Las señales reglamentarias que utilizan un círculo rojo con una barra
    diagonal significan que algo está prohibido.
- id: 303
  category: safe_driving_rules
  question: Si las luces rojas de un cruce de ferrocarril comienzan a parpadear, ¿cuál
    es la distancia mínima a la que debe detenerse antes del poste de luz o la barrera?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: Si las luces comienzan a parpadear en un cruce de ferrocarril, debe
    detenerse al menos a 15 pies antes del poste de luz o la barrera.
- id: 304
  category: safe_driving_rules
  question: Al conducir por una zona de obras, ¿qué debe hacer si las instrucciones
    de un oficial de tránsito entran en conflicto con las señales o semáforos existentes?
  choices:
    A: Seguir las señales y semáforos de tránsito
    B: Obedecer las instrucciones del oficial de tránsito
    C: Detenerse y esperar a que las señales cambien
    D: Hacerse a un lado y llamar al 511
  answer: B
  explanation: Siempre debe obedecer las instrucciones de un oficial de tránsito,
    incluso cuando estas anulen las señales, semáforos o marcas en el pavimento.
- id: 305
  category: defensive_driving
  question: ¿Qué es lo PRIMERO que debe hacer al acercarse a una zona de obras?
  choices:
    A: Cambiar de carril inmediatamente
    B: Encender las luces de emergencia
    C: Reducir la velocidad y buscar orientación
    D: Detenerse y esperar a un banderillero civil
  answer: C
  explanation: El manual establece que al acercarse a una zona de obras, lo PRIMERO
    que debe hacer es REDUCIR LA VELOCIDAD y buscar orientación sobre cómo transitar
    de manera segura por el área.
- id: 306
  category: signs_and_signals
  question: ¿Qué indica una línea blanca sólida doble que separa dos carriles de tráfico?
  choices:
    A: El tráfico se mueve en direcciones opuestas y se permite rebasar
    B: El tráfico se mueve en la misma dirección y no se permite cruzar la línea
    C: El tráfico se mueve en direcciones opuestas y no se permite cruzar
    D: El tráfico se mueve en la misma dirección y puede cruzar para cambiar de carril
  answer: B
  explanation: Una línea blanca sólida doble separa dos carriles de tráfico que van
    en la misma dirección. No se permite cruzar una línea blanca sólida doble.
- id: 307
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias debe cruzar una línea blanca sólida simple que
    separa carriles de tráfico que viajan en la misma dirección?
  choices:
    A: Siempre que necesite rebasar a un vehículo más lento
    B: Solo cuando necesite evitar un peligro
    C: Cuando se esté preparando para girar a la izquierda
    D: Nunca debe cruzar una línea blanca sólida bajo ninguna circunstancia
  answer: B
  explanation: Puede ir en la misma dirección a ambos lados de una línea blanca sólida,
    pero no debe cruzarla a menos que necesite evitar un peligro.
- id: 308
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar dos líneas amarillas sólidas?
  choices:
    A: Al rebasar a un vehículo que circula despacio
    B: Al girar a la izquierda y cuando sea seguro hacerlo
    C: Al viajar por una calle de sentido único
    D: Nunca
  answer: B
  explanation: Dos líneas amarillas sólidas prohíben que los vehículos las crucen
    para rebasar a otro vehículo. No puede cruzar estas líneas a menos que vaya a
    girar a la izquierda cuando sea seguro hacerlo.
- id: 309
  category: signs_and_signals
  question: ¿Qué indica un símbolo de diamante blanco pintado en la superficie de
    la calzada?
  choices:
    A: Hay un cruce de ferrocarril más adelante
    B: Un carril compartido para bicicletas y vehículos motorizados
    C: Una restricción de carril especial, como 'solo para vehículos de alta ocupación
      (HOV)'
    D: Un cruce peatonal
  answer: C
  explanation: Un símbolo de diamante blanco significa que hay una restricción de
    carril especial, como 'solo para vehículos de alta ocupación (HOV)' o 'solo para
    autobuses'.
- id: 310
  category: sharing_the_road
  question: ¿Cuál es el propósito de las Marcas de Carril Compartido (Sharrows) en
    una calzada?
  choices:
    A: Indicar un carril reservado exclusivamente para bicicletas
    B: Advertir a los conductores sobre una zona escolar cercana
    C: Ayudar a los ciclistas a posicionarse en un carril compartido y evitar las
      puertas de vehículos estacionados
    D: Marcar el límite de un cruce peatonal
  answer: C
  explanation: Las Marcas de Carril Compartido (Sharrows) ayudan a los ciclistas a
    posicionarse en el lugar y la dirección correctos en un carril compartido, ayudándoles
    a evitar ser golpeados por la puerta abierta de un vehículo estacionado.
- id: 311
  category: signs_and_signals
  question: ¿Qué colores se utilizan normalmente para las señales de advertencia que
    alertan a los conductores sobre peligros o cambios en las condiciones más adelante?
  choices:
    A: Rojo y blanco
    B: Azul y blanco
    C: Verde y blanco
    D: Amarillo y verde-amarillo fluorescente
  answer: D
  explanation: Las señales de advertencia amarillas y verde-amarillo fluorescente
    le advierten sobre peligros o cambios en las condiciones más adelante.
- id: 312
  category: signs_and_signals
  question: En un cruce de ferrocarril, ¿cómo puede saber si hay más de una vía cruzando
    la carretera?
  choices:
    A: La señal de aspa (crossbuck) estará pintada de amarillo
    B: El número de vías está indicado debajo de la señal de aspa blanca
    C: Habrá dos líneas de parada separadas pintadas en el pavimento
    D: La campana de advertencia sonará a un ritmo más rápido
  answer: B
  explanation: Si más de una vía cruza una carretera, el número de vías se indica
    debajo de la señal de aspa (crossbuck).
- id: 313
  category: driver_responsibility
  question: ¿Cuál es el propósito del servicio telefónico 511 de la División de Carreteras?
  choices:
    A: Solicitar asistencia médica de emergencia
    B: Reportar un vehículo robado
    C: Obtener información actualizada sobre el tráfico, el clima y la construcción
    D: Programar una cita para el examen de conducir
  answer: C
  explanation: Puede utilizar el servicio telefónico 511 para obtener información
    actualizada sobre las condiciones del tráfico y el clima, proyectos de construcción
    y para reportar problemas en la carretera.
- id: 314
  category: sharing_the_road
  question: ¿Cuándo se le permite a un vehículo motorizado conducir en un carril para
    bicicletas?
  choices:
    A: Siempre que el carril de circulación adyacente esté bloqueado
    B: Solo al entrar o salir de la carretera
    C: Al adelantar a un vehículo más lento
    D: A los vehículos motorizados nunca se les permite estar en un carril para bicicletas
  answer: B
  explanation: Según el manual, los vehículos motorizados solo pueden conducir en
    los carriles para bicicletas al entrar o salir de la carretera.
- id: 315
  category: sharing_the_road
  question: ¿Qué indica un carril de asesoramiento para bicicletas (advisory bicycle
    lane) con líneas discontinuas?
  choices:
    A: Los vehículos motorizados tienen estrictamente prohibido entrar en el carril.
    B: Los ciclistas deben ceder el paso a los vehículos motorizados antes de entrar
      al carril.
    C: Los vehículos motorizados pueden usar el espacio del carril cuando sea necesario,
      pero deben ceder el paso a los ciclistas primero.
    D: El carril está reservado exclusivamente para vehículos de alta ocupación.
  answer: C
  explanation: Los carriles de asesoramiento para bicicletas tienen líneas discontinuas
    para indicar que los vehículos motorizados pueden usar el espacio del carril cuando
    sea necesario, pero siempre deben ceder el paso a los ciclistas primero.
- id: 316
  category: sharing_the_road
  question: ¿Qué debe hacer si se detiene ante un semáforo en rojo donde hay pavimento
    verde?
  choices:
    A: Detenerse directamente sobre el pavimento verde para activar el sensor de tráfico.
    B: No debe detenerse sobre el pavimento verde.
    C: Avanzar a través de la luz roja si no hay ciclistas presentes.
    D: Hacerse a un lado a la derecha del pavimento verde.
  answer: B
  explanation: El manual establece que, ante una luz roja, no debe detenerse sobre
    el pavimento verde, el cual se utiliza en áreas donde podría haber conflictos
    al compartir la vía.
- id: 317
  category: signs_and_signals
  question: ¿Cómo es una línea de ceda el paso (yield line) pintada a lo largo de
    una intersección?
  choices:
    A: Un par de líneas blancas continuas
    B: Una serie de triángulos pintados uno al lado del otro
    C: Franjas amarillas diagonales
    D: Una sola línea roja continua
  answer: B
  explanation: Una intersección con una señal de ceda el paso puede tener una línea
    de CEDA EL PASO (YIELD) pintada a lo largo de ella, que parece una serie de triángulos
    pintados uno al lado del otro.
- id: 318
  category: safe_driving_rules
  question: ¿Bajo qué condición puede conducir o estacionarse sobre una isla de canalización
    (channelizing island)?
  choices:
    A: Cuando necesite adelantar a un vehículo que circula despacio
    B: Cuando su vehículo se averíe
    C: Solo cuando lo indique un oficial de policía
    D: Cuando el carril adyacente esté cerrado por construcción
  answer: C
  explanation: No puede conducir ni estacionar un vehículo motorizado sobre ninguna
    isla de canalización, a menos que se lo indique un oficial de policía.
- id: 319
  category: safe_driving_rules
  question: Como regla general, ¿cuándo se le permite usar el carril de emergencia
    (breakdown lane) de una autopista para circular o adelantar?
  choices:
    A: Siempre que el tráfico esté congestionado
    B: Durante horarios específicos publicados en algunas autopistas
    C: Cuando conduce un vehículo de alta ocupación
    D: Nunca se le permite usar un carril de emergencia para circular
  answer: B
  explanation: Como regla general, no use el carril de emergencia de una autopista
    para circular o adelantar. Sin embargo, en algunas autopistas, puede usar el carril
    de emergencia para circular durante horarios específicos.
- id: 320
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una situación en la que se requiere el uso
    de las luces direccionales?
  choices:
    A: Al incorporarse al tráfico desde la acera
    B: Al conducir en línea recta a través de una intersección
    C: Al detenerse ante una señal de pare
    D: Al ceder el paso a un peatón en un cruce de peatones
  answer: A
  explanation: Debe señalizar en ciertas situaciones, incluyendo cambiar de carril,
    girar, incorporarse al tráfico desde la acera, detenerse a un lado de la vía y
    entrar o salir de una autopista.
- id: 321
  category: safe_driving_rules
  question: ¿Cuándo es legal cambiar de carril en medio de una intersección?
  choices:
    A: Cuando no hay tráfico en sentido contrario
    B: Cuando se está preparando para girar a la izquierda
    C: Cuando el carril en el que se encuentra está bloqueado
    D: Nunca es legal cambiar de carril en medio de una intersección
  answer: D
  explanation: Nunca cambie de carril en medio de una intersección. Es ilegal y peligroso.
- id: 322
  category: defensive_driving
  question: ¿Qué debe hacer si llega a una curva en la carretera y no puede ver lo
    que hay adelante?
  choices:
    A: Moverse al centro de la carretera y tocar la bocina
    B: Mantenerse a la derecha y reducir la velocidad
    C: Acelerar para pasar rápidamente por el punto ciego
    D: Encender las luces altas
  answer: B
  explanation: Si llega a una curva en la carretera y no puede ver lo que hay adelante,
    manténgase a la derecha y reduzca la velocidad.
- id: 323
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla especial para motocicletas con respecto
    al uso del carril?
  choices:
    A: Las motocicletas pueden circular hasta tres en paralelo en un solo carril.
    B: Se recomienda que las motocicletas circulen por las líneas del pavimento en
      tráfico pesado.
    C: Las motocicletas no deben circular por las líneas del pavimento, entre carriles
      de tráfico.
    D: Las motocicletas siempre deben usar el carril de emergencia (breakdown lane)
      en las autopistas.
  answer: C
  explanation: Las reglas especiales para motocicletas establecen que los conductores
    no deben circular por las líneas del pavimento, entre carriles de tráfico, y no
    deben circular más de dos en paralelo.
- id: 324
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta a seguir si se pasa de su salida en la autopista?
  choices:
    A: Detenerse y retroceder con cuidado por el acotamiento (shoulder)
    B: Hacer un giro en U en el siguiente cruce de la mediana
    C: Salir de la autopista en la siguiente salida
    D: Reducir la velocidad y retroceder en el carril de emergencia
  answer: C
  explanation: Si se pasa de su salida, no se detenga. Nunca retroceda en la autopista.
    Salga de la autopista en la siguiente salida.
- id: 325
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar su salida antes de llegar a una
    rampa de salida de la autopista?
  choices:
    A: Al menos 100 pies
    B: Al menos 250 pies
    C: Al menos 500 pies
    D: Al menos 1000 pies
  answer: C
  explanation: Asegúrese de señalizar su salida al menos 500 pies antes de llegar
    a la rampa de salida.
- id: 326
  category: safe_driving_rules
  question: En una autopista con tres o más carriles en su dirección, ¿qué carril
    debe usar para rebasar?
  choices:
    A: El carril del extremo derecho
    B: El carril central
    C: El carril del extremo izquierdo
    D: El carril de emergencia
  answer: C
  explanation: En una autopista con tres o más carriles en su dirección, use el carril
    del extremo derecho para conducir más lento, el carril central para conducir más
    rápido y el carril del extremo izquierdo para rebasar.
- id: 327
  category: defensive_driving
  question: Para evitar la "hipnosis de la autopista" en un viaje largo, ¿con qué
    frecuencia debe detenerse y estirarse?
  choices:
    A: Cada hora o cada 50 millas
    B: Cada dos horas o cada 100 millas
    C: Cada tres horas o cada 150 millas
    D: Cada cuatro horas o cada 200 millas
  answer: B
  explanation: Si planea conducir lejos, deténgase y estírese cada dos horas o cada
    100 millas para evitar la hipnosis de la autopista y la fatiga.
- id: 328
  category: safe_driving_rules
  question: ¿Cuáles son los tres pasos que debe recordar al cambiar de carril?
  choices:
    A: (1) mirar, (2) señalizar, (3) moverse
    B: (1) señalizar, (2) mirar, (3) moverse
    C: (1) frenar, (2) señalizar, (3) moverse
    D: (1) acelerar, (2) mirar, (3) moverse
  answer: A
  explanation: 'Al cambiar de carril, recuerde estos tres pasos: (1) mirar, (2) señalizar,
    (3) moverse.'
- id: 329
  category: safe_driving_rules
  question: Si planea conducir lejos, ¿con qué frecuencia debe detenerse y estirarse?
  choices:
    A: Cada hora o 50 millas
    B: Cada dos horas o 100 millas
    C: Cada tres horas o 150 millas
    D: Cada cuatro horas o 200 millas
  answer: B
  explanation: El manual aconseja que si planea conducir lejos, debe detenerse y estirarse
    cada dos horas o cada 100 millas.
- id: 330
  category: safe_driving_rules
  question: ¿Cuál es el curso de acción más seguro si su vehículo se avería en la
    autopista?
  choices:
    A: Pararse cerca del carril de circulación para pedir ayuda con la mano
    B: Moverse al carril de emergencia y pararse fuera de su vehículo
    C: Moverse al carril de emergencia o al acotamiento y permanecer en su vehículo
    D: Dejar su vehículo en el carril de circulación y caminar hasta la salida más
      cercana
  answer: C
  explanation: Si su vehículo se avería, muévalo al carril de emergencia o al acotamiento
    lo más lejos posible del carril de circulación y permanezca en su vehículo. Pararse
    cerca del carril de circulación es peligroso.
- id: 331
  category: safe_driving_rules
  question: ¿Qué información puede obtener marcando el servicio telefónico 511 de
    la División de Carreteras?
  choices:
    A: Servicios de despacho médico de emergencia
    B: Información actualizada sobre el tráfico, las condiciones climáticas y los
      proyectos de construcción
    C: Conexión directa con el departamento de policía local
    D: Instrucciones automatizadas para la renovación de la licencia de conducir
  answer: B
  explanation: La División de Carreteras tiene un servicio telefónico 511 que proporciona
    información actualizada sobre el tráfico, las condiciones climáticas y los proyectos
    de construcción.
- id: 332
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe señalizar su intención de girar mientras
    conduce en una autopista?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 250 pies
    D: Al menos 500 pies
  answer: D
  explanation: El manual establece que debe señalizar su giro al menos 100 pies antes
    de realizarlo, pero en una autopista, debe señalizar al menos 500 pies antes de
    un giro.
- id: 333
  category: safe_driving_rules
  question: ¿A qué distancia mínima debe ser visible su vehículo para otros conductores
    antes de realizar una vuelta en U en la cima de una colina o cerca de una curva?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: No realice una vuelta en U en la cima de una colina, cerca de una curva
    o en cualquier lugar donde usted u otros conductores no puedan ver a una distancia
    de 500 pies.
- id: 334
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a un carril
    central marcado como carril común de giro a la izquierda?
  choices:
    A: Puede usarlo para rebasar vehículos más lentos
    B: Puede circular por él hasta 200 pies antes de girar
    C: No puede circular por un carril central de giro
    D: Está reservado exclusivamente para vehículos de emergencia
  answer: C
  explanation: 'En algunas carreteras de doble sentido, un carril central puede estar
    marcado como carril común de giro a la izquierda. El manual establece explícitamente:
    ''No puede circular por un carril central de giro''.'
- id: 335
  category: safe_driving_rules
  question: Al prepararse para realizar un giro de tres puntos, ¿qué tan grande debe
    ser el espacio en el tráfico que debe esperar antes de completar el giro?
  choices:
    A: 5-10 segundos
    B: 10-15 segundos
    C: 20-30 segundos
    D: 40-50 segundos
  answer: C
  explanation: Al realizar un giro de tres puntos, debe verificar el tráfico y los
    peatones, y esperar hasta tener un espacio de 20 a 30 segundos para completar
    el giro.
- id: 336
  category: driver_responsibility
  question: ¿Cuál de las siguientes opciones describe mejor el concepto de las reglas
    de 'derecho de paso'?
  choices:
    A: Le otorgan el derecho legal absoluto de avanzar primero
    B: Se basan en la seguridad y la cortesía, y el derecho de paso es algo que se
      cede, no se toma
    C: Solo se aplican en intersecciones controladas por semáforos
    D: Le permiten obligar a otros conductores a ceder el paso a su vehículo
  answer: B
  explanation: 'Las reglas de derecho de paso se basan en la seguridad y la cortesía.
    No le otorgan ningún ''derecho''. El manual establece: ''Recuerde, el derecho
    de paso es algo que se cede, no se toma''.'
- id: 337
  category: safe_driving_rules
  question: Al acercarse a una intersección que no está controlada por señales o semáforos,
    ¿a quién debe cederle el derecho de paso?
  choices:
    A: A cualquier vehículo que venga por su izquierda
    B: A cualquier vehículo que haya entrado en la intersección desde su derecha o
      que venga por su derecha
    C: Solo a vehículos comerciales y autobuses de tránsito
    D: A los vehículos que están girando a la izquierda cruzando su camino
  answer: B
  explanation: En una intersección no controlada, debe ceder el derecho de paso a
    cualquier vehículo que haya entrado en la intersección desde su derecha o que
    venga por su derecha.
- id: 338
  category: safe_driving_rules
  question: Si usted y otro vehículo llegan a una parada de cuatro vías (four-way
    stop) exactamente al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo directamente a su derecha
    B: El vehículo directamente a su izquierda
    C: El vehículo que viaja en línea recta
    D: El vehículo que está girando a la derecha
  answer: A
  explanation: En una parada de cuatro vías, si los vehículos se detienen al mismo
    tiempo, debe ceder el derecho de paso al vehículo que esté directamente a su derecha.
- id: 339
  category: safe_driving_rules
  question: ¿Qué debe hacer al ingresar a una vía pública pavimentada desde un camino
    privado, una entrada particular o un camino no pavimentado?
  choices:
    A: Reducir la velocidad e incorporarse sin problemas al tráfico
    B: Tocar la bocina y avanzar sin detenerse
    C: Detenerse y ceder el derecho de paso a peatones, ciclistas o vehículos en la
      vía a la que está ingresando
    D: Ceder el paso solo si hay una señal de ceda el paso instalada
  answer: C
  explanation: Al ingresar a una vía pública pavimentada desde un camino privado,
    una entrada particular o un camino no pavimentado, debe detenerse y luego ceder
    el derecho de paso a los peatones, ciclistas o vehículos que se encuentren en
    la vía a la que está ingresando.
- id: 340
  category: sharing_the_road
  question: Si está girando en una intersección, ¿cómo debe actuar ante un ciclista
    que sigue recto por la misma intersección?
  choices:
    A: Acelerar para cortar el paso al ciclista
    B: Tocar la bocina para advertir al ciclista que se detenga
    C: Ceder el paso al ciclista que sigue recto
    D: Obligar al ciclista a girar con usted
  answer: C
  explanation: Al conducir a través de una intersección, esté especialmente alerta
    a los ciclistas. Si va a girar, debe ceder el paso a los ciclistas que sigan recto
    por la intersección y nunca cortarles el paso.
- id: 341
  category: safe_driving_rules
  question: Al conducir a través de una intersección, ¿cuándo se le permite legalmente
    bloquear la intersección o el cruce peatonal?
  choices:
    A: Cuando el tráfico está congestionado y usted tiene luz verde
    B: Cuando está realizando un giro a la izquierda
    C: Cuando conduce un vehículo comercial
    D: Nunca es legal bloquear una intersección o un cruce peatonal
  answer: D
  explanation: Es ilegal bloquear una intersección con su vehículo. Solo puede entrar
    en una intersección o conducir a través de un cruce peatonal si hay suficiente
    espacio para pasar de manera segura.
- id: 342
  category: safe_driving_rules
  question: ¿En qué dirección circula el tráfico en una rotonda (rotary)?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En un patrón de figura en ocho
    D: En línea recta sin girar
  answer: B
  explanation: Según el manual, el tráfico circula en sentido contrario a las agujas
    del reloj en una rotonda.
- id: 343
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida mientras conduce en una glorieta
    (rotary)?
  choices:
    A: Detenerse inmediatamente y esperar a que el tráfico se despeje.
    B: Poner su vehículo en reversa para retroceder hasta la salida.
    C: Dar la vuelta de nuevo y posicionar su vehículo para salir de manera adecuada
      y segura.
    D: Hacer un giro brusco a la derecha desde el carril interior inmediatamente.
  answer: C
  explanation: 'El manual establece: ''Si se pasa de su salida, no se altere. Verifique
    el tráfico a su alrededor. Si es seguro hacerlo, dé la vuelta de nuevo y posicione
    su vehículo para salir de la glorieta de manera adecuada y segura. No se detenga
    en la glorieta''.'
- id: 344
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima a la que debe circular cuando conduce en
    una rotonda (roundabout)?
  choices:
    A: 15 millas por hora
    B: 25 millas por hora
    C: 35 millas por hora
    D: 40 millas por hora
  answer: B
  explanation: Las rotondas se utilizan en calles concurridas y su tamaño pequeño
    requiere que los vehículos reduzcan la velocidad a 25 millas por hora o menos.
- id: 345
  category: defensive_driving
  question: ¿Por qué es peligroso hacerle señas a otro conductor para que pase a través
    del tráfico detenido?
  choices:
    A: Es ilegal usar gestos con las manos mientras se conduce.
    B: Puede causar un 'choque por cortesía' porque el tráfico que viene en sentido
      contrario todavía tiene el derecho de paso.
    C: Distrae a los peatones en el cruce peatonal.
    D: Transfiere automáticamente el derecho de paso al vehículo que está girando.
  answer: B
  explanation: Hacer señas a las personas para que pasen a través del tráfico detenido
    crea una situación peligrosa y puede resultar fácilmente en un choque. El tráfico
    que viene en sentido contrario tiene el derecho de paso, independientemente de
    si alguien le está haciendo señas.
- id: 346
  category: safe_driving_rules
  question: ¿En cuál de las siguientes áreas está legalmente permitido adelantar a
    otro vehículo?
  choices:
    A: El carril de emergencia (breakdown lane)
    B: El acotamiento de la carretera (shoulder)
    C: La acera (sidewalk)
    D: Ninguna de las anteriores
  answer: D
  explanation: 'El manual establece explícitamente: ''Nunca use un carril de emergencia,
    el acotamiento de una carretera o una acera para adelantar a otro vehículo''.'
- id: 347
  category: safe_driving_rules
  question: Al cruzar una línea amarilla discontinua para adelantar a otro vehículo,
    ¿qué tan adelante debe poder ver con claridad?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: D
  explanation: Si está cruzando una línea amarilla discontinua para adelantar, debe
    poder ver claramente al menos 400 pies delante de usted.
- id: 348
  category: safe_driving_rules
  question: Al adelantar por la izquierda, ¿debe regresar al carril derecho antes
    de que un vehículo que viene en sentido contrario se acerque a cuántos pies de
    usted?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 400 pies
  answer: B
  explanation: Debe regresar al carril derecho antes de que cualquier vehículo que
    venga en sentido contrario se acerque a menos de 200 pies de usted.
- id: 349
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes circunstancias se le permite adelantar a
    un vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante circula por debajo del límite de velocidad.
    B: Cuando el vehículo de adelante está girando, o está a punto de girar, a la
      izquierda.
    C: Cuando conduce en una calle de doble sentido con un solo carril en cada dirección.
    D: Cuando el vehículo de adelante está detenido en un cruce peatonal.
  answer: B
  explanation: Se permite adelantar por la derecha cuando el vehículo al que está
    adelantando está girando, o está a punto de girar, a la izquierda, en una calle
    de sentido único o en una carretera donde el tráfico se mueve en una sola dirección.
- id: 350
  category: sharing_the_road
  question: ¿Qué debe hacer si otro vehículo lo está adelantando?
  choices:
    A: Aumentar la velocidad para mantener su posición.
    B: Moverse al carril izquierdo.
    C: Reducir la velocidad y mantenerse a la derecha.
    D: Tocar la bocina para advertir al conductor que lo adelanta.
  answer: C
  explanation: Si otro vehículo lo está adelantando, debe reducir la velocidad y mantenerse
    a la derecha. Permita que el otro conductor pase de manera segura. No aumente
    la velocidad.
- id: 351
  category: safe_driving_rules
  question: ¿Qué le exige la 'ley de hacerse a un lado' (move-over law) que haga al
    acercarse a un vehículo de emergencia estacionado con luces intermitentes en una
    carretera de varios carriles?
  choices:
    A: Detenerse inmediatamente y esperar a que el vehículo se retire.
    B: Mantener su velocidad y permanecer en su carril actual.
    C: Ceder el derecho de paso moviéndose de manera segura a un carril que no esté
      al lado del vehículo de emergencia.
    D: Tocar la bocina para reconocer al vehículo de emergencia.
  answer: C
  explanation: La 'ley de hacerse a un lado' exige que proceda con precaución, reduzca
    su velocidad y, si se encuentra en una carretera con al menos cuatro carriles,
    se mueva de manera segura a un carril que no sea el contiguo al carril que ocupa
    el vehículo de emergencia.
- id: 352
  category: defensive_driving
  question: ¿Cuál es la acción recomendada a tomar cuando se enfrenta a un conductor
    agresivo?
  choices:
    A: Hacer contacto visual para demostrar que no está intimidado.
    B: Desafiar al conductor igualando su velocidad.
    C: Intentar apartarse de su camino y evitar el contacto visual.
    D: Seguirlo para reportar su número de placa.
  answer: C
  explanation: Cuando se enfrente a un conductor agresivo, debe intentar apartarse
    de su camino, no desafiar a esa persona, evitar el contacto visual e ignorar los
    gestos groseros.
- id: 353
  category: sharing_the_road
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar que tiene
    sus luces rojas intermitentes y la señal de alto extendida?
  choices:
    A: Cuando viaja en la dirección opuesta en una carretera de dos carriles.
    B: Cuando el autobús escolar está detenido al otro lado de una carretera dividida
      con una barrera.
    C: Cuando llega tarde al trabajo.
    D: Cuando no hay niños visibles alrededor del autobús.
  answer: B
  explanation: La única excepción a la ley de detención de autobuses escolares es
    si un autobús escolar se ha detenido al otro lado de una carretera dividida con
    una barrera entre las direcciones de viaje.
- id: 354
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por no detenerse ante un
    autobús escolar con luces rojas intermitentes?
  choices:
    A: Una multa de $100 y una advertencia.
    B: Una suspensión de la licencia y una multa de $250.
    C: Una multa de $500 y el embargo del vehículo.
    D: Servicio comunitario obligatorio.
  answer: B
  explanation: Una primera infracción de la ley que exige detenerse ante un autobús
    escolar con luces intermitentes puede causar la suspensión de la licencia y una
    multa de $250.
- id: 355
  category: sharing_the_road
  question: ¿Cómo puede saber si está siguiendo demasiado cerca (tailgating) a un
    camión grande?
  choices:
    A: Está a menos de 100 pies del camión.
    B: No puede ver los espejos retrovisores del camión.
    C: Puede leer la matrícula del camión.
    D: Está conduciendo más lento que el camión.
  answer: B
  explanation: 'El manual establece: ''Si no puede ver los espejos retrovisores de
    un camión, lo está siguiendo demasiado cerca''.'
- id: 356
  category: safe_driving_rules
  question: ¿Qué carril debe utilizar para entrar en una rotonda de varios carriles
    si tiene la intención de hacer un giro de tres cuartos o un giro en U?
  choices:
    A: El carril derecho
    B: El carril izquierdo
    C: El carril de emergencia (breakdown lane)
    D: Cualquier carril es aceptable
  answer: B
  explanation: Para un giro de tres cuartos o un giro en U, debe entrar a la rotonda
    desde el carril izquierdo, circular por el carril central o interior y salir por
    el carril derecho.
- id: 357
  category: defensive_driving
  question: Según los estudios, ¿cuánta distancia podría necesitar un camión con remolque
    (tractor-trailer) totalmente cargado para detenerse en comparación con un vehículo
    de pasajeros?
  choices:
    A: La misma distancia
    B: Una vez y media más lejos
    C: El doble de distancia
    D: El triple de distancia
  answer: C
  explanation: Los estudios del Consejo Nacional de Seguridad y del Instituto de Seguros
    para la Seguridad en las Carreteras muestran que un camión con remolque totalmente
    cargado puede tardar el doble de distancia en detenerse que un vehículo de pasajeros.
- id: 358
  category: sharing_the_road
  question: Cuando un tranvía (trolley) está subiendo o bajando pasajeros, ¿cuál es
    la distancia más cercana a la que puede conducir del escalón de pasajeros del
    tranvía?
  choices:
    A: 5 pies
    B: 8 pies
    C: 10 pies
    D: 12 pies
  answer: B
  explanation: La ley estatal exige que no debe conducir a menos de ocho pies del
    escalón de pasajeros de un tranvía cuando este esté subiendo o bajando pasajeros.
- id: 359
  category: signs_and_signals
  question: ¿Qué tipo de señal se coloca normalmente en la parte trasera de los vehículos
    agrícolas, equipos de construcción y otros vehículos de movimiento lento?
  choices:
    A: Una señal de diamante amarilla
    B: Una señal triangular roja y blanca
    C: Una señal de advertencia naranja
    D: Una señal rectangular verde
  answer: C
  explanation: La mayoría de los vehículos agrícolas, equipos de construcción y otros
    vehículos de movimiento lento tienen señales de advertencia naranjas en la parte
    trasera.
- id: 360
  category: safe_driving_rules
  question: 'Los cortejos fúnebres tienen el derecho de paso en las intersecciones,
    EXCEPTO cuando deben ceder el paso a:'
  choices:
    A: Peatones en los cruces peatonales
    B: Tráfico en sentido contrario con luz verde
    C: Vehículos de emergencia con luces intermitentes o sirenas
    D: Autobuses de transporte público
  answer: C
  explanation: Los cortejos fúnebres tienen el derecho de paso en las intersecciones,
    con la EXCEPCIÓN de que deben ceder el paso a los vehículos de emergencia con
    luces intermitentes o sirenas o cuando así lo indique la policía.
- id: 361
  category: safe_driving_rules
  question: Si conduce como parte de un cortejo fúnebre en una carretera con un límite
    de velocidad de 55 MPH o superior, ¿cuál es la velocidad máxima a la que se le
    permite conducir?
  choices:
    A: 45 MPH
    B: 50 MPH
    C: 55 MPH
    D: 60 MPH
  answer: C
  explanation: Si conduce como parte de un cortejo fúnebre, no debe conducir a más
    de 55 MPH en una carretera con un límite de velocidad de 55 MPH o superior.
- id: 362
  category: sharing_the_road
  question: Si su vehículo NO forma parte de un cortejo fúnebre, ¿cuál de las siguientes
    acciones está permitida?
  choices:
    A: Conducir entre los vehículos del cortejo si tiene prisa
    B: Unirse al cortejo para evitar el tráfico
    C: Rebasar al cortejo por la derecha en una carretera de varios carriles si el
      cortejo está en el carril del extremo izquierdo
    D: Cruzar una intersección con luz verde mientras el cortejo pasa con luz roja,
      incluso si se cruza en su camino
  answer: C
  explanation: No puede rebasar a un cortejo en una carretera de varios carriles por
    la derecha del cortejo, a menos que el cortejo esté en el carril del extremo izquierdo.
- id: 363
  category: penalties_and_points
  question: ¿Cuál es la sanción por recibir una citación por exceso de velocidad en
    una "zona de obras"?
  choices:
    A: Su licencia será suspendida por 30 días
    B: La multa se duplicará
    C: Recibirá una advertencia por la primera infracción
    D: Debe asistir a un curso de reentrenamiento para conductores
  answer: B
  explanation: Si recibe una citación por exceso de velocidad en una “zona de obras”,
    la multa se duplicará.
- id: 364
  category: sharing_the_road
  question: ¿Qué debe hacer si está pasando a un animal que está siendo guiado, montado
    o conducido, y el animal parece asustado?
  choices:
    A: Toque la bocina ligeramente para advertir al animal
    B: Acelere para pasar al animal rápidamente
    C: Orille su vehículo a un lado y deténgase
    D: Encienda las luces de emergencia y continúe a la misma velocidad
  answer: C
  explanation: Si el animal al que está pasando parece asustado, debe orillar su vehículo
    a un lado y detenerse.
- id: 365
  category: safe_driving_rules
  question: Al estacionar su vehículo, ¿siempre debe asegurarse de dejar un camino
    despejado para el tráfico que pasa de al menos qué ancho?
  choices:
    A: 8 pies
    B: 10 pies
    C: 12 pies
    D: 15 pies
  answer: C
  explanation: Siempre debe asegurarse de dejar un camino despejado de al menos 12
    pies de ancho para que pase el tráfico.
- id: 366
  category: safe_driving_rules
  question: Si se estaciona en un distrito comercial o residencial, ¿cuál es la distancia
    máxima a la que puede estar su vehículo de la acera (a menos que se permita el
    estacionamiento en ángulo)?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: Si se estaciona en un distrito comercial o residencial, su vehículo
    no debe estar a más de 12 pulgadas de la acera. La única excepción es si se permite
    el estacionamiento en ángulo.
- id: 367
  category: vehicle_information
  question: La ley estatal exige que tome varias medidas al dejar su vehículo solo.
    ¿Cuál de las siguientes NO figura explícitamente como una de estas acciones requeridas?
  choices:
    A: Apagar el motor
    B: Poner el freno de estacionamiento
    C: Encender las luces de emergencia
    D: Quitar la llave y cerrar la puerta con llave
  answer: C
  explanation: Cuando deja su vehículo solo, la ley estatal exige que apague el motor,
    ponga el freno de estacionamiento, se asegure de que el encendido esté bloqueado,
    retire la llave y cierre la puerta con llave. Encender las luces de emergencia
    no figura en la lista.
- id: 368
  category: defensive_driving
  question: Al retroceder lentamente para estacionar en paralelo, ¿hacia dónde debe
    mirar?
  choices:
    A: Directamente por la ventana trasera
    B: En el espejo retrovisor
    C: En los espejos laterales
    D: En la pantalla de la cámara de reversa
  answer: A
  explanation: 'Al retroceder lentamente para estacionar en paralelo, el manual indica:
    "Mire directamente por la ventana trasera. No use sus espejos".'
- id: 369
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a un camión o autobús por la derecha a menos
    que sea absolutamente necesario?
  choices:
    A: Los vehículos grandes están obligados a circular por el carril del extremo
      izquierdo
    B: Los vehículos grandes viajan más rápido cuesta abajo
    C: Los vehículos grandes realizan giros amplios y pueden moverse a la izquierda
      antes de girar a la derecha
    D: Rebasar por la derecha es ilegal en todas las autopistas de varios carriles
  answer: C
  explanation: No rebase a un camión o autobús por la derecha a menos que sea absolutamente
    necesario. Los vehículos grandes realizan giros amplios y, a veces, deben moverse
    hacia la izquierda antes de realizar un giro amplio hacia la derecha.
- id: 370
  category: sharing_the_road
  question: Si un vehículo grande viene hacia usted en una carretera no dividida,
    ¿por qué debería mantenerse a la derecha?
  choices:
    A: Para dar espacio al vehículo grande para rebasar a otros autos
    B: Para evitar ser golpeado lateralmente o sacudido por la turbulencia del aire
    C: Para prepararse para un giro a la derecha
    D: Para permitir que el vehículo grande vea mejor sus faros
  answer: B
  explanation: Si un vehículo grande viene hacia usted en una carretera no dividida,
    manténgase a la derecha. Evitará ser golpeado lateralmente o sacudido por la turbulencia
    del aire.
- id: 371
  category: safe_driving_rules
  question: Al estacionar cuesta arriba contra una acera, ¿hacia qué lado debe girar
    las ruedas delanteras de su vehículo?
  choices:
    A: Hacia adentro, hacia la acera
    B: Hacia afuera, hacia el carril de circulación
    C: Hacia adelante
    D: Hacia adentro, hacia el borde de la carretera
  answer: B
  explanation: Al estacionar cuesta arriba contra una acera, debe girar las ruedas
    hacia afuera, hacia el carril de circulación, para evitar que ruede cuesta abajo
    si falla el freno.
- id: 372
  category: safe_driving_rules
  question: ¿Es ilegal estacionar su vehículo a menos de cuántos pies de un hidrante
    de incendios o un carril de bomberos?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: En Massachusetts, no puede estacionar su vehículo a menos de diez pies
    de un hidrante de incendios o un carril de bomberos.
- id: 373
  category: penalties_and_points
  question: ¿Cuál es la multa por estacionarse en una parada de autobús señalizada
    en Massachusetts?
  choices:
    A: $50
    B: $100
    C: $300
    D: $500
  answer: B
  explanation: La multa por estacionarse en una parada de autobús señalizada es de
    $100.
- id: 374
  category: safe_driving_rules
  question: ¿A cuántos pies de una intersección está prohibido estacionar su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: No puede estacionar su vehículo a menos de 20 pies de una intersección.
- id: 375
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por el uso indebido de una placa o distintivo
    (placard) para personas con discapacidad o veteranos?
  choices:
    A: $100
    B: $250
    C: $300
    D: $500
  answer: D
  explanation: La multa por el uso indebido de una placa o distintivo para personas
    con discapacidad o veteranos es de un mínimo de $500.
- id: 376
  category: driver_responsibility
  question: ¿Cómo debe desechar el aceite de motor y el líquido de transmisión usados?
  choices:
    A: Verterlo en un desagüe pluvial
    B: Tirarlo a la basura regular
    C: Devolverlo al lugar donde lo compró
    D: Dejarlo en una estación de bomberos local
  answer: C
  explanation: Debe devolver el aceite de motor, el líquido de transmisión y otros
    materiales peligrosos usados al lugar donde los compró. El taller o la tienda
    que se los vendió es responsable de desecharlos.
- id: 377
  category: sharing_the_road
  question: Si no hay una acera disponible, ¿por dónde debe caminar un peatón?
  choices:
    A: En el arcén (shoulder) de frente al tráfico
    B: En el arcén en la misma dirección que el tráfico
    C: En el centro del carril de circulación
    D: Solo en el carril para bicicletas
  answer: A
  explanation: Cuando no hay una acera disponible, los peatones deben caminar por
    el arcén de frente al tráfico.
- id: 378
  category: sharing_the_road
  question: ¿Qué edad debe tener un operador o pasajero de bicicleta para que sea
    obligatorio el uso de un casco aprobado por la Comisión de Seguridad de Productos
    del Consumidor de los EE. UU.?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: Un operador o pasajero de bicicleta menor de 16 años debe usar un casco
    de bicicleta aprobado por la Comisión de Seguridad de Productos del Consumidor
    de los EE. UU.
- id: 379
  category: sharing_the_road
  question: ¿Menor de qué edad es ilegal transportar a un niño en una bicicleta?
  choices:
    A: Menor de 1 año
    B: Menor de 2 años
    C: Menor de 3 años
    D: Menor de 4 años
  answer: A
  explanation: No se puede transportar a un niño menor de un año en una bicicleta.
- id: 380
  category: sharing_the_road
  question: Desde media hora después de la puesta del sol hasta media hora antes del
    amanecer, ¿a cuántos pies de distancia debe ser visible la luz delantera blanca
    de un ciclista?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: C
  explanation: Desde media hora después de la puesta del sol hasta media hora antes
    del amanecer, debe tener una luz blanca en la parte delantera visible desde una
    distancia de hasta 500 pies.
- id: 381
  category: sharing_the_road
  question: ¿En qué distancia debe ser capaz de detenerse una bicicleta que circula
    a 15 MPH con un sistema de frenos que funcione correctamente?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Debe tener un sistema de frenos que funcione correctamente para detenerse
    desde 15 MPH en una distancia de 30 pies.
- id: 382
  category: sharing_the_road
  question: ¿Cuál es el número máximo de bicicletas que pueden circular una al lado
    de la otra en una calzada?
  choices:
    A: Una (solo en fila india)
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: No se pueden operar más de dos bicicletas una al lado de la otra.
- id: 383
  category: defensive_driving
  question: Para evitar las puertas de los autos que se abren, los ciclistas deben
    circular fuera de la "zona de la puerta" manteniéndose a ¿qué distancia mínima
    de los autos estacionados?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cinco pies
  answer: C
  explanation: Los ciclistas deben circular fuera de la "zona de la puerta" (al menos
    a tres pies de los autos estacionados) y estar atentos a las puertas de los autos
    que se abren.
- id: 384
  category: driver_responsibility
  question: Un ciclista debe reportar un choque a la policía si este involucra lesiones
    personales o daños a la propiedad que excedan ¿qué cantidad?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Debe reportar cualquier choque que involucre lesiones personales y
    cualquier choque que involucre daños a la propiedad que excedan los $100 a la
    policía del municipio donde ocurrió.
- id: 385
  category: sharing_the_road
  question: Al rebasar a una bicicleta en un carril estrecho, ¿cuál es la distancia
    mínima que debe mantener entre su vehículo y el ciclista?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: El manual establece que si un carril es demasiado estrecho para rebasar
    a una bicicleta a una distancia segura, debe esperar hasta que sea seguro y mantenerse
    al menos a cuatro pies de distancia al rebasar.
- id: 386
  category: penalties_and_points
  question: ¿Cuál es la multa máxima para un conductor o pasajero que abre la puerta
    de un vehículo hacia una bicicleta que se aproxima?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: Según el manual, los conductores y pasajeros pueden ser multados con
    hasta $100 por abrir la puerta de un vehículo hacia una bicicleta que se aproxima.
- id: 387
  category: sharing_the_road
  question: ¿Se les permite legalmente a los ciclistas circular de dos en dos (uno
    al lado del otro) en la carretera?
  choices:
    A: No, siempre deben circular en fila india.
    B: Sí, pero en una carretera con más de un carril en la dirección de viaje, deben
      permanecer en un solo carril.
    C: Sí, y pueden ocupar varios carriles si es necesario.
    D: No, a menos que estén rebasando a otro ciclista.
  answer: B
  explanation: El manual señala que los ciclistas pueden circular con dos bicicletas
    una al lado de la otra. Sin embargo, en una carretera con más de un carril en
    la dirección de viaje, deben permanecer en un solo carril.
- id: 388
  category: sharing_the_road
  question: ¿Por qué un ciclista podría elegir legalmente no usar una señal manual
    para indicar un giro?
  choices:
    A: Las señales manuales solo son obligatorias para los vehículos motorizados.
    B: Viajan a menos de 10 mph.
    C: Se necesitan ambas manos para la operación segura de la bicicleta.
    D: Están circulando en un carril para bicicletas designado.
  answer: C
  explanation: Los ciclistas deben señalar su intención de detenerse o girar, pero
    no es necesario hacer la señal si se necesitan ambas manos para la operación segura
    de la bicicleta.
- id: 389
  category: safe_driving_rules
  question: ¿Cuál es el propósito principal del método 'Dutch Reach' (alcance holandés)?
  choices:
    A: Rebasar de forma segura a un ciclista en una carretera estrecha.
    B: Abrir la puerta del vehículo con la mano más alejada, obligando al cuerpo a
      girar y ver a los ciclistas que se aproximan.
    C: Permitir que los ciclistas realicen un giro a la izquierda en dos etapas en
      una intersección.
    D: Dirigir un vehículo de forma segura fuera de un derrape.
  answer: B
  explanation: El método 'Dutch Reach' consiste en abrir la puerta con la mano más
    alejada, lo que obliga a su cuerpo a girar y le permite ver mejor a los ciclistas
    que se aproximan antes de abrir la puerta.
- id: 390
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al acercarse a una luz roja en una intersección
    con una 'caja de bicicleta' (bicycle box) verde pintada en el pavimento?
  choices:
    A: Detenerse dentro de la caja de bicicleta para activar el sensor del semáforo.
    B: Detenerse detrás de la caja de bicicleta, incluso cuando esté vacía, y esperar
      la luz verde.
    C: Entrar en la caja de bicicleta solo si va a girar a la derecha en rojo.
    D: Tocar la bocina para despejar la caja de bicicleta antes de avanzar.
  answer: B
  explanation: Los conductores deben detenerse detrás de la caja de bicicleta (incluso
    cuando esté vacía) y esperar a que la luz cambie a verde.
- id: 391
  category: safe_driving_rules
  question: ¿Qué debe hacer si un vehículo de emergencia con su sirena y luces intermitentes
    se aproxima mientras usted está en medio de una intersección?
  choices:
    A: Detenerse inmediatamente en la intersección y esperar a que pase.
    B: Poner su vehículo en reversa y salir de la intersección.
    C: Cruzar la intersección y hacerse a un lado a la derecha tan pronto como sea
      seguro.
    D: Hacerse a un lado en el lado izquierdo de la intersección.
  answer: C
  explanation: 'El manual establece explícitamente: ''NUNCA se detenga en medio de
    una intersección. Cruce la intersección y hágase a un lado tan pronto como sea
    seguro''.'
- id: 392
  category: safe_driving_rules
  question: ¿Es ilegal seguir a menos de qué distancia a un vehículo de emergencia
    que responde a una alarma?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Según el manual, es ilegal seguir a menos de 300 pies a un vehículo
    de emergencia que responde a una alarma.
- id: 393
  category: safe_driving_rules
  question: ¿Qué debe hacer según la "ley de hacerse a un lado" (move-over law) al
    acercarse a un vehículo de emergencia estacionado con luces intermitentes en una
    autopista con al menos dos carriles que circulan en su dirección?
  choices:
    A: Detener su vehículo inmediatamente y esperar instrucciones.
    B: Mantener su velocidad pero cambiarse al carril izquierdo.
    C: Reducir su velocidad y cambiarse de carril de manera segura a uno que no esté
      junto al vehículo de emergencia.
    D: Tocar la bocina para alertar a los trabajadores de emergencia de su presencia.
  answer: C
  explanation: La ley de hacerse a un lado requiere que los conductores reduzcan la
    velocidad y cedan el paso cambiándose de carril de manera segura a uno que no
    esté junto al carril en el que se encuentra el vehículo de emergencia.
- id: 394
  category: defensive_driving
  question: Según el Departamento de Datos de Choques del RMV, ¿aproximadamente qué
    porcentaje de los choques en autopistas involucran a conductores menores de 25
    años?
  choices:
    A: 15 por ciento
    B: 25 por ciento
    C: 40 por ciento
    D: 60 por ciento
  answer: C
  explanation: El manual establece que aproximadamente el 40 por ciento de los choques
    en autopistas involucran a conductores menores de 25 años, causados principalmente
    por la inexperiencia del conductor.
- id: 395
  category: sharing_the_road
  question: ¿A qué distancia deben circular los ciclistas de los autos estacionados
    para evitar ser golpeados por la apertura de las puertas de los vehículos?
  choices:
    A: Al menos 1 pie
    B: Al menos 2 pies
    C: Al menos 3 pies
    D: Al menos 5 pies
  answer: C
  explanation: Los ciclistas deben circular al menos a tres pies de los autos estacionados
    para evitar las puertas y permanecer fuera de la "zona de la puerta".
- id: 396
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a los ciclistas que usan auriculares o
    audífonos?
  choices:
    A: Pueden usarlos en ambos oídos si el volumen se mantiene bajo.
    B: Tienen completamente prohibido el uso de cualquier tipo de auriculares.
    C: No deben usar auriculares ni audífonos en ambos oídos mientras andan en bicicleta.
    D: Pueden usarlos solo cuando circulan por un carril para bicicletas separado.
  answer: C
  explanation: 'El manual establece explícitamente: "No use auriculares ni audífonos
    en ambos oídos mientras anda en bicicleta".'
- id: 397
  category: sharing_the_road
  question: ¿Cuál de las siguientes es una regla de seguridad crítica para los ciclistas
    que comparten la carretera con vehículos grandes?
  choices:
    A: Siempre rebasar a un camión con remolque en movimiento por la derecha.
    B: Nunca rebasar a un camión con remolque en movimiento por la derecha.
    C: Circular directamente en el punto ciego trasero para ir a rebufo detrás del
      camión.
    D: Rebasar a los autobuses por la derecha para evitar el tráfico que viene en
      sentido contrario.
  answer: B
  explanation: 'El manual advierte a los ciclistas que tengan especial cuidado cerca
    de vehículos grandes y establece: "Nunca rebase a un camión con remolque en movimiento
    por la derecha".'
- id: 398
  category: safe_driving_rules
  question: Cuando se acerca un vehículo de emergencia con su sirena y luces intermitentes,
    ¿cuál de las siguientes acciones es inaceptable?
  choices:
    A: Acercarse lo más posible al lado derecho de la carretera.
    B: Usar la señal de giro a la derecha para indicar que se está deteniendo a un
      lado.
    C: Avanzar lentamente mientras el vehículo de emergencia pasa.
    D: Detenerse por completo hasta que el vehículo haya pasado.
  answer: C
  explanation: Cuando se acerca un vehículo de emergencia, debe hacerse a la derecha
    y detenerse. El manual especifica que "avanzar lentamente no es aceptable".
- id: 399
  category: sharing_the_road
  question: Al girar a la izquierda en una intersección, ¿qué debe hacer un conductor
    si se acerca una bicicleta desde la dirección opuesta?
  choices:
    A: Acelerar para completar el giro antes de que llegue la bicicleta.
    B: Ceder el paso a la bicicleta si está lo suficientemente cerca como para representar
      un peligro inmediato.
    C: Tocar la bocina para advertir al ciclista que se detenga.
    D: Proceder con el giro, ya que los vehículos motorizados tienen el derecho de
      paso sobre las bicicletas.
  answer: B
  explanation: Al girar a la izquierda, debe ceder el paso a cualquier vehículo que
    se acerque desde la dirección opuesta, incluyendo una bicicleta, si se encuentra
    en la intersección o lo suficientemente cerca como para representar un peligro
    inmediato.
- id: 400
  category: safe_driving_rules
  question: Si necesita asistencia de un oficial de policía que se encuentra en una
    patrulla estacionada, ¿dónde debe ubicar su vehículo?
  choices:
    A: Directamente detrás de la patrulla policial
    B: Al lado de la patrulla policial en el carril de circulación
    C: Delante de la patrulla policial
    D: Al otro lado de la calle de la patrulla policial
  answer: C
  explanation: 'El manual aconseja: "Si necesita ayuda, deténgase delante de la patrulla
    policial y pida ayuda. Nunca se detenga detrás de una patrulla policial".'
- id: 401
  category: driver_responsibility
  question: ¿Qué debe hacer con las luces de su vehículo si un oficial de policía
    lo detiene por la noche?
  choices:
    A: Apagar todas las luces para evitar cegar al oficial
    B: Encender las luces altas y las luces de emergencia
    C: Apagar los faros delanteros pero dejar encendidas las luces de estacionamiento
    D: Dejar los faros delanteros encendidos y encender la luz interior del techo
  answer: D
  explanation: Durante una parada de tráfico en la oscuridad, el manual instruye a
    los conductores a "dejar los faros delanteros encendidos y encender la luz interior
    del techo".
- id: 402
  category: driver_responsibility
  question: Durante una parada de tráfico, ¿cuándo es el momento adecuado para buscar
    su licencia y registro en la guantera?
  choices:
    A: Tan pronto como se detenga, antes de que el oficial se acerque al vehículo
    B: Mientras el oficial camina hacia su vehículo
    C: Solo después de que el oficial le pida su licencia y registro
    D: Debe entregarle al oficial su billetera completa tan pronto como llegue a la
      ventana
  answer: C
  explanation: 'El manual advierte a los conductores: "Espere hasta que el oficial
    le pida su licencia y registro antes de que usted (o un pasajero) busque en la
    guantera" para evitar movimientos repentinos que podrían percibirse como una amenaza.'
- id: 403
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción por no presentar su licencia
    y registro cuando lo solicita un oficial de policía?
  choices:
    A: $35
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: Según el Capítulo 90, Sección 11 de las Leyes Generales, 'Hay una multa
    de $35 por una primera infracción por no presentar cualquiera de los dos documentos'.
- id: 404
  category: penalties_and_points
  question: Si no cumple con la solicitud de un oficial de policía de proporcionar
    su nombre y dirección, o si proporciona un nombre o dirección falsos, ¿a qué multa
    se puede enfrentar?
  choices:
    A: $35
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: 'El manual establece: ''Si no cumple, o proporciona un nombre o dirección
    falsos, puede ser multado con $100 (Capítulo 90, Sección 25)''.'
- id: 405
  category: safe_driving_rules
  question: ¿Cómo debe reincorporarse al tráfico después de haber sido detenido por
    un oficial de policía en una autopista?
  choices:
    A: Incorporarse inmediatamente al carril de circulación a baja velocidad
    B: Esperar a que el oficial de policía bloquee el tráfico por usted
    C: Acelerar a una velocidad segura en el carril de emergencia (breakdown lane)
      antes de incorporarse al tráfico
    D: Conducir por el carril de emergencia hasta llegar a la siguiente salida
  answer: C
  explanation: El manual aconseja que cuando el oficial le indique que puede irse,
    'Si se encuentra en una autopista, acelere a una velocidad segura en el carril
    de emergencia (breakdown lane) antes de incorporarse al tráfico'.
- id: 406
  category: defensive_driving
  question: ¿Cuál es el primer paso que debe tomar si su vehículo comienza a derrapar?
  choices:
    A: Pisar los frenos a fondo inmediatamente
    B: Acelerar rápidamente para recuperar la tracción
    C: Retirar lentamente el pie del pedal del acelerador y poner el vehículo en punto
      muerto (neutral)
    D: Apagar el encendido del vehículo
  answer: C
  explanation: 'Para controlar un derrape, el manual indica a los conductores: ''Retire
    lentamente el pie del pedal del acelerador y ponga el vehículo en punto muerto
    (neutral)'' y advierte explícitamente no pisar los frenos.'
- id: 407
  category: defensive_driving
  question: ¿En qué dirección debe girar el volante si sus neumáticos traseros están
    derrapando hacia la izquierda?
  choices:
    A: Hacia la derecha
    B: Hacia la izquierda
    C: Mantener el volante perfectamente recto
    D: Girar el volante en zigzag
  answer: B
  explanation: 'El manual instruye a los conductores: ''Gire el volante en la dirección
    del derrape. Si sus neumáticos traseros derrapan hacia la izquierda, gire el volante
    hacia la izquierda''.'
- id: 408
  category: defensive_driving
  question: ¿Qué debe hacer si accidentalmente se sale del pavimento hacia el arcén
    (shoulder) de la carretera?
  choices:
    A: Girar el volante bruscamente hacia la izquierda para volver a la carretera
    B: Pisar los frenos a fondo para detener el vehículo inmediatamente
    C: Acelerar para volver al pavimento lo más rápido posible
    D: Sujetar el volante con firmeza, retirar lentamente el pie del acelerador y
      aplicar el freno suavemente
  answer: D
  explanation: 'Si se sale del pavimento, el manual dice: ''Sujete el volante con
    firmeza y retire lentamente el pie del pedal del acelerador. Aplique suavemente
    el freno para reducir su velocidad''.'
- id: 409
  category: defensive_driving
  question: ¿Cómo debe reaccionar si experimenta el reventón de un neumático mientras
    conduce?
  choices:
    A: Sujetar el volante con firmeza y retirar lentamente el pie del pedal del acelerador
    B: Pisar los frenos con fuerza para detener el automóvil antes de que el neumático
      se desprenda por completo
    C: Dirigirse inmediatamente al arcén sin verificar el tráfico
    D: Acelerar ligeramente para mantener el vehículo moviéndose en línea recta
  answer: A
  explanation: 'En caso de un neumático desinflado o reventón, el manual instruye:
    ''Sujete el volante con firmeza y retire lentamente el pie del pedal del acelerador''
    y aplique los frenos suavemente.'
- id: 410
  category: defensive_driving
  question: Si su vehículo tiene frenos antibloqueo (ABS) y estos no responden cuando
    presiona el pedal, ¿qué debe hacer?
  choices:
    A: Cambiar a la marcha más alta posible
    B: Apagar el encendido inmediatamente para cortar la potencia del motor
    C: Reducir a una marcha más baja y aplicar suavemente el freno de mano
    D: Bombear el pedal del acelerador repetidamente
  answer: C
  explanation: 'En caso de falla de los frenos, el manual aconseja: ''Reduzca a una
    marcha más baja... Aplique el freno de mano suavemente. Sujete el desbloqueo del
    freno en caso de que su vehículo comience a derrapar''.'
- id: 411
  category: safe_driving_rules
  question: Cuando un oficial de policía le indique que se detenga, ¿en cuál de los
    siguientes lugares debe evitar detenerse?
  choices:
    A: El lado derecho de la carretera
    B: Un carril de emergencia designado
    C: Una intersección o un carril de circulación
    D: Un estacionamiento seguro y bien iluminado
  answer: C
  explanation: 'El manual establece explícitamente: ''No detenga su vehículo en una
    intersección, frente a una entrada para vehículos o en un carril de circulación''.'
- id: 412
  category: defensive_driving
  question: Si su vehículo comienza a derrapar, ¿en qué dirección debe girar el volante?
  choices:
    A: En la dirección opuesta al derrape.
    B: Recto hacia adelante.
    C: En la dirección del derrape.
    D: Hacia el lado derecho de la carretera.
  answer: C
  explanation: Según el manual, si su vehículo derrapa, siempre debe girar el volante
    en la dirección del derrape.
- id: 413
  category: defensive_driving
  question: ¿Cómo debe reaccionar si un vehículo se dirige hacia usted de frente en
    su carril?
  choices:
    A: Acelerar y virar hacia la izquierda.
    B: Detenerse inmediatamente en su carril.
    C: Reducir la velocidad y orillarse hacia la derecha.
    D: Hacer señales con las luces delanteras y mantener su velocidad.
  answer: C
  explanation: Si un vehículo se aproxima de frente en su carril, debe reducir la
    velocidad, orillarse hacia la derecha y tocar la bocina para alertar al otro conductor.
- id: 414
  category: defensive_driving
  question: Si su vehículo se apaga en las vías del tren y se aproxima un tren, ¿hacia
    dónde debe correr para alejarse de las vías?
  choices:
    A: En un ángulo de 45 grados alejándose de las vías en la dirección de donde viene
      el tren.
    B: Directamente por las vías alejándose del tren.
    C: En un ángulo de 45 grados alejándose de las vías en la misma dirección en la
      que viaja el tren.
    D: Perpendicular a las vías directamente hacia el campo más cercano.
  answer: A
  explanation: Para evitar ser golpeado por los escombros, debe correr en un ángulo
    de 45 grados alejándose de las vías en la dirección de donde viene el tren.
- id: 415
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo se avería en una autopista que tiene un
    carril de emergencia (breakdown lane)?
  choices:
    A: Pararse en el carril de emergencia para pedir ayuda con señas.
    B: Mover su vehículo lo más lejos posible del carril de circulación y permanecer
      dentro del vehículo.
    C: Salir de su vehículo y pararse cerca del carril de circulación para dirigir
      el tráfico.
    D: Dejar su vehículo en el carril de circulación y caminar hasta la salida más
      cercana.
  answer: B
  explanation: En una autopista con carril de emergencia, debe mover su vehículo lo
    más lejos posible del carril de circulación y permanecer dentro de él. No se pare
    cerca del carril de circulación ni en el carril de emergencia.
- id: 416
  category: safe_driving_rules
  question: Cuando su vehículo se avería, ¿de qué color debe ser el paño que ate a
    su antena o a la manija de la puerta si está nevando?
  choices:
    A: Blanco
    B: Amarillo
    C: Rojo
    D: Naranja
  answer: C
  explanation: El manual aconseja atar un paño blanco a la antena o a la manija de
    la puerta durante una avería, pero especifica usar un paño rojo cuando está nevando.
- id: 417
  category: defensive_driving
  question: ¿Por qué debe evitar abrir una puerta si su vehículo cae al agua?
  choices:
    A: Hará que las ventanas eléctricas sufran un cortocircuito.
    B: Hará que el agua entre repentinamente y su vehículo podría volcarse.
    C: Atrapará la bolsa de aire en el asiento trasero.
    D: Desplegará las bolsas de aire innecesariamente.
  answer: B
  explanation: Si su automóvil cae al agua, no debe abrir la puerta porque esto causaría
    que el agua entre repentinamente y su vehículo podría volcarse.
- id: 418
  category: driver_responsibility
  question: Si hay un incendio mientras conduce a través de un túnel, ¿qué debe hacer
    con las llaves de su vehículo?
  choices:
    A: Llevárselas con usted al salir del vehículo.
    B: Tirarlas por la ventana.
    C: Dejarlas en el vehículo para ayudar al personal de emergencia.
    D: Esconderlas debajo del asiento del conductor.
  answer: C
  explanation: En caso de incendio en un túnel, debe detenerse, apagar el motor, salir
    de su vehículo y dejar las llaves puestas para ayudar al personal de emergencia.
- id: 419
  category: safe_driving_rules
  question: ¿Cuál de los siguientes está explícitamente prohibido al entrar en un
    túnel en Massachusetts?
  choices:
    A: Combustible diésel
    B: Propano
    C: Vehículos comerciales
    D: Camionetas de pasajeros
  answer: B
  explanation: Al entrar en un túnel, los materiales peligrosos están prohibidos,
    incluyendo el propano.
- id: 420
  category: driver_responsibility
  question: Según la Ley de Retiro del Conductor (Driver Removal Law), ¿qué debe hacer
    si se ve involucrado en un choque sin heridos?
  choices:
    A: Dejar los vehículos exactamente donde están hasta que llegue la policía.
    B: Mover los vehículos fuera de los carriles de circulación a un lugar seguro.
    C: Esperar a una grúa antes de intentar mover los vehículos.
    D: Dirigir el tráfico alrededor de su vehículo mientras lo deja en el carril de
      circulación.
  answer: B
  explanation: Si no hay heridos, la Ley de Retiro del Conductor exige que los vehículos
    se muevan fuera de los carriles de circulación a un lugar seguro.
- id: 421
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un informe de accidente ante el RMV
    y la policía local si se ve involucrado en un choque con daños a la propiedad
    de $1,000 o más?
  choices:
    A: 2 días
    B: 3 días
    C: 5 días
    D: 10 días
  answer: C
  explanation: Dentro de los cinco días posteriores al accidente, debe presentar un
    informe de accidente tanto al RMV como al departamento de policía local por cualquier
    choque con daños a la propiedad de $1,000 o más.
- id: 422
  category: driver_responsibility
  question: ¿Qué debe hacer si hiere a un animal, como un perro o un gato, en un accidente
    de vehículo motorizado?
  choices:
    A: Mover al animal a un lado de la carretera e irse de la escena.
    B: Llevar al animal a la clínica veterinaria más cercana de inmediato.
    C: Notificar a la policía local y, si es posible, al dueño del animal.
    D: Presentar un informe de accidente ante el RMV en un plazo de 24 horas.
  answer: C
  explanation: Si ha herido a un gato, perro o cualquier otro animal, debe notificar
    a la policía local y, si es posible, al dueño del animal.
- id: 423
  category: defensive_driving
  question: Al brindar primeros auxilios de emergencia en la escena de un choque,
    ¿por qué debería cubrir a una persona lesionada con una manta o abrigo?
  choices:
    A: Para ocultar sus lesiones a otros conductores.
    B: Para proporcionar calor y prevenir el estado de choque (shock).
    C: Para evitar que se muevan.
    D: Para elevar su temperatura corporal por encima de lo normal.
  answer: B
  explanation: Los consejos de primeros auxilios de emergencia indican cubrir a la
    persona lesionada con una manta o abrigo para proporcionar calor y prevenir el
    estado de choque (shock).
- id: 424
  category: penalties_and_points
  question: ¿Cuál es una consecuencia potencial de abandonar la escena de un choque
    sin identificarse adecuadamente?
  choices:
    A: Solo recibirá una advertencia si es su primera infracción.
    B: Se le requerirá tomar un curso de conducción defensiva.
    C: Podría ser acusado penalmente de una infracción por "abandonar la escena".
    D: Sus tarifas de seguro disminuirán.
  answer: C
  explanation: Si abandona la escena después de un choque sin identificarse adecuadamente,
    podría ser acusado penalmente de una infracción por "abandonar la escena".
- id: 425
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por abandonar la escena de un choque que cause
    daños a otro vehículo o propiedad?
  choices:
    A: Hasta $200 o hasta dos años de prisión, o ambos
    B: Hasta $500 y un año de prisión
    C: Hasta $1000 y seis meses de prisión
    D: Una multa obligatoria de $500 y la revocación de la licencia
  answer: A
  explanation: Según el manual, abandonar la escena después de un choque que cause
    daños a otro vehículo o propiedad puede resultar en sanciones de hasta $200 o
    hasta dos años de prisión, o ambos.
- id: 426
  category: penalties_and_points
  question: ¿A qué sanción se enfrenta si abandona la escena de un choque que cause
    lesiones personales a una persona (que no resulten en muerte)?
  choices:
    A: Hasta $500 y un año de prisión
    B: Hasta $1000 y prisión de hasta dos años
    C: Hasta $2000 y cinco años de prisión
    D: Hasta $5000 y diez años de prisión
  answer: B
  explanation: El manual establece que abandonar la escena después de un choque que
    cause lesiones personales (que no resulten en muerte) conlleva una sanción máxima
    de hasta $1000 y prisión de hasta dos años.
- id: 427
  category: driver_responsibility
  question: ¿Qué debe hacer si golpea y lesiona o mata a un gato o perro con su vehículo?
  choices:
    A: Mover al animal a un lado de la carretera e irse
    B: Notificar al dueño del animal o a la policía local
    C: Llevar al animal a la clínica veterinaria más cercana de inmediato
    D: Presentar un informe por escrito al RMV en un plazo de 5 días
  answer: B
  explanation: 'El manual establece: ''Si golpea y lesiona o mata a un gato o perro
    y no notifica al dueño del animal o a la policía local, puede ser multado bajo
    M.G.L. Capítulo 272, Sección 80H''.'
- id: 428
  category: penalties_and_points
  question: ¿Durante cuánto tiempo puede estar sujeto a recargos en el seguro tras
    una condena penal por abandonar la escena de un choque?
  choices:
    A: Hasta dos años
    B: Hasta cuatro años
    C: Hasta seis años
    D: Hasta diez años
  answer: C
  explanation: Cualquier condena penal puede resultar en costos de libertad condicional
    y usted puede estar sujeto a hasta seis años de recargos en el seguro.
- id: 429
  category: safe_driving_rules
  question: ¿Qué debe hacer si pasa por un choque y la policía y los vehículos de
    emergencia ya están allí?
  choices:
    A: Detener su vehículo para ver si puede ayudar a la policía
    B: Reducir la velocidad para 'curiosear' y tomar fotos para evidencia
    C: Reducir su velocidad, conducir con cuidado y no detenerse ni reducir la velocidad
      para 'curiosear'
    D: Tocar la bocina para advertir a los trabajadores de emergencia de su presencia
  answer: C
  explanation: 'Si la policía y los vehículos de emergencia están presentes, debe
    reducir su velocidad y conducir con cuidado. El manual establece explícitamente:
    ''No se detenga ni reduzca la velocidad para curiosear. Esto es peligroso y causará
    un problema de tráfico''.'
- id: 430
  category: defensive_driving
  question: Si usted es el primero en llegar a la escena de un choque y tiene bengalas
    o triángulos de emergencia, ¿dónde debe colocarlos?
  choices:
    A: A 50 pies o más por delante y por detrás del choque
    B: A 100 pies o más por delante y por detrás del choque
    C: A 200 pies o más por delante y por detrás del choque
    D: A 500 pies o más por delante y por detrás del choque
  answer: C
  explanation: Si alguien tiene bengalas, triángulos de emergencia o reflectores,
    debe colocarlos a 200 pies o más por delante y por detrás del choque para advertir
    a otros conductores.
- id: 431
  category: safe_driving_rules
  question: ¿Qué debe hacer si cables eléctricos han caído sobre un vehículo involucrado
    en un choque?
  choices:
    A: Decirle a las personas que están dentro que permanezcan allí hasta que llegue
      el personal de emergencia
    B: Retirar con cuidado los cables del vehículo usando un objeto no conductor
    C: Indicar a los ocupantes que salten fuera del vehículo sin tocar el marco de
      metal
    D: Abrir las puertas desde el exterior para ayudar a los ocupantes a escapar
  answer: A
  explanation: 'El manual advierte: ''Si cables eléctricos han caído sobre un vehículo,
    dígale a las personas que están dentro que permanezcan allí hasta que llegue el
    personal de emergencia. No toque el vehículo''.'
- id: 432
  category: driver_responsibility
  question: ¿Bajo qué condiciones está legalmente obligado a presentar un informe
    de choque por escrito ante el RMV?
  choices:
    A: Solo si alguien muere o resulta herido, independientemente de los daños a la
      propiedad
    B: Si alguien muere o resulta herido, o si hay $1,000 o más en daños a la propiedad
    C: Si hay $500 o más en daños a la propiedad
    D: Solo si el choque involucra a más de dos vehículos
  answer: B
  explanation: Debe informar cualquier choque de vehículo motorizado en el que esté
    involucrado que cause la muerte o lesiones a alguien, o que cause $1,000 o más
    en daños a la propiedad.
- id: 433
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un informe de accidente por escrito
    ante el RMV después de un accidente calificado?
  choices:
    A: En 24 horas
    B: En 3 días
    C: En 5 días
    D: En 10 días
  answer: C
  explanation: Debe presentar un informe por escrito ante el RMV dentro de los cinco
    días posteriores al accidente.
- id: 434
  category: driver_responsibility
  question: Cuando se le requiere presentar un informe de accidente, ¿a qué tres entidades
    debe enviar una copia?
  choices:
    A: Al RMV, al departamento de bomberos local y a su compañía de seguros
    B: Al departamento de policía local, a su compañía de seguros y al RMV
    C: A la Policía Estatal, al RMV y al Departamento de Transporte
    D: A su compañía de seguros, a la compañía de seguros del otro conductor y al
      RMV
  answer: B
  explanation: 'Los informes completados deben enviarse a: 1. El departamento de policía
    local donde ocurrió el accidente, 2. Su compañía de seguros, y 3. El RMV.'
- id: 435
  category: vehicle_information
  question: Según los consejos de "Conducción Ecológica" (Green Driving), ¿cómo afecta
    el conducir a más de 60 mph el consumo de combustible de su vehículo?
  choices:
    A: El consumo de combustible aumenta aproximadamente un cinco por ciento por cada
      cinco millas por hora conducidas por encima de 60 mph
    B: El consumo de combustible disminuye en un dos por ciento por cada cinco millas
      por hora conducidas por encima de 60 mph
    C: El consumo de combustible sigue siendo el mismo siempre que use el control
      de crucero
    D: El consumo de combustible aumenta en un diez por ciento por cada milla por
      hora conducida por encima de 60 mph
  answer: A
  explanation: 'El manual establece: "El consumo de combustible aumenta aproximadamente
    un cinco por ciento por cada cinco millas por hora conducidas por encima de 60
    mph".'
- id: 436
  category: vehicle_information
  question: ¿Cuánto pueden aumentar su consumo de combustible los arranques rápidos
    y las paradas bruscas?
  choices:
    A: En un 10 por ciento
    B: En un 25 por ciento
    C: En un 40 por ciento
    D: En un 50 por ciento
  answer: C
  explanation: Los arranques rápidos y las paradas bruscas pueden aumentar el consumo
    de combustible en un 40 por ciento, pero reducen el tiempo de viaje en solo un
    cuatro por ciento.
- id: 437
  category: safe_driving_rules
  question: Según la ley estatal de Massachusetts, ¿cuál es el tiempo máximo que se
    permite que un vehículo esté en ralentí (motor encendido sin movimiento)?
  choices:
    A: Un minuto
    B: Tres minutos
    C: Cinco minutos
    D: Diez minutos
  answer: C
  explanation: La ley estatal de Massachusetts prohíbe el ralentí por más de cinco
    minutos.
- id: 438
  category: vehicle_information
  question: Al realizar varios recados, ¿cómo debería "encadenar" sus viajes para
    obtener una mejor economía de combustible?
  choices:
    A: Vaya primero a su destino más cercano para ahorrar tiempo
    B: Vaya primero a su destino más lejano para calentar el motor más rápidamente
    C: Haga todas sus paradas durante la hora pico para evitar altas velocidades
    D: Deje su automóvil en ralentí en cada parada para mantener el motor caliente
  answer: B
  explanation: El manual sugiere que cuando realice varias paradas, debe ir primero
    a su destino más lejano para calentar el motor más rápidamente y obtener una mejor
    economía de combustible.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de ingresar a
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 439
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 440
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de CONTRAMANO (WRONG WAY) roja y blanca significa que está
    viajando en contra del tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 441
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 442
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 443
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 444
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores que hagan?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 445
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 446
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 447
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 448
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces ferroviarios. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  id: 449
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 450
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 451
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 452
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una carretera dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 453
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    carretera dividida con una mediana o barrera que separa el tráfico en direcciones
    opuestas. Manténgase a la derecha.
  id: 454
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 455
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 456
