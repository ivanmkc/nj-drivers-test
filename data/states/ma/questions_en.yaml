metadata:
  source: Massachusetts Driver's Manual (mass.gov)
  total_questions: 454
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: Under Massachusetts law, how are adult drivers permitted to use mobile
    telephones while operating a motor vehicle?
  choices:
    A: They may hold the phone if making a quick call.
    B: They may only use the device in hands-free mode.
    C: They are strictly prohibited from using mobile phones in any mode.
    D: They may hold the phone only while stopped at a red light.
  answer: B
  explanation: Massachusetts law prohibits operators of motor vehicles from using
    any electronic device, including mobile telephones, unless the device is used
    in hands-free mode. Drivers are not permitted to hold or support the device.
- id: 2
  category: safe_driving_rules
  question: What is the Massachusetts policy regarding electronic device usage for
    teen drivers?
  choices:
    A: They may use devices only in hands-free mode.
    B: They are allowed to use GPS applications if holding the phone.
    C: They are not allowed to use any electronic devices, even in hands-free mode.
    D: They may use electronic devices only when accompanied by an adult.
  answer: C
  explanation: According to the manual, teen drivers are not allowed to use any electronic
    devices, even in hands-free mode.
- id: 3
  category: penalties_and_points
  question: How does the Massachusetts RMV handle out-of-state motor vehicle violations?
  choices:
    A: They are ignored unless they involve a felony.
    B: They result in a warning but do not impact your record.
    C: They impact your record just as if they occurred in Massachusetts.
    D: They only affect your insurance rates, not your driving record.
  answer: C
  explanation: Out-of-state motor vehicle violations impact your record just as if
    they occurred in Massachusetts. The manual explicitly warns drivers not to ignore
    them.
- id: 4
  category: license_system
  question: Beginning on May 7, 2025, what will you need to fly within the United
    States?
  choices:
    A: A standard Massachusetts ID card.
    B: A REAL ID or other acceptable ID such as a valid passport.
    C: A birth certificate and a standard driver's license.
    D: A voter registration card.
  answer: B
  explanation: Beginning May 7, 2025, you will need a REAL ID, or other acceptable
    ID such as a valid passport, to fly within the United States.
- id: 5
  category: license_system
  question: If you do not have a REAL ID after May 7, 2025, which of the following
    is an acceptable alternative to fly within the United States?
  choices:
    A: A valid passport.
    B: A social security card.
    C: A standard driver's license.
    D: A student ID card.
  answer: A
  explanation: The manual states that beginning May 7, 2025, you will need a REAL
    ID, or other acceptable ID such as a valid passport, to fly within the United
    States.
- id: 6
  category: sharing_the_road
  question: Which of the following public ways are designed exclusively for use by
    motor vehicles and trailers traveling at high speeds?
  choices:
    A: Urban streets and country lanes.
    B: Secondary roads and suburban roads.
    C: Interstate highways and expressways.
    D: Public ways with bicycle lanes and sidewalks.
  answer: C
  explanation: Some ways, such as Interstate highways and expressways, are designed
    exclusively for use by motor vehicles and trailers traveling at high speeds.
- id: 7
  category: sharing_the_road
  question: According to the manual, who is meant to share most public ways?
  choices:
    A: Only passenger vehicles and commercial trucks.
    B: Pedestrians, bicycles, motorcycles, passenger vehicles, buses, and commercial
      vehicles.
    C: Only motor vehicles capable of traveling over 40 mph.
    D: Only local residents and public transit vehicles.
  answer: B
  explanation: Most public ways are meant to be shared by 'us,' which includes pedestrians,
    persons riding on bicycles or motorcycles, persons riding in passenger vehicles
    or buses, and persons operating commercial motor vehicles or trailers.
- id: 8
  category: signs_and_signals
  question: Public ways come with various features. What does the acronym 'HOV' stand
    for in the context of highway lanes?
  choices:
    A: Heavy Occupancy Vehicle
    B: High Occupancy Vehicle
    C: Highway Overpass Vehicle
    D: Hazardous Operation Violation
  answer: B
  explanation: The manual lists various features of public ways, including 'High Occupancy
    Vehicle lanes (HOV).'
- id: 9
  category: penalties_and_points
  question: What will happen if you fail to pay or appear in another jurisdiction
    for a motor vehicle violation?
  choices:
    A: The violation is dismissed after 30 days.
    B: The Massachusetts RMV will take action against you when learning of these events.
    C: You will only be penalized if you return to that specific state.
    D: Your vehicle will be immediately impounded in Massachusetts.
  answer: B
  explanation: If you fail to pay or appear in another jurisdiction for a violation,
    the RMV will take action against you when learning of these events.
- id: 10
  category: driver_responsibility
  question: In addition to English, Spanish, Portuguese, Chinese, and Vietnamese,
    in what other language is the Massachusetts Driver's Manual currently available
    online?
  choices:
    A: French
    B: German
    C: Haitian Creole
    D: Italian
  answer: C
  explanation: The manual is currently available online in English, Spanish, Portuguese,
    Chinese, Haitian Creole, and Vietnamese.
- id: 11
  category: license_system
  question: According to the Table of Contents, what does the acronym 'JOL' refer
    to in the Massachusetts licensing system?
  choices:
    A: Junior Operator License
    B: Joint Ownership License
    C: Judicial Order of Licensing
    D: Juvenile Offender Law
  answer: A
  explanation: The Table of Contents lists the 'Junior Operator License Law' and subsequently
    refers to it as 'JOL' in sections like 'Requirements to Obtain a JOL.'
- id: 13
  category: penalties_and_points
  question: What is the consequence for drivers who violate the law by holding or
    supporting an electronic device while driving?
  choices:
    A: They will be required to retake the road test.
    B: Fines and other penalties will be imposed.
    C: Their vehicle will be permanently confiscated.
    D: They will receive a warning for the first three offenses.
  answer: B
  explanation: The manual states that 'Fines and other penalties will be imposed for
    violators of the hands-free law.'
- id: 14
  category: driver_responsibility
  question: How can motorists follow the Massachusetts Registry of Motor Vehicles
    on Twitter for the latest news?
  choices:
    A: '@MassDOT'
    B: '@MassRMV'
    C: '@DriveMass'
    D: '@BostonRMV'
  answer: B
  explanation: The manual advises motorists to 'follow the RMV on Twitter @MassRMV'
    for the latest RMV news.
- id: 15
  category: sharing_the_road
  question: According to the manual's section on sharing the road, why should drivers
    always pay attention to bicycling and walking?
  choices:
    A: Because bicycles are allowed on Interstate highways.
    B: Because pedestrians always have the right-of-way on expressways.
    C: Because bicycling and walking may be used in conjunction with transit.
    D: Because bicycles travel at the same speeds as motor vehicles.
  answer: C
  explanation: The manual states, 'Bicycling and walking may be used in conjunction
    with transit, so always pay attention.'
- id: 16
  category: sharing_the_road
  question: According to the Vulnerable Road Users Law, how should a driver safely
    pass a bicyclist?
  choices:
    A: Honk the horn to alert them before passing closely
    B: Pass at a close distance to avoid oncoming traffic
    C: Leave a safe distance of at least 4 feet when passing
    D: Speed up to pass them as quickly as possible
  answer: C
  explanation: Under the Vulnerable Road Users Law, drivers must leave a safe distance
    of at least 4 feet when passing vulnerable road users such as bicyclists.
- id: 17
  category: penalties_and_points
  question: Which of the following is classified as a Civil Motor Vehicle Infraction
    (CMVI) rather than a criminal violation?
  choices:
    A: Operating Under the Influence (OUI)
    B: Speeding
    C: Leaving the scene of a crash
    D: Vehicular homicide
  answer: B
  explanation: Speeding is considered a Civil Motor Vehicle Infraction (CMVI). OUI,
    leaving the scene of a crash, and vehicular homicide are serious criminal violations.
- id: 18
  category: penalties_and_points
  question: What is the penalty if a driver accumulates three surchargeable events
    within a two-year period?
  choices:
    A: A permanent license revocation
    B: Mandatory installation of an Ignition Interlock Device
    C: Completion of a mandatory Driver Retraining Course
    D: A 30-day jail sentence
  answer: C
  explanation: If you accumulate three or more surchargeable events within a two-year
    period, your license will be suspended unless you complete a mandatory Driver
    Retraining Course.
- id: 19
  category: penalties_and_points
  question: What is the mandatory permit or license suspension period for a Junior
    Operator (16 1/2 to 18 years old) cited for their first speeding offense?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Under the Mandatory Suspensions for Junior Operators, a first speeding
    offense results in a 90-day license suspension.
- id: 20
  category: alcohol_drugs_health
  question: What is the legal Blood Alcohol Content (BAC) limit for drivers who are
    21 years of age or older?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers 21 and older, it is illegal to operate a motor vehicle
    with a Blood Alcohol Content (BAC) of 0.08% or higher.
- id: 21
  category: alcohol_drugs_health
  question: What is the license suspension period for a driver over 21 years old who
    refuses a chemical test for the first time?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: C
  explanation: Under the Implied Consent Law, a driver over 21 who refuses a chemical
    test for the first time faces an automatic 180-day license suspension.
- id: 22
  category: safe_driving_rules
  question: Unless otherwise posted, what is the standard speed limit in a thickly
    settled or business district?
  choices:
    A: 20 mph
    B: 30 mph
    C: 40 mph
    D: 50 mph
  answer: B
  explanation: The fundamental speed law sets the speed limit in a thickly settled
    or business district at 30 mph unless signs indicate otherwise.
- id: 23
  category: signs_and_signals
  question: How must a driver react to a flashing red traffic signal?
  choices:
    A: Slow down and proceed with caution
    B: Stop completely, yield the right-of-way, and proceed when safe
    C: Maintain speed but watch for crossing pedestrians
    D: Stop and wait for the light to turn green
  answer: B
  explanation: A flashing red traffic signal is treated the same as a stop sign. You
    must come to a complete stop, yield to right-of-way traffic, and proceed when
    it is safe.
- id: 24
  category: signs_and_signals
  question: What do solid yellow lane lines on a roadway indicate?
  choices:
    A: Traffic is moving in the same direction and passing is allowed
    B: Traffic is moving in opposite directions and passing is prohibited
    C: The lane is ending and you must merge right
    D: You are approaching a railroad crossing
  answer: B
  explanation: Solid yellow lines separate traffic moving in opposite directions and
    indicate that passing is not allowed.
- id: 25
  category: safe_driving_rules
  question: When two vehicles arrive at an intersection with four-way stop signs at
    the same time, who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle that is turning left
    D: The larger vehicle
  answer: B
  explanation: At a four-way stop, if two vehicles arrive at the same time, the vehicle
    on the right has the right-of-way.
- id: 26
  category: safe_driving_rules
  question: Under the Rules for Passing, when is it legally permissible to pass another
    vehicle on the right?
  choices:
    A: When the vehicle ahead is driving below the speed limit
    B: When the vehicle ahead is making a left turn and there is sufficient paved
      space on the right
    C: When you are in a hurry and the left lane is blocked
    D: Passing on the right is never legally permissible
  answer: B
  explanation: You may pass on the right only when the vehicle ahead is making a left
    turn and you can do so safely without driving off the paved roadway.
- id: 27
  category: safe_driving_rules
  question: According to parking regulations, what is the minimum distance you must
    maintain when parking near a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Parking regulations prohibit parking within 10 feet of a fire hydrant
    to ensure emergency vehicles have adequate access.
- id: 28
  category: defensive_driving
  question: When driving in winter conditions, what is the recommended technique for
    stopping safely on an icy road?
  choices:
    A: Slam on the brakes at the last moment
    B: Pump the brakes rapidly and steer sharply
    C: Begin slowing down well in advance and apply the brakes gently
    D: Shift into neutral and let the vehicle coast to a stop
  answer: C
  explanation: During winter driving, roads can be slick. It is safest to begin slowing
    down well in advance and apply the brakes gently to avoid skidding.
- id: 29
  category: penalties_and_points
  question: Which drivers are required to have an Ignition Interlock Device (IID)
    installed in their vehicle?
  choices:
    A: Drivers with a single speeding ticket
    B: Drivers seeking license reinstatement after two or more OUI offenses
    C: All Junior Operators during their first six months of driving
    D: Drivers who have been involved in an at-fault crash
  answer: B
  explanation: An Ignition Interlock Device (IID) is mandatory for drivers who have
    two or more Operating Under the Influence (OUI) offenses and are seeking a hardship
    license or full reinstatement.
- id: 30
  category: signs_and_signals
  question: What is the purpose of a channelizing island in a roadway?
  choices:
    A: To provide a designated parking area for disabled vehicles
    B: To direct traffic flow and separate vehicles moving in the same or opposite
      directions
    C: To indicate the presence of a school zone
    D: To mark the beginning of a highway exit ramp
  answer: B
  explanation: Channelizing islands are used to direct traffic flow, separate opposing
    lanes of traffic, or guide vehicles into proper lanes at intersections.
- id: 31
  category: safe_driving_rules
  question: Under the Hands-Free Law, when is it permissible to use a handheld mobile
    electronic device?
  choices:
    A: When stopped at a red light.
    B: When stopped at a stop sign.
    C: When the vehicle is stationary and not in a public travel lane.
    D: When pulled over on the side of a busy highway.
  answer: C
  explanation: According to the Hands-Free Law, handheld device use is only allowed
    if the vehicle is stationary and is not located in a public travel lane. It is
    not allowed at red lights or stop signs.
- id: 32
  category: driver_responsibility
  question: According to the manual, what is the ONLY true way to protect yourself
    from drowsy driving?
  choices:
    A: Drinking caffeinated beverages.
    B: Getting enough sleep and not driving when tired.
    C: Rolling down the windows for fresh air.
    D: Turning up the volume on the radio.
  answer: B
  explanation: The manual states that the ONLY true way to protect yourself from drowsy
    driving is to get enough sleep and to not drive when you feel tired.
- id: 33
  category: driver_responsibility
  question: To help prevent drowsy driving, the manual recommends avoiding driving
    between which hours if possible?
  choices:
    A: 10 p.m. and 4 a.m.
    B: Midnight and 6 a.m.
    C: 2 a.m. and 8 a.m.
    D: 8 p.m. and midnight.
  answer: B
  explanation: When possible, avoid driving between midnight and 6 a.m. If you must
    drive at that time, be alert for signs of drowsiness.
- id: 34
  category: sharing_the_road
  question: When passing a vulnerable road user such as a bicyclist or pedestrian,
    what is the minimum safe passing distance you must leave?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: The Vulnerable Road User Law requires that when you pass a vulnerable
    road user, you must leave a safe passing distance of at least 4 feet between your
    vehicle and the road user.
- id: 35
  category: sharing_the_road
  question: When passing a vulnerable road user, what action is legally permitted
    if it is safe to do so?
  choices:
    A: Honking continuously until you pass.
    B: Speeding up to pass them quickly.
    C: Crossing the center line to use part of the next lane.
    D: Passing them on the right shoulder.
  answer: C
  explanation: If it is safe, you may use all or part of the lane next to you and
    you may cross the center line if necessary when passing a vulnerable road user.
- id: 36
  category: safe_driving_rules
  question: How does an increase in speed affect a driver's vision?
  choices:
    A: It improves peripheral vision.
    B: It reduces the driver's 'cone of vision'.
    C: It eliminates blind spots.
    D: It has no effect on a driver's vision.
  answer: B
  explanation: An increase in speed reduces a driver's 'cone of vision' and increases
    the risks of crashes and serious injuries.
- id: 37
  category: defensive_driving
  question: What is a common cause of a 'courtesy crash'?
  choices:
    A: Yielding the right-of-way at a four-way stop.
    B: Waving people in through stopped traffic.
    C: Using turn signals too early.
    D: Leaving too much following distance.
  answer: B
  explanation: Waving people in through stopped traffic, or driving through traffic
    when someone waves you in, creates a dangerous situation and can easily result
    in a 'courtesy crash'.
- id: 38
  category: driver_responsibility
  question: Under the Driver Removal Law, what must you do after a crash that involves
    only property damage?
  choices:
    A: Leave the vehicles exactly where they are until police arrive.
    B: Move the vehicles out of travel lanes to a safe location.
    C: Wait for a tow truck before moving the vehicles.
    D: Exchange information while standing in the travel lane.
  answer: B
  explanation: After a crash involving property damage only, the Driver Removal Law
    requires that vehicles be moved out of travel lanes to a safe location so they
    do not cause additional accidents.
- id: 39
  category: license_system
  question: Which class of Massachusetts driver's license is the most common and is
    used for passenger vehicles, vans, and small trucks?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: D
  explanation: The Class D license, which is most common, is for passenger vehicles,
    vans, and small trucks.
- id: 40
  category: license_system
  question: Which class of license allows you to operate a motorcycle in Massachusetts?
  choices:
    A: Class A
    B: Class C
    C: Class D
    D: Class M
  answer: D
  explanation: The Class M license allows you to operate motorcycles.
- id: 41
  category: license_system
  question: Which license classes are known as commercial driver's licenses (CDLs)
    and allow you to operate large vehicles like trucks and buses?
  choices:
    A: Classes A, B, and C
    B: Classes B, C, and D
    C: Classes C, D, and M
    D: Classes A, D, and M
  answer: A
  explanation: Class A, B, and C licenses, which are known as commercial driver's
    licenses (CDLs), allow you to operate large vehicles, like trucks and buses.
- id: 42
  category: license_system
  question: What is the minimum age for a U.S. resident living outside of Massachusetts
    to drive in the state using a valid out-of-state driver's license?
  choices:
    A: 15 years of age
    B: 16 years of age
    C: 17 years of age
    D: 18 years of age
  answer: B
  explanation: A U.S. resident, who is at least 16 years of age and lives outside
    of Massachusetts, may drive in Massachusetts using a valid out-of-state driver's
    license.
- id: 43
  category: license_system
  question: Due to the Work and Family Mobility Act, what is no longer required to
    obtain a Standard Driver’s License (Class D or M) in Massachusetts?
  choices:
    A: Proof of lawful presence
    B: A passing score on the road test
    C: Proof of residency in Massachusetts
    D: Payment of license fees
  answer: A
  explanation: Beginning July 1, 2023, the Massachusetts RMV will not require customers
    to provide proof of lawful presence to obtain a Standard Driver’s License (Class
    D or M), due to the Work and Family Mobility Act.
- id: 44
  category: safe_driving_rules
  question: If you need to use a mobile electronic device, what does the Hands-Free
    Law explicitly forbid you from doing?
  choices:
    A: Using voice commands to make a call.
    B: Stopping on the side of a busy road or highway to use the device.
    C: Using the device while parked in a designated parking lot.
    D: Using a GPS navigation system mounted to the dashboard.
  answer: B
  explanation: 'The manual explicitly states: ''Do NOT stop on the side of a busy
    road or highway to use a mobile electronic device.'''
- id: 45
  category: defensive_driving
  question: Which of the following is mentioned in the manual as a sign of drowsiness
    while driving?
  choices:
    A: Driving above the speed limit.
    B: Crossing lines or hitting rumble strips.
    C: Checking the rearview mirror frequently.
    D: Gripping the steering wheel tightly.
  answer: B
  explanation: The manual advises drivers to be alert for signs of drowsiness, such
    as crossing lines or hitting rumble strips.
- id: 46
  category: penalties_and_points
  question: What is the penalty for a first offense of driving without your valid
    out-of-state or out-of-country driver's license in your possession in Massachusetts?
  choices:
    A: A $100 fine
    B: A $250 fine
    C: A $500 fine
    D: A $1,000 fine
  answer: C
  explanation: According to the manual, a violation of Section 10 (not having your
    valid out-of-state or out-of-country driver's license in your possession) is a
    criminal violation and a first offense is subject to a fine of $500.
- id: 47
  category: license_system
  question: If you move to Massachusetts and become a resident, how long is the grace
    period to obtain a Massachusetts driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: There is no grace period
  answer: D
  explanation: 'The manual states: "If you become a resident of Massachusetts, you
    must obtain a Massachusetts driver''s license to retain your driving privileges.
    There is no grace period."'
- id: 48
  category: license_system
  question: If your Massachusetts driver's license expires during active military
    service, how long may you use it to operate a motor vehicle after your honorable
    discharge?
  choices:
    A: Up to 30 days
    B: Up to 45 days
    C: Up to 60 days
    D: Up to 90 days
  answer: C
  explanation: If you have a Massachusetts driver's license that expired during your
    active service, you may use that license to operate a motor vehicle for up to
    60 days after your honorable discharge from military service.
- id: 49
  category: safe_driving_rules
  question: If you are 15 years old and hold a valid driver's license from another
    state that allows you to drive, are you permitted to drive in Massachusetts?
  choices:
    A: Yes, as long as you have your out-of-state license in your possession.
    B: Yes, but only if accompanied by a parent or guardian.
    C: No, no person under the age of 16 may drive in Massachusetts.
    D: No, unless you obtain a Massachusetts learner's permit.
  answer: C
  explanation: 'The manual explicitly states: "No person under the age of 16 may drive
    in Massachusetts. This is true even if you have a driver''s license (or learner''s
    permit) issued in a state or U.S. territory or another country that allows operation
    of a motor vehicle by a person less than 16 years of age."'
- id: 50
  category: license_system
  question: What is the minimum age requirement to receive a Class D or Class M driver's
    license in Massachusetts?
  choices:
    A: 16 years old
    B: 16 1/2 years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: You can obtain a learner's permit at age 16, but you may not receive
    a Class D or a Class M driver's license until you are at least 16 1/2 and have
    met all other requirements.
- id: 51
  category: license_system
  question: How old must you be to apply for a Commercial Driver's License (Class
    A, B, or C) in Massachusetts?
  choices:
    A: 16 years old
    B: 18 years old
    C: 21 years old
    D: 25 years old
  answer: B
  explanation: 'A note in the manual specifies: "You must be at least 18 years old
    to apply for a Commercial Driver''s License (Class A, B, or C)."'
- id: 52
  category: penalties_and_points
  question: What is a potential consequence of forging a parent or guardian's signature
    on a learner's permit or license application?
  choices:
    A: A $500 fine
    B: License suspension or revocation
    C: Mandatory community service
    D: A written warning
  answer: B
  explanation: The manual states that for minors applying for permits or licenses,
    "Forging a signature may result in license suspension or revocation."
- id: 53
  category: license_system
  question: According to the RMV's facial image policy, are applicants allowed to
    wear eyeglasses for their driver's license photo?
  choices:
    A: Yes, if they are prescription glasses.
    B: Yes, as long as there is no glare on the lenses.
    C: No, eyeglasses are not allowed, even if the applicant normally wears them.
    D: No, unless they are reading glasses.
  answer: C
  explanation: 'The facial image policy clearly states: "Eyeglasses, including reading
    or prescription glasses, are not allowed, even if the applicant normally wears
    them."'
- id: 54
  category: license_system
  question: Which of the following is acceptable under the RMV's facial image policy
    for a driver's license photo?
  choices:
    A: Temporary facial tattoos
    B: Permanent facial tattoos
    C: Bluetooth headsets
    D: Surgical masks
  answer: B
  explanation: The manual notes that "Permanent facial tattoos are acceptable but
    temporary tattoos are not. Bluetooth headsets are not acceptable." It also states
    that surgical masks are not acceptable.
- id: 55
  category: driver_testing
  question: To be eligible for a full Class D or M license, what is the minimum visual
    acuity required in your better eye (corrected)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: To be eligible for a Class D or M license, your vision must be at least
    20/40 visual acuity in your better eye (corrected) for a full license.
- id: 56
  category: driver_testing
  question: Under what condition might you be eligible for a "daylight only" driver's
    license?
  choices:
    A: If your corrected vision is between 20/50 and 20/70 in the better eye.
    B: If your horizontal peripheral vision is less than 90 degrees.
    C: If you fail the color vision screening.
    D: If you are under 18 years old.
  answer: A
  explanation: 'The manual states: "If your corrected vision is between 20/50 and
    20/70 in the better eye, you may be eligible for a daylight only license."'
- id: 57
  category: driver_testing
  question: How many degrees of horizontal peripheral vision (both eyes together)
    are required to be eligible for a full Class D or M license?
  choices:
    A: 90 degrees
    B: 100 degrees
    C: 120 degrees
    D: 140 degrees
  answer: C
  explanation: You must have at least 120 degrees of horizontal peripheral vision
    (both eyes together) for a full license.
- id: 58
  category: license_system
  question: When you apply for a license, the RMV checks your information with the
    Problem Driver Pointer System (PDPS). What does this system do?
  choices:
    A: It checks your credit score for unpaid parking tickets.
    B: It stores information about license suspensions and revocations for drivers
      in all 50 states.
    C: It verifies your legal residency status in Massachusetts.
    D: It tracks your vehicle registration and insurance history.
  answer: B
  explanation: The Problem Driver Pointer System (PDPS) stores information about license
    suspensions and revocations for drivers in all 50 states.
- id: 59
  category: license_system
  question: What happens if you apply for a Massachusetts driver's license while holding
    a valid license from another state participating in the State-to-State program?
  choices:
    A: You will be allowed to keep both licenses.
    B: You must surrender your Massachusetts license when traveling out of state.
    C: The other participating state will cancel your driver's license issued by them.
    D: You will be charged double the standard licensing fee.
  answer: C
  explanation: Massachusetts is part of the State-to-State program, which will cancel
    any driver’s license or state issued ID card issued by the other participating
    state when a Massachusetts license or ID Card is issued.
- id: 60
  category: license_system
  question: What is the difference in cost between a REAL ID Massachusetts Driver's
    License and a Standard Massachusetts Driver's License?
  choices:
    A: The REAL ID costs $25 more.
    B: The Standard license costs $10 more.
    C: The REAL ID costs twice as much.
    D: The cost is the same for both card types.
  answer: D
  explanation: 'The manual explicitly states regarding REAL ID and Standard Massachusetts
    Cards: "The cost is the same for both card types."'
- id: 61
  category: license_system
  question: Under the Work and Family Mobility Act (WFMA), which of the following
    credentials still requires proof of lawful presence to obtain?
  choices:
    A: A Standard Class D Driver's License
    B: A Standard Class M Driver's License
    C: A Commercial Driver's License (CDL)
    D: A 5-year Standard Driver's License
  answer: C
  explanation: The WFMA does not affect Commercial Driver's Licenses (CDLs), REAL
    IDs, Standard ID Cards, or Liquor IDs. Lawful presence is still required for all
    of these.
- id: 62
  category: license_system
  question: Which license class is typically required to operate standard passenger
    vehicles such as cars, SUVs, or family vans?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: D
  explanation: A Class D license is for any single vehicle or combination of vehicles
    that does not meet the definition of Class A, B, C, or M, which typically includes
    passenger vehicles such as cars, SUVs, or family vans.
- id: 63
  category: license_system
  question: A Class C driver's license is required for a vehicle that does not meet
    the definition of Class A or B, but is designed to transport how many passengers
    (including the driver)?
  choices:
    A: 8 or more
    B: 10 or more
    C: 16 or more
    D: 20 or more
  answer: C
  explanation: A Class C license is required for a vehicle designed to transport 16
    or more passengers including the driver, or one that is required to be placarded
    for hazardous materials.
- id: 64
  category: license_system
  question: What is the maximum length of time a Standard Massachusetts driver's license
    is valid for?
  choices:
    A: 3 years
    B: 4 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: A Massachusetts driver's license is valid for a maximum of five years
    and typically expires on your birthday. A Standard License will always be valid
    for five years.
- id: 65
  category: license_system
  question: If you renew your license before your 21st birthday and receive a vertical
    license with 'Under 21' printed on it, what happens to the card when you turn
    21?
  choices:
    A: The license becomes immediately invalid and must be replaced.
    B: It remains valid until its expiration date.
    C: You must obtain a horizontal license within 30 days.
    D: You are restricted to driving only during daylight hours.
  answer: B
  explanation: If you renew your license or ID card before your 21st birthday, you
    will receive a vertical license or ID card. This license or ID card will remain
    valid to expiration, even after you turn 21.
- id: 66
  category: safe_driving_rules
  question: If you pass the driver's license vision test by wearing glasses or contact
    lenses, your license will be issued with which restriction code?
  choices:
    A: Code A
    B: Code B
    C: Code C
    D: Code I
  answer: B
  explanation: If you pass the driver's license vision test by wearing glasses or
    contact lenses, your driver's license will be issued with a 'Corrective Lenses'
    restriction, which is code letter B.
- id: 67
  category: driver_responsibility
  question: What must you do if you develop a medical condition that affects your
    ability to drive?
  choices:
    A: Wait until your license expires to notify the RMV.
    B: Stop driving immediately and surrender your license to the police.
    C: Report the condition to the RMV's Medical Affairs.
    D: Only drive with a licensed passenger over the age of 21.
  answer: C
  explanation: The manual states that if you develop a medical condition that affects
    your ability to drive, you must report the condition to the RMV by calling Medical
    Affairs.
- id: 68
  category: license_system
  question: In Massachusetts, any motor vehicle operator or motorcyclist is considered
    a Junior Operator if they are between what ages?
  choices:
    A: 15 and 17
    B: 16 and 18
    C: 16 1/2 and 18
    D: 17 and 21
  answer: C
  explanation: Any motor vehicle operator or motorcyclist between the ages of 16 1/2
    and 18 is considered a Junior Operator.
- id: 69
  category: driver_testing
  question: How long must an applicant for a Junior Operator's License (JOL) have
    a valid learner's permit before taking the road test?
  choices:
    A: At least 3 consecutive months
    B: At least 6 consecutive months
    C: At least 9 consecutive months
    D: At least 12 consecutive months
  answer: B
  explanation: An applicant for a JOL must have a valid learner's permit for at least
    six consecutive months before taking the road test.
- id: 70
  category: penalties_and_points
  question: What happens to the six-month learner's permit requirement for a Junior
    Operator if their permit is suspended?
  choices:
    A: The suspension time counts toward the six months.
    B: The six-month period is reduced to three months.
    C: The permit is invalidated and the six months will start anew when the suspension
      is lifted.
    D: The applicant must wait until they are 18 to take the road test.
  answer: C
  explanation: Any suspension will invalidate the permit and the six months will start
    to run anew when the suspension is lifted.
- id: 71
  category: driver_testing
  question: An RMV-approved driver education and training program for a Junior Operator
    includes how many hours of classroom instruction?
  choices:
    A: 12 hours
    B: 20 hours
    C: 30 hours
    D: 40 hours
  answer: C
  explanation: A Junior Operator applicant must successfully complete an RMV-approved
    driver education and training program, which includes 30 hours of classroom instruction.
- id: 72
  category: driver_testing
  question: In addition to driver education, how many hours of supervised, behind-the-wheel
    driving must a Junior Operator applicant complete (as shown by a certified statement
    from a parent or guardian)?
  choices:
    A: 12 hours
    B: 20 hours
    C: 30 hours
    D: 40 hours
  answer: D
  explanation: Applicants must complete at least an additional 40 hours of supervised,
    behind-the-wheel driving as shown by a certified statement provided by a parent
    or guardian.
- id: 73
  category: license_system
  question: How many driver's licenses or ID cards are you allowed to hold at one
    time in Massachusetts?
  choices:
    A: Only one
    B: Two, as long as one is a REAL ID and one is a Standard ID
    C: Two, provided they are from different states
    D: Up to three, including a Liquor ID
  answer: A
  explanation: 'The manual explicitly states: ''You may hold only one driver’s license
    or ID Card at a time.'''
- id: 74
  category: driver_testing
  question: How many hours of supervised, behind-the-wheel driving must a student
    complete with a parent or guardian if they do NOT take a driver skills development
    program?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: B
  explanation: The manual states you must complete at least an additional 40 hours
    of supervised, behind-the-wheel driving as shown by a certified statement provided
    by a parent or guardian.
- id: 75
  category: license_system
  question: 'During the first six months of holding a Junior Operator License (JOL),
    you may not drive with passengers under age 18 unless accompanied by a licensed
    driver who is at least:'
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: You may not operate a motor vehicle with passengers under 18 unless
    accompanied by a person who is at least 21 years old, has at least one year of
    driving experience, holds a valid license, and is sitting beside you.
- id: 76
  category: safe_driving_rules
  question: 'A Junior Operator may not operate a motor vehicle without a parent or
    legal guardian between the hours of:'
  choices:
    A: 11:00 p.m. and 5:00 a.m.
    B: 12:00 a.m. and 6:00 a.m.
    C: 12:30 a.m. and 5:00 a.m.
    D: 1:00 a.m. and 4:00 a.m.
  answer: C
  explanation: As the holder of a JOL, you may not operate a motor vehicle between
    12:30 a.m. and 5:00 a.m. unless you are accompanied by one of your parents or
    your legal guardian.
- id: 77
  category: penalties_and_points
  question: 'Between 12:30 a.m. and 1:00 a.m., the Junior Operator night restriction
    is enforced as a ''secondary enforcement,'' meaning:'
  choices:
    A: You will only receive a warning for your first offense.
    B: Law enforcement can only cite you if you are lawfully stopped for another violation.
    C: The penalty is reduced to a secondary fine.
    D: Only state troopers can enforce the restriction.
  answer: B
  explanation: Secondary enforcement means the provisions of the law shall be enforced
    by law enforcement agencies only when a Junior Operator has been lawfully stopped
    for a violation of the motor vehicle laws or some other offense.
- id: 78
  category: penalties_and_points
  question: What is the license suspension period for a Junior Operator's first offense
    of violating the passenger or night restriction?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: If you violate the passenger restriction or the night restriction,
    you will be subject to a license suspension of 60 days for a first offense.
- id: 79
  category: penalties_and_points
  question: 'If a Junior Operator commits a first speeding offense, their license
    will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: For a first speeding offense, you will be suspended for 90 days; for
    a subsequent offense, you will be suspended for one year.
- id: 80
  category: safe_driving_rules
  question: Under what condition may a driver under age 18 use a mobile electronic
    device while operating a motor vehicle?
  choices:
    A: When using a hands-free accessory
    B: When stopped at a red light
    C: Only for reporting an emergency
    D: When using a GPS navigation app
  answer: C
  explanation: Drivers under 18 may not use any mobile electronic device for any reason
    while operating a motor vehicle. The only exception is for reporting an emergency.
- id: 81
  category: license_system
  question: To obtain a REAL ID Driver's License, how many documents must you present
    that prove your Massachusetts residency?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: To apply for a REAL ID Driver's License, you must present 2 documents
    that prove your Massachusetts residency.
- id: 82
  category: license_system
  question: When presenting identification documents to the RMV, which of the following
    is acceptable?
  choices:
    A: A high-quality photocopy
    B: A notarized photocopy
    C: A laminated original document
    D: An unlaminated original document
  answer: D
  explanation: The manual states that all documents must be originals unless otherwise
    indicated. Photocopies will not be accepted, and laminated documents are not acceptable.
- id: 83
  category: license_system
  question: 'If you have been denied a Social Security Number, your written Denial
    Notice from the SSA must not be older than:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: If you have applied for an SSN with the SSA and been denied, you must
    present the written Denial Notice (not more than 60 days old) the SSA provided
    you.
- id: 84
  category: license_system
  question: If your application for a license is denied by the RMV, within how many
    days must you file an appeal?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: If your application is denied, you may file an appeal within ten days
    after you received a written denial from the RMV.
- id: 85
  category: license_system
  question: What is the fee required to file a formal appeal with the Board of Appeals
    on Liability Policies and Bonds?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: B
  explanation: A formal appeal may be filed only with the Board of Appeals on Liability
    Policies and Bonds at the address below with a check or money order for $50.
- id: 86
  category: penalties_and_points
  question: What is the penalty for a Junior Operator's first drag racing offense?
  choices:
    A: 90-day suspension
    B: 180-day suspension
    C: One-year suspension
    D: Three-year suspension
  answer: C
  explanation: You will face additional suspension periods of one year for a first
    drag racing offense and three years for a subsequent offense.
- id: 87
  category: driver_testing
  question: How many hours of instruction on the driver's education curriculum must
    a parent or guardian participate in (unless completed within the past 5 years)?
  choices:
    A: 2 hours
    B: 4 hours
    C: 6 hours
    D: 12 hours
  answer: A
  explanation: A parent or guardian must participate in two hours of instruction on
    the driver’s education curriculum (unless they have participated within the past
    five years).
- id: 88
  category: license_system
  question: What happens to the six-month passenger restriction period if a Junior
    Operator's license is suspended?
  choices:
    A: The restriction period is completely restarted.
    B: The restriction period stops running temporarily during the suspension.
    C: The restriction is permanently lifted.
    D: The restriction period continues to run during the suspension.
  answer: B
  explanation: The six-month passenger restriction period will stop running, temporarily,
    during any suspension. When your JOL is reinstated, you will still have to complete
    the remainder of the six-month restriction period.
- id: 89
  category: license_system
  question: How long is a Massachusetts learner's permit valid for?
  choices:
    A: Up to one year
    B: Up to two years
    C: Up to four years
    D: Up to five years
  answer: B
  explanation: The manual states that a learner's permit is valid up to two years
    while you practice your driving skills.
- id: 90
  category: driver_testing
  question: What is the fee required to take the learner's permit exam?
  choices:
    A: $20
    B: $25
    C: $30
    D: $50
  answer: C
  explanation: To earn your learner's permit, you must pay a $30 learner's permit
    exam fee, which covers the cost of your exam.
- id: 91
  category: driver_testing
  question: How many questions must you answer correctly to pass the learner's permit
    exam?
  choices:
    A: 15 out of 25
    B: 18 out of 25
    C: 20 out of 25
    D: 25 out of 25
  answer: B
  explanation: To pass the exam, you must answer 18 questions correctly out of the
    25 multiple-choice questions.
- id: 92
  category: driver_testing
  question: What is the allotted time limit to complete the Class D or M learner's
    permit exam?
  choices:
    A: 15 minutes
    B: 20 minutes
    C: 25 minutes
    D: 30 minutes
  answer: C
  explanation: You must answer 18 questions correctly within the allotted time of
    25 minutes.
- id: 93
  category: penalties_and_points
  question: What is the penalty if you are found responsible for cheating on the learner's
    permit exam?
  choices:
    A: You will not be allowed to hold any type of driver's license or permit for
      30 days.
    B: You will not be allowed to hold any type of driver's license or permit for
      60 days.
    C: You must pay a $100 fine and retake the exam.
    D: You will be permanently banned from obtaining a driver's license.
  answer: B
  explanation: If you are found responsible for cheating, you will not be allowed
    to hold any type of driver's license or permit for 60 days.
- id: 94
  category: safe_driving_rules
  question: When driving with a Class D learner's permit, you must be accompanied
    by a licensed operator who meets which of the following requirements?
  choices:
    A: At least 18 years old with 6 months of driving experience
    B: At least 21 years old with at least one year of driving experience
    C: At least 25 years old with a clean driving record
    D: Any licensed driver regardless of age or experience
  answer: B
  explanation: You must be accompanied by a licensed operator who occupies the passenger
    seat next to you, is at least 21 years old, holds a valid license, and has at
    least one year of driving experience.
- id: 95
  category: safe_driving_rules
  question: 'If you are under 18 and hold a Class D learner''s permit, you may not
    drive between 12:00 a.m. and 5:00 a.m. unless accompanied by:'
  choices:
    A: A licensed driver who is at least 21 years old.
    B: A sibling who is at least 18 years old.
    C: A parent or legal guardian who is a validly licensed operator with at least
      one year of driving experience.
    D: A certified driving instructor.
  answer: C
  explanation: If you are under 18, you may not drive between 12:00 a.m. and 5:00
    a.m. unless accompanied by a parent or legal guardian who is a validly licensed
    operator with at least one year of driving experience.
- id: 96
  category: safe_driving_rules
  question: Which of the following is a limitation of operating a motorcycle with
    a Class M learner's permit?
  choices:
    A: You may only carry one passenger.
    B: You can drive only during daylight hours (between sunrise and sunset).
    C: You are not required to wear a helmet if you are over 21.
    D: You may drive at any time of day or night.
  answer: B
  explanation: A Class M learner's permit allows you to operate a motorcycle with
    limitations, including that you can drive only during daylight hours (between
    sunrise and sunset).
- id: 97
  category: license_system
  question: Can a Massachusetts learner's permit be used as an identification document
    for travel on most airlines and cruise ships?
  choices:
    A: Yes, it is a fully accepted state-issued photo ID for all travel.
    B: Yes, but only for domestic flights within the United States.
    C: No, it is a document that grants conditional driving privileges and is not
      intended for travel identification.
    D: No, unless it is accompanied by a birth certificate.
  answer: C
  explanation: The manual states that a learner's permit is not intended to be used
    as an identification document for travel and will not be accepted by most airlines
    or cruise ships.
- id: 98
  category: driver_testing
  question: Who is eligible to choose to take an audio version of the learner's permit
    exam?
  choices:
    A: Only individuals with a documented medical condition.
    B: Only individuals who do not speak English as their primary language.
    C: Anyone can choose to take an audio exam without additional documentation.
    D: Only individuals who schedule the exam at least two weeks in advance.
  answer: C
  explanation: According to the manual, anyone can choose to take an audio exam. The
    exam does not need to be scheduled in advance and you do not need to present any
    additional documentation to be eligible.
- id: 99
  category: license_system
  question: If you are under 18 years old, what additional requirement must be met
    when submitting a learner's permit application?
  choices:
    A: You must have a parent or guardian sign your application.
    B: You must provide a letter of recommendation from your high school.
    C: You must prepay your road test fees.
    D: You must have completed a driver's education course before applying.
  answer: A
  explanation: The manual specifies that if you are under 18, you must have your parent
    or guardian sign your application.
- id: 100
  category: driver_testing
  question: In what language(s) are Class A, B, and C (CDL) learner's permit exams
    available?
  choices:
    A: English and Spanish only
    B: English only
    C: Over 30 different languages
    D: Any language requested in advance
  answer: B
  explanation: The manual states that Class A, B, and C learner's permit exams are
    only available in English (per federal regulation).
- id: 101
  category: license_system
  question: What must you do if your learner's permit expires before you pass the
    road test?
  choices:
    A: Pay a $15 renewal fee to extend it for one year.
    B: Re-take the learner's permit exam and pay the required fees.
    C: Request an extension online without taking any exams.
    D: Take the road test immediately before applying for a new permit.
  answer: B
  explanation: 'The manual explicitly states: ''If your learner''s permit expires,
    you must re-take the learner''s permit exam and pay the required fees.'''
- id: 102
  category: safe_driving_rules
  question: If you are under 18 years old, between what hours are you prohibited from
    driving unless accompanied by a parent or legal guardian?
  choices:
    A: 10:00 p.m. and 4:00 a.m.
    B: 11:00 p.m. and 5:00 a.m.
    C: 12:00 a.m. and 5:00 a.m.
    D: 1:00 a.m. and 6:00 a.m.
  answer: C
  explanation: According to the manual, drivers under 18 may not drive between 12:00
    a.m. and 5:00 a.m. unless accompanied by a parent or legal guardian who is validly
    licensed with at least one year of driving experience.
- id: 103
  category: license_system
  question: When driving a motorcycle with a Class M learner's permit, when are you
    NOT required to wear eyeglasses, goggles, or a protective face shield?
  choices:
    A: When driving at speeds under 30 mph.
    B: When you are wearing a US DOT standard helmet.
    C: When the motorcycle has a windshield or screen.
    D: When driving during daylight hours.
  answer: C
  explanation: You must wear eyeglasses, goggles, or a protective face shield unless
    the motorcycle you are driving has a windshield or screen.
- id: 104
  category: driver_testing
  question: How many hours of supervised driving must a driver under 18 complete before
    applying for a Class D license (assuming they have not completed a driver skills
    development program)?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 50 hours
  answer: C
  explanation: You must complete 40 hours of supervised driving, which is reduced
    to 30 hours if you completed a driver skills development program.
- id: 105
  category: driver_testing
  question: What is the maximum number of Class D road tests you are allowed to attempt
    in a 12-month period?
  choices:
    A: Three
    B: Four
    C: Five
    D: Six
  answer: D
  explanation: For a Class D license, you are not allowed to attempt more than six
    road tests in a 12-month period.
- id: 106
  category: driver_testing
  question: What must you do if you fail two Class M road tests?
  choices:
    A: Wait 6 months before scheduling another test.
    B: Enroll in and successfully complete a beginner rider course.
    C: Pay a double fee for the third test.
    D: Surrender your Class M learner's permit.
  answer: B
  explanation: For a Class M license, if you fail two road tests, you must enroll
    in and successfully complete a beginner rider course before you can schedule another
    test.
- id: 107
  category: driver_testing
  question: How much notice must you give to cancel or reschedule a road test without
    paying an additional fee?
  choices:
    A: More than 24 hours
    B: More than 48 hours
    C: More than 72 hours
    D: More than 1 week
  answer: C
  explanation: There is no additional fee if you cancel or reschedule with more than
    72 hours notice.
- id: 108
  category: driver_testing
  question: If you fail a road test or do not appear for your scheduled test, how
    long must you wait before taking another test?
  choices:
    A: At least 7 days
    B: At least 14 days
    C: At least 21 days
    D: At least 30 days
  answer: B
  explanation: If you fail a road test or do not appear for your scheduled test, you
    must wait at least 14 days before taking another test.
- id: 109
  category: license_system
  question: What is one benefit of successfully completing the Massachusetts Rider
    Education Program (MREP)?
  choices:
    A: You do not need to take an RMV Class M road test.
    B: You are exempt from wearing a helmet for the first year.
    C: You can carry passengers on a learner's permit.
    D: You receive a discount on your vehicle registration.
  answer: A
  explanation: If you successfully complete an MREP course, you do not need to take
    an RMV Class M road test.
- id: 110
  category: driver_testing
  question: Which of the following animals is allowed in the vehicle during a road
    test?
  choices:
    A: An emotional support animal
    B: A trained service animal
    C: A small pet in a carrier
    D: No animals are allowed under any circumstances
  answer: B
  explanation: Road Test Examiners may reject road tests if animals are present, but
    trained service animals are allowed in the vehicle. Emotional support animals
    are not.
- id: 111
  category: driver_testing
  question: Which of the following road tests does NOT require you to bring a qualified
    sponsor?
  choices:
    A: A Class D road test
    B: A Class M road test
    C: A commercial driver's license road test
    D: A license conversion road test
  answer: B
  explanation: According to the manual's section on being prepared for the road test,
    a sponsor is not required for a Class M road test.
- id: 112
  category: driver_responsibility
  question: If you are under age 18, how long must you maintain a clean driving record
    immediately preceding the date you apply for a road test?
  choices:
    A: 3 consecutive months
    B: 6 consecutive months
    C: 9 consecutive months
    D: 12 consecutive months
  answer: B
  explanation: If you are under age 18, you must maintain a clean driving record for
    the six consecutive months immediately preceding the date you apply for the test.
- id: 113
  category: driver_testing
  question: What happens if you are late for your scheduled road test appointment?
  choices:
    A: You will be tested but penalized 10 points.
    B: You will be tested if you arrive within 15 minutes.
    C: You will not be tested and you will be required to pay the road test fee.
    D: You will not be tested but your fee will be refunded.
  answer: C
  explanation: Road tests are scheduled close together; you must be on time. If you
    are late for your appointment, you will not be tested and you will be required
    to pay the road test fee.
- id: 114
  category: alcohol_drugs_health
  question: What must you do prior to taking a road test if you disclose a medical
    condition that might affect your ability to operate a motor vehicle?
  choices:
    A: Submit medical clearance from your physician.
    B: Take a specialized written exam.
    C: Bring a registered nurse as your sponsor.
    D: Complete an additional 10 hours of supervised driving.
  answer: A
  explanation: If you disclose a physical, mental, or medical condition or are taking
    medications that might affect your driving ability, you must submit medical clearance
    from your physician prior to taking a road test.
- id: 115
  category: driver_testing
  question: What is required for an applicant under 18 years old to get a Class M
    license?
  choices:
    A: Bring a sponsor to the road test
    B: Complete the MREP basic rider course
    C: Take the road test in a passenger vehicle
    D: Have a clean driving record for one year
  answer: B
  explanation: According to the manual, if you are under 18 years old, you are not
    eligible for an RMV Class M road test and must complete the MREP basic rider course
    to get a Class M license.
- id: 116
  category: driver_testing
  question: Which of the following is a requirement for a Class D road test sponsor?
  choices:
    A: Must be at least 18 years old
    B: Must have at least one year of driving experience
    C: Must hold a valid foreign driver's license
    D: Must sit in the front passenger seat
  answer: B
  explanation: A sponsor must be at least 21 years old, have at least one year of
    driving experience, and have a valid driver's license issued by their home state.
- id: 117
  category: driver_testing
  question: Without approval from the RMV Road Test Program, what is the maximum number
    of applicants a person can sponsor within a one-year period?
  choices:
    A: One
    B: Two
    C: Three
    D: Five
  answer: C
  explanation: Operators are not allowed to sponsor more than three different applicants
    within a one-year period without approval from the RMV Road Test Program.
- id: 118
  category: driver_testing
  question: Where must your sponsor sit during a Class D road test?
  choices:
    A: In the front passenger seat next to the driver
    B: In the rear seat behind the driver
    C: In the rear seat behind the examiner
    D: In the bed of a pickup truck if no rear seat is available
  answer: B
  explanation: The manual states that the examiner will sit next to you, and your
    sponsor must sit in the rear seat behind the driver.
- id: 119
  category: vehicle_information
  question: Why must the vehicle used for a road test have an accessible parking brake?
  choices:
    A: So the sponsor can assist with parking
    B: So the examiner can make an emergency stop
    C: To test the driver's ability to park on a hill
    D: To ensure the vehicle passes state inspection
  answer: B
  explanation: The vehicle must have an accessible parking brake so the examiner can
    make an emergency stop if necessary.
- id: 120
  category: vehicle_information
  question: If you use an out-of-state registered vehicle for your road test, what
    is the minimum required property damage insurance coverage you must prove?
  choices:
    A: $5,000
    B: $10,000
    C: $20,000
    D: $30,000
  answer: D
  explanation: If your test vehicle is registered out of state, you must show the
    examiner proof of insurance coverage equal to Massachusetts minimum limits, which
    are $25,000/$50,000 for bodily injury and $30,000 for property damage.
- id: 121
  category: driver_testing
  question: What additional documentation is required if you are using a rented vehicle
    for your road test?
  choices:
    A: A bill of sale from the rental company
    B: A letter from the rental company authorizing use for a road test
    C: Proof of a commercial driver's license
    D: A second foot brake installed in the vehicle
  answer: B
  explanation: If renting the vehicle, you must show the rental agreement and a letter
    from the rental company on its letterhead authorizing you and your sponsor to
    use the vehicle for a driver's license road test.
- id: 122
  category: vehicle_information
  question: Which type of license plate is strictly prohibited on a vehicle used for
    a road test?
  choices:
    A: Out-of-state plates
    B: Dealer plates
    C: Farm plates
    D: Repair plates
  answer: D
  explanation: 'The manual explicitly states: "You will not be allowed to take a road
    test in a vehicle with a repair plate."'
- id: 123
  category: driver_testing
  question: How does the RMV handle vehicles equipped with specialized features like
    back-up cameras during a road test?
  choices:
    A: The devices must be completely disabled before the test begins
    B: The vehicle will be rejected and the test canceled
    C: The devices do not need to be disabled, but your skills without relying only
      on them will be tested
    D: You are required to use these features to pass the test
  answer: C
  explanation: Specialized features like back-up cameras do not need to be disabled,
    but the examiner will test your driving skills and abilities without relying only
    on these features.
- id: 124
  category: driver_testing
  question: During the road test, approximately how far will the examiner ask you
    to back the vehicle?
  choices:
    A: 20 feet
    B: 50 feet
    C: 100 feet
    D: 200 feet
  answer: B
  explanation: During a road test, you should be prepared to demonstrate your ability
    to back the vehicle approximately 50 feet.
- id: 125
  category: driver_testing
  question: If you are deaf or hard of hearing, who arranges for an interpreter for
    your road test?
  choices:
    A: The applicant must hire their own interpreter
    B: The sponsor must act as the interpreter
    C: The Commission for the Deaf and Hard of Hearing
    D: The RMV examiner assigned to the test
  answer: C
  explanation: Once the test is booked, the Driver Licensing Department will contact
    the Commission for the Deaf and Hard of Hearing to arrange for an interpreter.
- id: 126
  category: driver_testing
  question: Which of the following is listed as a common reason for failing a road
    test?
  choices:
    A: Arriving exactly on time instead of 15 minutes early
    B: Not knowing the hand signals
    C: Using a vehicle with a centrally located parking brake
    D: Paying your road test fees online
  answer: B
  explanation: Not knowing the hand signals is explicitly listed in the manual under
    "Common Reasons for Failing a Road Test."
- id: 127
  category: vehicle_information
  question: A vehicle cannot be used for a road test if it has which of the following?
  choices:
    A: A back-up camera
    B: A 'donut' (limited use spare) tire
    C: A centrally located parking brake
    D: GPS-guided independent operation
  answer: B
  explanation: The manual states that a vehicle cannot be used for a road test if
    one of its tires has been replaced by a 'donut' (limited use spare) tire.
- id: 128
  category: driver_testing
  question: What is the rule regarding conversation between you and your sponsor during
    the road test?
  choices:
    A: You may converse freely to help ease your nerves
    B: Your sponsor may give you verbal directions on how to park
    C: You and your sponsor are not allowed to converse unless authorized by the examiner
    D: You must communicate with your sponsor using hand signals only
  answer: C
  explanation: During the road test, you and your sponsor/interpreter are not allowed
    to converse unless authorized by the examiner.
- id: 129
  category: driver_testing
  question: What may happen if you pass your road test but fail to pay your license
    fees within 60 days?
  choices:
    A: Your learner's permit will be permanently revoked.
    B: You may be required to retake the road test at your expense.
    C: You will be charged a late fee of $50.
    D: Your temporary license will automatically be extended.
  answer: B
  explanation: According to the manual, if you do not pay within 60 days of passing
    your road test, you may be required to retake the road test at your expense.
- id: 130
  category: license_system
  question: Can the receipt you receive at the RMV Service Center be used as a state-issued
    photo ID for boarding an airplane?
  choices:
    A: Yes, it is valid for all domestic and international travel.
    B: Yes, but only if accompanied by a birth certificate.
    C: No, the receipt is not valid for identification.
    D: No, unless it has a special travel stamp from the RMV.
  answer: C
  explanation: The manual states that the receipt serves as a temporary license but
    is not valid for identification, meaning it will not be accepted by most airlines
    or cruise ships for travel as a state-issued photo ID.
- id: 131
  category: driver_responsibility
  question: Where does Massachusetts law require you to keep your driver's license
    when operating a motor vehicle?
  choices:
    A: In the glove compartment of the vehicle.
    B: On your person or within easy reach inside your vehicle.
    C: Displayed visibly on the dashboard.
    D: In a secure location at your home.
  answer: B
  explanation: Whenever you operate a motor vehicle in Massachusetts, the law requires
    you to carry a valid driver's license on your person or within easy reach inside
    your vehicle.
- id: 132
  category: license_system
  question: When converting an out-of-state Junior Operator License, how many hours
    of supervised driving must you log if you have NOT completed a driver skills development
    program?
  choices:
    A: 20 hours
    B: 30 hours
    C: 40 hours
    D: 50 hours
  answer: C
  explanation: The manual requires you to log an additional 40 hours of supervised
    driving, which is reduced to 30 hours only if you completed a driver skills development
    program.
- id: 133
  category: license_system
  question: Under what condition will you be exempt from the passenger restriction
    when converting an out-of-state Junior Operator License?
  choices:
    A: If you are at least 17 years old.
    B: If you have had a valid license for a full six months without suspension or
      revocation.
    C: If you pass a written exam in Massachusetts.
    D: If you have completed 50 hours of supervised driving.
  answer: B
  explanation: If your driving record indicates you have had a valid license for a
    full six months, without suspension or revocation, you will not be subject to
    the passenger restriction.
- id: 134
  category: license_system
  question: To be eligible to convert an out-of-state learner's permit to a Massachusetts
    permit, the out-of-state permit must have been issued less than how long ago?
  choices:
    A: Six months ago
    B: One year ago
    C: Two years ago
    D: Five years ago
  answer: C
  explanation: To be eligible for permit conversion, you must present the current
    out-of-state permit issued less than two years ago.
- id: 135
  category: license_system
  question: Why is an original certified driving record required when converting a
    license from Canada, Mexico, or a U.S. Territory?
  choices:
    A: Because their driving records are not available for electronic review by the
      RMV through the Problem Driver Pointer System.
    B: Because their driving tests do not meet Massachusetts minimum standards.
    C: Because they use a different vehicle classification system.
    D: Because they do not require a written learner's permit exam.
  answer: A
  explanation: An original certified driving record is required from these jurisdictions
    because their driving records are not available for electronic review by the RMV
    through the Problem Driver Pointer System.
- id: 136
  category: license_system
  question: A Puerto Rican birth certificate will only be accepted for identification
    by the RMV if it was issued on or after what date?
  choices:
    A: January 1, 2000
    B: September 11, 2001
    C: July 1, 2010
    D: May 1, 2015
  answer: C
  explanation: The manual specifies that a Puerto Rican birth certificate will only
    be accepted for identification if it was issued on or after July 1, 2010.
- id: 137
  category: driver_responsibility
  question: How old must a U.S. citizen be to register to vote when conducting a permit,
    license, or ID transaction in Massachusetts?
  choices:
    A: At least 15 years old
    B: At least 16 years old
    C: At least 18 years old
    D: At least 21 years old
  answer: B
  explanation: 'The manual states: ''You must be a U.S. citizen and at least 16 years
    old to register to vote.'' (You must be at least 18 to actually vote).'
- id: 138
  category: license_system
  question: What is the fee to add the 'Veteran' indicator to your Massachusetts driver's
    license or ID card?
  choices:
    A: $5
    B: $10
    C: $15
    D: There is no additional fee
  answer: D
  explanation: The manual explicitly states, 'There is no additional fee for the Veteran's
    Indicator.'
- id: 139
  category: license_system
  question: Which of the following is an acceptable document to prove honorable discharge
    for the Veteran's Indicator?
  choices:
    A: A handwritten Honorable Discharge form
    B: A typed DD-214 indicating honorable discharge
    C: A standard military ID card
    D: A letter of recommendation from a commanding officer
  answer: B
  explanation: Acceptable proof includes a DD-214, DD-215, or an Honorable Discharge
    form. The manual notes that the information on the form must be typed (not handwritten).
- id: 140
  category: license_system
  question: What does the heart symbol on a Massachusetts driver's license or ID represent?
  choices:
    A: The driver has a medical heart condition.
    B: The driver is a veteran of the U.S. Armed Forces.
    C: The driver is in the Massachusetts Donor Registry and has consented to organ/tissue
      donation.
    D: The driver has completed an advanced driver skills development program.
  answer: C
  explanation: The heart symbol indicates that you are in the Massachusetts Donor
    Registry and have consented to organ/tissue donation.
- id: 141
  category: license_system
  question: If you are currently a registered organ donor, what must you do when renewing
    your license or ID card to remain in the registry?
  choices:
    A: Pay an additional $5 fee.
    B: Check 'yes' on question one of the license or ID card renewal form.
    C: Submit a new medical evaluation form.
    D: Get a new photograph taken at the RMV.
  answer: B
  explanation: 'The manual states: ''Even if you are currently a registered donor,
    you still need to check ''yes'' on question one of the license or ID card renewal
    form in order to remain in the donor registry.'''
- id: 142
  category: driver_testing
  question: What is the RMV's policy regarding violent or abusive conduct by road
    test applicants and sponsors?
  choices:
    A: A warning is issued for the first offense.
    B: The applicant must pay a fine before continuing the test.
    C: The RMV has a zero tolerance policy.
    D: The road test is delayed by 30 days.
  answer: C
  explanation: 'The manual notes: ''The RMV has a zero tolerance policy for violent
    or abusive conduct by road test applicants and sponsors.'''
- id: 143
  category: license_system
  question: Can you be an organ and tissue donor if you do not currently have the
    heart symbol on your license or ID?
  choices:
    A: Yes, you can register anytime online and your name will be in the Donor Registry's
      database.
    B: No, you must order a new license with the symbol immediately to be a donor.
    C: Yes, but only if you carry a separate physical donor card at all times.
    D: No, the heart symbol is legally required to authorize donation.
  answer: A
  explanation: 'The manual states: ''Yes. You can register as an organ/tissue donor
    anytime on Mass.Gov/RMV. You don''t need to get a new license/ID. Your license/ID
    won''t have the heart symbol, but your name will be in the Donor Registry''s database.'''
- id: 144
  category: license_system
  question: Do you need to carry a separate donor card if you have the heart symbol
    on your Massachusetts license?
  choices:
    A: Yes, at all times.
    B: Yes, but only when driving out of state.
    C: No, the heart symbol indicates you are in the Donor Registry.
    D: No, unless you are under 18 years old.
  answer: C
  explanation: According to the manual, you do not need to carry a donor card if you
    have the heart symbol on your license, as it indicates you are in the Massachusetts
    Donor Registry.
- id: 145
  category: license_system
  question: How much notice must you give to cancel a road test appointment to avoid
    being charged the $35 fee?
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: C
  explanation: The manual states that if you cancel your appointment with less than
    72 hours notice, you will still be charged the $35 fee.
- id: 146
  category: license_system
  question: Which group is exempt from paying driver's license transaction fees in
    Massachusetts?
  choices:
    A: Senior citizens over 65
    B: Disabled Veterans with or qualifying for Disabled Veteran plates
    C: Active duty military personnel
    D: State employees
  answer: B
  explanation: Disabled Veterans do not pay any fees for driver's license transactions
    if they have Disabled Veteran plates or if they have qualified for them with Medical
    Affairs.
- id: 147
  category: vehicle_information
  question: What must you do if your vehicle's directional signals or brake lights
    stop working?
  choices:
    A: Drive only during daylight hours.
    B: Use hand signals when turning or slowing until they are fixed.
    C: Turn on your hazard lights continuously.
    D: Stop driving the vehicle immediately and have it towed.
  answer: B
  explanation: If the directional signals or brake lights on your vehicle stop working,
    you must have them fixed right away and use hand signals when turning or slowing
    until they are fixed.
- id: 148
  category: vehicle_information
  question: Which of the following is a legal restriction on glass tinting for passenger
    vehicles?
  choices:
    A: You cannot tint your side windows at all.
    B: You can darken your windshield up to 35 percent.
    C: It is illegal to tint your windshield.
    D: Rear windows can be darkened up to 50 percent.
  answer: C
  explanation: The manual states that you can darken your side and rear windows up
    to 35 percent, but it is illegal to tint your windshield.
- id: 149
  category: penalties_and_points
  question: What is the fine for a driver who is not wearing a safety belt?
  choices:
    A: $25
    B: $35
    C: $50
    D: $100
  answer: A
  explanation: Any driver who is not wearing a safety belt can be fined $25.
- id: 150
  category: penalties_and_points
  question: Under Massachusetts law, a driver can be fined $25 for which of the following
    unbelted passengers?
  choices:
    A: Any passenger over the age of 18
    B: A passenger who is 16 or 17 years old
    C: Each passenger age 12, 13, 14, or 15
    D: Passengers riding in a taxi
  answer: C
  explanation: A driver can be fined $25 for each passenger age 12, 13, 14, or 15
    who is not wearing a safety belt. Passengers 16 and older are fined directly.
- id: 151
  category: safe_driving_rules
  question: Which of the following individuals is required to wear a safety belt under
    Massachusetts law?
  choices:
    A: A driver of a vehicle manufactured before July 1966
    B: A passenger in an emergency vehicle
    C: A driver of a passenger motor vehicle under 18,000 lbs
    D: An employee of the U.S. Postal Service driving while working
  answer: C
  explanation: Massachusetts law requires every person in a passenger motor vehicle
    (including vans and small trucks under 18,000 lbs.) to wear a safety belt. The
    other options are listed as specific exemptions.
- id: 152
  category: safe_driving_rules
  question: Infants and small children must sit in federally approved child passenger
    restraints until they reach what age or height?
  choices:
    A: 6 years old or 50 inches tall
    B: 7 years old or 54 inches tall
    C: 8 years old or 57 inches tall
    D: 9 years old or 60 inches tall
  answer: C
  explanation: Infants and small children must sit in federally approved child passenger
    restraints until they are at least eight years old or at least fifty-seven inches
    tall.
- id: 153
  category: safe_driving_rules
  question: Where is the safest place for a child to sit in a passenger vehicle?
  choices:
    A: The front passenger seat
    B: The back middle seat
    C: The back right seat
    D: The back left seat
  answer: B
  explanation: The manual states that the safest place for a child to sit is in the
    back seat, and the back middle seat is best.
- id: 154
  category: safe_driving_rules
  question: According to the Guide to Child Safety Seats, what is the weight limit
    for an infant seat?
  choices:
    A: Up to 15 pounds
    B: Up to 20 pounds
    C: 20 to 40 pounds
    D: 40 to 80 pounds
  answer: B
  explanation: The Guide to Child Safety Seats specifies that an infant seat is for
    children up to 20 pounds.
- id: 155
  category: defensive_driving
  question: 'When worn correctly, safety belts lower the chance of death or serious
    injury in a crash by about:'
  choices:
    A: 25 percent
    B: 50 percent
    C: 75 percent
    D: 90 percent
  answer: B
  explanation: When worn correctly, safety belts lower the chance of death or serious
    injury in a crash by about 50 percent.
- id: 156
  category: vehicle_information
  question: How many red stop (brake) lights must a passenger vehicle have in the
    back?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: C
  explanation: The manual states that the vehicle must have three red stop (brake)
    lights in the back.
- id: 157
  category: driver_responsibility
  question: How is the Massachusetts safety belt law enforced?
  choices:
    A: You can be stopped and fined solely for not wearing a seat belt.
    B: You can only get a fine for the safety belt law when you are stopped for a
      traffic violation.
    C: Safety belt fines are only issued if you are involved in a crash.
    D: Police use traffic cameras to issue safety belt citations by mail.
  answer: B
  explanation: The manual notes that you can only get a fine for the safety belt law
    when you are stopped for a traffic violation (secondary enforcement).
- id: 158
  category: vehicle_information
  question: What is the restriction on using a spot light on a passenger vehicle?
  choices:
    A: It can only be used to read signs or as an emergency light if headlights are
      broken.
    B: It can be used at any time to improve visibility in fog.
    C: It must shine at least four feet above the roadway.
    D: It can be used to warn oncoming drivers of a hazard.
  answer: A
  explanation: A passenger vehicle may have a spot light that can only be used to
    read signs or as an emergency light if the headlights are not working.
- id: 159
  category: safe_driving_rules
  question: How should a lap safety belt be properly worn?
  choices:
    A: Loosely across the stomach
    B: Low, tight, and flat over the hips
    C: Under the arm and across the chest
    D: Tightly across the thighs and knees
  answer: B
  explanation: According to the manual, a lap belt should fit low, tight, and flat
    over the hips and should not be twisted.
- id: 160
  category: safe_driving_rules
  question: According to the manual, hitting the windshield at 30 mph is comparable
    to what?
  choices:
    A: Falling from the roof of a one-story house
    B: Falling from the third story of a building
    C: Being tackled by a professional football player
    D: Hitting a brick wall at 60 mph
  answer: B
  explanation: The manual states that hitting the windshield at 30 mph is like falling
    from the third story of a building and hitting the pavement.
- id: 161
  category: vehicle_information
  question: Where should an infant in a rear-facing child safety seat be placed if
    the vehicle has a passenger-side airbag?
  choices:
    A: In the front seat with the seat pushed all the way back
    B: In the front seat with the airbag deactivated
    C: In the back seat of the vehicle
    D: In the front seat facing forward
  answer: C
  explanation: The manual explicitly states that infants in back-facing child safety
    seats should never be in the front seat of a vehicle with a passenger-side air
    bag. Children are always safest when riding in the back seat.
- id: 162
  category: safe_driving_rules
  question: What is the legal exception for wearing an earplug while driving in Massachusetts?
  choices:
    A: Drivers of any age may wear two earplugs if listening to GPS instructions
    B: Drivers 18 or older can use one earplug for use with a cell phone
    C: Drivers under 18 can use one earplug for listening to music
    D: Any driver can wear noise-canceling headphones to reduce stress
  answer: B
  explanation: It is illegal to wear a radio headset or headphones that restrict attention,
    but if you are 18 or older, you can use one earplug for use with a cell phone.
- id: 163
  category: vehicle_information
  question: What is the rule regarding televisions installed inside a motor vehicle?
  choices:
    A: They must be mounted on the dashboard for the front passenger
    B: They can be visible to the driver as long as the volume is muted
    C: They must be behind the front seat and not visible to the driver
    D: They are completely illegal to have in any part of the vehicle
  answer: C
  explanation: Any television installed in a vehicle must be behind the front seat
    and not visible to the driver to prevent distraction.
- id: 164
  category: safe_driving_rules
  question: Under what conditions are children under 12 years old generally allowed
    to ride in the bed of a pickup truck?
  choices:
    A: When accompanied by an adult
    B: When traveling on residential streets at any speed
    C: They are not allowed, with very limited exceptions that never exceed 5 mph
    D: When they are seated flat on the bed of the truck
  answer: C
  explanation: Children under 12 years old are not allowed to ride in the beds of
    pickup trucks, with very limited exceptions, and never at speeds more than five
    mph.
- id: 165
  category: safe_driving_rules
  question: When is a driver who is 18 or older permitted to use a hand-held mobile
    electronic device?
  choices:
    A: When stopped at a red light or stop sign
    B: When driving under 15 mph in heavy traffic
    C: When the vehicle is stationary and not located in a public travel lane
    D: When pulled over on the shoulder of a busy highway
  answer: C
  explanation: Handheld device use is only allowed if the vehicle is stationary and
    is not located in a public travel lane. It is not allowed at red lights, stop
    signs, or on the side of a busy road/highway.
- id: 166
  category: safe_driving_rules
  question: What is the ONLY exception that allows a driver under 18 to use a mobile
    electronic device while driving?
  choices:
    A: To answer a call from a parent or guardian
    B: To use a GPS navigation application
    C: To report an emergency
    D: To change the music playlist while stopped at a red light
  answer: C
  explanation: Drivers under 18 cannot use any mobile electronic device for any reason
    while driving. The only exception is for reporting an emergency.
- id: 167
  category: penalties_and_points
  question: What is the penalty for a first offense of using a hand-held mobile electronic
    device while driving?
  choices:
    A: A $50 fine
    B: A $100 fine
    C: A $250 fine and a distracted driving program
    D: A 30-day license suspension
  answer: B
  explanation: The penalty for a 1st offense of violating the hand-held mobile electronic
    device law is a $100 fine.
- id: 168
  category: safe_driving_rules
  question: According to the manual, at what speeds do eight out of ten motor vehicle
    crashes occur?
  choices:
    A: 25 mph or less
    B: 40 mph or less
    C: 55 mph or less
    D: 65 mph or more
  answer: B
  explanation: The manual states that eight out of ten crashes happen at speeds of
    40 mph or less.
- id: 169
  category: vehicle_information
  question: What type of crash are front air bags specifically designed to protect
    you from?
  choices:
    A: Rear-end crashes
    B: Side-impact crashes
    C: Rollover crashes
    D: Head-on crashes
  answer: D
  explanation: Front air bags are only made for head-on crashes and do not protect
    you in crashes from the side or back.
- id: 170
  category: safe_driving_rules
  question: How must a GPS device or cell phone be used for navigation by an adult
    driver?
  choices:
    A: It must be held in the driver's right hand
    B: It must be affixed to the vehicle temporarily or permanently
    C: It must be kept in the passenger seat
    D: It must be operated by a passenger only
  answer: B
  explanation: GPS devices (including cell phones) can be used if the device is affixed,
    either temporarily or permanently, in the motor vehicle for the purpose of providing
    navigation assistance.
- id: 171
  category: defensive_driving
  question: Why is it important to maintain space around your vehicle while driving?
  choices:
    A: To allow pedestrians to cross the street anywhere
    B: To prevent other drivers from passing you
    C: In case you need to suddenly change lanes to avoid a crash
    D: To improve your vehicle's fuel efficiency
  answer: C
  explanation: Defensive driving requires you to maintain space around your vehicle
    in case you need to suddenly change lanes to avoid a crash.
- id: 172
  category: driver_responsibility
  question: What are the consequences if you crash and injure someone or damage property
    because you were using a mobile electronic device?
  choices:
    A: You will receive a warning and a small fine
    B: You will face criminal charges and lose your license
    C: You will only have to pay for the property damage
    D: You will be required to retake the road test
  answer: B
  explanation: It is a crime to injure a person or damage property because of negligent
    driving. If you crash because you were using a mobile electronic device, you will
    face criminal charges and lose your license.
- id: 173
  category: penalties_and_points
  question: What is the maximum fine for tailgating another vehicle?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: Tailgating is illegal and the main cause of rear-end crashes. The fine
    for tailgating can be as high as $100.
- id: 174
  category: vehicle_information
  question: What is the minimum legal tread depth for your vehicle's tires?
  choices:
    A: 1/32 inches
    B: 2/32 inches
    C: 3/32 inches
    D: 4/32 inches
  answer: B
  explanation: Tires must have at least 2/32 inches of tread depth in the proper grooves
    and no fabric breaks or exposed cords.
- id: 175
  category: safe_driving_rules
  question: When are you required to use your headlights and taillights based on the
    time of day?
  choices:
    A: From one hour after sunset until one hour before sunrise
    B: From one-half hour after sunset until one-half hour before sunrise
    C: From sunset to sunrise
    D: Only when it is completely dark outside
  answer: B
  explanation: You must use your headlights and taillights from one-half hour after
    sunset until one-half hour before sunrise.
- id: 176
  category: safe_driving_rules
  question: Which of the following is true regarding the use of headlights during
    the day?
  choices:
    A: You must turn on your headlights whenever you use your windshield wipers.
    B: Daytime running lights are sufficient when it is raining.
    C: Headlights are only required if you cannot see 1,000 feet ahead.
    D: You only need to use headlights during the day if you are driving on a highway.
  answer: A
  explanation: You must use your headlights whenever you use your windshield wipers
    (daytime running lights are not sufficient).
- id: 177
  category: sharing_the_road
  question: How much following distance should you maintain behind a motorcycle?
  choices:
    A: At least two seconds
    B: At least three seconds
    C: At least four seconds
    D: At least five seconds
  answer: C
  explanation: You should keep more space (at least four seconds) behind a motorcycle
    than you would for another vehicle.
- id: 178
  category: vehicle_information
  question: Where must registration stickers be placed on your license plate?
  choices:
    A: In the upper left corner
    B: In the lower left corner
    C: In the upper right corner
    D: In the lower right corner
  answer: C
  explanation: Registration stickers must only be placed in the upper right corner
    of the plate.
- id: 179
  category: vehicle_information
  question: What should you do if you need to stop quickly and your vehicle is equipped
    with antilock brakes?
  choices:
    A: Pump the brakes rapidly
    B: Never pump the brakes
    C: Lightly tap the brakes until you stop
    D: Apply the parking brake simultaneously
  answer: B
  explanation: If your vehicle has antilock brakes, never pump the brakes.
- id: 180
  category: defensive_driving
  question: To avoid the glare of headlights from oncoming vehicles at night, where
    should you look?
  choices:
    A: Directly at the oncoming headlights
    B: To the lower left side of your lane
    C: To the lower right side of your lane
    D: At the center line of the road
  answer: C
  explanation: When driving at night, do not look straight at headlights. Look to
    the lower right side of your lane.
- id: 181
  category: defensive_driving
  question: What is the recommended action if another driver is tailgating you?
  choices:
    A: Tap your brakes lightly to warn them
    B: Speed up to increase the distance
    C: Move to another lane or pull to the side of the road to let them pass
    D: Turn on your hazard lights and maintain your speed
  answer: C
  explanation: If a tailgater is behind you, move to another lane or pull to the side
    of the road to let the tailgater pass.
- id: 182
  category: sharing_the_road
  question: Compared to passenger vehicles, how much stopping distance might large
    trucks require?
  choices:
    A: The same stopping distance
    B: One and a half times the stopping distance
    C: Two times the stopping distance
    D: Three times the stopping distance
  answer: C
  explanation: Large trucks may require two times the stopping distance of passenger
    vehicles.
- id: 183
  category: driver_responsibility
  question: In which of the following situations is it appropriate to use your horn?
  choices:
    A: To try to get a slower driver to move faster
    B: To warn pedestrians or other drivers of possible trouble
    C: To show anger about another driver's mistake
    D: To try to get other vehicles moving in a traffic jam
  answer: B
  explanation: You should use your horn to warn pedestrians or other drivers of possible
    trouble or to avoid crashes. You should not use it to show anger, get a slower
    driver to move faster, or in a traffic jam.
- id: 184
  category: vehicle_information
  question: From what distance must your license plate number be visible at night?
  choices:
    A: 30 feet
    B: 50 feet
    C: 60 feet
    D: 100 feet
  answer: C
  explanation: Your license plates must be kept clean and unblocked, and your plate
    number must be visible from 60 feet at night.
- id: 185
  category: defensive_driving
  question: Which of the following is a key principle of defensive driving regarding
    right-of-way?
  choices:
    A: Right-of-way is something you should always take if the law allows.
    B: Right-of-way is something you give to prevent unsafe traffic situations.
    C: Right-of-way belongs to the larger vehicle.
    D: Right-of-way should be determined by who arrives at the intersection first,
      without exception.
  answer: B
  explanation: Remember that right-of-way is something you give. A big part of driving
    defensively is giving the right-of-way to prevent unsafe traffic situations.
- id: 186
  category: vehicle_information
  question: Approximately how far ahead do high beam headlights normally let you see?
  choices:
    A: 150 feet
    B: 250 feet
    C: 350 feet
    D: 500 feet
  answer: C
  explanation: High beam headlights normally let you see about 350 feet ahead.
- id: 187
  category: vehicle_information
  question: How often must your passenger vehicle or motorcycle be inspected for safety
    and emissions?
  choices:
    A: Every 6 months
    B: Every year
    C: Every two years
    D: Only when you sell the vehicle
  answer: B
  explanation: Your passenger vehicle or motorcycle must be inspected for safety and
    emissions every year.
- id: 188
  category: safe_driving_rules
  question: When must you lower your high beam headlights to low beam?
  choices:
    A: Within 300 feet of an oncoming vehicle or 100 feet of a vehicle ahead
    B: Within 500 feet of an oncoming vehicle or 200 feet of a vehicle ahead
    C: Within 400 feet of an oncoming vehicle or 300 feet of a vehicle ahead
    D: Within 200 feet of an oncoming vehicle or 500 feet of a vehicle ahead
  answer: B
  explanation: The manual states that you must lower your high beam headlights to
    low beam when you are within 500 feet of an oncoming vehicle or within 200 feet
    of a vehicle traveling ahead of you.
- id: 189
  category: defensive_driving
  question: If an oncoming driver does not change their high beams to low beams, where
    should you look to avoid the glare?
  choices:
    A: Straight at the oncoming headlights
    B: To the upper left side of your lane
    C: To the lower right side of your lane
    D: At your inside rearview mirror
  answer: C
  explanation: 'To reduce glare from oncoming headlights, the manual advises: ''Do
    not look straight at headlights. Look to the lower right side of your lane.'''
- id: 190
  category: safe_driving_rules
  question: 'According to the manual, drowsy driving crashes most often involve:'
  choices:
    A: Multiple vehicles colliding at intersections during rush hour
    B: A single driver running off the road at a high rate of speed
    C: Rear-end collisions in stop-and-go traffic
    D: Pedestrians being struck in crosswalks
  answer: B
  explanation: The manual notes that drowsy driving crashes most often involve a single
    driver (and no passengers) running off the road at a high rate of speed.
- id: 191
  category: safe_driving_rules
  question: What does the law require you to do whenever you use your windshield wipers?
  choices:
    A: Turn on your hazard lights
    B: Use your daytime running lights only
    C: Turn on your headlights and taillights
    D: Drive at least 15 mph below the speed limit
  answer: C
  explanation: The law requires you to use your headlights and taillights whenever
    you use your windshield wipers. Daytime running lights are not sufficient.
- id: 192
  category: defensive_driving
  question: If your vehicle starts to hydroplane, what is the correct action to take?
  choices:
    A: Hit the brakes immediately
    B: Turn the steering wheel suddenly to regain traction
    C: Slowly step off the gas pedal and never hit the brakes or turn suddenly
    D: Accelerate to push through the water
  answer: C
  explanation: If your vehicle starts to hydroplane, you should slowly step off the
    gas pedal. You must never hit the brakes or turn suddenly, as you may lose control
    and skid.
- id: 193
  category: vehicle_information
  question: What should you do after driving through a large puddle to ensure your
    brakes work properly?
  choices:
    A: Apply your brakes lightly as soon as you can to dry them
    B: Pump your brakes rapidly for 30 seconds
    C: Pull over and wait for the brakes to air dry
    D: Accelerate quickly to spin the water off the brake pads
  answer: A
  explanation: Wet brakes do not work right. If you drive through a large puddle,
    the manual advises to apply your brakes lightly as soon as you can to dry them
    until you feel them working normally again.
- id: 194
  category: defensive_driving
  question: Why do bridges and highway overpasses freeze before the rest of the road?
  choices:
    A: They are exposed to more wind than regular roads
    B: The ground does not insulate them
    C: They are usually made of smoother concrete
    D: Snow plows cannot clear them effectively
  answer: B
  explanation: Bridges and highway overpasses freeze before the rest of the road and
    can be very slippery because the ground does not insulate them.
- id: 195
  category: penalties_and_points
  question: What is a potential consequence of failing to clear all ice and snow from
    the roof, hood, and trunk of your vehicle before driving?
  choices:
    A: Your vehicle will fail its annual inspection
    B: You can be charged with negligent operation
    C: Your license will be automatically suspended for 30 days
    D: You will be required to take a winter driving course
  answer: B
  explanation: It is very important to clear the roof, hood, and trunk so ice and
    snow does not blow into vehicles behind you. If you do not, you can be charged
    with negligent operation.
- id: 196
  category: vehicle_information
  question: Why should you keep your gas tank at least half full during winter driving?
  choices:
    A: To add extra weight to the vehicle for better traction
    B: To prevent the gas line from freezing
    C: To ensure the heater works at maximum capacity
    D: To avoid paying higher winter fuel prices
  answer: B
  explanation: During winter driving, you should keep your gas tank at least half
    full to prevent the gas line from freezing.
- id: 197
  category: sharing_the_road
  question: Under the Vulnerable Road Users Law, what is the minimum safe passing
    distance you must leave between your vehicle and a vulnerable road user?
  choices:
    A: At least two feet
    B: At least three feet
    C: At least four feet
    D: At least six feet
  answer: C
  explanation: When you pass a vulnerable road user, you must leave a safe passing
    distance of at least four feet between your vehicle and the road user.
- id: 198
  category: sharing_the_road
  question: Which of the following is considered a 'vulnerable road user' under Massachusetts
    law?
  choices:
    A: A driver in a compact car
    B: A person riding a horse or horse-drawn carriage
    C: A passenger on a commercial bus
    D: A driver operating a snowplow
  answer: B
  explanation: Massachusetts law defines 'vulnerable road users' to include pedestrians,
    roadside workers, bicyclists, and people riding horses or horse drawn carriages,
    among others.
- id: 199
  category: sharing_the_road
  question: Under the White Cane Law, what must you do for a blind pedestrian crossing
    a street?
  choices:
    A: Honk your horn lightly to let them know you are there
    B: Stop completely and remain stopped until the person has safely crossed
    C: Wave the person on so they know it is safe to cross
    D: Slow down and carefully steer around them
  answer: B
  explanation: The White Cane Law requires you to stop completely for a blind pedestrian
    crossing a street. You must remain stopped until the person has safely crossed,
    and you should never honk or wave the person on.
- id: 200
  category: sharing_the_road
  question: How can you visually identify a pedestrian who is Deaf or Hard of Hearing?
  choices:
    A: They will always carry a white cane
    B: They are required to wear a reflective yellow vest
    C: They will be accompanied by a guide dog
    D: It is impossible to visually identify someone who is Deaf or Hard of Hearing
  answer: D
  explanation: 'The manual explicitly states: ''It is impossible to visually identify
    someone who is Deaf or Hard of Hearing.'''
- id: 201
  category: sharing_the_road
  question: Why is it important to lower your speed when passing a bicycle or moped?
  choices:
    A: The wind caused by your vehicle can throw a rider off balance
    B: It allows you to communicate with the rider
    C: It prevents your engine noise from startling the rider
    D: Mopeds are legally required to travel at very low speeds
  answer: A
  explanation: When passing a bicycle or moped, you should lower your speed because
    the wind caused by your vehicle can throw a rider off balance.
- id: 202
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog, and why?
  choices:
    A: High beam headlights to see as far ahead as possible
    B: Low beam headlights to reduce glare
    C: Daytime running lights to save battery power
    D: Parking lights to avoid blinding other drivers
  answer: B
  explanation: The manual states that in fog, you should use your low beam headlights
    to reduce glare.
- id: 203
  category: sharing_the_road
  question: What should you do when passing a bicycle or moped on the road?
  choices:
    A: Honk your horn to alert them to move over.
    B: Lower your speed because the wind caused by your vehicle can throw the rider
      off balance.
    C: Speed up to pass them as quickly as possible.
    D: Move into their lane to force them onto the shoulder.
  answer: B
  explanation: The manual states that when passing a bicycle or moped, you should
    lower your speed because the wind caused by your vehicle can throw a rider off
    balance.
- id: 204
  category: sharing_the_road
  question: What is the recommended following distance you should leave between your
    vehicle and a motorcycle in front of you?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: C
  explanation: The manual advises using a four-second following distance when following
    behind a motorcycle, compared to a three-second distance for other motor vehicles.
- id: 205
  category: sharing_the_road
  question: Which of the following is true regarding sharing a lane with a motorcycle?
  choices:
    A: You may share a lane if the lane is wide enough.
    B: You must never share a lane with a motorcycle.
    C: You can share a lane if the motorcyclist is riding to one side.
    D: Motorcycles are required to share lanes with other motorcycles.
  answer: B
  explanation: The manual states that you must never share a lane with a motorcycle,
    even if the lane is wide and the motorcyclist is riding to one side, as crowding
    into a lane is illegal and very dangerous.
- id: 206
  category: sharing_the_road
  question: What common action by drivers of cars or trucks causes many crashes with
    motorcycles at intersections?
  choices:
    A: Turning right on a red light
    B: Turning left in front of an oncoming motorcycle
    C: Stopping too quickly at a stop sign
    D: Failing to use turn signals when changing lanes
  answer: B
  explanation: According to the manual, cars or trucks turning left in front of an
    oncoming motorcycle cause a lot of crashes at intersections.
- id: 207
  category: safe_driving_rules
  question: When operating a motorized bicycle (moped), what is the maximum speed
    you are legally allowed to drive?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: B
  explanation: 'The rules for driving a moped explicitly state: ''Do not drive faster
    than 25 mph.'''
- id: 208
  category: safe_driving_rules
  question: If you are operating a moped with a learner's permit, what is the rule
    regarding passengers?
  choices:
    A: You may carry one passenger if they wear a helmet.
    B: You may carry a passenger only if they are over 18.
    C: You must not carry any passengers.
    D: You may carry passengers only on off-street recreational paths.
  answer: C
  explanation: The manual explicitly states that when operating a moped with a learner's
    permit, you must not carry any passengers.
- id: 209
  category: vehicle_information
  question: Which of the following statements is true about registering a motorized
    scooter in Massachusetts?
  choices:
    A: It must be registered as a motorcycle.
    B: It must be registered if it has a gas motor.
    C: The Registry of Motor Vehicles will not register motorized scooters.
    D: It requires a special low-speed vehicle registration.
  answer: C
  explanation: The manual states, 'The Registry of Motor Vehicles will not register
    motorized scooters.'
- id: 210
  category: safe_driving_rules
  question: When are you prohibited from driving a motorized scooter?
  choices:
    A: During rush hour traffic
    B: After sunset or before sunrise
    C: On weekends
    D: When it is raining
  answer: B
  explanation: The rules for driving a motorized scooter state that you must 'Do not
    drive after sunset or before sunrise.'
- id: 211
  category: safe_driving_rules
  question: 'A limited use vehicle cannot be driven on any road with a speed limit
    faster than:'
  choices:
    A: 30 mph
    B: 40 mph
    C: 50 mph
    D: 55 mph
  answer: B
  explanation: The manual states that you cannot drive a limited use vehicle on a
    limited-access or express state highway or any road with a speed limit faster
    than 40 mph.
- id: 212
  category: license_system
  question: What type of driver's license or permit is required to drive a Low Speed
    Vehicle (LSV)?
  choices:
    A: Class M
    B: Class D
    C: Commercial Driver's License (CDL)
    D: No license is required
  answer: B
  explanation: The manual states, 'You must have a valid Class D driver’s license
    or learner’s permit to drive a low speed vehicle.'
- id: 213
  category: penalties_and_points
  question: If a bicyclist is cited by a police officer for a traffic violation, how
    does it affect their driving record?
  choices:
    A: It adds points to their driving record.
    B: It will result in a license suspension.
    C: It will not affect their driving record.
    D: It counts as a criminal violation.
  answer: C
  explanation: The manual states that if a bicyclist commits a traffic violation,
    'The bicyclist can be fined, but it will not affect their driving record.'
- id: 214
  category: driver_responsibility
  question: What can happen if a bicyclist refuses to give their true name and address
    to a police officer when asked?
  choices:
    A: They can be arrested.
    B: Their bicycle can be permanently confiscated.
    C: Their driver's license will be revoked immediately.
    D: They will be banned from riding a bicycle for a year.
  answer: A
  explanation: The manual states, 'A bicyclist can also be arrested for refusing to
    give their name.'
- id: 215
  category: penalties_and_points
  question: Which of the following is one of the three types of events listed in the
    manual that can cause you to lose your driving privileges?
  choices:
    A: Getting a parking ticket
    B: Motor vehicle crashes where you are found to be more than 50 percent at fault
    C: Failing to renew your vehicle registration on time
    D: Driving a motorized scooter without a helmet
  answer: B
  explanation: 'The manual lists three events that can cause you to lose driving privileges:
    civil motor vehicle infractions, criminal violations, and motor vehicle crashes
    where you are found to be more than 50 percent at fault.'
- id: 216
  category: license_system
  question: You cannot renew an expired driver's license if you have which of the
    following?
  choices:
    A: Unpaid parking violations
    B: A single speeding warning
    C: A registered motorized scooter
    D: A Class M learner's permit
  answer: A
  explanation: The manual states, 'You cannot renew an expired license if you have
    unpaid parking violations, unpaid excise taxes, outstanding court warrants, outstanding
    E-ZPass/Fast Lane violations, or Tobin Bridge violations.'
- id: 217
  category: sharing_the_road
  question: What should you do if you are driving at night and a bicyclist is coming
    toward you?
  choices:
    A: Flash your high beams to warn them of your presence.
    B: Dim your headlights.
    C: Turn off your headlights temporarily.
    D: Honk your horn.
  answer: B
  explanation: The manual instructs drivers to 'Dim your headlights at night if a
    bicyclist is coming toward you.'
- id: 218
  category: penalties_and_points
  question: What is a consequence of having unpaid parking violations in Massachusetts?
  choices:
    A: Your vehicle will be immediately impounded.
    B: You cannot renew your driver's license or vehicle registration.
    C: You will be charged with a criminal offense.
    D: Your insurance rates will automatically double.
  answer: B
  explanation: According to the manual, if you do not pay a parking violation, you
    will not be able to renew your driver's license or vehicle registration.
- id: 219
  category: penalties_and_points
  question: How many days do you have to pay the required fine or request a hearing
    for a civil motor vehicle infraction (CMVI)?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: If you get a citation from a police officer for a civil motor vehicle
    infraction (CMVI), you must pay the required fine or request a hearing to dispute
    it within 20 days.
- id: 220
  category: penalties_and_points
  question: What happens to the $25 filing fee if you request a hearing for a civil
    citation and the court finds you NOT RESPONSIBLE for ALL violations?
  choices:
    A: It is kept as an administrative fee.
    B: It is applied to your next vehicle registration.
    C: It is refunded to you.
    D: It is donated to the Head Injury Treatment Services Trust Fund.
  answer: C
  explanation: If you are found NOT RESPONSIBLE by the court for ALL violations on
    the civil citation, the $25 filing fee will be refunded.
- id: 221
  category: safe_driving_rules
  question: What is the lowest penalty for driving above the speed limit in Massachusetts?
  choices:
    A: $50
    B: $75
    C: $105
    D: $150
  answer: C
  explanation: The lowest penalty for driving above the speed limit is a $105 fine.
- id: 222
  category: penalties_and_points
  question: If you drive more than 10 miles per hour (mph) over the speed limit, how
    much must you pay for each additional mph over the first 10?
  choices:
    A: $5
    B: $10
    C: $15
    D: $20
  answer: B
  explanation: If you drive more than ten miles per hour (mph) over the speed limit,
    you must pay an extra $10 for each mph you were traveling above the first ten.
- id: 223
  category: penalties_and_points
  question: By law, all fines for speeding violations include a $50 surcharge that
    goes toward which of the following?
  choices:
    A: The Highway Maintenance Fund
    B: The Head Injury Treatment Services Trust Fund
    C: The Public Safety Training Fund
    D: The Safe Driver Insurance Plan
  answer: B
  explanation: By law, all fines for speeding violations include a $50 surcharge.
    The entire surcharge goes to the Head Injury Treatment Services Trust Fund.
- id: 224
  category: safe_driving_rules
  question: What happens to the speeding fine if you are caught speeding in a posted
    work zone?
  choices:
    A: It is doubled.
    B: It is tripled.
    C: An extra $100 is added.
    D: Your license is immediately revoked.
  answer: A
  explanation: If you are caught speeding in a posted work zone, the speeding fine
    is doubled.
- id: 225
  category: penalties_and_points
  question: Your license will be suspended for 30 days if you are found guilty of
    how many speeding violations in a 12-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Your license will be suspended for 30 days if you are found guilty
    for three speeding violations in a 12-month period.
- id: 226
  category: penalties_and_points
  question: If you have a Junior Operator's License, what is the penalty for a first-offense
    speeding violation?
  choices:
    A: A 30-day license suspension
    B: A 60-day license suspension
    C: A 90-day license suspension
    D: A one-year license suspension
  answer: C
  explanation: If you have a Junior Operator's License, a 1st offense will cause a
    90-day license suspension.
- id: 227
  category: driver_responsibility
  question: A police officer may arrest you and you may face criminal charges if you
    refuse to do which of the following?
  choices:
    A: Answer questions about your destination
    B: Sign your name in front of the officer
    C: Allow the officer to search your trunk
    D: Take a roadside breathalyzer test
  answer: B
  explanation: A police officer may arrest you and you may face criminal charges if
    you refuse to sign your name in front of the officer, show your license, or give
    your name and address.
- id: 228
  category: penalties_and_points
  question: You are considered more than 50 percent at fault for a crash if your insurance
    company finds you at fault and has paid more than what amount for collision or
    damage?
  choices:
    A: $500
    B: $1000
    C: $1500
    D: $2000
  answer: B
  explanation: You are more than 50 percent at fault for a crash if your insurance
    company finds you at fault according to the Standards of Fault and has paid more
    than $1000 for collision, limited collision, or damage to someone else's property.
- id: 229
  category: penalties_and_points
  question: You must complete the Massachusetts Driver Retraining Course if you accumulate
    how many surchargeable events within a two-year period?
  choices:
    A: Two
    B: Three
    C: Five
    D: Seven
  answer: B
  explanation: If you have three surchargeable events within a two-year period, your
    license may be suspended and the RMV will send you a letter telling you to complete
    a Driver Retraining course.
- id: 230
  category: penalties_and_points
  question: How long is the Driver Retraining program for drivers who have accumulated
    three or more surchargeable events?
  choices:
    A: One four-hour session
    B: An eight-hour program
    C: A twelve-hour program
    D: Two eight-hour sessions
  answer: B
  explanation: The manual states that the Driver Retraining program is an eight-hour
    program, typically held in two four-hour sessions or one eight-hour Saturday session.
- id: 231
  category: penalties_and_points
  question: Does completing the Driver Retraining course remove offenses or surcharges
    from your driving record?
  choices:
    A: Yes, it removes the most recent offense.
    B: Yes, it clears all surcharges.
    C: No, it does not remove offenses or surcharges.
    D: No, but it reduces your insurance premium by half.
  answer: C
  explanation: According to the manual, completing the Driver Retraining course does
    not remove offenses or surcharges from your driving record.
- id: 232
  category: license_system
  question: What is the cost of an unattested driving record ordered online?
  choices:
    A: $8
    B: $10
    C: $20
    D: $50
  answer: A
  explanation: The manual states that if you do not need the driving record to be
    attested, you can order an unattested driving record online for $8.
- id: 233
  category: penalties_and_points
  question: If you are caught using somebody else's license or ID, how long can the
    RMV suspend your driving privileges even if you are not convicted?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: The RMV can suspend your driving privileges for six months (or one
    year after a conviction) for using somebody else's license/ID, even if you are
    not convicted.
- id: 234
  category: penalties_and_points
  question: For a driver 18 years or older, what is the mandatory suspension period
    for three speeding violations within any one-year period?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: A
  explanation: For drivers 18 and older, three speeding violations within a one-year
    period results in a mandatory 30-day suspension.
- id: 235
  category: penalties_and_points
  question: Which of the following makes a driver a 'Habitual Traffic Offender' according
    to Massachusetts law?
  choices:
    A: Three surchargeable events within a two-year period
    B: Seven surchargeable events within a three-year period
    C: Three major moving violations within a five-year period
    D: Three speeding violations within a one-year period
  answer: C
  explanation: A Habitual Traffic Offender is defined as having a total of three major
    moving violations or any combination of twelve major or minor moving violations
    within a five-year period.
- id: 236
  category: penalties_and_points
  question: What is the mandatory suspension period for a Habitual Traffic Offender?
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Four years
  answer: D
  explanation: The mandatory suspension period for a Habitual Traffic Offender is
    four years.
- id: 237
  category: penalties_and_points
  question: If a Junior Operator is convicted of violating the passenger restriction
    for the first time, how long will their license be suspended?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: A first offense conviction for violating the passenger or night restriction
    results in a 60-day suspension for a Junior Operator.
- id: 238
  category: penalties_and_points
  question: What is the suspension period for a Junior Operator convicted of their
    first speeding offense?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A first speeding conviction for a Junior Operator results in a mandatory
    90-day suspension.
- id: 239
  category: penalties_and_points
  question: Which of the following is required to reinstate a Junior Operator's license
    after a first speeding conviction?
  choices:
    A: Paying a $100 reinstatement fee
    B: Taking a new learner's permit exam and a new road test
    C: Completing an alcohol education program
    D: Serving a one-year suspension
  answer: B
  explanation: Reinstatement after a first speeding conviction for a Junior Operator
    requires a new learner's permit exam, a Driver Attitudinal Retraining course,
    and a new road test.
- id: 240
  category: penalties_and_points
  question: For a driver 18 years or older, what is the penalty for accumulating seven
    surchargeable events within a three-year period?
  choices:
    A: A 30-day suspension
    B: A 60-day suspension
    C: A 90-day suspension
    D: A four-year suspension
  answer: B
  explanation: Any combination of moving violations and surchargeable crashes that
    total seven surchargeable events within a three-year period results in a 60-day
    suspension.
- id: 241
  category: penalties_and_points
  question: Under Massachusetts law, what additional suspension applies to a Junior
    Operator convicted of a first offense for Operating to Endanger or Leaving the
    Scene of a Crash?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: D
  explanation: Massachusetts General Laws chapter 90, section 24p requires a 180-day
    suspension for a first offense of Operating to Endanger, Leaving the Scene of
    a Crash, and other specific offenses for Junior Operators, in addition to any
    other penalty required by law.
- id: 242
  category: penalties_and_points
  question: How many times is a Junior Operator required to take the State Courts
    Against Road Rage (SCARR) course if mandated?
  choices:
    A: Every time they commit a moving violation
    B: Once per year
    C: Only one time
    D: Until they turn 21
  answer: C
  explanation: The manual states, 'A Junior Operator will only be required to take
    the SCARR course one time.'
- id: 243
  category: license_system
  question: Which of the following non-driving reasons can cause the RMV to suspend
    your driver's license?
  choices:
    A: Failing to pay a parking ticket
    B: Failing to pay Massachusetts income tax
    C: Dropping out of high school
    D: Failing to vote in a state election
  answer: B
  explanation: The RMV is required by law to suspend a driver's license for several
    reasons not related to driving, including if you 'Have failed to pay Massachusetts
    income tax.'
- id: 244
  category: penalties_and_points
  question: If your license is suspended for making a bad payment to the RMV, what
    additional fee must you pay to clear the bad payment?
  choices:
    A: $15
    B: $35
    C: $50
    D: $100
  answer: A
  explanation: If your license was suspended for a bad payment, you must pay the original
    fee, a license reinstatement fee, and a $15 fee to clear your bad payment.
- id: 245
  category: penalties_and_points
  question: What is the license suspension period for a conviction of motor vehicle
    homicide?
  choices:
    A: 1 to 5 years
    B: 5 to 10 years
    C: 15 years to Lifetime
    D: 10 years
  answer: C
  explanation: The criminal offenses and suspensions table lists the suspension period
    for motor vehicle homicide as '15 years–Lifetime'.
- id: 246
  category: penalties_and_points
  question: What is the fee to reinstate your license after a third conviction for
    operating under the influence of alcohol or drugs?
  choices:
    A: $500
    B: $700
    C: $1,000
    D: $1,200
  answer: D
  explanation: The fee to reinstate a license after a third conviction for operating
    under the influence of alcohol or drugs is $1,200.
- id: 247
  category: license_system
  question: If your license is suspended in another state, what document must you
    bring to the RMV to prove it has been reinstated?
  choices:
    A: A reinstatement letter or driving record that is less than 30 days old
    B: A signed letter from a judge in the other state
    C: A receipt showing you paid your out-of-state fines
    D: A new driver's license from the other state
  answer: A
  explanation: When your license is reinstated in the other state, you must bring
    either a reinstatement letter or a current driving record from that state, which
    cannot be over 30 days old.
- id: 248
  category: penalties_and_points
  question: How does the Massachusetts RMV treat traffic offenses you commit in another
    state?
  choices:
    A: They are ignored unless they involve a crash.
    B: They are treated as if they happened in Massachusetts if they are a 'like'
      offense.
    C: They only result in a fine, not a suspension.
    D: They are recorded but do not affect your Massachusetts driving record.
  answer: B
  explanation: Each U.S. state must tell the Massachusetts RMV about any traffic offenses
    you commit there. These offenses will be treated as if they happened in Massachusetts
    if they are a 'like' offense.
- id: 249
  category: license_system
  question: What must you do to reinstate your license if it has been suspended for
    two years or more?
  choices:
    A: Pay a $5,000 fine.
    B: Complete 100 hours of community service.
    C: Pass a learner's permit exam and a road test.
    D: Surrender your vehicle registration.
  answer: C
  explanation: For license suspensions of two years or more, you must also pass a
    learner's permit exam and road test to reinstate your license.
- id: 250
  category: alcohol_drugs_health
  question: How does alcohol affect your ability to drive safely?
  choices:
    A: It acts as a stimulant and improves reaction time.
    B: It is a depressant that affects vision, reaction time, coordination, and judgment.
    C: It only affects your driving if you drink more than three servings.
    D: It improves your coordination but impairs your vision.
  answer: B
  explanation: Alcohol is a drug. It is a depressant that affects your vision, reaction
    time, coordination, and judgment.
- id: 252
  category: penalties_and_points
  question: What is the maximum prison term for a first offense conviction of Operating
    Under the Influence (OUI)?
  choices:
    A: 6 months
    B: 1 year
    C: 2 1/2 years
    D: 5 years
  answer: C
  explanation: The penalties table for a first offense of Operating a Motor Vehicle
    Under the Influence of Alcohol or Drugs lists the maximum prison term as 2 1/2
    years.
- id: 253
  category: penalties_and_points
  question: What is the license suspension period for a Junior Operator convicted
    of a first offense for using a mobile electronic device (text or phone)?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: B
  explanation: A Junior Operator convicted of a first offense for the Use of a Mobile
    Electronic Device (text or phone) faces a 60-day license suspension.
- id: 254
  category: penalties_and_points
  question: Even if the operation of a vehicle is not required, what is the license
    suspension period for defacing real or personal property with graffiti?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: One year
  answer: D
  explanation: The manual states that defacing real or personal property, spraying
    paint or applying stickers or other graffiti results in a one-year suspension
    (or delay of one year in obtaining a License).
- id: 255
  category: driver_responsibility
  question: What type of violation is driving with a suspended or revoked license
    in Massachusetts?
  choices:
    A: A minor civil infraction
    B: A criminal motor vehicle violation
    C: A non-moving violation
    D: A parking violation
  answer: B
  explanation: Driving with a suspended or revoked license is a criminal motor vehicle
    violation. You may face a large fine and/or jail sentence, as well as additional
    penalties.
- id: 256
  category: penalties_and_points
  question: What is the fine range for a first offense of Operating Under the Influence
    (OUI) of alcohol or drugs?
  choices:
    A: $500–$5,000
    B: $600–$10,000
    C: $1,000–$15,000
    D: $1,500–$25,000
  answer: A
  explanation: According to the penalties chart, the fine for a first offense OUI
    is $500–$5,000.
- id: 257
  category: alcohol_drugs_health
  question: According to the manual, how much more likely is the risk of a crash when
    alcohol use is combined with marijuana use?
  choices:
    A: Two times more likely
    B: Five times more likely
    C: Ten times more likely
    D: Twelve times more likely
  answer: D
  explanation: The manual states that alcohol use combined with marijuana use makes
    the risk of a crash twelve times more likely.
- id: 258
  category: alcohol_drugs_health
  question: Which of the following drinks contains about the same amount of alcohol
    as a 12-ounce beer?
  choices:
    A: A 12-ounce glass of wine
    B: A 5-ounce glass of wine
    C: A 3-ounce serving of 80-proof liquor
    D: An 8-ounce glass of wine
  answer: B
  explanation: A 12-ounce beer, a 5-ounce glass of wine, and a 1.5-ounce serving of
    80-proof liquor all contain about the same amount of alcohol (about 1/2 ounce).
- id: 259
  category: alcohol_drugs_health
  question: What is the only effective way to get alcohol out of your body and sober
    up?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Allowing time to pass
    D: Eating a heavy meal
  answer: C
  explanation: There is no quick way to sober up. Drinking coffee, taking a cold shower,
    exercising, or eating might make you feel more alert, but only time will rid you
    of the effects of alcohol.
- id: 260
  category: penalties_and_points
  question: If you are over age 21 and fail a chemical test, how long will your license
    be suspended?
  choices:
    A: 30 days or until the conclusion of the court case, whichever is shorter
    B: 180 days
    C: One year
    D: 30 days plus an additional 180 days
  answer: A
  explanation: For drivers over age 21, the license is suspended for 30 days or until
    the conclusion of the court case, whichever is shorter, for failing a chemical
    test.
- id: 261
  category: penalties_and_points
  question: What does the Massachusetts Implied Consent Law require of every licensed
    driver?
  choices:
    A: To carry proof of insurance at all times
    B: To agree to consent to a breathalyzer or blood test in certain cases
    C: To allow police to search their vehicle without a warrant
    D: To take an alcohol education course before getting a license
  answer: B
  explanation: Massachusetts has an Implied Consent Law, which means every licensed
    driver in the state must agree to consent to a breathalyzer or blood test in certain
    cases.
- id: 262
  category: penalties_and_points
  question: 'Under the Massachusetts ''zero-tolerance'' law, drivers under 21 will
    face penalties for having a Blood Alcohol Content (BAC) as low as:'
  choices:
    A: '0.01'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: Massachusetts has a 'zero-tolerance' law for drivers under 21. Any
    driver under 21 will face penalties for having a BAC of 0.02 or higher.
- id: 263
  category: penalties_and_points
  question: How many Operating Under the Influence (OUI) offenses must you have to
    be required to install an Ignition Interlock Device for a hardship license or
    reinstatement?
  choices:
    A: One or more
    B: Two or more
    C: Three or more
    D: Four or more
  answer: B
  explanation: If you had two or more operating under the influence offenses and are
    eligible for a hardship license or for license reinstatement, you must have an
    Ignition Interlock Device.
- id: 264
  category: alcohol_drugs_health
  question: Which of the following is NOT a factor that affects your Blood Alcohol
    Content (BAC)?
  choices:
    A: Your body weight
    B: The kind of alcoholic beverage you drink
    C: The amount of food you ate before drinking
    D: The length of time you have been drinking
  answer: B
  explanation: 'Your BAC depends on body weight, amount of alcohol, food eaten before
    drinking, time spent drinking, and processing speed. The manual explicitly states:
    ''The kind of beverage you drink does not matter.'''
- id: 265
  category: penalties_and_points
  question: What is the license suspension penalty for a Fifth Offense OUI conviction?
  choices:
    A: Five years
    B: Eight years
    C: Ten years
    D: Lifetime
  answer: D
  explanation: According to the Penalties for Operating a Motor Vehicle Under the
    Influence chart, a Fifth Offense (Felony) results in a Lifetime license suspension.
- id: 266
  category: alcohol_drugs_health
  question: Approximately how much can one standard drink (e.g., a 12-ounce beer)
    raise an average person's Blood Alcohol Content (BAC)?
  choices:
    A: '0.01'
    B: '0.02'
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: Any one of the standard drinks listed (12 oz beer, 5 oz wine, 1.5 oz
    liquor) can raise an average person's BAC by 0.02.
- id: 267
  category: penalties_and_points
  question: If you are required to use an Ignition Interlock Device, how long must
    you keep using it after your license has been fully reinstated?
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Five years
  answer: C
  explanation: You must keep using the Ignition Interlock Device for two more years
    after your license has been reinstated.
- id: 268
  category: penalties_and_points
  question: What is the initial license suspension period for a driver under age 18
    who fails a chemical test, before any reductions for an alcohol education program?
  choices:
    A: 30 days
    B: 180 days
    C: 30 days plus an additional 180 days
    D: 30 days plus an additional one year
  answer: D
  explanation: For drivers under age 18, the license is suspended for 30 days, plus
    an additional one year for failing a chemical test.
- id: 269
  category: alcohol_drugs_health
  question: How does alcohol physically and mentally affect your driving abilities?
  choices:
    A: It improves your reflexes but distorts your vision
    B: It slows your reflexes and increases the time you need to react
    C: It decreases your confidence and makes you overly cautious
    D: It helps you concentrate better on the road
  answer: B
  explanation: Alcohol is a depressant. It slows your reflexes, increases the time
    you need to react, and distorts your vision and judgment. It also often makes
    you feel more confident, causing you to take chances.
- id: 270
  category: driver_testing
  question: If you are required to use an Ignition Interlock Device, what must your
    vehicle have in order to schedule a road test online?
  choices:
    A: A center console brake and a seat for the sponsor
    B: A backup camera and dual controls
    C: A manual transmission and a passenger side brake
    D: A certified driving instructor as a sponsor
  answer: A
  explanation: To schedule a road test online with an Ignition Interlock Device, you
    must provide a vehicle that has the device installed, has a center console brake,
    and has a seat for the sponsor.
- id: 271
  category: penalties_and_points
  question: If you are under 21 years old and you buy, or try to buy, alcohol, your
    license will be suspended for how long?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: One year
  answer: C
  explanation: According to the manual, if you are under 21 and you buy, or try to
    buy, alcohol, your license will be suspended for 180 days.
- id: 272
  category: alcohol_drugs_health
  question: Under the Open Container Law, what is the fine if you are convicted of
    having an open alcoholic drink inside your vehicle?
  choices:
    A: $50 to $100
    B: $100 to $500
    C: $500 to $1,000
    D: $1,000 to $5,000
  answer: B
  explanation: If you are convicted of having an open alcoholic drink inside your
    vehicle, you will be fined $100 to $500.
- id: 273
  category: penalties_and_points
  question: If you use a false license or ID, the RMV can suspend your license for
    up to how long even without a conviction?
  choices:
    A: 30 days
    B: 60 days
    C: Six months
    D: One year
  answer: C
  explanation: M.G.L.c.90,§22(e) allows the RMV to suspend your license or right to
    operate in Massachusetts for up to six months for using a false ID. A conviction
    is not required.
- id: 274
  category: alcohol_drugs_health
  question: How does smoking or eating marijuana affect your driving abilities?
  choices:
    A: It improves your reaction time to sudden events.
    B: It lowers your ability to handle a quick series of tasks and causes a bad loss
      of night vision.
    C: It makes you feel more awake and aware for a short time.
    D: It has no effect on driving because it has been decriminalized.
  answer: B
  explanation: Marijuana lowers your ability to handle a quick series of tasks and
    makes it difficult to respond to unexpected events. It also causes a bad loss
    of night vision.
- id: 275
  category: alcohol_drugs_health
  question: What is a dangerous side effect of using stimulants like diet pills or
    pep pills before driving?
  choices:
    A: They cause an immediate loss of hearing.
    B: They make you feel unaware of where you are and that you do not care.
    C: The initial alertness is always followed by fatigue, nervousness, dizziness,
      and lack of concentration.
    D: They permanently improve your night vision.
  answer: C
  explanation: Stimulants make you feel more awake and aware for a short time, but
    this is always followed by fatigue, nervousness, dizziness, and a lack of concentration.
- id: 276
  category: license_system
  question: Which of the following is a reason the RMV will refuse to renew your driver's
    license?
  choices:
    A: Unpaid fines for parking violations
    B: A single speeding ticket from three years ago
    C: Failure to wash your vehicle regularly
    D: Having a vehicle older than 15 years
  answer: A
  explanation: The RMV will refuse to renew your license if you have unpaid fines
    for parking violations, among other unpaid fines, taxes, or outstanding warrants.
- id: 277
  category: safe_driving_rules
  question: At a vehicle speed of 40 mph, what percentage of pedestrians are seriously
    injured or killed in a crash?
  choices:
    A: 13%
    B: 40%
    C: 73%
    D: 95%
  answer: C
  explanation: The manual states that at a speed of 40 mph, 73% of pedestrians are
    seriously injured or killed in a crash.
- id: 278
  category: safe_driving_rules
  question: What does the fundamental speed law require you to do?
  choices:
    A: Always drive at the exact posted speed limit.
    B: Never travel so fast that it is not safe, regardless of the posted speed limit.
    C: Drive 10 mph below the speed limit at all times.
    D: Match the speed of the vehicles around you, even if they are speeding.
  answer: B
  explanation: The fundamental speed law states you must never travel so fast that
    it is not safe. You must lower your speed if there are poor driving conditions,
    even if the posted limit is higher.
- id: 279
  category: safe_driving_rules
  question: What is the minimum speed limit in the Boston Harbor tunnels (Callahan,
    Sumner, and Ted Williams)?
  choices:
    A: 15 mph
    B: 20 mph
    C: 30 mph
    D: 40 mph
  answer: B
  explanation: There is a minimum speed of 20 mph in the Boston Harbor tunnels (Callahan,
    Sumner, and Ted Williams).
- id: 280
  category: safe_driving_rules
  question: Unless posted otherwise, what is the speed limit in a school zone?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Unless posted otherwise, your speed would not be reasonable and proper
    if you drive over 20 mph in a school zone.
- id: 281
  category: safe_driving_rules
  question: How is a "thickly settled district" defined in Massachusetts?
  choices:
    A: An area where buildings are fewer than 200 feet apart for a distance of 1/4
      mile or more.
    B: Any road that has a sidewalk.
    C: An area where buildings are fewer than 500 feet apart for a distance of 1 mile.
    D: A zone within 1,000 feet of a school or hospital.
  answer: A
  explanation: A "thickly settled district" is an area where buildings are fewer than
    200 feet apart for a distance of 1/4 mile or more.
- id: 282
  category: alcohol_drugs_health
  question: Can you get an Operating Under the Influence (OUI) charge for driving
    while taking prescription drugs?
  choices:
    A: No, prescription drugs are legal and exempt from OUI laws.
    B: Yes, it is illegal to operate a motor vehicle while impaired by any substance,
      including prescription drugs.
    C: Only if the prescription drug is mixed with alcohol.
    D: Only if the prescription is not in your name.
  answer: B
  explanation: You can be considered OUI with prescription drugs. It is illegal to
    operate a motor vehicle while impaired by any substance.
- id: 283
  category: license_system
  question: If you have an outstanding court warrant, what must you present to the
    RMV before renewing your license?
  choices:
    A: A letter from your attorney
    B: A recall notice from the court
    C: A receipt showing you paid a fine
    D: A new passport or birth certificate
  answer: B
  explanation: For an outstanding court warrant, a recall notice from the court is
    required before renewing your license. No other documents will be accepted by
    the RMV.
- id: 284
  category: safe_driving_rules
  question: What is the speed limit on roads near schools in Massachusetts?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: The manual states that the speed limit on roads near schools is 20
    mph.
- id: 285
  category: safe_driving_rules
  question: How is a 'thickly settled district' defined in the driver's manual?
  choices:
    A: An area where buildings are fewer than 200 feet apart for a distance of 1/4
      mile or more.
    B: An area where buildings are fewer than 100 feet apart for a distance of 1/2
      mile or more.
    C: Any residential zone with a posted speed limit of 30 mph.
    D: A business district with more than 500 residents per square mile.
  answer: A
  explanation: A 'thickly settled district' is an area where buildings are fewer than
    200 feet apart for a distance of 1/4 mile or more.
- id: 286
  category: safe_driving_rules
  question: If you drive 40 mph in a heavy rainstorm on a highway with a speed limit
    of 50 mph, what could happen?
  choices:
    A: You are driving safely within the legal limit and cannot be penalized.
    B: You can get a ticket for driving too fast.
    C: You must turn on your hazard lights to maintain that speed.
    D: You are required to pull over until the rain stops.
  answer: B
  explanation: According to the manual, if you drive 40 mph in a heavy rainstorm on
    a highway with a speed limit of 50 mph, you can get a ticket for driving too fast.
- id: 287
  category: signs_and_signals
  question: Under what circumstances can you make a left turn on a steady red light?
  choices:
    A: Whenever there is no oncoming traffic.
    B: Only between the hours of midnight and 6 AM.
    C: When driving on a one-way street and turning left onto another one-way street.
    D: You may never make a left turn on a red light in Massachusetts.
  answer: C
  explanation: You can turn left on a red light when driving on a one-way street and
    turning left onto another one-way street, after stopping and yielding to pedestrians
    and vehicles.
- id: 288
  category: signs_and_signals
  question: What does a flashing red circle traffic signal mean?
  choices:
    A: The traffic signal is broken and you should proceed with caution.
    B: It means the same as a STOP sign; you must come to a complete stop.
    C: Yield to oncoming traffic but you do not need to stop.
    D: Stop only if pedestrians are in the crosswalk.
  answer: B
  explanation: A flashing red circle means the same as a STOP sign. You must come
    to a complete stop, obey right-of-way laws, and proceed when safe.
- id: 289
  category: signs_and_signals
  question: What action should you take when approaching a steady yellow circle traffic
    signal?
  choices:
    A: Speed up to clear the intersection before it turns red.
    B: Stop if it is safe to do so, as the signal is changing from green to red.
    C: Proceed with caution without reducing your speed.
    D: Treat it as a yield sign and merge with traffic.
  answer: B
  explanation: A steady yellow circle means the traffic signal is changing from green
    to red. You must stop if it is safe.
- id: 290
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate?
  choices:
    A: You have the right-of-way to turn and all other traffic must yield.
    B: You cannot make a turn in the direction of the arrow.
    C: You may turn in the direction of the arrow when there is an adequate gap in
      oncoming traffic.
    D: The lane is closed ahead and you must merge right.
  answer: C
  explanation: A flashing yellow arrow allows you to turn left or right in the direction
    of the arrow when oncoming traffic has a green light but there is a break in traffic.
    You must ensure there is an adequate gap.
- id: 291
  category: signs_and_signals
  question: What should you do if you approach an intersection where the traffic signals
    are blacked out and not functioning?
  choices:
    A: Proceed through the intersection at your normal speed.
    B: Yield to the vehicle on your left.
    C: Wait at the intersection until a police officer arrives.
    D: Proceed as though there is a stop sign in all directions.
  answer: D
  explanation: If signals are blacked out and not functioning, be cautious and proceed
    as though there is a stop sign in all directions.
- id: 292
  category: sharing_the_road
  question: Which of the following is a rule regarding pedestrians and crosswalks?
  choices:
    A: You may pass a vehicle stopped for a pedestrian if the left lane is clear.
    B: You must never pass a vehicle that is stopped or slowing for a pedestrian.
    C: Pedestrians must yield to vehicles if the crosswalk has no signal.
    D: You can block a crosswalk if you are waiting to make a right turn.
  answer: B
  explanation: 'Under ''Laws for Drivers'', the manual explicitly states: ''Never
    pass a vehicle that is stopped or slowing for a pedestrian.'''
- id: 293
  category: signs_and_signals
  question: What does a brown traffic sign indicate?
  choices:
    A: Motorist services such as gas or food.
    B: Construction or maintenance warning.
    C: Recreational, historic, or scenic site.
    D: Incident management.
  answer: C
  explanation: According to the manual's section on sign colors, a brown sign indicates
    a recreational, historic, or scenic site.
- id: 294
  category: signs_and_signals
  question: Which color is used for incident management signs?
  choices:
    A: Orange
    B: Fluorescent Pink
    C: Purple
    D: Fluorescent Yellow-Green
  answer: B
  explanation: The manual specifies that Fluorescent Pink is used for incident management
    signs.
- id: 295
  category: signs_and_signals
  question: When approaching a Pedestrian Hybrid Beacon (PHB), what must you do when
    the top two red lights are solid?
  choices:
    A: Proceed with caution.
    B: Prepare to stop.
    C: Stop for pedestrians.
    D: Stop and proceed with caution if clear.
  answer: C
  explanation: When the top two red lights are solid on a Pedestrian Hybrid Beacon,
    you must stop for pedestrians.
- id: 296
  category: sharing_the_road
  question: When turning into a driveway or parking lot, who has the right-of-way?
  choices:
    A: The turning vehicle has the right-of-way over pedestrians.
    B: You must yield to pedestrians when turning into a driveway or parking lot.
    C: Pedestrians must wait for all turning vehicles to pass.
    D: The vehicle exiting the parking lot has the right-of-way.
  answer: B
  explanation: 'Under ''Laws for Drivers,'' the manual states: ''You must yield to
    pedestrians when turning into a driveway or parking lot.'''
- id: 297
  category: signs_and_signals
  question: What is the proper procedure when approaching a STOP sign?
  choices:
    A: Slow down to 5 mph and proceed if the intersection is clear.
    B: Come to a complete stop before any crosswalk or stop line painted on the pavement.
    C: Stop only if there is cross traffic approaching.
    D: Honk your horn to warn other drivers before rolling through.
  answer: B
  explanation: When approaching a stop sign, you must stop before any crosswalk or
    stop line painted on the pavement. Come to a complete stop; just slowing down
    is not enough.
- id: 298
  category: signs_and_signals
  question: What must a driver do when a Rectangular Rapid Flashing Beacon is activated
    and its amber lights are flashing?
  choices:
    A: Speed up to clear the crosswalk quickly.
    B: Stop for pedestrians.
    C: Move to the left lane to avoid the crosswalk.
    D: Treat it as a yield sign and proceed if no pedestrians are visible.
  answer: B
  explanation: When a Rectangular Rapid Flashing Beacon is activated, amber lights
    flash in an irregular pattern, and you must stop for pedestrians.
- id: 299
  category: signs_and_signals
  question: At an intersection controlled by a 4-WAY or ALL WAY STOP sign, which vehicle
    has the right of way?
  choices:
    A: The vehicle on the right
    B: The first vehicle to arrive at the intersection
    C: The vehicle traveling straight
    D: The largest vehicle
  answer: B
  explanation: According to the manual, at a 4-WAY or ALL WAY stop, the first vehicle
    in the intersection or four-way stop has the right of way.
- id: 300
  category: signs_and_signals
  question: What type of information do blue guide signs provide to motorists?
  choices:
    A: Highway directions and interchanges
    B: Public recreational areas and state parks
    C: Motorist services such as gas, food, and lodging
    D: Traffic laws and regulations
  answer: C
  explanation: The manual states that blue signs list motorist services, like gas,
    food, and lodging.
- id: 301
  category: signs_and_signals
  question: Which color guide sign directs drivers to public recreational areas, state
    and national parks, and points of interest?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: Yellow
  answer: C
  explanation: Brown signs direct you to public recreational areas, state and national
    parks, points of interest, and scenic sites.
- id: 302
  category: signs_and_signals
  question: What does a regulatory sign featuring a red circle with a diagonal slash
    indicate?
  choices:
    A: A hazard is ahead
    B: Something is prohibited
    C: You must yield the right-of-way
    D: A detour is required
  answer: B
  explanation: Regulatory signs that use a red circle with a diagonal slash mean that
    something is prohibited.
- id: 303
  category: safe_driving_rules
  question: If a railroad crossing's red lights begin to flash, what is the minimum
    distance you must stop before the light post or gate?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: If the lights begin to flash at a railroad crossing, you must stop
    at least 15 feet before the light post or gate.
- id: 304
  category: safe_driving_rules
  question: When driving through a work zone, what should you do if a traffic officer's
    directions conflict with existing traffic signs or signals?
  choices:
    A: Follow the traffic signs and signals
    B: Obey the traffic officer's directions
    C: Stop and wait for the signs to change
    D: Pull over and call 511
  answer: B
  explanation: You must always obey directions of a traffic officer, even when they
    overrule signs, signals, or pavement markings.
- id: 305
  category: defensive_driving
  question: What is the FIRST thing you must do when approaching a work zone?
  choices:
    A: Change lanes immediately
    B: Turn on your hazard lights
    C: Slow down and look for guidance
    D: Stop and wait for a civil flagger
  answer: C
  explanation: The manual states that when approaching a work zone, the FIRST thing
    you must do is SLOW DOWN and look for guidance on how to safely travel through
    the area.
- id: 306
  category: signs_and_signals
  question: What does a double solid white line separating two lanes of traffic indicate?
  choices:
    A: Traffic is moving in opposite directions and passing is allowed
    B: Traffic is moving in the same direction and crossing the line is not allowed
    C: Traffic is moving in opposite directions and crossing is not allowed
    D: Traffic is moving in the same direction and you may cross to change lanes
  answer: B
  explanation: A double solid white line separates two lanes of traffic going in the
    same direction. Crossing a double solid white line is not allowed.
- id: 307
  category: safe_driving_rules
  question: Under what circumstances should you cross a single solid white line separating
    lanes of traffic traveling in the same direction?
  choices:
    A: Whenever you need to pass a slower vehicle
    B: Only when you need to avoid danger
    C: When you are preparing to make a left turn
    D: You may never cross a solid white line under any circumstances
  answer: B
  explanation: You can go in the same direction on both sides of a solid white line,
    but you should not cross it unless you need to avoid danger.
- id: 308
  category: safe_driving_rules
  question: When are you permitted to cross two solid yellow lines?
  choices:
    A: When passing a slow-moving vehicle
    B: When turning left and it is safe to do so
    C: When traveling on a one-way street
    D: Never
  answer: B
  explanation: Two solid yellow lines prohibit vehicles from crossing them to pass
    another vehicle. You may not cross these lines unless turning left when it is
    safe to do so.
- id: 309
  category: signs_and_signals
  question: What does a white diamond symbol painted on the roadway surface indicate?
  choices:
    A: A railroad crossing is ahead
    B: A shared lane for bicycles and motor vehicles
    C: A special lane restriction, such as 'high occupancy vehicle (HOV) only'
    D: A pedestrian crosswalk
  answer: C
  explanation: A white diamond symbol means there is a special lane restriction, like
    'high occupancy vehicle (HOV) only' or 'bus only.'
- id: 310
  category: sharing_the_road
  question: What is the purpose of Shared Lane Markings (Sharrows) on a roadway?
  choices:
    A: To indicate a lane exclusively reserved for bicycles
    B: To warn drivers of an upcoming school zone
    C: To help bicyclists position themselves in a shared lane and avoid parked vehicle
      doors
    D: To mark the boundary of a pedestrian crosswalk
  answer: C
  explanation: Shared Lane Markings (Sharrows) help bicyclists position themselves
    in the right location and direction in a shared lane, helping them avoid being
    hit by the open door of a parked vehicle.
- id: 311
  category: signs_and_signals
  question: What colors are typically used for warning signs that alert drivers to
    hazards or changes in conditions ahead?
  choices:
    A: Red and white
    B: Blue and white
    C: Green and white
    D: Yellow and fluorescent yellow-green
  answer: D
  explanation: Yellow and fluorescent yellow-green warning signs warn you of hazards
    or changes in conditions ahead.
- id: 312
  category: signs_and_signals
  question: At a railroad crossing, how can you tell if there is more than one track
    crossing the road?
  choices:
    A: The crossbuck sign will be painted yellow
    B: The number of tracks is posted below the white crossbuck sign
    C: There will be two separate stop lines painted on the pavement
    D: The warning bell will ring at a faster pace
  answer: B
  explanation: If more than one track crosses a road, the number of tracks is posted
    below the crossbuck.
- id: 313
  category: driver_responsibility
  question: What is the purpose of the Highway Division's 511 phone service?
  choices:
    A: To request emergency medical assistance
    B: To report a stolen vehicle
    C: To get up-to-date information about traffic, weather, and construction
    D: To schedule a driving test appointment
  answer: C
  explanation: You can use the 511 phone service to get up-to-date information about
    traffic and weather conditions and construction projects, and to report problems
    on the road.
- id: 314
  category: sharing_the_road
  question: When is a motor vehicle permitted to drive in a bicycle lane?
  choices:
    A: Whenever the adjacent travel lane is blocked
    B: Only when turning on or off the road
    C: When passing a slower vehicle
    D: Motor vehicles are never allowed in a bicycle lane
  answer: B
  explanation: According to the manual, motor vehicles may only drive in bicycle lanes
    when turning on or off the road.
- id: 315
  category: sharing_the_road
  question: What does an advisory bicycle lane with dashed lines indicate?
  choices:
    A: Motor vehicles are strictly prohibited from entering the lane.
    B: Bicyclists must yield to motor vehicles before entering the lane.
    C: Motor vehicles may use the lane space when necessary, but must yield to bicyclists
      first.
    D: The lane is reserved exclusively for high-occupancy vehicles.
  answer: C
  explanation: Advisory bicycle lanes are dashed to indicate that motor vehicles may
    use the lane space when necessary, but they must always yield to bicyclists first.
- id: 316
  category: sharing_the_road
  question: What should you do if you are stopped at a red light where there is green
    pavement?
  choices:
    A: Stop directly on the green pavement to trigger the traffic sensor.
    B: You should not stop on the green pavement.
    C: Proceed through the red light if no bicyclists are present.
    D: Pull over to the right side of the green pavement.
  answer: B
  explanation: The manual states that at a red light, you should not stop on green
    pavement, which is used in areas where there could be road sharing conflicts.
- id: 317
  category: signs_and_signals
  question: What does a yield line painted across an intersection look like?
  choices:
    A: A pair of solid white lines
    B: A series of triangles painted next to each other
    C: Diagonal yellow stripes
    D: A single solid red line
  answer: B
  explanation: An intersection with a yield sign may have a YIELD line painted across
    it, which looks like a series of triangles painted next to each other.
- id: 318
  category: safe_driving_rules
  question: Under what condition may you drive over or park on a channelizing island?
  choices:
    A: When you need to pass a slow-moving vehicle
    B: When your vehicle breaks down
    C: Only when directed to do so by a police officer
    D: When the adjacent lane is closed for construction
  answer: C
  explanation: You cannot drive over or park a motor vehicle upon any channelizing
    island, unless directed to do so by a police officer.
- id: 319
  category: safe_driving_rules
  question: As a general rule, when are you allowed to use a highway breakdown lane
    for travel or passing?
  choices:
    A: Whenever traffic is backed up
    B: During specific posted times on some highways
    C: When you are driving a high-occupancy vehicle
    D: You are never allowed to use a breakdown lane for travel
  answer: B
  explanation: As a general rule, do not use a highway breakdown lane for travel or
    passing. On some highways, however, you may use the breakdown lane for travel
    during specific times.
- id: 320
  category: safe_driving_rules
  question: Which of the following is a situation where you are required to use your
    turn signals?
  choices:
    A: Pulling away from a curb
    B: Driving straight through an intersection
    C: Stopping at a stop sign
    D: Yielding to a pedestrian in a crosswalk
  answer: A
  explanation: You must signal in certain situations, including changing lanes, turning,
    pulling away from a curb, pulling over, and entering or exiting an expressway.
- id: 321
  category: safe_driving_rules
  question: When is it legal to change lanes in the middle of an intersection?
  choices:
    A: When there is no oncoming traffic
    B: When you are preparing to make a left turn
    C: When the lane you are in is blocked
    D: It is never legal to change lanes in the middle of an intersection
  answer: D
  explanation: Never change lanes in the middle of an intersection. It is illegal
    and dangerous.
- id: 322
  category: defensive_driving
  question: What should you do if you come to a curve in the road and cannot see ahead?
  choices:
    A: Move to the center of the road and honk your horn
    B: Keep to the right and slow down
    C: Accelerate to get through the blind spot quickly
    D: Turn on your high beam headlights
  answer: B
  explanation: If you come to a curve in the road and cannot see ahead, keep to the
    right and slow down.
- id: 323
  category: sharing_the_road
  question: Which of the following is a special rule for motorcycles regarding lane
    usage?
  choices:
    A: Motorcycles may ride up to three abreast in a single lane.
    B: Motorcycles are encouraged to ride along pavement lines in heavy traffic.
    C: Motorcycles must not ride along pavement lines, between lanes of traffic.
    D: Motorcycles must always use the breakdown lane on highways.
  answer: C
  explanation: Special rules for motorcycles state that riders must not ride along
    pavement lines, between lanes of traffic, and should ride no more than two abreast.
- id: 324
  category: safe_driving_rules
  question: What is the proper action to take if you miss your exit on the highway?
  choices:
    A: Stop and carefully back up on the shoulder
    B: Make a U-turn at the next median crossing
    C: Get off the highway at the next exit
    D: Slow down and reverse in the breakdown lane
  answer: C
  explanation: If you miss your exit, do not stop. Never back up on the highway. Get
    off the highway at the next exit.
- id: 325
  category: safe_driving_rules
  question: How far in advance must you signal your exit before reaching a highway
    exit ramp?
  choices:
    A: At least 100 feet
    B: At least 250 feet
    C: At least 500 feet
    D: At least 1000 feet
  answer: C
  explanation: Be sure to signal your exit at least 500 feet before you reach the
    exit ramp.
- id: 326
  category: safe_driving_rules
  question: On an expressway with three or more lanes in your direction, which lane
    should you use for passing?
  choices:
    A: The far right lane
    B: The middle lane
    C: The far left lane
    D: The breakdown lane
  answer: C
  explanation: On an expressway with three or more lanes in your direction, use the
    far right lane for slower driving, the middle lane for faster driving, and the
    far left lane for passing.
- id: 327
  category: defensive_driving
  question: To avoid "highway hypnosis" on a long trip, how often should you stop
    and stretch?
  choices:
    A: Every hour or every 50 miles
    B: Every two hours or every 100 miles
    C: Every three hours or every 150 miles
    D: Every four hours or every 200 miles
  answer: B
  explanation: If you plan to drive far, stop and stretch every two hours or every
    100 miles to avoid highway hypnosis and fatigue.
- id: 328
  category: safe_driving_rules
  question: What are the three steps you must remember when changing lanes?
  choices:
    A: (1) look, (2) signal, (3) move
    B: (1) signal, (2) look, (3) move
    C: (1) brake, (2) signal, (3) move
    D: (1) accelerate, (2) look, (3) move
  answer: A
  explanation: 'When changing lanes, remember these three steps: (1) look, (2) signal,
    (3) move.'
- id: 329
  category: safe_driving_rules
  question: If you plan to drive far, how often should you stop and stretch?
  choices:
    A: Every hour or 50 miles
    B: Every two hours or 100 miles
    C: Every three hours or 150 miles
    D: Every four hours or 200 miles
  answer: B
  explanation: The manual advises that if you plan to drive far, you should stop and
    stretch every two hours or every 100 miles.
- id: 330
  category: safe_driving_rules
  question: What is the safest course of action if your vehicle breaks down on the
    highway?
  choices:
    A: Stand near the travel lane to wave for help
    B: Move to the breakdown lane and stand outside your vehicle
    C: Move to the breakdown lane or shoulder and stay in your vehicle
    D: Leave your vehicle in the travel lane and walk to the nearest exit
  answer: C
  explanation: If your vehicle breaks down, move it to the breakdown lane or shoulder
    as far from the travel lane as you can, and stay in your vehicle. Standing near
    the travel lane is dangerous.
- id: 331
  category: safe_driving_rules
  question: What information can you obtain by dialing the Highway Division's 511
    phone service?
  choices:
    A: Emergency medical dispatch services
    B: Up-to-date information about traffic, weather conditions, and construction
      projects
    C: Direct connection to the local police department
    D: Automated driver's license renewal instructions
  answer: B
  explanation: The Highway Division has a 511 phone service that provides up-to-date
    information about traffic, weather conditions, and construction projects.
- id: 332
  category: safe_driving_rules
  question: How far in advance must you signal your intention to turn while driving
    on a highway?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 250 feet
    D: At least 500 feet
  answer: D
  explanation: The manual states that you must signal your turn at least 100 feet
    before making a turn, but on a highway, you must signal at least 500 feet before
    a turn.
- id: 333
  category: safe_driving_rules
  question: You should not make a U-turn at the crest of a hill or near a curve where
    you cannot be seen by other drivers from what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Do not make a U-turn at the crest of a hill, near a curve, or anyplace
    where you or other drivers cannot see 500 feet away.
- id: 334
  category: safe_driving_rules
  question: Which of the following is true regarding a center lane marked as a common
    left-turn lane?
  choices:
    A: You may use it to pass slower vehicles
    B: You may travel in it for up to 200 feet before turning
    C: You may not travel in a center turning lane
    D: It is reserved exclusively for emergency vehicles
  answer: C
  explanation: 'On some two-way roads, a center lane may be marked as a common left-turn
    lane. The manual explicitly states: ''You may not travel in a center turning lane.'''
- id: 335
  category: safe_driving_rules
  question: When preparing to make a three-point turn, how large of a gap in traffic
    should you wait for before completing the turn?
  choices:
    A: 5-10 seconds
    B: 10-15 seconds
    C: 20-30 seconds
    D: 40-50 seconds
  answer: C
  explanation: When performing a three-point turn, you must check for traffic and
    pedestrians and wait until you have a 20-30 second gap to complete the turn.
- id: 336
  category: driver_responsibility
  question: Which of the following best describes the concept of 'right-of-way' rules?
  choices:
    A: They give you the absolute legal right to proceed first
    B: They are based on safety and courtesy, and right-of-way is something you give,
      not take
    C: They only apply at intersections controlled by traffic lights
    D: They allow you to force other drivers to yield to your vehicle
  answer: B
  explanation: 'Right-of-way rules are based on safety and courtesy. They do not give
    you any ''rights.'' The manual states: ''Remember, the right-of-way is something
    you give, not take.'''
- id: 337
  category: safe_driving_rules
  question: When approaching an intersection not controlled by signs or signals, to
    whom must you yield the right-of-way?
  choices:
    A: Any vehicle coming from your left
    B: Any vehicle that has entered the intersection from your right or is coming
      from your right
    C: Only commercial vehicles and transit buses
    D: Vehicles that are turning left across your path
  answer: B
  explanation: At an uncontrolled intersection, you must yield the right-of-way to
    any vehicle that has entered the intersection from your right or is coming from
    your right.
- id: 338
  category: safe_driving_rules
  question: If you and another vehicle arrive at a four-way stop at the exact same
    time, who has the right-of-way?
  choices:
    A: The vehicle directly to your right
    B: The vehicle directly to your left
    C: The vehicle that is traveling straight
    D: The vehicle that is turning right
  answer: A
  explanation: At a four-way stop, if vehicles stop at the same time, you must yield
    the right-of-way to a vehicle directly to your right.
- id: 339
  category: safe_driving_rules
  question: What must you do when entering a paved thoroughfare from a private road,
    driveway, or unpaved road?
  choices:
    A: Slow down and merge seamlessly into traffic
    B: Sound your horn and proceed without stopping
    C: Stop and give the right-of-way to pedestrians, bicyclists, or vehicles on the
      road you are entering
    D: Yield only if there is a posted yield sign
  answer: C
  explanation: When entering a paved thoroughfare from a private road, a driveway,
    or an unpaved road, you must stop and then give the right-of-way to pedestrians,
    bicyclists, or vehicles on the road you are entering.
- id: 340
  category: sharing_the_road
  question: If you are turning at an intersection, how should you handle a bicyclist
    going straight through the same intersection?
  choices:
    A: Speed up to cut in front of the bicyclist
    B: Honk your horn to warn the bicyclist to stop
    C: Yield to the bicyclist going straight through
    D: Force the bicyclist to turn with you
  answer: C
  explanation: When driving through an intersection, be especially alert for bicyclists.
    If you're turning, you must yield to bicyclists going straight through an intersection
    and never cut in front of them.
- id: 341
  category: safe_driving_rules
  question: When driving through an intersection, when are you legally allowed to
    block the intersection or crosswalk?
  choices:
    A: When traffic is backed up and you have a green light
    B: When you are making a left turn
    C: When you are driving a commercial vehicle
    D: It is never legal to block an intersection or crosswalk
  answer: D
  explanation: It is illegal to block an intersection with your vehicle. You may only
    enter an intersection or drive across a crosswalk if there is enough room for
    you to drive through safely.
- id: 342
  category: safe_driving_rules
  question: In what direction does traffic travel in a rotary?
  choices:
    A: Clockwise
    B: Counter-clockwise
    C: In a figure-eight pattern
    D: Straight through without turning
  answer: B
  explanation: According to the manual, traffic travels counter-clockwise in a rotary.
- id: 343
  category: safe_driving_rules
  question: What should you do if you miss your exit while driving in a rotary?
  choices:
    A: Stop immediately and wait for traffic to clear.
    B: Put your vehicle in reverse to back up to the exit.
    C: Go around again and position your vehicle to properly and safely exit.
    D: Make a sharp right turn from the inner lane immediately.
  answer: C
  explanation: 'The manual states: ''If you miss your exit, don’t get upset. Check
    the traffic around you. If it is safe to do so, go around again and position your
    vehicle to properly and safely exit the rotary. Do not stop in the rotary.'''
- id: 344
  category: safe_driving_rules
  question: What is the maximum speed you should travel when driving in a roundabout?
  choices:
    A: 15 miles per hour
    B: 25 miles per hour
    C: 35 miles per hour
    D: 40 miles per hour
  answer: B
  explanation: Roundabouts are used on busy streets and their small size requires
    vehicles to reduce speed to 25 miles per hour or less.
- id: 345
  category: defensive_driving
  question: Why is it dangerous to wave another driver in through stopped traffic?
  choices:
    A: It is illegal to use hand gestures while driving.
    B: It can cause a 'courtesy crash' because oncoming traffic still has the right-of-way.
    C: It distracts pedestrians in the crosswalk.
    D: It automatically transfers the right-of-way to the turning vehicle.
  answer: B
  explanation: Waving people in through stopped traffic creates a dangerous situation
    and can easily result in a crash. Oncoming traffic has the right-of-way, regardless
    of whether someone is waving at you.
- id: 346
  category: safe_driving_rules
  question: Which of the following areas is legally permitted for passing another
    vehicle?
  choices:
    A: The breakdown lane
    B: The shoulder of the road
    C: The sidewalk
    D: None of the above
  answer: D
  explanation: 'The manual explicitly states: ''Never use a breakdown lane, the shoulder
    of a road, or a sidewalk for passing another vehicle.'''
- id: 347
  category: safe_driving_rules
  question: When crossing a broken yellow line to pass another vehicle, how far ahead
    must you be able to see clearly?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: D
  explanation: If you are crossing a broken yellow line to pass, you must be able
    to see clearly at least 400 feet in front of you.
- id: 348
  category: safe_driving_rules
  question: When passing on the left, you must return to the right lane before an
    oncoming vehicle comes within how many feet of you?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 400 feet
  answer: B
  explanation: You must return to the right lane before any oncoming vehicle comes
    within 200 feet of you.
- id: 349
  category: safe_driving_rules
  question: Under which of the following circumstances are you permitted to pass a
    vehicle on the right?
  choices:
    A: When the vehicle ahead is driving below the speed limit.
    B: When the vehicle ahead is making, or is about to make, a left turn.
    C: When you are driving on a two-way street with a single lane in each direction.
    D: When the vehicle ahead is stopped at a crosswalk.
  answer: B
  explanation: Passing on the right is allowed when the vehicle you are passing is
    making, or is about to make, a left turn, on a one-way street, or on a road where
    traffic moves in one direction.
- id: 350
  category: sharing_the_road
  question: What must you do if you are being passed by another vehicle?
  choices:
    A: Speed up to maintain your position.
    B: Move to the left lane.
    C: Slow down and stay to the right.
    D: Sound your horn to warn the passing driver.
  answer: C
  explanation: If you are being passed by another vehicle, you must slow down and
    stay to the right. Allow the other driver to pass safely. Do not speed up.
- id: 351
  category: safe_driving_rules
  question: What does the 'move-over law' require you to do when approaching a stationary
    emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop immediately and wait for the vehicle to leave.
    B: Maintain your speed and stay in your current lane.
    C: Yield the right-of-way by safely moving over to a lane that is not next to
      the emergency vehicle.
    D: Honk your horn to acknowledge the emergency vehicle.
  answer: C
  explanation: The 'move-over law' requires that you proceed with caution, reduce
    your speed, and if on a highway with at least four lanes, safely move over to
    a lane that is not next to the lane the emergency vehicle is occupying.
- id: 352
  category: defensive_driving
  question: What is the recommended action to take when confronted by an aggressive
    driver?
  choices:
    A: Make eye contact to show you are not intimidated.
    B: Challenge the driver by matching their speed.
    C: Attempt to get out of their way and avoid eye contact.
    D: Follow them to report their license plate number.
  answer: C
  explanation: When confronted by an aggressive driver, you should attempt to get
    out of their way, do not challenge that person, avoid eye contact, and ignore
    rude gestures.
- id: 353
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus with its flashing red
    lights and stop sign extended?
  choices:
    A: When you are traveling in the opposite direction on a two-lane road.
    B: When the school bus is stopped on the other side of a divided highway with
      a barrier.
    C: When you are running late for work.
    D: When there are no children visible around the bus.
  answer: B
  explanation: The only exception to the school bus stopping law is if a school bus
    has stopped on the other side of a divided highway with a barrier between travel
    directions.
- id: 354
  category: penalties_and_points
  question: What is the penalty for a first violation of failing to stop for a school
    bus with flashing red lights?
  choices:
    A: A $100 fine and a warning.
    B: A license suspension and a $250 fine.
    C: A $500 fine and vehicle impoundment.
    D: Mandatory community service.
  answer: B
  explanation: A first violation of the law requiring you to stop for a school bus
    with flashing lights can cause a license suspension and a $250 fine.
- id: 355
  category: sharing_the_road
  question: How can you tell if you are tailgating a large truck?
  choices:
    A: You are within 100 feet of the truck.
    B: You cannot see the truck's rearview mirrors.
    C: You can read the truck's license plate.
    D: You are driving slower than the truck.
  answer: B
  explanation: 'The manual states: ''If you cannot see a truck’s rearview mirrors,
    you are tailgating.'''
- id: 356
  category: safe_driving_rules
  question: Which lane should you use to enter a multiple-lane rotary if you intend
    to make a three-quarter-turn or a U-turn?
  choices:
    A: The right lane
    B: The left lane
    C: The breakdown lane
    D: Any lane is acceptable
  answer: B
  explanation: For a three-quarter-turn, or a U-turn, you must enter the rotary from
    the left lane, travel through the middle or inner lane, and exit onto the right
    lane.
- id: 357
  category: defensive_driving
  question: According to studies, how much distance might a fully loaded tractor-trailer
    need to stop compared to a passenger vehicle?
  choices:
    A: The same distance
    B: One and a half times as far
    C: Twice as far
    D: Three times as far
  answer: C
  explanation: Studies by the National Safety Council and the Insurance Institute
    for Highway Safety show that a fully loaded tractor trailer may take twice as
    far to stop as a passenger vehicle.
- id: 358
  category: sharing_the_road
  question: When a trolley is letting passengers on or off, what is the closest distance
    you may drive to the trolley passenger step?
  choices:
    A: 5 feet
    B: 8 feet
    C: 10 feet
    D: 12 feet
  answer: B
  explanation: State law requires that you must not drive closer than eight feet of
    a trolley passenger step when the trolley is letting passengers on or off.
- id: 359
  category: signs_and_signals
  question: What type of sign is typically attached to the back of farm vehicles,
    construction rigs, and other slow-moving vehicles?
  choices:
    A: A yellow diamond sign
    B: A red and white triangular sign
    C: An orange warning sign
    D: A green rectangular sign
  answer: C
  explanation: Most farm vehicles, construction rigs, and other slow-moving vehicles
    have orange warning signs attached to the back.
- id: 360
  category: safe_driving_rules
  question: 'Funeral processions have the right-of-way at intersections, EXCEPT when
    they must yield to:'
  choices:
    A: Pedestrians in crosswalks
    B: Oncoming traffic with a green light
    C: Emergency vehicles with flashing lights or sirens
    D: Public transport buses
  answer: C
  explanation: Funeral processions have the right-of-way at intersections, with the
    EXCEPTION that they must yield to emergency vehicles with flashing lights or sirens
    or when directed by law enforcement.
- id: 361
  category: safe_driving_rules
  question: If you are driving as part of a funeral procession on a highway with a
    speed limit of 55 MPH or higher, what is the maximum speed you are allowed to
    drive?
  choices:
    A: 45 MPH
    B: 50 MPH
    C: 55 MPH
    D: 60 MPH
  answer: C
  explanation: If driving as part of a funeral procession, you must not drive faster
    than 55 MPH on a highway with a speed limit of 55 MPH or higher.
- id: 362
  category: sharing_the_road
  question: If your vehicle is NOT part of a funeral procession, which of the following
    actions is permitted?
  choices:
    A: Driving between procession vehicles if you are in a hurry
    B: Joining the procession to bypass traffic
    C: Passing the procession on the right on a multiple-lane highway if the procession
      is in the far left lane
    D: Crossing an intersection on a green light while the procession is passing through
      a red light, even if it crosses their path
  answer: C
  explanation: You may not pass a procession on a multiple lane highway on the procession’s
    right, unless the procession is in the far left lane.
- id: 363
  category: penalties_and_points
  question: What is the penalty for being cited for speeding in a "work area"?
  choices:
    A: Your license will be suspended for 30 days
    B: The fine will be doubled
    C: You will receive a warning for the first offense
    D: You must attend a driver retraining course
  answer: B
  explanation: If you are cited for speeding in a “work area”, the fine will be doubled.
- id: 364
  category: sharing_the_road
  question: What must you do if you are passing an animal being led, ridden, or driven,
    and the animal looks scared?
  choices:
    A: Honk your horn lightly to warn the animal
    B: Accelerate to pass the animal quickly
    C: Pull your vehicle to the side and stop
    D: Turn on your hazard lights and continue at the same speed
  answer: C
  explanation: If the animal you are passing looks scared, you must pull your vehicle
    to the side and stop.
- id: 365
  category: safe_driving_rules
  question: When parking your vehicle, you must always make sure to leave a clear
    roadway for passing traffic that is at least how wide?
  choices:
    A: 8 feet
    B: 10 feet
    C: 12 feet
    D: 15 feet
  answer: C
  explanation: You must always make sure that you leave at least a 12-foot wide, clear
    roadway for traffic to pass.
- id: 366
  category: safe_driving_rules
  question: If you park in a business or residential district, what is the maximum
    distance your vehicle can be from the curb (unless angled parking is allowed)?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: If you park in a business or residential district, your vehicle must
    be no more than 12 inches from the curb. The only exception is if angled parking
    is allowed.
- id: 367
  category: vehicle_information
  question: State law requires you to take several actions when leaving your vehicle
    by itself. Which of the following is NOT explicitly listed as one of these required
    actions?
  choices:
    A: Stop the motor
    B: Set the parking brake
    C: Turn on your hazard lights
    D: Remove your key and lock the door
  answer: C
  explanation: When you leave your vehicle by itself, state law requires you to stop
    the motor, set the parking brake, make sure the ignition is locked, remove your
    key, and lock the door. Turning on hazard lights is not listed.
- id: 368
  category: defensive_driving
  question: When slowly backing up to parallel park, where should you look?
  choices:
    A: Directly out your rear window
    B: In your rearview mirror
    C: In your side mirrors
    D: At your backup camera display
  answer: A
  explanation: When slowly backing up to parallel park, the manual instructs to "Look
    directly out your rear window. Do not use your mirrors."
- id: 369
  category: sharing_the_road
  question: Why should you avoid passing a truck or bus on the right unless absolutely
    necessary?
  choices:
    A: Large vehicles are required to drive in the far left lane
    B: Large vehicles travel faster downhill
    C: Large vehicles make wide turns and may move left before turning right
    D: Passing on the right is illegal on all multiple-lane highways
  answer: C
  explanation: Do not pass a truck or bus on the right unless absolutely necessary.
    Large vehicles make wide turns, and sometimes they must move to the left before
    making a wide turn to the right.
- id: 370
  category: sharing_the_road
  question: If a large vehicle is coming toward you on an undivided road, why should
    you stay to the right?
  choices:
    A: To give the large vehicle room to pass other cars
    B: To avoid being sideswiped or shaken by air turbulence
    C: To prepare for a right turn
    D: To allow the large vehicle to see your headlights better
  answer: B
  explanation: If a large vehicle is coming toward you on an undivided road, stay
    to the right. You will avoid being sideswiped or shaken by air turbulence.
- id: 371
  category: safe_driving_rules
  question: When parking uphill against a curb, which way should you turn your vehicle's
    front wheels?
  choices:
    A: Inward, toward the curb
    B: Outward, toward the travel lane
    C: Straight ahead
    D: Inward, toward the edge of the road
  answer: B
  explanation: When parking uphill against a curb, you must turn your wheels outward,
    toward the travel lane to stop it from rolling downhill if the brake fails.
- id: 372
  category: safe_driving_rules
  question: It is illegal to park your vehicle within how many feet of a fire hydrant
    or fire lane?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: In Massachusetts, you may not park your vehicle within ten feet of
    a fire hydrant or fire lane.
- id: 373
  category: penalties_and_points
  question: What is the penalty for parking in a posted bus stop in Massachusetts?
  choices:
    A: $50
    B: $100
    C: $300
    D: $500
  answer: B
  explanation: The penalty for parking in a posted bus stop is $100.
- id: 374
  category: safe_driving_rules
  question: You are prohibited from parking your vehicle within how many feet of an
    intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: You may not park your vehicle within 20 feet of an intersection.
- id: 375
  category: penalties_and_points
  question: What is the minimum fine for the wrongful use of a disabled person or
    veteran plate or placard?
  choices:
    A: $100
    B: $250
    C: $300
    D: $500
  answer: D
  explanation: The fine for wrongful use of a disabled person or veteran plate or
    placard is a minimum of $500.
- id: 376
  category: driver_responsibility
  question: How must you dispose of used motor oil and transmission fluid?
  choices:
    A: Pour it down a storm drain
    B: Throw it in the regular trash
    C: Return it to the place you bought it
    D: Leave it at a local fire station
  answer: C
  explanation: You must return used motor oil, transmission fluid, and other hazardous
    materials to the place you bought them. The garage or store that sold it to you
    is responsible for disposing of it.
- id: 377
  category: sharing_the_road
  question: If no sidewalk is available, where should a pedestrian walk?
  choices:
    A: On the shoulder facing traffic
    B: On the shoulder in the same direction as traffic
    C: In the center of the travel lane
    D: In the bicycle lane only
  answer: A
  explanation: When no sidewalk is available, pedestrians should walk on the shoulder
    facing traffic.
- id: 378
  category: sharing_the_road
  question: A bicycle helmet approved by the U.S. Consumer Product Safety Commission
    must be worn by a bicycle operator or passenger under what age?
  choices:
    A: 12 years old
    B: 14 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: A bicycle helmet approved by the U.S. Consumer Product Safety Commission
    must be worn by a bicycle operator or passenger under 16 years old.
- id: 379
  category: sharing_the_road
  question: Under what age is it illegal to transport a child on a bicycle?
  choices:
    A: Under 1 year old
    B: Under 2 years old
    C: Under 3 years old
    D: Under 4 years old
  answer: A
  explanation: You cannot transport a child under the age of one year on a bicycle.
- id: 380
  category: sharing_the_road
  question: From a half hour after sunset to a half hour before sunrise, a bicyclist
    must have a white front lamp visible from up to how many feet?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: C
  explanation: From a half hour after sunset to a half hour before sunrise, you must
    have a white lamp in front visible from up to 500 feet.
- id: 381
  category: sharing_the_road
  question: A bicycle must have a proper working brake system capable of stopping
    from 15 MPH within what distance?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: You must have a proper working brake system to stop from 15 MPH within
    30 feet.
- id: 382
  category: sharing_the_road
  question: What is the maximum number of bicycles that can be operated side-by-side
    on a roadway?
  choices:
    A: One (single file only)
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: No more than two bicycles can be operated side-by-side.
- id: 383
  category: defensive_driving
  question: To avoid opening car doors, bicyclists should ride outside the 'door zone'
    by keeping at least how far from parked cars?
  choices:
    A: One foot
    B: Two feet
    C: Three feet
    D: Five feet
  answer: C
  explanation: Bicyclists should ride outside of the 'door zone' (at least three feet
    from parked cars) and watch for opening car doors.
- id: 384
  category: driver_responsibility
  question: A bicyclist must report a crash to the police if it involves personal
    injury or property damage in excess of what amount?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: You must report any crash involving personal injury and any crash involving
    property damage in excess of $100 to the police in the municipality where it occurred.
- id: 385
  category: sharing_the_road
  question: When passing a bicycle in a narrow lane, what is the minimum distance
    you must maintain between your vehicle and the bicyclist?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: The manual states that if a lane is too narrow to pass a bicycle at
    a safe distance, you must wait until it is safe and stay at least four feet away
    when passing.
- id: 386
  category: penalties_and_points
  question: What is the maximum fine for a driver or passenger who opens a vehicle
    door into an oncoming bicycle?
  choices:
    A: $50
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: According to the manual, drivers and passengers can be fined up to
    $100 for opening a vehicle door into an oncoming bicycle.
- id: 387
  category: sharing_the_road
  question: Are bicyclists legally allowed to ride two side-by-side on the road?
  choices:
    A: No, they must always ride single file.
    B: Yes, but on a road with more than one lane in the direction of travel, they
      must stay in one lane.
    C: Yes, and they may occupy multiple lanes if needed.
    D: No, unless they are passing another bicyclist.
  answer: B
  explanation: The manual notes that bicyclists can ride two bicycles side-by-side.
    However, on a road with more than one lane in the direction of travel, they must
    stay in one lane.
- id: 388
  category: sharing_the_road
  question: Why might a bicyclist legally choose not to use a hand signal to indicate
    a turn?
  choices:
    A: Hand signals are only required for motor vehicles.
    B: They are traveling below 10 mph.
    C: Both hands are needed for the bicycle's safe operation.
    D: They are riding in a designated bicycle lane.
  answer: C
  explanation: Bicyclists must signal their intent to stop or turn, but the signal
    does not have to be made if both hands are needed for the bicycle's safe operation.
- id: 389
  category: safe_driving_rules
  question: What is the primary purpose of the 'Dutch Reach' method?
  choices:
    A: To safely pass a bicyclist on a narrow road.
    B: To open a vehicle door with the far hand, forcing the body to turn and see
      approaching bicyclists.
    C: To allow bicyclists to make a two-stage left turn at an intersection.
    D: To steer a vehicle safely out of a skid.
  answer: B
  explanation: The 'Dutch Reach' method involves opening the door with your far hand,
    which forces your body to turn and better allows you to see approaching bicyclists
    before opening the door.
- id: 390
  category: sharing_the_road
  question: What must a driver do when approaching a red light at an intersection
    with a green 'bicycle box' painted on the pavement?
  choices:
    A: Stop inside the bicycle box to trigger the traffic light sensor.
    B: Stop behind the bicycle box, even when it is empty, and wait for a green light.
    C: Enter the bicycle box only if turning right on red.
    D: Honk to clear the bicycle box before proceeding.
  answer: B
  explanation: Drivers must stop behind the bicycle box (even when it's empty) and
    wait for a green light.
- id: 391
  category: safe_driving_rules
  question: What should you do if an emergency vehicle with its siren and flashing
    lights approaches while you are in the middle of an intersection?
  choices:
    A: Stop immediately in the intersection and wait for it to pass.
    B: Put your vehicle in reverse and back out of the intersection.
    C: Drive through the intersection and pull over to the right as soon as it is
      safe.
    D: Pull over to the left side of the intersection.
  answer: C
  explanation: 'The manual explicitly states: ''NEVER stop in the middle of an intersection.
    Drive through the intersection and pull over as soon as it is safe.'''
- id: 392
  category: safe_driving_rules
  question: It is illegal to follow closer than what distance behind an emergency
    vehicle responding to an alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: According to the manual, it is illegal to follow closer than 300 feet
    behind an emergency vehicle responding to an alarm.
- id: 393
  category: safe_driving_rules
  question: Under the 'move-over law,' what must you do when approaching a stationary
    emergency vehicle with flashing lights on a highway with at least two lanes traveling
    in your direction?
  choices:
    A: Stop your vehicle immediately and wait for instructions.
    B: Maintain your speed but move to the left lane.
    C: Reduce your speed and safely move to a lane that is not next to the emergency
      vehicle.
    D: Honk your horn to alert the emergency workers of your presence.
  answer: C
  explanation: The move-over law requires drivers to reduce speed and yield the right-of-way
    by safely moving over to a lane that is not next to the lane the emergency vehicle
    is in.
- id: 394
  category: defensive_driving
  question: According to the RMV Crash Data Department, approximately what percentage
    of highway crashes involve drivers under 25 years old?
  choices:
    A: 15 percent
    B: 25 percent
    C: 40 percent
    D: 60 percent
  answer: C
  explanation: The manual states that about 40 percent of highway crashes involve
    drivers under 25 years old, mostly caused by driver inexperience.
- id: 395
  category: sharing_the_road
  question: How far should bicyclists ride from parked cars to avoid getting hit by
    opening vehicle doors?
  choices:
    A: At least 1 foot
    B: At least 2 feet
    C: At least 3 feet
    D: At least 5 feet
  answer: C
  explanation: Bicyclists should ride at least three feet from parked cars to avoid
    doors and stay outside of the 'door zone'.
- id: 396
  category: sharing_the_road
  question: What is the rule regarding bicyclists wearing headphones or earbuds?
  choices:
    A: They may wear them in both ears if the volume is kept low.
    B: They are completely prohibited from wearing any headphones.
    C: They must not wear headphones or earbuds in both ears while biking.
    D: They can wear them only when riding in a separated bicycle lane.
  answer: C
  explanation: 'The manual explicitly states: ''Do not wear headphones or earbuds
    in both ears while biking.'''
- id: 397
  category: sharing_the_road
  question: Which of the following is a critical safety rule for bicyclists sharing
    the road with large vehicles?
  choices:
    A: Always pass a moving tractor trailer on the right.
    B: Never pass a moving tractor trailer on the right.
    C: Ride directly in the rear blind spot to draft behind the truck.
    D: Pass buses on the right to avoid oncoming traffic.
  answer: B
  explanation: The manual warns bicyclists to be especially careful around large vehicles
    and states, 'Never pass a moving tractor trailer on the right.'
- id: 398
  category: safe_driving_rules
  question: When an emergency vehicle is approaching with its siren and flashing lights,
    which of the following actions is unacceptable?
  choices:
    A: Pulling as close as possible to the right side of the road.
    B: Using your right turn signal to indicate you are pulling over.
    C: Slowly rolling while the emergency vehicle passes.
    D: Stopping completely until the vehicle has passed.
  answer: C
  explanation: When an emergency vehicle approaches, you must pull to the right and
    stop. The manual specifies that 'Slowly rolling is not acceptable.'
- id: 399
  category: sharing_the_road
  question: When turning left at an intersection, what must a driver do if a bicycle
    is approaching from the opposite direction?
  choices:
    A: Speed up to complete the turn before the bicycle arrives.
    B: Yield the right of way to the bicycle if it is close enough to be an immediate
      hazard.
    C: Honk to warn the bicyclist to stop.
    D: Proceed with the turn, as motor vehicles have the right of way over bicycles.
  answer: B
  explanation: When turning left, you must yield the right of way to a vehicle approaching
    from the opposite direction, including a bicycle, if it is in the intersection
    or close enough to be an immediate hazard.
- id: 400
  category: safe_driving_rules
  question: If you need assistance from a police officer who is in a parked cruiser,
    where should you position your vehicle?
  choices:
    A: Directly behind the police cruiser
    B: Beside the police cruiser in the travel lane
    C: In front of the police cruiser
    D: Across the street from the police cruiser
  answer: C
  explanation: 'The manual advises: ''If you need help, pull in front of the police
    cruiser and ask for help. Never stop behind a police cruiser.'''
- id: 401
  category: driver_responsibility
  question: What should you do regarding your vehicle's lights if you are pulled over
    by a police officer at night?
  choices:
    A: Turn off all lights to avoid blinding the officer
    B: Turn on your high beams and hazard lights
    C: Turn off your headlights but leave your parking lights on
    D: Leave your headlights on and turn on the interior overhead light
  answer: D
  explanation: During a traffic stop in the dark, the manual instructs drivers to
    'leave your headlights on and put the interior overhead light on.'
- id: 402
  category: driver_responsibility
  question: During a traffic stop, when is the appropriate time to reach into your
    glove compartment for your license and registration?
  choices:
    A: As soon as you pull over, before the officer approaches the vehicle
    B: While the officer is walking toward your vehicle
    C: Only after the officer asks for your license and registration
    D: You should hand the officer your entire wallet as soon as they reach the window
  answer: C
  explanation: The manual warns drivers to 'Wait until the officer asks for your license
    and registration before you (or a passenger) reach into the glove compartment'
    to avoid sudden movements that could be perceived as threatening.
- id: 403
  category: penalties_and_points
  question: What is the fine for a first offense of failing to produce your license
    and registration when requested by a police officer?
  choices:
    A: $35
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: According to Chapter 90, Section 11 of the General Laws, 'There is
    a $35 fine for a first offense for the failure to produce either document.'
- id: 404
  category: penalties_and_points
  question: If you fail to comply with a police officer's request for your name and
    address, or if you provide a false name or address, what fine can you face?
  choices:
    A: $35
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: 'The manual states: ''If you fail to comply, or provide a false name
    or address, you can be fined $100 (Chapter 90, Section 25).'''
- id: 405
  category: safe_driving_rules
  question: How should you re-enter traffic after being stopped by a police officer
    on a highway?
  choices:
    A: Merge immediately into the travel lane at a low speed
    B: Wait for the police officer to block traffic for you
    C: Accelerate to a safe speed in the breakdown lane before merging into traffic
    D: Drive in the breakdown lane until you reach the next exit
  answer: C
  explanation: The manual advises that when the officer tells you that you can go,
    'If you are on a highway, accelerate to a safe speed in the breakdown lane before
    merging into traffic.'
- id: 406
  category: defensive_driving
  question: What is the first step you should take if your vehicle begins to skid?
  choices:
    A: Slam on the brakes immediately
    B: Accelerate quickly to regain traction
    C: Slowly remove your foot from the gas pedal and shift into neutral
    D: Turn off the vehicle's ignition
  answer: C
  explanation: To handle a skid, the manual directs drivers to 'Slowly remove your
    foot from the gas pedal and shift into neutral' and explicitly warns not to hit
    the brakes.
- id: 407
  category: defensive_driving
  question: In which direction should you turn your steering wheel if your rear tires
    are skidding to the left?
  choices:
    A: To the right
    B: To the left
    C: Keep the wheel perfectly straight
    D: Turn the wheel in a zigzag pattern
  answer: B
  explanation: The manual instructs drivers to 'Turn your steering wheel in the direction
    of the skid. If your rear tires are skidding to the left, turn your steering wheel
    left.'
- id: 408
  category: defensive_driving
  question: What should you do if you accidentally drive off the pavement and onto
    the shoulder of the road?
  choices:
    A: Jerk the steering wheel sharply to the left to get back on the road
    B: Slam on the brakes to stop the vehicle immediately
    C: Accelerate to get back onto the pavement as quickly as possible
    D: Hold the steering wheel tightly, slowly remove your foot from the gas, and
      gently apply the brake
  answer: D
  explanation: If running off the pavement, the manual says to 'Hold the steering
    wheel tightly and slowly remove your foot from the gas pedal. Gently apply the
    brake to reduce your speed.'
- id: 409
  category: defensive_driving
  question: How should you react if you experience a tire blowout while driving?
  choices:
    A: Grip the steering wheel tightly and slowly remove your foot from the gas pedal
    B: Hit the brakes hard to stop the car before the tire comes completely off
    C: Immediately steer onto the shoulder without checking for traffic
    D: Accelerate slightly to keep the vehicle moving in a straight line
  answer: A
  explanation: For a flat tire or blowout, the manual instructs to 'Grip the steering
    wheel tightly and slowly remove your foot from the gas pedal' and to gently apply
    the brakes.
- id: 410
  category: defensive_driving
  question: If your vehicle has antilock brakes and they fail to respond when you
    press the pedal, what should you do?
  choices:
    A: Shift into the highest gear possible
    B: Turn off the ignition immediately to cut engine power
    C: Downshift to a lower gear and gently apply the parking brake
    D: Pump the gas pedal repeatedly
  answer: C
  explanation: In the event of brake failure, the manual advises to 'Downshift to
    a lower gear... Apply the parking brake gently. Hold the brake release in case
    your vehicle starts to skid.'
- id: 411
  category: safe_driving_rules
  question: When signaled to pull over by a police officer, which of the following
    locations should you avoid stopping in?
  choices:
    A: The right side of the road
    B: A designated breakdown lane
    C: An intersection or a travel lane
    D: A safe, well-lit parking lot
  answer: C
  explanation: 'The manual explicitly states: ''Do not stop your vehicle in an intersection,
    in front of a driveway, or in a travel lane.'''
- id: 412
  category: defensive_driving
  question: If your vehicle begins to skid, in which direction should you turn your
    steering wheel?
  choices:
    A: In the opposite direction of the skid.
    B: Straight ahead.
    C: In the direction of the skid.
    D: Toward the right side of the road.
  answer: C
  explanation: According to the manual, if your vehicle skids, you should always turn
    your steering wheel in the direction of the skid.
- id: 413
  category: defensive_driving
  question: How should you react if a vehicle is driving toward you head-on in your
    lane?
  choices:
    A: Speed up and swerve to the left.
    B: Stop immediately in your lane.
    C: Slow down and pull to the right.
    D: Flash your headlights and maintain your speed.
  answer: C
  explanation: If a vehicle is approaching head-on in your lane, you should slow down,
    pull to the right, and sound your horn to alert the other driver.
- id: 414
  category: defensive_driving
  question: If your vehicle stalls on railroad tracks and a train is approaching,
    how should you run away from the tracks?
  choices:
    A: In a 45 degree angle away from the tracks in the direction the train is coming.
    B: Straight down the tracks away from the train.
    C: In a 45 degree angle away from the tracks in the same direction the train is
      traveling.
    D: Perpendicular to the tracks directly into the nearest field.
  answer: A
  explanation: To avoid being hit by wreckage, you should run in a 45 degree angle
    away from the tracks in the direction that the train is coming.
- id: 415
  category: safe_driving_rules
  question: What should you do if your vehicle breaks down on a highway with a breakdown
    lane?
  choices:
    A: Stand in the breakdown lane to wave for help.
    B: Move your vehicle as far from the travel lane as you can and stay in your vehicle.
    C: Get out of your vehicle and stand near the travel lane to direct traffic.
    D: Leave your vehicle in the travel lane and walk to the nearest exit.
  answer: B
  explanation: On a highway with a breakdown lane, you should move your vehicle as
    far from the travel lane as you can and stay in your vehicle. Do not stand near
    the travel lane or in the breakdown lane.
- id: 416
  category: safe_driving_rules
  question: When your vehicle breaks down, what color cloth should you tie to your
    antenna or door handle if it is snowing?
  choices:
    A: White
    B: Yellow
    C: Red
    D: Orange
  answer: C
  explanation: The manual advises tying a white cloth to your antenna or door handle
    during a breakdown, but specifies to use a red cloth when it is snowing.
- id: 417
  category: defensive_driving
  question: Why should you avoid opening a door if your vehicle drives into water?
  choices:
    A: It will cause the power windows to short circuit.
    B: It will cause water to rush in and your vehicle could flip over.
    C: It will trap the air pocket in the rear seat.
    D: It will deploy the airbags unnecessarily.
  answer: B
  explanation: If your car drives into water, you should not open a door because it
    would cause water to rush in and your vehicle could flip over.
- id: 418
  category: driver_responsibility
  question: If there is a fire while you are driving through a tunnel, what should
    you do with your vehicle's keys?
  choices:
    A: Take them with you when you exit the vehicle.
    B: Throw them out the window.
    C: Leave them in the vehicle to help emergency personnel.
    D: Hide them under the driver's seat.
  answer: C
  explanation: In the event of a fire in a tunnel, you should stop, turn off the engine,
    exit your vehicle, and leave your keys in the vehicle to help emergency personnel.
- id: 419
  category: safe_driving_rules
  question: Which of the following is explicitly prohibited when entering a tunnel
    in Massachusetts?
  choices:
    A: Diesel fuel
    B: Propane
    C: Commercial vehicles
    D: Passenger vans
  answer: B
  explanation: When entering a tunnel, hazardous materials are prohibited, including
    propane.
- id: 420
  category: driver_responsibility
  question: Under the Driver Removal Law, what must you do if you are involved in
    a crash with no injuries?
  choices:
    A: Leave the vehicles exactly where they are until police arrive.
    B: Move the vehicles out of the travel lanes to a safe location.
    C: Wait for a tow truck before attempting to move the vehicles.
    D: Direct traffic around your vehicle while leaving it in the travel lane.
  answer: B
  explanation: If there are no injuries, the Driver Removal Law requires that vehicles
    be moved out of travel lanes to a safe location.
- id: 421
  category: driver_responsibility
  question: How many days do you have to file a crash report with the RMV and local
    police if you are in a crash with $1,000 or more of property damage?
  choices:
    A: 2 days
    B: 3 days
    C: 5 days
    D: 10 days
  answer: C
  explanation: Within five days of the crash, you must file a crash report with both
    the RMV and the local police department for any crash with $1,000 or more of property
    damage.
- id: 422
  category: driver_responsibility
  question: What must you do if you injure an animal, such as a dog or cat, in a motor
    vehicle crash?
  choices:
    A: Move the animal to the side of the road and leave the scene.
    B: Take the animal to the nearest veterinary clinic immediately.
    C: Notify the local police and, if possible, the animal's owner.
    D: File a crash report with the RMV within 24 hours.
  answer: C
  explanation: If you’ve injured a cat, dog, or any other animal, you must notify
    the local police and, if possible, the animal’s owner.
- id: 423
  category: defensive_driving
  question: When providing emergency first aid at a crash scene, why should you cover
    an injured person with a blanket or coat?
  choices:
    A: To hide their injuries from other drivers.
    B: To provide warmth and prevent shock.
    C: To stop them from moving around.
    D: To elevate their body temperature above normal.
  answer: B
  explanation: Emergency first aid tips state to cover the injured person with a blanket
    or coat to provide warmth and prevent shock.
- id: 424
  category: penalties_and_points
  question: What is a potential consequence of leaving the scene of a crash without
    properly identifying yourself?
  choices:
    A: You will only receive a warning if it is your first offense.
    B: You will be required to take a defensive driving course.
    C: You could be criminally charged with a 'leaving the scene' violation.
    D: Your insurance rates will decrease.
  answer: C
  explanation: If you leave the scene after a crash without properly identifying yourself,
    you could be criminally charged with a 'leaving the scene' violation.
- id: 425
  category: penalties_and_points
  question: What is the maximum penalty for leaving the scene of a crash that causes
    damage to another vehicle or property?
  choices:
    A: Up to $200 or up to two years imprisonment, or both
    B: Up to $500 and one year imprisonment
    C: Up to $1000 and six months imprisonment
    D: A mandatory $500 fine and license revocation
  answer: A
  explanation: According to the manual, leaving the scene after a crash causing damage
    to another vehicle or property can result in penalties of up to $200 or up to
    two years imprisonment, or both.
- id: 426
  category: penalties_and_points
  question: What penalty do you face if you leave the scene of a crash that causes
    personal injury to a person (not resulting in death)?
  choices:
    A: Up to $500 and one year imprisonment
    B: Up to $1000 and imprisonment of up to two years
    C: Up to $2000 and five years imprisonment
    D: Up to $5000 and ten years imprisonment
  answer: B
  explanation: The manual states that leaving the scene after a crash causing personal
    injury (not resulting in death) carries a maximum penalty of up to $1000 and imprisonment
    of up to two years.
- id: 427
  category: driver_responsibility
  question: What must you do if you hit and injure or kill a cat or dog with your
    vehicle?
  choices:
    A: Move the animal to the side of the road and leave
    B: Notify the animal's owner or the local police
    C: Take the animal to the nearest veterinary clinic immediately
    D: File a written report with the RMV within 5 days
  answer: B
  explanation: 'The manual states: ''If you hit and injure or kill a cat or dog and
    do not notify the animal''s owner or the local police, you can be fined under
    M.G.L. Chapter 272, Section 80H.'''
- id: 428
  category: penalties_and_points
  question: How long may you be subject to insurance surcharges following a criminal
    conviction for leaving the scene of a crash?
  choices:
    A: Up to two years
    B: Up to four years
    C: Up to six years
    D: Up to ten years
  answer: C
  explanation: Any criminal conviction may result in probation costs and you may be
    subject to up to six years of insurance surcharges.
- id: 429
  category: safe_driving_rules
  question: What should you do if you drive by a crash and police and emergency vehicles
    are already there?
  choices:
    A: Stop your vehicle to see if you can help the police
    B: Slow down to 'sightsee' and take pictures for evidence
    C: Reduce your speed, drive carefully, and do not stop or slow down to 'sightsee'
    D: Honk your horn to warn emergency workers of your presence
  answer: C
  explanation: 'If police and emergency vehicles are present, you should reduce your
    speed and drive carefully. The manual explicitly states: ''Do not stop or slow
    down to sightsee. This is dangerous and will cause a traffic problem.'''
- id: 430
  category: defensive_driving
  question: If you are the first to arrive at a crash scene and have flares or emergency
    triangles, where should you place them?
  choices:
    A: 50 feet or more in front of and behind the crash
    B: 100 feet or more in front of and behind the crash
    C: 200 feet or more in front of and behind the crash
    D: 500 feet or more in front of and behind the crash
  answer: C
  explanation: If anyone has flares, emergency triangles, or reflectors, you should
    put them 200 feet or more in front of and behind the crash to warn other drivers.
- id: 431
  category: safe_driving_rules
  question: What should you do if electrical wires have landed on a vehicle involved
    in a crash?
  choices:
    A: Tell the people inside to remain inside until emergency personnel arrive
    B: Carefully pull the wires off the vehicle using a non-conductive object
    C: Instruct the occupants to jump out of the vehicle without touching the metal
      frame
    D: Open the doors from the outside to help the occupants escape
  answer: A
  explanation: 'The manual warns: ''If electrical wires have landed on a vehicle,
    tell the people inside to remain inside until emergency personnel arrive. Do not
    touch the vehicle.'''
- id: 432
  category: driver_responsibility
  question: Under what conditions are you legally required to file a written crash
    report with the RMV?
  choices:
    A: Only if someone is killed or injured, regardless of property damage
    B: If someone is killed or hurt, or if there is $1,000 or more in property damage
    C: If there is $500 or more in property damage
    D: Only if the crash involves more than two vehicles
  answer: B
  explanation: You must report any motor vehicle crash you are in that causes someone
    to be killed or hurt, or that causes $1,000 or more in property damage.
- id: 433
  category: driver_responsibility
  question: How many days do you have to file a written crash report with the RMV
    after a qualifying crash?
  choices:
    A: Within 24 hours
    B: Within 3 days
    C: Within 5 days
    D: Within 10 days
  answer: C
  explanation: You must file a written report with the RMV within five days of the
    crash.
- id: 434
  category: driver_responsibility
  question: When you are required to file a crash report, to which three entities
    must you send a copy?
  choices:
    A: The RMV, the local fire department, and your insurance company
    B: The local police department, your insurance company, and the RMV
    C: The State Police, the RMV, and the Department of Transportation
    D: Your insurance company, the other driver's insurance company, and the RMV
  answer: B
  explanation: 'Completed reports must be sent to: 1. The local police department
    where the crash happened, 2. Your Insurance Company, and 3. The RMV.'
- id: 435
  category: vehicle_information
  question: According to the 'Green Driving' tips, how does driving above 60 mph affect
    your vehicle's fuel consumption?
  choices:
    A: Fuel consumption increases about five percent for every five miles per hour
      driven above 60 mph
    B: Fuel consumption decreases by two percent for every five miles per hour driven
      above 60 mph
    C: Fuel consumption remains the same as long as you use cruise control
    D: Fuel consumption increases by ten percent for every mile per hour driven above
      60 mph
  answer: A
  explanation: 'The manual states: ''Fuel consumption increases about five percent
    for every five miles per hour driven above 60 mph.'''
- id: 436
  category: vehicle_information
  question: How much can rapid starts and hard stops increase your fuel use?
  choices:
    A: By 10 percent
    B: By 25 percent
    C: By 40 percent
    D: By 50 percent
  answer: C
  explanation: Rapid starts and hard stops can increase fuel use by 40 percent, but
    reduce travel time by only four percent.
- id: 437
  category: safe_driving_rules
  question: Under Massachusetts state law, what is the maximum amount of time a vehicle
    is permitted to idle?
  choices:
    A: One minute
    B: Three minutes
    C: Five minutes
    D: Ten minutes
  answer: C
  explanation: Massachusetts state law prohibits idling for more than five minutes.
- id: 438
  category: vehicle_information
  question: When running multiple errands, how should you 'chain' your trips together
    to get better fuel economy?
  choices:
    A: Go to your closest destination first to save time
    B: Go to your farthest destination first to warm up your engine more quickly
    C: Make all your stops during rush hour to avoid high speeds
    D: Leave your car idling at each stop to keep the engine warm
  answer: B
  explanation: The manual suggests that when you make multiple stops, you should go
    to your farthest destination first to warm up your engine more quickly for better
    fuel economy.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 439
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 440
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 441
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 442
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 443
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 444
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 445
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 446
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 447
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 448
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 449
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 450
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 451
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 452
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 453
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
