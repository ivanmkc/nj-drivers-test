metadata:
  source: American Samoa Driver Manual
  total_questions: 230
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the minimum age to apply for a learner's permit in American Samoa?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: According to American Samoa motor vehicle laws, an individual must
    be at least 16 years of age to apply for a learner's permit.
- id: 2
  category: license_system
  question: A person holding a learner's permit in American Samoa must be accompanied
    by a licensed driver who is at least what age?
  choices:
    A: 18 years old
    B: 21 years old
    C: 25 years old
    D: 30 years old
  answer: B
  explanation: Permit holders must be supervised by a licensed driver who is at least
    21 years of age and has a valid driver's license.
- id: 3
  category: license_system
  question: How long is a standard American Samoa driver's license valid before it
    expires?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 8 years
  answer: B
  explanation: In American Samoa, a standard operator's license is typically valid
    for a period of 3 years.
- id: 4
  category: license_system
  question: Under the American Samoa point system, how many points accumulated within
    a 12-month period will result in a mandatory license suspension?
  choices:
    A: 6 points
    B: 8 points
    C: 10 points
    D: 12 points
  answer: D
  explanation: The Department of Public Safety will suspend the license of any driver
    who accumulates 12 or more points within a 12-month period.
- id: 5
  category: license_system
  question: Which license class is required to operate a standard private passenger
    vehicle in American Samoa?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: D
  explanation: Class D is the standard operator's license for private passenger vehicles,
    pickups, and vans in American Samoa.
- id: 6
  category: license_system
  question: If you move to a new residence within American Samoa, within how many
    days must you notify the Office of Motor Vehicles of your change of address?
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: B
  explanation: Drivers are required by law to notify the Commissioner of Public Safety
    of a change of address within 30 days.
- id: 7
  category: license_system
  question: What is the minimum visual acuity requirement to obtain a driver's license
    in American Samoa without restrictions?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Applicants must have at least 20/40 vision in at least one eye, with
    or without corrective lenses, to qualify for a license.
- id: 8
  category: license_system
  question: A visitor with a valid driver's license from a US state or territory may
    drive in American Samoa for up to how many days?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: Non-residents with a valid license from another US jurisdiction may
    operate a vehicle in American Samoa for a maximum of 30 days.
- id: 9
  category: license_system
  question: Which of the following documents is NOT required when applying for an
    original American Samoa driver's license?
  choices:
    A: A valid Social Security card
    B: A certified birth certificate or valid passport
    C: Proof of immigration status (if not a US National)
    D: A high school diploma
  answer: D
  explanation: While identity, social security, and legal status are required, a high
    school diploma is not a requirement for a driver's license.
- id: 10
  category: license_system
  question: For drivers under the age of 21, what is the Blood Alcohol Concentration
    (BAC) limit (Zero Tolerance) in American Samoa?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: American Samoa enforces a zero-tolerance policy for minors, where a
    BAC of 0.02% or higher results in immediate license revocation.
- id: 11
  category: license_system
  question: How long is an American Samoa learner's permit valid for?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: B
  explanation: A learner's permit in American Samoa is valid for 180 days (approximately
    6 months) from the date of issuance.
- id: 12
  category: license_system
  question: What is the penalty for a first-time conviction of driving without a valid
    license in American Samoa?
  choices:
    A: A warning only
    B: A fine of up to $1,000 and/or up to 1 year in jail
    C: Mandatory community service for 5 years
    D: Permanent ban from driving
  answer: B
  explanation: Driving without a valid license is a misdemeanor in American Samoa,
    punishable by fines up to $1,000 and/or imprisonment for up to one year.
- id: 13
  category: license_system
  question: To register a vehicle in American Samoa, what is the minimum insurance
    requirement?
  choices:
    A: No insurance is required
    B: Comprehensive and Collision only
    C: Mandatory Liability Insurance
    D: Personal Injury Protection only
  answer: C
  explanation: All motor vehicles operated on American Samoa public roads must be
    covered by mandatory liability insurance.
- id: 14
  category: license_system
  question: If your license is lost or destroyed, where must you go to obtain a duplicate?
  choices:
    A: The High Court
    B: The Governor's Office
    C: The Department of Public Safety (OMV)
    D: The Post Office
  answer: C
  explanation: Duplicate licenses are issued by the Office of Motor Vehicles (OMV)
    under the Department of Public Safety.
- id: 15
  category: license_system
  question: In American Samoa, what is the maximum number of points a driver can accumulate
    in a 24-month period before license suspension?
  choices:
    A: 12 points
    B: 15 points
    C: 18 points
    D: 24 points
  answer: C
  explanation: While 12 points in 12 months triggers suspension, the law also mandates
    suspension for accumulating 18 points within a 24-month period.
- id: 16
  category: license_system
  question: In American Samoa, what is the minimum age required to obtain a full,
    unrestricted Class 2 (Private) driver's license?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: C
  explanation: While a learner's permit can be obtained at 16, an applicant must be
    at least 18 years old to receive a full Class 2 private driver's license in American
    Samoa.
- id: 17
  category: license_system
  question: Which specific license classification is required in American Samoa to
    operate a motorcycle or motor-driven cycle?
  choices:
    A: Class 1
    B: Class 2
    C: Class 3
    D: Class A
  answer: A
  explanation: According to American Samoa motor vehicle regulations, a Class 1 license
    is specifically designated for the operation of motorcycles.
- id: 18
  category: license_system
  question: If an applicant fails the written driver's examination in American Samoa,
    how long must they wait before they are eligible to retake the test?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: C
  explanation: Standard OMV procedure in American Samoa requires a waiting period
    of one week (7 days) before a failed written exam can be retaken.
- id: 19
  category: license_system
  question: When applying for an original driver's license in American Samoa, which
    of the following is a mandatory document to prove your Social Security number?
  choices:
    A: A handwritten note from an employer
    B: An original Social Security card
    C: A verbal statement of the number
    D: A school ID card
  answer: B
  explanation: Applicants must present an original Social Security card to the Office
    of Motor Vehicles to verify their identity and tax identification number.
- id: 20
  category: license_system
  question: For applicants under the age of 18, whose signature is required on the
    driver's license application in American Samoa?
  choices:
    A: A school principal
    B: Any licensed driver over 21
    C: A parent or legal guardian
    D: No signature is required if they have a permit
  answer: C
  explanation: Minors under 18 must have their application signed by a parent or legal
    guardian who accepts financial responsibility for the minor's driving.
- id: 21
  category: license_system
  question: Under American Samoa's 'Implied Consent' law, what is the penalty for
    refusing to submit to a chemical test for alcohol or drugs?
  choices:
    A: A verbal warning
    B: Mandatory 6-month license seizure/suspension
    C: A $10 fine
    D: There is no penalty for refusal
  answer: B
  explanation: By driving in American Samoa, you imply consent to chemical testing.
    Refusal results in an immediate administrative seizure of your license, typically
    for 6 months.
- id: 22
  category: license_system
  question: Before a vehicle can be registered or its registration renewed in American
    Samoa, it must undergo which of the following?
  choices:
    A: A window tint darkness test only
    B: An annual safety inspection at an authorized station
    C: A high-speed track test
    D: A paint color verification
  answer: B
  explanation: All vehicles in American Samoa must pass an annual safety inspection
    to ensure they are roadworthy before registration can be completed.
- id: 23
  category: license_system
  question: Under the American Samoa point system, how many points are assessed against
    your driving record for a conviction of 'Reckless Driving'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Reckless driving is considered a major traffic offense in American
    Samoa and carries a penalty of 6 points on the driver's record.
- id: 24
  category: license_system
  question: For non-US citizens/nationals residing in American Samoa, the expiration
    date of their driver's license is typically tied to what?
  choices:
    A: Their birthday
    B: The expiration of their legal immigration status/entry permit
    C: The date they bought their car
    D: Exactly one year from the date of issue
  answer: B
  explanation: For non-citizens, the Office of Motor Vehicles issues licenses that
    expire concurrently with the individual's legal stay or immigration permit in
    the territory.
- id: 25
  category: license_system
  question: Which of the following is a requirement for obtaining a Class 3 (Commercial)
    license that is NOT required for a Class 2 license?
  choices:
    A: A valid birth certificate
    B: A physical examination and medical certificate
    C: A Social Security card
    D: Payment of a registration fee
  answer: B
  explanation: Applicants for commercial licenses (Class 3) must provide a medical
    examiner's certificate to prove they are physically fit to operate heavy equipment.
- id: 26
  category: license_system
  question: After passing the written exam but before taking the road test, an applicant
    is issued a temporary learner's permit. How long is this permit valid for in American
    Samoa?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: In American Samoa, a learner's permit is generally valid for 90 days,
    providing the applicant time to practice for the road skills test.
- id: 27
  category: license_system
  question: What is the legal consequence for 'Fraudulent use of a driver's license'
    (such as using someone else's ID) in American Samoa?
  choices:
    A: It is a minor infraction with no fine
    B: It is a misdemeanor punishable by fines and potential jail time
    C: A simple warning from the OMV
    D: Automatic permanent ban from driving
  answer: B
  explanation: Fraudulent use of a license is a serious offense under American Samoa
    law, classified as a misdemeanor and subject to criminal penalties.
- id: 28
  category: license_system
  question: In American Samoa, are you required to have a driver's license to operate
    a moped on public highways?
  choices:
    A: No, mopeds do not require a license
    B: Yes, you must have at least a valid Class 2 license
    C: Only if the moped goes faster than 50 mph
    D: Only if you are under 16
  answer: B
  explanation: Under American Samoa law, any person operating a motor-driven cycle
    (including mopeds) on public roads must possess a valid driver's license.
- id: 29
  category: driver_testing
  question: Before beginning the road test in American Samoa, the examiner will inspect
    your vehicle to ensure it meets safety standards. Which of the following is a
    mandatory requirement for the test vehicle?
  choices:
    A: It must have a working air conditioning system
    B: It must be equipped with a functional emergency brake (parking brake)
    C: It must have tinted windows for driver privacy
    D: It must be less than 5 years old
  answer: B
  explanation: For the road test in American Samoa, the vehicle must be in safe operating
    condition, which includes having a functional parking brake, working lights, horn,
    and valid registration/insurance.
- id: 30
  category: driver_testing
  question: If an applicant requires corrective lenses to pass the vision test in
    American Samoa, which restriction code will be placed on their driver's license?
  choices:
    A: Restriction A
    B: Restriction B
    C: Restriction C
    D: Restriction D
  answer: A
  explanation: In American Samoa, Restriction 'A' on a driver's license indicates
    that the driver is required to wear corrective lenses while operating a motor
    vehicle.
- id: 31
  category: driver_testing
  question: According to American Samoa traffic laws, what is the maximum speed limit
    in a school zone when children are present or when a signal is flashing?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Per ASCA § 22.0323, the speed limit in any school zone or near a church
    during services is 15 miles per hour.
- id: 32
  category: driver_testing
  question: Unless otherwise posted, what is the maximum legal speed limit on any
    highway in American Samoa?
  choices:
    A: 25 mph
    B: 30 mph
    C: 40 mph
    D: 45 mph
  answer: B
  explanation: Under American Samoa Code Annotated, the maximum speed limit is 30
    miles per hour unless signs are posted indicating a different limit.
- id: 33
  category: driver_testing
  question: In American Samoa, how many feet in advance must you signal your intention
    to turn in a business or residential district?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: Drivers in American Samoa are required to signal their intent to turn
    at least 100 feet before reaching the intersection.
- id: 34
  category: driver_testing
  question: When parking your vehicle on a public road in American Samoa, what is
    the minimum legal distance you must maintain from a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: ASCA § 22.0331 prohibits parking a vehicle within 15 feet of a fire
    hydrant.
- id: 35
  category: driver_testing
  question: In American Samoa, it is illegal to park your vehicle within how many
    feet of a crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: According to American Samoa traffic regulations, you may not park a
    vehicle within 20 feet of a crosswalk at an intersection.
- id: 36
  category: driver_testing
  question: If you are involved in a traffic accident in American Samoa that results
    in injury or death, within what timeframe must you report the accident to the
    Commissioner of Public Safety?
  choices:
    A: Immediately (within 24 hours)
    B: Within 48 hours
    C: Within 7 days
    D: Within 10 days
  answer: A
  explanation: ASCA § 22.0701 requires that any accident involving injury, death,
    or property damage exceeding $100 must be reported to the police within 24 hours.
- id: 37
  category: driver_testing
  question: Under the American Samoa Implied Consent Law, by operating a motor vehicle,
    you have given consent to which of the following?
  choices:
    A: A search of your vehicle at any time
    B: A chemical test of your breath, blood, or urine for alcohol/drugs
    C: A review of your personal cell phone records
    D: The installation of a speed monitoring device
  answer: B
  explanation: The Implied Consent Law means that by driving in American Samoa, you
    agree to submit to chemical testing if an officer suspects you are driving under
    the influence.
- id: 38
  category: driver_testing
  question: When using hand signals in American Samoa, what does it mean when the
    driver's arm is extended downward?
  choices:
    A: Left turn
    B: Right turn
    C: Stop or decrease speed
    D: U-turn
  answer: C
  explanation: The standard hand signal for stopping or slowing down is the arm extended
    downward with the palm facing the rear.
- id: 39
  category: driver_testing
  question: In American Samoa, when a school bus is stopped with its red lights flashing
    and stop arm extended, what must drivers do?
  choices:
    A: Slow down to 5 mph and pass carefully
    B: Stop only if traveling in the same direction as the bus
    C: Stop from either direction and remain stopped until the lights stop flashing
    D: Honk the horn to warn students before passing
  answer: C
  explanation: Drivers approaching from either direction must stop for a school bus
    with activated red flashing lights and remain stopped until the bus resumes motion
    or the signals are deactivated.
- id: 40
  category: driver_testing
  question: What is the recommended following distance for vehicles traveling in American
    Samoa to ensure safety?
  choices:
    A: One car length for every 10 mph of speed
    B: Exactly 10 feet at all times
    C: Two car lengths regardless of speed
    D: 50 feet at all times
  answer: A
  explanation: The general safety rule taught in American Samoa is to maintain at
    least one car length for every 10 miles per hour of speed to allow for safe braking.
- id: 41
  category: driver_testing
  question: How often must vehicles in American Samoa undergo a safety inspection
    at an authorized inspection station?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: Vehicles in American Samoa must pass a safety inspection annually as
    part of the registration renewal process.
- id: 42
  category: driver_testing
  question: In American Samoa, if two vehicles reach an uncontrolled intersection
    (no signs or signals) at the same time, who has the right of way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling on the wider road
    D: The driver who honks first
  answer: B
  explanation: At uncontrolled intersections in American Samoa, the driver of the
    vehicle on the left must yield the right of way to the vehicle on the right.
- id: 43
  category: driver_testing
  question: When taking the practical road test in American Samoa, which of the following
    is the applicant responsible for providing?
  choices:
    A: A vehicle provided by the Office of Motor Vehicles
    B: A vehicle that is currently registered and insured
    C: A vehicle with a manual transmission only
    D: Only a valid learner's permit; the examiner provides the car
  answer: B
  explanation: According to American Samoa driving regulations, applicants must provide
    their own vehicle for the road test, and it must have a valid registration and
    proof of insurance.
- id: 44
  category: driver_testing
  question: During the American Samoa road test, which of the following actions will
    result in an immediate and automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Adjusting the mirrors while driving
    C: A collision or any dangerous action that requires the examiner to intervene
    D: Driving 2 mph under the speed limit
  answer: C
  explanation: Any action that causes a collision, necessitates examiner intervention
    to prevent an accident, or constitutes a dangerous traffic violation results in
    an automatic failure of the road test.
- id: 45
  category: driver_testing
  question: In American Samoa, what is the maximum legal Blood Alcohol Concentration
    (BAC) for a driver who is 21 years of age or older?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Per ASCA § 22.0707, it is unlawful for any person who has a blood alcohol
    concentration of 0.08% or more to drive or be in actual physical control of a
    motor vehicle.
- id: 46
  category: driver_testing
  question: Under American Samoa's 'Implied Consent' law, what happens if you refuse
    to submit to a chemical test for alcohol or drugs when requested by an officer?
  choices:
    A: You will be given a warning and allowed to drive home
    B: Your license will be seized and your driving privileges suspended
    C: You will only be penalized if the subsequent court case finds you guilty
    D: You will be required to retake the written exam only
  answer: B
  explanation: By driving in American Samoa, you give implied consent to chemical
    testing. Refusal to take the test results in the immediate seizure of your license
    and administrative suspension.
- id: 47
  category: driver_testing
  question: Which license classification is specifically required in American Samoa
    to operate a 'Public Service' vehicle, such as a commercial bus or 'aiga' bus?
  choices:
    A: Class 1
    B: Class 2
    C: Class 3
    D: Class 4
  answer: D
  explanation: A Class 4 license is required for drivers operating public service
    vehicles, including taxis and buses, in American Samoa.
- id: 48
  category: driver_testing
  question: In American Samoa, when are you allowed to turn right on a red light?
  choices:
    A: Never; red lights always mean stay stopped
    B: Only if there is a green arrow pointing right
    C: After coming to a complete stop and yielding to traffic and pedestrians, unless
      a sign prohibits it
    D: Only during daylight hours
  answer: C
  explanation: Drivers may turn right on red after a complete stop and yielding to
    others, provided there is no sign posted that says 'No Turn on Red'.
- id: 49
  category: driver_testing
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal for a left turn in American Samoa?
  choices:
    A: Arm extended straight out the window
    B: Arm bent upward at a 90-degree angle
    C: Arm bent downward at a 90-degree angle
    D: Waving the arm in a circular motion
  answer: A
  explanation: The standard hand signal for a left turn is the left arm extended horizontally
    and straight out of the window.
- id: 50
  category: driver_testing
  question: In American Samoa, how far must you park your vehicle from a fire hydrant?
  choices:
    A: At least 5 feet
    B: At least 10 feet
    C: At least 15 feet
    D: At least 20 feet
  answer: C
  explanation: Parking regulations in American Samoa prohibit parking within 15 feet
    of a fire hydrant to ensure emergency access.
- id: 51
  category: driver_testing
  question: When approaching a school bus that has stopped to pick up or drop off
    children with its red lights flashing, what must you do?
  choices:
    A: Slow down to 5 mph and pass carefully
    B: Stop and wait until the red lights stop flashing and the bus starts moving
    C: Honk your horn to alert the children and proceed
    D: Only stop if you are traveling in the same direction as the bus
  answer: B
  explanation: Drivers in both directions must stop for a school bus with flashing
    red lights and remain stopped until the lights are turned off and the bus resumes
    motion.
- id: 52
  category: driver_testing
  question: Applicants for a commercial or public service license (Class 3 or 4) in
    American Samoa are usually required to provide which additional document?
  choices:
    A: A high school diploma
    B: A valid medical examiner's certificate
    C: A letter of recommendation from a village chief
    D: Proof of 10 years of driving experience
  answer: B
  explanation: Drivers of commercial or public service vehicles must meet higher physical
    standards and are required to provide a medical certificate to prove they are
    fit to drive.
- id: 53
  category: driver_testing
  question: What is the primary purpose of the 'Two-Second Rule' taught in American
    Samoa driver education?
  choices:
    A: To determine how long to stop at a stop sign
    B: To calculate the time needed to cross an intersection
    C: To maintain a safe following distance from the vehicle in front of you
    D: To time how long a yellow light will last
  answer: C
  explanation: The two-second rule is a measure used to ensure a safe following distance
    between vehicles under normal driving conditions.
- id: 54
  category: driver_responsibility
  question: In American Samoa, if you are involved in a motor vehicle accident that
    results in property damage to any one person, what is the minimum damage amount
    that requires a report to the Commissioner of Public Safety?
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: B
  explanation: According to ASCA § 22.0701, the driver of a vehicle involved in an
    accident resulting in damage to the property of any one person in excess of $100
    must report the accident.
- id: 55
  category: driver_responsibility
  question: If a written accident report is required in American Samoa, within how
    many days must the driver submit it to the Office of Motor Vehicles?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: Drivers are required to submit a written report of a qualifying accident
    within 10 days if a police officer did not perform an on-scene investigation.
- id: 56
  category: driver_responsibility
  question: In the event of an accident involving injury or death in American Samoa,
    how must the driver notify the Department of Public Safety?
  choices:
    A: By mail within 48 hours
    B: Immediately by the quickest means of communication
    C: By visiting the OMV the next business day
    D: Only if the damage exceeds $500
  answer: B
  explanation: ASCA § 22.0702 requires that the driver of a vehicle involved in an
    accident resulting in injury or death shall immediately, by the quickest means
    of communication, give notice to the police.
- id: 57
  category: driver_responsibility
  question: How many points are added to an American Samoa driving record for a conviction
    of 'Failing to yield right-of-way'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failing to yield the right-of-way typically results in 4 points being
    assessed against the driver's license in American Samoa.
- id: 58
  category: driver_responsibility
  question: In American Samoa, how often must a motor vehicle undergo a safety inspection
    to remain legally registered?
  choices:
    A: Every 6 months
    B: Every year
    C: Every 2 years
    D: Only when the vehicle is sold
  answer: B
  explanation: All vehicles in American Samoa must undergo an annual safety inspection
    at an authorized station before the registration can be renewed.
- id: 59
  category: driver_responsibility
  question: Where is a driver required to keep the vehicle's registration certificate
    while operating the vehicle in American Samoa?
  choices:
    A: At home in a safe place
    B: In the vehicle
    C: At the Office of Motor Vehicles
    D: With the vehicle's insurance agent
  answer: B
  explanation: The registration certificate must be carried in the vehicle at all
    times and must be presented upon demand by a police officer.
- id: 60
  category: driver_responsibility
  question: In American Samoa, what is the fine for a person found guilty of littering
    from a motor vehicle?
  choices:
    A: $10 to $50
    B: $50 to $500
    C: Exactly $1,000
    D: There is no fine, only community service
  answer: B
  explanation: ASCA § 22.0331 states that littering from a vehicle is a misdemeanor
    punishable by a fine between $50 and $500.
- id: 61
  category: driver_responsibility
  question: 'A first-time conviction for Driving Under the Influence (DUI) in American
    Samoa can result in a jail sentence of up to:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: Under American Samoa law, a first DUI conviction is a class A misdemeanor
    which carries a potential jail term of up to one year and/or a fine.
- id: 62
  category: driver_responsibility
  question: When stopped by a police officer in American Samoa, which document must
    you provide as proof of financial responsibility?
  choices:
    A: A bank statement showing at least $10,000
    B: A valid certificate of insurance
    C: A notarized letter from your employer
    D: The vehicle's original bill of sale
  answer: B
  explanation: Drivers must present a valid certificate of insurance (Compulsory Third
    Party Insurance) when requested by a law enforcement officer.
- id: 63
  category: driver_responsibility
  question: In American Samoa, the driver is legally responsible for ensuring that
    all passengers under what age are properly restrained by a seat belt or child
    safety seat?
  choices:
    A: Under 12 years old
    B: Under 15 years old
    C: Under 18 years old
    D: Under 21 years old
  answer: B
  explanation: ASCA § 22.0333 mandates that the driver is responsible for ensuring
    passengers under the age of 15 are properly secured.
- id: 64
  category: driver_responsibility
  question: 'In American Samoa, every motor vehicle must be equipped with a muffler
    in good working order to prevent:'
  choices:
    A: Excessive speed
    B: Engine overheating
    C: Unusual or excessive noise
    D: Fuel leaks
  answer: C
  explanation: Vehicle equipment laws in American Samoa require a muffler to prevent
    excessive or unusual noise and annoying smoke.
- id: 65
  category: driver_responsibility
  question: In American Samoa, what is the minimum amount of property damage in an
    accident that requires an immediate report to the police?
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: B
  explanation: According to ASCA § 22.0701, the driver of a vehicle involved in an
    accident resulting in total property damage to an apparent extent of $100 or more
    must immediately notify the police department.
- id: 66
  category: driver_responsibility
  question: Under American Samoa's mandatory insurance law, what is the minimum liability
    coverage required for bodily injury to or death of one person in any one accident?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $20,000
  answer: B
  explanation: ASCA § 22.2003 requires a minimum of $10,000 for bodily injury to or
    death of one person in any one accident.
- id: 67
  category: driver_responsibility
  question: What is the minimum liability insurance coverage required in American
    Samoa for property damage in a single accident?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: American Samoa law (ASCA § 22.2003) mandates a minimum of $5,000 for
    injury to or destruction of property of others in any one accident.
- id: 68
  category: driver_responsibility
  question: When a vehicle is sold or transferred in American Samoa, within how many
    days must the new owner apply for a transfer of registration?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: Under ASCA § 22.1001, the new owner must complete the transfer of registration
    within 10 days of the date of transfer.
- id: 69
  category: driver_responsibility
  question: Where must the registration card for a motor vehicle be kept in American
    Samoa?
  choices:
    A: At the owner's residence
    B: In the glove compartment or carried by the driver
    C: In the trunk of the vehicle
    D: At the Office of Motor Vehicles
  answer: B
  explanation: The registration card must be carried in the vehicle for which it is
    issued or by the person driving the vehicle, to be displayed upon demand by a
    police officer.
- id: 70
  category: driver_responsibility
  question: If you strike an unattended vehicle and cannot find the owner, what is
    your legal responsibility in American Samoa?
  choices:
    A: Wait for 30 minutes, then leave if no one arrives
    B: Leave a written notice with your name, address, and vehicle information in
      a conspicuous place
    C: Report it only if the damage looks like it exceeds $500
    D: Drive to the nearest police station the following day
  answer: B
  explanation: Drivers who strike an unattended vehicle must locate the owner or leave
    a written notice in a conspicuous place providing their contact information and
    an explanation of the accident.
- id: 71
  category: driver_responsibility
  question: Which of the following is a mandatory requirement for all vehicles operated
    on American Samoa public highways?
  choices:
    A: A valid certificate of title
    B: A valid certificate of registration
    C: Proof of liability insurance
    D: All of the above
  answer: D
  explanation: All vehicles must be titled, registered, and insured with at least
    the minimum liability coverage to be legally operated on public roads.
- id: 72
  category: driver_responsibility
  question: What is the penalty for operating a motor vehicle in American Samoa without
    the required liability insurance?
  choices:
    A: A verbal warning only
    B: A fine and potential suspension of driving privileges
    C: Mandatory 30 days in jail
    D: Permanent forfeiture of the vehicle
  answer: B
  explanation: Operating a vehicle without insurance is a violation of the Compulsory
    Insurance Act, which can result in fines and the suspension of the driver's license
    and vehicle registration.
- id: 73
  category: driver_responsibility
  question: In American Samoa, license plates must be attached to which part(s) of
    the vehicle?
  choices:
    A: The rear only
    B: The front only
    C: Both the front and the rear
    D: The rear window
  answer: C
  explanation: American Samoa law requires that license plates be securely fastened
    to both the front and the rear of the vehicle.
- id: 74
  category: driver_responsibility
  question: If a driver is involved in an accident and fails to show proof of financial
    responsibility, what action may the Commissioner take?
  choices:
    A: Increase the driver's taxes
    B: Suspend the driver's license and registration
    C: Require the driver to retake the driving test
    D: Nothing, if the driver was not at fault
  answer: B
  explanation: Under the financial responsibility laws, failure to provide proof of
    insurance following an accident can lead to the suspension of both the operator's
    license and the vehicle's registration.
- id: 75
  category: driver_responsibility
  question: What must be displayed on the vehicle to prove that it has passed the
    required annual safety inspection?
  choices:
    A: A valid inspection sticker on the windshield
    B: A note from the mechanic in the glove box
    C: A special license plate frame
    D: A receipt from the Treasurer's office
  answer: A
  explanation: Upon passing the annual safety inspection, an official inspection sticker
    is issued and must be displayed on the vehicle's windshield.
- id: 76
  category: driver_responsibility
  question: If you change your name due to marriage or court order, how must you update
    your American Samoa driver's license?
  choices:
    A: Wait until the license expires to change it
    B: Write the new name on the back of the current license
    C: Apply for a duplicate license with the new name at the OMV
    D: Notify the police department by phone
  answer: C
  explanation: Any change in legal name requires the driver to apply for a corrected/duplicate
    license at the Office of Motor Vehicles (OMV) to ensure records are accurate.
- id: 77
  category: safe_driving_rules
  question: What is the speed limit when driving through a village or a school zone
    in American Samoa?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The speed limit is reduced to 15 miles per hour when passing through
    villages or designated school zones to ensure the safety of pedestrians and children.
- id: 78
  category: safe_driving_rules
  question: When parking on a downhill grade, in which direction should you turn your
    front wheels if there is a curb?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: A
  explanation: When parking downhill with a curb, turn your wheels toward the curb
    so that if the vehicle rolls, it will be stopped by the curb.
- id: 79
  category: safe_driving_rules
  question: In American Samoa, you must not park within how many feet of a stop sign
    or traffic signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Parking is prohibited within 30 feet of any official flashing signal,
    stop sign, or traffic control signal located at the side of the roadway.
- id: 80
  category: safe_driving_rules
  question: What is the proper hand signal to indicate that you are slowing down or
    stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm facing back
    D: Right arm extended straight out
  answer: C
  explanation: The standard hand signal for slowing or stopping is the left arm extended
    downward with the palm of the hand facing to the rear.
- id: 81
  category: safe_driving_rules
  question: Under American Samoa law, when are you required to turn on your vehicle's
    headlights?
  choices:
    A: Only when it is raining
    B: From 30 minutes after sunset to 30 minutes before sunrise
    C: From sunset to sunrise
    D: Only when driving outside of villages
  answer: B
  explanation: Headlights must be used from one-half hour after sunset to one-half
    hour before sunrise, and at any other time when visibility is less than 500 feet.
- id: 82
  category: safe_driving_rules
  question: If you are involved in a traffic accident in American Samoa that results
    in property damage of $100 or more, what is the legal requirement?
  choices:
    A: You must report it to the police immediately
    B: You only need to exchange insurance information
    C: You have 48 hours to file a report at the station
    D: No report is needed if there are no injuries
  answer: A
  explanation: According to AS Code § 22.0701, accidents involving injury, death,
    or property damage exceeding $100 must be reported to the police immediately.
- id: 83
  category: safe_driving_rules
  question: When two vehicles reach an intersection at the same time where there are
    no stop signs or signals, which driver has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver of the larger vehicle
  answer: B
  explanation: At an uncontrolled intersection, the driver of the vehicle on the left
    must yield the right-of-way to the vehicle on the right.
- id: 84
  category: safe_driving_rules
  question: 'In American Samoa, it is illegal to follow an emergency vehicle (like
    a fire truck or ambulance) closer than:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Drivers are prohibited from following fire apparatus or other emergency
    vehicles responding to an alarm closer than 500 feet.
- id: 85
  category: safe_driving_rules
  question: Which of the following is true regarding U-turns in American Samoa?
  choices:
    A: They are legal anywhere as long as you use a signal
    B: They are prohibited on any curve or near the crest of a hill where visibility
      is less than 500 feet
    C: They are only allowed in school zones
    D: They are strictly prohibited throughout the island
  answer: B
  explanation: U-turns are prohibited on curves or hills where the vehicle cannot
    be seen by other drivers approaching from either direction within 500 feet.
- id: 86
  category: safe_driving_rules
  question: When a driver intends to turn, they must signal their intent continuously
    for at least how many feet before turning?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: A signal of intention to turn right or left shall be given continuously
    during not less than the last 100 feet traveled by the vehicle before turning.
- id: 87
  category: safe_driving_rules
  question: In American Samoa, what is the maximum speed limit in a village or residential
    area unless otherwise posted?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: According to the American Samoa Motor Vehicle laws, the maximum speed
    limit in any village or residential district is 25 miles per hour unless signs
    indicate otherwise.
- id: 88
  category: safe_driving_rules
  question: Under what circumstance is it legal to pass another vehicle on the right
    in American Samoa?
  choices:
    A: When the vehicle ahead is making or about to make a left turn and there is
      sufficient pavement width
    B: When you are in a hurry and the vehicle ahead is going too slow
    C: On a one-lane village road
    D: It is never legal to pass on the right
  answer: A
  explanation: Passing on the right is permitted only when the vehicle overtaken is
    making a left turn and there is enough unobstructed pavement for the move.
- id: 89
  category: safe_driving_rules
  question: What is the recommended following distance behind another vehicle under
    normal driving conditions in American Samoa?
  choices:
    A: One car length
    B: The 'two-second' rule
    C: 50 feet
    D: 100 feet
  answer: B
  explanation: The 'two-second rule' is the standard safety recommendation for maintaining
    a safe following distance behind the vehicle in front of you.
- id: 90
  category: safe_driving_rules
  question: In American Samoa, if you are involved in a traffic accident that results
    in property damage of at least ______, you must report it to the Police Department.
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: B
  explanation: Any accident involving injury, death, or property damage of $100 or
    more must be reported to the American Samoa Police Department immediately.
- id: 91
  category: safe_driving_rules
  question: When using hand signals to indicate a stop or a decrease in speed, what
    is the correct position of the driver's arm?
  choices:
    A: Arm extended straight out
    B: Arm extended upward
    C: Arm extended downward
    D: Arm waving in a circular motion
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the driver
    should extend their left arm out and downward.
- id: 92
  category: safe_driving_rules
  question: 'In American Samoa, you may not make a U-turn on a curve or near the crest
    of a hill if your vehicle cannot be seen by other drivers approaching from either
    direction within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: U-turns are prohibited where visibility is less than 500 feet in either
    direction to prevent collisions with approaching traffic.
- id: 93
  category: safe_driving_rules
  question: When parking a vehicle headed uphill on a two-way street with a curb,
    how should you turn your front wheels?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn the wheels away from the curb
    so that if the vehicle rolls, the back of the tire will hit the curb and stop
    the car.
- id: 94
  category: safe_driving_rules
  question: 'When an emergency vehicle with sirens and flashing lights approaches
    your vehicle from any direction, you must:'
  choices:
    A: Speed up to get out of the way
    B: Stop exactly where you are
    C: Pull to the right edge of the road and stop
    D: Follow the emergency vehicle closely
  answer: C
  explanation: Drivers must yield the right of way to emergency vehicles by pulling
    as close as possible to the right-hand edge or curb and stopping until the vehicle
    has passed.
- id: 95
  category: safe_driving_rules
  question: In American Samoa, who is required by law to wear a seat belt in a private
    passenger vehicle?
  choices:
    A: Only the driver
    B: Only children under 12
    C: The driver and all front-seat passengers
    D: All passengers in the vehicle regardless of seating position
  answer: C
  explanation: American Samoa law requires the driver and all front-seat passengers
    to wear seat belts while the vehicle is in motion.
- id: 96
  category: defensive_driving
  question: In American Samoa, what is the recommended minimum following distance
    you should maintain behind the vehicle in front of you under ideal driving conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 5 seconds
    D: 10 seconds
  answer: B
  explanation: According to the American Samoa Driver's Manual, drivers should maintain
    a minimum following distance of at least two seconds behind the vehicle ahead
    to allow for safe stopping.
- id: 97
  category: defensive_driving
  question: 'When driving in heavy tropical rain in American Samoa, your tires can
    lose all contact with the road. This condition is known as:'
  choices:
    A: Skidding
    B: Hydroplaning
    C: Free-wheeling
    D: Traction-locking
  answer: B
  explanation: Hydroplaning occurs when water on the road surface causes the tires
    to lose contact with the pavement, resulting in a loss of steering and braking
    control.
- id: 98
  category: defensive_driving
  question: 'To avoid last-minute braking or the need to turn suddenly in American
    Samoa village traffic, you should look down the road at least:'
  choices:
    A: 2 to 5 seconds ahead
    B: 5 to 8 seconds ahead
    C: 10 to 15 seconds ahead
    D: 20 to 30 seconds ahead
  answer: C
  explanation: Scanning 10 to 15 seconds ahead allows you to see hazards, pedestrians,
    and aiga buses early enough to react safely.
- id: 99
  category: defensive_driving
  question: In American Samoa, when driving at night, you must dim your high-beam
    headlights when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Under American Samoa traffic laws, you must switch to low beams when
    an oncoming vehicle is within 500 feet to prevent blinding the other driver.
- id: 100
  category: defensive_driving
  question: When driving through heavy fog or extremely heavy rain in American Samoa,
    which lights should you use?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: Low-beam headlights should be used in fog or heavy rain because high
    beams reflect off the water droplets, making it harder for you to see.
- id: 101
  category: defensive_driving
  question: 'When an aiga bus (local transit) is stopped to pick up or drop off passengers
    in American Samoa, a defensive driver should:'
  choices:
    A: Honk and pass quickly
    B: Speed up to get around before passengers exit
    C: Slow down and be prepared for pedestrians crossing the road
    D: Always stop 50 feet behind the bus regardless of traffic
  answer: C
  explanation: Aiga buses often stop in areas where passengers must cross the road
    immediately; defensive driving requires extra caution for pedestrians in these
    zones.
- id: 102
  category: defensive_driving
  question: 'Before changing lanes on a multi-lane road in American Samoa, you should
    check your ''blind spots'' by:'
  choices:
    A: Looking in your rearview mirror
    B: Looking in your side-view mirror
    C: Turning your head and looking over your shoulder
    D: Checking your GPS navigation screen
  answer: C
  explanation: Mirrors do not show everything; you must turn your head to check the
    areas beside and slightly behind your vehicle before changing lanes.
- id: 103
  category: defensive_driving
  question: 'The ''Basic Speed Law'' in American Samoa states that:'
  choices:
    A: You must always drive at the posted speed limit
    B: You may drive 5 mph over the limit if traffic is moving fast
    C: You must never drive faster than is safe for present conditions
    D: The minimum speed on all roads is 15 mph
  answer: C
  explanation: The Basic Speed Law requires drivers to adjust their speed based on
    weather, road conditions, and traffic, regardless of the posted limit.
- id: 104
  category: defensive_driving
  question: 'If the roads in American Samoa are slippery due to rain, you should increase
    your following distance to at least:'
  choices:
    A: 3 seconds
    B: 4 seconds or more
    C: The length of one car
    D: 50 feet exactly
  answer: B
  explanation: On wet or slippery roads, you should double the standard two-second
    following distance to at least four seconds to ensure enough stopping time.
- id: 105
  category: defensive_driving
  question: If an oncoming vehicle's high-beam headlights are blinding you, where
    should you look to maintain your lane position?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: Toward the right edge of your lane
    D: Close your eyes briefly until the car passes
  answer: C
  explanation: To avoid being blinded by glare, look toward the right edge of your
    lane (the white line or road edge) to guide your steering.
- id: 106
  category: defensive_driving
  question: In American Samoa, the speed limit in a designated village area is generally
    15 mph. Why is this a critical defensive driving rule?
  choices:
    A: To save fuel
    B: Because of frequent pedestrian activity and children near the road
    C: To prevent noise pollution
    D: Because the roads are too narrow for higher speeds
  answer: B
  explanation: Village areas in American Samoa have high pedestrian traffic, including
    children and elderly residents; 15 mph allows for immediate stopping if someone
    enters the road.
- id: 107
  category: defensive_driving
  question: 'If you encounter a flooded section of road after a heavy tropical downpour
    in American Samoa, the safest action is to:'
  choices:
    A: Drive through quickly to avoid stalling
    B: Shift into neutral and coast through
    C: Turn around and find another route
    D: Follow the car in front of you closely
  answer: C
  explanation: You should never drive through flooded roads. Water can hide deep potholes,
    wash away the road, or stall your engine, leading to a dangerous situation.
- id: 108
  category: defensive_driving
  question: In American Samoa, 'tailgating' (following too closely) is a primary cause
    of rear-end collisions. Under the point system, following too closely can result
    in how many points on your record?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Under the American Samoa point system, following too closely is typically
    a 2-point violation.
- id: 109
  category: defensive_driving
  question: When scanning for hazards in American Samoa, which of the following is
    a common 'hidden' hazard you should watch for near the roadside?
  choices:
    A: Snow drifts
    B: Stray animals such as dogs or pigs
    C: Icy patches
    D: Tumbleweeds
  answer: B
  explanation: In American Samoa, defensive drivers must constantly scan for stray
    animals (dogs, pigs) that may suddenly dart into the road.
- id: 110
  category: defensive_driving
  question: If your brakes stop working while driving on a steep hill in Tutuila,
    what is the first defensive action you should take?
  choices:
    A: Turn off the engine immediately
    B: Shift to a lower gear and pump the brake pedal
    C: Jump out of the vehicle
    D: Put the car in 'Park'
  answer: B
  explanation: If brakes fail, shifting to a lower gear uses the engine to slow the
    car, and pumping the brake pedal may build up enough hydraulic pressure to stop.
- id: 111
  category: defensive_driving
  question: To avoid the need for last-minute braking or turning in American Samoa
    traffic, how far ahead should you scan the road?
  choices:
    A: 5 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: Only the car directly in front of you
  answer: B
  explanation: Scanning 10 to 15 seconds ahead allows you to see hazards early and
    plan your movements safely on American Samoa's roads.
- id: 112
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet road in American Samoa,
    what is the safest action to take?
  choices:
    A: Brake hard immediately
    B: Turn the steering wheel sharply
    C: Ease your foot off the gas pedal and keep the steering wheel straight
    D: Shift the car into neutral
  answer: C
  explanation: Hydroplaning occurs when tires lose contact with the road. The safest
    response is to slow down gradually by releasing the accelerator and avoiding sudden
    steering or braking.
- id: 113
  category: defensive_driving
  question: In American Samoa, when are roads typically the most slippery during a
    rainstorm?
  choices:
    A: After it has been raining for several hours
    B: Just as it starts to rain
    C: When the rain stops and the sun comes out
    D: Only during a tropical cyclone
  answer: B
  explanation: Roads are most slippery right as it starts to rain because the water
    mixes with oil and dust on the road surface that has not yet been washed away.
- id: 114
  category: defensive_driving
  question: 'When driving at night in American Samoa, you should dim your high beams
    when following another vehicle within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: You should dim your high beams when following another vehicle within
    300 feet to prevent glare in the lead driver's rearview mirror.
- id: 115
  category: defensive_driving
  question: If you are being tailgated on a two-lane road in American Samoa, what
    is the best defensive driving practice?
  choices:
    A: Speed up to get away from the tailgater
    B: Tap your brakes repeatedly to warn them
    C: Slow down gradually to encourage them to pass or to increase your own safety
      cushion
    D: Stop your vehicle in the middle of the lane
  answer: C
  explanation: Slowing down allows the tailgater to pass more easily and increases
    the space in front of you, giving you more time to react if you need to brake
    suddenly.
- id: 116
  category: defensive_driving
  question: 'In American Samoa, you must use your headlights whenever visibility is
    reduced to less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: One mile
  answer: B
  explanation: Headlights are required in American Samoa whenever you cannot see clearly
    for at least 500 feet due to rain, fog, or darkness.
- id: 117
  category: defensive_driving
  question: When scanning for hazards at an intersection in a village area, what is
    the correct sequence?
  choices:
    A: Look left, then right
    B: Look right, then left
    C: Look left, then right, then left again
    D: Look straight ahead only
  answer: C
  explanation: Because traffic from the left is closer to you, you should look left
    first, then right, then left again to ensure no new hazards have appeared.
- id: 118
  category: defensive_driving
  question: When following a large truck or bus in American Samoa, why should you
    maintain a greater following distance than you would for a car?
  choices:
    A: Because trucks travel faster than cars
    B: To allow the truck driver to see you in their side mirrors
    C: Because trucks have better brakes than cars
    D: To prevent the truck from rolling backward
  answer: B
  explanation: If you follow a large vehicle too closely, you are in their 'No-Zone'
    (blind spot). Increasing your distance ensures the driver can see you in their
    mirrors.
- id: 119
  category: defensive_driving
  question: If an oncoming vehicle at night fails to dim their high beams, where should
    you look to avoid being temporarily blinded?
  choices:
    A: At the oncoming vehicle's headlights
    B: At the center line of the road
    C: Toward the right edge of your lane
    D: Close your eyes briefly
  answer: C
  explanation: Looking toward the right edge of the lane (or the white line) helps
    you stay on course while minimizing the glare from the oncoming high beams.
- id: 120
  category: defensive_driving
  question: In American Samoa, what is the best way to prevent 'highway hypnosis'
    or fatigue during longer drives?
  choices:
    A: Stare at the center of the road
    B: Keep your eyes moving and scan the surroundings
    C: Turn off the radio and drive in silence
    D: Drink coffee and drive faster to reach your destination
  answer: B
  explanation: Keeping your eyes moving and scanning the road helps maintain alertness
    and prevents your brain from entering a trance-like state.
- id: 121
  category: defensive_driving
  question: When entering a curve on a slippery road in American Samoa, when is the
    safest time to slow down?
  choices:
    A: Before you enter the curve
    B: While you are in the middle of the curve
    C: As you are exiting the curve
    D: Only if you feel the car sliding
  answer: A
  explanation: You should always reduce your speed before entering a curve. Braking
    while in a curve on a slippery road can cause your vehicle to skid.
- id: 122
  category: alcohol_drugs_health
  question: What is the mandatory license suspension period for a first-time refusal
    to submit to a chemical test in American Samoa?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Under ASCA § 22.0708, if a person under arrest refuses to submit to
    a chemical test, the Commissioner shall suspend their license or permit to drive
    for a period of 6 months.
- id: 123
  category: alcohol_drugs_health
  question: If you are taking prescription medication, what is your responsibility
    before driving in American Samoa?
  choices:
    A: You may drive as long as you have the prescription with you
    B: You must check the label for warnings or ask a doctor about the drug's effects
      on driving
    C: You can drive as long as you don't mix it with alcohol
    D: Prescription drugs never affect driving ability
  answer: B
  explanation: Many prescription and over-the-counter drugs can cause drowsiness or
    impairment. It is the driver's responsibility to ensure they are not impaired,
    as you can be convicted of DUI for driving under the influence of legal medications.
- id: 124
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your Blood Alcohol Concentration
    (BAC) after drinking?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Exercising or running
    D: Giving your body time to process the alcohol
  answer: D
  explanation: Time is the only factor that will lower BAC. The body metabolizes alcohol
    at a steady rate, and 'quick fixes' like coffee or showers do not speed up this
    process.
- id: 125
  category: alcohol_drugs_health
  question: 'In American Samoa, a driver can be charged with DUI if they are under
    the influence of:'
  choices:
    A: Alcohol only
    B: Illegal narcotics only
    C: Alcohol, illegal drugs, or any controlled substance that impairs driving ability
    D: Only substances that have a BAC measurement
  answer: C
  explanation: DUI laws in American Samoa apply to alcohol as well as any drug or
    controlled substance (including prescription and over-the-counter meds) that renders
    a person incapable of safely operating a vehicle.
- id: 126
  category: alcohol_drugs_health
  question: 'For commercial driver''s license (CDL) holders in American Samoa, the
    legal BAC limit while operating a commercial vehicle is:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: In accordance with federal and territorial regulations, the BAC limit
    for commercial drivers operating a commercial motor vehicle is 0.04%.
- id: 127
  category: alcohol_drugs_health
  question: 'If an American Samoa driver is involved in a fatal accident and is suspected
    of DUI, the chemical test:'
  choices:
    A: Requires a written warrant in all cases
    B: Can be administered without consent if there is probable cause
    C: Is optional and cannot be used in court
    D: Is only required if the driver is over 21
  answer: B
  explanation: In serious accidents involving death or significant injury, law enforcement
    may require a blood test if there is probable cause of intoxication, often supported
    by the implied consent statutes.
- id: 128
  category: alcohol_drugs_health
  question: What effect does combining alcohol with another drug (like a cold pill)
    have on a driver?
  choices:
    A: The effects of the alcohol are cancelled out
    B: The drug will reduce the BAC level
    C: It creates a synergistic effect, making the impairment much worse than either
      alone
    D: There is no combined effect on driving
  answer: C
  explanation: Combining alcohol with other drugs, even over-the-counter ones, can
    multiply the effects of both, leading to severe impairment of judgment and motor
    skills.
- id: 129
  category: alcohol_drugs_health
  question: 'In American Samoa, if you have a physical or mental condition that may
    affect your ability to drive safely (such as epilepsy), you must:'
  choices:
    A: Surrender your license immediately
    B: Report the condition to the Office of Motor Vehicles (OMV)
    C: Only drive during daylight hours
    D: Have a passenger with you at all times
  answer: B
  explanation: Drivers are legally required to disclose medical conditions that could
    impair their ability to operate a vehicle safely. The OMV may require a medical
    evaluation to determine if a license can be issued or maintained.
- id: 130
  category: alcohol_drugs_health
  question: Which of the following is a symptom of driving while fatigued (drowsy
    driving)?
  choices:
    A: Increased alertness
    B: Faster reaction times
    C: Drifting from your lane or hitting 'rumble strips'
    D: Improved peripheral vision
  answer: C
  explanation: Fatigue slows reaction time and decreases awareness. Drifting from
    a lane or difficulty keeping eyes focused are major warning signs that a driver
    should pull over and rest.
- id: 131
  category: alcohol_drugs_health
  question: In American Samoa, how does alcohol first affect a driver's ability?
  choices:
    A: It improves coordination
    B: It impairs judgment and self-control
    C: It sharpens the vision
    D: It makes the driver more cautious
  answer: B
  explanation: Alcohol affects the brain's higher functions first. Judgment and the
    ability to process information are impaired long before physical symptoms like
    staggering or slurred speech appear.
- id: 132
  category: alcohol_drugs_health
  question: What is the maximum jail sentence for a first-time DUI conviction in American
    Samoa?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under the American Samoa Code, a first-offense DUI is a Class A misdemeanor,
    which carries a maximum penalty of up to one year in jail.
- id: 133
  category: alcohol_drugs_health
  question: 'Under American Samoa''s ''Implied Consent'' law, by driving on public
    roads, you have given your consent to:'
  choices:
    A: A search of your vehicle's trunk
    B: A chemical test of your breath, blood, or urine
    C: A review of your medical records
    D: The impoundment of your vehicle at any time
  answer: B
  explanation: Implied consent means that any person who operates a motor vehicle
    in American Samoa is deemed to have given consent to a chemical test of their
    breath, blood, or urine for the purpose of determining alcohol or drug content.
- id: 134
  category: alcohol_drugs_health
  question: In American Samoa, if a driver refuses to submit to a chemical test for
    alcohol, what is the immediate consequence regarding their driving privilege?
  choices:
    A: They are given a warning
    B: Their license is suspended for at least 6 months
    C: They must pay a $50 fine
    D: Nothing happens until they are convicted in court
  answer: B
  explanation: Refusal to submit to a chemical test under the Implied Consent law
    results in an administrative license suspension, typically for a period of 6 months
    to 1 year for a first refusal.
- id: 135
  category: alcohol_drugs_health
  question: What is the legal BAC limit for drivers of commercial motor vehicles in
    American Samoa?
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: In alignment with federal standards adopted by the territory, the BAC
    limit for commercial drivers (CDL holders) is 0.04%.
- id: 136
  category: alcohol_drugs_health
  question: If you are convicted of a DUI in American Samoa and it is your first offense,
    what is the maximum jail sentence you could face?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: Under ASCA, a person convicted of a first-offense DUI may be sentenced
    to a term of imprisonment not to exceed one year.
- id: 137
  category: alcohol_drugs_health
  question: How does the consumption of alcohol affect your driving abilities?
  choices:
    A: It improves your reflexes
    B: It helps you focus better on the road
    C: It slows your reaction time and impairs judgment
    D: It has no effect if you only drink beer
  answer: C
  explanation: Alcohol is a depressant that slows down the central nervous system,
    leading to slower reaction times, impaired coordination, and poor decision-making.
- id: 138
  category: alcohol_drugs_health
  question: Can you be arrested for DUI in American Samoa if you are driving under
    the influence of legally prescribed medication?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI only applies to alcohol and illegal drugs
    C: Yes, if the medication impairs your ability to drive safely
    D: Only if you also have alcohol in your system
  answer: C
  explanation: The law applies to any substance that impairs a person's ability to
    operate a vehicle safely, including prescription and over-the-counter medications.
- id: 139
  category: alcohol_drugs_health
  question: 'In American Samoa, a driver may be charged with a more serious ''Aggravated
    DUI'' if they are caught driving drunk with:'
  choices:
    A: A broken taillight
    B: A passenger under the age of 16
    C: No spare tire in the trunk
    D: An expired registration
  answer: B
  explanation: Driving under the influence with a minor passenger is considered an
    aggravating factor that can lead to enhanced penalties and higher charges.
- id: 140
  category: alcohol_drugs_health
  question: 'If you are involved in a traffic accident in American Samoa and a police
    officer suspects you have been drinking, they may:'
  choices:
    A: Wait 24 hours before testing you
    B: Require you to perform field sobriety tests and a chemical test
    C: Only test you if someone was killed
    D: Not test you if you claim it wasn't your fault
  answer: B
  explanation: Police officers have the authority to request field sobriety tests
    and chemical testing if they have reasonable suspicion of impairment following
    an accident.
- id: 141
  category: alcohol_drugs_health
  question: What happens to the effects of alcohol when it is combined with other
    drugs, such as marijuana or cold medicine?
  choices:
    A: The effects of both are cancelled out
    B: The effects are multiplied (synergistic effect)
    C: There is no change in impairment
    D: The alcohol becomes less potent
  answer: B
  explanation: Combining alcohol with other drugs often produces a synergistic effect,
    meaning the total impairment is much greater than the sum of the parts.
- id: 142
  category: alcohol_drugs_health
  question: 'In American Samoa, if you are convicted of a second DUI within a 5-year
    period, the mandatory minimum jail time is:'
  choices:
    A: 48 hours
    B: 10 days
    C: 30 days
    D: 90 days
  answer: B
  explanation: Repeat offenders face significantly harsher penalties, including mandatory
    minimum jail sentences (often 10 days or more) and longer license revocations.
- id: 143
  category: alcohol_drugs_health
  question: Which of the following medical conditions must be reported to the Office
    of Motor Vehicles in American Samoa because it may affect driving safety?
  choices:
    A: Seasonal allergies
    B: Epilepsy or seizure disorders
    C: A common cold
    D: Mild nearsightedness corrected by glasses
  answer: B
  explanation: Conditions that cause loss of consciousness or control, such as epilepsy,
    must be reported to ensure the driver is medically fit to operate a vehicle safely.
- id: 144
  category: penalties_and_points
  question: How many points are added to an American Samoa driving record for exceeding
    the speed limit by more than 16 miles per hour?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Speeding violations of 16 mph or more over the posted limit result
    in 6 points being added to the driver's record in American Samoa.
- id: 145
  category: penalties_and_points
  question: In American Samoa, what is the point penalty for failing to stop for a
    school bus that is loading or unloading students?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Failing to stop for a school bus is a major safety violation in American
    Samoa and results in 6 points on the driver's record.
- id: 146
  category: penalties_and_points
  question: What is the maximum fine for a littering conviction involving throwing
    trash from a motor vehicle in American Samoa?
  choices:
    A: Up to $100
    B: Up to $250
    C: Up to $500
    D: Up to $1,000
  answer: C
  explanation: Under ASCA § 22.0331, littering from a vehicle is a serious offense
    in American Samoa, punishable by a fine of up to $500.
- id: 147
  category: penalties_and_points
  question: In American Samoa, how many points are assessed for 'following too closely'
    (tailgating)?
  choices:
    A: 1 point
    B: 2 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Following too closely is a 4-point violation under the American Samoa
    motor vehicle point system.
- id: 148
  category: penalties_and_points
  question: What is the point penalty for failing to yield the right-of-way in American
    Samoa?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failure to yield the right-of-way to other vehicles or pedestrians
    results in 4 points being added to your driving record.
- id: 149
  category: penalties_and_points
  question: In American Samoa, how many points are assessed for making an illegal
    or improper turn?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Improper turns, such as turning from the wrong lane or making an illegal
    U-turn, result in 3 points on the driver's record.
- id: 150
  category: penalties_and_points
  question: What is the standard fine for a first-time violation of the mandatory
    seat belt law in American Samoa?
  choices:
    A: Up to $25
    B: Up to $100
    C: Up to $250
    D: Up to $500
  answer: A
  explanation: The fine for failing to wear a seat belt or ensuring passengers are
    buckled in American Samoa is generally $25 for the first offense.
- id: 151
  category: penalties_and_points
  question: In American Samoa, how many points are added to your record for failing
    to stop at a stop sign or a red light?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Disobeying a stop sign or a traffic signal (red light) results in 4
    points being assessed against your driving record.
- id: 152
  category: penalties_and_points
  question: A driver convicted of 'Careless Driving' in American Samoa will receive
    how many points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Careless driving, which is less severe than reckless driving, results
    in 4 points on the American Samoa driving record.
- id: 153
  category: penalties_and_points
  question: What is the penalty for parking a vehicle in a space designated for persons
    with disabilities without a proper placard in American Samoa?
  choices:
    A: A warning for the first offense
    B: A fine of at least $100
    C: Mandatory license suspension for 30 days
    D: 2 points on the driving record
  answer: B
  explanation: Illegal parking in a disabled space in American Samoa is a serious
    violation and carries a fine of at least $100.
- id: 154
  category: penalties_and_points
  question: In American Samoa, if your license is suspended due to the accumulation
    of points, what must you do to get it back after the suspension period ends?
  choices:
    A: Nothing, it is mailed back automatically
    B: Pay a reinstatement fee and potentially retake the driving exam
    C: Wait 12 months after the suspension ends
    D: Submit a letter of apology to the Governor
  answer: B
  explanation: To reinstate a suspended license in American Samoa, the driver must
    wait for the suspension period to expire, pay the required reinstatement fees,
    and may be required to retake the written or road tests.
- id: 155
  category: penalties_and_points
  question: If you are convicted of speeding 11 miles per hour or more over the posted
    speed limit in American Samoa, how many points will be added to your record?
  choices:
    A: 2 points
    B: 3 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: In American Samoa, speeding 11 mph or more over the limit results in
    6 points, while speeding 1 to 10 mph over the limit results in 3 points.
- id: 156
  category: penalties_and_points
  question: In American Samoa, what is the point penalty for disregarding a stop sign
    or a traffic signal?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Disregarding a stop sign or a red light in American Samoa results in
    4 points being assessed against your driving privilege.
- id: 157
  category: penalties_and_points
  question: Failure to yield the right-of-way to another vehicle or pedestrian in
    American Samoa results in how many points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Failure to yield the right-of-way is categorized as a 4-point violation
    in American Samoa.
- id: 158
  category: penalties_and_points
  question: If a driver is involved in an accident involving property damage and leaves
    the scene without identifying themselves, how many points are assessed?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Leaving the scene of an accident involving property damage results
    in 6 points in American Samoa.
- id: 159
  category: penalties_and_points
  question: For drivers age 21 and older in American Samoa, what is the legal Blood
    Alcohol Concentration (BAC) limit for being considered Driving Under the Influence
    (DUI)?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: The legal BAC limit for adult drivers (21 and over) in American Samoa
    is 0.08%.
- id: 160
  category: penalties_and_points
  question: If you are caught driving while your license is suspended or revoked in
    American Samoa, what is the potential penalty?
  choices:
    A: A fine only
    B: A verbal warning
    C: Fines, possible imprisonment, and an extension of the suspension
    D: There is no additional penalty if you have insurance
  answer: C
  explanation: Driving with a suspended or revoked license is a serious offense in
    American Samoa, punishable by fines, jail time, and additional suspension periods.
- id: 161
  category: penalties_and_points
  question: In American Samoa, how many points can be removed from your driving record
    if you successfully complete an approved Driver Improvement Program?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: Drivers in American Samoa may have 2 points removed from their record
    upon successful completion of a certified Driver Improvement Program (defensive
    driving course).
- id: 162
  category: sharing_the_road
  question: When an emergency vehicle (police, fire, or ambulance) is approaching
    with its siren and flashing lights on, what is the driver required to do in American
    Samoa?
  choices:
    A: Speed up to get out of the way
    B: Maintain speed and stay in the current lane
    C: Pull to the right edge of the road and stop until the vehicle has passed
    D: Stop immediately in the middle of the lane
  answer: C
  explanation: Drivers must yield the right-of-way to emergency vehicles by pulling
    as far to the right as possible and stopping until the emergency vehicle has passed
    safely.
- id: 163
  category: sharing_the_road
  question: What is the legal requirement for motorcycle riders regarding helmets
    in American Samoa?
  choices:
    A: Only riders under 18 must wear a helmet
    B: Helmets are optional if the rider has 2 years of experience
    C: All operators and passengers must wear a safety helmet
    D: Helmets are only required on highways with speeds over 25 mph
  answer: C
  explanation: American Samoa law requires all persons operating or riding upon a
    motorcycle or motor-driven cycle to wear a safety helmet.
- id: 164
  category: sharing_the_road
  question: 'When sharing the road with a bicycle in American Samoa, a motorist should:'
  choices:
    A: Honk the horn to warn the cyclist to get off the road
    B: Treat the bicycle as a vehicle with the same rights and responsibilities
    C: Force the cyclist onto the shoulder to allow cars to pass
    D: Always have the right of way over the cyclist
  answer: B
  explanation: Bicyclists have the same rights and responsibilities as motor vehicle
    drivers. Motorists must treat them as legal road users and provide adequate space.
- id: 165
  category: sharing_the_road
  question: Large trucks have 'No-Zones' where the driver cannot see your vehicle.
    Where are these blind spots typically located?
  choices:
    A: Only directly behind the truck
    B: Only on the left side of the truck
    C: Directly in front, directly behind, and on both sides of the truck
    D: There are no blind spots if the truck has mirrors
  answer: C
  explanation: The 'No-Zone' represents the danger areas around trucks where crashes
    are most likely to occur because the truck driver has limited or no visibility.
- id: 166
  category: sharing_the_road
  question: In American Samoa, what must you do when you see a pedestrian carrying
    a white cane or using a guide dog?
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution
    C: Stop and yield the right-of-way, as they are blind or visually impaired
    D: Drive around them if there is enough room
  answer: C
  explanation: Drivers must yield the right-of-way to any pedestrian who is blind
    or visually impaired, often identified by a white cane or guide dog.
- id: 167
  category: sharing_the_road
  question: In American Samoa, how many points are added to your license for 'Passing
    a stopped school bus'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Illegally passing a stopped school bus is a serious violation in American
    Samoa and results in 4 points on the driver's record.
- id: 168
  category: sharing_the_road
  question: If you are driving behind a large truck and cannot see the truck's side
    mirrors, what does this indicate?
  choices:
    A: The truck driver can see you better
    B: You are in the truck driver's blind spot (No-Zone)
    C: The truck is about to turn
    D: You are at a safe following distance
  answer: B
  explanation: 'A general rule for sharing the road with trucks is: ''If you can''t
    see the driver in their mirrors, the driver can''t see you.'''
- id: 169
  category: sharing_the_road
  question: 'When a pedestrian is crossing the street in a village area where there
    are no marked crosswalks, the driver should:'
  choices:
    A: Maintain speed because the pedestrian is jaywalking
    B: Yield the right-of-way to the pedestrian
    C: Honk and signal the pedestrian to move faster
    D: Only stop if the pedestrian is a child
  answer: B
  explanation: Drivers in American Samoa are expected to exercise due care to avoid
    colliding with any pedestrian, regardless of whether a crosswalk is marked, especially
    in village areas.
- id: 170
  category: sharing_the_road
  question: What is the minimum distance you should maintain when following an emergency
    vehicle that is responding to a call?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: It is generally illegal and unsafe to follow an emergency vehicle closer
    than 500 feet when it is responding to an emergency.
- id: 171
  category: sharing_the_road
  question: When turning right, a motorist should be particularly alert for which
    road users who may be traveling straight on the right side of the vehicle?
  choices:
    A: Other cars
    B: Bicyclists
    C: Heavy trucks
    D: Tractors
  answer: B
  explanation: Bicyclists often ride on the right side of the road. Motorists must
    check their blind spots and yield to cyclists before making a right turn.
- id: 172
  category: sharing_the_road
  question: 'In American Samoa, if a slow-moving vehicle is being followed by 5 or
    more vehicles on a road where passing is unsafe, the driver of the slow vehicle
    should:'
  choices:
    A: Speed up above the limit
    B: Pull off the road at the first safe turnout to let others pass
    C: Stop in the lane to let others pass
    D: Ignore the other vehicles
  answer: B
  explanation: To maintain traffic flow and safety, slow-moving vehicles should pull
    over at safe locations to allow accumulated traffic to pass.
- id: 173
  category: sharing_the_road
  question: Why is it dangerous to pass a large truck that is signaling a right turn
    at an intersection?
  choices:
    A: Trucks turn faster than cars
    B: Trucks often need to swing wide to the left to complete a right turn, and you
      may be squeezed between the truck and the curb
    C: Trucks have no brakes while turning
    D: The truck might tip over
  answer: B
  explanation: Large vehicles require more space to turn. They may swing into the
    left lane to clear the curb on a right turn; attempting to pass on the right is
    extremely dangerous.
- id: 174
  category: sharing_the_road
  question: 'When an emergency vehicle (police, fire, or ambulance) is approaching
    using a siren and flashing lights, American Samoa law requires you to:'
  choices:
    A: Speed up to get out of the way
    B: Pull to the right edge of the road and stop
    C: Stop exactly where you are in the middle of the lane
    D: Follow the vehicle to see where the emergency is
  answer: B
  explanation: Drivers must yield the right-of-way to emergency vehicles by pulling
    as far to the right as possible and stopping until the vehicle has passed.
- id: 175
  category: sharing_the_road
  question: In American Samoa, what is the mandatory requirement for motorcycle operators
    and their passengers regarding safety gear?
  choices:
    A: Helmets are only required for those under 18
    B: Helmets are optional if the speed limit is under 25 mph
    C: Both the operator and passenger must wear a safety helmet at all times
    D: Only the operator is required to wear a helmet
  answer: C
  explanation: ASCA § 22.1101 requires that every person operating or riding on a
    motorcycle or motor-driven cycle on public highways must wear a safety helmet.
- id: 176
  category: sharing_the_road
  question: 'When walking along a road in American Samoa where there are no sidewalks,
    pedestrians should walk:'
  choices:
    A: On the right side with the flow of traffic
    B: On the left side facing oncoming traffic
    C: In the middle of the road to be more visible
    D: On whichever side has more shade
  answer: B
  explanation: For safety, pedestrians should walk on the left side of the road facing
    oncoming traffic so they can see vehicles approaching them.
- id: 177
  category: sharing_the_road
  question: When sharing the road with large trucks, drivers should avoid the 'No-Zone.'
    What is the 'No-Zone'?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the truck
    C: The designated lane for public buses
    D: The speed limit zone for heavy vehicles
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the truck driver cannot see other vehicles, increasing the risk of a collision.
- id: 178
  category: sharing_the_road
  question: 'In American Samoa, a bicyclist riding on the roadway is:'
  choices:
    A: Required to follow the same traffic laws as motor vehicle drivers
    B: Considered a pedestrian and should ride against traffic
    C: Allowed to ignore stop signs and traffic lights
    D: Required to stay on the sidewalk at all times
  answer: A
  explanation: Bicyclists have the same rights and responsibilities as drivers of
    motor vehicles and must obey all traffic signs, signals, and lane markings.
- id: 179
  category: sharing_the_road
  question: 'When a blind pedestrian is crossing the street using a white cane or
    a guide dog, you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Drive around them quickly
    C: Yield the right-of-way and stop your vehicle
    D: Wait for them to cross, then yell that it is clear
  answer: C
  explanation: Drivers must yield the right-of-way to any blind pedestrian carrying
    a white cane or accompanied by a guide dog.
- id: 180
  category: sharing_the_road
  question: 'When a large truck or bus is making a right turn at an intersection,
    drivers should be aware that:'
  choices:
    A: The truck will stay in the far right lane throughout the turn
    B: The truck may need to swing wide to the left to complete the turn
    C: The truck can stop instantly if you move into its path
    D: The truck has the right-of-way over all traffic signals
  answer: B
  explanation: Large vehicles need more space to turn and often swing wide to the
    left to clear the curb on a right turn. Drivers should never try to squeeze between
    the truck and the curb.
- id: 181
  category: sharing_the_road
  question: 'In American Samoa, ''lane splitting'' (a motorcycle driving between rows
    of stopped or moving vehicles in the same lane) is:'
  choices:
    A: Legal if the motorcycle is going under 15 mph
    B: Encouraged to reduce traffic congestion
    C: Illegal and unsafe
    D: Legal during daylight hours only
  answer: C
  explanation: Motorcycles are entitled to the full use of a lane, and lane splitting
    (sharing a lane with a car or driving between lanes) is considered illegal and
    dangerous.
- id: 182
  category: sharing_the_road
  question: 'If you are following a bicycle at night, you should use your low-beam
    headlights because:'
  choices:
    A: High beams can blind the bicyclist
    B: High beams are illegal in American Samoa at night
    C: Low beams help the bicyclist see the road better
    D: Bicycles are required to have mirrors that reflect high beams
  answer: A
  explanation: High beams can temporarily blind a bicyclist, just as they can a motorist.
    Always use low beams when approaching or following other road users.
- id: 183
  category: sharing_the_road
  question: Under American Samoa law, when are you allowed to pass a stopped school
    bus that has its red lights flashing?
  choices:
    A: When you are in a hurry and the bus driver waves you on
    B: Never, unless the red lights stop flashing and the stop arm is retracted
    C: If there are no children visible on the road
    D: If the road has at least three lanes
  answer: B
  explanation: It is illegal to pass a stopped school bus with its red lights flashing
    and stop arm extended. You must wait until the signals are turned off.
- id: 184
  category: sharing_the_road
  question: Bicycles operated at night in American Samoa must be equipped with which
    of the following?
  choices:
    A: A white light on the front and a red reflector on the rear
    B: A bell or horn audible for 500 feet
    C: Neon lights on the spokes
    D: A yellow flag at least 6 feet high
  answer: A
  explanation: For night riding, bicycles must have a front lamp emitting a white
    light and a rear red reflector to be visible to other motorists.
- id: 185
  category: sharing_the_road
  question: 'When you see a pedestrian in a crosswalk that is not controlled by a
    traffic signal, you must:'
  choices:
    A: Slow down and proceed if they are not in your lane
    B: Yield the right-of-way and stop to let the pedestrian cross
    C: Honk to tell the pedestrian to hurry up
    D: Maintain your speed as pedestrians must yield to cars
  answer: B
  explanation: Drivers must yield the right-of-way to pedestrians within any marked
    or unmarked crosswalk at an intersection.
- id: 186
  category: vehicle_information
  question: 'According to American Samoa law, every motor vehicle must be equipped
    with a horn in good working order capable of emitting sound audible under normal
    conditions from a distance of not less than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Under American Samoa Code Annotated (ASCA) Title 22, a vehicle's horn
    must be audible from a distance of at least 200 feet.
- id: 187
  category: vehicle_information
  question: In American Samoa, what is the minimum required light transmission percentage
    for a sun screening device (window tint) on the windshield and front side windows?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 20%
  answer: C
  explanation: ASCA 22.0345 specifies that no person shall operate a motor vehicle
    with window tinting that allows less than 70% light transmission on the windshield
    and front side windows.
- id: 188
  category: vehicle_information
  question: 'Every motor vehicle in American Samoa must be equipped with at least
    one mirror so located as to reflect to the driver a view of the highway for a
    distance of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: American Samoa regulations require a rearview mirror that provides
    a view of the highway for at least 200 feet to the rear of the vehicle.
- id: 189
  category: vehicle_information
  question: 'In American Samoa, the service brakes on a passenger vehicle must be
    capable of stopping the vehicle from a speed of 20 miles per hour within a distance
    of:'
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 40 feet
  answer: C
  explanation: ASCA Title 22 requires that the service brakes on a standard passenger
    vehicle be able to stop the vehicle within 30 feet when traveling at 20 mph on
    a dry, level pavement.
- id: 190
  category: vehicle_information
  question: When are headlights required to be turned on in American Samoa?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: Only when it is raining
    C: From sunset to sunrise and whenever visibility is less than 500 feet
    D: Only when driving outside of Pago Pago
  answer: C
  explanation: Headlights must be used from sunset to sunrise and at any other time
    when visibility is reduced to less than 500 feet due to weather or other conditions.
- id: 191
  category: vehicle_information
  question: 'A tail lamp on a vehicle in American Samoa must be red in color and must
    be visible from a distance of:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Tail lamps must emit a red light plainly visible from a distance of
    500 feet to the rear of the vehicle.
- id: 192
  category: vehicle_information
  question: In American Samoa, what is the minimum legal tread depth for tires on
    a passenger vehicle?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and will fail inspection in American Samoa
    if they have less than 2/32 of an inch of tread depth.
- id: 193
  category: vehicle_information
  question: 'The rear registration plate (license plate) on a vehicle in American
    Samoa must be illuminated by a white light so that it is clearly legible from
    a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The license plate lamp must be designed to render the registration
    plate legible from a distance of 50 feet to the rear.
- id: 194
  category: vehicle_information
  question: Under American Samoa law, which of the following is PROHIBITED regarding
    vehicle exhaust systems?
  choices:
    A: Using a muffler that has been repaired
    B: Using a muffler cutout, bypass, or similar device
    C: Using a muffler that reduces noise
    D: Using a muffler made of stainless steel
  answer: B
  explanation: ASCA 22.0343 prohibits the use of a muffler cutout, bypass, or similar
    device upon a motor vehicle on a highway.
- id: 195
  category: vehicle_information
  question: 'In American Samoa, high-beam headlights must be adjusted so that they
    reveal persons and vehicles at a distance of at least:'
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: High-beam headlights (multiple-beam road-lighting equipment) must be
    aimed and of sufficient intensity to reveal persons and vehicles at least 350
    feet ahead.
- id: 196
  category: vehicle_information
  question: 'In American Samoa, every motor vehicle must be equipped with a parking
    brake that is capable of holding the vehicle on:'
  choices:
    A: Any grade on which it is operated
    B: Only flat surfaces
    C: A 5% grade only
    D: A 10% grade only
  answer: A
  explanation: The parking brake must be capable of holding the vehicle stationary
    on any grade upon which it is operated, under all conditions of loading.
- id: 197
  category: vehicle_information
  question: 'In American Samoa, it is illegal to operate a motor vehicle that emits:'
  choices:
    A: Any visible water vapor
    B: Excessive or unusual noise or annoying smoke
    C: Sound from a standard factory radio
    D: Air from the air conditioning unit
  answer: B
  explanation: ASCA 22.0343 states that every motor vehicle shall be equipped with
    a muffler to prevent excessive or unusual noise and annoying smoke.
- id: 198
  category: vehicle_information
  question: 'Under American Samoa law, every motor vehicle must be equipped with a
    horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: ASCA Title 22 requires that every motor vehicle be equipped with a
    horn in good working order capable of emitting sound audible under normal conditions
    from a distance of not less than 200 feet.
- id: 199
  category: vehicle_information
  question: In American Samoa, at what time must vehicle headlights be turned on?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when it is raining or foggy
  answer: C
  explanation: ASCA 22.1502 specifies that headlights must be displayed from a half
    hour after sunset to a half hour before sunrise, and at any other time when visibility
    is not sufficient.
- id: 200
  category: vehicle_information
  question: According to American Samoa equipment standards, the service brakes on
    a passenger vehicle must be able to stop the vehicle from a speed of 20 mph within
    how many feet?
  choices:
    A: 15 feet
    B: 25 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Under the American Samoa Code, every motor vehicle must have brakes
    capable of stopping the vehicle from a speed of 20 mph within a distance of 30
    feet on a dry, smooth, level road.
- id: 201
  category: vehicle_information
  question: 'In American Samoa, rear-mounted tail lamps must emit a red light that
    is plainly visible from a distance of:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: ASCA 22.1505 requires that every motor vehicle carry at the rear a
    lamp which exhibits a red light plainly visible under normal atmospheric conditions
    from a distance of 500 feet to the rear.
- id: 202
  category: vehicle_information
  question: 'The light illuminating the rear license plate in American Samoa must
    make the plate clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: American Samoa law requires a white light to illuminate the rear registration
    plate so that it is clearly legible from a distance of 50 feet to the rear.
- id: 203
  category: vehicle_information
  question: In American Samoa, where is it legal to place stickers or signs on a vehicle's
    windshield?
  choices:
    A: Anywhere, as long as they are small
    B: Only in the lower corners so as not to obstruct the driver's view
    C: Only in the top center behind the rearview mirror
    D: Nowhere; stickers are strictly prohibited on the windshield
  answer: B
  explanation: ASCA 22.1512 states that no person shall drive a motor vehicle with
    any sign or poster upon the front windshield which obstructs the driver's clear
    view; stickers required by law are permitted in the lower corners.
- id: 204
  category: vehicle_information
  question: Under American Samoa regulations, what is the maximum allowable window
    tint darkness for side windows?
  choices:
    A: 20% light transmission
    B: 35% light transmission
    C: 50% light transmission
    D: 70% light transmission
  answer: B
  explanation: American Samoa administrative rules generally follow the standard that
    side windows must allow at least 35% of light to pass through (35% light transmission).
- id: 205
  category: vehicle_information
  question: In American Samoa, every motor vehicle must be equipped with how many
    functioning 'stop lamps' (brake lights) on the rear?
  choices:
    A: At least one
    B: At least two
    C: At least three
    D: Brake lights are optional if hand signals are used
  answer: A
  explanation: While modern vehicles come with more, ASCA 22.1507 requires that every
    motor vehicle be equipped with at least one stop lamp on the rear of the vehicle.
- id: 206
  category: signs_and_signals
  question: When you encounter a flashing red light at an intersection in American
    Samoa, what must you do?
  choices:
    A: Slow down and proceed with caution
    B: Stop only if other vehicles are approaching
    C: Come to a complete stop and proceed when it is safe to do so
    '0': Speed up to clear the intersection quickly
  answer: C
  explanation: A flashing red light is treated the same as a stop sign; you must come
    to a complete stop and yield the right-of-way before proceeding.
- id: 207
  category: signs_and_signals
  question: What does a solid yellow line on your side of the center road marking
    indicate in American Samoa?
  choices:
    A: You may pass if the road is clear
    B: You are in a high-speed zone
    C: Passing is prohibited in your lane
    D: You must turn right immediately
  answer: C
  explanation: A solid yellow line on your side of the center marking means that passing
    other vehicles is prohibited for your direction of travel.
- id: 208
  category: signs_and_signals
  question: If you intend to turn right and are using hand signals, how should you
    position your arm?
  choices:
    A: Extend your left arm straight out the window
    B: Extend your left arm out and bend it upward at the elbow
    C: Extend your left arm out and bend it downward at the elbow
    D: Wave your hand in a circular motion
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at a 90-degree angle.
- id: 209
  category: signs_and_signals
  question: What is the meaning of a flashing yellow light at an intersection?
  choices:
    A: Stop and wait for a green light
    B: The light is about to turn red
    C: Slow down and proceed with caution
    D: Yield to all traffic coming from the left only
  answer: C
  explanation: A flashing yellow light warns drivers to slow down and be especially
    alert as they proceed through the intersection.
- id: 210
  category: signs_and_signals
  question: In American Samoa, a 'Yield' sign is what shape?
  choices:
    A: Octagon
    B: Diamond
    C: Downward-pointing triangle
    D: Pennant
  answer: C
  explanation: Standard traffic signs in American Samoa follow the US MUTCD, where
    a Yield sign is an equilateral triangle pointing downward.
- id: 211
  category: signs_and_signals
  question: What does a steady yellow traffic light indicate?
  choices:
    A: You should speed up to beat the red light
    B: The signal is changing to red; clear the intersection or stop if safe
    C: You have the right of way over pedestrians
    D: Stop and wait for the green light
  answer: B
  explanation: A steady yellow light indicates that the green signal is being terminated
    and the red signal will be exhibited immediately thereafter.
- id: 212
  category: signs_and_signals
  question: Which hand signal should a driver use to indicate they are slowing down
    or stopping?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm facing the rear
    D: Right arm extended straight out
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the driver
    extends the left arm downward.
- id: 213
  category: signs_and_signals
  question: What do double solid white lines painted on the pavement mean?
  choices:
    A: You may change lanes with caution
    B: Lane changes are prohibited
    C: The road is for one-way traffic only
    D: You are approaching a stop sign
  answer: B
  explanation: Double solid white lines indicate that changing lanes is prohibited
    and you must stay within your current lane.
- id: 214
  category: signs_and_signals
  question: A pentagon-shaped (five-sided) sign indicates what type of area in American
    Samoa?
  choices:
    A: Hospital zone
    B: No passing zone
    C: School zone or school crossing
    D: Public park
  answer: C
  explanation: A five-sided pentagon sign is used exclusively to warn drivers that
    they are approaching a school or a school crossing.
- id: 215
  category: signs_and_signals
  question: When a traffic signal shows a green arrow and a red light at the same
    time, what are you permitted to do?
  choices:
    A: Stop and wait for the red light to turn green
    B: Carefully turn in the direction of the arrow after yielding to pedestrians
    C: Go straight only
    D: Turn in any direction as long as you yield
  answer: B
  explanation: A green arrow means you have a 'protected' turn in that direction,
    even if the main signal is red, provided you yield to pedestrians in the crosswalk.
- id: 216
  category: signs_and_signals
  question: What is the meaning of a diamond-shaped traffic sign?
  choices:
    A: Regulatory (Law)
    B: Guide or Information
    C: Warning of hazards or special conditions
    D: Stop or Yield
  answer: C
  explanation: Diamond-shaped signs are used as warning signs to alert drivers to
    potential hazards, such as curves, intersections, or merging traffic.
- id: 217
  category: signs_and_signals
  question: In American Samoa, what does a solid white line on the right edge of the
    road signify?
  choices:
    A: A lane for bicycles only
    B: The edge of the travel lane (fog line)
    C: A pedestrian-only walkway
    D: A zone where parking is always permitted
  answer: B
  explanation: A solid white line on the right side of the road marks the edge of
    the travel lane and helps drivers stay on the road at night or in poor visibility.
- id: 218
  category: signs_and_signals
  question: What must you do when approaching a stop sign where there is no marked
    stop line or crosswalk?
  choices:
    A: Stop at the point nearest the intersecting roadway where you have a view of
      approaching traffic
    B: Slow down and only stop if you see another car
    C: Stop 20 feet before the sign
    D: You do not need to stop if the intersection is clear
  answer: A
  explanation: If there is no stop line or crosswalk, you must stop at the point nearest
    the intersection that allows you to see traffic coming from all directions before
    entering the intersection.
- id: 219
  category: signs_and_signals
  question: In American Samoa, what must a driver do when approaching a steady circular
    red traffic signal?
  choices:
    A: Slow down and proceed with caution
    B: Stop and remain stopped until the light turns green
    C: Stop only if there is cross traffic
    D: Speed up to clear the intersection
  answer: B
  explanation: According to ASCA 22.0323, a steady red signal means vehicular traffic
    shall stop at a clearly marked stop line or before entering the crosswalk and
    shall remain stopped until an indication to proceed is shown.
- id: 220
  category: signs_and_signals
  question: Under American Samoa law, is a right turn on a red light permitted?
  choices:
    A: No, it is never permitted
    B: Yes, but only between the hours of 9:00 PM and 5:00 AM
    C: Yes, after coming to a complete stop and yielding to pedestrians and other
      traffic, unless a sign prohibits it
    D: Yes, but only if the driver honks first
  answer: C
  explanation: ASCA 22.0323(a)(3)(B) allows drivers to cautiously enter the intersection
    to make a right turn after stopping, provided they yield to pedestrians and other
    lawful traffic, unless a sign is in place prohibiting such a turn.
- id: 221
  category: signs_and_signals
  question: What does a flashing red traffic light indicate in American Samoa?
  choices:
    A: The signal is broken; proceed without stopping
    B: The same as a stop sign; stop, yield, and proceed when safe
    C: Slow down and prepare for a green light
    D: Pedestrians have the right of way, but vehicles do not need to stop
  answer: B
  explanation: Per ASCA 22.0326, a flashing red signal requires drivers to stop at
    a clearly marked stop line. The right to proceed is subject to the rules applicable
    after making a stop at a stop sign.
- id: 222
  category: signs_and_signals
  question: When a traffic signal shows a steady yellow light, what does it signify
    to a driver in American Samoa?
  choices:
    A: The green light is about to appear
    B: The driver should speed up to beat the red light
    C: The related green movement is being terminated and a red light will exhibit
      immediately thereafter
    D: The driver has the right of way over pedestrians
  answer: C
  explanation: ASCA 22.0323 defines a steady yellow light as a warning that the green
    movement is ending and a red signal will be shown immediately.
- id: 223
  category: signs_and_signals
  question: 'In American Samoa, a flashing yellow light means:'
  choices:
    A: Stop and wait for the light to turn green
    B: The light is about to turn red; stop immediately
    C: Drivers may proceed through the intersection or past such signal only with
      caution
    D: Yield to all traffic coming from the left only
  answer: C
  explanation: ASCA 22.0326 states that when a yellow lens is illuminated with rapid
    intermittent flashes, drivers may proceed through the intersection or past the
    signal only with caution.
- id: 224
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the roadway indicate
    in American Samoa?
  choices:
    A: Passing is permitted from either direction
    B: Passing is permitted only during daylight hours
    C: Passing is prohibited in both directions
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines indicate that passing is prohibited for traffic
    moving in either direction. Drivers must stay to the right of these lines.
- id: 225
  category: signs_and_signals
  question: 'A sign in the shape of a triangle with the point facing downward is used
    exclusively for:'
  choices:
    A: Stop signs
    B: Yield signs
    C: School zones
    D: No passing zones
  answer: B
  explanation: In accordance with standard traffic control standards used in American
    Samoa, the downward-pointing equilateral triangle is the standard shape for Yield
    signs.
- id: 226
  category: signs_and_signals
  question: What does a pennant-shaped sign (sideways triangle) placed on the left
    side of the road indicate?
  choices:
    A: School Zone
    B: No Passing Zone
    C: Hospital Ahead
    D: Dead End
  answer: B
  explanation: The pennant-shaped sign is used to mark the beginning of a no-passing
    zone, usually placed on the left side of the road facing the driver.
- id: 227
  category: signs_and_signals
  question: In American Samoa, what does a diamond-shaped traffic sign usually represent?
  choices:
    A: Regulatory information (such as speed limits)
    B: Warning or hazard ahead
    C: Service information (such as gas or food)
    D: Directional guidance
  answer: B
  explanation: Diamond-shaped signs are standard warning signs used to alert drivers
    to potential hazards or changes in road conditions ahead.
- id: 228
  category: signs_and_signals
  question: If you see a 'Do Not Enter' sign, what should you do?
  choices:
    A: Drive in slowly if you live on that street
    B: Check for oncoming traffic and then proceed
    C: Do not drive past the sign; you are going the wrong way
    D: Only enter if you are driving a commercial vehicle
  answer: C
  explanation: The 'Do Not Enter' sign is a regulatory sign indicating that traffic
    is prohibited from entering the road or ramp in the direction the sign is facing.
- id: 229
  category: signs_and_signals
  question: In American Samoa, what does a pentagon-shaped (five-sided) sign indicate?
  choices:
    A: A construction zone
    B: A railroad crossing
    C: A school zone or school crossing
    D: A public park
  answer: C
  explanation: A five-sided pentagon sign is used specifically to warn drivers that
    they are entering a school zone or approaching a school crossing.
- id: 230
  category: signs_and_signals
  question: When you see a sign with an orange background, what should you expect?
  choices:
    A: A scenic viewpoint
    B: A construction or maintenance zone
    C: A nearby airport
    D: A high-speed highway
  answer: B
  explanation: Orange is the standard background color for temporary traffic control
    signs in construction and maintenance work zones.
