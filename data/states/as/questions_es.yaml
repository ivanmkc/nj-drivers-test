questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de aprendizaje en Samoa
    Americana?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: Según las leyes de vehículos motorizados de Samoa Americana, una persona
    debe tener al menos 16 años de edad para solicitar un permiso de aprendizaje.
- id: 2
  category: license_system
  question: Una persona que posee un permiso de aprendizaje en Samoa Americana debe
    estar acompañada por un conductor con licencia que tenga al menos ¿qué edad?
  choices:
    A: 18 años
    B: 21 años
    C: 25 años
    D: 30 años
  answer: B
  explanation: Los titulares de permisos deben ser supervisados por un conductor con
    licencia que tenga al menos 21 años de edad y posea una licencia de conducir válida.
- id: 3
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar de Samoa
    Americana antes de que expire?
  choices:
    A: 2 años
    B: 3 años
    C: 5 años
    D: 8 años
  answer: B
  explanation: En Samoa Americana, una licencia de operador estándar suele ser válida
    por un período de 3 años.
- id: 4
  category: license_system
  question: Bajo el sistema de puntos de Samoa Americana, ¿cuántos puntos acumulados
    en un período de 12 meses resultarán en una suspensión obligatoria de la licencia?
  choices:
    A: 6 puntos
    B: 8 puntos
    C: 10 puntos
    D: 12 puntos
  answer: D
  explanation: El Departamento de Seguridad Pública suspenderá la licencia de cualquier
    conductor que acumule 12 puntos o más en un período de 12 meses.
- id: 5
  category: license_system
  question: ¿Qué clase de licencia se requiere para operar un vehículo de pasajeros
    privado estándar en Samoa Americana?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: D
  explanation: La Clase D es la licencia de operador estándar para vehículos de pasajeros
    privados, camionetas (pickups) y furgonetas en Samoa Americana.
- id: 6
  category: license_system
  question: Si se muda a una nueva residencia dentro de Samoa Americana, ¿dentro de
    cuántos días debe notificar a la Oficina de Vehículos Motorizados su cambio de
    dirección?
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: B
  explanation: La ley exige que los conductores notifiquen al Comisionado de Seguridad
    Pública sobre un cambio de dirección en un plazo de 30 días.
- id: 7
  category: license_system
  question: ¿Cuál es el requisito mínimo de agudeza visual para obtener una licencia
    de conducir en Samoa Americana sin restricciones?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Los solicitantes deben tener una visión de al menos 20/40 en al menos
    un ojo, con o sin lentes correctores, para calificar para una licencia.
- id: 8
  category: license_system
  question: Un visitante con una licencia de conducir válida de un estado o territorio
    de los EE. UU. puede conducir en Samoa Americana por un máximo de ¿cuántos días?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los no residentes con una licencia válida de otra jurisdicción de los
    EE. UU. pueden operar un vehículo en Samoa Americana por un máximo de 30 días.
- id: 9
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es obligatorio al solicitar una
    licencia de conducir original de Samoa Americana?
  choices:
    A: Una tarjeta de Seguro Social válida
    B: Un certificado de nacimiento certificado o pasaporte válido
    C: Prueba de estatus migratorio (si no es nacional de los EE. UU.)
    D: Un diploma de escuela secundaria
  answer: D
  explanation: Si bien se requieren identidad, seguro social y estatus legal, un diploma
    de escuela secundaria no es un requisito para obtener una licencia de conducir.
- id: 10
  category: license_system
  question: Para los conductores menores de 21 años, ¿cuál es el límite de concentración
    de alcohol en sangre (BAC) (Tolerancia Cero) en Samoa Americana?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Samoa Americana aplica una política de tolerancia cero para menores,
    donde un BAC de 0.02% o superior resulta en la revocación inmediata de la licencia.
- id: 11
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje de Samoa Americana?
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: B
  explanation: Un permiso de aprendizaje en Samoa Americana es válido por 180 días
    (aproximadamente 6 meses) a partir de la fecha de emisión.
- id: 12
  category: license_system
  question: ¿Cuál es la sanción por una primera condena por conducir sin una licencia
    válida en Samoa Americana?
  choices:
    A: Solo una advertencia
    B: Una multa de hasta $1,000 y/o hasta 1 año de cárcel
    C: Servicio comunitario obligatorio por 5 años
    D: Prohibición permanente de conducir
  answer: B
  explanation: Conducir sin una licencia válida es un delito menor en Samoa Americana,
    sancionable con multas de hasta $1,000 y/o encarcelamiento por hasta un año.
- id: 13
  category: license_system
  question: Para registrar un vehículo en Samoa Americana, ¿cuál es el requisito mínimo
    de seguro?
  choices:
    A: No se requiere seguro
    B: Solo cobertura contra todo riesgo (Comprehensive) y colisión
    C: Seguro de Responsabilidad Civil Obligatorio
    D: Solo Protección contra Lesiones Personales
  answer: C
  explanation: Todos los vehículos de motor que operen en las vías públicas de Samoa
    Americana deben estar cubiertos por un seguro de responsabilidad civil obligatorio.
- id: 14
  category: license_system
  question: Si su licencia se pierde o se destruye, ¿a dónde debe acudir para obtener
    un duplicado?
  choices:
    A: Al Tribunal Superior (High Court)
    B: A la Oficina del Gobernador
    C: Al Departamento de Seguridad Pública (OMV)
    D: A la Oficina de Correos
  answer: C
  explanation: Los duplicados de las licencias son emitidos por la Oficina de Vehículos
    de Motor (OMV) bajo el Departamento de Seguridad Pública.
- id: 15
  category: license_system
  question: En Samoa Americana, ¿cuál es el número máximo de puntos que un conductor
    puede acumular en un período de 24 meses antes de la suspensión de la licencia?
  choices:
    A: 12 puntos
    B: 15 puntos
    C: 18 puntos
    D: 24 puntos
  answer: C
  explanation: Si bien 12 puntos en 12 meses activan la suspensión, la ley también
    exige la suspensión por acumular 18 puntos en un período de 24 meses.
- id: 16
  category: license_system
  question: En Samoa Americana, ¿cuál es la edad mínima requerida para obtener una
    licencia de conducir Clase 2 (Privada) completa y sin restricciones?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: C
  explanation: Aunque se puede obtener un permiso de aprendizaje a los 16 años, el
    solicitante debe tener al menos 18 años para recibir una licencia de conducir
    privada Clase 2 completa en Samoa Americana.
- id: 17
  category: license_system
  question: ¿Qué clasificación de licencia específica se requiere en Samoa Americana
    para operar una motocicleta o un ciclo impulsado por motor?
  choices:
    A: Clase 1
    B: Clase 2
    C: Clase 3
    D: Clase A
  answer: A
  explanation: De acuerdo con las regulaciones de vehículos de motor de Samoa Americana,
    la licencia Clase 1 está designada específicamente para la operación de motocicletas.
- id: 18
  category: license_system
  question: Si un solicitante reprueba el examen escrito de conducir en Samoa Americana,
    ¿cuánto tiempo debe esperar antes de ser elegible para volver a tomar la prueba?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 30 días
  answer: C
  explanation: El procedimiento estándar de la OMV en Samoa Americana requiere un
    período de espera de una semana (7 días) antes de que se pueda volver a tomar
    un examen escrito reprobado.
- id: 19
  category: license_system
  question: Al solicitar una licencia de conducir original en Samoa Americana, ¿cuál
    de los siguientes es un documento obligatorio para demostrar su número de Seguro
    Social?
  choices:
    A: Una nota escrita a mano de un empleador
    B: Una tarjeta original de Seguro Social
    C: Una declaración verbal del número
    D: Una tarjeta de identificación escolar
  answer: B
  explanation: Los solicitantes deben presentar una tarjeta de Seguro Social original
    ante la Oficina de Vehículos de Motor para verificar su identidad y número de
    identificación fiscal.
- id: 20
  category: license_system
  question: Para los solicitantes menores de 18 años, ¿de quién se requiere la firma
    en la solicitud de licencia de conducir en Samoa Americana?
  choices:
    A: Del director de la escuela
    B: De cualquier conductor con licencia mayor de 21 años
    C: De un padre o tutor legal
    D: No se requiere firma si ya tienen un permiso
  answer: C
  explanation: Los menores de 18 años deben tener su solicitud firmada por un padre
    o tutor legal que acepte la responsabilidad financiera por la conducción del menor.
- id: 21
  category: license_system
  question: Bajo la ley de "Consentimiento Implícito" (Implied Consent) de Samoa Americana,
    ¿cuál es la sanción por negarse a someterse a una prueba química de alcohol o
    drogas?
  choices:
    A: Una advertencia verbal
    B: Incautación/suspensión obligatoria de la licencia por 6 meses
    C: Una multa de $10
    D: No hay sanción por la negativa
  answer: B
  explanation: Al conducir en Samoa Americana, usted da su consentimiento implícito
    para someterse a pruebas químicas. La negativa resulta en una incautación administrativa
    inmediata de su licencia, generalmente por 6 meses.
- id: 22
  category: license_system
  question: Antes de que un vehículo pueda ser registrado o su registro sea renovado
    en Samoa Americana, ¿por cuál de los siguientes procesos debe pasar?
  choices:
    A: Únicamente una prueba de oscuridad del polarizado de las ventanas
    B: Una inspección de seguridad anual en una estación autorizada
    C: Una prueba de pista a alta velocidad
    D: Una verificación del color de la pintura
  answer: B
  explanation: Todos los vehículos en Samoa Americana deben pasar una inspección de
    seguridad anual para garantizar que estén en condiciones de circular antes de
    que se pueda completar el registro.
- id: 23
  category: license_system
  question: Bajo el sistema de puntos de Samoa Americana, ¿cuántos puntos se asignan
    contra su historial de manejo por una condena de "Conducción Temeraria" (Reckless
    Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 12 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción de tráfico grave
    en Samoa Americana y conlleva una penalización de 6 puntos en el historial del
    conductor.
- id: 24
  category: license_system
  question: Para los ciudadanos o nacionales no estadounidenses que residen en Samoa
    Americana, ¿a qué está vinculada normalmente la fecha de vencimiento de su licencia
    de conducir?
  choices:
    A: A su cumpleaños
    B: Al vencimiento de su estatus migratorio legal o permiso de entrada
    C: A la fecha en que compraron su automóvil
    D: Exactamente un año después de la fecha de emisión
  answer: B
  explanation: Para los no ciudadanos, la Oficina de Vehículos Motorizados (OMV) emite
    licencias que vencen simultáneamente con la estancia legal o el permiso de inmigración
    de la persona en el territorio.
- id: 25
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para obtener una licencia Clase
    3 (Comercial) que NO se requiere para una licencia Clase 2?
  choices:
    A: Un certificado de nacimiento válido
    B: Un examen físico y un certificado médico
    C: Una tarjeta de Seguro Social
    D: El pago de una tarifa de registro
  answer: B
  explanation: Los solicitantes de licencias comerciales (Clase 3) deben presentar
    un certificado de un examinador médico para demostrar que están físicamente aptos
    para operar equipo pesado.
- id: 26
  category: license_system
  question: Después de aprobar el examen escrito pero antes de realizar la prueba
    de manejo, se le entrega al solicitante un permiso de aprendizaje temporal. ¿Por
    cuánto tiempo es válido este permiso en Samoa Americana?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: En Samoa Americana, un permiso de aprendizaje es generalmente válido
    por 90 días, lo que le da al solicitante tiempo para practicar para la prueba
    de habilidades de manejo.
- id: 27
  category: license_system
  question: ¿Cuál es la consecuencia legal por el "Uso fraudulento de una licencia
    de conducir" (como usar la identificación de otra persona) en Samoa Americana?
  choices:
    A: Es una infracción menor sin multa
    B: Es un delito menor (misdemeanor) castigado con multas y posible tiempo en la
      cárcel
    C: Una simple advertencia de la OMV
    D: Prohibición permanente automática para conducir
  answer: B
  explanation: El uso fraudulento de una licencia es una ofensa grave bajo la ley
    de Samoa Americana, clasificada como un delito menor y sujeta a sanciones penales.
- id: 28
  category: license_system
  question: En Samoa Americana, ¿se requiere tener una licencia de conducir para operar
    un ciclomotor (moped) en las carreteras públicas?
  choices:
    A: No, los ciclomotores no requieren licencia
    B: Sí, debe tener al menos una licencia Clase 2 válida
    C: Solo si el ciclomotor va a más de 50 mph
    D: Solo si es menor de 16 años
  answer: B
  explanation: Según la ley de Samoa Americana, cualquier persona que opere un ciclo
    impulsado por motor (incluidos los ciclomotores) en vías públicas debe poseer
    una licencia de conducir válida.
- id: 29
  category: driver_testing
  question: Antes de comenzar la prueba de manejo en Samoa Americana, el examinador
    inspeccionará su vehículo para asegurarse de que cumple con los estándares de
    seguridad. ¿Cuál de los siguientes es un requisito obligatorio para el vehículo
    de la prueba?
  choices:
    A: Debe tener un sistema de aire acondicionado en funcionamiento
    B: Debe estar equipado con un freno de emergencia funcional (freno de estacionamiento)
    C: Debe tener ventanas polarizadas para la privacidad del conductor
    D: Debe tener menos de 5 años de antigüedad
  answer: B
  explanation: Para la prueba de manejo en Samoa Americana, el vehículo debe estar
    en condiciones seguras de funcionamiento, lo que incluye tener un freno de estacionamiento
    funcional, luces de trabajo, bocina y registro/seguro vigentes.
- id: 30
  category: driver_testing
  question: Si un solicitante requiere lentes correctivos para aprobar el examen de
    la vista en Samoa Americana, ¿qué código de restricción se colocará en su licencia
    de conducir?
  choices:
    A: Restricción A
    B: Restricción B
    C: Restricción C
    D: Restricción D
  answer: A
  explanation: En Samoa Americana, la Restricción "A" en una licencia de conducir
    indica que el conductor debe usar lentes correctivos mientras opera un vehículo
    motorizado.
- id: 31
  category: driver_testing
  question: Según las leyes de tránsito de Samoa Americana, ¿cuál es el límite de
    velocidad máximo en una zona escolar cuando hay niños presentes o cuando una señal
    está parpadeando?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: Según ASCA § 22.0323, el límite de velocidad en cualquier zona escolar
    o cerca de una iglesia durante los servicios es de 15 millas por hora (mph).
- id: 32
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad legal
    máximo en cualquier carretera en Samoa Americana?
  choices:
    A: 25 mph
    B: 30 mph
    C: 40 mph
    D: 45 mph
  answer: B
  explanation: Bajo el Código Anotado de Samoa Americana (ASCA), el límite de velocidad
    máximo es de 30 millas por hora (mph), a menos que haya señales que indiquen un
    límite diferente.
- id: 33
  category: driver_testing
  question: En Samoa Americana, ¿con cuántos pies de antelación debe señalizar su
    intención de girar en un distrito comercial o residencial?
  choices:
    A: 50 pies
    B: 75 pies
    C: 100 pies
    D: 200 pies
  answer: C
  explanation: Los conductores en Samoa Americana deben señalizar su intención de
    girar al menos 100 pies antes de llegar a la intersección.
- id: 34
  category: driver_testing
  question: Al estacionar su vehículo en una vía pública en Samoa Americana, ¿cuál
    es la distancia mínima legal que debe mantener con respecto a un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La sección ASCA § 22.0331 prohíbe estacionar un vehículo a menos de
    15 pies de un hidrante de incendios.
- id: 35
  category: driver_testing
  question: En Samoa Americana, ¿es ilegal estacionar su vehículo a menos de cuántos
    pies de un paso de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: De acuerdo con las regulaciones de tránsito de Samoa Americana, no
    se puede estacionar un vehículo a menos de 20 pies de un paso de peatones en una
    intersección.
- id: 36
  category: driver_testing
  question: Si se ve involucrado en un accidente de tránsito en Samoa Americana que
    resulte en lesiones o muerte, ¿en qué plazo debe informar el accidente al Comisionado
    de Seguridad Pública?
  choices:
    A: Inmediatamente (dentro de las 24 horas)
    B: Dentro de las 48 horas
    C: Dentro de los 7 días
    D: Dentro de los 10 días
  answer: A
  explanation: ASCA § 22.0701 requiere que cualquier accidente que involucre lesiones,
    muerte o daños a la propiedad que excedan los $100 debe ser reportado a la policía
    dentro de las 24 horas.
- id: 37
  category: driver_testing
  question: Bajo la Ley de Consentimiento Implícito de Samoa Americana, al operar
    un vehículo motorizado, ¿usted ha dado su consentimiento para cuál de las siguientes
    opciones?
  choices:
    A: Un registro de su vehículo en cualquier momento
    B: Una prueba química de su aliento, sangre u orina para detectar alcohol o drogas
    C: Una revisión de sus registros personales de teléfono celular
    D: La instalación de un dispositivo de monitoreo de velocidad
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que, al conducir en Samoa
    Americana, usted acepta someterse a pruebas químicas si un oficial sospecha que
    está conduciendo bajo la influencia (DUI).
- id: 38
  category: driver_testing
  question: Al usar señales manuales en Samoa Americana, ¿qué significa cuando el
    brazo del conductor está extendido hacia abajo?
  choices:
    A: Giro a la izquierda
    B: Giro a la derecha
    C: Parar o disminuir la velocidad
    D: Giro en U
  answer: C
  explanation: La señal manual estándar para detenerse o reducir la velocidad es el
    brazo extendido hacia abajo con la palma de la mano hacia atrás.
- id: 39
  category: driver_testing
  question: En Samoa Americana, cuando un autobús escolar se detiene con sus luces
    rojas parpadeando y el brazo de parada extendido, ¿qué deben hacer los conductores?
  choices:
    A: Reducir la velocidad a 5 mph y pasar con cuidado
    B: Detenerse solo si viaja en la misma dirección que el autobús
    C: Detenerse desde cualquier dirección y permanecer detenido hasta que las luces
      dejen de parpadear
    D: Tocar la bocina para advertir a los estudiantes antes de pasar
  answer: C
  explanation: Los conductores que se aproximen desde cualquier dirección deben detenerse
    ante un autobús escolar con luces rojas intermitentes activadas y permanecer detenidos
    hasta que el autobús reanude la marcha o se desactiven las señales.
- id: 40
  category: driver_testing
  question: ¿Cuál es la distancia de seguimiento recomendada para los vehículos que
    transitan en Samoa Americana para garantizar la seguridad?
  choices:
    A: La longitud de un vehículo por cada 10 mph de velocidad
    B: Exactamente 10 pies en todo momento
    C: La longitud de dos vehículos independientemente de la velocidad
    D: 50 pies en todo momento
  answer: A
  explanation: La regla general de seguridad que se enseña en Samoa Americana es mantener
    al menos la longitud de un vehículo por cada 10 millas por hora (mph) de velocidad
    para permitir un frenado seguro.
- id: 41
  category: driver_testing
  question: ¿Con qué frecuencia deben los vehículos en Samoa Americana someterse a
    una inspección de seguridad en una estación de inspección autorizada?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Los vehículos en Samoa Americana deben aprobar una inspección de seguridad
    anualmente como parte del proceso de renovación del registro.
- id: 42
  category: driver_testing
  question: En Samoa Americana, si dos vehículos llegan al mismo tiempo a una intersección
    no controlada (sin señales ni semáforos), ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que circula por la carretera más ancha
    D: El conductor que toque la bocina primero
  answer: B
  explanation: En las intersecciones no controladas en Samoa Americana, el conductor
    del vehículo de la izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 43
  category: driver_testing
  question: Al realizar el examen práctico de manejo en Samoa Americana, ¿de cuál
    de los siguientes elementos es responsable el solicitante?
  choices:
    A: Un vehículo proporcionado por la Oficina de Vehículos Motorizados
    B: Un vehículo que esté actualmente registrado y asegurado
    C: Un vehículo únicamente con transmisión manual
    D: Solo un permiso de aprendizaje válido; el examinador proporciona el automóvil
  answer: B
  explanation: De acuerdo con las regulaciones de tránsito de Samoa Americana, los
    solicitantes deben proporcionar su propio vehículo para el examen de manejo, y
    este debe contar con un registro válido y comprobante de seguro.
- id: 44
  category: driver_testing
  question: Durante el examen de manejo de Samoa Americana, ¿cuál de las siguientes
    acciones resultará en una reprobación inmediata y automática?
  choices:
    A: No usar una señal de giro una vez
    B: Ajustar los espejos mientras conduce
    C: Una colisión o cualquier acción peligrosa que requiera la intervención del
      examinador
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: C
  explanation: Cualquier acción que cause una colisión, necesite la intervención del
    examinador para prevenir un accidente o constituya una infracción de tráfico peligrosa
    resulta en la reprobación automática del examen de manejo.
- id: 45
  category: driver_testing
  question: En Samoa Americana, ¿cuál es la Concentración de Alcohol en Sangre (BAC)
    máxima legal para un conductor de 21 años de edad o más?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Según ASCA § 22.0707, es ilegal que cualquier persona que tenga una
    concentración de alcohol en sangre de 0.08% o más conduzca o tenga el control
    físico real de un vehículo motorizado.
- id: 46
  category: driver_testing
  question: Bajo la ley de 'Consentimiento Implícito' de Samoa Americana, ¿qué sucede
    si usted se niega a someterse a una prueba química de alcohol o drogas cuando
    lo solicita un oficial?
  choices:
    A: Se le dará una advertencia y se le permitirá conducir a casa
    B: Se le confiscará su licencia y se suspenderán sus privilegios de conducir
    C: Solo será penalizado si el caso judicial posterior lo encuentra culpable
    D: Se le requerirá volver a tomar únicamente el examen escrito
  answer: B
  explanation: Al conducir en Samoa Americana, usted otorga su consentimiento implícito
    para realizarse pruebas químicas. La negativa a realizar la prueba resulta en
    la confiscación inmediata de su licencia y una suspensión administrativa.
- id: 47
  category: driver_testing
  question: ¿Qué clasificación de licencia se requiere específicamente en Samoa Americana
    para operar un vehículo de 'Servicio Público', como un autobús comercial o un
    autobús 'aiga'?
  choices:
    A: Clase 1
    B: Clase 2
    C: Clase 3
    D: Clase 4
  answer: D
  explanation: Se requiere una licencia de Clase 4 para los conductores que operan
    vehículos de servicio público, incluidos taxis y autobuses, en Samoa Americana.
- id: 48
  category: driver_testing
  question: En Samoa Americana, ¿cuándo se le permite girar a la derecha con luz roja?
  choices:
    A: Nunca; la luz roja siempre significa permanecer detenido
    B: Solo si hay una flecha verde apuntando a la derecha
    C: Después de detenerse por completo y ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba
    D: Solo durante las horas del día
  answer: C
  explanation: Los conductores pueden girar a la derecha en rojo después de detenerse
    por completo y ceder el paso a los demás, siempre que no haya una señal colocada
    que diga 'No Turn on Red' (No girar en rojo).
- id: 49
  category: driver_testing
  question: Si las señales de giro (direccionales) de su vehículo no funcionan, ¿cuál
    es la señal manual correcta para un giro a la izquierda en Samoa Americana?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo doblado hacia arriba en un ángulo de 90 grados
    C: Brazo doblado hacia abajo en un ángulo de 90 grados
    D: Mover el brazo en un movimiento circular
  answer: A
  explanation: La señal manual estándar para un giro a la izquierda es el brazo izquierdo
    extendido horizontalmente y recto hacia afuera de la ventana.
- id: 50
  category: driver_testing
  question: En Samoa Americana, ¿a qué distancia debe estacionar su vehículo de un
    hidrante de incendios?
  choices:
    A: Al menos 5 pies
    B: Al menos 10 pies
    C: Al menos 15 pies
    D: Al menos 20 pies
  answer: C
  explanation: Las regulaciones de estacionamiento en Samoa Americana prohíben estacionar
    a menos de 15 pies de un hidrante de incendios para garantizar el acceso de emergencia.
- id: 51
  category: driver_testing
  question: Al acercarse a un autobús escolar que se ha detenido para recoger o dejar
    niños con sus luces rojas intermitentes encendidas, ¿qué debe hacer usted?
  choices:
    A: Reducir la velocidad a 5 mph y pasar con cuidado
    B: Detenerse y esperar hasta que las luces rojas dejen de parpadear y el autobús
      comience a moverse
    C: Tocar la bocina para alertar a los niños y continuar
    D: Solo detenerse si viaja en la misma dirección que el autobús
  answer: B
  explanation: Los conductores en ambas direcciones deben detenerse ante un autobús
    escolar con luces rojas intermitentes y permanecer detenidos hasta que las luces
    se apaguen y el autobús reanude la marcha.
- id: 52
  category: driver_testing
  question: ¿Qué documento adicional suelen requerir los solicitantes de una licencia
    comercial o de servicio público (Clase 3 o 4) en Samoa Americana?
  choices:
    A: Un diploma de escuela secundaria
    B: Un certificado de examinador médico válido
    C: Una carta de recomendación de un jefe de aldea
    D: Prueba de 10 años de experiencia en la conducción
  answer: B
  explanation: Los conductores de vehículos comerciales o de servicio público deben
    cumplir con estándares físicos más altos y se les exige presentar un certificado
    médico para demostrar que están aptos para conducir.
- id: 53
  category: driver_testing
  question: ¿Cuál es el propósito principal de la "Regla de los dos segundos" que
    se enseña en la educación vial de Samoa Americana?
  choices:
    A: Determinar cuánto tiempo detenerse en una señal de alto
    B: Calcular el tiempo necesario para cruzar una intersección
    C: Mantener una distancia de seguimiento segura con el vehículo que va delante
    D: Cronometrar cuánto tiempo durará una luz amarilla
  answer: C
  explanation: La regla de los dos segundos es una medida utilizada para garantizar
    una distancia de seguimiento segura entre vehículos bajo condiciones normales
    de conducción.
- id: 54
  category: driver_responsibility
  question: En Samoa Americana, si usted se ve involucrado en un accidente de vehículo
    motorizado que resulte en daños a la propiedad de cualquier persona, ¿cuál es
    el monto mínimo de daños que requiere un informe al Comisionado de Seguridad Pública?
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: B
  explanation: De acuerdo con ASCA § 22.0701, el conductor de un vehículo involucrado
    en un accidente que resulte en daños a la propiedad de cualquier persona por un
    monto superior a $100 debe informar el accidente.
- id: 55
  category: driver_responsibility
  question: Si se requiere un informe de accidente por escrito en Samoa Americana,
    ¿dentro de cuántos días debe el conductor entregarlo a la Oficina de Vehículos
    Motorizados (OMV)?
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Los conductores están obligados a presentar un informe por escrito
    de un accidente que califique dentro de los 10 días si un oficial de policía no
    realizó una investigación en el lugar de los hechos.
- id: 56
  category: driver_responsibility
  question: En caso de un accidente que involucre lesiones o muerte en Samoa Americana,
    ¿cómo debe el conductor notificar al Departamento de Seguridad Pública?
  choices:
    A: Por correo dentro de las 48 horas
    B: Inmediatamente por el medio de comunicación más rápido
    C: Visitando la OMV el siguiente día hábil
    D: Solo si el daño supera los $500
  answer: B
  explanation: ASCA § 22.0702 exige que el conductor de un vehículo involucrado en
    un accidente que resulte en lesiones o muerte notifique inmediatamente a la policía
    por el medio de comunicación más rápido.
- id: 57
  category: driver_responsibility
  question: ¿Cuántos puntos se añaden al registro de conducir de Samoa Americana por
    una condena de "No ceder el derecho de paso" (Failing to yield right-of-way)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No ceder el derecho de paso generalmente resulta en la asignación de
    4 puntos contra la licencia de conducir en Samoa Americana.
- id: 58
  category: driver_responsibility
  question: En Samoa Americana, ¿con qué frecuencia debe un vehículo motorizado someterse
    a una inspección de seguridad para mantener su registro legal?
  choices:
    A: Cada 6 meses
    B: Cada año
    C: Cada 2 años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Todos los vehículos en Samoa Americana deben someterse a una inspección
    de seguridad anual en una estación autorizada antes de que se pueda renovar el
    registro.
- id: 59
  category: driver_responsibility
  question: ¿Dónde está obligado un conductor a llevar el certificado de registro
    del vehículo mientras lo opera en Samoa Americana?
  choices:
    A: En casa en un lugar seguro
    B: En el vehículo
    C: En la Oficina de Vehículos Motorizados
    D: Con el agente de seguros del vehículo
  answer: B
  explanation: El certificado de registro debe llevarse en el vehículo en todo momento
    y debe presentarse ante la solicitud de un oficial de policía.
- id: 60
  category: driver_responsibility
  question: En Samoa Americana, ¿cuál es la multa para una persona declarada culpable
    de arrojar basura (littering) desde un vehículo motorizado?
  choices:
    A: $10 a $50
    B: $50 a $500
    C: Exactamente $1,000
    D: No hay multa, solo servicio comunitario
  answer: B
  explanation: ASCA § 22.0331 establece que arrojar basura desde un vehículo es un
    delito menor castigado con una multa de entre $50 y $500.
- id: 61
  category: driver_responsibility
  question: 'Una primera condena por Conducir Bajo la Influencia (DUI) en Samoa Americana
    puede resultar en una sentencia de cárcel de hasta:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Según la ley de Samoa Americana, una primera condena por DUI es un
    delito menor de clase A que conlleva una posible pena de cárcel de hasta un año
    y/o una multa.
- id: 62
  category: driver_responsibility
  question: Cuando lo detiene un oficial de policía en Samoa Americana, ¿qué documento
    debe proporcionar como prueba de responsabilidad financiera?
  choices:
    A: Un estado de cuenta bancario que muestre al menos $10,000
    B: Un certificado de seguro válido
    C: Una carta notariada de su empleador
    D: La factura de venta original del vehículo
  answer: B
  explanation: Los conductores deben presentar un certificado de seguro válido (Seguro
    Obligatorio de Terceros) cuando lo solicite un oficial de la ley.
- id: 63
  category: driver_responsibility
  question: En Samoa Americana, ¿el conductor es legalmente responsable de asegurar
    que todos los pasajeros menores de qué edad estén debidamente sujetos por un cinturón
    de seguridad o un asiento de seguridad para niños?
  choices:
    A: Menores de 12 años
    B: Menores de 15 años
    C: Menores de 18 años
    D: Menores de 21 años
  answer: B
  explanation: El ASCA § 22.0333 establece que el conductor es responsable de asegurar
    que los pasajeros menores de 15 años estén debidamente sujetos.
- id: 64
  category: driver_responsibility
  question: 'En Samoa Americana, cada vehículo motorizado debe estar equipado con
    un silenciador en buen estado de funcionamiento para evitar:'
  choices:
    A: Velocidad excesiva
    B: Sobrecalentamiento del motor
    C: Ruido inusual o excesivo
    D: Fugas de combustible
  answer: C
  explanation: Las leyes de equipamiento de vehículos en Samoa Americana requieren
    un silenciador para evitar ruidos excesivos o inusuales y humo molesto.
- id: 65
  category: driver_responsibility
  question: En Samoa Americana, ¿cuál es el monto mínimo de daños a la propiedad en
    un accidente que requiere un informe inmediato a la policía?
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: B
  explanation: De acuerdo con ASCA § 22.0701, el conductor de un vehículo involucrado
    en un accidente que resulte en daños totales a la propiedad por un monto aparente
    de $100 o más debe notificar de inmediato al departamento de policía.
- id: 66
  category: driver_responsibility
  question: Bajo la ley de seguro obligatorio de Samoa Americana, ¿cuál es la cobertura
    mínima de responsabilidad civil requerida por lesiones corporales o muerte de
    una persona en cualquier accidente?
  choices:
    A: $5,000
    B: $10,000
    C: $15,000
    D: $20,000
  answer: B
  explanation: El ASCA § 22.2003 requiere un mínimo de $10,000 por lesiones corporales
    o muerte de una persona en cualquier accidente.
- id: 67
  category: driver_responsibility
  question: ¿Cuál es la cobertura mínima de seguro de responsabilidad civil requerida
    en Samoa Americana por daños a la propiedad en un solo accidente?
  choices:
    A: $1,000
    B: $2,500
    C: $5,000
    D: $10,000
  answer: C
  explanation: La ley de Samoa Americana (ASCA § 22.2003) exige un mínimo de $5,000
    por lesiones o destrucción de la propiedad de terceros en cualquier accidente.
- id: 68
  category: driver_responsibility
  question: Cuando se vende o transfiere un vehículo en Samoa Americana, ¿dentro de
    cuántos días debe el nuevo propietario solicitar una transferencia de registro?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Según ASCA § 22.1001, el nuevo propietario debe completar la transferencia
    del registro dentro de los 10 días posteriores a la fecha de la transferencia.
- id: 69
  category: driver_responsibility
  question: ¿Dónde debe guardarse la tarjeta de registro de un vehículo motorizado
    en Samoa Americana?
  choices:
    A: En la residencia del propietario
    B: En la guantera o llevada por el conductor
    C: En el maletero del vehículo
    D: En la Oficina de Vehículos Motorizados
  answer: B
  explanation: La tarjeta de registro debe llevarse en el vehículo para el cual fue
    emitida o por la persona que conduce el vehículo, para ser mostrada a petición
    de un oficial de policía.
- id: 70
  category: driver_responsibility
  question: Si choca contra un vehículo desatendido y no puede encontrar al propietario,
    ¿cuál es su responsabilidad legal en Samoa Americana?
  choices:
    A: Esperar 30 minutos y luego irse si no llega nadie
    B: Dejar una nota por escrito con su nombre, dirección e información del vehículo
      en un lugar visible
    C: Informarlo solo si el daño parece superar los $500
    D: Conducir a la estación de policía más cercana al día siguiente
  answer: B
  explanation: Los conductores que chocan contra un vehículo desatendido deben localizar
    al propietario o dejar una nota por escrito en un lugar visible proporcionando
    su información de contacto y una explicación del accidente.
- id: 71
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un requisito obligatorio para todos los vehículos
    que circulan por las carreteras públicas de Samoa Americana?
  choices:
    A: Un certificado de título válido
    B: Un certificado de registro válido
    C: Prueba de seguro de responsabilidad civil
    D: Todas las anteriores
  answer: D
  explanation: Todos los vehículos deben tener título, estar registrados y asegurados
    con al menos la cobertura mínima de responsabilidad civil para ser operados legalmente
    en las vías públicas.
- id: 72
  category: driver_responsibility
  question: ¿Cuál es la sanción por operar un vehículo motorizado en Samoa Americana
    sin el seguro de responsabilidad civil requerido?
  choices:
    A: Solo una advertencia verbal
    B: Una multa y la posible suspensión de los privilegios de conducir
    C: 30 días obligatorios de cárcel
    D: Decomiso permanente del vehículo
  answer: B
  explanation: Operar un vehículo sin seguro es una violación de la Ley de Seguro
    Obligatorio, lo que puede resultar en multas y la suspensión de la licencia de
    conducir y del registro del vehículo.
- id: 73
  category: driver_responsibility
  question: En Samoa Americana, ¿en qué parte(s) del vehículo deben estar colocadas
    las placas de matrícula?
  choices:
    A: Solo en la parte trasera
    B: Solo en la parte delantera
    C: Tanto en la parte delantera como en la trasera
    D: En la ventana trasera
  answer: C
  explanation: La ley de Samoa Americana exige que las placas de matrícula estén firmemente
    sujetas tanto en la parte delantera como en la trasera del vehículo.
- id: 74
  category: driver_responsibility
  question: Si un conductor se ve involucrado en un accidente y no presenta prueba
    de responsabilidad financiera, ¿qué medida puede tomar el Comisionado?
  choices:
    A: Aumentar los impuestos del conductor
    B: Suspender la licencia y el registro del conductor
    C: Exigir que el conductor repita el examen de conducir
    D: Nada, si el conductor no tuvo la culpa
  answer: B
  explanation: Según las leyes de responsabilidad financiera, no proporcionar una
    prueba de seguro después de un accidente puede llevar a la suspensión tanto de
    la licencia del operador como del registro del vehículo.
- id: 75
  category: driver_responsibility
  question: ¿Qué debe mostrarse en el vehículo para demostrar que ha pasado la inspección
    de seguridad anual requerida?
  choices:
    A: Una calcomanía de inspección válida en el parabrisas
    B: Una nota del mecánico en la guantera
    C: Un marco de placa de matrícula especial
    D: Un recibo de la oficina del Tesorero
  answer: A
  explanation: Al aprobar la inspección de seguridad anual, se emite una calcomanía
    de inspección oficial que debe exhibirse en el parabrisas del vehículo.
- id: 76
  category: driver_responsibility
  question: Si cambia su nombre debido a un matrimonio o una orden judicial, ¿cómo
    debe actualizar su licencia de conducir de Samoa Americana?
  choices:
    A: Esperar hasta que la licencia expire para cambiarla
    B: Escribir el nuevo nombre al dorso de la licencia actual
    C: Solicitar un duplicado de la licencia con el nuevo nombre en la OMV
    D: Notificar al departamento de policía por teléfono
  answer: C
  explanation: Cualquier cambio en el nombre legal requiere que el conductor solicite
    una licencia corregida o un duplicado en la Oficina de Vehículos Motorizados (OMV)
    para garantizar que los registros sean precisos.
- id: 77
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad al conducir por un pueblo o una zona escolar
    en Samoa Americana?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: El límite de velocidad se reduce a 15 millas por hora al pasar por
    pueblos o zonas escolares designadas para garantizar la seguridad de los peatones
    y los niños.
- id: 78
  category: safe_driving_rules
  question: Al estacionar en una pendiente cuesta abajo, ¿hacia qué dirección debe
    girar las ruedas delanteras si hay un bordillo (acera)?
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: A
  explanation: Al estacionar cuesta abajo con un bordillo, gire las ruedas hacia el
    bordillo para que, si el vehículo rueda, sea detenido por el bordillo.
- id: 79
  category: safe_driving_rules
  question: En Samoa Americana, ¿a cuántos pies de una señal de alto o semáforo no
    se debe estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Está prohibido estacionar a menos de 30 pies de cualquier señal intermitente
    oficial, señal de alto o señal de control de tráfico ubicada al costado de la
    carretera.
- id: 80
  category: safe_driving_rules
  question: ¿Cuál es la señal manual adecuada para indicar que está disminuyendo la
    velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido hacia afuera
  answer: C
  explanation: La señal manual estándar para reducir la velocidad o detenerse es el
    brazo izquierdo extendido hacia abajo con la palma de la mano mirando hacia atrás.
- id: 81
  category: safe_driving_rules
  question: ¿Según la ley de Samoa Americana, cuándo es obligatorio encender los faros
    delanteros de su vehículo?
  choices:
    A: Solo cuando llueve
    B: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    C: Desde la puesta del sol hasta la salida del sol
    D: Solo cuando se conduce fuera de los pueblos
  answer: B
  explanation: Los faros delanteros deben usarse desde media hora después de la puesta
    del sol hasta media hora antes de la salida del sol, y en cualquier otro momento
    en que la visibilidad sea inferior a 500 pies.
- id: 82
  category: safe_driving_rules
  question: Si se ve involucrado en un accidente de tráfico en Samoa Americana que
    resulte en daños a la propiedad de $100 o más, ¿cuál es el requisito legal?
  choices:
    A: Debe informarlo a la policía de inmediato
    B: Solo necesita intercambiar información del seguro
    C: Tiene 48 horas para presentar un informe en la comisaría
    D: No es necesario presentar un informe si no hay heridos
  answer: A
  explanation: Según el Código de AS § 22.0701, los accidentes que involucren lesiones,
    muerte o daños a la propiedad que superen los $100 deben informarse a la policía
    de inmediato.
- id: 83
  category: safe_driving_rules
  question: Cuando dos vehículos llegan al mismo tiempo a una intersección donde no
    hay señales de alto ni semáforos, ¿qué conductor tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja a mayor velocidad
    D: El conductor del vehículo más grande
  answer: B
  explanation: En una intersección no controlada, el conductor del vehículo de la
    izquierda debe ceder el derecho de paso al vehículo de la derecha.
- id: 84
  category: safe_driving_rules
  question: 'En Samoa Americana, es ilegal seguir a un vehículo de emergencia (como
    un camión de bomberos o una ambulancia) a una distancia menor de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Se prohíbe a los conductores seguir a aparatos de bomberos u otros
    vehículos de emergencia que respondan a una alarma a una distancia menor de 500
    pies.
- id: 85
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los giros
    en U en Samoa Americana?
  choices:
    A: Son legales en cualquier lugar siempre que se use una señal
    B: Están prohibidos en cualquier curva o cerca de la cima de una colina donde
      la visibilidad sea inferior a 500 pies
    C: Solo se permiten en zonas escolares
    D: Están estrictamente prohibidos en toda la isla
  answer: B
  explanation: Los giros en U están prohibidos en curvas o colinas donde el vehículo
    no pueda ser visto por otros conductores que se aproximen desde cualquier dirección
    dentro de los 500 pies.
- id: 86
  category: safe_driving_rules
  question: Cuando un conductor tiene la intención de girar, ¿debe señalizar su intención
    continuamente durante al menos cuántos pies antes de girar?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Se debe dar una señal de intención de girar a la derecha o a la izquierda
    continuamente durante no menos de los últimos 100 pies recorridos por el vehículo
    antes de girar.
- id: 87
  category: safe_driving_rules
  question: En Samoa Americana, ¿cuál es el límite de velocidad máximo en un pueblo
    o zona residencial a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: C
  explanation: Según las leyes de vehículos motorizados de Samoa Americana, el límite
    de velocidad máximo en cualquier pueblo o distrito residencial es de 25 millas
    por hora (mph) a menos que las señales indiquen lo contrario.
- id: 88
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia es legal adelantar a otro vehículo por la derecha
    en Samoa Americana?
  choices:
    A: Cuando el vehículo de adelante está girando o está a punto de girar a la izquierda
      y hay suficiente ancho de pavimento
    B: Cuando tiene prisa y el vehículo de adelante va demasiado lento
    C: En una carretera de un solo carril en un pueblo
    D: Nunca es legal adelantar por la derecha
  answer: A
  explanation: Adelantar por la derecha está permitido solo cuando el vehículo rebasado
    está haciendo un giro a la izquierda y hay suficiente pavimento sin obstrucciones
    para la maniobra.
- id: 89
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada detrás de otro vehículo
    en condiciones normales de conducción en Samoa Americana?
  choices:
    A: La longitud de un automóvil
    B: La regla de los 'dos segundos'
    C: 50 pies
    D: 100 pies
  answer: B
  explanation: La 'regla de los dos segundos' es la recomendación de seguridad estándar
    para mantener una distancia de seguimiento segura detrás del vehículo que está
    delante de usted.
- id: 90
  category: safe_driving_rules
  question: En Samoa Americana, si se ve involucrado en un accidente de tráfico que
    resulte en daños a la propiedad de al menos ______, debe informarlo al Departamento
    de Policía.
  choices:
    A: $50
    B: $100
    C: $500
    D: $1,000
  answer: B
  explanation: Cualquier accidente que involucre lesiones, muerte o daños a la propiedad
    de $100 o más debe informarse al Departamento de Policía de Samoa Americana de
    inmediato.
- id: 91
  category: safe_driving_rules
  question: ¿Al usar señales manuales para indicar una parada o una disminución de
    velocidad, cuál es la posición correcta del brazo del conductor?
  choices:
    A: Brazo extendido recto hacia afuera
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo agitándose en movimiento circular
  answer: C
  explanation: Para indicar una parada o disminución de velocidad mediante señales
    manuales, el conductor debe extender el brazo izquierdo hacia afuera y hacia abajo.
- id: 92
  category: safe_driving_rules
  question: 'En Samoa Americana, no se puede realizar una vuelta en U en una curva
    o cerca de la cima de una colina si su vehículo no puede ser visto por otros conductores
    que se aproximen desde cualquier dirección dentro de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las vueltas en U están prohibidas donde la visibilidad sea inferior
    a 500 pies en cualquier dirección para evitar colisiones con el tráfico que se
    aproxima.
- id: 93
  category: safe_driving_rules
  question: Al estacionar un vehículo cuesta arriba en una calle de doble sentido
    con bordillo (acera), ¿hacia dónde debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: Hacia afuera del bordillo
    C: Paralelas al bordillo
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba con bordillo, gire las ruedas hacia afuera
    del bordillo (hacia la calle) para que, si el vehículo rueda, la parte trasera
    de la llanta golpee el bordillo y detenga el automóvil.
- id: 94
  category: safe_driving_rules
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima a su vehículo desde cualquier dirección, usted debe:'
  choices:
    A: Acelerar para quitarse del camino
    B: Detenerse exactamente donde está
    C: Orillarse al borde derecho de la carretera y detenerse
    D: Seguir de cerca al vehículo de emergencia
  answer: C
  explanation: Los conductores deben ceder el paso a los vehículos de emergencia orillándose
    lo más cerca posible del borde derecho o bordillo y deteniéndose hasta que el
    vehículo haya pasado.
- id: 95
  category: safe_driving_rules
  question: En Samoa Americana, ¿quién está obligado por ley a usar el cinturón de
    seguridad en un vehículo de pasajeros privado?
  choices:
    A: Solo el conductor
    B: Solo los niños menores de 12 años
    C: El conductor y todos los pasajeros del asiento delantero
    D: Todos los pasajeros del vehículo, independientemente de su posición
  answer: C
  explanation: La ley de Samoa Americana exige que el conductor y todos los pasajeros
    del asiento delantero usen cinturones de seguridad mientras el vehículo esté en
    movimiento.
- id: 96
  category: defensive_driving
  question: En Samoa Americana, ¿cuál es la distancia de seguimiento mínima recomendada
    que debe mantener detrás del vehículo que va delante de usted bajo condiciones
    de conducción ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 5 segundos
    D: 10 segundos
  answer: B
  explanation: Según el Manual del Conductor de Samoa Americana, los conductores deben
    mantener una distancia de seguimiento mínima de al menos dos segundos detrás del
    vehículo de adelante para permitir una parada segura.
- id: 97
  category: defensive_driving
  question: 'Al conducir bajo una lluvia tropical intensa en Samoa Americana, sus
    neumáticos pueden perder todo contacto con la carretera. Esta condición se conoce
    como:'
  choices:
    A: Derrape
    B: Hidroplaneo (Hydroplaning)
    C: Rueda libre
    D: Bloqueo de tracción
  answer: B
  explanation: El hidroplaneo ocurre cuando el agua en la superficie de la carretera
    hace que los neumáticos pierdan contacto con el pavimento, lo que resulta en una
    pérdida del control de la dirección y el frenado.
- id: 98
  category: defensive_driving
  question: 'Para evitar frenar a último momento o la necesidad de girar repentinamente
    en el tráfico de las aldeas de Samoa Americana, debe mirar hacia adelante en la
    carretera al menos:'
  choices:
    A: 2 a 5 segundos
    B: 5 a 8 segundos
    C: 10 a 15 segundos
    D: 20 a 30 segundos
  answer: C
  explanation: Explorar visualmente de 10 a 15 segundos por delante le permite ver
    peligros, peatones y autobuses aiga con suficiente antelación para reaccionar
    de forma segura.
- id: 99
  category: defensive_driving
  question: En Samoa Americana, al conducir de noche, debe atenuar sus luces altas
    cuando se encuentre a cuántos pies de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Bajo las leyes de tránsito de Samoa Americana, debe cambiar a luces
    bajas cuando un vehículo que viene en sentido contrario esté a menos de 500 pies
    para evitar cegar al otro conductor.
- id: 100
  category: defensive_driving
  question: Al conducir a través de niebla densa o lluvia extremadamente fuerte en
    Samoa Americana, ¿qué luces debe utilizar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (hazard)
  answer: B
  explanation: Se deben usar las luces bajas en condiciones de niebla o lluvia intensa
    porque las luces altas se reflejan en las gotas de agua, lo que dificulta la visión.
- id: 101
  category: defensive_driving
  question: 'Cuando un autobús aiga (transporte local) se detiene para recoger o dejar
    pasajeros en Samoa Americana, un conductor defensivo debe:'
  choices:
    A: Tocar la bocina y pasar rápidamente
    B: Acelerar para pasar antes de que los pasajeros bajen
    C: Reducir la velocidad y estar preparado para peatones que crucen la calle
    D: Detenerse siempre a 50 pies detrás del autobús sin importar el tráfico
  answer: C
  explanation: Los autobuses aiga suelen detenerse en áreas donde los pasajeros deben
    cruzar la calle de inmediato; la conducción defensiva requiere precaución adicional
    con los peatones en estas zonas.
- id: 102
  category: defensive_driving
  question: 'Antes de cambiar de carril en una carretera de varios carriles en Samoa
    Americana, debe revisar sus ''puntos ciegos'' (blind spots) al:'
  choices:
    A: Mirar por el espejo retrovisor
    B: Mirar por el espejo lateral
    C: Girar la cabeza y mirar por encima del hombro
    D: Revisar la pantalla de navegación GPS
  answer: C
  explanation: Los espejos no lo muestran todo; debe girar la cabeza para revisar
    las áreas al lado y ligeramente detrás de su vehículo antes de cambiar de carril.
- id: 103
  category: defensive_driving
  question: 'La ''Ley de Velocidad Básica'' (Basic Speed Law) en Samoa Americana establece
    que:'
  choices:
    A: Siempre debe conducir al límite de velocidad indicado
    B: Puede conducir a 5 mph por encima del límite si el tráfico se mueve rápido
    C: Nunca debe conducir más rápido de lo que sea seguro para las condiciones actuales
    D: La velocidad mínima en todas las carreteras es de 15 mph
  answer: C
  explanation: La Ley de Velocidad Básica exige que los conductores ajusten su velocidad
    en función del clima, las condiciones de la carretera y el tráfico, independientemente
    del límite indicado.
- id: 104
  category: defensive_driving
  question: 'Si las carreteras en Samoa Americana están resbaladizas debido a la lluvia,
    debe aumentar su distancia de seguimiento a al menos:'
  choices:
    A: 3 segundos
    B: 4 segundos o más
    C: La longitud de un automóvil
    D: 50 pies exactamente
  answer: B
  explanation: En carreteras mojadas o resbaladizas, debe duplicar la distancia de
    seguimiento estándar de dos segundos a al menos cuatro segundos para garantizar
    suficiente tiempo de frenado.
- id: 105
  category: defensive_driving
  question: ¿Hacia dónde debe mirar para mantener su posición en el carril si las
    luces altas de un vehículo que viene en sentido contrario lo están deslumbrando?
  choices:
    A: Directamente a las luces delanteras que se aproximan
    B: A la línea central de la carretera
    C: Hacia el borde derecho de su carril
    D: Cerrar los ojos brevemente hasta que el auto pase
  answer: C
  explanation: Para evitar ser deslumbrado por el resplandor, mire hacia el borde
    derecho de su carril (la línea blanca o el borde de la carretera) para guiar su
    dirección.
- id: 106
  category: defensive_driving
  question: En Samoa Americana, el límite de velocidad en una zona de aldea designada
    es generalmente de 15 mph. ¿Por qué es esta una regla de conducción defensiva
    crítica?
  choices:
    A: Para ahorrar combustible
    B: Debido a la frecuente actividad de peatones y niños cerca de la carretera
    C: Para prevenir la contaminación acústica
    D: Porque las carreteras son demasiado estrechas para velocidades más altas
  answer: B
  explanation: Las zonas de aldeas en Samoa Americana tienen un alto tráfico de peatones,
    incluidos niños y residentes ancianos; 15 mph permite una parada inmediata si
    alguien entra en la carretera.
- id: 107
  category: defensive_driving
  question: 'Si encuentra una sección de la carretera inundada después de un fuerte
    aguacero tropical en Samoa Americana, la acción más segura es:'
  choices:
    A: Conducir rápido para evitar que el motor se apague
    B: Poner el auto en punto muerto (neutral) y avanzar por inercia
    C: Dar la vuelta y buscar otra ruta
    D: Seguir de cerca al auto de adelante
  answer: C
  explanation: Nunca debe conducir por carreteras inundadas. El agua puede ocultar
    baches profundos, arrastrar la carretera o apagar el motor, lo que genera una
    situación peligrosa.
- id: 108
  category: defensive_driving
  question: En Samoa Americana, 'seguir muy de cerca' (tailgating) es una de las principales
    causas de colisiones traseras. Bajo el sistema de puntos, ¿cuántos puntos puede
    resultar en su historial por seguir demasiado de cerca?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: Bajo el sistema de puntos de Samoa Americana, seguir demasiado de cerca
    es típicamente una infracción de 2 puntos.
- id: 109
  category: defensive_driving
  question: Al buscar peligros en Samoa Americana, ¿cuál de los siguientes es un peligro
    'oculto' común que debe vigilar cerca del borde de la carretera?
  choices:
    A: Montones de nieve
    B: Animales sueltos como perros o cerdos
    C: Placas de hielo
    D: Plantas rodadoras (tumbleweeds)
  answer: B
  explanation: En Samoa Americana, los conductores defensivos deben vigilar constantemente
    a los animales sueltos (perros, cerdos) que pueden lanzarse repentinamente a la
    carretera.
- id: 110
  category: defensive_driving
  question: Si sus frenos dejan de funcionar mientras conduce por una colina empinada
    en Tutuila, ¿cuál es la primera acción defensiva que debe tomar?
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a una marcha más baja y bombear el pedal del freno
    C: Saltar del vehículo
    D: Poner el auto en 'Park' (estacionamiento)
  answer: B
  explanation: Si los frenos fallan, cambiar a una marcha más baja utiliza el motor
    para frenar el auto, y bombear el pedal del freno puede generar suficiente presión
    hidráulica para detenerse.
- id: 111
  category: defensive_driving
  question: ¿Con cuánta anticipación debe observar el camino para evitar la necesidad
    de frenar o girar de último momento en el tráfico de Samoa Americana?
  choices:
    A: 5 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: Solo el vehículo directamente frente a usted
  answer: B
  explanation: Observar de 10 a 15 segundos hacia adelante le permite ver los peligros
    a tiempo y planificar sus movimientos de manera segura en las carreteras de Samoa
    Americana.
- id: 112
  category: defensive_driving
  question: Si su vehículo comienza a deslizarse sobre el agua (hidroplaneo) en una
    carretera mojada en Samoa Americana, ¿cuál es la acción más segura a tomar?
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante con fuerza
    C: Levantar el pie del acelerador gradualmente y mantener el volante derecho
    D: Poner el vehículo en punto muerto (neutral)
  answer: C
  explanation: El hidroplaneo ocurre cuando los neumáticos pierden contacto con la
    carretera. La respuesta más segura es reducir la velocidad gradualmente soltando
    el acelerador y evitando girar el volante o frenar de forma repentina.
- id: 113
  category: defensive_driving
  question: En Samoa Americana, ¿cuándo suelen estar las carreteras más resbaladizas
    durante una tormenta de lluvia?
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Justo cuando empieza a llover
    C: Cuando la lluvia se detiene y sale el sol
    D: Solo durante un ciclón tropical
  answer: B
  explanation: Las carreteras están más resbaladizas justo cuando empieza a llover
    porque el agua se mezcla con el aceite y el polvo en la superficie de la carretera
    que aún no han sido lavados.
- id: 114
  category: defensive_driving
  question: 'Al conducir de noche en Samoa Americana, debe bajar las luces altas cuando
    siga a otro vehículo a una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Debe bajar las luces altas cuando siga a otro vehículo a menos de 300
    pies para evitar el deslumbramiento en el espejo retrovisor del conductor que
    va adelante.
- id: 115
  category: defensive_driving
  question: Si alguien lo sigue muy de cerca (tailgating) en una carretera de dos
    carriles en Samoa Americana, ¿cuál es la mejor práctica de conducción defensiva?
  choices:
    A: Aumentar la velocidad para alejarse del conductor
    B: Tocar los frenos repetidamente para advertirle
    C: Reducir la velocidad gradualmente para animarlo a rebasar o para aumentar su
      propio margen de seguridad
    D: Detener su vehículo en medio del carril
  answer: C
  explanation: Reducir la velocidad permite que el conductor que lo sigue pase más
    fácilmente y aumenta el espacio frente a usted, dándole más tiempo para reaccionar
    si necesita frenar repentinamente.
- id: 116
  category: defensive_driving
  question: 'En Samoa Americana, debe usar sus faros delanteros siempre que la visibilidad
    se reduzca a menos de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: Una milla
  answer: B
  explanation: Se requiere el uso de faros delanteros en Samoa Americana siempre que
    no pueda ver claramente a una distancia de al menos 500 pies debido a la lluvia,
    la niebla o la oscuridad.
- id: 117
  category: defensive_driving
  question: Al buscar peligros en una intersección en una zona de aldea, ¿cuál es
    la secuencia correcta?
  choices:
    A: Mirar a la izquierda, luego a la derecha
    B: Mirar a la derecha, luego a la izquierda
    C: Mirar a la izquierda, luego a la derecha, y luego a la izquierda otra vez
    D: Mirar solo hacia adelante
  answer: C
  explanation: Debido a que el tráfico que viene de la izquierda está más cerca de
    usted, debe mirar primero a la izquierda, luego a la derecha y luego a la izquierda
    nuevamente para asegurarse de que no hayan aparecido nuevos peligros.
- id: 118
  category: defensive_driving
  question: Al seguir a un camión grande o autobús en Samoa Americana, ¿por qué debe
    mantener una distancia de seguimiento mayor que la que mantendría con un automóvil?
  choices:
    A: Porque los camiones viajan más rápido que los automóviles
    B: Para permitir que el conductor del camión lo vea en sus espejos laterales
    C: Porque los camiones tienen mejores frenos que los automóviles
    D: Para evitar que el camión ruede hacia atrás
  answer: B
  explanation: Si sigue a un vehículo grande demasiado de cerca, se encuentra en su
    'Zona Ciega' (No-Zone). Aumentar su distancia asegura que el conductor pueda verlo
    en sus espejos.
- id: 119
  category: defensive_driving
  question: Si un vehículo que viene en sentido contrario por la noche no baja sus
    luces altas, ¿hacia dónde debe mirar para evitar quedar temporalmente cegado?
  choices:
    A: A los faros del vehículo que viene en sentido contrario
    B: A la línea central de la carretera
    C: Hacia el borde derecho de su carril
    D: Cerrar los ojos brevemente
  answer: C
  explanation: Mirar hacia el borde derecho del carril (o la línea blanca) le ayuda
    a mantener el rumbo mientras minimiza el resplandor de las luces altas que vienen
    en sentido contrario.
- id: 120
  category: defensive_driving
  question: En Samoa Americana, ¿cuál es la mejor manera de prevenir la 'hipnosis
    de carretera' o la fatiga durante viajes largos?
  choices:
    A: Mirar fijamente al centro de la carretera
    B: Mantener los ojos en movimiento y observar los alrededores
    C: Apagar la radio y conducir en silencio
    D: Beber café y conducir más rápido para llegar a su destino
  answer: B
  explanation: Mantener los ojos en movimiento y observar la carretera ayuda a mantener
    el estado de alerta y evita que el cerebro entre en un estado similar al trance.
- id: 121
  category: defensive_driving
  question: Al entrar en una curva en una carretera resbaladiza en Samoa Americana,
    ¿cuál es el momento más seguro para reducir la velocidad?
  choices:
    A: Antes de entrar en la curva
    B: Mientras está en medio de la curva
    C: Al salir de la curva
    D: Solo si siente que el auto se desliza
  answer: A
  explanation: Siempre debe reducir la velocidad antes de entrar en una curva. Frenar
    mientras está en una curva en una carretera resbaladiza puede hacer que su vehículo
    patine.
- id: 122
  category: alcohol_drugs_health
  question: ¿Cuál es el período de suspensión obligatoria de la licencia por negarse
    por primera vez a someterse a una prueba química en Samoa Americana?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Según ASCA § 22.0708, si una persona bajo arresto se niega a someterse
    a una prueba química, el Comisionado suspenderá su licencia o permiso de conducir
    por un período de 6 meses.
- id: 123
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados, ¿cuál es su responsabilidad antes
    de conducir en Samoa Americana?
  choices:
    A: Puede conducir siempre que lleve la receta consigo
    B: Debe revisar la etiqueta para ver las advertencias o consultar a un médico
      sobre los efectos del medicamento al conducir
    C: Puede conducir siempre que no lo mezcle con alcohol
    D: Los medicamentos recetados nunca afectan la capacidad de conducción
  answer: B
  explanation: Muchos medicamentos recetados y de venta libre pueden causar somnolencia
    o deterioro de las facultades. Es responsabilidad del conductor asegurarse de
    no estar incapacitado, ya que puede ser condenado por DUI (conducir bajo la influencia)
    por conducir bajo los efectos de medicamentos legales.
- id: 124
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) después de beber?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Hacer ejercicio o correr
    D: Darle tiempo a su cuerpo para procesar el alcohol
  answer: D
  explanation: El tiempo es el único factor que reducirá el BAC. El cuerpo metaboliza
    el alcohol a un ritmo constante, y las "soluciones rápidas" como el café o las
    duchas no aceleran este proceso.
- id: 125
  category: alcohol_drugs_health
  question: 'En Samoa Americana, un conductor puede ser acusado de DUI si está bajo
    la influencia de:'
  choices:
    A: Solo alcohol
    B: Solo narcóticos ilegales
    C: Alcohol, drogas ilegales o cualquier sustancia controlada que afecte la capacidad
      de conducir
    D: Solo sustancias que tengan una medición de BAC
  answer: C
  explanation: Las leyes de DUI en Samoa Americana se aplican tanto al alcohol como
    a cualquier droga o sustancia controlada (incluidos los medicamentos recetados
    y de venta libre) que haga que una persona sea incapaz de operar un vehículo de
    manera segura.
- id: 126
  category: alcohol_drugs_health
  question: 'Para los titulares de una licencia de conducir comercial (CDL) en Samoa
    Americana, el límite legal de BAC mientras operan un vehículo comercial es:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: De acuerdo con las regulaciones federales y territoriales, el límite
    de BAC para los conductores comerciales que operan un vehículo motorizado comercial
    es del 0.04%.
- id: 127
  category: alcohol_drugs_health
  question: 'Si un conductor de Samoa Americana se ve involucrado en un accidente
    fatal y se sospecha de DUI, la prueba química:'
  choices:
    A: Requiere una orden escrita en todos los casos
    B: Puede administrarse sin consentimiento si existe una causa probable
    C: Es opcional y no puede usarse en el tribunal
    D: Solo se requiere si el conductor es mayor de 21 años
  answer: B
  explanation: En accidentes graves que involucren la muerte o lesiones significativas,
    las fuerzas del orden pueden requerir una prueba de sangre si existe una causa
    probable de intoxicación, a menudo respaldada por los estatutos de consentimiento
    implícito.
- id: 128
  category: alcohol_drugs_health
  question: ¿Qué efecto tiene en un conductor combinar alcohol con otra droga (como
    una pastilla para el resfriado)?
  choices:
    A: Los efectos del alcohol se cancelan
    B: La droga reducirá el nivel de BAC
    C: Crea un efecto sinérgico, haciendo que el deterioro sea mucho peor que con
      cualquiera de las dos por separado
    D: No hay un efecto combinado al conducir
  answer: C
  explanation: Combinar alcohol con otras drogas, incluso las de venta libre, puede
    multiplicar los efectos de ambas, lo que lleva a un deterioro grave del juicio
    y de las habilidades motoras.
- id: 129
  category: alcohol_drugs_health
  question: 'En Samoa Americana, si tiene una condición física o mental que pueda
    afectar su capacidad para conducir de manera segura (como la epilepsia), usted
    debe:'
  choices:
    A: Entregar su licencia de inmediato
    B: Informar la condición a la Oficina de Vehículos Motorizados (OMV)
    C: Solo conducir durante las horas del día
    D: Tener un pasajero con usted en todo momento
  answer: B
  explanation: Los conductores están legalmente obligados a revelar las condiciones
    médicas que podrían afectar su capacidad para operar un vehículo de manera segura.
    La OMV puede requerir una evaluación médica para determinar si se puede emitir
    o mantener una licencia.
- id: 130
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de conducir fatigado (conducir con
    sueño)?
  choices:
    A: Aumento del estado de alerta
    B: Tiempos de reacción más rápidos
    C: Salirse de su carril o pisar las "bandas sonoras" (rumble strips)
    D: Mejora de la visión periférica
  answer: C
  explanation: La fatiga retrasa el tiempo de reacción y disminuye la atención. Salirse
    de un carril o tener dificultad para mantener la vista enfocada son señales de
    advertencia importantes de que un conductor debe detenerse y descansar.
- id: 131
  category: alcohol_drugs_health
  question: ¿En Samoa Americana, cómo afecta el alcohol primero la capacidad de un
    conductor?
  choices:
    A: Mejora la coordinación
    B: Deteriora el juicio y el autocontrol
    C: Agudiza la visión
    D: Hace que el conductor sea más cauteloso
  answer: B
  explanation: El alcohol afecta primero las funciones superiores del cerebro. El
    juicio y la capacidad de procesar información se ven afectados mucho antes de
    que aparezcan síntomas físicos como tambalearse o hablar con dificultad.
- id: 132
  category: alcohol_drugs_health
  question: ¿Cuál es la pena máxima de cárcel por una primera condena por DUI en Samoa
    Americana?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Según el Código de Samoa Americana, un DUI (conducir bajo la influencia)
    por primera vez es un delito menor de Clase A, que conlleva una pena máxima de
    hasta un año de cárcel.
- id: 133
  category: alcohol_drugs_health
  question: 'Bajo la ley de ''Consentimiento Implícito'' de Samoa Americana, al conducir
    en vías públicas, usted ha dado su consentimiento para:'
  choices:
    A: Un registro del maletero de su vehículo
    B: Una prueba química de su aliento, sangre u orina
    C: Una revisión de sus registros médicos
    D: El embargo de su vehículo en cualquier momento
  answer: B
  explanation: El consentimiento implícito significa que se considera que cualquier
    persona que opera un vehículo motorizado en Samoa Americana ha dado su consentimiento
    para una prueba química de su aliento, sangre u orina con el fin de determinar
    el contenido de alcohol o drogas.
- id: 134
  category: alcohol_drugs_health
  question: En Samoa Americana, si un conductor se niega a someterse a una prueba
    química de alcohol, ¿cuál es la consecuencia inmediata con respecto a su privilegio
    de conducir?
  choices:
    A: Se les da una advertencia
    B: Su licencia es suspendida por al menos 6 meses
    C: Deben pagar una multa de $50
    D: No pasa nada hasta que sean condenados en el tribunal
  answer: B
  explanation: La negativa a someterse a una prueba química bajo la ley de Consentimiento
    Implícito resulta en una suspensión administrativa de la licencia, típicamente
    por un período de 6 meses a 1 año por una primera negativa.
- id: 135
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de BAC para los conductores de vehículos motorizados
    comerciales en Samoa Americana?
  choices:
    A: 0.01%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: En alineación con los estándares federales adoptados por el territorio,
    el límite de BAC (concentración de alcohol en sangre) para conductores comerciales
    (titulares de CDL) es del 0.04%.
- id: 136
  category: alcohol_drugs_health
  question: Si es condenado por un DUI en Samoa Americana y es su primera ofensa,
    ¿cuál es la pena máxima de cárcel que podría enfrentar?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Bajo el ASCA (Código Anotado de Samoa Americana), una persona condenada
    por un DUI por primera vez puede ser sentenciada a una pena de prisión que no
    exceda un año.
- id: 137
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de alcohol sus capacidades de conducción?
  choices:
    A: Mejora sus reflejos
    B: Le ayuda a concentrarse mejor en la carretera
    C: Ralentiza su tiempo de reacción y deteriora el juicio
    D: No tiene efecto si solo bebe cerveza
  answer: C
  explanation: El alcohol es un depresor que ralentiza el sistema nervioso central,
    lo que provoca tiempos de reacción más lentos, falta de coordinación y mala toma
    de decisiones.
- id: 138
  category: alcohol_drugs_health
  question: ¿Puede ser arrestado por DUI en Samoa Americana si conduce bajo la influencia
    de medicamentos legalmente recetados?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, el DUI solo se aplica al alcohol y las drogas ilegales
    C: Sí, si el medicamento deteriora su capacidad para conducir de manera segura
    D: Solo si también tiene alcohol en su sistema
  answer: C
  explanation: La ley se aplica a cualquier sustancia que deteriore la capacidad de
    una persona para operar un vehículo de manera segura, incluidos los medicamentos
    recetados y los de venta libre.
- id: 139
  category: alcohol_drugs_health
  question: 'En Samoa Americana, un conductor puede ser acusado de un ''DUI Agravado''
    más grave si es sorprendido conduciendo ebrio con:'
  choices:
    A: Una luz trasera rota
    B: Un pasajero menor de 16 años
    C: Sin neumático de repuesto en el maletero
    D: Un registro vencido
  answer: B
  explanation: Conducir bajo la influencia con un pasajero menor de edad se considera
    un factor agravante que puede dar lugar a penas mayores y cargos más altos.
- id: 140
  category: alcohol_drugs_health
  question: 'Si se ve involucrado en un accidente de tráfico en Samoa Americana y
    un oficial de policía sospecha que ha estado bebiendo, este puede:'
  choices:
    A: Esperar 24 horas antes de hacerle la prueba
    B: Exigirle que realice pruebas de sobriedad en el campo y una prueba química
    C: Solo hacerle la prueba si alguien murió
    D: No hacerle la prueba si usted afirma que no fue su culpa
  answer: B
  explanation: Los oficiales de policía tienen la autoridad para solicitar pruebas
    de sobriedad en el campo y pruebas químicas si tienen una sospecha razonable de
    deterioro después de un accidente.
- id: 141
  category: alcohol_drugs_health
  question: ¿Qué sucede con los efectos del alcohol cuando se combina con otras drogas,
    como la marihuana o medicamentos para el resfriado?
  choices:
    A: Los efectos de ambos se cancelan
    B: Los efectos se multiplican (efecto sinérgico)
    C: No hay cambios en el deterioro
    D: El alcohol se vuelve menos potente
  answer: B
  explanation: Combinar alcohol con otras drogas a menudo produce un efecto sinérgico,
    lo que significa que el deterioro total es mucho mayor que la suma de las partes.
- id: 142
  category: alcohol_drugs_health
  question: 'En Samoa Americana, si es condenado por un segundo DUI (conducir bajo
    la influencia) dentro de un período de 5 años, el tiempo mínimo obligatorio de
    cárcel es:'
  choices:
    A: 48 horas
    B: 10 días
    C: 30 días
    D: 90 días
  answer: B
  explanation: Los infractores reincidentes enfrentan sanciones significativamente
    más severas, incluyendo sentencias mínimas obligatorias de cárcel (a menudo 10
    días o más) y revocaciones de licencia más largas.
- id: 143
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes condiciones médicas debe informarse a la Oficina
    de Vehículos Motorizados en Samoa Americana porque puede afectar la seguridad
    al conducir?
  choices:
    A: Alergias estacionales
    B: Epilepsia o trastornos convulsivos
    C: Un resfriado común
    D: Miopía leve corregida con anteojos
  answer: B
  explanation: Las condiciones que causan pérdida del conocimiento o del control,
    como la epilepsia, deben informarse para garantizar que el conductor esté médicamente
    apto para operar un vehículo de manera segura.
- id: 144
  category: penalties_and_points
  question: ¿Cuántos puntos se agregan al registro de conducir de Samoa Americana
    por exceder el límite de velocidad por más de 16 millas por hora?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 10 puntos
  answer: C
  explanation: Las infracciones por exceso de velocidad de 16 mph o más sobre el límite
    establecido resultan en la adición de 6 puntos al registro del conductor en Samoa
    Americana.
- id: 145
  category: penalties_and_points
  question: En Samoa Americana, ¿cuál es la penalización de puntos por no detenerse
    ante un autobús escolar que está cargando o descargando estudiantes?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar es una infracción de seguridad
    importante en Samoa Americana y resulta en 6 puntos en el registro del conductor.
- id: 146
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una condena por arrojar basura desde un vehículo
    motorizado en Samoa Americana?
  choices:
    A: Hasta $100
    B: Hasta $250
    C: Hasta $500
    D: Hasta $1,000
  answer: C
  explanation: Según ASCA § 22.0331, arrojar basura desde un vehículo es una ofensa
    grave en Samoa Americana, sancionable con una multa de hasta $500.
- id: 147
  category: penalties_and_points
  question: En Samoa Americana, ¿cuántos puntos se asignan por 'seguir demasiado de
    cerca' (tailgating)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: Seguir demasiado de cerca es una infracción de 4 puntos bajo el sistema
    de puntos para vehículos motorizados de Samoa Americana.
- id: 148
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos por no ceder el paso en Samoa Americana?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No ceder el paso a otros vehículos o peatones resulta en la adición
    de 4 puntos a su registro de conducir.
- id: 149
  category: penalties_and_points
  question: En Samoa Americana, ¿cuántos puntos se asignan por realizar un giro ilegal
    o incorrecto?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: Los giros incorrectos, como girar desde el carril equivocado o realizar
    un giro en U ilegal, resultan en 3 puntos en el registro del conductor.
- id: 150
  category: penalties_and_points
  question: ¿Cuál es la multa estándar por una primera infracción de la ley de uso
    obligatorio del cinturón de seguridad en Samoa Americana?
  choices:
    A: Hasta $25
    B: Hasta $100
    C: Hasta $250
    D: Hasta $500
  answer: A
  explanation: La multa por no usar el cinturón de seguridad o no asegurarse de que
    los pasajeros lo lleven puesto en Samoa Americana es generalmente de $25 por la
    primera infracción.
- id: 151
  category: penalties_and_points
  question: ¿En Samoa Americana, cuántos puntos se añaden a su registro por no detenerse
    ante una señal de alto o un semáforo en rojo?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Desobedecer una señal de alto o una señal de tráfico (luz roja) resulta
    en la asignación de 4 puntos contra su historial de conducción.
- id: 152
  category: penalties_and_points
  question: ¿Cuántos puntos recibirá un conductor condenado por 'Conducción Descuidada'
    (Careless Driving) en Samoa Americana?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: La conducción descuidada, que es menos grave que la conducción temeraria,
    resulta en 4 puntos en el historial de conducción de Samoa Americana.
- id: 153
  category: penalties_and_points
  question: ¿Cuál es la sanción por estacionar un vehículo en un espacio designado
    para personas con discapacidades sin el distintivo adecuado en Samoa Americana?
  choices:
    A: Una advertencia por la primera infracción
    B: Una multa de al menos $100
    C: Suspensión obligatoria de la licencia por 30 días
    D: 2 puntos en el historial de conducción
  answer: B
  explanation: El estacionamiento ilegal en un espacio para personas con discapacidad
    en Samoa Americana es una infracción grave y conlleva una multa de al menos $100.
- id: 154
  category: penalties_and_points
  question: En Samoa Americana, si su licencia es suspendida debido a la acumulación
    de puntos, ¿qué debe hacer para recuperarla después de que termine el período
    de suspensión?
  choices:
    A: Nada, se le envía de vuelta por correo automáticamente
    B: Pagar una tarifa de restablecimiento y, potencialmente, volver a realizar el
      examen de conducir
    C: Esperar 12 meses después de que termine la suspensión
    D: Enviar una carta de disculpa al Gobernador
  answer: B
  explanation: Para restablecer una licencia suspendida en Samoa Americana, el conductor
    debe esperar a que expire el período de suspensión, pagar las tarifas de restablecimiento
    requeridas y es posible que deba volver a realizar los exámenes escritos o de
    manejo.
- id: 155
  category: penalties_and_points
  question: Si se le condena por exceso de velocidad de 11 millas por hora o más sobre
    el límite de velocidad establecido en Samoa Americana, ¿cuántos puntos se añadirán
    a su registro?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: En Samoa Americana, exceder el límite de velocidad por 11 mph o más
    resulta en 6 puntos, mientras que exceder el límite de 1 a 10 mph resulta en 3
    puntos.
- id: 156
  category: penalties_and_points
  question: En Samoa Americana, ¿cuál es la penalización de puntos por ignorar una
    señal de alto o una señal de tráfico?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Ignorar una señal de alto o un semáforo en rojo en Samoa Americana
    resulta en la asignación de 4 puntos contra su privilegio de conducir.
- id: 157
  category: penalties_and_points
  question: ¿Cuántos puntos resultan de no ceder el paso a otro vehículo o peatón
    en Samoa Americana?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: No ceder el paso se categoriza como una infracción de 4 puntos en Samoa
    Americana.
- id: 158
  category: penalties_and_points
  question: Si un conductor se ve involucrado en un accidente que implica daños a
    la propiedad y abandona la escena sin identificarse, ¿cuántos puntos se asignan?
  choices:
    A: 4 puntos
    B: 6 puntos
    C: 8 puntos
    D: 12 puntos
  answer: B
  explanation: Abandonar la escena de un accidente que involucra daños a la propiedad
    resulta en 6 puntos en Samoa Americana.
- id: 159
  category: penalties_and_points
  question: Para los conductores de 21 años o más en Samoa Americana, ¿cuál es el
    límite legal de concentración de alcohol en sangre (BAC) para ser considerado
    como conducción bajo los efectos del alcohol (DUI)?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: El límite legal de BAC para conductores adultos (21 años o más) en
    Samoa Americana es de 0.08%.
- id: 160
  category: penalties_and_points
  question: Si lo sorprenden conduciendo mientras su licencia está suspendida o revocada
    en Samoa Americana, ¿cuál es la posible sanción?
  choices:
    A: Solo una multa
    B: Una advertencia verbal
    C: Multas, posible encarcelamiento y una extensión de la suspensión
    D: No hay sanción adicional si tiene seguro
  answer: C
  explanation: Conducir con una licencia suspendida o revocada es una infracción grave
    en Samoa Americana, castigable con multas, tiempo en la cárcel y períodos de suspensión
    adicionales.
- id: 161
  category: penalties_and_points
  question: ¿En Samoa Americana, cuántos puntos se pueden eliminar de su historial
    de manejo si completa con éxito un Programa de Mejora para Conductores (Driver
    Improvement Program) aprobado?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: B
  explanation: Los conductores en Samoa Americana pueden ver eliminados 2 puntos de
    su historial tras completar con éxito un Programa de Mejora para Conductores certificado
    (curso de conducción defensiva).
- id: 162
  category: sharing_the_road
  question: Cuando un vehículo de emergencia (policía, bomberos o ambulancia) se aproxima
    con la sirena y las luces intermitentes encendidas, ¿qué debe hacer el conductor
    en Samoa Americana?
  choices:
    A: Acelerar para salir del camino
    B: Mantener la velocidad y permanecer en el carril actual
    C: Orillarse al borde derecho de la carretera y detenerse hasta que el vehículo
      haya pasado
    D: Detenerse inmediatamente en medio del carril
  answer: C
  explanation: Los conductores deben ceder el paso a los vehículos de emergencia orillándose
    lo más posible a la derecha y deteniéndose hasta que el vehículo de emergencia
    haya pasado de forma segura.
- id: 163
  category: sharing_the_road
  question: ¿Cuál es el requisito legal para los motociclistas con respecto a los
    cascos en Samoa Americana?
  choices:
    A: Solo los conductores menores de 18 años deben usar casco
    B: Los cascos son opcionales si el conductor tiene 2 años de experiencia
    C: Todos los operadores y pasajeros deben usar un casco de seguridad
    D: Solo se requiere casco en autopistas con velocidades superiores a 25 mph
  answer: C
  explanation: La ley de Samoa Americana exige que todas las personas que operen o
    viajen en una motocicleta o ciclo motorizado usen un casco de seguridad.
- id: 164
  category: sharing_the_road
  question: 'Al compartir la carretera con una bicicleta en Samoa Americana, un automovilista
    debe:'
  choices:
    A: Tocar la bocina para advertir al ciclista que se salga de la carretera
    B: Tratar la bicicleta como un vehículo con los mismos derechos y responsabilidades
    C: Obligar al ciclista a ir por el acotamiento para permitir que los autos pasen
    D: Tener siempre el derecho de paso sobre el ciclista
  answer: B
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    conductores de vehículos motorizados. Los automovilistas deben tratarlos como
    usuarios legales de la vía y proporcionarles el espacio adecuado.
- id: 165
  category: sharing_the_road
  question: Los camiones grandes tienen 'Zonas Prohibidas' (No-Zones) donde el conductor
    no puede ver su vehículo. ¿Dónde se encuentran típicamente estos puntos ciegos?
  choices:
    A: Solo directamente detrás del camión
    B: Solo en el lado izquierdo del camión
    C: Directamente delante, directamente detrás y a ambos lados del camión
    D: No hay puntos ciegos si el camión tiene espejos
  answer: C
  explanation: La 'Zona Prohibida' (No-Zone) representa las áreas de peligro alrededor
    de los camiones donde es más probable que ocurran choques porque el conductor
    del camión tiene visibilidad limitada o nula.
- id: 166
  category: sharing_the_road
  question: En Samoa Americana, ¿qué debe hacer cuando ve a un peatón que lleva un
    bastón blanco o usa un perro guía?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse y ceder el derecho de paso, ya que son ciegos o tienen discapacidad
      visual
    D: Conducir alrededor de ellos si hay suficiente espacio
  answer: C
  explanation: Los conductores deben ceder el paso a cualquier peatón que sea ciego
    o tenga una discapacidad visual, a menudo identificados por un bastón blanco o
    un perro guía.
- id: 167
  category: sharing_the_road
  question: En Samoa Americana, ¿cuántos puntos se añaden a su licencia por 'Rebasar
    un autobús escolar detenido'?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Rebasar ilegalmente un autobús escolar detenido es una infracción grave
    en Samoa Americana y resulta en 4 puntos en el historial del conductor.
- id: 168
  category: sharing_the_road
  question: Si conduce detrás de un camión grande y no puede ver los espejos laterales
    del camión, ¿qué indica esto?
  choices:
    A: El conductor del camión puede verlo mejor
    B: Usted está en el punto ciego del conductor del camión (No-Zone)
    C: El camión está a punto de girar
    D: Usted está a una distancia de seguimiento segura
  answer: B
  explanation: 'Una regla general para compartir la carretera con camiones es: ''Si
    no puede ver al conductor en sus espejos, el conductor no puede verlo a usted''.'
- id: 169
  category: sharing_the_road
  question: 'Cuando un peatón cruza la calle en una zona de aldea (village area) donde
    no hay cruces peatonales marcados, el conductor debe:'
  choices:
    A: Mantener la velocidad porque el peatón está cruzando imprudentemente
    B: Ceder el derecho de paso al peatón
    C: Tocar la bocina y hacer señales al peatón para que se mueva más rápido
    D: Solo detenerse si el peatón es un niño
  answer: B
  explanation: Se espera que los conductores en Samoa Americana tengan el cuidado
    debido para evitar chocar con cualquier peatón, independientemente de si hay un
    cruce marcado, especialmente en las zonas de las aldeas.
- id: 170
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que debe mantener al seguir a un vehículo
    de emergencia que responde a una llamada?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Generalmente es ilegal e inseguro seguir a un vehículo de emergencia
    a menos de 500 pies (500 feet) cuando este responde a una emergencia.
- id: 171
  category: sharing_the_road
  question: Al girar a la derecha, ¿un automovilista debe estar particularmente alerta
    a qué usuarios de la vía que podrían estar circulando en línea recta por el lado
    derecho del vehículo?
  choices:
    A: Otros autos
    B: Ciclistas
    C: Camiones pesados
    D: Tractores
  answer: B
  explanation: Los ciclistas suelen circular por el lado derecho de la carretera.
    Los automovilistas deben revisar sus puntos ciegos y ceder el paso a los ciclistas
    antes de realizar un giro a la derecha.
- id: 172
  category: sharing_the_road
  question: 'En Samoa Americana, si un vehículo que circula despacio es seguido por
    5 o más vehículos en una carretera donde rebasar no es seguro, el conductor del
    vehículo lento debe:'
  choices:
    A: Aumentar la velocidad por encima del límite
    B: Apartarse de la carretera en el primer apartadero (turnout) seguro para dejar
      pasar a los demás
    C: Detenerse en el carril para dejar pasar a los demás
    D: Ignorar a los otros vehículos
  answer: B
  explanation: Para mantener el flujo del tráfico y la seguridad, los vehículos lentos
    deben orillarse en lugares seguros para permitir que el tráfico acumulado pase.
- id: 173
  category: sharing_the_road
  question: ¿Por qué es peligroso rebasar a un camión grande que está señalizando
    un giro a la derecha en una intersección?
  choices:
    A: Los camiones giran más rápido que los autos
    B: Los camiones a menudo necesitan abrirse hacia la izquierda para completar un
      giro a la derecha, y usted podría quedar atrapado entre el camión y la acera
    C: Los camiones no tienen frenos mientras giran
    D: El camión podría volcarse
  answer: B
  explanation: Los vehículos grandes requieren más espacio para girar. Pueden abrirse
    hacia el carril izquierdo para no golpear la acera en un giro a la derecha; intentar
    rebasar por la derecha es extremadamente peligroso.
- id: 174
  category: sharing_the_road
  question: 'Cuando se aproxima un vehículo de emergencia (policía, bomberos o ambulancia)
    utilizando una sirena y luces intermitentes, la ley de Samoa Americana le exige:'
  choices:
    A: Aumentar la velocidad para salir del camino
    B: Orillarse al borde derecho de la carretera y detenerse
    C: Detenerse exactamente donde está en medio del carril
    D: Seguir al vehículo para ver dónde es la emergencia
  answer: B
  explanation: Los conductores deben ceder el paso a los vehículos de emergencia orillándose
    lo más posible a la derecha y deteniéndose hasta que el vehículo haya pasado.
- id: 175
  category: sharing_the_road
  question: En Samoa Americana, ¿cuál es el requisito obligatorio para los conductores
    de motocicletas y sus pasajeros con respecto al equipo de seguridad?
  choices:
    A: Los cascos solo son obligatorios para menores de 18 años
    B: Los cascos son opcionales si el límite de velocidad es inferior a 25 mph
    C: Tanto el conductor como el pasajero deben usar un casco de seguridad en todo
      momento
    D: Solo el conductor está obligado a usar casco
  answer: C
  explanation: La sección ASCA § 22.1101 exige que toda persona que opere o viaje
    en una motocicleta o ciclo motorizado en las vías públicas debe usar un casco
    de seguridad.
- id: 176
  category: sharing_the_road
  question: 'Al caminar por una carretera en Samoa Americana donde no hay aceras,
    los peatones deben caminar:'
  choices:
    A: En el lado derecho con el flujo del tráfico
    B: En el lado izquierdo de frente al tráfico que viene en sentido contrario
    C: En medio de la carretera para ser más visibles
    D: En el lado que tenga más sombra
  answer: B
  explanation: Por seguridad, los peatones deben caminar por el lado izquierdo de
    la carretera de frente al tráfico que se aproxima para poder ver a los vehículos
    que vienen hacia ellos.
- id: 177
  category: sharing_the_road
  question: Al compartir la carretera con camiones grandes, los conductores deben
    evitar la 'Zona-No' (No-Zone). ¿Qué es la 'Zona-No'?
  choices:
    A: El área donde los camiones no tienen permitido circular
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: El carril designado para autobuses públicos
    D: La zona de límite de velocidad para vehículos pesados
  answer: B
  explanation: La 'Zona-No' se refiere a los grandes puntos ciegos alrededor de un
    camión donde el conductor del camión no puede ver a otros vehículos, lo que aumenta
    el riesgo de una colisión.
- id: 178
  category: sharing_the_road
  question: 'En Samoa Americana, un ciclista que circula por la calzada:'
  choices:
    A: Está obligado a seguir las mismas leyes de tránsito que los conductores de
      vehículos motorizados
    B: Es considerado un peatón y debe circular en contra del tráfico
    C: Tiene permitido ignorar las señales de alto y los semáforos
    D: Está obligado a permanecer en la acera en todo momento
  answer: A
  explanation: Los ciclistas tienen los mismos derechos y responsabilidades que los
    conductores de vehículos motorizados y deben obedecer todas las señales de tránsito,
    semáforos y marcas en el pavimento.
- id: 179
  category: sharing_the_road
  question: 'Cuando un peatón ciego cruza la calle utilizando un bastón blanco o un
    perro guía, usted debe:'
  choices:
    A: Tocar la bocina para que sepa que usted está allí
    B: Rodearlo rápidamente conduciendo
    C: Ceder el paso y detener su vehículo
    D: Esperar a que cruce y luego gritarle que el camino está despejado
  answer: C
  explanation: Los conductores deben ceder el paso a cualquier peatón ciego que lleve
    un bastón blanco o que vaya acompañado de un perro guía.
- id: 180
  category: sharing_the_road
  question: 'Cuando un camión grande o un autobús está girando a la derecha en una
    intersección, los conductores deben tener en cuenta que:'
  choices:
    A: El camión permanecerá en el carril del extremo derecho durante todo el giro
    B: El camión puede necesitar abrirse hacia la izquierda para completar el giro
    C: El camión puede detenerse instantáneamente si usted se interpone en su camino
    D: El camión tiene el derecho de paso sobre todas las señales de tráfico
  answer: B
  explanation: Los vehículos grandes necesitan más espacio para girar y a menudo se
    abren hacia la izquierda para no golpear la acera en un giro a la derecha. Los
    conductores nunca deben intentar meterse entre el camión y la acera.
- id: 181
  category: sharing_the_road
  question: 'En Samoa Americana, la ''división de carril'' (una motocicleta que circula
    entre filas de vehículos detenidos o en movimiento en el mismo carril) es:'
  choices:
    A: Legal si la motocicleta va a menos de 15 mph
    B: Fomentada para reducir la congestión del tráfico
    C: Ilegal e insegura
    D: Legal solo durante las horas del día
  answer: C
  explanation: Las motocicletas tienen derecho al uso total de un carril, y la división
    de carril (compartir un carril con un automóvil o circular entre carriles) se
    considera ilegal y peligrosa.
- id: 182
  category: sharing_the_road
  question: 'Si usted sigue a una bicicleta por la noche, debe usar sus luces bajas
    porque:'
  choices:
    A: Las luces altas pueden cegar al ciclista
    B: Las luces altas son ilegales en Samoa Americana por la noche
    C: Las luces bajas ayudan al ciclista a ver mejor la carretera
    D: Se requiere que las bicicletas tengan espejos que reflejen las luces altas
  answer: A
  explanation: Las luces altas pueden cegar temporalmente a un ciclista, al igual
    que pueden hacerlo con un automovilista. Utilice siempre las luces bajas al acercarse
    o seguir a otros usuarios de la carretera.
- id: 183
  category: sharing_the_road
  question: Según la ley de Samoa Americana, ¿cuándo se le permite rebasar a un autobús
    escolar detenido que tiene sus luces rojas intermitentes encendidas?
  choices:
    A: Cuando tiene prisa y el conductor del autobús le hace señas para que pase
    B: Nunca, a menos que las luces rojas dejen de parpadear y el brazo de parada
      se haya retraído
    C: Si no hay niños visibles en la carretera
    D: Si la carretera tiene al menos tres carriles
  answer: B
  explanation: Es ilegal rebasar a un autobús escolar detenido con sus luces rojas
    intermitentes encendidas y el brazo de parada extendido. Debe esperar hasta que
    se apaguen las señales.
- id: 184
  category: sharing_the_road
  question: Las bicicletas que circulan de noche en Samoa Americana deben estar equipadas
    con ¿cuál de los siguientes elementos?
  choices:
    A: Una luz blanca en la parte delantera y un reflector rojo en la parte trasera
    B: Un timbre o bocina audible a 500 pies
    C: Luces de neón en los radios
    D: Una bandera amarilla de al menos 6 pies de altura
  answer: A
  explanation: Para circular de noche, las bicicletas deben tener una lámpara delantera
    que emita una luz blanca y un reflector rojo trasero para ser visibles para otros
    automovilistas.
- id: 185
  category: sharing_the_road
  question: 'Cuando vea a un peatón en un paso de peatones que no está controlado
    por una señal de tráfico, usted debe:'
  choices:
    A: Reducir la velocidad y continuar si no están en su carril
    B: Ceder el paso y detenerse para dejar que el peatón cruce
    C: Tocar la bocina para decirle al peatón que se dé prisa
    D: Mantener su velocidad, ya que los peatones deben ceder el paso a los autos
  answer: B
  explanation: Los conductores deben ceder el paso a los peatones dentro de cualquier
    paso de peatones marcado o no marcado en una intersección.
- id: 186
  category: vehicle_information
  question: 'De acuerdo con la ley de Samoa Americana, cada vehículo motorizado debe
    estar equipado con una bocina en buen estado de funcionamiento capaz de emitir
    un sonido audible en condiciones normales desde una distancia no menor de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Según el Código Anotado de Samoa Americana (ASCA) Título 22, la bocina
    de un vehículo debe ser audible desde una distancia de al menos 200 pies.
- id: 187
  category: vehicle_information
  question: ¿En Samoa Americana, cuál es el porcentaje mínimo requerido de transmisión
    de luz para un dispositivo de protección solar (tinte de ventana) en el parabrisas
    y las ventanas laterales delanteras?
  choices:
    A: 35%
    B: 50%
    C: 70%
    D: 20%
  answer: C
  explanation: El ASCA 22.0345 especifica que ninguna persona operará un vehículo
    motorizado con un tinte de ventana que permita menos del 70% de transmisión de
    luz en el parabrisas y las ventanas laterales delanteras.
- id: 188
  category: vehicle_information
  question: 'Cada vehículo motorizado en Samoa Americana debe estar equipado con al
    menos un espejo ubicado de manera que refleje al conductor una vista de la carretera
    por una distancia de al menos:'
  choices:
    A: 100 pies hacia atrás
    B: 200 pies hacia atrás
    C: 300 pies hacia atrás
    D: 500 pies hacia atrás
  answer: B
  explanation: Las regulaciones de Samoa Americana requieren un espejo retrovisor
    que proporcione una vista de la carretera por al menos 200 pies hacia la parte
    trasera del vehículo.
- id: 189
  category: vehicle_information
  question: 'En Samoa Americana, los frenos de servicio de un vehículo de pasajeros
    deben ser capaces de detener el vehículo desde una velocidad de 20 millas por
    hora dentro de una distancia de:'
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 40 pies
  answer: C
  explanation: El Título 22 del ASCA requiere que los frenos de servicio en un vehículo
    de pasajeros estándar puedan detener el vehículo dentro de los 30 pies cuando
    viaja a 20 mph sobre un pavimento seco y nivelado.
- id: 190
  category: vehicle_information
  question: ¿Cuándo se requiere que los faros estén encendidos en Samoa Americana?
  choices:
    A: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    B: Solo cuando está lloviendo
    C: Desde la puesta del sol hasta la salida del sol y siempre que la visibilidad
      sea inferior a 500 pies
    D: Solo cuando se conduce fuera de Pago Pago
  answer: C
  explanation: Los faros deben usarse desde la puesta del sol hasta la salida del
    sol y en cualquier otro momento en que la visibilidad se reduzca a menos de 500
    pies debido al clima u otras condiciones.
- id: 191
  category: vehicle_information
  question: 'Una luz trasera en un vehículo en Samoa Americana debe ser de color rojo
    y debe ser visible desde una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Las luces traseras deben emitir una luz roja claramente visible desde
    una distancia de 500 pies hacia la parte trasera del vehículo.
- id: 192
  category: vehicle_information
  question: ¿En Samoa Americana, cuál es la profundidad mínima legal de la banda de
    rodadura para los neumáticos de un vehículo de pasajeros?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros y no pasarán la inspección en
    Samoa Americana si tienen menos de 2/32 de pulgada de profundidad en la banda
    de rodadura.
- id: 193
  category: vehicle_information
  question: 'La placa de matrícula trasera (placa) de un vehículo en Samoa Americana
    debe estar iluminada por una luz blanca para que sea claramente legible desde
    una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La lámpara de la placa de matrícula debe estar diseñada para que la
    placa de registro sea legible desde una distancia de 50 pies hacia atrás.
- id: 194
  category: vehicle_information
  question: Según la ley de Samoa Americana, ¿cuál de las siguientes opciones está
    PROHIBIDA con respecto a los sistemas de escape de los vehículos?
  choices:
    A: Usar un silenciador que haya sido reparado
    B: Usar un escape libre (muffler cutout), derivación (bypass) o dispositivo similar
    C: Usar un silenciador que reduzca el ruido
    D: Usar un silenciador hecho de acero inoxidable
  answer: B
  explanation: El ASCA 22.0343 prohíbe el uso de un escape libre (muffler cutout),
    derivación (bypass) o dispositivo similar en un vehículo motorizado en una carretera.
- id: 195
  category: vehicle_information
  question: 'En Samoa Americana, las luces delanteras de largo alcance (luces altas)
    deben ajustarse de modo que revelen personas y vehículos a una distancia de al
    menos:'
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: Las luces delanteras de largo alcance (equipo de iluminación de carretera
    de haz múltiple) deben estar orientadas y tener la intensidad suficiente para
    revelar personas y vehículos a una distancia de al menos 350 pies hacia adelante.
- id: 196
  category: vehicle_information
  question: 'En Samoa Americana, todo vehículo motorizado debe estar equipado con
    un freno de estacionamiento que sea capaz de mantener el vehículo inmóvil en:'
  choices:
    A: Cualquier pendiente en la que se opere
    B: Solo superficies planas
    C: Una pendiente del 5% solamente
    D: Una pendiente del 10% solamente
  answer: A
  explanation: El freno de estacionamiento debe ser capaz de mantener el vehículo
    inmóvil en cualquier pendiente en la que se opere, bajo todas las condiciones
    de carga.
- id: 197
  category: vehicle_information
  question: 'En Samoa Americana, es ilegal operar un vehículo motorizado que emita:'
  choices:
    A: Cualquier vapor de agua visible
    B: Ruido excesivo o inusual o humo molesto
    C: Sonido de una radio estándar de fábrica
    D: Aire de la unidad de aire acondicionado
  answer: B
  explanation: El ASCA 22.0343 establece que todo vehículo motorizado debe estar equipado
    con un silenciador para evitar ruidos excesivos o inusuales y humo molesto.
- id: 198
  category: vehicle_information
  question: 'Según la ley de Samoa Americana, todo vehículo motorizado debe estar
    equipado con una bocina que se pueda escuchar desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Título 22 del ASCA exige que todo vehículo motorizado esté equipado
    con una bocina en buen estado de funcionamiento capaz de emitir un sonido audible
    en condiciones normales desde una distancia no inferior a 200 pies.
- id: 199
  category: vehicle_information
  question: En Samoa Americana, ¿a qué hora deben encenderse las luces delanteras
    del vehículo?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    C: Desde media hora después de la puesta del sol hasta media hora antes de la
      salida del sol
    D: Solo cuando está lloviendo o hay niebla
  answer: C
  explanation: El ASCA 22.1502 especifica que las luces delanteras deben encenderse
    desde media hora después de la puesta del sol hasta media hora antes de la salida
    del sol, y en cualquier otro momento en que la visibilidad no sea suficiente.
- id: 200
  category: vehicle_information
  question: De acuerdo con los estándares de equipo de Samoa Americana, los frenos
    de servicio en un vehículo de pasajeros deben poder detener el vehículo desde
    una velocidad de 20 mph en cuántos pies?
  choices:
    A: 15 pies
    B: 25 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: Según el Código de Samoa Americana, todo vehículo motorizado debe tener
    frenos capaces de detener el vehículo desde una velocidad de 20 mph en una distancia
    de 30 pies en una carretera seca, lisa y nivelada.
- id: 201
  category: vehicle_information
  question: 'En Samoa Americana, las luces traseras montadas en la parte posterior
    deben emitir una luz roja que sea claramente visible desde una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El código ASCA 22.1505 exige que todo vehículo de motor lleve en la
    parte trasera una lámpara que exhiba una luz roja claramente visible bajo condiciones
    atmosféricas normales desde una distancia de 500 pies hacia atrás.
- id: 202
  category: vehicle_information
  question: 'La luz que ilumina la placa de matrícula trasera en Samoa Americana debe
    hacer que la placa sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Samoa Americana exige una luz blanca para iluminar la placa
    de registro trasera de modo que sea claramente legible desde una distancia de
    50 pies hacia atrás.
- id: 203
  category: vehicle_information
  question: ¿En qué lugar de Samoa Americana es legal colocar calcomanías o letreros
    en el parabrisas de un vehículo?
  choices:
    A: En cualquier lugar, siempre que sean pequeñas
    B: Solo en las esquinas inferiores para no obstruir la visión del conductor
    C: Solo en la parte superior central detrás del espejo retrovisor
    D: En ningún lugar; las calcomanías están estrictamente prohibidas en el parabrisas
  answer: B
  explanation: El código ASCA 22.1512 establece que ninguna persona debe conducir
    un vehículo de motor con cualquier letrero o cartel en el parabrisas delantero
    que obstruya la visión clara del conductor; las calcomanías requeridas por la
    ley están permitidas en las esquinas inferiores.
- id: 204
  category: vehicle_information
  question: Según las regulaciones de Samoa Americana, ¿cuál es la oscuridad máxima
    permitida para el polarizado de las ventanas laterales?
  choices:
    A: 20% de transmisión de luz
    B: 35% de transmisión de luz
    C: 50% de transmisión de luz
    D: 70% de transmisión de luz
  answer: B
  explanation: Las normas administrativas de Samoa Americana generalmente siguen el
    estándar de que las ventanas laterales deben permitir el paso de al menos el 35%
    de la luz (35% de transmisión de luz).
- id: 205
  category: vehicle_information
  question: En Samoa Americana, ¿con cuántas 'lámparas de parada' (luces de freno)
    en funcionamiento debe estar equipado cada vehículo de motor en la parte trasera?
  choices:
    A: Al menos una
    B: Al menos dos
    C: Al menos tres
    D: Las luces de freno son opcionales si se usan señales manuales
  answer: A
  explanation: Aunque los vehículos modernos vienen con más, el código ASCA 22.1507
    exige que cada vehículo de motor esté equipado con al menos una lámpara de parada
    en la parte trasera del vehículo.
- id: 206
  category: signs_and_signals
  question: Cuando se encuentre con una luz roja intermitente en una intersección
    en Samoa Americana, ¿qué debe hacer?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse solo si se aproximan otros vehículos
    C: Detenerse por completo y proceder cuando sea seguro hacerlo
    D: Aumentar la velocidad para despejar la intersección rápidamente
  answer: C
  explanation: Una luz roja intermitente se trata igual que una señal de alto (pare);
    debe detenerse por completo y ceder el paso antes de continuar.
- id: 207
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla continua en su lado de la demarcación central
    de la carretera en Samoa Americana?
  choices:
    A: Puede rebasar si el camino está despejado
    B: Se encuentra en una zona de alta velocidad
    C: Está prohibido rebasar en su carril
    D: Debe girar a la derecha inmediatamente
  answer: C
  explanation: Una línea amarilla continua en su lado de la demarcación central significa
    que está prohibido rebasar a otros vehículos en su dirección de viaje.
- id: 208
  category: signs_and_signals
  question: Si tiene la intención de girar a la derecha y está utilizando señales
    manuales, ¿cómo debe colocar su brazo?
  choices:
    A: Extender el brazo izquierdo recto hacia afuera de la ventana
    B: Extender el brazo izquierdo hacia afuera y doblarlo hacia arriba a la altura
      del codo
    C: Extender el brazo izquierdo hacia afuera y doblarlo hacia abajo a la altura
      del codo
    D: Mover la mano en movimiento circular
  answer: B
  explanation: La señal manual estándar para un giro a la derecha es el brazo izquierdo
    extendido por la ventana y doblado hacia arriba en un ángulo de 90 grados.
- id: 209
  category: signs_and_signals
  question: ¿Cuál es el significado de una luz amarilla intermitente en una intersección?
  choices:
    A: Detenerse y esperar la luz verde
    B: La luz está a punto de ponerse roja
    C: Reducir la velocidad y proceder con precaución
    D: Ceder el paso a todo el tráfico que venga solo por la izquierda
  answer: C
  explanation: Una luz amarilla intermitente advierte a los conductores que deben
    reducir la velocidad y estar especialmente alertas al cruzar la intersección.
- id: 210
  category: signs_and_signals
  question: En Samoa Americana, ¿qué forma tiene una señal de 'Ceda el paso' (Yield)?
  choices:
    A: Octágono
    B: Rombo
    C: Triángulo con la punta hacia abajo
    D: Banderín
  answer: C
  explanation: Las señales de tráfico estándar en Samoa Americana siguen el manual
    MUTCD de EE. UU., donde una señal de Ceda el paso es un triángulo equilátero que
    apunta hacia abajo.
- id: 211
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla fija en un semáforo?
  choices:
    A: Debería acelerar para pasar antes de la luz roja
    B: La señal está cambiando a rojo; despeje la intersección o deténgase si es seguro
      hacerlo
    C: Usted tiene el derecho de paso sobre los peatones
    D: Deténgase y espere a la luz verde
  answer: B
  explanation: Una luz amarilla fija indica que la señal verde está terminando y que
    la señal roja se mostrará inmediatamente después.
- id: 212
  category: signs_and_signals
  question: ¿Qué señal manual debe usar un conductor para indicar que está disminuyendo
    la velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido hacia afuera
  answer: C
  explanation: Para señalar una parada o disminución de velocidad mediante señales
    manuales, el conductor extiende el brazo izquierdo hacia abajo.
- id: 213
  category: signs_and_signals
  question: ¿Qué significan las líneas blancas sólidas dobles pintadas en el pavimento?
  choices:
    A: Puede cambiar de carril con precaución
    B: Los cambios de carril están prohibidos
    C: La carretera es de un solo sentido
    D: Se está aproximando a una señal de alto (STOP)
  answer: B
  explanation: Las líneas blancas sólidas dobles indican que el cambio de carril está
    prohibido y que debe permanecer en su carril actual.
- id: 214
  category: signs_and_signals
  question: ¿Qué tipo de zona indica una señal en forma de pentágono (cinco lados)
    en Samoa Americana?
  choices:
    A: Zona de hospital
    B: Zona de no rebasar
    C: Zona escolar o cruce escolar
    D: Parque público
  answer: C
  explanation: Una señal de pentágono de cinco lados se utiliza exclusivamente para
    advertir a los conductores que se aproximan a una escuela o a un cruce escolar.
- id: 215
  category: signs_and_signals
  question: Cuando un semáforo muestra una flecha verde y una luz roja al mismo tiempo,
    ¿qué se le permite hacer?
  choices:
    A: Detenerse y esperar a que la luz roja cambie a verde
    B: Girar con cuidado en la dirección de la flecha después de ceder el paso a los
      peatones
    C: Seguir recto únicamente
    D: Girar en cualquier dirección siempre que ceda el paso
  answer: B
  explanation: Una flecha verde significa que tiene un giro "protegido" en esa dirección,
    incluso si la señal principal está en rojo, siempre que ceda el paso a los peatones
    en el cruce peatonal.
- id: 216
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de tráfico en forma de diamante (rombo)?
  choices:
    A: Reglamentaria (Ley)
    B: Guía o información
    C: Advertencia de peligros o condiciones especiales
    D: Pare (STOP) o Ceda el paso (YIELD)
  answer: C
  explanation: Las señales en forma de diamante se utilizan como señales de advertencia
    para alertar a los conductores sobre posibles peligros, como curvas, intersecciones
    o tráfico que se incorpora.
- id: 217
  category: signs_and_signals
  question: En Samoa Americana, ¿qué significa una línea blanca sólida en el borde
    derecho de la carretera?
  choices:
    A: Un carril exclusivo para bicicletas
    B: El borde del carril de circulación (línea de niebla)
    C: Un camino exclusivo para peatones
    D: Una zona donde el estacionamiento siempre está permitido
  answer: B
  explanation: Una línea blanca sólida en el lado derecho de la carretera marca el
    borde del carril de circulación y ayuda a los conductores a mantenerse en la carretera
    por la noche o en condiciones de poca visibilidad.
- id: 218
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una señal de alto (STOP) donde no hay una
    línea de parada marcada ni un cruce peatonal?
  choices:
    A: Detenerse en el punto más cercano a la vía que se cruza donde tenga visibilidad
      del tráfico que se aproxima
    B: Reducir la velocidad y detenerse solo si ve otro automóvil
    C: Detenerse 20 pies antes de la señal
    D: No es necesario detenerse si la intersección está despejada
  answer: A
  explanation: Si no hay una línea de parada o un cruce peatonal, debe detenerse en
    el punto más cercano a la intersección que le permita ver el tráfico que viene
    de todas las direcciones antes de entrar en la intersección.
- id: 219
  category: signs_and_signals
  question: En Samoa Americana, ¿qué debe hacer un conductor al acercarse a una señal
    de tráfico roja circular fija?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse y permanecer detenido hasta que la luz cambie a verde
    C: Detenerse solo si hay tráfico cruzado
    D: Acelerar para despejar la intersección
  answer: B
  explanation: Según ASCA 22.0323, una señal roja fija significa que el tráfico vehicular
    debe detenerse en una línea de parada claramente marcada o antes de entrar al
    cruce peatonal y debe permanecer detenido hasta que se muestre una indicación
    para proceder.
- id: 220
  category: signs_and_signals
  question: Según la ley de Samoa Americana, ¿se permite girar a la derecha con luz
    roja?
  choices:
    A: No, nunca está permitido
    B: Sí, pero solo entre las 9:00 PM y las 5:00 AM
    C: Sí, después de detenerse por completo y ceder el paso a los peatones y a otro
      tráfico, a menos que una señal lo prohíba
    D: Sí, pero solo si el conductor toca la bocina primero
  answer: C
  explanation: ASCA 22.0323(a)(3)(B) permite a los conductores entrar con precaución
    en la intersección para realizar un giro a la derecha después de detenerse, siempre
    que cedan el paso a los peatones y a otro tráfico legal, a menos que haya una
    señal que prohíba dicho giro.
- id: 221
  category: signs_and_signals
  question: ¿Qué indica una luz roja intermitente en Samoa Americana?
  choices:
    A: La señal está averiada; continúe sin detenerse
    B: Lo mismo que una señal de alto (stop); deténgase, ceda el paso y continúe cuando
      sea seguro
    C: Reduzca la velocidad y prepárese para la luz verde
    D: Los peatones tienen la prioridad de paso, pero los vehículos no necesitan detenerse
  answer: B
  explanation: Según ASCA 22.0326, una señal roja intermitente requiere que los conductores
    se detengan en una línea de parada claramente marcada. El derecho a proceder está
    sujeto a las reglas aplicables después de detenerse en una señal de alto.
- id: 222
  category: signs_and_signals
  question: Cuando un semáforo muestra una luz amarilla fija, ¿qué le indica a un
    conductor en Samoa Americana?
  choices:
    A: La luz verde está a punto de aparecer
    B: El conductor debe acelerar para ganarle a la luz roja
    C: El movimiento verde relacionado está terminando y una luz roja se mostrará
      inmediatamente después
    D: El conductor tiene la prioridad de paso sobre los peatones
  answer: C
  explanation: ASCA 22.0323 define una luz amarilla fija como una advertencia de que
    el movimiento verde está terminando y que se mostrará una señal roja de inmediato.
- id: 223
  category: signs_and_signals
  question: 'En Samoa Americana, una luz amarilla intermitente significa:'
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: La luz está a punto de cambiar a roja; deténgase inmediatamente
    C: Los conductores pueden proceder a través de la intersección o pasar dicha señal
      únicamente con precaución
    D: Ceder el paso a todo el tráfico que venga únicamente por la izquierda
  answer: C
  explanation: ASCA 22.0326 establece que cuando una lente amarilla se ilumina con
    destellos rápidos intermitentes, los conductores pueden proceder a través de la
    intersección o pasar la señal únicamente con precaución.
- id: 224
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas continuas dobles en el centro de la
    calzada en Samoa Americana?
  choices:
    A: Se permite adelantar desde cualquier dirección
    B: Se permite adelantar solo durante las horas del día
    C: Está prohibido adelantar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles indican que está prohibido adelantar
    para el tráfico que circula en cualquier dirección. Los conductores deben mantenerse
    a la derecha de estas líneas.
- id: 225
  category: signs_and_signals
  question: 'Una señal en forma de triángulo con la punta hacia abajo se utiliza exclusivamente
    para:'
  choices:
    A: Señales de alto (Stop)
    B: Señales de ceder el paso (Yield)
    C: Zonas escolares
    D: Zonas de no adelantar
  answer: B
  explanation: De acuerdo con los estándares de control de tráfico utilizados en Samoa
    Americana, el triángulo equilátero que apunta hacia abajo es la forma estándar
    para las señales de ceder el paso (Yield).
- id: 226
  category: signs_and_signals
  question: ¿Qué indica una señal en forma de banderín (triángulo lateral) colocada
    en el lado izquierdo de la carretera?
  choices:
    A: Zona escolar
    B: Zona de no adelantar (No Passing Zone)
    C: Hospital adelante
    D: Calle sin salida
  answer: B
  explanation: La señal en forma de banderín se utiliza para marcar el inicio de una
    zona de no adelantar, generalmente colocada en el lado izquierdo de la carretera
    de frente al conductor.
- id: 227
  category: signs_and_signals
  question: En Samoa Americana, ¿qué representa usualmente una señal de tráfico en
    forma de diamante?
  choices:
    A: Información reglamentaria (como límites de velocidad)
    B: Advertencia o peligro adelante
    C: Información de servicios (como gasolina o comida)
    D: Guía direccional
  answer: B
  explanation: Las señales en forma de diamante son señales de advertencia estándar
    que se utilizan para alertar a los conductores sobre posibles peligros o cambios
    en las condiciones de la carretera más adelante.
- id: 228
  category: signs_and_signals
  question: Si ve una señal de 'No Entrar' (Do Not Enter), ¿qué debe hacer?
  choices:
    A: Entrar lentamente si vive en esa calle
    B: Verificar si viene tráfico en sentido contrario y luego proceder
    C: No pase la señal; usted va en sentido contrario
    D: Solo entrar si conduce un vehículo comercial
  answer: C
  explanation: La señal de 'No Entrar' es una señal reglamentaria que indica que el
    tráfico tiene prohibido entrar en la carretera o rampa en la dirección en la que
    se encuentra la señal.
- id: 229
  category: signs_and_signals
  question: En Samoa Americana, ¿qué indica una señal en forma de pentágono (cinco
    lados)?
  choices:
    A: Una zona de construcción
    B: Un cruce de ferrocarril
    C: Una zona escolar o cruce escolar
    D: Un parque público
  answer: C
  explanation: Una señal de pentágono de cinco lados se utiliza específicamente para
    advertir a los conductores que están entrando en una zona escolar o acercándose
    a un cruce escolar.
- id: 230
  category: signs_and_signals
  question: Cuando ve una señal con fondo naranja, ¿qué debe esperar?
  choices:
    A: Un mirador panorámico
    B: Una zona de construcción o mantenimiento
    C: Un aeropuerto cercano
    D: Una autopista de alta velocidad
  answer: B
  explanation: El naranja es el color de fondo estándar para las señales de control
    de tráfico temporales en zonas de trabajo de construcción y mantenimiento.
