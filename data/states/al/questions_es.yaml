questions:
- id: 1
  category: driver_responsibility
  question: ¿Qué sucede con su atención médica si sufre un accidente y es un donante
    de órganos registrado?
  choices:
    A: Los médicos priorizarán la preservación de órganos sobre salvar su vida.
    B: La prioridad número uno es salvar su vida.
    C: Será trasladado a un hospital especial para donantes de órganos.
    D: Su familia debe pagar por su atención médica de emergencia.
  answer: B
  explanation: 'El manual establece que es un mito que convertirse en donante afecte
    la atención médica. El hecho es: ''Si es ingresado en un hospital, la prioridad
    número uno es salvar su vida''.'
- id: 2
  category: license_system
  question: ¿Qué símbolo aparecerá en su licencia de conducir de Alabama si elige
    ser donante de órganos?
  choices:
    A: Una cinta verde
    B: Una cruz roja
    C: Un corazón rojo
    D: Una estrella azul
  answer: C
  explanation: Según el manual, 'El título "organ donor" (donante de órganos) con
    un corazón rojo aparecerá en su licencia'.
- id: 3
  category: driver_responsibility
  question: Según el manual, ¿con qué frecuencia aproximadamente se agrega a alguien
    a la lista de espera nacional de trasplantes de órganos?
  choices:
    A: Cada minuto
    B: Cada 10 minutos
    C: Cada hora
    D: Cada día
  answer: B
  explanation: El manual establece que 'Se agrega a alguien a la lista cada diez minutos,
    y aproximadamente 18 personas morirán cada día mientras esperan un órgano'.
- id: 4
  category: driver_responsibility
  question: Si acepta donar sus órganos, ¿cuál es el costo financiero para su familia
    o patrimonio por la donación?
  choices:
    A: Una tarifa fija de $500
    B: El costo de la operación de extracción
    C: La mitad de los gastos funerarios
    D: No hay costo financiero por la donación de órganos o tejidos
  answer: D
  explanation: 'El manual aclara un mito común al afirmar: ''No hay costo financiero
    para la familia o el patrimonio del donante por la donación de órganos o tejidos''.'
- id: 5
  category: license_system
  question: ¿Qué agencia emite las licencias de conducir en Alabama?
  choices:
    A: Departamento de Transporte
    B: Agencia de Aplicación de la Ley de Alabama, Servicios de Licencias de Conducir
      (Alabama Law Enforcement Agency, Driver License Services)
    C: Departamento de Vehículos Motorizados (DMV)
    D: Oficina de Seguridad en las Carreteras
  answer: B
  explanation: 'El Capítulo 1 del manual establece: ''La Agencia de Aplicación de
    la Ley de Alabama, Servicios de Licencias de Conducir, emite las licencias de
    conducir''.'
- id: 6
  category: driver_testing
  question: Un solicitante cuya licencia de conducir de Alabama haya estado vencida
    por más de ¿cuántos años? debe aprobar el examen de conducir requerido.
  choices:
    A: Un año
    B: Dos años
    C: Tres años
    D: Cinco años
  answer: C
  explanation: 'El manual establece: ''Todos los solicitantes que no hayan tenido
    licencia en Alabama o cuya licencia de Alabama haya estado vencida por más de
    tres años deben aprobar el examen de conducir requerido''.'
- id: 7
  category: driver_testing
  question: Si posee una licencia de conducir válida de otro estado que no ha estado
    vencida por más de un año, ¿de qué está exento al solicitar una licencia de Alabama?
  choices:
    A: De pagar la tarifa de la licencia
    B: De aprobar un examen de conducir
    C: Del examen de la vista
    D: De proporcionar identificación
  answer: B
  explanation: Según el manual, 'El titular de una licencia de otro estado que no
    haya estado vencida por más de un año no tiene que aprobar un examen de conducir'.
- id: 8
  category: license_system
  question: ¿Cuál de los siguientes vehículos puede operarse temporalmente en una
    carretera de Alabama sin licencia de conducir?
  choices:
    A: Un camión de entrega comercial
    B: Un tractor agrícola
    C: Una motocicleta
    D: Un vehículo recreativo (RV)
  answer: B
  explanation: El manual enumera las exenciones al requisito de licencia de conducir,
    incluyendo 'Cualquier persona mientras conduce cualquier tractor agrícola o implemento
    de labranza operado o movido temporalmente en la carretera'.
- id: 9
  category: license_system
  question: ¿El personal militar de otros estados destinado en Alabama necesita obtener
    una licencia de conducir de Alabama?
  choices:
    A: Sí, dentro de los 30 días posteriores a su llegada a Alabama.
    B: Sí, a menos que vivan en una base militar.
    C: No, siempre que tengan al menos 16 años y posean una licencia de conducir válida
      de su estado de origen.
    D: No, el personal militar está completamente exento de necesitar cualquier licencia
      de conducir.
  answer: C
  explanation: No se requiere una licencia de conducir de Alabama para 'Un residente
    de al menos 16 años de edad que tenga en su posesión inmediata una licencia de
    conducir válida emitida en su estado o país de origen. Esto incluye al personal
    militar de otros estados y sus familias destinados en Alabama...'
- id: 10
  category: license_system
  question: Un no residente que tenga una licencia de conducir válida de su estado
    de residencia anterior puede conducir sin una licencia de Alabama durante ¿cuántos
    días? después de convertirse en residente de Alabama.
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: El manual establece que 'Un no residente que tenga una licencia de
    conducir válida del estado de residencia anterior puede conducir sin una licencia
    de Alabama durante 30 días después de convertirse en residente del estado'.
- id: 11
  category: license_system
  question: ¿Un no residente de al menos 16 años de edad de un país que no requiere
    licencia puede conducir en Alabama por un máximo de cuántos días en un año calendario?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: C
  explanation: El manual establece que un no residente de un país sin requisitos de
    licencia puede operar un vehículo motorizado 'por no más de 90 días en cualquier
    año calendario, si el vehículo operado está debidamente registrado para el año
    en curso en el país de origen...'
- id: 12
  category: license_system
  question: ¿Cuál de los siguientes no residentes tiene permitido conducir en Alabama
    sin una licencia de conducir de Alabama?
  choices:
    A: Un estudiante de medio tiempo sin licencia de su estado de origen
    B: Un estudiante de tiempo completo debidamente inscrito en una escuela de Alabama
      que posea una licencia válida de su estado de origen
    C: Un turista que ha estado en el estado durante 120 días
    D: Una persona cuya licencia de otro estado fue suspendida recientemente
  answer: B
  explanation: No se requiere una licencia de Alabama para 'Cualquier estudiante no
    residente de tiempo completo debidamente inscrito y registrado en una escuela,
    colegio, universidad o escuela técnica en este estado, que posea una licencia
    válida de su estado o país de origen'.
- id: 13
  category: license_system
  question: Según la ley de Alabama, ¿no se emitirá una licencia de conducir a ninguna
    persona menor de qué edad?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: La sección 'Quién no puede obtener una licencia' establece explícitamente
    que no se emitirá una licencia de conducir de Alabama a 'Personas menores de 16
    años de edad'.
- id: 14
  category: license_system
  question: ¿Puede obtener una licencia de conducir de Alabama si su privilegio de
    conducir está suspendido o revocado en otro estado?
  choices:
    A: Sí, si la suspensión fue por una infracción menor.
    B: Sí, después de pagar una tarifa de transferencia de fuera del estado.
    C: No, no se emitirá una licencia a nadie cuyos derechos de conducción estén suspendidos
      o revocados en cualquier estado.
    D: No, a menos que apruebe nuevamente el examen de manejo de Alabama.
  answer: C
  explanation: El manual establece que no se emitirá una licencia de conducir de Alabama
    a 'Cualquier persona cuyos derechos o privilegios de conducir estén suspendidos
    o revocados en cualquier estado'.
- id: 15
  category: license_system
  question: 'No se emitirá una licencia de conducir de Alabama a una persona si tiene
    una discapacidad física o mental que:'
  choices:
    A: Le obligue a usar anteojos mientras conduce.
    B: Le impida operar de manera segura un vehículo motorizado en opinión de la ALEA
      o del oficial examinador.
    C: Le obligue a conducir un vehículo de transmisión automática.
    D: Le impida aprobar una prueba de aptitud física.
  answer: B
  explanation: No se emitirá una licencia a 'Cualquier persona afligida o que sufra
    de una discapacidad física o mental que, en opinión de la ALEA o del oficial examinador,
    le impida [operar un vehículo motorizado de manera segura]'.
- id: 16
  category: license_system
  question: De acuerdo con la ley de Alabama, una persona menor de 19 años no puede
    obtener la licencia si no cumple con ¿cuál requisito?
  choices:
    A: Registro de votantes
    B: Graduación de escuela secundaria o asistencia actual
    C: Registro en el Servicio Selectivo
    D: Verificación de empleo
  answer: B
  explanation: No se emitirá una licencia de conducir de Alabama a ninguna persona
    menor de 19 años que no cumpla con la Ley de Alabama 93-368, que requiere la graduación
    de la escuela secundaria o la asistencia actual.
- id: 17
  category: license_system
  question: Si un solicitante de una licencia de conducir de Alabama presenta exactamente
    dos formas de identificación, ¿qué debe ser cierto sobre estos documentos?
  choices:
    A: Ambos documentos deben contener una fotografía.
    B: Al menos uno debe contener una fotografía y uno debe ser de la 'Lista Primaria'
      (Primary Listing).
    C: Ambos documentos deben ser de la 'Lista Secundaria' (Secondary Listing).
    D: No se requiere que ninguno tenga una fotografía si están ante notario.
  answer: B
  explanation: Los solicitantes deben presentar dos formas de identificación, al menos
    una de las cuales debe contener una fotografía, y una forma debe ser de la 'Lista
    Primaria' (Primary Listing).
- id: 18
  category: license_system
  question: ¿Qué documentación debe presentar un solicitante que transfiere una licencia
    de conducir de otro estado?
  choices:
    A: Su licencia de fuera del estado, su tarjeta de Seguro Social y otra forma de
      la 'Lista Primaria' (Primary Listing)
    B: Solo su licencia de fuera del estado y un certificado de nacimiento
    C: Tres formas de identificación sin fotografía
    D: Su licencia de fuera del estado y un diploma de escuela secundaria
  answer: A
  explanation: Los solicitantes que transfieren una licencia de conducir de otro estado
    deben presentar su licencia de conducir de fuera del estado, su tarjeta de Seguro
    Social (o documento aceptable) Y otra forma de la 'Lista Primaria' (Primary Listing).
- id: 19
  category: license_system
  question: ¿Cuál de los siguientes haría que un documento sea inaceptable para probar
    la identificación?
  choices:
    A: Es un documento original.
    B: Es una copia certificada por la agencia emisora.
    C: Se ha utilizado líquido corrector (white-out) en información pertinente.
    D: Está impreso en papel de color.
  answer: C
  explanation: Un documento sería inaceptable si se ha utilizado líquido corrector
    (white-out) en información pertinente, entre otras alteraciones o daños.
- id: 20
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para probar su Número
    de Seguro Social?
  choices:
    A: Una factura de servicios públicos con su nombre
    B: Un formulario de impuestos W2
    C: Una tarjeta de biblioteca
    D: Un contrato de arrendamiento vigente
  answer: B
  explanation: Un formulario de impuestos W2 original figura como uno de los documentos
    aceptables requeridos como prueba de un número de Seguro Social.
- id: 21
  category: license_system
  question: 'Para que un documento ante notario sea aceptado, la fecha de vencimiento
    de la comisión del notario debe ser:'
  choices:
    A: Dentro de los próximos 30 días
    B: Legible y vigente en la fecha en que se notarizó el documento
    C: Válida por al menos un año a partir de la fecha de la solicitud
    D: Dejada en blanco
  answer: B
  explanation: Los documentos notarizados deben cumplir con varios requisitos, incluyendo
    que la fecha completa en que vence la comisión del notario debe ser legible y
    debe haber estado vigente en la fecha en que se notarizó el documento.
- id: 22
  category: license_system
  question: ¿Cuánto tiempo de permanencia permitido en los Estados Unidos deben reflejar
    los documentos de inmigración para ser aceptables?
  choices:
    A: Al menos 30 días
    B: Al menos 60 días
    C: Al menos 90 días
    D: Al menos 160 días
  answer: D
  explanation: Los documentos de inmigración deben reflejar al menos 160 días de tiempo
    de permanencia permitido restante en los Estados Unidos.
- id: 23
  category: license_system
  question: ¿Cuál de los siguientes formularios deben presentar todos los solicitantes
    menores de 19 años?
  choices:
    A: Un Formulario de Inscripción/Exclusión de Estudiantes (DL-1-93) vigente
    B: Una exención de consentimiento paterno firmada
    C: Un formulario de autorización médica
    D: Un comprobante de empleo
  answer: A
  explanation: Todos los solicitantes menores de 19 años deben presentar un Formulario
    de Inscripción/Exclusión de Estudiantes (DL-1-93) vigente, completado y firmado
    por el personal autorizado.
- id: 24
  category: license_system
  question: ¿Qué documento específico se requiere para que todos los solicitantes
    de 15 años demuestren su fecha de nacimiento?
  choices:
    A: Una identificación escolar con foto
    B: Un Certificado de Nacimiento de EE. UU. certificado emitido por una agencia
      designada
    C: Una tarjeta de Seguro Social
    D: Un formulario de impuestos W2
  answer: B
  explanation: Se requiere un Certificado de Nacimiento de EE. UU. certificado, emitido
    por una agencia designada por la autoridad estatal o federal, para todos los solicitantes
    de 15 años según el Título 36-6-8(b).
- id: 25
  category: driver_testing
  question: ¿Cómo se administran los exámenes escritos de la licencia de conducir
    a los solicitantes con discapacidad auditiva?
  choices:
    A: A través de un intérprete en vivo proporcionado por el solicitante
    B: Utilizando equipos de prueba automatizados en Lenguaje de Señas Americano (ASL)
    C: Mediante la lectura de una versión del examen en braille
    D: Viendo un video con subtítulos
  answer: B
  explanation: Los exámenes escritos pueden administrarse a personas con discapacidad
    auditiva en Lenguaje de Señas Americano (ASL) utilizando equipos de prueba automatizados
    en ciertas oficinas de Licencias de Conducir.
- id: 26
  category: driver_testing
  question: ¿Quién es elegible para realizar un examen oral para su licencia de conducir?
  choices:
    A: Cualquier solicitante que prefiera hablar en lugar de escribir
    B: Solicitantes que no pueden leer ni comprender las pruebas de conocimientos
    C: Solo solicitantes que transfieren una licencia de otro estado
    D: Solo solicitantes menores de 16 años
  answer: B
  explanation: Los exámenes orales están disponibles para los solicitantes que no
    pueden leer ni comprender las pruebas de conocimientos.
- id: 27
  category: license_system
  question: ¿A qué edad puede una persona obtener una licencia de aprendizaje (Learner
    License) restringida en Alabama?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: Cualquier persona de 15 años de edad puede obtener una licencia de
    aprendizaje restringida con el fin de aprender a operar un vehículo motorizado
    de manera segura y efectiva.
- id: 28
  category: safe_driving_rules
  question: 'La restricción ''Y'' en una licencia de conducir Clase D de Alabama indica
    que el titular puede operar un vehículo motorizado solo si está acompañado por
    una persona que tenga al menos:'
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: La restricción 'Y' indica que el titular puede operar un vehículo motorizado
    mientras esté acompañado por una persona que tenga 21 años de edad.
- id: 29
  category: license_system
  question: ¿Cuál de los siguientes se considera un 'Documento Primario' para fines
    de identificación?
  choices:
    A: Licencia de matrimonio
    B: Pasaporte de los EE. UU. vigente
    C: Tarjeta de identificación de seguro médico
    D: Tarjeta del Servicio Selectivo
  answer: B
  explanation: Un pasaporte de los EE. UU. vigente figura en la lista de 'DOCUMENTOS
    PRIMARIOS', mientras que las licencias de matrimonio, las tarjetas de seguro médico
    y las tarjetas del Servicio Selectivo son 'DOCUMENTOS SECUNDARIOS'.
- id: 30
  category: license_system
  question: Si un solicitante ha sido deportado previamente de los Estados Unidos,
    ¿qué documentación adicional debe presentar?
  choices:
    A: Una carta de recomendación de un ciudadano estadounidense
    B: Prueba del Servicio de Inmigración y Control de Aduanas (ICE) de que su estatus
      de presencia legal ha sido restaurado
    C: Una licencia de conducir extranjera válida
    D: Un certificado de naturalización
  answer: B
  explanation: Un solicitante que ha sido deportado de los Estados Unidos debe presentar
    una prueba del Servicio de Inmigración y Control de Aduanas (ICE) de que su estatus
    de presencia legal ha sido restaurado.
- id: 31
  category: license_system
  question: ¿Qué indica una restricción 'Y' en una licencia de conducir Clase D de
    Alabama?
  choices:
    A: El titular debe usar lentes correctivos al conducir.
    B: El titular solo puede operar una motocicleta (motor driven cycle).
    C: El titular puede operar un vehículo motorizado con un conductor con licencia
      ocupando el asiento a su lado.
    D: El titular está restringido a conducir únicamente durante las horas del día.
  answer: C
  explanation: Según el manual, la restricción 'Y' indica que el titular puede operar
    un vehículo motorizado con un conductor con licencia ocupando el asiento al lado
    del conductor.
- id: 32
  category: license_system
  question: ¿Cuánto tiempo debe una persona de 16 años pero menor de 18 tener una
    Licencia de Aprendiz (Learner License) antes de poder realizar el examen de conducir
    para una licencia regular?
  choices:
    A: 3 meses
    B: 6 meses o hasta cumplir los 18 años
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: El manual establece que una persona de 16 años pero menor de 18 debe
    haber tenido una Licencia de Aprendiz durante seis meses o hasta cumplir los 18
    años antes de realizar el examen de conducir.
- id: 33
  category: vehicle_information
  question: ¿Un joven de 14 o 15 años puede obtener una licencia restringida para
    operar una motocicleta (motor driven cycle) que no exceda qué peso y cilindrada
    del motor?
  choices:
    A: 200 libras y 150cc
    B: 250 libras y 200cc
    C: 300 libras y 250cc
    D: 150 libras y 100cc
  answer: A
  explanation: El manual establece que un joven de 14 o 15 años puede obtener una
    licencia restringida para operar una motocicleta que no pese más de 200 libras
    ni exceda los 150cc de cilindrada del motor.
- id: 34
  category: license_system
  question: ¿Qué restricción se coloca en una licencia de conducir Clase M de Alabama
    emitida a un joven de 14 o 15 años para una motocicleta (motor driven cycle)?
  choices:
    A: Una restricción 'Y'
    B: Una restricción 'B'
    C: Una restricción 'M'
    D: Una restricción 'A'
  answer: B
  explanation: Al aprobar el examen requerido, a un solicitante de 14 o 15 años se
    le emitirá una licencia de conducir Clase M de Alabama con una restricción 'B',
    lo que indica que solo puede operar una motocicleta.
- id: 35
  category: license_system
  question: ¿A qué edad puede una persona obtener una licencia de embarcación (vessel
    license) de Alabama tras aprobar el examen requerido?
  choices:
    A: 10 años de edad o más
    B: 12 años de edad o más
    C: 14 años de edad o más
    D: 16 años de edad o más
  answer: B
  explanation: El manual especifica que cualquier persona de 12 años de edad o más
    puede obtener una licencia de embarcación tras aprobar el examen de embarcación
    requerido.
- id: 36
  category: driver_testing
  question: ¿Cuál es la tarifa para realizar el examen de conocimientos de la licencia
    de conducir en Alabama?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: La tarifa para cada examen de conocimientos es de $5.00 y no se aceptan
    cheques.
- id: 37
  category: driver_testing
  question: ¿Quién debe acompañar a un solicitante de 16 años cuando realiza el examen
    de conducir?
  choices:
    A: Un instructor de manejo con licencia
    B: Cualquier conductor con licencia mayor de 21 años
    C: Un padre, madre o tutor legal
    D: No se requiere que nadie lo acompañe
  answer: C
  explanation: El manual establece que los solicitantes de dieciséis años deben estar
    acompañados por un padre, madre o tutor legal para el examen de conducir.
- id: 38
  category: driver_testing
  question: ¿Necesita un solicitante de 17 años estar acompañado por un padre, madre
    o tutor legal para el examen de conducir?
  choices:
    A: Sí, todos los solicitantes menores de 18 años requieren un padre, madre o tutor.
    B: Sí, a menos que hayan completado la educación vial.
    C: No, un solicitante de 17 años no tiene que estar acompañado por un padre, madre
      o tutor.
    D: No, pero deben estar acompañados por un instructor de manejo con licencia.
  answer: C
  explanation: Según el manual, un solicitante de diecisiete años no tiene que estar
    acompañado por un padre, madre o tutor para el examen de conducir.
- id: 39
  category: driver_testing
  question: ¿Cuál de las siguientes situaciones causará una reprobación inmediata
    y la terminación del examen de conducir?
  choices:
    A: Pedirle al examinador que repita una instrucción
    B: Una acción peligrosa
    C: Estacionarse ligeramente torcido
    D: Conducir un vehículo con transmisión manual
  answer: B
  explanation: Las causas de reprobación inmediata y terminación del examen de conducir
    incluyen una violación de una ley de tránsito, una acción peligrosa, cualquier
    accidente prevenible o la falta de cooperación/negativa a realizar una maniobra.
- id: 40
  category: driver_testing
  question: ¿A quién se le permite viajar en el vehículo como pasajero durante su
    examen de conducir?
  choices:
    A: Un padre, madre o tutor legal
    B: Un instructor de manejo con licencia
    C: Un amigo o hermano
    D: No se permiten pasajeros ni mascotas
  answer: D
  explanation: El manual establece explícitamente que no se permiten pasajeros ni
    mascotas en el vehículo durante el examen de conducir.
- id: 41
  category: driver_responsibility
  question: ¿Qué puede suceder si opera un vehículo motorizado infringiendo las restricciones
    impuestas en su licencia de conducir?
  choices:
    A: Se le requerirá volver a tomar el examen de conocimientos.
    B: Recibirá una carta de advertencia.
    C: Puede resultar en la pérdida de su licencia.
    D: Su vehículo será confiscado permanentemente.
  answer: C
  explanation: El manual establece que la operación de un vehículo motorizado infringiendo
    las restricciones puede resultar en la pérdida de su licencia.
- id: 42
  category: driver_testing
  question: ¿Cuál de los siguientes es un equipo requerido para el vehículo utilizado
    durante el examen de manejo?
  choices:
    A: Una cámara de reversa
    B: Dos métodos separados para aplicar los frenos
    C: Un sistema de navegación GPS
    D: Polarizado de ventanas personalizado
  answer: B
  explanation: El equipo requerido para el examen incluye un espejo retrovisor, bocina,
    limpiaparabrisas, dos métodos separados para aplicar los frenos, silenciador,
    faros delanteros, luces traseras, placa de matrícula válida, luz de freno, señales
    direccionales y cinturones de seguridad.
- id: 43
  category: license_system
  question: ¿Cómo define el manual del conductor de Alabama una motocicleta?
  choices:
    A: Un vehículo motorizado con cuatro ruedas y un sillín
    B: Un vehículo motorizado que tiene un asiento o sillín, diseñado para viajar
      en no más de tres ruedas, excluyendo un tractor
    C: Cualquier vehículo de dos ruedas que pese más de 500 libras
    D: Una bicicleta motorizada con una cilindrada inferior a 50 cc
  answer: B
  explanation: Una motocicleta se define como un vehículo motorizado que tiene un
    asiento o sillín para el uso del conductor y está diseñado para viajar en no más
    de tres ruedas en contacto con el suelo, pero excluyendo un tractor.
- id: 44
  category: driver_testing
  question: ¿Qué sucede si no aprueba el examen de la vista al solicitar una licencia?
  choices:
    A: Queda descalificado permanentemente para conducir en Alabama.
    B: Debe realizar el examen de manejo únicamente durante las horas del día.
    C: Se le requerirá que un especialista de la vista con licencia le examine los
      ojos y entregue el informe.
    D: Debe pagar una tarifa adicional para volver a tomar el examen de la vista de
      inmediato.
  answer: C
  explanation: Si no aprueba su examen de la vista, se le requerirá que un especialista
    de la vista con licencia le examine los ojos y entregue el informe al examinador.
- id: 45
  category: driver_testing
  question: ¿Qué debe hacer para indicarle al examinador que está al tanto de las
    condiciones a su alrededor mientras retrocede el vehículo durante el examen de
    manejo?
  choices:
    A: Mirar exclusivamente la pantalla de la cámara de reversa
    B: Tocar la bocina tres veces
    C: Girar la cabeza y mirar sobre su hombro derecho
    D: Encender las luces de emergencia
  answer: C
  explanation: Durante el examen, debe girar la cabeza cuando observe el tráfico y
    mirar sobre su hombro derecho mientras retrocede para indicarle al examinador
    que está al tanto de las condiciones a su alrededor.
- id: 46
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para obtener una Licencia de Embarcación
    (Vessel License) en Alabama?
  choices:
    A: 12 años de edad
    B: 14 años de edad
    C: 15 años de edad
    D: 16 años de edad
  answer: A
  explanation: Según la tabla de requisitos de edad mínima del manual, debe tener
    al menos 12 años para obtener una Licencia de Embarcación.
- id: 47
  category: driver_testing
  question: Al llegar para su examen de manejo, ¿qué se requiere con respecto al vehículo
    que trae?
  choices:
    A: Debe ser un vehículo de entrenamiento de doble control.
    B: Debe ser conducido al examen por un conductor con licencia.
    C: Debe ser alquilado en una escuela de manejo certificada.
    D: Debe tener un peso bruto vehicular inferior a 10,000 libras.
  answer: B
  explanation: A menos que ya tenga el derecho legal de conducir, debe presentarse
    al examen de manejo en un vehículo conducido por un conductor con licencia que
    debe permanecer para retirarlo si usted reprueba.
- id: 48
  category: license_system
  question: ¿De cuánto tiempo es el período de gracia durante el cual su licencia
    de conducir de Alabama sigue siendo válida después de su fecha de vencimiento?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: La ley de Alabama otorga un período de gracia de 60 días después de
    la fecha de vencimiento de una licencia de conducir para fines de renovación,
    y la licencia sigue siendo válida durante este período de tiempo.
- id: 49
  category: driver_responsibility
  question: ¿Cuántos días tiene para notificar a la División de Servicios de Licencias
    (License Services Division) después de cambiar su dirección dentro de Alabama?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Después de cambiar su dirección dentro de Alabama, tiene 30 días para
    notificar a la División de Servicios de Licencias sobre la nueva dirección.
- id: 50
  category: license_system
  question: ¿Qué clase de licencia se requiere generalmente para todos los vehículos
    de pasajeros estándar?
  choices:
    A: Clase A
    B: Clase C
    C: Clase D
    D: Clase M
  answer: C
  explanation: Se requiere una licencia Clase D para generalmente todos los vehículos
    de pasajeros, excepto los vehículos de las Clases A, B, C o M.
- id: 51
  category: penalties_and_points
  question: ¿Qué cargos penales pueden aplicarse si una persona presenta una declaración
    jurada falsa para obtener un duplicado de la licencia de conducir?
  choices:
    A: Malversación
    B: Falsificación, Perjurio o ambos
    C: Solo robo de identidad
    D: Solo infracción de tráfico
  answer: B
  explanation: Cualquier persona que presente una declaración jurada falsa para obtener
    un duplicado de la licencia de conducir puede ser acusada de Falsificación, Perjurio
    o ambos, según el Código Penal de Alabama.
- id: 52
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir de Alabama antes
    de que expire?
  choices:
    A: Dos años después de su emisión
    B: Cuatro años después de su emisión
    C: Cinco años después de su emisión
    D: Ocho años después de su emisión
  answer: B
  explanation: Su licencia de conducir vence cuatro años después de su emisión, y
    la fecha de vencimiento se muestra en la licencia.
- id: 53
  category: driver_testing
  question: ¿Cuál es la tarifa para realizar el examen de conocimientos de Operador
    Clase D?
  choices:
    A: $5.00
    B: $25.00
    C: $31.25
    D: $36.25
  answer: A
  explanation: De acuerdo con el programa de tarifas de los exámenes de conocimientos,
    la tarifa para un examen de conocimientos de Operador Clase D es de $5.00.
- id: 54
  category: license_system
  question: Se requiere una Licencia de Conducir Comercial (CDL) Clase A para vehículos
    combinados con una Clasificación de Peso Combinado Bruto (GCWR) que exceda las
    26,000 libras, siempre que el vehículo remolcado exceda ¿qué peso?
  choices:
    A: 5,000 libras
    B: 10,000 libras
    C: 15,000 libras
    D: 26,000 libras
  answer: B
  explanation: La Clase A se aplica a vehículos combinados con un GCWR que exceda
    las 26,000 libras, siempre que la Clasificación de Peso Bruto del Vehículo (GVWR)
    del vehículo remolcado exceda las 10,000 libras.
- id: 55
  category: license_system
  question: Se requiere una Licencia de Conducir Comercial Clase C para vehículos
    que pesen 26,000 libras o menos si están señalizados para materiales peligrosos
    o diseñados para transportar a más de ¿cuántas personas?
  choices:
    A: 10 personas incluyendo al conductor
    B: 12 personas incluyendo al conductor
    C: 15 personas incluyendo al conductor
    D: 20 personas incluyendo al conductor
  answer: C
  explanation: Las licencias Clase C son para vehículos con un GVWR de 26,000 libras
    o menos que están señalizados para materiales peligrosos o diseñados para transportar
    a más de 15 personas, incluyendo al conductor.
- id: 56
  category: alcohol_drugs_health
  question: Si parece que tiene una deficiencia física o mental que afecta su conducción,
    ¿qué se le podría exigir que proporcione al estado?
  choices:
    A: Una nueva tarifa de examen de manejo
    B: Una declaración de un médico que muestre su historial médico y su condición
      actual
    C: Un certificado de finalización de un curso de conducción defensiva
    D: Una declaración jurada firmada por un familiar directo
  answer: B
  explanation: Se le puede solicitar que proporcione una declaración de un médico
    que muestre su historial médico y su condición actual en lo que respecta a su
    capacidad de conducción si tiene una deficiencia física o mental.
- id: 57
  category: license_system
  question: ¿Hasta cuántos años después de su fecha de vencimiento se puede renovar
    una licencia de conducir de Alabama sin realizar un examen?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 4 años
  answer: C
  explanation: Una licencia de conducir de Alabama puede renovarse sin examen dentro
    de un período de 3 años después de su vencimiento, aunque es ilegal operar un
    vehículo con una licencia vencida.
- id: 58
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para obtener una Tarjeta de Identificación
    para No Conductores de Alabama?
  choices:
    A: No hay requisito de edad
    B: 12 años
    C: 14 años
    D: 15 años
  answer: A
  explanation: Según la tabla de requisitos de edad mínima en el manual, no hay un
    "Requisito de edad" para una tarjeta de identificación.
- id: 59
  category: license_system
  question: Si bien puede renovar su licencia en línea o en un quiosco, ¿qué acción
    requiere que vea a un examinador de licencias de conducir en persona?
  choices:
    A: Pagar la tarifa de renovación
    B: Actualizar su licencia digital en un teléfono inteligente
    C: Agregar o eliminar clases de licencia, restricciones y endosos
    D: Solicitar un duplicado de la licencia después de perder la original
  answer: C
  explanation: El manual establece que para cambiar su dirección o para agregar o
    eliminar clases de licencia, restricciones y endosos, debe ver a un examinador
    de licencias de conducir.
- id: 60
  category: license_system
  question: ¿Cuál es el criterio de Clasificación de Peso Bruto del Vehículo (GVWR)
    para que un solo vehículo requiera una licencia de conducir comercial Clase B?
  choices:
    A: Excede las 10,000 libras
    B: Excede las 16,000 libras
    C: Excede las 26,000 libras
    D: Excede las 32,000 libras
  answer: C
  explanation: Según el manual, la Clase B incluye vehículos sencillos o combinados
    donde el GVWR del vehículo sencillo excede las 26,000 libras.
- id: 61
  category: license_system
  question: ¿Qué endoso de CDL se requiere para operar un vehículo con remolques dobles
    o triples?
  choices:
    A: Endoso T
    B: Endoso X
    C: Endoso H
    D: Endoso N
  answer: A
  explanation: El manual establece que el Endoso T es requerido para remolques dobles
    o triples.
- id: 62
  category: license_system
  question: ¿A qué edad puede un operador de embarcación con licencia operar una moto
    acuática motorizada solo, si nació después del 1 de enero de 2002?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 21 años
  answer: B
  explanation: La Ley de Mejora de la Seguridad en la Navegación (Boating Safety Enhancement
    Act) establece que un operador con licencia, de 14 años o más, puede operar solo.
- id: 63
  category: driver_responsibility
  question: Al operar un vehículo motorizado en Alabama, ¿cuándo debe presentar su
    licencia de conducir a un oficial de la ley?
  choices:
    A: Solo si está involucrado en un choque
    B: Solo si se le emite una citación de tráfico
    C: A petición de él o ella
    D: Solo en los puestos de control fronterizos estatales oficiales
  answer: C
  explanation: En Alabama, un conductor debe estar preparado para presentar su licencia
    de conducir a cualquier oficial de la ley a petición de él o ella.
- id: 64
  category: penalties_and_points
  question: ¿Cuál es la tarifa mínima de restablecimiento para una persona cuya licencia
    de conducir ha sido cancelada, suspendida, revocada o descalificada?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: D
  explanation: Cualquier persona cuya licencia de conducir haya sido cancelada, suspendida,
    revocada o descalificada debe pagar una tarifa de restablecimiento no menor a
    $100.
- id: 65
  category: penalties_and_points
  question: Si el restablecimiento de su licencia es el resultado de una condena relacionada
    con drogas, ¿cuál es la tarifa adicional requerida?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: A
  explanation: El manual establece que el restablecimiento resultante de condenas
    relacionadas con drogas requiere una tarifa adicional de $25.
- id: 66
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones requiere que el Director revoque
    su licencia de conducir?
  choices:
    A: Carreras en las autopistas
    B: Huir o intentar eludir a un oficial de policía
    C: Tres condenas por conducción temeraria en un plazo de 12 meses
    D: No mantener el seguro SR-22
  answer: C
  explanation: El Director debe revocar su licencia al recibir un registro de su condena
    por tres condenas por conducción temeraria (reckless driving) en un plazo de 12
    meses. Las otras opciones son motivos de suspensión.
- id: 67
  category: penalties_and_points
  question: Su licencia de conducir puede ser suspendida si tiene entre 15 y 18 años
    y hace ¿cuál de las siguientes acciones?
  choices:
    A: Recibir una multa por exceso de velocidad
    B: Retirarse de la escuela bajo ciertas condiciones antes de la graduación
    C: Conducir entre la medianoche y las 6 AM
    D: No pasar una prueba de visión
  answer: B
  explanation: Su licencia de conducir puede ser suspendida si tiene entre 15 y 18
    años y se retira de la escuela bajo ciertas condiciones antes de la graduación.
- id: 68
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su registro de conducir por Conducción Temeraria
    (Reckless Driving) o Peligro Temerario que involucre un vehículo motorizado?
  choices:
    A: 2 Puntos
    B: 4 Puntos
    C: 5 Puntos
    D: 6 Puntos
  answer: D
  explanation: De acuerdo con el Sistema de Puntos de Alabama, la Conducción Temeraria
    o el Peligro Temerario que involucre la operación de un vehículo motorizado resulta
    en 6 puntos.
- id: 69
  category: penalties_and_points
  question: ¿Cuántos puntos se añadirán a su registro de conducir por rebasar un autobús
    escolar detenido?
  choices:
    A: 3 Puntos
    B: 4 Puntos
    C: 5 Puntos
    D: 6 Puntos
  answer: C
  explanation: El Sistema de Puntos de Alabama asigna 5 puntos por Rebasar un Autobús
    Escolar Detenido.
- id: 70
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceder el límite de velocidad en 26 mph
    o más?
  choices:
    A: 2 Puntos
    B: 3 Puntos
    C: 4 Puntos
    D: 5 Puntos
  answer: D
  explanation: Exceder el límite de velocidad en 26 mph o más resulta en la asignación
    de 5 puntos en su registro de conducir.
- id: 71
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resulta en la asignación de exactamente
    2 puntos en su historial de conducción?
  choices:
    A: Seguir a otro vehículo demasiado de cerca
    B: No ceder el paso
    C: Infracción por carril inadecuado
    D: Conducir por el lado equivocado de la carretera/rebase ilegal
  answer: C
  explanation: Una infracción por carril inadecuado es una ofensa de 2 puntos. Seguir
    demasiado de cerca son 3 puntos, no ceder el paso son 5 puntos y conducir por
    el lado equivocado de la carretera son 4 puntos.
- id: 72
  category: penalties_and_points
  question: Según el programa del sistema de puntos de Alabama, ¿por cuánto tiempo
    se suspenderá su licencia si acumula entre 15 y 17 puntos en un período de 2 años?
  choices:
    A: 60 días
    B: 90 días
    C: 120 días
    D: 180 días
  answer: B
  explanation: El programa de suspensión establece que acumular entre 15 y 17 puntos
    en un período de 2 años resulta en una suspensión de 90 días.
- id: 73
  category: penalties_and_points
  question: ¿Acumular 24 puntos o más en un período de 2 años resultará en una suspensión
    de la licencia de qué duración?
  choices:
    A: 90 días
    B: 120 días
    C: 180 días
    D: 365 días
  answer: D
  explanation: Según el programa del sistema de puntos, acumular 24 puntos o más en
    un período de 2 años resulta en una suspensión de 365 días.
- id: 74
  category: license_system
  question: ¿Las personas nacidas antes de qué fecha están exentas del examen de licencia
    de embarcación, pero aún deben tener emitida la clase de embarcación?
  choices:
    A: 1 de enero de 2002
    B: 28 de abril de 1954
    C: 1 de enero de 1994
    D: 28 de abril de 1984
  answer: B
  explanation: El manual establece que las personas nacidas antes del 28 de abril
    de 1954 están exentas del examen, pero deben acudir a su oficina de licencias
    de conducir para que se les emita la clase de embarcación.
- id: 75
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su historial de conducción por realizar un
    giro inadecuado?
  choices:
    A: 2 Puntos
    B: 3 Puntos
    C: 4 Puntos
    D: 6 Puntos
  answer: A
  explanation: Según el manual, realizar un giro inadecuado resulta en la adición
    de 2 puntos a su historial de conducción.
- id: 76
  category: penalties_and_points
  question: Si un conductor acumula entre 18 y 20 puntos en un período de 2 años,
    ¿por cuánto tiempo se suspenderá su licencia de conducir?
  choices:
    A: 60 días
    B: 90 días
    C: 120 días
    D: 180 días
  answer: C
  explanation: El programa de suspensión establece que acumular entre 18 y 20 puntos
    en un período de 2 años resulta en una suspensión de 120 días.
- id: 77
  category: vehicle_information
  question: ¿Qué debe hacer antes de girar la llave de encendido si conduce un vehículo
    equipado con una transmisión manual?
  choices:
    A: Presionar solo el pedal del freno
    B: Presionar el embrague (clutch)
    C: Cambiar a la marcha de conducción (drive)
    D: Encender las luces de estacionamiento
  answer: B
  explanation: Si conduce un vehículo de cambios manuales equipado con una transmisión
    manual, debe presionar el embrague (clutch) antes de girar la llave de encendido.
- id: 78
  category: safe_driving_rules
  question: Al salir de un lugar de estacionamiento en paralelo, ¿qué debe hacer antes
    de incorporarse al tráfico?
  choices:
    A: Tocar la bocina para advertir a los vehículos que se aproximan
    B: Mirar por encima del hombro y en los espejos retrovisores
    C: Salir rápidamente para incorporarse al flujo del tráfico
    D: Encender las luces de emergencia
  answer: B
  explanation: Al prepararse para salir de un lugar de estacionamiento en paralelo,
    mire por encima de su hombro así como en los espejos retrovisores y espere hasta
    que el camino esté despejado antes de incorporarse al tráfico.
- id: 79
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima con la que debe señalizar sus intenciones
    antes de realizar un giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Debe señalizar sus intenciones al menos 100 pies antes de realizar
    el giro.
- id: 80
  category: safe_driving_rules
  question: ¿Por qué se recomienda utilizar señales con las manos y los brazos además
    de las luces direccionales durante el día?
  choices:
    A: La ley estatal lo exige para todos los giros
    B: Las luces direccionales se desactivan automáticamente durante las horas del
      día
    C: El reflejo de la luz solar intensa puede dificultar que otros automovilistas
      vean las luces direccionales intermitentes
    D: Las señales manuales son la única forma legal de señalizar un giro
  answer: C
  explanation: Durante el día, se pueden utilizar señales con las manos y los brazos
    además de las luces direccionales porque el reflejo de la luz solar intensa puede
    dificultar que otros automovilistas vean su luz direccional intermitente.
- id: 81
  category: safe_driving_rules
  question: ¿Desde qué carril debe girar al realizar un giro a la izquierda desde
    una carretera de cuatro carriles o una autopista dividida?
  choices:
    A: El carril del extremo derecho
    B: El carril más cercano a la línea central o al divisor de tráfico
    C: El arcén de la carretera
    D: Cualquier carril, siempre que haga la señal
  answer: B
  explanation: Para un giro a la izquierda, muévase al carril más cercano a la línea
    central o al divisor de tráfico y gire desde el carril interior.
- id: 82
  category: safe_driving_rules
  question: ¿Dónde NO se permiten los giros en tres puntos?
  choices:
    A: En calles residenciales
    B: En estacionamientos vacíos
    C: En curvas o cerca de la cima de colinas donde no pueda ser visto a menos de
      500 pies
    D: En cualquier calzada de dos carriles
  answer: C
  explanation: Los giros en tres puntos no están permitidos en autopistas interestatales,
    en curvas o cerca de la cima de colinas donde no pueda ser visto por conductores
    de otros vehículos que se aproximen desde cualquier dirección a menos de 500 pies.
- id: 83
  category: safe_driving_rules
  question: ¿Cuál es la técnica adecuada para conducir a través de una curva?
  choices:
    A: Acelerar antes de entrar en la curva y frenar mientras la rodea
    B: Mantener una velocidad alta constante durante toda la curva
    C: Reducir la velocidad antes de entrar en la curva y acelerar ligeramente al
      rodearla realmente
    D: Avanzar por inercia a través de la curva con el vehículo en punto muerto (neutral)
  answer: C
  explanation: Un conductor debe entrar en una curva lo suficientemente despacio como
    para poder acelerar ligeramente al rodear realmente la curva.
- id: 84
  category: sharing_the_road
  question: Según la ley de Alabama, ¿cuál es la distancia mínima que debe mantener
    un vehículo de motor al adelantar a una persona en bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 6 pies
  answer: B
  explanation: La ley estatal de Alabama exige que se adelante a una persona en bicicleta
    con una distancia no inferior a tres pies entre su vehículo de motor y la persona
    en bicicleta.
- id: 85
  category: sharing_the_road
  question: Si bien los ciclistas generalmente deben circular lo más cerca posible
    del bordillo derecho, ¿en qué situación se les permite alejarse de él?
  choices:
    A: Cuando quieran circular junto a otras tres bicicletas
    B: Cuando sea razonablemente necesario para evitar peligros en la carretera como
      escombros o la apertura de puertas de automóviles
    C: Cuando viajen a una velocidad superior al límite de velocidad
    D: Cuando circulen por una acera
  answer: B
  explanation: Los ciclistas deben circular lo más cerca posible del bordillo derecho,
    excepto cuando sea razonablemente necesario para evitar condiciones de la carretera
    o del tráfico, como escombros, apertura de puertas de automóviles, peatones, etc.
- id: 86
  category: sharing_the_road
  question: ¿Qué establece la ley de Alabama con respecto a las bicicletas en las
    aceras?
  choices:
    A: Las bicicletas deben usar la acera si el límite de velocidad es superior a
      35 mph
    B: Se permiten bicicletas en las aceras si ceden el paso a los peatones
    C: Es ilegal que las personas en bicicleta circulen por la acera
    D: Solo las bicicletas con ruedas de entrenamiento pueden usar la acera
  answer: C
  explanation: En Alabama, es ilegal que las personas en bicicleta circulen por la
    acera.
- id: 87
  category: sharing_the_road
  question: ¿A qué edad se requiere que las personas en bicicleta usen un casco protector
    bien ajustado en Alabama?
  choices:
    A: Menores de 12 años
    B: Menores de 16 años
    C: Menores de 18 años
    D: Se requiere que todas las edades usen casco
  answer: B
  explanation: Las personas en bicicleta que son menores de 16 años deben usar un
    casco protector bien ajustado cuando circulen por vías públicas.
- id: 88
  category: sharing_the_road
  question: Si el conductor de un vehículo de motor necesita girar cruzando un carril
    para bicicletas establecido, ¿qué debe hacer?
  choices:
    A: Girar desde el carril de tráfico principal y cruzar el carril para bicicletas
      rápidamente
    B: Tocar la bocina para despejar el carril para bicicletas antes de girar
    C: Entrar en el carril para bicicletas antes de realizar el giro, asegurándose
      de no poner en peligro la seguridad del ciclista
    D: Detenerse en el carril de tráfico principal y esperar a que el carril para
      bicicletas esté completamente vacío durante 500 pies
  answer: C
  explanation: Al girar a través de un carril para bicicletas, el conductor debe dirigir
    el vehículo de motor hacia el carril para bicicletas antes de realizar el giro
    y debe realizar el giro siempre que dicha preparación para el giro no ponga en
    peligro la seguridad de la persona en la bicicleta.
- id: 89
  category: penalties_and_points
  question: ¿Cuántos días se suspenderá su licencia si acumula 24 puntos o más en
    un período de 2 años?
  choices:
    A: 90 días
    B: 120 días
    C: 180 días
    D: 365 días
  answer: D
  explanation: Según el programa de puntos, acumular 24 puntos o más en un período
    de 2 años resulta en una suspensión de 365 días.
- id: 90
  category: sharing_the_road
  question: ¿Qué debe hacer si la carretera es estrecha y no puede adelantar de forma
    segura a una persona en bicicleta?
  choices:
    A: Tocar la bocina con fuerza para advertirles que se aparten
    B: Adelantarlos de cerca a gran velocidad
    C: Permanecer detrás de ellos a una distancia segura hasta que pueda adelantar
      con seguridad
    D: Encender y apagar las luces altas hasta que se salgan de la carretera
  answer: C
  explanation: Si la carretera es estrecha y no puede adelantar de forma segura a
    una persona en bicicleta, no la siga demasiado de cerca y no toque la bocina con
    fuerza. Permanezca detrás a una distancia segura hasta que pueda adelantar.
- id: 91
  category: defensive_driving
  question: ¿Cómo afecta el clima lluvioso a una persona que monta en bicicleta?
  choices:
    A: Aumenta su visibilidad ante otros conductores
    B: Reduce considerablemente su capacidad de frenado
    C: Mejora la tracción de sus neumáticos en la carretera
    D: Les obliga a circular por la acera
  answer: B
  explanation: Durante el clima lluvioso, la capacidad de frenado de una bicicleta
    se reduce considerablemente. Los automovilistas deben estar preparados para compensar
    la disminución de la capacidad del ciclista para reducir la velocidad o detenerse.
- id: 92
  category: sharing_the_road
  question: ¿Qué acción representa un gran porcentaje de los accidentes con lesiones
    entre automóviles y motocicletas?
  choices:
    A: Automóviles que giran a la izquierda frente a un motociclista que se aproxima
    B: Motociclistas que rebasan automóviles por la derecha
    C: Automóviles que chocan por detrás a motocicletas en las señales de alto
    D: Motociclistas que no utilizan sus señales de giro
  answer: A
  explanation: Los giros a la izquierda frente a un motociclista que se aproxima representan
    un gran porcentaje de los accidentes con lesiones entre automóviles y motocicletas,
    ya que los conductores pueden no distinguir al ciclista entre el tráfico o no
    juzgar correctamente su velocidad.
- id: 93
  category: vehicle_information
  question: ¿Por qué debe tener mucha precaución cuando la señal de giro de una motocicleta
    está parpadeando?
  choices:
    A: Las señales de giro de las motocicletas suelen ser más tenues que las de los
      autos
    B: Las señales de giro en la mayoría de las motocicletas no se cancelan automáticamente
    C: Los motociclistas usan las señales de giro para indicar que se están deteniendo
    D: Significa que la motocicleta está sufriendo una falla mecánica
  answer: B
  explanation: Las señales de giro no se cancelan automáticamente en la mayoría de
    las motocicletas. A veces, el conductor puede olvidar apagar la señal, por lo
    que debe asegurarse de que el vehículo realmente esté girando antes de continuar.
- id: 94
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada que debe mantener detrás
    de un motociclista en condiciones normales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 4 segundos
    D: 5 segundos
  answer: B
  explanation: La distancia de seguimiento detrás de un motociclista debe ser la misma
    distancia de 2 segundos que se le da a cualquier otro vehículo.
- id: 95
  category: sharing_the_road
  question: Si un motociclista circula por un extremo de un carril ancho, ¿qué debe
    hacer usted?
  choices:
    A: Entrar en el mismo carril junto a la motocicleta para rebasarla
    B: Tocar la bocina para avisarles que está compartiendo el carril
    C: Nunca entre en el mismo carril junto a la motocicleta
    D: Rebasarlos de cerca por el lado que están evitando
  answer: C
  explanation: Los conductores nunca deben entrar en el mismo carril junto a una motocicleta,
    incluso si el carril es ancho y el motociclista circula por un extremo. No solo
    es ilegal, sino extremadamente peligroso.
- id: 96
  category: defensive_driving
  question: ¿Cómo podría reaccionar un motociclista al cruzar puentes metálicos o
    de rejilla?
  choices:
    A: Acelerará para cruzar rápido
    B: Podría cambiar de dirección rápidamente o reducir la velocidad debido a una
      sensación de tambaleo
    C: Se moverá al carril de tráfico en sentido contrario
    D: Se detendrá por completo antes de cruzar
  answer: B
  explanation: Los puentes metálicos o de rejilla crean una sensación de tambaleo
    en la llanta delantera de la motocicleta. Esto puede causar que un motociclista
    sin experiencia cambie de dirección rápidamente o reduzca la velocidad.
- id: 97
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego lateral del conductor
    de un camión o autobús?
  choices:
    A: Está a menos de 50 pies de la parte trasera del camión
    B: No puede ver la cara del conductor en su espejo retrovisor lateral
    C: Las señales de giro del camión están parpadeando
    D: Está conduciendo por el lado derecho del camión
  answer: B
  explanation: Si no puede ver la cara del conductor en el espejo retrovisor lateral,
    el conductor no puede verlo a usted, lo que significa que se encuentra en su "Zona
    No-Visible" (punto ciego) lateral.
- id: 98
  category: sharing_the_road
  question: ¿Hasta qué distancia puede extenderse el enorme punto ciego directamente
    detrás de un camión o autobús?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: A diferencia de los automóviles, los camiones y autobuses tienen enormes
    zonas no-visibles directamente detrás de ellos que pueden extenderse hasta 200
    pies.
- id: 99
  category: safe_driving_rules
  question: ¿Qué debe hacer cuando sigue a un vehículo grande por la noche?
  choices:
    A: Mantener las luces altas encendidas para aumentar la visibilidad
    B: Bajar siempre la intensidad de sus faros
    C: Hacer destellos con sus faros repetidamente
    D: Apagar sus faros temporalmente
  answer: B
  explanation: Al seguir a un vehículo grande por la noche, baje siempre la intensidad
    de sus faros (use luces bajas). Las luces brillantes cegarán al conductor cuando
    se reflejen en los espejos laterales del autobús o camión.
- id: 100
  category: sharing_the_road
  question: Al rebasar un vehículo grande, ¿cuándo es seguro volver a colocarse delante
    de él?
  choices:
    A: Tan pronto como su parachoques trasero pase la parte delantera del camión
    B: Cuando pueda ver toda la parte delantera del vehículo en su espejo retrovisor
      interior
    C: Cuando el conductor del camión haga destellos con sus faros
    D: Después de haber mantenido su velocidad durante 5 segundos
  answer: B
  explanation: Busque ver toda la parte delantera del vehículo en su espejo retrovisor
    interior antes de colocarse delante y no reduzca la velocidad.
- id: 101
  category: vehicle_information
  question: ¿Según un estudio del Consejo Nacional de Seguridad (National Safety Council),
    cuánta distancia necesita un camión cargado para detenerse de forma segura a 55
    millas por hora?
  choices:
    A: 193 pies
    B: 250 pies
    C: 350 pies
    D: 430 pies
  answer: D
  explanation: Un estudio del Consejo Nacional de Seguridad determinó que a velocidades
    de 55 millas por hora, un automóvil de pasajeros necesita 193 pies para detenerse
    de forma segura y un camión cargado necesita 430 pies.
- id: 102
  category: defensive_driving
  question: ¿Qué podría hacer un motociclista al acercarse a un cruce ferroviario
    a nivel que esté en mal estado?
  choices:
    A: Levantarse del asiento para ayudar a amortiguar el impacto
    B: Acelerar rápidamente para saltar las vías
    C: Inclinar la motocicleta para deslizarse por debajo de la barrera del cruce
    D: Detenerse y cruzar las vías caminando con la motocicleta
  answer: A
  explanation: En los cruces ferroviarios a nivel, el motociclista puede levantarse
    del asiento para ayudar a amortiguar el impacto de un cruce irregular.
- id: 103
  category: sharing_the_road
  question: ¿Cómo pueden los camiones grandes que circulan a alta velocidad afectar
    a los motociclistas en la carretera?
  choices:
    A: Proporcionan una corriente de aire que mejora la eficiencia de combustible
      de la motocicleta
    B: Crean ráfagas de viento que pueden desplazar al motociclista fuera de su trayectoria
    C: Bloquean los vientos cruzados, haciendo que sea más seguro para la motocicleta
    D: Obligan a la motocicleta a detenerse por completo
  answer: B
  explanation: Se sabe que los camiones grandes que circulan rápido crean ráfagas
    de viento que pueden asustar a un motociclista y, bajo ciertas condiciones, desplazarlo
    realmente fuera de su trayectoria.
- id: 104
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a un camión por la derecha cuando su luz
    direccional derecha está parpadeando?
  choices:
    A: El camión acelerará para realizar el giro.
    B: Los camiones se abren hacia la izquierda para girar a la derecha de forma segura,
      y usted podría quedar atrapado.
    C: El conductor del camión está obligado a cederle el paso.
    D: Rebasar por la derecha siempre es ilegal.
  answer: B
  explanation: Los conductores de camiones y autobuses necesitan abrirse hacia la
    izquierda para realizar un giro a la derecha de forma segura. Si intenta rebasar
    por la derecha, el conductor no podrá verlo y usted quedará atrapado.
- id: 105
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas al estacionar cuesta arriba donde
    hay un bordillo (curb)?
  choices:
    A: Hacia el bordillo
    B: En dirección contraria al bordillo
    C: Paralelas al bordillo
    D: Hacia adelante (rectas)
  answer: B
  explanation: Al estacionar cuesta arriba con bordillo, debe girar las ruedas en
    dirección contraria al bordillo y poner la marcha más baja o en PARK (estacionamiento).
- id: 106
  category: safe_driving_rules
  question: ¿Cómo debe colocar las ruedas al estacionar cuesta abajo, con o sin bordillo?
  choices:
    A: Gire las ruedas hacia el bordillo o el borde de la carretera.
    B: Gire las ruedas en dirección contraria al bordillo.
    C: Mantenga las ruedas perfectamente rectas.
    D: Gire las ruedas hacia la izquierda.
  answer: A
  explanation: Al estacionar cuesta abajo, con o sin bordillo, debe girar las ruedas
    hacia el bordillo o el borde de la carretera.
- id: 107
  category: safe_driving_rules
  question: ¿A menos de cuántos pies de un hidrante de incendios NO está permitido
    estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: B
  explanation: No se permite estacionar a menos de 15 pies de un hidrante de incendios.
- id: 108
  category: safe_driving_rules
  question: ¿A menos de cuántos pies del riel más cercano de un cruce ferroviario
    está prohibido estacionar?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: D
  explanation: No se permite estacionar a menos de 50 pies del riel más cercano de
    un cruce ferroviario.
- id: 109
  category: safe_driving_rules
  question: ¿Hasta qué edad exige la ley de retención infantil de Alabama que los
    niños deben estar sujetos al viajar en vehículos de motor?
  choices:
    A: 5 años
    B: 10 años
    C: 12 años
    D: 15 años
  answer: D
  explanation: La ley de retención infantil de Alabama exige que los niños hasta los
    15 años deben estar sujetos al viajar en vehículos de motor en Alabama.
- id: 110
  category: penalties_and_points
  question: ¿Cuál es la multa por violar la ley de retención infantil de Alabama,
    además de los puntos que se asignan al historial del conductor?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: A quienes violen la ley de retención infantil se les asignarán puntos
    en su historial de conductor, además de incurrir en una multa de $25.
- id: 111
  category: safe_driving_rules
  question: ¿Hasta qué edad o peso debe colocarse a un bebé en un asiento exclusivo
    para bebés orientado hacia atrás o en un asiento convertible?
  choices:
    A: Al menos 6 meses o 15 libras
    B: Al menos 1 año de edad o 20 libras
    C: Al menos 2 años de edad o 30 libras
    D: Al menos 3 años de edad o 40 libras
  answer: B
  explanation: La ley exige el uso de un asiento exclusivo para bebés o un asiento
    convertible en la posición orientada hacia atrás hasta que el bebé tenga al menos
    1 año de edad o pese 20 libras.
- id: 112
  category: driver_responsibility
  question: 'Según los registros de accidentes, más del 90 por ciento de los choques
    en carretera son causados por:'
  choices:
    A: Fallas mecánicas
    B: Malas condiciones climáticas
    C: Error del conductor y actitud inadecuada
    D: Carreteras con mantenimiento deficiente
  answer: C
  explanation: Los registros de accidentes muestran que más del 90 por ciento de los
    choques en carretera son causados por errores del conductor, falta de conocimiento,
    distracción, condición física o mental, actitud inadecuada o juicio erróneo.
- id: 113
  category: defensive_driving
  question: ¿Qué es la "hipnosis de carretera" (highway hypnosis)?
  choices:
    A: Una condición de somnolencia o falta de conciencia provocada por la monotonía.
    B: Una deficiencia visual causada por las luces delanteras de los vehículos que
      vienen en sentido contrario.
    C: Un estado de pánico causado por el tráfico intenso.
    D: Una falla mecánica del sistema de dirección del vehículo.
  answer: A
  explanation: Los conductores en autopistas están sujetos a la "hipnosis de carretera",
    una condición de somnolencia o falta de conciencia provocada por la monotonía;
    el sonido del viento, los neumáticos sobre el pavimento y el zumbido constante
    del motor.
- id: 114
  category: defensive_driving
  question: Para evitar la fatiga en viajes largos, ¿con qué frecuencia es recomendable
    realizar paradas de descanso regulares?
  choices:
    A: Cada 50 millas o 1 hora
    B: Cada 100 millas o cada dos horas
    C: Cada 200 millas o cada cuatro horas
    D: Solo cuando se esté quedando sin combustible
  answer: B
  explanation: 'Se recomienda realizar paradas de descanso regulares: cada 100 millas
    o cada dos horas. Salga del automóvil y camine un poco; estire las piernas y relájese.'
- id: 115
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera infracción por enviar mensajes de texto
    mientras se conduce en Alabama?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: A
  explanation: La multa por violar la ley de mensajes de texto mientras se conduce
    es de $25 por la primera infracción, $50 por la segunda y $75 por la tercera o
    infracciones posteriores.
- id: 116
  category: safe_driving_rules
  question: ¿A qué distancia debe estacionarse de un paso de peatones en una intersección
    no controlada?
  choices:
    A: Al menos 10 pies
    B: Al menos 15 pies
    C: Al menos 20 pies
    D: Al menos 30 pies
  answer: C
  explanation: NO se permite estacionar a menos de 20 pies de un paso de peatones
    en una intersección no controlada.
- id: 117
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una precaución recomendada si debe usar un
    teléfono celular mientras conduce?
  choices:
    A: Entablar conversaciones intensas o complicadas para mantenerse despierto.
    B: Realizar llamadas mientras se desplaza en tráfico congestionado.
    C: Usar un altavoz o un dispositivo de manos libres.
    D: Sostener el teléfono firmemente con la mano izquierda mientras maniobra con
      la derecha.
  answer: C
  explanation: 'Si utiliza un teléfono celular, tome precauciones como: usar el altavoz
    o un dispositivo de manos libres, evitar conversaciones intensas y evitar hablar
    en tráfico congestionado.'
- id: 118
  category: penalties_and_points
  question: ¿Cuántos puntos se colocan en el registro de un conductor por cada infracción
    de enviar mensajes de texto mientras conduce?
  choices:
    A: Un punto
    B: Dos puntos
    C: Tres puntos
    D: Cuatro puntos
  answer: B
  explanation: Por cada infracción de enviar mensajes de texto mientras se conduce,
    se registrará una infracción de dos puntos en el historial de manejo del infractor.
- id: 119
  category: defensive_driving
  question: ¿Cuál de las siguientes es una forma recomendada de combatir la "hipnosis
    de carretera"?
  choices:
    A: Mirar fijamente la línea central de la carretera
    B: Confiar en "medicamentos para mantenerse despierto" para mantener la concentración
    C: Cambiar constantemente la mirada de una zona de la calzada a otra
    D: Encender la luz interior del techo de su vehículo
  answer: C
  explanation: Para combatir la hipnosis de carretera, debe cambiar constantemente
    la mirada de una zona de la calzada a otra y enfocarla en varios objetos cercanos
    y lejanos.
- id: 120
  category: alcohol_drugs_health
  question: 'La cantidad de alcohol en un "trago de whisky" promedio o en una copa
    de vino es aproximadamente igual a la cantidad de alcohol en:'
  choices:
    A: Media botella de cerveza
    B: Una botella de cerveza
    C: Dos botellas de cerveza
    D: Tres botellas de cerveza
  answer: B
  explanation: El manual establece que la cantidad de alcohol en una botella de cerveza
    es aproximadamente igual a la de un trago de whisky promedio o una copa de vino.
- id: 121
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones sobre el alcohol es verdadera?
  choices:
    A: El alcohol es un estimulante.
    B: El alcohol mejora la coordinación y los reflejos.
    C: El alcohol es un depresor.
    D: El deterioro solo ocurre después de alcanzar la intoxicación legal.
  answer: C
  explanation: El alcohol es un depresor, no un estimulante. Causa somnolencia, visión
    borrosa y lentitud en los reflejos, y el deterioro puede ocurrir antes de alcanzar
    la intoxicación legal.
- id: 122
  category: alcohol_drugs_health
  question: 'Según la ley de Alabama, es ilegal que una persona menor de 21 años opere
    un vehículo con un contenido de alcohol en sangre (BAC) de:'
  choices:
    A: .02% o más
    B: .04% o más
    C: .05% o más
    D: .08% o más
  answer: A
  explanation: Es ilegal que las personas menores de 21 años operen un vehículo si
    su contenido de alcohol en sangre (BAC) es de .02% o más.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es el límite legal de contenido de alcohol en sangre (BAC) para
    los operadores de vehículos comerciales en Alabama?
  choices:
    A: .02%
    B: .04%
    C: .06%
    D: .08%
  answer: B
  explanation: Es ilegal que los operadores de vehículos comerciales conduzcan con
    un contenido de alcohol en sangre (BAC) de .04% o más.
- id: 124
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión de la licencia de conducir por una primera
    condena por DUI en Alabama?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Por una primera condena por DUI, además de multas y posible tiempo
    en la cárcel, la licencia de conducir será suspendida por 90 días.
- id: 125
  category: penalties_and_points
  question: Bajo la Ley de Consentimiento Implícito (Implied Consent Law), ¿qué sucede
    si un conductor arrestado por DUI se niega a someterse a una prueba química de
    aliento?
  choices:
    A: Se le emitirá una advertencia.
    B: Su licencia de conducir será suspendida.
    C: Recibirá 48 horas obligatorias de cárcel.
    D: Se le multará con $600 de inmediato.
  answer: B
  explanation: Un conductor bajo arresto por DUI que se niegue a someterse a pruebas
    químicas de aliento cuando lo indique un oficial, se le suspenderá su licencia
    de conducir.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de recuperar la sobriedad
    después de beber alcohol?
  choices:
    A: Beber café negro
    B: Tomar una ducha fría
    C: Comer una comida pesada
    D: Dar tiempo para que el hígado descomponga el alcohol
  answer: D
  explanation: El café negro, la comida o una ducha fría pueden despertarlo, pero
    no le devolverán la sobriedad. Una vez que el alcohol está en el torrente sanguíneo,
    el hígado debe descomponerlo, y este proceso lleva tiempo.
- id: 127
  category: alcohol_drugs_health
  question: ¿Qué sucede cuando se mezcla alcohol con drogas?
  choices:
    A: El alcohol anula los efectos secundarios de las drogas.
    B: Simplemente duplica el efecto de la droga.
    C: Multiplica los efectos y puede causar daños graves o la muerte.
    D: No tiene un efecto significativo en la mente o el cuerpo.
  answer: C
  explanation: El uso de alcohol y drogas en conjunto produce efectos graves. No solo
    duplica el efecto; lo multiplica y, cuando se excede, ha causado la muerte.
- id: 128
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la causa de la mayoría de las colisiones por
    alcance (choques traseros)?
  choices:
    A: Exceso de velocidad en las intersecciones
    B: Seguir demasiado de cerca
    C: Conducir bajo la influencia del alcohol
    D: No usar las señales de giro
  answer: B
  explanation: La mayoría de las colisiones por alcance son causadas por seguir demasiado
    de cerca. Los conductores deben permitir suficiente distancia de seguimiento para
    detenerse si es necesario.
- id: 129
  category: penalties_and_points
  question: 'Una cuarta o subsiguiente condena por DUI en Alabama se clasifica como:'
  choices:
    A: Delito menor de Clase A
    B: Delito menor de Clase B
    C: Delito grave (felonía) de Clase C
    D: Infracción de tráfico
  answer: C
  explanation: Una cuarta condena o condena subsiguiente por DUI es un delito grave
    de Clase C, que conlleva multas elevadas, una revocación de la licencia por cinco
    años y posible encarcelamiento.
- id: 130
  category: safe_driving_rules
  question: ¿Cuál es el método recomendado para determinar una distancia de seguimiento
    segura en buenas condiciones climáticas?
  choices:
    A: La regla de la longitud de un vehículo
    B: La regla de los dos segundos
    C: La regla de los cuatro segundos
    D: La regla de los 15 pies
  answer: B
  explanation: El manual presenta la 'regla de los dos segundos' como una fórmula
    positiva y fácil de aplicar para mantener una distancia de seguimiento más segura.
- id: 131
  category: defensive_driving
  question: 'Si las condiciones de la carretera y el clima no son buenas, debe aumentar
    su distancia de seguimiento a:'
  choices:
    A: Un conteo de tres segundos
    B: Un conteo de cuatro o cinco segundos
    C: Un conteo de seis segundos
    D: La longitud de diez vehículos
  answer: B
  explanation: El manual establece que si las condiciones de la carretera y el clima
    no son buenas, debe aumentar su distancia de seguimiento a un conteo de cuatro
    o cinco segundos.
- id: 132
  category: vehicle_information
  question: ¿Cuál de los siguientes es un factor que determina la distancia real de
    frenado de su vehículo?
  choices:
    A: El color de su vehículo
    B: La hora del día
    C: El tiempo de reacción mental y física del conductor
    D: El número de pasajeros en el vehículo
  answer: C
  explanation: Las distancias reales de frenado dependen de muchos factores, incluido
    el tiempo de reacción mental y física del conductor.
- id: 133
  category: defensive_driving
  question: ¿Cómo puede afectar el viento la distancia de frenado de su vehículo?
  choices:
    A: Un fuerte viento de cola puede dificultar el frenado repentino a altas velocidades.
    B: Un fuerte viento de frente aumenta su distancia de frenado.
    C: Los vientos cruzados hacen que los frenos se bloqueen.
    D: La dirección del viento no tiene efecto en la distancia de frenado.
  answer: A
  explanation: Según el manual, es posible que los conductores no se den cuenta de
    la diferencia que puede suponer un fuerte viento de cola al intentar frenar repentinamente
    a alta velocidad.
- id: 134
  category: driver_responsibility
  question: Si se ve involucrado en un choque de tráfico, ¿cuándo debe mover a una
    persona lesionada?
  choices:
    A: Inmediatamente, para sacarlos de la calzada.
    B: Solo si es absolutamente necesario para retirarlos de un incendio u otros peligros.
    C: Cuando le pidan ayuda para ponerse de pie.
    D: Siempre debe moverlos al acotamiento de la carretera.
  answer: B
  explanation: Debe evitar mover a los heridos a menos que sea absolutamente necesario
    para retirarlos de áreas amenazadas por incendios u otros peligros comunes en
    la escena de un choque.
- id: 135
  category: driver_responsibility
  question: ¿Qué información está obligado a dar a otras personas involucradas en
    un choque con usted?
  choices:
    A: Su nombre, dirección, número de registro y mostrar su licencia de conducir.
    B: Su nombre, número de teléfono y número de seguro social.
    C: Solo la información de su seguro.
    D: Su número de licencia de conducir y el número de identificación del vehículo
      (VIN).
  answer: A
  explanation: Debe dar su nombre, dirección y número de registro, y mostrar su licencia
    de conducir a las demás personas involucradas en cualquier tipo de accidente.
- id: 136
  category: driver_responsibility
  question: ¿Bajo qué circunstancias se debe enviar un Formulario SR-31 por escrito
    dentro de los 30 días posteriores a un choque?
  choices:
    A: Después de cada choque, independientemente de los daños o el seguro.
    B: Si hay una lesión, muerte o daños de $500 o más, y la parte 'culpable' no tenía
      seguro.
    C: Solo si el choque ocurrió en una carretera estatal.
    D: Si ambas partes tenían seguro en el momento del accidente.
  answer: B
  explanation: Se debe enviar un Formulario SR-31 por escrito dentro de los 30 días
    si hay una lesión, muerte o daños de $500 o más, y la parte 'culpable' no tenía
    seguro en el momento del percance.
- id: 137
  category: driver_responsibility
  question: ¿Qué debe hacer si su vehículo choca contra un vehículo estacionado sin
    vigilancia?
  choices:
    A: Alejarse si no hay daños visibles.
    B: Esperar en su automóvil hasta que regrese el dueño.
    C: Notificar a la policía, intentar localizar al propietario o dejar un aviso
      por escrito con su nombre y dirección.
    D: Dejar su tarjeta de seguro bajo el limpiaparabrisas y alejarse.
  answer: C
  explanation: Si su vehículo choca contra un vehículo sin vigilancia, debe notificar
    a la policía, intentar localizar al propietario o dejar un aviso por escrito en
    un lugar visible con su nombre y dirección.
- id: 138
  category: signs_and_signals
  question: ¿Qué indica una señal redonda y amarilla con una X negra y las letras
    RR?
  choices:
    A: Un cruce de ferrocarril está exactamente a 100 pies adelante.
    B: Hay un cruce de ferrocarril más adelante y la señal se coloca 750 pies antes
      de la vía.
    C: Debe detenerse por completo de inmediato.
    D: El cruce de ferrocarril más adelante no tiene barreras ni luces intermitentes.
  answer: B
  explanation: La señal redonda de advertencia de ferrocarril es amarilla con una
    X negra y las letras RR. Significa que hay un cruce de ferrocarril más adelante
    y se coloca 750 pies antes de la vía.
- id: 139
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado a detenerse antes de atravesar
    CUALQUIER cruce de ferrocarril?
  choices:
    A: Automóviles de pasajeros
    B: Motocicletas
    C: Autobuses escolares
    D: Camionetas que remolcan un bote
  answer: C
  explanation: Los autobuses escolares, autobuses de iglesias, autobuses de pasajeros
    y camiones que transportan materiales inflamables, explosivos u otros materiales
    peligrosos están obligados a detenerse antes de atravesar cualquier cruce de ferrocarril.
- id: 140
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril donde se requiere que se detenga,
    ¿cuál es la distancia de frenado adecuada desde las vías?
  choices:
    A: De 5 a 10 pies
    B: De 15 a 50 pies
    C: De 50 a 100 pies
    D: Al menos 100 pies
  answer: B
  explanation: Al acercarse a un cruce de ferrocarril, debe detenerse entre 15 y 50
    pies.
- id: 141
  category: safe_driving_rules
  question: 'Para evitar que el motor se apague (stalling) al cruzar vías de ferrocarril,
    un conductor con transmisión manual debe:'
  choices:
    A: Cambiar a una marcha más alta mientras cruza.
    B: Poner el vehículo en punto muerto e ir por inercia al cruzar.
    C: No cambiar de marcha mientras cruza la vía.
    D: Acelerar rápidamente y cambiar de marcha a mitad del camino.
  answer: C
  explanation: Para evitar que el motor se apague, el conductor no debe cambiar de
    marcha mientras cruza la vía. Si su vehículo tiene transmisión manual, reduzca
    la marcha antes de llegar y no cambie de marcha mientras cruza.
- id: 142
  category: signs_and_signals
  question: 'Si se aproxima a un cruce de ferrocarril y las barreras están bajadas,
    usted debe:'
  choices:
    A: Rodear las barreras si no ve venir un tren.
    B: Detenerse y permanecer detenido hasta que se levanten las barreras y las luces
      dejen de parpadear.
    C: Detenerse, mirar a ambos lados y avanzar lentamente rodeando las barreras.
    D: Tocar la bocina para alertar al maquinista del tren antes de cruzar.
  answer: B
  explanation: Cuando las barreras se están bajando, las luces rojas intermitentes
    le advertirán que se detenga. Permanezca detenido hasta que se levanten las barreras
    y las luces dejen de parpadear. Es ilegal rodear las barreras.
- id: 143
  category: vehicle_information
  question: ¿Cómo afectan los neumáticos grandes y anchos la capacidad de frenado
    de un vehículo según el manual?
  choices:
    A: Siempre aumentan la distancia de frenado independientemente de la superficie.
    B: Ayudan a detenerse más rápido en superficies lisas y secas, pero derrapan o
      patinan (hydroplane) más fácilmente en superficies mojadas.
    C: Cortan el agua estancada mejor que los neumáticos estrechos.
    D: Pierden potencia de frenado en general debido a que hay menos caucho en la
      carretera.
  answer: B
  explanation: Los neumáticos grandes y anchos pueden ayudar a detenerse más rápido
    en superficies lisas y secas, pero derraparán o patinarán (hydroplane) más fácilmente
    en superficies resbaladizas o mojadas.
- id: 144
  category: driver_responsibility
  question: Si ocurre un accidente con heridos o víctimas mortales dentro de un municipio,
    ¿a quién se debe notificar por el medio de comunicación más rápido?
  choices:
    A: A los patrulleros estatales (State Troopers)
    B: A la policía local
    C: Al Departamento de Transporte
    D: Al hospital local
  answer: B
  explanation: Cualquier accidente con heridos o víctimas mortales debe reportarse
    a la policía local si ocurre dentro de un municipio, o a los patrulleros estatales
    (State Troopers) si ocurre en una carretera estatal.
- id: 145
  category: safe_driving_rules
  question: ¿Qué debe hacer si conduce un vehículo con transmisión manual y necesita
    cruzar vías de ferrocarril?
  choices:
    A: Cambiar a una marcha más alta para cruzar las vías rápidamente.
    B: Reducir la marcha y no cambiar de marcha mientras cruza las vías.
    C: Poner el vehículo en punto muerto e ir por inercia a través de las vías.
    D: Poner la marcha atrás si ve que se acerca un tren.
  answer: B
  explanation: Según el manual, si su vehículo tiene transmisión manual, debe reducir
    la marcha y no cambiar de marcha mientras cruza las vías.
- id: 146
  category: defensive_driving
  question: Aproximadamente, ¿cuánto tarda un tren de carga que viaja a 55 mph en
    detenerse por completo?
  choices:
    A: Aproximadamente media milla
    B: Menos de 500 pies
    C: Una milla o más
    D: Dos millas
  answer: C
  explanation: El manual establece que un tren de carga que viaja a 55 mph tarda una
    milla o más en detenerse, lo cual equivale a la longitud de 18 campos de fútbol
    americano.
- id: 147
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer si su vehículo se apaga (stalls) en
    un cruce de ferrocarril?
  choices:
    A: Intentar reiniciar el motor mientras vigila si viene un tren.
    B: Hacer que todos salgan del vehículo inmediatamente y se alejen de las vías.
    C: Permanecer en el vehículo y llamar a una grúa para pedir ayuda.
    D: Poner punto muerto e intentar empujar el vehículo fuera de las vías.
  answer: B
  explanation: Si su vehículo se apaga en un cruce, el manual indica que debe hacer
    que todos salgan del vehículo inmediatamente y se alejen de las vías, y luego
    llamar a las autoridades locales.
- id: 148
  category: signs_and_signals
  question: ¿Cuáles son los tres tipos de señales de tráfico clasificadas según su
    función?
  choices:
    A: Reglamentarias, de advertencia y de información o guía
    B: De pare, ceda el paso y límite de velocidad
    C: De construcción, zona escolar y ferrocarril
    D: De carreteras interestatales, estatales y locales
  answer: A
  explanation: Los tres tipos de señales de tráfico se clasifican según su función.
    Son señales reglamentarias, de advertencia y de información o guía.
- id: 149
  category: safe_driving_rules
  question: Cuando más de un vehículo llega al mismo tiempo a una parada de 4 vías
    (4-way stop), ¿qué vehículo tiene permitido salir primero?
  choices:
    A: El vehículo que esté más a la izquierda
    B: El vehículo que esté más a la derecha
    C: El vehículo más grande
    D: El vehículo que viaje más rápido
  answer: B
  explanation: Cuando más de un vehículo llega al mismo tiempo a una parada de 4 vías,
    el vehículo que esté más a la derecha tiene permitido salir primero.
- id: 150
  category: signs_and_signals
  question: ¿De qué colores son las señales de advertencia que se utilizan en las
    zonas de construcción?
  choices:
    A: Negro y amarillo
    B: Amarillo fluorescente
    C: Negro y naranja
    D: Blanco y rojo
  answer: C
  explanation: Las señales de advertencia son generalmente negras y amarillas, excepto
    las que se utilizan en zonas de construcción, que son negras y naranjas.
- id: 151
  category: signs_and_signals
  question: ¿Qué indica una señal de advertencia de color amarillo fluorescente?
  choices:
    A: Zonas de construcción y desvíos
    B: Cruces de peatones y zonas escolares
    C: Cruces de ferrocarril y gálibos bajos (espacios de baja altura)
    D: Salidas de autopista y áreas de descanso
  answer: B
  explanation: Según el manual, el amarillo fluorescente indica cruces de peatones
    y zonas escolares.
- id: 152
  category: signs_and_signals
  question: ¿Dónde se publican habitualmente los límites de velocidad "mínimos"?
  choices:
    A: En zonas escolares y áreas residenciales
    B: En autopistas y otras carreteras de acceso controlado
    C: Cerca de cruces de ferrocarril
    D: En zonas de construcción
  answer: B
  explanation: El manual señala que los límites "mínimos" suelen publicarse en autopistas
    y otras carreteras de acceso controlado.
- id: 153
  category: signs_and_signals
  question: ¿Dónde se coloca normalmente una señal de advertencia de "ZONA DE NO ADELANTAR"
    (NO PASSING ZONE)?
  choices:
    A: En el lado derecho de una carretera de cuatro carriles
    B: En el lado izquierdo de una carretera de dos carriles
    C: Sobre el centro de una intersección
    D: En el lado derecho de una calle de sentido único
  answer: B
  explanation: La señal de "ZONA DE NO ADELANTAR" se coloca en el lado izquierdo de
    una carretera de dos carriles para advertir del inicio de una zona donde no se
    permite adelantar.
- id: 154
  category: sharing_the_road
  question: ¿Cuál es el espacio libre mínimo requerido al adelantar a un ciclista?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: El manual especifica que se requiere un espacio libre mínimo de 3 pies
    al adelantar a un ciclista.
- id: 155
  category: sharing_the_road
  question: ¿De qué informa a los usuarios de la vía una marca de carril compartido
    (Sharrow)?
  choices:
    A: Que las bicicletas están prohibidas en esta carretera
    B: Que las personas en bicicleta podrían ocupar el carril de circulación
    C: Que un carril para bicicletas designado está terminando
    D: Que los peatones tienen el derecho de paso
  answer: B
  explanation: Las marcas de carril compartido (Sharrow) informan a los usuarios de
    la vía que las personas en bicicleta podrían ocupar el carril de circulación.
- id: 156
  category: defensive_driving
  question: Según el manual, ¿cuántas veces más probable es que un automovilista muera
    en un choque que involucre a un tren en comparación con otros choques?
  choices:
    A: 10 veces
    B: 20 veces
    C: 40 veces
    D: 100 veces
  answer: C
  explanation: Un automovilista tiene 40 veces más probabilidades de morir en un choque
    que involucre a un tren.
- id: 157
  category: driver_responsibility
  question: Además de ser conducido por o bajo la dirección de una persona con discapacidad
    física, ¿qué debe mostrar visiblemente un vehículo para estacionarse legalmente
    en un espacio de estacionamiento para personas con discapacidad?
  choices:
    A: Un marco de matrícula especial
    B: Una calcomanía o distintivo de discapacidad
    C: Una nota del médico en el tablero
    D: Una señal de luces de emergencia
  answer: B
  explanation: No debe estacionarse en un espacio para personas con discapacidad a
    menos que el vehículo sea conducido por o bajo la dirección de una persona con
    discapacidad física Y el vehículo muestre visiblemente la calcomanía de discapacidad.
- id: 158
  category: safe_driving_rules
  question: ¿Bajo qué condición se permiten los giros dobles a la derecha en una intersección?
  choices:
    A: Siempre que haya dos carriles de giro a la derecha
    B: Solo en las intersecciones que estén debidamente señalizadas
    C: Solo durante las horas del día
    D: Siempre que el tráfico sea ligero
  answer: B
  explanation: Los giros dobles a la derecha solo están permitidos en las intersecciones
    que estén debidamente señalizadas. En las intersecciones que no estén señalizadas,
    siga las reglas para giros a la derecha.
- id: 159
  category: signs_and_signals
  question: ¿Qué significa una señal de "CEDA EL PASO" (YIELD)?
  choices:
    A: Detenerse por completo antes de entrar en la intersección
    B: Mantener su velocidad e incorporarse al tráfico
    C: Reducir la velocidad para poder ceder el derecho de paso a peatones y vehículos
    D: Acelerar para igualar la velocidad del tráfico que cruza
  answer: C
  explanation: La señal de CEDA EL PASO significa reducir la velocidad para poder
    ceder el derecho de paso a los peatones que cruzan la calzada y a los vehículos
    en la calle o carretera que se cruza.
- id: 160
  category: safe_driving_rules
  question: ¿En qué dirección fluye el tráfico en una rotonda?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En ambas direcciones
    D: Directo a través de la isla central
  answer: B
  explanation: Una rotonda es una intersección circular que normalmente no incluye
    un semáforo y fluye en sentido contrario a las agujas del reloj alrededor de una
    isla central.
- id: 161
  category: safe_driving_rules
  question: ¿A quién debe ceder el paso al entrar en una rotonda?
  choices:
    A: Al tráfico que entra por la izquierda
    B: Al tráfico que ya se encuentra en la rotonda
    C: Al tráfico que entra por la derecha
    D: Solo a los peatones
  answer: B
  explanation: Los automovilistas deben entrar por la derecha, cediendo el paso al
    tráfico que ya está en la rotonda, y seguir el círculo hacia la derecha.
- id: 162
  category: signs_and_signals
  question: ¿De qué color son las señales de guía o informativas que dirigen a los
    automovilistas hacia servicios como hospitales o gasolineras?
  choices:
    A: Verde y blanco
    B: Marrón y blanco
    C: Azul y blanco
    D: Negro y blanco
  answer: C
  explanation: Las señales de guía o informativas para servicios son de color azul
    y blanco.
- id: 163
  category: signs_and_signals
  question: ¿Dónde comienza el millaje cero para los postes de millaje (mileposts)
    erigidos a lo largo de las carreteras estatales?
  choices:
    A: En los límites estatales del norte y el este
    B: En los límites estatales del sur y el oeste o en los empalmes donde comienzan
      las rutas
    C: En la ciudad capital del estado
    D: En el centro geográfico del estado
  answer: B
  explanation: El millaje cero debe comenzar en los límites estatales del sur y el
    oeste o en los empalmes donde comienzan las rutas.
- id: 164
  category: signs_and_signals
  question: ¿De qué color se pintan las líneas centrales en las carreteras de dos
    carriles para separar el tráfico que se mueve en direcciones opuestas?
  choices:
    A: Blanco
    B: Amarillo
    C: Rojo
    D: Azul
  answer: B
  explanation: Bajo el Código Uniforme, las líneas centrales deben pintarse de amarillo
    en las carreteras de dos carriles.
- id: 165
  category: signs_and_signals
  question: ¿Qué indica una línea blanca sólida doble?
  choices:
    A: El tráfico circula en direcciones opuestas y se permite rebasar.
    B: El tráfico circula en la misma dirección y está prohibido cruzar las líneas.
    C: El tráfico circula en la misma dirección y se permite cruzar con precaución.
    D: El carril está reservado para vehículos de alta ocupación.
  answer: B
  explanation: Se utiliza una línea blanca sólida doble para delimitar un carril de
    viaje donde el tráfico va en la misma dirección y se permite en ambos lados de
    la línea, pero está prohibido cruzar las líneas dobles.
- id: 166
  category: signs_and_signals
  question: ¿Cuándo se utilizan líneas amarillas como franjas de borde?
  choices:
    A: Para las líneas de borde derechas en carreteras de dos carriles
    B: Para las líneas de borde izquierdas en carreteras divididas donde el tráfico
      no puede salirse completamente de la calzada
    C: Para marcar cruces peatonales
    D: Para indicar una zona escolar más adelante
  answer: B
  explanation: Ocasionalmente se utilizan líneas amarillas para las líneas de borde
    izquierdas en carreteras divididas donde el tráfico no puede salirse completamente
    de la calzada, y para marcar obstrucciones e islas.
- id: 167
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico circular amarilla fija?
  choices:
    A: Acelerar para pasar antes de la luz roja
    B: Detenerse inmediatamente en la intersección
    C: Despejar la intersección
    D: Avanzar con precaución sin detenerse
  answer: C
  explanation: Una luz amarilla circular fija significa despejar la intersección.
    Sigue a una señal verde. No debe entrar en la intersección cuando se encienda
    la señal roja.
- id: 168
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a un cruce de ferrocarril con señales de
    luces rojas intermitentes?
  choices:
    A: Reducir la velocidad y avanzar si no se ve ningún tren
    B: Detenerse porque hay un tren cerca y no avanzar hasta que sea seguro
    C: Acelerar para cruzar las vías rápidamente
    D: Ceder el paso a los vehículos que vienen detrás
  answer: B
  explanation: Deténgase siempre cuando las luces comiencen a parpadear porque hay
    un tren cerca. No avance hasta que pueda hacerlo de manera segura.
- id: 169
  category: signs_and_signals
  question: ¿Qué indica una flecha verde fija?
  choices:
    A: Puede avanzar en la dirección de la flecha mientras que el tráfico opuesto
      debe detenerse.
    B: Debe ceder el paso al tráfico opuesto antes de girar.
    C: El movimiento de giro protegido está terminando.
    D: Solo puede seguir recto a través de la intersección.
  answer: A
  explanation: Las FLECHAS VERDES le permiten avanzar en la dirección de la flecha
    mientras que el tráfico opuesto debe detenerse.
- id: 170
  category: signs_and_signals
  question: ¿Qué significa una señal de control de uso de carril con una "X ROJA FIJA"?
  choices:
    A: Puede conducir por el carril con precaución.
    B: Debe detenerse y esperar una flecha verde.
    C: No debe conducir en el carril sobre el cual se encuentra la señal.
    D: El carril está reservado solo para giros a la izquierda.
  answer: C
  explanation: Un conductor que se enfrente a una indicación de "X ROJA FIJA" no deberá
    conducir en el carril sobre el cual se encuentra ubicada la señal.
- id: 171
  category: driver_responsibility
  question: ¿Según el manual, a quiénes se aplican las leyes de tránsito?
  choices:
    A: Solo a los conductores de vehículos motorizados
    B: A los conductores de vehículos y operadores de motocicletas, pero no a los
      ciclistas
    C: A los conductores de vehículos, operadores de motocicletas y bicicletas, y
      peatones
    D: Solo a los vehículos que transitan por autopistas interestatales
  answer: C
  explanation: 'Las leyes de tránsito se aplican a todos los que utilizan las calles
    y caminos: conductores de vehículos, operadores de motocicletas y bicicletas,
    y peatones.'
- id: 172
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad legal en un camino no pavimentado en Alabama,
    a menos que se indique lo contrario?
  choices:
    A: 25 millas por hora
    B: 30 millas por hora
    C: 35 millas por hora
    D: 45 millas por hora
  answer: C
  explanation: Según el manual, el límite de velocidad legal es de 35 millas por hora
    en un camino no pavimentado.
- id: 173
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad legal en un distrito urbano?
  choices:
    A: 20 millas por hora
    B: 25 millas por hora
    C: 30 millas por hora
    D: 35 millas por hora
  answer: C
  explanation: El manual establece que el límite de velocidad legal es de 30 millas
    por hora en un distrito urbano.
- id: 174
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe mejor la ley de velocidad básica
    de Alabama?
  choices:
    A: Siempre debe conducir exactamente al límite de velocidad indicado.
    B: Nunca debe conducir un vehículo a una velocidad superior a la razonable bajo
      las condiciones existentes.
    C: Debe conducir 5 mph por debajo del límite de velocidad durante condiciones
      climáticas adversas.
    D: Puede exceder el límite de velocidad por 10 mph si está rebasando a otro vehículo.
  answer: B
  explanation: La ley de velocidad básica de Alabama establece que nunca debe conducir
    un vehículo a una velocidad superior a la razonable bajo las condiciones existentes,
    considerando el estado de la carretera, el clima y las condiciones del vehículo.
- id: 175
  category: signs_and_signals
  question: ¿Dónde debe detener su vehículo ante una señal de PARE (STOP) si no hay
    una línea de parada marcada?
  choices:
    A: Antes de entrar al paso de peatones en el lado cercano de la intersección.
    B: Directamente al lado de la señal de PARE (STOP).
    C: Diez pies antes de la intersección.
    D: En medio de la intersección para tener una vista despejada.
  answer: A
  explanation: Si no hay una línea de parada marcada, el vehículo debe detenerse antes
    de entrar al paso de peatones en el lado cercano de la intersección.
- id: 176
  category: safe_driving_rules
  question: ¿Bajo qué condición puede realizar un giro a la izquierda después de detenerse
    ante un semáforo en rojo?
  choices:
    A: Nunca puede realizar un giro a la izquierda con luz roja.
    B: Si está girando desde una calle de doble sentido hacia una calle de un solo
      sentido.
    C: Si está conduciendo en una calle de un solo sentido y gira hacia otra calle
      de un solo sentido con el tráfico moviéndose de derecha a izquierda.
    D: Si no hay tráfico en sentido contrario por al menos 500 pies.
  answer: C
  explanation: Puede realizar un giro a la izquierda después de detenerse si está
    conduciendo en una calle de un solo sentido y la calle a la que gira a la izquierda
    es de un solo sentido con el tráfico moviéndose de derecha a izquierda.
- id: 177
  category: signs_and_signals
  question: ¿Cómo debe tratar una intersección si el semáforo no funciona?
  choices:
    A: Trate la intersección como una señal de ceda el paso.
    B: Trate la intersección como lo haría con una parada de cuatro vías (four-way
      stop).
    C: Atraviese la intersección sin detenerse si el camino está despejado.
    D: Espere en la intersección hasta que llegue la policía.
  answer: B
  explanation: El manual establece que si el semáforo no funciona, debe tratar la
    intersección como lo haría con una parada de cuatro vías.
- id: 178
  category: sharing_the_road
  question: Cuando se le requiere detenerse ante un autobús escolar que muestra luces
    rojas intermitentes y un brazo de parada extendido, ¿a qué distancia debe detenerse?
  choices:
    A: Al menos a 10 pies del autobús.
    B: Al menos a 15 pies del autobús.
    C: Al menos a 20 pies del autobús.
    D: Al menos a 50 pies del autobús.
  answer: C
  explanation: Cuando un autobús escolar muestra señales rojas intermitentes y un
    brazo de parada extendido, debe detenerse al menos a 20 pies del autobús.
- id: 179
  category: sharing_the_road
  question: ¿Cuándo NO se le requiere detenerse ante un autobús escolar que está subiendo
    o bajando niños?
  choices:
    A: Cuando viaja por una carretera de dos carriles.
    B: Cuando se encuentra en una carretera de cuatro carriles sin división.
    C: Cuando se encuentra en una carretera dividida de cuatro o más carriles y el
      autobús está detenido en el carril opuesto.
    D: Cuando va tarde y no hay niños visibles.
  answer: C
  explanation: No se requiere detenerse en una carretera dividida que tenga cuatro
    o más carriles y que permita al menos dos carriles de tráfico en direcciones opuestas
    al encontrarse con un autobús escolar detenido en el carril opuesto.
- id: 180
  category: sharing_the_road
  question: En áreas rurales, ¿con cuánta anticipación usan los autobuses escolares
    las luces ámbar intermitentes para advertir a los conductores que se están preparando
    para detenerse?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: D
  explanation: En áreas rurales, las luces ámbar intermitentes se utilizan al menos
    300 pies antes de detenerse para advertir a los demás conductores.
- id: 181
  category: safe_driving_rules
  question: ¿Si dos vehículos entran en una intersección no controlada desde diferentes
    calzadas aproximadamente al mismo tiempo, quién tiene el derecho de paso?
  choices:
    A: El vehículo a la izquierda debe ceder el paso al vehículo a la derecha.
    B: El vehículo a la derecha debe ceder el paso al vehículo a la izquierda.
    C: El vehículo que viaja a una velocidad más rápida tiene el derecho de paso.
    D: El vehículo más grande tiene el derecho de paso.
  answer: A
  explanation: Si dos vehículos entran en una intersección no controlada por señales
    o semáforos aproximadamente al mismo tiempo, el conductor del vehículo a la izquierda
    debe ceder el paso al vehículo a la derecha.
- id: 182
  category: safe_driving_rules
  question: ¿Qué sucede si entra en una intersección no controlada a una velocidad
    ilegal?
  choices:
    A: Mantiene el derecho de paso pero puede recibir una citación.
    B: Pierde cualquier derecho de paso que de otro modo podría tener.
    C: Otros conductores deben cederle el paso para evitar un choque.
    D: Debe retroceder inmediatamente fuera de la intersección.
  answer: B
  explanation: 'El manual establece explícitamente: ''Si entra en una intersección
    no controlada a una velocidad ilegal, pierde cualquier derecho de paso que de
    otro modo podría tener''.'
- id: 183
  category: sharing_the_road
  question: ¿La ley exige que se detenga y ceda el derecho de paso a una persona ciega
    que lleve qué tipo de bastón?
  choices:
    A: Un bastón amarillo sólido.
    B: Un bastón blanco con punta roja.
    C: Un bastón negro sólido.
    D: Un bastón rojo con punta blanca.
  answer: B
  explanation: La ley exige que se detenga y ceda el derecho de paso en cualquier
    intersección a una persona ciega que lleve un bastón blanco con punta roja y sostenga
    el bastón con el brazo extendido.
- id: 184
  category: sharing_the_road
  question: ¿Qué debe hacer si un vehículo de emergencia que muestra luces intermitentes
    y hace sonar una sirena se aproxima mientras usted está en una intersección?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Acelerar para salir de la intersección lo más rápido posible.
    C: Despejar la intersección antes de hacerse a un lado de la calzada y detenerse.
    D: Hacerse al lado izquierdo de la intersección y detenerse.
  answer: C
  explanation: Al ceder el paso a un vehículo de emergencia, si se encuentra en una
    intersección, debe despejarla antes de detenerse. Diríjase al lado de la calzada
    y deténgase.
- id: 185
  category: safe_driving_rules
  question: Al adelantar a otro vehículo en una carretera de dos carriles, ¿cuándo
    es seguro regresar al carril derecho?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del vehículo
      adelantado.
    B: Cuando esté a 50 pies por delante del vehículo adelantado.
    C: Cuando el conductor del vehículo adelantado haga parpadear sus faros.
    D: Cuando pueda ver toda la parte delantera del vehículo que acaba de adelantar
      en su espejo retrovisor interior.
  answer: D
  explanation: No regrese al carril derecho demasiado pronto; no lo haga hasta que
    pueda ver toda la parte delantera del vehículo que acaba de adelantar en su espejo
    retrovisor interior.
- id: 186
  category: safe_driving_rules
  question: ¿Qué debe hacer al salir de un callejón, entrada privada o edificio dentro
    de un distrito comercial o residencial?
  choices:
    A: Detenerse siempre antes de cruzar la acera o el área del cruce de peatones.
    B: Tocar la bocina y avanzar sin detenerse.
    C: Ceder el paso solo si hay vehículos aproximándose por la calle.
    D: Reducir la velocidad a 5 mph antes de entrar a la calle.
  answer: A
  explanation: Al salir de un callejón, entrada privada o edificio dentro de un distrito
    comercial o residencial, siempre debe detenerse antes de cruzar la acera o el
    área del cruce de peatones.
- id: 187
  category: safe_driving_rules
  question: 'Se le prohíbe cruzar la línea central para adelantar en una curva o colina
    a menos que tenga una distancia de adelantamiento despejada de al menos:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: No puede cruzar la línea central para adelantar en una curva o colina
    donde no pueda ver una distancia de adelantamiento despejada de al menos 500 pies.
- id: 188
  category: sharing_the_road
  question: 'Los conductores deben ceder el paso a un peatón ciego que esté:'
  choices:
    A: Llevando un bastón blanco o metálico, o usando un perro guía.
    B: Usando un chaleco reflectante amarillo.
    C: Acompañado por un compañero vidente.
    D: Cruzando fuera de un cruce de peatones marcado sin bastón ni perro.
  answer: A
  explanation: Los conductores deben ceder el paso a los peatones ciegos que lleven
    un bastón blanco o metálico, con o sin punta roja, o que utilicen un perro guía
    al entrar en una intersección.
- id: 189
  category: sharing_the_road
  question: 'Al caminar por una calzada donde no hay aceras, los peatones deben:'
  choices:
    A: Caminar por el lado derecho de la calzada con el tráfico.
    B: Caminar por el lado izquierdo de la calzada cediendo el paso al tráfico que
      viene en sentido contrario.
    C: Caminar por el centro de la calzada.
    D: Caminar por cualquier lado siempre que lleven ropa reflectante.
  answer: B
  explanation: El manual establece que los peatones deben caminar por el lado izquierdo
    de la calzada cediendo el paso al tráfico que viene en sentido contrario.
- id: 190
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento requerida para vehículos no
    oficiales detrás de un vehículo de emergencia en una misión de emergencia?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Solo se permite que los vehículos en asuntos oficiales necesarios sigan
    a menos de 500 pies a los vehículos de emergencia en una misión de emergencia.
- id: 191
  category: safe_driving_rules
  question: ¿En cuál de las siguientes vías está estrictamente prohibido dar marcha
    atrás con un vehículo para vehículos que no sean de emergencia?
  choices:
    A: Calles urbanas de sentido único
    B: Autopistas de acceso controlado (freeways y expressways)
    C: Caminos rurales de dos carriles
    D: Entradas residenciales
  answer: B
  explanation: Dar marcha atrás está prohibido en autopistas de acceso controlado
    (freeways y expressways), excepto para vehículos de emergencia en el desempeño
    de sus funciones.
- id: 192
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar que se va a detener o a
    disminuir la velocidad?
  choices:
    A: Mano y brazo extendidos hacia arriba
    B: Mano y brazo extendidos hacia afuera horizontalmente
    C: Mano y brazo extendidos hacia abajo
    D: Mover la mano en un movimiento circular
  answer: C
  explanation: La señal manual correcta para DETENERSE O DISMINUIR LA VELOCIDAD es
    la mano y el brazo extendidos hacia abajo.
- id: 193
  category: driver_responsibility
  question: ¿Es ilegal conducir un vehículo con más de cuántas personas en el asiento
    delantero si esto obstruye la vista o el control del conductor?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Es ilegal conducir cualquier vehículo tan cargado o cuando haya un
    número de personas superior a tres en el asiento delantero que obstruya la visión
    del conductor o dificulte el control.
- id: 194
  category: vehicle_information
  question: Durante el día, si una carga sobresale 4 pies o más de la parte trasera
    de un vehículo, ¿qué debe colocarse al final de la carga?
  choices:
    A: Una luz roja visible a 500 pies
    B: Una señal de advertencia amarilla
    C: Una bandera roja de al menos 12 pulgadas cuadradas
    D: Una bandera blanca de al menos 18 pulgadas cuadradas
  answer: C
  explanation: Si una carga sobresale 4 pies o más de la parte trasera de un vehículo,
    se debe colocar una bandera roja de al menos 12 pulgadas cuadradas en su extremo
    durante el día.
- id: 195
  category: driver_responsibility
  question: ¿Cuál de los siguientes documentos NO es obligatorio que el conductor
    presente cuando lo detienen por una infracción de tráfico?
  choices:
    A: Licencia de conducir
    B: Comprobante de seguro
    C: Registro del vehículo
    D: Título del vehículo
  answer: D
  explanation: Cuando se le detiene por una infracción de tráfico, los tres documentos
    que deben presentarse son la licencia de conducir, el comprobante de seguro y
    el registro del vehículo. El título del vehículo no figura en la lista.
- id: 196
  category: driver_responsibility
  question: Según la Ley de Seguro de Responsabilidad Obligatorio de Alabama, ¿cuál
    es la cobertura mínima requerida por muerte o lesiones corporales a una persona?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Las pólizas de seguro de responsabilidad civil deben emitirse por no
    menos de $25,000 por muerte o lesiones corporales a una persona.
- id: 197
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una primera condena por una infracción de
    seguro de responsabilidad obligatorio?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Un propietario u operador condenado por una infracción de seguro de
    responsabilidad obligatorio puede ser multado con hasta $500 por la primera infracción.
- id: 198
  category: vehicle_information
  question: ¿Cuál es la transmisión de luz mínima permitida para las ventanas laterales
    y traseras tintadas en automóviles de pasajeros como los sedanes?
  choices:
    A: 15 por ciento
    B: 20 por ciento
    C: 32 por ciento
    D: 50 por ciento
  answer: C
  explanation: En los automóviles de pasajeros, como sedanes, cupés y camionetas familiares
    (station wagons), todas las ventanas (laterales y traseras) pueden tener un tintado
    que permita al menos un 32 por ciento de transmisión de luz.
- id: 199
  category: penalties_and_points
  question: ¿A qué sanción puede enfrentarse un conductor por retirarse de un establecimiento
    de gasolina sin pagar por el combustible?
  choices:
    A: Pérdida de su licencia de conducir
    B: Servicio comunitario obligatorio
    C: Confiscación de su vehículo
    D: Un antecedente penal permanente por delito grave
  answer: A
  explanation: Según la ley de Alabama, si no paga la gasolina, puede perder su licencia
    de conducir.
- id: 200
  category: defensive_driving
  question: Al cambiar de carril, ¿por qué debería mirar por encima del hombro además
    de revisar los espejos?
  choices:
    A: Para revisar el "punto ciego" que su espejo no cubre
    B: Para ver si el conductor detrás de usted está haciendo señales
    C: Para asegurarse de que su placa trasera sea visible
    D: Para buscar vehículos de emergencia a lo lejos
  answer: A
  explanation: 'El manual aconseja: "Mire por encima de su hombro para revisar el
    ''punto ciego'' que su espejo no cubre".'
- id: 201
  category: penalties_and_points
  question: ¿Cuál es la sanción por una segunda condena por irse sin pagar la gasolina?
  choices:
    A: Una suspensión de la licencia por 30 días
    B: Una suspensión de la licencia por seis meses
    C: Una suspensión de la licencia por un año
    D: Revocación permanente de la licencia
  answer: B
  explanation: Según la ley de Alabama, en una segunda condena por retirarse de las
    instalaciones de un establecimiento de gasolina sin pagar, la licencia de conducir
    será suspendida por un período de seis meses.
- id: 202
  category: penalties_and_points
  question: ¿Cómo se clasifica el delito de conducir su vehículo fuera de las instalaciones
    de un establecimiento de gasolina sin pagar?
  choices:
    A: Un delito menor de Clase A
    B: Un delito grave de Clase B
    C: Una infracción de tráfico
    D: Un delito menor de Clase C
  answer: A
  explanation: El Proyecto de Ley del Senado de Alabama 459 establece que una persona
    que se retire sin pagar la gasolina será culpable de un delito menor de Clase
    A.
- id: 203
  category: safe_driving_rules
  question: 'Según la Ley de Ceder el Paso (Move-Over Law), si no puede cambiar de
    carril de manera segura en una carretera de cuatro carriles al acercarse a un
    vehículo de emergencia con luces intermitentes, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Mantener su velocidad y tocar la bocina
    C: Reducir la velocidad a al menos 15 mph menos que el límite de velocidad indicado
    D: Acelerar para rebasar el vehículo de emergencia rápidamente
  answer: C
  explanation: El manual establece que cuando cambiar de carril no es seguro o no
    es posible, el conductor debe reducir la velocidad a una velocidad que sea al
    menos 15 millas por hora menor que el límite de velocidad indicado.
- id: 204
  category: safe_driving_rules
  question: En una carretera de dos carriles con un límite de velocidad de 20 mph,
    ¿a qué velocidad debe circular al rebasar un vehículo de emergencia detenido con
    luces intermitentes?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: Si conduce en una carretera de dos carriles, el conductor debe circular
    a 10 millas por hora cuando el límite de velocidad indicado es de 20 millas por
    hora o menos.
- id: 205
  category: vehicle_information
  question: En condiciones normales, ¿a qué distancia aproximadamente iluminan la
    carretera las luces altas (high beam)?
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 1000 pies
  answer: B
  explanation: El manual establece que las luces delanteras en posición de luces altas
    normalmente iluminan la carretera a unos 350 pies en condiciones normales.
- id: 206
  category: safe_driving_rules
  question: ¿Por ley, se requiere que baje sus luces delanteras cuando se encuentre
    a qué distancia de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: Debe bajar sus luces delanteras cuando esté a menos de 500 pies de
    un vehículo que se aproxima.
- id: 207
  category: safe_driving_rules
  question: 'Al seguir a otro vehículo por la noche, debe bajar sus luces delanteras
    cuando se encuentre a menos de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 350 pies
    D: 500 pies
  answer: B
  explanation: La ley exige que baje sus luces delanteras cuando esté a menos de 200
    pies al seguir a otro vehículo.
- id: 208
  category: defensive_driving
  question: 'Para reducir el deslumbramiento de las luces delanteras de los vehículos
    que vienen en sentido contrario por la noche, usted debe:'
  choices:
    A: Mirar directamente a las luces que se aproximan para rastrear el vehículo
    B: Encender sus luces altas para mejorar su propia visibilidad
    C: Mirar hacia el borde derecho del pavimento y concentrarse en la línea blanca
    D: Cerrar un ojo hasta que el vehículo pase
  answer: C
  explanation: El deslumbramiento de las luces que se aproximan se puede reducir desviando
    la vista de ellas, lo cual se hace mirando hacia el borde derecho del pavimento
    y concentrándose en la línea blanca.
- id: 209
  category: safe_driving_rules
  question: Si debe convertirse en peatón durante una emergencia en la carretera por
    la noche, ¿cómo debe caminar por la autopista?
  choices:
    A: En el borde derecho de la carretera con el flujo del tráfico
    B: En el borde izquierdo de la carretera o en el arcén de frente al tráfico
    C: En el centro del carril para permanecer visible
    D: En el arcén derecho de espaldas al tráfico
  answer: B
  explanation: Si DEBE convertirse en peatón, lleve una luz y camine por el borde
    izquierdo de la carretera o el arcén DE FRENTE al tráfico.
- id: 210
  category: safe_driving_rules
  question: Si tiene bengalas o reflectores durante una emergencia nocturna, ¿dónde
    deben colocarse para advertir al resto del tráfico?
  choices:
    A: De 10 a 50 pies delante de su vehículo
    B: De 50 a 100 pies detrás de su vehículo
    C: De 100 a 500 pies detrás de su vehículo en el borde derecho
    D: Directamente en el techo de su vehículo
  answer: C
  explanation: Si tiene bengalas o reflectores, colóquelos de 100 a 500 pies detrás
    de su vehículo en el borde derecho de la carretera para advertir al resto del
    tráfico.
- id: 211
  category: safe_driving_rules
  question: ¿Según la ley estatal, durante qué horas deben estar encendidas las luces
    delanteras?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: Desde media hora después del atardecer hasta media hora antes del amanecer
    C: Desde una hora después del atardecer hasta una hora antes del amanecer
    D: Desde las 8:00 PM hasta las 6:00 AM
  answer: B
  explanation: Según la ley estatal, las luces delanteras deben estar encendidas desde
    media hora después del atardecer hasta media hora antes del amanecer y durante
    otros periodos de visibilidad limitada.
- id: 212
  category: safe_driving_rules
  question: 'La ley de Alabama exige que las luces delanteras estén encendidas cuando:'
  choices:
    A: Está usando los limpiaparabrisas de forma intermitente
    B: Los limpiaparabrisas están en uso debido a la lluvia, aguanieve o nieve
    C: Conduce por una carretera de tierra o grava
    D: El cielo está nublado pero no está lloviendo
  answer: B
  explanation: La ley de Alabama exige que las luces delanteras estén encendidas cuando
    los limpiaparabrisas del vehículo están en uso debido a la lluvia, aguanieve o
    nieve. El uso intermitente no requiere el uso de las luces delanteras.
- id: 213
  category: defensive_driving
  question: En nieve o hielo, ¿aproximadamente cuánta más distancia se necesita para
    detener su automóvil en comparación con el pavimento seco?
  choices:
    A: De dos a tres veces más
    B: De tres a doce veces más
    C: De diez a quince veces más
    D: Veinte veces más
  answer: B
  explanation: Recuerde que en nieve o hielo se necesita de tres a doce veces más
    distancia para detener su automóvil que en pavimento seco.
- id: 214
  category: vehicle_information
  question: 'Si sus ruedas patinan al intentar arrancar sobre nieve o hielo en un
    vehículo con transmisión manual, usted debe:'
  choices:
    A: Arrancar en segunda o en una marcha alta
    B: Acelerar el motor a la velocidad máxima
    C: Bombear los frenos rápidamente
    D: Girar el volante bruscamente hacia la izquierda
  answer: A
  explanation: Si sus ruedas patinan, arranque en segunda o en una marcha alta. Esto
    permite una aceleración más suave y debería ayudarle a evitar que las ruedas patinen
    o se deslicen.
- id: 215
  category: vehicle_information
  question: Para los SUV, camiones, furgonetas y vehículos recreativos (RV), ¿cuál
    es la transmisión de luz mínima permitida para las ventanas laterales de los asientos
    delanteros?
  choices:
    A: 15 por ciento
    B: 20 por ciento
    C: 32 por ciento
    D: 50 por ciento
  answer: C
  explanation: Para otros vehículos como SUV, camiones, furgonetas y vehículos recreativos
    (RV), las ventanas laterales de los asientos delanteros están sujetas a la misma
    restricción del 32 por ciento.
- id: 216
  category: defensive_driving
  question: ¿Qué debe hacer para superar un derrape si conduce un vehículo convencional
    de tracción trasera?
  choices:
    A: Presionar ligeramente el acelerador
    B: Frenar bruscamente de inmediato
    C: Soltar suavemente el acelerador
    D: Cambiar a reversa
  answer: C
  explanation: Con un vehículo convencional de tracción trasera, cuando suelta suavemente
    el acelerador, el motor actúa como un freno para reducir ligeramente la velocidad
    de las ruedas traseras, permitiendo que la parte delantera se estabilice.
- id: 217
  category: defensive_driving
  question: ¿Cómo debe manejar un derrape en un vehículo de tracción delantera?
  choices:
    A: Soltar el acelerador por completo
    B: Presionar ligeramente el acelerador
    C: Aplicar los frenos con firmeza
    D: Poner el vehículo en punto muerto (neutral)
  answer: B
  explanation: Para superar un derrape con vehículos de tracción delantera, presionar
    ligeramente el acelerador aumentará la velocidad de las ruedas delanteras para
    que la parte delantera pueda alcanzar a la parte trasera que se desliza.
- id: 218
  category: safe_driving_rules
  question: ¿A qué velocidad comienza normalmente el hidroplaneo (hydroplaning) parcial
    en un automóvil de pasajeros estándar?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: En un automóvil de pasajeros estándar, el hidroplaneo parcial comienza
    a unas 35 mph y aumenta con la velocidad hasta unas 55 mph.
- id: 219
  category: defensive_driving
  question: ¿Cuál es la mejor acción a tomar si su vehículo comienza a hidroplanear
    totalmente?
  choices:
    A: Bombear los frenos rápidamente
    B: Girar el volante bruscamente
    C: Acelerar para atravesar el agua
    D: Quitar el pie del acelerador y dejar que el automóvil disminuya la velocidad
  answer: D
  explanation: Si está hidroplaneando totalmente, lo único que puede hacer es soltar
    el acelerador y esperar a que pase el derrape.
- id: 220
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar al conducir en una niebla espesa o nieve
    cegadora?
  choices:
    A: Luces delanteras de carretera (altas)
    B: Luces delanteras de cruce (bajas)
    C: Solo las luces de estacionamiento
    D: Solo las luces de emergencia
  answer: B
  explanation: Mantenga las luces delanteras en la posición de cruce (bajas) para
    reducir el reflejo deslumbrante de sus luces sobre la capa de niebla espesa o
    la nieve cegadora.
- id: 221
  category: safe_driving_rules
  question: ¿Qué prohíbe la ley hacer al conducir cuesta abajo?
  choices:
    A: Bajar en punto muerto (neutral) con la transmisión desengranada
    B: Usar la bocina en las curvas
    C: Conducir en una marcha más baja
    D: Aplicar los frenos continuamente
  answer: A
  explanation: La ley prohíbe bajar una pendiente en punto muerto (neutral) con la
    transmisión desengranada.
- id: 222
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de intoxicación por monóxido de
    carbono?
  choices:
    A: Cansancio repentino y bostezos
    B: Latidos cardíacos rápidos
    C: Hambre extrema
    D: Visión borrosa
  answer: A
  explanation: Los síntomas de la intoxicación por monóxido de carbono son cansancio
    repentino, bostezos, mareos y náuseas.
- id: 223
  category: vehicle_information
  question: ¿Cuál es una de las razones más comunes de un reventón de neumático?
  choices:
    A: Inflado excesivo
    B: Inflado insuficiente
    C: Conducir en carreteras mojadas
    D: Usar las luces altas
  answer: B
  explanation: El inflado insuficiente es una de las razones más comunes de los reventones.
- id: 224
  category: defensive_driving
  question: ¿Qué debe hacer primero si experimenta un reventón repentino de un neumático?
  choices:
    A: Frenar bruscamente de inmediato
    B: Virar bruscamente hacia el arcén (hombro) de la carretera
    C: Sujetar firmemente el volante y mantener la dirección recta
    D: Poner la marcha en punto muerto (neutral)
  answer: C
  explanation: Para recuperar el control durante un reventón, sujete firmemente el
    volante, mantenga la dirección recta y suelte gradualmente el acelerador. No frene
    hasta que el vehículo esté bajo control.
- id: 225
  category: defensive_driving
  question: Si pierde repentinamente el control de la dirección, ¿por qué debe evitar
    frenar?
  choices:
    A: Hará que el motor se apague
    B: Puede desequilibrar el vehículo y hacer que pierda el control
    C: Hará que los neumáticos sufran hidroplaneo (aquaplaning)
    D: Dañará las pastillas de freno
  answer: B
  explanation: Si frena o intenta cambiar de marcha durante una falla en la dirección,
    este cambio repentino de velocidad puede desequilibrar el vehículo y hacer que
    pierda el control.
- id: 226
  category: defensive_driving
  question: ¿Qué debe hacer si el pedal del freno se hunde repentinamente hasta el
    fondo?
  choices:
    A: Apagar el motor inmediatamente
    B: Cambiar a una marcha más alta
    C: Intentar bombear el pedal para aumentar la presión
    D: Dirigirse hacia la zanja más cercana
  answer: C
  explanation: Si el pedal del freno se hunde repentinamente hasta el fondo, intente
    bombear el pedal para aumentar la presión.
- id: 227
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento correcto si sus ruedas se desvían hacia el arcén
    (hombro) de la carretera?
  choices:
    A: Virar bruscamente de regreso al pavimento
    B: Frenar bruscamente para detenerse de inmediato
    C: Acelerar para volver a la carretera rápidamente
    D: Permanecer en el arcén, reducir la velocidad y girar suavemente de regreso
      al pavimento
  answer: D
  explanation: Si sus ruedas se desvían hacia el arcén de la carretera, no intente
    virar bruscamente de regreso al pavimento. En su lugar, permanezca en el arcén
    y reduzca la velocidad. Una vez que haya disminuido la velocidad, gire suavemente
    de regreso al pavimento.
- id: 228
  category: defensive_driving
  question: Si un automóvil viene hacia usted en su carril, ¿por qué NO debe girar
    hacia el carril izquierdo para evitarlo?
  choices:
    A: Es ilegal cruzar la línea central
    B: El conductor que viene de frente podría reaccionar y volver a la trayectoria
      de su automóvil
    C: Su vehículo perderá tracción y patinará
    D: No podrá ver claramente en el carril izquierdo
  answer: B
  explanation: No gire hacia el carril izquierdo porque el conductor del vehículo
    que viene de frente podría reaccionar y volver a la trayectoria de su automóvil.
- id: 229
  category: sharing_the_road
  question: Si un automóvil intenta adelantarlo pero no puede completar la maniobra
    debido al tráfico que viene de frente, y un choque es casi seguro, ¿qué debe hacer?
  choices:
    A: Acelerar para bloquear al automóvil que intenta adelantar
    B: Moverse rápidamente hacia el arcén (hombro) derecho para permitir que el automóvil
      entre en su carril
    C: Detener su vehículo inmediatamente en el carril
    D: Encender las luces altas para advertir al tráfico que viene de frente
  answer: B
  explanation: Si el arcén derecho es adecuado y un choque es casi seguro, muévase
    rápidamente hacia el arcén para permitir que el automóvil que lo adelanta entre
    en su carril.
- id: 230
  category: vehicle_information
  question: ¿Cómo podría mover un automóvil con transmisión manual que se ha apagado
    en las vías del tren?
  choices:
    A: Empujándolo solo desde atrás
    B: Accionando el motor de arranque mientras el automóvil está en primera o segunda
      marcha
    C: Poniendo el punto muerto (neutral) y dejándolo rodar
    D: Acelerando el motor en reversa
  answer: B
  explanation: Si su automóvil se apaga en las vías del tren y tiene transmisión manual,
    es posible que pueda moverlo fuera de las vías accionando el motor de arranque
    mientras el automóvil está en primera o segunda marcha.
- id: 231
  category: defensive_driving
  question: Si su vehículo cae en aguas profundas pero no se hunde de inmediato, ¿cuál
    es la mejor manera de escapar?
  choices:
    A: Abrir la puerta rápidamente antes de que el agua suba.
    B: Esperar a que el vehículo se llene de agua para igualar la presión.
    C: Escapar a través de una ventana inmediatamente.
    D: Moverse al asiento trasero y esperar el rescate.
  answer: C
  explanation: 'El manual aconseja: "Si su vehículo cae en aguas profundas PERO NO
    SE HUNDE, escape inmediatamente a través de una ventana. Abrir una puerta, incluso
    si es posible, permitirá que el agua entre al vehículo con mayor rapidez".'
- id: 232
  category: vehicle_information
  question: ¿Por qué NO debe usar agua para apagar un incendio en el motor si sale
    humo de debajo del capó?
  choices:
    A: El agua dañará los componentes eléctricos del motor.
    B: La gasolina encendida flotará sobre el agua y propagará el fuego.
    C: El agua hará que el radiador explote.
    D: El cambio repentino de temperatura agrietará el bloque del motor.
  answer: B
  explanation: 'El manual establece con respecto a los incendios de vehículos: "No
    use agua, ya que la gasolina encendida flotará sobre ella y propagará el fuego".'
- id: 233
  category: vehicle_information
  question: ¿Qué debe hacer para ayudar a evitar que su motor se sobrecaliente en
    tráfico lento?
  choices:
    A: Encender la calefacción del vehículo al máximo.
    B: Poner el vehículo en punto muerto (neutral) y acelerar el motor brevemente
      durante las paradas.
    C: Apagar el motor cada vez que el tráfico se detenga.
    D: Abrir ligeramente la tapa del radiador para liberar presión.
  answer: B
  explanation: 'El manual establece: "Puede ayudar a prevenir el sobrecalentamiento
    en tráfico lento poniendo el vehículo en punto muerto (neutral) y acelerando el
    motor brevemente durante las paradas. Esto acelerará el ventilador y la bomba
    de agua".'
- id: 234
  category: defensive_driving
  question: Si el pedal del acelerador se queda atascado y decide apagar el motor
    para reducir la velocidad, ¿qué peligro secundario debe esperar?
  choices:
    A: El volante se bloqueará inmediatamente.
    B: Las bolsas de aire se desplegarán.
    C: Perderá la asistencia de la dirección hidráulica y de los frenos de potencia.
    D: La transmisión cambiará automáticamente a reversa.
  answer: C
  explanation: 'El manual advierte que si apaga el motor para reducir la velocidad
    de un vehículo con el acelerador atascado: "Si tiene dirección hidráulica o frenos
    de potencia, perderá esta asistencia al apagar el motor".'
- id: 235
  category: safe_driving_rules
  question: Al conducir en una autopista, ¿qué deben hacer los vehículos que circulan
    más despacio?
  choices:
    A: Conducir por el acotamiento izquierdo.
    B: Mantenerse a la derecha.
    C: Mantener una velocidad de al menos 55 mph.
    D: Conducir por el carril central con las luces de emergencia encendidas.
  answer: B
  explanation: 'El manual establece: "Los vehículos que circulan más despacio, aquellos
    que viajan a una velocidad inferior a la normal del tráfico en ese momento, DEBEN
    MANTENERSE A LA DERECHA".'
- id: 236
  category: safe_driving_rules
  question: Si tiene una avería mecánica en la autopista, ¿cómo puede pedir ayuda
    a las autoridades?
  choices:
    A: Pararse en el carril derecho y agitar los brazos.
    B: Tocar la bocina continuamente siguiendo un patrón de SOS.
    C: Abrir el maletero, levantar el capó y atar un paño blanco a la manija de una
      puerta o a la antena.
    D: Colocar triángulos de advertencia exactamente a 100 pies detrás de su vehículo.
  answer: C
  explanation: 'El manual aconseja para emergencias: "Abra el maletero, levante el
    capó si el clima lo permite y ate un paño blanco a la manija de una puerta o a
    la antena, donde se vea mejor. Estas son señales de auxilio...".'
- id: 237
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado para usar un carril de aceleración
    para entrar en una autopista?
  choices:
    A: Detenerse por completo al final del carril y esperar un espacio.
    B: Conducir hasta el final del carril y forzar su entrada al tráfico.
    C: Aumentar la velocidad para igualar la de los vehículos en los carriles de circulación,
      buscar un espacio, señalizar e incorporarse.
    D: Mantener una velocidad lenta hasta estar seguro en el carril derecho.
  answer: C
  explanation: 'El manual establece: "Al acercarse y entrar en el carril de aceleración,
    aumente la velocidad para igualar la de los vehículos en los carriles de circulación,
    si es posible. Busque un espacio, active su señal de giro e incorpórese suavemente
    con el resto del tráfico".'
- id: 238
  category: signs_and_signals
  question: ¿Qué tipo de intercambio de autopista se caracteriza por cuatro rampas
    donde los giros a la izquierda se realizan DESPUÉS de salir de la autopista?
  choices:
    A: Direccional
    B: Trébol (Cloverleaf)
    C: Diamante (Diamond)
    D: Trompeta (Trumpet)
  answer: C
  explanation: 'El manual describe un Intercambio de Diamante como: "Caracterizado
    por cuatro rampas, que permiten a los vehículos entrar o salir de la carretera
    principal mientras fluyen con el tráfico. Los giros a la izquierda se realizan
    DESPUÉS de salir de la autopista".'
- id: 239
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de la salida prevista en la autopista?
  choices:
    A: Detenerse y retroceder con cuidado por el acotamiento.
    B: Hacer un giro en U a través de la mediana.
    C: Continuar hasta la siguiente salida y regresar a la que se pasó.
    D: Reducir la velocidad drásticamente y esperar un espacio en el tráfico para
      dar marcha atrás.
  answer: C
  explanation: 'El manual establece explícitamente: "Si se pasa de su salida, no debe
    detenerse, retroceder ni intentar dar la vuelta; continúe hasta la siguiente salida
    y regrese a la que se pasó".'
- id: 240
  category: vehicle_information
  question: Según la ley de Alabama, ¿los espejos retrovisores de todos los vehículos
    deben permitir al conductor ver a qué distancia hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El manual establece que los espejos retrovisores "Para permitir al
    conductor ver 200 pies hacia atrás son obligatorios en todos los vehículos".
- id: 241
  category: vehicle_information
  question: ¿A qué distancia deben ser visibles los faros delanteros y las luces traseras
    de su vehículo?
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: 'El manual establece con respecto a las luces del vehículo: "Todas
    las luces deben ser visibles desde una distancia de al menos 500 pies".'
- id: 242
  category: vehicle_information
  question: 'Las luces altas de los faros de un vehículo deben iluminar objetos a
    una distancia mínima de:'
  choices:
    A: 200 pies
    B: 350 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: 'El manual especifica: "Las luces altas de los faros deben iluminar
    objetos a un mínimo de 350 pies y estar ajustadas y alineadas".'
- id: 243
  category: driver_responsibility
  question: Según las estadísticas del manual, ¿qué causa el 40 por ciento de las
    muertes en un choque?
  choices:
    A: Golpear el parabrisas, el marco del parabrisas o el panel de instrumentos.
    B: Ser expulsado completamente fuera del vehículo.
    C: El conjunto de la dirección.
    D: Segundas colisiones con otros pasajeros.
  answer: A
  explanation: 'El manual establece: "Las estadísticas muestran que en un choque,
    los conjuntos de dirección causan el 30 por ciento de las lesiones fatales, y
    otro 40 por ciento de las muertes son causadas por golpear el parabrisas, el marco
    del parabrisas o el panel de instrumentos".'
- id: 244
  category: signs_and_signals
  question: ¿Qué tipo de intercambio utiliza conexiones de tipo bucle para eliminar
    los giros a la izquierda y los conflictos de tráfico cruzado en todos los movimientos?
  choices:
    A: Diamante (Diamond)
    B: Direccional (Directional)
    C: Trompeta (Trumpet)
    D: Trébol (Cloverleaf)
  answer: D
  explanation: 'El manual describe un intercambio de trébol (Cloverleaf) como: "Diseñado
    para permitir movimientos de giro hacia o desde la autopista desde cuatro direcciones,
    utilizando conexiones de tipo bucle. Elimina los giros a la izquierda y los conflictos
    de tráfico cruzado para todos los movimientos".'
- id: 245
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    según el manual?
  choices:
    A: 1/32 de pulgada
    B: 1/16 de pulgada
    C: 1/8 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: Un neumático es ilegal si la banda de rodadura tiene menos de 1/16
    de pulgada de profundidad.
- id: 246
  category: safe_driving_rules
  question: ¿Los niños menores de qué edad requieren sistemas especiales de retención
    infantil para protegerlos de lesiones graves o la muerte?
  choices:
    A: Menores de cuatro años
    B: Menores de cinco años
    C: Menores de seis años
    D: Menores de ocho años
  answer: C
  explanation: Para los niños menores de seis años, se necesitan sistemas especiales
    de retención infantil para protegerlos de lesiones graves o la muerte.
- id: 247
  category: vehicle_information
  question: ¿Cuándo es legal usar la bocina de su vehículo motorizado?
  choices:
    A: Para anunciar su llegada a la casa de un amigo
    B: Para llamar a sus pasajeros al vehículo
    C: Para dar una advertencia cuando sea razonablemente necesario para una operación
      segura
    D: Para expresar frustración por el error de otro conductor
  answer: C
  explanation: Es ilegal usar la bocina de un vehículo motorizado para cualquier propósito
    excepto para dar una advertencia cuando sea razonablemente necesario para garantizar
    una operación segura. Nunca use la bocina para anunciar su llegada o llamar a
    sus pasajeros.
- id: 248
  category: sharing_the_road
  question: ¿Qué es la "ZONA DE MUERTE" (DEATH ZONE) en relación con los autobuses
    escolares?
  choices:
    A: La salida de emergencia trasera del autobús
    B: El área dentro del autobús donde ocurren la mayoría de las lesiones
    C: El punto ciego directamente detrás del conductor del autobús
    D: El área alrededor de un autobús escolar detenido donde los niños corren el
      riesgo de ser atropellados por automovilistas
  answer: D
  explanation: El área alrededor del autobús escolar detenido se denomina "ZONA DE
    MUERTE" (DEATH ZONE). La mayoría de los niños heridos o muertos son atropellados
    fuera del autobús por automovilistas que no se detienen ante las luces rojas intermitentes
    y las señales de alto extendidas.
- id: 249
  category: license_system
  question: Un joven de 15 años con una licencia de aprendizaje válida puede conducir
    cuando esté acompañado en el asiento delantero por ¿cuál de los siguientes?
  choices:
    A: Cualquier conductor con licencia que tenga al menos 18 años
    B: Un conductor con licencia que tenga al menos 21 años
    C: Un hermano que tenga al menos 16 años con una licencia válida
    D: Cualquier adulto mayor de 19 años
  answer: B
  explanation: Los jóvenes de 15 años con una licencia de aprendizaje válida están
    autorizados a conducir mientras estén acompañados por un padre, tutor legal o
    una persona de 21 años o más que sea un conductor con licencia y ocupe el asiento
    delantero.
- id: 250
  category: license_system
  question: Bajo las restricciones de la Licencia de Conducir Graduada (GDL), ¿cuántos
    pasajeros que no sean familiares se le permite tener en el vehículo a un conductor
    de 16 años?
  choices:
    A: Ninguno
    B: No más de uno
    C: No más de dos
    D: No más de tres
  answer: B
  explanation: Las restricciones en la licencia de una persona de 16 años establecen
    que no puede tener más de 1 pasajero que no sea familiar, además del padre, tutor
    o conductor con licencia supervisor de al menos 21 años de edad.
- id: 251
  category: license_system
  question: ¿Entre qué horas se le prohíbe generalmente a un conductor estudiante
    de 16 años operar un vehículo a menos que esté acompañado por un padre o tutor
    legal?
  choices:
    A: 10 p.m. y 5 a.m.
    B: 11 p.m. y 6 a.m.
    C: 12 de la medianoche y 6 a.m.
    D: 1 a.m. y 5 a.m.
  answer: C
  explanation: El estudiante no puede operar un vehículo entre las 12 de la medianoche
    y las 6 a.m. a menos que esté acompañado por un padre o tutor legal (o cumpla
    con excepciones específicas).
- id: 252
  category: license_system
  question: ¿Cuál de las siguientes es una excepción válida a la restricción de conducción
    de medianoche a 6 a.m. para un conductor de 16 años?
  choices:
    A: Ir o volver de la casa de un amigo
    B: Ir o volver de un evento patrocinado por la escuela
    C: Ir a una película nocturna
    D: Conducir a un gimnasio de 24 horas
  answer: B
  explanation: Las excepciones a la restricción de medianoche a 6 a.m. incluyen ir
    o volver de un evento patrocinado por la escuela, lugar de trabajo regular, evento
    religioso o conducir debido a una emergencia médica, de incendio o relacionada
    con el cumplimiento de la ley.
- id: 253
  category: penalties_and_points
  question: ¿Cuántos puntos se evaluarán en el historial de un conductor adolescente
    por violar las restricciones de pasajeros o de toque de queda de la Licencia de
    Conducir Graduada (GDL)?
  choices:
    A: Cero puntos
    B: Dos puntos
    C: Tres puntos
    D: Cuatro puntos
  answer: A
  explanation: De acuerdo con las reglas de cumplimiento de la GDL, "No se evaluarán
    puntos por la violación de las restricciones anteriores".
- id: 254
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar cualquiera de las restricciones de la Licencia
    de Conducir Graduada (GDL)?
  choices:
    A: Una multa de $500 e incautación del vehículo
    B: Revocación inmediata de la licencia por un año
    C: El período restrictivo se extiende por 6 meses o hasta los 18 años
    D: Servicio comunitario obligatorio y un curso de conducción defensiva
  answer: C
  explanation: La violación de cualquiera de las restricciones anteriores resultará
    en que el período restrictivo se extienda por 6 meses o hasta que el conductor
    alcance los 18 años de edad.
- id: 255
  category: penalties_and_points
  question: 'La licencia de un conductor de 16 años será suspendida automáticamente
    por 60 días o hasta los 18 años si es condenado por:'
  choices:
    A: Una sola infracción de estacionamiento
    B: Una segunda infracción de tráfico en movimiento
    C: Conducir con un registro vencido
    D: Escuchar el estéreo del auto a un volumen demasiado alto
  answer: B
  explanation: Si un titular de licencia es condenado por una segunda infracción de
    tráfico en movimiento o por infracciones específicas de 4 o más puntos, su licencia
    será suspendida automáticamente por 60 días o hasta los 18 años, lo que ocurra
    primero.
- id: 256
  category: license_system
  question: 'Las restricciones de la Licencia de Conducir Graduada (GDL) NO se aplican
    a un joven de 16 años que esté:'
  choices:
    A: Empleado a tiempo completo
    B: Inscrito en un curso certificado de educación vial
    C: Casado o sea el jefe de familia
    D: Conduciendo un vehículo con transmisión manual
  answer: C
  explanation: El resumen de la GDL establece que no se aplica a personas de 16 años
    o más que estén casadas o sean jefes de familia.
- id: 257
  category: safe_driving_rules
  question: Al planificar un viaje por una autopista, ¿por qué es importante revisar
    el indicador de gasolina de antemano?
  choices:
    A: Porque las velocidades de autopista hacen que los vehículos quemen combustible
      el doble de rápido
    B: Porque no hay estaciones de servicio ubicadas directamente en las autopistas
    C: Porque es ilegal quedarse sin gasolina en una autopista de Alabama
    D: Porque los precios de la gasolina son significativamente más altos cerca de
      las salidas de la autopista
  answer: B
  explanation: El manual aconseja revisar el indicador de gasolina de su automóvil
    y cargar combustible si no tiene suficiente porque "No hay estaciones de servicio
    ubicadas directamente en las autopistas".
- id: 258
  category: alcohol_drugs_health
  question: Según el Acuerdo de Conducción entre Padres y Adolescentes, si un adolescente
    infringe la ley al beber cualquier bebida alcohólica, ¿cuánto tiempo debe esperar
    antes de conducir?
  choices:
    A: 8 horas
    B: 12 horas
    C: 24 horas
    D: 48 horas
  answer: C
  explanation: 'El Acuerdo de Conducción entre Padres y Adolescentes establece: "si
    infrinjo la ley al beber cualquier bebida alcohólica, no conduciré durante 24
    horas".'
- id: 259
  category: vehicle_information
  question: ¿Cuál de los siguientes dispositivos de advertencia está permitido en
    un vehículo motorizado civil estándar?
  choices:
    A: Una sirena
    B: Un silbato de escape
    C: Una campana
    D: Una bocina (claxon) en buen estado de funcionamiento
  answer: D
  explanation: Se requiere una bocina (en buen estado de funcionamiento) en todos
    los vehículos motorizados. No se pueden usar campanas, sirenas o silbatos de escape,
    excepto en vehículos de emergencia.
- id: 260
  category: penalties_and_points
  question: Para los conductores de 15, 16 y 17 años, ¿cuántos puntos evaluados por
    una infracción activarán una suspensión automática de la licencia?
  choices:
    A: Dos o más puntos
    B: Tres o más puntos
    C: Cuatro o más puntos
    D: Seis o más puntos
  answer: C
  explanation: Según el manual, cualquier infracción en la que se evalúen cuatro o
    más puntos suspenderá automáticamente la licencia de un conductor de 15, 16 o
    17 años.
- id: 261
  category: penalties_and_points
  question: Si un conductor de 16 años es condenado por conducción temeraria, ¿por
    cuánto tiempo se suspenderá automáticamente su licencia?
  choices:
    A: 30 días o hasta los 18 años, lo que ocurra primero
    B: 60 días o hasta los 18 años, lo que ocurra primero
    C: 90 días o hasta los 18 años, lo que ocurra primero
    D: 120 días o hasta los 21 años, lo que ocurra primero
  answer: B
  explanation: El manual establece que por conducción temeraria, la licencia de un
    conductor de 15, 16 o 17 años se suspenderá automáticamente por 60 días o hasta
    los 18 años, lo que ocurra primero.
- id: 262
  category: license_system
  question: ¿Qué significan las siglas GDL en el manual del conductor de Alabama?
  choices:
    A: General Driving License (Licencia de Conducir General)
    B: Graduated Drivers License (Licencia de Conducir Graduada)
    C: Guided Driver Learning (Aprendizaje de Conducción Guiado)
    D: Guaranteed Driving Limits (Límites de Conducción Garantizados)
  answer: B
  explanation: El manual se refiere explícitamente a GDL como la "Graduated Drivers
    License" (Licencia de Conducir Graduada).
- id: 263
  category: driver_responsibility
  question: ¿Cuántos días tienen los titulares de una licencia de conducir de Alabama
    para informar a los Servicios de Licencias de Conducir sobre un cambio de dirección?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Los titulares de una licencia de conducir de Alabama tienen 30 días
    para informar a los Servicios de Licencias de Conducir sobre un cambio de dirección.
- id: 264
  category: driver_testing
  question: ¿Con cuánta antelación se debe solicitar una cita para la licencia de
    conducir?
  choices:
    A: 24 horas antes de la fecha preferida para el examen
    B: 48 horas antes de la fecha preferida para el examen
    C: 72 horas antes de la fecha preferida para el examen
    D: Una semana antes de la fecha preferida para el examen
  answer: B
  explanation: El manual establece que todas las solicitudes de citas para la licencia
    de conducir deben realizarse 48 horas antes de la fecha preferida para el examen.
- id: 265
  category: license_system
  question: ¿Qué agencia opera las oficinas de exámenes de licencias de conducir en
    Alabama?
  choices:
    A: Departamento de Transporte
    B: Departamento de Vehículos Motorizados
    C: Agencia de Aplicación de la Ley de Alabama (ALEA)
    D: Oficina de Seguridad en las Carreteras
  answer: C
  explanation: Las oficinas de exámenes de licencias de conducir son operadas por
    la Agencia de Aplicación de la Ley de Alabama (ALEA).
- id: 266
  category: license_system
  question: ¿Cuál de los siguientes servicios se puede completar en línea en el sitio
    web de ALEA?
  choices:
    A: Realizar el examen inicial de habilidades viales
    B: Renovar o reemplazar su licencia de conducir o identificación estatal
    C: Pagar una multa de tráfico
    D: Registrar un vehículo recién comprado
  answer: B
  explanation: 'El manual establece que usted puede "Renovar o reemplazar su licencia
    de conducir o identificación estatal en línea en: www.alea.gov".'
- id: 267
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones provocará una suspensión automática
    de la licencia de 60 días para un conductor de 17 años?
  choices:
    A: Una infracción de estacionamiento
    B: Conducir por el lado equivocado de la carretera
    C: Una infracción que sume dos puntos
    D: No renovar el registro de un vehículo
  answer: B
  explanation: Infracciones como conducir por el lado equivocado de la carretera,
    rebasar ilegalmente o conducción temeraria suspenderán automáticamente la licencia
    de un conductor de 15, 16 o 17 años por 60 días.
- id: 268
  category: driver_testing
  question: Además de la programación en línea, ¿de qué otra manera se pueden solicitar
    citas para la licencia de conducir?
  choices:
    A: Por teléfono durante el horario comercial habitual
    B: Enviando una carta por correo al gobernador
    C: Enviando una solicitud por fax a la estación de policía local
    D: Enviando un correo electrónico al Departamento de Transporte
  answer: A
  explanation: El manual señala que las citas también pueden solicitarse por teléfono
    durante el horario comercial habitual.
- id: 269
  category: license_system
  question: ¿Dónde puede encontrar los formularios de cambio de dirección para su
    licencia de conducir de Alabama?
  choices:
    A: Solo en la oficina de correos
    B: En el sitio web de ALEA en www.alea.gov/driver license/change of address
    C: Solo llamando al departamento de policía local
    D: En la parte posterior del manual del propietario del vehículo
  answer: B
  explanation: Los formularios de cambio de dirección están disponibles en el sitio
    web de ALEA en www.alea.gov/driver license/change of address.
- id: 270
  category: penalties_and_points
  question: ¿Qué sucede con la licencia de un conductor de 15 años si es condenado
    por intentar eludir a un oficial de la ley?
  choices:
    A: Se suspende por 30 días
    B: Se revoca permanentemente
    C: Se suspende automáticamente por 60 días o hasta los 18 años, lo que ocurra
      primero
    D: Se le requiere tomar un curso de conducción defensiva sin suspensión
  answer: C
  explanation: Para los conductores de 15, 16 y 17 años, intentar eludir a un oficial
    de la ley resulta en una suspensión automática de la licencia por 60 días o hasta
    los 18 años, lo que ocurra primero.
- id: 271
  category: license_system
  question: ¿Cuál es el sitio web oficial de la Agencia de Aplicación de la Ley de
    Alabama (ALEA) para acceder a los servicios de licencia de conducir?
  choices:
    A: www.alabama-dmv.com
    B: www.alea.gov
    C: www.aldot.gov
    D: www.alabama-police.org
  answer: B
  explanation: El manual indica a los usuarios que visiten el sitio web de la Agencia
    de Aplicación de la Ley de Alabama en www.alea.gov.
- id: 272
  category: license_system
  question: ¿Cuál es el número de teléfono proporcionado en el manual para comunicarse
    con la División de Servicios de Licencias para consultas generales o cambios de
    dirección?
  choices:
    A: 800-555-1234
    B: 334-242-4400
    C: 205-252-7445
    D: '911'
  answer: B
  explanation: El número de teléfono que figura para la División de Servicios de Licencias
    en Montgomery es 334-242-4400.
- id: 273
  category: penalties_and_points
  question: ¿A qué edades de conductores se aplica la regla de suspensión automática
    de 60 días por infracciones de tráfico específicas?
  choices:
    A: Conductores de 14, 15 y 16 años
    B: Conductores de 15, 16 y 17 años
    C: Conductores de 16, 17 y 18 años
    D: Conductores de 18, 19 y 20 años
  answer: B
  explanation: El manual aborda específicamente esta regla bajo el encabezado "¡¡ATENCIÓN
    CONDUCTORES DE 15, 16 Y 17 AÑOS!!".
- id: 274
  category: license_system
  question: Si necesita enviar correspondencia por correo a la División de Servicios
    de Licencias, ¿a qué ciudad debe dirigirse?
  choices:
    A: Birmingham
    B: Mobile
    C: Montgomery
    D: Huntsville
  answer: C
  explanation: La dirección postal proporcionada para la Agencia de Aplicación de
    la Ley de Alabama, División de Servicios de Licencias es PO Box 1471, Montgomery
    AL 36102-1471.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) octagonal roja significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 275
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 276
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada más adelante
    B: No se permite estacionar
    C: No entrar en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 277
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 278
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Mantenerse a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 279
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 280
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Dar una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 281
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar la vuelta en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 282
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico en ambos sentidos más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 283
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 284
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 285
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cerca
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta zona. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 286
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de caminata cerca
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 287
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 288
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 289
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril (crossbuck) se
    coloca en los cruces de ferrocarril. Significa que debe ceder el paso a los trenes.
    Si se acerca un tren, debe detenerse.
  id: 290
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    sobre una curva en el camino más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 291
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 292
