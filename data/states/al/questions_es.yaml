questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima en Alabama para solicitar un Permiso de Aprendizaje
    de Etapa 1 (Stage 1 Learner's Permit)?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 15 años y medio
  answer: B
  explanation: Según el Manual del Conductor de Alabama, una persona debe tener al
    menos 15 años para ser elegible para un Permiso de Aprendizaje de Etapa 1.
- id: 2
  category: license_system
  question: Bajo la ley de Licencia de Conducir Graduada (GDL) de Alabama, ¿entre
    qué horas tiene generalmente prohibido conducir el titular de una Licencia Restringida
    de Etapa 2 (16 años)?
  choices:
    A: De 10:00 PM a 5:00 AM
    B: De 11:00 PM a 6:00 AM
    C: De medianoche a 6:00 AM
    D: De 9:00 PM a 5:00 AM
  answer: C
  explanation: Los titulares de licencias de Etapa 2 en Alabama no pueden operar un
    vehículo entre la medianoche y las 6:00 AM, a menos que estén acompañados por
    un padre o tutor, o por razones específicas como trabajo, escuela o eventos religiosos.
- id: 3
  category: license_system
  question: ¿Cuántos pasajeros que no sean familiares están permitidos en el vehículo
    cuando conduce un titular de una Licencia Restringida de Etapa 2 en Alabama?
  choices:
    A: No se permiten pasajeros
    B: Solo un pasajero que no sea el padre, madre o tutor
    C: Hasta tres pasajeros
    D: Tantos como cinturones de seguridad haya
  answer: B
  explanation: Las restricciones de la Etapa 2 de Alabama limitan al conductor a un
    solo pasajero que no sea un padre, tutor o miembro de la familia.
- id: 4
  category: license_system
  question: En Alabama, ¿cuántos puntos acumulados en su historial de manejo en un
    período de dos años resultarán en una suspensión de la licencia por 60 días?
  choices:
    A: De 8 a 11 puntos
    B: De 12 a 14 puntos
    C: De 15 a 17 puntos
    D: De 18 a 20 puntos
  answer: B
  explanation: El sistema de puntos de Alabama exige una suspensión de 60 días para
    los conductores que acumulen de 12 a 14 puntos en un período de 2 años.
- id: 5
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una Licencia de Conducir No Restringida
    de Etapa 3 (Stage 3 Unrestricted License) en Alabama?
  choices:
    A: 16 años
    B: 17 años
    C: 18 años
    D: 21 años
  answer: B
  explanation: Un conductor debe tener al menos 17 años y haber tenido una licencia
    de Etapa 2 durante al menos seis meses para graduarse a una Licencia No Restringida
    de Etapa 3.
- id: 6
  category: license_system
  question: Al solicitar una licencia de conducir de Alabama, ¿cuál es el requisito
    mínimo de agudeza visual (con o sin lentes correctivos)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: La ley de Alabama exige una agudeza visual mínima de 20/40 en al menos
    un ojo para obtener una licencia de conducir estándar.
- id: 7
  category: license_system
  question: Si se muda a Alabama desde otro estado, ¿cuántos días tiene para cambiar
    su licencia de otro estado por una licencia de Alabama?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Los nuevos residentes que posean una licencia de conducir válida de
    otro estado deben solicitar una licencia de Alabama dentro de los 30 días posteriores
    al establecimiento de la residencia.
- id: 8
  category: license_system
  question: Según la ley de Alabama, ¿cuál de los siguientes es un requisito para
    el titular de un Permiso de Aprendizaje de Etapa 1 mientras conduce?
  choices:
    A: Debe estar acompañado por un conductor con licencia de al menos 18 años
    B: Debe estar acompañado por un conductor con licencia de al menos 21 años en
      el asiento delantero
    C: Puede conducir solo durante las horas del día
    D: Debe estar acompañado únicamente por un padre o madre
  answer: B
  explanation: El titular de un Permiso de Aprendizaje de Etapa 1 debe estar acompañado
    por un conductor con licencia que tenga al menos 21 años de edad y ocupe el asiento
    al lado del conductor.
- id: 9
  category: license_system
  question: ¿Para qué se utiliza principalmente el 'STAR ID' de Alabama?
  choices:
    A: Para demostrar que es un veterano
    B: Para permitir la conducción de camiones comerciales
    C: Para cumplir con los requisitos federales de REAL ID para viajes aéreos e instalaciones
      federales
    D: Para obtener descuentos en el registro de vehículos del estado
  answer: C
  explanation: El STAR ID (Identificación Segura, Confiable y Fiable) es la versión
    de Alabama de la REAL ID, necesaria para abordar vuelos nacionales y entrar en
    ciertas instalaciones federales.
- id: 10
  category: license_system
  question: ¿Cuántos puntos se asignan al historial de un conductor de Alabama por
    una condena de Conducción Temeraria (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria es una infracción grave en Alabama y resulta
    en la adición de 6 puntos al historial del conductor.
- id: 11
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir estándar en Alabama
    antes de que expire?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: B
  explanation: Las licencias de conducir de Alabama se emiten normalmente por un período
    de cuatro años.
- id: 12
  category: license_system
  question: ¿Cuál de estas acciones resultará en la 'Revocación' obligatoria (no solo
    la suspensión) de una licencia de conducir de Alabama?
  choices:
    A: Falta de pago de la manutención de los hijos
    B: Homicidio involuntario resultante de la operación de un vehículo motorizado
    C: Multa por exceso de velocidad por primera vez
    D: No señalar un giro
  answer: B
  explanation: Según la ley de Alabama, una condena por homicidio involuntario resultante
    de la operación de un vehículo motorizado requiere la revocación obligatoria de
    la licencia de conducir.
- id: 13
  category: license_system
  question: ¿Cuál es el límite de concentración de alcohol en sangre (BAC) para un
    conductor menor de 21 años en Alabama?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Alabama tiene una ley de 'Tolerancia Cero' para menores, estableciendo
    el límite legal de BAC en 0.02% para conductores menores de 21 años.
- id: 14
  category: license_system
  question: 'Si un conductor de Alabama cambia su nombre legal o dirección, debe notificar
    a la División de Licencias de Conducir de ALEA dentro de:'
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Alabama exige que los conductores notifiquen a la División
    de Licencias de Conducir cualquier cambio de nombre o dirección en un plazo de
    30 días.
- id: 15
  category: license_system
  question: ¿Cuál de las siguientes es una restricción para los titulares de una Licencia
    Restringida de Etapa 2 (Stage 2) con respecto a los dispositivos móviles?
  choices:
    A: Solo pueden usar dispositivos de manos libres
    B: Pueden usar cualquier dispositivo después de las 6:00 PM
    C: Se les prohíbe el uso de cualquier dispositivo de comunicación portátil mientras
      conducen
    D: No existen restricciones específicas sobre teléfonos celulares para la Etapa
      2
  answer: C
  explanation: Las leyes de Licencia de Conducir Graduada (GDL) de Alabama prohíben
    estrictamente que los conductores de Etapa 1 y Etapa 2 utilicen cualquier dispositivo
    de comunicación portátil mientras operan un vehículo.
- id: 16
  category: license_system
  question: En Alabama, ¿cómo se clasifica una licencia estándar para vehículos de
    pasajeros?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: D
  explanation: Según el Manual del Conductor de Alabama, se requiere una licencia
    Clase D para operar cualquier vehículo sencillo con una clasificación de peso
    bruto vehicular de menos de 26,001 libras, lo que incluye los automóviles de pasajeros
    estándar.
- id: 17
  category: license_system
  question: Los solicitantes de una licencia de conducir de Alabama que sean menores
    de 19 años deben proporcionar ¿qué documento específico de su escuela?
  choices:
    A: Una copia de su boleta de calificaciones más reciente
    B: Una carta del director de la escuela
    C: Formulario DL-1/93 (Formulario de Inscripción/Exclusión)
    D: Una tarjeta de identificación de estudiante válida
  answer: C
  explanation: La ley de Alabama exige que las personas menores de 19 años proporcionen
    el Formulario DL-1/93 para demostrar que están inscritos en la escuela o que se
    han graduado, como parte del proceso de obtención de la licencia.
- id: 18
  category: license_system
  question: ¿Cuál es la edad mínima para obtener una licencia Clase M de Alabama para
    un 'ciclo impulsado por motor' (tamaño del motor de 150cc o menos)?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: A
  explanation: En Alabama, una persona que tenga al menos 14 años de edad puede obtener
    una licencia Clase M restringida para operar un ciclo impulsado por motor.
- id: 19
  category: license_system
  question: En Alabama, ¿cuál es la tarifa estándar de restablecimiento para una licencia
    de conducir que fue suspendida por un motivo no relacionado con DUI?
  choices:
    A: $50
    B: $100
    C: $150
    D: $275
  answer: B
  explanation: La tarifa estándar de restablecimiento para una licencia de conducir
    de Alabama suspendida es de $100. (Los restablecimientos relacionados con DUI
    son más altos, normalmente $275).
- id: 20
  category: license_system
  question: Para pasar de un Permiso de Aprendizaje de Etapa 1 (Stage 1) a una Licencia
    Restringida de Etapa 2 (Stage 2), ¿cuántas horas de práctica supervisada debe
    completar un conductor de Alabama (si no completó un curso de Educación Vial aprobado
    por el estado)?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Las leyes de GDL de Alabama requieren 50 horas de práctica al volante
    o la finalización de un curso de Educación Vial aprobado por el estado para avanzar
    a la Etapa 2.
- id: 21
  category: license_system
  question: ¿Bajo el Sistema de Puntos de Alabama, cuántos puntos se asignan por conducir
    a 26 mph o más por encima del límite de velocidad establecido?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 8 puntos
  answer: C
  explanation: Conducir a 26 mph o más sobre el límite resulta en 5 puntos en el historial
    de conducción de Alabama. Conducir de 1 a 25 mph sobre el límite resulta en 2
    puntos.
- id: 22
  category: license_system
  question: ¿Cuántos días antes de la fecha de vencimiento se les permite a los residentes
    de Alabama renovar su licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 120 días
    D: 180 días
  answer: D
  explanation: Los conductores de Alabama pueden renovar su licencia hasta 180 días
    (6 meses) antes de la fecha de vencimiento.
- id: 23
  category: license_system
  question: En Alabama, ¿a qué edad puede una persona solicitar una licencia de 'Embarcación'
    (vessel) para operar un bote motorizado sin supervisión?
  choices:
    A: 12 años
    B: 14 años
    C: 16 años
    D: 18 años
  answer: B
  explanation: Aunque un joven de 12 años puede obtener un permiso de embarcación
    para operar con supervisión, una persona debe tener al menos 14 años para operar
    una embarcación motorizada sola en Alabama.
- id: 24
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar una licencia por 'Dificultad Extrema'
    (Hardship - Clase H) en Alabama, la cual permite conducir hacia y desde el trabajo
    o la escuela bajo circunstancias de emergencia específicas?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: A
  explanation: La ley de Alabama permite que se emita una Licencia por Dificultad
    Extrema (Clase H) a personas de tan solo 14 años si cumplen con criterios específicos
    de necesidad extrema.
- id: 25
  category: license_system
  question: 'En Alabama, una cuarta condena por DUI (conducir bajo la influencia)
    dentro de un período de 10 años se clasifica como:'
  choices:
    A: Delito menor (Misdemeanor) Clase A
    B: Delito menor (Misdemeanor) Clase B
    C: Delito grave (Felony) Clase C
    D: Delito grave (Felony) Clase B
  answer: C
  explanation: Bajo la ley de Alabama, una cuarta o subsiguiente condena por DUI dentro
    de 10 años es un delito grave (felony) de Clase C, lo que conlleva sanciones más
    severas que las condenas por delitos menores.
- id: 26
  category: license_system
  question: 'Para obtener una Licencia de Conducir Comercial (CDL) para el comercio
    interestatal (conducir a través de las fronteras estatales), un residente de Alabama
    debe tener al menos:'
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Si bien Alabama permite que los jóvenes de 18 años obtengan una CDL
    para la conducción intraestatal (dentro de Alabama), la ley federal exige que
    un conductor tenga al menos 21 años para el comercio interestatal.
- id: 27
  category: license_system
  question: 'En Alabama, el término ''Cancelación'' (Cancellation) de una licencia
    de conducir se refiere específicamente a:'
  choices:
    A: Perder los privilegios de conducir debido a un DUI
    B: Perder los privilegios de conducir por un período determinado debido a los
      puntos
    C: El retiro permanente de una licencia porque fue emitida por error o mediante
      fraude
    D: La entrega temporal de una licencia por razones médicas
  answer: C
  explanation: La cancelación significa que el Director de Seguridad Pública determina
    que una persona no tenía derecho a la licencia, o que la solicitud contenía información
    falsa.
- id: 28
  category: driver_testing
  question: En Alabama, ¿cuál es el límite de velocidad máximo en las autopistas interestatales
    a menos que se indique lo contrario?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: Según el Manual del Conductor de Alabama, el límite de velocidad máximo
    en las autopistas interestatales de Alabama es de 70 mph, a menos que se indique
    lo contrario.
- id: 29
  category: driver_testing
  question: ¿Cuál es el límite de velocidad legal para un distrito urbano en Alabama
    cuando no hay señales publicadas?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: En Alabama, el límite de velocidad legal en cualquier distrito urbano
    es de 30 mph, a menos que se publique un límite diferente.
- id: 30
  category: driver_testing
  question: Bajo la ley de Seguro de Responsabilidad Obligatorio (MLI) de Alabama,
    ¿cuál es el monto mínimo de cobertura por daños a la propiedad requerido por accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: La ley de Alabama exige un mínimo de $25,000 para daños a la propiedad,
    $25,000 por lesiones corporales o muerte de una persona, y $50,000 por lesiones
    corporales o muerte de dos o más personas (25/50/25).
- id: 31
  category: driver_testing
  question: 'En Alabama, debe presentar un informe de accidente (Formulario SR-13)
    si hay una muerte, lesiones personales o daños a la propiedad de cualquier persona
    que superen los:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: La ley de Alabama exige que se presente un formulario SR-13 ante el
    Departamento de Seguridad Pública si un accidente resulta en lesiones, muerte
    o daños a la propiedad que superen los $250.
- id: 32
  category: driver_testing
  question: 'La ''Ley de Moverse a un Lado'' (Move Over Law) de Alabama exige que
    los conductores se muevan a un carril no adyacente, si es seguro hacerlo, al acercarse
    a un vehículo de emergencia con luces intermitentes. Si cambiar de carril no es
    seguro, el conductor debe:'
  choices:
    A: Mantener la velocidad pero tocar la bocina para advertir al vehículo de emergencia
    B: Detenerse por completo en el carril de circulación
    C: Reducir la velocidad a una velocidad de al menos 15 mph menos que el límite
      indicado
    D: Acelerar para rebasar el vehículo lo más rápido posible
  answer: C
  explanation: Si un conductor no puede moverse de manera segura a un carril no adyacente,
    debe reducir la velocidad a una velocidad que sea al menos 15 mph menor que el
    límite de velocidad indicado.
- id: 33
  category: driver_testing
  question: 'En Alabama, las luces delanteras deben encenderse siempre que esté utilizando
    sus:'
  choices:
    A: Luces de emergencia
    B: Limpiaparabrisas
    C: Luces direccionales
    D: Control de crucero
  answer: B
  explanation: La ley de Alabama exige que las luces delanteras se enciendan siempre
    que los limpiaparabrisas estén en uso debido a la lluvia, el aguanieve o la nieve.
- id: 34
  category: driver_testing
  question: Según el Manual del Conductor de Alabama, ¿es ilegal estacionarse a menos
    de cuántos pies de un hidrante de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: En Alabama, no puede estacionarse a menos de 15 pies de un hidrante
    de incendios.
- id: 35
  category: driver_testing
  question: En Alabama, ¿es ilegal estacionarse a menos de cuántos pies de una señal
    de alto (stop), una señal de ceda el paso (yield) o una señal de control de tráfico?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Alabama prohíbe estacionarse a menos de 30 pies de cualquier
    baliza intermitente, señal de alto, señal de ceda el paso o señal de control de
    tráfico ubicada al costado de una carretera.
- id: 36
  category: driver_testing
  question: 'Para una primera condena por DUI (conducir bajo la influencia) en Alabama,
    la multa ordenada por el tribunal (excluyendo las costas procesales) oscila entre:'
  choices:
    A: $100 a $500
    B: $300 a $1,200
    C: $600 a $2,100
    D: $1,000 a $5,000
  answer: C
  explanation: Una primera condena por DUI en Alabama conlleva una multa que oscila
    entre $600 y $2,100, además de otras sanciones como tiempo en la cárcel y la suspensión
    de la licencia.
- id: 37
  category: driver_testing
  question: ¿Qué regla recomienda el Manual del Conductor de Alabama para mantener
    una distancia de seguimiento segura detrás del vehículo que está delante de usted?
  choices:
    A: La regla de la longitud de un automóvil
    B: La regla de los dos segundos
    C: La regla de los cuatro segundos
    D: La regla de los diez pies
  answer: B
  explanation: El manual de Alabama sugiere la 'regla de los dos segundos' para condiciones
    de conducción normales para garantizar una distancia de seguimiento segura.
- id: 38
  category: driver_testing
  question: 'En Alabama, se le prohíbe dar una vuelta en U en una curva o cerca de
    la cima de una colina si no puede ser visto por los conductores que se acercan
    desde cualquier dirección dentro de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Alabama establece que ningún vehículo debe girar para avanzar
    en la dirección opuesta en ninguna curva o cima de una pendiente donde dicho vehículo
    no pueda ser visto por el conductor de cualquier otro vehículo que se acerque
    desde cualquier dirección dentro de los 500 pies.
- id: 39
  category: driver_testing
  question: ¿Cuál es el límite legal de concentración de alcohol en sangre (BAC) para
    un conductor adulto (21 años o más) que opera un vehículo de pasajeros regular
    en Alabama?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: En Alabama, un conductor adulto se considera legalmente intoxicado
    si su BAC es de 0.08% o superior.
- id: 40
  category: driver_testing
  question: 'Para aprobar el examen de la vista para una licencia de conducir de Alabama,
    el solicitante debe tener un campo de visión horizontal de al menos:'
  choices:
    A: 90 grados
    B: 110 grados
    C: 140 grados
    D: 180 grados
  answer: B
  explanation: Los requisitos de la licencia de Alabama especifican que un solicitante
    debe tener un campo de visión horizontal de al menos 110 grados.
- id: 41
  category: driver_testing
  question: Al usar señales manuales para indicar un giro, ¿qué posición representa
    un giro a la izquierda en Alabama?
  choices:
    A: Brazo extendido hacia arriba
    B: Brazo extendido hacia abajo
    C: Brazo extendido horizontalmente hacia afuera de la ventana
    D: Brazo agitándose en movimiento circular
  answer: C
  explanation: Para señalar un giro a la izquierda mediante señales manuales, el conductor
    debe extender el brazo y la mano horizontalmente hacia afuera de la ventana.
- id: 42
  category: driver_testing
  question: 'Durante el examen de habilidades de conducción de Alabama, el solicitante
    debe demostrar la capacidad de retroceder el vehículo en línea recta por una distancia
    de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: El examen de manejo de Alabama requiere que el solicitante retroceda
    el vehículo en línea recta durante aproximadamente 50 pies sin zigzaguear ni cruzar
    las líneas.
- id: 43
  category: driver_testing
  question: ¿Cuántos puntos se agregan al historial de conducción de Alabama por una
    condena de 'Seguir demasiado de cerca' (tailgating)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: En Alabama, seguir demasiado de cerca es una infracción de 3 puntos
    en el historial del conductor.
- id: 44
  category: driver_testing
  question: Un nuevo residente de Alabama debe registrar su vehículo dentro de ¿cuántos
    días después de establecer su residencia?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Los nuevos residentes deben registrar sus vehículos y obtener una placa
    de Alabama dentro de los 30 días posteriores a su mudanza al estado.
- id: 45
  category: driver_testing
  question: Para aprobar el examen escrito de conocimientos de Alabama, ¿un solicitante
    debe responder correctamente al menos cuántas preguntas de 30?
  choices:
    A: '20'
    B: '21'
    C: '24'
    D: '27'
  answer: C
  explanation: El examen escrito de Alabama consta de 30 preguntas de opción múltiple.
    Se requiere una puntuación de aprobación del 80%, lo que significa responder correctamente
    24 preguntas.
- id: 46
  category: driver_testing
  question: En Alabama, ¿cuál es la edad mínima para solicitar una Licencia de Conducir
    Comercial (CDL) Clase A para operación intraestatal (solo dentro de Alabama)?
  choices:
    A: '16'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: Si bien la ley federal exige que los conductores tengan 21 años para
    el comercio interestatal, Alabama permite que las personas de 18 años o más soliciten
    una CDL para operación intraestatal.
- id: 47
  category: driver_testing
  question: 'Bajo la Ley de Consentimiento Implícito de Alabama, si usted se niega
    a someterse a una prueba química de aliento a petición de un oficial de la ley,
    su licencia será suspendida automáticamente por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 1 año
  answer: C
  explanation: Al conducir por las carreteras de Alabama, usted otorga su 'consentimiento
    implícito' para realizarse pruebas químicas. La negativa a realizar la prueba
    resulta en una suspensión de la licencia de 90 días por la primera infracción.
- id: 48
  category: driver_testing
  question: De acuerdo con la ley de Alabama, ¿qué debe hacer un conductor al acercarse
    a un peatón que lleva un bastón blanco o usa un perro guía?
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo
    D: Ceder el paso solo si están en un cruce de peatones marcado
  answer: C
  explanation: La ley de Alabama exige que los conductores se detengan por completo
    al acercarse a un peatón ciego o con discapacidad visual que lleve un bastón blanco
    o utilice un perro guía.
- id: 49
  category: driver_responsibility
  question: Bajo la ley de Seguro de Responsabilidad Obligatorio de Alabama, ¿cuál
    es el monto mínimo de cobertura requerido por lesiones corporales o muerte de
    dos o más personas en cualquier accidente?
  choices:
    A: $25,000
    B: $40,000
    C: $50,000
    D: $100,000
  answer: C
  explanation: 'La ley de Alabama exige una cobertura ''25/50/25'': $25,000 por lesiones
    corporales por persona, $50,000 por lesiones corporales totales por accidente
    y $25,000 por daños a la propiedad.'
- id: 50
  category: driver_responsibility
  question: Si usted está involucrado en un accidente reportable en Alabama, ¿cuántos
    días tiene para presentar el formulario SR-13 ante el Departamento de Seguridad
    Pública?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Alabama exige que el formulario SR-13 se presente dentro
    de los 30 días posteriores al accidente si este cumple con los criterios de notificación.
- id: 51
  category: driver_responsibility
  question: ¿Cuál es la tarifa de restablecimiento por una primera suspensión del
    registro del vehículo debido a una violación de la ley de Seguro de Responsabilidad
    Civil Obligatorio de Alabama?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: B
  explanation: Por una primera violación de la ley de Seguro de Responsabilidad Civil
    Obligatorio, el registro se suspende hasta que el propietario pague una tarifa
    de restablecimiento de $200 y proporcione prueba de seguro vigente.
- id: 52
  category: driver_responsibility
  question: 'Si un conductor de Alabama es condenado por una segunda o subsiguiente
    violación de la ley de Seguro de Responsabilidad Civil Obligatorio, su registro
    será suspendido por un período obligatorio de:'
  choices:
    A: 30 días
    B: 60 días
    C: 4 meses
    D: 1 año
  answer: C
  explanation: Una segunda o subsiguiente condena por falta de seguro resulta en una
    suspensión obligatoria del registro de 4 meses y una tarifa de restablecimiento
    de $400.
- id: 53
  category: driver_responsibility
  question: 'Bajo la ley de ''Consentimiento Implícito'' (Implied Consent) de Alabama,
    al conducir en las vías públicas de Alabama, usted ha dado su consentimiento para:'
  choices:
    A: Un registro del maletero de su vehículo
    B: Una prueba química de su sangre, aliento u orina
    C: Una revisión de sus registros telefónicos personales
    D: Un curso obligatorio de conducción defensiva cada 2 años
  answer: B
  explanation: La Ley de Consentimiento Implícito significa que se considera que cualquier
    persona que opera un vehículo motorizado en Alabama ha dado su consentimiento
    para una prueba química de su sangre, aliento u orina con el fin de determinar
    el contenido de alcohol o drogas.
- id: 54
  category: driver_responsibility
  question: En Alabama, ¿cuál es el límite legal de concentración de alcohol en sangre
    (BAC) para una persona que opera un vehículo motorizado comercial?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Mientras que el límite es de 0.08% para conductores estándar, es de
    0.04% para conductores comerciales en Alabama.
- id: 55
  category: driver_responsibility
  question: ¿Qué es un certificado SR-22 en el estado de Alabama?
  choices:
    A: Un permiso para conducir un vehículo comercial
    B: Un documento que acredita que un vehículo ha pasado las pruebas de emisiones
    C: Un certificado de responsabilidad financiera requerido después de ciertas suspensiones
      de licencia
    D: Una exención médica para conductores con deficiencias visuales
  answer: C
  explanation: Un SR-22 es un documento emitido por una compañía de seguros al estado
    que certifica que un conductor tiene el seguro de responsabilidad civil mínimo
    requerido. A menudo se requiere para conductores de alto riesgo o para restablecer
    una licencia suspendida.
- id: 56
  category: driver_responsibility
  question: En Alabama, ¿cuál de las siguientes afirmaciones es verdadera con respecto
    a las placas de matrícula del vehículo cuando se vende un vehículo?
  choices:
    A: La placa de matrícula permanece con el vehículo y pasa al nuevo propietario.
    B: La placa de matrícula debe ser destruida por el vendedor.
    C: La placa de matrícula permanece con el vendedor y puede ser transferida a otro
      vehículo de su propiedad.
    D: La placa de matrícula debe enviarse por correo al Departamento de Ingresos
      en un plazo de 24 horas.
  answer: C
  explanation: En Alabama, las placas de matrícula siguen al propietario, no al vehículo.
    Cuando se vende un vehículo, el vendedor retira la placa y puede transferirla
    a un vehículo recién adquirido dentro de un plazo determinado.
- id: 57
  category: driver_responsibility
  question: 'Abandonar la escena de un accidente en Alabama que resulte en lesiones
    o muerte se clasifica como:'
  choices:
    A: Delito menor de Clase A
    B: Delito grave de Clase C
    C: Delito grave de Clase B
    D: Infracción de tráfico
  answer: B
  explanation: Según la ley de Alabama, abandonar la escena de un accidente que involucre
    lesiones personales o la muerte es un delito grave de Clase C (Class C felony).
- id: 58
  category: driver_responsibility
  question: La ley de Alabama exige que los propietarios de vehículos paguen un impuesto
    'Ad Valorem'. ¿En qué se basa este impuesto?
  choices:
    A: El número de millas recorridas anualmente
    B: El peso del vehículo
    C: El valor del vehículo
    D: La edad del conductor
  answer: C
  explanation: El impuesto Ad Valorem es un impuesto sobre la propiedad basado en
    el valor de mercado del vehículo, recaudado anualmente por el funcionario del
    condado encargado de emitir las placas de matrícula.
- id: 59
  category: driver_responsibility
  question: ¿Qué sistema utilizan las fuerzas del orden de Alabama para verificar
    instantáneamente si un vehículo tiene el seguro de responsabilidad civil requerido?
  choices:
    A: AL-Verify
    B: OIVS (Sistema de Verificación de Seguros en Línea)
    C: LETS (Sistema de Seguimiento de las Fuerzas del Orden)
    D: CPIC (Centro de Información sobre Propiedad Criminal)
  answer: B
  explanation: Alabama utiliza el Sistema de Verificación de Seguros en Línea (OIVS),
    que permite a las fuerzas del orden y a los funcionarios de registro verificar
    el estado del seguro en tiempo real.
- id: 60
  category: driver_responsibility
  question: En Alabama, la mayoría de los propietarios de vehículos individuales deben
    renovar su registro anualmente durante un mes específico. ¿Cómo se determina este
    mes?
  choices:
    A: El mes de nacimiento del propietario
    B: El mes en que se compró el vehículo
    C: La primera letra del apellido del propietario
    D: El último dígito del VIN del vehículo
  answer: C
  explanation: Alabama utiliza un sistema de registro escalonado donde el mes de renovación
    se determina por la primera letra del apellido del propietario (por ejemplo, enero
    para nombres que comienzan con A o D).
- id: 61
  category: driver_responsibility
  question: ¿Cuál es la edad mínima para que una persona sea legalmente responsable
    del registro de un vehículo en Alabama?
  choices:
    A: '16'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: En Alabama, debe tener al menos 18 años de edad para ser el único propietario
    de un vehículo y responsable de su registro y titulación.
- id: 62
  category: driver_responsibility
  question: ¿Cuál es la multa máxima por una primera condena por operar un vehículo
    sin el seguro de responsabilidad civil obligatorio requerido en Alabama?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: Una primera infracción de la Ley de Seguro de Responsabilidad Civil
    Obligatorio puede resultar en una multa de hasta $500 más las costas judiciales.
- id: 63
  category: driver_responsibility
  question: Si el registro de su vehículo en Alabama es suspendido por una primera
    infracción de seguro, ¿cuál es la tarifa de restablecimiento?
  choices:
    A: $100
    B: $200
    C: $300
    D: $400
  answer: B
  explanation: Para una primera suspensión bajo la Ley de Seguro de Responsabilidad
    Civil Obligatorio, el propietario debe pagar una tarifa de restablecimiento de
    $200 y presentar un comprobante de seguro vigente.
- id: 64
  category: driver_responsibility
  question: Para una segunda o subsiguiente condena por conducir sin seguro en Alabama,
    ¿por cuánto tiempo se suspenderá el registro de su vehículo?
  choices:
    A: 30 días
    B: 45 días
    C: 4 meses
    D: 6 meses
  answer: C
  explanation: Una segunda o subsiguiente condena por no mantener el seguro obligatorio
    resulta en una suspensión del registro de 4 meses y una tarifa de restablecimiento
    de $400.
- id: 65
  category: driver_responsibility
  question: ¿Qué documento debe mantenerse en el vehículo en todo momento como evidencia
    de responsabilidad financiera en Alabama?
  choices:
    A: El título del vehículo
    B: Una tarjeta de identificación de seguro válida
    C: La factura de venta (Bill of Sale)
    D: El certificado de nacimiento del conductor
  answer: B
  explanation: La Ley de Seguro de Responsabilidad Civil Obligatorio de Alabama exige
    que los conductores lleven una tarjeta de seguro en el vehículo para presentarla
    como prueba de cobertura cuando lo solicite la policía.
- id: 66
  category: driver_responsibility
  question: Si un conductor de Alabama es condenado por "Exceso de velocidad de más
    de 26 mph sobre el límite de velocidad", ¿cuántos puntos se añaden a su historial
    de conducción?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: C
  explanation: El sistema de puntos de Alabama asigna 5 puntos por conducir a 26 mph
    o más sobre el límite establecido.
- id: 67
  category: driver_responsibility
  question: En Alabama, ¿cuál es la consecuencia legal para un conductor que sea sorprendido
    con un recipiente abierto de alcohol en el área de pasajeros de un vehículo en
    una vía pública?
  choices:
    A: Es un delito grave (felony)
    B: Es un delito menor de Clase C (Class C misdemeanor)
    C: No hay sanción si el conductor no está ebrio
    D: Revocación obligatoria de la licencia por 1 año
  answer: B
  explanation: La Ley de Recipientes Abiertos de Alabama establece que es un delito
    menor de Clase C tener un recipiente abierto de bebida alcohólica en el área de
    pasajeros de un vehículo motorizado.
- id: 68
  category: driver_responsibility
  question: Para una primera condena por DUI en Alabama, si el BAC (nivel de alcohol
    en sangre) del conductor era inferior al 0.15%, ¿por cuánto tiempo se suspende
    normalmente la licencia de conducir?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: B
  explanation: Una primera condena por DUI en Alabama generalmente resulta en una
    suspensión de la licencia de 90 días, que puede aplazarse si el conductor opta
    por instalar un dispositivo de bloqueo de encendido (ignition interlock device).
- id: 69
  category: driver_responsibility
  question: ¿Qué es un SR-22 en el contexto de las leyes de conducción de Alabama?
  choices:
    A: Un permiso para estudiantes conductores
    B: Un documento que certifica que un conductor tiene el seguro de responsabilidad
      civil requerido
    C: Una licencia especial para conductores de camiones comerciales
    D: Un formulario utilizado para reportar un vehículo robado
  answer: B
  explanation: Un SR-22 es un Certificado Uniforme de Responsabilidad Financiera que
    una compañía de seguros presenta ante el estado para certificar que un conductor
    de alto riesgo tiene el seguro de responsabilidad civil requerido.
- id: 70
  category: driver_responsibility
  question: 'En Alabama, el registro del vehículo (renovación de la placa) se asigna
    en función de:'
  choices:
    A: El mes de nacimiento del conductor
    B: La fecha en que se compró el vehículo
    C: La primera letra del apellido del propietario
    D: El año del modelo del vehículo
  answer: C
  explanation: Alabama utiliza un sistema de registro escalonado donde el mes de renovación
    se determina por la primera letra del apellido del propietario (por ejemplo, las
    letras 'A' y 'D' renuevan en enero).
- id: 71
  category: safe_driving_rules
  question: ¿Según la ley de Alabama, cuál es el límite de velocidad reglamentario
    en caminos no pavimentados a menos que se indique lo contrario?
  choices:
    A: 25 mph
    B: 30 mph
    C: 35 mph
    D: 45 mph
  answer: C
  explanation: En Alabama, el límite de velocidad reglamentario para caminos no pavimentados
    es de 35 mph, a menos que se indique un límite diferente.
- id: 72
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo en las carreteras interestatales
    de Alabama para vehículos de pasajeros?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: El límite de velocidad máximo en las carreteras interestatales de Alabama
    es de 70 mph, aunque puede ser menor en áreas urbanas.
- id: 73
  category: safe_driving_rules
  question: Cuando tenga la intención de girar, ¿la ley de Alabama exige que señalice
    su intención al menos cuántos pies antes del giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Los conductores deben dar una señal continua de su intención de girar
    durante al menos 100 pies antes de realizar el giro.
- id: 74
  category: safe_driving_rules
  question: Al estacionar en una colina con bordillo (acera) y mirando hacia arriba,
    ¿en qué dirección debe girar las ruedas delanteras?
  choices:
    A: Hacia el bordillo (Derecha)
    B: En dirección contraria al bordillo (Izquierda)
    C: Paralelas al bordillo
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba con un bordillo, gire las ruedas en dirección
    contraria al bordillo (hacia la izquierda) para que, si el automóvil rueda, golpee
    el bordillo y se detenga.
- id: 75
  category: safe_driving_rules
  question: 'Según la ley de ''Hacerse a un lado'' (Move Over) de Alabama, si no puede
    cambiarse al carril adyacente al acercarse a un vehículo de emergencia con luces
    intermitentes, debe reducir la velocidad a una que sea al menos:'
  choices:
    A: 5 mph por debajo del límite
    B: 10 mph por debajo del límite
    C: 15 mph por debajo del límite
    D: 20 mph por debajo del límite
  answer: C
  explanation: Si un conductor no puede cambiarse de carril de manera segura al carril
    adyacente, debe reducir la velocidad a una que sea al menos 15 mph menor que el
    límite de velocidad indicado.
- id: 76
  category: safe_driving_rules
  question: En Alabama, ¿qué sucede con la multa por exceso de velocidad en una zona
    de construcción o mantenimiento cuando hay trabajadores presentes?
  choices:
    A: La multa se triplica
    B: La multa se duplica
    C: La multa aumenta en $500
    D: La multa sigue siendo la misma pero los puntos se duplican
  answer: B
  explanation: La ley de Alabama exige que las multas por exceso de velocidad en una
    zona de construcción o mantenimiento se dupliquen cuando hay trabajadores presentes.
- id: 77
  category: safe_driving_rules
  question: La ley 'Anti-Slowpoke' (contra conductores lentos) de Alabama prohíbe
    a los conductores permanecer en el carril izquierdo de una carretera interestatal
    por más de ¿cuántas millas sin rebasar a otro vehículo?
  choices:
    A: 0.5 millas
    B: 1 milla
    C: 1.5 millas
    D: 2 millas
  answer: C
  explanation: La ley del carril izquierdo de Alabama (Ley 2019-486) prohíbe a los
    conductores operar un vehículo motorizado en el carril del extremo izquierdo de
    una carretera interestatal por más de 1.5 millas sin rebasar a otro vehículo.
- id: 78
  category: safe_driving_rules
  question: 'La ley de Alabama exige que los conductores usen los faros delanteros
    siempre que los limpiaparabrisas estén en uso debido a la lluvia, aguanieve o
    nieve. Esto se conoce como la:'
  choices:
    A: Ley de Lluvia-Luz (Rain-Light Law)
    B: Ley de Limpiaparabrisas Encendidos, Luces Encendidas (Wipers-On, Lights-On
      Law)
    C: Ley de Visibilidad (Visibility Act)
    D: Regla de Vista Despejada (Clear View Rule)
  answer: B
  explanation: La ley de Alabama exige que se enciendan los faros delanteros cuando
    los limpiaparabrisas están en uso debido a las inclemencias del tiempo.
- id: 79
  category: safe_driving_rules
  question: 'En Alabama, se requiere que use sus faros delanteros desde media hora
    después de la puesta del sol hasta media hora antes de la salida del sol, o siempre
    que no pueda ver claramente a una distancia de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Los faros delanteros deben usarse cuando la visibilidad sea inferior
    a 500 pies debido a las condiciones climáticas o de luz.
- id: 80
  category: safe_driving_rules
  question: Al estacionar su vehículo cerca de un hidrante de incendios en Alabama,
    ¿cuál es la distancia mínima requerida que debe mantener?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Alabama prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 81
  category: safe_driving_rules
  question: Según la ley 'Move Over' (Hacerse a un lado) de Alabama, ¿qué debe hacer
    un conductor al acercarse a un vehículo de emergencia autorizado con luces intermitentes
    estacionado al costado de una autopista de varios carriles?
  choices:
    A: Detenerse inmediatamente en el carril de tráfico
    B: Mantener la velocidad pero tocar la bocina para alertar a los trabajadores
      de emergencia
    C: Moverse al carril más alejado del vehículo de emergencia, si es seguro hacerlo
    D: Acelerar para pasar el área lo más rápido posible
  answer: C
  explanation: La Ley Move Over de Alabama exige que los conductores se muevan al
    carril más alejado del vehículo de emergencia en autopistas de varios carriles.
    Si cambiar de carril no es seguro, el conductor debe reducir la velocidad a al
    menos 15 mph menos que el límite de velocidad indicado.
- id: 82
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento recomendada para vehículos de pasajeros
    bajo condiciones normales de conducción en Alabama?
  choices:
    A: La longitud de un automóvil por cada 10 mph
    B: La regla de los dos segundos
    C: 50 pies
    D: La regla de los cuatro segundos
  answer: B
  explanation: El Manual del Conductor de Alabama recomienda utilizar la 'regla de
    los dos segundos' para mantener una distancia de seguimiento segura en condiciones
    normales.
- id: 83
  category: safe_driving_rules
  question: 'En Alabama, se le permite rebasar a un vehículo por el lado derecho ÚNICAMENTE
    si:'
  choices:
    A: El vehículo de adelante está haciendo o está a punto de hacer un giro a la
      izquierda y hay suficiente ancho de pavimento
    B: Usted tiene prisa y el carril izquierdo está bloqueado
    C: El vehículo de adelante conduce por debajo del límite de velocidad
    D: Usted conduce en una carretera de dos carriles y dos sentidos con un arcén
      pavimentado
  answer: A
  explanation: La ley de Alabama permite rebasar por la derecha solo cuando el vehículo
    alcanzado está haciendo o está a punto de hacer un giro a la izquierda, o en carreteras
    con pavimento sin obstrucciones de ancho suficiente para dos o más carriles de
    vehículos en movimiento en la dirección en la que se viaja.
- id: 84
  category: safe_driving_rules
  question: Al estacionar un vehículo cuesta arriba en una calle de dos sentidos con
    bordillo (acera), ¿hacia dónde deben girarse las ruedas delanteras?
  choices:
    A: Hacia el bordillo
    B: Hacia afuera del bordillo
    C: Paralelas al bordillo
    D: Hacia la derecha
  answer: B
  explanation: En Alabama, al estacionar cuesta arriba contra un bordillo, debe girar
    las ruedas hacia afuera del bordillo para que, si el automóvil rueda, la parte
    trasera de la llanta delantera golpee el bordillo y detenga el vehículo.
- id: 85
  category: safe_driving_rules
  question: En Alabama, cuando un autobús escolar se detiene en una autopista de varios
    carriles dividida por una mediana o barrera, ¿qué vehículos deben detenerse?
  choices:
    A: Todos los vehículos en ambas direcciones
    B: Solo los vehículos que viajan en la misma dirección que el autobús
    C: Solo los vehículos que viajan en la dirección opuesta al autobús
    D: No se requiere que ningún vehículo se detenga si hay más de cuatro carriles
  answer: B
  explanation: De acuerdo con la ley de Alabama, si un autobús escolar se detiene
    en una autopista dividida con una barrera física o mediana, solo el tráfico que
    sigue al autobús debe detenerse. El tráfico que circula en la dirección opuesta
    no necesita detenerse.
- id: 86
  category: safe_driving_rules
  question: ¿Cuál es la señal manual correcta para indicar un giro a la izquierda
    en Alabama?
  choices:
    A: Brazo extendido hacia arriba
    B: Brazo extendido hacia abajo
    C: Brazo extendido horizontalmente hacia afuera de la ventana
    D: Mover el brazo en movimiento circular
  answer: C
  explanation: Para señalar un giro a la izquierda mediante señales manuales en Alabama,
    el conductor debe extender el brazo izquierdo horizontalmente hacia afuera de
    la ventana.
- id: 87
  category: safe_driving_rules
  question: Según la ley de uso obligatorio del cinturón de seguridad de Alabama,
    ¿quién debe usar cinturón de seguridad en un automóvil de pasajeros?
  choices:
    A: Solo el conductor
    B: Solo el conductor y los pasajeros del asiento delantero
    C: Solo los pasajeros menores de 18 años
    D: Todos los ocupantes independientemente de su posición en el asiento
  answer: B
  explanation: 'La ley actual de Alabama exige que el conductor y todos los pasajeros
    del asiento delantero en un automóvil de pasajeros usen cinturón de seguridad.
    (Nota: Los niños deben estar debidamente sujetos en todas las posiciones de los
    asientos).'
- id: 88
  category: safe_driving_rules
  question: Al detenerse en un cruce de ferrocarril en Alabama, ¿a cuántos pies del
    riel más cercano debe detenerse un conductor?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Exactamente 20 pies
  answer: C
  explanation: La ley de Alabama exige que los conductores se detengan a una distancia
    de entre 15 y 50 pies del riel más cercano de un cruce de ferrocarril cuando las
    señales indican que se acerca un tren.
- id: 89
  category: defensive_driving
  question: Según el Manual del Conductor de Alabama, ¿cuál es la distancia de seguimiento
    recomendada detrás del vehículo que va delante de usted bajo condiciones de conducción
    ideales?
  choices:
    A: La longitud de un automóvil por cada 10 mph
    B: Una distancia de seguimiento de dos segundos
    C: Una distancia de seguimiento de cuatro segundos
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de Alabama recomienda la 'regla de los dos
    segundos' para mantener una distancia de seguimiento segura en condiciones ideales.
- id: 90
  category: defensive_driving
  question: En Alabama, ¿a qué velocidad puede comenzar el hidroplaneo (hydroplaning)
    cuando el agua en la carretera comienza a acumularse debajo de sus neumáticos?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Según el Manual del Conductor de Alabama, el hidroplaneo puede comenzar
    a velocidades tan bajas como 35 mph. A 55 mph, los neumáticos pueden perder todo
    contacto con la carretera.
- id: 91
  category: defensive_driving
  question: 'La ley de Alabama exige que los automovilistas enciendan sus faros delanteros
    siempre que utilicen sus:'
  choices:
    A: Limpiaparabrisas
    B: Luces de emergencia
    C: Aire acondicionado
    D: Control de crucero
  answer: A
  explanation: La ley de Alabama exige que los faros se enciendan cuando los limpiaparabrisas
    están en uso debido a la lluvia, el aguanieve o la nieve.
- id: 92
  category: defensive_driving
  question: Al conducir de noche en Alabama, ¿a cuántos pies de distancia de un vehículo
    que viene en sentido contrario debe bajar las luces altas?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Alabama exige que los conductores bajen las luces altas cuando
    un vehículo que viene en sentido contrario se encuentra a menos de 500 pies.
- id: 93
  category: defensive_driving
  question: 'En Alabama, debe bajar las luces altas cuando sigue a otro vehículo a
    una distancia de:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: La ley de Alabama exige que los conductores bajen las luces altas cuando
    siguen a otro vehículo a menos de 200 pies.
- id: 94
  category: defensive_driving
  question: 'Para evitar frenar a último momento o la necesidad de girar repentinamente,
    el Manual del Conductor de Alabama sugiere mirar hacia adelante al menos:'
  choices:
    A: 5 segundos
    B: 10 a 15 segundos
    C: 30 segundos
    D: Un minuto completo
  answer: B
  explanation: El manual recomienda observar la carretera de 10 a 15 segundos hacia
    adelante para anticipar peligros y el flujo del tráfico.
- id: 95
  category: defensive_driving
  question: Al conducir con niebla densa en Alabama, ¿cuál de los siguientes ajustes
    de faros es el más seguro de usar?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Sin luces
  answer: B
  explanation: Se deben usar las luces bajas en la niebla porque las luces altas se
    reflejan en la niebla y crean un resplandor, lo que dificulta la visión.
- id: 96
  category: defensive_driving
  question: 'Según la ley ''Move Over'' (Hacerse a un lado) de Alabama, si se aproxima
    a un vehículo de emergencia estacionado con luces intermitentes en una carretera
    de varios carriles, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril
    B: Acelerar para pasar el vehículo rápidamente
    C: Cambiarse a un carril que no sea adyacente al vehículo de emergencia, si es
      seguro hacerlo
    D: Mantener su velocidad y permanecer en su carril actual
  answer: C
  explanation: La ley 'Move Over' de Alabama exige que los conductores se muevan a
    un carril no adyacente o, si eso no es posible, reduzcan la velocidad a una velocidad
    de al menos 15 mph menos que el límite indicado.
- id: 97
  category: defensive_driving
  question: 'Si su vehículo comienza a derrapar en una carretera resbaladiza en Alabama,
    usted debe:'
  choices:
    A: Frenar a fondo inmediatamente
    B: Girar el volante en la dirección en la que desea que vaya la parte delantera
      del vehículo
    C: Girar el volante en la dirección opuesta al derrape
    D: Acelerar para recuperar la tracción
  answer: B
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que desea que vaya el vehículo.
- id: 98
  category: defensive_driving
  question: En Alabama, ¿cuándo es obligatorio tener encendidos los faros delanteros?
  choices:
    A: Solo entre la medianoche y las 5:00 AM
    B: Desde la puesta del sol hasta la salida del sol
    C: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    D: Solo cuando está lloviendo
  answer: C
  explanation: La ley de Alabama establece que los faros deben usarse desde media
    hora después de la puesta del sol hasta media hora antes de la salida del sol,
    o siempre que la visibilidad sea inferior a 500 pies.
- id: 99
  category: defensive_driving
  question: Si un conductor que viene en sentido contrario no baja sus luces altas,
    ¿qué debe hacer para evitar ser deslumbrado por el resplandor?
  choices:
    A: Encender sus luces altas para avisarle
    B: Mirar hacia el borde derecho de su carril
    C: Cerrar los ojos brevemente
    D: Mirar directamente a los faros que se aproximan
  answer: B
  explanation: Para evitar ser deslumbrado por el resplandor, mire hacia el borde
    derecho de su carril o hacia la línea blanca que marca el borde de la carretera.
- id: 100
  category: defensive_driving
  question: 'Al entrar en una curva, la práctica de conducción defensiva más segura
    es:'
  choices:
    A: Frenar fuerte mientras está en medio de la curva
    B: Reducir la velocidad antes de entrar en la curva
    C: Acelerar durante toda la curva
    D: Mantener su velocidad de carretera
  answer: B
  explanation: El Manual del Conductor de Alabama aconseja reducir la velocidad antes
    de entrar en una curva para poder mantener el control y acelerar ligeramente al
    salir.
- id: 101
  category: defensive_driving
  question: 'Si debe detenerse en una autopista de Alabama debido a una emergencia,
    su vehículo debe ser visible desde una distancia de al menos:'
  choices:
    A: 100 pies en cada dirección
    B: 200 pies en cada dirección
    C: 500 pies en cada dirección
    D: 1,000 pies en cada dirección
  answer: B
  explanation: La ley de Alabama exige que cualquier vehículo detenido en una autopista
    debe ser visible desde al menos 200 pies en ambas direcciones.
- id: 102
  category: defensive_driving
  question: ¿Según la ley de Alabama, cuándo deben los automovilistas encender sus
    faros delanteros en relación con el uso de los limpiaparabrisas?
  choices:
    A: Solo si la visibilidad es inferior a 100 pies
    B: Solo durante tormentas eléctricas fuertes
    C: Siempre que los limpiaparabrisas estén en uso debido a la lluvia, aguanieve
      o nieve
    D: Solo después del atardecer, independientemente del uso de los limpiaparabrisas
  answer: C
  explanation: La ley de Alabama exige que los faros delanteros se enciendan siempre
    que los limpiaparabrisas estén en uso debido a precipitaciones como lluvia, aguanieve
    o nieve.
- id: 103
  category: defensive_driving
  question: Al seguir a otro vehículo por la noche en Alabama, ¿a qué distancia debe
    bajar las luces altas para evitar deslumbrar al conductor de adelante?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 500 pies
  answer: B
  explanation: La ley de Alabama exige que los conductores bajen las luces altas cuando
    sigan a otro vehículo a una distancia de 200 pies o menos.
- id: 104
  category: defensive_driving
  question: 'Según el Manual del Conductor de Alabama, el hidroplaneo (hydroplaning)
    puede comenzar a velocidades tan bajas como:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El Manual del Conductor de Alabama establece que el hidroplaneo puede
    comenzar a velocidades tan bajas como 35 mph, y a 55 mph, los neumáticos pueden
    perder todo contacto con la carretera.
- id: 105
  category: defensive_driving
  question: Para practicar una conducción defensiva adecuada en Alabama, ¿con cuánta
    anticipación debe observar la carretera en busca de posibles peligros?
  choices:
    A: 5 a 8 segundos
    B: 12 a 15 segundos
    C: 20 a 30 segundos
    D: Solo el vehículo que está directamente delante de usted
  answer: B
  explanation: El Manual del Conductor de Alabama aconseja a los conductores mirar
    de 12 a 15 segundos hacia adelante para identificar posibles peligros con anticipación.
- id: 106
  category: defensive_driving
  question: La 'Ley de Moverse' (Move Over Law) de Alabama exige que los conductores
    se muevan a un carril no adyacente o reduzcan la velocidad al acercarse a ¿cuál
    de los siguientes vehículos detenidos a la orilla de la carretera con luces intermitentes?
  choices:
    A: Solo vehículos de ley y de emergencia
    B: Solo vehículos de ley, de emergencia y grúas
    C: Vehículos de ley, de emergencia, grúas y vehículos de servicios públicos
    D: Cualquier vehículo con las luces de emergencia encendidas
  answer: C
  explanation: La Ley de Moverse de Alabama incluye vehículos de ley, vehículos de
    emergencia, grúas y vehículos de servicios públicos (como camiones de basura o
    cuadrillas eléctricas) con luces intermitentes activadas.
- id: 107
  category: defensive_driving
  question: ¿Cuál es el límite de velocidad máximo no señalizado en un 'distrito urbano'
    en Alabama?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: En Alabama, el límite de velocidad legal en un distrito urbano es de
    30 mph, a menos que se indique lo contrario mediante señales.
- id: 108
  category: defensive_driving
  question: 'En Alabama, al acercarse a un cruce de ferrocarril con una señal de alto
    o semáforo, debe detener su vehículo a una distancia de:'
  choices:
    A: 5 a 25 pies del riel más cercano
    B: 10 a 40 pies del riel más cercano
    C: 15 a 50 pies del riel más cercano
    D: 20 a 60 pies del riel más cercano
  answer: C
  explanation: La ley de Alabama exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano en un cruce de ferrocarril cuando sea necesario detenerse.
- id: 109
  category: defensive_driving
  question: 'La ley de Alabama exige que los faros delanteros se enciendan si la visibilidad
    se reduce a menos de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 750 pies
    D: 1,000 pies
  answer: B
  explanation: Además de la regla de los limpiaparabrisas, la ley de Alabama exige
    el uso de faros delanteros cuando la visibilidad es inferior a 500 pies.
- id: 110
  category: alcohol_drugs_health
  question: Por una primera condena por DUI (conducir bajo la influencia) en Alabama,
    ¿cuál es el rango de la multa que se puede imponer (excluyendo los costos judiciales)?
  choices:
    A: Entre $100 y $500
    B: Entre $600 y $2,100
    C: Entre $1,100 y $5,100
    D: Exactamente $5,000
  answer: B
  explanation: En Alabama, una condena por DUI por primera vez conlleva una multa
    que oscila entre un mínimo de $600 y un máximo de $2,100.
- id: 111
  category: alcohol_drugs_health
  question: 'En Alabama, un dispositivo de interbloqueo de encendido es obligatorio
    para una primera condena por DUI si el BAC (concentración de alcohol en sangre)
    del conductor fue igual o superior a:'
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.15%
  answer: D
  explanation: La ley de Alabama exige la instalación de un dispositivo de interbloqueo
    de encendido para una primera condena por DUI si el conductor tenía un BAC de
    0.15% o superior, se negó a realizar la prueba o si un niño menor de 14 años estaba
    en el vehículo.
- id: 112
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por negarse por primera vez a someterse a una prueba
    química de aliento bajo la Ley de Consentimiento Implícito de Alabama?
  choices:
    A: Una suspensión de 30 días de los privilegios de conducir
    B: Una suspensión de 90 días de los privilegios de conducir
    C: Una suspensión de 180 días de los privilegios de conducir
    D: Revocación permanente de la licencia de conducir
  answer: B
  explanation: Si un conductor se niega a someterse a una prueba química por primera
    vez, el Director de Seguridad Pública suspenderá su licencia por 90 días.
- id: 113
  category: alcohol_drugs_health
  question: La "Ley de Contenedores Abiertos" de Alabama prohíbe la posesión de un
    recipiente de bebida alcohólica abierto en qué parte del vehículo?
  choices:
    A: Solo en el área del asiento del conductor
    B: Solo en el maletero
    C: En el área de pasajeros de cualquier vehículo motorizado en una carretera pública
    D: Solo si el vehículo está en movimiento
  answer: C
  explanation: La ley de Alabama prohíbe la posesión de un recipiente abierto de bebida
    alcohólica en el área de pasajeros de un vehículo motorizado ubicado en una carretera
    pública o en el derecho de paso de una carretera pública.
- id: 114
  category: alcohol_drugs_health
  question: ¿Cuál es la sentencia mínima obligatoria de cárcel por una segunda condena
    por DUI dentro de un periodo de 10 años en Alabama?
  choices:
    A: 24 horas
    B: 5 días
    C: 30 días
    D: 6 meses
  answer: B
  explanation: Para una segunda condena por DUI dentro de los 10 años, la ley de Alabama
    exige una sentencia de cárcel obligatoria de al menos 5 días o 30 días de servicio
    comunitario.
- id: 115
  category: alcohol_drugs_health
  question: En Alabama, ¿cuál es el límite legal de BAC para los conductores de vehículos
    motorizados comerciales?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: El límite legal de BAC para los titulares de una licencia de conducir
    comercial (CDL) que operan un vehículo comercial en Alabama es de 0.04%.
- id: 116
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados y necesita conducir, ¿cuál es la
    mejor forma de actuar según el Manual del Conductor de Alabama?
  choices:
    A: Conducir solo si se siente bien
    B: Consultar con su médico o farmacéutico sobre los efectos secundarios antes
      de conducir
    C: Beber café para contrarrestar los efectos del medicamento
    D: Conducir solo durante las horas del día
  answer: B
  explanation: Los medicamentos recetados y de venta libre pueden afectar la conducción.
    La ley de Alabama establece que usted puede ser condenado por DUI por estar bajo
    la influencia de cualquier sustancia que afecte su capacidad para conducir de
    manera segura.
- id: 117
  category: alcohol_drugs_health
  question: ¿Cuál es la tarifa específica de restablecimiento de una licencia de conducir
    de Alabama que fue suspendida o revocada debido a una infracción relacionada con
    drogas o alcohol?
  choices:
    A: $100
    B: $175
    C: $275
    D: $500
  answer: C
  explanation: Si bien la tarifa estándar de restablecimiento es más baja, Alabama
    cobra una tarifa de $275 para restablecer una licencia después de una condena
    relacionada con drogas o alcohol.
- id: 118
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la combinación
    de alcohol y otras drogas al conducir?
  choices:
    A: Los efectos del alcohol son anulados por las drogas
    B: La combinación puede multiplicar los efectos de ambos, aumentando significativamente
      el deterioro
    C: Es seguro siempre que ambos estén dentro de los límites legales
    D: Solo las drogas ilegales causan deterioro cuando se mezclan con alcohol
  answer: B
  explanation: Combinar alcohol con otras drogas (incluso las recetadas o de venta
    libre) puede producir un efecto sinérgico, lo que significa que el deterioro es
    mucho mayor que la suma de las partes.
- id: 119
  category: alcohol_drugs_health
  question: En Alabama, si tiene una condición médica como la epilepsia que causa
    pérdida del conocimiento, ¿cuánto tiempo debe pasar generalmente sin convulsiones
    antes de que se le pueda otorgar la licencia para conducir?
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 2 años
  answer: C
  explanation: Los estándares médicos de Alabama generalmente requieren que una persona
    con una condición que cause pérdida del conocimiento esté libre de convulsiones
    durante al menos 6 meses, con el respaldo de la recomendación de un médico, antes
    de conducir.
- id: 120
  category: alcohol_drugs_health
  question: 'Bajo la "Ley de Consentimiento Implícito" de Alabama, al operar un vehículo
    motorizado en carreteras públicas, se considera que usted ha dado su consentimiento
    para:'
  choices:
    A: Un registro del maletero de su vehículo en cualquier momento
    B: Una prueba química de su sangre, aliento u orina para detectar alcohol o drogas
    C: Un periodo obligatorio de renovación de la licencia de 12 meses
    D: La instalación de un dispositivo de seguimiento GPS por parte de la ALEA
  answer: B
  explanation: La Ley de Consentimiento Implícito de Alabama establece que se considerará
    que cualquier persona que opere un vehículo motorizado ha dado su consentimiento
    para una prueba química de su aliento, sangre u orina con el fin de determinar
    el contenido de alcohol en su sangre o la presencia de drogas.
- id: 121
  category: alcohol_drugs_health
  question: 'Si un conductor de Alabama se niega a someterse a una prueba química
    de aliento bajo la Ley de Consentimiento Implícito (Implied Consent Law) por primera
    vez, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Una primera negativa a una prueba química bajo la Ley de Consentimiento
    Implícito resulta en una suspensión obligatoria de la licencia de conducir por
    90 días.
- id: 122
  category: alcohol_drugs_health
  question: Si un conductor de Alabama es condenado por conducir bajo la influencia
    (DUI) y un niño menor de 14 años estaba en el vehículo en el momento de la infracción,
    ¿qué sucede con la sanción?
  choices:
    A: La multa se exonera si el conductor asiste a clases de paternidad
    B: El castigo mínimo obligatorio se duplica
    C: La licencia de conducir se revoca permanentemente en la primera infracción
    D: No hay una sanción adicional por tener a un niño en el auto
  answer: B
  explanation: Según la ley de Alabama, si una persona es condenada por DUI y un niño
    menor de 14 años estaba presente en el vehículo, la sentencia o castigo mínimo
    obligatorio se duplica.
- id: 123
  category: alcohol_drugs_health
  question: 'Una segunda condena por DUI dentro de un período de 10 años en Alabama
    requiere una sentencia de cárcel obligatoria de al menos:'
  choices:
    A: 24 horas
    B: 48 horas
    C: 10 días
    D: 30 días
  answer: B
  explanation: Una segunda condena por DUI dentro de un período de 10 años en Alabama
    conlleva un mínimo obligatorio de 48 horas de cárcel o 20 días de servicio comunitario.
- id: 124
  category: alcohol_drugs_health
  question: 'Un conductor de Alabama debe instalar un dispositivo de bloqueo de encendido
    (ignition interlock device) por una primera condena de DUI si su concentración
    de alcohol en sangre (BAC) era igual o superior a:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Para una primera infracción de DUI, un dispositivo de bloqueo de encendido
    es obligatorio si el BAC del conductor era de 0.15% o superior, o si se negó a
    la prueba, o si hubo un accidente con lesiones, o si había un niño en el auto.
- id: 125
  category: alcohol_drugs_health
  question: Con respecto a los medicamentos recetados y la conducción en Alabama,
    ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Es legal conducir siempre que el medicamento haya sido recetado por un médico
    B: Solo es ilegal si el medicamento es un opioide
    C: Usted puede ser condenado por DUI si un medicamento recetado afecta su capacidad
      para conducir de manera segura
    D: Los medicamentos recetados no afectan su capacidad de conducción
  answer: C
  explanation: Las leyes de DUI de Alabama se aplican a cualquier sustancia que afecte
    la conducción, incluidos los medicamentos recetados legales y los medicamentos
    de venta libre.
- id: 126
  category: alcohol_drugs_health
  question: 'Tras una tercera condena por DUI en Alabama, la licencia de conducir
    será revocada por un período de:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Una tercera condena por DUI dentro de un período de 10 años en Alabama
    resulta en una revocación obligatoria de la licencia de conducir por 3 años.
- id: 127
  category: alcohol_drugs_health
  question: 'Cuando el alcohol se combina con otra droga, el efecto en su capacidad
    para conducir suele ser:'
  choices:
    A: Reducido a la mitad
    B: El mismo que si solo fuera alcohol
    C: Mayor que la suma de los efectos de ambos (efecto sinérgico)
    D: Anulado por completo
  answer: C
  explanation: Combinar alcohol con otras drogas (incluso las de venta libre) crea
    un efecto sinérgico, lo que significa que el deterioro es mucho mayor que si se
    usara cualquiera de las dos por separado.
- id: 128
  category: alcohol_drugs_health
  question: 'Los conductores de Alabama que tengan una condición médica como la epilepsia
    que pueda afectar su conducción deben:'
  choices:
    A: Dejar de conducir para siempre de inmediato
    B: Notificar la condición a la División de Licencias de Conducir de ALEA
    C: Solo conducir durante las horas del día
    D: Solo conducir con un médico con licencia en el auto
  answer: B
  explanation: Los conductores están obligados a informar cualquier condición física
    o mental que pueda afectar su capacidad para operar un vehículo de manera segura
    a la División de Licencias de Conducir de ALEA.
- id: 129
  category: alcohol_drugs_health
  question: 'Además de las multas y la suspensión de la licencia, toda persona condenada
    por DUI en Alabama debe:'
  choices:
    A: Completar una escuela de DUI (Programa de Remisión Judicial)
    B: Realizar 500 horas de servicio comunitario
    C: Volver a tomar el examen de GED de la escuela secundaria
    D: Entregar su vehículo al estado
  answer: A
  explanation: Todas las personas condenadas por DUI en Alabama deben completar una
    escuela de DUI aprobada por el tribunal, conocida como el Programa de Remisión
    Judicial (Court Referral Program).
- id: 130
  category: penalties_and_points
  question: En Alabama, ¿cuántos puntos se asignan a su historial de conducción por
    exceso de velocidad de más de 26 millas por hora sobre el límite de velocidad
    establecido?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 5 puntos
    D: 6 puntos
  answer: C
  explanation: De acuerdo con el Sistema de Puntos de Alabama, el exceso de velocidad
    de 26 mph o más sobre el límite resulta en 5 puntos, mientras que el exceso de
    velocidad de 1 a 25 mph sobre el límite resulta en 2 puntos.
- id: 131
  category: penalties_and_points
  question: En Alabama, si un conductor acumula de 22 a 25 puntos en un período de
    dos años, ¿por cuánto tiempo se suspenderá su licencia?
  choices:
    A: 120 días
    B: 180 días
    C: 365 días
    D: 2 años
  answer: B
  explanation: El sistema de puntos de Alabama exige una suspensión de 180 días por
    acumular de 22 a 25 puntos. (12-14 puntos = 60 días; 15-17 puntos = 90 días; 18-21
    puntos = 120 días; 26+ puntos = 365 días).
- id: 132
  category: penalties_and_points
  question: 'La Ley de Seguro de Responsabilidad Obligatorio de Alabama requiere una
    cobertura mínima de:'
  choices:
    A: $10,000/$20,000/$5,000
    B: $20,000/$40,000/$10,000
    C: $25,000/$50,000/$25,000
    D: $50,000/$100,000/$50,000
  answer: C
  explanation: La ley de Alabama exige $25,000 por muerte o lesiones a una persona,
    $50,000 por muerte o lesiones a dos o más personas, y $25,000 por daños a la propiedad
    (25/50/25).
- id: 133
  category: penalties_and_points
  question: En Alabama, ¿una condena por 'Enviar mensajes de texto mientras conduce'
    resulta en cuántos puntos agregados al historial del conductor?
  choices:
    A: 0 puntos
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: La ley de Alabama prohíbe enviar mensajes de texto mientras se conduce.
    Una condena por esta infracción añade 2 puntos al historial del conductor, además
    de una multa.
- id: 134
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por 'No ceder el paso' en Alabama?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: Bajo el sistema de puntos de Alabama, no ceder el paso resulta en la
    adición de 3 puntos a su historial de manejo.
- id: 135
  category: penalties_and_points
  question: 'Si un conductor de Alabama es condenado por un segundo DUI (conducir
    bajo la influencia) dentro de un período de 10 años, su licencia será:'
  choices:
    A: Suspendida por 90 días
    B: Suspendida por 180 días
    C: Revocada por 1 año
    D: Revocada por 3 años
  answer: C
  explanation: Una segunda condena por DUI dentro de un período de 10 años en Alabama
    resulta en una revocación obligatoria de 1 año de la licencia de conducir.
- id: 136
  category: penalties_and_points
  question: En Alabama, ¿cuántos puntos se asignan por 'Realizar un giro indebido'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Realizar un giro indebido es una infracción de 2 puntos en el estado
    de Alabama.
- id: 137
  category: penalties_and_points
  question: En Alabama, ¿cuántos puntos se añaden a su historial de manejo por la
    infracción de 'Seguir demasiado de cerca'?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: El sistema de puntos de Alabama asigna 3 puntos al historial de un
    conductor por una condena de seguir demasiado de cerca (tailgating).
- id: 138
  category: penalties_and_points
  question: Si un conductor de Alabama acumula 24 puntos o más en un período de dos
    años, ¿cuál es la duración de la suspensión de la licencia?
  choices:
    A: 180 días
    B: 270 días
    C: 365 días
    D: Revocada permanentemente
  answer: C
  explanation: Acumular 24 puntos o más en un período de dos años en Alabama resulta
    en una suspensión de la licencia de 365 días (un año).
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la multa por una primera condena por violar la ley de Alabama
    contra el envío de mensajes de texto mientras se conduce?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: En Alabama, la multa por una primera infracción de enviar mensajes
    de texto mientras se conduce es de $25. Las infracciones posteriores son de $50
    y $75.
- id: 140
  category: penalties_and_points
  question: En Alabama, ¿cuál es el límite de concentración de alcohol en sangre (BAC)
    para los conductores de autobuses escolares o vehículos de guardería?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: La ley de Alabama establece un límite de BAC más estricto de 0.02%
    para los conductores de autobuses escolares y vehículos de guardería.
- id: 141
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su registro de conducir de Alabama por un
    "giro indebido"?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: A
  explanation: Una infracción por giro indebido resulta en la adición de 2 puntos
    al registro de un conductor de Alabama.
- id: 142
  category: penalties_and_points
  question: En Alabama, ¿cuántos puntos se asignan por no obedecer un dispositivo
    de control de tráfico (como pasarse un semáforo en rojo)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: No obedecer un dispositivo de control de tráfico, incluyendo señales
    de alto y semáforos en rojo, resulta en 3 puntos en Alabama.
- id: 143
  category: sharing_the_road
  question: Al rebasar una bicicleta que viaja en la misma dirección en Alabama, ¿cuál
    es la distancia mínima de seguridad que un automovilista debe mantener entre el
    vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: El Código de Alabama § 32-5A-122 (la "Ley de los 3 pies") exige que
    los automovilistas mantengan un espacio libre mínimo de tres pies al rebasar a
    un ciclista.
- id: 144
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es VERDADERA con respecto al uso
    del carril por parte de motocicletas en Alabama?
  choices:
    A: Se permite que las motocicletas pasen entre filas de autos detenidos (división
      de carril o "lane splitting")
    B: Una motocicleta tiene derecho al uso total de un carril
    C: Dos motocicletas no pueden circular una al lado de la otra en un solo carril
    D: Las motocicletas siempre deben circular por el acotamiento de la carretera
  answer: B
  explanation: En Alabama, las motocicletas tienen derecho al uso total de un carril
    de tráfico, y es ilegal que un vehículo motorizado sea conducido de manera que
    prive a una motocicleta de ese uso total.
- id: 145
  category: sharing_the_road
  question: 'Al conducir cerca de camiones comerciales grandes, la "Zona No" (No-Zone)
    se refiere a:'
  choices:
    A: El área donde no se permite circular a los camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: El área de carga designada para camiones
    D: La zona de velocidad restringida para vehículos pesados
  answer: B
  explanation: La "Zona No" representa los grandes puntos ciegos alrededor de un camión
    donde el conductor del camión no puede ver a otros vehículos. Si no puede ver
    la cara del conductor del camión en sus espejos laterales, usted se encuentra
    en una Zona No.
- id: 146
  category: sharing_the_road
  question: 'En Alabama, cuando un vehículo de emergencia con sirenas y luces intermitentes
    se aproxima por detrás, usted debe:'
  choices:
    A: Detenerse inmediatamente en su carril actual
    B: Acelerar para salir del camino
    C: Moverse hacia el borde derecho de la calzada y detenerse
    D: Moverse hacia la mediana izquierda y detenerse
  answer: C
  explanation: La ley de Alabama exige que los conductores cedan el paso a los vehículos
    de emergencia moviéndose lo más cerca posible del borde derecho o acotamiento
    de la carretera y deteniéndose hasta que el vehículo haya pasado.
- id: 147
  category: sharing_the_road
  question: 'Si ve a un peatón usando un bastón blanco o un perro guía en una intersección,
    la ley de Alabama le exige:'
  choices:
    A: Tocar la bocina para avisarle que usted está allí
    B: Reducir la velocidad y proceder con precaución
    C: Detenerse por completo y ceder el derecho de paso
    D: Rodearlo si hay suficiente espacio
  answer: C
  explanation: Los conductores deben detenerse por completo y tomar todas las precauciones
    necesarias para evitar lesiones a un peatón ciego que lleve un bastón blanco o
    use un perro guía.
- id: 148
  category: sharing_the_road
  question: En una carretera de dos carriles no dividida en Alabama, cuando un autobús
    escolar se detiene y activa sus luces rojas intermitentes y el brazo de parada,
    ¿quién debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que viene de frente al autobús
    C: El tráfico de ambas direcciones
    D: Nadie, si no hay niños visibles
  answer: C
  explanation: En cualquier carretera no dividida (de dos carriles o de varios carriles),
    el tráfico en ambas direcciones debe detenerse ante un autobús escolar que muestre
    sus luces rojas y el brazo de parada.
- id: 149
  category: sharing_the_road
  question: Según la ley de Alabama, ¿quién está obligado a usar un casco protector
    al viajar en una motocicleta?
  choices:
    A: Solo los conductores menores de 21 años
    B: Solo el operador de la motocicleta
    C: Todos los operadores y pasajeros
    D: Solo los conductores con menos de un año de experiencia
  answer: C
  explanation: La ley de Alabama exige que todos los operadores y pasajeros de motocicletas
    usen un casco protector aprobado legalmente.
- id: 150
  category: sharing_the_road
  question: 'Al andar en bicicleta por la noche en Alabama, la bicicleta debe estar
    equipada con una lámpara delantera que emita una luz blanca visible desde al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Alabama exige que las bicicletas utilizadas por la noche
    tengan una lámpara delantera visible desde al menos 500 pies y un reflector o
    lámpara trasera roja visible desde 100 a 600 pies.
- id: 151
  category: sharing_the_road
  question: 'Al seguir a un camión grande, debe aumentar su distancia de seguimiento
    a al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 a 5 segundos
    D: 10 segundos
  answer: C
  explanation: Debido a que los camiones son grandes y bloquean su visión del camino
    adelante, las pautas de seguridad de Alabama recomiendan una distancia de seguimiento
    de al menos 3 a 5 segundos para permitir una mejor visibilidad y tiempo de reacción.
- id: 152
  category: sharing_the_road
  question: ¿A cuál de los siguientes vehículos estacionarios con luces intermitentes
    activas se aplica la ley 'Move Over' (hacerse a un lado) de Alabama?
  choices:
    A: Solo a vehículos de las fuerzas del orden y del departamento de bomberos
    B: Solo a ambulancias y vehículos de servicios públicos
    C: Solo a grúas y vehículos de mantenimiento de carreteras
    D: A todos los anteriores
  answer: D
  explanation: La Ley Move Over de Alabama cubre a los vehículos de las fuerzas del
    orden, bomberos, servicios médicos de emergencia, vehículos de servicios públicos,
    grúas y vehículos de mantenimiento de carreteras.
- id: 153
  category: sharing_the_road
  question: 'En Alabama, si no hay señales de control de tráfico, un conductor debe
    ceder el paso a un peatón que cruza la calzada dentro de un paso de peatones cuando:'
  choices:
    A: El peatón se encuentra en la mitad de la calzada por la que circula el vehículo
    B: El peatón se aproxima tanto desde la mitad opuesta de la calzada que corre
      peligro
    C: Tanto A como B
    D: Solo si el peatón se encuentra en una zona escolar
  answer: C
  explanation: Los conductores deben ceder el paso a los peatones en los pasos de
    peatones si el peatón se encuentra en el lado de la carretera del conductor o
    si se aproxima lo suficientemente cerca desde el otro lado como para estar en
    peligro.
- id: 154
  category: sharing_the_road
  question: ¿Es legal que dos motocicletas circulen una al lado de la otra (en paralelo)
    en un solo carril en Alabama?
  choices:
    A: No, deben circular en formación escalonada
    B: Sí, pero no más de dos motocicletas pueden circular en paralelo
    C: Sí, pero solo en calles residenciales
    D: No, se considera conducción temeraria
  answer: B
  explanation: La ley de Alabama permite que las motocicletas circulen de dos en dos
    en un solo carril. Sin embargo, no pueden circular más de dos en paralelo.
- id: 155
  category: sharing_the_road
  question: 'En Alabama, una persona que monta una bicicleta en una calzada tiene:'
  choices:
    A: Los mismos derechos y deberes que el conductor de un vehículo motorizado
    B: La prioridad de paso sobre todos los vehículos motorizados
    C: El deber de circular en sentido contrario al flujo del tráfico
    D: Ningún derecho legal a estar en la calzada
  answer: A
  explanation: Según la ley de Alabama, toda persona que circule en bicicleta por
    una calzada tiene todos los derechos y está sujeta a todos los deberes aplicables
    al conductor de un vehículo.
- id: 156
  category: sharing_the_road
  question: En Alabama, si un peatón cruza la calle en un paso de peatones no marcado
    en una intersección, ¿quién tiene la prioridad de paso?
  choices:
    A: El automovilista, porque el paso de peatones no está marcado
    B: El peatón
    C: Quien haya llegado primero a la intersección
    D: El automovilista, pero solo si está girando a la derecha
  answer: B
  explanation: Según la ley de Alabama, los automovilistas deben ceder el paso a los
    peatones que cruzan la calzada dentro de cualquier paso de peatones marcado o
    no marcado en una intersección.
- id: 157
  category: sharing_the_road
  question: Los camiones comerciales grandes tienen 'No-Zones' (zonas prohibidas).
    ¿Dónde se encuentra el punto ciego más grande en un camión con remolque?
  choices:
    A: Directamente delante de la cabina
    B: Directamente detrás del remolque
    C: En el lado izquierdo de la cabina
    D: En el lado derecho del remolque
  answer: D
  explanation: Aunque los camiones tienen puntos ciegos en todos los lados, la 'No-Zone'
    del lado derecho es la más grande y peligrosa, extendiéndose a través de varios
    carriles.
- id: 158
  category: sharing_the_road
  question: 'En Alabama, los ciclistas están obligados por ley a:'
  choices:
    A: Circular por la acera en todo momento
    B: Circular en sentido contrario al flujo del tráfico (de frente a los coches)
    C: Circular con el flujo del tráfico (en la misma dirección que los coches)
    D: Circular únicamente por carriles para bicicletas designados
  answer: C
  explanation: En Alabama, las bicicletas se consideran vehículos cuando circulan
    por la calzada y deben viajar en la misma dirección que el tráfico de vehículos
    motorizados.
- id: 159
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a los cortejos fúnebres en las intersecciones
    en Alabama?
  choices:
    A: Los cortejos deben ceder el paso a todo el resto del tráfico
    B: Los cortejos tienen la prioridad de paso en las intersecciones independientemente
      de las señales de tráfico, siempre que el vehículo guía haya entrado legalmente
    C: Solo el vehículo guía tiene la prioridad de paso
    D: Los cortejos deben seguir todos los semáforos y señales de alto individualmente
  answer: B
  explanation: La ley de Alabama otorga a los cortejos fúnebres la prioridad de paso
    en las intersecciones. Una vez que el vehículo guía ha entrado legalmente en una
    intersección, los vehículos restantes del cortejo pueden continuar independientemente
    de las señales de tráfico, siempre que actúen con la debida precaución.
- id: 160
  category: sharing_the_road
  question: En Alabama, ¿pueden dos motocicletas compartir un solo carril de tráfico?
  choices:
    A: No, está estrictamente prohibido
    B: Sí, pero solo durante las horas del día
    C: Sí, las motocicletas tienen derecho al ancho total de un carril, pero dos pueden
      circular en paralelo en un solo carril
    D: Sí, pero solo si viajan a menos de 35 mph
  answer: C
  explanation: La ley de Alabama permite que dos motocicletas circulen en paralelo
    (una al lado de la otra) en un solo carril. Sin embargo, el 'lane splitting' (circular
    entre carriles de tráfico) es ilegal.
- id: 161
  category: sharing_the_road
  question: La ley de "Moverse al Carril de al Lado" (Move Over) de Alabama se amplió
    para incluir a cuál de los siguientes vehículos estacionados, además de las fuerzas
    del orden y el personal de respuesta a emergencias?
  choices:
    A: Vehículos de servicios públicos y camiones de basura
    B: Camiones de helados
    C: Jeeps de entrega de correo
    D: Autobuses escolares recogiendo estudiantes
  answer: A
  explanation: La Ley de Moverse al Carril de al Lado (Move Over Act) de Alabama incluye
    vehículos de las fuerzas del orden estacionados, vehículos de emergencia, grúas,
    vehículos de servicios públicos y camiones de basura/desechos que muestren luces
    intermitentes.
- id: 162
  category: sharing_the_road
  question: 'Al seguir a un camión grande por la noche, debe atenuar sus luces delanteras
    (cambiar a luces bajas) porque:'
  choices:
    A: Los espejos del camión reflejarán la luz brillante en los ojos del conductor
    B: Las luces altas pueden dañar la cinta reflectante del camión
    C: Los conductores de camiones tienen mejor visión nocturna y no necesitan la
      luz extra
    D: La ley exige usar solo las luces de estacionamiento al seguir camiones
  answer: A
  explanation: Las luces brillantes que se reflejan en los grandes espejos laterales
    de un camión pueden cegar al conductor. Siempre debe atenuar sus luces delanteras
    al seguir a cualquier vehículo, especialmente a los camiones grandes.
- id: 163
  category: sharing_the_road
  question: 'Si no hay aceras disponibles, la ley de Alabama exige que los peatones
    caminen:'
  choices:
    A: En el lado derecho de la carretera con el flujo del tráfico
    B: En el lado izquierdo de la carretera de frente al tráfico que viene en sentido
      contrario
    C: En el centro del carril para ser más visibles
    D: Solo durante las horas del día
  answer: B
  explanation: Cuando no se proporcionan aceras, los peatones deben caminar por el
    lado izquierdo del arcén o de la calzada, de frente al tráfico que se aproxima.
- id: 164
  category: sharing_the_road
  question: En Alabama, ¿de qué color son las luces de "advertencia" que activa un
    autobús escolar antes de detenerse para subir o bajar niños?
  choices:
    A: Azul
    B: Verde
    C: Ámbar (Amarillo)
    D: Blanco
  answer: C
  explanation: Los autobuses escolares de Alabama utilizan luces intermitentes de
    color ámbar (amarillo) para alertar a los automovilistas que el autobús se está
    preparando para detenerse. Las luces rojas intermitentes y el brazo de parada
    indican que el autobús se ha detenido y los niños están subiendo o bajando.
- id: 165
  category: vehicle_information
  question: Según la ley de Alabama, ¿cuándo debe encender las luces delanteras en
    relación con las condiciones climáticas?
  choices:
    A: Solo cuando está oscuro afuera
    B: Siempre que sus limpiaparabrisas estén en uso debido a la lluvia, el aguanieve
      o la nieve
    C: Solo durante niebla densa
    D: Solo cuando se conduce por autopistas interestatales
  answer: B
  explanation: La ley de Alabama exige que los automovilistas enciendan sus luces
    delanteras siempre que los limpiaparabrisas estén en uso debido al clima inclemente.
- id: 166
  category: vehicle_information
  question: Para cumplir con los estándares de seguridad de Alabama, ¿el freno de
    pie debe ser capaz de detener el vehículo a qué distancia cuando se viaja a 20
    mph?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 45 pies
  answer: C
  explanation: Las regulaciones de equipamiento de vehículos de Alabama establecen
    que el freno de servicio (de pie) debe poder detener el automóvil en un tramo
    de 30 pies a una velocidad de 20 mph.
- id: 167
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo de pasajeros en Alabama?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: En Alabama, los neumáticos se consideran inseguros si tienen menos
    de 2/32 de pulgada de profundidad en la banda de rodadura.
- id: 168
  category: vehicle_information
  question: 'La ley de Alabama exige que todo vehículo de motor tenga un espejo retrovisor
    que refleje una vista de la carretera por una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo de motor debe estar equipado con un espejo ubicado de
    tal manera que refleje al conductor una vista de la carretera por una distancia
    de al menos 200 pies hacia atrás.
- id: 169
  category: vehicle_information
  question: 'Según la ley de Alabama, la bocina de un vehículo debe ser audible en
    condiciones normales desde una distancia no menor a:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: El Código de Alabama exige que todo vehículo de motor esté equipado
    con una bocina en buen estado de funcionamiento, capaz de emitir un sonido audible
    en condiciones normales desde una distancia no menor a 200 pies.
- id: 170
  category: vehicle_information
  question: ¿Cuál es el tintado de ventanas máximo legal (porcentaje de transmisión
    de luz) permitido en las ventanas laterales de un automóvil de pasajeros en Alabama?
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: C
  explanation: La ley de Alabama (Acta 96-534) especifica que el tintado de las ventanas
    debe permitir al menos un 32% de transmisión de luz, más o menos un 3%.
- id: 171
  category: vehicle_information
  question: 'En Alabama, la placa de matrícula trasera debe estar iluminada de modo
    que sea claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley de Alabama exige que una luz blanca ilumine la placa de matrícula
    trasera para que sea claramente legible desde una distancia de 50 pies hacia atrás.
- id: 172
  category: vehicle_information
  question: ¿Qué modificación del sistema de escape prohíbe la ley de Alabama?
  choices:
    A: Puntas de acero inoxidable
    B: Recortes de silenciador (muffler cutouts) o derivaciones (bypasses)
    C: Tubos de escape dobles
    D: Cromado
  answer: B
  explanation: La ley de Alabama exige que todo vehículo de motor tenga un silenciador
    en buen estado de funcionamiento y prohíbe el uso de recortes de silenciador,
    derivaciones o dispositivos similares.
- id: 173
  category: vehicle_information
  question: ¿Entre qué horas es legalmente obligatorio el uso de los faros delanteros
    en Alabama, independientemente del clima?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: Una hora después de la puesta del sol hasta una hora antes de la salida del
      sol
    C: 30 minutos después de la puesta del sol hasta 30 minutos antes de la salida
      del sol
    D: De 6:00 PM a 6:00 AM
  answer: C
  explanation: La ley de Alabama exige que los faros se enciendan desde media hora
    (30 minutos) después de la puesta del sol hasta media hora (30 minutos) antes
    de la salida del sol.
- id: 174
  category: vehicle_information
  question: En Alabama, ¿las señales de giro deben ser visibles desde una distancia
    de al menos cuántos pies hacia adelante y hacia atrás?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Las señales de giro mecánicas deben ser visibles tanto hacia adelante
    como hacia atrás desde una distancia de al menos 100 pies.
- id: 175
  category: vehicle_information
  question: 'Todo vehículo de motor en Alabama debe estar equipado con al menos una
    luz trasera que emita una luz roja visible desde una distancia de:'
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Alabama exige que las luces traseras sean visibles desde
    una distancia de 500 pies hacia atrás.
- id: 176
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el freno de estacionamiento
    de un vehículo en Alabama?
  choices:
    A: Debe ser operado únicamente por un pedal de pie
    B: Debe ser capaz de mantener el vehículo en cualquier pendiente en la que se
      opere
    C: Solo es obligatorio en vehículos con transmisión manual
    D: Debe ser capaz de detener el vehículo desde 60 mph
  answer: B
  explanation: La ley de Alabama exige un sistema de freno de estacionamiento adecuado
    para mantener el vehículo en cualquier pendiente en la que se opere, bajo todas
    las condiciones de carga.
- id: 177
  category: vehicle_information
  question: 'En Alabama, los faros deben encenderse desde media hora después de la
    puesta del sol hasta media hora antes de la salida del sol y en cualquier otro
    momento en que la visibilidad sea inferior a:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Alabama establece que los faros deben usarse cuando la visibilidad
    es inferior a 500 pies debido a luz insuficiente o condiciones atmosféricas desfavorables.
- id: 178
  category: vehicle_information
  question: La ley de Alabama exige que todo vehículo de motor tenga un espejo retrovisor
    que permita al conductor ver la carretera durante al menos ¿cuántos pies hacia
    atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Todo vehículo de motor en Alabama debe estar equipado con un espejo
    ubicado de tal manera que refleje al conductor una vista de la carretera por una
    distancia de al menos 200 pies hacia atrás.
- id: 179
  category: vehicle_information
  question: 'En Alabama, todo vehículo de motor debe estar equipado con una bocina
    que pueda escucharse en condiciones normales desde una distancia de al menos:'
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: La ley de Alabama exige una bocina en buen estado de funcionamiento
    capaz de emitir un sonido audible en condiciones normales desde una distancia
    no inferior a 200 pies.
- id: 180
  category: vehicle_information
  question: 'De acuerdo con la ley de tintado de ventanas de Alabama, la transmisión
    de luz para las ventanas laterales delanteras de un automóvil de pasajeros debe
    ser de al menos:'
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: C
  explanation: La ley de Alabama (Ley 96-534) especifica que el tintado de las ventanas
    laterales delanteras debe permitir al menos un 32% de transmisión de luz (más
    o menos un 3% de tolerancia).
- id: 181
  category: vehicle_information
  question: 'La ley de Alabama exige que una luz blanca ilumine la placa de matrícula
    trasera, haciéndola claramente legible desde una distancia de:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La placa de matrícula trasera debe estar iluminada por una luz blanca
    para que sea claramente legible desde una distancia de 50 pies hacia atrás.
- id: 182
  category: vehicle_information
  question: En Alabama, ¿las luces direccionales deben ser visibles desde una distancia
    no menor a cuántos pies bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: Las luces direccionales deben ser visibles desde una distancia no menor
    a 100 pies tanto hacia adelante como hacia atrás bajo la luz solar normal.
- id: 183
  category: vehicle_information
  question: En Alabama, si una carga se extiende más de cuántos pies más allá de la
    parte trasera de un vehículo, ¿se debe colocar una bandera roja (día) o una luz
    roja (noche) al final de la carga?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: C
  explanation: La ley de Alabama exige una bandera roja de al menos 12 pulgadas cuadradas
    durante el día, o una luz roja por la noche, si una carga se extiende más de 4
    pies más allá de la parte trasera de la carrocería del vehículo.
- id: 184
  category: vehicle_information
  question: 'En Alabama, los neumáticos se consideran inseguros y no cumplen con los
    requisitos legales si la profundidad de la banda de rodadura es inferior a:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 1/16 de pulgada
  answer: B
  explanation: Los neumáticos se consideran legalmente inseguros en Alabama si están
    desgastados hasta el punto en que queda menos de 2/32 de pulgada de banda de rodadura.
- id: 185
  category: vehicle_information
  question: 'La ley de Alabama exige que el freno de estacionamiento de cada vehículo
    motorizado debe ser capaz de detener el vehículo:'
  choices:
    A: Solo en terreno llano
    B: En cualquier pendiente (colina) en la que se opere
    C: Solo cuando el vehículo tiene una marcha puesta
    D: Solo por un máximo de 10 minutos
  answer: B
  explanation: El freno de estacionamiento debe ser adecuado para detener el vehículo
    en cualquier pendiente en la que se opere, bajo todas las condiciones de carga,
    sobre una superficie libre de nieve, hielo o material suelto.
- id: 186
  category: signs_and_signals
  question: En Alabama, cuando un conductor extiende su brazo izquierdo por la ventana
    y lo dobla hacia arriba por el codo, ¿qué señal está dando?
  choices:
    A: Giro a la izquierda
    B: Giro a la derecha
    C: Detenerse o disminuir la velocidad
    D: Giro en U
  answer: B
  explanation: Según el Manual del Conductor de Alabama, la señal manual para un giro
    a la derecha es el brazo izquierdo extendido por la ventana y doblado hacia arriba
    por el codo.
- id: 187
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico amarilla intermitente en una intersección
    de Alabama?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección
    C: Proceder con precaución
    D: Ceder el paso a todo el tráfico y luego detenerse
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución, tal como se describe en el Manual del Conductor de
    Alabama.
- id: 188
  category: signs_and_signals
  question: Según la ley de Alabama, ¿cuál es la sanción específica por exceso de
    velocidad en una zona de construcción señalizada cuando hay trabajadores presentes?
  choices:
    A: Una multa fija de $500
    B: Suspensión obligatoria de la licencia por 30 días
    C: Las multas se duplican
    D: Ninguna sanción adicional a menos que ocurra un accidente
  answer: C
  explanation: El Código de Alabama § 32-5A-171 establece que las multas por infracciones
    de exceso de velocidad se duplican cuando la infracción ocurre en una zona de
    construcción donde hay trabajadores presentes.
- id: 189
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo isósceles que apunta a la derecha)
    que se encuentra en el lado izquierdo de la carretera en Alabama indica:'
  choices:
    A: Una zona escolar más adelante
    B: Una zona de no rebasar
    C: Un requisito de ceder el paso
    D: Un callejón sin salida
  answer: B
  explanation: La señal en forma de banderín se utiliza específicamente para marcar
    el inicio de una zona de no rebasar y se coloca en el lado izquierdo de la carretera.
- id: 190
  category: signs_and_signals
  question: En Alabama, ¿qué significan las líneas amarillas sólidas dobles en el
    centro de la calzada?
  choices:
    A: Se permite rebasar desde cualquier lado
    B: Se permite rebasar solo por la derecha
    C: Está prohibido rebasar en ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas sólidas dobles indican que no se permite rebasar
    para el tráfico que circula en cualquier dirección.
- id: 191
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal rectangular horizontal con fondo
    verde en Alabama?
  choices:
    A: Advertencia de peligros adelante
    B: Instrucciones reglamentarias como límites de velocidad
    C: Información de guía, como direcciones o distancias
    D: Servicios para automovilistas como combustible o alojamiento
  answer: C
  explanation: Las señales rectangulares verdes son señales de guía que proporcionan
    información de dirección y distancia a los conductores.
- id: 192
  category: signs_and_signals
  question: Cuando ve una señal amarilla circular con una 'X' negra y las letras 'RR',
    ¿qué debe esperar adelante?
  choices:
    A: Un área de descanso
    B: Un cruce de ferrocarril
    C: Una zona de reparación de carreteras
    D: Una rotonda
  answer: B
  explanation: La señal amarilla redonda con una 'X' negra y 'RR' es la señal de advertencia
    anticipada de un cruce de ferrocarril.
- id: 193
  category: signs_and_signals
  question: En Alabama, si se aproxima a un autobús escolar con sus luces rojas intermitentes
    y el brazo de parada extendido en una carretera sin mediana ni barrera, ¿quién
    debe detenerse?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que viene de frente al autobús
    C: El tráfico en ambas direcciones
    D: Nadie, si hay al menos cuatro carriles
  answer: C
  explanation: La ley de Alabama exige que el tráfico en ambas direcciones se detenga
    ante un autobús escolar con luces rojas intermitentes en cualquier carretera no
    dividida.
- id: 194
  category: signs_and_signals
  question: ¿Qué representa una línea blanca continua pintada a través de un carril
    en una intersección en Alabama?
  choices:
    A: Un cruce de peatones únicamente
    B: Una línea de parada, que indica dónde detenerse ante una señal o semáforo
    C: Un divisor de carril para el tráfico que gira
    D: Un límite de estacionamiento
  answer: B
  explanation: Una línea blanca continua a través de un carril es una línea de parada,
    que muestra a los conductores el punto exacto donde deben detenerse ante una señal
    de alto o un semáforo.
- id: 195
  category: signs_and_signals
  question: 'En Alabama, una señal en forma de diamante con fondo naranja se utiliza
    para indicar:'
  choices:
    A: Advertencias generales
    B: Zonas escolares
    C: Áreas de construcción o mantenimiento
    D: Áreas de recreación pública
  answer: C
  explanation: Las señales anaranjadas en forma de diamante se utilizan específicamente
    para advertencias de construcción y mantenimiento.
- id: 196
  category: signs_and_signals
  question: Cuando un semáforo muestra una luz roja fija y una flecha verde apuntando
    a la izquierda, ¿qué significa para un conductor en Alabama?
  choices:
    A: Debe detenerse y esperar a un círculo verde
    B: Puede girar a la izquierda, ya que es un giro protegido
    C: Puede girar a la izquierda solo después de ceder el paso al tráfico que viene
      en sentido contrario
    D: La flecha verde es una advertencia de que la luz está a punto de ponerse roja
  answer: B
  explanation: Una flecha verde significa que tiene un giro protegido en la dirección
    de la flecha, incluso si la señal principal está en rojo.
- id: 197
  category: signs_and_signals
  question: ¿Cuál es la forma estándar de una señal de 'Ceda el paso' (Yield) en Alabama?
  choices:
    A: Círculo
    B: Diamante
    C: Triángulo equilátero apuntando hacia abajo
    D: Pentágono
  answer: C
  explanation: La señal de ceda el paso es un triángulo equilátero con la punta hacia
    abajo, generalmente de color rojo y blanco.
- id: 198
  category: signs_and_signals
  question: En Alabama, ¿qué indican las líneas blancas discontinuas en el pavimento?
  choices:
    A: Tráfico moviéndose en direcciones opuestas; prohibido rebasar
    B: Tráfico moviéndose en la misma dirección; se permite rebasar
    C: El borde de la calzada
    D: Un carril para vehículos de alta ocupación (HOV)
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección e indican que se permiten los cambios de carril.
- id: 199
  category: signs_and_signals
  question: Según el Manual del Conductor de Alabama, ¿qué indica una señal de tráfico
    azul?
  choices:
    A: Información reglamentaria
    B: Información de construcción
    C: Servicios para automovilistas (gasolina, comida, alojamiento)
    D: Guía direccional hacia ciudades
  answer: C
  explanation: Las señales azules se utilizan para proporcionar información sobre
    servicios para automovilistas, como hospitales, gasolina, comida y alojamiento.
- id: 200
  category: signs_and_signals
  question: 'Al acercarse a una luz de tráfico roja intermitente en Alabama, un conductor
    debe:'
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo y proceder solo cuando sea seguro
    C: Ceder el paso únicamente al tráfico de la derecha
    D: Tratarla como una luz amarilla
  answer: B
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de alto; debe detenerse por completo y avanzar cuando el camino esté despejado.
- id: 201
  category: signs_and_signals
  question: ¿Qué significa una luz de semáforo amarilla intermitente en Alabama?
  choices:
    A: Detenerse y esperar a que la luz cambie a verde
    B: Acelerar para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: Detenerse por completo y ceder el paso a todo el tráfico transversal
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y estar especialmente alerta mientras avanza por la intersección con precaución.
- id: 202
  category: signs_and_signals
  question: Si ve una línea amarilla continua en su lado de la línea central discontinua,
    ¿qué indica según la ley de Alabama?
  choices:
    A: Se encuentra en una zona de adelantamiento
    B: Se encuentra en una zona de no adelantar
    C: La carretera es de un solo sentido
    D: Debe girar a la derecha en la próxima intersección
  answer: B
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que se encuentra en una zona de no adelantar y es ilegal rebasar a otros vehículos.
- id: 203
  category: signs_and_signals
  question: En Alabama, ¿cuál es el significado de una señal en forma de banderín
    (pennant) ubicada en el lado izquierdo de la carretera?
  choices:
    A: Zona escolar más adelante
    B: Ceda el paso al tráfico que viene en sentido contrario
    C: Zona de no adelantar (No-Passing Zone)
    D: Cruce de ferrocarril más adelante
  answer: C
  explanation: Una señal en forma de banderín es única porque se coloca en el lado
    izquierdo de la carretera para marcar el inicio de una zona de no adelantar.
- id: 204
  category: signs_and_signals
  question: ¿Qué indica una señal circular amarilla con una 'X' negra grande y las
    letras 'RR'?
  choices:
    A: Una zona de construcción vial
    B: Una intersección de ruta rural
    C: Un cruce de ferrocarril más adelante
    D: Una calzada restringida
  answer: C
  explanation: La señal amarilla redonda con una 'X' negra y 'RR' es una señal de
    advertencia circular que indica que hay un cruce de ferrocarril más adelante.
- id: 205
  category: signs_and_signals
  question: ¿Qué señal manual debe usar un conductor en Alabama para indicar que está
    reduciendo la velocidad o deteniéndose?
  choices:
    A: Brazo izquierdo extendido hacia arriba
    B: Brazo izquierdo extendido hacia afuera
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho saludando por la ventana
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad, el conductor
    debe extender el brazo izquierdo hacia abajo con la palma de la mano hacia atrás.
- id: 206
  category: signs_and_signals
  question: 'En Alabama, una X amarilla fija sobre un carril de tráfico significa:'
  choices:
    A: El carril es solo para giros a la izquierda
    B: Debe prepararse para abandonar el carril porque la señal está a punto de cambiar
      a una X roja
    C: El carril está abierto para todo el tráfico
    D: Solo para vehículos de emergencia
  answer: B
  explanation: Una X amarilla fija en las señales de control de carril indica que
    el conductor debe salir de ese carril de manera segura porque la señal está a
    punto de cambiar a una X roja (carril cerrado).
- id: 207
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de una señal de 'aspa' (crossbuck) en
    un cruce de ferrocarril?
  choices:
    A: Indicarle el límite de velocidad del tren
    B: Indicar el número de vías
    C: Servir como señal de alto para todos los vehículos
    D: Marcar la ubicación de las vías y exigirle que ceda el paso
  answer: D
  explanation: La señal de aspa (crossbuck) es una señal reglamentaria que marca la
    ubicación de las vías. Los conductores deben tratarla como una señal de ceda el
    paso y detenerse si se aproxima un tren.
- id: 208
  category: signs_and_signals
  question: 'Una señal triangular naranja con un borde rojo que se encuentra en la
    parte trasera de un vehículo indica:'
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo es un vehículo de movimiento lento (que viaja a 25 mph o menos)
    C: El vehículo es una carga de gran tamaño
    D: El vehículo es un conductor estudiante
  answer: B
  explanation: Este emblema específico es el símbolo de Vehículo de Movimiento Lento
    (SMV), requerido para vehículos diseñados para viajar a velocidades de 25 mph
    o menos.
- id: 209
  category: signs_and_signals
  question: ¿Qué significa una flecha verde que se muestra simultáneamente con una
    luz roja en Alabama?
  choices:
    A: Debe esperar a que la luz roja cambie a verde antes de girar
    B: Puede proceder con precaución en la dirección de la flecha, cediendo el paso
      a peatones y otro tráfico
    C: La señal está averiada; debe detenerse y esperar a un oficial de policía
    D: Usted tiene el derecho de paso y no necesita ceder el paso a nadie
  answer: B
  explanation: Una flecha verde significa que tiene un giro 'protegido'. Puede proceder
    en la dirección de la flecha, pero aún debe ceder el paso a cualquier peatón o
    vehículo que ya esté en la intersección.
- id: 210
  category: signs_and_signals
  question: En Alabama, ¿de qué color son las 'Señales de Servicio' que brindan información
    sobre gasolina, comida y alojamiento?
  choices:
    A: Verde
    B: Marrón
    C: Azul
    D: Amarillo
  answer: C
  explanation: Las señales de servicio, que dirigen a los automovilistas hacia instalaciones
    como hospitales, gasolineras y hoteles, son azules con letras blancas.
- id: 211
  category: signs_and_signals
  question: ¿Qué tipo de señal es típicamente un letrero rectangular vertical con
    fondo blanco y letras negras?
  choices:
    A: Señal de advertencia
    B: Señal reglamentaria
    C: Señal de guía
    D: Señal de gestión de incidentes
  answer: B
  explanation: Las señales rectangulares verticales con texto negro sobre fondo blanco
    son señales reglamentarias, como las de límite de velocidad, que informan a los
    conductores sobre las leyes y reglamentos.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y continuar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 212
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 213
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico en sentido contrario.
  id: 214
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 215
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 216
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 217
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 218
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 219
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico en ambos sentidos más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 220
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que deben hacer los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 221
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 222
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 223
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 224
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 225
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 226
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 227
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 228
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa giro a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 229
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que la carretera gire
    primero en un sentido y luego en el otro.
  id: 230
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte sobre una serie de curvas o
    giros más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 231
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Esté preparado para
    ajustar su velocidad y posición.
  id: 232
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Esté preparado para una reducción en el ancho de la carretera y
    ajuste su posición en el carril.
  id: 233
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 234
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    en ambos sentidos.
  id: 235
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: Tráfico en ambos sentidos más adelante — el tráfico se mueve en ambas direcciones
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico en ambos sentidos más adelante. Puede
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 236
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 237
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente empinada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente empinada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 238
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (Pare) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 239
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (Pare) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (Pare) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 240
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 241
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 242
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de incorporarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 243
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Detenerse o permanecer con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) roja y blanca significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 244
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que muestren un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 245
