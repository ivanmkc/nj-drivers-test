metadata:
  source: Alabama Driver Manual (alea.gov)
  total_questions: 292
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_responsibility
  question: What happens to your medical care if you are in an accident and are a
    registered organ donor?
  choices:
    A: Doctors will prioritize organ preservation over saving your life.
    B: The number one priority is to save your life.
    C: You will be transferred to a special organ donor hospital.
    D: Your family must pay for your emergency medical care.
  answer: B
  explanation: 'The manual states that it is a myth that becoming a donor affects
    medical care. The fact is: ''If you are admitted to a hospital, the number one
    priority is to save your life.'''
- id: 2
  category: license_system
  question: What symbol will appear on your Alabama driver license if you choose to
    be an organ donor?
  choices:
    A: A green ribbon
    B: A red cross
    C: A red heart
    D: A blue star
  answer: C
  explanation: According to the manual, 'The title "organ donor" with a red heart
    will appear on your license.'
- id: 3
  category: driver_responsibility
  question: According to the manual, approximately how often is someone added to the
    national organ transplant waiting list?
  choices:
    A: Every minute
    B: Every 10 minutes
    C: Every hour
    D: Every day
  answer: B
  explanation: The manual states that 'Someone is added to the list every ten minutes,
    and approximately 18 people will die each day while waiting for an organ.'
- id: 4
  category: driver_responsibility
  question: If you agree to donate your organs, what is the financial cost to your
    family or estate for the donation?
  choices:
    A: A flat fee of $500
    B: The cost of the removal operation
    C: Half of the funeral costs
    D: There is no financial cost for organ or tissue donation
  answer: D
  explanation: 'The manual clarifies a common myth by stating: ''There is no financial
    cost to the donor’s family or estate for organ or tissue donation.'''
- id: 5
  category: license_system
  question: Which agency issues driver licenses in Alabama?
  choices:
    A: Department of Transportation
    B: Alabama Law Enforcement Agency, Driver License Services
    C: Department of Motor Vehicles
    D: Highway Safety Office
  answer: B
  explanation: Chapter 1 of the manual states, 'The Alabama Law Enforcement Agency,
    Driver License Services, issues driver licenses.'
- id: 6
  category: driver_testing
  question: An applicant whose Alabama driver license has been expired for over how
    many years must pass the required driver examination?
  choices:
    A: One year
    B: Two years
    C: Three years
    D: Five years
  answer: C
  explanation: The manual states, 'All applicants who have not been licensed in Alabama
    or whose Alabama license has been expired for over three years must pass the required
    driver examination.'
- id: 7
  category: driver_testing
  question: If you hold a valid out-of-state driver license that has not been expired
    for over one year, what are you exempt from when applying for an Alabama license?
  choices:
    A: Paying the license fee
    B: Passing a driver examination
    C: The vision screening
    D: Providing identification
  answer: B
  explanation: According to the manual, 'A holder of an out of state license which
    has not been expired over one year does not have to pass a driver examination.'
- id: 8
  category: license_system
  question: Which of the following vehicles may be operated temporarily on an Alabama
    highway without a driver license?
  choices:
    A: A commercial delivery truck
    B: A farm tractor
    C: A motorcycle
    D: A recreational vehicle (RV)
  answer: B
  explanation: The manual lists exemptions to the driver license requirement, including
    'Any person while driving any farm tractor or implement of husbandry temporarily
    operated or moved on the highway.'
- id: 9
  category: license_system
  question: Do military personnel from other states stationed in Alabama need to obtain
    an Alabama driver license?
  choices:
    A: Yes, within 30 days of arriving in Alabama.
    B: Yes, unless they live on a military base.
    C: No, as long as they are at least 16 and have a valid driver license from their
      home state.
    D: No, military personnel are completely exempt from needing any driver license.
  answer: C
  explanation: An Alabama driver license is not required for 'A resident at least
    16 years old who has in his immediate possession a valid driver license issued
    to him in his home state or country. This includes military personnel from other
    states and their families stationed in Alabama...'
- id: 10
  category: license_system
  question: A non-resident who has a valid driver license from their previous state
    of residence may drive without an Alabama license for how many days after becoming
    an Alabama resident?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: The manual states that 'A non-resident who has a valid driver license
    from the state of previous residence may drive without an Alabama license for
    30 days after becoming a resident of the state.'
- id: 11
  category: license_system
  question: A non-resident at least 16 years old from a country that does not require
    licensing may drive in Alabama for up to how many days in a calendar year?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: C
  explanation: The manual states that a non-resident from a country without licensing
    requirements may operate a motor vehicle 'for not more than 90 days in any calendar
    year, if the vehicle operated is duly registered for the current year in the home
    country...'
- id: 12
  category: license_system
  question: Which of the following non-residents is permitted to drive in Alabama
    without an Alabama driver license?
  choices:
    A: A part-time student with no home state license
    B: A full-time student properly enrolled in an Alabama school who holds a valid
      license from their home state
    C: A tourist who has been in the state for 120 days
    D: A person whose out-of-state license was recently suspended
  answer: B
  explanation: An Alabama license is not required for 'Any non-resident full time
    student properly enrolled and registered in a school, college, university, or
    trade school in this state, who holds a valid license from his home state or country.'
- id: 13
  category: license_system
  question: Under Alabama law, a driver license shall NOT be issued to any person
    under what age?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 18 years of age
  answer: C
  explanation: The 'Who Cannot Be Licensed' section explicitly states that an Alabama
    driver license shall not be issued to 'Persons under 16 years of age.'
- id: 14
  category: license_system
  question: Can you obtain an Alabama driver license if your driving privilege is
    suspended or revoked in another state?
  choices:
    A: Yes, if the suspension was for a minor offense.
    B: Yes, after paying an out-of-state transfer fee.
    C: No, a license shall not be issued to anyone whose driving rights are suspended
      or revoked in any state.
    D: No, unless you pass the Alabama road test again.
  answer: C
  explanation: The manual states that an Alabama driver license shall not be issued
    to 'Any person whose driving rights or privilege is suspended or revoked in any
    state.'
- id: 15
  category: license_system
  question: 'An Alabama driver license will not be issued to a person if they have
    a physical or mental impairment that:'
  choices:
    A: Requires them to wear glasses while driving.
    B: Prevents them from safely operating a motor vehicle in the opinion of the ALEA
      or examining officer.
    C: Requires them to drive an automatic transmission vehicle.
    D: Prevents them from passing a physical fitness test.
  answer: B
  explanation: A license shall not be issued to 'Any person afflicted with or suffering
    from a physical or mental impairment which, in the opinion of the ALEA or examining
    officer, will prevent [them from safely operating a motor vehicle].'
- id: 16
  category: license_system
  question: According to Alabama law, a person under the age of 19 cannot be licensed
    if they are not in compliance with which requirement?
  choices:
    A: Voter registration
    B: Secondary school graduation or current attendance
    C: Selective Service registration
    D: Employment verification
  answer: B
  explanation: An Alabama driver license shall not be issued to any person under the
    age of 19 that is not in compliance with Alabama Act 93-368, which requires secondary
    school graduation or current attendance.
- id: 17
  category: license_system
  question: If an applicant for an Alabama Driver License presents exactly two forms
    of identification, what must be true about these documents?
  choices:
    A: Both documents must contain a photograph.
    B: At least one must contain a photograph and one must be from the 'Primary Listing'.
    C: Both documents must be from the 'Secondary Listing'.
    D: Neither is required to have a photograph if they are notarized.
  answer: B
  explanation: Applicants must present two forms of identification, at least one of
    which contains a photograph, and one form must be from the 'Primary Listing'.
- id: 18
  category: license_system
  question: What documentation must an applicant transferring an out-of-state driver
    license present?
  choices:
    A: Their out-of-state license, Social Security card, and one other form from the
      'Primary Listing'
    B: Only their out-of-state license and a birth certificate
    C: Three forms of non-photo identification
    D: Their out-of-state license and a high school diploma
  answer: A
  explanation: Applicants transferring an Out of State driver license must present
    their Out of State driver license, Social Security card (or acceptable document)
    AND one other form from the 'Primary Listing'.
- id: 19
  category: license_system
  question: Which of the following would make a document unacceptable for proving
    identification?
  choices:
    A: It is an original document.
    B: It is a copy certified by the issuing agency.
    C: Correction fluid (white-out) has been used on pertinent information.
    D: It is printed on colored paper.
  answer: C
  explanation: A document would be unacceptable if correction fluid (white-out) has
    been used on pertinent information, among other alterations or damages.
- id: 20
  category: license_system
  question: Which of the following is an acceptable document to prove your Social
    Security Number?
  choices:
    A: A utility bill with your name on it
    B: A W2 Tax Form
    C: A library card
    D: A current lease agreement
  answer: B
  explanation: An original W2 Tax Form is listed as one of the acceptable documents
    required as proof of a Social Security number.
- id: 21
  category: license_system
  question: 'For a notarized document to be accepted, the notary''s commission expiration
    date must be:'
  choices:
    A: Within the next 30 days
    B: Legible and current on the date the document was notarized
    C: Valid for at least one year from the date of application
    D: Left blank
  answer: B
  explanation: Notarized documents must meet several requirements, including that
    the complete date the notary's commission expires must be legible and must have
    been current on the date the document was notarized.
- id: 22
  category: license_system
  question: How much allowable time remaining in the United States must immigration
    documents reflect to be acceptable?
  choices:
    A: At least 30 days
    B: At least 60 days
    C: At least 90 days
    D: At least 160 days
  answer: D
  explanation: Immigration documents must reflect at least 160 days allowable time
    remaining in the United States.
- id: 23
  category: license_system
  question: All applicants under the age of 19 must present which of the following
    forms?
  choices:
    A: A current Student Enrollment/Exclusion Form (DL-1-93)
    B: A signed parental consent waiver
    C: A medical clearance form
    D: A proof of employment form
  answer: A
  explanation: All applicants under the age of 19 must present a current Student Enrollment/Exclusion
    Form (DL-1-93) completed and signed by authorized personnel.
- id: 24
  category: license_system
  question: What specific document is required for all 15-year-old applicants to prove
    their date of birth?
  choices:
    A: A school ID with photo
    B: A Certified U.S. Birth Certificate issued by a designated agency
    C: A Social Security Card
    D: A W2 Tax Form
  answer: B
  explanation: A Certified U.S. Birth Certificate issued by an agency designated by
    state or federal authority is required for all 15-year-old applicants under Title
    36-6-8(b).
- id: 25
  category: driver_testing
  question: How are driver license written examinations administered to hearing impaired
    applicants?
  choices:
    A: Through a live interpreter provided by the applicant
    B: Using automated testing equipment in American Sign Language
    C: By reading a braille version of the test
    D: By watching a closed-captioned video
  answer: B
  explanation: Written examinations can be administered to the hearing impaired in
    American Sign Language using automated testing equipment at certain Driver License
    offices.
- id: 26
  category: driver_testing
  question: Who is eligible to take an Oral Examination for their driver's license?
  choices:
    A: Any applicant who prefers speaking over writing
    B: Applicants who are unable to read and comprehend the knowledge tests
    C: Only applicants transferring an out-of-state license
    D: Only applicants under the age of 16
  answer: B
  explanation: Oral Examinations are available for applicants that are unable to read
    and comprehend the knowledge tests.
- id: 27
  category: license_system
  question: At what age may a person obtain a restricted Learner License in Alabama?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: Any person 15 years of age may obtain a restricted Learner License
    for the purpose of learning to safely and effectively operate a motor vehicle.
- id: 28
  category: safe_driving_rules
  question: 'The ''Y'' restriction on a Class D Alabama driver license indicates that
    the holder may operate a motor vehicle only while accompanied by a person who
    is at least:'
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: The 'Y' restriction indicates that the holder may operate a motor vehicle
    while accompanied by a person who is 21 years old.
- id: 29
  category: license_system
  question: Which of the following is considered a 'Primary Document' for identification
    purposes?
  choices:
    A: Marriage License
    B: Current U.S. Passport
    C: Medical Insurance ID Card
    D: Selective Service Card
  answer: B
  explanation: A current US Passport is listed under 'PRIMARY DOCUMENTS', whereas
    Marriage Licenses, Medical Insurance ID Cards, and Selective Service Cards are
    'SECONDARY DOCUMENTS'.
- id: 30
  category: license_system
  question: If an applicant has been previously deported from the United States, what
    additional documentation must they present?
  choices:
    A: A letter of recommendation from a U.S. citizen
    B: Proof from Immigration and Customs Enforcement (ICE) that their legal presence
      status has been restored
    C: A valid foreign driver's license
    D: A certificate of naturalization
  answer: B
  explanation: An applicant who has been deported from the United States must present
    proof from the Immigration and Customs Enforcement (ICE) that their legal presence
    status has been restored.
- id: 31
  category: license_system
  question: What does a 'Y' restriction on a Class D Alabama driver license indicate?
  choices:
    A: The holder must wear corrective lenses while driving.
    B: The holder may operate a motor driven cycle only.
    C: The holder may operate a motor vehicle with a licensed driver occupying the
      seat beside them.
    D: The holder is restricted to driving during daylight hours only.
  answer: C
  explanation: According to the manual, the 'Y' restriction indicates that the holder
    may operate a motor vehicle with a licensed driver occupying the seat beside the
    driver.
- id: 32
  category: license_system
  question: How long must a person who is 16 but under 18 years of age hold a Learner
    License before they can take the road test for a regular driver license?
  choices:
    A: 3 months
    B: 6 months or until their 18th birthday
    C: 9 months
    D: 12 months
  answer: B
  explanation: The manual states that a person 16 but under 18 years of age must have
    held a Learner License for six months or until their 18th birthday before taking
    the road test.
- id: 33
  category: vehicle_information
  question: A 14 or 15-year-old may obtain a restricted license to operate a motor
    driven cycle that does not exceed what weight and engine displacement?
  choices:
    A: 200 pounds and 150cc
    B: 250 pounds and 200cc
    C: 300 pounds and 250cc
    D: 150 pounds and 100cc
  answer: A
  explanation: The manual states that a 14 or 15-year-old may obtain a restricted
    license to operate a motor driven cycle weighing not more than 200 pounds, nor
    exceeding 150cc engine displacement.
- id: 34
  category: license_system
  question: What restriction is placed on a Class M Alabama driver license issued
    to a 14 or 15-year-old for a motor driven cycle?
  choices:
    A: A 'Y' restriction
    B: A 'B' restriction
    C: An 'M' restriction
    D: An 'A' restriction
  answer: B
  explanation: Upon passing the required examination, a 14 or 15-year-old applicant
    will be issued a Class M Alabama driver license with a 'B' restriction, indicating
    they may operate a motor driven cycle only.
- id: 35
  category: license_system
  question: At what age may a person obtain an Alabama vessel license upon passing
    the required examination?
  choices:
    A: 10 years of age or older
    B: 12 years of age or older
    C: 14 years of age or older
    D: 16 years of age or older
  answer: B
  explanation: The manual specifies that any person 12 years of age or older may obtain
    a vessel license upon passing the required vessel examination.
- id: 36
  category: driver_testing
  question: What is the fee for taking the driver license knowledge test in Alabama?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: The fee for each knowledge test is $5.00, and no checks are accepted.
- id: 37
  category: driver_testing
  question: Who must accompany a 16-year-old applicant when they take the road test?
  choices:
    A: A licensed driving instructor
    B: Any licensed driver over 21
    C: A parent or guardian
    D: No one is required to accompany them
  answer: C
  explanation: The manual states that sixteen-year-old applicants must be accompanied
    by a parent or guardian for the road test.
- id: 38
  category: driver_testing
  question: Does a 17-year-old applicant need to be accompanied by a parent or guardian
    for the road test?
  choices:
    A: Yes, all applicants under 18 require a parent or guardian.
    B: Yes, unless they have completed driver's education.
    C: No, a 17-year-old applicant doesn't have to be accompanied by a parent or guardian.
    D: No, but they must be accompanied by a licensed driving instructor.
  answer: C
  explanation: According to the manual, a seventeen-year-old applicant doesn't have
    to be accompanied by a parent or guardian for the road test.
- id: 39
  category: driver_testing
  question: Which of the following will cause an immediate failure and termination
    of the road test?
  choices:
    A: Asking the examiner to repeat an instruction
    B: A dangerous action
    C: Parking slightly crooked
    D: Driving a vehicle with a manual transmission
  answer: B
  explanation: Causes for immediate failure and termination of the road test include
    a violation of a traffic law, a dangerous action, any preventable accident, or
    a lack of cooperation/refusal to perform a maneuver.
- id: 40
  category: driver_testing
  question: Who is permitted to ride in the vehicle as a passenger during your road
    test?
  choices:
    A: A parent or guardian
    B: A licensed driving instructor
    C: A friend or sibling
    D: No passengers or pets are permitted
  answer: D
  explanation: The manual explicitly states that no passengers or pets are permitted
    in the vehicle during the road test.
- id: 41
  category: driver_responsibility
  question: What may happen if you operate a motor vehicle in violation of the restrictions
    imposed on your driver license?
  choices:
    A: You will be required to retake the knowledge test.
    B: You will receive a warning letter.
    C: It may result in the loss of your license.
    D: Your vehicle will be permanently confiscated.
  answer: C
  explanation: The manual states that operation of a motor vehicle in violation of
    restrictions may result in the loss of your license.
- id: 42
  category: driver_testing
  question: Which of the following is required equipment for the vehicle used during
    the road test?
  choices:
    A: A backup camera
    B: Two separate methods of applying brakes
    C: A GPS navigation system
    D: Custom window tinting
  answer: B
  explanation: The equipment required for the examination includes a rear view mirror,
    horn, windshield wipers, two separate methods of applying brakes, muffler, headlights,
    rear tail lights, valid license plate, stop light, directional signals, and seat
    belts.
- id: 43
  category: license_system
  question: How does the Alabama driver manual define a motorcycle?
  choices:
    A: A motor vehicle with four wheels and a saddle
    B: A motor vehicle having a seat or saddle, designed to travel on not more than
      three wheels, excluding a tractor
    C: Any two-wheeled vehicle weighing over 500 pounds
    D: A motorized bicycle with an engine displacement under 50cc
  answer: B
  explanation: A motorcycle is defined as a motor vehicle having a seat or saddle
    for the use of the rider and designed to travel on not more than three wheels
    in contact with the ground but excluding a tractor.
- id: 44
  category: driver_testing
  question: What happens if you do not pass the vision examination when applying for
    a license?
  choices:
    A: You are permanently disqualified from driving in Alabama.
    B: You must take the road test during daylight hours only.
    C: You will be required to have your eyes examined by a licensed eye specialist
      and return the report.
    D: You must pay an additional fee to retake the vision test immediately.
  answer: C
  explanation: If you don't pass your vision examination, you will be required to
    have your eyes examined by a licensed eye specialist and return the report to
    the examiner.
- id: 45
  category: driver_testing
  question: What should you do to indicate to the examiner that you are aware of conditions
    around you while backing the vehicle during the road test?
  choices:
    A: Look exclusively at the backup camera screen
    B: Honk the horn three times
    C: Turn your head and look over your right shoulder
    D: Turn on your hazard lights
  answer: C
  explanation: During the test, you should turn your head when you observe traffic
    and look over your right shoulder while backing to indicate to the examiner you
    are aware of conditions around you.
- id: 46
  category: license_system
  question: What is the minimum age requirement to obtain a Vessel License in Alabama?
  choices:
    A: 12 years old
    B: 14 years old
    C: 15 years old
    D: 16 years old
  answer: A
  explanation: According to the manual's minimum age requirements table, you must
    be at least 12 years old to obtain a Vessel License.
- id: 47
  category: driver_testing
  question: When arriving for your road test, what is required regarding the vehicle
    you bring?
  choices:
    A: It must be a dual-control training vehicle.
    B: It must be driven to the test by a licensed driver.
    C: It must be rented from a certified driving school.
    D: It must have a gross vehicle weight under 10,000 pounds.
  answer: B
  explanation: Unless you already have a legal right to drive, you must come for the
    road test in a vehicle driven by a licensed driver who must remain to drive it
    away if you fail.
- id: 48
  category: license_system
  question: How long is the grace period during which your Alabama driver license
    remains valid after its expiration date?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: C
  explanation: Alabama law provides a grace period of 60 days after the expiration
    date of a driver license for renewal purposes, and the license remains valid for
    this time period.
- id: 49
  category: driver_responsibility
  question: How many days do you have to notify the License Services Division after
    changing your address within Alabama?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: After changing your address within Alabama, you have 30 days in which
    to notify the License Services Division of the new address.
- id: 50
  category: license_system
  question: Which class of license is generally required for all standard passenger
    vehicles?
  choices:
    A: Class A
    B: Class C
    C: Class D
    D: Class M
  answer: C
  explanation: A Class D license is required for generally all passenger vehicles,
    except vehicles in Classes A, B, C, or M.
- id: 51
  category: penalties_and_points
  question: What criminal charges may apply if a person makes a false affidavit to
    obtain a duplicate driver license?
  choices:
    A: Embezzlement
    B: Forgery, Perjury, or both
    C: Identity theft only
    D: Traffic violation only
  answer: B
  explanation: Any person making a false affidavit in obtaining a duplicate driver
    license may be charged with Forgery, Perjury, or both under the Criminal Code
    of Alabama.
- id: 52
  category: license_system
  question: How long is an Alabama driver license valid before it expires?
  choices:
    A: Two years after it is issued
    B: Four years after it is issued
    C: Five years after it is issued
    D: Eight years after it is issued
  answer: B
  explanation: Your driver license expires four years after it is issued, and the
    expiration date is shown on the license.
- id: 53
  category: driver_testing
  question: What is the fee for taking the Class D Operator knowledge test?
  choices:
    A: $5.00
    B: $25.00
    C: $31.25
    D: $36.25
  answer: A
  explanation: According to the Knowledge Test Fees schedule, the fee for a Class
    D Operator knowledge test is $5.00.
- id: 54
  category: license_system
  question: A Class A Commercial Driver License (CDL) is required for combination
    vehicles with a Gross Combination Weight Rating (GCWR) exceeding 26,000 pounds,
    provided the towed vehicle exceeds what weight?
  choices:
    A: 5,000 pounds
    B: 10,000 pounds
    C: 15,000 pounds
    D: 26,000 pounds
  answer: B
  explanation: Class A applies to combination vehicles with a GCWR exceeding 26,000
    pounds, provided the Gross Vehicle Weight Rating (GVWR) of the vehicle being towed
    exceeds 10,000 pounds.
- id: 55
  category: license_system
  question: A Class C Commercial Driver License is required for vehicles weighing
    26,000 lbs or less if they are placarded for hazardous materials or designed to
    seat more than how many people?
  choices:
    A: 10 people including the driver
    B: 12 people including the driver
    C: 15 people including the driver
    D: 20 people including the driver
  answer: C
  explanation: Class C licenses are for vehicles weighing 26,000 lbs GVWR or less
    that are placarded for hazardous materials or designed to seat more than 15 people
    including the driver.
- id: 56
  category: alcohol_drugs_health
  question: If it appears you have a physical or mental impairment affecting your
    driving, what may you be required to furnish to the state?
  choices:
    A: A new road test fee
    B: A statement from a doctor showing your medical history and present condition
    C: A certificate of completion from a defensive driving course
    D: A signed affidavit from an immediate family member
  answer: B
  explanation: You may be required to furnish a statement from a doctor showing your
    medical history and present condition as it pertains to your driving ability if
    you have a physical or mental impairment.
- id: 57
  category: license_system
  question: Up to how many years after its expiration date can an Alabama driver license
    be renewed without taking an examination?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 4 years
  answer: C
  explanation: An Alabama driver license may be renewed without examination within
    a 3-year period after expiration, though it is illegal to operate a vehicle with
    an expired license.
- id: 58
  category: license_system
  question: What is the minimum age requirement to obtain an Alabama Non-Driver Identification
    Card?
  choices:
    A: There is no age requirement
    B: 12 years old
    C: 14 years old
    D: 15 years old
  answer: A
  explanation: According to the minimum age requirements table in the manual, there
    is 'No Age Requirement' for an Identification Card.
- id: 59
  category: license_system
  question: While you can renew your license online or at a kiosk, what action requires
    you to see a driver license examiner in person?
  choices:
    A: Paying the renewal fee
    B: Updating your digital license on a smartphone
    C: Adding or removing license classes, restrictions, and endorsements
    D: Requesting a duplicate license after losing the original
  answer: C
  explanation: The manual states that to change your address or to add or remove license
    classes, restrictions, and endorsements, you must see a driver license examiner.
- id: 60
  category: license_system
  question: What is the Gross Vehicle Weight Rating (GVWR) criteria for a single vehicle
    to require a Class B commercial driver license?
  choices:
    A: Exceeds 10,000 pounds
    B: Exceeds 16,000 pounds
    C: Exceeds 26,000 pounds
    D: Exceeds 32,000 pounds
  answer: C
  explanation: According to the manual, Class B includes single or combination vehicles
    where the GVWR of the single vehicle exceeds 26,000 pounds.
- id: 61
  category: license_system
  question: Which CDL endorsement is required to operate a vehicle with double or
    triple trailers?
  choices:
    A: Endorsement T
    B: Endorsement X
    C: Endorsement H
    D: Endorsement N
  answer: A
  explanation: The manual states that Endorsement T is required for double/triple
    trailers.
- id: 62
  category: license_system
  question: At what age may a licensed vessel operator operate a motorized watercraft
    alone, if they were born after January 1, 2002?
  choices:
    A: 12 years old
    B: 14 years old
    C: 16 years old
    D: 21 years old
  answer: B
  explanation: The Boating Safety Enhancement Act mandates that a licensed operator,
    14 years old or older, may operate alone.
- id: 63
  category: driver_responsibility
  question: When operating a motor vehicle in Alabama, when must you present your
    driver license to a law enforcement officer?
  choices:
    A: Only if you are involved in a crash
    B: Only if you are issued a traffic citation
    C: Upon his or her request
    D: Only at official state border checkpoints
  answer: C
  explanation: In Alabama, a driver must be prepared to present their driver license
    to any law enforcement officer upon his or her request.
- id: 64
  category: penalties_and_points
  question: What is the minimum reinstatement fee for a person whose driver license
    has been canceled, suspended, revoked, or disqualified?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: D
  explanation: Any person whose driver license has been canceled, suspended, revoked,
    or disqualified must pay a reinstatement fee of not less than $100.
- id: 65
  category: penalties_and_points
  question: If your license reinstatement is the result of a drug-related conviction,
    what is the additional fee required?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: A
  explanation: The manual states that reinstatement resulting from drug related convictions
    require an additional $25 fee.
- id: 66
  category: penalties_and_points
  question: Which of the following offenses requires the Director to revoke your driver
    license?
  choices:
    A: Racing on the highways
    B: Fleeing or attempting to elude a police officer
    C: Three reckless driving convictions within 12 months
    D: Failure to maintain SR-22 insurance
  answer: C
  explanation: The Director must revoke your license upon receiving a record of your
    conviction for three reckless driving convictions within 12 months. The other
    choices are grounds for suspension.
- id: 67
  category: penalties_and_points
  question: Your driver license may be suspended if you are ages 15 through 18 and
    do which of the following?
  choices:
    A: Receive one speeding ticket
    B: Withdraw from school under certain conditions prior to graduation
    C: Drive between midnight and 6 AM
    D: Fail to pass a vision test
  answer: B
  explanation: Your driver license may be suspended if you are ages 15 through 18
    and withdraw from school under certain conditions prior to graduation.
- id: 68
  category: penalties_and_points
  question: How many points are assessed against your driving record for Reckless
    Driving or Reckless Endangerment involving a motor vehicle?
  choices:
    A: 2 Points
    B: 4 Points
    C: 5 Points
    D: 6 Points
  answer: D
  explanation: According to the Alabama Point System, Reckless Driving or Reckless
    Endangerment involving operating a motor vehicle results in 6 points.
- id: 69
  category: penalties_and_points
  question: Passing a stopped school bus will result in how many points being added
    to your driving record?
  choices:
    A: 3 Points
    B: 4 Points
    C: 5 Points
    D: 6 Points
  answer: C
  explanation: The Alabama Point System assigns 5 points for Passing Stopped School
    Bus.
- id: 70
  category: penalties_and_points
  question: How many points are assessed for speeding 26 mph or more over the speed
    limit?
  choices:
    A: 2 Points
    B: 3 Points
    C: 4 Points
    D: 5 Points
  answer: D
  explanation: Speeding 26 mph or More Over Speed Limit results in 5 points being
    assessed against your driving record.
- id: 71
  category: penalties_and_points
  question: Which of the following violations results in exactly 2 points being assessed
    to your driving record?
  choices:
    A: Following too closely
    B: Failure to yield right of way
    C: Improper lane violation
    D: Wrong side of road/illegal passing
  answer: C
  explanation: An Improper Lane Violation is a 2-point offense. Following too closely
    is 3 points, failure to yield is 5 points, and wrong side of road is 4 points.
- id: 72
  category: penalties_and_points
  question: According to the Alabama point system schedule, how long will your license
    be suspended if you accumulate 15-17 points in a 2-year period?
  choices:
    A: 60 days
    B: 90 days
    C: 120 days
    D: 180 days
  answer: B
  explanation: The suspension schedule states that accumulating 15-17 points in a
    2-year period results in a 90-day suspension.
- id: 73
  category: penalties_and_points
  question: Accumulating 24 or more points in a 2-year period will result in a license
    suspension of what duration?
  choices:
    A: 90 days
    B: 120 days
    C: 180 days
    D: 365 days
  answer: D
  explanation: According to the point system schedule, 24 and above points in a 2-year
    period results in a 365-day suspension.
- id: 74
  category: license_system
  question: Persons born before what date are exempt from the vessel license examination,
    but must still have the vessel class issued?
  choices:
    A: January 1, 2002
    B: April 28, 1954
    C: January 1, 1994
    D: April 28, 1984
  answer: B
  explanation: The manual states that persons born before April 28, 1954 are exempt
    from examination but are required to go to their driver license office to have
    vessel class issued.
- id: 75
  category: penalties_and_points
  question: How many points are added to your driving record for making an improper
    turn?
  choices:
    A: 2 Points
    B: 3 Points
    C: 4 Points
    D: 6 Points
  answer: A
  explanation: According to the manual, making an improper turn results in 2 points
    being added to your driving record.
- id: 76
  category: penalties_and_points
  question: If a driver accumulates 18-20 points in a 2-year period, how long will
    their driver license be suspended?
  choices:
    A: 60 days
    B: 90 days
    C: 120 days
    D: 180 days
  answer: C
  explanation: The suspension schedule states that accumulating 18-20 points in a
    2-year period results in a 120-day suspension.
- id: 77
  category: vehicle_information
  question: What must you do before turning the ignition key if you are driving a
    vehicle equipped with a manual transmission?
  choices:
    A: Depress the brake pedal only
    B: Push in the clutch
    C: Shift into drive
    D: Turn on the parking lights
  answer: B
  explanation: If you are driving a hand-shift vehicle equipped with a manual transmission,
    you must push in the clutch before turning the ignition key.
- id: 78
  category: safe_driving_rules
  question: When starting from a parallel parking place, what should you do before
    pulling into traffic?
  choices:
    A: Honk your horn to warn approaching vehicles
    B: Look over your shoulder and in rear view mirrors
    C: Pull out quickly to merge with the flow of traffic
    D: Turn on your hazard lights
  answer: B
  explanation: In preparing to leave a parallel parking spot, look over your shoulder
    as well as in rear view mirrors and wait until the way is clear before pulling
    into traffic.
- id: 79
  category: safe_driving_rules
  question: What is the minimum distance you must signal your intentions before making
    a turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You must signal your intentions at least 100 feet before making the
    turn.
- id: 80
  category: safe_driving_rules
  question: Why is it recommended to use hand and arm signals in addition to signal
    lights during the daytime?
  choices:
    A: It is required by state law for all turns
    B: Signal lights are automatically disabled during daylight hours
    C: Reflection of bright sunlight may make it difficult for other motorists to
      see flashing signal lights
    D: Hand signals are the only legal way to signal a turn
  answer: C
  explanation: During the daytime, hand and arm signals may be used in addition to
    signal lights because the reflection of bright sunlight may make it difficult
    for other motorists to see your flashing signal light.
- id: 81
  category: safe_driving_rules
  question: When making a left turn from a four-lane or divided highway, which lane
    should you turn from?
  choices:
    A: The far right lane
    B: The lane nearest the center line or traffic divider
    C: The shoulder of the road
    D: Any lane as long as you signal
  answer: B
  explanation: For a left turn, move to the lane nearest the center line or traffic
    divider and turn from the inside lane.
- id: 82
  category: safe_driving_rules
  question: Where are three-point turns NOT permitted?
  choices:
    A: On residential streets
    B: In empty parking lots
    C: On curves or near the top of hills where you cannot be seen within 500 feet
    D: On any two-lane roadway
  answer: C
  explanation: Three-point turns are not permitted on interstate freeways, on curves,
    or near the top of hills where you cannot be seen by drivers of other vehicles
    approaching from either direction within 500 feet.
- id: 83
  category: safe_driving_rules
  question: What is the proper technique for driving through a curve?
  choices:
    A: Accelerate before entering the curve and brake while rounding it
    B: Maintain a constant high speed throughout the curve
    C: Slow down before entering the curve and accelerate slightly when actually rounding
      it
    D: Coast through the curve with the vehicle in neutral
  answer: C
  explanation: A driver should enter a curve slow enough to enable him to accelerate
    slightly when actually rounding the curve.
- id: 84
  category: sharing_the_road
  question: Under Alabama law, what is the minimum distance a motor vehicle must maintain
    when passing a person on a bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 6 feet
  answer: B
  explanation: Alabama state law requires that you pass a person on a bicycle with
    a distance of not less than three feet between your motor vehicle and the person
    on a bicycle.
- id: 85
  category: sharing_the_road
  question: While bicyclists must generally ride as close as practicable to the right
    curb, under which situation are they allowed to move away from it?
  choices:
    A: When they want to ride side-by-side with three other bicycles
    B: When reasonably necessary to avoid road hazards like debris or opening car
      doors
    C: When they are traveling faster than the speed limit
    D: When they are riding on a sidewalk
  answer: B
  explanation: Bicyclists must ride as close to the right curb as practicable except
    when reasonably necessary to avoid road or traffic conditions such as debris,
    opening of car doors, pedestrians, etc.
- id: 86
  category: sharing_the_road
  question: What does Alabama law state regarding bicycles on sidewalks?
  choices:
    A: Bicycles must use the sidewalk if the speed limit is over 35 mph
    B: Bicycles are allowed on sidewalks if they yield to pedestrians
    C: It is illegal for people on bicycles to ride on the sidewalk
    D: Only bicycles with training wheels may use the sidewalk
  answer: C
  explanation: In Alabama, it is illegal for people on bicycles to ride on the sidewalk.
- id: 87
  category: sharing_the_road
  question: At what age are people on bicycles required to wear a securely fastened
    protective helmet in Alabama?
  choices:
    A: Under the age of 12 years
    B: Under the age of 16 years
    C: Under the age of 18 years
    D: All ages are required to wear a helmet
  answer: B
  explanation: People on bicycles who are under the age of 16 years are required to
    wear a securely fastened protective helmet when riding on public roadways.
- id: 88
  category: sharing_the_road
  question: If a motor vehicle driver needs to turn across an established bicycle
    lane, what should they do?
  choices:
    A: Turn from the main traffic lane and cut across the bicycle lane quickly
    B: Honk to clear the bicycle lane before turning
    C: Drive into the bicycle lane prior to making the turn, ensuring it does not
      encroach upon a bicyclist's safety
    D: Stop in the main traffic lane and wait for the bicycle lane to be completely
      empty for 500 feet
  answer: C
  explanation: When turning across a bicycle lane, the driver shall drive the motor
    vehicle into the bicycle lane prior to making the turn and shall make the turn
    so long as such preparation for a turn shall not encroach upon the safety of the
    person on the bicycle.
- id: 89
  category: penalties_and_points
  question: How many days will your license be suspended if you accumulate 24 or more
    points in a 2-year period?
  choices:
    A: 90 days
    B: 120 days
    C: 180 days
    D: 365 days
  answer: D
  explanation: According to the point schedule, accumulating 24 and above points in
    a 2-year period results in a 365-day suspension.
- id: 90
  category: sharing_the_road
  question: What should you do if the road is narrow and you are unable to safely
    pass a person on a bicycle?
  choices:
    A: Blast your horn to warn them to move over
    B: Pass them closely at a high speed
    C: Remain behind them at a safe interval until you can pass safely
    D: Flash your high beams until they pull off the road
  answer: C
  explanation: If the road is narrow and you are unable to safely pass a person on
    a bicycle, do not follow too closely and do not blast your horn. Remain behind
    at a safe interval until you are able to pass.
- id: 91
  category: defensive_driving
  question: How does wet weather affect a person riding a bicycle?
  choices:
    A: It increases their visibility to other drivers
    B: It greatly reduces their braking ability
    C: It improves their tire traction on the road
    D: It requires them to ride on the sidewalk
  answer: B
  explanation: During wet weather, the braking ability of a bicycle is greatly reduced.
    Motorists should be prepared to compensate for the cyclist's decreased ability
    to slow or stop.
- id: 92
  category: sharing_the_road
  question: Which action accounts for a large percentage of car and motorcycle injury-producing
    accidents?
  choices:
    A: Cars making left turns in front of an oncoming motorcyclist
    B: Motorcyclists passing cars on the right
    C: Cars rear-ending motorcycles at stop signs
    D: Motorcyclists failing to use their turn signals
  answer: A
  explanation: Left turns in front of an oncoming motorcyclist account for a large
    percentage of car/cycle injury producing accidents because drivers may fail to
    pick the cyclist out of traffic or judge their speed.
- id: 93
  category: vehicle_information
  question: Why should you be extra cautious when a motorcycle's turn signal is blinking?
  choices:
    A: Motorcycle turn signals are often dimmer than car signals
    B: Turn signals on most motorcycles are not automatically self-canceling
    C: Motorcyclists use turn signals to indicate they are stopping
    D: It means the motorcycle is experiencing mechanical failure
  answer: B
  explanation: Turn signals are not automatically self-canceling on most motorcycles.
    At times, the rider may forget to turn the signal off, so you must be sure the
    vehicle is actually turning before proceeding.
- id: 94
  category: safe_driving_rules
  question: What is the recommended following distance you should maintain behind
    a motorcyclist under normal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 5 seconds
  answer: B
  explanation: Following distance behind the motorcyclist should be the same 2-second
    following distance given any other vehicle.
- id: 95
  category: sharing_the_road
  question: If a motorcyclist is riding far to one side of a wide lane, what should
    you do?
  choices:
    A: Move into the same lane alongside the motorcycle to pass
    B: Honk your horn to let them know you are sharing the lane
    C: Never move into the same lane alongside the motorcycle
    D: Pass them closely on the side they are avoiding
  answer: C
  explanation: Drivers should never move into the same lane alongside a motorcycle
    even if the lane is wide and the cyclist is riding far to one side. It is not
    only illegal, but extremely hazardous.
- id: 96
  category: defensive_driving
  question: How might a motorcyclist react when crossing metal or grated bridges?
  choices:
    A: They will speed up to cross quickly
    B: They may quickly change direction or slow down due to a wobbling sensation
    C: They will move into the oncoming traffic lane
    D: They will come to a complete stop before crossing
  answer: B
  explanation: Metal or grated bridges create a wobbling sensation in the front tire
    of the motorcycle. This may cause an inexperienced motorcyclist to quickly change
    direction or slow down.
- id: 97
  category: sharing_the_road
  question: How can you tell if you are driving in a truck or bus driver's side blind
    spot?
  choices:
    A: You are within 50 feet of the rear of the truck
    B: You cannot see the driver's face in their side-view mirror
    C: The truck's turn signals are flashing
    D: You are driving on the right side of the truck
  answer: B
  explanation: If you can't see the driver's face in the side-view mirror, the driver
    can't see you, meaning you are in their Side No-Zone (blind spot).
- id: 98
  category: sharing_the_road
  question: How far can the huge blind spot directly behind a truck or bus extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 150 feet
    D: Up to 200 feet
  answer: D
  explanation: Unlike cars, trucks and buses have huge no-zones directly behind them
    that may extend as far as 200 feet.
- id: 99
  category: safe_driving_rules
  question: What should you do when following a large vehicle at night?
  choices:
    A: Keep your high beams on to increase visibility
    B: Always dim your headlights
    C: Flash your headlights repeatedly
    D: Turn off your headlights temporarily
  answer: B
  explanation: When following a large vehicle at night, always dim your headlights.
    Bright lights will blind the driver when they reflect off the side mirrors of
    the bus or truck.
- id: 100
  category: sharing_the_road
  question: When passing a large vehicle, when is it safe to pull back in front of
    it?
  choices:
    A: As soon as your rear bumper clears the front of the truck
    B: When you can see the entire front of the vehicle in your rear-view mirror
    C: When the truck driver flashes their headlights
    D: After you have maintained your speed for 5 seconds
  answer: B
  explanation: Look for the entire front of the vehicle in your rear-view mirror before
    pulling in front and don't slow down.
- id: 101
  category: vehicle_information
  question: According to a National Safety Council study, how much distance does a
    loaded truck need to stop safely at 55 miles per hour?
  choices:
    A: 193 feet
    B: 250 feet
    C: 350 feet
    D: 430 feet
  answer: D
  explanation: A National Safety Council study found that at speeds of 55 miles per
    hour, a passenger car needs 193 feet to stop safely and a loaded truck needs 430
    feet.
- id: 102
  category: defensive_driving
  question: What might a motorcyclist do when approaching a rough railroad grade crossing?
  choices:
    A: Rise off the seat to help cushion the shock
    B: Accelerate rapidly to jump the tracks
    C: Lay the motorcycle down to slide under the crossing gate
    D: Stop and walk the motorcycle across the tracks
  answer: A
  explanation: At railroad grade crossings, the cyclist may rise off the seat to help
    cushion the shock of a rough crossing.
- id: 103
  category: sharing_the_road
  question: How can fast-moving, large trucks affect motorcyclists on the highway?
  choices:
    A: They provide a slipstream that improves the motorcycle's fuel efficiency
    B: They create windblasts that can move the motorcyclist out of their path of
      travel
    C: They block crosswinds, making it safer for the motorcycle
    D: They force the motorcycle to stop completely
  answer: B
  explanation: Fast-moving, large trucks have been known to create windblasts, which
    can startle a motorcyclist, and under certain conditions, actually move the motorcyclist
    out of the path of travel.
- id: 104
  category: sharing_the_road
  question: Why should you avoid passing a truck on the right when its right turn
    signal is blinking?
  choices:
    A: The truck will speed up to make the turn.
    B: Trucks swing wide to the left to safely make a right turn, and you could become
      trapped.
    C: The truck driver is required to yield to you.
    D: Passing on the right is always illegal.
  answer: B
  explanation: Truck and bus drivers need to swing wide to the left to safely make
    a right turn. If you attempt to pass on the right, the driver will not be able
    to see you and you will become trapped.
- id: 105
  category: safe_driving_rules
  question: Which way should you turn your wheels when parking facing uphill where
    there is a curb?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: Straight ahead
  answer: B
  explanation: When facing uphill with a curb, you must turn your wheels away from
    the curb and shift into low gear or PARK.
- id: 106
  category: safe_driving_rules
  question: How should you position your wheels when parking facing downhill, with
    or without a curb?
  choices:
    A: Turn wheels toward the curb or edge of the road.
    B: Turn wheels away from the curb.
    C: Keep the wheels perfectly straight.
    D: Turn wheels to the left.
  answer: A
  explanation: When parking facing downhill, with or without a curb, you should turn
    your wheels toward the curb or edge of the road.
- id: 107
  category: safe_driving_rules
  question: Parking is NOT allowed within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: B
  explanation: Parking is NOT allowed within 15 feet of a fire hydrant.
- id: 108
  category: safe_driving_rules
  question: You are prohibited from parking within how many feet of the nearest rail
    of a railroad crossing?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: D
  explanation: Parking is NOT allowed within 50 feet of the nearest rail of a railroad
    crossing.
- id: 109
  category: safe_driving_rules
  question: Alabama's child restraint law requires that children must be restrained
    when riding in motor vehicles through what age?
  choices:
    A: Age 5
    B: Age 10
    C: Age 12
    D: Age 15
  answer: D
  explanation: Alabama's child restraint law requires that children through age 15
    must be restrained when riding in motor vehicles in Alabama.
- id: 110
  category: penalties_and_points
  question: What is the fine for violating Alabama's child restraint law, in addition
    to points being assessed against the driver's record?
  choices:
    A: $15
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: Violators of the child restraint law will have points assessed against
    their driver record, in addition to incurring a fine of $25.
- id: 111
  category: safe_driving_rules
  question: Until what age or weight must an infant be placed in a rear-facing infant-only
    or convertible seat?
  choices:
    A: At least 6 months or 15 pounds
    B: At least 1 year of age or 20 pounds
    C: At least 2 years of age or 30 pounds
    D: At least 3 years of age or 40 pounds
  answer: B
  explanation: The law requires an infant-only seat or convertible seat used in the
    rear-facing position until an infant is at least 1 year of age or 20 pounds.
- id: 112
  category: driver_responsibility
  question: 'According to accident records, over 90 percent of highway crashes are
    caused by:'
  choices:
    A: Mechanical failures
    B: Poor weather conditions
    C: Driver error and improper attitude
    D: Poorly maintained roads
  answer: C
  explanation: Accident records show that over 90 percent of the highway crashes are
    caused by driver error, lack of knowledge, inattention, physical or mental condition,
    improper attitude or faulty judgment.
- id: 113
  category: defensive_driving
  question: What is "highway hypnosis"?
  choices:
    A: A condition of drowsiness or unawareness brought on by monotony.
    B: A visual impairment caused by oncoming headlights.
    C: A state of panic caused by heavy traffic.
    D: A mechanical failure of the vehicle's steering system.
  answer: A
  explanation: Expressway drivers are subject to "highway hypnosis" - a condition
    of drowsiness or unawareness brought on by monotony; the sound of the wind, the
    tires on the pavement, and the steady hum of the engine.
- id: 114
  category: defensive_driving
  question: To avoid fatigue on long trips, how often is it advisable to take regular
    rest stops?
  choices:
    A: Every 50 miles or 1 hour
    B: Every 100 miles or every two hours
    C: Every 200 miles or every four hours
    D: Only when you run low on fuel
  answer: B
  explanation: It is advisable to take regular rest stops - every 100 miles or every
    two hours. Get out of the car and walk around - stretch your legs and relax.
- id: 115
  category: penalties_and_points
  question: What is the fine for a first-time offense of texting while driving in
    Alabama?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: A
  explanation: The fine for violating the texting while driving law is $25 for a first-time
    offense, $50 for a second offense and $75 for a third or subsequent offense.
- id: 116
  category: safe_driving_rules
  question: How far away must you park from a crosswalk at an uncontrolled intersection?
  choices:
    A: At least 10 feet
    B: At least 15 feet
    C: At least 20 feet
    D: At least 30 feet
  answer: C
  explanation: Parking is NOT allowed within 20 feet of a crosswalk at an uncontrolled
    intersection.
- id: 117
  category: driver_responsibility
  question: Which of the following is a recommended precaution if you must use a cellular
    phone while driving?
  choices:
    A: Engage in intense or complicated conversations to stay awake.
    B: Place calls while moving in congested traffic.
    C: Use a speaker phone or hands-free device.
    D: Hold the phone tightly in your left hand while steering with your right.
  answer: C
  explanation: 'If you do use a cellular phone, take precautions such as: Use speaker
    phone/hands-free device, avoid intense conversations, and avoid talking in congested
    traffic.'
- id: 118
  category: penalties_and_points
  question: How many points are placed on a driver's record for each texting while
    driving offense?
  choices:
    A: One point
    B: Two points
    C: Three points
    D: Four points
  answer: B
  explanation: For each texting while driving offense, a two-point violation will
    be placed on the offender's driving record.
- id: 119
  category: defensive_driving
  question: Which of the following is a recommended way to combat 'highway hypnosis'?
  choices:
    A: Stare fixedly at the center line of the road
    B: Rely on 'stay-awake drugs' to maintain focus
    C: Keep shifting your eyes from one area of the roadway to another
    D: Turn on the interior dome light of your vehicle
  answer: C
  explanation: To combat highway hypnosis, you should keep shifting your eyes from
    one area of the roadway to another and focus them on various objects near and
    far.
- id: 120
  category: alcohol_drugs_health
  question: 'The amount of alcohol in an average ''shot of whiskey'' or a glass of
    wine is approximately equal to the amount of alcohol in:'
  choices:
    A: Half a bottle of beer
    B: One bottle of beer
    C: Two bottles of beer
    D: Three bottles of beer
  answer: B
  explanation: The manual states that the amount of alcohol in one bottle of beer
    is about equal to that in an average shot of whiskey or a glass of wine.
- id: 121
  category: alcohol_drugs_health
  question: Which of the following statements about alcohol is true?
  choices:
    A: Alcohol is a stimulant.
    B: Alcohol improves coordination and reflexes.
    C: Alcohol is a depressant.
    D: Impairment only occurs after legal intoxication is reached.
  answer: C
  explanation: Alcohol is a depressant, not a stimulant. It causes drowsiness, blurred
    vision, and slowed reflexes, and impairment can occur before legal intoxication
    is attained.
- id: 122
  category: alcohol_drugs_health
  question: 'Under Alabama law, it is unlawful for a person under 21 years of age
    to operate a vehicle with a blood alcohol content (BAC) of:'
  choices:
    A: .02% or more
    B: .04% or more
    C: .05% or more
    D: .08% or more
  answer: A
  explanation: It is unlawful for persons under 21 years of age to operate a vehicle
    if their blood alcohol content is .02% or more.
- id: 123
  category: alcohol_drugs_health
  question: What is the legal blood alcohol content (BAC) limit for commercial vehicle
    operators in Alabama?
  choices:
    A: .02%
    B: .04%
    C: .06%
    D: .08%
  answer: B
  explanation: It is unlawful for commercial vehicle operators to drive with a blood
    alcohol content of .04% or more.
- id: 124
  category: penalties_and_points
  question: What is the driver license suspension period for a first DUI conviction
    in Alabama?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: For a first DUI conviction, in addition to fines and possible jail
    time, the driver license will be suspended for 90 days.
- id: 125
  category: penalties_and_points
  question: Under the Implied Consent Law, what happens if a driver arrested for DUI
    refuses to submit to a chemical breath test?
  choices:
    A: They will be issued a warning.
    B: Their driver license will be suspended.
    C: They will receive a mandatory 48 hours in jail.
    D: They will be fined $600 immediately.
  answer: B
  explanation: A driver under arrest for DUI who refuses to submit to chemical breath
    tests when directed by an officer shall have his driver license suspended.
- id: 126
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to sober up after drinking
    alcohol?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Eating a heavy meal
    D: Allowing time for the liver to break down the alcohol
  answer: D
  explanation: Black coffee, food, or a cold shower might wake you, but they will
    not sober you. Once alcohol is in the blood stream, it must be broken down by
    the liver, and this process takes time.
- id: 127
  category: alcohol_drugs_health
  question: What happens when you mix alcohol with drugs?
  choices:
    A: The alcohol cancels out the side effects of the drugs.
    B: It simply doubles the effect of the drug.
    C: It multiplies the effects and can cause serious harm or death.
    D: It has no significant effect on the mind or body.
  answer: C
  explanation: The use of alcohol and drugs together produces serious effects. It
    doesn't just double the effect; it multiplies and, when overdone, has caused death.
- id: 128
  category: safe_driving_rules
  question: According to the manual, what is the cause of most rear-end collisions?
  choices:
    A: Speeding through intersections
    B: Following too closely
    C: Driving under the influence of alcohol
    D: Failing to use turn signals
  answer: B
  explanation: Most rear-end collisions are caused by following too closely. Drivers
    must allow enough following distance to stop if necessary.
- id: 129
  category: penalties_and_points
  question: 'A fourth or subsequent DUI conviction in Alabama is classified as a:'
  choices:
    A: Class A misdemeanor
    B: Class B misdemeanor
    C: Class C felony
    D: Traffic infraction
  answer: C
  explanation: A fourth conviction or subsequent DUI conviction is a Class C felony,
    carrying heavy fines, a five-year license revocation, and potential imprisonment.
- id: 130
  category: safe_driving_rules
  question: What is the recommended method to determine a safe following distance
    under good weather conditions?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The four-second rule
    D: The 15-foot rule
  answer: B
  explanation: The manual introduces the 'two-second rule' as a positive and easy-to-apply
    formula for maintaining a safer following distance.
- id: 131
  category: defensive_driving
  question: 'If road and weather conditions are not good, you should increase your
    following distance to:'
  choices:
    A: A three-second count
    B: A four or five-second count
    C: A six-second count
    D: Ten car lengths
  answer: B
  explanation: The manual states that if road and weather conditions are not good,
    you should increase your following distance to a four or five second count.
- id: 132
  category: vehicle_information
  question: Which of the following is a factor that determines the actual stopping
    distance of your vehicle?
  choices:
    A: The color of your vehicle
    B: The time of day
    C: Mental and physical reaction time of the driver
    D: The number of passengers in the vehicle
  answer: C
  explanation: Actual stopping distances depend upon many factors, including the mental
    and physical reaction time of the driver.
- id: 133
  category: defensive_driving
  question: How can wind affect your vehicle's stopping distance?
  choices:
    A: A strong tail wind can make it harder to stop suddenly at high speeds.
    B: A strong head wind increases your stopping distance.
    C: Crosswinds cause the brakes to lock up.
    D: Wind direction has no effect on stopping distance.
  answer: A
  explanation: According to the manual, drivers may not realize the difference a strong
    tail wind can make when trying to stop suddenly at high speed.
- id: 134
  category: driver_responsibility
  question: If you are involved in a traffic crash, when should you move an injured
    person?
  choices:
    A: Immediately, to get them out of the roadway.
    B: Only if it is absolutely necessary to remove them from fire or other dangers.
    C: When they ask you to help them stand up.
    D: You should always move them to the shoulder of the road.
  answer: B
  explanation: You should avoid moving the injured unless it is absolutely necessary
    to remove them from areas threatened by fire or other dangers common to a crash
    scene.
- id: 135
  category: driver_responsibility
  question: What information are you required to give to other persons involved in
    a crash with you?
  choices:
    A: Your name, address, registration number, and show your driver license.
    B: Your name, phone number, and social security number.
    C: Only your insurance information.
    D: Your driver license number and vehicle identification number (VIN).
  answer: A
  explanation: You must give your name, address, and registration number and show
    your driver license to other persons involved in any type of accident.
- id: 136
  category: driver_responsibility
  question: Under what circumstances must a written Form SR-31 be sent within 30 days
    of a crash?
  choices:
    A: After every crash, regardless of damage or insurance.
    B: If there is an injury, fatality, or damage of $500 or more, and the 'at fault'
      party was not insured.
    C: Only if the crash occurred on a state highway.
    D: If both parties were insured at the time of the accident.
  answer: B
  explanation: A written Form SR-31 must be sent within 30 days if there is an injury,
    fatality, or damage of $500 or more, and the 'at fault' party was not insured
    at the time of the mishap.
- id: 137
  category: driver_responsibility
  question: What should you do if your vehicle hits an unattended parked vehicle?
  choices:
    A: Drive away if there is no visible damage.
    B: Wait in your car until the owner returns.
    C: Notify the police, attempt to locate the owner, or leave a written notice with
      your name and address.
    D: Leave your insurance card under the windshield wiper and drive away.
  answer: C
  explanation: If your vehicle hits an unattended vehicle, you must either notify
    the police, make an attempt to locate the owner, or leave a written notice in
    a conspicuous place giving your name and address.
- id: 138
  category: signs_and_signals
  question: What does a round, yellow sign with a black X and the letters RR indicate?
  choices:
    A: A railroad crossing is exactly 100 feet ahead.
    B: A highway railroad crossing is ahead and is placed 750 feet before the track.
    C: You must come to a complete stop immediately.
    D: The railroad crossing ahead has no gates or flashing lights.
  answer: B
  explanation: The round railroad warning sign is yellow with a black X and the letters
    RR. It means a highway railroad crossing is ahead and is placed 750 feet before
    the track.
- id: 139
  category: sharing_the_road
  question: Which of the following vehicles is required to stop before crossing ANY
    railroad crossing?
  choices:
    A: Passenger cars
    B: Motorcycles
    C: School buses
    D: Pickup trucks towing a boat
  answer: C
  explanation: School buses, church buses, passenger buses, and trucks transporting
    flammables, explosives, or other hazardous materials are required to stop before
    crossing any railroad crossing.
- id: 140
  category: safe_driving_rules
  question: When approaching a railroad crossing where you are required to stop, what
    is the proper stopping distance from the tracks?
  choices:
    A: 5 to 10 feet
    B: 15 to 50 feet
    C: 50 to 100 feet
    D: At least 100 feet
  answer: B
  explanation: When approaching a railroad crossing, you must stop within 15 to 50
    ft.
- id: 141
  category: safe_driving_rules
  question: 'To avoid stalling while crossing railroad tracks, a driver with a manual
    transmission should:'
  choices:
    A: Shift into a higher gear while crossing.
    B: Shift into neutral and coast across.
    C: Not change gears while crossing the track.
    D: Accelerate rapidly and shift gears halfway across.
  answer: C
  explanation: To avoid stalling, a driver should not change gears while crossing
    the track. If your vehicle has a manual transmission, shift down and do not change
    gears while crossing.
- id: 142
  category: signs_and_signals
  question: 'If you approach a railroad crossing and the gates are lowered, you must:'
  choices:
    A: Drive around the gates if you cannot see a train coming.
    B: Stop and remain stopped until the gates are raised and lights are no longer
      flashing.
    C: Stop, look both ways, and proceed slowly around the gates.
    D: Honk your horn to alert the train operator before crossing.
  answer: B
  explanation: When gates are being lowered the red flashing lights will warn you
    to stop. Remain stopped until the gates are raised and lights are no longer flashing.
    It is against the law to go around gates.
- id: 143
  category: vehicle_information
  question: How do large, wide tires affect a vehicle's stopping ability according
    to the manual?
  choices:
    A: They always increase stopping distance regardless of the surface.
    B: They help stop quicker on smooth, dry surfaces but skid or hydroplane easier
      on wet surfaces.
    C: They cut through standing water better than narrow tires.
    D: They lose stopping power overall because of less rubber on the road.
  answer: B
  explanation: Large, wide tires may help stop quicker on smooth, dry surfaces, but
    will skid or hydroplane easier on slippery or wet surfaces.
- id: 144
  category: driver_responsibility
  question: If an injury or fatal crash occurs within a municipality, who must be
    notified by the quickest means of communication?
  choices:
    A: The State Troopers
    B: The local police
    C: The Department of Transportation
    D: The local hospital
  answer: B
  explanation: Any injury or fatal crash must be reported to the local police if it
    occurs within a municipality, or to the State Troopers if it happens on a state
    highway.
- id: 145
  category: safe_driving_rules
  question: What should you do if you are driving a vehicle with a manual transmission
    and need to cross railroad tracks?
  choices:
    A: Shift to a higher gear to cross the tracks quickly.
    B: Shift down and do not change gears while crossing the tracks.
    C: Put the vehicle in neutral and coast across the tracks.
    D: Shift into reverse if you see a train approaching.
  answer: B
  explanation: According to the manual, if your vehicle has a manual transmission,
    you should shift down and do not change gears while crossing the tracks.
- id: 146
  category: defensive_driving
  question: Approximately how long does it take a freight train traveling at 55 mph
    to come to a complete stop?
  choices:
    A: About half a mile
    B: Less than 500 feet
    C: A mile or more
    D: Two miles
  answer: C
  explanation: The manual states that a freight train traveling at 55 mph takes a
    mile or more to stop, which is the length of 18 football fields.
- id: 147
  category: safe_driving_rules
  question: What is the first thing you should do if your vehicle stalls on a railroad
    crossing?
  choices:
    A: Try to restart the engine while watching for a train.
    B: Get everyone out of the vehicle immediately and away from the tracks.
    C: Stay in the vehicle and call a tow truck for assistance.
    D: Shift into neutral and try to push the vehicle off the tracks.
  answer: B
  explanation: If your vehicle stalls on a crossing, the manual instructs to get everyone
    out of the vehicle immediately and away from the tracks, then call local law enforcement.
- id: 148
  category: signs_and_signals
  question: What are the three types of traffic signs classified according to their
    function?
  choices:
    A: Regulatory, warning, and information or guide signs
    B: Stop, yield, and speed limit signs
    C: Construction, school zone, and railroad signs
    D: Interstate, highway, and local road signs
  answer: A
  explanation: The three types of traffic signs are classified according to function.
    They are regulatory, warning, and information or guide signs.
- id: 149
  category: safe_driving_rules
  question: When more than one vehicle arrives at the same time at a 4-way stop, which
    vehicle is allowed to leave first?
  choices:
    A: The vehicle furthest to the left
    B: The vehicle furthest to the right
    C: The largest vehicle
    D: The vehicle traveling the fastest
  answer: B
  explanation: When more than one vehicle arrives at the same time at the 4-way stop,
    the vehicle furthest to the right is allowed to leave first.
- id: 150
  category: signs_and_signals
  question: What colors are warning signs that are used in construction areas?
  choices:
    A: Black and yellow
    B: Fluorescent yellow
    C: Black and orange
    D: White and red
  answer: C
  explanation: Warning signs are generally black and yellow, except those used in
    construction areas which are black and orange.
- id: 151
  category: signs_and_signals
  question: What does a fluorescent yellow warning sign indicate?
  choices:
    A: Construction zones and detours
    B: Pedestrian crossings and school zones
    C: Railroad crossings and low clearances
    D: Highway exits and rest areas
  answer: B
  explanation: According to the manual, fluorescent yellow indicates pedestrian crossings
    and school zones.
- id: 152
  category: signs_and_signals
  question: Where are "minimum" speed limits usually posted?
  choices:
    A: In school zones and residential areas
    B: On freeways and other controlled access highways
    C: Near railroad crossings
    D: In construction zones
  answer: B
  explanation: The manual notes that "Minimum" limits are usually posted on freeways
    and other controlled access highways.
- id: 153
  category: signs_and_signals
  question: Where is a "NO PASSING ZONE" warning sign typically placed?
  choices:
    A: On the right side of a four-lane highway
    B: On the left side of a two-lane road
    C: Above the center of an intersection
    D: On the right side of a one-way street
  answer: B
  explanation: The "NO PASSING ZONE" sign is placed on the left side of a two-lane
    road to warn of the beginning of a no passing zone.
- id: 154
  category: sharing_the_road
  question: What is the minimum clearance required when passing a bicyclist?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: The manual specifies that a 3 foot minimum clearance is required when
    passing a cyclist.
- id: 155
  category: sharing_the_road
  question: What does a Shared Lane Marking (Sharrow) inform road users of?
  choices:
    A: That bicycles are prohibited on this road
    B: That people on bicycles might occupy the travel lane
    C: That a designated bike lane is ending
    D: That pedestrians have the right-of-way
  answer: B
  explanation: Shared Lane Markings (Sharrow) inform road users that people on bicycles
    might occupy the travel lane.
- id: 156
  category: defensive_driving
  question: According to the manual, a motorist is how many times more likely to die
    in a crash involving a train compared to other crashes?
  choices:
    A: 10 times
    B: 20 times
    C: 40 times
    D: 100 times
  answer: C
  explanation: A motorist is 40 times more likely to die in a crash involving a train.
- id: 157
  category: driver_responsibility
  question: In addition to being operated by or under the direction of a physically
    handicapped person, what must a vehicle visibly display to legally park in a handicapped
    parking space?
  choices:
    A: A special license plate frame
    B: A handicapped sticker
    C: A doctor's note on the dashboard
    D: A hazard light signal
  answer: B
  explanation: You must not park in a handicapped space unless the vehicle is operated
    by/under the direction of a physically handicapped person AND the vehicle visibly
    displays the handicapped sticker.
- id: 158
  category: safe_driving_rules
  question: Under what condition are double right turns permitted at an intersection?
  choices:
    A: Whenever there are two right-turn lanes
    B: Only at intersections that are properly signed
    C: Only during daylight hours
    D: Whenever traffic is light
  answer: B
  explanation: Double right turns are only permitted at intersections that are properly
    signed. At intersections that aren't signed, follow the rules for right turns.
- id: 159
  category: signs_and_signals
  question: What does a "YIELD" sign mean?
  choices:
    A: Stop completely before entering the intersection
    B: Maintain your speed and merge into traffic
    C: Slow down so you can yield the right of way to pedestrians and vehicles
    D: Accelerate to match the speed of intersecting traffic
  answer: C
  explanation: The YIELD sign means slow down so you can yield the right of way to
    pedestrians crossing the roadway and to vehicles on the intersecting street or
    highway.
- id: 160
  category: safe_driving_rules
  question: In which direction does traffic flow in a roundabout?
  choices:
    A: Clockwise
    B: Counter-clockwise
    C: In both directions
    D: Straight through the central island
  answer: B
  explanation: A roundabout is a circular intersection that usually does not include
    a traffic signal and flows in a counter-clockwise direction around a central island.
- id: 161
  category: safe_driving_rules
  question: When entering a roundabout, who must you yield to?
  choices:
    A: Traffic entering from the left
    B: Traffic already in the roundabout
    C: Traffic entering from the right
    D: Pedestrians only
  answer: B
  explanation: Motorists must enter from the right -- yielding to traffic already
    in the roundabout -- and follow the circle to the right.
- id: 162
  category: signs_and_signals
  question: What color are guide or informational signs that direct motorists to services
    like hospitals or gas stations?
  choices:
    A: Green and white
    B: Brown and white
    C: Blue and white
    D: Black and white
  answer: C
  explanation: Guide or informational signs are blue and white for services.
- id: 163
  category: signs_and_signals
  question: Where does zero mileage begin for mileposts erected along state highways?
  choices:
    A: At the north and east state lines
    B: At the south and west state lines or junctions where routes begin
    C: At the capital city of the state
    D: At the geographic center of the state
  answer: B
  explanation: Zero mileage should begin at the south and west state lines or at junctions
    where routes begin.
- id: 164
  category: signs_and_signals
  question: What color are centerlines painted on two-lane highways to separate traffic
    moving in opposite directions?
  choices:
    A: White
    B: Yellow
    C: Red
    D: Blue
  answer: B
  explanation: Under the Uniform Code, centerlines are to be painted yellow on two
    lane highways.
- id: 165
  category: signs_and_signals
  question: What does a double solid white line indicate?
  choices:
    A: Travel is in opposite directions and passing is permitted.
    B: Travel is in the same direction and crossing the lines is prohibited.
    C: Travel is in the same direction and crossing is permitted with caution.
    D: The lane is reserved for high-occupancy vehicles.
  answer: B
  explanation: A double solid white line is used to delineate a travel lane where
    travel is the same direction and is permitted on both sides of the line, but crossing
    the double lines is prohibited.
- id: 166
  category: signs_and_signals
  question: When are yellow lines used as edge striping?
  choices:
    A: For right edgelines on two-lane roads
    B: For left edgelines on divided roadways where traffic cannot pull entirely off
      the roadway
    C: To mark pedestrian crosswalks
    D: To indicate a school zone ahead
  answer: B
  explanation: Occasionally yellow lines are used for left edgelines on divided roadways
    where traffic cannot pull entirely off the roadway, for marking of obstructions
    and islands.
- id: 167
  category: signs_and_signals
  question: What does a circular steady yellow traffic signal mean?
  choices:
    A: Speed up to beat the red light
    B: Stop immediately in the intersection
    C: Clear the intersection
    D: Proceed with caution without stopping
  answer: C
  explanation: A circular steady yellow means clear the intersection. It follows a
    green signal. You must not enter the intersection when the red signal comes on.
- id: 168
  category: signs_and_signals
  question: What must you do when approaching a railroad crossing with flashing red
    light signals?
  choices:
    A: Slow down and proceed if no train is visible
    B: Stop because a train is near, and do not proceed until safe
    C: Speed up to cross the tracks quickly
    D: Yield to vehicles behind you
  answer: B
  explanation: Always stop when the lights begin to flash because a train is near.
    Do not proceed until you can do so safely.
- id: 169
  category: signs_and_signals
  question: What does a steady green arrow indicate?
  choices:
    A: You may proceed in the direction of the arrow while opposing traffic must stop.
    B: You must yield to opposing traffic before turning.
    C: The protected turning movement is ending.
    D: You may only go straight through the intersection.
  answer: A
  explanation: GREEN ARROWS permit you to proceed in the direction of the arrow while
    opposing traffic must stop.
- id: 170
  category: signs_and_signals
  question: What does a "STEADY RED X" lane use control signal mean?
  choices:
    A: You may drive in the lane with caution.
    B: You must stop and wait for a green arrow.
    C: You shall not drive in the lane over which the signal is located.
    D: The lane is reserved for left turns only.
  answer: C
  explanation: A driver facing a "STEADY RED X" indication shall not drive in the
    lane over which the signal is located.
- id: 171
  category: driver_responsibility
  question: According to the manual, who do traffic laws apply to?
  choices:
    A: Only drivers of motor vehicles
    B: Drivers of vehicles and operators of motorcycles, but not bicyclists
    C: Drivers of vehicles, operators of motorcycles and bicycles, and pedestrians
    D: Only vehicles traveling on interstate highways
  answer: C
  explanation: Traffic laws apply to all who use the streets and roads - drivers of
    vehicles, operators of motorcycles and bicycles, and pedestrians.
- id: 172
  category: safe_driving_rules
  question: What is the statutory speed limit on an unpaved road in Alabama unless
    otherwise posted?
  choices:
    A: 25 miles per hour
    B: 30 miles per hour
    C: 35 miles per hour
    D: 45 miles per hour
  answer: C
  explanation: According to the manual, the statutory speed limit is 35 miles per
    hour on an unpaved road.
- id: 173
  category: safe_driving_rules
  question: What is the statutory speed limit in an urban district?
  choices:
    A: 20 miles per hour
    B: 25 miles per hour
    C: 30 miles per hour
    D: 35 miles per hour
  answer: C
  explanation: The manual states that the statutory speed limit is 30 miles per hour
    in an urban district.
- id: 174
  category: safe_driving_rules
  question: Which of the following best describes Alabama's basic speed law?
  choices:
    A: You must always drive at the exact posted speed limit.
    B: You must never drive a vehicle at a speed that is faster than reasonable under
      existing conditions.
    C: You must drive 5 mph below the speed limit during inclement weather.
    D: You may exceed the speed limit by 10 mph if passing another vehicle.
  answer: B
  explanation: Alabama's basic speed law provides that you must never drive a vehicle
    at a speed that is faster than reasonable under existing conditions, considering
    road, weather, and vehicle conditions.
- id: 175
  category: signs_and_signals
  question: Where must you stop your vehicle at a STOP sign if there is no marked
    stop line?
  choices:
    A: Before entering the crosswalk on the near side of the intersection.
    B: Directly next to the STOP sign.
    C: Ten feet before the intersection.
    D: In the middle of the intersection to get a clear view.
  answer: A
  explanation: If no stop line is marked, the vehicle must stop before entering the
    crosswalk on the near side of the intersection.
- id: 176
  category: safe_driving_rules
  question: Under what condition may you make a left turn after stopping for a red
    traffic light?
  choices:
    A: You may never make a left turn on a red light.
    B: If you are turning from a two-way street onto a one-way street.
    C: If you are driving on a one-way street and turning onto a one-way street with
      traffic moving from right to left.
    D: If there is no oncoming traffic for at least 500 feet.
  answer: C
  explanation: You may make a left turn after stopping if you are driving on a one-way
    street and the street you turn left onto is a one-way street with traffic moving
    from right to left.
- id: 177
  category: signs_and_signals
  question: How should you treat an intersection if the traffic light is inoperative?
  choices:
    A: Treat the intersection as a yield sign.
    B: Treat the intersection as you would a four-way stop.
    C: Proceed through the intersection without stopping if the way is clear.
    D: Wait at the intersection until law enforcement arrives.
  answer: B
  explanation: The manual states that if the traffic light is inoperative, you must
    treat the intersection as you would a four-way stop.
- id: 178
  category: sharing_the_road
  question: When you are required to stop for a school bus displaying flashing red
    lights and an extended stop arm, how far away must you stop?
  choices:
    A: At least 10 feet from the bus.
    B: At least 15 feet from the bus.
    C: At least 20 feet from the bus.
    D: At least 50 feet from the bus.
  answer: C
  explanation: When a school bus is displaying flashing red signals and an extended
    stop area, you must stop at least 20 feet from the bus.
- id: 179
  category: sharing_the_road
  question: When are you NOT required to stop for a school bus that is loading or
    unloading children?
  choices:
    A: When you are traveling on a two-lane highway.
    B: When you are on a four-lane undivided highway.
    C: When you are on a divided highway with four or more lanes and the bus is stopped
      in the opposing roadway.
    D: When you are running late and no children are visible.
  answer: C
  explanation: A stop is not required on a divided highway having four or more lanes
    which permits at least two lanes of traffic to travel in opposite directions when
    meeting a school bus stopped in the opposing roadway.
- id: 180
  category: sharing_the_road
  question: In rural areas, how far in advance do school buses use flashing amber
    lights to pre-warn drivers they are preparing to stop?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: D
  explanation: In rural areas, the flashing amber lights are used at least 300 feet
    before stopping to warn other drivers.
- id: 181
  category: safe_driving_rules
  question: If two vehicles enter an uncontrolled intersection from different roadways
    at about the same time, who has the right of way?
  choices:
    A: The vehicle on the left shall yield to the vehicle on the right.
    B: The vehicle on the right shall yield to the vehicle on the left.
    C: The vehicle traveling at a faster speed has the right of way.
    D: The larger vehicle has the right of way.
  answer: A
  explanation: If two vehicles enter an intersection not controlled by signs or signals
    at about the same time, the driver of the vehicle on the left shall yield to the
    vehicle on the right.
- id: 182
  category: safe_driving_rules
  question: What happens if you enter an uncontrolled intersection at an unlawful
    speed?
  choices:
    A: You maintain the right of way but may receive a citation.
    B: You lose any right of way which you might otherwise have.
    C: Other drivers must yield to you to prevent a crash.
    D: You must immediately reverse out of the intersection.
  answer: B
  explanation: 'The manual explicitly states: ''If you enter an uncontrolled intersection
    at an unlawful speed, you lose any right of way which you might otherwise have.'''
- id: 183
  category: sharing_the_road
  question: The law requires you to stop and give the right of way to a blind person
    carrying what type of cane?
  choices:
    A: A solid yellow cane.
    B: A white cane tipped with red.
    C: A solid black cane.
    D: A red cane tipped with white.
  answer: B
  explanation: The law requires you to stop and give right of way at any intersection
    to a blind person carrying a white cane tipped with red and holding the cane with
    arm extended.
- id: 184
  category: sharing_the_road
  question: What should you do if an emergency vehicle displaying flashing lights
    and sounding a siren approaches while you are in an intersection?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Speed up to exit the intersection as quickly as possible.
    C: Clear the intersection before pulling to the side of the roadway and stopping.
    D: Pull to the left side of the intersection and stop.
  answer: C
  explanation: When yielding to an emergency vehicle, if you are in an intersection,
    you must clear it before stopping. Pull to the side of the roadway and stop.
- id: 185
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road, when is it safe to return
    to the right lane?
  choices:
    A: As soon as your rear bumper clears the front bumper of the passed vehicle.
    B: When you are 50 feet ahead of the passed vehicle.
    C: When the driver of the passed vehicle flashes their headlights.
    D: When you can see the entire front of the vehicle you have just passed in your
      interior rear view mirror.
  answer: D
  explanation: Do not return to the right lane too soon - not until you can see the
    entire front of the vehicle you have just passed in your interior rear view mirror.
- id: 186
  category: safe_driving_rules
  question: What must you do when coming from an alley, private driveway, or building
    within a business or residence district?
  choices:
    A: Always stop before crossing the sidewalk or crosswalk area.
    B: Sound your horn and proceed without stopping.
    C: Yield only if there are vehicles approaching on the street.
    D: Slow down to 5 mph before entering the street.
  answer: A
  explanation: When coming from an alley, private driveway, or building within a business
    or residence district, you must always stop before crossing the sidewalk or crosswalk
    area.
- id: 187
  category: safe_driving_rules
  question: 'You are prohibited from crossing the center line to pass on a curve or
    hill unless you have a clear passing distance of at least:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You may not cross the center line to pass on a curve or hill where
    you cannot see a clear passing distance of at least 500 feet.
- id: 188
  category: sharing_the_road
  question: 'Drivers must yield to a blind pedestrian who is:'
  choices:
    A: Carrying a white or metallic cane, or using a guide dog.
    B: Wearing a yellow reflective vest.
    C: Accompanied by a sighted companion.
    D: Crossing outside of a marked crosswalk without a cane or dog.
  answer: A
  explanation: Drivers must yield to blind pedestrians carrying a white or metallic
    cane, with or without a red tip, or using a guide dog when entering an intersection.
- id: 189
  category: sharing_the_road
  question: 'When walking on a roadway where sidewalks are not provided, pedestrians
    must:'
  choices:
    A: Walk on the right side of the roadway with traffic.
    B: Walk on the left side of the roadway giving way to oncoming traffic.
    C: Walk in the center of the roadway.
    D: Walk on either side as long as they wear reflective clothing.
  answer: B
  explanation: The manual states that pedestrians must walk on the left side of the
    roadway giving way to oncoming traffic.
- id: 190
  category: safe_driving_rules
  question: What is the minimum following distance required for non-official vehicles
    behind an emergency vehicle on an emergency run?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: Only vehicles on necessary official business are permitted to follow
    within 500 feet of emergency vehicles on an emergency run.
- id: 191
  category: safe_driving_rules
  question: On which of the following roads is backing up a vehicle strictly prohibited
    for non-emergency vehicles?
  choices:
    A: One-way city streets
    B: Controlled access highways (freeways and expressways)
    C: Two-lane rural roads
    D: Residential driveways
  answer: B
  explanation: Backing is prohibited on controlled access highways (freeways and expressways)
    except for emergency vehicles in performance of their duties.
- id: 192
  category: signs_and_signals
  question: What is the correct hand signal to indicate that you are stopping or decreasing
    speed?
  choices:
    A: Hand and arm extended upward
    B: Hand and arm extended straight out
    C: Hand and arm extended downward
    D: Waving the hand in a circular motion
  answer: C
  explanation: The correct hand signal for STOP OR DECREASE SPEED is hand and arm
    extended downward.
- id: 193
  category: driver_responsibility
  question: It is unlawful to drive a vehicle with more than how many persons in the
    front seat if it obstructs the driver's view or control?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: It is unlawful to drive any vehicle so loaded or when there are such
    numbers of persons in excess of three in the front seat as to obstruct the driver's
    view or hinder control.
- id: 194
  category: vehicle_information
  question: During the daytime, if a load projects 4 feet or more from the rear of
    a vehicle, what must be attached to the end of the load?
  choices:
    A: A red light visible for 500 feet
    B: A yellow warning sign
    C: A red flag at least 12 inches square
    D: A white flag at least 18 inches square
  answer: C
  explanation: If a load projects 4 feet or more from the rear of a vehicle, a red
    flag at least 12 inches square must be attached at its end in daytime.
- id: 195
  category: driver_responsibility
  question: Which of the following documents is NOT required to be produced by the
    driver when stopped for a traffic violation?
  choices:
    A: Driver License
    B: Proof of Insurance
    C: Vehicle Registration
    D: Vehicle Title
  answer: D
  explanation: When stopped for a traffic violation, the three documents that must
    be produced are the Driver License, Proof of Insurance, and Vehicle Registration.
    The Vehicle Title is not listed.
- id: 196
  category: driver_responsibility
  question: Under the Alabama Mandatory Liability Insurance Law, what is the minimum
    required coverage for death or bodily injury to one person?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Liability insurance policies must be issued for no less than $25,000
    for death or bodily injury to one person.
- id: 197
  category: penalties_and_points
  question: What is the maximum fine for a first conviction of a mandatory liability
    insurance violation?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: An owner or operator convicted of a mandatory liability insurance violation
    may be fined up to $500 for the first violation.
- id: 198
  category: vehicle_information
  question: What is the minimum allowable light transmission for tinted side and rear
    windows on passenger cars such as sedans?
  choices:
    A: 15 percent
    B: 20 percent
    C: 32 percent
    D: 50 percent
  answer: C
  explanation: On passenger cars such as sedans, coupes and station wagons, all windows
    (side and rear) may have tinting that allows at least 32 percent light transmission.
- id: 199
  category: penalties_and_points
  question: What penalty may a driver face for driving off the premises of a gasoline
    establishment without paying for gas?
  choices:
    A: Loss of their driver license
    B: Mandatory community service
    C: Confiscation of their vehicle
    D: A permanent felony record
  answer: A
  explanation: Under Alabama law if you don't pay for gas you can lose your driver
    license.
- id: 200
  category: defensive_driving
  question: When changing lanes, why should you glance over your shoulder in addition
    to checking your mirrors?
  choices:
    A: To check the "blind spot" your mirror does not cover
    B: To see if the driver behind you is signaling
    C: To ensure your rear license plate is visible
    D: To look for emergency vehicles in the distance
  answer: A
  explanation: 'The manual advises: "Glance over your shoulder to check the ''blind
    spot'' your mirror does not cover."'
- id: 201
  category: penalties_and_points
  question: What is the penalty for a second conviction of driving off without paying
    for gasoline?
  choices:
    A: A 30-day license suspension
    B: A six-month license suspension
    C: A one-year license suspension
    D: Permanent license revocation
  answer: B
  explanation: According to Alabama law, on a second conviction for driving off the
    premises of a gasoline establishment without payment, the driver license shall
    be suspended for a period of six months.
- id: 202
  category: penalties_and_points
  question: Driving your vehicle off the premises of a gasoline establishment without
    paying is classified as what type of offense?
  choices:
    A: A Class A misdemeanor
    B: A Class B felony
    C: A traffic infraction
    D: A Class C misdemeanor
  answer: A
  explanation: Alabama Senate Bill 459 states that a person who drives off without
    paying for gas shall be guilty of a Class A misdemeanor.
- id: 203
  category: safe_driving_rules
  question: 'Under the Move-Over Law, if you cannot safely change lanes on a four-lane
    road when approaching an emergency vehicle with flashing lights, you must:'
  choices:
    A: Stop immediately in your lane
    B: Maintain your speed and honk your horn
    C: Slow to a speed at least 15 mph less than the posted speed limit
    D: Accelerate to pass the emergency vehicle quickly
  answer: C
  explanation: The manual states that when changing lanes is unsafe or not possible,
    the driver must slow to a speed that is at least 15 miles per hour less than the
    posted speed limit.
- id: 204
  category: safe_driving_rules
  question: On a two-lane road with a speed limit of 20 mph, what speed must you travel
    when passing a stopped emergency vehicle with flashing lights?
  choices:
    A: 5 mph
    B: 10 mph
    C: 15 mph
    D: 20 mph
  answer: B
  explanation: If driving on a two-lane road, the driver must travel 10 miles per
    hour when the posted speed limit is 20 miles per hour or less.
- id: 205
  category: vehicle_information
  question: Under normal conditions, high beam headlights illuminate the roadway for
    approximately what distance?
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 1000 feet
  answer: B
  explanation: The manual states that headlights on high beam normally illuminate
    the roadway about 350 feet under normal conditions.
- id: 206
  category: safe_driving_rules
  question: You are required by law to dim your headlights when you are within what
    distance of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You must dim your headlights when within 500 feet of an oncoming vehicle.
- id: 207
  category: safe_driving_rules
  question: 'When following another vehicle at night, you must dim your headlights
    when you are within:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 350 feet
    D: 500 feet
  answer: B
  explanation: The law requires you to dim your headlights when within 200 feet when
    following another vehicle.
- id: 208
  category: defensive_driving
  question: 'To reduce the glare from oncoming headlights at night, you should:'
  choices:
    A: Look directly at the oncoming lights to track the vehicle
    B: Turn on your high beams to improve your own visibility
    C: Look to the right-hand edge of the pavement and concentrate on the white striped
      line
    D: Close one eye until the vehicle passes
  answer: C
  explanation: Glare from oncoming lights can be reduced by directing your vision
    away from them, which is done by looking to the right-hand edge of the pavement
    and concentrating on the white striped line.
- id: 209
  category: safe_driving_rules
  question: If you must become a pedestrian during a night road emergency, how should
    you walk along the highway?
  choices:
    A: On the right edge of the road with the flow of traffic
    B: On the left edge of the road or shoulder facing traffic
    C: In the center of the lane to remain visible
    D: On the right shoulder facing away from traffic
  answer: B
  explanation: If you MUST become a pedestrian, carry a light and walk on the left
    edge of the road or shoulder FACING the traffic.
- id: 210
  category: safe_driving_rules
  question: If you have flares or reflectors during a night emergency, where should
    they be placed to warn other traffic?
  choices:
    A: 10 to 50 feet in front of your vehicle
    B: 50 to 100 feet to the rear of your vehicle
    C: 100 to 500 feet to the rear of your vehicle on the right hand edge
    D: Directly on the roof of your vehicle
  answer: C
  explanation: If you have flares or reflectors, place them from 100 to 500 feet to
    the rear of your vehicle on the right hand edge of the highway to warn other traffic.
- id: 211
  category: safe_driving_rules
  question: According to state law, during what hours must your headlights be turned
    on?
  choices:
    A: From sunset to sunrise
    B: From a half-hour after sunset to a half-hour before sunrise
    C: From an hour after sunset to an hour before sunrise
    D: From 8:00 PM to 6:00 AM
  answer: B
  explanation: According to state law, headlights must be turned on from a half-hour
    after sunset to a half-hour before sunrise and during other periods of limited
    visibility.
- id: 212
  category: safe_driving_rules
  question: 'Alabama law requires headlights to be turned on when:'
  choices:
    A: You are using windshield wipers intermittently
    B: Windshield wipers are in use because of rain, sleet, or snow
    C: Driving on a dirt or gravel road
    D: The sky is cloudy but it is not raining
  answer: B
  explanation: Alabama law requires that headlights be turned on when the windshield
    wipers of the vehicle are in use because of rain, sleet, or snow. Intermittent
    use does not require headlight usage.
- id: 213
  category: defensive_driving
  question: On snow or ice, it takes approximately how much more distance to stop
    your car compared to dry pavement?
  choices:
    A: Two to three times as much
    B: Three to twelve times as much
    C: Ten to fifteen times as much
    D: Twenty times as much
  answer: B
  explanation: Remember that on snow or ice it takes three to twelve times as much
    distance to stop your car as on dry pavement.
- id: 214
  category: vehicle_information
  question: 'If your wheels spin when trying to start on snow and ice in a vehicle
    with a manual transmission, you should:'
  choices:
    A: Start in second or high gear
    B: Rev the engine to maximum speed
    C: Pump the brakes rapidly
    D: Turn the steering wheel sharply to the left
  answer: A
  explanation: If your wheels spin, start in second or high gear. This permits a smoother
    acceleration and should aid you in avoiding spinning or sliding the wheels.
- id: 215
  category: vehicle_information
  question: For SUVs, trucks, vans, and RVs, what is the minimum permitted light transmission
    for front-seat side windows?
  choices:
    A: 15 percent
    B: 20 percent
    C: 32 percent
    D: 50 percent
  answer: C
  explanation: For other vehicles such as SUVs, trucks, vans and RVs, front-seat side
    windows are subject to the same 32 percent restriction.
- id: 216
  category: defensive_driving
  question: What should you do to overcome a skid if you are driving a conventional
    rear-wheel drive vehicle?
  choices:
    A: Step lightly on the gas
    B: Slam on the brakes immediately
    C: Ease off the gas
    D: Shift into reverse
  answer: C
  explanation: With a conventional rear-wheel drive vehicle, when you ease off the
    gas, the engine acts as a brake to slow the rear wheels slightly, allowing the
    front end to catch up.
- id: 217
  category: defensive_driving
  question: How should you handle a skid in a front-wheel drive vehicle?
  choices:
    A: Ease off the gas completely
    B: Step lightly on the gas
    C: Apply the brakes firmly
    D: Shift into neutral
  answer: B
  explanation: To overcome a skid with front-wheel drive vehicles, stepping lightly
    on the gas will increase front wheel speed so the front end can catch up with
    the sliding rear end.
- id: 218
  category: safe_driving_rules
  question: At what speed does partial hydroplaning typically start in a standard
    passenger car?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: In a standard passenger car, partial hydroplaning starts at about 35
    mph and increases with speed to about 55 mph.
- id: 219
  category: defensive_driving
  question: What is the best action to take if your vehicle begins to totally hydroplane?
  choices:
    A: Pump the brakes rapidly
    B: Turn the steering wheel sharply
    C: Accelerate to push through the water
    D: Take your foot off the accelerator and let the car slow down
  answer: D
  explanation: If you're totally hydroplaning, about all you can do is release the
    accelerator and ride out the skid.
- id: 220
  category: safe_driving_rules
  question: Which headlights should you use when driving in a thick fog or blinding
    snow?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: Keep headlights on low beam to reduce the glaring reflection of your
    lights on the thick fog blanket or blinding snow.
- id: 221
  category: safe_driving_rules
  question: What does the law forbid you to do when driving downhill?
  choices:
    A: Coast with the transmission in neutral
    B: Use your horn around curves
    C: Drive in a lower gear
    D: Apply the brakes continuously
  answer: A
  explanation: The law forbids you to coast downhill with the transmission in neutral.
- id: 222
  category: alcohol_drugs_health
  question: Which of the following is a symptom of carbon monoxide poisoning?
  choices:
    A: Sudden weariness and yawning
    B: Rapid heartbeat
    C: Extreme hunger
    D: Blurred vision
  answer: A
  explanation: Symptoms of carbon monoxide poisoning are sudden weariness, yawning,
    dizziness and nausea.
- id: 223
  category: vehicle_information
  question: What is one of the most common reasons for a tire blowout?
  choices:
    A: Over-inflation
    B: Under-inflation
    C: Driving on wet roads
    D: Using high beam headlights
  answer: B
  explanation: Under-inflation is one of the most common reasons for blowouts.
- id: 224
  category: defensive_driving
  question: What should you do first if you experience a sudden tire blowout?
  choices:
    A: Slam on the brakes immediately
    B: Swerve to the shoulder of the road
    C: Hold tightly to the steering wheel and steer straight
    D: Shift into neutral
  answer: C
  explanation: To regain control during a blowout, hold tightly to the steering wheel,
    steer straight and ease up on the accelerator. Do not brake until the vehicle
    is under control.
- id: 225
  category: defensive_driving
  question: If you suddenly lose control of your steering, why should you avoid braking?
  choices:
    A: It will cause the engine to stall
    B: It may throw the vehicle off balance and out of control
    C: It will cause the tires to hydroplane
    D: It will damage the brake pads
  answer: B
  explanation: If you brake or try to shift gears during steering failure, this sudden
    change in speed may throw the vehicle off balance and out of control.
- id: 226
  category: defensive_driving
  question: What should you do if your brake pedal suddenly sinks all the way to the
    floor?
  choices:
    A: Turn off the ignition immediately
    B: Shift into a higher gear
    C: Try pumping the pedal to build up pressure
    D: Steer into the nearest ditch
  answer: C
  explanation: If your brake pedal suddenly sinks all the way to the floor, try pumping
    the pedal to build up the pressure.
- id: 227
  category: safe_driving_rules
  question: What is the correct procedure if your wheels drift onto the shoulder of
    the road?
  choices:
    A: Swerve sharply back onto the pavement
    B: Slam on the brakes to stop immediately
    C: Accelerate to get back on the road quickly
    D: Stay on the shoulder, reduce speed, and turn gently back onto the pavement
  answer: D
  explanation: If your wheels drift onto the shoulder of the road, don't try to swerve
    back onto the pavement. Instead, stay on the shoulder and reduce speed. After
    you've slowed down, turn gently back onto the pavement.
- id: 228
  category: defensive_driving
  question: If a car is coming toward you in your lane, why should you NOT turn into
    the left lane to avoid them?
  choices:
    A: It is illegal to cross the center line
    B: The oncoming driver might wake up and swing back into the path of your car
    C: Your vehicle will lose traction and skid
    D: You will not be able to see clearly in the left lane
  answer: B
  explanation: Do not turn into the left lane because the driver of the oncoming vehicle
    might wake up and swing back into the path of your car.
- id: 229
  category: sharing_the_road
  question: If a car is attempting to pass you but cannot complete the pass due to
    oncoming traffic, and a crash is almost certain, what should you do?
  choices:
    A: Speed up to block the passing car
    B: Move quickly onto the right shoulder to allow the car into your lane
    C: Stop your vehicle immediately in the lane
    D: Turn on your high beams to warn the oncoming traffic
  answer: B
  explanation: If the right shoulder is adequate and a crash is almost certain, move
    quickly onto the shoulder to allow the passing car to move into your lane.
- id: 230
  category: vehicle_information
  question: How might you move a car with a manual transmission that has stalled on
    railroad tracks?
  choices:
    A: By pushing it from behind only
    B: By running the starter while the car is in low or second gear
    C: By shifting into neutral and coasting
    D: By revving the engine in reverse
  answer: B
  explanation: If your car stalls on railroad tracks and it has a manual transmission,
    you may be able to move it off the tracks by running the starter while the car
    is in low or second gear.
- id: 231
  category: defensive_driving
  question: If your car plunges into deep water but does not sink immediately, what
    is the best way to escape?
  choices:
    A: Open the door quickly before the water rises.
    B: Wait for the car to fill with water to equalize pressure.
    C: Escape through a window immediately.
    D: Move to the back seat and wait for rescue.
  answer: C
  explanation: 'The manual advises: "If your car plunges into deep water BUT DOES
    NOT SINK, immediately escape through a window. Opening a door, even if possible,
    will permit the water to enter the car more rapidly."'
- id: 232
  category: vehicle_information
  question: Why should you NOT use water to put out an engine fire if smoke comes
    from under the hood?
  choices:
    A: Water will damage the engine's electrical components.
    B: Burning gasoline will float on water and spread the blaze.
    C: Water will cause the radiator to explode.
    D: The sudden temperature change will crack the engine block.
  answer: B
  explanation: 'The manual states regarding vehicle fires: "Do not use water, for
    burning gasoline will float on it and spread the blaze."'
- id: 233
  category: vehicle_information
  question: What should you do to help prevent your engine from overheating in slow-moving
    traffic?
  choices:
    A: Turn on the vehicle's heater to maximum.
    B: Shift into neutral and race the engine briefly during stops.
    C: Turn off the engine every time traffic stops.
    D: Open the radiator cap slightly to release pressure.
  answer: B
  explanation: 'The manual states: "You can help prevent overheating in slow-moving
    traffic by shifting into neutral and racing the engine briefly during stops. This
    will speed up the fan and the water pump."'
- id: 234
  category: defensive_driving
  question: If your accelerator pedal sticks and you choose to turn off the engine
    to slow down, what secondary hazard should you expect?
  choices:
    A: The steering wheel will lock immediately.
    B: The airbags will deploy.
    C: You will lose power steering and power brake assistance.
    D: The transmission will automatically shift into reverse.
  answer: C
  explanation: 'The manual warns that if you turn the engine off to slow down a vehicle
    with a stuck accelerator: "If you have power steering or power brakes, you will
    lose this assistance when you cut the engine."'
- id: 235
  category: safe_driving_rules
  question: When driving on a freeway, what must slower moving vehicles do?
  choices:
    A: Drive on the left shoulder.
    B: Keep to the right.
    C: Maintain a speed of at least 55 mph.
    D: Drive in the center lane with hazard lights on.
  answer: B
  explanation: 'The manual states: "Slower moving vehicles, those traveling at less
    than the normal speed of traffic at that time, MUST KEEP TO THE RIGHT."'
- id: 236
  category: safe_driving_rules
  question: If you have a mechanical breakdown on the freeway, how can you signal
    for assistance from law enforcement?
  choices:
    A: Stand in the right lane and wave your arms.
    B: Honk your horn continuously in an SOS pattern.
    C: Open the trunk, raise the hood, and tie a white cloth to a door handle or antenna.
    D: Place warning triangles exactly 100 feet behind your vehicle.
  answer: C
  explanation: 'The manual advises for emergencies: "Open the trunk, raise the hood
    if weather permits and tie a white cloth to a door handle or antenna, where it
    can best be seen. These are distress signals..."'
- id: 237
  category: safe_driving_rules
  question: What is the proper procedure for using an acceleration lane to enter a
    freeway?
  choices:
    A: Come to a full stop at the end of the lane and wait for a gap.
    B: Drive to the end of the lane and force your way into traffic.
    C: Increase speed to match vehicles in the through lanes, watch for an opening,
      signal, and merge.
    D: Maintain a slow speed until you are safely in the right lane.
  answer: C
  explanation: 'The manual states: "As you approach and enter the acceleration lane,
    increase speed to match that of vehicles in the through lanes, if possible. Watch
    for an opening, activate your turn signal, and merge smoothly with the other traffic."'
- id: 238
  category: signs_and_signals
  question: Which type of freeway interchange is characterized by four ramps where
    left turns are made AFTER leaving the freeway?
  choices:
    A: Directional
    B: Cloverleaf
    C: Diamond
    D: Trumpet
  answer: C
  explanation: 'The manual describes a Diamond Interchange as: "Characterized by four
    ramps, allowing vehicles to enter or leave the main highway while flowing with
    the traffic. Left turns are made AFTER leaving the freeway."'
- id: 239
  category: safe_driving_rules
  question: What should you do if you miss your intended exit on the freeway?
  choices:
    A: Stop and carefully back up on the shoulder.
    B: Make a U-turn through the median.
    C: Proceed to the next exit and come back to the one you missed.
    D: Slow down drastically and wait for a gap in traffic to reverse.
  answer: C
  explanation: 'The manual explicitly states: "If you miss your exit you must not
    stop, back up, or attempt to turnaround; proceed to the next exit and come back
    to the one you missed."'
- id: 240
  category: vehicle_information
  question: According to Alabama law, rear view mirrors on all vehicles must enable
    the driver to see how far to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The manual states that rear view mirrors "To enable the driver to see
    200 feet to the rear are required on all vehicles."
- id: 241
  category: vehicle_information
  question: How far away must your vehicle's headlights and taillights be visible?
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: 'The manual states regarding vehicle lights: "All lights must be visible
    from a distance of at least 500 feet."'
- id: 242
  category: vehicle_information
  question: 'The high beam of a vehicle''s headlights must illuminate objects at a
    minimum distance of:'
  choices:
    A: 200 feet
    B: 350 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: 'The manual specifies: "The high beam of the headlight must illuminate
    objects at a minimum of 350 feet and be in adjustment and alignment."'
- id: 243
  category: driver_responsibility
  question: According to statistics in the manual, what causes 40 percent of deaths
    in a crash?
  choices:
    A: Striking the windshield, windshield frame, or instrument panel.
    B: Being thrown completely out of the vehicle.
    C: The steering assembly.
    D: Second collisions with other passengers.
  answer: A
  explanation: 'The manual states: "Statistics show that in a crash, steering assemblies
    cause 30 percent of fatal injuries, and another 40 percent of deaths are caused
    by striking the windshield, windshield frame or instrument panel."'
- id: 244
  category: signs_and_signals
  question: Which type of interchange uses loop type connections to eliminate left
    turn and cross traffic conflicts for all movements?
  choices:
    A: Diamond
    B: Directional
    C: Trumpet
    D: Cloverleaf
  answer: D
  explanation: 'The manual describes a Cloverleaf Interchange as being: "Designed
    to allow turning movements off or onto the freeway from four directions, using
    loop type connections. It eliminates left turn and cross traffic conflicts for
    all movements."'
- id: 245
  category: vehicle_information
  question: What is the minimum legal tire tread depth according to the manual?
  choices:
    A: 1/32 inch
    B: 1/16 inch
    C: 1/8 inch
    D: 1/4 inch
  answer: B
  explanation: A tire is illegal if your tread is less than 1/16 inch deep.
- id: 246
  category: safe_driving_rules
  question: Children under what age require special child and infant restraints to
    protect them from serious injury or death?
  choices:
    A: Under four years old
    B: Under five years old
    C: Under six years old
    D: Under eight years old
  answer: C
  explanation: For children under six years old, special child and infant restraints
    are needed to protect them from serious injury or death.
- id: 247
  category: vehicle_information
  question: When is it lawful to use your motor vehicle's horn?
  choices:
    A: To announce your arrival at a friend's house
    B: To call your passengers to the vehicle
    C: To give a warning when reasonably necessary for safe operation
    D: To express frustration at another driver's mistake
  answer: C
  explanation: It is unlawful to use a motor vehicle horn for any purpose except in
    giving warning when reasonably necessary to insure safe operation. Never use the
    horn to announce arrival or call your passengers.
- id: 248
  category: sharing_the_road
  question: What is the "DEATH ZONE" in relation to school buses?
  choices:
    A: The rear emergency exit of the bus
    B: The area inside the bus where most injuries occur
    C: The blind spot directly behind the bus driver
    D: The area around a stopped school bus where children are at risk of being struck
      by motorists
  answer: D
  explanation: The area around the stopped school bus is referred to as the "DEATH
    ZONE." Most children injured or killed are struck outside the bus by motorists
    who fail to stop for flashing red lights and extended stop signs.
- id: 249
  category: license_system
  question: A 15-year-old with a valid learner license may drive when accompanied
    in the front seat by which of the following?
  choices:
    A: Any licensed driver who is at least 18 years old
    B: A licensed driver who is at least 21 years old
    C: A sibling who is at least 16 years old with a valid license
    D: Any adult over the age of 19
  answer: B
  explanation: 15-year-olds with a valid learner license are authorized to drive while
    accompanied by a parent, legal guardian or a person who is 21 years of age or
    older who is a licensed driver and occupies the front seat.
- id: 250
  category: license_system
  question: Under the Graduated Drivers License (GDL) restrictions, how many nonfamily
    passengers is a 16-year-old driver allowed to have in the vehicle?
  choices:
    A: None
    B: No more than one
    C: No more than two
    D: No more than three
  answer: B
  explanation: Restrictions on the license of a person who is 16 years of age state
    they may not have more than 1 nonfamily passenger other than the parent, guardian
    or supervising licensed driver at least 21 years of age.
- id: 251
  category: license_system
  question: Between what hours is a 16-year-old student driver generally prohibited
    from operating a vehicle unless accompanied by a parent or legal guardian?
  choices:
    A: 10 p.m. and 5 a.m.
    B: 11 p.m. and 6 a.m.
    C: 12 midnight and 6 a.m.
    D: 1 a.m. and 5 a.m.
  answer: C
  explanation: The student may not operate a vehicle between 12 midnight and 6 a.m.
    unless accompanied by a parent or legal guardian (or meeting specific exemptions).
- id: 252
  category: license_system
  question: Which of the following is a valid exception to the midnight to 6 a.m.
    driving restriction for a 16-year-old driver?
  choices:
    A: Going to or from a friend's house
    B: Going to or from a school sponsored event
    C: Going to a late-night movie
    D: Driving to a 24-hour gym
  answer: B
  explanation: Exceptions to the midnight to 6 a.m. restriction include going to or
    from a school sponsored event, regular workplace, religious event, or driving
    due to a medical, fire, or law enforcement related emergency.
- id: 253
  category: penalties_and_points
  question: How many points will be assessed against a teen driver's record for violating
    the GDL passenger or curfew restrictions?
  choices:
    A: Zero points
    B: Two points
    C: Three points
    D: Four points
  answer: A
  explanation: According to the GDL enforcement rules, "No points will be assessed
    for violation of the above restrictions."
- id: 254
  category: penalties_and_points
  question: What is the penalty for violating any of the Graduated Drivers License
    (GDL) restrictions?
  choices:
    A: A $500 fine and vehicle impoundment
    B: Immediate revocation of the license for one year
    C: The restrictive period is extended by 6 months or until age 18
    D: Mandatory community service and a defensive driving course
  answer: C
  explanation: Violation of any of the above restrictions will result in the restrictive
    period being extended by 6 months or until the driver reaches 18 years of age.
- id: 255
  category: penalties_and_points
  question: 'A 16-year-old driver''s license will automatically be suspended for 60
    days or until age 18 if they are convicted of:'
  choices:
    A: A single parking violation
    B: A second moving traffic violation
    C: Driving with an expired registration
    D: Playing the car stereo too loudly
  answer: B
  explanation: If a licensee is convicted of a second moving traffic violation or
    specific 4+ point offenses, their license will automatically be suspended for
    60 days or until age 18, whichever comes first.
- id: 256
  category: license_system
  question: 'The Graduated Drivers License (GDL) restrictions do NOT apply to a 16-year-old
    who is:'
  choices:
    A: Employed full-time
    B: Enrolled in a certified driver's education course
    C: Married or the head of household
    D: Driving a vehicle with a manual transmission
  answer: C
  explanation: The GDL summary states it does not apply to individuals who are 16
    years of age or older who are married or the head of household.
- id: 257
  category: safe_driving_rules
  question: When planning a trip on a freeway, why is it important to check your gasoline
    gauge beforehand?
  choices:
    A: Because freeway speeds cause vehicles to burn fuel twice as fast
    B: Because there are no service stations located directly on freeways
    C: Because it is illegal to run out of gas on an Alabama freeway
    D: Because gas prices are significantly higher near freeway exits
  answer: B
  explanation: The manual advises to check your car's gasoline gauge and get fuel
    if you do not have enough because "There are no service stations located directly
    on freeways."
- id: 258
  category: alcohol_drugs_health
  question: According to the Parent/Teen Driving Agreement, if a teen breaks the law
    by drinking anything alcoholic, how long must they wait before driving?
  choices:
    A: 8 hours
    B: 12 hours
    C: 24 hours
    D: 48 hours
  answer: C
  explanation: 'The Parent/Teen Driving Agreement states: "if I do break the law by
    drinking anything alcoholic I will not drive for 24 hours."'
- id: 259
  category: vehicle_information
  question: Which of the following warning devices is permitted on a standard civilian
    motor vehicle?
  choices:
    A: A siren
    B: An exhaust whistle
    C: A bell
    D: A horn in good working order
  answer: D
  explanation: A horn (in good working order) is required on all motor vehicles. Bells,
    sirens or exhaust whistles may not be used except for emergency vehicles.
- id: 260
  category: penalties_and_points
  question: For 15, 16, and 17-year-old drivers, how many points assessed for an offense
    will trigger an automatic license suspension?
  choices:
    A: Two or more points
    B: Three or more points
    C: Four or more points
    D: Six or more points
  answer: C
  explanation: According to the manual, any offense where four or more points are
    assessed will automatically suspend the license of a 15, 16, or 17-year-old driver.
- id: 261
  category: penalties_and_points
  question: If a 16-year-old driver is convicted of reckless driving, how long will
    their license automatically be suspended?
  choices:
    A: 30 days or until age 18, whichever comes first
    B: 60 days or until age 18, whichever comes first
    C: 90 days or until age 18, whichever comes first
    D: 120 days or until age 21, whichever comes first
  answer: B
  explanation: The manual states that for reckless driving, a 15, 16, or 17-year-old
    driver's license will automatically be suspended for 60 days or until age 18,
    whichever comes first.
- id: 262
  category: license_system
  question: What does the acronym GDL stand for in the Alabama driver's manual?
  choices:
    A: General Driving License
    B: Graduated Drivers License
    C: Guided Driver Learning
    D: Guaranteed Driving Limits
  answer: B
  explanation: The manual explicitly refers to GDL as the "Graduated Drivers License".
- id: 263
  category: driver_responsibility
  question: How many days do Alabama driver license holders have to inform Driver
    License Services of a change of address?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Alabama driver license holders have 30 days in which to inform the
    Driver License Services of a change of address.
- id: 264
  category: driver_testing
  question: How far in advance must a request for a driver license appointment be
    made?
  choices:
    A: 24 hours prior to the preferred date of test
    B: 48 hours prior to the preferred date of test
    C: 72 hours prior to the preferred date of test
    D: One week prior to the preferred date of test
  answer: B
  explanation: The manual states that all requests for driver license appointments
    must be made 48 hours prior to the preferred date of test.
- id: 265
  category: license_system
  question: Which agency operates the Driver License examining offices in Alabama?
  choices:
    A: Department of Transportation
    B: Department of Motor Vehicles
    C: Alabama Law Enforcement Agency
    D: Highway Safety Office
  answer: C
  explanation: Driver License examining offices are operated by the Alabama Law Enforcement
    Agency.
- id: 266
  category: license_system
  question: Which of the following services can be completed online at the ALEA website?
  choices:
    A: Taking the initial road skills test
    B: Renewing or replacing your driver license or state ID
    C: Paying a traffic ticket
    D: Registering a newly purchased vehicle
  answer: B
  explanation: 'The manual states you can "Renew or replace your driver license or
    state ID online at: www.alea.gov".'
- id: 267
  category: penalties_and_points
  question: Which of the following offenses will trigger an automatic 60-day license
    suspension for a 17-year-old driver?
  choices:
    A: A parking violation
    B: Driving on the wrong side of the road
    C: An offense assessing two points
    D: Failing to renew a vehicle registration
  answer: B
  explanation: Offenses such as driving on the wrong side of the road, illegal passing,
    or reckless driving will automatically suspend the license of a 15, 16, or 17-year-old
    driver for 60 days.
- id: 268
  category: driver_testing
  question: In addition to online scheduling, how else can driver license appointments
    be requested?
  choices:
    A: By phone during regular business hours
    B: By mailing a letter to the governor
    C: By faxing a request to the local police station
    D: By emailing the Department of Transportation
  answer: A
  explanation: The manual notes that appointments may also be requested by phone during
    regular business hours.
- id: 269
  category: license_system
  question: Where can you find change of address forms for your Alabama driver license?
  choices:
    A: Only at the post office
    B: On the ALEA website at www.alea.gov/driver license/change of address
    C: Only by calling the local police department
    D: In the back of the vehicle owner's manual
  answer: B
  explanation: Change of address forms are available on the ALEA website at www.alea.gov/driver
    license/change of address.
- id: 270
  category: penalties_and_points
  question: What happens to a 15-year-old driver's license if they are convicted of
    attempting to elude a law enforcement officer?
  choices:
    A: It is suspended for 30 days
    B: It is revoked permanently
    C: It is automatically suspended for 60 days or until age 18, whichever comes
      first
    D: They are required to take a defensive driving course with no suspension
  answer: C
  explanation: For 15, 16, and 17-year-old drivers, attempting to elude a law enforcement
    officer results in an automatic license suspension for 60 days or until age 18,
    whichever comes first.
- id: 271
  category: license_system
  question: What is the official website for the Alabama Law Enforcement Agency to
    access driver license services?
  choices:
    A: www.alabama-dmv.com
    B: www.alea.gov
    C: www.aldot.gov
    D: www.alabama-police.org
  answer: B
  explanation: The manual directs users to visit the Alabama Law Enforcement Agency
    website at www.alea.gov.
- id: 272
  category: license_system
  question: What is the phone number provided in the manual to reach the License Services
    Division for general inquiries or address changes?
  choices:
    A: 800-555-1234
    B: 334-242-4400
    C: 205-252-7445
    D: '911'
  answer: B
  explanation: The phone number listed for the License Services Division in Montgomery
    is 334-242-4400.
- id: 273
  category: penalties_and_points
  question: The automatic 60-day suspension rule for specific traffic violations applies
    to drivers of which ages?
  choices:
    A: 14, 15, and 16 year olds
    B: 15, 16, and 17 year olds
    C: 16, 17, and 18 year olds
    D: 18, 19, and 20 year olds
  answer: B
  explanation: The manual specifically addresses this rule under the heading "ATTENTION
    15, 16 & 17 YEAR OLD DRIVERS!!".
- id: 274
  category: license_system
  question: If you need to mail correspondence to the License Services Division, what
    city should it be addressed to?
  choices:
    A: Birmingham
    B: Mobile
    C: Montgomery
    D: Huntsville
  answer: C
  explanation: The mailing address provided for the Alabama Law Enforcement Agency,
    License Services Division is PO Box 1471, Montgomery AL 36102-1471.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 275
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 276
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 277
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 278
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 279
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 280
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 281
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 282
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 283
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 284
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 285
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 286
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 287
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 288
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 289
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 290
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 291
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 292
