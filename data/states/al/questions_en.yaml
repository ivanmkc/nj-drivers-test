metadata:
  source: 2025 Alabama Driver's Manual
  total_questions: 243
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Alabama, what is the minimum age to apply for a Stage 1 Learner's Permit?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 15 and a half years old
  answer: B
  explanation: According to the Alabama Driver's Manual, an individual must be at
    least 15 years old to be eligible for a Stage 1 Learner's Permit.
- id: 2
  category: license_system
  question: Under Alabama's GDL law, a Stage 2 Restricted License holder (age 16)
    is generally prohibited from driving between what hours?
  choices:
    A: 10:00 PM to 5:00 AM
    B: 11:00 PM to 6:00 AM
    C: Midnight to 6:00 AM
    D: 9:00 PM to 5:00 AM
  answer: C
  explanation: Stage 2 license holders in Alabama cannot operate a vehicle between
    midnight and 6:00 AM unless accompanied by a parent/guardian or for specific reasons
    like work, school, or religious events.
- id: 3
  category: license_system
  question: How many non-family passengers are allowed in the vehicle when a Stage
    2 Restricted License holder is driving in Alabama?
  choices:
    A: No passengers are allowed
    B: Only one passenger other than a parent or guardian
    C: Up to three passengers
    D: As many as there are seatbelts
  answer: B
  explanation: Alabama Stage 2 restrictions limit the driver to only one passenger
    other than a parent, guardian, or family member.
- id: 4
  category: license_system
  question: In Alabama, how many points accumulated on your driving record within
    a two-year period will result in a 60-day license suspension?
  choices:
    A: 8 to 11 points
    B: 12 to 14 points
    C: 15 to 17 points
    D: 18 to 20 points
  answer: B
  explanation: The Alabama point system mandates a 60-day suspension for drivers who
    accumulate 12 to 14 points within a 2-year period.
- id: 5
  category: license_system
  question: What is the minimum age to obtain a Stage 3 Unrestricted Driver's License
    in Alabama?
  choices:
    A: 16 years old
    B: 17 years old
    C: 18 years old
    D: 21 years old
  answer: B
  explanation: A driver must be at least 17 years old and have held a Stage 2 license
    for at least six months to graduate to a Stage 3 Unrestricted License.
- id: 6
  category: license_system
  question: When applying for an Alabama driver's license, what is the minimum visual
    acuity requirement (with or without corrective lenses)?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Alabama law requires a minimum visual acuity of 20/40 in at least one
    eye to obtain a standard driver's license.
- id: 7
  category: license_system
  question: If you move to Alabama from another state, how many days do you have to
    change your out-of-state license to an Alabama license?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents who possess a valid driver's license from another state
    must apply for an Alabama license within 30 days of establishing residency.
- id: 8
  category: license_system
  question: Under Alabama law, which of the following is a requirement for a Stage
    1 Learner's Permit holder while driving?
  choices:
    A: They must be accompanied by a licensed driver at least 18 years old
    B: They must be accompanied by a licensed driver at least 21 years old in the
      front seat
    C: They may drive alone during daylight hours
    D: They must be accompanied by a parent only
  answer: B
  explanation: A Stage 1 Learner's Permit holder must be accompanied by a licensed
    driver who is at least 21 years of age and occupies the seat beside the driver.
- id: 9
  category: license_system
  question: What is the Alabama 'STAR ID' primarily used for?
  choices:
    A: To prove you are a veteran
    B: To allow for commercial truck driving
    C: To comply with federal REAL ID requirements for air travel and federal facilities
    D: To get discounts on state vehicle registration
  answer: C
  explanation: The STAR ID (Secure, Trusted, And Reliable ID) is Alabama's version
    of the REAL ID, required for boarding domestic flights and entering certain federal
    facilities.
- id: 10
  category: license_system
  question: How many points are assessed against an Alabama driver's record for a
    conviction of Reckless Driving?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is a serious offense in Alabama and results in 6 points
    being added to the driver's record.
- id: 11
  category: license_system
  question: In Alabama, how long is a standard driver's license valid before it expires?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: B
  explanation: Alabama driver's licenses are typically issued for a four-year period.
- id: 12
  category: license_system
  question: Which of these actions will result in the mandatory 'Revocation' (not
    just suspension) of an Alabama driver's license?
  choices:
    A: Failure to pay child support
    B: Manslaughter resulting from the operation of a motor vehicle
    C: First-time speeding ticket
    D: Failing to signal a turn
  answer: B
  explanation: Under Alabama law, a conviction for manslaughter resulting from the
    operation of a motor vehicle requires the mandatory revocation of the driver's
    license.
- id: 13
  category: license_system
  question: What is the Blood Alcohol Concentration (BAC) limit for a driver under
    the age of 21 in Alabama?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Alabama has a 'Zero Tolerance' law for minors, setting the legal BAC
    limit at 0.02% for drivers under age 21.
- id: 14
  category: license_system
  question: 'If an Alabama driver changes their legal name or address, they must notify
    the ALEA Driver License Division within:'
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Alabama law requires drivers to notify the Driver License Division
    of any name or address change within 30 days.
- id: 15
  category: license_system
  question: Which of the following is a restriction for Stage 2 Restricted License
    holders regarding mobile devices?
  choices:
    A: They may use hands-free devices only
    B: They may use any device after 6:00 PM
    C: They are prohibited from using any handheld communication device while driving
    D: There are no specific cell phone restrictions for Stage 2
  answer: C
  explanation: Alabama GDL laws strictly prohibit Stage 1 and Stage 2 drivers from
    using any handheld communication device while operating a vehicle.
- id: 16
  category: license_system
  question: In Alabama, a standard passenger vehicle license is classified as which
    of the following?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: D
  explanation: According to the Alabama Driver Manual, a Class D license is required
    to operate any single vehicle with a gross vehicle weight rating of less than
    26,001 pounds, which includes standard passenger cars.
- id: 17
  category: license_system
  question: Applicants for an Alabama driver's license who are under the age of 19
    must provide which specific document from their school?
  choices:
    A: A copy of their most recent report card
    B: A letter from the school principal
    C: Form DL-1/93 (Enrollment/Exclusion Form)
    D: A valid student ID card
  answer: C
  explanation: Alabama law requires individuals under 19 to provide a Form DL-1/93
    to prove they are enrolled in school or have graduated, as part of the licensing
    process.
- id: 18
  category: license_system
  question: What is the minimum age to obtain an Alabama Class M license for a 'motor-driven
    cycle' (engine size of 150cc or less)?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: A
  explanation: In Alabama, a person who is at least 14 years old may obtain a restricted
    Class M license to operate a motor-driven cycle.
- id: 19
  category: license_system
  question: In Alabama, what is the standard reinstatement fee for a driver's license
    that was suspended for a non-DUI related reason?
  choices:
    A: $50
    B: $100
    C: $150
    D: $275
  answer: B
  explanation: The standard reinstatement fee for a suspended Alabama driver's license
    is $100. (DUI-related reinstatements are higher, typically $275).
- id: 20
  category: license_system
  question: To move from a Stage 1 Learner's Permit to a Stage 2 Restricted License,
    an Alabama driver must complete how many hours of supervised practice (if they
    did not complete a state-approved Driver Education course)?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: Alabama GDL laws require 50 hours of behind-the-wheel practice or the
    completion of a state-approved Driver Education course to advance to Stage 2.
- id: 21
  category: license_system
  question: Under the Alabama Point System, how many points are assigned for speeding
    26 mph or more over the posted speed limit?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 8 points
  answer: C
  explanation: Speeding 26 mph or more over the limit results in 5 points on an Alabama
    driving record. Speeding 1-25 mph over the limit results in 2 points.
- id: 22
  category: license_system
  question: How many days prior to the expiration date are Alabama residents permitted
    to renew their driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 120 days
    D: 180 days
  answer: D
  explanation: Alabama drivers may renew their license up to 180 days (6 months) before
    the expiration date.
- id: 23
  category: license_system
  question: In Alabama, at what age can a person apply for a 'Vessel' (boating) license
    to operate a motorized boat unsupervised?
  choices:
    A: 12 years old
    B: 14 years old
    C: 16 years old
    D: 18 years old
  answer: B
  explanation: While a 12-year-old can obtain a vessel permit to operate with supervision,
    a person must be at least 14 years old to operate a motorized vessel alone in
    Alabama.
- id: 24
  category: license_system
  question: What is the minimum age to apply for a 'Hardship' license (Class H) in
    Alabama, which allows driving to and from work or school under specific emergency
    circumstances?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: A
  explanation: Alabama law allows for a Hardship License (Class H) to be issued to
    individuals as young as 14 if they meet specific criteria of extreme necessity.
- id: 25
  category: license_system
  question: 'In Alabama, a fourth DUI conviction within a 10-year period is classified
    as a:'
  choices:
    A: Class A Misdemeanor
    B: Class B Misdemeanor
    C: Class C Felony
    D: Class B Felony
  answer: C
  explanation: Under Alabama law, a fourth or subsequent DUI conviction within 10
    years is a Class C felony, which carries more severe penalties than misdemeanor
    convictions.
- id: 26
  category: license_system
  question: 'To obtain a Commercial Driver''s License (CDL) for interstate commerce
    (driving across state lines), an Alabama resident must be at least:'
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: While Alabama allows 18-year-olds to obtain a CDL for intrastate (within
    Alabama) driving, federal law requires a driver to be at least 21 for interstate
    commerce.
- id: 27
  category: license_system
  question: 'In Alabama, the term ''Cancellation'' of a driver''s license specifically
    refers to:'
  choices:
    A: Losing driving privileges due to a DUI
    B: Losing driving privileges for a set period due to points
    C: The permanent withdrawal of a license because it was issued in error or through
      fraud
    D: The temporary surrender of a license for medical reasons
  answer: C
  explanation: Cancellation means that the Director of Public Safety determines that
    a person was not entitled to the license, or that the application contained false
    information.
- id: 28
  category: driver_testing
  question: In Alabama, what is the maximum speed limit on interstate highways unless
    otherwise posted?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: According to the Alabama Driver's Manual, the maximum speed limit on
    Alabama interstate highways is 70 mph unless otherwise posted.
- id: 29
  category: driver_testing
  question: What is the statutory speed limit for an urban district in Alabama when
    no signs are posted?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: In Alabama, the statutory speed limit in any urban district is 30 mph
    unless a different limit is posted.
- id: 30
  category: driver_testing
  question: Under Alabama's Mandatory Liability Insurance (MLI) law, what is the minimum
    amount of property damage coverage required per accident?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: Alabama law requires a minimum of $25,000 for property damage, $25,000
    for bodily injury or death of one person, and $50,000 for bodily injury or death
    of two or more people (25/50/25).
- id: 31
  category: driver_testing
  question: 'In Alabama, you must file an accident report (Form SR-13) if there is
    a death, personal injury, or property damage to any one person in excess of:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Alabama law requires an SR-13 form to be filed with the Department
    of Public Safety if an accident results in injury, death, or property damage exceeding
    $250.
- id: 32
  category: driver_testing
  question: 'Alabama''s ''Move Over Law'' requires drivers to move to a non-adjacent
    lane, if safe to do so, when approaching an emergency vehicle with flashing lights.
    If changing lanes is unsafe, the driver must:'
  choices:
    A: Maintain speed but honk to warn the emergency vehicle
    B: Stop completely in the lane of travel
    C: Slow to a speed at least 15 mph less than the posted limit
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: If a driver cannot safely move over into a non-adjacent lane, they
    must slow to a speed that is at least 15 mph less than the posted speed limit.
- id: 33
  category: driver_testing
  question: 'In Alabama, headlights must be turned on whenever you are using your:'
  choices:
    A: Hazard lights
    B: Windshield wipers
    C: Turn signals
    D: Cruise control
  answer: B
  explanation: Alabama law requires that headlights be turned on whenever windshield
    wipers are in use due to rain, sleet, or snow.
- id: 34
  category: driver_testing
  question: According to the Alabama Driver's Manual, it is illegal to park within
    how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: In Alabama, you may not park within 15 feet of a fire hydrant.
- id: 35
  category: driver_testing
  question: In Alabama, it is illegal to park within how many feet of a stop sign,
    yield sign, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Alabama law prohibits parking within 30 feet of any flashing beacon,
    stop sign, yield sign, or traffic control signal located at the side of a roadway.
- id: 36
  category: driver_testing
  question: 'For a first-time DUI conviction in Alabama, the court-ordered fine (excluding
    court costs) ranges from:'
  choices:
    A: $100 to $500
    B: $300 to $1,200
    C: $600 to $2,100
    D: $1,000 to $5,000
  answer: C
  explanation: A first DUI conviction in Alabama carries a fine ranging from $600
    to $2,100, in addition to other penalties like jail time and license suspension.
- id: 37
  category: driver_testing
  question: The Alabama Driver's Manual recommends using which rule to maintain a
    safe following distance behind the vehicle in front of you?
  choices:
    A: The one-car-length rule
    B: The two-second rule
    C: The four-second rule
    D: The ten-foot rule
  answer: B
  explanation: Alabama's manual suggests the 'two-second rule' for normal driving
    conditions to ensure a safe following distance.
- id: 38
  category: driver_testing
  question: 'In Alabama, you are prohibited from making a U-turn on a curve or near
    the crest of a hill if you cannot be seen by drivers approaching from either direction
    within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Alabama law states that no vehicle shall be turned so as to proceed
    in the opposite direction upon any curve or crest of a grade where such vehicle
    cannot be seen by the driver of any other vehicle approaching from either direction
    within 500 feet.
- id: 39
  category: driver_testing
  question: What is the legal Blood Alcohol Concentration (BAC) limit for an adult
    driver (21 or older) operating a regular passenger vehicle in Alabama?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.05%
    D: 0.08%
  answer: D
  explanation: In Alabama, an adult driver is considered legally intoxicated if their
    BAC is 0.08% or higher.
- id: 40
  category: driver_testing
  question: 'To pass the vision screening for an Alabama driver''s license, an applicant
    must have a horizontal field of vision of at least:'
  choices:
    A: 90 degrees
    B: 110 degrees
    C: 140 degrees
    D: 180 degrees
  answer: B
  explanation: Alabama license requirements specify that an applicant must have a
    horizontal field of vision of at least 110 degrees.
- id: 41
  category: driver_testing
  question: When using hand signals to indicate a turn, which position represents
    a left turn in Alabama?
  choices:
    A: Arm extended upward
    B: Arm extended downward
    C: Arm extended horizontally out the window
    D: Arm waving in a circular motion
  answer: C
  explanation: To signal a left turn using hand signals, the driver should extend
    their arm and hand horizontally out of the window.
- id: 42
  category: driver_testing
  question: 'During the Alabama road skills test, the applicant is required to demonstrate
    the ability to back the vehicle in a straight line for a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The Alabama road test requires the applicant to back the vehicle in
    a straight line for approximately 50 feet without weaving or crossing lines.
- id: 43
  category: driver_testing
  question: How many points are added to an Alabama driving record for a conviction
    of 'Following too closely' (tailgating)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: In Alabama, following too closely is a 3-point violation on the driver's
    record.
- id: 44
  category: driver_testing
  question: A new resident to Alabama must register their vehicle within how many
    days of establishing residency?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: New residents are required to register their vehicles and obtain an
    Alabama license plate within 30 days of moving to the state.
- id: 45
  category: driver_testing
  question: To pass the Alabama written knowledge exam, an applicant must correctly
    answer at least how many questions out of 30?
  choices:
    A: '20'
    B: '21'
    C: '24'
    D: '27'
  answer: C
  explanation: The Alabama written test consists of 30 multiple-choice questions.
    A passing score of 80% is required, which means answering 24 questions correctly.
- id: 46
  category: driver_testing
  question: In Alabama, what is the minimum age to apply for a Class A Commercial
    Driver License (CDL) for intrastate (within Alabama only) operation?
  choices:
    A: '16'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: While federal law requires drivers to be 21 for interstate commerce,
    Alabama allows individuals 18 years of age or older to apply for a CDL for intrastate
    operation.
- id: 47
  category: driver_testing
  question: 'Under Alabama''s Implied Consent Law, if you refuse to submit to a chemical
    breath test upon the request of a law enforcement officer, your license will be
    automatically suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: By driving on Alabama's roads, you give 'implied consent' to chemical
    testing. Refusal to take the test results in a 90-day license suspension for a
    first offense.
- id: 48
  category: driver_testing
  question: According to Alabama law, what must a driver do when approaching a pedestrian
    carrying a white cane or using a guide dog?
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a complete stop
    D: Yield only if they are in a marked crosswalk
  answer: C
  explanation: Alabama law requires drivers to come to a complete stop when approaching
    a blind or visually impaired pedestrian carrying a white cane or using a guide
    dog.
- id: 49
  category: driver_responsibility
  question: Under Alabama's Mandatory Liability Insurance law, what is the minimum
    amount of coverage required for bodily injury to or death of two or more persons
    in any one accident?
  choices:
    A: $25,000
    B: $40,000
    C: $50,000
    D: $100,000
  answer: C
  explanation: 'Alabama law requires ''25/50/25'' coverage: $25,000 for bodily injury
    per person, $50,000 for total bodily injury per accident, and $25,000 for property
    damage.'
- id: 50
  category: driver_responsibility
  question: If you are involved in a reportable accident in Alabama, how many days
    do you have to file the SR-13 form with the Department of Public Safety?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Alabama law requires the SR-13 form to be filed within 30 days of the
    accident if it meets the reporting criteria.
- id: 51
  category: driver_responsibility
  question: What is the reinstatement fee for a first-time suspension of vehicle registration
    due to a violation of Alabama's Mandatory Liability Insurance law?
  choices:
    A: $100
    B: $200
    C: $300
    D: $500
  answer: B
  explanation: For a first violation of the Mandatory Liability Insurance law, the
    registration is suspended until the owner pays a $200 reinstatement fee and provides
    proof of current insurance.
- id: 52
  category: driver_responsibility
  question: 'If an Alabama driver is convicted of a second or subsequent violation
    of the Mandatory Liability Insurance law, their registration will be suspended
    for a mandatory period of:'
  choices:
    A: 30 days
    B: 60 days
    C: 4 months
    D: 1 year
  answer: C
  explanation: A second or subsequent conviction for lack of insurance results in
    a mandatory 4-month registration suspension and a $400 reinstatement fee.
- id: 53
  category: driver_responsibility
  question: 'Under Alabama''s ''Implied Consent'' law, by driving on Alabama''s public
    roads, you have given consent to:'
  choices:
    A: A search of your vehicle's trunk
    B: A chemical test of your blood, breath, or urine
    C: A review of your personal cell phone records
    D: A mandatory defensive driving course every 2 years
  answer: B
  explanation: The Implied Consent Law means that any person who operates a motor
    vehicle in Alabama is deemed to have given consent to a chemical test of their
    blood, breath, or urine for the purpose of determining alcohol or drug content.
- id: 54
  category: driver_responsibility
  question: In Alabama, what is the legal Blood Alcohol Concentration (BAC) limit
    for a person operating a commercial motor vehicle?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: While the limit is 0.08% for standard drivers, it is 0.04% for commercial
    drivers in Alabama.
- id: 55
  category: driver_responsibility
  question: What is an SR-22 certificate in the state of Alabama?
  choices:
    A: A permit to drive a commercial vehicle
    B: A document proving a vehicle has passed emissions testing
    C: A certificate of financial responsibility required after certain license suspensions
    D: A medical waiver for drivers with vision impairments
  answer: C
  explanation: An SR-22 is a document issued by an insurance company to the state
    certifying that a driver has the minimum required liability insurance. It is often
    required for high-risk drivers or to reinstate a suspended license.
- id: 56
  category: driver_responsibility
  question: In Alabama, which of the following is true regarding vehicle license plates
    when a vehicle is sold?
  choices:
    A: The license plate stays with the vehicle and goes to the new owner.
    B: The license plate must be destroyed by the seller.
    C: The license plate remains with the seller and can be transferred to another
      vehicle they own.
    D: The license plate must be mailed back to the Department of Revenue within 24
      hours.
  answer: C
  explanation: In Alabama, license plates follow the owner, not the vehicle. When
    a vehicle is sold, the seller removes the plate and may transfer it to a newly
    acquired vehicle within a certain timeframe.
- id: 57
  category: driver_responsibility
  question: 'Leaving the scene of an accident in Alabama that results in injury or
    death is classified as a:'
  choices:
    A: Class A Misdemeanor
    B: Class C Felony
    C: Class B Felony
    D: Traffic Infraction
  answer: B
  explanation: Under Alabama law, leaving the scene of an accident involving personal
    injury or death is a Class C felony.
- id: 58
  category: driver_responsibility
  question: Alabama law requires vehicle owners to pay an 'Ad Valorem' tax. What is
    this tax based on?
  choices:
    A: The number of miles driven annually
    B: The weight of the vehicle
    C: The value of the vehicle
    D: The age of the driver
  answer: C
  explanation: Ad Valorem tax is a property tax based on the market value of the vehicle,
    collected annually by the county license plate issuing official.
- id: 59
  category: driver_responsibility
  question: Which system does Alabama law enforcement use to instantly verify if a
    vehicle has the required liability insurance?
  choices:
    A: AL-Verify
    B: OIVS (Online Insurance Verification System)
    C: LETS (Law Enforcement Tracking System)
    D: CPIC (Criminal Property Information Center)
  answer: B
  explanation: Alabama uses the Online Insurance Verification System (OIVS) which
    allows law enforcement and registration officials to verify insurance status in
    real-time.
- id: 60
  category: driver_responsibility
  question: In Alabama, most individual vehicle owners must renew their registration
    annually during a specific month. How is this month determined?
  choices:
    A: The owner's birth month
    B: The month the vehicle was purchased
    C: The first letter of the owner's last name
    D: The last digit of the vehicle's VIN
  answer: C
  explanation: Alabama uses a staggered registration system where the renewal month
    is determined by the first letter of the owner's last name (e.g., January for
    names starting with A or D).
- id: 61
  category: driver_responsibility
  question: What is the minimum age for a person to be legally responsible for a vehicle's
    registration in Alabama?
  choices:
    A: '16'
    B: '18'
    C: '19'
    D: '21'
  answer: B
  explanation: In Alabama, you must be at least 18 years of age to be the sole owner
    of a vehicle and responsible for its registration and titling.
- id: 62
  category: driver_responsibility
  question: What is the maximum fine for a first-time conviction of operating a vehicle
    without the required mandatory liability insurance in Alabama?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $2,000
  answer: B
  explanation: A first-time violation of the Mandatory Liability Insurance Act can
    result in a fine of up to $500 plus court costs.
- id: 63
  category: driver_responsibility
  question: If your Alabama vehicle registration is suspended for a first-time insurance
    violation, what is the reinstatement fee?
  choices:
    A: $100
    B: $200
    C: $300
    D: $400
  answer: B
  explanation: For a first-time suspension under the Mandatory Liability Insurance
    Act, the owner must pay a $200 reinstatement fee and provide proof of current
    insurance.
- id: 64
  category: driver_responsibility
  question: For a second or subsequent conviction of driving without insurance in
    Alabama, how long will your vehicle registration be suspended?
  choices:
    A: 30 days
    B: 45 days
    C: 4 months
    D: 6 months
  answer: C
  explanation: A second or subsequent conviction for failing to maintain mandatory
    insurance results in a 4-month registration suspension and a $400 reinstatement
    fee.
- id: 65
  category: driver_responsibility
  question: Which document must be kept in the vehicle at all times as evidence of
    financial responsibility in Alabama?
  choices:
    A: The vehicle's Title
    B: A valid insurance identification card
    C: The Bill of Sale
    D: The driver's birth certificate
  answer: B
  explanation: Alabama's Mandatory Liability Insurance Act requires drivers to carry
    an insurance card in the vehicle to provide as proof of coverage upon request
    by law enforcement.
- id: 66
  category: driver_responsibility
  question: If an Alabama driver is convicted of 'Speeding in excess of 26 mph over
    the speed limit,' how many points are added to their driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Alabama's point system assigns 5 points for speeding 26 mph or more
    over the posted limit.
- id: 67
  category: driver_responsibility
  question: In Alabama, what is the legal consequence for a driver found with an open
    container of alcohol in the passenger area of a vehicle on a public highway?
  choices:
    A: It is a felony
    B: It is a Class C misdemeanor
    C: There is no penalty if the driver is not drunk
    D: Mandatory 1-year license revocation
  answer: B
  explanation: The Alabama Open Container Law makes it a Class C misdemeanor to have
    an open container of alcoholic beverage in the passenger area of a motor vehicle.
- id: 68
  category: driver_responsibility
  question: For a first DUI conviction in Alabama, if the driver's BAC was less than
    0.15%, how long is the driver's license typically suspended?
  choices:
    A: 30 days
    B: 90 days
    C: 180 days
    D: 1 year
  answer: B
  explanation: A first DUI conviction in Alabama generally results in a 90-day license
    suspension, which may be stayed if the driver elects to install an ignition interlock
    device.
- id: 69
  category: driver_responsibility
  question: What is an SR-22 in the context of Alabama driving laws?
  choices:
    A: A permit for student drivers
    B: A document certifying that a driver has the required liability insurance
    C: A special license for commercial truck drivers
    D: A form used to report a stolen vehicle
  answer: B
  explanation: An SR-22 is a Uniform Financial Responsibility Certificate that an
    insurance company files with the state to certify that a high-risk driver has
    the required liability insurance.
- id: 70
  category: driver_responsibility
  question: 'In Alabama, vehicle registration (license plate renewal) is assigned
    based on:'
  choices:
    A: The driver's birth month
    B: The date the vehicle was purchased
    C: The first letter of the owner's last name
    D: The vehicle's model year
  answer: C
  explanation: Alabama uses a staggered registration system where the renewal month
    is determined by the first letter of the owner's last name (e.g., 'A' and 'D'
    renew in January).
- id: 71
  category: safe_driving_rules
  question: What is the maximum speed limit on Alabama interstates for passenger vehicles?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: The maximum speed limit on Alabama interstates is 70 mph, though it
    may be lower in urban areas.
- id: 72
  category: safe_driving_rules
  question: When intending to turn, Alabama law requires you to signal your intent
    at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Drivers must give a continuous signal of intention to turn for at least
    100 feet before turning.
- id: 73
  category: safe_driving_rules
  question: When parking on a hill with a curb and facing uphill, in which direction
    should you turn your front wheels?
  choices:
    A: Toward the curb (Right)
    B: Away from the curb (Left)
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels away from the curb
    (to the left) so that if the car rolls, it will hit the curb and stop.
- id: 74
  category: safe_driving_rules
  question: 'Under Alabama''s ''Move Over'' law, if you are unable to move into the
    adjacent lane when approaching an emergency vehicle with flashing lights, you
    must slow to a speed that is at least:'
  choices:
    A: 5 mph below the limit
    B: 10 mph below the limit
    C: 15 mph below the limit
    D: 20 mph below the limit
  answer: C
  explanation: If a driver cannot safely move over to the adjacent lane, they must
    slow to a speed that is at least 15 mph less than the posted speed limit.
- id: 75
  category: safe_driving_rules
  question: In Alabama, what happens to the fine for speeding in a construction or
    maintenance zone when workers are present?
  choices:
    A: The fine is tripled
    B: The fine is doubled
    C: The fine is increased by $500
    D: The fine remains the same but points are doubled
  answer: B
  explanation: Alabama law mandates that fines for speeding in a construction or maintenance
    zone are doubled when workers are present.
- id: 76
  category: safe_driving_rules
  question: Alabama's 'Anti-Slowpoke' law prohibits drivers from staying in the left
    lane of an interstate for more than how many miles without passing another vehicle?
  choices:
    A: 0.5 miles
    B: 1 mile
    C: 1.5 miles
    D: 2 miles
  answer: C
  explanation: Alabama's left-lane law (Act 2019-486) prohibits drivers from operating
    a motor vehicle in the furthermost left lane of an interstate for more than 1.5
    miles without passing another vehicle.
- id: 77
  category: safe_driving_rules
  question: 'Alabama law requires drivers to use headlights whenever windshield wipers
    are in use due to rain, sleet, or snow. This is known as the:'
  choices:
    A: Rain-Light Law
    B: Wipers-On, Lights-On Law
    C: Visibility Act
    D: Clear View Rule
  answer: B
  explanation: Alabama law requires headlights to be turned on when windshield wipers
    are in use due to inclement weather.
- id: 78
  category: safe_driving_rules
  question: 'In Alabama, you are required to use your headlights from a half-hour
    after sunset to a half-hour before sunrise, or whenever you cannot see clearly
    for a distance of:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Headlights must be used when visibility is less than 500 feet due to
    weather or light conditions.
- id: 79
  category: safe_driving_rules
  question: When parking your vehicle near a fire hydrant in Alabama, what is the
    minimum required distance you must maintain?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Alabama law prohibits parking within 15 feet of a fire hydrant.
- id: 80
  category: safe_driving_rules
  question: Under Alabama's 'Move Over' law, what must a driver do when approaching
    an authorized emergency vehicle with flashing lights parked on the side of a multi-lane
    highway?
  choices:
    A: Stop immediately in the lane of traffic
    B: Maintain speed but honk to alert the emergency workers
    C: Move to the lane farthest away from the emergency vehicle, if safe to do so
    D: Speed up to pass the area as quickly as possible
  answer: C
  explanation: Alabama's Move Over Law requires drivers to move to the lane farthest
    away from the emergency vehicle on multi-lane highways. If changing lanes is unsafe,
    the driver must slow down to a speed at least 15 mph less than the posted limit.
- id: 81
  category: safe_driving_rules
  question: What is the recommended following distance for passenger vehicles under
    normal driving conditions in Alabama?
  choices:
    A: One car length for every 10 mph
    B: The two-second rule
    C: 50 feet
    D: The four-second rule
  answer: B
  explanation: The Alabama Driver's Manual recommends using the 'two-second rule'
    to maintain a safe following distance under normal conditions.
- id: 82
  category: safe_driving_rules
  question: 'In Alabama, you are allowed to pass a vehicle on the right side ONLY
    if:'
  choices:
    A: The vehicle ahead is making or about to make a left turn and there is sufficient
      pavement width
    B: You are in a hurry and the left lane is blocked
    C: The vehicle ahead is driving below the speed limit
    D: You are driving on a two-lane, two-way road with a paved shoulder
  answer: A
  explanation: Alabama law permits passing on the right only when the vehicle overtaken
    is making or about to make a left turn, or on roadways with unobstructed pavement
    of sufficient width for two or more lanes of moving vehicles in the direction
    being traveled.
- id: 83
  category: safe_driving_rules
  question: When parking a vehicle facing uphill on a two-way street with a curb,
    how should the front wheels be turned?
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: In Alabama, when parking uphill against a curb, you should turn your
    wheels away from the curb so that if the car rolls, the back of the front tire
    will hit the curb and stop the car.
- id: 84
  category: safe_driving_rules
  question: In Alabama, when a school bus is stopped on a multi-lane highway divided
    by a median or barrier, which vehicles are required to stop?
  choices:
    A: All vehicles in both directions
    B: Only vehicles traveling in the same direction as the bus
    C: Only vehicles traveling in the opposite direction of the bus
    D: No vehicles are required to stop if there are more than four lanes
  answer: B
  explanation: According to Alabama law, if a school bus is stopped on a divided highway
    with a physical barrier or median, only traffic following the bus must stop. Traffic
    proceeding in the opposite direction does not need to stop.
- id: 85
  category: safe_driving_rules
  question: What is the correct hand signal to indicate a left turn in Alabama?
  choices:
    A: Arm extended upward
    B: Arm extended downward
    C: Arm extended horizontally out the window
    D: Waving the arm in a circular motion
  answer: C
  explanation: To signal a left turn using hand signals in Alabama, the driver should
    extend the left arm horizontally out the window.
- id: 86
  category: safe_driving_rules
  question: According to Alabama's mandatory seat belt law, who is required to wear
    a seat belt in a passenger car?
  choices:
    A: Only the driver
    B: Only the driver and front-seat passengers
    C: Only passengers under the age of 18
    D: All occupants regardless of seating position
  answer: B
  explanation: 'Alabama''s current law requires the driver and all front-seat passengers
    in a passenger car to wear a seat belt. (Note: Children must be properly restrained
    in all seating positions).'
- id: 87
  category: safe_driving_rules
  question: When stopping for a railroad crossing in Alabama, a driver must stop within
    how many feet of the nearest rail?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Exactly 20 feet
  answer: C
  explanation: Alabama law requires drivers to stop within 15 to 50 feet from the
    nearest rail of a railroad crossing when signals indicate a train is approaching.
- id: 88
  category: defensive_driving
  question: According to the Alabama Driver's Manual, what is the recommended following
    distance behind the vehicle in front of you under ideal driving conditions?
  choices:
    A: One car length for every 10 mph
    B: A two-second following distance
    C: A four-second following distance
    D: 50 feet
  answer: B
  explanation: The Alabama Driver's Manual recommends the 'two-second rule' to maintain
    a safe following distance under ideal conditions.
- id: 89
  category: defensive_driving
  question: In Alabama, at what speed can hydroplaning begin as water on the road
    starts to build up under your tires?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: According to the Alabama Driver's Manual, hydroplaning can begin at
    speeds as low as 35 mph. At 55 mph, the tires may lose all contact with the road.
- id: 90
  category: defensive_driving
  question: 'Alabama law requires motorists to turn on their headlights whenever they
    are using their:'
  choices:
    A: Windshield wipers
    B: Hazard lights
    C: Air conditioning
    D: Cruise control
  answer: A
  explanation: Alabama law requires that headlights be turned on when windshield wipers
    are in use due to rain, sleet, or snow.
- id: 91
  category: defensive_driving
  question: When driving at night in Alabama, you must dim your high-beam headlights
    when you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Alabama law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet.
- id: 92
  category: defensive_driving
  question: 'In Alabama, you must dim your high-beam headlights when following another
    vehicle within a distance of:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Alabama law requires drivers to dim their high beams when following
    another vehicle within 200 feet.
- id: 93
  category: defensive_driving
  question: 'To avoid last-minute braking or the need to turn suddenly, the Alabama
    Driver''s Manual suggests looking ahead at least:'
  choices:
    A: 5 seconds
    B: 10 to 15 seconds
    C: 30 seconds
    D: One full minute
  answer: B
  explanation: The manual recommends scanning the road 10 to 15 seconds ahead to anticipate
    hazards and traffic flow.
- id: 94
  category: defensive_driving
  question: When driving in heavy fog in Alabama, which of the following is the safest
    headlight setting to use?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: No lights
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    fog and create glare, making it harder to see.
- id: 95
  category: defensive_driving
  question: 'Under the Alabama ''Move Over'' law, if you are approaching a stationary
    emergency vehicle with flashing lights on a multi-lane highway, you must:'
  choices:
    A: Stop immediately in your lane
    B: Speed up to pass the vehicle quickly
    C: Move to a lane that is not adjacent to the emergency vehicle, if safe to do
      so
    D: Maintain your speed and stay in your current lane
  answer: C
  explanation: Alabama's Move Over law requires drivers to move to a non-adjacent
    lane or, if that is not possible, slow down to a speed at least 15 mph less than
    the posted limit.
- id: 96
  category: defensive_driving
  question: 'If your vehicle begins to skid on a slippery road in Alabama, you should:'
  choices:
    A: Brake hard immediately
    B: Steer in the direction you want the front of the vehicle to go
    C: Steer in the opposite direction of the skid
    D: Accelerate to regain traction
  answer: B
  explanation: To recover from a skid, you should take your foot off the gas and steer
    in the direction you want the vehicle to go.
- id: 97
  category: defensive_driving
  question: In Alabama, when are you required to have your headlights turned on?
  choices:
    A: Only between midnight and 5:00 AM
    B: From sunset to sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when it is raining
  answer: C
  explanation: Alabama law states headlights must be used from a half-hour after sunset
    to a half-hour before sunrise, or whenever visibility is less than 500 feet.
- id: 98
  category: defensive_driving
  question: If an oncoming driver fails to dim their high beams, what should you do
    to avoid being blinded by the glare?
  choices:
    A: Turn on your high beams to signal them
    B: Look toward the right edge of your lane
    C: Close your eyes briefly
    D: Look directly at the oncoming headlights
  answer: B
  explanation: To avoid being blinded by glare, look toward the right edge of your
    lane or the white line marking the edge of the road.
- id: 99
  category: defensive_driving
  question: 'When entering a curve, the safest defensive driving practice is to:'
  choices:
    A: Brake hard while in the middle of the curve
    B: Slow down before entering the curve
    C: Accelerate through the entire curve
    D: Maintain your highway speed
  answer: B
  explanation: The Alabama Driver's Manual advises slowing down before you enter a
    curve so you can maintain control and accelerate slightly as you exit.
- id: 100
  category: defensive_driving
  question: 'If you must stop on an Alabama highway due to an emergency, your vehicle
    must be visible from a distance of at least:'
  choices:
    A: 100 feet in each direction
    B: 200 feet in each direction
    C: 500 feet in each direction
    D: 1,000 feet in each direction
  answer: B
  explanation: Alabama law requires that any vehicle stopped on a highway must be
    visible for at least 200 feet in both directions.
- id: 101
  category: defensive_driving
  question: Under Alabama law, when are motorists required to turn on their headlights
    in relation to windshield wiper use?
  choices:
    A: Only if visibility is less than 100 feet
    B: Only during heavy thunderstorms
    C: Whenever windshield wipers are in use due to rain, sleet, or snow
    D: Only after sunset, regardless of wiper use
  answer: C
  explanation: Alabama law requires that headlights be turned on whenever windshield
    wipers are in use due to precipitation such as rain, sleet, or snow.
- id: 102
  category: defensive_driving
  question: When following another vehicle at night in Alabama, at what distance must
    you dim your high beams to avoid blinding the driver ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 500 feet
  answer: B
  explanation: Alabama law requires drivers to dim their high beams when following
    another vehicle within 200 feet.
- id: 103
  category: defensive_driving
  question: 'According to the Alabama Driver''s Manual, hydroplaning can begin at
    speeds as low as:'
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The Alabama Driver's Manual states that hydroplaning can begin at speeds
    as low as 35 mph, and at 55 mph, tires may lose all contact with the road.
- id: 104
  category: defensive_driving
  question: To practice proper defensive driving in Alabama, how far ahead should
    you scan the road for potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 12 to 15 seconds
    C: 20 to 30 seconds
    D: Only the car directly in front of you
  answer: B
  explanation: The Alabama Driver's Manual advises drivers to look 12 to 15 seconds
    ahead to identify potential hazards early.
- id: 105
  category: defensive_driving
  question: Alabama's 'Move Over Law' requires drivers to move to a non-adjacent lane
    or slow down when approaching which of the following stopped on the roadside with
    flashing lights?
  choices:
    A: Law enforcement and emergency vehicles only
    B: Law enforcement, emergency vehicles, and tow trucks only
    C: Law enforcement, emergency vehicles, tow trucks, and utility vehicles
    D: Any vehicle with hazard lights on
  answer: C
  explanation: Alabama's Move Over Law includes law enforcement, emergency vehicles,
    tow trucks, and utility vehicles (like garbage trucks or electric crews) with
    activated flashing lights.
- id: 106
  category: defensive_driving
  question: What is the maximum unposted speed limit in an 'urban district' in Alabama?
  choices:
    A: 20 mph
    B: 25 mph
    C: 30 mph
    D: 35 mph
  answer: C
  explanation: In Alabama, the statutory speed limit in an urban district is 30 mph
    unless otherwise posted.
- id: 107
  category: defensive_driving
  question: 'In Alabama, when approaching a railroad crossing with a stop sign or
    signal, you must stop your vehicle within:'
  choices:
    A: 5 to 25 feet from the nearest rail
    B: 10 to 40 feet from the nearest rail
    C: 15 to 50 feet from the nearest rail
    D: 20 to 60 feet from the nearest rail
  answer: C
  explanation: Alabama law requires drivers to stop between 15 and 50 feet from the
    nearest rail at a railroad crossing when a stop is required.
- id: 108
  category: defensive_driving
  question: 'Alabama law requires that headlights be turned on if visibility is reduced
    to less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: In addition to the wiper rule, Alabama law requires headlights when
    visibility is less than 500 feet.
- id: 109
  category: alcohol_drugs_health
  question: For a first-time DUI conviction in Alabama, what is the range of the fine
    that may be imposed (excluding court costs)?
  choices:
    A: Between $100 and $500
    B: Between $600 and $2,100
    C: Between $1,100 and $5,100
    D: Exactly $5,000
  answer: B
  explanation: In Alabama, a first-offense DUI conviction carries a fine ranging from
    a minimum of $600 to a maximum of $2,100.
- id: 110
  category: alcohol_drugs_health
  question: 'In Alabama, an Ignition Interlock Device is mandatory for a first-time
    DUI conviction if the driver''s BAC was at or above:'
  choices:
    A: 0.05%
    B: 0.08%
    C: 0.10%
    D: 0.15%
  answer: D
  explanation: Alabama law requires the installation of an Ignition Interlock Device
    for a first DUI conviction if the driver had a BAC of 0.15% or greater, refused
    the test, or if a child under 14 was in the vehicle.
- id: 111
  category: alcohol_drugs_health
  question: What is the penalty for a first-time refusal to submit to a chemical breath
    test under Alabama's Implied Consent Law?
  choices:
    A: A 30-day suspension of driving privileges
    B: A 90-day suspension of driving privileges
    C: A 180-day suspension of driving privileges
    D: Permanent revocation of the driver's license
  answer: B
  explanation: If a driver refuses to submit to a chemical test for the first time,
    the Director of Public Safety shall suspend their license for 90 days.
- id: 112
  category: alcohol_drugs_health
  question: Alabama's 'Open Container Law' prohibits the possession of an open alcoholic
    beverage container in which part of the vehicle?
  choices:
    A: Only the driver's seat area
    B: The trunk only
    C: The passenger area of any motor vehicle on a public highway
    D: Only if the vehicle is in motion
  answer: C
  explanation: Alabama law prohibits the possession of an open container of alcoholic
    beverage in the passenger area of a motor vehicle located on a public highway
    or the right-of-way of a public highway.
- id: 113
  category: alcohol_drugs_health
  question: What is the minimum mandatory jail sentence for a second DUI conviction
    within 10 years in Alabama?
  choices:
    A: 24 hours
    B: 5 days
    C: 30 days
    D: 6 months
  answer: B
  explanation: For a second DUI conviction within 10 years, Alabama law requires a
    mandatory jail sentence of at least 5 days or 30 days of community service.
- id: 114
  category: alcohol_drugs_health
  question: In Alabama, what is the legal BAC limit for drivers of commercial motor
    vehicles?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: The legal BAC limit for commercial driver license (CDL) holders operating
    a commercial vehicle in Alabama is 0.04%.
- id: 115
  category: alcohol_drugs_health
  question: If you are taking prescription drugs and need to drive, what is the best
    course of action according to the Alabama Driver's Manual?
  choices:
    A: Drive only if you feel fine
    B: Check with your doctor or pharmacist about side effects before driving
    C: Drink coffee to counteract the drug's effects
    D: Drive only during daylight hours
  answer: B
  explanation: Prescription and over-the-counter drugs can impair driving. Alabama
    law states you can be convicted of DUI for being under the influence of any substance
    that impairs your ability to drive safely.
- id: 116
  category: alcohol_drugs_health
  question: What is the specific reinstatement fee for an Alabama driver's license
    that was suspended or revoked due to a drug or alcohol-related offense?
  choices:
    A: $100
    B: $175
    C: $275
    D: $500
  answer: C
  explanation: While a standard reinstatement fee is lower, Alabama charges a $275
    fee to reinstate a license after a drug or alcohol-related conviction.
- id: 117
  category: alcohol_drugs_health
  question: Which of the following is true regarding the combination of alcohol and
    other drugs while driving?
  choices:
    A: The effects of alcohol are canceled out by drugs
    B: The combination can multiply the effects of both, significantly increasing
      impairment
    C: It is safe as long as both are within legal limits
    D: Only illegal drugs cause impairment when mixed with alcohol
  answer: B
  explanation: Combining alcohol with other drugs (even prescription or over-the-counter
    ones) can produce a synergistic effect, meaning the impairment is much greater
    than the sum of the parts.
- id: 118
  category: alcohol_drugs_health
  question: In Alabama, if you have a medical condition such as epilepsy that causes
    loss of consciousness, you must generally be seizure-free for how long before
    you can be licensed to drive?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 2 years
  answer: C
  explanation: Alabama medical standards generally require a person with a condition
    causing loss of consciousness to be seizure-free for at least 6 months, supported
    by a physician's recommendation, before driving.
- id: 119
  category: alcohol_drugs_health
  question: 'Under Alabama''s ''Implied Consent Law,'' by operating a motor vehicle
    on public highways, you are deemed to have given consent to:'
  choices:
    A: A search of your vehicle's trunk at any time
    B: A chemical test of your blood, breath, or urine for alcohol or drugs
    C: A mandatory 12-month license renewal period
    D: The installation of a GPS tracking device by the ALEA
  answer: B
  explanation: Alabama's Implied Consent Law states that any person who operates a
    motor vehicle shall be deemed to have given consent to a chemical test of their
    breath, blood, or urine for the purpose of determining the alcoholic content of
    their blood or the presence of drugs.
- id: 120
  category: alcohol_drugs_health
  question: 'If an Alabama driver refuses to submit to a chemical breath test under
    the Implied Consent Law for the first time, their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: A first refusal of a chemical test under the Implied Consent Law results
    in a mandatory 90-day driver's license suspension.
- id: 121
  category: alcohol_drugs_health
  question: If an Alabama driver is convicted of DUI and a child under the age of
    14 was in the vehicle at the time of the offense, what happens to the penalty?
  choices:
    A: The fine is waived if the driver attends parenting classes
    B: The mandatory minimum punishment is doubled
    C: The driver's license is permanently revoked on the first offense
    D: There is no additional penalty for having a child in the car
  answer: B
  explanation: Under Alabama law, if a person is convicted of DUI and a child under
    14 was present in the vehicle, the mandatory minimum sentence/punishment is doubled.
- id: 122
  category: alcohol_drugs_health
  question: 'A second DUI conviction within a 10-year period in Alabama requires a
    mandatory jail sentence of at least:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 10 days
    D: 30 days
  answer: B
  explanation: A second DUI conviction within 10 years in Alabama carries a mandatory
    minimum of 48 hours in jail or 20 days of community service.
- id: 123
  category: alcohol_drugs_health
  question: 'An Alabama driver must install an ignition interlock device for a first
    DUI conviction if their Blood Alcohol Concentration (BAC) was at or above:'
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: For a first DUI offense, an ignition interlock device is mandatory
    if the driver's BAC was 0.15% or higher, or if they refused the test, or if there
    was an accident involving injury, or if a child was in the car.
- id: 124
  category: alcohol_drugs_health
  question: Regarding prescription drugs and driving in Alabama, which of the following
    is true?
  choices:
    A: It is legal to drive as long as the drug was prescribed by a doctor
    B: It is only illegal if the drug is an opioid
    C: You can be convicted of DUI if a prescription drug impairs your ability to
      drive safely
    D: Prescription drugs do not affect your driving ability
  answer: C
  explanation: Alabama DUI laws apply to any substance that impairs driving, including
    legal prescription medications and over-the-counter drugs.
- id: 125
  category: alcohol_drugs_health
  question: 'Upon a third DUI conviction in Alabama, the driver''s license will be
    revoked for a period of:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: A third DUI conviction within a 10-year period in Alabama results in
    a mandatory 3-year revocation of the driver's license.
- id: 126
  category: alcohol_drugs_health
  question: 'When alcohol is combined with another drug, the effect on your driving
    ability is usually:'
  choices:
    A: Reduced by half
    B: The same as just the alcohol
    C: Greater than the sum of the effects of both (synergistic effect)
    D: Negated entirely
  answer: C
  explanation: Combining alcohol with other drugs (even over-the-counter ones) creates
    a synergistic effect, meaning the impairment is much greater than if either were
    used alone.
- id: 127
  category: alcohol_drugs_health
  question: 'Alabama drivers who have a medical condition such as epilepsy that may
    affect their driving must:'
  choices:
    A: Stop driving forever immediately
    B: Notify the ALEA Driver License Division of the condition
    C: Only drive during daylight hours
    D: Only drive with a licensed physician in the car
  answer: B
  explanation: Drivers are required to report any physical or mental conditions that
    may impair their ability to operate a vehicle safely to the ALEA Driver License
    Division.
- id: 128
  category: alcohol_drugs_health
  question: 'In addition to fines and license suspension, every person convicted of
    DUI in Alabama must:'
  choices:
    A: Complete a DUI school (Court Referral Program)
    B: Perform 500 hours of community service
    C: Retake the high school GED exam
    D: Forfeit their vehicle to the state
  answer: A
  explanation: All persons convicted of DUI in Alabama are required to complete a
    court-approved DUI school, known as the Court Referral Program.
- id: 129
  category: penalties_and_points
  question: In Alabama, how many points are assessed against your driving record for
    speeding in excess of 26 miles per hour over the posted speed limit?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: According to the Alabama Point System, speeding 26 mph or more over
    the limit results in 5 points, whereas speeding 1-25 mph over the limit results
    in 2 points.
- id: 130
  category: penalties_and_points
  question: In Alabama, if a driver accumulates 22 to 25 points within a two-year
    period, for how long will their license be suspended?
  choices:
    A: 120 days
    B: 180 days
    C: 365 days
    D: 2 years
  answer: B
  explanation: The Alabama point system mandates a 180-day suspension for 22-25 points.
    (12-14 points = 60 days; 15-17 points = 90 days; 18-21 points = 120 days; 26+
    points = 365 days).
- id: 131
  category: penalties_and_points
  question: 'Alabama''s Mandatory Liability Insurance Law requires minimum coverage
    of:'
  choices:
    A: $10,000/$20,000/$5,000
    B: $20,000/$40,000/$10,000
    C: $25,000/$50,000/$25,000
    D: $50,000/$100,000/$50,000
  answer: C
  explanation: Alabama law requires $25,000 for death or injury to one person, $50,000
    for death or injury to two or more people, and $25,000 for property damage (25/50/25).
- id: 132
  category: penalties_and_points
  question: In Alabama, a conviction for 'Texting while driving' results in how many
    points being added to the driver's record?
  choices:
    A: 0 points
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Alabama law prohibits texting while driving. A conviction for this
    offense adds 2 points to the driver's record, in addition to a fine.
- id: 133
  category: penalties_and_points
  question: How many points are assessed for 'Failure to yield right-of-way' in Alabama?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Under the Alabama point system, failing to yield the right-of-way results
    in 3 points being added to your driving record.
- id: 134
  category: penalties_and_points
  question: 'If an Alabama driver is convicted of a second DUI within a 10-year period,
    their license will be:'
  choices:
    A: Suspended for 90 days
    B: Suspended for 180 days
    C: Revoked for 1 year
    D: Revoked for 3 years
  answer: C
  explanation: A second DUI conviction within a 10-year period in Alabama results
    in a mandatory 1-year revocation of the driver's license.
- id: 135
  category: penalties_and_points
  question: In Alabama, how many points are assessed for 'Making an improper turn'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Making an improper turn is a 2-point violation in the state of Alabama.
- id: 136
  category: penalties_and_points
  question: In Alabama, how many points are added to your driving record for the violation
    of 'Following too closely'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: The Alabama point system assigns 3 points to a driver's record for
    a conviction of following too closely (tailgating).
- id: 137
  category: penalties_and_points
  question: If an Alabama driver accumulates 24 or more points within a two-year period,
    what is the length of the license suspension?
  choices:
    A: 180 days
    B: 270 days
    C: 365 days
    D: Permanently revoked
  answer: C
  explanation: Accumulating 24 or more points within a two-year window in Alabama
    results in a license suspension of 365 days (one year).
- id: 138
  category: penalties_and_points
  question: What is the fine for a first-time conviction of violating Alabama's law
    against texting while driving?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: A
  explanation: In Alabama, the fine for a first texting-while-driving offense is $25.
    Subsequent offenses are $50 and $75.
- id: 139
  category: penalties_and_points
  question: In Alabama, what is the Blood Alcohol Concentration (BAC) limit for drivers
    of school buses or daycare vehicles?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: B
  explanation: Alabama law sets a stricter BAC limit of 0.02% for drivers of school
    buses and daycare vehicles.
- id: 140
  category: penalties_and_points
  question: How many points are assessed against your Alabama driving record for an
    'Improper turn'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: A
  explanation: An improper turn violation results in 2 points being added to an Alabama
    driver's record.
- id: 141
  category: penalties_and_points
  question: In Alabama, how many points are assessed for failing to obey a traffic
    control device (such as running a red light)?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Failing to obey a traffic control device, including stop signs and
    red lights, results in 3 points in Alabama.
- id: 142
  category: sharing_the_road
  question: When passing a bicycle traveling in the same direction in Alabama, what
    is the minimum safe distance a motorist must maintain between the vehicle and
    the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Alabama Code § 32-5A-122 (the '3-Foot Law') requires motorists to provide
    a minimum of three feet of clearance when passing a bicyclist.
- id: 143
  category: sharing_the_road
  question: Which of the following statements is TRUE regarding motorcycle lane usage
    in Alabama?
  choices:
    A: Motorcycles are allowed to pass between rows of stopped cars (lane splitting)
    B: A motorcycle is entitled to the full use of a lane
    C: Two motorcycles may not ride side-by-side in a single lane
    D: Motorcycles must always ride on the shoulder of the road
  answer: B
  explanation: In Alabama, motorcycles are entitled to the full use of a traffic lane,
    and it is illegal for a motor vehicle to be driven in a manner that deprives a
    motorcycle of that full use.
- id: 144
  category: sharing_the_road
  question: 'When driving near large commercial trucks, the ''No-Zone'' refers to:'
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the truck
    C: The designated loading area for trucks
    D: The speed-restricted zone for heavy vehicles
  answer: B
  explanation: The 'No-Zone' represents the large blind spots around a truck where
    the truck driver cannot see other vehicles. If you cannot see the truck driver's
    face in their side mirrors, you are in a No-Zone.
- id: 145
  category: sharing_the_road
  question: 'In Alabama, when an emergency vehicle with sirens and flashing lights
    approaches from behind, you should:'
  choices:
    A: Stop immediately in your current lane
    B: Speed up to get out of the way
    C: Pull to the right edge of the roadway and stop
    D: Pull to the left median and stop
  answer: C
  explanation: Alabama law requires drivers to yield the right-of-way to emergency
    vehicles by pulling as close as possible to the right-hand edge or shoulder of
    the road and stopping until the vehicle has passed.
- id: 146
  category: sharing_the_road
  question: 'If you see a pedestrian using a white cane or a guide dog at an intersection,
    Alabama law requires you to:'
  choices:
    A: Honk your horn to let them know you are there
    B: Slow down and proceed with caution
    C: Come to a complete stop and yield the right-of-way
    D: Drive around them if there is enough space
  answer: C
  explanation: Drivers must come to a complete stop and take all necessary precautions
    to avoid injury to a blind pedestrian carrying a white cane or using a guide dog.
- id: 147
  category: sharing_the_road
  question: On a two-lane undivided highway in Alabama, when a school bus stops and
    activates its red flashing lights and stop arm, who must stop?
  choices:
    A: Only the traffic following the bus
    B: Only the traffic meeting the bus from the front
    C: Traffic from both directions
    D: No one, if there are no children visible
  answer: C
  explanation: On any undivided highway (two lanes or multi-lane), traffic in both
    directions must stop for a school bus that is displaying its red lights and stop
    arm.
- id: 148
  category: sharing_the_road
  question: According to Alabama law, who is required to wear a protective helmet
    when riding on a motorcycle?
  choices:
    A: Only riders under the age of 21
    B: Only the operator of the motorcycle
    C: All operators and passengers
    D: Only riders with less than one year of experience
  answer: C
  explanation: Alabama law requires all operators and passengers on motorcycles to
    wear a legally approved protective helmet.
- id: 149
  category: sharing_the_road
  question: 'When riding a bicycle at night in Alabama, the bicycle must be equipped
    with a front lamp that emits a white light visible from at least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Alabama law requires bicycles used at night to have a front lamp visible
    from at least 500 feet and a red rear reflector or lamp visible from 100 to 600
    feet.
- id: 150
  category: sharing_the_road
  question: 'When following a large truck, you should increase your following distance
    to at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 to 5 seconds
    D: 10 seconds
  answer: C
  explanation: Because trucks are large and block your view of the road ahead, Alabama
    safety guidelines recommend a following distance of at least 3 to 5 seconds to
    allow for better visibility and reaction time.
- id: 151
  category: sharing_the_road
  question: The Alabama 'Move Over' law applies to which of the following stationary
    vehicles with active flashing lights?
  choices:
    A: Law enforcement and fire department vehicles only
    B: Ambulances and utility service vehicles only
    C: Tow trucks and highway maintenance vehicles only
    D: All of the above
  answer: D
  explanation: The Alabama Move Over Act covers law enforcement, fire, emergency medical
    services, utility service vehicles, tow trucks, and highway maintenance vehicles.
- id: 152
  category: sharing_the_road
  question: 'In Alabama, if there are no traffic control signals in place, a driver
    must yield the right-of-way to a pedestrian crossing the roadway within a crosswalk
    when:'
  choices:
    A: The pedestrian is on the half of the roadway upon which the vehicle is traveling
    B: The pedestrian is approaching so closely from the opposite half of the roadway
      as to be in danger
    C: Both A and B
    D: Only if the pedestrian is in a school zone
  answer: C
  explanation: Drivers must yield to pedestrians in crosswalks if the pedestrian is
    on the driver's side of the road or approaching closely enough from the other
    side to be in danger.
- id: 153
  category: sharing_the_road
  question: Is it legal for two motorcycles to operate side-by-side (abreast) in a
    single lane in Alabama?
  choices:
    A: No, they must ride in a staggered formation
    B: Yes, but no more than two motorcycles may ride abreast
    C: Yes, but only on residential streets
    D: No, it is considered reckless driving
  answer: B
  explanation: Alabama law permits motorcycles to be operated two abreast in a single
    lane. However, they cannot ride more than two abreast.
- id: 154
  category: sharing_the_road
  question: 'In Alabama, a person riding a bicycle on a roadway has:'
  choices:
    A: The same rights and duties as a driver of a motor vehicle
    B: The right-of-way over all motor vehicles
    C: The duty to ride against the flow of traffic
    D: No legal right to be on the roadway
  answer: A
  explanation: Under Alabama law, every person riding a bicycle upon a roadway is
    granted all of the rights and is subject to all of the duties applicable to the
    driver of a vehicle.
- id: 155
  category: sharing_the_road
  question: In Alabama, if a pedestrian is crossing the street in an unmarked crosswalk
    at an intersection, who has the right-of-way?
  choices:
    A: The motorist, because the crosswalk is not marked
    B: The pedestrian
    C: Whomever arrived at the intersection first
    D: The motorist, but only if they are turning right
  answer: B
  explanation: Under Alabama law, motorists must yield the right-of-way to pedestrians
    crossing the roadway within any marked or unmarked crosswalk at an intersection.
- id: 156
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' Where is the largest blind spot
    located on a tractor-trailer?
  choices:
    A: Directly in front of the cab
    B: Directly behind the trailer
    C: On the left side of the cab
    D: On the right side of the trailer
  answer: D
  explanation: While trucks have blind spots on all sides, the right side 'No-Zone'
    is the largest and most dangerous, extending across multiple lanes.
- id: 157
  category: sharing_the_road
  question: 'In Alabama, bicyclists are required by law to:'
  choices:
    A: Ride on the sidewalk at all times
    B: Ride against the flow of traffic (facing cars)
    C: Ride with the flow of traffic (same direction as cars)
    D: Only ride on designated bike paths
  answer: C
  explanation: In Alabama, bicycles are considered vehicles when operated on the roadway
    and must travel in the same direction as motor vehicle traffic.
- id: 158
  category: sharing_the_road
  question: What is the rule regarding funeral processions at intersections in Alabama?
  choices:
    A: Processions must yield to all other traffic
    B: Processions have the right-of-way at intersections regardless of traffic signals,
      provided the lead vehicle entered lawfully
    C: Only the lead vehicle has the right-of-way
    D: Processions must follow all traffic lights and stop signs individually
  answer: B
  explanation: Alabama law grants funeral processions the right-of-way at intersections.
    Once the lead vehicle has entered an intersection legally, the remaining vehicles
    in the procession may proceed regardless of traffic signals, provided they exercise
    due care.
- id: 159
  category: sharing_the_road
  question: In Alabama, may two motorcycles share a single lane of traffic?
  choices:
    A: No, it is strictly prohibited
    B: Yes, but only during daylight hours
    C: Yes, motorcycles are entitled to the full width of a lane, but two may ride
      abreast in a single lane
    D: Yes, but only if they are traveling below 35 mph
  answer: C
  explanation: Alabama law allows two motorcycles to ride abreast (side-by-side) in
    a single lane. However, lane splitting (riding between lanes of traffic) is illegal.
- id: 160
  category: sharing_the_road
  question: Alabama's 'Move Over' law was expanded to include which of the following
    stationary vehicles in addition to law enforcement and emergency responders?
  choices:
    A: Utility service vehicles and garbage trucks
    B: Ice cream trucks
    C: Mail delivery Jeeps
    D: School buses picking up students
  answer: A
  explanation: The Alabama Move Over Act includes stationary law enforcement, emergency
    vehicles, tow trucks, utility service vehicles, and waste/garbage trucks displaying
    flashing lights.
- id: 161
  category: sharing_the_road
  question: 'When following a large truck at night, you should dim your headlights
    because:'
  choices:
    A: The truck's mirrors will reflect the bright light into the driver's eyes
    B: High beams can damage the truck's reflective tape
    C: Truck drivers have better night vision and don't need the extra light
    D: It is required by law to use parking lights only when following trucks
  answer: A
  explanation: Bright lights reflecting off the large side mirrors of a truck can
    blind the driver. You should always dim your headlights when following any vehicle,
    especially large trucks.
- id: 162
  category: sharing_the_road
  question: 'If there are no sidewalks available, Alabama law requires pedestrians
    to walk:'
  choices:
    A: On the right side of the road with the flow of traffic
    B: On the left side of the road facing oncoming traffic
    C: In the center of the lane to be more visible
    D: Only during daylight hours
  answer: B
  explanation: When sidewalks are not provided, pedestrians should walk on the left
    side of the shoulder or roadway, facing approaching traffic.
- id: 163
  category: sharing_the_road
  question: In Alabama, what color are the 'warning' lights that a school bus activates
    before it stops to load or unload children?
  choices:
    A: Blue
    B: Green
    C: Amber (Yellow)
    D: White
  answer: C
  explanation: Alabama school buses use amber (yellow) flashing lights to alert motorists
    that the bus is preparing to stop. Red flashing lights and the stop arm indicate
    the bus has stopped and children are boarding or exiting.
- id: 164
  category: vehicle_information
  question: According to Alabama law, when must you turn on your headlights in relation
    to weather conditions?
  choices:
    A: Only when it is dark outside
    B: Whenever your windshield wipers are in use due to rain, sleet, or snow
    C: Only during heavy fog
    D: Only when driving on interstate highways
  answer: B
  explanation: Alabama law requires motorists to turn on their headlights whenever
    windshield wipers are in use due to inclement weather.
- id: 165
  category: vehicle_information
  question: To meet Alabama's safety standards, the foot brake must be capable of
    stopping the vehicle within how many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 45 feet
  answer: C
  explanation: Alabama vehicle equipment regulations state that the service (foot)
    brake must be able to stop the car within 30 feet at a speed of 20 mph.
- id: 166
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in Alabama?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: In Alabama, tires are considered unsafe if they have less than 2/32
    of an inch of tread depth.
- id: 167
  category: vehicle_information
  question: 'Alabama law requires every motor vehicle to have a rear-view mirror that
    reflects a view of the highway for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle must be equipped with a mirror so located as to
    reflect to the driver a view of the highway for a distance of at least 200 feet
    to the rear.
- id: 168
  category: vehicle_information
  question: 'Under Alabama law, a vehicle''s horn must be audible under normal conditions
    from a distance of not less than:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Alabama Code requires that every motor vehicle be equipped with a horn
    in good working order capable of emitting sound audible under normal conditions
    from a distance of not less than 200 feet.
- id: 169
  category: vehicle_information
  question: What is the maximum legal window tint (light transmission percentage)
    allowed on the side windows of a passenger car in Alabama?
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: C
  explanation: Alabama law (Act 96-534) specifies that window tinting must allow at
    least 32% light transmission, plus or minus 3%.
- id: 170
  category: vehicle_information
  question: 'In Alabama, the rear license plate must be illuminated so that it is
    clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Alabama law requires a white light to illuminate the rear registration
    plate so that it is clearly legible from a distance of 50 feet to the rear.
- id: 171
  category: vehicle_information
  question: Alabama law prohibits the use of which exhaust system modification?
  choices:
    A: Stainless steel tips
    B: Muffler cutouts or bypasses
    C: Dual exhaust pipes
    D: Chrome plating
  answer: B
  explanation: Alabama law requires every motor vehicle to have a muffler in good
    working order and prohibits the use of a muffler cutout, bypass, or similar device.
- id: 172
  category: vehicle_information
  question: Between what times is it legally required to use headlights in Alabama,
    regardless of weather?
  choices:
    A: Sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: 30 minutes after sunset to 30 minutes before sunrise
    D: 6:00 PM to 6:00 AM
  answer: C
  explanation: Alabama law requires headlights to be turned on from a half-hour (30
    minutes) after sunset to a half-hour (30 minutes) before sunrise.
- id: 173
  category: vehicle_information
  question: In Alabama, turn signals must be visible from a distance of at least how
    many feet to the front and rear?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Mechanical turn signals must be visible to both the front and the rear
    from a distance of at least 100 feet.
- id: 174
  category: vehicle_information
  question: 'Every motor vehicle in Alabama must be equipped with at least one tail
    lamp that emits a red light visible from a distance of:'
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Alabama law requires tail lamps to be visible from a distance of 500
    feet to the rear.
- id: 175
  category: vehicle_information
  question: Which of the following is a requirement for a vehicle's parking brake
    in Alabama?
  choices:
    A: It must be operated by a foot pedal only
    B: It must be able to hold the vehicle on any grade on which it is operated
    C: It is only required on vehicles with manual transmissions
    D: It must be able to stop the vehicle from 60 mph
  answer: B
  explanation: Alabama law requires a parking brake system adequate to hold the vehicle
    on any grade on which it is operated, under all conditions of loading.
- id: 176
  category: vehicle_information
  question: 'In Alabama, headlights must be turned on from a half-hour after sunset
    to a half-hour before sunrise and at any other time when visibility is less than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Alabama law states headlights must be used when visibility is less
    than 500 feet due to insufficient light or unfavorable atmospheric conditions.
- id: 177
  category: vehicle_information
  question: Alabama law requires every motor vehicle to have a rearview mirror that
    allows the driver to see the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Every motor vehicle in Alabama must be equipped with a mirror so located
    as to reflect to the driver a view of the highway for a distance of at least 200
    feet to the rear.
- id: 178
  category: vehicle_information
  question: 'In Alabama, every motor vehicle must be equipped with a horn that can
    be heard under normal conditions from a distance of at least:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: Alabama law requires a horn in good working order capable of emitting
    sound audible under normal conditions from a distance of not less than 200 feet.
- id: 179
  category: vehicle_information
  question: 'According to Alabama''s window tinting law, the light transmission for
    the front side windows of a passenger car must be at least:'
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: C
  explanation: Alabama law (Act 96-534) specifies that window tinting on the front
    side windows must allow at least 32% light transmission (plus or minus 3% tolerance).
- id: 180
  category: vehicle_information
  question: 'Alabama law requires a white light to illuminate the rear license plate,
    making it clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The rear license plate must be illuminated by a white light so as to
    be clearly legible from a distance of 50 feet to the rear.
- id: 181
  category: vehicle_information
  question: In Alabama, turn signal lights must be visible from a distance of not
    less than how many feet in normal sunlight?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Turn signal lamps must be visible from a distance of not less than
    100 feet both to the front and to the rear in normal sunlight.
- id: 182
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of a vehicle
    in Alabama, a red flag (day) or red light (night) must be attached to the end
    of the load?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: C
  explanation: Alabama law requires a red flag at least 12 inches square during the
    day, or a red light at night, if a load extends more than 4 feet beyond the rear
    of the vehicle body.
- id: 183
  category: vehicle_information
  question: 'In Alabama, tires are considered unsafe and do not meet legal requirements
    if the tread depth is less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: Tires are legally considered unsafe in Alabama if they are worn to
    the point where less than 2/32 of an inch of tread remains.
- id: 184
  category: vehicle_information
  question: 'Alabama law requires that every motor vehicle''s parking brake must be
    able to hold the vehicle:'
  choices:
    A: Only on level ground
    B: On any grade (hill) upon which it is operated
    C: Only when the vehicle is in gear
    D: Only for a maximum of 10 minutes
  answer: B
  explanation: The parking brake must be adequate to hold the vehicle on any grade
    on which it is operated, under all conditions of loading, on a surface free from
    snow, ice, or loose material.
- id: 185
  category: signs_and_signals
  question: What does a flashing yellow traffic light signify at an Alabama intersection?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection
    C: Proceed with caution
    D: Yield to all traffic, then stop
  answer: C
  explanation: A flashing yellow light means you should slow down and proceed with
    caution, as outlined in the Alabama Driver's Manual.
- id: 186
  category: signs_and_signals
  question: Under Alabama law, what is the specific penalty for speeding in a marked
    construction zone when workers are present?
  choices:
    A: A flat fine of $500
    B: Mandatory 30-day license suspension
    C: Fines are doubled
    D: No extra penalty unless an accident occurs
  answer: C
  explanation: Code of Alabama § 32-5A-171 states that fines for speeding violations
    are doubled when the violation occurs in a construction zone where workers are
    present.
- id: 187
  category: signs_and_signals
  question: 'A pennant-shaped sign (isosceles triangle pointing right) found on the
    left side of the road in Alabama indicates:'
  choices:
    A: A school zone ahead
    B: A no-passing zone
    C: A yield requirement
    D: A dead end
  answer: B
  explanation: The pennant-shaped sign is used specifically to mark the beginning
    of a no-passing zone and is placed on the left side of the road.
- id: 188
  category: signs_and_signals
  question: In Alabama, what do double solid yellow lines in the center of the roadway
    mean?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only on the right
    C: Passing is prohibited in both directions
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    traffic moving in either direction.
- id: 189
  category: signs_and_signals
  question: What is the meaning of a horizontal rectangular sign with a green background
    in Alabama?
  choices:
    A: Warning of hazards ahead
    B: Regulatory instructions like speed limits
    C: Guide information, such as directions or distances
    D: Motorist services like fuel or lodging
  answer: C
  explanation: Green rectangular signs are guide signs that provide directional and
    distance information to drivers.
- id: 190
  category: signs_and_signals
  question: When you see a circular yellow sign with a black 'X' and the letters 'RR',
    what should you expect ahead?
  choices:
    A: A rest area
    B: A railroad crossing
    C: A road repair zone
    D: A roundabout
  answer: B
  explanation: The round yellow sign with a black 'X' and 'RR' is the advance warning
    sign for a railroad crossing.
- id: 191
  category: signs_and_signals
  question: In Alabama, if you are approaching a school bus with its red lights flashing
    and stop arm extended on a highway with no median or barrier, who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic meeting the bus from the front
    C: Traffic in both directions
    D: No one, if there are at least four lanes
  answer: C
  explanation: Alabama law requires traffic in both directions to stop for a school
    bus with flashing red lights on any undivided highway.
- id: 192
  category: signs_and_signals
  question: What does a solid white line painted across a lane at an intersection
    represent in Alabama?
  choices:
    A: A crosswalk for pedestrians only
    B: A stop line, indicating where to stop for a sign or signal
    C: A lane divider for turning traffic
    D: A parking boundary
  answer: B
  explanation: A solid white line across a lane is a stop line, showing drivers the
    exact point where they must stop at a stop sign or traffic signal.
- id: 193
  category: signs_and_signals
  question: 'In Alabama, a diamond-shaped sign with an orange background is used to
    indicate:'
  choices:
    A: General warnings
    B: School zones
    C: Construction or maintenance areas
    D: Public recreation areas
  answer: C
  explanation: Orange diamond-shaped signs are specifically used for construction
    and maintenance warnings.
- id: 194
  category: signs_and_signals
  question: When a traffic signal shows a steady red light and a green arrow pointing
    left, what does it mean for an Alabama driver?
  choices:
    A: You must stop and wait for a green circle
    B: You may turn left, as it is a protected turn
    C: You may turn left only after yielding to oncoming traffic
    D: The green arrow is a warning that the light is about to turn red
  answer: B
  explanation: A green arrow means you have a protected turn in the direction of the
    arrow, even if the main signal is red.
- id: 195
  category: signs_and_signals
  question: What is the standard shape of a 'Yield' sign in Alabama?
  choices:
    A: Circle
    B: Diamond
    C: Equilateral triangle pointing down
    D: Pentagon
  answer: C
  explanation: The yield sign is an equilateral triangle with the point facing downward,
    usually red and white.
- id: 196
  category: signs_and_signals
  question: In Alabama, what do broken white lines on the pavement indicate?
  choices:
    A: Traffic moving in opposite directions; no passing
    B: Traffic moving in the same direction; passing is permitted
    C: The edge of the roadway
    D: A high-occupancy vehicle (HOV) lane
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction
    and indicate that lane changes are permitted.
- id: 197
  category: signs_and_signals
  question: According to the Alabama Driver's Manual, what does a blue traffic sign
    indicate?
  choices:
    A: Regulatory information
    B: Construction information
    C: Motorist services (gas, food, lodging)
    D: Directional guidance to cities
  answer: C
  explanation: Blue signs are used to provide information about motorist services
    such as hospitals, gas, food, and lodging.
- id: 198
  category: signs_and_signals
  question: 'When approaching a flashing red traffic light in Alabama, a driver must:'
  choices:
    A: Slow down and proceed with caution
    B: Stop completely and proceed only when safe
    C: Yield to traffic on the right only
    D: Treat it as a yellow light
  answer: B
  explanation: A flashing red light has the same meaning as a stop sign; you must
    come to a complete stop and proceed when the way is clear.
- id: 199
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean in Alabama?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Stop completely and yield to all cross traffic
  answer: C
  explanation: A flashing yellow light is a warning to slow down and be especially
    alert as you proceed through the intersection with caution.
- id: 200
  category: signs_and_signals
  question: If you see a solid yellow line on your side of the center dash line, what
    does it indicate under Alabama law?
  choices:
    A: You are in a passing zone
    B: You are in a no-passing zone
    C: The road is one-way only
    D: You must turn right at the next intersection
  answer: B
  explanation: A solid yellow line on your side of the center line means you are in
    a no-passing zone and it is illegal to pass other vehicles.
- id: 201
  category: signs_and_signals
  question: In Alabama, what is the meaning of a pennant-shaped sign located on the
    left side of the road?
  choices:
    A: School Zone ahead
    B: Yield to oncoming traffic
    C: No-Passing Zone
    D: Railroad Crossing ahead
  answer: C
  explanation: A pennant-shaped sign is unique because it is placed on the left side
    of the road to mark the beginning of a no-passing zone.
- id: 202
  category: signs_and_signals
  question: A circular yellow sign with a large black 'X' and the letters 'RR' indicates
    what?
  choices:
    A: A road construction zone
    B: A rural route intersection
    C: A railroad crossing ahead
    D: A restricted roadway
  answer: C
  explanation: The round yellow sign with a black 'X' and 'RR' is a circular warning
    sign indicating a railroad crossing is ahead.
- id: 203
  category: signs_and_signals
  question: Which hand signal should an Alabama driver use to indicate they are slowing
    down or stopping?
  choices:
    A: Left arm extended upward
    B: Left arm extended straight out
    C: Left arm extended downward
    D: Right arm waving out the window
  answer: C
  explanation: To signal a stop or a decrease in speed, the driver should extend their
    left arm downward with the palm facing backward.
- id: 204
  category: signs_and_signals
  question: 'In Alabama, a steady yellow X over a traffic lane means:'
  choices:
    A: The lane is for left turns only
    B: You should prepare to vacate the lane because the signal is about to change
      to a red X
    C: The lane is open for all traffic
    D: Emergency vehicles only
  answer: B
  explanation: A steady yellow X in lane control signals indicates that the driver
    should safely move out of that lane because the signal is about to change to a
    red X (closed lane).
- id: 205
  category: signs_and_signals
  question: What is the primary purpose of a 'crossbuck' sign at a railroad crossing?
  choices:
    A: To tell you the speed limit of the train
    B: To indicate the number of tracks
    C: To serve as a stop sign for all vehicles
    D: To mark the location of the tracks and require you to yield
  answer: D
  explanation: The crossbuck sign is a regulatory sign that marks the location of
    the tracks. Drivers must treat it as a yield sign and stop if a train is approaching.
- id: 206
  category: signs_and_signals
  question: 'An orange triangular sign with a red border found on the rear of a vehicle
    indicates:'
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a slow-moving vehicle (traveling 25 mph or less)
    C: The vehicle is an oversized load
    D: The vehicle is a student driver
  answer: B
  explanation: This specific emblem is the Slow-Moving Vehicle (SMV) symbol, required
    for vehicles designed to travel at speeds of 25 mph or less.
- id: 207
  category: signs_and_signals
  question: What does a green arrow shown simultaneously with a red light mean in
    Alabama?
  choices:
    A: You must wait for the red light to turn green before turning
    B: You may proceed cautiously in the direction of the arrow, yielding to pedestrians
      and other traffic
    C: The signal is broken; you must stop and wait for a police officer
    D: You have the right of way and do not need to yield to anyone
  answer: B
  explanation: A green arrow means you have a 'protected' turn. You may proceed in
    the direction of the arrow, but you must still yield to any pedestrians or vehicles
    already in the intersection.
- id: 208
  category: signs_and_signals
  question: In Alabama, what color are 'Service Signs' that provide information on
    gas, food, and lodging?
  choices:
    A: Green
    B: Brown
    C: Blue
    D: Yellow
  answer: C
  explanation: Service signs, which direct motorists to facilities like hospitals,
    gas stations, and hotels, are blue with white lettering.
- id: 209
  category: signs_and_signals
  question: A vertical rectangular sign with a white background and black lettering
    is typically what type of sign?
  choices:
    A: Warning sign
    B: Regulatory sign
    C: Guide sign
    D: Incident management sign
  answer: B
  explanation: Vertical rectangular signs with black text on a white background are
    regulatory signs, such as speed limit signs, which inform drivers of laws and
    regulations.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 210
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 211
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 212
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 213
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 214
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 215
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 216
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 217
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 218
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 219
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 220
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 221
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 222
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 223
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 224
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 225
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 226
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 227
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 228
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 229
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 230
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 231
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 232
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 233
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 234
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 235
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
