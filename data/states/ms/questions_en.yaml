questions:
- id: 1
  category: license_system
  question: What is the minimum age to apply for a learner's permit in Mississippi?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 15 and a half years old
  answer: B
  explanation: In Mississippi, an individual must be at least 15 years old to apply
    for a learner's permit.
- id: 2
  category: license_system
  question: Under Mississippi's Graduated Driver's License (GDL) law, how long must
    a teenager hold a learner's permit before they are eligible for an intermediate
    license?
  choices:
    A: 6 months
    B: 9 months
    C: 12 months
    D: 2 years
  answer: C
  explanation: Mississippi law requires permit holders to maintain their learner's
    permit for at least 12 months before applying for an intermediate license.
- id: 3
  category: license_system
  question: What are the nighttime driving restrictions for a Mississippi intermediate
    license holder on Sunday through Thursday?
  choices:
    A: No driving between 9:00 PM and 6:00 AM
    B: No driving between 10:00 PM and 6:00 AM
    C: No driving between 11:00 PM and 5:00 AM
    D: No driving between midnight and 6:00 AM
  answer: B
  explanation: Intermediate license holders in Mississippi may not drive between 10:00
    PM and 6:00 AM Sunday through Thursday.
- id: 4
  category: license_system
  question: To obtain a Mississippi driver's license, an applicant under the age of
    18 must provide which specific school-related document?
  choices:
    A: A recent report card with a C average
    B: A valid student ID card
    C: A Certification of School Attendance form signed by school officials
    D: A letter of recommendation from a teacher
  answer: C
  explanation: Applicants under 18 must present a Certification of School Attendance
    form (not more than 30 days old or 60 days during summer) to the DPS.
- id: 5
  category: license_system
  question: A new resident to Mississippi who holds a valid out-of-state driver's
    license must obtain a Mississippi license within how many days of establishing
    residency?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 10 days
  answer: B
  explanation: According to Mississippi law, new residents have 60 days to obtain
    a Mississippi driver's license after moving to the state.
- id: 6
  category: license_system
  question: What is the minimum visual acuity required to pass the vision test for
    a Mississippi driver's license without restrictions?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Mississippi requires a minimum visual acuity of 20/40 in each eye or
    both eyes together to pass the vision screening without restrictions.
- id: 7
  category: license_system
  question: In Mississippi, a standard Class R driver's license can be issued for
    which of the following terms?
  choices:
    A: 2 years or 5 years
    B: 4 years or 8 years
    C: 1 year or 3 years
    D: 5 years or 10 years
  answer: B
  explanation: Mississippi residents have the option to renew or purchase a driver's
    license for a term of either 4 years or 8 years.
- id: 8
  category: license_system
  question: What are the minimum liability insurance requirements for a motor vehicle
    in Mississippi?
  choices:
    A: $10,000/$20,000/$10,000
    B: $25,000/$50,000/$25,000
    C: $50,000/$100,000/$50,000
    D: $15,000/$30,000/$15,000
  answer: B
  explanation: Mississippi's mandatory liability insurance limits are $25,000 for
    bodily injury per person, $50,000 for bodily injury per accident, and $25,000
    for property damage.
- id: 9
  category: license_system
  question: 'If you change your address within Mississippi, you are required by law
    to notify the Department of Public Safety (DPS) within:'
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Mississippi law requires drivers to notify the DPS of an address change
    within 30 days of the move.
- id: 10
  category: license_system
  question: While driving with a learner's permit in Mississippi, who must be seated
    in the front seat next to the driver?
  choices:
    A: Any licensed driver
    B: A licensed driver who is at least 18 years old
    C: A licensed driver who is at least 21 years old
    D: A parent or legal guardian only
  answer: C
  explanation: A permit holder must be accompanied by a licensed driver who is at
    least 21 years of age and seated in the seat beside the driver.
- id: 11
  category: license_system
  question: At what age is a Mississippi driver eligible for a 'Regular' Class R license
    that no longer carries GDL restrictions?
  choices:
    A: 16 years old
    B: 16 and a half years old
    C: 17 years old
    D: 18 years old
  answer: C
  explanation: GDL restrictions (like nighttime driving limits) apply to the intermediate
    license. At age 17, a driver is eligible for a regular license without those specific
    GDL time constraints.
- id: 12
  category: license_system
  question: If a Mississippi driver's license has been expired for more than ______,
    the applicant must retake the written and driving tests.
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: If a license is expired for more than one year, the applicant is treated
    as a new driver and must retake the required tests.
- id: 13
  category: license_system
  question: What is the fine for a first-offense conviction of driving without the
    required minimum liability insurance in Mississippi?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: The fine for a first-offense conviction of failing to maintain liability
    insurance in Mississippi is $500, along with a license suspension.
- id: 14
  category: license_system
  question: Which of the following is NOT a requirement to obtain a Mississippi driver's
    license for the first time?
  choices:
    A: Proof of Social Security number
    B: Two proofs of Mississippi residency
    C: Certified birth certificate
    D: Proof of vehicle ownership (Title)
  answer: D
  explanation: While you need proof of identity, residency, and SSN, you do not need
    to own a vehicle (or show a title) to obtain a driver's license.
- id: 15
  category: license_system
  question: In Mississippi, what is the minimum age to apply for a 'Hardship' driver's
    license due to extreme necessity?
  choices:
    A: 13 years old
    B: 14 years old
    C: 15 years old
    D: 15 and a half years old
  answer: B
  explanation: According to MS Code § 63-1-9, a hardship license may be issued to
    a person who is at least 14 years old if they can justify an extreme necessity
    for driving.
- id: 16
  category: license_system
  question: 'Under Mississippi law, any male applicant between the ages of 18 and
    26 who applies for a driver''s license is:'
  choices:
    A: Required to provide proof of employment
    B: Automatically registered for the Selective Service
    C: Required to pay an additional 'young driver' fee
    D: Exempt from the written knowledge test
  answer: B
  explanation: Mississippi law requires that any male between 18 and 26 applying for
    a license or ID be registered with the Selective Service System in compliance
    with federal law.
- id: 17
  category: license_system
  question: A Mississippi Class D driver's license is specifically required for which
    of the following?
  choices:
    A: Operating a motorcycle
    B: Operating a vehicle over 26,000 lbs GVWR
    C: Operating a vehicle for commercial purposes that does not require a CDL (e.g.,
      delivery or taxi)
    D: Operating a farm tractor on public roads
  answer: C
  explanation: A Class D license is required for drivers of commercial vehicles that
    are not heavy enough to require a Class A, B, or C Commercial Driver's License,
    such as small delivery trucks or taxis.
- id: 18
  category: license_system
  question: 'If a parent or guardian who signed the application for a minor''s Mississippi
    driver''s license decides they no longer want to be responsible for the minor''s
    driving, they may:'
  choices:
    A: Only cancel the license if the minor receives a ticket
    B: Request in writing that the license be cancelled
    C: Wait until the license expires to refuse renewal
    D: Nothing; the signature is binding until the minor turns 18
  answer: B
  explanation: In Mississippi, the person who signed the application for a minor's
    license can file a written request to have the license cancelled, which relieves
    them of further liability.
- id: 19
  category: license_system
  question: In Mississippi, if a student under the age of 18 drops out of school and
    does not enroll in a GED program, what happens to their driving privileges?
  choices:
    A: Nothing, as long as they have a job
    B: Their license is suspended until they turn 18 or return to school
    C: They are restricted to driving only during daylight hours
    D: They must pay a $500 fine to keep their license
  answer: B
  explanation: Mississippi law requires students under 18 to be enrolled in school
    or a GED program; if they drop out, the school notifies the DPS, and the license
    is suspended.
- id: 20
  category: license_system
  question: What is the standard reinstatement fee for a Mississippi driver's license
    that was suspended for reasons other than a DUI or a drug-related offense?
  choices:
    A: $25
    B: $50
    C: $100
    D: $175
  answer: C
  explanation: The standard reinstatement fee for a suspended license in Mississippi
    is $100, though DUI-related reinstatements carry higher fees.
- id: 21
  category: license_system
  question: If your Mississippi driver's license is lost or destroyed, you must apply
    for a duplicate. Which of the following is true regarding this process?
  choices:
    A: You must retake the written test
    B: You must retake the driving test
    C: You must provide proof of identification and pay a fee
    D: You can only apply for a duplicate once every 5 years
  answer: C
  explanation: To obtain a duplicate license in Mississippi, you must visit a DPS
    location, provide identification documents, and pay the required duplicate fee.
- id: 22
  category: license_system
  question: A Mississippi 'REAL ID' compliant license is distinguished by which symbol
    in the upper right-hand corner?
  choices:
    A: A blue anchor
    B: A gold star
    C: A red 'X'
    D: The state seal
  answer: B
  explanation: Mississippi REAL ID compliant licenses feature a gold star in the upper
    right-hand corner, indicating the license meets federal security standards for
    boarding aircraft.
- id: 23
  category: license_system
  question: When applying for an original Mississippi driver's license, which document
    is required to verify your Social Security Number?
  choices:
    A: A handwritten note from a parent
    B: An original Social Security card or a W-2 form
    C: A school ID card
    D: A birth certificate
  answer: B
  explanation: Mississippi requires proof of a Social Security Number, which can be
    verified using an original Social Security card, a W-2, or a 1099 form.
- id: 24
  category: license_system
  question: 'To obtain a Class M (Motorcycle) endorsement in Mississippi, an applicant
    must:'
  choices:
    A: Be at least 21 years old
    B: Hold a valid Class R license and pass a motorcycle knowledge and skills test
    C: Only pay an additional $20 fee
    D: Provide proof of owning a motorcycle
  answer: B
  explanation: A Class M endorsement requires passing a specific motorcycle written
    test and a skills (road) test, in addition to holding a standard license.
- id: 25
  category: license_system
  question: 'When taking the driving skills test in Mississippi, the vehicle used
    for the test must:'
  choices:
    A: Be provided by the Department of Public Safety
    B: Be a late-model vehicle (less than 5 years old)
    C: Have a valid license plate and proof of insurance
    D: Have dual brakes for the examiner
  answer: C
  explanation: Applicants must provide their own vehicle for the road test, and it
    must be properly registered with a valid tag and have current liability insurance.
- id: 26
  category: license_system
  question: How early can a Mississippi driver renew their driver's license before
    the expiration date?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Mississippi allows drivers to renew their license up to 6 months (180
    days) before the expiration date.
- id: 27
  category: license_system
  question: 'Under Mississippi''s Implied Consent Law, if you refuse to submit to
    a chemical breath test for the first time, your license will be suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: According to MS Code § 63-11-5, a first-time refusal to take a breath
    test results in an immediate 90-day license suspension.
- id: 28
  category: license_system
  question: 'Mississippi''s ''Motor Voter'' law allows you to register to vote when
    you apply for or renew your driver''s license, provided you are at least:'
  choices:
    A: 16 years old
    B: 17 years old (if you will be 18 by the next election)
    C: 18 years old
    D: 21 years old
  answer: C
  explanation: Under the National Voter Registration Act, Mississippi residents can
    register to vote at the DPS if they are 18 years of age or older.
- id: 29
  category: license_system
  question: If you wish to be an organ donor, you can indicate this on your Mississippi
    driver's license. At what age does this designation become legally binding without
    parental consent?
  choices:
    A: 15 years old
    B: 16 years old
    C: 18 years old
    D: 21 years old
  answer: C
  explanation: While minors can have the organ donor designation on their license,
    it becomes a legally binding document under the Uniform Anatomical Gift Act once
    the individual reaches 18.
- id: 30
  category: driver_testing
  question: When preparing to make a turn in Mississippi, you must continuously signal
    your intention for at least how many feet before turning?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Mississippi law requires drivers to signal a turn continuously for
    at least 100 feet before the turn is made.
- id: 31
  category: driver_testing
  question: In Mississippi, it is illegal to park your vehicle within how many feet
    of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Mississippi law prohibits parking within 15 feet of a fire hydrant.
- id: 32
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit for passenger
    vehicles on Mississippi interstate highways?
  choices:
    A: 60 mph
    B: 65 mph
    C: 70 mph
    D: 75 mph
  answer: C
  explanation: The maximum speed limit on Mississippi interstate highways is 70 mph
    unless otherwise posted.
- id: 33
  category: driver_testing
  question: If you are involved in an accident in Mississippi that results in injury,
    death, or property damage exceeding ______, you must file a written report (SR-1)
    with the Department of Public Safety.
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: B
  explanation: Mississippi law requires an SR-1 report to be filed if an accident
    results in total property damage to one person exceeding $500 or any bodily injury
    or death.
- id: 34
  category: driver_testing
  question: 'To maintain a safe following distance under normal conditions, the Mississippi
    Driver''s Manual suggests following the vehicle ahead by at least:'
  choices:
    A: One car length for every 10 mph of speed
    B: Two car lengths for every 10 mph of speed
    C: 50 feet regardless of speed
    D: One car length for every 20 mph of speed
  answer: A
  explanation: The Mississippi Driver's Manual recommends a following distance of
    at least one car length for every 10 miles per hour of speed.
- id: 35
  category: driver_testing
  question: 'In Mississippi, you are required by law to turn on your headlights when
    visibility is less than:'
  choices:
    A: 300 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Mississippi law requires headlights to be on from sunset to sunrise
    and whenever visibility is less than 500 feet due to weather or other conditions.
- id: 36
  category: driver_testing
  question: When a school bus is stopped on a four-lane highway that is divided by
    a median strip, which traffic is required to stop?
  choices:
    A: Traffic in all lanes must stop
    B: Only traffic following the bus must stop
    C: Only traffic in the oncoming lanes must stop
    D: No traffic is required to stop if there is a median
  answer: B
  explanation: On a highway divided by a median strip, only traffic following the
    school bus is required to stop. Traffic in the oncoming lanes (separated by the
    median) may proceed with caution.
- id: 37
  category: driver_testing
  question: What is the range of the fine for a first-offense conviction of littering
    on Mississippi highways?
  choices:
    A: $10 to $50
    B: $50 to $250
    C: $100 to $500
    D: $500 to $1,000
  answer: B
  explanation: Under Mississippi law, a person found guilty of littering can be fined
    not less than $50 nor more than $250.
- id: 38
  category: driver_testing
  question: You must dim your high-beam headlights when you are within how many feet
    of an oncoming vehicle?
  choices:
    A: 250 feet
    B: 350 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Mississippi law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet.
- id: 39
  category: driver_testing
  question: When parking a vehicle headed downhill on a two-way street with a curb,
    how should the front wheels be positioned?
  choices:
    A: Turned toward the curb
    B: Turned away from the curb
    C: Parallel to the curb
    D: It does not matter as long as the parking brake is set
  answer: A
  explanation: When parking downhill with a curb, you should turn your wheels toward
    the curb so the vehicle will roll into the curb if the brakes fail.
- id: 40
  category: driver_testing
  question: Mississippi's 'Move Over Law' requires drivers to move to the non-adjacent
    lane or slow down when approaching which of the following on the shoulder?
  choices:
    A: Only police cars
    B: Only fire trucks and ambulances
    C: Any authorized vehicle with flashing lights (emergency, utility, or recovery)
    D: Only mail delivery vehicles
  answer: C
  explanation: Mississippi's Move Over Law applies to all authorized emergency vehicles,
    including police, fire, ambulance, utility service vehicles, and recovery vehicles
    (tow trucks) using flashing lights.
- id: 41
  category: driver_testing
  question: 'A first-offense DUI conviction in Mississippi can result in a jail sentence
    of up to:'
  choices:
    A: 24 hours
    B: 48 hours
    C: 72 hours
    D: 1 week
  answer: B
  explanation: For a first DUI offense in Mississippi, a person may be imprisoned
    in the county jail for up to 48 hours.
- id: 42
  category: driver_testing
  question: In Mississippi, what is the maximum speed limit for cars and trucks on
    interstate highways, unless otherwise posted?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: B
  explanation: According to the Mississippi Driver's Manual, the maximum speed limit
    for cars and trucks on interstate highways is 70 mph unless otherwise posted.
- id: 43
  category: driver_testing
  question: Under Mississippi law, how far in advance must you signal your intention
    to turn?
  choices:
    A: 50 feet
    B: 75 feet
    C: 100 feet
    D: 200 feet
  answer: C
  explanation: Mississippi law requires drivers to signal a continuous turn signal
    for at least 100 feet before making a turn.
- id: 44
  category: driver_testing
  question: 'In Mississippi, you must file an accident report with the Department
    of Public Safety if the property damage to any one person exceeds:'
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $1,500
  answer: B
  explanation: Mississippi law requires an accident report to be filed if there is
    an injury, death, or property damage exceeding $500.
- id: 45
  category: driver_testing
  question: 'When driving in Mississippi, you must use your headlights from sunset
    to sunrise and whenever visibility is less than:'
  choices:
    A: 300 feet
    B: 400 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Mississippi law requires headlights to be on between sunset and sunrise,
    or when visibility is reduced to less than 500 feet.
- id: 46
  category: driver_testing
  question: In Mississippi, you are prohibited from passing another vehicle when you
    are within how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: According to the Mississippi Driver's Manual, you must not pass another
    vehicle within 100 feet of an intersection, railroad crossing, bridge, viaduct,
    or tunnel.
- id: 47
  category: driver_testing
  question: 'When meeting an oncoming vehicle at night in Mississippi, you must dim
    your high-beam headlights when the vehicle is within:'
  choices:
    A: 250 feet
    B: 350 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Mississippi law requires drivers to dim their high beams when an oncoming
    vehicle comes within 500 feet.
- id: 48
  category: driver_testing
  question: In Mississippi, when are you NOT required to stop for a school bus with
    flashing red lights and an extended stop arm?
  choices:
    A: When the bus is on a two-lane road
    B: When you are traveling in the opposite direction on a highway divided by a
      median or barrier
    C: When you are traveling in the opposite direction on a four-lane road without
      a median
    D: You must always stop for a school bus regardless of the road type
  answer: B
  explanation: In Mississippi, you do not have to stop for a school bus if you are
    on a divided highway with a median strip or a physical barrier and you are traveling
    in the opposite direction of the bus.
- id: 49
  category: driver_testing
  question: According to Mississippi law, what is the maximum speed limit for a school
    bus while transporting children on a US or State highway?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: Mississippi law sets the maximum speed limit for school buses at 45
    mph on highways, unless they are on an interstate, where the limit is 50 mph.
- id: 50
  category: driver_testing
  question: In Mississippi, if you are convicted of a first-offense DUI, you will
    be required to attend and complete which program?
  choices:
    A: MS Alcohol Safety Education Program (MASEP)
    B: National Safety Council Defensive Driving
    C: Mississippi Driver Improvement School
    D: MADD Victim Impact Panel only
  answer: A
  explanation: A first-offense DUI conviction in Mississippi requires the completion
    of the Mississippi Alcohol Safety Education Program (MASEP).
- id: 51
  category: driver_testing
  question: When parallel parking in Mississippi, your right wheels must be within
    how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: The Mississippi Driver's Manual states that when parallel parking,
    your wheels must be within 12 inches of the curb.
- id: 52
  category: driver_responsibility
  question: If a law enforcement officer does not investigate your accident, how many
    days do you have to file a written report (SR-1) with the Mississippi Department
    of Public Safety?
  choices:
    A: 3 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: Mississippi law requires drivers to file a written report of a qualifying
    accident within 10 days if a law enforcement officer did not file a report.
- id: 53
  category: driver_responsibility
  question: When a new resident moves to Mississippi, they must obtain a Mississippi
    license tag (registration) for their vehicle within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: New residents must register their vehicles and obtain Mississippi license
    tags within 30 days of establishing residency.
- id: 54
  category: driver_responsibility
  question: 'Under Mississippi''s Implied Consent Law, by operating a motor vehicle
    on public highways, you have given consent to:'
  choices:
    A: A search of your vehicle's trunk
    B: A chemical test of your breath, blood, or urine to determine intoxication
    C: A review of your personal cell phone records
    D: A mandatory 12-month license renewal
  answer: B
  explanation: The Implied Consent Law means that by driving on MS roads, you agree
    to submit to chemical testing if a law enforcement officer has reasonable grounds
    to believe you are driving under the influence.
- id: 55
  category: driver_responsibility
  question: 'Mississippi law requires that children be secured in a child passenger
    restraint device (car seat) if they are:'
  choices:
    A: Under 2 years of age
    B: Under 4 years of age
    C: Under 6 years of age
    D: Under 8 years of age
  answer: B
  explanation: Mississippi law requires every person transporting a child under the
    age of 4 to provide for the protection of the child by properly using a child
    passenger restraint device.
- id: 56
  category: driver_responsibility
  question: 'In Mississippi, children between the ages of 4 and 7 who measure less
    than 4 feet 9 inches tall and weigh less than 65 pounds must use:'
  choices:
    A: A standard adult seat belt
    B: A belt-positioning booster seat system
    C: The front passenger seat only
    D: No restraint if they are in the back seat
  answer: B
  explanation: Mississippi law requires children aged 4 through 7 to use a booster
    seat if they meet the height and weight criteria (under 4'9" and under 65 lbs).
- id: 57
  category: driver_responsibility
  question: 'If you are convicted of a DUI that caused the death or serious injury
    of another person in Mississippi, the charge is ''Aggravated DUI'' and carries
    a prison sentence of:'
  choices:
    A: 1 to 5 years
    B: 2 to 25 years
    C: 10 to 50 years
    D: Life in prison
  answer: B
  explanation: Aggravated DUI in Mississippi is a felony punishable by 2 to 25 years
    in the state penitentiary for each death or injury caused.
- id: 58
  category: driver_responsibility
  question: 'If you hit a parked vehicle and cannot find the owner, Mississippi law
    requires you to:'
  choices:
    A: Wait at the scene for at least 2 hours
    B: Drive away if there is no visible damage
    C: Leave a written notice with your name, address, and an explanation in a conspicuous
      place
    D: Only report it if the damage appears to be over $1,000
  answer: C
  explanation: Mississippi law requires drivers who strike an unattended vehicle to
    locate the owner or leave a note with their contact information and notify the
    police.
- id: 59
  category: driver_responsibility
  question: 'If your Mississippi driver''s license is suspended for a violation of
    the Safety Responsibility Act (no insurance), you must usually file proof of financial
    responsibility (SR-22) for:'
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 5 years
  answer: C
  explanation: When proof of financial responsibility is required to reinstate a license
    in Mississippi, it must typically be maintained for a period of 3 years.
- id: 60
  category: driver_responsibility
  question: Which of the following is true regarding Mississippi's seat belt law for
    passenger vehicles?
  choices:
    A: Only the driver must wear a seat belt
    B: Only front-seat passengers must wear seat belts
    C: Only passengers under 18 must wear seat belts
    D: The driver and every passenger in the vehicle must wear a seat belt
  answer: D
  explanation: As of 2017, Mississippi law requires all occupants in a passenger vehicle
    to wear a seat belt, regardless of where they are seated.
- id: 61
  category: driver_responsibility
  question: If you are involved in an accident in Mississippi and a judgment is rendered
    against you that you fail to pay, what action will the Department of Public Safety
    take?
  choices:
    A: Increase your vehicle registration fees
    B: Suspend your driver's license until the judgment is satisfied
    C: Seize your vehicle immediately
    D: Require you to retake the driving test every month
  answer: B
  explanation: Under the Safety Responsibility Act, if you fail to satisfy a judgment
    resulting from an automobile accident within 60 days, your license will be suspended.
- id: 62
  category: driver_responsibility
  question: If you are involved in an accident in Mississippi that requires a written
    report, how many days do you have to file the SR-1 form with the Department of
    Public Safety?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: Mississippi law requires drivers to file an accident report (SR-1)
    within 10 days if the accident meets the reporting criteria for injury, death,
    or property damage.
- id: 63
  category: driver_responsibility
  question: 'In Mississippi, if you are 21 years of age or older and refuse to submit
    to a chemical breath test when requested by an officer, your driving privileges
    will be immediately suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Under the Implied Consent law, a first-offense refusal to submit to
    a chemical test results in an immediate 90-day suspension of driving privileges.
- id: 64
  category: driver_responsibility
  question: Mississippi has a 'Zero Tolerance' law for drivers under the age of 21.
    At what Blood Alcohol Content (BAC) level is a minor considered to be driving
    under the influence?
  choices:
    A: 0.01% or higher
    B: 0.02% or higher
    C: 0.05% or higher
    D: 0.08% or higher
  answer: B
  explanation: For drivers under the age of 21, Mississippi law sets the legal limit
    for BAC at 0.02%.
- id: 65
  category: driver_responsibility
  question: 'For drivers 21 years of age or older, it is illegal to operate a motor
    vehicle in Mississippi with a Blood Alcohol Content (BAC) of:'
  choices:
    A: 0.02% or higher
    B: 0.04% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: In Mississippi, the legal limit for BAC for adult drivers (21 and over)
    is 0.08%.
- id: 66
  category: driver_responsibility
  question: What is the maximum legal Blood Alcohol Content (BAC) for a person operating
    a commercial motor vehicle in Mississippi?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Commercial drivers in Mississippi are held to a stricter standard and
    are considered DUI if their BAC is 0.04% or higher.
- id: 67
  category: driver_responsibility
  question: According to Mississippi's 'Move Over' law, what must you do when approaching
    a stationary emergency vehicle with its lights flashing on a highway with at least
    four lanes?
  choices:
    A: Stop completely until the vehicle moves
    B: Maintain speed but move to the right-hand lane
    C: Move to the lane not adjacent to the emergency vehicle, if safe to do so
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Mississippi law requires drivers to move into the lane not adjacent
    to the emergency vehicle or slow down significantly if changing lanes is unsafe.
- id: 68
  category: driver_responsibility
  question: 'In Mississippi, a person convicted of littering on state highways may
    be fined between:'
  choices:
    A: $10 and $50
    B: $50 and $250
    C: $250 and $500
    D: $500 and $1,000
  answer: B
  explanation: Mississippi law imposes a fine of no less than $50 and no more than
    $250 for littering on public highways.
- id: 69
  category: driver_responsibility
  question: Under Mississippi law, who is responsible for ensuring that all passengers
    under the age of 15 are properly restrained by a seat belt or child safety seat?
  choices:
    A: The passenger themselves
    B: The passenger's parent, even if not in the car
    C: The driver of the vehicle
    D: No one, it is a personal choice
  answer: C
  explanation: The driver is legally responsible for ensuring that all children under
    the age of 15 are properly buckled up, regardless of where they are sitting in
    the vehicle.
- id: 70
  category: driver_responsibility
  question: Mississippi law requires that window tinting on a vehicle allow at least
    what percentage of light to pass through?
  choices:
    A: 20%
    B: 28%
    C: 35%
    D: 50%
  answer: B
  explanation: Mississippi law (MS Code 63-7-59) requires that window tinting on the
    side and rear windows must have a light transmittance of 28% or more.
- id: 71
  category: driver_responsibility
  question: In Mississippi, your driver's license can be suspended for which of the
    following non-driving related reasons?
  choices:
    A: Failure to pay child support
    B: Failure to graduate high school
    C: Failure to vote in a general election
    D: Failure to maintain a library card
  answer: A
  explanation: Mississippi law allows for the suspension of a driver's license for
    failure to pay court-ordered child support.
- id: 72
  category: driver_responsibility
  question: What is the minimum fine for a first-offense conviction of illegally parking
    in a space designated for persons with disabilities in Mississippi?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: In Mississippi, the minimum fine for illegally parking in a handicapped-accessible
    space is $200.
- id: 73
  category: driver_responsibility
  question: 'If your license is suspended for a DUI or a violation of the Financial
    Responsibility Law, you may be required to maintain an SR-22 insurance certificate
    for a period of:'
  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: Permanently
  answer: B
  explanation: Mississippi typically requires drivers to maintain an SR-22 (proof
    of financial responsibility) for 3 years following a suspension for DUI or lack
    of insurance.
- id: 74
  category: safe_driving_rules
  question: When you are intending to turn, Mississippi law requires you to signal
    continuously for at least how many feet before making the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Mississippi law requires drivers to signal their intention to turn
    for at least 100 feet before the turn is made.
- id: 75
  category: safe_driving_rules
  question: Mississippi law prohibits passing another vehicle when you are within
    how many feet of any bridge, viaduct, or tunnel?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: You may not pass another vehicle when approaching within 100 feet of
    any bridge, viaduct, or tunnel where the view is obstructed.
- id: 76
  category: safe_driving_rules
  question: The Mississippi Driver's Manual recommends following the vehicle in front
    of you by at least how much distance?
  choices:
    A: One car length for every 10 mph of speed
    B: Two car lengths for every 10 mph of speed
    C: Exactly 50 feet regardless of speed
    D: One car length for every 20 mph of speed
  answer: A
  explanation: The Mississippi Driver's Manual suggests a safe following distance
    of one car length for every 10 miles per hour of speed.
- id: 77
  category: safe_driving_rules
  question: When meeting a school bus with flashing red lights on a divided highway
    with a median strip, what must a driver traveling in the opposite direction do?
  choices:
    A: Stop until the lights stop flashing
    B: Slow down to 15 mph and proceed with caution
    C: You are not required to stop
    D: Stop only if there are children crossing the median
  answer: C
  explanation: In Mississippi, if you are traveling on a divided highway with a median
    strip or a barrier, you are not required to stop for a school bus that is traveling
    in the opposite direction.
- id: 78
  category: safe_driving_rules
  question: When following another vehicle at night in Mississippi, you must dim your
    high beam headlights when you are within how many feet of the vehicle ahead?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: C
  explanation: Mississippi law requires drivers to dim their high beam headlights
    when following another vehicle within 500 feet.
- id: 79
  category: safe_driving_rules
  question: At a four-way stop in Mississippi, if two vehicles arrive at the intersection
    at the same time, who has the right-of-way?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver who is turning right
    D: The driver on the more heavily traveled road
  answer: B
  explanation: Under Mississippi right-of-way rules, if two vehicles reach an intersection
    at the same time, the driver on the left must yield to the driver on the right.
- id: 80
  category: safe_driving_rules
  question: 'Under Mississippi''s Zero Tolerance Law, a person under the age of 21
    is considered to be driving under the influence if their blood alcohol concentration
    (BAC) is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Mississippi's Zero Tolerance Law sets the legal BAC limit for drivers
    under 21 at 0.02%.
- id: 81
  category: safe_driving_rules
  question: In Mississippi, at what speed can hydroplaning (tires losing contact with
    the road due to water) begin?
  choices:
    A: 25 mph
    B: 35 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: The Mississippi Driver's Manual states that hydroplaning can begin
    at speeds as low as 35 mph in heavy rain.
- id: 82
  category: safe_driving_rules
  question: According to the Mississippi Driver's Manual, what is the recommended
    following distance behind the vehicle in front of you?
  choices:
    A: One car length for every 10 miles per hour of speed
    B: Two car lengths regardless of speed
    C: 50 feet at all times
    D: One car length for every 20 miles per hour of speed
  answer: A
  explanation: Mississippi's manual suggests a following distance of one car length
    for every 10 miles per hour of speed to allow for safe braking.
- id: 83
  category: safe_driving_rules
  question: In Mississippi, when is it legal to pass a school bus that is stopped
    on a divided highway with a median or barrier between the roadways?
  choices:
    A: Never, you must always stop
    B: Only if the bus driver signals you to pass
    C: Only if you are traveling in the opposite direction of the bus
    D: Only if you are traveling in the same direction as the bus
  answer: C
  explanation: On a divided highway with a median strip or physical barrier, you are
    not required to stop for a school bus if you are traveling in the opposite direction.
- id: 84
  category: safe_driving_rules
  question: In Mississippi, you must not park your vehicle within how many feet of
    a stop sign?
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Mississippi law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic-control signal located at the side of a roadway.
- id: 85
  category: safe_driving_rules
  question: When two vehicles enter an intersection from different highways at approximately
    the same time, which driver has the right-of-way in Mississippi?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver traveling at a higher speed
    D: The driver of the larger vehicle
  answer: B
  explanation: When two vehicles reach an intersection at the same time, the driver
    of the vehicle on the left must yield the right-of-way to the vehicle on the right.
- id: 86
  category: safe_driving_rules
  question: When turning right from a one-way street onto another one-way street,
    which lane should you turn from?
  choices:
    A: The center lane
    B: The lane closest to the left curb
    C: The lane closest to the right curb
    D: Any lane available
  answer: C
  explanation: To make a right turn, you should move into the lane closest to the
    right curb and complete the turn into the right lane of the new street.
- id: 87
  category: defensive_driving
  question: In Mississippi, at what speed can hydroplaning begin, causing your tires
    to lose contact with the road surface during a heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 50 mph
    D: 65 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 88
  category: defensive_driving
  question: 'Mississippi law requires motorists to turn on their headlights whenever
    they are using:'
  choices:
    A: Cruise control
    B: Windshield wipers
    C: Hazard lights
    D: Air conditioning
  answer: B
  explanation: Under Mississippi law (MS Code § 63-7-11), headlights must be turned
    on whenever windshield wipers are in use due to precipitation or unfavorable atmospheric
    conditions.
- id: 89
  category: defensive_driving
  question: 'To avoid last-minute braking or the need to turn suddenly, Mississippi
    drivers should look ahead at least:'
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 25 seconds
    D: 30 to 40 seconds
  answer: B
  explanation: Defensive driving in Mississippi involves scanning the road 10 to 15
    seconds ahead to identify potential hazards early.
- id: 90
  category: defensive_driving
  question: When driving in heavy fog in Mississippi, which lights should you use
    to ensure maximum visibility and safety?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: Low-beam headlights should be used in fog. High beams reflect off the
    moisture in the fog, causing glare and making it harder to see.
- id: 91
  category: defensive_driving
  question: 'Mississippi''s ''Move Over'' law requires drivers approaching a stationary
    emergency vehicle with flashing lights to:'
  choices:
    A: Stop completely until signaled to pass
    B: Maintain speed but honk the horn
    C: Move to the lane farthest away from the emergency vehicle if safe to do so
    D: Speed up to clear the area quickly
  answer: C
  explanation: The Move Over law requires drivers to vacate the lane closest to stationary
    emergency vehicles or slow down if a lane change is unsafe.
- id: 92
  category: defensive_driving
  question: In Mississippi, what is the penalty for speeding in a highway work zone
    when workers are present?
  choices:
    A: A verbal warning only
    B: Fines are doubled
    C: Mandatory 30-day license suspension
    D: Fines are tripled
  answer: B
  explanation: Mississippi law mandates that fines for speeding violations are doubled
    when committed in a designated work zone where workers are present.
- id: 93
  category: defensive_driving
  question: When approaching a railroad crossing in Mississippi with lowered gates
    or flashing lights, you must stop your vehicle within how many feet of the nearest
    rail?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Exactly 20 feet
  answer: C
  explanation: Mississippi law requires drivers to stop between 15 and 50 feet from
    the nearest rail at a railroad crossing when signals indicate a train is approaching.
- id: 94
  category: defensive_driving
  question: 'When passing another vehicle on a two-lane road in Mississippi, you should
    not return to your lane until:'
  choices:
    A: You are one car length ahead
    B: You can see the entire front of the passed vehicle in your rearview mirror
    C: You have signaled for at least 5 seconds
    D: The other driver blinks their headlights
  answer: B
  explanation: For safety, you should only return to the right lane once you can see
    the headlights or the entire front of the vehicle you just passed in your rearview
    mirror.
- id: 95
  category: defensive_driving
  question: When following another vehicle at night in Mississippi, at what distance
    must you dim your high-beam headlights?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: None; high beams are allowed when following
  answer: B
  explanation: Under Mississippi law, you must dim your high beams when following
    another vehicle within 250 feet to avoid reflecting glare into their rearview
    mirror.
- id: 96
  category: defensive_driving
  question: At what speed can hydroplaning (where tires lose contact with the road
    and ride on a thin film of water) begin in Mississippi rain conditions?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: Only above 70 mph
    D: Exactly 45 mph
  answer: A
  explanation: The Mississippi Driver's Manual states that hydroplaning can begin
    at speeds as low as 35 mph, and at 55 mph, tires may lose all contact with the
    road.
- id: 97
  category: defensive_driving
  question: To be a defensive driver in Mississippi, how far ahead should you scan
    the road for potential hazards?
  choices:
    A: 5 seconds ahead
    B: 10 to 15 seconds ahead
    C: 30 seconds ahead
    D: Only the car immediately in front of you
  answer: B
  explanation: Defensive driving involves scanning the road 10 to 15 seconds ahead
    to identify and react to potential hazards before they become dangerous.
- id: 98
  category: defensive_driving
  question: When driving in heavy fog in Mississippi, which set of lights should you
    use?
  choices:
    A: High-beam headlights
    B: Parking lights only
    C: Low-beam headlights
    D: Emergency flashers only
  answer: C
  explanation: Low-beam headlights should be used in fog. High beams reflect off the
    fog and create glare, making it harder to see.
- id: 99
  category: defensive_driving
  question: 'If your vehicle is equipped with an Anti-lock Braking System (ABS) and
    you need to stop quickly on a slippery Mississippi road, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes
    D: Shift to neutral and use the emergency brake
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Pumping the brakes
    is for older vehicles without ABS; doing so with ABS defeats the system's purpose.
- id: 100
  category: defensive_driving
  question: When approaching a school bus that is stopped to load or unload children
    on a two-lane road in Mississippi, you must stop at least how many feet away?
  choices:
    A: 5 feet
    B: 10 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: Mississippi law requires drivers to stop at least 10 feet away from
    a school bus when it is loading or unloading passengers.
- id: 101
  category: defensive_driving
  question: When parking a vehicle headed uphill on a two-way street with a curb in
    Mississippi, how should you turn your wheels?
  choices:
    A: To the right (toward the curb)
    B: To the left (away from the curb)
    C: Keep them straight
    D: It does not matter
  answer: B
  explanation: When parking uphill with a curb, turn your wheels to the left so that
    if the vehicle rolls, the back of the front tire will hit the curb and stop the
    car.
- id: 102
  category: alcohol_drugs_health
  question: What does Mississippi's 'Implied Consent' law mean for motorists?
  choices:
    A: You consent to a search of your vehicle at any time.
    B: You agree to take a chemical test for alcohol or drugs if requested by an officer.
    C: You agree to carry at least $25,000 in liability insurance.
    D: You consent to having your license revoked if you are involved in any accident.
  answer: B
  explanation: The Implied Consent law means that by operating a motor vehicle on
    Mississippi public roads, you have given consent to a chemical test (breath, blood,
    or urine) to determine intoxication.
- id: 103
  category: alcohol_drugs_health
  question: 'If a Mississippi driver refuses to submit to a chemical breath test upon
    the request of a law enforcement officer, their license will be immediately seized
    and suspended for a period of:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: Under the Implied Consent law, if you refuse the test, the officer
    will seize your license and your driving privileges will be suspended for 90 days
    for a first offense.
- id: 104
  category: alcohol_drugs_health
  question: A person convicted of a first-offense DUI in Mississippi must complete
    which mandatory program to regain their driving privileges?
  choices:
    A: The Mississippi Driver Improvement Course
    B: The Mississippi Alcohol Safety Education Program (MASEP)
    C: The National Safety Council Defensive Driving Course
    D: A 40-hour community service program
  answer: B
  explanation: Mississippi law requires first-time DUI offenders to complete the Mississippi
    Alcohol Safety Education Program (MASEP).
- id: 105
  category: alcohol_drugs_health
  question: 'In Mississippi, a second DUI conviction within a five-year period will
    result in a license suspension of:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: A second DUI conviction within five years results in a mandatory one-year
    license suspension and a minimum of five days in jail.
- id: 106
  category: alcohol_drugs_health
  question: 'A third DUI conviction within a five-year period in Mississippi is classified
    as a:'
  choices:
    A: Class C Misdemeanor
    B: Class A Misdemeanor
    C: Felony
    D: Administrative Violation
  answer: C
  explanation: In Mississippi, a third DUI conviction within five years is a felony
    offense, punishable by 1 to 5 years in the state penitentiary.
- id: 107
  category: alcohol_drugs_health
  question: If you are taking prescription drugs and need to drive, what is the best
    course of action?
  choices:
    A: Drive only if you feel fine.
    B: Check the label for warnings or ask your doctor about side effects.
    C: Drink coffee to counteract any drowsiness.
    D: Drive slower than the posted speed limit.
  answer: B
  explanation: Many prescription and over-the-counter drugs can impair driving. You
    are legally responsible for your driving even if the drug is prescribed by a doctor.
- id: 108
  category: alcohol_drugs_health
  question: What is the first physical or mental ability affected by alcohol consumption?
  choices:
    A: Vision
    B: Muscle coordination
    C: Judgment
    D: Hearing
  answer: C
  explanation: Alcohol affects judgment and self-control first, which can lead a driver
    to take risks they would not normally take.
- id: 109
  category: alcohol_drugs_health
  question: 'Combining alcohol with other drugs (such as cold medicine or marijuana)
    usually results in:'
  choices:
    A: The effects of each canceling each other out.
    B: No change in the driver's ability.
    C: A synergistic effect, making the impairment much worse than either alone.
    D: Increased alertness.
  answer: C
  explanation: Mixing alcohol and drugs can multiply the effects of both, significantly
    increasing impairment and the risk of a crash.
- id: 110
  category: alcohol_drugs_health
  question: In Mississippi, what is the BAC limit for a driver operating a commercial
    motor vehicle?
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: Under Mississippi law and federal regulations, the BAC limit for commercial
    drivers (CDL holders) is 0.04%.
- id: 111
  category: alcohol_drugs_health
  question: If a driver is convicted of a DUI that caused the death or serious injury
    of another person in Mississippi, they may face up to ____ years in prison.
  choices:
    A: 5 years
    B: 10 years
    C: 25 years
    D: 50 years
  answer: C
  explanation: Aggravated DUI, which involves causing death or serious injury while
    driving under the influence, is a felony punishable by up to 25 years in prison.
- id: 112
  category: alcohol_drugs_health
  question: To avoid a full 90-day license suspension after a first-offense DUI, a
    Mississippi driver may opt to install which device in their vehicle?
  choices:
    A: A GPS tracker
    B: An Ignition Interlock Device
    C: A speed governor
    D: A dash camera
  answer: B
  explanation: Mississippi law allows first-time DUI offenders to drive during their
    suspension period if they install an Ignition Interlock Device and obtain an interlock-restricted
    license.
- id: 113
  category: alcohol_drugs_health
  question: 'If you have a medical condition that may affect your ability to drive
    safely, such as epilepsy, Mississippi law requires you to:'
  choices:
    A: Only drive during daylight hours.
    B: Report the condition to the Department of Public Safety when applying for a
      license.
    C: Keep a doctor's note in your glove box at all times.
    D: Drive only with a licensed adult over 21.
  answer: B
  explanation: Applicants must disclose physical or mental conditions that could interfere
    with safe driving. The DPS may require a medical evaluation to determine if a
    license can be issued.
- id: 114
  category: alcohol_drugs_health
  question: For a first-offense DUI conviction in Mississippi, what is the range of
    the fine imposed (excluding court costs)?
  choices:
    A: No fine, only community service
    B: $100 to $500
    C: $250 to $1,000
    D: $1,000 to $5,000
  answer: C
  explanation: A first-offense DUI conviction in Mississippi carries a fine ranging
    from $250 to $1,000.
- id: 115
  category: alcohol_drugs_health
  question: In Mississippi, what is 'MASEP'?
  choices:
    A: A mandatory insurance program for high-risk drivers.
    B: The Mississippi Alcohol Safety Education Program, required for first-offense
      DUI offenders.
    C: A medical exam required for elderly drivers.
    D: The state's automated speed enforcement system.
  answer: B
  explanation: MASEP is the Mississippi Alcohol Safety Education Program. Completion
    of this program is generally required for individuals convicted of a first-offense
    DUI to regain their driving privileges.
- id: 116
  category: alcohol_drugs_health
  question: Under the Zero Tolerance law, what is the license suspension period for
    a first-offense conviction for a driver under 21?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: C
  explanation: A first-offense Zero Tolerance DUI for a driver under 21 results in
    a 90-day suspension of driving privileges.
- id: 117
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and it impairs your driving ability,
    can you be charged with a DUI in Mississippi?
  choices:
    A: No, as long as the drug was legally prescribed.
    B: No, DUI laws only apply to illegal drugs and alcohol.
    C: Yes, if the drug renders you incapable of driving safely.
    D: Only if you also have alcohol in your system.
  answer: C
  explanation: Mississippi law prohibits driving under the influence of any substance—legal
    or illegal—that impairs your ability to operate a vehicle safely.
- id: 118
  category: alcohol_drugs_health
  question: In Mississippi, an Ignition Interlock Device (IID) may be required for
    a driver to obtain a restricted license after a DUI. What does this device do?
  choices:
    A: It tracks the vehicle's speed via GPS.
    B: It prevents the vehicle from starting if it detects alcohol on the driver's
      breath.
    C: It automatically calls 911 if an accident occurs.
    D: It limits the vehicle's operation to daylight hours only.
  answer: B
  explanation: An Ignition Interlock Device (IID) requires the driver to provide a
    breath sample; if alcohol is detected, the vehicle will not start.
- id: 119
  category: alcohol_drugs_health
  question: 'In Mississippi, a DUI that results in the death or serious injury of
    another person is classified as:'
  choices:
    A: A misdemeanor
    B: Aggravated DUI (a felony)
    C: Negligent driving
    D: A civil violation
  answer: B
  explanation: Aggravated DUI is a felony in Mississippi and applies when a person
    driving under the influence causes death or serious injury to another person.
- id: 120
  category: alcohol_drugs_health
  question: Which of the following is the only way to effectively lower your BAC and
    'sober up' before driving?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising or running
    D: Allowing time for your body to process the alcohol
  answer: D
  explanation: Time is the only factor that will lower BAC. Coffee, showers, and exercise
    do not speed up the liver's metabolism of alcohol.
- id: 121
  category: alcohol_drugs_health
  question: What is the minimum jail sentence for a second DUI conviction within a
    five-year period in Mississippi?
  choices:
    A: 24 hours
    B: 48 hours
    C: 5 days
    D: 30 days
  answer: C
  explanation: A second DUI conviction within five years in Mississippi carries a
    mandatory minimum jail sentence of 5 days (and up to one year).
- id: 122
  category: alcohol_drugs_health
  question: 'If you have a medical condition such as epilepsy or diabetes that may
    affect your driving, you must:'
  choices:
    A: Never drive under any circumstances.
    B: Only drive with a passenger who is a licensed nurse.
    C: Disclose the condition to the Department of Public Safety when applying for
      a license.
    D: Only drive on residential streets.
  answer: C
  explanation: Applicants must disclose physical or mental conditions that might impair
    their ability to drive safely. The DPS may require a medical statement from a
    physician.
- id: 123
  category: alcohol_drugs_health
  question: Under Mississippi's Implied Consent Law, which of the following tests
    can a law enforcement officer request to determine impairment?
  choices:
    A: Breath test only
    B: Blood test only
    C: Urine test only
    D: Breath, blood, or urine tests
  answer: D
  explanation: The Implied Consent Law covers chemical tests of the driver's breath,
    blood, or urine to determine the presence of alcohol or other intoxicating substances.
- id: 124
  category: penalties_and_points
  question: What is the minimum fine for a first-offense conviction of failing to
    stop for a school bus that is loading or unloading children in Mississippi?
  choices:
    A: $100
    B: $250
    C: $350
    D: $500
  answer: C
  explanation: In Mississippi, the fine for a first-offense conviction of illegally
    passing a stopped school bus ranges from $350 to $750.
- id: 125
  category: penalties_and_points
  question: In Mississippi, what is the civil penalty (fine) for a driver caught using
    a handheld mobile device to write, send, or read a text message while operating
    a motor vehicle?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: Mississippi law prohibits texting while driving, and the civil penalty
    for a violation of this law is $100.
- id: 126
  category: penalties_and_points
  question: For a first-offense DUI conviction in Mississippi, what is the maximum
    amount of time a driver can be sentenced to jail?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 30 days
  answer: B
  explanation: A first-offense DUI conviction in Mississippi can result in a jail
    sentence of up to 48 hours, though a judge may allow the driver to attend a victim
    impact panel instead.
- id: 127
  category: penalties_and_points
  question: Mississippi does not use a point system. Instead, the Commissioner of
    Public Safety is authorized to suspend a license if the driver is a 'habitual
    violator.' How is this typically defined?
  choices:
    A: 2 convictions for any offense within 12 months
    B: 3 or more convictions for moving violations within 12 months
    C: 5 convictions for any offense within 24 months
    D: Any single speeding ticket over 20 mph
  answer: B
  explanation: While Mississippi doesn't use points, the DPS can suspend the license
    of a 'frequent violator' who has 3 or more convictions for moving violations within
    a 12-month period.
- id: 128
  category: penalties_and_points
  question: 'Under the Zero Tolerance law for drivers under 21, a first-offense DUI
    conviction results in a license suspension of:'
  choices:
    A: 30 days
    B: 90 days
    C: 120 days
    D: 1 year
  answer: C
  explanation: For drivers under 21 convicted of a first-offense DUI (Zero Tolerance),
    the license suspension period is 120 days.
- id: 129
  category: penalties_and_points
  question: In Mississippi, every person transporting a child under the age of ____
    is responsible for providing for the protection of the child in a child passenger
    restraint device.
  choices:
    A: '2'
    B: '4'
    C: '6'
    D: '8'
  answer: B
  explanation: Mississippi law requires children under the age of 4 to be protected
    by a child passenger restraint device.
- id: 130
  category: penalties_and_points
  question: To regain driving privileges after a first-offense DUI suspension in Mississippi,
    a driver may be required to install an ignition interlock device for how long?
  choices:
    A: 30 days
    B: 90 days
    C: 120 days
    D: 180 days
  answer: C
  explanation: Under Mississippi's interlock law, a first-offense DUI offender may
    be required to have an ignition interlock device for 120 days to maintain restricted
    driving privileges.
- id: 131
  category: penalties_and_points
  question: What is the specific reinstatement fee required to get your Mississippi
    driver's license back after it has been suspended for a DUI violation?
  choices:
    A: $50
    B: $100
    C: $175
    D: $500
  answer: C
  explanation: Mississippi law requires a $175 reinstatement fee for licenses suspended
    due to DUI convictions or Implied Consent violations.
- id: 132
  category: penalties_and_points
  question: 'Under Mississippi''s ''Move Over'' law, failing to yield the right-of-way
    to an emergency vehicle with flashing lights can result in a fine of up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Failing to move over or slow down for emergency vehicles in Mississippi
    can result in a fine of up to $250.
- id: 133
  category: penalties_and_points
  question: If a Mississippi driver is stopped for suspicion of DUI and refuses to
    submit to a chemical breath test, what is the immediate penalty under the Implied
    Consent Law for a first offense?
  choices:
    A: A fine of $1,000
    B: Seizure of the driver's license and a 90-day suspension
    C: Mandatory 48 hours in jail
    D: Permanent revocation of the driver's license
  answer: B
  explanation: Under Mississippi's Implied Consent Law, refusal to take a chemical
    test results in the officer taking your license and a 90-day suspension for a
    first offense.
- id: 134
  category: penalties_and_points
  question: If a Mississippi driver is convicted of a second DUI within a five-year
    period, what is the minimum period of license suspension?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: A second DUI conviction within five years in Mississippi results in
    a license suspension of one year.
- id: 135
  category: penalties_and_points
  question: Under Mississippi law, what happens to a driver's license if they are
    convicted of a third DUI within five years?
  choices:
    A: It is suspended for 1 year
    B: It is suspended for 2 years
    C: It is revoked for the duration of the felony sentence
    D: It is suspended for 90 days
  answer: C
  explanation: A third DUI conviction within five years is a felony in Mississippi,
    and the license is revoked for the duration of the sentence.
- id: 136
  category: penalties_and_points
  question: What is the fine for failing to wear a seat belt in Mississippi for a
    driver or front-seat passenger?
  choices:
    A: $10
    B: $25
    C: $50
    D: $100
  answer: B
  explanation: The fine for a seat belt violation in Mississippi is $25.
- id: 137
  category: penalties_and_points
  question: 'In Mississippi, if you are convicted of speeding in a highway work zone
    when workers are present, the fine is:'
  choices:
    A: Increased by $100
    B: Doubled
    C: Tripled
    D: Reduced if you attend traffic school
  answer: B
  explanation: Mississippi law requires that fines for speeding be doubled in work
    zones when workers are present.
- id: 138
  category: penalties_and_points
  question: Which of the following violations will result in the mandatory revocation
    of a Mississippi driver's license?
  choices:
    A: A single speeding ticket
    B: Failure to pay a parking ticket
    C: Any felony in the commission of which a motor vehicle is used
    D: Driving with an expired tag
  answer: C
  explanation: Mississippi law mandates license revocation for several serious offenses,
    including any felony committed using a motor vehicle.
- id: 139
  category: penalties_and_points
  question: In Mississippi, what is the penalty for a first-offense conviction of
    failing to secure a child under the age of 4 in a child passenger restraint device?
  choices:
    A: $25 fine
    B: $100 fine
    C: 2 points on the driving record
    D: Mandatory 24 hours of jail
  answer: A
  explanation: A violation of the Mississippi Child Passenger Restraint Law is a misdemeanor
    punishable by a fine of $25.
- id: 140
  category: penalties_and_points
  question: 'If a Mississippi driver is convicted of ''Aggravated DUI'' (DUI causing
    injury or death), the offense is classified as a:'
  choices:
    A: Civil infraction
    B: Misdemeanor
    C: Felony
    D: Administrative violation
  answer: C
  explanation: Aggravated DUI, which involves causing injury or death while operating
    a vehicle under the influence, is a felony in Mississippi.
- id: 141
  category: sharing_the_road
  question: In Mississippi, when a school bus is stopped on a two-lane highway with
    its red lights flashing and stop arm extended, who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic from both directions
    D: No one, if there are at least two lanes
  answer: C
  explanation: According to Mississippi Code § 63-3-615, on any two-lane highway,
    all traffic from both directions must stop for a school bus with activated red
    lights and stop arm.
- id: 142
  category: sharing_the_road
  question: Under Mississippi law, when is a driver NOT required to stop for a school
    bus with its red lights flashing?
  choices:
    A: When the bus is on the opposite side of a divided highway with a physical median
      or barrier
    B: When the bus is stopped in a turn lane
    C: When there are four or more lanes of traffic
    D: When the driver is traveling at the speed limit
  answer: A
  explanation: Drivers traveling in the opposite direction on a divided highway with
    a median strip or a physical barrier are not required to stop for a school bus.
- id: 143
  category: sharing_the_road
  question: When passing a bicycle traveling in the same direction in Mississippi,
    what is the minimum safe distance a motorist must maintain?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Mississippi Code § 63-3-1309 requires motorists to leave a safe distance
    of no less than three (3) feet when overtaking or passing a bicycle.
- id: 144
  category: sharing_the_road
  question: Large commercial trucks have 'No-Zones.' What are these?
  choices:
    A: Areas where trucks are not allowed to drive
    B: Blind spots where the truck driver cannot see other vehicles
    C: Special lanes reserved for heavy cargo
    D: The area directly inside the truck's trailer
  answer: B
  explanation: No-Zones are large blind spots around the front, back, and sides of
    a truck where the driver's visibility is limited or non-existent.
- id: 145
  category: sharing_the_road
  question: 'In Mississippi, if you see a pedestrian using a white cane or a guide
    dog, you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Drive around them as long as you don't hit them
    D: Wait for them to wave you through
  answer: B
  explanation: Mississippi law grants special protection to blind pedestrians. Drivers
    must come to a complete stop if necessary and yield the right-of-way to anyone
    using a white cane or guide dog.
- id: 146
  category: sharing_the_road
  question: When following a motorcycle, why should you allow a greater following
    distance than you would for a car?
  choices:
    A: Motorcycles are heavier and take longer to stop
    B: Motorcyclists often use hand signals which are hard to see
    C: Motorcycles can stop much more quickly than other vehicles
    D: Motorcycles are more likely to stall at intersections
  answer: C
  explanation: Motorcycles are light and have high-performance braking systems, allowing
    them to stop in shorter distances than cars. Following too closely increases the
    risk of a rear-end collision.
- id: 147
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the truck may:'
  choices:
    A: Stay entirely in the right lane
    B: Swing wide into the left lane to complete the turn
    C: Turn from the left lane only
    D: Stop and wait for all traffic to clear both lanes
  answer: B
  explanation: Because of their length, large trucks often need to swing wide to the
    left to clear the curb when making a right turn. Drivers should never try to squeeze
    between a turning truck and the curb.
- id: 148
  category: sharing_the_road
  question: 'Under Mississippi law, bicyclists have the same rights and responsibilities
    as:'
  choices:
    A: Pedestrians
    B: Motor vehicle drivers
    C: Skateboarders
    D: Emergency vehicles
  answer: B
  explanation: Bicyclists are legally considered vehicles when on the roadway and
    must obey all traffic laws, signs, and signals just like motor vehicle drivers.
- id: 149
  category: sharing_the_road
  question: 'In Mississippi, it is illegal to follow any fire engine or equipment
    traveling in response to a fire alarm closer than:'
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Mississippi Code § 63-3-621 prohibits following a fire apparatus closer
    than 500 feet or driving into/parking within the block where the fire apparatus
    has stopped.
- id: 150
  category: sharing_the_road
  question: When a pedestrian is in an unmarked crosswalk at an intersection, who
    has the right-of-way?
  choices:
    A: The motorist, because the crosswalk isn't painted
    B: The pedestrian
    C: Whoever arrives at the intersection first
    D: The motorist, if they are traveling at the speed limit
  answer: B
  explanation: Drivers must yield to pedestrians crossing the road within any marked
    or unmarked crosswalk at an intersection.
- id: 151
  category: sharing_the_road
  question: What is the Mississippi law regarding motorcycle helmets?
  choices:
    A: Only riders under 21 must wear a helmet
    B: Helmets are optional if the rider has insurance
    C: All operators and passengers must wear an approved helmet
    D: Helmets are only required on interstate highways
  answer: C
  explanation: Mississippi law requires all persons operating or riding on a motorcycle
    or motor scooter to wear a crash helmet that is safely secured and meets approved
    standards.
- id: 152
  category: sharing_the_road
  question: A 'Slow Moving Vehicle' emblem is a triangular fluorescent orange sign.
    At what speed do vehicles typically display this sign?
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The Slow Moving Vehicle (SMV) emblem is required on vehicles designed
    to travel at speeds of 25 mph or less, such as farm tractors and construction
    equipment.
- id: 153
  category: sharing_the_road
  question: 'If you are driving behind a large truck, and you cannot see the truck''s
    side-view mirrors, you are:'
  choices:
    A: In a good position to pass
    B: Following too closely (in the rear No-Zone)
    C: At a safe following distance
    D: In the truck's 'safe zone'
  answer: B
  explanation: 'A general rule for following large trucks is: ''If you can''t see
    the driver''s face in their side-view mirror, they can''t see you.'' You are in
    their rear blind spot.'
- id: 154
  category: sharing_the_road
  question: Under Nathan's Law in Mississippi, what is the minimum fine for a first
    offense of illegally passing a stopped school bus?
  choices:
    A: $100
    B: $250
    C: $350
    D: $1,000
  answer: C
  explanation: Nathan's Law increased penalties for passing a stopped school bus.
    A first offense carries a fine between $350 and $750 and possible jail time.
- id: 155
  category: sharing_the_road
  question: On a Mississippi highway with four or more lanes and a median or physical
    barrier, what is the rule for drivers traveling in the opposite direction of a
    stopped school bus?
  choices:
    A: They must stop and wait for the bus to move
    B: They are not required to stop but should proceed with caution
    C: They must stop only if the bus driver signals them
    D: They must slow down to 10 mph
  answer: B
  explanation: In Mississippi, if a highway is divided by a median or barrier, traffic
    traveling in the opposite direction of a stopped school bus is not required to
    stop, though they should remain alert.
- id: 156
  category: sharing_the_road
  question: Under the John Paul Frerer Bicycle Safety Act in Mississippi, motorists
    must leave a safe distance of at least how many feet when passing a bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Mississippi law (the John Paul Frerer Bicycle Safety Act) requires
    motorists to leave at least three feet of clearance when passing a bicyclist.
- id: 157
  category: sharing_the_road
  question: When approaching a stationary emergency vehicle with its lights flashing
    on a multi-lane Mississippi highway, what does the 'Move Over' law require you
    to do?
  choices:
    A: Stop immediately in your lane
    B: Speed up to pass the vehicle quickly
    C: Move to a lane not adjacent to the emergency vehicle, if safe to do so
    D: Maintain your speed and stay in your current lane
  answer: C
  explanation: Mississippi's Move Over law requires drivers to move into a lane that
    is not adjacent to the stationary emergency vehicle if it is safe to do so. If
    not safe, the driver must slow down.
- id: 158
  category: sharing_the_road
  question: In Mississippi, who is required by law to wear a crash helmet when riding
    on a motorcycle?
  choices:
    A: Only the operator
    B: Only passengers under the age of 21
    C: Both the operator and any passenger
    D: Only those riding on highways
  answer: C
  explanation: Mississippi law requires every person operating or riding on a motorcycle
    to wear a crash helmet that meets approved safety standards.
- id: 159
  category: sharing_the_road
  question: When sharing the road with large commercial trucks, where is the largest
    'No-Zone' (blind spot) located?
  choices:
    A: Directly in front of the truck
    B: Directly behind the truck
    C: On the left side of the truck
    D: On the right side of the truck
  answer: B
  explanation: While trucks have blind spots on all sides, the area directly behind
    the truck is a significant 'No-Zone' where the truck driver cannot see your vehicle
    at all.
- id: 160
  category: sharing_the_road
  question: 'According to Mississippi law, a bicycle operated at night must be equipped
    with a front lamp that emits a white light visible from at least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: For night riding, Mississippi law requires a bicycle to have a front
    lamp visible from 500 feet and a red reflector or lamp on the rear visible from
    600 feet.
- id: 161
  category: sharing_the_road
  question: 'In Mississippi, it is illegal to follow an emergency vehicle, such as
    a fire truck responding to an alarm, closer than:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Mississippi law prohibits drivers from following a fire truck or other
    emergency vehicle responding to an alarm closer than 500 feet.
- id: 162
  category: sharing_the_road
  question: 'When passing a large truck on the highway, you should not pull back into
    the lane in front of the truck until you can see:'
  choices:
    A: The truck driver's face
    B: The truck's turn signal
    C: The entire front of the truck in your rearview mirror
    D: The truck's roof
  answer: C
  explanation: To ensure you have left enough space and are not 'cutting off' a truck,
    wait until you can see the entire front of the truck in your interior rearview
    mirror before moving back into its lane.
- id: 163
  category: sharing_the_road
  question: Under Mississippi law, which of the following is true regarding motorcycles
    and traffic lanes?
  choices:
    A: Motorcycles must stay on the shoulder
    B: Motorcycles are entitled to the full width of a lane
    C: Two motorcycles may never ride side-by-side in one lane
    D: Motorcycles must always ride on the far right edge of the lane
  answer: B
  explanation: Motorcycles are entitled to the full width of a traffic lane. Motorists
    should never attempt to share a lane with a motorcycle.
- id: 164
  category: sharing_the_road
  question: 'If there are no sidewalks available, Mississippi law requires pedestrians
    to walk:'
  choices:
    A: On the right side of the road with traffic
    B: On the left side of the road facing traffic
    C: In the center of the road
    D: On the shoulder in either direction
  answer: B
  explanation: When sidewalks are not provided, pedestrians should walk on the left
    side of the road or its shoulder, facing the traffic approaching from the opposite
    direction.
- id: 165
  category: sharing_the_road
  question: In Mississippi, farm machinery and other slow-moving vehicles traveling
    at 25 mph or less must display what symbol on the rear?
  choices:
    A: A flashing yellow light
    B: A triangular orange 'Slow Moving Vehicle' emblem
    C: A square red flag
    D: A white 'X' symbol
  answer: B
  explanation: Slow-moving vehicles, such as farm tractors, are required to display
    a triangular orange 'Slow Moving Vehicle' (SMV) emblem on the rear when traveling
    on public roads.
- id: 166
  category: vehicle_information
  question: According to Mississippi law, what is the maximum allowable window tint
    for the side and rear windows of a vehicle?
  choices:
    A: 20% light transmission
    B: 28% light transmission
    C: 32% light transmission
    D: 35% light transmission
  answer: B
  explanation: Mississippi law requires that window tint allow at least 28% of light
    to pass through. Vehicles with aftermarket tint must also display a label of compliance
    on the windshield.
- id: 167
  category: vehicle_information
  question: 'Mississippi law requires every motor vehicle to have a tail lamp that
    emits a red light visible from a distance of at least:'
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: State law requires tail lights to be visible from a distance of 500
    feet to the rear.
- id: 168
  category: vehicle_information
  question: 'The white light illuminating the rear license plate on a vehicle in Mississippi
    must make the plate legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Mississippi equipment regulations state that the rear license plate
    must be illuminated so that it is clearly legible from a distance of 50 feet.
- id: 169
  category: vehicle_information
  question: Under Mississippi law, your vehicle's foot brake must be able to stop
    the car within how many feet when traveling at 30 miles per hour?
  choices:
    A: 20 feet
    B: 30 feet
    C: 45 feet
    D: 50 feet
  answer: B
  explanation: Mississippi safety standards require that the service brake (foot brake)
    must be capable of stopping the vehicle within 30 feet at a speed of 30 mph.
- id: 170
  category: vehicle_information
  question: 'Every motor vehicle operated on Mississippi highways must be equipped
    with a horn that is audible under normal conditions from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Mississippi law requires a horn that can be heard from a distance of
    no less than 200 feet.
- id: 171
  category: vehicle_information
  question: 'Mississippi law requires that every motor vehicle be equipped with a
    mirror so located as to reflect to the driver a view of the highway for a distance
    of at least:'
  choices:
    A: 100 feet to the rear
    B: 200 feet to the rear
    C: 300 feet to the rear
    D: 500 feet to the rear
  answer: B
  explanation: Vehicles must have a rearview mirror that provides a view of the road
    for at least 200 feet behind the vehicle.
- id: 172
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of a vehicle
    body in Mississippi, a red flag (day) or red light (night) must be attached?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Any load extending more than 4 feet beyond the rear of the vehicle
    must be marked with a red flag during the day and a red light at night.
- id: 173
  category: vehicle_information
  question: 'In Mississippi, a tire is considered unsafe if the tread depth is less
    than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 1/16 of an inch
  answer: B
  explanation: Tires are legally considered unsafe in Mississippi if the tread is
    worn to less than 2/32 of an inch.
- id: 174
  category: vehicle_information
  question: 'Turn signals on a vehicle in Mississippi must be visible from a distance
    of not less than:'
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Mississippi law requires that turn signals be visible to both the front
    and rear from a distance of at least 100 feet.
- id: 175
  category: vehicle_information
  question: 'In Mississippi, a ''Slow Moving Vehicle'' emblem must be displayed on
    the rear of any vehicle that is designed to operate at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: Vehicles designed to travel at 25 mph or less must display a triangular
    slow-moving vehicle emblem.
- id: 176
  category: vehicle_information
  question: Which of the following is true regarding muffler requirements in Mississippi?
  choices:
    A: Mufflers are optional on farm vehicles
    B: Muffler cutouts or bypasses are strictly prohibited
    C: Loud mufflers are permitted during daylight hours
    D: Only vehicles manufactured after 2010 require mufflers
  answer: B
  explanation: Mississippi law requires every motor vehicle to have a muffler in good
    working order to prevent excessive noise, and specifically prohibits the use of
    muffler cutouts or bypasses.
- id: 177
  category: vehicle_information
  question: What is the maximum legal width for any vehicle (excluding mirrors and
    safety devices) on Mississippi highways?
  choices:
    A: 8 feet
    B: 8 feet, 6 inches
    C: 9 feet
    D: 10 feet
  answer: B
  explanation: The maximum legal width for a vehicle on Mississippi roads is 8 feet,
    6 inches (102 inches).
- id: 178
  category: vehicle_information
  question: 'According to the Mississippi Driver''s Manual, your vehicle''s headlights
    must be turned on at any time when you cannot see clearly for a distance of:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Mississippi law requires headlights to be on from sunset to sunrise
    and whenever visibility is less than 500 feet due to weather or other conditions.
- id: 179
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in Mississippi?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and illegal in Mississippi if they are
    worn to a point where less than 2/32 of an inch of tread remains.
- id: 180
  category: vehicle_information
  question: 'Mississippi law requires your vehicle to have a rearview mirror that
    allows you to see the highway to the rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The rearview mirror must be adjusted so that the driver can see at
    least 200 feet to the rear of the vehicle.
- id: 181
  category: vehicle_information
  question: 'In Mississippi, every motor vehicle must have at least one tail light
    that emits a red light plainly visible from a distance of:'
  choices:
    A: 250 feet
    B: 500 feet
    C: 750 feet
    D: 1,000 feet
  answer: B
  explanation: Tail lights on vehicles in Mississippi must be visible from a distance
    of 500 feet to the rear.
- id: 182
  category: vehicle_information
  question: When driving in heavy fog in Mississippi, which light setting should you
    use for the best visibility?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Emergency flashers only
  answer: B
  explanation: In fog, low-beam headlights should be used. High beams reflect off
    the fog and actually decrease visibility.
- id: 183
  category: vehicle_information
  question: 'Mississippi law requires that the rear license plate be illuminated by
    a white light so that it is clearly legible from a distance of:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Mississippi Code requires a white light to illuminate the rear registration
    plate, making it visible from a distance of 50 feet to the rear.
- id: 184
  category: signs_and_signals
  question: In Mississippi, what does a flashing yellow traffic signal indicate?
  choices:
    A: Stop completely before proceeding
    B: Speed up to clear the intersection
    C: Slow down and exercise caution
    D: The signal is broken; treat it as a four-way stop
  answer: C
  explanation: According to the Mississippi Driver's Manual, a flashing yellow light
    means you should slow down and exercise caution before entering the intersection.
- id: 185
  category: signs_and_signals
  question: What is the specific shape of a 'No Passing Zone' sign in Mississippi?
  choices:
    A: Diamond
    B: Pennant
    C: Rectangle
    D: Pentagon
  answer: B
  explanation: A 'No Passing Zone' sign is pennant-shaped and is placed on the left
    side of the road to mark the beginning of a zone where passing is prohibited.
- id: 186
  category: signs_and_signals
  question: When a driver in Mississippi extends their left arm horizontally out the
    window, what does this hand signal indicate?
  choices:
    A: Right turn
    B: Left turn
    C: Stop or slow down
    D: U-turn
  answer: B
  explanation: The standard hand signal for a left turn is the left arm extended horizontally
    out the window.
- id: 187
  category: signs_and_signals
  question: In Mississippi, what do double solid white lines painted on the pavement
    indicate?
  choices:
    A: Passing is allowed with caution
    B: You may cross the lines to turn into a driveway
    C: Crossing the lines to change lanes is prohibited
    D: The road is for emergency vehicles only
  answer: C
  explanation: Double solid white lines indicate that lane changes are prohibited.
    You must stay within your lane.
- id: 188
  category: signs_and_signals
  question: What does a round-shaped yellow sign with a black 'X' and the letters
    'RR' signify in Mississippi?
  choices:
    A: Road Repair ahead
    B: Rest Restricted area
    C: Railroad crossing advance warning
    D: Rough Road ahead
  answer: C
  explanation: A round yellow sign with a black 'X' and 'RR' is the advance warning
    sign for a railroad crossing.
- id: 189
  category: signs_and_signals
  question: 'If you are approaching an intersection with a flashing red light in Mississippi,
    you must:'
  choices:
    A: Slow down and yield to all traffic
    B: Stop completely and proceed only when safe
    C: Treat it like a yellow light and proceed with caution
    D: Stop only if there is cross traffic
  answer: B
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop and proceed only when the way is clear.
- id: 190
  category: signs_and_signals
  question: What is the meaning of a pentagon-shaped sign on a Mississippi roadway?
  choices:
    A: Yield right-of-way
    B: No passing zone
    C: School zone or school crossing
    D: Hospital ahead
  answer: C
  explanation: A five-sided (pentagon) sign indicates a school zone or a school crossing.
- id: 191
  category: signs_and_signals
  question: In Mississippi, what does a solid yellow line on your side of a broken
    yellow center line mean?
  choices:
    A: You may pass if no traffic is coming
    B: Passing is prohibited on your side
    C: You are in a one-way zone
    D: You must speed up to pass quickly
  answer: B
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited for traffic in your lane.
- id: 192
  category: signs_and_signals
  question: 'To signal a right turn using hand signals in Mississippi, a driver should:'
  choices:
    A: Extend the left arm horizontally
    B: Extend the left arm upward
    C: Extend the left arm downward
    D: Extend the right arm horizontally
  answer: B
  explanation: The hand signal for a right turn is the left arm bent upward at the
    elbow.
- id: 193
  category: signs_and_signals
  question: What color are Mississippi guide signs that provide information about
    services like gas, food, and lodging?
  choices:
    A: Green
    B: Blue
    C: Brown
    D: Orange
  answer: B
  explanation: Blue signs are used to provide information about motorist services
    such as food, gas, and lodging.
- id: 194
  category: signs_and_signals
  question: In Mississippi, what does a steady yellow arrow pointing left indicate?
  choices:
    A: You have the right-of-way to turn left
    B: The protected turning period is ending
    C: You must stop and wait for a green light
    D: Left turns are prohibited at this intersection
  answer: B
  explanation: A steady yellow arrow means the 'protected' turning time is ending.
    You should prepare to stop or complete your turn if you are already in the intersection.
- id: 195
  category: signs_and_signals
  question: Which of these pavement markings separates traffic moving in the same
    direction in Mississippi?
  choices:
    A: Broken yellow lines
    B: Solid yellow lines
    C: Broken white lines
    D: Double solid yellow lines
  answer: C
  explanation: Broken white lines are used to separate lanes of traffic moving in
    the same direction where lane changing is permitted.
- id: 196
  category: signs_and_signals
  question: What does an orange diamond-shaped sign signify in Mississippi?
  choices:
    A: General warning of hazards
    B: Construction or maintenance warning
    C: Directional information
    D: Regulatory speed limit
  answer: B
  explanation: Orange signs are specifically used for construction and maintenance
    work zones to alert drivers to unusual or potentially dangerous conditions.
- id: 197
  category: signs_and_signals
  question: 'In Mississippi, a red-and-white triangular sign pointing downward means:'
  choices:
    A: Stop
    B: Yield
    C: No Entry
    D: One Way
  answer: B
  explanation: The downward-pointing triangle is the standard shape for a Yield sign,
    requiring drivers to slow down and give right-of-way to other traffic.
- id: 198
  category: signs_and_signals
  question: 'When you see a ''Crossbuck'' sign at a railroad crossing in Mississippi,
    it should be treated the same as a:'
  choices:
    A: Speed limit sign
    B: Yield sign
    C: Stop sign
    D: No passing sign
  answer: B
  explanation: A railroad crossbuck sign is a regulatory sign that should be treated
    like a yield sign; you must yield to oncoming trains.
- id: 199
  category: signs_and_signals
  question: In Mississippi, what is the proper hand signal to indicate a left turn?
  choices:
    A: Arm extended straight out the window
    B: Arm extended upward
    C: Arm extended downward
    D: Arm waving in a circular motion
  answer: A
  explanation: According to the Mississippi Driver's Manual, the hand signal for a
    left turn is the left arm extended horizontally out the window.
- id: 200
  category: signs_and_signals
  question: When using hand signals in Mississippi, how do you signal that you are
    slowing down or stopping?
  choices:
    A: Arm extended straight out
    B: Arm extended upward
    C: Arm extended downward with palm facing the rear
    D: Arm waving toward the ground
  answer: C
  explanation: The Mississippi Driver's Manual states that to signal a stop or decrease
    in speed, the arm should be extended downward with the palm to the rear.
- id: 201
  category: signs_and_signals
  question: What does a flashing yellow traffic signal mean under Mississippi law?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection
    C: Yield to all traffic and stop if necessary
    D: Slow down and exercise caution as you proceed through the intersection
  answer: D
  explanation: In Mississippi, a flashing yellow light is a warning to slow down and
    be especially alert as you proceed through the intersection.
- id: 202
  category: signs_and_signals
  question: 'A pennant-shaped sign (isosceles triangle pointing right) found on the
    left side of a Mississippi highway indicates:'
  choices:
    A: A school zone
    B: A no-passing zone
    C: A railroad crossing
    D: A yield requirement
  answer: B
  explanation: In Mississippi and across the US, a pennant-shaped sign placed on the
    left side of the road marks the beginning of a no-passing zone.
- id: 203
  category: signs_and_signals
  question: What is the meaning of a flashing red traffic light in Mississippi?
  choices:
    A: The signal is broken; proceed with caution
    B: Stop completely and proceed only when it is safe to do so
    C: Yield to oncoming traffic but do not stop
    D: Stop and wait for the light to turn green
  answer: B
  explanation: 'A flashing red light in Mississippi has the same meaning as a stop
    sign: you must come to a complete stop and proceed only when the way is clear.'
- id: 204
  category: signs_and_signals
  question: 'When you see a ''Yield'' sign in Mississippi, you must:'
  choices:
    A: Always come to a complete stop
    B: Slow down and stop if necessary to let any vehicle or pedestrian pass
    C: Speed up to merge with traffic
    D: Ignore it if no other cars are present
  answer: B
  explanation: A yield sign means you must slow down and yield the right-of-way to
    traffic in the intersection or on the connecting road, stopping if the situation
    requires it.
- id: 205
  category: signs_and_signals
  question: What does a solid white line painted across a lane at an intersection
    represent in Mississippi?
  choices:
    A: A crosswalk for pedestrians only
    B: A stop line, indicating where to stop for a sign or signal
    C: A parking boundary
    D: A lane divider for turning traffic
  answer: B
  explanation: A solid white line across a lane is a stop line. Drivers must stop
    behind this line at stop signs or traffic signals.
- id: 206
  category: signs_and_signals
  question: According to Mississippi law, when are you allowed to turn right on a
    red light?
  choices:
    A: Never
    B: Only if there is a green arrow
    C: After coming to a complete stop and yielding to traffic and pedestrians, unless
      a sign prohibits it
    D: Only between the hours of 9:00 PM and 6:00 AM
  answer: C
  explanation: Mississippi law allows a right turn on red after a complete stop, provided
    the way is clear and there is no sign posted that says 'No Turn on Red'.
- id: 207
  category: signs_and_signals
  question: 'A five-sided (pentagon) sign in Mississippi indicates that you are approaching:'
  choices:
    A: A hospital
    B: A county line
    C: A school zone or school crossing
    D: A public park
  answer: C
  explanation: The pentagon-shaped sign is used exclusively to warn drivers of school
    zones or school crossings.
- id: 208
  category: signs_and_signals
  question: What is the purpose of a solid white line painted on the right edge of
    the highway in Mississippi?
  choices:
    A: To indicate that passing is allowed on the shoulder
    B: To mark the edge of the travel lane (fog line)
    C: To show where bicycles must ride
    D: To indicate a carpool lane
  answer: B
  explanation: The solid white line on the right side of the road is the 'fog line'
    or edge line, which helps drivers see the edge of the road, especially at night
    or in poor weather.
- id: 209
  category: signs_and_signals
  question: 'In Mississippi, a steady yellow traffic light means:'
  choices:
    A: The light is about to turn green
    B: You should speed up to beat the red light
    C: The light is about to turn red; clear the intersection or stop if you can do
