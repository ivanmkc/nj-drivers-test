metadata:
  source: Mississippi Driver's License Manual (Jan 2025) (driverservicebureau.dps.ms.gov)
  total_questions: 252
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: safe_driving_rules
  question: According to the manual, what is the law regarding seat belts in a motor
    vehicle?
  choices:
    A: Only the driver must wear a seat belt.
    B: You and your passengers must buckle up every time you travel.
    C: Seat belts are optional for passengers in the back seat.
    D: Seat belts are only required when traveling on interstates.
  answer: B
  explanation: 'The manual states: ''Make certain that you and your passengers buckle
    up your seat belts every time you travel in a motor vehicle... Buckle up; it is
    the law.'''
- id: 2
  category: defensive_driving
  question: What does the manual identify as one of the leading causes of accidents?
  choices:
    A: Speeding
    B: Driving at night
    C: Distracted driving
    D: Poor weather conditions
  answer: C
  explanation: The Governor's message in the manual explicitly states that 'Distracted
    driving is one of the leading causes of accidents.'
- id: 3
  category: sharing_the_road
  question: The manual advises drivers to take special care in school zones and when
    sharing the road with whom?
  choices:
    A: Bicyclists
    B: Large commercial trucks
    C: Motorcyclists
    D: Pedestrians
  answer: A
  explanation: The manual advises drivers to 'take special care in school zones and
    when sharing the road with bicyclists.'
- id: 4
  category: driver_responsibility
  question: 'According to the Commissioner of Public Safety, operating a motor vehicle
    on Mississippi roadways is considered:'
  choices:
    A: A constitutional right
    B: A privilege
    C: A requirement for all citizens
    D: An unrestricted freedom
  answer: B
  explanation: 'The Commissioner''s message states: ''However, driving is a privilege
    and should be taken very seriously.'''
- id: 5
  category: penalties_and_points
  question: What is the consequence for a person found guilty of littering on Mississippi's
    roads, highways, or interstates?
  choices:
    A: They will receive a written warning.
    B: Their license will be suspended for 30 days.
    C: They will be fined.
    D: They will be required to retake the driving exam.
  answer: C
  explanation: 'The manual states: ''Any person found guilty of littering on Mississippi’s
    roads, highways, interstates, or within their rights-of-way shall be fined.'''
- id: 6
  category: driver_responsibility
  question: How does the manual suggest drivers can easily prevent littering?
  choices:
    A: By only throwing biodegradable items out the window.
    B: By keeping a trash bag in the vehicle.
    C: By avoiding eating or drinking in the vehicle.
    D: By throwing trash in the beds of passing pickup trucks.
  answer: B
  explanation: The manual notes that the offense of littering is easily preventable
    by advising drivers to 'Keep a trash bag in your vehicle and dispose of your trash
    responsibly.'
- id: 7
  category: license_system
  question: Which of the following forms of payment is NOT accepted at driver license
    offices?
  choices:
    A: Cash
    B: Checks
    C: Visa credit cards
    D: MasterCard debit cards
  answer: B
  explanation: 'The fee payment section explicitly states: ''All offices accept cash,
    credit cards, and debit cards... NO CHECKS.'''
- id: 8
  category: license_system
  question: What is the fee for a Learner’s Permit in Mississippi?
  choices:
    A: $5.00
    B: $7.00
    C: $11.00
    D: $24.00
  answer: B
  explanation: According to the fee chart in the manual, the cost for a Learner’s
    Permit is $7.00.
- id: 9
  category: license_system
  question: How much does a 4-year Regular License (Class R) cost?
  choices:
    A: $17.00
    B: $24.00
    C: $29.00
    D: $47.00
  answer: B
  explanation: The fee chart lists the price of a Regular License, Class R for 4 years
    as $24.00.
- id: 10
  category: license_system
  question: What is the fee for an 8-year Regular License (Class R)?
  choices:
    A: $24.00
    B: $33.00
    C: $47.00
    D: $57.00
  answer: C
  explanation: The fee chart lists the price of a Regular License, Class R for 8 years
    as $47.00.
- id: 11
  category: license_system
  question: If you need a duplicate driver's license, what is the required fee?
  choices:
    A: $1.00
    B: $5.00
    C: $7.00
    D: $11.00
  answer: D
  explanation: Under the 'OTHER FEES' section, the manual lists the fee for a Duplicate
    License as $11.00.
- id: 12
  category: license_system
  question: What is the late fee for a driver's license renewal?
  choices:
    A: $1.00
    B: $5.00
    C: $10.00
    D: $11.00
  answer: A
  explanation: Under the 'OTHER FEES' section, the manual lists the Late Fee as $1.00.
- id: 13
  category: license_system
  question: How much does a 4-year Motorcycle Endorsement cost?
  choices:
    A: $5.00
    B: $7.00
    C: $10.00
    D: $17.00
  answer: A
  explanation: The fee chart lists the cost of a 4-year Motorcycle Endorsement as
    $5.00.
- id: 14
  category: license_system
  question: What is the cost of an 8-year Identification Card?
  choices:
    A: $17.00
    B: $24.00
    C: $33.00
    D: $47.00
  answer: C
  explanation: The fee chart lists the cost of an 8-year Identification Card as $33.00.
- id: 15
  category: license_system
  question: What is the fee for a 4-year Class D Commercial License?
  choices:
    A: $24.00
    B: $29.00
    C: $47.00
    D: $57.00
  answer: B
  explanation: The fee chart lists the cost of a 4-year Commercial License, Class
    D as $29.00.
- id: 16
  category: license_system
  question: Which of the following individuals is exempt from having a Mississippi
    driver's license?
  choices:
    A: A 15-year-old driving a family car on a public street.
    B: A person operating a farm tractor on a highway.
    C: A new resident who moved to Mississippi 90 days ago.
    D: A college student whose out-of-state license has been suspended.
  answer: B
  explanation: You are exempt from having a Mississippi driver's license if you are
    operating any road machine, farm tractor, or farm equipment on streets or highways.
- id: 17
  category: license_system
  question: 'Under Mississippi law, you cannot be issued a driver''s license if you
    are under eighteen years old and do not provide proper documentation of:'
  choices:
    A: Your employment status.
    B: Your enrollment in school.
    C: Your medical history.
    D: Your vehicle registration.
  answer: B
  explanation: The law prevents you from being issued a license in Mississippi if
    you are under eighteen years old and do not provide proper documentation of your
    enrollment in school.
- id: 18
  category: driver_testing
  question: Before being issued a license, an applicant must provide an affidavit
    certifying they have operated a motor vehicle for at least how many hours?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: You must provide an affidavit whereby a parent, teacher, or guardian
    has certified that he or she has witnessed you operate a motor vehicle for at
    least fifty hours.
- id: 19
  category: license_system
  question: If you move to Mississippi, how many days do you have to obtain a Mississippi
    driver's license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: If you move to Mississippi, you must obtain a Mississippi driver's
    license within sixty days.
- id: 20
  category: vehicle_information
  question: New residents of Mississippi must obtain a Mississippi license plate/tag
    within how many days of moving?
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: If you move to Mississippi, you must obtain a Mississippi license plate/tag
    within thirty days.
- id: 21
  category: driver_testing
  question: If you have a valid driver's license from another state, which test will
    be waived when you apply for a Mississippi license?
  choices:
    A: The vision screening
    B: The road skills test
    C: The Computerized Exam
    D: The physical examination
  answer: C
  explanation: If you have a valid driver's license from another state, the Computerized
    Exam will be waived. You must still pass a vision screening.
- id: 22
  category: driver_testing
  question: 'You must take the Computerized Exam if your out-of-state driver''s license
    has been expired for over:'
  choices:
    A: 15 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: If your out-of-state license has been expired over thirty days, you
    must take the Computerized Exam.
- id: 23
  category: license_system
  question: What must you do if you are applying for a Mississippi license but your
    out-of-state license has been lost?
  choices:
    A: Retake the road skills test.
    B: Wait 30 days before applying.
    C: Obtain a notarized Affidavit of Inability to Surrender form.
    D: Surrender your vehicle registration instead.
  answer: C
  explanation: If your out-of-state license has been lost, you must obtain an Affidavit
    of Inability to Surrender form from the Driver's License office. Your signature
    must be notarized on this form.
- id: 24
  category: license_system
  question: If your valid Mississippi license expires while you are out-of-state due
    to military service, you may renew it without a delinquent fee within how many
    days of being discharged or returning to the state?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: If you are out-of-state due to military service at the time your valid
    license expires, you may renew the license at any time within ninety days of being
    discharged from military service or upon returning to the state.
- id: 25
  category: license_system
  question: How early can a qualified licensed driver renew their Mississippi driver's
    license prior to its expiration date?
  choices:
    A: Up to one month
    B: Up to three months
    C: Up to six months
    D: Up to one year
  answer: C
  explanation: For any licensed driver who qualifies for a LICENSE RENEWAL, the license
    may be renewed UP TO SIX MONTHS prior to the expiration date.
- id: 26
  category: license_system
  question: Are out-of-state college students required to obtain a Mississippi driver's
    license to drive in the state?
  choices:
    A: Yes, within 30 days of starting classes.
    B: Yes, within 60 days of moving into a dormitory.
    C: No, they are allowed to drive in Mississippi with their out-of-state license.
    D: No, but they must obtain Mississippi license plates.
  answer: C
  explanation: Out-of-state college students are allowed to drive in Mississippi with
    their out-of-state license. The same policy applies to auto license plates.
- id: 27
  category: license_system
  question: Which of the following documents is a non-citizen NOT required to provide
    when applying for a Mississippi driver's license?
  choices:
    A: A social security card
    B: Two proofs of residency
    C: A translated birth certificate
    D: Valid immigration papers or a Permanent Resident Card
  answer: A
  explanation: If you are a non-citizen, you must meet all requirements for a driver's
    license or identification card except for providing a social security card.
- id: 28
  category: license_system
  question: For how long is a regular driver's license valid for a non-citizen?
  choices:
    A: Exactly one year
    B: Four years or until their legal status expiration date, whichever is shorter
    C: Eight years
    D: Until they become a U.S. citizen
  answer: B
  explanation: For non-citizens, their regular license or identification card will
    be valid for four years or until your legal status expiration date [if less than
    four years away].
- id: 29
  category: driver_testing
  question: Beginning July 1, 2027, what new requirement will prevent an applicant
    from being issued a Mississippi driver's license if not completed?
  choices:
    A: A certified defensive driving course
    B: A certified Driver's Education course
    C: A 100-hour supervised driving log
    D: An advanced highway safety seminar
  answer: B
  explanation: The law prevents you from being issued a license in Mississippi if...
    You have not completed a certified Driver's Education course (beginning July 1,
    2027).
- id: 30
  category: driver_responsibility
  question: Is it legal to drive without a valid Driver's License or Learner's Permit
    if you are accompanied by a licensed parent?
  choices:
    A: Yes, as long as the parent is in the front passenger seat.
    B: Yes, if you are at least 15 years old.
    C: No, driving without a valid license or permit is illegal even if accompanied
      by a parent.
    D: No, unless you are driving to or from school.
  answer: C
  explanation: Driving without a valid Driver's License or Learner's Permit is illegal,
    even if you are accompanied by a parent or licensed driver.
- id: 31
  category: license_system
  question: How long is a Regular Learner's Permit valid in Mississippi?
  choices:
    A: One year
    B: Two years
    C: Four years
    D: Six months
  answer: B
  explanation: The manual states that the Regular Learner's Permit is valid for two
    years.
- id: 32
  category: safe_driving_rules
  question: When driving with a Regular Learner's Permit, who must accompany you in
    the seat next to you?
  choices:
    A: Any licensed driver aged 18 or older
    B: A licensed driver aged 21 or older
    C: A parent or legal guardian only
    D: Any adult aged 21 or older, regardless of license status
  answer: B
  explanation: A Regular Learner's Permit entitles you to drive a motor vehicle when
    accompanied by a licensed driver aged twenty-one years or older who is physically
    occupying the seat next to you.
- id: 33
  category: license_system
  question: What type of license is required to operate a commercial vehicle that
    is under 26,000 pounds gross vehicle weight rating?
  choices:
    A: Class A
    B: Class C
    C: Class D
    D: Class R
  answer: C
  explanation: A Class D license is required when you are operating a vehicle commercially
    and the vehicle is under 26,000 pounds gross vehicle weight rating.
- id: 34
  category: license_system
  question: What is the minimum age requirement to be eligible for a license to drive
    a school bus in Mississippi?
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: C
  explanation: You must be at least twenty-one years old before you are eligible for
    a license to drive a school bus per the Mississippi Department of Education.
- id: 35
  category: safe_driving_rules
  question: What safety equipment is legally required when operating or riding a motorcycle
    on public roads in Mississippi?
  choices:
    A: Leather gloves
    B: A crash helmet
    C: Reflective clothing
    D: Steel-toed boots
  answer: B
  explanation: A crash helmet must be worn if operating or riding any motorcycle or
    motor scooter upon the public roads or highways of this state.
- id: 36
  category: license_system
  question: If you receive your Learner's Permit at age fifteen and one-half, at what
    age will you be eligible for your Regular Driver's License?
  choices:
    A: Fifteen and one-half
    B: Sixteen
    C: Sixteen and one-half
    D: Seventeen
  answer: C
  explanation: If you are issued a Learner's Permit at age fifteen and one-half, you
    must wait a year, making you eligible for your Regular Driver's License at age
    sixteen and one-half.
- id: 37
  category: license_system
  question: What type of license can you apply for directly if you are beginning the
    application process at age seventeen or older?
  choices:
    A: A Regular Learner's Permit only
    B: A Regular Driver's License
    C: A Class D Commercial License
    D: A Restricted Hardship License
  answer: B
  explanation: If you first apply at age seventeen or older, you may apply directly
    for a Regular Driver's License.
- id: 38
  category: license_system
  question: Which of the following is true regarding the proof of residency required
    for an original license application?
  choices:
    A: Post office box numbers are acceptable
    B: Only one piece of documentation is required
    C: Each proof must contain a physical address
    D: Proof of residency is only required for applicants under 18
  answer: C
  explanation: The manual states that each proof of residency must contain a physical
    address and that no post office box numbers will be accepted.
- id: 39
  category: penalties_and_points
  question: What is a potential consequence of making a false statement on your driver's
    license application?
  choices:
    A: You will be required to retake the vision exam
    B: Your driving privileges may be suspended
    C: You will be issued a restricted license
    D: Your application fee will be doubled
  answer: B
  explanation: If you make a false statement on the application, your driving privileges
    may be suspended.
- id: 40
  category: driver_responsibility
  question: If you are under seventeen years old, what is required regarding the signatures
    of your parents or guardians on your application?
  choices:
    A: Only one parent's signature is needed
    B: The signatures must be notarized
    C: The signatures must be witnessed by a police officer
    D: Signatures are not required if you have completed Driver's Education
  answer: B
  explanation: Whomever signs your application will be liable for your negligence
    or willful misconduct and must have their signature NOTARIZED.
- id: 41
  category: license_system
  question: Which two proofs of identification are required before a license or permit
    can be issued?
  choices:
    A: A passport and a utility bill
    B: A Social Security Card and a Certified Birth Certificate
    C: A high school diploma and a bank statement
    D: A voter registration card and a W-2 form
  answer: B
  explanation: 'Two proofs of identification are required before a license or permit
    can be issued: a Social Security Card and a Certified Birth Certificate.'
- id: 42
  category: license_system
  question: If you are under eighteen years old, how recent must your Certification
    of Attendance form from your school be?
  choices:
    A: Not over 14 days old
    B: Not over 30 days old
    C: Not over 60 days old
    D: Not over 90 days old
  answer: B
  explanation: If you are under eighteen years old, you must provide proof of your
    enrollment in school. This Certification of Attendance form must not be over thirty
    days old.
- id: 43
  category: driver_testing
  question: If you are under 17, how many hours of driving must a parent, teacher,
    or guardian certify they have witnessed you operate a motor vehicle to qualify
    for a Regular Driver's License?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: If you are under 17 you must provide an affidavit for Road Test Waiver
    whereby a parent, teacher, or guardian has certified that he or she has witnessed
    you operate a motor vehicle for at least fifty hours.
- id: 44
  category: license_system
  question: Beginning on what date will applicants be required to provide documentation
    showing the completion of a certified Driver's Education and Training Program?
  choices:
    A: July 1, 2024
    B: January 1, 2025
    C: July 1, 2027
    D: December 31, 2028
  answer: C
  explanation: Beginning July 1, 2027, you must provide signed documentation showing
    the completion of a Driver's Education and Training Program certified by the State
    Board of Education or the Department of Public Safety.
- id: 45
  category: vehicle_information
  question: According to Mississippi law, how effective must your foot brake be?
  choices:
    A: It must stop the vehicle within 55 feet at 20 mph.
    B: It must stop the vehicle within 30 feet at 20 mph.
    C: It must stop the vehicle within 100 feet at 30 mph.
    D: It must stop the vehicle within 50 feet at 20 mph.
  answer: B
  explanation: The manual states that the foot brake must be strong enough to stop
    the vehicle within thirty feet at a speed of twenty miles per hour.
- id: 46
  category: vehicle_information
  question: How far away must your vehicle's horn be heard to meet equipment standards?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Your vehicle must have a horn which can be heard two hundred feet away.
- id: 47
  category: vehicle_information
  question: What is the maximum number of auxiliary lights your vehicle may have in
    addition to headlights?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: C
  explanation: In addition to two headlights, your vehicle may have no more than one
    spotlight and no more than three auxiliary lights.
- id: 48
  category: vehicle_information
  question: Is a rearview mirror required by Mississippi law for standard passenger
    vehicles?
  choices:
    A: Yes, all vehicles must have a rearview mirror.
    B: No, it is recommended but not required by law.
    C: Yes, but only if the vehicle does not have side mirrors.
    D: No, rearview mirrors are illegal.
  answer: B
  explanation: Mississippi law does not require you to have a rearview mirror, but
    it is recommended for you to have one.
- id: 49
  category: vehicle_information
  question: Under the Squatted Vehicle Law, it is unlawful to alter a vehicle's suspension
    so that the front fender is raised how much higher than the rear fender?
  choices:
    A: Two or more inches
    B: Three or more inches
    C: Four or more inches
    D: Six or more inches
  answer: C
  explanation: It shall be unlawful for any person to drive a passenger motor vehicle
    if the height of the front fender is raised four or more inches greater than the
    height of the rear fender.
- id: 50
  category: vehicle_information
  question: When using the 'penny test' to check tire tread, what indicates that you
    are driving with a safe amount of tread?
  choices:
    A: You can see the top of the Lincoln Memorial.
    B: Any part of Abraham Lincoln's head is covered by the tread.
    C: The entire penny fits into the groove.
    D: Abraham Lincoln's head is completely visible above the tread.
  answer: B
  explanation: If any part of Lincoln's head is covered by the tread, you are driving
    with a safe amount of tread. If the tread is below that, your car's ability to
    grip the road is greatly reduced.
- id: 51
  category: safe_driving_rules
  question: What is the recommended hand position on the steering wheel to maintain
    control of the vehicle?
  choices:
    A: 10 and 2 o'clock
    B: 8 and 4 o'clock
    C: 3 and 9 o'clock
    D: 12 and 6 o'clock
  answer: C
  explanation: Both hands should be placed on the outside of the steering wheel on
    opposite sides, at the 3 and 9 o’clock positions, to maintain control of the vehicle.
- id: 52
  category: safe_driving_rules
  question: Why is placing your hands at the 2 and 10 o'clock positions on the steering
    wheel no longer recommended?
  choices:
    A: It causes driver fatigue more quickly.
    B: It can be dangerous in a vehicle equipped with airbags.
    C: It blocks the driver's view of the dashboard.
    D: It makes it harder to turn the steering wheel.
  answer: B
  explanation: Placing your hands at 2 and 10 o’clock positions is no longer recommended
    because it can be dangerous in a vehicle equipped with airbags.
- id: 53
  category: defensive_driving
  question: How often should you plan to stop and take a break during long trips to
    avoid fatigue?
  choices:
    A: Every 50 miles or 1 hour
    B: Every 100 miles or 2 hours
    C: Every 150 miles or 3 hours
    D: Every 200 miles or 4 hours
  answer: B
  explanation: To avoid fatigue, you should plan to stop about every 100 miles or
    2 hours during long trips.
- id: 54
  category: safe_driving_rules
  question: According to the manual, which of the following is counted as part of
    an intersection?
  choices:
    A: Driveways
    B: Sidewalks
    C: Crosswalks
    D: Shoulders
  answer: C
  explanation: An intersection is the place where roads come together or cross, and
    crosswalks are counted as part of the intersection.
- id: 55
  category: vehicle_information
  question: Which of the following is NOT considered a 'motor vehicle' under Mississippi's
    common terms?
  choices:
    A: A motorcycle
    B: An automobile
    C: A commercial truck
    D: An electric bicycle
  answer: D
  explanation: The definition of a motor vehicle explicitly excepts vehicles on rails,
    electric bicycles, golf carts, and low-speed vehicles.
- id: 56
  category: vehicle_information
  question: How far behind your vehicle must your red taillight be visible?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: The taillight on your vehicle must be red and must be visible five
    hundred feet behind you.
- id: 57
  category: driver_testing
  question: What happens if your eye test indicates that you may need glasses during
    the Vision Exam?
  choices:
    A: You will be permanently denied a driver's license.
    B: You must have your eyes tested by an eye specialist or optometrist.
    C: You will be required to take a computerized driving test instead.
    D: You must wait six months before retaking the exam.
  answer: B
  explanation: If your eye test indicates that you may need glasses, you must have
    your eyes tested by an eye specialist or optometrist and have them fill out a
    vision form (DE26).
- id: 58
  category: defensive_driving
  question: When driving long distances, why should you avoid following the same vehicle
    for long periods?
  choices:
    A: You might be accused of stalking.
    B: You may become too relaxed and lose your concentration.
    C: It decreases your vehicle's fuel efficiency.
    D: The other driver might brake suddenly to test you.
  answer: B
  explanation: Do not follow the same vehicle or group of vehicles for long periods.
    You may become too relaxed and lose your concentration.
- id: 59
  category: vehicle_information
  question: How effective must your vehicle's parking brake be?
  choices:
    A: It must stop the vehicle within 30 feet at 20 mph.
    B: It must stop the vehicle within 55 feet at 20 mph.
    C: It must hold the vehicle stationary on a 15-degree incline.
    D: It must stop the vehicle within 100 feet at 30 mph.
  answer: B
  explanation: The parking brake must be strong enough to stop the vehicle within
    fifty-five feet at twenty miles per hour.
- id: 60
  category: safe_driving_rules
  question: When driving long distances, how often does the manual recommend taking
    a break?
  choices:
    A: Every 50 miles
    B: Every 100 miles
    C: Every 150 miles
    D: Every 200 miles
  answer: B
  explanation: While driving long distances, the manual advises drivers to take a
    break every one hundred miles.
- id: 61
  category: safe_driving_rules
  question: According to the manual, which of the following cellphone activities is
    permitted while driving?
  choices:
    A: Reading a text message
    B: Posting to a social networking site
    C: Using a voice-operated or hands-free device
    D: Writing an email
  answer: C
  explanation: Writing, sending, or reading text messages and posting to social networking
    sites are not allowed. However, if you must make a phone call, a hands-free or
    voice-operated device is recommended.
- id: 62
  category: defensive_driving
  question: Why should you never wear stereo headphones while driving?
  choices:
    A: They can cause a mirrored effect on the windows.
    B: You may be unable to hear warning signals such as whistles and sirens.
    C: They are considered a visual obstruction by law enforcement.
    D: They drain the vehicle's battery.
  answer: B
  explanation: You should never wear stereo headphones while you drive because you
    may be unable to hear warning signals such as whistles and sirens.
- id: 63
  category: signs_and_signals
  question: What does a broken yellow line on the pavement indicate?
  choices:
    A: It separates traffic lanes moving in the same direction.
    B: Crossing the line is strictly prohibited at all times.
    C: It separates traffic lanes moving in opposite directions, and passing is permissible
      when safe.
    D: It indicates a pedestrian crosswalk ahead.
  answer: C
  explanation: A broken yellow line separates traffic lanes that move in opposite
    directions. Crossing into the oncoming lane is permissible ONLY for passing and
    only when it is safe to pass.
- id: 64
  category: signs_and_signals
  question: What is the rule regarding a double, solid white line on the roadway?
  choices:
    A: Travel in the same direction is permitted, but crossing the line is prohibited.
    B: It separates traffic moving in opposite directions.
    C: Crossing is discouraged but permitted when passing.
    D: It indicates a center turn lane.
  answer: A
  explanation: A double, solid white line means travel in the same direction is permitted
    on both sides of the line, but crossing a double white line is PROHIBITED.
- id: 65
  category: safe_driving_rules
  question: How should a center lane painted with 'TURN LANE ONLY' be used?
  choices:
    A: For normal travel during heavy traffic.
    B: For passing slow-moving vehicles.
    C: Only in preparation to turn left or right across the opposite lanes.
    D: As a designated lane for emergency vehicles.
  answer: C
  explanation: A vehicle may use a TURN LANE ONLY lane ONLY in preparation to turn
    left or right across the opposite lanes. The turn lane is NEVER used for passing.
- id: 66
  category: sharing_the_road
  question: What must a driver do when approaching a pedestrian in an unmarked crosswalk?
  choices:
    A: Yield to the pedestrian only if the crosswalk is painted.
    B: Always yield to the pedestrian.
    C: Sound the horn and proceed with caution.
    D: Stop the vehicle directly on the crosswalk to block traffic.
  answer: B
  explanation: Drivers must always yield to pedestrians in crosswalks—even if the
    crosswalk is not marked.
- id: 67
  category: signs_and_signals
  question: Which standard sign shape is used exclusively for YIELD signs?
  choices:
    A: Octagon
    B: Diamond
    C: Equilateral Triangle
    D: Pennant
  answer: C
  explanation: The equilateral triangle shape is used exclusively for YIELD signs.
- id: 68
  category: signs_and_signals
  question: What does an orange traffic sign indicate?
  choices:
    A: Motorist services guidance
    B: Public recreation and scenic guidance
    C: General warning
    D: Construction or maintenance warning
  answer: D
  explanation: The color orange on a traffic sign indicates a construction or maintenance
    warning.
- id: 69
  category: signs_and_signals
  question: A pennant-shaped traffic sign is used to warn drivers of what?
  choices:
    A: A school zone ahead
    B: A railroad crossing ahead
    C: A NO PASSING ZONE ahead
    D: An existing hazard on the roadway
  answer: C
  explanation: A pennant-shaped sign is used as a warning of a NO PASSING ZONE ahead.
- id: 70
  category: defensive_driving
  question: What should you do if you encounter a WRONG WAY sign?
  choices:
    A: Slow down and proceed with caution.
    B: Leave the roadway and turn around as soon as possible.
    C: Move to the right lane and continue driving.
    D: Stop and wait for a police officer to escort you.
  answer: B
  explanation: The WRONG WAY sign tells you that you are traveling in the opposite
    direction from the other cars in your lane. You must leave the roadway and turn
    around as soon as possible.
- id: 71
  category: vehicle_information
  question: Which of the following is considered a visual obstruction and is not allowed
    on your vehicle's windows?
  choices:
    A: A hands-free mobile device
    B: Glass material that causes a mirrored effect
    C: A pet carrier in the back seat
    D: A portable kennel
  answer: B
  explanation: Vehicles may not have signs, posters, stickers, or glass material that
    cause a mirrored effect on the windows, as these are visual obstructions.
- id: 72
  category: signs_and_signals
  question: What type of warning does a pentagon-shaped sign provide?
  choices:
    A: School crossing signs and warning of school zones ahead
    B: Warning of a railroad crossing ahead
    C: Exclusively to warn of a hazard on the roadway
    D: Exclusively for STOP signs
  answer: A
  explanation: A pentagon shape is used for school crossing signs and warning of school
    zones ahead.
- id: 73
  category: signs_and_signals
  question: What does a single, solid white line separating lanes of traffic mean?
  choices:
    A: Travel in the same direction is permitted, but crossing the line is discouraged.
    B: Travel in opposite directions is permitted, and passing is allowed.
    C: You must turn right at the next intersection.
    D: Crossing the line is strictly prohibited by law.
  answer: A
  explanation: A single, solid white line means travel in the same direction is permitted
    on both sides of the line, but crossing a single white line is discouraged.
- id: 74
  category: vehicle_information
  question: Who should you contact to obtain a handicap license tag or temporary hangtag
    for handicapped parking?
  choices:
    A: The Department of Public Safety
    B: The local police department
    C: Your County Tax Collector's Office
    D: The Department of Transportation
  answer: C
  explanation: For information on obtaining a handicap tag, you must contact your
    County Tax Collector's Office.
- id: 75
  category: safe_driving_rules
  question: What is the only permitted use of a center lane marked specifically for
    turns?
  choices:
    A: Normal travel
    B: Passing slow vehicles
    C: Making turns
    D: Parking during emergencies
  answer: C
  explanation: The manual states that you may ONLY use the center lane TO MAKE TURNS.
    It is not available for normal travel or passing.
- id: 76
  category: safe_driving_rules
  question: What is the speed limit in a school zone when passing a school during
    recess or while children are arriving or leaving?
  choices:
    A: 10 miles per hour
    B: 15 miles per hour
    C: 20 miles per hour
    D: 25 miles per hour
  answer: B
  explanation: The manual states the speed limit in a school zone is fifteen miles
    per hour when passing a school during recess or while children are arriving at
    or leaving school.
- id: 77
  category: sharing_the_road
  question: Who has the right of way at intersections when a pedestrian is crossing?
  choices:
    A: The vehicle traveling straight
    B: The vehicle making a right turn
    C: The pedestrian, but only if the crosswalk is marked
    D: The pedestrian, whether the crosswalk is marked or not
  answer: D
  explanation: The manual states that pedestrians have the right of way at intersections,
    whether the crosswalk is marked or not.
- id: 78
  category: safe_driving_rules
  question: Which of the following is a rule you should follow when driving through
    a work zone?
  choices:
    A: Maintain your normal speed
    B: Tailgate the vehicle in front of you to keep traffic moving
    C: Reduce your speed and be prepared to stop suddenly
    D: Ignore flaggers if they contradict posted signs
  answer: C
  explanation: The manual advises drivers to reduce their speed in work zones, be
    prepared to stop suddenly, and explicitly states 'Do not tailgate in work zones.'
- id: 79
  category: signs_and_signals
  question: What does a fluorescent or reflective orange and red triangle displayed
    on the rear of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is traveling 25 mph or less
    C: The vehicle is broken down
    D: The vehicle is an emergency responder
  answer: B
  explanation: This emblem identifies slow-moving vehicles, which are vehicles that
    travel twenty-five miles per hour or less.
- id: 80
  category: sharing_the_road
  question: When sharing the road with horseback riders or animal-drawn vehicles,
    what should you avoid doing?
  choices:
    A: Passing with caution
    B: Anticipating left turns
    C: Using your horn or revving your engine
    D: Yielding the right of way
  answer: C
  explanation: The manual states, 'Do not use your horn or "rev" the engine because
    this may scare the horse and cause a crash.'
- id: 81
  category: safe_driving_rules
  question: When required to stop at a railroad crossing, what is the required stopping
    distance from the outer rail?
  choices:
    A: Within 10 to 5 feet
    B: Within 50 to 10 feet
    C: Within 100 to 50 feet
    D: Within 25 to 15 feet
  answer: B
  explanation: All drivers must always stop within fifty to ten feet of the outer
    rail of any railroad crossing when required to stop.
- id: 82
  category: vehicle_information
  question: Which of the following vehicles MUST stop at ALL railroad crossings, regardless
    of signage or flashing lights?
  choices:
    A: A passenger car towing a trailer
    B: A school bus carrying children
    C: A motorcycle
    D: A delivery van
  answer: B
  explanation: The manual states that a school bus carrying even one child, a vehicle
    for hire carrying passengers, or a vehicle carrying explosives or flammable liquids
    MUST STOP at ALL railroad crossings.
- id: 83
  category: defensive_driving
  question: If your vehicle is stuck on the train tracks and the warning lights begin
    to flash, what should you do after getting out of the vehicle?
  choices:
    A: Run straight down the tracks away from the train
    B: Run in a 45-degree angle away from the tracks in the direction the train is
      coming
    C: Run in a 45-degree angle away from the tracks in the direction the train is
      going
    D: Stand next to your vehicle and wave your arms
  answer: B
  explanation: 'The manual instructs: ''Once outside, run in a 45-degree angle away
    from the tracks in the direction that the train is coming, then immediately dial
    911.'''
- id: 84
  category: safe_driving_rules
  question: What should you NOT do while driving across railroad tracks?
  choices:
    A: Look both ways
    B: Shift gears
    C: Maintain a steady speed
    D: Check for a second train
  answer: B
  explanation: 'The manual explicitly states: ''Do not shift gears as you drive across
    tracks.'''
- id: 85
  category: signs_and_signals
  question: What is the purpose of the blue Emergency Notification System (ENS) sign
    at a highway-rail grade crossing?
  choices:
    A: To advertise local emergency services
    B: To provide a toll-free number to report unsafe conditions or stranded vehicles
    C: To indicate the speed limit for trains
    D: To warn drivers of upcoming traffic lights
  answer: B
  explanation: The ENS sign provides a toll-free number answered by railroad dispatchers
    and an identification number for your location to report unsafe conditions or
    disabled vehicles.
- id: 86
  category: license_system
  question: Where can you obtain information on getting a handicap license tag or
    temporary hangtag?
  choices:
    A: The Department of Public Safety
    B: The County Tax Collector's Office
    C: The local police department
    D: The Department of Transportation
  answer: B
  explanation: 'The manual states: ''For information on obtaining a handicap tag,
    contact your County Tax Collector''s Office.'''
- id: 87
  category: signs_and_signals
  question: In rural areas, how far in advance of the railroad tracks is the round
    yellow warning sign normally posted?
  choices:
    A: 100 to 200 feet
    B: 250 to 400 feet
    C: 500 to 900 feet
    D: 1000 to 1500 feet
  answer: C
  explanation: The manual states that in rural areas, the round yellow sign with a
    black 'cross buck' and two R's is normally posted 500 to 900 feet in front of
    the tracks.
- id: 88
  category: safe_driving_rules
  question: If a traffic officer directs you to proceed over a railroad crossing despite
    other signals, what should you do?
  choices:
    A: Wait for the lights to stop flashing
    B: Follow the officer's order immediately
    C: Stop and ask the officer for clarification
    D: Turn around and find another route
  answer: B
  explanation: 'The manual states: ''If a traffic officer directs you to proceed over
    a railroad crossing, follow the order immediately.'''
- id: 89
  category: signs_and_signals
  question: Which of the following are used as barriers to keep traffic out of hazardous
    work zones?
  choices:
    A: Drums, cones, and tubes
    B: Painted yellow lines only
    C: Speed bumps and rumble strips
    D: Flashing green lights
  answer: A
  explanation: 'The manual states: ''Barriers, such as drums, cones, and tubes (panels),
    are used to keep traffic out of hazardous work zones.'''
- id: 90
  category: signs_and_signals
  question: When are you permitted to make a right turn at a solid red light?
  choices:
    A: Anytime, without stopping, if the intersection is clear.
    B: Only after slowing down and yielding to pedestrians.
    C: After making a complete stop and yielding to traffic and pedestrians, unless
      a sign prohibits it.
    D: Only when a green arrow is also illuminated.
  answer: C
  explanation: You may turn right while the light is red. But first, you must STOP
    COMPLETELY and yield to other traffic and pedestrians. You may NOT turn on red
    if a sign prohibits you.
- id: 91
  category: signs_and_signals
  question: What does a solid green light mean if you are turning left?
  choices:
    A: You have a protected turn and oncoming traffic must stop.
    B: You must yield to oncoming traffic.
    C: You must wait for a green arrow before turning.
    D: You should turn immediately to clear the intersection.
  answer: B
  explanation: If you are turning left, the solid green light means you must YIELD
    TO ONCOMING TRAFFIC.
- id: 92
  category: signs_and_signals
  question: What does a flashing yellow arrow indicate?
  choices:
    A: You have a protected turn.
    B: You may turn in the direction of the arrow but must yield to oncoming traffic.
    C: The light is about to turn red and you must stop.
    D: You cannot turn in the direction of the arrow.
  answer: B
  explanation: A YELLOW FLASHING ARROW means you may turn in the direction of the
    arrow if you are in the proper lane. You must YIELD TO ONCOMING TRAFFIC.
- id: 93
  category: safe_driving_rules
  question: How should you proceed if you approach a malfunctioning traffic light
    with no functioning lights?
  choices:
    A: Slow down and proceed without stopping if the way is clear.
    B: Stop completely and proceed with caution, yielding right of way at intersections.
    C: Treat the intersection as a yield sign.
    D: Wait until a traffic officer arrives to direct traffic.
  answer: B
  explanation: If you approach a malfunctioning traffic light with NO FUNCTIONING
    LIGHTS, you must STOP completely and proceed with caution, following rules or
    yielding right of way at intersections.
- id: 94
  category: signs_and_signals
  question: How will a traffic officer usually signal you to stop?
  choices:
    A: By holding up one hand, palm toward you, and giving a long blast on the whistle.
    B: By motioning with one hand and giving a series of short blasts on the whistle.
    C: By waving a red flag in a circular motion.
    D: By pointing directly at your vehicle and blowing the whistle twice.
  answer: A
  explanation: An officer will usually signal you to stop by holding up one hand,
    palm toward you, and then giving a long blast on the whistle.
- id: 95
  category: safe_driving_rules
  question: What is the maximum speed limit for any vehicle in a school zone?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: The maximum speed for any vehicle in a SCHOOL ZONE is 15 mph.
- id: 96
  category: safe_driving_rules
  question: What are the maximum and minimum speed limits for passenger automobiles
    on interstates?
  choices:
    A: 65 mph maximum, 40 mph minimum
    B: 70 mph maximum, 45 mph minimum
    C: 70 mph maximum, 40 mph minimum
    D: 75 mph maximum, 50 mph minimum
  answer: C
  explanation: The speed limits for passenger automobiles on Interstates are a maximum
    speed of 70 mph and a minimum speed of 40 mph.
- id: 97
  category: safe_driving_rules
  question: Which of the following is an incorrect use of your vehicle's signal lights?
  choices:
    A: Signaling to enter a parallel parking space.
    B: Signaling to let a vehicle behind you know it is safe to pass.
    C: Signaling well in advance of a turn.
    D: Signaling when changing lanes.
  answer: B
  explanation: Do not use your left signal to let a vehicle behind you know it is
    safe to pass. The driver behind you is responsible for determining whether it
    is safe to pass.
- id: 98
  category: safe_driving_rules
  question: What is the proper arm signal for a right turn?
  choices:
    A: Extend your arm and hand straight out.
    B: Extend your arm and hand downward, with your palm facing the rear.
    C: Extend your arm and hand upward, with your arm bent at the elbow.
    D: Wave your hand in a circular motion.
  answer: C
  explanation: 'RIGHT TURN: Extend your arm and hand upward, with your arm bent at
    the elbow.'
- id: 99
  category: safe_driving_rules
  question: When using arm signals, how far in advance must you signal continuously
    before you slow down, turn, stop, or change lanes?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: If you are using arm signals, be sure to extend your arm fully and
    signal continuously for at least one hundred feet before you slow down, turn,
    stop, or change lanes.
- id: 100
  category: defensive_driving
  question: What is the recommended following distance when driving behind another
    vehicle?
  choices:
    A: One car length for every 5 miles per hour of speed.
    B: One car length for every 10 miles per hour of speed.
    C: Two car lengths for every 10 miles per hour of speed.
    D: Three car lengths regardless of speed.
  answer: B
  explanation: When you are following another vehicle, allow at least one car length
    between you for every ten miles per hour of speed.
- id: 101
  category: sharing_the_road
  question: How should you adjust your following distance if you are taking part in
    a motorcade or funeral procession?
  choices:
    A: Drive as closely as possible to the vehicle in front of you to prevent others
      from cutting in.
    B: Allow enough space between you and the next car so that other vehicles may
      safely pull into those spaces.
    C: Maintain a distance of exactly one car length regardless of speed.
    D: Drive in the left lane to bypass other traffic.
  answer: B
  explanation: If you are taking part in a motorcade, such as a funeral procession,
    allow enough space between you and the next car so that other vehicles may safely
    pull into those spaces.
- id: 102
  category: signs_and_signals
  question: What should a pedestrian do if they have already begun to cross the intersection
    and the pedestrian crossing sign changes to flashing?
  choices:
    A: Stop in the middle of the intersection and wait for the next signal.
    B: Turn around and return to the curb they left.
    C: Continue crossing the intersection.
    D: Run as fast as possible to the nearest curb.
  answer: C
  explanation: Pedestrians should continue crossing if they began to cross the intersection
    before the sign changed to flashing.
- id: 103
  category: signs_and_signals
  question: When lane direction control signals are in use, which lanes are you permitted
    to travel in?
  choices:
    A: Any lane that does not have oncoming traffic.
    B: Only lanes marked with a flashing yellow light.
    C: Only lanes marked by a green light.
    D: Any lane, as long as you yield to other vehicles.
  answer: C
  explanation: When signals like these are in use, you may travel ONLY in a lane marked
    by a green light. NEVER travel in a lane marked with a red light.
- id: 104
  category: vehicle_information
  question: What is the maximum speed limit for a school bus while transporting children
    to and from school on regular routes?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: The maximum speed for a SCHOOL BUS while transporting children to and
    from school on regular routes is 45 mph.
- id: 105
  category: vehicle_information
  question: The braking distances shown in the manual assume which of the following
    ideal conditions?
  choices:
    A: Good tires, good brakes, and dry pavement
    B: New tires, anti-lock brakes, and a paved road
    C: Good tires, good brakes, and wet pavement
    D: Clear weather, daylight, and good brakes
  answer: A
  explanation: 'The manual states that the braking distances shown assume ideal conditions:
    good tires, good brakes, and dry pavement.'
- id: 106
  category: safe_driving_rules
  question: If you are driving on a street or highway with more than one lane for
    your direction, which lane should you generally drive in?
  choices:
    A: The extreme left lane
    B: The center lane
    C: The extreme right lane
    D: The lane with the least amount of traffic
  answer: C
  explanation: If you drive on a street or highway with more than one lane for your
    direction, you should drive in the extreme RIGHT lane except to pass or turn left.
- id: 107
  category: signs_and_signals
  question: What does it mean if you are on a highway divided by one solid yellow
    line and one broken yellow line?
  choices:
    A: You may cross the lines to pass only if the solid yellow line is closest to
      your travel lane.
    B: You may never cross the lines to pass under any circumstances.
    C: You may cross the lines to pass only if the broken yellow line is closest to
      your travel lane.
    D: You may cross the lines to pass regardless of which line is closest to you.
  answer: C
  explanation: If you are on a highway divided by BOTH one solid yellow line AND one
    broken yellow line, you may cross the lines for passing ONLY if the broken yellow
    line is closest to your travel lane (and if the oncoming lane is clear, and it
    is safe to pass).
- id: 108
  category: safe_driving_rules
  question: In which of the following situations are you permitted to overtake and
    pass another vehicle on the right?
  choices:
    A: When the vehicle you are passing is making or is about to make a left turn.
    B: When you are driving on a two-lane highway with a solid double yellow line.
    C: When you must drive off the pavement onto the shoulder to get around the vehicle.
    D: When the vehicle ahead is traveling below the posted speed limit on a single-lane
      road.
  answer: A
  explanation: You may overtake and pass another vehicle on the right when the vehicle
    you are passing is making or is about to make a left turn, provided conditions
    permit you to do so safely.
- id: 109
  category: safe_driving_rules
  question: You should NOT pass another vehicle within how many feet of a bridge,
    viaduct, or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: 'The manual states: ''Do not pass on hills, curves, or within one hundred
    feet of bridges, viaducts, overpasses, railroad crossings, crosswalks, intersections,
    or any place where your view is obstructed in any way.'''
- id: 110
  category: defensive_driving
  question: What should you do when you are being passed by another vehicle on a two-lane
    or three-lane highway?
  choices:
    A: Move to the left to block the passing vehicle.
    B: Increase your speed so the other vehicle can merge behind you.
    C: Keep to the right and do not increase your speed until the other car has completely
      passed you.
    D: Flash your headlights to warn oncoming traffic.
  answer: C
  explanation: When being passed on a two-lane or three-lane highway, keep to the
    right. Do not increase your speed until the other car has completely passed you.
- id: 111
  category: safe_driving_rules
  question: When turning your car around in a confined space, what is the first step
    you should take?
  choices:
    A: Start from the extreme left side of the road and turn the wheel sharply to
      the right.
    B: Start from the extreme right side of the road, give the correct signal, and
      turn the steering wheel sharply to the left while inching forward.
    C: Back up slowly to the right curb before turning the wheel to the left.
    D: Turn your wheels completely to the right and accelerate quickly.
  answer: B
  explanation: To safely turn around in a confined space, step 1 is to start from
    the extreme right side of the road, give the correct signal, and turn the steering
    wheel sharply to the left while inching forward.
- id: 112
  category: defensive_driving
  question: What should you do if you are approaching an intersection and traffic
    is blocked ahead of you?
  choices:
    A: Enter the intersection and wait for traffic to clear.
    B: Stop on the crosswalk so pedestrians can walk behind your vehicle.
    C: Stop before reaching the crosswalk and wait for traffic to move.
    D: Honk your horn to encourage the traffic ahead to move faster.
  answer: C
  explanation: When approaching an intersection and traffic is blocked ahead of you,
    you should stop before reaching the crosswalk and wait for traffic to move.
- id: 113
  category: safe_driving_rules
  question: When preparing to make a turn at an intersection, what should you do with
    your vehicle's wheels while waiting to turn?
  choices:
    A: Turn them slightly in the direction of your intended turn.
    B: Keep the wheels of your vehicle straight until the turn has started.
    C: Turn them sharply to the right to prevent rolling into traffic.
    D: Keep them turned to the left to prepare for a quick maneuver.
  answer: B
  explanation: The manual advises drivers to 'Keep the wheels of your vehicle straight
    until the turn has started' when preparing to turn at an intersection.
- id: 114
  category: vehicle_information
  question: Which of the following actions should you AVOID while making a turn at
    an intersection?
  choices:
    A: Completing the turn at a consistent speed.
    B: Shifting gears while entering the intersection.
    C: Slowing down well before reaching the crosswalk.
    D: Staying in your lane throughout the turn.
  answer: B
  explanation: According to the guidelines for making a safe turn, you should 'Do
    not shift gears while entering the intersection.'
- id: 115
  category: safe_driving_rules
  question: How far from an intersection should you turn on your signal before making
    a left or right turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: For both left and right turns, the manual instructs drivers to turn
    on their signal and slow down 'At least one hundred feet from the intersection.'
- id: 116
  category: safe_driving_rules
  question: When passing another vehicle on the left, when is it safe to pull back
    into the right lane?
  choices:
    A: As soon as your front bumper is ahead of the other vehicle.
    B: When you are parallel with the other vehicle.
    C: When you can see the vehicle you passed in your rearview mirror.
    D: Immediately after you activate your right turn signal.
  answer: C
  explanation: 'The manual states: ''Before moving back into the right lane, make
    sure that you can see the vehicle you passed in your rearview mirror.'''
- id: 117
  category: safe_driving_rules
  question: Under what circumstances are you allowed to drive off the pavement or
    on the shoulder to pass another vehicle?
  choices:
    A: When the vehicle ahead is turning left and there is no room on the pavement.
    B: When you are on a four-lane highway and the right lane is blocked.
    C: When avoiding a slow-moving farm vehicle.
    D: Under no circumstances.
  answer: D
  explanation: 'The manual explicitly states: ''Under no circumstances are you allowed
    to drive off the pavement or on the shoulder to pass.'''
- id: 118
  category: safe_driving_rules
  question: When executing a left turn, where should you position your vehicle as
    you enter the intersection?
  choices:
    A: Just to the left of the center.
    B: Just to the right of the center.
    C: As close to the right curb as possible.
    D: In the extreme left lane of the cross street.
  answer: B
  explanation: Step 4 of making a left turn states to 'look both ways before entering
    intersection. Then enter just to the right of center.'
- id: 119
  category: signs_and_signals
  question: On a divided highway, what do green arrows painted on the roadway indicate?
  choices:
    A: They are pavement markings indicating a passing zone.
    B: They indicate the direction of travel and are not pavement markings.
    C: They mark the location of a pedestrian crosswalk.
    D: They indicate a designated parking lane.
  answer: B
  explanation: The manual notes that 'Green arrows indicate the direction of travel
    and are not pavement markings.'
- id: 120
  category: safe_driving_rules
  question: When traveling on a one-way street, what is a good rule to remember when
    preparing to make a turn?
  choices:
    A: Always turn from the center lane.
    B: Always turn from the lane nearest the curb.
    C: Turn from the lane furthest from the curb.
    D: You may turn from any available lane.
  answer: B
  explanation: The manual states that a good rule to remember when traveling on a
    one-way street is to always turn from the lane nearest the curb.
- id: 121
  category: safe_driving_rules
  question: When two drivers approach an intersection from opposite directions and
    both want to turn left, how should they proceed?
  choices:
    A: Each driver should turn to the right of the other.
    B: The driver who arrived first must back up.
    C: Each driver should turn to the left of the other.
    D: Both drivers must proceed straight through the intersection.
  answer: C
  explanation: According to the manual, when two drivers approach an intersection
    and both want to turn left, each driver should turn to the left of the other.
- id: 122
  category: defensive_driving
  question: What should you do if traffic is blocked when you approach an intersection?
  choices:
    A: Enter the intersection and wait for traffic to clear.
    B: Stop before you reach the crosswalk and wait for traffic to move.
    C: Honk your horn until the traffic moves forward.
    D: Drive onto the shoulder to bypass the blocked intersection.
  answer: B
  explanation: The manual advises that if traffic is blocked when you approach an
    intersection, you should stop before you reach the crosswalk and wait for traffic
    to move.
- id: 123
  category: safe_driving_rules
  question: If two vehicles arrive at a four-way stop at the same time, who has the
    right of way?
  choices:
    A: The vehicle on the left.
    B: The vehicle on the right.
    C: The vehicle traveling faster.
    D: The vehicle intending to turn left.
  answer: B
  explanation: At a four-way stop, if multiple vehicles arrive at the same time, the
    vehicle on the right has the right of way.
- id: 124
  category: safe_driving_rules
  question: In which direction do vehicles travel around a roundabout or traffic circle?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a figure-eight pattern
    D: Whichever direction has less traffic
  answer: B
  explanation: The manual states that vehicles travel counterclockwise around a raised
    center island in a roundabout or traffic circle.
- id: 125
  category: safe_driving_rules
  question: How far away must you stop from a school bus with its red lights flashing
    and stop sign extended?
  choices:
    A: At least 5 feet
    B: At least 10 feet
    C: At least 15 feet
    D: At least 20 feet
  answer: B
  explanation: Mississippi law states that you must come to a complete stop at least
    ten feet away from a school bus with its red lights flashing and/or stop sign
    extended.
- id: 126
  category: safe_driving_rules
  question: When are you NOT required to stop for a school bus with flashing red lights?
  choices:
    A: When you are traveling in the same direction on a two-lane road.
    B: When you are traveling in the opposite direction on a divided highway with
      four or more lanes.
    C: When you are running late for work.
    D: When the bus is stopped at a railroad crossing.
  answer: B
  explanation: If you are traveling in the opposite direction as the stopped school
    bus on a divided highway with four or more lanes, you may continue to travel without
    stopping.
- id: 127
  category: sharing_the_road
  question: What is a common indicator that a pedestrian is blind or visually impaired?
  choices:
    A: They are walking a small dog.
    B: They are carrying a white cane, which may have a red tip.
    C: They are wearing bright reflective clothing.
    D: They are walking outside of the crosswalk.
  answer: B
  explanation: The manual notes to be on the lookout for vulnerable pedestrians carrying
    a white cane, which may have a red tip, indicating they are blind or visually
    impaired.
- id: 128
  category: sharing_the_road
  question: What is the rule regarding funeral processions according to the manual?
  choices:
    A: You are required by law to yield the right of way.
    B: You must pull over and turn off your engine.
    C: It is common courtesy to yield the right of way, although not required by law.
    D: You have the right of way and should proceed normally.
  answer: C
  explanation: 'The manual states: ''Although not required by law, common courtesy
    is to yield the right of way to funeral processions.'''
- id: 129
  category: safe_driving_rules
  question: You may not stop and leave your vehicle parked and unattended within how
    many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: A
  explanation: Prohibited parking areas include within ten feet of a fire hydrant.
- id: 130
  category: safe_driving_rules
  question: It is prohibited to park within how many feet of the nearest rail of any
    railroad crossing?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: You may not park within fifteen feet of the nearest rail of any railroad
    crossing.
- id: 131
  category: safe_driving_rules
  question: If you must park along a highway outside of business or residential districts,
    how far away must your parked vehicle be visible in both directions?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: When parking on a highway, you must park so you can be seen from at
    least two hundred feet in both directions.
- id: 132
  category: sharing_the_road
  question: How should you treat bicycles when determining right of way at an intersection?
  choices:
    A: Always yield to them regardless of traffic signs.
    B: Bicycles must always yield to motor vehicles.
    C: Yield to bicycles exactly as you would to any other vehicle.
    D: Bicycles are not allowed in intersections.
  answer: C
  explanation: 'The manual states: ''You must yield to BICYCLES exactly as you would
    to any other vehicle.'''
- id: 133
  category: vehicle_information
  question: When parking a vehicle with a standard (manual) transmission, what gear
    should you put it in?
  choices:
    A: Park
    B: Neutral
    C: Low
    D: Reverse
  answer: C
  explanation: In general, when you park your vehicle, you should put the gear in
    park (automatic transmission) or low (standard transmission).
- id: 134
  category: safe_driving_rules
  question: When parallel parking, how close should your tires be to the curb?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: B
  explanation: For vehicles parked parallel, tires should be within twelve inches
    of the curb.
- id: 135
  category: sharing_the_road
  question: Who has the right of way when a driver is leaving a parallel parking space
    and entering traffic?
  choices:
    A: The driver leaving the parking space
    B: Oncoming traffic
    C: Pedestrians only
    D: The vehicle moving at the slowest speed
  answer: B
  explanation: The driver leaving a parking space does not have the right of way.
    You must YIELD to any oncoming traffic.
- id: 136
  category: safe_driving_rules
  question: How should you turn your wheels when parking in an uphill position with
    a curb?
  choices:
    A: Sharply to the right
    B: Sharply to the left
    C: Straight ahead
    D: Parallel to the curb
  answer: B
  explanation: In an uphill position with a curb, turn your wheels sharply to the
    left.
- id: 137
  category: defensive_driving
  question: What is the safest thing to do if you meet a vehicle at night with bright
    or blinding headlights?
  choices:
    A: Flash your high beams repeatedly
    B: Put on darkened glasses
    C: Dim your lights and keep your eyes on the right side of the road
    D: Look directly at the oncoming headlights to gauge their distance
  answer: C
  explanation: If you meet a vehicle at night with bright or blinding headlights,
    the safest thing to do is to dim your lights and keep your eyes on the right side
    of the road.
- id: 138
  category: safe_driving_rules
  question: By law, you must use your low beams when you approach within what distance
    of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 400 feet
    D: 500 feet
  answer: D
  explanation: You are required by law to use your low beams when you approach within
    five hundred feet of an oncoming vehicle or when you are following within five
    hundred feet of another vehicle.
- id: 139
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog?
  choices:
    A: High beams
    B: Lower beams
    C: Parking lights only
    D: Emergency flashers
  answer: B
  explanation: Always use the lower beam when driving in fog during the night or day.
    Using high beams while driving in fog reduces visibility.
- id: 140
  category: driver_responsibility
  question: According to Mississippi law, children of what age must be properly secured
    in a belt-positioning booster seat if they are under 4 feet 9 inches tall or weigh
    less than 65 pounds?
  choices:
    A: Under four years old
    B: At least four years old but under seven years old
    C: At least seven years old but under ten years old
    D: Under thirteen years old
  answer: B
  explanation: Children at least four years old but under seven years old who are
    less than 4 feet 9 inches in height or who weigh less than sixty-five pounds must
    be properly secured in a belt-positioning booster seat system.
- id: 141
  category: defensive_driving
  question: When are roads typically the slickest and most dangerous during a rainstorm?
  choices:
    A: After it has been raining heavily for an hour
    B: During the opening minutes of rain or drizzle
    C: Right after the rain has completely stopped
    D: When the puddles begin to evaporate
  answer: B
  explanation: The opening minutes of rain or drizzle are actually the slickest and
    most dangerous because the first water to hit the road loosens accumulated dirt
    and grease.
- id: 142
  category: defensive_driving
  question: What should you do if your vehicle starts to skid?
  choices:
    A: Brake suddenly to stop the vehicle
    B: Turn the wheel in the opposite direction of the skid
    C: Turn the wheel in the direction of the skid
    D: Engage the clutch immediately
  answer: C
  explanation: If your vehicle starts to skid, turn the wheel in the direction of
    the skid. Remember that braking suddenly will increase the skid. Never use the
    clutch when you are trying to stop a skid.
- id: 143
  category: defensive_driving
  question: If you experience a flat tire or blowout while driving, what is the first
    thing you should do?
  choices:
    A: Apply your brakes suddenly
    B: Take your foot off the accelerator
    C: Turn the steering wheel sharply to the right
    D: Shift into neutral
  answer: B
  explanation: If you have a flat tire or blowout, do not apply your brakes suddenly.
    Take your foot off the accelerator. Then apply the brakes slowly and cautiously.
- id: 144
  category: safe_driving_rules
  question: If your car becomes disabled and you must walk to seek help, where should
    you walk?
  choices:
    A: On the right side of the highway, with traffic
    B: On the left side of the highway, facing oncoming traffic
    C: In the center median
    D: On the right side of the highway, facing oncoming traffic
  answer: B
  explanation: If you must walk to seek help, always walk on the left side of the
    highway, facing oncoming traffic.
- id: 145
  category: driver_responsibility
  question: What number can you dial on a cellular phone to report an emergency traffic
    situation to the Mississippi Highway Patrol?
  choices:
    A: '*HP (*47)'
    B: '*MHP (*647)'
    C: '*911'
    D: '*DOT (*368)'
  answer: A
  explanation: To report an emergency traffic situation on an interstate or highway
    in Mississippi, dial *HP (*47) on a cellular phone to be connected toll free to
    a Mississippi Highway Patrol dispatcher.
- id: 146
  category: driver_responsibility
  question: You must immediately report an accident to law enforcement if it involves
    injury, death, or apparent property damage exceeding what amount?
  choices:
    A: $100.00
    B: $250.00
    C: $500.00
    D: $1,000.00
  answer: C
  explanation: Report immediately to the proper law enforcement authorities if the
    accident involves injury, death, or apparent property damage exceeding $500.00.
- id: 147
  category: penalties_and_points
  question: What may happen if you are involved in an accident and cannot show Proof
    of Insurance to the responding officer?
  choices:
    A: You will be cited for a violation only if you are at fault.
    B: You may be cited for a violation even if you are not at fault.
    C: Your vehicle will be immediately impounded.
    D: You will be given a 30-day grace period to purchase insurance.
  answer: B
  explanation: If you do not have proof of insurance, you may be cited for a violation
    even if you are not at fault for the accident.
- id: 148
  category: driver_responsibility
  question: When are you legally required to report a traffic accident?
  choices:
    A: Only if you are at fault for the accident.
    B: Only if someone is injured or killed.
    C: Unless there are no injuries and the property damage is less than $500.
    D: Only if the property damage exceeds $1,000.
  answer: C
  explanation: 'The manual states: ''Whether or not you are at fault in an accident,
    you must report it unless there are no injuries and the property damage amounts
    to less than $500.'''
- id: 149
  category: safe_driving_rules
  question: What should you do if an emergency vehicle with flashing lights approaches
    while you are in the middle of an intersection?
  choices:
    A: Stop immediately in the center of the intersection.
    B: Proceed through the intersection, and pull over to the extreme right shoulder.
    C: Make an immediate U-turn to clear the intersection.
    D: Pull over to the left side of the intersection.
  answer: B
  explanation: According to the manual, 'If you are at an intersection, proceed through
    the intersection, and pull over to the extreme right shoulder.'
- id: 150
  category: safe_driving_rules
  question: What must you do if you approach an emergency vehicle with its lights
    activated parked along the side of a four-lane highway?
  choices:
    A: Maintain your speed and stay in your current lane.
    B: Stop immediately next to the emergency vehicle.
    C: Merge into the lane away from the emergency vehicle if safe, or slow down and
      prepare to stop.
    D: Accelerate to pass the emergency vehicle as quickly as possible.
  answer: C
  explanation: The manual requires that you 'merge into the lane away from the emergency
    vehicle if it is safe to do so. If merging into an adjacent lane is not safe,
    slow down and prepare to stop if necessary.'
- id: 151
  category: safe_driving_rules
  question: If you are pulled over by law enforcement at night, what action should
    you take to assist with visibility?
  choices:
    A: Turn off all your vehicle's lights.
    B: Turn on your high beam headlights.
    C: Turn on your interior lights.
    D: Flash your hazard lights continuously.
  answer: C
  explanation: During a traffic stop at night, the manual advises to 'Turn on your
    interior lights if you are pulled over at night to assist with visibility.'
- id: 152
  category: driver_responsibility
  question: When pulled over by a law enforcement officer, when is the appropriate
    time to reach for your driver's license or vehicle documents?
  choices:
    A: As soon as you pull over, before the officer approaches your window.
    B: While the officer is walking up to your vehicle.
    C: Only after waiting for the officer's instructions.
    D: You do not need to provide documents unless you are being arrested.
  answer: C
  explanation: The manual instructs drivers to 'Wait for the officer’s instructions
    before reaching for your driver’s license or vehicle documents.'
- id: 153
  category: penalties_and_points
  question: What does your signature on a traffic ticket indicate?
  choices:
    A: An admission of guilt.
    B: A waiver of your right to a court hearing.
    C: A promise to pay the fine immediately.
    D: It is not an admission of guilt.
  answer: D
  explanation: The manual explicitly states, 'Your acceptance and signature on a traffic
    ticket is not an admission of guilt.'
- id: 154
  category: safe_driving_rules
  question: When entering an interstate highway, where should you increase your speed
    to match the flow of traffic?
  choices:
    A: On the entrance ramp before the acceleration lane.
    B: In the acceleration lane.
    C: After you have merged into the main travel lane.
    D: In the deceleration lane.
  answer: B
  explanation: 'The manual states: ''As you reach the end of the ramp, increase your
    speed in the acceleration lane until you reach the speed of the interstate highway
    traffic.'''
- id: 155
  category: safe_driving_rules
  question: When exiting the interstate, when should you begin to reduce your speed?
  choices:
    A: One-quarter mile before the exit while still in the travel lane.
    B: As soon as you turn on your turn signal.
    C: Only after you have safely moved into the deceleration lane.
    D: After you have completely exited the ramp.
  answer: C
  explanation: 'The manual advises: ''Do not slow down until you have safely moved
    into the deceleration lane. Then reduce your speed to the posted limit...'''
- id: 156
  category: safe_driving_rules
  question: What is the correct action to take if you miss your exit on the interstate?
  choices:
    A: Stop and carefully back up on the shoulder.
    B: Make a U-turn through the median.
    C: Continue to the next exit.
    D: Stop in the right lane and wait for traffic to clear before backing up.
  answer: C
  explanation: 'The manual clearly states: ''If you miss your exit, do not stop and
    back up. Continue to the next exit.'''
- id: 157
  category: safe_driving_rules
  question: On an interstate highway, what is the primary intended use of the left
    lane?
  choices:
    A: Through travel.
    B: Passing.
    C: Slower traffic.
    D: Exiting the highway.
  answer: B
  explanation: According to the manual, 'The right lane is intended for through travel
    while the left lane is intended for passing.'
- id: 158
  category: defensive_driving
  question: According to the manual, what is the recommended following distance if
    you are driving at 70 mph on the interstate?
  choices:
    A: Three car lengths.
    B: Five car lengths.
    C: Seven car lengths.
    D: Ten car lengths.
  answer: C
  explanation: 'The manual states: ''If you are driving at seventy mph, stay at least
    seven car lengths from the vehicle ahead.'' (One car length for every 10 mph).'
- id: 159
  category: defensive_driving
  question: If your vehicle breaks down on the interstate and you are stranded, what
    is the safest course of action?
  choices:
    A: Stand beside your vehicle to flag down help.
    B: Walk along the interstate to the nearest exit.
    C: Attempt to hitchhike to a gas station.
    D: Stay inside your vehicle, lock the doors, and wait for reliable help.
  answer: D
  explanation: 'The manual warns: ''If you are stranded on the interstate, never get
    out of your vehicle into the main flow of traffic. Do not stand beside your vehicle.
    Never walk along or across the interstate. Never attempt to hitchhike. Stay inside
    your vehicle, lock the doors, and wait for reliable help.'''
- id: 160
  category: sharing_the_road
  question: How can you tell if you are driving in the blind spot immediately behind
    a large tractor-trailer rig?
  choices:
    A: You are less than 100 feet behind the truck.
    B: You cannot see the truck's side mirrors.
    C: The truck's brake lights are not visible.
    D: You are driving at a speed slower than the truck.
  answer: B
  explanation: 'The manual states: ''Remember: A blind spot exists immediately behind
    large tractor-trailer rigs. If you cannot see the side mirrors on a large truck,
    the driver cannot see you!'''
- id: 161
  category: driver_responsibility
  question: What should you do if you have a weapon in your vehicle when pulled over
    by law enforcement?
  choices:
    A: Hide the weapon under the seat before the officer approaches.
    B: Let the officer know if you have a weapon upon first contact.
    C: Wait until the officer asks to search the vehicle.
    D: Hand the weapon to the officer immediately.
  answer: B
  explanation: During a traffic stop, the manual instructs drivers to 'Let the officer
    know if you have a weapon in the vehicle upon first contact.'
- id: 162
  category: driver_responsibility
  question: If you are involved in an accident and are injured so badly that you cannot
    make an immediate report, who may do so?
  choices:
    A: Only a law enforcement officer.
    B: Any one of your passengers.
    C: The driver of the other vehicle only.
    D: An emergency medical technician.
  answer: B
  explanation: 'The manual states: ''If you are injured so badly that you cannot make
    an immediate report, any one of your passengers may do so.'''
- id: 163
  category: safe_driving_rules
  question: Why should you always dim your headlights when following a large vehicle
    at night?
  choices:
    A: Bright lights can drain your vehicle's battery faster.
    B: Large vehicles have sensitive rear sensors.
    C: Bright lights can reflect off the large side mirrors and blind the driver.
    D: It helps the truck driver see the road ahead more clearly.
  answer: C
  explanation: When following a large vehicle at night, always dim your headlights
    because bright lights from the vehicle behind can blind the driver when they reflect
    off the vehicle's large side mirrors.
- id: 164
  category: sharing_the_road
  question: On a level highway, how much longer does it take to pass a large vehicle
    compared to a car?
  choices:
    A: 1 to 2 seconds longer
    B: 3 to 5 seconds longer
    C: 5 to 7 seconds longer
    D: 8 to 10 seconds longer
  answer: B
  explanation: According to the manual, on a level highway, it takes 3 to 5 seconds
    longer to pass a large vehicle than to pass a car.
- id: 165
  category: defensive_driving
  question: When passing a large truck, when is it safe to move back into the truck's
    lane?
  choices:
    A: As soon as you clear the truck's front bumper.
    B: When you can see the truck driver in your side mirror.
    C: When you can see the front wheels of the truck meeting the pavement in your
      rearview mirror.
    D: After you have maintained your passing speed for at least 10 seconds.
  answer: C
  explanation: Before returning to the lane of the vehicle you have passed, be sure
    to move back only when you can see the front wheels of the truck meeting the pavement
    in your rearview mirror.
- id: 166
  category: sharing_the_road
  question: 'When meeting a large vehicle coming from the opposite direction, you
    should keep as far to the right as possible because wind turbulence:'
  choices:
    A: Pulls vehicles together.
    B: Pushes vehicles apart.
    C: Causes the truck to lose speed.
    D: Creates a vacuum behind your vehicle.
  answer: B
  explanation: You should keep as far to the right as possible to avoid a sideswipe
    crash and reduce wind turbulence, remembering that wind turbulence pushes vehicles
    apart; it does not pull them together.
- id: 167
  category: sharing_the_road
  question: Why should you avoid passing a large truck on the right if there is a
    possibility it might be making a right turn?
  choices:
    A: Trucks must always turn from the center lane.
    B: Trucks require more space to turn and need to swing to the left of the lane.
    C: Passing on the right is illegal on all Mississippi roads.
    D: The truck's exhaust is expelled on the right side.
  answer: B
  explanation: Large vehicles require more space to make a turn and need to swing
    to the left of the lane when preparing to make a right turn. Passing on the right
    could lead to a crash.
- id: 168
  category: sharing_the_road
  question: 'When passing a bicyclist, drivers must leave a safe distance of at least:'
  choices:
    A: Two feet
    B: Three feet
    C: Four feet
    D: Five feet
  answer: B
  explanation: Drivers must leave a safe distance of at least three feet between the
    vehicle and bicycle when passing the bicycle.
- id: 169
  category: sharing_the_road
  question: Under which of the following conditions is a bicyclist allowed to move
    farther to the left into the traffic lane?
  choices:
    A: When riding on a downgrade to gain speed.
    B: When unsafe conditions are present on the right side of the lane, such as parked
      cars or broken glass.
    C: When they want to ride side-by-side with three other cyclists.
    D: When they are traveling slower than the posted speed limit.
  answer: B
  explanation: A bicyclist may move to the left/farther into the traffic lane when
    unsafe conditions are present on the right side of the lane, such as broken pavement,
    pedestrians, parked cars, or road hazards.
- id: 170
  category: safe_driving_rules
  question: Which of the following is a rule for safe cycling regarding the direction
    of travel?
  choices:
    A: Always ride facing oncoming traffic.
    B: Ride on the left side of the road if there is no shoulder.
    C: Travel with the direction of traffic.
    D: Weave in and out of traffic to remain visible.
  answer: C
  explanation: Cyclists should travel with the direction of traffic. The manual explicitly
    states to never ride a bicycle facing oncoming traffic.
- id: 171
  category: sharing_the_road
  question: According to the manual, how fast can an experienced bicyclist ride?
  choices:
    A: 10-15 miles per hour
    B: 15-20 miles per hour
    C: 20-25 miles per hour
    D: 25-30 miles per hour
  answer: C
  explanation: An experienced bicyclist can ride 20-25 miles per hour and may be closer
    than you think.
- id: 172
  category: vehicle_information
  question: 'Your vehicle''s tag light must make the letters and numerals on your
    license plate visible at night from a distance of:'
  choices:
    A: 30 feet
    B: 50 feet
    C: 60 feet
    D: 100 feet
  answer: C
  explanation: You must also have a tag light which makes the letter, numeral or any
    combinations of letter/numerals on your license plate (tag) visible at sixty feet
    at night.
- id: 173
  category: vehicle_information
  question: Where must the window tint compliance decal be affixed on a vehicle registered
    in Mississippi?
  choices:
    A: The upper right corner of the windshield
    B: The lower left corner of the windshield
    C: The lower right corner of the rear window
    D: The driver's side window
  answer: B
  explanation: The window tint decal must be affixed to the lower left corner of the
    windshield.
- id: 174
  category: vehicle_information
  question: 'The windshield of a vehicle with after-market window tint must have a
    label certifying that all windows have a light transmittance of at least:'
  choices:
    A: 20%
    B: 25%
    C: 28%
    D: 32%
  answer: C
  explanation: The windshield of the vehicle must have affixed to it a label certifying
    that all the windows of the vehicle have a light transmittance of 28% or more.
- id: 175
  category: defensive_driving
  question: If you are stopped behind a large vehicle on an upgrade, why should you
    leave additional space?
  choices:
    A: The large vehicle will emit heavy exhaust fumes when accelerating.
    B: The large vehicle may drift backwards slightly when it starts to move.
    C: The driver needs room to back up before moving forward.
    D: It allows you to accelerate faster when the light turns green.
  answer: B
  explanation: If you are stopped behind a large vehicle on an upgrade, leave additional
    space in case the vehicle drifts backwards slightly when it starts to move.
- id: 176
  category: driver_responsibility
  question: What is the minimum liability insurance requirement for property damage
    of others in any single accident in Mississippi?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum insurance amounts include $25,000 for property damage of
    others in any single accident.
- id: 177
  category: driver_responsibility
  question: Is it acceptable to provide proof of insurance in an electronic format
    during a traffic stop?
  choices:
    A: No, only a physical paper card is accepted by law enforcement.
    B: Yes, but only if it is printed out at the scene.
    C: No, electronic proof is only accepted after an accident, not a traffic stop.
    D: Yes, by displaying the electronic image on a cellular phone or other electronic
      device.
  answer: D
  explanation: You may provide proof of insurance in electronic format by displaying
    the electronic image on a cellular phone or any other type of electronic device.
- id: 178
  category: penalties_and_points
  question: If you are the at-fault driver in an accident causing injuries and did
    not have liability insurance, how long must you maintain and file proof of insurance
    afterward?
  choices:
    A: One year
    B: Three years
    C: Five years
    D: Ten years
  answer: B
  explanation: If you were at fault without insurance, the proof of insurance you
    are required to purchase must remain in effect for a period of three years from
    the date of the accident.
- id: 179
  category: safe_driving_rules
  question: If your reactions slow down by only a half-second while traveling 55 miles
    per hour, how much farther will your vehicle travel before stopping?
  choices:
    A: 22 feet
    B: 33 feet
    C: 44 feet
    D: 55 feet
  answer: C
  explanation: If your reactions slow down only a half-second, and you need to hit
    the brakes while traveling fifty-five miles per hour, your vehicle will travel
    an extra forty-four feet before stopping.
- id: 180
  category: alcohol_drugs_health
  question: Which of the following is true regarding medical cannabis and driving
    in Mississippi?
  choices:
    A: Smoking medical cannabis in a motor vehicle is legal as long as the vehicle
      is parked.
    B: Driving under the influence of medical cannabis is permitted if you have a
      valid prescription.
    C: Smoking medical cannabis in a motor vehicle or driving under its influence
      is a violation of the law.
    D: Medical cannabis does not impair a driver's reflexes or judgment.
  answer: C
  explanation: Smoking medical cannabis in a motor vehicle or operating or being in
    actual physical control of any motor vehicle while under the influence is a violation
    of Mississippi’s laws and can result in arrest.
- id: 181
  category: alcohol_drugs_health
  question: Under Mississippi's Implied Consent Law, what is the administrative penalty
    if you refuse a law enforcement officer's request to take a breath or chemical
    test?
  choices:
    A: Your license will be administratively suspended for 90 days.
    B: You will be immediately sentenced to 48 hours in jail.
    C: Your license will be revoked for one year.
    D: You will receive a warning and a $250 fine.
  answer: A
  explanation: If you refuse the breath or chemical test, your license will be administratively
    suspended for ninety days.
- id: 182
  category: alcohol_drugs_health
  question: If you refuse to take a breath or chemical test, the officer will take
    your license and give you an official receipt that serves as a temporary permit
    to drive. How long is this permit valid?
  choices:
    A: 15 days
    B: 30 days
    C: 45 days
    D: 90 days
  answer: C
  explanation: If you refuse the test, the officer will give you an official receipt
    for your license, which will serve as your temporary permit to drive, valid for
    only forty-five days.
- id: 183
  category: alcohol_drugs_health
  question: For a driver who is 21 years old or older, what is the minimum Blood Alcohol
    Content (BAC) level that is considered "Under the Influence"?
  choices:
    A: .02%
    B: .04%
    C: .08%
    D: .10%
  answer: C
  explanation: You are considered under the influence of intoxicating alcohol if you
    are 21 years old or older and your BAC registers .08% or more.
- id: 184
  category: penalties_and_points
  question: What is the license suspension period for a First Offense DUI for a driver
    21 years of age or older?
  choices:
    A: 30 days
    B: 90 days
    C: 120 days
    D: 1 year
  answer: C
  explanation: A DUI First Offense (Misdemeanor) for drivers 21 and older carries
    a license suspension of 120 days.
- id: 185
  category: penalties_and_points
  question: If a driver is under 21 years of age and has a Blood Alcohol Content (BAC)
    of .08% or higher, how is the offense classified?
  choices:
    A: As a Zero Tolerance DUI
    B: As a regular DUI
    C: As a minor traffic violation
    D: As a felony regardless of prior offenses
  answer: B
  explanation: If a driver is under twenty-one and has a Blood Alcohol Content of
    .08% or higher, the offense is classified as a regular DUI—not as a Zero Tolerance
    DUI.
- id: 186
  category: penalties_and_points
  question: What is the license suspension penalty for a Third Offense Zero Tolerance
    DUI within five years?
  choices:
    A: 120 days
    B: 1 year
    C: 2 years or until the person reaches the age of 21, whichever is longer
    D: 5 years
  answer: C
  explanation: A Zero Tolerance DUI Third Offense within five years results in a license
    suspension of 2 years or until the person reaches the age of 21, whichever is
    longer.
- id: 187
  category: penalties_and_points
  question: The Commissioner of Public Safety is authorized to suspend your license
    without a preliminary hearing for which of the following reasons?
  choices:
    A: You received a single parking ticket.
    B: You failed to pay child support.
    C: You were involved in a minor fender-bender with no injuries.
    D: You failed to renew your vehicle registration on time.
  answer: B
  explanation: The Commissioner of Public Safety is authorized to suspend your license
    without a preliminary hearing if public records indicate that you have failed
    to pay child support.
- id: 188
  category: penalties_and_points
  question: For which of the following convictions must the Commissioner of Public
    Safety revoke your license for a period of one year?
  choices:
    A: One conviction of speeding over 15 mph above the limit
    B: Failure to pay a traffic citation
    C: Three reckless driving convictions within a twelve-month period
    D: Driving without proof of insurance in your vehicle
  answer: C
  explanation: The Commissioner of Public Safety must take away your license for a
    period of one year if you are convicted of three reckless driving convictions
    within a twelve-month period.
- id: 189
  category: penalties_and_points
  question: Your driving privileges will be suspended for one year if you are convicted
    of how many reckless driving offenses within a twelve-month period?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: B
  explanation: Your license will be suspended for a period of one year if you are
    convicted of three reckless driving convictions within a twelve-month period.
- id: 190
  category: penalties_and_points
  question: Which of the following is the ONLY acceptable payment method for reinstating
    your driving privileges?
  choices:
    A: Personal check
    B: Cash
    C: Money order
    D: Cashier's check
  answer: D
  explanation: 'You must pay by CASHIER''S check. The manual explicitly states: DO
    NOT SEND CASH, MONEY ORDER OR A PERSONAL CHECK.'
- id: 191
  category: penalties_and_points
  question: What is the reinstatement fee for a suspension due to a conviction under
    the Mississippi Implied Consent Law or DUI?
  choices:
    A: $25
    B: $100
    C: $150
    D: $175
  answer: D
  explanation: The fee for reinstatement after a conviction under the Mississippi
    Implied Consent Law / DUI or Uniform Controlled Substances Act is $175.
- id: 192
  category: penalties_and_points
  question: What is the reinstatement fee if your license was suspended for failure
    to pay Child Support?
  choices:
    A: $25
    B: $50
    C: $100
    D: $175
  answer: A
  explanation: The fee for reinstatement due to a failure to pay Child Support is
    $25.
- id: 193
  category: driver_responsibility
  question: If solid waste is thrown or discarded from a motor vehicle, who is deemed
    to be in violation of the littering law?
  choices:
    A: Only the operator of the vehicle
    B: Only the owner of the vehicle
    C: Only the passenger who threw the waste
    D: The operator or owner of the motor vehicle, or both
  answer: D
  explanation: When solid waste is thrown or discarded from a motor vehicle, the operator
    or owner of the motor vehicle, or both, shall be deemed in violation.
- id: 194
  category: vehicle_information
  question: How far away must the lights and reflectors on the rear of your truck-trailer
    be visible?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: All lights and reflectors must be clean and in working order and be
    visible five hundred feet from the rear of your truck-trailer.
- id: 195
  category: vehicle_information
  question: What color must the reflectors on the front and sides near the front of
    your truck-trailer be?
  choices:
    A: Red
    B: Amber
    C: White
    D: Yellow
  answer: B
  explanation: All reflectors on the front and sides near the front must show an amber
    color.
- id: 196
  category: vehicle_information
  question: If a vehicle is designed or loaded so that the driver's rear view is obstructed,
    the side mirror must allow the driver to see at least how far to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Any vehicle which is designed or loaded so that the driver's rear view
    is obstructed must have a side mirror located so that the driver can see at least
    two hundred feet to the rear.
- id: 197
  category: safe_driving_rules
  question: If your bus or truck becomes disabled at night, where must you place the
    three required warning devices?
  choices:
    A: 50 feet ahead, 50 feet to the rear, and at the roadway side of the vehicle
    B: 100 feet ahead, 100 feet to the rear, and at the roadway side of the vehicle
    C: 200 feet ahead, 200 feet to the rear, and at the roadway side of the vehicle
    D: 500 feet ahead, 500 feet to the rear, and at the roadway side of the vehicle
  answer: B
  explanation: If your vehicle becomes disabled, place one warning device approximately
    one hundred feet ahead of your location, a second one hundred feet to the rear,
    and a third at the roadway side of the vehicle.
- id: 198
  category: vehicle_information
  question: What is the maximum allowed outside width of any vehicle, including its
    load (excluding farm tractors)?
  choices:
    A: 8 feet
    B: 8 and one-half feet
    C: 9 feet
    D: 10 feet
  answer: B
  explanation: The total outside width of any vehicle, including the load being carried
    on that vehicle, cannot exceed eight and one-half feet.
- id: 199
  category: vehicle_information
  question: Under normal conditions, what is the maximum permitted height of any vehicle,
    loaded or unloaded?
  choices:
    A: 12 and one-half feet
    B: 13 feet
    C: 13 and one-half feet
    D: 14 feet
  answer: C
  explanation: Under no conditions may any vehicle, loaded or unloaded, exceed a total
    height of thirteen and one-half feet.
- id: 200
  category: vehicle_information
  question: What is the maximum overall length allowed for a single vehicle, loaded
    or unloaded, including front and rear bumpers?
  choices:
    A: 30 feet
    B: 40 feet
    C: 53 feet
    D: 60 feet
  answer: B
  explanation: No single vehicle, loaded or unloaded, may have an overall length in
    excess of forty feet, including both front and rear bumpers.
- id: 201
  category: vehicle_information
  question: The load on the front of any vehicle must not extend more than how far
    beyond the front wheels or front bumper?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: The load on any vehicle operated alone or with the load on the front
    unit of any combination of vehicles must not extend more than three feet beyond
    the front wheels of the vehicle or the front bumper.
- id: 202
  category: safe_driving_rules
  question: Farm machinery is exempt from size, weight, and height limitations when
    operated during daylight hours on state highways within what distance from the
    point of origin?
  choices:
    A: 25 miles
    B: 50 miles
    C: 75 miles
    D: 100 miles
  answer: B
  explanation: Farm machinery is exempt from size, weight, and height limitations
    when operated during daylight hours on any state highway within fifty miles of
    the point of origin.
- id: 203
  category: safe_driving_rules
  question: Which of the following is a permitted exception to the rule against allowing
    a load to spill or escape onto the roadway?
  choices:
    A: Dropping gravel to fill potholes
    B: Dropping dirt from a construction site
    C: Dropping sand onto the roadway to secure traction
    D: Leaking oil from an older vehicle
  answer: C
  explanation: 'You may not put any vehicle on the road unless it is built or loaded
    so that none of the load can spill, shift, leak, or escape. EXCEPTIONS: Dropping
    sand onto the roadway to secure traction is permitted.'
- id: 204
  category: vehicle_information
  question: What must you do if your truck's load reaches within six inches or fewer
    of the top of the bed?
  choices:
    A: Drive at a maximum speed of 45 mph
    B: Use a tarpaulin or cover and four six-inch sideboards
    C: Remove enough of the load to lower it by one foot
    D: Only drive during daylight hours
  answer: B
  explanation: According to the manual, if your load reaches within six inches or
    fewer of the top of the bed, you must use a tarpaulin, canvas, or other cover
    to contain the load, AND use four, six-inch sideboards.
- id: 205
  category: safe_driving_rules
  question: When driving a truck on a roadway outside business or residential districts,
    what is the minimum following distance behind another truck?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: If you are driving a truck or truck-trailer outside business or residential
    districts, you must not follow within three hundred feet of other trucks except
    when attempting to pass.
- id: 206
  category: safe_driving_rules
  question: If your vehicle is carrying explosives or flammable liquids, what must
    you do at railroad crossings?
  choices:
    A: Stop only if a train is visible
    B: Stop at all railroad crossings even if no signals warn of a train
    C: Slow down to 15 mph and proceed with caution
    D: Sound your horn and proceed without stopping
  answer: B
  explanation: If your vehicle is carrying explosives or flammable liquids, you must
    stop at all railroad crossings—even if no signals warn that a train is approaching.
- id: 207
  category: safe_driving_rules
  question: What should you never do when preparing to back up a truck or large vehicle?
  choices:
    A: Get out and check clearance limits
    B: Have someone guide you
    C: Back into an intersection to turn around
    D: Make sure you have plenty of room to maneuver
  answer: C
  explanation: When backing up a truck or large vehicle, the manual explicitly states
    to never back into an intersection to turn around.
- id: 208
  category: safe_driving_rules
  question: Why is it illegal to disengage the clutch while driving a truck on a downgrade?
  choices:
    A: It causes excessive wear on the transmission
    B: It is considered 'coasting' and is very risky
    C: It uses more fuel than driving in gear
    D: It prevents the use of the vehicle's horn
  answer: B
  explanation: Never disengage the clutch while driving your truck on a downgrade.
    This 'coasting' is illegal and very risky.
- id: 209
  category: license_system
  question: You must have a Commercial Driver's License (CDL) to operate a vehicle
    designed to transport more than how many persons?
  choices:
    A: 8 persons
    B: 10 persons
    C: 12 persons
    D: 15 persons
  answer: D
  explanation: You must have a CDL to operate a vehicle designed to transport more
    than fifteen persons (including the driver).
- id: 210
  category: license_system
  question: 'A CDL is required to operate a single vehicle with a Gross Vehicle Weight
    Rating (GVWR) of more than:'
  choices:
    A: 10,000 pounds
    B: 15,000 pounds
    C: 20,000 pounds
    D: 26,000 pounds
  answer: D
  explanation: To get a CDL, you must pass both knowledge and skills tests. You must
    have a CDL to operate a single vehicle with a GVWR of more than 26,000 pounds.
- id: 211
  category: driver_responsibility
  question: According to the manual, one organ donor can save up to how many lives?
  choices:
    A: 4 lives
    B: 8 lives
    C: 12 lives
    D: 16 lives
  answer: B
  explanation: One organ donor can save up to eight lives, and the donation of tissues
    can enhance the lives of 75 or more individuals.
- id: 212
  category: driver_responsibility
  question: Who must give consent for organ donation if the deceased is under the
    age of 18?
  choices:
    A: The attending physician
    B: The Department of Public Safety
    C: Legal next of kin
    D: The hospital administrator
  answer: C
  explanation: Consent from legal next of kin is required at the time of donation
    for anyone still under the age of 18.
- id: 213
  category: driver_responsibility
  question: Who is responsible for the hospital expenses up until the time of death
    when consent is given for organ donation?
  choices:
    A: The organ recipient
    B: The donor's family
    C: The state government
    D: The hospital
  answer: B
  explanation: Your family is not responsible for any donation costs. However, you
    are responsible for hospital expenses up until the time of death, even when consent
    is given for donation.
- id: 214
  category: safe_driving_rules
  question: What types of vehicles are excluded from the Natchez Trace Parkway?
  choices:
    A: Motorcycles
    B: Recreational vehicles (RVs)
    C: Commercial vehicles
    D: Passenger buses
  answer: C
  explanation: Commercial vehicles are excluded from the Parkway, and access is limited
    to protect the motorist driving along the Trace.
- id: 215
  category: safe_driving_rules
  question: What is the maximum speed limit for travel on the Natchez Trace Parkway,
    except where lower speeds are posted?
  choices:
    A: 45 MPH
    B: 50 MPH
    C: 55 MPH
    D: 65 MPH
  answer: B
  explanation: The maximum speed for travel on the Parkway is fifty MPH, except where
    lower speeds are posted.
- id: 216
  category: penalties_and_points
  question: If you violate any laws while on the Natchez Trace Parkway, where will
    you be tried?
  choices:
    A: A state court
    B: A county court
    C: A federal court
    D: A municipal court
  answer: C
  explanation: Remember that if you violate any laws while on the roadway or while
    using any of the Parkway's facilities, you will be tried in a federal court.
- id: 217
  category: sharing_the_road
  question: What is the primary goal of the 'Share the Road' highway safety program?
  choices:
    A: To recruit new commercial truck drivers
    B: To reach people and change driving behavior to save lives
    C: To promote the sale of Mack Trucks
    D: To reduce the number of commercial vehicles on the road
  answer: B
  explanation: The program's goal is to reach as many people as possible and change
    driving behavior so that we can save lives.
- id: 218
  category: safe_driving_rules
  question: When driving a truck carrying gasoline, oil, or explosives, what should
    you do when putting gasoline in the tank or unloading the truck?
  choices:
    A: Keep the engine running to maintain pressure
    B: Turn off the ignition
    C: Turn on your hazard lights and sound the horn
    D: Ensure the rear doors are unlocked
  answer: B
  explanation: If you drive a truck carrying gasoline, oil, or explosives, be careful
    to avoid fires and explosions. Turn off the ignition when you put gasoline in
    the tank or unload the truck.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 219
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 220
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 221
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 222
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 223
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 224
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 225
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 226
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A black and white NO PASSING ZONE pennant-shaped sign means you are
    not allowed to pass other vehicles in this area. It marks the beginning of a no-passing
    zone.
  id: 227
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 228
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 229
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 230
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 231
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
