questions:
- id: 1
  category: safe_driving_rules
  question: ¿Según el manual, cuál es la ley con respecto a los cinturones de seguridad
    en un vehículo motorizado?
  choices:
    A: Solo el conductor debe usar el cinturón de seguridad.
    B: Usted y sus pasajeros deben abrocharse el cinturón cada vez que viajen.
    C: Los cinturones de seguridad son opcionales para los pasajeros en el asiento
      trasero.
    D: Los cinturones de seguridad solo son obligatorios cuando se viaja por carreteras
      interestatales.
  answer: B
  explanation: 'El manual establece: ''Asegúrese de que usted y sus pasajeros se abrochen
    los cinturones de seguridad cada vez que viajen en un vehículo motorizado... Abróchese
    el cinturón; es la ley''.'
- id: 2
  category: defensive_driving
  question: ¿Qué identifica el manual como una de las principales causas de accidentes?
  choices:
    A: Exceso de velocidad
    B: Conducir de noche
    C: Conducción distraída
    D: Malas condiciones climáticas
  answer: C
  explanation: El mensaje del Gobernador en el manual establece explícitamente que
    'La conducción distraída es una de las principales causas de accidentes'.
- id: 3
  category: sharing_the_road
  question: El manual aconseja a los conductores tener especial cuidado en las zonas
    escolares y al compartir la carretera ¿con quién?
  choices:
    A: Ciclistas
    B: Grandes camiones comerciales
    C: Motociclistas
    D: Peatones
  answer: A
  explanation: El manual aconseja a los conductores 'tener especial cuidado en las
    zonas escolares y al compartir la carretera con ciclistas'.
- id: 4
  category: driver_responsibility
  question: 'Según el Comisionado de Seguridad Pública, operar un vehículo motorizado
    en las carreteras de Mississippi se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio
    C: Un requisito para todos los ciudadanos
    D: Una libertad sin restricciones
  answer: B
  explanation: 'El mensaje del Comisionado establece: ''Sin embargo, conducir es un
    privilegio y debe tomarse muy en serio''.'
- id: 5
  category: penalties_and_points
  question: ¿Cuál es la consecuencia para una persona declarada culpable de tirar
    basura en los caminos, carreteras o interestatales de Mississippi?
  choices:
    A: Recibirá una advertencia por escrito.
    B: Su licencia será suspendida por 30 días.
    C: Será multada.
    D: Se le requerirá volver a tomar el examen de conducir.
  answer: C
  explanation: 'El manual establece: ''Cualquier persona declarada culpable de tirar
    basura en los caminos, carreteras, interestatales de Mississippi o dentro de sus
    derechos de paso será multada''.'
- id: 6
  category: driver_responsibility
  question: ¿Cómo sugiere el manual que los conductores pueden prevenir fácilmente
    el tirar basura?
  choices:
    A: Tirando solo artículos biodegradables por la ventana.
    B: Manteniendo una bolsa de basura en el vehículo.
    C: Evitando comer o beber en el vehículo.
    D: Tirando la basura en las cajas de las camionetas que pasan.
  answer: B
  explanation: 'El manual señala que la infracción de tirar basura se previene fácilmente
    aconsejando a los conductores: ''Mantenga una bolsa de basura en su vehículo y
    deseche su basura de manera responsable''.'
- id: 7
  category: license_system
  question: ¿Cuál de las siguientes formas de pago NO se acepta en las oficinas de
    licencias de conducir?
  choices:
    A: Efectivo
    B: Cheques
    C: Tarjetas de crédito Visa
    D: Tarjetas de débito MasterCard
  answer: B
  explanation: 'La sección de pago de tarifas establece explícitamente: ''Todas las
    oficinas aceptan efectivo, tarjetas de crédito y tarjetas de débito... NO SE ACEPTAN
    CHEQUES''.'
- id: 8
  category: license_system
  question: ¿Cuál es la tarifa para un Permiso de Aprendiz (Learner’s Permit) en Mississippi?
  choices:
    A: $5.00
    B: $7.00
    C: $11.00
    D: $24.00
  answer: B
  explanation: Según la tabla de tarifas del manual, el costo de un Permiso de Aprendiz
    es de $7.00.
- id: 9
  category: license_system
  question: ¿Cuánto cuesta una Licencia Regular (Clase R) de 4 años?
  choices:
    A: $17.00
    B: $24.00
    C: $29.00
    D: $47.00
  answer: B
  explanation: La tabla de tarifas enumera el precio de una Licencia Regular, Clase
    R por 4 años en $24.00.
- id: 10
  category: license_system
  question: ¿Cuál es la tarifa para una Licencia Regular (Clase R) de 8 años?
  choices:
    A: $24.00
    B: $33.00
    C: $47.00
    D: $57.00
  answer: C
  explanation: La tabla de tarifas enumera el precio de una Licencia Regular, Clase
    R por 8 años en $47.00.
- id: 11
  category: license_system
  question: Si necesita un duplicado de la licencia de conducir, ¿cuál es la tarifa
    requerida?
  choices:
    A: $1.00
    B: $5.00
    C: $7.00
    D: $11.00
  answer: D
  explanation: Bajo la sección 'OTRAS TARIFAS' (OTHER FEES), el manual indica que
    la tarifa por un duplicado de licencia es de $11.00.
- id: 12
  category: license_system
  question: ¿Cuál es el recargo por mora para la renovación de una licencia de conducir?
  choices:
    A: $1.00
    B: $5.00
    C: $10.00
    D: $11.00
  answer: A
  explanation: Bajo la sección 'OTRAS TARIFAS' (OTHER FEES), el manual indica que
    el recargo por mora es de $1.00.
- id: 13
  category: license_system
  question: ¿Cuánto cuesta un endoso de motocicleta por 4 años?
  choices:
    A: $5.00
    B: $7.00
    C: $10.00
    D: $17.00
  answer: A
  explanation: La tabla de tarifas indica que el costo de un endoso de motocicleta
    por 4 años es de $5.00.
- id: 14
  category: license_system
  question: ¿Cuál es el costo de una tarjeta de identificación por 8 años?
  choices:
    A: $17.00
    B: $24.00
    C: $33.00
    D: $47.00
  answer: C
  explanation: La tabla de tarifas indica que el costo de una tarjeta de identificación
    por 8 años es de $33.00.
- id: 15
  category: license_system
  question: ¿Cuál es la tarifa para una licencia comercial Clase D por 4 años?
  choices:
    A: $24.00
    B: $29.00
    C: $47.00
    D: $57.00
  answer: B
  explanation: La tabla de tarifas indica que el costo de una licencia comercial Clase
    D por 4 años es de $29.00.
- id: 16
  category: license_system
  question: ¿Cuál de las siguientes personas está exenta de tener una licencia de
    conducir de Mississippi?
  choices:
    A: Un joven de 15 años que conduce un auto familiar en una calle pública.
    B: Una persona que opera un tractor agrícola en una carretera.
    C: Un nuevo residente que se mudó a Mississippi hace 90 días.
    D: Un estudiante universitario cuya licencia de otro estado ha sido suspendida.
  answer: B
  explanation: Usted está exento de tener una licencia de conducir de Mississippi
    si está operando cualquier máquina de carretera, tractor agrícola o equipo agrícola
    en calles o carreteras.
- id: 17
  category: license_system
  question: 'Según la ley de Mississippi, no se le puede emitir una licencia de conducir
    si es menor de dieciocho años y no proporciona la documentación adecuada de:'
  choices:
    A: Su situación laboral.
    B: Su inscripción en la escuela.
    C: Su historial médico.
    D: El registro de su vehículo.
  answer: B
  explanation: La ley impide que se le emita una licencia en Mississippi si es menor
    de dieciocho años y no proporciona la documentación adecuada de su inscripción
    en la escuela.
- id: 18
  category: driver_testing
  question: Antes de que se le emita una licencia, ¿un solicitante debe proporcionar
    una declaración jurada que certifique que ha operado un vehículo motorizado durante
    al menos cuántas horas?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Debe proporcionar una declaración jurada en la que un padre, maestro
    o tutor certifique que lo ha visto operar un vehículo motorizado durante al menos
    cincuenta horas.
- id: 19
  category: license_system
  question: Si se muda a Mississippi, ¿cuántos días tiene para obtener una licencia
    de conducir de Mississippi?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Si se muda a Mississippi, debe obtener una licencia de conducir de
    Mississippi en un plazo de sesenta días.
- id: 20
  category: vehicle_information
  question: Los nuevos residentes de Mississippi deben obtener una placa o etiqueta
    de licencia de Mississippi dentro de ¿cuántos días después de mudarse?
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si se muda a Mississippi, debe obtener una placa o etiqueta de licencia
    de Mississippi en un plazo de treinta días.
- id: 21
  category: driver_testing
  question: Si tiene una licencia de conducir válida de otro estado, ¿qué examen se
    omitirá cuando solicite una licencia de Mississippi?
  choices:
    A: El examen de la vista
    B: El examen de habilidades viales
    C: El examen computarizado
    D: El examen físico
  answer: C
  explanation: Si tiene una licencia de conducir válida de otro estado, se omitirá
    el examen computarizado. Aún debe aprobar un examen de la vista.
- id: 22
  category: driver_testing
  question: 'Debe realizar el examen computarizado si su licencia de conducir de otro
    estado ha estado vencida por más de:'
  choices:
    A: 15 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: Si su licencia de otro estado ha estado vencida por más de treinta
    días, debe realizar el examen computarizado.
- id: 23
  category: license_system
  question: ¿Qué debe hacer si solicita una licencia de Mississippi pero ha perdido
    su licencia de otro estado?
  choices:
    A: Volver a tomar el examen de habilidades viales.
    B: Esperar 30 días antes de solicitarla.
    C: Obtener un formulario de Declaración Jurada de Incapacidad de Entrega (Affidavit
      of Inability to Surrender) ante notario.
    D: Entregar el registro de su vehículo en su lugar.
  answer: C
  explanation: Si ha perdido su licencia de otro estado, debe obtener un formulario
    de Declaración Jurada de Incapacidad de Entrega (Affidavit of Inability to Surrender)
    en la oficina de licencias de conducir. Su firma debe estar notarizada en este
    formulario.
- id: 24
  category: license_system
  question: Si su licencia válida de Mississippi vence mientras se encuentra fuera
    del estado debido al servicio militar, ¿dentro de cuántos días después de ser
    dado de baja o de regresar al estado puede renovarla sin pagar un cargo por mora?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Si se encuentra fuera del estado debido al servicio militar en el momento
    en que vence su licencia válida, puede renovarla en cualquier momento dentro de
    los noventa días posteriores a su baja del servicio militar o al regresar al estado.
- id: 25
  category: license_system
  question: ¿Con cuánta anticipación puede un conductor con licencia calificado renovar
    su licencia de conducir de Mississippi antes de su fecha de vencimiento?
  choices:
    A: Hasta un mes
    B: Hasta tres meses
    C: Hasta seis meses
    D: Hasta un año
  answer: C
  explanation: Para cualquier conductor con licencia que califique para una RENOVACIÓN
    DE LICENCIA, la licencia puede renovarse HASTA SEIS MESES antes de la fecha de
    vencimiento.
- id: 26
  category: license_system
  question: ¿Se requiere que los estudiantes universitarios de otros estados obtengan
    una licencia de conducir de Mississippi para conducir en el estado?
  choices:
    A: Sí, dentro de los 30 días posteriores al inicio de las clases.
    B: Sí, dentro de los 60 días posteriores a mudarse a un dormitorio.
    C: No, se les permite conducir en Mississippi con su licencia de otro estado.
    D: No, pero deben obtener placas de Mississippi.
  answer: C
  explanation: A los estudiantes universitarios de otros estados se les permite conducir
    en Mississippi con su licencia de otro estado. La misma política se aplica a las
    placas de los automóviles.
- id: 27
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es obligatorio que presente un no
    ciudadano al solicitar una licencia de conducir de Mississippi?
  choices:
    A: Una tarjeta de seguro social
    B: Dos comprobantes de residencia
    C: Un acta de nacimiento traducida
    D: Documentos de inmigración válidos o una Tarjeta de Residente Permanente
  answer: A
  explanation: Si no es ciudadano, debe cumplir con todos los requisitos para obtener
    una licencia de conducir o una tarjeta de identificación, excepto proporcionar
    una tarjeta de seguro social.
- id: 28
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir regular para un
    no ciudadano?
  choices:
    A: Exactamente un año
    B: Cuatro años o hasta la fecha de vencimiento de su estatus legal, lo que sea
      más corto
    C: Echo años
    D: Hasta que se convierta en ciudadano de los EE. UU.
  answer: B
  explanation: Para los no ciudadanos, su licencia regular o tarjeta de identificación
    será válida por cuatro años o hasta la fecha de vencimiento de su estatus legal
    [si faltan menos de cuatro años].
- id: 29
  category: driver_testing
  question: A partir del 1 de julio de 2027, ¿qué nuevo requisito impedirá que se
    le otorgue una licencia de conducir de Mississippi a un solicitante si no se completa?
  choices:
    A: Un curso certificado de conducción defensiva
    B: Un curso certificado de Educación Vial (Driver's Education)
    C: Un registro de 100 horas de conducción supervisada
    D: Un seminario avanzado de seguridad vial
  answer: B
  explanation: La ley impide que se le otorgue una licencia en Mississippi si... No
    ha completado un curso certificado de Educación Vial (Driver's Education) (a partir
    del 1 de julio de 2027).
- id: 30
  category: driver_responsibility
  question: ¿Es legal conducir sin una licencia de conducir o un permiso de aprendizaje
    (Learner's Permit) válidos si está acompañado por un padre con licencia?
  choices:
    A: Sí, siempre que el padre esté en el asiento del pasajero delantero.
    B: Sí, si tiene al menos 15 años.
    C: No, conducir sin una licencia o permiso válido es ilegal incluso si está acompañado
      por un padre.
    D: No, a menos que conduzca hacia o desde la escuela.
  answer: C
  explanation: Conducir sin una licencia de conducir o un permiso de aprendizaje (Learner's
    Permit) válidos es ilegal, incluso si está acompañado por un padre o un conductor
    con licencia.
- id: 31
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso de Aprendizaje Regular en Mississippi?
  choices:
    A: Un año
    B: Dos años
    C: Cuatro años
    D: Seis meses
  answer: B
  explanation: El manual establece que el Permiso de Aprendizaje Regular es válido
    por dos años.
- id: 32
  category: safe_driving_rules
  question: Al conducir con un Permiso de Aprendizaje Regular, ¿quién debe acompañarlo
    en el asiento de al lado?
  choices:
    A: Cualquier conductor con licencia de 18 años o más
    B: Un conductor con licencia de 21 años o más
    C: Solo un padre o tutor legal
    D: Cualquier adulto de 21 años o más, independientemente del estado de su licencia
  answer: B
  explanation: Un Permiso de Aprendizaje Regular le autoriza a conducir un vehículo
    motorizado cuando esté acompañado por un conductor con licencia de veintiún años
    o más que esté ocupando físicamente el asiento junto a usted.
- id: 33
  category: license_system
  question: ¿Qué tipo de licencia se requiere para operar un vehículo comercial que
    tiene una clasificación de peso bruto vehicular inferior a 26,000 libras?
  choices:
    A: Clase A
    B: Clase C
    C: Clase D
    D: Clase R
  answer: C
  explanation: Se requiere una licencia Clase D cuando opera un vehículo comercialmente
    y el vehículo tiene una clasificación de peso bruto vehicular inferior a 26,000
    libras.
- id: 34
  category: license_system
  question: ¿Cuál es el requisito de edad mínima para ser elegible para una licencia
    para conducir un autobús escolar en Mississippi?
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Debe tener al menos veintiún años antes de ser elegible para una licencia
    para conducir un autobús escolar, según el Departamento de Educación de Mississippi.
- id: 35
  category: safe_driving_rules
  question: ¿Qué equipo de seguridad se requiere legalmente al operar o viajar en
    una motocicleta en las vías públicas de Mississippi?
  choices:
    A: Guantes de cuero
    B: Un casco de protección
    C: Ropa reflectante
    D: Botas con punta de acero
  answer: B
  explanation: Se debe usar un casco de protección si se opera o se viaja en cualquier
    motocicleta o motoneta en las vías públicas o autopistas de este estado.
- id: 36
  category: license_system
  question: Si recibe su Permiso de Aprendizaje a los quince años y medio, ¿a qué
    edad será elegible para su Licencia de Conducir Regular?
  choices:
    A: Quince años y medio
    B: Dieciséis años
    C: Dieciséis años y medio
    D: Diecisiete años
  answer: C
  explanation: Si se le emite un Permiso de Aprendizaje a los quince años y medio,
    debe esperar un año, lo que lo hace elegible para su Licencia de Conducir Regular
    a los dieciséis años y medio.
- id: 37
  category: license_system
  question: ¿Qué tipo de licencia puede solicitar directamente si comienza el proceso
    de solicitud a los diecisiete años o más?
  choices:
    A: Solo un Permiso de Aprendizaje Regular
    B: Una Licencia de Conducir Regular
    C: Una Licencia Comercial Clase D
    D: Una Licencia de Dificultad Restringida
  answer: B
  explanation: Si solicita por primera vez a los diecisiete años o más, puede solicitar
    directamente una Licencia de Conducir Regular.
- id: 38
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al comprobante
    de residencia requerido para una solicitud de licencia original?
  choices:
    A: Los números de apartado postal son aceptables
    B: Solo se requiere un documento
    C: Cada comprobante debe contener una dirección física
    D: El comprobante de residencia solo se requiere para solicitantes menores de
      18 años
  answer: C
  explanation: El manual establece que cada comprobante de residencia debe contener
    una dirección física y que no se aceptarán números de apartados postales.
- id: 39
  category: penalties_and_points
  question: ¿Cuál es una consecuencia potencial de hacer una declaración falsa en
    su solicitud de licencia de conducir?
  choices:
    A: Se le requerirá volver a tomar el examen de la vista
    B: Sus privilegios de conducir pueden ser suspendidos
    C: Se le emitirá una licencia restringida
    D: Su tarifa de solicitud se duplicará
  answer: B
  explanation: Si hace una declaración falsa en la solicitud, sus privilegios de conducir
    pueden ser suspendidos.
- id: 40
  category: driver_responsibility
  question: Si es menor de diecisiete años, ¿qué se requiere con respecto a las firmas
    de sus padres o tutores en su solicitud?
  choices:
    A: Solo se necesita la firma de uno de los padres
    B: Las firmas deben estar notarizadas
    C: Las firmas deben ser presenciadas por un oficial de policía
    D: No se requieren firmas si ha completado la Educación Vial (Driver's Education)
  answer: B
  explanation: Quien firme su solicitud será responsable de su negligencia o mala
    conducta deliberada y debe tener su firma NOTARIZADA.
- id: 41
  category: license_system
  question: ¿Qué dos pruebas de identificación se requieren antes de que se pueda
    emitir una licencia o permiso?
  choices:
    A: Un pasaporte y una factura de servicios públicos
    B: Una tarjeta de Seguro Social y un acta de nacimiento certificada
    C: Un diploma de escuela secundaria y un estado de cuenta bancario
    D: Una tarjeta de registro de votante y un formulario W-2
  answer: B
  explanation: 'Se requieren dos pruebas de identificación antes de que se pueda emitir
    una licencia o permiso: una tarjeta de Seguro Social y un acta de nacimiento certificada.'
- id: 42
  category: license_system
  question: Si es menor de dieciocho años, ¿qué antigüedad máxima debe tener su formulario
    de Certificación de Asistencia de su escuela?
  choices:
    A: No más de 14 días
    B: No más de 30 días
    C: No más de 60 días
    D: No más de 90 días
  answer: B
  explanation: Si es menor de dieciocho años, debe presentar un comprobante de su
    inscripción en la escuela. Este formulario de Certificación de Asistencia no debe
    tener más de treinta días de antigüedad.
- id: 43
  category: driver_testing
  question: Si es menor de 17 años, ¿cuántas horas de conducción debe certificar un
    padre, maestro o tutor que lo ha visto operar un vehículo motorizado para calificar
    para una licencia de conducir regular?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Si es menor de 17 años, debe presentar una declaración jurada para
    la exención del examen de manejo (Road Test Waiver) mediante la cual un padre,
    maestro o tutor haya certificado que lo ha visto operar un vehículo motorizado
    durante al menos cincuenta horas.
- id: 44
  category: license_system
  question: ¿A partir de qué fecha se requerirá que los solicitantes presenten documentación
    que demuestre la finalización de un programa certificado de educación y capacitación
    vial?
  choices:
    A: 1 de julio de 2024
    B: 1 de enero de 2025
    C: 1 de julio de 2027
    D: 31 de diciembre de 2028
  answer: C
  explanation: A partir del 1 de julio de 2027, debe presentar documentación firmada
    que demuestre la finalización de un programa de educación y capacitación vial
    certificado por la Junta Estatal de Educación o el Departamento de Seguridad Pública.
- id: 45
  category: vehicle_information
  question: Según la ley de Mississippi, ¿qué tan efectivo debe ser el freno de pie?
  choices:
    A: Debe detener el vehículo en un tramo de 55 pies a 20 mph.
    B: Debe detener el vehículo en un tramo de 30 pies a 20 mph.
    C: Debe detener el vehículo en un tramo de 100 pies a 30 mph.
    D: Debe detener el vehículo en un tramo de 50 pies a 20 mph.
  answer: B
  explanation: El manual establece que el freno de pie debe ser lo suficientemente
    fuerte como para detener el vehículo en un tramo de treinta pies a una velocidad
    de veinte millas por hora.
- id: 46
  category: vehicle_information
  question: ¿A qué distancia debe escucharse la bocina de su vehículo para cumplir
    con los estándares de equipamiento?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Su vehículo debe tener una bocina que se pueda escuchar a doscientos
    pies de distancia.
- id: 47
  category: vehicle_information
  question: ¿Cuál es el número máximo de luces auxiliares que puede tener su vehículo
    además de los faros delanteros?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: C
  explanation: Además de dos faros delanteros, su vehículo no puede tener más de un
    reflector (spotlight) y no más de tres luces auxiliares.
- id: 48
  category: vehicle_information
  question: ¿Exige la ley de Mississippi un espejo retrovisor para los vehículos de
    pasajeros estándar?
  choices:
    A: Sí, todos los vehículos deben tener un espejo retrovisor.
    B: No, se recomienda pero no lo exige la ley.
    C: Sí, pero solo si el vehículo no tiene espejos laterales.
    D: No, los espejos retrovisores son ilegales.
  answer: B
  explanation: La ley de Mississippi no le exige tener un espejo retrovisor, pero
    se recomienda que tenga uno.
- id: 49
  category: vehicle_information
  question: Según la Ley de Vehículos Inclinados (Squatted Vehicle Law), ¿es ilegal
    alterar la suspensión de un vehículo de modo que el guardabarros delantero se
    eleve cuánto más que el guardabarros trasero?
  choices:
    A: Dos pulgadas o más
    B: Tres pulgadas o más
    C: Cuatro pulgadas o más
    D: Seis pulgadas o más
  answer: C
  explanation: Será ilegal que cualquier persona conduzca un vehículo motorizado de
    pasajeros si la altura del guardabarros delantero se eleva cuatro pulgadas o más
    por encima de la altura del guardabarros trasero.
- id: 50
  category: vehicle_information
  question: Al usar la 'prueba del centavo' para verificar la banda de rodadura de
    los neumáticos, ¿qué indica que está conduciendo con una cantidad segura de banda
    de rodadura?
  choices:
    A: Puede ver la parte superior del Monumento a Lincoln.
    B: Cualquier parte de la cabeza de Abraham Lincoln está cubierta por la banda
      de rodadura.
    C: El centavo entero cabe en la ranura.
    D: La cabeza de Abraham Lincoln es completamente visible por encima de la banda
      de rodadura.
  answer: B
  explanation: Si alguna parte de la cabeza de Lincoln está cubierta por la banda
    de rodadura, está conduciendo con una cantidad segura de banda de rodadura. Si
    la banda de rodadura está por debajo de eso, la capacidad de su automóvil para
    agarrarse a la carretera se reduce considerablemente.
- id: 51
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante para mantener
    el control del vehículo?
  choices:
    A: Las 10 y las 2
    B: Las 8 y las 4
    C: Las 3 y las 9
    D: Las 12 y las 6
  answer: C
  explanation: Ambas manos deben colocarse en la parte exterior del volante en lados
    opuestos, en las posiciones de las 3 y las 9, para mantener el control del vehículo.
- id: 52
  category: safe_driving_rules
  question: ¿Por qué ya no se recomienda colocar las manos en las posiciones de las
    2 y las 10 en el volante?
  choices:
    A: Causa fatiga al conductor más rápidamente.
    B: Puede ser peligroso en un vehículo equipado con bolsas de aire (airbags).
    C: Bloquea la vista del conductor hacia el tablero.
    D: Hace que sea más difícil girar el volante.
  answer: B
  explanation: Colocar las manos en las posiciones de las 2 y las 10 ya no se recomienda
    porque puede ser peligroso en un vehículo equipado con bolsas de aire (airbags).
- id: 53
  category: defensive_driving
  question: ¿Con qué frecuencia debe planear detenerse y tomar un descanso durante
    viajes largos para evitar la fatiga?
  choices:
    A: Cada 50 millas o 1 hora
    B: Cada 100 millas o 2 horas
    C: Cada 150 millas o 3 horas
    D: Cada 200 millas o 4 horas
  answer: B
  explanation: Para evitar la fatiga, debe planear detenerse aproximadamente cada
    100 millas o 2 horas durante viajes largos.
- id: 54
  category: safe_driving_rules
  question: Según el manual, ¿cuál de los siguientes se considera parte de una intersección?
  choices:
    A: Entradas para autos (driveways)
    B: Aceras
    C: Cruces peatonales
    D: Acotamientos (shoulders)
  answer: C
  explanation: Una intersección es el lugar donde las carreteras se unen o se cruzan,
    y los cruces peatonales se consideran parte de la intersección.
- id: 55
  category: vehicle_information
  question: ¿Cuál de los siguientes NO se considera un 'vehículo de motor' según los
    términos comunes de Mississippi?
  choices:
    A: Una motocicleta
    B: Un automóvil
    C: Un camión comercial
    D: Una bicicleta eléctrica
  answer: D
  explanation: La definición de un vehículo de motor exceptúa explícitamente a los
    vehículos sobre rieles, bicicletas eléctricas, carritos de golf y vehículos de
    baja velocidad.
- id: 56
  category: vehicle_information
  question: ¿A qué distancia detrás de su vehículo debe ser visible su luz trasera
    roja?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: La luz trasera de su vehículo debe ser roja y debe ser visible a quinientos
    pies detrás de usted.
- id: 57
  category: driver_testing
  question: ¿Qué sucede si su examen de la vista indica que podría necesitar anteojos
    durante el examen de visión?
  choices:
    A: Se le denegará permanentemente la licencia de conducir.
    B: Debe hacerse examinar los ojos por un especialista de la vista u optometrista.
    C: Se le requerirá tomar un examen de manejo computarizado en su lugar.
    D: Debe esperar seis meses antes de volver a tomar el examen.
  answer: B
  explanation: Si su examen de la vista indica que puede necesitar anteojos, debe
    hacerse examinar los ojos por un especialista de la vista u optometrista y pedirle
    que complete un formulario de visión (DE26).
- id: 58
  category: defensive_driving
  question: Al conducir largas distancias, ¿por qué debe evitar seguir al mismo vehículo
    durante períodos prolongados?
  choices:
    A: Podría ser acusado de acoso.
    B: Puede relajarse demasiado y perder su concentración.
    C: Disminuye la eficiencia de combustible de su vehículo.
    D: El otro conductor podría frenar repentinamente para ponerlo a prueba.
  answer: B
  explanation: No siga al mismo vehículo o grupo de vehículos durante períodos prolongados.
    Puede relajarse demasiado y perder su concentración.
- id: 59
  category: vehicle_information
  question: ¿Qué tan efectivo debe ser el freno de estacionamiento de su vehículo?
  choices:
    A: Debe detener el vehículo a 30 pies a 20 mph.
    B: Debe detener el vehículo a 55 pies a 20 mph.
    C: Debe mantener el vehículo inmóvil en una pendiente de 15 grados.
    D: Debe detener el vehículo a 100 pies a 30 mph.
  answer: B
  explanation: El freno de estacionamiento debe ser lo suficientemente fuerte como
    para detener el vehículo a cincuenta y cinco pies a veinte millas por hora.
- id: 60
  category: safe_driving_rules
  question: Al conducir largas distancias, ¿con qué frecuencia recomienda el manual
    tomar un descanso?
  choices:
    A: Cada 50 millas
    B: Cada 100 millas
    C: Cada 150 millas
    D: Cada 200 millas
  answer: B
  explanation: Al conducir largas distancias, el manual aconseja a los conductores
    tomar un descanso cada cien millas.
- id: 61
  category: safe_driving_rules
  question: ¿Según el manual, cuál de las siguientes actividades con el teléfono celular
    está permitida mientras se conduce?
  choices:
    A: Leer un mensaje de texto
    B: Publicar en un sitio de redes sociales
    C: Usar un dispositivo operado por voz o manos libres
    D: Escribir un correo electrónico
  answer: C
  explanation: Escribir, enviar o leer mensajes de texto y publicar en sitios de redes
    sociales no está permitido. Sin embargo, si debe realizar una llamada telefónica,
    se recomienda el uso de un dispositivo de manos libres o activado por voz.
- id: 62
  category: defensive_driving
  question: ¿Por qué nunca debe usar auriculares estéreo mientras conduce?
  choices:
    A: Pueden causar un efecto de espejo en las ventanas.
    B: Es posible que no pueda escuchar las señales de advertencia, como silbatos
      y sirenas.
    C: Las autoridades los consideran una obstrucción visual.
    D: Agotan la batería del vehículo.
  answer: B
  explanation: Nunca debe usar auriculares estéreo mientras conduce porque es posible
    que no pueda escuchar las señales de advertencia, como silbatos y sirenas.
- id: 63
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla discontinua en el pavimento?
  choices:
    A: Separa los carriles de tráfico que se mueven en la misma dirección.
    B: Cruzar la línea está estrictamente prohibido en todo momento.
    C: Separa los carriles de tráfico que se mueven en direcciones opuestas, y se
      permite rebasar cuando sea seguro.
    D: Indica un cruce de peatones más adelante.
  answer: C
  explanation: Una línea amarilla discontinua separa los carriles de tráfico que se
    mueven en direcciones opuestas. Cruzar al carril contrario está permitido ÚNICAMENTE
    para rebasar y solo cuando sea seguro hacerlo.
- id: 64
  category: signs_and_signals
  question: ¿Cuál es la regla con respecto a una línea blanca continua doble en la
    calzada?
  choices:
    A: Se permite circular en la misma dirección, pero está prohibido cruzar la línea.
    B: Separa el tráfico que se mueve en direcciones opuestas.
    C: Se desaconseja cruzar, pero se permite al rebasar.
    D: Indica un carril central para girar.
  answer: A
  explanation: Una línea blanca continua doble significa que se permite circular en
    la misma dirección en ambos lados de la línea, pero está PROHIBIDO cruzar una
    línea blanca doble.
- id: 65
  category: safe_driving_rules
  question: ¿Cómo debe utilizarse un carril central pintado con 'TURN LANE ONLY' (Solo
    carril de giro)?
  choices:
    A: Para la circulación normal durante el tráfico pesado.
    B: Para rebasar vehículos que se mueven lentamente.
    C: Solo en preparación para girar a la izquierda o a la derecha a través de los
      carriles opuestos.
    D: Como un carril designado para vehículos de emergencia.
  answer: C
  explanation: Un vehículo puede usar un carril de 'TURN LANE ONLY' ÚNICAMENTE en
    preparación para girar a la izquierda o a la derecha a través de los carriles
    opuestos. El carril de giro NUNCA se utiliza para rebasar.
- id: 66
  category: sharing_the_road
  question: ¿Qué debe hacer un conductor al acercarse a un peatón en un cruce de peatones
    no marcado?
  choices:
    A: Ceder el paso al peatón solo si el cruce está pintado.
    B: Siempre ceder el paso al peatón.
    C: Tocar la bocina y proceder con precaución.
    D: Detener el vehículo directamente sobre el cruce de peatones para bloquear el
      tráfico.
  answer: B
  explanation: Los conductores siempre deben ceder el paso a los peatones en los cruces
    de peatones, incluso si el cruce no está marcado.
- id: 67
  category: signs_and_signals
  question: ¿Qué forma de señal estándar se utiliza exclusivamente para las señales
    de CEDA EL PASO (YIELD)?
  choices:
    A: Octágono
    B: Diamante (Rombo)
    C: Triángulo equilátero
    D: Banderín (Pennant)
  answer: C
  explanation: La forma de triángulo equilátero se utiliza exclusivamente para las
    señales de CEDA EL PASO (YIELD).
- id: 68
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de color naranja?
  choices:
    A: Guía de servicios para automovilistas
    B: Guía recreativa pública y escénica
    C: Advertencia general
    D: Advertencia de construcción o mantenimiento
  answer: D
  explanation: El color naranja en una señal de tráfico indica una advertencia de
    construcción o mantenimiento.
- id: 69
  category: signs_and_signals
  question: ¿Para qué se utiliza una señal de tráfico en forma de banderín (pennant)
    para advertir a los conductores?
  choices:
    A: Una zona escolar más adelante
    B: Un cruce de ferrocarril más adelante
    C: Una ZONA DE NO REBASAR (NO PASSING ZONE) más adelante
    D: Un peligro existente en la calzada
  answer: C
  explanation: Una señal en forma de banderín se utiliza como advertencia de una ZONA
    DE NO REBASAR (NO PASSING ZONE) más adelante.
- id: 70
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra con una señal de CONTRAMANO (WRONG WAY)?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Salir de la calzada y dar la vuelta lo antes posible.
    C: Moverse al carril derecho y continuar conduciendo.
    D: Detenerse y esperar a que un oficial de policía lo escolte.
  answer: B
  explanation: La señal de CONTRAMANO (WRONG WAY) le indica que está viajando en la
    dirección opuesta a los otros autos en su carril. Debe salir de la calzada y dar
    la vuelta lo antes posible.
- id: 71
  category: vehicle_information
  question: ¿Cuál de los siguientes se considera una obstrucción visual y no está
    permitido en las ventanas de su vehículo?
  choices:
    A: Un dispositivo móvil de manos libres
    B: Material de vidrio que cause un efecto de espejo
    C: Un transportador de mascotas en el asiento trasero
    D: Una perrera portátil
  answer: B
  explanation: Los vehículos no pueden tener letreros, carteles, calcomanías o material
    de vidrio que cause un efecto de espejo en las ventanas, ya que estos se consideran
    obstrucciones visuales.
- id: 72
  category: signs_and_signals
  question: ¿Qué tipo de advertencia proporciona una señal con forma de pentágono?
  choices:
    A: Señales de cruce escolar y advertencia de zonas escolares más adelante
    B: Advertencia de un cruce de ferrocarril más adelante
    C: Exclusivamente para advertir de un peligro en la calzada
    D: Exclusivamente para señales de PARE (STOP)
  answer: A
  explanation: La forma de pentágono se utiliza para las señales de cruce escolar
    y para advertir sobre zonas escolares más adelante.
- id: 73
  category: signs_and_signals
  question: ¿Qué significa una sola línea blanca continua que separa los carriles
    de tráfico?
  choices:
    A: Se permite circular en la misma dirección, pero se desaconseja cruzar la línea.
    B: Se permite circular en direcciones opuestas y se permite rebasar.
    C: Debe girar a la derecha en la próxima intersección.
    D: Cruzar la línea está estrictamente prohibido por ley.
  answer: A
  explanation: Una sola línea blanca continua significa que se permite circular en
    la misma dirección a ambos lados de la línea, pero se desaconseja cruzarla.
- id: 74
  category: vehicle_information
  question: ¿Con quién debe comunicarse para obtener una placa de matrícula para personas
    con discapacidad o un permiso colgante temporal para estacionamiento de discapacitados?
  choices:
    A: El Departamento de Seguridad Pública
    B: El departamento de policía local
    C: La Oficina del Recaudador de Impuestos de su Condado
    D: El Departamento de Transporte
  answer: C
  explanation: Para obtener información sobre cómo obtener una placa para personas
    con discapacidad, debe comunicarse con la Oficina del Recaudador de Impuestos
    de su Condado.
- id: 75
  category: safe_driving_rules
  question: ¿Cuál es el único uso permitido de un carril central marcado específicamente
    para giros?
  choices:
    A: Circulación normal
    B: Rebasar vehículos lentos
    C: Realizar giros
    D: Estacionar durante emergencias
  answer: C
  explanation: El manual establece que SOLO puede usar el carril central PARA REALIZAR
    GIROS. No está disponible para la circulación normal ni para rebasar.
- id: 76
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar al pasar por una escuela
    durante el recreo o mientras los niños llegan o se van?
  choices:
    A: 10 millas por hora
    B: 15 millas por hora
    C: 20 millas por hora
    D: 25 millas por hora
  answer: B
  explanation: El manual establece que el límite de velocidad en una zona escolar
    es de quince millas por hora al pasar por una escuela durante el recreo o mientras
    los niños llegan o salen de la escuela.
- id: 77
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en las intersecciones cuando un peatón
    está cruzando?
  choices:
    A: El vehículo que viaja en línea recta
    B: El vehículo que realiza un giro a la derecha
    C: El peatón, pero solo si el cruce peatonal está marcado
    D: El peatón, ya sea que el cruce peatonal esté marcado o no
  answer: D
  explanation: El manual establece que los peatones tienen el derecho de paso en las
    intersecciones, ya sea que el cruce peatonal esté marcado o no.
- id: 78
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla que debe seguir al conducir a través
    de una zona de obras?
  choices:
    A: Mantener su velocidad normal
    B: Seguir muy de cerca al vehículo de adelante para mantener el tráfico en movimiento
    C: Reducir su velocidad y estar preparado para detenerse repentinamente
    D: Ignorar a los abanderados si contradicen las señales publicadas
  answer: C
  explanation: 'El manual aconseja a los conductores reducir su velocidad en las zonas
    de obras, estar preparados para detenerse repentinamente y establece explícitamente:
    ''No siga de cerca a otros vehículos en las zonas de obras''.'
- id: 79
  category: signs_and_signals
  question: ¿Qué indica un triángulo naranja y rojo fluorescente o reflectante que
    se muestra en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo viaja a 25 mph o menos
    C: El vehículo está averiado
    D: El vehículo es de respuesta a emergencias
  answer: B
  explanation: Este emblema identifica a los vehículos de movimiento lento, que son
    vehículos que viajan a veinticinco millas por hora o menos.
- id: 80
  category: sharing_the_road
  question: Al compartir la carretera con jinetes o vehículos tirados por animales,
    ¿qué debe evitar hacer?
  choices:
    A: Rebasar con precaución
    B: Anticipar giros a la izquierda
    C: Usar la bocina o acelerar el motor
    D: Ceder el derecho de paso
  answer: C
  explanation: 'El manual establece: ''No use la bocina ni "acelere" el motor porque
    esto puede asustar al caballo y causar un choque''.'
- id: 81
  category: safe_driving_rules
  question: ¿Cuál es la distancia de parada requerida desde el riel exterior cuando
    se debe detener en un cruce de ferrocarril?
  choices:
    A: Dentro de 10 a 5 pies
    B: Dentro de 50 a 10 pies
    C: Dentro de 100 a 50 pies
    D: Dentro de 25 a 15 pies
  answer: B
  explanation: Todos los conductores deben detenerse siempre a una distancia de entre
    cincuenta y diez pies del riel exterior de cualquier cruce de ferrocarril cuando
    se les requiera detenerse.
- id: 82
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos DEBE detenerse en TODOS los cruces de
    ferrocarril, independientemente de la señalización o las luces intermitentes?
  choices:
    A: Un automóvil de pasajeros que remolca un remolque
    B: Un autobús escolar que transporta niños
    C: Una motocicleta
    D: Una furgoneta de reparto
  answer: B
  explanation: El manual establece que un autobús escolar que transporte incluso a
    un solo niño, un vehículo de alquiler que transporte pasajeros o un vehículo que
    transporte explosivos o líquidos inflamables DEBE DETENERSE en TODOS los cruces
    de ferrocarril.
- id: 83
  category: defensive_driving
  question: Si su vehículo se queda atascado en las vías del tren y las luces de advertencia
    comienzan a parpadear, ¿qué debe hacer después de salir del vehículo?
  choices:
    A: Correr directamente por las vías alejándose del tren
    B: Correr en un ángulo de 45 grados alejándose de las vías en la dirección de
      donde viene el tren
    C: Correr en un ángulo de 45 grados alejándose de las vías en la dirección hacia
      donde va el tren
    D: Pararse junto a su vehículo y agitar los brazos
  answer: B
  explanation: 'El manual indica: ''Una vez afuera, corra en un ángulo de 45 grados
    alejándose de las vías en la dirección de donde viene el tren, luego llame inmediatamente
    al 911''.'
- id: 84
  category: safe_driving_rules
  question: ¿Qué NO debe hacer mientras conduce a través de las vías del ferrocarril?
  choices:
    A: Mirar a ambos lados
    B: Cambiar de marcha
    C: Mantener una velocidad constante
    D: Verificar si viene un segundo tren
  answer: B
  explanation: 'El manual establece explícitamente: ''No cambie de marcha mientras
    conduce a través de las vías''.'
- id: 85
  category: signs_and_signals
  question: ¿Cuál es el propósito de la señal azul del Sistema de Notificación de
    Emergencia (ENS) en un cruce de ferrocarril a nivel?
  choices:
    A: Anunciar servicios de emergencia locales
    B: Proporcionar un número gratuito para informar sobre condiciones inseguras o
      vehículos varados
    C: Indicar el límite de velocidad para los trenes
    D: Advertir a los conductores sobre los próximos semáforos
  answer: B
  explanation: La señal ENS proporciona un número gratuito atendido por despachadores
    de ferrocarril y un número de identificación de su ubicación para informar sobre
    condiciones inseguras o vehículos averiados.
- id: 86
  category: license_system
  question: ¿Dónde puede obtener información sobre cómo conseguir una placa de matrícula
    para personas con discapacidad o un permiso colgante temporal?
  choices:
    A: El Departamento de Seguridad Pública
    B: La Oficina del Recaudador de Impuestos del Condado
    C: El departamento de policía local
    D: El Departamento de Transporte
  answer: B
  explanation: 'El manual establece: ''Para obtener información sobre cómo conseguir
    una placa para personas con discapacidad, comuníquese con la Oficina del Recaudador
    de Impuestos de su Condado''.'
- id: 87
  category: signs_and_signals
  question: En las zonas rurales, ¿con cuánta antelación a las vías del ferrocarril
    se coloca normalmente la señal de advertencia amarilla redonda?
  choices:
    A: De 100 a 200 pies
    B: De 250 a 400 pies
    C: De 500 a 900 pies
    D: De 1000 a 1500 pies
  answer: C
  explanation: El manual establece que en las zonas rurales, la señal amarilla redonda
    con una 'X' negra y dos letras R normalmente se coloca de 500 a 900 pies antes
    de las vías.
- id: 88
  category: safe_driving_rules
  question: Si un oficial de tránsito le indica que avance por un cruce de ferrocarril
    a pesar de otras señales, ¿qué debe hacer?
  choices:
    A: Esperar a que las luces dejen de parpadear
    B: Seguir la orden del oficial de inmediato
    C: Detenerse y pedir una aclaración al oficial
    D: Dar la vuelta y buscar otra ruta
  answer: B
  explanation: 'El manual establece: ''Si un oficial de tránsito le indica que avance
    por un cruce de ferrocarril, siga la orden de inmediato''.'
- id: 89
  category: signs_and_signals
  question: ¿Cuáles de los siguientes se utilizan como barreras para mantener el tráfico
    fuera de las zonas de trabajo peligrosas?
  choices:
    A: Tambores, conos y tubos
    B: Solo líneas amarillas pintadas
    C: Badenes y bandas sonoras
    D: Luces verdes intermitentes
  answer: A
  explanation: 'El manual establece: ''Se utilizan barreras, como tambores, conos
    y tubos (paneles), para mantener el tráfico fuera de las zonas de trabajo peligrosas''.'
- id: 90
  category: signs_and_signals
  question: ¿Cuándo se le permite girar a la derecha con una luz roja continua?
  choices:
    A: En cualquier momento, sin detenerse, si la intersección está despejada.
    B: Solo después de reducir la velocidad y ceder el paso a los peatones.
    C: Después de hacer una parada completa y ceder el paso al tráfico y a los peatones,
      a menos que una señal lo prohíba.
    D: Solo cuando también esté iluminada una flecha verde.
  answer: C
  explanation: Puede girar a la derecha mientras la luz está en rojo. Pero primero,
    debe DETENERSE COMPLETAMENTE y ceder el paso a otros vehículos y peatones. NO
    puede girar en rojo si una señal se lo prohíbe.
- id: 91
  category: signs_and_signals
  question: ¿Qué significa una luz verde fija si usted está girando a la izquierda?
  choices:
    A: Usted tiene un giro protegido y el tráfico en sentido contrario debe detenerse.
    B: Debe ceder el paso al tráfico en sentido contrario.
    C: Debe esperar a una flecha verde antes de girar.
    D: Debe girar inmediatamente para despejar la intersección.
  answer: B
  explanation: Si está girando a la izquierda, la luz verde fija significa que debe
    CEDER EL PASO AL TRÁFICO EN SENTIDO CONTRARIO.
- id: 92
  category: signs_and_signals
  question: ¿Qué indica una flecha amarilla intermitente?
  choices:
    A: Usted tiene un giro protegido.
    B: Puede girar en la dirección de la flecha, pero debe ceder el paso al tráfico
      en sentido contrario.
    C: La luz está a punto de cambiar a rojo y debe detenerse.
    D: No puede girar en la dirección de la flecha.
  answer: B
  explanation: Una FLECHA AMARILLA INTERMITENTE significa que puede girar en la dirección
    de la flecha si se encuentra en el carril adecuado. Debe CEDER EL PASO AL TRÁFICO
    EN SENTIDO CONTRARIO.
- id: 93
  category: safe_driving_rules
  question: ¿Cómo debe proceder si se aproxima a un semáforo averiado que no tiene
    ninguna luz funcionando?
  choices:
    A: Reduzca la velocidad y continúe sin detenerse si el camino está despejado.
    B: Deténgase por completo y proceda con precaución, cediendo el derecho de paso
      en las intersecciones.
    C: Trate la intersección como una señal de ceda el paso.
    D: Espere hasta que llegue un oficial de tránsito para dirigir el tráfico.
  answer: B
  explanation: Si se aproxima a un semáforo averiado SIN LUCES FUNCIONANDO, debe DETENERSE
    por completo y proceder con precaución, siguiendo las reglas o cediendo el derecho
    de paso en las intersecciones.
- id: 94
  category: signs_and_signals
  question: ¿Cómo le indicará usualmente un oficial de tránsito que se detenga?
  choices:
    A: Levantando una mano, con la palma hacia usted, y dando un toque largo de silbato.
    B: Haciendo señas con una mano y dando una serie de toques cortos de silbato.
    C: Agitando una bandera roja en movimiento circular.
    D: Apuntando directamente a su vehículo y tocando el silbato dos veces.
  answer: A
  explanation: Un oficial usualmente le indicará que se detenga levantando una mano,
    con la palma hacia usted, y luego dando un toque largo de silbato.
- id: 95
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para cualquier vehículo en una
    zona escolar?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: La velocidad máxima para cualquier vehículo en una ZONA ESCOLAR es
    de 15 mph.
- id: 96
  category: safe_driving_rules
  question: ¿Cuáles son los límites de velocidad máximo y mínimo para automóviles
    de pasajeros en las carreteras interestatales?
  choices:
    A: 65 mph máximo, 40 mph mínimo
    B: 70 mph máximo, 45 mph mínimo
    C: 70 mph máximo, 40 mph mínimo
    D: 75 mph máximo, 50 mph mínimo
  answer: C
  explanation: Los límites de velocidad para automóviles de pasajeros en las Interestatales
    son una velocidad máxima de 70 mph y una velocidad mínima de 40 mph.
- id: 97
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un uso incorrecto de las luces direccionales
    de su vehículo?
  choices:
    A: Señalizar para entrar en un espacio de estacionamiento en paralelo.
    B: Señalizar para avisar a un vehículo detrás de usted que es seguro rebasar.
    C: Señalizar con suficiente antelación antes de un giro.
    D: Señalizar al cambiar de carril.
  answer: B
  explanation: No use su direccional izquierda para avisar a un vehículo detrás de
    usted que es seguro rebasar. El conductor de atrás es responsable de determinar
    si es seguro rebasar.
- id: 98
  category: safe_driving_rules
  question: ¿Cuál es la señal manual adecuada para un giro a la derecha?
  choices:
    A: Extender el brazo y la mano rectos hacia afuera.
    B: Extender el brazo y la mano hacia abajo, con la palma hacia atrás.
    C: Extender el brazo y la mano hacia arriba, con el brazo doblado en el codo.
    D: Agitar la mano en movimiento circular.
  answer: C
  explanation: 'GIRO A LA DERECHA: Extienda el brazo y la mano hacia arriba, con el
    brazo doblado en el codo.'
- id: 99
  category: safe_driving_rules
  question: Al usar señales manuales, ¿con cuánta antelación debe señalizar continuamente
    antes de reducir la velocidad, girar, detenerse o cambiar de carril?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Si está usando señales manuales, asegúrese de extender el brazo completamente
    y señalizar continuamente durante al menos cien pies antes de reducir la velocidad,
    girar, detenerse o cambiar de carril.
- id: 100
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento recomendada al conducir detrás de
    otro vehículo?
  choices:
    A: La longitud de un automóvil por cada 5 millas por hora de velocidad.
    B: La longitud de un automóvil por cada 10 millas por hora de velocidad.
    C: La longitud de dos automóviles por cada 10 millas por hora de velocidad.
    D: La longitud de tres automóviles independientemente de la velocidad.
  answer: B
  explanation: Cuando siga a otro vehículo, deje al menos la longitud de un automóvil
    entre usted por cada diez millas por hora de velocidad.
- id: 101
  category: sharing_the_road
  question: ¿Cómo debe ajustar su distancia de seguimiento si participa en una caravana
    o cortejo fúnebre?
  choices:
    A: Conducir lo más cerca posible del vehículo de adelante para evitar que otros
      se interpongan.
    B: Dejar suficiente espacio entre usted y el siguiente automóvil para que otros
      vehículos puedan entrar de manera segura en esos espacios.
    C: Mantener una distancia de exactamente el largo de un automóvil, independientemente
      de la velocidad.
    D: Conducir por el carril izquierdo para rebasar al resto del tráfico.
  answer: B
  explanation: Si participa en una caravana, como un cortejo fúnebre, deje suficiente
    espacio entre usted y el siguiente automóvil para que otros vehículos puedan entrar
    de manera segura en esos espacios.
- id: 102
  category: signs_and_signals
  question: ¿Qué debe hacer un peatón si ya ha comenzado a cruzar la intersección
    y la señal de cruce de peatones cambia a intermitente?
  choices:
    A: Detenerse en medio de la intersección y esperar a la siguiente señal.
    B: Dar la vuelta y regresar a la acera de la que salió.
    C: Continuar cruzando la intersección.
    D: Correr lo más rápido posible hacia la acera más cercana.
  answer: C
  explanation: Los peatones deben continuar cruzando si comenzaron a cruzar la intersección
    antes de que la señal cambiara a intermitente.
- id: 103
  category: signs_and_signals
  question: Cuando se utilizan señales de control de dirección de carril, ¿en qué
    carriles se le permite circular?
  choices:
    A: Cualquier carril que no tenga tráfico en sentido contrario.
    B: Solo carriles marcados con una luz amarilla intermitente.
    C: Solo carriles marcados con una luz verde.
    D: Cualquier carril, siempre que ceda el paso a otros vehículos.
  answer: C
  explanation: Cuando se utilizan señales como estas, puede circular ÚNICAMENTE en
    un carril marcado con una luz verde. NUNCA circule en un carril marcado con una
    luz roja.
- id: 104
  category: vehicle_information
  question: ¿Cuál es el límite de velocidad máximo para un autobús escolar mientras
    transporta niños hacia y desde la escuela en rutas regulares?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: B
  explanation: La velocidad máxima para un AUTOBÚS ESCOLAR mientras transporta niños
    hacia y desde la escuela en rutas regulares es de 45 mph.
- id: 105
  category: vehicle_information
  question: Las distancias de frenado que se muestran en el manual asumen ¿cuál de
    las siguientes condiciones ideales?
  choices:
    A: Buenos neumáticos, buenos frenos y pavimento seco
    B: Neumáticos nuevos, frenos antibloqueo y una carretera pavimentada
    C: Buenos neumáticos, buenos frenos y pavimento mojado
    D: Clima despejado, luz del día y buenos frenos
  answer: A
  explanation: 'El manual establece que las distancias de frenado mostradas asumen
    condiciones ideales: buenos neumáticos, buenos frenos y pavimento seco.'
- id: 106
  category: safe_driving_rules
  question: Si conduce en una calle o carretera con más de un carril para su dirección,
    ¿en qué carril debería conducir generalmente?
  choices:
    A: El carril del extremo izquierdo
    B: El carril central
    C: El carril del extremo derecho
    D: El carril con la menor cantidad de tráfico
  answer: C
  explanation: Si conduce en una calle o carretera con más de un carril para su dirección,
    debe conducir en el carril del extremo DERECHO, excepto para rebasar o girar a
    la izquierda.
- id: 107
  category: signs_and_signals
  question: ¿Qué significa si se encuentra en una carretera dividida por una línea
    amarilla continua y una línea amarilla discontinua?
  choices:
    A: Puede cruzar las líneas para rebasar solo si la línea amarilla continua es
      la más cercana a su carril de circulación.
    B: Nunca puede cruzar las líneas para rebasar bajo ninguna circunstancia.
    C: Puede cruzar las líneas para rebasar solo si la línea amarilla discontinua
      es la más cercana a su carril de circulación.
    D: Puede cruzar las líneas para rebasar independientemente de qué línea esté más
      cerca de usted.
  answer: C
  explanation: Si se encuentra en una carretera dividida TANTO por una línea amarilla
    continua COMO por una línea amarilla discontinua, puede cruzar las líneas para
    rebasar ÚNICAMENTE si la línea amarilla discontinua es la más cercana a su carril
    de circulación (y si el carril contrario está despejado y es seguro rebasar).
- id: 108
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones se le permite adelantar y rebasar
    a otro vehículo por la derecha?
  choices:
    A: Cuando el vehículo que está rebasando está haciendo o está a punto de hacer
      un giro a la izquierda.
    B: Cuando conduce en una carretera de dos carriles con una línea amarilla doble
      continua.
    C: Cuando debe conducir fuera del pavimento hacia el arcén (hombro) para rodear
      el vehículo.
    D: Cuando el vehículo de adelante circula por debajo del límite de velocidad indicado
      en una carretera de un solo carril.
  answer: A
  explanation: Puede adelantar y rebasar a otro vehículo por la derecha cuando el
    vehículo que está rebasando está haciendo o está a punto de hacer un giro a la
    izquierda, siempre que las condiciones le permitan hacerlo de manera segura.
- id: 109
  category: safe_driving_rules
  question: ¿A cuántos pies de un puente, viaducto o cruce de ferrocarril NO debe
    rebasar a otro vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: 'El manual establece: ''No rebase en colinas, curvas o a menos de cien
    pies de puentes, viaductos, pasos elevados, cruces de ferrocarril, pasos de peatones,
    intersecciones o cualquier lugar donde su visión esté obstruida de alguna manera''.'
- id: 110
  category: defensive_driving
  question: ¿Qué debe hacer cuando otro vehículo lo está rebasando en una carretera
    de dos o tres carriles?
  choices:
    A: Moverse hacia la izquierda para bloquear al vehículo que intenta rebasar.
    B: Aumentar su velocidad para que el otro vehículo pueda incorporarse detrás de
      usted.
    C: Mantenerse a la derecha y no aumentar su velocidad hasta que el otro automóvil
      lo haya rebasado por completo.
    D: Encender y apagar sus faros para advertir al tráfico que viene en sentido contrario.
  answer: C
  explanation: Cuando lo rebasen en una carretera de dos o tres carriles, manténgase
    a la derecha. No aumente su velocidad hasta que el otro automóvil lo haya rebasado
    por completo.
- id: 111
  category: safe_driving_rules
  question: Al dar la vuelta con su vehículo en un espacio reducido, ¿cuál es el primer
    paso que debe dar?
  choices:
    A: Comenzar desde el extremo izquierdo de la carretera y girar el volante bruscamente
      hacia la derecha.
    B: Comenzar desde el extremo derecho de la carretera, dar la señal correcta y
      girar el volante bruscamente hacia la izquierda mientras avanza muy lentamente.
    C: Retroceder lentamente hacia el bordillo derecho antes de girar el volante hacia
      la izquierda.
    D: Girar las ruedas completamente hacia la derecha y acelerar rápidamente.
  answer: B
  explanation: Para dar la vuelta de manera segura en un espacio reducido, el paso
    1 es comenzar desde el extremo derecho de la carretera, dar la señal correcta
    y girar el volante bruscamente hacia la izquierda mientras se avanza lentamente.
- id: 112
  category: defensive_driving
  question: ¿Qué debe hacer si se aproxima a una intersección y el tráfico está bloqueado
    delante de usted?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje.
    B: Detenerse sobre el paso de peatones para que los peatones puedan caminar detrás
      de su vehículo.
    C: Detenerse antes de llegar al paso de peatones y esperar a que el tráfico avance.
    D: Tocar la bocina para animar al tráfico de adelante a moverse más rápido.
  answer: C
  explanation: Al acercarse a una intersección y el tráfico está bloqueado adelante,
    debe detenerse antes de llegar al paso de peatones y esperar a que el tráfico
    se mueva.
- id: 113
  category: safe_driving_rules
  question: Al prepararse para realizar un giro en una intersección, ¿qué debe hacer
    con las ruedas de su vehículo mientras espera para girar?
  choices:
    A: Girarlas ligeramente en la dirección de su giro previsto.
    B: Mantener las ruedas de su vehículo rectas hasta que haya comenzado el giro.
    C: Girarlas bruscamente hacia la derecha para evitar rodar hacia el tráfico.
    D: Mantenerlas giradas hacia la izquierda para prepararse para una maniobra rápida.
  answer: B
  explanation: 'El manual aconseja a los conductores: ''Mantenga las ruedas de su
    vehículo rectas hasta que haya comenzado el giro'' al prepararse para girar en
    una intersección.'
- id: 114
  category: vehicle_information
  question: ¿Cuál de las siguientes acciones debe EVITAR al realizar un giro en una
    intersección?
  choices:
    A: Completar el giro a una velocidad constante.
    B: Cambiar de marcha al entrar en la intersección.
    C: Reducir la velocidad mucho antes de llegar al paso de peatones.
    D: Permanecer en su carril durante todo el giro.
  answer: B
  explanation: De acuerdo con las pautas para realizar un giro seguro, usted 'No debe
    cambiar de marcha al entrar en la intersección'.
- id: 115
  category: safe_driving_rules
  question: ¿A qué distancia de una intersección debe activar su señal antes de realizar
    un giro a la izquierda o a la derecha?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Tanto para los giros a la izquierda como a la derecha, el manual indica
    a los conductores que activen su señal y reduzcan la velocidad 'Al menos a cien
    pies de la intersección'.
- id: 116
  category: safe_driving_rules
  question: Al rebasar a otro vehículo por la izquierda, ¿cuándo es seguro volver
    al carril derecho?
  choices:
    A: Tan pronto como su parachoques delantero esté por delante del otro vehículo.
    B: Cuando esté en paralelo con el otro vehículo.
    C: Cuando pueda ver el vehículo que rebasó en su espejo retrovisor.
    D: Inmediatamente después de activar su señal de giro a la derecha.
  answer: C
  explanation: 'El manual establece: ''Antes de volver al carril derecho, asegúrese
    de que puede ver el vehículo que rebasó en su espejo retrovisor''.'
- id: 117
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias se le permite conducir fuera del pavimento o
    por el acotamiento (shoulder) para rebasar a otro vehículo?
  choices:
    A: Cuando el vehículo de adelante está girando a la izquierda y no hay espacio
      en el pavimento.
    B: Cuando se encuentra en una carretera de cuatro carriles y el carril derecho
      está bloqueado.
    C: Al evitar un vehículo agrícola de movimiento lento.
    D: Bajo ninguna circunstancia.
  answer: D
  explanation: 'El manual establece explícitamente: ''Bajo ninguna circunstancia se
    le permite conducir fuera del pavimento o por el acotamiento para rebasar''.'
- id: 118
  category: safe_driving_rules
  question: Al ejecutar un giro a la izquierda, ¿dónde debe posicionar su vehículo
    al entrar en la intersección?
  choices:
    A: Justo a la izquierda del centro.
    B: Justo a la derecha del centro.
    C: Tan cerca del bordillo derecho como sea posible.
    D: En el carril del extremo izquierdo de la calle transversal.
  answer: B
  explanation: El paso 4 para realizar un giro a la izquierda indica 'mirar a ambos
    lados antes de entrar en la intersección. Luego, entrar justo a la derecha del
    centro'.
- id: 119
  category: signs_and_signals
  question: En una carretera dividida, ¿qué indican las flechas verdes pintadas en
    la calzada?
  choices:
    A: Son marcas en el pavimento que indican una zona para rebasar.
    B: Indican la dirección de viaje y no son marcas en el pavimento.
    C: Marcan la ubicación de un paso de peatones.
    D: Indican un carril de estacionamiento designado.
  answer: B
  explanation: El manual señala que 'Las flechas verdes indican la dirección de viaje
    y no son marcas en el pavimento'.
- id: 120
  category: safe_driving_rules
  question: Al viajar por una calle de sentido único, ¿cuál es una buena regla a recordar
    al prepararse para realizar un giro?
  choices:
    A: Girar siempre desde el carril central.
    B: Girar siempre desde el carril más cercano a la acera.
    C: Girar desde el carril más alejado de la acera.
    D: Puede girar desde cualquier carril disponible.
  answer: B
  explanation: El manual establece que una buena regla a recordar cuando se viaja
    por una calle de sentido único es girar siempre desde el carril más cercano a
    la acera.
- id: 121
  category: safe_driving_rules
  question: ¿Cómo deben proceder dos conductores que se acercan a una intersección
    desde direcciones opuestas y ambos desean girar a la izquierda?
  choices:
    A: Cada conductor debe girar a la derecha del otro.
    B: El conductor que llegó primero debe retroceder.
    C: Cada conductor debe girar a la izquierda del otro.
    D: Ambos conductores deben seguir recto a través de la intersección.
  answer: C
  explanation: Según el manual, cuando dos conductores se acercan a una intersección
    y ambos quieren girar a la izquierda, cada conductor debe girar a la izquierda
    del otro.
- id: 122
  category: defensive_driving
  question: ¿Qué debe hacer si el tráfico está bloqueado cuando se acerca a una intersección?
  choices:
    A: Ingrese a la intersección y espere a que el tráfico se despeje.
    B: Deténgase antes de llegar al paso de peatones y espere a que el tráfico avance.
    C: Toque la bocina hasta que el tráfico avance.
    D: Conduzca por el acotamiento para evitar la intersección bloqueada.
  answer: B
  explanation: El manual aconseja que si el tráfico está bloqueado cuando se acerca
    a una intersección, debe detenerse antes de llegar al paso de peatones y esperar
    a que el tráfico avance.
- id: 123
  category: safe_driving_rules
  question: Si dos vehículos llegan al mismo tiempo a una parada de cuatro vías, ¿quién
    tiene el derecho de paso?
  choices:
    A: El vehículo a la izquierda.
    B: El vehículo a la derecha.
    C: El vehículo que viaja más rápido.
    D: El vehículo que tiene la intención de girar a la izquierda.
  answer: B
  explanation: En una parada de cuatro vías, si varios vehículos llegan al mismo tiempo,
    el vehículo a la derecha tiene el derecho de paso.
- id: 124
  category: safe_driving_rules
  question: ¿En qué dirección circulan los vehículos en una rotonda o círculo de tráfico?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En un patrón de figura en ocho
    D: En cualquier dirección que tenga menos tráfico
  answer: B
  explanation: El manual establece que los vehículos circulan en sentido contrario
    a las agujas del reloj alrededor de una isla central elevada en una rotonda o
    círculo de tráfico.
- id: 125
  category: safe_driving_rules
  question: ¿A qué distancia debe detenerse de un autobús escolar que tiene sus luces
    rojas parpadeando y la señal de alto extendida?
  choices:
    A: Al menos 5 pies
    B: Al menos 10 pies
    C: Al menos 15 pies
    D: Al menos 20 pies
  answer: B
  explanation: La ley de Mississippi establece que debe detenerse por completo al
    menos a diez pies de distancia de un autobús escolar con sus luces rojas parpadeando
    y/o la señal de alto extendida.
- id: 126
  category: safe_driving_rules
  question: ¿Cuándo NO es obligatorio detenerse ante un autobús escolar con luces
    rojas parpadeando?
  choices:
    A: Cuando viaja en la misma dirección en una carretera de dos carriles.
    B: Cuando viaja en la dirección opuesta en una carretera dividida con cuatro o
      más carriles.
    C: Cuando llega tarde al trabajo.
    D: Cuando el autobús está detenido en un cruce de ferrocarril.
  answer: B
  explanation: Si viaja en la dirección opuesta al autobús escolar detenido en una
    carretera dividida con cuatro o más carriles, puede continuar viajando sin detenerse.
- id: 127
  category: sharing_the_road
  question: ¿Cuál es un indicador común de que un peatón es ciego o tiene una discapacidad
    visual?
  choices:
    A: Está paseando a un perro pequeño.
    B: Lleva un bastón blanco, que puede tener la punta roja.
    C: Lleva ropa reflectante brillante.
    D: Está caminando fuera del paso de peatones.
  answer: B
  explanation: El manual indica que se debe estar atento a los peatones vulnerables
    que llevan un bastón blanco, que puede tener la punta roja, lo que indica que
    son ciegos o tienen una discapacidad visual.
- id: 128
  category: sharing_the_road
  question: ¿Cuál es la regla con respecto a los cortejos fúnebres según el manual?
  choices:
    A: La ley le exige ceder el derecho de paso.
    B: Debe detenerse a un lado y apagar el motor.
    C: Es una cortesía común ceder el derecho de paso, aunque la ley no lo exige.
    D: Usted tiene el derecho de paso y debe proceder normalmente.
  answer: C
  explanation: 'El manual establece: ''Aunque la ley no lo exige, la cortesía común
    es ceder el derecho de paso a los cortejos fúnebres''.'
- id: 129
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios no puede detenerse y dejar
    su vehículo estacionado y sin vigilancia?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: A
  explanation: Las áreas de estacionamiento prohibido incluyen a menos de diez pies
    de un hidrante de incendios.
- id: 130
  category: safe_driving_rules
  question: ¿A cuántos pies del riel más cercano de cualquier cruce de ferrocarril
    está prohibido estacionarse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: No puede estacionarse a menos de quince pies del riel más cercano de
    cualquier cruce de ferrocarril.
- id: 131
  category: safe_driving_rules
  question: Si debe estacionarse a lo largo de una carretera fuera de distritos comerciales
    o residenciales, ¿a qué distancia debe ser visible su vehículo estacionado en
    ambas direcciones?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Al estacionarse en una carretera, debe hacerlo de modo que pueda ser
    visto desde al menos doscientos pies en ambas direcciones.
- id: 132
  category: sharing_the_road
  question: ¿Cómo debe tratar a las bicicletas al determinar el derecho de paso en
    una intersección?
  choices:
    A: Siempre ceda el paso a ellas independientemente de las señales de tráfico.
    B: Las bicicletas siempre deben ceder el paso a los vehículos motorizados.
    C: Ceda el paso a las bicicletas exactamente como lo haría con cualquier otro
      vehículo.
    D: No se permiten bicicletas en las intersecciones.
  answer: C
  explanation: 'El manual establece: ''Debe ceder el paso a las BICICLETAS exactamente
    como lo haría con cualquier otro vehículo''.'
- id: 133
  category: vehicle_information
  question: Al estacionar un vehículo con transmisión estándar (manual), ¿en qué marcha
    debe ponerlo?
  choices:
    A: Park (Estacionamiento)
    B: Neutral (Punto muerto)
    C: Low (Baja)
    D: Reverse (Reversa)
  answer: C
  explanation: En general, cuando estacione su vehículo, debe poner la marcha en park
    (transmisión automática) o en low (transmisión estándar).
- id: 134
  category: safe_driving_rules
  question: Al estacionarse en paralelo, ¿qué tan cerca deben estar los neumáticos
    del bordillo (curb)?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: B
  explanation: Para los vehículos estacionados en paralelo, los neumáticos deben estar
    a menos de doce pulgadas del bordillo.
- id: 135
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso cuando un conductor sale de un espacio
    de estacionamiento en paralelo y se incorpora al tráfico?
  choices:
    A: El conductor que sale del espacio de estacionamiento
    B: El tráfico que se aproxima
    C: Solo los peatones
    D: El vehículo que se mueve a la velocidad más lenta
  answer: B
  explanation: El conductor que sale de un espacio de estacionamiento no tiene el
    derecho de paso. Debe CEDER el paso a cualquier tráfico que se aproxime.
- id: 136
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas al estacionar en una posición cuesta
    arriba con bordillo?
  choices:
    A: Completamente hacia la derecha
    B: Completamente hacia la izquierda
    C: Hacia adelante en línea recta
    D: Paralelas al bordillo
  answer: B
  explanation: En una posición cuesta arriba con bordillo, gire las ruedas completamente
    hacia la izquierda.
- id: 137
  category: defensive_driving
  question: ¿Qué es lo más seguro que puede hacer si se encuentra con un vehículo
    por la noche con luces delanteras brillantes o deslumbrantes?
  choices:
    A: Parpadear sus luces altas repetidamente
    B: Ponerse gafas oscuras
    C: Bajar la intensidad de sus luces y mantener la vista en el lado derecho de
      la carretera
    D: Mirar directamente a las luces delanteras que se aproximan para calcular su
      distancia
  answer: C
  explanation: Si se encuentra con un vehículo por la noche con luces delanteras brillantes
    o deslumbrantes, lo más seguro es bajar la intensidad de sus luces y mantener
    la vista en el lado derecho de la carretera.
- id: 138
  category: safe_driving_rules
  question: Por ley, ¿debe usar sus luces bajas cuando se aproxime a qué distancia
    de un vehículo que viene en sentido contrario?
  choices:
    A: 200 pies
    B: 300 pies
    C: 400 pies
    D: 500 pies
  answer: D
  explanation: La ley exige que use las luces bajas cuando se aproxime a menos de
    quinientos pies de un vehículo que viene en sentido contrario o cuando siga a
    otro vehículo a menos de quinientos pies.
- id: 139
  category: safe_driving_rules
  question: ¿Qué luces delanteras debe usar al conducir con niebla?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Luces de emergencia (intermitentes)
  answer: B
  explanation: Use siempre las luces bajas al conducir con niebla, ya sea de noche
    o de día. El uso de luces altas mientras se conduce con niebla reduce la visibilidad.
- id: 140
  category: driver_responsibility
  question: Según la ley de Mississippi, ¿los niños de qué edad deben estar debidamente
    asegurados en un asiento elevado (booster seat) de posicionamiento de cinturón
    si miden menos de 4 pies y 9 pulgadas de alto o pesan menos de 65 libras?
  choices:
    A: Menores de cuatro años
    B: Al menos cuatro años pero menores de siete años
    C: Al menos siete años pero menores de diez años
    D: Menores de trece años
  answer: B
  explanation: Los niños de al menos cuatro años pero menores de siete años que midan
    menos de 4 pies y 9 pulgadas de altura o que pesen menos de sesenta y cinco libras
    deben estar debidamente asegurados en un sistema de asiento elevado (booster seat)
    de posicionamiento de cinturón.
- id: 141
  category: defensive_driving
  question: ¿Cuándo suelen estar las carreteras más resbaladizas y peligrosas durante
    una tormenta de lluvia?
  choices:
    A: Después de que haya estado lloviendo intensamente durante una hora
    B: Durante los primeros minutos de lluvia o llovizna
    C: Justo después de que la lluvia se haya detenido por completo
    D: Cuando los charcos comienzan a evaporarse
  answer: B
  explanation: Los primeros minutos de lluvia o llovizna son en realidad los más resbaladizos
    y peligrosos porque el primer contacto del agua con la carretera desprende la
    suciedad y la grasa acumuladas.
- id: 142
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a derrapar?
  choices:
    A: Frenar repentinamente para detener el vehículo
    B: Girar el volante en la dirección opuesta al derrape
    C: Girar el volante en la dirección del derrape
    D: Accionar el embrague inmediatamente
  answer: C
  explanation: Si su vehículo comienza a derrapar, gire el volante en la dirección
    del derrape. Recuerde que frenar repentinamente aumentará el derrape. Nunca use
    el embrague cuando intente detener un derrape.
- id: 143
  category: defensive_driving
  question: Si se le pincha una llanta o tiene un reventón mientras conduce, ¿qué
    es lo primero que debe hacer?
  choices:
    A: Aplicar los frenos repentinamente
    B: Quitar el pie del acelerador
    C: Girar el volante bruscamente hacia la derecha
    D: Poner el vehículo en punto muerto (neutral)
  answer: B
  explanation: Si tiene una llanta pinchada o un reventón, no aplique los frenos repentinamente.
    Quite el pie del acelerador. Luego, aplique los frenos lenta y cautelosamente.
- id: 144
  category: safe_driving_rules
  question: Si su automóvil queda inhabilitado y debe caminar para buscar ayuda, ¿por
    dónde debe caminar?
  choices:
    A: En el lado derecho de la carretera, a favor del tráfico
    B: En el lado izquierdo de la carretera, de frente al tráfico que viene en sentido
      contrario
    C: En la mediana central
    D: En el lado derecho de la carretera, de frente al tráfico que viene en sentido
      contrario
  answer: B
  explanation: Si debe caminar para buscar ayuda, camine siempre por el lado izquierdo
    de la carretera, de frente al tráfico que viene en sentido contrario.
- id: 145
  category: driver_responsibility
  question: ¿Qué número puede marcar en un teléfono celular para reportar una situación
    de tráfico de emergencia a la Patrulla de Caminos de Mississippi?
  choices:
    A: '*HP (*47)'
    B: '*MHP (*647)'
    C: '*911'
    D: '*DOT (*368)'
  answer: A
  explanation: Para reportar una situación de tráfico de emergencia en una interestatal
    o carretera en Mississippi, marque *HP (*47) en un teléfono celular para ser conectado
    de forma gratuita con un despachador de la Patrulla de Caminos de Mississippi.
- id: 146
  category: driver_responsibility
  question: Debe informar inmediatamente un accidente a las autoridades si este involucra
    lesiones, muerte o daños materiales aparentes que superen ¿qué cantidad?
  choices:
    A: $100.00
    B: $250.00
    C: $500.00
    D: $1,000.00
  answer: C
  explanation: Informe inmediatamente a las autoridades policiales correspondientes
    si el accidente involucra lesiones, muerte o daños materiales aparentes que superen
    los $500.00.
- id: 147
  category: penalties_and_points
  question: ¿Qué puede suceder si se ve involucrado en un accidente y no puede mostrar
    el comprobante de seguro al oficial que responda?
  choices:
    A: Se le citará por una infracción solo si usted tiene la culpa.
    B: Se le puede citar por una infracción incluso si no tiene la culpa.
    C: Su vehículo será confiscado inmediatamente.
    D: Se le dará un período de gracia de 30 días para comprar un seguro.
  answer: B
  explanation: Si no tiene comprobante de seguro, se le puede citar por una infracción
    incluso si no tiene la culpa del accidente.
- id: 148
  category: driver_responsibility
  question: ¿Cuándo está legalmente obligado a informar un accidente de tráfico?
  choices:
    A: Solo si usted tiene la culpa del accidente.
    B: Solo si alguien resulta herido o muere.
    C: A menos que no haya heridos y los daños materiales sean inferiores a $500.
    D: Solo si los daños materiales superan los $1,000.
  answer: C
  explanation: 'El manual establece: ''Independientemente de si usted tiene la culpa
    o no en un accidente, debe informarlo a menos que no haya heridos y los daños
    materiales asciendan a menos de $500''.'
- id: 149
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima un vehículo de emergencia con luces intermitentes
    mientras usted se encuentra en medio de una intersección?
  choices:
    A: Detenerse inmediatamente en el centro de la intersección.
    B: Cruzar la intersección y detenerse en el arcén derecho extremo.
    C: Hacer un giro en U inmediato para despejar la intersección.
    D: Detenerse en el lado izquierdo de la intersección.
  answer: B
  explanation: Según el manual, 'Si se encuentra en una intersección, cruce la intersección
    y deténgase en el arcén derecho extremo'.
- id: 150
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima a un vehículo de emergencia con sus luces
    activadas estacionado a un lado de una carretera de cuatro carriles?
  choices:
    A: Mantener su velocidad y permanecer en su carril actual.
    B: Detenerse inmediatamente al lado del vehículo de emergencia.
    C: Incorporarse al carril alejado del vehículo de emergencia si es seguro, o reducir
      la velocidad y prepararse para detenerse.
    D: Acelerar para rebasar al vehículo de emergencia lo más rápido posible.
  answer: C
  explanation: El manual requiere que usted 'se incorpore al carril alejado del vehículo
    de emergencia si es seguro hacerlo. Si incorporarse a un carril adyacente no es
    seguro, reduzca la velocidad y prepárese para detenerse si es necesario'.
- id: 151
  category: safe_driving_rules
  question: Si la policía lo detiene por la noche, ¿qué acción debe tomar para ayudar
    con la visibilidad?
  choices:
    A: Apagar todas las luces de su vehículo.
    B: Encender las luces altas.
    C: Encender las luces interiores.
    D: Encender las luces de emergencia (hazard lights) continuamente.
  answer: C
  explanation: 'Durante una parada de tráfico por la noche, el manual aconseja: ''Encienda
    las luces interiores si lo detienen por la noche para ayudar con la visibilidad''.'
- id: 152
  category: driver_responsibility
  question: Cuando un oficial de la ley lo detiene, ¿cuál es el momento adecuado para
    buscar su licencia de conducir o los documentos del vehículo?
  choices:
    A: Tan pronto como se detenga, antes de que el oficial se acerque a su ventana.
    B: Mientras el oficial camina hacia su vehículo.
    C: Solo después de esperar las instrucciones del oficial.
    D: No necesita proporcionar documentos a menos que sea arrestado.
  answer: C
  explanation: 'El manual instruye a los conductores: ''Espere las instrucciones del
    oficial antes de buscar su licencia de conducir o los documentos del vehículo''.'
- id: 153
  category: penalties_and_points
  question: ¿Qué indica su firma en una multa de tráfico?
  choices:
    A: Una admisión de culpabilidad.
    B: Una renuncia a su derecho a una audiencia judicial.
    C: Una promesa de pagar la multa de inmediato.
    D: No es una admisión de culpabilidad.
  answer: D
  explanation: 'El manual establece explícitamente: ''Su aceptación y firma en una
    multa de tráfico no es una admisión de culpabilidad''.'
- id: 154
  category: safe_driving_rules
  question: Al entrar en una autopista interestatal, ¿dónde debe aumentar su velocidad
    para igualar el flujo del tráfico?
  choices:
    A: En la rampa de entrada antes del carril de aceleración.
    B: En el carril de aceleración.
    C: Después de haberse incorporado al carril principal de circulación.
    D: En el carril de desaceleración.
  answer: B
  explanation: 'El manual establece: ''Al llegar al final de la rampa, aumente su
    velocidad en el carril de aceleración hasta alcanzar la velocidad del tráfico
    de la autopista interestatal''.'
- id: 155
  category: safe_driving_rules
  question: Al salir de la interestatal, ¿cuándo debe comenzar a reducir su velocidad?
  choices:
    A: Un cuarto de milla antes de la salida mientras aún está en el carril de circulación.
    B: Tan pronto como encienda su luz direccional.
    C: Solo después de haberse movido con seguridad al carril de desaceleración.
    D: Después de haber salido completamente de la rampa.
  answer: C
  explanation: 'El manual aconseja: ''No reduzca la velocidad hasta que se haya movido
    con seguridad al carril de desaceleración. Luego reduzca su velocidad al límite
    indicado...'''
- id: 156
  category: safe_driving_rules
  question: ¿Cuál es la acción correcta a tomar si se pasa de su salida en la interestatal?
  choices:
    A: Detenerse y retroceder con cuidado por el acotamiento (shoulder).
    B: Hacer un giro en U a través de la mediana.
    C: Continuar hasta la siguiente salida.
    D: Detenerse en el carril derecho y esperar a que el tráfico se despeje antes
      de retroceder.
  answer: C
  explanation: 'El manual establece claramente: ''Si se pasa de su salida, no se detenga
    ni retroceda. Continúe hasta la siguiente salida''.'
- id: 157
  category: safe_driving_rules
  question: En una autopista interestatal, ¿cuál es el uso principal previsto para
    el carril izquierdo?
  choices:
    A: Tráfico directo.
    B: Rebasar (pasar).
    C: Tráfico más lento.
    D: Salir de la autopista.
  answer: B
  explanation: 'Según el manual: ''El carril derecho está destinado al tráfico directo,
    mientras que el carril izquierdo está destinado a rebasar''.'
- id: 158
  category: defensive_driving
  question: Según el manual, ¿cuál es la distancia de seguimiento recomendada si conduce
    a 70 mph en la interestatal?
  choices:
    A: Tres largos de vehículo.
    B: Cinco largos de vehículo.
    C: Siete largos de vehículo.
    D: Diez largos de vehículo.
  answer: C
  explanation: 'El manual establece: ''Si conduce a setenta mph, manténgase al menos
    a siete largos de vehículo del vehículo que va delante''. (Un largo de vehículo
    por cada 10 mph).'
- id: 159
  category: defensive_driving
  question: Si su vehículo se avería en la interestatal y queda varado, ¿cuál es el
    curso de acción más seguro?
  choices:
    A: Pararse al lado de su vehículo para pedir ayuda.
    B: Caminar por la interestatal hasta la salida más cercana.
    C: Intentar pedir aventón (hitchhike) hasta una gasolinera.
    D: Permanecer dentro de su vehículo, cerrar las puertas con llave y esperar ayuda
      confiable.
  answer: D
  explanation: 'El manual advierte: ''Si queda varado en la interestatal, nunca salga
    de su vehículo hacia el flujo principal de tráfico. No se pare al lado de su vehículo.
    Nunca camine a lo largo o a través de la interestatal. Nunca intente pedir aventón.
    Permanezca dentro de su vehículo, cierre las puertas con llave y espere ayuda
    confiable''.'
- id: 160
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego inmediatamente
    detrás de un camión de remolque grande?
  choices:
    A: Está a menos de 100 pies detrás del camión.
    B: No puede ver los espejos laterales del camión.
    C: Las luces de freno del camión no son visibles.
    D: Está conduciendo a una velocidad más lenta que el camión.
  answer: B
  explanation: 'El manual establece: ''Recuerde: Existe un punto ciego inmediatamente
    detrás de los camiones de remolque grandes. ¡Si no puede ver los espejos laterales
    de un camión grande, el conductor no puede verlo a usted!'''
- id: 161
  category: driver_responsibility
  question: ¿Qué debe hacer si tiene un arma en su vehículo cuando lo detiene la policía?
  choices:
    A: Esconder el arma debajo del asiento antes de que el oficial se acerque.
    B: Informar al oficial que tiene un arma al primer contacto.
    C: Esperar hasta que el oficial pida registrar el vehículo.
    D: Entregar el arma al oficial de inmediato.
  answer: B
  explanation: Durante una parada de tráfico, el manual instruye a los conductores
    a 'informar al oficial si tiene un arma en el vehículo al primer contacto'.
- id: 162
  category: driver_responsibility
  question: Si usted se ve involucrado en un accidente y resulta tan gravemente herido
    que no puede presentar un informe inmediato, ¿quién puede hacerlo?
  choices:
    A: Solo un oficial de la ley.
    B: Cualquiera de sus pasajeros.
    C: Solo el conductor del otro vehículo.
    D: Un técnico de emergencias médicas.
  answer: B
  explanation: 'El manual establece: ''Si usted está tan gravemente herido que no
    puede presentar un informe inmediato, cualquiera de sus pasajeros puede hacerlo''.'
- id: 163
  category: safe_driving_rules
  question: ¿Por qué siempre debe bajar la intensidad de sus faros (luces altas) cuando
    sigue a un vehículo grande por la noche?
  choices:
    A: Las luces brillantes pueden agotar la batería de su vehículo más rápido.
    B: Los vehículos grandes tienen sensores traseros sensibles.
    C: Las luces brillantes pueden reflejarse en los grandes espejos laterales y cegar
      al conductor.
    D: Ayuda al conductor del camión a ver el camino de adelante con más claridad.
  answer: C
  explanation: Al seguir a un vehículo grande por la noche, siempre baje la intensidad
    de sus faros porque las luces brillantes del vehículo de atrás pueden cegar al
    conductor cuando se reflejan en los grandes espejos laterales del vehículo.
- id: 164
  category: sharing_the_road
  question: En una carretera nivelada, ¿cuánto tiempo más se tarda en rebasar a un
    vehículo grande en comparación con un automóvil?
  choices:
    A: De 1 a 2 segundos más
    B: De 3 a 5 segundos más
    C: De 5 a 7 segundos más
    D: De 8 a 10 segundos más
  answer: B
  explanation: Según el manual, en una carretera nivelada, se tarda de 3 a 5 segundos
    más en rebasar a un vehículo grande que en rebasar a un automóvil.
- id: 165
  category: defensive_driving
  question: Al rebasar a un camión grande, ¿cuándo es seguro volver al carril del
    camión?
  choices:
    A: Tan pronto como pase el parachoques delantero del camión.
    B: Cuando pueda ver al conductor del camión en su espejo lateral.
    C: Cuando pueda ver las ruedas delanteras del camión tocando el pavimento en su
      espejo retrovisor.
    D: Después de haber mantenido su velocidad de rebase durante al menos 10 segundos.
  answer: C
  explanation: Antes de regresar al carril del vehículo que ha rebasado, asegúrese
    de volver solo cuando pueda ver las ruedas delanteras del camión tocando el pavimento
    en su espejo retrovisor.
- id: 166
  category: sharing_the_road
  question: 'Al encontrarse con un vehículo grande que viene en dirección opuesta,
    debe mantenerse lo más a la derecha posible porque la turbulencia del viento:'
  choices:
    A: Atrae a los vehículos entre sí.
    B: Empuja a los vehículos para separarlos.
    C: Hace que el camión pierda velocidad.
    D: Crea un vacío detrás de su vehículo.
  answer: B
  explanation: Debe mantenerse lo más a la derecha posible para evitar un choque de
    raspado lateral y reducir la turbulencia del viento, recordando que la turbulencia
    del viento empuja a los vehículos para separarlos; no los atrae entre sí.
- id: 167
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a un camión grande por la derecha si existe
    la posibilidad de que esté girando a la derecha?
  choices:
    A: Los camiones siempre deben girar desde el carril central.
    B: Los camiones requieren más espacio para girar y necesitan abrirse hacia la
      izquierda del carril.
    C: Rebasar por la derecha es ilegal en todas las carreteras de Mississippi.
    D: El escape del camión se expulsa por el lado derecho.
  answer: B
  explanation: Los vehículos grandes requieren más espacio para realizar un giro y
    necesitan abrirse hacia la izquierda del carril cuando se preparan para girar
    a la derecha. Rebasar por la derecha podría provocar un choque.
- id: 168
  category: sharing_the_road
  question: 'Al rebasar a un ciclista, los conductores deben dejar una distancia de
    seguridad de al menos:'
  choices:
    A: Dos pies
    B: Tres pies
    C: Cuatro pies
    D: Cinco pies
  answer: B
  explanation: Los conductores deben dejar una distancia de seguridad de al menos
    tres pies entre el vehículo y la bicicleta al rebasar la bicicleta.
- id: 169
  category: sharing_the_road
  question: ¿Bajo cuál de las siguientes condiciones se le permite a un ciclista desplazarse
    más a la izquierda en el carril de tráfico?
  choices:
    A: Cuando circula en una pendiente descendente para ganar velocidad.
    B: Cuando hay condiciones inseguras en el lado derecho del carril, como autos
      estacionados o vidrios rotos.
    C: Cuando quieren circular al lado de otros tres ciclistas.
    D: Cuando viajan más lento que el límite de velocidad indicado.
  answer: B
  explanation: Un ciclista puede desplazarse hacia la izquierda o más hacia el carril
    de tráfico cuando hay condiciones inseguras en el lado derecho del carril, como
    pavimento roto, peatones, autos estacionados o peligros en la carretera.
- id: 170
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla para el ciclismo seguro con respecto
    a la dirección de viaje?
  choices:
    A: Siempre circule de frente al tráfico que viene en sentido contrario.
    B: Circule por el lado izquierdo de la carretera si no hay arcén.
    C: Viaje en la misma dirección del tráfico.
    D: Zigzaguee entre el tráfico para mantenerse visible.
  answer: C
  explanation: Los ciclistas deben viajar en la misma dirección del tráfico. El manual
    establece explícitamente que nunca se debe montar en bicicleta de frente al tráfico
    que viene en sentido contrario.
- id: 171
  category: sharing_the_road
  question: ¿Según el manual, a qué velocidad puede circular un ciclista experimentado?
  choices:
    A: 10-15 millas por hora
    B: 15-20 millas por hora
    C: 20-25 millas por hora
    D: 25-30 millas por hora
  answer: C
  explanation: Un ciclista experimentado puede circular a 20-25 millas por hora y
    puede estar más cerca de lo que usted cree.
- id: 172
  category: vehicle_information
  question: 'La luz de la placa de su vehículo debe hacer que las letras y los números
    de su placa de matrícula sean visibles por la noche desde una distancia de:'
  choices:
    A: 30 pies
    B: 50 pies
    C: 60 pies
    D: 100 pies
  answer: C
  explanation: También debe tener una luz de placa que haga que la letra, el número
    o cualquier combinación de letras/números en su placa de matrícula (etiqueta)
    sea visible a sesenta pies por la noche.
- id: 173
  category: vehicle_information
  question: ¿Dónde debe colocarse la calcomanía de cumplimiento del polarizado de
    las ventanas en un vehículo registrado en Mississippi?
  choices:
    A: En la esquina superior derecha del parabrisas
    B: En la esquina inferior izquierda del parabrisas
    C: En la esquina inferior derecha de la ventana trasera
    D: En la ventana del lado del conductor
  answer: B
  explanation: La calcomanía de polarizado de las ventanas debe colocarse en la esquina
    inferior izquierda del parabrisas.
- id: 174
  category: vehicle_information
  question: 'El parabrisas de un vehículo con polarizado de ventanas no original debe
    tener una etiqueta que certifique que todas las ventanas tienen una transmisión
    de luz de al menos:'
  choices:
    A: 20%
    B: 25%
    C: 28%
    D: 32%
  answer: C
  explanation: El parabrisas del vehículo debe tener adherida una etiqueta que certifique
    que todas las ventanas del vehículo tienen una transmisión de luz del 28% o más.
- id: 175
  category: defensive_driving
  question: Si se detiene detrás de un vehículo grande en una pendiente ascendente,
    ¿por qué debería dejar espacio adicional?
  choices:
    A: El vehículo grande emitirá gases de escape densos al acelerar.
    B: El vehículo grande puede retroceder ligeramente cuando comience a moverse.
    C: El conductor necesita espacio para retroceder antes de avanzar.
    D: Le permite acelerar más rápido cuando la luz cambie a verde.
  answer: B
  explanation: Si se detiene detrás de un vehículo grande en una pendiente ascendente,
    deje espacio adicional en caso de que el vehículo retroceda ligeramente cuando
    comience a moverse.
- id: 176
  category: driver_responsibility
  question: ¿Cuál es el requisito mínimo de seguro de responsabilidad civil por daños
    a la propiedad de terceros en cualquier accidente único en Mississippi?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Los montos mínimos de seguro incluyen $25,000 por daños a la propiedad
    de terceros en cualquier accidente único.
- id: 177
  category: driver_responsibility
  question: ¿Es aceptable proporcionar el comprobante de seguro en formato electrónico
    durante una parada de tráfico?
  choices:
    A: No, las autoridades solo aceptan una tarjeta física de papel.
    B: Sí, pero solo si se imprime en el lugar de los hechos.
    C: No, el comprobante electrónico solo se acepta después de un accidente, no en
      una parada de tráfico.
    D: Sí, mostrando la imagen electrónica en un teléfono celular u otro dispositivo
      electrónico.
  answer: D
  explanation: Puede proporcionar el comprobante de seguro en formato electrónico
    mostrando la imagen electrónica en un teléfono celular o cualquier otro tipo de
    dispositivo electrónico.
- id: 178
  category: penalties_and_points
  question: Si usted es el conductor culpable en un accidente que causa lesiones y
    no tenía seguro de responsabilidad civil, ¿durante cuánto tiempo debe mantener
    y presentar el comprobante de seguro después?
  choices:
    A: Un año
    B: Tres años
    C: Cinco años
    D: Diez años
  answer: B
  explanation: Si usted tuvo la culpa y no tenía seguro, el comprobante de seguro
    que se le requiere comprar debe permanecer vigente por un período de tres años
    a partir de la fecha del accidente.
- id: 179
  category: safe_driving_rules
  question: Si sus reacciones se retrasan solo medio segundo mientras viaja a 55 millas
    por hora, ¿cuánta distancia adicional recorrerá su vehículo antes de detenerse?
  choices:
    A: 22 pies
    B: 33 pies
    C: 44 pies
    D: 55 pies
  answer: C
  explanation: Si sus reacciones se retrasan solo medio segundo y necesita frenar
    mientras viaja a cincuenta y cinco millas por hora, su vehículo recorrerá cuarenta
    y cuatro pies adicionales antes de detenerse.
- id: 180
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al cannabis
    medicinal y la conducción en Mississippi?
  choices:
    A: Fumar cannabis medicinal en un vehículo motorizado es legal siempre que el
      vehículo esté estacionado.
    B: Se permite conducir bajo la influencia del cannabis medicinal si tiene una
      receta válida.
    C: Fumar cannabis medicinal en un vehículo motorizado o conducir bajo su influencia
      es una violación de la ley.
    D: El cannabis medicinal no afecta los reflejos ni el juicio del conductor.
  answer: C
  explanation: Fumar cannabis medicinal en un vehículo motorizado o conducir o tener
    el control físico real de cualquier vehículo motorizado bajo su influencia es
    una violación de las leyes de Mississippi y puede resultar en un arresto.
- id: 181
  category: alcohol_drugs_health
  question: Bajo la Ley de Consentimiento Implícito de Mississippi, ¿cuál es la sanción
    administrativa si se niega a la solicitud de un oficial de la ley de realizarse
    una prueba de aliento o química?
  choices:
    A: Su licencia será suspendida administrativamente por 90 días.
    B: Será sentenciado inmediatamente a 48 horas de cárcel.
    C: Su licencia será revocada por un año.
    D: Recibirá una advertencia y una multa de $250.
  answer: A
  explanation: Si se niega a la prueba de aliento o química, su licencia será suspendida
    administrativamente por noventa días.
- id: 182
  category: alcohol_drugs_health
  question: Si se niega a realizarse una prueba de aliento o química, el oficial tomará
    su licencia y le entregará un recibo oficial que sirve como permiso temporal para
    conducir. ¿Por cuánto tiempo es válido este permiso?
  choices:
    A: 15 días
    B: 30 días
    C: 45 días
    D: 90 días
  answer: C
  explanation: Si se niega a la prueba, el oficial le entregará un recibo oficial
    por su licencia, el cual servirá como su permiso temporal para conducir, válido
    por solo cuarenta y cinco días.
- id: 183
  category: alcohol_drugs_health
  question: Para un conductor de 21 años de edad o más, ¿cuál es el nivel mínimo de
    contenido de alcohol en sangre (BAC) que se considera "bajo la influencia"?
  choices:
    A: .02%
    B: .04%
    C: .08%
    D: .10%
  answer: C
  explanation: Se considera que está bajo la influencia de alcohol embriagante si
    tiene 21 años de edad o más y su BAC registra .08% o más.
- id: 184
  category: penalties_and_points
  question: ¿Cuál es el período de suspensión de la licencia por una primera infracción
    de DUI para un conductor de 21 años de edad o más?
  choices:
    A: 30 días
    B: 90 días
    C: 120 días
    D: 1 año
  answer: C
  explanation: Una primera infracción de DUI (delito menor) para conductores de 21
    años o más conlleva una suspensión de la licencia de 120 días.
- id: 185
  category: penalties_and_points
  question: Si un conductor es menor de 21 años de edad y tiene un contenido de alcohol
    en sangre (BAC) de .08% o superior, ¿cómo se clasifica la infracción?
  choices:
    A: Como un DUI de Tolerancia Cero
    B: Como un DUI regular
    C: Como una infracción de tráfico menor
    D: Como un delito grave independientemente de las infracciones anteriores
  answer: B
  explanation: Si un conductor es menor de veintiún años y tiene un contenido de alcohol
    en sangre de .08% o superior, la infracción se clasifica como un DUI regular,
    no como un DUI de Tolerancia Cero.
- id: 186
  category: penalties_and_points
  question: ¿Cuál es la sanción de suspensión de licencia por una tercera infracción
    de DUI de Tolerancia Cero dentro de un periodo de cinco años?
  choices:
    A: 120 días
    B: 1 año
    C: 2 años o hasta que la persona cumpla 21 años, lo que sea más largo
    D: 5 años
  answer: C
  explanation: Una tercera infracción de DUI de Tolerancia Cero dentro de cinco años
    resulta en una suspensión de la licencia de 2 años o hasta que la persona cumpla
    21 años, lo que sea más largo.
- id: 187
  category: penalties_and_points
  question: El Comisionado de Seguridad Pública está autorizado a suspender su licencia
    sin una audiencia preliminar por ¿cuál de las siguientes razones?
  choices:
    A: Recibió una sola multa de estacionamiento.
    B: No pagó la manutención infantil.
    C: Estuvo involucrado en un choque leve sin heridos.
    D: No renovó el registro de su vehículo a tiempo.
  answer: B
  explanation: El Comisionado de Seguridad Pública está autorizado a suspender su
    licencia sin una audiencia preliminar si los registros públicos indican que usted
    no ha pagado la manutención infantil.
- id: 188
  category: penalties_and_points
  question: ¿Por cuál de las siguientes condenas debe el Comisionado de Seguridad
    Pública revocar su licencia por un período de un año?
  choices:
    A: Una condena por exceso de velocidad de más de 15 mph sobre el límite
    B: No pagar una citación de tráfico
    C: Tres condenas por conducción temeraria dentro de un período de doce meses
    D: Conducir sin comprobante de seguro en su vehículo
  answer: C
  explanation: El Comisionado de Seguridad Pública debe retirarle la licencia por
    un período de un año si es condenado por tres infracciones de conducción temeraria
    dentro de un período de doce meses.
- id: 189
  category: penalties_and_points
  question: Sus privilegios de conducir serán suspendidos por un año si es condenado
    por ¿cuántas infracciones de conducción temeraria dentro de un período de doce
    meses?
  choices:
    A: Dos
    B: Tres
    C: Cuatro
    D: Cinco
  answer: B
  explanation: Su licencia será suspendida por un período de un año si es condenado
    por tres infracciones de conducción temeraria dentro de un período de doce meses.
- id: 190
  category: penalties_and_points
  question: ¿Cuál de los siguientes es el ÚNICO método de pago aceptable para restablecer
    sus privilegios de conducir?
  choices:
    A: Cheque personal
    B: Efectivo
    C: Giro postal (Money order)
    D: Cheque de caja (Cashier's check)
  answer: D
  explanation: 'Debe pagar con un CHEQUE DE CAJA. El manual establece explícitamente:
    NO ENVÍE EFECTIVO, GIRO POSTAL NI UN CHEQUE PERSONAL.'
- id: 191
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento por una suspensión debido a una
    condena bajo la Ley de Consentimiento Implícito de Mississippi o DUI?
  choices:
    A: $25
    B: $100
    C: $150
    D: $175
  answer: D
  explanation: La tarifa para el restablecimiento después de una condena bajo la Ley
    de Consentimiento Implícito de Mississippi / DUI o la Ley de Sustancias Controladas
    Uniformes es de $175.
- id: 192
  category: penalties_and_points
  question: ¿Cuál es la tarifa de restablecimiento si su licencia fue suspendida por
    falta de pago de manutención infantil (Child Support)?
  choices:
    A: $25
    B: $50
    C: $100
    D: $175
  answer: A
  explanation: La tarifa para el restablecimiento debido a la falta de pago de manutención
    infantil es de $25.
- id: 193
  category: driver_responsibility
  question: Si se arrojan o desechan residuos sólidos desde un vehículo motorizado,
    ¿quién se considera que infringe la ley contra arrojar basura?
  choices:
    A: Solo el operador del vehículo
    B: Solo el dueño del vehículo
    C: Solo el pasajero que arrojó los residuos
    D: El operador o el dueño del vehículo motorizado, o ambos
  answer: D
  explanation: Cuando se arrojan o desechan residuos sólidos desde un vehículo motorizado,
    el operador o el dueño del vehículo motorizado, o ambos, se considerarán en infracción.
- id: 194
  category: vehicle_information
  question: ¿A qué distancia deben ser visibles las luces y los reflectores en la
    parte trasera de su camión-remolque?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Todas las luces y reflectores deben estar limpios y en buen estado
    de funcionamiento, y ser visibles a quinientos pies de la parte trasera de su
    camión-remolque.
- id: 195
  category: vehicle_information
  question: ¿De qué color deben ser los reflectores en la parte delantera y en los
    lados cerca de la parte delantera de su camión-remolque?
  choices:
    A: Rojo
    B: Ámbar
    C: Blanco
    D: Amarillo
  answer: B
  explanation: Todos los reflectores en la parte delantera y en los lados cerca de
    la parte delantera deben mostrar un color ámbar.
- id: 196
  category: vehicle_information
  question: Si un vehículo está diseñado o cargado de modo que la vista trasera del
    conductor esté obstruida, ¿qué distancia mínima hacia atrás debe permitir ver
    el espejo lateral?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Cualquier vehículo que esté diseñado o cargado de manera que la vista
    trasera del conductor esté obstruida debe tener un espejo lateral ubicado de modo
    que el conductor pueda ver al menos doscientos pies hacia atrás.
- id: 197
  category: safe_driving_rules
  question: Si su autobús o camión queda inhabilitado por la noche, ¿dónde debe colocar
    los tres dispositivos de advertencia requeridos?
  choices:
    A: 50 pies adelante, 50 pies atrás y al lado del vehículo en la calzada
    B: 100 pies adelante, 100 pies atrás y al lado del vehículo en la calzada
    C: 200 pies adelante, 200 pies atrás y al lado del vehículo en la calzada
    D: 500 pies adelante, 500 pies atrás y al lado del vehículo en la calzada
  answer: B
  explanation: Si su vehículo queda inhabilitado, coloque un dispositivo de advertencia
    aproximadamente a cien pies por delante de su ubicación, un segundo a cien pies
    por detrás y un tercero al lado del vehículo en la calzada.
- id: 198
  category: vehicle_information
  question: ¿Cuál es el ancho exterior máximo permitido para cualquier vehículo, incluida
    su carga (excluyendo tractores agrícolas)?
  choices:
    A: 8 pies
    B: 8 pies y medio
    C: 9 pies
    D: 10 pies
  answer: B
  explanation: El ancho exterior total de cualquier vehículo, incluida la carga que
    se transporte en dicho vehículo, no puede exceder los ocho pies y medio.
- id: 199
  category: vehicle_information
  question: Bajo condiciones normales, ¿cuál es la altura máxima permitida para cualquier
    vehículo, con o sin carga?
  choices:
    A: 12 pies y medio
    B: 13 pies
    C: 13 pies y medio
    D: 14 pies
  answer: C
  explanation: Bajo ninguna condición podrá ningún vehículo, con o sin carga, exceder
    una altura total de trece pies y medio.
- id: 200
  category: vehicle_information
  question: ¿Cuál es la longitud total máxima permitida para un solo vehículo, con
    o sin carga, incluidos los parachoques delantero y trasero?
  choices:
    A: 30 pies
    B: 40 pies
    C: 53 pies
    D: 60 pies
  answer: B
  explanation: Ningún vehículo individual, con o sin carga, puede tener una longitud
    total superior a cuarenta pies, incluidos los parachoques delantero y trasero.
- id: 201
  category: vehicle_information
  question: ¿Hasta qué distancia máxima puede extenderse la carga en la parte delantera
    de cualquier vehículo más allá de las ruedas delanteras o del parachoques delantero?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: La carga en cualquier vehículo operado solo o con la carga en la unidad
    delantera de cualquier combinación de vehículos no debe extenderse más de tres
    pies más allá de las ruedas delanteras del vehículo o del parachoques delantero.
- id: 202
  category: safe_driving_rules
  question: La maquinaria agrícola está exenta de las limitaciones de tamaño, peso
    y altura cuando se opera durante las horas del día en carreteras estatales, ¿dentro
    de qué distancia desde el punto de origen?
  choices:
    A: 25 millas
    B: 50 millas
    C: 75 millas
    D: 100 millas
  answer: B
  explanation: La maquinaria agrícola está exenta de las limitaciones de tamaño, peso
    y altura cuando se opera durante las horas del día en cualquier carretera estatal
    dentro de las cincuenta millas del punto de origen.
- id: 203
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción permitida a la regla que prohíbe
    que una carga se derrame o escape hacia la calzada?
  choices:
    A: Dejar caer grava para llenar baches
    B: Dejar caer tierra de un sitio de construcción
    C: Dejar caer arena sobre la calzada para asegurar la tracción
    D: Fuga de aceite de un vehículo antiguo
  answer: C
  explanation: 'No puede poner ningún vehículo en la carretera a menos que esté construido
    o cargado de manera que nada de la carga pueda derramarse, desplazarse, filtrarse
    o escaparse. EXCEPCIONES: Se permite dejar caer arena sobre la calzada para asegurar
    la tracción.'
- id: 204
  category: vehicle_information
  question: ¿Qué debe hacer si la carga de su camión llega a seis pulgadas o menos
    de la parte superior de la caja?
  choices:
    A: Conducir a una velocidad máxima de 45 mph
    B: Usar una lona o cubierta y cuatro tablas laterales de seis pulgadas
    C: Retirar suficiente carga para bajarla un pie
    D: Conducir solo durante las horas del día
  answer: B
  explanation: Según el manual, si su carga llega a seis pulgadas o menos de la parte
    superior de la caja, debe usar una lona, lienzo u otra cubierta para contener
    la carga, Y usar cuatro tablas laterales de seis pulgadas.
- id: 205
  category: safe_driving_rules
  question: Al conducir un camión en una carretera fuera de distritos comerciales
    o residenciales, ¿cuál es la distancia mínima de seguimiento detrás de otro camión?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Si conduce un camión o un camión con remolque fuera de distritos comerciales
    o residenciales, no debe seguir a menos de trescientos pies de otros camiones,
    excepto cuando intente rebasar.
- id: 206
  category: safe_driving_rules
  question: Si su vehículo transporta explosivos o líquidos inflamables, ¿qué debe
    hacer en los cruces de ferrocarril?
  choices:
    A: Detenerse solo si un tren es visible
    B: Detenerse en todos los cruces de ferrocarril incluso si no hay señales que
      adviertan de un tren
    C: Reducir la velocidad a 15 mph y proceder con precaución
    D: Tocar la bocina y proceder sin detenerse
  answer: B
  explanation: Si su vehículo transporta explosivos o líquidos inflamables, debe detenerse
    en todos los cruces de ferrocarril, incluso si no hay señales que adviertan que
    se aproxima un tren.
- id: 207
  category: safe_driving_rules
  question: ¿Qué es lo que nunca debe hacer al prepararse para dar marcha atrás con
    un camión o vehículo grande?
  choices:
    A: Salir y verificar los límites de espacio libre
    B: Hacer que alguien lo guíe
    C: Retroceder hacia una intersección para dar la vuelta
    D: Asegurarse de tener suficiente espacio para maniobrar
  answer: C
  explanation: Al dar marcha atrás con un camión o vehículo grande, el manual establece
    explícitamente que nunca debe retroceder hacia una intersección para dar la vuelta.
- id: 208
  category: safe_driving_rules
  question: ¿Por qué es ilegal desembragar mientras se conduce un camión en una pendiente
    descendente?
  choices:
    A: Causa un desgaste excesivo en la transmisión
    B: Se considera 'conducir por inercia' (coasting) y es muy arriesgado
    C: Consume más combustible que conducir con una marcha puesta
    D: Impide el uso de la bocina del vehículo
  answer: B
  explanation: Nunca desembrague mientras conduce su camión en una pendiente descendente.
    Este acto de 'conducir por inercia' es ilegal y muy arriesgado.
- id: 209
  category: license_system
  question: Debe tener una Licencia de Conducir Comercial (CDL) para operar un vehículo
    diseñado para transportar a más de ¿cuántas personas?
  choices:
    A: 8 personas
    B: 10 personas
    C: 12 personas
    D: 15 personas
  answer: D
  explanation: Debe tener una CDL para operar un vehículo diseñado para transportar
    a más de quince personas (incluido el conductor).
- id: 210
  category: license_system
  question: 'Se requiere una CDL para operar un solo vehículo con una Clasificación
    de Peso Bruto Vehicular (GVWR) de más de:'
  choices:
    A: 10,000 libras
    B: 15,000 libras
    C: 20,000 libras
    D: 26,000 libras
  answer: D
  explanation: Para obtener una CDL, debe aprobar las pruebas de conocimientos y habilidades.
    Debe tener una CDL para operar un solo vehículo con un GVWR de más de 26,000 libras.
- id: 211
  category: driver_responsibility
  question: Según el manual, ¿un solo donante de órganos puede salvar hasta cuántas
    vidas?
  choices:
    A: 4 vidas
    B: 8 vidas
    C: 12 vidas
    D: 16 vidas
  answer: B
  explanation: Un solo donante de órganos puede salvar hasta ocho vidas, y la donación
    de tejidos puede mejorar la vida de 75 o más personas.
- id: 212
  category: driver_responsibility
  question: ¿Quién debe dar el consentimiento para la donación de órganos si el fallecido
    es menor de 18 años?
  choices:
    A: El médico tratante
    B: El Departamento de Seguridad Pública
    C: El familiar legal más cercano
    D: El administrador del hospital
  answer: C
  explanation: Se requiere el consentimiento del familiar legal más cercano al momento
    de la donación para cualquier persona que aún sea menor de 18 años.
- id: 213
  category: driver_responsibility
  question: ¿Quién es responsable de los gastos hospitalarios hasta el momento del
    fallecimiento cuando se da el consentimiento para la donación de órganos?
  choices:
    A: El receptor del órgano
    B: La familia del donante
    C: El gobierno estatal
    D: El hospital
  answer: B
  explanation: Su familia no es responsable de ningún costo de donación. Sin embargo,
    usted es responsable de los gastos hospitalarios hasta el momento del fallecimiento,
    incluso cuando se da el consentimiento para la donación.
- id: 214
  category: safe_driving_rules
  question: ¿Qué tipos de vehículos están excluidos de la Natchez Trace Parkway?
  choices:
    A: Motocicletas
    B: Vehículos recreativos (RVs)
    C: Vehículos comerciales
    D: Autobuses de pasajeros
  answer: C
  explanation: Los vehículos comerciales están excluidos de la Parkway, y el acceso
    está limitado para proteger al automovilista que conduce a lo largo de la Trace.
- id: 215
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para viajar en la Natchez Trace
    Parkway, excepto donde se indiquen velocidades menores?
  choices:
    A: 45 MPH
    B: 50 MPH
    C: 55 MPH
    D: 65 MPH
  answer: B
  explanation: La velocidad máxima para viajar en la Parkway es de cincuenta MPH,
    excepto donde se indiquen velocidades menores.
- id: 216
  category: penalties_and_points
  question: Si infringe alguna ley mientras se encuentra en la Natchez Trace Parkway,
    ¿dónde será juzgado?
  choices:
    A: Un tribunal estatal
    B: Un tribunal del condado
    C: Un tribunal federal
    D: Un tribunal municipal
  answer: C
  explanation: Recuerde que si infringe alguna ley mientras está en la carretera o
    mientras usa cualquiera de las instalaciones de la Parkway, será juzgado en un
    tribunal federal.
- id: 217
  category: sharing_the_road
  question: ¿Cuál es el objetivo principal del programa de seguridad vial 'Share the
    Road' (Compartir la carretera)?
  choices:
    A: Reclutar nuevos conductores de camiones comerciales
    B: Llegar a las personas y cambiar el comportamiento de conducción para salvar
      vidas
    C: Promover la venta de camiones Mack
    D: Reducir el número de vehículos comerciales en la carretera
  answer: B
  explanation: El objetivo del programa es llegar a la mayor cantidad de personas
    posible y cambiar el comportamiento de conducción para que podamos salvar vidas.
- id: 218
  category: safe_driving_rules
  question: Al conducir un camión que transporta gasolina, aceite o explosivos, ¿qué
    debe hacer al poner gasolina en el tanque o al descargar el camión?
  choices:
    A: Mantener el motor en marcha para mantener la presión
    B: Apagar el encendido
    C: Encender las luces de emergencia y tocar la bocina
    D: Asegurarse de que las puertas traseras estén desbloqueadas
  answer: B
  explanation: Si conduce un camión que transporta gasolina, aceite o explosivos,
    tenga cuidado de evitar incendios y explosiones. Apague el encendido cuando ponga
    gasolina en el tanque o descargue el camión.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 219
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 220
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Carretera cerrada adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Calle sin salida adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRE (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar le pondría en la trayectoria del tráfico en sentido contrario.
  id: 221
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una calle de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 222
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: El tráfico fluye en una sola dirección — hacia la izquierda
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección — la dirección
    que señala la flecha.
  id: 223
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 224
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción está prohibida por esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 225
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite el giro en U
    B: No se permite el giro a la izquierda
    C: No se permite el giro a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 226
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 227
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 228
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 229
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta área
    C: Área de caza adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan la carretera con frecuencia en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 230
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que crucen la calle.
  id: 231
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 232
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 233
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 234
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 235
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 236
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y esté preparado para que el camino gire primero
    en un sentido y luego en el otro.
  id: 237
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 238
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: Un carril que termina
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 239
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Esté preparado para una reducción del ancho de la vía y ajuste su
    posición en el carril.
  id: 240
- image: divided_highway.png
  category: signs_and_signals
  id: 241
  question: ¿Qué indica que hay más adelante esta señal?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una carretera dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    carretera dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
- image: divided_highway_ends.png
  category: signs_and_signals
  id: 242
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: La carretera dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la carretera dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Esté preparado para el tráfico
    de doble sentido.
- image: two_way_traffic.png
  category: signs_and_signals
  id: 243
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una vía de sentido único o de una carretera dividida y se
    encuentre con vehículos que circulan en dirección opuesta.
- image: slippery_when_wet.png
  category: signs_and_signals
  id: 244
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
- image: hill.png
  category: signs_and_signals
  id: 245
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
- image: signal_ahead.png
  category: signs_and_signals
  id: 246
  question: ¿Para qué le advierte que se prepare esta señal?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
- image: stop_ahead.png
  category: signs_and_signals
  id: 247
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
- image: cross_road.png
  category: signs_and_signals
  id: 248
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
- image: side_road.png
  category: signs_and_signals
  id: 249
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde la carretera lateral.
- image: added_lane.png
  category: signs_and_signals
  id: 250
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la autopista sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer detenido o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal de NO ESTACIONAR (NO PARKING) en rojo y blanco significa
    que no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 251
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válida pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 252
