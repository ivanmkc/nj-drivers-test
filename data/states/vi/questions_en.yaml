metadata:
  source: USVI Driver Manual
  total_questions: 220
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What is the minimum age to apply for a learner's permit in the US Virgin
    Islands?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 18 years old
  answer: C
  explanation: According to the USVI Bureau of Motor Vehicles, an applicant must be
    at least 16 years of age to be eligible for a learner's permit.
- id: 2
  category: license_system
  question: New residents to the US Virgin Islands who hold a valid driver's license
    from another US jurisdiction must apply for a VI license within how many days
    of arrival?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Under USVI law, new residents have 90 days to transfer their out-of-state
    license to a US Virgin Islands driver's license.
- id: 3
  category: license_system
  question: While driving with a learner's permit in the US Virgin Islands, the supervising
    driver must meet which of the following requirements?
  choices:
    A: Must be at least 18 years old and have a valid license
    B: Must be at least 21 years old and have held a valid license for at least one
      year
    C: Must be a parent or legal guardian only
    D: Must be at least 25 years old
  answer: B
  explanation: A learner's permit holder must be accompanied by a licensed driver
    who is at least 21 years of age and has been licensed for at least one year, sitting
    in the front passenger seat.
- id: 4
  category: license_system
  question: Under the USVI Graduated Driver License (GDL) program, an intermediate
    license holder (under age 18) is restricted from driving during which hours unless
    accompanied by a parent or guardian?
  choices:
    A: Midnight to 5:00 AM
    B: 11:00 PM to 6:00 AM
    C: 10:00 PM to 6:00 AM
    D: 9:00 PM to 5:00 AM
  answer: C
  explanation: The USVI GDL program restricts intermediate license holders from driving
    between 10:00 PM and 6:00 AM unless they are with a licensed parent or guardian.
- id: 5
  category: license_system
  question: A standard US Virgin Islands driver's license is typically valid for how
    many years before it must be renewed?
  choices:
    A: 2 years
    B: 4 years
    C: 5 years
    D: 8 years
  answer: C
  explanation: In the US Virgin Islands, a standard operator's license is generally
    issued for a period of 5 years.
- id: 6
  category: license_system
  question: 'If you change your address within the US Virgin Islands, you must notify
    the Bureau of Motor Vehicles (BMV) within:'
  choices:
    A: 10 days
    B: 30 days
    C: 45 days
    D: 60 days
  answer: A
  explanation: USVI law requires drivers to notify the BMV of any change of address
    within 10 days of the move.
- id: 7
  category: license_system
  question: 'To pass the vision screening for a US Virgin Islands driver''s license,
    your visual acuity must be at least:'
  choices:
    A: 20/20
    B: 20/40
    C: 20/50
    D: 20/70
  answer: B
  explanation: The minimum vision requirement to obtain a driver's license in the
    USVI is 20/40 in at least one eye, with or without corrective lenses.
- id: 8
  category: license_system
  question: How long must a young driver hold a learner's permit in the USVI before
    they are eligible to take the road skills test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Under the USVI GDL requirements, a permit holder must maintain a clean
    driving record for at least 6 months before applying for the road test.
- id: 9
  category: license_system
  question: In the US Virgin Islands, your driver's license may be suspended if you
    accumulate how many points within a 12-month period?
  choices:
    A: 6 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: The USVI BMV point system mandates a license suspension if a driver
    accumulates 12 or more points within a 12-month period.
- id: 10
  category: license_system
  question: Which of the following documents is NOT acceptable as primary proof of
    identity when applying for a REAL ID-compliant USVI driver's license?
  choices:
    A: A valid US Passport
    B: An original US Birth Certificate
    C: A Social Security Card
    D: A Certificate of Naturalization
  answer: C
  explanation: While a Social Security Card is required for the SSN verification,
    it is not considered a primary 'Identity' document (like a passport or birth certificate)
    for REAL ID purposes in the USVI.
- id: 11
  category: license_system
  question: A US Virgin Islands learner's permit is valid for what period of time
    from the date of issuance?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: B
  explanation: A learner's permit in the US Virgin Islands is valid for one year.
    If it expires, the applicant must retake the written examination.
- id: 12
  category: license_system
  question: During the intermediate stage of the USVI GDL, how many non-family passengers
    under the age of 21 are allowed in the vehicle without adult supervision?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Intermediate license holders in the USVI are limited to carrying no
    more than one non-family passenger under the age of 21 unless accompanied by a
    licensed adult.
- id: 13
  category: license_system
  question: If a driver's license in the US Virgin Islands has been expired for more
    than ______, the applicant must retake both the written and road tests.
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 3 years
  answer: B
  explanation: If a USVI license is expired for more than one year, the BMV requires
    the individual to start the application process over, including all testing.
- id: 14
  category: license_system
  question: 'When taking the road skills test in the US Virgin Islands, the applicant
    must provide a vehicle that:'
  choices:
    A: Is provided by the BMV only
    B: Is insured, registered, and in safe operating condition
    C: Has an automatic transmission only
    D: Is less than 5 years old
  answer: B
  explanation: Applicants must provide their own vehicle for the road test, and it
    must have a valid registration sticker, current insurance, and pass a basic safety
    inspection by the examiner.
- id: 15
  category: license_system
  question: In the US Virgin Islands, male applicants between the ages of 18 and 25
    are required by law to be registered with which of the following when applying
    for a driver's license?
  choices:
    A: The USVI National Guard
    B: The Selective Service System
    C: The Bureau of Internal Revenue
    D: The USVI Department of Labor
  answer: B
  explanation: Under USVI law and federal requirements, male citizens or immigrants
    aged 18 through 25 must be registered with the Selective Service System to be
    eligible for a driver's license.
- id: 16
  category: license_system
  question: To have a 'Veteran' designation placed on a US Virgin Islands driver's
    license, what document must the applicant present to the BMV?
  choices:
    A: A letter from the Governor
    B: A valid military ID card only
    C: Form DD-214 (Certificate of Release or Discharge from Active Duty)
    D: A signed affidavit from a local VFW post
  answer: C
  explanation: Applicants must provide the DD-214 form showing an honorable discharge
    to have the Veteran designation added to their USVI driver's license.
- id: 17
  category: license_system
  question: 'A standard US Virgin Islands Class D operator''s license allows you to
    drive a vehicle with a Gross Vehicle Weight Rating (GVWR) of up to:'
  choices:
    A: 10,000 lbs
    B: 15,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: A Class D license in the USVI is for operating any single vehicle with
    a GVWR of 26,000 lbs or less, provided it is not used for commercial purposes
    requiring a CDL.
- id: 18
  category: license_system
  question: In the US Virgin Islands, drivers who are ____ years of age or older must
    provide a medical certificate from a licensed physician to renew their driver's
    license.
  choices:
    A: '60'
    B: '65'
    C: '70'
    D: '75'
  answer: C
  explanation: According to USVI BMV regulations, drivers aged 70 and older are required
    to submit a medical fitness certificate upon renewal of their driving privileges.
- id: 19
  category: license_system
  question: If your US Virgin Islands driver's license is lost or stolen, you must
    first obtain what document before the BMV will issue a duplicate?
  choices:
    A: A letter from your insurance company
    B: A police report from the VI Police Department
    C: A new birth certificate
    D: A notarized letter from your employer
  answer: B
  explanation: To replace a lost or stolen license in the USVI, the applicant must
    typically present a police report documenting the loss or theft to the BMV.
- id: 20
  category: license_system
  question: When applying for a USVI license, you may choose to be an organ donor.
    At what age can an individual legally make this election on their license without
    parental consent?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: In the US Virgin Islands, individuals 18 years of age or older may
    legally elect to be organ donors on their driver's license.
- id: 21
  category: license_system
  question: A person visiting the US Virgin Islands with a valid foreign driver's
    license may legally drive in the territory for up to how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: Tourists or visitors with a valid foreign driver's license are permitted
    to drive in the USVI for a period not exceeding 90 days.
- id: 22
  category: license_system
  question: Under the USVI point system, a conviction for 'Reckless Driving' will
    result in how many points being added to your driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is considered a serious offense in the USVI and typically
    results in 6 points being assessed against the driver's record.
- id: 23
  category: license_system
  question: 'For drivers under the age of 21 in the US Virgin Islands, the ''Zero
    Tolerance'' law sets the maximum legal Blood Alcohol Concentration (BAC) limit
    at:'
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: The USVI enforces a Zero Tolerance law for minors, where a BAC of 0.02%
    or higher results in immediate license suspension for drivers under 21.
- id: 24
  category: license_system
  question: 'In the USVI, when a parent or guardian signs the license application
    for a minor, they are also accepting:'
  choices:
    A: Responsibility for the vehicle's maintenance
    B: Financial liability for any negligence or willful misconduct of the minor while
      driving
    C: The requirement to ride with the minor at all times until age 21
    D: Payment of all the minor's future traffic fines
  answer: B
  explanation: By signing the application for a minor, the parent or guardian assumes
    joint and several liability for any damages caused by the minor's negligence or
    misconduct while operating a motor vehicle.
- id: 25
  category: license_system
  question: 'If you legally change your name (e.g., through marriage or court order),
    you must notify the USVI BMV and obtain a corrected license within:'
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: A
  explanation: Similar to an address change, a name change must be reported to the
    BMV within 10 days to ensure driver records remain accurate.
- id: 26
  category: license_system
  question: The US Virgin Islands BMV is required by the 'Motor Voter' law to provide
    what service during a driver's license application?
  choices:
    A: Free passport photos
    B: Voter registration opportunities
    C: Property tax payment processing
    D: Jury duty exemption forms
  answer: B
  explanation: The National Voter Registration Act (Motor Voter) requires the BMV
    to offer applicants the opportunity to register to vote while applying for or
    renewing a driver's license.
- id: 27
  category: license_system
  question: To operate a motorcycle or motor-driven cycle in the US Virgin Islands,
    you must have which specific classification on your license?
  choices:
    A: Class A
    B: Class C
    C: Class M
    D: Class E
  answer: C
  explanation: A Class M license or endorsement is specifically required to legally
    operate motorcycles on public roads in the US Virgin Islands.
- id: 28
  category: license_system
  question: A US Virgin Islands driver's license can be suspended for which of the
    following non-driving reasons?
  choices:
    A: Failure to pay child support
    B: Failure to pay property taxes
    C: Failure to graduate high school
    D: Failure to have a valid library card
  answer: A
  explanation: In the USVI, as in many US jurisdictions, failure to comply with child
    support orders can lead to the suspension of a driver's license.
- id: 29
  category: license_system
  question: If your USVI driver's license has been suspended, what must you do to
    regain your driving privileges after the suspension period ends?
  choices:
    A: Wait 30 additional days
    B: Pay a reinstatement fee and meet any other court-ordered requirements
    C: Simply start driving again; the license is automatically valid
    D: Apply for a brand new learner's permit
  answer: B
  explanation: To reinstate a suspended license in the USVI, the driver must pay a
    reinstatement fee to the BMV and provide proof that all conditions of the suspension
    (such as court requirements) have been met.
- id: 30
  category: driver_testing
  question: When providing a vehicle for the US Virgin Islands road skills test, where
    must the parking brake (emergency brake) be located?
  choices:
    A: To the left of the driver's feet
    B: On the dashboard
    C: In the center console area, accessible to the examiner
    D: Anywhere, as long as it is functional
  answer: C
  explanation: For safety reasons during the road test, the USVI Bureau of Motor Vehicles
    requires the vehicle to have a center-mounted parking brake that the examiner
    can reach in an emergency.
- id: 31
  category: driver_testing
  question: 'To pass the US Virgin Islands written knowledge examination, an applicant
    must achieve a minimum score of:'
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 90%
  answer: C
  explanation: The USVI written test requires a passing score of 80%, meaning the
    applicant must correctly answer at least 40 out of 50 questions.
- id: 32
  category: driver_testing
  question: Which of the following actions will result in an immediate failure during
    the US Virgin Islands road skills test?
  choices:
    A: Adjusting the mirrors before starting
    B: Striking a curb or sidewalk
    C: Using the turn signal too early
    D: Driving at 2 mph below the speed limit
  answer: B
  explanation: Striking a curb, sidewalk, or any object during the road test is considered
    a dangerous action or lack of control and results in an immediate failure.
- id: 33
  category: driver_testing
  question: If an applicant fails the US Virgin Islands written knowledge test, what
    is the minimum waiting period before they can attempt the test again?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: C
  explanation: According to BMV guidelines, applicants who fail the written examination
    must generally wait at least 7 days before retaking the test.
- id: 34
  category: driver_testing
  question: During the US Virgin Islands road skills test, who is permitted to be
    in the vehicle besides the applicant and the BMV examiner?
  choices:
    A: The applicant's driving instructor
    B: A parent or legal guardian
    C: No one else is permitted
    D: One translator if the applicant does not speak English
  answer: C
  explanation: To ensure an objective and undistracted environment, only the applicant
    and the authorized BMV examiner are allowed in the vehicle during the road test.
- id: 35
  category: driver_testing
  question: Before the road skills test begins in the USVI, the examiner will check
    the vehicle for which of the following?
  choices:
    A: A valid registration and current inspection sticker
    B: A full tank of gasoline
    C: The presence of a spare tire
    D: The vehicle's service history logs
  answer: A
  explanation: The vehicle used for the road test must be street-legal, which includes
    having a valid registration, proof of insurance, and a current USVI inspection
    sticker.
- id: 36
  category: driver_testing
  question: If you require corrective lenses to pass the USVI vision screening, which
    restriction code will be placed on your driver's license?
  choices:
    A: Restriction A
    B: Restriction B
    C: Restriction C
    D: Restriction Z
  answer: A
  explanation: In the US Virgin Islands, 'Restriction A' on a driver's license indicates
    that the driver is required to wear corrective lenses while operating a motor
    vehicle.
- id: 37
  category: driver_testing
  question: Which specific maneuver is a mandatory part of the US Virgin Islands road
    skills test to demonstrate vehicle control in tight spaces?
  choices:
    A: A high-speed merge
    B: A three-point turn
    C: Driving in reverse for one mile
    D: Off-road recovery
  answer: B
  explanation: The three-point turn (or K-turn) is a standard requirement of the USVI
    road test to ensure the driver can safely turn the vehicle around in a narrow
    space.
- id: 38
  category: driver_testing
  question: 'During the road test, if the vehicle''s turn signals are not clearly
    visible due to bright sunlight, the examiner may ask the applicant to demonstrate:'
  choices:
    A: Hazard light usage
    B: Hand signals
    C: Use of the horn to signal turns
    D: Flashing the high beams
  answer: B
  explanation: Applicants must be prepared to demonstrate standard hand signals (left
    turn, right turn, and stop/slow) during the road test if requested or if equipment
    fails.
- id: 39
  category: driver_testing
  question: In the US Virgin Islands, the written knowledge test is primarily offered
    in which two languages?
  choices:
    A: English and French
    B: English and Spanish
    C: English and Dutch
    D: English and Creole
  answer: B
  explanation: The USVI Bureau of Motor Vehicles provides the driver's license knowledge
    examination in both English and Spanish.
- id: 40
  category: driver_testing
  question: When taking the road test in the USVI, what is the policy regarding the
    use of a rental car?
  choices:
    A: Rental cars are never allowed for road tests
    B: Rental cars are allowed only if the examiner drives it first
    C: Rental cars are allowed only if the applicant is listed as a driver on the
      rental agreement and provides insurance proof
    D: Rental cars are allowed without any extra documentation
  answer: C
  explanation: An applicant may use a rental car for the road test, but they must
    be an authorized driver on the rental contract and provide the appropriate insurance
    documents for that vehicle.
- id: 41
  category: driver_testing
  question: What is the visual acuity requirement for an applicant to pass the USVI
    vision test without a 'daylight only' restriction?
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/70 in both eyes
    D: 20/100 in at least one eye
  answer: B
  explanation: The USVI standard for a regular driver's license is 20/40 visual acuity
    in at least one eye, with or without corrective lenses.
- id: 42
  category: driver_testing
  question: Which of the following is a core component of the USVI written test regarding
    traffic orientation?
  choices:
    A: Knowledge of driving on the right side of the road
    B: Knowledge of driving on the left side of the road
    C: Knowledge of international maritime signals
    D: Knowledge of four-way stops only
  answer: B
  explanation: Because the US Virgin Islands is the only US jurisdiction where traffic
    moves on the left, knowledge of left-side driving rules is a critical part of
    the written and road tests.
- id: 43
  category: driver_testing
  question: An applicant for a USVI road test must present which document to the examiner
    before the test begins?
  choices:
    A: A valid USVI learner's permit
    B: A high school diploma
    C: A social security card
    D: A utility bill from the last 30 days
  answer: A
  explanation: You cannot take the road skills test without presenting a valid, original
    USVI learner's permit to the examiner.
- id: 44
  category: driver_testing
  question: 'During the USVI road test, if you are approaching a red light and intend
    to turn left, you must demonstrate knowledge that:'
  choices:
    A: Left turns on red are never allowed
    B: Left turns on red are allowed after a complete stop, unless a sign prohibits
      it
    C: You must wait for a green arrow only
    D: You only need to slow down, not stop, before turning left
  answer: B
  explanation: In the USVI (driving on the left), a left turn on red is permitted
    after a complete stop if the way is clear and no signs prohibit the turn, similar
    to a right turn on red in the mainland US.
- id: 45
  category: driver_testing
  question: If you fail the road skills test in the US Virgin Islands, what is the
    minimum waiting period before you are allowed to retake the test?
  choices:
    A: 24 hours
    B: 3 days
    C: 7 days
    D: 30 days
  answer: C
  explanation: According to the USVI Bureau of Motor Vehicles, an applicant who fails
    the road test must wait at least one week (7 days) before they can attempt the
    test again.
- id: 46
  category: driver_testing
  question: 'When driving in the US Virgin Islands, you must drive on the left side
    of the road. When an emergency vehicle with sirens or flashing lights approaches,
    you should:'
  choices:
    A: Pull over to the right side of the road and stop.
    B: Pull over to the left side of the road and stop.
    C: Speed up to get out of the way.
    D: Stop exactly where you are in the middle of the lane.
  answer: B
  explanation: Because the USVI drives on the left, you must pull over to the extreme
    left side of the road to allow emergency vehicles to pass safely.
- id: 47
  category: driver_testing
  question: What is the minimum amount of property damage liability insurance required
    by law for a motor vehicle in the US Virgin Islands?
  choices:
    A: $5,000
    B: $7,000
    C: $10,000
    D: $20,000
  answer: C
  explanation: The USVI requires a minimum of $10,000 for property damage, along with
    $10,000 per person and $20,000 per accident for bodily injury.
- id: 48
  category: driver_testing
  question: In the US Virgin Islands, what is the maximum speed limit in a school
    zone when children are present?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: A
  explanation: The standard speed limit in USVI school zones is 10 miles per hour
    to ensure the safety of students.
- id: 49
  category: driver_testing
  question: 'Under US Virgin Islands law, children must be secured in a child restraint
    system if they are under the age of:'
  choices:
    A: 3 years old
    B: 5 years old
    C: 8 years old
    D: 10 years old
  answer: B
  explanation: USVI law requires that any child under the age of 5 must be properly
    secured in a federally approved child safety seat.
- id: 50
  category: driver_testing
  question: Unless otherwise posted, what is the maximum speed limit for motor vehicles
    in a business or residential district in the US Virgin Islands?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: B
  explanation: In the USVI, the default speed limit within town limits, business districts,
    or residential areas is 20 mph unless signs indicate otherwise.
- id: 51
  category: driver_testing
  question: 'When parking a vehicle on a hill in the US Virgin Islands, you must set
    the parking brake and:'
  choices:
    A: Leave the wheels straight.
    B: Turn the wheels toward the curb if facing uphill.
    C: Turn the wheels so that if the vehicle rolls, it will roll away from traffic.
    D: Keep the engine running.
  answer: C
  explanation: Drivers must turn their wheels in a direction that prevents the car
    from rolling into the path of traffic should the brakes fail.
- id: 52
  category: driver_testing
  question: In the US Virgin Islands, you are prohibited from parking within how many
    feet of a fire hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: C
  explanation: It is illegal to park a vehicle within 15 feet of a fire hydrant in
    the US Virgin Islands.
- id: 53
  category: driver_testing
  question: When are you allowed to make a turn on a red light in the US Virgin Islands?
  choices:
    A: Always, after coming to a complete stop.
    B: Never, unless a sign specifically permits the turn.
    C: Only when turning left from a one-way street.
    D: Only during daylight hours.
  answer: B
  explanation: In the US Virgin Islands, turns on red are generally prohibited unless
    there is a sign at the intersection specifically allowing it.
- id: 54
  category: driver_testing
  question: If you are involved in a traffic accident in the USVI that results in
    injury or property damage exceeding ______, you must report it to the Police Department.
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Any accident involving injury or property damage of $500 or more must
    be reported to the Virgin Islands Police Department.
- id: 55
  category: driver_testing
  question: 'In the US Virgin Islands, vehicle registration is renewed annually. The
    month of expiration is determined by:'
  choices:
    A: The owner's birth month.
    B: The date the vehicle was purchased.
    C: The last digit of the vehicle's license plate number.
    D: The first letter of the owner's last name.
  answer: C
  explanation: The BMV uses a staggered registration system where the expiration month
    is based on the final digit of the license plate.
- id: 56
  category: driver_testing
  question: 'Because traffic in the US Virgin Islands moves on the left, you should
    generally pass slower vehicles on their:'
  choices:
    A: Left side
    B: Right side
    C: Either side, whichever is clear
    D: Shoulder of the road
  answer: B
  explanation: When driving on the left, the standard procedure for overtaking and
    passing a slower vehicle is to pass on the right.
- id: 57
  category: driver_testing
  question: What is the maximum speed limit on highways outside of town in the US
    Virgin Islands, unless otherwise posted?
  choices:
    A: 30 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The maximum speed limit on the open highway outside of town in the
    USVI is 35 mph, unless a different speed is posted.
- id: 58
  category: driver_testing
  question: 'Using a handheld mobile telephone while driving in the US Virgin Islands
    is:'
  choices:
    A: Allowed if you are over 21.
    B: Allowed only for texting.
    C: Illegal, except for emergency calls to law enforcement or emergency services.
    D: Illegal only in school zones.
  answer: C
  explanation: The Virgin Islands Code prohibits the use of handheld mobile telephones
    while operating a motor vehicle, with exceptions for reporting emergencies.
- id: 59
  category: driver_responsibility
  question: What are the minimum liability insurance limits for bodily injury or death
    to two or more persons in a single accident in the USVI?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $40,000
  answer: C
  explanation: The USVI requires '10/20/10' coverage, meaning $20,000 is the minimum
    limit for bodily injury or death to two or more persons in one accident.
- id: 60
  category: driver_responsibility
  question: 'If you are involved in a motor vehicle accident in the US Virgin Islands
    that results in damage to property, you are required by law to:'
  choices:
    A: Wait 48 hours before notifying the police
    B: Only report it if the damage exceeds $2,000
    C: Immediately stop and notify the nearest police station
    D: File a report only if someone is injured
  answer: C
  explanation: Under VI Code Title 20, Section 542, the driver of any vehicle involved
    in an accident resulting in injury, death, or property damage must immediately
    stop and report the incident to the police.
- id: 61
  category: driver_responsibility
  question: In the US Virgin Islands, how often must a privately owned vehicle undergo
    a safety inspection at the Bureau of Motor Vehicles (BMV)?
  choices:
    A: Every six months
    B: Every year
    C: Every two years
    D: Only when the vehicle is sold
  answer: B
  explanation: Vehicles in the USVI must be inspected and registered annually at the
    BMV to ensure they meet safety standards for operation on public roads.
- id: 62
  category: driver_responsibility
  question: What is the legal Blood Alcohol Content (BAC) limit for a driver over
    the age of 21 in the US Virgin Islands?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In the USVI, it is illegal for any person to operate a motor vehicle
    with a BAC of 0.08% or higher.
- id: 63
  category: driver_responsibility
  question: 'Under the USVI ''Zero Tolerance'' law, a driver under the age of 21 can
    be charged with DUI if their Blood Alcohol Content (BAC) is at or above:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: For drivers under the age of 21, the USVI enforces a Zero Tolerance
    policy where a BAC of 0.02% or higher results in DUI penalties.
- id: 64
  category: driver_responsibility
  question: If a law enforcement officer in the USVI requests a chemical test of your
    breath or blood and you refuse, what is the immediate consequence under 'Implied
    Consent'?
  choices:
    A: Your vehicle will be impounded for 30 days
    B: You will be fined $50 and released
    C: Your driver's license will be seized and suspended
    D: Nothing happens until you go to court
  answer: C
  explanation: By driving in the USVI, you give 'implied consent' to chemical testing.
    Refusal results in the immediate seizure and administrative suspension of your
    driver's license.
- id: 65
  category: driver_responsibility
  question: When selling a vehicle in the US Virgin Islands, the seller must provide
    the buyer with a notarized Bill of Sale and which other document?
  choices:
    A: A copy of their birth certificate
    B: The vehicle's original Certificate of Title
    C: A letter of recommendation
    D: The last three years of maintenance records
  answer: B
  explanation: To legally transfer ownership in the USVI, the seller must sign over
    the Certificate of Title to the buyer and provide a notarized Bill of Sale.
- id: 66
  category: driver_responsibility
  question: In the US Virgin Islands, what is the maximum fine for a first-offense
    conviction of driving without valid liability insurance?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Driving without the required compulsory insurance in the USVI typically
    carries a fine of $500 for the first offense.
- id: 67
  category: driver_responsibility
  question: According to USVI law, who is responsible for ensuring that a passenger
    under the age of 14 is wearing a seatbelt or is in a child restraint system?
  choices:
    A: The passenger
    B: The driver of the vehicle
    C: The owner of the vehicle (if not the driver)
    D: The passenger's parents (even if not in the car)
  answer: B
  explanation: The driver is legally responsible for ensuring all passengers under
    the age of 14 are properly secured in a seatbelt or child safety seat.
- id: 68
  category: driver_responsibility
  question: 'If you hit an unattended vehicle in the USVI and cannot locate the owner,
    you must:'
  choices:
    A: Wait for 4 hours for the owner to return
    B: Leave a written notice with your name, address, and registration number, and
      notify the police
    C: Drive away if there is no visible damage
    D: Only leave a note if the damage is over $500
  answer: B
  explanation: Drivers must leave their contact and vehicle information in a conspicuous
    place on the unattended vehicle and report the accident to the police department.
- id: 69
  category: driver_responsibility
  question: Which of the following is a requirement for a vehicle to pass the annual
    BMV inspection in the US Virgin Islands?
  choices:
    A: The vehicle must have a premium sound system
    B: All lights, including turn signals and brake lights, must be functional
    C: The vehicle must be less than 10 years old
    D: The vehicle must have leather seats
  answer: B
  explanation: The BMV safety inspection checks essential safety components including
    lights, brakes, tires, steering, and horn functionality.
- id: 70
  category: driver_responsibility
  question: In the US Virgin Islands, what is the legal limit for window tint darkness
    on the front side windows?
  choices:
    A: No tint allowed at all
    B: Must allow more than 35% of light in
    C: Must allow more than 20% of light in
    D: Must allow more than 50% of light in
  answer: B
  explanation: USVI law (Title 20, Section 466) stipulates that window tint on the
    front side windows must have a light transmission of more than 35%.
- id: 71
  category: driver_responsibility
  question: 'If you are convicted of a DUI in the US Virgin Islands for the first
    time, your driver''s license will be suspended for a period of:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first-offense DUI conviction in the USVI typically results in a mandatory
    driver's license suspension of 6 months.
- id: 72
  category: driver_responsibility
  question: What is the penalty for littering from a motor vehicle on US Virgin Islands
    roadways?
  choices:
    A: A verbal warning only
    B: A fine of not less than $100
    C: Mandatory 24 hours in jail
    D: There is no specific law against littering from cars
  answer: B
  explanation: Littering from a vehicle is illegal in the USVI and carries significant
    fines, starting at $100 or more depending on the severity and location.
- id: 73
  category: driver_responsibility
  question: In the US Virgin Islands, what are the minimum liability insurance requirements
    for a private passenger vehicle?
  choices:
    A: $5,000 for property damage, $10,000 for one person, $15,000 for two or more
      persons
    B: $10,000 for property damage, $10,000 for one person, $20,000 for two or more
      persons
    C: $20,000 for property damage, $25,000 for one person, $50,000 for two or more
      persons
    D: $25,000 for property damage, $50,000 for one person, $100,000 for two or more
      persons
  answer: B
  explanation: According to USVI law (Title 20, Section 703), the minimum mandatory
    liability insurance is $10,000 for injury/death of one person, $20,000 for injury/death
    of two or more persons, and $10,000 for property damage.
- id: 74
  category: driver_responsibility
  question: How often must vehicles be inspected at the Bureau of Motor Vehicles (BMV)
    in the US Virgin Islands?
  choices:
    A: Every six months
    B: Every year
    C: Every two years
    D: Only when the vehicle is sold
  answer: B
  explanation: In the US Virgin Islands, all registered motor vehicles must undergo
    an annual safety inspection at the BMV to ensure they are roadworthy.
- id: 75
  category: driver_responsibility
  question: Under the US Virgin Islands 'Zero Tolerance' law, a driver under the age
    of 21 is considered to be driving under the influence if their BAC is ______ or
    higher.
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: For drivers under the age of 21, the USVI enforces a Zero Tolerance
    policy where a BAC of 0.02% or higher results in a DUI charge.
- id: 76
  category: driver_responsibility
  question: 'In the US Virgin Islands, if a driver refuses to submit to a chemical
    test for alcohol or drugs (Implied Consent), their license will be automatically
    suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months to 1 year
    D: 2 years
  answer: C
  explanation: Under the Implied Consent law, refusal to take a chemical test in the
    USVI results in an administrative license suspension, typically ranging from 6
    months to 1 year for a first offense.
- id: 77
  category: driver_responsibility
  question: Which of the following is true regarding the 'Open Container' law in the
    US Virgin Islands?
  choices:
    A: Passengers may have open containers, but the driver may not.
    B: Open containers are allowed if they are in a cup holder.
    C: It is illegal for any person to possess an open container of an alcoholic beverage
      in the passenger compartment of a motor vehicle.
    D: Open containers are only illegal on holidays.
  answer: C
  explanation: USVI law prohibits the possession of an open container of alcohol by
    the driver or any passenger within the passenger area of a motor vehicle while
    on a public highway.
- id: 78
  category: driver_responsibility
  question: In the US Virgin Islands, what is the standard fine for a first-time seatbelt
    violation for an adult?
  choices:
    A: $25
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: The fine for failing to wear a seatbelt in the US Virgin Islands is
    $100 per violation.
- id: 79
  category: driver_responsibility
  question: When a vehicle is sold in the US Virgin Islands, the seller must notify
    the BMV and the buyer must transfer the title within how many days?
  choices:
    A: 24 hours
    B: 5 days
    C: 15 days
    D: 30 days
  answer: C
  explanation: In the USVI, the transfer of vehicle ownership must be completed at
    the Bureau of Motor Vehicles within 15 days of the sale.
- id: 80
  category: driver_responsibility
  question: 'If you are caught driving a vehicle in the US Virgin Islands without
    the mandatory liability insurance, the penalty may include:'
  choices:
    A: A fine of $500 and license suspension
    B: A verbal warning for the first offense
    C: A $25 fine only
    D: Mandatory community service only
  answer: A
  explanation: Driving without insurance in the USVI is a serious offense that carries
    heavy fines (often $500 or more) and the suspension of driving privileges.
- id: 81
  category: driver_responsibility
  question: Where should the registration 'validation' sticker be placed on a vehicle
    in the US Virgin Islands?
  choices:
    A: On the front windshield, lower left corner
    B: On the rear license plate
    C: On the front license plate
    D: On the rear windshield, upper right corner
  answer: B
  explanation: In the US Virgin Islands, the registration validation sticker provided
    by the BMV must be affixed to the rear license plate to show the vehicle is currently
    registered.
- id: 82
  category: driver_responsibility
  question: 'In the US Virgin Islands, if you change the color of your vehicle or
    replace the engine, you must:'
  choices:
    A: Wait until your next annual inspection to report it
    B: Notify the BMV within 24 hours to update the registration
    C: Do nothing, as these are cosmetic or mechanical changes
    D: Notify the Police Department only
  answer: B
  explanation: Any major changes to the vehicle's description, such as a change in
    color or engine number, must be reported to the BMV within 24 hours to ensure
    the registration remains accurate.
- id: 83
  category: driver_responsibility
  question: What is the penalty for a first-offense DUI conviction in the US Virgin
    Islands regarding your driver's license?
  choices:
    A: Mandatory permanent revocation
    B: Suspension for 6 months to 1 year
    C: A warning on your driving record
    D: Suspension for exactly 30 days
  answer: B
  explanation: A first DUI conviction in the USVI typically results in a license suspension
    ranging from 6 months to 1 year, in addition to fines and potential jail time.
- id: 84
  category: driver_responsibility
  question: Which document must be kept in the vehicle at all times while operating
    on US Virgin Islands roads?
  choices:
    A: The vehicle's original Title
    B: The driver's birth certificate
    C: A valid registration certificate and proof of insurance
    D: The vehicle's bill of sale
  answer: C
  explanation: Drivers in the USVI are required to have the vehicle's current registration
    certificate and valid proof of insurance in the vehicle whenever it is being operated.
- id: 85
  category: safe_driving_rules
  question: In the US Virgin Islands, on which side of the road must you drive?
  choices:
    A: The right side
    B: The left side
    C: The center of the road
    D: Whichever side has less traffic
  answer: B
  explanation: Unique among United States jurisdictions, the US Virgin Islands requires
    all vehicles to be driven on the left side of the road.
- id: 86
  category: safe_driving_rules
  question: 'When an emergency vehicle with flashing lights and sirens is approaching
    in the US Virgin Islands, you must:'
  choices:
    A: Pull over to the right edge of the road and stop
    B: Pull over to the left edge of the road and stop
    C: Speed up to get out of the way
    D: Stop exactly where you are in the lane
  answer: B
  explanation: Because USVI traffic moves on the left, drivers must pull over to the
    left-hand edge of the road to allow emergency vehicles to pass.
- id: 87
  category: safe_driving_rules
  question: In the US Virgin Islands, it is illegal to park within how many feet of
    an intersection or corner?
  choices:
    A: 10 feet
    B: 15 feet
    C: 25 feet
    D: 50 feet
  answer: C
  explanation: To maintain visibility for all drivers, parking is prohibited within
    25 feet of an intersection or corner in the USVI.
- id: 88
  category: safe_driving_rules
  question: 'When entering a roundabout in the US Virgin Islands, you must yield to
    traffic coming from your:'
  choices:
    A: Left
    B: Right
    C: Rear
    D: Front
  answer: B
  explanation: In the USVI, traffic moves clockwise in a roundabout. You must yield
    to traffic already in the circle, which will be approaching from your right.
- id: 89
  category: safe_driving_rules
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal for a right turn in the US Virgin Islands?
  choices:
    A: Left arm extended straight out the window
    B: Left arm extended upward at a 90-degree angle
    C: Left arm extended downward
    D: Right arm extended straight out the window
  answer: B
  explanation: 'Standard hand signals are used: Left arm out for left, Left arm up
    for right, and Left arm down for stop/slow.'
- id: 90
  category: safe_driving_rules
  question: When parking uphill on a two-way street with a curb in the US Virgin Islands,
    how should you turn your front wheels?
  choices:
    A: Toward the curb (to the left)
    B: Away from the curb (to the right)
    C: Parallel to the curb
    D: It does not matter
  answer: B
  explanation: When parking uphill on the left side of the road with a curb, you turn
    your wheels to the right (away from the curb) so that if the car rolls, the back
    of the tire hits the curb.
- id: 91
  category: safe_driving_rules
  question: In the US Virgin Islands, you must dim your high-beam headlights when
    you are within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Drivers in the USVI must switch to low beams when an oncoming vehicle
    is within 500 feet to avoid blinding the other driver.
- id: 92
  category: safe_driving_rules
  question: Under US Virgin Islands law, who is required to wear a seatbelt in a moving
    motor vehicle?
  choices:
    A: Only the driver
    B: Only the driver and front-seat passenger
    C: The driver and all passengers in the front and back seats
    D: Only children under the age of 12
  answer: C
  explanation: USVI law requires the driver and all passengers (both front and back
    seats) to be properly restrained by seatbelts.
- id: 93
  category: safe_driving_rules
  question: What is the maximum speed limit for passenger vehicles outside of town
    districts (in the country) in the US Virgin Islands?
  choices:
    A: 30 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: The general speed limit for vehicles outside of town districts in the
    USVI is 35 mph unless otherwise posted.
- id: 94
  category: safe_driving_rules
  question: When driving on the left in the US Virgin Islands, on which side are you
    generally permitted to pass another vehicle?
  choices:
    A: The left side
    B: The right side
    C: The shoulder
    D: Passing is not allowed on any side
  answer: B
  explanation: Because traffic moves on the left in the USVI, passing slower vehicles
    is typically done on the right side.
- id: 95
  category: safe_driving_rules
  question: Under USVI law, what is the fine for a first-time offense of using a handheld
    mobile phone while driving?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: The Virgin Islands Code mandates a $100 fine for the first offense
    of using a handheld mobile device while operating a motor vehicle.
- id: 96
  category: safe_driving_rules
  question: When parking on a hill in the US Virgin Islands, which of the following
    is required by law?
  choices:
    A: Leave the car in neutral
    B: Turn the front wheels toward the curb or side of the road
    C: Keep the wheels perfectly straight
    D: Turn on your hazard lights
  answer: B
  explanation: When parking on a grade, you must turn your front wheels to the curb
    or side of the road so that if the vehicle moves, it will not roll into traffic.
- id: 97
  category: safe_driving_rules
  question: 'In the US Virgin Islands, seat belt use is mandatory for:'
  choices:
    A: Only the driver
    B: Only passengers under 18
    C: The driver and all front-seat passengers
    D: Only drivers on the Melvin Evans Highway
  answer: C
  explanation: USVI law requires the driver and all front-seat passengers to wear
    seat belts. Children must also be properly restrained based on age and size.
- id: 98
  category: defensive_driving
  question: In the US Virgin Islands, what is the recommended minimum following distance
    behind the vehicle in front of you under ideal driving conditions?
  choices:
    A: One car length
    B: Two seconds
    C: Four seconds
    D: 50 feet
  answer: B
  explanation: The USVI Driver's Manual recommends the 'Two-Second Rule' as a minimum
    following distance under ideal conditions to allow enough time to react to hazards.
- id: 99
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road surface
    due to water) begin in the US Virgin Islands?
  choices:
    A: As low as 35 mph
    B: Only above 55 mph
    C: At any speed over 20 mph
    D: Only during hurricane-force winds
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph in heavy rain. In
    the USVI, where tropical downpours are common, drivers are advised to reduce speed
    significantly during rain.
- id: 100
  category: defensive_driving
  question: 'When driving at night in the US Virgin Islands, you must dim your high
    beam headlights when an oncoming vehicle is within:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: To prevent blinding oncoming drivers, USVI law requires you to dim
    your high beams when an approaching vehicle is within 500 feet.
- id: 101
  category: defensive_driving
  question: 'Because vehicles in the US Virgin Islands travel on the left side of
    the road, defensive drivers should be especially cautious when:'
  choices:
    A: Turning right at an intersection
    B: Turning left at an intersection
    C: Overtaking a vehicle on a two-lane road
    D: All of the above
  answer: D
  explanation: Driving on the left requires constant vigilance, especially during
    turns and overtaking, to ensure you remain in the correct lane and account for
    the unique traffic flow of the USVI.
- id: 102
  category: defensive_driving
  question: 'In the US Virgin Islands, roads are most slippery during a rainstorm:'
  choices:
    A: After it has been raining for several hours
    B: During the first few minutes of rainfall
    C: Only when the temperature is below 60 degrees
    D: Immediately after the rain stops
  answer: B
  explanation: During the first few minutes of rain, water mixes with oil and dust
    on the road surface, creating a very slippery film. This is particularly dangerous
    on the steep, winding roads of the USVI.
- id: 103
  category: defensive_driving
  question: 'When descending a steep hill on islands like St. Thomas or St. John,
    defensive drivers should:'
  choices:
    A: Shift to a lower gear to use engine braking
    B: Keep the vehicle in neutral to save fuel
    C: Ride the brakes constantly to maintain a slow speed
    D: Turn off the engine to prevent overheating
  answer: A
  explanation: To prevent brake fade or failure on steep USVI terrain, drivers should
    shift to a lower gear, allowing the engine to help control the vehicle's speed.
- id: 104
  category: defensive_driving
  question: When scanning the road ahead for hazards in the US Virgin Islands, a defensive
    driver should look at least ______ ahead.
  choices:
    A: 5 seconds
    B: 10 to 15 seconds
    C: One city block
    D: 50 feet
  answer: B
  explanation: Scanning 10 to 15 seconds ahead allows drivers to see potential hazards
    early and plan their reactions, which is vital on the USVI's winding roads.
- id: 105
  category: defensive_driving
  question: If you are driving in heavy fog or a tropical downpour in the USVI, which
    lights should you use?
  choices:
    A: High beams
    B: Parking lights only
    C: Low beams
    D: Hazard flashers only
  answer: C
  explanation: Low beams should be used in fog or heavy rain. High beams reflect off
    the moisture and cause glare, making it harder to see.
- id: 106
  category: defensive_driving
  question: 'In the US Virgin Islands, if your vehicle begins to skid on a wet road,
    you should:'
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Ease off the gas and steer in the direction you want the front of the car to
      go
    D: Accelerate to regain traction
  answer: C
  explanation: To recover from a skid, you should take your foot off the accelerator
    and steer in the direction you want to go. Avoid braking hard as it can lock the
    wheels.
- id: 107
  category: defensive_driving
  question: 'When following a large truck or bus on a steep USVI road, you should
    increase your following distance because:'
  choices:
    A: The vehicle may roll backward slightly when starting from a stop
    B: Large vehicles have larger blind spots
    C: The vehicle may need more room to maneuver on sharp curves
    D: All of the above
  answer: D
  explanation: Defensive driving around large vehicles in the USVI requires extra
    space due to their blind spots, wide turns, and the tendency to roll back on steep
    inclines.
- id: 108
  category: defensive_driving
  question: 'When being tailgated by another driver on a narrow USVI road, the safest
    defensive action is to:'
  choices:
    A: Brake suddenly to warn them to back off
    B: Speed up to maintain a gap
    C: Slow down gradually and pull over when safe to let them pass
    D: Turn on your high beams
  answer: C
  explanation: If someone is tailgating you, do not speed up or brake suddenly. The
    safest action is to slow down and allow them to pass when there is a safe opportunity.
- id: 109
  category: defensive_driving
  question: 'In the US Virgin Islands, you must use your headlights whenever visibility
    is reduced to less than:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: One mile
  answer: B
  explanation: USVI regulations require headlights to be turned on whenever you cannot
    see clearly for a distance of 500 feet ahead due to darkness, rain, or fog.
- id: 110
  category: defensive_driving
  question: 'To check your ''blind spot'' before changing lanes in the USVI, you should:'
  choices:
    A: Look in your rearview mirror
    B: Look in your side-view mirror
    C: Turn your head and look over your shoulder
    D: Honk your horn and wait for a reaction
  answer: C
  explanation: Mirrors do not show everything. To ensure a lane is clear, you must
    turn your head and look over your shoulder to check the areas your mirrors miss.
- id: 111
  category: defensive_driving
  question: When driving on the steep, winding roads common in the US Virgin Islands,
    how far ahead should you scan the road to identify potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: Only the car directly in front of you
  answer: B
  explanation: To drive defensively, you should scan the road 10 to 15 seconds ahead.
    This allows you to see hazards, such as pedestrians or stalled vehicles on curves,
    before they become an immediate danger.
- id: 112
  category: defensive_driving
  question: Because the US Virgin Islands drives on the left, when you are approaching
    an intersection, in which direction should you look first?
  choices:
    A: To the left
    B: To the right
    C: Straight ahead
    D: Behind you
  answer: B
  explanation: When driving on the left, the first lane of traffic you cross or enter
    comes from the right. Therefore, you should look right, then left, then right
    again before proceeding.
- id: 113
  category: defensive_driving
  question: 'During a heavy tropical downpour in the USVI, your tires can lose all
    contact with the road (hydroplaning). This can begin at speeds as low as:'
  choices:
    A: 50 mph
    B: 45 mph
    C: 35 mph
    D: 20 mph
  answer: C
  explanation: Hydroplaning can begin at speeds as low as 35 mph in heavy rain. In
    the USVI, where many roads are not perfectly leveled, water can pool quickly,
    increasing this risk.
- id: 114
  category: defensive_driving
  question: If it is raining or the roads are wet in the USVI, how should you adjust
    your following distance?
  choices:
    A: Keep it the same as in dry weather
    B: Decrease it to stay close to the vehicle's taillights
    C: Double your following distance to at least four seconds
    D: Triple your following distance to at least ten seconds
  answer: C
  explanation: Wet roads in the USVI can be particularly slippery due to oil buildup
    and rain. You should double your following distance to at least four seconds to
    ensure a safe stopping distance.
- id: 115
  category: defensive_driving
  question: After driving through a deep puddle or a flooded area on a USVI roadway,
    what is the best defensive driving practice?
  choices:
    A: Speed up to spin the water off the tires
    B: Apply the brakes hard to dry them immediately
    C: Pump the brakes gently to test them and dry them out
    D: Turn off the engine and wait 10 minutes
  answer: C
  explanation: Water can make brakes less effective. You should pump your brakes lightly
    several times to generate heat and dry them out after passing through deep water.
- id: 116
  category: defensive_driving
  question: 'In the US Virgin Islands, most vehicles are left-hand drive (steering
    wheel on the left) but driven on the left side of the road. This creates a significant
    blind spot when:'
  choices:
    A: Turning left
    B: Overtaking or passing a vehicle on the right
    C: Backing into a driveway
    D: Parking on a hill
  answer: B
  explanation: Because the driver sits on the left side of the car but drives on the
    left side of the road, visibility for passing on the right (the standard passing
    side in the USVI) is limited. Drivers must be extremely cautious and check blind
    spots thoroughly.
- id: 117
  category: defensive_driving
  question: If an oncoming vehicle at night fails to dim their high beams, where should
    you look to avoid being temporarily blinded?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: Toward the left edge of your lane
    D: Close your eyes momentarily
  answer: C
  explanation: To avoid glare from oncoming high beams, you should look toward the
    left edge of your lane (since you are driving on the left) and use the shoulder
    line as a guide.
- id: 118
  category: defensive_driving
  question: If you are being tailgated on a two-lane road in the USVI, what is the
    safest defensive action to take?
  choices:
    A: Brake suddenly to scare the tailgater
    B: Speed up to increase the gap
    C: Slow down gradually and encourage the driver to pass when safe
    D: Turn on your high beams
  answer: C
  explanation: If someone is tailgating you, the safest response is to slow down gradually.
    This increases the space in front of you (so you won't have to brake suddenly)
    and encourages the other driver to pass.
- id: 119
  category: defensive_driving
  question: When descending a very steep hill in the US Virgin Islands, what should
    you do to maintain control and prevent brake failure?
  choices:
    A: Ride the brakes all the way down
    B: Shift to a lower gear
    C: Turn off the engine to save fuel
    D: Zig-zag across the road
  answer: B
  explanation: Shifting to a lower gear (engine braking) helps control your speed
    on steep descents without overheating and wearing out your brakes, which is critical
    on the mountainous terrain of the USVI.
- id: 120
  category: alcohol_drugs_health
  question: 'In the US Virgin Islands, a driver is considered legally intoxicated
    if their Blood Alcohol Content (BAC) is at or above:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: According to USVI law (Title 20, Section 493), it is unlawful for any
    person who has 0.08% or more by weight of alcohol in his or her blood to drive,
    operate, or be in actual physical control of a motor vehicle.
- id: 121
  category: alcohol_drugs_health
  question: What does the US Virgin Islands 'Implied Consent' law mean for drivers?
  choices:
    A: You agree to have your vehicle searched at any time.
    B: You agree to provide proof of insurance when asked.
    C: You agree to take a chemical test of your breath, blood, or urine if suspected
      of DUI.
    D: You agree to follow all traffic signs and signals.
  answer: C
  explanation: Implied Consent means that by operating a motor vehicle in the USVI,
    you have already given your consent to be tested for alcohol or drugs if a law
    enforcement officer has reasonable grounds to believe you are driving under the
    influence.
- id: 122
  category: alcohol_drugs_health
  question: If a driver in the US Virgin Islands refuses to submit to a chemical test
    for intoxication, what is the immediate consequence regarding their driver's license?
  choices:
    A: The license is suspended for 30 days.
    B: The license is permanently revoked.
    C: The police officer will seize the license and issue a temporary permit pending
      a hearing.
    D: There is no immediate consequence until the driver goes to court.
  answer: C
  explanation: If you refuse a chemical test in the USVI, the officer will seize your
    license immediately. You will be issued a temporary permit, and a hearing will
    be scheduled to determine the length of the suspension, which is typically 6 months
    to 1 year for a first refusal.
- id: 123
  category: alcohol_drugs_health
  question: What is the effect of mixing alcohol with other drugs, such as prescription
    medicine or illegal substances, while driving?
  choices:
    A: The effects of the alcohol are cancelled out.
    B: The effects are the same as drinking alcohol alone.
    C: The combination can multiply the effects of both, significantly increasing
      impairment.
    D: It only affects the driver if they have a pre-existing medical condition.
  answer: C
  explanation: Combining alcohol with other drugs (synergistic effect) creates a much
    higher level of impairment than either substance would alone, making driving extremely
    dangerous.
- id: 124
  category: alcohol_drugs_health
  question: 'If you are convicted of a DUI in the US Virgin Islands and it is your
    second offense within 10 years, the mandatory minimum jail time is:'
  choices:
    A: 48 hours
    B: 10 days
    C: 30 days
    D: 6 months
  answer: B
  explanation: For a second DUI conviction within a 10-year period in the USVI, the
    law mandates a minimum imprisonment of not less than 10 days.
- id: 125
  category: alcohol_drugs_health
  question: Which of the following is a potential penalty for a DUI conviction in
    the US Virgin Islands besides fines and jail time?
  choices:
    A: Mandatory attendance at an alcohol education program.
    B: Community service.
    C: Installation of an ignition interlock device.
    D: All of the above.
  answer: D
  explanation: The court in the USVI has the authority to mandate alcohol treatment
    programs, community service, and the use of ignition interlock devices as part
    of a DUI sentence.
- id: 126
  category: alcohol_drugs_health
  question: How does marijuana affect a driver in the US Virgin Islands?
  choices:
    A: It has no effect on driving ability.
    B: It improves focus and reaction time.
    C: It impairs coordination, slows reaction time, and affects distance judgment.
    D: It is legal to use while driving as long as it is for medical purposes.
  answer: C
  explanation: Marijuana impairs the skills necessary for safe driving, including
    coordination and reaction time. Driving under the influence of marijuana is illegal
    in the USVI, even for medical users.
- id: 127
  category: alcohol_drugs_health
  question: If you are taking prescription medication and it makes you feel drowsy
    or dizzy, what should you do?
  choices:
    A: Drive only on side roads and avoid the highway.
    B: Drink coffee to stay awake while driving.
    C: Do not drive until the effects of the medication have worn off.
    D: Drive faster to get to your destination sooner.
  answer: C
  explanation: It is your responsibility as a driver to know the effects of any medication
    you take. If a drug impairs your ability to drive safely, you can be charged with
    a DUI.
- id: 128
  category: alcohol_drugs_health
  question: 'In the US Virgin Islands, if a driver is convicted of DUI while a minor
    (under age 16) was a passenger in the vehicle:'
  choices:
    A: The fine is halved.
    B: The penalties are enhanced/increased.
    C: The driver's license is only suspended for 30 days.
    D: There is no additional penalty.
  answer: B
  explanation: Driving under the influence with a minor in the vehicle is considered
    an aggravating factor in the USVI and can lead to harsher sentencing and increased
    penalties.
- id: 129
  category: alcohol_drugs_health
  question: Which of these is a common sign of a driver who has been drinking alcohol?
  choices:
    A: Weaving across lane lines.
    B: Driving significantly slower than the speed limit.
    C: Quick, jerky starts and stops.
    D: All of the above.
  answer: D
  explanation: Alcohol affects judgment and motor skills, often resulting in erratic
    driving behaviors like weaving, inconsistent speeds, and poor braking/acceleration.
- id: 130
  category: alcohol_drugs_health
  question: 'The ''Implied Consent'' law in the US Virgin Islands means that by driving
    on VI roads, you have given consent to:'
  choices:
    A: A search of your vehicle's trunk at any time
    B: A chemical test of your breath, blood, or urine to determine alcohol or drug
      content
    C: Provide your fingerprints to the BMV annually
    D: Allow a police officer to drive your vehicle to a safe location
  answer: B
  explanation: Implied Consent laws mean that any person who operates a motor vehicle
    in the USVI is deemed to have given consent to a chemical test of their breath,
    blood, or urine if arrested for DUI.
- id: 131
  category: alcohol_drugs_health
  question: 'A first-time DUI conviction in the US Virgin Islands typically results
    in a mandatory driver''s license suspension of:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 2 years
  answer: C
  explanation: For a first DUI offense in the USVI, the court generally orders a mandatory
    license suspension of six months.
- id: 132
  category: alcohol_drugs_health
  question: In the US Virgin Islands, it is illegal to possess an open container of
    an alcoholic beverage in which part of the vehicle?
  choices:
    A: The trunk
    B: The passenger compartment
    C: The locked glove box
    D: Behind the last upright seat of a vehicle without a trunk
  answer: B
  explanation: The USVI Open Container law prohibits the possession of any open alcoholic
    beverage container in the passenger area of a motor vehicle while on a public
    highway.
- id: 133
  category: alcohol_drugs_health
  question: Which of the following is true regarding driving under the influence of
    prescription or over-the-counter drugs in the USVI?
  choices:
    A: It is legal as long as the drug was prescribed by a doctor
    B: It is only illegal if the drug is a narcotic
    C: It is illegal to drive if the drug renders you incapable of safe driving
    D: Over-the-counter drugs are never considered in DUI cases
  answer: C
  explanation: VI law states that driving under the influence of any drug (including
    prescription or over-the-counter medications) to a degree that renders the person
    incapable of safe driving is a crime.
- id: 134
  category: alcohol_drugs_health
  question: 'For a person operating a commercial motor vehicle in the US Virgin Islands,
    the BAC limit is:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: In accordance with federal and local regulations, the BAC limit for
    commercial drivers (CDL holders) operating a commercial vehicle is 0.04%.
- id: 135
  category: alcohol_drugs_health
  question: Which of the following is the only way to reduce your Blood Alcohol Concentration
    (BAC) before driving?
  choices:
    A: Drinking strong black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time for your body to process the alcohol
  answer: D
  explanation: Only time allows the body to metabolize alcohol. Coffee, showers, and
    exercise do not lower BAC levels.
- id: 136
  category: alcohol_drugs_health
  question: If you are taking a new prescription medication, what should you do before
    driving in the US Virgin Islands?
  choices:
    A: Drive only on side streets to test your reaction
    B: Check the label for warnings or ask your doctor/pharmacist about side effects
    C: Drink a caffeinated beverage to counteract any drowsiness
    D: Wait at least 30 minutes after taking it, then drive as usual
  answer: B
  explanation: Drivers are responsible for knowing how their medications affect them.
    You should always consult a professional or read the warning labels regarding
    operating heavy machinery or motor vehicles.
- id: 137
  category: alcohol_drugs_health
  question: 'Under US Virgin Islands law, a second DUI conviction within a ten-year
    period can result in a license revocation for up to:'
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: Permanently
  answer: C
  explanation: Repeat DUI offenders face significantly harsher penalties in the USVI,
    including a license revocation period that can extend to three years for a second
    offense.
- id: 138
  category: alcohol_drugs_health
  question: 'If a US Virgin Islands driver has a medical condition such as epilepsy
    or diabetes that may affect their ability to drive, they must:'
  choices:
    A: Stop driving immediately and surrender their license forever
    B: Notify the BMV and provide a medical report from a physician
    C: Only drive during daylight hours
    D: Keep their condition secret to avoid losing their license
  answer: B
  explanation: Drivers with medical conditions that may impair driving must disclose
    them to the Bureau of Motor Vehicles (BMV) and are often required to submit periodic
    medical evaluations to maintain driving privileges.
- id: 139
  category: penalties_and_points
  question: What is the minimum fine for a first-time conviction of driving under
    the influence (DUI) in the US Virgin Islands?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: According to USVI Title 20, Section 493, a first DUI conviction carries
    a fine of not less than $300 and not more than $1,000.
- id: 140
  category: penalties_and_points
  question: Under the US Virgin Islands BMV point system, how many points are assessed
    against your driving record for a conviction of reckless driving?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Reckless driving is considered a major violation in the USVI and results
    in 6 points being added to the driver's record.
- id: 141
  category: penalties_and_points
  question: If you are convicted of exceeding the speed limit by more than 21 miles
    per hour in the US Virgin Islands, how many points will be added to your license?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: The USVI BMV assesses 4 points for speeding violations where the driver
    exceeds the limit by 21 mph or more.
- id: 142
  category: penalties_and_points
  question: 'Under the US Virgin Islands Implied Consent Law, if you refuse to submit
    to a chemical test for alcohol or drugs, your driver''s license will be automatically
    suspended for:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Refusal to take a breath, blood, or urine test when requested by an
    officer results in an automatic 6-month license suspension for a first offense.
- id: 143
  category: penalties_and_points
  question: In the US Virgin Islands, what is the fine for a first offense of using
    a handheld mobile telephone while operating a moving motor vehicle?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: USVI law prohibits the use of handheld devices while driving; a first-time
    violation carries a $100 fine.
- id: 144
  category: penalties_and_points
  question: How many points are assessed for failing to stop for a school bus that
    is picking up or dropping off children in the US Virgin Islands?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Failing to stop for a school bus is a serious safety violation and
    carries 4 points on the USVI driving record.
- id: 145
  category: penalties_and_points
  question: Because traffic in the US Virgin Islands moves on the left, driving on
    the right side of the road is a violation. How many points is this infraction?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: C
  explanation: Driving on the wrong side of the road (the right side in the USVI)
    results in 3 points being added to your driving record.
- id: 146
  category: penalties_and_points
  question: How many points are added to your USVI driving record for failing to yield
    the right-of-way to an emergency vehicle?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: Failure to yield to an emergency vehicle (such as an ambulance or police
    car with sirens/lights) results in 3 points.
- id: 147
  category: penalties_and_points
  question: In the US Virgin Islands, what is the fine for a driver found with an
    open container of an alcoholic beverage in the passenger compartment of a vehicle?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Under USVI Title 20, Section 493g, the fine for an open container violation
    is $200.
- id: 148
  category: penalties_and_points
  question: 'Littering from a motor vehicle is illegal in the US Virgin Islands. Conviction
    of this offense can result in a fine of up to:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: The US Virgin Islands enforces strict anti-littering laws; throwing
    trash from a vehicle can result in fines reaching $1,000.
- id: 149
  category: penalties_and_points
  question: 'Under the USVI ''Implied Consent'' law, if you refuse to submit to a
    chemical test of your breath, blood, or urine when requested by an officer:'
  choices:
    A: Your license will be suspended for at least 90 days
    B: You will be fined $50 and released
    C: No action can be taken without a warrant
    D: You will only receive a warning for the first refusal
  answer: A
  explanation: By driving in the USVI, you have given consent to chemical testing.
    Refusal results in an automatic administrative license suspension, typically for
    90 days for a first refusal.
- id: 150
  category: penalties_and_points
  question: How many points are added to your USVI driving record for failing to stop
    for a school bus with its red lights flashing?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: D
  explanation: Passing a stopped school bus with flashing red lights is a major safety
    violation in the USVI and carries a penalty of 6 points.
- id: 151
  category: penalties_and_points
  question: 'In the US Virgin Islands, if you are convicted of driving without the
    required third-party liability insurance, the minimum fine is:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Driving without valid insurance in the USVI is a serious offense with
    a minimum fine of $500 and the potential for vehicle impoundment.
- id: 152
  category: penalties_and_points
  question: 'A driver in the US Virgin Islands who is convicted of ''Leaving the Scene
    of an Accident'' (Hit and Run) involving personal injury faces a license revocation
    of at least:'
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Leaving the scene of an accident involving injury is a felony in the
    USVI, and mandatory license revocation for at least one year is standard.
- id: 153
  category: penalties_and_points
  question: How many points are assessed against your USVI driver's license for a
    speeding violation of 11 to 15 miles per hour over the posted limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Speeding 11-15 mph over the limit in the USVI typically results in
    3 points on your driving record.
- id: 154
  category: penalties_and_points
  question: In the US Virgin Islands, what is the penalty for a driver who fails to
    wear a safety belt?
  choices:
    A: A fine of $25 to $100
    B: A mandatory 24-hour jail stay
    C: 3 points on the driving record
    D: License suspension for 10 days
  answer: A
  explanation: The USVI mandatory seat belt law (Title 20, Section 466) imposes a
    fine ranging from $25 to $100 for failing to wear a seat belt.
- id: 155
  category: penalties_and_points
  question: 'If a USVI driver accumulates 12 or more points within a 12-month period,
    their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: Under the USVI point system, accumulating 12 points in a year leads
    to a mandatory 90-day suspension of driving privileges.
- id: 156
  category: penalties_and_points
  question: Which of the following violations carries the highest number of points
    (6 points) in the US Virgin Islands?
  choices:
    A: Improper passing
    B: Following too closely
    C: Driving on the wrong side of the road
    D: Failure to signal
  answer: C
  explanation: Because the USVI drives on the left, driving on the right (the wrong
    side) is a major hazard and carries 6 points.
- id: 157
  category: penalties_and_points
  question: 'A USVI driver convicted of a first-offense DUI may have their driver''s
    license suspended for a period of:'
  choices:
    A: 30 to 60 days
    B: 90 days to 180 days
    C: 6 months to 1 year
    D: 2 years to 5 years
  answer: C
  explanation: For a first DUI conviction in the US Virgin Islands, the court usually
    mandates a license suspension ranging from 6 months to 1 year.
- id: 158
  category: sharing_the_road
  question: In the US Virgin Islands, when a school bus is stopped on a two-lane road
    with its red lights flashing and stop arm extended, what must a driver approaching
    from the opposite direction do?
  choices:
    A: Slow down and proceed with caution
    B: Stop at least 15 feet away from the bus
    C: Continue driving as the bus is on the other side
    D: Honk to warn the children and pass slowly
  answer: B
  explanation: According to USVI traffic laws, drivers approaching from either direction
    must stop for a school bus with flashing red lights on a two-lane road. You must
    remain stopped until the lights stop flashing.
- id: 159
  category: sharing_the_road
  question: Because traffic in the US Virgin Islands moves on the left side of the
    road, where should you pull over when an emergency vehicle with sirens and flashing
    lights approaches?
  choices:
    A: To the right-hand edge of the road
    B: To the left-hand edge of the road
    C: Stop exactly where you are in the middle of the lane
    D: Speed up to get out of the vehicle's way
  answer: B
  explanation: In the USVI, Title 20, Section 495(e) requires drivers to yield the
    right-of-way and pull to the left-hand edge or curb of the highway when an emergency
    vehicle approaches.
- id: 160
  category: sharing_the_road
  question: 'When walking along a US Virgin Islands highway that lacks sidewalks,
    pedestrians are legally required to walk:'
  choices:
    A: On the left side of the road with the flow of traffic
    B: On the right side of the road facing oncoming traffic
    C: In the center of the road for better visibility
    D: On whichever side has more shade
  answer: B
  explanation: USVI law requires pedestrians to walk on the right side of the road,
    facing oncoming traffic, when there are no sidewalks available.
- id: 161
  category: sharing_the_road
  question: In the US Virgin Islands, what is the minimum legal following distance
    you must maintain when driving behind a fire apparatus (fire truck) responding
    to an alarm?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Under USVI Title 20, Section 501, it is illegal to follow any fire
    apparatus traveling in response to a fire alarm closer than 500 feet.
- id: 162
  category: sharing_the_road
  question: 'When a pedestrian is crossing the street guided by a dog or carrying
    a white cane (with or without a red tip), USVI drivers must:'
  choices:
    A: Honk to let them know you are there
    B: Slow down and proceed if the pedestrian stops
    C: Come to a complete stop and take precautions to avoid injury
    D: Yield only if there is a marked crosswalk
  answer: C
  explanation: Drivers must take special precautions and come to a complete stop for
    blind or visually impaired pedestrians using a guide dog or white cane, regardless
    of whether a crosswalk is marked.
- id: 163
  category: sharing_the_road
  question: In the US Virgin Islands, bicyclists have the same rights and responsibilities
    as motor vehicle drivers. On which side of the road should a bicyclist ride?
  choices:
    A: The right side, facing traffic
    B: The left side, with the flow of traffic
    C: The center of the lane at all times
    D: On the sidewalk only
  answer: B
  explanation: Since USVI traffic moves on the left, bicyclists must ride on the left
    side of the road, moving in the same direction as other vehicular traffic.
- id: 164
  category: sharing_the_road
  question: When passing a bicyclist in the US Virgin Islands, what is the recommended
    safe passing distance?
  choices:
    A: At least 1 foot
    B: At least 3 feet
    C: At least 5 feet
    D: At least 10 feet
  answer: B
  explanation: The USVI Driver's Manual and safety guidelines recommend giving bicyclists
    at least 3 feet of clearance when passing to ensure their safety.
- id: 165
  category: sharing_the_road
  question: 'Large trucks have significant blind spots where a car can ''disappear''
    from the driver''s view. These areas are commonly known as:'
  choices:
    A: The Danger Zones
    B: The No-Zones
    C: The Stealth Spots
    D: The Blind Corners
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around the front, back,
    and sides of trucks and buses where the driver cannot see other vehicles.
- id: 166
  category: sharing_the_road
  question: 'If you are driving in the USVI and approach a stationary emergency vehicle
    with its lights flashing on the side of the road, you should:'
  choices:
    A: Maintain your speed and stay in your lane
    B: Slow down and, if safe to do so, move to the lane furthest from the vehicle
    C: Stop immediately to see if they need help
    D: Speed up to pass the scene as quickly as possible
  answer: B
  explanation: Safety protocols require drivers to slow down and move over when approaching
    stationary emergency vehicles to provide a safety buffer for emergency responders.
- id: 167
  category: sharing_the_road
  question: 'When a school bus is stopped on a highway with a physical median or barrier
    separating the directions of travel, drivers on the opposite side of the barrier
    must:'
  choices:
    A: Stop and wait for the bus to move
    B: Slow down to 10 mph
    C: Proceed with caution, as they are not required to stop
    D: Stop only if there are children crossing the barrier
  answer: C
  explanation: In the USVI, if a highway is divided by a physical barrier or median,
    traffic traveling in the opposite direction of a stopped school bus is generally
    not required to stop.
- id: 168
  category: sharing_the_road
  question: Motorcyclists are more vulnerable than car drivers. What is the recommended
    following distance behind a motorcycle in the USVI?
  choices:
    A: 1 second
    B: At least 2 to 4 seconds
    C: Exactly one car length
    D: 50 feet regardless of speed
  answer: B
  explanation: A following distance of 2 to 4 seconds is recommended to allow enough
    time to react if the motorcyclist swerves or brakes suddenly due to road hazards
    like potholes or gravel.
- id: 169
  category: sharing_the_road
  question: When a large truck is turning left at an intersection in the USVI, why
    should you avoid pulling up alongside its left side?
  choices:
    A: The truck may swing wide to the right before completing the left turn
    B: The truck has no mirrors on the left side
    C: Trucks are required to turn from the right lane only
    D: It is illegal to be on the left side of a truck
  answer: A
  explanation: Large vehicles often need to swing wide to the right to clear the curb
    when making a left turn (since USVI drives on the left). Pulling up beside them
    can result in a 'squeeze' accident.
- id: 170
  category: sharing_the_road
  question: 'Under USVI law, every person riding a bicycle upon a roadway at night
    must be equipped with a lamp on the front that emits a white light visible from
    a distance of at least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: For night riding, USVI regulations require a front white light visible
    from 500 feet and a rear red reflector or light.
- id: 171
  category: sharing_the_road
  question: 'When following a large commercial truck, if you cannot see the truck
    driver''s side mirrors, you are:'
  choices:
    A: In a good position to pass
    B: Following at a safe distance
    C: In the truck's rear No-Zone (blind spot)
    D: Helping the truck driver save fuel
  answer: C
  explanation: 'A general rule for sharing the road with trucks is: ''If you can''t
    see the driver in their mirrors, the driver can''t see you.'' Following too closely
    puts you in the rear No-Zone.'
- id: 172
  category: sharing_the_road
  question: In the US Virgin Islands, if there are no sidewalks, pedestrians should
    walk on which side of the road?
  choices:
    A: The left side, with the flow of traffic
    B: The right side, facing oncoming traffic
    C: The left side, facing oncoming traffic
    D: The right side, with the flow of traffic
  answer: B
  explanation: Since vehicles drive on the left in the USVI, pedestrians walking on
    the road should walk on the right side so they are facing oncoming traffic.
- id: 173
  category: sharing_the_road
  question: Under US Virgin Islands law, what is the mandatory requirement for motorcycle
    operators and passengers regarding helmets?
  choices:
    A: Only passengers are required to wear helmets
    B: Only operators under age 21 are required to wear helmets
    C: Both operators and passengers must wear a securely fastened safety helmet
    D: Helmets are optional if the speed limit is under 35 mph
  answer: C
  explanation: According to USVI Code Title 20, Section 465, no person shall operate
    or ride on a motorcycle unless they are wearing a helmet of a type approved by
    the Commissioner of Police.
- id: 174
  category: sharing_the_road
  question: 'When sharing the road with large trucks in the USVI, ''No-Zones'' refer
    to:'
  choices:
    A: Areas where trucks are not allowed to drive
    B: The blind spots around the front, back, and sides of the truck
    C: Specific parking zones for commercial vehicles
    D: The left lane of a multi-lane highway
  answer: B
  explanation: No-Zones are the large blind spots around a truck where the driver
    cannot see your vehicle. If you cannot see the truck driver's face in their side
    mirrors, they cannot see you.
- id: 175
  category: sharing_the_road
  question: 'When a bicycle is operating on a USVI roadway, they are generally required
    to:'
  choices:
    A: Ride on the right side of the road against traffic
    B: Ride on the left side of the road with the flow of traffic
    C: Ride only on sidewalks
    D: Yield to all motorized vehicles at all times
  answer: B
  explanation: In the USVI, bicycles are considered vehicles and must follow the same
    rules of the road as motor vehicles, which includes riding on the left side with
    traffic.
- id: 176
  category: sharing_the_road
  question: 'If you see a pedestrian using a white cane or a guide dog at an intersection
    in the USVI, you must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Slow down and proceed if they are not in your lane
    C: Come to a complete stop and yield the right-of-way
    D: Drive around them quickly
  answer: C
  explanation: The law requires drivers to take extra precautions and yield the right-of-way
    to blind or visually impaired pedestrians using a white cane or guide dog.
- id: 177
  category: sharing_the_road
  question: 'When following a motorcycle in the USVI, you should maintain a following
    distance of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 4 seconds
    D: 1 car length
  answer: C
  explanation: Because motorcycles can stop more quickly than cars and are more susceptible
    to road hazards like potholes or gravel (common in the VI), a 4-second following
    distance is recommended for safety.
- id: 178
  category: sharing_the_road
  question: In the US Virgin Islands, is it legal for a motorcycle to 'lane split'
    (drive between rows of stopped or moving vehicles)?
  choices:
    A: Yes, it is legal at all times
    B: Yes, but only if traffic is moving slower than 10 mph
    C: No, it is generally considered illegal and unsafe
    D: Only during emergency situations
  answer: C
  explanation: Lane splitting is not permitted in the US Virgin Islands; motorcycles
    are entitled to the full use of a lane and must follow the same lane discipline
    as other vehicles.
- id: 179
  category: sharing_the_road
  question: 'When passing a cyclist on a narrow road in the USVI, you should:'
  choices:
    A: Squeeze past them as quickly as possible
    B: Wait until it is safe to pass and leave at least three feet of clearance
    C: Honk your horn repeatedly until they move off the road
    D: Pass them on the left side of the road
  answer: B
  explanation: Drivers must exercise due care and provide sufficient clearance (generally
    accepted as at least 3 feet) when passing cyclists to prevent accidents.
- id: 180
  category: sharing_the_road
  question: 'In the USVI, if you are turning left and a motorcycle is approaching
    from the opposite direction, you should:'
  choices:
    A: Turn quickly before the motorcycle arrives
    B: Yield and wait for the motorcycle to pass
    C: Assume the motorcycle will slow down for you
    D: Flash your high beams to signal you are turning
  answer: B
  explanation: Many motorcycle accidents occur at intersections when a driver turns
    left in front of an oncoming motorcycle. You must yield the right-of-way to oncoming
    traffic, including motorcycles.
- id: 181
  category: sharing_the_road
  question: What should you do if you encounter a funeral procession on a USVI road?
  choices:
    A: Cut through the procession to reach your turn
    B: Yield the right-of-way and do not join or interfere with the procession
    C: Honk to show respect
    D: Pass the procession on the right
  answer: B
  explanation: Drivers should show respect and follow local custom and law by yielding
    to funeral processions and not breaking the line of the procession.
- id: 182
  category: sharing_the_road
  question: 'When a VITRAN bus is signaling to re-enter traffic from a designated
    bus stop in the USVI, you should:'
  choices:
    A: Speed up to pass the bus before it pulls out
    B: Yield the right-of-way to the bus if it is safe to do so
    C: Maintain your speed; the bus must wait for a gap
    D: Stop completely and wait for the bus to reach the next stop
  answer: B
  explanation: It is a safe driving practice and often a courtesy in the USVI to yield
    to public transit buses (VITRAN) when they are signaling to re-enter the flow
    of traffic.
- id: 183
  category: sharing_the_road
  question: Why is it particularly dangerous to follow a large truck too closely on
    the steep hills of St. Thomas or St. John?
  choices:
    A: The truck might roll backward slightly when starting from a stop
    B: The truck's exhaust might damage your car
    C: The truck will speed up going uphill
    D: Trucks are required to stop at every hill crest
  answer: A
  explanation: On the steep terrain of the USVI, large vehicles may roll backward
    when the driver releases the brake to engage the gears. Following too closely
    increases the risk of a collision.
- id: 184
  category: vehicle_information
  question: According to US Virgin Islands law, what is the minimum percentage of
    light transmission allowed for the front side windows of a vehicle?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: USVI law requires that window tint on the front side windows must allow
    at least 35% of light to pass through.
- id: 185
  category: vehicle_information
  question: In the US Virgin Islands, your vehicle's headlights must be turned on
    during which of the following times?
  choices:
    A: From one hour after sunset to one hour before sunrise
    B: From 7:00 PM to 6:00 AM only
    C: From sunset to sunrise
    D: Only when it is raining
  answer: C
  explanation: Standard safety regulations in the USVI require headlights to be on
    from sunset to sunrise and during periods of low visibility.
- id: 186
  category: vehicle_information
  question: 'In the US Virgin Islands, you must dim your high-beam headlights when
    following another vehicle from behind within a distance of:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 600 feet
  answer: B
  explanation: When following another vehicle, you should dim your high beams within
    300 feet to avoid reflecting glare into the lead driver's mirrors.
- id: 187
  category: vehicle_information
  question: What is the minimum legal tire tread depth for passenger vehicles in the
    US Virgin Islands?
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires are considered unsafe and will fail inspection if the tread depth
    is less than 2/32 of an inch.
- id: 188
  category: vehicle_information
  question: 'Every motor vehicle operated on US Virgin Islands highways must be equipped
    with a horn that can be heard from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: The USVI vehicle equipment code requires a horn audible from a distance
    of no less than 200 feet.
- id: 189
  category: vehicle_information
  question: Under USVI law, a vehicle's rearview mirror must allow the driver to see
    the highway for a distance of at least ______ to the rear.
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Mirrors must be adjusted to provide a clear view of the road for at
    least 200 feet behind the vehicle.
- id: 190
  category: vehicle_information
  question: What is the requirement for the rear license plate light on a vehicle
    in the US Virgin Islands?
  choices:
    A: It must be blue or green
    B: It must make the plate visible from 50 feet away
    C: It is only required if driving outside of town limits
    D: It must be white and make the plate legible from 50 feet away
  answer: D
  explanation: The rear license plate must be illuminated by a white light so that
    it is clearly legible from a distance of 50 feet.
- id: 191
  category: vehicle_information
  question: In the US Virgin Islands, a vehicle's brake lights must be visible from
    a distance of at least ______ in normal sunlight.
  choices:
    A: 50 feet
    B: 100 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Brake lights (stop lamps) must be visible from a distance of 300 feet
    during the day to ensure following drivers have time to react.
- id: 192
  category: vehicle_information
  question: Which of the following equipment is MANDATORY for all motorcycles operated
    in the US Virgin Islands?
  choices:
    A: A sidecar
    B: A windshield at least 15 inches high
    C: Protective helmet for the operator and passenger
    D: Automatic transmission
  answer: C
  explanation: USVI law requires both motorcycle operators and passengers to wear
    protective helmets at all times while the vehicle is in motion.
- id: 193
  category: vehicle_information
  question: If you are hauling a load that extends more than ______ beyond the rear
    of your vehicle in the USVI, you must attach a red flag during the day.
  choices:
    A: 2 feet
    B: 4 feet
    C: 6 feet
    D: 8 feet
  answer: B
  explanation: Any load extending more than 4 feet beyond the rear of the bed or body
    of a vehicle must be marked with a red flag (12 inches square) or a red light
    at night.
- id: 194
  category: vehicle_information
  question: In the US Virgin Islands, what is the maximum height allowed for any vehicle,
    including its load, without a special permit?
  choices:
    A: 12 feet, 6 inches
    B: 13 feet, 6 inches
    C: 14 feet
    D: 15 feet
  answer: B
  explanation: The maximum legal height for vehicles in the USVI is 13 feet 6 inches.
    Anything taller requires a special permit from the Department of Public Works.
- id: 195
  category: vehicle_information
  question: 'In the US Virgin Islands, the rear registration plate must be illuminated
    so that it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: The law requires a white light to illuminate the rear license plate,
    making it visible from a distance of 50 feet to the rear.
- id: 196
  category: vehicle_information
  question: In the US Virgin Islands, which of the following is true regarding the
    use of a muffler on your vehicle?
  choices:
    A: Mufflers are optional for vehicles under 2,000 lbs
    B: Muffler cutouts are permitted for off-road use only
    C: Every vehicle must have a muffler to prevent excessive noise and smoke
    D: Mufflers are only required for commercial trucks
  answer: C
  explanation: USVI law requires every motor vehicle to be equipped with a muffler
    in constant operation to prevent excessive or unusual noise and annoying smoke.
- id: 197
  category: vehicle_information
  question: 'Regarding the windshield of a vehicle in the US Virgin Islands, tinting
    is only permitted:'
  choices:
    A: On the entire windshield if it is 70% light transmission
    B: Nowhere; no tint is allowed on the windshield
    C: Only on the top 6 inches of the windshield
    D: Only if the driver has a medical waiver for the entire surface
  answer: C
  explanation: USVI law permits tinting only on the top six inches of the windshield,
    often referred to as the AS-1 line area.
- id: 198
  category: vehicle_information
  question: In the US Virgin Islands, every motor vehicle must be equipped with at
    least how many sets of brakes?
  choices:
    A: One (the foot brake)
    B: Two (a service brake and a parking brake)
    C: Three (front, rear, and emergency)
    D: Four (one for each wheel)
  answer: B
  explanation: 'Vehicles must have two separate means of applying brakes: a service
    brake (foot brake) and a parking brake, each of which must be effective.'
- id: 199
  category: vehicle_information
  question: In the US Virgin Islands, what color must the turn signal lights be on
    the front of a vehicle?
  choices:
    A: White or Amber
    B: Red or Amber
    C: Blue or White
    D: Green or Amber
  answer: A
  explanation: Front turn signals must be white or amber, while rear turn signals
    must be red or amber.
- id: 200
  category: vehicle_information
  question: Except for emergency vehicles, it is illegal in the US Virgin Islands
    to display which color light visible from the direct front of the vehicle?
  choices:
    A: White
    B: Amber
    C: Red
    D: Yellow
  answer: C
  explanation: USVI law prohibits the display of red lights visible from directly
    in front of the center of a non-emergency vehicle to avoid confusion with emergency
    services.
- id: 201
  category: signs_and_signals
  question: In the US Virgin Islands, where traffic moves on the left side of the
    road, what is the rule regarding turning left at a red light?
  choices:
    A: It is always prohibited.
    B: It is permitted after a complete stop, yielding to traffic and pedestrians,
      unless a sign prohibits it.
    C: It is only permitted between the hours of 12:00 AM and 5:00 AM.
    D: It is permitted only if you are in a high-occupancy vehicle (HOV).
  answer: B
  explanation: In the US Virgin Islands, drivers may turn left on a red light after
    coming to a complete stop and yielding to all other traffic and pedestrians, provided
    there is no sign prohibiting the turn. This is the left-hand traffic equivalent
    of the 'right on red' rule in the mainland US.
- id: 202
  category: signs_and_signals
  question: When using hand signals in the US Virgin Islands, which signal indicates
    that you intend to stop or suddenly decrease speed?
  choices:
    A: Left arm extended straight out the window.
    B: Left arm extended upward.
    C: Left arm extended downward with the palm facing the rear.
    D: Right arm extended straight out the window.
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, the driver
    should extend their left arm out the window and point it downward with the palm
    facing the rear.
- id: 203
  category: signs_and_signals
  question: Which hand signal is the correct way to indicate a right turn in the US
    Virgin Islands?
  choices:
    A: Left arm extended straight out.
    B: Left arm extended upward at a 90-degree angle.
    C: Left arm extended downward.
    D: Right arm waved in a circular motion.
  answer: B
  explanation: Even though USVI drives on the left, vehicles are typically left-hand
    drive. To signal a right turn, the driver extends the left arm out the window
    and bends it upward at a 90-degree angle.
- id: 204
  category: signs_and_signals
  question: In the US Virgin Islands, what does a solid yellow line on your side of
    the center of the road indicate?
  choices:
    A: You may pass other vehicles at any time.
    B: You are in a one-way zone.
    C: Passing is prohibited on your side of the road.
    D: You must stop and wait for a green light.
  answer: C
  explanation: A solid yellow line on your side of the road indicates a 'no-passing
    zone.' You are not permitted to cross this line to pass other vehicles.
- id: 205
  category: signs_and_signals
  question: When approaching a roundabout in the US Virgin Islands, in which direction
    must traffic flow?
  choices:
    A: Counter-clockwise
    B: Clockwise
    C: Whichever direction has less traffic
    D: Traffic may flow in either direction
  answer: B
  explanation: Because the US Virgin Islands follows the rule of driving on the left
    side of the road, traffic enters and moves through roundabouts in a clockwise
    direction.
- id: 206
  category: signs_and_signals
  question: What does a flashing red traffic light mean at an intersection in the
    US Virgin Islands?
  choices:
    A: Slow down and proceed with caution.
    B: The light is about to turn green.
    C: Stop completely and proceed only when it is safe to do so, treating it like
      a stop sign.
    D: Yield to traffic coming from the right only.
  answer: C
  explanation: A flashing red light has the same meaning as a stop sign. You must
    come to a complete stop and proceed only when the way is clear.
- id: 207
  category: signs_and_signals
  question: 'A flashing yellow light at an intersection means you should:'
  choices:
    A: Stop and wait for the light to turn green.
    B: Speed up to clear the intersection quickly.
    C: Slow down and proceed with caution.
    D: Stop and yield to all pedestrians before proceeding.
  answer: C
  explanation: A flashing yellow light is a warning to slow down and be especially
    alert as you proceed through the intersection.
- id: 208
  category: signs_and_signals
  question: What do broken white lines painted on the pavement indicate?
  choices:
    A: Traffic is moving in opposite directions.
    B: Traffic is moving in the same direction, and lane changes are permitted.
    C: The edge of the roadway.
    D: A pedestrian crossing zone.
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    Drivers may cross these lines to change lanes when it is safe to do so.
- id: 209
  category: signs_and_signals
  question: Which sign shape is used exclusively for 'Yield' signs in the US Virgin
    Islands?
  choices:
    A: Octagon
    B: Diamond
    C: Inverted Triangle
    D: Pennant
  answer: C
  explanation: The 'Yield' sign is always an equilateral triangle pointing downward
    (inverted triangle), usually red and white.
- id: 210
  category: signs_and_signals
  question: A diamond-shaped sign with a yellow background is what type of sign?
  choices:
    A: Regulatory sign
    B: Warning sign
    C: Guide sign
    D: Service sign
  answer: B
  explanation: Yellow diamond-shaped signs are warning signs that alert drivers to
    potential hazards or changes in road conditions ahead.
- id: 211
  category: signs_and_signals
  question: What color are signs used to indicate construction or maintenance work
    zones?
  choices:
    A: Yellow
    B: Green
    C: Orange
    D: Blue
  answer: C
  explanation: Orange is the standard color for construction and maintenance signs
    to alert drivers to work zones and the presence of workers.
- id: 212
  category: signs_and_signals
  question: 'A pennant-shaped sign (sideways triangle) placed on the right side of
    a two-way road in the USVI indicates:'
  choices:
    A: A school zone.
    B: A no-passing zone.
    C: A sharp curve ahead.
    D: A railroad crossing.
  answer: B
  explanation: The pennant-shaped sign is used specifically to mark the beginning
    of a no-passing zone.
- id: 213
  category: signs_and_signals
  question: When a traffic signal is dark (not working due to a power outage), how
    should you treat the intersection?
  choices:
    A: Yield to the largest vehicle.
    B: Maintain speed and proceed with caution.
    C: Treat it as a four-way stop.
    D: Wait for a police officer to arrive before moving.
  answer: C
  explanation: If a traffic signal is not functioning, drivers must treat the intersection
    as an all-way stop, yielding the right-of-way to vehicles that arrived first or
    to the vehicle on the right if arriving at the same time.
- id: 214
  category: signs_and_signals
  question: When signaling a turn using hand signals in the USVI, what does it mean
    when the driver's left arm is extended straight out the window?
  choices:
    A: The driver is signaling a right turn
    B: The driver is signaling a left turn
    C: The driver is slowing down
    D: The driver is stopping
  answer: B
  explanation: Even though USVI drivers drive on the left, they use standard hand
    signals. An arm extended straight out indicates a left turn.
- id: 215
  category: signs_and_signals
  question: 'To signal a right turn using hand signals in the US Virgin Islands, the
    driver should:'
  choices:
    A: Extend the left arm straight out
    B: Extend the left arm upward
    C: Extend the left arm downward
    D: Extend the right arm straight out
  answer: B
  explanation: The hand signal for a right turn is the left arm extended upward at
    a 90-degree angle.
- id: 216
  category: signs_and_signals
  question: What is the correct hand signal to indicate that you are stopping or slowing
    down in the USVI?
  choices:
    A: Left arm extended upward
    B: Left arm extended straight out
    C: Left arm extended downward, palm facing backward
    D: Waving the left arm in a circular motion
  answer: C
  explanation: To signal stopping or slowing down, the left arm should be extended
    downward with the palm facing the rear.
- id: 217
  category: signs_and_signals
  question: 'In the USVI, a broken white line painted on the pavement indicates:'
  choices:
    A: Traffic moving in opposite directions
    B: A no-passing zone
    C: The edge of the roadway
    D: Traffic moving in the same direction, and lane changes are permitted
  answer: D
  explanation: White lines separate lanes of traffic moving in the same direction.
    A broken white line means you may cross it to change lanes if it is safe.
- id: 218
  category: signs_and_signals
  question: In the US Virgin Islands, what color are regulatory signs that provide
    information about laws and regulations (such as Speed Limit signs)?
  choices:
    A: Yellow with black lettering
    B: Orange with black lettering
    C: White with black or red lettering
    D: Green with white lettering
  answer: C
  explanation: Regulatory signs, which tell you what you must or must not do, are
    typically rectangular and white with black or red lettering.
- id: 219
  category: signs_and_signals
  question: When a traffic signal is showing a steady red light in the USVI, are you
    permitted to make a left turn?
  choices:
    A: Yes, after stopping and yielding to traffic
    B: No, you must wait for a green light or arrow
    C: Only if you are turning from a one-way street onto another one-way street
    D: Only during daylight hours
  answer: B
  explanation: In the US Virgin Islands, you must remain stopped at a red light. Unlike
    many US mainland states that allow right turns on red, the USVI generally prohibits
    turning on red (which would be a left turn there) unless a sign specifically permits
    it.
- id: 220
  category: signs_and_signals
  question: What is the meaning of a double solid yellow line in the center of the
    road in the USVI?
  choices:
    A: Passing is permitted from either direction
    B: Passing is permitted only from your side
    C: Passing is prohibited from either direction
    D: The road is a one-way street
  answer: C
  explanation: Double solid yellow lines indicate that passing is not allowed for
    traffic in either direction.
