questions:
- id: 1
  category: license_system
  question: ¿Cuál es la edad mínima para solicitar un permiso de aprendizaje en las
    Islas Vírgenes de los EE. UU.?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: Según el Negociado de Vehículos de Motor (BMV) de las Islas Vírgenes
    de los EE. UU., un solicitante debe tener al menos 16 años de edad para ser elegible
    para un permiso de aprendizaje.
- id: 2
  category: license_system
  question: Los nuevos residentes de las Islas Vírgenes de los EE. UU. que posean
    una licencia de conducir válida de otra jurisdicción de los EE. UU. deben solicitar
    una licencia de las Islas Vírgenes dentro de ¿cuántos días después de su llegada?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: Bajo la ley de las Islas Vírgenes de los EE. UU., los nuevos residentes
    tienen 90 días para transferir su licencia de otro estado a una licencia de conducir
    de las Islas Vírgenes de los EE. UU.
- id: 3
  category: license_system
  question: Mientras se conduce con un permiso de aprendizaje en las Islas Vírgenes
    de los EE. UU., el conductor supervisor debe cumplir con ¿cuál de los siguientes
    requisitos?
  choices:
    A: Debe tener al menos 18 años y poseer una licencia válida
    B: Debe tener al menos 21 años y haber tenido una licencia válida durante al menos
      un año
    C: Debe ser únicamente el padre o tutor legal
    D: Debe tener al menos 25 años
  answer: B
  explanation: El titular de un permiso de aprendizaje debe estar acompañado por un
    conductor con licencia que tenga al menos 21 años de edad y haya tenido licencia
    durante al menos un año, sentado en el asiento del pasajero delantero.
- id: 4
  category: license_system
  question: Bajo el programa de Licencia de Conducir Graduada (GDL) de las Islas Vírgenes
    de los EE. UU., un titular de licencia intermedia (menor de 18 años) tiene restringido
    conducir durante ¿qué horas, a menos que esté acompañado por un padre o tutor?
  choices:
    A: De medianoche a 5:00 AM
    B: De 11:00 PM a 6:00 AM
    C: De 10:00 PM a 6:00 AM
    D: De 9:00 PM a 5:00 AM
  answer: C
  explanation: El programa GDL de las Islas Vírgenes de los EE. UU. restringe a los
    titulares de licencias intermedias de conducir entre las 10:00 PM y las 6:00 AM,
    a menos que estén con un padre o tutor con licencia.
- id: 5
  category: license_system
  question: Una licencia de conducir estándar de las Islas Vírgenes de los EE. UU.
    suele ser válida por ¿cuántos años antes de que deba renovarse?
  choices:
    A: 2 años
    B: 4 años
    C: 5 años
    D: 8 años
  answer: C
  explanation: En las Islas Vírgenes de los EE. UU., una licencia de operador estándar
    se emite generalmente por un período de 5 años.
- id: 6
  category: license_system
  question: 'Si cambia su dirección dentro de las Islas Vírgenes de los EE. UU., debe
    notificar al Negociado de Vehículos de Motor (BMV) dentro de:'
  choices:
    A: 10 días
    B: 30 días
    C: 45 días
    D: 60 días
  answer: A
  explanation: La ley de las Islas Vírgenes de los EE. UU. exige que los conductores
    notifiquen al BMV cualquier cambio de dirección dentro de los 10 días posteriores
    a la mudanza.
- id: 7
  category: license_system
  question: 'Para aprobar el examen de la vista para una licencia de conducir de las
    Islas Vírgenes de los EE. UU., su agudeza visual debe ser de al menos:'
  choices:
    A: 20/20
    B: 20/40
    C: 20/50
    D: 20/70
  answer: B
  explanation: El requisito mínimo de visión para obtener una licencia de conducir
    en las Islas Vírgenes de los EE. UU. es 20/40 en al menos un ojo, con o sin lentes
    correctivos.
- id: 8
  category: license_system
  question: ¿Cuánto tiempo debe un conductor joven mantener un permiso de aprendizaje
    en las Islas Vírgenes de los EE. UU. antes de ser elegible para realizar el examen
    de habilidades viales?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: Según los requisitos de la GDL de las Islas Vírgenes de los EE. UU.,
    el titular de un permiso debe mantener un historial de conducción limpio durante
    al menos 6 meses antes de solicitar el examen práctico.
- id: 9
  category: license_system
  question: En las Islas Vírgenes de los EE. UU., su licencia de conducir puede ser
    suspendida si acumula ¿cuántos puntos en un período de 12 meses?
  choices:
    A: 6 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: C
  explanation: El sistema de puntos del BMV de las Islas Vírgenes de los EE. UU. exige
    la suspensión de la licencia si un conductor acumula 12 o más puntos en un período
    de 12 meses.
- id: 10
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como prueba principal
    de identidad al solicitar una licencia de conducir de las Islas Vírgenes de los
    EE. UU. que cumpla con la ley REAL ID?
  choices:
    A: Un pasaporte de EE. UU. válido
    B: Un acta de nacimiento original de EE. UU.
    C: Una tarjeta de Seguro Social
    D: Un certificado de naturalización
  answer: C
  explanation: Aunque se requiere una tarjeta de Seguro Social para la verificación
    del número de seguro social (SSN), no se considera un documento de 'Identidad'
    principal (como un pasaporte o acta de nacimiento) para los propósitos de la REAL
    ID en las Islas Vírgenes de los EE. UU.
- id: 11
  category: license_system
  question: ¿Por cuánto tiempo es válido un permiso de aprendizaje de las Islas Vírgenes
    de los EE. UU. a partir de la fecha de emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: B
  explanation: Un permiso de aprendizaje en las Islas Vírgenes de los EE. UU. es válido
    por un año. Si vence, el solicitante debe volver a tomar el examen escrito.
- id: 12
  category: license_system
  question: Durante la etapa intermedia del sistema de licencia graduada (GDL) de
    las Islas Vírgenes de los EE. UU., ¿cuántos pasajeros que no sean familiares menores
    de 21 años se permiten en el vehículo sin supervisión de un adulto?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Los titulares de licencias intermedias en las Islas Vírgenes de los
    EE. UU. están limitados a transportar no más de un pasajero que no sea familiar
    menor de 21 años, a menos que estén acompañados por un adulto con licencia.
- id: 13
  category: license_system
  question: Si una licencia de conducir en las Islas Vírgenes de los EE. UU. ha estado
    vencida por más de ______, el solicitante debe volver a tomar tanto el examen
    escrito como el de conducción.
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 3 años
  answer: B
  explanation: Si una licencia de las Islas Vírgenes de los EE. UU. está vencida por
    más de un año, el BMV requiere que la persona comience el proceso de solicitud
    de nuevo, incluyendo todas las pruebas.
- id: 14
  category: license_system
  question: 'Al realizar el examen de habilidades de conducción en las Islas Vírgenes
    de los EE. UU., el solicitante debe proporcionar un vehículo que:'
  choices:
    A: Sea proporcionado únicamente por el BMV
    B: Esté asegurado, registrado y en condiciones seguras de funcionamiento
    C: Tenga únicamente transmisión automática
    D: Tenga menos de 5 años de antigüedad
  answer: B
  explanation: Los solicitantes deben proporcionar su propio vehículo para el examen
    de conducción, y este debe tener una calcomanía de registro válida, seguro vigente
    y pasar una inspección de seguridad básica realizada por el examinador.
- id: 15
  category: license_system
  question: En las Islas Vírgenes de los EE. UU., la ley exige que los solicitantes
    masculinos de entre 18 y 25 años estén registrados en ¿cuál de los siguientes
    organismos al solicitar una licencia de conducir?
  choices:
    A: La Guardia Nacional de las Islas Vírgenes de los EE. UU.
    B: El Sistema de Servicio Selectivo
    C: La Oficina de Rentas Internas
    D: El Departamento de Trabajo de las Islas Vírgenes de los EE. UU.
  answer: B
  explanation: Según la ley de las Islas Vírgenes de los EE. UU. y los requisitos
    federales, los ciudadanos o inmigrantes varones de 18 a 25 años deben estar registrados
    en el Sistema de Servicio Selectivo para ser elegibles para una licencia de conducir.
- id: 16
  category: license_system
  question: Para que se coloque la designación de 'Veterano' en una licencia de conducir
    de las Islas Vírgenes de los EE. UU., ¿qué documento debe presentar el solicitante
    al BMV?
  choices:
    A: Una carta del Gobernador
    B: Solo una tarjeta de identificación militar válida
    C: Formulario DD-214 (Certificado de Liberación o Licenciamiento del Servicio
      Activo)
    D: Una declaración jurada firmada de un puesto local de VFW
  answer: C
  explanation: Los solicitantes deben proporcionar el formulario DD-214 que muestre
    un licenciamiento honorable para que se agregue la designación de Veterano a su
    licencia de conducir de las Islas Vírgenes de los EE. UU.
- id: 17
  category: license_system
  question: 'Una licencia de operador estándar Clase D de las Islas Vírgenes de los
    EE. UU. le permite conducir un vehículo con una Clasificación de Peso Bruto Vehicular
    (GVWR) de hasta:'
  choices:
    A: 10,000 lbs
    B: 15,000 lbs
    C: 26,000 lbs
    D: 32,000 lbs
  answer: C
  explanation: Una licencia Clase D en las Islas Vírgenes de los EE. UU. es para operar
    cualquier vehículo sencillo con un GVWR de 26,000 libras o menos, siempre que
    no se utilice para fines comerciales que requieran una CDL.
- id: 18
  category: license_system
  question: En las Islas Vírgenes de los EE. UU., los conductores que tengan ____
    años de edad o más deben proporcionar un certificado médico de un médico con licencia
    para renovar su licencia de conducir.
  choices:
    A: '60'
    B: '65'
    C: '70'
    D: '75'
  answer: C
  explanation: Según las regulaciones del BMV de las Islas Vírgenes de los EE. UU.,
    los conductores de 70 años o más deben presentar un certificado de aptitud médica
    al renovar sus privilegios de conducción.
- id: 19
  category: license_system
  question: Si pierde o le roban su licencia de conducir de las Islas Vírgenes de
    los EE. UU., ¿qué documento debe obtener primero antes de que el BMV emita un
    duplicado?
  choices:
    A: Una carta de su compañía de seguros
    B: Un informe policial del Departamento de Policía de las Islas Vírgenes
    C: Un acta de nacimiento nueva
    D: Una carta notariada de su empleador
  answer: B
  explanation: Para reemplazar una licencia perdida o robada en las Islas Vírgenes
    de los EE. UU., el solicitante generalmente debe presentar un informe policial
    que documente la pérdida o el robo ante el BMV.
- id: 20
  category: license_system
  question: Al solicitar una licencia de las Islas Vírgenes de los EE. UU., puede
    optar por ser donante de órganos. ¿A qué edad puede una persona realizar legalmente
    esta elección en su licencia sin el consentimiento de los padres?
  choices:
    A: '16'
    B: '17'
    C: '18'
    D: '21'
  answer: C
  explanation: En las Islas Vírgenes de los EE. UU., las personas de 18 años de edad
    o más pueden elegir legalmente ser donantes de órganos en su licencia de conducir.
- id: 21
  category: license_system
  question: ¿Por cuántos días puede conducir legalmente en el territorio una persona
    que visita las Islas Vírgenes de los EE. UU. con una licencia de conducir extranjera
    válida?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 180 días
  answer: C
  explanation: A los turistas o visitantes con una licencia de conducir extranjera
    válida se les permite conducir en las Islas Vírgenes de los EE. UU. por un período
    que no exceda los 90 días.
- id: 22
  category: license_system
  question: Bajo el sistema de puntos de las Islas Vírgenes de los EE. UU., ¿una condena
    por 'Conducción Temeraria' (Reckless Driving) resultará en cuántos puntos añadidos
    a su historial de manejo?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción grave en las Islas
    Vírgenes de los EE. UU. y, por lo general, resulta en la asignación de 6 puntos
    en el historial del conductor.
- id: 23
  category: license_system
  question: 'Para los conductores menores de 21 años en las Islas Vírgenes de los
    EE. UU., la ley de ''Tolerancia Cero'' (Zero Tolerance) establece el límite máximo
    legal de concentración de alcohol en sangre (BAC) en:'
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Las Islas Vírgenes de los EE. UU. aplican una ley de Tolerancia Cero
    para menores, donde un BAC de 0.02% o superior resulta en la suspensión inmediata
    de la licencia para conductores menores de 21 años.
- id: 24
  category: license_system
  question: 'En las Islas Vírgenes de los EE. UU., cuando un padre o tutor firma la
    solicitud de licencia para un menor, también está aceptando:'
  choices:
    A: La responsabilidad del mantenimiento del vehículo
    B: La responsabilidad financiera por cualquier negligencia o mala conducta intencionada
      del menor al conducir
    C: El requisito de viajar con el menor en todo momento hasta los 21 años
    D: El pago de todas las futuras multas de tráfico del menor
  answer: B
  explanation: Al firmar la solicitud de un menor, el padre o tutor asume la responsabilidad
    solidaria por cualquier daño causado por la negligencia o mala conducta del menor
    al operar un vehículo motorizado.
- id: 25
  category: license_system
  question: 'Si cambia legalmente su nombre (por ejemplo, por matrimonio o por orden
    judicial), debe notificar al BMV de las Islas Vírgenes de los EE. UU. y obtener
    una licencia corregida en un plazo de:'
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: A
  explanation: Al igual que un cambio de dirección, un cambio de nombre debe informarse
    al BMV dentro de los 10 días para garantizar que los registros del conductor sigan
    siendo precisos.
- id: 26
  category: license_system
  question: ¿Qué servicio está obligado a proporcionar el BMV de las Islas Vírgenes
    de los EE. UU. por la ley 'Motor Voter' durante una solicitud de licencia de conducir?
  choices:
    A: Fotos de pasaporte gratuitas
    B: Oportunidades de registro de votantes
    C: Procesamiento de pagos de impuestos sobre la propiedad
    D: Formularios de exención de servicio de jurado
  answer: B
  explanation: La Ley Nacional de Registro de Votantes (Motor Voter) requiere que
    el BMV ofrezca a los solicitantes la oportunidad de registrarse para votar mientras
    solicitan o renuevan una licencia de conducir.
- id: 27
  category: license_system
  question: Para operar una motocicleta o un ciclo impulsado por motor en las Islas
    Vírgenes de los EE. UU., ¿qué clasificación específica debe tener en su licencia?
  choices:
    A: Clase A
    B: Clase C
    C: Clase M
    D: Clase E
  answer: C
  explanation: Se requiere específicamente una licencia o endoso de Clase M para operar
    legalmente motocicletas en las vías públicas de las Islas Vírgenes de los EE.
    UU.
- id: 28
  category: license_system
  question: ¿Por cuál de las siguientes razones no relacionadas con la conducción
    se puede suspender una licencia de conducir de las Islas Vírgenes de los EE. UU.?
  choices:
    A: Incumplimiento del pago de la manutención de los hijos (child support)
    B: Falta de pago de impuestos sobre la propiedad
    C: No graduarse de la escuela secundaria
    D: No tener una tarjeta de biblioteca válida
  answer: A
  explanation: En las Islas Vírgenes de los EE. UU., como en muchas jurisdicciones
    de los EE. UU., el incumplimiento de las órdenes de manutención de los hijos puede
    llevar a la suspensión de la licencia de conducir.
- id: 29
  category: license_system
  question: Si su licencia de conducir de las Islas Vírgenes de los EE. UU. ha sido
    suspendida, ¿qué debe hacer para recuperar sus privilegios de conducción después
    de que termine el período de suspensión?
  choices:
    A: Esperar 30 días adicionales
    B: Pagar una tarifa de reinstalación y cumplir con cualquier otro requisito ordenado
      por el tribunal
    C: Simplemente comenzar a conducir de nuevo; la licencia es automáticamente válida
    D: Solicitar un permiso de aprendizaje completamente nuevo
  answer: B
  explanation: Para reinstalar una licencia suspendida en las Islas Vírgenes de los
    EE. UU., el conductor debe pagar una tarifa de reinstalación al BMV y presentar
    pruebas de que se han cumplido todas las condiciones de la suspensión (como los
    requisitos judiciales).
- id: 30
  category: driver_testing
  question: Al proporcionar un vehículo para el examen de habilidades viales de las
    Islas Vírgenes de los EE. UU., ¿dónde debe estar ubicado el freno de estacionamiento
    (freno de emergencia)?
  choices:
    A: A la izquierda de los pies del conductor
    B: En el tablero de instrumentos
    C: En el área de la consola central, accesible para el examinador
    D: En cualquier lugar, siempre que sea funcional
  answer: C
  explanation: Por razones de seguridad durante el examen vial, el Negociado de Vehículos
    de Motor (BMV) de las Islas Vírgenes de los EE. UU. requiere que el vehículo tenga
    un freno de estacionamiento montado en el centro que el examinador pueda alcanzar
    en caso de emergencia.
- id: 31
  category: driver_testing
  question: 'Para aprobar el examen de conocimientos escritos de las Islas Vírgenes
    de los EE. UU., un solicitante debe obtener una puntuación mínima de:'
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 90%
  answer: C
  explanation: El examen escrito de las USVI requiere una puntuación de aprobación
    del 80%, lo que significa que el solicitante debe responder correctamente al menos
    40 de las 50 preguntas.
- id: 32
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en una reprobación inmediata
    durante la prueba de habilidades viales de las Islas Vírgenes de los EE. UU.?
  choices:
    A: Ajustar los espejos antes de arrancar
    B: Chocar contra un bordillo o acera
    C: Usar la luz de giro demasiado pronto
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: B
  explanation: Chocar contra un bordillo, acera o cualquier objeto durante la prueba
    de manejo se considera una acción peligrosa o falta de control y resulta en una
    reprobación inmediata.
- id: 33
  category: driver_testing
  question: Si un solicitante reprueba el examen de conocimientos escritos de las
    Islas Vírgenes de los EE. UU., ¿cuál es el período de espera mínimo antes de que
    pueda intentar el examen nuevamente?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 30 días
  answer: C
  explanation: De acuerdo con las pautas del BMV, los solicitantes que reprueban el
    examen escrito generalmente deben esperar al menos 7 días antes de volver a realizar
    la prueba.
- id: 34
  category: driver_testing
  question: Durante la prueba de habilidades viales de las Islas Vírgenes de los EE.
    UU., ¿quién tiene permitido estar en el vehículo además del solicitante y el examinador
    del BMV?
  choices:
    A: El instructor de manejo del solicitante
    B: Un padre o tutor legal
    C: No se permite a nadie más
    D: Un traductor si el solicitante no habla inglés
  answer: C
  explanation: Para garantizar un entorno objetivo y sin distracciones, solo el solicitante
    y el examinador autorizado del BMV pueden estar en el vehículo durante la prueba
    de manejo.
- id: 35
  category: driver_testing
  question: Antes de que comience la prueba de habilidades viales en las USVI, ¿qué
    verificará el examinador en el vehículo?
  choices:
    A: Un registro válido y una calcomanía de inspección vigente
    B: Un tanque lleno de gasolina
    C: La presencia de una llanta de repuesto
    D: Los registros del historial de servicio del vehículo
  answer: A
  explanation: El vehículo utilizado para la prueba de manejo debe ser legal para
    circular, lo que incluye tener un registro válido, comprobante de seguro y una
    calcomanía de inspección de las USVI vigente.
- id: 36
  category: driver_testing
  question: Si necesita lentes correctores para aprobar el examen de la vista de las
    USVI, ¿qué código de restricción se colocará en su licencia de conducir?
  choices:
    A: Restricción A
    B: Restricción B
    C: Restricción C
    D: Restricción Z
  answer: A
  explanation: En las Islas Vírgenes de los EE. UU., la 'Restricción A' en una licencia
    de conducir indica que el conductor debe usar lentes correctores mientras opera
    un vehículo motorizado.
- id: 37
  category: driver_testing
  question: ¿Qué maniobra específica es una parte obligatoria de la prueba de habilidades
    viales de las Islas Vírgenes de los EE. UU. para demostrar el control del vehículo
    en espacios reducidos?
  choices:
    A: Una incorporación a alta velocidad
    B: Un giro de tres puntos
    C: Conducir en reversa durante una milla
    D: Recuperación fuera de la carretera
  answer: B
  explanation: El giro de tres puntos (o giro en K) es un requisito estándar de la
    prueba de manejo de las USVI para asegurar que el conductor pueda dar la vuelta
    al vehículo de manera segura en un espacio estrecho.
- id: 38
  category: driver_testing
  question: 'Durante la prueba de manejo, si las luces de giro del vehículo no son
    claramente visibles debido a la luz solar intensa, el examinador puede pedirle
    al solicitante que demuestre:'
  choices:
    A: El uso de las luces de emergencia
    B: Señales manuales
    C: El uso de la bocina para señalar los giros
    D: Parpadear las luces altas
  answer: B
  explanation: Los solicitantes deben estar preparados para demostrar las señales
    manuales estándar (giro a la izquierda, giro a la derecha y detenerse/disminuir
    velocidad) durante la prueba de manejo si se les solicita o si el equipo falla.
- id: 39
  category: driver_testing
  question: En las Islas Vírgenes de los EE. UU., ¿en qué dos idiomas se ofrece principalmente
    el examen de conocimientos escritos?
  choices:
    A: Inglés y francés
    B: Inglés y español
    C: Inglés y holandés
    D: Inglés y criollo
  answer: B
  explanation: La Oficina de Vehículos Motorizados (BMV) de las USVI ofrece el examen
    de conocimientos para la licencia de conducir tanto en inglés como en español.
- id: 40
  category: driver_testing
  question: Al realizar la prueba de manejo en las USVI, ¿cuál es la política con
    respecto al uso de un auto de alquiler?
  choices:
    A: Nunca se permiten autos de alquiler para las pruebas de manejo
    B: Se permiten autos de alquiler solo si el examinador lo conduce primero
    C: Se permiten autos de alquiler solo si el solicitante figura como conductor
      en el contrato de alquiler y presenta un comprobante de seguro
    D: Se permiten autos de alquiler sin ninguna documentación adicional
  answer: C
  explanation: Un solicitante puede usar un auto de alquiler para la prueba de manejo,
    pero debe ser un conductor autorizado en el contrato de alquiler y proporcionar
    los documentos de seguro correspondientes para ese vehículo.
- id: 41
  category: driver_testing
  question: ¿Cuál es el requisito de agudeza visual para que un solicitante apruebe
    el examen de la vista de las USVI sin una restricción de 'solo luz de día'?
  choices:
    A: 20/20 en ambos ojos
    B: 20/40 en al menos un ojo
    C: 20/70 en ambos ojos
    D: 20/100 en al menos un ojo
  answer: B
  explanation: El estándar de las USVI para una licencia de conducir regular es una
    agudeza visual de 20/40 en al menos un ojo, con o sin lentes correctivos.
- id: 42
  category: driver_testing
  question: ¿Cuál de los siguientes es un componente central del examen escrito de
    las USVI con respecto a la orientación del tráfico?
  choices:
    A: Conocimiento sobre conducir por el lado derecho de la carretera
    B: Conocimiento sobre conducir por el lado izquierdo de la carretera
    C: Conocimiento de las señales marítimas internacionales
    D: Conocimiento de paradas de cuatro vías únicamente
  answer: B
  explanation: Debido a que las Islas Vírgenes de los EE. UU. son la única jurisdicción
    estadounidense donde el tráfico circula por la izquierda, el conocimiento de las
    reglas de conducción por el lado izquierdo es una parte crítica de los exámenes
    escritos y prácticos.
- id: 43
  category: driver_testing
  question: ¿Qué documento debe presentar un solicitante de un examen práctico de
    manejo de las USVI al examinador antes de que comience la prueba?
  choices:
    A: Un permiso de aprendizaje válido de las USVI
    B: Un diploma de escuela secundaria
    C: Una tarjeta de seguro social
    D: Una factura de servicios públicos de los últimos 30 días
  answer: A
  explanation: No se puede realizar el examen de habilidades prácticas de manejo sin
    presentar un permiso de aprendizaje original y válido de las USVI al examinador.
- id: 44
  category: driver_testing
  question: 'Durante el examen práctico de las USVI, si se aproxima a una luz roja
    y tiene la intención de girar a la izquierda, debe demostrar conocimiento de que:'
  choices:
    A: Los giros a la izquierda en rojo nunca están permitidos
    B: Los giros a la izquierda en rojo están permitidos después de una parada completa,
      a menos que una señal lo prohíba
    C: Debe esperar únicamente a una flecha verde
    D: Solo necesita reducir la velocidad, no detenerse, antes de girar a la izquierda
  answer: B
  explanation: En las USVI (donde se conduce por la izquierda), se permite un giro
    a la izquierda en rojo después de una parada completa si el camino está despejado
    y no hay señales que prohíban el giro, similar a un giro a la derecha en rojo
    en los Estados Unidos continentales.
- id: 45
  category: driver_testing
  question: Si reprueba el examen práctico de manejo en las Islas Vírgenes de los
    EE. UU., ¿cuál es el período de espera mínimo antes de que se le permita volver
    a tomar el examen?
  choices:
    A: 24 horas
    B: 3 días
    C: 7 días
    D: 30 días
  answer: C
  explanation: Según la Oficina de Vehículos Motorizados de las USVI, un solicitante
    que reprueba el examen práctico debe esperar al menos una semana (7 días) antes
    de poder intentar el examen nuevamente.
- id: 46
  category: driver_testing
  question: 'Al conducir en las Islas Vírgenes de los EE. UU., debe conducir por el
    lado izquierdo de la carretera. Cuando se acerque un vehículo de emergencia con
    sirenas o luces intermitentes, usted debe:'
  choices:
    A: Orillarse al lado derecho de la carretera y detenerse.
    B: Orillarse al lado izquierdo de la carretera y detenerse.
    C: Aumentar la velocidad para quitarse del camino.
    D: Detenerse exactamente donde está en medio del carril.
  answer: B
  explanation: Debido a que en las USVI se conduce por la izquierda, debe orillarse
    al extremo izquierdo de la carretera para permitir que los vehículos de emergencia
    pasen de manera segura.
- id: 47
  category: driver_testing
  question: ¿Cuál es el monto mínimo de seguro de responsabilidad por daños a la propiedad
    requerido por la ley para un vehículo de motor en las Islas Vírgenes de los EE.
    UU.?
  choices:
    A: $5,000
    B: $7,000
    C: $10,000
    D: $20,000
  answer: C
  explanation: Las USVI requieren un mínimo de $10,000 para daños a la propiedad,
    junto con $10,000 por persona y $20,000 por accidente por lesiones corporales.
- id: 48
  category: driver_testing
  question: En las Islas Vírgenes de los EE. UU., ¿cuál es el límite de velocidad
    máximo en una zona escolar cuando hay niños presentes?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: A
  explanation: El límite de velocidad estándar en las zonas escolares de las USVI
    es de 10 millas por hora para garantizar la seguridad de los estudiantes.
- id: 49
  category: driver_testing
  question: 'Según la ley de las Islas Vírgenes de los EE. UU., los niños deben estar
    asegurados en un sistema de sujeción para niños si son menores de:'
  choices:
    A: 3 años
    B: 5 años
    C: 8 años
    D: 10 años
  answer: B
  explanation: La ley de las USVI exige que cualquier niño menor de 5 años debe estar
    debidamente asegurado en un asiento de seguridad para niños aprobado por el gobierno
    federal.
- id: 50
  category: driver_testing
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad máximo
    para vehículos de motor en un distrito comercial o residencial en las Islas Vírgenes
    de los EE. UU.?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: B
  explanation: En las USVI, el límite de velocidad predeterminado dentro de los límites
    de la ciudad, distritos comerciales o áreas residenciales es de 20 mph, a menos
    que las señales indiquen lo contrario.
- id: 51
  category: driver_testing
  question: 'Al estacionar un vehículo en una pendiente en las Islas Vírgenes de los
    EE. UU., debe poner el freno de estacionamiento y:'
  choices:
    A: Dejar las ruedas rectas.
    B: Girar las ruedas hacia el bordillo (acera) si está cuesta arriba.
    C: Girar las ruedas de modo que, si el vehículo rueda, lo haga lejos del tráfico.
    D: Mantener el motor encendido.
  answer: C
  explanation: Los conductores deben girar sus ruedas en una dirección que evite que
    el automóvil ruede hacia la trayectoria del tráfico en caso de que fallen los
    frenos.
- id: 52
  category: driver_testing
  question: En las Islas Vírgenes de los EE. UU., ¿está prohibido estacionar a menos
    de cuántos pies de un hidrante de incendios (boca de incendio)?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: Es ilegal estacionar un vehículo a menos de 15 pies de un hidrante
    de incendios en las Islas Vírgenes de los EE. UU.
- id: 53
  category: driver_testing
  question: ¿Cuándo se permite girar con el semáforo en rojo en las Islas Vírgenes
    de los EE. UU.?
  choices:
    A: Siempre, después de detenerse por completo.
    B: Nunca, a menos que una señal permita específicamente el giro.
    C: Solo al girar a la izquierda desde una calle de sentido único.
    D: Solo durante las horas del día.
  answer: B
  explanation: En las Islas Vírgenes de los EE. UU., los giros en rojo generalmente
    están prohibidos a menos que haya una señal en la intersección que lo permita
    específicamente.
- id: 54
  category: driver_testing
  question: Si se ve involucrado en un accidente de tráfico en las Islas Vírgenes
    de los EE. UU. que resulte en lesiones o daños a la propiedad que superen los
    ______, debe informarlo al Departamento de Policía.
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Cualquier accidente que involucre lesiones o daños a la propiedad de
    $500 o más debe ser reportado al Departamento de Policía de las Islas Vírgenes.
- id: 55
  category: driver_testing
  question: 'En las Islas Vírgenes de los EE. UU., el registro del vehículo se renueva
    anualmente. El mes de vencimiento se determina por:'
  choices:
    A: El mes de nacimiento del propietario.
    B: La fecha en que se compró el vehículo.
    C: El último dígito del número de la placa (matrícula) del vehículo.
    D: La primera letra del apellido del propietario.
  answer: C
  explanation: El BMV utiliza un sistema de registro escalonado donde el mes de vencimiento
    se basa en el último dígito de la placa de circulación.
- id: 56
  category: driver_testing
  question: 'Debido a que el tráfico en las Islas Vírgenes de los EE. UU. circula
    por la izquierda, generalmente debe rebasar a los vehículos más lentos por su:'
  choices:
    A: Lado izquierdo
    B: Lado derecho
    C: Cualquier lado, el que esté despejado
    D: Arcén (hombro) de la carretera
  answer: B
  explanation: Al conducir por la izquierda, el procedimiento estándar para adelantar
    y rebasar a un vehículo más lento es hacerlo por la derecha.
- id: 57
  category: driver_testing
  question: ¿Cuál es el límite de velocidad máximo en las carreteras fuera de la ciudad
    en las Islas Vírgenes de los EE. UU., a menos que se indique lo contrario?
  choices:
    A: 30 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El límite de velocidad máximo en la carretera abierta fuera de la ciudad
    en las Islas Vírgenes de los EE. UU. es de 35 mph, a menos que se indique una
    velocidad diferente.
- id: 58
  category: driver_testing
  question: 'El uso de un teléfono móvil de mano mientras se conduce en las Islas
    Vírgenes de los EE. UU. es:'
  choices:
    A: Permitido si es mayor de 21 años.
    B: Permitido solo para enviar mensajes de texto.
    C: Ilegal, excepto para llamadas de emergencia a las fuerzas del orden o servicios
      de emergencia.
    D: Ilegal solo en zonas escolares.
  answer: C
  explanation: El Código de las Islas Vírgenes prohíbe el uso de teléfonos móviles
    de mano mientras se opera un vehículo motorizado, con excepciones para informar
    emergencias.
- id: 59
  category: driver_responsibility
  question: ¿Cuáles son los límites mínimos del seguro de responsabilidad civil por
    lesiones corporales o muerte de dos o más personas en un solo accidente en las
    Islas Vírgenes de los EE. UU.?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $40,000
  answer: C
  explanation: Las Islas Vírgenes de los EE. UU. requieren una cobertura '10/20/10',
    lo que significa que $20,000 es el límite mínimo por lesiones corporales o muerte
    de dos o más personas en un accidente.
- id: 60
  category: driver_responsibility
  question: 'Si se ve involucrado en un accidente de vehículo motorizado en las Islas
    Vírgenes de los EE. UU. que resulte en daños a la propiedad, la ley le exige:'
  choices:
    A: Esperar 48 horas antes de notificar a la policía
    B: Informarlo solo si el daño supera los $2,000
    C: Detenerse inmediatamente y notificar a la estación de policía más cercana
    D: Presentar un informe solo si alguien resulta herido
  answer: C
  explanation: Según el Título 20, Sección 542 del Código de las Islas Vírgenes, el
    conductor de cualquier vehículo involucrado en un accidente que resulte en lesiones,
    muerte o daños a la propiedad debe detenerse inmediatamente e informar el incidente
    a la policía.
- id: 61
  category: driver_responsibility
  question: ¿Con qué frecuencia debe un vehículo de propiedad privada someterse a
    una inspección de seguridad en el Negociado de Vehículos de Motor (BMV) en las
    Islas Vírgenes de los EE. UU.?
  choices:
    A: Cada seis meses
    B: Cada año
    C: Cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: Los vehículos en las Islas Vírgenes de los EE. UU. deben ser inspeccionados
    y registrados anualmente en el BMV para garantizar que cumplen con los estándares
    de seguridad para operar en las vías públicas.
- id: 62
  category: driver_responsibility
  question: ¿Cuál es el límite legal de contenido de alcohol en la sangre (BAC) para
    un conductor mayor de 21 años en las Islas Vírgenes de los EE. UU.?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: En las Islas Vírgenes de los EE. UU., es ilegal que cualquier persona
    opere un vehículo de motor con un BAC de 0.08% o superior.
- id: 63
  category: driver_responsibility
  question: 'Bajo la ley de ''Tolerancia Cero'' de las Islas Vírgenes de los EE. UU.,
    un conductor menor de 21 años puede ser acusado de DUI si su contenido de alcohol
    en la sangre (BAC) es igual o superior a:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Para los conductores menores de 21 años, las Islas Vírgenes de los
    EE. UU. aplican una política de Tolerancia Cero donde un BAC de 0.02% o superior
    resulta en sanciones por DUI.
- id: 64
  category: driver_responsibility
  question: Si un oficial de la ley en las Islas Vírgenes de los EE. UU. solicita
    una prueba química de su aliento o sangre y usted se niega, ¿cuál es la consecuencia
    inmediata bajo el 'Consentimiento Implícito'?
  choices:
    A: Su vehículo será confiscado por 30 días
    B: Se le multará con $50 y será liberado
    C: Su licencia de conducir será incautada y suspendida
    D: No pasa nada hasta que vaya a la corte
  answer: C
  explanation: Al conducir en las Islas Vírgenes de los EE. UU., usted otorga su 'consentimiento
    implícito' para realizar pruebas químicas. La negativa resulta en la incautación
    inmediata y la suspensión administrativa de su licencia de conducir.
- id: 65
  category: driver_responsibility
  question: Al vender un vehículo en las Islas Vírgenes de los EE. UU., ¿qué otro
    documento debe proporcionar el vendedor al comprador además de una Factura de
    Venta (Bill of Sale) notarizada?
  choices:
    A: Una copia de su certificado de nacimiento
    B: El Certificado de Título original del vehículo
    C: Una carta de recomendación
    D: Los registros de mantenimiento de los últimos tres años
  answer: B
  explanation: Para transferir legalmente la propiedad en las Islas Vírgenes de los
    EE. UU., el vendedor debe endosar el Certificado de Título al comprador y proporcionar
    una Factura de Venta notarizada.
- id: 66
  category: driver_responsibility
  question: ¿Cuál es la multa máxima en las Islas Vírgenes de los EE. UU. por una
    primera condena por conducir sin un seguro de responsabilidad civil válido?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Conducir sin el seguro obligatorio requerido en las Islas Vírgenes
    de los EE. UU. generalmente conlleva una multa de $500 por la primera infracción.
- id: 67
  category: driver_responsibility
  question: Según la ley de las Islas Vírgenes de los EE. UU., ¿quién es responsable
    de asegurar que un pasajero menor de 14 años use el cinturón de seguridad o esté
    en un sistema de sujeción para niños?
  choices:
    A: El pasajero
    B: El conductor del vehículo
    C: El propietario del vehículo (si no es el conductor)
    D: Los padres del pasajero (incluso si no están en el auto)
  answer: B
  explanation: El conductor es legalmente responsable de asegurar que todos los pasajeros
    menores de 14 años estén debidamente sujetos con un cinturón de seguridad o en
    un asiento de seguridad para niños.
- id: 68
  category: driver_responsibility
  question: 'Si choca contra un vehículo desatendido en las Islas Vírgenes de los
    EE. UU. y no puede localizar al propietario, usted debe:'
  choices:
    A: Esperar 4 horas a que regrese el dueño
    B: Dejar una nota escrita con su nombre, dirección y número de registro, y notificar
      a la policía
    C: Irse si no hay daños visibles
    D: Solo dejar una nota si el daño supera los $500
  answer: B
  explanation: Los conductores deben dejar su información de contacto y del vehículo
    en un lugar visible en el vehículo desatendido y reportar el accidente al departamento
    de policía.
- id: 69
  category: driver_responsibility
  question: ¿Cuál de los siguientes es un requisito para que un vehículo pase la inspección
    anual del BMV en las Islas Vírgenes de los EE. UU.?
  choices:
    A: El vehículo debe tener un sistema de sonido premium
    B: Todas las luces, incluidas las direccionales y las luces de freno, deben funcionar
    C: El vehículo debe tener menos de 10 años
    D: El vehículo debe tener asientos de cuero
  answer: B
  explanation: La inspección de seguridad del BMV verifica componentes de seguridad
    esenciales, incluyendo el funcionamiento de las luces, frenos, neumáticos, dirección
    y bocina.
- id: 70
  category: driver_responsibility
  question: ¿Cuál es el límite legal de oscuridad del tinte de las ventanas laterales
    delanteras en las Islas Vírgenes de los EE. UU.?
  choices:
    A: No se permite ningún tinte
    B: Debe permitir la entrada de más del 35% de la luz
    C: Debe permitir la entrada de más del 20% de la luz
    D: Debe permitir la entrada de más del 50% de la luz
  answer: B
  explanation: La ley de las Islas Vírgenes de los EE. UU. (Título 20, Sección 466)
    estipula que el tinte de las ventanas laterales delanteras debe tener una transmisión
    de luz de más del 35%.
- id: 71
  category: driver_responsibility
  question: 'Si es condenado por conducir bajo la influencia (DUI) en las Islas Vírgenes
    de los EE. UU. por primera vez, su licencia de conducir será suspendida por un
    período de:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Una primera condena por DUI en las Islas Vírgenes de los EE. UU. generalmente
    resulta en una suspensión obligatoria de la licencia de conducir de 6 meses.
- id: 72
  category: driver_responsibility
  question: ¿Cuál es la multa por arrojar basura desde un vehículo de motor en las
    carreteras de las Islas Vírgenes de los EE. UU.?
  choices:
    A: Solo una advertencia verbal
    B: Una multa no menor de $100
    C: 24 horas obligatorias de cárcel
    D: No existe una ley específica contra arrojar basura desde los autos
  answer: B
  explanation: Arrojar basura desde un vehículo es ilegal en las Islas Vírgenes de
    los EE. UU. y conlleva multas significativas, comenzando en $100 o más, dependiendo
    de la gravedad y la ubicación.
- id: 73
  category: driver_responsibility
  question: En las Islas Vírgenes de los EE. UU., ¿cuáles son los requisitos mínimos
    de seguro de responsabilidad civil para un vehículo de pasajeros privado?
  choices:
    A: $5,000 por daños a la propiedad, $10,000 por una persona, $15,000 por dos o
      más personas
    B: $10,000 por daños a la propiedad, $10,000 por una persona, $20,000 por dos
      o más personas
    C: $20,000 por daños a la propiedad, $25,000 por una persona, $50,000 por dos
      o más personas
    D: $25,000 por daños a la propiedad, $50,000 por una persona, $100,000 por dos
      o más personas
  answer: B
  explanation: Según la ley de las Islas Vírgenes de los EE. UU. (Título 20, Sección
    703), el seguro de responsabilidad civil mínimo obligatorio es de $10,000 por
    lesiones/muerte de una persona, $20,000 por lesiones/muerte de dos o más personas
    y $10,000 por daños a la propiedad.
- id: 74
  category: driver_responsibility
  question: ¿Con qué frecuencia deben ser inspeccionados los vehículos en el Negociado
    de Vehículos de Motor (BMV) en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Cada seis meses
    B: Cada año
    C: Cada dos años
    D: Solo cuando se vende el vehículo
  answer: B
  explanation: En las Islas Vírgenes de los EE. UU., todos los vehículos de motor
    registrados deben someterse a una inspección de seguridad anual en el BMV para
    garantizar que sean aptos para circular.
- id: 75
  category: driver_responsibility
  question: Bajo la ley de "Tolerancia Cero" de las Islas Vírgenes de los EE. UU.,
    se considera que un conductor menor de 21 años conduce bajo la influencia si su
    concentración de alcohol en sangre (BAC) es de ______ o superior.
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: B
  explanation: Para los conductores menores de 21 años, las Islas Vírgenes de los
    EE. UU. aplican una política de Tolerancia Cero donde un BAC de 0.02% o superior
    resulta en un cargo por DUI.
- id: 76
  category: driver_responsibility
  question: 'En las Islas Vírgenes de los EE. UU., si un conductor se niega a someterse
    a una prueba química de alcohol o drogas (Consentimiento Implícito), su licencia
    será suspendida automáticamente por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses a 1 año
    D: 2 años
  answer: C
  explanation: Bajo la ley de Consentimiento Implícito, la negativa a realizarse una
    prueba química en las Islas Vírgenes de los EE. UU. resulta en una suspensión
    administrativa de la licencia, que generalmente oscila entre 6 meses y 1 año por
    una primera infracción.
- id: 77
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la ley
    de "Contenedor Abierto" en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Los pasajeros pueden tener contenedores abiertos, pero el conductor no.
    B: Se permiten contenedores abiertos si están en un portavasos.
    C: Es ilegal que cualquier persona posea un contenedor abierto de una bebida alcohólica
      en el compartimento de pasajeros de un vehículo de motor.
    D: Los contenedores abiertos solo son ilegales en días festivos.
  answer: C
  explanation: La ley de las Islas Vírgenes de los EE. UU. prohíbe la posesión de
    un contenedor abierto de alcohol por parte del conductor o cualquier pasajero
    dentro del área de pasajeros de un vehículo de motor mientras se encuentre en
    una vía pública.
- id: 78
  category: driver_responsibility
  question: En las Islas Vírgenes de los EE. UU., ¿cuál es la multa estándar para
    un adulto por una primera infracción del uso del cinturón de seguridad?
  choices:
    A: $25
    B: $100
    C: $250
    D: $500
  answer: B
  explanation: La multa por no usar el cinturón de seguridad en las Islas Vírgenes
    de los EE. UU. es de $100 por infracción.
- id: 79
  category: driver_responsibility
  question: Cuando se vende un vehículo en las Islas Vírgenes de los EE. UU., el vendedor
    debe notificar al BMV y el comprador debe transferir el título dentro de ¿cuántos
    días?
  choices:
    A: 24 horas
    B: 5 días
    C: 15 días
    D: 30 días
  answer: C
  explanation: En las Islas Vírgenes de los EE. UU., la transferencia de propiedad
    del vehículo debe completarse en el Negociado de Vehículos de Motor dentro de
    los 15 días posteriores a la venta.
- id: 80
  category: driver_responsibility
  question: 'Si lo sorprenden conduciendo un vehículo en las Islas Vírgenes de los
    EE. UU. sin el seguro de responsabilidad civil obligatorio, la sanción puede incluir:'
  choices:
    A: Una multa de $500 y suspensión de la licencia
    B: Una advertencia verbal por la primera infracción
    C: Solo una multa de $25
    D: Solo servicio comunitario obligatorio
  answer: A
  explanation: Conducir sin seguro en las Islas Vírgenes de los EE. UU. es una infracción
    grave que conlleva multas elevadas (a menudo de $500 o más) y la suspensión de
    los privilegios de conducir.
- id: 81
  category: driver_responsibility
  question: ¿Dónde debe colocarse la calcomanía de "validación" del registro en un
    vehículo en las Islas Vírgenes de los EE. UU.?
  choices:
    A: En el parabrisas delantero, esquina inferior izquierda
    B: En la placa trasera
    C: En la placa delantera
    D: En el parabrisas trasero, esquina superior derecha
  answer: B
  explanation: En las Islas Vírgenes de los EE. UU., la calcomanía de validación del
    registro proporcionada por el BMV debe fijarse en la placa trasera para demostrar
    que el vehículo está registrado actualmente.
- id: 82
  category: driver_responsibility
  question: 'En las Islas Vírgenes de los EE. UU., si cambia el color de su vehículo
    o reemplaza el motor, usted debe:'
  choices:
    A: Esperar hasta su próxima inspección anual para informarlo
    B: Notificar al BMV dentro de las 24 horas para actualizar el registro
    C: No hacer nada, ya que son cambios estéticos o mecánicos
    D: Notificar únicamente al Departamento de Policía
  answer: B
  explanation: Cualquier cambio importante en la descripción del vehículo, como un
    cambio de color o de número de motor, debe informarse al BMV dentro de las 24
    horas para garantizar que el registro siga siendo preciso.
- id: 83
  category: driver_responsibility
  question: ¿Cuál es la sanción por una primera condena por conducir bajo los efectos
    del alcohol o drogas (DUI) en las Islas Vírgenes de los EE. UU. con respecto a
    su licencia de conducir?
  choices:
    A: Revocación permanente obligatoria
    B: Suspensión de 6 meses a 1 año
    C: Una advertencia en su historial de manejo
    D: Suspensión por exactamente 30 días
  answer: B
  explanation: Una primera condena por DUI en las Islas Vírgenes de los EE. UU. generalmente
    resulta en una suspensión de la licencia que varía de 6 meses a 1 año, además
    de multas y posible tiempo en la cárcel.
- id: 84
  category: driver_responsibility
  question: ¿Qué documento debe mantenerse en el vehículo en todo momento mientras
    se opera en las carreteras de las Islas Vírgenes de los EE. UU.?
  choices:
    A: El título original del vehículo
    B: El certificado de nacimiento del conductor
    C: Un certificado de registro vigente y comprobante de seguro
    D: La factura de venta del vehículo
  answer: C
  explanation: Los conductores en las Islas Vírgenes de los EE. UU. están obligados
    a tener el certificado de registro actual del vehículo y un comprobante de seguro
    válido en el vehículo siempre que se esté operando.
- id: 85
  category: safe_driving_rules
  question: En las Islas Vírgenes de los EE. UU., ¿en qué lado de la carretera debe
    conducir?
  choices:
    A: El lado derecho
    B: El lado izquierdo
    C: El centro de la carretera
    D: Cualquier lado que tenga menos tráfico
  answer: B
  explanation: Único entre las jurisdicciones de los Estados Unidos, las Islas Vírgenes
    de los EE. UU. requieren que todos los vehículos se conduzcan por el lado izquierdo
    de la carretera.
- id: 86
  category: safe_driving_rules
  question: 'Cuando se aproxima un vehículo de emergencia con luces intermitentes
    y sirenas en las Islas Vírgenes de los EE. UU., usted debe:'
  choices:
    A: Orillarse al borde derecho de la carretera y detenerse
    B: Orillarse al borde izquierdo de la carretera y detenerse
    C: Acelerar para salir del camino
    D: Detenerse exactamente donde está en el carril
  answer: B
  explanation: Debido a que el tráfico en las Islas Vírgenes de los EE. UU. se mueve
    por la izquierda, los conductores deben orillarse al borde izquierdo de la carretera
    para permitir el paso de los vehículos de emergencia.
- id: 87
  category: safe_driving_rules
  question: En las Islas Vírgenes de los EE. UU., ¿es ilegal estacionarse a menos
    de cuántos pies de una intersección o esquina?
  choices:
    A: 10 pies
    B: 15 pies
    C: 25 pies
    D: 50 pies
  answer: C
  explanation: Para mantener la visibilidad de todos los conductores, está prohibido
    estacionarse a menos de 25 pies de una intersección o esquina en las Islas Vírgenes
    de los EE. UU.
- id: 88
  category: safe_driving_rules
  question: 'Al entrar en una rotonda en las Islas Vírgenes de los EE. UU., ¿debe
    ceder el paso al tráfico que viene de su:'
  choices:
    A: Izquierda
    B: Derecha
    C: Parte trasera
    D: Frente
  answer: B
  explanation: En las Islas Vírgenes de los EE. UU., el tráfico se mueve en el sentido
    de las agujas del reloj en una rotonda. Debe ceder el paso al tráfico que ya está
    en el círculo, el cual se aproximará por su derecha.
- id: 89
  category: safe_driving_rules
  question: Si las señales de giro de su vehículo no funcionan, ¿cuál es la señal
    manual correcta para un giro a la derecha en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados
    C: Brazo izquierdo extendido hacia abajo
    D: Brazo derecho extendido recto hacia afuera de la ventana
  answer: B
  explanation: 'Se utilizan las señales manuales estándar: brazo izquierdo hacia afuera
    para la izquierda, brazo izquierdo hacia arriba para la derecha y brazo izquierdo
    hacia abajo para detenerse o reducir la velocidad.'
- id: 90
  category: safe_driving_rules
  question: Al estacionar cuesta arriba en una calle de doble sentido con acera (bordillo)
    en las Islas Vírgenes de los EE. UU., ¿cómo debe girar las ruedas delanteras?
  choices:
    A: Hacia la acera (hacia la izquierda)
    B: Lejos de la acera (hacia la derecha)
    C: Paralelas a la acera
    D: No importa
  answer: B
  explanation: Al estacionar cuesta arriba en el lado izquierdo de la carretera con
    acera, debe girar las ruedas hacia la derecha (lejos de la acera) para que, si
    el automóvil rueda, la parte trasera de la llanta golpee la acera.
- id: 91
  category: safe_driving_rules
  question: ¿En las Islas Vírgenes de los EE. UU., a cuántos pies de distancia de
    un vehículo que viene en sentido contrario debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Los conductores en las Islas Vírgenes de los EE. UU. deben cambiar
    a luces bajas cuando un vehículo que viene en sentido contrario está a menos de
    500 pies para evitar cegar al otro conductor.
- id: 92
  category: safe_driving_rules
  question: Según la ley de las Islas Vírgenes de los EE. UU., ¿quién está obligado
    a usar el cinturón de seguridad en un vehículo motorizado en movimiento?
  choices:
    A: Solo el conductor
    B: Solo el conductor y el pasajero del asiento delantero
    C: El conductor y todos los pasajeros en los asientos delanteros y traseros
    D: Solo los niños menores de 12 años
  answer: C
  explanation: La ley de las Islas Vírgenes de los EE. UU. exige que el conductor
    y todos los pasajeros (tanto en los asientos delanteros como traseros) estén debidamente
    sujetos por cinturones de seguridad.
- id: 93
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para vehículos de pasajeros fuera
    de los distritos urbanos (en el campo) en las Islas Vírgenes de los EE. UU.?
  choices:
    A: 30 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El límite de velocidad general para vehículos fuera de los distritos
    urbanos en las Islas Vírgenes de los EE. UU. es de 35 mph, a menos que se indique
    lo contrario.
- id: 94
  category: safe_driving_rules
  question: Al conducir por la izquierda en las Islas Vírgenes de los EE. UU., ¿por
    qué lado se le permite generalmente rebasar a otro vehículo?
  choices:
    A: El lado izquierdo
    B: El lado derecho
    C: El arcén (hombro)
    D: No se permite rebasar por ningún lado
  answer: B
  explanation: Debido a que el tráfico circula por la izquierda en las Islas Vírgenes
    de los EE. UU., el rebase de vehículos más lentos se realiza normalmente por el
    lado derecho.
- id: 95
  category: safe_driving_rules
  question: Según la ley de las Islas Vírgenes de los EE. UU., ¿cuál es la multa por
    la primera infracción por usar un teléfono móvil de mano mientras se conduce?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: El Código de las Islas Vírgenes establece una multa de $100 por la
    primera infracción por el uso de un dispositivo móvil de mano mientras se opera
    un vehículo motorizado.
- id: 96
  category: safe_driving_rules
  question: Al estacionar en una colina en las Islas Vírgenes de los EE. UU., ¿cuál
    de los siguientes requisitos exige la ley?
  choices:
    A: Dejar el coche en punto muerto (neutral)
    B: Girar las ruedas delanteras hacia el bordillo o el lado de la carretera
    C: Mantener las ruedas perfectamente rectas
    D: Encender las luces de emergencia (luces de hazard)
  answer: B
  explanation: Al estacionar en una pendiente, debe girar las ruedas delanteras hacia
    el bordillo o el lado de la carretera para que, si el vehículo se mueve, no ruede
    hacia el tráfico.
- id: 97
  category: safe_driving_rules
  question: 'En las Islas Vírgenes de los EE. UU., el uso del cinturón de seguridad
    es obligatorio para:'
  choices:
    A: Solo el conductor
    B: Solo pasajeros menores de 18 años
    C: El conductor y todos los pasajeros del asiento delantero
    D: Solo los conductores en la autopista Melvin Evans
  answer: C
  explanation: La ley de las Islas Vírgenes de los EE. UU. exige que el conductor
    y todos los pasajeros del asiento delantero usen cinturones de seguridad. Los
    niños también deben estar debidamente sujetos según su edad y tamaño.
- id: 98
  category: defensive_driving
  question: ¿En las Islas Vírgenes de los EE. UU., cuál es la distancia mínima de
    seguimiento recomendada detrás del vehículo que va delante de usted en condiciones
    de conducción ideales?
  choices:
    A: La longitud de un vehículo
    B: Dos segundos
    C: Cuatro segundos
    D: 50 pies
  answer: B
  explanation: El Manual del Conductor de las Islas Vírgenes de los EE. UU. recomienda
    la 'regla de los dos segundos' como distancia mínima de seguimiento en condiciones
    ideales para permitir suficiente tiempo para reaccionar ante peligros.
- id: 99
  category: defensive_driving
  question: ¿A qué velocidad puede comenzar el hidroplaneo (las llantas pierden contacto
    con la superficie de la carretera debido al agua) en las Islas Vírgenes de los
    EE. UU.?
  choices:
    A: A tan solo 35 mph
    B: Solo por encima de 55 mph
    C: A cualquier velocidad superior a 20 mph
    D: Solo durante vientos con fuerza de huracán
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph bajo
    lluvia intensa. En las Islas Vírgenes de los EE. UU., donde los aguaceros tropicales
    son comunes, se aconseja a los conductores reducir la velocidad significativamente
    durante la lluvia.
- id: 100
  category: defensive_driving
  question: 'Al conducir de noche en las Islas Vírgenes de los EE. UU., debe bajar
    las luces altas de sus faros cuando un vehículo que viene en sentido contrario
    esté a menos de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Para evitar cegar a los conductores que vienen en sentido contrario,
    la ley de las Islas Vírgenes de los EE. UU. exige que baje las luces altas cuando
    un vehículo que se aproxima esté a menos de 500 pies.
- id: 101
  category: defensive_driving
  question: 'Debido a que los vehículos en las Islas Vírgenes de los EE. UU. circulan
    por el lado izquierdo de la carretera, los conductores defensivos deben ser especialmente
    cautelosos al:'
  choices:
    A: Girar a la derecha en una intersección
    B: Girar a la izquierda en una intersección
    C: Adelantar a un vehículo en una carretera de dos carriles
    D: Todas las anteriores
  answer: D
  explanation: Conducir por la izquierda requiere una vigilancia constante, especialmente
    durante los giros y adelantamientos, para asegurarse de permanecer en el carril
    correcto y tener en cuenta el flujo de tráfico único de las Islas Vírgenes de
    los EE. UU.
- id: 102
  category: defensive_driving
  question: 'En las Islas Vírgenes de los EE. UU., las carreteras están más resbaladizas
    durante una tormenta de lluvia:'
  choices:
    A: Después de que ha estado lloviendo durante varias horas
    B: Durante los primeros minutos de la lluvia
    C: Solo cuando la temperatura es inferior a 60 grados
    D: Inmediatamente después de que deja de llover
  answer: B
  explanation: Durante los primeros minutos de lluvia, el agua se mezcla con el aceite
    y el polvo en la superficie de la carretera, creando una película muy resbaladiza.
    Esto es particularmente peligroso en las carreteras empinadas y sinuosas de las
    Islas Vírgenes de los EE. UU.
- id: 103
  category: defensive_driving
  question: 'Al descender una colina empinada en islas como St. Thomas o St. John,
    los conductores defensivos deben:'
  choices:
    A: Cambiar a una marcha más baja para usar el frenado de motor
    B: Mantener el vehículo en punto muerto (neutral) para ahorrar combustible
    C: Pisar los frenos constantemente para mantener una velocidad lenta
    D: Apagar el motor para evitar el sobrecalentamiento
  answer: A
  explanation: Para evitar el desvanecimiento o la falla de los frenos en el terreno
    empinado de las Islas Vírgenes de los EE. UU., los conductores deben cambiar a
    una marcha más baja, permitiendo que el motor ayude a controlar la velocidad del
    vehículo.
- id: 104
  category: defensive_driving
  question: Al observar el camino adelante en busca de peligros en las Islas Vírgenes
    de los EE. UU., un conductor defensivo debe mirar al menos ______ hacia adelante.
  choices:
    A: 5 segundos
    B: 10 a 15 segundos
    C: Una cuadra de la ciudad
    D: 50 pies
  answer: B
  explanation: Observar de 10 a 15 segundos hacia adelante permite a los conductores
    ver peligros potenciales a tiempo y planificar sus reacciones, lo cual es vital
    en las carreteras sinuosas de las Islas Vírgenes de los EE. UU.
- id: 105
  category: defensive_driving
  question: Si conduce con niebla densa o un aguacero tropical en las Islas Vírgenes
    de los EE. UU., ¿qué luces debe usar?
  choices:
    A: Luces altas
    B: Solo luces de estacionamiento
    C: Luces bajas
    D: Solo luces de emergencia (intermitentes)
  answer: C
  explanation: Las luces bajas deben usarse en condiciones de niebla o lluvia intensa.
    Las luces altas se reflejan en la humedad y causan deslumbramiento, lo que dificulta
    la visión.
- id: 106
  category: defensive_driving
  question: 'En las Islas Vírgenes de los EE. UU., si su vehículo comienza a derrapar
    en una carretera mojada, usted debe:'
  choices:
    A: Frenar bruscamente de inmediato
    B: Girar el volante en la dirección opuesta al derrape
    C: Dejar de acelerar gradualmente y girar en la dirección en la que desea que
      vaya la parte delantera del automóvil
    D: Acelerar para recuperar la tracción
  answer: C
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar en la dirección a la que desea ir. Evite frenar bruscamente, ya que esto
    puede bloquear las ruedas.
- id: 107
  category: defensive_driving
  question: 'Al seguir a un camión o autobús grande en una carretera empinada de las
    Islas Vírgenes de los EE. UU., debe aumentar su distancia de seguimiento porque:'
  choices:
    A: El vehículo puede rodar ligeramente hacia atrás al arrancar desde una parada
    B: Los vehículos grandes tienen puntos ciegos más grandes
    C: El vehículo puede necesitar más espacio para maniobrar en curvas cerradas
    D: Todas las anteriores
  answer: D
  explanation: La conducción defensiva cerca de vehículos grandes en las Islas Vírgenes
    de los EE. UU. requiere espacio adicional debido a sus puntos ciegos, giros amplios
    y la tendencia a rodar hacia atrás en pendientes pronunciadas.
- id: 108
  category: defensive_driving
  question: 'Cuando otro conductor lo sigue muy de cerca (tailgating) en una carretera
    estrecha de las Islas Vírgenes de los EE. UU., la acción defensiva más segura
    es:'
  choices:
    A: Frenar repentinamente para advertirles que se alejen
    B: Acelerar para mantener una distancia
    C: Reducir la velocidad gradualmente y orillarse cuando sea seguro para dejarles
      pasar
    D: Encender sus luces altas
  answer: C
  explanation: Si alguien lo sigue muy de cerca, no acelere ni frene repentinamente.
    La acción más segura es reducir la velocidad y permitirles pasar cuando haya una
    oportunidad segura.
- id: 109
  category: defensive_driving
  question: 'En las Islas Vírgenes de los EE. UU., debe usar sus faros delanteros
    siempre que la visibilidad se reduzca a menos de:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: Una milla
  answer: B
  explanation: Las regulaciones de las Islas Vírgenes de los EE. UU. requieren que
    los faros se enciendan siempre que no se pueda ver claramente a una distancia
    de 500 pies por delante debido a la oscuridad, la lluvia o la niebla.
- id: 110
  category: defensive_driving
  question: 'Para revisar su "punto ciego" antes de cambiar de carril en las Islas
    Vírgenes de los EE. UU., debe:'
  choices:
    A: Mirar por el espejo retrovisor
    B: Mirar por el espejo lateral
    C: Girar la cabeza y mirar sobre su hombro
    D: Tocar la bocina y esperar una reacción
  answer: C
  explanation: Los espejos no lo muestran todo. Para asegurarse de que un carril esté
    despejado, debe girar la cabeza y mirar sobre su hombro para revisar las áreas
    que sus espejos no alcanzan a ver.
- id: 111
  category: defensive_driving
  question: ¿Con cuánta anticipación debe observar el camino para identificar posibles
    peligros al conducir por las carreteras empinadas y sinuosas comunes en las Islas
    Vírgenes de los EE. UU.?
  choices:
    A: 5 a 8 segundos
    B: 10 a 15 segundos
    C: 20 a 30 segundos
    D: Solo el vehículo directamente delante de usted
  answer: B
  explanation: Para conducir a la defensiva, debe observar el camino con 10 a 15 segundos
    de anticipación. Esto le permite ver peligros, como peatones o vehículos averiados
    en las curvas, antes de que se conviertan en un peligro inmediato.
- id: 112
  category: defensive_driving
  question: Debido a que en las Islas Vírgenes de los EE. UU. se conduce por la izquierda,
    al acercarse a una intersección, ¿hacia qué dirección debe mirar primero?
  choices:
    A: A la izquierda
    B: A la derecha
    C: Hacia adelante
    D: Detrás de usted
  answer: B
  explanation: Al conducir por la izquierda, el primer carril de tráfico que cruza
    o al que entra proviene de la derecha. Por lo tanto, debe mirar a la derecha,
    luego a la izquierda y luego a la derecha nuevamente antes de avanzar.
- id: 113
  category: defensive_driving
  question: 'Durante un fuerte aguacero tropical en las Islas Vírgenes de los EE.
    UU., sus neumáticos pueden perder todo contacto con la carretera (hidroplaneo).
    Esto puede comenzar a velocidades tan bajas como:'
  choices:
    A: 50 mph
    B: 45 mph
    C: 35 mph
    D: 20 mph
  answer: C
  explanation: El hidroplaneo (hydroplaning) puede comenzar a velocidades tan bajas
    como 35 mph bajo una lluvia intensa. En las Islas Vírgenes de los EE. UU., donde
    muchas carreteras no están perfectamente niveladas, el agua puede acumularse rápidamente,
    aumentando este riesgo.
- id: 114
  category: defensive_driving
  question: Si está lloviendo o las carreteras están mojadas en las Islas Vírgenes
    de los EE. UU., ¿cómo debería ajustar su distancia de seguimiento?
  choices:
    A: Mantenerla igual que en clima seco
    B: Disminuirla para mantenerse cerca de las luces traseras del vehículo
    C: Duplicar su distancia de seguimiento a al menos cuatro segundos
    D: Triplicar su distancia de seguimiento a al menos diez segundos
  answer: C
  explanation: Las carreteras mojadas en las Islas Vírgenes de los EE. UU. pueden
    ser particularmente resbaladizas debido a la acumulación de aceite y la lluvia.
    Debe duplicar su distancia de seguimiento a al menos cuatro segundos para garantizar
    una distancia de frenado segura.
- id: 115
  category: defensive_driving
  question: Después de conducir a través de un charco profundo o un área inundada
    en una carretera de las Islas Vírgenes de los EE. UU., ¿cuál es la mejor práctica
    de conducción defensiva?
  choices:
    A: Acelerar para que el agua salga de los neumáticos
    B: Presionar los frenos con fuerza para secarlos inmediatamente
    C: Bombear los frenos suavemente para probarlos y secarlos
    D: Apagar el motor y esperar 10 minutos
  answer: C
  explanation: El agua puede hacer que los frenos sean menos efectivos. Debe bombear
    los frenos ligeramente varias veces para generar calor y secarlos después de pasar
    por agua profunda.
- id: 116
  category: defensive_driving
  question: 'En las Islas Vírgenes de los EE. UU., la mayoría de los vehículos tienen
    el volante a la izquierda, pero se conducen por el lado izquierdo de la carretera.
    Esto crea un punto ciego significativo al:'
  choices:
    A: Girar a la izquierda
    B: Rebasar o adelantar a un vehículo por la derecha
    C: Retroceder hacia una entrada
    D: Estacionar en una colina
  answer: B
  explanation: Debido a que el conductor se sienta en el lado izquierdo del automóvil
    pero conduce por el lado izquierdo de la carretera, la visibilidad para rebasar
    por la derecha (el lado estándar para rebasar en las Islas Vírgenes de los EE.
    UU.) es limitada. Los conductores deben ser extremadamente cautelosos y revisar
    los puntos ciegos a fondo.
- id: 117
  category: defensive_driving
  question: Si un vehículo que viene en sentido contrario por la noche no baja sus
    luces altas, ¿hacia dónde debe mirar para evitar quedar temporalmente cegado?
  choices:
    A: Directamente a los faros que se aproximan
    B: A la línea central de la carretera
    C: Hacia el borde izquierdo de su carril
    D: Cerrar los ojos momentáneamente
  answer: C
  explanation: Para evitar el deslumbramiento de las luces altas que vienen en sentido
    contrario, debe mirar hacia el borde izquierdo de su carril (ya que está conduciendo
    por la izquierda) y usar la línea del arcén como guía.
- id: 118
  category: defensive_driving
  question: Si alguien lo sigue muy de cerca (tailgated) en una carretera de dos carriles
    en las Islas Vírgenes de los EE. UU., ¿cuál es la acción defensiva más segura
    a tomar?
  choices:
    A: Frenar repentinamente para asustar al conductor que lo sigue
    B: Acelerar para aumentar la distancia
    C: Reducir la velocidad gradualmente y animar al conductor a rebasar cuando sea
      seguro
    D: Encender sus luces altas
  answer: C
  explanation: Si alguien lo sigue muy de cerca, la respuesta más segura es reducir
    la velocidad gradualmente. Esto aumenta el espacio frente a usted (para que no
    tenga que frenar repentinamente) y anima al otro conductor a rebasar.
- id: 119
  category: defensive_driving
  question: Al descender una colina muy empinada en las Islas Vírgenes de los EE.
    UU., ¿qué debe hacer para mantener el control y evitar fallas en los frenos?
  choices:
    A: Mantener presionados los frenos durante todo el descenso
    B: Cambiar a una marcha más baja
    C: Apagar el motor para ahorrar combustible
    D: Conducir en zigzag por la carretera
  answer: B
  explanation: Cambiar a una marcha más baja (frenado con motor) ayuda a controlar
    su velocidad en descensos empinados sin sobrecalentar ni desgastar los frenos,
    lo cual es fundamental en el terreno montañoso de las Islas Vírgenes de los EE.
    UU.
- id: 120
  category: alcohol_drugs_health
  question: 'En las Islas Vírgenes de los EE. UU., se considera que un conductor está
    legalmente ebrio si su Contenido de Alcohol en Sangre (BAC) es igual o superior
    a:'
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Según la ley de las Islas Vírgenes de los EE. UU. (Título 20, Sección
    493), es ilegal que cualquier persona que tenga un 0.08% o más en peso de alcohol
    en su sangre conduzca, opere o tenga el control físico real de un vehículo motorizado.
- id: 121
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de "Consentimiento Implícito" (Implied Consent)
    de las Islas Vírgenes de los EE. UU. para los conductores?
  choices:
    A: Usted acepta que su vehículo sea registrado en cualquier momento.
    B: Usted acepta proporcionar un comprobante de seguro cuando se le solicite.
    C: Usted acepta someterse a una prueba química de aliento, sangre u orina si se
      sospecha que conduce bajo la influencia (DUI).
    D: Usted acepta seguir todas las señales y señales de tráfico.
  answer: C
  explanation: El Consentimiento Implícito significa que, al operar un vehículo motorizado
    en las Islas Vírgenes de los EE. UU., usted ya ha dado su consentimiento para
    ser sometido a pruebas de alcohol o drogas si un oficial de la ley tiene motivos
    razonables para creer que está conduciendo bajo la influencia.
- id: 122
  category: alcohol_drugs_health
  question: Si un conductor en las Islas Vírgenes de los EE. UU. se niega a someterse
    a una prueba química de intoxicación, ¿cuál es la consecuencia inmediata con respecto
    a su licencia de conducir?
  choices:
    A: La licencia se suspende por 30 días.
    B: La licencia se revoca permanentemente.
    C: El oficial de policía confiscará la licencia y emitirá un permiso temporal
      a la espera de una audiencia.
    D: No hay ninguna consecuencia inmediata hasta que el conductor vaya a la corte.
  answer: C
  explanation: Si se niega a una prueba química en las Islas Vírgenes de los EE. UU.,
    el oficial confiscará su licencia de inmediato. Se le emitirá un permiso temporal
    y se programará una audiencia para determinar la duración de la suspensión, que
    suele ser de 6 meses a 1 año por una primera negativa.
- id: 123
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto de mezclar alcohol con otras drogas, como medicamentos
    recetados o sustancias ilegales, al conducir?
  choices:
    A: Los efectos del alcohol se anulan.
    B: Los efectos son los mismos que beber alcohol solo.
    C: La combinación puede multiplicar los efectos de ambos, aumentando significativamente
      el deterioro.
    D: Solo afecta al conductor si tiene una condición médica preexistente.
  answer: C
  explanation: Combinar alcohol con otras drogas (efecto sinérgico) crea un nivel
    de deterioro mucho mayor que el que produciría cualquiera de las sustancias por
    sí sola, lo que hace que la conducción sea extremadamente peligrosa.
- id: 124
  category: alcohol_drugs_health
  question: 'Si es condenado por DUI en las Islas Vírgenes de los EE. UU. y es su
    segunda infracción en un plazo de 10 años, el tiempo mínimo obligatorio de cárcel
    es:'
  choices:
    A: 48 horas
    B: 10 días
    C: 30 días
    D: 6 meses
  answer: B
  explanation: Para una segunda condena por DUI dentro de un período de 10 años en
    las Islas Vírgenes de los EE. UU., la ley exige una pena de prisión mínima de
    no menos de 10 días.
- id: 125
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es una posible sanción por una condena de DUI
    en las Islas Vírgenes de los EE. UU., además de multas y tiempo en la cárcel?
  choices:
    A: Asistencia obligatoria a un programa de educación sobre el alcohol.
    B: Servicio comunitario.
    C: Instalación de un dispositivo de bloqueo de encendido (ignition interlock device).
    D: Todas las anteriores.
  answer: D
  explanation: El tribunal en las Islas Vírgenes de los EE. UU. tiene la autoridad
    para exigir programas de tratamiento de alcohol, servicio comunitario y el uso
    de dispositivos de bloqueo de encendido como parte de una sentencia por DUI.
- id: 126
  category: alcohol_drugs_health
  question: ¿Cómo afecta la marihuana a un conductor en las Islas Vírgenes de los
    EE. UU.?
  choices:
    A: No tiene ningún efecto sobre la capacidad de conducción.
    B: Mejora la concentración y el tiempo de reacción.
    C: Afecta la coordinación, retrasa el tiempo de reacción y altera el juicio de
      la distancia.
    D: Es legal usarla mientras se conduce siempre que sea con fines médicos.
  answer: C
  explanation: La marihuana deteriora las habilidades necesarias para una conducción
    segura, incluyendo la coordinación y el tiempo de reacción. Conducir bajo la influencia
    de la marihuana es ilegal en las Islas Vírgenes de los EE. UU., incluso para usuarios
    médicos.
- id: 127
  category: alcohol_drugs_health
  question: Si está tomando medicamentos recetados y estos le hacen sentir somnoliento
    o mareado, ¿qué debe hacer?
  choices:
    A: Conducir solo por calles secundarias y evitar la autopista.
    B: Beber café para mantenerse despierto mientras conduce.
    C: No conducir hasta que los efectos del medicamento hayan desaparecido.
    D: Conducir más rápido para llegar antes a su destino.
  answer: C
  explanation: Es su responsabilidad como conductor conocer los efectos de cualquier
    medicamento que tome. Si una droga afecta su capacidad para conducir de manera
    segura, puede ser acusado de DUI.
- id: 128
  category: alcohol_drugs_health
  question: 'En las Islas Vírgenes de los EE. UU., si un conductor es condenado por
    DUI mientras un menor (menor de 16 años) era pasajero en el vehículo:'
  choices:
    A: La multa se reduce a la mitad.
    B: Las penas se agravan o aumentan.
    C: La licencia de conducir solo se suspende por 30 días.
    D: No hay ninguna sanción adicional.
  answer: B
  explanation: Conducir bajo la influencia con un menor en el vehículo se considera
    un factor agravante en las Islas Vírgenes de los EE. UU. y puede dar lugar a sentencias
    más severas y mayores sanciones.
- id: 129
  category: alcohol_drugs_health
  question: ¿Cuál de estos es un signo común de un conductor que ha estado bebiendo
    alcohol?
  choices:
    A: Zigzaguear entre las líneas de los carriles.
    B: Conducir significativamente más lento que el límite de velocidad.
    C: Arranques y paradas rápidos y bruscos.
    D: Todas las anteriores.
  answer: D
  explanation: El alcohol afecta el juicio y las habilidades motoras, lo que a menudo
    resulta en comportamientos de conducción erráticos como el zigzagueo, velocidades
    inconsistentes y frenado o aceleración deficientes.
- id: 130
  category: alcohol_drugs_health
  question: 'La ley de "Consentimiento Implícito" en las Islas Vírgenes de los EE.
    UU. significa que al conducir por las carreteras de las Islas Vírgenes, usted
    ha dado su consentimiento para:'
  choices:
    A: Un registro del maletero de su vehículo en cualquier momento.
    B: Una prueba química de su aliento, sangre u orina para determinar el contenido
      de alcohol o drogas.
    C: Proporcionar sus huellas dactilares a la BMV anualmente.
    D: Permitir que un oficial de policía conduzca su vehículo a un lugar seguro.
  answer: B
  explanation: Las leyes de Consentimiento Implícito significan que se considera que
    cualquier persona que opere un vehículo motorizado en las Islas Vírgenes de los
    EE. UU. ha dado su consentimiento para una prueba química de su aliento, sangre
    u orina si es arrestada por DUI.
- id: 131
  category: alcohol_drugs_health
  question: 'Una primera condena por DUI en las Islas Vírgenes de los EE. UU. generalmente
    resulta en una suspensión obligatoria de la licencia de conducir de:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 2 años
  answer: C
  explanation: Para una primera ofensa de DUI en las USVI, el tribunal generalmente
    ordena una suspensión obligatoria de la licencia de seis meses.
- id: 132
  category: alcohol_drugs_health
  question: ¿En qué parte del vehículo es ilegal poseer un contenedor abierto de una
    bebida alcohólica en las Islas Vírgenes de los EE. UU.?
  choices:
    A: El maletero
    B: El compartimento de pasajeros
    C: La guantera con llave
    D: Detrás del último asiento vertical de un vehículo sin maletero
  answer: B
  explanation: La ley de Contenedores Abiertos de las USVI prohíbe la posesión de
    cualquier contenedor de bebida alcohólica abierto en el área de pasajeros de un
    vehículo motorizado mientras se encuentra en una vía pública.
- id: 133
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a conducir
    bajo la influencia de medicamentos recetados o de venta libre en las Islas Vírgenes
    de los EE. UU.?
  choices:
    A: Es legal siempre que el medicamento haya sido recetado por un médico
    B: Solo es ilegal si el medicamento es un narcótico
    C: Es ilegal conducir si el medicamento lo incapacita para conducir de manera
      segura
    D: Los medicamentos de venta libre nunca se consideran en casos de DUI
  answer: C
  explanation: La ley de las Islas Vírgenes establece que conducir bajo la influencia
    de cualquier droga (incluidos los medicamentos recetados o de venta libre) hasta
    un grado que haga que la persona sea incapaz de conducir de manera segura es un
    delito.
- id: 134
  category: alcohol_drugs_health
  question: 'Para una persona que opera un vehículo motorizado comercial en las Islas
    Vírgenes de los EE. UU., el límite de BAC es:'
  choices:
    A: 0.01%
    B: 0.02%
    C: 0.04%
    D: 0.08%
  answer: C
  explanation: De acuerdo con las regulaciones federales y locales, el límite de BAC
    para los conductores comerciales (titulares de CDL) que operan un vehículo comercial
    es del 0.04%.
- id: 135
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma de reducir su concentración
    de alcohol en sangre (BAC) antes de conducir?
  choices:
    A: Beber café negro cargado
    B: Tomar una ducha fría
    C: Hacer ejercicio vigorosamente
    D: Permitir que pase el tiempo para que su cuerpo procese el alcohol
  answer: D
  explanation: Solo el tiempo permite que el cuerpo metabolice el alcohol. El café,
    las duchas y el ejercicio no reducen los niveles de BAC.
- id: 136
  category: alcohol_drugs_health
  question: Si está tomando un nuevo medicamento recetado, ¿qué debe hacer antes de
    conducir en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Conducir solo por calles secundarias para probar su reacción
    B: Revisar la etiqueta para ver las advertencias o preguntar a su médico/farmacéutico
      sobre los efectos secundarios
    C: Beber una bebida con cafeína para contrarrestar cualquier somnolencia
    D: Esperar al menos 30 minutos después de tomarlo y luego conducir como de costumbre
  answer: B
  explanation: Los conductores son responsables de saber cómo les afectan sus medicamentos.
    Siempre debe consultar a un profesional o leer las etiquetas de advertencia sobre
    el manejo de maquinaria pesada o vehículos motorizados.
- id: 137
  category: alcohol_drugs_health
  question: 'Según la ley de las Islas Vírgenes de los EE. UU., una segunda condena
    por DUI dentro de un período de diez años puede resultar en la revocación de la
    licencia por hasta:'
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: Permanentemente
  answer: C
  explanation: Los infractores reincidentes de DUI enfrentan sanciones significativamente
    más severas en las USVI, incluido un período de revocación de la licencia que
    puede extenderse a tres años por una segunda ofensa.
- id: 138
  category: alcohol_drugs_health
  question: 'Si un conductor de las Islas Vírgenes de los EE. UU. tiene una condición
    médica como epilepsia o diabetes que pueda afectar su capacidad para conducir,
    debe:'
  choices:
    A: Dejar de conducir inmediatamente y entregar su licencia para siempre
    B: Notificar al BMV y proporcionar un informe médico de un médico
    C: Conducir solo durante las horas del día
    D: Mantener su condición en secreto para evitar perder su licencia
  answer: B
  explanation: Los conductores con condiciones médicas que puedan afectar la conducción
    deben informarlas a la Oficina de Vehículos Motorizados (BMV) y, a menudo, se
    les requiere presentar evaluaciones médicas periódicas para mantener sus privilegios
    de conducir.
- id: 139
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por una primera condena por conducir bajo la
    influencia (DUI) en las Islas Vírgenes de los EE. UU.?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: Según el Título 20, Sección 493 de las USVI, una primera condena por
    DUI conlleva una multa de no menos de $300 y no más de $1,000.
- id: 140
  category: penalties_and_points
  question: Bajo el sistema de puntos del BMV de las Islas Vírgenes de los EE. UU.,
    ¿cuántos puntos se evalúan contra su historial de manejo por una condena de conducción
    temeraria?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción mayor en las USVI
    y resulta en la adición de 6 puntos al historial del conductor.
- id: 141
  category: penalties_and_points
  question: Si se le condena por exceder el límite de velocidad por más de 21 millas
    por hora en las Islas Vírgenes de los EE. UU., ¿cuántos puntos se añadirán a su
    licencia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: C
  explanation: El BMV de las Islas Vírgenes de los EE. UU. asigna 4 puntos por infracciones
    de exceso de velocidad en las que el conductor supera el límite por 21 mph o más.
- id: 142
  category: penalties_and_points
  question: 'Bajo la Ley de Consentimiento Implícito de las Islas Vírgenes de los
    EE. UU., si se niega a someterse a una prueba química de alcohol o drogas, su
    licencia de conducir será suspendida automáticamente por:'
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Negarse a realizar una prueba de aliento, sangre u orina cuando lo
    solicita un oficial resulta en una suspensión automática de la licencia por 6
    meses por una primera infracción.
- id: 143
  category: penalties_and_points
  question: En las Islas Vírgenes de los EE. UU., ¿cuál es la multa por una primera
    infracción por usar un teléfono móvil de mano mientras opera un vehículo motorizado
    en movimiento?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: La ley de las Islas Vírgenes de los EE. UU. prohíbe el uso de dispositivos
    de mano mientras se conduce; una primera infracción conlleva una multa de $100.
- id: 144
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por no detenerse ante un autobús escolar que
    está recogiendo o dejando niños en las Islas Vírgenes de los EE. UU.?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar es una violación de seguridad
    grave y conlleva 4 puntos en el registro de conducir de las Islas Vírgenes de
    los EE. UU.
- id: 145
  category: penalties_and_points
  question: Debido a que el tráfico en las Islas Vírgenes de los EE. UU. circula por
    la izquierda, conducir por el lado derecho de la carretera es una infracción.
    ¿Cuántos puntos conlleva esta infracción?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: C
  explanation: Conducir por el lado equivocado de la carretera (el lado derecho en
    las Islas Vírgenes de los EE. UU.) resulta en la adición de 3 puntos a su registro
    de conducir.
- id: 146
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su registro de conducir de las Islas Vírgenes
    de los EE. UU. por no ceder el paso a un vehículo de emergencia?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: B
  explanation: No ceder el paso a un vehículo de emergencia (como una ambulancia o
    un coche de policía con sirenas/luces) resulta en 3 puntos.
- id: 147
  category: penalties_and_points
  question: En las Islas Vírgenes de los EE. UU., ¿cuál es la multa para un conductor
    que sea sorprendido con un recipiente abierto de una bebida alcohólica en el compartimento
    de pasajeros de un vehículo?
  choices:
    A: $50
    B: $100
    C: $200
    D: $500
  answer: C
  explanation: Según el Título 20, Sección 493g de las Islas Vírgenes de los EE. UU.,
    la multa por una infracción de recipiente abierto es de $200.
- id: 148
  category: penalties_and_points
  question: 'Tirar basura desde un vehículo motorizado es ilegal en las Islas Vírgenes
    de los EE. UU. La condena por esta infracción puede resultar en una multa de hasta:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: D
  explanation: Las Islas Vírgenes de los EE. UU. aplican leyes estrictas contra el
    arrojo de basura; tirar basura desde un vehículo puede resultar en multas que
    alcanzan los $1,000.
- id: 149
  category: penalties_and_points
  question: 'Bajo la ley de ''Consentimiento Implícito'' de las Islas Vírgenes de
    los EE. UU., si se niega a someterse a una prueba química de su aliento, sangre
    u orina cuando lo solicite un oficial:'
  choices:
    A: Su licencia será suspendida por al menos 90 días
    B: Se le multará con $50 y será liberado
    C: No se puede tomar ninguna medida sin una orden judicial
    D: Solo recibirá una advertencia por la primera negativa
  answer: A
  explanation: Al conducir en las Islas Vírgenes de los EE. UU., usted ha dado su
    consentimiento para las pruebas químicas. La negativa resulta en una suspensión
    administrativa automática de la licencia, típicamente por 90 días por una primera
    negativa.
- id: 150
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su registro de conducir de las Islas Vírgenes
    de los EE. UU. por no detenerse ante un autobús escolar con sus luces rojas intermitentes?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 6 puntos
  answer: D
  explanation: Rebasar un autobús escolar detenido con luces rojas intermitentes es
    una violación de seguridad importante en las Islas Vírgenes de los EE. UU. y conlleva
    una penalización de 6 puntos.
- id: 151
  category: penalties_and_points
  question: 'En las Islas Vírgenes de los EE. UU., si se le condena por conducir sin
    el seguro de responsabilidad civil obligatorio para terceros, la multa mínima
    es:'
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Conducir sin un seguro válido en las USVI es una infracción grave con
    una multa mínima de $500 y la posibilidad de que el vehículo sea confiscado.
- id: 152
  category: penalties_and_points
  question: 'Un conductor en las Islas Vírgenes de los EE. UU. que sea condenado por
    "Abandonar la escena de un accidente" (Hit and Run) que involucre lesiones personales
    se enfrenta a una revocación de la licencia de al menos:'
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: Abandonar la escena de un accidente que involucre lesiones es un delito
    grave en las USVI, y la revocación obligatoria de la licencia por al menos un
    año es el estándar.
- id: 153
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su licencia de conducir de las USVI por una
    infracción de exceso de velocidad de 11 a 15 millas por hora sobre el límite establecido?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Exceder el límite de velocidad entre 11 y 15 mph en las USVI generalmente
    resulta en 3 puntos en su historial de conducción.
- id: 154
  category: penalties_and_points
  question: En las Islas Vírgenes de los EE. UU., ¿cuál es la sanción para un conductor
    que no use el cinturón de seguridad?
  choices:
    A: Una multa de $25 a $100
    B: Una estancia obligatoria de 24 horas en la cárcel
    C: 3 puntos en el historial de conducción
    D: Suspensión de la licencia por 10 días
  answer: A
  explanation: La ley de uso obligatorio del cinturón de seguridad de las USVI (Título
    20, Sección 466) impone una multa que oscila entre $25 y $100 por no usar el cinturón
    de seguridad.
- id: 155
  category: penalties_and_points
  question: 'Si un conductor de las USVI acumula 12 o más puntos en un período de
    12 meses, su licencia será suspendida por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Bajo el sistema de puntos de las USVI, acumular 12 puntos en un año
    conlleva una suspensión obligatoria de 90 días de los privilegios de conducir.
- id: 156
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones conlleva el mayor número de puntos
    (6 puntos) en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Adelantamiento indebido
    B: Seguir a otro vehículo demasiado cerca
    C: Conducir por el lado equivocado de la carretera
    D: No señalizar
  answer: C
  explanation: Debido a que en las USVI se conduce por la izquierda, conducir por
    la derecha (el lado equivocado) es un peligro mayor y conlleva 6 puntos.
- id: 157
  category: penalties_and_points
  question: 'Un conductor de las USVI condenado por una primera infracción de DUI
    (conducir bajo los efectos del alcohol o drogas) puede tener su licencia de conducir
    suspendida por un período de:'
  choices:
    A: 30 a 60 días
    B: 90 días a 180 días
    C: 6 meses a 1 año
    D: 2 años a 5 años
  answer: C
  explanation: Para una primera condena por DUI en las Islas Vírgenes de los EE. UU.,
    el tribunal generalmente ordena una suspensión de la licencia que oscila entre
    6 meses y 1 año.
- id: 158
  category: sharing_the_road
  question: En las Islas Vírgenes de los EE. UU., cuando un autobús escolar se detiene
    en una carretera de dos carriles con sus luces rojas intermitentes y el brazo
    de parada extendido, ¿qué debe hacer un conductor que se aproxima desde la dirección
    opuesta?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse al menos a 15 pies de distancia del autobús
    C: Continuar conduciendo ya que el autobús está en el otro lado
    D: Tocar la bocina para advertir a los niños y pasar lentamente
  answer: B
  explanation: De acuerdo con las leyes de tránsito de las USVI, los conductores que
    se aproximan desde cualquier dirección deben detenerse ante un autobús escolar
    con luces rojas intermitentes en una carretera de dos carriles. Debe permanecer
    detenido hasta que las luces dejen de parpadear.
- id: 159
  category: sharing_the_road
  question: Debido a que el tráfico en las Islas Vírgenes de los EE. UU. circula por
    el lado izquierdo de la carretera, ¿hacia dónde debe hacerse a un lado cuando
    se aproxima un vehículo de emergencia con sirenas y luces intermitentes?
  choices:
    A: Hacia el borde derecho de la carretera
    B: Hacia el borde izquierdo de la carretera
    C: Detenerse exactamente donde está en medio del carril
    D: Aumentar la velocidad para apartarse del camino del vehículo
  answer: B
  explanation: En las USVI, el Título 20, Sección 495(e) requiere que los conductores
    cedan el paso y se detengan en el borde izquierdo o en la acera de la carretera
    cuando se aproxima un vehículo de emergencia.
- id: 160
  category: sharing_the_road
  question: 'Al caminar por una carretera de las Islas Vírgenes de los EE. UU. que
    carece de aceras, los peatones están legalmente obligados a caminar:'
  choices:
    A: En el lado izquierdo de la carretera con el flujo del tráfico
    B: En el lado derecho de la carretera de frente al tráfico que viene en sentido
      contrario
    C: En el centro de la carretera para una mejor visibilidad
    D: En el lado que tenga más sombra
  answer: B
  explanation: La ley de las USVI exige que los peatones caminen por el lado derecho
    de la carretera, de frente al tráfico que viene en sentido contrario, cuando no
    hay aceras disponibles.
- id: 161
  category: sharing_the_road
  question: En las Islas Vírgenes de los EE. UU., ¿cuál es la distancia mínima legal
    de seguimiento que debe mantener al conducir detrás de un equipo de bomberos (camión
    de bomberos) que responde a una alarma?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Según el Título 20, Sección 501 de las Islas Vírgenes de los EE. UU.
    (USVI), es ilegal seguir a cualquier equipo de bomberos que viaje en respuesta
    a una alarma de incendio a una distancia menor de 500 pies.
- id: 162
  category: sharing_the_road
  question: 'Cuando un peatón cruza la calle guiado por un perro guía o lleva un bastón
    blanco (con o sin punta roja), los conductores de las Islas Vírgenes de los EE.
    UU. deben:'
  choices:
    A: Tocar la bocina para avisarles que usted está allí
    B: Reducir la velocidad y continuar si el peatón se detiene
    C: Detenerse por completo y tomar precauciones para evitar lesiones
    D: Ceder el paso solo si hay un cruce de peatones marcado
  answer: C
  explanation: Los conductores deben tomar precauciones especiales y detenerse por
    completo ante peatones ciegos o con discapacidad visual que utilicen un perro
    guía o un bastón blanco, independientemente de si el cruce de peatones está marcado
    o no.
- id: 163
  category: sharing_the_road
  question: En las Islas Vírgenes de los EE. UU., los ciclistas tienen los mismos
    derechos y responsabilidades que los conductores de vehículos motorizados. ¿En
    qué lado de la carretera debe circular un ciclista?
  choices:
    A: En el lado derecho, de frente al tráfico
    B: En el lado izquierdo, con el flujo del tráfico
    C: En el centro del carril en todo momento
    D: Solo por la acera
  answer: B
  explanation: Dado que el tráfico en las Islas Vírgenes de los EE. UU. circula por
    la izquierda, los ciclistas deben circular por el lado izquierdo de la carretera,
    moviéndose en la misma dirección que el resto del tráfico vehicular.
- id: 164
  category: sharing_the_road
  question: Al rebasar a un ciclista en las Islas Vírgenes de los EE. UU., ¿cuál es
    la distancia de seguridad recomendada para rebasar?
  choices:
    A: Al menos 1 pie
    B: Al menos 3 pies
    C: Al menos 5 pies
    D: Al menos 10 pies
  answer: B
  explanation: El Manual del Conductor de las Islas Vírgenes de los EE. UU. y las
    pautas de seguridad recomiendan dar a los ciclistas al menos 3 pies de espacio
    libre al rebasarlos para garantizar su seguridad.
- id: 165
  category: sharing_the_road
  question: 'Los camiones grandes tienen puntos ciegos significativos donde un automóvil
    puede ''desaparecer'' de la vista del conductor. Estas áreas se conocen comúnmente
    como:'
  choices:
    A: Las Zonas de Peligro (Danger Zones)
    B: Las No-Zonas (No-Zones)
    C: Los Puntos Sigilosos (Stealth Spots)
    D: Las Esquinas Ciegas (Blind Corners)
  answer: B
  explanation: La 'No-Zone' se refiere a los grandes puntos ciegos alrededor de la
    parte delantera, trasera y laterales de los camiones y autobuses donde el conductor
    no puede ver a otros vehículos.
- id: 166
  category: sharing_the_road
  question: 'Si conduce en las Islas Vírgenes de los EE. UU. y se aproxima a un vehículo
    de emergencia estacionado con sus luces intermitentes a un lado de la carretera,
    usted debe:'
  choices:
    A: Mantener su velocidad y permanecer en su carril
    B: Reducir la velocidad y, si es seguro hacerlo, cambiarse al carril más alejado
      del vehículo
    C: Detenerse inmediatamente para ver si necesitan ayuda
    D: Acelerar para pasar la escena lo más rápido posible
  answer: B
  explanation: Los protocolos de seguridad requieren que los conductores reduzcan
    la velocidad y se muevan de carril al acercarse a vehículos de emergencia estacionados
    para proporcionar un margen de seguridad a los socorristas.
- id: 167
  category: sharing_the_road
  question: 'Cuando un autobús escolar se detiene en una carretera con una mediana
    física o barrera que separa las direcciones de viaje, los conductores en el lado
    opuesto de la barrera deben:'
  choices:
    A: Detenerse y esperar a que el autobús se mueva
    B: Reducir la velocidad a 10 mph
    C: Continuar con precaución, ya que no están obligados a detenerse
    D: Detenerse solo si hay niños cruzando la barrera
  answer: C
  explanation: En las Islas Vírgenes de los EE. UU., si una carretera está dividida
    por una barrera física o mediana, el tráfico que viaja en la dirección opuesta
    a un autobús escolar detenido generalmente no está obligado a detenerse.
- id: 168
  category: sharing_the_road
  question: Los motociclistas son más vulnerables que los conductores de automóviles.
    ¿Cuál es la distancia de seguimiento recomendada detrás de una motocicleta en
    las Islas Vírgenes de los EE. UU.?
  choices:
    A: 1 segundo
    B: Al menos 2 a 4 segundos
    C: Exactamente el largo de un automóvil
    D: 50 pies independientemente de la velocidad
  answer: B
  explanation: Se recomienda una distancia de seguimiento de 2 a 4 segundos para permitir
    suficiente tiempo de reacción si el motociclista vira bruscamente o frena de repente
    debido a peligros en la carretera como baches o grava.
- id: 169
  category: sharing_the_road
  question: Cuando un camión grande gira a la izquierda en una intersección en las
    Islas Vírgenes de los EE. UU., ¿por qué debe evitar colocarse junto a su lado
    izquierdo?
  choices:
    A: El camión puede abrirse hacia la derecha antes de completar el giro a la izquierda
    B: El camión no tiene espejos en el lado izquierdo
    C: Los camiones están obligados a girar solo desde el carril derecho
    D: Es ilegal estar en el lado izquierdo de un camión
  answer: A
  explanation: Los vehículos grandes a menudo necesitan abrirse hacia la derecha para
    no subir al bordillo al realizar un giro a la izquierda (ya que en las Islas Vírgenes
    se conduce por la izquierda). Colocarse a su lado puede resultar en un accidente
    por 'apretón'.
- id: 170
  category: sharing_the_road
  question: 'Según la ley de las Islas Vírgenes de los EE. UU., toda persona que circule
    en bicicleta por una calzada de noche debe estar equipada con una lámpara en la
    parte delantera que emita una luz blanca visible desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Para circular de noche, las regulaciones de las Islas Vírgenes de los
    EE. UU. requieren una luz blanca delantera visible desde 500 pies y un reflector
    o luz roja trasera.
- id: 171
  category: sharing_the_road
  question: 'Al seguir a un camión comercial grande, si no puede ver los espejos laterales
    del conductor del camión, usted está:'
  choices:
    A: En una buena posición para rebasar
    B: Siguiendo a una distancia segura
    C: En la "No-Zone" trasera (punto ciego) del camión
    D: Ayudando al conductor del camión a ahorrar combustible
  answer: C
  explanation: 'Una regla general para compartir la carretera con camiones es: "Si
    no puede ver al conductor en sus espejos, el conductor no puede verlo a usted".
    Seguir demasiado de cerca lo sitúa en la "No-Zone" trasera.'
- id: 172
  category: sharing_the_road
  question: En las Islas Vírgenes de los EE. UU., si no hay aceras, ¿en qué lado de
    la carretera deben caminar los peatones?
  choices:
    A: El lado izquierdo, con el flujo del tráfico
    B: El lado derecho, de frente al tráfico que viene en sentido contrario
    C: El lado izquierdo, de frente al tráfico que viene en sentido contrario
    D: El lado derecho, con el flujo del tráfico
  answer: B
  explanation: Dado que los vehículos circulan por la izquierda en las Islas Vírgenes
    de los EE. UU., los peatones que caminan por la carretera deben hacerlo por el
    lado derecho para estar de frente al tráfico que viene en sentido contrario.
- id: 173
  category: sharing_the_road
  question: Según la ley de las Islas Vírgenes de los EE. UU., ¿cuál es el requisito
    obligatorio para los conductores y pasajeros de motocicletas con respecto a los
    cascos?
  choices:
    A: Solo los pasajeros están obligados a usar casco
    B: Solo los conductores menores de 21 años están obligados a usar casco
    C: Tanto los conductores como los pasajeros deben usar un casco de seguridad debidamente
      abrochado
    D: Los cascos son opcionales si el límite de velocidad es inferior a 35 mph
  answer: C
  explanation: De acuerdo con el Código de las Islas Vírgenes de los EE. UU., Título
    20, Sección 465, ninguna persona podrá operar o viajar en una motocicleta a menos
    que use un casco de un tipo aprobado por el Comisionado de Policía.
- id: 174
  category: sharing_the_road
  question: 'Al compartir la carretera con camiones grandes en las Islas Vírgenes
    de los EE. UU., las "No-Zones" se refieren a:'
  choices:
    A: Áreas donde no se permite circular a los camiones
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: Zonas de estacionamiento específicas para vehículos comerciales
    D: El carril izquierdo de una autopista de varios carriles
  answer: B
  explanation: Las "No-Zones" son los grandes puntos ciegos alrededor de un camión
    donde el conductor no puede ver su vehículo. Si no puede ver la cara del conductor
    del camión en sus espejos laterales, él no puede verlo a usted.
- id: 175
  category: sharing_the_road
  question: 'Cuando una bicicleta circula por una carretera de las Islas Vírgenes
    de los EE. UU., generalmente se le requiere:'
  choices:
    A: Circular por el lado derecho de la carretera en contra del tráfico
    B: Circular por el lado izquierdo de la carretera con el flujo del tráfico
    C: Circular únicamente por las aceras
    D: Ceder el paso a todos los vehículos motorizados en todo momento
  answer: B
  explanation: En las Islas Vírgenes de los EE. UU., las bicicletas se consideran
    vehículos y deben seguir las mismas reglas de la carretera que los vehículos de
    motor, lo que incluye circular por el lado izquierdo con el tráfico.
- id: 176
  category: sharing_the_road
  question: 'Si ve a un peatón usando un bastón blanco o un perro guía en una intersección
    en las Islas Vírgenes de los EE. UU., usted debe:'
  choices:
    A: Tocar la bocina para hacerle saber que usted está allí
    B: Reducir la velocidad y continuar si no están en su carril
    C: Detenerse por completo y ceder el derecho de paso
    D: Conducir alrededor de ellos rápidamente
  answer: C
  explanation: La ley exige que los conductores tomen precauciones adicionales y cedan
    el derecho de paso a los peatones ciegos o con discapacidad visual que utilicen
    un bastón blanco o un perro guía.
- id: 177
  category: sharing_the_road
  question: 'Al seguir a una motocicleta en las Islas Vírgenes de los EE. UU., debe
    mantener una distancia de seguimiento de al menos:'
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 4 segundos
    D: 1 largo de automóvil
  answer: C
  explanation: Debido a que las motocicletas pueden detenerse más rápido que los automóviles
    y son más susceptibles a los peligros de la carretera como baches o grava (comunes
    en las Islas Vírgenes), se recomienda una distancia de seguimiento de 4 segundos
    por seguridad.
- id: 178
  category: sharing_the_road
  question: En las Islas Vírgenes de los EE. UU., ¿es legal que una motocicleta realice
    el "lane splitting" (conducir entre filas de vehículos detenidos o en movimiento)?
  choices:
    A: Sí, es legal en todo momento
    B: Sí, pero solo si el tráfico se mueve a menos de 10 mph
    C: No, generalmente se considera ilegal y peligroso
    D: Solo durante situaciones de emergencia
  answer: C
  explanation: El "lane splitting" (división de carril) no está permitido en las Islas
    Vírgenes de los EE. UU.; las motocicletas tienen derecho al uso total de un carril
    y deben seguir la misma disciplina de carril que los demás vehículos.
- id: 179
  category: sharing_the_road
  question: 'Al rebasar a un ciclista en una carretera estrecha en las Islas Vírgenes
    de los EE. UU., usted debe:'
  choices:
    A: Pasar a su lado lo más rápido posible
    B: Esperar hasta que sea seguro rebasar y dejar al menos tres pies de espacio
      libre
    C: Tocar la bocina repetidamente hasta que se aparten de la carretera
    D: Rebasarlos por el lado izquierdo de la carretera
  answer: B
  explanation: Los conductores deben ejercer el debido cuidado y proporcionar suficiente
    espacio libre (generalmente aceptado como al menos 3 pies) al rebasar a los ciclistas
    para evitar accidentes.
- id: 180
  category: sharing_the_road
  question: 'En las Islas Vírgenes de los EE. UU., si va a girar a la izquierda y
    una motocicleta se aproxima en dirección opuesta, usted debe:'
  choices:
    A: Girar rápidamente antes de que llegue la motocicleta
    B: Ceder el paso y esperar a que pase la motocicleta
    C: Asumir que la motocicleta reducirá la velocidad por usted
    D: Usar las luces altas para indicar que va a girar
  answer: B
  explanation: Muchos accidentes de motocicleta ocurren en las intersecciones cuando
    un conductor gira a la izquierda frente a una motocicleta que se aproxima. Debe
    ceder el derecho de paso al tráfico que viene en sentido contrario, incluidas
    las motocicletas.
- id: 181
  category: sharing_the_road
  question: ¿Qué debe hacer si se encuentra con un cortejo fúnebre en una carretera
    de las Islas Vírgenes de los EE. UU.?
  choices:
    A: Atravesar el cortejo para llegar a su giro
    B: Ceder el derecho de paso y no unirse ni interferir con el cortejo
    C: Tocar la bocina para mostrar respeto
    D: Rebasar el cortejo por la derecha
  answer: B
  explanation: Los conductores deben mostrar respeto y seguir las costumbres y leyes
    locales cediendo el derecho de paso a los cortejos fúnebres y no rompiendo la
    línea de la procesión.
- id: 182
  category: sharing_the_road
  question: 'Cuando un autobús de VITRAN está señalizando para reincorporarse al tráfico
    desde una parada de autobús designada en las Islas Vírgenes de los EE. UU., usted
    debe:'
  choices:
    A: Acelerar para pasar al autobús antes de que salga
    B: Ceder el derecho de paso al autobús si es seguro hacerlo
    C: Mantener su velocidad; el autobús debe esperar a que haya un espacio
    D: Detenerse por completo y esperar a que el autobús llegue a la siguiente parada
  answer: B
  explanation: Es una práctica de conducción segura y, a menudo, una cortesía en las
    Islas Vírgenes de los EE. UU. ceder el paso a los autobuses de transporte público
    (VITRAN) cuando están señalizando para reincorporarse al flujo del tráfico.
- id: 183
  category: sharing_the_road
  question: ¿Por qué es particularmente peligroso seguir a un camión grande demasiado
    de cerca en las colinas empinadas de St. Thomas o St. John?
  choices:
    A: El camión podría rodar un poco hacia atrás al arrancar desde una parada
    B: El escape del camión podría dañar su automóvil
    C: El camión acelerará al subir la colina
    D: Los camiones están obligados a detenerse en cada cima de la colina
  answer: A
  explanation: En el terreno empinado de las Islas Vírgenes de los EE. UU., los vehículos
    grandes pueden rodar hacia atrás cuando el conductor suelta el freno para engranar
    las marchas. Seguir demasiado de cerca aumenta el riesgo de una colisión.
- id: 184
  category: vehicle_information
  question: Según la ley de las Islas Vírgenes de los EE. UU., ¿cuál es el porcentaje
    mínimo de transmisión de luz permitido para las ventanas laterales delanteras
    de un vehículo?
  choices:
    A: 20%
    B: 35%
    C: 50%
    D: 70%
  answer: B
  explanation: La ley de las Islas Vírgenes de los EE. UU. exige que el tinte de las
    ventanas laterales delanteras debe permitir que pase al menos el 35% de la luz.
- id: 185
  category: vehicle_information
  question: 'En las Islas Vírgenes de los EE. UU., los faros delanteros de su vehículo
    deben estar encendidos durante cuál de los siguientes horarios:'
  choices:
    A: Desde una hora después del atardecer hasta una hora antes del amanecer
    B: De 7:00 PM a 6:00 AM solamente
    C: Desde el atardecer hasta el amanecer
    D: Solo cuando está lloviendo
  answer: C
  explanation: Las regulaciones de seguridad estándar en las Islas Vírgenes de los
    EE. UU. requieren que los faros delanteros estén encendidos desde el atardecer
    hasta el amanecer y durante períodos de baja visibilidad.
- id: 186
  category: vehicle_information
  question: 'En las Islas Vírgenes de los EE. UU., debe atenuar sus luces altas cuando
    siga a otro vehículo por detrás a una distancia de:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 600 pies
  answer: B
  explanation: Al seguir a otro vehículo, debe bajar las luces altas a menos de 300
    pies para evitar reflejar el resplandor en los espejos del conductor que va delante.
- id: 187
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para vehículos de pasajeros en las Islas Vírgenes de los EE. UU.?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos se consideran inseguros y no pasarán la inspección si
    la profundidad de la banda de rodadura es inferior a 2/32 de pulgada.
- id: 188
  category: vehicle_information
  question: 'Todo vehículo de motor operado en las carreteras de las Islas Vírgenes
    de los EE. UU. debe estar equipado con una bocina que se pueda escuchar desde
    una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: B
  explanation: El código de equipo de vehículos de las Islas Vírgenes de los EE. UU.
    requiere una bocina audible desde una distancia no menor a 200 pies.
- id: 189
  category: vehicle_information
  question: Según la ley de las Islas Vírgenes de los EE. UU., el espejo retrovisor
    de un vehículo debe permitir al conductor ver la carretera por una distancia de
    al menos ______ hacia atrás.
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los espejos deben ajustarse para proporcionar una visión clara de la
    carretera durante al menos 200 pies detrás del vehículo.
- id: 190
  category: vehicle_information
  question: ¿Cuál es el requisito para la luz de la placa de matrícula trasera de
    un vehículo en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Debe ser azul o verde
    B: Debe hacer que la placa sea visible desde 50 pies de distancia
    C: Solo se requiere si se conduce fuera de los límites de la ciudad
    D: Debe ser blanca y hacer que la placa sea legible desde 50 pies de distancia
  answer: D
  explanation: La placa de matrícula trasera debe estar iluminada por una luz blanca
    para que sea claramente legible desde una distancia de 50 pies.
- id: 191
  category: vehicle_information
  question: En las Islas Vírgenes de los EE. UU., las luces de freno de un vehículo
    deben ser visibles desde una distancia de al menos ______ bajo la luz solar normal.
  choices:
    A: 50 pies
    B: 100 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: Las luces de freno (lámparas de parada) deben ser visibles desde una
    distancia de 300 pies durante el día para asegurar que los conductores que vienen
    detrás tengan tiempo de reaccionar.
- id: 192
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos es OBLIGATORIO para todas las motocicletas
    operadas en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Un sidecar
    B: Un parabrisas de al menos 15 pulgadas de alto
    C: Casco protector para el conductor y el pasajero
    D: Transmisión automática
  answer: C
  explanation: La ley de las Islas Vírgenes de los EE. UU. exige que tanto los conductores
    como los pasajeros de motocicletas usen cascos protectores en todo momento mientras
    el vehículo esté en movimiento.
- id: 193
  category: vehicle_information
  question: Si transporta una carga que se extiende más de ______ más allá de la parte
    trasera de su vehículo en las Islas Vírgenes de los EE. UU., debe colocar una
    bandera roja durante el día.
  choices:
    A: 2 pies
    B: 4 pies
    C: 6 pies
    D: 8 pies
  answer: B
  explanation: Cualquier carga que se extienda más de 4 pies más allá de la parte
    trasera de la plataforma o carrocería de un vehículo debe marcarse con una bandera
    roja (de 12 pulgadas cuadradas) o una luz roja por la noche.
- id: 194
  category: vehicle_information
  question: En las Islas Vírgenes de los EE. UU., ¿cuál es la altura máxima permitida
    para cualquier vehículo, incluida su carga, sin un permiso especial?
  choices:
    A: 12 pies, 6 pulgadas
    B: 13 pies, 6 pulgadas
    C: 14 pies
    D: 15 pies
  answer: B
  explanation: La altura legal máxima para vehículos en las Islas Vírgenes de los
    EE. UU. es de 13 pies y 6 pulgadas. Cualquier altura superior requiere un permiso
    especial del Departamento de Obras Públicas.
- id: 195
  category: vehicle_information
  question: 'En las Islas Vírgenes de los EE. UU., la placa de matrícula trasera debe
    estar iluminada de modo que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 75 pies
    D: 100 pies
  answer: B
  explanation: La ley exige una luz blanca para iluminar la placa de matrícula trasera,
    haciéndola visible desde una distancia de 50 pies hacia atrás.
- id: 196
  category: vehicle_information
  question: En las Islas Vírgenes de los EE. UU., ¿cuál de las siguientes afirmaciones
    es verdadera con respecto al uso de un silenciador (muffler) en su vehículo?
  choices:
    A: Los silenciadores son opcionales para vehículos de menos de 2,000 libras
    B: Se permiten derivaciones de silenciador (cutouts) solo para uso fuera de carretera
    C: Cada vehículo debe tener un silenciador para evitar ruidos excesivos y humo
    D: Los silenciadores solo son obligatorios para camiones comerciales
  answer: C
  explanation: La ley de las Islas Vírgenes de los EE. UU. exige que cada vehículo
    de motor esté equipado con un silenciador en funcionamiento constante para evitar
    ruidos excesivos o inusuales y humo molesto.
- id: 197
  category: vehicle_information
  question: 'Con respecto al parabrisas de un vehículo en las Islas Vírgenes de los
    EE. UU., el tintado solo está permitido:'
  choices:
    A: En todo el parabrisas si tiene un 70% de transmisión de luz
    B: En ninguna parte; no se permite tintado en el parabrisas
    C: Solo en las 6 pulgadas superiores del parabrisas
    D: Solo si el conductor tiene una exención médica para toda la superficie
  answer: C
  explanation: La ley de las Islas Vírgenes de los EE. UU. permite el tintado solo
    en las seis pulgadas superiores del parabrisas, a menudo denominada el área de
    la línea AS-1.
- id: 198
  category: vehicle_information
  question: En las Islas Vírgenes de los EE. UU., ¿cada vehículo de motor debe estar
    equipado con al menos cuántos juegos de frenos?
  choices:
    A: Uno (el freno de pie)
    B: Dos (un freno de servicio y un freno de estacionamiento)
    C: Tres (delantero, trasero y de emergencia)
    D: Cuatro (uno para cada rueda)
  answer: B
  explanation: 'Los vehículos deben tener dos medios separados para aplicar los frenos:
    un freno de servicio (freno de pie) y un freno de estacionamiento, cada uno de
    los cuales debe ser efectivo.'
- id: 199
  category: vehicle_information
  question: En las Islas Vírgenes de los EE. UU., ¿de qué color deben ser las luces
    de las señales de giro en la parte delantera de un vehículo?
  choices:
    A: Blanco o Ámbar
    B: Rojo o Ámbar
    C: Azul o Blanco
    D: Verde o Ámbar
  answer: A
  explanation: Las señales de giro delanteras deben ser blancas o ámbar, mientras
    que las señales de giro traseras deben ser rojas o ámbar.
- id: 200
  category: vehicle_information
  question: A excepción de los vehículos de emergencia, ¿es ilegal en las Islas Vírgenes
    de los EE. UU. mostrar una luz de qué color que sea visible desde el frente directo
    del vehículo?
  choices:
    A: Blanco
    B: Ámbar
    C: Rojo
    D: Amarillo
  answer: C
  explanation: La ley de las Islas Vírgenes de los EE. UU. prohíbe la exhibición de
    luces rojas visibles directamente desde el frente del centro de un vehículo que
    no sea de emergencia para evitar confusiones con los servicios de emergencia.
- id: 201
  category: signs_and_signals
  question: En las Islas Vírgenes de los EE. UU., donde el tráfico circula por el
    lado izquierdo de la carretera, ¿cuál es la regla con respecto a girar a la izquierda
    en una luz roja?
  choices:
    A: Siempre está prohibido.
    B: Está permitido después de una parada completa, cediendo el paso al tráfico
      y a los peatones, a menos que una señal lo prohíba.
    C: Solo está permitido entre las 12:00 AM y las 5:00 AM.
    D: Está permitido solo si se encuentra en un vehículo de alta ocupación (HOV).
  answer: B
  explanation: En las Islas Vírgenes de los EE. UU., los conductores pueden girar
    a la izquierda con luz roja después de detenerse por completo y ceder el paso
    a todo el resto del tráfico y a los peatones, siempre que no haya una señal que
    prohíba el giro. Este es el equivalente para el tráfico por la izquierda de la
    regla de 'giro a la derecha en rojo' de los Estados Unidos continentales.
- id: 202
  category: signs_and_signals
  question: Al utilizar señales manuales en las Islas Vírgenes de los EE. UU., ¿qué
    señal indica que tiene la intención de detenerse o disminuir la velocidad repentinamente?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera de la ventana.
    B: Brazo izquierdo extendido hacia arriba.
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás.
    D: Brazo derecho extendido recto hacia afuera de la ventana.
  answer: C
  explanation: Para señalar una parada o una disminución de la velocidad mediante
    señales manuales, el conductor debe extender el brazo izquierdo por la ventana
    y apuntar hacia abajo con la palma de la mano hacia atrás.
- id: 203
  category: signs_and_signals
  question: ¿Cuál señal manual es la forma correcta de indicar un giro a la derecha
    en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera.
    B: Brazo izquierdo extendido hacia arriba en un ángulo de 90 grados.
    C: Brazo izquierdo extendido hacia abajo.
    D: Brazo derecho movido en movimiento circular.
  answer: B
  explanation: Aunque en las Islas Vírgenes de los EE. UU. se conduce por la izquierda,
    los vehículos suelen tener el volante a la izquierda. Para señalar un giro a la
    derecha, el conductor extiende el brazo izquierdo por la ventana y lo dobla hacia
    arriba en un ángulo de 90 grados.
- id: 204
  category: signs_and_signals
  question: En las Islas Vírgenes de los EE. UU., ¿qué indica una línea amarilla continua
    en su lado del centro de la carretera?
  choices:
    A: Puede adelantar a otros vehículos en cualquier momento.
    B: Se encuentra en una zona de sentido único.
    C: Está prohibido adelantar en su lado de la carretera.
    D: Debe detenerse y esperar a que la luz cambie a verde.
  answer: C
  explanation: Una línea amarilla continua en su lado de la carretera indica una 'zona
    de no adelantar'. No se le permite cruzar esta línea para adelantar a otros vehículos.
- id: 205
  category: signs_and_signals
  question: Al acercarse a una rotonda en las Islas Vírgenes de los EE. UU., ¿en qué
    dirección debe fluir el tráfico?
  choices:
    A: En sentido contrario a las agujas del reloj
    B: En el sentido de las agujas del reloj
    C: En cualquier dirección que tenga menos tráfico
    D: El tráfico puede fluir en cualquier dirección
  answer: B
  explanation: Debido a que las Islas Vírgenes de los EE. UU. siguen la regla de conducir
    por el lado izquierdo de la carretera, el tráfico entra y se desplaza por las
    rotondas en el sentido de las agujas del reloj.
- id: 206
  category: signs_and_signals
  question: ¿Qué significa una luz de tráfico roja intermitente en una intersección
    en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Reduzca la velocidad y proceda con precaución.
    B: La luz está a punto de cambiar a verde.
    C: Deténgase por completo y proceda solo cuando sea seguro hacerlo, tratándola
      como una señal de pare (stop).
    D: Ceda el paso únicamente al tráfico que viene por la derecha.
  answer: C
  explanation: Una luz roja intermitente tiene el mismo significado que una señal
    de pare. Debe detenerse por completo y proceder solo cuando el camino esté despejado.
- id: 207
  category: signs_and_signals
  question: 'Una luz amarilla intermitente en una intersección significa que usted
    debe:'
  choices:
    A: Detenerse y esperar a que la luz cambie a verde.
    B: Aumentar la velocidad para despejar la intersección rápidamente.
    C: Reducir la velocidad y proceder con precaución.
    D: Detenerse y ceder el paso a todos los peatones antes de proceder.
  answer: C
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y estar especialmente alerta al cruzar la intersección.
- id: 208
  category: signs_and_signals
  question: ¿Qué indican las líneas blancas discontinuas pintadas en el pavimento?
  choices:
    A: El tráfico se mueve en direcciones opuestas.
    B: El tráfico se mueve en la misma dirección y se permiten los cambios de carril.
    C: El borde de la calzada.
    D: Una zona de cruce de peatones.
  answer: B
  explanation: Las líneas blancas discontinuas separan los carriles de tráfico que
    se mueven en la misma dirección. Los conductores pueden cruzar estas líneas para
    cambiar de carril cuando sea seguro hacerlo.
- id: 209
  category: signs_and_signals
  question: ¿Qué forma de señal se utiliza exclusivamente para las señales de 'Ceder
    el paso' (Yield) en las Islas Vírgenes de los EE. UU.?
  choices:
    A: Octágono
    B: Diamante
    C: Triángulo invertido
    D: Banderín
  answer: C
  explanation: La señal de 'Ceder el paso' es siempre un triángulo equilátero que
    apunta hacia abajo (triángulo invertido), generalmente de color rojo y blanco.
- id: 210
  category: signs_and_signals
  question: Una señal en forma de diamante con fondo amarillo es ¿qué tipo de señal?
  choices:
    A: Señal reglamentaria
    B: Señal de advertencia
    C: Señal de guía
    D: Señal de servicio
  answer: B
  explanation: Las señales amarillas en forma de diamante son señales de advertencia
    que alertan a los conductores sobre posibles peligros o cambios en las condiciones
    de la carretera más adelante.
- id: 211
  category: signs_and_signals
  question: ¿De qué color son las señales utilizadas para indicar zonas de construcción
    o mantenimiento?
  choices:
    A: Amarillo
    B: Verde
    C: Naranja
    D: Azul
  answer: C
  explanation: El naranja es el color estándar para las señales de construcción y
    mantenimiento para alertar a los conductores sobre las zonas de trabajo y la presencia
    de trabajadores.
- id: 212
  category: signs_and_signals
  question: 'Una señal en forma de banderín (triángulo lateral) colocada en el lado
    derecho de una carretera de doble sentido en las Islas Vírgenes de los EE. UU.
    (USVI) indica:'
  choices:
    A: Una zona escolar.
    B: Una zona de no rebasar.
    C: Una curva cerrada más adelante.
    D: Un cruce de ferrocarril.
  answer: B
  explanation: La señal en forma de banderín se utiliza específicamente para marcar
    el inicio de una zona de no rebasar (prohibido adelantar).
- id: 213
  category: signs_and_signals
  question: Cuando un semáforo está apagado (no funciona debido a un corte de energía),
    ¿cómo debe tratar la intersección?
  choices:
    A: Ceder el paso al vehículo más grande.
    B: Mantener la velocidad y proceder con precaución.
    C: Tratarla como una parada de cuatro vías (four-way stop).
    D: Esperar a que llegue un oficial de policía antes de avanzar.
  answer: C
  explanation: Si un semáforo no funciona, los conductores deben tratar la intersección
    como una parada obligatoria para todos (all-way stop), cediendo el paso a los
    vehículos que llegaron primero o al vehículo de la derecha si llegan al mismo
    tiempo.
- id: 214
  category: signs_and_signals
  question: Al señalizar un giro utilizando señales manuales en las Islas Vírgenes
    de los EE. UU. (USVI), ¿qué significa cuando el brazo izquierdo del conductor
    está extendido recto hacia afuera de la ventana?
  choices:
    A: El conductor está señalizando un giro a la derecha
    B: El conductor está señalizando un giro a la izquierda
    C: El conductor está disminuyendo la velocidad
    D: El conductor se está deteniendo
  answer: B
  explanation: Aunque los conductores de las USVI conducen por la izquierda, utilizan
    señales manuales estándar. Un brazo extendido recto indica un giro a la izquierda.
- id: 215
  category: signs_and_signals
  question: 'Para señalizar un giro a la derecha utilizando señales manuales en las
    Islas Vírgenes de los EE. UU., el conductor debe:'
  choices:
    A: Extender el brazo izquierdo recto hacia afuera
    B: Extender el brazo izquierdo hacia arriba
    C: Extender el brazo izquierdo hacia abajo
    D: Extender el brazo derecho recto hacia afuera
  answer: B
  explanation: La señal manual para un giro a la derecha es el brazo izquierdo extendido
    hacia arriba en un ángulo de 90 grados.
- id: 216
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar que se va a detener o a
    disminuir la velocidad en las Islas Vírgenes de los EE. UU. (USVI)?
  choices:
    A: Brazo izquierdo extendido hacia arriba
    B: Brazo izquierdo extendido recto hacia afuera
    C: Brazo izquierdo extendido hacia abajo, con la palma hacia atrás
    D: Agitar el brazo izquierdo en movimiento circular
  answer: C
  explanation: Para señalizar que se va a detener o a disminuir la velocidad, el brazo
    izquierdo debe extenderse hacia abajo con la palma de la mano hacia atrás.
- id: 217
  category: signs_and_signals
  question: 'En las Islas Vírgenes de los EE. UU. (USVI), una línea blanca discontinua
    pintada en el pavimento indica:'
  choices:
    A: Tráfico moviéndose en direcciones opuestas
    B: Una zona de no rebasar
    C: El borde de la calzada
    D: Tráfico moviéndose en la misma dirección, y se permiten los cambios de carril
  answer: D
  explanation: Las líneas blancas separan los carriles de tráfico que se mueven en
    la misma dirección. Una línea blanca discontinua significa que puede cruzarla
    para cambiar de carril si es seguro hacerlo.
- id: 218
  category: signs_and_signals
  question: En las Islas Vírgenes de los EE. UU., ¿de qué color son las señales reglamentarias
    que proporcionan información sobre leyes y regulaciones (como las señales de límite
    de velocidad)?
  choices:
    A: Amarillo con letras negras
    B: Naranja con letras negras
    C: Blanco con letras negras o rojas
    D: Verde con letras blancas
  answer: C
  explanation: Las señales reglamentarias, que le indican lo que debe o no debe hacer,
    suelen ser rectangulares y blancas con letras negras o rojas.
- id: 219
  category: signs_and_signals
  question: Cuando un semáforo muestra una luz roja fija en las Islas Vírgenes de
    los EE. UU. (USVI), ¿se le permite realizar un giro a la izquierda?
  choices:
    A: Sí, después de detenerse y ceder el paso al tráfico
    B: No, debe esperar a una luz verde o flecha
    C: Solo si está girando desde una calle de un solo sentido hacia otra calle de
      un solo sentido
    D: Solo durante las horas del día
  answer: B
  explanation: En las Islas Vírgenes de los EE. UU., debe permanecer detenido ante
    una luz roja. A diferencia de muchos estados de los EE. UU. continentales que
    permiten giros a la derecha en rojo, las USVI generalmente prohíben girar en rojo
    (que allí sería un giro a la izquierda) a menos que una señal lo permita específicamente.
- id: 220
  category: signs_and_signals
  question: ¿Cuál es el significado de una doble línea amarilla continua en el centro
    de la carretera en las Islas Vírgenes de los EE. UU. (USVI)?
  choices:
    A: Se permite rebasar desde cualquier dirección
    B: Se permite rebasar solo desde su lado
    C: Se prohíbe rebasar desde cualquier dirección
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas dobles continuas indican que no se permite rebasar
    al tráfico en ninguna de las dos direcciones.
