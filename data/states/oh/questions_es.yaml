questions:
- id: 1
  category: driver_testing
  question: ¿Cuál es el requisito de edad mínima para completar el examen de la vista
    y el examen de conocimientos en Ohio?
  choices:
    A: 15 años
    B: 15 años y seis meses
    C: 16 años
    D: 18 años
  answer: B
  explanation: Según el manual, a los 15 años y seis meses de edad, usted cumple con
    el requisito de edad mínima para completar el examen de la vista y el examen de
    conocimientos.
- id: 2
  category: driver_testing
  question: ¿Cuántas preguntas tiene el examen de conocimientos para conductores de
    Ohio?
  choices:
    A: 20 preguntas de opción múltiple
    B: 30 preguntas de opción múltiple
    C: 40 preguntas de opción múltiple
    D: 50 preguntas de opción múltiple
  answer: C
  explanation: El manual establece que el examen de conocimientos consta de 40 preguntas
    de opción múltiple.
- id: 3
  category: driver_testing
  question: ¿Cuál es el porcentaje mínimo de aprobación necesario para aprobar el
    examen de conocimientos?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: B
  explanation: El manual especifica que se necesita un porcentaje de aprobación del
    75% para aprobar el examen de conocimientos de 40 preguntas de opción múltiple.
- id: 4
  category: license_system
  question: Después de aprobar el examen de conocimientos, ¿cuánto tiempo tiene para
    comprar una Tarjeta de Identificación de Permiso de Instrucción Temporal (TIPIC)?
  choices:
    A: Dentro de 14 días
    B: Dentro de 30 días
    C: Dentro de 60 días
    D: Dentro de 90 días
  answer: C
  explanation: Si aprueba el examen de conocimientos, debe acudir a una Agencia de
    Licencias del Registrador Adjunto (Deputy Registrar License Agency) para comprar
    una TIPIC dentro de los 60 días posteriores a la aprobación del examen.
- id: 5
  category: driver_testing
  question: ¿Cuál es la política si reprueba el examen de conocimientos?
  choices:
    A: Debe esperar una semana antes de volver a realizarlo.
    B: Debe esperar un día antes de volver a realizarlo.
    C: Debe pagar una multa de inmediato.
    D: Está limitado a tres intentos en total.
  answer: B
  explanation: Si reprueba el examen de conocimientos, debe esperar un día antes de
    volver a realizarlo. No hay límite en la cantidad de veces que puede tomarlo,
    pero solo puede tomarlo una vez al día.
- id: 6
  category: driver_testing
  question: ¿Cuántos intentos se permiten al realizar el examen de conocimientos en
    línea a través de los Servicios en Línea del BMV?
  choices:
    A: Un intento por día
    B: Dos intentos en un período de seis meses
    C: Intentos ilimitados
    D: Tres intentos por año
  answer: B
  explanation: Al realizar el examen de conocimientos en línea a través de los Servicios
    en Línea del BMV, se permiten dos intentos en un período de seis meses.
- id: 7
  category: license_system
  question: ¿Cuál de los siguientes grupos debe completar un curso de capacitación
    de educación vial?
  choices:
    A: Solo los solicitantes menores de 18 años
    B: Todos los solicitantes, independientemente de su edad
    C: Solicitantes menores de 21 años y residentes temporales de 21 años o más
    D: Solo residentes temporales
  answer: C
  explanation: Debe completar un curso de capacitación de educación vial si es menor
    de 21 años o si es un residente temporal de 21 años o más.
- id: 8
  category: driver_testing
  question: ¿Qué debe hacer si usa anteojos o lentes de contacto al acudir a su examen
    de la vista?
  choices:
    A: Realizar el examen sin ellos para probar su visión natural.
    B: Llevarlos consigo al examen.
    C: Proporcionar una nota del médico en lugar de realizar el examen.
    D: Solo llevarlos si es mayor de 65 años.
  answer: B
  explanation: El manual indica que si usa anteojos o lentes de contacto, debe llevarlos
    consigo al examen de la vista.
- id: 9
  category: driver_testing
  question: Si necesita realizar el examen de conocimientos en un idioma distinto
    a los 10 proporcionados por el BMV, ¿qué debe hacer?
  choices:
    A: Debe realizar el examen en inglés.
    B: Puede usar una herramienta de traducción en línea durante el examen.
    C: Puede utilizar su propio intérprete programando una cita en una Estación de
      Examen de Conductores.
    D: Debe solicitar al BMV que traduzca el examen por usted.
  answer: C
  explanation: Puede utilizar su propio intérprete para los idiomas que no se ofrecen,
    programando una cita únicamente en una Estación de Examen de Conductores (Driver
    Exam Station).
- id: 10
  category: license_system
  question: ¿Cuál es el estatus legal del Manual del Conductor de Ohio?
  choices:
    A: Reemplaza al Código Revisado de Ohio.
    B: Es un sustituto completo del Código Administrativo de Ohio.
    C: Contiene todas las leyes de vehículos motorizados aplicables en Ohio.
    D: Es una guía de estudio y no sustituye ni reemplaza al Código Revisado de Ohio.
  answer: D
  explanation: El manual establece que es una guía de estudio y no sustituye ni reemplaza
    al Código Revisado de Ohio (Ohio Revised Code) ni al Código Administrativo de
    Ohio (Ohio Administrative Code).
- id: 11
  category: driver_testing
  question: ¿Cuál es el límite para realizar el examen de conocimientos en persona
    en una Estación de Examen de Conductores del BMV?
  choices:
    A: Dos intentos cada seis meses
    B: Intentos ilimitados, pero solo uno por día
    C: Tres intentos en total
    D: Un intento por semana
  answer: B
  explanation: El examen en persona en una Estación de Examen de Conductores del BMV
    permite intentos ilimitados, pero solo uno por día.
- id: 12
  category: driver_testing
  question: ¿Qué adaptación específica está disponible durante el examen de conducción
    exclusivamente para personas sordas o con dificultades auditivas?
  choices:
    A: Un intérprete de lenguaje de señas en el vehículo
    B: Instrucciones visuales durante el examen de conducción
    C: Un examen escrito en lugar de un examen en carretera
    D: Exención del examen de maniobrabilidad
  answer: B
  explanation: Las adaptaciones disponibles bajo petición incluyen instrucciones visuales
    durante el examen de conducción, lo cual es exclusivo para personas sordas o con
    dificultades auditivas.
- id: 13
  category: license_system
  question: ¿Qué significan las siglas TIPIC en el Manual del Conductor de Ohio?
  choices:
    A: Tarjeta de Identificación de Permiso de Instrucción Temporal (Temporary Instruction
      Permit Identification Card)
    B: Tarjeta de Identificación de Permiso de Individuo Evaluado
    C: Tarjeta de Identificación de Permiso Interestatal Temporal
    D: Tarjeta de Identificación de Permiso de Instrucción de Tráfico
  answer: A
  explanation: TIPIC significa Tarjeta de Identificación de Permiso de Instrucción
    Temporal (Temporary Instruction Permit Identification Card), la cual se adquiere
    después de aprobar el examen de conocimientos.
- id: 14
  category: driver_testing
  question: ¿Cómo puede una persona solicitar adaptaciones por discapacidad para los
    exámenes que no estén ya enumeradas por el BMV?
  choices:
    A: Llamar al departamento de policía local.
    B: Enviar un correo electrónico a los Coordinadores de la ADA del Departamento
      de Seguridad Pública de Ohio.
    C: Preguntar al instructor de manejo el día del examen.
    D: Enviar una carta por correo a la oficina del Gobernador.
  answer: B
  explanation: Para solicitar adaptaciones no enumeradas, debe enviar un correo electrónico
    a los Coordinadores de la ADA del Departamento de Seguridad Pública de Ohio a
    HRRequestADA@dps.ohio.gov.
- id: 15
  category: license_system
  question: ¿Cuál de los siguientes es un servicio ofrecido a través de los Servicios
    en Línea del BMV?
  choices:
    A: Comprar un vehículo nuevo
    B: Realizar el examen de conducción en carretera de forma virtual
    C: Reservar su lugar en la fila en una Agencia de Licencias del Registrador Adjunto
      (Deputy Registrar License Agency)
    D: Apelar una multa de tráfico
  answer: C
  explanation: El manual enumera "Reservar su lugar en la fila en una Agencia de Licencias
    del Registrador Adjunto" como uno de los servicios en línea disponibles del BMV.
- id: 16
  category: license_system
  question: ¿Qué sucede con su tarjeta de identificación (ID) de Ohio si se le emite
    un TIPIC?
  choices:
    A: Se convierte en su forma secundaria de identificación.
    B: Se cancela.
    C: Se fusiona con el TIPIC.
    D: Permanece válida por 60 días.
  answer: B
  explanation: Si el solicitante tiene una tarjeta de identificación (ID) de Ohio,
    esta se cancelará cuando se emita el TIPIC, ya que un residente de Ohio solo puede
    tener una licencia de conducir o una tarjeta de identificación a la vez.
- id: 17
  category: safe_driving_rules
  question: Para un titular de TIPIC de 16 o 17 años, ¿quién debe estar en el asiento
    del pasajero delantero al conducir entre la medianoche y las 6 a.m.?
  choices:
    A: Cualquier conductor con licencia de 21 años o más
    B: Un instructor de manejo con licencia
    C: Un padre, tutor o custodio que posea una licencia de conducir válida
    D: No se requiere a nadie si se conduce hacia o desde el trabajo
  answer: C
  explanation: Desde la medianoche hasta las 6 a.m., un conductor de 16 o 17 años
    debe estar acompañado por un padre, tutor o custodio que posea una licencia de
    conducir válida.
- id: 18
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una restricción que se aplica a los titulares
    de TIPIC de todas las edades?
  choices:
    A: Se prohíbe el uso de cualquier dispositivo electrónico móvil mientras se conduce.
    B: No se permite conducir después de las 10 p.m.
    C: Solo se permite un pasajero en el vehículo.
    D: El conductor debe registrar 100 horas de práctica de manejo.
  answer: A
  explanation: Para los titulares de TIPIC de todas las edades, se prohíbe el uso
    de cualquier dispositivo electrónico móvil mientras se conduce.
- id: 19
  category: driver_testing
  question: ¿Cuántas horas totales de tiempo de conducción con un conductor con licencia
    elegible debe registrar un conductor menor de 21 años para obtener una licencia
    de conducir?
  choices:
    A: 24 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Para obtener una licencia de conducir, un conductor menor de 21 años
    debe completar y registrar 50 horas de conducción con un conductor con licencia
    elegible, con al menos 10 horas de conducción nocturna.
- id: 20
  category: driver_testing
  question: ¿Cuánto tiempo debe un conductor menor de 18 años tener el TIPIC antes
    de poder obtener una licencia de conducir?
  choices:
    A: 14 días
    B: 30 días
    C: 3 meses
    D: 6 meses
  answer: D
  explanation: Los conductores menores de 18 años deben tener el TIPIC durante al
    menos seis meses antes de obtener una licencia de conducir.
- id: 21
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima legal de la banda de rodadura de los neumáticos
    para un vehículo en Ohio?
  choices:
    A: 1/8 de pulgada
    B: 1/16 de pulgada
    C: 1/32 de pulgada
    D: 1/4 de pulgada
  answer: B
  explanation: Un neumático en condiciones seguras tiene un mínimo de 1/16 de pulgada
    de profundidad de la banda de rodadura en la superficie de la carretera y no tiene
    protuberancias o bultos importantes.
- id: 22
  category: vehicle_information
  question: ¿A qué distancia debe ser visible la luz trasera de un vehículo?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: La ley de Ohio exige que un vehículo tenga al menos una luz trasera
    que emita luz roja, visible desde una distancia de 500 pies.
- id: 23
  category: vehicle_information
  question: ¿Cuál es el porcentaje aceptable de transmisión de luz para el parabrisas
    de un vehículo en Ohio?
  choices:
    A: 30%
    B: 50%
    C: 70%
    D: 100%
  answer: C
  explanation: La transmisión de luz aceptable para un parabrisas es del 70%, lo cual
    es el estándar para la mayoría de los autos nuevos.
- id: 24
  category: vehicle_information
  question: ¿Cuándo es el mejor momento para revisar la presión de los neumáticos
    de su vehículo?
  choices:
    A: Inmediatamente después de conducir por la autopista
    B: Cuando los neumáticos tienen la misma temperatura que el aire circundante
    C: Durante la parte más calurosa del día
    D: Cuando los neumáticos están más calientes que el aire circundante
  answer: B
  explanation: Debe revisar la presión de los neumáticos cuando estos tengan la misma
    temperatura que el aire circundante.
- id: 25
  category: safe_driving_rules
  question: ¿En qué fechas es legal el uso de neumáticos con clavos en Ohio?
  choices:
    A: Del 1 de octubre al 31 de marzo
    B: Del 1 de noviembre al 15 de abril
    C: Del 1 de diciembre al 28 de febrero
    D: Del 15 de noviembre al 1 de abril
  answer: B
  explanation: En Ohio, los neumáticos con clavos son legales desde el 1 de noviembre
    hasta el 15 de abril.
- id: 26
  category: safe_driving_rules
  question: Además de desde el atardecer hasta el amanecer y durante periodos de poca
    visibilidad, ¿en qué otro momento exige la ley de Ohio que se enciendan los faros
    delanteros?
  choices:
    A: Al conducir en una zona escolar
    B: Siempre que los limpiaparabrisas estén en uso debido a la precipitación
    C: Al conducir en una autopista interestatal
    D: Al acercarse a una zona de construcción
  answer: B
  explanation: La ley de Ohio exige que los faros delanteros estén encendidos desde
    el atardecer hasta el amanecer, en cualquier momento en que la visibilidad sea
    deficiente y siempre que los limpiaparabrisas estén en uso debido a la precipitación.
- id: 27
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe activar su señal de giro antes de cambiar
    de dirección?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 300 pies
  answer: B
  explanation: Debe activar la señal de giro al menos 100 pies antes de cambiar de
    dirección.
- id: 28
  category: defensive_driving
  question: Para permitir el espacio adecuado para el despliegue de la bolsa de aire
    (airbag), ¿cuál es la distancia mínima que debe haber entre su pecho y el volante?
  choices:
    A: 5 pulgadas
    B: 8 pulgadas
    C: 10 pulgadas
    D: 12 pulgadas
  answer: C
  explanation: Debe haber al menos 10 pulgadas entre su pecho y el volante para permitir
    el espacio adecuado para el despliegue de la bolsa de aire.
- id: 29
  category: vehicle_information
  question: ¿Cómo debe posicionarse al ajustar el espejo lateral derecho para reducir
    los puntos ciegos?
  choices:
    A: Apoye la cabeza contra la ventana cerrada del lado del conductor
    B: Inclínese hacia la derecha de modo que su cabeza quede directamente sobre la
      consola central
    C: Mire por encima de su hombro derecho mientras está sentado erguido
    D: Inclínese hacia adelante hasta que su pecho toque el volante
  answer: B
  explanation: Para ajustar el espejo lateral derecho, debe inclinarse hacia la derecha
    de modo que su cabeza quede directamente sobre la consola central, luego ajuste
    el espejo de modo que apenas se pueda ver el borde trasero del vehículo.
- id: 30
  category: safe_driving_rules
  question: ¿Cuál es la regla del cinturón de seguridad para los conductores menores
    de 18 años en Ohio?
  choices:
    A: Solo el conductor y los pasajeros del asiento delantero están obligados a usar
      cinturones de seguridad.
    B: Los cinturones de seguridad son opcionales si el vehículo está equipado con
      bolsas de aire laterales.
    C: El número de ocupantes está limitado al número de cinturones de seguridad instalados,
      y todos los ocupantes deben usarlos.
    D: Los pasajeros en el asiento trasero no necesitan usar cinturones de seguridad
      si son mayores de 18 años.
  answer: C
  explanation: Para los conductores menores de 18 años, el número de ocupantes del
    vehículo está limitado al número de cinturones de seguridad instalados originalmente
    y todos los ocupantes deben usar cinturones de seguridad.
- id: 31
  category: vehicle_information
  question: ¿Cómo debe ajustarse correctamente el cinturón de regazo?
  choices:
    A: Alto, cruzando el estómago
    B: Flojo, cruzando los muslos
    C: Ajustado y bajo, cruzando las caderas
    D: Debajo del brazo y cruzando el pecho
  answer: C
  explanation: Debe ajustar el cinturón de regazo de modo que quede ceñido y bajo
    sobre las caderas después de abrocharlo para evitar deslizarse fuera del cinturón
    en caso de un choque.
- id: 32
  category: alcohol_drugs_health
  question: Si su licencia de conducir indica una restricción de la visión, ¿qué debe
    evitar hacer por la noche?
  choices:
    A: Usar lentes correctivos oscuros o teñidos
    B: Conducir por carreteras rurales sin iluminación
    C: Usar las luces altas de los faros
    D: Usar cualquier tipo de lentes correctivos
  answer: A
  explanation: El manual aconseja a los conductores evitar el uso de lentes correctivos
    oscuros o teñidos por la noche.
- id: 33
  category: defensive_driving
  question: ¿Cómo puede afectar la fatiga su capacidad para conducir?
  choices:
    A: Aumenta su tiempo de reacción y agudiza su visión.
    B: Afecta su visión y disminuye su tiempo de reacción.
    C: Mejora su capacidad para realizar tareas repetitivas.
    D: No tiene ningún efecto siempre que consuma cafeína.
  answer: B
  explanation: La fatiga es el cansancio físico o mental que puede afectar su visión
    y disminuir su tiempo de reacción.
- id: 34
  category: defensive_driving
  question: ¿Cuál de los siguientes se considera un ejemplo de conducción agresiva?
  choices:
    A: Conducir exactamente al límite de velocidad indicado
    B: Usar tecnología de manos libres para hacer una llamada telefónica
    C: Seguir a otro vehículo demasiado de cerca y realizar cambios de carril inseguros
    D: Ceder el paso a los peatones
  answer: C
  explanation: Los ejemplos de conducción agresiva incluyen el exceso de velocidad,
    seguir demasiado de cerca, cambios de carril inseguros, señalización inadecuada
    y no obedecer las señales de tráfico.
- id: 35
  category: safe_driving_rules
  question: Según la ley de Ohio, ¿cómo pueden los conductores de 18 años o más usar
    legalmente un teléfono celular mientras conducen?
  choices:
    A: Pueden sostener el teléfono para enviar mensajes de texto si están detenidos
      en una señal de alto.
    B: Pueden ingresar números manualmente para marcar una llamada mientras conducen.
    C: Pueden usar tecnología de manos libres siempre que no sostengan ni apoyen el
      dispositivo.
    D: Se les prohíbe estrictamente el uso de un teléfono celular de cualquier manera.
  answer: C
  explanation: Los conductores mayores de 18 años pueden realizar y recibir llamadas
    telefónicas utilizando tecnología de manos libres, siempre que no sostengan ni
    apoyen el dispositivo ni ingresen manualmente letras, números o símbolos.
- id: 36
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción por conducción distraída
    en dos años para un conductor mayor de 18 años?
  choices:
    A: 2 puntos asignados a la licencia de conducir y una multa de hasta $150
    B: 3 puntos asignados a la licencia de conducir y una multa de hasta $250
    C: 4 puntos asignados a la licencia de conducir y una suspensión de 90 días
    D: Una suspensión de la licencia de conducir de 60 días y una multa de $150
  answer: A
  explanation: Para los conductores de 18 años o más, una primera infracción en dos
    años resulta en 2 puntos asignados a la licencia de conducir y una multa de hasta
    $150.
- id: 37
  category: penalties_and_points
  question: ¿Qué sucede con la multa si ocurre una infracción por conducción distraída
    en una zona de obras?
  choices:
    A: La multa se exonera si se completa un curso de seguridad.
    B: La multa sigue siendo la misma pero los puntos se duplican.
    C: La multa se duplica.
    D: La multa se sustituye por una suspensión obligatoria de la licencia.
  answer: C
  explanation: Según el manual, las multas por conducción distraída se duplican si
    la infracción ocurre en una zona de obras.
- id: 38
  category: safe_driving_rules
  question: ¿Puede un conductor menor de 18 años usar un dispositivo electrónico mientras
    está detenido en un semáforo en rojo?
  choices:
    A: Sí, siempre que el dispositivo sea de manos libres.
    B: Sí, pero solo para enviar mensajes de texto.
    C: No, es ilegal usar cualquier dispositivo electrónico incluso mientras se está
      detenido en un semáforo.
    D: No, a menos que estén cambiando la lista de reproducción de música.
  answer: C
  explanation: Para los conductores menores de 18 años, es ilegal usar cualquier dispositivo
    electrónico mientras conducen, incluso con manos libres, o mientras están detenidos
    en un semáforo o en un embotellamiento.
- id: 39
  category: alcohol_drugs_health
  question: ¿Cómo afectan el alcohol y las drogas el juicio de un conductor?
  choices:
    A: Mejoran la capacidad de tomar decisiones rápidas.
    B: Reducen la capacidad de percibir el entorno y tomar decisiones rápidas.
    C: Agudizan la visión y la percepción de profundidad.
    D: Disminuyen el tiempo de reacción haciendo que el conductor responda más rápido.
  answer: B
  explanation: El alcohol y las drogas afectan el juicio al reducir su capacidad para
    percibir el entorno y tomar decisiones rápidas.
- id: 40
  category: safe_driving_rules
  question: Independientemente del límite de velocidad indicado, ¿qué prohíbe la ley
    de Ohio con respecto a la velocidad de su vehículo?
  choices:
    A: Conducir a una velocidad mayor a la que le permita detenerse en la distancia
      disponible.
    B: Conducir a más de 5 mph por debajo del límite de velocidad indicado en clima
      seco.
    C: Conducir exactamente al límite de velocidad indicado durante las horas nocturnas.
    D: Conducir más lento que el flujo del tráfico en una autopista rural.
  answer: A
  explanation: La ley de Ohio prohíbe que una persona conduzca a una velocidad mayor
    a la que le permita al conductor detenerse en la distancia disponible, independientemente
    del límite de velocidad indicado.
- id: 41
  category: vehicle_information
  question: ¿Cómo deben ajustarse los reposacabezas para evitar el latigazo cervical?
  choices:
    A: De modo que hagan contacto con la nuca.
    B: De modo que estén al menos 3 pulgadas por debajo del nivel de sus orejas.
    C: De modo que hagan contacto con la parte posterior de su cabeza y no por debajo
      del nivel de sus orejas.
    D: De modo que descansen ligeramente contra la parte superior de sus hombros.
  answer: C
  explanation: Los reposacabezas deben ajustarse de modo que hagan contacto con la
    parte posterior de su cabeza y no por debajo del nivel de sus orejas para evitar
    el latigazo cervical.
- id: 42
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso en una intersección de cuatro vías si
    dos conductores llegan al mismo tiempo?
  choices:
    A: El conductor de la izquierda
    B: El conductor de la derecha
    C: El conductor que viaja más rápido
    D: El conductor que está girando a la izquierda
  answer: B
  explanation: Según el manual, debe ceder el derecho de paso al conductor a su derecha
    en una intersección de cuatro vías si ambos llegan a la intersección al mismo
    tiempo.
- id: 43
  category: signs_and_signals
  question: ¿Qué debe hacer un conductor al acercarse a un semáforo con luz amarilla
    intermitente?
  choices:
    A: Detenerse por completo antes de entrar en la intersección
    B: Aumentar la velocidad para despejar la intersección rápidamente
    C: Reducir la velocidad y proceder con precaución
    D: Tratar la intersección como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución, y estar preparado para detenerse ante cualquier flujo
    de tráfico que pueda estar entrando en la intersección.
- id: 44
  category: signs_and_signals
  question: ¿Cómo debe tratar un conductor un semáforo que no funciona?
  choices:
    A: Igual que una señal de ceda el paso
    B: Igual que una señal de alto (stop)
    C: Igual que una luz amarilla intermitente
    D: Proceder sin detenerse si no se ve tráfico transversal
  answer: B
  explanation: El manual establece que los semáforos que no funcionan se tratan igual
    que una señal de alto. Debe ceder el derecho de paso y tener precaución al entrar
    en la intersección.
- id: 45
  category: signs_and_signals
  question: ¿Qué indica un círculo rojo con una barra diagonal en una señal de tráfico?
  choices:
    A: La acción ilustrada está prohibida
    B: Hay un cruce de ferrocarril más adelante
    C: Debe ceder el derecho de paso
    D: Hay una zona de construcción más adelante
  answer: A
  explanation: Las señales prohibitivas indican al espectador que una acción está
    prohibida. El círculo rojo con una barra representa la palabra 'NO', lo que significa
    que la acción ilustrada está prohibida.
- id: 46
  category: signs_and_signals
  question: ¿Qué forma y color tienen la mayoría de las señales de advertencia?
  choices:
    A: Cuadradas y verdes
    B: Rectangulares y blancas
    C: En forma de diamante y amarillas
    D: Redondas y naranjas
  answer: C
  explanation: Las señales de advertencia suelen ser amarillas con letras o símbolos
    negros y tienen forma de diamante.
- id: 47
  category: penalties_and_points
  question: ¿Cuáles son las posibles consecuencias por exceso de velocidad en una
    zona de obras (Work Zone)?
  choices:
    A: Una advertencia por escrito por la primera infracción
    B: Revocación permanente obligatoria de la licencia
    C: Multas duplicadas y tiempo en la cárcel
    D: Puntos añadidos a su licencia pero sin multa
  answer: C
  explanation: Las consecuencias por viajar más rápido que el límite de velocidad
    indicado en una zona de obras pueden incluir multas duplicadas y tiempo en la
    cárcel.
- id: 48
  category: safe_driving_rules
  question: ¿Qué indica una línea doble amarilla continua en la calzada?
  choices:
    A: Puede adelantar si el carril opuesto está despejado
    B: No puede conducir a la izquierda de la línea central a menos que gire a la
      izquierda o adelante a un vehículo que se mueve lentamente
    C: El tráfico en ambos lados viaja en la misma dirección
    D: El carril está terminando y debe incorporarse a la derecha
  answer: B
  explanation: Una línea doble amarilla continua significa que no debe conducir a
    la izquierda de la línea central, a menos que deba cruzar las líneas para girar
    a la izquierda o adelantar a un vehículo que se mueve lentamente.
- id: 49
  category: safe_driving_rules
  question: ¿Qué tipo de marca en el pavimento separa el tráfico que viaja en la misma
    dirección?
  choices:
    A: Líneas blancas
    B: Líneas amarillas continuas
    C: Líneas amarillas discontinuas
    D: Líneas amarillas dobles
  answer: A
  explanation: Las líneas blancas separan el tráfico que viaja en la misma dirección.
    Pueden ser líneas continuas o discontinuas.
- id: 50
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a un carril
    de giro a la izquierda de dos vías únicamente?
  choices:
    A: Puede usarse para adelantar vehículos lentos
    B: Está marcado con líneas blancas continuas en ambos lados
    C: Se utiliza como un carril de circulación normal durante la hora pico
    D: No es un carril utilizado para circular o adelantar
  answer: D
  explanation: 'El carril central marcado es solo para giros a la izquierda. El manual
    establece explícitamente: ''Este no es un carril utilizado para circular o adelantar''.'
- id: 51
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento recomendada con respecto al vehículo
    que circula delante de usted?
  choices:
    A: 1 a 2 segundos
    B: 3 a 4 segundos
    C: 5 a 6 segundos
    D: La longitud de un vehículo por cada 10 mph
  answer: B
  explanation: El manual aconseja a los conductores mantener una distancia de seguimiento
    de 3 a 4 segundos con respecto al vehículo que circula delante.
- id: 52
  category: vehicle_information
  question: ¿Cuál de los siguientes NO figura como un factor que determina la distancia
    necesaria para detener un vehículo por completo?
  choices:
    A: El tiempo de reacción del conductor
    B: El estado de los frenos del vehículo
    C: El peso del vehículo
    D: El estado del pavimento
  answer: C
  explanation: El manual enumera el tiempo de reacción del conductor, la velocidad,
    el estado de los frenos y el estado del pavimento como factores determinantes.
    El peso del vehículo no se menciona en esta sección.
- id: 53
  category: safe_driving_rules
  question: ¿Dónde debe detenerse un conductor al salir de un callejón, entrada privada
    o camino privado en un distrito comercial o residencial?
  choices:
    A: En el borde de la calzada
    B: En la señal de alto más cercana
    C: En la acera, o en un punto antes de entrar en la calzada si no hay acera
    D: En medio de la intersección para comprobar el tráfico
  answer: C
  explanation: Un conductor debe detenerse en la acera o, si no hay acera, en un punto
    antes de entrar en la calzada al salir de un callejón, entrada privada o camino
    privado en un distrito comercial o residencial.
- id: 54
  category: sharing_the_road
  question: ¿Cuándo debe ceder el paso a un vehículo de seguridad pública que muestre
    luces intermitentes y emita una señal de advertencia?
  choices:
    A: Solo cuando el vehículo esté directamente detrás de usted
    B: Siempre, a menos que el vehículo circule en sentido contrario en una autopista
      dividida
    C: Solo si se encuentra actualmente dentro de una intersección
    D: Solo cuando se trate de una patrulla de policía, pero no de un camión de bomberos
  answer: B
  explanation: Debe detenerse ante la proximidad de un vehículo de seguridad pública
    que muestre luces intermitentes y emita una señal de advertencia, a menos que
    el vehículo circule en sentido contrario en una autopista dividida.
- id: 55
  category: signs_and_signals
  question: ¿Qué tipo de señales indican puntos de interés, servicios a lo largo de
    la carretera y ayudan a dirigir a los conductores hacia ciudades y pueblos?
  choices:
    A: Señales de advertencia
    B: Señales reglamentarias
    C: Señales de guía
    D: Señales prohibitivas
  answer: C
  explanation: Las señales de guía proporcionan información sobre puntos de interés
    y servicios a lo largo de la carretera, información sobre carreteras que se cruzan
    y ayudan a dirigir a los conductores hacia ciudades y pueblos.
- id: 56
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor antes de entrar en una intersección si no
    hay espacio suficiente al otro lado para alojar su vehículo?
  choices:
    A: Avanzar lentamente y esperar en medio de la intersección
    B: Tocar la bocina para despejar el tráfico de adelante
    C: Detenerse antes de entrar en la intersección
    D: Girar a la derecha en lugar de seguir recto
  answer: C
  explanation: Un conductor debe detenerse antes de entrar en una intersección si
    no hay espacio suficiente al otro lado para alojar el vehículo. Esto se aplica
    independientemente de si un semáforo le otorga el derecho a pasar.
- id: 57
  category: safe_driving_rules
  question: Para mantener el control del vehículo y evitar lesiones por la bolsa de
    aire (airbag), ¿dónde debe colocar las manos en el volante?
  choices:
    A: En las posiciones de las 10 y las 2 en punto
    B: En las posiciones de las 9 y las 3 en punto
    C: En las posiciones de las 4 y las 8 en punto
    D: En las posiciones de las 12 y las 6 en punto
  answer: C
  explanation: El manual indica que se deben colocar ambas manos en la parte exterior
    del volante en lados opuestos, en las posiciones de las 4 y las 8 en punto, para
    mantener el control y evitar las bolsas de aire si se despliegan.
- id: 58
  category: safe_driving_rules
  question: Al dar marcha atrás con su vehículo, ¿dónde debe colocar la mano izquierda
    en el volante?
  choices:
    A: En la posición de las 12 en punto
    B: En la posición de las 6 en punto
    C: En la posición de las 9 en punto
    D: En la posición de las 4 en punto
  answer: A
  explanation: Para retroceder con seguridad, el manual indica que debe sujetar el
    volante en la posición de las 12 en punto con la mano izquierda y colocar el brazo
    derecho en el respaldo del asiento del pasajero.
- id: 59
  category: safe_driving_rules
  question: ¿Con cuánta antelación debe poner la luz de giro antes de realizar un
    giro previsto?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 150 pies
    D: Al menos 200 pies
  answer: B
  explanation: Según el manual, se debe dar una señal de giro al menos 100 pies antes
    del giro previsto.
- id: 60
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento correcto para girar a la izquierda con un semáforo
    en verde cuando el gran volumen de tráfico no permite una oportunidad inmediata?
  choices:
    A: Esperar detrás de la línea de parada hasta que la luz se ponga amarilla
    B: Girar inmediatamente y obligar al tráfico que viene en sentido contrario a
      ceder el paso
    C: Posicionar la parte delantera del vehículo ligeramente después de la línea
      de parada y ceder el paso al tráfico que viene en sentido contrario
    D: Girar a la derecha en su lugar y hacer un giro en U más tarde
  answer: C
  explanation: Si el gran volumen de tráfico no permite la oportunidad de girar a
    la izquierda con luz verde, posicione la parte delantera del vehículo ligeramente
    después de la línea de parada, ceda el paso a los peatones y al tráfico que viene
    en sentido contrario, y gire cuando sea seguro.
- id: 61
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias se le permite girar a la izquierda con un semáforo
    en rojo?
  choices:
    A: Desde cualquier carril hacia una calle de doble sentido
    B: Solo desde el carril del extremo izquierdo de una calle de sentido único hacia
      otra calle de sentido único
    C: Desde una calle de doble sentido hacia una calle de sentido único
    D: Nunca se permiten los giros a la izquierda con semáforo en rojo
  answer: B
  explanation: Puede girar a la izquierda con un semáforo en rojo solo desde el carril
    del extremo izquierdo de una calle de sentido único hacia otra calle de sentido
    único, a menos que una señal lo prohíba.
- id: 62
  category: defensive_driving
  question: Si tiene luz verde pero el tráfico llena la calzada al otro lado de la
    intersección, ¿qué debe hacer?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje
    B: Tocar la bocina para animar al tráfico a moverse
    C: Detenerse antes de la intersección y esperar hasta que el tráfico avance
    D: Avanzar poco a poco en la intersección para bloquear el tráfico transversal
  answer: C
  explanation: Cuando el tráfico llena la calzada al otro lado de la intersección,
    deténgase antes de la intersección y espere hasta que el tráfico avance. No entre
    en la intersección para detenerse allí.
- id: 63
  category: safe_driving_rules
  question: ¿En qué dirección deben circular los vehículos al entrar en una rotonda
    o glorieta?
  choices:
    A: En el sentido de las agujas del reloj
    B: En sentido contrario a las agujas del reloj
    C: En línea recta
    D: En cualquier dirección que sea más corta hacia la salida
  answer: B
  explanation: Los vehículos circulan en sentido contrario a las agujas del reloj
    alrededor de una isla central elevada en una rotonda o glorieta.
- id: 64
  category: safe_driving_rules
  question: Al circular por una rotonda, ¿qué salida debe utilizar si tiene la intención
    de girar a la izquierda?
  choices:
    A: La 1.ª salida
    B: La 2.ª salida
    C: La 3.ª salida
    D: La 4.ª salida
  answer: C
  explanation: Al usar una rotonda, debe utilizar la 3.ª salida para girar a la izquierda.
- id: 65
  category: safe_driving_rules
  question: Al conducir en una carretera de cuatro o más carriles, ¿en qué carril
    debe conducir generalmente?
  choices:
    A: El carril izquierdo
    B: El carril derecho
    C: El carril justo a la derecha del centro
    D: El carril divisor central
  answer: B
  explanation: Al conducir en una carretera de cuatro o más carriles, circule por
    el carril derecho. Use el carril justo a la derecha del centro para rebasar y
    realizar giros a la izquierda.
- id: 66
  category: defensive_driving
  question: ¿Cómo debe revisar sus puntos ciegos antes de cambiar de carril?
  choices:
    A: Mirando exclusivamente por su espejo retrovisor
    B: Girando la cabeza y mirando por encima del hombro en la dirección en la que
      planea moverse
    C: Revisando sus espejos laterales dos veces
    D: Activando su luz de giro y esperando a que alguien toque la bocina
  answer: B
  explanation: Revise sus puntos ciegos girando la cabeza y mirando por encima del
    hombro en la dirección en la que planea moverse, ya que estas áreas no se pueden
    ver usando los espejos.
- id: 67
  category: safe_driving_rules
  question: ¿Cuál es el uso adecuado de un carril de aceleración al entrar en una
    autopista?
  choices:
    A: Para detenerse por completo antes de incorporarse
    B: Para rebasar vehículos más lentos que ya están en la autopista
    C: Para alcanzar la velocidad de los otros vehículos e incorporarse al flujo del
      tráfico
    D: Para estacionarse en caso de emergencia
  answer: C
  explanation: Al entrar en una autopista, use el carril de aceleración para alcanzar
    la velocidad de los otros vehículos e incorporarse al flujo del tráfico.
- id: 68
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de la salida prevista en una carretera?
  choices:
    A: Detenerse y retroceder por el acotamiento
    B: Usar la apertura de la mediana para dar la vuelta
    C: Tomar la siguiente salida
    D: Hacer un giro en U a través de los carriles principales de circulación
  answer: C
  explanation: Si se pasa de su salida, tome la siguiente. No use la apertura de la
    mediana, que es solo para el uso de vehículos de emergencia y de seguridad pública.
- id: 69
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cómo sabe que es seguro regresar a su carril?
  choices:
    A: Cuando esté a una distancia de un vehículo por delante del vehículo rebasado
    B: Cuando pueda ver el parachoques delantero del vehículo rebasado en su espejo
      lateral
    C: Cuando ambos faros delanteros del vehículo rebasado sean visibles en su espejo
      retrovisor
    D: Cuando el conductor del vehículo rebasado haga destellos con sus luces altas
  answer: C
  explanation: Al rebasar, continúe hasta que ambos faros delanteros del vehículo
    rebasado sean visibles en el espejo retrovisor antes de señalizar y regresar al
    carril.
- id: 70
  category: sharing_the_road
  question: ¿Qué debe hacer cuando otro vehículo lo está rebasando?
  choices:
    A: Aumentar la velocidad para evitar que lo rebasen
    B: Moverse al carril izquierdo para bloquearlo
    C: Permanecer en su carril y mantener una velocidad constante
    D: Reducir la velocidad drásticamente y orillarse al acotamiento
  answer: C
  explanation: Cuando lo estén rebasando, debe permanecer en su carril y mantener
    una velocidad constante para permitir que el conductor lo pase.
- id: 71
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones está prohibido rebasar a otro vehículo?
  choices:
    A: En una calzada de varios carriles
    B: Antes de un cruce de ferrocarril o un puente
    C: Cuando el vehículo de adelante circula por debajo del límite de velocidad
    D: En una carretera dividida en tres o más carriles marcados
  answer: B
  explanation: No debe intentar rebasar cuando se aproxima un vehículo en sentido
    contrario, cuando su visibilidad está bloqueada, en intersecciones o antes de
    un cruce de ferrocarril o un puente.
- id: 72
  category: safe_driving_rules
  question: ¿Cuándo se permite cruzar una línea amarilla doble continua?
  choices:
    A: Para rebasar a un vehículo que circula a 10 mph por debajo del límite de velocidad.
    B: Para incorporarse al tráfico desde el acotamiento (shoulder).
    C: Para girar a la izquierda hacia una entrada privada o para rebasar a un vehículo
      de movimiento lento.
    D: Cuando circula por una calzada de varios carriles.
  answer: C
  explanation: Cruzar la línea central con una línea amarilla doble continua se permite
    únicamente para girar a la izquierda hacia entradas privadas o para rebasar a
    un vehículo de movimiento lento (por ejemplo, una bicicleta o un vehículo que
    exhiba una señal de vehículo de movimiento lento) cuando sea seguro hacerlo.
- id: 73
  category: safe_driving_rules
  question: ¿Cuál es el uso adecuado de un carril central de giro a la izquierda de
    dos sentidos?
  choices:
    A: Rebasar vehículos más lentos.
    B: Incorporarse al tráfico.
    C: Circular durante la hora pico.
    D: Vehículos que giran a la izquierda en cualquiera de los dos sentidos.
  answer: D
  explanation: Un carril de giro a la izquierda de dos sentidos está reservado únicamente
    para vehículos que giran a la izquierda en cualquiera de las dos direcciones y
    no se utiliza para rebasar, incorporarse al tráfico ni para circular.
- id: 74
  category: safe_driving_rules
  question: Cuando un tren se aproxima a un cruce de ferrocarril, ¿dónde debe detener
    su vehículo?
  choices:
    A: A no menos de 10 pies y no más de 30 pies del cruce.
    B: A no menos de 15 pies y no más de 50 pies del cruce.
    C: Exactamente a 20 pies del cruce.
    D: Al menos a 50 pies de distancia del cruce.
  answer: B
  explanation: El manual exige que los conductores se detengan a no menos de 15 pies
    y no más de 50 pies del cruce cuando se aproxima un tren.
- id: 75
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado por ley a detenerse en
    todos los cruces de ferrocarril?
  choices:
    A: Un vehículo de pasajeros que remolca un bote.
    B: Una motocicleta.
    C: Un vehículo que transporta explosivos o líquidos inflamables.
    D: Una camioneta de reparto.
  answer: C
  explanation: Los operadores de vehículos motorizados que transportan pasajeros por
    contrato, los autobuses escolares o los vehículos que transportan explosivos o
    líquidos inflamables están obligados a detenerse en los cruces de ferrocarril.
- id: 76
  category: sharing_the_road
  question: ¿Qué debe hacer si se aproxima a un autobús escolar con luces rojas intermitentes
    detenido en una carretera de menos de cuatro carriles?
  choices:
    A: Detenerse solo si viaja en la misma dirección que el autobús.
    B: Reducir la velocidad a 15 mph y proceder con precaución.
    C: Detenerse al menos a 10 pies de la parte delantera o trasera del autobús y
      permanecer detenido.
    D: Detenerse al menos a 20 pies del autobús hasta que las luces ámbar parpadeen.
  answer: C
  explanation: Si el autobús está detenido en una calle o carretera con menos de cuatro
    carriles, todo el tráfico que se aproxime al autobús desde cualquier dirección
    debe detenerse al menos a 10 pies de la parte delantera o trasera del autobús.
- id: 77
  category: sharing_the_road
  question: Cuando un autobús escolar se detiene con sus luces rojas intermitentes
    en una calle de cuatro o más carriles, ¿quién está obligado a detenerse?
  choices:
    A: Todo el tráfico en ambas direcciones.
    B: Solo el tráfico que circula en la misma dirección que el autobús.
    C: Solo el tráfico en el carril directamente al lado del autobús.
    D: Ningún vehículo está obligado a detenerse en una carretera de cuatro carriles.
  answer: B
  explanation: Si el autobús está detenido en una calle o carretera con cuatro o más
    carriles, solo el tráfico que circula en la misma dirección que el autobús debe
    detenerse detrás del mismo.
- id: 78
  category: safe_driving_rules
  question: Al estacionarse en paralelo en una calle, ¿qué tan cerca del bordillo
    (curb) debe estar su vehículo?
  choices:
    A: No más de 6 pulgadas.
    B: No más de 12 pulgadas.
    C: No más de 18 pulgadas.
    D: No más de 24 pulgadas.
  answer: B
  explanation: Los vehículos deben estacionarse orientados en la dirección del tráfico
    en ese lado de la calle, en paralelo y a no más de 12 pulgadas del bordillo derecho
    (o del bordillo izquierdo en calles de un solo sentido).
- id: 79
  category: safe_driving_rules
  question: ¿Es ilegal detener, estacionar o dejar un vehículo a menos de cuántos
    pies de un hidrante de incendios?
  choices:
    A: 10 pies.
    B: 15 pies.
    C: 20 pies.
    D: 30 pies.
  answer: A
  explanation: Ninguna persona debe detener, estacionar o dejar un vehículo a menos
    de 10 pies de un hidrante de incendios.
- id: 80
  category: safe_driving_rules
  question: ¿Se le prohíbe estacionar a menos de cuántos pies de una intersección
    o paso de peatones?
  choices:
    A: 10 pies.
    B: 15 pies.
    C: 20 pies.
    D: 25 pies.
  answer: C
  explanation: El manual establece que está prohibido detenerse, estacionarse o permanecer
    en una intersección o paso de peatones, o a menos de 20 pies de estos.
- id: 81
  category: safe_driving_rules
  question: ¿Qué debe hacer con las ruedas delanteras al estacionar su vehículo en
    una colina o superficie inclinada?
  choices:
    A: Girarlas en dirección opuesta al bordillo (acera).
    B: Mantenerlas perfectamente rectas.
    C: Girarlas hacia el lado del bordillo (acera) de la carretera.
    D: Girarlas hacia la izquierda independientemente de la inclinación.
  answer: C
  explanation: En caso de que deba estacionar su vehículo en una colina o superficie
    inclinada, gire las ruedas delanteras hacia el lado del bordillo (acera) de la
    carretera para estabilizar el vehículo.
- id: 82
  category: driver_responsibility
  question: ¿En cuál de las siguientes situaciones se le requiere mostrar un comprobante
    de responsabilidad financiera (seguro)?
  choices:
    A: Al renovar el registro de su vehículo en línea.
    B: Cuando esté involucrado en un accidente de tráfico que resulte en más de $400
      en daños a la propiedad.
    C: Al comprar un vehículo nuevo en un concesionario.
    D: Al detenerse en una caseta de peaje.
  answer: B
  explanation: Se debe mostrar el comprobante de responsabilidad financiera cuando
    el conductor o el propietario del vehículo estén involucrados en un accidente
    de tráfico que resulte en más de $400 en daños a la propiedad.
- id: 83
  category: driver_responsibility
  question: ¿Cuál es el requisito mínimo de seguro de responsabilidad civil por daños
    a la propiedad en un accidente en Ohio?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Los requisitos mínimos de seguro de responsabilidad civil incluyen
    $25,000 por daños a la propiedad en un accidente.
- id: 84
  category: alcohol_drugs_health
  question: ¿Es ilegal operar un vehículo motorizado en Ohio con una concentración
    de alcohol en sangre (BAC) de qué nivel si es menor de 21 años?
  choices:
    A: .00% o superior
    B: .02% o superior
    C: .04% o superior
    D: .08% o superior
  answer: B
  explanation: En Ohio, es ilegal operar un vehículo motorizado con un BAC de .02%
    o superior cuando se es menor de 21 años.
- id: 85
  category: penalties_and_points
  question: ¿Qué sucede bajo la ley de Suspensión Administrativa de la Licencia (ALS)
    si una persona acepta someterse a una prueba química y los resultados muestran
    un BAC de .08 o superior?
  choices:
    A: El conductor recibe una advertencia y se le permite conducir a casa.
    B: El oficial que realiza el arresto confisca la licencia de conducir y comienza
      de inmediato una suspensión de hasta cinco años.
    C: El vehículo del conductor es confiscado permanentemente.
    D: El conductor debe pagar una multa de $400 en el acto.
  answer: B
  explanation: Si los resultados de la prueba muestran un BAC de .08 o superior, el
    oficial que realiza el arresto confisca la licencia de conducir y comienza de
    inmediato una suspensión de hasta cinco años.
- id: 86
  category: alcohol_drugs_health
  question: ¿Cuál es la sanción por negarse por primera vez a someterse a una prueba
    química bajo la ley de Suspensión Administrativa de la Licencia (ALS)?
  choices:
    A: Suspensión de la licencia por 90 días
    B: Suspensión de la licencia por un año
    C: Suspensión de la licencia por dos años
    D: Suspensión de la licencia por tres años
  answer: B
  explanation: Según el manual, la primera negativa a realizar la prueba resulta en
    una suspensión de la licencia por un año.
- id: 87
  category: penalties_and_points
  question: ¿Qué sucede si un conductor de Ohio acumula 12 o más puntos de penalización
    en un período de dos años?
  choices:
    A: Solo recibe una carta de advertencia.
    B: Su vehículo es confiscado permanentemente.
    C: El BMV impone una suspensión de 12 puntos a su licencia de conducir.
    D: Debe cumplir una sentencia de cárcel obligatoria de 30 días.
  answer: C
  explanation: Si un conductor acumula 12 o más puntos en un período de dos años,
    el BMV impondrá una suspensión de 12 puntos a la licencia de conducir.
- id: 88
  category: safe_driving_rules
  question: Según la ley de Ohio, ¿cuándo se requiere tener los faros delanteros encendidos
    durante el día?
  choices:
    A: Solo cuando se conduce por la interestatal.
    B: En cualquier momento en que los limpiaparabrisas estén en uso debido a la precipitación.
    C: Solo cuando se conduce por una zona escolar.
    D: En cualquier momento en que se conduzca un vehículo comercial.
  answer: B
  explanation: El manual establece que las luces deben estar encendidas en cualquier
    momento en que los limpiaparabrisas estén en uso debido a la precipitación, independientemente
    de la hora del día.
- id: 89
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones de tráfico resulta en una evaluación
    de 6 puntos en su licencia de conducir?
  choices:
    A: Una infracción de movimiento estándar.
    B: Desprecio deliberado o injustificado por la seguridad de las personas o la
      propiedad.
    C: No detenerse y revelar la identidad después de un accidente.
    D: Una infracción de velocidad menor.
  answer: C
  explanation: No detenerse y revelar la identidad después de un accidente se penaliza
    con 6 puntos, mientras que el desprecio deliberado se penaliza con 4 puntos y
    las infracciones de movimiento/velocidad generalmente con 2 puntos.
- id: 90
  category: safe_driving_rules
  question: ¿Cuál es el requisito de sujeción infantil para un bebé o niño menor de
    4 años y que pesa menos de 40 libras?
  choices:
    A: Deben estar asegurados con un cinturón de seguridad estándar en el asiento
      delantero.
    B: Deben estar debidamente sujetos en un asiento de seguridad para niños.
    C: Deben estar debidamente sujetos en un asiento elevador (booster seat).
    D: Están exentos de las leyes de sujeción si viajan en el asiento trasero.
  answer: B
  explanation: Los bebés y niños que tengan menos de 4 años, pesen menos de 40 libras,
    o ambas cosas, deben estar debidamente sujetos en un asiento de seguridad para
    niños.
- id: 91
  category: penalties_and_points
  question: Para un conductor menor de 18 años, ¿cuál es la sanción por una condena
    de dos infracciones de tránsito en movimiento?
  choices:
    A: Una carta de advertencia del BMV.
    B: Una suspensión automática de la licencia por tres meses.
    C: Una suspensión automática de la licencia por seis meses.
    D: Una suspensión automática de la licencia por un año.
  answer: B
  explanation: El BMV impondrá automáticamente una suspensión de la licencia por tres
    meses a los conductores menores de 18 años que sean condenados o se declaren culpables
    de dos infracciones de tránsito en movimiento.
- id: 92
  category: driver_responsibility
  question: Si un agente de la ley lo detiene, ¿qué debe hacer con sus manos?
  choices:
    A: Mantenerlas ocultas debajo de su asiento.
    B: Buscar inmediatamente su registro en la guantera.
    C: Mantenerlas en el volante a la vista del oficial.
    D: Agitarlas fuera de la ventana para señalar cumplimiento.
  answer: C
  explanation: Cuando un agente de la ley lo detenga, debe mantener las manos en el
    volante a la vista del oficial.
- id: 93
  category: alcohol_drugs_health
  question: ¿Qué requiere que haga un conductor una condena por Operar un Vehículo
    después del Consumo de Alcohol por Menores de Edad (OVUAC)?
  choices:
    A: Pagar una multa de $5,000 y entregar su vehículo.
    B: Tomar un curso de conducción correctiva y volver a realizar el examen de licencia
      de conducir.
    C: Perder permanentemente su licencia de conducir.
    D: Instalar un dispositivo de bloqueo de encendido por diez años.
  answer: B
  explanation: Una condena por OVUAC puede resultar en una suspensión de la licencia
    y requerir que el conductor tome un curso de conducción correctiva, pague las
    tarifas de reinstalación y vuelva a realizar el examen de licencia de conducir.
- id: 94
  category: vehicle_information
  question: ¿Qué es una fianza SR-22?
  choices:
    A: Un tipo especial de seguro de auto premium.
    B: Un certificado de responsabilidad financiera presentado ante el estado.
    C: Una fianza utilizada para evitar la cárcel por infracciones de tráfico.
    D: Un documento de registro de vehículo para conductores comerciales.
  answer: B
  explanation: Un SR-22 es un certificado de responsabilidad financiera presentado
    ante el estado, que sirve como prueba de que su póliza de seguro de auto cumple
    con la cobertura mínima de responsabilidad civil.
- id: 95
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal que una persona menor de 16 años viaje en
    el área de carga abierta de un camión que viaja a más de 25 mph?
  choices:
    A: Si están sentados y sujetándose de los lados.
    B: Si están acompañados por un adulto.
    C: Si el área de carga está equipada con un asiento debidamente asegurado y un
      cinturón de seguridad.
    D: Nunca es legal bajo ninguna circunstancia.
  answer: C
  explanation: Un conductor puede permitir que una persona menor de 16 años viaje
    en un área de carga abierta a más de 25 mph si el área está equipada con un asiento
    debidamente asegurado y un cinturón de seguridad que cumpla con los estándares
    federales.
- id: 96
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una condena de conducir bajo suspensión,
    que es un delito menor de primer grado?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: Operar un vehículo motorizado mientras su licencia está bajo suspensión
    es un delito menor de primer grado, sujeto a una multa de hasta $1,000.
- id: 97
  category: safe_driving_rules
  question: Un niño que tiene al menos 4 años pero menos de 8 años debe estar debidamente
    sujeto en un asiento elevado (booster seat) a menos que alcance ¿qué altura?
  choices:
    A: 4 pies 5 pulgadas
    B: 4 pies 9 pulgadas
    C: 5 pies 0 pulgadas
    D: 5 pies 2 pulgadas
  answer: B
  explanation: Un niño de al menos 4 años pero menos de 8 años debe estar en un asiento
    elevado a menos que el niño mida 4 pies 9 pulgadas de altura o más.
- id: 98
  category: safe_driving_rules
  question: Las luces delanteras deben encenderse cuando las condiciones de luz natural
    no permitan ver claramente objetos a ¿qué distancia?
  choices:
    A: 250 pies
    B: 500 pies
    C: 1,000 pies
    D: 2,000 pies
  answer: C
  explanation: Las luces deben estar encendidas en cualquier momento en que las condiciones
    de luz natural no permitan ver claramente objetos a 1,000 pies de distancia.
- id: 99
  category: driver_responsibility
  question: Si un agente de la ley lo detiene y tiene un arma en el vehículo, ¿qué
    debe hacer?
  choices:
    A: Esconder el arma debajo del asiento antes de que el oficial se acerque.
    B: Informar al oficial al primer contacto.
    C: Esperar hasta que el oficial pregunte si tiene armas.
    D: Salir del vehículo para mostrarle el arma al oficial.
  answer: B
  explanation: El manual establece que si tiene un arma(s) en el vehículo, debe informar
    al oficial al primer contacto.
- id: 100
  category: safe_driving_rules
  question: Según la ley de Ohio, ¿cuándo deben encenderse las luces delanteras de
    su vehículo?
  choices:
    A: Solo entre las 8 PM y las 6 AM
    B: Entre la puesta del sol y el amanecer
    C: Solo cuando se conduce por carreteras sin iluminación
    D: Entre el amanecer y la puesta del sol
  answer: B
  explanation: El manual establece que las luces delanteras deben estar encendidas
    entre la puesta del sol y el amanecer.
- id: 101
  category: safe_driving_rules
  question: Además de la noche, ¿en qué otro momento exige la ley de Ohio que use
    sus faros delanteros?
  choices:
    A: Siempre que conduzca por una autopista
    B: En cualquier momento en que los limpiaparabrisas estén en uso debido a la precipitación
    C: Solo cuando la visibilidad sea inferior a 500 pies
    D: Siempre que conduzca a más de 50 mph
  answer: B
  explanation: Según el manual, las luces deben estar encendidas en cualquier momento
    en que los limpiaparabrisas estén en uso debido a la precipitación.
- id: 102
  category: defensive_driving
  question: ¿Qué debe hacer para evitar quedar momentáneamente cegado por los faros
    de un vehículo que se aproxima por la noche?
  choices:
    A: Hacer destellos con las luces altas repetidamente
    B: Mirar hacia el lado izquierdo de la carretera
    C: Mirar hacia el lado derecho de la carretera
    D: Cerrar los ojos por un breve segundo
  answer: C
  explanation: Para evitar quedar momentáneamente cegado por los faros de un vehículo
    que se aproxima, el manual aconseja mirar hacia el lado derecho de la carretera.
- id: 103
  category: safe_driving_rules
  question: ¿Qué faros debe utilizar al conducir con niebla?
  choices:
    A: Faros de luz alta
    B: Faros de luz baja
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia
  answer: B
  explanation: Al conducir con niebla, debe utilizar los faros de luz baja (no las
    luces altas) y seguir escaneando el área en busca de posibles peligros.
- id: 104
  category: defensive_driving
  question: ¿Qué áreas de una autopista tienen más probabilidades de congelarse primero
    durante el clima invernal?
  choices:
    A: Intersecciones y pasos de peatones
    B: Tramos rectos y pendientes cuesta arriba
    C: Puentes, pasos elevados y zonas sombreadas
    D: Túneles y pasos subterráneos
  answer: C
  explanation: El manual señala específicamente que debe recordar que los puentes,
    los pasos elevados y las zonas sombreadas de una autopista se congelan primero.
- id: 105
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a derrapar en una carretera con
    hielo?
  choices:
    A: Pisar los frenos a fondo y mantener el volante recto
    B: Quitar el pie del acelerador y girar el volante en la dirección del derrape
    C: Acelerar rápidamente para recuperar la tracción
    D: Aplicar los frenos con firmeza y girar el volante en dirección opuesta al derrape
  answer: B
  explanation: Si su vehículo comienza a derrapar, quite el pie del acelerador y gire
    el volante en la dirección del derrape. Nunca debe aplicar los frenos mientras
    derrapa.
- id: 106
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales de zona de obras (Work Zone)?
  choices:
    A: Fondo amarillo con letras negras
    B: Fondo blanco con letras rojas
    C: Fondo naranja con letras o símbolos negros
    D: Fondo verde con letras blancas
  answer: C
  explanation: Las señales de zona de obras tienen un fondo naranja y letras o símbolos
    negros.
- id: 107
  category: defensive_driving
  question: Al mirar hacia adelante en su trayectoria de viaje planificada, ¿a qué
    distancia frente a su automóvil debería intentar mirar idealmente?
  choices:
    A: De 5 a 10 segundos
    B: De 10 a 15 segundos
    C: De 20 a 30 segundos
    D: De 40 a 50 segundos
  answer: C
  explanation: Idealmente, intente observar lo que ocurre de 20 a 30 segundos por
    delante de su automóvil para tener tiempo de ajustar y planificar los movimientos
    de conducción.
- id: 108
  category: safe_driving_rules
  question: ¿Cómo debe ajustar su velocidad al entrar en una curva?
  choices:
    A: Acelerar fuertemente antes de entrar en la curva
    B: Mantener su velocidad y frenar bruscamente en medio de la curva
    C: Reducir la velocidad antes de entrar en la curva para permitir una aceleración
      ligera y constante a través de ella
    D: Avanzar por inercia a través de la curva con el pie en el freno
  answer: C
  explanation: Antes de entrar en una curva, reduzca la velocidad a una velocidad
    segura que le permita aplicar una aceleración ligera y constante a través de la
    curva.
- id: 109
  category: defensive_driving
  question: ¿Cuál es la mejor manera de evitar la pérdida de tracción por hidroplaneo
    (hydroplaning)?
  choices:
    A: Conducir más rápido para alejar el agua de los neumáticos
    B: Bombear los frenos rápidamente al conducir a través de charcos
    C: Reducir la velocidad al conducir bajo la lluvia y cuando la carretera esté
      mojada con agua acumulada
    D: Girar el volante bruscamente de un lado a otro
  answer: C
  explanation: La mejor manera de evitar la pérdida de tracción por hidroplaneo es
    reducir la velocidad al conducir bajo la lluvia y cuando la carretera esté mojada
    con agua acumulada o charcos de agua.
- id: 110
  category: driver_responsibility
  question: ¿Cuál es el tiempo de percepción promedio para que un conductor alerta
    reconozca la necesidad de detenerse?
  choices:
    A: 1/4 a 1/2 segundo
    B: 3/4 de segundo a 1 segundo
    C: 1.5 a 2 segundos
    D: 3 a 4 segundos
  answer: B
  explanation: El tiempo de percepción promedio para un conductor alerta es de 3/4
    de segundo a 1 segundo.
- id: 111
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada entre su vehículo
    y el vehículo de adelante en condiciones ideales?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Siempre intente mantener una distancia de seguimiento mínima de un
    largo de vehículo por cada 10 millas por hora de velocidad, o cuatro segundos
    entre su vehículo y el vehículo de adelante.
- id: 112
  category: sharing_the_road
  question: ¿En cuál de las siguientes situaciones debería aumentar su distancia de
    seguimiento?
  choices:
    A: Al conducir en un día despejado y soleado
    B: Al seguir a vehículos que deben detenerse en cruces ferroviarios, como los
      autobuses
    C: Al conducir en una carretera seca y recién pavimentada
    D: Al rebasar a un vehículo que circula despacio en un tramo recto
  answer: B
  explanation: Debe aumentar su distancia de seguimiento cuando siga a vehículos que
    deben detenerse en cruces ferroviarios, como autobuses, o vehículos que transporten
    materiales peligrosos.
- id: 113
  category: safe_driving_rules
  question: ¿A qué distancia deben las condiciones de luz natural permitir ver claramente
    los objetos que se encuentran adelante antes de que sea obligatorio el uso de
    los faros delanteros?
  choices:
    A: 250 pies
    B: 500 pies
    C: 1,000 pies
    D: 2,000 pies
  answer: C
  explanation: Las luces deben estar encendidas en cualquier otro momento en que las
    condiciones de luz natural no permitan ver claramente objetos a 1,000 pies de
    distancia.
- id: 114
  category: safe_driving_rules
  question: Según la ley de Ohio, ¿cuándo es obligatorio usar los faros delanteros?
  choices:
    A: Solo desde el atardecer hasta el amanecer
    B: Desde el atardecer hasta el amanecer, durante condiciones de poca visibilidad
      y cuando se usen los limpiaparabrisas
    C: Solo al conducir en carreteras rurales sin iluminación
    D: Entre las 8 PM y las 6 AM
  answer: B
  explanation: La ley de Ohio exige el uso de los faros delanteros desde el atardecer
    hasta el amanecer, en cualquier momento en que la visibilidad sea escasa (lluvia,
    nieve, niebla, etc.) y siempre que los limpiaparabrisas estén en uso debido a
    la precipitación.
- id: 115
  category: safe_driving_rules
  question: ¿Con cuánta anticipación a un giro debe señalizar su intención de cambiar
    de dirección?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: B
  explanation: El manual establece que debe señalizar un giro al menos 100 pies antes
    de realizarlo para dar tiempo a reaccionar a otros usuarios de la vía.
- id: 116
  category: driver_responsibility
  question: ¿Qué tan rápido puede aumentar la temperatura dentro de un vehículo en
    20 grados Fahrenheit, incluso con las ventanas ligeramente abiertas?
  choices:
    A: 5 minutos
    B: 10 minutos
    C: 20 minutos
    D: 30 minutos
  answer: B
  explanation: Incluso con las ventanas ligeramente abiertas, la temperatura en un
    vehículo puede aumentar 20 grados (Fahrenheit) en solo 10 minutos, lo que hace
    que sea extremadamente peligroso dejar mascotas o niños en el interior.
- id: 117
  category: sharing_the_road
  question: ¿Qué peatones tienen siempre el derecho de paso al cruzar la calle?
  choices:
    A: Peatones que corren en un carril para bicicletas designado
    B: Peatones que llevan un bastón blanco o utilizan un perro guía
    C: Peatones que cruzan fuera de un paso de peatones marcado
    D: Peatones que visten ropa altamente reflectante
  answer: B
  explanation: El manual especifica que los peatones con discapacidad visual o ciegos
    (que llevan un bastón blanco o utilizan un perro guía) tienen el derecho de paso.
- id: 118
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento mínima recomendada al conducir detrás
    de un motociclista en condiciones normales?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 6 segundos
  answer: C
  explanation: Al seguir a un motociclista, debe permitir una distancia de seguimiento
    mínima de 4 segundos, o más en condiciones de humedad, para asegurarse de tener
    tiempo suficiente para evitar un choque.
- id: 119
  category: sharing_the_road
  question: ¿Por qué no debe asumir automáticamente que una motocicleta va a girar
    solo porque su luz direccional está parpadeando?
  choices:
    A: Los motociclistas suelen usar las luces direccionales para indicar que están
      disminuyendo la velocidad
    B: Es posible que las luces direccionales de las motocicletas no se cancelen automáticamente
      y que el conductor haya olvidado apagarlas
    C: La luz parpadeante indica que la motocicleta tiene problemas mecánicos
    D: Las luces direccionales en las motocicletas solo se usan para cambiar de carril,
      no para girar
  answer: B
  explanation: No asuma que una motocicleta va a girar cuando vea su luz direccional
    parpadeando porque las luces direccionales de las motocicletas pueden no cancelarse
    automáticamente y el motociclista puede haber olvidado apagarlas.
- id: 120
  category: sharing_the_road
  question: Al rebasar a un ciclista, ¿cuál es la zona de seguridad mínima que debe
    mantener entre su vehículo motorizado y la bicicleta?
  choices:
    A: Un pie
    B: Dos pies
    C: Tres pies
    D: Cinco pies
  answer: C
  explanation: Los conductores deben mantener una zona de seguridad de al menos tres
    pies entre un vehículo motorizado y una bicicleta al rebasar.
- id: 121
  category: sharing_the_road
  question: ¿Por qué es peligroso meterse entre un vehículo comercial grande y el
    bordillo (acera) cuando este está girando a la derecha?
  choices:
    A: El vehículo comercial puede acelerar repentinamente
    B: El vehículo comercial puede realizar un giro amplio a la derecha desde el carril
      izquierdo para librar la esquina
    C: El bordillo puede dañar gravemente los neumáticos de su vehículo
    D: Los vehículos comerciales siempre tienen el derecho de paso en todas las intersecciones
  answer: B
  explanation: Los camiones o autobuses pueden realizar un giro amplio a la derecha
    desde el carril izquierdo para librar la esquina de un bordillo u otra obstrucción.
    Meterse entre el vehículo grande y el bordillo causará un choque grave.
- id: 122
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en la "Zona No" (punto ciego) lateral
    de un camión grande?
  choices:
    A: Está conduciendo exactamente a tres largos de automóvil detrás del camión
    B: No puede ver las luces de freno del camión
    C: No puede ver la cara del conductor del camión en su espejo retrovisor lateral
    D: Está conduciendo en el carril inmediatamente a la derecha del camión
  answer: C
  explanation: Los camiones grandes y los autobuses tienen grandes "Zonas No" en ambos
    lados. Si no puede ver la cara del conductor en el espejo retrovisor lateral,
    el conductor no puede verlo a usted.
- id: 123
  category: sharing_the_road
  question: Bajo condiciones ideales, ¿cuál es la distancia mínima de frenado para
    un camión cargado que viaja a 55 mph?
  choices:
    A: 150 pies
    B: 200 pies
    C: 250 pies
    D: 335 pies
  answer: D
  explanation: Un camión cargado con buenos neumáticos y frenos ajustados correctamente,
    bajo condiciones ideales y viajando a 55 mph, requiere un mínimo de 335 pies antes
    de detenerse por completo.
- id: 124
  category: driver_responsibility
  question: ¿Qué debe hacer si ve a un niño solo en un vehículo y parece estar en
    peligro o no responde?
  choices:
    A: Esperar junto al coche hasta que regresen los padres
    B: Llamar al 911 de inmediato y tomar medidas para sacar al niño, rompiendo una
      ventana si es necesario
    C: Dejar una nota en el parabrisas advirtiendo a los padres del peligro
    D: Entrar en las tiendas cercanas para localizar al dueño del vehículo antes de
      tomar medidas
  answer: B
  explanation: Si un niño está en peligro o no responde, llame al 911 de inmediato
    y tome medidas para sacar al niño del vehículo, rompiendo una ventana si es necesario.
    Las leyes del "Buen Samaritano" protegen a las personas que responden en una emergencia.
- id: 125
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los ciclistas
    en la vía pública?
  choices:
    A: Los ciclistas deben circular en sentido contrario al tráfico vehicular para
      ver los coches que vienen
    B: Las bicicletas se consideran vehículos y deben circular con el tráfico vehicular
    C: Los ciclistas no están obligados a obedecer las señales de tráfico
    D: Los ciclistas siempre deben circular por la acera cuando haya una disponible
  answer: B
  explanation: Las bicicletas se consideran vehículos cuando están en las vías públicas
    y deben circular con, no en contra, del resto del tráfico vehicular. También están
    obligadas a obedecer todas las señales de tráfico y marcas en el pavimento.
- id: 126
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es apropiado usar la bocina de
    su vehículo?
  choices:
    A: Para expresar enojo por el error de otro conductor
    B: Para asustar a un ciclista que circula demasiado lento
    C: Para alertar a un peatón que parece estar moviéndose hacia su carril de circulación
    D: Para saludar a un amigo que camina por la acera
  answer: C
  explanation: Debe tocar la bocina ligeramente para comunicarse con los demás cuando
    peatones o ciclistas parezcan estar moviéndose hacia su carril de circulación.
    Usar la bocina de manera inapropiada podría asustar o enojar a otro usuario de
    la vía.
- id: 127
  category: defensive_driving
  question: ¿Cómo puede ayudar a mantener una distancia de seguimiento segura para
    el conductor que va detrás de su vehículo?
  choices:
    A: Pisando los frenos con frecuencia para mantenerlo alerta
    B: Manteniendo una velocidad constante y señalizando sus intenciones con anticipación
    C: Acelerando rápidamente para crear más distancia
    D: Moviéndose al punto ciego del vehículo que está a su lado
  answer: B
  explanation: Puede ayudar a mantener al conductor detrás de usted a una distancia
    segura manteniendo una velocidad constante, señalizando con anticipación y dejando
    más espacio frente a su vehículo antes de reducir la velocidad o girar.
- id: 128
  category: sharing_the_road
  question: ¿Por qué es importante detenerse siempre detrás de las líneas de parada
    de las intersecciones?
  choices:
    A: Evita que los peatones crucen la calle
    B: Hace que el semáforo cambie más rápido
    C: Lo sitúa más atrás para dar a los vehículos más grandes más espacio para girar
    D: Le permite acelerar más rápido cuando la luz cambia a verde
  answer: C
  explanation: Deténgase siempre detrás de las líneas de parada de las intersecciones
    porque estas líneas ayudan a situarlo más atrás en una intersección para dar a
    los vehículos más grandes más espacio para girar.
- id: 129
  category: sharing_the_road
  question: ¿Hasta qué distancia pueden extenderse los puntos ciegos directamente
    detrás de los vehículos grandes?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 200 pies
    D: Hasta 300 pies
  answer: C
  explanation: A diferencia de los vehículos de pasajeros, los vehículos grandes tienen
    puntos ciegos enormes directamente detrás de ellos que se extienden hasta 200
    pies.
- id: 130
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor cuando se aproxima un vehículo de emergencia
    que muestra luces intermitentes y sirenas audibles?
  choices:
    A: Detenerse inmediatamente en el carril actual
    B: Orillarse rápida y seguramente al lado derecho de la carretera y detenerse
    C: Acelerar para despejar la intersección rápidamente
    D: Orillarse al lado izquierdo de la carretera y detenerse
  answer: B
  explanation: Cuando se aproximan vehículos de emergencia, el conductor debe orillarse
    rápida y seguramente al lado derecho de la carretera y detenerse, evitando bloquear
    las intersecciones.
- id: 131
  category: safe_driving_rules
  question: Bajo la Ley de Moverse al Carril Contiguo (Move Over Law) de Ohio, ¿qué
    debe hacer si no es seguro cambiar de carril al acercarse a un vehículo de emergencia
    detenido con sus luces de advertencia activadas?
  choices:
    A: Detenerse inmediatamente detrás del vehículo de emergencia
    B: Mantener su velocidad y tocar la bocina
    C: Reducir la velocidad y proceder con precaución
    D: Acelerar para pasar el vehículo lo más rápido posible
  answer: C
  explanation: Si un cambio de carril no es seguro, la Ley de Moverse al Carril Contiguo
    exige que los conductores reduzcan la velocidad y procedan con precaución, manteniendo
    una velocidad segura para las condiciones del tráfico.
- id: 132
  category: signs_and_signals
  question: ¿Qué indica un triángulo fluorescente o reflectante de color naranja y
    rojo que se muestra en la parte trasera de un vehículo?
  choices:
    A: El vehículo transporta materiales peligrosos
    B: El vehículo viaja a menos de 25 mph
    C: El vehículo realiza paradas frecuentes
    D: El vehículo está averiado
  answer: B
  explanation: Un triángulo fluorescente o reflectante de color naranja y rojo que
    se muestra en la parte trasera de los vehículos significa que el vehículo viaja
    a menos de 25 mph.
- id: 133
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite cruzar una línea amarilla continua para
    rebasar a un vehículo que circula lentamente?
  choices:
    A: Si el vehículo viaja a menos de la mitad del límite de velocidad indicado
    B: Si el vehículo es una pieza de maquinaria agrícola
    C: Si toca la bocina antes de rebasar
    D: Si está conduciendo en una zona rural
  answer: A
  explanation: Se le permite cruzar una línea amarilla continua para rebasar a un
    vehículo que circula lentamente siempre que el vehículo viaje a menos de la mitad
    del límite de velocidad indicado, usted no exceda el límite de velocidad y haya
    suficiente espacio libre.
- id: 134
  category: defensive_driving
  question: ¿Cuál es el procedimiento adecuado si su vehículo comienza a derrapar?
  choices:
    A: Frenar bruscamente y mantener el volante recto
    B: Acelerar rápidamente para recuperar la tracción
    C: Dejar de presionar el freno o el acelerador y girar el volante hacia la dirección
      del derrape
    D: Girar el volante en la dirección opuesta al derrape
  answer: C
  explanation: Cuando comience a derrapar, debe dejar de presionar el freno o el acelerador
    y girar el volante hacia la dirección del derrape.
- id: 135
  category: safe_driving_rules
  question: ¿Cómo debe tratar un conductor una intersección con un semáforo inoperante
    debido a un corte de energía, si no hay un oficial de la ley presente?
  choices:
    A: Como una señal de ceda el paso
    B: Como una parada de cuatro vías (four-way stop)
    C: Proceder sin detenerse si la carretera parece despejada
    D: Solo los vehículos en la carretera más grande tienen el derecho de paso
  answer: B
  explanation: Por ley, excepto cuando un oficial de la ley esté presente para dirigir
    el tráfico, los conductores deben tratar un semáforo que no funciona como una
    parada de cuatro vías.
- id: 136
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se sale de la superficie pavimentada de
    la carretera y se encuentra con un desnivel en la superficie?
  choices:
    A: Girar el volante bruscamente para regresar al pavimento de inmediato
    B: Frenar bruscamente para detener el vehículo
    C: Acelerar para volver a la carretera rápidamente
    D: Soltar el acelerador, reducir la velocidad gradualmente y regresar al pavimento
      cuando sea seguro
  answer: D
  explanation: Si su vehículo se sale de la superficie pavimentada de la carretera,
    suelte el acelerador, reduzca la velocidad gradualmente y, cuando sea seguro hacerlo,
    regrese al pavimento.
- id: 137
  category: vehicle_information
  question: Si el acelerador de su vehículo se queda trabado y el vehículo acelera
    fuera de control, ¿a qué marcha debe cambiar?
  choices:
    A: PARK (Estacionamiento)
    B: REVERSE (Reversa)
    C: NEUTRAL (Punto muerto)
    D: DRIVE (Conducir)
  answer: C
  explanation: Si su vehículo acelera fuera de control, debe encender las luces intermitentes
    de emergencia, cambiar a la marcha 'NEUTRAL' y buscar una ruta de escape.
- id: 138
  category: vehicle_information
  question: ¿Cuál de las siguientes es la acción correcta a tomar si experimenta un
    reventón de neumático mientras conduce?
  choices:
    A: Frenar fuerte inmediatamente para detener el vehículo
    B: No frenar; reducir la velocidad gradualmente
    C: Acelerar ligeramente para mantener el control de la dirección
    D: Bombear los frenos rápidamente
  answer: B
  explanation: En caso de un reventón de neumático, debe sujetar el volante con firmeza,
    mantener el vehículo recto y no frenar; reduzca la velocidad gradualmente.
- id: 139
  category: defensive_driving
  question: Si su vehículo se avería, ¿a qué distancia detrás del vehículo debe colocar
    bengalas de emergencia si es posible?
  choices:
    A: De 50 a 100 pies
    B: De 100 a 150 pies
    C: De 200 a 300 pies
    D: De 400 a 500 pies
  answer: C
  explanation: Si es posible, coloque bengalas de emergencia a unos 200 o 300 pies
    detrás del vehículo para alertar a otros conductores y darles tiempo de cambiar
    de carril.
- id: 140
  category: driver_responsibility
  question: Al intercambiar información después de un choque, ¿qué debe evitar discutir?
  choices:
    A: Los nombres y direcciones de los testigos
    B: Los números de placa de los vehículos involucrados
    C: La culpa o la cobertura del seguro
    D: El clima y las condiciones de la carretera
  answer: C
  explanation: Al intercambiar información con otras personas involucradas en el accidente,
    debe proporcionar detalles de contacto y del vehículo, pero no discuta la culpa
    ni la cobertura del seguro.
- id: 141
  category: sharing_the_road
  question: ¿Además de un emblema de vehículo de movimiento lento, qué debe exhibir
    la maquinaria agrícola cuando circula de noche?
  choices:
    A: Una luz blanca intermitente
    B: Una luz roja intermitente
    C: Luces delanteras de largo alcance (altas)
    D: Solo luces de emergencia
  answer: B
  explanation: La maquinaria agrícola debe exhibir el emblema de vehículo de movimiento
    lento y usar una luz roja intermitente por la noche.
- id: 142
  category: vehicle_information
  question: Si el motor se apaga mientras conduce (falla de energía), ¿qué debe esperar
    con respecto al volante?
  choices:
    A: El volante se bloqueará por completo y no podrá girarse
    B: El volante girará mucho más fácil de lo normal
    C: El volante puede ser difícil de girar, pero usted puede girarlo
    D: El volante dirigirá automáticamente el vehículo hacia la derecha
  answer: C
  explanation: Si el motor se apaga mientras conduce, mantenga el volante con firmeza.
    Tenga en cuenta que el volante puede ser difícil de girar, pero usted puede girarlo.
- id: 143
  category: driver_responsibility
  question: ¿Bajo qué condiciones puede un conductor presentar un Informe de Choque
    (formulario BMV 3303) ante la Oficina de Vehículos Motorizados de Ohio?
  choices:
    A: Dentro de los 30 días si el daño es superior a $1,000
    B: Dentro de los 6 meses si el daño supera los $400 o hay lesiones, y el otro
      conductor no tenía seguro
    C: Dentro de 1 año por cualquier choque que involucre dos o más vehículos
    D: Dentro de las 24 horas si hay algún daño visible en cualquiera de los vehículos
  answer: B
  explanation: El manual establece que un conductor puede presentar un Informe de
    Choque dentro de los seis meses si hubo daños superiores a $400 o lesiones personales,
    y el conductor o propietario del otro vehículo no tenía seguro.
- id: 144
  category: driver_responsibility
  question: ¿Qué debe hacer si se ve involucrado en un choque con un vehículo desatendido?
  choices:
    A: Esperar junto al vehículo hasta que regrese el dueño
    B: Reportar el choque a la policía o dejar la información necesaria en la escena
    C: Notificar únicamente a su compañía de seguros
    D: Abandonar la escena de inmediato si no hay daños visibles
  answer: B
  explanation: Si se ve involucrado en un choque con un vehículo desatendido, debe
    reportar el choque a la policía o dejar la información necesaria en la escena.
- id: 145
  category: driver_testing
  question: ¿Cuál de los siguientes componentes del vehículo se revisa durante la
    inspección del vehículo antes de que comience el examen de conducción?
  choices:
    A: El aire acondicionado y el radio
    B: Las luces direccionales, las luces de freno y la bocina
    C: El nivel de aceite del motor y la presión de los neumáticos
    D: La luz de cortesía interior y el pestillo de la guantera
  answer: B
  explanation: Una inspección del vehículo realizada antes de que comience el examen
    verificará el funcionamiento de las luces direccionales, las luces de freno, la
    bocina, los limpiaparabrisas y los faros delanteros.
- id: 146
  category: driver_testing
  question: ¿Cuál es un requisito para las puertas del vehículo durante la inspección
    del examen de conducción?
  choices:
    A: Las cuatro puertas deben tener activados los seguros para niños
    B: Las puertas traseras deben abrirse solo desde el interior
    C: Las puertas delanteras deben poder abrirse desde el interior y el exterior
    D: La puerta del conductor debe tener una ventana automática
  answer: C
  explanation: El manual especifica que las puertas delanteras deben poder abrirse
    desde el interior y el exterior con la manija de la puerta.
- id: 147
  category: driver_testing
  question: ¿Qué acción resulta en una reprobación inmediata durante el examen de
    habilidades de maniobrabilidad?
  choices:
    A: Detenerse para revisar sus espejos
    B: Calcular mal la distancia de frenado por unas pocas pulgadas
    C: Atropellar o derribar un marcador
    D: Completar el recorrido demasiado lento
  answer: C
  explanation: Es una reprobación inmediata si un conductor atropella o derriba un
    marcador, retira el marcador del área designada o realiza otras acciones peligrosas.
- id: 148
  category: driver_testing
  question: En el Paso Uno del examen de maniobrabilidad, ¿dónde debe detener el vehículo?
  choices:
    A: Cuando el parachoques delantero toque el marcador central
    B: Cuando el parachoques trasero esté nivelado con el marcador central
    C: Cuando el vehículo haya pasado por completo los cinco marcadores
    D: Cuando el parachoques delantero esté nivelado con los dos marcadores traseros
  answer: B
  explanation: En el Paso Uno, debe conducir recto hacia adelante y detenerse cuando
    el parachoques trasero del vehículo esté nivelado con el marcador central y generalmente
    paralelo al recorrido.
- id: 149
  category: driver_testing
  question: ¿Cuánto tiempo debe esperar un solicitante menor de 21 años antes de volver
    a presentar el examen si reprueba el examen de conducción?
  choices:
    A: 24 horas
    B: Dos días
    C: Una semana
    D: 30 días
  answer: B
  explanation: Los solicitantes menores de 21 años deben esperar dos días antes de
    volver a presentar el examen después de haber reprobado.
- id: 150
  category: driver_testing
  question: ¿Qué se requiere para un solicitante de 21 años o más que reprueba el
    examen de conducción por primera vez, asumiendo que no ha tomado un curso de educación
    vial aprobado recientemente?
  choices:
    A: Esperar 30 días antes de volver a presentar el examen
    B: Tomar un Curso Abreviado de Capacitación para Conductores Adultos
    C: Completar 50 horas de conducción supervisada
    D: Pagar una tarifa de $100 por volver a presentar el examen
  answer: B
  explanation: Un solicitante de 21 años o más que repruebe la parte de maniobrabilidad
    o de habilidades viales del examen de conducción debe tomar un Curso Abreviado
    de Capacitación para Conductores Adultos antes de intentar el examen de conducción
    por segunda vez.
- id: 151
  category: driver_testing
  question: ¿Si un solicitante adulto elige la opción de 24 horas de conducción con
    un conductor con licencia de 21 años o más para su Capacitación Abreviada para
    Conductores Adultos, cuál es el número máximo de horas de conducción permitidas
    por día?
  choices:
    A: Dos horas
    B: Cuatro horas
    C: Seis horas
    D: Ocho horas
  answer: B
  explanation: Los solicitantes que elijan la opción de 24 horas de conducción con
    un conductor con licencia de 21 años o más no pueden completar más de cuatro horas
    de conducción en un solo día.
- id: 152
  category: license_system
  question: ¿Qué formulario específico debe proporcionar un solicitante menor de 18
    años al comprar su licencia de conducir?
  choices:
    A: Declaración Jurada de Veinticuatro Horas (formulario BMV 5789)
    B: Declaración Jurada de Cincuenta Horas Notariada (formulario BMV 5791)
    C: Prueba de inscripción en la escuela secundaria
    D: Formulario de autorización médica
  answer: B
  explanation: Si el solicitante es menor de 18 años, debe llevar una Declaración
    Jurada de Cincuenta Horas Notariada (formulario BMV 5791) a la agencia del Registrador
    Adjunto (Deputy Registrar).
- id: 153
  category: driver_responsibility
  question: ¿Por cuánto tiempo es un padre o tutor legal que firma conjuntamente la
    solicitud de un menor responsable solidario por los daños causados por la negligencia
    del menor?
  choices:
    A: Hasta que el menor cumpla 21 años
    B: Durante los primeros seis meses de conducción
    C: Hasta el cumpleaños número 18 del menor
    D: Hasta que el menor compre su propio vehículo
  answer: C
  explanation: El padre o tutor legal que firma conjuntamente la solicitud de un menor
    es responsable solidaria y conjuntamente con el menor por cualquier daño causado
    por negligencia o mala conducta intencional hasta el cumpleaños número 18 del
    menor.
- id: 154
  category: license_system
  question: ¿Cómo puede un cosignatario cancelar su autorización para la licencia
    de conducir de un menor?
  choices:
    A: Llamando al departamento de policía local
    B: Enviando por correo la licencia del menor o una carta notariada al BMV
    C: Enviando un correo electrónico al Coordinador de la ADA
    D: Destruyendo la tarjeta física de la licencia del menor
  answer: B
  explanation: Un cosignatario puede cancelar la autorización para un menor en cualquier
    momento enviando por correo la Licencia de Conducir o el TIPIC del menor, o una
    carta notariada solicitando la cancelación a la Oficina de Vehículos Motorizados
    (BMV) de Ohio.
- id: 155
  category: license_system
  question: ¿Cuántos documentos que acrediten una dirección en Ohio se requieren para
    obtener una tarjeta de Licencia de Conducir que cumpla con las normas (Compliant)?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Obtener una tarjeta que cumpla con las normas (Compliant) requiere
    más documentos de identidad que la tarjeta Estándar, incluyendo dos documentos
    para probar una dirección en Ohio.
- id: 156
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a una tarjeta
    de Licencia de Conducir Estándar?
  choices:
    A: Cumple con todos los requisitos nacionales de seguridad para viajes
    B: Requiere más documentos de identidad que la tarjeta Compliant
    C: No se puede usar para volar comercialmente sin un pasaporte u otro documento
      aprobado por la TSA
    D: Solo se emite a conductores menores de 21 años
  answer: C
  explanation: La Tarjeta Estándar no cumple con los requisitos nacionales de seguridad
    para viajes y deberá usarse junto con un pasaporte u otros documentos aceptables
    aprobados por la TSA para poder volar comercialmente.
- id: 157
  category: driver_testing
  question: ¿Qué se debe hacer con las herramientas de asistencia automatizada, como
    el estacionamiento automatizado, durante el examen de conducción?
  choices:
    A: Deben usarse para demostrar competencia
    B: Deben estar desactivadas
    C: Pueden usarse solo durante la parte de maniobrabilidad
    D: Son obligatorias para todos los solicitantes mayores de 65 años
  answer: B
  explanation: Durante la inspección del vehículo antes de que comience el examen,
    las herramientas de asistencia automatizada, como el estacionamiento automatizado,
    deben estar desactivadas.
- id: 158
  category: license_system
  question: ¿Cuál de los siguientes NO es uno de los cinco elementos requeridos para
    la prueba de identidad al solicitar una Licencia de Conducir de Ohio?
  choices:
    A: Nombre legal completo
    B: Número de Seguro Social
    C: Prueba de empleo
    D: Fecha de nacimiento
  answer: C
  explanation: Los solicitantes deben proporcionar documentación aceptable para la
    prueba de identidad que incluya el Nombre legal completo, Fecha de nacimiento,
    Número de Seguro Social, Dirección en Ohio y Ciudadanía o Presencia legal.
- id: 159
  category: safe_driving_rules
  question: Durante los primeros 12 meses de tener una Licencia de Conducir, ¿un conductor
    menor de 18 años no puede operar un vehículo entre qué horas a menos que esté
    acompañado por un padre o tutor?
  choices:
    A: 10 p.m. a 5 a.m.
    B: 11 p.m. a 6 a.m.
    C: Medianoche a 6 a.m.
    D: 1 a.m. a 5 a.m.
  answer: C
  explanation: Durante los primeros 12 meses de tener una Licencia de Conducir, un
    nuevo conductor menor de 18 años no puede operar un vehículo desde la medianoche
    hasta las 6 a.m., a menos que esté acompañado por un padre o tutor o cumpla con
    otras excepciones específicas.
- id: 160
  category: safe_driving_rules
  question: ¿Un conductor menor de 18 años en sus primeros 12 meses de tener una licencia
    no puede operar un vehículo con más de cuántos pasajeros que no sean miembros
    de la familia sin un padre o tutor?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: El conductor no puede operar un vehículo con más de un pasajero que
    no sea miembro de la familia, a menos que esté acompañado por un padre o tutor.
- id: 161
  category: safe_driving_rules
  question: ¿Después de los primeros 12 meses de tener una licencia de conducir, cuáles
    son las horas de conducción restringidas para un conductor menor de 18 años (a
    menos que se aplique una excepción)?
  choices:
    A: Medianoche a 6 a.m.
    B: 1 a.m. a 5 a.m.
    C: 10 p.m. a 6 a.m.
    D: 11 p.m. a 5 a.m.
  answer: B
  explanation: Después de los primeros 12 meses de tener una licencia de conducir,
    el conductor menor de 18 años no puede operar un vehículo de 1 a.m. a 5 a.m.,
    a menos que se aplique una excepción.
- id: 162
  category: penalties_and_points
  question: Para un conductor menor de 18 años, múltiples condenas de tráfico antes
    de cumplir los 18 años pueden resultar en una suspensión de la licencia de ¿qué
    duración?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses
  answer: C
  explanation: Múltiples condenas de tráfico antes de que el conductor cumpla 18 años
    pueden resultar en una suspensión de la licencia de 90 días.
- id: 163
  category: license_system
  question: Si es menor de 21 años, ¿cuándo vence su licencia de conducir de Ohio?
  choices:
    A: En su cumpleaños número 18
    B: En su cumpleaños número 21
    C: Cuatro años a partir de la fecha de emisión
    D: Ocho años a partir de la fecha de emisión
  answer: B
  explanation: Si es menor de 21 años, su licencia de conducir de Ohio vence en su
    cumpleaños número 21 y debe renovarse en persona.
- id: 164
  category: license_system
  question: ¿Cuál es el período de gracia para renovar su licencia de conducir de
    Ohio después de que haya vencido?
  choices:
    A: No hay período de gracia
    B: 10 días
    C: 30 días
    D: 6 meses
  answer: A
  explanation: No hay período de gracia para renovar su licencia. Si continúa conduciendo
    después de que su licencia haya vencido, se arriesga a una citación de tráfico.
- id: 165
  category: license_system
  question: ¿Qué clase de Licencia de Conducir Comercial (CDL) se requiere para un
    solo vehículo diseñado para transportar a 16 o más pasajeros, incluido el conductor?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: C
  explanation: Se requiere una CDL Clase C para cualquier vehículo único o combinación
    de vehículos que no se consideren Clase A o B y que esté diseñado para transportar
    a 16 o más pasajeros, incluido el conductor.
- id: 166
  category: safe_driving_rules
  question: 'Los titulares de una licencia de ciclomotor (moped) a prueba de 14 a
    15 años están restringidos a conducir:'
  choices:
    A: Solo con un padre o tutor
    B: Solo durante las horas del día
    C: Solo en carreteras con un límite de velocidad inferior a 35 mph
    D: Solo hacia y desde la escuela
  answer: B
  explanation: Los titulares de una licencia de ciclomotor (moped) a prueba de 14
    a 15 años están limitados a conducir únicamente durante el día.
- id: 167
  category: vehicle_information
  question: 'Para ser clasificado como un ciclomotor (moped) o bicicleta motorizada,
    el motor auxiliar del vehículo NO debe producir más de:'
  choices:
    A: Un caballo de fuerza de frenado
    B: Dos caballos de fuerza de frenado
    C: Tres caballos de fuerza de frenado
    D: Cinco caballos de fuerza de frenado
  answer: A
  explanation: Un ciclomotor (moped) está equipado con un motor auxiliar que no produce
    más de un caballo de fuerza de frenado (brake horsepower).
- id: 168
  category: license_system
  question: ¿Qué vehículos puede operar el titular de un endoso de motocicleta de
    dos ruedas?
  choices:
    A: Solo motocicletas de dos ruedas
    B: Solo motocicletas de dos ruedas y motonetas (scooters) únicamente
    C: Motocicletas de dos o tres ruedas y motonetas (scooters)
    D: Cualquier motocicleta, pero no motonetas (scooters)
  answer: C
  explanation: El titular de un endoso o licencia de motocicleta de dos ruedas puede
    operar una motocicleta de dos o tres ruedas y una motoneta (scooter).
- id: 169
  category: vehicle_information
  question: 'Una motoneta (motor scooter) se caracteriza por tener un motor capaz
    de propulsar el vehículo a una velocidad superior a:'
  choices:
    A: 15 mph en una superficie nivelada
    B: 20 mph en una superficie nivelada
    C: 25 mph en una superficie nivelada
    D: 30 mph en una superficie nivelada
  answer: B
  explanation: Una motoneta (motor scooter) está equipada con un motor de entre 50
    cc y 100 cc que es capaz de propulsar el vehículo a una velocidad superior a 20
    mph en una superficie nivelada.
- id: 170
  category: driver_testing
  question: ¿Quién debe completar el programa Motorcycle Ohio antes de solicitar un
    endoso o licencia de operador de motocicleta?
  choices:
    A: Todos los solicitantes por primera vez, independientemente de su edad
    B: Personas menores de 18 años
    C: Personas menores de 21 años
    D: Cualquier persona que repruebe la prueba de habilidades en su primer intento
  answer: B
  explanation: El programa Motorcycle Ohio es obligatorio para las personas menores
    de 18 años antes de que puedan solicitar un endoso y/o licencia de operador de
    motocicleta.
- id: 171
  category: license_system
  question: ¿Después de establecer su residencia en Ohio, cuántos días tienen los
    nuevos residentes para obtener una licencia de conducir emitida por Ohio?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Dentro de los 30 días posteriores al establecimiento de la residencia,
    los conductores de Ohio deben tener una licencia de conducir emitida por Ohio.
- id: 172
  category: driver_responsibility
  question: Al solicitar o renovar el registro de un vehículo, ¿a qué fondo se les
    pide a los residentes de Ohio que contribuyan con $1 para asegurar que los niños
    tengan ojos sanos?
  choices:
    A: Second Chance Trust Fund
    B: Fondo Save Our Sight
    C: Programa de Visión de Ohio
    D: Donate Life Ohio
  answer: B
  explanation: Cuando los residentes de Ohio solicitan o renuevan el registro de su
    vehículo, se les pregunta si desean contribuir con $1 al fondo Save Our Sight
    (Salve Nuestra Vista), el cual asegura que los niños en Ohio tengan una buena
    visión y ojos sanos.
- id: 173
  category: license_system
  question: ¿Qué fondo de Ohio recibe donaciones voluntarias para apoyar la educación
    sobre la donación de órganos, ojos y tejidos?
  choices:
    A: Fondo de Seguridad Vial de Ohio
    B: Second Chance Trust Fund
    C: Fondo Save Our Sight
    D: Fondo Donate Life Ohio
  answer: B
  explanation: Según el manual, una donación voluntaria al Second Chance Trust Fund
    (Fondo Fiduciario de Segunda Oportunidad) de Ohio apoya la educación sobre la
    donación de órganos, ojos y tejidos.
- id: 174
  category: license_system
  question: Cuando completa un formulario de Registro de Votantes en una Agencia de
    Licencias del Registrador Adjunto (Deputy Registrar), ¿a dónde envía el registrador
    adjunto el formulario completado?
  choices:
    A: Al Departamento de Transporte de Ohio
    B: A la Comisión Federal de Elecciones
    C: A la Junta Electoral del Condado
    D: A los Servicios de Verificación del BMV
  answer: C
  explanation: El manual establece que el Registrador Adjunto enviará los formularios
    de votante completados a la Junta Electoral del Condado.
- id: 175
  category: license_system
  question: ¿Cuál es el propósito principal de la tarjeta de identificación con foto
    ID R KIDS de Ohio?
  choices:
    A: Otorgar privilegios de conducción restringidos a menores
    B: Ayudar a las autoridades en caso de que un niño se pierda o sea reportado como
      desaparecido
    C: Permitir que los niños se registren para votar anticipadamente
    D: Servir como un pasaporte válido para viajes internacionales
  answer: B
  explanation: Las tarjetas de identificación con foto de Ohio para niños (ID R KIDS)
    ayudan a las autoridades en caso de que un niño se pierda o sea reportado como
    desaparecido.
- id: 176
  category: license_system
  question: ¿Se puede usar una tarjeta de identificación de Ohio para un niño para
    privilegios de conducción?
  choices:
    A: Sí, si el niño tiene más de 14 años
    B: Sí, pero solo cuando esté acompañado por un padre
    C: No, se utiliza únicamente para fines de identificación
    D: No, a menos que aprueben un examen escrito
  answer: C
  explanation: El manual establece explícitamente que una tarjeta de identificación
    de Ohio se utiliza únicamente para fines de identificación y no puede usarse para
    nada más, incluyendo privilegios de conducción.
- id: 177
  category: license_system
  question: ¿Qué debe proporcionar al solicitar una tarjeta de identificación de Ohio
    para su hijo en una Agencia de Licencias del Registrador Adjunto (Deputy Registrar)?
  choices:
    A: Documentos de identidad de la Lista de Documentos Aceptables
    B: Un formulario de Pariente Cercano (Next of Kin) completado
    C: La identificación escolar y la boleta de calificaciones del niño
    D: Un formulario de registro de votantes
  answer: A
  explanation: Para solicitar una tarjeta de identificación de Ohio para un niño,
    debe visitar una Agencia de Licencias del Registrador Adjunto y proporcionar documentos
    de identidad de la Lista de Documentos Aceptables.
- id: 178
  category: driver_responsibility
  question: Bajo el programa de Información de Contacto de Emergencia de Parientes
    Cercanos (Next of Kin), ¿cuál es el número máximo de contactos de emergencia que
    un residente de Ohio puede identificar?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: A través del programa de Información de Contacto de Emergencia de Parientes
    Cercanos (Next of Kin), los residentes de Ohio pueden identificar hasta dos contactos
    de emergencia.
- id: 179
  category: driver_responsibility
  question: ¿Cuál es el propósito del programa de Información de Contacto de Emergencia
    de Parientes Cercanos (Next of Kin)?
  choices:
    A: Notificar a los familiares cuando la licencia de un conductor expira
    B: Permitir que las autoridades notifiquen a los contactos si una emergencia deja
      a una persona incapaz de comunicarse
    C: Proporcionar una dirección de respaldo para los envíos por correo del BMV
    D: Registrar a los miembros de la familia para votar
  answer: B
  explanation: El programa permite que las autoridades notifiquen a los contactos
    de emergencia cuando un accidente o emergencia deja a la persona incapaz de comunicarse
    con la policía o los socorristas médicos de emergencia.
- id: 180
  category: license_system
  question: ¿Cuál de los siguientes NO es un método válido para agregar información
    de contacto de emergencia a su registro de conductor?
  choices:
    A: En línea a través de los Servicios en Línea del BMV
    B: En persona en una Agencia de Licencias del Registrador Adjunto
    C: Por correo a los Servicios de Verificación del BMV
    D: Por teléfono llamando al 911
  answer: D
  explanation: 'El manual enumera tres formas de agregar información de contacto de
    emergencia: en línea, en persona o por correo. Llamar al 911 no es una opción.'
- id: 181
  category: license_system
  question: ¿Pueden los padres agregar información de contacto de emergencia del pariente
    más cercano (Next of Kin) al registro de la tarjeta de identificación de Ohio
    de su hijo?
  choices:
    A: Sí, para ser utilizada en caso de que el niño se pierda o sea reportado como
      desaparecido
    B: No, el programa es solo para conductores con licencia mayores de 18 años
    C: Sí, pero solo enviando un formulario por correo a la Junta Electoral del Condado
    D: No, los niños no pueden tener contactos de emergencia registrados
  answer: A
  explanation: Los padres de niños que tienen una tarjeta de identificación de Ohio
    pueden agregar información de contacto al registro de su hijo para ser utilizada
    en caso de que el niño se pierda o sea reportado como desaparecido.
- id: 182
  category: license_system
  question: ¿Dónde se muestra la designación de testamento vital (living will) en
    una licencia de conducir o tarjeta de identificación de Ohio?
  choices:
    A: En el frente, debajo de la foto
    B: En el reverso de la licencia de conducir o tarjeta de identificación
    C: Integrada únicamente en la banda magnética
    D: No se muestra en la tarjeta misma
  answer: B
  explanation: El manual establece que la indicación de testamento vital se mostrará
    en el reverso de la licencia de conducir o tarjeta de identificación.
- id: 183
  category: license_system
  question: ¿Quién es elegible para que se muestre la designación 'ARMED FORCES' (Fuerzas
    Armadas) en su licencia de conducir o tarjeta de identificación de Ohio?
  choices:
    A: Solo el personal militar retirado
    B: Solo el personal en servicio activo desplegado en el extranjero
    C: Cualquier veterano, personal en servicio activo o reservista de las Fuerzas
      Armadas de los Estados Unidos
    D: Cualquier familiar directo de un veterano
  answer: C
  explanation: Cualquier veterano, personal en servicio activo o reservista de las
    Fuerzas Armadas de los Estados Unidos puede solicitar que se muestre la designación
    'ARMED FORCES' en su licencia de conducir o tarjeta de identificación de Ohio.
- id: 184
  category: license_system
  question: ¿Cuál de los siguientes documentos es aceptable presentar al solicitar
    la designación 'ARMED FORCES' en una licencia de conducir de Ohio?
  choices:
    A: Un formulario DD214
    B: Un diploma de escuela secundaria
    C: Una tarjeta de registro de votante
    D: Un certificado de nacimiento
  answer: A
  explanation: Para obtener la designación 'ARMED FORCES', los solicitantes deben
    presentar su licencia de conducir o tarjeta de identificación de Ohio y uno de
    los documentos aceptables, que incluye el formulario DD214.
- id: 185
  category: license_system
  question: Además de un DD214, ¿cuál de los siguientes documentos puede usarse para
    demostrar la elegibilidad para la designación 'ARMED FORCES'?
  choices:
    A: Un pasaporte válido
    B: Una copia de las órdenes actuales
    C: Un permiso de portación de armas ocultas
    D: Una factura de servicios públicos
  answer: B
  explanation: Los documentos aceptables para la designación 'ARMED FORCES' incluyen
    el DD214, la tarjeta de identificación militar activa o retirada, la tarjeta de
    identificación de veterano o una copia de las órdenes actuales.
- id: 186
  category: license_system
  question: ¿A dónde puede acudir un solicitante para cambiar su estado de votante
    o registrarse para votar en persona al realizar trámites de licencia?
  choices:
    A: A cualquier Agencia de Licencias del Registrador Adjunto (Deputy Registrar
      License Agency)
    B: A cualquier estación de policía local
    C: A cualquier puesto de la Patrulla de Caminos del Estado de Ohio
    D: A cualquier biblioteca pública
  answer: A
  explanation: El estado de votante se puede cambiar en cualquier Agencia de Licencias
    del Registrador Adjunto completando un Formulario de Registro de Votante/Cambio
    de Dirección.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que se aproxima
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octogonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 187
- image: yield.png
  category: signs_and_signals
  question: ¿Qué requiere que haga esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 188
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entrar en esta calzada
    D: Calle sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en rampas de salida de autopistas o calles de un solo sentido donde entrar
    lo pondría en la trayectoria del tráfico que viene en sentido contrario.
  id: 189
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 190
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 191
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en este lugar.
  id: 192
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 193
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 194
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en blanco y negro en forma de banderín de ZONA DE NO REBASAR
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el inicio de una zona de no rebasar.
  id: 195
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 196
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 197
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Área de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta área. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 198
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la carretera.
  id: 199
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 200
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una glorieta (roundabout) más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 201
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 202
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 203
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 204
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una glorieta más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 205
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva pronunciada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 206
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 207
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: Termina la autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 208
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 209
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Una zona de incorporación más adelante
    D: Construcción de carreteras más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 210
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico circula en ambas direcciones'
    D: Cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una calle de sentido único o de una autopista dividida
    y se encuentre con vehículos que circulan en la dirección opuesta.
  id: 211
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 212
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte sobre una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 213
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que se prepare?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal a menudo se coloca
    donde el semáforo puede no ser visible desde la distancia.
  id: 214
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que espere más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 215
- image: cross_road.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde las calles laterales.
  id: 216
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una calle lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre una calle lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde la calle lateral.
  id: 217
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario fusionarse
    D: Se requiere giro a la derecha
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin necesidad de fusionarse. El tráfico que entra desde la rampa
    tiene su propio carril nuevo.
  id: 218
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 219
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para discapacitados válido pueden
    estacionar en estos espacios. Las infracciones conllevan multas elevadas.
  id: 220
