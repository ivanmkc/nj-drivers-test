metadata:
  source: Ohio Digest of Motor Vehicle Laws (publicsafety.ohio.gov)
  total_questions: 280
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: driver_testing
  question: What is the minimum age requirement to complete the vision screening and
    knowledge test in Ohio?
  choices:
    A: 15 years
    B: 15 years and six months
    C: 16 years
    D: 18 years
  answer: B
  explanation: According to the manual, at age 15 years and six months, you meet the
    minimum age requirement to complete the vision screening and knowledge test.
- id: 2
  category: driver_testing
  question: How many questions are on the Ohio driver's knowledge test?
  choices:
    A: 20 multiple-choice questions
    B: 30 multiple-choice questions
    C: 40 multiple-choice questions
    D: 50 multiple-choice questions
  answer: C
  explanation: The manual states that the knowledge test consists of 40 multiple-choice
    questions.
- id: 3
  category: driver_testing
  question: What is the minimum passage rate needed to pass the knowledge test?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: B
  explanation: The manual specifies that a 75% passage rate is needed to pass the
    40-question multiple-choice knowledge test.
- id: 4
  category: license_system
  question: After passing the knowledge test, how long do you have to purchase a Temporary
    Instruction Permit Identification Card (TIPIC)?
  choices:
    A: Within 14 days
    B: Within 30 days
    C: Within 60 days
    D: Within 90 days
  answer: C
  explanation: If you pass the knowledge test, you must go to a Deputy Registrar License
    Agency to purchase a TIPIC within 60 days of passing the test.
- id: 5
  category: driver_testing
  question: What is the policy if you fail the knowledge test?
  choices:
    A: You must wait one week before retesting.
    B: You must wait one day before retesting.
    C: You must pay a penalty fee immediately.
    D: You are limited to three total attempts.
  answer: B
  explanation: If you fail the knowledge test, you must wait one day before retesting.
    There is no limit on how many times you can take it, but you can only take it
    once in a day.
- id: 6
  category: driver_testing
  question: How many attempts are permitted when taking the knowledge test online
    through BMV Online Services?
  choices:
    A: One attempt per day
    B: Two attempts in a six-month period
    C: Unlimited attempts
    D: Three attempts per year
  answer: B
  explanation: When taking the knowledge test online through BMV Online Services,
    two attempts are permitted in a six-month period.
- id: 7
  category: license_system
  question: Which of the following groups is required to complete a driver education
    training course?
  choices:
    A: Only applicants under age 18
    B: All applicants regardless of age
    C: Applicants under age 21 and temporary residents age 21 and older
    D: Only temporary residents
  answer: C
  explanation: You must complete a driver education training course if you are under
    age 21 or if you are a temporary resident age 21 and older.
- id: 8
  category: driver_testing
  question: What should you do if you wear glasses or contacts when going for your
    vision screening?
  choices:
    A: Take the screening without them to test your natural vision.
    B: Bring them with you to the screening.
    C: Provide a doctor's note instead of taking the screening.
    D: Only bring them if you are over the age of 65.
  answer: B
  explanation: The manual instructs that if you wear glasses or contacts, you must
    bring them with you to the vision screening.
- id: 9
  category: driver_testing
  question: If you need to take the knowledge test in a language other than the 10
    provided by the BMV, what must you do?
  choices:
    A: You must take the test in English.
    B: You can use an online translation tool during the test.
    C: You may use your own interpreter by scheduling an appointment at a Driver Exam
      Station.
    D: You must request the BMV to translate the test for you.
  answer: C
  explanation: You may use your own interpreter for languages not offered by scheduling
    an appointment at a Driver Exam Station only.
- id: 10
  category: license_system
  question: What is the legal standing of the Ohio Driver Manual?
  choices:
    A: It supersedes the Ohio Revised Code.
    B: It is a complete substitute for the Ohio Administrative Code.
    C: It contains every applicable motor vehicle law in Ohio.
    D: It is a study guide and does not substitute or supersede the Ohio Revised Code.
  answer: D
  explanation: The manual states it is a study guide and is not a substitute for,
    and does not supersede, the Ohio Revised Code or the Ohio Administrative Code.
- id: 11
  category: driver_testing
  question: What is the limit for taking the knowledge test in-person at a BMV Driver
    Examination Station?
  choices:
    A: Two attempts per six months
    B: Unlimited attempts, but only one per day
    C: Three attempts total
    D: One attempt per week
  answer: B
  explanation: In-person testing at a BMV Driver Examination Station allows unlimited
    attempts, but only one per day.
- id: 12
  category: driver_testing
  question: What specific accommodation is available during the driving test exclusively
    for individuals who are deaf or hard of hearing?
  choices:
    A: A sign language interpreter in the vehicle
    B: Visual instructions during the driving test
    C: A written test instead of an on-road test
    D: Exemption from the maneuverability test
  answer: B
  explanation: Accommodations available upon request include visual instructions during
    the driving test, which is exclusive to individuals who are deaf or hard of hearing.
- id: 13
  category: license_system
  question: What does the acronym TIPIC stand for in the Ohio Driver Manual?
  choices:
    A: Temporary Instruction Permit Identification Card
    B: Tested Individual Permit Identification Card
    C: Temporary Interstate Permit Identification Card
    D: Traffic Instruction Permit Identification Card
  answer: A
  explanation: TIPIC stands for Temporary Instruction Permit Identification Card,
    which you purchase after passing the knowledge test.
- id: 14
  category: driver_testing
  question: How can an individual request disability accommodations for testing that
    are not already listed by the BMV?
  choices:
    A: Call the local police department.
    B: E-mail the Ohio Department of Public Safety’s ADA Coordinators.
    C: Ask the driving instructor on the day of the test.
    D: Mail a letter to the Governor's office.
  answer: B
  explanation: To request accommodations not listed, you must e-mail the Ohio Department
    of Public Safety’s ADA Coordinators at HRRequestADA@dps.ohio.gov.
- id: 15
  category: license_system
  question: Which of the following is a service offered through BMV Online Services?
  choices:
    A: Purchasing a new vehicle
    B: Taking the on-road driving test virtually
    C: Saving your place in line at a Deputy Registrar License Agency
    D: Appealing a traffic ticket
  answer: C
  explanation: The manual lists 'Save your place in line at a Deputy Registrar License
    Agency' as one of the available BMV Online Services.
- id: 16
  category: license_system
  question: What happens to your Ohio Identification (ID) card if you are issued a
    TIPIC?
  choices:
    A: It becomes your secondary form of identification.
    B: It is canceled.
    C: It is merged with the TIPIC.
    D: It remains valid for 60 days.
  answer: B
  explanation: If the applicant has an Ohio Identification (ID) card, it will be canceled
    when the TIPIC is issued, because an Ohio resident may hold only one Driver License
    or ID card at a time.
- id: 17
  category: safe_driving_rules
  question: For a 16- or 17-year-old TIPIC holder, who must be in the front passenger
    seat when driving between midnight and 6 a.m.?
  choices:
    A: Any licensed driver age 21 or older
    B: A licensed driving instructor
    C: A parent, guardian, or custodian who holds a valid Driver License
    D: No one is required if driving to or from work
  answer: C
  explanation: From midnight to 6 a.m., a 16- or 17-year-old driver must be accompanied
    by a parent, guardian, or custodian who holds a valid Driver License.
- id: 18
  category: safe_driving_rules
  question: Which of the following is a restriction that applies to TIPIC holders
    of all ages?
  choices:
    A: Use of any mobile electronic device is prohibited while driving.
    B: Driving is not permitted after 10 p.m.
    C: Only one passenger is allowed in the vehicle.
    D: The driver must log 100 hours of practice driving.
  answer: A
  explanation: For TIPIC holders of all ages, the use of any mobile electronic device
    is prohibited while driving.
- id: 19
  category: driver_testing
  question: How many total hours of driving time with an eligible licensed driver
    must a driver under age 21 log to obtain a Driver License?
  choices:
    A: 24 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: To obtain a Driver License, a driver under age 21 must complete and
    log 50 hours of driving with an eligible licensed driver, with at least 10 hours
    of night driving.
- id: 20
  category: driver_testing
  question: How long must a driver under age 18 hold a TIPIC before they can obtain
    a Driver License?
  choices:
    A: 14 days
    B: 30 days
    C: 3 months
    D: 6 months
  answer: D
  explanation: Drivers under age 18 must hold the TIPIC for at least six months before
    obtaining a Driver License.
- id: 21
  category: vehicle_information
  question: What is the minimum legal tire tread depth for a vehicle in Ohio?
  choices:
    A: 1/8-inch
    B: 1/16-inch
    C: 1/32-inch
    D: 1/4-inch
  answer: B
  explanation: A tire in safe condition has a minimum of 1/16-inch tread depth on
    the road surface and is free of major bumps or bulges.
- id: 22
  category: vehicle_information
  question: How far away must a vehicle's taillight be visible?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: Ohio law requires a vehicle to have one taillight that emits red light,
    visible from 500 feet.
- id: 23
  category: vehicle_information
  question: What is the acceptable percentage of light transmission for the windshield
    of a vehicle in Ohio?
  choices:
    A: 30%
    B: 50%
    C: 70%
    D: 100%
  answer: C
  explanation: The acceptable window light transmission for a windshield is 70% light
    transmission, which is standard for most new cars.
- id: 24
  category: vehicle_information
  question: When is the best time to check your vehicle's tire pressure?
  choices:
    A: Immediately after driving on the highway
    B: When the tires are the same temperature as the surrounding air
    C: During the hottest part of the day
    D: When the tires are warmer than the surrounding air
  answer: B
  explanation: You should check tire pressure when the tires are the same temperature
    as the surrounding air.
- id: 25
  category: safe_driving_rules
  question: During what dates are studded tires legal to use in Ohio?
  choices:
    A: October 1 through March 31
    B: November 1 through April 15
    C: December 1 through February 28
    D: November 15 through April 1
  answer: B
  explanation: In Ohio, studded tires are legal from November 1 through April 15.
- id: 26
  category: safe_driving_rules
  question: In addition to sunset to sunrise and during poor visibility, when else
    does Ohio law require headlights to be turned on?
  choices:
    A: When driving in a school zone
    B: Any time the windshield wipers are in use because of precipitation
    C: When driving on an interstate highway
    D: When approaching a construction zone
  answer: B
  explanation: Ohio law requires headlights to be on sunset to sunrise, at any time
    visibility is poor, and any time the windshield wipers are in use because of precipitation.
- id: 27
  category: safe_driving_rules
  question: How far in advance must you activate your turn signal before changing
    direction?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 300 feet
  answer: B
  explanation: You must activate a turn signal at least 100 feet prior to changing
    direction.
- id: 28
  category: defensive_driving
  question: To allow appropriate space for airbag deployment, what is the minimum
    distance that should be between your chest and the steering wheel?
  choices:
    A: 5 inches
    B: 8 inches
    C: 10 inches
    D: 12 inches
  answer: C
  explanation: There should be at least 10 inches between your chest and the steering
    wheel to allow appropriate space for airbag deployment.
- id: 29
  category: vehicle_information
  question: How should you position yourself when adjusting the right-side mirror
    to reduce blind spots?
  choices:
    A: Rest your head against the closed driver-side window
    B: Lean to the right so your head is directly above the center console
    C: Look over your right shoulder while sitting upright
    D: Lean forward until your chest touches the steering wheel
  answer: B
  explanation: To adjust the right-side mirror, you should lean to the right so your
    head is directly above the center console, then adjust the mirror so the rear
    edge of the vehicle can barely be seen.
- id: 30
  category: safe_driving_rules
  question: What is the safety belt rule for drivers under age 18 in Ohio?
  choices:
    A: Only the driver and front-seat passengers are required to wear safety belts.
    B: Safety belts are optional if the vehicle is equipped with side airbags.
    C: The number of occupants is limited to the number of installed safety belts,
      and all occupants must wear them.
    D: Passengers in the back seat do not need to wear safety belts if they are over
      age 18.
  answer: C
  explanation: For drivers under age 18, the number of vehicle occupants is limited
    to the number of safety belts originally installed and all occupants must wear
    safety belts.
- id: 31
  category: vehicle_information
  question: How should a lap belt be properly adjusted?
  choices:
    A: High across the stomach
    B: Loosely across the thighs
    C: Snug and low across the hips
    D: Under the arm and across the chest
  answer: C
  explanation: You should adjust the lap belt so that it is snug and lies low across
    your hips after fastening to prevent sliding out of the belt in a crash.
- id: 32
  category: alcohol_drugs_health
  question: If your Driver License indicates a vision restriction, what must you avoid
    doing at night?
  choices:
    A: Using dark or tinted corrective lenses
    B: Driving on unlit rural roads
    C: Using your high beam headlights
    D: Wearing any type of corrective lenses
  answer: A
  explanation: The manual advises drivers to avoid using dark or tinted corrective
    lenses at night.
- id: 33
  category: defensive_driving
  question: How can fatigue affect your driving ability?
  choices:
    A: It increases your reaction time and sharpens your vision.
    B: It affects your vision and decreases your reaction time.
    C: It improves your ability to perform repetitive tasks.
    D: It has no effect as long as you drink caffeine.
  answer: B
  explanation: Fatigue is physical or mental tiredness that can affect your vision
    and decrease your reaction time.
- id: 34
  category: defensive_driving
  question: Which of the following is considered an example of aggressive driving?
  choices:
    A: Driving exactly at the posted speed limit
    B: Using hands-free technology to make a phone call
    C: Following too closely and making unsafe lane changes
    D: Yielding the right-of-way to pedestrians
  answer: C
  explanation: Aggressive driving examples include speeding, following too closely,
    unsafe lane changes, improper signaling, and failing to obey traffic signals.
- id: 35
  category: safe_driving_rules
  question: Under Ohio law, how may drivers who are 18 years and older legally use
    a cell phone while driving?
  choices:
    A: They may hold the phone to text if stopped at a stop sign.
    B: They may manually enter numbers to dial a call while driving.
    C: They may use hands-free technology as long as they do not hold or support the
      device.
    D: They are strictly prohibited from using a cell phone in any manner.
  answer: C
  explanation: Drivers over 18 are allowed to make and receive phone calls using hands-free
    technology, provided they do not hold or support the device or manually enter
    letters, numbers, or symbols.
- id: 36
  category: penalties_and_points
  question: What is the penalty for a first distracted driving offense in two years
    for a driver over age 18?
  choices:
    A: 2 points assessed to the Driver License and up to a $150 fine
    B: 3 points assessed to the Driver License and up to a $250 fine
    C: 4 points assessed to the Driver License and a 90-day suspension
    D: A 60-day Driver License suspension and a $150 fine
  answer: A
  explanation: For drivers 18 and older, a 1st offense in two years results in 2 points
    assessed to the Driver License and up to a $150 fine.
- id: 37
  category: penalties_and_points
  question: What happens to the fine if a distracted driving violation occurs in a
    work zone?
  choices:
    A: The fine is waived if a safety course is completed.
    B: The fine remains the same but points are doubled.
    C: The fine is doubled.
    D: The fine is replaced by a mandatory license suspension.
  answer: C
  explanation: According to the manual, fines for distracted driving are doubled if
    the violation occurs in a work zone.
- id: 38
  category: safe_driving_rules
  question: Can a driver under age 18 use an electronic device while sitting at a
    red traffic light?
  choices:
    A: Yes, as long as the device is hands-free.
    B: Yes, but only to send text messages.
    C: No, it is illegal to use any electronic device even while sitting at a traffic
      light.
    D: No, unless they are changing the music playlist.
  answer: C
  explanation: For drivers under age 18, it is illegal to use any electronic device
    while driving, even hands-free, or while sitting at a traffic light or in a traffic
    jam.
- id: 39
  category: alcohol_drugs_health
  question: How do alcohol and drugs affect a driver's judgment?
  choices:
    A: They improve the ability to make quick decisions.
    B: They reduce the ability to perceive surroundings and make quick decisions.
    C: They sharpen vision and depth perception.
    D: They decrease reaction time making the driver respond faster.
  answer: B
  explanation: Alcohol and drugs affect judgment by reducing your ability to perceive
    surroundings and make quick decisions.
- id: 40
  category: safe_driving_rules
  question: Regardless of the posted speed limit, what does Ohio law prohibit regarding
    your vehicle's speed?
  choices:
    A: Driving at a speed greater than what allows you to stop in the distance available.
    B: Driving more than 5 mph below the posted speed limit in dry weather.
    C: Driving at the exact posted speed limit during nighttime hours.
    D: Driving slower than the flow of traffic on a rural freeway.
  answer: A
  explanation: Ohio law prohibits a person from driving at a speed greater than what
    allows the driver to stop in the distance available, regardless of the posted
    speed limit.
- id: 41
  category: vehicle_information
  question: How should head restraints be adjusted to avoid whiplash?
  choices:
    A: So they contact the back of your neck.
    B: So they are at least 3 inches below the level of your ears.
    C: So they contact the back of your head and not below the level of your ears.
    D: So they rest lightly against the top of your shoulders.
  answer: C
  explanation: Head restraints should be adjusted so they contact the back of your
    head and not below the level of your ears to avoid whiplash.
- id: 42
  category: safe_driving_rules
  question: Who has the right-of-way at a four-way intersection if two drivers arrive
    at the same time?
  choices:
    A: The driver on the left
    B: The driver on the right
    C: The driver who is traveling faster
    D: The driver who is turning left
  answer: B
  explanation: According to the manual, you must yield the right-of-way to the driver
    on your right at a four-way intersection if both of you arrive at the intersection
    at the same time.
- id: 43
  category: signs_and_signals
  question: What should a driver do when approaching a flashing yellow traffic light?
  choices:
    A: Come to a complete stop before entering the intersection
    B: Speed up to clear the intersection quickly
    C: Slow down and proceed with caution
    D: Treat the intersection as a four-way stop
  answer: C
  explanation: A flashing yellow traffic light means you should slow down and proceed
    with caution, and be prepared to stop for any traffic flow that may be entering
    the intersection.
- id: 44
  category: signs_and_signals
  question: How should a driver treat an inoperable traffic light?
  choices:
    A: The same as a yield sign
    B: The same as a stop sign
    C: The same as a flashing yellow light
    D: Proceed without stopping if no cross traffic is visible
  answer: B
  explanation: The manual states that inoperable traffic lights are treated the same
    as a stop sign. You must yield the right-of-way and use caution while entering
    the intersection.
- id: 45
  category: signs_and_signals
  question: What does a red circle with a slash on a traffic sign indicate?
  choices:
    A: The illustrated action is prohibited
    B: A railroad crossing is ahead
    C: You must yield the right-of-way
    D: A construction zone is ahead
  answer: A
  explanation: Prohibitory signs instruct the viewer that an action is prohibited.
    The red circle with a slash represents the word 'NO,' meaning the illustrated
    action is prohibited.
- id: 46
  category: signs_and_signals
  question: What shape and color are most warning signs?
  choices:
    A: Square and green
    B: Rectangular and white
    C: Diamond shaped and yellow
    D: Round and orange
  answer: C
  explanation: Warning signs are usually yellow with black lettering or symbols and
    are diamond shaped.
- id: 47
  category: penalties_and_points
  question: What are the potential consequences for speeding in a Work Zone?
  choices:
    A: A written warning for the first offense
    B: Mandatory permanent license revocation
    C: Doubled fines and jail time
    D: Points added to your license but no fine
  answer: C
  explanation: Consequences for traveling faster than the posted speed limit in a
    Work Zone can include doubled fines and jail time.
- id: 48
  category: safe_driving_rules
  question: What does a solid yellow double line on the roadway indicate?
  choices:
    A: You may pass if the opposite lane is clear
    B: You may not drive to the left of the center line unless turning left or passing
      a slow-moving vehicle
    C: Traffic on both sides is traveling in the same direction
    D: The lane is ending and you must merge right
  answer: B
  explanation: A yellow solid double line means do not drive to the left of the center
    line, unless you must cross the lines to turn left or pass a slow-moving vehicle.
- id: 49
  category: safe_driving_rules
  question: Which type of pavement marking separates traffic traveling in the same
    direction?
  choices:
    A: White lines
    B: Solid yellow lines
    C: Broken yellow lines
    D: Double yellow lines
  answer: A
  explanation: White lines separate traffic traveling in the same direction. They
    may be solid or broken (dashed) lines.
- id: 50
  category: safe_driving_rules
  question: Which of the following is true regarding a two-way left turn only lane?
  choices:
    A: It can be used for passing slow vehicles
    B: It is marked with solid white lines on both sides
    C: It is used as a regular travel lane during rush hour
    D: It is not a lane used for traveling or passing
  answer: D
  explanation: The marked center lane is for left turns only. The manual explicitly
    states, 'This is not a lane used for traveling or passing.'
- id: 51
  category: defensive_driving
  question: What is the recommended following distance behind the vehicle ahead of
    you?
  choices:
    A: 1-2 seconds
    B: 3-4 seconds
    C: 5-6 seconds
    D: 1 car length for every 10 mph
  answer: B
  explanation: The manual advises drivers to allow a 3-4 second following distance
    of the vehicle ahead of you.
- id: 52
  category: vehicle_information
  question: Which of the following is NOT listed as a factor that determines the distance
    it takes to bring a vehicle to a complete stop?
  choices:
    A: Driver's reaction time
    B: The condition of the vehicle's brakes
    C: The weight of the vehicle
    D: The condition of the pavement
  answer: C
  explanation: The manual lists driver's reaction time, speed, condition of brakes,
    and condition of pavement as factors. Vehicle weight is not mentioned in this
    section.
- id: 53
  category: safe_driving_rules
  question: Where must a driver stop when emerging from an alley, driveway, or private
    road in a business or residential district?
  choices:
    A: At the edge of the roadway
    B: At the nearest stop sign
    C: At a sidewalk, or a point prior to entering the roadway if there is no sidewalk
    D: In the middle of the intersection to check for traffic
  answer: C
  explanation: A driver must stop at a sidewalk, or if there is no sidewalk, at a
    point prior to entering the roadway, when emerging from an alley, driveway, or
    private road in a business or residential district.
- id: 54
  category: sharing_the_road
  question: When must you yield the right-of-way to a public safety vehicle displaying
    flashing lights and sounding a warning signal?
  choices:
    A: Only when the vehicle is directly behind you
    B: Always, unless the vehicle is traveling in the opposite direction on a divided
      highway
    C: Only if you are currently inside an intersection
    D: Only when it is a police car, but not a fire engine
  answer: B
  explanation: You must stop at the approach of a public safety vehicle displaying
    flashing lights and sounding a warning signal, unless the vehicle is traveling
    in the opposite direction on a divided highway.
- id: 55
  category: signs_and_signals
  question: Which type of signs provide points of interest, services along the highway,
    and help direct drivers to cities and towns?
  choices:
    A: Warning signs
    B: Regulatory signs
    C: Guide signs
    D: Prohibitory signs
  answer: C
  explanation: Guide signs provide points of interest and services along the highway,
    information on intersecting roads, and help direct drivers to cities and towns.
- id: 56
  category: safe_driving_rules
  question: What must a driver do before entering an intersection if there is not
    sufficient space on the other side to accommodate their vehicle?
  choices:
    A: Proceed slowly and wait in the middle of the intersection
    B: Honk the horn to clear traffic ahead
    C: Stop before entering the intersection
    D: Turn right instead of going straight
  answer: C
  explanation: A driver must stop before entering an intersection if there is not
    sufficient space on the other side to accommodate the vehicle. This applies whether
    or not a traffic signal gives the right to proceed.
- id: 57
  category: safe_driving_rules
  question: To maintain control of the vehicle and avoid air bag injury, where should
    you place your hands on the steering wheel?
  choices:
    A: At the 10 and 2 o'clock positions
    B: At the 9 and 3 o'clock positions
    C: At the 4 and 8 o'clock positions
    D: At the 12 and 6 o'clock positions
  answer: C
  explanation: The manual states to place both hands on the outside of the steering
    wheel on opposite sides, at the 4 and 8 o’clock positions, to maintain control
    and avoid air bags if they deploy.
- id: 58
  category: safe_driving_rules
  question: When backing up your vehicle, where should you place your left hand on
    the steering wheel?
  choices:
    A: At the 12 o'clock position
    B: At the 6 o'clock position
    C: At the 9 o'clock position
    D: At the 4 o'clock position
  answer: A
  explanation: To back up safely, the manual instructs to grasp the steering wheel
    at the 12 o’clock position with your left hand and place your right arm on the
    back of the passenger seat.
- id: 59
  category: safe_driving_rules
  question: How far in advance must you give a turn signal before making an intended
    turn?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 150 feet
    D: At least 200 feet
  answer: B
  explanation: According to the manual, a turn signal must be given at least 100 feet
    before the intended turn.
- id: 60
  category: safe_driving_rules
  question: What is the correct procedure for making a left turn on a green traffic
    signal when high traffic volume does not allow an immediate opportunity?
  choices:
    A: Wait behind the stop bar until the light turns yellow
    B: Turn immediately and force oncoming traffic to yield
    C: Position the front of the vehicle slightly past the stop bar and yield to oncoming
      traffic
    D: Turn right instead and make a U-turn later
  answer: C
  explanation: If high traffic volume does not allow an opportunity to turn left on
    a green light, position the front of the vehicle slightly past the stop bar, yield
    to pedestrians and oncoming traffic, and turn when safe.
- id: 61
  category: safe_driving_rules
  question: Under what circumstances are you permitted to make a left turn on a red
    traffic signal?
  choices:
    A: From any lane onto a two-way street
    B: Only from the extreme left lane of a one-way street onto another one-way street
    C: From a two-way street onto a one-way street
    D: Left turns on a red signal are never permitted
  answer: B
  explanation: You may turn left at a red traffic signal only from the extreme left
    lane of a one-way street onto another one-way street, unless a sign forbids it.
- id: 62
  category: defensive_driving
  question: If you have a green light but traffic fills the roadway across the intersection,
    what should you do?
  choices:
    A: Enter the intersection and wait for traffic to clear
    B: Honk your horn to encourage traffic to move
    C: Stop prior to the intersection and wait until traffic moves forward
    D: Edge into the intersection to block cross traffic
  answer: C
  explanation: When traffic fills the roadway across the intersection, stop prior
    to the intersection and wait until traffic moves forward. Do not move into the
    intersection and stop.
- id: 63
  category: safe_driving_rules
  question: In which direction must vehicles travel when entering a roundabout or
    traffic circle?
  choices:
    A: Clockwise
    B: Counterclockwise
    C: In a straight line
    D: Whichever direction is shortest to the exit
  answer: B
  explanation: Vehicles travel counterclockwise around a raised center island in a
    roundabout or traffic circle.
- id: 64
  category: safe_driving_rules
  question: When navigating a roundabout, which exit should you use if you intend
    to make a left turn?
  choices:
    A: The 1st exit
    B: The 2nd exit
    C: The 3rd exit
    D: The 4th exit
  answer: C
  explanation: When using a roundabout, you should use the 3rd exit to turn left.
- id: 65
  category: safe_driving_rules
  question: When driving on a road with four or more lanes, which lane should you
    generally drive in?
  choices:
    A: The left lane
    B: The right lane
    C: The lane just right of center
    D: The center dividing lane
  answer: B
  explanation: When driving on a road with four or more lanes, drive in the right
    lane. Use the lane just right of center to pass and make left turns.
- id: 66
  category: defensive_driving
  question: How should you check your blind spots before changing lanes?
  choices:
    A: By looking exclusively at your rear-view mirror
    B: By turning your head and looking over your shoulder in the direction you plan
      to move
    C: By checking your side-view mirrors twice
    D: By activating your turn signal and waiting for a honk
  answer: B
  explanation: Check your blind spots by turning your head and looking over your shoulder
    in the direction you plan to move, as these areas cannot be seen using mirrors.
- id: 67
  category: safe_driving_rules
  question: What is the proper use of an acceleration lane when entering a freeway?
  choices:
    A: To come to a complete stop before merging
    B: To pass slower vehicles already on the freeway
    C: To reach the speed of other vehicles to merge with the traffic flow
    D: To park in case of an emergency
  answer: C
  explanation: Upon entering a freeway, use the acceleration lane to reach the speed
    of other vehicles to merge with the traffic flow.
- id: 68
  category: safe_driving_rules
  question: What must you do if you miss your intended exit on a roadway?
  choices:
    A: Stop and back up on the shoulder
    B: Use the opening through the median to turn around
    C: Take the next exit
    D: Make a U-turn across the main travel lanes
  answer: C
  explanation: If you miss your exit, take the next one. Do not use the opening through
    the median, which is for use only by emergency and public safety vehicles.
- id: 69
  category: safe_driving_rules
  question: When passing another vehicle, how do you know it is safe to return to
    your lane?
  choices:
    A: When you are one car length ahead of the passed vehicle
    B: When you can see the passed vehicle's front bumper in your side mirror
    C: When both headlights of the passed vehicle are visible in your rear-view mirror
    D: When the driver of the passed vehicle flashes their high beams
  answer: C
  explanation: When passing, continue to pass until both headlights of the passed
    vehicle are visible in the rear-view mirror before signaling and returning to
    the lane.
- id: 70
  category: sharing_the_road
  question: What should you do when another vehicle is passing you?
  choices:
    A: Speed up to prevent them from passing
    B: Move into the left lane to block them
    C: Stay in your lane and maintain a constant speed
    D: Slow down drastically and pull onto the shoulder
  answer: C
  explanation: When being passed, you should stay in your lane and maintain a constant
    speed to allow the driver to pass you.
- id: 71
  category: safe_driving_rules
  question: In which of the following situations is passing another vehicle prohibited?
  choices:
    A: On a multi-lane roadway
    B: Before a highway-railroad crossing or bridge
    C: When the vehicle ahead is traveling below the speed limit
    D: On a road divided into three or more marked lanes
  answer: B
  explanation: You should not attempt to pass when an oncoming vehicle is approaching,
    your view is blocked, at intersections, or before a highway-railroad crossing
    or bridge.
- id: 72
  category: safe_driving_rules
  question: When is crossing a solid double yellow line permitted?
  choices:
    A: To pass a vehicle traveling 10 mph below the speed limit.
    B: To merge into traffic from the shoulder.
    C: To turn left into a driveway or pass a slow-moving vehicle.
    D: When you are traveling on a multi-lane roadway.
  answer: C
  explanation: Crossing the centerline with a solid double yellow line is permitted
    only to turn left into driveways or pass a slow-moving vehicle (e.g., bicycle
    or vehicle displaying a slow-moving vehicle sign) when safe to do so.
- id: 73
  category: safe_driving_rules
  question: What is the proper use of a center two-way left turn lane?
  choices:
    A: Passing slower vehicles.
    B: Merging into traffic.
    C: Traveling during rush hour.
    D: Left-turning vehicles in either direction.
  answer: D
  explanation: A two-way left turn lane is reserved only for left-turning vehicles
    in either direction and is not used for passing, merging into traffic, or traveling.
- id: 74
  category: safe_driving_rules
  question: When a train is approaching a highway-railroad crossing, where must you
    stop your vehicle?
  choices:
    A: No closer than 10 feet and no farther than 30 feet from the crossing.
    B: No closer than 15 feet and no farther than 50 feet from the crossing.
    C: Exactly 20 feet from the crossing.
    D: At least 50 feet away from the crossing.
  answer: B
  explanation: The manual requires drivers to stop no closer than 15 feet and no farther
    than 50 feet from the crossing when a train is approaching.
- id: 75
  category: sharing_the_road
  question: Which of the following vehicles is required by law to stop at all railroad
    crossings?
  choices:
    A: A passenger vehicle towing a boat.
    B: A motorcycle.
    C: A vehicle carrying explosives or flammable liquids.
    D: A delivery van.
  answer: C
  explanation: Operators of motor vehicles carrying passengers for hire, school buses,
    or vehicles carrying explosives or flammable liquids are required to stop at railroad
    crossings.
- id: 76
  category: sharing_the_road
  question: What must you do if you approach a school bus with flashing red lights
    stopped on a road with fewer than four lanes?
  choices:
    A: Stop only if you are traveling in the same direction as the bus.
    B: Slow down to 15 mph and proceed with caution.
    C: Stop at least 10 feet from the front or rear of the bus and remain stopped.
    D: Stop at least 20 feet from the bus until the amber lights flash.
  answer: C
  explanation: If the bus is stopped on a street or road with fewer than four lanes,
    all traffic approaching the bus from either direction must stop at least 10 feet
    from the front or rear of the bus.
- id: 77
  category: sharing_the_road
  question: When a school bus is stopped with its red lights flashing on a street
    with four or more lanes, who is required to stop?
  choices:
    A: All traffic in both directions.
    B: Only traffic proceeding in the same direction as the bus.
    C: Only traffic in the lane directly next to the bus.
    D: No vehicles are required to stop on a four-lane road.
  answer: B
  explanation: If the bus is stopped on a street or road with four or more lanes,
    only traffic proceeding in the same direction as the bus must stop at the rear
    of the bus.
- id: 78
  category: safe_driving_rules
  question: When parallel parking on a street, how close must your vehicle be to the
    curb?
  choices:
    A: Not more than 6 inches.
    B: Not more than 12 inches.
    C: Not more than 18 inches.
    D: Not more than 24 inches.
  answer: B
  explanation: Vehicles must be parked facing the direction of traffic on that side
    of the street, parallel to and not more than 12 inches from the right curb (or
    left curb on one-way streets).
- id: 79
  category: safe_driving_rules
  question: It is illegal to stop, park, or stand a vehicle within how many feet of
    a fire hydrant?
  choices:
    A: 10 feet.
    B: 15 feet.
    C: 20 feet.
    D: 30 feet.
  answer: A
  explanation: No person shall stop, park, or stand a vehicle within 10 feet of a
    fire hydrant.
- id: 80
  category: safe_driving_rules
  question: You are prohibited from parking within how many feet of an intersection
    or crosswalk?
  choices:
    A: 10 feet.
    B: 15 feet.
    C: 20 feet.
    D: 25 feet.
  answer: C
  explanation: The manual states that stopping, parking, or standing is prohibited
    in or within 20 feet of an intersection or crosswalk.
- id: 81
  category: safe_driving_rules
  question: What should you do with your front wheels when parking your vehicle on
    a hill or graded surface?
  choices:
    A: Turn them away from the curb.
    B: Keep them perfectly straight.
    C: Turn them toward the curb-side of the road.
    D: Turn them to the left regardless of the grade.
  answer: C
  explanation: In the event you must park your vehicle on a hill or graded surface,
    turn the front wheels toward the curb-side of the road to stabilize the vehicle.
- id: 82
  category: driver_responsibility
  question: In which of the following situations are you required to show proof of
    financial responsibility (insurance)?
  choices:
    A: When renewing your vehicle registration online.
    B: When involved in a traffic crash resulting in more than $400 in property damage.
    C: When purchasing a new vehicle at a dealership.
    D: When stopped at a toll booth.
  answer: B
  explanation: Proof of financial responsibility must be shown when either the driver
    or vehicle owner is involved in a traffic crash that results in more than $400
    in property damage.
- id: 83
  category: driver_responsibility
  question: What is the minimum liability insurance requirement for property damage
    in an accident in Ohio?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum liability insurance requirements include $25,000 for property
    damage in an accident.
- id: 84
  category: alcohol_drugs_health
  question: It is against the law to operate a motor vehicle in Ohio with a blood-alcohol
    concentration (BAC) of what level if you are under the age of 21?
  choices:
    A: .00% or higher
    B: .02% or higher
    C: .04% or higher
    D: .08% or higher
  answer: B
  explanation: In Ohio, it is against the law to operate a motor vehicle with a BAC
    of .02% or higher when under the age of 21.
- id: 85
  category: penalties_and_points
  question: What happens under the Administrative License Suspension (ALS) law if
    an individual consents to a chemical test and the results show a BAC of .08 or
    higher?
  choices:
    A: The driver is issued a warning and allowed to drive home.
    B: The arresting officer confiscates the Driver License and a suspension of up
      to five years begins immediately.
    C: The driver's vehicle is permanently impounded.
    D: The driver must pay a $400 fine on the spot.
  answer: B
  explanation: If the test results show a BAC of .08 or higher, the arresting officer
    confiscates the Driver License and a suspension up to five years begins immediately.
- id: 86
  category: alcohol_drugs_health
  question: What is the penalty for a first-time refusal to submit to a chemical test
    under the Administrative License Suspension (ALS) law?
  choices:
    A: 90 days license suspension
    B: One year license suspension
    C: Two years license suspension
    D: Three years license suspension
  answer: B
  explanation: According to the manual, a first refusal to test results in a one-year
    license suspension.
- id: 87
  category: penalties_and_points
  question: What happens if an Ohio driver accumulates 12 or more penalty points within
    a two-year period?
  choices:
    A: They receive a warning letter only.
    B: Their vehicle is permanently confiscated.
    C: The BMV imposes a 12-point suspension of their Driver License.
    D: They must serve a mandatory 30-day jail sentence.
  answer: C
  explanation: If a driver accumulates 12 or more points within a two-year period,
    the BMV will impose a 12-point suspension of the Driver License.
- id: 88
  category: safe_driving_rules
  question: Under Ohio law, when are you required to have your headlights turned on
    during the day?
  choices:
    A: Only when driving on the interstate.
    B: Any time your windshield wipers are in use because of precipitation.
    C: Only when driving through a school zone.
    D: Any time you are driving a commercial vehicle.
  answer: B
  explanation: The manual states that lights must be on any time windshield wipers
    are in use because of precipitation, regardless of the time of day.
- id: 89
  category: penalties_and_points
  question: Which of the following traffic violations results in a 6-point assessment
    on your driver's license?
  choices:
    A: A standard moving violation.
    B: Willful or wanton disregard for the safety of persons or property.
    C: Failure to stop and disclose identity after a crash.
    D: A minor speed offense.
  answer: C
  explanation: Failure to stop and disclose identity after a crash is assessed 6 points,
    while willful disregard is 4 points and moving/speed offenses are generally 2
    points.
- id: 90
  category: safe_driving_rules
  question: What is the child restraint requirement for an infant or child who is
    under age 4 and weighs less than 40 pounds?
  choices:
    A: They must be secured with a standard safety belt in the front seat.
    B: They must be properly restrained in a child safety seat.
    C: They must be properly restrained in a booster seat.
    D: They are exempt from restraint laws if riding in the back seat.
  answer: B
  explanation: Infants and children who are either or both under age 4 and weighing
    less than 40 pounds must be properly restrained in a child safety seat.
- id: 91
  category: penalties_and_points
  question: For a driver under age 18, what is the penalty for a conviction of two
    moving violations?
  choices:
    A: A warning letter from the BMV.
    B: An automatic three-month license suspension.
    C: An automatic six-month license suspension.
    D: An automatic one-year license suspension.
  answer: B
  explanation: The BMV will automatically impose a three-month license suspension
    for drivers under age 18 who are convicted of, or plead guilty to, two moving
    violations.
- id: 92
  category: driver_responsibility
  question: If you are pulled over by law enforcement, what should you do with your
    hands?
  choices:
    A: Keep them hidden under your seat.
    B: Reach into the glove compartment for your registration immediately.
    C: Keep them on the steering wheel in view of the officer.
    D: Wave them outside the window to signal compliance.
  answer: C
  explanation: When pulled over by law enforcement, you should keep your hands on
    the steering wheel in view of the officer.
- id: 93
  category: alcohol_drugs_health
  question: What does an Operating a Vehicle after Underage Alcohol Consumption (OVUAC)
    conviction require a driver to do?
  choices:
    A: Pay a $5,000 fine and surrender their vehicle.
    B: Take a remedial driving course and retake the Driver License examination.
    C: Permanently forfeit their driver's license.
    D: Install an ignition interlock device for ten years.
  answer: B
  explanation: An OVUAC can result in a license suspension and require the driver
    to take a remedial driving course, pay reinstatement fees, and retake the Driver
    License examination.
- id: 94
  category: vehicle_information
  question: What is an SR-22 bond?
  choices:
    A: A special type of premium auto insurance.
    B: A certificate of financial responsibility filed with the state.
    C: A bail bond used to avoid jail time for traffic offenses.
    D: A vehicle registration document for commercial drivers.
  answer: B
  explanation: An SR-22 is a certificate of financial responsibility filed with the
    state, serving as proof that your auto insurance policy meets minimum liability
    coverage.
- id: 95
  category: safe_driving_rules
  question: Under what condition is it legal for a person under age 16 to ride in
    the unenclosed cargo area of a truck traveling faster than 25 mph?
  choices:
    A: If they are sitting down and holding onto the sides.
    B: If they are accompanied by an adult.
    C: If the cargo area is equipped with a properly secured seat and safety belt.
    D: It is never legal under any circumstances.
  answer: C
  explanation: A driver may permit a person under 16 to ride in an unenclosed cargo
    area traveling faster than 25 mph if the area is equipped with a properly secured
    seat and safety belt that complies with federal standards.
- id: 96
  category: penalties_and_points
  question: What is the maximum fine for a conviction of driving under suspension,
    which is a first-degree misdemeanor?
  choices:
    A: $250
    B: $500
    C: $1,000
    D: $5,000
  answer: C
  explanation: Operating a motor vehicle while your license is under suspension is
    a first-degree misdemeanor, subject to a fine of up to $1,000.
- id: 97
  category: safe_driving_rules
  question: A child who is at least age 4 but less than age 8 must be properly restrained
    in a booster seat unless they reach what height?
  choices:
    A: 4-foot 5-inches
    B: 4-foot 9-inches
    C: 5-foot 0-inches
    D: 5-foot 2-inches
  answer: B
  explanation: A child at least age 4 but less than age 8 must be in a booster seat
    unless the child is 4-foot 9-inches in height, or taller.
- id: 98
  category: safe_driving_rules
  question: Headlights must be turned on when natural light conditions do not make
    it possible to clearly see objects how far ahead?
  choices:
    A: 250 feet
    B: 500 feet
    C: 1,000 feet
    D: 2,000 feet
  answer: C
  explanation: Lights must be on at any time when natural light conditions do not
    make it possible to clearly see objects 1,000 feet ahead.
- id: 99
  category: driver_responsibility
  question: If you are pulled over by law enforcement and have a weapon in the vehicle,
    what must you do?
  choices:
    A: Hide the weapon under the seat before the officer approaches.
    B: Inform the officer upon first contact.
    C: Wait until the officer asks if you have any weapons.
    D: Step out of the vehicle to show the officer the weapon.
  answer: B
  explanation: The manual states that if you have a weapon(s) in the vehicle, you
    must inform the officer upon first contact.
- id: 100
  category: safe_driving_rules
  question: According to Ohio law, when must your vehicle's headlights be turned on?
  choices:
    A: Only between 8 PM and 6 AM
    B: Between sunset and sunrise
    C: Only when driving on unlit roads
    D: Between sunrise and sunset
  answer: B
  explanation: The manual states that headlights must be on between sunset and sunrise.
- id: 101
  category: safe_driving_rules
  question: In addition to nighttime, when else does Ohio law require you to use your
    headlights?
  choices:
    A: Whenever you are driving on a highway
    B: Any time windshield wipers are in use because of precipitation
    C: Only when visibility is less than 500 feet
    D: Whenever you are driving above 50 mph
  answer: B
  explanation: According to the manual, lights must be on any time windshield wipers
    are in use because of precipitation.
- id: 102
  category: defensive_driving
  question: What should you do to keep from being momentarily blinded by an approaching
    vehicle's headlights at night?
  choices:
    A: Flash your high beams repeatedly
    B: Look toward the left side of the road
    C: Look toward the right side of the road
    D: Close your eyes for a brief second
  answer: C
  explanation: To keep from being momentarily blinded by an approaching vehicle’s
    headlights, the manual advises to look toward the right side of the road.
- id: 103
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: When driving in fog, you should use low beam headlights (not high beam
    lights) and keep scanning the area for potential hazards.
- id: 104
  category: defensive_driving
  question: Which areas of a highway are likely to freeze first during winter weather?
  choices:
    A: Intersections and crosswalks
    B: Straightaways and uphill grades
    C: Bridges, overpasses, and shaded spots
    D: Tunnels and underpasses
  answer: C
  explanation: The manual specifically notes to remember that bridges, overpasses,
    and shaded spots on a highway ice first.
- id: 105
  category: defensive_driving
  question: What should you do if your vehicle starts to skid on an icy road?
  choices:
    A: Slam on the brakes and hold the steering wheel straight
    B: Take your foot off the accelerator and turn the steering wheel in the direction
      of the skid
    C: Accelerate quickly to regain traction
    D: Apply the brakes firmly and turn the steering wheel opposite the skid
  answer: B
  explanation: If your vehicle starts to skid, take your foot off the accelerator
    and turn the steering wheel in the direction of the skid. You should never apply
    brakes while skidding.
- id: 106
  category: signs_and_signals
  question: What colors are used for Work Zone signs?
  choices:
    A: Yellow background with black letters
    B: White background with red letters
    C: Orange background with black letters or symbols
    D: Green background with white letters
  answer: C
  explanation: Work Zone signs have an orange background and black letters or symbols.
- id: 107
  category: defensive_driving
  question: When looking ahead down your planned path of travel, how far in front
    of your car should you ideally try to look?
  choices:
    A: 5 to 10 seconds
    B: 10 to 15 seconds
    C: 20 to 30 seconds
    D: 40 to 50 seconds
  answer: C
  explanation: Ideally, try to look at what is occurring 20 to 30 seconds in front
    of your car to give yourself time to adjust and plan driving movements.
- id: 108
  category: safe_driving_rules
  question: How should you adjust your speed when entering a curve?
  choices:
    A: Accelerate heavily before entering the curve
    B: Maintain your speed and brake sharply in the middle of the curve
    C: Reduce speed before entering the curve to allow slight and constant acceleration
      through it
    D: Coast through the curve with your foot on the brake
  answer: C
  explanation: Before entering a curve, reduce speed to a safe speed that allows you
    to apply slight and constant acceleration through the curve.
- id: 109
  category: defensive_driving
  question: What is the best way to avoid traction loss from hydroplaning?
  choices:
    A: Drive faster to push the water away from the tires
    B: Pump the brakes rapidly when driving through puddles
    C: Slow down when driving in the rain and when the road is wet with pooled water
    D: Turn the steering wheel sharply from side to side
  answer: C
  explanation: The best way to avoid traction loss from hydroplaning is to slow down
    when driving in the rain and when the road is wet with pooled water or water puddles.
- id: 110
  category: driver_responsibility
  question: What is the average perception time for an alert driver to recognize the
    need to stop?
  choices:
    A: 1/4 to 1/2 second
    B: 3/4 second to 1 second
    C: 1.5 to 2 seconds
    D: 3 to 4 seconds
  answer: B
  explanation: The average perception time for an alert driver is 3/4 second to 1
    second.
- id: 111
  category: safe_driving_rules
  question: What is the recommended minimum following distance between your vehicle
    and the vehicle ahead in ideal conditions?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: Always try to keep a minimum following distance of one vehicle length
    for every 10 miles per hour of travel, or four seconds between your vehicle and
    the vehicle ahead.
- id: 112
  category: sharing_the_road
  question: In which of the following situations should you increase your following
    distance?
  choices:
    A: When driving on a clear, sunny day
    B: When following vehicles required to stop at railroad crossings, like buses
    C: When driving on a newly paved, dry road
    D: When passing a slow-moving vehicle on a straightaway
  answer: B
  explanation: You should increase your following distance when following vehicles
    required to stop at railroad crossings, such as buses, or vehicles carrying hazardous
    materials.
- id: 113
  category: safe_driving_rules
  question: At what distance must natural light conditions make it possible to clearly
    see objects ahead before headlights are required?
  choices:
    A: 250 feet
    B: 500 feet
    C: 1,000 feet
    D: 2,000 feet
  answer: C
  explanation: Lights must be on at any other time when natural light conditions do
    not make it possible to clearly see objects 1,000 feet ahead.
- id: 114
  category: safe_driving_rules
  question: Under Ohio law, when are you required to use your headlights?
  choices:
    A: Only from sunset to sunrise
    B: From sunset to sunrise, during poor visibility, and when windshield wipers
      are used
    C: Only when driving on unlit rural roads
    D: Between the hours of 8 PM and 6 AM
  answer: B
  explanation: Ohio law requires headlights to be used from sunset to sunrise, at
    any time visibility is poor (rain, snow, fog, etc.), and any time the windshield
    wipers are in use because of precipitation.
- id: 115
  category: safe_driving_rules
  question: How far ahead of a turn should you signal your intention to change direction?
  choices:
    A: At least 50 feet
    B: At least 100 feet
    C: At least 200 feet
    D: At least 500 feet
  answer: B
  explanation: The manual states that you must signal a turn at least 100 feet ahead
    of the turn to give other roadway users time to react.
- id: 116
  category: driver_responsibility
  question: How quickly can the temperature inside a vehicle increase by 20 degrees
    Fahrenheit, even with the windows cracked?
  choices:
    A: 5 minutes
    B: 10 minutes
    C: 20 minutes
    D: 30 minutes
  answer: B
  explanation: Even with the windows cracked, the temperature in a vehicle can increase
    20 degrees (Fahrenheit) in just 10 minutes, making it extremely dangerous to leave
    pets or children inside.
- id: 117
  category: sharing_the_road
  question: Which pedestrians always have the right-of-way when crossing the street?
  choices:
    A: Pedestrians jogging in a designated bike lane
    B: Pedestrians carrying a white cane or using a guide dog
    C: Pedestrians crossing outside of a marked crosswalk
    D: Pedestrians wearing highly reflective clothing
  answer: B
  explanation: The manual specifies that pedestrians who are visually impaired or
    blind (carrying a white cane or using a guide dog) have the right-of-way.
- id: 118
  category: sharing_the_road
  question: What is the minimum recommended following distance when driving behind
    a motorcyclist under normal conditions?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds
    D: 6 seconds
  answer: C
  explanation: When following a motorcyclist, you should allow for a minimum 4-second
    following distance, or more in wet conditions, to ensure you have enough time
    to avoid a crash.
- id: 119
  category: sharing_the_road
  question: Why should you not automatically assume a motorcycle is turning just because
    its turn signal is flashing?
  choices:
    A: Motorcyclists frequently use turn signals to indicate they are slowing down
    B: Motorcycle turn signals may not self-cancel and the rider may have forgotten
      to turn them off
    C: The flashing light indicates the motorcycle is experiencing mechanical issues
    D: Turn signals on motorcycles are only used for changing lanes, not turning
  answer: B
  explanation: Do not assume a motorcycle is turning when you see its turn signal
    flashing because motorcycle turn signals may not self-cancel, and the motorcyclist
    may have forgotten to turn them off.
- id: 120
  category: sharing_the_road
  question: When passing a bicyclist, what is the minimum safety zone you must maintain
    between your motor vehicle and the bicycle?
  choices:
    A: One foot
    B: Two feet
    C: Three feet
    D: Five feet
  answer: C
  explanation: Drivers must maintain a safety zone of at least three feet between
    a motor vehicle and a bicycle when passing.
- id: 121
  category: sharing_the_road
  question: Why is it dangerous to squeeze between a large commercial vehicle and
    the curb when it is turning right?
  choices:
    A: The commercial vehicle may accelerate suddenly
    B: The commercial vehicle may make a wide right turn from the left lane to clear
      the corner
    C: The curb may severely damage your vehicle's tires
    D: Commercial vehicles always have the right-of-way at all intersections
  answer: B
  explanation: Trucks or buses may make a wide right turn from the left lane to clear
    the corner of a curb or other obstruction. Squeezing between the large vehicle
    and the curb will cause a serious crash.
- id: 122
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck's side "No Zone"
    (blind spot)?
  choices:
    A: You are driving exactly three car lengths behind the truck
    B: You cannot see the truck's brake lights
    C: You cannot see the truck driver's face in their side-view mirror
    D: You are driving in the lane immediately to the right of the truck
  answer: C
  explanation: Large trucks and buses have large "No Zones" on both sides. If you
    cannot see the driver's face in the side-view mirror, the driver cannot see you.
- id: 123
  category: sharing_the_road
  question: Under ideal conditions, what is the minimum stopping distance for a loaded
    truck traveling at 55 mph?
  choices:
    A: 150 feet
    B: 200 feet
    C: 250 feet
    D: 335 feet
  answer: D
  explanation: A loaded truck with good tires and properly adjusted brakes, under
    ideal conditions, traveling at 55 mph requires a minimum of 335 feet before coming
    to a complete stop.
- id: 124
  category: driver_responsibility
  question: What should you do if you see a child alone in a vehicle and they appear
    to be in distress or unresponsive?
  choices:
    A: Wait by the car until the parents return
    B: Call 911 immediately and take action to remove the child, breaking a window
      if necessary
    C: Leave a note on the windshield warning the parents of the danger
    D: Go into nearby stores to page the owner of the vehicle before taking action
  answer: B
  explanation: If a child is in distress or unresponsive, call 911 immediately and
    take action to remove the child from the vehicle, breaking a window if necessary.
    "Good Samaritan" laws protect people responding in an emergency.
- id: 125
  category: sharing_the_road
  question: Which of the following statements is true regarding bicyclists on the
    roadway?
  choices:
    A: Bicyclists must ride against vehicular traffic to see oncoming cars
    B: Bicycles are considered vehicles and must ride with vehicular traffic
    C: Bicyclists are not required to obey traffic signs and signals
    D: Bicyclists must always ride on the sidewalk when one is available
  answer: B
  explanation: Bicycles are considered vehicles when on roadways and must ride with,
    not against, other vehicular traffic. They are also required to obey all traffic
    signs, signals, and pavement markings.
- id: 126
  category: safe_driving_rules
  question: In which of the following situations is it appropriate to use your vehicle's
    horn?
  choices:
    A: To express anger at another driver's mistake
    B: To scare a bicyclist who is riding too slowly
    C: To alert a pedestrian who appears to be moving into your lane of travel
    D: To greet a friend walking on the sidewalk
  answer: C
  explanation: You should tap your horn lightly to communicate to others when pedestrians
    or bicyclists appear to be moving into your lane of travel. Using your horn inappropriately
    could scare or anger another road user.
- id: 127
  category: defensive_driving
  question: How can you help maintain a safe following distance for the driver behind
    your vehicle?
  choices:
    A: By frequently tapping your brakes to keep them alert
    B: By keeping a steady speed and signaling your intentions in advance
    C: By speeding up rapidly to create more distance
    D: By moving into the blind spot of the vehicle next to you
  answer: B
  explanation: You can help keep the driver behind you at a safe distance by keeping
    a steady speed, signaling in advance, and keeping more space to the front of your
    vehicle before reducing speed or turning.
- id: 128
  category: sharing_the_road
  question: Why is it important to always stop behind intersection stop lines?
  choices:
    A: It prevents pedestrians from crossing the street
    B: It triggers the traffic light to change faster
    C: It sets you farther back to give larger vehicles more turning space
    D: It allows you to accelerate faster when the light turns green
  answer: C
  explanation: Always stop behind intersection stop lines because these lines help
    to set you farther back at an intersection to give larger vehicles more turning
    space.
- id: 129
  category: sharing_the_road
  question: How far can the blind spots directly behind large vehicles extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 200 feet
    D: Up to 300 feet
  answer: C
  explanation: Unlike passenger vehicles, large vehicles have huge blind spots directly
    behind them that extend up to 200 feet.
- id: 130
  category: safe_driving_rules
  question: What must a driver do when an emergency vehicle displaying flashing lights
    and audible sirens is approaching?
  choices:
    A: Stop immediately in the current lane
    B: Quickly and safely pull to the right side of the road and stop
    C: Speed up to clear the intersection quickly
    D: Pull to the left side of the road and stop
  answer: B
  explanation: When emergency vehicles are approaching, the driver must quickly and
    safely pull to the right side of the road and stop, avoiding blocking intersections.
- id: 131
  category: safe_driving_rules
  question: Under Ohio's Move Over Law, what should you do if it is unsafe to change
    lanes when approaching a stopped emergency vehicle with its warning lights activated?
  choices:
    A: Stop immediately behind the emergency vehicle
    B: Maintain your speed and honk your horn
    C: Slow down and proceed with caution
    D: Accelerate to pass the vehicle as quickly as possible
  answer: C
  explanation: If a lane change is unsafe, the Move Over Law requires drivers to slow
    down and proceed with caution while maintaining a safe speed for traffic conditions.
- id: 132
  category: signs_and_signals
  question: What does a fluorescent or reflective orange and red triangle displayed
    on the rear of a vehicle indicate?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is traveling less than 25 mph
    C: The vehicle is making frequent stops
    D: The vehicle is broken down
  answer: B
  explanation: A fluorescent or reflective orange and red triangle displayed on the
    rear of vehicles means the vehicle is traveling less than 25 mph.
- id: 133
  category: safe_driving_rules
  question: Under what condition are you permitted to cross a solid yellow line to
    pass a slow-moving vehicle?
  choices:
    A: If the vehicle is traveling less than half the posted speed limit
    B: If the vehicle is a piece of farm machinery
    C: If you honk your horn before passing
    D: If you are driving in a rural area
  answer: A
  explanation: You are permitted to cross a solid yellow line to pass a slow-moving
    vehicle as long as the vehicle is traveling less than half the posted speed limit,
    you do not exceed the speed limit, and there is sufficient clear space.
- id: 134
  category: defensive_driving
  question: What is the proper procedure if your vehicle begins to skid?
  choices:
    A: Slam on the brakes and steer straight ahead
    B: Accelerate quickly to regain traction
    C: Release pressure from the brake or accelerator and turn the wheel into the
      skid
    D: Turn the steering wheel in the opposite direction of the skid
  answer: C
  explanation: When you begin to skid, you should release pressure from the brake
    or accelerator and turn the wheel into the skid.
- id: 135
  category: safe_driving_rules
  question: How must a driver treat an intersection with an inoperable traffic signal
    due to a power outage, if no law enforcement officer is present?
  choices:
    A: As a yield sign
    B: As a four-way stop
    C: Proceed without stopping if the road appears clear
    D: Only the vehicles on the larger road have the right-of-way
  answer: B
  explanation: By law, except when a law enforcement officer is present to direct
    traffic, drivers must treat a non-working traffic signal as a four-way stop.
- id: 136
  category: defensive_driving
  question: What should you do if your vehicle leaves the paved road surface and encounters
    an uneven surface drop-off?
  choices:
    A: Jerk the steering wheel hard to return to the pavement immediately
    B: Slam on the brakes to stop the vehicle
    C: Accelerate to get back onto the road quickly
    D: Let off the accelerator, slow down gradually, and return to the pavement when
      safe
  answer: D
  explanation: If your vehicle leaves the paved road surface, let off the accelerator,
    slow down gradually, and when safe to do so, return to the pavement.
- id: 137
  category: vehicle_information
  question: If your vehicle's accelerator becomes stuck and the vehicle is accelerating
    out of control, what gear should you shift into?
  choices:
    A: PARK
    B: REVERSE
    C: NEUTRAL
    D: DRIVE
  answer: C
  explanation: If your vehicle is accelerating out of control, you should turn on
    emergency flashers, shift to 'NEUTRAL' gear, and search for an escape route.
- id: 138
  category: vehicle_information
  question: Which of the following is the correct action to take if you experience
    a tire blowout while driving?
  choices:
    A: Brake hard immediately to stop the vehicle
    B: Do not brake; slow down gradually
    C: Accelerate slightly to maintain steering control
    D: Pump the brakes rapidly
  answer: B
  explanation: In the event of a tire blowout, you should grip the steering wheel
    firmly, keep the vehicle going straight, and do not brake; slow down gradually.
- id: 139
  category: defensive_driving
  question: If your vehicle breaks down, how far behind the vehicle should you place
    emergency flares if possible?
  choices:
    A: 50 to 100 feet
    B: 100 to 150 feet
    C: 200 to 300 feet
    D: 400 to 500 feet
  answer: C
  explanation: If possible, place emergency flares about 200 to 300 feet behind the
    vehicle to alert other drivers and give them time to change lanes.
- id: 140
  category: driver_responsibility
  question: When exchanging information after a crash, what should you avoid discussing?
  choices:
    A: The names and addresses of witnesses
    B: The license plate numbers of the vehicles involved
    C: Fault or insurance coverage
    D: The weather and road conditions
  answer: C
  explanation: When exchanging information with others involved in the accident, you
    should provide contact and vehicle details, but do not discuss fault or insurance
    coverage.
- id: 141
  category: sharing_the_road
  question: In addition to a slow-moving emblem, what must farm machinery display
    when traveling at night?
  choices:
    A: A white flashing light
    B: A red flashing light
    C: High beam headlights
    D: Hazard lights only
  answer: B
  explanation: Farm machinery must display the slow-moving emblem, and use a red flashing
    light at night.
- id: 142
  category: vehicle_information
  question: If your engine shuts off while you are driving (power failure), what should
    you expect regarding the steering wheel?
  choices:
    A: The steering wheel will lock completely and cannot be turned
    B: The steering wheel will turn much easier than normal
    C: The steering wheel may be difficult to turn, but you can turn it
    D: The steering wheel will automatically steer the vehicle to the right
  answer: C
  explanation: If the engine shuts off while driving, keep a strong grip on the steering
    wheel. Be aware that the steering wheel may be difficult to turn, but you can
    turn it.
- id: 143
  category: driver_responsibility
  question: Under what conditions may a driver file a Crash Report (form BMV 3303)
    with the Ohio Bureau of Motor Vehicles?
  choices:
    A: Within 30 days if the damage is over $1,000
    B: Within 6 months if damage exceeds $400 or there is injury, and the other driver
      was uninsured
    C: Within 1 year for any crash involving two or more vehicles
    D: Within 24 hours if there is any visible damage to either vehicle
  answer: B
  explanation: The manual states a driver may file a Crash Report within six months
    if there was damage in excess of $400 or personal injury, and the driver or owner
    of the other vehicle did not have insurance.
- id: 144
  category: driver_responsibility
  question: What must you do if you are involved in a crash with an unattended vehicle?
  choices:
    A: Wait by the vehicle until the owner returns
    B: Report the crash to the police or leave necessary information at the scene
    C: Only notify your insurance company
    D: Leave the scene immediately if there is no visible damage
  answer: B
  explanation: If involved in a crash with an unattended vehicle, you must report
    the crash to the police or leave necessary information at the scene.
- id: 145
  category: driver_testing
  question: Which of the following vehicle components is checked during the vehicle
    inspection before the driving test begins?
  choices:
    A: Air conditioning and radio
    B: Turn signals, brake lights, and horn
    C: Engine oil level and tire pressure
    D: Interior dome light and glove box latch
  answer: B
  explanation: A vehicle inspection performed before the test begins will check the
    working order of turn signals, brake lights, horn, windshield wipers, and headlights.
- id: 146
  category: driver_testing
  question: What is a requirement for the vehicle's doors during the driving test
    inspection?
  choices:
    A: All four doors must have child safety locks enabled
    B: The rear doors must open from the inside only
    C: The front doors must be able to open from the inside and outside
    D: The driver's door must have an automatic window
  answer: C
  explanation: The manual specifies that front doors must be able to open from the
    inside and outside with the door handle.
- id: 147
  category: driver_testing
  question: What action results in an immediate failure during the maneuverability
    skills test?
  choices:
    A: Stopping to check your mirrors
    B: Misjudging the stopping distance by a few inches
    C: Running over or knocking down a marker
    D: Completing the course too slowly
  answer: C
  explanation: It is an immediate failure if a driver runs over or knocks down a marker,
    removes the marker from the designated area, or performs other dangerous actions.
- id: 148
  category: driver_testing
  question: In Step One of the maneuverability test, where must you stop the vehicle?
  choices:
    A: When the front bumper touches the center marker
    B: When the rear bumper is even with the center marker
    C: When the vehicle is entirely past all five markers
    D: When the front bumper is even with the two rear markers
  answer: B
  explanation: In Step One, you must steer straight ahead and stop when the rear bumper
    of the vehicle is even with the center marker and generally parallel with the
    course.
- id: 149
  category: driver_testing
  question: How long must an applicant under age 21 wait before retesting if they
    fail the driving test?
  choices:
    A: 24 hours
    B: Two days
    C: One week
    D: 30 days
  answer: B
  explanation: Under Age 21 applicants must wait two days before retesting after a
    test failure.
- id: 150
  category: driver_testing
  question: What is required for an applicant age 21 or older who fails the driving
    test for the first time, assuming they have not taken an approved driver education
    course recently?
  choices:
    A: Wait 30 days before retesting
    B: Take an Abbreviated Adult Driver Training Course
    C: Complete 50 hours of supervised driving
    D: Pay a $100 retesting fee
  answer: B
  explanation: An applicant age 21 or older who fails the maneuverability or road
    skills portion of the driving test is required to take an Abbreviated Adult Driver
    Training Course before attempting the driving test for a second time.
- id: 151
  category: driver_testing
  question: If an adult applicant chooses the option of 24 hours of driving with a
    licensed driver age 21 or older for their Abbreviated Adult Driver Training, what
    is the maximum number of driving hours allowed per day?
  choices:
    A: Two hours
    B: Four hours
    C: Six hours
    D: Eight hours
  answer: B
  explanation: Applicants who choose the option for 24 hours of driving with a licensed
    driver age 21 or older cannot complete more than four hours of driving in one
    day.
- id: 152
  category: license_system
  question: What specific form must an applicant under age 18 provide when purchasing
    their driver license?
  choices:
    A: Twenty-Four Hour Affidavit (form BMV 5789)
    B: Notarized Fifty-Hour Affidavit (form BMV 5791)
    C: Proof of high school enrollment
    D: Medical clearance form
  answer: B
  explanation: If the applicant is under age 18, they must bring a Notarized Fifty-Hour
    Affidavit (form BMV 5791) to the Deputy Registrar agency.
- id: 153
  category: driver_responsibility
  question: How long is a parent or legal guardian who co-signs a minor's application
    jointly liable for damages caused by the minor's negligence?
  choices:
    A: Until the minor turns 21
    B: For the first six months of driving
    C: Until the minor's 18th birthday
    D: Until the minor purchases their own vehicle
  answer: C
  explanation: The parent or legal guardian who co-signs a minor’s application is
    jointly and severally liable with the minor for any damages caused by negligence
    or willful misconduct until the minor’s 18th birthday.
- id: 154
  category: license_system
  question: How can a co-signer cancel their authorization for a minor's driver license?
  choices:
    A: By calling the local police department
    B: By mailing the minor's license or a notarized letter to the BMV
    C: By emailing the ADA Coordinator
    D: By destroying the minor's physical license card
  answer: B
  explanation: A cosigner can cancel authorization for a minor at any time by mailing
    the minor’s Driver License or TIPIC or a notarized letter requesting the cancelation
    to the Ohio Bureau of Motor Vehicles.
- id: 155
  category: license_system
  question: How many documents proving an Ohio street address are required to obtain
    a Compliant Driver License card?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Obtaining a Compliant card requires more identity documents than the
    Standard card, including two documents to prove an Ohio street address.
- id: 156
  category: license_system
  question: Which of the following is true regarding a Standard Driver License card?
  choices:
    A: It meets all national travel security requirements
    B: It requires more identity documents than the Compliant card
    C: It cannot be used to fly commercially without a passport or other TSA-approved
      document
    D: It is only issued to drivers under the age of 21
  answer: C
  explanation: The Standard Card does not meet national travel security requirements
    and will need to be used in conjunction with a passport or other acceptable documents
    approved by the TSA in order to fly commercially.
- id: 157
  category: driver_testing
  question: What must be done with automated assistance tools, such as automated parking,
    during the driving test?
  choices:
    A: They must be used to demonstrate proficiency
    B: They must be disabled
    C: They can be used only during the maneuverability portion
    D: They are required for all applicants over age 65
  answer: B
  explanation: During the vehicle inspection before the test begins, automated assistance
    tools, such as automated parking, must be disabled.
- id: 158
  category: license_system
  question: Which of the following is NOT one of the five elements required for proof
    of identity when applying for an Ohio Driver License?
  choices:
    A: Full Legal Name
    B: Social Security number
    C: Proof of Employment
    D: Date of Birth
  answer: C
  explanation: Applicants must provide acceptable documentation for proof of identity
    that includes Full Legal Name, Date of Birth, Social Security number, Ohio Street
    Address, and Citizenship or Legal Presence.
- id: 159
  category: safe_driving_rules
  question: During the first 12 months of holding a Driver License, a driver under
    age 18 may not operate a vehicle between what hours unless accompanied by a parent
    or guardian?
  choices:
    A: 10 p.m. to 5 a.m.
    B: 11 p.m. to 6 a.m.
    C: Midnight to 6 a.m.
    D: 1 a.m. to 5 a.m.
  answer: C
  explanation: During the first 12 months of holding a Driver License, a new driver
    under age 18 may not operate a vehicle from midnight to 6 a.m. unless accompanied
    by a parent or guardian or meeting other specific exceptions.
- id: 160
  category: safe_driving_rules
  question: A driver under age 18 in their first 12 months of holding a license may
    not operate a vehicle with more than how many non-family members as passengers
    without a parent or guardian?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: The driver may not operate a vehicle with more than one non-family
    member as a passenger, unless accompanied by a parent or guardian.
- id: 161
  category: safe_driving_rules
  question: After the first 12 months of holding a Driver License, what are the restricted
    driving hours for a driver under age 18 (unless an exception applies)?
  choices:
    A: Midnight to 6 a.m.
    B: 1 a.m. to 5 a.m.
    C: 10 p.m. to 6 a.m.
    D: 11 p.m. to 5 a.m.
  answer: B
  explanation: After the first 12 months of holding a Driver License, the driver under
    age 18 may not operate a vehicle from 1 a.m. to 5 a.m. unless an exception applies.
- id: 162
  category: penalties_and_points
  question: For a driver under age 18, multiple traffic convictions before reaching
    age 18 may result in a license suspension of what length?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: Multiple traffic convictions before the driver reaches age 18 may result
    in a 90-day license suspension.
- id: 163
  category: license_system
  question: If you are under age 21, when does your Ohio Driver License expire?
  choices:
    A: On your 18th birthday
    B: On your 21st birthday
    C: Four years from the date of issuance
    D: Eight years from the date of issuance
  answer: B
  explanation: If you are under age 21, your Ohio Driver License expires on your 21st
    birthday and must be renewed in person.
- id: 164
  category: license_system
  question: What is the grace period for renewing your Ohio Driver License after it
    has expired?
  choices:
    A: There is no grace period
    B: 10 days
    C: 30 days
    D: 6 months
  answer: A
  explanation: There is no grace period for renewing your license. If you continue
    to drive after your license has expired, you risk a traffic citation.
- id: 165
  category: license_system
  question: Which Commercial Driver License (CDL) class is required for a single vehicle
    designed to transport 16 or more passengers, including the driver?
  choices:
    A: Class A
    B: Class B
    C: Class C
    D: Class D
  answer: C
  explanation: A Class C CDL is required for any single vehicle or combination of
    vehicles not considered Class A or B that is designed to transport 16 or more
    passengers, including the driver.
- id: 166
  category: safe_driving_rules
  question: 'Probationary moped license holders ages 14-15 are restricted to driving:'
  choices:
    A: Only with a parent or guardian
    B: Only during daylight hours
    C: Only on roads with a speed limit under 35 mph
    D: Only to and from school
  answer: B
  explanation: Probationary moped license holders ages 14-15 are limited to daylight
    driving only.
- id: 167
  category: vehicle_information
  question: 'To be classified as a moped or motorized bicycle, the vehicle''s helper
    motor must NOT produce more than:'
  choices:
    A: One brake horsepower
    B: Two brake horsepower
    C: Three brake horsepower
    D: Five brake horsepower
  answer: A
  explanation: A moped is equipped with a helper motor that produces no more than
    one brake horsepower.
- id: 168
  category: license_system
  question: What vehicles may a two-wheeled motorcycle endorsement holder operate?
  choices:
    A: Only two-wheeled motorcycles
    B: Two-wheeled motorcycles and motor scooters only
    C: Two- or three-wheeled motorcycles and motor scooters
    D: Any motorcycle, but no motor scooters
  answer: C
  explanation: A two-wheeled motorcycle endorsement or license holder may operate
    a two- or three-wheeled motorcycle and a scooter.
- id: 169
  category: vehicle_information
  question: 'A motor scooter is characterized by having a motor that is capable of
    propelling the vehicle at a speed greater than:'
  choices:
    A: 15 mph on a level surface
    B: 20 mph on a level surface
    C: 25 mph on a level surface
    D: 30 mph on a level surface
  answer: B
  explanation: A motor scooter is equipped with a motor between 50 cc and 100 cc that
    is capable of propelling the vehicle at a speed greater than 20 mph on a level
    surface.
- id: 170
  category: driver_testing
  question: Who is required to complete the Motorcycle Ohio program before applying
    for a motorcycle operator's endorsement or license?
  choices:
    A: All first-time applicants regardless of age
    B: Individuals under age 18
    C: Individuals under age 21
    D: Anyone who fails the skills test on their first attempt
  answer: B
  explanation: The Motorcycle Ohio program is required for individuals under age 18
    before they can apply for a motorcycle operator’s endorsement and/or license.
- id: 171
  category: license_system
  question: After establishing residency in Ohio, how many days do new residents have
    to obtain an Ohio-issued Driver License?
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Within 30 days of establishing residency, Ohio drivers must have an
    Ohio-issued Driver License.
- id: 172
  category: driver_responsibility
  question: When applying for or renewing vehicle registration, Ohioans are asked
    if they want to contribute $1 to which fund to ensure children have healthy eyes?
  choices:
    A: Second Chance Trust Fund
    B: Save Our Sight fund
    C: Ohio Vision Program
    D: Donate Life Ohio
  answer: B
  explanation: When Ohioans apply for or renew their vehicle registration, they are
    asked if they want to contribute $1 to the Save Our Sight fund, which ensures
    children in Ohio have good vision and healthy eyes.
- id: 173
  category: license_system
  question: What Ohio fund receives voluntary donations to support the education of
    organ, eye, and tissue donation?
  choices:
    A: Ohio Highway Safety Fund
    B: Second Chance Trust Fund
    C: Save Our Sight Fund
    D: Donate Life Ohio Fund
  answer: B
  explanation: According to the manual, a voluntary donation to Ohio's Second Chance
    Trust Fund supports education of organ, eye, and tissue donation.
- id: 174
  category: license_system
  question: When you fill out a Voter Registration form at a Deputy Registrar License
