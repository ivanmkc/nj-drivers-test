metadata:
  source: 2025 Ohio Driver's Manual
  total_questions: 259
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Ohio, what is the minimum age an individual must reach to apply for
    a Temporary Instruction Permit Identification Card (TIPIC)?
  choices:
    A: 15 years old
    B: 15 years and 6 months old
    C: 16 years old
    D: 14 years and 9 months old
  answer: B
  explanation: According to the Ohio BMV, an applicant must be at least 15 years and
    six months of age to apply for a Temporary Instruction Permit Identification Card
    (TIPIC).
- id: 2
  category: license_system
  question: An applicant under the age of 18 must hold their Ohio TIPIC for at least
    how long before they are eligible to take the road skills test?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Ohio law requires drivers under 18 to hold their temporary permit for
    at least six months before applying for a probationary driver license.
- id: 3
  category: license_system
  question: For the first 12 months of holding an Ohio probationary license, a 16-year-old
    driver is prohibited from driving between which hours unless accompanied by a
    parent or guardian?
  choices:
    A: 11 p.m. to 5 a.m.
    B: 10 p.m. to 6 a.m.
    C: Midnight to 6 a.m.
    D: 1 a.m. to 5 a.m.
  answer: C
  explanation: Probationary license holders who are 16 years old are restricted from
    driving between midnight and 6 a.m. unless they are with a parent or guardian
    or traveling to/from work/school/church with documentation.
- id: 4
  category: license_system
  question: Once an Ohio probationary license holder turns 17, the nighttime driving
    restriction changes. Between what hours are they restricted from driving?
  choices:
    A: Midnight to 6 a.m.
    B: 1 a.m. to 5 a.m.
    C: 11 p.m. to 4 a.m.
    D: 2 a.m. to 6 a.m.
  answer: B
  explanation: For 17-year-old probationary license holders in Ohio, the driving restriction
    is from 1 a.m. to 5 a.m. unless accompanied by a parent or guardian.
- id: 5
  category: license_system
  question: During the first 12 months of holding an Ohio probationary license, how
    many non-family members is the driver permitted to carry as passengers without
    a parent/guardian present?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Ohio's GDL laws state that for the first 12 months, a probationary
    license holder may not operate a vehicle with more than one person who is not
    a family member unless accompanied by a parent or guardian.
- id: 6
  category: license_system
  question: To obtain a probationary license in Ohio, a driver under 18 must complete
    how many hours of certified driving experience, including nighttime driving?
  choices:
    A: 40 total hours, 5 at night
    B: 50 total hours, 10 at night
    C: 60 total hours, 15 at night
    D: 30 total hours, 10 at night
  answer: B
  explanation: Ohio requires 50 hours of driving experience, at least 10 of which
    must be at night, verified by a parent or guardian.
- id: 7
  category: license_system
  question: If you move to a new residence within Ohio, you must notify the BMV of
    your change of address within how many days?
  choices:
    A: 10 days
    B: 30 days
    C: 7 days
    D: 14 days
  answer: A
  explanation: Ohio law requires license holders to notify the Bureau of Motor Vehicles
    of any change of address within 10 days of the move.
- id: 8
  category: license_system
  question: Under Ohio's point system, at how many points within a two-year period
    will a driver's license be automatically suspended?
  choices:
    A: 6 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: In Ohio, if a driver accumulates 12 points within a two-year period,
    their driving privileges will be suspended for six months.
- id: 9
  category: license_system
  question: In Ohio, a driver who has accumulated at least two but fewer than 12 points
    may earn a two-point credit by completing an approved remedial driving course.
    How often can this credit be applied?
  choices:
    A: Once every year
    B: Once every 3 years
    C: Once every 5 years
    D: Only once in a lifetime
  answer: B
  explanation: Ohio allows drivers to take a remedial driving course for a two-point
    credit once every three years, up to five times in a lifetime.
- id: 10
  category: license_system
  question: What is the legal Blood Alcohol Concentration (BAC) limit for a driver
    in Ohio who is under the age of 21?
  choices:
    A: 0.08%
    B: 0.05%
    C: 0.02%
    D: 0.00%
  answer: C
  explanation: Ohio has a 'zero tolerance' policy for underage drinking and driving;
    the legal BAC limit for drivers under 21 is 0.02%.
- id: 11
  category: license_system
  question: When a TIPIC holder is under age 18, they must be accompanied by a licensed
    parent, guardian, or custodian. If the holder is 18 or older, who must accompany
    them?
  choices:
    A: Any person with a valid license
    B: A licensed driver at least 21 years of age
    C: A licensed driver at least 25 years of age
    D: They may drive alone during daylight hours
  answer: B
  explanation: Regardless of the permit holder's age, they must be accompanied by
    a licensed driver who is at least 21 years of age seated in the front passenger
    seat.
- id: 12
  category: license_system
  question: What is the minimum amount of coverage required for 'property damage'
    in a valid Ohio auto insurance policy?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Ohio's financial responsibility law requires a minimum of $25,000 for
    property damage in any one accident.
- id: 13
  category: license_system
  question: If an Ohio driver is convicted of a 'Operating a Vehicle after Underage
    Consumption' (OVUAC) offense, how many points are assessed to their license?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 0 points, but license is suspended
  answer: B
  explanation: An OVUAC conviction in Ohio results in 4 points being added to the
    driver's record.
- id: 14
  category: license_system
  question: When does an Ohio probationary license typically expire?
  choices:
    A: Four years from the date of issuance
    B: On the driver's 18th birthday
    C: On the driver's 21st birthday
    D: Two years from the date of issuance
  answer: C
  explanation: In Ohio, a probationary license is valid until the driver reaches the
    age of 21.
- id: 15
  category: license_system
  question: To comply with federal 'REAl ID' requirements for boarding domestic flights,
    which type of Ohio credential must a resident obtain?
  choices:
    A: Standard Card
    B: Compliant Card
    C: Temporary Permit
    D: Commercial Driver License only
  answer: B
  explanation: Ohio offers 'Compliant' cards which meet the federal REAL ID standards
    for national security and are required for boarding commercial flights and entering
    federal facilities.
- id: 16
  category: license_system
  question: New residents to Ohio who possess a valid out-of-state driver license
    must obtain an Ohio license within how many days of establishing residency?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: According to the Ohio BMV, new residents must obtain an Ohio driver
    license within 30 days of establishing residency in the state.
- id: 17
  category: license_system
  question: To pass the vision screening for an Ohio driver license without restrictions,
    an applicant must have at least what visual acuity in each eye?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/70
  answer: C
  explanation: Ohio requires a minimum visual acuity of 20/40 in each eye to qualify
    for an unrestricted driver license.
- id: 18
  category: license_system
  question: If an Ohio driver license has been expired for more than ______, the person
    must take the knowledge and road skills tests again to obtain a new license.
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: In Ohio, if a license is expired for more than six months, the holder
    is no longer eligible for a simple renewal and must complete the full testing
    process again.
- id: 19
  category: license_system
  question: Under Ohio's point system, how many points are assessed to a driver's
    record for a conviction of 'Operating a vehicle under the influence of alcohol
    and/or drugs' (OVI)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Major traffic violations in Ohio, such as OVI, drag racing, or fleeing
    a law enforcement officer, result in 6 points being added to the driver's record.
- id: 20
  category: license_system
  question: An Ohio Temporary Instruction Permit Identification Card (TIPIC) is valid
    for how long from the date it is issued?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 4 years
  answer: B
  explanation: An Ohio TIPIC expires exactly one year from the date of issuance.
- id: 21
  category: license_system
  question: In Ohio, who has the legal authority to sign a minor's application for
    a license and also reserves the right to withdraw that consent at any time before
    the minor turns 18?
  choices:
    A: Only a biological parent
    B: A parent, guardian, or other person having legal custody
    C: Any licensed driver over the age of 21
    D: The minor's high school principal
  answer: B
  explanation: Ohio law requires a parent, guardian, or person with legal custody
    to sign for a minor. This person can also file a written request to the BMV to
    cancel the minor's license.
- id: 22
  category: license_system
  question: What is the minimum amount of liability insurance coverage required in
    Ohio for 'bodily injury' to one person in any one accident?
  choices:
    A: $15,000
    B: $25,000
    C: $50,000
    D: $100,000
  answer: B
  explanation: Ohio's Financial Responsibility law requires a minimum of $25,000 for
    bodily injury to one person.
- id: 23
  category: license_system
  question: If you are convicted of a first-time 'Non-Compliance' (failure to show
    proof of insurance) offense in Ohio, what is the reinstatement fee to get your
    license back?
  choices:
    A: $50
    B: $100
    C: $150
    D: $600
  answer: C
  explanation: For a first offense of non-compliance with the financial responsibility
    law, Ohio charges a $150 reinstatement fee. Subsequent offenses carry higher fees
    ($300 and $600).
- id: 24
  category: license_system
  question: A standard Ohio Class D driver license allows you to operate which of
    the following vehicles?
  choices:
    A: Any vehicle with a Gross Vehicle Weight Rating (GVWR) over 26,001 lbs
    B: A motorcycle without a separate endorsement
    C: A passenger car or commercial vehicle not exceeding 26,000 lbs GVWR
    D: A school bus designed to carry more than 15 passengers
  answer: C
  explanation: A Class D license is the standard non-commercial license for passenger
    cars and small trucks under 26,001 lbs that do not require a CDL.
- id: 25
  category: license_system
  question: In Ohio, how many points are assessed to your driving record for a conviction
    of 'Drag Racing'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Drag racing is considered a serious traffic violation in Ohio and carries
    a 6-point penalty.
- id: 26
  category: license_system
  question: If an Ohio driver under the age of 18 accumulates three points on their
    driving record, what is the mandatory penalty?
  choices:
    A: A permanent license revocation
    B: A 90-day license suspension
    C: A warning letter from the BMV only
    D: The driver must retake the written test only
  answer: B
  explanation: Under Ohio law, if a probationary license holder (under 18) accumulates
    three points, their license is suspended for 90 days.
- id: 27
  category: license_system
  question: 'To obtain a ''Compliant'' Ohio driver license (REAL ID), an applicant
    must provide proof of all the following EXCEPT:'
  choices:
    A: Full legal name and Date of Birth
    B: Social Security Number
    C: Two documents proving Ohio residential address
    D: Proof of a high school diploma or GED
  answer: D
  explanation: Educational attainment is not a requirement for a REAL ID. Applicants
    must prove identity, SSN, legal presence, and residency.
- id: 28
  category: license_system
  question: 'If an Ohio driver under age 21 is convicted of a first-time OVI (Operating
    a Vehicle after Underage Consumption), their license will be suspended for at
    least:'
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: The suspension for an underage OVI (OVUAC) in Ohio ranges from a minimum
    of 90 days to a maximum of two years.
- id: 29
  category: license_system
  question: 'When applying for an Ohio license, if you have a physical or mental condition
    that may affect your ability to drive safely, you must:'
  choices:
    A: Be permanently denied a license
    B: Submit a medical report from a physician for review by the BMV
    C: Only drive during daylight hours
    D: Have a licensed passenger with you at all times
  answer: B
  explanation: Ohio requires drivers with certain medical conditions to submit a medical
    profile completed by a physician to ensure they can safely operate a vehicle.
- id: 30
  category: driver_testing
  question: In Ohio, what is the maximum speed limit in municipal alleys?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: According to the Ohio Digest of Motor Vehicle Laws, the speed limit
    in municipal alleys is 15 mph.
- id: 31
  category: driver_testing
  question: What is the speed limit in an Ohio school zone during school recess or
    while children are going to or leaving school during opening or closing hours?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Ohio law mandates a 20 mph speed limit in school zones during restricted
    hours when children are present.
- id: 32
  category: driver_testing
  question: If an applicant fails the Ohio road or maneuverability test, how long
    must they wait before they are eligible to take the test again?
  choices:
    A: 24 hours
    B: 48 hours
    C: 7 days
    D: 14 days
  answer: C
  explanation: If you fail the skills test (road or maneuverability), you must wait
    at least seven days before retesting.
- id: 33
  category: driver_testing
  question: In Ohio, what are the minimum state requirements for 'bodily injury' liability
    insurance coverage?
  choices:
    A: $15,000 per person / $30,000 per accident
    B: $25,000 per person / $50,000 per accident
    C: $50,000 per person / $100,000 per accident
    D: $10,000 per person / $20,000 per accident
  answer: B
  explanation: Ohio law requires minimum liability coverage of $25,000 for bodily
    injury to or death of one person in any one accident and $50,000 for bodily injury
    to or death of two or more persons in any one accident.
- id: 34
  category: driver_testing
  question: Under Ohio's point system, how many points are assessed for a speeding
    violation where the driver is exceeding the limit by 30 mph or more?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: Exceeding the speed limit by 30 mph or more results in 4 points being
    added to the driver's record in Ohio.
- id: 35
  category: driver_testing
  question: When a school bus is stopped on a road with fewer than four lanes and
    its red lights are flashing, drivers approaching from either direction must stop
    at least how many feet from the bus?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: A
  explanation: Ohio law requires drivers to stop at least 10 feet from the front or
    rear of a school bus when it is dropping off or picking up passengers on roads
    with fewer than four lanes.
- id: 36
  category: driver_testing
  question: In Ohio, children are required to use a booster seat until they reach
    what age or height?
  choices:
    A: Age 6 or 4 feet 5 inches
    B: Age 7 or 4 feet 7 inches
    C: Age 8 or 4 feet 9 inches
    D: Age 10 or 5 feet tall
  answer: C
  explanation: Ohio law requires children under the age of 8 or less than 4 feet 9
    inches tall to be in a booster seat.
- id: 37
  category: driver_testing
  question: What is the legal Blood Alcohol Concentration (BAC) limit for adult drivers
    (21 and older) in Ohio?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: In Ohio, it is illegal for an adult driver (21+) to operate a vehicle
    with a BAC of 0.08% or higher.
- id: 38
  category: driver_testing
  question: How many points are assessed to an Ohio driver's record for a conviction
    of 'Street Racing' (Drag Racing)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Street racing is a serious offense in Ohio and carries a 6-point penalty
    on the driver's license.
- id: 39
  category: driver_testing
  question: To pass the Ohio knowledge (written) test, an applicant must correctly
    answer at least what percentage of the questions?
  choices:
    A: 70%
    B: 75%
    C: 80%
    D: 85%
  answer: B
  explanation: The Ohio BMV requires a passing score of 75% on the knowledge test
    (30 out of 40 questions correct).
- id: 40
  category: driver_testing
  question: As of July 2020, where must Ohio residents display license plates on their
    passenger vehicles?
  choices:
    A: On the front bumper only
    B: On the rear bumper only
    C: On both the front and rear bumpers
    D: In the rear window
  answer: B
  explanation: Effective July 1, 2020, Ohio law no longer requires a front license
    plate on most passenger vehicles; only a rear plate is required.
- id: 41
  category: driver_testing
  question: On a highway with a speed limit of 55 mph or higher, how many points are
    assessed if you are caught driving 15 mph over the limit?
  choices:
    A: 0 points
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: In Ohio, speeding 11-29 mph over the limit on a highway with a 55 mph
    or higher limit results in 2 points.
- id: 42
  category: driver_testing
  question: Ohio's 'Move Over' law requires drivers to do what when approaching a
    stationary emergency vehicle with flashing lights?
  choices:
    A: Stop completely until the vehicle leaves
    B: Maintain speed but move to the left lane
    C: Proceed with caution and, if possible, move to an adjacent lane
    D: Speed up to pass the vehicle quickly
  answer: C
  explanation: Ohio's Move Over law requires drivers to move over one lane if possible
    or slow down and proceed with caution when passing stationary emergency or public
    safety vehicles.
- id: 43
  category: driver_testing
  question: When applying for a TIPIC in Ohio, an applicant is asked if they wish
    to join the 'Donate Life Ohio' registry. What does this registry signify?
  choices:
    A: Voter registration
    B: Organ and tissue donation
    C: Charitable giving for road repairs
    D: Emergency contact notification system
  answer: B
  explanation: The 'Donate Life Ohio' registry is the state's database for individuals
    who wish to be organ, eye, and tissue donors.
- id: 44
  category: driver_testing
  question: What type of sign is used in Ohio to identify a 'Slow-Moving Vehicle'
    (one that travels at 25 mph or less)?
  choices:
    A: A circular yellow sign
    B: A square green sign
    C: A triangular fluorescent orange sign
    D: A rectangular white sign
  answer: C
  explanation: Slow-moving vehicles, such as farm machinery or horse-drawn carriages,
    must display a triangular fluorescent orange emblem with a red reflective border.
- id: 45
  category: driver_testing
  question: During the Ohio maneuverability test, which of the following actions will
    result in an automatic failure?
  choices:
    A: Stopping to check mirrors
    B: Shifting into reverse more than once
    C: Striking or knocking down a marker
    D: Taking more than 2 minutes to complete the test
  answer: C
  explanation: In the Ohio road skills test, striking or knocking down a marker during
    the maneuverability portion is grounds for immediate failure.
- id: 46
  category: driver_testing
  question: 'Ohio''s financial responsibility law requires drivers to carry a minimum
    amount of insurance for ''bodily injury to or death of one person in any one accident''
    in the amount of:'
  choices:
    A: $15,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Ohio law requires minimum liability coverage of $25,000 for bodily
    injury to or death of one person in any one accident.
- id: 47
  category: driver_testing
  question: In Ohio, is it legal to make a left turn on a red light?
  choices:
    A: No, it is never legal
    B: Yes, but only from a one-way street onto another one-way street
    C: Yes, from any street as long as you stop first
    D: Yes, but only between the hours of midnight and 5:00 AM
  answer: B
  explanation: Ohio law permits a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 48
  category: driver_testing
  question: On a roadway with four or more lanes, if a school bus is stopped with
    its red lights flashing and stop arm extended, which traffic must stop?
  choices:
    A: All traffic in both directions
    B: Only traffic following the bus
    C: Only traffic approaching from the front
    D: No traffic is required to stop if there are four lanes
  answer: B
  explanation: In Ohio, on a road with four or more lanes, only traffic proceeding
    in the same direction as the school bus is required to stop. On roads with fewer
    than four lanes, all traffic must stop.
- id: 49
  category: driver_testing
  question: 'If an Ohio driver refuses to take a chemical test (blood, breath, or
    urine) when requested by law enforcement, their license will be subject to an
    immediate Administrative License Suspension (ALS) for at least:'
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under Ohio's Implied Consent law, a first-time refusal to take a chemical
    test results in an automatic one-year license suspension.
- id: 50
  category: driver_testing
  question: 'According to Ohio law, children must be secured in a child safety seat
    if they are:'
  choices:
    A: Under 4 years old OR weigh less than 40 pounds
    B: Under 6 years old OR weigh less than 60 pounds
    C: Under 2 years old OR weigh less than 20 pounds
    D: Under 5 years old OR weigh less than 50 pounds
  answer: A
  explanation: Ohio law requires children under the age of 4 or weighing less than
    40 pounds to be properly secured in a child safety seat.
- id: 51
  category: driver_testing
  question: In Ohio, children who are under what age and height must use a booster
    seat?
  choices:
    A: Under 6 years old and less than 4 feet tall
    B: Under 8 years old and less than 4 feet 9 inches tall
    C: Under 10 years old and less than 5 feet tall
    D: Under 7 years old and less than 4 feet 6 inches tall
  answer: B
  explanation: Ohio law requires children under 8 years old to use a booster seat
    unless they have reached 4 feet 9 inches in height.
- id: 52
  category: driver_testing
  question: What is the recommended following distance behind another vehicle in Ohio
    under normal driving conditions?
  choices:
    A: One car length
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: C
  explanation: The Ohio Driver Manual recommends a minimum following distance of three
    seconds to allow for safe reaction time.
- id: 53
  category: driver_testing
  question: 'In Ohio, a conviction for littering from a motor vehicle can result in
    a maximum fine of up to:'
  choices:
    A: $100
    B: $500
    C: $1,000
    D: $2,500
  answer: C
  explanation: Littering is a third-degree misdemeanor in Ohio, punishable by a fine
    of up to $1,000 and/or up to six months in jail.
- id: 54
  category: driver_testing
  question: 'When an emergency vehicle with flashing lights and a siren is approaching,
    Ohio law requires you to:'
  choices:
    A: Stop exactly where you are
    B: Speed up to get out of the way
    C: Pull to the right edge of the road and stop
    D: Pull to the left edge of the road and stop
  answer: C
  explanation: Ohio law requires drivers to pull to the right edge of the road or
    curb and stop until the emergency vehicle has passed.
- id: 55
  category: driver_testing
  question: When parking a vehicle parallel to a curb in Ohio, the wheels must be
    no more than how many inches from the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: B
  explanation: Ohio law states that a vehicle must be parked parallel to the curb
    and within 12 inches of the curb.
- id: 56
  category: driver_testing
  question: In Ohio, you must activate your turn signal at least how many feet before
    turning?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: Ohio law requires drivers to signal their intention to turn at least
    100 feet before the turn is made.
- id: 57
  category: driver_responsibility
  question: In Ohio, what is the minimum required insurance coverage for bodily injury
    or death of two or more persons in any one accident?
  choices:
    A: $25,000
    B: $50,000
    C: $75,000
    D: $100,000
  answer: B
  explanation: Ohio's Financial Responsibility law mandates a minimum of $50,000 for
    bodily injury or death of two or more persons in any one accident.
- id: 58
  category: driver_responsibility
  question: If an Ohio driver is involved in a crash that results in injury, death,
    or property damage exceeding $400 and they are uninsured, they must submit a crash
    report to the BMV within how many months?
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 12 months
  answer: C
  explanation: If a driver is uninsured at the time of a crash involving injury, death,
    or damage over $400, a report must be filed with the BMV within six months of
    the accident.
- id: 59
  category: driver_responsibility
  question: As of July 1, 2020, what are the license plate display requirements for
    passenger vehicles in Ohio?
  choices:
    A: One plate must be displayed on the front only
    B: One plate must be displayed on the rear only
    C: Two plates must be displayed, one on the front and one on the rear
    D: Plates are only required for commercial vehicles
  answer: B
  explanation: Effective July 1, 2020, Ohio law changed to require only one license
    plate to be displayed on the rear of passenger vehicles.
- id: 60
  category: driver_responsibility
  question: What is the reinstatement fee for a first-time offense of failing to show
    proof of financial responsibility (insurance) in Ohio?
  choices:
    A: $50
    B: $100
    C: $150
    D: $200
  answer: B
  explanation: For a first offense of failing to maintain or show proof of insurance,
    the Ohio BMV charges a $100 reinstatement fee.
- id: 61
  category: driver_responsibility
  question: If an Ohio driver's license is suspended for a second Financial Responsibility
    (insurance) violation within five years, how long is the suspension period?
  choices:
    A: 30 days
    B: 90 days
    C: One year
    D: Two years
  answer: C
  explanation: A second offense of failing to provide proof of financial responsibility
    within five years results in a one-year suspension of driving privileges.
- id: 62
  category: driver_responsibility
  question: When an Ohio driver is convicted of a third or subsequent Financial Responsibility
    violation, what is the reinstatement fee?
  choices:
    A: $100
    B: $300
    C: $600
    D: $1,000
  answer: C
  explanation: The reinstatement fee for a third or subsequent offense of failing
    to show proof of insurance in Ohio is $600.
- id: 63
  category: driver_responsibility
  question: Following a Financial Responsibility suspension, for how many years must
    an Ohio driver maintain a special 'SR-22' insurance certificate (or other proof
    of future responsibility) with the BMV?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Drivers who have had their license suspended for insurance violations
    must generally maintain proof of future financial responsibility (such as an SR-22)
    for three to five years, typically three years for initial offenses.
- id: 64
  category: driver_responsibility
  question: Under Ohio law, how many points are assessed to a driver's record for
    'Fleeing or eluding a law enforcement officer'?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Fleeing or eluding a law enforcement officer is a serious offense in
    Ohio and carries a 6-point penalty.
- id: 65
  category: driver_responsibility
  question: If you are involved in a collision with an unattended vehicle in Ohio
    and cannot locate the owner, what must you do?
  choices:
    A: Leave the scene immediately to avoid blocking traffic
    B: Wait for at least 4 hours for the owner to return
    C: Leave a note with your name, address, and vehicle registration number
    D: Only report it if the damage appears to be over $1,000
  answer: C
  explanation: Ohio law requires drivers who hit an unattended vehicle to leave their
    name, address, and vehicle registration number in a conspicuous place on the damaged
    vehicle.
- id: 66
  category: driver_responsibility
  question: In Ohio, which of the following non-driving violations can lead to the
    suspension of your driver's license?
  choices:
    A: Failure to pay child support
    B: Failure to register for the draft (if required)
    C: Failure to pay property taxes
    D: Failure to maintain a valid library card
  answer: A
  explanation: Ohio law allows for the suspension of a driver's license for failure
    to pay child support or comply with a child support subpoena.
- id: 67
  category: driver_responsibility
  question: When selling a vehicle in Ohio, who is legally responsible for completing
    the 'Assignment of Ownership' on the back of the title and having it notarized?
  choices:
    A: The buyer
    B: The seller
    C: The BMV clerk
    D: The insurance agent
  answer: B
  explanation: The seller is responsible for completing the assignment of ownership
    on the back of the title and must sign it in the presence of a notary public before
    delivering it to the buyer.
- id: 68
  category: driver_responsibility
  question: 'In Ohio, if you are involved in a crash, you are required by law to share
    all of the following information with the other party EXCEPT:'
  choices:
    A: Your name and address
    B: Your vehicle registration number
    C: Your Social Security Number
    D: The name and address of the vehicle owner (if not you)
  answer: C
  explanation: You must provide your name, address, and vehicle registration, but
    you are not legally required to provide your Social Security Number to the other
    driver.
- id: 69
  category: driver_responsibility
  question: What is the point penalty for 'Racing' on public roads in Ohio?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Street racing is a serious traffic violation in Ohio and results in
    6 points being added to the driver's record.
- id: 70
  category: driver_responsibility
  question: If an Ohio driver is caught operating a vehicle without proof of financial
    responsibility (insurance), what is the reinstatement fee for a first-time offense?
  choices:
    A: $50
    B: $100
    C: $300
    D: $600
  answer: B
  explanation: For a first-time non-compliance (insurance) violation, the driver must
    pay a $100 reinstatement fee and provide proof of insurance (SR-22) for three
    to five years.
- id: 71
  category: driver_responsibility
  question: Under Ohio law, a driver must file a crash report with the BMV if the
    accident resulted in property damage exceeding ______ and the driver was uninsured.
  choices:
    A: $100
    B: $250
    C: $400
    D: $1,000
  answer: C
  explanation: If an accident involves more than $400 in property damage or any personal
    injury/death and the driver is uninsured, a report must be filed with the BMV.
- id: 72
  category: driver_responsibility
  question: If an Ohio driver's license is suspended for a second offense of failing
    to show proof of financial responsibility, how long is the 'impoundment' of their
    license plates and vehicle registration?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 1 year
  answer: D
  explanation: For a second non-compliance offense within five years, the driver faces
    a one-year suspension of license and registration/plates.
- id: 73
  category: driver_responsibility
  question: In Ohio, if a driver is convicted of 'fleeing or eluding' a law enforcement
    officer, how many points are assessed to their driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Fleeing or eluding a police officer is a serious offense in Ohio and
    carries an automatic 6-point assessment.
- id: 74
  category: driver_responsibility
  question: Under Ohio's 'Random Selection Program,' the BMV selects what percentage
    of registered vehicles each week to provide proof of insurance?
  choices:
    A: 1%
    B: 5%
    C: 10%
    D: 25%
  answer: B
  explanation: The Ohio BMV randomly selects 5% of registered vehicles to verify that
    they are maintaining the required financial responsibility (insurance).
- id: 75
  category: driver_responsibility
  question: If an Ohio driver is involved in an accident where they are at fault and
    they do not have insurance, their license will be suspended for at least how long?
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: Until all damages are paid and requirements are met
  answer: D
  explanation: A security suspension is imposed on an uninsured driver at fault in
    an accident until they pay for damages, enter a payment agreement, or are found
    not liable.
- id: 76
  category: driver_responsibility
  question: Which of the following is NOT a valid way to prove financial responsibility
    in Ohio?
  choices:
    A: A valid auto liability insurance policy
    B: A certificate of self-insurance issued by the BMV
    C: A written statement from a parent promising to pay for damages
    D: A $30,000 bond with the state treasurer
  answer: C
  explanation: Personal promises or statements are not legal proof of financial responsibility.
    Valid forms include insurance policies, BMV certificates, or government bonds.
- id: 77
  category: driver_responsibility
  question: In Ohio, how many points are assessed for a speeding violation where the
    driver is going 30 mph over the posted limit?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 0 points
  answer: B
  explanation: In Ohio, exceeding the speed limit by 30 mph or more results in a 4-point
    assessment on the driver's record.
- id: 78
  category: driver_responsibility
  question: If an Ohio driver is convicted of 'Leaving the Scene of an Accident' (Hit
    and Run), how many points are added to their license?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Failure to stop and disclose identity at the scene of a collision (Hit
    and Run) results in 6 points in Ohio.
- id: 79
  category: driver_responsibility
  question: What happens if an Ohio resident fails to appear in court for a traffic
    ticket received in another state that is a member of the Non-Resident Violator
    Compact?
  choices:
    A: Nothing, Ohio only tracks in-state tickets
    B: The driver must pay a $500 fine to the Ohio BMV
    C: The Ohio BMV will suspend the driver's license until the ticket is resolved
    D: The driver will be required to retake the driving test
  answer: C
  explanation: Under the Non-Resident Violator Compact, Ohio will suspend the license
    of a resident who fails to resolve a traffic citation in another member state.
- id: 80
  category: safe_driving_rules
  question: What is the maximum speed limit for vehicles traveling in an alley within
    a municipal corporation in Ohio?
  choices:
    A: 10 mph
    B: 15 mph
    C: 20 mph
    D: 25 mph
  answer: B
  explanation: In Ohio, the statutory speed limit for any alley within a municipal
    corporation is 15 mph.
- id: 81
  category: safe_driving_rules
  question: In Ohio, you are prohibited from parking within how many feet of a fire
    hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 5 feet
  answer: A
  explanation: Ohio law prohibits parking a vehicle within 10 feet of a fire hydrant.
- id: 82
  category: safe_driving_rules
  question: Ohio's 'Move Over' law requires drivers to shift over one lane, if possible,
    when passing which of the following stationary vehicles with flashing lights?
  choices:
    A: Police and fire vehicles only
    B: Ambulances and tow trucks only
    C: Highway maintenance vehicles only
    D: All of the above
  answer: D
  explanation: Ohio's Move Over law applies to all stationary vehicles with flashing
    lights, including law enforcement, emergency responders, tow trucks, and highway
    maintenance vehicles.
- id: 83
  category: safe_driving_rules
  question: What is the speed limit on state routes within municipal corporations
    outside business districts, unless otherwise posted?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 50 mph
  answer: B
  explanation: The speed limit for state routes within municipal corporations outside
    business districts is 35 mph unless a different limit is posted.
- id: 84
  category: safe_driving_rules
  question: In Ohio, you may not park your vehicle within how many feet of a crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: B
  explanation: Ohio law states that you cannot park a vehicle within 20 feet of a
    crosswalk at an intersection.
- id: 85
  category: safe_driving_rules
  question: When using hand signals to indicate a turn, which position represents
    a left turn?
  choices:
    A: Arm extended straight out the window
    B: Arm bent upward at a 90-degree angle
    C: Arm bent downward at a 90-degree angle
    D: Arm waving in a circular motion
  answer: A
  explanation: To signal a left turn using hand signals, the driver should extend
    their left arm horizontally out of the window.
- id: 86
  category: safe_driving_rules
  question: What is the recommended following distance to maintain behind the vehicle
    in front of you under normal weather conditions in Ohio?
  choices:
    A: One car length
    B: Two seconds
    C: Three seconds
    D: Five seconds
  answer: C
  explanation: The Ohio driver's manual recommends a following distance of at least
    three seconds to allow for adequate reaction time.
- id: 87
  category: safe_driving_rules
  question: When two vehicles arrive at an intersection without traffic control signs
    or signals at the same time, who has the right-of-way?
  choices:
    A: The vehicle on the left
    B: The vehicle on the right
    C: The vehicle traveling at a higher speed
    D: The vehicle that is larger
  answer: B
  explanation: According to Ohio right-of-way rules, when two vehicles reach an intersection
    at the same time, the driver of the vehicle on the left must yield to the vehicle
    on the right.
- id: 88
  category: safe_driving_rules
  question: In Ohio, you must dim your high-beam headlights when you are within how
    many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Ohio law requires drivers to dim their high beams when an oncoming
    vehicle is within 500 feet.
- id: 89
  category: safe_driving_rules
  question: In Ohio, it is illegal to park within how many feet of a stop sign, flashing
    beacon, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Drivers in Ohio are prohibited from parking within 30 feet of any flashing
    beacon, stop sign, or traffic control signal located at the side of a roadway.
- id: 90
  category: safe_driving_rules
  question: Under Ohio's 'Move Over' law, what must a driver do when approaching a
    stationary emergency vehicle with flashing lights on a road with at least two
    lanes of traffic in the same direction?
  choices:
    A: Stop immediately in the current lane
    B: Maintain speed but honk to alert the officer
    C: Move into a lane that is not adjacent to the vehicle if safe to do so
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Ohio law requires drivers to move over to an adjacent lane when approaching
    stationary emergency, roadside assistance, or waste collection vehicles with flashing
    lights. If moving over is unsafe, the driver must slow down.
- id: 91
  category: safe_driving_rules
  question: According to Ohio law, you must not park within how many feet of a fire
    hydrant?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Ohio Revised Code prohibits parking a vehicle within 10 feet of a fire
    hydrant.
- id: 92
  category: safe_driving_rules
  question: 'Ohio law requires headlights to be turned on whenever a driver is using
    their:'
  choices:
    A: Windshield wipers
    B: Hazard lights
    C: Turn signals
    D: Air conditioning
  answer: A
  explanation: Ohio law requires that headlights be displayed anytime the vehicle's
    windshield wipers are in use due to precipitation or unfavorable atmospheric conditions.
- id: 93
  category: safe_driving_rules
  question: To maintain a safe following distance in Ohio under normal driving conditions,
    what rule is recommended?
  choices:
    A: One-car-length rule
    B: Two-second rule
    C: Three-second rule
    D: Five-second rule
  answer: C
  explanation: The Ohio Driver Manual recommends the 'three-second rule' to maintain
    a safe following distance behind the vehicle ahead of you.
- id: 94
  category: safe_driving_rules
  question: 'In Ohio, you are allowed to pass on the right of another vehicle only
    if that vehicle is making a left turn and:'
  choices:
    A: You drive onto the shoulder to do so
    B: The pavement is wide enough for two or more lines of vehicles moving in the
      same direction
    C: You are in a residential neighborhood
    D: The other driver waves you through
  answer: B
  explanation: Passing on the right is permitted in Ohio when the vehicle being overtaken
    is making a left turn, provided there is sufficient pavement width for two or
    more lines of traffic and the pass is not made by driving off the roadway.
- id: 95
  category: safe_driving_rules
  question: Which hand signal indicates that an Ohio driver intends to stop or decrease
    speed?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward
    D: Right arm extended straight out
  answer: C
  explanation: To signal a stop or a decrease in speed using hand signals, the driver
    should extend their left arm downward with the palm facing backward.
- id: 96
  category: safe_driving_rules
  question: Under Ohio law, what is the fine for a driver who fails to wear a seat
    belt?
  choices:
    A: The fine is $30
    B: The fine is $100
    C: The fine is $250
    D: There is no fine, only a warning
  answer: A
  explanation: In Ohio, the fine for a driver failing to wear a seat belt is $30.
    For a front-seat passenger, the fine is $20.
- id: 97
  category: safe_driving_rules
  question: 'When making a left turn from a two-way street onto another two-way street
    in Ohio, you should yield to oncoming traffic and then turn into:'
  choices:
    A: The right-hand lane
    B: The lane closest to the center line
    C: The shoulder of the road
    D: Any lane that is empty
  answer: B
  explanation: When turning left in Ohio, you must yield the right-of-way to any vehicle
    approaching from the opposite direction and complete the turn into the lane closest
    to the center line.
- id: 98
  category: defensive_driving
  question: To maintain a safe 'space cushion' and scan for hazards, Ohio drivers
    should look how far ahead of their vehicle?
  choices:
    A: 5 to 8 seconds
    B: 10 to 12 seconds
    C: 20 to 30 seconds
    D: The distance of one city block
  answer: B
  explanation: The Ohio driver's manual suggests scanning the road 10 to 12 seconds
    ahead to anticipate potential problems.
- id: 99
  category: defensive_driving
  question: Under Ohio law, when are drivers required to have their headlights on
    during adverse weather?
  choices:
    A: Only during heavy downpours
    B: Whenever the windshield wipers are in use
    C: Only between sunset and sunrise
    D: When visibility is less than 1,000 feet
  answer: B
  explanation: Ohio Revised Code requires headlights to be on whenever windshield
    wipers are in use due to precipitation.
- id: 100
  category: defensive_driving
  question: At what speed can hydroplaning (tires losing contact with the road surface)
    begin to occur in heavy rain?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: In Ohio's driver education materials, it is noted that hydroplaning
    can start at speeds as low as 35 mph, and tires may lose all contact at 55 mph.
- id: 101
  category: defensive_driving
  question: When following another vehicle at night in Ohio, at what distance must
    you dim your high-beam headlights?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Ohio law requires drivers to switch to low beams when following another
    vehicle within 300 feet.
- id: 102
  category: defensive_driving
  question: During Ohio winters, why are bridges and overpasses considered especially
    dangerous?
  choices:
    A: They are usually narrower than the rest of the road
    B: They freeze before other road surfaces
    C: They are more likely to have potholes
    D: Salt does not work on elevated surfaces
  answer: B
  explanation: Bridges and overpasses freeze before the rest of the roadway because
    cold air circulates both above and below the structure.
- id: 103
  category: defensive_driving
  question: When driving in heavy fog in Ohio, which light setting should you use
    to ensure the best visibility?
  choices:
    A: High-beam headlights
    B: Low-beam headlights
    C: Parking lights only
    D: Hazard flashers
  answer: B
  explanation: Low beams should be used in fog because high beams reflect off the
    moisture in the air, causing glare and reducing visibility.
- id: 104
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery road in Ohio, what is the
    correct defensive driving response?
  choices:
    A: Brake hard to stop the movement
    B: Turn the steering wheel in the opposite direction of the skid
    C: Turn the steering wheel in the direction the rear of the vehicle is sliding
    D: Shift the car into neutral immediately
  answer: C
  explanation: To regain control during a skid, take your foot off the accelerator
    and steer in the direction the rear of the vehicle is sliding.
- id: 105
  category: defensive_driving
  question: When preparing to change lanes on an Ohio highway, how should you check
    your 'blind spots'?
  choices:
    A: Check the inside rearview mirror only
    B: Check both side mirrors and the rearview mirror
    C: Turn your head and look over your shoulder in the direction you plan to move
    D: Slow down so other drivers move out of your blind spot
  answer: C
  explanation: Mirrors do not show everything; a physical shoulder check is required
    to see vehicles in the blind spots before changing lanes.
- id: 106
  category: defensive_driving
  question: 'In Ohio, if you are driving on a road with four or more lanes and a school
    bus is stopped with red lights flashing on the opposite side of the road, you
    must:'
  choices:
    A: Stop at least 10 feet from the bus
    B: Stop only if there is no median
    C: Continue driving with caution
    D: Slow down to 10 mph
  answer: C
  explanation: On a road with four or more lanes, only traffic moving in the same
    direction as the bus is required to stop in Ohio. Traffic approaching from the
    opposite direction may proceed with caution.
- id: 107
  category: defensive_driving
  question: When stopped at an intersection in Ohio, what is the recommended scanning
    sequence before proceeding?
  choices:
    A: Look left, then right
    B: Look right, then left, then right again
    C: Look left, then right, then left again
    D: Look straight ahead only
  answer: C
  explanation: The Ohio manual recommends looking left, then right, then left again
    because the first danger comes from the left.
- id: 108
  category: defensive_driving
  question: When it first starts raining in Ohio, why are the roads most slippery?
  choices:
    A: The water cools the asphalt too quickly
    B: Rain mixes with oil and grease on the road surface
    C: Tires are still warm from dry driving
    D: Hydroplaning only happens in the first 5 minutes of rain
  answer: B
  explanation: Roads are most slippery during the first few minutes of rain because
    the water mixes with oil, dirt, and grease that have built up on the pavement.
- id: 109
  category: defensive_driving
  question: According to the Digest of Ohio Motor Vehicle Laws, what is the recommended
    following distance behind the vehicle in front of you to allow for sufficient
    stopping time?
  choices:
    A: One car length for every 10 mph
    B: A minimum of two seconds
    C: A minimum of three seconds
    D: At least 50 feet at all times
  answer: C
  explanation: Ohio law and the driver's manual recommend a 'three-second rule' to
    maintain a safe following distance under normal driving conditions.
- id: 110
  category: defensive_driving
  question: In Ohio, when are drivers required by law to have their headlights turned
    on?
  choices:
    A: Only between sunset and sunrise
    B: Whenever the windshield wipers are in use
    C: Only when visibility is less than 1,000 feet
    D: Whenever driving on a multi-lane highway
  answer: B
  explanation: Ohio Revised Code 4513.03 requires headlights to be on between sunset
    and sunrise, during any period of rain, snow, fog, or other unfavorable atmospheric
    conditions, and whenever windshield wipers are in use.
- id: 111
  category: defensive_driving
  question: To scan the road effectively while driving in Ohio, how far ahead should
    a driver look to identify potential hazards?
  choices:
    A: 5 to 8 seconds
    B: 10 to 12 seconds
    C: 20 to 30 seconds
    D: Exactly one city block
  answer: B
  explanation: Ohio defensive driving guidelines suggest looking 10 to 12 seconds
    ahead to allow time to react to changing traffic patterns or hazards.
- id: 112
  category: defensive_driving
  question: If your vehicle begins to hydroplane on a wet Ohio roadway, what is the
    safest defensive driving action to take?
  choices:
    A: Brake hard to regain traction
    B: Turn the steering wheel sharply in the opposite direction of the skid
    C: Take your foot off the accelerator and let the car slow down
    D: Shift the car into neutral immediately
  answer: C
  explanation: If hydroplaning occurs, the Ohio manual advises drivers to ease off
    the gas and avoid braking to allow the tires to regain contact with the road surface.
- id: 113
  category: defensive_driving
  question: During Ohio winters, which of the following road surfaces is likely to
    freeze first and become slippery before others?
  choices:
    A: Intersections
    B: Gravel roads
    C: Bridges and overpasses
    D: Asphalt highways
  answer: C
  explanation: Bridges and overpasses freeze before other road surfaces because cold
    air circulates both above and below the structure.
- id: 114
  category: defensive_driving
  question: 'Before changing lanes on an Ohio multi-lane highway, a defensive driver
    should check their ''blind spots'' by:'
  choices:
    A: Looking only in the rearview mirror
    B: Looking only in the side mirrors
    C: Turning the head to look over the shoulder in the direction of the move
    D: Checking the GPS navigation screen
  answer: C
  explanation: Mirrors do not show everything; Ohio guidelines state you must turn
    your head to check areas not visible in mirrors before changing lanes.
- id: 115
  category: defensive_driving
  question: Total stopping distance consists of perception distance, reaction distance,
    and braking distance. At 50 mph, approximately how many feet will a vehicle travel
    in Ohio before coming to a complete stop?
  choices:
    A: 50 to 75 feet
    B: 100 to 125 feet
    C: 150 to 200 feet
    D: Over 400 feet
  answer: C
  explanation: At 50 mph, the total stopping distance is typically between 158 to
    200 feet, depending on road conditions and driver reaction time.
- id: 116
  category: defensive_driving
  question: If you are being tailgated while driving on an Ohio road, what is the
    best defensive driving strategy?
  choices:
    A: Tap your brakes repeatedly to scare the driver
    B: Slow down gradually and encourage the driver to pass
    C: Speed up to increase the gap
    D: Stop your vehicle in the middle of the lane
  answer: B
  explanation: The safest way to handle a tailgater is to slow down and allow more
    room in front of you, or move to the right lane to let them pass.
- id: 117
  category: alcohol_drugs_health
  question: Under Ohio's 'Implied Consent' law, what is the consequence for a first-time
    refusal to submit to a chemical test of your blood, breath, or urine?
  choices:
    A: A 90-day license suspension
    B: A 1-year automatic license suspension
    C: A $1,000 fine and no suspension
    D: A 6-month license suspension
  answer: B
  explanation: According to the Ohio Digest of Motor Vehicle Laws, under the Implied
    Consent law, if you are arrested for OVI and refuse to take the chemical test,
    the Registrar of Motor Vehicles will suspend your license for one year for a first
    offense.
- id: 118
  category: alcohol_drugs_health
  question: In Ohio, what is the minimum mandatory jail time for a first-offense OVI
    conviction with a BAC under 0.17%?
  choices:
    A: 24 consecutive hours
    B: 48 consecutive hours
    C: 72 consecutive hours
    D: 10 days
  answer: C
  explanation: A first-offense OVI conviction in Ohio carries a mandatory minimum
    of 72 consecutive hours (3 days) in jail, which may sometimes be served in a certified
    driver intervention program.
- id: 119
  category: alcohol_drugs_health
  question: Ohio law defines a 'High BAC' (prohibited concentration) for drivers 21
    and older as a concentration of alcohol in the breath at or above what level?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.17%
  answer: D
  explanation: In Ohio, a BAC of 0.17% or higher is considered 'high tier' or 'aggravated'
    OVI, which carries more severe mandatory penalties than a standard OVI.
- id: 120
  category: alcohol_drugs_health
  question: What is the current reinstatement fee for an Ohio driver's license that
    was suspended due to an OVI conviction?
  choices:
    A: $100
    B: $250
    C: $475
    D: $600
  answer: C
  explanation: As of current Ohio BMV regulations, the reinstatement fee for an Administrative
    License Suspension (ALS) or OVI-related suspension is $475.
- id: 121
  category: alcohol_drugs_health
  question: In Ohio, a driver can be charged with 'Having Physical Control of a Vehicle
    While Under the Influence' even if the vehicle is not moving. What does this charge
    typically involve?
  choices:
    A: Being in the driver's seat with possession of the ignition key while impaired
    B: Standing next to a car while holding a drink
    C: Sitting in the passenger seat while the engine is running
    D: Walking toward your car while intoxicated
  answer: A
  explanation: Ohio Revised Code 4511.194 defines 'Physical Control' as being in the
    driver's position of a vehicle and having possession of the vehicle's ignition
    key or other ignition device while under the influence.
- id: 122
  category: alcohol_drugs_health
  question: For a second OVI offense within 10 years in Ohio, what is the mandatory
    minimum length of time the offender's vehicle must be immobilized and the plates
    impounded?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 180 days
  answer: C
  explanation: For a second OVI offense within a 10-year period, Ohio law requires
    a mandatory 90-day immobilization of the vehicle and impoundment of the license
    plates.
- id: 123
  category: alcohol_drugs_health
  question: If an Ohio driver under age 21 is convicted of Operating a Vehicle after
    Underage Consumption (OVUAC), what is the maximum length of the court-ordered
    license suspension?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: 5 years
  answer: C
  explanation: For an OVUAC conviction (BAC between 0.02% and 0.08% for those under
    21), the court-ordered suspension can range from 60 days up to 2 years.
- id: 124
  category: alcohol_drugs_health
  question: In Ohio, what color are the 'Restricted Plates' (often called 'party plates')
    that may be required for OVI offenders who are granted limited driving privileges?
  choices:
    A: Red text on a white background
    B: Yellow with red letters/numbers
    C: Blue with white letters/numbers
    D: Black with yellow letters/numbers
  answer: B
  explanation: Ohio law may require OVI offenders to use restricted license plates,
    which are yellow with red lettering, as a condition of receiving limited driving
    privileges.
- id: 125
  category: alcohol_drugs_health
  question: Which of the following is the only way to 'sober up' and lower your BAC
    before driving?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Giving your body time to process the alcohol
    D: Exercising vigorously
  answer: C
  explanation: The Ohio Driver's Manual states that time is the only factor that will
    lower a person's BAC. Coffee, showers, and exercise do not speed up the oxidation
    of alcohol by the liver.
- id: 126
  category: alcohol_drugs_health
  question: In Ohio, what is the legal limit for marijuana (THC) concentration in
    a driver's whole blood to avoid an OVI charge?
  choices:
    A: 1 nanogram per milliliter
    B: 2 nanograms per milliliter
    C: 5 nanograms per milliliter
    D: 10 nanograms per milliliter
  answer: B
  explanation: Under Ohio law (ORC 4511.19), the legal limit for marijuana in whole
    blood is 2 nanograms of state-prohibited concentration per milliliter.
- id: 127
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and a doctor did not specifically
    tell you not to drive, can you still be arrested for OVI in Ohio?
  choices:
    A: No, as long as you have a valid prescription
    B: No, unless you also consumed alcohol
    C: Yes, if the drug impairs your ability to drive safely
    D: Yes, but only if it is a Schedule I narcotic
  answer: C
  explanation: In Ohio, you can be convicted of OVI for driving under the influence
    of any drug of abuse, including prescription or over-the-counter medications,
    if they impair your driving ability.
- id: 128
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' when referring to alcohol and other drugs?
  choices:
    A: The drugs cancel out the effects of the alcohol
    B: The alcohol speeds up the metabolism of the drug
    C: The combined effect is greater than the sum of the individual effects
    D: There is no measurable change in impairment
  answer: C
  explanation: The synergistic effect occurs when alcohol and drugs are taken together,
    causing much greater impairment than either substance would cause on its own.
- id: 129
  category: alcohol_drugs_health
  question: How many OVI convictions within a 10-year period result in an Ohio driver
    being charged with a fourth-degree felony?
  choices:
    A: Two
    B: Three
    C: Four
    D: Five
  answer: C
  explanation: In Ohio, a fourth OVI conviction within a 10-year period is classified
    as a fourth-degree felony.
- id: 130
  category: alcohol_drugs_health
  question: When does an Administrative License Suspension (ALS) take effect if you
    fail or refuse a chemical test in Ohio?
  choices:
    A: Immediately upon refusal or failure
    B: After a 30-day grace period
    C: Only after you are convicted in court
    D: 10 days after the arrest
  answer: A
  explanation: An Administrative License Suspension (ALS) is imposed by the officer
    on behalf of the BMV immediately at the time of the test refusal or failure.
- id: 131
  category: alcohol_drugs_health
  question: Which of the following medical conditions must be reported to the Ohio
    BMV when applying for or renewing a license?
  choices:
    A: Any condition that causes episodic impairment of consciousness or muscular
      control
    B: Only permanent blindness in one eye
    C: Seasonal allergies
    D: Mild asthma
  answer: A
  explanation: Ohio law requires applicants to disclose any medical condition, such
    as epilepsy or diabetes, that may result in episodic impairment of consciousness
    or loss of muscular control.
- id: 132
  category: alcohol_drugs_health
  question: Under Ohio's 'Implied Consent' law, what are you agreeing to by operating
    a vehicle on Ohio roads?
  choices:
    A: To keep your vehicle's registration in the glove box at all times
    B: To yield the right-of-way to all emergency vehicles
    C: To be tested for blood alcohol concentration (BAC) or drug content if arrested
      for OVI
    D: To maintain a clean driving record for at least five years
  answer: C
  explanation: Ohio's Implied Consent law means that by driving in the state, you
    have given consent to a chemical test of your blood, breath, or urine if a law
    enforcement officer has reasonable grounds to believe you are driving under the
    influence.
- id: 133
  category: alcohol_drugs_health
  question: In Ohio, a 'High BAC' OVI charge, which carries stiffer penalties, is
    triggered if a driver's blood alcohol concentration is at or above what level?
  choices:
    A: 0.10%
    B: 0.15%
    C: 0.17%
    D: 0.20%
  answer: C
  explanation: Ohio law defines a 'high tier' or 'high test' OVI as having a BAC of
    0.17% or higher. This level results in doubled mandatory minimum jail time (6
    days instead of 3).
- id: 134
  category: alcohol_drugs_health
  question: If an Ohio driver refuses to submit to a chemical test upon a first-time
    arrest for OVI, their license will be subject to an Administrative License Suspension
    (ALS) for how long?
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Under Ohio's Implied Consent law, a first-time refusal to take a chemical
    test results in an automatic one-year Administrative License Suspension.
- id: 135
  category: alcohol_drugs_health
  question: 'In Ohio, you can be charged with ''Physical Control'' if you are found
    under the influence of alcohol while:'
  choices:
    A: Walking near your vehicle with the keys in your pocket
    B: Sitting in the driver's seat of a stationary vehicle with possession of the
      ignition key
    C: Riding as a passenger in a vehicle driven by another intoxicated person
    D: Repairing a vehicle on your own private property
  answer: B
  explanation: The 'Physical Control' law in Ohio applies to being in the driver's
    seat of a vehicle with the keys, even if the vehicle is not moving or the engine
    is not running.
- id: 136
  category: alcohol_drugs_health
  question: For a first-time 'Operating a Vehicle after Underage Consumption' (OVUAC)
    conviction, an Ohio court must suspend the driver's license for at least how long?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: A first OVUAC conviction (for drivers under 21 with a BAC between 0.02%
    and 0.08%) carries a mandatory license suspension ranging from 90 days to two
    years.
- id: 137
  category: alcohol_drugs_health
  question: If an Ohio driver is convicted of a second OVI within a 10-year period,
    what is the mandatory minimum jail time?
  choices:
    A: 3 days
    B: 10 days
    C: 30 days
    D: 60 days
  answer: B
  explanation: A second OVI conviction within 10 years in Ohio requires a mandatory
    minimum of 10 consecutive days in jail (or 5 days jail plus 18 days of house arrest
    with electronic monitoring).
- id: 138
  category: alcohol_drugs_health
  question: Which of the following is true regarding prescription drugs and driving
    in Ohio?
  choices:
    A: You cannot be charged with OVI if the drug was legally prescribed by a doctor
    B: Prescription drugs only affect driving if mixed with alcohol
    C: You can be charged with OVI if a prescription drug impairs your ability to
      drive safely
    D: Prescription drugs are not checked during a chemical test
  answer: C
  explanation: In Ohio, OVI laws apply to any drug of abuse, including prescription
    and over-the-counter medications, if they impair your driving ability.
- id: 139
  category: alcohol_drugs_health
  question: Under Ohio's Open Container law, it is illegal to possess an open container
    of alcohol in which of the following locations?
  choices:
    A: The trunk of a car
    B: The passenger area of any motor vehicle on a public highway
    C: The living quarters of a motor home
    D: A locked toolbox in the bed of a pickup truck
  answer: B
  explanation: Ohio law prohibits having an open container of alcohol in the passenger
    area of a motor vehicle while on a public highway or any public or private property
    used by the public for parking.
- id: 140
  category: alcohol_drugs_health
  question: In Ohio, law enforcement may use which of the following to determine a
    driver's alcohol or drug concentration?
  choices:
    A: Breath and blood only
    B: Breath and urine only
    C: Blood and urine only
    D: Blood, breath, and urine
  answer: D
  explanation: Ohio law permits the testing of blood, breath, or urine to determine
    the concentration of alcohol or drugs in a driver's system.
- id: 141
  category: alcohol_drugs_health
  question: 'Under ''Annie''s Law'' in Ohio, first-time OVI offenders may be eligible
    to reduce their license suspension by half if they agree to:'
  choices:
    A: Perform 100 hours of community service
    B: Install an ignition interlock device (IID) on their vehicle
    C: Forfeit their vehicle to the state
    D: Attend a high school to give safety lectures
  answer: B
  explanation: Annie's Law allows first-time OVI offenders to request unlimited driving
    privileges if they install an ignition interlock device, which can also reduce
    the suspension period.
- id: 142
  category: alcohol_drugs_health
  question: What is the 'synergistic effect' as it relates to driving in Ohio?
  choices:
    A: The effect of alcohol wearing off over time
    B: The combined effect of alcohol and drugs being greater than each alone
    C: The speed at which the liver processes one standard drink
    D: The psychological urge to drive faster after consuming caffeine
  answer: B
  explanation: The synergistic effect occurs when alcohol and drugs are taken together,
    resulting in much higher levels of impairment than either substance would cause
    on its own.
- id: 143
  category: alcohol_drugs_health
  question: In Ohio, how does the body primarily get rid of alcohol?
  choices:
    A: Through exercise and perspiration
    B: By drinking large amounts of coffee
    C: Through the passage of time as the liver processes it
    D: By taking a cold shower to stimulate the nervous system
  answer: C
  explanation: Time is the only way to remove alcohol from the system. The liver processes
    alcohol at a steady rate, and coffee, showers, or exercise do not speed up this
    process.
- id: 144
  category: alcohol_drugs_health
  question: 'In Ohio, a third OVI conviction within 10 years is classified as a misdemeanor
    of the first degree and may result in:'
  choices:
    A: A mandatory 10-year license revocation
    B: Criminal forfeiture of the vehicle used in the offense
    C: A permanent ban from ever owning a vehicle
    D: Mandatory enrollment in the military
  answer: B
  explanation: For a third OVI conviction within 10 years in Ohio, the court may order
    the criminal forfeiture of the vehicle used in the offense if it is registered
    in the offender's name.
- id: 145
  category: penalties_and_points
  question: If an Ohio driver is convicted of exceeding the speed limit by 30 mph
    or more, how many points will be added to their driving record?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: No points, only a fine
  answer: B
  explanation: In Ohio, exceeding the speed limit by 30 mph or more results in 4 points.
    If the violation is between 6-29 mph over (in a zone less than 55 mph) or 11-29
    mph over (in a zone 55 mph or higher), it results in 2 points.
- id: 146
  category: penalties_and_points
  question: Under Ohio law, what is the minimum jail time for a first-offense OVI
    (Operating a Vehicle Impaired) conviction?
  choices:
    A: 24 consecutive hours
    B: 48 consecutive hours
    C: 72 consecutive hours
    D: 7 consecutive days
  answer: C
  explanation: A first OVI conviction in Ohio carries a mandatory minimum of 72 consecutive
    hours in jail, though a court may allow the driver to attend a certified drivers’
    intervention program instead.
- id: 147
  category: penalties_and_points
  question: How many points are assessed for 'Operating a motor vehicle while the
    license is under suspension' in the state of Ohio?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Driving while your license is suspended is considered a serious violation
    in Ohio and results in 6 points being added to your record.
- id: 148
  category: penalties_and_points
  question: In Ohio, if you are convicted of 'Willful or wanton disregard of the safety
    of persons or property' (Reckless Driving), how many points are assessed?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 0 points, it is a fine only
  answer: B
  explanation: Reckless driving, defined as willful or wanton disregard for safety,
    carries a 4-point penalty on an Ohio driving record.
- id: 149
  category: penalties_and_points
  question: Under Ohio's 'Implied Consent' law, what is the immediate consequence
    of refusing to take a chemical test when requested by a law enforcement officer?
  choices:
    A: A $1,000 fine only
    B: Immediate seizure of the driver license and an Administrative License Suspension
      (ALS)
    C: A mandatory 48-hour jail stay
    D: Nothing, as long as it is your first time being pulled over
  answer: B
  explanation: By driving on Ohio roads, you give 'implied consent' to chemical testing.
    Refusal results in the officer immediately seizing your license and an Administrative
    License Suspension taking effect.
- id: 150
  category: penalties_and_points
  question: When an Ohio driver's license is suspended under the 12-point rule, how
    long is the mandatory suspension period?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Accumulating 12 points within a two-year period results in a mandatory
    six-month suspension of driving privileges in Ohio.
- id: 151
  category: penalties_and_points
  question: To reinstate a license after a 12-point suspension in Ohio, which of the
    following is NOT required?
  choices:
    A: Completion of a remedial driving course
    B: Payment of a reinstatement fee
    C: Retaking the driver's license examination (road and knowledge)
    D: Waiting a minimum of two years from the date of suspension
  answer: D
  explanation: The suspension is 6 months, not 2 years. To reinstate, the driver must
    complete a remedial course, pay a fee, and retake the driver's exam.
- id: 152
  category: penalties_and_points
  question: According to Ohio law, children must use a child safety seat if they are
    under what age OR weigh less than what amount?
  choices:
    A: Under 2 years old or less than 20 pounds
    B: Under 4 years old or less than 40 pounds
    C: Under 6 years old or less than 60 pounds
    D: Under 8 years old or less than 80 pounds
  answer: B
  explanation: Ohio law requires children under the age of 4 or weighing less than
    40 pounds to be properly restrained in a child safety seat.
- id: 153
  category: penalties_and_points
  question: In Ohio, children who are at least 4 years old but less than 8 years old
    must use a booster seat unless they have reached what height?
  choices:
    A: 4 feet 2 inches
    B: 4 feet 6 inches
    C: 4 feet 9 inches
    D: 5 feet
  answer: C
  explanation: Ohio law requires children between ages 4 and 8 to use a booster seat
    unless they are at least 4 feet 9 inches tall.
- id: 154
  category: penalties_and_points
  question: In Ohio, how many points are assessed for 'Failure to stop and disclose
    identity at the scene of a collision' (Hit and Run)?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 10 points
  answer: C
  explanation: Leaving the scene of an accident (Hit and Run) is a 6-point violation
    in the state of Ohio.
- id: 155
  category: penalties_and_points
  question: Under Ohio law, a conviction for 'Drag Racing' results in how many points
    on a driver's license?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Drag racing is considered a serious traffic violation in Ohio and carries
    a 6-point penalty on the driver's license.
- id: 156
  category: penalties_and_points
  question: Under Ohio's Implied Consent Law, if you refuse to take a chemical test
    when requested by an officer, your license will be suspended for at least how
    long for a first offense?
  choices:
    A: 90 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: A first-time refusal to submit to a chemical test in Ohio results in
    an automatic one-year Administrative License Suspension (ALS).
- id: 157
  category: penalties_and_points
  question: 'In Ohio, a first-offense OVI conviction with a Blood Alcohol Concentration
    (BAC) of 0.17% or higher (High Test) carries a mandatory minimum jail term of:'
  choices:
    A: 24 hours
    B: 3 days
    C: 6 days
    D: 10 days
  answer: C
  explanation: For a 'High Test' OVI (BAC of 0.17% or higher), the mandatory minimum
    jail sentence is 6 days, which is double the 3-day minimum for a standard OVI.
- id: 158
  category: penalties_and_points
  question: 'If an Ohio driver under the age of 18 is convicted of a second moving
    violation, their license will be suspended for:'
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 6 months
  answer: C
  explanation: Ohio law mandates a 90-day license suspension for any probationary
    license holder (under 18) who is convicted of two moving violations.
- id: 159
  category: penalties_and_points
  question: Operating a motor vehicle while your Ohio license is under suspension
    is a violation that carries how many points?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: Driving under suspension is a serious offense in Ohio and results in
    6 points being added to the driver's record.
- id: 160
  category: penalties_and_points
  question: In Ohio, what is the point penalty for 'Fleeing or Eluding' a law enforcement
    officer?
  choices:
    A: 2 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: Fleeing or eluding a police officer is a 6-point violation in the state
    of Ohio.
- id: 161
  category: penalties_and_points
  question: What is the maximum fine for a first-time violation of Ohio's child restraint
    law?
  choices:
    A: $25
    B: $50
    C: $100
    D: $250
  answer: C
  explanation: A first-time violation of the child restraint law in Ohio can result
    in a fine of up to $100.
- id: 162
  category: penalties_and_points
  question: For drivers of commercial motor vehicles in Ohio, what is the maximum
    legal BAC limit before they are considered to be driving under the influence?
  choices:
    A: 0.02%
    B: 0.04%
    C: 0.08%
    D: 0.10%
  answer: B
  explanation: In Ohio, the legal BAC limit for commercial drivers is 0.04%, which
    is stricter than the 0.08% limit for non-commercial adult drivers.
- id: 163
  category: sharing_the_road
  question: Ohio law requires motorists to maintain a minimum distance of how many
    feet when passing a bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Ohio Revised Code requires that a motor vehicle operator maintain a
    safe distance of not less than three feet when overtaking and passing a bicycle.
- id: 164
  category: sharing_the_road
  question: Under Ohio's 'Move Over Law,' what must a driver do when approaching a
    stationary emergency vehicle with flashing lights on a multi-lane highway?
  choices:
    A: Stop immediately in the current lane
    B: Maintain speed but honk the horn
    C: Move to a lane that is not adjacent to the vehicle, if safe to do so
    D: Speed up to clear the area quickly
  answer: C
  explanation: Ohio's Move Over Law requires drivers to move over one lane for all
    stationary vehicles with flashing lights. If moving over is not possible or unsafe,
    the driver must slow down and proceed with caution.
- id: 165
  category: sharing_the_road
  question: What is the maximum fine for a first-time conviction of failing to stop
    for a school bus in Ohio?
  choices:
    A: $150
    B: $250
    C: $500
    D: $1,000
  answer: C
  explanation: Drivers in Ohio who fail to stop for a school bus may be fined up to
    $500 and may have their driver license suspended for up to one year.
- id: 166
  category: sharing_the_road
  question: 'When following a large truck, if you cannot see the truck driver''s face
    in their side-view mirrors, you are:'
  choices:
    A: In the truck's 'No-Zone' (blind spot)
    B: In a safe following position
    C: Required to turn on your high beams
    D: Close enough to draft and save fuel
  answer: A
  explanation: If you cannot see the driver's face in their side mirrors, they cannot
    see you. You are in one of the truck's 'No-Zones' or blind spots, which increases
    the risk of a collision.
- id: 167
  category: sharing_the_road
  question: 'When a pedestrian is crossing a street guided by a dog or carrying a
    white cane, Ohio law requires drivers to:'
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Drive around them if there is enough room
    D: Wait for them to wave you through
  answer: B
  explanation: Ohio law mandates that drivers must yield the right-of-way to every
    blind pedestrian guided by a dog or carrying a white cane.
- id: 168
  category: sharing_the_road
  question: 'When sharing the road with a motorcycle, an Ohio driver should:'
  choices:
    A: Share the lane with the motorcycle if it is wide enough
    B: Flash high beams to alert the motorcyclist
    C: Allow the motorcycle the full width of the lane
    D: Follow closer than they would a car
  answer: C
  explanation: Motorcycles are entitled to the full width of a traffic lane. Drivers
    should never attempt to share a lane with a motorcycle.
- id: 169
  category: sharing_the_road
  question: In Ohio, which of the following vehicles are NOT covered under the 'Move
    Over Law'?
  choices:
    A: Police and Fire vehicles
    B: Tow trucks and Road maintenance vehicles
    C: Public utility service vehicles
    D: Standard passenger cars parked on the shoulder with no lights
  answer: D
  explanation: The Move Over Law specifically applies to stationary emergency vehicles,
    tow trucks, and maintenance/utility vehicles that are displaying flashing or rotating
    lights.
- id: 170
  category: sharing_the_road
  question: 'When a funeral procession is in progress, Ohio law states that other
    drivers:'
  choices:
    A: May join the procession to get through traffic
    B: Must yield the right-of-way to the procession at intersections
    C: Should pass the procession on the right
    D: Are not required to yield unless an officer is present
  answer: B
  explanation: In Ohio, funeral processions have the right-of-way at intersections.
    Drivers must yield to the vehicles in the procession, which are usually identified
    by headlights and purple/white flags.
- id: 171
  category: sharing_the_road
  question: 'If you are turning right at an intersection and a bicyclist is positioned
    to your right, you should:'
  choices:
    A: Speed up to turn before the bicyclist reaches the intersection
    B: Honk to warn the bicyclist to stop
    C: Yield and let the bicyclist go through the intersection first
    D: Turn anyway, as bicycles must yield to cars
  answer: C
  explanation: Drivers must yield to bicyclists just as they would to other motor
    vehicles. You should not 'hook' a bicyclist by turning right immediately in front
    of them.
- id: 172
  category: sharing_the_road
  question: 'In Ohio, pedestrians have the right-of-way at intersections:'
  choices:
    A: Only if the crosswalk is marked with paint
    B: Only if there is a 'Walk' signal
    C: Whether the crosswalk is marked or unmarked
    D: Only during daylight hours
  answer: C
  explanation: Drivers must yield to pedestrians in both marked and unmarked crosswalks
    at intersections.
- id: 173
  category: sharing_the_road
  question: When an Ohio driver approaches a stationary emergency vehicle with flashing
    lights on a multi-lane highway, what does the 'Move Over Law' require them to
    do?
  choices:
    A: Stop immediately in the lane of travel
    B: Speed up to pass the vehicle quickly
    C: Change lanes to vacate the lane closest to the vehicle, if safe to do so
    D: Maintain speed and stay in the current lane
  answer: C
  explanation: Ohio's Move Over Law (ORC 4511.213) requires drivers to move over one
    lane for stationary emergency, law enforcement, or maintenance vehicles. If moving
    over is not possible or safe, the driver must slow down and proceed with caution.
- id: 174
  category: sharing_the_road
  question: When passing a bicycle traveling in the same direction in Ohio, what is
    the minimum distance a motorist must maintain between their vehicle and the bicycle?
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Ohio Revised Code 4511.27 requires motor vehicle operators to leave
    a safe distance when passing a bicycle, which is defined as not less than three
    feet.
- id: 175
  category: sharing_the_road
  question: 'Under Ohio law, a person riding a bicycle on a roadway has:'
  choices:
    A: No legal rights to the road
    B: The same rights and responsibilities as a driver of a motor vehicle
    C: The right of way over all motor vehicles at all times
    D: The requirement to ride only on the sidewalk
  answer: B
  explanation: In Ohio, bicycles are legally considered vehicles. Bicyclists have
    the same rights and must obey the same traffic laws as motorists, including stopping
    at red lights and stop signs.
- id: 176
  category: sharing_the_road
  question: In Ohio, what must a driver do when they see a pedestrian using a white
    cane or a guide dog?
  choices:
    A: Honk to let them know you are there
    B: Yield the right of way and take precautions to avoid injury
    C: Only stop if the pedestrian is in a marked crosswalk
    D: Drive around them if they are moving slowly
  answer: B
  explanation: Ohio law (ORC 4511.47) grants special right-of-way privileges to blind
    pedestrians. Drivers must yield the right of way to any person carrying a white
    cane or using a guide dog.
- id: 177
  category: sharing_the_road
  question: When a school bus is stopped to load or unload children, Ohio drivers
    must stop at least how many feet from the bus?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: Ohio Revised Code 4511.75 requires drivers to stop at least 10 feet
    from the front or rear of a school bus when it is stopped for the purpose of receiving
    or discharging school children.
- id: 178
  category: sharing_the_road
  question: What does a triangular orange sign with a red border on the back of a
    vehicle signify in Ohio?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a student driver
    C: The vehicle is a slow-moving vehicle (traveling 25 mph or less)
    D: The vehicle is an oversized load
  answer: C
  explanation: The slow-moving vehicle emblem (an orange triangle with a red reflective
    border) is required in Ohio for vehicles designed to travel at speeds of 25 mph
    or less, such as farm machinery or horse-drawn carriages.
- id: 179
  category: sharing_the_road
  question: In Ohio, which of the following is true regarding motorcycle helmet laws?
  choices:
    A: Helmets are optional for all riders
    B: Helmets are only required for passengers
    C: Helmets are required for all riders under 18 and those with a 'novice' license
    D: Helmets are required for all riders regardless of age
  answer: C
  explanation: Ohio law requires helmets for motorcycle operators under 18 years of
    age, passengers under 18, and all operators holding a 'novice' license (first
    year of licensure).
- id: 180
  category: sharing_the_road
  question: 'Large trucks have blind spots where the driver cannot see other vehicles.
    These areas are commonly called:'
  choices:
    A: Safe Zones
    B: No-Zones
    C: Clear Zones
    D: Buffer Zones
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around the front, back,
    and sides of a truck or bus where cars disappear from the driver's view.
- id: 181
  category: sharing_the_road
  question: 'When following a motorcycle in Ohio, a driver should maintain a following
    distance of at least:'
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 to 4 seconds
    D: 10 feet
  answer: C
  explanation: Because motorcycles can stop more quickly than cars and are more susceptible
    to road hazards, Ohio's manual recommends a following distance of at least 3 to
    4 seconds.
- id: 182
  category: sharing_the_road
  question: In Ohio, if you are found guilty of violating the 'Move Over Law' (failing
    to yield to a stationary emergency vehicle), how many points will be assessed
    to your driving record?
  choices:
    A: 0 points
    B: 2 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: A violation of Ohio's Move Over Law (ORC 4511.213) is a minor misdemeanor
    on the first offense and results in 2 points being added to the driver's record.
- id: 183
  category: sharing_the_road
  question: 'Under Ohio law, when a pedestrian is in a marked or unmarked crosswalk,
    a driver must:'
  choices:
    A: Yield the right of way
    B: Honk to warn them to hurry
    C: Only yield if the pedestrian is in a school zone
    D: Maintain speed if the pedestrian is not in the driver's lane
  answer: A
  explanation: Ohio Revised Code 4511.46 states that the driver of a vehicle shall
    yield the right of way to a pedestrian crossing the roadway within any clearly
    marked crosswalk or any unmarked crosswalk at an intersection.
- id: 184
  category: sharing_the_road
  question: In Ohio, what is the rule regarding funeral processions?
  choices:
    A: They must yield to all other traffic
    B: They have the right of way at intersections if they have headlights on and
      are part of the procession
    C: They are only allowed on Sundays
    D: They must follow all traffic signals even if it breaks the procession
  answer: B
  explanation: Ohio Revised Code 4511.451 gives funeral processions the right of way
    at intersections, provided the vehicles have headlights on and display a purple/white
    pennant. Other drivers must yield and not intersect the procession.
- id: 185
  category: vehicle_information
  question: According to the Ohio Digest of Motor Vehicle Laws, what is the minimum
    legal tread depth for tires on a passenger vehicle?
  choices:
    A: 1/32 of an inch
    B: 1/16 of an inch
    C: 1/8 of an inch
    D: 1/4 of an inch
  answer: B
  explanation: In Ohio, tires are considered unsafe if they are worn to the point
    where less than 1/16 of an inch of tread remains in any two adjacent major grooves.
- id: 186
  category: vehicle_information
  question: Under Ohio law, when are motorists required to display lighted headlights?
  choices:
    A: Only between the hours of midnight and 5:00 AM
    B: Only when visibility is less than 500 feet
    C: From sunset to sunrise and whenever windshield wipers are in use
    D: Only when driving on interstate highways during rain
  answer: C
  explanation: Ohio law requires headlights to be on from sunset to sunrise, during
    any period of rain, snow, fog, or other unfavorable atmospheric conditions, and
    whenever windshield wipers are in use.
- id: 187
  category: vehicle_information
  question: In Ohio, what is the maximum level of window tinting allowed on the front
    side windows (to the left and right of the driver)?
  choices:
    A: Must allow at least 70% light transmission
    B: Must allow at least 50% light transmission
    C: Must allow at least 35% light transmission
    D: Window tinting is prohibited on all side windows
  answer: B
  explanation: Ohio Administrative Code 4501-41-03 specifies that window tinting on
    the front side windows must allow a total light transmission of not less than
    50 percent (plus or minus 3 percent).
- id: 188
  category: vehicle_information
  question: Every motor vehicle in Ohio, other than a motorcycle, must be equipped
    with which of the following braking systems?
  choices:
    A: Only a foot brake
    B: Only an emergency parking brake
    C: Both a foot brake and a parking brake
    D: An automatic braking system (ABS) is the only legal requirement
  answer: C
  explanation: 'Ohio law requires every motor vehicle to have two separate means of
    applying brakes: a service brake (foot brake) and a parking brake.'
- id: 189
  category: vehicle_information
  question: In Ohio, a vehicle's rear license plate must be illuminated so that it
    is legible from a distance of at least how many feet?
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Ohio Revised Code requires a white light to illuminate the rear registration
    plate and render it clearly legible from a distance of 50 feet to the rear.
- id: 190
  category: vehicle_information
  question: Ohio's E-Check automobile emissions testing program is currently required
    for vehicles registered in how many specific counties?
  choices:
    A: All 88 counties
    B: Only Franklin County
    C: 7 counties in Northeast Ohio
    D: 15 counties along the Ohio River
  answer: C
  explanation: The E-Check program is required for vehicles registered in Cuyahoga,
    Geauga, Lake, Lorain, Medina, Portage, and Summit counties.
- id: 191
  category: vehicle_information
  question: 'According to Ohio law, every motor vehicle must be equipped with a mirror
    so located as to reflect to the operator a view of the highway to the rear of
    such vehicle for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Ohio law requires at least one rearview mirror that allows the driver
    to see at least 200 feet to the rear of the vehicle.
- id: 192
  category: vehicle_information
  question: 'In Ohio, every motor vehicle must be equipped with a horn capable of
    emitting sound audible under normal conditions from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: B
  explanation: Under Ohio Revised Code 4513.21, a motor vehicle must have a horn in
    good working order capable of emitting sound audible from a distance of not less
    than 200 feet.
- id: 193
  category: vehicle_information
  question: Ohio law requires that turn signal lights be visible from a distance of
    not less than ______ feet in normal sunlight.
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: Turn signals on a vehicle must be visible from a distance of not less
    than 300 feet in normal sunlight.
- id: 194
  category: vehicle_information
  question: In Ohio, between which dates is it legal to use studded tires on a motor
    vehicle?
  choices:
    A: October 1 through May 1
    B: November 1 through April 15
    C: December 1 through March 31
    D: Studded tires are prohibited year-round in Ohio
  answer: B
  explanation: Ohio Revised Code 4513.25 permits the use of studded tires only from
    November 1st through April 15th.
- id: 195
  category: vehicle_information
  question: Ohio's mandatory safety belt law requires which of the following to wear
    a properly adjusted safety belt?
  choices:
    A: Only the driver
    B: Only passengers under the age of 18
    C: The driver and all front-seat passengers
    D: Every occupant in the vehicle, regardless of seating position
  answer: C
  explanation: In Ohio, the driver and all front-seat passengers are required to wear
    safety belts. Children must be in age-appropriate restraints regardless of where
    they sit.
- id: 196
  category: vehicle_information
  question: A 'Slow Moving Vehicle' emblem must be displayed on the rear of any vehicle
    that is designed to operate at speeds of ______ or less.
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: The triangular orange 'Slow Moving Vehicle' (SMV) emblem is required
    on vehicles designed to travel at speeds of 25 mph or less.
- id: 197
  category: vehicle_information
  question: 'In Ohio, every motor vehicle must be equipped with at least one tail
    light that emits a red light visible from a distance of:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Ohio law requires tail lights to be visible from a distance of 500
    feet to the rear.
- id: 198
  category: vehicle_information
  question: In Ohio, when are drivers required to have their headlights on besides
    the period between sunset and sunrise?
  choices:
    A: Only when driving on the interstate
    B: Whenever the windshield wipers are in use due to precipitation
    C: Only during heavy thunderstorms
    D: Whenever driving in a construction zone
  answer: B
  explanation: Ohio law requires headlights to be on whenever windshield wipers are
    in use due to rain, snow, sleet, or other unfavorable atmospheric conditions.
- id: 199
  category: vehicle_information
  question: Ohio law requires that every motor vehicle (other than a motorcycle) be
    equipped with a foot brake that is capable of stopping the vehicle within how
    many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 30 feet
    C: 40 feet
    D: 50 feet
  answer: B
  explanation: The foot brake must be able to stop the vehicle within a distance of
    30 feet at a speed of 20 mph on a dry, level, hard surface.
- id: 200
  category: vehicle_information
  question: 'In Ohio, the white light that illuminates the rear license plate must
    make the plate legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 75 feet
    D: 100 feet
  answer: B
  explanation: Ohio Revised Code requires a white light to illuminate the rear registration
    plate so that it is clearly legible from a distance of 50 feet to the rear.
- id: 201
  category: vehicle_information
  question: When intending to turn or change lanes in Ohio, a driver must give a continuous
    signal for at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Ohio law requires a turn signal to be given continuously for at least
    100 feet before the intended turn or lane change.
- id: 202
  category: vehicle_information
  question: In certain Ohio counties, vehicles are required to pass an E-Check emissions
    test. How often must these vehicles typically be tested?
  choices:
    A: Every year
    B: Every two years
    C: Every five years
    D: Only when the vehicle is sold
  answer: B
  explanation: In the seven Ohio counties that require E-Check (Cuyahoga, Geauga,
    Lake, Lorain, Medina, Portage, and Summit), testing is required every two years
    based on the vehicle's model year.
- id: 203
  category: vehicle_information
  question: Ohio law prohibits the use of which of the following equipment on a vehicle
    used on public highways?
  choices:
    A: A muffler cutout or bypass
    B: A trailer hitch
    C: A roof rack
    D: Fog lamps
  answer: A
  explanation: Ohio Revised Code 4513.22 prohibits the use of a muffler cutout, bypass,
    or similar device upon a motor vehicle on a highway.
- id: 204
  category: vehicle_information
  question: A motor vehicle in Ohio must have a rearview mirror that allows the driver
    to see at least how many feet to the rear of the vehicle?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Ohio law requires vehicles to be equipped with a mirror so located
    as to reflect to the driver a view of the highway for a distance of at least 200
    feet to the rear.
- id: 205
  category: vehicle_information
  question: Under Ohio's Mandatory Safety Belt Usage Law, who is required to wear
    a safety belt when a passenger car is being operated?
  choices:
    A: Only the driver
    B: The driver and all front-seat passengers
    C: Only passengers under the age of 18
    D: Every occupant in the vehicle regardless of seating position
  answer: B
  explanation: 'Ohio law requires the driver and all front-seat passengers to wear
    safety belts. (Note: Children are covered by separate child restraint laws).'
- id: 206
  category: signs_and_signals
  question: When a driver extends their left arm out the window and bends it upward
    at the elbow, which signal are they making?
  choices:
    A: Left turn
    B: Right turn
    C: Slowing or stopping
    D: Hazard warning
  answer: B
  explanation: The hand signal for a right turn is the left arm extended out and bent
    upward at the elbow.
- id: 207
  category: signs_and_signals
  question: In Ohio, a pennant-shaped sign (an isosceles triangle) is found on the
    left side of the road and indicates what?
  choices:
    A: Yield
    B: School Zone
    C: No Passing Zone
    D: Railroad Crossing
  answer: C
  explanation: A pennant-shaped sign is placed on the left side of the road to mark
    the beginning of a 'No Passing Zone'.
- id: 208
  category: signs_and_signals
  question: Under Ohio law, when are you allowed to turn right on a red light?
  choices:
    A: Never
    B: Only if there is a green arrow
    C: After coming to a complete stop and yielding to traffic and pedestrians, unless
      a sign prohibits it
    D: Only between the hours of 9:00 PM and 6:00 AM
  answer: C
  explanation: Ohio law allows a right turn on red after a complete stop, provided
    the way is clear and no sign is posted prohibiting the turn.
- id: 209
  category: signs_and_signals
  question: In Ohio, what does a flashing yellow traffic light signify?
  choices:
    A: Stop and wait for the light to turn green
    B: Speed up to clear the intersection
    C: Slow down and proceed with caution
    D: Yield to all traffic coming from the right
  answer: C
  explanation: A flashing yellow light is a warning to slow down and proceed through
    the intersection with caution.
- id: 210
  category: signs_and_signals
  question: According to Ohio law, if you are driving on a road with fewer than four
    lanes and a school bus stops with its red lights flashing, who must stop?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic from both directions
    D: No one, if the bus is in a turn lane
  answer: C
  explanation: On a road with fewer than four lanes, all traffic approaching the bus
    from either direction must stop at least 10 feet from the front or rear of the
    bus.
- id: 211
  category: signs_and_signals
  question: If an Ohio road has four or more lanes and a school bus is stopped with
    red lights flashing, which drivers are required to stop?
  choices:
    A: All drivers in both directions
    B: Only drivers traveling in the same direction as the bus
    C: Only drivers in the oncoming lanes
    D: Only drivers in the far-right lane
  answer: B
  explanation: In Ohio, if a bus is stopped on a road with four or more lanes, only
    traffic proceeding in the same direction as the bus must stop.
- id: 212
  category: signs_and_signals
  question: What is the penalty for speeding in a construction zone in Ohio when signs
    are posted and workers are present?
  choices:
    A: The fine is waived for first-time offenders
    B: The fine is doubled
    C: The fine is tripled
    D: The driver's license is immediately suspended
  answer: B
  explanation: Ohio law mandates that fines for speeding violations in a construction
    zone are doubled when signs are posted and workers are present.
- id: 213
  category: signs_and_signals
  question: In Ohio, when is a left turn on a red light permitted?
  choices:
    A: Never
    B: From any street onto a one-way street
    C: Only from a one-way street onto another one-way street
    D: Only if there is no traffic for two blocks
  answer: C
  explanation: Ohio law allows a left turn on red only when turning from a one-way
    street onto another one-way street, after a complete stop and yielding to traffic.
- id: 214
  category: signs_and_signals
  question: A triangular orange sign with a red reflective border is placed on the
    rear of a vehicle to indicate what?
  choices:
    A: The vehicle is carrying hazardous materials
    B: The vehicle is a slow-moving vehicle (25 mph or less)
    C: The vehicle is an oversized load
    D: The vehicle is a student driver
  answer: B
  explanation: The slow-moving vehicle emblem is a triangular fluorescent orange sign
    with a red reflective border, used on vehicles traveling at speeds of 25 mph or
    less.
- id: 215
  category: signs_and_signals
  question: When you see a 'Yield' sign, what does Ohio law require you to do?
  choices:
    A: Stop completely every time
    B: Speed up to merge before other cars arrive
    C: Slow down and stop if necessary to let any vehicle or pedestrian pass
    D: Ignore it if no other cars are visible
  answer: C
  explanation: A yield sign means you must slow down and yield the right-of-way to
    any vehicle or pedestrian in or approaching the intersection, stopping if necessary.
- id: 216
  category: signs_and_signals
  question: What is the meaning of a flashing red traffic light in Ohio?
  choices:
    A: The signal is broken; proceed with caution
    B: Yield to all traffic, but do not stop
    C: Stop completely and proceed only when it is safe to do so
    D: Stop and wait for the light to turn green
  answer: C
  explanation: 'A flashing red light must be treated the same as a stop sign: come
    to a complete stop and proceed only when safe.'
- id: 217
  category: signs_and_signals
  question: In Ohio, what do broken white lines on the pavement indicate?
  choices:
    A: Traffic moving in opposite directions; passing is allowed
    B: Traffic moving in the same direction; passing is allowed
    C: The edge of the roadway
    D: A no-passing zone
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    Drivers may cross these lines to change lanes when it is safe.
- id: 218
  category: signs_and_signals
  question: If your vehicle's turn signals are not working, how should you signal
    a right turn using hand and arm signals in Ohio?
  choices:
    A: Extend arm and hand straight out the window
    B: Extend arm and hand upward
    C: Extend arm and hand downward
    D: Wave the hand in a circular motion
  answer: B
  explanation: The standard hand signal for a right turn is the left arm and hand
    extended upward.
- id: 219
  category: signs_and_signals
  question: 'In Ohio, a pennant-shaped sign (an isosceles triangle pointing right)
    is used to indicate:'
  choices:
    A: A school zone
    B: A yield requirement
    C: A no-passing zone
    D: A railroad crossing
  answer: C
  explanation: The pennant-shaped sign is found on the left side of the road and marks
    the beginning of a no-passing zone.
- id: 220
  category: signs_and_signals
  question: When you see a circular yellow sign with a large black 'X' and the letters
    'RR', what are you approaching?
  choices:
    A: A road construction zone
    B: A highway interchange
    C: A railroad crossing
    D: A restricted roadway
  answer: C
  explanation: The circular yellow sign is the advance warning sign for a railroad
    crossing.
- id: 221
  category: signs_and_signals
  question: You are driving on a road with two lanes in your direction. There is a
    solid white line painted between the lanes. What does this indicate?
  choices:
    A: You are in a carpool lane
    B: You should stay in your lane; lane changes are discouraged
    C: You must turn right at the next intersection
    D: Passing is strictly prohibited
  answer: B
  explanation: Solid white lines are used to discourage lane changes in areas where
    they may be hazardous, though they do not strictly prohibit them like a double
    solid line.
- id: 222
  category: signs_and_signals
  question: In Ohio, what must you do when approaching a stationary public safety
    vehicle (like a police car or ambulance) with its lights flashing?
  choices:
    A: Stop immediately in your lane
    B: Maintain speed but move to the left lane
    C: Move to a lane that is not adjacent to the vehicle, or slow down if moving
      over is impossible
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: Ohio's 'Move Over Law' requires drivers to move over one lane or, if
    moving over is not possible/safe, to slow down significantly when passing stationary
    emergency or service vehicles with flashing lights.
- id: 223
  category: signs_and_signals
  question: In Ohio, what does a solid yellow line on your side of the center dash
    line mean?
  choices:
    A: You may pass with caution
    B: You are in a one-way zone
    C: Passing is prohibited
    D: You must turn left
  answer: C
  explanation: A solid yellow line on your side of the center line indicates a no-passing
    zone.
- id: 224
  category: signs_and_signals
  question: According to Ohio law, what is the proper procedure for turning right
    on a red light?
  choices:
    A: Slow down and turn if no traffic is coming
    B: Stop, yield to all traffic and pedestrians, then proceed if no sign prohibits
      the turn
    C: Only turn if there is a green arrow present
    D: Right turns on red are illegal in Ohio
  answer: B
  explanation: Ohio law allows right turns on red after a complete stop and yielding
    to all other traffic and pedestrians, provided no sign is posted prohibiting the
    turn.
- id: 225
  category: signs_and_signals
  question: What is the hand signal for 'Slow or Stop' in Ohio?
  choices:
    A: Arm and hand extended straight out
    B: Arm and hand extended upward
    C: Arm and hand extended downward
    D: Arm and hand waving toward the ground
  answer: C
  explanation: The hand signal for slowing or stopping is the left arm and hand extended
    downward.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 226
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 227
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 228
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 229
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 230
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 231
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 232
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 233
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 234
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 235
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 236
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 237
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 238
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 239
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 240
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 241
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 242
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 243
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 244
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 245
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 246
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 247
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 248
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 249
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 250
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 251
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 252
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 253
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 254
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 255
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 256
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Lanes are merging
    B: A lane is ending
    C: A new lane is being added — no merging needed
    D: Right turn required
  answer: C
  explanation: An added lane sign means a new lane is joining the highway without
    requiring merging. Traffic entering from the ramp has its own new lane.
  id: 257
- image: no_parking.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Stopping at any time
    B: Parking in this area
    C: Standing or idling
    D: Loading or unloading
  answer: B
  explanation: A red and white NO PARKING sign means you cannot park your vehicle
    in this area. You may briefly stop to load or unload passengers.
  id: 258
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 259
