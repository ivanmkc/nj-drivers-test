  choices:
    A: 'Section 1: How to Get Your Driver License'
    B: 'Section 13: What Else Should I Know?'
    C: 'Section 12: Purchase Your Driver License'
    D: 'Section 6: State Laws and Penalties'
  answer: B
  explanation: 'The table of contents lists ''New Ohio Residents'' as the first topic
    in Section 13: What Else Should I Know?'
- id: 210
  category: defensive_driving
  question: The topic of 'Aggressive Driving' and its dangers are discussed in which
