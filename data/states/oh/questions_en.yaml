  choices:
    A: 'Section 4: Rules of the Road'
    B: 'Section 9: Sharing the Road'
    C: 'Section 8: Safe Driving Tips'
    D: 'Section 5: Learning to Drive'
  answer: D
  explanation: 'The table of contents shows that ''Roundabouts or Traffic Circles''
    is a topic covered in Section 5: Learning to Drive.'
- id: 209
  category: license_system
  question: According to the table of contents, where would a new resident find information
