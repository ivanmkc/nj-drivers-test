  answer: B
  explanation: Ohio photo ID cards for children (ID R KIDS) assist authorities in
    the event that a child becomes lost or is reported missing.
- id: 176
  category: license_system
  question: Can an Ohio ID card for a child be used for driving privileges?
  choices:
    A: Yes, if the child is over 14 years old
    B: Yes, but only when accompanied by a parent
    C: No, it is used for identification purposes only
    D: No, unless they pass a written test
  answer: C
  explanation: The manual explicitly states that an Ohio ID card is used for identification
    purposes only, and cannot be used for anything else, including driving privileges.
- id: 177
  category: license_system
  question: What must you provide when applying for an Ohio ID card for your child
    at a Deputy Registrar License Agency?
  choices:
    A: Identity documents from the Acceptable Documents List
    B: A completed Next of Kin form
    C: The child's school ID and report card
    D: A voter registration form
  answer: A
  explanation: To apply for an Ohio ID card for a child, you must visit a Deputy Registrar
    License Agency and provide identity documents from the Acceptable Documents List.
- id: 178
  category: driver_responsibility
  question: Under the Next of Kin Emergency Contact Information program, what is the
    maximum number of emergency contacts an Ohioan can identify?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Through the Next of Kin Emergency Contact Information program, Ohioans
    can identify up to two emergency contacts.
- id: 179
  category: driver_responsibility
  question: What is the purpose of the Next of Kin Emergency Contact Information program?
  choices:
    A: To notify family members when a driver's license expires
    B: To allow law enforcement to notify contacts if an emergency leaves a person
      unable to communicate
    C: To provide a backup address for BMV mailings
    D: To register family members to vote
  answer: B
  explanation: The program allows law enforcement to notify emergency contacts when
    an accident or emergency leaves the person unable to communicate with law enforcement
    or emergency medical responders.
- id: 180
  category: license_system
  question: Which of the following is NOT a valid method to add emergency contact
    information to your driver record?
  choices:
    A: Online through BMV Online Services
    B: In person at a Deputy Registrar License Agency
    C: By mail to BMV Verification Services
    D: Over the phone by calling 911
  answer: D
  explanation: 'The manual lists three ways to add emergency contact information:
    Online, In Person, or By Mail. Calling 911 is not an option.'
- id: 181
  category: license_system
  question: Can parents add Next of Kin emergency contact information to their child's
    Ohio ID card record?
  choices:
    A: Yes, to be used in the event the child becomes lost or is reported missing
    B: No, the program is only for licensed drivers over 18
    C: Yes, but only by mailing a form to the County Board of Elections
    D: No, children cannot have emergency contacts listed
  answer: A
  explanation: Parents of children who have an Ohio ID card may add contact information
    to their child's record for use in the event the child becomes lost or is reported
    missing.
- id: 182
  category: license_system
  question: Where does the living will designation display on an Ohio Driver License
    or ID card?
  choices:
    A: On the front, below the photo
    B: On the back of the Driver License or ID card
    C: Embedded in the magnetic stripe only
    D: It does not display on the card itself
  answer: B
  explanation: The manual states that the living will indication will display on the
    back of the Driver License or ID card.
- id: 183
  category: license_system
  question: Who is eligible to have the 'ARMED FORCES' designation displayed on their
