  question: What symbol is printed on your Tennessee driver license or ID to indicate
    you are a registered organ donor?
  choices:
    A: A green ribbon
    B: A red heart
    C: A blue star
    D: A medical cross
  answer: B
  explanation: The manual notes that a red heart will be printed on your license or
    ID to reflect your decision to be an organ and tissue donor.
- id: 127
  category: license_system
  question: Which document can be used to prove eligibility to have 'Veteran' displayed
    on your Tennessee driver license?
  choices:
    A: A standard birth certificate
    B: A valid U.S. passport
    C: Department of Defense Form DD-214
    D: A voter registration card
  answer: C
  explanation: To have 'Veteran' displayed on your license, you must present a certified
    copy of your Department of Defense Form DD-214, the NAVPERS-660 honorable discharge
    certificate, or your DD Form 2 (Retired) identification card.
- id: 128
  category: driver_responsibility
  question: Who should you contact if you do not receive your Voter Registration Card
    within 30 days of applying at the Driver Service Center?
  choices:
    A: The Department of Safety
    B: The Federal Election Commission
    C: Your local County Election Commission
    D: The Driver Service Center where you applied
  answer: C
  explanation: The manual advises that if you have not received your Voter Registration
    Card within 30 days of applying at the Driver License Service Center, you should
    contact your local County Election Commission immediately.
- id: 129
  category: license_system
  question: Is an International Driving Permit (IDP) issued to a U.S. citizen valid
    for driving within the United States?
  choices:
    A: Yes, but only for 6 months
    B: Yes, if accompanied by a passport
    C: No, it is not valid for driving in the United States or its territories
    D: No, unless the driver is operating a commercial vehicle
  answer: C
  explanation: The manual explicitly states that the IDP is NOT valid for driving
    in the United States or its territories.
- id: 130
  category: license_system
  question: How long is an International Driving Permit (IDP) valid from the date
    of issuance?
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 5 years
  answer: B
  explanation: The manual states that the IDP is valid for one (1) year only from
    the date of issuance.
- id: 131
  category: license_system
  question: How long may a non-U.S. citizen employed in a managerial or technical
    position in Tennessee drive on a valid license from another country before being
    required to apply for a Tennessee license?
  choices:
    A: 30 days
    B: 3 months
    C: 6 months
    D: 1 year
  answer: C
  explanation: Non-U.S. citizens in managerial or technical positions may operate
    vehicles with a valid driver license issued by another state or country for a
    period of 6 months, after which they must apply for a Tennessee license.
- id: 132
  category: license_system
  question: Which of the following conditions makes an individual ineligible for a
    Tennessee driver license?
  choices:
    A: Failing to show required proof of car insurance or financial responsibility
    B: Being a non-U.S. citizen with temporary legal presence
    C: Being an honorably discharged veteran
    D: Enrolling in an approved driver training course
  answer: A
  explanation: The manual lists 'Anyone required to show proof of car insurance/financial
    responsibility who has not done so' under the 'WHO IS NOT ELIGIBLE?' section.
- id: 133
  category: license_system
  question: How old must a U.S. citizen be to obtain an International Driving Permit
    (IDP)?
  choices:
    A: 16 years of age
    B: 18 years of age
    C: 21 years of age
    D: 25 years of age
  answer: B
  explanation: To obtain an International Driving Permit, a U.S. citizen must be at
    least eighteen (18) years of age.
- id: 134
  category: license_system
  question: Where can a Tennessee resident obtain an International Driving Permit
    (IDP)?
  choices:
    A: Any Tennessee Driver Service Center
    B: The Department of Safety headquarters
    C: A local American Automobile Association (AAA) office
    D: A U.S. passport office
  answer: C
  explanation: Any Tennessee resident interested in obtaining an IDP should contact
    a local American Automobile Association (AAA) office. Tennessee Driver Service
    Centers do NOT issue them.
- id: 135
  category: driver_responsibility
  question: 'If you are a registered sexual offender applying for or renewing a driver''s
    license, you must:'
  choices:
    A: Inform the Department of Safety Driver License Examiner
    B: Apply only by mail
    C: Surrender your previous state's license to the local police
    D: Pay a special offender surcharge fee
  answer: A
  explanation: If you are a registered sexual offender, it is your responsibility
    to inform the Department of Safety Driver License Examiner that you are required
    to register as a sexual offender.
- id: 136
  category: license_system
  question: When bringing documents to prove your identity for a driver's license,
    which of the following is acceptable?
  choices:
    A: Clear photocopies
    B: Notarized faxes
    C: Original or certified documents
    D: Digital photos on your smartphone
  answer: C
  explanation: All documents must be originals or certified. No faxes or photocopies
    will be accepted.
- id: 137
  category: license_system
  question: How many proofs of Tennessee residency are required when applying for
    a driver's license?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Applicants must provide two proofs of Tennessee residency with their
    name and resident address.
- id: 138
  category: license_system
  question: 'Proofs of Tennessee residency must be current. According to the manual,
    ''current'' means dated within the last:'
  choices:
    A: 30 days
    B: 60 days
    C: 4 months
    D: 6 months
  answer: C
  explanation: The manual specifies that acceptable proofs of Tennessee residency
    must be current, meaning from the last 4 months.
- id: 139
  category: license_system
  question: 'If you are under 18 years of age, your proof of school attendance must
    be signed and dated within the past:'
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 90 days
  answer: C
  explanation: Proof of school attendance/progress for applicants under 18 must be
    signed and dated within the past 30 days.
- id: 140
  category: driver_testing
  question: Applicants under 18 must provide certification of how many hours of behind-the-wheel
    driving experience?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: Applicants under 18 need certification of 50 hours behind the wheel
    driving experience after holding a learner permit for six months.
- id: 141
  category: license_system
  question: When applying for a Commercial Driver License (CDL), which of the following
    is true regarding your Social Security Number (SSN)?
  choices:
    A: You can use an SSN Affidavit if you do not have an SSN.
    B: An SSN is not required for a commercial license.
    C: The SSN Affidavit is NOT allowed; federal regulations require CDL holders to
      have an SSN.
    D: You may provide an Individual Taxpayer Identification Number (ITIN) instead.
  answer: C
  explanation: Federal regulations require CDL holders to have an SSN. The SSN Affidavit
    is NOT allowed when applying for a commercial license.
- id: 142
  category: license_system
  question: 'If you have moved from out of state, your valid out-of-state driver''s
    license can be used to prove your:'
  choices:
    A: U.S. Citizenship
    B: Lawful Permanent Resident status
    C: Identity
    D: Tennessee Residency
  answer: C
  explanation: Your valid driver license from your former state can be used to prove
    your identity, but it cannot be used to prove U.S. Citizenship or Lawful Permanent
    Resident status.
- id: 143
  category: license_system
  question: 'If your current name is different from the one shown on your identity
    documents, you must:'
  choices:
    A: Mail in a photocopy of your marriage certificate
    B: Provide original or certified legal documents establishing the name change
    C: Wait until your current license expires to change it
    D: Bring a notarized letter from a family member
  answer: B
  explanation: Each supporting piece of information to establish a name change must
    be original or certified legal documents. Name changes cannot be accepted through
    the mail.
- id: 144
  category: license_system
  question: 'If an applicant only has ''temporary'' legal presence status in the U.S.,
    they may be eligible for a:'
  choices:
    A: Permanent Commercial Driver License
    B: Temporary Driver License (TDL) or Temporary Identification License (TID)
    C: Standard Class D Driver License
    D: International Driving Permit
  answer: B
  explanation: If an applicant only has temporary legal presence status, they will
    NOT be eligible for a standard driver license, but may be eligible for a Temporary
    Driver License (TDL) or Temporary Identification License (TID).
- id: 145
  category: license_system
  question: Which of the following is true regarding the use of an International Driving
    Permit (IDP)?
  choices:
    A: It is valid by itself for driving in the United States.
    B: It must be carried with the driver's regular valid U.S. Driver License.
    C: It replaces your state-issued driver's license when traveling out of state.
    D: It allows foreign visitors to bypass U.S. traffic laws.
  answer: B
  explanation: The IDP MUST be carried with the driver’s regular valid U.S. Driver
    License. It is NOT valid for driving in the U.S. and is NOT valid by itself for
    driving.
- id: 146
  category: license_system
  question: Which of the following is an acceptable document to prove U.S. Citizenship
    or Lawful Permanent Resident status?
  choices:
    A: A valid out-of-state driver's license
    B: A utility bill from the last 4 months
    C: A valid U.S. Passport
    D: A voter registration card
  answer: C
  explanation: Table 2.1 lists acceptable documents proving an applicant is a U.S.
    citizen or a lawful permanent resident, which includes a Valid U.S. Passport.
- id: 147
  category: license_system
  question: Which of the following is NOT an acceptable form of primary identification
    when applying for a driver license?
  choices:
    A: Certified Birth Certificate
    B: Valid Passport
    C: Hospital Issued Birth Certificate
    D: Military Identification
  answer: C
  explanation: The manual explicitly states that 'HOSPITAL ISSUED CERTIFICATES AND
    BAPTISMAL CERTIFICATES ARE-NOT ACCEPTABLE' as primary identification.
- id: 148
  category: license_system
  question: If an applicant presents a foreign birth certificate that is not issued
    in English, what else must be provided?
  choices:
    A: A notarized letter from the embassy
    B: A Certificate of Accurate Translation
    C: An International Driving Permit
    D: A valid U.S. Passport
  answer: B
  explanation: Foreign birth certificates, not issued in English, must be translated
    and accompanied by a Certificate of Accurate Translation.
- id: 149
  category: license_system
  question: How many items of proof of identity are required for an ORIGINAL applicant
    applying for a driver license?
  choices:
    A: One item from the Primary list
    B: Two items from the Secondary list
    C: At least one item from the Primary list and a second item from either list
    D: Three items from the Primary list
  answer: C
  explanation: ORIGINAL applicants must have at least one item from the Primary Identification
    list. The second item may be from the Secondary Identification list or another
    item from the Primary Identification list.
- id: 150
  category: license_system
  question: What must a new resident do if their out-of-state license has been lost?
  choices:
    A: Provide three items from the Secondary Identification list
    B: Provide the same two items of proof required of an ORIGINAL applicant
    C: Return to their former state to get a replacement
    D: Wait 30 days before applying for a Tennessee license
  answer: B
  explanation: If a new resident's license from the other state has been lost, the
    new resident must provide the same two (2) items of proof, as required of an ORIGINAL
    applicant.
- id: 151
  category: license_system
  question: When using a marriage certificate as proof of a name change, which of
    the following is true?
  choices:
    A: It must be the 'license' authorizing the union
    B: It must be registered AFTER the marriage
    C: A photocopy of the certificate is always acceptable
    D: It does not need to include the applicant's date of birth
  answer: B
  explanation: The certificate must be the original or certified copy that is registered
    AFTER the marriage; NOT just the 'license' authorizing the union.
- id: 152
  category: license_system
  question: Which of the following is considered an acceptable Secondary Identification
    document?
  choices:
    A: Certified Birth Certificate
    B: Valid Passport
    C: Health Insurance card
    D: Adoptive Decree
  answer: C
  explanation: A Health Insurance card (such as TennCare, Medicaid, Medicare, etc.)
    is listed under the Secondary Identification table.
- id: 153
  category: license_system
  question: How many documents are required to prove Tennessee residency?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: Proof of residency requires applicants to provide two (2) documents
    from the Acceptable Proof of Residency Table.
- id: 154
  category: license_system
  question: Which of the following is NOT an acceptable document to prove Tennessee
    residency?
  choices:
    A: A current utility bill with the postmarked envelope
    B: An initial deposit receipt for a utility
    C: A current bank statement
    D: A current Tennessee voter registration
  answer: B
  explanation: 'When using a utility bill for proof of residency, the manual explicitly
    states: ''Initial Deposit Receipt is NOT acceptable.'''
- id: 155
  category: license_system
  question: If an applicant uses a utility bill as proof of Tennessee residency, what
    must be included with it?
  choices:
    A: A notarized signature
    B: The postmarked envelope the bill was mailed in
    C: A copy of the applicant's birth certificate
    D: A letter from the utility company
  answer: B
  explanation: A current utility bill must include the postmarked envelope the bill
    was mailed in.
- id: 156
  category: license_system
  question: Will your Social Security number be printed on your Tennessee driver license?
  choices:
    A: Yes, it is required by law
    B: Yes, unless you request otherwise
    C: No, your social security number will not be printed on your license
    D: Only on commercial driver licenses
  answer: C
  explanation: 'The manual states: ''Your social security number will not be printed
    on your license.'''
- id: 157
  category: license_system
  question: What type of Social Security card is acceptable as proof of identity and
    Social Security number?
  choices:
    A: A metal replica
    B: A plastic replica
    C: A photocopy of the original
    D: An original Social Security card
  answer: D
  explanation: The manual specifies 'An original Social Security card' and notes under
    Secondary ID 'original only not metal or plastic replicas'.
- id: 158
  category: license_system
  question: If an employer verification of residence address is used, and the employer
    does not have company letterhead, what is required?
  choices:
    A: The signature must be notarized
    B: Two signatures from different managers
    C: A copy of the employer's business license
    D: It cannot be used under any circumstances
  answer: A
  explanation: 'The manual states: ''If employer does not have letterhead then signature
    must be notarized.'''
- id: 159
  category: license_system
  question: What is required if an applicant provides a copy of a court document for
    a divorce decree as proof of a name change?
  choices:
    A: A copied seal and signature are acceptable
    B: It must have an original signature/seal affixed to the copy
    C: Court documents cannot be used for name changes
    D: It must be accompanied by a birth certificate
  answer: B
  explanation: 'The manual notes: ''Copy of court document with an original signature/seal
    that is affixed to copy is acceptable. Copy of court document with copied seal/
    signature is not acceptable.'''
- id: 160
  category: license_system
  question: Which of the following applicants is required to provide proof of Tennessee
    residency?
  choices:
    A: Only ORIGINAL applicants for a first time ID
    B: Only NEW RESIDENT applicants
    C: ORIGINAL, NEW RESIDENT, and RETURNING RESIDENT applicants
    D: Applicants for DUPLICATES of an existing Tennessee DL
  answer: C
  explanation: The Driver License Examiner will require proof of Tennessee residency
    for ORIGINAL applicants, NEW RESIDENT applicants, and RETURNING RESIDENT applicants.
- id: 161
  category: license_system
  question: If an applicant is a minor and uses a residency document in the name of
    a parent or legal guardian, what else is required?
  choices:
    A: A letter from the minor's school
    B: Proof of relationship
    C: A notarized statement from a neighbor
    D: The minor's Social Security card
  answer: B
  explanation: The manual states that if the applicant is a minor, the name of a parent
    or legal guardian can be used, but '(proof of relationship will be required if
    this type of proof is used)'.
- id: 162
  category: license_system
  question: If you have never been issued a Social Security Number, what must you
    do to process your driver license application?
  choices:
    A: Provide a letter from your employer
    B: Apply online and check the 'No SSN' box
    C: Appear in person and sign a sworn affidavit
    D: Bring a passport and a birth certificate
  answer: C
  explanation: Applicants who have never been issued a Social Security number must
    appear in person and sign a sworn affidavit to that effect in the presence of
    a Driver License Examiner or Notary Public.
- id: 163
  category: license_system
  question: As of January 1, 2016, how often do Tennessee driver licenses expire for
    persons over the age of 21?
  choices:
    A: Every 4 years on your birthday
    B: Every 5 years from the date of issuance
    C: Every 8 years from the date of issuance
    D: Every 10 years on your birthday
  answer: C
  explanation: As of January 1, 2016, Tennessee licenses for persons over the age
    of 21 expire every eight years from the date of issuance.
- id: 164
  category: license_system
  question: Which of the following is NOT an accepted method of payment at Tennessee
    Driver Service Centers?
  choices:
    A: Cash
    B: American Express Credit Cards
    C: MasterCard
    D: Money Order
  answer: B
  explanation: Accepted methods of payment at Driver Service Centers are Cash, Check,
    Money Order, MasterCard, Visa and Discover Credit Cards. American Express is not
    listed.
- id: 165
  category: license_system
  question: How many days do new residents holding an out-of-state driver license
    have to obtain a Tennessee driver license after establishing residency?
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: New residents or those returning to Tennessee and holding a driver
    license from another state, must obtain a Tennessee driver license no later than
    thirty (30) days after establishing residency.
- id: 166
  category: driver_testing
  question: What test is required for ALL new or returning residents obtaining a Tennessee
    driver license?
  choices:
    A: A vision screening
    B: A road skills test
    C: A written knowledge exam
    D: A physical medical exam
  answer: A
  explanation: All new or returning residents must take a Tennessee vision screening
    at the Driver Service Center.
- id: 167
  category: driver_testing
  question: If a new resident's out-of-state license has been expired for more than
    six months, which tests must they take?
  choices:
    A: Only a vision screening
    B: Vision screening and knowledge exam
    C: Knowledge exam and road skills test
    D: Knowledge exam, road skills test, and vision screening
  answer: D
  explanation: New or returning residents whose out of state license has been expired
    for more than six months must take the Tennessee knowledge exam, road skills test,
    and vision screening.
- id: 168
  category: license_system
  question: When applying for a license, new residents must provide two proofs of
    Tennessee residency. Which of the following is a requirement for these documents?
  choices:
    A: They must be photocopies
    B: They must be dated within the last 4 months
    C: They must use a P.O. Box address
    D: They must be dated within the last 12 months
  answer: B
  explanation: Applicants must provide two Proofs of Tennessee Residency with their
    name and resident address - NO P.O. BOXES, and the documents must be current and
    dated within the last 4 months.
- id: 169
  category: license_system
  question: Under what condition does a valid Tennessee driver license remain valid
    indefinitely for a person in the United States Armed Forces?
  choices:
    A: If they are a member of the National Guard
    B: If they are on active duty and based outside the State of Tennessee
    C: If they are a family member of military personnel
    D: If they are stationed at a base within Tennessee
  answer: B
  explanation: The license remains valid regardless of the displayed expiration date
    as long as the person remains on active duty, is based outside the State of Tennessee,
    and the license is not surrendered, canceled or suspended.
- id: 170
  category: license_system
  question: After being discharged from the Armed Forces or reassigned to a duty station
    within Tennessee, how many days does a person have to renew their driver license?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: B
  explanation: Once the person has been discharged or separated from such services
    or has been reassigned to a duty station within the state, he or she must renew
    his/her license within sixty (60) days following the date of separation.
- id: 171
  category: license_system
  question: If a Temporary Driver License (TDL) is lost or stolen, how can it be replaced?
  choices:
    A: By applying online through the state website
    B: By mailing a request to the Department of Safety
    C: By applying in person at a driver license service center
    D: By calling the toll-free replacement hotline
  answer: C
  explanation: Temporary Driver Licenses and Temporary Identification Licenses cannot
    be replaced online. If you must apply in person, you will need to present proper
    identification.
- id: 172
  category: license_system
  question: If you were issued a Tennessee driver license after January 1, 2001, what
    must you do at the time of your FIRST renewal?
  choices:
    A: Renew online to verify your identity
    B: Provide documentation that you are a U.S. Citizen or lawful permanent resident
      at a Driver Service Center
    C: Retake the written knowledge exam
    D: Mail a photocopy of your birth certificate to the Department of Safety
  answer: B
  explanation: Tennessee law requires anyone issued a license after January 1, 2001
    to provide documentation that you are a United States Citizen or a lawful permanent
    resident at the time of your first renewal. You may not renew by mail or internet
    and must visit a Driver Service Center.
- id: 173
  category: driver_testing
  question: What is required of new residents from other countries when applying for
    a Tennessee driver license?
  choices:
    A: They must surrender their foreign license
    B: They are only required to take a vision screening
    C: They must take a vision screening, knowledge exam, and road skills test
    D: They must wait six months before applying
  answer: C
  explanation: 'New residents from other countries are required to take the following
    tests: vision screening, knowledge exam, and road skills test. They will be allowed
    to keep the license issued by that country.'
- id: 174
  category: license_system
  question: What is the rule regarding the physical condition of documents presented
    for proof of identity and residency?
  choices:
    A: High-quality photocopies are preferred
    B: Items must be original documents; no photocopies will be accepted
    C: Digital copies on a smartphone are acceptable
    D: Notarized photocopies are required for all secondary proofs
  answer: B
  explanation: 'The manual explicitly states: ''Items must be original documents.
    No photocopies will be accepted!'''
- id: 175
  category: penalties_and_points
  question: What is the late fee if your driver license has been expired for more
    than thirty (30) calendar days but less than six months?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: According to the manual, if your license has expired more than thirty
    (30) calendar days, there will be a five-dollar ($5.00) late fee. After six months,
    the fee doubles to $10.00.
- id: 176
  category: license_system
  question: If you let five (5) years go by without renewing your driver license,
    what must you do to renew it?
  choices:
    A: Pay a $50 late fee
    B: Pass the vision screening, knowledge, and skills test
    C: Take an approved driver education course
    D: Wait 180 days before applying for a new license
  answer: B
  explanation: If you let five (5) years go by without renewing, not only will you
    have to pay the $10.00 late fee, you will also have to pass the vision screening,
    knowledge, and skills test.
- id: 177
  category: driver_responsibility
  question: By state law, how many days do you have to notify the Department of Safety
    if your residence address changes?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: If your residence address changes, you are required by state law to
    notify the Department of Safety within ten (10) days of this change.
- id: 178
  category: license_system
  question: When giving the Department of Safety your new address, which of the following
    is NOT accepted by itself as a residential address?
  choices:
    A: A house number and street
    B: An apartment number and road
    C: A post office box
    D: A highway number and city
  answer: C
  explanation: By law, your license must show your legal residential address. A post
    office box alone will not be accepted as a residential address.
- id: 179
  category: license_system
  question: Who is exempt from participating in the Graduated Driver License (GDL)
    Program?
  choices:
    A: Anyone who is 16 years old and has a job
    B: Persons under 18 who have graduated high school or received their GED
    C: Anyone who has held an out-of-state permit for 90 days
    D: Persons who are 17 years old and have completed driver's education
  answer: B
  explanation: The GDL law does not apply to anyone age 18 or older or to those persons
    under 18 who have graduated high school or received a GED.
- id: 180
  category: license_system
  question: What is the minimum age to obtain a Learner Permit in Tennessee?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: B
  explanation: To obtain a Learner Permit, you must be 15 years old and pass the standard
    written exams and vision screening.
- id: 181
  category: safe_driving_rules
  question: Between what hours is a person holding a Learner Permit prohibited from
    driving?
  choices:
    A: 8 P.M. and 6 A.M.
    B: 9 P.M. and 5 A.M.
    C: 10 P.M. and 6 A.M.
    D: 11 P.M. and 7 A.M.
  answer: C
  explanation: Drivers holding a Learner Permit may not drive between the hours of
    10 P.M. and 6 A.M.
- id: 182
  category: safe_driving_rules
  question: 'When driving with a Learner Permit, you must be accompanied by a licensed
    driver who is at least:'
  choices:
    A: 18 years old and riding in the front seat
    B: 21 years old and riding in the front seat
    C: 21 years old and riding anywhere in the vehicle
    D: 25 years old and riding in the front seat
  answer: B
  explanation: You may drive a car only when accompanied by a licensed driver 21 years
    or older who is riding in the front seat of the vehicle.
- id: 183
  category: driver_testing
  question: To obtain an Intermediate Restricted License, you must have verification
    of how many hours of driving experience?
  choices:
    A: 30 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (10 at night)
    D: 60 hours (15 at night)
  answer: C
  explanation: You must have verification from a parent, legal guardian or licensed
    driving instructor stating you have completed fifty hours (ten hours at night)
    of driving experience.
- id: 184
  category: license_system
  question: 'To apply for the Intermediate Unrestricted License, you must be at least
    17 years old and have held an Intermediate Restricted License for:'
  choices:
    A: 90 days
    B: 180 days
    C: 1 year
    D: 2 years
  answer: C
  explanation: To apply for the Intermediate Unrestricted from the Intermediate Restricted
    License, you must be 17 years old and have held an Intermediate Restricted License
    for 1 year.
- id: 185
  category: penalties_and_points
  question: Which of the following will prevent you from moving from an Intermediate
    Restricted to an Intermediate Unrestricted License?
  choices:
    A: Having 1 safety belt violation
    B: Accumulating 4 points on your driving record
    C: Having a traffic accident that was your fault
    D: Failing to take an additional written test
  answer: C
  explanation: To move to the Intermediate Unrestricted License, you cannot have had
    a traffic accident that was your fault. (You also cannot have 2 safety belt violations,
    or more than 6 points, and no additional tests are required).
- id: 186
  category: license_system
  question: Effective July 1, 2018, all licenses issued to persons under 21 years
    of age are printed in what format?
  choices:
    A: Horizontal format
    B: Vertical format
    C: Square format
    D: Holographic format
  answer: B
  explanation: Effective July 1, 2018 all licenses issued to persons under 21 years
    of age are in a vertical format.
- id: 187
  category: driver_responsibility
  question: What is the grace period for driving a vehicle after your driver license
    expires?
  choices:
    A: 10 days
    B: 30 days
    C: 6 months
    D: There is no grace period
  answer: D
  explanation: These are no 'grace periods.' When your license expires, you are no
    longer entitled to drive a vehicle or motorcycle.
- id: 188
  category: license_system
  question: If you are 15 years old and have a valid permit from your previous state,
    how can that out-of-state permit time count toward your 180-day Tennessee requirement?
  choices:
    A: You must provide a certified driving record from your previous state issued
      within 30 days of application
    B: You must take a new road test immediately
    C: You must have your previous state's governor sign a waiver
    D: Out-of-state permit time cannot be counted under any circumstances
  answer: A
  explanation: The length of time that you held the permit in your previous state
    may be included in the 180-day period as long as you can provide a certified driving
    record from your previous state issued within the thirty (30) days immediately
    preceding the date of the Tennessee application.
- id: 189
  category: driver_responsibility
  question: 'Under the Federal Driver Privacy Protection Act (DPPA), the Department
    of Safety will not release your personal information for a mailing list without:'
  choices:
    A: A court order
    B: Your express consent
    C: A background check
    D: A $10 processing fee
  answer: B
  explanation: The Federal Driver Privacy Protection Act (DPPA) prohibits the dissemination
    or disclosure of personal information from a motor vehicle record without the
    'express consent' of that driver.
- id: 190
  category: license_system
  question: If a new resident under 18 is providing a certified driving record from
    their previous state, within how many days of the Tennessee application must it
    be issued?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The certified driving record must be issued within the thirty (30)
    days immediately preceding the date of the Tennessee application.
- id: 191
  category: license_system
  question: Which of the following license levels does NOT require the driver to carry
    a Restriction Card?
  choices:
    A: Learner Permit
    B: Intermediate Restricted Class D
    C: Intermediate Unrestricted Class D
    D: Both Learner Permit and Intermediate Restricted
  answer: C
  explanation: A driver with the second level Intermediate Unrestricted (IU) Class
    D does not have any restrictions on driving. Therefore there is no restriction
    card for this license level.
- id: 192
  category: penalties_and_points
  question: What is the penalty if a teen with an Intermediate Restricted license
    is convicted of forging a letter of parental approval?
  choices:
    A: 90 days added to the Intermediate Restricted period
    B: Revocation of the license and re-issuance of a Learner Permit until age 18
    C: Completion of a certified driver education course
    D: A 6-month suspension of all driving privileges
  answer: B
  explanation: According to the GDL Penalties table, a forged letter of parental approval
    after an Intermediate Restricted license is issued results in the revocation of
    the Intermediate Restricted and re-issuance of a Learner Permit only until the
    teen reaches the age of 18.
- id: 193
  category: penalties_and_points
  question: What penalty applies to a driver holding an Intermediate Restricted license
    who is convicted of a 2nd moving violation?
  choices:
    A: They must maintain a Learner Permit until age 18
    B: 90 days are added to their Intermediate Restricted period
    C: They must complete a certified driver education course
    D: Their license is suspended for 180 days
  answer: C
  explanation: The GDL Penalties table states that a conviction of a 2nd moving violation
    after an Intermediate Restricted license is issued requires the completion of
    a certified driver education course.
- id: 194
  category: driver_responsibility
  question: What responsibility does an adult assume when they sign a Minor/Teenage
    Affidavit and Cancellation form for an applicant under eighteen?
  choices:
    A: They must ride in the passenger seat at all times
    B: They assume financial responsibility for the minor driver
    C: They must pay for the minor's vehicle registration
    D: They are required to log 50 hours of driving time with the minor
  answer: B
  explanation: The Minor/Teenage Affidavit confirms that the adult signing the form
    joins in the application for the license and will be responsible for the actions
    of the minor driver. This includes assuming financial responsibility.
- id: 195
  category: license_system
  question: If a minor applies for an additional class of license, such as a motorcycle
    license, what is required from the parents or legal guardian?
  choices:
    A: They must sign a second teenage affidavit for that license type
    B: They must pay a double application fee
    C: They must take a motorcycle safety course with the minor
    D: No additional documentation is required
  answer: A
  explanation: If a minor applies for an additional class of license (such as motorcycle),
    the parents or legal guardian will be required to sign a second teenage affidavit
    for that license type.
- id: 196
  category: license_system
  question: How long is the Certificate of Compulsory School Attendance (Form SF1010)
    valid after being signed by a school official during the regular school year?
  choices:
    A: 10 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The applicant must take the original, completed form to the Driver
    Service Center. This form is only valid for thirty (30) days from the date of
    signing by the school official.
- id: 197
  category: license_system
  question: If a Certificate of Compulsory School Attendance (Form SF1010) is signed
    within the last 30 days of the school year, how long is it accepted?
  choices:
    A: Only until the last day of the school year
    B: Throughout the summer until 30 days after the start of the following school
      year
    C: For exactly 90 days from the date of signing
    D: Until the student's 18th birthday
  answer: B
  explanation: During the traditional summer vacation months, a properly completed
    SF1010 form signed within the last 30 days of the school year will be accepted
    throughout the summer until 30 days after the start of the following school year.
- id: 198
  category: license_system
  question: Which of the following documents is NOT acceptable as proof of compliance
    with the school attendance law for a minor applying for a license?
  choices:
    A: An original high school diploma
    B: A Certificate of Compulsory School Attendance (Form SF1010)
    C: Grade cards or school transcripts
    D: A letter from the local director of schools for home-schooled applicants
  answer: C
  explanation: Grade cards or school transcripts are not acceptable as proof of compliance
    with this law. Due to the various grading scales... Driver License personnel are
    not authorized to interpret the information in these documents.
- id: 199
  category: penalties_and_points
  question: What happens to the driving privileges of a student fifteen years old
    or older who drops out of school?
  choices:
    A: They are restricted to driving only to and from work
    B: The Department of Safety suspends the student's driving privileges
    C: They must pay a fine to keep their license
    D: They are downgraded to a Learner Permit
  answer: B
  explanation: If a student fifteen years old or older drops out of school, the school
    is required to notify the Department of Safety which suspends the student’s driving
    privileges.
- id: 200
  category: license_system
  question: What type of license may be issued to an applicant under age 18 upon graduating
    from high school or receiving a GED?
  choices:
    A: A Learner Permit only
    B: An Intermediate Restricted license
    C: A regular Class D operator's license
    D: A Hardship license
  answer: C
  explanation: Upon graduating from high school or after receiving a GED before age
    18, a regular Class D operator’s license may be issued.
- id: 201
  category: license_system
  question: If a 16-year-old applicant held an out-of-state license for less than
    90 days, what combined period must they have held a valid learner permit and/or
    license to get an Intermediate Restricted License?
  choices:
    A: At least 60 days
    B: At least 90 days
    C: At least 180 days
    D: At least 365 days
  answer: C
  explanation: If the applicant had an out-of-state license for LESS than 90 days,
    the driving record must confirm that a valid learner permit and/or license class
    has been held for a combined period of at least 180 days.
- id: 202
  category: penalties_and_points
  question: If a teen with a Learner Permit accumulates six or more points on their
    driving record, what is the penalty?
  choices:
    A: They must hold the permit until they maintain a record with less than 6 points
      for 180 consecutive days
    B: Their permit is revoked until age 18
    C: They must complete a certified driver education course
    D: They are immediately issued an Intermediate Restricted license
  answer: A
  explanation: According to the GDL Penalties table, accumulating six or more points
    after a Learner Permit is issued requires the applicant to continue to hold the
    learner permit for an additional time period until they are able to maintain a
    record with less than 6 points for 180 consecutive days.
- id: 203
  category: penalties_and_points
  question: What happens if a teen commits a 2nd seatbelt violation during their Intermediate
    Restricted period, but the Department of Safety is not notified until after they
    are issued an Intermediate Unrestricted license?
  choices:
    A: The violation is forgiven and no penalty applies
    B: The teen's license is permanently revoked
    C: The teen will be dropped back to an Intermediate Restricted license for 90
      days
    D: The teen must pay a $500 fine
  answer: C
  explanation: If any of the violations listed... occurred during the time the teen
    had an Intermediate Restricted license, but the DOS did not receive notice...
    until after we had already issued the teen an Intermediate Unrestricted license...
    The teen will be 'dropped back' to an Intermediate Restricted license for 90 days.
- id: 204
  category: penalties_and_points
  question: What happens the second time a student drops out of school?
  choices:
    A: They must pay a $50 fine.
    B: They must wait until they turn 18 to apply for a license again.
    C: They must wait 6 months to reapply.
    D: They permanently lose their driving privileges.
  answer: B
  explanation: According to the manual, the second time a student drops out, he or
    she must wait to turn eighteen (18) years old before being eligible to apply for
    a license again.
- id: 205
  category: license_system
  question: What is the reinstatement fee for a student who dropped out but returns
    to school to regain their driving privileges?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: The manual states that a student returning to school will be required
    to pay a $20 reinstatement fee, in addition to the appropriate application and
    license fees.
- id: 206
  category: penalties_and_points
  question: What is a consequence for a learner permit holder caught using a cell
    phone while driving?
  choices:
    A: A 180-day suspension of their permit
    B: 6 points added to their driving record
    C: A $100 fine
    D: Immediate revocation of their permit until age 18
  answer: B
  explanation: The consequences of conviction for a teen using a cell phone while
    driving include a Class C misdemeanor, a $50 fine, 6 points added to a minor's
    driving record, and a 90-day delay in eligibility for an Intermediate Restricted
    Driver License.
- id: 207
  category: safe_driving_rules
  question: What is the maximum fine for a texting while driving violation?
  choices:
    A: $20
    B: $50
    C: $100
    D: $250
  answer: B
  explanation: Violations for texting while driving can result in a fine not to exceed
    Fifty Dollars ($50) and court costs not to exceed Ten Dollars.
- id: 208
  category: defensive_driving
  question: According to the manual, what causes most work zone accidents?
  choices:
    A: Speeding
    B: Head-on collisions
    C: Rear-end collisions
    D: Distracted driving
  answer: C
  explanation: 'The manual explicitly states under work zone safety tips: "Don''t
    tailgate! Most work zone accidents are caused by rear-end collisions."'
- id: 209
  category: safe_driving_rules
  question: What should you do with your vehicle's headlights when approaching a work
    zone?
  choices:
    A: Turn them off to avoid blinding workers
    B: Flash them to alert workers of your presence
    C: Turn them on only if it is raining
    D: Turn them on before you enter the zone
  answer: D
  explanation: The manual advises drivers to "Turn your lights on before you enter
    the zone! Turn on your vehicle's headlights to become more visible to workers
    and other motorists."
- id: 210
  category: license_system
  question: What are the driving hour restrictions for a learner permit holder under
    the age of 18?
  choices:
    A: Prohibited from driving between 10 p.m. and 6 a.m.
    B: Prohibited from driving between 11 p.m. and 6 a.m.
    C: Prohibited from driving between 9 p.m. and 5 a.m.
    D: Prohibited from driving between midnight and 6 a.m.
  answer: A
  explanation: Anyone under the age of 18 who has a learner permit is prohibited from
    driving between the hours of 10 p.m. and 6 a.m.
- id: 211
  category: license_system
  question: How long must a teen under 18 hold a learner permit before applying for
    an Intermediate Restricted license?
  choices:
    A: A minimum of 3 months
    B: A minimum of 6 months
    C: A minimum of 9 months
    D: A minimum of 1 year
  answer: B
  explanation: Anyone under the age of 18 must have their learner permit for a minimum
    of six months before applying for an intermediate restricted license.
- id: 212
  category: license_system
  question: If a learner permit holder accumulates 6 or more points on their driving
    record, what must happen before they can apply for an Intermediate Restricted
    license?
  choices:
    A: They must pay a $50 reinstatement fee.
    B: They must complete a defensive driving course.
    C: They must maintain a record with less than 6 points for 180 consecutive days.
    D: They must wait until they turn 18.
  answer: C
  explanation: If someone with a learner permit has driving offenses adding up to
    6 or more points, they must continue to hold the learner permit until their record
    has less than 6 points for a full 180 consecutive days.
- id: 213
  category: safe_driving_rules
  question: How many passengers is an Intermediate Restricted License holder allowed
    to have in the vehicle without any qualifying exceptions?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Those with an intermediate license can only have 1 other passenger
    in the vehicle, unless specific exceptions are met (such as a passenger 21 or
    older with an unrestricted license, or siblings with a parent's letter).
- id: 214
  category: license_system
  question: Between what hours is an Intermediate Restricted License holder generally
    prohibited from driving?
  choices:
    A: 9 p.m. and 6 a.m.
    B: 10 p.m. and 6 a.m.
    C: 11 p.m. and 6 a.m.
    D: Midnight and 5 a.m.
  answer: C
  explanation: Those with an Intermediate Restricted License are prohibited from driving
    between the hours of 11 p.m. and 6 a.m., unless they meet specific exemption circumstances.
- id: 215
  category: penalties_and_points
  question: What is the penalty for an Intermediate Restricted License holder caught
    with a forged letter giving permission to drive outside allowed hours?
  choices:
    A: A $50 fine and 6 points on their record
    B: License revocation and reissuance of a learner permit until age 18
    C: A 90-day suspension of their license
    D: Immediate vehicle impoundment
  answer: B
  explanation: A driver with an Intermediate Restricted License who is convicted of
    having a forged or fraudulent letter will have his/her Intermediate Restricted
    License revoked and will only be reissued a learner permit until he/she reaches
    the age of 18.
- id: 216
  category: license_system
  question: How long must an Intermediate Restricted License be held before applying
    for an unrestricted Intermediate license?
  choices:
    A: 6 months
    B: 1 year
    C: 18 months
    D: 2 years
  answer: B
  explanation: Teens must hold their Intermediate Restricted License for a minimum
    of one year before they can apply for an unrestricted Intermediate license.
- id: 217
  category: sharing_the_road
  question: Who makes up four out of five deaths in highway work zones?
  choices:
    A: Construction workers
    B: Pedestrians
    C: Drivers
    D: Flaggers
  answer: C
  explanation: According to the manual, statistics show that drivers comprise four
    out of five deaths in highway work zones.
- id: 218
  category: safe_driving_rules
  question: 'An Intermediate Restricted License holder may drive between 4 a.m. and
    6 a.m. if they are:'
  choices:
    A: Driving to or from a friend's house
    B: Driving to or from hunting or fishing and possess a valid hunting or fishing
      license
    C: Driving to a gym or fitness center
    D: Accompanied by a sibling who is at least 18 years old
  answer: B
  explanation: An exception to the 11 p.m. to 6 a.m. curfew is if the driver is driving
    to or from hunting or fishing between 4 a.m. and 6 a.m. and has in their possession
    a valid hunting or fishing license.
- id: 219
  category: penalties_and_points
  question: Which of the following will cause a 90-day delay in becoming eligible
    for an Unrestricted Intermediate License?
  choices:
    A: Receiving 4 points on your driving record
    B: Being convicted of a first seatbelt violation
    C: Contributing to a traffic crash
    D: Driving after 10:00 PM
  answer: C
  explanation: A teen driver will be ineligible for an Unrestricted Intermediate License
    for an additional 90 days if they have contributed to a traffic crash, received
    6 or more points, or been convicted of a second seatbelt violation.
- id: 220
  category: penalties_and_points
  question: If a teen driver gets a second moving violation while holding an Intermediate
    Restricted Driver License, what must they do before receiving an Unrestricted
    license?
  choices:
    A: Pay a $50 fine
    B: Wait an additional 6 months
    C: Complete an approved Driver Education class
    D: Retake the road skills test
  answer: C
  explanation: If the teen driver gets a second moving violation while holding the
    Intermediate Restricted Driver License, an approved Driver Education class MUST
    BE COMPLETED before receiving an Intermediate Unrestricted Driver License.
- id: 221
  category: license_system
  question: What is the driving curfew for a teen holding a Learner Permit (Class
    PD)?
  choices:
    A: Cannot drive between 9:00 PM and 5:00 AM
    B: Cannot drive between 10:00 PM and 6:00 AM
    C: Cannot drive between 11:00 PM and 6:00 AM
    D: Cannot drive between midnight and 6:00 AM
  answer: B
  explanation: The restrictions for a Learner Permit (Class PD) state that the driver
    cannot drive between 10:00 PM and 6:00 AM.
- id: 222
  category: driver_testing
  question: What is the mandatory waiting period after failing the knowledge test?
  choices:
    A: There is no waiting period
    B: 1 day
    C: 7 days
    D: 30 days
  answer: B
  explanation: A mandatory 1-day waiting period is required after failing the knowledge
    test.
- id: 223
  category: driver_testing
  question: What happens if an applicant is caught cheating on a required driver license
    examination?
  choices:
    A: They receive a warning and must restart the test
    B: They fail automatically and cannot re-attempt the test for 7 days
    C: They fail automatically and cannot re-attempt the test for 30 days
    D: They are permanently banned from obtaining a driver license
  answer: C
  explanation: Any form of cheating by an applicant on a required examination will
    result in an automatic failure and the applicant will not be allowed to re-attempt
    the test for 30 days.
- id: 224
  category: driver_testing
  question: What is the minimum vision requirement to pass the vision screening for
    a driver license?
  choices:
    A: 20/20 vision in each eye
    B: 20/30 vision in each eye
    C: 20/40 vision in each eye individually and both eyes together
    D: 20/50 vision in at least one eye
  answer: C
  explanation: An applicant is required to have at least 20/40 vision in each eye
    individually and both eyes together. This may be with or without glasses or contact
    lenses.
- id: 225
  category: driver_testing
  question: Which of the following is NOT permitted during the computerized knowledge
    test?
  choices:
    A: Taking the test in Spanish
    B: Using a translation dictionary with no notes or handwriting
    C: Taking the test in Korean
    D: Using an electronic dictionary or smart phone
  answer: D
  explanation: The use of Personal Digital Assistants (PDAs), Smart Phones, Electronic
    Dictionaries and other similar electronic devices are NOT allowed during testing.
- id: 226
  category: driver_testing
  question: What percentage of the knowledge test is dedicated to Drugs and alcohol?
  choices:
    A: 10%
    B: 15%
    C: 25%
    D: 50%
  answer: C
  explanation: The knowledge test consists of four areas, with Drugs and alcohol making
    up 25% of the exam.
- id: 227
  category: license_system
  question: What is the format of all driver licenses issued to persons under 21 years
    of age?
  choices:
    A: Horizontal format
    B: Vertical format
    C: Square format
    D: Color-coded red format
  answer: B
  explanation: Effective July 1, 2018 all licenses issued to persons under 21 years
    of age are in a vertical format.
- id: 228
  category: driver_testing
  question: Under what weather conditions are road tests NOT given?
  choices:
    A: Light rain
    B: Overcast skies
    C: Extreme weather such as heavy rain, dense fog, or icy roads
    D: Temperatures below 40 degrees
  answer: C
  explanation: Road tests are not given in extreme weather (heavy rain/snow, dense
    fog, hail, high winds, icy roads, etc.).
- id: 229
  category: license_system
  question: How many hours of behind-the-wheel experience must be certified to obtain
    an Intermediate Restricted license?
  choices:
    A: 30 hours, including 5 at night
    B: 40 hours, including 10 at night
    C: 50 hours, including 10 at night
    D: 60 hours, including 15 at night
  answer: C
  explanation: To obtain an Intermediate Restricted license, you must provide certification
    of 50 hours behind-the-wheel experience, including 10 hours at night.
- id: 230
  category: driver_testing
  question: If an applicant under age 18 requests an oral knowledge test due to a
    learning disability, what must they provide?
  choices:
    A: A parent or legal guardian to read the test to them
    B: A written statement from a physician or educational specialist
    C: A certified sign language interpreter
    D: Proof of high school graduation
  answer: B
  explanation: If the applicant requesting an oral test is under age eighteen (18),
    a written statement from a physician or educational specialist stating that the
    applicant has a medical condition or learning disability will be required before
    the test can be administered.
- id: 231
  category: driver_testing
  question: What is the minimum vision requirement for an applicant to be issued a
    driver's license or permit?
  choices:
    A: 20/20 vision in each eye
    B: 20/30 vision in each eye
    C: 20/40 vision in each eye individually and both eyes together
    D: 20/50 vision in at least one eye
  answer: C
  explanation: An applicant is required to have at least 20/40 vision in each eye
    individually and both eyes together, with or without glasses or contact lenses.
- id: 232
  category: driver_testing
  question: If you fail the driver license knowledge test, how long must you wait
    before you can attempt the examination again?
  choices:
    A: You can retake it immediately
    B: A minimum of one day
    C: Seven days
    D: Thirty days
  answer: B
  explanation: A mandatory 1-day waiting period is required after failing any driver
    license knowledge test before returning to attempt it again.
- id: 233
  category: driver_testing
  question: What will happen if you are more than 5 minutes late for your scheduled
    road skills test appointment?
  choices:
    A: You will lose 5 points on your driving test
    B: The examiner will skip the pre-trip vehicle inspection
    C: You must pay a late fee before testing
    D: Your road skills test will be canceled and you will need to reschedule
  answer: D
  explanation: If you are more than 5 minutes late for your appointment time, your
    road skills test will be canceled and you will need to reschedule for a later
    date.
- id: 234
  category: driver_testing
  question: Under which of the following weather conditions will a road test NOT be
    given?
  choices:
    A: Light rain
    B: Moderate fog
    C: Light snow
    D: Heavy rain and thunderstorms
  answer: D
  explanation: Road tests will NOT be given in heavy rain, thunderstorms, thick fog
    cover, when roads are flooded, covered/packed with snow and ice, or during severe
    weather warnings.
- id: 235
  category: vehicle_information
  question: Any passenger motor vehicle manufactured or assembled in what year or
    later must be equipped with safety belts?
  choices:
    A: '1959'
    B: '1969'
    C: '1979'
    D: '1989'
  answer: B
  explanation: Any passenger motor vehicle manufactured or assembled in 1969 or later
    must be equipped with safety belts and must be in good usable condition.
- id: 236
  category: vehicle_information
  question: How many white headlights is a motor vehicle permitted to have?
  choices:
    A: Exactly two
    B: At least two but no more than four
    C: At least four
    D: One to four
  answer: B
  explanation: Motor vehicles must be equipped with at least two headlights but no
    more than four white headlights.
- id: 237
  category: vehicle_information
  question: For a passenger car, window tinting material must transmit at least what
    percentage of visible light?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 75%
  answer: B
  explanation: For a passenger car, no material which transmits less than 35% of visible
    light may be attached to any window.
- id: 238
  category: vehicle_information
  question: Passenger cars must have bumpers that are within what range of height
    from the ground?
  choices:
    A: 10 to 15 inches
    B: 14 to 22 inches
    C: 14 to 31 inches
    D: 20 to 30 inches
  answer: B
  explanation: Passenger cars must have bumpers which are within a range of 14 to
    22 inches from the ground.
- id: 239
  category: driver_testing
  question: Who is allowed in the vehicle with you during your driving test?
  choices:
    A: You, the examiner, and one parent or guardian
    B: Only you and the examiner (or other authorized personnel)
    C: You, the examiner, and a language translator
    D: You, the examiner, and your driving instructor
  answer: B
  explanation: The only people allowed in the vehicle are you and the examiner (or
    other authorized personnel). No animal may be in the vehicle.
- id: 240
  category: driver_testing
  question: Which of the following actions will result in an immediate automatic failure
    of the road test?
  choices:
    A: Asking the examiner to repeat a direction
    B: A violation of any traffic law
    C: Braking too hard at a stop sign
    D: Failing to defog the windshield before starting
  answer: B
  explanation: 'The applicant will be failed immediately for any of the following:
    Violation of any traffic law, lack of cooperation, any dangerous action, or contributing
    to an accident.'
- id: 241
  category: driver_testing
  question: According to the retesting guidelines, if you commit 7 to 9 errors on
    your skills test, how long is the mandatory practice period before you can retest?
  choices:
    A: Next (1) Day
    B: Seven (7) Days
    C: Fourteen (14) Days
    D: Thirty (30) Days
  answer: A
  explanation: According to the Guidelines for Retesting Table 4.2, committing 7 to
    9 errors/points requires a mandatory practice time period until the Next (1) Day.
- id: 242
  category: driver_testing
  question: If you automatically fail the driving test or commit 16 or more errors,
    how long must you wait before you are allowed to retest?
  choices:
    A: Next (1) Day
    B: Seven (7) Days
    C: Fourteen (14) Days
    D: Thirty (30) Days
  answer: D
  explanation: According to Table 4.2, 16 or more errors/points OR an Automatic Failure
    requires a mandatory practice time period of Thirty (30) Days.
- id: 243
  category: vehicle_information
  question: By law, all automobiles must have which two separate methods of applying
    brakes?
  choices:
    A: Front brakes and rear brakes
    B: A regular foot brake and a parking brake
    C: Anti-lock brakes and standard brakes
    D: A hand brake and an engine brake
  answer: B
  explanation: By law all automobiles must have two separate methods of applying brakes.
    They must have a regular foot brake and a parking brake.
- id: 244
  category: driver_testing
  question: How early should you plan to arrive at the Driver License Service Center
    prior to your scheduled road test appointment?
  choices:
    A: At the exact appointment time
    B: At least 5 minutes prior
    C: At least 15 minutes prior
    D: At least 30 minutes prior
  answer: C
  explanation: You should plan to arrive at the Driver License Service Center at least
    15 minutes prior to your scheduled appointment time to allow for paperwork processing.
- id: 245
  category: vehicle_information
  question: What is the rule regarding tinting material affixed to the windshield
    of a motor vehicle?
  choices:
    A: It must transmit at least 35% of visible light
    B: It is allowed if it transmits 50% of visible light
    C: No tinting material may be affixed to the windshield
    D: It is allowed only on the top 4 inches of the windshield
  answer: C
  explanation: 'The manual states: ''No tinting material may be affixed to the windshield
    of any motor vehicle.'''
- id: 246
  category: driver_testing
  question: What is the mandatory practice time period before retesting if an applicant
    commits 16 or more errors or has an automatic failure on the skills test?
  choices:
    A: Seven (7) Days
    B: Fourteen (14) Days
    C: Thirty (30) Days
    D: Ninety (90) Days
  answer: C
  explanation: The manual states that 16 or more errors/points, or an automatic failure,
    requires a mandatory practice time period of Thirty (30) Days before a retest
    is allowed.
- id: 247
  category: driver_testing
  question: How early should you arrive before your scheduled Road Test appointment?
  choices:
    A: At least 5 minutes
    B: At least 10 minutes
    C: At least 15 minutes
    D: At least 30 minutes
  answer: C
  explanation: You should arrive at least 15 minutes before your scheduled Road Test
    appointment to allow time for application paperwork.
- id: 248
  category: driver_testing
  question: Your road test appointment will have to be rescheduled if you are late
    by at least how many minutes?
  choices:
    A: 5 minutes
    B: 10 minutes
    C: 15 minutes
    D: 20 minutes
  answer: A
  explanation: To ensure timely service, if you are five (5) or more minutes late
    for the start of your road test appointment, it will have to be rescheduled.
- id: 249
  category: driver_testing
  question: Teenagers between the ages of 15 to 17 can take their written knowledge
    test online under the supervision of a parent or legal guardian using which application?
  choices:
    A: Tennessee Driver Portal App
    B: Tennessee Proctor Identification (PID) App
    C: TDOSHS Secure Test App
    D: Tennessee Teen Driver App
  answer: B
  explanation: Teenagers ages 15 to 17 can take the written test online under a proctor's
    supervision via the Tennessee Proctor Identification (PID) App.
- id: 250
  category: safe_driving_rules
  question: Why is it dangerous to drive with your seat in a reclined or semi-reclined
    position?
  choices:
    A: It increases the risk of the seatbelt unlatching.
    B: It reduces both your vision and your ability to react to emergency situations.
    C: It causes the steering wheel to lock.
    D: It prevents the airbags from deploying.
  answer: B
  explanation: 'The manual explicitly states: ''DO NOT DRIVE WITH THE SEAT IN A RECLINED
    OR SEMI-RECLINED POSITION. This is dangerous and reduces both your vision and
    your ability to react to emergency situations.'''
- id: 251
  category: vehicle_information
  question: To prevent serious head or neck injuries from an air bag deployment, your
    body should be positioned how far back from the steering wheel?
  choices:
    A: 4 to 6 inches
    B: 6 to 8 inches
    C: 10 to 12 inches
    D: 15 to 18 inches
  answer: C
  explanation: Your body should be about 10 to 12 inches back from the steering wheel.
    Sitting closer could result in serious head or neck injuries from an air bag hitting
    the chin or face.
- id: 252
  category: vehicle_information
  question: 'When adjusting your seat and steering column, the top of the steering
    wheel should be no higher than:'
  choices:
    A: The top of your shoulders.
    B: Your chin.
    C: Your nose.
    D: The top of your head.
  answer: A
  explanation: The manual states that the top of the steering wheel should be no higher
    than the top of the shoulders.
- id: 253
  category: vehicle_information
  question: 'Properly adjusted seat head restraints should be set to a level even
    with the back of the head to prevent:'
  choices:
    A: Airbag injuries.
    B: Whiplash if hit from behind.
    C: Drowsiness while driving.
    D: Blind spots.
  answer: B
  explanation: Properly adjust seat head restraints to a level even with the back
    of the head. Head restraints are designed to prevent whiplash if hit from behind.
- id: 254
  category: safe_driving_rules
  question: When preparing to drive, when should you adjust your mirrors?
  choices:
    A: Before adjusting your seat.
    B: After the seat is adjusted correctly.
    C: While driving at a low speed.
    D: Only after checking your blind spots.
  answer: B
  explanation: The manual instructs drivers to adjust mirrors after the seat is adjusted
    correctly, and always before driving.
- id: 255
  category: vehicle_information
  question: 'To properly adjust the driver''s side-view (left) mirror, you should
    place your head against the left side window and set the mirror so you can:'
  choices:
    A: See the entire rear bumper of your car.
    B: See the center console of your vehicle.
    C: Barely see the side of your car in the right side of the mirror.
    D: See the rear window completely framed.
  answer: C
  explanation: To adjust the left side mirror, place your head against the left side
    window and set the mirror so you can just barely see the side of your car in the
    right side of the mirror.
- id: 256
  category: vehicle_information
  question: How should you position your head to properly adjust the passenger's side-view
    (right) mirror?
  choices:
    A: Against the left side window.
    B: Just above the center console.
    C: Against the passenger side window.
    D: Looking straight ahead at the windshield.
  answer: B
  explanation: To adjust the passenger's side-view mirror, position your head so that
    it is just above the center console.
- id: 257
  category: defensive_driving
  question: Even with properly adjusted mirrors, what must you always do before attempting
    to turn or change lanes?
  choices:
    A: Honk your horn to warn other drivers.
    B: Turn your head and check blind spots.
    C: Flash your headlights twice.
    D: Rely entirely on your rearview mirror.
  answer: B
  explanation: Even properly positioned mirrors cannot eliminate all blind spots.
    Always turn your head and check blind spots when you want to turn or change lanes.
- id: 258
  category: safe_driving_rules
  question: How should a lap belt be properly positioned on your body?
  choices:
    A: Loosely across the stomach.
    B: Firmly across the hips.
    C: High on the abdomen.
    D: Across the upper thighs and knees.
  answer: B
  explanation: Lap belts should be positioned firmly across the hips while the shoulder
    belt is firmly across the shoulder.
- id: 259
  category: vehicle_information
  question: Before starting an automatic transmission vehicle, you should place your
    foot on the brake pedal and ensure the gearshift selector is in which position?
  choices:
    A: NEUTRAL
    B: DRIVE
    C: PARK
    D: REVERSE
  answer: C
  explanation: Place foot on brake pedal and ensure gearshift selector is in the PARK
    position for automatic transmissions or in NEUTRAL for manual/standard transmissions.
- id: 260
  category: vehicle_information
  question: What position should the gearshift selector be in before starting an automatic
    transmission vehicle?
  choices:
    A: DRIVE
    B: REVERSE
    C: NEUTRAL
    D: PARK
  answer: D
  explanation: Before starting an automatic transmission vehicle, place your foot
    on the brake pedal and ensure the gearshift selector is in the PARK position.
- id: 261
  category: vehicle_information
  question: In a vehicle with a manual transmission, what must be done before the
    vehicle will start?
  choices:
    A: The clutch must be depressed.
    B: The gearshift must be in first gear.
    C: The accelerator must be pumped twice.
    D: The steering wheel must be locked.
  answer: A
  explanation: In vehicles with manual transmissions, the clutch must be depressed
    before the vehicle will start.
- id: 262
  category: safe_driving_rules
  question: How does turning on low-beam headlights during normal daylight affect
    your vehicle's visibility?
  choices:
    A: It drains the battery and reduces visibility.
    B: It makes the vehicle visible at twice the distance.
    C: It makes the vehicle visible at three times the distance.
    D: It has no effect on visibility during daylight.
  answer: B
  explanation: In normal daylight, vehicles are visible at twice the distance when
    headlights are on.
- id: 263
  category: vehicle_information
  question: When should the lower gears (indicated by "L", "2", or "1") on an automatic
    transmission generally be used?
  choices:
    A: Emergency deceleration if there is a brake failure.
    B: When driving on interstates or expressways.
    C: When backing up in a straight line.
    D: For normal stop-and-go traffic.
  answer: A
  explanation: Lower gears are generally not used except for special or emergency
    situations, such as emergency deceleration if there is a brake failure, driving
    down steep mountain grades, or slow speed driving on slippery roads.
- id: 264
  category: vehicle_information
  question: When driving a standard transmission vehicle, when should you hold the
    clutch pedal all the way down?
  choices:
    A: Whenever you are driving down a steep hill.
    B: When coasting to save gas.
    C: At all times while the vehicle is in motion.
    D: When your speed drops below 10 MPH as you are coming to a stop.
  answer: D
  explanation: You should hold the clutch pedal all the way down when starting, shifting
    gears, and when speed drops below 10 MPH as you are coming to a stop.
- id: 265
  category: safe_driving_rules
  question: What does the manual state about coasting with the gears in neutral?
  choices:
    A: It is recommended for saving fuel.
    B: It is illegal.
    C: It should only be done on steep hills.
    D: It is the safest way to slow down.
  answer: B
  explanation: 'The manual states: "Don’t coast with the gears in neutral (it’s illegal)
    or with the clutch pedal pushed down except when shifting gears."'
- id: 266
  category: safe_driving_rules
  question: What is the basic rule a driver must follow when operating a vehicle with
    a steering wheel interlock system?
  choices:
    A: Always lock the steering wheel before turning the ignition off.
    B: Never turn the ignition to the lock position when the vehicle is in motion.
    C: Never use the interlock system while parked on a hill.
    D: Always keep one hand on the interlock release button.
  answer: B
  explanation: The basic rule is to never turn the ignition to the lock position when
    the vehicle is in motion, because the steering wheel will lock and control of
    the vehicle will be lost.
- id: 267
  category: safe_driving_rules
  question: Why should you avoid driving with your elbow or arm propped on the door
    or out the window?
  choices:
    A: It causes the steering wheel to lock.
    B: It is illegal in the state of Tennessee.
    C: You won't have full control of the steering wheel and a sideswipe could take
      off your arm.
    D: It interferes with the deployment of the side airbags.
  answer: C
  explanation: Don’t develop the habit of driving with your elbow or arm propped on
    the door or out the window. You won’t have full control of the steering wheel
    and a sideswipe could take off your arm.
- id: 268
  category: safe_driving_rules
  question: What is the recommended hand placement on the steering wheel to avoid
    injury from air bag deployment?
  choices:
    A: 10 o'clock and 2 o'clock
    B: 8 o'clock and 4 o'clock
    C: 9 o'clock and 3 o'clock
    D: 12 o'clock and 6 o'clock
  answer: C
  explanation: Drivers should place the left hand at the 9 o’clock position and the
    right hand at 3 o’clock position on the steering wheel. This position helps avoid
    injury from air bag deployment during an accident.
- id: 269
  category: safe_driving_rules
  question: Why is crossing your arms when steering or turning discouraged?
  choices:
    A: It causes the vehicle to accelerate unintentionally.
    B: It is illegal and will result in a failed driving test.
    C: It prevents the driver from using the turn signals.
    D: It may cause clothing and jewelry to interfere with safe turning and worsen
      air bag injuries.
  answer: D
  explanation: Do not cross your arms when steering or turning. Crossing arms may
    cause clothing and jewelry to interfere with safe turning, and you would suffer
    more serious injuries should the air bag deploy.
- id: 270
  category: safe_driving_rules
  question: Why is the Push-Pull steering method recommended for normal everyday driving
    over the Hand-over-Hand method?
  choices:
    A: It allows for quicker wheel movement in emergencies.
    B: It keeps both hands on the steering wheel through the entire maneuver.
    C: It requires less physical effort to turn the wheel.
    D: It is the only method that works with power steering.
  answer: B
  explanation: The Push-Pull method is recommended because it slows down turning movements
    making for a smoother, safer turn. It also keeps both hands on the steering wheel
    through the entire maneuver.
- id: 271
  category: safe_driving_rules
  question: What is the proper hand placement and posture when backing up a vehicle
    with an automatic transmission?
  choices:
    A: Grasp the steering wheel at 12 o'clock with the left hand, turn to the right,
      and place the right arm over the back of the seat.
    B: Grasp the steering wheel at 9 and 3 o'clock and look in the rearview mirror.
    C: Grasp the steering wheel at 6 o'clock with the right hand and look out the
      driver's side window.
    D: Keep both hands on the wheel and rely entirely on the backup camera.
  answer: A
  explanation: When backing, grasp the steering wheel at the 12 o’clock position with
    your left hand, turn to the right, place your right arm over the back of the seat,
    and look over your shoulder through the rear window.
- id: 272
  category: driver_responsibility
  question: Which of the following is true regarding carbon monoxide gas from a car
    engine?
  choices:
    A: It has a strong, distinct odor that warns drivers of a leak.
    B: It appears as a thick black smoke when leaking into the cabin.
    C: It is only dangerous if the vehicle is parked in a closed garage.
    D: It has no taste, no smell, and no visibility, but it can kill.
  answer: D
  explanation: Carbon monoxide gas from a car engine can kill (it has no taste, no
    smell or visibility). It generally leaks when the car heater is running, when
    the exhaust system is not working properly, or in heavy traffic.
- id: 273
  category: defensive_driving
  question: According to the manual, what is the most common type of accident recorded
    annually in Tennessee?
  choices:
    A: Head-on collisions
    B: Sideswipe collisions
    C: Rear-end collisions
    D: Intersection T-bone collisions
  answer: C
  explanation: Like most states, Tennessee reports that rear-end collisions are the
    most common type of accident recorded annually.
- id: 274
  category: safe_driving_rules
  question: If you are stopping at a curb for proper parking, how close should you
    move to the curb?
  choices:
    A: Within 6 inches
    B: Within 12 inches
    C: Within 18 inches
    D: Within 24 inches
  answer: C
  explanation: If stopping at a curb, move to within 18 inches of the curb for proper
    parking.
- id: 275
  category: safe_driving_rules
  question: Which of the following is a recommended way to avoid carbon monoxide poisoning
    in your vehicle?
  choices:
    A: Keep the fresh-air vent open in congested traffic.
    B: Leave the engine running in a closed garage to warm it up.
    C: Do not use a heater or air conditioner in a parked car with the windows closed.
    D: Only check the exhaust system if you smell gas.
  answer: C
  explanation: The manual states to avoid carbon monoxide poisoning, you should 'Do
    not use a heater/air conditioner in a parked car with the windows closed.'
- id: 276
  category: vehicle_information
  question: What are the characteristics of carbon monoxide gas?
  choices:
    A: It has a strong, sweet smell.
    B: It appears as a thick, black smoke.
    C: It has no taste, no smell, and no visibility.
    D: It smells like rotten eggs.
  answer: C
  explanation: According to the manual, carbon monoxide gas from a car engine can
    kill because 'it has not taste, no smell or visibility'.
- id: 277
  category: safe_driving_rules
  question: Under the Hands Free Tennessee law implemented in 2019, which of the following
    actions is illegal for a driver?
  choices:
    A: Using a hands-free navigation device.
    B: Reaching for a cellphone in a manner that requires the driver to no longer
      be properly restrained by a seat belt.
    C: Using a vehicle information system display.
    D: Looking at visual displays for the driver's view behind the vehicle.
  answer: B
  explanation: Public Chapter No. 412 makes it illegal to 'reach for a cellphone or
    mobile device in a manner that requires the driver to no longer be in a seated
    driving position or properly restrained by a seat belt.'
- id: 278
  category: safe_driving_rules
  question: What is the law regarding mobile phone use for drivers 18 years or older
    in a marked school zone when flashers are operating?
  choices:
    A: All phone use is strictly prohibited, including hands-free.
    B: Hand-held phone use is an offense, but hands-free mode is allowed.
    C: Hand-held phone use is allowed if driving under 15 mph.
    D: Only texting is prohibited; hand-held phone calls are allowed.
  answer: B
  explanation: The manual states it is an offense for persons 18 or older to use a
    hand-held mobile phone in a marked school zone with flashers operating, but 'There
    is an exception if the phone is being used in hands free mode.'
- id: 279
  category: vehicle_information
  question: Which of the following video devices is permitted to be visible to the
    driver while the vehicle is in motion?
  choices:
    A: A screen displaying a television broadcast.
    B: A monitor playing a recorded movie.
    C: A global positioning device (GPS).
    D: A tablet broadcasting a live video feed.
  answer: C
  explanation: State law prohibits video monitors displaying TV or video signals visible
    to the driver, but 'A navigation or global positioning device... are not prohibited.'
- id: 280
  category: safe_driving_rules
  question: According to Tennessee safety belt laws, who is required to wear a safety
    belt in the front seat of a moving vehicle?
  choices:
    A: Only the driver.
    B: Only passengers under 18 years old.
    C: All drivers and all passengers in the front seat.
    D: Only the driver and passengers under 17 years old.
  answer: C
  explanation: 'The manual states: ''Safety belts are required for ALL drivers and
    all passengers in the FRONT seat, any time the vehicle is in motion.'''
- id: 281
  category: safe_driving_rules
  question: 'In Tennessee, backseat passengers must wear a safety belt if they are:'
  choices:
    A: Under 17 years old.
    B: 18 years or older.
    C: Sitting behind the driver's seat.
    D: Riding in a vehicle manufactured after 2010.
  answer: A
  explanation: Safety belts are required for BACKSEAT passengers 'If the passengers
    are under 17 years old.' This provision no longer applies when back seat passengers
    are 18 years or older.
- id: 282
  category: safe_driving_rules
  question: What type of child restraint system is required for a child under one
    year old or weighing less than 20 pounds?
  choices:
    A: A forward-facing car seat.
    B: A rear-facing car seat.
    C: A belt-positioning booster seat.
    D: A standard adult seatbelt.
  answer: B
  explanation: 'The manual specifies: ''A child under one year old, or any child weighing
    less than 20 pounds, must be in a child passenger restraint system (car seat)
    that is facing the rear of the car.'''
- id: 283
  category: safe_driving_rules
  question: 'A child who is four through eight years old and under four feet, nine
    inches tall must be secured in:'
  choices:
    A: A rear-facing car seat.
    B: A forward-facing car seat.
    C: A belt-positioning booster seat system.
    D: The front passenger seat with a standard seatbelt.
  answer: C
  explanation: Children who are four through eight years old and whose height is under
    four feet, nine inches, must be in a belt positioning booster seat system and
    wearing a seatbelt.
- id: 284
  category: driver_responsibility
  question: If a child under age 16 is not properly restrained in a vehicle, who is
    generally held responsible and may be fined?
  choices:
    A: The child.
    B: The driver of the vehicle.
    C: The owner of the vehicle, even if not present.
    D: The vehicle manufacturer.
  answer: B
  explanation: The law makes the driver responsible for the protection of children
    up to the age of sixteen. If they are not properly restrained, the driver may
    be charged and fined $50.00.
- id: 285
  category: driver_responsibility
  question: If a child's parent or legal guardian is present in the car but is NOT
    driving, who is responsible for ensuring the child is properly transported?
  choices:
    A: The driver.
    B: The parent or legal guardian.
    C: Both the driver and the parent equally.
    D: The child.
  answer: B
  explanation: 'The manual notes: ''If the child’s parent or legal guardian is present
    in the car but not driving, then the parent or legal guardian is responsible for
    making sure that the child is properly transported and may be fined for non-compliance.'''
- id: 286
  category: defensive_driving
  question: What is the chance of being killed in a crash if you are ejected from
    a vehicle?
  choices:
    A: One in two.
    B: One in four.
    C: One in eight.
    D: One in ten.
  answer: C
  explanation: According to the Safety Belt Facts section, 'The chance of being killed
    in a crash by being ejected from a vehicle is one in eight.'
- id: 287
  category: safe_driving_rules
  question: How should a pregnant woman wear a vehicle's safety belt?
  choices:
    A: The lap belt above the abdomen and the shoulder belt behind the back.
    B: The lap belt below the abdomen and the shoulder belt above the belly.
    C: Only the lap belt, placed directly over the abdomen.
    D: Only the shoulder belt, placed under the arm.
  answer: B
  explanation: 'The manual instructs: ''Pregnant women should wear the lap belt below
    the abdomen and the shoulder belt above the belly.'''
- id: 288
  category: penalties_and_points
  question: What is the maximum fine for a driver caught using a hand-held phone to
    transmit or read a written message while the vehicle is in motion (excluding court
    costs)?
  choices:
    A: Ten Dollars.
    B: Twenty-Five Dollars.
    C: Fifty Dollars.
    D: One Hundred Dollars.
  answer: C
  explanation: Violations for using a hand-held phone to transmit or read a written
    message while in motion 'can result in a fine not to exceed Fifty Dollars, and
    court costs not to exceed Ten Dollars.'
- id: 289
  category: penalties_and_points
  question: What is the penalty for a driver who fails to use a car seat or booster
    seat for a child under nine years old or whose height is less than four feet,
    nine inches?
  choices:
    A: A Class A misdemeanor and license suspension.
    B: A Class C misdemeanor, required class attendance, and possible fees/fines.
    C: A simple $10 fine with no other penalties.
    D: A warning for the first offense and a $50 fine for the second.
  answer: B
  explanation: 'If the violation relates to not using a car seat or booster seat for
    children under nine or under 4''9", the punishment is greater: ''The driver can
    be charged with a Class C misdemeanor, required to attend a class on safely transporting
    children and required to pay possible fees and fines.'''
- id: 290
  category: safe_driving_rules
  question: According to the manual, how much more likely are ejected occupants to
    be killed in a crash compared to those who remain inside the vehicle?
  choices:
    A: Two times more likely
    B: Three times more likely
    C: Four times more likely
    D: Ten times more likely
  answer: C
  explanation: The manual notes that ejected occupants are four times more likely
    to be killed as those who remain inside the vehicle.
- id: 291
  category: vehicle_information
  question: What happens to unfastened passengers when a vehicle is struck from the
    side?
  choices:
    A: They will slide toward the point of the crash.
    B: They will slide away from the point of the crash.
    C: They will be pushed into the back seat.
    D: They will remain stationary while the vehicle moves.
  answer: A
  explanation: When a vehicle is struck from the side, everything that is not fastened
    down, including passengers, will slide toward the point of the crash, not away
    from it.
- id: 292
  category: safe_driving_rules
  question: When is a child considered big enough to transition from a child restraint
    system to using standard vehicle lap and shoulder belts?
  choices:
    A: When they reach 40 pounds in weight.
    B: When they are at least 6 years old.
    C: When they can sit with their back against the seat back and their knees bend
      over the edge.
    D: When they can buckle the seatbelt themselves without assistance.
  answer: C
  explanation: A child is big enough to use the vehicle lap and shoulder belt when
    they can sit with their back against the vehicle seat back and their knees bend
    over the edge of the vehicle seat.
- id: 293
  category: safe_driving_rules
  question: Where should the lap belt lie securely on a child who has graduated to
    using standard vehicle safety belts?
  choices:
    A: Across the stomach
    B: On the upper thigh, low and snug around the hips
    C: Across the ribcage
    D: Loosely over the knees
  answer: B
  explanation: The manual specifies that the lap belt should lie securely on the child's
    upper thigh, low and snug around the hips.
- id: 294
  category: safe_driving_rules
  question: At what age does the manual state children are safer riding in the back
    seat of a vehicle?
  choices:
    A: Ages 8 and under
    B: Ages 10 and under
    C: Ages 12 and under
    D: Ages 15 and under
  answer: C
  explanation: The manual emphasizes that children ages 12 and under are safer in
    the back seat of a vehicle.
- id: 295
  category: vehicle_information
  question: What is the recommended distance a driver should sit from the steering
    wheel to give the air bag room to deploy safely?
  choices:
    A: 4 to 6 inches
    B: 6 to 8 inches
    C: 10 to 12 inches
    D: 15 to 18 inches
  answer: C
  explanation: Ten to twelve inches between the chest and the air bag module is recommended
    by the National Highway Traffic Safety Administration (NHTSA).
- id: 296
  category: penalties_and_points
  question: Under Tennessee law, what is the rule regarding children under the age
    of 6 riding in the bed of a pickup truck?
  choices:
    A: It is legal if they are supervised by an adult.
    B: It is illegal under all circumstances.
    C: It is legal only on county roads.
    D: It is legal if the truck is traveling under 30 mph.
  answer: B
  explanation: It is illegal in Tennessee to allow any child under the age of 6 to
    ride in the bed of a pickup truck.
- id: 297
  category: safe_driving_rules
  question: It is against the law to allow a child between the ages of 6 and 12 to
    ride in the bed of a pickup truck on which type of road?
  choices:
    A: Any state or interstate highway
    B: Any private road
    C: Any dirt road
    D: Any residential driveway
  answer: A
  explanation: It is against the law to allow any child between the ages of 6 and
    12 to ride in the bed of a pickup truck on any state or interstate highway.
- id: 298
  category: safe_driving_rules
  question: Which of the following is an exception that allows a child to ride in
    the bed of a pickup truck?
  choices:
    A: When traveling to a school event
    B: When involved in agricultural activities
    C: When there are no seats left in the cab
    D: When driving to a state park
  answer: B
  explanation: One exception to the law prohibiting children in the bed of a pickup
    truck is when the child is involved in agricultural activities.
- id: 299
  category: penalties_and_points
  question: It is an offense to knowingly leave a child unattended in a motor vehicle
    if the child is younger than what age?
  choices:
    A: 5 years of age
    B: 7 years of age
    C: 9 years of age
    D: 12 years of age
  answer: B
  explanation: It is an offense for a person responsible for a child younger than
    7 years of age to knowingly leave that child unattended in a motor vehicle under
    certain conditions.
- id: 300
  category: safe_driving_rules
  question: If a child under 7 is left in a motor vehicle with the engine running,
    they must be supervised by a person who is at least what age?
  choices:
    A: 10 years of age
    B: 13 years of age
    C: 16 years of age
    D: 18 years of age
  answer: B
  explanation: The law states the child must be supervised in the motor vehicle by
    a person who is at least 13 years of age.
- id: 301
  category: penalties_and_points
  question: What is the penalty for a first offense of leaving a child unattended
    in a motor vehicle under illegal conditions?
  choices:
    A: A Class C misdemeanor and a $50 fine
    B: A Class B misdemeanor and a $200 fine
    C: A Class A misdemeanor and a $500 fine
    D: A felony charge and license suspension
  answer: B
  explanation: A violation of this section is a Class B misdemeanor punishable only
    by a fine of two hundred dollars ($200) for the first offense.
- id: 302
  category: safe_driving_rules
  question: According to the manual, how much more likely are vehicle occupants to
    die in a crash if they are unbelted?
  choices:
    A: 5 times more likely
    B: 10 times more likely
    C: 20 times more likely
    D: 32 times more likely
  answer: D
  explanation: Vehicle occupants were 32 times more likely to die in a crash if they
    were unbelted.
- id: 303
  category: vehicle_information
  question: If a child must ride in the front seat of a pickup truck with a passenger-side
    air bag, what should you do?
  choices:
    A: Turn off the vehicle's engine.
    B: Move the seat back as far as possible and properly buckle the child.
    C: Have the child sit on an adult's lap.
    D: Place the child in a rear-facing safety seat.
  answer: B
  explanation: If a child must ride in the front seat of a vehicle such as a pick-up
    truck with a passenger side air bag, the seat should be moved back as far as possible,
    and the child should be properly buckled up.
- id: 304
  category: safe_driving_rules
  question: On a mild day with an outside temperature of 73 degrees, how hot can the
    interior of an SUV get in just 10 minutes?
  choices:
    A: 85 degrees
    B: 90 degrees
    C: 100 degrees
    D: 120 degrees
  answer: C
  explanation: According to the manual, even on a mild day at 73 degrees outside,
    an SUV can heat up to 100 degrees in 10 minutes.
- id: 305
  category: penalties_and_points
  question: What is the maximum penalty for a Class A Misdemeanor regarding leaving
    a child unattended in a vehicle?
  choices:
    A: 6 months in jail and a $1,000 fine
    B: 11 months, 29 days and/or a fine up to $2,500
    C: 1 to 5 years in prison
    D: 15 to 60 years in prison
  answer: B
  explanation: Class A Misdemeanors carry a penalty of not greater than 11 months,
    29 days or a fine up to $2,500, or both.
- id: 306
  category: safe_driving_rules
  question: Where is the safest place for children 12 years old and under to ride
    in a vehicle equipped with air bags?
  choices:
    A: The front passenger seat
    B: The back seat
    C: The middle of the front bench seat
    D: The bed of a pick-up truck
  answer: B
  explanation: The manual states that the safest place for children 12 and under to
    ride in a vehicle equipped with air bags is the back seat.
- id: 307
  category: signs_and_signals
  question: Which color is used for incident management traffic control signage, such
    as for traffic accidents or hazardous material spills?
  choices:
    A: Orange
    B: Fluorescent Pink
    C: Brown
    D: Red
  answer: B
  explanation: Fluorescent pink (sometimes called "coral") is used for incident management
    traffic control signage when needed for incidents such as traffic accidents, wildland
    fires, floods, and hazardous material spills.
- id: 308
  category: signs_and_signals
  question: What type of information is indicated by a brown traffic sign?
  choices:
    A: Public recreation areas and cultural interest points
    B: Highway construction and detours
    C: Permissive parking regulations
    D: Police services and rest areas
  answer: A
  explanation: Brown is used as a background color for guide information signs related
    to points of recreational and cultural interest.
- id: 309
  category: signs_and_signals
  question: What does an eight-sided (octagon) traffic sign mean?
  choices:
    A: Yield right-of-way
    B: Railroad crossing ahead
    C: Stop
    D: School zone ahead
  answer: C
  explanation: The octagon shape is the only eight-sided sign on the roadway. It will
    always be red with white lettering and it tells you that you must bring your car
    to a complete stop.
- id: 310
  category: signs_and_signals
  question: 'A circular (round) traffic sign indicates that you are approaching:'
  choices:
    A: A four-way intersection
    B: A railroad grade crossing
    C: A hospital zone
    D: A roundabout
  answer: B
  explanation: A circular sign always means that you are approaching a railroad grade
    crossing and must slow down.
- id: 311
  category: safe_driving_rules
  question: If a highway construction worker directs you to proceed, but the traffic
    light is red, what should you do?
  choices:
    A: Wait for the light to turn green before proceeding.
    B: Obey the construction worker and proceed.
    C: Pull over and wait for a police officer.
    D: Honk your horn to warn other drivers.
  answer: B
  explanation: Drivers must obey directions from law enforcement, highway construction
    personnel or school crossing guards, even if the directions are different than
    what the traffic lights and signs indicate.
- id: 312
  category: signs_and_signals
  question: When approaching a three-sided triangular Yield sign, what must you do
    if other vehicles are approaching on the other roadway?
  choices:
    A: Speed up to merge ahead of them.
    B: Maintain your speed and honk your horn.
    C: Stop and wait for the approaching vehicles.
    D: Proceed without stopping as you have the right-of-way.
  answer: C
  explanation: A three-sided Yield sign means you must stop and wait when other vehicles
    are approaching from the right or left on the other roadway.
- id: 313
  category: signs_and_signals
  question: Which of the following is indicated by a blue traffic sign?
  choices:
    A: Construction zones
    B: Motorist services such as police and rest areas
    C: General warnings
    D: Permissive parking regulations
  answer: B
  explanation: Blue is used as a background color for information signs related to
    motorist services (including police services and rest areas) and the Emergency
    Route Marker.
- id: 314
  category: safe_driving_rules
  question: According to child passenger restraint rules, when should a child be facing
    the rear of the car?
  choices:
    A: If the child is under 1 year old and weighs less than 20 pounds.
    B: If the child is between 1 and 3 years old.
    C: If the child weighs more than 20 pounds.
    D: If the child is riding in the front passenger seat.
  answer: A
  explanation: A child in a child passenger restraint system (car seat) should be
    facing the rear of the car if weighing less than 20 pounds and under 1 year old.
- id: 315
  category: signs_and_signals
  question: What does a red rectangular sign with the words "ALL WAY" placed below
    a stop sign mean?
  choices:
    A: Only cross traffic must stop.
    B: All traffic approaching this intersection must stop.
    C: You may proceed without stopping if the way is clear.
    D: The road ahead is closed to all traffic.
  answer: B
  explanation: A red rectangle added below a stop sign with "ALL WAY" means all traffic
    approaching this intersection must stop.
- id: 316
  category: signs_and_signals
  question: What should you do when approaching a three-sided Yield sign?
  choices:
    A: Always come to a complete stop regardless of traffic.
    B: Speed up to merge smoothly with cross traffic.
    C: Slow down and enter the intersection with caution if no other cars are coming.
    D: Stop only if there is a traffic light present.
  answer: C
  explanation: The manual states that at a Yield sign, if you are sure no other cars
    are coming you need not come to a complete stop but you must slow down and enter
    the intersection with caution.
- id: 317
  category: signs_and_signals
  question: What is the purpose of the smaller signs placed directly below a broad
    'X' shaped railroad crossbuck sign?
  choices:
    A: They indicate the speed limit for the crossing.
    B: They show the number of tracks at that particular crossing.
    C: They warn of the exact time trains usually pass.
    D: They indicate the distance to the next highway intersection.
  answer: B
  explanation: The manual notes that the smaller signs placed on the post directly
    below the crossbuck show the number of tracks at a particular crossing.
- id: 318
  category: safe_driving_rules
  question: According to the manual, why should you never try to 'beat' a train at
    a railroad crossing?
  choices:
    A: Trains have the right-of-way only during daylight hours.
    B: You will usually misjudge the train's speed.
    C: It is illegal to cross tracks without stopping first.
    D: Your vehicle's engine will stall on the tracks.
  answer: B
  explanation: 'The manual explicitly warns drivers: ''NEVER TRY TO BEAT THE TRAIN.
    YOU WILL USUALLY MISJUDGE ITS SPEED.'''
- id: 319
  category: signs_and_signals
  question: Where is a triangular No Passing Zone sign typically placed on the roadway?
  choices:
    A: On the right side of the roadway.
    B: Suspended directly over the center lane.
    C: On the left side of the roadway.
    D: On the pavement surface as a painted symbol.
  answer: C
  explanation: The manual states that a triangular No Passing Zone sign is yellow
    or orange and placed on the left side of the roadway.
- id: 320
  category: signs_and_signals
  question: What is the difference between a warning sign for a turn and a warning
    sign for a curve?
  choices:
    A: A turn sign is used for recommended speeds of 30 mph or less, while a curve
      sign is for speeds between 30 and 55 mph.
    B: A turn sign is orange, while a curve sign is yellow.
    C: A turn sign indicates a dead end, while a curve sign indicates a winding road.
    D: A turn sign is for right turns only, while a curve sign is for left turns only.
  answer: A
  explanation: The manual states the turn sign is used to mark turns with a recommended
    speed of 30 m.p.h. or less, whereas the curve sign marks curves with recommended
    speeds in the range between 30 and 55 m.p.h.
- id: 321
  category: defensive_driving
  question: When you see a warning sign for falling rocks in hilly areas, what should
    you watch for?
  choices:
    A: Rocks falling directly from overhead onto your vehicle.
    B: Rocks that may already be in the road.
    C: Construction vehicles dumping gravel.
    D: Pedestrians throwing rocks from overpasses.
  answer: B
  explanation: The manual clarifies that this sign 'warns of rocks that may be in
    the road, not of rocks which may strike you from overhead. Watch the roadway,
    not the hill.'
- id: 322
  category: sharing_the_road
  question: What should you do when you see a warning sign alerting you to traffic
    blending into your main stream of travel?
  choices:
    A: Speed up to block the merging traffic.
    B: Honk your horn to warn the merging vehicles to yield.
    C: Move into the other lane, if possible, to allow the merging motorist a clear
      path.
    D: Come to a complete stop and let the other vehicles merge.
  answer: C
  explanation: The manual advises that after checking to your rear, you should move
    into the other lane, if possible, to allow the merging motorist a clear path.
- id: 323
  category: signs_and_signals
  question: What color and shape are construction, maintenance, or emergency operations
    signs generally?
  choices:
    A: Red and white triangles.
    B: Yellow and black circles.
    C: Green and white rectangles.
    D: Orange with black letters or symbols, and diamond or rectangular shaped.
  answer: D
  explanation: The manual states that work area signs are generally diamond or rectangular
    shaped, orange with black letters or symbols.
- id: 324
  category: safe_driving_rules
  question: How should you drive when passing through a work zone guided by channeling
    devices like barricades or cones?
  choices:
    A: Keep your vehicle in the middle of the lane and obey the posted speed limit.
    B: Drive as close to the cones as possible to leave room for workers.
    C: Frequently change lanes to find the fastest route through the zone.
    D: Straddle the center line to maintain a safe distance from the barricades.
  answer: A
  explanation: The manual instructs drivers to 'keep your vehicle in the middle of
    the lane and obey the posted speed limit' when driving near channeling devices.
- id: 325
  category: safe_driving_rules
  question: How are some school zone speed limit signs controlled to indicate when
    children may be crossing?
  choices:
    A: By crossing guards holding stop paddles.
    B: By a time clock that flashes yellow lights while illuminating the speed limit.
    C: By motion sensors that detect approaching vehicles.
    D: By a permanent red traffic light.
  answer: B
  explanation: The manual states that this type of sign is controlled by a time clock
    and flashes yellow lights while illuminating the speed limit.
- id: 326
  category: safe_driving_rules
  question: On a highway with more than one lane going each direction, what does the
    sign requiring you to drive in the extreme right lane mean?
  choices:
    A: You must drive in the right lane unless you want to pass a slower moving car
      or make a left turn.
    B: You must always drive in the right lane, even when passing.
    C: You should straddle the lanes if you are moving slower than other traffic.
    D: You may only use the right lane for parking or emergencies.
  answer: A
  explanation: The manual explains this sign means 'that you must drive in the extreme
    right lane unless you want to pass a slower moving car or make a left turn.'
- id: 327
  category: sharing_the_road
  question: What color clothing do flaggers, utility workers, and law enforcement
    officers wear in work zones to ensure they can be seen under low light and poor
    weather conditions?
  choices:
    A: Dark blue or black uniforms.
    B: Fluorescent yellow-green clothing or vests.
    C: Pure white reflective suits.
    D: Camouflage jackets.
  answer: B
  explanation: The manual mentions Law Enforcement Officers and flaggers/workers wear
    'Fluorescent Yellow-Green Vests' and clothing to make sure they can be seen under
    normal conditions and under low light and poor weather conditions.
- id: 328
  category: signs_and_signals
  question: What action should you take when you see a flashing arrow panel alerting
    you to a lane closure ahead?
  choices:
    A: Speed up to pass the construction zone quickly.
    B: Wait until the last possible moment to merge into the open lane.
    C: Begin to merge into the remaining open lane(s) well in advance of the sign.
    D: Stop your vehicle immediately and wait for a flagger's instructions.
  answer: C
  explanation: 'The manual instructs: ''Flashing arrow panels alert approaching drivers
    of lane closures. You must begin to merge into the remaining open lane(s) well
    in advance of this sign.'''
- id: 329
  category: safe_driving_rules
  question: What should you do when driving near channeling devices in a work zone?
  choices:
    A: Change lanes quickly to avoid them.
    B: Keep your vehicle in the middle of the lane and obey the posted speed limit.
    C: Drive on the shoulder to give workers more room.
    D: Speed up to exit the work zone faster.
  answer: B
  explanation: The manual states that when driving near channeling devices in a work
    zone, you should keep your vehicle in the middle of the lane and obey the posted
    speed limit.
- id: 330
  category: vehicle_information
  question: Which of the following vehicles are most likely to display a Slow-Moving
    Vehicle (SMV) emblem?
  choices:
    A: Emergency vehicles responding to a call.
    B: Commercial buses and large trucks.
    C: Farm tractors, machinery, and horse-drawn vehicles.
    D: Vehicles carrying hazardous materials.
  answer: C
  explanation: According to the manual, you may see the SMV emblem on slow-moving
    vehicles, such as farm tractors, machinery, construction equipment, or horse-drawn
    vehicles.
- id: 331
  category: signs_and_signals
  question: What is the purpose of an object marker sign?
  choices:
    A: To mark the center line of a two-way highway.
    B: To indicate a pedestrian crossing ahead.
    C: To show the distance to the next highway exit.
    D: To warn of objects close to the edge of the road, such as bridge ends.
  answer: D
  explanation: Object markers warn drivers of objects not actually in the roadway,
    but so close to the edge of the road that they need marking, such as bridge ends
    and underpass abutments.
- id: 332
  category: signs_and_signals
  question: What colors are used for Interstate Route Marker signs?
  choices:
    A: Green and white
    B: Blue and red
    C: Black and white
    D: Yellow and black
  answer: B
  explanation: The manual states that blue and red signs indicate that the route is
    part of the national system of interstate and defense highways.
- id: 333
  category: signs_and_signals
  question: What color are signs that direct motorists to service facilities like
    gas stations, restaurants, and motels?
  choices:
    A: Green
    B: Brown
    C: Blue
    D: Orange
  answer: C
  explanation: The blue color of service signs directs motorists to service facilities
    such as service stations, restaurants, and motels.
- id: 334
  category: safe_driving_rules
  question: Who is legally permitted to park in spaces displaying the blue handicap
    symbol?
  choices:
    A: Anyone who is parking for less than 5 minutes.
    B: Pregnant women and families with small children.
    C: Vehicles bearing disabled veteran or handicapped license plates, or a special
      handicapped decal.
    D: Elderly drivers over the age of 65.
  answer: C
  explanation: Parking spaces displaying the blue handicap sign are reserved exclusively
    for vehicles bearing disabled veteran or handicapped license plates, or a special
    handicapped decal. Use by others is prohibited by law.
- id: 335
  category: signs_and_signals
  question: How often are emergency reference markers installed along heavily traveled
    sections of urban interstates in Tennessee?
  choices:
    A: Every 500 feet
    B: Every 1,000 feet
    C: Every 1 mile
    D: Every 5 miles
  answer: B
  explanation: In order to help motorists better identify their location, the state
    has installed interstate reference markers every 1,000 feet along heavily traveled
    sections of urban interstates.
- id: 336
  category: safe_driving_rules
  question: When are you permitted to turn right on a red light?
  choices:
    A: At any time, without stopping.
    B: Only when a green arrow is also illuminated.
    C: After coming to a complete stop and when no pedestrians or cross traffic are
      present, unless otherwise posted.
    D: Right turns on red are never permitted in Tennessee.
  answer: C
  explanation: Unless otherwise posted, you may turn right on red after coming to
    a complete stop and when no pedestrians or cross traffic are present.
- id: 337
  category: safe_driving_rules
  question: According to Tennessee law, what is the minimum amount of time a yellow
    traffic light must be exhibited before turning red?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Five seconds
  answer: B
  explanation: Tennessee law only requires the yellow light to be exhibited for a
    minimum of three seconds before the red light.
- id: 338
  category: safe_driving_rules
  question: What should you do if you are already IN the intersection when the yellow
    traffic light comes on?
  choices:
    A: Stop immediately in the middle of the intersection.
    B: Put your vehicle in reverse and back out of the intersection.
    C: Speed up significantly to beat the red light.
    D: Do not stop, but continue cautiously through the intersection.
  answer: D
  explanation: The manual instructs that if you are already IN the intersection when
    the yellow light comes on, do not stop, but continue cautiously through the intersection.
- id: 339
  category: signs_and_signals
  question: What does a red arrow traffic signal indicate?
  choices:
    A: You may turn in the direction of the arrow after yielding.
    B: All turns in the direction of the arrow are prohibited, even if other lanes
      of traffic have a green signal.
    C: You must treat the intersection as a four-way stop.
    D: You may turn only if you are driving an emergency vehicle.
  answer: B
  explanation: When the arrow is red or your lane has the red light, all turns are
    prohibited. This is true even if other lanes of traffic have a green signal and
    your path appears clear.
- id: 340
  category: signs_and_signals
  question: What does a flashing yellow arrow mean at an intersection?
  choices:
    A: You are allowed to turn left after yielding to all oncoming traffic, bicyclists,
      and pedestrians.
    B: The traffic light is broken and you must stop completely.
    C: You have the protected right-of-way to turn left without yielding.
    D: Left turns are completely prohibited.
  answer: A
  explanation: If you see a flashing yellow arrow, you are allowed to turn left after
    yielding to all oncoming traffic and to any bicyclists and pedestrians in the
    crosswalk.
- id: 341
  category: safe_driving_rules
  question: How should you treat an intersection if the traffic signal is malfunctioning
    and the light is out?
  choices:
    A: Proceed through the intersection without stopping if you are on the main road.
    B: Treat it as a yield sign.
    C: Treat it as an all-way stop intersection.
    D: Wait for a police officer to arrive before proceeding.
  answer: C
  explanation: Tennessee state law requires that if a signal is not working, the intersection
    is to be treated as if it were an all-way stop intersection.
- id: 342
  category: safe_driving_rules
  question: If two vehicles arrive at an all-way stop intersection at the same time,
    who has the right-of-way?
  choices:
    A: The driver on the left must yield to the driver on the right.
    B: The driver on the right must yield to the driver on the left.
    C: The vehicle traveling at a faster speed goes first.
    D: The vehicle turning left always goes first.
  answer: A
  explanation: The right-of-way law says that if there are two or more vehicles at
    the intersection stopping at the same time, the driver on the left would yield
    to the driver on the right.
- id: 343
  category: sharing_the_road
  question: How does Tennessee law define a pedestrian?
  choices:
    A: Only a person walking on a designated sidewalk.
    B: Any person afoot or using a motorized or non-motorized wheelchair.
    C: Anyone riding a bicycle or skateboard.
    D: Any person crossing the street outside of a crosswalk.
  answer: B
  explanation: Tennessee law defines a pedestrian as any person afoot or using a motorized
    or non-motorized wheelchair.
- id: 344
  category: safe_driving_rules
  question: When are you required to turn on your vehicle's headlights at night?
  choices:
    A: From sunset to sunrise
    B: 30 minutes after sunset until 30 minutes before sunrise
    C: 1 hour after sunset until 1 hour before sunrise
    D: Only when there are no streetlights
  answer: B
  explanation: The manual states that your car headlights must be turned on 30 minutes
    after sunset until 30 minutes before sunrise.
- id: 345
  category: safe_driving_rules
  question: Under what weather conditions are you required to turn on your headlights
    during daylight hours?
  choices:
    A: Only when it is snowing heavily
    B: Whenever the sky is cloudy
    C: When precipitation requires the constant use of windshield wipers
    D: Only when driving on the interstate in the rain
  answer: C
  explanation: Headlights must be turned on during daylight hours when rain, mist,
    snow, or other precipitation requires constant use of windshield wipers.
- id: 346
  category: safe_driving_rules
  question: You must turn on your headlights during the day if daylight is not good
    enough to clearly see persons or vehicles at what distance ahead?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Your car headlights must be turned on at any time when daylight is
    not good enough for you to see persons or vehicles clearly at a distance of 200
    feet ahead.
- id: 347
  category: safe_driving_rules
  question: What is the rule regarding coasting while traveling on a downgrade?
  choices:
    A: It is recommended to save gas
    B: You may coast in neutral but not with the clutch depressed
    C: You must never coast with the transmission in neutral or the clutch depressed
    D: Coasting is only allowed on roads with a speed limit under 45 mph
  answer: C
  explanation: While traveling on a downgrade, NEVER coast with the transmission of
    the vehicle in neutral. Also, drivers of manual transmission vehicles must not
    coast with the clutch depressed.
- id: 348
  category: safe_driving_rules
  question: If a traffic officer instructs you to do something that would ordinarily
    violate a traffic regulation, what should you do?
  choices:
    A: Ignore the officer and follow the traffic signals
    B: Obey the officer's instructions at all times
    C: Ask the officer for their badge number before proceeding
    D: Pull over and wait for the traffic signal to change
  answer: B
  explanation: You must obey traffic officers at all times. There will be times when
    an officer will instruct you to do something that ordinarily would be a violation
    of traffic regulations in case of an emergency.
- id: 349
  category: defensive_driving
  question: According to statistics, where do half of all vehicle crashes occur?
  choices:
    A: On interstate highways
    B: Within 25 miles of home
    C: In busy intersections
    D: During long road trips
  answer: B
  explanation: Statistics show that half of all vehicle crashes occur within 25 miles
    of home.
- id: 350
  category: signs_and_signals
  question: How can you tell by the edge lines that you are driving the wrong way
    on a roadway?
  choices:
    A: You have a white line to your right and a yellow line to your left
    B: You have a yellow line to your right and a white line to your left
    C: Both edge lines are white
    D: Both edge lines are yellow
  answer: B
  explanation: If you ever find yourself with yellow to your right and white to your
    left, you are going the wrong way.
- id: 351
  category: safe_driving_rules
  question: When are you permitted to cross two solid yellow lines between lanes of
    traffic?
  choices:
    A: To pass a slow-moving vehicle
    B: When there is no oncoming traffic in view
    C: To turn into a driveway or side road if it is safe
    D: You may never cross two solid yellow lines under any circumstances
  answer: C
  explanation: Two solid yellow lines mean you MAY NOT cross the lines from either
    direction to pass. However, you may cross a solid yellow line to turn into a driveway
    or side road if it is safe to do so.
- id: 352
  category: signs_and_signals
  question: What does it mean if the center of the roadway is marked with one solid
    yellow line and one broken yellow line, and the broken line is on your side?
  choices:
    A: You are in a passing zone and may pass if it is safe
    B: You are not allowed to pass in this area
    C: You must prepare to stop
    D: The lane is for turning only
  answer: A
  explanation: If the broken yellow line is on your side, you are in the 'passing
    zone' and may pass if it is safe to do so.
- id: 353
  category: signs_and_signals
  question: What does a single solid white line between lanes of traffic flowing in
    the same direction indicate?
  choices:
    A: You may freely change lanes to pass
    B: You should stay in your lane and not cross unless in an emergency
    C: The lane is ending and you must merge left
    D: You are approaching a toll plaza
  answer: B
  explanation: One solid white line between lanes of traffic means that you should
    stay in your lane and should not cross the line to pass (unless an emergency situation
    requires you to change lanes).
- id: 354
  category: safe_driving_rules
  question: Where must you stop your vehicle at an intersection if there is no painted
    stop line or crosswalk?
  choices:
    A: Just past the corner so you can see traffic clearly
    B: Before the front bumper crosses the white edge line of the cross street
    C: At least 10 feet back from the intersection
    D: Next to the stop sign post
  answer: B
  explanation: If no stop line is painted on the pavement, all vehicles required to
    stop must stop the vehicle before the front bumper crosses the white edge line
    of the cross street, in order to keep the vehicle from protruding out into the
    cross street traffic.
- id: 355
  category: signs_and_signals
  question: What symbol on the pavement designates a High Occupancy Vehicle (HOV)
    lane?
  choices:
    A: A white crossbuck
    B: A painted circle with an X
    C: A diamond-shaped marking
    D: A large white arrow
  answer: C
  explanation: High Occupancy Vehicle (HOV) Lanes are designated on highways by a
    diamond-shaped marking in the center of the lane.
- id: 356
  category: signs_and_signals
  question: What does it mean if your travel lane is marked with both a curved arrow
    and a straight arrow?
  choices:
    A: You must turn in the direction of the arrow
    B: You may either turn in the direction of the arrow or go straight
    C: The lane is ending and you must merge
    D: You are approaching a roundabout
  answer: B
  explanation: If your lane is marked with both a curved and a straight arrow, you
    may turn in the direction of the arrow or you may go straight.
- id: 357
  category: signs_and_signals
  question: What pavement marking acts as a warning for a railroad/highway grade crossing?
  choices:
    A: A diamond shape with the letters RR
    B: A white crossbuck and the letters RR
    C: A solid yellow line with a red X
    D: A double solid white line
  answer: B
  explanation: A white crossbuck and the letters RR are painted on the pavement as
    a warning marker for many railroad/highway grade crossings.
- id: 358
  category: signs_and_signals
  question: What does a pedestrian signal displaying a symbol of a raised hand mean?
  choices:
    A: Pedestrians have the right-of-way to cross
    B: It is not safe to begin crossing the street
    C: Pedestrians should run across the intersection quickly
    D: Vehicles must stop and wait for pedestrians to approach
  answer: B
  explanation: When the pedestrian signal shows the words 'DON’T WALK,' or a symbol
    of a raised hand appears, it is not safe to begin crossing a street or intersection.
- id: 359
  category: safe_driving_rules
  question: When are you required to turn on your car headlights for night use in
    Tennessee?
  choices:
    A: From sunset to sunrise
    B: 30 minutes after sunset until 30 minutes before sunrise
    C: 1 hour after sunset until 1 hour before sunrise
    D: Only when it is completely dark outside
  answer: B
  explanation: According to the manual, your car headlights must be turned on 30 minutes
    after sunset until 30 minutes before sunrise.
- id: 360
  category: safe_driving_rules
  question: 'In Tennessee, you are required by law to turn on your headlights during
    daylight or inclement weather when:'
  choices:
    A: Driving on any interstate highway.
    B: Constant use of windshield wipers is required due to precipitation.
    C: Driving in the leftmost lane of a multi-lane highway.
    D: Approaching a properly identified funeral procession.
  answer: B
  explanation: The manual states that headlights must be turned on when rain, mist,
    snow, or other precipitation requires constant use of windshield wipers.
- id: 361
  category: safe_driving_rules
  question: When must you dim or lower your vehicle's high beam headlights?
  choices:
    A: When an oncoming vehicle is within 500 feet.
    B: When an oncoming vehicle is within 200 feet.
    C: When an oncoming vehicle is within 1,000 feet.
    D: Only when driving in congested urban areas.
  answer: A
  explanation: You must dim or lower the beam when an oncoming vehicle is within 500
    feet (approximately the distance of one city block) or when you are following
    another vehicle within 500 feet.
- id: 362
  category: vehicle_information
  question: Which of the following is true regarding the use of parking lights while
    driving?
  choices:
    A: They should be used instead of headlights in heavy fog.
    B: It is illegal to drive a vehicle with only the parking lights on at night or
      in inclement weather.
    C: They make your vehicle appear closer to other drivers than it actually is.
    D: They are required to be on at all times when driving in a school zone.
  answer: B
  explanation: 'The manual states: ''Do not drive a vehicle with only the parking
    lights on when driving at night or in inclement weather... the use of parking
    lights alone is not only unsafe, it is against the law.'''
- id: 363
  category: vehicle_information
  question: 'Effective January 1, 2018, steady-burning lights displayed to the front
    of a vehicle in Tennessee must be:'
  choices:
    A: White or amber
    B: Red or blue
    C: Green or yellow
    D: Any color as long as they do not flash
  answer: A
  explanation: Effective January 1, 2018, no vehicle operated in Tennessee shall be
    equipped with any steady-burning lights that display to the front of the vehicle
    in any color other than white or amber (or a combination of the two).
- id: 364
  category: penalties_and_points
  question: What are the potential fines for a littering conviction in Tennessee?
  choices:
    A: $10 to $500
    B: $50 to $3,000
    C: $100 to $5,000
    D: $250 to $10,000
  answer: B
  explanation: Littering is against state law. Fines start at $50 and can be up to
    $3,000 based upon the amount of litter.
- id: 365
  category: safe_driving_rules
  question: What does Tennessee law require of any motor vehicle transporting material
    likely to fall or be blown off onto the highway?
  choices:
    A: The material must be tied down with bungee cords.
    B: The vehicle must travel at least 10 mph below the speed limit.
    C: The material must be in an enclosed space or fully covered by a tarpaulin.
    D: The vehicle must display a 'Slow Moving Vehicle' sign.
  answer: C
  explanation: Tennessee law requires any motor vehicle transporting litter or any
    material, likely to fall or be blown off onto the highway, to be in an enclosed
    space or fully covered by a tarpaulin.
- id: 366
  category: safe_driving_rules
  question: 'You are considered to be driving a slow-moving vehicle if you are traveling
    at a rate of speed that is:'
  choices:
    A: 5 mph or more below the lawful maximum speed.
    B: 10 mph or more below the lawful maximum speed.
    C: 15 mph or more below the lawful maximum speed.
    D: 20 mph or more below the lawful maximum speed.
  answer: B
  explanation: You are considered to be driving a slow-moving vehicle if you are traveling
    at a rate of speed that is 10 miles per hour or more below the lawful maximum
    speed.
- id: 367
  category: sharing_the_road
  question: If you are driving a slow-moving vehicle, when must you turn or pull off
    the roadway safely?
  choices:
    A: When 2 or more vehicles are lined up behind you.
    B: When 3 or more vehicles are lined up behind you.
    C: When 5 or more vehicles are lined up behind you.
    D: When 10 or more vehicles are lined up behind you.
  answer: C
  explanation: 'The manual states: ''If five or more vehicles are lined up behind
    you, turn or pull off the roadway as soon as you can do so safely.'''
- id: 368
  category: sharing_the_road
  question: What is the rule for passing a funeral procession on a two-lane roadway
    in Tennessee?
  choices:
    A: You may pass if you honk your horn first.
    B: You may pass only if the procession is traveling below 45 mph.
    C: Vehicles following the procession may not attempt to pass it.
    D: You may pass if you turn on your hazard lights.
  answer: C
  explanation: Tennessee law instructs that vehicles following a funeral procession
    on a two-lane roadway may not attempt to pass such procession.
- id: 369
  category: safe_driving_rules
  question: Which of the following best describes the Basic Speed Rule (BSR)?
  choices:
    A: It is a strict Tennessee law that sets exact speed limits for all roads.
    B: It teaches that the speed you may drive is limited by current conditions.
    C: It requires all drivers to travel at exactly the posted speed limit.
    D: It states that driving slower is always safer.
  answer: B
  explanation: The Basic Speed Rule (BSR) is not a Tennessee law, but a general safety
    principle. It does not set an exact speed limit; instead, it teaches that the
    speed you may drive is limited by current conditions.
- id: 370
  category: safe_driving_rules
  question: Unless otherwise posted, what is the speed limit on primary and secondary
    state and federal highways in Tennessee?
  choices:
    A: 45 m.p.h.
    B: 55 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: B
  explanation: Unless otherwise posted, the speed limit on primary and secondary state
    and federal highways is 55 m.p.h.
- id: 371
  category: safe_driving_rules
  question: What is the maximum speed set by Tennessee law for interstate highways?
  choices:
    A: 55 m.p.h.
    B: 60 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: D
  explanation: The maximum speed set by Tennessee law for interstate highways is 70
    m.p.h., which is posted on most rural sections.
- id: 372
  category: safe_driving_rules
  question: Under normal driving conditions, it is unlawful to drive less than what
    speed in the leftmost lane of any Interstate highway in Tennessee?
  choices:
    A: 45 m.p.h.
    B: 50 m.p.h.
    C: 55 m.p.h.
    D: 65 m.p.h.
  answer: C
  explanation: It is unlawful for any person to drive a vehicle less than 55 m.p.h.
    in the left most lane of any Interstate highway, unless traffic congestion and
    flow prevent safe driving at such speed.
- id: 373
  category: safe_driving_rules
  question: On Tennessee interstates, what is the minimum speed limit in the right
    lane(s) under normal driving conditions?
  choices:
    A: 35 m.p.h.
    B: 40 m.p.h.
    C: 45 m.p.h.
    D: 55 m.p.h.
  answer: C
  explanation: On the interstates, the minimum speed limit in the right lane(s) is
    45 m.p.h., and under normal driving conditions, all vehicles must travel at least
    this fast.
- id: 374
  category: penalties_and_points
  question: What is the penalty for exceeding the speed limit in a school zone in
    Tennessee?
  choices:
    A: An automatic two points added to your driving record
    B: An automatic four points added to your driving record
    C: An automatic six points added to your driving record
    D: An automatic license suspension for 30 days
  answer: C
  explanation: According to the manual, the penalty for exceeding the school zone
    speed limit includes an automatic six points added to your driving record, which
    results in an advisory letter.
- id: 375
  category: penalties_and_points
  question: 'By law, exceeding the school zone speed limit is considered to be:'
  choices:
    A: Careless driving
    B: Reckless driving
    C: Aggressive driving
    D: A minor traffic infraction
  answer: B
  explanation: The manual states that exceeding the school zone speed limit is by
    law considered to be reckless driving.
- id: 376
  category: penalties_and_points
  question: What are the minimum and maximum fines for violating the posted speed
    limit in active work zones in Tennessee?
  choices:
    A: $50 minimum and $250 maximum
    B: $100 minimum and $300 maximum
    C: $250 minimum and $500 maximum
    D: $500 minimum and $1,000 maximum
  answer: C
  explanation: Tennessee law mandates a minimum fine of $250 dollars and up to a maximum
    fine of $500 dollars for violations of the speed limit posted in active work zones.
- id: 377
  category: signs_and_signals
  question: How are highway work zones easily recognized by drivers?
  choices:
    A: By the presence of blue and white signs and devices
    B: By the presence of orange or yellow-green signs, devices, and clothing
    C: By the presence of solid red signs and flashing green lights
    D: By the presence of black and white checkered flags
  answer: B
  explanation: Highway work zones are easily recognized by the presence of orange
    (or yellow-green) signs and other orange traffic control devices, flashing lights
    on equipment, and workers dressed in highly visible clothing (orange or yellow-green).
- id: 378
  category: vehicle_information
  question: By law, what braking equipment must all automobiles have?
  choices:
    A: Only a regular foot brake
    B: Two separate methods of applying brakes, commonly a foot brake and a parking/emergency
      brake
    C: An anti-lock braking system (ABS) and a foot brake
    D: Front disc brakes and rear drum brakes
  answer: B
  explanation: By law, all automobiles must have two separate methods of applying
    brakes. Commonly, these are the vehicle's regular brakes (foot brake) and a parking
    or emergency brake.
- id: 379
  category: defensive_driving
  question: If your vehicle does NOT have anti-lock brakes and starts to skid, what
    should you generally do?
  choices:
    A: Pump the brakes as fast as possible
    B: Slam on the brakes and hold the steering wheel straight
    C: Take your foot off the brake and turn the steering wheel in the direction of
      the skid
    D: Accelerate quickly to regain traction
  answer: C
  explanation: As a general rule for vehicles without anti-lock brakes, if the car
    starts to skid, take your foot off the brake and turn the steering wheel in the
    direction of the skid, if safe to do so.
- id: 380
  category: vehicle_information
  question: 'When slowing or stopping a vehicle equipped with an anti-lock braking
    system (ABS), you should:'
  choices:
    A: Pump the brake pedal rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brake pedal repeatedly
    D: Take your foot off the pedal if you feel vibration
  answer: B
  explanation: When slowing or stopping with ABS, apply firm, steady pressure to the
    brake pedal. Never pump the pedal with ABS.
- id: 381
  category: vehicle_information
  question: What should you expect to feel when your anti-lock braking system (ABS)
    is in use?
  choices:
    A: The steering wheel will lock in place
    B: The brake pedal will go completely to the floor with no resistance
    C: Noise and vibration in the brake pedal
    D: The engine will temporarily stall
  answer: C
  explanation: Expect noise and vibration in the brake pedal when your ABS is in use.
    These sensations tell you ABS is working.
- id: 382
  category: safe_driving_rules
  question: What does the term 'riding the brake' mean?
  choices:
    A: Hovering your foot over the brake pedal for a quicker response
    B: Keeping your foot resting or slightly pressed down on the brake pedal
    C: Pressing the brake and gas pedals at the same time
    D: Pumping the brake pedal repeatedly while driving down a hill
  answer: B
  explanation: '''Riding the brake'' is keeping your foot resting or slightly pressed
    down on the brake. This adds wear and tear and gives other drivers a false impression.'
- id: 383
  category: defensive_driving
  question: Is 'covering the brake' considered a safe driving practice?
  choices:
    A: Yes, it allows for quicker response time in situations like approaching intersections
    B: No, it causes excessive wear and tear on the brake system
    C: No, it gives other drivers the false impression that a stop is imminent
    D: Yes, but only when driving on interstate highways
  answer: A
  explanation: Covering the brake means the driver's foot hovers over the brake for
    quicker response time. The manual states that covering the brake is often a smart
    and safe driving practice.
- id: 384
  category: safe_driving_rules
  question: 'To maintain a safe following distance under normal driving conditions,
    drivers should use:'
  choices:
    A: The one-second rule
    B: The two-second rule
    C: The five-second rule
    D: The ten-second rule
  answer: B
  explanation: Nationally, safety agencies recommend a safe following distance. The
    manual advises using the Two-Second Rule to determine if you are following too
    closely.
- id: 385
  category: defensive_driving
  question: 'During inclement weather, interstate highway driving at higher speeds,
    or night driving, the following distance should be increased to a minimum of:'
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: During inclement weather, interstate driving at higher speeds, and
    night driving, the two-second rule should be increased to a minimum of four seconds
    to allow for better reaction time.
- id: 386
  category: defensive_driving
  question: In the three steps of stopping a vehicle, what is 'Perception time'?
  choices:
    A: The time it takes to move your foot from the gas to the brake pedal
    B: The length of time it takes a driver to see and recognize a dangerous situation
    C: The distance the car travels while the brakes are applied
    D: The time it takes for the vehicle's brake pads to engage the rotors
  answer: B
  explanation: Perception time is defined as the length of time it takes a driver
    to see and recognize a dangerous situation.
- id: 387
  category: safe_driving_rules
  question: What is a very common consequence of drivers following too closely (tailgating)?
  choices:
    A: It improves the flow of heavy traffic
    B: It gives the driver a better view of road conditions ahead
    C: It causes rear-end crashes
    D: It increases the vehicle's fuel efficiency
  answer: C
  explanation: The manual notes that rear-end crashes are very common and most of
    these crashes are caused by drivers who are 'tailgating' (following too closely).
- id: 388
  category: vehicle_information
  question: When approaching a stop sign in a vehicle with a standard transmission,
    what should you do to slow down?
  choices:
    A: Shift into neutral and coast to the stop sign
    B: Turn off the engine to save fuel
    C: Flash the brake lights to signal cars behind you, then shift down to a lower
      gear
    D: Ride the clutch until the vehicle comes to a complete stop
  answer: C
  explanation: With a standard transmission, you can use the gearshift to slow down.
    First, flash the brake lights to signal any cars behind you. Then, shift down
    to a lower gear.
- id: 389
  category: safe_driving_rules
  question: What are the three steps involved in stopping a vehicle?
  choices:
    A: Observation time, slowing time, and stopping time
    B: Perception time, reaction time, and braking time
    C: Braking time, skidding time, and stopping time
    D: Reaction time, deceleration time, and resting time
  answer: B
  explanation: 'According to the manual, there are three steps in stopping a vehicle:
    Perception time, Reaction time, and Braking time.'
- id: 390
  category: safe_driving_rules
  question: What is the average reaction time from the perception of danger to the
    start of braking?
  choices:
    A: 1/2 of a second
    B: 2/3 of a second
    C: 1 second
    D: 1.16 seconds
  answer: B
  explanation: The manual states that reaction time is the time from perception of
    danger to the start of braking, and the average is 2/3 of a second.
- id: 391
  category: vehicle_information
  question: Which of the following is NOT listed as a factor that can widely vary
    a vehicle's stopping distance?
  choices:
    A: Type and condition of the road or pavement
    B: Vehicle design and condition of the shock absorbers
    C: The color and visibility of the vehicle
    D: Vehicle weight when loaded or towing
  answer: C
  explanation: Stopping distance varies due to factors like road condition, tires/brakes,
    shock absorbers, and vehicle weight. Vehicle color is not listed as a factor.
- id: 392
  category: signs_and_signals
  question: Where should you stop your vehicle at a stop sign if there is no pavement
    marking or crosswalk present?
  choices:
    A: Ten feet before the stop sign
    B: When the front of your vehicle is even with the stop sign's placement on the
      roadside
    C: Directly underneath the stop sign
    D: At the exact edge of the intersecting roadway
  answer: B
  explanation: 'The manual states: ''If no pavement markings are present, stop when
    the front of your vehicle is even with the stop sign''s placement on the roadside.'''
- id: 393
  category: defensive_driving
  question: When stopping behind another vehicle at an intersection, what is a basic
    rule of thumb for maintaining a safe 'gap' space?
  choices:
    A: You should be at least one car length behind the vehicle.
    B: You should be able to see the license plate and/or the other vehicle's back
      tire where it meets the pavement.
    C: You should leave exactly 15 feet of space between vehicles.
    D: You should be close enough to read the expiration date on their license plate.
  answer: B
  explanation: A basic rule of thumb is that you should be able to see the license
    plate and/or the other vehicle's back tire where it meets the pavement to provide
    a safety zone.
- id: 394
  category: signs_and_signals
  question: How must a driver respond to a flashing red traffic light?
  choices:
    A: Slow down and proceed with caution.
    B: Yield to traffic on the right, but a stop is not required.
    C: Come to a complete stop, just as with a stop sign.
    D: Stop only if pedestrians are present in the crosswalk.
  answer: C
  explanation: 'The manual explicitly states: ''A complete stop is required at a flashing
    red traffic light, just as with a stop sign.'''
- id: 395
  category: safe_driving_rules
  question: How do most law enforcement officers and driver education instructors
    define a complete stop?
  choices:
    A: When the speedometer reads exactly zero for three seconds.
    B: When the driver feels the car lurch forward after all motion has ceased.
    C: When the vehicle has slowed to less than 5 mph.
    D: When the driver shifts the vehicle into park.
  answer: B
  explanation: Most law enforcement officers and instructors agree that a vehicle
    has not come to a complete stop until the driver feels the car lurch forward after
    all motion has ceased.
- id: 396
  category: safe_driving_rules
  question: When approaching a railroad crossing and a train is coming, where must
    you stop your vehicle?
  choices:
    A: Between 10 and 30 feet from the railroad tracks
    B: Between 15 and 50 feet from the railroad tracks
    C: Exactly 50 feet from the railroad tracks
    D: At least 100 feet from the railroad tracks
  answer: B
  explanation: When you approach a railroad crossing and a train is coming, you must
    stop between 15 and 50 feet from the railroad tracks.
- id: 397
  category: sharing_the_road
  question: At what approximate distance are trains required to signal their horn
    before passing through a railroad crossing?
  choices:
    A: 500 feet
    B: 1,000 feet
    C: 1,500 feet
    D: 2,000 feet
  answer: C
  explanation: Trains are required to signal a horn when they are approximately 1,500
    feet from passing through a railroad crossing.
- id: 398
  category: sharing_the_road
  question: Which of the following vehicles is required by Tennessee law to stop before
    crossing ANY railroad grade crossing, even if no signs or signals are activated?
  choices:
    A: Any passenger vehicle carrying children
    B: Church or school buses, regardless of whether they are carrying passengers
    C: All commercial delivery trucks
    D: Any vehicle towing a trailer
  answer: B
  explanation: Church or school buses are required by law to stop before crossing
    ANY railroad grade crossing, regardless of whether such buses are carrying any
    passengers at the time.
- id: 399
  category: safe_driving_rules
  question: How does the Tennessee Code define a 'stop'?
  choices:
    A: Slowing down to a speed of less than 3 mph
    B: Complete cessation of movement
    C: Pausing for at least two seconds
    D: Yielding to all oncoming traffic
  answer: B
  explanation: Tennessee Code defines 'stop' as 'complete cessation of movement.'
- id: 400
  category: signs_and_signals
  question: If an intersection has a marked crosswalk for pedestrians, where must
    you stop your vehicle?
  choices:
    A: Inside the crosswalk to get a better view of traffic
    B: Just past the crosswalk
    C: Before the front of your vehicle reaches the nearest white line marking the
      border of the crosswalk
    D: Even with the stop sign, regardless of the crosswalk lines
  answer: C
  explanation: If the intersection has a crosswalk marked on the pavement, you must
    stop before the front of your vehicle reaches the nearest white line marking the
    border of the crosswalk.
- id: 401
  category: safe_driving_rules
  question: According to the manual's example, what is the total stopping distance
    for a vehicle traveling at 70 m.p.h. on a good road in good weather after a hazard
    suddenly appears?
  choices:
    A: 128 feet
    B: 200 feet
    C: 290 feet
    D: 418 feet
  answer: D
  explanation: At 70 m.p.h., you travel 128 feet before braking, and the braking distance
    is 290 feet, making the total stopping distance 418 feet.
- id: 402
  category: penalties_and_points
  question: Which of the following is a potential consequence of making a 'rolling
    stop'?
  choices:
    A: Failing the driver examination road test
    B: Receiving a traffic ticket
    C: Being held completely liable by police and insurance companies in the event
      of a crash
    D: All of the above
  answer: D
  explanation: Rolling stops are grounds for receiving a traffic ticket, failing the
    road test, and being held completely liable in the event of a crash.
- id: 403
  category: penalties_and_points
  question: What is the penalty for not stopping for a stopped school bus?
  choices:
    A: Class B misdemeanor and a $100 fine
    B: Class C misdemeanor and a $50 fine
    C: Class A misdemeanor and a fine between $250 and $1,000
    D: Felony and a fine of $2,000
  answer: C
  explanation: The manual states that it is a Class A misdemeanor and the driver can
    be fined between $250 and $1,000 for not stopping for a stopped school bus.
- id: 404
  category: safe_driving_rules
  question: When driving on a highway with a shared center turn lane (a fifth lane),
    what must you do when meeting a stopped school bus with red flashing lights?
  choices:
    A: Proceed with caution without stopping
    B: Stop only if you are traveling in the same direction as the bus
    C: Slow down to 15 mph and proceed
    D: Stop in both directions because a turn lane is not considered a barrier
  answer: D
  explanation: A turn lane in the middle of a four-lane highway is NOT considered
    a barrier. Drivers meeting a stopped school bus on this type of road would be
    required to stop in both directions.
- id: 405
  category: signs_and_signals
  question: What do yellow flashing lights on the front and back of a school bus indicate?
  choices:
    A: The bus is preparing to stop to load or unload children
    B: The bus has stopped and children are getting on or off
    C: The bus is experiencing mechanical difficulties
    D: The bus is backing up
  answer: A
  explanation: When the yellow lights on the front and back of the bus are flashing,
    the bus is preparing to stop to load or unload children. Motorists should slow
    down and prepare to stop.
- id: 406
  category: safe_driving_rules
  question: When a school bus is stopped at an intersection to load and unload children,
    which drivers are required to stop?
  choices:
    A: Only drivers behind the bus
    B: Only drivers approaching from the opposite direction
    C: Drivers from ALL directions
    D: Only drivers turning onto the street where the bus is stopped
  answer: C
  explanation: When a school bus is stopped at an intersection to load and unload
    children, drivers from ALL directions are required to stop until the bus resumes
    motion.
- id: 407
  category: driver_responsibility
  question: If you are pulled over by a police officer after dark, what should you
    do before the officer approaches?
  choices:
    A: Turn off your headlights
    B: Turn on your vehicle's interior light
    C: Step out of the vehicle to greet the officer
    D: Honk your horn to acknowledge the stop
  answer: B
  explanation: The manual advises that if the stop is made after dark, you should
    turn on the vehicle's interior light before the officer approaches.
- id: 408
  category: defensive_driving
  question: What should you do if you are directed to pull over by an UNMARKED police
    car at night and feel unsafe?
  choices:
    A: Speed up to get away from the unmarked car
    B: Stop immediately in the middle of the road
    C: Drive slowly a short distance to the nearest populated area
    D: Refuse to pull over until a marked car arrives
  answer: C
  explanation: If directed to pull over by an UNMARKED police car, you may drive slowly
    a short distance to the nearest area where there are other people, such as a business
    parking lot or the next exit.
- id: 409
  category: driver_responsibility
  question: 'When stopped by a police officer, drivers should:'
  choices:
    A: Keep their hands hidden until asked to show them
    B: Keep their hands on the steering wheel
    C: Immediately reach into the glove compartment for their registration
    D: Exit the vehicle to inspect the rear of the car
  answer: B
  explanation: During a traffic stop, drivers should keep their hands on the steering
    wheel and passengers should keep their hands in plain view.
- id: 410
  category: safe_driving_rules
  question: According to the Left-Right-Left Rule for intersections, where should
    you look first?
  choices:
    A: To the right
    B: To the left
    C: Straight ahead
    D: In your rearview mirror
  answer: B
  explanation: The Left-Right-Left Rule states you should look first to the left to
    make sure cross traffic is yielding the right-of-way, then look right, and then
    left again.
- id: 411
  category: safe_driving_rules
  question: Which of the following is true regarding lane changes and passing at an
    intersection?
  choices:
    A: You may pass a vehicle in an intersection if the light is green
    B: You should make last-minute lane changes as you start through an intersection
    C: You must NOT pass a vehicle in an intersection
    D: You can change lanes in an intersection if you use your turn signal
  answer: C
  explanation: 'The manual explicitly states: "Do NOT make last minute lane changes
    as you start through an intersection. Do NOT pass a vehicle in an intersection."'
- id: 412
  category: defensive_driving
  question: What percentage of all motor vehicle crashes are implicated at intersections?
  choices:
    A: 10 percent
    B: 21 percent
    C: 33 percent
    D: 50 percent
  answer: C
  explanation: Intersections constitute a very small part of the street/highway systems,
    yet they are implicated in 33 percent of all motor vehicle crashes.
- id: 413
  category: safe_driving_rules
  question: Which of the following best describes the law regarding the right-of-way?
  choices:
    A: The law gives the right-of-way to the largest vehicle
    B: The law does not give anyone the right-of-way, it only says who must yield
    C: The law gives the right-of-way to the vehicle traveling the fastest
    D: The law gives the right-of-way to pedestrians in all situations regardless
      of traffic signals
  answer: B
  explanation: The law does not really give anyone the right-of-way. It only says
    who must yield the right-of-way. Think of the right-of-way as something to be
    given, not taken.
- id: 414
  category: safe_driving_rules
  question: Under what condition are you NOT required to stop for a stopped school
    bus with red flashing lights?
  choices:
    A: When traveling on a two-lane road in the opposite direction
    B: When you are running late for work
    C: When driving on a highway with separate roadways divided by a barrier not suitable
      for vehicular traffic
    D: When the bus is stopped at an intersection
  answer: C
  explanation: When driving on a highway with separate roadways for traffic in opposite
    directions, divided by median space or a barrier not suitable for vehicular traffic,
    the driver need not stop, but should proceed with caution.
- id: 415
  category: safe_driving_rules
  question: Is it legal to move into an intersection and block it after the traffic
    lights have changed?
  choices:
    A: Yes, if you entered the intersection while the light was yellow
    B: Yes, if there are no signs posted advising 'Do Not Block Intersection'
    C: No, it is always illegal to block an intersection, whether marked or not
    D: No, unless you are driving a commercial vehicle
  answer: C
  explanation: It is not only common sense, but it’s also illegal to block an intersection
    after the light has changed. It is always illegal to block an intersection, whether
    it is marked or not.
- id: 416
  category: driver_responsibility
  question: 'If you have a handgun permit and are armed when stopped by a police officer,
    you should:'
  choices:
    A: Hide the weapon under the seat
    B: Advise the officer that you have a permit and are armed
    C: Hand the weapon to the officer immediately
    D: Wait until the officer asks if you have a weapon before mentioning it
  answer: B
  explanation: The manual states that drivers should advise officers if they have
    a handgun permit and if they are armed.
- id: 417
  category: safe_driving_rules
  question: According to Tennessee law, who is legally given the right-of-way?
  choices:
    A: The driver who reaches the intersection first
    B: Pedestrians in all situations
    C: The law does not give anyone the right-of-way; it only says who must yield
    D: The vehicle on the right
  answer: C
  explanation: The manual states that the law does not really give anyone the right-of-way.
    It only says who must yield the right-of-way.
- id: 418
  category: sharing_the_road
  question: When a blind or visually impaired pedestrian using a guide dog or white
    cane is crossing the roadway, you must stop at least how far away?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: You must take special precautions to avoid injury to a blind or visually
    impaired pedestrian and stop at least 10 feet away until the person is off the
    roadway.
- id: 419
  category: sharing_the_road
  question: How can a driver identify a hearing impaired pedestrian who requires special
    right-of-way precautions?
  choices:
    A: They are carrying a white cane with a red tip
    B: They are wearing a reflective yellow vest
    C: They are accompanied by a dog on a blaze orange leash
    D: They are using a motorized wheelchair
  answer: C
  explanation: The manual specifies that you must yield to a hearing impaired person
    with a dog on a blaze orange leash crossing any portion of the roadway.
- id: 420
  category: safe_driving_rules
  question: When is it legal to drive your vehicle on a sidewalk?
  choices:
    A: When avoiding a traffic jam
    B: When parking your vehicle in a crowded downtown area
    C: Only when crossing it to enter or exit a driveway, alley, or parking lot
    D: It is never legal to drive on a sidewalk under any circumstances
  answer: C
  explanation: It is illegal to drive on a sidewalk except to cross it, such as when
    entering or exiting a driveway, alley, or parking lot.
- id: 421
  category: safe_driving_rules
  question: At a "T" intersection where one road dead-ends into another main crossing
    roadway, who has the right-of-way?
  choices:
    A: The vehicle on the road that ends must yield to traffic on the main road
    B: The vehicles on the main road must yield to the vehicle on the road that ends
    C: The vehicle that arrives at the intersection first
    D: The vehicle making a right turn
  answer: A
  explanation: At "T" intersections where one road dead-ends into another main crossing
    roadway, the vehicles on the road ending must yield to oncoming traffic from both
    directions on the main road.
- id: 422
  category: defensive_driving
  question: What should you do if traffic in front of you is backed up and you cannot
    get completely through an intersection?
  choices:
    A: Enter the intersection and wait for traffic to clear
    B: Wait until traffic clears so you do not block the intersection
    C: Proceed slowly and honk your horn
    D: Move into the intersection and turn on your hazard lights
  answer: B
  explanation: Do not enter an intersection unless you can get through it without
    having to stop. You should wait until traffic in front of you clears so that you
    are not blocking the intersection.
- id: 423
  category: sharing_the_road
  question: What must you do when an emergency vehicle with a siren or flashing lights
    is approaching?
  choices:
    A: Stop immediately in your current lane
    B: Speed up to stay ahead of the emergency vehicle
    C: Drive to a position parallel to and as close as possible to the right hand
      edge or curb and stop
    D: Pull over to the left side of the road and slow down
  answer: C
  explanation: Tennessee law requires that when an emergency vehicle is approaching,
    all traffic must yield the right-of-way and immediately drive to a position parallel
    to, and as close as possible to the right hand edge or curb of the roadway and
    stop.
- id: 424
  category: sharing_the_road
  question: If you are in the middle of an intersection when an emergency vehicle
    approaches with its siren on, what should you do?
  choices:
    A: Stop immediately in the middle of the intersection
    B: Drive on through the intersection before pulling over to the right
    C: Put your vehicle in reverse and back out of the intersection
    D: Pull over to the left side of the intersection
  answer: B
  explanation: If you are in an intersection, drive on through the intersection before
    pulling over, or you may block the emergency vehicle's path through the intersection.
- id: 425
  category: safe_driving_rules
  question: Under Tennessee's Move Over Law, what must you do when approaching a stationary
    emergency or utility vehicle with flashing lights on a multi-lane road?
  choices:
    A: Stop your vehicle and wait for the stationary vehicle to move
    B: Make a lane change into a lane not adjacent to the vehicle, or proceed with
      caution by reducing speed
    C: Maintain your speed and honk your horn to alert the workers
    D: Pull over to the shoulder and turn on your hazard lights
  answer: B
  explanation: Tennessee's Move Over Law requires that when approaching any stationary
    emergency vehicle with lights flashing, you must make a lane change into a lane
    not adjacent to that of the vehicle, or proceed with caution by reducing the speed
    of the vehicle.
- id: 426
  category: sharing_the_road
  question: Are you required to stop for a transit bus (metro bus) that is stopped
    for passenger pick-up or drop-off?
  choices:
    A: Yes, you must stop just as you would for a school bus
    B: Yes, but only if the bus has its hazard lights flashing
    C: No, you are not required to stop or forbidden to pass
    D: No, unless the bus is in a designated school zone
  answer: C
  explanation: You are not required to stop for, nor forbidden to pass, transit buses
    when they are stopped for passenger pick-up or drop-off as you would be for a
    school bus in the same situation.
- id: 427
  category: safe_driving_rules
  question: Which of the following actions is illegal regarding fire trucks or emergency
    vehicles responding to an emergency?
  choices:
    A: Yielding the right-of-way to them at an intersection
    B: Following a fire truck responding to a fire alarm
    C: Turning down your radio volume when they approach
    D: Pulling over to the right curb when they approach
  answer: B
  explanation: It is against the law to follow a fire truck or other emergency vehicle
    responding to a fire alarm or other emergency.
- id: 428
  category: safe_driving_rules
  question: What is the first rule of turning?
  choices:
    A: Turn from the closest lane in the direction you are traveling to the closest
      legal lane in the direction you want to go
    B: Always turn into the far left lane
    C: Signal for at least 50 feet before making the turn
    D: Honk your horn before initiating the turn
  answer: A
  explanation: The first rule of turning is to turn from the closest lane in the direction
    you are traveling to the closest legal lane in the direction you want to go.
- id: 429
  category: vehicle_information
  question: Which of the following is illegal for an unauthorized private vehicle
    to have installed or visibly shown?
  choices:
    A: A white flashing light
    B: A yellow flashing emergency light
    C: A blue flashing emergency light or combination of blue and red
    D: A green flashing light
  answer: C
  explanation: It is against the law for an unauthorized private vehicle to have a
    blue flashing emergency light or combination of blue and red flashing emergency
    lights installed, maintained or visibly shown on the vehicle in any manner.
- id: 430
  category: safe_driving_rules
  question: If you have a green traffic light, but another vehicle is already in the
    intersection, what must you do?
  choices:
    A: Proceed through the intersection since you have the right-of-way
    B: Honk your horn to force the other vehicle to move
    C: Yield to the vehicle already in the intersection
    D: Swerve around the vehicle to maintain traffic flow
  answer: C
  explanation: You must yield the right-of-way to any vehicles already in the intersection,
    even if you have the green traffic light.
- id: 431
  category: safe_driving_rules
  question: How far in advance must you turn on your turn signal lights before making
    a turn?
  choices:
    A: At least 25 feet
    B: At least 50 feet
    C: At least 100 feet
    D: At least 200 feet
  answer: B
  explanation: The manual states that at least 50 feet before the turn, you must turn
    on your turn signal lights.
- id: 432
  category: safe_driving_rules
  question: Does using your turn signal give you the right-of-way to change lanes
    or turn?
  choices:
    A: Yes, if you signal at least 50 feet in advance.
    B: Yes, but only when entering a parking lot.
    C: No, signaling does NOT give you the right-of-way.
    D: No, unless you are using hand signals.
  answer: C
  explanation: Your signal lets other drivers know your intentions to make a change
    in your vehicle's path of travel, but the manual explicitly states that signaling
    does NOT give you the right-of-way.
- id: 433
  category: defensive_driving
  question: Why should you keep your vehicle's wheels straight while waiting to make
    a turn?
  choices:
    A: It helps the power steering fluid circulate.
    B: It prevents your tires from wearing out unevenly.
    C: If you are hit from the rear, the impact could push you into oncoming traffic.
    D: It allows you to accelerate faster when the light turns green.
  answer: C
  explanation: The manual warns not to turn your wheels in the direction of the turn
    while waiting for oncoming traffic to pass. If you are hit from the rear while
    your wheels are turned, the impact can push you into oncoming traffic.
- id: 434
  category: safe_driving_rules
  question: If you plan to turn into a driveway just beyond an intersection, when
    should you signal?
  choices:
    A: At least 50 feet before the intersection.
    B: Do not signal until you are in the intersection.
    C: Right as you begin to turn the steering wheel.
    D: You do not need to signal for driveways.
  answer: B
  explanation: If you plan to turn beyond an intersection, do not signal until you
    are in the intersection. If you signal earlier, another driver may think you intend
    to turn at the intersection and might pull into your path.
- id: 435
  category: defensive_driving
  question: Under what weather condition does the manual specifically recommend using
    hand signals because your vehicle's signal lights might be hard to see?
  choices:
    A: Heavy rain
    B: Dense fog
    C: When the sun is shining brightly
    D: During a snowstorm
  answer: C
  explanation: Hand signals should be used when the sun is shining brightly. This
    makes your turn signal light harder for other drivers to see easily.
- id: 436
  category: safe_driving_rules
  question: 'You should NOT use your turn signals to:'
  choices:
    A: Indicate you are pulling away from a parked position.
    B: Signal a driver behind you to come around and pass your vehicle.
    C: Show you are entering the interstate.
    D: Indicate you are slowing down suddenly.
  answer: B
  explanation: The manual states you should NOT use your signals to signal a driver
    behind you to come around to pass your vehicle, as this is misleading to other
    drivers.
- id: 437
  category: vehicle_information
  question: Why should you avoid shifting gears while in the intersection?
  choices:
    A: It causes excessive wear on the clutch.
    B: It is illegal and carries a heavy fine.
    C: You could stall, causing an accident or blocking the intersection.
    D: It makes your turn signal turn off automatically.
  answer: C
  explanation: 'The manual advises: "Don''t shift gears in the intersection (If you
    stall you could cause an accident and/or block the intersection to other traffic)."'
- id: 438
  category: defensive_driving
  question: How can you attract attention with your brake lights when signaling a
    stop?
  choices:
    A: Turn your hazard lights on.
    B: Lightly pump your brakes a few times.
    C: Press the brake pedal to the floor immediately.
    D: Shift into neutral before braking.
  answer: B
  explanation: When signaling a stop, you should lightly pump your brakes a few times
    to attract attention with your brake lights.
- id: 439
  category: safe_driving_rules
  question: When you meet another driver at an intersection and both of you want to
    turn left, how should you proceed?
  choices:
    A: Each driver will turn to the right of the other.
    B: The driver who arrived first has the right-of-way to turn first.
    C: Each driver will turn to the left of the other.
    D: Both drivers must wait for a green arrow.
  answer: C
  explanation: When you meet another driver at an intersection and both of you want
    to turn left, each will turn to the left of the other.
- id: 440
  category: signs_and_signals
  question: What color are the center lines on one-way streets?
  choices:
    A: Yellow
    B: White
    C: Red
    D: Blue
  answer: B
  explanation: According to the manual, center lines on two-way streets are yellow,
    while center lines on one-way streets are white.
- id: 441
  category: safe_driving_rules
  question: What should you do with your arm when using a hand signal during the actual
    turn?
  choices:
    A: Keep it fully extended until the turn is complete.
    B: Wave it in a circular motion.
    C: Bring your arm in to keep control of the steering wheel.
    D: Point to the lane you are turning into.
  answer: C
  explanation: When you use hand signals, you should bring your arm in during the
    actual turn to keep control of the steering wheel.
- id: 442
  category: defensive_driving
  question: What is a potential danger of forgetting to turn off your turn signal
    after using it?
  choices:
    A: It will drain your vehicle's battery.
    B: It might tempt other drivers to pull out in front of you.
    C: It will cause your brake lights to stop working.
    D: It will automatically engage your emergency brake.
  answer: B
  explanation: An unintended signal still means "turn" to other drivers. By leaving
    it on, you might tempt other drivers to pull out in front of you.
- id: 443
  category: safe_driving_rules
  question: When making a routine left turn from a two-way street onto another two-way
    street, where should you drive just after entering the new street?
  choices:
    A: Into the far right lane to avoid oncoming traffic.
    B: Just to the right of the center line in the first lane past the center line.
    C: Directly on top of the center line.
    D: Into any available lane that is free of traffic.
  answer: B
  explanation: Drive just to the right of the center line of the street you're entering
    and be sure to turn into the first lane past the center line. This avoids conflict
    with other traffic making either right or left turns.
- id: 444
  category: signs_and_signals
  question: If you are waiting to make a left turn and the traffic light turns yellow
    while you are waiting for oncoming vehicles to clear, what should you do?
  choices:
    A: Accelerate quickly to beat the red light.
    B: Proceed into the intersection immediately.
    C: DO NOT proceed into the intersection.
    D: Back up into the crosswalk.
  answer: C
  explanation: 'The manual states: "If the light turns yellow while you are waiting
    for oncoming vehicles to clear the intersection, DO NOT proceed into the intersection."'
- id: 445
  category: safe_driving_rules
  question: When making a left turn from a two-way street onto a one-way street, which
    lane should you turn into?
  choices:
    A: The lane furthest to the right.
    B: The center lane.
    C: The first lane closest to the left curb.
    D: Any lane that is currently open.
  answer: C
  explanation: When turning from a two-way street onto a one-way street, the manual
    instructs to 'Turn sharply into the FIRST lane... You should turn into the first
    lane closest to the left curb.'
- id: 446
  category: safe_driving_rules
  question: Under what condition is a left turn permitted at a red light in Tennessee?
  choices:
    A: When turning from a two-way street onto a one-way street.
    B: When turning from a one-way street onto another one-way street.
    C: When turning from a one-way street onto a two-way street.
    D: Left turns on red are never permitted.
  answer: B
  explanation: A left turn at a red light is permitted at all intersections where
    a one-way street intersects with another one-way street, provided you come to
    a complete stop first and there are no signs prohibiting it.
- id: 447
  category: safe_driving_rules
  question: Can you make a left turn on a red light when turning from a one-way street
    onto a two-way street?
  choices:
    A: Yes, after coming to a complete stop.
    B: Yes, if there is no oncoming traffic.
    C: No, you CANNOT make this left turn on a red light.
    D: Yes, but only between the hours of midnight and 6 AM.
  answer: C
  explanation: 'The manual explicitly states regarding turning from a one-way street
    onto a two-way street: ''You CANNOT make this left turn on a red light.'''
- id: 448
  category: safe_driving_rules
  question: How far ahead of a right turn must you give a turn signal?
  choices:
    A: At least 25 feet.
    B: At least 50 feet.
    C: At least 100 feet.
    D: At least 200 feet.
  answer: B
  explanation: The manual states that you must 'Give a signal for a right turn for
    at least 50 feet.'
- id: 449
  category: defensive_driving
  question: Why should you avoid swinging wide to the left before or during a right
    turn?
  choices:
    A: It will cause your steering wheel to lock.
    B: The driver behind you may think you are changing lanes or turning left and
      try to pass you on the right.
    C: It is illegal to cross the white line.
    D: It will cause you to enter a roundabout.
  answer: B
  explanation: If you swing wide to the left on a right turn, 'the driver behind you
    may think you are changing lanes or turning left and may try to pass you on the
    right.'
- id: 450
  category: sharing_the_road
  question: Why should you avoid passing a large truck on the right if there is a
    possibility it might make a right turn?
  choices:
    A: Trucks accelerate faster than cars.
    B: Trucks must make wide turns and sometimes leave an open space to the right
      just before the turn.
    C: Trucks are not allowed to use turn signals.
    D: Trucks always have the right-of-way at intersections.
  answer: B
  explanation: Large trucks and buses MUST make wide turns and sometimes leave an
    open space to the right just before the turn. Passing on the right can cause an
    accident.
- id: 451
  category: safe_driving_rules
  question: In which direction must you always travel around a roundabout?
  choices:
    A: Clockwise.
    B: Counter-clockwise (to the right).
    C: In a straight line through the center.
    D: Whichever direction has less traffic.
  answer: B
  explanation: The manual instructs drivers to 'Always travel around a roundabout
    to the right, in a counter-clockwise direction.'
- id: 452
  category: safe_driving_rules
  question: What is the rule regarding passing other vehicles in a multi-lane roundabout?
  choices:
    A: You may pass on the left only.
    B: You may pass on the right only.
    C: You may pass if the vehicle ahead is traveling under 15 mph.
    D: Do not overtake or pass any vehicles.
  answer: D
  explanation: 'In a multi-lane roundabout, the manual explicitly states: ''do not
    overtake or pass any vehicles.'''
- id: 453
  category: safe_driving_rules
  question: You may NOT make a U-turn at any location where you cannot see traffic
    coming from both directions for at least what distance?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: You may not make a U-turn at any rural or urban location, or near a
    curve or hill crest, where you cannot see traffic coming from both directions
    for at least 500 feet.
- id: 454
  category: safe_driving_rules
  question: What should you do if you miss your exit on an interstate highway in Tennessee?
  choices:
    A: Use the emergency crossover in the median to turn around.
    B: Make a U-turn when the highway is clear.
    C: Drive on to the next exit ramp.
    D: Back up carefully on the shoulder.
  answer: C
  explanation: 'It is illegal to make a U-turn on an interstate or use emergency crossovers.
    The manual advises: ''Drive on to the next exit ramp.'''
- id: 455
  category: safe_driving_rules
  question: Which phrase summarizes the principle of 'right hand traffic' on American
    roadways?
  choices:
    A: Yellow on your right, white on your left
    B: White on your right, yellow on your left
    C: Keep right except to turn right
    D: Pass on the right, drive on the left
  answer: B
  explanation: 'The manual states the overview of lane usage is summed up by the simple
    statement: ''White on your right, yellow on your left.'''
- id: 456
  category: safe_driving_rules
  question: What is the center lane of a two-way, three-lane or five-lane highway
    used for?
  choices:
    A: Passing slow-moving vehicles.
    B: Emergency parking only.
    C: Turning left only.
    D: Turning right only.
  answer: C
  explanation: 'The manual explicitly states: ''The center lane of a two-way, three-lane
    or five-lane highway is used only for turning left.'''
- id: 457
  category: safe_driving_rules
  question: Is it legal to make a U-turn at an intersection where a traffic light
    or police officer is controlling the traffic flow?
  choices:
    A: Yes, if you have a green light.
    B: Yes, if there is no oncoming traffic.
    C: No, you may not make a U-turn at these intersections.
    D: Yes, but only in rural areas.
  answer: C
  explanation: 'The manual lists locations where you may NOT make a U-turn, including:
    ''At any intersection where a traffic light or police officer is controlling the
    traffic flow.'''
- id: 458
  category: safe_driving_rules
  question: How should you indicate your intention to exit a roundabout?
  choices:
    A: Flash your headlights.
    B: Use your left turn signal.
    C: Use your right turn signal.
    D: Sound your horn.
  answer: C
  explanation: The manual instructs drivers to 'Exit the roundabout carefully. Always
    indicate your exit using your right turn signal.'
- id: 459
  category: safe_driving_rules
  question: On a four-lane highway, where should you generally drive?
  choices:
    A: In the extreme left lane at all times
    B: In the extreme right lane except when passing or making a left turn
    C: In whichever lane has the least amount of traffic
    D: Straddling the dashed white line to maintain visibility
  answer: B
  explanation: According to the manual, on a four-lane highway, you should 'Drive
    in the extreme right lane except when passing another vehicle or making a left
    turn.'
- id: 460
  category: defensive_driving
  question: When attempting to use a designated crossover on a divided four-lane highway,
    what should you do if another vehicle is already in the crossover waiting for
    traffic to clear?
  choices:
    A: Swing into the left side of the crossover next to the waiting vehicle
    B: Bunch up closely behind the waiting car inside the crossover
    C: Remain stopped in the left-most lane of the highway with your turn signal on
    D: Proceed to the next intersection to make a U-turn
  answer: C
  explanation: 'The manual states: ''If a vehicle is already in the crossover waiting
    for traffic to clear, remain stopped in the left most lane of the four-lane highway
    with your turn signal on until the waiting vehicle has cleared the crossover.'''
- id: 461
  category: signs_and_signals
  question: What does it mean if you see red reflectors facing you on the lane lines
    or edge lines of the road?
  choices:
    A: You are approaching a construction zone
    B: You are facing traffic the wrong way and could have a head-on collision
    C: You are entering a high-occupancy vehicle (HOV) lane
    D: The speed limit is reducing ahead
  answer: B
  explanation: 'The manual warns: ''Red reflectors always mean you are facing traffic
    the wrong way and could have a head-on collision.'''
- id: 462
  category: safe_driving_rules
  question: What is the maximum distance you are permitted to travel in a shared center
    turn lane?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: C
  explanation: The manual specifies that shared center turn lanes 'cannot be used
    for passing and cannot be used for travel farther than 300 feet.'
- id: 463
  category: safe_driving_rules
  question: If two vehicles enter a shared center turn lane from opposite directions
    at the same time, who has the right-of-way?
  choices:
    A: The vehicle traveling at a higher speed
    B: The vehicle making a right turn
    C: The larger of the two vehicles
    D: The first vehicle to enter the lane
  answer: D
  explanation: According to the manual, 'When vehicles enter the turn lane from opposite
    directions, the first vehicle to enter the lane has the right-of-way.'
- id: 464
  category: signs_and_signals
  question: How are reversible lanes usually marked on the roadway?
  choices:
    A: By double-broken yellow lines
    B: By solid white lines on both sides
    C: By a single solid yellow line
    D: By alternating red and white reflectors
  answer: A
  explanation: The manual states that reversible lanes 'are usually marked by double-broken
    yellow lines.'
- id: 465
  category: signs_and_signals
  question: When driving in a reversible lane, what does a flashing yellow 'X' overhead
    mean?
  choices:
    A: You cannot drive in the lane below
    B: The lane is only for turning
    C: The direction of the lane is changing
    D: You can drive straight ahead in the lane
  answer: B
  explanation: The manual explains that 'A flashing yellow “X” means the lane is only
    for turning.'
- id: 466
  category: signs_and_signals
  question: What action should you take if you see a steady yellow 'X' over a reversible
    lane?
  choices:
    A: Speed up to clear the lane quickly
    B: Stop immediately in the lane
    C: Move out of the lane as soon as it is safe to do so
    D: Use the lane for passing only
  answer: C
  explanation: According to the manual, 'A steady yellow “X” means that the use/direction
    of the lane is changing and you should move out of it as soon as it is safe to
    do so.'
- id: 467
  category: signs_and_signals
  question: What does a sign reading 'HOV 2' indicate about a reserved lane?
  choices:
    A: The lane is reserved for vehicles with at least two people in them
    B: The lane is reserved for heavy commercial vehicles only
    C: The lane is closed for the next two miles
    D: Only hybrid or electric vehicles may use the lane
  answer: A
  explanation: 'The manual states: ''For example, “HOV 2” means there must be at least
    two people in the vehicle for you to legally drive in that lane.'''
- id: 468
  category: defensive_driving
  question: Why is it essential to look over your shoulder before changing lanes?
  choices:
    A: To check the speed of the vehicle behind you
    B: To ensure your turn signal is functioning properly
    C: To check your blind spots for vehicles that cannot be seen in your mirrors
    D: To communicate your intentions to other drivers
  answer: C
  explanation: The manual explains that a driver 'cannot see the motorcycle or other
    car just by checking his mirrors. He would need to physically turn his head and
    look over his shoulder in each direction to see those vehicles next to him' to
    check blind spots.
- id: 469
  category: sharing_the_road
  question: What should you do if a driver ahead of you signals their intention to
    change lanes?
  choices:
    A: Speed up to pass them before they change lanes
    B: Slow down and leave space for the change
    C: Change lanes yourself to get out of their way
    D: Honk your horn to warn them not to move
  answer: B
  explanation: 'The manual advises: ''When a driver ahead of you (in your lane or
    the lane next to you) signals a lane change, slow down and leave space for the
    change. Do NOT speed up or change lanes yourself...'''
- id: 470
  category: safe_driving_rules
  question: When preparing to pass another vehicle on a two-lane road, what is a good
    rule regarding oncoming traffic?
  choices:
    A: If you see any sign of an oncoming vehicle, it is too close for you to risk
      a pass
    B: You may pass if the oncoming vehicle is more than 100 feet away
    C: Flash your headlights so the oncoming vehicle slows down
    D: Accelerate rapidly to beat the oncoming vehicle
  answer: A
  explanation: 'The manual states: ''As a rule, if you see any sign of an oncoming
    vehicle, it is too close for you to risk a pass. When in doubt, stay in your lane.'''
- id: 471
  category: defensive_driving
  question: Why should you stay well behind a vehicle you want to pass before initiating
    the maneuver?
  choices:
    A: To build up enough speed to pass quickly
    B: To allow yourself a better view of the road ahead
    C: To avoid being hit by debris kicked up by their tires
    D: To hide in their blind spot until you are ready to pass
  answer: B
  explanation: The manual instructs drivers to 'Stay well behind the vehicle you want
    to pass to allow yourself a better view of the road ahead.'
- id: 472
  category: defensive_driving
  question: Why should you avoid swinging out across the center line just to get a
    look before passing?
  choices:
    A: It is illegal to cross the center line under any circumstances
    B: It indicates you are either following too closely or attempting to pass unsafely
    C: It will cause your vehicle to lose traction
    D: It confuses drivers behind you into thinking you are turning left
  answer: B
  explanation: 'The manual warns: ''Do NOT swing out across the center line for a
    look. If you need to do this to see, you are either following too closely or attempting
    to pass.'''
- id: 473
  category: safe_driving_rules
  question: Which of the following statements is true regarding crossovers on interstates?
  choices:
    A: They can be used for U-turns if the median is paved
    B: They are reserved for high-occupancy vehicles only
    C: There are no crossovers provided for traffic on interstates
    D: They should be treated the same as a cross street
  answer: C
  explanation: 'The manual explicitly states: ''There are NO crossovers provided for
    traffic on interstates.'''
- id: 474
  category: safe_driving_rules
  question: When passing a vehicle on the left, when is it safe to return to the right
    lane?
  choices:
    A: When you are 50 feet ahead of the vehicle.
    B: As soon as you pass the front bumper of the vehicle.
    C: When you can see the entire vehicle you passed in your rearview mirror.
    D: When the driver you passed flashes their headlights.
  answer: C
  explanation: 'The manual states: ''Complete your pass as soon as possible. When
    you can see the entire vehicle you passed in your rear view mirror, signal right
    and return to your lane.'''
- id: 475
  category: safe_driving_rules
  question: In Tennessee, is it illegal to pass multiple vehicles at the same time?
  choices:
    A: Yes, it is strictly prohibited by law.
    B: No, it is not illegal, but it is generally not recommended.
    C: Yes, unless you are on a multi-lane highway.
    D: No, it is the recommended way to pass slow-moving traffic.
  answer: B
  explanation: 'The manual notes: ''As a general rule, it is NOT SAFE to pass more
    than one vehicle at a time, although it is not illegal in Tennessee to pass multiple
    vehicles. It is recommended that you not even consider passing multiple vehicles
    unless...'''
- id: 476
  category: safe_driving_rules
  question: Under which of the following conditions is passing on the right permitted?
  choices:
    A: When the vehicle ahead has signaled to make a left turn.
    B: When you use the paved shoulder of the highway.
    C: When you use a designated bike lane to bypass traffic.
    D: When the vehicle ahead is driving below the speed limit on a two-lane road.
  answer: A
  explanation: Passing on the right is permitted 'When the vehicle overtaken has signaled
    to make or is about to make a left turn.' Passing off the pavement or in a bike
    lane is never permitted.
- id: 477
  category: safe_driving_rules
  question: When are you allowed to pass a vehicle on the right using an emergency
    lane or parking lane?
  choices:
    A: When the vehicle ahead is stopped for a red light.
    B: When you are within sight of a traffic light or stop sign.
    C: When the vehicle ahead is turning left.
    D: You are never allowed to pass on the right using a parking or emergency lane.
  answer: D
  explanation: 'The manual explicitly states: ''Do NOT pass on the right using a bike
    lane or parking lane at any location, nor in the emergency lane within sight of
    a traffic light or stop sign.'''
- id: 478
  category: sharing_the_road
  question: When stopping for a crosswalk on a multi-lane road, how far before the
    crosswalk should you stop?
  choices:
    A: 10 feet
    B: 15 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: 'According to the Safety Tip in the manual: ''When stopping for a crosswalk
    on a multi-lane road, you should stop about 30 feet before the crosswalk so you
    do not block visibility of the crossing pedestrians to drivers in the other lane(s).'''
- id: 479
  category: signs_and_signals
  question: What does the end of a 'no-passing zone' indicate?
  choices:
    A: It is automatically safe to pass.
    B: There is increased visibility ahead, but you must still determine if it is
      safe to pass.
    C: You are required to pass any slow-moving vehicles ahead.
    D: The speed limit increases.
  answer: B
  explanation: 'The manual states: ''The end of a "no-passing zone" does not mean
    it is safe to pass. It means there is increased visibility ahead. It is still
    up to YOU to determine if it is safe to pass...'''
- id: 480
  category: safe_driving_rules
  question: Are you ever allowed to cross a solid yellow line marked on the pavement
    in a 'no-passing zone'?
  choices:
    A: No, crossing a solid yellow line is never permitted.
    B: Yes, but only to pass a slow-moving tractor or bicycle.
    C: Yes, you may turn across the center line to enter or exit an alley, private
      road, or driveway.
    D: Yes, if you can complete the pass before oncoming traffic arrives.
  answer: C
  explanation: 'The manual explains: ''You are allowed to turn across the center line
    if you are making a left turn into or coming out of an alley, intersection, private
    road or driveway while in the "no-passing zone".'''
- id: 481
  category: defensive_driving
  question: What should you do if another vehicle is passing you and you observe an
    oncoming car approaching?
  choices:
    A: Speed up so the passing vehicle can pull in behind you.
    B: Move to the left to block the passing vehicle.
    C: Slow down to allow the passing driver more space to pull back into the right
      lane.
    D: Sound your horn and maintain your current speed.
  answer: C
  explanation: To help another driver pass safely, you should be 'Slowing down if
    you observe a car approaching from the other direction while you are being passed.
    By slowing down, you will allow the passing driver more space to pull back into
    the right lane...'
- id: 482
  category: sharing_the_road
  question: What is the minimum distance you must leave between your vehicle and a
    bicycle when passing them?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: 'The manual states: ''When passing and overtaking a bicyclist proceeding
    in the same direction, do so slowly and leave at least a distance between you
    and the bicycle of not less than 3 feet.'''
- id: 483
  category: sharing_the_road
  question: How can you tell if you are driving in a large truck or bus driver's blind
    spot while following them?
  choices:
    A: You can see the driver's face in their rearview mirror.
    B: You cannot see the side mirrors on the truck or bus.
    C: You are following at a distance of more than 100 feet.
    D: You can see the entire trailer of the truck.
  answer: B
  explanation: 'The manual provides an excellent point to remember: ''if you cannot
    see the side mirrors on the truck or bus you are following, then the truck or
    bus driver CANNOT SEE YOU.'''
- id: 484
  category: sharing_the_road
  question: What is a dangerous mistake drivers often make after passing a large truck
    or bus?
  choices:
    A: Accelerating too quickly after returning to the lane.
    B: Pulling in front of the truck or bus and slowing down.
    C: Canceling their turn signal too early.
    D: Leaving too much space between their car and the truck.
  answer: B
  explanation: 'The manual instructs: ''Maintain your speed. NEVER pull in front of
    a truck or bus (or any type of vehicle) and slow down. This takes away the safety
    cushion of the driver you have just passed...'''
- id: 485
  category: sharing_the_road
  question: How does traveling on a downgrade affect passing a large truck or bus?
  choices:
    A: The truck will lose speed, making it easier to pass.
    B: The truck's momentum will cause it to go faster, so you may need to increase
      your speed to pass.
    C: The truck will be forced to pull over to the shoulder.
    D: Passing on a downgrade is strictly prohibited by law.
  answer: B
  explanation: 'The manual explains that terrain matters: ''On a down grade, their
    momentum will cause them to go faster, so you may need to increase your speed
    to pass.'''
- id: 486
  category: defensive_driving
  question: What is the proper procedure when another driver is trying to pass you
    on the left?
  choices:
    A: Speed up to prevent them from cutting in too sharply.
    B: Move to the left lane to block them if it is unsafe.
    C: Stay in your lane, move to the right, and maintain your speed.
    D: Flash your headlights to warn oncoming traffic.
  answer: C
  explanation: 'When being passed, you should help the other driver by: ''Staying
    in your lane, and moving to the right if being passed on the left. Maintaining
    your speed. DO NOT speed up to keep the other driver from passing.'''
- id: 487
  category: safe_driving_rules
  question: Which of the following situations prohibits you from crossing the center
    line to pass?
  choices:
    A: When approaching a car that has stopped for pedestrians in a crosswalk.
    B: When the vehicle ahead is traveling 15 mph below the speed limit.
    C: When you are on a straight, level roadway with excellent vision.
    D: When the vehicle ahead is a bicycle.
  answer: A
  explanation: 'The manual lists several conditions where you may NOT cross the center
    line to pass, including: ''Do not pass a car that has stopped for pedestrians
    in a marked or unmarked crosswalk.'''
- id: 488
  category: safe_driving_rules
  question: When passing another vehicle, is it legal to exceed the posted speed limit?
  choices:
    A: Yes, but only by a maximum of 5 mph.
    B: Yes, if you are passing a commercial truck with multiple trailers.
    C: No, it is illegal to exceed the posted speed limit even when passing.
    D: Yes, if you are on a downgrade and need to pass quickly.
  answer: C
  explanation: 'The manual states: "Remember, it is illegal to exceed the speed posted
    speed limit even when passing other vehicles."'
- id: 489
  category: safe_driving_rules
  question: What is the proper way to look behind you when backing up your vehicle?
  choices:
    A: Depend solely on your rearview and side mirrors.
    B: Open the door and stick your head out to see.
    C: Place your arm on the back of the seat and turn around to look directly through
      the rear window.
    D: Honk your horn and back up quickly while checking the rearview mirror.
  answer: C
  explanation: Before backing, you should place your arm on the back of the seat and
    turn around so that you can look directly through the rear window. The manual
    explicitly warns against depending solely on mirrors or opening the door to look
    out.
- id: 490
  category: safe_driving_rules
  question: What should you do if you miss your turn or exit on the interstate?
  choices:
    A: Stop and back up carefully on the shoulder.
    B: Put on your hazard lights and back up in the travel lane.
    C: Make a U-turn across the median.
    D: Go on to the next turn or exit where you can safely and legally turn around.
  answer: D
  explanation: If you miss your turn or exit, do NOT back up, but go on to the next
    turn or exit or where you can safely and legally turn around. It is illegal to
    back up on the interstate.
- id: 491
  category: safe_driving_rules
  question: When parking adjacent to a roadway outside the city limits, your vehicle
    must be visible for at least how many feet in either direction?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: C
  explanation: When parking adjacent to a roadway outside the city limits, your vehicle
    must be visible for at least 200 feet in either direction.
- id: 492
  category: safe_driving_rules
  question: When parking outside city limits, you must ensure you leave at least how
    much road width for other traffic to pass your parked vehicle?
  choices:
    A: 10 feet
    B: 12 feet
    C: 15 feet
    D: 18 feet
  answer: D
  explanation: No matter what, you must ensure that you leave at least 18 feet of
    road width for other traffic to pass your parked vehicle when parking adjacent
    to a roadway outside city limits.
- id: 493
  category: safe_driving_rules
  question: Which way should you turn your front wheels when parking on an uphill
    with a curb?
  choices:
    A: Toward the curb (right)
    B: Away from the curb (left)
    C: Straight ahead
    D: Parallel to the curb
  answer: B
  explanation: On an uphill with a curb, turn the front wheels away from the curb
    (left). This way, if the car starts to roll back, it will roll into the curb and
    stop.
- id: 494
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: B
  explanation: The manual lists "Within 15 feet of a fire hydrant" under the NO PARKING
    ZONES where it is illegal to park.
- id: 495
  category: safe_driving_rules
  question: You may not park within how many feet of a crosswalk?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 30 feet
  answer: C
  explanation: It is illegal to park within 20 feet of a crosswalk or in the crosswalk
    marked area.
- id: 496
  category: safe_driving_rules
  question: 'Upon completion of a parallel parking maneuver, your vehicle should be
    no farther away from the curb than:'
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: Upon completion of your parallel parking maneuver, the vehicle should
    be no farther away from the curb than 18 inches.
- id: 497
  category: defensive_driving
  question: If you cannot move your disabled vehicle off the highway, what is one
    way to warn other motorists?
  choices:
    A: Stand in the road and wave your arms.
    B: Tie a handkerchief on the left door handle or antenna.
    C: Flash your headlights continuously.
    D: Sound your horn every 10 seconds.
  answer: B
  explanation: If you cannot move the vehicle off the highway, raise the hood or tie
    a handkerchief on the left door handle or antenna to warn other motorists of your
    stopped vehicle.
- id: 498
  category: vehicle_information
  question: What should you do with your vehicle's transmission when parking a car
    with a manual transmission?
  choices:
    A: Leave it in neutral and apply the parking brake.
    B: Leave it in park.
    C: Leave the vehicle in gear and set the parking brake.
    D: Leave it in neutral without the parking brake.
  answer: C
  explanation: Always set the parking brake when you park. Leave the vehicle in gear
    if it has a manual transmission, or in park if it has an automatic transmission.
- id: 499
  category: safe_driving_rules
  question: Is it legal to back into an intersection from a driveway?
  choices:
    A: Yes, if you look both ways first.
    B: Yes, but only during daylight hours.
    C: No, it is illegal to back into an intersection from a driveway.
    D: No, unless you have a passenger guiding you.
  answer: C
  explanation: 'The manual explicitly states: "It is illegal to back into an intersection
    from a driveway."'
- id: 500
  category: safe_driving_rules
  question: What does the driver's manual state regarding walking on the interstate?
  choices:
    A: It is allowed as long as you stay on the shoulder.
    B: It is legal only during daylight hours.
    C: It is both illegal and dangerous.
    D: It is recommended if your car breaks down and you need gas.
  answer: C
  explanation: The manual explicitly states that walking on the interstate is both
    illegal and dangerous, and you should remain in your disabled vehicle until help
    arrives.
- id: 501
  category: penalties_and_points
  question: What is the penalty for improperly parking in a designated handicap space?
  choices:
    A: A $50 fine and a written warning.
    B: A misdemeanor punishable by a $100 fine and the vehicle may be towed.
    C: A felony punishable by a $500 fine.
    D: Immediate license suspension for 30 days.
  answer: B
  explanation: Improperly parking in designated handicap spaces is a misdemeanor punishable
    by a $100 fine, and the vehicle could be subject to being towed.
- id: 502
  category: safe_driving_rules
  question: When backing out of an angle parking space, what should you remember about
    the front of your car?
  choices:
    A: It will swing in the same direction as the turn.
    B: It will swing opposite to the direction of the turn.
    C: It will move straight back without swinging.
    D: It will swing toward the nearest curb.
  answer: B
  explanation: Before backing out of an angle parking space, you must remember that
    the front of your car will swing opposite to the direction of the turn.
- id: 503
  category: sharing_the_road
  question: 'When passing a bicycle traveling in the same direction, motorists are
    required by law to allow a minimum distance of:'
  choices:
    A: 1 foot
    B: 2 feet
    C: 3 feet
    D: 5 feet
  answer: C
  explanation: Motorists are required by law when passing a bicycle traveling in the
    same direction to allow a minimum distance of 3 feet.
- id: 504
  category: safe_driving_rules
  question: When entering an interstate, what is the proper use of the acceleration
    lane?
  choices:
    A: To park your vehicle in an emergency.
    B: To stop and wait for a large gap in traffic.
    C: To speed up and merge with fast-moving traffic.
    D: To allow interstate traffic a place to exit.
  answer: C
  explanation: When entering an interstate, you must use the merging or acceleration
    lane to speed up and merge with fast-moving traffic already on the interstate.
- id: 505
  category: safe_driving_rules
  question: Who has the right-of-way when you are attempting to enter the interstate
    from an on-ramp?
  choices:
    A: The vehicle entering the interstate.
    B: Other cars already traveling on the interstate.
    C: Whichever vehicle is traveling faster.
    D: The vehicle on the right.
  answer: B
  explanation: It is your responsibility to yield the right-of-way to other cars already
    on the interstate when you are entering.
- id: 506
  category: signs_and_signals
  question: What does a 'lane added' sign indicate to drivers already traveling on
    the interstate?
  choices:
    A: They must merge left immediately.
    B: They should avoid making lane changes to the right at this location.
    C: They must yield to all entering traffic.
    D: The interstate is ending and they must exit.
  answer: B
  explanation: The 'lane added' sign means a new right lane is added for incoming
    traffic. Traffic on the interstate should avoid making lane changes to the right
    because entering traffic will not expect vehicles to move into their path.
- id: 507
  category: safe_driving_rules
  question: 'On interstates with several lanes traveling in the same direction, the
    extreme left lane should be used for:'
  choices:
    A: Entering traffic.
    B: Exiting traffic.
    C: Slower vehicles.
    D: Faster traffic.
  answer: D
  explanation: On interstates with several lanes of traffic traveling in the same
    direction, you should leave the extreme left lane for faster traffic.
- id: 508
  category: defensive_driving
  question: What is the minimum recommended following distance on the interstate in
    bad weather or at night?
  choices:
    A: Two seconds
    B: Three seconds
    C: Four seconds
    D: Six seconds
  answer: C
  explanation: You should stay at least two seconds behind vehicles in front of you,
    and increase this space to a minimum of four seconds in bad weather, night driving,
    and on higher speed rural sections.
- id: 509
  category: defensive_driving
  question: How far ahead should you scan the roadway when driving on the interstate?
  choices:
    A: 5-10 seconds
    B: 10-15 seconds
    C: 15-20 seconds
    D: 20-30 seconds
  answer: C
  explanation: The manual advises to scan the roadway ahead and try to watch 15-20
    seconds in front of your vehicle for cars braking, entering, or exiting.
- id: 510
  category: defensive_driving
  question: If you spot a tie-up on the interstate causing you to slow down or stop,
    what should you do to alert drivers behind you?
  choices:
    A: Turn on your high beams.
    B: Lightly tap your brake pedal several times.
    C: Sound your horn continuously.
    D: Swerve from side to side in your lane.
  answer: B
  explanation: If you spot a tie-up causing you to slow down or stop, you should lightly
    tap your brake pedal several times to alert drivers behind you.
- id: 511
  category: defensive_driving
  question: 'According to the manual''s sample questions, the two-second rule for
    following at a safe distance holds true at:'
  choices:
    A: Speeds up to 30 m.p.h.
    B: Speeds up to 55 m.p.h.
    C: Any speed.
    D: Only highway speeds.
  answer: C
  explanation: The sample test questions state that the two-second rule for following
    at a safe distance will hold true at any speed.
- id: 512
  category: safe_driving_rules
  question: If you are going to exit the interstate, what is the safest way to prepare?
  choices:
    A: Move to the right lane as early as possible to avoid hasty lane changes.
    B: Stay in the left lane until you reach the exit ramp.
    C: Speed up to pass slower traffic before cutting over to the exit.
    D: Stop in your lane and wait for a gap in the right lane.
  answer: A
  explanation: If you are going to exit the interstate, move to the right lane as
    early as possible to avoid hasty lane changes, which could result in a dangerous
    situation.
- id: 513
  category: penalties_and_points
  question: What is the penalty for violating High Occupancy Vehicle (HOV) lane rules?
  choices:
    A: A $25 fine
    B: A $50 fine and court costs
    C: A $100 fine and 2 points on your license
    D: A $75 fine and mandatory traffic school
  answer: B
  explanation: According to the manual, drivers found in violation of the HOV lane
    are subject to a $50 fine and court costs.
- id: 514
  category: safe_driving_rules
  question: Which of the following vehicles is permitted to use the High Occupancy
    Vehicle (HOV) lane during peak traffic hours?
  choices:
    A: A person driving alone to pass another vehicle
    B: A motorcycle occupied by one person
    C: A passenger car with only the driver
    D: A commercial truck with one driver
  answer: B
  explanation: During high inbound and outbound traffic hours, the HOV lane is reserved
    for vehicles with 2 or more persons, buses with 2 or more occupants, motorcycles
    occupied by 1 person, and emergency vehicles.
- id: 515
  category: safe_driving_rules
  question: If you are traveling in the left lane on an interstate and a vehicle comes
    up behind you at a faster speed, what should you do?
  choices:
    A: Speed up to match their speed
    B: Tap your brakes to warn them to slow down
    C: Move one lane to your right
    D: Stay in your lane because you are driving the speed limit
  answer: C
  explanation: 'The manual states: ''If you are traveling in the left lane and someone
    comes up behind you at a faster speed, move one lane to your right. Left lane
    is for passing only.'''
- id: 516
  category: safe_driving_rules
  question: How do you make a left turn at a cloverleaf interchange?
  choices:
    A: Take the left turn ramp before the overpass
    B: Take the right turn ramp just after the overpass
    C: Take the right turn ramp before the overpass
    D: Cross the path of traffic and turn left
  answer: B
  explanation: At a cloverleaf interchange, all turns are right turns. To turn left,
    you must take the right turn just after the overpass.
- id: 517
  category: sharing_the_road
  question: 'When trucks and buses are entering the interstate, you should:'
  choices:
    A: Speed up to get past them quickly
    B: Honk your horn to let them know you are there
    C: Be cooperative and give them extra time and space to adjust to traffic flow
    D: Force them to yield by maintaining your speed and lane position
  answer: C
  explanation: Remember that trucks and buses entering the interstate may need extra
    time to adjust to traffic patterns. Be cooperative and give them extra time and
    space to adjust to the traffic flow.
- id: 518
  category: safe_driving_rules
  question: When leaving the interstate, when should you begin to significantly reduce
    your speed?
  choices:
    A: One mile before the exit
    B: As soon as you signal your intention to exit
    C: After you enter the deceleration lane
    D: While you are still in the main traffic lane
  answer: C
  explanation: You should maintain your speed until you enter the deceleration lane,
    which is usually outlined by a series of white reflectors, and then reduce your
    speed to the exit ramp posted speed.
- id: 519
  category: safe_driving_rules
  question: Under what condition is it legal to park a motor vehicle on the paved
    or unpaved portion of an interstate entrance or exit ramp?
  choices:
    A: When you need to check your map or GPS
    B: Only if the vehicle is disabled
    C: When you need to make a phone call
    D: If you are waiting for another vehicle to catch up
  answer: B
  explanation: It is illegal to park a motor vehicle upon the paved or unpaved portions
    of any entrance or exit ramp of any highway unless the vehicle is disabled.
- id: 520
  category: defensive_driving
  question: What makes a 'weaving' interchange particularly hazardous?
  choices:
    A: Traffic is both exiting and entering at the same lane
    B: The lanes are narrower than standard interstate lanes
    C: Drivers must make sharp left turns across traffic
    D: There are no speed limits posted on the ramps
  answer: A
  explanation: One of the most hazardous lane management situations occurs when interstate
    traffic is both exiting and entering at the same lane, requiring complete attention
    and quick reactions.
- id: 521
  category: safe_driving_rules
  question: Who is legally permitted to drive over or across the dividing section
    (median) of an interstate?
  choices:
    A: Any driver who misses their exit
    B: Drivers of High Occupancy Vehicles (HOV)
    C: Only emergency vehicles and highway maintenance crews
    D: Any driver during a severe traffic jam
  answer: C
  explanation: On the interstate, you may NOT drive over or across any dividing section
    or separation. Only emergency vehicles and highway maintenance crews may cross
    an interstate median.
- id: 522
  category: defensive_driving
  question: What is the recommended practice regarding driving in the blind spots
    of other drivers on the interstate?
  choices:
    A: Follow closely to the side so they can hear your engine
    B: Either stay behind or go around them
    C: Flash your headlights continuously while in the blind spot
    D: Maintain your speed and position regardless of their blind spot
  answer: B
  explanation: Do not drive in the blind spot of other drivers. Traveling in a position
    where the driver ahead cannot see your vehicle is dangerous. Either stay behind
    or go around; do NOT follow to the side.
- id: 523
  category: safe_driving_rules
  question: How are High Occupancy Vehicle (HOV) lanes utilized on weekends?
  choices:
    A: They are closed to all traffic
    B: They are reserved strictly for emergency vehicles
    C: They serve as general purpose lanes for all vehicles
    D: They require three or more occupants instead of two
  answer: C
  explanation: The HOV lane serves as a general purpose lane on weekends and during
    non-peak traffic times on weekdays.
- id: 524
  category: defensive_driving
  question: According to the manual, why is night driving considered far more dangerous
    than day driving?
  choices:
    A: Because speed limits are increased at night
    B: Because there are more commercial trucks on the road
    C: Due to fatigue, sharply reduced vision, and more drinking drivers
    D: Because interstate lighting is frequently turned off to save energy
  answer: C
  explanation: Night driving is far more dangerous than day driving. Fatigue and sharply
    reduced vision are primarily responsible, and drinking drivers are more likely
    to be on the road at night.
- id: 525
  category: defensive_driving
  question: How often should you stop and refresh yourself to help avoid interstate
    hypnosis?
  choices:
    A: At least every 4 hours or 200 miles.
    B: At least every 2 hours or 100 miles.
    C: At least every 6 hours or 300 miles.
    D: Only when you need to refuel your vehicle.
  answer: B
  explanation: To avoid interstate hypnosis, the manual recommends taking a break
    and getting out of the car at least every two hours, or every 100 miles or so.
- id: 526
  category: safe_driving_rules
  question: To maintain safety on the road, what is the maximum number of hours you
    should drive per day?
  choices:
    A: 6 hours
    B: 8 hours
    C: 10 hours
    D: 12 hours
  answer: B
  explanation: The manual states that it is safest for you and others if you do not
    drive more than eight hours per day.
- id: 527
  category: signs_and_signals
  question: What do Dynamic Message Signs display when they are not in use?
  choices:
    A: The current interstate speed limit.
    B: The local time and temperature.
    C: They are normally blank.
    D: Advertisements for local businesses.
  answer: C
  explanation: Dynamic Message Signs provide real-time information to motorists, but
    the manual notes that these signs are normally blank when not in use.
- id: 528
  category: defensive_driving
  question: Which driving behavior is described as slowing down to look at crashes
    or anything out of the ordinary, causing traffic congestion?
  choices:
    A: Tailgating
    B: Rubbernecking
    C: Interstate hypnosis
    D: Unnecessary lane changes
  answer: B
  explanation: The manual identifies 'rubbernecking' as slowing down to look at crashes
    or virtually anything else out of the ordinary, calling it one of the worst congestion
    offenders.
- id: 529
  category: sharing_the_road
  question: What should you do if traffic conditions make it unsafe to change lanes
    when approaching a stationary emergency vehicle on the shoulder?
  choices:
    A: Stop in your lane until traffic clears.
    B: Speed up to pass the emergency vehicle as quickly as possible.
    C: Pull over to the opposite shoulder.
    D: Slow down and remain in the same lane.
  answer: D
  explanation: ONLY when traffic conditions make it unsafe to make such a lane change
    is the motorist allowed to respond to this situation by simply slowing down and
    remaining in the same lane.
- id: 530
  category: sharing_the_road
  question: 'In addition to emergency and maintenance vehicles, Tennessee''s Move
    Over Law also applies to:'
  choices:
    A: All moving vehicles on the interstate.
    B: Stationary motor vehicles with their emergency flasher lights on.
    C: Bicycles traveling on the shoulder.
    D: Pedestrians walking along the highway.
  answer: B
  explanation: The manual states that in addition to stationary emergency vehicles,
    the Move Over law now applies to all stationary motor vehicles, such as your car
    or truck, with their emergency flasher lights on.
- id: 531
  category: safe_driving_rules
  question: If your vehicle breaks down and you need help, how should you signal other
    drivers and law enforcement?
  choices:
    A: Stand in the middle of the lane and wave your arms.
    B: Raise your hood and tie a white cloth to the hood or radio antenna.
    C: Flash your headlights repeatedly.
    D: Honk your horn continuously.
  answer: B
  explanation: If you have vehicle trouble and need help, the manual advises to raise
    your hood and tie a white cloth to the hood or radio antenna.
- id: 532
  category: safe_driving_rules
  question: If you have vehicle trouble and pull to the shoulder, where is the safest
    place to wait for help?
  choices:
    A: Walking along the interstate to find a phone.
    B: Sitting on the trunk of your car.
    C: In or near your vehicle on the side away from traffic.
    D: Standing in the lane next to your vehicle to direct traffic.
  answer: C
  explanation: The manual states that if possible, it is better to stay in or near
    your vehicle on the side away from traffic, and notes that walking along the interstate
    is dangerous.
- id: 533
  category: driver_responsibility
  question: If you are involved in a traffic crash on the interstate, when does Tennessee
    law allow you to move the vehicle to the emergency lane?
  choices:
    A: Only after the police have arrived and taken photos.
    B: If the vehicle is drivable and there are no serious personal injuries or deaths.
    C: You are never allowed to move a vehicle after a crash.
    D: Only if the crash involves more than three vehicles.
  answer: B
  explanation: Under the 'Move It for Safety' section, if the vehicle is still drivable
    and there are NO SERIOUS PERSONAL INJURIES or deaths, you may pull the vehicle(s)
    to the emergency lane.
- id: 534
  category: safe_driving_rules
  question: What number can you dial on your wireless phone at no charge to connect
    with the Tennessee Highway Patrol Dispatch Center?
  choices:
    A: '*DOT (*368)'
    B: '*HELP (*4357)'
    C: '*THP (*847)'
    D: '*911 (*911)'
  answer: C
  explanation: In the event of a highway emergency, you may dial *THP (*847) to be
    connected to the nearest Tennessee Highway Patrol Dispatcher.
- id: 535
  category: defensive_driving
  question: 'To help avoid interstate hypnosis, drivers should get into the habit
    of:'
  choices:
    A: Staring straight ahead at the road lines.
    B: Shifting their eyes left and right and checking the rear view mirror.
    C: Keeping the car's interior as warm as possible.
    D: Listening to steady sounds of wind and tire hum.
  answer: B
  explanation: To fight interstate hypnosis, the manual advises drivers to keep shifting
    their eyes left and right and checking the rear view mirror, avoiding staring
    straight ahead.
- id: 536
  category: sharing_the_road
  question: If an emergency vehicle is stopped on the left shoulder of a multi-lane
    highway, what should you do according to the Move Over Law?
  choices:
    A: Merge into the right lane of traffic to free the left most lane as a safety
      barrier.
    B: Merge into the left lane of traffic to get closer to the vehicle.
    C: Stop your vehicle in the left lane.
    D: Drive on the right shoulder to pass.
  answer: A
  explanation: If the emergency vehicle is stopped on the left shoulder, the motorist
    merges into the right lane of traffic, freeing the left most lane as a safety
    barrier.
- id: 537
  category: vehicle_information
  question: According to the manual, which of the following is a recommended item
    to carry in your car specifically for winter travel emergencies?
  choices:
    A: A portable fan
    B: A window scraper for iced windows
    C: Extra engine coolant
    D: A sunshade
  answer: B
  explanation: The suggested safety and emergency equipment section states that during
    winter travel, you should carry a blanket, a small portable heater, a window scraper
    for iced windows, and snow tires or tire chains.
- id: 538
  category: safe_driving_rules
  question: What is the proper procedure when entering an interstate highway?
  choices:
    A: Stop, check for cars, and enter when safe.
    B: Check for cars, reduce speed to 25 MPH before entering the traffic lane.
    C: Check for cars, increase your speed to match the flow of traffic and merge
      when the way is clear.
    D: Sound your horn, maintain your current speed, and merge directly into the right
      lane.
  answer: C
  explanation: According to the manual's sample test questions, when entering an interstate
    highway, you should check for cars, increase your speed to match the flow of traffic,
    and merge when the way is clear.
- id: 539
  category: safe_driving_rules
  question: Who is legally permitted to use emergency crossovers on the interstate
    in Tennessee?
  choices:
    A: Any driver who missed their exit.
    B: Any driver, as long as no other vehicles are present.
    C: Commercial truck drivers during heavy traffic.
    D: Emergency vehicles and highway maintenance crews only.
  answer: D
  explanation: Emergency crossovers on the interstate are legal in Tennessee for emergency
    vehicles and highway maintenance crews only.
- id: 540
  category: defensive_driving
  question: What should you do if your vehicle is damaged in a crash on the interstate
    and there are no serious injuries?
  choices:
    A: Leave the vehicle in the traffic lane until police arrive.
    B: Move the damaged vehicle to the shoulder.
    C: Stop traffic to safely exchange insurance information.
    D: Abandon the vehicle and walk to the nearest exit.
  answer: B
  explanation: The Tennessee Department of Transportation has placed signs reminding
    motorists to move their damaged vehicles to the shoulder if no serious injury
    has occurred.
- id: 541
  category: defensive_driving
  question: Statistically, when do more fatal crashes take place than on any other
    day?
  choices:
    A: Monday and Tuesday mornings.
    B: Wednesday and Thursday nights.
    C: Friday and Saturday nights.
    D: Sunday afternoons.
  answer: C
  explanation: The manual states that more fatal crashes take place on Friday and
    Saturday nights than on any other day.
- id: 542
  category: safe_driving_rules
  question: What is the basic rule for safe night driving?
  choices:
    A: Always use your high beams.
    B: Never outrun your headlights.
    C: Drive at the posted speed limit regardless of visibility.
    D: Keep your interior dome light on.
  answer: B
  explanation: 'The basic rule for safe night driving is: NEVER OUTRUN YOUR HEADLIGHTS,
    because your range of visibility is limited by your headlights.'
- id: 543
  category: defensive_driving
  question: How should you avoid the glare of oncoming headlights at night?
  choices:
    A: Look directly into the oncoming headlights to track the vehicle.
    B: Flash your high beams repeatedly at the oncoming driver.
    C: Watch the right edge of the road and use the white line or road edge as a steering
      guide.
    D: Close one eye until the vehicle passes.
  answer: C
  explanation: To avoid the glare of oncoming lights, you should watch the right edge
    of the road and use the white line or road edge as a steering guide.
- id: 544
  category: vehicle_information
  question: By law, your headlights must enable you to see clearly any person on the
    highway at least how far ahead of your car?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: The law requires headlights that will enable you to see clearly any
    person on the highway at least two hundred (200) feet ahead of your car.
- id: 545
  category: safe_driving_rules
  question: You must dim your headlights when meeting or overtaking vehicles within
    what distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: You must adhere to the proper requirements of dimming your lights at
    night when meeting or overtaking vehicles within 500 feet.
- id: 546
  category: safe_driving_rules
  question: Whenever you park on or along a highway at night, what should you do?
  choices:
    A: Leave your headlights on high beam.
    B: Leave your headlights on low beam.
    C: Leave your emergency and parking lights on.
    D: Turn off all lights to save battery.
  answer: C
  explanation: Whenever you park on or along a highway at night, leave your emergency
    and parking lights on. Never leave your headlights on, as they may blind or confuse
    approaching drivers.
- id: 547
  category: defensive_driving
  question: When is the pavement particularly treacherous and most slippery during
    rainy weather?
  choices:
    A: After it has been raining heavily for several hours.
    B: When it first begins to rain.
    C: Right after the rain stops.
    D: When driving through deep puddles.
  answer: B
  explanation: The pavement is particularly treacherous when it first begins to rain
    because accumulations of dirt and oil will mix with the water, creating a greasy
    film on the roadway.
- id: 548
  category: safe_driving_rules
  question: When driving in rainy weather, which lights should you use?
  choices:
    A: Parking lights only.
    B: Headlights on high beam.
    C: Headlights on low beam.
    D: Emergency flashers only.
  answer: C
  explanation: Rainy weather calls for driving with headlights on low beam so the
    light will be on the road where you need it.
- id: 549
  category: defensive_driving
  question: What is the best advice for driving in fog or smoke?
  choices:
    A: Turn on your high beams and drive quickly through it.
    B: Follow the vehicle ahead of you very closely.
    C: DON'T drive in fog or smoke.
    D: Use only your parking lights.
  answer: C
  explanation: The manual states that the best advice for driving in fog or smoke
    is "DON'T". If you must travel, you should take specific precautions.
- id: 550
  category: safe_driving_rules
  question: If you must travel in fog or smoke, how should you use your vehicle's
    lights?
  choices:
    A: Drive with your lights on high beam.
    B: Drive with your lights on low beam.
    C: Drive with just your parking lights on.
    D: Drive with just your fog lights on.
  answer: B
  explanation: If you must travel in fog or smoke, you should drive with your lights
    on low beam. High beams will impair your visibility, and you should never drive
    with just parking or fog lights on.
- id: 551
  category: defensive_driving
  question: If your car stalls or is disabled while driving in fog, what should you
    do?
  choices:
    A: Stay inside the vehicle and wait for help.
    B: Stand directly behind the vehicle to wave traffic around.
    C: Move away from the vehicle to avoid personal injury.
    D: Leave the vehicle in the traffic lane and walk home.
  answer: C
  explanation: If your car stalls or is disabled in fog, move away from the vehicle
    to avoid personal injury.
- id: 552
  category: defensive_driving
  question: Why should you avoid flashing your high beams to warn an oncoming driver
    at night?
  choices:
    A: It drains your vehicle's battery.
    B: It is illegal in all circumstances.
    C: It might serve as a distraction and interfere with their driving, resulting
      in a collision.
    D: It will cause your headlights to burn out faster.
  answer: C
  explanation: You should avoid flashing your high beams to warn the other driver
    as it might serve as a distraction and interfere with their driving resulting
    in a collision.
- id: 553
  category: safe_driving_rules
  question: What should you do if you must stop your vehicle in dense fog because
    you cannot see the road's edge?
  choices:
    A: Stop in the middle of the traffic lane and turn on your high beams.
    B: Pull off as far to the right as possible, well out of the traffic lane, and
      turn on your emergency flashers.
    C: Stop on the roadway and sound your horn repeatedly to warn others.
    D: Pull off to the left shoulder and turn off all your lights.
  answer: B
  explanation: The manual states that if you cannot see the road's edge in fog, you
    should pull off as far to the right as possible - well out of the traffic lane
    - and turn on your emergency flashers.
- id: 554
  category: defensive_driving
  question: Why can pavement be very slippery for the first few minutes when it starts
    to rain on a hot day?
  choices:
    A: The rain immediately freezes on the hot asphalt.
    B: The water mixes with dirt to create deep mud.
    C: Heat causes oil in the asphalt to come to the surface, making it extremely
      slippery until washed off.
    D: The hot pavement causes the rain to instantly vaporize, reducing tire traction.
  answer: C
  explanation: According to the manual, heat causes oil in the asphalt to come to
    the surface, and this makes the road extremely slippery until the oil washes off.
- id: 555
  category: safe_driving_rules
  question: What is required by Tennessee law when driving through dense fog, heavy
    rain, or snow during the daytime?
  choices:
    A: Turn on your high beam headlights.
    B: Turn on your emergency flashers.
    C: Turn on your low beam headlights.
    D: Turn on your interior dome light.
  answer: C
  explanation: 'The manual explicitly states: ''WHEN DRIVING THROUGH DENSE FOG, HEAVY
    RAIN OR SNOW DURING THE DAYTIME, TURN ON YOU LOW BEAM HEADLIGHTS... it is also
    a requirement of Tennessee law.'''
- id: 556
  category: defensive_driving
  question: If your vehicle starts to hydroplane, what is the best way to slow down?
  choices:
    A: Slam on the brakes immediately.
    B: Shift into neutral and coast.
    C: Pump the brakes rapidly.
    D: Slow down gradually by letting up on the gas.
  answer: D
  explanation: The manual advises that if your vehicle starts to hydroplane, you should
    'slow down gradually by letting up on the gas' and 'Don't slam on the brakes.'
- id: 557
  category: safe_driving_rules
  question: Which of the following is a true statement regarding hydroplaning?
  choices:
    A: It only occurs at speeds above 55 mph.
    B: Stopping distances may be tripled and steering control may be reduced or lost.
    C: It increases your steering control due to water resistance.
    D: It only happens when driving through deep floodwaters.
  answer: B
  explanation: The manual notes that when hydroplaning occurs, 'Stopping distances
    may be tripled and steering control may be reduced or lost.' It also states tires
    can hydroplane at ANY speed.
- id: 558
  category: defensive_driving
  question: What should you do if your vehicle begins to skid?
  choices:
    A: Slam on the brakes to stop the vehicle quickly.
    B: Steer in the opposite direction you want the car to go.
    C: Stay off the brake and steer in the direction you want your car to go.
    D: Accelerate quickly to regain traction.
  answer: C
  explanation: If your vehicle begins to skid, the manual instructs to 'Stay off the
    brake' and 'Turn the steering wheel in the direction you want your car to go.'
- id: 559
  category: defensive_driving
  question: How should you react if your wheels get off the paved roadway?
  choices:
    A: Jerk the steering wheel back toward the pavement suddenly.
    B: Slam on the brakes and hold the pedal down.
    C: Accelerate to get back onto the road quickly.
    D: Lift your foot off the gas pedal and brake lightly and briefly.
  answer: D
  explanation: To regain control when off the pavement, you should 'Lift you foot
    off the gas pedal but do NOT suddenly apply the brake' and 'Brake lightly and
    briefly.'
- id: 560
  category: signs_and_signals
  question: What is the primary function of Rumble Stripes on Tennessee roads?
  choices:
    A: To wake up drivers who fall asleep at the wheel.
    B: To improve wet-night visibility of the edge line.
    C: To indicate the approaching end of a highway.
    D: To slow down speeding vehicles in residential areas.
  answer: B
  explanation: While rumble stripes have a secondary effect of vibration and noise,
    the manual states 'its primary function is to improve wet-night visibility of
    the edge line.'
- id: 561
  category: safe_driving_rules
  question: How much moving water does it typically take to sweep away most cars?
  choices:
    A: 6 to 12 inches
    B: 18 to 24 inches
    C: 36 to 48 inches
    D: At least 60 inches
  answer: B
  explanation: The manual warns that 'most cars can be swept away in 18 to 24 inches
    of moving water.'
- id: 562
  category: penalties_and_points
  question: What can happen if a driver knowingly ignores clearly visible flood warning
    barricades and drives into a flooded area?
  choices:
    A: They will only receive a verbal warning from law enforcement.
    B: They can be charged with reckless driving and held responsible for rescue costs.
    C: Their vehicle will be permanently confiscated by the state.
    D: They will automatically lose their license for five years.
  answer: B
  explanation: According to the manual, ignoring flood warning signs or barricades
    can result in the driver being 'charged with reckless driving' and 'responsible
    for the restitution of funds for the cost of your rescue.'
- id: 563
  category: defensive_driving
  question: What is the recommended action if you spot a tornado while driving?
  choices:
    A: Try to outrun the tornado by driving at maximum speed.
    B: Stay in your car and park under an overpass.
    C: Get out of the car, find shelter in a ditch or low-lying area, and lie face
      down.
    D: Drive toward the tornado to get past it quickly.
  answer: C
  explanation: 'If you spot a tornado, the manual advises: ''DON''T try to outrun
    it. Get out of the car, find shelter in a ditch or low-lying area and lie face
    down to protect yourself from flying debris.'''
- id: 564
  category: sharing_the_road
  question: When a large truck or bus is passing you on the left, what should you
    do to handle the gusts of wind they create?
  choices:
    A: Move as far as possible to the right of your lane and slow down.
    B: Move to the left side of your lane to block the wind.
    C: Accelerate quickly to stay ahead of the truck.
    D: Sound your horn to warn the truck driver.
  answer: A
  explanation: The manual states that when a truck or bus is passing you on the left,
    you should 'move as far as possible to the right of your lane and slow down.'
- id: 565
  category: defensive_driving
  question: How does a strong tailwind (wind blowing from behind your vehicle) affect
    your driving?
  choices:
    A: It makes steering significantly more difficult.
    B: It decreases your speed, requiring you to accelerate more.
    C: It increases your speed, so you will have to decelerate and begin braking earlier
      to stop.
    D: It causes your vehicle to hydroplane on dry pavement.
  answer: C
  explanation: The manual explains that 'A strong tailwind (wind blowing from behind
    your vehicle) will increase your speed, so you will have to decelerate and begin
    braking earlier to stop.'
- id: 566
  category: defensive_driving
  question: If the sun is directly behind you while driving, what hazard should you
    be aware of?
  choices:
    A: Your windshield wipers may stop functioning.
    B: Oncoming drivers may have a glare problem and might not see your turn signals.
    C: Your vehicle's engine may overheat more quickly.
    D: You will not be able to see your dashboard instruments.
  answer: B
  explanation: 'The manual warns: ''If the sun is behind you, oncoming drivers may
    have the glare problem. Be aware that they may not be able to see your turn signals
    or your car.'''
- id: 567
  category: vehicle_information
  question: What is the correct technique for getting a vehicle unstuck from mud or
    snow?
  choices:
    A: Shift to high gear and spin the wheels as fast as possible.
    B: Shift to low gear, keep front wheels straight, and gently step on the gas pedal.
    C: Turn the steering wheel sharply from side to side while accelerating heavily.
    D: Slam on the brakes while shifting between drive and reverse.
  answer: B
  explanation: To get unstuck from mud or snow, the manual advises to 'Shift to low
    gear and keep the front wheels straight,' 'Gently step on the gas pedal,' and
    'Avoid spinning the wheels.'
- id: 568
  category: safe_driving_rules
  question: What should you do if your vehicle gets stuck in deep mud or snow?
  choices:
    A: Shift to high gear and spin the wheels as fast as possible.
    B: Shift to low gear and keep the front wheels straight.
    C: Pump the gas pedal rapidly to gain traction.
    D: Turn the steering wheel sharply from side to side.
  answer: B
  explanation: When trying to get your vehicle unstuck, the manual advises to shift
    to low gear and keep the front wheels straight, while gently stepping on the gas
    pedal and avoiding spinning the wheels.
- id: 569
  category: vehicle_information
  question: When should you install tire chains on your vehicle?
  choices:
    A: After you get stuck in the snow.
    B: While driving in the middle of the roadway.
    C: Before driving in snow or mud.
    D: Only when driving on solid ice.
  answer: C
  explanation: The manual states that you should drive as far as possible to the right
    side of the roadway before installing chains, and put them on the tires before
    driving in snow or mud.
- id: 570
  category: defensive_driving
  question: Which of the following is considered one of the three big errors most
    drivers make in snow and ice?
  choices:
    A: Over-steering and skidding the wheels.
    B: Using low beam headlights.
    C: Driving with a steady speed.
    D: Using the heater-defroster.
  answer: A
  explanation: 'The three big errors of most drivers in snow and ice are: over-powering
    and spinning the wheels, over-braking and sliding the wheels, and over-steering
    and skidding the wheels.'
- id: 571
  category: safe_driving_rules
  question: Before driving in winter weather, from which windows should you clear
    snow, ice, or frost?
  choices:
    A: Only the windshield.
    B: The windshield and front side windows.
    C: Only the rear window.
    D: ALL windows.
  answer: D
  explanation: The manual explicitly states to clear snow, ice or frost from ALL windows
    before driving.
- id: 572
  category: safe_driving_rules
  question: 'When traveling at 20 M.P.H., low traction from ice and snow can increase
    your stopping distance to:'
  choices:
    A: 50 feet or more.
    B: 100 feet or more.
    C: 150 feet or more.
    D: 200 feet or more.
  answer: D
  explanation: When traveling at 20 M.P.H., low traction can increase stopping distance
    to 200 feet or more.
- id: 573
  category: vehicle_information
  question: How should you apply your brakes on snow or ice to maintain directional
    control?
  choices:
    A: Pump the brake pedal rapidly.
    B: Apply continuous hard pressure until the vehicle stops.
    C: Apply steady pressure to a point just short of lock up.
    D: Slam on the brakes and hold them down.
  answer: C
  explanation: The manual advises to apply the brakes firmly, to a point just short
    of lock up, and to NOT pump the brake pedal, just apply steady pressure for the
    best combination of braking effort and directional control.
- id: 574
  category: vehicle_information
  question: 'To make antilock brakes (ABS) work correctly during an emergency stop,
    you should:'
  choices:
    A: Pump the brake pedal.
    B: Apply constant, firm pressure to the pedal.
    C: Lightly tap the brakes.
    D: Use the parking brake instead.
  answer: B
  explanation: To make antilock brakes work correctly, or work at all, you should
    apply constant, firm pressure to the pedal. During an emergency stop, push the
    brake pedal all the way to the floor if necessary.
- id: 575
  category: defensive_driving
  question: Why should you be especially cautious when driving over bridges in freezing
    weather?
  choices:
    A: Bridges are usually built with steeper inclines.
    B: Ice forms on bridges sooner than on adjoining roads.
    C: Bridges have less traffic to pack the snow.
    D: Bridges absorb more heat from the sun.
  answer: B
  explanation: Usually, signs indicate that ice forms on bridges sooner than on the
    adjoining roads, making them unexpectedly slippery.
- id: 576
  category: driver_testing
  question: By law, what percentage of questions on the Tennessee driver's knowledge
    test must deal with alcohol and drugs?
  choices:
    A: At least 10 percent.
    B: At least 15 percent.
    C: At least 20 percent.
    D: At least 25 percent.
  answer: D
  explanation: By law, at least 25 percent of the questions on the knowledge test
    must consist of questions dealing with the topic of alcohol, other drugs, and
    driving.
- id: 577
  category: alcohol_drugs_health
  question: Approximately how long does it take for the liver to oxidize one alcoholic
    drink?
  choices:
    A: 15 minutes.
    B: 30 minutes.
    C: One hour.
    D: Two hours.
  answer: C
  explanation: Upon reaching the liver, the alcohol immediately begins to be oxidized.
    However, the liver can only oxidize about one drink per hour.
- id: 578
  category: alcohol_drugs_health
  question: Which of the following is the only effective way to sober up after drinking
    alcohol?
  choices:
    A: Drinking black coffee.
    B: Taking a cold shower.
    C: Exercising vigorously.
    D: Allowing time to pass.
  answer: D
  explanation: The rate of oxidation cannot be increased by drinking coffee, exercising,
    taking a cold shower or anything else. Only time can sober a person who’s been
    drinking.
- id: 579
  category: alcohol_drugs_health
  question: In Tennessee, what Blood Alcohol Concentration (BAC) level is always illegal
    for intoxication?
  choices:
    A: '.04'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: In most states, including Tennessee, .08 is the level of intoxication
    which is always illegal.
- id: 580
  category: alcohol_drugs_health
  question: If two people weigh the same, how does body fat affect alcohol intoxication?
  choices:
    A: The person with more body fat will show signs of intoxication first.
    B: The person with less body fat will show signs of intoxication first.
    C: Body fat has no effect on how quickly a person becomes intoxicated.
    D: Both people will become intoxicated at the exact same rate.
  answer: A
  explanation: Alcohol is able to be absorbed in water, not fat. People with less
    body fat have more water in which to dilute the alcohol. So, drink for drink,
    if people weigh the same, the one with more body fat will show signs of intoxication
    first.
- id: 581
  category: alcohol_drugs_health
  question: With a Blood Alcohol Concentration (BAC) of .10 percent, how much more
    likely are you to cause a crash compared to if you were sober?
  choices:
    A: Two times more likely.
    B: Seven times more likely.
    C: Twenty-five times more likely.
    D: Fifty times more likely.
  answer: B
  explanation: With a BAC of .10 percent, you are seven times more likely to cause
    a crash than if you were sober.
- id: 582
  category: alcohol_drugs_health
  question: What are the two abilities most important to the driving task that are
    affected by small amounts of alcohol?
  choices:
    A: Hearing and reaction time
    B: Judgment and vision
    C: Steering and braking
    D: Alertness and concentration
  answer: B
  explanation: 'The manual states: ''The two abilities most important to the driving
    task are judgment and vision, both of which are affected by small amounts of alcohol.'''
- id: 583
  category: alcohol_drugs_health
  question: How does alcohol affect a driver's vision at night?
  choices:
    A: It improves glare recovery time.
    B: It reduces the ability to see clearly at night by more than half.
    C: It increases side vision by 30 percent.
    D: It tightens eye muscles to focus better.
  answer: B
  explanation: Alcohol decreases clearness of vision. The manual explicitly states
    that it reduces the ability to see clearly at night by more than half.
- id: 584
  category: alcohol_drugs_health
  question: At what Blood Alcohol Concentration (BAC) does the law consider a driver
    to be legally intoxicated?
  choices:
    A: .04 percent
    B: .05 percent
    C: .08 percent
    D: .10 percent
  answer: C
  explanation: The manual indicates that a BAC of .08 percent and above is considered
    'LEGAL INTOXICATION' and it is unlawful to drive while the alcohol concentration
    is .08 percent or higher.
- id: 585
  category: alcohol_drugs_health
  question: What happens when you mix alcohol with another depressant, like tranquilizers
    or sedatives?
  choices:
    A: The effects cancel each other out.
    B: The effects are simply added together.
    C: The effects are multiplied.
    D: The alcohol acts as a stimulant to counteract the depressant.
  answer: C
  explanation: When alcohol is combined with another depressant, like tranquilizers
    or sedatives, the results are not just added together; they are multiplied, making
    the effects much stronger and more dangerous.
- id: 586
  category: penalties_and_points
  question: According to Tennessee's Implied Consent Law, what is the likely penalty
    if you refuse to take a chemical test for alcohol or drugs when asked by a law
    enforcement officer?
  choices:
    A: A fine of $500
    B: Suspension of driving privileges for 12 months
    C: Immediate 30-day jail sentence
    D: Required installation of an ignition interlock device
  answer: B
  explanation: If you are placed under arrest and refuse a law enforcement officer's
    request to take the test, it will likely result in the suspension by the court
    of your driving privileges for twelve (12) months.
- id: 587
  category: alcohol_drugs_health
  question: Is it a valid defense for a DUI charge if the drug you were taking was
    prescribed by a doctor?
  choices:
    A: Yes, as long as you have the prescription bottle in the car.
    B: Yes, prescription drugs do not impair driving.
    C: No, just because a drug is prescribed by law is no defense for driving under
      the influence of it.
    D: No, unless the doctor specifically gave you written permission to drive.
  answer: C
  explanation: 'The manual clearly states: ''Just because a drug is prescribed, by
    law, this is NO defense for driving under the influence of it.'''
- id: 588
  category: penalties_and_points
  question: What does the 'No Refusal' law, passed in 2012, allow law enforcement
    officials to do?
  choices:
    A: Suspend a driver's license permanently on the first offense.
    B: Seek search warrants for blood samples in cases involving suspected impaired
      drivers.
    C: Arrest passengers in a vehicle driven by an impaired driver.
    D: Confiscate the vehicle of anyone who refuses a breathalyzer.
  answer: B
  explanation: The No Refusal law allows law enforcement officials to seek search
    warrants for blood samples in cases involving suspected impaired drivers.
- id: 589
  category: alcohol_drugs_health
  question: How does alcohol consumption affect a driver's alertness and concentration?
  choices:
    A: It acts as a stimulant to increase alertness.
    B: It speeds up nerve impulses and body functions.
    C: It acts as a depressant and limits a driver's ability to be alert and concentrate.
    D: It has no effect on concentration until the BAC reaches .10 percent.
  answer: C
  explanation: Alcohol, in any concentration, is a depressant, not a stimulant. It
    slows all nerve impulses and body functions, limiting a driver's ability to be
    alert and to concentrate.
- id: 590
  category: alcohol_drugs_health
  question: At what BAC level are reaction and coordination impaired?
  choices:
    A: As low as .02 percent
    B: Only above .05 percent
    C: Exactly at .08 percent
    D: At .10 percent and above
  answer: A
  explanation: The manual notes that reaction and coordination are impaired by alcohol
    consumption as low as .02 percent BAC.
- id: 591
  category: alcohol_drugs_health
  question: Can a driver be convicted of a DUI with a Blood Alcohol Concentration
    (BAC) of .00 percent?
  choices:
    A: No, a BAC of .00 percent clears a driver of any DUI charges.
    B: Yes, if their ability to drive is sufficiently impaired by drugs.
    C: Yes, but only if they are under 21 years of age.
    D: No, a BAC of at least .02 percent is required for a conviction.
  answer: B
  explanation: A driver can register a BAC of .00 percent and still be convicted of
    a DUI if their ability to drive is sufficiently impaired by drugs. The level of
    BAC does not clear a driver when it is below .08 percent.
- id: 592
  category: alcohol_drugs_health
  question: What is the relationship between alcohol and the eye muscles?
  choices:
    A: Alcohol causes the eye muscles to tighten, improving focus.
    B: Alcohol relaxes the eye muscles, causing poor glare vision and inability to
      focus properly.
    C: Alcohol stimulates the eye muscles, increasing the speed of glare recovery.
    D: Alcohol has no effect on the eye muscles, only on the brain.
  answer: B
  explanation: Glare vision is poor because of relaxed eye muscles. Eye muscles are
    relaxed by alcohol and cannot focus properly.
- id: 593
  category: alcohol_drugs_health
  question: According to the manual, what percentage of the information used in driving
    is provided by the eyes?
  choices:
    A: About 50 percent
    B: About 70 percent
    C: Almost 90 percent
    D: 100 percent
  answer: C
  explanation: Because the eyes provide almost 90 percent of the information used
    in driving, any restriction in vision can cause disastrous results.
- id: 594
  category: penalties_and_points
  question: Are the penalties for a DUI arrest different if the driver was impaired
    by prescription drugs instead of alcohol?
  choices:
    A: Yes, prescription drug DUIs carry lighter penalties.
    B: Yes, prescription drug DUIs only result in a warning for the first offense.
    C: No, the penalties are the same whether the driver was drinking alcohol or taking
      drugs.
    D: No, but prescription drug DUIs do not go on your driving record.
  answer: C
  explanation: The penalties for a DUI arrest are the same whether the driver was
    drinking alcohol or taking drugs (even prescription or over-the-counter drugs).
- id: 595
  category: alcohol_drugs_health
  question: What is the first thing affected after a person consumes alcohol?
  choices:
    A: Coordination
    B: Vision
    C: Judgment
    D: Emotions
  answer: C
  explanation: According to the manual, the first thing affected after drinking alcohol
    is a person's judgment.
- id: 596
  category: penalties_and_points
  question: Under the Drunk Driving Child Protection Act, what is the mandatory minimum
    jail sentence for violating DUI laws while accompanied by a child under 18?
  choices:
    A: 48 hours
    B: 7 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: The Drunk Driving Child Protection Act imposes a mandatory minimum
    jail sentence of 30 days and a minimum fine of $1,000 for violating DUI laws when
    accompanied by a child under 18.
- id: 597
  category: penalties_and_points
  question: If you are 18, 19, or 20 years old and are convicted of purchasing or
    possessing an alcoholic beverage for the first time, how long will you lose your
    driving privilege?
  choices:
    A: 6 months
    B: 1 year
    C: 2 years
    D: Until you turn 21
  answer: B
  explanation: If you are 18, 19 or 20 years old and are convicted of purchasing,
    attempting to purchase, or possessing any alcoholic beverage, you will lose your
    privilege to drive for one year for a first offense.
- id: 598
  category: alcohol_drugs_health
  question: Approximately how long does it take to cancel the intoxicating effects
    of three alcoholic drinks?
  choices:
    A: One hour
    B: Two hours
    C: Three hours
    D: Four hours
  answer: C
  explanation: It takes about one hour to cancel the effects of one drink, so it takes
    about three hours to cancel the intoxicating effects of three drinks.
- id: 599
  category: penalties_and_points
  question: What is the minimum jail time for a first DUI conviction if the driver's
    Blood Alcohol Concentration (BAC) is 0.20% or more?
  choices:
    A: 48 hours
    B: 7 days
    C: 30 days
    D: 45 days
  answer: B
  explanation: For a 1st conviction, the jail time is 48 hours, but it increases to
    7 days if the BAC is 0.20% or more.
- id: 600
  category: penalties_and_points
  question: 'If you are operating a motor vehicle under the influence and are involved
    in a crash resulting in the death of another person, you may be charged with:'
  choices:
    A: Aggravated Assault
    B: Vehicular Homicide
    C: Especially Aggravated Child Endangerment
    D: Reckless Endangerment
  answer: B
  explanation: If you are operating a motor vehicle under the influence of a drug
    or alcohol, and you are involved in a crash resulting in the death of another
    person(s), you may be charged with vehicular homicide.
- id: 601
  category: penalties_and_points
  question: 'For a juvenile offender between the ages of 13 and 17, a first conviction
    for possessing alcohol or drugs results in a driving privilege suspension for:'
  choices:
    A: 6 months or until age 16, whichever is longer
    B: 1 year or until age 17, whichever is longer
    C: 2 years or until age 18, whichever is longer
    D: Until age 21
  answer: B
  explanation: If you are between the ages of 13 and 17 and are found to have possessed,
    consumed or sold either alcohol or drugs, your driving privilege will be suspended
    for one year or until age 17, whichever is longer.
- id: 602
  category: alcohol_drugs_health
  question: 'The amount of alcohol in one 12-ounce bottle of beer is about equal to:'
  choices:
    A: A 1-ounce shot of whiskey
    B: Two 1-ounce shots of whiskey
    C: A 6-ounce glass of wine
    D: A half-ounce of pure alcohol
  answer: A
  explanation: The manual states that the amount of alcohol in one (12 ounce) bottle
    of beer is about equal to that in a (1 ounce) shot of whiskey.
- id: 603
  category: penalties_and_points
  question: What is the fine range for a second DUI conviction?
  choices:
    A: $350 - $1,500
    B: $600 - $3,500
    C: $1,100 - $10,000
    D: $3,000 - $15,000
  answer: B
  explanation: According to the DUI Penalties chart, the fines for a 2nd Conviction
    range from $600 to $3,500.
- id: 604
  category: penalties_and_points
  question: 'Under the Under 21 BAC law, a person who is at least 16 but not yet 21
    will be convicted of underage driving while impaired if found driving with a BAC
    of at least:'
  choices:
    A: .01 percent
    B: .02 percent
    C: .04 percent
    D: .08 percent
  answer: B
  explanation: A person who is at least 16, but is not yet 21 years old, and who is
    found driving with a BAC of .02 percent will be convicted of underage driving
    while impaired.
- id: 605
  category: penalties_and_points
  question: 'As a condition of probation for a DUI conviction, an offender must complete
    litter pick-up for three eight-hour shifts while wearing clothing that displays
    the message:'
  choices:
    A: '"DUI OFFENDER"'
    B: '"I AM A DRUNK DRIVER"'
    C: '"COMMUNITY SERVICE WORKER"'
    D: '"DON''T DRINK AND DRIVE"'
  answer: B
  explanation: While removing litter, the offender has to wear a vest or other clothing
    displaying the message, "I am a DRUNK DRIVER."
- id: 606
  category: alcohol_drugs_health
  question: How do the penalties for a DUI arrest involving prescription drugs compare
    to those involving alcohol?
  choices:
    A: The penalties for prescription drugs are less severe.
    B: The penalties for prescription drugs are more severe.
    C: The penalties are the same for both.
    D: Prescription drugs do not result in a DUI arrest.
  answer: C
  explanation: The penalties for a DUI arrest are the same whether the driver was
    drinking alcohol or taking drugs (even prescription or over-the-counter drugs).
- id: 607
  category: penalties_and_points
  question: 'A fourth or subsequent DUI conviction is classified as a:'
  choices:
    A: Class A misdemeanor
    B: Class C felony
    C: Class D felony
    D: Class E felony
  answer: D
  explanation: The DUI Penalties chart indicates that a 4th or subsequent Conviction
    is a Class E felony.
- id: 608
  category: penalties_and_points
  question: If a person has two DUI convictions within a five-year period, they MUST
    operate a motor vehicle with an ignition interlock device for how long after reinstatement
    of driving privileges?
  choices:
    A: 6 months
    B: 1 year
    C: 3 years
    D: 5 years
  answer: A
  explanation: A person with 2 DUIs in a five year period MUST operate a motor vehicle
    with the ignition interlock device for six months after reinstatement of driving
    privileges.
- id: 609
  category: alcohol_drugs_health
  question: Why is a young driver's chance of a crash much greater with a BAC between
    .01-.08 percent compared to older drivers?
  choices:
    A: Because young drivers tend to drive faster.
    B: Due to low tolerance of alcohol and limited driving experience.
    C: Because young drivers are more likely to drive at night.
    D: Due to a higher likelihood of using prescription drugs.
  answer: B
  explanation: The young driver's chance of a crash is much greater with BAC between
    .01-.08 percent than older drivers. This is due to low tolerance of alcohol and
    limited driving experience.
- id: 610
  category: alcohol_drugs_health
  question: According to the manual, what toll-free number can you call for referrals
    for help with drug and alcohol use and abuse?
  choices:
    A: 1-800-555-DRUG
    B: 1-800-889-9789
    C: 1-800-822-4357
    D: 1-800-DRIVING
  answer: B
  explanation: The manual states to call the toll-free 'Redline' at 1-800-889-9789
    for further information on drug and alcohol use or for referrals for help.
- id: 611
  category: alcohol_drugs_health
  question: What does the Implied Consent Law mean in Tennessee?
  choices:
    A: You consent to vehicle searches at any time.
    B: You agree to carry proper vehicle insurance.
    C: If asked, you will take a test to determine alcohol or drug content in the
      blood.
    D: You agree to pay all traffic fines within 30 days.
  answer: C
  explanation: The Implied Consent Law means that if asked, you will take a test to
    determine alcohol or drug content in the blood.
- id: 612
  category: license_system
  question: What is the purpose of the Problem Driver Pointer System (PDPS)?
  choices:
    A: To track unpaid parking tickets in Tennessee.
    B: To search the National Driver Register before issuing a driver license.
    C: To assign points to drivers for traffic violations.
    D: To monitor teenage drivers' school attendance.
  answer: B
  explanation: The Problem Driver Pointer System (PDPS) is used by the Tennessee Department
    of Safety and Homeland Security to search the National Driver Register before
    issuance of a driver license.
- id: 613
  category: penalties_and_points
  question: Which of the following is a reason your Tennessee driver license may be
    revoked or suspended?
  choices:
    A: Receiving one speeding ticket in a three-year period.
    B: Driving a motor vehicle away from a gas station without paying for fuel.
    C: Failing to wash your vehicle regularly.
    D: Parking in a loading zone for five minutes.
  answer: B
  explanation: Driving a motor vehicle away from a gas station without paying for
    dispensed gas or diesel fuel is listed as a situation where a driver license may
    be revoked or suspended.
- id: 614
  category: penalties_and_points
  question: Persons under the age of 18 may lose their driving privileges for dropping
    out of school. How is 'dropping out' defined in this context?
  choices:
    A: Having 5 consecutive unexcused absences in a semester.
    B: Having 10 consecutive or 15 total days of unexcused absences in a semester.
    C: Failing one subject during a grading period.
    D: Missing 20 days of school for any reason in a year.
  answer: B
  explanation: Dropping out of school is defined as having 10 consecutive or 15 total
    days in a semester of unexcused absences.
- id: 615
  category: penalties_and_points
  question: To maintain driving privileges, a person under the age of 18 must make
    satisfactory progress in school. What does this generally mean?
  choices:
    A: Maintaining a 3.0 GPA.
    B: Passing all subjects per grading period.
    C: Passing three subjects per grading period.
    D: Having perfect attendance.
  answer: C
  explanation: Failure to make satisfactory progress in school generally means passing
    three subjects per grading period; failing to do so can result in lost driving
    privileges.
- id: 616
  category: penalties_and_points
  question: If your driver license is suspended or revoked, within how many days must
    it be turned in to the Department of Safety?
  choices:
    A: 10 days
    B: 15 days
    C: 20 days
    D: 30 days
  answer: C
  explanation: Whenever a driver license is suspended or revoked, it must be turned
    in to the Department of Safety within 20 days of the suspension or revocation.
- id: 617
  category: penalties_and_points
  question: What is the penalty for failing to surrender your suspended or revoked
    driver license within the required time frame?
  choices:
    A: A $50 fine
    B: A $75 fine in addition to any other fines and costs
    C: An additional 6 months of suspension
    D: A mandatory court appearance
  answer: B
  explanation: Failure to surrender your license means that you will be fined $75
    in addition to any other fines and costs you may owe.
- id: 618
  category: driver_responsibility
  question: If you have a new address, within how many days must you report it to
    the Department of Safety?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 30 days
  answer: B
  explanation: If you have a new address, you must report it to the Department of
    Safety within ten (10) days of the change.
- id: 619
  category: penalties_and_points
  question: Under the Non-Resident Violator Compact, what happens if you ignore a
    traffic citation issued in another member state?
  choices:
    A: Your Tennessee driving privileges will be suspended, revoked, or canceled.
    B: You will be arrested the next time you drive in Tennessee.
    C: The citation is automatically dismissed after one year.
    D: You will only be fined by the state of Tennessee.
  answer: A
  explanation: If you ignore the citation from another member state, your driving
    privileges will be suspended, revoked or canceled until the court notifies the
    Department of Safety that the citation has been properly disposed of.
- id: 620
  category: penalties_and_points
  question: Adult drivers (18 years of age or older) will receive a notice of proposed
    suspension if they accumulate how many points within a 12-month period?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 10 or more points
    D: 12 or more points
  answer: D
  explanation: Adult drivers (18 years of age or older) who accumulate 12 or more
    points within a 12-month period receive a notice of proposed suspension.
- id: 621
  category: penalties_and_points
  question: An adult driver will receive an advisory letter to keep them aware of
    the possibility of losing their driving privileges if they accumulate how many
    points within any 12 months?
  choices:
    A: 2 to 4 points
    B: 4 to 6 points
    C: 6 to 11 points
    D: 10 to 15 points
  answer: C
  explanation: An advisory letter is mailed to any licensee having 6 to 11 points
    on his/her driving record within any 12 months.
- id: 622
  category: penalties_and_points
  question: How many reckless driving violations within a 12-month period will result
    in the revocation or suspension of a Tennessee driver license?
  choices:
    A: One
    B: Two
    C: Three
    D: Four
  answer: B
  explanation: In Tennessee, a driver license may be revoked or suspended for two
    reckless driving violations within 12 months.
- id: 623
  category: penalties_and_points
  question: Possession of what amount of methamphetamine in a vehicle by a driver
    can lead to license revocation or suspension?
  choices:
    A: One or more grams
    B: Three or more grams
    C: Five or more grams
    D: Ten or more grams
  answer: C
  explanation: A driver license may be revoked or suspended for possession by a driver
    of five or more grams of methamphetamine in a vehicle.
- id: 624
  category: penalties_and_points
  question: 'Before a license is suspended, revoked, or canceled, the department will
    give you an opportunity for a hearing prior to action, EXCEPT in cases of:'
  choices:
    A: Accumulating 12 points in a 12-month period.
    B: Final judgments and convictions.
    C: Failing to pay child support.
    D: Dropping out of high school.
  answer: B
  explanation: If your license is about to be suspended, revoked or cancelled, the
    department will give you an opportunity for a hearing prior to action, except
    in cases of final judgments and convictions.
- id: 625
  category: penalties_and_points
  question: How many points must an adult driver accumulate within a 12-month period
    to receive a notice of proposed suspension?
  choices:
    A: 6 or more
    B: 8 or more
    C: 10 or more
    D: 12 or more
  answer: D
  explanation: Adult drivers (18 years of age or older) who accumulate 12 or more
    points within a 12-month period receive a notice of proposed suspension.
- id: 626
  category: driver_responsibility
  question: How often is the Defensive Driving Course option available to a driver
    to avoid or reduce a license suspension?
  choices:
    A: Once every year
    B: Once every three years
    C: Once in any five-year period
    D: Once in a lifetime
  answer: C
  explanation: The Defensive Driving Course option is only available once in any five-year
    period to avoid license suspension or to reduce the period of suspension.
- id: 627
  category: penalties_and_points
  question: What is a consequence of driving while your license is suspended?
  choices:
    A: A warning letter is mailed
    B: The suspension period is extended and could result in criminal prosecution
    C: You must retake the written knowledge test
    D: Your vehicle will be permanently confiscated
  answer: B
  explanation: Driving while your license is suspended will result in the extension
    of the suspension period and could also result in criminal prosecution.
- id: 628
  category: penalties_and_points
  question: How many points are added to your driving record for passing a stopped
    school, church, or youth bus taking on or discharging passengers?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: According to the points chart, passing a stopped school, church or
    youth bus taking on or discharging passengers results in 8 points.
- id: 629
  category: alcohol_drugs_health
  question: Drivers who lose consciousness or control due to conditions like epilepsy
    or diabetes must remain lapse-free for what minimum period before being eligible
    for license reinstatement?
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Drivers who lose consciousness or control due to epilepsy, cardiac
    syncope, diabetes or other conditions must be suspended and remain lapse free
    for a minimum of six (6) months before being eligible for license reinstatement.
- id: 630
  category: penalties_and_points
  question: How many points are assigned for failing to yield the right of way to
    emergency vehicles?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: The points chart assigns 6 points for "Failure to yield right of way
    to emergency vehicles."
- id: 631
  category: license_system
  question: If a person obtains a restricted license after failing to satisfy a citation,
    where are they allowed to drive?
  choices:
    A: To and from work only
    B: To work and full-time college
    C: Anywhere between 6 AM and 6 PM
    D: To work and religious services
  answer: A
  explanation: For a restricted license due to Failure to Satisfy a Citation, the
    certified order allows the person to drive to and from work only.
- id: 632
  category: penalties_and_points
  question: How many points are assigned for speeding 16 to 25 m.p.h. in excess of
    the speed zone within a construction zone?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: B
  explanation: Speeding 16 thru 25 m.p.h. in excess of the speed zone normally carries
    4 points, but in a Construction Zone it carries 5 points.
- id: 633
  category: license_system
  question: A restricted driver license after a DUI conviction is NOT an option for
    drivers who have a prior conviction of which of the following within 10 years?
  choices:
    A: Reckless driving
    B: Speeding over 25 mph
    C: Adult driving while impaired
    D: Drag racing
  answer: C
  explanation: A restricted license is not an option for drivers who have a prior
    conviction of DUI or adult driving while impaired within 10 years.
- id: 634
  category: alcohol_drugs_health
  question: If the Department receives information that your ability to drive is affected
    by a physical or mental disorder, within how many days must you submit a medical
    report?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: The driver will be required to submit (within thirty (30) days of notification)
    a medical report from a medical doctor.
- id: 635
  category: penalties_and_points
  question: How many points are assigned to a driver under 18 years of age for operating
    a vehicle while using a cell phone?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 8 points
  answer: C
  explanation: The points chart specifies 6 points for "Operating vehicle while using
    cell phone (under 18)".
- id: 636
  category: license_system
  question: 'A minor who loses their license due to drug or alcohol-related charges
    may apply for a restricted license to drive to and from:'
  choices:
    A: Religious services and work
    B: The educational institution or work
    C: Outpatient treatment programs only
    D: Any location during daylight hours
  answer: B
  explanation: A minor who loses his/her license because of drug- or alcohol-related
    charges may apply to the trial judge for a restricted license to operate a motor
    vehicle to and from the educational institution or to and from work.
- id: 637
  category: penalties_and_points
  question: How many points are assigned to a driver for contributing to the occurrence
    of a crash resulting in the death of another person?
  choices:
    A: 4 points
    B: 5 points
    C: 6 points
    D: 8 points
  answer: D
  explanation: The points chart assigns 8 points for "Contributing to occurrence of
    a crash resulting in the death of another person".
- id: 638
  category: driver_responsibility
  question: Upon completion of a suspension time, what type of insurance proof is
    specifically required for adult drivers before getting their regular license?
  choices:
    A: Comprehensive insurance
    B: SR-22 insurance
    C: Collision insurance
    D: Uninsured motorist coverage
  answer: B
  explanation: Upon the completion of the suspension time, you must pay the appropriate
    reinstatement fees and submit proof of liability insurance/financial responsibility
    (SR-22 insurance is required for adult drivers).
- id: 639
  category: license_system
  question: What will happen if a driver fails to respond to a departmental request
    for a medical report within the prescribed time?
  choices:
    A: They will be fined $50.
    B: Their driving privilege will be suspended.
    C: Their vehicle registration will be revoked.
    D: They will be required to retake the written test only.
  answer: B
  explanation: According to the manual, failure to respond to departmental requests
    for a medical report or submission to a driver license examination within the
    prescribed time will result in the suspension of the driving privilege.
- id: 640
  category: driver_responsibility
  question: Which type of insurance provides coverage for damages you cause to other
    persons?
  choices:
    A: Collision insurance
    B: Uninsured motorist insurance
    C: Liability insurance
    D: Comprehensive insurance
  answer: C
  explanation: The manual defines liability insurance as providing coverage for damages
    you cause to other persons.
- id: 641
  category: driver_responsibility
  question: Is collision insurance required by Tennessee law?
  choices:
    A: Yes, for all drivers.
    B: Yes, but only for commercial vehicles.
    C: No, it is not required.
    D: No, unless you have a previous crash on your record.
  answer: C
  explanation: The manual explicitly states, "Although collision insurance is not
    required by Tennessee law, the Financial Responsibility Law requires drivers to
    produce evidence of financial responsibility."
- id: 642
  category: driver_responsibility
  question: Which of the following is NOT listed as an acceptable form of evidence
    of financial responsibility?
  choices:
    A: An insurance binder
    B: A declaration page of your insurance policy
    C: A verbal promise from your insurance agent
    D: An insurance card from an authorized company
  answer: C
  explanation: Acceptable forms of evidence include a declaration page, an insurance
    binder, an insurance card, a certificate of cash deposit/bond, or proof of qualification
    as a self-insurer. A verbal promise is not listed.
- id: 643
  category: safe_driving_rules
  question: You must immediately notify the police of any crash involving death, injury,
    or property damage over what amount?
  choices:
    A: $50
    B: $100
    C: $400
    D: $500
  answer: A
  explanation: Drivers must immediately notify the local police, County Sheriff's
    office, or Highway Patrol of any crash involving death, injury, or property damage
    over fifty dollars ($50).
- id: 644
  category: driver_responsibility
  question: If a driver is physically unable to give immediate notice of a crash to
    the police, who is required to do so?
  choices:
    A: The other driver involved
    B: A passenger capable of doing so
    C: The first witness on the scene
    D: The driver's insurance company
  answer: B
  explanation: The manual states that if the driver is physically unable to give immediate
    notice, and there is a passenger capable of doing so, the passenger shall make
    or cause notice to be given.
- id: 645
  category: driver_responsibility
  question: 'A crash must be reported to the Tennessee Department of Safety and Homeland
    Security as a "reportable crash" if property damage to any one person is in excess
    of:'
  choices:
    A: $50
    B: $200
    C: $400
    D: $1,000
  answer: C
  explanation: Reportable crashes include any crash in which any person is killed
    or injured, or in which damage to the property of any one person is in excess
    of four hundred dollars ($400).
- id: 646
  category: driver_responsibility
  question: How many days do you have to file an Owner/Driver Report of a reportable
    crash to the Tennessee Department of Safety and Homeland Security?
  choices:
    A: 5 days
    B: 10 days
    C: 15 days
    D: 20 days
  answer: D
  explanation: The operator and/or owner of a vehicle involved in a reportable crash
    must file an Owner/Driver Report of the crash within 20 days.
- id: 647
  category: safe_driving_rules
  question: What should you do if you are involved in a crash with an unattended vehicle
    and cannot locate the owner?
  choices:
    A: Leave a note on the windshield and drive away.
    B: Report the crash to the police.
    C: Wait at the scene until the owner returns.
    D: File an Owner/Driver report within 30 days.
  answer: B
  explanation: If the crash involved an unattended vehicle or a domestic animal and
    you cannot locate the owner, you must report the crash to the police.
- id: 648
  category: penalties_and_points
  question: If your driving privileges are revoked for failure to establish financial
    responsibility for a crash, what form must your liability insurance carrier file
    before reinstatement?
  choices:
    A: SR-22 form
    B: FR-44 form
    C: TN-10 form
    D: DL-12 form
  answer: A
  explanation: Before driving privileges can be reinstated after such a revocation,
    you are required to pay a reinstatement fee and have a liability insurance carrier
    file a SR-22 form with the Department of Safety.
- id: 649
  category: safe_driving_rules
  question: What is the first thing you should do to a damaged vehicle at a crash
    scene to prevent a fire?
  choices:
    A: Disconnect the battery.
    B: Turn off the ignition.
    C: Pour water on the engine.
    D: Remove the gas cap.
  answer: B
  explanation: The manual instructs drivers to "Turn off the ignition in the damaged
    vehicle to prevent a fire."
- id: 650
  category: safe_driving_rules
  question: Under Tennessee law, when are you allowed to move your vehicle out of
    the traffic flow after a crash on the interstate?
  choices:
    A: Only after the police have arrived and taken photos.
    B: If the vehicle is drivable and there are no serious personal injuries or deaths.
    C: You are never allowed to move a vehicle until a tow truck arrives.
    D: Only if the property damage is less than $50.
  answer: B
  explanation: If you are involved in a traffic crash on the interstate, Tennessee
    law allows you to move the vehicle to prevent blocking traffic if the vehicle
    is still drivable and there are NO SERIOUS PERSONAL INJURIES or deaths.
- id: 651
  category: safe_driving_rules
  question: When is it acceptable to move an injured person from a wrecked vehicle
    if you do not have medical or rescue training?
  choices:
    A: When they ask you to move them.
    B: When they are blocking traffic.
    C: When there is an immediate danger such as a fire.
    D: When the ambulance is more than 10 minutes away.
  answer: C
  explanation: Do not attempt to move an injured person from a wrecked vehicle unless
    you have the necessary medical or rescue training or there is an immediate danger
    such as fire.
- id: 652
  category: defensive_driving
  question: If you arrive first at a crash scene and are not professionally trained
    to render aid, what should you do after calling 911?
  choices:
    A: Stop and direct traffic around the crash.
    B: Slowly continue on in your vehicle so as not to interfere.
    C: Pull over and wait for the police to take your statement.
    D: Try to extract the passengers from the vehicles.
  answer: B
  explanation: If you are not professionally trained to render aid, slowly continue
    on in your vehicle so not to interfere with the arrival of police and emergency
    services, preventing a secondary collision.
- id: 653
  category: safe_driving_rules
  question: If you witness a crash occur, what is the proper procedure according to
    the manual?
  choices:
    A: Pull safely off to the side of the road, turn on emergency flashers, and notify
      the police.
    B: Chase down the vehicles if it was a hit-and-run.
    C: Continue driving and call the police when you get home.
    D: Stop in the middle of the road to block traffic and protect the scene.
  answer: A
  explanation: If you witnessed the crash occur, pull safely off to the side of the
    road and turn on your vehicle's emergency flashers. Notify the police officer
    or Tennessee State Trooper that you witnessed the crash.
- id: 654
  category: penalties_and_points
  question: According to the manual, a driver license may be revoked or suspended
    for which of the following reasons?
  choices:
    A: Accumulating 8 points within a 12-month period
    B: Fraudulently altering a driver license
    C: Receiving a single parking ticket
    D: Driving 5 mph over the speed limit once
  answer: B
  explanation: The manual states that a driver license may be revoked or suspended
    for fraudulently altering a driver license, or for frequent convictions resulting
    in 12 or more points within a 12-month period.
- id: 655
  category: defensive_driving
  question: What does the safe driving practice 'Aim High In Steering' mean?
  choices:
    A: Adjusting your steering wheel to the highest position
    B: Looking as far down the road as possible to uncover important traffic information
    C: Keeping your eyes focused directly on the hood of your car
    D: Steering with both hands at the very top of the wheel
  answer: B
  explanation: To 'Aim High In Steering' means to look as far down the road as possible
    to uncover important traffic information to make appropriate decisions.
- id: 656
  category: defensive_driving
  question: 'To ''Leave Yourself an Out'' while driving, you should surround your
    vehicle with space in front and at least on:'
  choices:
    A: Both sides
    B: The rear
    C: One side
    D: The passenger side only
  answer: C
  explanation: The manual advises to 'Leave Yourself an Out' by being prepared and
    surrounding your vehicle with space in front and at least on one side to escape
    conflict.
- id: 657
  category: driver_responsibility
  question: What are the most important driving attitudes you can develop to ensure
    safe driving?
  choices:
    A: Aggressiveness and speed
    B: Courtesy and consideration toward others
    C: Confidence and assertiveness
    D: Competitiveness and alertness
  answer: B
  explanation: According to the manual, courtesy and consideration toward others are
    the most important driving attitudes you can develop and are the key to safe driving.
- id: 658
  category: defensive_driving
  question: 'When driving defensively, you should expect the other driver to:'
  choices:
    A: Always obey the rules of the road
    B: Yield the right-of-way to you
    C: Do the WRONG thing
    D: Use their turn signals correctly
  answer: C
  explanation: A key rule of driving alertly is to expect the other driver to do the
    WRONG thing, and have a plan of action prepared to counter their error.
- id: 659
  category: safe_driving_rules
  question: Under which conditions should you increase your following distance to
    at least 3 to 4 seconds?
  choices:
    A: When driving in residential neighborhoods
    B: When following large commercial trucks or buses on high-speed interstates
    C: When driving in heavy stop-and-go traffic
    D: When approaching a four-way stop
  answer: B
  explanation: The manual states that on high-speed interstates, when following large
    commercial trucks or buses, and in inclement weather or limited visibility conditions,
    it is safest to increase following distance to at least 3 to 4 seconds.
- id: 660
  category: defensive_driving
  question: What percentage of information about the road and our surroundings do
    we gather through our eyes while driving?
  choices:
    A: 50%
    B: 75%
    C: 90%
    D: 99%
  answer: C
  explanation: When driving, we gather 90% of the information about the road and our
    surroundings through our eyes.
- id: 661
  category: defensive_driving
  question: How far ahead should defensive drivers try to focus their eyes while scanning
    the road?
  choices:
    A: 2 to 3 seconds ahead
    B: 5 to 8 seconds ahead
    C: 10 to 15 seconds ahead
    D: 20 to 30 seconds ahead
  answer: C
  explanation: Defensive drivers try to focus their eyes 10 to 15 seconds (about the
    distance of 1 city block) ahead to see things early and allow more time to react.
- id: 662
  category: safe_driving_rules
  question: When entering an intersection, why should you look to the left first?
  choices:
    A: Because cars coming from the left will be closer to you
    B: Because cars from the left always have the right-of-way
    C: Because left turns are illegal at most intersections
    D: Because traffic signs are usually posted on the left
  answer: A
  explanation: At any intersection, look to the left first, since cars coming from
    the left will be closer to you.
- id: 663
  category: defensive_driving
  question: How often should you use your rearview mirror to check the traffic behind
    you?
  choices:
    A: About every 5 seconds
    B: About every 10 seconds
    C: About every 30 seconds
    D: Only when you are preparing to stop
  answer: B
  explanation: You should use your rearview mirror to check the traffic behind you
    frequently, about every 10 seconds.
- id: 664
  category: safe_driving_rules
  question: When should you develop the habit of using your turn signals?
  choices:
    A: Only when you see other vehicles on the road
    B: Only when changing lanes on an interstate
    C: Even when you do not see other vehicles on the road
    D: Only during daylight hours
  answer: C
  explanation: You should develop the habit of using your turn signals even when you
    do not see other vehicles on the road.
- id: 665
  category: defensive_driving
  question: If you are being tailgated and there is no right lane to move into, what
    is the safest way to handle the situation?
  choices:
    A: Slow down quickly to discourage the tailgater
    B: Wait until the road ahead is clear and passing is legal, then slowly reduce
      your speed
    C: Speed up to increase the distance between you and the tailgater
    D: Tap your brakes repeatedly to flash your brake lights
  answer: B
  explanation: If there is no right lane, wait until the road ahead is clear and passing
    is legal, then slowly reduce your speed. This will encourage the tailgater to
    drive around you. Never slow down quickly.
- id: 666
  category: defensive_driving
  question: While scanning the road, which of the following is a clue that a vehicle
    might pull into your path?
  choices:
    A: The vehicle's windows are rolled down
    B: The vehicle has a dirty windshield
    C: The vehicle has turned wheels or exhaust smoke
    D: The vehicle is parked near a fire hydrant
  answer: C
  explanation: You should look for clues like exhaust smoke, brake or back-up lights,
    and turned wheels on vehicles, as these indicate that the vehicles may pull into
    your path.
- id: 667
  category: safe_driving_rules
  question: When meeting oncoming vehicles on a two-lane road, where should you position
    your vehicle?
  choices:
    A: Directly on the centerline
    B: Slightly to the right of your lane so as not to crowd the centerline
    C: Slightly to the left of your lane to see better
    D: On the right shoulder of the road
  answer: B
  explanation: When meeting oncoming vehicles on a two-lane road, stay slightly to
    the right of your lane so as not to 'crowd' the centerline.
- id: 668
  category: penalties_and_points
  question: A driver license may be revoked or suspended for frequent convictions
    of traffic law violations resulting in how many points within a 12-month period?
  choices:
    A: 6 or more points
    B: 8 or more points
    C: 10 or more points
    D: 12 or more points
  answer: D
  explanation: A driver license may be revoked or suspended for frequent convictions
    of traffic law violations resulting in 12 or more 'points' within a 12-month period.
- id: 669
  category: defensive_driving
  question: What is the minimum gap needed whenever you change lanes, enter a roadway,
    or merge with another traffic lane?
  choices:
    A: Two-second gap
    B: Three-second gap
    C: Four-second gap
    D: Five-second gap
  answer: C
  explanation: According to the manual, a minimum four-second gap is needed whenever
    you change lanes, enter a roadway, or when your lane merges with another traffic
    lane.
- id: 670
  category: safe_driving_rules
  question: When passing another vehicle, when is it safest to return to the driving
    lane?
  choices:
    A: As soon as your vehicle is ahead of the other vehicle's front bumper.
    B: When you can see both headlights of the passed vehicle in your rearview mirror.
    C: When the driver you passed flashes their headlights at you.
    D: After exactly three seconds have passed since you changed lanes.
  answer: B
  explanation: To finish a pass defensively, it is safest not to return to the driving
    lane until you can see both headlights of the vehicle you just passed in the rearview
    mirror.
- id: 671
  category: safe_driving_rules
  question: Approximately how much time do you need to complete a pass of a single
    vehicle at 55 M.P.H.?
  choices:
    A: About 5 seconds
    B: About 10 seconds
    C: About 15 seconds
    D: About 20 seconds
  answer: B
  explanation: At 55 M.P.H. you will need about ten (10) seconds to complete the pass
    of a single vehicle, which means you need a ten-second gap in oncoming traffic.
- id: 672
  category: defensive_driving
  question: According to the NHTSA, approximately what percentage of all traffic fatalities
    annually are caused by aggressive driving behaviors?
  choices:
    A: 33%
    B: 50%
    C: 66%
    D: 80%
  answer: C
  explanation: The National Highway Traffic Safety Administration (NHTSA) says about
    66% of all traffic fatalities annually are caused by aggressive driving behaviors.
- id: 673
  category: defensive_driving
  question: If an aggressive driver follows you, what is the recommended action?
  choices:
    A: Drive home immediately and lock your doors.
    B: Stop your vehicle and confront the driver.
    C: Go to a police station or a public place where you can get help.
    D: Speed up to lose the driver in traffic.
  answer: C
  explanation: Tips to Avoid Road Rage state that if a driver follows you, you should
    go to a police station or a public place where you can get help.
- id: 674
  category: safe_driving_rules
  question: Under what weather conditions do most accidents happen?
  choices:
    A: In clear weather
    B: In snow
    C: In rain
    D: In fog
  answer: A
  explanation: According to the manual's short test on special driving conditions,
    most accidents happen in clear weather, noting that 'pretty days can be deadly
    too!'
- id: 675
  category: defensive_driving
  question: What are the three options a driver has to avoid a collision?
  choices:
    A: Stop, Turn, Speed Up
    B: Brake, Honk, Swerve
    C: Stop, Reverse, Turn
    D: Accelerate, Honk, Brake
  answer: A
  explanation: 'In avoiding a collision, drivers have three options: 1. Stop, 2. Turn,
    3. Speed Up.'
- id: 676
  category: vehicle_information
  question: 'If you need to stop quickly and your vehicle is equipped with an Antilock
    Braking System (ABS), you should:'
  choices:
    A: Pump the brakes rapidly to avoid skidding.
    B: Press the brake pedal as hard as you can and keep pressing on it firmly.
    C: Apply the brakes gently and gradually increase pressure.
    D: Press the brake pedal hard and let up immediately if you feel it pushing back.
  answer: B
  explanation: With ABS, you should press on the brake pedal as hard as you can and
    keep pressing on it firmly. You should NOT let up on the brake pedal even if you
    feel it pushing back.
- id: 677
  category: vehicle_information
  question: What should you do if you must stop quickly, you do NOT have ABS, and
    your brakes lock up causing a skid?
  choices:
    A: Keep pressing the brake pedal as hard as possible.
    B: Quickly let up on the brake pedal, then push down again once the skidding stops.
    C: Turn the steering wheel sharply in the opposite direction.
    D: Apply the parking brake immediately.
  answer: B
  explanation: Without ABS, if the brakes lock up and you start to skid, you should
    quickly let up on the brake pedal. As soon as the vehicle stops skidding, push
    down on the brake pedal again.
- id: 678
  category: safe_driving_rules
  question: To make quick evasive turns, what is the recommended hand position on
    the steering wheel?
  choices:
    A: 10 o'clock and 2 o'clock
    B: 8 o'clock and 4 o'clock
    C: 3 o'clock and 9 o'clock
    D: 12 o'clock and 6 o'clock
  answer: C
  explanation: For most turns, especially quick turns, it is best to have your hands
    at about the 3 o'clock and 9 o'clock positions.
- id: 679
  category: vehicle_information
  question: Why is the 3 o'clock and 9 o'clock hand position recommended on the steering
    wheel?
  choices:
    A: It allows you to reach the turn signal more easily.
    B: It keeps your wrists and forearms out of the main impact area of the air bag.
    C: It prevents the steering wheel from locking during a sharp turn.
    D: It provides the most leverage for turning the wheel with one hand.
  answer: B
  explanation: Having your hands at 3 o'clock and 9 o'clock keeps your wrists and
    forearms out of the main impact area of the air bag located in the steering wheel
    should you become involved in a collision.
- id: 680
  category: defensive_driving
  question: What does the driving rule 'Split the difference' mean?
  choices:
    A: Straddle the lane line when passing a bicycle.
    B: Steer a middle course between two hazards, leaving more room on the most dangerous
      side.
    C: Cross multiple lanes of traffic one lane at a time.
    D: Maintain a two-second following distance in normal traffic.
  answer: B
  explanation: '''Split the difference'' means steering a middle course between two
    hazards. If one is more dangerous than the other, you leave a little more space
    on the most dangerous side.'
- id: 681
  category: safe_driving_rules
  question: When crossing traffic at an intersection, what must you ensure before
    entering?
  choices:
    A: That you can get halfway across and wait in the median.
    B: That you have a large enough gap to get all the way across without blocking
      the intersection.
    C: That the vehicle behind you is also ready to cross.
    D: That you speed up to beat the approaching traffic.
  answer: B
  explanation: When you cross traffic, you need a large enough gap to get all the
    way across the road. You must NOT block intersections or get caught with a portion
    of your vehicle left in a traffic lane.
- id: 682
  category: defensive_driving
  question: If another driver makes a mistake, such as passing you without enough
    room, what should you do?
  choices:
    A: Speed up to prevent them from entering your lane.
    B: Honk your horn and flash your lights to warn them.
    C: Slow down and allow room for them to safely return to the driving lane.
    D: Move onto the shoulder and stop completely.
  answer: C
  explanation: If another driver makes a mistake, such as passing without enough room,
    you should handle the error defensively by slowing down and allowing room for
    passing drivers to safely return to the driving lane.
- id: 683
  category: safe_driving_rules
  question: What is the recommended hand position for basic driving?
  choices:
    A: 10 o'clock and 2 o'clock
    B: 9 o'clock and 3 o'clock
    C: 8 o'clock and 4 o'clock
    D: 11 o'clock and 1 o'clock
  answer: B
  explanation: The manual states that the basic driving position is returning your
    hands to the left at 9 o'clock and right at 3 o'clock.
- id: 684
  category: vehicle_information
  question: What happens in an emergency or slippery condition if your vehicle does
    NOT have Anti-Lock Brakes (ABS) and you brake hard?
  choices:
    A: The wheels will not lock and the car remains stable.
    B: The car will automatically speed up to avoid a collision.
    C: All wheels will lock, the car will begin to skid, and it will not be steerable.
    D: The brakes will electronically pump much faster than you can manually.
  answer: C
  explanation: In emergency or slippery conditions without ABS, all wheels lock; the
    car begins to skid and is not steerable.
- id: 685
  category: defensive_driving
  question: If your vehicle does not have ABS, what must you do to turn quickly while
    braking?
  choices:
    A: Stomp and hold the brake pedal firmly while turning.
    B: Let up on the brake pedal and then turn the steering wheel.
    C: Pump the brakes rapidly while jerking the steering wheel.
    D: Accelerate while turning the steering wheel sharply.
  answer: B
  explanation: Without ABS, as you are braking you will need to let up on the brake
    pedal and then turn the steering wheel to turn quickly.
- id: 686
  category: defensive_driving
  question: When might it be best or necessary to speed up to avoid a collision?
  choices:
    A: When you are approaching a deer crossing sign.
    B: When another vehicle is about to hit you from the side or behind and there
      is room to the front.
    C: When you are driving in a school zone and a car is tailgating you.
    D: When you are approaching a sharp curve without ABS.
  answer: B
  explanation: Sometimes it is best to speed up to avoid a collision when another
    vehicle is about to hit you from the side or from behind and there is room to
    the front of your vehicle to get out of danger.
- id: 687
  category: safe_driving_rules
  question: Which season is the peak time for deer-car crashes?
  choices:
    A: Spring
    B: Summer
    C: Fall
    D: Winter
  answer: C
  explanation: Fall is the peak season for deer-car crashes because Autumn is both
    mating season and hunting season, making deer more active.
- id: 688
  category: defensive_driving
  question: Why should you avoid flashing your headlights at a deer in the road?
  choices:
    A: It will cause the deer to charge at your vehicle.
    B: Deer tend to fixate on headlights, so flashing them may cause the animal to
      freeze in the road.
    C: It will temporarily blind oncoming drivers.
    D: It will cause the deer to run unpredictably into oncoming traffic.
  answer: B
  explanation: Deer tend to fixate on headlights, so flashing them may cause the animal
    to freeze in the road.
- id: 689
  category: defensive_driving
  question: What should you do if a collision with an animal seems inevitable?
  choices:
    A: Swerve sharply to the left or right to avoid the animal.
    B: Speed up to minimize the impact time.
    C: Keep your vehicle under control and on the roadway without swerving.
    D: Pump your brakes rapidly and jerk the steering wheel.
  answer: C
  explanation: If a collision seems inevitable, don't swerve to avoid the animal;
    your risk of personal injury may be greater if you do. Keep your vehicle under
    control and on the roadway.
- id: 690
  category: vehicle_information
  question: What is the correct braking technique when using Anti-Lock Brakes (ABS)
    in a real emergency situation?
  choices:
    A: Pump the brake pedal rapidly.
    B: Lightly tap the brakes to warn other drivers.
    C: Push hard and hold the pedal down, even if it pulsates.
    D: Let up on the brakes slightly when you feel the pedal pulsate.
  answer: C
  explanation: The manual instructs drivers with ABS to 'Stomp. Slam that brake pedal.
    Push hard and hold the pedal down.' You should not let up even if the pedal pulsates.
- id: 691
  category: vehicle_information
  question: Why should you NEVER pump the brake pedal of a vehicle equipped with ABS?
  choices:
    A: Pumping the brakes will cause the engine to stall.
    B: The ABS system is already electronically pumping the brakes much faster than
      you can manually.
    C: It will cause the steering wheel to lock up.
    D: It will disable the vehicle's airbags.
  answer: B
  explanation: You should never pump the brake pedal of an ABS-equipped vehicle because
    the pulsating feeling is simply the ABS system electronically 'pumping' the brakes
    much faster than you could ever do manually.
- id: 692
  category: safe_driving_rules
  question: What are the three major components of the highway transportation system
    that must be considered when driving?
  choices:
    A: Driver, Vehicle, and Road
    B: Weather, Traffic, and Speed
    C: Vision, Hearing, and Reflexes
    D: Signs, Signals, and Markings
  answer: A
  explanation: 'There are three major components to our highway transportation system
    that must be considered when driving: 1. Driver, 2. Vehicle, 3. Road.'
- id: 693
  category: driver_responsibility
  question: What is the single most common cause of traffic crashes?
  choices:
    A: Poor weather conditions
    B: Mechanical failure
    C: Human error
    D: Poorly maintained roads
  answer: C
  explanation: The manual states that human error is the single most common cause
    of traffic crashes.
- id: 694
  category: driver_responsibility
  question: According to the manual, which of the following is one of the leading
    factors in traffic crashes?
  choices:
    A: Driving with the radio on
    B: Excessive speed
    C: Using high-beam headlights at night
    D: Driving an older vehicle
  answer: B
  explanation: The leading factors in crashes are Excessive Speed, Lack of Concentration,
    and Improper Evasive Action.
- id: 695
  category: alcohol_drugs_health
  question: Which of the following temporary conditions can make you an unsafe driver?
  choices:
    A: Anger, worry, and fatigue
    B: Wearing sunglasses during the day
    C: Having a passenger in the back seat
    D: Driving an ABS-equipped vehicle
  answer: A
  explanation: Anger, worry, frustration, fatigue and minor illnesses such as a cold
    are a few of the temporary conditions that can make you an unsafe driver.
- id: 696
  category: safe_driving_rules
  question: Why must a driver use their side mirrors and glance to the side occasionally?
  choices:
    A: Because you cannot focus on things to the side using only peripheral vision.
    B: To ensure the rear doors are securely closed.
    C: To monitor the speed of vehicles in the opposite lane.
    D: To avoid looking directly at oncoming headlights.
  answer: A
  explanation: Because you can't focus on things to the side, you also must use your
    side mirrors and glance to the side occasionally if necessary.
- id: 697
  category: driver_responsibility
  question: What should you do if you hit a large animal, such as a deer or farm animal?
  choices:
    A: Move the animal off the roadway yourself.
    B: Report the crash to the police.
    C: Leave the scene immediately if your car is drivable.
    D: Wait by the animal until its owner arrives.
  answer: B
  explanation: You should report the crash to the police if it involves a large animal
    such as a deer or farm animal.
- id: 698
  category: license_system
  question: What does Restriction Code 01 on your driver license indicate?
  choices:
    A: You are restricted to driving only during daylight hours.
    B: You must have a licensed adult in the vehicle at all times.
    C: You must wear corrective lenses at all times when driving.
    D: You are restricted from driving on interstate highways.
  answer: C
  explanation: The manual states that if your driver license indicates you must wear
    corrective lenses (Restriction Code 01), you must wear them at all times when
    driving.
- id: 699
  category: safe_driving_rules
  question: Why should you avoid using dark sunglasses or tinted contact lenses at
    night?
  choices:
    A: They increase the glare from oncoming headlights.
    B: They cut down the light you need to see clearly.
    C: They cause your eyes to become fatigued much faster.
    D: They are illegal to wear while driving in Tennessee.
  answer: B
  explanation: The manual advises to avoid using dark sunglasses or tinted contact
    lenses at night because they cut down the light you need to see clearly.
- id: 700
  category: driver_responsibility
  question: How can drivers with a hearing impairment compensate to remain safe on
    the road?
  choices:
    A: By relying more on their vision.
    B: By driving at slower speeds than the posted limit.
    C: By keeping their windows rolled down at all times.
    D: By installing louder horns on their vehicles.
  answer: A
  explanation: According to the manual, drivers who have a hearing impairment can
    adjust and compensate by relying more on their vision to be a safe driver.
- id: 701
  category: defensive_driving
  question: Which of the following is a recommended tip to help avoid fatigue when
    driving on an extended trip?
  choices:
    A: Eat a large meal before beginning the trip.
    B: Stop every hour or more often if needed to take a break.
    C: Drive late at night when there is less traffic on the road.
    D: Take over-the-counter medicine to help you stay alert.
  answer: B
  explanation: To avoid fatigue, the manual recommends taking breaks by stopping every
    hour or more often if needed to walk around and get fresh air.
- id: 702
  category: alcohol_drugs_health
  question: 'In Tennessee, a person with epilepsy may drive if they are under a doctor''s
    care and have been seizure-free for a minimum of:'
  choices:
    A: Three months
    B: Six months
    C: One year
    D: Two years
  answer: B
  explanation: The manual states that in Tennessee, you may drive if you are under
    the care of a doctor and have been seizure-free for a minimum of six months.
- id: 703
  category: alcohol_drugs_health
  question: Why should drivers with diabetes have their eyes checked regularly?
  choices:
    A: Because insulin causes the eyes to become overly sensitive to glare.
    B: To ensure they do not need Restriction Code 01 added to their license.
    C: Because diabetes causes the eyes to dry out faster while driving.
    D: To check for possible night blindness or other vision problems.
  answer: D
  explanation: The manual notes that if you have diabetes, you should have your eyes
    checked regularly for possible night blindness or other vision problems.
- id: 704
  category: driver_responsibility
  question: If you tend to be an impatient person, what should you do to avoid unsafe
    driving actions?
  choices:
    A: Listen to fast-paced music to stay alert.
    B: Drive slightly above the speed limit to avoid heavy traffic.
    C: Always plan extra time for your driving trips.
    D: Only drive during off-peak hours.
  answer: C
  explanation: The manual advises that if you tend to be an impatient person, you
    should always plan extra time for your driving trips to avoid speeding or other
    unsafe actions.
- id: 705
  category: vehicle_information
  question: Which of the following is a sign that your braking system needs to be
    checked by a mechanic?
  choices:
    A: The brake pedal feels firm and resists pressure.
    B: The vehicle stops smoothly without pulling to one side.
    C: The brake pedal goes to the floor.
    D: The brakes are completely silent when applied.
  answer: C
  explanation: The manual warns that it is very dangerous if brakes are not working
    properly, such as making a lot of noise, smelling funny, or if the brake pedal
    goes to the floor.
- id: 706
  category: vehicle_information
  question: Car batteries tend to run down more rapidly in what type of weather?
  choices:
    A: Hot and dry weather
    B: Cold or damp weather
    C: Humid and sunny weather
    D: High-altitude conditions
  answer: B
  explanation: According to the vehicle maintenance section, car batteries tend to
    run down more rapidly in cold or damp weather.
- id: 707
  category: vehicle_information
  question: What is a common cause of a film building up on the inside of a vehicle's
    glass?
  choices:
    A: Using the heater/defroster too often.
    B: Using non-freezing windshield washer fluid.
    C: Smoking inside the vehicle.
    D: Leaving the windows down during rain.
  answer: C
  explanation: The manual states to keep the inside of your windows clean, especially
    if anyone using the vehicle smokes, because smoking causes a film to build up
    on the inside of the glass.
- id: 708
  category: vehicle_information
  question: What is a consequence of driving with unbalanced tires and low tire pressure?
  choices:
    A: It improves fuel economy and ride comfort.
    B: It makes the vehicle easier to steer in wet conditions.
    C: It decreases the chance of hydroplaning.
    D: It causes faster tire wear and reduces fuel economy.
  answer: D
  explanation: The manual explains that unbalanced tires and low pressure cause faster
    tire wear, reduce fuel economy, and make the vehicle harder to steer and stop.
- id: 709
  category: vehicle_information
  question: 'When using a penny to check tire tread, the tire is considered illegal
    and unsafe if the tread does not come at least to:'
  choices:
    A: The top of the Lincoln Memorial
    B: Lincoln's head (2/32 inch)
    C: The date printed on the penny
    D: The words 'In God We Trust'
  answer: B
  explanation: The manual states that if you stick a penny into the tread head first
    and the tread does not come at least to Lincoln's head (2/32 inch), the tire is
    illegal and unsafe.
- id: 710
  category: vehicle_information
  question: Where can you usually find the vehicle's recommended tire pressure on
    many newer cars?
  choices:
    A: On the steering wheel column.
    B: On the sticker in the driver's side front door jamb.
    C: On the inside of the glove compartment door.
    D: On the vehicle's rear bumper.
  answer: B
  explanation: The manual notes that on many newer cars, the vehicle's recommended
    tire pressure is on the sticker in the door jamb, usually located on the driver's
    side front door.
- id: 711
  category: driver_responsibility
  question: How often does the manual recommend having your eyes checked by an eye
    specialist?
  choices:
    A: Every six months
    B: Every year or two
    C: Every five years
    D: Only when renewing your driver license
  answer: B
  explanation: Because seeing well is so important to safe driving, the manual recommends
    having your eyes checked every year or two by an eye specialist.
- id: 712
  category: vehicle_information
  question: Where is the recommended tire pressure usually located for a vehicle's
    original tires?
  choices:
    A: Printed directly on the tires themselves
    B: On a sticker in the driver's side front door jamb
    C: On the steering wheel column
    D: Engraved on the engine block
  answer: B
  explanation: On many newer cars, the vehicle's recommended tire pressure is on the
    sticker in the door jamb, usually located on the driver's side front door.
- id: 713
  category: vehicle_information
  question: Why should you NOT use the tire pressure printed on the tires themselves?
  choices:
    A: It is the minimum pressure required to drive safely.
    B: It is only applicable for winter driving conditions.
    C: It is the maximum recommended pressure and may not match your vehicle's specifications.
    D: It is meant only for aftermarket tires of a different size.
  answer: C
  explanation: 'The manual states: "Do not use the tire pressure psi printed on the
    tires themselves. This is the maximum recommended pressure for the tire and may
    not match up with your vehicle''s manufacturer specifications."'
- id: 714
  category: safe_driving_rules
  question: What will happen if you turn your vehicle's ignition to the 'lock' position
    while the vehicle is in motion?
  choices:
    A: The brakes will immediately engage.
    B: The steering wheel will lock in place and you will lose control of the vehicle.
    C: The engine will overheat rapidly.
    D: The vehicle will safely glide to a stop.
  answer: B
  explanation: Never turn your vehicle's ignition to the 'lock' position while the
    vehicle is in motion. This will cause the steering wheel to lock in place and
    you will lose control of the vehicle.
- id: 715
  category: vehicle_information
  question: If your vehicle continues to bounce after a bump or a stop, what system
    likely needs to be checked by a mechanic?
  choices:
    A: The exhaust system
    B: The steering system
    C: The engine cooling system
    D: The suspension system
  answer: D
  explanation: If the vehicle continues to bounce after a bump or a stop, or is hard
    to control, you may need new shocks or other suspension parts.
- id: 716
  category: vehicle_information
  question: What is a dangerous warning sign that your vehicle may have an exhaust
    leak?
  choices:
    A: The steering wheel becomes difficult to turn.
    B: You or your passengers get a sleepy feeling when driving or riding.
    C: The vehicle bounces excessively after coming to a stop.
    D: The engine temperature gauge drops suddenly.
  answer: B
  explanation: If you ever start to notice that you and/or your passengers tend to
    get a sleepy feeling when driving or riding in your car you may have an exhaust
    leak that needs to be repaired immediately.
- id: 717
  category: safe_driving_rules
  question: What should you do if you are sitting in a vehicle with the motor running
    (idling) for a prolonged period?
  choices:
    A: Turn the ignition to the 'lock' position.
    B: Check the radiator coolant level.
    C: Open a window to provide fresh air.
    D: Sound your horn periodically to stay alert.
  answer: C
  explanation: When sitting for prolonged periods in a vehicle with the motor running
    (idling), open a window to provide fresh air to prevent Carbon Monoxide fumes
    from overcoming people in the vehicle.
- id: 718
  category: vehicle_information
  question: When is the ONLY safe time to check your radiator's antifreeze/coolant
    level?
  choices:
    A: Immediately after operating the vehicle
    B: While the engine is running
    C: When the vehicle is parked on an incline
    D: When the vehicle is cool
  answer: D
  explanation: Be careful to check your radiator ONLY when the vehicle is cool, not
    immediately after operation.
- id: 719
  category: defensive_driving
  question: Why is it dangerous to have loose objects on the floor of your vehicle?
  choices:
    A: They can roll under the brake pedal and prevent you from stopping.
    B: They will cause the suspension system to bounce.
    C: They can cause an exhaust leak.
    D: They will drain the vehicle's battery.
  answer: A
  explanation: Make sure there are no objects on the floor that could roll under the
    brake pedal and prevent you from stopping the vehicle.
- id: 720
  category: safe_driving_rules
  question: According to the manual, what is the ONLY appropriate use for your vehicle's
    horn?
  choices:
    A: To greet friends on the road
    B: To encourage slow drivers to speed up
    C: As a warning to others
    D: To signal that you are parking
  answer: C
  explanation: The horn may not seem like it is important for safety, but as a warning
    device, it could save your life. ONLY use your horn as a warning to others.
- id: 721
  category: safe_driving_rules
  question: How much gas should you ensure your vehicle has before starting any trip
    of significant length?
  choices:
    A: At least a quarter tank
    B: At least a half tank
    C: A completely full tank
    D: Enough to reach the nearest gas station
  answer: B
  explanation: Be sure your vehicle always has at least a half tank of gas before
    starting any trip of significant length.
- id: 722
  category: defensive_driving
  question: 'According to the manual, collisions involving multiple vehicles often
    happen when:'
  choices:
    A: Drivers use their horns too frequently.
    B: Drivers go faster or slower than other traffic.
    C: Vehicles have aftermarket tires installed.
    D: Drivers check their tire pressure too often.
  answer: B
  explanation: Vehicles moving in the same direction at the same speed cannot hit
    one another. Collisions involving multiple vehicles often happen when drivers
    go faster or slower than other traffic.
- id: 723
  category: defensive_driving
  question: Why do you need to lower your speed and be alert in shopping centers,
    parking lots, and downtown areas?
  choices:
    A: Because the speed limit is always 15 mph in these areas.
    B: Because these areas always have rumble strips.
    C: Because vehicles and people are stopping, starting, and moving in different
      directions quickly and randomly.
    D: Because carbon monoxide levels are higher in these areas.
  answer: C
  explanation: Shopping centers, parking lots and downtown areas – these are busy
    areas with vehicles and people stopping, starting and moving in different directions
    quickly and randomly.
- id: 724
  category: safe_driving_rules
  question: Why might you need to slow down when crossing some railroad crossings?
  choices:
    A: To check your tire pressure
    B: Because some crossings are bumpy
    C: To read the manufacturer's specifications
    D: To let the exhaust system cool down
  answer: B
  explanation: Railroad crossings – you need to make sure that there are no trains
    coming and that you have room to cross. Some crossings are bumpy so you need to
    slow down to safely cross.
- id: 725
  category: sharing_the_road
  question: By state law, who is considered a pedestrian?
  choices:
    A: Only people walking on foot
    B: Any person afoot or using a motorized or non-motorized wheelchair
    C: Anyone riding a bicycle or motor-driven bicycle
    D: Only children and the elderly
  answer: B
  explanation: Any person afoot or using a motorized or non-motorized wheelchair are
    considered a pedestrian by state law.
- id: 726
  category: sharing_the_road
  question: Which groups of pedestrians are the most frequent victims in auto-pedestrian
    collisions?
  choices:
    A: Teenagers and young adults
    B: Joggers and runners
    C: Pedestrians walking in large groups
    D: Young, elderly, disabled, and intoxicated pedestrians
  answer: D
  explanation: You should be especially alert for young, elderly, disabled and intoxicated
    pedestrians. They are the most frequent victims in auto-pedestrian collisions.
- id: 727
  category: safe_driving_rules
  question: Which of the following statements about crosswalks is true?
  choices:
    A: Crosswalks only exist where there are painted lines.
    B: Pedestrians only have the right-of-way in marked crosswalks.
    C: There is a crosswalk at every intersection, even if painted lines do not mark
      the crossing.
    D: Drivers may block a crosswalk if waiting to make a right turn.
  answer: C
  explanation: According to the manual, there is a crosswalk at every intersection,
    even if painted lines and boundaries do not mark the crossing.
- id: 728
  category: defensive_driving
  question: Why should drivers avoid stopping with a portion of their vehicle over
    the crosswalk area?
  choices:
    A: It will trigger a red light camera.
    B: It forces pedestrians to go around the vehicle and puts them in a dangerous
      situation.
    C: It causes excessive wear on the vehicle's tires.
    D: It blocks the view of the traffic signal for other drivers.
  answer: B
  explanation: Blocking the crosswalk forces pedestrians to go around your vehicle
    and puts them in a dangerous situation.
- id: 729
  category: safe_driving_rules
  question: What must a driver do in a marked school zone when warning flashers are
    in operation and a pedestrian is crossing?
  choices:
    A: Slow down to 15 mph and proceed with caution.
    B: Honk the horn to warn the pedestrian.
    C: Stop and yield the right-of-way until the pedestrian has crossed the roadway.
    D: Swerve into the adjacent lane to avoid the pedestrian.
  answer: C
  explanation: When in a marked school zone with warning flashers in operation, a
    driver must stop to yield the right-of-way and remain stopped until the pedestrian
    has crossed the roadway.
- id: 730
  category: sharing_the_road
  question: You must always yield to a blind pedestrian who is using a guide dog or
    carrying what type of cane?
  choices:
    A: A solid black cane.
    B: A white, metallic, or red-tipped white cane.
    C: A wooden walking stick.
    D: A yellow reflective cane.
  answer: B
  explanation: Drivers must always yield to blind pedestrians carrying a white, metallic,
    red-tipped white cane or using a guide dog.
- id: 731
  category: safe_driving_rules
  question: When there are no sidewalks available, where should pedestrians walk?
  choices:
    A: On the right side of the road with traffic.
    B: In the center of the road.
    C: On the left side of the road facing traffic.
    D: On the shoulder of the road in the same direction as traffic.
  answer: C
  explanation: When there are no sidewalks, pedestrians should always walk on the
    left side of the road facing traffic so they can see sudden dangers coming at
    them.
- id: 732
  category: safe_driving_rules
  question: How should two or more pedestrians walk when traveling on a road with
    no sidewalks?
  choices:
    A: Side by side to increase visibility.
    B: In a single file line.
    C: Holding hands across the lane.
    D: One on the left side of the road and one on the right.
  answer: B
  explanation: The manual states that two or more pedestrians should walk in single
    file and never side by side of each other when walking on the road.
- id: 733
  category: sharing_the_road
  question: Why is it important for pedestrians to keep a safe distance when standing
    on street corners?
  choices:
    A: To avoid splashing water from puddles.
    B: Because trucks and buses make wide right turns and occasionally run up onto
      the corner of the sidewalk.
    C: To give bicyclists room to ride on the sidewalk.
    D: Because cars often run red lights at high speeds.
  answer: B
  explanation: Trucks and buses make wide right turns and occasionally run up onto
    the corner of the sidewalk, so it is important for pedestrians to be alert and
    move back.
- id: 734
  category: signs_and_signals
  question: What should you do if you are in the middle of the street and the "DON'T
    WALK" signal starts flashing?
  choices:
    A: Stop immediately and wait for the next WALK signal.
    B: Turn around and run back to the curb you started from.
    C: Continue walking to complete the crossing.
    D: Stand in the center median until traffic clears.
  answer: C
  explanation: If you are in the middle of the street and the DON'T WALK signal starts
    flashing, continue walking. You will have time to complete the crossing.
- id: 735
  category: signs_and_signals
  question: What does a WALK signal or a green traffic light indicate to a pedestrian?
  choices:
    A: It is completely safe to cross without looking.
    B: All oncoming traffic is guaranteed to stop.
    C: It is your turn to cross, but you must still look and proceed only if it is
      safe.
    D: You must run across the intersection as quickly as possible.
  answer: C
  explanation: The WALK signal and the green traffic light indicate that it’s your
    turn to cross, but they do NOT mean it is SAFE to cross. It means LOOK and then
    IF it’s safe, proceed.
- id: 736
  category: driver_responsibility
  question: Even if you have the legal right-of-way as a driver, what should you NEVER
    do to a pedestrian in front of your car?
  choices:
    A: Wait patiently for them to cross.
    B: Honk your horn or rev your engine to rush or scare them.
    C: Make eye contact with them.
    D: Yield the right-of-way.
  answer: B
  explanation: Don’t honk your horn, rev up your engine or do anything to rush or
    scare a pedestrian in front of your car, even if you have the legal right-of-way.
- id: 737
  category: safe_driving_rules
  question: What is the recommended looking procedure for a pedestrian before beginning
    to cross a street?
  choices:
    A: Look right-left-right.
    B: Look straight ahead only.
    C: Look left-right-left, and over your shoulder for turning vehicles.
    D: Look up at the traffic light and proceed immediately.
  answer: C
  explanation: Before crossing, stop at the curb and look left-right-left, and if
    it’s clear, begin crossing, look over your shoulder for turning vehicles.
- id: 738
  category: sharing_the_road
  question: Why should a pedestrian never walk behind a truck when it is backing up?
  choices:
    A: The truck's exhaust fumes are toxic.
    B: Truck drivers cannot see directly behind the truck and could seriously injure
      you.
    C: The truck might drop its cargo.
    D: It is illegal to walk behind any commercial vehicle.
  answer: B
  explanation: Never walk behind a truck when it is backing up; truck drivers cannot
    see directly behind the truck and could seriously injure you due to large blind
    spots.
- id: 739
  category: sharing_the_road
  question: When entering or leaving a driveway, alley, or parking lot, what must
    a driver do if their path crosses a sidewalk?
  choices:
    A: Sound their horn to warn pedestrians to stop.
    B: Yield to pedestrians walking on the sidewalk.
    C: Proceed quickly to avoid blocking the sidewalk.
    D: Flash their headlights to gain the right-of-way.
  answer: B
  explanation: Drivers must yield to pedestrians walking on the sidewalk when entering
    or leaving a driveway, public parking garage, alley or parking lot and their path
    of travel crosses the sidewalk.
- id: 740
  category: safe_driving_rules
  question: What is the safest bet for a pedestrian to be seen at night by drivers?
  choices:
    A: Walking exclusively in crosswalks.
    B: Wearing dark clothing to reduce glare.
    C: Carrying a flashlight and wearing bright or reflective clothing.
    D: Walking on the right side of the road.
  answer: C
  explanation: Wearing bright or reflective clothing and carrying a flashlight is
    your safest bet for being seen at night.
- id: 741
  category: sharing_the_road
  question: What are the most common causes of collisions between vehicles and bicycles?
  choices:
    A: Bicyclists running stop signs or red lights.
    B: Drivers turning left in front of an oncoming bicycle or turning right across
      the path of the bicycle.
    C: Bicyclists riding against the flow of traffic.
    D: Drivers passing bicyclists too closely on a multi-lane highway.
  answer: B
  explanation: The most common causes of collisions are drivers turning left in front
    of an oncoming bicycle or turning right, across the path of the bicycle.
- id: 742
  category: sharing_the_road
  question: If your vehicle is sharing the left turn lane with a bicyclist, what should
    you do?
  choices:
    A: Honk your horn to make them move out of your way.
    B: Pass them on the right before making your turn.
    C: Stay behind them until they have safely completed their turn.
    D: Pull up beside them and turn at the same time.
  answer: C
  explanation: If your vehicle is sharing the left turn lane with a bicyclist, stay
    behind them until they have safely completed their turn.
- id: 743
  category: sharing_the_road
  question: Where are bicyclists prohibited from riding?
  choices:
    A: On two-lane rural roads.
    B: On city streets with speed limits over 35 mph.
    C: On limited-access highways, expressways, and certain other marked roadways.
    D: In designated bicycle lanes.
  answer: C
  explanation: Bicyclists are prohibited on limited-access highways, expressways and
    certain other marked roadways.
- id: 744
  category: sharing_the_road
  question: In Tennessee, what is the minimum distance a driver must leave when passing
    a bicyclist proceeding in the same direction?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 5 feet
  answer: B
  explanation: When passing and overtaking a bicyclist proceeding in the same direction,
    do so slowly and leave at least a distance between you and the bicycle of not
    less than 3 feet. It’s the law in Tennessee!
- id: 745
  category: safe_driving_rules
  question: What should you do if you are about to pass a bicycle on a narrow road
    and you think the rider doesn't know you are coming?
  choices:
    A: Blast your horn to ensure they hear you.
    B: Tap your horn gently and briefly as a signal.
    C: Rev your engine loudly.
    D: Pass them as closely as possible so they notice you.
  answer: B
  explanation: If you are about to pass a bicycle on a narrow road and you think the
    rider doesn’t know your coming, tap your horn gently and briefly as a signal that
    you’re going to pass.
- id: 746
  category: sharing_the_road
  question: What is the proper hand signal for a bicyclist to indicate a left turn?
  choices:
    A: Extend the left arm out sideways bent at a 90-degree angle, hand pointing upward.
    B: Extend the left arm or right arm sideways and bend at a 90-degree angle, hand
      pointing downwards.
    C: Extend the left arm out sideways with all fingers extended or use the index
      finger to point left.
    D: Extend the right arm out straight with the palm facing backward.
  answer: C
  explanation: 'Left Turn: Extend your left arm out sideways with all fingers extended
    or use your index finger to point left.'
- id: 747
  category: sharing_the_road
  question: How does a bicyclist signal that they are stopping or slowing down?
  choices:
    A: By extending the left arm out sideways with all fingers extended.
    B: By extending the left arm out sideways bent at a 90-degree angle, hand pointing
      upward.
    C: By extending the right arm out straight with all fingers extended.
    D: By extending the left or right arm sideways and bending it at a 90-degree angle,
      hand pointing downwards.
  answer: D
  explanation: 'Stopping or Slowing: Extend your left arm or right arm sideways and
    bend your arm at a 90-degree angle at the elbow joint, hand pointing downwards
    and the palm of your hand facing backwards.'
- id: 748
  category: sharing_the_road
  question: When is a bicyclist allowed full use of the lane?
  choices:
    A: When the lane is too narrow for both a vehicle and a bicycle to safely share
      the lane.
    B: Whenever they are riding in a residential neighborhood.
    C: Only when they are riding in a group of three or more.
    D: Bicyclists are never allowed full use of the lane.
  answer: A
  explanation: A bicyclist should be allowed full use of the lane when... The lane
    is too narrow for both a vehicle and a bicycle to safely share the lane. In this
    case it is safest to let the bicycle take the full lane.
- id: 749
  category: vehicle_information
  question: According to Tennessee law, what lighting equipment is required on a bicycle
    used at night?
  choices:
    A: A white light on the front visible from 500 feet and a red reflector or red
      light on the rear visible from 500 feet.
    B: A yellow light on the front visible from 300 feet and a white reflector on
      the rear.
    C: Only a red reflector on the rear visible from 200 feet.
    D: A flashing white light on the front and a flashing yellow light on the rear.
  answer: A
  explanation: Tennessee law requires that a bicycle used at night must be equipped
    with a lamp on the front that emits a white light visible from a distance of at
    least 500 feet to the front and either a red reflector or lamp emitting a red
    light that is visible from distance of 500 feet to the rear.
- id: 750
  category: sharing_the_road
  question: Why do bicyclists tend to move toward the center of the lane when traveling
    past parked cars?
  choices:
    A: To block traffic from passing them.
    B: To avoid injuring or being injured by persons getting out of those cars.
    C: Because the pavement is smoother in the center of the lane.
    D: To prepare for a right turn.
  answer: B
  explanation: When cyclists are traveling past parked cars, they tend to move away
    from the cars, toward the center of the lane. This is to avoid injuring or being
    injured by persons getting out of those cars.
- id: 751
  category: defensive_driving
  question: What should you do regarding your headlights when you see an oncoming
    bicycle rider at night?
  choices:
    A: Use your high beams so you can see them clearly.
    B: Honk your horn continuously to let them know you are there.
    C: Do not use high beams.
    D: Flash your high beams repeatedly to warn them.
  answer: C
  explanation: At night, do not use high beams when you see an oncoming bicycle rider.
- id: 752
  category: sharing_the_road
  question: Why is it dangerous for a bicyclist to ride against the flow of traffic?
  choices:
    A: It makes the bicyclist travel too fast.
    B: It may cause the bicyclist to miss traffic control devices, such as traffic
      signs and stop lights.
    C: It is illegal for vehicles to pass a bicyclist riding against traffic.
    D: It causes the bicycle's tires to wear out unevenly.
  answer: B
  explanation: Ride on the right side, with the flow of traffic. Riding against traffic
    may cause you to miss traffic control devices, such as traffic signs and stop
    lights.
- id: 753
  category: defensive_driving
  question: Why should a bicyclist never sneak in between a large truck or bus and
    the curb?
  choices:
    A: The truck or bus driver might ask them for directions.
    B: The bicyclist might get a flat tire from debris near the curb.
    C: Trucks and buses make wide right turns, and the bicyclist could get crushed.
    D: The bicyclist will be forced to ride on the sidewalk.
  answer: C
  explanation: Trucks and buses make wide right turns. Never sneak in between a truck
    or bus and the curb or you could get crushed.
- id: 754
  category: sharing_the_road
  question: What is the "No-Zone" in relation to large trucks?
  choices:
    A: A designated parking area for trucks only.
    B: Blind spots in the front, back, and on the sides of the truck where the driver
      cannot see you.
    C: A zone where trucks are not allowed to drive.
    D: The area immediately in front of a truck where bicyclists have the right-of-way.
  answer: B
  explanation: Large trucks have blind spots in the front, back and on the sides,
    which make it difficult for the driver to see around them. These are known as
    the No-Zone.
- id: 755
  category: sharing_the_road
  question: What does a red or orange pennant flag on a bicycle's antennae indicate
    to drivers?
  choices:
    A: The rider is a child.
    B: The rider is carrying hazardous materials.
    C: The rider has impaired hearing.
    D: The rider is a beginner.
  answer: C
  explanation: 'If you see a bicyclist with a red or orange pennant flag on the antennae
    attached to the bike, slow down: this is a common symbol to indicate the rider
    has impaired hearing.'
- id: 756
  category: sharing_the_road
  question: According to research, what causes two-thirds of car-motorcycle collisions?
  choices:
    A: The motorcyclist speeding or driving aggressively.
    B: The driver of the car turning in front of the motorcycle.
    C: Pedestrians crossing the street illegally.
    D: Large trucks changing lanes without signaling.
  answer: B
  explanation: Research shows that two-thirds of car-motorcycle collisions are caused,
    not by the motorcyclist, but by the driver who turned in front of the motorcycle.
- id: 757
  category: sharing_the_road
  question: 'When driving alongside a motorcycle in the same lane, you should:'
  choices:
    A: Share the lane with the motorcycle to improve traffic flow.
    B: Honk your horn to let them know you are passing.
    C: Never try to share a lane with a motorcycle.
    D: Force the motorcycle to the edge of the lane.
  answer: C
  explanation: Motorcycles have the right to the use of the full lane. You must never
    try to share a lane with a motorcycle, and you should always respect the cycle's
    space and position in traffic.
- id: 758
  category: safe_driving_rules
  question: What is the minimum recommended following distance a driver should allow
    when behind a motorcycle?
  choices:
    A: One second
    B: Two seconds
    C: Four seconds
    D: Five seconds
  answer: B
  explanation: Allow at least a two-second following distance, so the motorcycle rider
    has enough time to maneuver or stop in an emergency.
- id: 759
  category: sharing_the_road
  question: Why should you avoid passing a motorcycle too close or too fast?
  choices:
    A: The motorcycle may try to race you.
    B: The blast of air can blow a motorcycle out of control.
    C: The motorcyclist might not hear your engine.
    D: It is illegal to pass a motorcycle on a multi-lane highway.
  answer: B
  explanation: Pass as you would pass a car, and don't pass too close or too fast
    as the blast of air can blow a motorcycle out of control.
- id: 760
  category: defensive_driving
  question: How might a motorcyclist react when crossing a railroad grade crossing?
  choices:
    A: Speed up to cross as quickly as possible.
    B: Stop completely and walk the motorcycle across.
    C: Slow down and possibly zigzag to cross the tracks.
    D: Ride on the shoulder to avoid the tracks entirely.
  answer: C
  explanation: Railroad grade crossings are a particular hazard to cyclists, and will
    usually cause them to slow down and possibly zigzag to cross the tracks.
- id: 761
  category: sharing_the_road
  question: What should a driver expect an experienced motorcyclist to do when riding
    over a metal or grated bridge?
  choices:
    A: Accelerate rapidly to minimize time on the bridge.
    B: Move to the shoulder of the bridge.
    C: Slow down and move to the center of the lane.
    D: Stand up on the foot pegs and weave.
  answer: C
  explanation: Metal or grated bridges cause a cycle to wobble much more than a car.
    An experienced cyclist slows down and moves to the center of the lane to allow
    room for handling the uneven surface.
- id: 762
  category: vehicle_information
  question: What is the most important piece of equipment a motorcyclist can wear
    when riding?
  choices:
    A: Leather gloves
    B: A DOT-approved helmet
    C: Steel-toed boots
    D: A reflective jacket
  answer: B
  explanation: Helmets are the most important piece of equipment you can wear when
    riding your motorcycle. Beware of helmets that do not meet U.S. Department of
    Transportation (DOT) standards.
- id: 763
  category: sharing_the_road
  question: Where are the blind spots, or "No-Zones," located on a large truck?
  choices:
    A: Only directly behind the truck.
    B: Only on the right side of the truck.
    C: In the front, back, and on both sides of the truck.
    D: Only directly in front of the truck.
  answer: C
  explanation: Trucks have large No-Zones on both sides, the front and behind the
    truck. Truck drivers cannot see you when you ride in these blind spots.
- id: 764
  category: safe_driving_rules
  question: When passing a large truck, when is it safe to pull back in front of it?
  choices:
    A: As soon as your rear bumper clears the truck's front bumper.
    B: When you can see the front of the truck in your rear-view mirror.
    C: When the truck driver honks their horn.
    D: When you are exactly one car length ahead of the truck.
  answer: B
  explanation: When passing, look for the front of the truck in your rear-view mirror
    before pulling in front and avoid braking.
- id: 765
  category: driver_responsibility
  question: In crashes involving large trucks and cars, what percentage of fatalities
    are sustained by the occupants of the car?
  choices:
    A: 25 percent
    B: 50 percent
    C: 78 percent
    D: 95 percent
  answer: C
  explanation: In crashes involving large trucks, the occupants of a car, usually
    the driver, sustain 78 percent of fatalities.
- id: 766
  category: defensive_driving
  question: Why is a large truck's front blind spot particularly dangerous for a motorcyclist?
  choices:
    A: Motorcycles accelerate much slower than trucks.
    B: Motorcycles can stop much faster than trucks, and the truck may not be able
      to stop in time.
    C: The truck's headlights will blind the motorcyclist.
    D: The truck's exhaust fumes can overwhelm the motorcyclist.
  answer: B
  explanation: The front blind spot is particularly dangerous if you need to stop
    quickly. Because of their lightweight and braking system, motorcycles can stop
    much faster than trucks. A truck may not be able to stop as quickly as you do.
- id: 767
  category: sharing_the_road
  question: Why do children riding bicycles create special problems for drivers?
  choices:
    A: They are not capable of proper judgment in determining traffic conditions.
    B: They always ride faster than the speed limit.
    C: They are required to ride on the left side of the road.
    D: They use hand signals that are difficult to understand.
  answer: A
  explanation: Children are not capable of proper judgment in determining traffic
    conditions, therefore drivers should be alert to the possibility of erratic movement
    and sudden changes in direction when children on bicycles are present.
- id: 768
  category: sharing_the_road
  question: Why do drivers often fail to see motorcyclists on the road?
  choices:
    A: Motorcycles are painted in colors that blend into the road.
    B: Drivers tend to look for other cars and trucks, and the motorcycle's narrow
      profile makes it harder to see.
    C: Motorcycles are usually driven below the speed limit.
    D: Motorcyclists are not required to use headlights during the day.
  answer: B
  explanation: Drivers tend to look for other cars and trucks, not for motorcycles.
    The profile of a motorcycle is narrow and the body is short, making it harder
    to see and making it harder for a driver to estimate the cycle's distance and
    speed.
- id: 769
  category: defensive_driving
  question: What makes bicyclists especially difficult to see at night?
  choices:
    A: They are not allowed to use reflectors.
    B: They ride exclusively in the middle of the lane at night.
    C: Lights from approaching traffic may make them even harder to see.
    D: They travel much faster at night than during the day.
  answer: C
  explanation: Bicyclists riding at night present visibility problems for drivers...
    Lights from approaching traffic may make them even harder to see at night.
- id: 770
  category: sharing_the_road
  question: According to the manual, how long does it take a truck traveling at 55
    MPH to stop compared to a car?
  choices:
    A: A truck stops in 240 feet, the same as a car.
    B: A truck takes about 300 feet to stop.
    C: A truck takes about 450+ feet to stop.
    D: A truck takes over 600 feet to stop.
  answer: C
  explanation: A car traveling at 55 MPH can stop in 240 feet; however, a truck traveling
    at the same speed of 55 MPH takes about 450+ feet to stop.
- id: 771
  category: sharing_the_road
  question: What is a crucial rule of thumb to remember regarding a large truck's
    blind spots?
  choices:
    A: If you are within 50 feet of the truck, you are in a blind spot.
    B: If you can't see the truck driver in the truck's mirror, the truck driver can't
      see you.
    C: Trucks only have blind spots on their right side.
    D: Honk your horn to ensure the driver knows you are in their blind spot.
  answer: B
  explanation: 'The manual states: "if you can''t see the truck driver in the truck''s
    mirror, the truck driver can''t see you."'
- id: 772
  category: defensive_driving
  question: Why is it dangerous to try to get in between a large truck and the curb
    when the truck is making a turn?
  choices:
    A: The truck may accelerate suddenly and strike your vehicle.
    B: Trucks often swing wide to the left to safely negotiate a right turn, creating
      a dangerous "squeeze" play.
    C: The truck's exhaust is directed toward the curb and can obscure your vision.
    D: It is illegal to pass a truck on the right under any circumstances.
  answer: B
  explanation: Truck drivers sometimes need to swing wide to the left in order to
    safely negotiate a right turn. Cutting in between the truck and the curb increases
    the possibility of a crash by catching you in a "squeeze".
- id: 773
  category: vehicle_information
  question: A typical fully loaded tractor-trailer combination may weigh up to how
    much?
  choices:
    A: 40,000 pounds
    B: 60,000 pounds
    C: 80,000 pounds
    D: 100,000 pounds
  answer: C
  explanation: A typical tractor-trailer combination, a loaded semi-trailer hinged
    and being pulled by a tractor unit, may weigh up to 80,000 pounds or 40 tons.
- id: 774
  category: defensive_driving
  question: What should you do if you are stopped behind a truck on an uphill grade?
  choices:
    A: Stay to the right in your lane and honk your horn.
    B: Stay to the left in your lane so the driver can see you and leave extra space.
    C: Pull up as close to the truck's bumper as possible to prevent rollback.
    D: Shift your vehicle into neutral and apply the parking brake.
  answer: B
  explanation: If you are stopped behind a truck on an uphill grade, stay to the left
    in your lane so the driver can see you. Leave extra space in front of your car
    in case the truck rolls back.
- id: 775
  category: sharing_the_road
  question: What does it mean if a truck driver blinks their vehicle headlights after
    you pass them?
  choices:
    A: They are warning you of a police officer or hazard ahead.
    B: They are signaling that you are cleared to pull back in front of their vehicle.
    C: They are angry that you passed them too closely.
    D: Their headlights are malfunctioning and you should speed up.
  answer: B
  explanation: If the truck or bus driver blinks their vehicle headlights after you
    pass, it's a signal that you are cleared to pull back in front of their vehicle.
- id: 776
  category: vehicle_information
  question: How far to the rear can a large truck's blind spot extend?
  choices:
    A: Up to 50 feet
    B: Up to 100 feet
    C: Up to 150 feet
    D: Up to 200 feet
  answer: D
  explanation: A truck's blind spots are immediate in front, on either side of the
    car and up to 200 feet in the rear.
- id: 777
  category: vehicle_information
  question: If a tractor has a long hood, the trucker may not be able to see the first
    how many feet in front of the bumper?
  choices:
    A: 5-10 feet
    B: 10-20 feet
    C: 20-30 feet
    D: 30-40 feet
  answer: B
  explanation: If the tractor has a long hood, the trucker may not be able to see
    the first 10-20 feet in front of the bumper, plenty of room for a motorcycle or
    car to slip unnoticed into a dangerous position.
- id: 778
  category: sharing_the_road
  question: What should you do when driving near a Commercial Vehicle Weigh Station?
  choices:
    A: Speed up to pass the station as quickly as possible.
    B: Avoid driving in the right lane so slow-moving trucks can easily merge back
      onto the roadway.
    C: Move into the right lane to follow the trucks closely.
    D: Flash your high beams at merging trucks to warn them of your presence.
  answer: B
  explanation: When you are near a Commercial Vehicle Weigh Station, avoid driving
    in the right lane so slow-moving trucks can easily merge back onto the roadway.
- id: 779
  category: safe_driving_rules
  question: Why is it important to dim your headlights at night when driving near
    large trucks?
  choices:
    A: Bright lights can drain your vehicle's battery faster.
    B: Bright lights reflected in the truck's mirrors can blind the driver.
    C: Truck drivers use night-vision goggles that are sensitive to light.
    D: It helps the truck driver see the road lines better.
  answer: B
  explanation: Dim your lights at night. Bright lights reflected in the mirrors can
    blind the driver.
- id: 780
  category: defensive_driving
  question: Why should you never underestimate the speed of an approaching large truck
    or bus?
  choices:
    A: They are always exceeding the posted speed limit.
    B: Because of their large size, they often appear to be traveling more slowly
      than their actual speed.
    C: They have special engines that allow them to accelerate silently.
    D: Their speedometers are often inaccurate by up to 10 MPH.
  answer: B
  explanation: Never underestimate the size and speed of approaching trucks and buses.
    Because of their large size they often appear to be traveling more slowly than
    their actual speed.
- id: 781
  category: driver_responsibility
  question: According to the manual, what is the single most important thing you can
    do to save your life, especially in a crash with a large truck?
  choices:
    A: Swerve into the ditch to avoid the impact.
    B: Wear your safety belt.
    C: Honk your horn continuously before impact.
    D: Brace yourself firmly against the steering wheel.
  answer: B
  explanation: Wearing a safety belt is the single most important thing you can do
    to save your life, especially in a crash with a large truck. It keeps you from
    striking the steering wheel, being thrown around, and being ejected.
- id: 782
  category: sharing_the_road
  question: What should you anticipate when passing a large truck on a downhill grade?
  choices:
    A: The truck will likely lose speed due to engine braking.
    B: The truck will travel faster due to its weight, and you may have to increase
      your speed to pass.
    C: The truck will pull over to the shoulder to let you pass.
    D: The truck driver will apply the emergency brake to maintain a slow speed.
  answer: B
  explanation: Because of their weight, trucks travel faster downhill and you may
    have to increase your speed to pass a truck on a downhill grade.
- id: 783
  category: defensive_driving
  question: Why should you avoid driving directly behind a truck or bus and instead
    keep a reasonable distance?
  choices:
    A: To avoid breathing in harmful exhaust fumes.
    B: To give yourself a better view of the road to anticipate problems and room
      for an emergency "out".
    C: Because drafting behind a commercial vehicle is illegal in Tennessee.
    D: To prevent the truck's tires from throwing rocks at your windshield.
  answer: B
  explanation: Keep a reasonable distance between your vehicle and the large vehicle
    ahead. This gives you a better view of the road to anticipate problems, and you
    will give yourself room for an emergency "out".
- id: 784
  category: sharing_the_road
  question: When passing a truck on a downhill grade, what is the safest course of
    action?
  choices:
    A: Slow down to match the truck's speed before passing.
    B: Complete your pass as quickly as possible and maintain your speed.
    C: Stay alongside the truck to prevent it from speeding up.
    D: Pass the truck and immediately brake to control your speed.
  answer: B
  explanation: Because of their weight, trucks travel faster downhill. You should
    complete your pass as quickly as possible, don't stay alongside the truck, and
    maintain your speed after passing without slowing down.
- id: 785
  category: sharing_the_road
  question: When meeting a truck or bus coming from the opposite direction, how does
    wind turbulence affect the vehicles?
  choices:
    A: It sucks the vehicles together.
    B: It pushes the vehicles apart.
    C: It pulls the smaller vehicle under the truck.
    D: It has no effect on the vehicles.
  answer: B
  explanation: When meeting a truck or bus from the opposite direction, the wind turbulence
    between the vehicles PUSHES vehicles APART; it does NOT suck them together.
- id: 786
  category: sharing_the_road
  question: Why should you avoid moving into the open space on the right side of a
    truck making a right turn?
  choices:
    A: The truck driver is preparing to back up into that space.
    B: The truck may be carrying hazardous materials that could spill.
    C: The truck driver may not see you and your car can be crunched or sideswiped.
    D: The truck will accelerate rapidly through the turn.
  answer: C
  explanation: Trucks make wide right turns and often leave an open space on the right.
    If you are between the truck and the curb, the driver may not be able to see you
    and your car can be crunched or sideswiped by the trailer.
- id: 787
  category: safe_driving_rules
  question: What is the purpose of runaway truck ramps?
  choices:
    A: To provide a rest area for tired commercial drivers.
    B: To allow trucks to safely load and unload cargo.
    C: To stop out-of-control trucks or buses going down steep downgrades.
    D: To weigh trucks before they enter the highway.
  answer: C
  explanation: Runaway truck ramps are designed to stop out-of-control trucks or buses
    going down steep downgrades. Vehicles should never stop or park in these areas.
- id: 788
  category: sharing_the_road
  question: The front 'NO-ZONE' of a large vehicle extends approximately how far directly
    in front of the truck?
  choices:
    A: 10 feet
    B: 20 feet
    C: 50 feet
    D: 100 feet
  answer: B
  explanation: The area approximately up to 20 feet directly in front of a large vehicle
    is considered a NO-ZONE, where cutting in too soon can cause a crash.
- id: 789
  category: sharing_the_road
  question: Children should stay at least how far away from a school bus to remain
    out of the Danger Zone?
  choices:
    A: 5 feet
    B: 10 feet
    C: 15 feet
    D: 20 feet
  answer: B
  explanation: The Danger Zone is the area on all sides of the bus where children
    are in the most danger. Children should stay ten feet away from the school bus
    and NEVER go behind it.
- id: 790
  category: safe_driving_rules
  question: According to the manual, when are children at the greatest risk of being
    hurt regarding school buses?
  choices:
    A: While riding inside the bus on the highway.
    B: When the bus is involved in a rear-end collision.
    C: Outside the bus when they are getting on or off.
    D: When sitting in the front row of the bus.
  answer: C
  explanation: The reality of school bus safety is that more children are hurt outside
    a bus than inside one. Children are at greatest risk when they are getting on
    or off the school bus.
- id: 791
  category: signs_and_signals
  question: What does the 'slow moving vehicle' emblem look like?
  choices:
    A: A yellow diamond-shaped sign with black lettering.
    B: A fluorescent or reflective orange triangle.
    C: A red octagon with a white border.
    D: A white rectangle with a black tractor symbol.
  answer: B
  explanation: The 'slow moving vehicle' emblem is a fluorescent or reflective orange
    triangle that must be displayed on the rear of vehicles drawn by animals, and
    most farm vehicles and construction equipment.
- id: 792
  category: sharing_the_road
  question: Because farm machinery usually does not have turn signals, how might an
    operator prepare to make a right turn?
  choices:
    A: By flashing their headlights three times.
    B: By pulling wide to the left first, then turning right.
    C: By stopping completely and waving traffic around.
    D: By driving on the right shoulder before turning.
  answer: B
  explanation: Farm machinery usually does not have turn signals and to make a right
    turn, operators of farm machinery may first pull wide to the left, then turn to
    the right.
- id: 793
  category: sharing_the_road
  question: Which of the following is true about animal-drawn vehicles on Tennessee
    roadways?
  choices:
    A: They are only allowed on unpaved rural roads.
    B: They must yield the right-of-way to all motor vehicles.
    C: They have the same rights to use the road as a motor vehicle.
    D: They are not required to follow standard rules of the road.
  answer: C
  explanation: Animal-drawn vehicles have the same rights to use the road as a motor
    vehicle and must follow the same rules of the road.
- id: 794
  category: defensive_driving
  question: If you are following a truck down a steep hill and notice smoking wheels
    or high speed, what should you do?
  choices:
    A: Speed up and pass the truck immediately.
    B: Honk your horn to alert the driver.
    C: Fall back and DO NOT pass.
    D: Pull over to the left shoulder and stop.
  answer: C
  explanation: Smoking wheels or a high speed can be a sign of brake loss on a heavy
    vehicle. If you encounter this situation, fall back and DO NOT pass.
- id: 795
  category: sharing_the_road
  question: Why should you avoid driving too close to trucks transporting hazardous
    materials?
  choices:
    A: They make frequent stops, such as at railroad crossings.
    B: They travel much faster than standard commercial trucks.
    C: They create more wind turbulence than other trucks.
    D: They are not equipped with standard brake lights.
  answer: A
  explanation: Don't drive too close to trucks that are transporting hazardous materials,
    since they make frequent stops, such as railroad crossings.
- id: 796
  category: sharing_the_road
  question: What should you do when a truck or bus is passing you?
  choices:
    A: Speed up to get out of the truck's blind spot.
    B: Move to the center of your lane and maintain speed.
    C: Keep to the far side of your lane and reduce your speed slightly.
    D: Flash your high beams to warn the truck driver.
  answer: C
  explanation: When a truck passes you, you can help the driver by keeping to the
    far side of your lane and reducing your speed slightly. NEVER SPEED UP AS A TRUCK
    OR BUS IS PASSING.
- id: 797
  category: safe_driving_rules
  question: 'In many school systems, children are taught to escape the school bus
    danger zone by taking:'
  choices:
    A: Three small steps away from the bus.
    B: Five giant steps as soon as they exit the bus.
    C: Ten normal steps toward the rear of the bus.
    D: Two giant steps toward the front of the bus.
  answer: B
  explanation: In many school systems, children are taught to escape the danger zone
    by taking five giant steps as soon as they exit the bus.
- id: 798
  category: sharing_the_road
  question: 'In most cases, large farm machinery on rural highways will be traveling
    at speeds less than:'
  choices:
    A: 15 M.P.H.
    B: 25 M.P.H.
    C: 35 M.P.H.
    D: 45 M.P.H.
  answer: B
  explanation: In most cases, farm machinery vehicles will be traveling at less than
    25 M.P.H.
- id: 799
  category: sharing_the_road
  question: What should you avoid doing when approaching or passing a horseback rider?
  choices:
    A: Slowing down
    B: Sounding your horn or revving your engine
    C: Leaving a reasonable distance
    D: Passing on the left
  answer: B
  explanation: The manual states, 'Do NOT sound your horn or "rev" your engine loudly
    when approaching or passing a horse.'
- id: 800
  category: vehicle_information
  question: What is the normal speed range for slow-moving vehicles?
  choices:
    A: 15 to 30 mph
    B: 5 to 20 mph
    C: 10 to 25 mph
    D: 20 to 40 mph
  answer: B
  explanation: According to the manual, 'Normal speeds for slow-moving vehicles may
    range from 5 to 20 mph.'
- id: 801
  category: safe_driving_rules
  question: When lights are required on slow-moving vehicles, how far to the rear
    is the self-luminous red lamp normally visible?
  choices:
    A: 100 feet
    B: 250 feet
    C: 500 feet
    D: 1000 feet
  answer: C
  explanation: The manual states that a self-luminous red lamp on the rear of a slow-moving
    vehicle is normally visible for 500 feet to the rear.
- id: 802
  category: safe_driving_rules
  question: Which lane should slower traffic use?
  choices:
    A: The left-hand lane
    B: The center lane
    C: The right-hand lane
    D: Any lane as long as they maintain a constant speed
  answer: C
  explanation: The manual dictates, 'Slower traffic must drive in the right-hand lane.
    The left lane is for passing and turning.'
- id: 803
  category: signs_and_signals
  question: What color background do all temporary signs in work zones have?
  choices:
    A: Yellow
    B: Red
    C: Orange
    D: White
  answer: C
  explanation: The manual states, 'All temporary signs in work zones have an orange
    background and black letters or symbols.'
- id: 804
  category: penalties_and_points
  question: What is the maximum fine for a speed violation in a work zone where the
    speed has been reduced and workers are present?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1000
  answer: C
  explanation: Under Tennessee law, speed violations in work zones with reduced speeds
    and workers present will result in a fine up to a maximum of $500.
- id: 805
  category: defensive_driving
  question: How far does a car traveling at 60 M.P.H. travel in one second?
  choices:
    A: 44 feet
    B: 60 feet
    C: 88 feet
    D: 120 feet
  answer: C
  explanation: The manual notes, 'A car traveling 60 M.P.H. travels 88 feet per second.'
- id: 806
  category: defensive_driving
  question: What is the most common type of accident in a work zone?
  choices:
    A: Head-on collisions
    B: Rear-end collisions
    C: Sideswipes
    D: Rollovers
  answer: B
  explanation: The manual warns drivers not to tailgate because 'Most work zone accidents
    are caused by rear-end collisions.'
- id: 807
  category: sharing_the_road
  question: How long does it take for a train traveling at 55 miles per hour to stop?
  choices:
    A: A quarter of a mile
    B: Half a mile
    C: A full mile
    D: Two miles
  answer: C
  explanation: According to the manual, 'A train traveling at 55 miles per hour takes
    a full mile to stop.'
- id: 808
  category: defensive_driving
  question: How much more likely are you to die in a collision with a train compared
    to a collision with a car?
  choices:
    A: 5 times more likely
    B: 10 times more likely
    C: 20 times more likely
    D: 30 times more likely
  answer: D
  explanation: The manual states, 'You are 30 times more likely to die in a collision
    with a train than with a car or even a large truck or bus.'
- id: 809
  category: sharing_the_road
  question: Where do most train collisions with cars occur?
  choices:
    A: Within 25 miles of the driver's home
    B: On rural, unmarked dirt roads
    C: At night in poorly lit areas
    D: More than 100 miles from the driver's home
  answer: A
  explanation: The manual explains that 'Most of the collisions occur within 25 miles
    of the driver’s home, suggesting that drivers KNEW the tracks were there...'
- id: 810
  category: sharing_the_road
  question: Who has the right-of-way when a car and a train are approaching a crossing?
  choices:
    A: The vehicle that arrives first
    B: The train ALWAYS has the right-of-way
    C: The car, if it is traveling at highway speeds
    D: The train, but only if warning lights are flashing
  answer: B
  explanation: The manual explicitly states, 'Drivers must ALWAYS yield the right
    of way to trains because IT’S THE LAW.'
- id: 811
  category: sharing_the_road
  question: What color apparel will workers normally wear in a work zone to ensure
    they are highly visible?
  choices:
    A: Bright orange
    B: Bright yellow-green
    C: Reflective white
    D: Neon pink
  answer: B
  explanation: The manual states, 'In these work zones, workers will normally be wearing
    bright yellow-green apparel such as shirts, vests or hardhats to ensure they are
    highly visible.'
- id: 812
  category: sharing_the_road
  question: How should horseback riders position themselves when riding on the road?
  choices:
    A: Two abreast in the right lane
    B: Single file near the right curb or road edge
    C: Single file near the center line
    D: On the left shoulder facing traffic
  answer: B
  explanation: The manual requires that horseback riders 'must ride single file near
    the right curb or road edge, or on a usable right shoulder, lane or path.'
- id: 813
  category: safe_driving_rules
  question: When approaching a railroad crossing equipped with electric or mechanical
    signal devices, where must you bring your vehicle to a complete stop?
  choices:
    A: Within 100 feet, but no closer than 25 feet from the nearest rail.
    B: Within 50 feet, but no closer than 15 feet from the nearest rail.
    C: Within 30 feet, but no closer than 10 feet from the nearest rail.
    D: Exactly 20 feet from the nearest rail.
  answer: B
  explanation: The manual states that railroad crossings equipped with electric or
    mechanical signal devices require the operator to bring the vehicle to a complete
    stop within 50 feet, and no closer than 15 feet from the nearest rail.
- id: 814
  category: defensive_driving
  question: If your vehicle stalls on railroad tracks and a train is approaching,
    in which direction should you run after exiting the vehicle?
  choices:
    A: In the same direction the train is traveling.
    B: Directly away from the tracks at a 90-degree angle.
    C: Toward the train at a 45-degree angle.
    D: Parallel to the tracks in the opposite direction of the train.
  answer: C
  explanation: According to the manual, if a train is approaching, you should run
    toward the train at a 45-degree angle to be away from and behind the point of
    impact.
- id: 815
  category: defensive_driving
  question: Why should you run toward an approaching train at a 45-degree angle if
    your vehicle stalls on the tracks?
  choices:
    A: To signal the train engineer to stop.
    B: To get a better view of the train's speed.
    C: To reach the Emergency Notification System sign faster.
    D: To be away from and behind the point of impact to prevent injury from flying
      debris.
  answer: D
  explanation: The manual explains that running toward the train at a 45-degree angle
    allows you to be away from and behind the point of impact, preventing injury from
    flying debris.
- id: 816
  category: safe_driving_rules
  question: What should you do if you are already crossing railroad tracks and the
    warning lights begin flashing or the gates start coming down?
  choices:
    A: Stop immediately and back up.
    B: Keep moving and finish driving through the crossing.
    C: Stop your vehicle on the tracks and exit immediately.
    D: Put your vehicle in reverse and carefully back off the tracks.
  answer: B
  explanation: 'The manual explicitly states: "If you are crossing the tracks and
    the warning lights begin flashing or the gates start coming down, don’t stop.
    KEEP MOVING!"'
- id: 817
  category: sharing_the_road
  question: Which of the following vehicles are required to stop at all railroad crossings
    whether signals are activated or not?
  choices:
    A: Motorcycles and mopeds.
    B: 15-passenger vans and recreational vehicles.
    C: School buses, passenger buses, and trucks carrying hazardous materials.
    D: Tow trucks and emergency vehicles.
  answer: C
  explanation: The manual notes that School Buses, Passenger Buses, and Trucks carrying
    hazardous materials must stop at all crossings whether signals are activated or
    not.
- id: 818
  category: signs_and_signals
  question: What information is provided on the blue Emergency Notification System
    (ENS) sign at a railroad crossing?
  choices:
    A: The train schedule and expected arrival times.
    B: The speed limit for trains passing through the crossing.
    C: An emergency contact number and the DOT crossing number.
    D: The distance to the next highway intersection.
  answer: C
  explanation: The manual states that the ENS sign provides an emergency number to
    call and the DOT crossing number to identify your location if your vehicle stalls
    on the tracks.
- id: 819
  category: license_system
  question: What type of special endorsement or license is required to operate a 15-passenger
    van in the State of Tennessee?
  choices:
    A: A Commercial Driver License (CDL).
    B: A Class D license with a passenger endorsement.
    C: A chauffeur's license.
    D: No special endorsements or licenses are needed.
  answer: D
  explanation: 'The manual states: "There are no special endorsements or licenses
    needed to operate a 15-passenger van in the State of Tennessee."'
- id: 820
  category: vehicle_information
  question: When loading a 15-passenger van, why should passengers sit as far toward
    the front of the vehicle as possible?
  choices:
    A: To allow the driver to hear them better.
    B: Because the rear seat is behind the rear axle, which pushes the center of gravity
      further back.
    C: To leave the rear seats open for heavy cargo and luggage.
    D: Because the front seats are equipped with better airbags.
  answer: B
  explanation: The manual advises having passengers sit towards the front because
    the rear seat is located behind the rear axle, causing uneven weight distribution
    and pushing the center of gravity further back.
- id: 821
  category: vehicle_information
  question: In a 15-passenger van, under-inflation of the rear tires is a major cause
    of what dangerous issue?
  choices:
    A: Engine overheating.
    B: Brake failure.
    C: Tread separation.
    D: Transmission slipping.
  answer: C
  explanation: According to the manual, under-inflation of the rear tires (especially
    the left rear) is a major cause of tread separation in 15-passenger vans.
- id: 822
  category: vehicle_information
  question: How should weight be distributed in a Recreational Vehicle (RV) to provide
    better handling and maintain a proper center of gravity?
  choices:
    A: Closer to the roof and mostly on the right side.
    B: Closer to the ground and equal on both sides.
    C: Entirely in the rear of the vehicle.
    D: Mostly in the front near the driver's seat.
  answer: B
  explanation: The manual states that distributing the weight closer to the ground
    and equal on both sides keeps the center of gravity low and will provide better
    handling of your RV.
- id: 823
  category: sharing_the_road
  question: Which of the following is true regarding the blind spots, or "No-Zones,"
    of a Recreational Vehicle (RV)?
  choices:
    A: RVs do not have blind spots if the mirrors are adjusted correctly.
    B: RV mirrors allow the driver to see everything on the road.
    C: RVs have large blind spots, and mirrors do not allow the driver to see everything.
    D: Only the right side of an RV has a blind spot.
  answer: C
  explanation: The manual warns that RVs are large and have many blind spots, and
    while mirrors are important, they do not allow the driver to see everything on
    the road.
- id: 824
  category: defensive_driving
  question: If the tires of a 15-passenger van drop off the roadway, what is the safest
    way to recover and avoid a rollover?
  choices:
    A: Brake hard and jerk the steering wheel back toward the road.
    B: Accelerate to regain traction before steering back.
    C: Gradually slow down and steer back onto the roadway when it is safe to do so.
    D: Shift into neutral and coast until the van stops completely.
  answer: C
  explanation: The manual advises that if the van’s tires drop off the roadway, you
    should gradually slow down and steer back on to the roadway when it is safe to
    do so to avoid a rollover.
- id: 825
  category: safe_driving_rules
  question: When waiting at a railroad crossing with lowered gates, when is it legal
    and safe to cross the tracks?
  choices:
    A: As soon as the train has passed, even if the gates are still down.
    B: When the gates begin to rise and the train is out of sight.
    C: Only after the gates are fully raised and the lights have stopped flashing.
    D: Whenever you can clearly see that no other train is coming.
  answer: C
  explanation: 'The manual states: "Don’t cross the tracks until the gates are fully
    raised and the lights have stopped flashing."'
- id: 826
  category: defensive_driving
  question: When waiting for a train to pass at a railroad crossing with more than
    one track, what should you do before crossing?
  choices:
    A: Proceed immediately after the first train clears the crossing.
    B: Make sure another train is not approaching from the opposite direction.
    C: Follow the vehicle in front of you closely to get across quickly.
    D: Honk your horn to alert any oncoming trains.
  answer: B
  explanation: The manual warns that where there is more than one track, a driver
    waiting for one train to pass must make sure another train is not approaching
    from the opposite direction before crossing.
- id: 827
  category: vehicle_information
  question: Why must drivers of Recreational Vehicles (RVs) leave more room between
    their vehicle and the vehicle in front of them?
  choices:
    A: Because RVs are heavier than cars and require a longer stopping distance.
    B: Because RVs have a shorter stopping distance and might rear-end other vehicles.
    C: Because RVs are wider and need more room to change lanes.
    D: Because it is illegal for an RV to follow a passenger car closely.
  answer: A
  explanation: The manual states that RVs are similar to trucks in that they are heavier
    than cars, and require a longer stopping distance, so drivers must always keep
    enough room between their RV and the vehicle in front.
- id: 828
  category: safe_driving_rules
  question: What is the rule regarding safety belts for passengers in a Recreational
    Vehicle (RV)?
  choices:
    A: Only the driver and front passenger must wear them.
    B: Passengers only need to wear them when traveling on interstates.
    C: All passengers must wear safety belts whenever the vehicle is in motion.
    D: Safety belts are optional if the RV is traveling under 30 mph.
  answer: C
  explanation: Make sure all passengers in your RV wear safety belts whenever the
    vehicle is in motion. Passengers who are not buckled in may be thrown around and
    seriously injured in an accident or sudden stop.
- id: 829
  category: license_system
  question: In Tennessee, how long must a person under the age of 18 hold a learner
    permit before they can be road tested?
  choices:
    A: 90 days
    B: 180 days
    C: 6 months
    D: 1 year
  answer: B
  explanation: People under the age of eighteen (18) must have a learner permit for
    180 days and qualify under the GDL program before they can be road tested.
- id: 830
  category: driver_responsibility
  question: According to the manual, what is the biggest contribution a parent or
    mentor can make to a new driver's safety behind the wheel?
  choices:
    A: Purchasing a vehicle with advanced safety features.
    B: The examples they set through patience, courtesy, and safe driving habits.
    C: Enrolling the teen in an advanced defensive driving course.
    D: Making them drive exclusively during daylight hours.
  answer: B
  explanation: Your biggest contribution to your new driver’s safety and effectiveness
    behind the wheel will be the examples you set. Patience, courtesy, and a willingness
    to improve will be your best assets.
- id: 831
  category: defensive_driving
  question: Which of the following is a recommended technique for teaching a new driver
    while you are driving?
  choices:
    A: Overload them with as much information as possible.
    B: Talk out loud about the driving decisions you are making.
    C: Play loud music to test their concentration.
    D: Remain completely silent so they can watch you without distraction.
  answer: B
  explanation: A helpful thing you can do is to talk out loud while you are driving.
    Take advantage of teaching opportunities while you are behind the wheel, such
    as explaining out loud the steps you are taking to gauge your following distance.
- id: 832
  category: driver_testing
  question: Why is random driving around during practice sessions discouraged?
  choices:
    A: It wastes too much fuel.
    B: It can be dangerous for a novice driver to get into trouble in the early stages.
    C: It does not count toward the required GDL driving hours.
    D: It causes unnecessary wear and tear on the vehicle.
  answer: B
  explanation: Random driving around during practice sessions can be dangerous. It
    is all too easy for the novice driver to get into trouble particularly in the
    early stages.
- id: 833
  category: driver_testing
  question: Where is the ideal location for a new driver's initial "Phase One" practice
    sessions?
  choices:
    A: A quiet residential area
    B: A high-speed multi-lane highway
    C: A large deserted parking lot
    D: A busy city intersection
  answer: C
  explanation: A large deserted parking lot is ideal for these initial sessions because
    it allows the beginner to concentrate fully on the feel of the controls and the
    response of the car.
- id: 834
  category: driver_testing
  question: During "Phase Two" of practice driving in a quiet residential area, which
    new skill should be introduced?
  choices:
    A: Parallel parking
    B: Keeping proper lane position and allowing safe (2-second) following distances
    C: U-turns and quick stops
    D: Driving in bad weather conditions
  answer: B
  explanation: Phase Two involves taking the driver to a quiet residential area to
    practice pulling into traffic, keeping proper lane position, allowing safe (2-second)
    following distances, and easy lane changes.
- id: 835
  category: driver_testing
  question: At what phase of practice driving should a new driver begin learning to
    parallel park and navigate multiple turn lane intersections?
  choices:
    A: Phase One
    B: Phase Two
    C: Phase Three
    D: Phase Four
  answer: C
  explanation: Phase Three introduces heavier traffic, parallel parking, up/down hill
    parking, multiple turn lane intersections, and U-turns/quick stops.
- id: 836
  category: driver_testing
  question: Which of the following conditions is introduced in Phase Four of practice
    driving?
  choices:
    A: Adjusting the seat and mirrors
    B: Backing and pulling the car forward
    C: Easy lane changes
    D: Driving at night in good and bad weather
  answer: D
  explanation: Phase Four involves guiding the new driver to practice in conditions
    such as high-speed multi-lane highways, various weather conditions, at night,
    and in city driving or heavy traffic areas.
- id: 837
  category: driver_responsibility
  question: When a new driver makes a major mistake during a practice session, what
    is the recommended approach?
  choices:
    A: Yell at them immediately so they understand the severity of the mistake.
    B: Stop as soon as you can and discuss what happened while it is still fresh in
      their memory.
    C: Ignore it completely to avoid eroding their confidence.
    D: Wait until the next day to bring it up in a formal setting.
  answer: B
  explanation: 'Stop and Discuss: Stop as soon as you can, while a major mistake is
    still fresh in the new driver’s memory. Then take time to discuss what happened
    and what the safest response should be.'
- id: 838
  category: license_system
  question: Under Tennessee's Graduated Driver License (GDL) program, how many hours
    of driving must minors complete prior to being eligible for an Intermediate license?
  choices:
    A: 30 hours
    B: 40 hours
    C: 50 hours
    D: 60 hours
  answer: C
  explanation: Tennessee’s GDL program requires a specific number of hours (50) be
    driven by minors prior to being eligible to move up to the Intermediate license
    level.
- id: 839
  category: safe_driving_rules
  question: According to the manual, what proportion of 16-year-old male drivers will
    have a crash during their first year of driving?
  choices:
    A: One in three
    B: One in five
    C: One in ten
    D: One in twenty
  answer: B
  explanation: Inexperience combined with a lack of skill means that one in five male
    16-year old drivers and about one in ten female 16-year olds will have a crash
    during their first year of driving.
- id: 840
  category: defensive_driving
  question: Some of the worst accidents for young, new drivers occur under which of
    the following conditions?
  choices:
    A: During the morning commute to school
    B: At night and with a group of young people in the car
    C: While driving alone on a deserted parking lot
    D: During supervised practice sessions with a parent
  answer: B
  explanation: Some of the worst accidents occur at night and with a group of young
    people in the car. This is one of the reasons that Tennessee’s GDL program places
    restrictions on these two areas for new teen drivers.
- id: 841
  category: driver_responsibility
  question: Why is it important to use the same terms consistently (e.g., always saying
    "gas pedal" instead of switching to "accelerator") when teaching a new driver?
  choices:
    A: It helps the driver pass the written knowledge test.
    B: It ensures clear communication and avoids confusing the beginner.
    C: It is a legal requirement under the GDL program.
    D: It prevents the vehicle from stalling.
  answer: B
  explanation: 'Communicate Clearly: Give directions well in advance and try to always
    use the same terms (don’t say accelerator one time and gas pedal the next, for
    example) to avoid confusing the new driver.'
- id: 842
  category: driver_responsibility
  question: When a teen is applying for an Intermediate Driver License, which of the
    following is a suggested topic to cover in a parent-teen driving agreement?
  choices:
    A: The route the driving examiner will take
    B: Responsibility for parking tickets or vehicle damage
    C: How to bypass the road skills test
    D: The exact date the teen will get a full license
  answer: B
  explanation: The manual suggests that areas to consider covering in a parent-teen
    agreement include responsibility for parking tickets or vehicle damage, among
    other topics like driving hours and maintenance.
- id: 843
  category: safe_driving_rules
  question: According to the manual, what is considered the novice driver's biggest
    enemy?
  choices:
    A: Driving at night
    B: The complacency that comes from early success at learning driving basics
    C: Heavy traffic on interstate highways
    D: Strict driving examiners
  answer: B
  explanation: The manual states, "The novice driver’s biggest enemy is the complacency
    that comes from early success at learning driving basics."
- id: 844
  category: driver_testing
  question: What is required of non-English speaking applicants before a road test
    can be administered?
  choices:
    A: They must be fluent in written English
    B: They must bring a certified translator in the car
    C: They must understand and speak enough English to safely communicate with the
      examiner
    D: They must take the test in their native language
  answer: C
  explanation: The manual explicitly states that all applicants must understand and
    speak enough English to safely communicate with the examiner before a road test
    can be administered.
- id: 845
  category: driver_testing
  question: Approximately how much time does a driver license examiner spend driving
    with an applicant during the examination?
  choices:
    A: Less than 30 minutes
    B: Exactly one hour
    C: At least 45 minutes
    D: Over two hours
  answer: A
  explanation: The manual reminds parents that "a driver license examiner spends less
    than 30 minutes driving with your child."
- id: 846
  category: driver_responsibility
  question: What does the manual strongly suggest parents do after their teen has
    been issued a driver license?
  choices:
    A: Stop riding in the vehicle with them
    B: Continue to monitor their teen's driving performance
    C: Allow the teen to drive anywhere without restrictions
    D: Let the teen pay for all vehicle maintenance immediately
  answer: B
  explanation: The manual advises that "it is wise to continue to monitor your teen’s
    driving performance even after they have been issued a driver license."
- id: 847
  category: defensive_driving
  question: 'According to the manual, being a good defensive driver means:'
  choices:
    A: Only driving during daylight hours
    B: Relying solely on your driving experience
    C: More than just being cautious; it requires working at developing good driving
      techniques
    D: Driving below the speed limit at all times
  answer: C
  explanation: The text states, "Being a good defensive driver means more than just
    being cautious; and mere experience isn’t enough either! The good defensive driver
    has to work at developing good driving techniques."
- id: 848
  category: license_system
  question: According to the manual's overview, which of the following information
    is found in Section A?
  choices:
    A: Defensive driving tips
    B: Traffic signs and signals
    C: What documents are needed to apply for a license
    D: State driving laws and penalties
  answer: C
  explanation: The manual outlines that Section A covers different types of licenses,
    what documents are needed to apply, information for applicants under age 18, and
    descriptions of required tests.
- id: 849
  category: signs_and_signals
  question: Which section of the comprehensive manual covers traffic signs, signals,
    and rules of the road?
  choices:
    A: Section A
    B: Section B
    C: Section C
    D: The Appendix
  answer: B
  explanation: The manual's table of contents indicates that Section B contains Good
    Driving Practices, Rules of the Road, Traffic Signs and Signals, and State Driving
    Laws and Penalties.
- id: 850
  category: sharing_the_road
  question: Where in the manual can you find information on sharing the road safely
    and helping teens learn to drive?
  choices:
    A: Section A
    B: Section B
    C: Section C
    D: The Glossary
  answer: C
  explanation: Section C of the manual covers Safety Tips, Defensive Driving, Sharing
    the Road Safely, and Helping Teens and New Drivers Learn to Drive.
- id: 851
  category: driver_testing
  question: 'When helping a non-English speaking beginner learn to drive, mentors
    should put themselves in the role of an examiner and let the driver practice:'
  choices:
    A: Following simple instructions in English
    B: Translating the entire driver's manual
    C: Driving without any verbal communication
    D: Memorizing the examiner's route
  answer: A
  explanation: 'The manual advises mentors to "put yourself in the role of an examiner,
    and let the driver practice following simple instructions in English (for example:
    ''Turn left''; ''Slow down'')."'
- id: 852
  category: license_system
  question: When will Driver Service Centers typically have an increased volume of
    customers?
  choices:
    A: Early in the morning on Tuesdays
    B: When they reopen after being closed for a holiday
    C: During the last week of the month
    D: When it is raining
  answer: B
  explanation: The manual notes, "Our Driver Service Centers will typically have an
    increased volume of customers when we reopen after being closed for a holiday,
    so please plan your visit accordingly."
- id: 853
  category: license_system
  question: How can you check your eligibility to renew your Tennessee Driver License
    online?
  choices:
    A: By visiting www.tn.gov/safety
    B: By mailing a letter to the examiner
    C: By taking a new road test
    D: By visiting a local police station
  answer: A
  explanation: 'The manual states, "You may also wish to consider using our website
    at: www.tn.gov/safety to check your eligibility to renew online."'
- id: 854
  category: safe_driving_rules
  question: 'According to the manual, safe driving is very much a matter of:'
  choices:
    A: Having the newest vehicle safety features
    B: Seeing what needs to be seen and making good decisions
    C: Memorizing all state highways
    D: Driving only in familiar areas
  answer: B
  explanation: The text explains that "Safe driving is very much a matter of seeing
    what needs to be seen and making good decisions, but this is not simple to achieve."
- id: 855
  category: driver_responsibility
  question: 'When creating a driving agreement or ''contract'' with a teen, parents:'
  choices:
    A: Must submit a notarized copy to the Driver Service Center
    B: Must have it signed by a driving instructor
    C: Can choose whether to have it written and signed or just discussed as a family
    D: Are required by law to keep it in the vehicle at all times
  answer: C
  explanation: The manual states, "It is up to you whether you would want to have
    this 'contract' written and signed, or just discussed as a family..."
- id: 856
  category: driver_responsibility
  question: 'While a driver license examiner can evaluate a driver''s competence,
    the responsibility of education and teaching a child to drive rests with:'
  choices:
    A: The Department of Safety
    B: The high school driver education teacher
    C: The parents or concerned mentor
    D: The state legislature
  answer: C
  explanation: The manual emphasizes that "The driver license examiner can evaluate
    a driver’s competence, but the responsibility of education and teaching that child
    to drive rests with the parents or concerned mentor."
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 857
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 858
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 859
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 860
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 861
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 862
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 863
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 864
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 865
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 866
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 867
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 868
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 869
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 870
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
    A: A roundabout ahead
    B: A hospital zone
    C: A railroad crossing ahead
    D: A no-passing zone
  answer: C
  explanation: A circular yellow sign with a black X and two R's is the advance warning
    sign for a railroad crossing ahead. Slow down, look, and listen for trains.
  id: 871
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 872
- image: curve_right.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign indicate?
  choices:
    A: Road ends ahead
    B: Right turn required
    C: A curve to the right ahead
    D: Detour ahead
  answer: C
  explanation: A yellow diamond-shaped sign with a curved arrow warns of a curve in
    the road ahead. Slow down before entering the curve.
  id: 873
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 874
- image: reverse_curve.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: A winding road
    B: A single curve ahead
    C: A series of two curves in opposite directions
    D: A roundabout ahead
  answer: C
  explanation: A reverse curve sign warns of two curves in opposite directions ahead.
    Slow down and be prepared for the road to curve first one way, then the other.
  id: 875
- image: winding_road.png
  category: signs_and_signals
  question: What does this sign warn you to expect?
  choices:
    A: A single sharp curve
    B: A slippery road surface
    C: A series of curves or turns ahead
    D: A hill ahead
  answer: C
  explanation: A winding road sign warns of a series of curves or turns ahead. Reduce
    your speed and be alert for changing road conditions.
  id: 876
- image: merge.png
  category: signs_and_signals
  question: What does this sign tell you to prepare for?
  choices:
    A: A lane ending
    B: Traffic merging from another road
    C: A divided highway beginning
    D: A road narrowing to one lane
  answer: B
  explanation: A yellow diamond-shaped merge sign warns that traffic from another
    road will be merging into your lane. Be prepared to adjust your speed and position.
  id: 877
- image: road_narrows.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: Bridge ahead
    B: Road narrows ahead
    C: Lane ends
    D: Divided highway ends
  answer: B
  explanation: This warning sign indicates the road ahead becomes narrower. Be prepared
    for reduced road width and adjust your lane position.
  id: 878
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 879
- image: divided_highway_ends.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: The divided highway ends and two-way traffic resumes
    C: A merge area ahead
    D: Road construction ahead
  answer: B
  explanation: This sign warns that the divided highway is ending. Opposing traffic
    will no longer be separated by a median. Be prepared for two-way traffic.
  id: 880
- image: two_way_traffic.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A divided highway begins
    B: A passing zone ahead
    C: Two-way traffic ahead — traffic moves in both directions
    D: A lane shift ahead
  answer: C
  explanation: This sign warns of two-way traffic ahead. You may be leaving a one-way
    road or divided highway and will encounter vehicles traveling in the opposite
    direction.
  id: 881
- image: slippery_when_wet.png
  category: signs_and_signals
  question: What road condition does this sign warn about?
  choices:
    A: Icy road conditions
    B: The road may be slippery when wet
    C: Winding road ahead
    D: Uneven pavement
  answer: B
  explanation: A slippery when wet sign warns that the road surface may become very
    slippery during rain or wet conditions. Reduce your speed and avoid sudden braking
    or turning.
  id: 882
- image: hill.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A bump in the road
    B: An uneven road surface
    C: A steep hill or grade ahead
    D: Road construction
  answer: C
  explanation: This sign warns of a steep hill or grade ahead. You may need to adjust
    your speed and shift to a lower gear, especially in trucks or when towing.
  id: 883
- image: signal_ahead.png
  category: signs_and_signals
  question: What does this sign warn you to prepare for?
  choices:
    A: A stop sign ahead
    B: A traffic signal ahead
    C: A school crossing
    D: A police checkpoint
  answer: B
  explanation: This sign warns of a traffic signal ahead. Be prepared to stop if the
    light is red or yellow. This sign is often placed where the signal may not be
    visible from a distance.
  id: 884
- image: stop_ahead.png
  category: signs_and_signals
  question: What does this sign tell you to expect ahead?
  choices:
    A: A yield sign
    B: A traffic signal
    C: A stop sign where you must stop
    D: A speed bump
  answer: C
  explanation: This sign warns that there is a stop sign ahead. Begin slowing down
    and prepare to come to a complete stop at the stop sign.
  id: 885
- image: cross_road.png
  category: signs_and_signals
  question: What does this sign warn about?
  choices:
    A: A railroad crossing ahead
    B: A crossroad or intersection ahead
    C: A hospital ahead
    D: A pedestrian crossing
  answer: B
  explanation: This sign warns that a crossroad or 4-way intersection is ahead. Watch
    for traffic entering from side roads.
  id: 886
- image: side_road.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: A T-intersection ahead
    B: A side road entering from the right
    C: A curve in the road
    D: A dead end
  answer: B
  explanation: This sign warns of a side road entering from the right. Watch for vehicles
    entering the highway from the side road.
  id: 887
- image: added_lane.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
