- id: 121
  category: penalties_and_points
  question: If you are caught driving without your driver license in your possession,
    what is the potential fine?
  choices:
    A: Not less than $2.00 and no more than $50.00
    B: Not less than $50.00 and no more than $100.00
    C: Exactly $500.00
    D: Up to $1,000.00
