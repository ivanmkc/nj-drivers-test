  explanation: The manual states that operators of any road machinery, farm tractor,
    or other farm equipment which is temporarily operated or moved on a highway are
    not required to have a Tennessee driver license.
- id: 120
  category: license_system
  question: Who among the following is NOT eligible for a Tennessee driver license?
  choices:
    A: A 16-year-old making satisfactory progress in school
    B: A person under 18 who has dropped out of school before graduating
    C: A non-resident with a valid out-of-state license
    D: An honorably discharged veteran
