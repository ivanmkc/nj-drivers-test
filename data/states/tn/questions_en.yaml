  explanation: Driving while revoked, canceled, or suspended is a class B misdemeanor.
    The penalty is a fine up to one-thousand dollars ($1,000) and/or six months in
    jail.
- id: 117
  category: license_system
  question: What is the fee required to add a For-Hire endorsement to a Class D license?
  choices:
    A: $2.50
    B: $4.50
    C: $10.00
    D: $15.50
  answer: B
  explanation: To add the For-Hire endorsement, drivers must meet the eligibility
    requirements, pass the appropriate tests, and pay a fee of $4.50.
- id: 118
  category: license_system
