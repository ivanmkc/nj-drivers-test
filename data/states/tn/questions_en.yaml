  choices:
    A: '21'
    B: '50'
    C: '60'
    D: '65'
  answer: D
  explanation: 'The first type of identification is an ''Expiring Identification License''...
    NOTE: At age 65 or older, this ID does not expire.'
- id: 119
  category: license_system
  question: Which of the following individuals is NOT required to have a Tennessee
    driver license?
  choices:
    A: A resident who drives a commercial truck
    B: An operator of a farm tractor temporarily moved on a highway
    C: A high school student driving alone to school
    D: A non-U.S. citizen working permanently in Tennessee
