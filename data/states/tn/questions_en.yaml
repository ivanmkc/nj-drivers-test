metadata:
  source: //www.tn.gov/content/dam/tn/safety/documents/DL_Manual.pdf:2025 Tennessee
    Driver Handbook (tn.gov)
  total_questions: 890
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: What are the normal operating hours for Tennessee Driver Service Centers?
  choices:
    A: 8:00 a.m. to 4:30 p.m.
    B: 8:30 a.m. to 5:00 p.m.
    C: 9:00 a.m. to 5:00 p.m.
    D: 8:30 a.m. to 6:00 p.m.
  answer: B
  explanation: According to the manual, Driver Service Centers are normally open 8:30
    a.m. to 5:00 p.m. and closed on official state holidays.
- id: 2
  category: license_system
  question: How long is a Tennessee interim driver license valid for?
  choices:
    A: Up to 10 days
    B: Up to 15 days
    C: Up to 20 days
    D: Up to 30 days
  answer: C
  explanation: The manual states that the interim license is valid for up to 20 days,
    and the permanent license or ID will be mailed to the customer's address.
- id: 3
  category: license_system
  question: How can the information on the front of an interim license card be validated?
  choices:
    A: By reading the 2D barcode
    B: By checking the magnetic stripe
    C: By scanning the RFID chip
    D: By calling the Driver Service Center
  answer: A
  explanation: The manual notes that the information on the front of the interim card
    can be validated by reading the 2D barcode.
- id: 4
  category: license_system
  question: Beginning on what date must a person have a REAL ID or other acceptable
    identification to board a commercial airline flight within the United States?
  choices:
    A: May 7, 2023
    B: May 7, 2024
    C: May 7, 2025
    D: May 7, 2026
  answer: C
  explanation: The manual states that beginning May 7, 2025, all persons must have
    a REAL ID license or a valid non-expired US Passport to board a commercial airline
    flight within the US.
- id: 5
  category: license_system
  question: Which of the following activities requires a REAL ID compliant credential?
  choices:
    A: Driving a motor vehicle
    B: Voting in a state election
    C: Accessing federal court buildings
    D: Entering a nuclear facility
  answer: D
  explanation: A REAL ID is required for entry onto certain Federal properties such
    as military bases, federal buildings, and nuclear facilities. It is NOT needed
    to drive, vote, or access federal court buildings.
- id: 6
  category: license_system
  question: You DO NOT need a REAL ID compliant credential to do which of the following?
  choices:
    A: Board a domestic commercial aircraft
    B: Visit the post office
    C: Enter a military base
    D: Enter a secure federal building
  answer: B
  explanation: The manual explicitly lists 'Visit the post office' as an activity
    for which you DO NOT need a REAL ID compliant credential.
- id: 7
  category: license_system
  question: What is the difference in cost between obtaining a REAL ID compliant credential
    and a non-compliant Tennessee license?
  choices:
    A: The REAL ID costs $10 more.
    B: The REAL ID costs twice as much.
    C: There is no difference in cost.
    D: The non-compliant ID is free.
  answer: C
  explanation: The manual states, 'There is no difference in cost to obtain a REAL
    ID compliant credential and a non-compliant REAL ID Tennessee license or ID.'
- id: 8
  category: driver_responsibility
  question: Which of the following is considered a form of distracted driving?
  choices:
    A: Cognitive distraction
    B: Visual distraction
    C: Manual distraction
    D: All of the above
  answer: D
  explanation: 'The manual explains that distracted driving comes in many different
    forms: ''It could be cognitive, it could be visual, or it could be manual. It
    can be a combination of all three...'''
- id: 9
  category: safe_driving_rules
  question: Sending or reading a text takes your eyes off the road for a minimum of
    how many seconds?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 5 seconds
    D: 10 seconds
  answer: C
  explanation: According to the manual, sending or reading a text takes your eyes
    off the road for a minimum of 5 seconds.
- id: 10
  category: defensive_driving
  question: Driving at 55 mph while reading a text for 5 seconds is equivalent to
    driving the length of what with your eyes closed?
  choices:
    A: A basketball court
    B: An entire football field
    C: A baseball diamond
    D: A city block
  answer: B
  explanation: The manual states, 'Driving at 55 mph, that’s like driving the length
    of an entire football field with your eyes closed.'
- id: 11
  category: driver_responsibility
  question: According to Tennessee's integrated traffic analysis network (Titan),
    how often does a crash involving a distracted driver occur in Tennessee?
  choices:
    A: Every 10 minutes and 5 seconds
    B: Every 15 minutes and 30 seconds
    C: Every 26 minutes and 13 seconds
    D: Every 45 minutes and 20 seconds
  answer: C
  explanation: According to Titan, a crash involving a distracted driver in Tennessee
    occurs every 26 minutes and 13 seconds.
- id: 12
  category: safe_driving_rules
  question: Under Tennessee's 2019 hands-free law, which of the following actions
    is illegal for a driver?
  choices:
    A: Using a voice-activated GPS system without touching the phone
    B: Holding a cellphone with any part of their body
    C: Talking to passengers in the vehicle
    D: Listening to the vehicle's built-in radio
  answer: B
  explanation: According to Public Chapter No. 412, it is illegal for a driver to
    'hold a cellphone or mobile device with any part of their body.'
- id: 13
  category: safe_driving_rules
  question: The hands-free law prohibits reaching for a cellphone if it requires the
    driver to do what?
  choices:
    A: Take one hand off the steering wheel
    B: Look away from the road for more than one second
    C: No longer be in a seated driving position or properly restrained by a seat
      belt
    D: Speak a voice command aloud
  answer: C
  explanation: The law makes it illegal to 'reach for a cellphone or mobile device
    in a manner that requires the driver to no longer be in a seated driving position
    or properly restrained by a seat belt.'
- id: 14
  category: safe_driving_rules
  question: If you need to touch your phone to access or adjust your GPS while driving,
    what must you do?
  choices:
    A: Wait until you are stopped at a red light
    B: Have a passenger hold the steering wheel
    C: Slow down to at least 15 mph
    D: Find a safe place to pull over such as a parking lot
  answer: D
  explanation: The manual states, 'You are not allowed to touch your phone in order
    to use GPS. If you need to access GPS or to use your phone, you must find a safe
    place to pull over such as in a parking lot...'
- id: 15
  category: license_system
  question: Are persons under 18 years of age eligible to obtain a REAL ID compliant
    credential in Tennessee?
  choices:
    A: No, they must be at least 18 years old.
    B: No, they must be at least 21 years old.
    C: Yes, they are eligible and follow the same process as adult credential holders.
    D: Yes, but only if they are traveling internationally.
  answer: C
  explanation: The manual states, 'Persons under 18 years of age are eligible to obtain
    a REAL ID compliant license or ID credential... by following the same process
    as adult credential holders.'
- id: 16
  category: safe_driving_rules
  question: According to the manual, what is the proper way to use a GPS on your phone
    while driving?
  choices:
    A: You may touch your phone quickly to adjust the route.
    B: You must find a safe place to pull over and bring your vehicle to a full stop
      before operating it.
    C: You can use it as long as you keep one hand on the steering wheel.
    D: You may only use it while stopped at a red light.
  answer: B
  explanation: 'The manual states: ''If you need to access GPS or to use your phone,
    you must find a safe place to pull over such as in a parking lot, bring your vehicle
    to a full stop and operate your phone or GPS technology.'''
- id: 17
  category: safe_driving_rules
  question: Is it legal to video record from your phone while driving in Tennessee?
  choices:
    A: Yes, if the phone is mounted to the dashboard.
    B: Yes, but only for social media purposes.
    C: No, it is a violation of law to video while you are driving.
    D: No, unless you are recording a traffic accident.
  answer: C
  explanation: 'The manual explicitly states: ''It’s very dangerous and it is a violation
    of law to video while you’re driving.'''
- id: 18
  category: safe_driving_rules
  question: When should you set your GPS navigation for a trip?
  choices:
    A: While merging onto the highway
    B: Before you begin your drive
    C: While stopped at the first traffic light
    D: Whenever you are driving below 30 mph
  answer: B
  explanation: 'The manual advises drivers to plan their travel by stating: ''You
    need to set your navigation before you begin your drive.'''
- id: 19
  category: license_system
  question: Which section of the Tennessee Comprehensive manual explains details on
    Intermediate Driver Licenses for applicants under age 18?
  choices:
    A: Section A
    B: Section B
    C: Section C
    D: The Table of Contents
  answer: A
  explanation: According to the introduction, Section A explains 'details on Intermediate
    Driver Licenses and how this graduated driver license works for driver license
    applicants under age 18'.
- id: 20
  category: driver_testing
  question: According to the manual, which section is designed to help new drivers
    study and prepare for the required knowledge and skills for an operator license?
  choices:
    A: Section A
    B: Section B
    C: Section C
    D: Chapter 2
  answer: B
  explanation: The manual states that 'Section B... is designed to help new drivers
    study and prepare for the required knowledge and skills for an operator license.'
- id: 21
  category: sharing_the_road
  question: Which section of the manual provides information about sharing the road
    with other methods of transportation?
  choices:
    A: Section A
    B: Section B
    C: Section C
    D: Chapter 1
  answer: C
  explanation: The introduction notes that Section C 'provides information about sharing
    the road with other methods of transportation, which have certain rights and privileges
    on the highways...'
- id: 22
  category: license_system
  question: What does a Class M license represent in Tennessee?
  choices:
    A: Motorhome
    B: Moped
    C: Motorcycle
    D: Manual Transmission
  answer: C
  explanation: The Table of Contents for Section A, Chapter 1 lists 'Class M (Motorcycle)'.
- id: 23
  category: license_system
  question: What does the 'F' endorsement stand for on a Class D license?
  choices:
    A: Farm Vehicle
    B: For-Hire
    C: Freight
    D: Family
  answer: B
  explanation: The Table of Contents lists 'Class D With F (For-Hire Endorsement)'.
- id: 24
  category: license_system
  question: Which class of license is designated for a Learner Permit?
  choices:
    A: Class LP
    B: Class L
    C: Class PD
    D: Class P
  answer: C
  explanation: The Table of Contents lists 'Learner Permit (Class PD)'.
- id: 25
  category: license_system
  question: What type of license is a Class H license?
  choices:
    A: Heavy Commercial
    B: Highway
    C: Hazardous Materials
    D: Hardship
  answer: D
  explanation: The Table of Contents lists 'Class H (Hardship)'.
- id: 26
  category: driver_responsibility
  question: What is the name of the organ and tissue donation program mentioned in
    the manual?
  choices:
    A: Donate Life Tennessee
    B: Tennessee Organ Registry
    C: Gift of Life TN
    D: Tennessee Donor Services
  answer: A
  explanation: The Table of Contents lists the topic 'Organ and Tissue Donation-Donate
    Life Tennessee'.
- id: 27
  category: driver_responsibility
  question: What is the term used in the manual for Voter Registration related to
    driver licenses?
  choices:
    A: Auto Vote
    B: Motor Voter
    C: Drive to Vote
    D: License Registration
  answer: B
  explanation: The Table of Contents lists 'Voter Registration – Motor Voter'.
- id: 28
  category: license_system
  question: What does the abbreviation TDL stand for in the Tennessee driver's manual?
  choices:
    A: Tennessee Driver License
    B: Temporary Driver License
    C: Transit Driving License
    D: Teen Driver License
  answer: B
  explanation: The Table of Contents lists 'Temporary Driver License (TDL)'.
- id: 29
  category: license_system
  question: What does IDP stand for in the context of driving credentials?
  choices:
    A: Identification Driving Permit
    B: Interstate Driving Privilege
    C: International Driving Permit
    D: Independent Driver Program
  answer: C
  explanation: The Table of Contents lists 'International Driving Permit (IDP)'.
- id: 30
  category: license_system
  question: Which of the following is a requirement listed in Chapter 2 when applying
    for your license?
  choices:
    A: Proof of Vehicle Ownership
    B: Proof of U.S. Citizenship or Lawful Permanent Residency
    C: Proof of Employment
    D: Proof of High School Graduation
  answer: B
  explanation: The Table of Contents for Chapter 2 lists 'Proof of U.S. Citizenship
    or Lawful Permanent Residency' as a requirement for applying for a license.
- id: 31
  category: license_system
  question: What is the first level of the Intermediate License system for drivers
    under 18 after obtaining a Learner Permit?
  choices:
    A: Intermediate Unrestricted License
    B: Intermediate Restricted License
    C: Regular Driver License
    D: Hardship License
  answer: B
  explanation: According to the Graduated License Procedures, the first level after
    a Learner Permit is the Intermediate Restricted License.
- id: 32
  category: license_system
  question: What is the final level of the Graduated License Procedures for drivers
    under 18?
  choices:
    A: Intermediate Restricted License
    B: Learner Permit
    C: Regular Driver License
    D: Intermediate Unrestricted License
  answer: C
  explanation: The final level of the Graduated License Procedures for drivers under
    18 is the Regular Driver License.
- id: 33
  category: license_system
  question: Which of the following is an additional documentation requirement for
    minors applying for a license?
  choices:
    A: Proof of vehicle ownership
    B: Proof of School Attendance/Progress
    C: A valid passport
    D: Voter registration card
  answer: B
  explanation: Additional documentation requirements for minors include Minor/Teenage
    Affidavits and Proof of School Attendance/Progress.
- id: 34
  category: safe_driving_rules
  question: According to the Graduated License Procedures for drivers under 18, what
    is the rule regarding cell phone usage?
  choices:
    A: It is allowed only with a hands-free device
    B: It is prohibited
    C: It is allowed during daylight hours
    D: It is allowed for GPS navigation only
  answer: B
  explanation: The manual explicitly states that cell phone usage is prohibited for
    drivers under 18 holding a learner permit or intermediate license.
- id: 35
  category: safe_driving_rules
  question: What is the Tennessee law regarding texting while driving?
  choices:
    A: It is prohibited
    B: It is allowed for adults over 21
    C: It is allowed at red lights
    D: It is only prohibited in school zones
  answer: A
  explanation: The manual lists 'Texting While Driving Prohibited' as a general rule
    for all drivers.
- id: 36
  category: safe_driving_rules
  question: Where is operating a hand-held phone explicitly prohibited according to
    the 'Getting Familiar With Your Vehicle' chapter?
  choices:
    A: On interstate highways
    B: In a school zone
    C: In residential neighborhoods
    D: In parking lots
  answer: B
  explanation: The manual explicitly states 'Operating a Hand-Held Phone In a School
    Zone Prohibited'.
- id: 37
  category: driver_testing
  question: Which of the following is one of the examinations required to get a driver's
    license?
  choices:
    A: Hearing Test
    B: Vision Screening
    C: Physical Fitness Test
    D: Reflex Examination
  answer: B
  explanation: The examinations chapter lists Vision Screening, Knowledge Test, and
    Road Test as the required tests.
- id: 38
  category: driver_testing
  question: What is required before taking the Road Test?
  choices:
    A: A notarized letter from a parent
    B: An appointment
    C: A vehicle inspection by a mechanic
    D: A minimum of 100 hours of driving practice
  answer: B
  explanation: The manual specifies 'Appointment Required for Road Test' under the
    Examinations chapter.
- id: 39
  category: driver_testing
  question: What must be completed as part of the Road Test before actually driving?
  choices:
    A: A Pre-Trip Vehicle Inspection
    B: A written essay
    C: A parallel parking simulation
    D: An eye exam
  answer: A
  explanation: The 'Pre-Trip Vehicle Inspection' is listed as a required component
    of the Road Test.
- id: 40
  category: vehicle_information
  question: According to Tennessee Safety Belt Laws, what is one of the primary facts
    about how safety belts protect you?
  choices:
    A: They prevent ejection from the vehicle
    B: They increase the vehicle's top speed
    C: They prevent the airbags from deploying
    D: They allow the driver to steer with one hand
  answer: A
  explanation: One of the listed safety belt facts in the manual is 'Preventing ejection'.
- id: 41
  category: vehicle_information
  question: How do safety belts handle crash forces on the body?
  choices:
    A: By concentrating them on the chest
    B: By shifting crash forces to the strongest parts of the body's structure
    C: By eliminating all crash forces
    D: By directing crash forces to the vehicle's bumper
  answer: B
  explanation: A key safety belt fact is 'Shifting crash forces to the strongest parts
    of the body's structure'.
- id: 42
  category: vehicle_information
  question: In addition to shifting crash forces, what else do safety belts do during
    a crash?
  choices:
    A: They spread crash forces over a wide area of the body
    B: They focus crash forces on the weakest parts of the body
    C: They push the body forward
    D: They automatically unlock the doors
  answer: A
  explanation: Safety belts work by 'Spreading crash forces over a wide area of the
    body'.
- id: 43
  category: vehicle_information
  question: How do safety belts assist with a driver's positioning?
  choices:
    A: They allow the driver to recline comfortably
    B: They keep the body more closely in the 'proper driving posture'
    C: They allow the driver to reach the backseat easily
    D: They restrict the driver from checking their blind spots
  answer: B
  explanation: Safety belts help by 'Keeping the body more closely in the proper driving
    posture'.
- id: 44
  category: vehicle_information
  question: Which specific body parts are explicitly mentioned as being protected
    by safety belts in the Tennessee manual?
  choices:
    A: The knees and ankles
    B: The head and spinal cord
    C: The arms and shoulders
    D: The hands and wrists
  answer: B
  explanation: One of the safety belt facts listed in the manual is 'Protecting the
    head and spinal cord'.
- id: 45
  category: vehicle_information
  question: What specific dangerous gas is a special warning provided for in the 'Getting
    Familiar With Your Vehicle' chapter?
  choices:
    A: Nitrogen dioxide
    B: Carbon monoxide
    C: Sulfur dioxide
    D: Radon
  answer: B
  explanation: The manual includes a 'Special Warning about Carbon Monoxide Poisoning'.
- id: 46
  category: signs_and_signals
  question: According to the manual's section on sign shapes, what does an octagon-shaped
    sign indicate?
  choices:
    A: Yield
    B: Stop
    C: Railroad Ahead
    D: Hazardous Condition
  answer: B
  explanation: The manual explicitly pairs the octagon shape with the command to stop
    under the heading 'Octagon Shape – Stop'.
- id: 47
  category: signs_and_signals
  question: What does a triangular-shaped traffic sign indicate?
  choices:
    A: Stop
    B: Railroad Here
    C: Yield
    D: Special Laws
  answer: C
  explanation: According to the traffic signs section of the manual, a triangular
    shape indicates 'Yield'.
- id: 48
  category: signs_and_signals
  question: A round-shaped traffic sign is used to warn drivers of what?
  choices:
    A: A yield sign ahead
    B: A railroad ahead
    C: A hazardous condition
    D: A temporary traffic control zone
  answer: B
  explanation: The manual lists 'Round Shape – Railroad Ahead' in the section covering
    sign shapes and colors.
- id: 49
  category: signs_and_signals
  question: Which sign shape indicates 'Railroad Here'?
  choices:
    A: Round shape
    B: Octagon shape
    C: Broad 'X' shape
    D: Diamond shape
  answer: C
  explanation: The manual specifies that a 'Broad 'X' Shape' is used to indicate 'Railroad
    Here'.
- id: 50
  category: signs_and_signals
  question: What is the meaning of a diamond-shaped traffic sign?
  choices:
    A: Stop immediately
    B: Special regulations apply
    C: Hazardous or unusual condition ahead
    D: Railroad crossing here
  answer: C
  explanation: The manual states 'Diamond Shape – Hazardous Or Unusual Condition Ahead'
    under the sign shapes and colors section.
- id: 51
  category: signs_and_signals
  question: Which sign shape is used to indicate special laws, regulations, or important
    information?
  choices:
    A: Rectangular shape
    B: Round shape
    C: Triangular shape
    D: Broad 'X' shape
  answer: A
  explanation: The manual lists 'Rectangular Shape – Special Laws, Regulations or
    Important Information' as a standard sign shape.
- id: 52
  category: signs_and_signals
  question: What shape and color are typically used for warning signs?
  choices:
    A: Round (Yellow)
    B: Diamond (Yellow)
    C: Rectangular (White)
    D: Octagon (Red)
  answer: B
  explanation: The manual specifically categorizes warning signs as 'Warning Signs
    – Diamond Shape (Yellow)'.
- id: 53
  category: driver_responsibility
  question: The manual includes a special warning regarding children in vehicles.
    What is this warning?
  choices:
    A: Do not let children eat in a vehicle
    B: Do not leave children unattended in a vehicle
    C: Do not let children listen to loud music
    D: Do not let children sit in the back seat
  answer: B
  explanation: Under the Child Passenger Protection Laws section, there is a 'Special
    Warning – Do Not Leave Children Unattended in a Vehicle'.
- id: 54
  category: signs_and_signals
  question: '''Walk'' and ''Don''t Walk'' are examples of which type of signals?'
  choices:
    A: Lane Control Signals
    B: Pedestrian Signals
    C: Emergency Reference Markers
    D: Channeling Devices
  answer: B
  explanation: The manual lists 'Walk' and 'Don't Walk' directly under the heading
    'Pedestrian Signals'.
- id: 55
  category: signs_and_signals
  question: Protected arrows and permissive arrows are categorized under which section
    of the manual?
  choices:
    A: Traffic Signals
    B: Pavement Lane Markings
    C: Guide Signs on Interstates
    D: Service Signs
  answer: A
  explanation: Protected Arrows and Permissive Arrows are listed as subtopics under
    the 'Traffic Signals' section.
- id: 56
  category: signs_and_signals
  question: High Occupancy Vehicle (HOV) Lanes are discussed under the general principles
    of what topic?
  choices:
    A: Traffic Signals
    B: Pavement Lane Markings
    C: Temporary Traffic Control Zones
    D: Work Area Signs
  answer: B
  explanation: High Occupancy Vehicle (HOV) Lanes are listed under 'General Principles
    of Pavement Lane Markings'.
- id: 57
  category: signs_and_signals
  question: Channeling devices and highway flaggers are associated with which type
    of signs?
  choices:
    A: Guide Signs for Highways
    B: Work Area Signs
    C: Service Signs
    D: Directional Signs
  answer: B
  explanation: Channeling Devices and Highway Flaggers are listed as subtopics under
    'Work Area Signs'.
- id: 58
  category: signs_and_signals
  question: The 'White Crossbuck with RR' is listed in the manual alongside which
    of the following topics?
  choices:
    A: Turn Lane Arrows and Stop Lines
    B: Air Bag Deactivation
    C: Handicap Symbols
    D: Emergency Reference Markers
  answer: A
  explanation: The 'White Crossbuck with RR' is listed under Pavement Lane Markings,
    right after 'Stop Lines', 'HOV Lanes', and 'Turn Lane Arrow'.
- id: 59
  category: safe_driving_rules
  question: The phrase 'Belts to Bones' is a tip provided in the manual for what specific
    topic?
  choices:
    A: Securing cargo in a truck
    B: Using safety belts with children
    C: Adjusting adult air bags
    D: Wearing a motorcycle helmet
  answer: B
  explanation: The phrase 'Belts to Bones' is listed directly under 'Tips for Using
    Safety Belts with Children' in the Child Passenger Protection Laws section.
- id: 60
  category: safe_driving_rules
  question: According to the manual, what does the acronym HOV stand for in relation
    to highway lanes?
  choices:
    A: High Output Vehicle
    B: Heavy Occupancy Vehicle
    C: High Occupancy Vehicle
    D: Highway Overpass Vehicle
  answer: C
  explanation: The manual specifically lists 'High Occupancy Vehicle (HOV) Lanes'
    in its contents.
- id: 61
  category: signs_and_signals
  question: What words are displayed on the white crossbuck sign at railroad crossings?
  choices:
    A: RAILROAD CROSSING
    B: STOP
    C: YIELD
    D: RR
  answer: A
  explanation: The white crossbuck sign at railroad crossings displays the words "RAILROAD
    CROSSING." The circular yellow advance warning sign has the letters "RR" on it.
- id: 62
  category: safe_driving_rules
  question: Which rule is specifically referenced in the manual regarding following
    distances?
  choices:
    A: The Three Second Rule
    B: The Two Second Rule
    C: The One Car Length Rule
    D: The Four Second Rule
  answer: B
  explanation: The manual includes a specific section titled 'The Two Second Rule'
    under the topic of Braking, Following and Stopping Distances.
- id: 63
  category: safe_driving_rules
  question: What law is specifically mentioned in the Interstate Driving chapter regarding
    traffic congestion and emergency stopping?
  choices:
    A: The Keep Right Law
    B: The Move Over Law
    C: The Speed Minimum Law
    D: The Yield to Emergency Law
  answer: B
  explanation: The 'Move Over Law' is explicitly listed in the Interstate Driving
    chapter.
- id: 64
  category: safe_driving_rules
  question: Which of the following are categorized as 'Special Turns' in the Rules
    of the Road?
  choices:
    A: Three-point turns and U-Turns
    B: Roundabouts and U-Turns
    C: Left turns on red
    D: Right turns on red
  answer: B
