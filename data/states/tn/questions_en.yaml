  choices:
    A: 1 year
    B: 3 years
    C: 5 years
    D: 8 years
  answer: C
  explanation: According to the manual, the maximum length of time a Temporary Identification
    License (TID) can be issued is 5 years.
- id: 124
  category: driver_responsibility
  question: At what age can a minor who holds a driver's license, permit, or state
