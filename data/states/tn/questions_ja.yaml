- id: 144
  category: license_system
  question: 申請者が米国において「一時的」な合法的滞在ステータスしか持っていない場合、次のどれの資格を得る可能性がありますか？
  choices:
    A: 永久的な商用運転免許証
    B: 一時運転免許証（TDL）または一時身分証明免許証（TID）
    C: 標準のクラスD運転免許証
    D: 国際運転免許証
  answer: B
  explanation: 申請者が一時的な合法的滞在ステータスしか持っていない場合、標準の運転免許証の資格はありませんが、一時運転免許証（TDL）または一時身分証明免許証（TID）の資格を得る可能性があります。
- id: 145
  category: license_system
  question: 国際運転免許証（IDP）の使用に関して、正しいものは次のうちどれですか？
  choices:
    A: 米国内での運転において、それ単体で有効である。
    B: 運転者の通常の有効な米国運転免許証と一緒に携帯しなければならない。
    C: 州外を旅行する際、州発行の運転免許証の代わりになる。
    D: 外国からの訪問者が米国の交通法を免除される。
  answer: B
  explanation: IDPは、運転者の通常の有効な米国運転免許証と一緒に携帯しなければなりません。米国内での運転には有効ではなく、それ単体で運転することはできません。
- id: 146
  category: license_system
  question: 米国市民権または合法的な永住権ステータスを証明するための有効な書類は、次のうちどれですか？
  choices:
    A: 有効な他州の運転免許証
    B: 過去4ヶ月以内の公共料金の請求書
    C: 有効な米国パスポート
    D: 有権者登録カード
  answer: C
  explanation: 表2.1には、申請者が米国市民または合法的な永住者であることを証明する有効な書類が記載されており、その中には有効な米国パスポートが含まれています。
- id: 147
  category: license_system
  question: 運転免許証を申請する際、主要な身分証明書（Primary Identification）として認められないものは次のうちどれですか？
  choices:
    A: 認証済みの出生証明書
    B: 有効なパスポート
    C: 病院発行の出生証明書
    D: 軍の身分証明書
  answer: C
  explanation: マニュアルには、「病院発行の証明書および洗礼証明書は、主要な身分証明書として認められない」と明記されています。
- id: 148
  category: license_system
  question: 申請者が英語で発行されていない外国の出生証明書を提示する場合、他に何を提出しなければなりませんか？
  choices:
    A: 大使館からの公証された手紙
    B: 正確な翻訳の証明書（Certificate of Accurate Translation）
    C: 国際運転免許証
    D: 有効な米国パスポート
  answer: B
  explanation: 英語で発行されていない外国の出生証明書は、翻訳され、正確な翻訳の証明書（Certificate of Accurate Translation）が添付されていなければなりません。
- id: 149
  category: license_system
  question: 運転免許証を新規（ORIGINAL）で申請する場合、身元証明書類はいくつ必要ですか？
  choices:
    A: 主要（Primary）リストから1点
    B: 補助（Secondary）リストから2点
    C: 主要リストから少なくとも1点と、どちらかのリストからもう1点
    D: 主要リストから3点
  answer: C
  explanation: 新規申請者は、主要な身分証明書（Primary Identification）リストから少なくとも1点を用意しなければなりません。2点目は、補助的な身分証明書（Secondary
    Identification）リスト、または主要な身分証明書リストの別の項目のいずれかから選ぶことができます。
- id: 150
  category: license_system
  question: 新しい居住者が他州の免許証を紛失した場合、どうしなければなりませんか？
  choices:
    A: 補助的な身分証明書リストから3点を提出する
    B: 新規申請者に求められるのと同じ2点の証明書類を提出する
    C: 以前の州に戻って再発行を受ける
    D: テネシー州の免許証を申請する前に30日間待つ
  answer: B
  explanation: 新しい居住者が他州の免許証を紛失した場合、新規申請者に求められるのと同じ2点の証明書類を提出しなければなりません。
- id: 151
  category: license_system
  question: 氏名変更の証明として婚姻証明書を使用する場合、次のうち正しいものはどれですか？
  choices:
    A: 婚姻を許可する「許可証（license）」でなければならない
    B: 婚姻「後」に登録されたものでなければならない
    C: 証明書のコピーは常に認められる
    D: 申請者の生年月日が含まれている必要はない
  answer: B
  explanation: 証明書は婚姻「後」に登録された原本または認証謄本でなければなりません。単に婚姻を許可する「許可証（license）」では認められません。
- id: 152
  category: license_system
  question: 次のうち、有効な第二身分証明書（Secondary Identification）として認められるものはどれですか？
  choices:
    A: 出生証明書の認証謄本
    B: 有効なパスポート
    C: 健康保険証
    D: 養子縁組決定書
  answer: C
  explanation: 健康保険証（TennCare、Medicaid、Medicareなど）は、第二身分証明書のリストに記載されています。
- id: 153
  category: license_system
  question: テネシー州の居住を証明するには、いくつの書類が必要ですか？
  choices:
    A: 1つ
    B: 2つ
    C: 3つ
    D: 4つ
  answer: B
  explanation: 居住証明として、申請者は「有効な居住証明書リスト」から2つの書類を提出する必要があります。
- id: 154
  category: license_system
  question: 次のうち、テネシー州の居住を証明する書類として認められないものはどれですか？
  choices:
    A: 消印付きの封筒に入った最新の公共料金の請求書
    B: 公共料金の初回保証金（デポジット）の領収書
    C: 最新の銀行取引明細書
    D: 最新のテネシー州有権者登録証
  answer: B
  explanation: 居住証明として公共料金の請求書を使用する場合、マニュアルには「初回保証金（デポジット）の領収書は認められない」と明記されています。
- id: 155
  category: license_system
  question: 申請者がテネシー州の居住証明として公共料金の請求書を使用する場合、何を含めなければなりませんか？
  choices:
    A: 公証された署名
    B: 請求書が郵送された際の消印付きの封筒
    C: 申請者の出生証明書のコピー
    D: 公共料金会社からの手紙
  answer: B
  explanation: 最新の公共料金の請求書には、それが郵送された際の消印付きの封筒が含まれていなければなりません。
- id: 156
  category: license_system
  question: テネシー州の運転免許証にソーシャルセキュリティーナンバー（社会保障番号）は印字されますか？
  choices:
    A: はい、法律で義務付けられています
    B: はい、印字しないよう要求しない限り印字されます
    C: いいえ、ソーシャルセキュリティーナンバーは免許証に印字されません
    D: 商用運転免許証（CDL）にのみ印字されます
  answer: C
  explanation: マニュアルには「ソーシャルセキュリティーナンバーは免許証に印字されません」と記載されています。
- id: 157
  category: license_system
  question: 身分証明およびソーシャルセキュリティーナンバーの証明として認められるソーシャルセキュリティーカードの種類はどれですか？
  choices:
    A: 金属製のレプリカ
    B: プラスチック製のレプリカ
    C: 原本のコピー
    D: ソーシャルセキュリティーカードの原本
  answer: D
  explanation: マニュアルでは「ソーシャルセキュリティーカードの原本」と指定されており、第二身分証明書の項目には「原本のみ。金属製やプラスチック製のレプリカは不可」と記載されています。
- id: 158
  category: license_system
  question: 雇用主による居住地証明を使用する場合で、雇用主が会社のレターヘッド（社名入りの便箋）を持っていない場合、何が必要ですか？
  choices:
    A: 署名が公証されていること
    B: 異なる2名の管理者の署名
    C: 雇用主の営業許可証のコピー
    D: いかなる状況でも使用できない
  answer: A
  explanation: マニュアルには「雇用主がレターヘッドを持っていない場合、署名は公証されなければならない」と記載されています。
- id: 159
  category: license_system
  question: 氏名変更の証明として、申請者が離婚判決の裁判所文書のコピーを提出する場合、何が必要ですか？
  choices:
    A: コピーされた印章と署名で認められる
    B: コピーに原本の署名または印章が押印されていなければならない
    C: 裁判所文書は氏名変更には使用できない
    D: 出生証明書を添付しなければならない
  answer: B
  explanation: マニュアルには「コピーに原本の署名/印章が押印された裁判所文書のコピーは認められる。印章/署名がコピーされた裁判所文書のコピーは認められない」と記載されています。
- id: 160
  category: license_system
  question: 次のうち、テネシー州の居住証明を提出する必要がある申請者は誰ですか？
  choices:
    A: 初めてIDを取得する新規（ORIGINAL）申請者のみ
    B: 新規転入者（NEW RESIDENT）の申請者のみ
    C: 新規（ORIGINAL）、新規転入者（NEW RESIDENT）、および再転入者（RETURNING RESIDENT）の申請者
    D: 既存のテネシー州運転免許証の再発行（DUPLICATES）申請者
  answer: C
  explanation: 運転免許試験官は、新規（ORIGINAL）申請者、新規転入者（NEW RESIDENT）の申請者、および再転入者（RETURNING
    RESIDENT）の申請者に対して、テネシー州の居住証明を求めます。
- id: 161
  category: license_system
  question: 申請者が未成年で、親または法定後見人名義の居住証明書を使用する場合、他に何が必要ですか？
  choices:
    A: 未成年者の学校からの証明書
    B: 続柄の証明
    C: 近隣住民からの公証された陳述書
    D: 未成年者のソーシャルセキュリティカード
  answer: B
  explanation: マニュアルには、申請者が未成年の場合、親または法定後見人の名前を使用できると記載されていますが、「（この種の証明を使用する場合は続柄の証明が必要になります）」とあります。
- id: 162
  category: license_system
  question: ソーシャルセキュリティ番号（SSN）を発行されたことがない場合、運転免許証の申請手続きを行うにはどうすればよいですか？
  choices:
    A: 雇用主からの手紙を提出する
    B: オンラインで申請し、「SSNなし」のボックスにチェックを入れる
    C: 本人が出頭し、宣誓供述書に署名する
    D: パスポートと出生証明書を持参する
  answer: C
  explanation: ソーシャルセキュリティ番号を発行されたことがない申請者は、本人が出頭し、運転免許試験官または公証人の面前でその旨の宣誓供述書に署名しなければなりません。
- id: 163
  category: license_system
  question: 2016年1月1日以降、21歳以上のテネシー州の運転免許証の有効期限はどのくらいの頻度で切れますか？
  choices:
    A: 4年ごとの誕生日に
    B: 発行日から5年ごとに
    C: 発行日から8年ごとに
    D: 10年ごとの誕生日に
  answer: C
  explanation: 2016年1月1日以降、21歳以上のテネシー州の運転免許証は、発行日から8年ごとに有効期限が切れます。
- id: 164
  category: license_system
  question: テネシー州の運転免許サービスセンターで受け付けられていない支払い方法は、次のうちどれですか？
  choices:
    A: 現金
    B: アメリカン・エキスプレスのクレジットカード
    C: MasterCard
    D: マネーオーダー（郵便為替）
  answer: B
  explanation: 運転免許サービスセンターで受け付けられている支払い方法は、現金、小切手、マネーオーダー、MasterCard、Visa、Discoverのクレジットカードです。アメリカン・エキスプレスは含まれていません。
- id: 165
  category: license_system
  question: 他州の運転免許証を所持している新しい居住者は、居住を確立してから何日以内にテネシー州の運転免許証を取得しなければなりませんか？
  choices:
    A: 10日
    B: 14日
    C: 30日
    D: 60日
  answer: C
  explanation: 新しい居住者、またはテネシー州に帰還し他州の運転免許証を所持している人は、居住を確立してから30日以内にテネシー州の運転免許証を取得しなければなりません。
- id: 166
  category: driver_testing
  question: テネシー州の運転免許証を取得するすべての新規または帰還居住者に義務付けられているテストは何ですか？
  choices:
    A: 視力検査
    B: 路上技能試験
    C: 筆記知識試験
    D: 身体的健康診断
  answer: A
  explanation: すべての新規または帰還居住者は、運転免許サービスセンターでテネシー州の視力検査を受けなければなりません。
- id: 167
  category: driver_testing
  question: 新しい居住者の他州の運転免許証が6ヶ月以上失効している場合、どのテストを受けなければなりませんか？
  choices:
    A: 視力検査のみ
    B: 視力検査と知識試験
    C: 知識試験と路上技能試験
    D: 知識試験、路上技能試験、および視力検査
  answer: D
  explanation: 他州の運転免許証が6ヶ月以上失効している新規または帰還居住者は、テネシー州の知識試験、路上技能試験、および視力検査を受けなければなりません。
- id: 168
  category: license_system
  question: 免許証を申請する際、新しい居住者はテネシー州の居住証明を2つ提出しなければなりません。これらの書類の要件として正しいものは次のうちどれですか？
  choices:
    A: コピーでなければならない
    B: 過去4ヶ月以内の日付でなければならない
    C: 私書箱（P.O. Box）の住所を使用しなければならない
    D: 過去12ヶ月以内の日付でなければならない
  answer: B
  explanation: 申請者は、氏名と居住地住所が記載されたテネシー州の居住証明を2つ提出しなければなりません（私書箱は不可）。また、書類は最新のもので、過去4ヶ月以内の日付である必要があります。
- id: 169
  category: license_system
  question: アメリカ軍に所属する人の有効なテネシー州運転免許証が、無期限で有効であり続けるのはどのような条件の場合ですか？
  choices:
    A: 州兵のメンバーである場合
    B: 現役勤務であり、テネシー州外に駐屯している場合
    C: 軍人の家族である場合
    D: テネシー州内の基地に駐屯している場合
  answer: B
  explanation: その人が現役勤務を続け、テネシー州外に駐屯しており、免許証が返納、取り消し、または停止されていない限り、記載されている有効期限に関係なく免許証は有効であり続けます。
- id: 170
  category: license_system
  question: 軍隊を除隊した、またはテネシー州内の勤務地に再配属された後、何日以内に運転免許証を更新しなければなりませんか？
  choices:
    A: 30日
    B: 60日
    C: 90日
    D: 120日
  answer: B
  explanation: 軍隊を除隊または離隊した、あるいは州内の勤務地に再配属された場合、離隊日から60日以内に免許証を更新しなければなりません。
- id: 171
  category: license_system
  question: 仮運転免許証（TDL）を紛失または盗難された場合、どのように再発行できますか？
  choices:
    A: 州のウェブサイトからオンラインで申請する
    B: 安全局（Department of Safety）に申請書を郵送する
    C: 運転免許サービスセンターに直接出向いて申請する
    D: フリーダイヤルの再発行ホットラインに電話する
  answer: C
  explanation: 仮運転免許証および仮身分証明書はオンラインで再発行することはできません。直接出向いて申請する必要があり、その際には適切な身分証明書を提示する必要があります。
- id: 172
  category: license_system
  question: 2001年1月1日以降にテネシー州の運転免許証を交付された場合、最初の更新時に何をしなければなりませんか？
  choices:
    A: オンラインで更新して身元を確認する
    B: 運転免許サービスセンターで、米国市民または合法的な永住者であることを証明する書類を提出する
    C: 学科試験を再受験する
    D: 出生証明書のコピーを安全局（Department of Safety）に郵送する
  answer: B
  explanation: テネシー州法により、2001年1月1日以降に免許証を交付されたすべての人は、最初の更新時に米国市民または合法的な永住者であることを証明する書類を提出することが義務付けられています。郵送やインターネットでの更新はできず、運転免許サービスセンターを訪問する必要があります。
- id: 173
  category: driver_testing
  question: 他国からの新しい居住者がテネシー州の運転免許証を申請する際、何が求められますか？
  choices:
    A: 外国の免許証を返納しなければならない
    B: 視力検査のみを受ける必要がある
    C: 視力検査、学科試験、および技能試験を受けなければならない
    D: 申請する前に6ヶ月待たなければならない
  answer: C
  explanation: 他国からの新しい居住者は、視力検査、学科試験、および技能試験を受ける必要があります。なお、その国で発行された免許証は保持することが認められます。
- id: 174
  category: license_system
  question: 身元および居住地の証明として提示する書類の状態に関する規則は何ですか？
  choices:
    A: 高品質のコピーが推奨される
    B: 書類は原本でなければならず、コピーは受け付けられない
    C: スマートフォン上のデジタルコピーでも受け付けられる
    D: すべての二次的証明書類には公証されたコピーが必要である
  answer: B
  explanation: マニュアルには「書類は原本でなければなりません。コピーは一切受け付けられません！」と明記されています。
- id: 175
  category: penalties_and_points
  question: 運転免許証の有効期限が30暦日を超え、6ヶ月未満経過している場合の遅延損害金（延滞料）はいくらですか？
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: マニュアルによると、免許証の有効期限が30暦日を超えて切れている場合、5ドル（$5.00）の遅延損害金が発生します。6ヶ月を過ぎると、この料金は倍の$10.00になります。
- id: 176
  category: license_system
  question: 運転免許証を更新せずに5年間経過した場合、更新するには何をしなければなりませんか？
  choices:
    A: $50の遅延損害金を支払う
    B: 視力検査、学科試験、および技能試験に合格する
    C: 認可された運転者教育コースを受講する
    D: 新しい免許証を申請する前に180日待つ
  answer: B
  explanation: 更新せずに5年間経過した場合、$10.00の遅延損害金を支払うだけでなく、視力検査、学科試験、および技能試験にも合格する必要があります。
- id: 177
  category: driver_responsibility
  question: 州法により、居住地の住所が変更された場合、何日以内に安全局（Department of Safety）に通知しなければなりませんか？
  choices:
    A: 5日以内
    B: 10日以内
    C: 15日以内
    D: 30日以内
  answer: B
  explanation: 居住地の住所が変更された場合、州法により、変更から10日以内に安全局（Department of Safety）に通知することが義務付けられています。
- id: 178
  category: license_system
  question: 安全局（Department of Safety）に新しい住所を通知する際、それ単独では居住地住所として受け付けられないものは次のうちどれですか？
  choices:
    A: 番地と通り（ストリート）
    B: アパートの部屋番号と道路（ロード）
    C: 私書箱（P.O. Box）
    D: ハイウェイ番号と都市名
  answer: C
  explanation: 法律により、免許証には法的な居住地住所を記載する必要があります。私書箱単独では居住地住所として受け付けられません。
- id: 179
  category: license_system
  question: 段階的運転免許（GDL）プログラムへの参加が免除されるのは誰ですか？
  choices:
    A: 16歳で仕事に就いている人
    B: 18歳未満で高校を卒業した、またはGED（高卒認定）を取得した人
    C: 他州の許可証（パーミット）を90日間保持している人
    D: 17歳で運転者教育を修了した人
  answer: B
  explanation: GDL法は、18歳以上の人、または18歳未満で高校を卒業したかGEDを取得した人には適用されません。
- id: 180
  category: license_system
  question: テネシー州で仮免許（Learner Permit）を取得できる最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 17歳
  answer: B
  explanation: 仮免許（Learner Permit）を取得するには、15歳以上であり、標準の学科試験と視力検査に合格する必要があります。
- id: 181
  category: safe_driving_rules
  question: 仮免許（Learner Permit）を所持している人が運転を禁止されている時間帯はいつですか？
  choices:
    A: 午後8時から午前6時
    B: 午後9時から午前5時
    C: 午後10時から午前6時
    D: 午後11時から午前7時
  answer: C
  explanation: 仮免許（Learner Permit）を所持している運転者は、午後10時から午前6時までの間は運転してはいけません。
- id: 182
  category: safe_driving_rules
  question: 仮免許（Learner Permit）で運転する場合、同乗しなければならない免許所持者の最低条件は次のうちどれですか？
  choices:
    A: 18歳以上で助手席に乗っていること
    B: 21歳以上で助手席に乗っていること
    C: 21歳以上で車内のどこかに乗っていること
    D: 25歳以上で助手席に乗っていること
  answer: B
  explanation: 21歳以上の免許所持者が助手席に同乗している場合にのみ、車を運転することができます。
- id: 183
  category: driver_testing
  question: 中間制限付き免許（Intermediate Restricted License）を取得するには、何時間の運転経験の証明が必要ですか？
  choices:
    A: 30時間（うち夜間5時間）
    B: 40時間（うち夜間10時間）
    C: 50時間（うち夜間10時間）
    D: 60時間（うち夜間15時間）
  answer: C
  explanation: 親、法定後見人、または公認の運転指導員から、50時間（うち夜間10時間）の運転経験を完了したことを証明する書類を提出する必要があります。
- id: 184
  category: license_system
  question: 中間無制限免許（Intermediate Unrestricted License）を申請するには、17歳以上であり、かつ中間制限付き免許（Intermediate
    Restricted License）をどのくらいの期間保持している必要がありますか？
  choices:
    A: 90日間
    B: 180日間
    C: 1年間
    D: 2年間
  answer: C
  explanation: 中間制限付き免許から中間無制限免許を申請するには、17歳以上であり、中間制限付き免許を1年間保持している必要があります。
- id: 185
  category: penalties_and_points
  question: 中間制限付き免許から中間無制限免許への移行を妨げる要因となるのは、次のうちどれですか？
  choices:
    A: シートベルト違反が1回ある
    B: 運転記録に4ポイント累積している
    C: 自分の過失による交通事故を起こしている
    D: 追加の筆記試験を受けていない
  answer: C
  explanation: 中間無制限免許に移行するには、自分の過失による交通事故を起こしていないことが条件となります。（また、シートベルト違反が2回以上、または6ポイント以上の累積がないことも条件であり、追加の試験は必要ありません）。
- id: 186
  category: license_system
  question: 2018年7月1日より、21歳未満の人に発行されるすべての運転免許証はどのような形式で印刷されていますか？
  choices:
    A: 横型フォーマット
    B: 縦型フォーマット
    C: 正方形フォーマット
    D: ホログラムフォーマット
  answer: B
  explanation: 2018年7月1日より、21歳未満の人に発行されるすべての運転免許証は縦型フォーマットになっています。
- id: 187
  category: driver_responsibility
  question: 運転免許証の有効期限が切れた後、車両を運転できる猶予期間（グレースピリオド）はどのくらいですか？
  choices:
    A: 10日間
    B: 30日間
    C: 6ヶ月間
    D: 猶予期間はない
  answer: D
  explanation: 「猶予期間」はありません。免許証の有効期限が切れた時点で、自動車やオートバイを運転する資格はなくなります。
- id: 188
  category: license_system
  question: 15歳で、以前住んでいた州の有効な仮免許（permit）を持っている場合、その州外での仮免許保持期間をテネシー州の180日間の要件に算入するにはどうすればよいですか？
  choices:
    A: 申請日から30日以内に発行された、以前の州の公式な運転記録証明書を提出しなければならない
    B: 直ちに新しい路上試験を受けなければならない
    C: 以前の州の知事に免除申請書へ署名してもらわなければならない
    D: いかなる状況でも州外での仮免許保持期間は算入できない
  answer: A
  explanation: テネシー州での申請日の直前30日以内に発行された、以前の州の公式な運転記録証明書を提出できる場合に限り、以前の州で仮免許を保持していた期間を180日間の要件に含めることができます。
- id: 189
  category: driver_responsibility
  question: 連邦運転者プライバシー保護法（DPPA）に基づき、安全局（Department of Safety）は、何がない限りメーリングリスト用にあなたの個人情報を開示しませんか？
  choices:
    A: 裁判所の命令
    B: あなたの明示的な同意
    C: 身元調査
    D: 10ドルの処理手数料
  answer: B
  explanation: 連邦運転者プライバシー保護法（DPPA）は、その運転者の「明示的な同意」なしに、自動車記録から個人情報を配布または開示することを禁じています。
- id: 190
  category: license_system
  question: 18歳未満の新しい居住者が以前の州の公式な運転記録証明書を提出する場合、テネシー州での申請日から何日以内に発行されたものでなければなりませんか？
  choices:
    A: 10日以内
    B: 15日以内
    C: 30日以内
    D: 60日以内
  answer: C
  explanation: 公式な運転記録証明書は、テネシー州での申請日の直前30日以内に発行されたものでなければなりません。
- id: 191
  category: license_system
  question: 次の免許レベルのうち、運転者が制限カード（Restriction Card）を携帯する必要がないものはどれですか？
  choices:
    A: 仮免許（Learner Permit）
    B: 中間制限付きクラスD（Intermediate Restricted Class D）
    C: 中間無制限クラスD（Intermediate Unrestricted Class D）
    D: 仮免許と中間制限付きの両方
  answer: C
  explanation: 第2レベルの中間無制限（IU）クラスDの運転者には、運転に関する制限がありません。したがって、この免許レベルには制限カードはありません。
- id: 192
  category: penalties_and_points
  question: 中間制限付き免許を持つ10代の運転者が、親の同意書を偽造して有罪となった場合の罰則は何ですか？
  choices:
    A: 中間制限期間に90日間が追加される
    B: 免許が取り消され、18歳になるまで仮免許が再発行される
    C: 認定された運転者教育コースの修了
    D: すべての運転特権の6ヶ月間停止
  answer: B
  explanation: GDL（段階的運転免許）罰則表によると、中間制限付き免許の発行後に親の同意書を偽造した場合、中間制限付き免許は取り消され、その10代の運転者が18歳になるまでの間のみ仮免許が再発行されます。
- id: 193
  category: penalties_and_points
  question: 中間制限付き免許を持つ運転者が、2回目の交通違反（走行中の違反）で有罪となった場合、どのような罰則が適用されますか？
  choices:
    A: 18歳になるまで仮免許を維持しなければならない
    B: 中間制限期間に90日間が追加される
    C: 認定された運転者教育コースを修了しなければならない
    D: 免許が180日間停止される
  answer: C
  explanation: GDL罰則表には、中間制限付き免許の発行後に2回目の交通違反で有罪となった場合、認定された運転者教育コースの修了が必要であると記載されています。
- id: 194
  category: driver_responsibility
  question: 18歳未満の申請者のために大人が「未成年者/ティーンエイジャーの宣誓書および取り消しフォーム（Minor/Teenage Affidavit
    and Cancellation form）」に署名する場合、どのような責任を負いますか？
  choices:
    A: 常に助手席に乗らなければならない
    B: 未成年の運転者に対する経済的責任を負う
    C: 未成年者の車両登録料を支払わなければならない
    D: 未成年者と一緒に50時間の運転時間を記録することが義務付けられる
  answer: B
  explanation: 未成年者/ティーンエイジャーの宣誓書は、フォームに署名する大人が免許申請に参加し、未成年の運転者の行動に対して責任を負うことを確認するものです。これには経済的責任を負うことも含まれます。
- id: 195
  category: license_system
  question: 未成年者がオートバイ免許など、追加のクラスの免許を申請する場合、親または法定後見人に何が求められますか？
  choices:
    A: その免許タイプのための2つ目のティーンエイジャー宣誓書に署名しなければならない
    B: 申請料を2倍支払わなければならない
    C: 未成年者と一緒にオートバイ安全コースを受講しなければならない
    D: 追加の書類は必要ない
  answer: A
  explanation: 未成年者が追加のクラスの免許（オートバイなど）を申請する場合、親または法定後見人はその免許タイプのための2つ目のティーンエイジャー宣誓書に署名することが求められます。
- id: 196
  category: license_system
  question: 通常の学年度中に学校関係者が署名した義務教育出席証明書（Form SF1010）の有効期間はどのくらいですか？
  choices:
    A: 10日間
    B: 14日間
    C: 30日間
    D: 60日間
  answer: C
  explanation: 申請者は、記入済みの原本を運転者サービスセンター（Driver Service Center）に持参する必要があります。このフォームは、学校関係者が署名した日から30日間のみ有効です。
- id: 197
  category: license_system
  question: 義務教育出席証明書（Form SF1010）が学年度の最後の30日以内に署名された場合、どのくらいの期間受け付けられますか？
  choices:
    A: 学年度の最終日までのみ
    B: 夏休み期間中および翌学年度の開始から30日後まで
    C: 署名日からちょうど90日間
    D: 生徒の18歳の誕生日まで
  answer: B
  explanation: 従来の夏休み期間中、学年度の最後の30日以内に署名された適切に記入されたSF1010フォームは、夏休み期間中および翌学年度の開始から30日後まで受け付けられます。
- id: 198
  category: license_system
  question: 免許を申請する未成年者が学校出席法を遵守していることの証明として、受け付けられない書類は次のうちどれですか？
  choices:
    A: 高校の卒業証書の原本
    B: 義務教育出席証明書（Form SF1010）
    C: 成績表または学校の成績証明書
    D: ホームスクールの申請者向けの地元教育長からの手紙
  answer: C
  explanation: 成績表や学校の成績証明書は、この法律の遵守を証明するものとして受け付けられません。評価基準が多様であるため、運転免許センターの職員にはこれらの書類の情報を解釈する権限がありません。
- id: 199
  category: penalties_and_points
  question: 15歳以上の生徒が学校を中退した場合、その生徒の運転特権はどうなりますか？
  choices:
    A: 職場への往復の運転のみに制限される
    B: 安全省（Department of Safety）が生徒の運転特権を停止する
    C: 免許を維持するために罰金を支払わなければならない
    D: 仮免許に格下げされる
  answer: B
  explanation: 15歳以上の生徒が学校を中退した場合、学校は安全省に通知する義務があり、安全省はその生徒の運転特権を停止します。
- id: 200
  category: license_system
  question: 18歳未満の申請者が高校を卒業するかGED（高卒認定）を取得した場合、どの種類の免許が発行されますか？
  choices:
    A: 仮免許のみ
    B: 中間制限付き免許
    C: 通常のクラスD運転免許
    D: ハードシップ免許（特別な事情による免許）
  answer: C
  explanation: 18歳になる前に高校を卒業するかGEDを取得した場合、通常のクラスD運転免許が発行されることがあります。
- id: 201
  category: license_system
  question: 16歳の申請者が他州の運転免許証を90日未満保持していた場合、制限付き中間免許（Intermediate Restricted License）を取得するには、有効な仮免許（learner
    permit）および/または運転免許証を合計でどのくらいの期間保持している必要がありますか？
  choices:
    A: 少なくとも60日間
    B: 少なくとも90日間
    C: 少なくとも180日間
    D: 少なくとも365日間
  answer: C
  explanation: 申請者が他州の免許証を90日未満保持していた場合、有効な仮免許および/または運転免許証を合計で少なくとも180日間保持していたことが運転記録で確認されなければなりません。
- id: 202
  category: penalties_and_points
  question: 仮免許（Learner Permit）を持つ10代の運転者が、運転記録に6ポイント以上を累積した場合、どのような罰則がありますか？
  choices:
    A: 連続180日間、6ポイント未満の記録を維持できるようになるまで、仮免許を保持し続けなければならない
    B: 18歳になるまで仮免許が取り消される
    C: 認定された運転者教育コースを修了しなければならない
    D: 直ちに制限付き中間免許が発行される
  answer: A
  explanation: 段階的運転免許（GDL）の罰則表によると、仮免許発行後に6ポイント以上を累積した場合、申請者は連続180日間、6ポイント未満の記録を維持できるようになるまで、追加の期間仮免許を保持し続ける必要があります。
- id: 203
  category: penalties_and_points
  question: 10代の運転者が制限付き中間免許（Intermediate Restricted License）の期間中に2回目のシートベルト違反を犯したが、無制限中間免許（Intermediate
    Unrestricted License）が発行された後になって初めて安全局（DOS）に通知された場合、どうなりますか？
  choices:
    A: 違反は免除され、罰則は適用されない
    B: 免許が永久に取り消される
    C: 90日間、制限付き中間免許に降格される
    D: 500ドルの罰金を支払わなければならない
  answer: C
  explanation: 記載されている違反のいずれかが、10代の運転者が制限付き中間免許を保持している期間中に発生したものの、安全局（DOS）が通知を受け取ったのが、すでに無制限中間免許を発行した後であった場合、その運転者は90日間、制限付き中間免許に「降格（dropped
    back）」されます。
- id: 204
  category: penalties_and_points
  question: 学生が2回目に学校を中退した場合、どうなりますか？
  choices:
    A: 50ドルの罰金を支払わなければならない。
    B: 再び免許を申請するには18歳になるまで待たなければならない。
    C: 再申請するには6ヶ月待たなければならない。
    D: 運転の特権を永久に失う。
  answer: B
  explanation: マニュアルによると、学生が2回目に中退した場合、再び免許を申請する資格を得るには18歳になるまで待たなければなりません。
- id: 205
  category: license_system
  question: 中退した学生が運転の特権を取り戻すために復学した場合、復帰手数料（reinstatement fee）はいくらですか？
  choices:
    A: 10ドル
    B: 20ドル
    C: 50ドル
    D: 100ドル
  answer: B
  explanation: マニュアルには、復学する学生は、該当する申請料および免許証の料金に加えて、20ドルの復帰手数料を支払う必要があると記載されています。
- id: 206
  category: penalties_and_points
  question: 仮免許（learner permit）保持者が運転中に携帯電話を使用しているところを摘発された場合、どのような結果になりますか？
  choices:
    A: 仮免許の180日間の停止
    B: 運転記録に6ポイントが加算される
    C: 100ドルの罰金
    D: 18歳になるまで仮免許が即時取り消される
  answer: B
  explanation: 10代の運転者が運転中に携帯電話を使用したことで有罪判決を受けた場合の結果には、クラスCの軽犯罪、50ドルの罰金、未成年者の運転記録への6ポイントの加算、および制限付き中間免許（Intermediate
    Restricted Driver License）の取得資格の90日間の遅延が含まれます。
- id: 207
  category: safe_driving_rules
  question: 運転中のテキストメッセージ送信違反に対する最大罰金はいくらですか？
  choices:
    A: 20ドル
    B: 50ドル
    C: 100ドル
    D: 250ドル
  answer: B
  explanation: 運転中のテキストメッセージ送信違反は、50ドルを超えない罰金および10ドルを超えない裁判費用が科される可能性があります。
- id: 208
  category: defensive_driving
  question: マニュアルによると、作業区間（work zone）での事故の主な原因は何ですか？
  choices:
    A: スピード違反
    B: 正面衝突
    C: 追突事故
    D: わき見運転
  answer: C
  explanation: マニュアルの作業区間の安全に関するヒントには、「車間距離を詰めないでください！作業区間での事故のほとんどは追突事故によって引き起こされます」と明記されています。
- id: 209
  category: safe_driving_rules
  question: 作業区間（work zone）に近づく際、車のヘッドライトをどうするべきですか？
  choices:
    A: 作業員の目を眩ませないように消灯する
    B: 自分の存在を作業員に知らせるために点滅させる
    C: 雨が降っている場合のみ点灯する
    D: 区間に入る前に点灯する
  answer: D
  explanation: マニュアルでは、「区間に入る前にライトを点灯してください！作業員や他の運転手から見えやすくするために、車のヘッドライトを点灯してください」と運転手にアドバイスしています。
- id: 210
  category: license_system
  question: 18歳未満の仮免許（learner permit）保持者に対する運転時間の制限は何ですか？
  choices:
    A: 午後10時から午前6時までの運転が禁止されている
    B: 午後11時から午前6時までの運転が禁止されている
    C: 午後9時から午前5時までの運転が禁止されている
    D: 深夜0時から午前6時までの運転が禁止されている
  answer: A
  explanation: 仮免許を持つ18歳未満の人は、午後10時から午前6時までの間の運転が禁止されています。
- id: 211
  category: license_system
  question: 18歳未満の10代の運転者が中間制限付き免許 (Intermediate Restricted license) を申請する前に、仮免許 (learner
    permit) を保持しなければならない期間はどれくらいですか？
  choices:
    A: 最低3ヶ月
    B: 最低6ヶ月
    C: 最低9ヶ月
    D: 最低1年
  answer: B
  explanation: 18歳未満の人は、中間制限付き免許を申請する前に、最低6ヶ月間仮免許を保持していなければなりません。
- id: 212
  category: license_system
  question: 仮免許保持者が運転記録に6点以上の違反点数を累積した場合、中間制限付き免許を申請する前にどうしなければなりませんか？
  choices:
    A: 50ドルの免許回復手数料を支払わなければならない。
    B: 防衛運転講習を修了しなければならない。
    C: 連続180日間、違反点数が6点未満の記録を維持しなければならない。
    D: 18歳になるまで待たなければならない。
  answer: C
  explanation: 仮免許保持者が交通違反により合計6点以上の違反点数を受けた場合、その記録が連続して180日間6点未満になるまで、仮免許を保持し続けなければなりません。
- id: 213
  category: safe_driving_rules
  question: 例外条件を満たさない場合、中間制限付き免許保持者が車に乗せることができる同乗者は何人ですか？
  choices:
    A: 0人
    B: 1人
    C: 2人
    D: 3人
  answer: B
  explanation: 中間免許保持者は、特定の例外条件（制限なし免許を持つ21歳以上の同乗者がいる場合や、親の同意書を持った兄弟姉妹など）を満たさない限り、車内に1人のみ同乗者を乗せることができます。
- id: 214
  category: license_system
  question: 中間制限付き免許保持者が原則として運転を禁止されている時間帯はいつですか？
  choices:
    A: 午後9時から午前6時
    B: 午後10時から午前6時
    C: 午後11時から午前6時
    D: 深夜0時から午前5時
  answer: C
  explanation: 中間制限付き免許保持者は、特定の免除条件を満たさない限り、午後11時から午前6時までの間の運転が禁止されています。
- id: 215
  category: penalties_and_points
  question: 許可された時間外に運転するための偽造された許可書を所持していて摘発された場合、中間制限付き免許保持者に科される罰則は何ですか？
  choices:
    A: 50ドルの罰金と運転記録への6点の加点
    B: 免許の取り消し、および18歳になるまでの仮免許の再交付
    C: 90日間の免許停止
    D: 即時の車両押収
  answer: B
  explanation: 偽造または不正な許可書を所持していたとして有罪判決を受けた中間制限付き免許保持者は、中間制限付き免許が取り消され、18歳に達するまで仮免許のみが再交付されます。
- id: 216
  category: license_system
  question: 制限なし中間免許 (Unrestricted Intermediate license) を申請する前に、中間制限付き免許をどのくらいの期間保持しなければなりませんか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 18ヶ月
    D: 2年
  answer: B
  explanation: 10代の運転者は、制限なし中間免許を申請する前に、最低1年間は中間制限付き免許を保持しなければなりません。
- id: 217
  category: sharing_the_road
  question: 高速道路の道路工事区間における死亡者の5人に4人を占めているのは誰ですか？
  choices:
    A: 建設作業員
    B: 歩行者
    C: 運転者
    D: 交通誘導員
  answer: C
  explanation: マニュアルによると、統計上、高速道路の道路工事区間における死亡者の5人に4人を運転者が占めています。
- id: 218
  category: safe_driving_rules
  question: 中間制限付き免許保持者が午前4時から午前6時の間に運転できるのは、次の場合です：
  choices:
    A: 友人の家へ行く、または帰る途中である
    B: 狩猟や釣りに行く、または帰る途中で、有効な狩猟免許または釣り免許を所持している
    C: ジムやフィットネスセンターへ行く途中である
    D: 18歳以上の兄弟姉妹が同乗している
  answer: B
  explanation: 午後11時から午前6時までの運転禁止の例外として、運転者が午前4時から午前6時の間に狩猟や釣りに行く、または帰る途中で、有効な狩猟免許または釣り免許を所持している場合があります。
- id: 219
  category: penalties_and_points
  question: 制限なし中間免許の取得資格を得るのが90日間遅れる原因となるのは、次のうちどれですか？
  choices:
    A: 運転記録に4点の違反点数を受ける
    B: 初めてのシートベルト違反で有罪となる
    C: 交通事故の原因となる
    D: 午後10時以降に運転する
  answer: C
  explanation: 10代の運転者が交通事故の原因となった場合、6点以上の違反点数を受けた場合、または2回目のシートベルト違反で有罪となった場合、制限なし中間免許の取得資格がさらに90日間保留されます。
- id: 220
  category: penalties_and_points
  question: 10代の運転者が中間制限付き運転免許を保持している間に2回目の交通違反 (moving violation) を犯した場合、制限なし免許を受け取る前に何をしなければなりませんか？
  choices:
    A: 50ドルの罰金を支払う
    B: さらに6ヶ月待つ
    C: 認可された運転者教育クラスを修了する
    D: 路上技能試験を再受験する
  answer: C
  explanation: 10代の運転者が中間制限付き運転免許を保持している間に2回目の交通違反を犯した場合、制限なし中間運転免許を受け取る前に、認可された運転者教育クラスを修了しなければなりません。
- id: 221
  category: license_system
  question: 仮免許（クラスPD）を所持する10代の運転者の運転禁止時間（門限）は何時ですか？
  choices:
    A: 午後9時から午前5時までは運転できない
    B: 午後10時から午前6時までは運転できない
    C: 午後11時から午前6時までは運転できない
    D: 深夜0時から午前6時までは運転できない
  answer: B
  explanation: 仮免許（クラスPD）の制限事項には、運転者は午後10時から午前6時まで運転できないと定められています。
- id: 222
  category: driver_testing
  question: 学科試験に不合格となった後の義務付けられた待機期間はどのくらいですか？
  choices:
    A: 待機期間はない
    B: 1日
    C: 7日
    D: 30日
  answer: B
  explanation: 学科試験に不合格となった後は、1日間の待機期間が義務付けられています。
- id: 223
  category: driver_testing
  question: 必須の運転免許試験で不正行為（カンニング）が発覚した場合、どうなりますか？
  choices:
    A: 警告を受け、試験を最初からやり直さなければならない
    B: 自動的に不合格となり、7日間は再受験できない
    C: 自動的に不合格となり、30日間は再受験できない
    D: 運転免許の取得が永久に禁止される
  answer: C
  explanation: 必須試験においていかなる形であれ不正行為を行った場合、自動的に不合格となり、30日間は再受験が認められません。
- id: 224
  category: driver_testing
  question: 運転免許の視力検査に合格するための最低視力要件は何ですか？
  choices:
    A: 両眼ともそれぞれ20/20（1.0）の視力
    B: 両眼ともそれぞれ20/30（約0.7）の視力
    C: 左右それぞれの眼、および両眼で見たときに20/40（0.5）の視力
    D: 少なくとも片眼で20/50（0.4）の視力
  answer: C
  explanation: 申請者は、左右それぞれの眼、および両眼で見たときに少なくとも20/40（0.5）の視力が必要です。これは眼鏡やコンタクトレンズを使用しても、使用しなくても構いません。
- id: 225
  category: driver_testing
  question: コンピューターによる学科試験中に許可されていないものは次のうちどれですか？
  choices:
    A: スペイン語での受験
    B: メモや書き込みのない翻訳辞書の使用
    C: 韓国語での受験
    D: 電子辞書やスマートフォンの使用
  answer: D
  explanation: 試験中、携帯情報端末（PDA）、スマートフォン、電子辞書、およびその他の類似の電子機器の使用は許可されていません。
- id: 226
  category: driver_testing
  question: 学科試験のうち、薬物とアルコールに関する問題が占める割合はどれくらいですか？
  choices:
    A: 10%
    B: 15%
    C: 25%
    D: 50%
  answer: C
  explanation: 学科試験は4つの分野で構成されており、そのうち薬物とアルコールに関する問題が試験の25%を占めています。
- id: 227
  category: license_system
  question: 21歳未満の者に発行されるすべての運転免許証の形式はどのようなものですか？
  choices:
    A: 横型（水平）フォーマット
    B: 縦型（垂直）フォーマット
    C: 正方形フォーマット
    D: 赤色で色分けされたフォーマット
  answer: B
  explanation: 2018年7月1日より、21歳未満の者に発行されるすべての免許証は縦型フォーマットになっています。
- id: 228
  category: driver_testing
  question: どのような天候条件の場合、実技試験（路上試験）は実施されませんか？
  choices:
    A: 小雨
    B: 曇り空
    C: 大雨、濃霧、路面の凍結などの悪天候
    D: 気温が40度（華氏）未満
  answer: C
  explanation: 実技試験は、悪天候（大雨/大雪、濃霧、ひょう、強風、路面の凍結など）の状況下では実施されません。
- id: 229
  category: license_system
  question: 中間制限付き免許（Intermediate Restricted license）を取得するには、何時間の運転練習（実技経験）を証明する必要がありますか？
  choices:
    A: 30時間（うち夜間5時間を含む）
    B: 40時間（うち夜間10時間を含む）
    C: 50時間（うち夜間10時間を含む）
    D: 60時間（うち夜間15時間を含む）
  answer: C
  explanation: 中間制限付き免許を取得するには、夜間10時間を含む50時間の運転練習（実技経験）の証明書を提出する必要があります。
- id: 230
  category: driver_testing
  question: 18歳未満の申請者が学習障害を理由に口頭での学科試験を希望する場合、何を提出する必要がありますか？
  choices:
    A: 試験を読み上げる親または法定後見人の同伴
    B: 医師または教育専門家からの診断書（書面による声明）
    C: 認定手話通訳者
    D: 高校卒業の証明書
  answer: B
  explanation: 口頭試験を希望する申請者が18歳未満の場合、試験を実施する前に、申請者に医学的疾患または学習障害があることを記載した医師または教育専門家からの診断書（書面による声明）が必要となります。
- id: 231
  category: driver_testing
  question: 運転免許証または仮免許証の交付を受けるための最低視力要件は何ですか？
  choices:
    A: 片眼でそれぞれ20/20の視力
    B: 片眼でそれぞれ20/30の視力
    C: 片眼でそれぞれ20/40、かつ両眼で20/40の視力
    D: 少なくとも片眼で20/50の視力
  answer: C
  explanation: 申請者は、眼鏡やコンタクトレンズの使用の有無にかかわらず、片眼でそれぞれ20/40以上、かつ両眼で20/40以上の視力が必要です。
- id: 232
  category: driver_testing
  question: 運転免許の学科試験に不合格となった場合、再受験するまでにどのくらい待たなければなりませんか？
  choices:
    A: すぐに再受験できる
    B: 最低1日
    C: 7日間
    D: 30日間
  answer: B
  explanation: 運転免許の学科試験に不合格となった場合、再受験するためには義務として1日間の待機期間が必要です。
- id: 233
  category: driver_testing
  question: 予約した技能試験（ロードテスト）の時間に5分以上遅刻した場合、どうなりますか？
  choices:
    A: 運転試験で5点減点される
    B: 試験官が乗車前の車両点検を省略する
    C: 試験前に遅延手数料を支払わなければならない
    D: 技能試験はキャンセルされ、再予約が必要になる
  answer: D
  explanation: 予約時間から5分以上遅刻した場合、技能試験はキャンセルされ、後日改めて予約を取り直す必要があります。
- id: 234
  category: driver_testing
  question: 次のどの気象条件において、技能試験（ロードテスト）は実施されませんか？
  choices:
    A: 小雨
    B: 中程度の霧
    C: 小雪
    D: 大雨および雷雨
  answer: D
  explanation: 大雨、雷雨、濃霧、道路の冠水、雪や氷で覆われている・固まっている場合、または悪天候の警報発令中は、技能試験は実施されません。
- id: 235
  category: vehicle_information
  question: 何年以降に製造または組み立てられた乗用自動車には、シートベルトの装備が義務付けられていますか？
  choices:
    A: 1959年
    B: 1969年
    C: 1979年
    D: 1989年
  answer: B
  explanation: 1969年以降に製造または組み立てられたすべての乗用自動車には、シートベルトが装備されており、良好に使用できる状態でなければなりません。
- id: 236
  category: vehicle_information
  question: 自動車に装備が許可されている白色ヘッドライトの数はいくつですか？
  choices:
    A: ちょうど2個
    B: 2個以上4個以下
    C: 4個以上
    D: 1個から4個
  answer: B
  explanation: 自動車には、少なくとも2個、最大で4個以下の白色ヘッドライトを装備しなければなりません。
- id: 237
  category: vehicle_information
  question: 乗用車の場合、窓のカーフィルム（スモークフィルム）は可視光線を少なくとも何パーセント透過するものでなければなりませんか？
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 75%
  answer: B
  explanation: 乗用車の場合、可視光線の透過率が35%未満の素材を窓に貼り付けることはできません。
- id: 238
  category: vehicle_information
  question: 乗用車のバンパーは、地上からどの範囲の高さになければなりませんか？
  choices:
    A: 10〜15インチ
    B: 14〜22インチ
    C: 14〜31インチ
    D: 20〜30インチ
  answer: B
  explanation: 乗用車には、地上から14〜22インチの範囲内にあるバンパーを装備しなければなりません。
- id: 239
  category: driver_testing
  question: 運転試験中、あなたと一緒に車に乗ることが許可されているのは誰ですか？
  choices:
    A: あなた、試験官、および親または保護者1名
    B: あなたと試験官（またはその他の許可された職員）のみ
    C: あなた、試験官、および通訳者
    D: あなた、試験官、および運転指導員
  answer: B
  explanation: 車内に同乗できるのは、あなたと試験官（またはその他の許可された職員）のみです。動物を車に乗せることはできません。
- id: 240
  category: driver_testing
  question: 次の行動のうち、技能試験（ロードテスト）が即座に自動的に不合格となるものはどれですか？
  choices:
    A: 試験官に指示を繰り返すよう頼むこと
    B: 交通法規の違反
    C: 一時停止標識で急ブレーキをかけること
    D: 出発前にフロントガラスの曇りを取らないこと
  answer: B
  explanation: 申請者は、交通法規の違反、非協力的な態度、危険な行為、または事故の原因となる行為のいずれかを行った場合、即座に不合格となります。
- id: 241
  category: driver_testing
  question: 再試験のガイドラインによると、技能試験で7〜9個のエラー（減点）を犯した場合、再試験を受けるまでに必要な義務的な練習期間はどのくらいですか？
  choices:
    A: 翌日（1日）
    B: 7日間
    C: 14日間
    D: 30日間
  answer: A
  explanation: 再試験のガイドライン（表4.2）によると、7〜9個のエラー/減点があった場合、翌日（1日）までの義務的な練習期間が必要です。
- id: 242
  category: driver_testing
  question: 運転試験で自動的に不合格（一発不合格）になった場合、または16個以上のエラーを犯した場合、再試験が許可されるまでどのくらい待たなければなりませんか？
  choices:
    A: 翌日（1日）
    B: 7日間
    C: 14日間
    D: 30日間
  answer: D
  explanation: 表4.2によると、16個以上のエラー/減点、または自動的な不合格（一発不合格）の場合、30日間の義務的な練習期間が必要です。
- id: 243
  category: vehicle_information
  question: 法律により、すべての自動車にはブレーキをかけるための2つの独立した方法が備わっていなければなりません。それはどれですか？
  choices:
    A: フロントブレーキとリアブレーキ
    B: 通常のフットブレーキとパーキングブレーキ
    C: アンチロックブレーキと標準ブレーキ
    D: ハンドブレーキとエンジンブレーキ
  answer: B
  explanation: 法律により、すべての自動車にはブレーキをかけるための2つの独立した方法が備わっていなければなりません。通常のフットブレーキとパーキングブレーキの両方が必要です。
- id: 244
  category: driver_testing
  question: 予約した路上試験の時間のどれくらい前に、運転免許サービスセンターに到着するように計画すべきですか？
  choices:
    A: 予約時間ちょうど
    B: 少なくとも5分前
    C: 少なくとも15分前
    D: 少なくとも30分前
  answer: C
  explanation: 書類手続きの時間を確保するため、予約時間の少なくとも15分前には運転免許サービスセンターに到着するように計画してください。
- id: 245
  category: vehicle_information
  question: 自動車のフロントガラスに貼付される着色（ティント）フィルムに関する規則は何ですか？
  choices:
    A: 可視光線の少なくとも35%を透過しなければならない
    B: 可視光線の50%を透過する場合は許可される
    C: フロントガラスにはいかなる着色フィルムも貼付してはならない
    D: フロントガラスの上部4インチにのみ許可される
  answer: C
  explanation: マニュアルには「いかなる自動車のフロントガラスにも、着色フィルムを貼付してはならない」と記載されています。
- id: 246
  category: driver_testing
  question: 申請者が技能試験で16個以上のエラーを犯した場合、または自動的に不合格（一発不合格）になった場合、再試験を受けるまでに必要な義務的な練習期間はどのくらいですか？
  choices:
    A: 7日間
    B: 14日間
    C: 30日間
    D: 90日間
  answer: C
  explanation: マニュアルには、16個以上のエラー/減点、または自動的な不合格（一発不合格）の場合、再試験が許可されるまでに30日間の義務的な練習期間が必要であると記載されています。
- id: 247
  category: driver_testing
  question: 予約した路上試験の時間のどれくらい前に到着すべきですか？
  choices:
    A: 少なくとも5分前
    B: 少なくとも10分前
    C: 少なくとも15分前
    D: 少なくとも30分前
  answer: C
  explanation: 申請書類の手続きに時間を確保するため、予約した路上試験の少なくとも15分前には到着する必要があります。
- id: 248
  category: driver_testing
  question: 路上試験の予約時間に少なくとも何分遅刻すると、予約を取り直さなければなりませんか？
  choices:
    A: 5分
    B: 10分
    C: 15分
    D: 20分
  answer: A
  explanation: スムーズなサービスを提供するため、路上試験の開始時間に5分以上遅刻した場合、予約を取り直す必要があります。
- id: 249
  category: driver_testing
  question: 15歳から17歳の10代の若者は、親または法定後見人の監督の下、どのアプリを使用してオンラインで筆記知識試験を受けることができますか？
  choices:
    A: テネシー・ドライバー・ポータル・アプリ (Tennessee Driver Portal App)
    B: テネシー・プロクター・アイデンティフィケーション (PID) アプリ
    C: TDOSHS・セキュア・テスト・アプリ (TDOSHS Secure Test App)
    D: テネシー・ティーン・ドライバー・アプリ (Tennessee Teen Driver App)
  answer: B
  explanation: 15歳から17歳の10代の若者は、テネシー・プロクター・アイデンティフィケーション (PID) アプリを通じて、試験監督者の監督の下、オンラインで筆記試験を受けることができます。
- id: 250
  category: safe_driving_rules
  question: 座席をリクライニング（後方に倒した）状態、または半リクライニング状態で運転することが危険なのはなぜですか？
  choices:
    A: シートベルトが外れるリスクが高まるため。
    B: 視界が狭まり、緊急事態に対応する能力が低下するため。
    C: ハンドルがロックする原因となるため。
    D: エアバッグの展開を妨げるため。
  answer: B
  explanation: マニュアルには明確に次のように記載されています。「座席をリクライニング、または半リクライニング状態にして運転しないでください。これは危険であり、視界が狭まり、緊急事態に対応する能力が低下します。」
- id: 251
  category: vehicle_information
  question: エアバッグ作動時の頭部や首の重傷を防ぐため、体はステアリングホイール（ハンドル）からどのくらい離れた位置にするべきですか？
  choices:
    A: 4〜6インチ
    B: 6〜8インチ
    C: 10〜12インチ
    D: 15〜18インチ
  answer: C
  explanation: 体はステアリングホイールから約10〜12インチ離す必要があります。それより近くに座ると、エアバッグが顎や顔に当たり、頭や首に重傷を負う可能性があります。
- id: 252
  category: vehicle_information
  question: シートとステアリングコラムを調整する際、ステアリングホイールの最上部はどの高さより下になるようにすべきですか？
  choices:
    A: 肩の最上部。
    B: 顎。
    C: 鼻。
    D: 頭の最上部。
  answer: A
  explanation: マニュアルには、ステアリングホイールの最上部は肩の最上部より高くならないようにすべきだと記載されています。
- id: 253
  category: vehicle_information
  question: 適切に調整されたシートのヘッドレストは、後頭部と同じ高さに設定する必要があります。これは何を防ぐためですか？
  choices:
    A: エアバッグによる負傷。
    B: 追突された際のむち打ち症。
    C: 運転中の眠気。
    D: 死角。
  answer: B
  explanation: シートのヘッドレストは、後頭部と同じ高さになるように適切に調整してください。ヘッドレストは、後方から追突された際のむち打ち症を防ぐように設計されています。
- id: 254
  category: safe_driving_rules
  question: 運転の準備をする際、ミラーの調整はいつ行うべきですか？
  choices:
    A: シートを調整する前。
    B: シートを正しく調整した後。
    C: 低速で運転している最中。
    D: 死角を確認した後のみ。
  answer: B
  explanation: マニュアルでは、シートを正しく調整した後、そして必ず運転を開始する前にミラーを調整するよう指示しています。
- id: 255
  category: vehicle_information
  question: 運転席側（左側）のサイドミラーを適切に調整するには、左側の窓に頭を当て、ミラーをどのように設定すべきですか？
  choices:
    A: 車のリアバンパー全体が見えるようにする。
    B: 車のセンターコンソールが見えるようにする。
    C: ミラーの右端に自分の車の側面がわずかに見えるようにする。
    D: リアウィンドウが完全に枠に収まって見えるようにする。
  answer: C
  explanation: 左側のサイドミラーを調整するには、左側の窓に頭を当て、ミラーの右端に自分の車の側面がわずかに見えるように設定します。
- id: 256
  category: vehicle_information
  question: 助手席側（右側）のサイドミラーを適切に調整するには、頭をどの位置に置くべきですか？
  choices:
    A: 左側の窓に当てる。
    B: センターコンソールの真上。
    C: 助手席側の窓に当てる。
    D: フロントガラスをまっすぐ前を見る。
  answer: B
  explanation: 助手席側のサイドミラーを調整するには、頭がセンターコンソールの真上にくるように位置を合わせます。
- id: 257
  category: defensive_driving
  question: ミラーが適切に調整されている場合でも、曲がったり車線変更をしたりする前に、必ず行わなければならないことは何ですか？
  choices:
    A: クラクションを鳴らして他の運転手に警告する。
    B: 頭を向けて死角を確認する。
    C: ヘッドライトを2回点滅させる。
    D: ルームミラー（バックミラー）に完全に頼る。
  answer: B
  explanation: 適切に配置されたミラーでも、すべての死角をなくすことはできません。曲がったり車線変更をしたりする際は、必ず頭を向けて死角を確認してください。
- id: 258
  category: safe_driving_rules
  question: ラップベルト（腰ベルト）は、体のどの位置に適切に合わせるべきですか？
  choices:
    A: 胃のあたりに緩くかける。
    B: 腰骨（骨盤）のあたりにしっかりと密着させる。
    C: 腹部の上の方にかける。
    D: 太ももの上部から膝にかけてかける。
  answer: B
  explanation: ラップベルトは腰骨のあたりにしっかりと密着させ、ショルダーベルトは肩にしっかりと密着させる必要があります。
- id: 259
  category: vehicle_information
  question: オートマチック（AT）車を始動する前に、ブレーキペダルに足を置き、シフトレバーがどの位置にあることを確認すべきですか？
  choices:
    A: ニュートラル (NEUTRAL)
    B: ドライブ (DRIVE)
    C: パーキング (PARK)
    D: リバース (REVERSE)
  answer: C
  explanation: ブレーキペダルに足を置き、オートマチック車の場合はシフトレバーがパーキング（PARK）の位置にあること、マニュアル車の場合はニュートラル（NEUTRAL）の位置にあることを確認してください。
- id: 260
  category: vehicle_information
  question: オートマチック（AT）車を始動する前、シフトレバーはどの位置にあるべきですか？
  choices:
    A: ドライブ (DRIVE)
    B: リバース (REVERSE)
    C: ニュートラル (NEUTRAL)
    D: パーキング (PARK)
  answer: D
  explanation: オートマチック車を始動する前に、ブレーキペダルに足を置き、シフトレバーがパーキング（PARK）の位置にあることを確認してください。
- id: 261
  category: vehicle_information
  question: マニュアルトランスミッション（MT）車で、エンジンを始動する前にしなければならないことは何ですか？
  choices:
    A: クラッチを踏み込まなければならない。
    B: ギアを1速に入れなければならない。
    C: アクセルを2回踏み込まなければならない。
    D: ステアリングホイール（ハンドル）をロックしなければならない。
  answer: A
  explanation: マニュアルトランスミッション車では、エンジンを始動する前にクラッチを踏み込む必要があります。
- id: 262
  category: safe_driving_rules
  question: 通常の日中にロービームのヘッドライトを点灯すると、車両の視認性にどのような影響がありますか？
  choices:
    A: バッテリーを消費し、視認性が低下する。
    B: 車両が2倍の距離から見えるようになる。
    C: 車両が3倍の距離から見えるようになる。
    D: 日中の視認性には影響しない。
  answer: B
  explanation: 通常の日中、ヘッドライトを点灯していると、車両は2倍の距離から見えるようになります。
- id: 263
  category: vehicle_information
  question: オートマチックトランスミッション（AT）車の低いギア（「L」、「2」、または「1」で示される）は、一般的にどのような場合に使用すべきですか？
  choices:
    A: ブレーキが故障した場合の緊急減速。
    B: 州間高速道路や高速道路を走行するとき。
    C: 直線で後退するとき。
    D: 通常のストップアンドゴーの交通状況。
  answer: A
  explanation: 低いギアは、ブレーキ故障時の緊急減速、急な山道の下り坂、滑りやすい道路での低速走行など、特殊な状況や緊急時を除いて一般的には使用されません。
- id: 264
  category: vehicle_information
  question: マニュアル（標準）トランスミッション車を運転する際、クラッチペダルを一番下まで踏み込んだままにするのはどのような時ですか？
  choices:
    A: 急な丘を下っているときはいつでも。
    B: 燃料を節約するために惰性走行するとき。
    C: 車両が動いている間は常に。
    D: 停止しようとして速度が10 MPH（約16 km/h）を下回ったとき。
  answer: D
  explanation: 発進時、ギアチェンジ時、および停止しようとして速度が10 MPH（約16 km/h）を下回ったときには、クラッチペダルを一番下まで踏み込んだままにする必要があります。
- id: 265
  category: safe_driving_rules
  question: ギアをニュートラルにして惰性走行することについて、マニュアルにはどのように記載されていますか？
  choices:
    A: 燃料節約のために推奨されている。
    B: 違法である。
    C: 急な丘でのみ行うべきである。
    D: 減速するための最も安全な方法である。
  answer: B
  explanation: マニュアルには次のように記載されています。「ギアをニュートラルにして惰性走行したり（違法です）、ギアチェンジの時以外にクラッチペダルを踏み込んだまま惰性走行したりしないでください。」
- id: 266
  category: safe_driving_rules
  question: ステアリングホイール・インターロックシステム（ハンドルロック機能）を搭載した車両を運転する際、運転者が従わなければならない基本的なルールは何ですか？
  choices:
    A: イグニッションをオフにする前に、必ずステアリングホイールをロックする。
    B: 車両が動いているときは、絶対にイグニッションをロック位置に回さない。
    C: 丘に駐車しているときは、絶対にインターロックシステムを使用しない。
    D: 常に片手をインターロック解除ボタンに置いておく。
  answer: B
  explanation: 基本的なルールは、車両が動いているときは絶対にイグニッションをロック位置に回さないことです。ステアリングホイールがロックされ、車両の制御を失うためです。
- id: 267
  category: safe_driving_rules
  question: ドアに肘や腕を乗せたり、窓から腕を出したりして運転するのを避けるべきなのはなぜですか？
  choices:
    A: ステアリングホイールがロックする原因になるため。
    B: テネシー州では違法であるため。
    C: ステアリングホイールを完全に制御できなくなり、側面衝突で腕を失う可能性があるため。
    D: サイドエアバッグの展開を妨げるため。
  answer: C
  explanation: ドアに肘や腕を乗せたり、窓から腕を出したりして運転する習慣をつけないでください。ステアリングホイールを完全に制御できなくなり、側面衝突で腕を失う危険性があります。
- id: 268
  category: safe_driving_rules
  question: エアバッグの展開による怪我を防ぐために推奨される、ステアリングホイール（ハンドル）上の手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 8時と4時の位置
    C: 9時と3時の位置
    D: 12時と6時の位置
  answer: C
  explanation: 運転者は、ステアリングホイールの9時の位置に左手を、3時の位置に右手を置く必要があります。この位置は、事故時にエアバッグが展開した際の怪我を防ぐのに役立ちます。
- id: 269
  category: safe_driving_rules
  question: ハンドル操作や方向転換の際に腕を交差させることが推奨されないのはなぜですか？
  choices:
    A: 車両が意図せず加速する原因になるため。
    B: 違法であり、運転免許試験に不合格になるため。
    C: 運転者が方向指示器（ウィンカー）を使用できなくなるため。
    D: 衣服や装飾品が安全な方向転換を妨げ、エアバッグによる怪我を悪化させる可能性があるため。
  answer: D
  explanation: ハンドル操作や方向転換の際に腕を交差させないでください。腕を交差させると、衣服や装飾品が安全な方向転換を妨げる可能性があり、エアバッグが展開した場合により深刻な怪我を負うことになります。
- id: 270
  category: safe_driving_rules
  question: 通常の日常運転において、ハンド・オーバー・ハンド（腕を交差させる）方式よりもプッシュ・プル（押し引き）方式のハンドル操作が推奨されるのはなぜですか？
  choices:
    A: 緊急時により素早くハンドルを動かせるため。
    B: 操作中ずっと両手をステアリングホイールに置いておけるため。
    C: ハンドルを回すのに必要な体力が少なくて済むため。
    D: パワーステアリングで機能する唯一の方法であるため。
  answer: B
  explanation: プッシュ・プル方式は、回転の動きを遅くすることで、よりスムーズで安全な方向転換ができるため推奨されています。また、操作中ずっと両手をステアリングホイールに置いておくことができます。
- id: 271
  category: safe_driving_rules
  question: オートマチック車を後退（バック）させるときの正しい手の位置と姿勢はどれですか？
  choices:
    A: 左手でハンドルの12時の位置を握り、右を向いて、右腕をシートの背もたれに置く。
    B: 両手でハンドルの9時と3時の位置を握り、ルームミラーを見る。
    C: 右手でハンドルの6時の位置を握り、運転席側の窓の外を見る。
    D: 両手をハンドルに置いたまま、バックカメラのみに頼る。
  answer: A
  explanation: 後退（バック）するときは、左手でハンドルの12時の位置を握り、右を向いて右腕をシートの背もたれに置き、肩越しにリアウィンドウ（後部窓）から後方を確認します。
- id: 272
  category: driver_responsibility
  question: 車のエンジンから排出される一酸化炭素ガスについて、正しいものは次のうちどれですか？
  choices:
    A: 漏れを運転手に警告する、強くて独特な臭いがある。
    B: 車内に漏れると、濃い黒煙として現れる。
    C: 閉め切ったガレージに車が駐車されている場合にのみ危険である。
    D: 無味、無臭、無色であるが、死に至る危険性がある。
  answer: D
  explanation: 車のエンジンから排出される一酸化炭素ガスは、死に至る危険性があります（無味、無臭、無色です）。一般的に、車のヒーターを作動させているとき、排気システムが正常に機能していないとき、または渋滞時に漏れ出します。
- id: 273
  category: defensive_driving
  question: マニュアルによると、テネシー州で毎年記録される最も一般的な事故の種類は何ですか？
  choices:
    A: 正面衝突
    B: 側面衝突（こすり合わせ）
    C: 追突事故
    D: 交差点でのT字衝突（側面衝突）
  answer: C
  explanation: ほとんどの州と同様に、テネシー州でも追突事故が毎年記録される最も一般的な事故の種類であると報告されています。
- id: 274
  category: safe_driving_rules
  question: 適切に駐車するために縁石に寄せて停車する場合、縁石からどのくらい近づけるべきですか？
  choices:
    A: 6インチ（約15cm）以内
    B: 12インチ（約30cm）以内
    C: 18インチ（約45cm）以内
    D: 24インチ（約60cm）以内
  answer: C
  explanation: 縁石に寄せて停車する場合、適切に駐車するために縁石から18インチ以内に近づけてください。
- id: 275
  category: safe_driving_rules
  question: 車内での一酸化炭素中毒を防ぐための推奨される方法は、次のうちどれですか？
  choices:
    A: 渋滞中は外気導入ベントを開けたままにする。
    B: 暖機運転のために、閉め切ったガレージでエンジンをかけたままにする。
    C: 窓を閉め切って駐車している車内では、ヒーターやエアコンを使用しない。
    D: ガスの臭いがする場合にのみ排気システムを点検する。
  answer: C
  explanation: マニュアルには、一酸化炭素中毒を防ぐために「窓を閉め切って駐車している車内では、ヒーターやエアコンを使用しないこと」と記載されています。
- id: 276
  category: vehicle_information
  question: 一酸化炭素ガスの特徴は何ですか？
  choices:
    A: 強くて甘い臭いがする。
    B: 濃い黒煙として現れる。
    C: 無味、無臭、無色である。
    D: 腐った卵のような臭いがする。
  answer: C
  explanation: マニュアルによると、車のエンジンから排出される一酸化炭素ガスは「無味、無臭、無色」であるため、死に至る危険性があります。
- id: 277
  category: safe_driving_rules
  question: 2019年に施行されたハンズフリー・テネシー法（Hands Free Tennessee law）の下で、運転手にとって違法となる行為は次のうちどれですか？
  choices:
    A: ハンズフリーのナビゲーション機器を使用すること。
    B: シートベルトで適切に固定された状態を保てなくなるような姿勢で、携帯電話に手を伸ばすこと。
    C: 車両情報システムのディスプレイを使用すること。
    D: 車両後方の視界を確保するための映像ディスプレイを見ること。
  answer: B
  explanation: 公法第412号（Public Chapter No. 412）により、「運転手が座席に座った運転姿勢を保てなくなる、またはシートベルトで適切に固定された状態を保てなくなるような姿勢で、携帯電話やモバイル機器に手を伸ばすこと」は違法とされています。
- id: 278
  category: safe_driving_rules
  question: 点滅信号が作動している標識のあるスクールゾーンにおいて、18歳以上の運転手の携帯電話の使用に関する規則は何ですか？
  choices:
    A: ハンズフリーを含め、すべての電話の使用が厳格に禁止されている。
    B: 手に持っての電話の使用は違反だが、ハンズフリーモードは許可されている。
    C: 時速15マイル未満で運転している場合は、手に持っての電話の使用が許可されている。
    D: テキストメッセージの送信のみが禁止されており、手に持っての通話は許可されている。
  answer: B
  explanation: マニュアルには、点滅信号が作動している標識のあるスクールゾーンで18歳以上の人が手に持って携帯電話を使用することは違反であると記載されていますが、「電話がハンズフリーモードで使用されている場合は例外となる」とされています。
- id: 279
  category: vehicle_information
  question: 車両の走行中に、運転手の視界に入ることが許可されている映像機器は次のうちどれですか？
  choices:
    A: テレビ放送を表示している画面。
    B: 録画された映画を再生しているモニター。
    C: 全地球測位システム（GPS）機器。
    D: ライブ映像を配信しているタブレット。
  answer: C
