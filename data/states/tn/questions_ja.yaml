- id: 140
  category: driver_testing
  question: 18歳未満の申請者は、何時間の運転実技（behind-the-wheel）経験の証明書を提出する必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: 18歳未満の申請者は、仮免許（learner permit）を6ヶ月間保持した後、50時間の運転実技経験の証明書を提出する必要があります。
- id: 141
  category: license_system
  question: 商用運転免許証（CDL）を申請する際、社会保障番号（SSN）に関して正しいものは次のうちどれですか？
  choices:
    A: SSNを持っていない場合は、SSN宣誓供述書を使用できる。
    B: 商用免許にはSSNは必要ない。
    C: SSN宣誓供述書は認められていない。連邦規則により、CDL保持者はSSNを持つことが義務付けられている。
    D: 代わりに個人納税者番号（ITIN）を提出してもよい。
  answer: C
  explanation: 連邦規則により、CDL保持者はSSNを持つことが義務付けられています。商用免許を申請する際、SSN宣誓供述書は認められていません。
- id: 142
  category: license_system
  question: 他州から引っ越してきた場合、有効な他州の運転免許証は次のどれを証明するために使用できますか？
  choices:
    A: 米国市民権
    B: 合法的な永住権ステータス
    C: 身元（本人確認）
    D: テネシー州の居住証明
  answer: C
  explanation: 以前住んでいた州の有効な運転免許証は身元を証明するために使用できますが、米国市民権や合法的な永住権ステータスを証明するためには使用できません。
- id: 143
  category: license_system
  question: 現在の名前が身分証明書に記載されている名前と異なる場合、どうしなければなりませんか？
  choices:
    A: 婚姻証明書のコピーを郵送する
    B: 氏名変更を証明する法的文書の原本または認証済みのコピーを提出する
    C: 現在の免許証の有効期限が切れるまで変更を待つ
    D: 家族からの公証された手紙を持参する
  answer: B
