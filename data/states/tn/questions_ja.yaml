    C: 全国運転者条約
    D: 州外違反切符条約
  answer: B
  explanation: マニュアルには、運転者の責任に関する「非居住者違反者協定 (Non-Resident Violator Compact)」についての情報が含まれています。
- id: 80
  category: penalties_and_points
  question: 交通違反を繰り返した場合、運転者が受講を義務付けられる可能性があるプログラムは何ですか？
  choices:
    A: 運転者改善プログラム (Driver Improvement Program)
