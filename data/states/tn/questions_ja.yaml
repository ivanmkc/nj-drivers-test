    C: 180日間
    D: 1年間
  answer: C
  explanation: 18歳未満の場合、有効なクラスPD免許を180日間保持し、段階的運転免許（GDL）法のすべての要件を遵守しなければなりません。
- id: 112
  category: license_system
  question: 家族の困窮（ハードシップ）などの事情がある場合、未成年者は何歳でクラスH（ハードシップ）免許の交付を受けることができますか？
