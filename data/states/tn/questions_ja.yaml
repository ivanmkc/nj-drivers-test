    D: 子供。
  answer: B
  explanation: マニュアルには次のように記載されています。「子供の親または法定後見人が車に同乗しているが運転していない場合、親または法定後見人が子供を適切に乗車させる責任を負い、違反した場合は罰金を科される可能性があります。」
- id: 286
