    C: 停止する（STOP!）
    D: 損傷箇所の写真を撮る
  answer: C
  explanation: マニュアルには、「事故に巻き込まれた場合 — 停止すること（STOP!）」というルールが明記されています。
- id: 85
  category: defensive_driving
  question: 防衛運転（ディフェンシブ・ドライビング）と安全な道路共有において、重要な2つの要素は何ですか？
  choices:
    A: 速度と攻撃性
    B: 集中力と注意力
    C: リラックスとマルチタスク
    D: 自信と優先権の主張
