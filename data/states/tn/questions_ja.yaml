    B: 「日常的」な薬（市販薬など）
    C: 処方された鎮痛剤のみ
    D: 合成興奮剤のみ
  answer: B
  explanation: マニュアルには、「日常的」な薬が影響下での運転（DUI）にどのように影響するかを特に取り上げたセクションが含まれています。
- id: 77
  category: alcohol_drugs_health
  question: 薬物またはアルコールの検査を受けることに関する運転者の義務に関連する法律は何ですか？
  choices:
    A: 絶対的禁酒法
    B: 黙示の同意法 (Implied Consent Law)
    C: 推定有罪法
    D: 開封済み容器法 (Open Container Law)
  answer: B
  explanation: マニュアルの「アルコール、その他の薬物、および運転」に関する章で、「黙示の同意法 (Implied Consent Law)」について説明されています。
- id: 78
  category: penalties_and_points
  question: 交通違反を繰り返す運転者を特定し、追跡するために使用されるシステムは何ですか？
  choices:
    A: 問題運転者ポインターシステム (Problem Driver Pointer System)
    B: 全国違反切符データベース
