  question: テネシー州の居住証明書は最新のものでなければなりません。マニュアルによると、「最新」とは過去どのくらいの期間内に日付が記載されたものを意味しますか？
  choices:
    A: 30日以内
    B: 60日以内
    C: 4ヶ月以内
    D: 6ヶ月以内
  answer: C
  explanation: マニュアルでは、有効なテネシー州の居住証明書は最新のものでなければならず、それは過去4ヶ月以内のものを意味すると規定されています。
- id: 139
  category: license_system
  question: 18歳未満の場合、在学証明書は過去どのくらいの期間内に署名および日付が記載されたものでなければなりませんか？
  choices:
