    D: この先スクールゾーンあり
  answer: C
  explanation: 8角形の標識は、道路上で唯一の8角形の標識です。常に赤地に白文字で、車を完全に停止させなければならないことを示しています。
- id: 310
  category: signs_and_signals
  question: 円形（丸型）の道路標識は、何に近づいていることを示していますか？
  choices:
    A: 十字路交差点
    B: 踏切
    C: 病院ゾーン
    D: ラウンドアバウト（環状交差点）
  answer: B
  explanation: 円形の標識は常に踏切に近づいていることを意味し、減速しなければなりません。
- id: 311
  category: safe_driving_rules
  question: 道路工事の作業員が前進するように指示しているが、信号機が赤の場合、どうすべきですか？
  choices:
    A: 信号が青に変わるのを待ってから進む。
    B: 作業員の指示に従って進む。
    C: 車を停めて警察官を待つ。
    D: クラクションを鳴らして他の運転手に警告する。
  answer: B
  explanation: 運転手は、警察官、道路工事の作業員、または学童擁護員（スクールクロッシングガード）の指示が、信号機や標識の指示と異なる場合でも、その指示に従わなければなりません。
- id: 312
  category: signs_and_signals
  question: 3辺の三角形の「ゆずりあい（Yield）」標識に近づいた際、交差する道路から他の車両が接近している場合、どうしなければなりませんか？
  choices:
    A: 加速してそれらの車両の前に合流する。
    B: 速度を維持し、クラクションを鳴らす。
    C: 停止して、接近してくる車両を待つ。
    D: 自分に優先権があるため、停止せずに進む。
  answer: C
  explanation: 3辺の「ゆずりあい（Yield）」標識は、交差する道路の左右から他の車両が接近している場合、停止して待たなければならないことを意味します。
- id: 313
  category: signs_and_signals
  question: 青色の交通標識が示しているものは次のうちどれですか？
  choices:
    A: 工事区間
    B: 警察や休憩所などの運転手向けサービス
    C: 一般的な警告
    D: 許可された駐車規則
  answer: B
  explanation: 青色は、運転手向けサービス（警察のサービスや休憩所を含む）および緊急避難経路標識（Emergency Route Marker）に関連する案内標識の背景色として使用されます。
- id: 314
  category: safe_driving_rules
  question: チャイルドシートの規則によると、子供を車の後方に向けて座らせるべきなのはどのような場合ですか？
  choices:
    A: 子供が1歳未満で、体重が20ポンド未満の場合。
    B: 子供が1歳から3歳までの場合。
    C: 子供の体重が20ポンドを超える場合。
    D: 子供が助手席に乗っている場合。
  answer: A
  explanation: チャイルドシート（幼児用補助装置）に乗る子供は、体重が20ポンド未満で1歳未満の場合、車の後方に向けて座らせる必要があります。
- id: 315
  category: signs_and_signals
  question: 一時停止（STOP）標識の下に設置された、「ALL WAY」と書かれた赤い長方形の標識は何を意味しますか？
  choices:
    A: 交差する交通のみが停止しなければならない。
    B: この交差点に接近するすべての車両が停止しなければならない。
    C: 安全が確認できれば、停止せずに進むことができる。
    D: 前方の道路はすべての車両に対して通行止めである。
  answer: B
  explanation: 一時停止標識の下に追加された「ALL WAY」と書かれた赤い長方形の標識は、この交差点に接近するすべての車両が停止しなければならないことを意味します。
- id: 316
  category: signs_and_signals
  question: 3辺の「ゆずりあい（Yield）」標識に近づいた際、どうすべきですか？
  choices:
    A: 交通状況に関係なく、常に完全に停止する。
    B: 交差する交通にスムーズに合流するために加速する。
    C: 減速し、他の車が来ていない場合は注意して交差点に進入する。
    D: 信号機がある場合のみ停止する。
  answer: C
  explanation: マニュアルには、「ゆずりあい（Yield）」標識において、他の車が来ていないことが確実な場合は完全に停止する必要はありませんが、減速して注意しながら交差点に進入しなければならないと記載されています。
- id: 317
  category: signs_and_signals
  question: 幅の広い「X」字型の踏切標識（クロスバック標識）のすぐ下に設置されている小さな標識の目的は何ですか？
  choices:
    A: 踏切の制限速度を示している。
    B: その踏切にある線路の数を示している。
    C: 列車が通常通過する正確な時間を警告している。
    D: 次の幹線道路の交差点までの距離を示している。
  answer: B
  explanation: マニュアルには、クロスバック標識のすぐ下の支柱に設置された小さな標識は、その踏切の線路の数を示していると記載されています。
- id: 318
  category: safe_driving_rules
  question: マニュアルによると、踏切で列車より「先に通り抜けよう（beat a train）」としてはいけないのはなぜですか？
  choices:
    A: 列車は日中のみ優先権を持っているから。
    B: 通常、列車の速度を見誤るから。
    C: 最初に停止せずに線路を横断することは違法だから。
    D: 車のエンジンが線路の上でエンストするから。
  answer: B
  explanation: マニュアルでは運転手に対し、「絶対に列車より先に通り抜けようとしてはいけません。通常、列車の速度を見誤ります」と明確に警告しています。
- id: 319
  category: signs_and_signals
  question: 三角形の「追い越し禁止（No Passing Zone）」標識は、通常道路のどこに設置されていますか？
  choices:
    A: 道路の右側。
    B: 中央車線の真上に吊り下げられている。
    C: 道路の左側。
    D: 路面にペイントされた記号として。
  answer: C
  explanation: マニュアルには、三角形の「追い越し禁止（No Passing Zone）」標識は黄色またはオレンジ色で、道路の左側に設置されると記載されています。
- id: 320
  category: signs_and_signals
  question: 「曲がり角（turn）」の警戒標識と「カーブ（curve）」の警戒標識の違いは何ですか？
  choices:
    A: 曲がり角の標識は推奨速度が30 mph以下の場合に使用され、カーブの標識は30〜55 mphの速度の場合に使用される。
    B: 曲がり角の標識はオレンジ色で、カーブの標識は黄色である。
    C: 曲がり角の標識は行き止まりを示し、カーブの標識は曲がりくねった道を示す。
    D: 曲がり角の標識は右折専用で、カーブの標識は左折専用である。
  answer: A
  explanation: マニュアルには、曲がり角（turn）の標識は推奨速度が30 mph以下の曲がり角を示すために使用され、カーブ（curve）の標識は推奨速度が30〜55
    mphの範囲のカーブを示すために使用されると記載されています。
- id: 321
  category: defensive_driving
  question: 丘陵地帯で落石注意の警告標識を見た場合、何に注意すべきですか？
  choices:
    A: 頭上から直接車両に落ちてくる岩。
    B: すでに道路に落ちている可能性のある岩。
    C: 砂利を降ろしている工事車両。
    D: 高架橋から石を投げている歩行者。
  answer: B
  explanation: マニュアルでは、この標識は「頭上から落ちてくる岩ではなく、道路に落ちている可能性のある岩を警告するものです。丘ではなく道路に注意してください」と明確に説明されています。
- id: 322
  category: sharing_the_road
  question: 本線に合流してくる交通を知らせる警告標識を見た場合、どうすべきですか？
  choices:
    A: 速度を上げて合流する車両をブロックする。
    B: クラクションを鳴らして、合流する車両に道を譲るよう警告する。
    C: 可能であれば別の車線に移動し、合流する運転者がスムーズに入れるようにする。
    D: 完全に停止して、他の車両を合流させる。
  answer: C
  explanation: マニュアルでは、後方を確認した後、可能であれば別の車線に移動し、合流する運転者がスムーズに入れるようにすることを推奨しています。
- id: 323
  category: signs_and_signals
  question: 工事、維持管理、または緊急作業の標識は、一般的にどのような色と形をしていますか？
  choices:
    A: 赤と白の三角形。
    B: 黄色と黒の円形。
    C: 緑と白の長方形。
    D: オレンジ色の背景に黒い文字または記号があり、ひし形または長方形。
  answer: D
  explanation: マニュアルによると、作業区域の標識は一般的にひし形または長方形で、オレンジ色の背景に黒い文字または記号が描かれています。
- id: 324
  category: safe_driving_rules
  question: バリケードやコーンなどの誘導設備が設置された作業区域を通過する際、どのように運転すべきですか？
  choices:
    A: 車両を車線の中央に保ち、掲示されている制限速度に従う。
    B: 作業員のためのスペースを空けるため、できるだけコーンに近づいて運転する。
    C: 区域内を最も早く通過できるルートを見つけるため、頻繁に車線変更をする。
    D: バリケードから安全な距離を保つため、センターラインをまたいで運転する。
  answer: A
  explanation: マニュアルでは、誘導設備の近くを運転する際は「車両を車線の中央に保ち、掲示されている制限速度に従う」よう指示しています。
- id: 325
  category: safe_driving_rules
  question: スクールゾーンの制限速度標識の中には、子供が横断する可能性がある時間帯を示すために、どのように制御されているものがありますか？
  choices:
    A: 停止標識（ストップパドル）を持った横断歩道誘導員による。
    B: 制限速度を点灯させながら黄色のライトを点滅させるタイムクロックによる。
    C: 接近する車両を検知するモーションセンサーによる。
    D: 常時点灯する赤信号による。
  answer: B
  explanation: マニュアルによると、このタイプの標識はタイムクロックによって制御され、制限速度を点灯させながら黄色のライトを点滅させます。
- id: 326
  category: safe_driving_rules
  question: 各方向に複数の車線がある幹線道路で、一番右側の車線を走行するよう求める標識は、何を意味していますか？
  choices:
    A: より遅い車を追い越すか、左折する場合を除き、右側の車線を走行しなければならない。
    B: 追い越しをする場合でも、常に右側の車線を走行しなければならない。
    C: 他の交通よりも遅く走行している場合は、車線をまたいで走行すべきである。
    D: 右側の車線は、駐車または緊急時にのみ使用できる。
  answer: A
  explanation: マニュアルでは、この標識は「より遅い車を追い越すか、左折する場合を除き、一番右側の車線を走行しなければならない」ことを意味すると説明しています。
- id: 327
  category: sharing_the_road
  question: 作業区域で交通誘導員、公共事業の作業員、および警察官が、薄暗い場所や悪天候の条件下でも確実に見えるように着用する衣服は何色ですか？
  choices:
    A: 濃紺または黒の制服。
    B: 蛍光イエローグリーンの衣服またはベスト。
    C: 純白の反射スーツ。
    D: 迷彩柄のジャケット。
  answer: B
  explanation: マニュアルには、警察官や交通誘導員/作業員は、通常の条件下だけでなく、薄暗い場所や悪天候の条件下でも確実に見えるように「蛍光イエローグリーンのベスト」や衣服を着用すると記載されています。
- id: 328
  category: signs_and_signals
  question: 前方の車線規制（閉鎖）を知らせる点滅する矢印パネルを見た場合、どのような行動をとるべきですか？
  choices:
    A: 速度を上げて工事区域を素早く通過する。
    B: 開いている車線に合流するのを、可能な限りギリギリまで待つ。
    C: 標識のかなり手前から、開いている車線への合流を開始する。
    D: 直ちに車両を停止し、交通誘導員の指示を待つ。
  answer: C
  explanation: マニュアルには次のように指示されています。「点滅する矢印パネルは、接近する運転者に車線規制（閉鎖）を警告します。この標識のかなり手前から、開いている車線への合流を開始しなければなりません。」
- id: 329
  category: safe_driving_rules
  question: 作業区域で誘導設備の近くを運転する際、どうすべきですか？
  choices:
    A: それらを避けるために素早く車線変更をする。
    B: 車両を車線の中央に保ち、掲示されている制限速度に従う。
    C: 作業員により多くのスペースを与えるため、路肩を走行する。
    D: 作業区域を早く抜けるために速度を上げる。
  answer: B
  explanation: マニュアルによると、作業区域で誘導設備の近くを運転する際は、車両を車線の中央に保ち、掲示されている制限速度に従うべきです。
- id: 330
  category: vehicle_information
  question: 次の車両のうち、低速車（SMV）エンブレムを表示している可能性が最も高いのはどれですか？
  choices:
    A: 通報に対応している緊急車両。
    B: 商業用バスや大型トラック。
    C: 農業用トラクター、機械類、および馬車。
    D: 危険物を積載している車両。
  answer: C
  explanation: マニュアルによると、農業用トラクター、機械類、建設機械、馬車などの低速車両にSMVエンブレムが見られることがあります。
- id: 331
  category: signs_and_signals
  question: 障害物標識（object marker sign）の目的は何ですか？
  choices:
    A: 対面通行の幹線道路の中央線を示すため。
    B: 前方に横断歩道があることを示すため。
    C: 次の高速道路の出口までの距離を示すため。
    D: 橋の端など、道路の端に近い障害物を警告するため。
  answer: D
  explanation: 障害物標識は、実際には車道上にはないものの、橋の端や地下道の橋台など、標示が必要なほど道路の端に近い障害物についてドライバーに警告するものです。
- id: 332
  category: signs_and_signals
  question: 州間高速道路の路線番号標識（Interstate Route Marker signs）には何色が使われていますか？
  choices:
    A: 緑と白
    B: 青と赤
    C: 黒と白
    D: 黄色と黒
  answer: B
  explanation: マニュアルには、青と赤の標識は、その路線が州間および国防高速道路の全国システムの一部であることを示していると記載されています。
- id: 333
  category: signs_and_signals
  question: ガソリンスタンド、レストラン、モーテルなどのサービス施設へドライバーを案内する標識は何色ですか？
  choices:
    A: 緑
    B: 茶色
    C: 青
    D: オレンジ
  answer: C
  explanation: サービス標識の青色は、ガソリンスタンド、レストラン、モーテルなどのサービス施設へドライバーを案内するものです。
- id: 334
  category: safe_driving_rules
  question: 青い車椅子のシンボルが表示されているスペースに駐車することが法的に許可されているのは誰ですか？
  choices:
    A: 5分未満の駐車であれば誰でも。
    B: 妊婦および小さな子供連れの家族。
    C: 傷痍軍人または障害者用のナンバープレート、あるいは特別な障害者用ステッカーを付けた車両。
    D: 65歳以上の高齢ドライバー。
  answer: C
  explanation: 青い車椅子の標識が表示されている駐車スペースは、傷痍軍人または障害者用のナンバープレート、あるいは特別な障害者用ステッカーを付けた車両専用です。それ以外の者の使用は法律で禁止されています。
- id: 335
  category: signs_and_signals
  question: テネシー州の交通量の多い都市部の州間高速道路では、緊急用の位置参照マーカー（emergency reference markers）はどのくらいの間隔で設置されていますか？
  choices:
    A: 500フィートごと
    B: 1,000フィートごと
    C: 1マイルごと
    D: 5マイルごと
  answer: B
  explanation: ドライバーが自分の位置をより正確に把握できるように、州は交通量の多い都市部の州間高速道路沿いに1,000フィートごとに州間高速道路位置参照マーカーを設置しています。
- id: 336
  category: safe_driving_rules
  question: 赤信号で右折することが許可されるのはどのような場合ですか？
  choices:
    A: 停止することなく、いつでも。
    B: 緑の矢印も点灯している場合のみ。
    C: 完全に停止した後、歩行者や交差する交通がない場合（別の標識で禁止されていない限り）。
    D: テネシー州では赤信号での右折は一切許可されていない。
  answer: C
  explanation: 別の標識で禁止されていない限り、完全に停止した後、歩行者や交差する交通がない場合は、赤信号でも右折することができます。
- id: 337
  category: safe_driving_rules
  question: テネシー州法によると、黄色の信号機が赤に変わる前に表示されなければならない最小時間はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: テネシー州法では、赤信号の前に黄色の信号を最低3秒間表示することのみが義務付けられています。
- id: 338
  category: safe_driving_rules
  question: 黄色の信号が点灯したとき、すでに交差点の「中」にいた場合はどうすべきですか？
  choices:
    A: 交差点の真ん中で直ちに停止する。
    B: 車をバックさせて交差点から出る。
    C: 赤信号になる前に通り抜けるために大幅に加速する。
    D: 停止せず、注意しながら交差点を通り抜ける。
  answer: D
  explanation: マニュアルでは、黄色の信号が点灯したときにすでに交差点の「中」にいる場合は、停止せずに注意しながら交差点を通り抜けるよう指示しています。
- id: 339
  category: signs_and_signals
  question: 赤の矢印の信号機は何を示していますか？
  choices:
    A: ゆずった後であれば、矢印の方向に曲がってもよい。
    B: 他の車線が青信号であっても、矢印の方向へのすべての進行（右左折）は禁止されている。
    C: 交差点を四方向一時停止（four-way stop）として扱わなければならない。
    D: 緊急車両を運転している場合のみ曲がることができる。
  answer: B
  explanation: 矢印が赤の場合、または自分の車線が赤信号の場合、すべての進行（右左折）は禁止されています。これは、他の車線が青信号で、自分の進路がクリアに見える場合でも同様です。
- id: 340
  category: signs_and_signals
  question: 交差点での点滅する黄色の矢印は何を意味しますか？
  choices:
    A: すべての対向車、自転車、歩行者に道をゆずった後、左折することが許可されている。
    B: 信号機が故障しており、完全に停止しなければならない。
    C: 道をゆずることなく左折できる保護された優先権がある。
    D: 左折は完全に禁止されている。
  answer: A
  explanation: 点滅する黄色の矢印が表示されている場合、すべての対向車、および横断歩道上の自転車や歩行者に道をゆずった後、左折することが許可されています。
- id: 341
  category: safe_driving_rules
  question: 信号機が故障して消灯している場合、その交差点をどのように通行すべきですか？
  choices:
    A: 優先道路を走行している場合は、止まらずに交差点を通過する。
    B: 「ゆずれ（Yield）」の標識があるものとして扱う。
    C: 全方向一時停止（オールウェイ・ストップ）の交差点として扱う。
    D: 警察官が到着するまで待ってから進む。
  answer: C
  explanation: テネシー州法では、信号機が機能していない場合、その交差点は全方向一時停止（オールウェイ・ストップ）の交差点であるかのように扱うことが義務付けられています。
- id: 342
  category: safe_driving_rules
  question: 2台の車両が全方向一時停止（オールウェイ・ストップ）の交差点に同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転手が右側の運転手に道を譲らなければならない。
    B: 右側の運転手が左側の運転手に道を譲らなければならない。
    C: 速度が速い車両が先に進む。
    D: 左折する車両が常に先に進む。
  answer: A
  explanation: 優先権に関する法律では、交差点で2台以上の車両が同時に停止した場合、左側の運転手が右側の運転手に道を譲ることになっています。
- id: 343
  category: sharing_the_road
  question: テネシー州法では、歩行者をどのように定義していますか？
  choices:
    A: 指定された歩道を歩いている人のみ。
    B: 徒歩の人、または電動・手動の車椅子を使用しているすべての人。
    C: 自転車やスケートボードに乗っているすべての人。
    D: 横断歩道以外の場所で道路を横断しているすべての人。
  answer: B
  explanation: テネシー州法では、歩行者を、徒歩の人、または電動・手動の車椅子を使用しているすべての人と定義しています。
- id: 344
  category: safe_driving_rules
  question: 夜間、車両のヘッドライトを点灯することが義務付けられているのはいつですか？
  choices:
    A: 日没から日の出まで
    B: 日没の30分後から日の出の30分前まで
    C: 日没の1時間後から日の出の1時間前まで
    D: 街灯がない場合のみ
  answer: B
  explanation: マニュアルには、車のヘッドライトは日没の30分後から日の出の30分前まで点灯しなければならないと記載されています。
- id: 345
  category: safe_driving_rules
  question: 日中、どのような天候条件のときにヘッドライトを点灯することが義務付けられていますか？
  choices:
    A: 大雪が降っているときのみ
    B: 空が曇っているときはいつでも
    C: 降水によりワイパーを継続して使用する必要があるとき
    D: 雨天時に州間高速道路を走行しているときのみ
  answer: C
  explanation: 雨、霧、雪、またはその他の降水によりワイパーを継続して使用する必要がある場合は、日中でもヘッドライトを点灯しなければなりません。
- id: 346
  category: safe_driving_rules
  question: 日中、前方のどの距離にいる人や車両をはっきりと確認できる十分な明るさがない場合、ヘッドライトを点灯しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 前方200フィートの距離にいる人や車両をはっきりと確認できる十分な明るさがない場合は、いつでも車のヘッドライトを点灯しなければなりません。
- id: 347
  category: safe_driving_rules
  question: 下り坂を走行中の惰性走行（コースティング）に関する規則は何ですか？
  choices:
    A: 燃料を節約するために推奨されている
    B: ニュートラルでの惰性走行は許可されているが、クラッチを踏んだ状態では許可されていない
    C: トランスミッションをニュートラルにしたり、クラッチを踏んだ状態で惰性走行をしてはならない
    D: 惰性走行は制限速度が45 mph未満の道路でのみ許可されている
  answer: C
  explanation: 下り坂を走行中は、絶対に車両のトランスミッションをニュートラルにして惰性走行をしてはいけません。また、マニュアル車の運転手は、クラッチを踏んだ状態で惰性走行をしてはいけません。
- id: 348
  category: safe_driving_rules
  question: 交通警察官から、通常であれば交通規則違反となるような指示を受けた場合、どうすべきですか？
  choices:
    A: 警察官を無視して交通信号に従う
    B: 常に警察官の指示に従う
    C: 進む前に警察官にバッジ番号を尋ねる
    D: 車を停めて交通信号が変わるのを待つ
  answer: B
  explanation: 常に交通警察官の指示に従わなければなりません。緊急時には、通常であれば交通規則違反となるような行動を警察官が指示する場合があります。
- id: 349
  category: defensive_driving
  question: 統計によると、すべての自動車事故の半数はどこで発生していますか？
  choices:
    A: 州間高速道路
    B: 自宅から25マイル以内
    C: 交通量の多い交差点
    D: 長距離のドライブ中
  answer: B
  explanation: 統計によると、すべての自動車事故の半数は自宅から25マイル以内で発生しています。
- id: 350
  category: signs_and_signals
  question: 道路を逆走していることを、路側線（エッジライン）からどのように判断できますか？
  choices:
    A: 右側に白線、左側に黄色線がある
    B: 右側に黄色線、左側に白線がある
    C: 両側の路側線が白である
    D: 両側の路側線が黄色である
  answer: B
  explanation: もし右側に黄色線、左側に白線があることに気づいた場合、あなたは逆走しています。
- id: 351
  category: safe_driving_rules
  question: 車線の間にある2本の黄色い実線を越えることが許可されるのはどのような場合ですか？
  choices:
    A: 遅い車を追い越すため
    B: 対向車が見えない場合
    C: 安全が確認できる状態で、私道や側道に曲がって入るため
    D: いかなる状況でも2本の黄色い実線を越えてはならない
  answer: C
  explanation: 2本の黄色い実線は、どちらの方向からも追い越しのために線を越えてはならないことを意味します。ただし、安全が確認できる場合は、私道や側道に曲がって入るために黄色い実線を越えることができます。
- id: 352
  category: signs_and_signals
  question: 道路の中央に1本の黄色い実線と1本の黄色い破線があり、破線が自分の車線側にある場合、それは何を意味しますか？
  choices:
    A: 追い越し可能区間にあり、安全であれば追い越しができる
    B: このエリアでは追い越しが禁止されている
    C: 停止する準備をしなければならない
    D: その車線は右左折専用である
  answer: A
  explanation: 黄色い破線が自分の車線側にある場合、あなたは「追い越し可能区間」にいるため、安全であれば追い越しをすることができます。
- id: 353
  category: signs_and_signals
  question: 同じ方向に進む車線の間にある1本の白い実線は、何を示していますか？
  choices:
    A: 追い越しのために自由に車線変更ができる
    B: 緊急時を除き、車線を維持し、線を越えるべきではない
    C: 車線が終了するため、左に合流しなければならない
    D: 料金所に近づいている
  answer: B
  explanation: 車線の間にある1本の白い実線は、現在の車線を維持すべきであり、追い越しのために線を越えてはならないことを意味します（緊急事態により車線変更が必要な場合を除く）。
- id: 354
  category: safe_driving_rules
  question: 停止線や横断歩道が描かれていない交差点では、車両をどこで停止させなければなりませんか？
  choices:
    A: 交通状況がよく見えるように、角を少し過ぎたところ
    B: フロントバンパーが交差する道路の白い外側線を越える手前
    C: 交差点から少なくとも10フィート手前
    D: 一時停止標識のポールの横
  answer: B
  explanation: 路面に停止線が描かれていない場合、停止が義務付けられているすべての車両は、交差する道路の交通にはみ出さないように、フロントバンパーが交差する道路の白い外側線を越える手前で停止しなければなりません。
- id: 355
  category: signs_and_signals
  question: 路面に描かれているどの記号が、多人数乗車車両（HOV）専用車線を示していますか？
  choices:
    A: 白いX字型の標示（クロスバック）
    B: Xが描かれた円
    C: ひし形の標示
    D: 大きな白い矢印
  answer: C
  explanation: 多人数乗車車両（HOV）専用車線は、高速道路の車線中央に描かれたひし形の標示によって指定されています。
- id: 356
  category: signs_and_signals
  question: 走行中の車線に、曲がった矢印とまっすぐな矢印の両方が描かれている場合、それは何を意味しますか？
  choices:
    A: 矢印の方向に曲がらなければならない
    B: 矢印の方向に曲がるか、直進することができる
    C: 車線が終了するため、合流しなければならない
    D: ラウンドアバウト（環状交差点）に近づいている
  answer: B
  explanation: 車線に曲がった矢印とまっすぐな矢印の両方が描かれている場合、矢印の方向に曲がることも、直進することもできます。
- id: 357
  category: signs_and_signals
  question: 鉄道と道路の踏切に対する警告として機能する路面標示は何ですか？
  choices:
    A: RRの文字が入ったひし形
    B: 白いX字型の標示（クロスバック）とRRの文字
    C: 赤いXが入った黄色い実線
    D: 2本の白い実線
  answer: B
  explanation: 多くの踏切では、警告標示として路面に白いX字型の標示（クロスバック）とRRの文字が描かれています。
- id: 358
  category: signs_and_signals
  question: 挙げた手の記号が表示されている歩行者用信号は、何を意味しますか？
  choices:
    A: 歩行者に横断する優先権がある
    B: 道路の横断を始めるのは安全ではない
    C: 歩行者は急いで交差点を走り抜けなければならない
    D: 車両は停止し、歩行者が近づくのを待たなければならない
  answer: B
  explanation: 歩行者用信号に「DON'T WALK（歩くな）」の文字、または挙げた手の記号が表示されている場合、道路や交差点の横断を始めるのは安全ではありません。
- id: 359
  category: safe_driving_rules
  question: テネシー州において、夜間用のヘッドライトを点灯することが義務付けられているのはいつですか？
  choices:
    A: 日没から日の出まで
    B: 日没の30分後から日の出の30分前まで
    C: 日没の1時間後から日の出の1時間前まで
    D: 外が完全に暗くなった時のみ
  answer: B
  explanation: マニュアルによると、車のヘッドライトは日没の30分後から日の出の30分前まで点灯しなければなりません。
- id: 360
  category: safe_driving_rules
  question: テネシー州の法律により、日中や悪天候時にヘッドライトを点灯することが義務付けられているのはどのような場合ですか？
  choices:
    A: 州間高速道路を走行している時。
    B: 降水によりワイパーを継続的に使用する必要がある時。
    C: 多車線道路の最も左側の車線を走行している時。
    D: 適切に識別された葬列に近づいている時。
  answer: B
  explanation: マニュアルには、雨、霧、雪、またはその他の降水によりワイパーを継続的に使用する必要がある場合、ヘッドライトを点灯しなければならないと記載されています。
- id: 361
  category: safe_driving_rules
  question: 車のハイビーム（上向き）ヘッドライトを減光するか、ロービーム（下向き）にしなければならないのはいつですか？
  choices:
    A: 対向車が500フィート以内にいるとき。
    B: 対向車が200フィート以内にいるとき。
    C: 対向車が1,000フィート以内にいるとき。
    D: 混雑した市街地を運転しているときのみ。
  answer: A
  explanation: 対向車が500フィート（約1区画の距離）以内にいる場合、または他の車の後ろを500フィート以内で走行している場合は、ヘッドライトを減光するかロービームにしなければなりません。
- id: 362
  category: vehicle_information
  question: 運転中のパーキングライト（車幅灯）の使用について、正しいものは次のうちどれですか？
  choices:
    A: 濃霧の際にはヘッドライトの代わりに使用すべきである。
    B: 夜間や悪天候時にパーキングライトのみを点灯して車を運転することは違法である。
    C: 他の運転手に対して、自分の車が実際よりも近くにあるように見せる効果がある。
    D: スクールゾーンを運転する際は常に点灯することが義務付けられている。
  answer: B
  explanation: マニュアルには次のように記載されています。「夜間や悪天候時にパーキングライトのみを点灯して車を運転しないでください。（中略）パーキングライトのみの使用は危険であるだけでなく、法律違反です。」
- id: 363
  category: vehicle_information
  question: 2018年1月1日より、テネシー州において車の前方に表示される常時点灯ライトは、何色でなければなりませんか？
  choices:
    A: 白色またはアンバー（琥珀色）
    B: 赤色または青色
    C: 緑色または黄色
    D: 点滅しない限り何色でもよい
  answer: A
  explanation: 2018年1月1日より、テネシー州で運行される車両には、車の前方に表示される常時点灯ライトとして、白色またはアンバー（またはその2色の組み合わせ）以外の色のライトを装備してはなりません。
- id: 364
  category: penalties_and_points
  question: テネシー州でポイ捨て（不法投棄）で有罪となった場合、罰金はいくらになる可能性がありますか？
  choices:
    A: 10ドルから500ドル
    B: 50ドルから3,000ドル
    C: 100ドルから5,000ドル
    D: 250ドルから10,000ドル
  answer: B
  explanation: ポイ捨ては州法違反です。罰金は50ドルから始まり、ゴミの量に応じて最大3,000ドルになる可能性があります。
- id: 365
  category: safe_driving_rules
  question: テネシー州法では、高速道路上に落下したり吹き飛ばされたりする可能性のある物質を運搬する自動車に対して、何を義務付けていますか？
  choices:
    A: 物質をバンジーコードで固定しなければならない。
    B: 制限速度より少なくとも10 mph遅い速度で走行しなければならない。
    C: 物質を密閉された空間に入れるか、防水シート（ターポリン）で完全に覆わなければならない。
    D: 車両に「低速走行車」の標識を掲示しなければならない。
  answer: C
  explanation: テネシー州法では、ゴミや、高速道路上に落下したり吹き飛ばされたりする可能性のある物質を運搬する自動車は、それらを密閉された空間に入れるか、防水シートで完全に覆うことを義務付けています。
- id: 366
  category: safe_driving_rules
  question: 次のどの速度で走行している場合、低速走行車を運転しているとみなされますか？
  choices:
    A: 法定最高速度より5 mph以上遅い速度。
    B: 法定最高速度より10 mph以上遅い速度。
    C: 法定最高速度より15 mph以上遅い速度。
    D: 法定最高速度より20 mph以上遅い速度。
  answer: B
  explanation: 法定最高速度より10 mph（時速10マイル）以上遅い速度で走行している場合、低速走行車を運転しているとみなされます。
- id: 367
  category: sharing_the_road
  question: 低速走行車を運転している場合、いつ安全に道路から曲がるか、または路肩に寄らなければなりませんか？
  choices:
    A: 後ろに2台以上の車が並んだとき。
    B: 後ろに3台以上の車が並んだとき。
    C: 後ろに5台以上の車が並んだとき。
    D: 後ろに10台以上の車が並んだとき。
  answer: C
  explanation: マニュアルには次のように記載されています。「後ろに5台以上の車が並んだ場合は、安全にできる限り早く道路から曲がるか、路肩に寄ってください。」
- id: 368
  category: sharing_the_road
  question: テネシー州の2車線道路において、葬列を追い越す際の規則は何ですか？
  choices:
    A: 先にクラクションを鳴らせば追い越してもよい。
    B: 葬列が45 mph未満で走行している場合にのみ追い越してもよい。
    C: 葬列の後ろを走る車は、追い越しを試みてはならない。
    D: ハザードランプを点灯させれば追い越してもよい。
  answer: C
  explanation: テネシー州法では、2車線道路で葬列の後ろを走る車は、その葬列を追い越そうとしてはならないと規定しています。
- id: 369
  category: safe_driving_rules
  question: '基本速度規則（Basic Speed Rule: BSR）について、最も適切に説明しているものは次のうちどれですか？'
  choices:
    A: すべての道路の正確な制限速度を定める厳格なテネシー州法である。
    B: 運転できる速度は現在の状況によって制限されるという原則である。
    C: すべての運転手に対し、標識に示された制限速度と全く同じ速度で走行することを義務付けている。
    D: ゆっくり走る方が常に安全であると定めている。
  answer: B
  explanation: 基本速度規則（BSR）はテネシー州法ではなく、一般的な安全原則です。正確な制限速度を定めるものではなく、運転できる速度は現在の状況によって制限されるということを教えています。
- id: 370
  category: safe_driving_rules
  question: 標識による別の指示がない限り、テネシー州の主要および補助的な州道・連邦道での制限速度はどれくらいですか？
  choices:
    A: 45 m.p.h.
    B: 55 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: B
  explanation: 標識による別の指示がない限り、主要および補助的な州道・連邦道での制限速度は55 m.p.h.です。
- id: 371
  category: safe_driving_rules
  question: テネシー州法で定められている州間高速道路の最高速度はどれくらいですか？
  choices:
    A: 55 m.p.h.
    B: 60 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: D
  explanation: テネシー州法で定められている州間高速道路の最高速度は70 m.p.h.であり、ほとんどの郊外区間に標識が設置されています。
- id: 372
  category: safe_driving_rules
  question: 通常の運転条件下において、テネシー州の州間高速道路の最も左側の車線で、どの速度未満で運転することは違法ですか？
  choices:
    A: 45 m.p.h.
    B: 50 m.p.h.
    C: 55 m.p.h.
    D: 65 m.p.h.
  answer: C
  explanation: 交通渋滞や交通の流れによりその速度での安全な運転が妨げられる場合を除き、州間高速道路の最も左側の車線で55 m.p.h.未満で車両を運転することは違法です。
- id: 373
  category: safe_driving_rules
  question: テネシー州の州間高速道路において、通常の運転条件下での右側車線の最低速度制限はどれくらいですか？
  choices:
    A: 35 m.p.h.
    B: 40 m.p.h.
    C: 45 m.p.h.
    D: 55 m.p.h.
  answer: C
  explanation: 州間高速道路の右側車線の最低速度制限は45 m.p.h.であり、通常の運転条件下では、すべての車両が少なくともこの速度で走行しなければなりません。
- id: 374
  category: penalties_and_points
  question: テネシー州のスクールゾーンで制限速度を超過した場合の罰則は何ですか？
  choices:
    A: 運転記録に自動的に2ポイント加算
    B: 運転記録に自動的に4ポイント加算
    C: 運転記録に自動的に6ポイント加算
    D: 自動的に30日間の免許停止
  answer: C
  explanation: マニュアルによると、スクールゾーンの制限速度超過の罰則には、運転記録への自動的な6ポイント加算が含まれており、その結果として警告書（advisory
    letter）が送付されます。
- id: 375
  category: penalties_and_points
  question: 法律上、スクールゾーンの制限速度を超過することは何とみなされますか？
  choices:
    A: 不注意運転 (Careless driving)
    B: 無謀運転 (Reckless driving)
    C: 攻撃的運転 (Aggressive driving)
    D: 軽微な交通違反
  answer: B
  explanation: マニュアルには、スクールゾーンの制限速度超過は法律上、無謀運転（reckless driving）とみなされると記載されています。
- id: 376
  category: penalties_and_points
  question: テネシー州の作業中の工事区間（active work zones）で標識の制限速度に違反した場合の、最低罰金と最高罰金はいくらですか？
  choices:
    A: 最低50ドル、最高250ドル
    B: 最低100ドル、最高300ドル
    C: 最低250ドル、最高500ドル
    D: 最低500ドル、最高1,000ドル
  answer: C
  explanation: テネシー州法では、作業中の工事区間に掲示された制限速度の違反に対し、最低250ドル、最高500ドルの罰金が義務付けられています。
- id: 377
  category: signs_and_signals
  question: 高速道路の工事区間は、運転手によってどのように簡単に認識できますか？
  choices:
    A: 青と白の標識や機器の存在によって
    B: オレンジ色または黄緑色の標識、機器、衣服の存在によって
    C: 無地の赤い標識と点滅する緑色のライトの存在によって
    D: 黒と白のチェッカーフラッグの存在によって
  answer: B
  explanation: 高速道路の工事区間は、オレンジ色（または黄緑色）の標識やその他のオレンジ色の交通規制機器、機材の点滅灯、および視認性の高い衣服（オレンジ色または黄緑色）を着用した作業員の存在によって簡単に認識できます。
- id: 378
  category: vehicle_information
  question: 法律上、すべての自動車にはどのようなブレーキ装置を装備しなければなりませんか？
  choices:
    A: 通常のフットブレーキのみ
    B: ブレーキをかけるための2つの独立した方法（一般的にはフットブレーキとパーキング/エマージェンシーブレーキ）
    C: アンチロック・ブレーキ・システム（ABS）とフットブレーキ
    D: フロントディスクブレーキとリアドラムブレーキ
  answer: B
  explanation: 法律上、すべての自動車はブレーキをかけるための2つの独立した方法を備えていなければなりません。一般的に、これらは車両の通常のブレーキ（フットブレーキ）とパーキングブレーキまたはエマージェンシーブレーキです。
- id: 379
  category: defensive_driving
  question: 車両にアンチロック・ブレーキ（ABS）が装備されておらず、横滑り（スキッド）し始めた場合、一般的にどうすべきですか？
  choices:
    A: できるだけ早くブレーキをポンピングする
    B: ブレーキを強く踏み込み、ハンドルをまっすぐに保つ
    C: ブレーキから足を離し、横滑りしている方向にハンドルを切る
    D: トラクションを取り戻すために急加速する
  answer: C
  explanation: アンチロック・ブレーキが装備されていない車両の一般的なルールとして、車が横滑りし始めたら、安全であればブレーキから足を離し、横滑りしている方向にハンドルを切ります。
- id: 380
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）を装備した車両を減速または停止させる際、どうすべきですか？
  choices:
    A: ブレーキペダルを素早くポンピングする
    B: ブレーキペダルにしっかりと一定の圧力をかける
    C: ブレーキペダルを繰り返し軽く叩くように踏む
    D: 振動を感じたらペダルから足を離す
  answer: B
  explanation: ABSを使用して減速または停止する場合は、ブレーキペダルにしっかりと一定の圧力をかけます。ABS装備車でペダルをポンピングしてはいけません。
- id: 381
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）が作動しているとき、どのような感覚があると考えられますか？
  choices:
    A: ハンドルが固定されて動かなくなる
    B: ブレーキペダルが抵抗なく完全に床まで踏み込めるようになる
    C: ブレーキペダルから異音や振動を感じる
    D: エンジンが一時的にエンストする
  answer: C
  explanation: ABSが作動しているときは、ブレーキペダルから異音や振動を感じることが予想されます。これらの感覚は、ABSが正常に機能していることを示しています。
- id: 382
  category: safe_driving_rules
  question: 「ライディング・ザ・ブレーキ（ブレーキの引きずり）」という用語は何を意味しますか？
  choices:
    A: より素早く反応できるように、ブレーキペダルの上に足を浮かせておくこと
    B: ブレーキペダルに足を乗せたままにするか、わずかに踏み込んだ状態を保つこと
    C: ブレーキペダルとアクセルペダルを同時に踏むこと
    D: 坂道を下る際にブレーキペダルを繰り返しポンピングすること
  answer: B
  explanation: 「ライディング・ザ・ブレーキ」とは、ブレーキペダルに足を乗せたままにするか、わずかに踏み込んだ状態を保つことです。これによりブレーキの摩耗が進み、他の運転手に誤った印象を与えてしまいます。
- id: 383
  category: defensive_driving
  question: 「カバリング・ザ・ブレーキ（ブレーキの構え）」は安全な運転方法と見なされますか？
  choices:
    A: はい。交差点に近づく際など、より素早い反応が可能になります。
    B: いいえ。ブレーキシステムに過度の摩耗を引き起こします。
    C: いいえ。他の運転手にすぐに停止するという誤った印象を与えます。
    D: はい。ただし、州間高速道路を運転している場合のみです。
  answer: A
  explanation: カバリング・ザ・ブレーキとは、運転手がより素早く反応できるように、ブレーキペダルの上に足を浮かせて構えておくことを意味します。マニュアルでは、ブレーキの構えは多くの場合、賢明で安全な運転方法であると述べられています。
- id: 384
  category: safe_driving_rules
  question: 通常の運転状況下で安全な車間距離を保つために、運転手は何を用いるべきですか？
  choices:
    A: 1秒ルール
    B: 2秒ルール
    C: 5秒ルール
    D: 10秒ルール
  answer: B
  explanation: 全国的に、安全機関は安全な車間距離を推奨しています。マニュアルでは、車間距離が近すぎるかどうかを判断するために「2秒ルール」を使用することを推奨しています。
- id: 385
  category: defensive_driving
  question: 悪天候時、州間高速道路での高速走行時、または夜間運転時には、車間距離を最低何秒に増やすべきですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 6秒
  answer: C
  explanation: 悪天候時、州間高速道路での高速走行時、および夜間運転時には、より良い反応時間を確保するために、2秒ルールを最低4秒に増やす必要があります。
- id: 386
  category: defensive_driving
  question: 車両を停止させる3つのステップにおいて、「認知時間（Perception time）」とは何ですか？
  choices:
    A: アクセルペダルからブレーキペダルに足を移動させるのにかかる時間
    B: 運転手が危険な状況を見て認識するまでにかかる時間
    C: ブレーキがかかっている間に車が進む距離
    D: 車両のブレーキパッドがローターに噛み合うまでにかかる時間
  answer: B
  explanation: 認知時間とは、運転手が危険な状況を見て認識するまでにかかる時間と定義されています。
- id: 387
  category: safe_driving_rules
  question: 運転手が車間距離を詰めすぎる（あおり運転/テールゲイティング）ことによる、非常に一般的な結果は何ですか？
  choices:
    A: 渋滞時の交通の流れを改善する
    B: 運転手が前方の道路状況をより良く見渡せるようになる
    C: 追突事故を引き起こす
    D: 車両の燃費を向上させる
  answer: C
  explanation: マニュアルには、追突事故は非常に一般的であり、これらの事故のほとんどは「テールゲイティング（車間距離の詰めすぎ）」をしている運転手によって引き起こされると記されています。
- id: 388
  category: vehicle_information
  question: マニュアル車（標準トランスミッション車）で一時停止標識に近づく際、減速するために何をすべきですか？
  choices:
    A: ニュートラルに入れ、惰性で一時停止標識まで進む
    B: 燃料を節約するためにエンジンを切る
    C: 後続車に合図するためにブレーキランプを点滅させ、その後低いギアにシフトダウンする
    D: 車両が完全に停止するまで半クラッチ状態を保つ
  answer: C
  explanation: マニュアル車では、ギアチェンジを利用して減速することができます。まず、後続車に合図するためにブレーキランプを点滅させます。その後、低いギアにシフトダウンします。
- id: 389
  category: safe_driving_rules
  question: 車両を停止させるための3つのステップは何ですか？
  choices:
    A: 観察時間、減速時間、停止時間
    B: 認知時間、反応時間、制動時間
    C: 制動時間、スリップ時間、停止時間
    D: 反応時間、減速時間、静止時間
  answer: B
  explanation: マニュアルによると、車両を停止させるには「認知時間（Perception time）」「反応時間（Reaction time）」「制動時間（Braking
    time）」の3つのステップがあります。
- id: 390
  category: safe_driving_rules
  question: 危険を認知してからブレーキをかけ始めるまでの平均的な反応時間はどれくらいですか？
  choices:
    A: 1/2秒
    B: 2/3秒
    C: 1秒
    D: 1.16秒
  answer: B
  explanation: マニュアルには、反応時間とは危険を認知してからブレーキをかけ始めるまでの時間であり、その平均は2/3秒であると記載されています。
- id: 391
  category: vehicle_information
  question: 車両の停止距離を大きく変動させる要因として挙げられていないものは、次のうちどれですか？
  choices:
    A: 道路や舗装の種類と状態
    B: 車両の設計とショックアブソーバーの状態
    C: 車両の色と視認性
    D: 積載時または牽引時の車両重量
  answer: C
  explanation: 停止距離は、路面状況、タイヤ/ブレーキ、ショックアブソーバー、車両重量などの要因によって変動します。車両の色は要因として挙げられていません。
- id: 392
  category: signs_and_signals
  question: 路面標示や横断歩道がない場合、一時停止標識で車両をどこに停止させるべきですか？
  choices:
    A: 一時停止標識の10フィート手前
    B: 車両の前端が路肩の一時停止標識の位置と並ぶところ
    C: 一時停止標識の真下
    D: 交差する道路の境界線の真上
  answer: B
  explanation: マニュアルには次のように記載されています。「路面標示がない場合は、車両の前端が路肩の一時停止標識の位置と並ぶところで停止してください。」
- id: 393
  category: defensive_driving
  question: 交差点で他の車両の後ろに停止する際、安全な「車間距離（ギャップ）」を保つための基本的な目安は何ですか？
  choices:
    A: 前の車両から少なくとも車1台分後ろにいるべきである。
    B: 前の車両のナンバープレート、および/または後輪が路面に接している部分が見えるようにするべきである。
    C: 車両間に正確に15フィートのスペースを空けるべきである。
    D: ナンバープレートの有効期限が読めるくらい近づくべきである。
  answer: B
  explanation: 基本的な目安として、安全地帯を確保するために、前の車両のナンバープレート、および/または後輪が路面に接している部分が見えるように停止する必要があります。
- id: 394
  category: signs_and_signals
  question: 赤の点滅信号に対して、運転手はどのように対応しなければなりませんか？
  choices:
    A: 減速し、注意して進む。
    B: 右側の交通に道を譲るが、停止は義務付けられていない。
    C: 一時停止標識と同じように、完全に停止する。
    D: 横断歩道に歩行者がいる場合のみ停止する。
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「赤の点滅信号では、一時停止標識と同じように完全な停止が義務付けられています。」
- id: 395
  category: safe_driving_rules
  question: ほとんどの警察官や運転指導員は、完全な停止をどのように定義していますか？
  choices:
    A: スピードメーターが3秒間正確にゼロを示したとき。
    B: すべての動きが止まった後、車が前に揺れる（沈み込む）のを運転手が感じたとき。
    C: 車両が時速5マイル未満に減速したとき。
    D: 運転手がギアをパーキングに入れたとき。
  answer: B
  explanation: ほとんどの警察官や指導員は、すべての動きが止まった後に車が前に揺れる（沈み込む）のを運転手が感じるまで、車両は完全に停止したとは言えないという点で意見が一致しています。
- id: 396
  category: safe_driving_rules
  question: 踏切に近づき、列車が来ている場合、車両をどこに停止させなければなりませんか？
  choices:
    A: 線路から10〜30フィートの間
    B: 線路から15〜50フィートの間
    C: 線路から正確に50フィートの位置
    D: 線路から少なくとも100フィート離れた位置
  answer: B
  explanation: 踏切に近づき、列車が来ている場合、線路から15〜50フィートの間で停止しなければなりません。
- id: 397
  category: sharing_the_road
  question: 列車は踏切を通過する前、およそどのくらいの距離で警笛を鳴らすことが義務付けられていますか？
  choices:
    A: 500フィート
    B: 1,000フィート
    C: 1,500フィート
    D: 2,000フィート
  answer: C
  explanation: 列車は、踏切を通過する約1,500フィート手前で警笛を鳴らすことが義務付けられています。
- id: 398
  category: sharing_the_road
  question: テネシー州法により、標識や信号が作動していなくても、すべての踏切を通過する前に停止することが義務付けられている車両は、次のうちどれですか？
  choices:
    A: 子供を乗せているすべての乗用車
    B: 乗客を乗せているかどうかにかかわらず、教会または学校のバス
    C: すべての商業用配達トラック
    D: トレーラーを牽引しているすべての車両
  answer: B
  explanation: 教会または学校のバスは、その時に乗客を乗せているかどうかにかかわらず、すべての踏切を通過する前に停止することが法律で義務付けられています。
- id: 399
  category: safe_driving_rules
  question: テネシー州法（Tennessee Code）では、「停止（stop）」をどのように定義していますか？
  choices:
    A: 時速3マイル未満の速度に減速すること
    B: 動きが完全に止まること
    C: 少なくとも2秒間一時停止すること
    D: すべての対向車に道を譲ること
  answer: B
  explanation: テネシー州法では、「停止」を「動きが完全に止まること」と定義しています。
- id: 400
  category: signs_and_signals
  question: 交差点に歩行者用の横断歩道が標示されている場合、車両をどこに停止させなければなりませんか？
  choices:
    A: 交通状況をよく見るために横断歩道の中
    B: 横断歩道を少し過ぎたところ
    C: 車両の前端が横断歩道の境界を示す最も手前の白線に到達する前
    D: 横断歩道の線に関係なく、一時停止標識と並ぶところ
  answer: C
  explanation: 交差点の路面に横断歩道が標示されている場合、車両の前端が横断歩道の境界を示す最も手前の白線に到達する前に停止しなければなりません。
- id: 401
  category: safe_driving_rules
  question: マニュアルの例によると、天候が良く状態の良い道路を時速70マイル（70 m.p.h.）で走行している車両の前に突然危険が現れた場合、合計停止距離はどれくらいですか？
  choices:
    A: 128フィート
    B: 200フィート
    C: 290フィート
    D: 418フィート
  answer: D
  explanation: 時速70マイル（70 m.p.h.）の場合、ブレーキをかけるまでに128フィート進み、制動距離は290フィートであるため、合計停止距離は418フィートになります。
- id: 402
  category: penalties_and_points
  question: 「ローリングストップ（完全に停止しない一時停止）」を行った場合、起こり得る結果は次のうちどれですか？
  choices:
    A: 運転免許の路上試験に不合格になる
    B: 交通違反切符を切られる
    C: 衝突事故が発生した場合、警察および保険会社から全責任を問われる
    D: 上記のすべて
  answer: D
  explanation: ローリングストップは、交通違反切符を切られる、路上試験に不合格になる、および衝突事故の際に全責任を問われる根拠となります。
- id: 403
  category: penalties_and_points
  question: 停車中のスクールバスに対して一時停止しなかった場合の罰則は何ですか？
  choices:
    A: クラスBの軽犯罪および100ドルの罰金
    B: クラスCの軽犯罪および50ドルの罰金
    C: クラスAの軽犯罪および250ドルから1,000ドルの罰金
    D: 重罪および2,000ドルの罰金
  answer: C
  explanation: マニュアルには、停車中のスクールバスに対して一時停止しなかった場合、クラスAの軽犯罪となり、運転手には250ドルから1,000ドルの罰金が科される可能性があると記載されています。
- id: 404
  category: safe_driving_rules
  question: 共有の中央右左折車線（5番目の車線）がある幹線道路を走行中、赤いライトを点滅させて停車しているスクールバスに遭遇した場合、どうしなければなりませんか？
  choices:
    A: 停止せずに注意して進む
    B: バスと同じ方向に進行している場合のみ停止する
    C: 時速15マイル（15 mph）に減速して進む
    D: 右左折車線は分離帯とは見なされないため、両方向の車が停止する
  answer: D
  explanation: 4車線の幹線道路の中央にある右左折車線は、分離帯とは見なされません。このような道路で停車中のスクールバスに遭遇した運転手は、両方向とも停止することが義務付けられています。
- id: 405
  category: signs_and_signals
  question: スクールバスの前方および後方にある黄色の点滅ライトは何を示していますか？
  choices:
    A: バスが子供たちを乗降させるために停車する準備をしている
    B: バスが停車し、子供たちが乗降している
    C: バスが機械的なトラブルを起こしている
    D: バスが後退している
  answer: A
  explanation: バスの前方および後方の黄色いライトが点滅している場合、バスは子供たちを乗降させるために停車する準備をしています。運転手は減速し、停止する準備をする必要があります。
- id: 406
  category: safe_driving_rules
  question: スクールバスが子供たちを乗降させるために交差点で停車している場合、どの運転手が停止する義務がありますか？
  choices:
    A: バスの後ろにいる運転手のみ
    B: 対向車線から接近する運転手のみ
    C: すべての方向からの運転手
    D: バスが停車している通りに曲がろうとする運転手のみ
  answer: C
  explanation: スクールバスが子供たちを乗降させるために交差点で停車している場合、バスが再び動き出すまで、すべての方向からの運転手が停止する義務があります。
- id: 407
  category: driver_responsibility
  question: 日没後に警察官に車を停められた場合、警察官が近づいてくる前に何をすべきですか？
  choices:
    A: ヘッドライトを消す
    B: 車内のルームランプを点灯させる
    C: 車から降りて警察官に挨拶する
    D: クラクションを鳴らして停車したことを知らせる
  answer: B
  explanation: マニュアルでは、日没後に車を停められた場合、警察官が近づいてくる前に車内のルームランプを点灯させるよう推奨しています。
- id: 408
  category: defensive_driving
  question: 夜間に覆面パトカー（UNMARKED police car）に車を停めるよう指示され、身の危険を感じた場合はどうすべきですか？
  choices:
    A: 覆面パトカーから逃げるためにスピードを上げる
    B: 道路の真ん中で直ちに停止する
    C: 人のいる最も近い場所まで短い距離をゆっくりと運転する
    D: マークのあるパトカーが到着するまで車を停めるのを拒否する
  answer: C
  explanation: 覆面パトカーに車を停めるよう指示された場合、店舗の駐車場や次の出口など、他の人がいる最も近い場所まで短い距離をゆっくりと運転しても構いません。
- id: 409
  category: driver_responsibility
  question: 警察官に車を停められた際、運転手は次のようにすべきです：
  choices:
    A: 手を見せるよう求められるまで手を隠しておく
    B: 両手をハンドル（ステアリングホイール）の上に置いておく
    C: 車検証を取るためにすぐにグローブボックスに手を伸ばす
    D: 車の後部を確認するために車から降りる
  answer: B
  explanation: 交通違反の取り締まりで停車させられた際、運転手は両手をハンドルの上に置いておき、同乗者は両手を見える位置に置いておく必要があります。
- id: 410
  category: safe_driving_rules
  question: 交差点での「左・右・左のルール（Left-Right-Left Rule）」によると、最初にどこを見るべきですか？
  choices:
    A: 右
    B: 左
    C: 正面
    D: バックミラー
  answer: B
  explanation: 「左・右・左のルール」では、まず左を見て交差する交通が優先権を譲っているか確認し、次に右を見て、最後にもう一度左を見るべきだとされています。
- id: 411
  category: safe_driving_rules
  question: 交差点での車線変更と追い越しについて、正しいものは次のうちどれですか？
  choices:
    A: 信号が青であれば、交差点内で他の車両を追い越すことができる
    B: 交差点を通過し始める際に、直前で車線変更をするべきである
    C: 交差点内で他の車両を追い越してはならない
    D: 方向指示器を使用すれば、交差点内で車線変更ができる
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「交差点を通過し始める際に、直前で車線変更をしてはなりません。交差点内で他の車両を追い越してはなりません。」
- id: 412
  category: defensive_driving
  question: すべての自動車事故のうち、交差点で発生する割合は何パーセントですか？
  choices:
    A: 10パーセント
    B: 21パーセント
    C: 33パーセント
    D: 50パーセント
  answer: C
  explanation: 交差点は道路・高速道路システムにおいてごく一部を占めるに過ぎませんが、すべての自動車事故の33パーセントに関与しています。
- id: 413
  category: safe_driving_rules
  question: 優先権（right-of-way）に関する法律を最もよく説明しているのは次のうちどれですか？
  choices:
    A: 法律は最も大きな車両に優先権を与えている
    B: 法律は誰にも優先権を与えておらず、誰が道を譲らなければならないかを定めているだけである
    C: 法律は最も速く走行している車両に優先権を与えている
    D: 法律は交通信号に関係なく、あらゆる状況で歩行者に優先権を与えている
  answer: B
  explanation: 法律は実際には誰にも優先権を与えていません。誰が優先権を譲らなければならないかを定めているだけです。優先権は「取る」ものではなく「与える」ものだと考えてください。
- id: 414
  category: safe_driving_rules
  question: 赤いライトを点滅させて停車しているスクールバスに対して、停車する義務がないのはどのような状況ですか？
  choices:
    A: 2車線道路を反対方向に走行している場合
    B: 仕事に遅刻しそうな場合
    C: 車両の通行に適さない分離帯によって分割された別々の車道を持つ幹線道路（ハイウェイ）を運転している場合
    D: バスが交差点で停車している場合
  answer: C
  explanation: 中央分離帯や車両の通行に適さない分離帯によって反対方向の交通が分割された幹線道路（ハイウェイ）を運転している場合、運転手は停車する必要はありませんが、注意して進む必要があります。
- id: 415
  category: safe_driving_rules
  question: 信号が変わった後、交差点に進入して交差点を塞ぐことは合法ですか？
  choices:
    A: はい、信号が黄色の時に交差点に進入した場合は合法である
    B: はい、「交差点を塞がないこと（Do Not Block Intersection）」という標識がない場合は合法である
    C: いいえ、標識の有無にかかわらず、交差点を塞ぐことは常に違法である
    D: いいえ、商用車を運転している場合を除き違法である
  answer: C
  explanation: 信号が変わった後に交差点を塞ぐことは、常識に反するだけでなく違法でもあります。標識の有無にかかわらず、交差点を塞ぐことは常に違法です。
- id: 416
  category: driver_responsibility
  question: 拳銃の所持許可証を持っており、武装した状態で警察官に止められた場合、どうすべきですか？
  choices:
    A: 武器を座席の下に隠す
    B: 許可証を持っており、武装していることを警察官に伝える
    C: すぐに武器を警察官に渡す
    D: 警察官に武器を持っているか尋ねられるまで待ってから伝える
  answer: B
  explanation: マニュアルには、運転手は拳銃の所持許可証を持っており、武装している場合は警察官にその旨を伝えるべきであると記載されています。
- id: 417
  category: safe_driving_rules
  question: テネシー州法によると、法的に優先権（right-of-way）を与えられているのは誰ですか？
  choices:
    A: 最初に交差点に到達した運転手
    B: あらゆる状況における歩行者
    C: 法律は誰にも優先権を与えておらず、誰が道を譲らなければならないかを定めているだけである
    D: 右側にいる車両
  answer: C
  explanation: マニュアルには、法律は実際には誰にも優先権を与えていないと記載されています。誰が優先権を譲らなければならないかを定めているだけです。
- id: 418
  category: sharing_the_road
  question: 盲導犬や白杖を使用している盲目または視覚障害のある歩行者が道路を横断している場合、少なくともどのくらい離れて停車しなければなりませんか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 20フィート
  answer: B
  explanation: 盲目または視覚障害のある歩行者の負傷を防ぐために特別な予防措置を講じ、その人が道路から離れるまで少なくとも10フィート離れて停車しなければなりません。
- id: 419
  category: sharing_the_road
  question: 運転手は、特別な優先権の配慮が必要な聴覚障害のある歩行者をどのように識別できますか？
  choices:
    A: 先端が赤い白杖を持っている
    B: 反射材のついた黄色いベストを着ている
    C: 鮮やかなオレンジ色（ブレイズオレンジ）のリードをつけた犬を連れている
    D: 電動車椅子を使用している
  answer: C
  explanation: マニュアルには、鮮やかなオレンジ色（ブレイズオレンジ）のリードをつけた犬を連れた聴覚障害者が道路のいかなる部分を横断している場合でも、道を譲らなければならないと明記されています。
- id: 420
  category: safe_driving_rules
  question: 車両で歩道を走行することが合法となるのはどのような場合ですか？
  choices:
    A: 交通渋滞を避ける場合
    B: 混雑した繁華街で車両を駐車する場合
    C: 私道、路地、または駐車場に出入りするために歩道を横切る場合のみ
    D: いかなる状況下でも歩道を走行することは決して合法ではない
  answer: C
  explanation: 私道、路地、または駐車場に出入りする際など、歩道を横切る場合を除き、歩道を走行することは違法です。
- id: 421
  category: safe_driving_rules
  question: 1つの道路が別の主要な交差道路に行き止まりとなる「T字路」では、誰に優先権がありますか？
  choices:
    A: 行き止まりの道路にいる車両は、主要道路の交通に道を譲らなければならない
    B: 主要道路の車両は、行き止まりの道路にいる車両に道を譲らなければならない
    C: 最初に交差点に到着した車両
    D: 右折する車両
  answer: A
  explanation: 1つの道路が別の主要な交差道路に行き止まりとなる「T字路」では、行き止まりの道路にいる車両は、主要道路の両方向から来る対向車に道を譲らなければなりません。
- id: 422
  category: defensive_driving
  question: 前方の交通が渋滞しており、交差点を完全に通過できない場合はどうすべきですか？
  choices:
    A: 交差点に進入し、交通が流れるのを待つ
    B: 交差点を塞がないように、交通が流れるまで待つ
    C: ゆっくりと進み、クラクションを鳴らす
    D: 交差点に進入し、ハザードランプを点灯させる
  answer: B
  explanation: 途中で止まることなく通過できる場合を除き、交差点に進入してはいけません。交差点を塞がないように、前方の交通が流れるまで待つ必要があります。
- id: 423
  category: sharing_the_road
  question: サイレンを鳴らしたり、点滅灯をつけている緊急車両が接近してきた場合、どうしなければなりませんか？
  choices:
    A: 現在の車線で直ちに停止する
    B: 緊急車両の前に留まるために加速する
    C: 道路の右端または縁石にできるだけ近づけて平行に車を寄せ、停止する
    D: 道路の左側に車を寄せ、減速する
  answer: C
  explanation: テネシー州法では、緊急車両が接近してきた場合、すべての車両は優先権を譲り、直ちに道路の右端または縁石にできるだけ近づけて平行に車を寄せ、停止することが義務付けられています。
- id: 424
  category: sharing_the_road
  question: サイレンを鳴らした緊急車両が接近してきたとき、交差点の真ん中にいた場合はどうすべきですか？
  choices:
    A: 交差点の真ん中で直ちに停止する
    B: 交差点を通り抜けてから右側に車を寄せる
    C: 車をバックさせて交差点から出る
    D: 交差点の左側に車を寄せる
  answer: B
  explanation: 交差点内にいる場合は、交差点を通り抜けてから車を寄せてください。そうしないと、交差点を通過する緊急車両の進路を塞いでしまう可能性があります。
- id: 425
  category: safe_driving_rules
  question: テネシー州の「ムーブ・オーバー法（Move Over Law）」に基づき、複数車線の道路で点滅灯をつけて停車している緊急車両や作業車両に接近する場合、どうしなければなりませんか？
  choices:
    A: 車を停止させ、停車中の車両が動くのを待つ
    B: その車両に隣接しない車線に車線変更するか、減速して注意しながら進む
    C: 速度を維持し、作業員に警告するためにクラクションを鳴らす
    D: 路肩に車を寄せ、ハザードランプを点灯させる
  answer: B
  explanation: テネシー州の「ムーブ・オーバー法（Move Over Law）」では、点滅灯をつけて停車している緊急車両に接近する場合、その車両に隣接しない車線に車線変更するか、減速して注意しながら進むことが義務付けられています。
- id: 426
  category: sharing_the_road
  question: 乗客の乗降のために停車している路線バス（メトロバス）に対して、一時停止する義務はありますか？
  choices:
    A: はい、スクールバスの場合と同様に停止しなければならない
    B: はい、ただしバスがハザードランプを点滅させている場合のみ
    C: いいえ、停止する義務も追い越しを禁止されることもない
    D: いいえ、バスが指定されたスクールゾーンにいない限り必要ない
  answer: C
  explanation: 乗客の乗降のために停車している路線バスに対しては、同じ状況のスクールバスのように停止する義務はなく、追い越しが禁止されることもありません。
- id: 427
  category: safe_driving_rules
  question: 緊急事態に対応している消防車や緊急車両に関して、違法となる行為は次のうちどれですか？
  choices:
    A: 交差点で優先権を譲る
    B: 火災報知器に対応している消防車の後を追う
    C: 接近してきたときにラジオの音量を下げる
    D: 接近してきたときに右側の縁石に車を寄せる
  answer: B
  explanation: 火災報知器やその他の緊急事態に対応している消防車やその他の緊急車両の後を追うことは法律で禁止されています。
- id: 428
  category: safe_driving_rules
  question: 曲がるときの第一のルールは何ですか？
  choices:
    A: 進行方向の最も近い車線から、曲がりたい方向の最も近い合法的な車線へ曲がる
    B: 常に一番左の車線に曲がる
    C: 曲がる少なくとも50フィート前から合図を出す
    D: 曲がり始める前にクラクションを鳴らす
  answer: A
  explanation: 曲がるときの第一のルールは、進行方向の最も近い車線から、曲がりたい方向の最も近い合法的な車線へ曲がることです。
- id: 429
  category: vehicle_information
  question: 許可されていない自家用車に設置したり、外から見えるように表示したりすることが違法となるのは、次のうちどれですか？
  choices:
    A: 白色の点滅灯
    B: 黄色の緊急点滅灯
    C: 青色の緊急点滅灯、または青色と赤色の組み合わせ
    D: 緑色の点滅灯
  answer: C
  explanation: 許可されていない自家用車に、青色の緊急点滅灯、または青色と赤色の緊急点滅灯の組み合わせを設置、維持、またはいかなる方法であれ外から見えるように表示することは法律で禁止されています。
- id: 430
  category: safe_driving_rules
  question: 自分の側の信号が青でも、他の車両がすでに交差点内にいる場合、どうしなければなりませんか？
  choices:
    A: 自分に優先権があるので、そのまま交差点を通過する
    B: クラクションを鳴らして、他の車両を無理やり動かす
    C: すでに交差点内にいる車両に道を譲る
    D: 交通の流れを維持するために、その車両を避けて進む
  answer: C
  explanation: 自分の側の信号が青であっても、すでに交差点内にいる車両には優先権を譲らなければなりません。
- id: 431
  category: safe_driving_rules
  question: 曲がる前に、どのくらい手前で方向指示器（ウィンカー）を点灯させなければなりませんか？
  choices:
    A: 少なくとも25フィート手前
    B: 少なくとも50フィート手前
    C: 少なくとも100フィート手前
    D: 少なくとも200フィート手前
  answer: B
  explanation: マニュアルには、曲がる少なくとも50フィート手前で方向指示器（ウィンカー）を点灯させなければならないと記載されています。
- id: 432
  category: safe_driving_rules
  question: 方向指示器（ウィンカー）を使用すれば、車線変更や右左折の優先権が得られますか？
  choices:
    A: はい、少なくとも50フィート手前で合図を出せば得られます。
    B: はい、ただし駐車場に入る場合のみ得られます。
    C: いいえ、合図を出しても優先権は得られません。
    D: いいえ、手信号を使用しない限り得られません。
  answer: C
  explanation: 合図は、あなたの車の進行方向を変更する意図を他の運転手に知らせるものですが、マニュアルには合図を出しても優先権は得られないと明記されています。
- id: 433
  category: defensive_driving
  question: 曲がるのを待っている間、車のタイヤをまっすぐにしておくべきなのはなぜですか？
  choices:
    A: パワーステアリングフルードの循環を助けるため。
    B: タイヤの偏摩耗を防ぐため。
    C: 後方から追突された場合、その衝撃で対向車線に押し出される可能性があるため。
    D: 信号が青になったときに、より早く加速できるため。
  answer: C
  explanation: マニュアルでは、対向車が通過するのを待つ間、曲がる方向にタイヤを向けないよう警告しています。タイヤを曲げた状態で後方から追突されると、その衝撃で対向車線に押し出される危険があります。
- id: 434
  category: safe_driving_rules
  question: 交差点のすぐ先にある私道（ドライブウェイ）に曲がって入る予定の場合、いつ合図を出すべきですか？
  choices:
    A: 交差点の少なくとも50フィート手前。
    B: 交差点に入るまで合図を出さない。
    C: ハンドルを切り始めると同時。
    D: 私道に入るための合図は必要ない。
  answer: B
  explanation: 交差点の先で曲がる予定の場合、交差点に入るまで合図を出さないでください。早く合図を出すと、他の運転手があなたが交差点で曲がるつもりだと勘違いし、あなたの進路に進入してくる可能性があります。
- id: 435
  category: defensive_driving
  question: 車の方向指示器が見えにくくなる可能性があるため、マニュアルで手信号の使用が特に推奨されているのはどのような天候の時ですか？
  choices:
    A: 大雨
    B: 濃霧
    C: 太陽が眩しく照りつけている時
    D: 吹雪の時
  answer: C
  explanation: 太陽が眩しく照りつけている時は、手信号を使用するべきです。強い日差しにより、他の運転手から方向指示器の光が見えにくくなるためです。
- id: 436
  category: safe_driving_rules
  question: 方向指示器（ウィンカー）を次の目的で使用してはいけません：
  choices:
    A: 駐車位置から発進することを示すため。
    B: 後続車の運転手に、自分の車を追い越すよう合図するため。
    C: 州間高速道路（インターステート）に合流することを示すため。
    D: 急減速することを示すため。
  answer: B
  explanation: マニュアルには、後続車の運転手に自分の車を追い越すよう合図するために方向指示器を使用してはならないと記載されています。これは他の運転手の誤解を招くためです。
- id: 437
  category: vehicle_information
  question: 交差点内でギアチェンジを避けるべきなのはなぜですか？
  choices:
    A: クラッチの過度な摩耗を引き起こすため。
    B: 違法であり、重い罰金が科せられるため。
    C: エンストを起こし、事故の原因になったり交差点を塞いだりする可能性があるため。
    D: 方向指示器が自動的に消えてしまうため。
  answer: C
  explanation: マニュアルでは次のようにアドバイスしています。「交差点内ではギアチェンジをしないでください（エンストした場合、事故を引き起こしたり、他の交通のために交差点を塞いでしまう可能性があります）。」
- id: 438
  category: defensive_driving
  question: 停止の合図をする際、ブレーキランプで注意を引くにはどうすればよいですか？
  choices:
    A: ハザードランプを点灯させる。
    B: ブレーキを数回軽く踏む（ポンピングブレーキ）。
    C: すぐにブレーキペダルを床まで踏み込む。
    D: ブレーキをかける前にニュートラルに入れる。
  answer: B
  explanation: 停止の合図をする際は、ブレーキランプで注意を引くために、ブレーキを数回軽く踏む（ポンピングブレーキ）べきです。
- id: 439
  category: safe_driving_rules
  question: 交差点で別の車と鉢合わせになり、お互いに左折したい場合、どのように進むべきですか？
  choices:
    A: お互いに相手の車の右側を通って曲がる。
    B: 先に到着した運転手が優先権を持ち、先に曲がる。
    C: お互いに相手の車の左側を通って曲がる。
    D: 両方の運転手は青の矢印信号を待たなければならない。
  answer: C
  explanation: 交差点で別の車と鉢合わせになり、お互いに左折したい場合、それぞれ相手の車の左側を通って曲がります。
- id: 440
  category: signs_and_signals
  question: 一方通行の道路のセンターラインは何色ですか？
  choices:
    A: 黄色
    B: 白色
    C: 赤色
    D: 青色
  answer: B
  explanation: マニュアルによると、対面通行（双方向）の道路のセンターラインは黄色ですが、一方通行の道路のセンターラインは白色です。
- id: 441
  category: safe_driving_rules
  question: 実際に曲がっている最中に手信号を使う場合、腕はどうするべきですか？
  choices:
    A: 曲がり終えるまで完全に伸ばしたままにする。
    B: 円を描くように振る。
    C: ハンドル操作を維持するために腕を車内に戻す。
    D: 曲がろうとしている車線を指差す。
  answer: C
  explanation: 手信号を使う場合、ハンドル操作を維持するために、実際に曲がる際には腕を車内に戻す必要があります。
- id: 442
  category: defensive_driving
  question: 方向指示器（ウィンカー）を使用した後に消し忘れると、どのような潜在的な危険がありますか？
  choices:
    A: 車のバッテリーが上がる。
    B: 他の運転手があなたの前に割り込もうとする可能性がある。
    C: ブレーキランプが機能しなくなる。
    D: パーキングブレーキが自動的に作動する。
  answer: B
  explanation: 意図しない合図であっても、他の運転手にとっては「曲がる」という意味になります。つけっぱなしにすることで、他の運転手があなたの前に割り込もうとする原因になる可能性があります。
- id: 443
  category: safe_driving_rules
  question: 対面通行（双方向）の道路から別の対面通行の道路へ通常の左折をする際、新しい道路に入った直後はどこを走行するべきですか？
  choices:
    A: 対向車を避けるため、一番右の車線に入る。
    B: センターラインを越えた最初の車線の、センターラインのすぐ右側。
    C: センターラインの真上。
    D: 車がいない空いている車線ならどこでもよい。
  answer: B
  explanation: 進入する道路のセンターラインのすぐ右側を走行し、必ずセンターラインを越えた最初の車線に入ります。これにより、右折や左折をする他の車両との衝突を避けることができます。
- id: 444
  category: signs_and_signals
  question: 左折待ちをしていて、対向車が通り過ぎるのを待っている間に信号が黄色に変わった場合、どうするべきですか？
  choices:
    A: 赤信号になる前に急加速して通り抜ける。
    B: すぐに交差点に進入する。
    C: 交差点に進入してはいけない。
    D: 横断歩道まで後退する。
  answer: C
  explanation: マニュアルには次のように記載されています。「対向車が交差点を通り過ぎるのを待っている間に信号が黄色に変わった場合は、交差点に進入してはいけません。」
- id: 445
  category: safe_driving_rules
  question: 対面通行（双方向）の道路から一方通行の道路へ左折する場合、どの車線に入るべきですか？
  choices:
    A: 一番右側の車線。
    B: 中央の車線。
    C: 左側の縁石に最も近い最初の車線。
    D: 現在空いている車線ならどこでもよい。
  answer: C
  explanation: 対面通行の道路から一方通行の道路へ左折する場合、マニュアルでは「最初の車線に鋭角に曲がります... 左側の縁石に最も近い最初の車線に入らなければなりません」と指示されています。
- id: 446
  category: safe_driving_rules
  question: テネシー州において、赤信号での左折が許可されるのはどのような条件の時ですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ曲がる時。
    B: 一方通行の道路から別の一方通行の道路へ曲がる時。
    C: 一方通行の道路から対面通行の道路へ曲がる時。
    D: 赤信号での左折は決して許可されない。
  answer: B
  explanation: 赤信号での左折は、一方通行の道路が別の一方通行の道路と交差するすべての交差点で許可されています。ただし、最初に完全に一時停止し、それを禁止する標識がないことが条件です。
- id: 447
  category: safe_driving_rules
  question: 一方通行の道路から対面通行（双方向）の道路へ曲がる際、赤信号で左折することはできますか？
  choices:
    A: はい、完全に一時停止した後であれば可能です。
    B: はい、対向車がいなければ可能です。
    C: いいえ、この場合、赤信号で左折することはできません。
    D: はい、ただし深夜0時から午前6時の間のみ可能です。
  answer: C
  explanation: マニュアルには、一方通行の道路から対面通行の道路への左折について、「この場合、赤信号で左折することはできません」と明記されています。
- id: 448
  category: safe_driving_rules
  question: 右折する際、どれくらい手前で方向指示器（ウィンカー）を出さなければなりませんか？
  choices:
    A: 少なくとも25フィート手前。
    B: 少なくとも50フィート手前。
    C: 少なくとも100フィート手前。
    D: 少なくとも200フィート手前。
  answer: B
  explanation: マニュアルには、「右折の合図は少なくとも50フィート手前で出さなければならない」と記載されています。
- id: 449
  category: defensive_driving
  question: 右折する前や右折中に、左へ大きく膨らむのを避けるべきなのはなぜですか？
  choices:
    A: ハンドルがロックされる原因になるため。
    B: 後続車の運転手が、あなたが車線変更や左折をすると勘違いし、右側から追い越そうとする可能性があるため。
    C: 白線を越えることは違法であるため。
    D: ラウンドアバウト（環状交差点）に進入してしまうため。
  answer: B
  explanation: 右折時に左へ大きく膨らむと、「後続車の運転手が、あなたが車線変更や左折をすると勘違いし、右側から追い越そうとする可能性がある」からです。
- id: 450
  category: sharing_the_road
  question: 大型トラックが右折する可能性がある場合、その右側から追い越すのを避けるべきなのはなぜですか？
  choices:
    A: トラックは乗用車よりも加速が速いため。
    B: トラックは大回りをする必要があり、曲がる直前に右側にスペースを空けることがあるため。
    C: トラックは方向指示器の使用が許可されていないため。
    D: 交差点では常にトラックに優先権があるため。
  answer: B
  explanation: 大型トラックやバスは必ず大回りをしなければならず、曲がる直前に右側にスペースを空けることがあります。右側から追い越すと事故の原因になる可能性があります。
- id: 451
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）では、常にどの方向に進まなければなりませんか？
  choices:
    A: 時計回り。
    B: 反時計回り（右方向）。
    C: 中央を直進する。
    D: 交通量が少ない方向。
  answer: B
  explanation: マニュアルでは、「ラウンドアバウトでは常に右方向、反時計回りに進むこと」と指示されています。
- id: 452
  category: safe_driving_rules
  question: 複数車線のあるラウンドアバウトでの他の車両の追い越しに関するルールは何ですか？
  choices:
    A: 左側からのみ追い越しができる。
    B: 右側からのみ追い越しができる。
    C: 前方の車両が時速15マイル未満で走行している場合は追い越しができる。
    D: いかなる車両も追い越してはならない。
  answer: D
  explanation: 複数車線のラウンドアバウトについて、マニュアルには「いかなる車両も追い越してはならない」と明記されています。
- id: 453
  category: safe_driving_rules
  question: 両方向からの交通が少なくともどの距離まで見えない場所では、Uターンをしてはいけませんか？
  choices:
    A: 100フィート
    B: 250フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: 地方や都市部のいかなる場所、またはカーブや丘の頂上付近であっても、両方向からの交通が少なくとも500フィート先まで見えない場所では、Uターンをしてはいけません。
- id: 454
  category: safe_driving_rules
  question: テネシー州の州間高速道路で出口を通り過ぎてしまった場合、どうすればよいですか？
  choices:
    A: 中央分離帯の緊急用連絡路を使って引き返す。
    B: 高速道路が空いている時にUターンする。
    C: 次の出口ランプまでそのまま走行する。
    D: 路肩を注意深く後退する。
  answer: C
  explanation: 州間高速道路でのUターンや緊急用連絡路の使用は違法です。マニュアルでは「次の出口ランプまでそのまま走行する」ようアドバイスしています。
- id: 455
  category: safe_driving_rules
  question: アメリカの道路における「右側通行」の原則を要約しているフレーズはどれですか？
  choices:
    A: 右に黄色、左に白色
    B: 右に白色、左に黄色
    C: 右折時以外は右側をキープする
    D: 右側から追い越し、左側を走行する
  answer: B
  explanation: マニュアルには、車線利用の概要は「右に白色、左に黄色」というシンプルな言葉で要約されると記載されています。
- id: 456
  category: safe_driving_rules
  question: 対面通行の3車線または5車線の幹線道路において、中央車線は何のために使用されますか？
  choices:
    A: 低速車両の追い越し。
    B: 緊急時の駐車のみ。
    C: 左折のみ。
    D: 右折のみ。
  answer: C
  explanation: マニュアルには「対面通行の3車線または5車線の幹線道路の中央車線は、左折のみに使用される」と明記されています。
- id: 457
  category: safe_driving_rules
  question: 信号機や警察官が交通整理を行っている交差点でUターンすることは合法ですか？
  choices:
    A: はい、青信号であれば合法です。
    B: はい、対向車がいなければ合法です。
    C: いいえ、そのような交差点でUターンをしてはいけません。
    D: はい、ただし地方の地域に限ります。
  answer: C
  explanation: マニュアルにはUターンが禁止されている場所が列挙されており、その中には「信号機や警察官が交通整理を行っている交差点」が含まれています。
- id: 458
  category: safe_driving_rules
  question: ラウンドアバウトから出る意思をどのように示すべきですか？
  choices:
    A: ヘッドライトを点滅させる。
    B: 左折の方向指示器（ウィンカー）を使用する。
    C: 右折の方向指示器（ウィンカー）を使用する。
    D: クラクションを鳴らす。
  answer: C
  explanation: マニュアルでは、「注意してラウンドアバウトから出ること。出る時は常に右折の方向指示器を使用して合図すること」と指示されています。
- id: 459
  category: safe_driving_rules
  question: 4車線の幹線道路では、通常どこを走行すべきですか？
  choices:
    A: 常に一番左の車線
    B: 追い越しや左折をする時以外は、一番右の車線
    C: 最も交通量が少ない車線
    D: 視界を保つために白い破線をまたいで走行する
  answer: B
  explanation: マニュアルによると、4車線の幹線道路では「他の車両を追い越す時や左折する時を除き、一番右の車線を走行する」べきです。
- id: 460
  category: defensive_driving
  question: 中央分離帯のある4車線の幹線道路で指定された連絡路（クロスオーバー）を使用しようとする際、すでに別の車両が連絡路内で交通が途切れるのを待っている場合、どうすべきですか？
  choices:
    A: 待機している車両の横にある連絡路の左側に進入する
    B: 連絡路内で待機している車にぴったりと後ろに詰める
    C: 方向指示器を出したまま、幹線道路の一番左の車線で停止して待つ
    D: 次の交差点まで進んでUターンする
  answer: C
  explanation: マニュアルには、「すでに車両が連絡路内で交通が途切れるのを待っている場合、その待機車両が連絡路を出るまで、方向指示器を出したまま4車線道路の一番左の車線で停止して待つこと」と記載されています。
- id: 461
  category: signs_and_signals
  question: 道路の車線や路側帯に、自分の方を向いている赤い反射板（リフレクター）が見えた場合、それは何を意味していますか？
  choices:
    A: 工事区間に近づいている
    B: 逆走しており、正面衝突の危険がある
    C: 多人数乗車車両（HOV）専用車線に入ろうとしている
    D: この先で制限速度が下がる
  answer: B
  explanation: マニュアルには次のように警告されています。「赤い反射板は常に、あなたが逆走しており、正面衝突の危険があることを意味しています。」
- id: 462
  category: safe_driving_rules
  question: 共用の中央右左折車線（shared center turn lane）を走行できる最大距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: マニュアルには、共用の中央右左折車線は「追い越しに使用してはならず、300フィートを超えて走行するために使用してはならない」と規定されています。
- id: 463
  category: safe_driving_rules
  question: 2台の車両が反対方向から同時に共用の中央右左折車線に入った場合、どちらに優先権がありますか？
  choices:
    A: より速い速度で走行している車両
    B: 右折する車両
    C: 2台のうち大きい方の車両
    D: 先に車線に入った車両
  answer: D
  explanation: マニュアルによると、「反対方向から車両が右左折車線に入る場合、先に車線に入った車両に優先権があります。」
- id: 464
  category: signs_and_signals
  question: リバーシブルレーン（可逆車線）は通常、道路上でどのように標示されていますか？
  choices:
    A: 二重の黄色い破線
    B: 両側の白い実線
    C: 1本の黄色い実線
    D: 赤と白の交互の反射板
  answer: A
  explanation: マニュアルには、リバーシブルレーンは「通常、二重の黄色い破線で標示される」と記載されています。
- id: 465
  category: signs_and_signals
  question: リバーシブルレーンを走行中、頭上の点滅する黄色の「X」信号は何を意味していますか？
  choices:
    A: その下の車線を走行することはできない
    B: その車線は右左折専用である
    C: 車線の進行方向が変更されようとしている
    D: その車線を直進することができる
  answer: B
  explanation: マニュアルでは、「点滅する黄色の『X』は、その車線が右左折専用であることを意味する」と説明されています。
- id: 466
  category: signs_and_signals
  question: リバーシブルレーンの上に点灯（点滅ではない）している黄色の「X」信号が見えた場合、どのような行動をとるべきですか？
  choices:
    A: 速度を上げて素早く車線を抜ける
    B: 車線内で直ちに停止する
    C: 安全が確認でき次第、速やかにその車線から出る
    D: その車線を追い越し専用として使用する
  answer: C
  explanation: マニュアルによると、「点灯している黄色の『X』は、車線の用途や進行方向が変更されようとしていることを意味し、安全が確認でき次第、速やかにその車線から出る必要があります。」
- id: 467
  category: signs_and_signals
  question: 「HOV 2」と書かれた標識は、専用車線について何を示していますか？
  choices:
    A: その車線は、少なくとも2人以上が乗車している車両専用である
    B: その車線は、大型商用車専用である
    C: その車線はこの先2マイルにわたって閉鎖されている
    D: ハイブリッド車または電気自動車のみがその車線を使用できる
  answer: A
  explanation: マニュアルには次のように記載されています。「例えば、『HOV 2』は、その車線を合法的に走行するためには、車両に少なくとも2人以上が乗車していなければならないことを意味します。」
- id: 468
  category: defensive_driving
  question: 車線変更をする前に、肩越しに後方を確認することが不可欠なのはなぜですか？
  choices:
    A: 後続車の速度を確認するため
    B: 方向指示器が正しく機能しているか確認するため
    C: ミラーでは見えない死角に車両がいないか確認するため
    D: 他の運転手に自分の意図を伝えるため
  answer: C
  explanation: マニュアルでは、死角を確認するためには「運転手はミラーを確認するだけではオートバイや他の車を見ることはできません。隣にいる車両を見るためには、実際に頭を回して左右それぞれの肩越しに後方を確認する必要があります」と説明されています。
- id: 469
  category: sharing_the_road
  question: 前方の運転手が車線変更の合図を出した場合、あなたはどうするべきですか？
  choices:
    A: 相手が車線変更する前に速度を上げて追い越す
    B: 減速して車線変更のためのスペースを空ける
    C: 相手の邪魔にならないよう、自分も車線変更する
    D: クラクションを鳴らして動かないよう警告する
  answer: B
  explanation: マニュアルには次のように助言されています。「前方（自分の車線または隣の車線）の運転手が車線変更の合図を出した場合は、減速して車線変更のためのスペースを空けてください。絶対に速度を上げたり、自分自身が車線変更をしたりしないでください。」
- id: 470
  category: safe_driving_rules
  question: 2車線道路（片側1車線）で他の車両を追い越そうとする際、対向車に関する良い原則は何ですか？
  choices:
    A: 対向車の気配が少しでもあれば、追い越しのリスクを冒すには近すぎる
    B: 対向車が100フィート以上離れていれば追い越してもよい
    C: ヘッドライトをパッシングして対向車を減速させる
    D: 急加速して対向車より先に通り抜ける
  answer: A
  explanation: マニュアルには次のように記載されています。「原則として、対向車の気配が少しでもあれば、追い越しのリスクを冒すには近すぎます。迷った場合は、自分の車線に留まってください。」
- id: 471
  category: defensive_driving
  question: 追い越しを始める前に、追い越そうとする車の後方に十分な車間距離を保つべきなのはなぜですか？
  choices:
    A: 素早く追い越すための十分な速度を出すため
    B: 前方の道路の視界を良くするため
    C: タイヤで跳ね上げられた破片が当たるのを防ぐため
    D: 追い越しの準備ができるまで死角に隠れるため
  answer: B
  explanation: マニュアルでは、「前方の道路の視界を良くするために、追い越そうとする車の後方に十分な車間距離を保つこと」と指導しています。
- id: 472
  category: defensive_driving
  question: 追い越し前に前方を確認するためだけに、センターラインを越えて車をはみ出させることを避けるべきなのはなぜですか？
  choices:
    A: いかなる状況でもセンターラインを越えることは違法だから
    B: 車間距離が近すぎるか、安全でない追い越しを試みていることを示しているから
    C: 車のトラクション（駆動力）が失われる原因になるから
    D: 後続車の運転手が左折すると勘違いして混乱するから
  answer: B
  explanation: マニュアルでは次のように警告しています。「前方を確認するためにセンターラインを越えて車をはみ出させてはいけません。確認のためにそうする必要がある場合、車間距離が近すぎるか、無理な追い越しを試みているかのどちらかです。」
- id: 473
  category: safe_driving_rules
  question: 州間高速道路（インターステート）のクロスオーバー（中央分離帯の通り抜け通路）に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 中央分離帯が舗装されていれば、Uターンに使用できる
    B: 多人数乗車車両（HOV）専用である
    C: 州間高速道路には一般車両用のクロスオーバーは設けられていない
    D: 交差する道路と同じように扱うべきである
  answer: C
  explanation: マニュアルには、「州間高速道路には一般車両用のクロスオーバーは設けられていない」と明記されています。
- id: 474
  category: safe_driving_rules
  question: 左側から車を追い越す場合、右側の車線に戻るのが安全なのはいつですか？
  choices:
    A: その車の50フィート（約15メートル）前方に達したとき。
    B: その車のフロントバンパーを通り過ぎた直後。
    C: 追い越した車の全体がルームミラーで見えるようになったとき。
    D: 追い越された運転手がヘッドライトを点滅させたとき。
  answer: C
  explanation: マニュアルには次のように記載されています。「できるだけ早く追い越しを完了させてください。追い越した車の全体がルームミラーで見えるようになったら、右に合図を出して元の車線に戻ります。」
- id: 475
  category: safe_driving_rules
  question: テネシー州では、同時に複数の車を追い越すことは違法ですか？
  choices:
    A: はい、法律で厳しく禁止されています。
    B: いいえ、違法ではありませんが、一般的には推奨されません。
    C: はい、多車線道路でない限り違法です。
    D: いいえ、低速の交通を追い越すための推奨される方法です。
  answer: B
  explanation: マニュアルには次のように記されています。「テネシー州では複数の車を追い越すことは違法ではありませんが、原則として一度に複数の車を追い越すことは安全ではありません。特定の条件を満たさない限り、複数の車の追い越しを検討することすら推奨されません。」
- id: 476
  category: safe_driving_rules
  question: 次のどの条件において、右側からの追い越しが許可されていますか？
  choices:
    A: 前方の車が左折の合図を出しているとき。
    B: 幹線道路の舗装された路肩を使用するとき。
    C: 交通を避けるために指定された自転車専用レーンを使用するとき。
    D: 2車線道路で前方の車が制限速度を下回って走行しているとき。
  answer: A
  explanation: 右側からの追い越しは、「追い越される車が左折の合図を出している、または左折しようとしている場合」に許可されています。舗装路外や自転車専用レーンでの追い越しは決して許可されません。
- id: 477
  category: safe_driving_rules
  question: 緊急車両用レーンや駐車レーンを使用して、右側から車を追い越すことが許可されるのはいつですか？
  choices:
    A: 前方の車が赤信号で停止しているとき。
    B: 信号機や一時停止標識が見える範囲にいるとき。
    C: 前方の車が左折しているとき。
    D: 駐車レーンや緊急車両用レーンを使用して右側から追い越すことは決して許可されない。
  answer: D
  explanation: マニュアルには次のように明記されています。「いかなる場所でも自転車専用レーンや駐車レーンを使用して右側から追い越してはいけません。また、信号機や一時停止標識が見える範囲の緊急車両用レーンでも同様です。」
- id: 478
  category: sharing_the_road
  question: 多車線道路の横断歩道で停止する場合、横断歩道のどれくらい手前で停止すべきですか？
  choices:
    A: 10フィート（約3メートル）
    B: 15フィート（約4.5メートル）
    C: 30フィート（約9メートル）
    D: 50フィート（約15メートル）
  answer: C
  explanation: マニュアルの安全のヒントによると、「多車線道路の横断歩道で停止する場合、他の車線の運転手から横断中の歩行者が見えなくなるのを防ぐため、横断歩道の約30フィート（約9メートル）手前で停止する必要があります。」
- id: 479
  category: signs_and_signals
  question: 「追い越し禁止区域（no-passing zone）」の終わりは何を示していますか？
  choices:
    A: 自動的に追い越しが安全になる。
    B: 前方の視界が広がるが、追い越しが安全かどうかは依然として自分で判断しなければならない。
    C: 前方の低速車両を追い越すことが義務付けられる。
    D: 制限速度が上がる。
  answer: B
  explanation: マニュアルには次のように記載されています。「『追い越し禁止区域』の終わりは、追い越しが安全であることを意味するわけではありません。前方の視界が広がることを意味します。追い越しが安全かどうかを判断するのは、依然としてあなた自身の責任です。」
- id: 480
  category: safe_driving_rules
  question: 「追い越し禁止区域」の路面に引かれた黄色の実線を越えることは許可されていますか？
  choices:
    A: いいえ、黄色の実線を越えることは決して許可されません。
    B: はい、ただし低速のトラクターや自転車を追い越す場合のみです。
    C: はい、路地、私道、またはドライブウェイに出入りするためにセンターラインを越えて曲がることは許可されています。
    D: はい、対向車が来る前に追い越しを完了できる場合です。
  answer: C
  explanation: マニュアルでは次のように説明しています。「『追い越し禁止区域』内であっても、路地、交差点、私道、またはドライブウェイへ左折して入る場合や、そこから出る場合には、センターラインを越えて曲がることが許可されています。」
- id: 481
  category: defensive_driving
  question: 他の車両があなたを追い越そうとしている時に、対向車が接近しているのに気づいた場合、どうすべきですか？
  choices:
    A: 追い越そうとしている車両があなたの後ろに入れるようにスピードを上げる。
    B: 左に寄って、追い越そうとしている車両をブロックする。
    C: 減速して、追い越そうとしているドライバーが右車線に戻るためのスペースをより多く確保する。
    D: クラクションを鳴らし、現在の速度を維持する。
  answer: C
  explanation: 他のドライバーが安全に追い越しを行えるよう支援するためには、「追い越されている最中に反対方向から車が接近しているのに気づいた場合は減速する」必要があります。減速することで、追い越そうとしているドライバーが右車線に戻るためのスペースをより多く確保することができます。
- id: 482
  category: sharing_the_road
  question: 自転車を追い越す際、車両と自転車の間に最低限空けなければならない距離はどれくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 5フィート
  answer: B
  explanation: マニュアルには次のように記載されています。「同じ方向に進んでいる自転車を追い越す際は、ゆっくりと行い、車両と自転車の間に少なくとも3フィート以上の距離を空けてください。」
- id: 483
  category: sharing_the_road
  question: 大型トラックやバスの後ろを走行している際、自分がそのドライバーの死角に入っているかどうかをどのように判断できますか？
  choices:
    A: ルームミラー越しにドライバーの顔が見える。
    B: トラックやバスのサイドミラーが見えない。
    C: 100フィート以上の車間距離を保って追従している。
    D: トラックのトレーラー全体が見える。
  answer: B
  explanation: マニュアルには覚えておくべき重要なポイントが記載されています。「前方を走るトラックやバスのサイドミラーが見えない場合、そのトラックやバスのドライバーからもあなたの車は見えていません。」
- id: 484
  category: sharing_the_road
  question: 大型トラックやバスを追い越した後に、ドライバーがよく犯す危険な間違いは何ですか？
  choices:
    A: 車線に戻った後、急加速しすぎる。
    B: トラックやバスの前に割り込んで減速する。
    C: ウインカーを早く消しすぎる。
    D: 自分の車とトラックの間にスペースを空けすぎる。
  answer: B
  explanation: マニュアルでは次のように指示しています。「速度を維持してください。トラックやバス（またはその他のいかなる車両）の前方に割り込んで減速することは絶対にやめてください。これは、あなたが今追い越したドライバーの安全な車間距離（セーフティクッション）を奪うことになります。」
- id: 485
  category: sharing_the_road
  question: 下り坂を走行している場合、大型トラックやバスの追い越しにどのような影響がありますか？
  choices:
    A: トラックの速度が落ちるため、追い越しやすくなる。
    B: トラックの勢いが増して速度が上がるため、追い越すには自分の速度を上げる必要があるかもしれない。
    C: トラックは路肩に寄ることを余儀なくされる。
    D: 下り坂での追い越しは法律で厳しく禁止されている。
  answer: B
  explanation: マニュアルでは地形の影響について次のように説明しています。「下り坂では、勢いがついてトラックの速度が上がるため、追い越すには自分の速度を上げる必要があるかもしれません。」
- id: 486
  category: defensive_driving
  question: 他のドライバーが左側からあなたを追い越そうとしている時の正しい手順は何ですか？
  choices:
    A: 急な割り込みを防ぐためにスピードを上げる。
    B: 危険な場合は左車線に移動してブロックする。
    C: 自分の車線を維持し、右寄りに移動して、速度を保つ。
    D: ヘッドライトを点滅させて対向車に警告する。
  answer: C
  explanation: 追い越される際は、次の方法で他のドライバーを支援する必要があります。「自分の車線を維持し、左側から追い越される場合は右寄りに移動します。速度を維持してください。他のドライバーの追い越しを妨げるためにスピードを上げてはいけません。」
- id: 487
  category: safe_driving_rules
  question: 次のうち、追い越しのためにセンターラインを越えることが禁止されている状況はどれですか？
  choices:
    A: 横断歩道で歩行者のために停止している車に接近している時。
    B: 前方の車両が制限速度より15 mph遅く走行している時。
    C: 視界が良好で、直線かつ平坦な道路を走行している時。
    D: 前方の車両が自転車である時。
  answer: A
  explanation: マニュアルには、追い越しのためにセンターラインを越えてはならない条件がいくつか挙げられており、その中には次のようなものがあります。「標示の有無にかかわらず、横断歩道で歩行者のために停止している車を追い越してはいけません。」
- id: 488
  category: safe_driving_rules
  question: 他の車両を追い越す際、標識で指定された制限速度を超えることは合法ですか？
  choices:
    A: はい、ただし最大5 mphまでです。
    B: はい、複数のトレーラーを牽引する商用トラックを追い越す場合です。
    C: いいえ、追い越し時であっても指定された制限速度を超えることは違法です。
    D: はい、下り坂で素早く追い越す必要がある場合です。
  answer: C
  explanation: マニュアルには次のように記載されています。「他の車両を追い越す場合であっても、標識で指定された制限速度を超えることは違法であることを覚えておいてください。」
- id: 489
  category: safe_driving_rules
  question: 車を後退（バック）させる際、後方を確認する正しい方法は何ですか？
  choices:
    A: ルームミラーとサイドミラーのみに頼る。
    B: ドアを開けて頭を外に出して確認する。
    C: 腕をシートの背もたれに置き、振り返ってリアウィンドウから直接後方を見る。
    D: クラクションを鳴らし、ルームミラーを確認しながら素早く後退する。
  answer: C
  explanation: 後退する前に、腕をシートの背もたれに置き、振り返ってリアウィンドウから直接後方を見る必要があります。マニュアルでは、ミラーのみに頼ったり、ドアを開けて外を見たりすることに対して明確に警告しています。
- id: 490
  category: safe_driving_rules
  question: 州間高速道路（インターステート）で曲がる場所や出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 停止し、路肩を慎重に後退する。
    B: ハザードランプを点灯させ、走行車線を後退する。
    C: 中央分離帯を横切ってUターンする。
    D: 安全かつ合法的に方向転換できる次の曲がり角や出口まで進む。
  answer: D
  explanation: 曲がる場所や出口を通り過ぎてしまった場合は、後退してはいけません。安全かつ合法的に方向転換できる次の曲がり角や出口まで進んでください。州間高速道路での後退は違法です。
- id: 491
  category: safe_driving_rules
  question: 市の境界外（市外）の車道に隣接して駐車する場合、あなたの車両は前後どちらの方向からも少なくとも何フィート先から見える状態でなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 市外の車道に隣接して駐車する場合、あなたの車両は前後どちらの方向からも少なくとも200フィート先から見える状態でなければなりません。
- id: 492
  category: safe_driving_rules
  question: 市外で駐車する場合、他の車両が駐車したあなたの車両を通り過ぎるために、少なくともどれだけの道路幅を確保しなければなりませんか？
  choices:
    A: 10フィート
    B: 12フィート
    C: 15フィート
    D: 18フィート
  answer: D
  explanation: どのような場合でも、市外の車道に隣接して駐車する際は、他の車両が駐車したあなたの車両を通り過ぎることができるよう、少なくとも18フィートの道路幅を確保しなければなりません。
- id: 493
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、前輪をどちらの方向に向けなければなりませんか？
  choices:
    A: 縁石の方向（右）
    B: 縁石から離れる方向（左）
    C: まっすぐ前
    D: 縁石と平行
  answer: B
  explanation: 縁石のある上り坂では、前輪を縁石から離れる方向（左）に向けます。こうすることで、車が後退し始めた場合でも、縁石にぶつかって止まるようになります。
- id: 494
  category: safe_driving_rules
  question: 消火栓から何フィート以内の駐車が違法とされていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: B
  explanation: マニュアルの駐車禁止区域（NO PARKING ZONES）には、違法となる場所として「消火栓から15フィート以内」と記載されています。
- id: 495
  category: safe_driving_rules
  question: 横断歩道から何フィート以内には駐車してはいけませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: C
  explanation: 横断歩道から20フィート以内、または横断歩道として標示されている区域内に駐車することは違法です。
- id: 496
  category: safe_driving_rules
  question: 縦列駐車を完了した際、車両は縁石からどれ以上離れていてはいけませんか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: C
  explanation: 縦列駐車を完了した際、車両は縁石から18インチ以上離れていてはいけません。
- id: 497
  category: defensive_driving
  question: 故障した車両を幹線道路（ハイウェイ）から移動させることができない場合、他の運転手に警告する一つの方法は何ですか？
  choices:
    A: 道路に立って腕を振る。
    B: 左側のドアハンドルまたはアンテナにハンカチを結びつける。
    C: ヘッドライトを継続的に点滅させる。
    D: 10秒ごとにクラクションを鳴らす。
  answer: B
  explanation: 車両を幹線道路から移動させることができない場合は、ボンネットを開けるか、左側のドアハンドルまたはアンテナにハンカチを結びつけて、他の運転手に停車している車両があることを警告してください。
- id: 498
  category: vehicle_information
  question: マニュアルトランスミッション（MT）車を駐車する際、トランスミッションはどうするべきですか？
  choices:
    A: ニュートラルにしてパーキングブレーキをかける。
    B: パーキング（P）に入れる。
    C: ギアを入れたままにしてパーキングブレーキをかける。
    D: パーキングブレーキをかけずにニュートラルにする。
  answer: C
  explanation: 駐車する際は常にパーキングブレーキをかけてください。マニュアルトランスミッション車の場合はギアを入れたままにし、オートマチックトランスミッション車の場合はパーキング（P）に入れます。
- id: 499
  category: safe_driving_rules
  question: 私道（ドライブウェイ）から交差点へ後退して進入することは合法ですか？
  choices:
    A: はい、最初に両方向を確認すれば合法です。
    B: はい、ただし日中のみ合法です。
    C: いいえ、私道から交差点へ後退して進入することは違法です。
    D: いいえ、同乗者の誘導がない限り違法です。
  answer: C
  explanation: マニュアルには「私道から交差点へ後退して進入することは違法である」と明記されています。
- id: 500
  category: safe_driving_rules
  question: 州間高速道路（インターステート）を歩くことについて、運転マニュアルにはどのように記載されていますか？
  choices:
    A: 路肩にいる限り許可されている。
    B: 日中のみ合法である。
    C: 違法であり、かつ危険である。
    D: 車が故障してガソリンが必要な場合は推奨されている。
  answer: C
  explanation: マニュアルには、州間高速道路を歩くことは違法であり危険であるため、助けが来るまで故障した車両の中に留まるべきであると明記されています。
- id: 501
  category: penalties_and_points
  question: 指定された身障者用駐車スペースに不適切に駐車した場合の罰則は何ですか？
  choices:
    A: 50ドルの罰金と書面による警告。
    B: 100ドルの罰金が科される軽犯罪であり、車両がレッカー移動される可能性がある。
    C: 500ドルの罰金が科される重罪。
    D: 即座に30日間の免許停止。
  answer: B
  explanation: 指定された身障者用駐車スペースへの不適切な駐車は、100ドルの罰金が科される軽犯罪であり、車両がレッカー移動される対象となる可能性があります。
- id: 502
  category: safe_driving_rules
  question: 斜め駐車のスペースからバックで出る際、車の前部について覚えておくべきことは何ですか？
  choices:
    A: 曲がる方向と同じ方向に振れる。
    B: 曲がる方向とは逆の方向に振れる。
    C: 振れることなくまっすぐ後ろに下がる。
    D: 最も近い縁石の方向に振れる。
  answer: B
  explanation: 斜め駐車のスペースからバックで出る前に、車の前部が曲がる方向とは逆の方向に振れることを覚えておかなければなりません。
- id: 503
  category: sharing_the_road
  question: 同じ方向に進んでいる自転車を追い越す際、運転者は法律により最低限どのくらいの距離を空けることが義務付けられていますか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 5フィート
  answer: C
  explanation: 運転者は、同じ方向に進んでいる自転車を追い越す際、法律により最低3フィートの距離を空けることが義務付けられています。
- id: 504
  category: safe_driving_rules
  question: 州間高速道路（インターステート）に進入する際、加速車線の適切な使い方は何ですか？
  choices:
    A: 緊急時に車両を駐車するため。
    B: 停止して、交通の大きな切れ目を待つため。
    C: 加速して、高速で移動する交通に合流するため。
    D: 州間高速道路の交通に降りる場所を提供するため。
  answer: C
  explanation: 州間高速道路に進入する際は、合流車線または加速車線を使用して加速し、すでに州間高速道路を高速で移動している交通に合流しなければなりません。
- id: 505
  category: safe_driving_rules
  question: オンランプ（進入路）から州間高速道路に進入しようとする際、誰に優先権がありますか？
  choices:
    A: 州間高速道路に進入する車両。
    B: すでに州間高速道路を走行している他の車。
    C: より速く走行している車両。
    D: 右側にいる車両。
  answer: B
  explanation: 進入する際は、すでに州間高速道路を走行している他の車に優先権を譲る責任があります。
- id: 506
  category: signs_and_signals
  question: 「車線追加（lane added）」の標識は、すでに州間高速道路を走行している運転者に何を示していますか？
  choices:
    A: 直ちに左に合流しなければならない。
    B: この場所では右への車線変更を避けるべきである。
    C: 進入してくるすべての交通に道を譲らなければならない。
    D: 州間高速道路が終了するため、降りなければならない。
  answer: B
  explanation: 「車線追加」の標識は、進入してくる交通のために新しい右車線が追加されることを意味します。進入してくる交通は車両が自分たちの進路に入ってくるとは予想していないため、州間高速道路上の交通は右への車線変更を避けるべきです。
- id: 507
  category: safe_driving_rules
  question: 同じ方向に進む複数の車線がある州間高速道路では、一番左の車線は何のために使用されるべきですか？
  choices:
    A: 進入する交通。
    B: 降りる交通。
    C: 遅い車両。
    D: より速い交通。
  answer: D
  explanation: 同じ方向に進む複数の車線がある州間高速道路では、一番左の車線はより速い交通のために空けておくべきです。
- id: 508
  category: defensive_driving
  question: 悪天候時や夜間に州間高速道路を走行する際、推奨される最小の車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 6秒
  answer: C
  explanation: 前方の車両から少なくとも2秒の距離を保つべきであり、悪天候時、夜間の運転、および高速で走行する郊外の区間では、この間隔を最低4秒に増やす必要があります。
- id: 509
  category: defensive_driving
  question: 州間高速道路を運転する際、どのくらい前方の道路をスキャン（確認）するべきですか？
  choices:
    A: 5〜10秒
    B: 10〜15秒
    C: 15〜20秒
    D: 20〜30秒
  answer: C
  explanation: マニュアルでは、前方の道路をスキャンし、ブレーキをかけている車、進入してくる車、または降りていく車がないか、自車の15〜20秒前方を注視するよう推奨しています。
- id: 510
  category: defensive_driving
  question: 州間高速道路で渋滞を発見し、減速または停止しなければならない場合、後続の運転者に警告するために何をすべきですか？
  choices:
    A: ハイビームを点灯する。
    B: ブレーキペダルを数回軽く踏む。
    C: クラクションを鳴らし続ける。
    D: 車線内で左右に蛇行する。
  answer: B
  explanation: 渋滞を発見して減速または停止しなければならない場合は、後続の運転者に警告するためにブレーキペダルを数回軽く踏むべきです。
- id: 511
  category: defensive_driving
  question: マニュアルのサンプル問題によると、安全な車間距離を保つための「2秒ルール」が当てはまるのは次のうちどれですか？
  choices:
    A: 時速30マイル（m.p.h.）までの速度。
    B: 時速55マイル（m.p.h.）までの速度。
    C: どのような速度でも。
    D: 高速道路での速度のみ。
  answer: C
  explanation: サンプル問題には、安全な車間距離を保つための2秒ルールはどのような速度でも当てはまると記載されています。
- id: 512
  category: safe_driving_rules
  question: 州間高速道路を降りる場合、最も安全な準備方法はどれですか？
  choices:
    A: 慌てて車線変更するのを避けるため、できるだけ早く右車線に移動する。
    B: 出口ランプに到達するまで左車線にとどまる。
    C: 出口に向かって割り込む前に、速度を上げて遅い車を追い越す。
    D: 車線内で停止し、右車線に隙間ができるのを待つ。
  answer: A
  explanation: 州間高速道路を降りる場合は、危険な状況を招く可能性のある慌ただしい車線変更を避けるため、できるだけ早く右車線に移動してください。
- id: 513
  category: penalties_and_points
  question: 多人数乗車車両（HOV）専用車線の規則に違反した場合の罰則は何ですか？
  choices:
    A: 罰金25ドル
    B: 罰金50ドルおよび裁判費用
    C: 罰金100ドルおよび免許の違反点数2点
    D: 罰金75ドルおよび交通学校の受講義務
  answer: B
  explanation: マニュアルによると、HOV車線の違反が発覚した運転手には、50ドルの罰金と裁判費用が科せられます。
- id: 514
  category: safe_driving_rules
  question: 交通のピーク時に多人数乗車車両（HOV）専用車線を使用することが許可されている車両は、次のうちどれですか？
  choices:
    A: 他の車を追い越すために1人で運転している人
    B: 1人乗りのオートバイ
    C: 運転手のみの乗用車
    D: 運転手1人の商用トラック
  answer: B
  explanation: 交通量が多い時間帯（上り・下り）において、HOV車線は2人以上が乗車している車両、2人以上が乗車しているバス、1人乗りのオートバイ、および緊急車両専用となります。
- id: 515
  category: safe_driving_rules
  question: 州間高速道路の左車線を走行中、後方からより速い速度で車が接近してきた場合、どうするべきですか？
  choices:
    A: 相手の速度に合わせて加速する
    B: ブレーキを軽く踏んで、減速するように警告する
    C: 右側の車線に1つ移動する
    D: 制限速度で運転しているため、そのままの車線を維持する
  answer: C
  explanation: マニュアルには次のように記載されています。「左車線を走行中に、後方からより速い速度で車が接近してきた場合は、右側の車線に1つ移動してください。左車線は追い越し専用です。」
- id: 516
  category: safe_driving_rules
  question: クローバーリーフ型インターチェンジで左折するにはどうすればよいですか？
  choices:
    A: 高架橋の手前で左折ランプに入る
    B: 高架橋を過ぎた直後に右折ランプに入る
    C: 高架橋の手前で右折ランプに入る
    D: 車線を横切って左折する
  answer: B
  explanation: クローバーリーフ型インターチェンジでは、すべての曲がり角が右折になります。左折するには、高架橋を過ぎた直後に右折しなければなりません。
- id: 517
  category: sharing_the_road
  question: トラックやバスが州間高速道路に合流しようとしている時、あなたは次のようにするべきです：
  choices:
    A: 速度を上げて素早く通り過ぎる
    B: クラクションを鳴らして自分の存在を知らせる
    C: 協力的になり、交通の流れに合わせるための十分な時間とスペースを与える
    D: 速度と車線位置を維持して、相手に道を譲らせる
  answer: C
  explanation: 州間高速道路に合流するトラックやバスは、交通パターンに合わせるために余分な時間が必要になる場合があることを覚えておいてください。協力的になり、交通の流れに合わせるための十分な時間とスペースを与えましょう。
- id: 518
  category: safe_driving_rules
  question: 州間高速道路を降りる際、いつ大幅に速度を落とし始めるべきですか？
  choices:
    A: 出口の1マイル手前
    B: 出口に向かう合図（ウィンカー）を出した直後
    C: 減速車線に入った後
    D: まだ本線を走行している間
  answer: C
  explanation: 通常、白い反射板が連続して設置されている減速車線に入るまでは速度を維持し、その後、出口ランプの制限速度まで減速する必要があります。
- id: 519
  category: safe_driving_rules
  question: 州間高速道路の入口または出口ランプの舗装部分または未舗装部分に自動車を駐車することが合法となるのは、どのような条件の時ですか？
  choices:
    A: 地図やGPSを確認する必要がある時
    B: 車両が故障している場合のみ
    C: 電話をかける必要がある時
    D: 他の車が追いつくのを待っている時
  answer: B
  explanation: 車両が故障している場合を除き、高速道路の入口または出口ランプの舗装部分または未舗装部分に自動車を駐車することは違法です。
- id: 520
  category: defensive_driving
  question: 「ウィービング（交差）」インターチェンジが特に危険な理由は何ですか？
  choices:
    A: 同じ車線で車が降りたり合流したりするため
    B: 車線が標準的な州間高速道路の車線よりも狭いため
    C: 運転手が交通を横切って急な左折をしなければならないため
    D: ランプに制限速度が掲示されていないため
  answer: A
  explanation: 車線管理において最も危険な状況の1つは、州間高速道路の交通が同じ車線で降りたり合流したりする場合に発生し、完全な注意力と素早い反応が求められます。
- id: 521
  category: safe_driving_rules
  question: 州間高速道路の中央分離帯を越えて運転することが法的に許可されているのは誰ですか？
  choices:
    A: 出口を通り過ぎてしまったすべての運転手
    B: 多人数乗車車両（HOV）の運転手
    C: 緊急車両および高速道路維持作業員のみ
    D: 深刻な交通渋滞時のすべての運転手
  answer: C
  explanation: 州間高速道路では、いかなる中央分離帯や区画線も越えて運転してはいけません。緊急車両および高速道路維持作業員のみが州間高速道路の中央分離帯を横断することができます。
- id: 522
  category: defensive_driving
  question: 州間高速道路で他の運転手の死角を走行することに関して、推奨される行動は何ですか？
  choices:
    A: エンジン音が聞こえるように、側面にぴったりとついて走行する
    B: 後ろに留まるか、追い越す
    C: 死角にいる間、ヘッドライトを継続的に点滅させる
    D: 相手の死角に関係なく、速度と位置を維持する
  answer: B
  explanation: 他の運転手の死角を走行してはいけません。前方の運転手からあなたの車が見えない位置を走行することは危険です。後ろに留まるか、追い越すかのどちらかにし、側面に並んで走行してはいけません。
- id: 523
  category: safe_driving_rules
  question: 週末、多人数乗車車両（HOV）専用車線はどのように利用されますか？
  choices:
    A: すべての車両に対して閉鎖される
    B: 緊急車両専用に厳しく制限される
    C: すべての車両が利用できる一般車線として機能する
    D: 2人ではなく3人以上の乗車が必要になる
  answer: C
  explanation: HOV車線は、週末および平日の交通のピーク時以外は、一般車線として機能します。
- id: 524
  category: defensive_driving
  question: マニュアルによると、夜間の運転が昼間の運転よりもはるかに危険であると考えられているのはなぜですか？
  choices:
    A: 夜間は制限速度が引き上げられるため
    B: 道路上に商用トラックが多くなるため
    C: 疲労、視界の急激な低下、および飲酒運転手の増加のため
    D: 省エネのために州間高速道路の照明が頻繁に消されるため
  answer: C
  explanation: 夜間の運転は昼間の運転よりもはるかに危険です。疲労と視界の急激な低下が主な原因であり、夜間は飲酒運転手が道路にいる可能性が高くなります。
- id: 525
  category: defensive_driving
  question: 高速道路催眠現象（ハイウェイ・ヒプノシス）を防ぐため、どのくらいの頻度で休憩を取り、リフレッシュするべきですか？
  choices:
    A: 少なくとも4時間または200マイルごと。
    B: 少なくとも2時間または100マイルごと。
    C: 少なくとも6時間または300マイルごと。
    D: 車に給油する必要がある時のみ。
  answer: B
  explanation: 高速道路催眠現象を防ぐため、マニュアルでは少なくとも2時間ごと、または約100マイルごとに休憩を取り、車から降りることを推奨しています。
- id: 526
  category: safe_driving_rules
  question: 道路上の安全を維持するため、1日に運転するべき最大時間は何時間ですか？
  choices:
    A: 6時間
    B: 8時間
    C: 10時間
    D: 12時間
  answer: B
  explanation: マニュアルには、1日の運転時間を8時間以内に抑えることが、あなたや他の人にとって最も安全であると記載されています。
- id: 527
  category: signs_and_signals
  question: 道路情報板（ダイナミック・メッセージ・サイン）は、使用されていない時に何を表示しますか？
  choices:
    A: 現在の州間高速道路の制限速度。
    B: 現地の時刻と気温。
    C: 通常は何も表示されない（空白）。
    D: 地元の企業の広告。
  answer: C
  explanation: 道路情報板は運転手にリアルタイムの情報を提供しますが、マニュアルには、使用されていない時は通常何も表示されない（空白である）と記されています。
- id: 528
  category: defensive_driving
  question: 事故や異常な事態を見るために速度を落とし、交通渋滞を引き起こす運転行動は何と呼ばれますか？
  choices:
    A: 煽り運転（テールゲーティング）
    B: わき見運転（ラバーネッキング）
    C: 高速道路催眠現象（ハイウェイ・ヒプノシス）
    D: 不必要な車線変更
  answer: B
  explanation: マニュアルでは、事故や異常な事態を見るために速度を落とすことを「わき見運転（ラバーネッキング）」と定義し、渋滞を引き起こす最悪の要因の一つと呼んでいます。
- id: 529
  category: sharing_the_road
  question: 路肩に停車している緊急車両に近づく際、交通状況により車線変更が安全に行えない場合はどうするべきですか？
  choices:
    A: 交通がクリアになるまで自分の車線で停止する。
    B: できるだけ早く緊急車両を通り過ぎるために加速する。
    C: 反対側の路肩に車を寄せる。
    D: 速度を落とし、同じ車線に留まる。
  answer: D
  explanation: 交通状況により車線変更が安全に行えない場合に「のみ」、運転手は単に速度を落として同じ車線に留まることでこの状況に対応することが許可されています。
- id: 530
  category: sharing_the_road
  question: 緊急車両や道路維持車両に加えて、テネシー州のムーブ・オーバー法（車線変更義務法）は以下にも適用されます：
  choices:
    A: 州間高速道路を走行中のすべての車両。
    B: ハザードランプ（非常点滅表示灯）を点灯して停車している自動車。
    C: 路肩を走行している自転車。
    D: 高速道路沿いを歩いている歩行者。
  answer: B
  explanation: マニュアルには、停車中の緊急車両に加えて、ムーブ・オーバー法が現在、ハザードランプを点灯して停車している乗用車やトラックなどのすべての自動車にも適用されると記載されています。
- id: 531
  category: safe_driving_rules
  question: 車が故障して助けが必要な場合、他の運転手や警察にどのように合図を送るべきですか？
  choices:
    A: 車線の中央に立ち、腕を振る。
    B: ボンネットを開け、ボンネットまたはラジオのアンテナに白い布を結びつける。
    C: ヘッドライトを繰り返し点滅させる。
    D: クラクションを鳴らし続ける。
  answer: B
  explanation: 車のトラブルで助けが必要な場合、マニュアルではボンネットを開け、ボンネットまたはラジオのアンテナに白い布を結びつけることを推奨しています。
- id: 532
  category: safe_driving_rules
  question: 車のトラブルで路肩に停車した場合、助けを待つための最も安全な場所はどこですか？
  choices:
    A: 電話を探すために州間高速道路沿いを歩く。
    B: 車のトランクの上に座る。
    C: 車内、または車の近くの交通から離れた側。
    D: 交通整理をするために車の横の車線に立つ。
  answer: C
  explanation: マニュアルには、可能であれば車内または車の近くの交通から離れた側に留まるのが良いと記載されており、州間高速道路沿いを歩くことは危険であると注意喚起されています。
- id: 533
  category: driver_responsibility
  question: 州間高速道路で交通事故に巻き込まれた場合、テネシー州法で車を緊急車線（路肩）に移動させることが許可されるのはどのような時ですか？
  choices:
    A: 警察が到着して写真を撮った後のみ。
    B: 車が運転可能であり、重傷者や死者がいない場合。
    C: 事故後に車を移動させることは決して許可されない。
    D: 事故に3台以上の車が巻き込まれている場合のみ。
  answer: B
  explanation: 「安全のための移動（Move It for Safety）」の項目に基づき、車がまだ運転可能であり、重傷者や死者がいない場合は、車を緊急車線に移動させることができます。
- id: 534
  category: safe_driving_rules
  question: 携帯電話から無料でテネシー州ハイウェイ・パトロールの指令センターに接続するには、何番にダイヤルすればよいですか？
  choices:
    A: '*DOT (*368)'
    B: '*HELP (*4357)'
    C: '*THP (*847)'
    D: '*911 (*911)'
  answer: C
  explanation: 高速道路での緊急時には、*THP (*847) にダイヤルすると、最寄りのテネシー州ハイウェイ・パトロールの指令係に接続されます。
- id: 535
  category: defensive_driving
  question: 州間高速道路での催眠現象（ハイウェイ・ヒプノシス）を防ぐため、運転手はどのような習慣をつけるべきですか？
  choices:
    A: 道路の白線をまっすぐ見つめる。
    B: 視線を左右に動かし、バックミラーを確認する。
    C: 車内をできるだけ暖かく保つ。
    D: 風やタイヤの一定の音を聞き続ける。
  answer: B
  explanation: 州間高速道路での催眠現象を防ぐため、マニュアルでは、まっすぐ前を見つめるのを避け、視線を左右に動かしてバックミラーを確認し続けることを推奨しています。
- id: 536
  category: sharing_the_road
  question: 複数車線の高速道路の左側の路肩に緊急車両が停車している場合、ムーブ・オーバー法（Move Over Law：車線変更義務法）に従ってどうするべきですか？
  choices:
    A: 最も左側の車線を安全な緩衝地帯として空けるため、右側の車線に車線変更する。
    B: 車両に近づくために左側の車線に車線変更する。
    C: 左側の車線で車を停止させる。
    D: 右側の路肩を走って追い越す。
  answer: A
  explanation: 緊急車両が左側の路肩に停車している場合、運転手は右側の車線に車線変更し、最も左側の車線を安全な緩衝地帯として空けます。
- id: 537
  category: vehicle_information
  question: マニュアルによると、特に冬の旅行時の緊急事態に備えて車に積んでおくことが推奨されているアイテムは次のうちどれですか？
  choices:
    A: 携帯用扇風機
    B: 凍結した窓用のウィンドスクレーパー
    C: 予備のエンジン冷却水
    D: サンシェード（日よけ）
  answer: B
  explanation: 推奨される安全および緊急用設備の項目には、冬の旅行時には毛布、小型の携帯用ヒーター、凍結した窓用のウィンドスクレーパー、およびスノータイヤまたはタイヤチェーンを携行するべきであると記載されています。
- id: 538
  category: safe_driving_rules
  question: 州間高速道路に進入する際の正しい手順は何ですか？
  choices:
    A: 停止して車を確認し、安全な時に進入する。
    B: 車を確認し、走行車線に入る前に速度を25 MPHに落とす。
    C: 車を確認し、交通の流れに合わせて速度を上げ、安全が確認できたら合流する。
    D: クラクションを鳴らし、現在の速度を維持したまま、直接右側の車線に合流する。
  answer: C
  explanation: マニュアルの模擬試験問題によると、州間高速道路に進入する際は、車を確認し、交通の流れに合わせて速度を上げ、安全が確認できたら合流する必要があります。
- id: 539
  category: safe_driving_rules
  question: テネシー州の州間高速道路で、緊急用の中央分離帯の通り抜け（クロスオーバー）を法的に使用できるのは誰ですか？
  choices:
    A: 出口を通り過ぎたすべての運転手。
    B: 他の車両がいない場合に限り、すべての運転手。
    C: 渋滞時の商用トラックの運転手。
    D: 緊急車両および高速道路の維持管理作業員のみ。
  answer: D
  explanation: テネシー州において、州間高速道路の緊急用クロスオーバーの使用が法的に認められているのは、緊急車両および高速道路の維持管理作業員のみです。
- id: 540
  category: defensive_driving
  question: 州間高速道路での事故で車が損傷し、重傷者がいない場合、どうするべきですか？
  choices:
    A: 警察が到着するまで、車を走行車線に残しておく。
    B: 損傷した車を路肩に移動させる。
    C: 安全に保険情報を交換するために交通を止める。
    D: 車を乗り捨てて最寄りの出口まで歩く。
  answer: B
  explanation: テネシー州運輸省は、重傷者がいない場合は損傷した車を路肩に移動させるよう運転手に促す標識を設置しています。
- id: 541
  category: defensive_driving
  question: 統計的に、死亡事故が他のどの日よりも多く発生するのはいつですか？
  choices:
    A: 月曜日と火曜日の午前中。
    B: 水曜日と木曜日の夜。
    C: 金曜日と土曜日の夜。
    D: 日曜日の午後。
  answer: C
  explanation: マニュアルによると、死亡事故は他のどの日よりも金曜日と土曜日の夜に多く発生すると記載されています。
- id: 542
  category: safe_driving_rules
  question: 夜間の安全運転における基本ルールは何ですか？
  choices:
    A: 常にハイビームを使用する。
    B: ヘッドライトの照射範囲を超えた速度で走らない。
    C: 視界に関係なく、標識の制限速度で運転する。
    D: 車内のルームランプを点灯したままにする。
  answer: B
  explanation: 夜間の安全運転の基本ルールは「ヘッドライトの照射範囲を超えた速度で走らない（NEVER OUTRUN YOUR HEADLIGHTS）」ことです。なぜなら、視界の範囲はヘッドライトによって制限されるからです。
- id: 543
  category: defensive_driving
  question: 夜間、対向車のヘッドライトの眩しさ（グレア）を避けるにはどうすればよいですか？
  choices:
    A: 対向車のヘッドライトを直接見て、車両の動きを追う。
    B: 対向車の運転手に向かってハイビームを何度も点滅させる。
    C: 道路の右端に注意を向け、白線や道路の端をハンドル操作の目安にする。
    D: 車両が通り過ぎるまで片目を閉じる。
  answer: C
  explanation: 対向車のライトの眩しさを避けるには、道路の右端に注意を向け、白線や道路の端をハンドル操作の目安にする必要があります。
- id: 544
  category: vehicle_information
  question: 法律により、ヘッドライトは車の前方少なくともどのくらいの距離にいる人をはっきりと確認できるものでなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 法律では、車の前方少なくとも200フィート先の道路上にいる人をはっきりと確認できるヘッドライトの使用が義務付けられています。
- id: 545
  category: safe_driving_rules
  question: 対向車とすれ違う際、または前方の車を追い越す際、どのくらいの距離以内でヘッドライトを減光（ロービームに）しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 夜間、対向車とすれ違う際や前方の車を追い越す際は、500フィート以内でライトを減光するという適切な要件を遵守しなければなりません。
- id: 546
  category: safe_driving_rules
  question: 夜間、幹線道路（ハイウェイ）上またはその沿いに駐車する場合、どうすればよいですか？
  choices:
    A: ヘッドライトをハイビームにしたままにする。
    B: ヘッドライトをロービームにしたままにする。
    C: ハザードランプ（非常点滅表示灯）とパーキングライトを点灯したままにする。
    D: バッテリーを節約するためにすべてのライトを消す。
  answer: C
  explanation: 夜間、幹線道路上またはその沿いに駐車する場合は、ハザードランプとパーキングライトを点灯したままにしてください。ヘッドライトは、接近する運転手の目を眩ませたり混乱させたりする可能性があるため、絶対に点灯したままにしないでください。
- id: 547
  category: defensive_driving
  question: 雨天時、路面が特に危険で最も滑りやすくなるのはいつですか？
  choices:
    A: 数時間激しい雨が降った後。
    B: 雨が降り始めた直後。
    C: 雨が止んだ直後。
    D: 深い水たまりを走行している時。
  answer: B
  explanation: 雨が降り始めた直後は、蓄積された泥や油が水と混ざり合い、路面に油膜を形成するため、路面が特に危険になります。
- id: 548
  category: safe_driving_rules
  question: 雨天時に運転する場合、どのライトを使用すべきですか？
  choices:
    A: パーキングライトのみ。
    B: ヘッドライトのハイビーム。
    C: ヘッドライトのロービーム。
    D: ハザードランプのみ。
  answer: C
  explanation: 雨天時は、必要な道路上を照らすために、ヘッドライトをロービームにして運転する必要があります。
- id: 549
  category: defensive_driving
  question: 霧や煙の中で運転する際の最高のアドバイスは何ですか？
  choices:
    A: ハイビームを点灯し、素早く通り抜ける。
    B: 前方の車に非常に接近して追従する。
    C: 霧や煙の中では運転「しない」。
    D: パーキングライトのみを使用する。
  answer: C
  explanation: マニュアルには、霧や煙の中で運転する際の最高のアドバイスは「運転しない（DON'T）」ことだと記載されています。どうしても移動しなければならない場合は、特別な予防措置を講じる必要があります。
- id: 550
  category: safe_driving_rules
  question: 霧や煙の中をどうしても移動しなければならない場合、車のライトをどのように使用すべきですか？
  choices:
    A: ライトをハイビームにして運転する。
    B: ライトをロービームにして運転する。
    C: パーキングライトのみを点灯して運転する。
    D: フォグランプのみを点灯して運転する。
  answer: B
  explanation: 霧や煙の中をどうしても移動しなければならない場合は、ライトをロービームにして運転する必要があります。ハイビームは視界を悪化させます。また、パーキングライトやフォグランプのみで運転することは絶対に避けてください。
- id: 551
  category: defensive_driving
  question: 霧の中で運転中に車がエンストしたり動かなくなった場合、どうすればよいですか？
  choices:
    A: 車内に留まり、助けを待つ。
    B: 車の真後ろに立ち、他の車を迂回させるように手を振る。
    C: 人身事故を避けるため、車から離れる。
    D: 車を車線に残したまま、歩いて家に帰る。
  answer: C
  explanation: 霧の中で車がエンストしたり動かなくなった場合は、人身事故を避けるために車から離れてください。
- id: 552
  category: defensive_driving
  question: 夜間、対向車の運転手に警告するためにハイビームを点滅させるのを避けるべきなのはなぜですか？
  choices:
    A: 車のバッテリーを消耗させるため。
    B: いかなる状況でも違法であるため。
    C: 相手の気を散らし、運転の妨げとなって衝突事故につながる可能性があるため。
    D: ヘッドライトの寿命が短くなるため。
  answer: C
  explanation: 他の運転手に警告するためにハイビームを点滅させるのは、相手の気を散らし、運転の妨げとなって衝突事故につながる可能性があるため、避けるべきです。
- id: 553
  category: safe_driving_rules
  question: 濃霧で道路の端が見えず、車を停止させなければならない場合、どうすればよいですか？
  choices:
    A: 車線の中央に停止し、ハイビームを点灯する。
    B: 車線から十分に離れ、できるだけ右側に寄せて停車し、ハザードランプ（非常点滅表示灯）を点灯する。
    C: 道路上に停止し、他の車に警告するためにクラクションを繰り返し鳴らす。
    D: 左側の路肩に寄せて停車し、すべてのライトを消す。
  answer: B
  explanation: マニュアルには、霧で道路の端が見えない場合は、車線から十分に離れてできるだけ右側に寄せて停車し、ハザードランプ（非常点滅表示灯）を点灯する必要があると記載されています。
- id: 554
  category: defensive_driving
  question: 暑い日に雨が降り始めた最初の数分間、路面が非常に滑りやすくなることがあるのはなぜですか？
  choices:
    A: 熱いアスファルトの上で雨がすぐに凍るため。
    B: 水が泥と混ざり、深い泥だまりができるため。
    C: 熱によってアスファルト内の油分が表面に浮き出し、それが洗い流されるまで非常に滑りやすくなるため。
    D: 熱い路面によって雨が瞬時に蒸発し、タイヤのトラクション（摩擦力）が低下するため。
  answer: C
  explanation: マニュアルによると、熱によってアスファルト内の油分が表面に浮き出し、その油分が洗い流されるまで路面は非常に滑りやすくなります。
- id: 555
  category: safe_driving_rules
  question: 昼間に濃霧、大雨、または雪の中を運転する際、テネシー州法で義務付けられていることは何ですか？
  choices:
    A: ハイビームのヘッドライトを点灯する。
    B: ハザードランプ（非常点滅表示灯）を点灯する。
    C: ロービームのヘッドライトを点灯する。
    D: 車内のルームランプを点灯する。
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「昼間に濃霧、大雨、または雪の中を運転する際は、ロービームのヘッドライトを点灯してください。これはテネシー州法でも義務付けられています。」
- id: 556
  category: defensive_driving
  question: 車がハイドロプレーニング現象を起こし始めた場合、減速するための最良の方法は何ですか？
  choices:
    A: すぐに急ブレーキをかける。
    B: ニュートラルに入れて惰性で進む。
    C: ブレーキを素早くポンピングする。
    D: アクセルから足を離して徐々に減速する。
  answer: D
  explanation: マニュアルでは、車がハイドロプレーニング現象を起こし始めた場合は「アクセルから足を離して徐々に減速する」べきであり、「急ブレーキをかけてはいけない」とアドバイスしています。
- id: 557
  category: safe_driving_rules
  question: ハイドロプレーニング現象に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 時速55マイル（約88km/h）以上の速度でのみ発生する。
    B: 停止距離が3倍になる可能性があり、ステアリングの制御が低下または失われる可能性がある。
    C: 水の抵抗によりステアリングの制御が向上する。
    D: 深い冠水路を運転しているときにのみ発生する。
  answer: B
  explanation: マニュアルには、ハイドロプレーニング現象が発生すると「停止距離が3倍になる可能性があり、ステアリングの制御が低下または失われる可能性がある」と記されています。また、タイヤは「いかなる速度」でもハイドロプレーニング現象を起こす可能性があるとも記載されています。
- id: 558
  category: defensive_driving
  question: 車がスリップ（スキッド）し始めた場合、どうすればよいですか？
  choices:
    A: 車を素早く止めるために急ブレーキをかける。
    B: 車を進めたい方向とは逆の方向にハンドルを切る。
    C: ブレーキを踏まずに、車を進めたい方向にハンドルを切る。
    D: トラクション（摩擦力）を取り戻すために急加速する。
  answer: C
  explanation: 車がスリップし始めた場合、マニュアルでは「ブレーキを踏まない」こと、そして「車を進めたい方向にハンドルを切る」よう指示しています。
- id: 559
  category: defensive_driving
  question: 車輪が舗装道路から外れてしまった場合、どのように対処すべきですか？
  choices:
    A: 舗装路に向かって急にハンドルを切る。
    B: 急ブレーキをかけ、ペダルを踏み続ける。
    C: 素早く道路に戻るために加速する。
    D: アクセルペダルから足を離し、軽く短くブレーキをかける。
  answer: D
  explanation: 舗装路から外れた際にコントロールを取り戻すには、「アクセルペダルから足を離すが、急ブレーキはかけない」こと、そして「軽く短くブレーキをかける」必要があります。
- id: 560
  category: signs_and_signals
  question: テネシー州の道路にあるランブルストライプ（凹凸のある区画線）の主な機能は何ですか？
  choices:
    A: 居眠り運転をしている運転手を目覚めさせるため。
    B: 雨の降る夜間における路側帯の線の視認性を向上させるため。
    C: 高速道路の終わりが近づいていることを示すため。
    D: 住宅街でスピード違反の車を減速させるため。
  answer: B
  explanation: ランブルストライプには振動や音を発生させる二次的な効果もありますが、マニュアルには「その主な機能は、雨の降る夜間における路側帯の線の視認性を向上させることである」と記載されています。
- id: 561
  category: safe_driving_rules
  question: ほとんどの車が押し流されるには、通常どのくらいの深さの流水が必要ですか？
  choices:
    A: 6〜12インチ
    B: 18〜24インチ
    C: 36〜48インチ
    D: 少なくとも60インチ
  answer: B
  explanation: マニュアルでは、「ほとんどの車は18〜24インチの流水で押し流される可能性がある」と警告しています。
- id: 562
  category: penalties_and_points
  question: 運転手がはっきりと見える洪水警告のバリケードを意図的に無視し、冠水した地域に車を乗り入れた場合、どうなる可能性がありますか？
  choices:
    A: 警察から口頭での警告を受けるだけである。
    B: 無謀運転（reckless driving）で告発され、救助費用の負担を求められる可能性がある。
    C: 車両が州によって永久に没収される。
    D: 自動的に5年間免許を失う。
  answer: B
  explanation: マニュアルによると、洪水警告の標識やバリケードを無視すると、運転手は「無謀運転で告発」され、「救助にかかった費用の返還責任を負う」可能性があります。
- id: 563
  category: defensive_driving
  question: 運転中に竜巻を発見した場合、推奨される行動は何ですか？
  choices:
    A: 最高速度で運転して竜巻から逃げ切ろうとする。
    B: 車内に留まり、高架の下に駐車する。
    C: 車から降りて、溝や低地に避難し、うつ伏せになる。
    D: 竜巻に向かって運転し、素早く通り過ぎる。
  answer: C
  explanation: 竜巻を発見した場合、マニュアルでは次のようにアドバイスしています。「車で逃げ切ろうとしないでください。車から降りて、溝や低地に避難し、飛散物から身を守るためにうつ伏せになってください。」
- id: 564
  category: sharing_the_road
  question: 大型トラックやバスが左側から追い越していく際、それらが発生させる突風に対処するためにどうすべきですか？
  choices:
    A: 車線の右端にできるだけ寄り、減速する。
    B: 風を防ぐために車線の左側に寄る。
    C: トラックの前に出るために急加速する。
    D: トラックの運転手に警告するためにクラクションを鳴らす。
  answer: A
  explanation: マニュアルには、トラックやバスが左側から追い越していく際は、「車線の右端にできるだけ寄り、減速する」べきであると記載されています。
- id: 565
  category: defensive_driving
  question: 強い追い風（車の後ろから吹く風）は、運転にどのような影響を与えますか？
  choices:
    A: ハンドル操作が著しく困難になる。
    B: 速度が低下するため、より多く加速する必要がある。
    C: 速度が上がるため、停止するには減速し、早めにブレーキをかけ始める必要がある。
    D: 乾いた路面でも車がハイドロプレーニング現象を起こす原因となる。
  answer: C
  explanation: マニュアルでは、「強い追い風（車の後ろから吹く風）は速度を上げるため、停止するには減速し、早めにブレーキをかけ始める必要がある」と説明しています。
- id: 566
  category: defensive_driving
  question: 運転中、太陽が自分の真後ろにある場合、どのような危険に注意すべきですか？
  choices:
    A: ワイパーが機能しなくなる可能性がある。
    B: 対向車の運転手がまぶしさを感じ、あなたの方向指示器（ウィンカー）が見えない可能性がある。
    C: 車のエンジンがより早くオーバーヒートする可能性がある。
    D: ダッシュボードの計器類が見えなくなる。
  answer: B
  explanation: マニュアルでは次のように警告しています。「太陽が自分の後ろにある場合、対向車の運転手がまぶしさを感じる可能性があります。対向車からあなたの方向指示器や車自体が見えない可能性があることに注意してください。」
- id: 567
  category: vehicle_information
  question: 泥や雪で立ち往生した（スタックした）車を脱出させるための正しいテクニックは何ですか？
  choices:
    A: 高いギアに入れ、できるだけ速くタイヤを空転させる。
    B: 低いギアに入れ、前輪をまっすぐに保ち、アクセルペダルを優しく踏む。
    C: 急加速しながらハンドルを左右に急に切る。
    D: ドライブとリバースを切り替えながら急ブレーキをかける。
  answer: B
  explanation: 泥や雪から脱出するため、マニュアルでは「低いギアに入れ、前輪をまっすぐに保つ」「アクセルペダルを優しく踏む」「タイヤを空転させないようにする」ことを推奨しています。
- id: 568
  category: safe_driving_rules
  question: 車が深い泥や雪で立ち往生した場合、どうすべきですか？
  choices:
    A: 高いギアに入れ、できるだけ速くタイヤを空転させる。
    B: 低いギアに入れ、前輪をまっすぐに保つ。
    C: トラクションを得るためにアクセルペダルを素早くポンピングする。
    D: ハンドルを左右に急に切る。
  answer: B
  explanation: 車を脱出させようとする際、マニュアルでは、低いギアに入れて前輪をまっすぐに保ち、アクセルペダルを優しく踏んでタイヤを空転させないようにすることを推奨しています。
- id: 569
  category: vehicle_information
  question: 車にタイヤチェーンを装着するのはいつですか？
  choices:
    A: 雪で立ち往生した後。
    B: 道路の中央を運転している最中。
    C: 雪や泥の中を運転する前。
    D: 固い氷の上を運転する時のみ。
  answer: C
  explanation: マニュアルには、チェーンを装着する前に道路の右端にできるだけ寄せて車を停め、雪や泥の中を運転する前にタイヤに装着すべきであると記載されています。
- id: 570
  category: defensive_driving
  question: 雪や氷の路面でほとんどの運転手が犯す「3つの大きな間違い」の1つとされているのは、次のうちどれですか？
  choices:
    A: ハンドルを切りすぎてタイヤを横滑りさせること。
    B: ロービームのヘッドライトを使用すること。
    C: 一定の速度で運転すること。
    D: ヒーター・デフロスターを使用すること。
  answer: A
  explanation: 雪や氷の路面でほとんどの運転手が犯す3つの大きな間違いは、パワーをかけすぎてタイヤを空転させること、ブレーキをかけすぎてタイヤを滑らせること、そしてハンドルを切りすぎてタイヤを横滑りさせることです。
- id: 571
  category: safe_driving_rules
  question: 冬の天候で運転する前に、どの窓から雪、氷、または霜を取り除くべきですか？
  choices:
    A: フロントガラスのみ。
    B: フロントガラスと前部のサイドウィンドウ。
    C: リアウィンドウのみ。
    D: すべての窓。
  answer: D
  explanation: マニュアルには、運転する前に「すべて」の窓から雪、氷、霜を取り除くことが明記されています。
- id: 572
  category: safe_driving_rules
  question: 時速20マイル（20 M.P.H.）で走行している場合、氷や雪によるトラクション（摩擦）の低下により、停止距離はどのくらいまで延びる可能性がありますか？
  choices:
    A: 50フィート以上。
    B: 100フィート以上。
    C: 150フィート以上。
    D: 200フィート以上。
  answer: D
  explanation: 時速20マイル（20 M.P.H.）で走行している場合、トラクションの低下により停止距離が200フィート以上に延びる可能性があります。
- id: 573
  category: vehicle_information
  question: 雪や氷の上で方向制御を維持するためには、どのようにブレーキをかけるべきですか？
  choices:
    A: ブレーキペダルを素早くポンピングする。
    B: 車両が停止するまで継続的に強く踏み込む。
    C: ロックする直前のポイントまで一定の圧力をかける。
    D: ブレーキを急激に踏み込み、そのまま押し続ける。
  answer: C
  explanation: マニュアルでは、ロックする直前のポイントまでしっかりとブレーキをかけ、ブレーキペダルをポンピング「しない」ことを推奨しています。制動力と方向制御の最良の組み合わせを得るためには、一定の圧力をかけるだけにとどめてください。
- id: 574
  category: vehicle_information
  question: 緊急停止時にアンチロックブレーキ（ABS）を正しく作動させるためには、どうするべきですか？
  choices:
    A: ブレーキペダルをポンピングする。
    B: ペダルに一定の強い圧力をかける。
    C: ブレーキを軽く叩くように踏む。
    D: 代わりにパーキングブレーキを使用する。
  answer: B
  explanation: アンチロックブレーキを正しく作動させる、あるいはとにかく作動させるためには、ペダルに一定の強い圧力をかける必要があります。緊急停止時には、必要に応じてブレーキペダルを床までいっぱいに踏み込んでください。
- id: 575
  category: defensive_driving
  question: 凍結するような寒さの中で橋の上を運転する際、特に注意しなければならないのはなぜですか？
  choices:
    A: 橋は通常、より急な傾斜で作られているため。
    B: 橋の上は隣接する道路よりも早く氷が張るため。
    C: 橋は交通量が少なく、雪が踏み固められないため。
    D: 橋は太陽からの熱をより多く吸収するため。
  answer: B
  explanation: 通常、標識にも示されているように、橋の上は隣接する道路よりも早く氷が張り、予想以上に滑りやすくなるためです。
- id: 576
  category: driver_testing
  question: 法律により、テネシー州の運転免許学科試験の問題のうち、アルコールと薬物に関する問題は何パーセントを占めなければなりませんか？
  choices:
    A: 少なくとも10パーセント。
    B: 少なくとも15パーセント。
    C: 少なくとも20パーセント。
    D: 少なくとも25パーセント。
  answer: D
  explanation: 法律により、学科試験の問題の少なくとも25パーセントは、アルコール、その他の薬物、および運転に関するトピックを扱う問題で構成されなければなりません。
- id: 577
  category: alcohol_drugs_health
  question: 肝臓が1杯のアルコール飲料を酸化（分解）するのに、およそどのくらいの時間がかかりますか？
  choices:
    A: 15分。
    B: 30分。
    C: 1時間。
    D: 2時間。
  answer: C
  explanation: アルコールは肝臓に到達するとすぐに酸化（分解）され始めます。しかし、肝臓は1時間に約1杯分のアルコールしか酸化できません。
- id: 578
  category: alcohol_drugs_health
  question: 飲酒後に酔いを覚ますための唯一の効果的な方法は、次のうちどれですか？
  choices:
    A: ブラックコーヒーを飲む。
    B: 冷たいシャワーを浴びる。
    C: 激しい運動をする。
    D: 時間が経つのを待つ。
  answer: D
  explanation: コーヒーを飲んだり、運動したり、冷たいシャワーを浴びたりしても、酸化（分解）の速度を上げることはできません。飲酒した人の酔いを覚ますことができるのは時間だけです。
- id: 579
  category: alcohol_drugs_health
  question: テネシー州において、常に違法な酩酊状態となる血中アルコール濃度（BAC）はどれくらいですか？
  choices:
    A: '.04'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: テネシー州を含むほとんどの州において、.08が常に違法となる酩酊レベルです。
- id: 580
  category: alcohol_drugs_health
  question: 2人の体重が同じ場合、体脂肪はアルコールの酩酊にどのような影響を与えますか？
  choices:
    A: 体脂肪が多い人の方が先に酩酊の兆候を示します。
    B: 体脂肪が少ない人の方が先に酩酊の兆候を示します。
    C: 体脂肪は、人がどれくらい早く酩酊するかに影響を与えません。
    D: 2人とも全く同じ速度で酩酊します。
  answer: A
  explanation: アルコールは脂肪ではなく水に吸収されます。体脂肪が少ない人は、アルコールを希釈するための水分をより多く持っています。したがって、同じ量を飲んだ場合、体重が同じであれば、体脂肪が多い人の方が先に酩酊の兆候を示します。
- id: 581
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が0.10%の場合、しらふの時と比べて事故を起こす確率はどのくらい高くなりますか？
  choices:
    A: 2倍高くなる。
    B: 7倍高くなる。
    C: 25倍高くなる。
    D: 50倍高くなる。
  answer: B
  explanation: 血中アルコール濃度（BAC）が0.10%の場合、しらふの時と比べて事故を起こす確率は7倍高くなります。
- id: 582
  category: alcohol_drugs_health
  question: 運転において最も重要な2つの能力で、少量のアルコールでも影響を受けるものは何ですか？
  choices:
    A: 聴覚と反応時間
    B: 判断力と視力
    C: ハンドル操作とブレーキ操作
    D: 警戒心と集中力
  answer: B
  explanation: マニュアルには次のように記載されています。「運転において最も重要な2つの能力は判断力と視力であり、どちらも少量のアルコールによって影響を受けます。」
- id: 583
  category: alcohol_drugs_health
  question: アルコールは夜間の運転者の視力にどのような影響を与えますか？
  choices:
    A: まぶしさからの回復時間を短縮させる。
    B: 夜間にはっきりと見る能力を半分以下に低下させる。
    C: 側方視界を30%広げる。
    D: 目の筋肉を引き締め、焦点を合わせやすくする。
  answer: B
  explanation: アルコールは視界の鮮明さを低下させます。マニュアルには、夜間にはっきりと見る能力が半分以下に低下すると明記されています。
- id: 584
  category: alcohol_drugs_health
  question: 法律上、運転者が法的に酩酊状態（飲酒運転）とみなされる血中アルコール濃度（BAC）はどれくらいですか？
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: マニュアルでは、血中アルコール濃度（BAC）が0.08%以上の場合を「法的な酩酊状態（LEGAL INTOXICATION）」とみなしており、アルコール濃度が0.08%以上の状態で運転することは違法であると示しています。
- id: 585
  category: alcohol_drugs_health
  question: アルコールを精神安定剤や鎮静剤などの他の抑制薬と混ぜるとどうなりますか？
  choices:
    A: 効果が互いに打ち消し合う。
    B: 効果が単に足し合わされる。
    C: 効果が掛け合わされる（相乗効果が生じる）。
    D: アルコールが興奮剤として働き、抑制薬を中和する。
  answer: C
  explanation: アルコールを精神安定剤や鎮静剤などの他の抑制薬と組み合わせた場合、その結果は単に足し合わされるだけでなく、掛け合わされ（相乗効果）、その影響ははるかに強く、より危険なものになります。
- id: 586
  category: penalties_and_points
  question: テネシー州の暗黙の同意法（Implied Consent Law）によると、法執行官からアルコールや薬物の化学検査を受けるよう求められ、それを拒否した場合、どのような罰則を受ける可能性が高いですか？
  choices:
    A: 500ドルの罰金
    B: 12ヶ月間の運転免許停止
    C: 即時の30日間の懲役
    D: イグニッション・インターロック装置（呼気吹き込み式エンジン始動装置）の設置義務
  answer: B
  explanation: 逮捕され、法執行官からの検査の要求を拒否した場合、裁判所によって運転免許が12ヶ月間停止される可能性が高くなります。
- id: 587
  category: alcohol_drugs_health
  question: 服用していた薬が医師から処方されたものである場合、それは飲酒・薬物運転（DUI）の罪に対する正当な抗弁になりますか？
  choices:
    A: はい。車内に処方薬のボトルがある限り抗弁になります。
    B: はい。処方薬は運転に支障をきたしません。
    C: いいえ。法律上、薬が処方されたものであるというだけでは、その影響下で運転したことの抗弁にはなりません。
    D: いいえ。医師が運転を許可する書面を特別に発行していない限り抗弁にはなりません。
  answer: C
  explanation: マニュアルには次のように明記されています。「法律上、薬が処方されたものであるというだけでは、その影響下で運転したことの抗弁にはなりません。」
- id: 588
  category: penalties_and_points
  question: 2012年に可決された「拒否禁止法（No Refusal law）」により、法執行官は何を行うことができるようになりましたか？
  choices:
    A: 初犯で運転免許を永久に停止する。
    B: 飲酒・薬物運転が疑われる運転者が関与する事件において、血液サンプルの捜索令状を請求する。
    C: 飲酒・薬物運転の運転者が運転する車の同乗者を逮捕する。
    D: 呼気検査を拒否した者の車両を没収する。
  answer: B
  explanation: 拒否禁止法（No Refusal law）により、法執行官は飲酒・薬物運転が疑われる運転者が関与する事件において、血液サンプルの捜索令状を請求することができます。
- id: 589
  category: alcohol_drugs_health
  question: アルコールの摂取は、運転者の警戒心と集中力にどのような影響を与えますか？
  choices:
    A: 興奮剤として働き、警戒心を高める。
    B: 神経伝達や身体機能を加速させる。
    C: 抑制薬として働き、運転者の警戒心や集中力を制限する。
    D: 血中アルコール濃度（BAC）が0.10%に達するまで集中力に影響はない。
  answer: C
  explanation: アルコールは、濃度に関わらず抑制薬であり、興奮剤ではありません。すべての神経伝達や身体機能を遅らせ、運転者の警戒心や集中力を制限します。
- id: 590
  category: alcohol_drugs_health
  question: 反応や協調運動に支障をきたす血中アルコール濃度（BAC）はどれくらいですか？
  choices:
    A: わずか0.02%から
    B: 0.05%を超えた場合のみ
    C: ちょうど0.08%で
    D: 0.10%以上で
  answer: A
  explanation: マニュアルには、わずか0.02%の血中アルコール濃度（BAC）でも、アルコール摂取によって反応や協調運動に支障をきたすと記されています。
- id: 591
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が0.00%であっても、運転手はDUI（飲酒・薬物影響下での運転）で有罪判決を受けることがありますか？
  choices:
    A: いいえ。BACが0.00%であれば、DUIの容疑は晴れます。
    B: はい。薬物によって運転能力が著しく損なわれている場合は有罪になります。
    C: はい。ただし、21歳未満の場合に限ります。
    D: いいえ。有罪判決には少なくとも0.02%のBACが必要です。
  answer: B
  explanation: 薬物によって運転能力が著しく損なわれている場合、BACが0.00%であってもDUIで有罪判決を受ける可能性があります。BACが0.08%未満であっても、それだけで運転手の容疑が晴れるわけではありません。
- id: 592
  category: alcohol_drugs_health
  question: アルコールと眼の筋肉にはどのような関係がありますか？
  choices:
    A: アルコールは眼の筋肉を緊張させ、焦点を合わせやすくします。
    B: アルコールは眼の筋肉を弛緩させ、まぶしさに対する視力を低下させ、適切に焦点を合わせられなくします。
    C: アルコールは眼の筋肉を刺激し、まぶしさからの回復速度を上げます。
    D: アルコールは眼の筋肉には影響を与えず、脳にのみ影響を与えます。
  answer: B
  explanation: 眼の筋肉が弛緩するため、まぶしさに対する視力が低下します。アルコールによって眼の筋肉が弛緩し、適切に焦点を合わせることができなくなります。
- id: 593
  category: alcohol_drugs_health
  question: マニュアルによると、運転に使用される情報の何パーセントが眼から得られますか？
  choices:
    A: 約50パーセント
    B: 約70パーセント
    C: ほぼ90パーセント
    D: 100パーセント
  answer: C
  explanation: 運転に使用される情報のほぼ90パーセントは眼から得られるため、視界が少しでも制限されると悲惨な結果を招く可能性があります。
- id: 594
  category: penalties_and_points
  question: アルコールの代わりに処方薬の影響を受けていた場合、DUI（飲酒・薬物影響下での運転）逮捕の罰則は異なりますか？
  choices:
    A: はい。処方薬によるDUIは罰則が軽くなります。
    B: はい。処方薬によるDUIは、初犯の場合警告のみとなります。
    C: いいえ。アルコールを飲んでいた場合でも薬物を服用していた場合でも、罰則は同じです。
    D: いいえ。ただし、処方薬によるDUIは運転記録には残りません。
  answer: C
  explanation: DUI逮捕の罰則は、運転手がアルコールを飲んでいた場合でも薬物（処方薬や市販薬であっても）を服用していた場合でも同じです。
- id: 595
  category: alcohol_drugs_health
  question: アルコールを摂取した後、最初に影響を受けるのは何ですか？
  choices:
    A: 運動協調性
    B: 視力
    C: 判断力
    D: 感情
  answer: C
  explanation: マニュアルによると、アルコールを飲んだ後に最初に影響を受けるのは人の判断力です。
- id: 596
  category: penalties_and_points
  question: 飲酒運転児童保護法（Drunk Driving Child Protection Act）に基づき、18歳未満の子供を同乗させてDUI法に違反した場合の義務的な最低懲役期間はどれくらいですか？
  choices:
    A: 48時間
    B: 7日間
    C: 30日間
    D: 45日間
  answer: C
  explanation: 飲酒運転児童保護法では、18歳未満の子供を同乗させてDUI法に違反した場合、最低30日間の懲役と最低1,000ドルの罰金が義務付けられています。
- id: 597
  category: penalties_and_points
  question: 18歳、19歳、または20歳で、アルコール飲料の購入または所持により初めて有罪判決を受けた場合、運転免許はどのくらいの期間停止されますか？
  choices:
    A: 6ヶ月間
    B: 1年間
    C: 2年間
    D: 21歳になるまで
  answer: B
  explanation: 18歳、19歳、または20歳で、アルコール飲料の購入、購入の試み、または所持により有罪判決を受けた場合、初犯で1年間運転免許を失います。
- id: 598
  category: alcohol_drugs_health
  question: 3杯のアルコール飲料の酔いを覚ますのに、およそどのくらいの時間がかかりますか？
  choices:
    A: 1時間
    B: 2時間
    C: 3時間
    D: 4時間
  answer: C
  explanation: 1杯のアルコールの影響をなくすのに約1時間かかるため、3杯のアルコールの酔いを覚ますには約3時間かかります。
- id: 599
  category: penalties_and_points
  question: 運転手の血中アルコール濃度（BAC）が0.20%以上の場合、初めてのDUI有罪判決での最低懲役期間はどれくらいですか？
  choices:
    A: 48時間
    B: 7日間
    C: 30日間
    D: 45日間
  answer: B
  explanation: 初犯の場合、懲役期間は48時間ですが、BACが0.20%以上の場合は7日間に増加します。
- id: 600
  category: penalties_and_points
  question: 影響下（飲酒・薬物）で自動車を運転し、他人が死亡する衝突事故を起こした場合、次のどの罪に問われる可能性がありますか？
  choices:
    A: 加重暴行罪
    B: 車両運転致死罪
    C: 特段に加重された児童危険罪
    D: 無謀危険罪
  answer: B
  explanation: 薬物やアルコールの影響下で自動車を運転し、他人が死亡する衝突事故を起こした場合、車両運転致死罪に問われる可能性があります。
- id: 601
  category: penalties_and_points
  question: 13歳から17歳までの未成年の違反者が、アルコールまたは薬物の所持で初めて有罪判決を受けた場合、運転免許はどのくらいの期間停止されますか？
  choices:
    A: 6ヶ月間、または16歳になるまでのいずれか長い方
    B: 1年間、または17歳になるまでのいずれか長い方
    C: 2年間、または18歳になるまでのいずれか長い方
    D: 21歳になるまで
  answer: B
  explanation: 13歳から17歳までの間で、アルコールまたは薬物の所持、消費、販売が発覚した場合、運転免許は1年間、または17歳になるまでのいずれか長い方の期間停止されます。
- id: 602
  category: alcohol_drugs_health
  question: 12オンスの瓶ビール1本に含まれるアルコール量は、次のどれとほぼ同じですか？
  choices:
    A: 1オンスのウイスキーのショット
    B: 1オンスのウイスキーのショット2杯
    C: 6オンスのグラスワイン
    D: 0.5オンスの純アルコール
  answer: A
  explanation: マニュアルには、12オンスの瓶ビール1本に含まれるアルコール量は、1オンスのウイスキーのショットとほぼ同じであると記載されています。
- id: 603
  category: penalties_and_points
  question: 2回目の飲酒運転（DUI）での有罪判決に対する罰金の範囲はいくらですか？
  choices:
    A: 350ドル ～ 1,500ドル
    B: 600ドル ～ 3,500ドル
    C: 1,100ドル ～ 10,000ドル
    D: 3,000ドル ～ 15,000ドル
  answer: B
  explanation: 飲酒運転（DUI）の罰則表によると、2回目の有罪判決の罰金は600ドルから3,500ドルの範囲です。
- id: 604
  category: penalties_and_points
  question: 21歳未満の血中アルコール濃度（BAC）に関する法律に基づき、16歳以上21歳未満の人が未成年者の飲酒運転で有罪となるのは、BACが少なくとも何パーセント以上で運転していた場合ですか？
  choices:
    A: 0.01パーセント
    B: 0.02パーセント
    C: 0.04パーセント
    D: 0.08パーセント
  answer: B
  explanation: 16歳以上21歳未満の人がBAC 0.02パーセントで運転しているのが発覚した場合、未成年者の飲酒運転として有罪判決を受けます。
- id: 605
  category: penalties_and_points
  question: 飲酒運転（DUI）の有罪判決による保護観察の条件として、違反者は次のどのメッセージが表示された衣服を着用し、8時間シフトのゴミ拾いを3回完了しなければなりませんか？
  choices:
    A: 「DUI OFFENDER（飲酒運転違反者）」
    B: 「I AM A DRUNK DRIVER（私は飲酒運転者です）」
    C: 「COMMUNITY SERVICE WORKER（社会奉仕活動員）」
    D: 「DON'T DRINK AND DRIVE（飲んだら乗るな）」
  answer: B
  explanation: ゴミ拾いを行う際、違反者は「I am a DRUNK DRIVER（私は飲酒運転者です）」というメッセージが表示されたベストなどの衣服を着用しなければなりません。
- id: 606
  category: alcohol_drugs_health
  question: 処方薬が関与する飲酒・薬物運転（DUI）での逮捕の罰則は、アルコールによるものと比較してどうですか？
  choices:
    A: 処方薬の罰則の方が軽い。
    B: 処方薬の罰則の方が重い。
    C: どちらも罰則は同じである。
    D: 処方薬でDUI逮捕されることはない。
  answer: C
  explanation: DUI逮捕の罰則は、運転者がアルコールを飲んでいた場合でも、薬物（処方薬や市販薬であっても）を服用していた場合でも同じです。
- id: 607
  category: penalties_and_points
  question: 4回目以降の飲酒運転（DUI）の有罪判決は、次のように分類されます：
  choices:
    A: A級軽犯罪（Class A misdemeanor）
    B: C級重罪（Class C felony）
    C: D級重罪（Class D felony）
    D: E級重罪（Class E felony）
  answer: D
  explanation: 飲酒運転（DUI）の罰則表には、4回目以降の有罪判決はE級重罪（Class E felony）であると示されています。
- id: 608
  category: penalties_and_points
  question: 5年以内に2回の飲酒運転（DUI）の有罪判決を受けた場合、運転免許の回復後、どのくらいの期間イグニッション・インターロック装置（呼気アルコール検知器）を装着した自動車を運転しなければなりませんか？
  choices:
    A: 6ヶ月間
    B: 1年間
    C: 3年間
    D: 5年間
  answer: A
  explanation: 5年間に2回のDUIを受けた人は、運転免許の回復後6ヶ月間、イグニッション・インターロック装置を装着した自動車を運転しなければなりません。
- id: 609
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が0.01～0.08パーセントの場合、若い運転者の事故の確率が年配の運転者と比べてはるかに高くなるのはなぜですか？
  choices:
    A: 若い運転者はスピードを出しすぎる傾向があるため。
    B: アルコールに対する耐性が低く、運転経験が浅いため。
    C: 若い運転者は夜間に運転する可能性が高いため。
    D: 処方薬を使用している可能性が高いため。
  answer: B
  explanation: 若い運転者は、BACが0.01～0.08パーセントの場合、年配の運転者よりも事故を起こす確率がはるかに高くなります。これは、アルコールに対する耐性が低く、運転経験が浅いためです。
- id: 610
  category: alcohol_drugs_health
  question: マニュアルによると、薬物やアルコールの使用および乱用に関する支援の紹介を受けるために電話できるフリーダイヤルの番号は何ですか？
  choices:
    A: 1-800-555-DRUG
    B: 1-800-889-9789
    C: 1-800-822-4357
    D: 1-800-DRIVING
  answer: B
  explanation: マニュアルには、薬物やアルコールの使用に関する詳細情報や支援の紹介については、フリーダイヤルの「レッドライン（Redline）」1-800-889-9789に電話するよう記載されています。
- id: 611
  category: alcohol_drugs_health
  question: テネシー州における「黙示の同意法（Implied Consent Law）」とは何を意味しますか？
  choices:
    A: いつでも車両の捜索に同意すること。
    B: 適切な自動車保険に加入することに同意すること。
    C: 求められた場合、血中のアルコールまたは薬物含有量を測定する検査を受けること。
    D: すべての交通反則金を30日以内に支払うことに同意すること。
  answer: C
  explanation: 黙示の同意法（Implied Consent Law）とは、求められた場合、血中のアルコールまたは薬物含有量を測定する検査を受けることを意味します。
- id: 612
  category: license_system
  question: 問題運転者照会システム（PDPS）の目的は何ですか？
  choices:
    A: テネシー州内の未払いの駐車違反切符を追跡するため。
    B: 運転免許証を発行する前に、全米運転者登録簿（National Driver Register）を検索するため。
    C: 交通違反をした運転者に違反点数を加算するため。
    D: 10代の運転者の学校の出席状況を監視するため。
  answer: B
  explanation: 問題運転者照会システム（PDPS）は、テネシー州安全・国土安全保障省が運転免許証を発行する前に、全米運転者登録簿（National Driver
    Register）を検索するために使用されます。
- id: 613
  category: penalties_and_points
  question: テネシー州の運転免許証が取り消しまたは停止される理由となるのは、次のうちどれですか？
  choices:
    A: 3年間にスピード違反の切符を1回切られること。
    B: ガソリンスタンドで燃料代を支払わずに自動車を運転して立ち去ること。
    C: 定期的に車両を洗車しないこと。
    D: 荷捌き所に5分間駐車すること。
  answer: B
  explanation: 給油したガソリンまたはディーゼル燃料の代金を支払わずにガソリンスタンドから自動車を運転して立ち去る行為は、運転免許証が取り消しまたは停止される可能性のある状況として挙げられています。
- id: 614
  category: penalties_and_points
  question: 18歳未満の者は、学校を中退（dropping out）した場合、運転の特権を失う可能性があります。この文脈において「中退」とはどのように定義されていますか？
  choices:
    A: 1学期に5日連続で無断欠席すること。
    B: 1学期に10日連続、または合計15日の無断欠席をすること。
    C: 成績評価期間中に1科目を落とすこと。
    D: 理由を問わず、1年間に20日学校を休むこと。
  answer: B
  explanation: 学校の中退は、1学期に10日連続、または合計15日の無断欠席をすることと定義されています。
- id: 615
  category: penalties_and_points
  question: 運転の特権を維持するためには、18歳未満の者は学校で十分な成績を収める必要があります。これは一般的に何を意味しますか？
  choices:
    A: GPA 3.0を維持すること。
    B: 成績評価期間ごとに全科目に合格すること。
    C: 成績評価期間ごとに3科目に合格すること。
    D: 無遅刻無欠席であること。
  answer: C
  explanation: 学校で十分な成績を収めるとは、一般的に成績評価期間ごとに3科目に合格することを意味します。これを満たさない場合、運転の特権を失う可能性があります。
- id: 616
  category: penalties_and_points
  question: 運転免許証が停止または取り消された場合、何日以内に安全省（Department of Safety）に返納しなければなりませんか？
  choices:
    A: 10日
    B: 15日
    C: 20日
    D: 30日
  answer: C
  explanation: 運転免許証が停止または取り消された場合は常に、停止または取り消しから20日以内に安全省（Department of Safety）に返納しなければなりません。
- id: 617
  category: penalties_and_points
  question: 停止または取り消された運転免許証を規定の期間内に返納しなかった場合の罰則は何ですか？
  choices:
    A: 50ドルの罰金
    B: 他の罰金や費用に加えて75ドルの罰金
    C: 追加で6ヶ月の免許停止
    D: 義務的な出廷
  answer: B
  explanation: 免許証を返納しなかった場合、支払うべき他の罰金や費用に加えて、75ドルの罰金が科せられます。
- id: 618
  category: driver_responsibility
  question: 住所が変更になった場合、何日以内に安全省（Department of Safety）に報告しなければなりませんか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 30日
  answer: B
  explanation: 住所が変更になった場合、変更から10日以内に安全省（Department of Safety）に報告しなければなりません。
- id: 619
  category: penalties_and_points
  question: 非居住者違反者協定（Non-Resident Violator Compact）の下で、他の加盟州で発行された交通違反切符を無視した場合、どうなりますか？
  choices:
    A: テネシー州での運転の特権が停止、取り消し、または無効になります。
    B: 次にテネシー州で運転した際に逮捕されます。
    C: 違反切符は1年後に自動的に取り下げられます。
    D: テネシー州から罰金を科されるだけです。
  answer: A
  explanation: 他の加盟州からの違反切符を無視した場合、裁判所が安全省（Department of Safety）に違反切符が適切に処理されたと通知するまで、あなたの運転の特権は停止、取り消し、または無効になります。
- id: 620
  category: penalties_and_points
  question: 成人運転者（18歳以上）は、12ヶ月以内に何点の違反点数を累積すると、免許停止の予告通知を受け取りますか？
  choices:
    A: 6点以上
    B: 8点以上
    C: 10点以上
    D: 12点以上
  answer: D
  explanation: 12ヶ月以内に12点以上の違反点数を累積した成人運転者（18歳以上）は、免許停止の予告通知を受け取ります。
- id: 621
  category: penalties_and_points
  question: 成人ドライバーが任意の12ヶ月間に何ポイントを累積すると、運転免許を失う可能性があることを知らせる警告状（advisory letter）を受け取りますか？
  choices:
    A: 2〜4ポイント
    B: 4〜6ポイント
    C: 6〜11ポイント
    D: 10〜15ポイント
  answer: C
  explanation: 任意の12ヶ月間に運転記録に6〜11ポイントが累積された免許保持者には、警告状が郵送されます。
- id: 622
  category: penalties_and_points
  question: 12ヶ月間に何回の無謀運転（reckless driving）違反を犯すと、テネシー州の運転免許が取り消しまたは停止されますか？
  choices:
    A: 1回
    B: 2回
    C: 3回
    D: 4回
  answer: B
  explanation: テネシー州では、12ヶ月間に2回の無謀運転違反を犯した場合、運転免許が取り消しまたは停止されることがあります。
- id: 623
  category: penalties_and_points
  question: ドライバーが車内にどれだけの量のメタンフェタミン（覚醒剤）を所持していると、免許の取り消しまたは停止につながる可能性がありますか？
  choices:
    A: 1グラム以上
    B: 3グラム以上
    C: 5グラム以上
    D: 10グラム以上
  answer: C
  explanation: ドライバーが車内に5グラム以上のメタンフェタミンを所持していた場合、運転免許が取り消しまたは停止されることがあります。
- id: 624
  category: penalties_and_points
  question: 免許が停止、取り消し、または無効にされる前に、当局は処分前に聴聞（ヒアリング）の機会を与えますが、次のうち例外となるのはどれですか？
  choices:
    A: 12ヶ月間に12ポイントを累積した場合。
    B: 最終判決および有罪判決の場合。
    C: 養育費の支払いを怠った場合。
    D: 高校を中退した場合。
  answer: B
  explanation: 免許が停止、取り消し、または無効にされようとしている場合、当局は処分前に聴聞の機会を与えますが、最終判決および有罪判決の場合は例外となります。
- id: 625
  category: penalties_and_points
  question: 成人ドライバーが免許停止の事前通知（notice of proposed suspension）を受け取るには、12ヶ月間に何ポイントを累積する必要がありますか？
  choices:
    A: 6ポイント以上
    B: 8ポイント以上
    C: 10ポイント以上
    D: 12ポイント以上
  answer: D
  explanation: 12ヶ月間に12ポイント以上を累積した成人ドライバー（18歳以上）には、免許停止の事前通知が送付されます。
- id: 626
  category: driver_responsibility
  question: 免許停止を回避または期間を短縮するために、ドライバーが防衛運転講習（Defensive Driving Course）を受講できるのはどのくらいの頻度ですか？
  choices:
    A: 1年に1回
    B: 3年に1回
    C: 任意の5年間に1回
    D: 一生に1回
  answer: C
  explanation: 免許停止を回避したり停止期間を短縮したりするための防衛運転講習の受講は、任意の5年間に1回のみ可能です。
- id: 627
  category: penalties_and_points
  question: 免許停止中に運転した場合の結果はどうなりますか？
  choices:
    A: 警告状が郵送される
    B: 停止期間が延長され、刑事訴追される可能性がある
    C: 筆記試験を再受験しなければならない
    D: 車両が永久に没収される
  answer: B
  explanation: 免許停止中に運転すると、停止期間が延長され、さらに刑事訴追される可能性もあります。
- id: 628
  category: penalties_and_points
  question: 乗客の乗降のために停車しているスクールバス、教会バス、または青少年用バスを追い越した場合、運転記録に何ポイントが加算されますか？
  choices:
    A: 4ポイント
    B: 5ポイント
    C: 6ポイント
    D: 8ポイント
  answer: D
  explanation: ポイント表によると、乗客の乗降のために停車しているスクールバス、教会バス、または青少年用バスを追い越した場合、8ポイントが加算されます。
- id: 629
  category: alcohol_drugs_health
  question: てんかんや糖尿病などの疾患により意識やコントロールを失ったドライバーが、免許の再交付を受ける資格を得るには、最低どのくらいの期間、発作や意識喪失がない状態（lapse-free）を維持しなければなりませんか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 1年
    D: 2年
  answer: B
  explanation: てんかん、心臓性失神、糖尿病などの疾患により意識やコントロールを失ったドライバーは免許停止となり、免許の再交付を受ける資格を得るには、最低6ヶ月間、発作や意識喪失がない状態を維持しなければなりません。
- id: 630
  category: penalties_and_points
  question: 緊急車両に道を譲らなかった場合、何ポイントが加算されますか？
  choices:
    A: 3ポイント
    B: 4ポイント
    C: 6ポイント
    D: 8ポイント
  answer: C
  explanation: ポイント表では、「緊急車両に道を譲らない（Failure to yield right of way to emergency vehicles）」違反に対して6ポイントが割り当てられています。
- id: 631
  category: license_system
  question: 交通違反の呼出状（citation）の要件を満たさなかったために制限付き免許（restricted license）を取得した場合、どこへの運転が許可されますか？
  choices:
    A: 職場への往復のみ
    B: 職場および全日制大学への往復
    C: 午前6時から午後6時までの間であればどこでも
    D: 職場および宗教行事への往復
  answer: A
  explanation: 交通違反の呼出状の要件を満たさなかったことによる制限付き免許の場合、認定命令により職場への往復のみ運転が許可されます。
- id: 632
  category: penalties_and_points
  question: 工事区間内で制限速度を時速16～25マイル（約25～40km/h）超過するスピード違反をした場合、何点加点されますか？
  choices:
    A: 4点
    B: 5点
    C: 6点
    D: 8点
  answer: B
  explanation: 制限速度を時速16～25マイル超過するスピード違反は通常4点ですが、工事区間内の場合は5点となります。
- id: 633
  category: license_system
  question: DUI（飲酒・薬物影響下での運転）の有罪判決を受けた後の制限付き運転免許は、過去10年以内に以下のどの有罪判決を受けたことがある運転手には適用されませんか？
  choices:
    A: 無謀運転
    B: 時速25マイルを超えるスピード違反
    C: 成人の機能低下状態での運転（Adult driving while impaired）
    D: ドラッグレース
  answer: C
  explanation: 過去10年以内にDUIまたは成人の機能低下状態での運転による有罪判決を受けたことがある運転手には、制限付き免許の選択肢は与えられません。
- id: 634
  category: alcohol_drugs_health
  question: 身体的または精神的な障害により運転能力に影響があるという情報が車両管理局（Department）に寄せられた場合、何日以内に診断書を提出しなければなりませんか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: C
  explanation: 運転手は、通知から30日以内に医師の診断書を提出することが求められます。
- id: 635
  category: penalties_and_points
  question: 18歳未満の運転手が携帯電話を使用しながら車両を運転した場合、何点加点されますか？
  choices:
    A: 3点
    B: 4点
    C: 6点
    D: 8点
  answer: C
  explanation: 点数表には、「携帯電話を使用しながらの車両運転（18歳未満）」に対して6点と規定されています。
- id: 636
  category: license_system
  question: 薬物またはアルコール関連の罪で免許を失った未成年者は、どこへの往復のために制限付き免許を申請できますか？
  choices:
    A: 宗教行事および職場
    B: 教育機関または職場
    C: 外来治療プログラムのみ
    D: 日中の時間帯であればどこでも
  answer: B
  explanation: 薬物またはアルコール関連の罪で免許を失った未成年者は、教育機関への往復、または職場への往復のために自動車を運転するための制限付き免許を裁判官に申請することができます。
- id: 637
  category: penalties_and_points
  question: 他人の死亡につながる衝突事故の発生に関与した運転手には、何点加点されますか？
  choices:
    A: 4点
    B: 5点
    C: 6点
    D: 8点
  answer: D
  explanation: 点数表では、「他人の死亡につながる衝突事故の発生への関与」に対して8点が割り当てられています。
- id: 638
  category: driver_responsibility
  question: 免許停止期間の終了後、成人の運転手が通常の免許を取得する前に、特にどの種類の保険証明が必要ですか？
  choices:
    A: 車両保険（Comprehensive insurance）
    B: SR-22保険
    C: 衝突保険（Collision insurance）
    D: 無保険車傷害保険
  answer: B
  explanation: 停止期間の終了後、適切な免許回復手数料を支払い、賠償責任保険/支払責任能力の証明を提出しなければなりません（成人の運転手にはSR-22保険が必要です）。
- id: 639
  category: license_system
  question: 運転手が所定の期間内に車両管理局（Department）からの診断書提出の要請に応じなかった場合、どうなりますか？
  choices:
    A: 50ドルの罰金が科される。
    B: 運転特権（免許）が停止される。
    C: 車両登録が取り消される。
    D: 筆記試験の再受験のみが求められる。
  answer: B
  explanation: マニュアルによると、所定の期間内に車両管理局からの診断書提出や運転免許試験の受験要請に応じなかった場合、運転特権（免許）が停止されます。
- id: 640
  category: driver_responsibility
  question: 他人に与えた損害を補償する保険はどれですか？
  choices:
    A: 衝突保険（Collision insurance）
    B: 無保険車傷害保険
    C: 賠償責任保険（Liability insurance）
    D: 車両保険（Comprehensive insurance）
  answer: C
  explanation: マニュアルでは、賠償責任保険（Liability insurance）を他人に与えた損害を補償するものと定義しています。
- id: 641
  category: driver_responsibility
  question: テネシー州法では、車両保険（衝突保険）への加入が義務付けられていますか？
  choices:
    A: はい、すべての運転者に義務付けられています。
    B: はい、ただし商用車にのみ義務付けられています。
    C: いいえ、義務付けられていません。
    D: いいえ、過去に事故歴がない限り義務付けられていません。
  answer: C
  explanation: マニュアルには、「テネシー州法では車両保険（衝突保険）は義務付けられていませんが、財政責任法（Financial Responsibility
    Law）により、運転者は財政的責任の証明を提示することが義務付けられている」と明記されています。
- id: 642
  category: driver_responsibility
  question: 財政的責任の証明として認められる形式として記載されていないものは、次のうちどれですか？
  choices:
    A: 保険引受証（仮証明書）
    B: 保険証券の契約内容宣言書（デクラレーション・ページ）
    C: 保険代理店からの口頭での約束
    D: 認可された保険会社の保険カード
  answer: C
  explanation: 認められる証明の形式には、契約内容宣言書、保険引受証、保険カード、現金供託/保証金の証明書、または自己保険者としての資格証明が含まれます。口頭での約束は記載されていません。
- id: 643
  category: safe_driving_rules
  question: 死亡、負傷、またはいくらを超える物的損害を伴う事故が発生した場合、直ちに警察に通報しなければなりませんか？
  choices:
    A: 50ドル
    B: 100ドル
    C: 400ドル
    D: 500ドル
  answer: A
  explanation: 運転者は、死亡、負傷、または50ドルを超える物的損害を伴う事故が発生した場合、直ちに地元警察、郡保安官事務所、またはハイウェイパトロールに通報しなければなりません。
- id: 644
  category: driver_responsibility
  question: 運転者が身体的な理由で直ちに警察に事故の通報を行えない場合、誰が通報する義務がありますか？
  choices:
    A: 事故に関与した相手の運転者
    B: 通報可能な同乗者
    C: 現場の第一目撃者
    D: 運転者の保険会社
  answer: B
  explanation: マニュアルには、運転者が身体的な理由で直ちに通報できず、通報可能な同乗者がいる場合、その同乗者が通報を行うか、通報を手配しなければならないと記載されています。
- id: 645
  category: driver_responsibility
  question: 任意の1人の物的損害がいくらを超える場合、その事故を「報告義務のある事故（reportable crash）」としてテネシー州安全・国土安全保障省に報告しなければなりませんか？
  choices:
    A: 50ドル
    B: 200ドル
    C: 400ドル
    D: 1,000ドル
  answer: C
  explanation: 報告義務のある事故には、死傷者が出た事故、または任意の1人の物的損害が400ドルを超える事故が含まれます。
- id: 646
  category: driver_responsibility
  question: 報告義務のある事故について、テネシー州安全・国土安全保障省に「所有者/運転者報告書（Owner/Driver Report）」を提出する期限は何日以内ですか？
  choices:
    A: 5日
    B: 10日
    C: 15日
    D: 20日
  answer: D
  explanation: 報告義務のある事故に関与した車両の運転者および/または所有者は、20日以内に事故の所有者/運転者報告書を提出しなければなりません。
- id: 647
  category: safe_driving_rules
  question: 無人の車両との事故を起こし、その所有者が見つからない場合はどうすればよいですか？
  choices:
    A: フロントガラスにメモを残して走り去る。
    B: 警察に事故を通報する。
    C: 所有者が戻るまで現場で待つ。
    D: 30日以内に所有者/運転者報告書を提出する。
  answer: B
  explanation: 無人の車両や家畜が関与する事故で所有者が見つからない場合、警察に事故を通報しなければなりません。
- id: 648
  category: penalties_and_points
  question: 事故に対する財政的責任を証明できなかったために運転免許が取り消された場合、免許を回復する前に、加入している賠償責任保険会社はどのフォームを提出しなければなりませんか？
  choices:
    A: SR-22フォーム
    B: FR-44フォーム
    C: TN-10フォーム
    D: DL-12フォーム
  answer: A
  explanation: このような取り消し後に運転免許を回復するには、回復手数料を支払い、賠償責任保険会社にSR-22フォームを安全省へ提出してもらう必要があります。
- id: 649
  category: safe_driving_rules
  question: 事故現場で火災を防ぐために、損傷した車両に対して最初にすべきことは何ですか？
  choices:
    A: バッテリーの接続を外す。
    B: イグニッション（エンジン）を切る。
    C: エンジンに水をかける。
    D: ガソリンキャップを外す。
  answer: B
  explanation: マニュアルでは、「火災を防ぐため、損傷した車両のイグニッションを切る」よう運転者に指示しています。
- id: 650
  category: safe_driving_rules
  question: テネシー州法では、州間高速道路（インターステート）での事故後、交通の流れから車両を移動させることが許可されるのはどのような場合ですか？
  choices:
    A: 警察が到着して写真を撮った後のみ。
    B: 車両が走行可能であり、重大な人身傷害や死亡がない場合。
    C: レッカー車が到着するまで、車両を移動させることは絶対に許可されない。
    D: 物的損害が50ドル未満の場合のみ。
  answer: B
  explanation: 州間高速道路での交通事故に関与した場合、車両がまだ走行可能であり、重大な人身傷害や死亡がない場合、テネシー州法では交通の妨げにならないよう車両を移動させることが許可されています。
- id: 651
  category: safe_driving_rules
  question: 医療や救助の訓練を受けていない場合、大破した車両から負傷者を移動させてもよいのはどのような時ですか？
  choices:
    A: 本人が移動を求めた時。
    B: 交通の妨げになっている時。
    C: 火災などの差し迫った危険がある時。
    D: 救急車の到着まで10分以上かかる時。
  answer: C
  explanation: 必要な医療や救助の訓練を受けている場合、または火災などの差し迫った危険がある場合を除き、大破した車両から負傷者を移動させようとしないでください。
- id: 652
  category: defensive_driving
  question: 事故現場に最初に到着し、救護の専門的な訓練を受けていない場合、911に通報した後はどうすべきですか？
  choices:
    A: 停車して事故現場周辺の交通整理をする。
    B: 妨げにならないよう、車でゆっくりと通り過ぎる。
    C: 車を停め、警察に事情聴取されるのを待つ。
    D: 車両から乗客を救出しようとする。
  answer: B
  explanation: 救護の専門的な訓練を受けていない場合は、警察や救急隊の到着の妨げにならないよう、また二次衝突を防ぐために、車でゆっくりと通り過ぎてください。
- id: 653
  category: safe_driving_rules
  question: マニュアルによると、事故の発生を目撃した場合の適切な手順は何ですか？
  choices:
    A: 安全に道路脇に車を停め、ハザードランプを点灯させ、警察に通報する。
    B: ひき逃げの場合はその車両を追いかける。
    C: 運転を続け、帰宅してから警察に電話する。
    D: 道路の中央に停車して交通を遮断し、現場を保護する。
  answer: A
  explanation: 事故の発生を目撃した場合は、安全に道路脇に車を停め、車のハザードランプ（非常点滅表示灯）を点灯させてください。そして、警察官またはテネシー州警察（Tennessee
    State Trooper）に事故を目撃したことを伝えてください。
- id: 654
  category: penalties_and_points
  question: マニュアルによると、運転免許証が取り消しまたは停止される可能性があるのは、次のうちどの理由ですか？
  choices:
    A: 12ヶ月以内に8ポイントを累積する
    B: 運転免許証を不正に改ざんする
    C: 1回の駐車違反切符を切られる
    D: 制限速度を時速5マイル（約8km/h）1回超えて運転する
  answer: B
  explanation: マニュアルには、運転免許証の不正な改ざん、または度重なる有罪判決により12ヶ月以内に12ポイント以上累積した場合、運転免許証が取り消しまたは停止される可能性があると記載されています。
- id: 655
  category: defensive_driving
  question: 安全運転の実践である「Aim High In Steering（視線を高く保つ）」とはどういう意味ですか？
  choices:
    A: ステアリングホイール（ハンドル）を最も高い位置に調整すること
    B: 重要な交通情報を発見するために、できるだけ道路の先を見ること
    C: 車のボンネットに直接視線を集中させること
    D: ハンドルの最上部を両手で握って操作すること
  answer: B
  explanation: 「Aim High In Steering（視線を高く保つ）」とは、適切な判断を下すための重要な交通情報を発見するために、できるだけ道路の先を見ることを意味します。
- id: 656
  category: defensive_driving
  question: 運転中に「Leave Yourself an Out（逃げ道を確保する）」ためには、車の前方に加えて、少なくともどちらにスペースを確保すべきですか？
  choices:
    A: 両側
    B: 後方
    C: 片側
    D: 助手席側のみ
  answer: C
  explanation: マニュアルでは、危険を回避するために、常に備えをして車の前方と少なくとも片側にスペースを確保し、「Leave Yourself an
    Out（逃げ道を確保する）」ことを推奨しています。
- id: 657
  category: driver_responsibility
  question: 安全運転を確保するために身につけるべき最も重要な運転態度は何ですか？
  choices:
    A: 攻撃性とスピード
    B: 他者への礼儀と思いやり
    C: 自信と自己主張
    D: 競争心と警戒心
  answer: B
  explanation: マニュアルによると、他者への礼儀と思いやりは、身につけるべき最も重要な運転態度であり、安全運転の鍵となります。
- id: 658
  category: defensive_driving
  question: 防衛運転（ディフェンシブ・ドライビング）を行う際、他の運転手がどう行動すると予想すべきですか？
  choices:
    A: 常に交通規則を守る
    B: あなたに通行権を譲る
    C: 間違った行動をとる
    D: 方向指示器を正しく使用する
  answer: C
  explanation: 注意深く運転するための重要なルールは、他の運転手が間違った行動をとると予想し、そのミスに対処するための行動計画を準備しておくことです。
- id: 659
  category: safe_driving_rules
  question: 車間距離を少なくとも3〜4秒に広げるべきなのは、どのような状況ですか？
  choices:
    A: 住宅街を運転している時
    B: 高速道路で大型商用トラックやバスの後ろを走っている時
    C: 渋滞で発進と停止を繰り返している時
    D: 四方向一時停止の交差点に近づいている時
  answer: B
  explanation: マニュアルには、高速道路を走行中、大型商用トラックやバスの後ろを走っている時、または悪天候や視界不良の状況下では、車間距離を少なくとも3〜4秒に広げることが最も安全であると記載されています。
- id: 660
  category: defensive_driving
  question: 運転中、道路や周囲の状況に関する情報の何パーセントを視覚から得ていますか？
  choices:
    A: 50%
    B: 75%
    C: 90%
    D: 99%
  answer: C
  explanation: 運転中、私たちは道路や周囲の状況に関する情報の90%を視覚から得ています。
- id: 661
  category: defensive_driving
  question: 防衛運転（ディフェンシブ・ドライビング）において、ドライバーは道路をスキャンする際、どのくらい先を見るようにするべきですか？
  choices:
    A: 2〜3秒先
    B: 5〜8秒先
    C: 10〜15秒先
    D: 20〜30秒先
  answer: C
  explanation: 防衛運転では、状況を早く察知し、反応するための時間をより多く確保するために、10〜15秒先（約1区画分の距離）に視線を向けるようにします。
- id: 662
  category: safe_driving_rules
  question: 交差点に進入する際、なぜ最初に左を見るべきなのですか？
  choices:
    A: 左から来る車の方が自分に近いから
    B: 左から来る車が常に優先権（right-of-way）を持っているから
    C: ほとんどの交差点で左折が違法だから
    D: 交通標識は通常左側に設置されているから
  answer: A
  explanation: どの交差点でも、左から来る車の方が自分に近いため、まずは左を見るようにしてください。
- id: 663
  category: defensive_driving
  question: 後方の交通状況を確認するために、どのくらいの頻度でバックミラー（ルームミラー）を使用するべきですか？
  choices:
    A: 約5秒ごと
    B: 約10秒ごと
    C: 約30秒ごと
    D: 停止する準備をしている時のみ
  answer: B
  explanation: 後方の交通状況を確認するために、約10秒ごとに頻繁にバックミラーを使用するべきです。
- id: 664
  category: safe_driving_rules
  question: 方向指示器（ウィンカー）を使用する習慣は、どのような時に身につけるべきですか？
  choices:
    A: 道路上に他の車両が見える時のみ
    B: 州間高速道路（インターステート）で車線変更する時のみ
    C: 道路上に他の車両が見えない時でも
    D: 日中のみ
  answer: C
  explanation: 道路上に他の車両が見えない時でも、方向指示器を使用する習慣を身につけるべきです。
- id: 665
  category: defensive_driving
  question: 後続車に車間距離を詰められて（あおり運転されて）おり、移動できる右車線がない場合、最も安全な対処法は何ですか？
  choices:
    A: 急減速して後続車を牽制する
    B: 前方の道路がクリアになり、追い越しが合法になるまで待ち、その後ゆっくりと速度を落とす
    C: 加速して後続車との車間距離を広げる
    D: ブレーキを何度も軽く踏んでブレーキランプを点滅させる
  answer: B
  explanation: 右車線がない場合は、前方の道路がクリアになり、追い越しが合法になるまで待ち、その後ゆっくりと速度を落とします。これにより、後続車があなたを追い越すよう促すことができます。絶対に急減速してはいけません。
- id: 666
  category: defensive_driving
  question: 道路をスキャンしている際、車両が自分の進路に進入してくるかもしれないことを示す手がかりは、次のうちどれですか？
  choices:
    A: その車両の窓が開いている
    B: その車両のフロントガラスが汚れている
    C: その車両のタイヤの向きが変わっている、または排気ガスが出ている
    D: その車両が消火栓の近くに駐車されている
  answer: C
  explanation: 排気ガス、ブレーキランプやバックランプの点灯、タイヤの向きの変化などは、その車両が自分の進路に進入してくる可能性があることを示しているため、これらの手がかりに注意を払うべきです。
- id: 667
  category: safe_driving_rules
  question: 2車線道路（片側1車線）で対向車とすれ違う際、自分の車両をどこに位置させるべきですか？
  choices:
    A: センターラインの真上
    B: センターラインに寄りすぎないよう、車線の少し右側
    C: 視界を良くするため、車線の少し左側
    D: 道路の右側の路肩
  answer: B
  explanation: 2車線道路で対向車とすれ違う際は、センターラインに「寄りすぎない」よう、車線の少し右側を走行してください。
- id: 668
  category: penalties_and_points
  question: 12ヶ月以内に交通違反の有罪判決を頻繁に受け、合計で何ポイントに達すると、運転免許証が取り消しまたは免停になる可能性がありますか？
  choices:
    A: 6ポイント以上
    B: 8ポイント以上
    C: 10ポイント以上
    D: 12ポイント以上
  answer: D
  explanation: 12ヶ月以内に交通違反の有罪判決を頻繁に受け、合計で12「ポイント」以上に達すると、運転免許証が取り消しまたは免停になる可能性があります。
- id: 669
  category: defensive_driving
  question: 車線変更、道路への進入、または他の車線と合流する際に必要な最小限のギャップ（車間距離・時間）はどれくらいですか？
  choices:
    A: 2秒のギャップ
    B: 3秒のギャップ
    C: 4秒のギャップ
    D: 5秒のギャップ
  answer: C
  explanation: マニュアルによると、車線変更、道路への進入、または自分の車線が他の車線と合流する際には、最低4秒のギャップが必要です。
- id: 670
  category: safe_driving_rules
  question: 他の車両を追い越す際、元の走行車線に戻るのが最も安全なのはいつですか？
  choices:
    A: 自分の車両が他の車両のフロントバンパーより前に出た直後。
    B: 追い越した車両の両方のヘッドライトがバックミラー（ルームミラー）で見えるようになった時。
    C: 追い越されたドライバーがヘッドライトをパッシングしてきた時。
    D: 車線変更してからちょうど3秒経過した後。
  answer: B
  explanation: 防衛的に追い越しを完了させるには、追い越したばかりの車両の両方のヘッドライトがバックミラーで見えるようになるまで、走行車線に戻らないのが最も安全です。
- id: 671
  category: safe_driving_rules
  question: 時速55マイル（55 M.P.H.）で1台の車両を追い越すのに、およそどのくらいの時間が必要ですか？
  choices:
    A: 約5秒
    B: 約10秒
    C: 約15秒
    D: 約20秒
  answer: B
  explanation: 時速55マイル（55 M.P.H.）で1台の車両を追い越すには約10秒かかります。つまり、対向車との間に10秒間の車間距離（ギャップ）が必要になるということです。
- id: 672
  category: defensive_driving
  question: 米国運輸省道路交通安全局（NHTSA）によると、年間の全交通事故死者のうち、あおり運転などの攻撃的な運転行動（aggressive driving）が原因となっている割合はおよそ何パーセントですか？
  choices:
    A: 33%
    B: 50%
    C: 66%
    D: 80%
  answer: C
  explanation: 米国運輸省道路交通安全局（NHTSA）によると、年間の全交通事故死者の約66%が、攻撃的な運転行動によって引き起こされています。
- id: 673
  category: defensive_driving
  question: 攻撃的な運転をするドライバーに後をつけられた場合、推奨される行動は何ですか？
  choices:
    A: すぐに帰宅し、ドアをロックする。
    B: 車を止めて、そのドライバーに立ち向かう。
    C: 警察署や、助けを求められる公共の場所に向かう。
    D: スピードを上げて、交通の中でそのドライバーを振り切る。
  answer: C
  explanation: ロードレイジ（路上での暴力行為）を避けるためのヒントには、他のドライバーに後をつけられた場合、警察署や助けを求められる公共の場所に向かうべきだと記載されています。
- id: 674
  category: safe_driving_rules
  question: ほとんどの事故はどのような天候の時に発生しますか？
  choices:
    A: 晴天時
    B: 降雪時
    C: 降雨時
    D: 霧の時
  answer: A
  explanation: 特殊な運転条件に関するマニュアルの小テストによると、ほとんどの事故は晴天時に発生しており、「天気の良い日も致命的になり得る！」と記されています。
- id: 675
  category: defensive_driving
  question: 衝突を避けるためにドライバーが取れる3つの選択肢は何ですか？
  choices:
    A: 止まる、曲がる、スピードを上げる
    B: ブレーキをかける、クラクションを鳴らす、急ハンドルを切る
    C: 止まる、バックする、曲がる
    D: 加速する、クラクションを鳴らす、ブレーキをかける
  answer: A
  explanation: 衝突を避ける際、ドライバーには次の3つの選択肢があります：1. 止まる、2. 曲がる、3. スピードを上げる。
- id: 676
  category: vehicle_information
  question: 急ブレーキをかける必要があり、車にアンチロック・ブレーキ・システム（ABS）が装備されている場合、どうするべきですか？
  choices:
    A: スリップを防ぐために、ブレーキを素早くポンピングする。
    B: ブレーキペダルをできるだけ強く踏み込み、そのまましっかりと踏み続ける。
    C: ブレーキを優しくかけ、徐々に圧力を強める。
    D: ブレーキペダルを強く踏み込み、押し返される感覚があればすぐにペダルを戻す。
  answer: B
  explanation: ABSが装備されている場合、ブレーキペダルをできるだけ強く踏み込み、そのまましっかりと踏み続ける必要があります。ペダルが押し返される感覚（キックバック）があっても、ブレーキペダルを戻してはいけません。
- id: 677
  category: vehicle_information
  question: 急ブレーキをかける必要があり、車にABSが装備されておらず、ブレーキがロックしてスリップしてしまった場合、どうするべきですか？
  choices:
    A: ブレーキペダルをできるだけ強く踏み続ける。
    B: すぐにブレーキペダルを戻し、スリップが収まったら再び踏み込む。
    C: ハンドルを反対方向に急激に切る。
    D: すぐにパーキングブレーキをかける。
  answer: B
  explanation: ABSが装備されていない車でブレーキがロックしてスリップし始めた場合は、すぐにブレーキペダルを戻す必要があります。車のスリップが収まったら、すぐに再びブレーキペダルを踏み込みます。
- id: 678
  category: safe_driving_rules
  question: 素早く回避のためのターン（急ハンドル）を行う場合、推奨されるハンドルの握る位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 8時と4時の位置
    C: 3時と9時の位置
    D: 12時と6時の位置
  answer: C
  explanation: ほとんどのターン、特に素早いターンを行う場合は、手を3時と9時の位置に置くのが最適です。
- id: 679
  category: vehicle_information
  question: ハンドルを握る位置として3時と9時の位置が推奨されるのはなぜですか？
  choices:
    A: 方向指示器（ウィンカー）に手が届きやすくなるため。
    B: 手首や前腕をエアバッグの主な衝撃エリアから遠ざけるため。
    C: 急なターン中にハンドルがロックするのを防ぐため。
    D: 片手でハンドルを回す際に最もてこの原理が働くため。
  answer: B
  explanation: 手を3時と9時の位置に置くことで、万が一衝突事故に巻き込まれた際に、手首や前腕をハンドル内のエアバッグの主な衝撃エリアから遠ざけることができます。
- id: 680
  category: defensive_driving
  question: 運転ルールの「スプリット・ザ・ディファレンス（危険を分割する）」とはどういう意味ですか？
  choices:
    A: 自転車を追い越す際に車線をまたぐこと。
    B: 2つの危険の中間を進み、より危険な側により多くのスペースを空けること。
    C: 複数車線の道路を1車線ずつ横断すること。
    D: 通常の交通状況で2秒間の車間距離を保つこと。
  answer: B
  explanation: 「スプリット・ザ・ディファレンス（危険を分割する）」とは、2つの危険の中間を進むことを意味します。一方が他方より危険な場合は、より危険な側により多くのスペースを空けます。
- id: 681
  category: safe_driving_rules
  question: 交差点で他の交通を横切る際、進入する前に何を確認しなければなりませんか？
  choices:
    A: 中央分離帯まで半分渡って待機できること。
    B: 交差点を塞ぐことなく、完全に渡りきれるだけの十分な車間距離（ギャップ）があること。
    C: 後続車も横切る準備ができていること。
    D: 接近する車より先に通過できるよう加速すること。
  answer: B
  explanation: 他の交通を横切る際は、道路を完全に渡りきれるだけの十分な車間距離（ギャップ）が必要です。交差点を塞いだり、車体の一部を車線に残したまま立ち往生したりしてはいけません。
- id: 682
  category: defensive_driving
  question: 他の運転手が十分なスペースがないのに追い越しをするなどのミスをした場合、どうするべきですか？
  choices:
    A: 車線に入らせないように加速する。
    B: クラクションを鳴らし、ヘッドライトを点滅させて警告する。
    C: 減速し、その車が安全に走行車線に戻れるようにスペースを空ける。
    D: 路肩に移動して完全に停止する。
  answer: C
  explanation: 他の運転手が十分なスペースがないのに追い越しをするなどのミスをした場合、減速して追い越し車が安全に走行車線に戻れるようにスペースを空け、防衛的に対処するべきです。
- id: 683
  category: safe_driving_rules
  question: 基本的な運転において推奨される手の位置はどれですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置
    C: 8時と4時の位置
    D: 11時と1時の位置
  answer: B
  explanation: マニュアルでは、基本的な運転姿勢として、左手を9時の位置、右手を3時の位置に置くことが推奨されています。
- id: 684
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）が装備されていない車両で、緊急時や滑りやすい路面で急ブレーキをかけるとどうなりますか？
  choices:
    A: 車輪はロックされず、車は安定した状態を保つ。
    B: 衝突を避けるために車が自動的に加速する。
    C: すべての車輪がロックされ、車がスリップし始め、ハンドル操作ができなくなる。
    D: 手動で行うよりもはるかに速く、ブレーキが電子的にポンピングされる。
  answer: C
  explanation: ABSが装備されていない場合、緊急時や滑りやすい路面ではすべての車輪がロックされ、車がスリップし始めてハンドル操作ができなくなります。
- id: 685
  category: defensive_driving
  question: 車両にABSが装備されていない場合、ブレーキをかけながら急な方向転換をするにはどうしなければなりませんか？
  choices:
    A: ハンドルを切りながらブレーキペダルを強く踏み続ける。
    B: ブレーキペダルから足を離し、それからハンドルを切る。
    C: ハンドルを急に切りながら、ブレーキを素早くポンピングする。
    D: ハンドルを急に切りながら加速する。
  answer: B
  explanation: ABSが装備されていない場合、ブレーキをかけている最中に急な方向転換をするには、一度ブレーキペダルから足を離してからハンドルを切る必要があります。
- id: 686
  category: defensive_driving
  question: 衝突を避けるために加速することが最善、または必要となるのはどのような場合ですか？
  choices:
    A: 鹿の横断注意の標識に近づいているとき。
    B: 他の車が横や後ろから衝突しそうで、前方にスペースがあるとき。
    C: スクールゾーンを走行中で、後続車が車間距離を詰めてきているとき。
    D: ABSなしで急カーブに近づいているとき。
  answer: B
  explanation: 他の車が横や後ろから衝突しそうで、自車の前方に危険を回避するためのスペースがある場合は、衝突を避けるために加速することが最善の策となることがあります。
- id: 687
  category: safe_driving_rules
  question: 鹿と車の衝突事故が最も多くなる季節はいつですか？
  choices:
    A: 春
    B: 夏
    C: 秋
    D: 冬
  answer: C
  explanation: 秋は交尾期と狩猟期が重なり、鹿がより活発に行動するため、鹿と車の衝突事故が最も多くなる季節です。
- id: 688
  category: defensive_driving
  question: 道路上の鹿に向かってヘッドライトを点滅させるのを避けるべきなのはなぜですか？
  choices:
    A: 鹿が車に向かって突進してくる原因になるため。
    B: 鹿はヘッドライトを凝視する傾向があるため、点滅させると道路上で立ちすくんでしまう可能性があるため。
    C: 対向車の運転手の目を一時的に眩ませてしまうため。
    D: 鹿が予測不能な動きで対向車線に飛び出す原因になるため。
  answer: B
  explanation: 鹿はヘッドライトを凝視する傾向があるため、点滅させると道路上で立ちすくんでしまう可能性があるからです。
- id: 689
  category: defensive_driving
  question: 動物との衝突が避けられないと思われる場合、どうするべきですか？
  choices:
    A: 動物を避けるために左右に急ハンドルを切る。
    B: 衝突時間を最小限にするために加速する。
    C: 急ハンドルを切らずに車をコントロールし、車道内にとどまる。
    D: ブレーキを素早くポンピングし、ハンドルを急に切る。
  answer: C
  explanation: 衝突が避けられないと思われる場合、動物を避けるために急ハンドルを切ってはいけません。そうすることで、あなた自身が負傷するリスクが高まる可能性があります。車をコントロールし、車道内にとどまってください。
- id: 690
  category: vehicle_information
  question: 実際の緊急事態において、アンチロック・ブレーキ・システム（ABS）を使用する際の正しいブレーキ操作はどれですか？
  choices:
    A: ブレーキペダルを素早くポンピングする。
    B: 他の運転手に警告するためにブレーキを軽く叩く。
    C: ペダルが振動しても、強く踏み込んでそのまま保持する。
    D: ペダルの振動を感じたら、少しブレーキを緩める。
  answer: C
  explanation: マニュアルでは、ABS搭載車の運転手に対し「強く踏み込むこと。ブレーキペダルを強く踏み、そのまま保持すること」と指示しています。ペダルが振動しても、力を緩めてはいけません。
- id: 691
  category: vehicle_information
  question: ABS（アンチロック・ブレーキ・システム）搭載車で、ブレーキペダルを絶対にポンピング（小刻みに踏むこと）してはいけないのはなぜですか？
  choices:
    A: ブレーキをポンピングするとエンジンがエンストする原因になるため。
    B: ABSシステムがすでに、手動で行うよりもはるかに速く電子的にブレーキをポンピングしているため。
    C: ハンドルがロックする原因になるため。
    D: 車両のエアバッグが無効になるため。
  answer: B
  explanation: ABS搭載車のブレーキペダルを絶対にポンピングしてはいけません。ブレーキを踏んだ時の振動は、ABSシステムが手動で行うよりもはるかに速く電子的にブレーキを「ポンピング」しているためです。
- id: 692
  category: safe_driving_rules
  question: 運転時に考慮しなければならない、道路交通システムの3つの主要な構成要素は何ですか？
  choices:
    A: 運転者、車両、道路
    B: 天候、交通量、速度
    C: 視覚、聴覚、反射神経
    D: 標識、信号、路面標示
  answer: A
  explanation: 運転時に考慮しなければならない道路交通システムの3つの主要な構成要素は、1. 運転者、2. 車両、3. 道路です。
- id: 693
  category: driver_responsibility
  question: 交通事故の最も一般的な原因は何ですか？
  choices:
    A: 悪天候
    B: 機械的故障
    C: ヒューマンエラー（人為的ミス）
    D: 整備不良の道路
  answer: C
  explanation: マニュアルには、ヒューマンエラー（人為的ミス）が交通事故の最も一般的な原因であると記載されています。
- id: 694
  category: driver_responsibility
  question: マニュアルによると、交通事故の主な要因の1つは次のうちどれですか？
  choices:
    A: ラジオをつけたままの運転
    B: 速度超過
    C: 夜間のハイビームの使用
    D: 古い車両の運転
  answer: B
  explanation: 事故の主な要因は、速度超過、集中力の欠如、および不適切な回避行動です。
- id: 695
  category: alcohol_drugs_health
  question: 次のうち、安全な運転を妨げる可能性のある一時的な状態はどれですか？
  choices:
    A: 怒り、心配、疲労
    B: 日中のサングラスの着用
    C: 後部座席に同乗者がいること
    D: ABS搭載車の運転
  answer: A
  explanation: 怒り、心配、フラストレーション、疲労、および風邪などの軽い病気は、安全な運転を妨げる可能性のある一時的な状態の例です。
- id: 696
  category: safe_driving_rules
  question: 運転者がサイドミラーを使用し、時々横をちらりと見なければならないのはなぜですか？
  choices:
    A: 周辺視覚だけでは横にあるものに焦点を合わせることができないため。
    B: 後部ドアがしっかりと閉まっているか確認するため。
    C: 対向車線の車両の速度を監視するため。
    D: 対向車のヘッドライトを直視するのを避けるため。
  answer: A
  explanation: 横にあるものには焦点を合わせることができないため、サイドミラーを使用し、必要に応じて時々横をちらりと見る必要があります。
- id: 697
  category: driver_responsibility
  question: シカや家畜などの大きな動物をはねてしまった場合、どうすればよいですか？
  choices:
    A: 自分で動物を道路から移動させる。
    B: 警察に事故を報告する。
    C: 車が運転可能であれば、すぐに現場を離れる。
    D: 飼い主が到着するまで動物のそばで待つ。
  answer: B
  explanation: シカや家畜などの大きな動物が関与する事故を起こした場合は、警察に報告する必要があります。
- id: 698
  category: license_system
  question: 運転免許証の制限コード01（Restriction Code 01）は何を示していますか？
  choices:
    A: 日中のみ運転が許可されている。
    B: 常に免許を持った大人が同乗していなければならない。
    C: 運転中は常に視力矯正レンズ（メガネやコンタクトレンズ）を着用しなければならない。
    D: 州間高速道路での運転が制限されている。
  answer: C
  explanation: マニュアルには、運転免許証に視力矯正レンズの着用が義務付けられている（制限コード01）と記載されている場合、運転中は常に着用しなければならないと記されています。
- id: 699
  category: safe_driving_rules
  question: 夜間に色の濃いサングラスや色付きのコンタクトレンズの使用を避けるべきなのはなぜですか？
  choices:
    A: 対向車のヘッドライトのまぶしさを増幅させるため。
    B: はっきりと見るために必要な光を遮ってしまうため。
    C: 目がはるかに早く疲労する原因になるため。
    D: テネシー州では運転中の着用が違法であるため。
  answer: B
  explanation: マニュアルでは、はっきりと見るために必要な光を遮ってしまうため、夜間に色の濃いサングラスや色付きのコンタクトレンズの使用を避けるよう推奨しています。
- id: 700
  category: driver_responsibility
  question: 聴覚障害のある運転者は、道路上で安全を保つためにどのように補うことができますか？
  choices:
    A: 視覚により多く頼ることで補う。
    B: 制限速度よりも遅い速度で運転することで補う。
    C: 常に窓を開けたままにすることで補う。
    D: 車両により大きな音のクラクションを取り付けることで補う。
  answer: A
  explanation: マニュアルによると、聴覚障害のある運転者は、安全な運転者であるために視覚により多く頼ることで調整し、補うことができます。
- id: 701
  category: defensive_driving
  question: 長距離ドライブでの疲労を避けるために推奨されるアドバイスは、次のうちどれですか？
  choices:
    A: 出発前に食事をたくさんとる。
    B: 1時間ごと、または必要に応じてそれ以上の頻度で停車し、休憩をとる。
    C: 交通量の少ない深夜に運転する。
    D: 眠気を覚ますために市販薬を服用する。
  answer: B
  explanation: 疲労を避けるため、マニュアルでは1時間ごと、または必要に応じてそれ以上の頻度で停車し、歩き回ったり新鮮な空気を吸ったりして休憩をとることを推奨しています。
- id: 702
  category: alcohol_drugs_health
  question: テネシー州では、てんかんのある人は、医師の治療を受けており、発作のない状態が最低どれくらいの期間続いていれば運転できますか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 1年
    D: 2年
  answer: B
  explanation: マニュアルには、テネシー州では医師の治療を受けており、発作のない状態が最低6ヶ月間続いていれば運転できると記載されています。
- id: 703
  category: alcohol_drugs_health
  question: 糖尿病のドライバーが定期的に目の検査を受けるべきなのはなぜですか？
  choices:
    A: インスリンによって目がまぶしさに過敏になるため。
    B: 免許証に制限コード01を追加する必要がないことを確認するため。
    C: 糖尿病によって運転中に目が乾きやすくなるため。
    D: 夜盲症やその他の視覚障害の可能性を確認するため。
  answer: D
  explanation: マニュアルには、糖尿病がある場合、夜盲症やその他の視覚障害の可能性を確認するために、定期的に目の検査を受けるべきであると記されています。
- id: 704
  category: driver_responsibility
  question: もしあなたが短気な性格である場合、危険な運転行為を避けるために何をすべきですか？
  choices:
    A: 集中力を保つためにテンポの速い音楽を聴く。
    B: 渋滞を避けるために制限速度を少し超えて運転する。
    C: 常に運転の予定に余裕を持たせる。
    D: 混雑していない時間帯にのみ運転する。
  answer: C
  explanation: マニュアルでは、短気な性格の人は、スピード違反やその他の危険な行為を避けるために、常に運転の予定に余裕を持たせるべきだとアドバイスしています。
- id: 705
  category: vehicle_information
  question: ブレーキシステムを整備士に点検してもらう必要がある兆候は、次のうちどれですか？
  choices:
    A: ブレーキペダルが硬く、踏みごたえがある。
    B: 片側に寄ることなく、車がスムーズに停止する。
    C: ブレーキペダルが床まで沈み込む。
    D: ブレーキをかけたときに完全に無音である。
  answer: C
  explanation: マニュアルでは、大きな異音がする、異臭がする、またはブレーキペダルが床まで沈み込むなど、ブレーキが正常に機能していない場合は非常に危険であると警告しています。
- id: 706
  category: vehicle_information
  question: 車のバッテリーは、どのような天候でより早く消耗する傾向がありますか？
  choices:
    A: 暑くて乾燥した天候
    B: 寒くて湿気の多い天候
    C: 湿度が高く晴れた天候
    D: 標高の高い環境
  answer: B
  explanation: 車両メンテナンスのセクションによると、車のバッテリーは寒くて湿気の多い天候でより早く消耗する傾向があります。
- id: 707
  category: vehicle_information
  question: 車のガラスの内側に膜（汚れ）が付着する一般的な原因は何ですか？
  choices:
    A: ヒーターやデフロスターを頻繁に使用すること。
    B: 凍結防止用のウォッシャー液を使用すること。
    C: 車内で喫煙すること。
    D: 雨の日に窓を開けたままにすること。
  answer: C
  explanation: マニュアルには、特に車を使用する人が喫煙する場合、喫煙によってガラスの内側に膜が付着するため、窓の内側を清潔に保つように記載されています。
- id: 708
  category: vehicle_information
  question: バランスの崩れたタイヤや空気圧の低いタイヤで運転すると、どのような結果を招きますか？
  choices:
    A: 燃費と乗り心地が向上する。
    B: 濡れた路面でのハンドリングが容易になる。
    C: ハイドロプレーニング現象の可能性が低くなる。
    D: タイヤの摩耗が早まり、燃費が悪化する。
  answer: D
  explanation: マニュアルでは、バランスの崩れたタイヤや低い空気圧は、タイヤの摩耗を早め、燃費を悪化させ、車のハンドル操作や停止を困難にすると説明しています。
- id: 709
  category: vehicle_information
  question: ペニー硬貨を使ってタイヤの溝（トレッド）を確認する際、溝が少なくともどこに達していなければ、そのタイヤは違法かつ安全ではないと見なされますか？
  choices:
    A: リンカーン記念堂の頂上
    B: リンカーンの頭（2/32インチ）
    C: ペニー硬貨に印字された日付
    D: 「In God We Trust」の文字
  answer: B
  explanation: マニュアルには、ペニー硬貨を頭から溝に差し込んだとき、溝が少なくともリンカーンの頭（2/32インチ）に達していない場合、そのタイヤは違法であり安全ではないと記載されています。
- id: 710
  category: vehicle_information
  question: 多くの新しい車において、車両の推奨タイヤ空気圧は通常どこで確認できますか？
  choices:
    A: ステアリングコラム（ハンドルの軸）の上。
    B: 運転席側のフロントドアの枠（ドアジャム）にあるステッカー。
    C: グローブボックスのドアの内側。
    D: 車両のリアバンパーの上。
  answer: B
  explanation: マニュアルには、多くの新しい車では、車両の推奨タイヤ空気圧はドアの枠（通常は運転席側のフロントドア）にあるステッカーに記載されていると記されています。
- id: 711
  category: driver_responsibility
  question: マニュアルでは、眼科医による視力検査をどのくらいの頻度で受けることを推奨していますか？
  choices:
    A: 半年ごと
    B: 1〜2年ごと
    C: 5年ごと
    D: 運転免許証の更新時のみ
  answer: B
  explanation: 安全運転において良好な視力は非常に重要であるため、マニュアルでは1〜2年ごとに眼科医による視力検査を受けることを推奨しています。
- id: 712
  category: vehicle_information
  question: 車両の純正タイヤの推奨空気圧は、通常どこに記載されていますか？
  choices:
    A: タイヤ自体に直接印字されている
    B: 運転席側のフロントドアの開口部（ドアジャム）のステッカー
    C: ステアリングコラムの上
    D: エンジンブロックに刻印されている
  answer: B
  explanation: 多くの新しい車では、車両の推奨タイヤ空気圧はドアの開口部（通常は運転席側のフロントドア）にあるステッカーに記載されています。
- id: 713
  category: vehicle_information
  question: タイヤ自体に印字されている空気圧を使用してはいけないのはなぜですか？
  choices:
    A: 安全に運転するために必要な最低空気圧だから。
    B: 冬の運転条件にのみ適用されるから。
    C: それは推奨される最大空気圧であり、車両の仕様と一致しない可能性があるから。
    D: 異なるサイズの社外タイヤ専用だから。
  answer: C
  explanation: マニュアルには次のように記載されています。「タイヤ自体に印字されているタイヤ空気圧（psi）を使用しないでください。これはタイヤの推奨最大空気圧であり、車両メーカーの仕様と一致しない場合があります。」
- id: 714
  category: safe_driving_rules
  question: 走行中に車のイグニッションを「ロック（lock）」の位置に回すとどうなりますか？
  choices:
    A: ブレーキが即座にかかる。
    B: ハンドルがロックされ、車のコントロールを失う。
    C: エンジンが急速にオーバーヒートする。
    D: 車は安全に惰性で停止する。
  answer: B
  explanation: 走行中に車のイグニッションを絶対に「ロック」の位置に回さないでください。ハンドルがロックされ、車のコントロールを失う原因となります。
- id: 715
  category: vehicle_information
  question: 段差を越えた後や停止した後に車がバウンドし続ける場合、整備士に点検してもらう必要がある可能性が高いのはどのシステムですか？
  choices:
    A: 排気システム
    B: ステアリングシステム
    C: エンジン冷却システム
    D: サスペンションシステム
  answer: D
  explanation: 段差を越えた後や停止した後に車がバウンドし続けたり、コントロールが難しかったりする場合は、新しいショックアブソーバーやその他のサスペンション部品が必要になる可能性があります。
- id: 716
  category: vehicle_information
  question: 車の排気漏れの可能性があることを示す危険な警告サインは何ですか？
  choices:
    A: ハンドルを回すのが難しくなる。
    B: 運転中や乗車中に、あなたや同乗者が眠気を感じる。
    C: 停止した後に車が過度にバウンドする。
    D: エンジンの水温計が急激に下がる。
  answer: B
  explanation: 運転中や乗車中に、あなたや同乗者が眠気を感じやすくなったと気づいた場合、直ちに修理が必要な排気漏れが発生している可能性があります。
- id: 717
  category: safe_driving_rules
  question: エンジンをかけたまま（アイドリング状態で）長時間車内に座っている場合、どうするべきですか？
  choices:
    A: イグニッションを「ロック」の位置に回す。
    B: ラジエーターの冷却水レベルを確認する。
    C: 窓を開けて新鮮な空気を入れる。
    D: 眠気を防ぐために定期的にクラクションを鳴らす。
  answer: C
  explanation: エンジンをかけたまま（アイドリング状態で）長時間車内に座っている場合は、車内の人が一酸化炭素中毒になるのを防ぐため、窓を開けて新鮮な空気を入れてください。
- id: 718
  category: vehicle_information
  question: ラジエーターの不凍液/冷却水レベルを安全に確認できる唯一のタイミングはいつですか？
  choices:
    A: 車を運転した直後
    B: エンジンが作動している間
    C: 車が坂道に駐車されている時
    D: 車が冷えている時
  answer: D
  explanation: ラジエーターの点検は、運転直後ではなく、必ず車が冷えている時にのみ行うよう注意してください。
- id: 719
  category: defensive_driving
  question: 車の床に固定されていない物を置くことが危険なのはなぜですか？
  choices:
    A: ブレーキペダルの下に転がり込み、車を停止できなくなる可能性があるから。
    B: サスペンションシステムがバウンドする原因になるから。
    C: 排気漏れを引き起こす可能性があるから。
    D: 車のバッテリーを消耗させるから。
  answer: A
  explanation: ブレーキペダルの下に転がり込み、車の停止を妨げる可能性のある物が床にないことを確認してください。
- id: 720
  category: safe_driving_rules
  question: マニュアルによると、車のクラクションの唯一の適切な使用目的は何ですか？
  choices:
    A: 道路上で友人に挨拶するため
    B: 遅い運転手にスピードを上げるよう促すため
    C: 他の車や人への警告として
    D: 駐車していることを知らせるため
  answer: C
  explanation: クラクションは安全にとって重要ではないように思えるかもしれませんが、警告装置として命を救う可能性があります。クラクションは他の車や人への警告としてのみ使用してください。
- id: 721
  category: safe_driving_rules
  question: かなり長距離のドライブに出発する前には、車にどれくらいのガソリンが入っていることを確認すべきですか？
  choices:
    A: 少なくともタンクの4分の1
    B: 少なくともタンクの半分
    C: 完全に満タン
    D: 最寄りのガソリンスタンドに到着できるだけの量
  answer: B
  explanation: かなり長距離のドライブに出発する前には、常に少なくともタンクの半分のガソリンが入っていることを確認してください。
- id: 722
  category: defensive_driving
  question: マニュアルによると、複数の車両が絡む衝突事故はどのような場合に頻繁に発生しますか？
  choices:
    A: 運転手がクラクションを頻繁に鳴らしすぎる場合。
    B: 運転手が他の交通よりも速く、または遅く走行する場合。
    C: 車両に社外品のタイヤが装着されている場合。
    D: 運転手がタイヤの空気圧を頻繁に確認しすぎる場合。
  answer: B
  explanation: 同じ方向に同じ速度で移動している車両同士が衝突することはありません。複数の車両が絡む衝突事故は、運転手が他の交通よりも速く、または遅く走行する場合に頻繁に発生します。
- id: 723
  category: defensive_driving
  question: ショッピングセンター、駐車場、繁華街では、なぜ速度を落として注意を払う必要があるのですか？
  choices:
    A: これらのエリアの制限速度は常に15 mphだから。
    B: これらのエリアには常にランブルストリップス（減速帯）があるから。
    C: 車や人が急に、かつ不規則に停止、発進、さまざまな方向へ移動しているから。
    D: これらのエリアは一酸化炭素濃度が高いから。
  answer: C
  explanation: ショッピングセンター、駐車場、繁華街は混雑したエリアであり、車や人が急に、かつ不規則に停止、発進、さまざまな方向へ移動しているためです。
- id: 724
  category: safe_driving_rules
  question: 一部の踏切を通過する際に速度を落とす必要があるのはなぜですか？
  choices:
    A: タイヤの空気圧を確認するため。
    B: 一部の踏切は路面がでこぼこしているため。
    C: メーカーの仕様書を読むため。
    D: 排気システムを冷却するため。
  answer: B
  explanation: 踏切では、電車が来ていないこと、そして渡り切るためのスペースがあることを確認する必要があります。一部の踏切は路面がでこぼこしているため、安全に通過するには速度を落とす必要があります。
- id: 725
  category: sharing_the_road
  question: 州法により、歩行者とみなされるのは誰ですか？
  choices:
    A: 徒歩で歩いている人のみ。
    B: 徒歩の人、または電動・手動の車椅子を使用しているすべての人。
    C: 自転車または原動機付自転車に乗っているすべての人。
    D: 子供と高齢者のみ。
  answer: B
  explanation: 州法により、徒歩の人、または電動・手動の車椅子を使用しているすべての人が歩行者とみなされます。
- id: 726
  category: sharing_the_road
  question: 自動車と歩行者の衝突事故で最も頻繁に被害者となるのは、どのグループの歩行者ですか？
  choices:
    A: 10代の若者と若い成人。
    B: ジョギングやランニングをしている人。
    C: 大人数で歩いている歩行者。
    D: 子供、高齢者、障害のある人、および酒に酔った歩行者。
  answer: D
  explanation: 子供、高齢者、障害のある人、および酒に酔った歩行者には特に注意を払う必要があります。彼らは自動車と歩行者の衝突事故で最も頻繁に被害者となります。
- id: 727
  category: safe_driving_rules
  question: 横断歩道に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 横断歩道は白線が引かれている場所にのみ存在する。
    B: 歩行者は標示のある横断歩道でのみ優先権を持つ。
    C: 白線で横断場所が示されていなくても、すべての交差点に横断歩道が存在する。
    D: 右折待ちの場合、運転手は横断歩道を塞いでもよい。
  answer: C
  explanation: マニュアルによると、白線や境界線で横断場所が示されていなくても、すべての交差点に横断歩道が存在します。
- id: 728
  category: defensive_driving
  question: 運転手が車両の一部を横断歩道にはみ出して停止するのを避けるべきなのはなぜですか？
  choices:
    A: 信号無視監視カメラを作動させてしまうから。
    B: 歩行者が車両を迂回しなければならなくなり、危険な状況に陥るから。
    C: 車両のタイヤを過度に摩耗させるから。
    D: 他の運転手から信号機が見えなくなるから。
  answer: B
  explanation: 横断歩道を塞ぐと、歩行者が車両を迂回しなければならなくなり、危険な状況に陥ります。
- id: 729
  category: safe_driving_rules
  question: 標示のあるスクールゾーンで警告点滅灯が作動しており、歩行者が横断している場合、運転手は何をしなければなりませんか？
  choices:
    A: 15 mphに減速し、注意して進む。
    B: クラクションを鳴らして歩行者に警告する。
    C: 停止して優先権を譲り、歩行者が車道を渡り切るまで待つ。
    D: 歩行者を避けるために隣の車線に進路変更する。
  answer: C
  explanation: 標示のあるスクールゾーンで警告点滅灯が作動している場合、運転手は停止して優先権を譲り、歩行者が車道を渡り切るまで停止したままでいなければなりません。
- id: 730
  category: sharing_the_road
  question: 盲導犬を連れている、またはどのような種類の杖を持っている視覚障害のある歩行者に対して、常に優先権を譲らなければなりませんか？
  choices:
    A: 全体が黒色の杖。
    B: 白色、金属製、または先端が赤色の白い杖。
    C: 木製の歩行用ステッキ。
    D: 黄色の反射材付きの杖。
  answer: B
  explanation: 運転手は、白色、金属製、先端が赤色の白い杖を持っている、または盲導犬を連れている視覚障害のある歩行者に対して、常に優先権を譲らなければなりません。
- id: 731
  category: safe_driving_rules
  question: 歩道がない場合、歩行者はどこを歩くべきですか？
  choices:
    A: 車両と同じ進行方向の道路の右側。
    B: 道路の中央。
    C: 車両の進行方向に向かって道路の左側（対面通行）。
    D: 車両と同じ進行方向の路肩。
  answer: C
  explanation: 歩道がない場合、歩行者は突然の危険が迫ってくるのを確認できるように、常に車両の進行方向に向かって道路の左側を歩く必要があります。
- id: 732
  category: safe_driving_rules
  question: 歩道のない道路を2人以上の歩行者が歩く場合、どのように歩くべきですか？
  choices:
    A: 視認性を高めるために並んで歩く。
    B: 1列に並んで歩く。
    C: 車線をまたいで手をつないで歩く。
    D: 1人は道路の左側、もう1人は右側を歩く。
  answer: B
  explanation: マニュアルには、2人以上の歩行者が道路を歩くときは1列に並んで歩き、決して並んで歩いてはいけないと記載されています。
- id: 733
  category: sharing_the_road
  question: 歩行者が街角に立つ際、安全な距離を保つことが重要なのはなぜですか？
  choices:
    A: 水たまりからの水はねを避けるため。
    B: トラックやバスは大きく右折するため、時折歩道の角に乗り上げることがあるため。
    C: 自転車が歩道を走るスペースを確保するため。
    D: 車が高速で赤信号を無視することがよくあるため。
  answer: B
  explanation: トラックやバスは大きく右折するため、時折歩道の角に乗り上げることがあります。そのため、歩行者は注意を払い、後ろに下がることが重要です。
- id: 734
  category: signs_and_signals
  question: 道路の真ん中にいるときに「DON'T WALK（歩くな）」の信号が点滅し始めた場合、どうするべきですか？
  choices:
    A: すぐに立ち止まり、次の「WALK（歩け）」の信号を待つ。
    B: 振り返って、渡り始めた歩道に走って戻る。
    C: そのまま歩き続けて横断を完了する。
    D: 車の通行が途切れるまで中央分離帯に立つ。
  answer: C
  explanation: 道路の真ん中にいるときに「DON'T WALK（歩くな）」の信号が点滅し始めた場合は、そのまま歩き続けてください。横断を完了する時間は十分にあります。
- id: 735
  category: signs_and_signals
  question: 「WALK（歩け）」の信号や青信号は、歩行者にとって何を意味しますか？
  choices:
    A: 見なくても横断するのが完全に安全である。
    B: すべての対向車が確実に停止する。
    C: 横断する順番が来たことを意味するが、それでも周囲を確認し、安全な場合のみ進まなければならない。
    D: できるだけ早く交差点を走って渡らなければならない。
  answer: C
  explanation: 「WALK（歩け）」の信号や青信号は、横断する順番が来たことを示していますが、横断するのが「安全」であることを意味するわけではありません。周囲を「確認」し、安全である「場合のみ」進むことを意味します。
- id: 736
  category: driver_responsibility
  question: 運転手として法的な優先権を持っていたとしても、車の前にいる歩行者に対して絶対にやってはいけないことは何ですか？
  choices:
    A: 横断するのを辛抱強く待つ。
    B: クラクションを鳴らしたりエンジンを吹かしたりして、急かしたり怖がらせたりする。
    C: アイコンタクトをとる。
    D: 優先権を譲る。
  answer: B
  explanation: たとえ法的な優先権を持っていたとしても、クラクションを鳴らしたり、エンジンを吹かしたり、車の前にいる歩行者を急かしたり怖がらせたりするような行為はしないでください。
- id: 737
  category: safe_driving_rules
  question: 歩行者が道路を横断し始める前に推奨される確認手順は何ですか？
  choices:
    A: 右・左・右を見る。
    B: まっすぐ前だけを見る。
    C: 左・右・左を見て、肩越しに曲がってくる車がいないか確認する。
    D: 信号機を見上げてすぐに進む。
  answer: C
  explanation: 横断する前に歩道の縁石で立ち止まり、左・右・左を確認します。安全であれば横断を始め、肩越しに曲がってくる車がいないか確認してください。
- id: 738
  category: sharing_the_road
  question: トラックが後退しているとき、歩行者がその真後ろを絶対に歩いてはいけないのはなぜですか？
  choices:
    A: トラックの排気ガスが有毒だから。
    B: トラックの運転手はトラックの真後ろを見ることができず、あなたに重傷を負わせる可能性があるから。
    C: トラックが積荷を落とすかもしれないから。
    D: 商用車の後ろを歩くことは違法だから。
  answer: B
  explanation: トラックが後退しているときは、絶対にその後ろを歩かないでください。トラックの運転手は大きな死角のためにトラックの真後ろを見ることができず、あなたに重傷を負わせる可能性があります。
- id: 739
  category: sharing_the_road
  question: 私道、路地、または駐車場に出入りする際、進行方向が歩道を横切る場合、運転手は何をしなければなりませんか？
  choices:
    A: クラクションを鳴らして歩行者に止まるよう警告する。
    B: 歩道を歩いている歩行者に道を譲る。
    C: 歩道を塞がないように素早く進む。
    D: ヘッドライトを点滅させて優先権を得る。
  answer: B
  explanation: 運転手は、私道、公共駐車場、路地、または駐車場に出入りする際、進行方向が歩道を横切る場合は、歩道を歩いている歩行者に道を譲らなければなりません。
- id: 740
  category: safe_driving_rules
  question: 夜間、歩行者が運転手から見えやすくするための最も安全な方法は何ですか？
  choices:
    A: 横断歩道のみを歩く。
    B: まぶしさを軽減するために暗い色の服を着る。
    C: 懐中電灯を持ち、明るい色または反射材のついた服を着る。
    D: 道路の右側を歩く。
  answer: C
  explanation: 明るい色や反射材のついた服を着て、懐中電灯を持つことが、夜間に見えやすくするための最も安全な方法です。
- id: 741
  category: sharing_the_road
  question: 車両と自転車の衝突の最も一般的な原因は何ですか？
  choices:
    A: 自転車が一時停止標識や赤信号を無視すること。
    B: 対向する自転車の前で左折する、または自転車の進路を横切って右折するドライバー。
    C: 自転車が交通の流れに逆らって走行すること。
    D: 複数車線の幹線道路で、ドライバーが自転車を追い越す際に近づきすぎること。
  answer: B
  explanation: 衝突の最も一般的な原因は、ドライバーが対向する自転車の前で左折したり、自転車の進路を横切って右折したりすることです。
- id: 742
  category: sharing_the_road
  question: あなたの車が自転車と同じ左折車線にいる場合、どうするべきですか？
  choices:
    A: クラクションを鳴らして道を譲らせる。
    B: 曲がる前に右側から追い越す。
    C: 自転車が安全に曲がり終えるまで後ろで待機する。
    D: 横に並んで同時に曲がる。
  answer: C
  explanation: あなたの車が自転車と同じ左折車線にいる場合は、自転車が安全に曲がり終えるまで後ろで待機してください。
- id: 743
  category: sharing_the_road
  question: 自転車の走行が禁止されているのはどこですか？
  choices:
    A: 片側1車線（合計2車線）の田舎道。
    B: 制限速度が時速35マイル（35 mph）を超える市街地の道路。
    C: アクセス制限のある幹線道路（自動車専用道路）、高速道路、および特定の標識がある道路。
    D: 指定された自転車専用レーン。
  answer: C
  explanation: 自転車は、アクセス制限のある幹線道路（自動車専用道路）、高速道路、および特定の標識がある道路での走行が禁止されています。
- id: 744
  category: sharing_the_road
  question: テネシー州では、同じ方向に進む自転車を追い越す際、ドライバーは最低限どれだけの距離を空けなければなりませんか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 5フィート
  answer: B
  explanation: 同じ方向に進む自転車を追い越す際は、ゆっくりと行い、車と自転車の間に少なくとも3フィート以上の距離を空けてください。これはテネシー州の法律です！
- id: 745
  category: safe_driving_rules
  question: 狭い道路で自転車を追い越そうとしているとき、自転車の運転手があなたの接近に気づいていないと思われる場合、どうするべきですか？
  choices:
    A: クラクションを大きく鳴らして確実に聞こえるようにする。
    B: 合図としてクラクションを軽く短く鳴らす。
    C: エンジンを大きく吹かす。
    D: 気づかせるためにできるだけ近づいて追い越す。
  answer: B
  explanation: 狭い道路で自転車を追い越そうとしているとき、自転車の運転手があなたの接近に気づいていないと思われる場合は、追い越す合図としてクラクションを軽く短く鳴らしてください。
- id: 746
  category: sharing_the_road
  question: 自転車が左折を示すための正しい手信号（ハンドシグナル）は何ですか？
  choices:
    A: 左腕を横に出し、肘を90度に曲げて手を上に向ける。
    B: 左腕または右腕を横に出し、肘を90度に曲げて手を下に向ける。
    C: 左腕を横にまっすぐ伸ばしてすべての指を伸ばすか、人差し指で左を指す。
    D: 右腕をまっすぐ伸ばし、手のひらを後ろに向ける。
  answer: C
  explanation: 左折：左腕を横にまっすぐ伸ばしてすべての指を伸ばすか、人差し指で左を指します。
- id: 747
  category: sharing_the_road
  question: 自転車が停止または減速することを示すには、どのように合図しますか？
  choices:
    A: 左腕を横にまっすぐ伸ばし、すべての指を伸ばす。
    B: 左腕を横に出し、肘を90度に曲げて手を上に向ける。
    C: 右腕をまっすぐ伸ばし、すべての指を伸ばす。
    D: 左腕または右腕を横に出し、肘を90度に曲げて手を下に向ける。
  answer: D
  explanation: 停止または減速：左腕または右腕を横に出し、肘の関節で90度に曲げ、手を下に向けて手のひらを後ろに向けます。
- id: 748
  category: sharing_the_road
  question: 自転車が車線を全面的に使用（車線の中央を走行）することが許可されるのはどのような場合ですか？
  choices:
    A: 車両と自転車が安全に車線を共有するには車線が狭すぎる場合。
    B: 住宅街を走行しているときはいつでも。
    C: 3人以上のグループで走行している場合のみ。
    D: 自転車が車線を全面的に使用することは決して許可されない。
  answer: A
  explanation: 自転車が車線を全面的に使用することが許可されるのは… 車両と自転車が安全に車線を共有するには車線が狭すぎる場合です。この場合、自転車に車線全体を使用させるのが最も安全です。
- id: 749
  category: vehicle_information
  question: テネシー州法によると、夜間に使用する自転車にはどのような照明設備が必要ですか？
  choices:
    A: 前方500フィートから見える白色灯、および後方500フィートから見える赤色反射板または赤色灯。
    B: 前方300フィートから見える黄色灯、および後方の白色反射板。
    C: 後方200フィートから見える赤色反射板のみ。
    D: 前方の点滅する白色灯、および後方の点滅する黄色灯。
  answer: A
  explanation: テネシー州法では、夜間に使用する自転車には、前方少なくとも500フィートの距離から見える白色光を発する前照灯と、後方500フィートの距離から見える赤色反射板または赤色光を発するランプのいずれかを装備することが義務付けられています。
- id: 750
  category: sharing_the_road
  question: 駐車している車の横を通過する際、自転車が車線の中央寄りに移動する傾向があるのはなぜですか？
  choices:
    A: 後続車が追い越すのを妨げるため。
    B: それらの車から降りてくる人を怪我させたり、自分が怪我をしたりするのを避けるため。
    C: 車線の中央の方が路面が滑らかだから。
    D: 右折の準備をするため。
  answer: B
  explanation: 自転車が駐車している車の横を通過する際、車から離れて車線の中央寄りに移動する傾向があります。これは、それらの車から降りてくる人を怪我させたり、自分が怪我をしたりするのを避けるためです。
- id: 751
  category: defensive_driving
  question: 夜間、対向してくる自転車に乗っている人を見た場合、ヘッドライトをどのようにすべきですか？
  choices:
    A: はっきりと見えるようにハイビームを使用する。
    B: 自分の存在を知らせるためにクラクションを鳴らし続ける。
    C: ハイビームを使用しない。
    D: 警告するためにハイビームを繰り返し点滅させる（パッシングする）。
  answer: C
  explanation: 夜間、対向してくる自転車に乗っている人を見た場合は、ハイビームを使用しないでください。
- id: 752
  category: sharing_the_road
  question: 自転車が車の流れに逆らって（逆走して）走るのが危険なのはなぜですか？
  choices:
    A: 自転車の走行速度が速くなりすぎるため。
    B: 交通標識や信号機などの交通規制を見落とす原因になる可能性があるため。
    C: 車が逆走している自転車を追い越すことは違法であるため。
    D: 自転車のタイヤが不均等に摩耗する原因になるため。
  answer: B
  explanation: 車の流れに沿って右側（※米国の交通ルール）を走行してください。交通の流れに逆らって走行すると、交通標識や信号機などの交通規制を見落とす原因になる可能性があります。
- id: 753
  category: defensive_driving
  question: 自転車はなぜ大型トラックやバスと縁石の間に潜り込んではいけないのですか？
  choices:
    A: トラックやバスの運転手が道を尋ねてくるかもしれないため。
    B: 縁石付近のゴミで自転車がパンクするかもしれないため。
    C: トラックやバスは右折時に大きく膨らむため、自転車が巻き込まれて押し潰される可能性があるため。
    D: 自転車が歩道を走らざるを得なくなるため。
  answer: C
  explanation: トラックやバスは右折時に大きく膨らみます。トラックやバスと縁石の間に潜り込むと、巻き込まれて押し潰される危険があるため、絶対にやめてください。
- id: 754
  category: sharing_the_road
  question: 大型トラックに関連する「ノーゾーン（No-Zone）」とは何ですか？
  choices:
    A: トラック専用の指定駐車区域。
    B: トラックの運転手から見えない、トラックの前方、後方、および側面の死角。
    C: トラックの走行が禁止されている区域。
    D: 自転車に優先権がある、トラックのすぐ前方のエリア。
  answer: B
  explanation: 大型トラックには前方、後方、側面に死角があり、運転手が周囲を確認することが困難です。これらはノーゾーン（No-Zone）と呼ばれています。
- id: 755
  category: sharing_the_road
  question: 自転車のアンテナに付いている赤またはオレンジ色のペナント（旗）は、運転手に何を示していますか？
  choices:
    A: 乗っているのが子供であること。
    B: 危険物を運搬していること。
    C: 乗っている人に聴覚障害があること。
    D: 乗っている人が初心者であること。
  answer: C
  explanation: 自転車に取り付けられたアンテナに赤またはオレンジ色のペナント（旗）を付けている自転車を見かけたら、減速してください。これは、乗っている人に聴覚障害があることを示す一般的なマークです。
- id: 756
  category: sharing_the_road
  question: 調査によると、自動車とオートバイの衝突事故の3分の2の原因は何ですか？
  choices:
    A: オートバイのスピード違反や乱暴な運転。
    B: 自動車の運転手がオートバイの目の前で曲がること。
    C: 歩行者の違法な横断。
    D: 大型トラックのウインカーを出さない車線変更。
  answer: B
  explanation: 調査によると、自動車とオートバイの衝突事故の3分の2は、オートバイの運転手ではなく、オートバイの目の前で曲がった自動車の運転手によって引き起こされています。
- id: 757
  category: sharing_the_road
  question: 同じ車線でオートバイと並走する場合、どうすべきですか？
  choices:
    A: 交通の流れを良くするために、オートバイと車線を共有する。
    B: 追い越すことを知らせるためにクラクションを鳴らす。
    C: オートバイと車線を共有しようと絶対にしない。
    D: オートバイを車線の端に追いやる。
  answer: C
  explanation: オートバイには車線全体を使用する権利があります。オートバイと車線を共有しようとしてはならず、常に交通におけるオートバイのスペースと位置を尊重しなければなりません。
- id: 758
  category: safe_driving_rules
  question: オートバイの後ろを走行する際、運転手が確保すべき推奨される最小車間距離はどれくらいですか？
  choices:
    A: 1秒
    B: 2秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: 緊急時にオートバイの運転手が操作や停止をするのに十分な時間を確保できるよう、少なくとも2秒の車間距離を空けてください。
- id: 759
  category: sharing_the_road
  question: オートバイを追い越す際、近すぎたり速すぎたりするのを避けるべきなのはなぜですか？
  choices:
    A: オートバイが競争しようとするかもしれないため。
    B: 風圧によってオートバイがコントロールを失う可能性があるため。
    C: オートバイの運転手にエンジンの音が聞こえないかもしれないため。
    D: 複数車線の高速道路でオートバイを追い越すことは違法であるため。
  answer: B
  explanation: 自動車を追い越す時と同じように追い越してください。風圧によってオートバイがコントロールを失う可能性があるため、近すぎたり速すぎたりする追い越しは避けてください。
- id: 760
  category: defensive_driving
  question: 踏切を通過する際、オートバイの運転手はどのような反応を示す可能性がありますか？
  choices:
    A: できるだけ早く通過するためにスピードを上げる。
    B: 完全に停止し、オートバイを押して渡る。
    C: 減速し、場合によってはジグザグに線路を横断する。
    D: 線路を完全に避けるために路肩を走る。
  answer: C
  explanation: 踏切は二輪車にとって特に危険な場所であり、通常、運転手は減速し、場合によってはジグザグに線路を横断することがあります。
- id: 761
  category: sharing_the_road
  question: 金属製または格子状の橋を走行する際、経験豊かなオートバイの運転手はどのような行動をとると予想すべきですか？
  choices:
    A: 橋の上にいる時間を最小限にするため、急加速する。
    B: 橋の路肩に移動する。
    C: 減速し、車線の中央に移動する。
    D: フットペグの上に立ち上がり、蛇行運転する。
  answer: C
  explanation: 金属製や格子状の橋では、車よりもオートバイの方がはるかに大きくふらつきます。経験豊かなオートバイの運転手は、凹凸のある路面に対応するスペースを確保するため、減速して車線の中央に移動します。
- id: 762
  category: vehicle_information
  question: オートバイに乗る際、運転手が着用できる最も重要な装備は何ですか？
  choices:
    A: 革製の手袋
    B: DOT（米国運輸省）承認のヘルメット
    C: 安全靴（つま先に鋼鉄の入ったブーツ）
    D: 反射材付きのジャケット
  answer: B
  explanation: ヘルメットは、オートバイに乗る際に着用できる最も重要な装備です。米国運輸省（DOT）の基準を満たしていないヘルメットには注意してください。
- id: 763
  category: sharing_the_road
  question: 大型トラックの死角、または「ノーゾーン（No-Zones）」はどこにありますか？
  choices:
    A: トラックの真後ろのみ。
    B: トラックの右側のみ。
    C: トラックの前方、後方、および両側面。
    D: トラックの真ん前のみ。
  answer: C
  explanation: トラックには、両側面、前方、および後方に大きなノーゾーン（死角）があります。これらの死角を走行していると、トラックの運転手からはあなたの姿が見えません。
- id: 764
  category: safe_driving_rules
  question: 大型トラックを追い越す際、トラックの前に戻るのが安全なのはいつですか？
  choices:
    A: 自分の車のリアバンパーがトラックのフロントバンパーを通り過ぎた直後。
    B: ルームミラーにトラックの前部が見えたとき。
    C: トラックの運転手がクラクションを鳴らしたとき。
    D: トラックのちょうど車1台分前に出たとき。
  answer: B
  explanation: 追い越しをする際は、トラックの前に戻る前にルームミラーでトラックの前部が見えるか確認し、ブレーキをかけるのは避けてください。
- id: 765
  category: driver_responsibility
  question: 大型トラックと乗用車が絡む衝突事故において、乗用車の乗員が死亡する割合は何パーセントですか？
  choices:
    A: 25パーセント
    B: 50パーセント
    C: 78パーセント
    D: 95パーセント
  answer: C
  explanation: 大型トラックが絡む衝突事故では、乗用車の乗員（通常は運転手）が死亡者の78パーセントを占めます。
- id: 766
  category: defensive_driving
  question: 大型トラックの前方の死角が、オートバイの運転手にとって特に危険なのはなぜですか？
  choices:
    A: オートバイはトラックよりも加速がはるかに遅いため。
    B: オートバイはトラックよりもはるかに早く停止できるため、トラックが間に合わずに追突する可能性があるため。
    C: トラックのヘッドライトがオートバイの運転手の目を眩ませるため。
    D: トラックの排気ガスがオートバイの運転手を圧倒する可能性があるため。
  answer: B
  explanation: 前方の死角は、急停止する必要がある場合に特に危険です。オートバイは軽量でブレーキシステムが優れているため、トラックよりもはるかに早く停止できます。トラックはあなたと同じように早く停止できない場合があります。
- id: 767
  category: sharing_the_road
  question: 自転車に乗っている子供が、運転手にとって特別な問題を引き起こすのはなぜですか？
  choices:
    A: 交通状況を判断する適切な能力がないため。
    B: 常に制限速度を超えて走行するため。
    C: 道路の左側を走行することが義務付けられているため。
    D: 理解しにくい手信号を使用するため。
  answer: A
  explanation: 子供には交通状況を判断する適切な能力がありません。そのため、自転車に乗った子供がいる場合、運転手は不規則な動きや突然の方向転換の可能性に警戒する必要があります。
- id: 768
  category: sharing_the_road
  question: 運転手が道路上のオートバイを見落とすことがよくあるのはなぜですか？
  choices:
    A: オートバイが道路に溶け込む色で塗装されているため。
    B: 運転手は他の乗用車やトラックを探す傾向があり、オートバイは車幅が狭いため見えにくいため。
    C: オートバイは通常、制限速度以下で走行しているため。
    D: オートバイの運転手は日中にヘッドライトを使用する義務がないため。
  answer: B
  explanation: 運転手は他の乗用車やトラックを探す傾向があり、オートバイを探そうとはしません。オートバイは車幅が狭く車体も短いため、見えにくく、運転手がオートバイとの距離や速度を推定するのを難しくしています。
- id: 769
  category: defensive_driving
  question: 夜間、自転車が特に見えにくくなるのはなぜですか？
  choices:
    A: 反射板の使用が許可されていないため。
    B: 夜間は車線の中央のみを走行するため。
    C: 対向車のライトによって、さらに見えにくくなる可能性があるため。
    D: 昼間よりも夜間の方がはるかに速く走行するため。
  answer: C
  explanation: 夜間に走行する自転車は、運転手にとって視認性の問題を引き起こします。対向車のライトによって、夜間はさらに見えにくくなる可能性があります。
- id: 770
  category: sharing_the_road
  question: マニュアルによると、時速55マイル（MPH）で走行しているトラックが停止するまでの距離は、乗用車と比較してどのくらいですか？
  choices:
    A: トラックは乗用車と同じ240フィートで停止する。
    B: トラックが停止するには約300フィートかかる。
    C: トラックが停止するには約450フィート以上かかる。
    D: トラックが停止するには600フィート以上かかる。
  answer: C
  explanation: 時速55マイル（MPH）で走行する乗用車は240フィートで停止できますが、同じ時速55マイルで走行するトラックが停止するには約450フィート以上かかります。
- id: 771
  category: sharing_the_road
  question: 大型トラックの死角に関して覚えておくべき重要な経験則は何ですか？
  choices:
    A: トラックから50フィート以内にいる場合、あなたは死角に入っています。
    B: トラックのミラーに運転手が映っていない場合、運転手からもあなたは見えていません。
    C: トラックの死角は右側にしかありません。
    D: 自分が死角にいることを運転手に知らせるためにクラクションを鳴らします。
  answer: B
  explanation: マニュアルには「トラックのミラーに運転手が映っていない場合、運転手からもあなたは見えていない」と記載されています。
- id: 772
  category: defensive_driving
  question: トラックが曲がろうとしているときに、大型トラックと縁石の間に入り込もうとするのはなぜ危険ですか？
  choices:
    A: トラックが急加速してあなたの車に衝突する可能性があるため。
    B: トラックは安全に右折するために左に大きく膨らむことが多く、危険な「挟み込み（スクイーズ）」が発生するため。
    C: トラックの排気ガスが縁石に向かって排出され、視界を遮る可能性があるため。
    D: いかなる状況でもトラックを右側から追い越すことは違法であるため。
  answer: B
  explanation: トラックの運転手は、安全に右折するために左に大きく膨らむ必要がある場合があります。トラックと縁石の間に割り込むと、「挟み込み」に巻き込まれて衝突する可能性が高くなります。
- id: 773
  category: vehicle_information
  question: 一般的な最大積載状態のトラクター・トレーラー連結車両の重量は、最大でどのくらいになりますか？
  choices:
    A: 40,000ポンド
    B: 60,000ポンド
    C: 80,000ポンド
    D: 100,000ポンド
  answer: C
  explanation: トラクター部分に牽引される積載状態のセミトレーラーが連結された一般的なトラクター・トレーラー連結車両は、最大80,000ポンド（40トン）の重量になることがあります。
- id: 774
  category: defensive_driving
  question: 上り坂でトラックの後ろに停車した場合、どうすべきですか？
  choices:
    A: 車線の右側に寄り、クラクションを鳴らす。
    B: 運転手から見えるように車線の左側に寄り、車間距離を余分に取る。
    C: 後退を防ぐため、トラックのバンパーにできるだけ近づく。
    D: ギアをニュートラルに入れ、パーキングブレーキをかける。
  answer: B
  explanation: 上り坂でトラックの後ろに停車した場合は、運転手から見えるように車線の左側に寄ります。トラックが後退してきた場合に備えて、車の前方に余分なスペースを空けておきます。
- id: 775
  category: sharing_the_road
  question: あなたがトラックを追い越した後、トラックの運転手がヘッドライトを点滅させた場合、それは何を意味しますか？
  choices:
    A: 前方に警察官や危険があることを警告している。
    B: トラックの前に車線変更しても安全であることを合図している。
    C: 車間距離を詰めすぎて追い越したことに怒っている。
    D: ヘッドライトが故障しているため、あなたはスピードを上げるべきである。
  answer: B
  explanation: トラックやバスを追い越した後に運転手がヘッドライトを点滅させた場合、それは彼らの車両の前に車線変更しても安全であるという合図です。
- id: 776
  category: vehicle_information
  question: 大型トラックの後方の死角は、最大でどのくらいまで広がりますか？
  choices:
    A: 最大50フィート
    B: 最大100フィート
    C: 最大150フィート
    D: 最大200フィート
  answer: D
  explanation: トラックの死角は、車両のすぐ前方、両側面、および後方最大200フィートに及びます。
- id: 777
  category: vehicle_information
  question: トラクターのボンネットが長い場合、運転手はバンパーの前方何フィートまで見えない可能性がありますか？
  choices:
    A: 5〜10フィート
    B: 10〜20フィート
    C: 20〜30フィート
    D: 30〜40フィート
  answer: B
  explanation: トラクターのボンネットが長い場合、運転手はバンパーの前方10〜20フィートが見えない可能性があり、これはオートバイや車が気づかれずに危険な位置に入り込むのに十分な広さです。
- id: 778
  category: sharing_the_road
  question: 商用車計量所（ウェイ・ステーション）の近くを運転する際、どうすべきですか？
  choices:
    A: できるだけ早く計量所を通過するためにスピードを上げる。
    B: 低速のトラックが本線に合流しやすくなるよう、右側車線の走行を避ける。
    C: 右側車線に移動し、トラックにぴったりついて走行する。
    D: 合流してくるトラックにハイビームを点滅させ、自分の存在を警告する。
  answer: B
  explanation: 商用車計量所の近くでは、低速のトラックが本線に合流しやすくなるよう、右側車線の走行を避けてください。
- id: 779
  category: safe_driving_rules
  question: 夜間、大型トラックの近くを運転する際にヘッドライトを減光（ロービームに）することが重要なのはなぜですか？
  choices:
    A: 明るいライトは車のバッテリーの消耗を早める可能性があるため。
    B: トラックのミラーに反射した明るいライトが、運転手の目を眩ませる可能性があるため。
    C: トラックの運転手は光に敏感な暗視ゴーグルを使用しているため。
    D: トラックの運転手が道路の白線を見やすくするため。
  answer: B
  explanation: 夜間はライトを減光してください。ミラーに反射した明るいライトは、運転手の目を眩ませる可能性があります。
- id: 780
  category: defensive_driving
  question: 接近してくる大型トラックやバスの速度を過小評価してはならないのはなぜですか？
  choices:
    A: 常に制限速度を超過しているため。
    B: 車体が大きいため、実際の速度よりも遅く走っているように見えることが多いため。
    C: 静かに加速できる特殊なエンジンを搭載しているため。
    D: スピードメーターが最大10 MPH不正確であることが多いため。
  answer: B
  explanation: 接近してくるトラックやバスの大きさと速度を過小評価しないでください。車体が大きいため、実際の速度よりも遅く走っているように見えることがよくあります。
- id: 781
  category: driver_responsibility
  question: マニュアルによると、特に大型トラックとの衝突事故において、命を守るためにできる最も重要なことは何ですか？
  choices:
    A: 衝撃を避けるために溝（ディッチ）に急ハンドルを切る。
    B: シートベルトを着用する。
    C: 衝突前にクラクションを鳴らし続ける。
    D: ハンドルにしっかりと身構える。
  answer: B
  explanation: シートベルトの着用は、特に大型トラックとの衝突事故において、命を守るためにできる最も重要なことです。これにより、ハンドルにぶつかったり、車内で投げ出されたり、車外に放り出されたりするのを防ぐことができます。
- id: 782
  category: sharing_the_road
  question: 下り坂で大型トラックを追い越す際、何を予測すべきですか？
  choices:
    A: エンジンブレーキにより、トラックの速度が落ちる可能性が高い。
    B: トラックはその重量により速度が増すため、追い越すには自車の速度を上げる必要があるかもしれない。
    C: トラックが路肩に寄って道を譲ってくれる。
    D: トラックの運転手が低速を保つためにエマージェンシーブレーキ（パーキングブレーキ）をかける。
  answer: B
  explanation: トラックはその重量のため、下り坂では速度が増します。そのため、下り坂でトラックを追い越すには、自車の速度を上げる必要がある場合があります。
- id: 783
  category: defensive_driving
  question: トラックやバスの真後ろを走るのを避け、適切な車間距離を保つべきなのはなぜですか？
  choices:
    A: 有害な排気ガスを吸い込まないようにするため。
    B: 道路の視界を良くして問題を予測し、緊急時の「逃げ道」を確保するため。
    C: テネシー州では商用車の後ろでスリップストリームを利用すること（ドラフティング）が違法であるため。
    D: トラックのタイヤが跳ね上げた石がフロントガラスに当たるのを防ぐため。
  answer: B
  explanation: 前方を走る大型車両との間には、適切な車間距離を保ってください。これにより、道路の視界が良くなって問題を予測しやすくなり、緊急時の「逃げ道」を確保することができます。
- id: 784
  category: sharing_the_road
  question: 下り坂でトラックを追い越す際、最も安全な行動はどれですか？
  choices:
    A: 追い越す前に減速してトラックの速度に合わせる。
    B: できるだけ早く追い越しを完了させ、速度を維持する。
    C: トラックが加速するのを防ぐため、トラックと並走する。
    D: トラックを追い越した後、すぐにブレーキをかけて速度をコントロールする。
  answer: B
  explanation: トラックはその重量のため、下り坂では速度が増します。できるだけ早く追い越しを完了させ、トラックと並走しないようにし、追い越し後は減速せずに速度を維持する必要があります。
- id: 785
  category: sharing_the_road
  question: 対向車線から来るトラックやバスとすれ違う際、風の乱気流は車両にどのような影響を与えますか？
  choices:
    A: 車両同士を引き寄せる。
    B: 車両同士を遠ざけるように押し出す。
    C: 小型車をトラックの下に引き込む。
    D: 車両には何の影響も与えない。
  answer: B
  explanation: 対向車線から来るトラックやバスとすれ違う際、車両間に発生する風の乱気流は車両同士を遠ざけるように押し出します。引き寄せることはありません。
- id: 786
  category: sharing_the_road
  question: 右折しようとしているトラックの右側の空きスペースに入り込むのを避けるべきなのはなぜですか？
  choices:
    A: トラックの運転手がそのスペースにバックする準備をしているため。
    B: トラックがこぼれる可能性のある危険物を積んでいるかもしれないため。
    C: トラックの運転手からあなたの車が見えず、車が押しつぶされたり側面をこすられたりする可能性があるため。
    D: トラックが右折中に急加速するため。
  answer: C
  explanation: トラックは大きく右折するため、右側に空きスペースができることがよくあります。トラックと縁石の間にいると、運転手から見えない場合があり、トレーラーに押しつぶされたり側面をこすられたりする危険があります。
- id: 787
  category: safe_driving_rules
  question: ランナウェイトラックランプ（緊急退避所）の目的は何ですか？
  choices:
    A: 疲労した商用車の運転手に休憩所を提供するため。
    B: トラックが安全に荷物の積み下ろしを行えるようにするため。
    C: 急な下り坂で制御不能になったトラックやバスを停止させるため。
    D: 高速道路に入る前にトラックの重量を量るため。
  answer: C
  explanation: ランナウェイトラックランプ（緊急退避所）は、急な下り坂で制御不能になったトラックやバスを停止させるために設計されています。一般車両は絶対にこれらの場所に停車したり駐車したりしてはいけません。
- id: 788
  category: sharing_the_road
  question: 大型車両の前方の「ノーゾーン（死角）」は、トラックの真正面から約どのくらいの距離まで広がっていますか？
  choices:
    A: 10フィート
    B: 20フィート
    C: 50フィート
    D: 100フィート
  answer: B
  explanation: 大型車両の真正面から約20フィートまでのエリアはノーゾーン（死角）とみなされており、このエリアに急に割り込むと衝突事故の原因となる可能性があります。
- id: 789
  category: sharing_the_road
  question: デンジャーゾーン（危険区域）に入らないようにするため、子供はスクールバスから少なくともどのくらい離れるべきですか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 20フィート
  answer: B
  explanation: デンジャーゾーンとは、バスの周囲すべての方向において子供が最も危険にさらされるエリアのことです。子供はスクールバスから10フィート離れるべきであり、絶対にバスの後ろに回ってはいけません。
- id: 790
  category: safe_driving_rules
  question: マニュアルによると、スクールバスに関して子供が怪我をするリスクが最も高いのはいつですか？
  choices:
    A: 高速道路でバスに乗車している時。
    B: バスが追突事故に巻き込まれた時。
    C: バスの乗り降りでバスの外にいる時。
    D: バスの最前列に座っている時。
  answer: C
  explanation: スクールバスの安全性に関する現実として、バスの車内よりも車外で怪我をする子供の方が多いです。子供はスクールバスの乗り降りの際に最も高いリスクにさらされます。
- id: 791
  category: signs_and_signals
  question: 「低速走行車（slow moving vehicle）」の標識（エンブレム）はどのような見た目ですか？
  choices:
    A: 黒い文字が書かれた黄色のひし形の標識。
    B: 蛍光色または反射材のオレンジ色の三角形。
    C: 白い縁取りのある赤い八角形。
    D: 黒いトラクターのシンボルが描かれた白い長方形。
  answer: B
  explanation: 「低速走行車」の標識は、蛍光色または反射材のオレンジ色の三角形であり、動物に引かれる車両、およびほとんどの農業用車両や建設機械の後部に表示することが義務付けられています。
- id: 792
  category: sharing_the_road
  question: 農業用機械には通常、方向指示器（ウィンカー）がありませんが、運転者は右折する準備としてどのような行動をとることがありますか？
  choices:
    A: ヘッドライトを3回点滅させる。
    B: 最初に左へ大きく膨らんでから、右折する。
    C: 完全に停止し、手で合図して他の車を先に進ませる。
    D: 右折する前に右側の路肩を走行する。
  answer: B
  explanation: 農業用機械には通常、方向指示器がありません。そのため、右折する際、農業用機械の運転者は最初に左へ大きく膨らんでから右折することがあります。
- id: 793
  category: sharing_the_road
  question: テネシー州の道路における動物に引かれる車両について、正しいものは次のうちどれですか？
  choices:
    A: 未舗装の田舎道でのみ許可されている。
    B: すべての自動車に通行権（優先権）を譲らなければならない。
    C: 自動車と同じように道路を使用する権利がある。
    D: 一般的な交通規則に従う必要はない。
  answer: C
  explanation: 動物に引かれる車両は、自動車と同じように道路を使用する権利があり、同じ交通規則に従わなければなりません。
- id: 794
  category: defensive_driving
  question: 急な下り坂でトラックの後ろを走行中、トラックの車輪から煙が出ている、または異常な高速で走行していることに気づいた場合、どうすべきですか？
  choices:
    A: 加速してすぐにトラックを追い越す。
    B: クラクションを鳴らして運転手に警告する。
    C: 車間距離を空け、絶対に追い越さない。
    D: 左側の路肩に寄せて停止する。
  answer: C
  explanation: 車輪からの煙や異常な高速走行は、大型車両のブレーキが効かなくなっている兆候である可能性があります。このような状況に遭遇した場合は、車間距離を空け、絶対に追い越さないでください。
- id: 795
  category: sharing_the_road
  question: 危険物を輸送しているトラックに近づきすぎて走行するのを避けるべき理由はなぜですか？
  choices:
    A: 踏切などで頻繁に停止するため。
    B: 一般的な商用トラックよりもはるかに速く走行するため。
    C: 他のトラックよりも強い風の乱れ（乱気流）を発生させるため。
    D: 標準的なブレーキランプが装備されていないため。
  answer: A
  explanation: 危険物を輸送しているトラックは踏切などで頻繁に停止するため、近づきすぎて走行しないでください。
- id: 796
  category: sharing_the_road
  question: トラックやバスがあなたを追い越そうとしているとき、どうすべきですか？
  choices:
    A: 加速してトラックの死角から抜け出す。
    B: 車線の中央に移動し、速度を維持する。
    C: 車線の端（追い越す車から遠い側）に寄り、少し速度を落とす。
    D: ハイビームを点滅させてトラックの運転手に警告する。
  answer: C
  explanation: トラックがあなたを追い越す際、車線の端（遠い側）に寄り、少し速度を落とすことで運転手を助けることができます。トラックやバスが追い越している最中に、絶対に加速してはいけません。
- id: 797
  category: safe_driving_rules
  question: 多くの学校制度において、子供たちはスクールバスの危険区域（デンジャーゾーン）から逃れるために、どのように行動するよう教えられていますか？
  choices:
    A: バスから離れる方向に小さな歩幅で3歩歩く。
    B: バスを降りたらすぐに、大股で5歩歩く。
    C: バスの後方に向かって通常の歩幅で10歩歩く。
    D: バスの前方に向かって大股で2歩歩く。
  answer: B
  explanation: 多くの学校制度において、子供たちはバスを降りたらすぐに大股で5歩歩き、危険区域から逃れるよう教えられています。
- id: 798
  category: sharing_the_road
  question: ほとんどの場合、田舎の幹線道路を走行する大型の農業用機械の速度はどれ以下ですか？
  choices:
    A: 15 M.P.H.
    B: 25 M.P.H.
    C: 35 M.P.H.
    D: 45 M.P.H.
  answer: B
  explanation: ほとんどの場合、農業用機械の車両は25 M.P.H.未満で走行しています。
- id: 799
  category: sharing_the_road
  question: 乗馬している人に近づいたり追い越したりする際、避けるべき行動は何ですか？
  choices:
    A: 減速すること
    B: クラクションを鳴らしたり、エンジンを空ぶかしすること
    C: 適切な距離を保つこと
    D: 左側から追い越すこと
  answer: B
  explanation: マニュアルには、「馬に近づいたり追い越したりする際は、クラクションを鳴らしたり、エンジンを大きく『空ぶかし』したりしてはいけません」と記載されています。
- id: 800
  category: vehicle_information
  question: 低速走行車の通常の速度範囲はどれくらいですか？
  choices:
    A: 15〜30 mph
    B: 5〜20 mph
    C: 10〜25 mph
    D: 20〜40 mph
  answer: B
  explanation: マニュアルによると、「低速走行車の通常の速度は、5〜20 mphの範囲になる場合があります」。
- id: 801
  category: safe_driving_rules
  question: 低速走行車にライトの点灯が義務付けられている場合、通常、後方の自発光式赤色ランプは後方何フィートまで見えますか？
  choices:
    A: 100フィート
    B: 250フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: マニュアルには、低速走行車の後部にある自発光式赤色ランプは、通常、後方500フィートから見えると記載されています。
- id: 802
  category: safe_driving_rules
  question: 速度の遅い車両はどの車線を走行すべきですか？
  choices:
    A: 左側の車線
    B: 中央の車線
    C: 右側の車線
    D: 一定の速度を保っていればどの車線でもよい
  answer: C
  explanation: マニュアルには、「速度の遅い車両は右側の車線を走行しなければなりません。左側の車線は追い越しおよび右左折用です」と規定されています。
- id: 803
  category: signs_and_signals
  question: 作業区間（ワークゾーン）にあるすべての臨時標識の背景は何色ですか？
  choices:
    A: 黄色
    B: 赤色
    C: オレンジ色
    D: 白色
  answer: C
  explanation: マニュアルには、「作業区間にあるすべての臨時標識は、オレンジ色の背景に黒色の文字または記号が描かれています」と記載されています。
- id: 804
  category: penalties_and_points
  question: 制限速度が引き下げられ、作業員がいる作業区間（ワークゾーン）での速度違反に対する最高罰金額はいくらですか？
  choices:
    A: 100ドル
    B: 250ドル
    C: 500ドル
    D: 1000ドル
  answer: C
  explanation: テネシー州法では、制限速度が引き下げられ、作業員がいる作業区間での速度違反には、最高500ドルの罰金が科せられます。
- id: 805
  category: defensive_driving
  question: 時速60マイル（60 M.P.H.）で走行している車は、1秒間にどのくらいの距離を進みますか？
  choices:
    A: 44フィート
    B: 60フィート
    C: 88フィート
    D: 120フィート
  answer: C
  explanation: マニュアルには、「時速60マイルで走行する車は、1秒間に88フィート進む」と記されています。
- id: 806
  category: defensive_driving
  question: 作業区間（ワークゾーン）で最も一般的な事故の種類は何ですか？
  choices:
    A: 正面衝突
    B: 追突事故
    C: 側面衝突
    D: 横転事故
  answer: B
  explanation: マニュアルでは、「作業区間での事故のほとんどは追突事故が原因である」として、車間距離を詰めすぎない（テールゲーティングをしない）よう運転手に警告しています。
- id: 807
  category: sharing_the_road
  question: 時速55マイルで走行している列車が停止するまでに、どのくらいの距離が必要ですか？
  choices:
    A: 4分の1マイル
    B: 半マイル
    C: 1マイル
    D: 2マイル
  answer: C
  explanation: マニュアルによると、「時速55マイルで走行する列車が停止するには、1マイルの距離が必要である」とされています。
- id: 808
  category: defensive_driving
  question: 列車との衝突事故で死亡する確率は、車との衝突事故と比べてどのくらい高いですか？
  choices:
    A: 5倍高い
    B: 10倍高い
    C: 20倍高い
    D: 30倍高い
  answer: D
  explanation: マニュアルには、「列車との衝突事故で死亡する確率は、車や大型トラック、バスとの衝突事故に比べて30倍高い」と記載されています。
- id: 809
  category: sharing_the_road
  question: 列車と車の衝突事故のほとんどはどこで発生していますか？
  choices:
    A: 運転手の自宅から25マイル以内
    B: 標識のない田舎の未舗装道路
    C: 照明の不十分な夜間の場所
    D: 運転手の自宅から100マイル以上離れた場所
  answer: A
  explanation: マニュアルでは、「衝突事故のほとんどは運転手の自宅から25マイル以内で発生しており、これは運転手がそこに線路があることを『知っていた』ことを示唆している…」と説明されています。
- id: 810
  category: sharing_the_road
  question: 車と列車が踏切に近づいている場合、どちらに優先権がありますか？
  choices:
    A: 先に到着した車両
    B: 常に列車に優先権がある
    C: 車（高速道路の速度で走行している場合）
    D: 列車（ただし、警告灯が点滅している場合のみ）
  answer: B
  explanation: マニュアルには、「法律で定められているため、運転手は『常に』列車に優先権を譲らなければならない」と明記されています。
- id: 811
  category: sharing_the_road
  question: 作業区間（ワークゾーン）で作業員が視認性を高めるために通常着用する衣服の色は何色ですか？
  choices:
    A: 鮮やかなオレンジ色
    B: 鮮やかな黄緑色
    C: 反射する白色
    D: ネオンピンク
  answer: B
  explanation: マニュアルには、「これらの作業区間では、作業員は視認性を高めるために、通常、シャツ、ベスト、ヘルメットなどの鮮やかな黄緑色の衣服を着用します」と記載されています。
- id: 812
  category: sharing_the_road
  question: 乗馬者が道路を通行する際、どのように位置取るべきですか？
  choices:
    A: 右車線で2列に並ぶ
    B: 右側の縁石または道路の端の近くを1列で進む
    C: センターラインの近くを1列で進む
    D: 左側の路肩で対向車に向かって進む
  answer: B
  explanation: マニュアルでは、乗馬者は「右側の縁石や道路の端の近く、または利用可能な右側の路肩、車線、小道を1列で進まなければならない」と規定されています。
- id: 813
  category: safe_driving_rules
  question: 電気式または機械式の信号装置が設置されている踏切に近づいた場合、車両をどこで完全に停止させなければなりませんか？
  choices:
    A: 最も近いレールから100フィート以内、ただし25フィート以上離れた場所。
    B: 最も近いレールから50フィート以内、ただし15フィート以上離れた場所。
    C: 最も近いレールから30フィート以内、ただし10フィート以上離れた場所。
    D: 最も近いレールからちょうど20フィートの場所。
  answer: B
  explanation: マニュアルには、電気式または機械式の信号装置が設置されている踏切では、運転者は最も近いレールから50フィート以内、ただし15フィート以上離れた場所で車両を完全に停止させなければならないと記載されています。
- id: 814
  category: defensive_driving
  question: 踏切内で車両が立ち往生し、列車が近づいてきた場合、車から降りた後どの方向に逃げるべきですか？
  choices:
    A: 列車が進行しているのと同じ方向。
    B: 線路から直接90度の角度で離れる方向。
    C: 列車に向かって45度の角度の方向。
    D: 線路と平行に、列車の進行方向とは逆の方向。
  answer: C
  explanation: マニュアルによると、列車が近づいている場合は、衝突地点から離れ、かつその後方に位置するように、列車に向かって45度の角度で逃げるべきです。
- id: 815
  category: defensive_driving
  question: 踏切内で車両が立ち往生した場合、なぜ近づいてくる列車に向かって45度の角度で逃げるべきなのですか？
  choices:
    A: 列車の運転士に停止の合図を送るため。
    B: 列車の速度をよく確認するため。
    C: 緊急通報システム（ENS）の標識に早く到達するため。
    D: 飛散物による負傷を防ぐため、衝突地点から離れ、かつその後方に位置するため。
  answer: D
  explanation: マニュアルでは、列車に向かって45度の角度で逃げることで、衝突地点から離れ、かつその後方に位置することができ、飛散物による負傷を防ぐことができると説明されています。
- id: 816
  category: safe_driving_rules
  question: すでに踏切を渡り始めている時に、警告灯が点滅し始めたり、遮断機が下り始めたりした場合、どうすべきですか？
  choices:
    A: すぐに停止して後退する。
    B: そのまま進み続け、踏切を渡り切る。
    C: 線路上で車両を停止させ、すぐに車から降りる。
    D: 車両をバックギアに入れ、慎重に線路から後退する。
  answer: B
  explanation: マニュアルには明確に次のように記載されています。「踏切を渡っている最中に警告灯が点滅し始めたり、遮断機が下り始めたりしても、止まらないでください。そのまま進み続けてください（KEEP
    MOVING）！」
- id: 817
  category: sharing_the_road
  question: 信号が作動しているかどうかにかかわらず、すべての踏切で一時停止することが義務付けられている車両は次のうちどれですか？
  choices:
    A: オートバイおよびモペッド。
    B: 15人乗りバンおよびキャンピングカー（RV）。
    C: スクールバス、路線バス・観光バス、および危険物を積載したトラック。
    D: レッカー車および緊急車両。
  answer: C
  explanation: マニュアルには、スクールバス、路線バス・観光バス、および危険物を積載したトラックは、信号が作動しているかどうかにかかわらず、すべての踏切で一時停止しなければならないと記されています。
- id: 818
  category: signs_and_signals
  question: 踏切にある青色の緊急通報システム（ENS）の標識には、どのような情報が記載されていますか？
  choices:
    A: 列車の時刻表と到着予定時刻。
    B: 踏切を通過する列車の制限速度。
    C: 緊急連絡先の電話番号とDOT（運輸省）の踏切番号。
    D: 次の幹線道路の交差点までの距離。
  answer: C
  explanation: マニュアルには、車両が線路上で立ち往生した場合に備え、ENS標識には電話をかけるべき緊急連絡先と、現在地を特定するためのDOT（運輸省）の踏切番号が記載されていると説明されています。
- id: 819
  category: license_system
  question: テネシー州で15人乗りバンを運転するには、どのような特別な裏書（エンドースメント）や免許が必要ですか？
  choices:
    A: 商用運転免許（CDL）。
    B: 旅客用の裏書があるクラスD免許。
    C: お抱え運転手（ショーファー）免許。
    D: 特別な裏書や免許は必要ない。
  answer: D
  explanation: マニュアルには、「テネシー州で15人乗りバンを運転するために必要な特別な裏書や免許はありません」と記載されています。
- id: 820
  category: vehicle_information
  question: 15人乗りバンに人を乗せる際、乗客がなるべく車両の前方に座るべきなのはなぜですか？
  choices:
    A: 運転手が乗客の声をよく聞き取れるようにするため。
    B: 後部座席は後車軸より後ろにあり、重心がさらに後方に押しやられるため。
    C: 重い荷物や手荷物のために後部座席を空けておくため。
    D: 前部座席にはより優れたエアバッグが装備されているため。
  answer: B
  explanation: マニュアルでは、後部座席が後車軸より後ろに位置しているため、重量配分が不均等になり重心がさらに後方に押しやられることから、乗客を前方に座らせるよう推奨しています。
- id: 821
  category: vehicle_information
  question: 15人乗りバンにおいて、後輪の空気圧不足はどのような危険な問題の主な原因となりますか？
  choices:
    A: エンジンのオーバーヒート。
    B: ブレーキの故障。
    C: トレッドセパレーション（タイヤの剥離）。
    D: トランスミッションの滑り。
  answer: C
  explanation: マニュアルによると、15人乗りバンにおいて後輪（特に左後輪）の空気圧不足は、トレッドセパレーションの主な原因となります。
- id: 822
  category: vehicle_information
  question: キャンピングカー（RV）の操縦性を向上させ、適切な重心を維持するためには、重量をどのように配分すべきですか？
  choices:
    A: 屋根に近く、主に右側に配分する。
    B: 地面に近く、両側に均等に配分する。
    C: 車両の後部にすべて配分する。
    D: 主に運転席近くの前部に配分する。
  answer: B
  explanation: マニュアルには、重量を地面に近く両側に均等に配分することで重心が低く保たれ、RVの操縦性が向上すると記載されています。
- id: 823
  category: sharing_the_road
  question: キャンピングカー（RV）の死角、または「ノーゾーン（No-Zones）」に関して、正しいものは次のうちどれですか？
  choices:
    A: ミラーが正しく調整されていれば、RVに死角はない。
    B: RVのミラーを使えば、運転手は道路上のすべてを見ることができる。
    C: RVには大きな死角があり、ミラーを使っても運転手がすべてを見ることはできない。
    D: RVの右側にのみ死角がある。
  answer: C
  explanation: マニュアルでは、RVは大型で多くの死角があり、ミラーは重要であるものの、運転手が道路上のすべてを見ることができるわけではないと警告しています。
- id: 824
  category: defensive_driving
  question: 15人乗りバンのタイヤが道路から外れて落ちた場合、横転を避けて安全に復帰する最善の方法は何ですか？
  choices:
    A: 急ブレーキをかけ、ハンドルを道路に向かって急に切る。
    B: 加速してトラクションを回復させてからハンドルを戻す。
    C: 徐々に減速し、安全が確認できてからハンドルを切って道路に戻る。
    D: ニュートラルに入れ、バンが完全に停止するまで惰性で進む。
  answer: C
  explanation: マニュアルでは、バンのタイヤが道路から外れた場合、横転を避けるために徐々に減速し、安全が確認できてからハンドルを切って道路に戻るようアドバイスしています。
- id: 825
  category: safe_driving_rules
  question: 遮断機が下りている踏切で待っている場合、合法かつ安全に線路を渡れるのはいつですか？
  choices:
    A: 遮断機がまだ下りていても、列車が通過したらすぐ。
    B: 遮断機が上がり始め、列車が見えなくなったとき。
    C: 遮断機が完全に上がり、赤い点滅信号が消えた後のみ。
    D: 他の列車が来ていないことがはっきりと確認できるときはいつでも。
  answer: C
  explanation: マニュアルには、「遮断機が完全に上がり、赤い点滅信号が消えるまでは線路を渡らないでください」と記載されています。
- id: 826
  category: defensive_driving
  question: 複数の線路がある踏切で列車の通過を待っている場合、渡る前に何をすべきですか？
  choices:
    A: 最初の列車が踏切を通過したらすぐに進む。
    B: 反対方向から別の列車が接近していないか確認する。
    C: 早く渡るために、前の車にぴったりとついていく。
    D: 接近してくる列車に警告するためにクラクションを鳴らす。
  answer: B
  explanation: マニュアルでは、複数の線路がある場合、列車の通過を待っている運転手は、渡る前に反対方向から別の列車が接近していないか確認しなければならないと警告しています。
- id: 827
  category: vehicle_information
  question: キャンピングカー（RV）の運転手が、前の車との車間距離をより多く取らなければならないのはなぜですか？
  choices:
    A: RVは乗用車よりも重く、停止距離が長くなるため。
    B: RVは停止距離が短く、他の車に追突する可能性があるため。
    C: RVは幅が広く、車線変更により多くのスペースが必要なため。
    D: RVが乗用車に接近して追従することは違法であるため。
  answer: A
  explanation: マニュアルには、RVはトラックと同様に乗用車よりも重く、停止距離が長くなるため、運転手は常にRVと前の車との間に十分な車間距離を保たなければならないと記載されています。
- id: 828
  category: safe_driving_rules
  question: キャンピングカー（RV）の同乗者のシートベルトに関する規則は何ですか？
  choices:
    A: 運転手と助手席の同乗者のみが着用しなければならない。
    B: 同乗者は州間高速道路を走行する時のみ着用する必要がある。
    C: 車両が動いている時は、すべての同乗者がシートベルトを着用しなければならない。
    D: RVが時速30マイル未満で走行している場合、シートベルトの着用は任意である。
  answer: C
  explanation: 車両が動いている時は、RV内のすべての同乗者がシートベルトを着用していることを確認してください。シートベルトを締めていない同乗者は、事故や急ブレーキの際に車内に投げ出され、重傷を負う可能性があります。
- id: 829
  category: license_system
  question: テネシー州では、18歳未満の人が路上試験を受ける前に、仮免許（learner permit）をどのくらいの期間保持しなければなりませんか？
  choices:
    A: 90日間
    B: 180日間
    C: 6ヶ月間
    D: 1年間
  answer: B
  explanation: 18歳未満の人は、路上試験を受ける前に仮免許を180日間保持し、段階的運転免許（GDL）プログラムの要件を満たさなければなりません。
- id: 830
  category: driver_responsibility
  question: マニュアルによると、親や指導者が初心者の運転の安全性に対してできる最大の貢献は何ですか？
  choices:
    A: 高度な安全機能を備えた車を購入すること。
    B: 忍耐、礼儀正しさ、安全な運転習慣を通じて示す模範。
    C: 10代の若者を上級の防衛運転講習に参加させること。
    D: 日中のみ運転させること。
  answer: B
  explanation: 初心者の運転の安全性と有効性に対するあなたの最大の貢献は、あなたが示す模範です。忍耐、礼儀正しさ、そして向上心があなたの最大の武器となります。
- id: 831
  category: defensive_driving
  question: あなたが運転中に初心者のドライバーを指導する際、推奨される方法は次のうちどれですか？
  choices:
    A: できるだけ多くの情報を与えて負担をかける。
    B: 自分が下している運転の判断について声に出して話す。
    C: 集中力を試すために大音量で音楽を流す。
    D: 気が散らないように完全に無言で観察させる。
  answer: B
  explanation: 運転中に声に出して話すことは役立つ方法の一つです。車間距離を測るための手順を声に出して説明するなど、自分が運転席にいる際の指導の機会を活用してください。
- id: 832
  category: driver_testing
  question: 運転の練習中に無計画に走り回ることが推奨されないのはなぜですか？
  choices:
    A: 燃料の無駄遣いになるから。
    B: 特に初期段階では、初心者のドライバーがトラブルに巻き込まれると危険だから。
    C: 段階的運転免許(GDL)の必須運転時間としてカウントされないから。
    D: 車両に不必要な摩耗や損傷を引き起こすから。
  answer: B
  explanation: 練習中に無計画に走り回ることは危険を伴う可能性があります。特に初期段階では、初心者のドライバーがトラブルに巻き込まれるのは非常に簡単だからです。
- id: 833
  category: driver_testing
  question: 初心者のドライバーの最初の「フェーズ1（第1段階）」の練習場所として理想的なのはどこですか？
  choices:
    A: 静かな住宅街
    B: 高速の多車線ハイウェイ
    C: 人気のない広い駐車場
    D: 交通量の多い市街地の交差点
  answer: C
  explanation: 人気のない広い駐車場は、初心者が車の操作感や反応に完全に集中できるため、これらの初期の練習に理想的です。
- id: 834
  category: driver_testing
  question: 静かな住宅街での「フェーズ2（第2段階）」の運転練習において、導入すべき新しいスキルはどれですか？
  choices:
    A: 縦列駐車
    B: 適切な車線位置を保ち、安全な（2秒間の）車間距離を確保すること
    C: Uターンと急停止
    D: 悪天候での運転
  answer: B
  explanation: フェーズ2では、ドライバーを静かな住宅街に連れて行き、交通の流れに乗る練習、適切な車線位置の維持、安全な（2秒間の）車間距離の確保、および簡単な車線変更の練習を行います。
- id: 835
  category: driver_testing
  question: 初心者のドライバーが縦列駐車や複数の右左折車線がある交差点の通行を学び始めるべきなのは、運転練習のどの段階ですか？
  choices:
    A: フェーズ1（第1段階）
    B: フェーズ2（第2段階）
    C: フェーズ3（第3段階）
    D: フェーズ4（第4段階）
  answer: C
  explanation: フェーズ3では、より交通量の多い道路、縦列駐車、上り坂・下り坂での駐車、複数の右左折車線がある交差点、Uターンや急停止などを導入します。
- id: 836
  category: driver_testing
  question: 運転練習の「フェーズ4（第4段階）」で導入される条件は次のうちどれですか？
  choices:
    A: 座席とミラーの調整
    B: 車の後退と前進
    C: 簡単な車線変更
    D: 晴天時および悪天候時の夜間運転
  answer: D
  explanation: フェーズ4では、高速の多車線ハイウェイ、さまざまな天候条件、夜間、市街地や交通量の多いエリアなどの条件下で練習するよう初心者のドライバーを指導します。
- id: 837
  category: driver_responsibility
  question: 練習中に初心者のドライバーが大きなミスをした場合、推奨される対応はどれですか？
  choices:
    A: ミスの重大さを理解させるために、すぐに大声で叱る。
    B: できるだけ早く車を止め、記憶が新しいうちに何が起きたかを話し合う。
    C: 自信を喪失させないように完全に無視する。
    D: 翌日まで待ち、正式な場でその話題を取り上げる。
  answer: B
  explanation: 停止して話し合う：大きなミスの記憶が初心者のドライバーにまだ新しいうちに、できるだけ早く車を止めてください。その後、何が起きたのか、そして最も安全な対応はどうあるべきかについて時間をかけて話し合います。
- id: 838
  category: license_system
  question: テネシー州の段階的運転免許（GDL）プログラムにおいて、未成年者が中間免許（Intermediate license）の取得資格を得る前に完了しなければならない運転時間は何時間ですか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: テネシー州のGDLプログラムでは、未成年者が中間免許レベルにステップアップする資格を得る前に、規定の運転時間（50時間）を満たすことが義務付けられています。
- id: 839
  category: safe_driving_rules
  question: マニュアルによると、16歳の男性ドライバーが運転1年目に事故を起こす割合はどのくらいですか？
  choices:
    A: 3人に1人
    B: 5人に1人
    C: 10人に1人
    D: 20人に1人
  answer: B
  explanation: 経験不足とスキルの欠如が重なり、16歳の男性ドライバーの5人に1人、16歳の女性ドライバーの約10人に1人が、運転1年目に事故を起こすことになります。
- id: 840
  category: defensive_driving
  question: 若くて新しいドライバーにとって最悪の事故のいくつかは、次のうちどの条件下で発生しますか？
  choices:
    A: 朝の通学中
    B: 夜間で、車内に若者のグループが同乗している時
    C: 人気のない駐車場を一人で運転している時
    D: 親の監督下での練習中
  answer: B
  explanation: 最悪の事故のいくつかは、夜間で、車内に若者のグループが同乗している時に発生します。これが、テネシー州のGDLプログラムが10代の初心者ドライバーに対してこれら2つの分野に制限を設けている理由の一つです。
- id: 841
  category: driver_responsibility
  question: 新しい運転者に教える際、常に同じ用語を一貫して使用すること（例：「アクセル」と言ったり「ガス・ペダル」と言ったりせず、常に同じ言葉を使うこと）が重要なのはなぜですか？
  choices:
    A: 運転者が学科試験に合格するのに役立つため。
    B: 明確なコミュニケーションを確保し、初心者の混乱を避けるため。
    C: GDL（段階的運転免許）プログラムに基づく法的要件であるため。
    D: 車のエンストを防ぐため。
  answer: B
  explanation: 明確なコミュニケーション：指示は十分前もって出し、新しい運転者を混乱させないように、常に同じ用語を使用するようにしてください（例えば、ある時は「アクセル」と言い、次は「ガス・ペダル」と言うようなことは避けてください）。
- id: 842
  category: driver_responsibility
  question: 10代の若者が中間運転免許（Intermediate Driver License）を申請する際、親と子の運転に関する同意書（parent-teen
    driving agreement）に含めることが推奨されるトピックは次のうちどれですか？
  choices:
    A: 運転試験官が通るルート
    B: 駐車違反の罰金や車両の損傷に対する責任
    C: 路上技能試験を免除する方法
    D: 10代の若者が正式な免許を取得する正確な日付
  answer: B
  explanation: マニュアルでは、親と子の同意書に含めるべき事項として、運転時間やメンテナンスなどのトピックに加え、駐車違反の罰金や車両の損傷に対する責任などが推奨されています。
- id: 843
  category: safe_driving_rules
  question: マニュアルによると、初心運転者の最大の敵は何だと考えられていますか？
  choices:
    A: 夜間の運転
    B: 運転の基礎を早く習得できたことによる慢心
    C: 州間高速道路の激しい渋滞
    D: 厳しい運転試験官
  answer: B
  explanation: マニュアルには、「初心運転者の最大の敵は、運転の基礎を早く習得できたことによる慢心である」と記載されています。
- id: 844
  category: driver_testing
  question: 英語を話さない申請者が路上試験を受ける前に求められることは何ですか？
  choices:
    A: 英語の読み書きが流暢でなければならない
    B: 車内に公認翻訳者を同乗させなければならない
    C: 試験官と安全にコミュニケーションをとるのに十分な英語を理解し、話すことができなければならない
    D: 母国語で試験を受けなければならない
  answer: C
  explanation: マニュアルには、路上試験を実施する前に、すべての申請者が試験官と安全にコミュニケーションをとるのに十分な英語を理解し、話すことができなければならないと明記されています。
- id: 845
  category: driver_testing
  question: 運転免許試験官は、試験中に申請者と一緒に運転するのに約どのくらいの時間を費やしますか？
  choices:
    A: 30分未満
    B: ちょうど1時間
    C: 少なくとも45分
    D: 2時間以上
  answer: A
  explanation: マニュアルでは、「運転免許試験官がお子様と一緒に運転する時間は30分未満です」と保護者に注意喚起しています。
- id: 846
  category: driver_responsibility
  question: 10代の若者に運転免許証が交付された後、保護者が行うべきこととして、マニュアルで強く推奨されていることは何ですか？
  choices:
    A: 車への同乗をやめる
    B: 引き続き10代の若者の運転状況を監視する
    C: 制限なしにどこでも運転できるようにする
    D: すぐにすべての車両メンテナンス費用を支払わせる
  answer: B
  explanation: マニュアルでは、「運転免許証が交付された後も、引き続き10代の若者の運転状況を監視することが賢明である」とアドバイスしています。
- id: 847
  category: defensive_driving
  question: マニュアルによると、優れた防衛運転者（defensive driver）であることの意味は次のうちどれですか？
  choices:
    A: 日中のみ運転すること
    B: 自分の運転経験のみに頼ること
    C: 単に慎重であること以上のものであり、優れた運転技術を身につけるよう努めることが求められる
    D: 常に制限速度以下で運転すること
  answer: C
  explanation: テキストには、「優れた防衛運転者であるということは、単に慎重であること以上の意味を持ちます。また、単なる経験だけでも十分ではありません！優れた防衛運転者は、優れた運転技術を身につけるよう努めなければなりません」と記載されています。
- id: 848
  category: license_system
  question: マニュアルの概要によると、セクションAには次のどの情報が含まれていますか？
  choices:
    A: 防衛運転のヒント
    B: 交通標識と信号
    C: 免許申請に必要な書類
    D: 州の運転に関する法律と罰則
  answer: C
  explanation: マニュアルの概要によると、セクションAでは、さまざまな種類の免許、申請に必要な書類、18歳未満の申請者向けの情報、および必要な試験の説明について取り上げています。
- id: 849
  category: signs_and_signals
  question: 総合マニュアルのうち、交通標識、信号、および交通規則について説明しているのはどのセクションですか？
  choices:
    A: セクションA
    B: セクションB
    C: セクションC
    D: 付録
  answer: B
  explanation: マニュアルの目次によると、セクションBには、適切な運転の習慣、交通規則、交通標識と信号、および州の運転に関する法律と罰則が含まれています。
- id: 850
  category: sharing_the_road
  question: 安全な道路の共有（sharing the road）や、10代の若者が運転を学ぶのを支援することに関する情報は、マニュアルのどこにありますか？
  choices:
    A: セクションA
    B: セクションB
    C: セクションC
    D: 用語集
  answer: C
  explanation: マニュアルのセクションCでは、安全のヒント、防衛運転、安全な道路の共有、および10代の若者や新しい運転者が運転を学ぶための支援について取り上げています。
- id: 851
  category: driver_testing
  question: 英語を話さない初心者の運転練習を手伝う際、指導者は試験官の役割を担い、運転者に何を練習させるべきですか？
  choices:
    A: 英語の簡単な指示に従うこと
    B: 運転マニュアル全体を翻訳すること
    C: 言葉によるコミュニケーションなしで運転すること
    D: 試験官のルートを暗記すること
  answer: A
  explanation: マニュアルでは、指導者に対し「試験官の役割を担い、運転者に英語の簡単な指示（例：『Turn left（左折）』『Slow down（減速）』など）に従う練習をさせる」ようアドバイスしています。
- id: 852
  category: license_system
  question: 運転免許センター（Driver Service Center）が通常より混雑するのはいつですか？
  choices:
    A: 火曜日の早朝
    B: 祝日による休業明けの営業再開時
    C: 月の最終週
    D: 雨の日
  answer: B
  explanation: マニュアルには、「運転免許センターは通常、祝日による休業明けの営業再開時にお客様の数が増加するため、それに応じて訪問の計画を立ててください」と記載されています。
- id: 853
  category: license_system
  question: テネシー州の運転免許証をオンラインで更新できる資格があるかどうかは、どのように確認できますか？
  choices:
    A: www.tn.gov/safety にアクセスする
    B: 試験官に手紙を郵送する
    C: 新たに路上試験を受ける
    D: 地元の警察署を訪問する
  answer: A
  explanation: マニュアルには、「オンライン更新の資格を確認するために、当ウェブサイト（www.tn.gov/safety）の利用もご検討ください」と記載されています。
- id: 854
  category: safe_driving_rules
  question: マニュアルによると、安全運転において非常に重要なことは何ですか？
  choices:
    A: 最新の車両安全機能を備えていること
    B: 見るべきものを見て、適切な判断を下すこと
    C: 州のすべての幹線道路を暗記すること
    D: 慣れ親しんだ地域のみを運転すること
  answer: B
  explanation: テキストでは、「安全運転とは、見るべきものを見て適切な判断を下すことに大きく依存していますが、これを達成するのは簡単ではありません」と説明されています。
- id: 855
  category: driver_responsibility
  question: 10代の若者と運転に関する合意や「契約」を結ぶ際、親はどのようにすべきですか？
  choices:
    A: 公証された写しを運転免許センターに提出しなければならない
    B: 自動車教習所の指導員に署名してもらわなければならない
    C: 書面にして署名するか、家族で話し合うだけにするかを選択できる
    D: 常に車内に保管することが法律で義務付けられている
  answer: C
  explanation: マニュアルには、「この『契約』を書面にして署名するか、単に家族で話し合うだけにするかは、あなた次第です…」と記載されています。
- id: 856
  category: driver_responsibility
  question: 運転免許の試験官は運転者の能力を評価できますが、子供に運転を教育し教える責任は誰にありますか？
  choices:
    A: 安全局（Department of Safety）
    B: 高校の運転教育の教師
    C: 親または関与する指導者
    D: 州議会
  answer: C
  explanation: マニュアルでは、「運転免許の試験官は運転者の能力を評価できますが、その子供に運転を教育し教える責任は、親または関与する指導者にあります」と強調されています。
- image: stop.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: 減速し、注意して進む
    B: 完全に停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「止まれ（STOP）」の標識は、停止線、横断歩道、または交差点に進入する前に完全に停止しなければならないことを意味します。進行する前に、交通や歩行者を確認してください。
  id: 857
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 完全に停止する
    B: 加速して交通に合流する
    C: 減速し、他の車両や歩行者に優先権を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「ゆずれ（YIELD）」の標識は、減速して他の車両や歩行者に優先権（right-of-way）を譲らなければならないことを意味します。他の人が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 858
- image: do_not_enter.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: この先通行止め
    B: 駐車禁止
    C: この道路への進入禁止
    D: この先行き止まり
  answer: C
  explanation: 赤と白の「進入禁止（DO NOT ENTER）」の標識は、この標識が設置されている道路やランプに進入してはならないことを意味します。通常、高速道路の出口ランプや一方通行の道路で見られ、進入すると対向車と衝突する危険がある場所に設置されています。
  id: 859
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見た場合、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意して運転を続ける
    C: 停止して後退するか方向転換する（逆走しているため）
    D: 加速してそのエリアから素早く抜け出す
  answer: C
  explanation: 赤と白の「逆走（WRONG WAY）」の標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに停止し、安全に方向転換するか後退してください。
  id: 860
- image: one_way_left.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 交通は一方向（左方向）に流れる
    C: 中央分離帯の左側を通行する
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、この道路の交通が矢印の指す一方向にのみ進むことを示しています。
  id: 861
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 他の車両の追い越し
  answer: C
  explanation: Uターンの矢印に斜線が引かれた白い規制標識は、この場所でのUターン（転回）が禁止されていることを意味します。
  id: 862
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行動は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン（転回）
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、この交差点での左折が許可されていないことを意味します。
  id: 863
- image: no_right_turn.png
  category: signs_and_signals
  question: この標識はどういう意味ですか？
  choices:
    A: Uターン禁止
    B: 左折禁止
    C: 右折禁止
    D: 追い越し禁止
  answer: C
  explanation: 右折の矢印に斜線が引かれた白い規制標識は、この場所での右折が禁止されていることを意味します。
  id: 864
- image: no_passing.png
  category: signs_and_signals
  question: この標識は何を示していますか？
  choices:
    A: この先、道路が狭くなる
    B: この区間では他の車両を追い越してはならない
    C: この先、対面通行
    D: 右側通行
  answer: B
  explanation: 白黒のペナント型（三角旗型）の「NO PASSING ZONE（追い越し禁止区間）」標識は、このエリアで他の車両を追い越すことが許可されていないことを意味します。これは追い越し禁止区間の始まりを示しています。
  id: 865
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転手に何を指示していますか？
  choices:
    A: 右に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先、右車線減少
  answer: C
  explanation: 矢印が描かれた白い規制標識「KEEP RIGHT（右側通行）」は、安全地帯、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 866
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色から判断して、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事用標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下でのそのエリアの法定最高速度を示しています。
  id: 867
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先、動物園またはアニマルパークがある
    B: このエリアでは鹿が頻繁に道路を横断する
    C: この先、狩猟エリアがある
    D: 近くに野生動物保護区がある
  answer: B
  explanation: 鹿のシルエットが描かれた黄色いひし形の標識は、このエリアで鹿が頻繁に道路を横断することを警告しています。特に夜明けや夕暮れ時は、速度を落として動物に注意してください。
  id: 868
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: この標識は何を警告していますか？
  choices:
    A: この先、スクールゾーン
    B: この先、横断歩道
    C: 近くにハイキングコースがある
    D: この先、バス停
  answer: B
  explanation: 歩行者の図が描かれた黄色いひし形の標識は、この先に横断歩道があることを警告しています。道路を横断する歩行者のために停止する準備をしてください。
  id: 869
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区間
    C: スクールゾーンまたは学校の横断歩道
    D: 病院周辺の区域
  answer: C
  explanation: 五角形の蛍光黄緑色の標識は、スクールゾーンまたは学校の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 870
- image: railroad_crossing.png
  category: signs_and_signals
  question: この黄色い円形の標識は何を警告していますか？
  choices:
    A: 前方にラウンドアバウト（環状交差点）あり
    B: 病院の区域
    C: 前方に踏切あり
    D: 追い越し禁止区域
  answer: C
  explanation: 黒いXと2つのRが描かれた黄色い円形の標識は、前方に踏切があることを示す事前警告標識です。減速し、列車の接近を目と耳で確認してください。
  id: 871
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 学校の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX型の踏切標識（クロスバック）は踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が接近している場合は、停止しなければなりません。
  id: 872
- image: curve_right.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を示していますか？
  choices:
    A: 前方で行き止まり
    B: 右折必須
    C: 前方に右カーブあり
    D: 前方に迂回路あり
  answer: C
  explanation: 曲がった矢印が描かれた黄色いひし形の標識は、前方の道路にカーブがあることを警告しています。カーブに入る前に減速してください。
  id: 873
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブ標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示している
    B: より大幅な減速を必要とする急カーブを警告している
    C: 右折専用を意味する
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブ標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角を示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 874
