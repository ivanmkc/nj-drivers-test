- id: 83
  category: driver_testing
  question: 身体的または精神的な障害を持つ運転者に対して、どのような措置が取られることがありますか？
  choices:
    A: 免許の即時永久取消
    B: 運転者の再試験
    C: 車両の改造義務付け
    D: 日中の運転のみに制限
  answer: B
  explanation: マニュアルには、「身体的または精神的障害」に特に関連した「運転者の再試験（Re-Examination of Drivers）」のセクションがあります。
- id: 84
  category: driver_responsibility
  question: 交通事故に巻き込まれた際、最初に行うべき最も重要なルールは何ですか？
  choices:
    A: 保険会社に電話する
