    C: 交通違反免除コース
    D: 車両操作ブートキャンプ
  answer: A
  explanation: マニュアルでは、交通違反を繰り返す運転者に対する結果またはリソースとして「運転者改善プログラム (Driver Improvement
    Program)」が挙げられています。
- id: 81
  category: license_system
  question: 運転者が運転する特権を失った場合、制限付きの運転特権を維持するために、どのような種類の免許を申請できる可能性がありますか？
  choices:
    A: ハードシップ許可証 (A Hardship Permit)
    B: 制限付き運転免許証 (A Restricted Driver License)
    C: 条件付きパス (A Conditional Pass)
    D: 仮証明書 (A Probationary Certificate)
  answer: B
  explanation: マニュアルでは、運転する特権の喪失に関するセクションで「制限付き運転免許証 (Restricted Driver License)」について説明しています。
- id: 82
  category: penalties_and_points
  question: 交通違反切符（反則金の支払いなど）に応じなかった場合、運転者の記録はどうなる可能性がありますか？
  choices:
    A: 警告状を受け取る
    B: 道路工事の作業員に割り当てられる
