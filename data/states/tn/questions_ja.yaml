questions:
- id: 1
  category: license_system
  question: テネシー州運転者サービスセンター（Driver Service Centers）の通常の営業時間はいつですか？
  choices:
    A: 午前8:00から午後4:30まで
    B: 午前8:30から午後5:00まで
    C: 午前9:00から午後5:00まで
    D: 午前8:30から午後6:00まで
  answer: B
  explanation: マニュアルによると、運転者サービスセンターの営業時間は通常、午前8:30から午後5:00までで、州の公休日には閉館します。
- id: 2
  category: license_system
  question: テネシー州の暫定運転免許証（interim driver license）の有効期間はどのくらいですか？
  choices:
    A: 最長10日間
    B: 最長15日間
    C: 最長20日間
    D: 最長30日間
  answer: C
  explanation: マニュアルには、暫定免許証の有効期間は最長20日間であり、本免許証または身分証明書（ID）は利用者の住所に郵送されると記載されています。
- id: 3
  category: license_system
  question: 暫定免許証の表面にある情報は、どのように確認（検証）できますか？
  choices:
    A: 2次元バーコードを読み取る
    B: 磁気ストライプを確認する
    C: RFIDチップをスキャンする
    D: 運転者サービスセンターに電話する
  answer: A
  explanation: マニュアルには、暫定カードの表面にある情報は、2次元バーコードを読み取ることで確認できると記されています。
- id: 4
  category: license_system
  question: 米国内で民間航空機に搭乗するために、REAL IDまたはその他の認められた身分証明書が必要になるのはいつからですか？
  choices:
    A: 2023年5月7日
    B: 2024年5月7日
    C: 2025年5月7日
    D: 2026年5月7日
  answer: C
  explanation: マニュアルによると、2025年5月7日以降、米国内で民間航空機に搭乗するすべての人は、REAL ID免許証または有効な期限内の米国パスポートを所持している必要があります。
- id: 5
  category: license_system
  question: 次の活動のうち、REAL ID準拠の証明書が必要なものはどれですか？
  choices:
    A: 自動車の運転
    B: 州選挙での投票
    C: 連邦裁判所ビルへの立ち入り
    D: 核施設への入場
  answer: D
  explanation: REAL IDは、軍事基地、連邦政府ビル、核施設などの特定の連邦施設への入場に必要です。運転、投票、または連邦裁判所ビルへの立ち入りには必要ありません。
- id: 6
  category: license_system
  question: 次のうち、REAL ID準拠の証明書が必要「ない」ものはどれですか？
  choices:
    A: 国内の民間航空機への搭乗
    B: 郵便局へ行くこと
    C: 軍事基地への入場
    D: セキュリティで保護された連邦政府ビルへの入場
  answer: B
  explanation: マニュアルには、REAL ID準拠の証明書が必要ない活動として「郵便局へ行くこと」が明記されています。
- id: 7
  category: license_system
  question: REAL ID準拠の証明書と、非準拠のテネシー州免許証を取得する場合の費用の違いは何ですか？
  choices:
    A: REAL IDの方が10ドル高い。
    B: REAL IDの費用は2倍かかる。
    C: 費用の違いはない。
    D: 非準拠のIDは無料である。
  answer: C
  explanation: マニュアルには、「REAL ID準拠の証明書と、非準拠のテネシー州免許証またはIDを取得するための費用に違いはない」と記載されています。
- id: 8
  category: driver_responsibility
  question: 次のうち、わき見運転・不注意運転（distracted driving）の一種とみなされるものはどれですか？
  choices:
    A: 認知的注意散漫（Cognitive distraction）
    B: 視覚的注意散漫（Visual distraction）
    C: 手動的注意散漫（Manual distraction）
    D: 上記のすべて
  answer: D
  explanation: マニュアルでは、わき見運転・不注意運転にはさまざまな形態があると説明されています。「認知的、視覚的、または手動的なものである可能性があり、これら3つすべての組み合わせである場合もあります...」
- id: 9
  category: safe_driving_rules
  question: テキストメッセージの送信や閲覧をすると、最低何秒間、道路から目が離れることになりますか？
  choices:
    A: 2秒
    B: 3秒
    C: 5秒
    D: 10秒
  answer: C
  explanation: マニュアルによると、テキストメッセージの送信や閲覧をすると、最低5秒間は道路から目が離れることになります。
- id: 10
  category: defensive_driving
  question: 時速55マイル（55 mph）で走行中に5秒間テキストメッセージを読むことは、目を閉じたままどのくらいの距離を運転することに相当しますか？
  choices:
    A: バスケットボールコートの長さ
    B: フットボール場全体の長さ
    C: 野球のダイヤモンドの長さ
    D: 1つの市街地ブロックの長さ
  answer: B
  explanation: マニュアルには、「時速55マイルで走行している場合、それは目を閉じたままフットボール場全体の長さを運転するようなものです」と記載されています。
- id: 11
  category: driver_responsibility
  question: テネシー州の統合交通分析ネットワーク（Titan）によると、テネシー州ではわき見運転（注意散漫な運転）による事故はどのくらいの頻度で発生していますか？
  choices:
    A: 10分5秒ごと
    B: 15分30秒ごと
    C: 26分13秒ごと
    D: 45分20秒ごと
  answer: C
  explanation: Titanによると、テネシー州では26分13秒ごとにわき見運転による事故が発生しています。
- id: 12
  category: safe_driving_rules
  question: テネシー州の2019年ハンズフリー法に基づき、運転者にとって違法となる行為は次のうちどれですか？
  choices:
    A: スマートフォンに触れずに音声起動GPSシステムを使用する
    B: 体のどの部分であっても携帯電話を保持する
    C: 車内の同乗者と話す
    D: 車両内蔵のラジオを聴く
  answer: B
  explanation: 公法第412号（Public Chapter No. 412）によると、運転者が「体のどの部分であっても携帯電話やモバイルデバイスを保持すること」は違法です。
- id: 13
  category: safe_driving_rules
  question: ハンズフリー法では、運転者がどのような状態になるような携帯電話へのリーチ（手を伸ばす行為）を禁止していますか？
  choices:
    A: ステアリングホイール（ハンドル）から片手を離すこと
    B: 道路から1秒以上目を離すこと
    C: 運転席に座った状態を維持できなくなる、またはシートベルトで適切に固定されていない状態になること
    D: 音声コマンドを声に出して言うこと
  answer: C
  explanation: 法律では、「運転者が運転席に座った状態を維持できなくなる、またはシートベルトで適切に固定されていない状態になるような方法で、携帯電話やモバイルデバイスに手を伸ばすこと」を違法としています。
- id: 14
  category: safe_driving_rules
  question: 運転中にGPSにアクセスしたり調整したりするためにスマートフォンに触れる必要がある場合、どうしなければなりませんか？
  choices:
    A: 赤信号で停車するまで待つ
    B: 同乗者にハンドルを握ってもらう
    C: 時速15マイル（約24km/h）以下まで減速する
    D: 駐車場などの安全な場所に車を寄せて停車させる
  answer: D
  explanation: マニュアルには、「GPSを使用するためにスマートフォンに触れることは許可されていません。GPSにアクセスしたりスマートフォンを使用したりする必要がある場合は、駐車場などの安全な場所に車を寄せ、車両を完全に停車させてから操作しなければなりません」と記載されています。
- id: 15
  category: license_system
  question: テネシー州において、18歳未満の人はREAL ID準拠の証明書を取得する資格がありますか？
  choices:
    A: いいえ、少なくとも18歳である必要があります。
    B: いいえ、少なくとも21歳である必要があります。
    C: はい、資格があり、成人の証明書保持者と同じ手続きに従います。
    D: はい、ただし海外旅行をする場合に限ります。
  answer: C
  explanation: マニュアルには、「18歳未満の人は、成人の証明書保持者と同じ手続きに従うことで、REAL ID準拠の免許証または身分証明書を取得する資格があります」と記載されています。
- id: 16
  category: safe_driving_rules
  question: マニュアルによると、運転中にスマートフォンのGPSを使用する適切な方法は何ですか？
  choices:
    A: ルートを調整するために素早くスマートフォンに触れてもよい。
    B: 安全な場所に車を寄せて完全に停車させてから操作しなければならない。
    C: 片手をハンドルに置いていれば使用できる。
    D: 赤信号で停車している間のみ使用できる。
  answer: B
  explanation: マニュアルには次のように記載されています。「GPSにアクセスしたりスマートフォンを使用したりする必要がある場合は、駐車場などの安全な場所に車を寄せ、車両を完全に停車させてから、スマートフォンやGPS技術を操作しなければなりません。」
- id: 17
  category: safe_driving_rules
  question: テネシー州で運転中にスマートフォンで動画を撮影することは合法ですか？
  choices:
    A: はい、スマートフォンがダッシュボードに固定されていれば可能です。
    B: はい、ただしSNS目的の場合に限ります。
    C: いいえ、運転中に動画を撮影することは法律違反です。
    D: いいえ、交通事故を記録している場合を除きます。
  answer: C
  explanation: マニュアルには明示的に次のように記載されています。「運転中に動画を撮影することは非常に危険であり、法律違反です。」
- id: 18
  category: safe_driving_rules
  question: 旅行の際、GPSナビゲーションはいつ設定すべきですか？
  choices:
    A: 高速道路に合流する時
    B: 運転を開始する前
    C: 最初の信号で停車している時
    D: 時速30マイル（約48km/h）以下で走行している時はいつでも
  answer: B
  explanation: マニュアルでは、「運転を開始する前にナビゲーションを設定する必要があります」と述べて、運転者に走行計画を立てるよう助言しています。
- id: 19
  category: license_system
  question: テネシー州総合マニュアルのどのセクションに、18歳未満の申請者向けの「中級運転免許証（Intermediate Driver Licenses）」に関する詳細が説明されていますか？
  choices:
    A: セクション A
    B: セクション B
    C: セクション C
    D: 目次
  answer: A
  explanation: はじめにによると、セクションAでは「中級運転免許証の詳細と、18歳未満の免許申請者に対してこの段階的運転免許制度（GDL）がどのように機能するか」について説明されています。
- id: 20
  category: driver_testing
  question: マニュアルによると、新規ドライバーが普通免許（operator license）に必要な知識と技能を学習し、準備するのに役立つように設計されているのはどのセクションですか？
  choices:
    A: セクション A
    B: セクション B
    C: セクション C
    D: 第2章
  answer: B
  explanation: マニュアルには、「セクションBは...新規ドライバーが普通免許に必要な知識と技能を学習し、準備するのに役立つように設計されています」と記載されています。
- id: 21
  category: sharing_the_road
  question: マニュアルのどのセクションに、他の交通手段との道路の共有に関する情報が記載されていますか？
  choices:
    A: セクションA
    B: セクションB
    C: セクションC
    D: 第1章
  answer: C
  explanation: はじめににおいて、セクションCは「高速道路において特定の権利と特権を持つ他の交通手段との道路の共有に関する情報を提供している」と記されています。
- id: 22
  category: license_system
  question: テネシー州において、クラスM免許は何を表していますか？
  choices:
    A: モーターホーム（キャンピングカー）
    B: モペット
    C: モーターサイクル（オートバイ）
    D: マニュアル・トランスミッション
  answer: C
  explanation: セクションA、第1章の目次には「クラスM（モーターサイクル）」と記載されています。
- id: 23
  category: license_system
  question: クラスD免許の「F」エンドースメント（限定解除/付加資格）は何を意味しますか？
  choices:
    A: 農耕用車両
    B: 営業用（For-Hire）
    C: 貨物
    D: 家族用
  answer: B
  explanation: 目次には「F（営業用エンドースメント）付きクラスD」と記載されています。
- id: 24
  category: license_system
  question: 学習許可証（ラーナーパーミット）にはどのクラスの免許が指定されていますか？
  choices:
    A: クラスLP
    B: クラスL
    C: クラスPD
    D: クラスP
  answer: C
  explanation: 目次には「学習許可証（クラスPD）」と記載されています。
- id: 25
  category: license_system
  question: クラスH免許とはどのような種類の免許ですか？
  choices:
    A: 大型商用
    B: 高速道路用
    C: 危険物用
    D: 困窮時用（Hardship）
  answer: D
  explanation: 目次には「クラスH（困窮時用）」と記載されています。
- id: 26
  category: driver_responsibility
  question: マニュアルに記載されている臓器・組織提供プログラムの名称は何ですか？
  choices:
    A: ドネート・ライフ・テネシー（Donate Life Tennessee）
    B: テネシー臓器登録所
    C: ギフト・オブ・ライフTN
    D: テネシー・ドナー・サービス
  answer: A
  explanation: 目次には「臓器および組織の提供 - ドネート・ライフ・テネシー」という項目が記載されています。
- id: 27
  category: driver_responsibility
  question: 運転免許に関連する有権者登録について、マニュアルで使用されている用語は何ですか？
  choices:
    A: オート・ボート
    B: モーター・ボーター（Motor Voter）
    C: ドライブ・トゥ・ボート
    D: 免許登録
  answer: B
  explanation: 目次には「有権者登録 – モーター・ボーター」と記載されています。
- id: 28
  category: license_system
  question: テネシー州の運転マニュアルにおいて、略語「TDL」は何を表していますか？
  choices:
    A: テネシー州運転免許証
    B: 臨時運転免許証（Temporary Driver License）
    C: 通過運転免許証
    D: ティーン運転免許証
  answer: B
  explanation: 目次には「臨時運転免許証（TDL）」と記載されています。
- id: 29
  category: license_system
  question: 運転資格の文脈において、「IDP」は何の略ですか？
  choices:
    A: 身分証明運転許可証
    B: 州間運転特権
    C: 国際運転免許証（International Driving Permit）
    D: 独立ドライバープログラム
  answer: C
  explanation: 目次には「国際運転免許証（IDP）」と記載されています。
- id: 30
  category: license_system
  question: 第2章に記載されている、免許申請時の要件は次のうちどれですか？
  choices:
    A: 車両所有権の証明
    B: 米国市民権または適法な永住権の証明
    C: 雇用証明
    D: 高校卒業の証明
  answer: B
  explanation: 第2章の目次には、免許申請の要件として「米国市民権または適法な永住権の証明」が記載されています。
- id: 31
  category: license_system
  question: 18歳未満のドライバーが仮免許（Learner Permit）を取得した後、段階的免許制度（Intermediate License system）における最初のレベルは何ですか？
  choices:
    A: 中間無制限免許（Intermediate Unrestricted License）
    B: 中間制限免許（Intermediate Restricted License）
    C: 普通運転免許（Regular Driver License）
    D: 困窮者用免許（Hardship License）
  answer: B
  explanation: 段階的免許手続き（Graduated License Procedures）によると、仮免許の後の最初のレベルは中間制限免許（Intermediate
    Restricted License）です。
- id: 32
  category: license_system
  question: 18歳未満のドライバーを対象とした段階的免許手続き（Graduated License Procedures）の最終レベルは何ですか？
  choices:
    A: 中間制限免許（Intermediate Restricted License）
    B: 仮免許（Learner Permit）
    C: 普通運転免許（Regular Driver License）
    D: 中間無制限免許（Intermediate Unrestricted License）
  answer: C
  explanation: 18歳未満のドライバーを対象とした段階的免許手続きの最終レベルは、普通運転免許（Regular Driver License）です。
- id: 33
  category: license_system
  question: 未成年者が免許を申請する際、追加で必要となる書類は次のうちどれですか？
  choices:
    A: 車両所有証明書
    B: 在学・学業成績証明書（Proof of School Attendance/Progress）
    C: 有効なパスポート
    D: 有権者登録証
  answer: B
  explanation: 未成年者の追加書類要件には、未成年者用宣誓供述書（Minor/Teenage Affidavits）および在学・学業成績証明書（Proof
    of School Attendance/Progress）が含まれます。
- id: 34
  category: safe_driving_rules
  question: 18歳未満のドライバーを対象とした段階的免許手続き（Graduated License Procedures）において、携帯電話の使用に関する規則は何ですか？
  choices:
    A: ハンズフリー機器を使用する場合のみ許可される
    B: 禁止されている
    C: 日中の時間帯のみ許可される
    D: GPSナビゲーションの使用のみ許可される
  answer: B
  explanation: マニュアルには、仮免許または中間免許を保持する18歳未満のドライバーの携帯電話使用は禁止されていると明記されています。
- id: 35
  category: safe_driving_rules
  question: 運転中のテキストメッセージ送信（メール等）に関するテネシー州の法律は何ですか？
  choices:
    A: 禁止されている
    B: 21歳以上の成人は許可されている
    C: 赤信号での停車中は許可されている
    D: スクールゾーン内でのみ禁止されている
  answer: A
  explanation: マニュアルでは、すべてのドライバーに対する一般的な規則として「運転中のテキストメッセージ送信の禁止」を挙げています。
- id: 36
  category: safe_driving_rules
  question: 「車両に慣れる（Getting Familiar With Your Vehicle）」の章によると、手持ちでの携帯電話操作が明示的に禁止されている場所はどこですか？
  choices:
    A: 州間高速道路上
