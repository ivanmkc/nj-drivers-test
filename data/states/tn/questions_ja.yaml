- id: 280
  category: safe_driving_rules
  question: テネシー州のシートベルト法によると、走行中の車両のフロントシート（前部座席）でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転手のみ。
    B: 18歳未満の同乗者のみ。
    C: すべての運転手とフロントシートのすべての同乗者。
    D: 運転手と17歳未満の同乗者のみ。
  answer: C
  explanation: マニュアルには次のように記載されています。「車両が走行している間は常に、すべての運転手とフロントシート（前部座席）のすべての同乗者にシートベルトの着用が義務付けられています。」
- id: 281
  category: safe_driving_rules
  question: テネシー州では、後部座席の乗客が次の場合、シートベルトを着用しなければなりません：
  choices:
    A: 17歳未満。
    B: 18歳以上。
    C: 運転席の後ろに座っている。
    D: 2010年以降に製造された車両に乗っている。
  answer: A
  explanation: 後部座席の乗客には、「乗客が17歳未満の場合」シートベルトの着用が義務付けられています。後部座席の乗客が18歳以上の場合は、この規定は適用されません。
- id: 282
  category: safe_driving_rules
  question: 1歳未満、または体重20ポンド未満の子供には、どのタイプのチャイルドシート（幼児用拘束装置）が必要ですか？
  choices:
    A: 前向きのチャイルドシート。
    B: 後ろ向きのチャイルドシート。
    C: ベルト位置調整機能付きのジュニアシート（ブースターシート）。
    D: 標準の大人用シートベルト。
  answer: B
  explanation: マニュアルには次のように規定されています。「1歳未満の子供、または体重20ポンド未満の子供は、車の後方を向いたチャイルドシート（幼児用拘束装置）に乗せなければなりません。」
- id: 283
