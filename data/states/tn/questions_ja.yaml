  explanation: マニュアルでは、「集中力と注意力（Concentration and Alertness）」が安全運転の重要な要素であると述べられています。
- id: 86
  category: defensive_driving
  question: 防衛的な反応に備えるために、運転者はどのようなテクニックを使うべきですか？
  choices:
    A: 直前の車両を凝視する
    B: 道路と交通状況をスキャン（注視）する
    C: バックミラーのみに頼る
    D: ダッシュボードに視線を固定する
  answer: B
  explanation: マニュアルでは、主要な防衛運転戦略として「防衛的な反応のための道路と交通状況のスキャン」を強調しています。
- id: 87
  category: defensive_driving
  question: 防衛運転の章で、安全運転のヒントと並んで具体的に取り上げられている危険な行為は何ですか？
  choices:
    A: 車間距離を詰める行為（あおり運転）
    B: ロード・レイジ（路上の激昂）
    C: 公道レース
    D: 急ブレーキによる嫌がらせ
  answer: B
  explanation: 「ロード・レイジ（Road Rage）」は、セクションCの第1章で防衛運転と並んで具体的に扱われています。
- id: 88
  category: alcohol_drugs_health
  question: アルコールによって悪影響を受けるとされている認知機能は、次のうちどれですか？
  choices:
    A: 判断力
    B: 記憶力
    C: 計算能力
    D: 空間認識能力
  answer: A
  explanation: マニュアルの「アルコールが運転能力に与える影響」の中で、「判断力（Judgment）」が明示的に挙げられています。
- id: 89
  category: license_system
  question: 通常のクラスD運転免許証で運転できる車両の最大重量はいくらですか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 26,000ポンド
    D: 36,000ポンド
  answer: C
  explanation: クラスD免許は、危険物の輸送、16人以上の乗客の輸送、またはスクールバスとしての使用でない限り、最大重量26,000ポンドまでの車両を運転するために必要です。
- id: 90
  category: license_system
  question: 他州の有効な運転免許証を持っている人がテネシー州に転入した場合、州内に何日以上居住するとテネシー州の免許証を申請しなければなりませんか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: テネシー州に転入し、他州または他国の有効な運転免許証を持っている人は、テネシー州に30日を超えて居住する場合、テネシー州の運転免許証を申請しなければなりません。
- id: 91
  category: license_system
  question: テネシー州において、クラスH運転免許は何に使用されますか？
  choices:
    A: 危険物車両の運転
    B: 14歳から16歳のドライバーを対象とした、特別な困難な事情がある場合の免許（ハードシップ免許）
    C: 26,000ポンドを超える大型トラックの運転
    D: タクシー運転手向けの営業用エンドースメント
  answer: B
  explanation: 免許区分表によると、クラスH免許は、特別な困難な事情がある14歳から16歳のドライバーを対象としたハードシップ免許（hardship
    license）です。
- id: 92
  category: license_system
  question: 重量が26,000ポンド以下の車両のうち、運転にクラスC商業免許が必要なのは次のうちどれですか？
  choices:
    A: 10人乗りの標準的な乗用バン
    B: 危険物の標識（プラカード）を掲示した車両
    C: 個人用のレクリエーション車両（RV）
    D: 小型ボートを牽引するピックアップトラック
  answer: B
  explanation: 車両総重量定格（GVWR）が26,000ポンド以下の車両であっても、危険物の標識を掲示している場合、16人以上の乗客を乗せるように設計されている場合、またはスクールバスとして使用される場合には、クラスC免許が必要です。
- id: 93
  category: license_system
  question: テネシー州において、練習許可証（instructional permit）として発行される免許区分はどれですか？
  choices:
    A: クラスP
    B: クラスI
    C: クラスM
    D: クラスF
  answer: A
  explanation: クラスP免許は、クラスA、B、C、D、およびM免許の練習許可証（instructional permit）として発行されます。
- id: 94
  category: license_system
  question: 通常の乗用車を使用してタクシーやシャトルサービスを運転することが主な仕事である場合、クラスD免許にどのエンドースメント（付記事項）を追加する必要がありますか？
  choices:
    A: P（旅客用）エンドースメント
    B: S（スクールバス）エンドースメント
    C: F（営業用/For-Hire）エンドースメント
    D: H（危険物）エンドースメント
  answer: C
  explanation: 主な仕事がクラスD車両で人を運転または輸送すること（タクシーやシャトルサービスの運転手など）である場合、クラスD免許に営業用（F）エンドースメントを追加する必要があります。
- id: 95
  category: license_system
  question: テネシー州で標準的なクラスD運転免許を取得するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: クラスD免許を取得するには、16歳以上である必要があり、視力検査、知識テスト、および運転実技テストに合格しなければなりません。
- id: 96
  category: license_system
  question: クラスM免許で運転できる車両の種類は何ですか？
  choices:
    A: モーターホームおよびRV車
    B: オートバイおよび原動機付自転車
    C: 中型商業用トラック
    D: マニュアル車
  answer: B
  explanation: 免許区分表では、オートバイや原動機付自転車を運転するにはクラスM免許が必要であると規定されています。
- id: 97
  category: license_system
  question: 商業免許における「X」特別エンドースメントは何を表していますか？
  choices:
    A: 連結トレーラー（ダブル/トリプル）
    B: スクールバス
    C: タンク車および危険物（Hazardous Materials）
    D: 16人以上の乗客を乗せる設計
  answer: C
  explanation: エンドースメント表によると、「X」エンドースメントはタンク車（Tanks）および危険物（Haz Mat）の両方を表します。
- id: 98
  category: license_system
  question: 他州の免許を持っている人がテネシー州に転入した場合、どのような場合にテネシー州の免許を申請しなければなりませんか？
  choices:
    A: 2週間の休暇で訪問している場合
    B: テネシー州で働いている場合
    C: レンタカーを運転している場合
    D: 州内を3回以上通過して運転した場合
  answer: B
  explanation: テネシー州に転入した人は、テネシー州に30日を超えて居住する場合、テネシー州で働いている場合、またはテネシー州の登録有権者としての資格を有することになる場合に、テネシー州の運転免許を申請しなければなりません。
- id: 99
  category: license_system
  question: 26,000ポンド未満の車両であっても、その車両が以下のような場合には、標準的なクラスD免許で運転することはできません。
  choices:
    A: 運転手を含めて16人以上の乗客を輸送するために使用される場合
    B: 個人の農業用に使用されるピックアップトラック
    C: 12人を運ぶ乗用バン
    D: 小型ユーティリティトレーラーを牽引している場合
  answer: A
  explanation: 26,000ポンド未満の車両であっても、16人以上の乗客（運転手を含む）を輸送する場合、危険物を輸送する場合、またはスクールバスとして使用される場合には、クラスD免許で運転することはできません。
- id: 100
  category: license_system
  question: 車両総連結重量定格（GCWR）が26,000ポンドを超え、牽引車両が10,000ポンドを超える商業用連結車両には、どの区分の免許が必要ですか？
  choices:
    A: クラスA
    B: クラスB
    C: クラスC
    D: クラスD
  answer: A
  explanation: 商業目的で使用される、GCWRが26,000ポンドを超え、かつ10,000ポンドを超える車両を牽引する連結車両には、クラスA免許が必要です。
- id: 101
  category: driver_testing
  question: クラスD免許（Class D license）を取得するために、16歳以上であることに加えて、申請者はどの試験に合格する必要がありますか？
  choices:
    A: 運転技能試験のみ
    B: 視力検査、知識試験、および運転技能試験
    C: 身体検査と運転技能試験
    D: 背景調査と知識試験
  answer: B
  explanation: クラスD免許を取得するには、16歳以上であり、視力検査、知識試験、および運転技能試験に合格する必要があります。
- id: 102
  category: license_system
  question: 二重または三重トレーラー（double or triple trailers）を備えた商用車を運転するために必要なエンドースメント（Endorsement）はどれですか？
  choices:
    A: エンドースメント N
    B: エンドースメント H
    C: エンドースメント T
    D: エンドースメント P
  answer: C
  explanation: エンドースメント一覧表では、二重/三重トレーラーに必要なエンドースメントとして「T」が記載されています。
- id: 103
  category: license_system
  question: クラスB商用免許（Class B commercial license）では、車両総重量定格（GVWR）が26,000ポンドを超えるトラックやバスを運転できますが、牽引される車両が以下の条件を満たしている場合に限られます：
  choices:
    A: 車両総重量定格（GVWR）が10,000ポンドを超えないこと
    B: 車両総重量定格（GVWR）が10,000ポンドを超えていること
    C: 危険物の標識が掲示されていること
    D: 二重または三重トレーラーであること
  answer: A
  explanation: クラスB免許は、商用目的で使用される車両総重量定格（GVWR）が26,000ポンドを超えるトラックやバス、およびそのような車両で10,000ポンドを超えない車両を牽引する場合に適用されます。
- id: 104
  category: license_system
  question: 一般的に、クラスD免許に営業用（For-Hire）エンドースメントが必要な職業は次のうちどれですか？
  choices:
    A: 配管工
    B: 検針員
    C: タクシー運転手
    D: エンジニア
  answer: C
  explanation: 営業用（For-Hire）エンドースメントが必要な職種の例には、タクシー運転手、シャトルサービスの運転手、クーリエ（配送員）などが含まれます。配管工、検針員、エンジニアは通常、このエンドースメントを必要としません。
- id: 105
  category: license_system
  question: クラスD免許に営業用（For-Hire）エンドースメントを追加する場合、申請者は通常18歳以上であり、制限のない運転経験が最低でもどのくらい必要ですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: 申請者は、2年間の制限のない運転経験があれば、営業用（For-Hire）エンドースメントを申請する資格があります。
- id: 106
  category: license_system
  question: クラスM限定免許（Class M limited license）は、排気量が以下のオートバイまたは原動機付自転車に必要です：
  choices:
    A: 125立方センチメートル（cc）を超える場合
    B: 125立方センチメートル（cc）未満の場合
    C: ちょうど250立方センチメートル（cc）の場合
    D: 500立方センチメートル（cc）を超える場合
  answer: B
  explanation: 一般的に、車両の排気量が125ccを超える場合はクラスM免許が必要であり、125cc未満の場合はクラスM限定免許が必要となります。
- id: 107
  category: safe_driving_rules
  question: 全地形対応車（ATV）がテネシー州の幹線道路や州間高速道路を合法的に横断するにはどうすればよいですか？
  choices:
    A: 交通の流れに合流し、次のランプで降りる
    B: 90度の角度で横断する
    C: 45度の角度で横断する
    D: ATVはいかなる状況下でも道路を横断することは許可されていない
  answer: B
  explanation: 法律上、「オフロード」車両または全地形対応車（ATV）は、道路に対して90度の角度を保つことによってのみ道路を横断することができ、道路、幹線道路、州間高速道路を直接走行して横断してはなりません。
- id: 108
  category: license_system
  question: 商用運転免許（CDL）は、車両または連結車両の重量が少なくとも以下の数値である場合に必要となります：
  choices:
    A: 10,001ポンド
    B: 15,000ポンド
    C: 20,001ポンド
    D: 26,001ポンド
  answer: D
  explanation: 重量が26,001ポンド以上の、より大型で複雑な車両を運転する者は、商用運転免許（CDL）を申請する必要があります。
- id: 109
  category: license_system
  question: 小型車両の運転手であっても、その車両が以下の輸送に使用される場合は商用運転免許（CDL）を取得しなければなりません：
  choices:
    A: 8名以上の乗客
    B: 10名以上の乗客
    C: 12名以上の乗客
    D: 運転手を含む16名以上の乗客
  answer: D
  explanation: 小型車両であっても、危険物の輸送、運転手を含む16名以上の乗客の輸送、またはスクールバスとして使用される場合は、CDLが必要となります。
- id: 110
  category: driver_responsibility
  question: クラスPD（学習許可証/Learner Permit）を持つ運転者が自動車を運転できるのは、少なくとも何歳の免許保持者が同乗している場合に限られますか？
  choices:
    A: 18歳
    B: 19歳
    C: 21歳
    D: 25歳
  answer: C
  explanation: クラスPD免許を持つ運転者は、21歳以上の免許保持者が運転席の隣に座って同乗している場合にのみ、自動車を運転することができます。
- id: 111
  category: license_system
  question: 18歳未満の場合、クラスD免許に切り替える前に、有効なクラスPD免許をどのくらいの期間保持する必要がありますか？
  choices:
    A: 30日間
    B: 90日間
    C: 180日間
    D: 1年間
  answer: C
  explanation: 18歳未満の場合、有効なクラスPD免許を180日間保持し、段階的運転免許（GDL）法のすべての要件を遵守する必要があります。
- id: 112
  category: license_system
  question: 家族の困窮（ハードシップ）がある場合、未成年者は何歳でクラスH（ハードシップ）免許の交付を受けることができますか？
  choices:
    A: 13歳
    B: 14歳
    C: 15歳
    D: 16歳
  answer: B
  explanation: クラスDの乗用車またはクラスMのオートバイ、あるいはその両方を運転するために、14歳の未成年者にハードシップ免許（クラスH）が交付される場合があります。
- id: 113
  category: license_system
  question: クラスH（ハードシップ）免許に課される制限は次のうちどれですか？
  choices:
    A: 日中の時間帯のみ有効である
    B: 最大3人までの同乗者を運ぶことができる
    C: 州外での運転にも有効である
    D: 商用車の運転が可能である
  answer: A
  explanation: クラスH免許は、日中の時間帯のみ、かつ承認書に指定された許可された場所への移動にのみ有効です。
- id: 114
  category: license_system
  question: 承認時の年齢に関わらず、ハードシップ免許（クラスH）の有効期限はいつ切れますか？
  choices:
    A: 申請者が15歳になったとき
    B: 申請者が16歳になったとき
    C: 申請者が18歳になったとき
    D: 申請者が高校を卒業したとき
  answer: B
  explanation: 承認時の年齢に関わらず、ハードシップ免許は申請者が16歳になった時点で有効期限が切れます。
- id: 115
  category: license_system
  question: 有効期限がなく、無料で発行される永久身分証明免許（permanent identification license）を受け取ることができるのは誰ですか？
  choices:
    A: 65歳以上のすべての人
    B: 知的障害または身体障害のあるすべての人
    C: 18歳未満のすべての人
    D: 有効なクラスD免許を保持しているすべての人
  answer: B
  explanation: 「永久身分証明免許」は、知的障害または身体障害のある方なら誰でも取得できます。このIDの資格がある方は無料で受け取ることができ、有効期限はありません。
- id: 116
  category: penalties_and_points
  question: 免許の取り消し、無効、または停止中に運転した場合の罰則は何ですか？
  choices:
    A: 最大500ドルの罰金および/または30日の禁錮
    B: 最大1,000ドルの罰金および/または6ヶ月の禁錮
    C: 最大2,500ドルの罰金および/または1年の禁錮
    D: 最大5,000ドルの罰金および生涯にわたる強制的な免許取り消し
  answer: B
  explanation: 免許の取り消し、無効、または停止中の運転はクラスBの軽罪です。罰則は、最大1,000ドルの罰金および/または6ヶ月の禁錮です。
- id: 117
  category: license_system
  question: クラスD免許に「雇用用（For-Hire）」の裏書き（エンドースメント）を追加するために必要な手数料はいくらですか？
  choices:
    A: $2.50
    B: $4.50
    C: $10.00
    D: $15.50
  answer: B
  explanation: 雇用用（For-Hire）の裏書きを追加するには、運転者は資格要件を満たし、適切な試験に合格し、4.50ドルの手数料を支払う必要があります。
- id: 118
  category: license_system
  question: 「期限付き身分証明免許（Expiring Identification License）」の有効期限がなくなるのは何歳からですか？
  choices:
    A: 21歳
    B: 50歳
    C: 60歳
    D: 65歳
  answer: D
  explanation: 身分証明書の最初のタイプは「期限付き身分証明免許」です。注：65歳以上の場合、このIDに有効期限はありません。
- id: 119
  category: license_system
  question: 次のうち、テネシー州の運転免許証を所持する必要が「ない」のは誰ですか？
  choices:
    A: 商用トラックを運転する居住者
    B: 一時的に高速道路を移動する農用トラクターの運転者
    C: 一人で車を運転して通学する高校生
    D: テネシー州で恒久的に働いている米国市民権を持たない人
  answer: B
  explanation: マニュアルによると、道路機械、農用トラクター、または一時的に高速道路（ハイウェイ）を走行・移動するその他の農業用機器の運転者は、テネシー州の運転免許証を所持する必要はありません。
- id: 120
  category: license_system
  question: 次のうち、テネシー州の運転免許証を取得する資格が「ない」のは誰ですか？
  choices:
    A: 学校で十分な成績を収めている16歳
    B: 卒業前に学校を中退した18歳未満の者
    C: 有効な他州の免許証を保持している非居住者
    D: 名誉除隊した退役軍人
  answer: B
  explanation: マニュアルによると、卒業前に学校を中退した、あるいは学校で「十分な進歩」が見られない18歳未満の者は、免許を取得する資格がありません。
- id: 121
  category: penalties_and_points
  question: 運転免許証を携帯せずに運転して摘発された場合、科される可能性がある罰金はいくらですか？
  choices:
    A: 2.00ドル以上、50.00ドル以下
    B: 50.00ドル以上、100.00ドル以下
    C: 一律500.00ドル
    D: 最大1,000.00ドル
  answer: A
  explanation: 免許証を携帯せずに運転することはクラスD軽罪にあたり、2ドル以上50ドル以下の罰金が科される可能性があります。
- id: 122
  category: license_system
  question: 暫定運転免許証（TDL）の免許区分（クラスタイプ）の前に付くアルファベットは何ですか？
  choices:
    A: T
    B: N
    C: X
    D: F
  answer: C
  explanation: マニュアルによると、TDLのクラスタイプの形式には、アルファベットの「X」が先頭に付きます（例：XD、XM、XPD）。
- id: 123
  category: license_system
  question: 暫定身分証明免許証（TID）が発行される最長期間はどれくらいですか？
  choices:
    A: 1年
    B: 3年
    C: 5年
    D: 8年
  answer: C
  explanation: マニュアルによると、暫定身分証明免許証（TID）が発行される最長期間は5年です。
- id: 124
  category: driver_responsibility
  question: テネシー州において、運転免許証、許可証、または州発行の身分証明書（ID）を保持している未成年者が、臓器提供者として登録を選択できる年齢は何歳ですか？
  choices:
    A: 10歳から12歳の間
    B: 13歳から17歳の間
    C: 16歳のみ
    D: 未成年者は臓器提供者として登録できない
  answer: B
  explanation: マニュアルには、13歳から17歳の間で、運転免許証、許可証、または州発行のIDを保持している未成年者は、ドナー（臓器提供者）としての登録を選択できると記載されています。
- id: 125
  category: driver_responsibility
  question: Donate Life Tennesseeの登録制度によると、1人の臓器提供者が救える命は最大で何人分ですか？
  choices:
    A: 最大2人
    B: 最大4人
    C: 最大8人
    D: 20人以上
  answer: C
  explanation: マニュアルには、「1人の臓器提供者が最大8人の命を救うことができ、1人の組織提供者が75人以上の人々の生活を改善することができる」と記載されています。
- id: 126
  category: license_system
  question: テネシー州の運転免許証または身分証明書（ID）に、臓器提供者として登録されていることを示すために印刷されるシンボルは何ですか？
  choices:
    A: 緑のリボン
    B: 赤いハート
    C: 青い星
    D: 医療用の十字
  answer: B
  explanation: マニュアルには、臓器および組織提供者になるという意思を反映して、免許証またはIDに赤いハートが印刷されると記されています。
- id: 127
  category: license_system
  question: テネシー州の運転免許証に「退役軍人（Veteran）」の表示を記載する資格を証明するために使用できる書類はどれですか？
  choices:
    A: 標準的な出生証明書
    B: 有効な米国パスポート
    C: 国防総省フォーム DD-214
    D: 有権者登録カード
  answer: C
  explanation: 免許証に「Veteran」と表示させるには、国防総省フォーム DD-214の認証コピー、NAVPERS-660名誉除隊証明書、またはDDフォーム2（退役）身分証明書を提示する必要があります。
- id: 128
  category: driver_responsibility
  question: 運転免許センターで申請してから30日以内に有権者登録カードが届かない場合、どこに連絡すべきですか？
  choices:
    A: 安全局（Department of Safety）
    B: 連邦選挙委員会
    C: 地元の郡選挙委員会（County Election Commission）
    D: 申請した運転免許センター
  answer: C
  explanation: マニュアルでは、運転免許センターで申請後30日以内に有権者登録カードが届かない場合は、直ちに地元の郡選挙委員会に連絡することを推奨しています。
- id: 129
  category: license_system
  question: 米国市民に対して発行された国際運転免許証（IDP）は、米国内での運転に有効ですか？
  choices:
    A: はい、ただし6ヶ月間に限ります
    B: はい、パスポートを携帯していれば有効です
    C: いいえ、米国およびその領土内での運転には有効ではありません
    D: いいえ、商用車を運転する場合を除き有効ではありません
  answer: C
  explanation: マニュアルには、国際運転免許証（IDP）は米国およびその領土内での運転には有効ではないと明記されています。
- id: 130
  category: license_system
  question: 国際運転免許証（IDP）は発行日からどのくらいの期間有効ですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 3年
    D: 5年
  answer: B
  explanation: マニュアルによると、国際運転免許証（IDP）は発行日から1年間のみ有効です。
- id: 131
  category: license_system
  question: テネシー州で管理職または技術職に従事する米国市民以外の者が、テネシー州の免許を申請する必要が生じるまで、他国の有効な免許証で運転できる期間はどのくらいですか？
  choices:
    A: 30日
    B: 3ヶ月
    C: 6ヶ月
    D: 1年
  answer: C
  explanation: 管理職または技術職の米国市民以外の者は、他州または他国で発行された有効な運転免許証で6ヶ月間車両を運転することができます。その後はテネシー州の免許を申請しなければなりません。
- id: 132
  category: license_system
  question: 次の条件のうち、テネシー州の運転免許を取得する資格がなくなるものはどれですか？
  choices:
    A: 必要な自動車保険または財政的責任（賠償能力）の証明を提示できない場合
    B: 一時的な法的滞在許可を持つ米国市民以外の者である場合
    C: 名誉除隊した退役軍人である場合
    D: 承認された運転訓練コースに登録している場合
  answer: A
  explanation: マニュアルの「資格がないのは誰か？」のセクションには、「自動車保険/財政的責任の証明を提示する必要があるが、提示していない者」が記載されています。
- id: 133
  category: license_system
  question: 米国市民が国際運転免許証（IDP）を取得するには、何歳である必要がありますか？
  choices:
    A: 16歳
    B: 18歳
    C: 21歳
    D: 25歳
  answer: B
  explanation: 国際運転免許証（IDP）を取得するには、米国市民は少なくとも18歳以上である必要があります。
- id: 134
  category: license_system
  question: テネシー州の居住者は、どこで国際運転免許証（IDP）を取得できますか？
  choices:
    A: テネシー州の任意の運転者サービスセンター
    B: 安全局本部
    C: 地元の全米自動車協会（AAA）の事務所
    D: 米国パスポート事務所
  answer: C
  explanation: 国際運転免許証（IDP）の取得を希望するテネシー州居住者は、地元の全米自動車協会（AAA）の事務所に連絡する必要があります。テネシー州の運転者サービスセンターでは発行していません。
- id: 135
  category: driver_responsibility
  question: 登録済みの性犯罪者が運転免許を申請または更新する場合、以下のことを行わなければなりません：
  choices:
    A: 安全局の運転免許試験官にその旨を通知する
    B: 郵送でのみ申請する
    C: 以前の州の免許証を地元警察に返納する
    D: 特別犯罪者付加料金を支払う
  answer: A
  explanation: 登録済みの性犯罪者である場合、性犯罪者として登録が義務付けられていることを安全局の運転免許試験官に通知する責任があります。
- id: 136
  category: license_system
  question: 運転免許証のために本人確認書類を持参する場合、次のうちどれが認められますか？
  choices:
    A: 鮮明なコピー
    B: 公証されたファックス
    C: 原本または認証済みの書類
    D: スマートフォン上のデジタル写真
  answer: C
  explanation: すべての書類は原本または認証済みである必要があります。ファックスやコピーは認められません。
- id: 137
  category: license_system
  question: 運転免許証を申請する際、テネシー州の居住証明は何通必要ですか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: 申請者は、氏名と居住住所が記載されたテネシー州の居住証明を2通提出する必要があります。
- id: 138
  category: license_system
  question: テネシー州の居住証明は最新のものでなければなりません。マニュアルによると、「最新」とは過去何ヶ月以内に発行されたものを指しますか？
  choices:
    A: 30日以内
    B: 60日以内
    C: 4ヶ月以内
    D: 6ヶ月以内
  answer: C
  explanation: マニュアルでは、認められるテネシー州の居住証明は最新のもの、つまり過去4ヶ月以内のものと規定されています。
- id: 139
  category: license_system
  question: 18歳未満の場合、通学証明書は過去何日以内に署名および日付が記入されたものである必要がありますか？
  choices:
    A: 10日以内
    B: 14日以内
    C: 30日以内
    D: 90日以内
  answer: C
  explanation: 18歳未満の申請者の通学・進級証明書は、過去30日以内に署名および日付が記入されたものである必要があります。
- id: 140
  category: driver_testing
  question: 18歳未満の申請者は、何時間の実車運転経験の証明を提出する必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: 18歳未満の申請者は、仮免許（learner permit）を6ヶ月間保持した後、50時間の実車運転経験の証明が必要です。
- id: 141
  category: license_system
  question: 商業運転免許証（CDL）を申請する際、社会保障番号（SSN）に関して正しいものはどれですか？
  choices:
    A: SSNを持っていない場合は、SSN宣誓供述書（SSN Affidavit）を使用できる。
    B: 商業免許にSSNは必要ない。
    C: SSN宣誓供述書は認められません。連邦規則により、CDL保持者はSSNを持つことが義務付けられています。
    D: 代わりに個人納税者識別番号（ITIN）を提出することができる。
  answer: C
  explanation: 連邦規則により、CDL保持者はSSN（社会保障番号）を所持していることが義務付けられています。商業免許を申請する際、SSN宣誓供述書は認められません。
- id: 142
  category: license_system
  question: 他州から転入してきた場合、有効な他州の運転免許証は何を証明するために使用できますか？
  choices:
    A: 米国市民権
    B: 合法的永住権（グリーンカード保持者）ステータス
    C: 身元（アイデンティティ）
    D: テネシー州の居住実績
  answer: C
  explanation: 以前の州で発行された有効な運転免許証は、身元を証明するために使用できますが、米国市民権や合法的永住権ステータスを証明するために使用することはできません。
- id: 143
  category: license_system
  question: 現在の氏名が身分証明書類に記載されている氏名と異なる場合、どうしなければなりませんか？
  choices:
    A: 結婚証明書のコピーを郵送する
    B: 氏名の変更を証明する原本または認証済みの法的書類を提出する
    C: 現在の免許証の期限が切れるまで変更を待つ
    D: 家族からの公証された書簡を持参する
  answer: B
  explanation: 氏名の変更を証明するための各補足資料は、原本または認証済みの法的書類である必要があります。郵送による氏名変更の受付は認められません。
- id: 144
  category: license_system
  question: 申請者が米国において「一時的（temporary）」な合法的滞在ステータスしか持っていない場合、どのような免許の対象となりますか？
  choices:
    A: 恒久的な商業運転免許証（CDL）
    B: 一時運転免許証（TDL）または一時身分証明免許証（TID）
    C: 標準的なクラスD運転免許証
    D: 国際運転免許証
  answer: B
  explanation: 申請者が一時的な合法的滞在ステータスしか持っていない場合、標準的な運転免許証の資格はありませんが、一時運転免許証（TDL）または一時身分証明免許証（TID）の交付を受けられる可能性があります。
- id: 145
  category: license_system
  question: 国際運転免許証（IDP）の使用に関して、正しいものはどれですか？
  choices:
    A: 米国での運転において、それ単体で有効である。
    B: 運転者の通常の有効な米国運転免許証と一緒に携帯しなければならない。
    C: 州外へ旅行する際、州発行の運転免許証の代わりになる。
    D: 外国人訪問者が米国の交通法規を回避することを許可するものである。
  answer: B
  explanation: 国際運転免許証（IDP）は、運転者の通常の有効な米国運転免許証と一緒に携帯しなければなりません。IDPは米国での運転において単体では有効ではありません。
- id: 146
  category: license_system
  question: 米国市民権または合法的永住権ステータスを証明するために受け入れ可能な書類はどれですか？
  choices:
    A: 有効な他州の運転免許証
    B: 過去4ヶ月以内の公共料金の請求書
    C: 有効な米国パスポート
    D: 有権者登録証
  answer: C
  explanation: 申請者が米国市民または合法的永住者であることを証明する受け入れ可能な書類のリストには、有効な米国パスポートが含まれています。
- id: 147
  category: license_system
  question: 運転免許証を申請する際、主要な身分証明書（Primary identification）として認められないものはどれですか？
  choices:
    A: 認証済み出生証明書
    B: 有効なパスポート
    C: 病院発行の出生証明書
    D: 軍の身分証明書
  answer: C
  explanation: マニュアルには、「病院発行の証明書および洗礼証明書は、主要な身分証明書として認められない」と明記されています。
- id: 148
  category: license_system
  question: 申請者が英語で発行されていない外国の出生証明書を提示する場合、他に何を提出しなければなりませんか？
  choices:
    A: 大使館からの公証された書簡
    B: 正確な翻訳の証明書（Certificate of Accurate Translation）
    C: 国際運転免許証
    D: 有効な米国パスポート
  answer: B
  explanation: 英語で発行されていない外国の出生証明書は、翻訳され、正確な翻訳の証明書を添付する必要があります。
- id: 149
  category: license_system
  question: 運転免許証を新規（ORIGINAL）で申請する場合、何点の身元証明書類が必要ですか？
  choices:
    A: 主要リスト（Primary list）から1点
    B: 補助リスト（Secondary list）から2点
    C: 主要リストから少なくとも1点、およびいずれかのリストからもう1点
    D: 主要リストから3点
  answer: C
  explanation: 新規申請者は、主要身分証明リストから少なくとも1点の書類を提示する必要があります。2点目の書類は、補助身分証明リストまたは主要身分証明リストの別の書類のいずれかから提示できます。
- id: 150
  category: license_system
  question: 新居住者が他州の免許証を紛失している場合、どうしなければなりませんか？
  choices:
    A: 補助身分証明リストから3点の書類を提示する
    B: 新規申請者に求められるものと同じ2点の証明書類を提示する
    C: 以前の州に戻って再発行を受ける
    D: テネシー州の免許を申請するまで30日間待つ
  answer: B
  explanation: 新居住者の他州の免許証が紛失している場合、その新居住者は新規申請者に義務付けられているものと同じ2点の証明書類を提示しなければなりません。
- id: 151
  category: license_system
  question: 氏名変更の証明として婚姻証明書を使用する場合、次のうちどれが正しいですか？
  choices:
    A: 婚姻を許可する「ライセンス（許可証）」である必要がある
    B: 結婚「後」に登録されたものである必要がある
    C: 証明書のコピーは常に認められる
    D: 申請者の生年月日が含まれている必要はない
  answer: B
  explanation: 証明書は、結婚「後」に登録された原本または認証済みの写しである必要があります。単に婚姻を許可する「ライセンス」では不十分です。
- id: 152
  category: license_system
  question: 次のうち、二次的な身分証明書類（Secondary Identification）として認められるものはどれですか？
  choices:
    A: 出生証明書の認証写し
    B: 有効なパスポート
    C: 健康保険証
    D: 養子縁組決定書
  answer: C
  explanation: 健康保険証（TennCare、Medicaid、Medicareなど）は、二次的な身分証明書類の表に記載されています。
- id: 153
  category: license_system
  question: テネシー州の居住を証明するために必要な書類は何通ですか？
  choices:
    A: 1通
    B: 2通
    C: 3通
    D: 4通
  answer: B
  explanation: 居住証明には、認められた居住証明書類の表から2通の書類を提出する必要があります。
- id: 154
  category: license_system
  question: 次のうち、テネシー州の居住証明書類として「認められない」ものはどれですか？
  choices:
    A: 消印付きの封筒に入った現在の公共料金請求書
    B: 公共料金の初回預かり金（デポジット）の領収書
    C: 現在の銀行取引明細書
    D: 現在のテネシー州有権者登録
  answer: B
  explanation: 居住証明に公共料金の請求書を使用する場合、マニュアルには「初回預かり金（デポジット）の領収書は認められない」と明記されています。
- id: 155
  category: license_system
  question: 申請者がテネシー州の居住証明として公共料金の請求書を使用する場合、何が一緒に含まれている必要がありますか？
  choices:
    A: 公証された署名
    B: 請求書が郵送された際の消印付きの封筒
    C: 申請者の出生証明書のコピー
    D: 公共料金会社からの手紙
  answer: B
  explanation: 現在の公共料金の請求書には、その請求書が郵送された際の消印付きの封筒が含まれていなければなりません。
- id: 156
  category: license_system
  question: テネシー州の運転免許証に社会保障番号（SSN）は印字されますか？
  choices:
    A: はい、法律で義務付けられています
    B: はい、特に希望しない限り印字されます
    C: いいえ、免許証に社会保障番号は印字されません
    D: 商業運転免許証（CDL）にのみ印字されます
  answer: C
  explanation: マニュアルには「免許証に社会保障番号は印字されません」と記載されています。
- id: 157
  category: license_system
  question: 身分および社会保障番号の証明として認められる社会保障カードの種類は何ですか？
  choices:
    A: 金属製のレプリカ
    B: プラスチック製のレプリカ
    C: 原本のコピー
    D: 社会保障カードの原本
  answer: D
  explanation: マニュアルには「社会保障カードの原本」と指定されており、二次的身分証明書（Secondary ID）の項目には「原本のみ。金属製やプラスチック製のレプリカは不可」と記されています。
- id: 158
  category: license_system
  question: 居住地住所の証明として雇用主による確認書を使用し、その雇用主が会社のレターヘッド（社名入り便箋）を持っていない場合、何が必要ですか？
  choices:
    A: 署名が公証されていること
    B: 異なるマネージャー2名による署名
    C: 雇用主の営業許可証のコピー
    D: いかなる状況でも使用できない
  answer: A
  explanation: マニュアルには「雇用主がレターヘッドを持っていない場合、署名は公証されていなければならない」と記載されています。
- id: 159
  category: license_system
  question: 申請者が氏名変更の証明として離婚判決の裁判所文書の写しを提出する場合、何が必要ですか？
  choices:
    A: 印影や署名がコピーされたものでも認められる
    B: 写しに原本の署名または印影が押されている必要がある
    C: 裁判所文書は氏名変更には使用できない
    D: 出生証明書を添える必要がある
  answer: B
  explanation: マニュアルには「写しに原本の署名または印影が押されている裁判所文書の写しは認められる。印影や署名がコピーされた裁判所文書の写しは認められない」と記されています。
- id: 160
  category: license_system
  question: 次の申請者のうち、テネシー州の居住証明を提出する必要があるのは誰ですか？
  choices:
    A: 初めてIDを取得する新規（ORIGINAL）申請者のみ
    B: 新規居住者（NEW RESIDENT）の申請者のみ
    C: 新規（ORIGINAL）、新規居住者（NEW RESIDENT）、および再居住者（RETURNING RESIDENT）の申請者
    D: 既存のテネシー州運転免許証の再発行（DUPLICATE）申請者
  answer: C
  explanation: 運転免許試験官は、新規（ORIGINAL）申請者、新規居住者（NEW RESIDENT）申請者、および再居住者（RETURNING RESIDENT）申請者に対して、テネシー州の居住証明を求めます。
- id: 161
  category: license_system
  question: 申請者が未成年で、親または法定後見人名義の居住証明書類を使用する場合、他に何が必要ですか？
  choices:
    A: 未成年者が通う学校からの手紙
    B: 関係を証明する書類
    C: 近隣住民による公証済みの声明書
    D: 未成年者の社会保障カード
  answer: B
  explanation: マニュアルには、申請者が未成年である場合、親または法定後見人の名前を使用できるが、「（この種類の証明を使用する場合は、関係を証明する書類が必要になる）」と記載されています。
- id: 162
  category: license_system
  question: 社会保障番号（SSN）を発行されたことがない場合、運転免許証の申請手続きを行うにはどうすればよいですか？
  choices:
    A: 雇用主からの手紙を提出する
    B: オンラインで申請し、「SSNなし」のボックスにチェックを入れる
    C: 本人が直接出向き、宣誓供述書に署名する
    D: パスポートと出生証明書を持参する
  answer: C
  explanation: 社会保障番号を発行されたことがない申請者は、運転免許試験官または公証人の面前で、本人が直接出向いてその旨の宣誓供述書に署名する必要があります。
- id: 163
  category: license_system
  question: 2016年1月1日現在、21歳以上のテネシー州運転免許証の有効期限はどのくらいの頻度で切れますか？
  choices:
    A: 誕生日の4年ごと
    B: 発行日から5年ごと
    C: 発行日から8年ごと
    D: 誕生日の10年ごと
  answer: C
  explanation: 2016年1月1日現在、21歳以上のテネシー州免許証は、発行日から8年ごとに有効期限が切れます。
- id: 164
  category: license_system
  question: テネシー州ドライバーサービスセンターで受け付けられていない支払い方法は次のうちどれですか？
  choices:
    A: 現金
    B: アメリカン・エキスプレスのクレジットカード
    C: マスターカード（MasterCard）
    D: 郵便為替（マネーオーダー）
  answer: B
  explanation: ドライバーサービスセンターで受け付けられている支払い方法は、現金、小切手、郵便為替、マスターカード、Visa、Discoverのクレジットカードです。アメリカン・エキスプレスは含まれていません。
- id: 165
  category: license_system
  question: 他州の運転免許証を保持している新規居住者は、居住を開始してから何日以内にテネシー州の運転免許証を取得しなければなりませんか？
  choices:
    A: 10日以内
    B: 14日以内
    C: 30日以内
    D: 60日以内
  answer: C
  explanation: 新規居住者、またはテネシー州に戻り他州の運転免許証を保持している人は、居住を開始してから30日以内にテネシー州の運転免許証を取得しなければなりません。
- id: 166
  category: driver_testing
  question: テネシー州の運転免許証を取得するすべての新規または再居住者に義務付けられている試験は何ですか？
  choices:
    A: 視力検査
    B: 路上実技試験
    C: 筆記知識試験
    D: 身体医学的検査
  answer: A
  explanation: すべての新規または再居住者は、ドライバーサービスセンターでテネシー州の視力検査を受ける必要があります。
- id: 167
  category: driver_testing
  question: 新規居住者の他州免許証が6ヶ月以上期限切れである場合、どの試験を受ける必要がありますか？
  choices:
    A: 視力検査のみ
    B: 視力検査と知識試験
    C: 知識試験と路上実技試験
    D: 知識試験、路上実技試験、および視力検査
  answer: D
  explanation: 他州の免許証が6ヶ月以上期限切れとなっている新規または再居住者は、テネシー州の知識試験、路上実技試験、および視力検査を受ける必要があります。
- id: 168
  category: license_system
  question: 免許を申請する際、新規居住者はテネシー州の居住を証明する書類を2つ提出する必要があります。これらの書類に関する要件は次のうちどれですか？
  choices:
    A: コピー（複写）であること
    B: 過去4ヶ月以内の日付であること
    C: 私書箱（P.O. Box）のアドレスを使用していること
    D: 過去12ヶ月以内の日付であること
  answer: B
  explanation: 申請者は、氏名と居住地住所が記載されたテネシー州の居住証明書類を2つ提出する必要があります。私書箱は不可であり、書類は最新で過去4ヶ月以内の日付である必要があります。
- id: 169
  category: license_system
  question: 米軍に従事している人物の有効なテネシー州運転免許証が、無期限に有効であり続ける条件は何ですか？
  choices:
    A: 州兵（National Guard）のメンバーである場合
    B: 現役任務に就いており、テネシー州外に拠点を置いている場合
    C: 軍関係者の家族である場合
    D: テネシー州内の基地に駐留している場合
  answer: B
  explanation: 本人が現役任務に留まり、テネシー州外に拠点を置いており、かつ免許証が返納、取り消し、または停止されていない限り、表示されている有効期限にかかわらず免許証は有効に保たれます。
- id: 170
  category: license_system
  question: 除隊後、またはテネシー州内の勤務地に再配属された後、運転免許証を更新するまでに何日間の猶予がありますか？
  choices:
    A: 30日以内
    B: 60日以内
    C: 90日以内
    D: 120日以内
  answer: B
  explanation: 除隊もしくは離職した、または州内の勤務地に再配属された場合、その離職日または配属日から60日以内に免許証を更新しなければなりません。
- id: 171
  category: license_system
  question: 暫定運転免許証 (TDL) が紛失または盗難に遭った場合、どのように再発行できますか？
  choices:
    A: 州のウェブサイトからオンラインで申請する
    B: 安全局 (Department of Safety) にリクエストを郵送する
    C: 運転免許サービスセンターに直接出向いて申請する
    D: フリーダイヤルの再発行ホットラインに電話する
  answer: C
  explanation: 暫定運転免許証 (TDL) および暫定身分証明書 (TIL) はオンラインで再発行することはできません。直接出向いて申請する必要があり、その際は適切な本人確認書類を提示する必要があります。
- id: 172
  category: license_system
  question: 2001年1月1日以降にテネシー州の運転免許証が交付された場合、最初の更新時に何をしなければなりませんか？
  choices:
    A: 本人確認のためにオンラインで更新する
    B: 運転サービスセンターで、米国市民または合法的な永住者であることを証明する書類を提示する
    C: 筆記知識試験を再受験する
    D: 出生証明書のコピーを安全局に郵送する
  answer: B
  explanation: テネシー州法では、2001年1月1日以降に免許証が交付されたすべての人は、最初の更新時に米国市民または合法的な永住者であることを証明する書類を提示することが義務付けられています。郵送やインターネットでの更新はできず、運転サービスセンターを訪れる必要があります。
- id: 173
  category: driver_testing
  question: 他の国から転入した新しい居住者がテネシー州の運転免許証を申請する際、何が必要ですか？
  choices:
    A: 外国の免許証を返納しなければならない
    B: 視力検査を受けることだけが求められる
    C: 視力検査、知識試験、および路上運転試験を受ける必要がある
    D: 申請する前に6か月間待たなければならない
  answer: C
  explanation: 他の国からの新しい居住者は、視力検査、知識試験、および路上運転試験のすべての試験を受ける必要があります。なお、その国で発行された免許証を保持し続けることは認められます。
- id: 174
  category: license_system
  question: 本人確認および居住証明のために提示する書類の物理的な状態に関する規則は何ですか？
  choices:
    A: 高品質なコピーが好ましい
    B: 原本でなければならない。コピーは一切認められない
    C: スマートフォン上のデジタルコピーでも認められる
    D: すべての補助的な証明書類には公証されたコピーが必要である
  answer: B
  explanation: マニュアルには「書類は原本でなければなりません。コピーは一切認められません！」と明記されています。
- id: 175
  category: penalties_and_points
  question: 運転免許証の有効期限が30日を超え6か月未満経過している場合の延滞料金はいくらですか？
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: マニュアルによると、免許証の期限が30日を超えて切れている場合は、5ドル ($5.00) の延滞料金が発生します。6か月を過ぎると、料金は倍の10ドル
    ($10.00) になります。
- id: 176
  category: license_system
  question: 運転免許証を更新せずに5年が経過した場合、更新するために何をしなければなりませんか？
  choices:
    A: 50ドルの延滞料金を支払う
    B: 視力検査、知識試験、および技能試験に合格する
    C: 認定された運転者教育コースを受講する
    D: 新しい免許証を申請する前に180日間待つ
  answer: B
  explanation: 更新せずに5年が経過した場合、10ドルの延滞料金を支払うだけでなく、視力検査、知識試験、および技能試験に合格する必要があります。
- id: 177
  category: driver_responsibility
  question: 州法により、居住地住所が変更された場合、何日以内に安全局 (Department of Safety) に通知しなければなりませんか？
  choices:
    A: 5日以内
    B: 10日以内
    C: 15日以内
    D: 30日以内
  answer: B
  explanation: 居住地住所が変更された場合、州法により変更から10日以内に安全局に通知することが義務付けられています。
- id: 178
  category: license_system
  question: 安全局に新しい住所を届ける際、それ単体では居住地住所として認められないものは次のうちどれですか？
  choices:
    A: 番地と通り名
    B: アパート番号と道路名
    C: 私書箱 (P.O. Box)
    D: ハイウェイ番号と都市名
  answer: C
  explanation: 法律により、免許証には法的な居住地住所を表示しなければなりません。私書箱 (P.O. Box) だけでは居住地住所として認められません。
- id: 179
  category: license_system
  question: 段階的運転免許 (GDL) プログラムの対象から除外されるのは誰ですか？
  choices:
    A: 仕事を持っている16歳の人
    B: 高校を卒業したか、GED（高卒認定）を取得した18歳未満の人
    C: 他州の許可証を90日間保持していた人
    D: 運転者教育を修了した17歳の人
  answer: B
  explanation: GDL法は、18歳以上の人、または高校を卒業したかGEDを取得した18歳未満の人には適用されません。
- id: 180
  category: license_system
  question: テネシー州で学習許可証 (Learner Permit) を取得できる最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 17歳
  answer: B
  explanation: 学習許可証を取得するには、15歳以上であり、標準的な筆記試験と視力検査に合格する必要があります。
- id: 181
  category: safe_driving_rules
  question: 学習許可証（Learner Permit）の保持者が運転を禁止されている時間帯はいつですか？
  choices:
    A: 午後8時から午前6時
    B: 午後9時から午前5時
    C: 午後10時から午前6時
    D: 午後11時から午前7時
  answer: C
  explanation: 学習許可証（Learner Permit）の保持者は、午後10時から午前6時の間は運転することができません。
- id: 182
  category: safe_driving_rules
  question: 学習許可証（Learner Permit）で運転する場合、少なくとも何歳以上の免許保持者が同乗しなければなりませんか？
  choices:
    A: 18歳で、助手席に乗っていること
    B: 21歳で、助手席に乗っていること
    C: 21歳で、車内のどこかに乗っていること
    D: 25歳で、助手席に乗っていること
  answer: B
  explanation: 車の助手席に21歳以上の免許保持者が同乗している場合に限り、運転することができます。
- id: 183
  category: driver_testing
  question: 制限付き中級免許（Intermediate Restricted License）を取得するには、何時間の運転経験の証明が必要ですか？
  choices:
    A: 30時間（うち夜間5時間）
    B: 40時間（うち夜間10時間）
    C: 50時間（うち夜間10時間）
    D: 60時間（うち夜間15時間）
  answer: C
  explanation: 親、法定後見人、または公認の運転教官から、50時間（うち夜間10時間）の運転経験を完了したという証明を得る必要があります。
- id: 184
  category: license_system
  question: 無制限中級免許（Intermediate Unrestricted License）を申請するには、17歳以上であり、かつ制限付き中級免許をどのくらいの期間保持している必要がありますか？
  choices:
    A: 90日間
    B: 180日間
    C: 1年間
    D: 2年間
  answer: C
  explanation: 制限付き中級免許から無制限中級免許へ申請するには、17歳以上であり、かつ制限付き中級免許を1年間保持している必要があります。
- id: 185
  category: penalties_and_points
  question: 制限付き中級免許から無制限中級免許への移行を妨げる要因は次のうちどれですか？
  choices:
    A: 安全ベルト（シートベルト）違反が1回あること
    B: 運転記録に4ポイント累積していること
    C: 自身の過失による交通事故を起こしたこと
    D: 追加の筆記試験を受けなかったこと
  answer: C
  explanation: 無制限中級免許に移行するには、自身の過失による交通事故を起こしていないことが条件となります。（また、安全ベルト違反が2回以上、または6ポイントを超える累積がないことも条件であり、追加の試験は必要ありません）。
- id: 186
  category: license_system
  question: 2018年7月1日より、21歳未満の人に発行されるすべての免許証はどのような形式で印刷されていますか？
  choices:
    A: 横型（水平）形式
    B: 縦型（垂直）形式
    C: 正方形形式
    D: ホログラム形式
  answer: B
  explanation: 2018年7月1日以降、21歳未満の人に発行されるすべての免許証は縦型（垂直）形式になっています。
- id: 187
  category: driver_responsibility
  question: 運転免許証の有効期限が切れた後、運転が許可される猶予期間はどのくらいですか？
  choices:
    A: 10日間
    B: 30日間
    C: 6ヶ月間
    D: 猶予期間はない
  answer: D
  explanation: 「猶予期間」はありません。免許証の有効期限が切れると、自動車やオートバイを運転する権利はなくなります。
- id: 188
  category: license_system
  question: 15歳で、以前住んでいた州の有効な許可証を持っている場合、その州外での許可証保持期間をテネシー州の180日間の要件に含めるにはどうすればよいですか？
  choices:
    A: 申請日から30日以内に発行された、以前の州の公的な運転記録を提出する必要がある
    B: 直ちに新しい路上試験を受ける必要がある
    C: 以前の州の知事に権利放棄書（ウェイバー）に署名してもらう必要がある
    D: いかなる状況においても、州外の許可証保持期間はカウントされない
  answer: A
  explanation: テネシー州での申請日の直前30日以内に発行された以前の州の公的な運転記録を提出できる場合に限り、その州で許可証を保持していた期間を180日間の期間に含めることができます。
- id: 189
  category: driver_responsibility
  question: 連邦運転者プライバシー保護法（DPPA）に基づき、安全局（Department of Safety）は以下がない限り、メーリングリスト用に個人情報を開示することはありません。
  choices:
    A: 裁判所の命令
    B: 本人の明示的な同意
    C: バックグラウンドチェック（身元調査）
    D: 10ドルの事務手数料
  answer: B
  explanation: 連邦運転者プライバシー保護法（DPPA）は、運転者の「明示的な同意」なしに、自動車記録から個人情報を配布または開示することを禁止しています。
- id: 190
  category: license_system
  question: 18歳未満の新しい居住者が以前の州の公的な運転記録を提出する場合、テネシー州での申請から何日以内に発行されたものである必要がありますか？
  choices:
    A: 10日以内
    B: 15日以内
    C: 30日以内
    D: 60日以内
  answer: C
  explanation: 公的な運転記録は、テネシー州での申請日の直前30日以内に発行されたものである必要があります。
- id: 191
  category: license_system
  question: 次の免許レベルのうち、制限カード（Restriction Card）を携帯する必要がないものはどれですか？
  choices:
    A: 学習許可証（Learner Permit）
    B: 中級制限付きD級免許（Intermediate Restricted Class D）
    C: 中級無制限D級免許（Intermediate Unrestricted Class D）
    D: 学習許可証と中級制限付き免許の両方
  answer: C
  explanation: 第2段階である中級無制限（IU）D級免許の保持者には、運転に関する制限がありません。したがって、この免許レベルには制限カードは存在しません。
- id: 192
  category: penalties_and_points
  question: 中級制限付き免許を持つティーンエイジャーが、保護者の承認書を偽造して有罪判決を受けた場合、どのような罰則が科されますか？
  choices:
    A: 中級制限期間が90日間延長される
    B: 免許が取り消され、18歳になるまで学習許可証（Learner Permit）が再交付される
    C: 認定された運転教育コースを修了しなければならない
    D: すべての運転資格が6ヶ月間停止される
  answer: B
  explanation: GDL（段階的免許制度）の罰則規定によると、中級制限付き免許の発行後に保護者の承認書を偽造したことが判明した場合、中級制限付き免許は取り消され、そのティーンエイジャーが18歳になるまでは学習許可証のみが再交付されます。
- id: 193
  category: penalties_and_points
  question: 中級制限付き免許を保持している運転者が、2回目の移動違反（moving violation）で有罪判決を受けた場合、どのような罰則が適用されますか？
  choices:
    A: 18歳まで学習許可証を保持しなければならない
    B: 中級制限期間に90日間が追加される
    C: 認定された運転教育コースを修了しなければならない
    D: 免許が180日間停止される
  answer: C
  explanation: GDL罰則規定では、中級制限付き免許の発行後に2回目の移動違反で有罪判決を受けた場合、認定された運転教育コースの修了が義務付けられています。
- id: 194
  category: driver_responsibility
  question: 18歳未満の申請者のために、成人が「未成年者/ティーンエイジャー宣誓供述書および取消フォーム（Minor/Teenage Affidavit
    and Cancellation form）」に署名する場合、どのような責任を負うことになりますか？
  choices:
    A: 常に助手席に同乗しなければならない
    B: 未成年運転者の財政的責任（賠償責任）を負う
    C: 未成年の車両登録費用を支払わなければならない
    D: 未成年者とともに50時間の運転時間を記録しなければならない
  answer: B
  explanation: 未成年者/ティーンエイジャー宣誓供述書は、署名した成人が免許申請に加わり、未成年運転者の行為に対して責任を負うことを確認するものです。これには財政的責任（賠償責任）の引き受けも含まれます。
- id: 195
  category: license_system
  question: 未成年者が二輪免許などの追加の免許区分を申請する場合、親または法的後見人には何が求められますか？
  choices:
    A: その免許区分のために2枚目のティーンエイジャー宣誓供述書に署名する必要がある
    B: 2倍の申請手数料を支払わなければならない
    C: 未成年者と一緒にモーターサイクル安全コースを受講しなければならない
    D: 追加の書類は必要ない
  answer: A
  explanation: 未成年者が追加の免許区分（二輪車など）を申請する場合、親または法的後見人は、その免許区分専用の2枚目のティーンエイジャー宣誓供述書に署名する必要があります。
- id: 196
  category: license_system
  question: 通常の学期中に学校関係者が署名した「義務教育出席証明書（フォーム SF1010）」の有効期限はいつまでですか？
  choices:
    A: 10日間
    B: 14日間
    C: 30日間
    D: 60日間
  answer: C
  explanation: 申請者は、記入済みのフォームの原本を運転免許センター（Driver Service Center）に持参する必要があります。このフォームは、学校関係者が署名した日から30日間のみ有効です。
- id: 197
  category: license_system
  question: 「義務教育出席証明書（フォーム SF1010）」が学年度の最後の30日以内に署名された場合、いつまで受け付けられますか？
  choices:
    A: 学年度の最終日までのみ
    B: 夏休み期間中ずっと、および次年度開始から30日後まで
    C: 署名日からちょうど90日間
    D: 生徒の18歳の誕生日まで
  answer: B
  explanation: 伝統的な夏休み期間中については、学年度の最後の30日以内に署名され、適切に記入されたSF1010フォームは、夏休み期間中ずっと、および次年度の開始から30日後まで受け付けられます。
- id: 198
  category: license_system
  question: 未成年者が免許を申請する際、就学法（school attendance law）の遵守を証明する書類として認められないものはどれですか？
  choices:
    A: 高校の卒業証書の原本
    B: 義務教育出席証明書（フォーム SF1010）
    C: 成績表または学校の成績証明書
    D: ホームスクール（家庭学習）申請者のための、地元の教育長からの手紙
  answer: C
  explanation: 成績表や学校の成績証明書は、この法律の遵守を証明する書類としては認められません。採点基準が多様であるため、運転免許課の職員にはこれらの書類の情報を解釈する権限が与えられていないからです。
- id: 199
  category: penalties_and_points
  question: 15歳以上の生徒が学校を退学した場合、その生徒の運転資格はどうなりますか？
  choices:
    A: 仕事への往復の運転のみに制限される
    B: 安全局（Department of Safety）が生徒の運転資格を停止する
    C: 免許を維持するために罰金を支払わなければならない
    D: 学習許可証（Learner Permit）に格下げされる
  answer: B
  explanation: 15歳以上の生徒が退学した場合、学校は安全局に通知する義務があり、安全局はその生徒の運転資格を停止します。
- id: 200
  category: license_system
  question: 18歳未満の申請者が高校を卒業するか、高卒認定（GED）を取得した場合、どのような種類の免許が発行されますか？
  choices:
    A: 学習許可証（Learner Permit）のみ
    B: 中級制限付き免許（Intermediate Restricted license）
    C: 通常のD級普通運転免許（Class D operator's license）
    D: 困窮時免許（Hardship license）
  answer: C
  explanation: 18歳になる前に高校を卒業するか、GEDを取得した場合は、通常のD級普通運転免許が発行されることがあります。
- id: 201
  category: license_system
  question: 16歳の申請者が他州の免許を保持していた期間が90日未満である場合、中級制限免許（Intermediate Restricted License）を取得するには、有効な学習許可証（Learner
    Permit）または免許を合計でどのくらいの期間保持している必要がありますか？
  choices:
    A: 少なくとも60日間
    B: 少なくとも90日間
    C: 少なくとも180日間
    D: 少なくとも365日間
  answer: C
  explanation: 申請者が他州の免許を保持していた期間が90日未満である場合、運転記録によって、有効な学習許可証（Learner Permit）または免許の区分を合計で少なくとも180日間保持していたことが確認されなければなりません。
- id: 202
  category: penalties_and_points
  question: 学習許可証（Learner Permit）を持つ若者が運転記録に6ポイント以上累積した場合、どのような罰則がありますか？
  choices:
    A: 180日間連続で累積ポイントを6ポイント未満に維持できるまで、許可証を保持し続けなければならない
    B: 18歳になるまで許可証が取り消される
    C: 認定された運転者教育コースを修了しなければならない
    D: 直ちに中級制限免許（Intermediate Restricted License）が発行される
  answer: A
  explanation: 段階的運転免許制度（GDL）の罰則表によると、学習許可証の発行後に6ポイント以上累積した場合、申請者は180日間連続で6ポイント未満の記録を維持できるようになるまで、さらに一定期間学習許可証を保持し続ける必要があります。
- id: 203
  category: penalties_and_points
  question: 中級制限免許（Intermediate Restricted）の期間中に2回目のシートベルト着用義務違反を犯したが、安全局（Department
    of Safety）への通知が中級無制限免許（Intermediate Unrestricted）の発行後になった場合、どうなりますか？
  choices:
    A: 違反は免除され、罰則は適用されない
    B: 免許が永久に取り消される
    C: 90日間、中級制限免許に降格される
    D: 500ドルの罰金を支払わなければならない
  answer: C
  explanation: リストにある違反のいずれかが中級制限免許の期間中に発生したが、安全局（DOS）が中級無制限免許を発行した後まで通知を受け取らなかった場合、その若者は90日間「中級制限免許」に降格されます。
- id: 204
  category: penalties_and_points
  question: 生徒が2回目に学校を中退した場合、どうなりますか？
  choices:
    A: 50ドルの罰金を支払わなければならない
    B: 再度免許を申請できるようになるまで、18歳になるまで待たなければならない
    C: 再申請まで6ヶ月間待たなければならない
    D: 運転資格を永久に失う
  answer: B
  explanation: マニュアルによると、生徒が2回目に中退した場合、再び免許を申請する資格を得るには18歳になるまで待たなければなりません。
- id: 205
  category: license_system
  question: 中退したが、運転資格を取り戻すために学校に戻った生徒の再交付手数料（reinstatement fee）はいくらですか？
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: マニュアルには、学校に戻る生徒は、適切な申請料および免許料に加えて、20ドルの再交付手数料（reinstatement fee）を支払う必要があると記載されています。
- id: 206
  category: penalties_and_points
  question: 学習許可証（Learner Permit）の保持者が運転中に携帯電話を使用しているのが見つかった場合、どのような結果になりますか？
  choices:
    A: 許可証の180日間の停止
    B: 運転記録に6ポイント加算される
    C: 100ドルの罰金
    D: 18歳になるまで許可証が直ちに取り消される
  answer: B
  explanation: 若者が運転中に携帯電話を使用したことで有罪判決を受けた場合の結果には、クラスC軽罪、50ドルの罰金、運転記録への6ポイント加算、および中級制限免許（Intermediate
    Restricted Driver License）の取得資格が90日間遅れることが含まれます。
- id: 207
  category: safe_driving_rules
  question: 運転中のテキストメッセージ送信（texting while driving）違反の最大罰金はいくらですか？
  choices:
    A: $20
    B: $50
    C: $100
    D: $250
  answer: B
  explanation: 運転中のテキストメッセージ送信違反は、50ドルを超えない罰金と、10ドルを超えない裁判費用が科せられる可能性があります。
- id: 208
  category: defensive_driving
  question: マニュアルによると、工事区間（work zone）での事故のほとんどの原因は何ですか？
  choices:
    A: スピード違反
    B: 正面衝突
    C: 追突事故
    D: 脇見運転
  answer: C
  explanation: マニュアルの工事区間の安全に関するヒントには、「車間距離を詰めないでください！工事区間での事故のほとんどは追突事故（rear-end
    collisions）によって引き起こされます」と明記されています。
- id: 209
  category: safe_driving_rules
  question: 工事区間（work zone）に近づく際、車両のヘッドライトはどうすべきですか？
  choices:
    A: 作業員の目をくらませないよう、消灯する
    B: 作業員に自分の存在を知らせるためにパッシングする
    C: 雨が降っている場合のみ点灯する
    D: 区間に入る前に点灯させる
  answer: D
  explanation: マニュアルではドライバーに対し、「区間に入る前にライトを点灯させてください！作業員や他のドライバーから見えやすくするために、車両のヘッドライトを点灯させてください」とアドバイスしています。
- id: 210
  category: license_system
  question: 18歳未満の学習許可証（Learner Permit）保持者に対する運転時間の制限は何ですか？
  choices:
    A: 午後10時から午前6時までの運転禁止
    B: 午後11時から午前6時までの運転禁止
    C: 午後9時から午前5時までの運転禁止
    D: 午前0時から午前6時までの運転禁止
  answer: A
  explanation: 学習許可証（Learner Permit）を保持している18歳未満の人は、午後10時から午前6時までの間の運転が禁止されています。
- id: 211
  category: license_system
  question: 18歳未満の未成年者が制限付き中級免許（Intermediate Restricted license）を申請する前に、ラーナーパーミット（学習許可証）をどのくらいの期間保持する必要がありますか？
  choices:
    A: 最低3ヶ月間
    B: 最低6ヶ月間
    C: 最低9ヶ月間
    D: 最低1年間
  answer: B
  explanation: 18歳未満の人は、制限付き中級免許を申請する前に、少なくとも6ヶ月間ラーナーパーミットを保持していなければなりません。
- id: 212
  category: license_system
  question: ラーナーパーミットの保持者が運転記録に6ポイント以上累積した場合、制限付き中級免許を申請できるようになる前に何をする必要がありますか？
  choices:
    A: 50ドルの再交付手数料を支払う必要がある。
    B: 安全運転講習（ディフェンシブ・ドライビング・コース）を修了する必要がある。
    C: 180日間連続して、運転記録の累積ポイントを6ポイント未満に維持する必要がある。
    D: 18歳になるまで待つ必要がある。
  answer: C
  explanation: ラーナーパーミット保持者が合計6ポイント以上の交通違反を犯した場合、運転記録が180日間連続して6ポイント未満の状態を維持するまで、ラーナーパーミットを持ち続けなければなりません。
- id: 213
  category: safe_driving_rules
  question: 制限付き中級免許の保持者は、特定の例外がない場合、車両に何人の同乗者を乗せることが許可されていますか？
  choices:
    A: 0人
    B: 1人
    C: 2人
    D: 3人
  answer: B
  explanation: 中級免許保持者は、特定の例外（21歳以上の無制限免許保持者の同乗、または保護者の同意書がある兄弟姉妹など）を満たさない限り、同乗者は1名のみに制限されます。
- id: 214
  category: license_system
  question: 制限付き中級免許の保持者は、通常、何時から何時までの間の運転が禁止されていますか？
  choices:
    A: 午後9時から午前6時
    B: 午後10時から午前6時
    C: 午後11時から午前6時
    D: 午前0時から午前5時
  answer: C
  explanation: 制限付き中級免許の保持者は、特定の免除状況に該当しない限り、午後11時から午前6時までの間の運転が禁止されています。
- id: 215
  category: penalties_and_points
  question: 許可された時間外に運転するための偽造された許可証を所持していたことが発覚した制限付き中級免許保持者に対する罰則は何ですか？
  choices:
    A: 50ドルの罰金と運転記録への6ポイントの加算
    B: 免許の取り消し、および18歳になるまでのラーナーパーミットの再発行
    C: 90日間の免許停止
    D: 即時の車両押収
  answer: B
  explanation: 偽造または不正な書面を所持して有罪判決を受けた制限付き中級免許の運転手は、その免許を取り消され、18歳になるまでラーナーパーミットのみが再発行されます。
- id: 216
  category: license_system
  question: 無制限の中級免許を申請する前に、制限付き中級免許をどのくらいの期間保持する必要がありますか？
  choices:
    A: 6ヶ月間
    B: 1年間
    C: 18ヶ月間
    D: 2年間
  answer: B
  explanation: 未成年者は、無制限の中級免許を申請する前に、少なくとも1年間は制限付き中級免許を保持しなければなりません。
- id: 217
  category: sharing_the_road
  question: 高速道路の工事区域における死亡者の5分の4を占めているのは誰ですか？
  choices:
    A: 建設作業員
    B: 歩行者
    C: 運転手
    D: 交通整理員（フラッガー）
  answer: C
  explanation: マニュアルによると、統計では高速道路の工事区域における死亡者の5分の4を運転手が占めていることが示されています。
- id: 218
  category: safe_driving_rules
  question: 制限付き中級免許の保持者は、以下の場合、午前4時から午前6時の間に運転することができます。
  choices:
    A: 友人の家へ行く、または友人の家から帰る場合
    B: 狩猟または釣りに行き来する場合で、有効な狩猟または釣り免許を所持している場合
    C: ジムやフィットネスセンターへ行く場合
    D: 18歳以上の兄弟姉妹が同乗している場合
  answer: B
  explanation: 午後11時から午前6時までの夜間外出禁止令の例外として、午前4時から午前6時の間に狩猟または釣りに行き来する場合で、有効な狩猟または釣り免許を所持している場合があります。
- id: 219
  category: penalties_and_points
  question: 無制限の中級免許の取得資格を得るのが90日間遅れる原因となるのは、次のうちどれですか？
  choices:
    A: 運転記録に4ポイント加算されること
    B: 1回目のシートベルト着用義務違反で有罪判決を受けること
    C: 交通事故の原因となること
    D: 午後10時以降に運転すること
  answer: C
  explanation: 未成年の運転手が交通事故の原因となった場合、6ポイント以上累積した場合、または2回目のシートベルト着用義務違反で有罪判決を受けた場合、無制限の中級免許の取得資格がさらに90日間延期されます。
- id: 220
  category: penalties_and_points
  question: 制限付き中級免許の保持中に未成年の運転手が2回目の走行中の違反（ムービング・バイオレーション）を犯した場合、無制限免許を受け取る前に何をしなければなりませんか？
  choices:
    A: 50ドルの罰金を支払う
    B: さらに6ヶ月間待つ
    C: 承認された運転者教育クラスを修了する
    D: 路上試験を再受験する
  answer: C
  explanation: 制限付き中級免許の保持中に未成年の運転手が2回目の走行中の違反を犯した場合、無制限の中級免許を受け取る前に、承認された運転者教育クラスを修了しなければなりません。
- id: 221
  category: license_system
  question: 学習許可証（クラスPD）を保持しているティーンエイジャーの運転禁止時間帯（カーフュー）は何時ですか？
  choices:
    A: 午後9時から午前5時の間は運転不可
    B: 午後10時から午前6時の間は運転不可
    C: 午後11時から午前6時の間は運転不可
    D: 午前0時から午前6時の間は運転不可
  answer: B
  explanation: 学習許可証（クラスPD）の制限事項では、運転者は午後10時から午前6時の間は運転できないと定められています。
- id: 222
  category: driver_testing
  question: 知識試験（学科試験）に不合格となった後、義務付けられている待機期間はどれくらいですか？
  choices:
    A: 待機期間はない
    B: 1日
    C: 7日
    D: 30日
  answer: B
  explanation: 知識試験に不合格となった後は、1日間の義務的な待機期間が必要です。
- id: 223
  category: driver_testing
  question: 運転免許試験で不正行為が見つかった場合、どうなりますか？
  choices:
    A: 警告を受け、試験を最初からやり直さなければならない
    B: 自動的に不合格となり、7日間は再受験できない
    C: 自動的に不合格となり、30日間は再受験できない
    D: 運転免許の取得が永久に禁止される
  answer: C
  explanation: 義務付けられた試験における受験者のいかなる不正行為も、自動的に不合格となり、その後30日間は再受験が認められません。
- id: 224
  category: driver_testing
  question: 運転免許の視力検査に合格するために必要な最低視力はどれくらいですか？
  choices:
    A: 各眼で20/20の視力
    B: 各眼で20/30の視力
    C: 各眼および両眼でそれぞれ20/40の視力
    D: 少なくとも片方の眼で20/50の視力
  answer: C
  explanation: 受験者は、各眼および両眼でそれぞれ少なくとも20/40の視力が必要です。これは、眼鏡やコンタクトレンズの使用の有無を問いません。
- id: 225
  category: driver_testing
  question: コンピューターによる知識試験中に許可されて「いない」ものはどれですか？
  choices:
    A: スペイン語で試験を受けること
    B: メモや書き込みのない翻訳辞書を使用すること
    C: 韓国語で試験を受けること
    D: 電子辞書やスマートフォンを使用すること
  answer: D
  explanation: 試験中に携帯情報端末（PDA）、スマートフォン、電子辞書、およびその他の類似の電子機器を使用することは許可されていません。
- id: 226
  category: driver_testing
  question: 知識試験のうち、薬物とアルコールに関する問題は何パーセントを占めますか？
  choices:
    A: 10%
    B: 15%
    C: 25%
    D: 50%
  answer: C
  explanation: 知識試験は4つの分野で構成されており、薬物とアルコールに関する問題が試験の25%を占めています。
- id: 227
  category: license_system
  question: 21歳未満の人に発行されるすべての運転免許証の形式（向き）はどうなっていますか？
  choices:
    A: 横型
    B: 縦型
    C: 正方形
    D: 赤色で色分けされた形式
  answer: B
  explanation: 2018年7月1日より、21歳未満の人に発行されるすべての免許証は縦型の形式になっています。
- id: 228
  category: driver_testing
  question: どのような天候条件下では路上試験（実技試験）は行われませんか？
  choices:
    A: 小雨
    B: 曇り空
    C: 豪雨、濃霧、路面凍結などの異常気象
    D: 気温が40度（華氏）未満
  answer: C
  explanation: 路上試験は、異常気象（豪雨、豪雪、濃霧、ひょう、強風、路面凍結など）の際には行われません。
- id: 229
  category: license_system
  question: 中級制限免許（Intermediate Restricted license）を取得するために証明が必要な運転実習時間は何時間ですか？
  choices:
    A: 30時間（うち夜間5時間を含む）
    B: 40時間（うち夜間10時間を含む）
    C: 50時間（うち夜間10時間を含む）
    D: 60時間（うち夜間15時間を含む）
  answer: C
  explanation: 中級制限免許を取得するには、夜間10時間を含む50時間の運転実習経験の証明書を提出する必要があります。
- id: 230
  category: driver_testing
  question: 18歳未満の受験者が学習障害のために口頭での知識試験を希望する場合、何を提出しなければなりませんか？
  choices:
    A: 試験を読み上げるための親または法的保護者
    B: 医師または教育専門家による書面での声明書
    C: 公認の手話通訳者
    D: 高校卒業の証明
  answer: B
  explanation: 口頭試験を希望する受験者が18歳未満の場合、試験を実施する前に、受験者に医学的状態または学習障害があることを記した医師または教育専門家による書面での声明書が必要となります。
- id: 231
  category: driver_testing
  question: 運転免許証または許可証の発行を受けるための最低限の視力要件は何ですか？
  choices:
    A: 各眼で20/20の視力
    B: 各眼で20/30の視力
    C: 各眼および両眼でそれぞれ20/40の視力
    D: 少なくとも片眼で20/50の視力
  answer: C
  explanation: 申請者は、眼鏡やコンタクトレンズの使用の有無にかかわらず、各眼および両眼でそれぞれ少なくとも20/40の視力があることが求められます。
- id: 232
  category: driver_testing
  question: 運転免許の知識試験（学科試験）に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: すぐに再受験できる
    B: 最低1日
    C: 7日間
    D: 30日間
  answer: B
  explanation: 運転免許の知識試験に不合格となった後は、再受験までに最低1日の待機期間が義務付けられています。
- id: 233
  category: driver_testing
  question: 予約した路上試験（実技試験）の時間に5分以上遅れた場合、どうなりますか？
  choices:
    A: 試験の点数が5点減点される
    B: 試験官が乗車前点検を省略する
    C: 試験前に遅延手数料を支払わなければならない
    D: 路上試験はキャンセルされ、予約を取り直す必要がある
  answer: D
  explanation: 予約時間に5分以上遅れた場合、路上試験はキャンセルされ、後日の日程で予約を取り直す必要があります。
- id: 234
  category: driver_testing
  question: 次の気象条件のうち、路上試験が実施されないのはどれですか？
  choices:
    A: 小雨
    B: 中程度の霧
    C: 小雪
    D: 豪雨および雷雨
  answer: D
  explanation: 豪雨、雷雨、濃霧、道路の冠水、積雪や凍結がある場合、または悪天候警報の発令中は、路上試験は実施されません。
- id: 235
  category: vehicle_information
  question: 何年以降に製造または組み立てられた乗用車には、安全ベルト（シートベルト）の装備が義務付けられていますか？
  choices:
    A: 1959年
    B: 1969年
    C: 1979年
    D: 1989年
  answer: B
  explanation: 1969年以降に製造または組み立てられたすべての乗用車には、良好で実用的な状態の安全ベルトが装備されていなければなりません。
- id: 236
  category: vehicle_information
  question: 自動車には何個の白色ヘッドライトの装着が許可されていますか？
  choices:
    A: 正確に2個
    B: 2個以上4個以下
    C: 少なくとも4個
    D: 1個から4個
  answer: B
  explanation: 自動車には、少なくとも2個、かつ4個以下の白色ヘッドライトを装備しなければなりません。
- id: 237
  category: vehicle_information
  question: 乗用車の場合、窓の着色材料（ウィンドウティント）は少なくとも何パーセントの可視光線を透過させる必要がありますか？
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 75%
  answer: B
  explanation: 乗用車の場合、可視光線の透過率が35%未満の材料を窓に取り付けることはできません。
- id: 238
  category: vehicle_information
  question: 乗用車のバンパーは、地上からどの範囲の高さにある必要がありますか？
  choices:
    A: 10〜15インチ
    B: 14〜22インチ
    C: 14〜31インチ
    D: 20〜30インチ
  answer: B
  explanation: 乗用車は、地上から14〜22インチの範囲内にあるバンパーを装備していなければなりません。
- id: 239
  category: driver_testing
  question: 運転試験中、車内に同乗できるのは誰ですか？
  choices:
    A: あなた、試験官、および親または保護者1名
    B: あなたと試験官（またはその他の許可された職員）のみ
    C: あなた、試験官、および通訳者
    D: あなた、試験官、および教習所の指導員
  answer: B
  explanation: 車内への同乗が許可されているのは、あなたと試験官（またはその他の許可された職員）のみです。動物を車に乗せることはできません。
- id: 240
  category: driver_testing
  question: 次の行為のうち、路上試験で即座に不合格となるのはどれですか？
  choices:
    A: 試験官に指示の復唱を求める
    B: いかなる交通法規の違反
    C: 一時停止標識でブレーキを強くかけすぎる
    D: 開始前にフロントガラスの曇りを取り除かない
  answer: B
  explanation: 申請者は、交通法規の違反、協力の欠如、危険な行為、または事故の原因となった場合のいずれかに該当すると、即座に不合格となります。
- id: 241
  category: driver_testing
  question: 再試験のガイドラインによると、技能試験で7〜9個のミスをした場合、再試験を受けるまでに義務付けられている練習期間はどれくらいですか？
  choices:
    A: 翌日
    B: 7日間
    C: 14日間
    D: 30日間
  answer: A
  explanation: 再試験ガイドラインの表4.2によると、7〜9個のミス（減点）があった場合、翌日まで練習期間を設けることが義務付けられています。
- id: 242
  category: driver_testing
  question: 運転試験で自動不合格（即失格）となった場合、または16個以上のミスをした場合、再試験が許可されるまでどのくらいの期間待たなければなりませんか？
  choices:
    A: 翌日
    B: 7日間
    C: 14日間
    D: 30日間
  answer: D
  explanation: 表4.2によると、16個以上のミス（減点）または自動不合格の場合、30日間の義務的な練習期間が必要です。
- id: 243
  category: vehicle_information
  question: 法律により、すべての自動車にはブレーキをかけるための2つの独立した方法が備わっていなければなりません。それは何ですか？
  choices:
    A: 前輪ブレーキと後輪ブレーキ
    B: 通常のフットブレーキとパーキングブレーキ
    C: アンチロックブレーキ（ABS）と標準ブレーキ
    D: ハンドブレーキとエンジンブレーキ
  answer: B
  explanation: 法律により、すべての自動車にはブレーキをかけるための2つの独立した方法が備わっていなければなりません。通常のフットブレーキとパーキングブレーキの両方を備えている必要があります。
- id: 244
  category: driver_testing
  question: 予約された路上試験の時間の何分前までに、運転免許サービスセンター（Driver License Service Center）に到着するように計画すべきですか？
  choices:
    A: 予約時間ちょうど
    B: 少なくとも5分前
    C: 少なくとも15分前
    D: 少なくとも30分前
  answer: C
  explanation: 書類手続きの時間を考慮し、予約時間の少なくとも15分前には運転免許サービスセンターに到着するように計画してください。
- id: 245
  category: vehicle_information
  question: 自動車のフロントガラスに貼る着色フィルム（ティント）に関する規則は何ですか？
  choices:
    A: 可視光線の少なくとも35%を透過しなければならない
    B: 可視光線の50%を透過すれば許可される
    C: フロントガラスにいかなる着色フィルムも貼ってはならない
    D: フロントガラスの上部4インチのみ許可される
  answer: C
  explanation: マニュアルには「いかなる自動車のフロントガラスにも、着色フィルムを貼ってはならない」と記載されています。
- id: 246
  category: driver_testing
  question: 技能試験で16個以上のミスをした場合、または自動不合格となった場合、再試験を受けるまでに義務付けられている練習期間はどれくらいですか？
  choices:
    A: 7日間
    B: 14日間
    C: 30日間
    D: 90日間
  answer: C
  explanation: マニュアルによると、16個以上のミス（減点）または自動不合格の場合、再試験が許可されるまでに30日間の義務的な練習期間が必要です。
- id: 247
  category: driver_testing
  question: 予約された路上試験の時間の何分前までに到着すべきですか？
  choices:
    A: 少なくとも5分前
    B: 少なくとも10分前
    C: 少なくとも15分前
    D: 少なくとも30分前
  answer: C
  explanation: 申請書類の手続き時間を確保するため、予約された路上試験の少なくとも15分前には到着する必要があります。
- id: 248
  category: driver_testing
  question: 路上試験の予約時間に何分以上遅れると、予約を再調整（リスケジュール）しなければならなくなりますか？
  choices:
    A: 5分
    B: 10分
    C: 15分
    D: 20分
  answer: A
  explanation: 円滑なサービスを提供するため、路上試験の予約開始時間に5分以上遅れた場合は、予約を再調整する必要があります。
- id: 249
  category: driver_testing
  question: 15歳から17歳のティーンエイジャーは、どのアプリを使用して、親または法的保護者の監督の下でオンライン筆記試験を受けることができますか？
  choices:
    A: Tennessee Driver Portal App
    B: Tennessee Proctor Identification (PID) App
    C: TDOSHS Secure Test App
    D: Tennessee Teen Driver App
  answer: B
  explanation: 15歳から17歳のティーンエイジャーは、Tennessee Proctor Identification (PID) Appを使用して、試験監督者の監視の下でオンライン筆記試験を受けることができます。
- id: 250
  category: safe_driving_rules
  question: 座席をリクライニングさせた状態、または半リクライニングさせた状態で運転するのが危険なのはなぜですか？
  choices:
    A: シートベルトが外れるリスクが高まるため
    B: 視界と緊急事態への対応能力の両方が低下するため
    C: ステアリングホイール（ハンドル）がロックされる原因となるため
    D: エアバッグの作動を妨げるため
  answer: B
  explanation: マニュアルには「座席をリクライニングまたは半リクライニングさせた状態で運転しないでください。これは危険であり、視界と緊急事態への対応能力の両方を低下させます」と明記されています。
- id: 251
  category: vehicle_information
  question: エアバッグの作動による頭部や首への重大な負傷を防ぐために、ハンドルからどのくらい離れて座るべきですか？
  choices:
    A: 4〜6インチ
    B: 6〜8インチ
    C: 10〜12インチ
    D: 15〜18インチ
  answer: C
  explanation: ハンドルから約10〜12インチ離れて座る必要があります。それより近くに座ると、作動したエアバッグが顎や顔に当たることで、頭部や首に重大な負傷を負う可能性があります。
- id: 252
  category: vehicle_information
  question: シートとステアリングコラムを調整する際、ハンドルの上端はどの高さより高くならないようにすべきですか？
  choices:
    A: 肩の上端
    B: 顎
    C: 鼻
    D: 頭のてっぺん
  answer: A
  explanation: マニュアルには、ハンドルの上端が肩の上端より高くならないように調整すべきであると記載されています。
- id: 253
  category: vehicle_information
  question: 適切に調整されたヘッドレストは、何を防ぐために後頭部と同じ高さに設定する必要がありますか？
  choices:
    A: エアバッグによる負傷
    B: 後方から追突された際のむち打ち症
    C: 運転中の眠気
    D: 死角
  answer: B
  explanation: ヘッドレストを後頭部と同じ高さに適切に調整してください。ヘッドレストは、後方から追突された際のむち打ち症を防ぐために設計されています。
- id: 254
  category: safe_driving_rules
  question: 運転の準備をする際、いつミラーを調整すべきですか？
  choices:
    A: シートを調整する前
    B: シートを正しく調整した後
    C: 低速で走行している間
    D: 死角を確認した後のみ
  answer: B
  explanation: マニュアルでは、シートを正しく調整した後、かつ運転を開始する前に必ずミラーを調整するように指示されています。
- id: 255
  category: vehicle_information
  question: 運転席側（左側）のサイドミラーを正しく調整するには、頭を左側の窓につけ、ミラーをどのように設定すべきですか？
  choices:
    A: 車のリアバンパー全体が見えるようにする
    B: 車両のセンターコンソールが見えるようにする
    C: ミラーの右端に自分の車がわずかに映るようにする
    D: リアウィンドウが完全に枠内に収まるようにする
  answer: C
  explanation: 左側のサイドミラーを調整するには、頭を左側の窓につけ、ミラーの右端に自分の車がわずかに映る程度に設定します。
- id: 256
  category: vehicle_information
  question: 助手席側（右側）のサイドミラーを正しく調整するには、頭をどの位置に置くべきですか？
  choices:
    A: 左側の窓につける
    B: センターコンソールの真上
    C: 助手席側の窓につける
    D: フロントガラスを直視する
  answer: B
  explanation: 助手席側のサイドミラーを調整するには、頭がセンターコンソールの真上に来るように位置を合わせます。
- id: 257
  category: defensive_driving
  question: ミラーを適切に調整していても、右左折や車線変更をしようとする前に必ず行わなければならないことは何ですか？
  choices:
    A: 他のドライバーに警告するためにクラクションを鳴らす
    B: 首を振って死角を確認する
    C: ヘッドライトを2回点滅させる
    D: バックミラーのみに完全に頼る
  answer: B
  explanation: 適切に配置されたミラーであっても、すべての死角をなくすことはできません。右左折や車線変更をしたいときは、必ず目視で死角を確認してください。
- id: 258
  category: safe_driving_rules
  question: 腰ベルト（ラップベルト）は、体に対してどのように正しく装着すべきですか？
  choices:
    A: お腹の上に緩めに通す
    B: 腰骨の上にしっかりと通す
    C: 腹部の高い位置に通す
    D: 太ももの上部と膝の上を通す
  answer: B
  explanation: 腰ベルトは腰骨の上にしっかりと、肩ベルトは肩の上にしっかりと装着する必要があります。
- id: 259
  category: vehicle_information
  question: オートマチック車（AT車）を始動する前に、ブレーキペダルに足を置き、ギアセレクターがどの位置にあることを確認すべきですか？
  choices:
    A: NEUTRAL（ニュートラル）
    B: DRIVE（ドライブ）
    C: PARK（パーキング）
    D: REVERSE（リバース）
  answer: C
  explanation: ブレーキペダルに足を置き、オートマチック車の場合はギアセレクターが「PARK（パーキング）」の位置に、マニュアル車の場合は「NEUTRAL（ニュートラル）」の位置にあることを確認してください。
- id: 260
  category: vehicle_information
  question: オートマチック車（AT車）を始動する前に、ギアセレクターはどの位置にあるべきですか？
  choices:
    A: DRIVE（ドライブ）
    B: REVERSE（リバース）
    C: NEUTRAL（ニュートラル）
    D: PARK（パーキング）
  answer: D
  explanation: オートマチック車を始動する前に、ブレーキペダルに足を置き、ギアセレクターが「PARK（パーキング）」の位置にあることを確認してください。
- id: 261
  category: vehicle_information
  question: マニュアル車（MT車）で、エンジンを始動する前に何をする必要がありますか？
  choices:
    A: クラッチを踏み込む。
    B: ギアを1速に入れる。
    C: アクセルを2回踏む。
    D: ハンドルをロックする。
  answer: A
  explanation: マニュアル車では、エンジンを始動する前にクラッチを踏み込む必要があります。
- id: 262
  category: safe_driving_rules
  question: 通常の日中にロービームを点灯させることは、自車の視認性にどのような影響を与えますか？
  choices:
    A: バッテリーを消耗させ、視認性を低下させる。
    B: 2倍の距離から車両が確認できるようになる。
    C: 3倍の距離から車両が確認できるようになる。
    D: 日中の視認性には影響しない。
  answer: B
  explanation: 通常の日中、ヘッドライトを点灯している車両は、点灯していない場合の2倍の距離から視認できます。
- id: 263
  category: vehicle_information
  question: オートマチック車（AT車）の低速ギア（「L」、「2」、または「1」と表示）は、一般的にどのような場合に使用すべきですか？
  choices:
    A: ブレーキ故障時の緊急減速。
    B: 州間高速道路や自動車専用道路を走行する場合。
    C: 直線でバックする場合。
    D: 通常のストップ・アンド・ゴー（発進と停止の繰り返し）の交通状況。
  answer: A
  explanation: 低速ギアは、ブレーキ故障時の緊急減速、急な山道の走行、滑りやすい路面での低速走行など、特殊な状況や緊急時以外は通常使用されません。
- id: 264
  category: vehicle_information
  question: マニュアル車（MT車）を運転中、クラッチペダルを奥まで踏み込み続ける必要があるのはどのような時ですか？
  choices:
    A: 急な坂道を下っている時はいつでも。
    B: 燃料を節約するために慣性走行（コースティング）している時。
    C: 車両が動いている間は常に。
    D: 停止しようとして速度が時速10マイル（約16km/h）を下回った時。
  answer: D
  explanation: エンジン始動時、ギアチェンジ時、および停止しようとして速度が時速10マイル（10 MPH）を下回った時には、クラッチペダルを奥まで踏み込む必要があります。
- id: 265
  category: safe_driving_rules
  question: ギアをニュートラルにして慣性走行（コースティング）することについて、マニュアルにはどのように記載されていますか？
  choices:
    A: 燃料節約のために推奨される。
    B: 違法である。
    C: 急な坂道でのみ行うべきである。
    D: 最も安全な減速方法である。
  answer: B
  explanation: マニュアルには、「ギアをニュートラルにして慣性走行（コースティング）したり（これは違法です）、ギアチェンジ時以外にクラッチペダルを踏み込んだまま走行したりしないでください」と記載されています。
- id: 266
  category: safe_driving_rules
  question: ステアリングロック（ハンドルロック）機能付きの車両を運転する際、運転者が守らなければならない基本ルールは何ですか？
  choices:
    A: イグニッションを切る前に、必ずハンドルをロックする。
    B: 車両の走行中にイグニッションを「LOCK」の位置に回してはならない。
    C: 坂道に駐車している間は、絶対にインターロックシステムを使用してはならない。
    D: 常に片手をインターロック解除ボタンに置いておく。
  answer: B
  explanation: 基本的なルールは、車両の走行中にイグニッションを「LOCK」の位置に回さないことです。ハンドルがロックされ、車両の制御ができなくなるためです。
- id: 267
  category: safe_driving_rules
  question: 肘や腕をドアに乗せたり、窓の外に出したりして運転することを避けるべきなのはなぜですか？
  choices:
    A: ハンドルがロックされる原因になるため。
    B: テネシー州では違法であるため。
    C: ハンドルを完全に制御できなくなり、側面衝突（サイドスワイプ）の際に腕を失う可能性があるため。
    D: サイドエアバッグの作動を妨げるため。
  answer: C
  explanation: 肘や腕をドアに乗せたり、窓の外に出したりして運転する習慣をつけないでください。ハンドルを完全に制御できなくなるだけでなく、側面衝突（サイドスワイプ）の際に腕を失う恐れがあります。
- id: 268
  category: safe_driving_rules
  question: エアバッグの作動による怪我を防ぐために推奨されるハンドルの握り方はどれですか？
  choices:
    A: 10時と2時の位置
    B: 8時と4時の位置
    C: 9時と3時の位置
    D: 12時と6時の位置
  answer: C
  explanation: 運転者はハンドルの左手を9時の位置に、右手を3時の位置に置く必要があります。この位置は、事故の際のエアバッグ作動による怪我を防ぐのに役立ちます。
- id: 269
  category: safe_driving_rules
  question: ハンドル操作や右左折の際に腕を交差させることが推奨されないのはなぜですか？
  choices:
    A: 車両が意図せず加速する原因になるため。
    B: 違法であり、運転免許試験で不合格になるため。
    C: 運転者が方向指示器（ウィンカー）を使えなくなるため。
    D: 衣類や装飾品が安全なハンドル操作を妨げたり、エアバッグ作動時の怪我を悪化させたりする可能性があるため。
  answer: D
  explanation: ハンドル操作や右左折の際に腕を交差させないでください。腕を交差させると、衣類や装飾品が安全なハンドル操作を妨げる可能性があり、またエアバッグが作動した場合により深刻な怪我を負うことになります。
- id: 270
  category: safe_driving_rules
  question: 通常の日常的な運転において、送りハンドル（プッシュ・プル法）がクロスハンドル（ハンド・オーバー・ハンド法）よりも推奨されるのはなぜですか？
  choices:
    A: 緊急時に素早くハンドルを動かせるため。
    B: 操作の間中、両手を常にハンドルに置いておけるため。
    C: ハンドルを回すのに必要な力が少なくて済むため。
    D: パワーステアリング車で機能する唯一の方法であるため。
  answer: B
  explanation: 送りハンドル（プッシュ・プル法）は、ハンドルの回転動作を緩やかにし、よりスムーズで安全な右左折を可能にするため推奨されます。また、操作の間中、両手を常にハンドルに置いておくことができます。
- id: 271
  category: safe_driving_rules
  question: オートマチック車を後退（バック）させる際、適切な手の位置と姿勢はどれですか？
  choices:
    A: 左手でステアリングホイールの12時の位置を握り、体を右に向け、右腕をシートの背もたれにかける。
    B: ステアリングホイールの9時と3時の位置を握り、バックミラーを確認する。
    C: 右手でステアリングホイールの6時の位置を握り、運転席側の窓から外を見る。
    D: 両手をハンドルに置いたまま、バックカメラのみに頼る。
  answer: A
  explanation: 後退する際は、左手でステアリングホイールの12時の位置を握り、体を右に向け、右腕をシートの背もたれにかけ、肩越しにリアウィンドウから後方を確認します。
- id: 272
  category: driver_responsibility
  question: 車のエンジンから排出される一酸化炭素ガスについて、正しいものはどれですか？
  choices:
    A: 漏れを運転者に警告するような、強くて独特な臭いがある。
    B: 車内に漏れ出した際、濃い黒煙として見える。
    C: 閉め切ったガレージに駐車している場合にのみ危険である。
    D: 味も臭いもなく、目に見えないが、死に至る可能性がある。
  answer: D
  explanation: 車のエンジンから出る一酸化炭素ガスは、無味、無臭、無色ですが、死に至る可能性があります。一般的に、ヒーターの使用中、排気システムの故障時、または渋滞中に漏れ出すことがあります。
- id: 273
  category: defensive_driving
  question: マニュアルによると、テネシー州で毎年記録される最も一般的な事故の種類は何ですか？
  choices:
    A: 正面衝突事故
    B: 側面接触事故（サイドスワイプ）
    C: 追突事故
    D: 交差点での側面衝突事故（Tボーン衝突）
  answer: C
  explanation: ほとんどの州と同様に、テネシー州では追突事故が毎年記録される最も一般的な事故の種類であると報告されています。
- id: 274
  category: safe_driving_rules
  question: 適切な駐車のために縁石に停車する場合、縁石からどのくらいまで近づける必要がありますか？
  choices:
    A: 6インチ（約15cm）以内
    B: 12インチ（約30cm）以内
    C: 18インチ（約45cm）以内
    D: 24インチ（約60cm）以内
  answer: C
  explanation: 縁石に停車する場合、適切な駐車のために縁石から18インチ（約45cm）以内に移動してください。
- id: 275
  category: safe_driving_rules
  question: 車内での一酸化炭素中毒を避けるための推奨される方法はどれですか？
  choices:
    A: 混雑した交通の中では、外気導入ベントを開けておく。
    B: 暖機運転のため、閉め切ったガレージでエンジンをかけたままにする。
    C: 窓を閉めた状態で停車中の車内で、ヒーターやエアコンを使用しない。
    D: ガスの臭いがする場合のみ、排気システムを点検する。
  answer: C
  explanation: マニュアルには、一酸化炭素中毒を避けるために「窓を閉めた状態で停車中の車内でヒーターやエアコンを使用しないこと」と記載されています。
- id: 276
  category: vehicle_information
  question: 一酸化炭素ガスの特徴は何ですか？
  choices:
    A: 強くて甘い臭いがする。
    B: 濃い黒煙として見える。
    C: 味も臭いもなく、目に見えない。
    D: 腐った卵のような臭いがする。
  answer: C
  explanation: マニュアルによると、車のエンジンから出る一酸化炭素ガスは「無味、無臭、無色」であるため、死に至る可能性があります。
- id: 277
  category: safe_driving_rules
  question: 2019年に施行された「ハンズフリー・テネシー法（Hands Free Tennessee law）」に基づき、運転者にとって違法となる行為はどれですか？
  choices:
    A: ハンズフリーのナビゲーションデバイスを使用すること。
    B: シートベルトで適切に固定されなくなるような方法で、携帯電話に手を伸ばすこと。
    C: 車両情報システムのディスプレイを使用すること。
    D: 車両後方を確認するための視覚ディスプレイを見ること。
  answer: B
  explanation: 公法第412号により、「運転者が着席した運転姿勢を維持できなくなったり、シートベルトで適切に固定されなくなったりするような方法で、携帯電話やモバイルデバイスに手を伸ばすこと」は違法とされています。
- id: 278
  category: safe_driving_rules
  question: 点滅信号が作動している標識のあるスクールゾーンにおいて、18歳以上の運転者の携帯電話使用に関する法律はどうなっていますか？
  choices:
    A: ハンズフリーを含め、すべての電話使用が厳格に禁止されている。
    B: 手持ちでの使用は違反だが、ハンズフリーモードは許可されている。
    C: 時速15マイル以下で走行している場合は、手持ちでの使用が許可されている。
    D: テキスト送信のみが禁止されており、手持ちでの通話は許可されている。
  answer: B
  explanation: マニュアルには、点滅信号が作動している標識のあるスクールゾーンで18歳以上の者が手持ちで携帯電話を使用することは違反ですが、「ハンズフリーモードで使用されている場合は例外である」と記載されています。
- id: 279
  category: vehicle_information
  question: 車両の走行中、運転者から見える位置に設置することが許可されているビデオ機器はどれですか？
  choices:
    A: テレビ放送を表示している画面。
    B: 録画された映画を再生しているモニター。
    C: グローバル・ポジショニング・デバイス（GPS）。
    D: ライブ映像を配信しているタブレット。
  answer: C
  explanation: 州法では、運転者に見える位置にテレビやビデオ信号を表示するビデオモニターを設置することを禁止していますが、「ナビゲーションまたはグローバル・ポジショニング・デバイス（GPS）などは禁止されていません」。
- id: 280
  category: safe_driving_rules
  question: テネシー州のシートベルト法に基づき、走行中の車両のフロントシート（前部座席）でシートベルトの着用が義務付けられているのは誰ですか？
  choices:
    A: 運転者のみ。
    B: 18歳未満の同乗者のみ。
    C: すべての運転者およびフロントシートのすべての同乗者。
    D: 運転者および17歳以下の同乗者のみ。
  answer: C
  explanation: マニュアルには次のように記載されています。「車両が走行している間は常に、すべての運転者およびフロントシート（前部座席）のすべての同乗者にシートベルトの着用が義務付けられています。」
- id: 281
  category: safe_driving_rules
  question: テネシー州において、後部座席の乗員がシートベルトを着用しなければならないのは、どのような場合ですか？
  choices:
    A: 17歳未満の場合。
    B: 18歳以上の場合。
    C: 運転席の真後ろに座っている場合。
    D: 2010年以降に製造された車両に乗っている場合。
  answer: A
  explanation: 後部座席の乗員に対するシートベルトの着用は、「乗員が17歳未満である場合」に義務付けられています。後部座席の乗員が18歳以上の場合は、この規定は適用されません。
- id: 282
  category: safe_driving_rules
  question: 1歳未満、または体重が20ポンド（約9kg）未満の子供には、どのような種類のチャイルドシート（child restraint system）が必要ですか？
  choices:
    A: 前向きのチャイルドシート。
    B: 後ろ向きのチャイルドシート。
    C: ベルト固定式のジュニアシート（booster seat）。
    D: 標準的な大人用シートベルト。
  answer: B
  explanation: マニュアルには次のように規定されています。「1歳未満の子供、または体重が20ポンド未満の子供は、車の後方を向いたチャイルドシート（後ろ向きチャイルドシート）に乗せなければならない。」
- id: 283
  category: safe_driving_rules
  question: 4歳から8歳までで、身長が4フィート9インチ（約145cm）未満の子供は、どのように固定しなければなりませんか？
  choices:
    A: 後ろ向きのチャイルドシート。
    B: 前向きのチャイルドシート。
    C: ベルト固定式のジュニアシート（booster seat）システム。
    D: 標準的なシートベルトを着用して助手席に座る。
  answer: C
  explanation: 4歳から8歳までで、身長が4フィート9インチ未満の子供は、ジュニアシート（booster seat）を使用し、シートベルトを着用しなければなりません。
- id: 284
  category: driver_responsibility
  question: 16歳未満の子供が車内で適切に固定されていない場合、一般的に誰が責任を問われ、罰金を科される可能性がありますか？
  choices:
    A: その子供。
    B: 車両の運転手。
    C: その場にいなくても、車両の所有者。
    D: 車両の製造メーカー。
  answer: B
  explanation: 法律により、16歳までの子供の保護責任は運転手にあると定められています。適切に固定されていない場合、運転手は起訴され、50ドルの罰金を科される可能性があります。
- id: 285
  category: driver_responsibility
  question: 子供の親または法定後見人が車内に同乗しているが、運転はしていない場合、子供が適切に輸送されていることを確認する責任は誰にありますか？
  choices:
    A: 運転手。
    B: 親または法定後見人。
    C: 運転手と親の両方が等しく責任を負う。
    D: その子供。
  answer: B
  explanation: マニュアルには次のように記されています。「子供の親または法定後見人が車内に同乗しているが運転していない場合、その親または法定後見人が、子供が適切に輸送されていることを確認する責任を負い、不遵守の場合は罰金を科される可能性がある。」
- id: 286
  category: defensive_driving
  question: 衝突事故の際、車外に放出された場合に死亡する確率はどのくらいですか？
  choices:
    A: 2分の1。
    B: 4分の1。
    C: 8分の1。
    D: 10分の1。
  answer: C
  explanation: シートベルトに関する事実（Safety Belt Facts）のセクションによると、「衝突事故で車外に放出されて死亡する確率は8分の1である」とされています。
- id: 287
  category: safe_driving_rules
  question: 妊婦は車両のシートベルトをどのように着用すべきですか？
  choices:
    A: 腰ベルトは腹部の上に、肩ベルトは背中の後ろに通す。
    B: 腰ベルトは腹部の下に、肩ベルトは腹部の上を通す。
    C: 腰ベルトのみを、腹部の真上に着用する。
    D: 肩ベルトのみを、腕の下に通して着用する。
  answer: B
  explanation: マニュアルでは次のように指示されています。「妊婦は腰ベルトを腹部の下に、肩ベルトを腹部の上を通るように着用すべきである。」
- id: 288
  category: penalties_and_points
  question: 車両の走行中に、携帯電話を手で持ってメッセージの送信や閲覧を行った運転手に科される最大罰金額はいくらですか（裁判費用を除く）？
  choices:
    A: 10ドル。
    B: 25ドル。
    C: 50ドル。
    D: 100ドル。
  answer: C
  explanation: 走行中に携帯電話を手で持ってメッセージの送信や閲覧を行う違反は、「50ドルを超えない範囲の罰金、および10ドルを超えない範囲の裁判費用」が科される可能性があります。
- id: 289
  category: penalties_and_points
  question: 9歳未満、または身長が4フィート9インチ未満の子供に対して、チャイルドシートやジュニアシートを使用しなかった運転手への罰則は何ですか？
  choices:
    A: クラスA軽罪および免許停止。
    B: クラスC軽罪、講習への出席義務、および諸費用・罰金の支払い。
    C: 他の罰則なしで、単純に10ドルの罰金。
    D: 初犯は警告、2回目は50ドルの罰金。
  answer: B
  explanation: 9歳未満または身長4フィート9インチ未満の子供にチャイルドシートやジュニアシートを使用しなかった場合の罰則はより厳しく、「運転手はクラスC軽罪で起訴され、子供の安全な輸送に関する講習への出席を義務付けられ、諸費用や罰金の支払いを求められる可能性がある」とされています。
- id: 290
  category: safe_driving_rules
  question: マニュアルによると、衝突事故で車外に放出された乗員は、車内にとどまった乗員と比較して、死亡する確率が何倍高くなりますか？
  choices:
    A: 2倍
    B: 3倍
    C: 4倍
    D: 10倍
  answer: C
  explanation: マニュアルには、車外に放出された乗員は、車内にとどまった乗員に比べて死亡する確率が4倍高いと記されています。
- id: 291
  category: vehicle_information
  question: 車両が側面から衝突された際、シートベルトを着用していない乗員はどうなりますか？
  choices:
    A: 衝突地点に向かって滑る。
    B: 衝突地点から離れる方向に滑る。
    C: 後部座席に押し込まれる。
    D: 車両が動いても静止したままである。
  answer: A
  explanation: 車両が側面から衝突された場合、乗員を含む固定されていないすべてのものは、衝突地点から離れる方向ではなく、衝突地点に向かって滑ります。
- id: 292
  category: safe_driving_rules
  question: 子供がチャイルドシート（乳幼児用補助装置）から、車両標準のラップベルトおよびショルダーベルトの使用に移行できる大きさになったとみなされるのはいつですか？
  choices:
    A: 体重が40ポンドに達したとき。
    B: 少なくとも6歳になったとき。
    C: 背中を座席の背もたれにつけて座り、膝が座席の端で曲がるとき。
    D: 助けを借りずに自分でシートベルトを締めることができるようになったとき。
  answer: C
  explanation: 子供が車両の座席の背もたれに背中をつけて座り、膝が座席の端で曲がるようになれば、車両のラップベルトおよびショルダーベルトを使用するのに十分な大きさであると言えます。
- id: 293
  category: safe_driving_rules
  question: 標準の車両用シートベルトの使用を開始した子供の場合、ラップベルトはどこにしっかりと当たるようにすべきですか？
  choices:
    A: 腹部を横切る位置
    B: 太ももの上部、腰の低い位置でぴったりと
    C: 肋骨を横切る位置
    D: 膝の上に緩めに
  answer: B
  explanation: マニュアルには、ラップベルトは子供の太ももの上部、腰の低い位置にぴったりと固定されるべきであると明記されています。
- id: 294
  category: safe_driving_rules
  question: マニュアルによると、子供は何歳まで車両の後部座席に乗る方が安全であるとされていますか？
  choices:
    A: 8歳以下
    B: 10歳以下
    C: 12歳以下
    D: 15歳以下
  answer: C
  explanation: マニュアルでは、12歳以下の子供は車両の後部座席に乗る方が安全であると強調されています。
- id: 295
  category: vehicle_information
  question: エアバッグが安全に展開するためのスペースを確保するために、運転者がステアリングホイール（ハンドル）から離れて座るべき推奨距離はどれくらいですか？
  choices:
    A: 4〜6インチ
    B: 6〜8インチ
    C: 10〜12インチ
    D: 15〜18インチ
  answer: C
  explanation: 全米高速道路交通安全局（NHTSA）は、胸とエアバッグモジュールの間を10〜12インチ空けることを推奨しています。
- id: 296
  category: penalties_and_points
  question: テネシー州法において、6歳未満の子供がピックアップトラックの荷台に乗ることに関する規則は何ですか？
  choices:
    A: 大人が監督していれば合法である。
    B: いかなる状況下でも違法である。
    C: 郡道においてのみ合法である。
    D: トラックが時速30マイル未満で走行している場合は合法である。
  answer: B
  explanation: テネシー州では、6歳未満の子供をピックアップトラックの荷台に乗せることは、いかなる状況下でも違法です。
- id: 297
  category: safe_driving_rules
  question: 6歳から12歳の子供をピックアップトラックの荷台に乗せることが法律で禁止されているのは、どのような種類の道路ですか？
  choices:
    A: すべての州道または州間高速道路
    B: すべての私道
    C: すべての未舗装路
    D: すべての住宅のドライブウェイ
  answer: A
  explanation: 6歳から12歳の子供をピックアップトラックの荷台に乗せることは、すべての州道または州間高速道路において法律で禁止されています。
- id: 298
  category: safe_driving_rules
  question: 子供がピックアップトラックの荷台に乗ることが許可される例外は、次のうちどれですか？
  choices:
    A: 学校の行事に向かうとき
    B: 農業活動に従事しているとき
    C: キャビン（車内）に座席が残っていないとき
    D: 州立公園へ運転しているとき
  answer: B
  explanation: 子供がピックアップトラックの荷台に乗ることを禁止する法律の例外の一つは、その子供が農業活動に従事している場合です。
- id: 299
  category: penalties_and_points
  question: 何歳未満の子供を故意に自動車内に放置（置き去り）にすることは違反となりますか？
  choices:
    A: 5歳
    B: 7歳
    C: 9歳
    D: 12歳
  answer: B
  explanation: 7歳未満の子供の責任者が、特定の条件下でその子供を故意に自動車内に放置することは違反となります。
- id: 300
  category: safe_driving_rules
  question: 7歳未満の子供がエンジンのかかった自動車内に残される場合、少なくとも何歳以上の人が付き添っていなければなりませんか？
  choices:
    A: 10歳
    B: 13歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: 法律では、その子供は少なくとも13歳以上の人によって自動車内で監督されていなければならないと定められています。
- id: 301
  category: penalties_and_points
  question: 違法な条件下で子供を自動車内に放置した初犯の罰則は何ですか？
  choices:
    A: クラスC軽罪および50ドルの罰金
    B: クラスB軽罪および200ドルの罰金
    C: クラスA軽罪および500ドルの罰金
    D: 重罪（フェロニー）の起訴および免許停止
  answer: B
  explanation: この条項の違反はクラスB軽罪（Class B misdemeanor）とみなされ、初犯の場合は200ドルの罰金のみが科せられます。
- id: 302
  category: safe_driving_rules
  question: マニュアルによると、シートベルトを着用していない場合、衝突事故で死亡する確率は何倍高くなりますか？
  choices:
    A: 5倍
    B: 10倍
    C: 20倍
    D: 32倍
  answer: D
  explanation: シートベルトを着用していない乗員は、着用している場合に比べて衝突事故で死亡する確率が32倍高くなります。
- id: 303
  category: vehicle_information
  question: 助手席にエアバッグが装備されているピックアップトラックの助手席に子供を乗せなければならない場合、どうすべきですか？
  choices:
    A: 車両のエンジンを切る。
    B: 座席をできるだけ後ろに下げ、子供に正しくシートベルトを着用させる。
    C: 子供を大人の膝の上に座らせる。
    D: 子供を後ろ向きのチャイルドシートに乗せる。
  answer: B
  explanation: 助手席エアバッグを装備したピックアップトラックなどの車両で、どうしても子供を助手席に乗せる必要がある場合は、座席をできるだけ後ろに下げ、子供に正しくシートベルトを着用させなければなりません。
- id: 304
  category: safe_driving_rules
  question: 外気温が73度（華氏）の穏やかな日に、SUVの車内はわずか10分間で何度まで上がる可能性がありますか？
  choices:
    A: 85度
    B: 90度
    C: 100度
    D: 120度
  answer: C
  explanation: マニュアルによると、外気温が73度（約23度）の穏やかな日であっても、SUVの車内は10分間で100度（約38度）まで上昇することがあります。
- id: 305
  category: penalties_and_points
  question: 子供を車内に放置したことに関するクラスA軽罪の最大罰則は何ですか？
  choices:
    A: 6ヶ月の禁錮および1,000ドルの罰金
    B: 11ヶ月29日の禁錮、および/または最大2,500ドルの罰金
    C: 1年から5年の懲役
    D: 15年から60年の懲役
  answer: B
  explanation: クラスA軽罪（Class A Misdemeanor）には、11ヶ月29日以内の禁錮、または最大2,500ドルの罰金、あるいはその両方が科せられます。
- id: 306
  category: safe_driving_rules
  question: エアバッグが装備されている車両で、12歳以下の子供が乗るのに最も安全な場所はどこですか？
  choices:
    A: 助手席
    B: 後部座席
    C: 前部ベンチシートの中央
    D: ピックアップトラックの荷台
  answer: B
  explanation: マニュアルには、エアバッグ装備車両において12歳以下の子供が乗るのに最も安全な場所は後部座席であると記載されています。
- id: 307
  category: signs_and_signals
  question: 交通事故や有害物質の流出などのインシデント管理用交通規制標識には、どの色が使用されますか？
  choices:
    A: オレンジ色
    B: 蛍光ピンク
    C: 茶色
    D: 赤色
  answer: B
  explanation: 蛍光ピンク（「コーラル」と呼ばれることもあります）は、交通事故、山火事、洪水、有害物質の流出などのインシデントが発生した際の交通規制標識に使用されます。
- id: 308
  category: signs_and_signals
  question: 茶色の交通標識は何を示していますか？
  choices:
    A: 公共のレクリエーションエリアや文化的関心地点
    B: 高速道路の工事や迂回路
    C: 許可された駐車規制
    D: 警察サービスや休憩所
  answer: A
  explanation: 茶色は、レクリエーションや文化的関心のある地点に関連する案内情報の背景色として使用されます。
- id: 309
  category: signs_and_signals
  question: 八角形の交通標識はどういう意味ですか？
  choices:
    A: 進路を譲れ（Yield）
    B: この先に踏切あり
    C: 一時停止（Stop）
    D: この先にスクールゾーンあり
  answer: C
  explanation: 八角形は道路上で唯一の8辺の標識です。常に赤地に白文字で、車両を完全に停止させなければならないことを示します。
- id: 310
  category: signs_and_signals
  question: 円形（丸型）の交通標識は、何に近づいていることを示していますか？
  choices:
    A: 四差路の交差点
    B: 鉄道の踏切
    C: 病院区域
    D: ラウンドアバウト（環状交差点）
  answer: B
  explanation: 円形の標識は常に鉄道の踏切に近づいていることを意味し、減速しなければなりません。
- id: 311
  category: safe_driving_rules
  question: 道路工事の作業員が進むように指示していますが、信号機が赤である場合、どうすべきですか？
  choices:
    A: 信号が青に変わるまで待ってから進む。
    B: 工事作業員の指示に従って進む。
    C: 路肩に寄せて警察官を待つ。
    D: 他のドライバーに警告するためにクラクションを鳴らす。
  answer: B
  explanation: ドライバーは、信号機や標識の指示と異なる場合であっても、法執行官、道路工事関係者、または学童擁護員の指示に従わなければなりません。
- id: 312
  category: signs_and_signals
  question: 三角形の「譲れ（Yield）」の標識に近づいた際、交差する道路から他の車両が接近している場合、どうしなければなりませんか？
  choices:
    A: それらの車両の前で合流するために加速する。
    B: 速度を維持し、クラクションを鳴らす。
    C: 停止して、接近してくる車両を待つ。
    D: 自分に優先権があるため、停止せずに進む。
  answer: C
  explanation: 三角形の「譲れ（Yield）」の標識は、交差する道路の左右から他の車両が接近している場合、停止して待たなければならないことを意味します。
- id: 313
  category: signs_and_signals
  question: 青色の道路標識は何を示していますか？
  choices:
    A: 工事区域
    B: 警察や休憩所などのドライバー向けサービス
    C: 一般的な警告
    D: 許可された駐車規制
  answer: B
  explanation: 青色は、ドライバー向けサービス（警察サービスや休憩所を含む）に関する案内標識や、緊急ルートマーカーの背景色として使用されます。
- id: 314
  category: safe_driving_rules
  question: チャイルドシートの使用規則によると、子供を車の後ろ向きに座らせるべきなのはどのような場合ですか？
  choices:
    A: 子供が1歳未満で、体重が20ポンド（約9kg）未満の場合。
    B: 子供が1歳から3歳の間の場合。
    C: 子供の体重が20ポンド（約9kg）を超える場合。
    D: 子供が助手席に乗っている場合。
  answer: A
  explanation: チャイルドシート（幼児用補助装置）を使用する際、体重が20ポンド未満かつ1歳未満の子供は、車の進行方向に対して後ろ向きに座らせる必要があります。
- id: 315
  category: signs_and_signals
  question: 一時停止（STOP）標識の下に配置された「ALL WAY」と書かれた赤い長方形の標識は何を意味しますか？
  choices:
    A: 交差する側の交通のみが停止しなければならない。
    B: この交差点に接近するすべての交通が停止しなければならない。
    C: 道が空いていれば停止せずに進んでもよい。
    D: この先の道路はすべての交通に対して閉鎖されている。
  answer: B
  explanation: 一時停止標識の下に追加された「ALL WAY」と書かれた赤い長方形は、その交差点に進入するすべての方向の車両が停止しなければならないことを意味します。
- id: 316
  category: signs_and_signals
  question: 三角形の「譲れ（Yield）」の標識に近づく際、どうすべきですか？
  choices:
    A: 交通状況に関わらず、常に完全に停止する。
    B: 交差する交通とスムーズに合流するために加速する。
    C: 他の車が来ていない場合は、速度を落とし、注意して交差点に進入する。
    D: 信号機がある場合にのみ停止する。
  answer: C
  explanation: マニュアルによると、「譲れ（Yield）」の標識では、他の車が来ていないことが確実であれば完全に停止する必要はありませんが、速度を落とし（徐行し）、注意して交差点に進入しなければなりません。
- id: 317
  category: signs_and_signals
  question: 大きな「X」字型の鉄道踏切標識（クロスパーク）のすぐ下に配置されている小さな標識の目的は何ですか？
  choices:
    A: 踏切の制限速度を示している。
    B: その踏切にある線路の数を示している。
    C: 通常列車が通過する正確な時間を警告している。
    D: 次の幹線道路の交差点までの距離を示している。
  answer: B
  explanation: マニュアルには、クロスパークのすぐ下の支柱に配置された小さな標識は、その踏切における線路の数を示していると記されています。
- id: 318
  category: safe_driving_rules
  question: マニュアルによると、踏切で列車より先に渡ろうと「競争」してはいけないのはなぜですか？
  choices:
    A: 列車は日中のみ優先権があるから。
    B: 通常、列車の速度を見誤るから。
    C: まず停止せずに線路を渡ることは違法だから。
    D: 車両のエンジンが線路上で停止してしまうから。
  answer: B
  explanation: マニュアルはドライバーに対し、「決して列車より先に渡ろうとしないでください。通常、その速度を見誤ることになります」と明確に警告しています。
- id: 319
  category: signs_and_signals
  question: 三角形の「追い越し禁止車線（No Passing Zone）」標識は、通常道路のどこに設置されていますか？
  choices:
    A: 道路の右側。
    B: 中央車線の真上に吊り下げられている。
    C: 道路の左側。
    D: 路面にペイントされたシンボルとして。
  answer: C
  explanation: マニュアルによると、三角形の「追い越し禁止車線（No Passing Zone）」標識は黄色またはオレンジ色で、道路の左側に設置されます。
- id: 320
  category: signs_and_signals
  question: 「右左折（Turn）」の警告標識と「カーブ（Curve）」の警告標識の違いは何ですか？
  choices:
    A: 右左折標識は推奨速度が30 mph（約48 km/h）以下の場合に使用され、カーブ標識は30〜55 mphの間の場合に使用される。
    B: 右左折標識はオレンジ色で、カーブ標識は黄色である。
    C: 右左折標識は行き止まりを示し、カーブ標識は曲がりくねった道を示す。
    D: 右左折標識は右折専用で、カーブ標識は左折専用である。
  answer: A
  explanation: マニュアルによると、右左折（Turn）標識は推奨速度が30 mph以下の曲がり角を示すために使用され、カーブ（Curve）標識は推奨速度が30〜55
    mphの範囲のカーブを示すために使用されます。
- id: 321
  category: defensive_driving
  question: 山岳地帯で落石注意の警告標識を見かけた際、何に注意すべきですか？
  choices:
    A: 頭上から車両に直接落ちてくる岩。
    B: すでに道路上にある可能性のある岩。
    C: 砂利を降ろしている建設車両。
    D: 跨道橋から岩を投げている歩行者。
  answer: B
  explanation: マニュアルには、この標識は「頭上から当たってくるかもしれない岩ではなく、道路上にあるかもしれない岩について警告している。山ではなく、路面を注視すること」と明記されています。
- id: 322
  category: sharing_the_road
  question: 本線への合流車両があることを知らせる警告標識を見かけた際、どうすべきですか？
  choices:
    A: 合流してくる車両をブロックするために加速する。
    B: 合流車両に譲るよう警告するためにクラクションを鳴らす。
    C: 可能であれば別の車線に移動し、合流するドライバーに道を譲る。
    D: 完全に停止し、他の車両を合流させる。
  answer: C
  explanation: マニュアルでは、後方を確認した後、可能であれば別の車線に移動して、合流するドライバーがスムーズに進めるようにすることを推奨しています。
- id: 323
  category: signs_and_signals
  question: 工事、保守、または緊急作業の標識は、一般的にどのような色と形をしていますか？
  choices:
    A: 赤と白の三角形。
    B: 黄色と黒の円形。
    C: 緑と白の長方形。
    D: オレンジ色に黒の文字または記号で、ひし形または長方形。
  answer: D
  explanation: マニュアルによると、作業区域の標識は一般的にひし形または長方形で、オレンジ色に黒の文字または記号が使われています。
- id: 324
  category: safe_driving_rules
  question: バリケードやコーンなどの規制材によって誘導されている工事区域を通過する際、どのように運転すべきですか？
  choices:
    A: 車線の中央を走行し、掲示されている制限速度を守る。
    B: 作業員のためのスペースを空けるため、できるだけコーンに近づいて運転する。
    C: 区域内を最も速く通過できるルートを探すため、頻繁に車線変更を行う。
    D: バリケードから安全な距離を保つため、中央線をまたいで走行する。
  answer: A
  explanation: マニュアルでは、規制材の近くを走行する際は「車線の中央を走行し、掲示されている制限速度を守る」よう指示しています。
- id: 325
  category: safe_driving_rules
  question: 一部のスクールゾーンの制限速度標識は、子供が横断している可能性があることを示すためにどのように制御されていますか？
  choices:
    A: 停止表示板（ストップパドル）を持った交通指導員によって制御されている。
    B: タイムクロックによって制御され、制限速度を表示しながら黄色いライトを点滅させる。
    C: 接近する車両を検知するモーションセンサーによって制御されている。
    D: 常設の赤信号によって制御されている。
  answer: B
  explanation: マニュアルには、このタイプの標識はタイムクロックによって制御され、制限速度を照らし出しながら黄色いライトを点滅させると記載されています。
- id: 326
  category: safe_driving_rules
  question: 各方向に2車線以上ある道路で、一番右側の車線を走行することを義務付ける標識は何を意味していますか？
  choices:
    A: 遅い車を追い越す場合や左折する場合を除き、一番右側の車線を走行しなければならない。
    B: 追い越し中であっても、常に右側の車線を走行しなければならない。
    C: 他の交通よりも遅く走っている場合は、車線をまたいで走行すべきである。
    D: 右側の車線は駐車または緊急時にのみ使用できる。
  answer: A
  explanation: マニュアルでは、この標識は「遅い車を追い越す場合や左折する場合を除き、一番右側の車線を走行しなければならないことを意味する」と説明されています。
- id: 327
  category: sharing_the_road
  question: 工事区域において、薄暗い場所や悪天候下でも視認性を確保するために、交通誘導員、作業員、および警察官が着用している服の色は何色ですか？
  choices:
    A: 濃紺または黒の制服。
    B: 蛍光イエローグリーンの服またはベスト。
    C: 真っ白な反射スーツ。
    D: 迷彩柄のジャケット。
  answer: B
  explanation: マニュアルには、警察官や交通誘導員、作業員は、通常時だけでなく薄暗い場所や悪天候下でも確実に視認されるよう、「蛍光イエローグリーンのベスト」や衣服を着用すると記載されています。
- id: 328
  category: signs_and_signals
  question: 前方で車線が閉鎖されていることを知らせる点滅矢印板を見かけた際、どのような行動をとるべきですか？
  choices:
    A: 工事区域を素早く通過するために加速する。
    B: 開いている車線に合流するのを、可能な限り直前まで待つ。
    C: 標識よりもかなり手前から、開いている車線への合流を開始する。
    D: 直ちに車両を停止させ、交通誘導員の指示を待つ。
  answer: C
  explanation: マニュアルの指示： 「点滅矢印板は、接近するドライバーに車線の閉鎖を警告します。この標識よりもかなり手前から、開いている車線への合流を開始しなければなりません。」
- id: 329
  category: safe_driving_rules
  question: 工事区域内の規制材の近くを走行する際、どうすべきですか？
  choices:
    A: それらを避けるために素早く車線変更する。
    B: 車線の中央を走行し、掲示されている制限速度を守る。
    C: 作業員にスペースを空けるため、路肩を走行する。
    D: 工事区域を早く抜けるために加速する。
  answer: B
  explanation: マニュアルには、工事区域内の規制材の近くを走行する際は、車線の中央を走行し、掲示されている制限速度を守るべきであると記載されています。
- id: 330
  category: vehicle_information
  question: 次の車両のうち、低速車両（SMV）マークを表示している可能性が最も高いのはどれですか？
  choices:
    A: 出動中の緊急車両。
    B: 民間バスや大型トラック。
    C: 農用トラクター、機械、および馬車。
    D: 危険物を運搬している車両。
  answer: C
  explanation: マニュアルによると、農用トラクター、機械、建設機械、馬車などの低速走行車両にSMVマークが表示されていることがあります。
- id: 331
  category: signs_and_signals
  question: 障害物表示板（オブジェクトマーカー）の目的は何ですか？
  choices:
    A: 双方向ハイウェイの中央線をマークするため。
    B: この先に歩行者横断歩道があることを示すため。
    C: 次のハイウェイ出口までの距離を示すため。
    D: 橋の端など、道路の端に近い場所にある物体を警告するため。
  answer: D
  explanation: 障害物表示板は、実際には車道上にはないものの、橋の端やアンダーパスの橋台など、道路の端に非常に近く、標識が必要な物体についてドライバーに警告するものです。
- id: 332
  category: signs_and_signals
  question: 州間高速道路路線番号標識（Interstate Route Marker）には何色が使用されていますか？
  choices:
    A: 緑と白
    B: 青と赤
    C: 黒と白
    D: 黄と黒
  answer: B
  explanation: マニュアルによると、青と赤の標識は、その路線が全米州間国防高速道路網の一部であることを示しています。
- id: 333
  category: signs_and_signals
  question: ガソリンスタンド、レストラン、モーテルなどのサービス施設を案内する標識は何色ですか？
  choices:
    A: 緑
    B: 茶色
    C: 青
    D: オレンジ
  answer: C
  explanation: サービス標識の青色は、サービスステーション、レストラン、モーテルなどのサービス施設へドライバーを案内します。
- id: 334
  category: safe_driving_rules
  question: 青色のハンディキャップシンボルが表示されているスペースに駐車することが法的に許可されているのは誰ですか？
  choices:
    A: 5分未満の駐車をする人なら誰でも。
    B: 妊婦および小さな子供連れの家族。
    C: 傷痍軍人または障害者用のナンバープレート、あるいは特別な障害者用デカール（ステッカー）を掲示している車両。
    D: 65歳以上の高齢ドライバー。
  answer: C
  explanation: 青色のハンディキャップ標識が表示されている駐車スペースは、傷痍軍人または障害者用のナンバープレート、あるいは特別な障害者用デカールを掲示している車両専用に予約されています。それ以外の人による使用は法律で禁止されています。
- id: 335
  category: signs_and_signals
  question: テネシー州の交通量の多い都市部州間高速道路沿いには、緊急用位置確認標識（リファレンスマーカー）はどのくらいの間隔で設置されていますか？
  choices:
    A: 500フィートごと
    B: 1,000フィートごと
    C: 1マイルごと
    D: 5マイルごと
  answer: B
  explanation: ドライバーが自分の位置をより正確に把握できるように、州は交通量の多い都市部の州間高速道路沿いに1,000フィートごとにリファレンスマーカーを設置しています。
- id: 336
  category: safe_driving_rules
  question: 赤信号で右折が許可されるのはいつですか？
  choices:
    A: 停止することなく、いつでも可能。
    B: 青色の矢印信号も点灯している場合のみ。
    C: 完全に停止した後、歩行者や交差する交通がない場合（別途標識で禁止されていない限り）。
    D: テネシー州では赤信号での右折は一切禁止されている。
  answer: C
  explanation: 別途標識で禁止されていない限り、完全に停止し、歩行者や交差する交通がいないことを確認した後に、赤信号で右折することができます。
- id: 337
  category: safe_driving_rules
  question: テネシー州の法律によると、信号が赤に変わる前に黄信号が表示されなければならない最小時間はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: テネシー州の法律では、赤信号に変わる前に黄信号を最低3秒間表示することのみが義務付けられています。
- id: 338
  category: safe_driving_rules
  question: 黄信号が点灯したときに、すでに交差点の中にいた場合はどうすべきですか？
  choices:
    A: 交差点の真ん中ですぐに停止する。
    B: ギアをバックに入れ、交差点から後退する。
    C: 赤信号になる前に通り抜けるため、大幅に加速する。
    D: 停止せず、注意して交差点を通り抜ける。
  answer: D
  explanation: マニュアルの指示では、黄信号が点灯したときにすでに交差点内にいる場合は、停止せずに注意して交差点を通り抜けることになっています。
- id: 339
  category: signs_and_signals
  question: 赤色の矢印信号は何を示していますか？
  choices:
    A: 譲り合いをした後であれば、矢印の方向に曲がることができる。
    B: 他の車線の信号が青であっても、矢印の方向へのすべての右左折は禁止されている。
    C: その交差点を4方向一時停止（4-way stop）として扱わなければならない。
    D: 緊急車両を運転している場合のみ曲がることができる。
  answer: B
  explanation: 矢印が赤であるか、自分の車線が赤信号である場合、すべての右左折は禁止されます。これは、他の車線の信号が青で、進路に障害がないように見える場合でも同様です。
- id: 340
  category: signs_and_signals
  question: 交差点での黄色の点滅矢印はどういう意味ですか？
  choices:
    A: 対向車、自転車、歩行者のすべてに道を譲った後、左折することが許可されている。
    B: 信号機が故障しているため、完全に停止しなければならない。
    C: 道を譲ることなく左折できる優先通行権がある。
    D: 左折は完全に禁止されている。
  answer: A
  explanation: 黄色の点滅矢印が表示されている場合は、すべての対向車および横断歩道内の自転車や歩行者に道を譲った後、左折することが許可されます。
- id: 341
  category: safe_driving_rules
  question: 信号機が故障して消灯している場合、交差点をどのように通行すべきですか？
  choices:
    A: 優先道路を走行している場合は、停止せずに交差点を通過する。
    B: 「前方優先（Yield）」の標識があるものとして扱う。
    C: 全方向一時停止（All-way stop）の交差点として扱う。
    D: 警察官が到着するまで待機してから進行する。
  answer: C
  explanation: テネシー州の法律では、信号機が作動していない場合、その交差点は全方向一時停止（All-way stop）の交差点として扱うことが義務付けられています。
- id: 342
  category: safe_driving_rules
  question: 全方向一時停止（All-way stop）の交差点に2台の車両が同時に到着した場合、どちらに優先権がありますか？
  choices:
    A: 左側の運転者が、右側の運転者に道を譲らなければならない。
    B: 右側の運転者が、左側の運転者に道を譲らなければならない。
    C: より速い速度で走行している車両が先に進む。
    D: 左折する車両が常に先に進む。
  answer: A
  explanation: 優先権の規定では、交差点に2台以上の車両が同時に停止した場合、左側の運転者は右側の運転者に道を譲ることになっています。
- id: 343
  category: sharing_the_road
  question: テネシー州法では「歩行者」をどのように定義していますか？
  choices:
    A: 指定された歩道を歩いている人のみ。
    B: 徒歩の人、または電動・非電動の車椅子を使用しているすべての人。
    C: 自転車やスケートボードに乗っているすべての人。
    D: 横断歩道以外の場所で道路を横断しているすべての人。
  answer: B
  explanation: テネシー州法では、歩行者を「徒歩の人、または電動・非電動の車椅子を使用しているすべての人」と定義しています。
- id: 344
  category: safe_driving_rules
  question: 夜間、車両のヘッドライトを点灯しなければならないのはいつですか？
  choices:
    A: 日没から日の出まで
    B: 日没の30分後から日の出の30分前まで
    C: 日没の1時間後から日の出の1時間前まで
    D: 街灯がない場合のみ
  answer: B
  explanation: マニュアルには、車のヘッドライトは日没の30分後から日の出の30分前まで点灯しなければならないと記載されています。
- id: 345
  category: safe_driving_rules
  question: 日中の時間帯において、どのような天候条件でヘッドライトの点灯が義務付けられていますか？
  choices:
    A: 大雪が降っている時のみ
    B: 空が曇っている時はいつでも
    C: 降水によりフロントガラスのワイパーを継続的に使用する必要がある時
    D: 雨の中、州間高速道路を走行している時のみ
  answer: C
  explanation: 雨、霧、雪、その他の降水により、フロントガラスのワイパーを継続的に使用する必要がある場合は、日中であってもヘッドライトを点灯しなければなりません。
- id: 346
  category: safe_driving_rules
  question: 日中、前方の歩行者や車両をはっきりと確認できる距離が何フィート以下の場合、ヘッドライトを点灯しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 日中であっても、200フィート先の歩行者や車両をはっきりと確認できない場合は、車のヘッドライトを点灯しなければなりません。
- id: 347
  category: safe_driving_rules
  question: 下り坂を走行中の惰性走行（コースティング）に関する規則は何ですか？
  choices:
    A: ガソリンを節約するために推奨される。
    B: ニュートラルでの走行は可能だが、クラッチを踏んだ状態は不可。
    C: ギアをニュートラルにしたり、クラッチを踏んだりした状態で惰性走行してはならない。
    D: 制限速度が45 mph以下の道路でのみ許可される。
  answer: C
  explanation: 下り坂を走行中は、絶対にギアをニュートラルにして走行してはいけません。また、マニュアル車の場合、クラッチを踏み込んだ状態で惰性走行することも禁止されています。
- id: 348
  category: safe_driving_rules
  question: 交通警察官から、通常であれば交通規則違反となるような指示を受けた場合、どうすべきですか？
  choices:
    A: 警察官を無視し、信号機に従う。
    B: いかなる時も警察官の指示に従う。
    C: 進行する前に警察官にバッジ番号を尋ねる。
    D: 車を寄せて停車し、信号が変わるのを待つ。
  answer: B
  explanation: いかなる時も交通警察官の指示に従わなければなりません。緊急時などには、通常であれば交通規則違反となるような指示を警察官が出す場合があります。
- id: 349
  category: defensive_driving
  question: 統計によると、全車両事故の半分はどこで発生していますか？
  choices:
    A: 州間高速道路上
    B: 自宅から25マイル以内
    C: 交通量の多い交差点
    D: 長距離ドライブ中
  answer: B
  explanation: 統計によると、全車両事故の半分は自宅から25マイル以内の場所で発生しています。
- id: 350
  category: signs_and_signals
  question: 路側線（エッジライン）を見て、道路を逆走していると判断するにはどうすればよいですか？
  choices:
    A: 右側に白い線、左側に黄色い線がある場合。
    B: 右側に黄色い線、左側に白い線がある場合。
    C: 両側の路側線が白い場合。
    D: 両側の路側線が黄色い場合。
  answer: B
  explanation: もし右側に黄色い線、左側に白い線がある状況に気づいたら、それは逆走しています。
- id: 351
  category: safe_driving_rules
  question: 車線の間にある2本の黄色の実線を越えることが許可されるのはどのような場合ですか？
  choices:
    A: 低速車両を追い越すとき
    B: 対向車が見えないとき
    C: 安全であれば、私道や脇道に曲がるとき
    D: いかなる状況でも2本の黄色の実線を越えてはならない
  answer: C
  explanation: 2本の黄色の実線は、どちらの方向からも追い越しのための車線変更が禁止されていることを意味します。ただし、安全であれば、私道や脇道に曲がるために黄色の実線を越えることは許可されています。
- id: 352
  category: signs_and_signals
  question: 道路の中央に黄色の実線と黄色の破線が1本ずつ引かれており、破線が自分の側にある場合、それは何を意味しますか？
  choices:
    A: 追い越し可能区間にあり、安全であれば追い越しができる
    B: このエリアでの追い越しは禁止されている
    C: 停止の準備をしなければならない
    D: その車線は右左折専用である
  answer: A
  explanation: 黄色の破線が自分の側にある場合、そこは「追い越し可能区間」であり、安全であれば追い越しを行うことができます。
- id: 353
  category: signs_and_signals
  question: 同一方向に進む車線の間にある1本の白の実線は何を示していますか？
  choices:
    A: 追い越しのための車線変更を自由に行うことができる
    B: 自分の車線を維持し、緊急時以外は線を越えてはならない
    C: 車線が終了するため、左側に合流しなければならない
    D: 料金所に近づいている
  answer: B
  explanation: 車線の間にある1本の白の実線は、自分の車線を維持すべきであり、（緊急事態で車線変更が必要な場合を除き）追い越しのための車線変更をしてはならないことを意味します。
- id: 354
  category: safe_driving_rules
  question: 停止線や横断歩道が描かれていない交差点では、車両のどこで停止しなければなりませんか？
  choices:
    A: 交通状況がはっきりと見えるよう、角を少し過ぎたところ
    B: フロントバンパーが交差する道路の白の端線を越える前
    C: 交差点から少なくとも10フィート手前
    D: 一時停止標識のポールの横
  answer: B
  explanation: 路面に停止線が描かれていない場合、一時停止が必要なすべての車両は、交差する道路の交通の邪魔にならないよう、フロントバンパーが交差する道路の白の端線を越える前に停止しなければなりません。
- id: 355
  category: signs_and_signals
  question: 路面のどの記号がHOV車線（高乗車人数車線）を示していますか？
  choices:
    A: 白のクロバック（X字型）
    B: Xが描かれた円
    C: ひし形のマーク
    D: 大きな白の矢印
  answer: C
  explanation: HOV車線（高乗車人数車線）は、高速道路の車線中央にあるひし形のマークによって指定されています。
- id: 356
  category: signs_and_signals
  question: 走行車線に曲がった矢印と直進の矢印の両方が描かれている場合、それは何を意味しますか？
  choices:
    A: 矢印の方向に曲がらなければならない
    B: 矢印の方向に曲がるか、直進するかのどちらかができる
    C: 車線が終了するため、合流しなければならない
    D: ラウンドアバウトに近づいている
  answer: B
  explanation: 車線に曲がった矢印と直進の矢印の両方が描かれている場合、矢印の方向に曲がることも、直進することもできます。
- id: 357
  category: signs_and_signals
  question: 踏切の警告として使用される路面表示は何ですか？
  choices:
    A: RRの文字が入ったひし形
    B: 白のクロバック（X字型）とRRの文字
    C: 赤いX印が付いた黄色の実線
    D: 2本の白の実線
  answer: B
  explanation: 多くの踏切では、警告表示として白のクロバック（X字型）とRRの文字が路面に描かれています。
- id: 358
  category: signs_and_signals
  question: 手を上げた記号が表示されている歩行者用信号は何を意味しますか？
  choices:
    A: 歩行者に横断の優先権がある
    B: 通りの横断を開始するのは安全ではない
    C: 歩行者は交差点を素早く走って渡るべきである
    D: 車両は停止して歩行者が近づくのを待たなければならない
  answer: B
  explanation: 歩行者用信号に「DON’T WALK（横断禁止）」の文字が表示されているか、手を上げた記号が表示されているときは、通りや交差点を渡り始めるのは安全ではありません。
- id: 359
  category: safe_driving_rules
  question: テネシー州では、夜間使用のために車のヘッドライトを点灯させなければならないのはいつですか？
  choices:
    A: 日没から日の出まで
    B: 日没の30分後から日の出の30分前まで
    C: 日没の1時間後から日の出の1時間前まで
    D: 外が完全に暗くなったときのみ
  answer: B
  explanation: マニュアルによると、車のヘッドライトは日没の30分後から日の出の30分前まで点灯させなければなりません。
- id: 360
  category: safe_driving_rules
  question: テネシー州の法律では、日中や悪天候時にヘッドライトを点灯させなければならないのはどのような場合ですか？
  choices:
    A: 高速道路（インターステート）を走行しているとき
    B: 降水によりワイパーを継続的に使用する必要があるとき
    C: 多車線道路の最も左側の車線を走行しているとき
    D: 適切に識別された葬列に近づくとき
  answer: B
  explanation: マニュアルには、雨、霧、雪、またはその他の降水によりワイパーを継続的に使用する必要がある場合に、ヘッドライトを点灯させなければならないと記載されています。
- id: 361
  category: safe_driving_rules
  question: 車のハイビームをロービームに切り替えなければならないのはいつですか？
  choices:
    A: 対向車が500フィート以内にいるとき。
    B: 対向車が200フィート以内にいるとき。
    C: 対向車が1,000フィート以内にいるとき。
    D: 混雑した都市部を走行しているときのみ。
  answer: A
  explanation: 対向車が500フィート（約1ブロックの距離）以内にいるとき、または前走車を500フィート以内で追従しているときは、ライトを減光するかロービームに切り替えなければなりません。
- id: 362
  category: vehicle_information
  question: 走行中のパーキングライト（車幅灯）の使用について、正しいものはどれですか？
  choices:
    A: 濃霧の中ではヘッドライトの代わりに使用すべきである。
    B: 夜間や悪天候時にパーキングライトのみを点灯して走行することは違法である。
    C: 実際よりも車が近くにあるように他車に見せる効果がある。
    D: スクールゾーン走行時は常に点灯が義務付けられている。
  answer: B
  explanation: マニュアルには次のように記載されています。「夜間や悪天候時に走行する際、パーキングライトのみを点灯して走行してはなりません。パーキングライトのみの使用は危険であるだけでなく、法律違反です。」
- id: 363
  category: vehicle_information
  question: 2018年1月1日より、テネシー州で車両の前方に表示される常時点灯ライトの色は何色でなければなりませんか？
  choices:
    A: 白または琥珀色
    B: 赤または青
    C: 緑または黄色
    D: 点滅しなければ何色でもよい
  answer: A
  explanation: 2018年1月1日より、テネシー州で運行される車両には、白または琥珀色（あるいはその両方の組み合わせ）以外の色で車両前方に表示される常時点灯ライトを装備してはなりません。
- id: 364
  category: penalties_and_points
  question: テネシー州におけるポイ捨て（不法投棄）の有罪判決に対する罰金はいくらですか？
  choices:
    A: $10から$500
    B: $50から$3,000
    C: $100から$5,000
    D: $250から$10,000
  answer: B
  explanation: ポイ捨ては州法に違反します。罰金は50ドルから始まり、ゴミの量に基づいて最大3,000ドルに達する可能性があります。
- id: 365
  category: safe_driving_rules
  question: テネシー州の法律では、高速道路上に落下したり吹き飛ばされたりする可能性のある資材を運搬する車両に対して、何を義務付けていますか？
  choices:
    A: 資材をバンジーコードで縛り付けること。
    B: 制限速度より少なくとも時速10マイル遅く走行すること。
    C: 資材を密閉された空間に入れるか、防水シート（ターポリン）で完全に覆うこと。
    D: 「低速走行車両」の標識を掲示すること。
  answer: C
  explanation: テネシー州法では、ゴミや高速道路上に落下・飛散する可能性のある資材を運搬する自動車は、密閉された空間に入れるか、防水シートで完全に覆うことが義務付けられています。
- id: 366
  category: safe_driving_rules
  question: どの程度の速度で走行している場合、低速走行車両とみなされますか？
  choices:
    A: 法定最高速度より時速5マイル以上遅い速度。
    B: 法定最高速度より時速10マイル以上遅い速度。
    C: 法定最高速度より時速15マイル以上遅い速度。
    D: 法定最高速度より時速20マイル以上遅い速度。
  answer: B
  explanation: 法定最高速度よりも時速10マイル以上遅い速度で走行している場合、低速走行車両とみなされます。
- id: 367
  category: sharing_the_road
  question: 低速走行車両を運転している場合、いつ安全に道路から外れるか、または進路を譲らなければなりませんか？
  choices:
    A: 後ろに2台以上の車両が並んだとき。
    B: 後ろに3台以上の車両が並んだとき。
    C: 後ろに5台以上の車両が並んだとき。
    D: 後ろに10台以上の車両が並んだとき。
  answer: C
  explanation: マニュアルには次のように記載されています。「自分の後ろに5台以上の車両が並んだ場合は、安全にできるだけ早く道路から外れるか、道を譲ってください。」
- id: 368
  category: sharing_the_road
  question: テネシー州の2車線道路で葬列を追い越す際のルールは何ですか？
  choices:
    A: 最初にクラクションを鳴らせば追い越してもよい。
    B: 葬列が時速45マイル未満で走行している場合のみ追い越せる。
    C: 葬列に続いている車両は、その葬列を追い越そうとしてはならない。
    D: ハザードランプを点灯すれば追い越してもよい。
  answer: C
  explanation: テネシー州法では、2車線道路で葬列に続いている車両は、その葬列を追い越そうとしてはならないと規定されています。
- id: 369
  category: safe_driving_rules
  question: 基本速度規則（BSR）を最もよく説明しているのはどれですか？
  choices:
    A: すべての道路に正確な速度制限を設定する厳格なテネシー州法である。
    B: 走行できる速度は現在の状況によって制限されるという教えである。
    C: すべての運転者が掲示された制限速度通りに走行することを義務付けるものである。
    D: ゆっくり走る方が常に安全であるという記述である。
  answer: B
  explanation: 基本速度規則（BSR）はテネシー州の法律ではなく、一般的な安全原則です。これは正確な速度制限を設定するものではなく、走行できる速度は現在の状況（天候、交通量など）によって制限されることを教えるものです。
- id: 370
  category: safe_driving_rules
  question: 別段の掲示がない限り、テネシー州の主要および補助的な州道および連邦道路の制限速度はいくらですか？
  choices:
    A: 時速45マイル
    B: 時速55マイル
    C: 時速65マイル
    D: 時速70マイル
  answer: B
  explanation: 別段の掲示がない限り、主要および補助的な州道および連邦道路の制限速度は時速55マイルです。
- id: 371
  category: safe_driving_rules
  question: テネシー州法で定められている州間高速道路（インターステート）の最高速度は何マイルですか？
  choices:
    A: 55 m.p.h.
    B: 60 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: D
  explanation: テネシー州法で定められている州間高速道路の最高速度は 70 m.p.h. であり、ほとんどの郊外区間に掲示されています。
- id: 372
  category: safe_driving_rules
  question: 通常の運転条件下において、テネシー州の州間高速道路の最も左側の車線で、何マイル未満で走行することは違法ですか？
  choices:
    A: 45 m.p.h.
    B: 50 m.p.h.
    C: 55 m.p.h.
    D: 65 m.p.h.
  answer: C
  explanation: 交通の混雑や流れによってその速度での安全な運転が妨げられない限り、州間高速道路の最も左側の車線を 55 m.p.h. 未満で走行することは違法です。
- id: 373
  category: safe_driving_rules
  question: テネシー州の州間高速道路において、通常の運転条件下での右側車線の最低速度制限は何マイルですか？
  choices:
    A: 35 m.p.h.
    B: 40 m.p.h.
    C: 45 m.p.h.
    D: 55 m.p.h.
  answer: C
  explanation: 州間高速道路の右側車線における最低速度制限は 45 m.p.h. であり、通常の運転条件下では、すべての車両が少なくともこの速度で走行しなければなりません。
- id: 374
  category: penalties_and_points
  question: テネシー州のスクールゾーン（学校周辺区域）で速度制限を超過した場合の罰則は何ですか？
  choices:
    A: 運転記録に自動的に2ポイントが加算される
    B: 運転記録に自動的に4ポイントが加算される
    C: 運転記録に自動的に6ポイントが加算される
    D: 30日間の自動的な免許停止
  answer: C
  explanation: マニュアルによると、スクールゾーンの速度制限超過に対する罰則には、運転記録への自動的な6ポイントの加算が含まれ、これにより勧告書（アドバイザリーレター）が送付されます。
- id: 375
  category: penalties_and_points
  question: 法律上、スクールゾーンの速度制限を超過することは何とみなされますか？
  choices:
    A: 不注意運転（Careless driving）
    B: 無謀運転（Reckless driving）
    C: 攻撃的運転（Aggressive driving）
    D: 軽微な交通違反
  answer: B
  explanation: マニュアルには、スクールゾーンの速度制限を超過することは法律上、無謀運転（Reckless driving）とみなされると記載されています。
- id: 376
  category: penalties_and_points
  question: テネシー州の稼働中の作業区域（ワークゾーン）で掲示されている速度制限に違反した場合の、最低および最高罰金額はいくらですか？
  choices:
    A: 最低50ドル、最高250ドル
    B: 最低100ドル、最高300ドル
    C: 最低250ドル、最高500ドル
    D: 最低500ドル、最高1,000ドル
  answer: C
  explanation: テネシー州法では、稼働中の作業区域に掲示された速度制限の違反に対し、最低250ドルから最高500ドルの罰金を科すことを義務付けています。
- id: 377
  category: signs_and_signals
  question: ドライバーはどのようにして道路の作業区域（ワークゾーン）を容易に識別できますか？
  choices:
    A: 青と白の標識や装置の存在によって
    B: オレンジ色または黄緑色の標識、装置、および衣服の存在によって
    C: 赤色の実線の標識と点滅する緑色のライトの存在によって
    D: 白黒のチェッカーフラッグの存在によって
  answer: B
  explanation: 道路の作業区域は、オレンジ色（または黄緑色）の標識やその他のオレンジ色の交通規制装置、重機の点滅ライト、および視認性の高い衣服（オレンジ色または黄緑色）を着用した作業員の存在によって容易に識別できます。
- id: 378
  category: vehicle_information
  question: 法律により、すべての自動車にはどのようなブレーキ装置の装備が義務付けられていますか？
  choices:
    A: 通常のフットブレーキのみ
    B: 2つの独立したブレーキ操作方法（一般的にはフットブレーキとパーキング/非常用ブレーキ）
    C: アンチロック・ブレーキ・システム（ABS）とフットブレーキ
    D: フロントのディスクブレーキとリアのドラムブレーキ
  answer: B
  explanation: 法律により、すべての自動車は2つの独立したブレーキ操作方法を備えていなければなりません。一般的には、車両の常用ブレーキ（フットブレーキ）と、パーキングブレーキまたは非常用ブレーキです。
- id: 379
  category: defensive_driving
  question: アンチロック・ブレーキ・システム（ABS）を装備していない車両がスリップし始めた場合、一般的にどのように対処すべきですか？
  choices:
    A: できるだけ速くブレーキをポンピング（断続的に踏む）する
    B: ブレーキを強く踏み込み、ハンドルを真っ直ぐに保持する
    C: ブレーキから足を離し、スリップしている方向にハンドルを切る
    D: トラクションを回復させるために素早く加速する
  answer: C
  explanation: アンチロック・ブレーキを装備していない車両の一般的なルールとして、車がスリップし始めたら、ブレーキから足を離し、安全であればスリップしている方向にハンドルを切ります。
- id: 380
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）を装備した車両を減速または停止させる際、どのようにすべきですか？
  choices:
    A: ブレーキペダルを素早くポンピングする
    B: ブレーキペダルをしっかりと一定の圧力で踏み続ける
    C: ブレーキペダルを繰り返し軽く叩くように踏む
    D: 振動を感じたらペダルから足を離す
  answer: B
  explanation: ABSを装備した車両で減速または停止する際は、ブレーキペダルをしっかりと一定の圧力で踏み込んでください。ABS装着車でペダルをポンピングしてはいけません。
- id: 381
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）が作動しているとき、どのような感覚があるはずですか？
  choices:
    A: ステアリングホイール（ハンドル）が固定される
    B: ブレーキペダルが抵抗なく床まで完全に沈み込む
    C: ブレーキペダルに音と振動が発生する
    D: エンジンが一時的に停止する
  answer: C
  explanation: ABSが作動しているときは、ブレーキペダルに音と振動が発生することを想定してください。これらの感覚は、ABSが正常に機能していることを示しています。
- id: 382
  category: safe_driving_rules
  question: 「ライディング・ザ・ブレーキ（ブレーキの引きずり）」という用語は何を意味しますか？
  choices:
    A: 素早い反応のためにブレーキペダルの上に足を浮かせておくこと
    B: ブレーキペダルに足を乗せたままにするか、軽く押し下げた状態を維持すること
    C: ブレーキペダルとアクセルペダルを同時に踏むこと
    D: 下り坂を走行中にブレーキペダルを繰り返し踏むこと
  answer: B
  explanation: 「ライディング・ザ・ブレーキ」とは、ブレーキに足を乗せたままにするか、軽く踏み込んだ状態を続けることです。これはブレーキの摩耗を早め、他のドライバーに停車するという誤った印象を与えます。
- id: 383
  category: defensive_driving
  question: 「カバリング・ザ・ブレーキ（ブレーキに足を構える）」は安全な運転慣行と見なされますか？
  choices:
    A: はい。交差点に近づく際などに、より素早い反応が可能になります
    B: いいえ。ブレーキシステムの過度な摩耗の原因となります
    C: いいえ。他のドライバーに、すぐに停車するという誤った印象を与えます
    D: はい。ただし、州間高速道路を走行している場合に限ります
  answer: A
  explanation: 「カバリング・ザ・ブレーキ」とは、より素早い反応のためにドライバーがブレーキの上に足を浮かせておくことを意味します。マニュアルでは、ブレーキに足を構えることは、多くの場合、賢明で安全な運転慣行であると述べられています。
- id: 384
  category: safe_driving_rules
  question: 通常の運転条件下で安全な車間距離を維持するために、ドライバーが使用すべきルールはどれですか？
  choices:
    A: 1秒ルール
    B: 2秒ルール
    C: 5秒ルール
    D: 10秒ルール
  answer: B
  explanation: 全米の安全機関が安全な車間距離を推奨しています。マニュアルでは、車間距離が近すぎないか判断するために「2秒ルール」を使用することを勧めています。
- id: 385
  category: defensive_driving
  question: 悪天候時、州間高速道路での高速走行時、または夜間走行時には、車間距離を最低何秒以上に伸ばすべきですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 6秒
  answer: C
  explanation: 悪天候、高速道路での高速走行、および夜間走行時には、より適切な反応時間を確保するために、2秒ルールを最低4秒以上に伸ばす必要があります。
- id: 386
  category: defensive_driving
  question: 車両が停止するまでの3つの段階において、「空走時間（認知時間／Perception time）」とは何ですか？
  choices:
    A: アクセルからブレーキペダルへ足を動かすのにかかる時間
    B: ドライバーが危険な状況を見て認識するまでにかかる時間
    C: ブレーキがかけられている間に車が走行する距離
    D: 車両のブレーキパッドがローターに接触するまでにかかる時間
  answer: B
  explanation: 空走時間（認知時間）とは、ドライバーが危険な状況を見て認識するまでにかかる時間と定義されています。
- id: 387
  category: safe_driving_rules
  question: 車間距離を詰めすぎる（テールゲーティング）ことによる、非常に一般的な結果は何ですか？
  choices:
    A: 激しい渋滞の流れを改善する
    B: 前方の道路状況がよりよく見えるようになる
    C: 追突事故を引き起こす
    D: 車両の燃費を向上させる
  answer: C
  explanation: マニュアルには、追突事故は非常に一般的であり、そのほとんどは「テールゲーティング（車間距離を詰めすぎること）」を行うドライバーによって引き起こされると記されています。
- id: 388
  category: vehicle_information
  question: マニュアル車（標準トランスミッション車）で一時停止標識に近づく際、減速するために何をすべきですか？
  choices:
    A: ニュートラルに入れて、一時停止標識まで惰性で走行する
    B: 燃料を節約するためにエンジンを切る
    C: ブレーキランプを点滅させて後続車に合図を送り、その後低いギアにシフトダウンする
    D: 車両が完全に停止するまでクラッチを踏み続ける
  answer: C
  explanation: マニュアル車では、ギアチェンジを利用して減速することができます。まず、ブレーキランプを点滅させて後続車に合図を送ります。その後、低いギアにシフトダウンします。
- id: 389
  category: safe_driving_rules
  question: 車両を停止させる際に関わる3つの段階は何ですか？
  choices:
    A: 観察時間、減速時間、停止時間
    B: 空走時間（認知時間）、反応時間、制動時間
    C: 制動時間、横滑り時間、停止時間
    D: 反応時間、減速時間、静止時間
  answer: B
  explanation: マニュアルによると、車両の停止には「空走時間（認知時間）」、「反応時間」、「制動時間」の3つの段階があります。
- id: 390
  category: safe_driving_rules
  question: 危険を認識してからブレーキをかけ始めるまでの平均的な反応時間はどれくらいですか？
  choices:
    A: 0.5秒（1/2秒）
    B: 約0.67秒（2/3秒）
    C: 1秒
    D: 1.16秒
  answer: B
  explanation: マニュアルには、反応時間とは危険を認識してからブレーキをかけ始めるまでの時間であり、平均は2/3秒であると記載されています。
- id: 391
  category: vehicle_information
  question: 車両の停止距離を大きく変化させる要因として挙げられて「いない」ものはどれですか？
  choices:
    A: 道路や舗装の種類と状態
    B: 車両の設計とショックアブソーバーの状態
    C: 車両の色と視認性
    D: 積載時または牽引時の車両重量
  answer: C
  explanation: 停止距離は、路面の状態、タイヤやブレーキ、ショックアブソーバー、車両の重量などの要因によって変化します。車両の色は要因として挙げられていません。
- id: 392
  category: signs_and_signals
  question: 路面標示や横断歩道がない場所にある一時停止標識（stop sign）では、車両のどの位置で停止すべきですか？
  choices:
    A: 一時停止標識の10フィート手前
    B: 車両の先端が道路脇の一時停止標識の位置と並んだとき
    C: 一時停止標識の真下
    D: 交差する道路の正確な端
  answer: B
  explanation: マニュアルには、「路面標示がない場合は、車両の先端が道路脇の一時停止標識の位置と並んだときに停止してください」と記載されています。
- id: 393
  category: defensive_driving
  question: 交差点で他の車両の後ろに停車する際、安全な「車間距離」を保つための基本的な目安は何ですか？
  choices:
    A: 前の車両から少なくとも車1台分の距離を空ける必要がある
    B: 前の車両のナンバープレート、または後輪が路面に接している部分が見える状態でなければならない
    C: 車両間に正確に15フィートのスペースを空ける必要がある
    D: 前の車両のナンバープレートの有効期限が読めるほど近づく必要がある
  answer: B
  explanation: 基本的な目安として、安全地帯を確保するために、前の車両のナンバープレート、または後輪が路面に接している部分が見える状態で停車する必要があります。
- id: 394
  category: signs_and_signals
  question: 赤色の点滅信号に対して、運転者はどのように対応しなければなりませんか？
  choices:
    A: 徐行して注意深く進む
    B: 右側の交通に道を譲るが、停止は義務付けられていない
    C: 一時停止標識と同様に、完全に一時停止する
    D: 横断歩道に歩行者がいる場合のみ停止する
  answer: C
  explanation: マニュアルには、「赤色の点滅信号では、一時停止標識と同様に、完全な一時停止が義務付けられています」と明記されています。
- id: 395
  category: safe_driving_rules
  question: ほとんどの法執行官や運転教育の指導員は、「完全な一時停止」をどのように定義していますか？
  choices:
    A: 速度計が正確にゼロを指した状態で3秒間経過したとき
    B: すべての動きが止まった後、運転者が車が前方に揺り戻される（lurch forward）のを感じたとき
    C: 車両が時速5マイル未満に減速したとき
    D: 運転者がギアをパーキング（P）に入れたとき
  answer: B
  explanation: ほとんどの法執行官や指導員は、すべての動きが止まった後、運転者が車が前方に揺り戻される（lurch forward）のを感じるまで、車両は完全な一時停止をしたとはみなされないという意見で一致しています。
- id: 396
  category: safe_driving_rules
  question: 踏切に近づいた際に列車が来ている場合、車両をどこで停止させなければなりませんか？
  choices:
    A: 線路から10フィートから30フィートの間
    B: 線路から15フィートから50フィートの間
    C: 線路から正確に50フィートの位置
    D: 線路から少なくとも100フィート離れた位置
  answer: B
  explanation: 踏切に近づいた際に列車が来ている場合は、線路から15フィート（約4.5メートル）から50フィート（約15メートル）の間で停止しなければなりません。
- id: 397
  category: sharing_the_road
  question: 列車が踏切を通過する前に警笛を鳴らすことが義務付けられているのは、およそどのくらいの距離からですか？
  choices:
    A: 500フィート
    B: 1,000フィート
    C: 1,500フィート
    D: 2,000フィート
  answer: C
  explanation: 列車は、踏切を通過する約1,500フィート（約450メートル）手前で警笛を鳴らすことが義務付けられています。
- id: 398
  category: sharing_the_road
  question: テネシー州法により、標識や信号が作動していなくても、あらゆる踏切を通過する前に停止が義務付けられている車両はどれですか？
  choices:
    A: 子供を乗せているすべての乗用車
    B: 乗客の有無にかかわらず、教会や学校のバス
    C: すべての商用配送トラック
    D: トレーラーを牽引しているすべての車両
  answer: B
  explanation: 教会や学校のバスは、乗客が乗っているかどうかにかかわらず、あらゆる踏切を通過する前に停止することが法律で義務付けられています。
- id: 399
  category: safe_driving_rules
  question: テネシー州法（Tennessee Code）では、「停止（stop）」をどのように定義していますか？
  choices:
    A: 時速3マイル未満まで減速すること
    B: 動きの完全な停止
    C: 少なくとも2秒間休止すること
    D: 対向車すべてに道を譲ること
  answer: B
  explanation: テネシー州法では、「停止」を「動きの完全な停止（complete cessation of movement）」と定義しています。
- id: 400
  category: signs_and_signals
  question: 交差点に歩行者用の横断歩道がある場合、車両をどこで停止させなければなりませんか？
  choices:
    A: 交通状況をよく見るために、横断歩道の中で停止する
    B: 横断歩道を少し過ぎた位置で停止する
    C: 車両の先端が横断歩道の境界を示す最も近い白線に達する前に停止する
    D: 横断歩道の線に関係なく、一時停止標識と並んだ位置で停止する
  answer: C
  explanation: 交差点の路面に横断歩道が標示されている場合は、車両の先端が横断歩道の境界を示す最も近い白線に達する前に停止しなければなりません。
- id: 401
  category: safe_driving_rules
  question: マニュアルの例によると、天候と路面状態が良好な道路を時速70マイル（70 m.p.h.）で走行中、危険が突然現れた場合の総停止距離はどれくらいですか？
  choices:
    A: 128フィート
    B: 200フィート
    C: 290フィート
    D: 418フィート
  answer: D
  explanation: 時速70マイルでは、ブレーキをかけるまでに128フィート進み（空走距離）、制動距離は290フィートとなるため、総停止距離は418フィートになります。
- id: 402
  category: penalties_and_points
  question: 「ローリングストップ（完全に停止せず徐行すること）」をした場合に起こりうる結果として、適切なものはどれですか？
  choices:
    A: 運転免許の実技試験で不合格になる
    B: 交通違反切符を切られる
    C: 衝突事故が発生した際、警察や保険会社から全責任を問われる
    D: 上記のすべて
  answer: D
  explanation: ローリングストップは、交通違反切符の対象となるほか、実技試験の不合格理由となり、事故が発生した場合には全責任を負わされる根拠となります。
- id: 403
  category: penalties_and_points
  question: 停車中のスクールバスに対して停止しなかった場合の罰則は何ですか？
  choices:
    A: クラスB軽罪および100ドルの罰金
    B: クラスC軽罪および50ドルの罰金
    C: クラスA軽罪および250ドルから1,000ドルの罰金
    D: 重罪および2,000ドルの罰金
  answer: C
  explanation: マニュアルによると、停車中のスクールバスに対して停止しなかった場合、クラスA軽罪となり、250ドルから1,000ドルの罰金が科せられる可能性があります。
- id: 404
  category: safe_driving_rules
  question: 共有センターターンレーン（5番目の車線）があるハイウェイを走行中、赤色灯を点滅させて停車しているスクールバスに遭遇した場合、どうしなければなりませんか？
  choices:
    A: 停止せずに注意して進む
    B: バスと同じ方向に進んでいる場合のみ停止する
    C: 時速15マイルまで減速して進む
    D: ターンレーンは分離帯とはみなされないため、両方向の車両が停止する
  answer: D
  explanation: 4車線道路の中央にあるターンレーンは分離帯（バリア）とはみなされません。このような道路で停車中のスクールバスに遭遇した場合、両方向の運転者が停止する必要があります。
- id: 405
  category: signs_and_signals
  question: スクールバスの前後にある黄色の点滅灯は何を示していますか？
  choices:
    A: バスが子供の乗り降りのために停車しようとしている
    B: バスが停車中で、子供が乗り降りしている
    C: バスに機械的な故障が発生している
    D: バスが後退している
  answer: A
  explanation: スクールバスの前後の黄色いライトが点滅しているときは、子供の乗り降りのために停車する準備をしています。ドライバーは減速し、停車の準備をする必要があります。
- id: 406
  category: safe_driving_rules
  question: スクールバスが子供の乗り降りのために交差点で停車している際、どの運転者が停止する必要がありますか？
  choices:
    A: バスの後ろにいる運転者のみ
    B: 反対方向から近づいてくる運転者のみ
    C: すべての方向からの運転者
    D: バスが停車している通りに曲がろうとする運転者のみ
  answer: C
  explanation: スクールバスが子供の乗り降りのために交差点で停車している場合、バスが動き出すまで、すべての方向からの運転者が停止する必要があります。
- id: 407
  category: driver_responsibility
  question: 日没後に警察官に車を止められた際、警察官が近づいてくる前に何をすべきですか？
  choices:
    A: ヘッドライトを消す
    B: 車内灯を点ける
    C: 車から降りて警察官に挨拶する
    D: 停車したことを知らせるためにクラクションを鳴らす
  answer: B
  explanation: マニュアルでは、日没後に停車を命じられた場合、警察官が近づいてくる前に車内灯を点けることを推奨しています。
- id: 408
  category: defensive_driving
  question: 夜間に覆面パトカー（UNMARKED police car）から停車を命じられ、不安を感じた場合はどうすべきですか？
  choices:
    A: 覆面パトカーから逃げるためにスピードを上げる
    B: 道路の真ん中にすぐに停車する
    C: 近くの人がいる場所まで短い距離をゆっくり走行する
    D: マーク付きのパトカーが来るまで停車を拒否する
  answer: C
  explanation: 覆面パトカーに停車を命じられた場合、店舗の駐車場や次の出口など、近くの人がいる場所まで短い距離をゆっくり走行しても構いません。
- id: 409
  category: driver_responsibility
  question: 警察官に止められた際、運転者はどうすべきですか？
  choices:
    A: 見せるように言われるまで、手を見えないところに隠しておく
    B: 両手をハンドルに置いておく
    C: すぐにグローブボックスに手を伸ばして登録証を取り出す
    D: 車から降りて、車の後部を確認する
  answer: B
  explanation: 交通取り締まりによる停車中、運転者は両手をハンドルに置き、同乗者は手が見える状態にしておく必要があります。
- id: 410
  category: safe_driving_rules
  question: 交差点における「左・右・左のルール」によると、最初にどこを見るべきですか？
  choices:
    A: 右
    B: 左
    C: 真っ直ぐ前方
    D: バックミラー
  answer: B
  explanation: 「左・右・左のルール」では、まず左を見て交差する車両が優先権を譲っているか確認し、次に右、そしてもう一度左を確認します。
- id: 411
  category: safe_driving_rules
  question: 交差点での車線変更や追い越しについて、正しいものはどれですか？
  choices:
    A: 信号が青であれば、交差点内で車両を追い越してもよい
    B: 交差点に入り始める際に、直前で車線変更を行うべきである
    C: 交差点内で車両を追い越してはならない
    D: 方向指示器（ウィンカー）を使用すれば、交差点内で車線変更ができる
  answer: C
  explanation: マニュアルには次のように明記されています。「交差点に入り始める際に、直前で車線変更をしてはいけません。交差点内で車両を追い越してはいけません。」
- id: 412
  category: defensive_driving
  question: 全自動車事故のうち、交差点が関与している割合は何パーセントですか？
  choices:
    A: 10パーセント
    B: 21パーセント
    C: 33パーセント
    D: 50パーセント
  answer: C
  explanation: 交差点は道路網全体のごく一部に過ぎませんが、全自動車事故の33パーセントに関与しています。
- id: 413
  category: safe_driving_rules
  question: 優先権（通行優先権）に関する法律を最もよく説明しているのはどれですか？
  choices:
    A: 法律は、最も大きな車両に優先権を与えている
    B: 法律は誰にも優先権を与えておらず、誰が譲らなければならないかのみを定めている
    C: 法律は、最も速く走行している車両に優先権を与えている
    D: 法律は、交通信号に関係なく、あらゆる状況で歩行者に優先権を与えている
  answer: B
  explanation: 法律は実際には誰にも優先権を与えていません。誰が優先権を譲らなければならないかを定めているだけです。優先権は「取る」ものではなく「譲る」ものだと考えてください。
- id: 414
  category: safe_driving_rules
  question: 赤色の点滅灯を点灯させて停車しているスクールバスに対して、停止する必要がないのはどのような状況ですか？
  choices:
    A: 2車線道路で反対方向を走行しているとき
    B: 仕事に遅れそうなとき
    C: 車両の通行に適さない障壁によって分離された、別の車道がある道路を走行しているとき
    D: バスが交差点で停車しているとき
  answer: C
  explanation: 中央分離帯や車両の通行に適さない障壁によって反対方向の交通が分離されている道路を走行している場合、運転者は停止する必要はありませんが、注意して進む必要があります。
- id: 415
  category: safe_driving_rules
  question: 信号が変わった後に交差点内に進入し、そこを塞ぐことは合法ですか？
  choices:
    A: 信号が黄色のときに交差点に入ったのであれば合法である
    B: 「交差点を塞ぐな（Do Not Block Intersection）」の標識がない場合は合法である
    C: いいえ、標識の有無にかかわらず、交差点を塞ぐことは常に違法である
    D: いいえ、商用車を運転している場合を除き違法である
  answer: C
  explanation: 信号が変わった後に交差点を塞ぐことは、常識に反するだけでなく違法でもあります。標識の有無にかかわらず、交差点を塞ぐことは常に違法です。
- id: 416
  category: driver_responsibility
  question: 拳銃携帯許可証を持っており、警察官に止められた際に銃を所持している場合、どうすべきですか？
  choices:
    A: 座席の下に武器を隠す
    B: 許可証を持っており、銃を所持していることを警察官に伝える
    C: すぐに武器を警察官に手渡す
    D: 警察官が武器を持っているか尋ねるまで待ってから伝える
  answer: B
  explanation: マニュアルには、運転者は拳銃携帯許可証を持っており、銃を所持している場合には警察官にその旨を伝えるべきであると記載されています。
- id: 417
  category: safe_driving_rules
  question: テネシー州法によれば、法的に優先権を与えられているのは誰ですか？
  choices:
    A: 最初に交差点に到着した運転者
    B: あらゆる状況における歩行者
    C: 法律は誰にも優先権を与えず、誰が譲らなければならないかのみを定めている
    D: 右側の車両
  answer: C
  explanation: マニュアルには、法律は実際には誰にも優先権を与えていないと記載されています。誰が優先権を譲らなければならないかを定めているだけです。
- id: 418
  category: sharing_the_road
  question: 盲導犬を連れているか白杖を使用している盲目または視覚障害のある歩行者が道路を横断しているとき、少なくともどのくらい離れて停止しなければなりませんか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 20フィート
  answer: B
  explanation: 盲目または視覚障害のある歩行者の負傷を防ぐために特別な予防措置を講じ、その人が道路から出るまで少なくとも10フィート離れて停止しなければなりません。
- id: 419
  category: sharing_the_road
  question: 特別な優先権の配慮が必要な聴覚障害のある歩行者を、運転者はどのように識別できますか？
  choices:
    A: 先端が赤色の白杖を持っている
    B: 反射材付きの黄色いベストを着用している
    C: 鮮やかなオレンジ色のリード（blaze orange leash）をつけた犬を連れている
    D: 電動車椅子を使用している
  answer: C
  explanation: マニュアルには、道路のいかなる部分を横断している場合でも、鮮やかなオレンジ色のリード（blaze orange leash）をつけた犬を連れた聴覚障害者に道を譲らなければならないと規定されています。
- id: 420
  category: safe_driving_rules
  question: 歩道上を車両で走行することが合法となるのはいつですか？
  choices:
    A: 渋滞を避けるとき
    B: 混雑した繁華街で車両を駐車するとき
    C: 私道、路地、または駐車場に出入りするために横断するときのみ
    D: いかなる状況においても歩道を走行することは合法ではない
  answer: C
  explanation: 私道、路地、または駐車場に出入りするために横断する場合を除き、歩道上を走行することは違法です。
- id: 421
  category: safe_driving_rules
  question: 一方の道路が別の主要な交差道路に突き当たっている「T字路」交差点では、どちらに優先権がありますか？
  choices:
    A: 突き当たった側の道路の車両は、主要道路の交通に道を譲らなければならない
    B: 主要道路の車両は、突き当たった側の道路の車両に道を譲らなければならない
    C: 交差点に最初に到着した車両
    D: 右折する車両
  answer: A
  explanation: 一方の道路が別の主要な交差道路に突き当たっている「T字路」交差点では、突き当たった側の道路の車両は、主要道路の両方向から来る交通に道を譲らなければなりません。
- id: 422
  category: defensive_driving
  question: 前方の交通が渋滞しており、交差点を完全に通り抜けることができない場合はどうすべきですか？
  choices:
    A: 交差点に進入し、交通が解消されるのを待つ
    B: 交差点を塞がないよう、交通が解消されるまで待つ
    C: ゆっくりと進み、クラクションを鳴らす
    D: 交差点内に移動し、ハザードランプを点灯させる
  answer: B
  explanation: 停止せずに通り抜けられる確信がない限り、交差点に進入してはいけません。交差点を塞がないよう、前方の交通が解消されるまで待つ必要があります。
- id: 423
  category: sharing_the_road
  question: サイレンを鳴らしている、または赤色灯を点滅させている緊急車両が接近してきた場合、どうしなければなりませんか？
  choices:
    A: 現在の車線ですぐに停止する
    B: 緊急車両の前に留まるためにスピードを上げる
    C: 道路の右端または縁石にできるだけ近づけて平行に停車する
    D: 道路の左側に寄せて減速する
  answer: C
  explanation: テネシー州の法律では、緊急車両が接近してきた場合、すべての交通は優先権を譲り、直ちに道路の右端または縁石にできるだけ近づけて平行に停車しなければならないと定められています。
- id: 424
  category: sharing_the_road
  question: サイレンを鳴らした緊急車両が接近してきたとき、自分が交差点の真ん中にいた場合、どうすべきですか？
  choices:
    A: 交差点の真ん中ですぐに停止する
    B: 交差点を通り抜けてから、右側に寄せて停車する
    C: 車両をバックさせて交差点から出る
    D: 交差点の左側に寄せる
  answer: B
  explanation: 交差点内にいる場合は、右側に寄せる前に交差点を通り抜けてください。そうしないと、緊急車両の交差点内の進路を塞いでしまう可能性があります。
- id: 425
  category: safe_driving_rules
  question: テネシー州の「ムーブ・オーバー法（Move Over Law）」に基づき、複数車線の道路でライトを点滅させて停車している緊急車両や作業車両に接近する場合、どうしなければなりませんか？
  choices:
    A: 車両を停止させ、停車中の車両が移動するのを待つ
    B: その車両に隣接しない車線へ車線変更するか、速度を落として注意深く進む
    C: 速度を維持し、作業員に知らせるためにクラクションを鳴らす
    D: 路肩に寄せてハザードランプを点灯させる
  answer: B
  explanation: テネシー州の「ムーブ・オーバー法」では、ライトを点滅させて停車している緊急車両に接近する場合、その車両に隣接しない車線へ車線変更するか、速度を落として注意深く進むことが義務付けられています。
- id: 426
  category: sharing_the_road
  question: 乗客の乗り降りのために停車している路線バス（メトロバス）に対して、停車する義務はありますか？
  choices:
    A: はい、スクールバスの場合と同様に停車しなければならない
    B: はい、ただしバスがハザードランプを点滅させている場合に限る
    C: いいえ、停車する義務はなく、追い越しも禁止されていない
    D: いいえ、バスが指定されたスクールゾーンにいない限り必要ない
  answer: C
  explanation: 路線バスが乗客の乗り降りのために停車している場合、同じ状況のスクールバスとは異なり、停車する義務はなく、追い越しも禁止されていません。
- id: 427
  category: safe_driving_rules
  question: 緊急事態に対応中の消防車や緊急車両に関して、次のうち違法な行為はどれですか？
  choices:
    A: 交差点でそれらに優先権を譲ること
    B: 火災報知に対応中の消防車を追走すること
    C: それらが接近してきたときにラジオの音量を下げること
    D: それらが接近してきたときに右側の縁石に寄せること
  answer: B
  explanation: 火災報知やその他の緊急事態に対応中の消防車やその他の緊急車両を追走することは法律で禁止されています。
- id: 428
  category: safe_driving_rules
  question: 右左折の第一の規則は何ですか？
  choices:
    A: 走行中の車線から、進みたい方向の最も近い法定車線へと曲がること
    B: 常に一番左側の車線に入ること
    C: 曲がる少なくとも50フィート手前で合図を出すこと
    D: 右左折を開始する前にクラクションを鳴らすこと
  answer: A
  explanation: 右左折の第一の規則は、走行中の車線から、進みたい方向の最も近い法定車線へと曲がることです。
- id: 429
  category: vehicle_information
  question: 許可されていない自家用車に設置したり、目に見える形で表示したりすることが違法なのは、次のうちどれですか？
  choices:
    A: 白色点滅灯
    B: 黄色点滅の緊急灯
    C: 青色点滅の緊急灯、または青と赤の組み合わせ
    D: 緑色点滅灯
  answer: C
  explanation: 許可されていない自家用車に、青色の点滅緊急灯、または青と赤の組み合わせの点滅緊急灯を設置、維持、または何らかの形で見えるように表示することは法律で禁止されています。
- id: 430
  category: safe_driving_rules
  question: 信号が青であっても、別の車両がすでに交差点内にいる場合、どうしなければなりませんか？
  choices:
    A: 自分に優先権があるので、交差点を通過する
    B: 相手の車両を移動させるためにクラクションを鳴らす
    C: すでに交差点内にいる車両に道を譲る
    D: 交通の流れを維持するために、その車両を避けて進む
  answer: C
  explanation: たとえ信号が青であっても、すでに交差点内にいる車両には優先権を譲らなければなりません。
- id: 431
  category: safe_driving_rules
  question: 曲がる前に、どのくらい手前から方向指示器（ウィンカー）を出す必要がありますか？
  choices:
    A: 少なくとも25フィート
    B: 少なくとも50フィート
    C: 少なくとも100フィート
    D: 少なくとも200フィート
  answer: B
  explanation: マニュアルには、曲がる少なくとも50フィート手前で方向指示器を出さなければならないと記載されています。
- id: 432
  category: safe_driving_rules
  question: 方向指示器を使用することで、車線変更や右左折の優先権（right-of-way）が得られますか？
  choices:
    A: はい、少なくとも50フィート手前で合図すれば得られます。
    B: はい、ただし駐車場に入る時のみです。
    C: いいえ、合図を出すことで優先権が得られるわけではありません。
    D: いいえ、手信号を使用している場合を除きます。
  answer: C
  explanation: 合図は他のドライバーに自車の進路変更の意図を知らせるものですが、マニュアルには、合図を出すことで優先権が得られるわけではないと明記されています。
- id: 433
  category: defensive_driving
  question: 右左折を待っている間、なぜ車輪をまっすぐに保つ必要があるのですか？
  choices:
    A: パワーステアリング液の循環を助けるため。
    B: タイヤの偏摩耗を防ぐため。
    C: 後方から追突された場合、その衝撃で対向車線に押し出される可能性があるため。
    D: 信号が青になったときに、より速く加速できるようにするため。
  answer: C
  explanation: マニュアルでは、対向車が通り過ぎるのを待つ間、曲がる方向に車輪を向けないよう警告しています。車輪を向けた状態で後方から追突されると、その衝撃で対向車線に押し出される可能性があります。
- id: 434
  category: safe_driving_rules
  question: 交差点を過ぎてすぐの私道（ドライブウェイ）に曲がる予定がある場合、いつ合図を出すべきですか？
  choices:
    A: 交差点の少なくとも50フィート手前。
    B: 交差点内に入るまで合図を出さない。
    C: ハンドルを切り始めた直後。
    D: 私道に入る場合は合図の必要はない。
  answer: B
  explanation: 交差点を越えた場所で曲がる予定がある場合は、交差点内に入るまで合図を出さないでください。早めに合図を出すと、他のドライバーがあなたが交差点で曲がると思い込み、あなたの進路に割り込んでくる可能性があります。
- id: 435
  category: defensive_driving
  question: 車の方向指示器が見えにくい可能性があるため、マニュアルが特に手信号の使用を推奨しているのはどのような天候条件の時ですか？
  choices:
    A: 激しい雨
    B: 濃霧
    C: 日差しが非常に強い時
    D: 吹雪の時
  answer: C
  explanation: 日差しが非常に強い時は手信号を使用すべきです。強い日差しにより、他のドライバーが方向指示器の点灯を確認しにくくなるためです。
- id: 436
  category: safe_driving_rules
  question: 方向指示器を以下のどの目的で使用してはなりませんか？
  choices:
    A: 駐車状態から発進することを示すため。
    B: 後続車のドライバーに、追い越しを促す合図を送るため。
    C: 州間高速道路（インターステート）に進入することを示すため。
    D: 急減速することを示すため。
  answer: B
  explanation: マニュアルには、後続車のドライバーに追い越しを促すために合図を使用してはならないと記載されています。これは他のドライバーに誤解を与える可能性があるためです。
- id: 437
  category: vehicle_information
  question: 交差点内でギアチェンジを避けるべきなのはなぜですか？
  choices:
    A: クラッチが過度に摩耗するため。
    B: 違法であり、高額な罰金が科せられるため。
    C: エンストして事故を引き起こしたり、交差点を塞いだりする可能性があるため。
    D: 方向指示器が自動的に消えてしまうため。
  answer: C
  explanation: マニュアルでは次のようにアドバイスしています。「交差点内でギアチェンジをしないでください（エンストすると、事故を引き起こしたり、他の交通に対して交差点を塞いでしまったりする可能性があります）。」
- id: 438
  category: defensive_driving
  question: 停止の合図を送る際、ブレーキランプで注意を引くにはどうすればよいですか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）をつける。
    B: ブレーキを数回軽く踏む（ポンピングブレーキ）。
    C: すぐにブレーキペダルを床まで踏み込む。
    D: ブレーキをかける前にニュートラルにシフトする。
  answer: B
  explanation: 停止の合図を送る際は、ブレーキランプで注意を引くために、ブレーキを数回軽く踏む必要があります。
- id: 439
  category: safe_driving_rules
  question: 交差点で別のドライバーと向かい合い、両者が左折したい場合、どのように進むべきですか？
  choices:
    A: 各ドライバーは相手の右側を回って曲がる。
    B: 先に到着したドライバーに優先権がある。
    C: 各ドライバーは相手の左側を回って曲がる。
    D: 両方のドライバーが青の矢印信号を待たなければならない。
  answer: C
  explanation: 交差点で別のドライバーと向かい合い、両者が左折を希望する場合、お互いの左側を通過するように曲がります。
- id: 440
  category: signs_and_signals
  question: 一方通行の道路のセンターライン（中央線）は何色ですか？
  choices:
    A: 黄色
    B: 白
    C: 赤
    D: 青
  answer: B
  explanation: マニュアルによると、対面通行（双方向）の道路のセンターラインは黄色ですが、一方通行の道路のセンターラインは白です。
- id: 441
  category: safe_driving_rules
  question: 実際に右左折を行っている最中、手信号を使用している腕はどうすべきですか？
  choices:
    A: 曲がり終えるまで完全に伸ばしたままにする。
    B: 円を描くように振る。
    C: ハンドル操作を確実にするために、腕を車内に戻す。
    D: 曲がろうとしている車線を指差す。
  answer: C
  explanation: 手信号を使用する場合、ハンドル操作を確実に行うために、実際の右左折中は腕を車内に戻す必要があります。
- id: 442
  category: defensive_driving
  question: 方向指示器（ウィンカー）を出し終わった後に消し忘れた場合に考えられる危険は何ですか？
  choices:
    A: 車両のバッテリーが消耗する。
    B: 他のドライバーが、あなたの前へ割り込もうとする（飛び出す）誘因になる可能性がある。
    C: ブレーキランプが作動しなくなる。
    D: 自動的に非常ブレーキがかかる。
  answer: B
  explanation: 意図しない合図であっても、他のドライバーには「曲がる」という意味に受け取られます。合図を出したままにすると、他のドライバーがあなたの前へ出ようとする誘因になる可能性があります。
- id: 443
  category: safe_driving_rules
  question: 対面通行の道路（2ウェイ・ストリート）から別の対面通行の道路へ通常の左折をする際、新しい道路に入った直後はどこを走行すべきですか？
  choices:
    A: 対向車を避けるため、一番右側の車線に入る。
    B: センターラインを越えてすぐの最初の車線で、センターラインのすぐ右側を走行する。
    C: センターラインの真上を走行する。
    D: 交通の妨げにならない、空いている任意の車線に入る。
  answer: B
  explanation: 進入する道路のセンターラインのすぐ右側を走行し、センターラインを越えてすぐの最初の車線に入るようにしてください。これにより、右折または左折を行う他の車両との衝突を避けることができます。
- id: 444
  category: signs_and_signals
  question: 左折待ちをしていて、対向車が途切れるのを待っている間に信号が黄色に変わった場合、どうすべきですか？
  choices:
    A: 赤信号になる前に素早く加速して通過する。
    B: 直ちに交差点内に進入する。
    C: 交差点内に進入してはならない。
    D: 横断歩道までバックする。
  answer: C
  explanation: マニュアルには次のように記載されています。「対向車が交差点を通過するのを待っている間に信号が黄色に変わった場合は、交差点内に進入してはなりません。」
- id: 445
  category: safe_driving_rules
  question: 対面通行の道路から一方通行の道路へ左折する場合、どの車線に入るべきですか？
  choices:
    A: 最も右側の車線。
    B: 中央の車線。
    C: 左側の縁石に最も近い最初の車線。
    D: 現在空いている任意の車線。
  answer: C
  explanation: 対面通行の道路から一方通行の道路へ曲がる際、マニュアルでは「最初の車線に鋭角に曲がること... 左側の縁石に最も近い最初の車線に入る必要がある」と指示されています。
- id: 446
  category: safe_driving_rules
  question: テネシー州において、赤信号での左折が許可されるのはどのような条件の時ですか？
  choices:
    A: 対面通行の道路から一方通行の道路へ曲がる時。
    B: 一方通行の道路から別の一方通行の道路へ曲がる時。
    C: 一方通行の道路から対面通行の道路へ曲がる時。
    D: 赤信号での左折は決して許可されない。
  answer: B
  explanation: 一方通行の道路と別の一方通行の道路が交差するすべての交差点において、まず完全に停止し、禁止の標識がない場合に限り、赤信号での左折が許可されます。
- id: 447
  category: safe_driving_rules
  question: 一方通行の道路から対面通行の道路へ曲がる際、赤信号で左折することはできますか？
  choices:
    A: はい、完全に停止した後であれば可能。
    B: はい、対向車がいなければ可能。
    C: いいえ、この場合の赤信号での左折はできません。
    D: はい、ただし午前0時から午前6時の間に限る。
  answer: C
  explanation: マニュアルには、一方通行の道路から対面通行の道路への左折に関して、「この場合の赤信号での左折はできません」と明記されています。
- id: 448
  category: safe_driving_rules
  question: 右折する際、どれくらい手前から方向指示器（合図）を出さなければなりませんか？
  choices:
    A: 少なくとも25フィート手前。
    B: 少なくとも50フィート手前。
    C: 少なくとも100フィート手前。
    D: 少なくとも200フィート手前。
  answer: B
  explanation: マニュアルには「右折の合図は少なくとも50フィート手前から出すこと」と記載されています。
- id: 449
  category: defensive_driving
  question: 右折の前や最中に、左側に大きく膨らんで（スイングして）曲がるのを避けるべきなのはなぜですか？
  choices:
    A: ハンドルがロックされる原因になるため。
    B: 後続車のドライバーが、あなたが車線変更または左折をしようとしていると勘違いし、あなたの右側から追い越そうとする可能性があるため。
    C: 白線を越えることは違法であるため。
    D: ラウンドアバウト（環状交差点）に進入することになるため。
  answer: B
  explanation: 右折時に左側に大きく膨らむと、「後続車のドライバーが、あなたが車線変更または左折をしようとしていると考え、あなたの右側から追い越そうとする可能性があります」。
- id: 450
  category: sharing_the_road
  question: 大型トラックが右折する可能性がある場合、その右側から追い越すのを避けるべきなのはなぜですか？
  choices:
    A: トラックは乗用車よりも加速が早いため。
    B: トラックは大きく膨らんで曲がる必要があり、右折直前に右側にスペースが空くことがあるため。
    C: トラックは方向指示器の使用が許可されていないため。
    D: 交差点では常にトラックが優先されるため。
  answer: B
  explanation: 大型トラックやバスは大きく膨らんで曲がる必要があり、右折の直前に右側にスペースを空けることがあります。右側から追い越そうとすると、事故の原因となる可能性があります。
- id: 451
  category: safe_driving_rules
  question: 環状交差点（ラウンドアバウト）では、常にどの方向に進まなければなりませんか？
  choices:
    A: 時計回り
    B: 反時計回り（右方向）
    C: 中心を直線で通過
    D: 交通量の少ない方向
  answer: B
  explanation: マニュアルには「環状交差点では常に右方向、つまり反時計回りに進んでください」と記載されています。
- id: 452
  category: safe_driving_rules
  question: 複数車線の環状交差点（ラウンドアバウト）で他の車両を追い越す際のルールは何ですか？
  choices:
    A: 左側からのみ追い越し可能
    B: 右側からのみ追い越し可能
    C: 前方の車両が時速15 mph未満で走行している場合は追い越し可能
    D: いかなる車両も追い越しや追い抜きをしてはならない
  answer: D
  explanation: 複数車線の環状交差点について、マニュアルには「いかなる車両も追い越しや追い抜きをしてはならない」と明記されています。
- id: 453
  category: safe_driving_rules
  question: 両方向から来る交通を少なくとも何フィート先まで確認できない場所では、Uターン（転回）をしてはいけませんか？
  choices:
    A: 100フィート
    B: 250フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: 郊外や市街地、またはカーブや丘の頂上付近で、両方向から来る交通を少なくとも500フィート先まで確認できない場所では、Uターンをしてはいけません。
- id: 454
  category: safe_driving_rules
  question: テネシー州の州間高速道路で出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 中央分離帯にある緊急用クロスオーバーを使用して引き返す
    B: 道路が空いている時にUターンをする
    C: 次の出口ランプまで走行する
    D: 路肩を注意深くバックする
  answer: C
  explanation: 州間高速道路でのUターンや緊急用クロスオーバーの使用は違法です。マニュアルでは「次の出口ランプまで走行してください」とアドバイスしています。
- id: 455
  category: safe_driving_rules
  question: アメリカの道路における「右側通行」の原則を要約したフレーズはどれですか？
  choices:
    A: 右側に黄色、左側に白
    B: 右側に白、左側に黄色
    C: 右折する場合を除き右側を走行
    D: 右側から追い越し、左側を走行
  answer: B
  explanation: マニュアルには、車線使用の概要が「右側に白、左側に黄色（White on your right, yellow on your left）」という単純な言葉でまとめられています。
- id: 456
  category: safe_driving_rules
  question: 対面通行の3車線または5車線道路の中央車線は何に使用されますか？
  choices:
    A: 低速車両の追い越し
    B: 緊急停車のみ
    C: 左折のみ
    D: 右折のみ
  answer: C
  explanation: マニュアルには「対面通行の3車線または5車線道路の中央車線は、左折のためだけに使用されます」と明記されています。
- id: 457
  category: safe_driving_rules
  question: 信号機や警察官が交通整理を行っている交差点でUターンをすることは合法ですか？
  choices:
    A: 信号が青であれば可能
    B: 対向車がいなければ可能
    C: いいえ、これらの交差点でUターンをしてはいけません
    D: はい、ただし郊外に限る
  answer: C
  explanation: マニュアルにはUターンをしてはいけない場所がリストされており、その中に「信号機や警察官が交通整理を行っている交差点」が含まれています。
- id: 458
  category: safe_driving_rules
  question: 環状交差点（ラウンドアバウト）から出る意思をどのように示すべきですか？
  choices:
    A: ヘッドライトを点滅させる
    B: 左の方向指示器（ウィンカー）を出す
    C: 右の方向指示器（ウィンカー）を出す
    D: クラクションを鳴らす
  answer: C
  explanation: マニュアルには「環状交差点を注意深く出てください。常に右の方向指示器を使用して出口を知らせてください」と指示されています。
- id: 459
  category: safe_driving_rules
  question: 4車線道路では、通常どこを走行すべきですか？
  choices:
    A: 常に一番左側の車線
    B: 追い越しや左折をする場合を除き、一番右側の車線
    C: 最も交通量の少ない車線
    D: 視認性を維持するために破線の白線をまたいで走行
  answer: B
  explanation: マニュアルによると、4車線道路では「他の車両を追い越す場合や左折をする場合を除き、一番右側の車線を走行してください」とされています。
- id: 460
  category: defensive_driving
  question: 分離帯のある4車線道路で指定されたクロスオーバー（横断路）を利用しようとする際、別の車両がすでにクロスオーバー内で待機している場合、どうすべきですか？
  choices:
    A: 待機車両の隣、クロスオーバーの左側に割り込む
    B: クロスオーバー内で待機車両のすぐ後ろに詰める
    C: 方向指示器を出したまま、道路の最も左側の車線で停止して待つ
    D: 次の交差点まで進んでUターンをする
  answer: C
  explanation: マニュアルには「車両がすでにクロスオーバー内で待機している場合は、その車両がクロスオーバーから出るまで、方向指示器を出したまま4車線道路の最も左側の車線で停止した状態で待機してください」と記載されています。
- id: 461
  category: signs_and_signals
  question: 車線の境界線や路肩のラインに、自分の方を向いている赤い反射板（リフレクター）が見えた場合、それは何を意味しますか？
  choices:
    A: 工事区間に近づいている
    B: 逆走しており、正面衝突の可能性がある
    C: 高乗車人数車（HOV）車線に入ろうとしている
    D: この先、制限速度が低下する
  answer: B
  explanation: マニュアルには、「赤い反射板は常に、逆走しており正面衝突の可能性があることを意味します」と警告されています。
- id: 462
  category: safe_driving_rules
  question: 共有センターターン車線（中央右左折専用車線）を走行できる最大距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: C
  explanation: マニュアルには、共有センターターン車線は「追い越しに使用することはできず、300フィートを超えて走行することはできません」と明記されています。
- id: 463
  category: safe_driving_rules
  question: 2台の車両が反対方向から同時に共有センターターン車線に入った場合、どちらに優先権がありますか？
  choices:
    A: より速い速度で走行している車両
    B: 右折しようとしている車両
    C: 2台のうち大きい方の車両
    D: 先に車線に入った車両
  answer: D
  explanation: マニュアルによると、「車両が反対方向からターン車線に入る場合、先に車線に入った車両に優先権があります」とされています。
- id: 464
  category: signs_and_signals
  question: リバーシブルレーン（時間帯により通行方向が変わる車線）は、通常路面にどのように表示されていますか？
  choices:
    A: 2本の黄色の破線
    B: 両側の白い実線
    C: 1本の黄色の実線
    D: 赤と白の交互の反射板
  answer: A
  explanation: マニュアルには、リバーシブルレーンは「通常、2本の黄色の破線でマークされています」と記載されています。
- id: 465
  category: signs_and_signals
  question: リバーシブルレーンを走行中、頭上の黄色い「X」の点滅は何を意味しますか？
  choices:
    A: その下の車線を走行することはできない
    B: その車線は右左折専用である
    C: 車線の進行方向が変わりつつある
    D: その車線を直進することができる
  answer: B
  explanation: マニュアルでは、「黄色い『X』の点滅は、その車線が右左折専用であることを意味します」と説明されています。
- id: 466
  category: signs_and_signals
  question: リバーシブルレーンの上に黄色い「X」が点灯しているのを見た場合、どのような行動をとるべきですか？
  choices:
    A: 車線を早く抜けるために加速する
    B: 車線内ですぐに停止する
    C: 安全が確認でき次第、すぐにその車線から出る
    D: 追い越しのためだけにその車線を使用する
  answer: C
  explanation: マニュアルによると、「黄色い『X』の点灯は、車線の使用目的または進行方向が変わりつつあることを意味し、安全が確認でき次第すぐにその車線から出る必要があります」とされています。
- id: 467
  category: signs_and_signals
  question: 「HOV 2」と書かれた標識は、専用車線について何を示していますか？
  choices:
    A: 少なくとも2人が乗車している車両専用の車線である
    B: 大型商用車専用の車線である
    C: この先2マイルは車線が閉鎖されている
    D: ハイブリッド車または電気自動車のみがその車線を使用できる
  answer: A
  explanation: マニュアルには次のように記載されています。「例えば、『HOV 2』は、その車線を合法的に走行するためには、車両に少なくとも2人が乗車していなければならないことを意味します。」
- id: 468
  category: defensive_driving
  question: 車線変更をする前に肩越しに目視確認することが不可欠なのはなぜですか？
  choices:
    A: 後続車の速度を確認するため
    B: 方向指示器が正しく作動しているか確認するため
    C: ミラーでは見えない死角に車両がいないか確認するため
    D: 他のドライバーに自分の意図を伝えるため
  answer: C
  explanation: マニュアルでは、ドライバーは「ミラーを確認するだけではオートバイや他の車を見ることはできません。隣にいる車両を確認するには、物理的に頭を回して各方向の肩越しに目視する必要があります」と死角の確認について説明しています。
- id: 469
  category: sharing_the_road
  question: 前方のドライバーが車線変更の合図を出した場合、どうすべきですか？
  choices:
    A: 相手が車線変更する前に追い越すために加速する
    B: 減速して、車線変更のためのスペースを空ける
    C: 相手の邪魔にならないように自分も車線変更する
    D: 動かないよう警告するためにクラクションを鳴らす
  answer: B
  explanation: マニュアルでは次のようにアドバイスしています。「前方のドライバー（自車線または隣の車線）が車線変更の合図を出したら、減速してスペースを空けてください。加速したり、自分自身が車線変更したりしないでください...」
- id: 470
  category: safe_driving_rules
  question: 片側1車線の道路（2車線道路）で他の車両を追い越そうとする際、対向車に関する適切なルールは何ですか？
  choices:
    A: 対向車の兆候が少しでも見えたら、追い越しを試みるには近すぎると判断する
    B: 対向車が100フィート以上離れていれば追い越してもよい
    C: 対向車が減速するようにヘッドライトを点滅させる
    D: 対向車が来る前に追い越せるよう急加速する
  answer: A
  explanation: マニュアルには次のように記載されています。「原則として、対向車の兆候が少しでも見えたら、追い越しを試みるには近すぎます。迷ったときは、自分の車線にとどまってください。」
- id: 471
  category: defensive_driving
  question: 追い越しを開始する前に、追い越したい車両の十分後方に留まるべきなのはなぜですか？
  choices:
    A: 素早く追い越すために十分な速度を出すため
    B: 前方の道路の視界をより良く確保するため
    C: 相手のタイヤが跳ね上げる破片が当たるのを避けるため
    D: 追い越しの準備ができるまで、相手の死角に隠れるため
  answer: B
  explanation: マニュアルには、「前方の道路の視界をより良く確保するために、追い越したい車両の十分後方に留まってください」と記載されています。
- id: 472
  category: defensive_driving
  question: 追い越し前に状況を確認するためだけに、センターラインを越えて車体を振り出すのを避けるべきなのはなぜですか？
  choices:
    A: いかなる状況においてもセンターラインを越えることは違法であるため
    B: 車間距離が近すぎるか、不安全な追い越しを試みていることを示すため
    C: 車両のトラクション（摩擦力）が失われる原因となるため
    D: 後続車のドライバーに、左折すると勘違いさせて混乱させるため
  answer: B
  explanation: マニュアルでは次のように警告しています。「確認のためにセンターラインを越えて車体を振り出さないでください。もし確認のためにこれを行う必要があるなら、車間距離が近すぎるか、無理な追い越しをしようとしています。」
- id: 473
  category: safe_driving_rules
  question: 州間高速道路（インターステート）のクロスオーバー（中央分離帯の横断路）に関して、正しい記述はどれですか？
  choices:
    A: 中央分離帯が舗装されていれば、Uターンのために使用できる
    B: 高占有車両（HOV）専用である
    C: 州間高速道路の一般交通用に提供されているクロスオーバーはない
    D: 交差する道路と同じように扱うべきである
  answer: C
  explanation: マニュアルには、「州間高速道路の交通用に提供されているクロスオーバー（横断路）はありません」と明記されています。
- id: 474
  category: safe_driving_rules
  question: 左側から車両を追い越した後、右車線に戻っても安全なのはいつですか？
  choices:
    A: 追い越した車両の50フィート前方に出たとき
    B: 追い越した車両のフロントバンパーを通過してすぐ
    C: 追い越した車両の全体がバックミラー（ルームミラー）で見えるようになったとき
    D: 追い越された側のドライバーがヘッドライトを点滅させたとき
  answer: C
  explanation: マニュアルには次のように記載されています。「追い越しはできるだけ早く完了させてください。追い越した車両の全体がバックミラーで見えるようになったら、右に合図を出し、元の車線に戻ってください。」
- id: 475
  category: safe_driving_rules
  question: テネシー州では、複数の車両を同時に追い越すことは違法ですか？
  choices:
    A: はい、法律で厳格に禁止されています
    B: いいえ、違法ではありませんが、一般的には推奨されません
    C: はい、多車線道路にいる場合を除き禁止されています
    D: いいえ、流れの遅い交通を追い越すための推奨される方法です
  answer: B
  explanation: マニュアルには、「一般的なルールとして、一度に複数の車両を追い越すことは安全ではありませんが、テネシー州において複数の車両を追い越すことは違法ではありません。ただし、特定の条件を満たさない限り、複数台の追い越しは検討すらしないことが推奨されます」と記されています。
- id: 476
  category: safe_driving_rules
  question: 次の条件のうち、右側からの追い越しが許可されるのはどれですか？
  choices:
    A: 前方の車両が左折の合図を出しているとき
    B: ハイウェイの舗装された路肩を使用するとき
    C: 渋滞を回避するために指定された自転車レーンを使用するとき
    D: 2車線道路で前方の車両が制限速度以下で走行しているとき
  answer: A
  explanation: 右側からの追い越しは、「追い越される車両が左折の合図を出しているか、まさに左折しようとしているとき」に許可されます。舗装路の外や自転車レーンを通っての追い越しは決して許可されません。
- id: 477
  category: safe_driving_rules
  question: 路肩（非常用車線）や駐車車線を使用して右側から車両を追い越すことが許可されるのはいつですか？
  choices:
    A: 前方の車両が赤信号で停止しているとき
    B: 信号機や一時停止標識が見える範囲にいるとき
    C: 前方の車両が左折しているとき
    D: 駐車車線や路肩を使用して右側から追い越すことは決して許可されません
  answer: D
  explanation: マニュアルには、「いかなる場所においても、自転車レーンや駐車車線を使用して右側から追い越してはなりません。また、信号機や一時停止標識が見える範囲の路肩（非常用車線）での追い越しも禁止されています」と明記されています。
- id: 478
  category: sharing_the_road
  question: 多車線道路の横断歩道で停止する場合、横断歩道の手前どのくらいの距離で停止すべきですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 30フィート
    D: 50フィート
  answer: C
  explanation: マニュアルの安全上のヒントによると、「多車線道路で横断歩道のために停止するときは、他の車線のドライバーから横断中の歩行者が見えなくなるのを防ぐため、横断歩道の約30フィート手前で停止すべきです」とされています。
- id: 479
  category: signs_and_signals
  question: 「追い越し禁止区間（no-passing zone）」の終了は何を示していますか？
  choices:
    A: 自動的に追い越しが安全であることを示す
    B: 前方の視界が良くなったことを示すが、追い越しが安全かどうかは依然として自分で判断しなければならない
    C: 前方の遅い車両を追い越さなければならないことを示す
    D: 制限速度が上がることを示す
  answer: B
  explanation: マニュアルには、「『追い越し禁止区間』の終了は、追い越しが安全であることを意味するわけではありません。それは前方の視界が良くなったことを意味します。追い越しが安全かどうかを判断するのは、依然としてあなた自身です」と記載されています。
- id: 480
  category: safe_driving_rules
  question: 「追い越し禁止区間」で路面に引かれた黄色の実線を越えることは許可されますか？
  choices:
    A: いいえ、黄色の実線を越えることは決して許可されません
    B: はい、ただし低速のトラクターや自転車を追い越す場合に限ります
    C: はい、路地、私道、またはドライブウェイに出入りするためにセンターラインを横切って曲がることは可能です
    D: はい、対向車が来る前に追い越しを完了できるのであれば可能です
  answer: C
  explanation: マニュアルでは、「追い越し禁止区間であっても、路地、交差点、私道、またはドライブウェイへの左折、あるいはそこからの左折を行うためにセンターラインを横切ることは許可されています」と説明されています。
- id: 481
  category: defensive_driving
  question: 他の車両があなたを追い越そうとしているときに、対向車が近づいてくるのが見えた場合、どうすべきですか？
  choices:
    A: 追い越し車両が自分の後ろに入れるよう、速度を上げる。
    B: 左側に移動して、追い越し車両をブロックする。
    C: 減速して、追い越し車両が右車線に戻るためのスペースを確保する。
    D: クラクションを鳴らし、現在の速度を維持する。
  answer: C
  explanation: 他のドライバーが安全に追い越しを終えられるよう手助けするために、「追い越されている最中に対向車が近づいてくるのが見えた場合は、減速する」必要があります。減速することで、追い越し車両が右車線に戻るための十分なスペースを提供できます。
- id: 482
  category: sharing_the_road
  question: 自転車を追い越す際、自車と自転車の間に空けなければならない最低限の距離はどれくらいですか？
  choices:
    A: 2フィート
    B: 3フィート
    C: 4フィート
    D: 5フィート
  answer: B
  explanation: マニュアルには次のように記載されています。「同じ方向に進んでいる自転車を追い越す際は、ゆっくりと走行し、自転車との間に少なくとも3フィート（約0.9メートル）以上の距離を空けてください。」
- id: 483
  category: sharing_the_road
  question: 大型トラックやバスの後方を走行中、自分が相手の死角に入っているかどうかをどのように判断できますか？
  choices:
    A: 相手のルームミラーに運転手の顔が見える。
    B: トラックやバスのサイドミラーが見えない。
    C: 100フィート以上の車間距離を空けて走行している。
    D: トラックのトレーラー全体が見える。
  answer: B
  explanation: マニュアルには重要なポイントが記されています。「追従しているトラックやバスのサイドミラーが見えない場合、そのトラックやバスの運転手からもあなたの姿は見えていません。」
- id: 484
  category: sharing_the_road
  question: 大型トラックやバスを追い越した直後に、ドライバーが犯しがちな危険な間違いは何ですか？
  choices:
    A: 元の車線に戻った後、急加速しすぎる。
    B: トラックやバスの直前に割り込み、減速する。
    C: ウインカーを消すのが早すぎる。
    D: 自車とトラックの間に車間距離を空けすぎる。
  answer: B
  explanation: マニュアルでは次のように指示されています。「速度を維持してください。トラックやバス（またはあらゆる種類の車両）の前に割り込んで減速することは絶対にしないでください。これは、今追い越したばかりの車両の安全な車間距離（セーフティ・クッション）を奪う行為です。」
- id: 485
  category: sharing_the_road
  question: 下り坂を走行していることは、大型トラックやバスの追い越しにどのような影響を与えますか？
  choices:
    A: トラックの速度が落ちるため、追い越しやすくなる。
    B: トラックの慣性（勢い）によって速度が上がるため、追い越すために自車の速度を上げる必要があるかもしれない。
    C: トラックは路肩に寄ることを強制される。
    D: 下り坂での追い越しは法律で厳格に禁止されている。
  answer: B
  explanation: マニュアルでは地形の影響について説明しています。「下り坂では、慣性によってトラックの速度が上がるため、追い越すために速度を上げる必要がある場合があります。」
- id: 486
  category: defensive_driving
  question: 他のドライバーがあなたの左側から追い越そうとしている場合、適切な手順は何ですか？
  choices:
    A: 急な割り込みを防ぐために加速する。
    B: 危険だと思われる場合は、左車線に移動してブロックする。
    C: 自分の車線を維持し、右側に寄って、速度を維持する。
    D: ハイビームを点滅させて対向車に警告する。
  answer: C
  explanation: 追い越されるときは、次のようにして相手を助けるべきです。「自分の車線を維持し、左側から追い越される場合は右側に寄ります。速度を維持してください。相手の追い越しを妨げるために加速してはいけません。」
- id: 487
  category: safe_driving_rules
  question: 次の状況のうち、追い越しのためのセンターライン越えが禁止されているのはどれですか？
  choices:
    A: 横断歩道で歩行者のために停止している車両を追い越すとき。
    B: 前方の車両が制限速度より15マイル以上遅く走行しているとき。
    C: 直線で平坦な道路であり、視界が非常に良好なとき。
    D: 前方の車両が自転車であるとき。
  answer: A
  explanation: マニュアルには、追い越しのためのセンターライン越えが禁止されている条件がいくつか挙げられており、その中に「標識のあるなしにかかわらず、横断歩道で歩行者のために停止している車両を追い越してはならない」という規定があります。
- id: 488
  category: safe_driving_rules
  question: 他の車両を追い越す際、掲示されている制限速度を超えても法的に認められますか？
  choices:
    A: はい、ただし最大5マイルまでとする。
    B: はい、複数のトレーラーを連結した商用トラックを追い越す場合なら認められる。
    C: いいえ、追い越し中であっても制限速度を超えることは違法です。
    D: はい、下り坂で素早く追い越す必要がある場合なら認められる。
  answer: C
  explanation: マニュアルには次のように明記されています。「他の車両を追い越す際であっても、掲示されている制限速度を超えることは違法であることを忘れないでください。」
- id: 489
  category: safe_driving_rules
  question: 車両を後退（バック）させる際、後方を確認する適切な方法は何ですか？
  choices:
    A: ルームミラーとサイドミラーのみに頼る。
    B: ドアを開けて頭を外に出して確認する。
    C: 座席の背もたれに腕を置き、振り向いてリアウィンドウから直接後方を見る。
    D: クラクションを鳴らし、ルームミラーを確認しながら素早くバックする。
  answer: C
  explanation: バックする前には、座席の背もたれに腕を置いて振り向き、リアウィンドウから直接後方を確認できるようにする必要があります。マニュアルでは、ミラーだけに頼ることや、ドアを開けて外を見ることを明示的に警告しています。
- id: 490
  category: safe_driving_rules
  question: 州間高速道路（インターステート）で曲がり角や出口を通り過ぎてしまった場合、どうすべきですか？
  choices:
    A: 停止して、路肩を慎重にバックする。
    B: ハザードランプを点灯させ、走行車線をバックする。
    C: 中央分離帯を横切ってUターンする。
    D: 次の曲がり角や出口まで進み、そこで安全かつ合法的に引き返す。
  answer: D
  explanation: 曲がり角や出口を通り過ぎてしまった場合、バックしてはいけません。次の出口まで進み、安全かつ合法的に転回できる場所を探してください。高速道路でのバック走行は違法です。
- id: 491
  category: safe_driving_rules
  question: 市街地以外の道路に隣接して駐車する場合、車両は前後どちらの方向からも少なくとも何フィート離れた場所から見える状態でなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: C
  explanation: 市街地以外の道路に隣接して駐車する場合、車両は前後どちらの方向からも少なくとも200フィート離れた場所から見える状態でなければなりません。
- id: 492
  category: safe_driving_rules
  question: 市街地以外で駐車する場合、他の車両が通過できるように、少なくともどれくらいの道路幅を確保しなければなりませんか？
  choices:
    A: 10フィート
    B: 12フィート
    C: 15フィート
    D: 18フィート
  answer: D
  explanation: どのような状況であっても、市街地以外の道路に隣接して駐車する際は、他の車両が通過できるように少なくとも18フィートの道路幅を確保しなければなりません。
- id: 493
  category: safe_driving_rules
  question: 縁石のある上り坂で駐車する場合、前輪はどちらの方向に向けるべきですか？
  choices:
    A: 縁石の方（右）
    B: 縁石とは反対の方（左）
    C: まっすぐ前
    D: 縁石と平行
  answer: B
  explanation: 縁石のある上り坂では、前輪を縁石とは反対の方（左）に向けてください。これにより、万が一車が後退し始めても、縁石に当たって止まるようになります。
- id: 494
  category: safe_driving_rules
  question: 消火栓から何フィート以内の場所に駐車することは禁止されていますか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: B
  explanation: マニュアルの「駐車禁止区域」の項目には、消火栓から15フィート以内での駐車は違法であると記載されています。
- id: 495
  category: safe_driving_rules
  question: 横断歩道から何フィート以内の場所に駐車してはいけませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 30フィート
  answer: C
  explanation: 横断歩道から20フィート以内、または横断歩道としてマークされている区域内に駐車することは違法です。
- id: 496
  category: safe_driving_rules
  question: 縦列駐車を完了した際、車両は縁石から最大で何インチ以内に収める必要がありますか？
  choices:
    A: 6インチ
    B: 12インチ
    C: 18インチ
    D: 24インチ
  answer: C
  explanation: 縦列駐車を完了した際、車両は縁石から18インチ以内に収める必要があります。
- id: 497
  category: defensive_driving
  question: 故障した車両を高速道路（ハイウェイ）の外に移動できない場合、他のドライバーに警告する方法の一つは何ですか？
  choices:
    A: 道路に立ち、腕を振る。
    B: 左側のドアハンドルまたはアンテナにハンカチを結びつける。
    C: ヘッドライトを連続して点滅させる。
    D: 10秒ごとにクラクションを鳴らす。
  answer: B
  explanation: 車両を高速道路の外に移動できない場合は、ボンネットを上げるか、左側のドアハンドルまたはアンテナにハンカチを結びつけて、停車していることを他のドライバーに知らせてください。
- id: 498
  category: vehicle_information
  question: マニュアル車を駐車する際、トランスミッションはどのようにすべきですか？
  choices:
    A: ニュートラルに入れ、パーキングブレーキをかける。
    B: 「P（パーキング）」に入れる。
    C: ギアを入れた状態にし、パーキングブレーキをかける。
    D: パーキングブレーキをかけずにニュートラルにする。
  answer: C
  explanation: 駐車する際は常にパーキングブレーキをかけてください。マニュアル車の場合はギアを入れ、オートマチック車の場合は「P（パーキング）」に入れてください。
- id: 499
  category: safe_driving_rules
  question: 私道から交差点内へバックで進入することは合法ですか？
  choices:
    A: はい、最初に両方向を確認すれば可能です。
    B: はい、ただし日中の時間帯に限ります。
    C: いいえ、私道から交差点内へバックで進入することは違法です。
    D: いいえ、誘導してくれる同乗者がいない限り違法です。
  answer: C
  explanation: マニュアルには「私道から交差点内へバックで進入することは違法である」と明記されています。
- id: 500
  category: safe_driving_rules
  question: 州間高速道路（インターステート）を歩くことについて、ドライバーズマニュアルにはどのように記載されていますか？
  choices:
    A: 路肩を歩く限り許可される。
    B: 日中の時間帯のみ合法である。
    C: 違法かつ危険である。
    D: 車が故障し、ガソリンが必要な場合に推奨される。
  answer: C
  explanation: マニュアルには、州間高速道路を歩くことは違法かつ危険であり、助けが来るまで故障した車の中で待機すべきであると明記されています。
- id: 501
  category: penalties_and_points
  question: 指定された身体障害者用駐車スペースに不適切に駐車した場合の罰則は何ですか？
  choices:
    A: 50ドルの罰金と書面による警告。
    B: 100ドルの罰金が科せられる軽罪であり、車両がレッカー移動される場合がある。
    C: 500ドルの罰金が科せられる重罪。
    D: 30日間の即時免許停止。
  answer: B
  explanation: 指定された身体障害者用駐車スペースへの不適切な駐車は、100ドルの罰金が科せられる軽罪であり、車両はレッカー移動の対象となる可能性があります。
- id: 502
  category: safe_driving_rules
  question: 斜め駐車スペースからバックで出る際、車の前方について何を覚えておくべきですか？
  choices:
    A: 曲がる方向と同じ方向に振れる。
    B: 曲がる方向とは逆の方向に振れる。
    C: 振れることなく、そのまま真っ直ぐ後ろに動く。
    D: 最も近い縁石の方に振れる。
  answer: B
  explanation: 斜め駐車スペースからバックで出る前に、車の前方が曲がる方向とは逆の方向に振れることを覚えておかなければなりません。
- id: 503
  category: sharing_the_road
  question: 同じ方向に進んでいる自転車を追い越す際、運転者は法律により最低どれくらいの間隔を空けることが義務付けられていますか？
  choices:
    A: 1フィート
    B: 2フィート
    C: 3フィート
    D: 5フィート
  answer: C
  explanation: 同じ方向に進んでいる自転車を追い越す際、運転者は法律により最低3フィートの間隔を空けることが義務付けられています。
- id: 504
  category: safe_driving_rules
  question: 州間高速道路（インターステート）に入る際、加速車線の適切な使い方は何ですか？
  choices:
    A: 緊急時に車両を駐車するため。
    B: 停止して、交通の流れに大きな隙間ができるのを待つため。
    C: 加速して、高速で走行している交通の流れに合流するため。
    D: 州間高速道路の交通が流出するための場所として提供するため。
  answer: C
  explanation: 州間高速道路に入る際は、合流車線または加速車線を使用して加速し、すでに州間高速道路を走行している高速な交通の流れに合流しなければなりません。
- id: 505
  category: safe_driving_rules
  question: オンランプから州間高速道路（インターステート）に入ろうとする際、誰に優先権がありますか？
  choices:
    A: 州間高速道路に入ろうとしている車両。
    B: すでに州間高速道路を走行している他の車。
    C: より速い速度で走行している方の車両。
    D: 右側にいる車両。
  answer: B
  explanation: 州間高速道路に入る際は、すでに走行している他の車に道を譲る（優先権を与える）責任があります。
- id: 506
  category: signs_and_signals
  question: 「車線増加（lane added）」の標識は、すでに州間高速道路（インターステート）を走行している運転者に何を示していますか？
  choices:
    A: 直ちに左側に合流しなければならない。
    B: その場所では右側への車線変更を避けるべきである。
    C: 進入してくるすべての交通に道を譲らなければならない。
    D: 州間高速道路が終了するため、出口に出なければならない。
  answer: B
  explanation: 「車線増加」の標識は、進入してくる交通のために新しい右車線が追加されることを意味します。進入してくる車は自らの進路に車両が移動してくることを想定していないため、州間高速道路を走行中の車両は右側への車線変更を避けるべきです。
- id: 507
  category: safe_driving_rules
  question: 同じ方向に進む複数の車線がある州間高速道路（インターステート）において、一番左側の車線は何のために使用されるべきですか？
  choices:
    A: 進入してくる交通のため。
    B: 流出する交通のため。
    C: 低速車両のため。
    D: より速い交通のため。
  answer: D
  explanation: 同じ方向に進む複数の車線がある州間高速道路では、一番左側の車線はより速い交通のために空けておくべきです。
- id: 508
  category: defensive_driving
  question: 悪天候時や夜間に州間高速道路（インターステート）を走行する際、推奨される最低限の車間距離はどれくらいですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒
    D: 6秒
  answer: C
  explanation: 前方の車両とは少なくとも2秒の間隔を保つべきですが、悪天候、夜間走行、および速度の速い地方部では、この間隔を最低4秒に広げる必要があります。
- id: 509
  category: defensive_driving
  question: 州間高速道路（インターステート）を走行中、どれくらい先まで道路をスキャン（注視）すべきですか？
  choices:
    A: 5〜10秒先
    B: 10〜15秒先
    C: 15〜20秒先
    D: 20〜30秒先
  answer: C
  explanation: マニュアルでは、ブレーキをかけている車、進入してくる車、または流出する車を確認するために、前方の道路をスキャンし、自車の15〜20秒先を見るようにアドバイスしています。
- id: 510
  category: defensive_driving
  question: 州間高速道路（インターステート）で渋滞を発見し、減速または停止しなければならない場合、後続の運転者に知らせるために何をすべきですか？
  choices:
    A: ハイビームを点灯させる。
    B: ブレーキペダルを数回軽く踏む（ポンピングブレーキ）。
    C: クラクションを鳴らし続ける。
    D: 車線内で左右に蛇行する。
  answer: B
  explanation: 減速や停止を余儀なくされる渋滞を発見した場合は、ブレーキペダルを数回軽く踏んで、後続の運転者に注意を促すべきです。
- id: 511
  category: defensive_driving
  question: マニュアルの例題によると、安全な車間距離を保つための「2秒ルール」が当てはまるのは：
  choices:
    A: 時速30マイル（30 m.p.h.）までの速度
    B: 時速55マイル（55 m.p.h.）までの速度
    C: いかなる速度でも
    D: 高速道路の速度のみ
  answer: C
  explanation: 例題では、安全な車間距離を保つための2秒ルールはいかなる速度においても当てはまると述べられています。
- id: 512
  category: safe_driving_rules
  question: 州間高速道路（インターステート）を出る際、最も安全な準備方法は何ですか？
  choices:
    A: 急な車線変更を避けるため、できるだけ早く右車線に移動する。
    B: 出口ランプに着くまで左車線にとどまる。
    C: 出口に割り込む前に、遅い車を追い越すために加速する。
    D: 走行車線で停止し、右車線に隙間ができるのを待つ。
  answer: A
  explanation: 州間高速道路を出る場合は、危険な状況を招く可能性のある急な車線変更を避けるため、できるだけ早く右車線に移動してください。
- id: 513
  category: penalties_and_points
  question: 優先車線（HOVレーン）の規則に違反した場合の罰則は何ですか？
  choices:
    A: 25ドルの罰金
    B: 50ドルの罰金と裁判費用
    C: 100ドルの罰金と免許証の点数2点
    D: 75ドルの罰金と交通安全講習の義務付け
  answer: B
  explanation: マニュアルによると、HOVレーン違反と判定された運転者には、50ドルの罰金と裁判費用が科せられます。
- id: 514
  category: safe_driving_rules
  question: 交通のピーク時間帯に、優先車線（HOVレーン）の使用が許可されているのは次のうちどれですか？
  choices:
    A: 他の車両を追い越すために一人で運転している人
    B: 一人が乗車しているオートバイ
    C: 運転手のみが乗車している乗用車
    D: 運転手一人の商用トラック
  answer: B
  explanation: 流入・流出の交通量が多い時間帯、HOVレーンは2人以上が乗車している車両、2人以上が乗車しているバス、1人が乗車しているオートバイ、および緊急車両専用となります。
- id: 515
  category: safe_driving_rules
  question: 州間高速道路の左車線を走行中に、後方からより速い速度で車両が近づいてきた場合、どうすべきですか？
  choices:
    A: 相手の速度に合わせて加速する
    B: ブレーキを軽く踏んで減速するよう警告する
    C: 右側の車線に一つ移動する
    D: 法定速度で走っているため、そのままの車線を維持する
  answer: C
  explanation: マニュアルには次のように記載されています。「左車線を走行中に後方からより速い速度で誰かが近づいてきた場合は、右側の車線に一つ移動してください。左車線は追い越し専用です。」
- id: 516
  category: safe_driving_rules
  question: クローバー型インターチェンジで左折するにはどうすればよいですか？
  choices:
    A: 跨道橋（オーバーパス）の手前で左折ランプに入る
    B: 跨道橋を通過した直後の右折ランプに入る
    C: 跨道橋の手前で右折ランプに入る
    D: 対向車線を横切って左折する
  answer: B
  explanation: クローバー型インターチェンジでは、すべての曲がり角が右折となります。左折するには、跨道橋を通過した直後の右折ランプに入る必要があります。
- id: 517
  category: sharing_the_road
  question: トラックやバスが州間高速道路に進入してくるときは、どうすべきですか？
  choices:
    A: 素早く通り過ぎるために加速する
    B: 自分の存在を知らせるためにクラクションを鳴らす
    C: 協力的になり、相手が交通の流れに合わせられるよう、十分な時間とスペースを与える
    D: 自分の速度と車線位置を維持することで、相手に譲るよう強制する
  answer: C
  explanation: 州間高速道路に進入するトラックやバスは、交通パターンに合わせるために余分な時間を必要とする場合があることを覚えておいてください。協力的になり、相手が交通の流れに合わせられるよう、十分な時間とスペースを与えてください。
- id: 518
  category: safe_driving_rules
  question: 州間高速道路を出る際、いつ大幅な減速を開始すべきですか？
  choices:
    A: 出口の1マイル手前
    B: 出口の意思を示す合図を出したらすぐに
    C: 減速車線に入った後
    D: まだ本線車道を走行している間
  answer: C
  explanation: 通常は一連の白い反射板で区切られている減速車線に入るまでは速度を維持し、その後、出口ランプに掲示されている制限速度まで減速してください。
- id: 519
  category: safe_driving_rules
  question: 州間高速道路の入口または出口ランプの舗装部分または未舗装部分に自動車を駐車することが合法となるのは、どのような条件の場合ですか？
  choices:
    A: 地図やGPSを確認する必要があるとき
    B: 車両が故障している場合のみ
    C: 電話をかける必要があるとき
    D: 他の車両が追いつくのを待っている場合
  answer: B
  explanation: 車両が故障している場合を除き、高速道路の入口または出口ランプの舗装部分または未舗装部分に自動車を駐車することは違法です。
- id: 520
  category: defensive_driving
  question: 「ウィービング（交差）」型インターチェンジが特に危険なのはなぜですか？
  choices:
    A: 同じ車線で車両の流出と流入の両方が行われるため
    B: 車線が標準的な州間高速道路の車線よりも狭いため
    C: 運転者が交通を横切って急な左折をしなければならないため
    D: ランプに制限速度が掲示されていないため
  answer: A
  explanation: 最も危険な車線管理状況の一つは、州間高速道路の交通が同じ車線で流出と流入の両方を行うときに発生し、細心の注意と素早い反応が必要とされます。
- id: 521
  category: safe_driving_rules
  question: 州間高速道路（インターステート）の中央分離帯を越えて走行することが法律で許可されているのは誰ですか？
  choices:
    A: 出口を通り過ぎてしまったすべてのドライバー
    B: 高占有車両（HOV）の運転手
    C: 緊急車両および道路維持作業員のみ
    D: 深刻な交通渋滞時のすべてのドライバー
  answer: C
  explanation: 州間高速道路では、いかなる分離帯や区分帯を越えて走行することも禁止されています。中央分離帯を横断できるのは、緊急車両と道路維持作業員のみです。
- id: 522
  category: defensive_driving
  question: 州間高速道路で他のドライバーの死角を走行することに関して、推奨される行為は何ですか？
  choices:
    A: エンジン音が聞こえるように、横の至近距離を走行する
    B: 後ろに留まるか、追い越すかのどちらかにする
    C: 死角にいる間、継続的にヘッドライトを点滅させる
    D: 相手の死角に関係なく、速度と位置を維持する
  answer: B
  explanation: 他のドライバーの死角を走行してはいけません。前方のドライバーから自分の車が見えない位置を走行するのは危険です。後ろに留まるか、追い越すようにし、横に並んで走り続けないでください。
- id: 523
  category: safe_driving_rules
  question: 週末、HOV車線（高占有車両車線）はどのように利用されますか？
  choices:
    A: すべての交通に対して閉鎖される
    B: 緊急車両専用として厳格に予約される
    C: すべての車両が利用できる一般車線として機能する
    D: 乗員が2名ではなく3名以上必要になる
  answer: C
  explanation: HOV車線は、週末および平日の混雑時間帯以外は、一般車線として機能します。
- id: 524
  category: defensive_driving
  question: マニュアルによると、夜間の運転が昼間の運転よりもはるかに危険であると考えられているのはなぜですか？
  choices:
    A: 夜間は制限速度が引き上げられるため
    B: 道路上の商用トラックの数が増えるため
    C: 疲労、視力の急激な低下、および飲酒運転者が増えるため
    D: エネルギー節約のために高速道路の照明が頻繁に消されるため
  answer: C
  explanation: 夜間の運転は昼間よりもはるかに危険です。主な原因は疲労と視力の急激な低下であり、また夜間は飲酒運転者が道路にいる可能性が高くなります。
- id: 525
  category: defensive_driving
  question: 高速道路催眠現象（インターステート・ヒプノーシス）を避けるために、どのくらいの頻度で停車してリフレッシュすべきですか？
  choices:
    A: 少なくとも4時間ごと、または200マイルごと
    B: 少なくとも2時間ごと、または100マイルごと
    C: 少なくとも6時間ごと、または300マイルごと
    D: 燃料を補給する必要がある時のみ
  answer: B
  explanation: 高速道路催眠現象を避けるために、マニュアルでは少なくとも2時間ごと、または約100マイルごとに休憩を取り、車から降りることを推奨しています。
- id: 526
  category: safe_driving_rules
  question: 道路上の安全を維持するために、1日に運転すべき最大時間は何時間ですか？
  choices:
    A: 6時間
    B: 8時間
    C: 10時間
    D: 12時間
  answer: B
  explanation: マニュアルには、自分自身と他者の安全のために、1日の運転時間は8時間を超えないようにするのが最も安全であると記載されています。
- id: 527
  category: signs_and_signals
  question: 電光掲示板（ダイナミックメッセージサイン）は、使用されていないときは何を表示していますか？
  choices:
    A: 現在の高速道路の制限速度
    B: 現地の時刻と気温
    C: 通常は何も表示されない（空白）
    D: 地元企業の広告
  answer: C
  explanation: 電光掲示板はドライバーにリアルタイムの情報を提供しますが、マニュアルには、これらのサインは使用されていないときは通常何も表示されないと記されています。
- id: 528
  category: defensive_driving
  question: 事故や異常な事態を見るために速度を落とし、交通渋滞を引き起こす運転行動は何と呼ばれますか？
  choices:
    A: 車間距離の詰めすぎ（テイルゲーティング）
    B: わき見渋滞（ラバーネッキング）
    C: 高速道路催眠現象
    D: 不必要な車線変更
  answer: B
  explanation: マニュアルでは、事故やその他の異常な事態を見るために速度を落とす行為を「ラバーネッキング（わき見）」と定義しており、これは渋滞を引き起こす最悪の原因の一つであるとしています。
- id: 529
  category: sharing_the_road
  question: 路肩に停車中の緊急車両に近づく際、交通状況により車線変更が安全に行えない場合はどうすべきですか？
  choices:
    A: 交通が途切れるまで自分の車線で停車する
    B: 緊急車両をできるだけ早く通り過ぎるために加速する
    C: 反対側の路肩に車を寄せる
    D: 速度を落とし、同じ車線に留まる
  answer: D
  explanation: 交通状況により車線変更を行うのが安全でない場合に限り、ドライバーは速度を落とし、同じ車線に留まることで対応することが許可されます。
- id: 530
  category: sharing_the_road
  question: 緊急車両や維持管理車両に加えて、テネシー州のムーブ・オーバー法（路肩停止車両保護法）はどのような車両に適用されますか？
  choices:
    A: 高速道路を走行中のすべての車両
    B: 非常点滅表示灯（ハザードランプ）を点灯させて停車しているすべての自動車
    C: 路肩を走行中の自転車
    D: ハイウェイ沿いを歩いている歩行者
  answer: B
  explanation: マニュアルによると、ムーブ・オーバー法は停車中の緊急車両に加え、ハザードランプを点灯させて停車している乗用車やトラックなどのすべての自動車にも適用されます。
- id: 531
  category: safe_driving_rules
  question: 車両が故障して助けが必要な場合、他の運転者や警察官にどのように合図を送るべきですか？
  choices:
    A: 車線の中央に立ち、腕を振る。
    B: ボンネットを開け、ボンネットまたはラジオアンテナに白い布を結びつける。
    C: ヘッドライトを繰り返し点滅させる。
    D: クラクションを鳴らし続ける。
  answer: B
  explanation: 車両のトラブルで助けが必要な場合、マニュアルではボンネットを開け、ボンネットまたはラジオアンテナに白い布を結びつけることを推奨しています。
- id: 532
  category: safe_driving_rules
  question: 車両のトラブルで路肩に停車した場合、助けを待つのに最も安全な場所はどこですか？
  choices:
    A: 電話を探すために州間高速道路沿いを歩く。
    B: 車のトランクの上に座る。
    C: 車内、または車両の近くで交通の流れから離れた側。
    D: 交通整理をするために、車両の隣の車線に立つ。
  answer: C
  explanation: マニュアルには、可能であれば車内、または車両の近くで交通の流れから離れた側に留まる方が良いと記載されており、州間高速道路沿いを歩くことは危険であると指摘されています。
- id: 533
  category: driver_responsibility
  question: 州間高速道路で交通事故に遭った場合、テネシー州法で車両を緊急車線（路肩）に移動させることが許可されるのはどのような時ですか？
  choices:
    A: 警察が到着し、写真を撮った後のみ。
    B: 車両が走行可能で、重大な人身傷害や死亡者がいない場合。
    C: 事故後に車両を移動させることは決して許可されない。
    D: 3台以上の車両が事故に巻き込まれた場合のみ。
  answer: B
  explanation: 「安全のための移動（Move It for Safety）」のセクションに基づき、車両がまだ走行可能で、重大な人身傷害や死亡者がいない場合は、車両を緊急車線に移動させることができます。
- id: 534
  category: safe_driving_rules
  question: テネシー州ハイウェイパトロールの指令センターに繋がる、携帯電話から無料でダイヤルできる番号は何番ですか？
  choices:
    A: '*DOT (*368)'
    B: '*HELP (*4357)'
    C: '*THP (*847)'
    D: '*911 (*911)'
  answer: C
  explanation: 高速道路での緊急時には、*THP (*847) をダイヤルすることで、最寄りのテネシー州ハイウェイパトロールの通信指令員に繋がります。
- id: 535
  category: defensive_driving
  question: 高速道路催眠現象（ハイウェイ・ヒプノーシス）を避けるために、運転者が習慣づけるべきことは何ですか？
  choices:
    A: 道路の線をまっすぐ前方に見つめる。
    B: 目線を左右に動かし、バックミラーを確認する。
    C: 車内をできるだけ暖かく保つ。
    D: 風の音やタイヤのうなり音を一定に聞き続ける。
  answer: B
  explanation: 高速道路催眠現象を防ぐため、マニュアルでは、まっすぐ前方を見つめるのを避け、常に目線を左右に動かしたりバックミラーを確認したりすることを推奨しています。
- id: 536
  category: sharing_the_road
  question: 複数車線の高速道路で緊急車両が左側の路肩に停車している場合、「ムーブ・オーバー法（Move Over Law）」に従って何をすべきですか？
  choices:
    A: 右側の車線に合流し、最も左側の車線を安全バリアとして空ける。
    B: 緊急車両に近づくために、左側の車線に合流する。
    C: 左側の車線で車両を停止させる。
    D: 追い越すために右側の路肩を走行する。
  answer: A
  explanation: 緊急車両が左側の路肩に停車している場合、運転者は右側の車線に合流し、最も左側の車線を安全バリアとして空けます。
- id: 537
  category: vehicle_information
  question: マニュアルによると、特に冬の旅行中の緊急事態に備えて車に携帯することが推奨されているアイテムは次のうちどれですか？
  choices:
    A: 携帯用扇風機
    B: 凍結した窓用のウィンドウスクレーパー
    C: 予備のエンジン冷却水
    D: サンシェード
  answer: B
  explanation: 推奨される安全・緊急用装備のセクションでは、冬の旅行中には毛布、小型の携帯用ヒーター、凍結した窓用のウィンドウスクレーパー、およびスノータイヤまたはタイヤチェーンを携帯すべきであると述べられています。
- id: 538
  category: safe_driving_rules
  question: 州間高速道路に進入する際の適切な手順は何ですか？
  choices:
    A: 停止して車を確認し、安全な時に進入する。
    B: 車を確認し、走行車線に入る前に時速25マイル（25 MPH）まで減速する。
    C: 車を確認し、交通の流れに合わせて加速し、道が開いている時に合流する。
    D: クラクションを鳴らし、現在の速度を維持して、右側の車線に直接合流する。
  answer: C
  explanation: マニュアルの練習問題によると、州間高速道路に進入する際は、車を確認し、交通の流れに合わせて加速し、道が開いている時に合流する必要があります。
- id: 539
  category: safe_driving_rules
  question: テネシー州の州間高速道路において、緊急用クロスオーバー（中央分離帯の連絡路）の使用が法的に許可されているのは誰ですか？
  choices:
    A: 出口を通り過ぎてしまったすべての運転者。
    B: 他に車両がいなければ、すべての運転者。
    C: 渋滞時の商用トラックの運転手。
    D: 緊急車両および道路維持作業車のみ。
  answer: D
  explanation: テネシー州では、州間高速道路の緊急用クロスオーバーの使用は、緊急車両および道路維持作業車のみに法的に許可されています。
- id: 540
  category: defensive_driving
  question: 州間高速道路での事故で車両が損傷し、重大な怪我人がいない場合、どうすべきですか？
  choices:
    A: 警察が到着するまで、車両を走行車線に残しておく。
    B: 損傷した車両を路肩に移動させる。
    C: 保険情報を安全に交換するために交通を止める。
    D: 車両を放置して、最寄りの出口まで歩く。
  answer: B
  explanation: テネシー州運輸局は、重大な怪我が発生していない場合は損傷した車両を路肩に移動させるよう、運転者に注意を促す標識を設置しています。
- id: 541
  category: defensive_driving
  question: 統計的に、他のどの曜日よりも多くの死亡事故が発生するのはいつですか？
  choices:
    A: 月曜日と火曜日の午前中
    B: 水曜日と木曜日の夜間
    C: 金曜日と土曜日の夜間
    D: 日曜日の午後
  answer: C
  explanation: マニュアルによると、金曜日と土曜日の夜間は、他のどの曜日よりも多くの死亡事故が発生します。
- id: 542
  category: safe_driving_rules
  question: 夜間の安全運転の基本ルールは何ですか？
  choices:
    A: 常にハイビームを使用する。
    B: ヘッドライトの照射範囲を超えた速度で走らない（Never outrun your headlights）。
    C: 視界に関係なく、掲示されている制限速度で走行する。
    D: 車内のルームランプを点灯させておく。
  answer: B
  explanation: 夜間の安全運転の基本ルールは「ヘッドライトの照射範囲を超えた速度で走らない（NEVER OUTRUN YOUR HEADLIGHTS）」ことです。なぜなら、視界の範囲はヘッドライトによって制限されるからです。
- id: 543
  category: defensive_driving
  question: 夜間、対向車のヘッドライトの眩しさを避けるにはどうすればよいですか？
  choices:
    A: 車両を追跡するために、対向車のヘッドライトを直視する。
    B: 対向車の運転手に向けて、繰り返しハイビームを点滅させる。
    C: 道路の右端を見て、白線や路肩をステアリングのガイドとして利用する。
    D: 車両が通り過ぎるまで片目を閉じる。
  answer: C
  explanation: 対向車のライトの眩しさを避けるには、道路の右端を見て、白線や路肩をステアリングのガイドとして利用する必要があります。
- id: 544
  category: vehicle_information
  question: 法律により、ヘッドライトは自車の少なくとも前方何フィート先にいる歩行者をはっきりと確認できる必要がありますか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: B
  explanation: 法律では、自車の少なくとも200フィート前方にある道路上の人をはっきりと確認できるヘッドライトを備えることが義務付けられています。
- id: 545
  category: safe_driving_rules
  question: 車両とすれ違う際、または追い越す際、何フィート以内の距離でヘッドライトを減光（ロービームに切り替え）しなければなりませんか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 夜間に車両とすれ違う際、または500フィート以内で追い越す際は、ライトを減光するという適切な要件に従わなければなりません。
- id: 546
  category: safe_driving_rules
  question: 夜間に高速道路上または道路沿いに駐車する場合は、常にどうすべきですか？
  choices:
    A: ヘッドライトをハイビームのままにする。
    B: ヘッドライトをロービームのままにする。
    C: 非常点滅表示灯（ハザードランプ）と駐車灯を点灯させたままにする。
    D: バッテリーを節約するためにすべてのライトを消す。
  answer: C
  explanation: 夜間に高速道路上または道路沿いに駐車する場合は、常に非常点滅表示灯と駐車灯を点灯させたままにしてください。ヘッドライトを点灯させたままにすると、接近してくる運転手の目を眩ませたり、混乱させたりする可能性があるため、絶対に避けてください。
- id: 547
  category: defensive_driving
  question: 雨天時、路面が特に危険で最も滑りやすくなるのはいつですか？
  choices:
    A: 数時間激しい雨が降り続いた後。
    B: 雨が降り始めた直後。
    C: 雨が止んだ直後。
    D: 深い水たまりの中を走行しているとき。
  answer: B
  explanation: 雨が降り始めた直後は、蓄積された泥やオイルが水と混ざり合い、路面に油分を含んだ膜を作るため、路面は特に危険な状態になります。
- id: 548
  category: safe_driving_rules
  question: 雨天時に運転する場合、どのライトを使用すべきですか？
  choices:
    A: 駐車灯のみ。
    B: ヘッドライトのハイビーム。
    C: ヘッドライトのロービーム。
    D: 非常点滅表示灯（ハザードランプ）のみ。
  answer: C
  explanation: 雨天時は、必要な場所（路面）を照らすために、ヘッドライトをロービームにして走行する必要があります。
- id: 549
  category: defensive_driving
  question: 霧や煙の中を運転する場合の最善のアドバイスは何ですか？
  choices:
    A: ハイビームを点灯し、素早く通り抜ける。
    B: 前方の車両に非常に接近して追従する。
    C: 運転しない（DON'T drive）。
    D: 駐車灯のみを使用する。
  answer: C
  explanation: マニュアルには、霧や煙の中を運転する場合の最善のアドバイスは「運転しない（DON'T）」ことであると記載されています。どうしても走行しなければならない場合は、特定の予防措置を講じる必要があります。
- id: 550
  category: safe_driving_rules
  question: 霧や煙の中をどうしても走行しなければならない場合、車両のライトをどのように使用すべきですか？
  choices:
    A: ライトをハイビームにして走行する。
    B: ライトをロービームにして走行する。
    C: 駐車灯のみを点灯して走行する。
    D: フォグランプのみを点灯して走行する。
  answer: B
  explanation: 霧や煙の中をどうしても走行しなければならない場合は、ライトをロービームにして走行する必要があります。ハイビームは視界を悪化させます。また、駐車灯やフォグランプのみで走行してはいけません。
- id: 551
  category: defensive_driving
  question: 霧の中での走行中に車が動かなくなったり故障したりした場合、どうすべきですか？
  choices:
    A: 車内にとどまり助けを待つ。
    B: 車のすぐ後ろに立ち、後続車に合図を送る。
    C: 人身事故を避けるため、車から離れる。
    D: 車を車線内に残したまま歩いて帰る。
  answer: C
  explanation: 霧の中で車が動かなくなったり故障したりした場合は、人身事故を避けるために車から離れてください。
- id: 552
  category: defensive_driving
  question: 夜間、対向車のドライバーに警告するためにハイビームを点滅させるのを避けるべきなのはなぜですか？
  choices:
    A: 車のバッテリーを消耗させるため。
    B: いかなる状況でも違法であるため。
    C: 注意をそらし、運転の妨げとなって衝突事故を引き起こす可能性があるため。
    D: ヘッドライトが早く切れる原因になるため。
  answer: C
  explanation: 他のドライバーに警告するためにハイビームを点滅させることは、注意をそらし、運転の妨げとなって衝突事故につながる可能性があるため、避けるべきです。
- id: 553
  category: safe_driving_rules
  question: 濃霧で道路の端が見えないために停車しなければならない場合、どうすべきですか？
  choices:
    A: 車線の中央で停車し、ハイビームを点灯させる。
    B: できるだけ右側に寄せ、車線から完全に外れて停車し、非常点滅表示灯（ハザードランプ）を点灯させる。
    C: 路面上で停車し、周囲に知らせるために繰り返しクラクションを鳴らす。
    D: 左側の路肩に寄せ、すべてのライトを消す。
  answer: B
  explanation: マニュアルには、霧で道路の端が見えない場合は、できるだけ右側に寄せ（車線から完全に外れること）、非常点滅表示灯（ハザードランプ）を点灯させるべきであると記載されています。
- id: 554
  category: defensive_driving
  question: 暑い日に雨が降り始めた直後の数分間、路面が非常に滑りやすくなるのはなぜですか？
  choices:
    A: 熱いアスファルトの上で雨がすぐに凍るため。
    B: 水が泥と混ざり、深いぬかるみを作るため。
    C: 熱によってアスファルト内の油分が表面に浮き出し、洗い流されるまで極めて滑りやすくなるため。
    D: 熱い路面によって雨が瞬時に蒸発し、タイヤのトラクションが低下するため。
  answer: C
  explanation: マニュアルによると、熱によってアスファルト内の油分が表面に浮き出し、その油が洗い流されるまで道路は極めて滑りやすくなります。
- id: 555
  category: safe_driving_rules
  question: テネシー州の法律で、日中に濃霧、豪雨、または降雪の中を走行する際に義務付けられていることは何ですか？
  choices:
    A: ハイビーム（上向き灯）を点灯させる。
    B: 非常点滅表示灯（ハザードランプ）を点灯させる。
    C: ロービーム（下向き灯）を点灯させる。
    D: 車内のルームランプを点灯させる。
  answer: C
  explanation: マニュアルには、「日中に濃霧、豪雨、または降雪の中を走行する際は、ロービーム（下向き灯）を点灯させてください...これはテネシー州法の要件でもあります」と明記されています。
- id: 556
  category: defensive_driving
  question: 車がハイドロプレーニング現象を起こし始めた場合、減速するための最善の方法は何ですか？
  choices:
    A: すぐにブレーキを強く踏む。
    B: ニュートラルに入れ、惰性で走行する。
    C: ブレーキを素早くポンピングする。
    D: アクセルを緩めて徐々に減速する。
  answer: D
  explanation: マニュアルでは、車両がハイドロプレーニング現象を起こし始めた場合、「アクセルを緩めて徐々に減速する」こと、および「ブレーキを強く踏まない」ことを推奨しています。
- id: 557
  category: safe_driving_rules
  question: ハイドロプレーニング現象に関する記述のうち、正しいものはどれですか？
  choices:
    A: 時速55マイル（約88km/h）以上の速度でのみ発生する。
    B: 制動距離が3倍になる可能性があり、ステアリング操作が効かなくなったり、制御不能になったりすることがある。
    C: 水の抵抗により、ステアリング操作の制御が向上する。
    D: 深い冠水路を走行している時にのみ発生する。
  answer: B
  explanation: マニュアルには、ハイドロプレーニング現象が発生すると「制動距離が3倍になる可能性があり、ステアリング操作が効かなくなったり、制御不能になったりすることがある」と記されています。また、タイヤはいかなる速度でもハイドロプレーニングを起こす可能性があるとも述べられています。
- id: 558
  category: defensive_driving
  question: 車がスリップし始めたらどうすべきですか？
  choices:
    A: 車を素早く止めるためにブレーキを強く踏む。
    B: 車を進めたい方向とは逆の方向にハンドルを切る。
    C: ブレーキを踏まず、車を進めたい方向にハンドルを切る。
    D: トラクションを回復させるために素早く加速する。
  answer: C
  explanation: 車がスリップし始めた場合、マニュアルでは「ブレーキを踏まない」こと、および「車を進めたい方向にハンドルを切る」ことを指示しています。
- id: 559
  category: defensive_driving
  question: 車輪が舗装路から外れてしまった場合、どのように対処すべきですか？
  choices:
    A: ハンドルを急に舗装路の方へ切り戻す。
    B: ブレーキを強く踏み、ペダルを押し続ける。
    C: 素早く道路に戻るために加速する。
    D: アクセルペダルから足を離し、軽く短くブレーキをかける。
  answer: D
  explanation: 舗装路から外れた際に制御を取り戻すには、「アクセルペダルから足を離すが、急ブレーキはかけない」こと、および「軽く短くブレーキをかける」必要があります。
- id: 560
  category: signs_and_signals
  question: テネシー州の道路にあるランブルストライプ（Rumble Stripes）の主な機能は何ですか？
  choices:
    A: 居眠り運転をしているドライバーを目覚めさせるため。
    B: 雨の夜におけるエッジライン（路側線）の視認性を向上させるため。
    C: 高速道路の終点が近いことを示すため。
    D: 住宅街でスピードを出している車両を減速させるため。
  answer: B
  explanation: ランブルストライプには振動や騒音という副次的な効果もありますが、マニュアルには「その主な機能は、雨の夜におけるエッジライン（路側線）の視認性を向上させることである」と記載されています。
- id: 561
  category: safe_driving_rules
  question: ほとんどの車を押し流すのに、通常どれくらいの深さの流水が必要ですか？
  choices:
    A: 6〜12インチ
    B: 18〜24インチ
    C: 36〜48インチ
    D: 少なくとも60インチ
  answer: B
  explanation: マニュアルでは、「ほとんどの車は18〜24インチ（約45〜60cm）の流水で押し流される可能性がある」と警告しています。
- id: 562
  category: penalties_and_points
  question: 運転者が、はっきりと見える洪水警告のバリケードを故意に無視して浸水エリアに進入した場合、どうなる可能性がありますか？
  choices:
    A: 法執行機関から口頭注意を受けるだけである。
    B: 無謀運転（reckless driving）で起訴され、救助費用の返還責任を問われる可能性がある。
    C: 車両が州によって永久に没収される。
    D: 自動的に5年間の免許取り消しとなる。
  answer: B
  explanation: マニュアルによると、洪水警告の標識やバリケードを無視すると、「無謀運転で起訴される」可能性があり、さらに「救助にかかった費用の返還責任を負う」ことになります。
- id: 563
  category: defensive_driving
  question: 運転中に竜巻を発見した場合、推奨される行動は何ですか？
  choices:
    A: 最高速度で走行して竜巻から逃げようとする。
    B: 車内に留まり、高架下に駐車する。
    C: 車から降り、溝や低地を見つけて避難し、うつ伏せになる。
    D: 竜巻を早く通り過ぎるために、竜巻に向かって運転する。
  answer: C
  explanation: 竜巻を発見した場合、マニュアルでは次のようにアドバイスしています。「追い越そうとしないでください。車から降り、溝や低地を見つけて避難し、飛来物から身を守るためにうつ伏せになってください。」
- id: 564
  category: sharing_the_road
  question: 大型トラックやバスが左側から追い越していく際、それらが発生させる突風に対処するために何をすべきですか？
  choices:
    A: 車線の右端にできるだけ寄り、速度を落とす。
    B: 風を遮るために車線の左側に寄る。
    C: トラックの前に出るために素早く加速する。
    D: トラックの運転手に警告するためにクラクションを鳴らす。
  answer: A
  explanation: マニュアルには、トラックやバスが左側から追い越していくときは、「車線の右端にできるだけ寄り、速度を落とすべきである」と記載されています。
- id: 565
  category: defensive_driving
  question: 強い追い風（車両の後方から吹く風）は運転にどのような影響を与えますか？
  choices:
    A: ステアリング操作が著しく困難になる。
    B: 速度が低下するため、より加速する必要がある。
    C: 速度が上がるため、減速し、停止するために早めにブレーキをかけ始める必要がある。
    D: 乾燥した路面でも車両がハイドロプレーニング現象を起こす原因となる。
  answer: C
  explanation: マニュアルでは、「強い追い風（車両の後方から吹く風）は速度を増加させるため、減速し、停止するために通常より早めにブレーキをかけ始める必要があります」と説明されています。
- id: 566
  category: defensive_driving
  question: 運転中に太陽が真後ろにある場合、どのような危険に注意すべきですか？
  choices:
    A: フロントガラスのワイパーが機能しなくなる可能性がある。
    B: 対向車の運転手が眩しさを感じ、こちらの方向指示器が見えない可能性がある。
    C: 車両のエンジンが通常より早くオーバーヒートする可能性がある。
    D: ダッシュボードの計器類が見えなくなる。
  answer: B
  explanation: マニュアルは次のように警告しています。「太陽が後ろにある場合、対向車の運転手が眩しさを感じている可能性があります。彼らがあなたの方向指示器や車自体を見ることができない可能性があることに注意してください。」
- id: 567
  category: vehicle_information
  question: 泥や雪で動けなくなった（スタックした）車両を脱出させるための正しい技術は何ですか？
  choices:
    A: ハイギアに入れ、車輪をできるだけ速く回転させる。
    B: ローギアに入れ、前輪をまっすぐに保ち、アクセルペダルを軽く踏む。
    C: 激しく加速しながら、ハンドルを左右に急に切る。
    D: ドライブとリバースを切り替えながら、ブレーキを強く踏む。
  answer: B
  explanation: 泥や雪から脱出するために、マニュアルでは「ローギアに入れ、前輪をまっすぐに保つこと」、「アクセルペダルを軽く踏むこと」、「車輪を空転させないこと」を推奨しています。
- id: 568
  category: safe_driving_rules
  question: 車両が深い泥や雪で動けなくなった場合、どうすべきですか？
  choices:
    A: ハイギアに入れ、車輪をできるだけ速く回転させる。
    B: ローギアに入れ、前輪をまっすぐに保つ。
    C: トラクションを得るためにアクセルペダルを素早く何度も踏む。
    D: ハンドルを左右に急に切る。
  answer: B
  explanation: 車両を脱出させようとするとき、マニュアルではローギアに入れ、前輪をまっすぐに保ち、車輪の空転を避けながらアクセルペダルを軽く踏むようアドバイスしています。
- id: 569
  category: vehicle_information
  question: タイヤチェーンはいつ装着すべきですか？
  choices:
    A: 雪の中で動けなくなった後。
    B: 道路の中央を走行している間。
    C: 雪道や泥道を走行する前。
    D: 固い氷の上を走行するときのみ。
  answer: C
  explanation: マニュアルには、チェーンを装着する前に道路の右端にできるだけ寄せて停車し、雪道や泥道を走行する前にタイヤに装着すべきであると記載されています。
- id: 570
  category: defensive_driving
  question: 雪道や凍結路でほとんどの運転者が犯す「3つの大きな過ち」のうち、当てはまるものはどれですか？
  choices:
    A: 過剰なステアリング操作（ハンドル操作）と車輪のスリップ。
    B: ロービーム（下向き灯）の使用。
    C: 一定の速度での走行。
    D: ヒーター・デフロスターの使用。
  answer: A
  explanation: 雪道や凍結路における3つの大きな過ちは、「過剰なパワーによる車輪の空転」、「過剰なブレーキによる車輪の滑り」、そして「過剰なステアリング操作による車輪のスリップ」です。
- id: 571
  category: safe_driving_rules
  question: 冬の天候下で運転する前に、どの窓から雪、氷、または霜を取り除く必要がありますか？
  choices:
    A: フロントガラスのみ。
    B: フロントガラスと前部サイドウィンドウ。
    C: リアウィンドウのみ。
    D: すべての窓。
  answer: D
  explanation: マニュアルには、運転前にすべての窓から雪、氷、または霜を取り除くよう明記されています。
- id: 572
  category: safe_driving_rules
  question: 時速 20 マイル (20 M.P.H.) で走行中、氷や雪によるトラクションの低下により、停止距離はどのくらいまで伸びる可能性がありますか？
  choices:
    A: 50 フィート以上。
    B: 100 フィート以上。
    C: 150 フィート以上。
    D: 200 フィート以上。
  answer: D
  explanation: 時速 20 マイル (20 M.P.H.) で走行中、トラクションが低いと停止距離が 200 フィート以上に伸びる可能性があります。
- id: 573
  category: vehicle_information
  question: 雪道や凍結路面で方向制御を維持するために、どのようにブレーキをかけるべきですか？
  choices:
    A: ブレーキペダルを素早くポンピングする。
    B: 車両が停止するまで強く踏み続ける。
    C: ロックする直前のポイントまで一定の圧力をかける。
    D: ブレーキを急激に踏み込み、そのまま保持する。
  answer: C
  explanation: マニュアルでは、ブレーキをロックする直前までしっかりと踏み込み、ブレーキペダルをポンピング（断続的に踏むこと）せず、制動力と方向制御を最適に組み合わせるために一定の圧力をかけるようアドバイスしています。
- id: 574
  category: vehicle_information
  question: 緊急停止時にアンチロックブレーキ (ABS) を正しく作動させるには、どうすればよいですか？
  choices:
    A: ブレーキペダルをポンピングする。
    B: ペダルに一定の強い圧力をかけ続ける。
    C: ブレーキを軽く叩くように踏む。
    D: 代わりにパーキングブレーキを使用する。
  answer: B
  explanation: アンチロックブレーキを正しく、あるいは確実に作動させるには、ペダルに一定の強い圧力をかけ続ける必要があります。緊急停止時には、必要に応じてブレーキペダルを床まで踏み込んでください。
- id: 575
  category: defensive_driving
  question: 氷点下の天候で橋の上を走行する際、特に注意が必要なのはなぜですか？
  choices:
    A: 橋は通常、急な勾配で建設されているため。
    B: 橋の上は隣接する道路よりも早く氷が形成されるため。
    C: 橋は交通量が少なく、雪が踏み固められないため。
    D: 橋は太陽からの熱をより多く吸収するため。
  answer: B
  explanation: 通常、標識には橋の上が隣接する道路よりも早く氷が形成され、予期せず滑りやすくなることが示されています。
- id: 576
  category: driver_testing
  question: 法律により、テネシー州の運転知識試験の問題の何パーセントがアルコールと薬物に関するものでなければなりませんか？
  choices:
    A: 少なくとも 10 パーセント。
    B: 少なくとも 15 パーセント。
    C: 少なくとも 20 パーセント。
    D: 少なくとも 25 パーセント。
  answer: D
  explanation: 法律により、知識試験の問題の少なくとも 25 パーセントは、アルコール、その他の薬物、および運転に関するトピックを扱う問題で構成されていなければなりません。
- id: 577
  category: alcohol_drugs_health
  question: 肝臓がアルコール飲料 1 杯分を酸化させるのに、およそどのくらいの時間がかかりますか？
  choices:
    A: 15 分。
    B: 30 分。
    C: 1 時間。
    D: 2 時間。
  answer: C
  explanation: アルコールは肝臓に達すると、すぐに酸化が始まります。しかし、肝臓は 1 時間に約 1 杯分しか酸化させることができません。
- id: 578
  category: alcohol_drugs_health
  question: 飲酒後、酔いを覚ますための唯一の効果的な方法は何ですか？
  choices:
    A: ブラックコーヒーを飲む。
    B: 冷たいシャワーを浴びる。
    C: 激しい運動をする。
    D: 時間が経過するのを待つ。
  answer: D
  explanation: 酸化の速度は、コーヒーを飲んだり、運動したり、冷たいシャワーを浴びたりしても速めることはできません。飲酒した人の酔いを覚ますことができるのは、時間だけです。
- id: 579
  category: alcohol_drugs_health
  question: テネシー州において、常に違法となる血中アルコール濃度 (BAC) はいくつですか？
  choices:
    A: '.04'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: テネシー州を含むほとんどの州では、.08 が常に違法となる酒気帯びの基準値です。
- id: 580
  category: alcohol_drugs_health
  question: 体重が同じ 2 人がいる場合、体脂肪はアルコール中毒（酔い）にどのように影響しますか？
  choices:
    A: 体脂肪が多い人の方が、先に酔いの兆候が現れる。
    B: 体脂肪が少ない人の方が、先に酔いの兆候が現れる。
    C: 体脂肪は、人が酔う速さには影響しない。
    D: 2 人とも全く同じ速さで酔う。
  answer: A
  explanation: アルコールは脂肪ではなく水に吸収されます。体脂肪が少ない人は、アルコールを希釈するための水分が体内に多くあります。したがって、体重が同じであれば、飲んだ量に対して体脂肪が多い人の方が先に酔いの兆候が現れます。
- id: 581
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が0.10パーセントの場合、しらふの時と比べて事故を起こす可能性はどのくらい高くなりますか？
  choices:
    A: 2倍高くなる。
    B: 7倍高くなる。
    C: 25倍高くなる。
    D: 50倍高くなる。
  answer: B
  explanation: BACが0.10パーセントの場合、しらふの時よりも事故を起こす可能性が7倍高くなります。
- id: 582
  category: alcohol_drugs_health
  question: 少量のアルコールによって影響を受ける、運転業務において最も重要な2つの能力は何ですか？
  choices:
    A: 聴覚と反応時間
    B: 判断力と視力
    C: ステアリング操作とブレーキ操作
    D: 注意力と集中力
  answer: B
  explanation: マニュアルには次のように記載されています。「運転業務において最も重要な2つの能力は判断力と視力であり、その両方が少量のアルコールによって影響を受けます。」
- id: 583
  category: alcohol_drugs_health
  question: アルコールはドライバーの夜間の視力にどのような影響を与えますか？
  choices:
    A: 眩しさからの回復時間を改善する。
    B: 夜間に鮮明に見る能力を半分以下に低下させる。
    C: 側方の視界を30パーセント増加させる。
    D: 目の筋肉を緊張させ、焦点を合わせやすくする。
  answer: B
  explanation: アルコールは視界の鮮明さを低下させます。マニュアルには、夜間に鮮明に見る能力を半分以下に低下させると明記されています。
- id: 584
  category: alcohol_drugs_health
  question: 法律上、ドライバーが「法的酩酊状態」とみなされる血中アルコール濃度（BAC）はいくつですか？
  choices:
    A: 0.04パーセント
    B: 0.05パーセント
    C: 0.08パーセント
    D: 0.10パーセント
  answer: C
  explanation: マニュアルによると、BACが0.08パーセント以上は「法的酩酊（LEGAL INTOXICATION）」とみなされ、アルコール濃度が0.08パーセント以上の状態で運転することは違法です。
- id: 585
  category: alcohol_drugs_health
  question: アルコールを精神安定剤や鎮静剤などの他の抑制剤と混ぜるとどうなりますか？
  choices:
    A: 効果が互いに打ち消し合う。
    B: 効果が単純に加算される。
    C: 効果が乗算される（倍増する）。
    D: アルコールが刺激剤として働き、抑制剤の効果を打ち消す。
  answer: C
  explanation: アルコールを精神安定剤や鎮静剤などの他の抑制剤と組み合わせると、結果は単に加算されるだけでなく、乗算（倍増）され、効果がより強く、より危険になります。
- id: 586
  category: penalties_and_points
  question: テネシー州の黙示的同意法（Implied Consent Law）によると、法執行官から求められた際にアルコールや薬物の化学検査を拒否した場合、どのような罰則が科される可能性がありますか？
  choices:
    A: 500ドルの罰金
    B: 12ヶ月間の運転免許停止
    C: 直ちに30日間の禁錮刑
    D: イグニッション・インターロック装置（飲酒運転防止装置）の設置義務
  answer: B
  explanation: 逮捕され、法執行官からの検査要請を拒否した場合、裁判所によって12ヶ月間の運転免許停止処分が下される可能性が高いです。
- id: 587
  category: alcohol_drugs_health
  question: 服用していた薬が医師によって処方されたものであることは、飲酒・薬物運転（DUI）容疑に対する有効な弁護（正当な理由）になりますか？
  choices:
    A: はい、車内に処方薬のボトルがある限り有効です。
    B: はい、処方薬は運転能力を損なうことはありません。
    C: いいえ、法律により、薬が処方されたものであるというだけでは、その影響下で運転したことの弁護にはなりません。
    D: いいえ、医師が運転に関する具体的な書面による許可を与えていない限り無効です。
  answer: C
  explanation: マニュアルには次のように明確に記載されています。「法律により、薬が処方されたものであるというだけでは、その影響下で運転したことの弁護（NO
    defense）にはなりません。」
- id: 588
  category: penalties_and_points
  question: 2012年に可決された「拒否不可（No Refusal）」法により、法執行官は何ができるようになりましたか？
  choices:
    A: 初犯で運転免許を永久に停止する。
    B: 飲酒・薬物運転の疑いがあるケースにおいて、血液サンプルの捜索令状を請求する。
    C: 飲酒・薬物運転者の車両の同乗者を逮捕する。
    D: 呼気検査を拒否した者の車両を没収する。
  answer: B
  explanation: 「拒否不可（No Refusal）」法により、法執行官は飲酒・薬物運転の疑いがあるケースにおいて、血液サンプルの捜索令状を請求することが可能になりました。
- id: 589
  category: alcohol_drugs_health
  question: アルコールの摂取は、ドライバーの注意力と集中力にどのような影響を与えますか？
  choices:
    A: 注意力を高める刺激剤として働く。
    B: 神経伝達や身体機能をスピードアップさせる。
    C: 抑制剤として働き、ドライバーの注意力と集中力を制限する。
    D: BACが0.10パーセントに達するまで、集中力への影響はない。
  answer: C
  explanation: アルコールはいかなる濃度であっても、刺激剤ではなく抑制剤です。すべての神経伝達と身体機能を低下させ、ドライバーの注意力と集中力を制限します。
- id: 590
  category: alcohol_drugs_health
  question: 反応能力や協調運動能力が損なわれるのは、どの程度のBACレベルからですか？
  choices:
    A: 0.02パーセントという低いレベルから
    B: 0.05パーセントを超えた場合のみ
    C: 正確に0.08パーセントから
    D: 0.10パーセント以上から
  answer: A
  explanation: マニュアルには、0.02パーセントという低いBACレベルのアルコール摂取でも、反応能力や協調運動能力が損なわれると記されています。
- id: 591
  category: alcohol_drugs_health
  question: 血中アルコール濃度（BAC）が.00パーセントであっても、飲酒・薬物影響下運転（DUI）で有罪判決を受けることはありますか？
  choices:
    A: いいえ、BACが.00パーセントであれば、ドライバーはいかなるDUIの容疑も晴れます。
    B: はい、薬物によって運転能力が十分に損なわれている場合は有罪となります。
    C: はい、ただし21歳未満の場合に限ります。
    D: いいえ、有罪判決には少なくとも.02パーセントのBACが必要です。
  answer: B
  explanation: 血中アルコール濃度（BAC）が.00パーセントであっても、薬物によって運転能力が十分に損なわれている場合は、DUIで有罪判決を受ける可能性があります。BACが.08パーセント未満であっても、それだけでドライバーの容疑が晴れるわけではありません。
- id: 592
  category: alcohol_drugs_health
  question: アルコールと目の筋肉の関係は何ですか？
  choices:
    A: アルコールは目の筋肉を緊張させ、焦点を合わせやすくします。
    B: アルコールは目の筋肉を弛緩させ、眩しさに対する視力の低下や、適切に焦点を合わせられない状態を引き起こします。
    C: アルコールは目の筋肉を刺激し、眩しさから回復する速度を速めます。
    D: アルコールは目の筋肉には影響を与えず、脳にのみ影響を与えます。
  answer: B
  explanation: 目の筋肉が弛緩するため、眩しさに対する視力が低下します。目の筋肉はアルコールによって弛緩し、適切に焦点を合わせることができなくなります。
- id: 593
  category: alcohol_drugs_health
  question: マニュアルによると、運転に使用される情報の何パーセントが目から提供されますか？
  choices:
    A: 約50パーセント
    B: 約70パーセント
    C: ほぼ90パーセント
    D: 100パーセント
  answer: C
  explanation: 運転に使用される情報のほぼ90パーセントを目が提供しているため、視覚に制限があると悲惨な結果を招く可能性があります。
- id: 594
  category: penalties_and_points
  question: 処方薬の影響で運転していた場合のDUI逮捕の罰則は、アルコールの場合と異なりますか？
  choices:
    A: はい、処方薬によるDUIの方が罰則は軽くなります。
    B: はい、処方薬によるDUIは初犯の場合、警告のみとなります。
    C: いいえ、アルコールを飲んでいたか薬物を服用していたかにかかわらず、罰則は同じです。
    D: いいえ、ただし処方薬によるDUIは運転記録には記載されません。
  answer: C
  explanation: アルコールを飲んでいたか、薬物（処方薬や市販薬を含む）を服用していたかにかかわらず、DUI逮捕の罰則は同じです。
- id: 595
  category: alcohol_drugs_health
  question: アルコールを摂取した後、最初に影響を受けるのは何ですか？
  choices:
    A: 運動能力（コーディネーション）
    B: 視覚
    C: 判断力
    D: 感情
  answer: C
  explanation: マニュアルによると、アルコールを飲んだ後に最初に影響を受けるのは判断力です。
- id: 596
  category: penalties_and_points
  question: 飲酒運転児童保護法（Drunk Driving Child Protection Act）に基づき、18歳未満の子供を同乗させてDUI法に違反した場合の最低義務禁錮期間はどれくらいですか？
  choices:
    A: 48時間
    B: 7日間
    C: 30日間
    D: 45日間
  answer: C
  explanation: 飲酒運転児童保護法は、18歳未満の子供を同乗させてDUI法に違反した場合、30日間の最低義務禁錮刑と最低1,000ドルの罰金を科しています。
- id: 597
  category: penalties_and_points
  question: 18歳、19歳、または20歳で、初めてアルコール飲料の購入または所持で有罪判決を受けた場合、運転免許の停止期間はどのくらいですか？
  choices:
    A: 6ヶ月
    B: 1年間
    C: 2年間
    D: 21歳になるまで
  answer: B
  explanation: 18歳、19歳、または20歳で、アルコール飲料の購入、購入の試み、または所持で有罪判決を受けた場合、初犯で1年間の運転免許停止となります。
- id: 598
  category: alcohol_drugs_health
  question: 3杯のアルコール飲料による酔いの影響が消えるまでに、およそどのくらいの時間がかかりますか？
  choices:
    A: 1時間
    B: 2時間
    C: 3時間
    D: 4時間
  answer: C
  explanation: 1杯のアルコールによる影響が消えるまでに約1時間かかるため、3杯のアルコールによる酔いの影響が消えるまでには約3時間かかります。
- id: 599
  category: penalties_and_points
  question: 血中アルコール濃度（BAC）が0.20%以上の場合、初犯のDUI有罪判決に対する最低禁錮期間はどれくらいですか？
  choices:
    A: 48時間
    B: 7日間
    C: 30日間
    D: 45日間
  answer: B
  explanation: 初犯の場合、禁錮期間は48時間ですが、BACが0.20%以上の場合は7日間に延長されます。
- id: 600
  category: penalties_and_points
  question: 影響下で自動車を運転中に、他人の死亡を伴う衝突事故を起こした場合、どのような罪に問われる可能性がありますか？
  choices:
    A: 加重暴行罪（Aggravated Assault）
    B: 車両殺致罪（Vehicular Homicide）
    C: 特別加重児童虐待罪（Especially Aggravated Child Endangerment）
    D: 無謀な危険行為罪（Reckless Endangerment）
  answer: B
  explanation: 薬物またはアルコールの影響下で自動車を運転中に、他人の死亡を伴う衝突事故を起こした場合、車両殺致罪（Vehicular Homicide）に問われる可能性があります。
- id: 601
  category: penalties_and_points
  question: 13歳から17歳の未成年者が、アルコールまたは薬物の所持で初めて有罪判決を受けた場合、運転資格の停止期間はどのくらいですか？
  choices:
    A: 6ヶ月間、または16歳になるまでのいずれか長い方
    B: 1年間、または17歳になるまでのいずれか長い方
    C: 2年間、または18歳になるまでのいずれか長い方
    D: 21歳になるまで
  answer: B
  explanation: 13歳から17歳の間で、アルコールまたは薬物の所持、消費、販売が判明した場合、運転資格は1年間、または17歳になるまでのいずれか長い方の期間停止されます。
- id: 602
  category: alcohol_drugs_health
  question: 12オンスのビール1瓶に含まれるアルコール量は、およそどれくらいに相当しますか？
  choices:
    A: 1オンスのウイスキーのショット1杯
    B: 1オンスのウイスキーのショット2杯
    C: 6オンスのワイングラス1杯
    D: 0.5オンスの純アルコール
  answer: A
  explanation: マニュアルには、ビール1瓶（12オンス）に含まれるアルコール量は、ウイスキーのショット1杯（1オンス）に含まれる量とほぼ等しいと記載されています。
- id: 603
  category: penalties_and_points
  question: 2回目のDUI（酒気帯び・酒酔い運転）有罪判決に対する罰金の範囲はいくらですか？
  choices:
    A: $350 - $1,500
    B: $600 - $3,500
    C: $1,100 - $10,000
    D: $3,000 - $15,000
  answer: B
  explanation: DUI罰則表によると、2回目の有罪判決に対する罰金は600ドルから3,500ドルの範囲です。
- id: 604
  category: penalties_and_points
  question: 「21歳未満のBAC法」に基づき、16歳以上21歳未満の者が、少なくともどの程度の血中アルコール濃度（BAC）で運転していることが判明した場合、未成年者の飲酒運転で有罪となりますか？
  choices:
    A: .01パーセント
    B: .02パーセント
    C: .04パーセント
    D: .08パーセント
  answer: B
  explanation: 16歳以上21歳未満の者が、.02パーセントのBACで運転していることが判明した場合、未成年者の飲酒運転で有罪となります。
- id: 605
  category: penalties_and_points
  question: DUI有罪判決の保護観察条件として、違反者はどのようなメッセージが表示された服を着用して、8時間シフト3回のゴミ拾い作業を完了しなければなりませんか？
  choices:
    A: 「DUI違反者（DUI OFFENDER）」
    B: 「私は飲酒運転者です（I AM A DRUNK DRIVER）」
    C: 「社会奉仕作業員（COMMUNITY SERVICE WORKER）」
    D: 「飲酒運転はやめよう（DON'T DRINK AND DRIVE）」
  answer: B
  explanation: ゴミ拾い作業中、違反者は「I am a DRUNK DRIVER（私は飲酒運転者です）」というメッセージが表示されたベストやその他の衣類を着用しなければなりません。
- id: 606
  category: alcohol_drugs_health
  question: 処方薬に関連するDUI逮捕の罰則は、アルコールに関連するものと比較してどうですか？
  choices:
    A: 処方薬の罰則の方が軽い
    B: 処方薬の罰則の方が重い
    C: どちらも同じである
    D: 処方薬ではDUI逮捕にはならない
  answer: C
  explanation: DUI逮捕の罰則は、ドライバーがアルコールを飲んでいたか、薬物（処方薬や市販薬を含む）を服用していたかにかかわらず同じです。
- id: 607
  category: penalties_and_points
  question: 4回目以降のDUI有罪判決は、どのように分類されますか？
  choices:
    A: クラスA軽罪
    B: クラスC重罪
    C: クラスD重罪
    D: クラスE重罪
  answer: D
  explanation: DUI罰則表によると、4回目以降の有罪判決はクラスE重罪に分類されます。
- id: 608
  category: penalties_and_points
  question: 5年以内に2回のDUI有罪判決を受けた者が、運転資格の再交付後にイグニッション・インターロック装置（呼気検査によるエンジン始動制限装置）を装備した車両を運転しなければならない期間はどれくらいですか？
  choices:
    A: 6ヶ月間
    B: 1年間
    C: 3年間
    D: 5年間
  answer: A
  explanation: 5年間に2回のDUIを受けた者は、運転資格の再交付後、6ヶ月間はイグニッション・インターロック装置を装備した車両を運転しなければなりません。
- id: 609
  category: alcohol_drugs_health
  question: 若いドライバーがBAC .01～.08パーセントで事故を起こす確率が、年配のドライバーに比べてはるかに高いのはなぜですか？
  choices:
    A: 若いドライバーはスピードを出しすぎる傾向があるため
    B: アルコールに対する耐性が低く、運転経験も限られているため
    C: 若いドライバーは夜間に運転することが多いため
    D: 処方薬を使用している可能性が高いため
  answer: B
  explanation: 若いドライバーがBAC .01～.08パーセントで事故を起こす確率は、年配のドライバーよりもはるかに高くなります。これは、アルコールに対する耐性が低いことと、運転経験が限られていることが原因です。
- id: 610
  category: alcohol_drugs_health
  question: マニュアルによると、薬物やアルコールの使用および乱用に関する相談先を紹介してもらうために、どのフリーダイヤルに電話をかけることができますか？
  choices:
    A: 1-800-555-DRUG
    B: 1-800-889-9789
    C: 1-800-822-4357
    D: 1-800-DRIVING
  answer: B
  explanation: マニュアルには、薬物やアルコールの使用に関する詳細情報や相談先の紹介については、フリーダイヤルの「Redline（1-800-889-9789）」に電話するように記載されています。
- id: 611
  category: alcohol_drugs_health
  question: テネシー州における「黙示の同意法（Implied Consent Law）」とは何を意味しますか？
  choices:
    A: いかなる時でも車両の捜索に同意すること。
    B: 適切な車両保険を携帯することに同意すること。
    C: 要請された場合、血液中のアルコールまたは薬物含有量を測定するための検査を受けること。
    D: 30日以内にすべての交通罰金を支払うことに同意すること。
  answer: C
  explanation: 黙示の同意法とは、要請された場合に、血液中のアルコールまたは薬物含有量を測定するための検査を受けることに同意することを意味します。
- id: 612
  category: license_system
  question: 問題ドライバー指針システム（PDPS）の目的は何ですか？
  choices:
    A: テネシー州における未払いの駐車違反切符を追跡するため。
    B: 運転免許証を発行する前に、全米運転者名簿（National Driver Register）を検索するため。
    C: 交通違反に対してドライバーに点数を割り当てるため。
    D: 10代のドライバーの通学状況を監視するため。
  answer: B
  explanation: 問題ドライバー指針システム（PDPS）は、テネシー州安全・国土安全保障省が運転免許証を発行する前に、全米運転者名簿（National
    Driver Register）を検索するために使用されます。
- id: 613
  category: penalties_and_points
  question: テネシー州の運転免許が取り消し（Revoked）または停止（Suspended）される理由として、正しいものはどれですか？
  choices:
    A: 3年間に1回のスピード違反切符を受け取ること。
    B: 燃料代を支払わずにガソリンスタンドから車で立ち去ること。
    C: 定期的に車両を洗浄しないこと。
    D: 積載区域（ローディングゾーン）に5分間駐車すること。
  answer: B
  explanation: 給油したガソリンまたはディーゼル燃料の代金を支払わずにガソリンスタンドから車で立ち去ることは、運転免許が取り消しまたは停止される状況として挙げられています。
- id: 614
  category: penalties_and_points
  question: 18歳未満の者は、中途退学を理由に運転免許を失う可能性があります。この文脈における「中途退学（dropping out）」はどのように定義されていますか？
  choices:
    A: 1学期に5回連続の無断欠席があること。
    B: 1学期に10日連続、または合計15日の無断欠席があること。
    C: 成績評価期間中に1科目を落第すること。
    D: 1年間に理由を問わず20日間学校を欠席すること。
  answer: B
  explanation: 中途退学とは、1学期に10日連続、または合計15日の無断欠席があることと定義されています。
- id: 615
  category: penalties_and_points
  question: 運転免許を維持するために、18歳未満の者は学校で満足のいく成績（satisfactory progress）を収める必要があります。これは一般的に何を意味しますか？
  choices:
    A: GPA 3.0を維持すること。
    B: 成績評価期間ごとに全科目に合格すること。
    C: 成績評価期間ごとに3科目に合格すること。
    D: 皆勤であること。
  answer: C
  explanation: 学校で満足のいく成績を収められないとは、一般的に1学期につき3科目に合格できないことを意味し、これに該当すると運転免許を失う可能性があります。
- id: 616
  category: penalties_and_points
  question: 運転免許が停止または取り消された場合、何日以内に安全省（Department of Safety）に返納しなければなりませんか？
  choices:
    A: 10日以内
    B: 15日以内
    C: 20日以内
    D: 30日以内
  answer: C
  explanation: 運転免許が停止または取り消された場合は、停止または取り消しから20日以内に安全省に返納しなければなりません。
- id: 617
  category: penalties_and_points
  question: 規定の期間内に停止または取り消された運転免許証を返納しなかった場合の罰則は何ですか？
  choices:
    A: 50ドルの罰金
    B: 他の罰金や費用に加えて75ドルの罰金
    C: さらに6ヶ月の免許停止
    D: 強制的な出廷
  answer: B
  explanation: 免許証を返納しなかった場合、他の罰金や費用に加えて75ドルの罰金が科せられます。
- id: 618
  category: driver_responsibility
  question: 住所を変更した場合、何日以内に安全省（Department of Safety）に届け出なければなりませんか？
  choices:
    A: 5日以内
    B: 10日以内
    C: 15日以内
    D: 30日以内
  answer: B
  explanation: 住所を変更した場合は、変更から10日以内に安全省に届け出なければなりません。
- id: 619
  category: penalties_and_points
  question: 非居住者違反者協定（Non-Resident Violator Compact）に基づき、他の加盟州で発行された交通違反切符を無視するとどうなりますか？
  choices:
    A: テネシー州での運転免許が停止、取り消し、または無効になります。
    B: 次にテネシー州で運転したときに逮捕されます。
    C: 違反切符は1年後に自動的に却下されます。
    D: テネシー州からのみ罰金が科せられます。
  answer: A
  explanation: 他の加盟州からの違反切符を無視した場合、裁判所が安全省に対して違反が適切に処理されたことを通知するまで、運転免許は停止、取り消し、または無効になります。
- id: 620
  category: penalties_and_points
  question: 成人ドライバー（18歳以上）が12ヶ月以内に何ポイント累積すると、免許停止予定の通知を受け取りますか？
  choices:
    A: 6ポイント以上
    B: 8ポイント以上
    C: 10ポイント以上
    D: 12ポイント以上
  answer: D
  explanation: 12ヶ月以内に12ポイント以上を累積した成人ドライバー（18歳以上）は、免許停止予定の通知を受け取ります。
- id: 621
  category: penalties_and_points
  question: 成人ドライバーが、任意の12ヶ月以内に何ポイント累積すると、運転免許の資格を失う可能性があることを知らせる勧告状を受け取りますか？
  choices:
    A: 2〜4ポイント
    B: 4〜6ポイント
    C: 6〜11ポイント
    D: 10〜15ポイント
  answer: C
  explanation: 任意の12ヶ月以内に運転記録の累積ポイントが6〜11ポイントになった免許保持者には、勧告状が郵送されます。
- id: 622
  category: penalties_and_points
  question: 12ヶ月の期間内に何回の無謀運転（reckless driving）違反を犯すと、テネシー州の運転免許が取り消しまたは停止になりますか？
  choices:
    A: 1回
    B: 2回
    C: 3回
    D: 4回
  answer: B
  explanation: テネシー州では、12ヶ月以内に2回の無謀運転違反を犯した場合、運転免許が取り消しまたは停止されることがあります。
- id: 623
  category: penalties_and_points
  question: ドライバーが車内に何グラム以上のメタンフェタミンを所持していると、免許の取り消しまたは停止につながる可能性がありますか？
  choices:
    A: 1グラム以上
    B: 3グラム以上
    C: 5グラム以上
    D: 10グラム以上
  answer: C
  explanation: ドライバーが車内で5グラム以上のメタンフェタミンを所持していた場合、運転免許が取り消しまたは停止されることがあります。
- id: 624
  category: penalties_and_points
  question: 免許が停止、取り消し、または無効にされる前に、当局は処分の前に聴聞会の機会を与えますが、以下のどのケースは例外ですか？
  choices:
    A: 12ヶ月間に12ポイントを累積した場合
    B: 確定判決および有罪判決の場合
    C: 養育費の支払いを怠った場合
    D: 高校を中退した場合
  answer: B
  explanation: 免許が停止、取り消し、または無効になる場合、当局は処分の前に聴聞会の機会を与えますが、確定判決および有罪判決の場合は例外となります。
- id: 625
  category: penalties_and_points
  question: 成人ドライバーが停止予定通知を受け取るには、12ヶ月の期間内に何ポイント累積する必要がありますか？
  choices:
    A: 6ポイント以上
    B: 8ポイント以上
    C: 10ポイント以上
    D: 12ポイント以上
  answer: D
  explanation: 18歳以上の成人ドライバーが12ヶ月以内に12ポイント以上を累積すると、停止予定通知が送られます。
- id: 626
  category: driver_responsibility
  question: 免許停止を回避または短縮するために、安全運転講習（Defensive Driving Course）のオプションを利用できる頻度はどれくらいですか？
  choices:
    A: 1年に1回
    B: 3年に1回
    C: 5年間に1回
    D: 生涯に1回
  answer: C
  explanation: 免許停止の回避または停止期間の短縮のための安全運転講習（Defensive Driving Course）のオプションは、5年間に1回のみ利用可能です。
- id: 627
  category: penalties_and_points
  question: 免許停止中に運転した場合の結果は何ですか？
  choices:
    A: 警告状が郵送される
    B: 停止期間が延長され、刑事訴追を受ける可能性がある
    C: 筆記試験を再受験しなければならない
    D: 車両が永久に没収される
  answer: B
  explanation: 免許停止中に運転すると、停止期間が延長されるだけでなく、刑事訴追を受ける可能性もあります。
- id: 628
  category: penalties_and_points
  question: 乗客の乗り降りのために停車しているスクールバス、教会バス、または青少年用バスを追い越した場合、運転記録に何ポイント加算されますか？
  choices:
    A: 4ポイント
    B: 5ポイント
    C: 6ポイント
    D: 8ポイント
  answer: D
  explanation: ポイント表によると、乗客の乗り降りのために停車しているスクールバス、教会バス、または青少年用バスを追い越すと、8ポイントが科せられます。
- id: 629
  category: alcohol_drugs_health
  question: てんかんや糖尿病などの疾患により意識や制御を失ったドライバーは、免許の再交付を受ける前に、最低どれくらいの期間、症状がない状態を維持しなければなりませんか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 1年
    D: 2年
  answer: B
  explanation: てんかん、心原性失神、糖尿病、またはその他の疾患により意識や制御を失ったドライバーは、免許停止となり、再交付の資格を得るには最低6ヶ月間、症状がない状態（lapse
    free）を維持する必要があります。
- id: 630
  category: penalties_and_points
  question: 緊急車両に優先権を譲らなかった場合、何ポイントが科せられますか？
  choices:
    A: 3ポイント
    B: 4ポイント
    C: 6ポイント
    D: 8ポイント
  answer: C
  explanation: ポイント表では、「緊急車両への進路譲渡違反（Failure to yield right of way to emergency vehicles）」に対して6ポイントが割り当てられています。
- id: 631
  category: license_system
  question: 交通違反の召喚状（citation）に対応しなかったために制限付き免許を取得した場合、どこへの運転が許可されますか？
  choices:
    A: 仕事の往復のみ
    B: 仕事と全日制大学の往復
    C: 午前6時から午後6時の間ならどこでも
    D: 仕事と宗教行事の往復
  answer: A
  explanation: 交通違反の召喚状の不履行（Failure to Satisfy a Citation）による制限付き免許の場合、認定された命令により、仕事の往復のみの運転が許可されます。
- id: 632
  category: penalties_and_points
  question: 工事区間内において、制限速度を時速16マイルから25マイル（m.p.h.）超えて走行した場合、何ポイントが科せられますか？
  choices:
    A: 4ポイント
    B: 5ポイント
    C: 6ポイント
    D: 8ポイント
  answer: B
  explanation: 通常、制限速度を時速16マイルから25マイル超えた場合は4ポイントですが、工事区間（Construction Zone）では5ポイントが科せられます。
- id: 633
  category: license_system
  question: DUI（飲酒・薬物影響下運転）の有罪判決後の制限付き運転免許は、過去10年以内に以下のどの前科があるドライバーには認められませんか？
  choices:
    A: 無謀運転（Reckless driving）
    B: 時速25マイル以上の速度超過
    C: 成人による障害物影響下運転（Adult driving while impaired）
    D: ドラッグレース
  answer: C
  explanation: 過去10年以内にDUIまたは成人による障害物影響下運転（Adult driving while impaired）の前科があるドライバーは、制限付き免許を選択することはできません。
- id: 634
  category: alcohol_drugs_health
  question: 身体的または精神的障害によって運転能力に影響があると当局が判断した場合、何日以内に診断書を提出しなければなりませんか？
  choices:
    A: 10日
    B: 15日
    C: 30日
    D: 60日
  answer: C
  explanation: ドライバーは、通知を受けてから30日以内に医師による診断書（medical report）を提出する必要があります。
- id: 635
  category: penalties_and_points
  question: 18歳未満のドライバーが携帯電話を使用しながら車両を運転した場合、何ポイントが科せられますか？
  choices:
    A: 3ポイント
    B: 4ポイント
    C: 6ポイント
    D: 8ポイント
  answer: C
  explanation: ポイント表では、「携帯電話を使用しながらの車両運転（18歳未満）」に対して6ポイントが規定されています。
- id: 636
  category: license_system
  question: 薬物またはアルコール関連の容疑で免許を失った未成年者は、どこへの往復のために制限付き免許を申請できますか？
  choices:
    A: 宗教行事と仕事
    B: 教育機関または仕事
    C: 外来治療プログラムのみ
    D: 日中の時間帯ならどこでも
  answer: B
  explanation: 薬物またはアルコール関連の容疑で免許を失った未成年者は、教育機関または仕事への往復のために自動車を運転するための制限付き免許を裁判官に申請することができます。
- id: 637
  category: penalties_and_points
  question: 他人の死亡を招いた事故の発生に寄与したドライバーには、何ポイントが科せられますか？
  choices:
    A: 4ポイント
    B: 5ポイント
    C: 6ポイント
    D: 8ポイント
  answer: D
  explanation: ポイント表では、「他人の死亡を招いた事故の発生への寄与」に対して8ポイントが割り当てられています。
- id: 638
  category: driver_responsibility
  question: 免許停止期間の終了後、成人のドライバーが通常の免許を取得する前に、具体的にどのような保険の証明が必要ですか？
  choices:
    A: 総合保険（Comprehensive insurance）
    B: SR-22保険
    C: 車両保険（Collision insurance）
    D: 無保険車傷害保険
  answer: B
  explanation: 免許停止期間の終了後、適切な再交付手数料を支払い、賠償責任保険／財務責任の証明を提出する必要があります（成人のドライバーにはSR-22保険が必要です）。
- id: 639
  category: license_system
  question: ドライバーが規定の期間内に当局からの診断書の要請に応じなかった場合、どうなりますか？
  choices:
    A: 50ドルの罰金が科せられる。
    B: 運転資格が停止される。
    C: 車両登録が取り消される。
    D: 筆記試験のみ再受験が必要になる。
  answer: B
  explanation: マニュアルによると、規定の期間内に当局からの診断書の要請に応じない、または運転免許試験を受けない場合、運転資格が停止されます。
- id: 640
  category: driver_responsibility
  question: 他人に与えた損害を補償する保険はどれですか？
  choices:
    A: 車両保険（Collision insurance）
    B: 無保険車傷害保険
    C: 賠償責任保険（Liability insurance）
    D: 総合保険（Comprehensive insurance）
  answer: C
  explanation: マニュアルでは、賠償責任保険（Liability insurance）を「他人に与えた損害を補償するもの」と定義しています。
- id: 641
  category: driver_responsibility
  question: テネシー州法で車両保険（collision insurance）への加入は義務付けられていますか？
  choices:
    A: はい、すべての運転者に義務付けられています。
    B: はい、ただし商用車のみです。
    C: いいえ、義務付けられていません。
    D: いいえ、過去に事故歴がある場合を除き、義務ではありません。
  answer: C
  explanation: マニュアルには、「テネシー州法では車両保険（collision insurance）は義務付けられていませんが、財務責任法（Financial
    Responsibility Law）により、運転者は財務責任の証拠を提示することが求められます」と明記されています。
- id: 642
  category: driver_responsibility
  question: 財務責任の証明として認められるものの中に含まれていないのはどれですか？
  choices:
    A: 保険バインダー（仮保険証）
    B: 保険証券の申告ページ（デクラレーション・ページ）
    C: 保険代理店からの口頭での約束
    D: 認可された会社が発行した保険証（保険カード）
  answer: C
  explanation: 認められる証明形式には、保険証券の申告ページ、保険バインダー、保険証、現金預金/債券の証明書、または自己保険者としての資格証明が含まれます。口頭での約束は含まれていません。
- id: 643
  category: safe_driving_rules
  question: 死亡、負傷、またはいくら以上の物的損害が発生した事故の場合、直ちに警察に通報しなければなりませんか？
  choices:
    A: $50
    B: $100
    C: $400
    D: $500
  answer: A
  explanation: 運転者は、死亡、負傷、または50ドル（$50）を超える物的損害が発生した事故については、直ちに地元警察、郡保安官事務所、またはハイウェイ・パトロールに通報しなければなりません。
- id: 644
  category: driver_responsibility
  question: 運転者が身体的な理由で直ちに警察に事故の通知ができない場合、誰がそれを行う必要がありますか？
  choices:
    A: 事故に関与したもう一方の運転者
    B: 通知を行う能力のある同乗者
    C: 現場に最初に居合わせた目撃者
    D: 運転者の保険会社
  answer: B
  explanation: マニュアルには、運転者が身体的に通知を行うことができず、通知を行う能力のある同乗者がいる場合、その同乗者が通知を行うか、または通知が行われるように手配しなければならないと記載されています。
- id: 645
  category: driver_responsibility
  question: 1人あたりの物的損害がいくらを超えた場合、テネシー州安全・国土安全保障省に「報告義務のある事故」として報告しなければなりませんか？
  choices:
    A: $50
    B: $200
    C: $400
    D: $1,000
  answer: C
  explanation: 報告義務のある事故には、死傷者が出た事故、または1人あたりの物的損害が400ドル（$400）を超える事故が含まれます。
- id: 646
  category: driver_responsibility
  question: 報告義務のある事故について、テネシー州安全・国土安全保障省に「所有者/運転者報告書」を提出するまでの期限は何日以内ですか？
  choices:
    A: 5日以内
    B: 10日以内
    C: 15日以内
    D: 20日以内
  answer: D
  explanation: 報告義務のある事故に関与した車両の運転者および/または所有者は、20日以内に事故の「所有者/運転者報告書」を提出しなければなりません。
- id: 647
  category: safe_driving_rules
  question: 無人の車両と事故を起こし、所有者が見つからない場合はどうすべきですか？
  choices:
    A: フロントガラスにメモを残して立ち去る。
    B: 警察に事故を報告する。
    C: 所有者が戻るまで現場で待つ。
    D: 30日以内に所有者/運転者報告書を提出する。
  answer: B
  explanation: 無人の車両や家畜が関与した事故で、所有者が見つからない場合は、警察に事故を報告しなければなりません。
- id: 648
  category: penalties_and_points
  question: 事故に対する財務責任を果たせなかったために運転免許が取り消された場合、再交付の前に保険会社が提出しなければならない書類は何ですか？
  choices:
    A: SR-22フォーム
    B: FR-44フォーム
    C: TN-10フォーム
    D: DL-12フォーム
  answer: A
  explanation: このような取り消しの後に運転免許を再交付するには、再交付手数料を支払い、賠償責任保険会社から安全省（Department of Safety）にSR-22フォームを提出してもらう必要があります。
- id: 649
  category: safe_driving_rules
  question: 事故現場で車両の火災を防ぐために、損傷した車両に対して最初に行うべきことは何ですか？
  choices:
    A: バッテリーを外す。
    B: イグニッション（エンジン）を切る。
    C: エンジンに水をかける。
    D: ガソリンキャップを外す。
  answer: B
  explanation: マニュアルでは、火災を防ぐために「損傷した車両のイグニッションを切る」よう指示されています。
- id: 650
  category: safe_driving_rules
  question: テネシー州法において、州間高速道路（インターステート）での事故後に車両を交通の流れから移動させることが許可されるのはどのような場合ですか？
  choices:
    A: 警察が到着し、写真を撮り終えた後のみ。
    B: 車両が走行可能で、重大な負傷者や死亡者がいない場合。
    C: レッカー車が到着するまで、車両を移動させることは決して許されない。
    D: 物的損害が50ドル未満の場合のみ。
  answer: B
  explanation: 州間高速道路で交通事故に遭った際、車両が走行可能であり、かつ重大な負傷や死亡者がいない場合に限り、テネシー州法では渋滞を防ぐために車両を移動させることが認められています。
- id: 651
  category: safe_driving_rules
  question: 医療や救助の訓練を受けていない場合、事故車両から負傷者を移動させてもよいのはどのような時ですか？
  choices:
    A: 負傷者が移動させてほしいと頼んできた時。
    B: 負傷者が交通を妨げている時。
    C: 火災などの差し迫った危険がある時。
    D: 救急車の到着まで10分以上かかる時。
  answer: C
  explanation: 必要な医療や救助の訓練を受けていない限り、火災などの差し迫った危険がない限り、事故車両から負傷者を移動させようとしてはいけません。
- id: 652
  category: defensive_driving
  question: 事故現場に最初に到着し、救護の専門的な訓練を受けていない場合、911に通報した後はどうすべきですか？
  choices:
    A: 停車して、事故現場周辺の交通整理を行う。
    B: 妨げにならないよう、自分の車でゆっくりとそのまま進む。
    C: 路肩に寄せて停車し、警察が事情聴取に来るのを待つ。
    D: 車両から乗客を救出しようと試みる。
  answer: B
  explanation: 救護の専門的な訓練を受けていない場合は、警察や救急サービスの到着を妨げたり、二次衝突を引き起こしたりしないよう、自分の車でゆっくりとそのまま進んでください。
- id: 653
  category: safe_driving_rules
  question: 事故を目撃した場合、マニュアルに従った適切な手順は何ですか？
  choices:
    A: 安全に路肩に停車し、非常点滅表示灯（ハザードランプ）を点灯させ、警察に通報する。
    B: 当て逃げだった場合は、その車両を追跡する。
    C: そのまま運転を続け、帰宅してから警察に電話する。
    D: 道路の真ん中に停車して交通を遮断し、現場を保護する。
  answer: A
  explanation: 事故を目撃した場合は、安全に路肩に停車し、車両の非常点滅表示灯（ハザードランプ）を点灯させてください。警察官またはテネシー州警察官（State
    Trooper）に、事故を目撃したことを伝えてください。
- id: 654
  category: penalties_and_points
  question: マニュアルによると、運転免許が取り消しまたは停止される可能性があるのは、次のうちどの理由ですか？
  choices:
    A: 12ヶ月以内に8ポイントが累積した場合
    B: 運転免許証を不正に改ざんした場合
    C: 駐車違反切符を1回受け取った場合
    D: 速度制限を一度だけ5マイル超えて走行した場合
  answer: B
  explanation: マニュアルには、運転免許証を不正に改ざんした場合、または頻繁な違反により12ヶ月以内に12ポイント以上が累積した場合、運転免許が取り消しまたは停止される可能性があると記載されています。
- id: 655
  category: defensive_driving
  question: 安全運転の習慣である「エイム・ハイ・イン・ステアリング（Aim High In Steering）」とはどういう意味ですか？
  choices:
    A: ステアリングホイール（ハンドル）を最も高い位置に調整すること
    B: 重要な交通情報を発見するために、できるだけ遠くの道路を見ること
    C: 視線を自分の車のボンネットに直接集中させ続けること
    D: ハンドルの最上部を両手で持って操縦すること
  answer: B
  explanation: 「エイム・ハイ・イン・ステアリング（Aim High In Steering）」とは、適切な判断を下すために、重要な交通情報を求めてできるだけ遠くの道路を見ることを意味します。
- id: 656
  category: defensive_driving
  question: 運転中に「逃げ道を作る（Leave Yourself an Out）」ためには、車両の前方と、少なくともどちら側にスペースを確保すべきですか？
  choices:
    A: 両側
    B: 後方
    C: 片側
    D: 助手席側のみ
  answer: C
  explanation: マニュアルでは、衝突やトラブルを回避するために、常に準備を整え、車両の前方と少なくとも片側にスペースを確保して「逃げ道を作る（Leave
    Yourself an Out）」ことを推奨しています。
- id: 657
  category: driver_responsibility
  question: 安全運転を確保するために、身につけることができる最も重要な運転態度は何ですか？
  choices:
    A: 積極性とスピード
    B: 他者への礼儀と思いやり
    C: 自信と自己主張
    D: 競争心と警戒心
  answer: B
  explanation: マニュアルによると、他者への礼儀と思いやりの心は、身につけることができる最も重要な運転態度であり、安全運転の鍵となります。
- id: 658
  category: defensive_driving
  question: 防衛運転（ディフェンシブ・ドライビング）を行う際、他のドライバーが何をすると想定すべきですか？
  choices:
    A: 常に交通規則を守る
    B: あなたに優先権を譲る
    C: 「間違った行動」をとる
    D: 方向指示器を正しく使う
  answer: C
  explanation: 注意深く運転するための重要なルールは、他のドライバーが「間違った行動」をとることを想定し、その誤りに対処するための行動計画を準備しておくことです。
- id: 659
  category: safe_driving_rules
  question: どのような条件下で、車間距離を少なくとも3〜4秒に広げるべきですか？
  choices:
    A: 住宅街を走行している時
    B: 高速道路（インターステート）で大型の商用トラックやバスの後を走行している時
    C: 激しい渋滞（ストップ・アンド・ゴー）の中を走行している時
    D: 4方向一時停止の交差点に近づいている時
  answer: B
  explanation: マニュアルによると、高速道路で大型の商用トラックやバスの後を走行する場合、および悪天候や視界不良の条件下では、車間距離を少なくとも3〜4秒に広げることが最も安全です。
- id: 660
  category: defensive_driving
  question: 運転中、道路や周囲に関する情報の何パーセントを視覚から得ていますか？
  choices:
    A: 50%
    B: 75%
    C: 90%
    D: 99%
  answer: C
  explanation: 運転中、私たちは道路や周囲に関する情報の90%を視覚から得ています。
- id: 661
  category: defensive_driving
  question: 防衛運転（ディフェンシブ・ドライビング）を行う際、道路をスキャンしながら視線をどれくらい先に合わせるべきですか？
  choices:
    A: 2～3秒先
    B: 5～8秒先
    C: 10～15秒先
    D: 20～30秒先
  answer: C
  explanation: 防衛運転では、状況を早期に把握し反応時間を確保するために、10〜15秒先（市街地の約1ブロック分に相当）に視線を合わせるようにします。
- id: 662
  category: safe_driving_rules
  question: 交差点に入る際、なぜ最初に左側を確認すべきなのですか？
  choices:
    A: 左から来る車の方が自分に近い位置を通るから
    B: 左から来る車が常に優先権を持っているから
    C: ほとんどの交差点で左折は禁止されているから
    D: 交通標識は通常左側に設置されているから
  answer: A
  explanation: どの交差点でも、左から来る車の方が自分に近い位置を通るため、まず左側を確認してください。
- id: 663
  category: defensive_driving
  question: 後方の交通状況を確認するために、どのくらいの頻度でバックミラー（ルームミラー）を見るべきですか？
  choices:
    A: 約5秒ごと
    B: 約10秒ごと
    C: 約30秒ごと
    D: 停止の準備をする時のみ
  answer: B
  explanation: 後方の交通状況を確認するために、頻繁に（約10秒ごとに）バックミラーを確認する必要があります。
- id: 664
  category: safe_driving_rules
  question: 方向指示器（ウィンカー）を使用する習慣は、いつ身につけるべきですか？
  choices:
    A: 道路上に他の車両が見える時のみ
    B: 州間高速道路で車線を変更する時のみ
    C: 道路上に他の車両が見えない時でも
    D: 日中の時間帯のみ
  answer: C
  explanation: 道路上に他の車両が見当たらない場合でも、方向指示器を使用する習慣を身につけるべきです。
- id: 665
  category: defensive_driving
  question: 後続車に車間距離を詰められており（あおり運転）、避けるための右車線がない場合、最も安全な対処法は何ですか？
  choices:
    A: 後続車を牽制するために急減速する
    B: 前方の道路が空き、追い越しが許可されている場所まで待ってから、ゆっくりと速度を落とす
    C: 後続車との距離を広げるために加速する
    D: ブレーキランプを点滅させるためにブレーキを繰り返し軽く踏む
  answer: B
  explanation: 右車線がない場合は、前方の道路が空き、追い越しが法的に許可されるまで待ち、それからゆっくりと速度を落としてください。これにより、後続車が追い越していくよう促すことができます。決して急減速してはいけません。
- id: 666
  category: defensive_driving
  question: 道路をスキャンしている際、車両が自分の進路に割り込んでくる可能性があることを示す手がかりは次のうちどれですか？
  choices:
    A: 車の窓が開いている
    B: 車のフロントガラスが汚れている
    C: 車の車輪が傾いている、または排気ガスが出ている
    D: 車が消火栓の近くに駐車している
  answer: C
  explanation: 排気ガス、ブレーキランプやバックランプ、車輪の向きなどの手がかりに注意してください。これらは、その車両が自分の進路に動き出す可能性があることを示しています。
- id: 667
  category: safe_driving_rules
  question: 2車線の道路で対向車とすれ違う際、自車をどの位置に配置すべきですか？
  choices:
    A: 中央線（センターライン）の真上
    B: 中央線を圧迫しないよう、車線のやや右寄り
    C: 視界を良くするために、車線のやや左寄り
    D: 道路の右路肩の上
  answer: B
  explanation: 2車線の道路で対向車とすれ違う際は、中央線を「圧迫」しないよう、自車線のやや右側に寄って走行してください。
- id: 668
  category: penalties_and_points
  question: 交通法規違反による度重なる有罪判決の結果、12ヶ月以内に合計何ポイントに達すると、運転免許の取り消しまたは停止処分を受ける可能性がありますか？
  choices:
    A: 6ポイント以上
    B: 8ポイント以上
    C: 10ポイント以上
    D: 12ポイント以上
  answer: D
  explanation: 交通法規違反を繰り返し、12ヶ月以内に12ポイント以上の「ポイント」が累積した場合、運転免許が取り消しまたは停止されることがあります。
- id: 669
  category: defensive_driving
  question: 車線変更、道路への進入、または他の車線への合流を行う際に必要な最小限の車間距離（ギャップ）はどれくらいですか？
  choices:
    A: 2秒の間隔
    B: 3秒の間隔
    C: 4秒の間隔
    D: 5秒の間隔
  answer: C
  explanation: マニュアルによると、車線変更、道路への進入、または走行車線が他の車線と合流する際には、最低4秒の間隔が必要です。
- id: 670
  category: safe_driving_rules
  question: 他の車両を追い越す際、走行車線に戻るのに最も安全なタイミングはいつですか？
  choices:
    A: 自車が追い越した車両のフロントバンパーより前に出たらすぐに
    B: 追い越した車両の両方のヘッドライトがバックミラー（ルームミラー）に見えた時
    C: 追い越された側のドライバーがヘッドライトを点滅させた時
    D: 車線変更してからちょうど3秒が経過した後
  answer: B
  explanation: 安全に追い越しを完了させるためには、追い越した車両の両方のヘッドライトがバックミラーに見えるようになるまで、元の車線に戻らないのが最も安全です。
- id: 671
  category: safe_driving_rules
  question: 時速55マイル（55 M.P.H.）で1台の車両を追い越すのに、およそどのくらいの時間が必要ですか？
  choices:
    A: 約5秒
    B: 約10秒
    C: 約15秒
    D: 約20秒
  answer: B
  explanation: 時速55マイルでは、1台の車両を追い越すのに約10秒かかります。つまり、対向車との間に10秒分の間隔が必要であることを意味します。
- id: 672
  category: defensive_driving
  question: NHTSA（米国国家道路交通安全局）によると、毎年の全交通事故死亡者のうち、攻撃的な運転行動が原因である割合はおよそ何パーセントですか？
  choices:
    A: 33%
    B: 50%
    C: 66%
    D: 80%
  answer: C
  explanation: 米国国家道路交通安全局（NHTSA）によると、毎年の全交通事故死亡者の約66%が攻撃的な運転行動によって引き起こされています。
- id: 673
  category: defensive_driving
  question: 攻撃的なドライバーに追跡された場合、推奨される行動は何ですか？
  choices:
    A: すぐに自宅へ向かい、ドアをロックする。
    B: 車を止めて、そのドライバーと対峙する。
    C: 警察署や、助けを求められる公共の場所へ行く。
    D: スピードを上げて、交通の中で相手をまく。
  answer: C
  explanation: ロード・レイジ（あおり運転）を避けるためのヒントによると、他のドライバーに追跡された場合は、警察署や助けを求められる公共の場所へ行くべきです。
- id: 674
  category: safe_driving_rules
  question: ほとんどの事故はどのような天候条件の下で発生しますか？
  choices:
    A: 晴天時
    B: 雪の時
    C: 雨の時
    D: 霧の時
  answer: A
  explanation: 特別な運転条件に関するマニュアルの小テストによると、ほとんどの事故は晴天時に発生しており、「晴れた日も命取りになり得る」と記されています。
- id: 675
  category: defensive_driving
  question: 衝突を避けるためにドライバーが取れる3つの選択肢は何ですか？
  choices:
    A: 停止、旋回、加速
    B: ブレーキ、クラクション、急ハンドル
    C: 停止、後退、旋回
    D: 加速、クラクション、ブレーキ
  answer: A
  explanation: 衝突を回避する際、ドライバーには3つの選択肢があります。1. 停止する、2. 旋回する、3. 加速する。
- id: 676
  category: vehicle_information
  question: 素早く停止する必要があり、車両にアンチロック・ブレーキ・システム（ABS）が装備されている場合、どうすべきですか？
  choices:
    A: 横滑りを避けるために、ブレーキを素早くポンピング（断続的に踏む）する。
    B: ブレーキペダルをできるだけ強く踏み込み、そのまましっかりと踏み続ける。
    C: ブレーキを穏やかにかけ、徐々に圧力を強める。
    D: ブレーキペダルを強く踏み、押し返される感じがしたらすぐに緩める。
  answer: B
  explanation: ABSを装備している場合は、ブレーキペダルをできるだけ強く踏み込み、そのまましっかりと踏み続ける必要があります。ペダルが押し返される感じがしても、ブレーキペダルを緩めてはいけません。
- id: 677
  category: vehicle_information
  question: 素早く停止しなければならず、ABSが装備されていない状況で、ブレーキがロックして横滑りが発生した場合はどうすべきですか？
  choices:
    A: ブレーキペダルをできるだけ強く踏み続ける。
    B: 素早くブレーキペダルを緩め、横滑りが止まったら再び踏み込む。
    C: ハンドルを反対方向に急に切る。
    D: すぐにパーキングブレーキをかける。
  answer: B
  explanation: ABSがない場合、ブレーキがロックして横滑りが始まったら、素早くブレーキペダルを緩める必要があります。車両の横滑りが止まったら、すぐに再びブレーキペダルを踏み込みます。
- id: 678
  category: safe_driving_rules
  question: 素早い回避のための旋回を行う際、ハンドル（ステアリングホイール）の推奨される手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 8時と4時の位置
    C: 3時と9時の位置
    D: 12時と6時の位置
  answer: C
  explanation: ほとんどの旋回、特に素早い旋回においては、手の位置を3時と9時の位置に置くのが最適です。
- id: 679
  category: vehicle_information
  question: ハンドルの3時と9時の位置が推奨されるのはなぜですか？
  choices:
    A: 方向指示器（ウィンカー）に手が届きやすくなるため。
    B: 衝突時に、手首や前腕がエアバッグの主な衝撃範囲に入らないようにするため。
    C: 急旋回中にハンドルがロックするのを防ぐため。
    D: 片手でハンドルを回す際に最も大きな力がかかるため。
  answer: B
  explanation: 手を3時と9時の位置に置くことで、万が一衝突事故に遭った際、ハンドル内に設置されているエアバッグの主な衝撃範囲から手首や前腕を遠ざけることができます。
- id: 680
  category: defensive_driving
  question: 運転ルールの「スプリット・ザ・ディファレンス（中間に位置する）」とはどういう意味ですか？
  choices:
    A: 自転車を追い越す際、車線の中央をまたいで走ること。
    B: 2つの危険物の間の中間コースを走行し、より危険な側に多くのスペースを空けること。
    C: 複数の車線を1車線ずつ移動すること。
    D: 通常の交通状況で2秒間の車間距離を維持すること。
  answer: B
  explanation: 「スプリット・ザ・ディファレンス」とは、2つの危険物の間の中間コースを走行することを意味します。一方が他方よりも危険な場合は、より危険な側に少し多めにスペースを空けます。
- id: 681
  category: safe_driving_rules
  question: 交差点で交通を横断する際、進入する前に何を確認しなければなりませんか？
  choices:
    A: 中間帯（メディアン）で待機できるよう、半分まで渡れること。
    B: 交差点を塞ぐことなく、完全に向こう側まで渡りきれるだけの十分な隙間があること。
    C: 後続車も横断する準備ができていること。
    D: 接近してくる車に勝てるよう加速すること。
  answer: B
  explanation: 交通を横断する際は、道路を完全に渡りきるのに十分な隙間が必要です。交差点を塞いだり、車両の一部が走行車線に残った状態で立ち往生したりしてはいけません。
- id: 682
  category: defensive_driving
  question: 他のドライバーが十分なスペースがないのに追い越すなどのミスをした場合、どうすべきですか？
  choices:
    A: 自分の車線に入らせないように加速する。
    B: 警告するためにクラクションを鳴らし、ライトを点滅させる。
    C: 減速し、追い越した車が安全に走行車線に戻れるようスペースを空ける。
    D: 路肩に移動して完全に停止する。
  answer: C
  explanation: 他のドライバーが十分なスペースのない追い越しなどのミスをした場合は、減速して追い越し車両が安全に走行車線に戻れるようスペースを空けるなど、防衛運転（ディフェンシブ・ドライビング）で対応すべきです。
- id: 683
  category: safe_driving_rules
  question: 基本的な運転において推奨される手の位置はどこですか？
  choices:
    A: 10時と2時の位置
    B: 9時と3時の位置
    C: 8時と4時の位置
    D: 11時と1時の位置
  answer: B
  explanation: マニュアルでは、基本的な運転姿勢は左手を9時、右手を3時の位置に置くこととされています。
- id: 684
  category: vehicle_information
  question: アンチロック・ブレーキ・システム（ABS）を搭載していない車両で、緊急時や滑りやすい状況で急ブレーキをかけるとどうなりますか？
  choices:
    A: 車輪はロックせず、車は安定したままになる。
    B: 衝突を避けるために車が自動的に加速する。
    C: すべての車輪がロックし、車はスリップし始め、ハンドル操作ができなくなる。
    D: ブレーキが手動よりもはるかに速く電子的にポンピングされる。
  answer: C
  explanation: ABSがない場合、緊急時や滑りやすい状況ではすべての車輪がロックし、車はスリップし始め、ハンドル操作ができなくなります。
- id: 685
  category: defensive_driving
  question: ABSを搭載していない車両で、ブレーキをかけながら素早く曲がるにはどうすればよいですか？
  choices:
    A: 曲がりながらブレーキペダルを強く踏み込み、そのまま保持する。
    B: ブレーキペダルを緩めてから、ハンドルを切る。
    C: ハンドルを急に切りながら、ブレーキを素早くポンピングする。
    D: ハンドルを鋭く切りながら加速する。
  answer: B
  explanation: ABSがない場合、ブレーキをかけている最中に素早く曲がるには、ブレーキペダルを緩めてからハンドルを切る必要があります。
- id: 686
  category: defensive_driving
  question: 衝突を避けるために加速することが最善、あるいは必要となるのはどのような時ですか？
  choices:
    A: 鹿の横断注意の標識に近づいている時。
    B: 他の車両が横や後ろから衝突しそうで、前方にスペースがある時。
    C: スクールゾーンを走行中に後続車に煽られている時。
    D: ABSなしで急カーブに近づいている時。
  answer: B
  explanation: 他の車両が横や後ろから衝突しそうで、危険を回避するために前方にスペースがある場合は、衝突を避けるために加速するのが最善なことがあります。
- id: 687
  category: safe_driving_rules
  question: 鹿と車の衝突事故が最も多い季節はいつですか？
  choices:
    A: 春
    B: 夏
    C: 秋
    D: 冬
  answer: C
  explanation: 秋は鹿の繁殖期と狩猟期の両方にあたり、鹿の活動が活発になるため、鹿と車の衝突事故のピークシーズンとなります。
- id: 688
  category: defensive_driving
  question: 道路上の鹿に対してヘッドライトを点滅させるのを避けるべきなのはなぜですか？
  choices:
    A: 鹿が車両に向かって突進してくる原因になるため。
    B: 鹿はヘッドライトを凝視する傾向があるため、点滅させると動物が道路上で立ちすくんでしまう可能性があるため。
    C: 対向車のドライバーの目を一時的にくらませるため。
    D: 鹿が対向車線に予測不能な動きで飛び出す原因になるため。
  answer: B
  explanation: 鹿はヘッドライトを凝視する傾向があるため、ライトを点滅させると動物が道路上で立ちすくんでしまう可能性があります。
- id: 689
  category: defensive_driving
  question: 動物との衝突が避けられないと思われる場合、どうすべきですか？
  choices:
    A: 動物を避けるために、ハンドルを左または右に急に切る。
    B: 衝撃時間を最小限にするために加速する。
    C: ハンドルを急に切らず、車両を制御して車道内にとどめる。
    D: ブレーキを素早くポンピングし、ハンドルを急に動かす。
  answer: C
  explanation: 衝突が避けられないと思われる場合、動物を避けようとしてハンドルを急に切ってはいけません。そうすると、人身事故のリスクが高まる可能性があります。車両を制御し、車道内にとどまってください。
- id: 690
  category: vehicle_information
  question: 実際の緊急事態において、アンチロック・ブレーキ・システム（ABS）を使用する際の正しいブレーキ技術は何ですか？
  choices:
    A: ブレーキペダルを素早くポンピングする。
    B: 他のドライバーに警告するためにブレーキを軽く叩く。
    C: ペダルが振動しても、強く踏み込んでそのまま保持する。
    D: ペダルの振動を感じたら、ブレーキを少し緩める。
  answer: C
  explanation: マニュアルでは、ABS搭載車のドライバーに対し、「踏み込む。ブレーキペダルを強く叩きつけるように踏む。強く押し続け、そのまま保持する」と指示しています。ペダルが振動しても緩めてはいけません。
- id: 691
  category: vehicle_information
  question: ABS（アンチロック・ブレーキ・システム）搭載車でブレーキペダルを「ポンピング（断続的に踏む）」してはいけないのはなぜですか？
  choices:
    A: エンジンが停止（ストール）するため。
    B: ABSシステムが、手動で行うよりもはるかに速く電子的にブレーキをポンピングしているため。
    C: ハンドルがロックされるため。
    D: 車のエアバッグが無効になるため。
  answer: B
  explanation: ABS搭載車でブレーキペダルをポンピングしてはいけません。ペダルに伝わる振動は、ABSシステムが手動で行うよりもはるかに速く電子的にブレーキを「ポンピング」しているために起こるものです。
- id: 692
  category: safe_driving_rules
  question: 運転時に考慮すべき、高速道路交通システムの3つの主要な構成要素は何ですか？
  choices:
    A: 運転者、車両、道路
    B: 天候、交通量、速度
    C: 視覚、聴覚、反射神経
    D: 標識、信号、路面標示
  answer: A
  explanation: 高速道路交通システムには、運転時に考慮すべき3つの主要な構成要素があります。1. 運転者、2. 車両、3. 道路です。
- id: 693
  category: driver_responsibility
  question: 交通事故の最も一般的な原因は何ですか？
  choices:
    A: 悪天候
    B: 整備不良（機械的故障）
    C: ヒューマンエラー（運転ミス）
    D: 道路の整備不良
  answer: C
  explanation: マニュアルによると、交通事故の最も一般的な原因はヒューマンエラー（運転ミス）です。
- id: 694
  category: driver_responsibility
  question: マニュアルによると、交通事故の主な要因の一つは次のうちどれですか？
  choices:
    A: ラジオをつけたまま運転すること
    B: 過度なスピード（速度超過）
    C: 夜間にハイビームを使用すること
    D: 古い車を運転すること
  answer: B
  explanation: 事故の主な要因は、過度なスピード（速度超過）、集中力の欠如、および不適切な回避行動です。
- id: 695
  category: alcohol_drugs_health
  question: 次の一時的な状態のうち、安全な運転を妨げる可能性があるものはどれですか？
  choices:
    A: 怒り、不安、疲労
    B: 日中にサングラスを着用すること
    C: 後部座席に同乗者がいること
    D: ABS搭載車を運転すること
  answer: A
  explanation: 怒り、不安、不満、疲労、および風邪などの軽い病気は、安全な運転を妨げる可能性のある一時的な状態の一部です。
- id: 696
  category: safe_driving_rules
  question: 運転者がサイドミラーを使用し、時々横を確認しなければならないのはなぜですか？
  choices:
    A: 周辺視野だけでは、横にあるものに焦点を合わせることができないため。
    B: 後部ドアがしっかり閉まっているか確認するため。
    C: 対向車線の車両の速度を監視するため。
    D: 対向車のヘッドライトを直視しないようにするため。
  answer: A
  explanation: 横にあるものに焦点を合わせることはできないため、サイドミラーを使用し、必要に応じて時々横を確認する必要があります。
- id: 697
  category: driver_responsibility
  question: シカや家畜などの大きな動物をはねてしまった場合、どうすべきですか？
  choices:
    A: 自分で動物を道路の外へ移動させる。
    B: 警察に事故を報告する。
    C: 車が走行可能であれば、すぐに現場を離れる。
    D: 飼い主が来るまで動物のそばで待つ。
  answer: B
  explanation: シカや家畜などの大きな動物が関わる事故を起こした場合は、警察に報告する必要があります。
- id: 698
  category: license_system
  question: 運転免許証の制限コード「01」は何を示していますか？
  choices:
    A: 日中の時間帯のみの運転に制限されている。
    B: 常に免許を持つ成人が同乗していなければならない。
    C: 運転時は常に矯正レンズ（メガネやコンタクト）を着用しなければならない。
    D: 州間高速道路（インターステート）の走行が禁止されている。
  answer: C
  explanation: マニュアルには、運転免許証に矯正レンズの着用が必要であること（制限コード01）が示されている場合、運転中は常に着用しなければならないと記載されています。
- id: 699
  category: safe_driving_rules
  question: 夜間に濃い色のサングラスや着色コンタクトレンズの使用を避けるべきなのはなぜですか？
  choices:
    A: 対向車のヘッドライトの眩しさが増すため。
    B: はっきりと見るために必要な光を遮ってしまうため。
    C: 目が通常よりはるかに早く疲れるため。
    D: テネシー州での運転中の着用は違法であるため。
  answer: B
  explanation: マニュアルでは、夜間に濃い色のサングラスや着色コンタクトレンズを使用しないようアドバイスしています。これらは、はっきりと見るために必要な光を遮ってしまうためです。
- id: 700
  category: driver_responsibility
  question: 聴覚障害のある運転者は、道路上での安全を維持するためにどのように補うことができますか？
  choices:
    A: 視覚により頼るようにする。
    B: 制限速度よりも遅い速度で運転する。
    C: 常に窓を全開にしておく。
    D: 車により大きな音のクラクションを取り付ける。
  answer: A
  explanation: マニュアルによると、聴覚障害のある運転者は、視覚により頼ることで調整・補完し、安全な運転者になることができます。
- id: 701
  category: defensive_driving
  question: 長距離ドライブの際、疲労を避けるために推奨される方法は次のうちどれですか？
  choices:
    A: 出発前に大量の食事を摂る。
    B: 1時間ごと、または必要に応じてそれ以上の頻度で休憩を取る。
    C: 交通量の少ない深夜に運転する。
    D: 覚醒を維持するために市販薬を服用する。
  answer: B
  explanation: 疲労を避けるため、マニュアルでは1時間ごと、または必要に応じてそれ以上の頻度で停車し、外を歩いて新鮮な空気を吸うなどの休憩を取ることを推奨しています。
- id: 702
  category: alcohol_drugs_health
  question: テネシー州では、てんかんのある人が医師の管理下にあり、最低でもどのくらいの期間、発作がない状態であれば運転が可能ですか？
  choices:
    A: 3ヶ月
    B: 6ヶ月
    C: 1年
    D: 2年
  answer: B
  explanation: マニュアルによると、テネシー州では医師の管理下にあり、最低6ヶ月間発作がない状態であれば運転することができます。
- id: 703
  category: alcohol_drugs_health
  question: 糖尿病のドライバーが定期的に目の検査を受けるべきなのはなぜですか？
  choices:
    A: インスリンによって目が眩しさに過敏になるため。
    B: 免許証に制限コード01を追加する必要がないことを確認するため。
    C: 糖尿病により、運転中に目が乾きやすくなるため。
    D: 夜盲症やその他の視力の問題をチェックするため。
  answer: D
  explanation: マニュアルには、糖尿病がある場合は、夜盲症やその他の視力の問題の可能性を確認するために、定期的に目の検査を受けるべきであると記されています。
- id: 704
  category: driver_responsibility
  question: せっかちな性格の傾向がある場合、不安全な運転行為を避けるために何をすべきですか？
  choices:
    A: 覚醒状態を保つために、テンポの速い音楽を聴く。
    B: 渋滞を避けるために、制限速度をわずかに超えて運転する。
    C: 常に運転時間に余裕を持って計画を立てる。
    D: 交通量の少ない時間帯のみ運転する。
  answer: C
  explanation: マニュアルでは、せっかちな性格の人は、スピード違反やその他の不安全な行為を避けるために、常に運転時間に余裕を持って計画を立てるようアドバイスしています。
- id: 705
  category: vehicle_information
  question: ブレーキシステムを整備士に点検してもらう必要がある兆候は、次のうちどれですか？
  choices:
    A: ブレーキペダルにしっかりとした手応えがあり、圧力を感じる。
    B: 車両が片側に寄ることなく、スムーズに停止する。
    C: ブレーキペダルが床まで沈み込む。
    D: ブレーキをかけたときに全く音がしない。
  answer: C
  explanation: マニュアルは、ブレーキが正しく機能していない場合（大きな音がする、異臭がする、またはブレーキペダルが床まで沈み込むなど）は非常に危険であると警告しています。
- id: 706
  category: vehicle_information
  question: 車のバッテリーは、どのような天候でより急速に消耗する傾向がありますか？
  choices:
    A: 高温で乾燥した天候
    B: 寒冷または湿気の多い天候
    C: 高温多湿で晴れた天候
    D: 高地での環境
  answer: B
  explanation: 車両メンテナンスのセクションによると、車のバッテリーは寒冷または湿気の多い天候でより急速に消耗する傾向があります。
- id: 707
  category: vehicle_information
  question: 車両のガラスの内側に膜（くもり）ができる一般的な原因は何ですか？
  choices:
    A: ヒーターやデフロスターを頻繁に使用すること。
    B: 不凍剤の入っていないウォッシャー液を使用すること。
    C: 車内での喫煙。
    D: 雨の日に窓を開けたままにすること。
  answer: C
  explanation: マニュアルには、窓の内側を清潔に保つよう記されています。特に車内で喫煙する人がいる場合、喫煙によってガラスの内側に膜が付着するため、注意が必要です。
- id: 708
  category: vehicle_information
  question: タイヤのバランスが崩れていたり、空気圧が低かったりした状態で運転すると、どのような結果を招きますか？
  choices:
    A: 燃費と乗り心地が向上する。
    B: 濡れた路面でのステアリング操作が容易になる。
    C: ハイドロプレーニング現象の可能性が低下する。
    D: タイヤの摩耗が早まり、燃費が悪化する。
  answer: D
  explanation: マニュアルでは、タイヤのアンバランスや低空気圧は、タイヤの摩耗を早め、燃費を悪化させ、車両の操縦や停止を困難にすると説明しています。
- id: 709
  category: vehicle_information
  question: ペニー硬貨を使ってタイヤの溝をチェックする場合、溝が少なくともどこまで達していないと、違法で危険なタイヤとみなされますか？
  choices:
    A: リンカーン記念館の屋根
    B: リンカーンの頭（2/32インチ）
    C: 硬貨に印字されている日付
    D: 「In God We Trust」の文字
  answer: B
  explanation: マニュアルには、ペニー硬貨を頭から溝に差し込んだとき、溝が少なくともリンカーンの頭（2/32インチ）まで達していない場合、そのタイヤは違法で危険であると記されています。
- id: 710
  category: vehicle_information
  question: 多くの新型車において、車両の推奨タイヤ空気圧は通常どこで確認できますか？
  choices:
    A: ステアリングコラム（ハンドル軸）の上。
    B: 運転席側のフロントドアジャム（ドアの枠）にあるステッカー。
    C: グローブボックスのドアの内側。
    D: 車両のリアバンパー。
  answer: B
  explanation: マニュアルには、多くの新型車では、推奨タイヤ空気圧は通常、運転席側のフロントドアの枠（ドアジャム）にあるステッカーに記載されていると記されています。
- id: 711
  category: driver_responsibility
  question: マニュアルでは、眼科専門医による視力検査をどのくらいの頻度で受けることを推奨していますか？
  choices:
    A: 6ヶ月ごと
    B: 1〜2年ごと
    C: 5年ごと
    D: 運転免許証の更新時のみ
  answer: B
  explanation: 良く見えることは安全運転にとって非常に重要であるため、マニュアルでは1〜2年ごとに眼科専門医による視力検査を受けることを推奨しています。
- id: 712
  category: vehicle_information
  question: 車両の純正タイヤの推奨空気圧は、通常どこに記載されていますか？
  choices:
    A: タイヤ自体に直接印字されている
    B: 運転席側のフロントドアの柱（ドアジャム）にあるステッカー
    C: ステアリングコラム上
    D: エンジンブロックに刻印されている
  answer: B
  explanation: 多くの新しい車では、車両の推奨タイヤ空気圧はドアの柱（ドアジャム）にあるステッカーに記載されており、通常は運転席側のフロントドア付近にあります。
- id: 713
  category: vehicle_information
  question: タイヤ自体に印字されている空気圧を使用してはいけないのはなぜですか？
  choices:
    A: 安全に走行するために必要な最低限の空気圧だからです。
    B: 冬季の運転条件にのみ適用されるからです。
    C: 推奨される最大空気圧であり、車両の仕様と一致しない可能性があるからです。
    D: サイズの異なる社外品タイヤ専用のものだからです。
  answer: C
  explanation: マニュアルには次のように記載されています。「タイヤ自体に印字されている空気圧（psi）を使用しないでください。これはそのタイヤの推奨最大空気圧であり、車両メーカーの仕様と一致しない場合があります。」
- id: 714
  category: safe_driving_rules
  question: 走行中に車両のイグニッション（点火スイッチ）を「LOCK（ロック）」の位置に回すとどうなりますか？
  choices:
    A: ブレーキが即座に作動します。
    B: ハンドルがロックされ、車両の制御ができなくなります。
    C: エンジンが急速にオーバーヒートします。
    D: 車両は安全に惰性で停止します。
  answer: B
  explanation: 走行中に車両のイグニッションを「LOCK」の位置に回してはいけません。ハンドルが固定（ロック）され、車両のコントロールを失うことになります。
- id: 715
  category: vehicle_information
  question: 段差を越えた後や停車した後に車両が跳ね続ける場合、どのシステムを整備士に点検してもらう必要がありますか？
  choices:
    A: 排気システム
    B: ステアリングシステム
    C: エンジン冷却システム
    D: サスペンションシステム
  answer: D
  explanation: 段差を越えた後や停車した後に車両が跳ね続けたり、コントロールが難しかったりする場合は、ショックアブソーバーやその他のサスペンション部品の交換が必要な可能性があります。
- id: 716
  category: vehicle_information
  question: 車両の排気漏れ（エキゾーストリーク）の可能性がある危険な警告サインは何ですか？
  choices:
    A: ハンドルの操作が困難になる。
    B: 運転中や乗車中に、あなたや同乗者が眠気を感じる。
    C: 停車した後に車両が過度に跳ねる。
    D: エンジン温度計が急激に下がる。
  answer: B
  explanation: 運転中や乗車中に自分や同乗者が眠気を感じることに気づいた場合、排気漏れの可能性があり、直ちに修理する必要があります。
- id: 717
  category: safe_driving_rules
  question: エンジンをかけたまま（アイドリング状態）長時間車内に留まる場合、どうすべきですか？
  choices:
    A: イグニッションを「LOCK」の位置にする。
    B: ラジエーターの冷却水レベルを確認する。
    C: 窓を開けて外気を取り入れる。
    D: 注意を怠らないよう定期的にクラクションを鳴らす。
  answer: C
  explanation: エンジンをかけたまま（アイドリング状態）長時間車内に留まる場合は、一酸化炭素中毒を防ぐために窓を開けて外気を取り入れてください。
- id: 718
  category: vehicle_information
  question: ラジエーターの不凍液（冷却水）のレベルを確認する唯一の安全なタイミングはいつですか？
  choices:
    A: 車両を運転した直後
    B: エンジンがかかっている間
    C: 車両を傾斜地に停めているとき
    D: 車両が冷えているとき
  answer: D
  explanation: ラジエーターの点検は、運転直後ではなく、必ず車両が冷えているときに行ってください。
- id: 719
  category: defensive_driving
  question: 車の床に固定されていない物を置くのが危険なのはなぜですか？
  choices:
    A: ブレーキペダルの下に転がり込み、停車できなくなる可能性があるから。
    B: サスペンションシステムが跳ねる原因になるから。
    C: 排気漏れの原因になるから。
    D: 車両のバッテリーを消耗させるから。
  answer: A
  explanation: ブレーキペダルの下に転がり込んで車両の停止を妨げる可能性のある物が、床の上に置かれていないことを確認してください。
- id: 720
  category: safe_driving_rules
  question: マニュアルによると、車両のクラクション（警音器）の唯一の適切な使用目的は何ですか？
  choices:
    A: 路上で友人に挨拶するため
    B: 遅いドライバーにスピードを上げるよう促すため
    C: 他者への警告として
    D: 駐車することを知らせるため
  answer: C
  explanation: クラクションは安全にとって重要ではないように思えるかもしれませんが、警告装置として命を救う可能性があります。クラクションは他者への警告としてのみ使用してください。
- id: 721
  category: safe_driving_rules
  question: 長距離の運転を始める前に、車両に少なくともどれくらいのガソリンが入っていることを確認すべきですか？
  choices:
    A: 少なくとも1/4タンク
    B: 少なくとも半分
    C: 満タン
    D: 最寄りのガソリンスタンドに到着できる分
  answer: B
  explanation: 長距離の運転を始める前には、常に少なくとも燃料タンクの半分以上のガソリンが入っていることを確認してください。
- id: 722
  category: defensive_driving
  question: マニュアルによると、複数台の車両が関与する衝突事故は、多くの場合どのような時に発生しますか？
  choices:
    A: ドライバーがクラクションを頻繁に使用したとき。
    B: ドライバーが他の交通の流れよりも速い、または遅い速度で走行したとき。
    C: 車両に社外品のタイヤが装着されているとき。
    D: ドライバーがタイヤの空気圧を頻繁にチェックしすぎたとき。
  answer: B
  explanation: 同じ方向に同じ速度で移動している車両同士が衝突することはありません。複数台の車両が関与する衝突事故は、多くの場合、ドライバーが他の交通の流れよりも速い、または遅い速度で走行しているときに発生します。
- id: 723
  category: defensive_driving
  question: ショッピングセンター、駐車場、繁華街などで速度を落とし、警戒する必要があるのはなぜですか？
  choices:
    A: これらのエリアでは制限速度が常に時速15マイル（15 mph）であるため。
    B: これらのエリアには常にランブルストリップ（路面凹凸）があるため。
    C: 車両や歩行者が、さまざまな方向に素早く、かつ不規則に停止、発進、移動しているため。
    D: これらのエリアでは一酸化炭素濃度が高いため。
  answer: C
  explanation: ショッピングセンター、駐車場、繁華街は混雑しており、車両や歩行者がさまざまな方向に素早く、かつ不規則に停止、発進、移動しています。
- id: 724
  category: safe_driving_rules
  question: 一部の踏切を通過する際に、速度を落とす必要があるのはなぜですか？
  choices:
    A: タイヤの空気圧を確認するため
    B: 踏切に凹凸がある場合があるため
    C: 製造元の仕様書を読むため
    D: 排気システムを冷却するため
  answer: B
  explanation: 踏切では、列車が来ていないこと、および渡りきるためのスペースがあることを確認する必要があります。一部の踏切は路面がでこぼこしているため、安全に通過するために速度を落とす必要があります。
- id: 725
  category: sharing_the_road
  question: 州法により、誰が歩行者とみなされますか？
  choices:
    A: 徒歩で移動している人のみ
    B: 徒歩の人、または電動・非電動の車椅子を使用しているすべての人
    C: 自転車または原動機付自転車に乗っているすべての人
    D: 子供と高齢者のみ
  answer: B
  explanation: 州法では、徒歩の人、または電動・非電動の車椅子を使用しているすべての人が歩行者とみなされます。
- id: 726
  category: sharing_the_road
  question: 自動車と歩行者の衝突事故において、最も頻繁に被害者となる歩行者のグループはどれですか？
  choices:
    A: ティーンエイジャーと若年成人
    B: ジョギングやランニングをしている人
    C: 大人数で歩いている歩行者
    D: 子供、高齢者、障害者、および飲酒状態の歩行者
  answer: D
  explanation: 子供、高齢者、障害者、および飲酒状態の歩行者には特に注意を払う必要があります。彼らは自動車と歩行者の衝突事故において、最も頻繁に被害者となっています。
- id: 727
  category: safe_driving_rules
  question: 横断歩道に関する次の記述のうち、正しいものはどれですか？
  choices:
    A: 横断歩道は、白線が引かれている場所にのみ存在する。
    B: 歩行者は、標示のある横断歩道においてのみ優先権を持つ。
    C: 白線や境界線で標示されていなくても、すべての交差点には横断歩道が存在する。
    D: 右折待ちの間、ドライバーは横断歩道を塞いでもよい。
  answer: C
  explanation: マニュアルによると、白線や境界線で標示されていなくても、すべての交差点には横断歩道が存在します。
- id: 728
  category: defensive_driving
  question: ドライバーが車両の一部を横断歩道に重ねて停車することを避けるべきなのはなぜですか？
  choices:
    A: 信号無視監視カメラが作動するため。
    B: 歩行者が車両を避けて通らざるを得なくなり、危険な状況に置かれるため。
    C: 車両のタイヤが過度に摩耗するため。
    D: 他のドライバーから交通信号が見えなくなるため。
  answer: B
  explanation: 横断歩道を塞ぐと、歩行者は車両を避けて通らざるを得なくなり、危険な状況に置かれます。
- id: 729
  category: safe_driving_rules
  question: 警告灯が作動している標示のあるスクールゾーンで、歩行者が横断している場合、ドライバーはどうしなければなりませんか？
  choices:
    A: 時速15マイル（15 mph）まで減速し、注意して進む。
    B: 歩行者に警告するためにクラクションを鳴らす。
    C: 停止し、歩行者が道路を渡りきるまで優先権を譲る。
    D: 歩行者を避けるために隣の車線に急ハンドルを切る。
  answer: C
  explanation: 警告灯が作動している標示のあるスクールゾーンでは、ドライバーは停止して優先権を譲り、歩行者が道路を渡りきるまで停止したままでいなければなりません。
- id: 730
  category: sharing_the_road
  question: 盲導犬を連れている、またはどのような種類の杖を持っている盲目の歩行者に対して、常に道を譲らなければなりませんか？
  choices:
    A: 全体が黒い杖
    B: 白、金属製、または先端が赤色の白い杖
    C: 木製のステッキ
    D: 黄色の反射材付きの杖
  answer: B
  explanation: ドライバーは、白、金属製、または先端が赤色の白い杖を持っている、あるいは盲導犬を連れている盲目の歩行者には、常に道を譲らなければなりません。
- id: 731
  category: safe_driving_rules
  question: 歩道がない場合、歩行者はどこを歩くべきですか？
  choices:
    A: 交通の流れと同じ方向の道路の右側。
    B: 道路の中央。
    C: 対向車と向き合う道路の左側。
    D: 交通の流れと同じ方向の路肩。
  answer: C
  explanation: 歩道がない場合、歩行者は常に、向かってくる危険を察知できるよう、対向車と向き合う道路の左側を歩くべきです。
- id: 732
  category: safe_driving_rules
  question: 歩道のない道路を2人以上の歩行者が通行する場合、どのように歩くべきですか？
  choices:
    A: 視認性を高めるために横に並んで歩く。
    B: 一列になって歩く。
    C: 車線をまたいで手をつないで歩く。
    D: 1人は道路の左側、もう1人は右側を歩く。
  answer: B
  explanation: マニュアルには、道路を歩く際、2人以上の歩行者は一列になって歩き、決して横に並んで歩いてはならないと記載されています。
- id: 733
  category: sharing_the_road
  question: 歩行者が街角に立つ際、安全な距離を保つことが重要なのはなぜですか？
  choices:
    A: 水たまりの跳ね返りを避けるため。
    B: トラックやバスは大きく右折し、時として歩道の角に乗り上げることがあるため。
    C: 自転車が歩道を走るスペースを確保するため。
    D: 車が高速で赤信号を無視することが多いため。
  answer: B
  explanation: トラックやバスは大きく右折し、時として歩道の角に乗り上げることがあるため、歩行者は注意を払い、後ろに下がることが重要です。
- id: 734
  category: signs_and_signals
  question: 道路の横断中に「横断禁止（DON'T WALK）」の信号が点滅し始めた場合、どうすべきですか？
  choices:
    A: すぐに立ち止まり、次の「横断可（WALK）」信号を待つ。
    B: 引き返して、出発した歩道の縁石まで走って戻る。
    C: そのまま歩き続けて横断を完了する。
    D: 交通が途切れるまで中央分離帯に立つ。
  answer: C
  explanation: 道路の途中で「横断禁止（DON'T WALK）」信号が点滅し始めた場合は、そのまま歩き続けてください。横断を完了する時間は十分にあります。
- id: 735
  category: signs_and_signals
  question: 歩行者にとって、「横断可（WALK）」信号や緑色の信号は何を示していますか？
  choices:
    A: 確認せずに横断しても完全に安全であること。
    B: すべての対向車が必ず停止すること。
    C: 横断する順番であることを示しているが、依然として確認を行い、安全な場合にのみ進まなければならない。
    D: 交差点をできるだけ早く走って渡らなければならないこと。
  answer: C
  explanation: 「横断可（WALK）」信号や緑色の信号は、横断する順番であることを示していますが、横断が「安全」であることを意味するわけではありません。まず「確認」し、安全であれば進むことを意味します。
- id: 736
  category: driver_responsibility
  question: ドライバーとして法的な優先権がある場合でも、車の前にいる歩行者に対して決して行ってはならないことは何ですか？
  choices:
    A: 歩行者が渡り終えるのを辛抱強く待つ。
    B: クラクションを鳴らしたり、エンジンを空吹かししたりして、歩行者を急かしたり怖がらせたりする。
    C: 歩行者と目を合わせる。
    D: 優先権を譲る。
  answer: B
  explanation: 法的な優先権がある場合でも、車の前にいる歩行者を急かしたり怖がらせたりするために、クラクションを鳴らしたり、エンジンを空吹かししたりしてはいけません。
- id: 737
  category: safe_driving_rules
  question: 道路を横断し始める前に、歩行者が行うべき推奨される確認手順は何ですか？
  choices:
    A: 右、左、右の順で見る。
    B: 前方のみを見る。
    C: 左、右、左の順で確認し、さらに肩越しに右左折車がいないか確認する。
    D: 信号機を見上げ、すぐに進む。
  answer: C
  explanation: 横断する前に、歩道の縁石で立ち止まり、左、右、左の順で確認します。安全であれば横断を開始し、肩越しに右左折車がいないか確認してください。
- id: 738
  category: sharing_the_road
  question: トラックが後退（バック）しているとき、歩行者がその後ろを歩いてはいけないのはなぜですか？
  choices:
    A: トラックの排気ガスに毒性があるため。
    B: トラックの運転手は車両の直後を見ることができず、重大な怪我を負わせる可能性があるため。
    C: トラックが荷物を落とす可能性があるため。
    D: 商用車の後ろを歩くことは違法であるため。
  answer: B
  explanation: トラックが後退しているときは、決してその後ろを歩かないでください。トラックには大きな死角があり、運転手は車両の直後を直接見ることができないため、重大な怪我を負う恐れがあります。
- id: 739
  category: sharing_the_road
  question: ドライブウェイ（私道）、路地、または駐車場に出入りする際、走行経路が歩道を横切る場合、ドライバーはどうしなければなりませんか？
  choices:
    A: クラクションを鳴らして歩行者に停止するよう警告する。
    B: 歩道を歩いている歩行者に道を譲る。
    C: 歩道を塞がないよう、素早く進む。
    D: ヘッドライトを点滅させて優先権を主張する。
  answer: B
  explanation: ドライブウェイ、公共の駐車場、路地、または駐車場に出入りする際に走行経路が歩道を横切る場合、ドライバーは歩道を歩いている歩行者に道を譲らなければなりません。
- id: 740
  category: safe_driving_rules
  question: 夜間、歩行者がドライバーに視認されるための最も安全な方法はどれですか？
  choices:
    A: 横断歩道のみを歩く。
    B: 眩しさを抑えるために暗い色の服を着る。
    C: 懐中電灯を持ち、明るい色や反射材の付いた服を着用する。
    D: 道路の右側を歩く。
  answer: C
  explanation: 明るい色や反射材の付いた服を着用し、懐中電灯を持つことが、夜間に視認されるための最も確実で安全な方法です。
- id: 741
  category: sharing_the_road
  question: 自動車と自転車の衝突事故の最も一般的な原因は何ですか？
  choices:
    A: 自転車が一時停止標識や赤信号を無視すること。
    B: ドライバーが対向してくる自転車の前で左折したり、自転車の進路を横切って右折したりすること。
    C: 自転車が交通の流れに逆らって走行すること。
    D: 複数車線の幹線道路で、ドライバーが自転車のすぐ近くを追い越すこと。
  answer: B
  explanation: 衝突事故の最も一般的な原因は、ドライバーが対向してくる自転車の前で左折したり、自転車の進路を横切って右折したりすることです。
- id: 742
  category: sharing_the_road
  question: 左折車線で自転車と一緒に並んでいる場合、どうすべきですか？
  choices:
    A: クラクションを鳴らして、道を空けさせる。
    B: 曲がる前に、自転車を右側から追い越す。
    C: 自転車が安全に曲がり終えるまで、その後ろに留まる。
    D: 自転車の横に並び、同時に曲がる。
  answer: C
  explanation: 左折車線で自転車と一緒に並んでいる場合は、自転車が安全に曲がり終えるまで、その後ろに留まってください。
- id: 743
  category: sharing_the_road
  question: 自転車の走行が禁止されている場所はどこですか？
  choices:
    A: 田舎の2車線道路。
    B: 制限速度が時速35マイル（約56km/h）を超える市街地の道路。
    C: 進入制限のある高速道路、自動車専用道路、および特定の標識がある道路。
    D: 指定された自転車専用レーン。
  answer: C
  explanation: 自転車は、進入制限のある高速道路、自動車専用道路、および特定の標識がある道路での走行が禁止されています。
- id: 744
  category: sharing_the_road
  question: テネシー州において、同じ方向に進んでいる自転車を追い越す際、ドライバーが空けなければならない最低限の距離はどれくらいですか？
  choices:
    A: 2フィート（約60cm）
    B: 3フィート（約90cm）
    C: 4フィート（約120cm）
    D: 5フィート（約150cm）
  answer: B
  explanation: 同じ方向に進んでいる自転車を追い越す際は、ゆっくりと走行し、自転車との間に少なくとも3フィート（約90cm）以上の距離を空けてください。これはテネシー州の法律で定められています。
- id: 745
  category: safe_driving_rules
  question: 狭い道路で自転車を追い越そうとしている際、自転車の運転者があなたの接近に気づいていないと思われる場合、どうすべきですか？
  choices:
    A: 相手に聞こえるよう、強くクラクションを鳴らす。
    B: 合図として、軽く短くクラクションを鳴らす。
    C: エンジンを空吹かしして大きな音を出す。
    D: 気づかせるために、できるだけ自転車の近くを通り過ぎる。
  answer: B
  explanation: 狭い道路で自転車を追い越そうとしている際、相手が気づいていないと思われる場合は、追い越す合図として軽く短くクラクションを鳴らしてください。
- id: 746
  category: sharing_the_road
  question: 自転車が左折を示すための正しい手信号は何ですか？
  choices:
    A: 左腕を横に伸ばし、肘を90度に曲げて手を上に向ける。
    B: 左腕または右腕を横に伸ばし、肘を90度に曲げて手を下に向ける。
    C: 左腕を真横に伸ばし、指をすべて伸ばすか、人差し指で左を指す。
    D: 右腕をまっすぐ伸ばし、手のひらを後ろに向ける。
  answer: C
  explanation: 左折：左腕を真横に伸ばし、指をすべて伸ばすか、人差し指で左を指します。
- id: 747
  category: sharing_the_road
  question: 自転車が停止または減速することをどのように合図しますか？
  choices:
    A: 左腕を真横に伸ばし、指をすべて伸ばす。
    B: 左腕を横に伸ばし、肘を90度に曲げて手を上に向ける。
    C: 右腕をまっすぐ伸ばし、指をすべて伸ばす。
    D: 左腕または右腕を横に伸ばし、肘の関節で90度に曲げて手を下に向け、手のひらを後ろに向ける。
  answer: D
  explanation: 停止または減速：左腕または右腕を横に伸ばし、肘の関節で腕を90度に曲げて手を下に向け、手のひらを後ろに向けます。
- id: 748
  category: sharing_the_road
  question: 自転車が車線の全幅を使用することが認められるのはどのような時ですか？
  choices:
    A: 自動車と自転車が安全に並んで走行するには車線が狭すぎる場合。
    B: 住宅街を走行している時はいつでも。
    C: 3人以上のグループで走行している時のみ。
    D: 自転車が車線の全幅を使用することは決して認められない。
  answer: A
  explanation: 自動車と自転車が安全に車線を共有するには幅が狭すぎる場合、自転車は車線の全幅を使用することが認められるべきです。この場合、自転車に車線全体を使わせるのが最も安全です。
- id: 749
  category: vehicle_information
  question: テネシー州の法律によると、夜間に使用する自転車に必要な灯火装置は何ですか？
  choices:
    A: 前方500フィートから見える白色のフロントライトと、後方500フィートから見える赤色の反射板または赤色のリアライト。
    B: 前方300フィートから見える黄色のフロントライトと、後方の白色反射板。
    C: 後方200フィートから見える赤色の反射板のみ。
    D: 前方の点滅する白色ライトと、後方の点滅する黄色ライト。
  answer: A
  explanation: テネシー州の法律では、夜間に使用する自転車には、前方少なくとも500フィートの距離から見える白色のフロントライトと、後方500フィートから見える赤色の反射板または赤色のリアライトを装備することが義務付けられています。
- id: 750
  category: sharing_the_road
  question: 自転車が駐車車両の横を通り過ぎる際、車線の中央に寄る傾向があるのはなぜですか？
  choices:
    A: 後方の車の追い越しを妨害するため。
    B: 車から降りてくる人に怪我をさせたり、自分が怪我をしたりするのを避けるため。
    C: 車線の中央の方が路面が滑らかだから。
    D: 右折の準備をするため。
  answer: B
  explanation: サイクリストが駐車車両の横を走行する際、車から離れて車線の中央に寄る傾向があります。これは、車から降りてくる人によって怪我をしたり、相手に怪我をさせたりすることを避けるためです。
- id: 751
  category: defensive_driving
  question: 夜間に前方から来る自転車の運転者を見かけた際、ヘッドライトについてどのようにすべきですか？
  choices:
    A: 相手をはっきりと確認できるよう、ハイビームを使用する。
    B: 自分の存在を知らせるために、継続的にクラクションを鳴らす。
    C: ハイビームを使用しない。
    D: 警告するために、ハイビームを繰り返し点滅させる。
  answer: C
  explanation: 夜間、前方から来る自転車の運転者を見かけたときは、ハイビームを使用しないでください。
- id: 752
  category: sharing_the_road
  question: 自転車が交通の流れに逆らって走行（逆走）するのが危険なのはなぜですか？
  choices:
    A: 自転車の速度が出すぎてしまうため。
    B: 交通標識や信号機などの交通規制装置を見落とす可能性があるため。
    C: 逆走している自転車を車両が追い越すことは違法であるため。
    D: 自転車のタイヤが偏摩耗するため。
  answer: B
  explanation: 交通の流れに沿って、右側を走行してください。交通の流れに逆らって走行すると、交通標識や信号機などの交通規制装置を見落とす可能性があります。
- id: 753
  category: defensive_driving
  question: 自転車が大型トラックやバスと縁石の間に決して入り込んではいけないのはなぜですか？
  choices:
    A: トラックやバスの運転手が道を尋ねてくるかもしれないため。
    B: 縁石付近のゴミでパンクする可能性があるため。
    C: トラックやバスは大きく右左折するため、自転車が巻き込まれて押しつぶされる恐れがあるため。
    D: 自転車が歩道を走らざるを得なくなるため。
  answer: C
  explanation: トラックやバスは大きく右左折します。トラックやバスと縁石の間には絶対に入り込まないでください。押しつぶされる恐れがあります。
- id: 754
  category: sharing_the_road
  question: 大型トラックに関連する「ノー・ゾーン（No-Zone）」とは何ですか？
  choices:
    A: トラック専用の指定駐車エリア。
    B: トラックの前方、後方、および両側にある、運転手から見えない死角のこと。
    C: トラックの走行が禁止されている区域。
    D: 自転車が優先権を持つ、トラックの直前のエリア。
  answer: B
  explanation: 大型トラックには前方、後方、両側に死角があり、運転手が周囲を確認することが困難です。これらは「ノー・ゾーン（No-Zone）」として知られています。
- id: 755
  category: sharing_the_road
  question: 自転車のアンテナに付いている赤色またはオレンジ色のペナント旗は、運転者に何を示していますか？
  choices:
    A: 運転者が子供であること。
    B: 運転者が危険物を運んでいること。
    C: 運転者の聴覚に障害があること。
    D: 運転者が初心者であること。
  answer: C
  explanation: 自転車のアンテナに赤色またはオレンジ色のペナント旗が付いているのを見かけたら、速度を落としてください。これは一般的に、運転者の聴覚に障害があることを示すシンボルです。
- id: 756
  category: sharing_the_road
  question: 調査によると、四輪車と二輪車（オートバイ）の衝突事故の3分の2の原因は何ですか？
  choices:
    A: 二輪車側のスピード出しすぎや乱暴な運転。
    B: 四輪車の運転者が二輪車の前方で右左折すること。
    C: 歩行者が道路を不法に横断すること。
    D: 大型トラックが合図なしに車線変更すること。
  answer: B
  explanation: 調査によると、四輪車と二輪車の衝突事故の3分の2は、二輪車側ではなく、二輪車の前方で右左折した四輪車の運転者によって引き起こされています。
- id: 757
  category: sharing_the_road
  question: 同じ車線内で二輪車と並んで走行する場合、どうすべきですか？
  choices:
    A: 交通の流れを良くするために、二輪車と車線を共有する。
    B: 追い越すことを知らせるためにクラクションを鳴らす。
    C: 二輪車と同じ車線を共有しようとしてはいけない。
    D: 二輪車を車線の端に追いやる。
  answer: C
  explanation: 二輪車には車線全体を使用する権利があります。二輪車と同じ車線を共有しようとしてはいけません。常に二輪車のスペースと交通の中での位置を尊重してください。
- id: 758
  category: safe_driving_rules
  question: 二輪車の後ろを走行する際、推奨される最小の車間距離はどれくらいですか？
  choices:
    A: 1秒
    B: 2秒
    C: 4秒
    D: 5秒
  answer: B
  explanation: 二輪車の運転者が緊急時に回避や停止を行うための十分な時間を確保できるよう、少なくとも2秒の車間距離を空けてください。
- id: 759
  category: sharing_the_road
  question: 二輪車を追い越す際、近づきすぎたり速すぎたりするのを避けるべきなのはなぜですか？
  choices:
    A: 二輪車が競争を仕掛けてくる可能性があるため。
    B: 風圧によって二輪車が制御不能になる恐れがあるため。
    C: 二輪車の運転者にエンジンの音が聞こえない可能性があるため。
    D: 多車線の幹線道路で二輪車を追い越すことは違法であるため。
  answer: B
  explanation: 乗用車を追い越すときと同じように追い越してください。風圧で二輪車が制御不能になる可能性があるため、近づきすぎたり速すぎたりしないようにしてください。
- id: 760
  category: defensive_driving
  question: 二輪車の運転者は、踏切を渡る際にどのような行動をとることがありますか？
  choices:
    A: できるだけ早く渡りきるために加速する。
    B: 完全に停止し、二輪車を押して渡る。
    C: 速度を落とし、線路を越えるためにジグザグに走行する。
    D: 線路を完全に避けるために路肩を走行する。
  answer: C
  explanation: 踏切は二輪車にとって特に危険な場所であり、通常、速度を落としたり、線路を渡るためにジグザグに走行したりすることがあります。
- id: 761
  category: sharing_the_road
  question: 経験豊富なモーターサイクル運転者が金属製または格子状の橋を走行する際、他のドライバーは何を予測すべきですか？
  choices:
    A: 橋の上にいる時間を最小限にするために急加速する。
    B: 橋の路肩に移動する。
    C: 速度を落とし、車線の中央に移動する。
    D: ステップの上に立ち上がり、蛇行運転をする。
  answer: C
  explanation: 金属製や格子状の橋は、乗用車よりも二輪車を大きくふらつかせます。経験豊富な運転者は、凹凸のある路面に対応できるスペースを確保するため、速度を落として車線の中央に移動します。
- id: 762
  category: vehicle_information
  question: モーターサイクルに乗る際に着用できる最も重要な装備は何ですか？
  choices:
    A: 革製の手袋
    B: DOT（米国運輸省）承認のヘルメット
    C: スチールトゥ（鉄芯入り）のブーツ
    D: 反射材付きのジャケット
  answer: B
  explanation: ヘルメットは、モーターサイクルに乗る際に着用できる最も重要な装備です。米国運輸省（DOT）の基準を満たしていないヘルメットには注意してください。
- id: 763
  category: sharing_the_road
  question: 大型トラックの死角、いわゆる「ノー・ゾーン（No-Zones）」はどこにありますか？
  choices:
    A: トラックの真後ろのみ。
    B: トラックの右側のみ。
    C: トラックの前方、後方、および両側。
    D: トラックの真前のみ。
  answer: C
  explanation: トラックには、両側、前方、後方に大きな「ノー・ゾーン」があります。これらの死角に入っているとき、トラックの運転手はあなたを見ることができません。
- id: 764
  category: safe_driving_rules
  question: 大型トラックを追い越す際、その前方に安全に戻れるのはいつですか？
  choices:
    A: 自分の車のリアバンパーがトラックのフロントバンパーを通過してすぐ。
    B: バックミラーでトラックのフロント部分が見えるようになったとき。
    C: トラックの運転手がクラクションを鳴らしたとき。
    D: トラックのちょうど車一台分前に出たとき。
  answer: B
  explanation: 追い越す際は、トラックの前方に割り込む前にバックミラーでトラックのフロント部分を確認し、割り込んだ後はブレーキをかけないようにしてください。
- id: 765
  category: driver_responsibility
  question: 大型トラックと乗用車が関与する衝突事故において、死亡者の何パーセントが乗用車の乗員ですか？
  choices:
    A: 25パーセント
    B: 50パーセント
    C: 78パーセント
    D: 95パーセント
  answer: C
  explanation: 大型トラックが関与する衝突事故では、死亡者の78パーセントが乗用車の乗員（通常は運転者）です。
- id: 766
  category: defensive_driving
  question: 大型トラックの前方の死角が、モーターサイクル運転者にとって特に危険なのはなぜですか？
  choices:
    A: モーターサイクルはトラックよりも加速がはるかに遅いため。
    B: モーターサイクルはトラックよりもはるかに素早く停止できるが、トラックは間に合わない可能性があるため。
    C: トラックのヘッドライトでモーターサイクル運転者の目がくらむため。
    D: トラックの排気ガスがモーターサイクル運転者に悪影響を与えるため。
  answer: B
  explanation: 急停止が必要な場合、前方の死角は特に危険です。モーターサイクルはその軽さとブレーキシステムにより、トラックよりもはるかに素早く停止できます。トラックはあなたと同じようには素早く止まれないかもしれません。
- id: 767
  category: sharing_the_road
  question: 自転車に乗っている子供がドライバーにとって特別な問題を引き起こすのはなぜですか？
  choices:
    A: 交通状況を判断するための適切な判断力が備わっていないため。
    B: 常に制限速度を超えて走行するため。
    C: 道路の左側を走行することが義務付けられているため。
    D: 理解しにくい手信号を使うため。
  answer: A
  explanation: 子供には交通状況を判断するための適切な判断力が備わっていません。そのため、自転車に乗った子供がいる場合、ドライバーは不安定な動きや突然の方向転換の可能性に注意を払う必要があります。
- id: 768
  category: sharing_the_road
  question: ドライバーが道路上のモーターサイクル運転者を見落としがちなのはなぜですか？
  choices:
    A: モーターサイクルが道路に溶け込むような色で塗装されているため。
    B: ドライバーは他の乗用車やトラックを探す傾向があり、モーターサイクルの細いシルエットは見えにくいため。
    C: モーターサイクルは通常、制限速度以下で走行しているため。
    D: モーターサイクル運転者は日中にヘッドライトを点灯する義務がないため。
  answer: B
  explanation: ドライバーは他の乗用車やトラックを探す傾向があり、モーターサイクルを探していません。モーターサイクルはシルエットが細く車体も短いため、見えにくく、ドライバーがその距離や速度を予測するのを難しくさせています。
- id: 769
  category: defensive_driving
  question: 夜間に自転車が見えにくくなる主な要因は何ですか？
  choices:
    A: 反射板の使用が禁止されているため。
    B: 夜間は車線の真ん中だけを走行するため。
    C: 対向車のライトによって、さらに見えにくくなることがあるため。
    D: 日中よりも夜間の方がはるかに速く走行するため。
  answer: C
  explanation: 夜間に走行する自転車は、ドライバーにとって視認性の問題を引き起こします。対向車のライトによって、夜間はさらに見えにくくなることがあります。
- id: 770
  category: sharing_the_road
  question: マニュアルによると、時速55マイル（55 MPH）で走行しているトラックが停止するのにかかる距離は、乗用車と比較してどのくらいですか？
  choices:
    A: トラックは乗用車と同じ240フィートで停止する。
    B: トラックが停止するには約300フィートかかる。
    C: トラックが停止するには約450フィート以上かかる。
    D: トラックが停止するには600フィート以上かかる。
  answer: C
  explanation: 時速55マイル（55 MPH）で走行している乗用車は240フィートで停止できますが、同じ時速55マイルで走行しているトラックが停止するには約450フィート以上かかります。
- id: 771
  category: sharing_the_road
  question: 大型トラックの死角に関して覚えておくべき重要な目安は何ですか？
  choices:
    A: トラックから50フィート以内にいる場合、あなたは死角に入っています。
    B: トラックのミラーにトラックの運転手の姿が見えない場合、運転手からもあなたの姿は見えていません。
    C: トラックの死角は右側だけにあります。
    D: 運転手に自分が死角にいることを知らせるために、クラクションを鳴らしてください。
  answer: B
  explanation: マニュアルには「トラックのミラーにトラックの運転手の姿が見えない場合、運転手からもあなたの姿は見えていない」と記載されています。
- id: 772
  category: defensive_driving
  question: トラックが右左折しようとしているときに、大型トラックと縁石の間に入り込もうとするのが危険なのはなぜですか？
  choices:
    A: トラックが急加速して、あなたの車両に衝突する可能性があるため。
    B: トラックは右折を安全に行うために左側に大きく膨らんで曲がることが多く、危険な「挟み込み（スクイーズ）」現象を引き起こすため。
    C: トラックの排気ガスが縁石に向けられ、視界が遮られる可能性があるため。
    D: いかなる状況においても、トラックを右側から追い越すことは違法であるため。
  answer: B
  explanation: トラックの運転手は、右折を安全に行うために左側に大きく膨らんで曲がる必要がある場合があります。トラックと縁石の間に入り込むと、「挟み込み」に遭い、衝突事故につながる可能性が高まります。
- id: 773
  category: vehicle_information
  question: 一般的な満載状態のトラクター・トレーラー連結車両の重量は、最大でどのくらいになりますか？
  choices:
    A: 40,000ポンド
    B: 60,000ポンド
    C: 80,000ポンド
    D: 100,000ポンド
  answer: C
  explanation: 一般的なトラクター・トレーラー（トラクター・ユニットによって牽引される積載状態のセミトレーラー）の重量は、最大80,000ポンド（約40トン）に達することがあります。
- id: 774
  category: defensive_driving
  question: 上り坂でトラックの後ろに停車した場合、どうすべきですか？
  choices:
    A: 車線内の右側に寄り、クラクションを鳴らす。
    B: 運転手から見えるように車線内の左側に寄り、十分な車間距離を空ける。
    C: トラックの後退を防ぐため、できるだけトラックのバンパーに近づけて停車する。
    D: ギアをニュートラルに入れ、パーキングブレーキをかける。
  answer: B
  explanation: 上り坂でトラックの後ろに停車した場合は、運転手から見えるように車線内の左側に寄ってください。トラックが後退した場合に備えて、車の前方に余分なスペースを空けておきましょう。
- id: 775
  category: sharing_the_road
  question: トラックを追い越した後、トラックの運転手がヘッドライトを点滅させた場合、それは何を意味しますか？
  choices:
    A: 前方に警察官や危険があることを警告している。
    B: トラックの前方に車線変更して戻っても安全であることを合図している。
    C: 追い越しの際の車間距離が近すぎたことに怒っている。
    D: ヘッドライトが故障しているため、速度を上げるべきである。
  answer: B
  explanation: 追い越した後にトラックやバスの運転手がヘッドライトを点滅させた場合、それはその車両の前方に安全に戻れることを示す合図です。
- id: 776
  category: vehicle_information
  question: 大型トラックの死角は、後方にどのくらいの距離まで及びますか？
  choices:
    A: 最大50フィート
    B: 最大100フィート
    C: 最大150フィート
    D: 最大200フィート
  answer: D
  explanation: トラックの死角は、車両の直前、両側面、そして後方最大200フィートにまで及びます。
- id: 777
  category: vehicle_information
  question: トラクターのボンネットが長い場合、運転手はバンパーの前方何フィートまでが見えない可能性がありますか？
  choices:
    A: 5〜10フィート
    B: 10〜20フィート
    C: 20〜30フィート
    D: 30〜40フィート
  answer: B
  explanation: トラクターのボンネットが長い場合、運転手はバンパーの直前10〜20フィートが見えないことがあります。これは、オートバイや乗用車が気づかれずに危険な位置に入り込むのに十分な距離です。
- id: 778
  category: sharing_the_road
  question: 商用車用検問所（計量所）の近くを走行する際、どうすべきですか？
  choices:
    A: できるだけ早く検問所を通過するために加速する。
    B: 低速のトラックが本線にスムーズに合流できるように、右車線の走行を避ける。
    C: トラックにぴったりついて行くために右車線に移動する。
    D: 合流してくるトラックに自分の存在を知らせるために、ハイビームを点滅させる。
  answer: B
  explanation: 商用車用検問所の近くでは、低速のトラックが道路に合流しやすくなるよう、右車線の走行を避けてください。
- id: 779
  category: safe_driving_rules
  question: 夜間、大型トラックの近くを走行する際にヘッドライトを減光（ロービームに）することが重要なのはなぜですか？
  choices:
    A: 明るい光は車両のバッテリーを早く消耗させるため。
    B: トラックのミラーに反射した明るい光が、運転手の目をくらませる可能性があるため。
    C: トラックの運転手は光に敏感な暗視ゴーグルを使用しているため。
    D: トラックの運転手が道路の白線をよりよく見えるようにするため。
  answer: B
  explanation: 夜間はライトを減光してください。ミラーに反射した明るい光は、運転手の目をくらませる恐れがあります。
- id: 780
  category: defensive_driving
  question: 接近してくる大型トラックやバスの速度を決して過小評価してはいけないのはなぜですか？
  choices:
    A: 彼らは常に制限速度を超えて走行しているため。
    B: 車体が大きいため、実際の速度よりも遅く走っているように見えることが多いため。
    C: 静かに加速できる特殊なエンジンを搭載しているため。
    D: 彼らの速度計は最大10 MPHの誤差があることが多いため。
  answer: B
  explanation: 接近してくるトラックやバスの大きさと速度を決して過小評価しないでください。車体が大きいため、実際よりも遅い速度で走行しているように見えることがよくあります。
- id: 781
  category: driver_responsibility
  question: マニュアルによると、特に大型トラックとの衝突事故において、命を守るためにできる最も重要なことは何ですか？
  choices:
    A: 衝撃を避けるために溝にハンドルを切る。
    B: シートベルトを着用する。
    C: 衝突前に継続的にクラクションを鳴らす。
    D: ハンドルをしっかりと握って身構える。
  answer: B
  explanation: シートベルトの着用は、特に大型トラックとの衝突において、命を守るためにできる最も重要なことです。ハンドルにぶつかったり、車内で振り回されたり、車外に放り出されたりするのを防ぎます。
- id: 782
  category: sharing_the_road
  question: 下り坂で大型トラックを追い越す際、どのようなことを予測すべきですか？
  choices:
    A: トラックはエンジンブレーキにより速度が落ちる可能性が高い。
    B: トラックはその重量により速度が上がるため、追い越すために速度を上げる必要があるかもしれない。
    C: トラックは追い越させるために路肩に寄る。
    D: トラックの運転手は低速を維持するために非常ブレーキをかける。
  answer: B
  explanation: トラックはその重量のため、下り坂では速度が上がります。そのため、下り坂でトラックを追い越す際には速度を上げる必要がある場合があります。
- id: 783
  category: defensive_driving
  question: なぜトラックやバスの直後を走るのを避け、適切な車間距離を保つべきなのですか？
  choices:
    A: 有害な排気ガスを吸い込まないようにするため。
    B: 道路の視界を良くして問題を予測し、緊急時の「逃げ道」を確保するため。
    C: テネシー州では商用車の直後を走る（ドラフティング）ことが違法だから。
    D: トラックのタイヤがフロントガラスに石を跳ね上げるのを防ぐため。
  answer: B
  explanation: 前方の大型車両との間には適切な車間距離を保ってください。これにより、道路の視界が良くなり問題を予測できるようになるとともに、緊急時の「逃げ道」を確保する余裕が生まれます。
- id: 784
  category: sharing_the_road
  question: 下り坂でトラックを追い越す際、最も安全な行動は何ですか？
  choices:
    A: 追い越す前にトラックの速度に合わせて減速する。
    B: できるだけ素早く追い越しを完了し、その速度を維持する。
    C: トラックが加速するのを防ぐために、トラックの横に並んで走行する。
    D: トラックを追い越した後、すぐにブレーキをかけて速度を調整する。
  answer: B
  explanation: トラックはその重量のため、下り坂では速度が上がります。追い越しはできるだけ素早く完了させ、トラックの横に並び続けないようにし、追い越し後は減速せずに速度を維持してください。
- id: 785
  category: sharing_the_road
  question: 反対方向から来るトラックやバスとすれ違う際、風の乱気流は車両にどのような影響を与えますか？
  choices:
    A: 車両同士を吸い寄せる。
    B: 車両同士を押し離す。
    C: 小さい方の車両をトラックの下に引き込む。
    D: 車両には何の影響も与えない。
  answer: B
  explanation: 反対方向から来るトラックやバスとすれ違う際、車両間の風の乱気流は車両同士を「押し離し」ます。吸い寄せるわけではありません。
- id: 786
  category: sharing_the_road
  question: 右折しようとしているトラックの右側の空いたスペースに入り込むのを避けるべきなのはなぜですか？
  choices:
    A: トラックの運転手がそのスペースにバックしようとしているから。
    B: トラックがこぼれる可能性のある危険物を積んでいるかもしれないから。
    C: トラックの運転手から見えず、車が押しつぶされたり側面をこすられたりする可能性があるから。
    D: トラックが右折中に急加速するから。
  answer: C
  explanation: トラックは大きく右折するため、右側にスペースを空けることがよくあります。トラックと縁石の間にいると、運転手から見えないことがあり、トレーラーによって車が押しつぶされたり側面をこすられたりする危険があります。
- id: 787
  category: safe_driving_rules
  question: 緊急避難所（ランナウェイ・トラック・ランプ）の目的は何ですか？
  choices:
    A: 疲れた商用車ドライバーに休憩場所を提供するため。
    B: トラックが安全に荷物の積み下ろしを行えるようにするため。
    C: 急な下り坂で制御不能になったトラックやバスを停止させるため。
    D: 高速道路に入る前にトラックの重量を量るため。
  answer: C
  explanation: 緊急避難所（ランナウェイ・トラック・ランプ）は、急な下り坂で制御不能になったトラックやバスを停止させるために設計されています。これらの場所で車両を停止させたり駐車したりしてはいけません。
- id: 788
  category: sharing_the_road
  question: 大型車両の前方の「ノー・ゾーン（NO-ZONE）」は、トラックの直前およそどのくらいの範囲まで広がっていますか？
  choices:
    A: 10フィート
    B: 20フィート
    C: 50フィート
    D: 100フィート
  answer: B
  explanation: 大型車両の直前およそ20フィートまでのエリアは「ノー・ゾーン」と見なされます。ここで急な割り込みをすると、衝突事故の原因となる可能性があります。
- id: 789
  category: sharing_the_road
  question: 子供たちが「危険地帯（Danger Zone）」に入らないようにするためには、スクールバスから少なくともどのくらい離れている必要がありますか？
  choices:
    A: 5フィート
    B: 10フィート
    C: 15フィート
    D: 20フィート
  answer: B
  explanation: 危険地帯とは、バスの全周囲のうち、子供たちが最も危険にさらされるエリアのことです。子供たちはスクールバスから10フィート離れ、決してバスの後ろに行ってはいけません。
- id: 790
  category: safe_driving_rules
  question: マニュアルによると、スクールバスに関して子供たちが怪我をするリスクが最も高いのはいつですか？
  choices:
    A: 高速道路を走行中のバスの車内にいるとき。
    B: バスが追突事故に巻き込まれたとき。
    C: 乗り降りをするためにバスの外にいるとき。
    D: バスの最前列に座っているとき。
  answer: C
  explanation: スクールバスの安全に関する現実は、車内よりも車外で怪我をする子供の方が多いということです。子供たちが最も危険にさらされるのは、スクールバスに乗り降りする際です。
- id: 791
  category: signs_and_signals
  question: 「低速走行車両」のエンブレムはどのような形をしていますか？
  choices:
    A: 黒い文字が入った黄色のひし形の標識。
    B: 蛍光または反射性のオレンジ色の三角形。
    C: 白い縁取りのある赤い八角形。
    D: 黒いトラクターのシンボルが入った白い長方形。
  answer: B
  explanation: 「低速走行車両」のエンブレムは、蛍光または反射性のオレンジ色の三角形で、動物が引く車両や、ほとんどの農耕車両、建設機械の背面に表示しなければなりません。
- id: 792
  category: sharing_the_road
  question: 農耕機械には通常方向指示器がないため、運転者は右折の準備としてどのような行動をとることがありますか？
  choices:
    A: ヘッドライトを3回点滅させる。
    B: 最初に左側に大きく膨らんでから、右に曲がる。
    C: 完全に停止し、周囲の車に先に行くよう合図する。
    D: 曲がる前に右側の路肩を走行する。
  answer: B
  explanation: 農耕機械には通常方向指示器がないため、右折する際に、運転者はまず左側に大きく膨らんでから右に曲がることがあります。
- id: 793
  category: sharing_the_road
  question: テネシー州の道路における動物が引く車両（馬車など）について、正しいものはどれですか？
  choices:
    A: 舗装されていない田舎道でのみ許可されている。
    B: すべての自動車に優先権を譲らなければならない。
    C: 自動車と同じ道路使用権を持っている。
    D: 標準的な交通規則に従う必要はない。
  answer: C
  explanation: 動物が引く車両は、自動車と同じ道路使用権を持っており、同じ交通規則に従わなければなりません。
- id: 794
  category: defensive_driving
  question: 急な坂道でトラックの後ろを走行中、トラックの車輪から煙が出ていたり、速度が非常に速かったりするのに気づいた場合、どうすべきですか？
  choices:
    A: 加速して、すぐにトラックを追い越す。
    B: クラクションを鳴らして運転者に警告する。
    C: 車間距離を空け、追い越しをしない。
    D: 左側の路肩に寄せて停車する。
  answer: C
  explanation: 車輪からの煙や異常な高速走行は、大型車両のブレーキ故障の兆候である可能性があります。このような状況に遭遇した場合は、車間距離を空け、追い越しをしないでください。
- id: 795
  category: sharing_the_road
  question: 危険物を輸送しているトラックのすぐ後ろを走行するのを避けるべきなのはなぜですか？
  choices:
    A: 踏切などで頻繁に停止するため。
    B: 標準的な商用トラックよりもはるかに速く走行するため。
    C: 他のトラックよりも大きな乱気流を発生させるため。
    D: 標準的なブレーキランプが装備されていないため。
  answer: A
  explanation: 危険物を輸送しているトラックは、踏切などで頻繁に停止するため、近づきすぎないようにしてください。
- id: 796
  category: sharing_the_road
  question: トラックやバスに追い越されるとき、どうすべきですか？
  choices:
    A: トラックの死角から抜けるために加速する。
    B: 車線の中央に寄り、速度を維持する。
    C: 車線の端に寄り、速度を少し落とす。
    D: ハイビームを点滅させてトラックの運転者に警告する。
  answer: C
  explanation: トラックに追い越されるときは、車線の端に寄り、速度を少し落とすことで、相手の運転者を助けることができます。トラックやバスに追い越されている間は、絶対に加速しないでください。
- id: 797
  category: safe_driving_rules
  question: 多くの学校制度において、子供たちはスクールバスの危険地帯から逃れるために、どのように動くよう教えられていますか？
  choices:
    A: バスから離れる方向に小さな歩幅で3歩進む。
    B: バスを降りたらすぐに大きな歩幅で5歩進む。
    C: バスの後方に向かって普通の歩幅で10歩進む。
    D: バスの前方に向かって大きな歩幅で2歩進む。
  answer: B
  explanation: 多くの学校制度において、子供たちはバスを降りたらすぐに大きな歩幅で5歩進むことで、危険地帯から逃れるよう教えられています。
- id: 798
  category: sharing_the_road
  question: ほとんどの場合、田舎の幹線道路を走行する大型農耕機械の速度は、時速何マイル（M.P.H.）未満ですか？
  choices:
    A: 15 M.P.H.
    B: 25 M.P.H.
    C: 35 M.P.H.
    D: 45 M.P.H.
  answer: B
  explanation: ほとんどの場合、農耕機械の車両は時速25マイル（25 M.P.H.）未満で走行しています。
- id: 799
  category: sharing_the_road
  question: 乗馬している人に近づいたり追い越したりする際、避けるべきことは何ですか？
  choices:
    A: 速度を落とすこと。
    B: クラクションを鳴らしたり、エンジンを空吹かししたりすること。
    C: 適切な距離を保つこと。
    D: 左側から追い越すこと。
  answer: B
  explanation: マニュアルには、「馬に近づいたり追い越したりする際に、クラクションを鳴らしたり、エンジンを大きく『空吹かし』したりしてはいけません」と記載されています。
- id: 800
  category: vehicle_information
  question: 低速走行車両の通常の速度範囲はどれくらいですか？
  choices:
    A: 時速15〜30マイル (mph)
    B: 時速5〜20マイル (mph)
    C: 時速10〜25マイル (mph)
    D: 時速20〜40マイル (mph)
  answer: B
  explanation: マニュアルによると、「低速走行車両の通常の速度は、時速5〜20マイル（mph）の範囲です」とされています。
- id: 801
  category: safe_driving_rules
  question: 低速車両に灯火が必要な場合、自発光式の赤色灯は通常、後方からどのくらいの距離で見える必要がありますか？
  choices:
    A: 100フィート
    B: 250フィート
    C: 500フィート
    D: 1000フィート
  answer: C
  explanation: マニュアルには、低速車両の後部にある自発光式赤色灯は、通常、後方500フィートから見える必要があると記載されています。
- id: 802
  category: safe_driving_rules
  question: 速度の遅い車両はどの車線を使用すべきですか？
  choices:
    A: 左側の車線
    B: 中央車線
    C: 右側の車線
    D: 一定の速度を維持していればどの車線でもよい
  answer: C
  explanation: マニュアルには、「速度の遅い車両は右側の車線を走行しなければなりません。左側の車線は追い越しおよび右左折用です」と規定されています。
- id: 803
  category: signs_and_signals
  question: 工事区域内のすべての仮設標識の背景色は何色ですか？
  choices:
    A: 黄色
    B: 赤色
    C: オレンジ色
    D: 白色
  answer: C
  explanation: マニュアルには、「工事区域内のすべての仮設標識は、オレンジ色の背景に黒色の文字または記号が使用されている」と記載されています。
- id: 804
  category: penalties_and_points
  question: 制限速度が引き下げられ、作業員がいる工事区域内での速度違反に対する最大罰金額はいくらですか？
  choices:
    A: $100
    B: $250
    C: $500
    D: $1000
  answer: C
  explanation: テネシー州法に基づき、速度制限が引き下げられ作業員がいる工事区域での速度違反は、最大500ドルの罰金が科せられます。
- id: 805
  category: defensive_driving
  question: 時速60マイル（60 M.P.H.）で走行している車は、1秒間にどのくらいの距離を進みますか？
  choices:
    A: 44フィート
    B: 60フィート
    C: 88フィート
    D: 120フィート
  answer: C
  explanation: マニュアルには、「時速60マイルで走行する車は、1秒間に88フィート進む」と記されています。
- id: 806
  category: defensive_driving
  question: 工事区域で最も一般的な事故の種類は何ですか？
  choices:
    A: 正面衝突
    B: 追突事故
    C: 側面接触
    D: 横転
  answer: B
  explanation: マニュアルは、「工事区域での事故のほとんどは追突事故によって引き起こされる」ため、車間距離を詰めすぎないようドライバーに警告しています。
- id: 807
  category: sharing_the_road
  question: 時速55マイルで走行している列車が停止するまでに、どのくらいの距離が必要ですか？
  choices:
    A: 4分の1マイル
    B: 2分の1マイル
    C: 丸1マイル
    D: 2マイル
  answer: C
  explanation: マニュアルによると、「時速55マイルで走行している列車が停止するには、丸1マイルの距離が必要です」。
- id: 808
  category: defensive_driving
  question: 列車との衝突事故で死亡する確率は、乗用車との衝突事故と比較して何倍高いですか？
  choices:
    A: 5倍
    B: 10倍
    C: 20倍
    D: 30倍
  answer: D
  explanation: マニュアルには、「列車との衝突で死亡する確率は、乗用車や大型トラック、バスとの衝突よりも30倍高い」と記載されています。
- id: 809
  category: sharing_the_road
  question: 列車と乗用車の衝突事故のほとんどはどこで発生していますか？
  choices:
    A: 運転者の自宅から25マイル以内
    B: 田舎の標識のない未舗装路
    C: 照明の少ない夜間の場所
    D: 運転者の自宅から100マイル以上離れた場所
  answer: A
  explanation: マニュアルでは、「衝突事故のほとんどは運転者の自宅から25マイル以内で発生しており、これは運転者がそこに線路があることを知っていたことを示唆している...」と説明されています。
- id: 810
  category: sharing_the_road
  question: 乗用車と列車が踏切に近づいている場合、どちらに優先権がありますか？
  choices:
    A: 先に到着した車両
    B: 常に列車に優先権がある
    C: 高速道路の速度で走行している場合は乗用車
    D: 警告灯が点滅している場合のみ列車
  answer: B
  explanation: マニュアルには、「法律で定められているため、ドライバーは常に列車に優先権を譲らなければならない」と明記されています。
- id: 811
  category: sharing_the_road
  question: 工事区域（ワークゾーン）で、作業員が視認性を高めるために通常着用している服の色は何色ですか？
  choices:
    A: 鮮やかなオレンジ色
    B: 鮮やかな黄緑色
    C: 反射材付きの白
    D: ネオンピンク
  answer: B
  explanation: マニュアルには、「これらの工事区域では、作業員の視認性を高めるために、通常、シャツ、ベスト、ヘルメットなどの鮮やかな黄緑色の衣類を着用しています」と記載されています。
- id: 812
  category: sharing_the_road
  question: 乗馬をしている人は、道路を走行する際、どのように位置取るべきですか？
  choices:
    A: 右車線を2列で並んで走行する
    B: 右側の縁石または道路の端の近くを一列で走行する
    C: センターラインの近くを一列で走行する
    D: 対向車に向かって左側の路肩を走行する
  answer: B
  explanation: マニュアルでは、乗馬をする人は「右側の縁石や道路の端の近く、または利用可能な右側の路肩、車道、通路を一列で走行しなければならない」と定められています。
- id: 813
  category: safe_driving_rules
  question: 電気式または機械式の信号装置が設置されている踏切に近づく際、車両を完全に停止させなければならない場所はどこですか？
  choices:
    A: 最寄りのレールから100フィート以内、かつ25フィート以上離れた場所。
    B: 最寄りのレールから50フィート以内、かつ15フィート以上離れた場所。
    C: 最寄りのレールから30フィート以内、かつ10フィート以上離れた場所。
    D: 最寄りのレールからちょうど20フィートの場所。
  answer: B
  explanation: マニュアルには、電気式または機械式の信号装置が設置されている踏切では、運転者は最寄りのレールから50フィート以内、かつ15フィート以上離れた場所で車両を完全に停止させなければならないと記載されています。
- id: 814
  category: defensive_driving
  question: 踏切内で車両が立ち往生し、列車が近づいてきた場合、降車した後はどの方向に走るべきですか？
  choices:
    A: 列車が進んでいるのと同じ方向。
    B: 線路から90度の角度で直角に離れる方向。
    C: 列車に向かって45度の角度の方向。
    D: 線路と平行に、列車の進行方向とは逆の方向。
  answer: C
  explanation: マニュアルによると、列車が接近している場合は、衝突地点から離れ、かつ衝突後の破片を避けるために、列車に向かって45度の角度で走るべきです。
- id: 815
  category: defensive_driving
  question: 踏切で車両が立ち往生した場合、なぜ接近してくる列車に向かって45度の角度で走るべきなのですか？
  choices:
    A: 列車の機関士に停止の合図を送るため。
    B: 列車の速度をよりよく確認するため。
    C: 緊急通知システム（ENS）の標識に早く到達するため。
    D: 衝突地点から離れ、かつ衝突後の背後に位置することで、飛散する破片による負傷を防ぐため。
  answer: D
  explanation: マニュアルでは、列車に向かって45度の角度で走ることで、衝突地点から離れ、かつその背後に位置することができ、飛散する破片による負傷を防ぐことができると説明されています。
- id: 816
  category: safe_driving_rules
  question: すでに踏切を渡っている最中に、警報灯が点滅し始めたり、遮断機が下がり始めたりした場合はどうすべきですか？
  choices:
    A: すぐに停止してバックする。
    B: そのまま進み、踏切を通り抜ける。
    C: 線路上で車両を停止させ、すぐに降車する。
    D: 車両をリバースに入れ、慎重に線路から下がる。
  answer: B
  explanation: マニュアルには明確に次のように記載されています。「線路を横断中に警報灯が点滅し始めたり、遮断機が下がり始めたりしても、止まってはいけません。そのまま進み続けてください！」
- id: 817
  category: sharing_the_road
  question: 信号が作動しているかどうかにかかわらず、すべての踏切で停止が義務付けられている車両はどれですか？
  choices:
    A: オートバイとモペッド（原動機付自転車）。
    B: 15人乗りバンとレクリエーション車両（RV）。
    C: スクールバス、旅客バス、および危険物を運搬するトラック。
    D: レッカー車と緊急車両。
  answer: C
  explanation: マニュアルには、スクールバス、旅客バス、および危険物を運搬するトラックは、信号が作動しているかどうかにかかわらず、すべての踏切で停止しなければならないと記されています。
- id: 818
  category: signs_and_signals
  question: 踏切にある青色の緊急通知システム（ENS）の標識には、どのような情報が記載されていますか？
  choices:
    A: 列車の運行スケジュールと到着予定時刻。
    B: 踏切を通過する列車の制限速度。
    C: 緊急連絡先番号と運輸省（DOT）の踏切番号。
    D: 次の高速道路の交差点までの距離。
  answer: C
  explanation: マニュアルによると、ENS標識には、車両が線路上で立ち往生した場合に、現在地を特定するための緊急連絡先番号とDOT踏切番号が記載されています。
- id: 819
  category: license_system
  question: テネシー州で15人乗りのバンを運転するために必要な特別な裏書き（エンドースメント）や免許の種類は何ですか？
  choices:
    A: 商業運転免許証（CDL）。
    B: 旅客運送の裏書きがあるクラスD免許。
    C: お抱え運転手（シャウファー）免許。
    D: 特別な裏書きや免許は必要ない。
  answer: D
  explanation: マニュアルには、「テネシー州で15人乗りのバンを運転するために必要な特別な裏書きや免許はありません」と記載されています。
- id: 820
  category: vehicle_information
  question: 15人乗りのバンに荷物を積む際、乗客ができるだけ前方に座るべきなのはなぜですか？
  choices:
    A: 運転手が乗客の声をよりよく聞き取れるようにするため。
    B: 後部座席は後輪車軸より後ろにあり、重心がさらに後方に移動してしまうため。
    C: 重い荷物やラゲッジのために後部座席を空けておくため。
    D: 前部座席の方が優れたエアバッグを装備しているため。
  answer: B
  explanation: マニュアルでは、後部座席が後輪車軸の後ろに位置しているため、重量配分が不均等になり重心がさらに後方に移動してしまうことから、乗客は前の方に座るようアドバイスしています。
- id: 821
  category: vehicle_information
  question: 15人乗りバンにおいて、後輪の空気圧不足が主な原因となる危険な問題は何ですか？
  choices:
    A: エンジンのオーバーヒート
    B: ブレーキの故障
    C: トレッド剥離
    D: トランスミッションの滑り
  answer: C
  explanation: マニュアルによると、後輪（特に左後輪）の空気圧不足は、15人乗りバンのトレッド剥離の主な原因となります。
- id: 822
  category: vehicle_information
  question: レクリエーショナル・ビークル（RV）において、ハンドリングを向上させ、適切な重心を維持するために、重量はどのように配分すべきですか？
  choices:
    A: 屋根に近く、主に右側に寄せる。
    B: 地面に近く、両側に均等に配分する。
    C: 車両の後方にすべてまとめる。
    D: 主に運転席近くの前方に寄せる。
  answer: B
  explanation: マニュアルには、重量を地面に近く、両側に均等に配分することで重心が低く保たれ、RVのハンドリングが向上すると記載されています。
- id: 823
  category: sharing_the_road
  question: レクリエーショナル・ビークル（RV）の死角、または「ノー・ゾーン（No-Zones）」に関して、正しいものはどれですか？
  choices:
    A: ミラーを正しく調整すれば、RVに死角は存在しない。
    B: RVのミラーを使えば、運転者は道路上のすべてを見ることができる。
    C: RVには大きな死角があり、ミラーだけでは運転者がすべてを確認することはできない。
    D: RVの右側だけに死角がある。
  answer: C
  explanation: マニュアルでは、RVは大型で多くの死角があり、ミラーは重要であるものの、運転者が道路上のすべてを確認できるわけではないと警告しています。
- id: 824
  category: defensive_driving
  question: 15人乗りバンのタイヤが路肩に脱輪した場合、横転を避けて復帰するための最も安全な方法は何ですか？
  choices:
    A: 急ブレーキをかけ、ハンドルを道路側に急に切る。
    B: ハンドルを切る前に加速してトラクションを回復させる。
    C: 徐々に減速し、安全を確認してから道路上にハンドルを切って戻る。
    D: ニュートラルに入れ、完全に停止するまで惰性で走行する。
  answer: C
  explanation: マニュアルでは、バンのタイヤが路肩に脱輪した場合は、横転を避けるために徐々に減速し、安全を確認してから道路上に戻るよう助言しています。
- id: 825
  category: safe_driving_rules
  question: 遮断機が降りている踏切で待機している際、線路を渡ることが合法的かつ安全になるのはいつですか？
  choices:
    A: 遮断機がまだ降りていても、列車が通過したらすぐ。
    B: 遮断機が上がり始め、列車が見えなくなったとき。
    C: 遮断機が完全に上がり、警報灯の点滅が止まった後のみ。
    D: 他の列車が来ていないことがはっきりと確認できたときはいつでも。
  answer: C
  explanation: マニュアルには、「遮断機が完全に上がり、警報灯の点滅が止まるまで、線路を渡ってはならない」と記載されています。
- id: 826
  category: defensive_driving
  question: 複数の線路がある踏切で列車の通過を待つ際、横断する前に何をすべきですか？
  choices:
    A: 最初の列車が踏切を通過したらすぐに進む。
    B: 反対方向から別の列車が近づいていないか確認する。
    C: 素早く渡るために、前の車にぴったりとついて行く。
    D: 対向する列車に知らせるためにクラクションを鳴らす。
  answer: B
  explanation: マニュアルでは、線路が複数ある場所で列車の通過を待つ運転者は、横断する前に反対方向から別の列車が近づいていないか確認しなければならないと警告しています。
- id: 827
  category: vehicle_information
  question: レクリエーショナル・ビークル（RV）の運転者が、前方の車両との間に十分な車間距離を空けなければならないのはなぜですか？
  choices:
    A: RVは乗用車よりも重く、停止距離が長くなるため。
    B: RVは停止距離が短く、他車に追突する可能性があるため。
    C: RVは幅が広く、車線変更により多くのスペースが必要なため。
    D: RVが乗用車に接近して走行することは違法であるため。
  answer: A
  explanation: マニュアルには、RVはトラックと同様に乗用車よりも重く、停止距離が長くなるため、運転者は常にRVと前方車両との間に十分な距離を保たなければならないと記載されています。
- id: 828
  category: safe_driving_rules
  question: レクリエーショナル・ビークル（RV）の同乗者のシートベルトに関する規則は何ですか？
  choices:
    A: 運転者と助手席の同乗者のみが着用しなければならない。
    B: 同乗者は州間高速道路を走行する場合のみ着用する必要がある。
    C: 車両が動いている間は、すべての同乗者がシートベルトを着用しなければならない。
    D: RVが時速30マイル未満で走行している場合、シートベルトの着用は任意である。
  answer: C
  explanation: 車両が動いている間は、RVのすべての同乗者にシートベルトを着用させてください。シートベルトを締めていない同乗者は、事故や急停車の際に投げ出され、深刻な怪我を負う可能性があります。
- id: 829
  category: license_system
  question: テネシー州では、18歳未満の人が路上試験を受ける前に、学習許可証（ラーナーパーミット）を最低どれくらいの期間保持する必要がありますか？
  choices:
    A: 90日間
    B: 180日間
    C: 6ヶ月間
    D: 1年間
  answer: B
  explanation: 18歳未満の人は、路上試験を受ける前に、学習許可証を180日間保持し、GDL（段階的運転免許制度）プログラムの要件を満たす必要があります。
- id: 830
  category: driver_responsibility
  question: マニュアルによると、新しい運転者の安全運転に対して、親や指導者ができる最大の貢献は何ですか？
  choices:
    A: 高度な安全機能を備えた車両を購入すること。
    B: 忍耐、礼儀、安全運転の習慣を通じて手本を示すこと。
    C: ティーンエイジャーを高度な防衛運転講習に参加させること。
    D: 日中の時間帯のみに限定して運転させること。
  answer: B
  explanation: 新しい運転者の安全と運転技術に対する最大の貢献は、あなた自身が手本を示すことです。忍耐、礼儀、そして向上心を持つことが最善の資産となります。
- id: 831
  category: defensive_driving
  question: 自分が運転している最中に、新しいドライバーに教えるための推奨されるテクニックは次のうちどれですか？
  choices:
    A: できるだけ多くの情報を一度に与える。
    B: 自分が行っている運転上の判断について、声に出して説明する。
    C: 集中力を試すために、大音量で音楽を流す。
    D: 気を散らさずに観察できるよう、完全に沈黙を守る。
  answer: B
  explanation: 運転中にできる役立つことの一つは、声に出して話すことです。ハンドルを握っている間の教育の機会を活用しましょう。例えば、車間距離を測るためにどのような手順を踏んでいるかを声に出して説明することなどが挙げられます。
- id: 832
  category: driver_testing
  question: 練習セッション中にあてもなく車を走らせることが推奨されないのはなぜですか？
  choices:
    A: 燃料を浪費しすぎるため。
    B: 初心者が初期段階でトラブルに巻き込まれると危険な場合があるため。
    C: GDL（段階的運転免許制度）で定められた必要運転時間にカウントされないため。
    D: 車両に不必要な摩耗や損傷を与えるため。
  answer: B
  explanation: 練習セッション中にあてもなく運転することは危険を伴う場合があります。特に初期段階の初心者ドライバーは、非常に簡単にトラブルに陥りやすいためです。
- id: 833
  category: driver_testing
  question: 新しいドライバーの最初の「フェーズ1（第一段階）」の練習セッションに理想的な場所はどこですか？
  choices:
    A: 静かな住宅街
    B: 高速の多車線道路
    C: 誰もいない広い駐車場
    D: 交通量の多い市街地の交差点
  answer: C
  explanation: 誰もいない広い駐車場は、初心者が操作感や車の反応に完全に集中できるため、最初のセッションには理想的です。
- id: 834
  category: driver_testing
  question: 静かな住宅街での「フェーズ2（第二段階）」の練習運転中に、新しく導入すべきスキルはどれですか？
  choices:
    A: 縦列駐車
    B: 適切な車線位置の維持と、安全な（2秒間の）車間距離の確保
    C: Uターンと急停車
    D: 悪天候下での運転
  answer: B
  explanation: フェーズ2では、ドライバーを静かな住宅街に連れて行き、交通流への合流、適切な車線位置の維持、安全な（2秒間の）車間距離の確保、および緩やかな車線変更を練習します。
- id: 835
  category: driver_testing
  question: 練習運転のどの段階で、新しいドライバーは縦列駐車や複数車線のある交差点の通過を学び始めるべきですか？
  choices:
    A: フェーズ1
    B: フェーズ2
    C: フェーズ3
    D: フェーズ4
  answer: C
  explanation: フェーズ3では、より激しい交通量、縦列駐車、坂道での駐車、複数車線のある交差点、およびUターンや急停車を導入します。
- id: 836
  category: driver_testing
  question: 練習運転のフェーズ4で導入される条件は次のうちどれですか？
  choices:
    A: 座席とミラーの調整
    B: 後退（バック）と前進
    C: 緩やかな車線変更
    D: 晴天および悪天候時の夜間運転
  answer: D
  explanation: フェーズ4では、高速の多車線道路、さまざまな気象条件、夜間、および市街地や交通量の多いエリアでの運転を練習するように指導します。
- id: 837
  category: driver_responsibility
  question: 練習セッション中に新しいドライバーが重大なミスを犯した場合、推奨される対応は何ですか？
  choices:
    A: ミスの深刻さを理解させるため、すぐに怒鳴る。
    B: できるだけ早く停車し、記憶が新しいうちに何が起きたかを話し合う。
    C: 自信を損なわないよう、完全に無視する。
    D: 翌日まで待ち、正式な場でその話題を持ち出す。
  answer: B
  explanation: 「停車して話し合う」ことが重要です。重大なミスが新しいドライバーの記憶に新しいうちに、できるだけ早く停車してください。その後、何が起きたのか、そして最も安全な対応はどうあるべきだったかを時間をかけて話し合います。
- id: 838
  category: license_system
  question: テネシー州の段階的運転免許制度（GDL）プログラムでは、未成年者が中級免許（Intermediate license）を取得する資格を得る前に、何時間の運転を完了する必要がありますか？
  choices:
    A: 30時間
    B: 40時間
    C: 50時間
    D: 60時間
  answer: C
  explanation: テネシー州のGDLプログラムでは、未成年者が中級免許レベルに昇格する資格を得る前に、特定の時間数（50時間）の運転を行うことが義務付けられています。
- id: 839
  category: safe_driving_rules
  question: マニュアルによると、16歳の男性ドライバーのうち、運転開始から1年以内に衝突事故を起こす割合はどれくらいですか？
  choices:
    A: 3人に1人
    B: 5人に1人
    C: 10人に1人
    D: 20人に1人
  answer: B
  explanation: 経験不足とスキルの欠如が重なり、16歳の男性ドライバーの5人に1人、16歳の女性ドライバーの約10人に1人が、運転開始から1年以内に衝突事故を起こします。
- id: 840
  category: defensive_driving
  question: 若くて新しいドライバーにとって、最悪の事故のいくつかはどのような条件下で発生しますか？
  choices:
    A: 朝の通学時間帯
    B: 夜間で、車内に若者のグループが同乗しているとき
    C: 誰もいない駐車場で一人で運転しているとき
    D: 親の監督下で練習セッションを行っているとき
  answer: B
  explanation: 最悪の事故のいくつかは、夜間で、車内に若者のグループが同乗しているときに発生しています。これが、テネシー州のGDLプログラムが新しいティーンエイジャーのドライバーに対して、これら2つの分野に制限を設けている理由の一つです。
- id: 841
  category: driver_responsibility
  question: 新しいドライバーに教える際、なぜ一貫した用語（例：「アクセル」と言い換えずに常に「アクセルペダル」と言うなど）を使うことが重要なのですか？
  choices:
    A: ドライバーが筆記試験に合格するのに役立つため。
    B: 明確なコミュニケーションを確保し、初心者の混乱を避けるため。
    C: GDLプログラムの下での法的要件であるため。
    D: 車両のエンストを防ぐため。
  answer: B
  explanation: 明確に伝える：指示は十分余裕を持って出し、新しいドライバーを混乱させないよう、常に同じ用語を使うようにしてください（例えば、ある時はアクセラレーターと言い、次はアクセルペダル（gas
    pedal）と言うようなことは避けてください）。
- id: 842
  category: driver_responsibility
  question: ティーンエイジャーが中級運転免許（Intermediate Driver License）を申請する際、親子間の運転合意書に含めるべき推奨事項は次のうちどれですか？
  choices:
    A: 試験官が通るルート
    B: 駐車違反切符や車両の損傷に対する責任
    C: 実技試験を回避する方法
    D: ティーンが正式な免許を取得する正確な日付
  answer: B
  explanation: マニュアルでは、親子間の合意書に含めるべき項目として、運転時間やメンテナンスのほか、駐車違反切符や車両の損傷に対する責任などが挙げられています。
- id: 843
  category: safe_driving_rules
  question: マニュアルによると、初心者ドライバーの最大の敵とされるものは何ですか？
  choices:
    A: 夜間の運転
    B: 運転の基本を習得し始めた初期の成功から生じる油断
    C: 州間高速道路の激しい渋滞
    D: 厳しい試験官
  answer: B
  explanation: マニュアルには、「初心者ドライバーの最大の敵は、運転の基本を習得し始めた初期の成功から生じる油断（complacency）である」と記載されています。
- id: 844
  category: driver_testing
  question: 英語を話さない申請者が路上試験を受ける前に、どのようなことが求められますか？
  choices:
    A: 英語の読み書きに堪能であること
    B: 認定通訳者を車に同乗させること
    C: 試験官と安全に意思疎通ができる程度の英語を理解し、話せること
    D: 母国語で試験を受けること
  answer: C
  explanation: マニュアルには、路上試験を実施する前に、すべての申請者が試験官と安全に意思疎通ができる程度の英語を理解し、話せなければならないと明記されています。
- id: 845
  category: driver_testing
  question: 運転免許試験中、試験官が申請者と一緒に運転に費やす時間はおよそどのくらいですか？
  choices:
    A: 30分未満
    B: ちょうど1時間
    C: 少なくとも45分
    D: 2時間以上
  answer: A
  explanation: マニュアルは保護者に対し、「運転免許試験官がお子様と一緒に運転する時間は30分未満である」と注意を促しています。
- id: 846
  category: driver_responsibility
  question: マニュアルは、ティーンエイジャーが運転免許証を取得した後、保護者が何を行うことを強く勧めていますか？
  choices:
    A: 車への同乗をやめる
    B: ティーンの運転パフォーマンスの監視を継続する
    C: 制限なしにどこへでも運転することを許可する
    D: 車両のすべてのメンテナンス費用をすぐにティーンに支払わせる
  answer: B
  explanation: マニュアルでは、「運転免許証が交付された後も、ティーンの運転パフォーマンスを監視し続けることが賢明である」とアドバイスしています。
- id: 847
  category: defensive_driving
  question: マニュアルによると、優れた防衛運転者（ディフェンシブ・ドライバー）であるということは何を意味しますか？
  choices:
    A: 日中の時間帯のみ運転すること
    B: 自分の運転経験のみに頼ること
    C: 単に注意深いだけでなく、優れた運転技術を身につける努力をすること
    D: 常に制限速度以下で運転すること
  answer: C
  explanation: 本文には、「優れた防衛運転者であるということは、単に注意深いという以上のことを意味します。また、単なる経験だけでも不十分です。優れた防衛運転者は、優れた運転技術を身につける努力をしなければなりません」と記されています。
- id: 848
  category: license_system
  question: マニュアルの概要によると、セクションAには次のどの情報が含まれていますか？
  choices:
    A: 防衛運転のヒント
    B: 交通標識と信号
    C: 免許申請に必要な書類
    D: 州の運転法律と罰則
  answer: C
  explanation: マニュアルでは、セクションAに免許の種類、申請に必要な書類、18歳未満の申請者向けの情報、および必要な試験の説明が含まれていることが概説されています。
- id: 849
  category: signs_and_signals
  question: 交通標識、信号、および道路交通法規を扱っているのは、総合マニュアルのどのセクションですか？
  choices:
    A: セクションA
    B: セクションB
    C: セクションC
    D: 付録
  answer: B
  explanation: マニュアルの目次によると、セクションBには「優れた運転習慣」、「道路交通法規」、「交通標識と信号」、「州の運転法律と罰則」が含まれています。
- id: 850
  category: sharing_the_road
  question: 道路の安全な共有や、ティーンの運転習得の支援に関する情報は、マニュアルのどこに記載されていますか？
  choices:
    A: セクションA
    B: セクションB
    C: セクションC
    D: 用語集
  answer: C
  explanation: マニュアルのセクションCでは、「安全に関するヒント」、「防衛運転」、「道路の安全な共有」、「ティーンや新しいドライバーの運転習得の支援」について扱っています。
- id: 851
  category: driver_testing
  question: 英語を話さない初心者の運転練習をサポートする際、指導者は試験官の役割になり、運転者に以下のどの練習をさせるべきですか？
  choices:
    A: 英語での簡単な指示に従うこと
    B: 運転マニュアル全体を翻訳すること
    C: 言葉によるコミュニケーションを一切取らずに運転すること
    D: 試験官のルートを暗記すること
  answer: A
  explanation: マニュアルでは、指導者に対して「試験官の役割になり、運転者に英語での簡単な指示（例：『Turn left（左折）』、『Slow down（減速）』）に従う練習をさせてください」とアドバイスしています。
- id: 852
  category: license_system
  question: 運転免許センター（Driver Service Centers）が通常、混雑するのはいつですか？
  choices:
    A: 火曜日の早朝
    B: 祝日明けの営業再開時
    C: 月の最終週
    D: 雨が降っている時
  answer: B
  explanation: マニュアルには、「運転免許センターは通常、祝日明けの営業再開時に利用者が増加するため、それに合わせて訪問を計画してください」と記載されています。
- id: 853
  category: license_system
  question: テネシー州の運転免許証をオンラインで更新できる資格があるかどうか、どのように確認できますか？
  choices:
    A: www.tn.gov/safety にアクセスする
    B: 試験官に手紙を郵送する
    C: 新たに路上試験を受ける
    D: 地元の警察署を訪問する
  answer: A
  explanation: マニュアルには、「オンライン更新の資格があるかどうかを確認するために、当局のウェブサイト（www.tn.gov/safety）の利用を検討してください」と記載されています。
- id: 854
  category: safe_driving_rules
  question: マニュアルによると、安全運転において非常に重要なことは何ですか？
  choices:
    A: 最新の車両安全機能を備えていること
    B: 見るべきものを見て、適切な判断を下すこと
    C: すべての州道を暗記すること
    D: 慣れた場所だけを運転すること
  answer: B
  explanation: 本文では、「安全運転とは、見るべきものを見て適切な判断を下すことに他なりませんが、これを達成するのは簡単なことではありません」と説明されています。
- id: 855
  category: driver_responsibility
  question: ティーンエイジャー（10代の若者）と運転に関する合意書や「契約書」を作成する際、保護者は：
  choices:
    A: 公証された写しを運転免許センターに提出しなければならない
    B: 教習所の指導員に署名をもらわなければならない
    C: 書面にして署名するか、単に家族で話し合うかを選択できる
    D: 法律により、常に車両内に保管しておくことが義務付けられている
  answer: C
  explanation: マニュアルには、「この『契約書』を書面にして署名するか、単に家族で話し合うだけにするかは、あなた次第です……」と記載されています。
- id: 856
  category: driver_responsibility
  question: 運転免許試験官は運転者の能力を評価することはできますが、子供に運転を教育し教える責任は誰にありますか？
  choices:
    A: 安全局（Department of Safety）
    B: 高校の運転教育の教師
    C: 保護者または関係する指導者
    D: 州議会
  answer: C
  explanation: マニュアルでは、「運転免許試験官は運転者の能力を評価することはできますが、その子供に運転を教育し教える責任は、保護者または関係する指導者にあります」と強調されています。
- image: stop.png
  category: signs_and_signals
  id: 857
  question: この標識は何を意味していますか？
  choices:
    A: 減速して注意深く進む
    B: 一時停止（完全に停止）する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前で完全に停止しなければならないことを意味します。進む前に、交通状況と歩行者を確認してください。
- image: yield.png
  category: signs_and_signals
  id: 858
  question: この標識がある場合、何をしなければなりませんか？
  choices:
    A: 完全に停止する
    B: 加速して交通の流れに合流する
    C: 減速し、他の車両や歩行者に道を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速して他の車両や歩行者に優先権（right-of-way）を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
- image: wrong_way.png
  category: signs_and_signals
  id: 859
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意深く運転を続ける
    C: 停止してバックするか、向きを変える（逆走しているため）
    D: 加速してそのエリアを素早く離れる
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止/逆走）」標識は、一方通行の道路や高速道路のランプを逆走していることを意味します。直ちに安全に停止し、向きを変えるかバックしてください。
- image: one_way_left.png
  category: signs_and_signals
  id: 860
  question: この標識は何を示していますか？
  choices:
    A: 左折専用
    B: 車両は一方の方向（左方向）にのみ流れている
    C: 中央分離帯の左側を走行すること
    D: 左側に高速道路の出口がある
  answer: B
  explanation: 矢印が描かれた白黒の「ONE WAY（一方通行）」標識は、その通りの交通が矢印の指す一方向にのみ進むことを示しています。
- image: no_u_turn.png
  category: signs_and_signals
  question: この標識は何を禁止していますか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 追い越し
  answer: C
  explanation: 斜線の引かれたUターン矢印が描かれた白い規制標識は、その場所での転回（Uターン）が禁止されていることを意味します。
  id: 861
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: 転回（Uターン）
    D: 直進
  answer: B
  explanation: 斜線の引かれた左折矢印が描かれた白い規制標識は、その交差点での左折が許可されていないことを意味します。
  id: 862
- image: keep_right.png
  category: signs_and_signals
  question: この標識は運転者に何を指示していますか？
  choices:
    A: 右側に合流する
    B: 右折専用
    C: 分離帯や障害物の右側を通行する
    D: この先で右車線が終了する
  answer: C
  explanation: 矢印が描かれた白い「KEEP RIGHT（右側通行）」の規制標識は、交通島、中央分離帯、または障害物の右側を通行しなければならないことを意味します。
  id: 863
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。制限速度の標識は、理想的な条件下においてその区域で法的に許容される最高速度を示しています。
  id: 864
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色のひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やサファリパークがある
    B: この区域ではシカが頻繁に道路を横断する
    C: この先は狩猟区域である
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色のひし形の標識は、この区域でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 865
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: スクールゾーンまたは通学路の横断歩道
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、スクールゾーンまたは通学路の横断歩道を示しています。速度を落とし、子供に注意してください。
  id: 866
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: この標識は通常どこで見かけますか？
  choices:
    A: 通学路の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型のクロスバック（十字型）標識は踏切に設置されます。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、停止しなければなりません。
  id: 867
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角を示す
    B: より大幅な減速が必要な急カーブを警告する
    C: 右折専用を意味する
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（より角度のついた矢印）は、通常のカーブ標識よりも急な曲がり角を示しています。この曲がり角の手前では、より大幅に速度を落とす必要があります。
  id: 868
- image: reverse_curve.png
  category: signs_and_signals
  question: この標識はどのような道路状況を警告していますか？
  choices:
    A: 屈曲路（ワインディングロード）
    B: この先に1つのカーブがある
    C: 反対方向への2つの連続したカーブ
    D: この先にラウンドアバウトがある
  answer: C
  explanation: 背向（はいこう）カーブの標識は、この先に反対方向への2つのカーブがあることを警告しています。速度を落とし、道路が最初に一方へ、次に反対側へ曲がることに備えてください。
  id: 869
- image: winding_road.png
  category: signs_and_signals
  question: この標識は何を予測するよう警告していますか？
  choices:
    A: 1つの急カーブ
    B: 滑りやすい路面
    C: この先に連続するカーブや曲がり角がある
    D: この先に坂道がある
  answer: C
  explanation: 屈曲路（ワインディングロード）の標識は、この先に連続するカーブや曲がり角があることを警告しています。速度を落とし、道路状況の変化に注意してください。
  id: 870
- image: merge.png
  category: signs_and_signals
  question: この標識は何に備えるよう伝えていますか？
  choices:
    A: 車線の減少
    B: 他の道路からの交通の合流
    C: 分離道路（中央分離帯のある道路）の開始
    D: 道路が1車線に狭まること
  answer: B
  explanation: 黄色のひし形の合流標識は、他の道路からの交通が自分の車線に合流してくることを警告しています。速度や位置を調整する準備をしてください。
  id: 871
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 行き止まり
    B: 対面通行
    C: 分離道路（中央分離帯のある道路）の開始
    D: 高速道路の出口
  answer: C
  explanation: この標識は、この先の道路が中央分離帯や障壁によって反対方向の交通が分離された「分離道路」になることを警告しています。右側を走行してください。
  id: 872
- image: stop_ahead.png
  category: signs_and_signals
  question: この標識はこの先に何があることを伝えていますか？
  choices:
    A: 「譲れ（Yield）」の標識
    B: 交通信号機
    C: 一時停止しなければならない「止まれ」の標識
    D: スピードバンプ（段差）
  answer: C
  explanation: この標識はこの先に一時停止の標識があることを警告しています。減速を開始し、一時停止の標識で完全に停止できるよう準備してください。
  id: 873
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分未満であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある乗客を乗せているすべての運転手
  answer: C
  explanation: 車椅子のシンボルが描かれた青色の標識は、障害者のために予約された駐車スペースであることを示しています。有効な障害者用駐車許可証（プラカード）またはライセンスプレートを掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 874
