    C: 条件付き合格証
    D: 保護観察証明書
  answer: B
  explanation: マニュアルの運転資格の喪失に関するセクションでは、「制限付き運転免許証（Restricted Driver License）」について説明されています。
- id: 82
  category: penalties_and_points
  question: 交通違反の召喚状（チケット）に対応しなかった場合、運転記録にどのような影響がありますか？
