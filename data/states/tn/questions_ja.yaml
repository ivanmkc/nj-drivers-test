    D: 車両が直ちに押収される
  answer: C
  explanation: 「呼出状への不応答 (Failure to Satisfy a Citation)」は、走行中の交通違反や衝突事故に対する点数を詳述するセクションに記載されています。
- id: 83
  category: driver_testing
  question: 身体的または精神的な障害を持つ運転者に対して、どのような措置が取られる可能性がありますか？
  choices:
    A: 免許の即時かつ永久的な取り消し
    B: 運転者の再試験
    C: 義務的な車両の改造
    D: 昼間の運転のみへの制限
  answer: B
  explanation: マニュアルには、「身体的または精神的な障害」に特に関連する「運転者の再試験 (Re-Examination of Drivers)」に関するセクションが含まれています。
- id: 84
  category: driver_responsibility
  question: 交通事故に巻き込まれた場合、最初に行うべき最も重要なルールは何ですか？
  choices:
    A: 保険会社に電話する
    B: 車両を路肩に移動させる
    C: 停止する！ (STOP!)
    D: 損傷の写真を撮る
  answer: C
  explanation: マニュアルには、「衝突事故に巻き込まれた場合 – 停止する！ (If You Are Involved in a Crash – STOP!)」というルールが明記されています。
- id: 85
  category: defensive_driving
  question: 防衛運転と安全な道路の共有において、重要な2つの要素は何ですか？
  choices:
    A: 速度と攻撃性
    B: 集中力と注意力
    C: リラックスとマルチタスク
    D: 自信と優先権の主張
  answer: B
  explanation: マニュアルには、安全運転において「集中力と注意力は重要な要素である (Concentration and Alertness are
    Important Elements)」と記載されています。
- id: 86
  category: defensive_driving
  question: 防衛的な反応に備えるために、運転者はどのようなテクニックを使用すべきですか？
  choices:
    A: 真前の車両を凝視する
    B: 道路と交通状況をスキャン（確認）する
    C: バックミラーのみに頼る
    D: ダッシュボードに目を向け続ける
  answer: B
  explanation: マニュアルでは、重要な防衛運転の戦略として「防衛的な反応のための道路と交通状況のスキャン (Scanning the Road and
    Traffic for Defensive Reactions)」を強調しています。
- id: 87
  category: defensive_driving
  question: 防衛運転の章で、安全運転のヒントと共に特に取り上げられている危険な行動は何ですか？
  choices:
    A: 煽り運転（車間距離の不保持）
    B: ロードレイジ（路上での暴力・報復行動）
    C: 公道レース
    D: ブレーキチェック（故意の急ブレーキ）
  answer: B
  explanation: 「ロードレイジ (Road Rage)」は、第1章セクションCの防衛運転と共に特に取り上げられています。
- id: 88
  category: alcohol_drugs_health
  question: アルコールによって悪影響を受けると記載されている認知機能は、次のうちどれですか？
  choices:
    A: 判断力
    B: 記憶の想起
    C: 数学的な計算
    D: 空間認識能力
  answer: A
  explanation: マニュアルの「アルコールが運転能力に与える影響」の項目に、「判断力 (Judgment)」が明記されています。
- id: 89
  category: license_system
  question: 通常のクラスD運転免許証で運転できる車両の最大重量はどれくらいですか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 26,000ポンド
    D: 36,000ポンド
  answer: C
  explanation: クラスD免許は、危険物 (hazmat) の輸送、16人以上の乗客の輸送、またはスクールバスとしての使用がない限り、最大重量26,000ポンドまでの車両を運転するために必要です。
- id: 90
  category: license_system
  question: テネシー州に引っ越し、他州の有効な運転免許証を持っている場合、同州にどれ以上の期間居住するならテネシー州の運転免許証を申請しなければなりませんか？
  choices:
    A: 10日
    B: 30日
    C: 60日
    D: 90日
  answer: B
  explanation: テネシー州に引っ越し、他州または他国の有効な運転免許証を持っている人は、テネシー州に30日を超えて居住する場合、テネシー州の運転免許証を申請しなければなりません。
- id: 91
  category: license_system
  question: テネシー州において、クラスHの運転免許証は何のために使用されますか？
  choices:
    A: 危険物を積載した車両の運転
    B: 14歳から16歳までの運転者向けのハードシップ免許（特別な事情による免許）
    C: 26,000ポンドを超える大型トラックの運転
    D: タクシー運転手向けの旅客輸送（For-Hire）免状
  answer: B
  explanation: 免許クラスの表によると、クラスH免許は、特別な事情（ハードシップ）がある14歳から16歳までの運転者向けに発行されるハードシップ免許です。
- id: 92
  category: license_system
  question: 重量26,000ポンド以下の次の車両のうち、運転にクラスCの商用免許が必要なものはどれですか？
  choices:
    A: 10人乗りの標準的な乗用バン
    B: 危険物標識を掲示した車両
    C: 個人用のキャンピングカー（RV）
    D: 小型ボートを牽引するピックアップトラック
  answer: B
  explanation: 車両総重量定格（GVWR）が26,000ポンド以下の車両であっても、危険物標識を掲示している場合、16人以上乗りの設計である場合、またはスクールバスとして使用される場合は、クラスC免許が必要です。
- id: 93
  category: license_system
  question: テネシー州で仮免許（instructional permit）として発行される免許のクラスはどれですか？
  choices:
    A: クラスP
    B: クラスI
    C: クラスM
    D: クラスF
  answer: A
  explanation: クラスP免許は、クラスA、B、C、D、およびM免許の仮免許（instructional permit）として発行されます。
- id: 94
  category: license_system
  question: 通常の乗用車を使用してタクシーやシャトルサービスを運転することが主な仕事である場合、クラスD免許にどの免状（endorsement）を追加する必要がありますか？
  choices:
    A: P（乗客）免状
    B: S（スクールバス）免状
    C: F（旅客輸送/For-Hire）免状
    D: H（危険物）免状
  answer: C
  explanation: クラスDの車両で人を運転または輸送することが主な仕事である場合（タクシーやシャトルサービスの運転手など）、クラスD免許に旅客輸送（For-Hire：F）免状を追加する必要があります。
- id: 95
  category: license_system
  question: テネシー州で標準的なクラスD運転免許証を取得するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: C
  explanation: クラスD免許を取得するには、16歳以上であり、視力検査、学科試験、および技能試験に合格する必要があります。
- id: 96
  category: license_system
  question: クラスM免許で運転できるのはどのような種類の車両ですか？
  choices:
    A: モーターホームおよびキャンピングカー（RV）
    B: オートバイおよび原動機付自転車
    C: 中型商用トラック
    D: マニュアルトランスミッション車
  answer: B
  explanation: 免許クラスの表には、オートバイおよび原動機付自転車を運転するにはクラスM免許が必要であると規定されています。
- id: 97
  category: license_system
  question: 商用免許の「X」特別免状（endorsement）は何を表していますか？
  choices:
    A: ダブル/トリプルトレーラー
    B: スクールバス
    C: タンクおよび危険物
    D: 16人以上乗りの設計
  answer: C
  explanation: 免状（Endorsements）の表によると、「X」免状はタンクおよび危険物（Haz Mat）を表しています。
- id: 98
  category: license_system
  question: 州外の免許証を持ってテネシー州に引っ越してきた人は、次の場合にテネシー州の免許証を申請しなければなりません：
  choices:
    A: 2週間の休暇で滞在している場合
    B: テネシー州で働いている場合
    C: レンタカーを運転している場合
    D: 州内を3回以上通過して運転した場合
  answer: B
  explanation: テネシー州に引っ越してきた人は、テネシー州に30日以上居住する場合、テネシー州で働いている場合、またはテネシー州の登録有権者としての資格を満たす場合、テネシー州の運転免許証を申請しなければなりません。
- id: 99
  category: license_system
  question: 26,000ポンド未満の車両であっても、車両が次の場合、標準のクラスD免許では運転できません：
  choices:
    A: 運転手を含めて16人以上の乗客を輸送するために使用される場合
    B: 個人の農業に使用されるピックアップトラックの場合
    C: 12人を乗せた乗用バンの場合
    D: 小型ユーティリティトレーラーを牽引している場合
  answer: A
  explanation: 26,000ポンド未満の車両であっても、運転手を含めて16人以上の乗客を輸送する場合、危険物を輸送する場合、またはスクールバスとして使用される場合は、クラスD免許で運転することはできません。
- id: 100
  category: license_system
  question: 連結車両総重量定格（GCWR）が26,000ポンドを超え、牽引される車両が10,000ポンドを超える商用連結車両に必要な免許のクラスはどれですか？
  choices:
    A: クラスA
    B: クラスB
    C: クラスC
    D: クラスD
  answer: A
  explanation: 商業目的で使用される、GCWRが26,000ポンドを超え、牽引される車両が10,000ポンドを超える連結車両には、クラスA免許が必要です。
- id: 101
  category: driver_testing
  question: 16歳以上であることに加え、クラスD免許の資格を得るために申請者が合格しなければならない試験は何ですか？
  choices:
    A: 技能試験（運転試験）のみ
    B: 視力検査、学科試験、および技能試験
    C: 健康診断と技能試験
    D: 身元調査と学科試験
  answer: B
  explanation: クラスD免許の資格を得るには、16歳以上であり、視力検査、学科試験、および技能試験に合格する必要があります。
- id: 102
  category: license_system
  question: 二連または三連トレーラーの商用車を運転するために必要なエンドースメント（条件追加）はどれですか？
  choices:
    A: エンドースメントN
    B: エンドースメントH
    C: エンドースメントT
    D: エンドースメントP
  answer: C
  explanation: エンドースメントの表には、二連/三連トレーラーに必要なエンドースメントとして「T」が記載されています。
- id: 103
  category: license_system
  question: クラスBの商用免許では、車両総重量定格（GVWR）が26,000ポンドを超えるトラックまたはバスを運転できますが、牽引される車両の条件は次のうちどれですか？
  choices:
    A: GVWRが10,000ポンドを超えないこと
    B: GVWRが10,000ポンドを超えること
    C: 危険物の標識が掲示されていること
    D: 二連または三連トレーラーであること
  answer: A
  explanation: クラスB免許は、商業目的で使用されるGVWRが26,000ポンドを超えるトラックまたはバス、およびGVWRが10,000ポンド以下の車両を牽引する当該車両を対象としています。
- id: 104
  category: license_system
  question: 次の職業のうち、通常、クラスD免許に「For-Hire（旅客・貨物運送）」エンドースメントが必要なものはどれですか？
  choices:
    A: 配管工
    B: 検針員
    C: タクシー運転手
    D: エンジニア
  answer: C
  explanation: 業務上「For-Hire」エンドースメントを必要とする人の例には、タクシー運転手、シャトルバスの運転手、宅配業者が含まれます。配管工、検針員、エンジニアは通常、このエンドースメントを必要としません。
- id: 105
  category: license_system
  question: クラスD免許に「For-Hire」エンドースメントを追加するには、申請者は通常18歳以上であり、制限のない運転経験がどのくらい必要ですか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: 申請者は、制限のない運転経験が2年あれば、「For-Hire」エンドースメントを申請する資格があります。
- id: 106
  category: license_system
  question: クラスM限定免許（Class M limited license）は、排気量がどの範囲のオートバイまたは原動機付自転車に必要ですか？
  choices:
    A: 125cc（立方センチメートル）を超える
    B: 125cc（立方センチメートル）未満
    C: ちょうど250cc（立方センチメートル）
    D: 500cc（立方センチメートル）を超える
  answer: B
  explanation: 一般的に、車両の排気量が125ccを超える場合はクラスM免許が必要であり、125cc未満の場合はクラスM限定免許が必要です。
- id: 107
  category: safe_driving_rules
  question: 全地形対応車（ATV）がテネシー州の幹線道路や州間高速道路を合法的に横断するにはどうすればよいですか？
  choices:
    A: 交通に合流し、次のランプで降りる
    B: 90度の角度で横断する
    C: 45度の角度で横断する
    D: いかなる状況でもATVが道路を横断することは許可されていない
  answer: B
  explanation: 法律上、「オフロード」自動車または全地形対応車（ATV）は、90度の角度でのみ道路を横断することができ、道路・幹線道路・州間高速道路を直接横断（走行）してはなりません。
- id: 108
  category: license_system
  question: 少なくともどのくらいの重量の車両または連結車両を運転する場合に、商用運転免許（CDL）が必要ですか？
  choices:
    A: 10,001ポンド
    B: 15,000ポンド
    C: 20,001ポンド
    D: 26,001ポンド
  answer: D
  explanation: 重量26,001ポンド以上の大型で複雑な車両の運転者は、商用運転免許（CDL）を申請する必要があります。
- id: 109
  category: license_system
  question: 小型車両の運転手であっても、車両が以下のものを輸送するために使用される場合、商用運転免許（CDL）を取得する必要があります：
  choices:
    A: 8人以上の乗客
    B: 10人以上の乗客
    C: 12人以上の乗客
    D: 運転手を含めて16人以上の乗客
  answer: D
  explanation: 小型車両であっても、危険物の輸送、運転手を含めて16人以上の乗客の輸送、またはスクールバスとして使用される場合は、CDLが必要です。
- id: 110
  category: driver_responsibility
  question: クラスPD（仮免許）を持つ運転手は、少なくとも何歳の免許所持者が同乗している場合にのみ自動車を運転できますか？
  choices:
    A: 18歳
    B: 19歳
    C: 21歳
    D: 25歳
  answer: C
  explanation: クラスPD免許を持つ運転手は、21歳以上の免許所持者が運転手の隣の席に同乗している場合にのみ自動車を運転することができます。
- id: 111
  category: license_system
  question: 18歳未満の場合、クラスPD免許をクラスD免許に切り替える前に、有効なクラスPD免許をどのくらいの期間保持しなければなりませんか？
  choices:
