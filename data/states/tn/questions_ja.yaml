questions:
- id: 1
  category: license_system
  question: テネシー州運転免許センター（Driver Service Centers）の通常の営業時間は何時から何時までですか？
  choices:
    A: 午前8時～午後4時30分
    B: 午前8時30分～午後5時
    C: 午前9時～午後5時
    D: 午前8時30分～午後6時
  answer: B
  explanation: マニュアルによると、運転免許センターの通常の営業時間は午前8時30分から午後5時までで、州の公式な祝日は休業となります。
- id: 2
  category: license_system
  question: テネシー州の仮運転免許証（interim driver license）の有効期間はどのくらいですか？
  choices:
    A: 最大10日間
    B: 最大15日間
    C: 最大20日間
    D: 最大30日間
  answer: C
  explanation: マニュアルには、仮免許証の有効期間は最大20日間であり、正式な運転免許証または身分証明書（ID）は申請者の住所に郵送されると記載されています。
- id: 3
  category: license_system
  question: 仮免許証の表面にある情報は、どのようにして確認（検証）できますか？
  choices:
    A: 2Dバーコードを読み取る
    B: 磁気ストライプを確認する
    C: RFIDチップをスキャンする
    D: 運転免許センターに電話する
  answer: A
  explanation: マニュアルには、仮免許証の表面にある情報は2Dバーコードを読み取ることで確認できると記載されています。
- id: 4
  category: license_system
  question: アメリカ国内で民間航空機に搭乗する際、REAL IDまたはその他の有効な身分証明書の提示が義務付けられるのはいつからですか？
  choices:
    A: 2023年5月7日
    B: 2024年5月7日
    C: 2025年5月7日
    D: 2026年5月7日
  answer: C
  explanation: マニュアルには、2025年5月7日以降、アメリカ国内で民間航空機に搭乗するすべての人は、REAL ID免許証または有効期限内の米国パスポートを所持していなければならないと記載されています。
- id: 5
  category: license_system
  question: 次のうち、REAL IDに準拠した身分証明書が必要な活動はどれですか？
  choices:
    A: 自動車の運転
    B: 州の選挙での投票
    C: 連邦裁判所の建物への立ち入り
    D: 原子力施設への立ち入り
  answer: D
  explanation: REAL IDは、軍事基地、連邦政府の建物、原子力施設など、特定の連邦施設に立ち入る際に必要です。運転、投票、連邦裁判所への立ち入りには必要ありません。
- id: 6
  category: license_system
  question: 次のうち、REAL IDに準拠した身分証明書を必要と「しない」ものはどれですか？
  choices:
    A: 国内の民間航空機への搭乗
    B: 郵便局の利用
    C: 軍事基地への立ち入り
    D: セキュリティの厳しい連邦政府の建物への立ち入り
  answer: B
  explanation: マニュアルには、REAL IDに準拠した身分証明書を必要としない活動として「郵便局の利用」が明記されています。
- id: 7
  category: license_system
  question: REAL IDに準拠した身分証明書と、準拠していないテネシー州の運転免許証の取得費用の違いは何ですか？
  choices:
    A: REAL IDの方が10ドル高い。
    B: REAL IDの方が2倍の費用がかかる。
    C: 費用に違いはない。
    D: 準拠していないIDは無料である。
  answer: C
  explanation: マニュアルには、「REAL IDに準拠した身分証明書と、準拠していないテネシー州の運転免許証またはIDの取得費用に違いはない」と記載されています。
- id: 8
  category: driver_responsibility
  question: 次のうち、注意散漫な運転（distracted driving）の形態とみなされるものはどれですか？
  choices:
    A: 認知的注意散漫
    B: 視覚的注意散漫
    C: 操作的注意散漫
    D: 上記すべて
  answer: D
  explanation: マニュアルでは、注意散漫な運転にはさまざまな形態があると説明されています。「認知的、視覚的、または操作的なものがあり、これら3つすべてが組み合わさることもあります…」
- id: 9
  category: safe_driving_rules
  question: テキストメッセージの送信や閲覧により、最低でも何秒間道路から目を離すことになりますか？
  choices:
    A: 2秒
    B: 3秒
    C: 5秒
    D: 10秒
  answer: C
  explanation: マニュアルによると、テキストメッセージの送信や閲覧により、最低でも5秒間道路から目を離すことになります。
- id: 10
  category: defensive_driving
  question: 時速55マイル（55 mph）で走行中に5秒間テキストメッセージを読むことは、目を閉じたままどのくらいの距離を運転することに相当しますか？
  choices:
    A: バスケットボールコート1面分
    B: アメリカンフットボールのフィールド1面分
    C: 野球の内野（ダイヤモンド）1周分
    D: 市街地の1区画分
  answer: B
  explanation: マニュアルには、「時速55マイルでの走行中であれば、それは目を閉じたままアメリカンフットボールのフィールド1面分の距離を運転するのと同じことである」と記載されています。
- id: 11
  category: driver_responsibility
  question: テネシー州の統合交通分析ネットワーク（Titan）によると、テネシー州では脇見運転（注意散漫な運転）による交通事故はどのくらいの頻度で発生していますか？
  choices:
    A: 10分5秒に1回
    B: 15分30秒に1回
    C: 26分13秒に1回
    D: 45分20秒に1回
  answer: C
  explanation: Titanによると、テネシー州では脇見運転による交通事故が26分13秒に1回の頻度で発生しています。
- id: 12
  category: safe_driving_rules
  question: テネシー州の2019年ハンズフリー法において、運転手にとって違法となる行為は次のうちどれですか？
  choices:
    A: 携帯電話に触れずに音声起動のGPSシステムを使用すること
    B: 身体のいずれかの部分で携帯電話を保持すること
    C: 車内の同乗者と話すこと
    D: 車に内蔵されているラジオを聴くこと
  answer: B
  explanation: 公法第412号（Public Chapter No. 412）によると、運転手が「身体のいずれかの部分で携帯電話やモバイル端末を保持すること」は違法です。
- id: 13
  category: safe_driving_rules
  question: ハンズフリー法では、運転手がどのような状態になる必要がある場合、携帯電話に手を伸ばすことを禁止していますか？
  choices:
    A: 片手をハンドルから離す
    B: 1秒以上道路から目を離す
    C: 座った運転姿勢を保てなくなる、またはシートベルトで適切に固定されていない状態になる
    D: 音声コマンドを声に出して言う
  answer: C
  explanation: 法律では、「運転手が座った運転姿勢を保てなくなる、またはシートベルトで適切に固定されていない状態になるような方法で、携帯電話やモバイル端末に手を伸ばすこと」を違法としています。
- id: 14
  category: safe_driving_rules
  question: 運転中にGPSの操作や調整のために携帯電話に触れる必要がある場合、どうしなければなりませんか？
  choices:
    A: 赤信号で停車するまで待つ
    B: 同乗者にハンドルを握ってもらう
    C: 時速15マイル（約24km/h）以下に減速する
    D: 駐車場などの安全に車を停められる場所を見つける
  answer: D
  explanation: マニュアルには、「GPSを使用するために携帯電話に触れることは許可されていません。GPSの操作や携帯電話を使用する必要がある場合は、駐車場などの安全に車を停められる場所を見つけなければなりません…」と記載されています。
- id: 15
  category: license_system
  question: テネシー州では、18歳未満の人でもREAL ID（リアルID）に準拠した身分証明書を取得できますか？
  choices:
    A: いいえ、18歳以上である必要があります。
    B: いいえ、21歳以上である必要があります。
    C: はい、取得可能であり、成人の身分証明書保持者と同じ手続きに従います。
    D: はい、ただし海外へ渡航する場合に限られます。
  answer: C
  explanation: マニュアルには、「18歳未満の人は、成人の身分証明書保持者と同じ手続きに従うことで、REAL IDに準拠した運転免許証またはID（身分証明書）を取得することができます」と記載されています。
- id: 16
  category: safe_driving_rules
  question: マニュアルによると、運転中に携帯電話のGPSを使用する正しい方法は何ですか？
  choices:
    A: ルートを調整するために、素早く携帯電話に触れてもよい。
    B: 安全に車を停められる場所を見つけ、車を完全に停止させてから操作しなければならない。
    C: 片手をハンドルに置いている限り、使用できる。
    D: 赤信号で停車している間にのみ使用できる。
  answer: B
  explanation: マニュアルには次のように記載されています。「GPSの操作や携帯電話を使用する必要がある場合は、駐車場などの安全に車を停められる場所を見つけ、車を完全に停止させてから携帯電話やGPS機器を操作しなければなりません。」
- id: 17
  category: safe_driving_rules
  question: テネシー州では、運転中に携帯電話で動画を撮影することは合法ですか？
  choices:
    A: はい、携帯電話がダッシュボードに固定されていれば合法です。
    B: はい、ただしソーシャルメディアの目的でのみ合法です。
    C: いいえ、運転中の動画撮影は法律違反です。
    D: いいえ、交通事故を録画している場合を除き違法です。
  answer: C
  explanation: マニュアルには明確に次のように記載されています。「運転中に動画を撮影することは非常に危険であり、法律違反です。」
- id: 18
  category: safe_driving_rules
  question: ドライブのためのGPSナビゲーションはいつ設定すべきですか？
  choices:
    A: 高速道路に合流している時
    B: 運転を始める前
    C: 最初の信号で停車している時
    D: 時速30マイル（約48km/h）未満で走行している時ならいつでも
  answer: B
  explanation: マニュアルでは、「運転を始める前にナビゲーションを設定する必要があります」と述べ、運転手に事前の計画を立てるようアドバイスしています。
- id: 19
  category: license_system
  question: テネシー州の総合マニュアルのうち、18歳未満の申請者向けの中間運転免許証（Intermediate Driver License）の詳細について説明しているのはどのセクションですか？
  choices:
    A: セクションA
    B: セクションB
    C: セクションC
    D: 目次
  answer: A
  explanation: 序文によると、セクションAでは「中間運転免許証（Intermediate Driver License）の詳細と、18歳未満の運転免許申請者に対してこの段階的運転免許制度（GDL）がどのように機能するか」について説明しています。
- id: 20
  category: driver_testing
  question: マニュアルによると、新規の運転手が運転免許証に必要な知識と技能を学び、準備するのを助けるために作られているのはどのセクションですか？
  choices:
    A: セクションA
    B: セクションB
    C: セクションC
    D: 第2章
  answer: B
  explanation: マニュアルには、「セクションBは…新規の運転手が運転免許証に必要な知識と技能を学び、準備するのを助けるために作られています」と記載されています。
- id: 21
  category: sharing_the_road
  question: マニュアルのどのセクションに、他の交通手段との道路の共有（シェアリング・ザ・ロード）に関する情報が記載されていますか？
  choices:
    A: セクションA
    B: セクションB
    C: セクションC
    D: 第1章
  answer: C
  explanation: はじめに（導入部分）には、セクションCに「公道において特定の権利と特権を持つ他の交通手段との道路の共有に関する情報を提供する…」と記されています。
- id: 22
  category: license_system
  question: テネシー州において、クラスM免許は何を意味しますか？
  choices:
    A: モーターホーム（キャンピングカー）
    B: モペッド（原動機付自転車）
    C: オートバイ（二輪車）
    D: マニュアル車
  answer: C
  explanation: セクションA、第1章の目次には「クラスM（オートバイ）」と記載されています。
- id: 23
  category: license_system
  question: クラスD免許の「F」エンドースメント（追加資格）は何を表していますか？
  choices:
    A: 農業用車両 (Farm Vehicle)
    B: 旅客運送 (For-Hire)
    C: 貨物 (Freight)
    D: 家族 (Family)
  answer: B
  explanation: 目次には「クラスD F付き（旅客運送エンドースメント）」と記載されています。
- id: 24
  category: license_system
  question: 仮免許（Learner Permit）に指定されている免許のクラスはどれですか？
  choices:
    A: クラスLP
    B: クラスL
    C: クラスPD
    D: クラスP
  answer: C
  explanation: 目次には「仮免許（クラスPD）」と記載されています。
- id: 25
  category: license_system
  question: クラスH免許はどのような種類の免許ですか？
  choices:
    A: 大型商用 (Heavy Commercial)
    B: 高速道路 (Highway)
    C: 危険物 (Hazardous Materials)
    D: ハードシップ（特別な事情による制限付き免許）
  answer: D
  explanation: 目次には「クラスH（ハードシップ）」と記載されています。
- id: 26
  category: driver_responsibility
  question: マニュアルに記載されている臓器および組織提供プログラムの名前は何ですか？
  choices:
    A: ドネイト・ライフ・テネシー (Donate Life Tennessee)
    B: テネシー臓器登録 (Tennessee Organ Registry)
    C: ギフト・オブ・ライフTN (Gift of Life TN)
    D: テネシー・ドナー・サービス (Tennessee Donor Services)
  answer: A
  explanation: 目次には「臓器および組織の提供 - ドネイト・ライフ・テネシー (Donate Life Tennessee)」というトピックが記載されています。
- id: 27
  category: driver_responsibility
  question: 運転免許証に関連する有権者登録について、マニュアルで使用されている用語は何ですか？
  choices:
    A: オート・ボート (Auto Vote)
    B: モーター・ボーター (Motor Voter)
    C: ドライブ・トゥ・ボート (Drive to Vote)
    D: ライセンス・レジストレーション (License Registration)
  answer: B
  explanation: 目次には「有権者登録 – モーター・ボーター (Motor Voter)」と記載されています。
- id: 28
  category: license_system
  question: テネシー州の運転マニュアルにおいて、略語「TDL」は何の略ですか？
  choices:
    A: テネシー州運転免許証 (Tennessee Driver License)
    B: 一時運転免許証 (Temporary Driver License)
    C: 交通運転免許証 (Transit Driving License)
    D: 10代向け運転免許証 (Teen Driver License)
  answer: B
  explanation: 目次には「一時運転免許証 (TDL)」と記載されています。
- id: 29
  category: license_system
  question: 運転資格の文脈において、「IDP」は何の略ですか？
  choices:
    A: 身分証明運転許可証 (Identification Driving Permit)
    B: 州間運転特権 (Interstate Driving Privilege)
    C: 国際運転免許証 (International Driving Permit)
    D: 独立運転者プログラム (Independent Driver Program)
  answer: C
  explanation: 目次には「国際運転免許証 (IDP)」と記載されています。
- id: 30
  category: license_system
  question: 免許を申請する際、第2章に記載されている要件は次のうちどれですか？
  choices:
    A: 車両所有の証明
    B: 米国市民権または合法的な永住権の証明
    C: 就労証明
    D: 高校卒業の証明
  answer: B
  explanation: 第2章の目次には、免許申請の要件として「米国市民権または合法的な永住権の証明」が記載されています。
- id: 31
  category: license_system
  question: 18歳未満の運転者が仮免許（Learner Permit）を取得した後、中間免許（Intermediate License）制度の最初の段階は何ですか？
  choices:
    A: 無制限中間免許
    B: 制限付き中間免許
    C: 通常の運転免許証
    D: ハードシップライセンス（特別許可免許）
  answer: B
  explanation: 段階的免許取得制度（Graduated License Procedures）によると、仮免許の次の最初の段階は制限付き中間免許です。
- id: 32
  category: license_system
  question: 18歳未満の運転者を対象とした段階的免許取得制度（Graduated License Procedures）の最終段階は何ですか？
  choices:
    A: 制限付き中間免許
    B: 仮免許
    C: 通常の運転免許証
    D: 無制限中間免許
  answer: C
  explanation: 18歳未満の運転者を対象とした段階的免許取得制度の最終段階は、通常の運転免許証です。
- id: 33
  category: license_system
  question: 未成年者が免許を申請する際、追加で必要となる書類は次のうちどれですか？
  choices:
    A: 車両の所有権証明書
    B: 在学/成績証明書
    C: 有効なパスポート
    D: 有権者登録カード
  answer: B
  explanation: 未成年者の追加書類要件には、未成年者/ティーンエイジャーの宣誓書（Minor/Teenage Affidavits）および在学/成績証明書が含まれます。
- id: 34
  category: safe_driving_rules
  question: 18歳未満の運転者を対象とした段階的免許取得制度において、携帯電話の使用に関する規則はどのようなものですか？
  choices:
    A: ハンズフリー機器を使用する場合のみ許可される
    B: 禁止されている
    C: 日中のみ許可される
    D: GPSナビゲーションの目的でのみ許可される
  answer: B
  explanation: マニュアルには、仮免許または中間免許を所持する18歳未満の運転者の携帯電話の使用は禁止されていると明記されています。
- id: 35
  category: safe_driving_rules
  question: 運転中のテキストメッセージ送信に関するテネシー州の法律はどのようなものですか？
  choices:
    A: 禁止されている
    B: 21歳以上の成人は許可されている
    C: 赤信号での停車中は許可されている
    D: スクールゾーンでのみ禁止されている
  answer: A
  explanation: マニュアルでは、すべての運転者に対する一般的な規則として「運転中のテキストメッセージ送信禁止」が挙げられています。
- id: 36
  category: safe_driving_rules
