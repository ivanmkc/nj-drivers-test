    D: 車両操作ブートキャンプ
  answer: A
  explanation: マニュアルでは、交通違反を繰り返す運転者への処分またはリソースとして「運転者改善プログラム（Driver Improvement Program）」を挙げています。
- id: 81
  category: license_system
  question: 運転資格を失った場合、限定的な運転資格を維持するために、どのような種類の免許を申請できる可能性がありますか？
  choices:
    A: 困窮者用許可証 (Hardship Permit)
