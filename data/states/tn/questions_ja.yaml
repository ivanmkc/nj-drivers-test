    D: 高速道路パトロール監視リスト
  answer: A
  explanation: マニュアルの「運転者の責任」の章で、「問題運転者ポインターシステム (Problem Driver Pointer System)」について言及されています。
- id: 79
  category: penalties_and_points
  question: 居住州外で運転者に発行された交通違反切符に関連する協定は何ですか？
  choices:
