- id: 93
  category: license_system
  question: ¿Qué clase de licencia se emite como permiso de instrucción en Tennessee?
  choices:
    A: Clase P
    B: Clase I
    C: Clase M
    D: Clase F
  answer: A
  explanation: Se emite una licencia Clase P como permiso de instrucción para las
    licencias Clase A, B, C, D y M.
- id: 94
  category: license_system
  question: Si su trabajo principal es conducir un taxi o un servicio de transporte
    (shuttle) utilizando un vehículo de pasajeros regular, ¿qué endoso debe agregarse
    a su licencia Clase D?
  choices:
    A: Endoso P (Pasajeros)
    B: Endoso S (Autobús escolar)
    C: Endoso F (De alquiler/For-Hire)
    D: Endoso H (Materiales peligrosos)
  answer: C
  explanation: Si el trabajo principal de una persona es conducir o transportar personas
    en un vehículo Clase D (como conductores de taxis o servicios de transporte),
    se debe agregar un endoso de Alquiler (F) a la licencia Clase D.
- id: 95
  category: license_system
  question: ¿Cuál de la edad mínima requerida para calificar para una licencia de
    conducir estándar Clase D en Tennessee?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: Para calificar para una licencia Clase D, debe tener al menos 16 años
    de edad y debe aprobar un examen de la vista, un examen de conocimientos y un
    examen de manejo.
- id: 96
  category: license_system
  question: ¿Qué tipo de vehículos se operan bajo una licencia Clase M?
  choices:
    A: Casas rodantes y vehículos recreativos (RV)
    B: Motocicletas y ciclos impulsados por motor
    C: Camiones comerciales de carga media
    D: Vehículos de transmisión manual
  answer: B
  explanation: La tabla de Clases de Licencia especifica que se requiere una licencia
    Clase M para operar motocicletas y ciclos impulsados por motor.
- id: 97
  category: license_system
  question: ¿Qué representa el endoso especial "X" en una licencia comercial?
  choices:
    A: Remolques dobles/triples
    B: Autobús escolar
    C: Tanques y materiales peligrosos (HazMat)
    D: Diseñado para transportar 16 o más pasajeros
  answer: C
  explanation: Según la tabla de Endosos, el endoso "X" significa Tanques y Materiales
    Peligrosos (HazMat).
- id: 98
  category: license_system
  question: 'Una persona que se muda a Tennessee con una licencia de otro estado debe
    solicitar una licencia de Tennessee si:'
  choices:
    A: Está de visita por unas vacaciones de dos semanas
    B: Está trabajando en Tennessee
    C: Está conduciendo un auto de alquiler
    D: Ha conducido por el estado más de tres veces
  answer: B
  explanation: Una persona que se muda a Tennessee debe solicitar una licencia de
    conducir de Tennessee si vive en Tennessee por más de 30 días, trabaja en Tennessee
    o calificaría de otro modo como votante registrado de Tennessee.
- id: 99
  category: license_system
  question: 'No puede operar un vehículo de menos de 26,000 libras con una licencia
    estándar Clase D si el vehículo:'
  choices:
    A: Se utiliza para transportar a 16 o más pasajeros, incluido el conductor
    B: Es una camioneta pick-up utilizada para agricultura personal
    C: Es una camioneta de pasajeros que transporta a 12 personas
    D: Remolca un pequeño remolque utilitario
  answer: A
  explanation: Los vehículos que pesan menos de 26,000 libras no pueden operarse con
    una licencia Clase D si el vehículo transporta a 16 o más pasajeros (incluido
    el conductor), transporta materiales peligrosos o se utiliza como autobús escolar.
- id: 100
  category: license_system
  question: ¿Qué clase de licencia se requiere para vehículos comerciales combinados
    con una Clasificación de Peso Bruto Combinado (GCWR) de más de 26,000 libras y
    un vehículo remolcado de más de 10,000 libras?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: A
  explanation: Se requiere una licencia Clase A para vehículos combinados con un GCWR
    de más de 26,000 libras y vehículo(s) remolcado(s) de más de 10,000 libras utilizados
    para fines comerciales.
- id: 101
  category: driver_testing
  question: Además de tener al menos 16 años de edad, ¿qué exámenes debe aprobar un
    solicitante para calificar para una licencia Clase D?
  choices:
    A: Solo un examen de manejo
    B: Un examen de la vista, un examen de conocimientos y un examen de manejo
    C: Un examen físico y un examen de manejo
    D: Una verificación de antecedentes y un examen de conocimientos
  answer: B
  explanation: Para calificar para una licencia Clase D, debe tener al menos 16 años
    de edad y debe aprobar un examen de la vista, un examen de conocimientos y un
    examen de manejo.
- id: 102
  category: license_system
  question: ¿Qué endoso se requiere para operar un vehículo comercial con remolques
    dobles o triples?
  choices:
    A: Endoso N
    B: Endoso H
    C: Endoso T
    D: Endoso P
  answer: C
  explanation: La tabla de endosos enumera la "T" como el endoso requerido para remolques
    dobles/triples.
- id: 103
  category: license_system
  question: 'Una licencia comercial Clase B le permite operar camiones o autobuses
    de más de 26,000 libras de GVWR (Peso Bruto Vehicular), siempre que cualquier
    vehículo remolcado:'
  choices:
    A: No exceda las 10,000 libras de GVWR
    B: Supere las 10,000 libras de GVWR
    C: Esté señalizado para materiales peligrosos
    D: Sea un remolque doble o triple
  answer: A
  explanation: Una licencia Clase B es para camiones o autobuses de más de 26,000
    libras de GVWR utilizados para fines comerciales, y cualquier vehículo de este
    tipo que remolque un vehículo que no exceda las 10,000 libras de GVWR.
- id: 104
  category: license_system
  question: ¿Cuál de las siguientes profesiones requiere generalmente un endoso de
    "Para Contratación" (For-Hire) en una licencia Clase D?
  choices:
    A: Plomero
    B: Lector de medidores
    C: Taxista
    D: Ingeniero
  answer: C
  explanation: Los ejemplos de personas cuyo trabajo requiere que tengan el endoso
    "For-Hire" incluyen taxistas, conductores de servicios de transporte (shuttle)
    y mensajeros. Los plomeros, lectores de medidores e ingenieros generalmente no
    necesitan este endoso.
- id: 105
  category: license_system
  question: Para agregar un endoso "For-Hire" a una licencia Clase D, un solicitante
    generalmente debe tener al menos 18 años de edad y ¿cuánta experiencia de manejo
    sin restricciones debe tener?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Los solicitantes son elegibles para solicitar el endoso "For-Hire"
    si tienen 2 años de experiencia de manejo sin restricciones.
- id: 106
  category: license_system
  question: 'Se requiere una licencia limitada Clase M para motocicletas o ciclos
    impulsados por motor con una cilindrada:'
  choices:
    A: Superior a 125 centímetros cúbicos
    B: Inferior a 125 centímetros cúbicos
    C: Exactamente de 250 centímetros cúbicos
    D: Superior a 500 centímetros cúbicos
  answer: B
  explanation: Generalmente, si el vehículo supera los 125 centímetros cúbicos, se
    necesita una licencia Clase M; si el vehículo es inferior a 125 centímetros cúbicos,
    se necesita una licencia limitada Clase M.
- id: 107
  category: safe_driving_rules
  question: ¿Cómo pueden los vehículos todo terreno (ATV) cruzar legalmente una carretera
    o vía interestatal de Tennessee?
  choices:
    A: Incorporándose al tráfico y saliendo en la siguiente rampa
    B: Tomando ángulos de noventa grados (90 grados)
    C: Cruzando en un ángulo de cuarenta y cinco grados (45 grados)
    D: Los ATV nunca tienen permitido cruzar ninguna calzada bajo ninguna circunstancia
  answer: B
  explanation: Legalmente, los vehículos motorizados "fuera de carretera" o vehículos
    todo terreno (ATV) solo pueden cruzar las calzadas tomando ángulos de noventa
    grados (90 grados) y no deben cruzar directamente ninguna carretera/vía interestatal.
- id: 108
  category: license_system
  question: 'Se requiere una Licencia de Conducir Comercial (CDL) para los operadores
    de vehículos o combinaciones de vehículos que pesen al menos:'
  choices:
    A: 10,001 libras
    B: 15,000 libras
    C: 20,001 libras
    D: 26,001 libras
  answer: D
  explanation: Los operadores de vehículos más grandes y complejos que pesen 26,001
    libras o más deberán solicitar una Licencia de Conducir Comercial (CDL).
- id: 109
  category: license_system
  question: 'El conductor de un vehículo más pequeño debe obtener una Licencia de
    Conducir Comercial (CDL) si el vehículo se utiliza para transportar:'
  choices:
    A: 8 o más pasajeros
    B: 10 o más pasajeros
    C: 12 o más pasajeros
    D: 16 o más pasajeros, incluido el conductor
  answer: D
  explanation: Los vehículos más pequeños requieren una CDL si se utilizan para transportar
    materiales peligrosos; para transportar dieciséis (16) o más pasajeros, incluido
    el conductor, o si se utilizan como autobús escolar.
- id: 110
  category: driver_responsibility
  question: 'Un conductor con una licencia Clase PD (Permiso de Aprendizaje) puede
    operar un automóvil solo cuando esté acompañado por un conductor con licencia
    que tenga al menos:'
  choices:
    A: 18 años de edad
    B: 19 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: C
  explanation: Un conductor con una licencia Clase PD puede operar un automóvil solo
    cuando esté acompañado por un conductor con licencia que tenga al menos 21 años
    de edad y esté sentado en el asiento al lado del conductor.
- id: 111
  category: license_system
  question: ¿Si es menor de 18 años, cuánto tiempo debe tener una licencia válida
    de Clase PD antes de canjearla por una licencia de Clase D?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Si es menor de 18 años, debe haber tenido una licencia Clase PD válida
    durante 180 días y cumplir con todos los requisitos de la ley de Licencia de Conducir
    Graduada (GDL).
- id: 112
  category: license_system
  question: ¿A qué edad se le puede otorgar a un menor una licencia de Clase H (Dificultad
    Extrema o Hardship) en casos de dificultades familiares?
  choices:
    A: 13 años
    B: 14 años
    C: 15 años
    D: 16 años
  answer: B
  explanation: Se puede otorgar una licencia por dificultad extrema (Clase H) a un
    menor de 14 años para operar un vehículo de pasajeros de Clase D, una motocicleta
    de Clase M o ambos.
- id: 113
  category: license_system
  question: ¿Cuál de las siguientes es una restricción impuesta a una licencia de
    Clase H (Dificultad Extrema)?
  choices:
    A: Es válida solo durante las horas del día
    B: Permite al conductor transportar hasta 3 pasajeros
    C: Es válida para conducir fuera del estado
    D: Permite la operación de vehículos comerciales
  answer: A
  explanation: La licencia Clase H es válida solo durante las horas del día y para
    viajar a los lugares autorizados según se especifica en la carta de aprobación.
- id: 114
  category: license_system
  question: Independientemente de la edad al momento de la aprobación, ¿cuándo vence
    una Licencia por Dificultad Extrema (Clase H)?
  choices:
    A: Cuando el solicitante cumple 15 años
    B: Cuando el solicitante cumple 16 años
    C: Cuando el solicitante cumple 18 años
    D: Cuando el solicitante se gradúa de la escuela secundaria
  answer: B
  explanation: Independientemente de la edad al momento de la aprobación, la Licencia
    por Dificultad Extrema vencerá cuando el solicitante cumpla los 16 años.
- id: 115
  category: license_system
  question: ¿Quién es elegible para recibir una licencia de identificación permanente
    gratuita que no vence?
  choices:
    A: Cualquier persona mayor de 65 años
    B: Cualquier persona con discapacidad mental o física
    C: Cualquier persona menor de 18 años
    D: Cualquier persona que posea una licencia válida de Clase D
  answer: B
  explanation: Cualquier persona con discapacidad mental o física puede obtener una
    'licencia de identificación permanente'. Quienes califiquen para esta identificación
    pueden recibirla de forma gratuita y no tiene fecha de vencimiento.
- id: 116
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir mientras su licencia está revocada, cancelada
    o suspendida?
  choices:
    A: Una multa de hasta $500 y/o 30 días de cárcel
    B: Una multa de hasta $1,000 y/o seis meses de cárcel
    C: Una multa de hasta $2,500 y/o un año de cárcel
    D: Una multa de hasta $5,000 y revocación obligatoria de la licencia de por vida
  answer: B
  explanation: Conducir con una licencia revocada, cancelada o suspendida es un delito
    menor de clase B. La sanción es una multa de hasta mil dólares ($1,000) y/o seis
    meses de cárcel.
- id: 117
  category: license_system
  question: ¿Cuál es la tarifa requerida para agregar un endoso de 'Para Alquiler'
    (For-Hire) a una licencia de Clase D?
  choices:
    A: $2.50
    B: $4.50
    C: $10.00
    D: $15.50
  answer: B
  explanation: Para agregar el endoso 'Para Alquiler' (For-Hire), los conductores
    deben cumplir con los requisitos de elegibilidad, aprobar los exámenes correspondientes
    y pagar una tarifa de $4.50.
- id: 118
  category: license_system
  question: ¿A qué edad deja de vencer una 'Licencia de Identificación con Vencimiento'?
  choices:
    A: '21'
    B: '50'
    C: '60'
    D: '65'
  answer: D
  explanation: 'El primer tipo de identificación es una ''Licencia de Identificación
    con Vencimiento''... NOTA: A los 65 años o más, esta identificación no vence.'
- id: 119
  category: license_system
  question: ¿Cuál de las siguientes personas NO está obligada a tener una licencia
    de conducir de Tennessee?
  choices:
    A: Un residente que conduce un camión comercial
    B: Un operador de un tractor agrícola que se traslada temporalmente por una carretera
    C: Un estudiante de secundaria que conduce solo a la escuela
    D: Un ciudadano no estadounidense que trabaja permanentemente en Tennessee
  answer: B
  explanation: El manual establece que los operadores de cualquier maquinaria vial,
    tractor agrícola u otro equipo agrícola que se opere o traslade temporalmente
    por una carretera no están obligados a tener una licencia de conducir de Tennessee.
- id: 120
  category: license_system
  question: ¿Quién de los siguientes NO es elegible para una licencia de conducir
    de Tennessee?
  choices:
    A: Un joven de 16 años que progresa satisfactoriamente en la escuela
    B: Una persona menor de 18 años que ha abandonado la escuela antes de graduarse
    C: Un no residente con una licencia válida de otro estado
    D: Un veterano dado de baja con honores
  answer: B
  explanation: El manual establece que cualquier persona menor de 18 años que haya
    abandonado la escuela antes de graduarse, o que no logre un 'progreso satisfactorio'
    en la escuela, no es elegible para una licencia.
- id: 121
  category: penalties_and_points
  question: ¿Si lo sorprenden conduciendo sin tener su licencia de conducir en su
    poder, cuál es la multa potencial?
  choices:
    A: No menos de $2.00 y no más de $50.00
    B: No menos de $50.00 y no más de $100.00
    C: Exactamente $500.00
    D: Hasta $1,000.00
  answer: A
  explanation: Conducir sin tener su licencia en su poder es un delito menor de Clase
    D, y se le puede multar con no menos de dos dólares ($2.00) y no más de cincuenta
    dólares ($50.00).
- id: 122
  category: license_system
  question: ¿Qué letra precede a los tipos de clase para una Licencia de Conducir
    Temporal (TDL)?
  choices:
    A: T
    B: N
    C: X
    D: F
  answer: C
  explanation: El manual establece que los tipos de clase de TDL irán precedidos por
    la letra 'X' (por ejemplo, XD, XM, XPD).
- id: 123
  category: license_system
  question: ¿Cuál es el período máximo de tiempo por el cual se puede emitir una Licencia
    de Identificación Temporal (TID)?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 8 años
  answer: C
  explanation: Según el manual, el período máximo de tiempo por el cual se puede emitir
    una Licencia de Identificación Temporal (TID) es de 5 años.
- id: 124
  category: driver_responsibility
  question: ¿A qué edad puede un menor que posee una licencia de conducir, permiso
    o identificación estatal elegir registrarse como donante de órganos en Tennessee?
  choices:
    A: Entre 10 y 12 años
    B: Entre 13 y 17 años
    C: Solo a los 16 años
    D: Los menores no pueden registrarse como donantes de órganos
  answer: B
  explanation: El manual establece que los menores que tienen entre 13 y 17 años de
    edad, y que poseen una licencia de conducir, permiso o identificación estatal,
    pueden elegir registrarse como donantes.
- id: 125
  category: driver_responsibility
  question: Según el registro Donate Life Tennessee, ¿cuántas vidas puede salvar un
    solo donante de órganos?
  choices:
    A: Hasta 2 vidas
    B: Hasta 4 vidas
    C: Hasta 8 vidas
    D: Más de 20 vidas
  answer: C
  explanation: 'El manual establece: ''Un donante de órganos puede salvar hasta 8
    vidas y un donante de tejidos puede mejorar la vida de 75 o más personas''.'
- id: 126
  category: license_system
  question: ¿Qué símbolo se imprime en su licencia de conducir o identificación de
    Tennessee para indicar que es un donante de órganos registrado?
  choices:
    A: Un lazo verde
    B: Un corazón rojo
    C: Una estrella azul
    D: Una cruz médica
  answer: B
  explanation: El manual señala que se imprimirá un corazón rojo en su licencia o
    identificación para reflejar su decisión de ser donante de órganos y tejidos.
- id: 127
  category: license_system
  question: ¿Qué documento se puede utilizar para demostrar la elegibilidad para que
    aparezca 'Veteran' (Veterano) en su licencia de conducir de Tennessee?
  choices:
    A: Un certificado de nacimiento estándar
    B: Un pasaporte estadounidense válido
    C: Formulario DD-214 del Departamento de Defensa
    D: Una tarjeta de registro de votante
  answer: C
  explanation: Para que aparezca 'Veteran' en su licencia, debe presentar una copia
    certificada de su Formulario DD-214 del Departamento de Defensa, el certificado
    de baja honorable NAVPERS-660 o su tarjeta de identificación DD Form 2 (Retirado).
- id: 128
  category: driver_responsibility
  question: ¿Con quién debe comunicarse si no recibe su Tarjeta de Registro de Votante
    dentro de los 30 días posteriores a la solicitud en el Centro de Servicio al Conductor?
  choices:
    A: El Departamento de Seguridad
    B: La Comisión Federal de Elecciones
    C: La Comisión Electoral de su condado local
    D: El Centro de Servicio al Conductor donde realizó la solicitud
  answer: C
  explanation: El manual aconseja que si no ha recibido su Tarjeta de Registro de
    Votante dentro de los 30 días posteriores a la solicitud en el Centro de Servicio
    de Licencias de Conducir, debe comunicarse con la Comisión Electoral de su condado
    local de inmediato.
- id: 129
  category: license_system
  question: ¿Es válido un Permiso Internacional de Conducir (IDP) emitido a un ciudadano
    estadounidense para conducir dentro de los Estados Unidos?
  choices:
    A: Sí, pero solo por 6 meses
    B: Sí, si va acompañado de un pasaporte
    C: No, no es válido para conducir en los Estados Unidos ni en sus territorios
    D: No, a menos que el conductor esté operando un vehículo comercial
  answer: C
  explanation: El manual establece explícitamente que el IDP NO es válido para conducir
    en los Estados Unidos ni en sus territorios.
- id: 130
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso Internacional de Conducir (IDP)
    a partir de la fecha de emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: B
  explanation: El manual establece que el IDP es válido por un (1) año solamente a
    partir de la fecha de emisión.
- id: 131
  category: license_system
  question: ¿Cuánto tiempo puede conducir un ciudadano no estadounidense empleado
    en un puesto gerencial o técnico en Tennessee con una licencia válida de otro
    país antes de que se le exija solicitar una licencia de Tennessee?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Los ciudadanos no estadounidenses en puestos gerenciales o técnicos
    pueden operar vehículos con una licencia de conducir válida emitida por otro estado
    o país por un período de 6 meses, después del cual deben solicitar una licencia
    de Tennessee.
- id: 132
  category: license_system
  question: ¿Cuál de las siguientes condiciones hace que una persona no sea elegible
    para una licencia de conducir de Tennessee?
  choices:
    A: No presentar el comprobante requerido de seguro de automóvil o responsabilidad
      financiera
    B: Ser un ciudadano no estadounidense con presencia legal temporal
    C: Ser un veterano dado de baja honorablemente
    D: Inscribirse en un curso de capacitación para conductores aprobado
  answer: A
  explanation: El manual enumera a "Cualquier persona obligada a mostrar prueba de
    seguro de automóvil/responsabilidad financiera que no lo haya hecho" bajo la sección
    "¿QUIÉN NO ES ELEGIBLE?".
- id: 133
  category: license_system
  question: ¿Qué edad debe tener un ciudadano estadounidense para obtener un Permiso
    Internacional de Conducir (IDP)?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: B
  explanation: Para obtener un Permiso Internacional de Conducir (IDP), un ciudadano
    estadounidense debe tener al menos dieciocho (18) años de edad.
- id: 134
  category: license_system
  question: ¿Dónde puede un residente de Tennessee obtener un Permiso Internacional
    de Conducir (IDP)?
  choices:
    A: Cualquier Centro de Servicios al Conductor de Tennessee
    B: La sede del Departamento de Seguridad
    C: Una oficina local de la Asociación Americana del Automóvil (AAA)
    D: Una oficina de pasaportes de EE. UU.
  answer: C
  explanation: Cualquier residente de Tennessee interesado en obtener un IDP debe
    comunicarse con una oficina local de la Asociación Americana del Automóvil (AAA).
    Los Centros de Servicios al Conductor de Tennessee NO los emiten.
- id: 135
  category: driver_responsibility
  question: 'Si usted es un delincuente sexual registrado que solicita o renueva una
    licencia de conducir, debe:'
  choices:
    A: Informar al examinador de licencias de conducir del Departamento de Seguridad
    B: Solicitar solo por correo
    C: Entregar la licencia de su estado anterior a la policía local
    D: Pagar una tarifa de recargo especial para delincuentes
  answer: A
  explanation: Si usted es un delincuente sexual registrado, es su responsabilidad
    informar al examinador de licencias de conducir del Departamento de Seguridad
    que se le requiere registrarse como delincuente sexual.
- id: 136
  category: license_system
  question: Al presentar documentos para demostrar su identidad para una licencia
    de conducir, ¿cuál de los siguientes es aceptable?
  choices:
    A: Fotocopias claras
    B: Faxes notarizados
    C: Documentos originales o certificados
    D: Fotos digitales en su teléfono inteligente
  answer: C
  explanation: Todos los documentos deben ser originales o certificados. No se aceptarán
    faxes ni fotocopias.
- id: 137
  category: license_system
  question: ¿Cuántos comprobantes de residencia en Tennessee se requieren al solicitar
    una licencia de conducir?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Los solicitantes deben proporcionar dos comprobantes de residencia
    en Tennessee con su nombre y dirección de residencia.
- id: 138
  category: license_system
  question: 'Los comprobantes de residencia en Tennessee deben ser actuales. Según
    el manual, "actual" significa con fecha de los últimos:'
  choices:
    A: 30 días
    B: 60 días
    C: 4 meses
    D: 6 meses
  answer: C
  explanation: El manual especifica que los comprobantes aceptables de residencia
    en Tennessee deben ser actuales, lo que significa de los últimos 4 meses.
- id: 139
  category: license_system
  question: 'Si es menor de 18 años, su comprobante de asistencia escolar debe estar
    firmado y fechado dentro de los últimos:'
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 90 días
  answer: C
  explanation: El comprobante de asistencia o progreso escolar para solicitantes menores
    de 18 años debe estar firmado y fechado dentro de los últimos 30 días.
- id: 140
  category: driver_testing
  question: ¿Los solicitantes menores de 18 años deben proporcionar una certificación
    de cuántas horas de experiencia de conducción al volante?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Los solicitantes menores de 18 años necesitan una certificación de
    50 horas de experiencia de conducción al volante después de haber tenido un permiso
    de aprendizaje durante seis meses.
- id: 141
  category: license_system
  question: Al solicitar una Licencia de Conducir Comercial (CDL), ¿cuál de las siguientes
    afirmaciones es verdadera con respecto a su Número de Seguro Social (SSN)?
  choices:
    A: Puede usar una Declaración Jurada de SSN si no tiene un SSN.
    B: No se requiere un SSN para una licencia comercial.
    C: NO se permite la Declaración Jurada de SSN; las regulaciones federales requieren
      que los titulares de una CDL tengan un SSN.
    D: Puede proporcionar un Número de Identificación Personal del Contribuyente (ITIN)
      en su lugar.
  answer: C
  explanation: Las regulaciones federales requieren que los titulares de una CDL tengan
    un SSN. NO se permite la Declaración Jurada de SSN al solicitar una licencia comercial.
- id: 142
  category: license_system
  question: 'Si se ha mudado desde otro estado, su licencia de conducir válida de
    fuera del estado puede usarse para demostrar su:'
  choices:
    A: Ciudadanía de los EE. UU.
    B: Estatus de Residente Permanente Legal
    C: Identidad
    D: Residencia en Tennessee
  answer: C
  explanation: Su licencia de conducir válida de su estado anterior puede usarse para
    demostrar su identidad, pero no puede usarse para demostrar la ciudadanía de los
    EE. UU. ni el estatus de Residente Permanente Legal.
- id: 143
  category: license_system
  question: 'Si su nombre actual es diferente al que aparece en sus documentos de
    identidad, usted debe:'
  choices:
    A: Enviar por correo una fotocopia de su certificado de matrimonio
    B: Proporcionar documentos legales originales o certificados que establezcan el
      cambio de nombre
    C: Esperar hasta que su licencia actual expire para cambiarla
    D: Traer una carta notariada de un familiar
  answer: B
  explanation: Cada pieza de información de respaldo para establecer un cambio de
    nombre debe ser un documento legal original o certificado. No se pueden aceptar
    cambios de nombre por correo.
- id: 144
  category: license_system
  question: 'Si un solicitante solo tiene un estatus de presencia legal "temporal"
    en los EE. UU., puede ser elegible para una:'
  choices:
    A: Licencia de Conducir Comercial permanente
    B: Licencia de Conducir Temporal (TDL) o Licencia de Identificación Temporal (TID)
    C: Licencia de Conducir Estándar Clase D
    D: Permiso Internacional de Conducir
  answer: B
  explanation: Si un solicitante solo tiene un estatus de presencia legal temporal,
    NO será elegible para una licencia de conducir estándar, pero puede ser elegible
    para una Licencia de Conducir Temporal (TDL) o una Licencia de Identificación
    Temporal (TID).
- id: 145
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de un Permiso Internacional de Conducir (IDP)?
  choices:
    A: Es válido por sí solo para conducir en los Estados Unidos.
    B: Debe llevarse junto con la licencia de conducir regular y válida de los EE.
      UU. del conductor.
    C: Reemplaza su licencia de conducir emitida por el estado cuando viaja fuera
      del estado.
    D: Permite a los visitantes extranjeros ignorar las leyes de tránsito de los EE.
      UU.
  answer: B
  explanation: El IDP DEBE llevarse junto con la licencia de conducir regular y válida
    de los EE. UU. del conductor. NO es válido para conducir en los EE. UU. y NO es
    válido por sí solo para conducir.
- id: 146
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para demostrar la ciudadanía
    de los EE. UU. o el estatus de Residente Permanente Legal?
  choices:
    A: Una licencia de conducir válida de fuera del estado
    B: Una factura de servicios públicos de los últimos 4 meses
    C: Un pasaporte válido de los EE. UU.
    D: Una tarjeta de registro de votante
  answer: C
  explanation: La Tabla 2.1 enumera los documentos aceptables que demuestran que un
    solicitante es ciudadano de los EE. UU. o residente permanente legal, lo cual
    incluye un pasaporte válido de los EE. UU.
- id: 147
  category: license_system
  question: ¿Cuál de las siguientes NO es una forma aceptable de identificación principal
    al solicitar una licencia de conducir?
  choices:
    A: Certificado de nacimiento certificado
    B: Pasaporte válido
    C: Certificado de nacimiento emitido por un hospital
    D: Identificación militar
  answer: C
  explanation: El manual establece explícitamente que "LOS CERTIFICADOS EMITIDOS POR
    HOSPITALES Y LOS CERTIFICADOS DE BAUTISMO NO SON ACEPTABLES" como identificación
    principal.
- id: 148
  category: license_system
  question: Si un solicitante presenta un certificado de nacimiento extranjero que
    no está emitido en inglés, ¿qué más debe proporcionar?
  choices:
    A: Una carta notariada de la embajada
    B: Un Certificado de Traducción Precisa
    C: Un Permiso Internacional de Conducir
    D: Un pasaporte válido de los EE. UU.
  answer: B
  explanation: Los certificados de nacimiento extranjeros, no emitidos en inglés,
    deben traducirse e ir acompañados de un Certificado de Traducción Precisa.
- id: 149
  category: license_system
  question: ¿Cuántos elementos de prueba de identidad se requieren para un solicitante
    ORIGINAL que solicita una licencia de conducir?
  choices:
    A: Un elemento de la lista Principal
    B: Dos elementos de la lista Secundaria
    C: Al menos un elemento de la lista Principal y un segundo elemento de cualquiera
      de las listas
    D: Tres elementos de la lista Principal
  answer: C
  explanation: Los solicitantes ORIGINALES deben tener al menos un elemento de la
    lista de Identificación Principal. El segundo elemento puede ser de la lista de
    Identificación Secundaria o bien otro elemento de la lista de Identificación Principal.
- id: 150
  category: license_system
  question: ¿Qué debe hacer un nuevo residente si ha perdido su licencia de fuera
    del estado?
  choices:
    A: Proporcionar tres elementos de la lista de Identificación Secundaria
    B: Proporcionar los mismos dos elementos de prueba requeridos para un solicitante
      ORIGINAL
    C: Regresar a su estado anterior para obtener un reemplazo
    D: Esperar 30 días antes de solicitar una licencia de Tennessee
  answer: B
  explanation: Si se ha perdido la licencia de otro estado de un nuevo residente,
    este debe proporcionar los mismos dos (2) elementos de prueba que se requieren
    para un solicitante ORIGINAL.
- id: 151
  category: license_system
  question: Al utilizar un certificado de matrimonio como prueba de un cambio de nombre,
    ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Debe ser la 'licencia' que autoriza la unión
    B: Debe estar registrado DESPUÉS del matrimonio
    C: Una fotocopia del certificado siempre es aceptable
    D: No es necesario que incluya la fecha de nacimiento del solicitante
  answer: B
  explanation: El certificado debe ser el original o una copia certificada que se
    registre DESPUÉS del matrimonio; NO solo la 'licencia' que autoriza la unión.
- id: 152
  category: license_system
  question: ¿Cuál de los siguientes se considera un documento de Identificación Secundaria
    aceptable?
  choices:
    A: Acta de nacimiento certificada
    B: Pasaporte vigente
    C: Tarjeta de seguro médico
    D: Decreto de adopción
  answer: C
  explanation: Una tarjeta de seguro médico (como TennCare, Medicaid, Medicare, etc.)
    figura en la tabla de Identificación Secundaria.
- id: 153
  category: license_system
  question: ¿Cuántos documentos se requieren para demostrar la residencia en Tennessee?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: La prueba de residencia requiere que los solicitantes proporcionen
    dos (2) documentos de la Tabla de Pruebas de Residencia Aceptables.
- id: 154
  category: license_system
  question: ¿Cuál de los siguientes NO es un documento aceptable para demostrar la
    residencia en Tennessee?
  choices:
    A: Una factura de servicios públicos actual con el sobre que tenga el sello postal
    B: Un recibo de depósito inicial de un servicio público
    C: Un estado de cuenta bancario actual
    D: Un registro de votante de Tennessee actual
  answer: B
  explanation: 'Al utilizar una factura de servicios públicos como prueba de residencia,
    el manual establece explícitamente: ''El recibo de depósito inicial NO es aceptable''.'
- id: 155
  category: license_system
  question: Si un solicitante utiliza una factura de servicios públicos como prueba
    de residencia en Tennessee, ¿qué debe incluirse con ella?
  choices:
    A: Una firma ante notario
    B: El sobre con el sello postal en el que se envió la factura
    C: Una copia del acta de nacimiento del solicitante
    D: Una carta de la compañía de servicios públicos
  answer: B
  explanation: Una factura de servicios públicos actual debe incluir el sobre con
    el sello postal en el que se envió la factura.
- id: 156
  category: license_system
  question: ¿Se imprimirá su número de Seguro Social en su licencia de conducir de
    Tennessee?
  choices:
    A: Sí, es requerido por ley
    B: Sí, a menos que solicite lo contrario
    C: No, su número de seguro social no se imprimirá en su licencia
    D: Solo en las licencias de conducir comerciales
  answer: C
  explanation: 'El manual establece: ''Su número de seguro social no se imprimirá
    en su licencia''.'
- id: 157
  category: license_system
  question: ¿Qué tipo de tarjeta de Seguro Social es aceptable como prueba de identidad
    y número de Seguro Social?
  choices:
    A: Una réplica de metal
    B: Una réplica de plástico
    C: Una fotocopia del original
    D: Una tarjeta de Seguro Social original
  answer: D
  explanation: El manual especifica 'Una tarjeta de Seguro Social original' y señala
    bajo Identificación Secundaria 'solo original, no réplicas de metal o plástico'.
- id: 158
  category: license_system
  question: Si se utiliza una verificación del empleador de la dirección de residencia
    y el empleador no tiene papel membretado de la empresa, ¿qué se requiere?
  choices:
    A: La firma debe ser ante notario
    B: Dos firmas de diferentes gerentes
    C: Una copia de la licencia comercial del empleador
    D: No se puede utilizar bajo ninguna circunstancia
  answer: A
  explanation: 'El manual establece: ''Si el empleador no tiene papel membretado,
    la firma debe ser ante notario''.'
- id: 159
  category: license_system
  question: ¿Qué se requiere si un solicitante proporciona una copia de un documento
    judicial de una sentencia de divorcio como prueba de un cambio de nombre?
  choices:
    A: Un sello y una firma copiados son aceptables
    B: Debe tener una firma/sello original adherido a la copia
    C: Los documentos judiciales no pueden utilizarse para cambios de nombre
    D: Debe ir acompañado de un acta de nacimiento
  answer: B
  explanation: 'El manual señala: ''Es aceptable una copia del documento judicial
    con una firma/sello original que esté adherido a la copia. No es aceptable una
    copia del documento judicial con el sello/firma fotocopiado''.'
- id: 160
  category: license_system
  question: ¿Cuál de los siguientes solicitantes debe proporcionar una prueba de residencia
    en Tennessee?
  choices:
    A: Solo los solicitantes ORIGINALES para una identificación por primera vez
    B: Solo los solicitantes NUEVOS RESIDENTES
    C: Solicitantes ORIGINALES, NUEVOS RESIDENTES y RESIDENTES QUE REGRESAN
    D: Solicitantes de DUPLICADOS de una licencia de conducir (DL) de Tennessee existente
  answer: C
  explanation: El examinador de licencias de conducir requerirá prueba de residencia
    en Tennessee para los solicitantes ORIGINALES, los solicitantes NUEVOS RESIDENTES
    y los solicitantes RESIDENTES QUE REGRESAN.
- id: 161
  category: license_system
  question: ¿Si un solicitante es menor de edad y utiliza un documento de residencia
    a nombre de un padre o tutor legal, qué más se requiere?
  choices:
    A: Una carta de la escuela del menor
    B: Prueba de parentesco
    C: Una declaración notariada de un vecino
    D: La tarjeta de Seguro Social del menor
  answer: B
  explanation: El manual establece que si el solicitante es menor de edad, se puede
    usar el nombre de un padre o tutor legal, pero '(se requerirá prueba de parentesco
    si se utiliza este tipo de comprobante)'.
- id: 162
  category: license_system
  question: Si nunca se le ha asignado un Número de Seguro Social (SSN), ¿qué debe
    hacer para procesar su solicitud de licencia de conducir?
  choices:
    A: Proporcionar una carta de su empleador
    B: Solicitar en línea y marcar la casilla 'Sin SSN'
    C: Comparecer en persona y firmar una declaración jurada
    D: Traer un pasaporte y un certificado de nacimiento
  answer: C
  explanation: Los solicitantes a quienes nunca se les ha asignado un número de Seguro
    Social deben comparecer en persona y firmar una declaración jurada al respecto
    ante un examinador de licencias de conducir o un notario público.
- id: 163
  category: license_system
  question: A partir del 1 de enero de 2016, ¿cada cuánto tiempo vencen las licencias
    de conducir de Tennessee para personas mayores de 21 años?
  choices:
    A: Cada 4 años en su cumpleaños
    B: Cada 5 años a partir de la fecha de emisión
    C: Cada 8 años a partir de la fecha de emisión
    D: Cada 10 años en su cumpleaños
  answer: C
  explanation: A partir del 1 de enero de 2016, las licencias de Tennessee para personas
    mayores de 21 años vencen cada ocho años a partir de la fecha de emisión.
- id: 164
  category: license_system
  question: ¿Cuál de los siguientes NO es un método de pago aceptado en los Centros
    de Servicios al Conductor de Tennessee?
  choices:
    A: Efectivo
    B: Tarjetas de crédito American Express
    C: MasterCard
    D: Giro postal (Money Order)
  answer: B
  explanation: Los métodos de pago aceptados en los Centros de Servicios al Conductor
    son efectivo, cheque, giro postal (money order), MasterCard, Visa y tarjetas de
    crédito Discover. American Express no figura en la lista.
- id: 165
  category: license_system
  question: ¿Cuántos días tienen los nuevos residentes que poseen una licencia de
    conducir de otro estado para obtener una licencia de conducir de Tennessee después
    de establecer su residencia?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Los nuevos residentes o aquellos que regresan a Tennessee y poseen
    una licencia de conducir de otro estado deben obtener una licencia de conducir
    de Tennessee a más tardar treinta (30) días después de establecer su residencia.
- id: 166
  category: driver_testing
  question: ¿Qué prueba se requiere para TODOS los residentes nuevos o que regresan
    y obtienen una licencia de conducir de Tennessee?
  choices:
    A: Un examen de la vista
    B: Una prueba de habilidades de manejo
    C: Un examen de conocimientos por escrito
    D: Un examen médico físico
  answer: A
  explanation: Todos los residentes nuevos o que regresan deben realizar un examen
    de la vista de Tennessee en el Centro de Servicios al Conductor.
- id: 167
  category: driver_testing
  question: Si la licencia de otro estado de un nuevo residente ha estado vencida
    por más de seis meses, ¿qué pruebas debe realizar?
  choices:
    A: Solo un examen de la vista
    B: Examen de la vista y examen de conocimientos
    C: Examen de conocimientos y prueba de habilidades de manejo
    D: Examen de conocimientos, prueba de habilidades de manejo y examen de la vista
  answer: D
  explanation: Los residentes nuevos o que regresan cuya licencia de otro estado haya
    vencido por más de seis meses deben realizar el examen de conocimientos de Tennessee,
    la prueba de habilidades de manejo y el examen de la vista.
- id: 168
  category: license_system
  question: Al solicitar una licencia, los nuevos residentes deben proporcionar dos
    comprobantes de residencia en Tennessee. ¿Cuál de los siguientes es un requisito
    para estos documentos?
  choices:
    A: Deben ser fotocopias
    B: Deben tener una fecha dentro de los últimos 4 meses
    C: Deben usar una dirección de apartado postal (P.O. Box)
    D: Deben tener una fecha dentro de los últimos 12 meses
  answer: B
  explanation: Los solicitantes deben proporcionar dos comprobantes de residencia
    en Tennessee con su nombre y dirección de residencia (NO SE ACEPTAN APARTADOS
    POSTALES/P.O. BOXES), y los documentos deben ser actuales y tener una fecha dentro
    de los últimos 4 meses.
- id: 169
  category: license_system
  question: ¿Bajo qué condición una licencia de conducir válida de Tennessee permanece
    vigente indefinidamente para una persona en las Fuerzas Armadas de los Estados
    Unidos?
  choices:
    A: Si es miembro de la Guardia Nacional
    B: Si está en servicio activo y tiene su base fuera del estado de Tennessee
    C: Si es un familiar del personal militar
    D: Si está estacionado en una base dentro de Tennessee
  answer: B
  explanation: La licencia permanece válida independientemente de la fecha de vencimiento
    que figure en ella, siempre que la persona permanezca en servicio activo, tenga
    su base fuera del estado de Tennessee y la licencia no sea entregada, cancelada
    o suspendida.
- id: 170
  category: license_system
  question: Después de ser dado de baja de las Fuerzas Armadas o reasignado a una
    estación de servicio dentro de Tennessee, ¿cuántos días tiene una persona para
    renovar su licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Una vez que la persona haya sido dada de baja o separada de dichos
    servicios o haya sido reasignada a una estación de servicio dentro del estado,
    debe renovar su licencia dentro de los sesenta (60) días posteriores a la fecha
    de separación.
- id: 171
  category: license_system
  question: Si una Licencia de Conducir Temporal (TDL) se pierde o es robada, ¿cómo
    se puede reemplazar?
  choices:
    A: Solicitándola en línea a través del sitio web del estado
    B: Enviando una solicitud por correo al Departamento de Seguridad
    C: Solicitándola en persona en un centro de servicio de licencias de conducir
    D: Llamando a la línea directa gratuita de reemplazo
  answer: C
  explanation: Las Licencias de Conducir Temporales y las Licencias de Identificación
    Temporal no pueden reemplazarse en línea. Si debe solicitarla en persona, deberá
    presentar una identificación adecuada.
- id: 172
  category: license_system
  question: Si se le emitió una licencia de conducir de Tennessee después del 1 de
    enero de 2001, ¿qué debe hacer al momento de su PRIMERA renovación?
  choices:
    A: Renovar en línea para verificar su identidad
    B: Proporcionar documentación de que es ciudadano de los EE. UU. o residente permanente
      legal en un Centro de Servicio al Conductor
    C: Volver a tomar el examen de conocimientos por escrito
    D: Enviar por correo una fotocopia de su certificado de nacimiento al Departamento
      de Seguridad
  answer: B
  explanation: La ley de Tennessee exige que cualquier persona a la que se le haya
    emitido una licencia después del 1 de enero de 2001 proporcione documentación
    de que es ciudadano de los Estados Unidos o residente permanente legal al momento
    de su primera renovación. No puede renovar por correo ni por internet y debe visitar
    un Centro de Servicio al Conductor.
- id: 173
  category: driver_testing
  question: ¿Qué se requiere de los nuevos residentes de otros países al solicitar
    una licencia de conducir de Tennessee?
  choices:
    A: Deben entregar su licencia extranjera
    B: Solo se les requiere realizar un examen de la vista
    C: Deben realizar un examen de la vista, un examen de conocimientos y una prueba
      de habilidades viales
    D: Deben esperar seis meses antes de solicitarla
  answer: C
  explanation: 'Los nuevos residentes de otros países deben realizar las siguientes
    pruebas: examen de la vista, examen de conocimientos y prueba de habilidades viales.
    Se les permitirá conservar la licencia emitida por ese país.'
- id: 174
  category: license_system
  question: ¿Cuál es la regla con respecto a la condición física de los documentos
    presentados como prueba de identidad y residencia?
  choices:
    A: Se prefieren las fotocopias de alta calidad
    B: Los artículos deben ser documentos originales; no se aceptarán fotocopias
    C: Las copias digitales en un teléfono inteligente son aceptables
    D: Se requieren fotocopias notarizadas para todas las pruebas secundarias
  answer: B
  explanation: 'El manual establece explícitamente: ''Los artículos deben ser documentos
    originales. ¡No se aceptarán fotocopias!'''
- id: 175
  category: penalties_and_points
  question: ¿Cuál es el cargo por demora si su licencia de conducir ha estado vencida
    por más de treinta (30) días calendario pero menos de seis meses?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: Según el manual, si su licencia ha vencido hace más de treinta (30)
    días calendario, habrá un cargo por demora de cinco dólares ($5.00). Después de
    seis meses, el cargo se duplica a $10.00.
- id: 176
  category: license_system
  question: Si deja pasar cinco (5) años sin renovar su licencia de conducir, ¿qué
    debe hacer para renovarla?
  choices:
    A: Pagar un cargo por demora de $50
    B: Aprobar el examen de la vista, de conocimientos y de habilidades
    C: Tomar un curso de educación vial aprobado
    D: Esperar 180 días antes de solicitar una nueva licencia
  answer: B
  explanation: Si deja pasar cinco (5) años sin renovar, no solo tendrá que pagar
    el cargo por demora de $10.00, sino que también tendrá que aprobar el examen de
    la vista, de conocimientos y de habilidades.
- id: 177
  category: driver_responsibility
  question: Según la ley estatal, ¿cuántos días tiene para notificar al Departamento
    de Seguridad si cambia su dirección de residencia?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si su dirección de residencia cambia, la ley estatal le exige que notifique
    al Departamento de Seguridad dentro de los diez (10) días posteriores a este cambio.
- id: 178
  category: license_system
  question: Al proporcionar su nueva dirección al Departamento de Seguridad, ¿cuál
    de los siguientes NO se acepta por sí solo como dirección residencial?
  choices:
    A: Un número de casa y calle
    B: Un número de apartamento y camino
    C: Un apartado de correos (P.O. Box)
    D: Un número de carretera y ciudad
  answer: C
  explanation: Por ley, su licencia debe mostrar su dirección residencial legal. Un
    apartado de correos por sí solo no será aceptado como dirección residencial.
- id: 179
  category: license_system
  question: ¿Quién está exento de participar en el Programa de Licencia de Conducir
    Graduada (GDL)?
  choices:
    A: Cualquier persona que tenga 16 años y tenga un trabajo
    B: Personas menores de 18 años que se hayan graduado de la escuela secundaria
      o hayan recibido su GED
    C: Cualquier persona que haya tenido un permiso de otro estado durante 90 días
    D: Personas que tienen 17 años y han completado la educación vial
  answer: B
  explanation: La ley GDL no se aplica a ninguna persona de 18 años o más, ni a aquellas
    personas menores de 18 años que se hayan graduado de la escuela secundaria o hayan
    recibido un GED.
- id: 180
  category: license_system
  question: ¿Cuál es la edad mínima para obtener un Permiso de Aprendiz en Tennessee?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: B
  explanation: Para obtener un Permiso de Aprendiz, debe tener 15 años y aprobar los
    exámenes escritos estándar y el examen de la vista.
- id: 181
  category: safe_driving_rules
  question: ¿Entre qué horas tiene prohibido conducir una persona que posee un Permiso
    de Aprendizaje (Learner Permit)?
  choices:
    A: 8 P.M. y 6 A.M.
    B: 9 P.M. y 5 A.M.
    C: 10 P.M. y 6 A.M.
    D: 11 P.M. y 7 A.M.
  answer: C
  explanation: Los conductores que poseen un Permiso de Aprendizaje no pueden conducir
    entre las 10 P.M. y las 6 A.M.
- id: 182
  category: safe_driving_rules
  question: 'Al conducir con un Permiso de Aprendizaje, debe estar acompañado por
    un conductor con licencia que tenga al menos:'
  choices:
    A: 18 años de edad y viaje en el asiento delantero
    B: 21 años de edad y viaje en el asiento delantero
    C: 21 años de edad y viaje en cualquier lugar del vehículo
    D: 25 años de edad y viaje en el asiento delantero
  answer: B
  explanation: Puede conducir un automóvil solo cuando esté acompañado por un conductor
    con licencia de 21 años o más que viaje en el asiento delantero del vehículo.
- id: 183
  category: driver_testing
  question: Para obtener una Licencia Intermedia Restringida (Intermediate Restricted
    License), ¿de cuántas horas de experiencia de manejo debe tener verificación?
  choices:
    A: 30 horas (5 por la noche)
    B: 40 horas (10 por la noche)
    C: 50 horas (10 por la noche)
    D: 60 horas (15 por la noche)
  answer: C
  explanation: Debe contar con la verificación de un padre, tutor legal o instructor
    de manejo con licencia que indique que ha completado cincuenta horas (diez horas
    por la noche) de experiencia de manejo.
- id: 184
  category: license_system
  question: 'Para solicitar la Licencia Intermedia Sin Restricciones (Intermediate
    Unrestricted License), debe tener al menos 17 años y haber tenido una Licencia
    Intermedia Restringida durante:'
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Para solicitar la Licencia Intermedia Sin Restricciones desde la Licencia
    Intermedia Restringida, debe tener 17 años y haber tenido una Licencia Intermedia
    Restringida durante 1 año.
- id: 185
  category: penalties_and_points
  question: ¿Cuál de las siguientes situaciones le impedirá pasar de una Licencia
    Intermedia Restringida a una Licencia Intermedia Sin Restricciones?
  choices:
    A: Tener 1 infracción por el uso del cinturón de seguridad
    B: Acumular 4 puntos en su historial de manejo
    C: Tener un accidente de tráfico que haya sido su culpa
    D: No realizar un examen escrito adicional
  answer: C
  explanation: Para pasar a la Licencia Intermedia Sin Restricciones, no puede haber
    tenido un accidente de tráfico que haya sido su culpa. (Tampoco puede tener 2
    infracciones por el cinturón de seguridad, ni más de 6 puntos, y no se requieren
    exámenes adicionales).
- id: 186
  category: license_system
  question: A partir del 1 de julio de 2018, ¿en qué formato se imprimen todas las
    licencias emitidas a personas menores de 21 años?
  choices:
    A: Formato horizontal
    B: Formato vertical
    C: Formato cuadrado
    D: Formato holográfico
  answer: B
  explanation: A partir del 1 de julio de 2018, todas las licencias emitidas a personas
    menores de 21 años tienen un formato vertical.
- id: 187
  category: driver_responsibility
  question: ¿Cuál es el período de gracia para conducir un vehículo después de que
    expire su licencia de conducir?
  choices:
    A: 10 días
    B: 30 días
    C: 6 meses
    D: No hay período de gracia
  answer: D
  explanation: No existen 'períodos de gracia'. Cuando su licencia expira, ya no tiene
    derecho a conducir un vehículo o motocicleta.
- id: 188
  category: license_system
  question: Si tiene 15 años y tiene un permiso válido de su estado anterior, ¿cómo
    puede ese tiempo del permiso de otro estado contar para su requisito de 180 días
    en Tennessee?
  choices:
    A: Debe proporcionar un historial de manejo certificado de su estado anterior
      emitido dentro de los 30 días posteriores a la solicitud
    B: Debe realizar una nueva prueba de manejo de inmediato
    C: Debe hacer que el gobernador de su estado anterior firme una exención
    D: El tiempo del permiso de otro estado no puede contarse bajo ninguna circunstancia
  answer: A
  explanation: El tiempo que tuvo el permiso en su estado anterior puede incluirse
    en el período de 180 días, siempre que pueda proporcionar un historial de manejo
    certificado de su estado anterior emitido dentro de los treinta (30) días inmediatamente
    anteriores a la fecha de la solicitud en Tennessee.
- id: 189
  category: driver_responsibility
  question: 'Bajo la Ley Federal de Protección de la Privacidad del Conductor (DPPA),
    el Departamento de Seguridad no divulgará su información personal para una lista
    de correo sin:'
  choices:
    A: Una orden judicial
    B: Su consentimiento expreso
    C: Una verificación de antecedentes
    D: Una tarifa de procesamiento de $10
  answer: B
  explanation: La Ley Federal de Protección de la Privacidad del Conductor (DPPA)
    prohíbe la difusión o divulgación de información personal de un registro de vehículo
    motorizado sin el 'consentimiento expreso' de ese conductor.
- id: 190
  category: license_system
  question: Si un nuevo residente menor de 18 años proporciona un historial de manejo
    certificado de su estado anterior, ¿dentro de cuántos días de la solicitud de
    Tennessee debe ser emitido?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El historial de manejo certificado debe emitirse dentro de los treinta
    (30) días inmediatamente anteriores a la fecha de la solicitud en Tennessee.
- id: 191
  category: license_system
  question: ¿Cuál de los siguientes niveles de licencia NO requiere que el conductor
    lleve una Tarjeta de Restricción?
  choices:
    A: Permiso de Aprendiz (Learner Permit)
    B: Clase D Intermedia Restringida
    C: Clase D Intermedia No Restringida
    D: Tanto el Permiso de Aprendiz como la Intermedia Restringida
  answer: C
  explanation: Un conductor con el segundo nivel, Clase D Intermedia No Restringida
    (IU), no tiene restricciones para conducir. Por lo tanto, no existe una tarjeta
    de restricción para este nivel de licencia.
- id: 192
  category: penalties_and_points
  question: ¿Cuál es la sanción si un adolescente con una licencia Intermedia Restringida
    es condenado por falsificar una carta de aprobación de los padres?
  choices:
    A: 90 días añadidos al periodo de la licencia Intermedia Restringida
    B: Revocación de la licencia y reemisión de un Permiso de Aprendiz hasta los 18
      años
    C: Finalización de un curso certificado de educación vial
    D: Una suspensión de 6 meses de todos los privilegios de conducir
  answer: B
  explanation: Según la tabla de sanciones del GDL, una carta de aprobación de los
    padres falsificada después de que se emite una licencia Intermedia Restringida
    resulta en la revocación de la misma y la reemisión de un Permiso de Aprendiz
    únicamente hasta que el adolescente cumpla los 18 años.
- id: 193
  category: penalties_and_points
  question: ¿Qué sanción se aplica a un conductor con una licencia Intermedia Restringida
    que es condenado por una segunda infracción de tránsito en movimiento?
  choices:
    A: Debe mantener un Permiso de Aprendiz hasta los 18 años
    B: Se añaden 90 días a su periodo de licencia Intermedia Restringida
    C: Debe completar un curso certificado de educación vial
    D: Su licencia se suspende por 180 días
  answer: C
  explanation: La tabla de sanciones del GDL establece que una condena por una segunda
    infracción de tránsito en movimiento después de que se emite una licencia Intermedia
    Restringida requiere la finalización de un curso certificado de educación vial.
- id: 194
  category: driver_responsibility
  question: ¿Qué responsabilidad asume un adulto cuando firma un formulario de Declaración
    Jurada y Cancelación para Menores/Adolescentes para un solicitante menor de dieciocho
    años?
  choices:
    A: Debe viajar en el asiento del pasajero en todo momento
    B: Asume la responsabilidad financiera por el conductor menor de edad
    C: Debe pagar el registro del vehículo del menor
    D: Se le requiere registrar 50 horas de tiempo de conducción con el menor
  answer: B
  explanation: La Declaración Jurada para Menores/Adolescentes confirma que el adulto
    que firma el formulario se une a la solicitud de la licencia y será responsable
    de las acciones del conductor menor de edad. Esto incluye asumir la responsabilidad
    financiera.
- id: 195
  category: license_system
  question: Si un menor solicita una clase adicional de licencia, como una licencia
    de motocicleta, ¿qué se requiere de los padres o del tutor legal?
  choices:
    A: Deben firmar una segunda declaración jurada para adolescentes para ese tipo
      de licencia
    B: Deben pagar una tarifa de solicitud doble
    C: Deben tomar un curso de seguridad en motocicleta con el menor
    D: No se requiere documentación adicional
  answer: A
  explanation: Si un menor solicita una clase adicional de licencia (como la de motocicleta),
    los padres o el tutor legal deberán firmar una segunda declaración jurada para
    adolescentes para ese tipo de licencia.
- id: 196
  category: license_system
  question: ¿Por cuánto tiempo es válido el Certificado de Asistencia Escolar Obligatoria
    (Formulario SF1010) después de ser firmado por un funcionario escolar durante
    el año escolar regular?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El solicitante debe llevar el formulario original completado al Centro
    de Servicios al Conductor. Este formulario solo es válido por treinta (30) días
    a partir de la fecha de la firma del funcionario escolar.
- id: 197
  category: license_system
  question: Si un Certificado de Asistencia Escolar Obligatoria (Formulario SF1010)
    se firma dentro de los últimos 30 días del año escolar, ¿por cuánto tiempo se
    acepta?
  choices:
    A: Solo hasta el último día del año escolar
    B: Durante todo el verano hasta 30 días después del inicio del siguiente año escolar
    C: Por exactamente 90 días a partir de la fecha de la firma
    D: Hasta que el estudiante cumpla 18 años
  answer: B
  explanation: Durante los meses tradicionales de vacaciones de verano, un formulario
    SF1010 debidamente completado y firmado dentro de los últimos 30 días del año
    escolar será aceptado durante todo el verano hasta 30 días después del inicio
    del siguiente año escolar.
- id: 198
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como prueba de cumplimiento
    de la ley de asistencia escolar para un menor que solicita una licencia?
  choices:
    A: Un diploma original de escuela secundaria (high school)
    B: Un Certificado de Asistencia Escolar Obligatoria (Formulario SF1010)
    C: Boletas de calificaciones o expedientes académicos escolares
    D: Una carta del director local de escuelas para solicitantes educados en el hogar
  answer: C
  explanation: Las boletas de calificaciones o los expedientes académicos escolares
    no son aceptables como prueba de cumplimiento de esta ley. Debido a las diversas
    escalas de calificación, el personal de Licencias de Conducir no está autorizado
    para interpretar la información en estos documentos.
- id: 199
  category: penalties_and_points
  question: ¿Qué sucede con los privilegios de conducir de un estudiante de quince
    años o más que abandona la escuela?
  choices:
    A: Se limitan a conducir únicamente hacia y desde el trabajo
    B: El Departamento de Seguridad suspende los privilegios de conducir del estudiante
    C: Debe pagar una multa para conservar su licencia
    D: Se le degrada a un Permiso de Aprendiz
  answer: B
  explanation: Si un estudiante de quince años o más abandona la escuela, la escuela
    está obligada a notificar al Departamento de Seguridad, el cual suspende los privilegios
    de conducir del estudiante.
- id: 200
  category: license_system
  question: ¿Qué tipo de licencia se le puede otorgar a un solicitante menor de 18
    años al graduarse de la escuela secundaria o recibir un GED?
  choices:
    A: Solo un Permiso de Aprendiz
    B: Una licencia Intermedia Restringida
    C: Una licencia de operador Clase D regular
    D: Una licencia por dificultades económicas (Hardship license)
  answer: C
  explanation: Al graduarse de la escuela secundaria o después de recibir un GED antes
    de los 18 años, se puede emitir una licencia de operador Clase D regular.
- id: 201
  category: license_system
  question: Si un solicitante de 16 años tuvo una licencia de otro estado por menos
    de 90 días, ¿qué período combinado debe haber tenido un permiso de aprendizaje
    válido y/o una licencia para obtener una Licencia Restringida Intermedia (Intermediate
    Restricted License)?
  choices:
    A: Al menos 60 días
    B: Al menos 90 días
    C: Al menos 180 días
    D: Al menos 365 días
  answer: C
  explanation: Si el solicitante tuvo una licencia de otro estado por MENOS de 90
    días, el registro de conducción debe confirmar que se ha tenido un permiso de
    aprendizaje válido y/o una clase de licencia por un período combinado de al menos
    180 días.
- id: 202
  category: penalties_and_points
  question: Si un adolescente con un Permiso de Aprendizaje (Learner Permit) acumula
    seis o más puntos en su registro de conducción, ¿cuál es la sanción?
  choices:
    A: Debe mantener el permiso hasta que mantenga un registro con menos de 6 puntos
      durante 180 días consecutivos
    B: Su permiso es revocado hasta los 18 años
    C: Debe completar un curso certificado de educación vial
    D: Se le emite inmediatamente una licencia Restringida Intermedia
  answer: A
  explanation: Según la tabla de Sanciones de GDL, acumular seis o más puntos después
    de que se emite un Permiso de Aprendizaje requiere que el solicitante continúe
    manteniendo el permiso de aprendizaje por un período de tiempo adicional hasta
    que pueda mantener un registro con menos de 6 puntos durante 180 días consecutivos.
- id: 203
  category: penalties_and_points
  question: ¿Qué sucede si un adolescente comete una segunda infracción por el uso
    del cinturón de seguridad durante su período de Licencia Restringida Intermedia,
    pero el Departamento de Seguridad no es notificado hasta después de que se le
    haya emitido una licencia Intermedia No Restringida (Intermediate Unrestricted
    license)?
  choices:
    A: La infracción se perdona y no se aplica ninguna sanción
    B: La licencia del adolescente es revocada permanentemente
    C: El adolescente volverá a tener una licencia Restringida Intermedia durante
      90 días
    D: El adolescente debe pagar una multa de $500
  answer: C
  explanation: Si alguna de las infracciones enumeradas ocurrió durante el tiempo
    en que el adolescente tenía una licencia Restringida Intermedia, pero el DOS no
    recibió la notificación hasta después de que ya se le había emitido al adolescente
    una licencia Intermedia No Restringida, el adolescente será 'retrocedido' a una
    licencia Restringida Intermedia por 90 días.
- id: 204
  category: penalties_and_points
  question: ¿Qué sucede la segunda vez que un estudiante abandona la escuela?
  choices:
    A: Debe pagar una multa de $50.
    B: Debe esperar hasta cumplir 18 años para solicitar una licencia nuevamente.
    C: Debe esperar 6 meses para volver a solicitarla.
    D: Pierde permanentemente sus privilegios de conducir.
  answer: B
  explanation: Según el manual, la segunda vez que un estudiante abandona la escuela,
    debe esperar a cumplir dieciocho (18) años antes de ser elegible para solicitar
    una licencia nuevamente.
- id: 205
  category: license_system
  question: ¿Cuál es la tarifa de restablecimiento para un estudiante que abandonó
    la escuela pero regresa para recuperar sus privilegios de conducir?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: El manual establece que un estudiante que regrese a la escuela deberá
    pagar una tarifa de restablecimiento de $20, además de las tarifas correspondientes
    de solicitud y licencia.
- id: 206
  category: penalties_and_points
  question: ¿Cuál es una consecuencia para el titular de un permiso de aprendizaje
    que es sorprendido usando un teléfono celular mientras conduce?
  choices:
    A: Una suspensión de 180 días de su permiso
    B: 6 puntos añadidos a su registro de conducción
    C: Una multa de $100
    D: Revocación inmediata de su permiso hasta los 18 años
  answer: B
  explanation: Las consecuencias de una condena para un adolescente que usa un teléfono
    celular mientras conduce incluyen un delito menor de Clase C, una multa de $50,
    6 puntos añadidos al registro de conducción de un menor y un retraso de 90 días
    en la elegibilidad para una Licencia de Conducir Restringida Intermedia.
- id: 207
  category: safe_driving_rules
  question: ¿Cuál es la multa máxima por una infracción de enviar mensajes de texto
    mientras se conduce?
  choices:
    A: $20
    B: $50
    C: $100
    D: $250
  answer: B
  explanation: Las infracciones por enviar mensajes de texto mientras se conduce pueden
    resultar en una multa que no exceda los cincuenta dólares ($50) y costos judiciales
    que no excedan los diez dólares.
- id: 208
  category: defensive_driving
  question: Según el manual, ¿qué causa la mayoría de los accidentes en zonas de obras?
  choices:
    A: Exceso de velocidad
    B: Colisiones frontales
    C: Colisiones por alcance (traseras)
    D: Conducción distraída
  answer: C
  explanation: 'El manual establece explícitamente bajo los consejos de seguridad
    en zonas de obras: "¡No siga de cerca al vehículo de adelante! La mayoría de los
    accidentes en zonas de obras son causados por colisiones por alcance (traseras)".'
- id: 209
  category: safe_driving_rules
  question: ¿Qué debe hacer con los faros de su vehículo al acercarse a una zona de
    obras?
  choices:
    A: Apagarlos para evitar cegar a los trabajadores
    B: Hacerles señales de luces para alertar a los trabajadores de su presencia
    C: Encenderlos solo si está lloviendo
    D: Encenderlos antes de entrar en la zona
  answer: D
  explanation: 'El manual aconseja a los conductores: "¡Encienda sus luces antes de
    entrar en la zona! Encienda los faros de su vehículo para ser más visible para
    los trabajadores y otros automovilistas".'
- id: 210
  category: license_system
  question: ¿Cuáles son las restricciones de horario de conducción para el titular
    de un permiso de aprendizaje menor de 18 años?
  choices:
    A: Se prohíbe conducir entre las 10 p.m. y las 6 a.m.
    B: Se prohíbe conducir entre las 11 p.m. y las 6 a.m.
    C: Se prohíbe conducir entre las 9 p.m. y las 5 a.m.
    D: Se prohíbe conducir entre la medianoche y las 6 a.m.
  answer: A
  explanation: Cualquier persona menor de 18 años que tenga un permiso de aprendizaje
    tiene prohibido conducir entre las 10 p.m. y las 6 a.m.
- id: 211
  category: license_system
  question: ¿Cuánto tiempo debe un adolescente menor de 18 años tener un permiso de
    aprendizaje (learner permit) antes de solicitar una licencia restringida intermedia
    (Intermediate Restricted license)?
  choices:
    A: Un mínimo de 3 meses
    B: Un mínimo de 6 meses
    C: Un mínimo de 9 meses
    D: Un mínimo de 1 año
  answer: B
  explanation: Cualquier persona menor de 18 años debe tener su permiso de aprendizaje
    por un mínimo de seis meses antes de solicitar una licencia restringida intermedia.
- id: 212
  category: license_system
  question: Si el titular de un permiso de aprendizaje acumula 6 o más puntos en su
    historial de conducción, ¿qué debe suceder antes de que pueda solicitar una licencia
    restringida intermedia?
  choices:
    A: Debe pagar una tarifa de reinstalación de $50.
    B: Debe completar un curso de conducción defensiva.
    C: Debe mantener un historial con menos de 6 puntos durante 180 días consecutivos.
    D: Debe esperar hasta cumplir los 18 años.
  answer: C
  explanation: Si alguien con un permiso de aprendizaje tiene infracciones de conducción
    que suman 6 o más puntos, debe continuar con el permiso de aprendizaje hasta que
    su historial tenga menos de 6 puntos durante 180 días consecutivos completos.
- id: 213
  category: safe_driving_rules
  question: ¿Cuántos pasajeros se le permite tener en el vehículo al titular de una
    licencia restringida intermedia sin ninguna excepción calificada?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Quienes tienen una licencia intermedia solo pueden tener 1 pasajero
    adicional en el vehículo, a menos que se cumplan excepciones específicas (como
    un pasajero de 21 años o más con una licencia no restringida, o hermanos con una
    carta de autorización de los padres).
- id: 214
  category: license_system
  question: ¿Entre qué horas se le prohíbe generalmente conducir al titular de una
    licencia restringida intermedia?
  choices:
    A: 9 p.m. y 6 a.m.
    B: 10 p.m. y 6 a.m.
    C: 11 p.m. y 6 a.m.
    D: Medianoche y 5 a.m.
  answer: C
  explanation: A las personas con una licencia restringida intermedia se les prohíbe
    conducir entre las 11 p.m. y las 6 a.m., a menos que cumplan con circunstancias
    de exención específicas.
- id: 215
  category: penalties_and_points
  question: ¿Cuál es la sanción para el titular de una licencia restringida intermedia
    que sea sorprendido con una carta falsificada que otorgue permiso para conducir
    fuera de las horas permitidas?
  choices:
    A: Una multa de $50 y 6 puntos en su historial
    B: Revocación de la licencia y reemisión de un permiso de aprendizaje hasta los
      18 años
    C: Una suspensión de 90 días de su licencia
    D: Incautación inmediata del vehículo
  answer: B
  explanation: Un conductor con una licencia restringida intermedia que sea condenado
    por tener una carta falsificada o fraudulenta verá revocada su licencia restringida
    intermedia y solo se le volverá a emitir un permiso de aprendizaje hasta que cumpla
    los 18 años.
- id: 216
  category: license_system
  question: ¿Cuánto tiempo se debe tener una licencia restringida intermedia antes
    de solicitar una licencia intermedia no restringida (unrestricted Intermediate
    license)?
  choices:
    A: 6 meses
    B: 1 año
    C: 18 meses
    D: 2 años
  answer: B
  explanation: Los adolescentes deben tener su licencia restringida intermedia por
    un mínimo de un año antes de poder solicitar una licencia intermedia no restringida.
- id: 217
  category: sharing_the_road
  question: ¿Quiénes constituyen cuatro de cada cinco muertes en las zonas de obras
    viales?
  choices:
    A: Trabajadores de la construcción
    B: Peatones
    C: Conductores
    D: Señalizadores (Flaggers)
  answer: C
  explanation: Según el manual, las estadísticas muestran que los conductores constituyen
    cuatro de cada cinco muertes en las zonas de obras viales.
- id: 218
  category: safe_driving_rules
  question: 'El titular de una licencia restringida intermedia puede conducir entre
    las 4 a.m. y las 6 a.m. si:'
  choices:
    A: Conduce hacia o desde la casa de un amigo
    B: Conduce hacia o desde actividades de caza o pesca y posee una licencia de caza
      o pesca válida
    C: Conduce a un gimnasio o centro de fitness
    D: Está acompañado por un hermano que tiene al menos 18 años
  answer: B
  explanation: Una excepción al toque de queda de 11 p.m. a 6 a.m. es si el conductor
    se dirige hacia o regresa de cazar o pescar entre las 4 a.m. y las 6 a.m. y tiene
    en su poder una licencia de caza o pesca válida.
- id: 219
  category: penalties_and_points
  question: ¿Cuál de las siguientes situaciones causará un retraso de 90 días para
    ser elegible para una licencia intermedia no restringida?
  choices:
    A: Recibir 4 puntos en su historial de conducción
    B: Ser condenado por una primera infracción de cinturón de seguridad
    C: Contribuir a un accidente de tráfico
    D: Conducir después de las 10:00 PM
  answer: C
  explanation: Un conductor adolescente no será elegible para una licencia intermedia
    no restringida por 90 días adicionales si ha contribuido a un accidente de tráfico,
    ha recibido 6 o más puntos o ha sido condenado por una segunda infracción de cinturón
    de seguridad.
- id: 220
  category: penalties_and_points
  question: Si un conductor adolescente comete una segunda infracción de tránsito
    en movimiento mientras tiene una licencia de conducir restringida intermedia,
    ¿qué debe hacer antes de recibir una licencia no restringida?
  choices:
    A: Pagar una multa de $50
    B: Esperar 6 meses adicionales
    C: Completar una clase de educación vial aprobada
    D: Volver a tomar el examen de habilidades viales
  answer: C
  explanation: Si el conductor adolescente comete una segunda infracción de tránsito
    en movimiento mientras tiene la licencia de conducir restringida intermedia, DEBE
    COMPLETAR una clase de educación vial aprobada antes de recibir una licencia de
    conducir intermedia no restringida.
- id: 221
  category: license_system
  question: ¿Cuál es el toque de queda de conducción para un adolescente que tiene
    un Permiso de Aprendizaje (Clase PD)?
  choices:
    A: No puede conducir entre las 9:00 PM y las 5:00 AM
    B: No puede conducir entre las 10:00 PM y las 6:00 AM
    C: No puede conducir entre las 11:00 PM y las 6:00 AM
    D: No puede conducir entre la medianoche y las 6:00 AM
  answer: B
  explanation: Las restricciones para un Permiso de Aprendizaje (Clase PD) establecen
    que el conductor no puede conducir entre las 10:00 PM y las 6:00 AM.
- id: 222
  category: driver_testing
  question: ¿Cuál es el período de espera obligatorio después de reprobar el examen
    de conocimientos?
  choices:
    A: No hay período de espera
    B: 1 día
    C: 7 días
    D: 30 días
  answer: B
  explanation: Se requiere un período de espera obligatorio de 1 día después de reprobar
    el examen de conocimientos.
- id: 223
  category: driver_testing
  question: ¿Qué sucede si se descubre a un solicitante haciendo trampa en un examen
    obligatorio de licencia de conducir?
  choices:
    A: Recibe una advertencia y debe reiniciar el examen
    B: Reprueba automáticamente y no puede volver a intentar el examen por 7 días
    C: Reprueba automáticamente y no puede volver a intentar el examen por 30 días
    D: Se le prohíbe permanentemente obtener una licencia de conducir
  answer: C
  explanation: Cualquier forma de trampa por parte de un solicitante en un examen
    obligatorio resultará en una reprobación automática y no se le permitirá volver
    a intentar el examen durante 30 días.
- id: 224
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    para una licencia de conducir?
  choices:
    A: Visión 20/20 en cada ojo
    B: Visión 20/30 en cada ojo
    C: Visión 20/40 en cada ojo individualmente y en ambos ojos juntos
    D: Visión 20/50 en al menos un ojo
  answer: C
  explanation: Se requiere que el solicitante tenga al menos una visión de 20/40 en
    cada ojo individualmente y en ambos ojos juntos. Esto puede ser con o sin anteojos
    o lentes de contacto.
- id: 225
  category: driver_testing
  question: ¿Cuál de los siguientes NO está permitido durante el examen de conocimientos
    computarizado?
  choices:
    A: Realizar el examen en español
    B: Usar un diccionario de traducción sin notas ni escritura a mano
    C: Realizar el examen en coreano
    D: Usar un diccionario electrónico o un teléfono inteligente (smartphone)
  answer: D
  explanation: El uso de asistentes digitales personales (PDA), teléfonos inteligentes
    (smartphones), diccionarios electrónicos y otros dispositivos electrónicos similares
    NO está permitido durante el examen.
- id: 226
  category: driver_testing
  question: ¿Qué porcentaje del examen de conocimientos está dedicado a Drogas y alcohol?
  choices:
    A: 10%
    B: 15%
    C: 25%
    D: 50%
  answer: C
  explanation: El examen de conocimientos consta de cuatro áreas, y el tema de Drogas
    y alcohol constituye el 25% del examen.
- id: 227
  category: license_system
  question: ¿Cuál es el formato de todas las licencias de conducir emitidas a personas
    menores de 21 años?
  choices:
    A: Formato horizontal
    B: Formato vertical
    C: Formato cuadrado
    D: Formato codificado por color rojo
  answer: B
  explanation: A partir del 1 de julio de 2018, todas las licencias emitidas a personas
    menores de 21 años tienen un formato vertical.
- id: 228
  category: driver_testing
  question: ¿Bajo qué condiciones climáticas NO se realizan los exámenes de manejo?
  choices:
    A: Lluvia ligera
    B: Cielos nublados
    C: Clima extremo como lluvia intensa, niebla densa o carreteras con hielo
    D: Temperaturas inferiores a 40 grados
  answer: C
  explanation: Los exámenes de manejo no se realizan en condiciones climáticas extremas
    (lluvia/nieve intensa, niebla densa, granizo, vientos fuertes, carreteras con
    hielo, etc.).
- id: 229
  category: license_system
  question: ¿Cuántas horas de experiencia al volante deben certificarse para obtener
    una licencia Intermedia Restringida?
  choices:
    A: 30 horas, incluyendo 5 de noche
    B: 40 horas, incluyendo 10 de noche
    C: 50 horas, incluyendo 10 de noche
    D: 60 horas, incluyendo 15 de noche
  answer: C
  explanation: Para obtener una licencia Intermedia Restringida, debe proporcionar
    una certificación de 50 horas de experiencia al volante, incluyendo 10 horas de
    noche.
- id: 230
  category: driver_testing
  question: Si un solicitante menor de 18 años solicita un examen de conocimientos
    oral debido a una discapacidad de aprendizaje, ¿qué debe proporcionar?
  choices:
    A: Un padre o tutor legal para que le lea el examen
    B: Una declaración por escrito de un médico o especialista educativo
    C: Un intérprete certificado de lenguaje de señas
    D: Prueba de graduación de la escuela secundaria
  answer: B
  explanation: Si el solicitante que solicita un examen oral es menor de dieciocho
    (18) años, se requerirá una declaración por escrito de un médico o especialista
    educativo que indique que el solicitante tiene una condición médica o discapacidad
    de aprendizaje antes de que se pueda administrar el examen.
- id: 231
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para que a un solicitante se le
    otorgue una licencia o permiso de conducir?
  choices:
    A: Visión 20/20 en cada ojo
    B: Visión 20/30 en cada ojo
    C: Visión 20/40 en cada ojo individualmente y en ambos ojos a la vez
    D: Visión 20/50 en al menos un ojo
  answer: C
  explanation: Se requiere que el solicitante tenga al menos una visión de 20/40 en
    cada ojo individualmente y en ambos ojos a la vez, con o sin anteojos o lentes
    de contacto.
- id: 232
  category: driver_testing
  question: Si reprueba el examen de conocimientos para la licencia de conducir, ¿cuánto
    tiempo debe esperar antes de poder intentar el examen nuevamente?
  choices:
    A: Puede volver a tomarlo inmediatamente
    B: Un mínimo de un día
    C: Siete días
    D: Treinta días
  answer: B
  explanation: Se requiere un período de espera obligatorio de 1 día después de reprobar
    cualquier examen de conocimientos para la licencia de conducir antes de volver
    a intentarlo.
- id: 233
  category: driver_testing
  question: ¿Qué sucederá si llega más de 5 minutos tarde a su cita programada para
    el examen de habilidades de conducción?
  choices:
    A: Perderá 5 puntos en su examen de conducir
    B: El examinador omitirá la inspección del vehículo previa al viaje
    C: Debe pagar un cargo por retraso antes de realizar el examen
    D: Su examen de habilidades de conducción será cancelado y deberá reprogramarlo
  answer: D
  explanation: Si llega más de 5 minutos tarde a la hora de su cita, su examen de
    habilidades de conducción será cancelado y deberá reprogramarlo para una fecha
    posterior.
- id: 234
  category: driver_testing
  question: ¿Bajo cuál de las siguientes condiciones climáticas NO se realizará un
    examen de conducción?
  choices:
    A: Lluvia ligera
    B: Niebla moderada
    C: Nieve ligera
    D: Lluvia intensa y tormentas eléctricas
  answer: D
  explanation: Los exámenes de conducción NO se realizarán en caso de lluvia intensa,
    tormentas eléctricas, niebla espesa, cuando las carreteras estén inundadas, cubiertas
    o compactadas con nieve y hielo, o durante advertencias de clima severo.
- id: 235
  category: vehicle_information
  question: ¿Cualquier vehículo motorizado de pasajeros fabricado o ensamblado en
    qué año o posterior debe estar equipado con cinturones de seguridad?
  choices:
    A: '1959'
    B: '1969'
    C: '1979'
    D: '1989'
  answer: B
  explanation: Cualquier vehículo motorizado de pasajeros fabricado o ensamblado en
    1969 o posterior debe estar equipado con cinturones de seguridad y estos deben
    estar en buenas condiciones de uso.
- id: 236
  category: vehicle_information
  question: ¿Cuántos faros delanteros blancos se le permite tener a un vehículo motorizado?
  choices:
    A: Exactamente dos
    B: Al menos dos pero no más de cuatro
    C: Al menos cuatro
    D: De uno a cuatro
  answer: B
  explanation: Los vehículos motorizados deben estar equipados con al menos dos faros
    delanteros, pero no más de cuatro faros blancos.
- id: 237
  category: vehicle_information
  question: Para un automóvil de pasajeros, ¿qué porcentaje de luz visible debe transmitir
    el material de tinte de las ventanas?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 75%
  answer: B
  explanation: Para un automóvil de pasajeros, no se puede colocar en ninguna ventana
    ningún material que transmita menos del 35% de la luz visible.
- id: 238
  category: vehicle_information
  question: Los automóviles de pasajeros deben tener parachoques que estén dentro
    de ¿qué rango de altura desde el suelo?
  choices:
    A: 10 a 15 pulgadas
    B: 14 a 22 pulgadas
    C: 14 a 31 pulgadas
    D: 20 a 30 pulgadas
  answer: B
  explanation: Los automóviles de pasajeros deben tener parachoques que estén dentro
    de un rango de 14 a 22 pulgadas desde el suelo.
- id: 239
  category: driver_testing
  question: ¿Quién tiene permitido estar en el vehículo con usted durante su examen
    de conducción?
  choices:
    A: Usted, el examinador y un padre o tutor
    B: Solo usted y el examinador (u otro personal autorizado)
    C: Usted, el examinador y un traductor de idiomas
    D: Usted, el examinador y su instructor de manejo
  answer: B
  explanation: Las únicas personas permitidas en el vehículo son usted y el examinador
    (u otro personal autorizado). No se permite ningún animal en el vehículo.
- id: 240
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en una reprobación automática
    inmediata del examen de conducción?
  choices:
    A: Pedirle al examinador que repita una instrucción
    B: Una violación de cualquier ley de tránsito
    C: Frenar demasiado fuerte en una señal de alto
    D: No desempañar el parabrisas antes de comenzar
  answer: B
  explanation: 'El solicitante reprobará inmediatamente por cualquiera de lo siguiente:
    Violación de cualquier ley de tránsito, falta de cooperación, cualquier acción
    peligrosa o contribuir a un accidente.'
- id: 241
  category: driver_testing
  question: De acuerdo con las pautas de repetición de exámenes, si comete de 7 a
    9 errores en su examen de habilidades, ¿cuánto tiempo dura el período de práctica
    obligatorio antes de que pueda volver a realizar el examen?
  choices:
    A: Al día siguiente (1)
    B: Siete (7) días
    C: Catorce (14) días
    D: Treinta (30) días
  answer: A
  explanation: Según la Tabla 4.2 de las Pautas para la Repetición de Exámenes, cometer
    de 7 a 9 errores/puntos requiere un período de tiempo de práctica obligatorio
    hasta el día siguiente (1).
- id: 242
  category: driver_testing
  question: Si reprueba automáticamente el examen de conducir o comete 16 o más errores,
    ¿cuánto tiempo debe esperar antes de que se le permita volver a realizar el examen?
  choices:
    A: Al día siguiente (1)
    B: Siete (7) días
    C: Catorce (14) días
    D: Treinta (30) días
  answer: D
  explanation: Según la Tabla 4.2, 16 o más errores/puntos O una falla automática
    requiere un período de tiempo de práctica obligatorio de treinta (30) días.
- id: 243
  category: vehicle_information
  question: Por ley, ¿qué dos métodos distintos para aplicar los frenos deben tener
    todos los automóviles?
  choices:
    A: Frenos delanteros y frenos traseros
    B: Un freno de pie regular y un freno de estacionamiento
    C: Frenos antibloqueo y frenos estándar
    D: Un freno de mano y un freno de motor
  answer: B
  explanation: Por ley, todos los automóviles deben tener dos métodos distintos para
    aplicar los frenos. Deben tener un freno de pie regular y un freno de estacionamiento.
- id: 244
  category: driver_testing
  question: ¿Con cuánta anticipación debe planear llegar al Centro de Servicio de
    Licencias de Conducir antes de su cita programada para el examen de manejo?
  choices:
    A: A la hora exacta de la cita
    B: Al menos 5 minutos antes
    C: Al menos 15 minutos antes
    D: Al menos 30 minutos antes
  answer: C
  explanation: Debe planear llegar al Centro de Servicio de Licencias de Conducir
    al menos 15 minutos antes de la hora programada de su cita para permitir el procesamiento
    de la documentación.
- id: 245
  category: vehicle_information
  question: ¿Cuál es la regla con respecto al material de polarizado adherido al parabrisas
    de un vehículo motorizado?
  choices:
    A: Debe transmitir al menos el 35% de la luz visible
    B: Se permite si transmite el 50% de la luz visible
    C: No se puede adherir ningún material de polarizado al parabrisas
    D: Se permite solo en las 4 pulgadas superiores del parabrisas
  answer: C
  explanation: 'El manual establece: ''No se puede adherir ningún material de polarizado
    al parabrisas de ningún vehículo motorizado''.'
- id: 246
  category: driver_testing
  question: ¿Cuál es el período de tiempo de práctica obligatorio antes de volver
    a realizar el examen si un solicitante comete 16 o más errores o tiene una falla
    automática en el examen de habilidades?
  choices:
    A: Siete (7) días
    B: Catorce (14) días
    C: Treinta (30) días
    D: Noventa (90) días
  answer: C
  explanation: El manual establece que 16 o más errores/puntos, o una falla automática,
    requiere un período de tiempo de práctica obligatorio de treinta (30) días antes
    de que se permita volver a realizar el examen.
- id: 247
  category: driver_testing
  question: ¿Con cuánta anticipación debe llegar antes de su cita programada para
    el examen de manejo?
  choices:
    A: Al menos 5 minutos
    B: Al menos 10 minutos
    C: Al menos 15 minutos
    D: Al menos 30 minutos
  answer: C
  explanation: Debe llegar al menos 15 minutos antes de su cita programada para el
    examen de manejo para permitir tiempo para el papeleo de la solicitud.
- id: 248
  category: driver_testing
  question: ¿Su cita para el examen de manejo tendrá que ser reprogramada si llega
    tarde por al menos cuántos minutos?
  choices:
    A: 5 minutos
    B: 10 minutos
    C: 15 minutos
    D: 20 minutos
  answer: A
  explanation: Para garantizar un servicio oportuno, si llega cinco (5) o más minutos
    tarde al inicio de su cita para el examen de manejo, esta tendrá que ser reprogramada.
- id: 249
  category: driver_testing
  question: Los adolescentes de entre 15 y 17 años pueden realizar su examen de conocimientos
    escrito en línea bajo la supervisión de un padre o tutor legal utilizando ¿qué
    aplicación?
  choices:
    A: Tennessee Driver Portal App
    B: Tennessee Proctor Identification (PID) App
    C: TDOSHS Secure Test App
    D: Tennessee Teen Driver App
  answer: B
  explanation: Los adolescentes de 15 a 17 años pueden realizar el examen escrito
    en línea bajo la supervisión de un supervisor (proctor) a través de la aplicación
    Tennessee Proctor Identification (PID) App.
- id: 250
  category: safe_driving_rules
  question: ¿Por qué es peligroso conducir con el asiento en posición reclinada o
    semireclinada?
  choices:
    A: Aumenta el riesgo de que el cinturón de seguridad se desabroche.
    B: Reduce tanto su visión como su capacidad para reaccionar ante situaciones de
      emergencia.
    C: Hace que el volante se bloquee.
    D: Evita que las bolsas de aire se desplieguen.
  answer: B
  explanation: 'El manual establece explícitamente: ''NO CONDUZCA CON EL ASIENTO EN
    POSICIÓN RECLINADA O SEMIRECLINADA. Esto es peligroso y reduce tanto su visión
    como su capacidad para reaccionar ante situaciones de emergencia''.'
- id: 251
  category: vehicle_information
  question: ¿A qué distancia del volante debe estar posicionado su cuerpo para evitar
    lesiones graves en la cabeza o el cuello por el despliegue de una bolsa de aire?
  choices:
    A: 4 a 6 pulgadas
    B: 6 a 8 pulgadas
    C: 10 a 12 pulgadas
    D: 15 a 18 pulgadas
  answer: C
  explanation: Su cuerpo debe estar a unas 10 a 12 pulgadas de distancia del volante.
    Sentarse más cerca podría provocar lesiones graves en la cabeza o el cuello si
    una bolsa de aire golpea la barbilla o la cara.
- id: 252
  category: vehicle_information
  question: 'Al ajustar su asiento y la columna de dirección, la parte superior del
    volante no debe estar más alta que:'
  choices:
    A: La parte superior de sus hombros.
    B: Su barbilla.
    C: Su nariz.
    D: La parte superior de su cabeza.
  answer: A
  explanation: El manual establece que la parte superior del volante no debe estar
    más alta que la parte superior de los hombros.
- id: 253
  category: vehicle_information
  question: 'Los reposacabezas del asiento ajustados correctamente deben colocarse
    a un nivel alineado con la parte posterior de la cabeza para evitar:'
  choices:
    A: Lesiones por bolsas de aire.
    B: Latigazo cervical si es golpeado por detrás.
    C: Somnolencia al conducir.
    D: Puntos ciegos.
  answer: B
  explanation: Ajuste correctamente los reposacabezas del asiento a un nivel alineado
    con la parte posterior de la cabeza. Los reposacabezas están diseñados para prevenir
    el latigazo cervical si es golpeado por detrás.
- id: 254
  category: safe_driving_rules
  question: Al prepararse para conducir, ¿cuándo debe ajustar sus espejos?
  choices:
    A: Antes de ajustar su asiento.
    B: Después de que el asiento esté ajustado correctamente.
    C: Mientras conduce a baja velocidad.
    D: Solo después de revisar sus puntos ciegos.
  answer: B
  explanation: El manual instruye a los conductores a ajustar los espejos después
    de que el asiento esté ajustado correctamente, y siempre antes de conducir.
- id: 255
  category: vehicle_information
  question: 'Para ajustar correctamente el espejo lateral del conductor (izquierdo),
    debe colocar la cabeza contra la ventana lateral izquierda y ajustar el espejo
    de modo que pueda:'
  choices:
    A: Ver todo el parachoques trasero de su automóvil.
    B: Ver la consola central de su vehículo.
    C: Ver apenas el costado de su automóvil en el lado derecho del espejo.
    D: Ver la ventana trasera completamente encuadrada.
  answer: C
  explanation: Para ajustar el espejo lateral izquierdo, coloque la cabeza contra
    la ventana lateral izquierda y ajuste el espejo de modo que apenas pueda ver el
    costado de su automóvil en el lado derecho del espejo.
- id: 256
  category: vehicle_information
  question: ¿Cómo debe posicionar su cabeza para ajustar correctamente el espejo lateral
    del pasajero (derecho)?
  choices:
    A: Contra la ventana lateral izquierda.
    B: Justo encima de la consola central.
    C: Contra la ventana lateral del pasajero.
    D: Mirando directamente hacia adelante al parabrisas.
  answer: B
  explanation: Para ajustar el espejo lateral del pasajero, coloque su cabeza de modo
    que quede justo encima de la consola central.
- id: 257
  category: defensive_driving
  question: Incluso con los espejos ajustados correctamente, ¿qué debe hacer siempre
    antes de intentar girar o cambiar de carril?
  choices:
    A: Tocar la bocina para advertir a otros conductores.
    B: Girar la cabeza y revisar los puntos ciegos.
    C: Parpadear sus faros dos veces.
    D: Confiar completamente en su espejo retrovisor.
  answer: B
  explanation: Incluso los espejos colocados correctamente no pueden eliminar todos
    los puntos ciegos. Siempre gire la cabeza y revise los puntos ciegos cuando quiera
    girar o cambiar de carril.
- id: 258
  category: safe_driving_rules
  question: ¿Cómo debe colocarse correctamente el cinturón de regazo en su cuerpo?
  choices:
    A: Holgado a través del estómago.
    B: Firmemente a través de las caderas.
    C: Alto en el abdomen.
    D: A través de la parte superior de los muslos y las rodillas.
  answer: B
  explanation: Los cinturones de regazo deben colocarse firmemente a través de las
    caderas, mientras que el cinturón de hombro debe estar firmemente a través del
    hombro.
- id: 259
  category: vehicle_information
  question: Antes de arrancar un vehículo de transmisión automática, ¿debe colocar
    el pie en el pedal del freno y asegurarse de que el selector de cambios esté en
    qué posición?
  choices:
    A: NEUTRAL (Punto muerto)
    B: DRIVE (Conducir)
    C: PARK (Estacionamiento)
    D: REVERSE (Reversa)
  answer: C
  explanation: Coloque el pie en el pedal del freno y asegúrese de que el selector
    de cambios esté en la posición PARK para transmisiones automáticas o en NEUTRAL
    para transmisiones manuales/estándar.
- id: 260
  category: vehicle_information
  question: ¿En qué posición debe estar el selector de cambios antes de arrancar un
    vehículo de transmisión automática?
  choices:
    A: DRIVE (Conducir)
    B: REVERSE (Reversa)
    C: NEUTRAL (Punto muerto)
    D: PARK (Estacionamiento)
  answer: D
  explanation: Antes de arrancar un vehículo de transmisión automática, coloque el
    pie en el pedal del freno y asegúrese de que el selector de cambios esté en la
    posición PARK.
- id: 261
  category: vehicle_information
  question: ¿En un vehículo con transmisión manual, qué se debe hacer antes de que
    el vehículo arranque?
  choices:
    A: Se debe presionar el embrague (clutch).
    B: La palanca de cambios debe estar en primera marcha.
    C: Se debe bombear el acelerador dos veces.
    D: El volante debe estar bloqueado.
  answer: A
  explanation: En los vehículos con transmisión manual, se debe presionar el embrague
    (clutch) antes de que el vehículo arranque.
- id: 262
  category: safe_driving_rules
  question: ¿Cómo afecta la visibilidad de su vehículo el encender las luces bajas
    (low-beam) durante la luz del día normal?
  choices:
    A: Agota la batería y reduce la visibilidad.
    B: Hace que el vehículo sea visible al doble de la distancia.
    C: Hace que el vehículo sea visible al triple de la distancia.
    D: No tiene ningún efecto sobre la visibilidad durante el día.
  answer: B
  explanation: En condiciones normales de luz diurna, los vehículos son visibles al
    doble de la distancia cuando las luces delanteras están encendidas.
- id: 263
  category: vehicle_information
  question: ¿Cuándo se deben usar generalmente las marchas bajas (indicadas por "L",
    "2" o "1") en una transmisión automática?
  choices:
    A: Desaceleración de emergencia si hay una falla en los frenos.
    B: Al conducir en carreteras interestatales o autopistas.
    C: Al retroceder en línea recta.
    D: Para el tráfico normal de parar y seguir.
  answer: A
  explanation: Las marchas bajas generalmente no se usan excepto en situaciones especiales
    o de emergencia, como una desaceleración de emergencia si hay una falla en los
    frenos, al conducir por pendientes montañosas empinadas o al conducir a baja velocidad
    en carreteras resbaladizas.
- id: 264
  category: vehicle_information
  question: Al conducir un vehículo de transmisión estándar, ¿cuándo debe mantener
    el pedal del embrague (clutch) presionado a fondo?
  choices:
    A: Siempre que esté bajando una colina empinada.
    B: Al avanzar por inercia (coasting) para ahorrar gasolina.
    C: En todo momento mientras el vehículo esté en movimiento.
    D: Cuando su velocidad baje de 10 MPH al momento de detenerse.
  answer: D
  explanation: Debe mantener el pedal del embrague presionado a fondo al arrancar,
    al cambiar de marcha y cuando la velocidad baje de 10 MPH al momento de detenerse.
- id: 265
  category: safe_driving_rules
  question: ¿Qué establece el manual sobre avanzar por inercia (coasting) con las
    marchas en punto muerto (neutral)?
  choices:
    A: Se recomienda para ahorrar combustible.
    B: Es ilegal.
    C: Solo debe hacerse en colinas empinadas.
    D: Es la forma más segura de reducir la velocidad.
  answer: B
  explanation: 'El manual establece: "No avance por inercia (coasting) con las marchas
    en punto muerto (es ilegal) ni con el pedal del embrague presionado, excepto al
    cambiar de marcha".'
- id: 266
  category: safe_driving_rules
  question: ¿Cuál es la regla básica que debe seguir un conductor al operar un vehículo
    con un sistema de bloqueo del volante?
  choices:
    A: Bloquear siempre el volante antes de apagar el encendido.
    B: Nunca gire el encendido a la posición de bloqueo (lock) cuando el vehículo
      esté en movimiento.
    C: Nunca use el sistema de bloqueo mientras esté estacionado en una colina.
    D: Mantenga siempre una mano en el botón de liberación del bloqueo.
  answer: B
  explanation: La regla básica es nunca girar el encendido a la posición de bloqueo
    (lock) cuando el vehículo esté en movimiento, porque el volante se bloqueará y
    se perderá el control del vehículo.
- id: 267
  category: safe_driving_rules
  question: ¿Por qué debe evitar conducir con el codo o el brazo apoyado en la puerta
    o fuera de la ventana?
  choices:
    A: Hace que el volante se bloquee.
    B: Es ilegal en el estado de Tennessee.
    C: No tendrá el control total del volante y un choque lateral (sideswipe) podría
      arrancarle el brazo.
    D: Interfiere con el despliegue de las bolsas de aire laterales.
  answer: C
  explanation: No desarrolle el hábito de conducir con el codo o el brazo apoyado
    en la puerta o fuera de la ventana. No tendrá el control total del volante y un
    choque lateral (sideswipe) podría arrancarle el brazo.
- id: 268
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante para evitar
    lesiones por el despliegue de la bolsa de aire (air bag)?
  choices:
    A: A las 10 y a las 2 en punto
    B: A las 8 y a las 4 en punto
    C: A las 9 y a las 3 en punto
    D: A las 12 y a las 6 en punto
  answer: C
  explanation: Los conductores deben colocar la mano izquierda en la posición de las
    9 en punto y la mano derecha en la posición de las 3 en punto en el volante. Esta
    posición ayuda a evitar lesiones por el despliegue de la bolsa de aire durante
    un accidente.
- id: 269
  category: safe_driving_rules
  question: ¿Por qué se desaconseja cruzar los brazos al dirigir o girar el volante?
  choices:
    A: Hace que el vehículo acelere involuntariamente.
    B: Es ilegal y resultará en una prueba de manejo reprobada.
    C: Impide que el conductor use las señales de giro.
    D: Puede causar que la ropa y las joyas interfieran con el giro seguro y empeorar
      las lesiones por la bolsa de aire.
  answer: D
  explanation: No cruce los brazos al dirigir o girar el volante. Cruzar los brazos
    puede causar que la ropa y las joyas interfieran con el giro seguro, y sufriría
    lesiones más graves si la bolsa de aire se desplegara.
- id: 270
  category: safe_driving_rules
  question: ¿Por qué se recomienda el método de dirección de empujar y tirar (Push-Pull)
    para la conducción diaria normal en lugar del método de mano sobre mano (Hand-over-Hand)?
  choices:
    A: Permite un movimiento más rápido del volante en emergencias.
    B: Mantiene ambas manos en el volante durante toda la maniobra.
    C: Requiere menos esfuerzo físico para girar el volante.
    D: Es el único método que funciona con la dirección asistida.
  answer: B
  explanation: Se recomienda el método de empujar y tirar (Push-Pull) porque ralentiza
    los movimientos de giro, lo que permite un giro más suave y seguro. También mantiene
    ambas manos en el volante durante toda la maniobra.
- id: 271
  category: safe_driving_rules
  question: ¿Cuál es la colocación correcta de las manos y la postura al dar marcha
    atrás (reversa) con un vehículo de transmisión automática?
  choices:
    A: Sujete el volante a las 12 en punto con la mano izquierda, gire hacia la derecha
      y coloque el brazo derecho sobre el respaldo del asiento.
    B: Sujete el volante a las 9 y las 3 en punto y mire por el espejo retrovisor.
    C: Sujete el volante a las 6 en punto con la mano derecha y mire por la ventana
      del lado del conductor.
    D: Mantenga ambas manos en el volante y confíe totalmente en la cámara de reversa.
  answer: A
  explanation: Al dar marcha atrás, sujete el volante en la posición de las 12 en
    punto con la mano izquierda, gire hacia la derecha, coloque el brazo derecho sobre
    el respaldo del asiento y mire por encima del hombro a través de la ventana trasera.
- id: 272
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al gas
    monóxido de carbono del motor de un automóvil?
  choices:
    A: Tiene un olor fuerte y distintivo que advierte a los conductores de una fuga.
    B: Aparece como un humo negro espeso cuando se filtra en la cabina.
    C: Solo es peligroso si el vehículo está estacionado en un garaje cerrado.
    D: No tiene sabor, ni olor, ni es visible, pero puede matar.
  answer: D
  explanation: El gas monóxido de carbono del motor de un automóvil puede matar (no
    tiene sabor, ni olor, ni es visible). Generalmente se filtra cuando la calefacción
    del auto está encendida, cuando el sistema de escape no funciona correctamente
    o en medio de un tráfico pesado.
- id: 273
  category: defensive_driving
  question: Según el manual, ¿cuál es el tipo de accidente más común registrado anualmente
    en Tennessee?
  choices:
    A: Colisiones frontales
    B: Colisiones laterales (raspaduras)
    C: Colisiones por alcance (traseras)
    D: Colisiones perpendiculares (en forma de T) en intersecciones
  answer: C
  explanation: Al igual que la mayoría de los estados, Tennessee informa que las colisiones
    por alcance son el tipo de accidente más común registrado anualmente.
- id: 274
  category: safe_driving_rules
  question: Si se detiene junto a un bordillo (acera) para estacionarse correctamente,
    ¿a qué distancia debe quedar del bordillo?
  choices:
    A: A menos de 6 pulgadas
    B: A menos de 12 pulgadas
    C: A menos de 18 pulgadas
    D: A menos de 24 pulgadas
  answer: C
  explanation: Si se detiene junto a un bordillo, acérquese a menos de 18 pulgadas
    del mismo para estacionarse correctamente.
- id: 275
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una forma recomendada de evitar la intoxicación
    por monóxido de carbono en su vehículo?
  choices:
    A: Mantener abierta la rejilla de ventilación de aire fresco en medio de tráfico
      congestionado.
    B: Dejar el motor en marcha en un garaje cerrado para calentarlo.
    C: No utilizar la calefacción ni el aire acondicionado en un coche estacionado
      con las ventanillas cerradas.
    D: Revisar el sistema de escape solo si huele a gasolina.
  answer: C
  explanation: 'El manual establece que para evitar la intoxicación por monóxido de
    carbono, usted debe: ''No utilizar la calefacción/aire acondicionado en un coche
    estacionado con las ventanillas cerradas''.'
- id: 276
  category: vehicle_information
  question: ¿Cuáles son las características del gas monóxido de carbono?
  choices:
    A: Tiene un olor fuerte y dulce.
    B: Aparece como un humo espeso y negro.
    C: No tiene sabor, ni olor, ni es visible.
    D: Huele a huevos podridos.
  answer: C
  explanation: Según el manual, el gas monóxido de carbono del motor de un automóvil
    puede matar porque 'no tiene sabor, ni olor, ni es visible'.
- id: 277
  category: safe_driving_rules
  question: Bajo la ley Hands Free Tennessee (Manos Libres) implementada en 2019,
    ¿cuál de las siguientes acciones es ilegal para un conductor?
  choices:
    A: Utilizar un dispositivo de navegación manos libres.
    B: Alcanzar un teléfono celular de manera que requiera que el conductor deje de
      estar debidamente sujeto por el cinturón de seguridad.
    C: Utilizar la pantalla del sistema de información del vehículo.
    D: Mirar las pantallas visuales para la vista del conductor detrás del vehículo.
  answer: B
  explanation: El Capítulo Público No. 412 establece que es ilegal 'alcanzar un teléfono
    celular o dispositivo móvil de manera que requiera que el conductor deje de estar
    en una posición de conducción sentada o debidamente sujeto por un cinturón de
    seguridad'.
- id: 278
  category: safe_driving_rules
  question: ¿Cuál es la ley con respecto al uso de teléfonos móviles para conductores
    de 18 años o más en una zona escolar señalizada cuando las luces intermitentes
    están funcionando?
  choices:
    A: Todo uso del teléfono está estrictamente prohibido, incluido el manos libres.
    B: El uso del teléfono con la mano es una infracción, pero se permite el modo
      manos libres.
    C: Se permite el uso del teléfono con la mano si se conduce a menos de 15 mph.
    D: Solo está prohibido enviar mensajes de texto; se permiten las llamadas telefónicas
      con la mano.
  answer: B
  explanation: El manual establece que es una infracción para las personas de 18 años
    o más utilizar un teléfono móvil con la mano en una zona escolar señalizada con
    luces intermitentes en funcionamiento, pero 'Existe una excepción si el teléfono
    se utiliza en modo manos libres'.
- id: 279
  category: vehicle_information
  question: ¿Cuál de los siguientes dispositivos de video está permitido que sea visible
    para el conductor mientras el vehículo está en movimiento?
  choices:
    A: Una pantalla que muestre una transmisión de televisión.
    B: Un monitor que reproduzca una película grabada.
    C: Un dispositivo de posicionamiento global (GPS).
    D: Una tableta que transmita un video en vivo.
  answer: C
  explanation: La ley estatal prohíbe los monitores de video que muestren señales
    de TV o video visibles para el conductor, pero 'Un dispositivo de navegación o
    de posicionamiento global... no están prohibidos'.
- id: 280
  category: safe_driving_rules
  question: Según las leyes de cinturones de seguridad de Tennessee, ¿quién está obligado
    a usar cinturón de seguridad en el asiento delantero de un vehículo en movimiento?
  choices:
    A: Solo el conductor.
    B: Solo los pasajeros menores de 18 años.
    C: Todos los conductores y todos los pasajeros en el asiento delantero.
    D: Solo el conductor y los pasajeros menores de 17 años.
  answer: C
  explanation: 'El manual establece: ''Se requiere el uso del cinturón de seguridad
    para TODOS los conductores y todos los pasajeros en el asiento DELANTERO, en cualquier
    momento que el vehículo esté en movimiento''.'
- id: 281
  category: safe_driving_rules
  question: 'En Tennessee, los pasajeros del asiento trasero deben usar el cinturón
    de seguridad si:'
  choices:
    A: Son menores de 17 años.
    B: Tienen 18 años o más.
    C: Están sentados detrás del asiento del conductor.
    D: Viajan en un vehículo fabricado después de 2010.
  answer: A
  explanation: Los cinturones de seguridad son obligatorios para los pasajeros del
    ASIENTO TRASERO "si los pasajeros son menores de 17 años". Esta disposición ya
    no se aplica cuando los pasajeros del asiento trasero tienen 18 años o más.
- id: 282
  category: safe_driving_rules
  question: ¿Qué tipo de sistema de retención infantil se requiere para un niño menor
    de un año o que pese menos de 20 libras?
  choices:
    A: Un asiento de seguridad orientado hacia adelante.
    B: Un asiento de seguridad orientado hacia atrás.
    C: Un asiento elevado (booster) con posicionador de cinturón.
    D: Un cinturón de seguridad estándar para adultos.
  answer: B
  explanation: 'El manual especifica: "Un niño menor de un año, o cualquier niño que
    pese menos de 20 libras, debe estar en un sistema de retención para niños (asiento
    de seguridad) que esté orientado hacia la parte trasera del automóvil".'
- id: 283
  category: safe_driving_rules
  question: 'Un niño que tiene entre cuatro y ocho años y mide menos de cuatro pies
    y nueve pulgadas de altura debe estar asegurado en:'
  choices:
    A: Un asiento de seguridad orientado hacia atrás.
    B: Un asiento de seguridad orientado hacia adelante.
    C: Un sistema de asiento elevado (booster) con posicionador de cinturón.
    D: El asiento del pasajero delantero con un cinturón de seguridad estándar.
  answer: C
  explanation: Los niños que tienen entre cuatro y ocho años y cuya estatura es inferior
    a cuatro pies y nueve pulgadas deben estar en un sistema de asiento elevado (booster)
    con posicionador de cinturón y usar el cinturón de seguridad.
- id: 284
  category: driver_responsibility
  question: Si un niño menor de 16 años no está debidamente sujeto en un vehículo,
    ¿quién es generalmente el responsable y puede ser multado?
  choices:
    A: El niño.
    B: El conductor del vehículo.
    C: El propietario del vehículo, incluso si no está presente.
    D: El fabricante del vehículo.
  answer: B
  explanation: La ley responsabiliza al conductor de la protección de los niños hasta
    los dieciséis años. Si no están debidamente sujetos, el conductor puede ser acusado
    y multado con $50.00.
- id: 285
  category: driver_responsibility
  question: Si el padre, la madre o el tutor legal del niño está presente en el automóvil
    pero NO está conduciendo, ¿quién es responsable de garantizar que el niño sea
    transportado correctamente?
  choices:
    A: El conductor.
    B: El padre, la madre o el tutor legal.
    C: Tanto el conductor como el padre por igual.
    D: El niño.
  answer: B
  explanation: 'El manual señala: "Si el padre, la madre o el tutor legal del niño
    está presente en el automóvil pero no conduce, entonces el padre, la madre o el
    tutor legal es responsable de asegurarse de que el niño sea transportado adecuadamente
    y puede ser multado por incumplimiento".'
- id: 286
  category: defensive_driving
  question: ¿Cuál es la probabilidad de morir en un choque si usted es expulsado de
    un vehículo?
  choices:
    A: Una de cada dos.
    B: Una de cada cuatro.
    C: Una de cada ocho.
    D: Una de cada diez.
  answer: C
  explanation: Según la sección de Datos sobre el Cinturón de Seguridad, "La probabilidad
    de morir en un choque al ser expulsado de un vehículo es de una en ocho".
- id: 287
  category: safe_driving_rules
  question: ¿Cómo debe usar el cinturón de seguridad de un vehículo una mujer embarazada?
  choices:
    A: El cinturón de regazo por encima del abdomen y el cinturón de hombro por detrás
      de la espalda.
    B: El cinturón de regazo por debajo del abdomen y el cinturón de hombro por encima
      del vientre.
    C: Solo el cinturón de regazo, colocado directamente sobre el abdomen.
    D: Solo el cinturón de hombro, colocado debajo del brazo.
  answer: B
  explanation: 'El manual instruye: "Las mujeres embarazadas deben usar el cinturón
    de regazo por debajo del abdomen y el cinturón de hombro por encima del vientre".'
- id: 288
  category: penalties_and_points
  question: ¿Cuál es la multa máxima para un conductor sorprendido usando un teléfono
    portátil para transmitir o leer un mensaje escrito mientras el vehículo está en
    movimiento (excluyendo los costos judiciales)?
  choices:
    A: Diez dólares.
    B: Veinticinco dólares.
    C: Cincuenta dólares.
    D: Cien dólares.
  answer: C
  explanation: Las infracciones por usar un teléfono portátil para transmitir o leer
    un mensaje escrito mientras se está en movimiento "pueden resultar en una multa
    que no exceda los cincuenta dólares, y costos judiciales que no excedan los diez
    dólares".
- id: 289
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor que no utiliza un asiento de seguridad
    o un asiento elevado (booster) para un niño menor de nueve años o cuya estatura
    es inferior a cuatro pies y nueve pulgadas?
  choices:
    A: Un delito menor de Clase A y suspensión de la licencia.
    B: Un delito menor de Clase C, asistencia obligatoria a clase y posibles cargos/multas.
    C: Una simple multa de $10 sin otras sanciones.
    D: Una advertencia por la primera infracción y una multa de $50 por la segunda.
  answer: B
  explanation: 'Si la infracción se refiere a no usar un asiento de seguridad o un
    asiento elevado para niños menores de nueve años o de menos de 4''9", el castigo
    es mayor: "El conductor puede ser acusado de un delito menor de Clase C, se le
    puede exigir que asista a una clase sobre el transporte seguro de niños y se le
    puede exigir que pague posibles cargos y multas".'
- id: 290
  category: safe_driving_rules
  question: Según el manual, ¿qué tan probable es que los ocupantes expulsados mueran
    en un choque en comparación con aquellos que permanecen dentro del vehículo?
  choices:
    A: Dos veces más probable
    B: Tres veces más probable
    C: Cuatro veces más probable
    D: Ten veces más probable
  answer: C
  explanation: El manual señala que los ocupantes expulsados tienen cuatro veces más
    probabilidades de morir que los que permanecen dentro del vehículo.
- id: 291
  category: vehicle_information
  question: ¿Qué les sucede a los pasajeros que no llevan puesto el cinturón de seguridad
    cuando un vehículo es golpeado por el costado?
  choices:
    A: Se deslizarán hacia el punto del choque.
    B: Se deslizarán lejos del punto del choque.
    C: Serán empujados hacia el asiento trasero.
    D: Permanecerán inmóviles mientras el vehículo se mueve.
  answer: A
  explanation: Cuando un vehículo es golpeado por el costado, todo lo que no esté
    sujeto, incluidos los pasajeros, se deslizará hacia el punto del choque, no lejos
    de él.
- id: 292
  category: safe_driving_rules
  question: ¿Cuándo se considera que un niño es lo suficientemente grande para pasar
    de un sistema de retención infantil al uso de los cinturones de seguridad estándar
    (de regazo y hombro) del vehículo?
  choices:
    A: Cuando alcanzan las 40 libras de peso.
    B: Cuando tienen al menos 6 años de edad.
    C: Cuando pueden sentarse con la espalda contra el respaldo del asiento y sus
      rodillas se doblan sobre el borde.
    D: Cuando pueden abrocharse el cinturón ellos mismos sin ayuda.
  answer: C
  explanation: Un niño es lo suficientemente grande para usar el cinturón de regazo
    y hombro del vehículo cuando puede sentarse con la espalda contra el respaldo
    del asiento del vehículo y sus rodillas se doblan sobre el borde del asiento.
- id: 293
  category: safe_driving_rules
  question: ¿Dónde debe quedar ajustado de forma segura el cinturón de regazo en un
    niño que ha pasado a usar los cinturones de seguridad estándar del vehículo?
  choices:
    A: A través del estómago
    B: En la parte superior del muslo, bajo y ajustado alrededor de las caderas
    C: A través de la caja torácica
    D: Holgado sobre las rodillas
  answer: B
  explanation: El manual especifica que el cinturón de regazo debe quedar de forma
    segura sobre la parte superior del muslo del niño, bajo y ajustado alrededor de
    las caderas.
- id: 294
  category: safe_driving_rules
  question: ¿A qué edad establece el manual que los niños viajan más seguros en el
    asiento trasero de un vehículo?
  choices:
    A: 8 años o menos
    B: 10 años o menos
    C: 12 años o menos
    D: 15 años o menos
  answer: C
  explanation: El manual enfatiza que los niños de 12 años o menos viajan más seguros
    en el asiento trasero de un vehículo.
- id: 295
  category: vehicle_information
  question: ¿Cuál es la distancia recomendada a la que debe sentarse un conductor
    del volante para dar espacio a que la bolsa de aire (airbag) se despliegue de
    forma segura?
  choices:
    A: De 4 a 6 pulgadas
    B: De 6 a 8 pulgadas
    C: De 10 a 12 pulgadas
    D: De 15 a 18 pulgadas
  answer: C
  explanation: La Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA) recomienda entre diez y doce pulgadas entre el pecho y el módulo de la
    bolsa de aire.
- id: 296
  category: penalties_and_points
  question: Según la ley de Tennessee, ¿cuál es la regla con respecto a los niños
    menores de 6 años que viajan en la caja de una camioneta pickup?
  choices:
    A: Es legal si están supervisados por un adulto.
    B: Es ilegal bajo cualquier circunstancia.
    C: Es legal solo en carreteras del condado.
    D: Es legal si la camioneta viaja a menos de 30 mph.
  answer: B
  explanation: En Tennessee es ilegal permitir que cualquier niño menor de 6 años
    viaje en la caja de una camioneta pickup.
- id: 297
  category: safe_driving_rules
  question: ¿En qué tipo de carretera es ilegal permitir que un niño de entre 6 y
    12 años viaje en la caja de una camioneta pickup?
  choices:
    A: Cualquier carretera estatal o interestatal
    B: Cualquier camino privado
    C: Cualquier camino de tierra
    D: Cualquier entrada residencial
  answer: A
  explanation: Es ilegal permitir que cualquier niño de entre 6 y 12 años viaje en
    la caja de una camioneta pickup en cualquier carretera estatal o interestatal.
- id: 298
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción que permite a un niño viajar
    en la caja de una camioneta pickup?
  choices:
    A: Cuando viaja a un evento escolar
    B: Cuando participa en actividades agrícolas
    C: Cuando no quedan asientos en la cabina
    D: Cuando conduce a un parque estatal
  answer: B
  explanation: Una excepción a la ley que prohíbe a los niños viajar en la caja de
    una camioneta pickup es cuando el niño participa en actividades agrícolas.
- id: 299
  category: penalties_and_points
  question: ¿Es una infracción dejar a sabiendas a un niño desatendido en un vehículo
    motorizado si el niño es menor de qué edad?
  choices:
    A: 5 años de edad
    B: 7 años de edad
    C: 9 años de edad
    D: 12 años de edad
  answer: B
  explanation: Es una infracción que una persona responsable de un niño menor de 7
    años de edad deje a sabiendas a ese niño desatendido en un vehículo motorizado
    bajo ciertas condiciones.
- id: 300
  category: safe_driving_rules
  question: Si se deja a un niño menor de 7 años en un vehículo motorizado con el
    motor en marcha, debe estar supervisado por una persona que tenga al menos ¿qué
    edad?
  choices:
    A: 10 años de edad
    B: 13 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: La ley establece que el niño debe estar supervisado en el vehículo
    motorizado por una persona que tenga al menos 13 años de edad.
- id: 301
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de dejar a un niño desatendido
    en un vehículo motorizado bajo condiciones ilegales?
  choices:
    A: Un delito menor de Clase C y una multa de $50
    B: Un delito menor de Clase B y una multa de $200
    C: Un delito menor de Clase A y una multa de $500
    D: Un cargo por delito grave y suspensión de la licencia
  answer: B
  explanation: Una violación de esta sección es un delito menor de Clase B sancionable
    únicamente con una multa de doscientos dólares ($200) por la primera infracción.
- id: 302
  category: safe_driving_rules
  question: Según el manual, ¿qué tan probable es que los ocupantes de un vehículo
    mueran en un choque si no llevan puesto el cinturón de seguridad?
  choices:
    A: 5 veces más probable
    B: 10 veces más probable
    C: 20 veces más probable
    D: 32 veces más probable
  answer: D
  explanation: Los ocupantes de un vehículo tenían 32 veces más probabilidades de
    morir en un choque si no llevaban puesto el cinturón de seguridad.
- id: 303
  category: vehicle_information
  question: Si un niño debe viajar en el asiento delantero de una camioneta (pickup)
    con una bolsa de aire en el lado del pasajero, ¿qué debe hacer?
  choices:
    A: Apagar el motor del vehículo.
    B: Mover el asiento hacia atrás lo más posible y abrochar correctamente al niño.
    C: Hacer que el niño se siente en el regazo de un adulto.
    D: Colocar al niño en un asiento de seguridad orientado hacia atrás.
  answer: B
  explanation: Si un niño debe viajar en el asiento delantero de un vehículo, como
    una camioneta (pickup) con bolsa de aire en el lado del pasajero, el asiento debe
    moverse hacia atrás lo más posible y el niño debe estar correctamente abrochado.
- id: 304
  category: safe_driving_rules
  question: En un día templado con una temperatura exterior de 73 grados, ¿qué tan
    caliente puede llegar a estar el interior de un SUV en solo 10 minutos?
  choices:
    A: 85 grados
    B: 90 grados
    C: 100 grados
    D: 120 grados
  answer: C
  explanation: Según el manual, incluso en un día templado con 73 grados en el exterior,
    un SUV puede calentarse hasta los 100 grados en 10 minutos.
- id: 305
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por un delito menor de Clase A relacionado
    con dejar a un niño desatendido en un vehículo?
  choices:
    A: 6 meses de cárcel y una multa de $1,000
    B: 11 meses, 29 días y/o una multa de hasta $2,500
    C: De 1 a 5 años de prisión
    D: De 15 a 60 años de prisión
  answer: B
  explanation: Los delitos menores de Clase A conllevan una sanción no mayor a 11
    meses y 29 días, o una multa de hasta $2,500, o ambas.
- id: 306
  category: safe_driving_rules
  question: ¿Cuál es el lugar más seguro para que los niños de 12 años o menos viajen
    en un vehículo equipado con bolsas de aire?
  choices:
    A: El asiento del pasajero delantero
    B: El asiento trasero
    C: El centro del asiento delantero corrido
    D: La caja de una camioneta (pickup)
  answer: B
  explanation: El manual establece que el lugar más seguro para que los niños de 12
    años o menos viajen en un vehículo equipado con bolsas de aire es el asiento trasero.
- id: 307
  category: signs_and_signals
  question: ¿Qué color se utiliza para la señalización de control de tráfico en la
    gestión de incidentes, como accidentes de tráfico o derrames de materiales peligrosos?
  choices:
    A: Naranja
    B: Rosa fluorescente
    C: Marrón
    D: Rojo
  answer: B
  explanation: El rosa fluorescente (a veces llamado "coral") se utiliza para la señalización
    de control de tráfico en la gestión de incidentes cuando es necesario para eventos
    como accidentes de tráfico, incendios forestales, inundaciones y derrames de materiales
    peligrosos.
- id: 308
  category: signs_and_signals
  question: ¿Qué tipo de información indica una señal de tráfico de color marrón?
  choices:
    A: Áreas de recreación pública y puntos de interés cultural
    B: Construcción de carreteras y desvíos
    C: Regulaciones de estacionamiento permitido
    D: Servicios policiales y áreas de descanso
  answer: A
  explanation: El marrón se utiliza como color de fondo para las señales de información
    de guía relacionadas con puntos de interés recreativo y cultural.
- id: 309
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico de ocho lados (octágono)?
  choices:
    A: Ceder el paso
    B: Cruce de ferrocarril más adelante
    C: Pare (Stop)
    D: Zona escolar más adelante
  answer: C
  explanation: La forma de octágono es la única señal de ocho lados en la carretera.
    Siempre será roja con letras blancas y le indica que debe detener su vehículo
    por completo.
- id: 310
  category: signs_and_signals
  question: 'Una señal de tráfico circular (redonda) indica que se está aproximando
    a:'
  choices:
    A: Una intersección de cuatro vías
    B: Un cruce de ferrocarril a nivel
    C: Una zona hospitalaria
    D: Una rotonda
  answer: B
  explanation: Una señal circular siempre significa que se está aproximando a un cruce
    de ferrocarril a nivel y debe reducir la velocidad.
- id: 311
  category: safe_driving_rules
  question: ¿Qué debe hacer si un trabajador de construcción de carreteras le indica
    que avance, pero el semáforo está en rojo?
  choices:
    A: Esperar a que el semáforo cambie a verde antes de avanzar.
    B: Obedecer al trabajador de la construcción y avanzar.
    C: Hacerse a un lado y esperar a un oficial de policía.
    D: Tocar la bocina para advertir a otros conductores.
  answer: B
  explanation: Los conductores deben obedecer las indicaciones del personal de las
    fuerzas del orden, del personal de construcción de carreteras o de los guardias
    de cruce escolar, incluso si las indicaciones son diferentes a lo que indican
    los semáforos y las señales.
- id: 312
  category: signs_and_signals
  question: Al acercarse a una señal triangular de Ceda el Paso (Yield) de tres lados,
    ¿qué debe hacer si otros vehículos se aproximan por la otra calzada?
  choices:
    A: Acelerar para incorporarse delante de ellos.
    B: Mantener su velocidad y tocar la bocina.
    C: Detenerse y esperar a los vehículos que se aproximan.
    D: Avanzar sin detenerse, ya que usted tiene el derecho de paso.
  answer: C
  explanation: Una señal de Ceda el Paso de tres lados significa que debe detenerse
    y esperar cuando otros vehículos se aproximan por la derecha o la izquierda en
    la otra calzada.
- id: 313
  category: signs_and_signals
  question: ¿Cuál de las siguientes opciones es indicada por una señal de tráfico
    azul?
  choices:
    A: Zonas de construcción
    B: Servicios para automovilistas, como policía y áreas de descanso
    C: Advertencias generales
    D: Regulaciones de estacionamiento permisivo
  answer: B
  explanation: El azul se utiliza como color de fondo para las señales de información
    relacionadas con los servicios para automovilistas (incluidos los servicios policiales
    y las áreas de descanso) y el Marcador de Ruta de Emergencia.
- id: 314
  category: safe_driving_rules
  question: De acuerdo con las normas de sujeción para niños pasajeros, ¿cuándo debe
    un niño estar orientado hacia la parte trasera del automóvil?
  choices:
    A: Si el niño es menor de 1 año y pesa menos de 20 libras.
    B: Si el niño tiene entre 1 y 3 años.
    C: Si el niño pesa más de 20 libras.
    D: Si el niño viaja en el asiento del pasajero delantero.
  answer: A
  explanation: Un niño en un sistema de sujeción para niños pasajeros (asiento de
    seguridad) debe estar orientado hacia la parte trasera del automóvil si pesa menos
    de 20 libras y es menor de 1 año.
- id: 315
  category: signs_and_signals
  question: ¿Qué significa una señal rectangular roja con las palabras "ALL WAY" colocada
    debajo de una señal de alto (STOP)?
  choices:
    A: Solo el tráfico transversal debe detenerse.
    B: Todo el tráfico que se aproxima a esta intersección debe detenerse.
    C: Puede avanzar sin detenerse si el camino está despejado.
    D: La carretera adelante está cerrada para todo el tráfico.
  answer: B
  explanation: Un rectángulo rojo añadido debajo de una señal de alto con "ALL WAY"
    significa que todo el tráfico que se aproxima a esta intersección debe detenerse.
- id: 316
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una señal de Ceda el Paso (Yield) de tres
    lados?
  choices:
    A: Detenerse siempre por completo, independientemente del tráfico.
    B: Acelerar para incorporarse suavemente con el tráfico transversal.
    C: Reducir la velocidad y entrar en la intersección con precaución si no vienen
      otros autos.
    D: Detenerse solo si hay un semáforo presente.
  answer: C
  explanation: El manual establece que en una señal de Ceda el Paso, si está seguro
    de que no vienen otros autos, no es necesario detenerse por completo, pero debe
    reducir la velocidad y entrar en la intersección con precaución.
- id: 317
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales más pequeñas colocadas directamente
    debajo de una señal de cruce ferroviario en forma de 'X' ancha (crossbuck)?
  choices:
    A: Indican el límite de velocidad para el cruce.
    B: Muestran el número de vías en ese cruce en particular.
    C: Advierten de la hora exacta en que suelen pasar los trenes.
    D: Indican la distancia a la siguiente intersección de la carretera.
  answer: B
  explanation: El manual señala que las señales más pequeñas colocadas en el poste
    directamente debajo de la señal de cruce (crossbuck) muestran el número de vías
    en un cruce en particular.
- id: 318
  category: safe_driving_rules
  question: Según el manual, ¿por qué nunca debe intentar "ganarle" a un tren en un
    cruce ferroviario?
  choices:
    A: Los trenes tienen el derecho de paso solo durante las horas del día.
    B: Por lo general, juzgará mal la velocidad del tren.
    C: Es ilegal cruzar las vías sin detenerse primero.
    D: El motor de su vehículo se detendrá en las vías.
  answer: B
  explanation: 'El manual advierte explícitamente a los conductores: ''NUNCA INTENTE
    GANARLE AL TREN. POR LO GENERAL, JUZGARÁ MAL SU VELOCIDAD''.'
- id: 319
  category: signs_and_signals
  question: ¿Dónde se coloca normalmente una señal triangular de Zona de No Rebasar
    (No Passing Zone) en la carretera?
  choices:
    A: En el lado derecho de la calzada.
    B: Suspendida directamente sobre el carril central.
    C: En el lado izquierdo de la calzada.
    D: En la superficie del pavimento como un símbolo pintado.
  answer: C
  explanation: El manual establece que una señal triangular de Zona de No Rebasar
    es amarilla o naranja y se coloca en el lado izquierdo de la calzada.
- id: 320
  category: signs_and_signals
  question: ¿Cuál es la diferencia entre una señal de advertencia de giro (turn) y
    una señal de advertencia de curva (curve)?
  choices:
    A: Una señal de giro se utiliza para velocidades recomendadas de 30 mph o menos,
      mientras que una señal de curva es para velocidades entre 30 y 55 mph.
    B: Una señal de giro es naranja, mientras que una señal de curva es amarilla.
    C: Una señal de giro indica un callejón sin salida, mientras que una señal de
      curva indica un camino sinuoso.
    D: Una señal de giro es solo para giros a la derecha, mientras que una señal de
      curva es solo para giros a la izquierda.
  answer: A
  explanation: El manual establece que la señal de giro se utiliza para marcar giros
    con una velocidad recomendada de 30 m.p.h. o menos, mientras que la señal de curva
    marca curvas con velocidades recomendadas en el rango entre 30 y 55 m.p.h.
- id: 321
  category: defensive_driving
  question: ¿Qué debe vigilar cuando vea una señal de advertencia de caída de rocas
    en zonas montañosas?
  choices:
    A: Rocas que caen directamente desde arriba sobre su vehículo.
    B: Rocas que ya puedan estar en el camino.
    C: Vehículos de construcción descargando grava.
    D: Peatones lanzando rocas desde pasos elevados.
  answer: B
  explanation: El manual aclara que esta señal 'advierte sobre rocas que pueden estar
    en el camino, no sobre rocas que puedan golpearlo desde arriba. Observe la calzada,
    no la colina'.
- id: 322
  category: sharing_the_road
  question: ¿Qué debe hacer cuando vea una señal de advertencia que le alerte de que
    el tráfico se está incorporando a su vía principal de circulación?
  choices:
    A: Acelerar para bloquear el tráfico que se incorpora.
    B: Tocar la bocina para advertir a los vehículos que se incorporan que cedan el
      paso.
    C: Cambiarse al otro carril, si es posible, para permitir que el automovilista
      que se incorpora tenga el camino despejado.
    D: Detenerse por completo y dejar que los otros vehículos se incorporen.
  answer: C
  explanation: El manual aconseja que, después de revisar hacia atrás, debe cambiarse
    al otro carril, si es posible, para permitir que el automovilista que se incorpora
    tenga el camino despejado.
- id: 323
  category: signs_and_signals
  question: ¿De qué color y forma son generalmente las señales de construcción, mantenimiento
    u operaciones de emergencia?
  choices:
    A: Triángulos rojos y blancos.
    B: Círculos amarillos y negros.
    C: Rectángulos verdes y blancos.
    D: Naranjas con letras o símbolos negros, y de forma romboidal o rectangular.
  answer: D
  explanation: El manual establece que las señales de zona de obras son generalmente
    de forma romboidal o rectangular, de color naranja con letras o símbolos negros.
- id: 324
  category: safe_driving_rules
  question: ¿Cómo debe conducir al pasar por una zona de obras guiada por dispositivos
    de canalización como barricadas o conos?
  choices:
    A: Mantener su vehículo en el centro del carril y obedecer el límite de velocidad
      indicado.
    B: Conducir lo más cerca posible de los conos para dejar espacio a los trabajadores.
    C: Cambiar de carril con frecuencia para encontrar la ruta más rápida a través
      de la zona.
    D: Circular sobre la línea central para mantener una distancia segura de las barricadas.
  answer: A
  explanation: El manual instruye a los conductores a 'mantener su vehículo en el
    centro del carril y obedecer el límite de velocidad indicado' al conducir cerca
    de dispositivos de canalización.
- id: 325
  category: safe_driving_rules
  question: ¿Cómo se controlan algunas señales de límite de velocidad en zonas escolares
    para indicar cuándo pueden estar cruzando los niños?
  choices:
    A: Por guardias de cruce que sostienen paletas de pare.
    B: Por un reloj temporizador que hace destellar luces amarillas mientras ilumina
      el límite de velocidad.
    C: Por sensores de movimiento que detectan vehículos que se aproximan.
    D: Por un semáforo en rojo permanente.
  answer: B
  explanation: El manual establece que este tipo de señal es controlada por un reloj
    temporizador y hace destellar luces amarillas mientras ilumina el límite de velocidad.
- id: 326
  category: safe_driving_rules
  question: En una carretera con más de un carril en cada dirección, ¿qué significa
    la señal que le exige conducir en el carril del extremo derecho?
  choices:
    A: Debe conducir en el carril derecho a menos que desee adelantar a un automóvil
      que circula más lento o realizar un giro a la izquierda.
    B: Siempre debe conducir en el carril derecho, incluso al adelantar.
    C: Debe circular sobre los carriles si se mueve más lento que el resto del tráfico.
    D: Solo puede usar el carril derecho para estacionar o emergencias.
  answer: A
  explanation: El manual explica que esta señal significa 'que debe conducir en el
    carril del extremo derecho a menos que desee adelantar a un automóvil que circula
    más lento o realizar un giro a la izquierda'.
- id: 327
  category: sharing_the_road
  question: ¿De qué color es la ropa que usan los señalizadores (flaggers), trabajadores
    de servicios públicos y oficiales de la ley en las zonas de obras para asegurar
    que puedan ser vistos en condiciones de poca luz y mal tiempo?
  choices:
    A: Uniformes azul oscuro o negros.
    B: Ropa o chalecos de color amarillo-verde fluorescente.
    C: Trajes reflectantes de color blanco puro.
    D: Chaquetas de camuflaje.
  answer: B
  explanation: El manual menciona que los oficiales de la ley y los señalizadores/trabajadores
    usan 'chalecos amarillo-verde fluorescentes' y ropa para asegurarse de que puedan
    ser vistos en condiciones normales y en condiciones de poca luz y mal tiempo.
- id: 328
  category: signs_and_signals
  question: ¿Qué acción debe tomar cuando vea un panel de flechas intermitentes que
    le alerte de un cierre de carril más adelante?
  choices:
    A: Acelerar para pasar la zona de construcción rápidamente.
    B: Esperar hasta el último momento posible para incorporarse al carril abierto.
    C: Comenzar a incorporarse a los carriles abiertos restantes con bastante antelación
      a la señal.
    D: Detener su vehículo inmediatamente y esperar las instrucciones de un señalizador.
  answer: C
  explanation: 'El manual instruye: ''Los paneles de flechas intermitentes alertan
    a los conductores que se aproximan sobre cierres de carriles. Debe comenzar a
    incorporarse a los carriles abiertos restantes con bastante antelación a esta
    señal''.'
- id: 329
  category: safe_driving_rules
  question: ¿Qué debe hacer al conducir cerca de dispositivos de canalización en una
    zona de obras?
  choices:
    A: Cambiar de carril rápidamente para evitarlos.
    B: Mantener su vehículo en el centro del carril y obedecer el límite de velocidad
      indicado.
    C: Conducir por el arcén (hombro) para dar más espacio a los trabajadores.
    D: Acelerar para salir más rápido de la zona de obras.
  answer: B
  explanation: El manual establece que al conducir cerca de dispositivos de canalización
    en una zona de obras, debe mantener su vehículo en el centro del carril y obedecer
    el límite de velocidad indicado.
- id: 330
  category: vehicle_information
  question: ¿Cuál de los siguientes vehículos es más probable que exhiba un emblema
    de Vehículo de Movimiento Lento (SMV)?
  choices:
    A: Vehículos de emergencia respondiendo a una llamada.
    B: Autobuses comerciales y camiones grandes.
    C: Tractores agrícolas, maquinaria y vehículos de tracción animal.
    D: Vehículos que transportan materiales peligrosos.
  answer: C
  explanation: Según el manual, puede ver el emblema SMV en vehículos de movimiento
    lento, como tractores agrícolas, maquinaria, equipo de construcción o vehículos
    de tracción animal.
- id: 331
  category: signs_and_signals
  question: ¿Cuál es el propósito de una señal de marcador de objeto?
  choices:
    A: Marcar la línea central de una carretera de doble sentido.
    B: Indicar un cruce de peatones más adelante.
    C: Mostrar la distancia hasta la próxima salida de la autopista.
    D: Advertir sobre objetos cercanos al borde de la carretera, como los extremos
      de un puente.
  answer: D
  explanation: Los marcadores de objetos advierten a los conductores sobre objetos
    que no están propiamente en la calzada, pero que están tan cerca del borde de
    la carretera que necesitan señalización, como los extremos de puentes y los estribos
    de pasos inferiores.
- id: 332
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales de Marcador de Ruta Interestatal?
  choices:
    A: Verde y blanco
    B: Azul y rojo
    C: Negro y blanco
    D: Amarillo y negro
  answer: B
  explanation: El manual establece que las señales azules y rojas indican que la ruta
    es parte del sistema nacional de autopistas interestatales y de defensa.
- id: 333
  category: signs_and_signals
  question: ¿De qué color son las señales que dirigen a los automovilistas hacia instalaciones
    de servicio como gasolineras, restaurantes y moteles?
  choices:
    A: Verde
    B: Marrón
    C: Azul
    D: Naranja
  answer: C
  explanation: El color azul de las señales de servicio dirige a los automovilistas
    hacia instalaciones de servicio como estaciones de servicio, restaurantes y moteles.
- id: 334
  category: safe_driving_rules
  question: ¿Quién tiene permitido legalmente estacionar en espacios que muestran
    el símbolo azul de discapacidad?
  choices:
    A: Cualquier persona que se estacione por menos de 5 minutos.
    B: Mujeres embarazadas y familias con niños pequeños.
    C: Vehículos que porten placas de veterano discapacitado o de persona con discapacidad,
      o una calcomanía especial para personas con discapacidad.
    D: Conductores de edad avanzada mayores de 65 años.
  answer: C
  explanation: Los espacios de estacionamiento que muestran la señal azul de discapacidad
    están reservados exclusivamente para vehículos que porten placas de veterano discapacitado
    o de persona con discapacidad, o una calcomanía especial para personas con discapacidad.
    El uso por parte de otros está prohibido por ley.
- id: 335
  category: signs_and_signals
  question: ¿Con qué frecuencia se instalan los marcadores de referencia de emergencia
    a lo largo de los tramos muy transitados de las autopistas interestatales urbanas
    en Tennessee?
  choices:
    A: Cada 500 pies
    B: Cada 1,000 pies
    C: Cada 1 milla
    D: Cada 5 millas
  answer: B
  explanation: Para ayudar a los automovilistas a identificar mejor su ubicación,
    el estado ha instalado marcadores de referencia interestatales cada 1,000 pies
    a lo largo de los tramos muy transitados de las autopistas interestatales urbanas.
- id: 336
  category: safe_driving_rules
  question: ¿Cuándo se le permite girar a la derecha con luz roja?
  choices:
    A: En cualquier momento, sin detenerse.
    B: Solo cuando también esté iluminada una flecha verde.
    C: Después de detenerse por completo y cuando no haya peatones ni tráfico cruzado,
      a menos que se indique lo contrario.
    D: Los giros a la derecha en rojo nunca están permitidos en Tennessee.
  answer: C
  explanation: A menos que se indique lo contrario, puede girar a la derecha en rojo
    después de detenerse por completo y cuando no haya peatones ni tráfico cruzado.
- id: 337
  category: safe_driving_rules
  question: Según la ley de Tennessee, ¿cuál es el tiempo mínimo que debe mostrarse
    una luz de tráfico amarilla antes de cambiar a roja?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: B
  explanation: La ley de Tennessee solo exige que la luz amarilla se muestre durante
    un mínimo de tres segundos antes de la luz roja.
- id: 338
  category: safe_driving_rules
  question: ¿Qué debe hacer si ya se encuentra DENTRO de la intersección cuando se
    enciende la luz amarilla del semáforo?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Poner su vehículo en reversa y salir de la intersección.
    C: Aumentar la velocidad significativamente para ganarle a la luz roja.
    D: No se detenga, sino continúe con precaución a través de la intersección.
  answer: D
  explanation: El manual indica que si ya se encuentra DENTRO de la intersección cuando
    se enciende la luz amarilla, no se detenga, sino continúe con precaución a través
    de la intersección.
- id: 339
  category: signs_and_signals
  question: ¿Qué indica una señal de tráfico de flecha roja?
  choices:
    A: Puede girar en la dirección de la flecha después de ceder el paso.
    B: Todos los giros en la dirección de la flecha están prohibidos, incluso si otros
      carriles de tráfico tienen una señal verde.
    C: Debe tratar la intersección como una parada de cuatro vías.
    D: Solo puede girar si conduce un vehículo de emergencia.
  answer: B
  explanation: Cuando la flecha está en rojo o su carril tiene la luz roja, todos
    los giros están prohibidos. Esto es así incluso si otros carriles de tráfico tienen
    una señal verde y su camino parece despejado.
- id: 340
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente en una intersección?
  choices:
    A: Se le permite girar a la izquierda después de ceder el paso a todo el tráfico
      que viene en sentido contrario, ciclistas y peatones.
    B: El semáforo está averiado y debe detenerse por completo.
    C: Usted tiene el derecho de paso protegido para girar a la izquierda sin ceder
      el paso.
    D: Los giros a la izquierda están completamente prohibidos.
  answer: A
  explanation: Si ve una flecha amarilla intermitente, se le permite girar a la izquierda
    después de ceder el paso a todo el tráfico que viene en sentido contrario y a
    cualquier ciclista o peatón que se encuentre en el cruce peatonal.
- id: 341
  category: safe_driving_rules
  question: ¿Cómo debe tratar una intersección si el semáforo no funciona y la luz
    está apagada?
  choices:
    A: Continuar a través de la intersección sin detenerse si se encuentra en la carretera
      principal.
    B: Tratarla como una señal de ceda el paso (yield).
    C: Tratarla como una intersección con parada en todas las direcciones (all-way
      stop).
    D: Esperar a que llegue un oficial de policía antes de continuar.
  answer: C
  explanation: La ley del estado de Tennessee exige que si un semáforo no funciona,
    la intersección debe tratarse como si fuera una intersección con parada en todas
    las direcciones (all-way stop).
- id: 342
  category: safe_driving_rules
  question: Si dos vehículos llegan al mismo tiempo a una intersección con parada
    en todas las direcciones (all-way stop), ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    B: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    C: El vehículo que viaja a una velocidad más rápida pasa primero.
    D: El vehículo que gira a la izquierda siempre pasa primero.
  answer: A
  explanation: La ley de derecho de paso establece que si hay dos o más vehículos
    en la intersección deteniéndose al mismo tiempo, el conductor de la izquierda
    debe ceder el paso al conductor de la derecha.
- id: 343
  category: sharing_the_road
  question: ¿Cómo define la ley de Tennessee a un peatón?
  choices:
    A: Solo una persona que camina por una acera designada.
    B: Cualquier persona a pie o que utilice una silla de ruedas motorizada o no motorizada.
    C: Cualquier persona que monte en bicicleta o patineta.
    D: Cualquier persona que cruce la calle fuera de un paso de peatones.
  answer: B
  explanation: La ley de Tennessee define a un peatón como cualquier persona a pie
    o que utilice una silla de ruedas motorizada o no motorizada.
- id: 344
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio encender los faros delanteros de su vehículo por
    la noche?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: 30 minutos después del atardecer hasta 30 minutos antes del amanecer
    C: 1 hora después del atardecer hasta 1 hora antes del amanecer
    D: Solo cuando no hay alumbrado público
  answer: B
  explanation: El manual establece que los faros delanteros de su automóvil deben
    encenderse desde 30 minutos después del atardecer hasta 30 minutos antes del amanecer.
- id: 345
  category: safe_driving_rules
  question: ¿Bajo qué condiciones climáticas es obligatorio encender los faros delanteros
    durante las horas del día?
  choices:
    A: Solo cuando está nevando fuertemente
    B: Siempre que el cielo esté nublado
    C: Cuando la precipitación requiere el uso constante de los limpiaparabrisas
    D: Solo cuando se conduce por la interestatal bajo la lluvia
  answer: C
  explanation: Los faros delanteros deben encenderse durante las horas del día cuando
    la lluvia, la niebla, la nieve u otra precipitación requieran el uso constante
    de los limpiaparabrisas.
- id: 346
  category: safe_driving_rules
  question: ¿Debe encender los faros delanteros durante el día si la luz natural no
    es suficiente para ver claramente a personas o vehículos a qué distancia por delante?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los faros delanteros de su automóvil deben encenderse en cualquier
    momento en que la luz del día no sea suficiente para que usted vea claramente
    a personas o vehículos a una distancia de 200 pies por delante.
- id: 347
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a avanzar por inercia (coasting) mientras
    se viaja en una pendiente descendente?
  choices:
    A: Se recomienda para ahorrar gasolina
    B: Puede avanzar por inercia en punto muerto (neutral) pero no con el embrague
      (clutch) presionado
    C: Nunca debe avanzar por inercia con la transmisión en punto muerto (neutral)
      o el embrague (clutch) presionado
    D: Avanzar por inercia solo está permitido en carreteras con un límite de velocidad
      inferior a 45 mph
  answer: C
  explanation: Mientras viaja en una pendiente descendente, NUNCA avance por inercia
    con la transmisión del vehículo en punto muerto (neutral). Además, los conductores
    de vehículos con transmisión manual no deben avanzar por inercia con el embrague
    (clutch) presionado.
- id: 348
  category: safe_driving_rules
  question: Si un oficial de tránsito le indica que haga algo que normalmente violaría
    una norma de tránsito, ¿qué debe hacer?
  choices:
    A: Ignorar al oficial y seguir las señales de tránsito
    B: Obedecer las instrucciones del oficial en todo momento
    C: Pedir al oficial su número de placa antes de continuar
    D: Detenerse a un lado y esperar a que cambie el semáforo
  answer: B
  explanation: Debe obedecer a los oficiales de tránsito en todo momento. Habrá ocasiones
    en las que un oficial le indicará que haga algo que normalmente sería una violación
    de las normas de tránsito en caso de una emergencia.
- id: 349
  category: defensive_driving
  question: Según las estadísticas, ¿dónde ocurren la mitad de todos los choques de
    vehículos?
  choices:
    A: En las autopistas interestatales
    B: A menos de 25 millas de casa
    C: En intersecciones concurridas
    D: Durante viajes largos por carretera
  answer: B
  explanation: Las estadísticas muestran que la mitad de todos los choques de vehículos
    ocurren a menos de 25 millas de casa.
- id: 350
  category: signs_and_signals
  question: ¿Cómo puede saber por las líneas de borde que está conduciendo en sentido
    contrario en una carretera?
  choices:
    A: Tiene una línea blanca a su derecha y una línea amarilla a su izquierda
    B: Tiene una línea amarilla a su derecha y una línea blanca a su izquierda
    C: Ambas líneas de borde son blancas
    D: Ambas líneas de borde son amarillas
  answer: B
  explanation: Si alguna vez se encuentra con una línea amarilla a su derecha y una
    blanca a su izquierda, va en sentido contrario.
- id: 351
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar dos líneas amarillas continuas entre los
    carriles de tráfico?
  choices:
    A: Para rebasar a un vehículo que circula despacio
    B: Cuando no haya tráfico en sentido contrario a la vista
    C: Para girar hacia una entrada privada o camino lateral si es seguro
    D: Nunca puede cruzar dos líneas amarillas continuas bajo ninguna circunstancia
  answer: C
  explanation: Dos líneas amarillas continuas significan que NO PUEDE cruzar las líneas
    desde ninguna dirección para rebasar. Sin embargo, puede cruzar una línea amarilla
    continua para girar hacia una entrada privada o camino lateral si es seguro hacerlo.
- id: 352
  category: signs_and_signals
  question: ¿Qué significa si el centro de la calzada está marcado con una línea amarilla
    continua y una línea amarilla discontinua, y la línea discontinua está de su lado?
  choices:
    A: Se encuentra en una zona de adelantamiento y puede rebasar si es seguro
    B: No se le permite rebasar en esta área
    C: Debe prepararse para detenerse
    D: El carril es solo para girar
  answer: A
  explanation: Si la línea amarilla discontinua está de su lado, se encuentra en la
    "zona de adelantamiento" y puede rebasar si es seguro hacerlo.
- id: 353
  category: signs_and_signals
  question: ¿Qué indica una sola línea blanca continua entre carriles de tráfico que
    circulan en la misma dirección?
  choices:
    A: Puede cambiar de carril libremente para rebasar
    B: Debe permanecer en su carril y no cruzar a menos que sea una emergencia
    C: El carril está terminando y debe incorporarse a la izquierda
    D: Se está aproximando a una plaza de peaje
  answer: B
  explanation: Una línea blanca continua entre carriles de tráfico significa que debe
    permanecer en su carril y no debe cruzar la línea para rebasar (a menos que una
    situación de emergencia le obligue a cambiar de carril).
- id: 354
  category: safe_driving_rules
  question: ¿Dónde debe detener su vehículo en una intersección si no hay una línea
    de parada pintada ni un paso de peatones?
  choices:
    A: Justo después de la esquina para poder ver el tráfico con claridad
    B: Antes de que el parachoques delantero cruce la línea de borde blanca de la
      calle transversal
    C: Al menos a 10 pies de distancia de la intersección
    D: Junto al poste de la señal de pare (STOP)
  answer: B
  explanation: Si no hay una línea de parada pintada en el pavimento, todos los vehículos
    obligados a detenerse deben hacerlo antes de que el parachoques delantero cruce
    la línea de borde blanca de la calle transversal, para evitar que el vehículo
    sobresalga hacia el tráfico de la calle transversal.
- id: 355
  category: signs_and_signals
  question: ¿Qué símbolo en el pavimento designa un carril para vehículos de alta
    ocupación (HOV)?
  choices:
    A: Una cruz de San Andrés blanca
    B: Un círculo pintado con una X
    C: Una marca en forma de diamante
    D: Una flecha blanca grande
  answer: C
  explanation: Los carriles para vehículos de alta ocupación (HOV) se designan en
    las autopistas mediante una marca en forma de diamante en el centro del carril.
- id: 356
  category: signs_and_signals
  question: ¿Qué significa si su carril de circulación está marcado con una flecha
    curva y una flecha recta?
  choices:
    A: Debe girar en la dirección de la flecha
    B: Puede girar en la dirección de la flecha o seguir recto
    C: El carril está terminando y debe incorporarse
    D: Se está aproximando a una rotonda
  answer: B
  explanation: Si su carril está marcado con una flecha curva y una recta, puede girar
    en la dirección de la flecha o puede seguir recto.
- id: 357
  category: signs_and_signals
  question: ¿Qué marca en el pavimento actúa como advertencia para un cruce a nivel
    de ferrocarril y carretera?
  choices:
    A: Una forma de diamante con las letras RR
    B: Una cruz de San Andrés blanca y las letras RR
    C: Una línea amarilla continua con una X roja
    D: Una doble línea blanca continua
  answer: B
  explanation: Una cruz de San Andrés blanca y las letras RR están pintadas en el
    pavimento como marcador de advertencia para muchos cruces a nivel de ferrocarril
    y carretera.
- id: 358
  category: signs_and_signals
  question: ¿Qué significa una señal peatonal que muestra el símbolo de una mano levantada?
  choices:
    A: Los peatones tienen el derecho de paso para cruzar
    B: No es seguro comenzar a cruzar la calle
    C: Los peatones deben cruzar la intersección rápidamente corriendo
    D: Los vehículos deben detenerse y esperar a que los peatones se acerquen
  answer: B
  explanation: Cuando la señal peatonal muestra las palabras "DON’T WALK" (NO CRUCE)
    o aparece el símbolo de una mano levantada, no es seguro comenzar a cruzar una
    calle o intersección.
- id: 359
  category: safe_driving_rules
  question: ¿Cuándo es obligatorio encender los faros del automóvil para uso nocturno
    en Tennessee?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: 30 minutos después del atardecer hasta 30 minutos antes del amanecer
    C: 1 hora después del atardecer hasta 1 hora antes del amanecer
    D: Solo cuando esté completamente oscuro afuera
  answer: B
  explanation: Según el manual, los faros de su automóvil deben encenderse desde 30
    minutos después del atardecer hasta 30 minutos antes del amanecer.
- id: 360
  category: safe_driving_rules
  question: 'En Tennessee, la ley le obliga a encender los faros durante el día o
    en condiciones climáticas adversas cuando:'
  choices:
    A: Conduce por cualquier autopista interestatal.
    B: Se requiere el uso constante de los limpiaparabrisas debido a la precipitación.
    C: Conduce en el carril del extremo izquierdo de una carretera de varios carriles.
    D: Se aproxima a un cortejo fúnebre debidamente identificado.
  answer: B
  explanation: El manual establece que los faros deben encenderse cuando la lluvia,
    la niebla, la nieve u otra precipitación requieran el uso constante de los limpiaparabrisas.
- id: 361
  category: safe_driving_rules
  question: ¿Cuándo debe atenuar o bajar las luces altas de su vehículo?
  choices:
    A: Cuando un vehículo que viene en sentido contrario está a menos de 500 pies.
    B: Cuando un vehículo que viene en sentido contrario está a menos de 200 pies.
    C: Cuando un vehículo que viene en sentido contrario está a menos de 1,000 pies.
    D: Solo cuando se conduce en áreas urbanas congestionadas.
  answer: A
  explanation: Debe atenuar o bajar las luces cuando un vehículo que viene en sentido
    contrario se encuentre a menos de 500 pies (aproximadamente la distancia de una
    cuadra de la ciudad) o cuando esté siguiendo a otro vehículo a menos de 500 pies.
- id: 362
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de las luces de estacionamiento mientras se conduce?
  choices:
    A: Deben usarse en lugar de los faros delanteros en caso de niebla densa.
    B: Es ilegal conducir un vehículo solo con las luces de estacionamiento encendidas
      por la noche o en condiciones climáticas adversas.
    C: Hacen que su vehículo parezca estar más cerca de otros conductores de lo que
      realmente está.
    D: Es obligatorio que estén encendidas en todo momento cuando se conduce en una
      zona escolar.
  answer: B
  explanation: 'El manual establece: ''No conduzca un vehículo solo con las luces
    de estacionamiento encendidas cuando conduzca de noche o con mal tiempo... el
    uso de las luces de estacionamiento por sí solas no solo es inseguro, sino que
    es contra la ley''.'
- id: 363
  category: vehicle_information
  question: 'A partir del 1 de enero de 2018, las luces de encendido constante que
    se muestran en la parte delantera de un vehículo en Tennessee deben ser:'
  choices:
    A: Blancas o ámbar
    B: Rojas o azules
    C: Verdes o amarillas
    D: De cualquier color, siempre que no parpadeen
  answer: A
  explanation: A partir del 1 de enero de 2018, ningún vehículo operado en Tennessee
    estará equipado con luces de encendido constante que se muestren hacia la parte
    delantera del vehículo en cualquier color que no sea blanco o ámbar (o una combinación
    de ambos).
- id: 364
  category: penalties_and_points
  question: ¿Cuáles son las multas potenciales por una condena por arrojar basura
    en Tennessee?
  choices:
    A: $10 a $500
    B: $50 a $3,000
    C: $100 a $5,000
    D: $250 a $10,000
  answer: B
  explanation: Arrojar basura va en contra de la ley estatal. Las multas comienzan
    en $50 y pueden llegar hasta $3,000 según la cantidad de basura.
- id: 365
  category: safe_driving_rules
  question: ¿Qué exige la ley de Tennessee a cualquier vehículo motorizado que transporte
    material que pueda caerse o salir volando hacia la carretera?
  choices:
    A: El material debe estar sujeto con cuerdas elásticas (bungees).
    B: El vehículo debe viajar al menos 10 mph por debajo del límite de velocidad.
    C: El material debe estar en un espacio cerrado o totalmente cubierto por una
      lona.
    D: El vehículo debe mostrar una señal de 'Vehículo de movimiento lento'.
  answer: C
  explanation: La ley de Tennessee exige que cualquier vehículo motorizado que transporte
    basura o cualquier material que pueda caerse o salir volando hacia la carretera,
    debe estar en un espacio cerrado o totalmente cubierto por una lona.
- id: 366
  category: safe_driving_rules
  question: 'Se considera que usted conduce un vehículo de movimiento lento si viaja
    a una velocidad que es:'
  choices:
    A: 5 mph o más por debajo de la velocidad máxima legal.
    B: 10 mph o más por debajo de la velocidad máxima legal.
    C: 15 mph o más por debajo de la velocidad máxima legal.
    D: 20 mph o más por debajo de la velocidad máxima legal.
  answer: B
  explanation: Se considera que usted conduce un vehículo de movimiento lento si viaja
    a una velocidad que es 10 millas por hora o más inferior a la velocidad máxima
    legal.
- id: 367
  category: sharing_the_road
  question: Si conduce un vehículo de movimiento lento, ¿cuándo debe girar o salir
    de la calzada de forma segura?
  choices:
    A: Cuando 2 o más vehículos estén alineados detrás de usted.
    B: Cuando 3 o más vehículos estén alineados detrás de usted.
    C: Cuando 5 o más vehículos estén alineados detrás de usted.
    D: Cuando 10 o más vehículos estén alineados detrás de usted.
  answer: C
  explanation: 'El manual establece: ''Si cinco o más vehículos están alineados detrás
    de usted, gire o salga de la calzada tan pronto como pueda hacerlo de manera segura''.'
- id: 368
  category: sharing_the_road
  question: ¿Cuál es la regla para adelantar a un cortejo fúnebre en una carretera
    de dos carriles en Tennessee?
  choices:
    A: Puede adelantar si toca la bocina primero.
    B: Puede adelantar solo si el cortejo viaja a menos de 45 mph.
    C: Los vehículos que siguen al cortejo no pueden intentar adelantarlo.
    D: Puede adelantar si enciende sus luces de emergencia.
  answer: C
  explanation: La ley de Tennessee indica que los vehículos que siguen a un cortejo
    fúnebre en una carretera de dos carriles no pueden intentar adelantar a dicho
    cortejo.
- id: 369
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe mejor la Regla de Velocidad
    Básica (BSR)?
  choices:
    A: Es una ley estricta de Tennessee que establece límites de velocidad exactos
      para todas las carreteras.
    B: Enseña que la velocidad a la que puede conducir está limitada por las condiciones
      actuales.
    C: Exige que todos los conductores viajen exactamente al límite de velocidad indicado.
    D: Establece que conducir más lento siempre es más seguro.
  answer: B
  explanation: La Regla de Velocidad Básica (BSR) no es una ley de Tennessee, sino
    un principio general de seguridad. No establece un límite de velocidad exacto;
    en cambio, enseña que la velocidad a la que puede conducir está limitada por las
    condiciones actuales.
- id: 370
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    las carreteras estatales y federales primarias y secundarias en Tennessee?
  choices:
    A: 45 m.p.h.
    B: 55 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: B
  explanation: A menos que se indique lo contrario, el límite de velocidad en las
    carreteras estatales y federales primarias y secundarias es de 55 m.p.h.
- id: 371
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima establecida por la ley de Tennessee para
    las autopistas interestatales?
  choices:
    A: 55 m.p.h.
    B: 60 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: D
  explanation: La velocidad máxima establecida por la ley de Tennessee para las autopistas
    interestatales es de 70 m.p.h., la cual está señalizada en la mayoría de los tramos
    rurales.
- id: 372
  category: safe_driving_rules
  question: Bajo condiciones normales de conducción, ¿es ilegal conducir a menos de
    qué velocidad en el carril del extremo izquierdo de cualquier autopista interestatal
    en Tennessee?
  choices:
    A: 45 m.p.h.
    B: 50 m.p.h.
    C: 55 m.p.h.
    D: 65 m.p.h.
  answer: C
  explanation: Es ilegal que cualquier persona conduzca un vehículo a menos de 55
    m.p.h. en el carril del extremo izquierdo de cualquier autopista interestatal,
    a menos que la congestión y el flujo del tráfico impidan una conducción segura
    a dicha velocidad.
- id: 373
  category: safe_driving_rules
  question: En las autopistas interestatales de Tennessee, ¿cuál es el límite de velocidad
    mínima en el carril o carriles de la derecha bajo condiciones normales de conducción?
  choices:
    A: 35 m.p.h.
    B: 40 m.p.h.
    C: 45 m.p.h.
    D: 55 m.p.h.
  answer: C
  explanation: En las autopistas interestatales, el límite de velocidad mínima en
    el carril o carriles de la derecha es de 45 m.p.h., y bajo condiciones normales
    de conducción, todos los vehículos deben circular al menos a esta velocidad.
- id: 374
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceder el límite de velocidad en una zona escolar
    en Tennessee?
  choices:
    A: La adición automática de dos puntos a su historial de conducción
    B: La adición automática de cuatro puntos a su historial de conducción
    C: La adición automática de seis puntos a su historial de conducción
    D: Una suspensión automática de la licencia por 30 días
  answer: C
  explanation: Según el manual, la sanción por exceder el límite de velocidad en una
    zona escolar incluye la adición automática de seis puntos a su historial de conducción,
    lo que resulta en el envío de una carta de advertencia.
- id: 375
  category: penalties_and_points
  question: 'Por ley, exceder el límite de velocidad en una zona escolar se considera:'
  choices:
    A: Conducción descuidada
    B: Conducción temeraria (reckless driving)
    C: Conducción agresiva
    D: Una infracción de tráfico menor
  answer: B
  explanation: El manual establece que exceder el límite de velocidad en una zona
    escolar se considera por ley como conducción temeraria (reckless driving).
- id: 376
  category: penalties_and_points
  question: ¿Cuáles son las multas mínimas y máximas por violar el límite de velocidad
    señalizado en zonas de obras activas en Tennessee?
  choices:
    A: $50 de mínima y $250 de máxima
    B: $100 de mínima y $300 de máxima
    C: $250 de mínima y $500 de máxima
    D: $500 de mínima y $1,000 de máxima
  answer: C
  explanation: La ley de Tennessee exige una multa mínima de $250 dólares y hasta
    una multa máxima de $500 dólares por violaciones del límite de velocidad señalizado
    en zonas de obras activas.
- id: 377
  category: signs_and_signals
  question: ¿Cómo pueden los conductores reconocer fácilmente las zonas de obras en
    las autopistas?
  choices:
    A: Por la presencia de señales y dispositivos azules y blancos
    B: Por la presencia de señales, dispositivos y vestimenta de color naranja o verde
      amarillento
    C: Por la presencia de señales rojas sólidas y luces verdes intermitentes
    D: Por la presencia de banderas a cuadros blancos y negros
  answer: B
  explanation: Las zonas de obras en las autopistas se reconocen fácilmente por la
    presencia de señales de color naranja (o verde amarillento) y otros dispositivos
    de control de tráfico de color naranja, luces intermitentes en los equipos y trabajadores
    vestidos con ropa de alta visibilidad (naranja o verde amarillento).
- id: 378
  category: vehicle_information
  question: Por ley, ¿qué equipo de frenado deben tener todos los automóviles?
  choices:
    A: Solo un freno de pie regular
    B: Dos métodos separados para aplicar los frenos, comúnmente un freno de pie y
      un freno de estacionamiento o de emergencia
    C: Un sistema de frenos antibloqueo (ABS) y un freno de pie
    D: Frenos de disco delanteros y frenos de tambor traseros
  answer: B
  explanation: Por ley, todos los automóviles deben tener dos métodos separados para
    aplicar los frenos. Comúnmente, estos son los frenos regulares del vehículo (freno
    de pie) y un freno de estacionamiento o de emergencia.
- id: 379
  category: defensive_driving
  question: Si su vehículo NO tiene frenos antibloqueo y comienza a derrapar, ¿qué
    debe hacer generalmente?
  choices:
    A: Bombear los frenos lo más rápido posible
    B: Pisar los frenos a fondo y mantener el volante recto
    C: Quitar el pie del freno y girar el volante en la dirección del derrape
    D: Acelerar rápidamente para recuperar la tracción
  answer: C
  explanation: Como regla general para vehículos sin frenos antibloqueo, si el automóvil
    comienza a derrapar, quite el pie del freno y gire el volante en la dirección
    del derrape, si es seguro hacerlo.
- id: 380
  category: vehicle_information
  question: 'Al reducir la velocidad o detener un vehículo equipado con un sistema
    de frenos antibloqueo (ABS), usted debe:'
  choices:
    A: Bombear el pedal del freno rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Tocar el pedal del freno repetidamente y con suavidad
    D: Quitar el pie del pedal si siente vibración
  answer: B
  explanation: Al reducir la velocidad o detenerse con ABS, aplique una presión firme
    y constante al pedal del freno. Nunca bombee el pedal cuando use ABS.
- id: 381
  category: vehicle_information
  question: ¿Qué debe esperar sentir cuando el sistema de frenos antibloqueo (ABS)
    está en uso?
  choices:
    A: El volante se bloqueará en su lugar
    B: El pedal del freno se irá completamente al piso sin resistencia
    C: Ruido y vibración en el pedal del freno
    D: El motor se detendrá temporalmente
  answer: C
  explanation: Espere ruido y vibración en el pedal del freno cuando el ABS esté en
    uso. Estas sensaciones le indican que el ABS está funcionando.
- id: 382
  category: safe_driving_rules
  question: ¿Qué significa el término "apoyar el pie en el freno" (riding the brake)?
  choices:
    A: Mantener el pie suspendido sobre el pedal del freno para una respuesta más
      rápida
    B: Mantener el pie apoyado o ligeramente presionado sobre el pedal del freno
    C: Presionar los pedales de freno y acelerador al mismo tiempo
    D: Bombear el pedal del freno repetidamente mientras se baja una colina
  answer: B
  explanation: '"Apoyar el pie en el freno" consiste en mantener el pie descansando
    o ligeramente presionado sobre el freno. Esto aumenta el desgaste y da una impresión
    falsa a otros conductores.'
- id: 383
  category: defensive_driving
  question: ¿Se considera una práctica de conducción segura "cubrir el freno" (covering
    the brake)?
  choices:
    A: Sí, permite un tiempo de respuesta más rápido en situaciones como al acercarse
      a intersecciones
    B: No, causa un desgaste excesivo en el sistema de frenos
    C: No, da a otros conductores la falsa impresión de que una parada es inminente
    D: Sí, pero solo cuando se conduce en autopistas interestatales
  answer: A
  explanation: Cubrir el freno significa que el pie del conductor se mantiene suspendido
    sobre el freno para un tiempo de respuesta más rápido. El manual establece que
    cubrir el freno es a menudo una práctica de conducción inteligente y segura.
- id: 384
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura en condiciones normales
    de conducción, los conductores deben usar:'
  choices:
    A: La regla de un segundo
    B: La regla de los dos segundos
    C: La regla de los cinco segundos
    D: La regla de los diez segundos
  answer: B
  explanation: A nivel nacional, las agencias de seguridad recomiendan una distancia
    de seguimiento segura. El manual aconseja usar la Regla de los Dos Segundos para
    determinar si está siguiendo demasiado de cerca.
- id: 385
  category: defensive_driving
  question: 'Durante condiciones climáticas adversas, conducción en autopistas interestatales
    a velocidades más altas o conducción nocturna, la distancia de seguimiento debe
    aumentarse a un mínimo de:'
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Durante el mal tiempo, la conducción por autopistas a velocidades más
    altas y la conducción nocturna, la regla de los dos segundos debe aumentarse a
    un mínimo de cuatro segundos para permitir un mejor tiempo de reacción.
- id: 386
  category: defensive_driving
  question: En los tres pasos para detener un vehículo, ¿qué es el "tiempo de percepción"
    (perception time)?
  choices:
    A: El tiempo que toma mover el pie del acelerador al pedal del freno
    B: El tiempo que le toma a un conductor ver y reconocer una situación peligrosa
    C: La distancia que recorre el auto mientras se aplican los frenos
    D: El tiempo que tardan las pastillas de freno del vehículo en acoplarse a los
      rotores
  answer: B
  explanation: El tiempo de percepción se define como el tiempo que le toma a un conductor
    ver y reconocer una situación peligrosa.
- id: 387
  category: safe_driving_rules
  question: ¿Cuál es una consecuencia muy común de que los conductores sigan demasiado
    de cerca (tailgating)?
  choices:
    A: Mejora el flujo de tráfico pesado
    B: Le da al conductor una mejor visión de las condiciones de la carretera más
      adelante
    C: Provoca choques por alcance (traseros)
    D: Aumenta la eficiencia de combustible del vehículo
  answer: C
  explanation: El manual señala que los choques por alcance son muy comunes y la mayoría
    de estos choques son causados por conductores que están siguiendo demasiado de
    cerca (tailgating).
- id: 388
  category: vehicle_information
  question: Al acercarse a una señal de alto en un vehículo con transmisión estándar,
    ¿qué debe hacer para reducir la velocidad?
  choices:
    A: Poner punto muerto (neutral) y avanzar por inercia hasta la señal de alto
    B: Apagar el motor para ahorrar combustible
    C: Parpadear las luces de freno para avisar a los autos detrás de usted y luego
      reducir a una marcha inferior
    D: Mantener presionado el embrague (clutch) hasta que el vehículo se detenga por
      completo
  answer: C
  explanation: Con una transmisión estándar, puede usar el cambio de marchas para
    reducir la velocidad. Primero, parpadee las luces de freno para avisar a los autos
    detrás de usted. Luego, reduzca a una marcha inferior.
- id: 389
  category: safe_driving_rules
  question: ¿Cuáles son los tres pasos involucrados para detener un vehículo?
  choices:
    A: Tiempo de observación, tiempo de desaceleración y tiempo de parada
    B: Tiempo de percepción, tiempo de reacción y tiempo de frenado
    C: Tiempo de frenado, tiempo de derrape y tiempo de parada
    D: Tiempo de reacción, tiempo de desaceleración y tiempo de descanso
  answer: B
  explanation: 'Según el manual, hay tres pasos para detener un vehículo: tiempo de
    percepción, tiempo de reacción y tiempo de frenado.'
- id: 390
  category: safe_driving_rules
  question: ¿Cuál es el tiempo de reacción promedio desde la percepción del peligro
    hasta el inicio del frenado?
  choices:
    A: 1/2 de segundo
    B: 2/3 de segundo
    C: 1 segundo
    D: 1.16 segundos
  answer: B
  explanation: El manual establece que el tiempo de reacción es el tiempo desde la
    percepción del peligro hasta el inicio del frenado, y el promedio es de 2/3 de
    segundo.
- id: 391
  category: vehicle_information
  question: ¿Cuál de los siguientes NO figura como un factor que puede variar ampliamente
    la distancia de frenado de un vehículo?
  choices:
    A: Tipo y estado de la carretera o pavimento
    B: Diseño del vehículo y estado de los amortiguadores
    C: El color y la visibilidad del vehículo
    D: Peso del vehículo cuando está cargado o remolcando
  answer: C
  explanation: La distancia de frenado varía debido a factores como el estado de la
    carretera, los neumáticos/frenos, los amortiguadores y el peso del vehículo. El
    color del vehículo no figura como un factor.
- id: 392
  category: signs_and_signals
  question: ¿Dónde debe detener su vehículo ante una señal de alto (stop) si no hay
    marcas en el pavimento ni un paso de peatones presente?
  choices:
    A: Diez pies antes de la señal de alto
    B: Cuando la parte delantera de su vehículo esté a la altura de la ubicación de
      la señal de alto al borde de la carretera
    C: Directamente debajo de la señal de alto
    D: En el borde exacto de la calzada que se cruza
  answer: B
  explanation: 'El manual establece: ''Si no hay marcas en el pavimento, deténgase
    cuando la parte delantera de su vehículo esté a la altura de la ubicación de la
    señal de alto al borde de la carretera''.'
- id: 393
  category: defensive_driving
  question: Al detenerse detrás de otro vehículo en una intersección, ¿cuál es una
    regla general básica para mantener un espacio de 'brecha' seguro?
  choices:
    A: Debe estar al menos a una distancia de un automóvil detrás del vehículo.
    B: Debería poder ver la placa de matrícula y/o la llanta trasera del otro vehículo
      donde toca el pavimento.
    C: Debe dejar exactamente 15 pies de espacio entre los vehículos.
    D: Debe estar lo suficientemente cerca para leer la fecha de vencimiento de su
      placa de matrícula.
  answer: B
  explanation: Una regla general básica es que debería poder ver la placa de matrícula
    y/o la llanta trasera del otro vehículo donde toca el pavimento para proporcionar
    una zona de seguridad.
- id: 394
  category: signs_and_signals
  question: ¿Cómo debe responder un conductor ante un semáforo en rojo intermitente?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Ceder el paso al tráfico de la derecha, pero no se requiere una parada.
    C: Detenerse por completo, al igual que con una señal de alto.
    D: Detenerse solo si hay peatones presentes en el paso de peatones.
  answer: C
  explanation: 'El manual establece explícitamente: ''Se requiere una parada completa
    ante un semáforo en rojo intermitente, al igual que con una señal de alto''.'
- id: 395
  category: safe_driving_rules
  question: ¿Cómo definen la mayoría de los oficiales de la ley e instructores de
    educación vial una parada completa?
  choices:
    A: Cuando el velocímetro marca exactamente cero durante tres segundos.
    B: Cuando el conductor siente que el automóvil da un pequeño tirón hacia adelante
      después de que todo movimiento ha cesado.
    C: Cuando el vehículo ha reducido su velocidad a menos de 5 mph.
    D: Cuando el conductor pone el vehículo en posición de estacionamiento (park).
  answer: B
  explanation: La mayoría de los oficiales de la ley e instructores coinciden en que
    un vehículo no se ha detenido por completo hasta que el conductor siente que el
    automóvil da un pequeño tirón hacia adelante después de que todo movimiento ha
    cesado.
- id: 396
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril y viene un tren, ¿dónde debe detener
    su vehículo?
  choices:
    A: Entre 10 y 30 pies de las vías del tren
    B: Entre 15 y 50 pies de las vías del tren
    C: Exactamente a 50 pies de las vías del tren
    D: Al menos a 100 pies de las vías del tren
  answer: B
  explanation: Cuando se acerque a un cruce de ferrocarril y venga un tren, debe detenerse
    entre 15 y 50 pies de las vías del tren.
- id: 397
  category: sharing_the_road
  question: ¿A qué distancia aproximada están obligados los trenes a hacer sonar su
    bocina antes de pasar por un cruce de ferrocarril?
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: C
  explanation: Los trenes están obligados a hacer sonar una bocina cuando se encuentran
    a aproximadamente 1,500 pies de pasar por un cruce de ferrocarril.
- id: 398
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado por la ley de Tennessee
    a detenerse antes de cruzar CUALQUIER paso a nivel de ferrocarril, incluso si
    no hay señales activadas?
  choices:
    A: Cualquier vehículo de pasajeros que transporte niños
    B: Autobuses escolares o de iglesias, independientemente de si transportan pasajeros
    C: Todos los camiones de entrega comercial
    D: Cualquier vehículo que remolque un tráiler
  answer: B
  explanation: La ley exige que los autobuses escolares o de iglesias se detengan
    antes de cruzar CUALQUIER paso a nivel de ferrocarril, independientemente de si
    dichos autobuses transportan pasajeros en ese momento.
- id: 399
  category: safe_driving_rules
  question: ¿Cómo define el Código de Tennessee una 'parada' (stop)?
  choices:
    A: Reducir la velocidad a una velocidad inferior a 3 mph
    B: Cese completo del movimiento
    C: Hacer una pausa de al menos dos segundos
    D: Ceder el paso a todo el tráfico que se aproxima
  answer: B
  explanation: El Código de Tennessee define 'parada' como el 'cese completo del movimiento'.
- id: 400
  category: signs_and_signals
  question: Si una intersección tiene un paso de peatones marcado, ¿dónde debe detener
    su vehículo?
  choices:
    A: Dentro del paso de peatones para tener una mejor vista del tráfico
    B: Justo después del paso de peatones
    C: Antes de que la parte delantera de su vehículo llegue a la línea blanca más
      cercana que marca el borde del paso de peatones
    D: A la altura de la señal de alto, independientemente de las líneas del paso
      de peatones
  answer: C
  explanation: Si la intersección tiene un paso de peatones marcado en el pavimento,
    debe detenerse antes de que la parte delantera de su vehículo llegue a la línea
    blanca más cercana que marca el borde del paso de peatones.
- id: 401
  category: safe_driving_rules
  question: ¿Según el ejemplo del manual, cuál es la distancia total de detención
    para un vehículo que viaja a 70 m.p.h. en una buena carretera con buen clima después
    de que aparece repentinamente un peligro?
  choices:
    A: 128 pies
    B: 200 pies
    C: 290 pies
    D: 418 pies
  answer: D
  explanation: A 70 m.p.h., usted recorre 128 pies antes de frenar, y la distancia
    de frenado es de 290 pies, lo que hace que la distancia total de detención sea
    de 418 pies.
- id: 402
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una consecuencia potencial de realizar una
    'parada incompleta' (rolling stop)?
  choices:
    A: Reprobar el examen práctico de conducir
    B: Recibir una multa de tráfico
    C: Ser considerado totalmente responsable por la policía y las compañías de seguros
      en caso de un choque
    D: Todas las anteriores
  answer: D
  explanation: Las paradas incompletas son motivo para recibir una multa de tráfico,
    reprobar el examen práctico y ser considerado totalmente responsable en caso de
    un choque.
- id: 403
  category: penalties_and_points
  question: ¿Cuál es la sanción por no detenerse ante un autobús escolar detenido?
  choices:
    A: Delito menor de Clase B y una multa de $100
    B: Delito menor de Clase C y una multa de $50
    C: Delito menor de Clase A y una multa de entre $250 y $1,000
    D: Delito grave y una multa de $2,000
  answer: C
  explanation: El manual establece que es un delito menor de Clase A y el conductor
    puede ser multado con entre $250 y $1,000 por no detenerse ante un autobús escolar
    detenido.
- id: 404
  category: safe_driving_rules
  question: Al conducir en una carretera con un carril central compartido para girar
    (un quinto carril), ¿qué debe hacer al encontrarse con un autobús escolar detenido
    con luces rojas intermitentes?
  choices:
    A: Continuar con precaución sin detenerse
    B: Detenerse solo si viaja en la misma dirección que el autobús
    C: Reducir la velocidad a 15 mph y continuar
    D: Detenerse en ambas direcciones porque un carril de giro no se considera una
      barrera
  answer: D
  explanation: Un carril de giro en medio de una carretera de cuatro carriles NO se
    considera una barrera. Los conductores que se encuentren con un autobús escolar
    detenido en este tipo de vía estarían obligados a detenerse en ambas direcciones.
- id: 405
  category: signs_and_signals
  question: ¿Qué indican las luces amarillas intermitentes en la parte delantera y
    trasera de un autobús escolar?
  choices:
    A: El autobús se está preparando para detenerse para subir o bajar niños
    B: El autobús se ha detenido y los niños están subiendo o bajando
    C: El autobús tiene dificultades mecánicas
    D: El autobús está retrocediendo
  answer: A
  explanation: Cuando las luces amarillas en la parte delantera y trasera del autobús
    parpadean, el autobús se está preparando para detenerse para subir o bajar niños.
    Los automovilistas deben reducir la velocidad y prepararse para detenerse.
- id: 406
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene en una intersección para subir y
    bajar niños, ¿qué conductores están obligados a detenerse?
  choices:
    A: Solo los conductores detrás del autobús
    B: Solo los conductores que se aproximan desde la dirección opuesta
    C: Los conductores de TODAS las direcciones
    D: Solo los conductores que giran hacia la calle donde el autobús está detenido
  answer: C
  explanation: Cuando un autobús escolar se detiene en una intersección para subir
    y bajar niños, los conductores de TODAS las direcciones deben detenerse hasta
    que el autobús reanude la marcha.
- id: 407
  category: driver_responsibility
  question: Si un oficial de policía lo detiene después de que oscurezca, ¿qué debe
    hacer antes de que el oficial se acerque?
  choices:
    A: Apagar sus faros delanteros
    B: Encender la luz interior de su vehículo
    C: Salir del vehículo para saludar al oficial
    D: Tocar la bocina para reconocer la detención
  answer: B
  explanation: El manual aconseja que si la detención se realiza después de que oscurezca,
    debe encender la luz interior del vehículo antes de que el oficial se acerque.
- id: 408
  category: defensive_driving
  question: ¿Qué debe hacer si un patrullero NO IDENTIFICADO le indica que se detenga
    por la noche y se siente inseguro?
  choices:
    A: Acelerar para alejarse del auto no identificado
    B: Detenerse inmediatamente en medio de la carretera
    C: Conducir lentamente una distancia corta hasta el área poblada más cercana
    D: Negarse a detenerse hasta que llegue una patrulla identificada
  answer: C
  explanation: Si un patrullero NO IDENTIFICADO le indica que se detenga, puede conducir
    lentamente una distancia corta hasta el área más cercana donde haya otras personas,
    como el estacionamiento de un negocio o la siguiente salida.
- id: 409
  category: driver_responsibility
  question: 'Cuando lo detiene un oficial de policía, los conductores deben:'
  choices:
    A: Mantener las manos ocultas hasta que se les pida que las muestren
    B: Mantener las manos en el volante
    C: Buscar inmediatamente en la guantera su registro
    D: Salir del vehículo para inspeccionar la parte trasera del auto
  answer: B
  explanation: Durante una detención de tráfico, los conductores deben mantener las
    manos en el volante y los pasajeros deben mantener las manos a la vista.
- id: 410
  category: safe_driving_rules
  question: Según la regla de Izquierda-Derecha-Izquierda para las intersecciones,
    ¿hacia dónde debe mirar primero?
  choices:
    A: A la derecha
    B: A la izquierda
    C: Hacia adelante
    D: En su espejo retrovisor
  answer: B
  explanation: La regla de Izquierda-Derecha-Izquierda establece que primero debe
    mirar a la izquierda para asegurarse de que el tráfico transversal esté cediendo
    el paso, luego mirar a la derecha y después a la izquierda nuevamente.
- id: 411
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los cambios
    de carril y al rebasar en una intersección?
  choices:
    A: Puede rebasar a un vehículo en una intersección si la luz está en verde
    B: Debe realizar cambios de carril de último momento al comenzar a cruzar una
      intersección
    C: NO debe rebasar a un vehículo en una intersección
    D: Puede cambiar de carril en una intersección si usa su luz direccional
  answer: C
  explanation: 'El manual establece explícitamente: "NO realice cambios de carril
    de último momento al comenzar a cruzar una intersección. NO rebase a un vehículo
    en una intersección".'
- id: 412
  category: defensive_driving
  question: ¿Qué porcentaje de todos los choques de vehículos motorizados ocurre en
    las intersecciones?
  choices:
    A: 10 por ciento
    B: 21 por ciento
    C: 33 por ciento
    D: 50 por ciento
  answer: C
  explanation: Las intersecciones constituyen una parte muy pequeña de los sistemas
    de calles y carreteras, pero están implicadas en el 33 por ciento de todos los
    choques de vehículos motorizados.
- id: 413
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe mejor la ley con respecto al
    derecho de paso?
  choices:
    A: La ley otorga el derecho de paso al vehículo más grande
    B: La ley no otorga el derecho de paso a nadie, solo dice quién debe cederlo
    C: La ley otorga el derecho de paso al vehículo que viaja más rápido
    D: La ley otorga el derecho de paso a los peatones en todas las situaciones, independientemente
      de las señales de tráfico
  answer: B
  explanation: La ley realmente no otorga el derecho de paso a nadie. Solo dice quién
    debe ceder el derecho de paso. Piense en el derecho de paso como algo que se debe
    dar, no tomar.
- id: 414
  category: safe_driving_rules
  question: ¿Bajo qué condición NO se requiere que usted se detenga ante un autobús
    escolar detenido con luces rojas intermitentes?
  choices:
    A: Cuando viaja en una carretera de dos carriles en la dirección opuesta
    B: Cuando llega tarde al trabajo
    C: Cuando conduce por una carretera con calzadas separadas divididas por una barrera
      no apta para el tráfico vehicular
    D: Cuando el autobús está detenido en una intersección
  answer: C
  explanation: Al conducir por una carretera con calzadas separadas para el tráfico
    en direcciones opuestas, divididas por un espacio mediano o una barrera no apta
    para el tráfico vehicular, el conductor no necesita detenerse, pero debe proceder
    con precaución.
- id: 415
  category: safe_driving_rules
  question: ¿Es legal avanzar hacia una intersección y bloquearla después de que los
    semáforos hayan cambiado?
  choices:
    A: Sí, si entró en la intersección mientras la luz estaba en amarillo
    B: Sí, si no hay señales colocadas que adviertan 'No bloquear la intersección'
    C: No, siempre es ilegal bloquear una intersección, esté marcada o no
    D: No, a menos que esté conduciendo un vehículo comercial
  answer: C
  explanation: No es solo sentido común, sino que también es ilegal bloquear una intersección
    después de que la luz ha cambiado. Siempre es ilegal bloquear una intersección,
    ya sea que esté marcada o no.
- id: 416
  category: driver_responsibility
  question: 'Si tiene un permiso para portar armas de fuego y está armado cuando un
    oficial de policía lo detiene, usted debe:'
  choices:
    A: Esconder el arma debajo del asiento
    B: Informar al oficial que tiene un permiso y que está armado
    C: Entregar el arma al oficial de inmediato
    D: Esperar hasta que el oficial pregunte si tiene un arma antes de mencionarlo
  answer: B
  explanation: El manual establece que los conductores deben informar a los oficiales
    si tienen un permiso para portar armas de fuego y si están armados.
- id: 417
  category: safe_driving_rules
  question: Según la ley de Tennessee, ¿a quién se le otorga legalmente el derecho
    de paso?
  choices:
    A: Al conductor que llega primero a la intersección
    B: A los peatones en todas las situaciones
    C: La ley no otorga el derecho de paso a nadie; solo dice quién debe cederlo
    D: Al vehículo de la derecha
  answer: C
  explanation: El manual establece que la ley realmente no otorga el derecho de paso
    a nadie. Solo dice quién debe ceder el derecho de paso.
- id: 418
  category: sharing_the_road
  question: Cuando un peatón ciego o con discapacidad visual que utiliza un perro
    guía o un bastón blanco está cruzando la calzada, ¿a qué distancia mínima debe
    detenerse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: Debe tomar precauciones especiales para evitar lesiones a un peatón
    ciego o con discapacidad visual y detenerse al menos a 10 pies de distancia hasta
    que la persona esté fuera de la calzada.
- id: 419
  category: sharing_the_road
  question: ¿Cómo puede un conductor identificar a un peatón con discapacidad auditiva
    que requiere precauciones especiales de derecho de paso?
  choices:
    A: Llevan un bastón blanco con punta roja
    B: Llevan un chaleco amarillo reflectante
    C: Van acompañados de un perro con una correa de color naranja intenso (blaze
      orange)
    D: Utilizan una silla de ruedas motorizada
  answer: C
  explanation: El manual especifica que debe ceder el paso a una persona con discapacidad
    auditiva con un perro con una correa de color naranja intenso que cruce cualquier
    parte de la calzada.
- id: 420
  category: safe_driving_rules
  question: ¿Cuándo es legal conducir su vehículo sobre una acera?
  choices:
    A: Al evitar un embotellamiento de tráfico
    B: Al estacionar su vehículo en una zona concurrida del centro
    C: Solo al cruzarla para entrar o salir de una entrada para autos, callejón o
      estacionamiento
    D: Nunca es legal conducir sobre una acera bajo ninguna circunstancia
  answer: C
  explanation: Es ilegal conducir sobre una acera excepto para cruzarla, como al entrar
    o salir de una entrada para autos, callejón o estacionamiento.
- id: 421
  category: safe_driving_rules
  question: En una intersección en "T" donde una carretera termina en otra vía principal
    de cruce, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo en la carretera que termina debe ceder el paso al tráfico en la
      carretera principal
    B: Los vehículos en la carretera principal deben ceder el paso al vehículo en
      la carretera que termina
    C: El vehículo que llega primero a la intersección
    D: El vehículo que realiza un giro a la derecha
  answer: A
  explanation: En las intersecciones en "T" donde una carretera termina en otra vía
    principal de cruce, los vehículos en la carretera que termina deben ceder el paso
    al tráfico que viene en ambas direcciones por la carretera principal.
- id: 422
  category: defensive_driving
  question: ¿Qué debe hacer si el tráfico delante de usted está congestionado y no
    puede atravesar completamente una intersección?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje
    B: Esperar hasta que el tráfico se despeje para no bloquear la intersección
    C: Avanzar lentamente y tocar la bocina
    D: Entrar en la intersección y encender las luces de emergencia
  answer: B
  explanation: No entre en una intersección a menos que pueda atravesarla sin tener
    que detenerse. Debe esperar hasta que el tráfico delante de usted se despeje para
    no bloquear la intersección.
- id: 423
  category: sharing_the_road
  question: ¿Qué debe hacer cuando se aproxima un vehículo de emergencia con sirena
    o luces intermitentes?
  choices:
    A: Detenerse inmediatamente en su carril actual
    B: Aumentar la velocidad para mantenerse por delante del vehículo de emergencia
    C: Conducir hasta una posición paralela y lo más cerca posible del borde o bordillo
      derecho y detenerse
    D: Detenerse en el lado izquierdo de la carretera y reducir la velocidad
  answer: C
  explanation: La ley de Tennessee exige que, cuando se aproxima un vehículo de emergencia,
    todo el tráfico debe ceder el derecho de paso e inmediatamente conducir hasta
    una posición paralela y lo más cerca posible del borde o bordillo derecho de la
    calzada y detenerse.
- id: 424
  category: sharing_the_road
  question: Si se encuentra en medio de una intersección cuando se aproxima un vehículo
    de emergencia con la sirena encendida, ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en medio de la intersección
    B: Continuar a través de la intersección antes de detenerse a la derecha
    C: Poner el vehículo en reversa y salir de la intersección hacia atrás
    D: Detenerse en el lado izquierdo de la intersección
  answer: B
  explanation: Si se encuentra en una intersección, continúe a través de ella antes
    de detenerse, o de lo contrario podría bloquear el paso del vehículo de emergencia
    a través de la intersección.
- id: 425
  category: safe_driving_rules
  question: Según la Ley de Moverse a un Lado (Move Over Law) de Tennessee, ¿qué debe
    hacer al acercarse a un vehículo de emergencia o de servicios públicos estacionado
    con luces intermitentes en una carretera de varios carriles?
  choices:
    A: Detener su vehículo y esperar a que el vehículo estacionado se mueva
    B: Cambiar a un carril que no sea adyacente al vehículo, o proceder con precaución
      reduciendo la velocidad
    C: Mantener su velocidad y tocar la bocina para alertar a los trabajadores
    D: Detenerse en el arcén y encender las luces de emergencia
  answer: B
  explanation: La Ley de Moverse a un Lado de Tennessee exige que, al acercarse a
    cualquier vehículo de emergencia estacionado con luces intermitentes, debe cambiar
    a un carril que no sea adyacente al del vehículo, o proceder con precaución reduciendo
    la velocidad del vehículo.
- id: 426
  category: sharing_the_road
  question: ¿Está obligado a detenerse ante un autobús de tránsito (autobús urbano)
    que se ha detenido para recoger o dejar pasajeros?
  choices:
    A: Sí, debe detenerse tal como lo haría ante un autobús escolar
    B: Sí, pero solo si el autobús tiene las luces de emergencia parpadeando
    C: No, no está obligado a detenerse ni se le prohíbe rebasarlo
    D: No, a menos que el autobús esté en una zona escolar designada
  answer: C
  explanation: No está obligado a detenerse ante los autobuses de tránsito, ni se
    le prohíbe rebasarlos, cuando se detienen para recoger o dejar pasajeros, a diferencia
    de lo que se requeriría ante un autobús escolar en la misma situación.
- id: 427
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones es ilegal con respecto a los camiones
    de bomberos o vehículos de emergencia que responden a una emergencia?
  choices:
    A: Cederles el derecho de paso en una intersección
    B: Seguir a un camión de bomberos que responde a una alarma de incendio
    C: Bajar el volumen de su radio cuando se acercan
    D: Detenerse en el bordillo derecho cuando se acercan
  answer: B
  explanation: Es contra la ley seguir a un camión de bomberos u otro vehículo de
    emergencia que responda a una alarma de incendio u otra emergencia.
- id: 428
  category: safe_driving_rules
  question: ¿Cuál es la primera regla para girar?
  choices:
    A: Girar desde el carril más cercano en la dirección en la que viaja hacia el
      carril legal más cercano en la dirección a la que desea ir
    B: Girar siempre hacia el carril del extremo izquierdo
    C: Señalizar durante al menos 50 pies antes de realizar el giro
    D: Tocar la bocina antes de iniciar el giro
  answer: A
  explanation: La primera regla para girar es hacerlo desde el carril más cercano
    en la dirección en la que viaja hacia el carril legal más cercano en la dirección
    a la que desea ir.
- id: 429
  category: vehicle_information
  question: ¿Cuál de los siguientes elementos es ilegal que un vehículo privado no
    autorizado tenga instalado o muestre visiblemente?
  choices:
    A: Una luz blanca intermitente
    B: Una luz de emergencia amarilla intermitente
    C: Una luz de emergencia azul intermitente o una combinación de azul y rojo
    D: Una luz verde intermitente
  answer: C
  explanation: Es contra la ley que un vehículo privado no autorizado tenga instalada,
    mantenga o muestre visiblemente de cualquier manera una luz de emergencia azul
    intermitente o una combinación de luces de emergencia azules y rojas intermitentes.
- id: 430
  category: safe_driving_rules
  question: Si tiene la luz del semáforo en verde, pero otro vehículo ya está en la
    intersección, ¿qué debe hacer?
  choices:
    A: Atravesar la intersección ya que usted tiene el derecho de paso
    B: Tocar la bocina para obligar al otro vehículo a moverse
    C: Ceder el paso al vehículo que ya está en la intersección
    D: Esquivar el vehículo para mantener el flujo del tráfico
  answer: C
  explanation: Debe ceder el derecho de paso a cualquier vehículo que ya se encuentre
    en la intersección, incluso si usted tiene la luz verde del semáforo.
- id: 431
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe encender las luces direccionales antes de
    realizar un giro?
  choices:
    A: Al menos 25 pies
    B: Al menos 50 pies
    C: Al menos 100 pies
    D: Al menos 200 pies
  answer: B
  explanation: El manual establece que debe encender las luces direccionales al menos
    50 pies antes del giro.
- id: 432
  category: safe_driving_rules
  question: ¿El uso de la luz direccional le otorga el derecho de paso para cambiar
    de carril o girar?
  choices:
    A: Sí, si señaliza con al menos 50 pies de anticipación.
    B: Sí, pero solo al entrar en un estacionamiento.
    C: No, señalizar NO le otorga el derecho de paso.
    D: No, a menos que esté usando señales manuales.
  answer: C
  explanation: Su señal les permite a otros conductores conocer sus intenciones de
    realizar un cambio en la trayectoria de su vehículo, pero el manual establece
    explícitamente que señalizar NO le otorga el derecho de paso.
- id: 433
  category: defensive_driving
  question: ¿Por qué debe mantener las ruedas de su vehículo rectas mientras espera
    para realizar un giro?
  choices:
    A: Ayuda a que el líquido de la dirección asistida circule.
    B: Evita que los neumáticos se desgasten de forma irregular.
    C: Si lo golpean por detrás, el impacto podría empujarlo hacia el tráfico en sentido
      contrario.
    D: Le permite acelerar más rápido cuando la luz cambia a verde.
  answer: C
  explanation: El manual advierte no girar las ruedas en la dirección del giro mientras
    espera que pase el tráfico en sentido contrario. Si lo golpean por detrás mientras
    sus ruedas están giradas, el impacto puede empujarlo hacia el tráfico que viene
    de frente.
- id: 434
  category: safe_driving_rules
  question: Si planea girar en una entrada privada justo después de una intersección,
    ¿cuándo debe señalizar?
  choices:
    A: Al menos 50 pies antes de la intersección.
    B: No señalice hasta que esté dentro de la intersección.
    C: Justo en el momento en que comienza a girar el volante.
    D: No es necesario señalizar para entrar en entradas privadas.
  answer: B
  explanation: Si planea girar después de una intersección, no señalice hasta que
    esté dentro de la intersección. Si señaliza antes, otro conductor podría pensar
    que tiene la intención de girar en la intersección y podría cruzarse en su camino.
- id: 435
  category: defensive_driving
  question: ¿Bajo qué condición climática recomienda el manual específicamente el
    uso de señales manuales porque las luces direccionales de su vehículo podrían
    ser difíciles de ver?
  choices:
    A: Lluvia intensa
    B: Niebla densa
    C: Cuando el sol brilla intensamente
    D: Durante una tormenta de nieve
  answer: C
  explanation: Se deben usar señales manuales cuando el sol brilla intensamente. Esto
    hace que la luz direccional sea más difícil de ver para otros conductores.
- id: 436
  category: safe_driving_rules
  question: 'Usted NO debe usar sus luces direccionales para:'
  choices:
    A: Indicar que está saliendo de una posición de estacionamiento.
    B: Indicarle a un conductor detrás de usted que lo rodee y pase su vehículo.
    C: Mostrar que está entrando en la interestatal.
    D: Indicar que está frenando repentinamente.
  answer: B
  explanation: El manual establece que NO debe usar sus señales para indicarle a un
    conductor detrás de usted que lo rodee para pasar su vehículo, ya que esto es
    engañoso para otros conductores.
- id: 437
  category: vehicle_information
  question: ¿Por qué debe evitar cambiar de marcha mientras está en la intersección?
  choices:
    A: Causa un desgaste excesivo en el embrague (clutch).
    B: Es ilegal y conlleva una multa elevada.
    C: El motor podría apagarse, causando un accidente o bloqueando la intersección.
    D: Hace que la luz direccional se apague automáticamente.
  answer: C
  explanation: 'El manual aconseja: "No cambie de marcha en la intersección (si el
    motor se apaga, podría causar un accidente y/o bloquear la intersección al resto
    del tráfico)".'
- id: 438
  category: defensive_driving
  question: ¿Cómo puede llamar la atención con sus luces de freno al señalizar una
    parada?
  choices:
    A: Encienda las luces de emergencia.
    B: Bombee ligeramente los frenos unas cuantas veces.
    C: Presione el pedal del freno hasta el fondo inmediatamente.
    D: Ponga el vehículo en punto muerto (neutral) antes de frenar.
  answer: B
  explanation: Al señalizar una parada, debe bombear ligeramente los frenos unas cuantas
    veces para llamar la atención con sus luces de freno.
- id: 439
  category: safe_driving_rules
  question: Cuando se encuentra con otro conductor en una intersección y ambos quieren
    girar a la izquierda, ¿cómo deben proceder?
  choices:
    A: Cada conductor girará a la derecha del otro.
    B: El conductor que llegó primero tiene el derecho de paso para girar primero.
    C: Cada conductor girará a la izquierda del otro.
    D: Ambos conductores deben esperar a una flecha verde.
  answer: C
  explanation: Cuando se encuentra con otro conductor en una intersección y ambos
    quieren girar a la izquierda, cada uno girará a la izquierda del otro.
- id: 440
  category: signs_and_signals
  question: ¿De qué color son las líneas centrales en las calles de un solo sentido?
  choices:
    A: Amarillo
    B: Blanco
    C: Rojo
    D: Azul
  answer: B
  explanation: Según el manual, las líneas centrales en las calles de doble sentido
    son amarillas, mientras que las líneas centrales en las calles de un solo sentido
    son blancas.
- id: 441
  category: safe_driving_rules
  question: ¿Qué debe hacer con el brazo cuando utiliza una señal manual durante el
    giro propiamente dicho?
  choices:
    A: Mantenerlo totalmente extendido hasta completar el giro.
    B: Agitarlo en movimiento circular.
    C: Meter el brazo para mantener el control del volante.
    D: Señalar hacia el carril al que está girando.
  answer: C
  explanation: Cuando utiliza señales manuales, debe meter el brazo durante el giro
    propiamente dicho para mantener el control del volante.
- id: 442
  category: defensive_driving
  question: ¿Cuál es un peligro potencial de olvidar apagar la luz direccional después
    de usarla?
  choices:
    A: Agotará la batería de su vehículo.
    B: Podría tentar a otros conductores a cruzarse delante de usted.
    C: Hará que sus luces de freno dejen de funcionar.
    D: Activará automáticamente su freno de emergencia.
  answer: B
  explanation: Una señal involuntaria sigue significando "giro" para otros conductores.
    Al dejarla encendida, podría tentar a otros conductores a cruzarse delante de
    usted.
- id: 443
  category: safe_driving_rules
  question: Al realizar un giro a la izquierda de rutina desde una calle de doble
    sentido hacia otra calle de doble sentido, ¿por dónde debe conducir justo después
    de entrar en la nueva calle?
  choices:
    A: Hacia el carril del extremo derecho para evitar el tráfico en sentido contrario.
    B: Justo a la derecha de la línea central en el primer carril después de la línea
      central.
    C: Directamente sobre la línea central.
    D: Hacia cualquier carril disponible que esté libre de tráfico.
  answer: B
  explanation: Conduzca justo a la derecha de la línea central de la calle en la que
    está entrando y asegúrese de girar hacia el primer carril después de la línea
    central. Esto evita conflictos con otros vehículos que realizan giros a la derecha
    o a la izquierda.
- id: 444
  category: signs_and_signals
  question: Si está esperando para girar a la izquierda y el semáforo se pone en amarillo
    mientras espera a que pasen los vehículos que vienen en sentido contrario, ¿qué
    debe hacer?
  choices:
    A: Acelerar rápidamente para ganarle a la luz roja.
    B: Avanzar hacia la intersección inmediatamente.
    C: NO avanzar hacia la intersección.
    D: Retroceder hacia el paso de peatones.
  answer: C
  explanation: 'El manual establece: "Si el semáforo se pone en amarillo mientras
    espera a que los vehículos que vienen en sentido contrario despejen la intersección,
    NO avance hacia la intersección".'
- id: 445
  category: safe_driving_rules
  question: Al realizar un giro a la izquierda desde una calle de doble sentido hacia
    una calle de sentido único, ¿en qué carril debe girar?
  choices:
    A: El carril más alejado a la derecha.
    B: El carril central.
    C: El primer carril más cercano a la acera izquierda.
    D: Cualquier carril que esté abierto en ese momento.
  answer: C
  explanation: 'Al girar desde una calle de doble sentido hacia una calle de sentido
    único, el manual indica: ''Gire bruscamente hacia el PRIMER carril... Debe girar
    en el primer carril más cercano a la acera izquierda''.'
- id: 446
  category: safe_driving_rules
  question: ¿Bajo qué condición se permite un giro a la izquierda con luz roja en
    Tennessee?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de sentido único.
    B: Al girar desde una calle de sentido único hacia otra calle de sentido único.
    C: Al girar desde una calle de sentido único hacia una calle de doble sentido.
    D: Los giros a la izquierda en rojo nunca están permitidos.
  answer: B
  explanation: Se permite un giro a la izquierda con luz roja en todas las intersecciones
    donde una calle de sentido único se cruza con otra calle de sentido único, siempre
    que se detenga por completo primero y no haya señales que lo prohíban.
- id: 447
  category: safe_driving_rules
  question: ¿Puede realizar un giro a la izquierda con luz roja al girar desde una
    calle de sentido único hacia una calle de doble sentido?
  choices:
    A: Sí, después de detenerse por completo.
    B: Sí, si no hay tráfico en sentido contrario.
    C: No, NO PUEDE realizar este giro a la izquierda con luz roja.
    D: Sí, pero solo entre la medianoche y las 6 AM.
  answer: C
  explanation: 'El manual establece explícitamente con respecto al giro desde una
    calle de sentido único hacia una calle de doble sentido: ''NO PUEDE realizar este
    giro a la izquierda con luz roja''.'
- id: 448
  category: safe_driving_rules
  question: ¿Con cuánta antelación a un giro a la derecha debe poner la luz direccional?
  choices:
    A: Al menos 25 pies.
    B: Al menos 50 pies.
    C: Al menos 100 pies.
    D: Al menos 200 pies.
  answer: B
  explanation: El manual establece que debe 'dar una señal para un giro a la derecha
    durante al menos 50 pies'.
- id: 449
  category: defensive_driving
  question: ¿Por qué debe evitar abrirse demasiado hacia la izquierda antes o durante
    un giro a la derecha?
  choices:
    A: Hará que su volante se bloquee.
    B: El conductor detrás de usted puede pensar que está cambiando de carril o girando
      a la izquierda e intentar rebasarlo por la derecha.
    C: Es ilegal cruzar la línea blanca.
    D: Hará que entre en una rotonda.
  answer: B
  explanation: Si se abre hacia la izquierda en un giro a la derecha, 'el conductor
    detrás de usted puede pensar que está cambiando de carril o girando a la izquierda
    y puede intentar rebasarlo por la derecha'.
- id: 450
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a un camión grande por la derecha si existe
    la posibilidad de que este realice un giro a la derecha?
  choices:
    A: Los camiones aceleran más rápido que los automóviles.
    B: Los camiones deben realizar giros amplios y, a veces, dejan un espacio abierto
      a la derecha justo antes del giro.
    C: A los camiones no se les permite usar luces direccionales.
    D: Los camiones siempre tienen el derecho de paso en las intersecciones.
  answer: B
  explanation: Los camiones grandes y los autobuses DEBEN realizar giros amplios y,
    a veces, dejan un espacio abierto a la derecha justo antes del giro. Rebasar por
    la derecha puede causar un accidente.
- id: 451
  category: safe_driving_rules
  question: ¿En qué dirección debe circular siempre en una glorieta (roundabout)?
  choices:
    A: En el sentido de las agujas del reloj.
    B: En sentido contrario a las agujas del reloj (hacia la derecha).
    C: En línea recta por el centro.
    D: En cualquier dirección que tenga menos tráfico.
  answer: B
  explanation: 'El manual indica a los conductores: ''Circule siempre por una glorieta
    hacia la derecha, en sentido contrario a las agujas del reloj''.'
- id: 452
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a rebasar a otros vehículos en una glorieta
    de varios carriles?
  choices:
    A: Puede rebasar solo por la izquierda.
    B: Puede rebasar solo por la derecha.
    C: Puede rebasar si el vehículo de adelante circula a menos de 15 mph.
    D: No adelante ni rebase a ningún vehículo.
  answer: D
  explanation: 'En una glorieta de varios carriles, el manual establece explícitamente:
    ''no adelante ni rebase a ningún vehículo''.'
- id: 453
  category: safe_driving_rules
  question: Usted NO puede dar una vuelta en U en ningún lugar donde no pueda ver
    el tráfico que viene de ambas direcciones desde al menos ¿qué distancia?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: No puede dar una vuelta en U en ningún lugar rural o urbano, ni cerca
    de una curva o la cima de una colina, donde no pueda ver el tráfico que viene
    de ambas direcciones desde al menos 500 pies.
- id: 454
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una autopista interestatal
    en Tennessee?
  choices:
    A: Use el cruce de emergencia en la mediana para dar la vuelta.
    B: Dé una vuelta en U cuando la autopista esté despejada.
    C: Continúe hasta la siguiente rampa de salida.
    D: Retroceda con cuidado por el arcén (hombro).
  answer: C
  explanation: 'Es ilegal dar una vuelta en U en una interestatal o usar los cruces
    de emergencia. El manual aconseja: ''Continúe hasta la siguiente rampa de salida''.'
- id: 455
  category: safe_driving_rules
  question: ¿Qué frase resume el principio de 'tráfico por la derecha' en las carreteras
    estadounidenses?
  choices:
    A: Amarillo a su derecha, blanco a su izquierda
    B: Blanco a su derecha, amarillo a su izquierda
    C: Manténgase a la derecha excepto para girar a la derecha
    D: Rebase por la derecha, conduzca por la izquierda
  answer: B
  explanation: 'El manual establece que la descripción general del uso de los carriles
    se resume con la simple frase: ''Blanco a su derecha, amarillo a su izquierda''.'
- id: 456
  category: safe_driving_rules
  question: ¿Para qué se utiliza el carril central de una carretera de doble sentido,
    de tres o cinco carriles?
  choices:
    A: Rebasar vehículos que circulan despacio.
    B: Solo para estacionamiento de emergencia.
    C: Solo para girar a la izquierda.
    D: Solo para girar a la derecha.
  answer: C
  explanation: 'El manual establece explícitamente: ''El carril central de una carretera
    de doble sentido, de tres o cinco carriles, se utiliza únicamente para girar a
    la izquierda''.'
- id: 457
  category: safe_driving_rules
  question: ¿Es legal dar una vuelta en U en una intersección donde un semáforo o
    un oficial de policía está controlando el flujo del tráfico?
  choices:
    A: Sí, si tiene la luz verde.
    B: Sí, si no viene tráfico en sentido contrario.
    C: No, no puede dar una vuelta en U en estas intersecciones.
    D: Sí, pero solo en zonas rurales.
  answer: C
  explanation: 'El manual enumera los lugares donde NO se puede dar una vuelta en
    U, incluyendo: ''En cualquier intersección donde un semáforo o un oficial de policía
    esté controlando el flujo del tráfico''.'
- id: 458
  category: safe_driving_rules
  question: ¿Cómo debe indicar su intención de salir de una glorieta?
  choices:
    A: Use las luces altas.
    B: Use su señal de giro a la izquierda.
    C: Use su señal de giro a la derecha.
    D: Toque la bocina.
  answer: C
  explanation: 'El manual indica a los conductores: ''Salga de la glorieta con cuidado.
    Indique siempre su salida utilizando la señal de giro a la derecha''.'
- id: 459
  category: safe_driving_rules
  question: En una carretera de cuatro carriles, ¿por dónde debe conducir generalmente?
  choices:
    A: En el carril del extremo izquierdo en todo momento
    B: En el carril del extremo derecho, excepto al rebasar o al girar a la izquierda
    C: En cualquier carril que tenga la menor cantidad de tráfico
    D: A horcajadas sobre la línea blanca discontinua para mantener la visibilidad
  answer: B
  explanation: Según el manual, en una carretera de cuatro carriles, debe 'conducir
    en el carril del extremo derecho, excepto cuando rebase a otro vehículo o gire
    a la izquierda'.
- id: 460
  category: defensive_driving
  question: Al intentar usar un cruce (crossover) designado en una carretera dividida
    de cuatro carriles, ¿qué debe hacer si otro vehículo ya está en el cruce esperando
    a que el tráfico se despeje?
  choices:
    A: Gire hacia el lado izquierdo del cruce junto al vehículo que espera
    B: Amontónese justo detrás del auto que espera dentro del cruce
    C: Permanezca detenido en el carril del extremo izquierdo de la carretera con
      la señal de giro encendida
    D: Continúe hasta la siguiente intersección para dar una vuelta en U
  answer: C
  explanation: 'El manual establece: ''Si un vehículo ya está en el cruce esperando
    a que el tráfico se despeje, permanezca detenido en el carril del extremo izquierdo
    de la carretera de cuatro carriles con la señal de giro encendida hasta que el
    vehículo que espera haya despejado el cruce''.'
- id: 461
  category: signs_and_signals
  question: ¿Qué significa si ve reflectores rojos de frente hacia usted en las líneas
    de carril o en las líneas de borde de la carretera?
  choices:
    A: Se está acercando a una zona de construcción
    B: Está circulando en sentido contrario al tráfico y podría tener una colisión
      frontal
    C: Está entrando en un carril para vehículos de alta ocupación (HOV)
    D: El límite de velocidad se reducirá más adelante
  answer: B
  explanation: 'El manual advierte: ''Los reflectores rojos siempre significan que
    usted está circulando en sentido contrario al tráfico y podría tener una colisión
    frontal''.'
- id: 462
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que se le permite recorrer en un carril central
    compartido para girar?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: El manual especifica que los carriles centrales compartidos para girar
    'no pueden usarse para rebasar y no pueden usarse para circular por más de 300
    pies'.
- id: 463
  category: safe_driving_rules
  question: Si dos vehículos entran en un carril central compartido para girar desde
    direcciones opuestas al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que circula a mayor velocidad
    B: El vehículo que realiza un giro a la derecha
    C: El más grande de los dos vehículos
    D: El primer vehículo en entrar al carril
  answer: D
  explanation: Según el manual, 'Cuando los vehículos entran al carril de giro desde
    direcciones opuestas, el primer vehículo en entrar al carril tiene el derecho
    de paso'.
- id: 464
  category: signs_and_signals
  question: ¿Cómo se marcan habitualmente los carriles reversibles en la calzada?
  choices:
    A: Mediante líneas amarillas dobles discontinuas
    B: Mediante líneas blancas continuas en ambos lados
    C: Mediante una sola línea amarilla continua
    D: Mediante reflectores rojos y blancos alternados
  answer: A
  explanation: El manual establece que los carriles reversibles 'suelen estar marcados
    por líneas amarillas dobles discontinuas'.
- id: 465
  category: signs_and_signals
  question: Cuando conduce en un carril reversible, ¿qué significa una 'X' amarilla
    intermitente en la parte superior?
  choices:
    A: No puede conducir en el carril de abajo
    B: El carril es solo para girar
    C: La dirección del carril está cambiando
    D: Puede conducir recto en el carril
  answer: B
  explanation: El manual explica que 'Una “X” amarilla intermitente significa que
    el carril es solo para girar'.
- id: 466
  category: signs_and_signals
  question: ¿Qué acción debe tomar si ve una 'X' amarilla fija sobre un carril reversible?
  choices:
    A: Acelerar para despejar el carril rápidamente
    B: Detenerse inmediatamente en el carril
    C: Salir del carril tan pronto como sea seguro hacerlo
    D: Usar el carril solo para rebasar
  answer: C
  explanation: Según el manual, 'Una “X” amarilla fija significa que el uso/dirección
    del carril está cambiando y usted debe salir de él tan pronto como sea seguro
    hacerlo'.
- id: 467
  category: signs_and_signals
  question: ¿Qué indica una señal que dice 'HOV 2' sobre un carril reservado?
  choices:
    A: El carril está reservado para vehículos con al menos dos personas en ellos
    B: El carril está reservado solo para vehículos comerciales pesados
    C: El carril está cerrado por las próximas dos millas
    D: Solo los vehículos híbridos o eléctricos pueden usar el carril
  answer: A
  explanation: 'El manual indica: ''Por ejemplo, “HOV 2” significa que debe haber
    al menos dos personas en el vehículo para que usted pueda conducir legalmente
    en ese carril''.'
- id: 468
  category: defensive_driving
  question: ¿Por qué es esencial mirar por encima del hombro antes de cambiar de carril?
  choices:
    A: Para comprobar la velocidad del vehículo que viene detrás
    B: Para asegurarse de que su luz de giro funciona correctamente
    C: Para revisar sus puntos ciegos en busca de vehículos que no se pueden ver en
      los espejos
    D: Para comunicar sus intenciones a otros conductores
  answer: C
  explanation: El manual explica que un conductor 'no puede ver la motocicleta u otro
    automóvil simplemente revisando sus espejos. Tendría que girar físicamente la
    cabeza y mirar por encima del hombro en cada dirección para ver esos vehículos
    a su lado' para revisar los puntos ciegos.
- id: 469
  category: sharing_the_road
  question: ¿Qué debe hacer si un conductor delante de usted señaliza su intención
    de cambiar de carril?
  choices:
    A: Acelerar para pasarlo antes de que cambie de carril
    B: Reducir la velocidad y dejar espacio para el cambio
    C: Cambiar de carril usted mismo para quitarse de su camino
    D: Tocar la bocina para advertirle que no se mueva
  answer: B
  explanation: 'El manual aconseja: ''Cuando un conductor delante de usted (en su
    carril o en el carril de al lado) señaliza un cambio de carril, reduzca la velocidad
    y deje espacio para el cambio. NO acelere ni cambie de carril usted mismo...'''
- id: 470
  category: safe_driving_rules
  question: Al prepararse para rebasar a otro vehículo en una carretera de dos carriles,
    ¿cuál es una buena regla con respecto al tráfico en sentido contrario?
  choices:
    A: Si ve cualquier señal de un vehículo que se aproxima, está demasiado cerca
      para arriesgarse a rebasar
    B: Puede rebasar si el vehículo que viene en sentido contrario está a más de 100
      pies de distancia
    C: Haga un cambio de luces para que el vehículo que viene en sentido contrario
      reduzca la velocidad
    D: Acelere rápidamente para ganarle al vehículo que viene en sentido contrario
  answer: A
  explanation: 'El manual establece: ''Como regla general, si ve cualquier señal de
    un vehículo que se aproxima, está demasiado cerca para arriesgarse a rebasar.
    En caso de duda, permanezca en su carril''.'
- id: 471
  category: defensive_driving
  question: ¿Por qué debe mantenerse a una distancia considerable detrás de un vehículo
    que desea rebasar antes de iniciar la maniobra?
  choices:
    A: Para alcanzar la velocidad suficiente para rebasar rápidamente
    B: Para permitirse una mejor vista de la carretera adelante
    C: Para evitar ser golpeado por escombros lanzados por sus neumáticos
    D: Para esconderse en su punto ciego hasta que esté listo para rebasar
  answer: B
  explanation: 'El manual instruye a los conductores: "Manténgase a una distancia
    considerable detrás del vehículo que desea rebasar para permitirse una mejor vista
    de la carretera adelante".'
- id: 472
  category: defensive_driving
  question: ¿Por qué debe evitar desviarse hacia el carril contrario cruzando la línea
    central solo para mirar antes de rebasar?
  choices:
    A: Es ilegal cruzar la línea central bajo cualquier circunstancia
    B: Indica que está siguiendo demasiado de cerca o que intenta rebasar de manera
      insegura
    C: Hará que su vehículo pierda tracción
    D: Confunde a los conductores detrás de usted haciéndoles pensar que va a girar
      a la izquierda
  answer: B
  explanation: 'El manual advierte: "NO se desvíe cruzando la línea central para mirar.
    Si necesita hacer esto para ver, es porque está siguiendo demasiado de cerca o
    está intentando rebasar".'
- id: 473
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los cruces
    (crossovers) en las autopistas interestatales?
  choices:
    A: Pueden usarse para dar la vuelta en U si la mediana está pavimentada
    B: Están reservados únicamente para vehículos de alta ocupación (HOV) únicamente
    C: No se proporcionan cruces para el tráfico en las autopistas interestatales
    D: Deben tratarse igual que una calle transversal
  answer: C
  explanation: 'El manual establece explícitamente: "NO se proporcionan cruces (crossovers)
    para el tráfico en las autopistas interestatales".'
- id: 474
  category: safe_driving_rules
  question: Al rebasar un vehículo por la izquierda, ¿cuándo es seguro regresar al
    carril derecho?
  choices:
    A: Cuando esté a 50 pies por delante del vehículo.
    B: Tan pronto como pase el parachoques delantero del vehículo.
    C: Cuando pueda ver el vehículo completo que rebasó en su espejo retrovisor.
    D: Cuando el conductor al que rebasó le haga señales con las luces delanteras.
  answer: C
  explanation: 'El manual establece: "Complete su maniobra de rebase lo antes posible.
    Cuando pueda ver el vehículo completo que rebasó en su espejo retrovisor, señale
    a la derecha y regrese a su carril".'
- id: 475
  category: safe_driving_rules
  question: En Tennessee, ¿es ilegal rebasar varios vehículos al mismo tiempo?
  choices:
    A: Sí, está estrictamente prohibido por ley.
    B: No, no es ilegal, pero generalmente no se recomienda.
    C: Sí, a menos que se encuentre en una carretera de varios carriles.
    D: No, es la forma recomendada de rebasar el tráfico lento.
  answer: B
  explanation: 'El manual señala: "Como regla general, NO ES SEGURO rebasar más de
    un vehículo a la vez, aunque en Tennessee no es ilegal rebasar varios vehículos.
    Se recomienda que ni siquiera considere rebasar varios vehículos a menos que...".'
- id: 476
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones se permite rebasar por la derecha?
  choices:
    A: Cuando el vehículo de adelante ha señalado que va a girar a la izquierda.
    B: Cuando utiliza el arcén (hombro) pavimentado de la carretera.
    C: Cuando utiliza un carril para bicicletas designado para evitar el tráfico.
    D: Cuando el vehículo de adelante conduce por debajo del límite de velocidad en
      una carretera de dos carriles.
  answer: A
  explanation: Se permite rebasar por la derecha "cuando el vehículo alcanzado ha
    señalado que va a realizar o está a punto de realizar un giro a la izquierda".
    Nunca se permite rebasar fuera del pavimento o en un carril para bicicletas.
- id: 477
  category: safe_driving_rules
  question: ¿Cuándo se le permite rebasar a un vehículo por la derecha utilizando
    un carril de emergencia o un carril de estacionamiento?
  choices:
    A: Cuando el vehículo de adelante está detenido ante un semáforo en rojo.
    B: Cuando se encuentra a la vista de un semáforo o una señal de alto.
    C: Cuando el vehículo de adelante está girando a la izquierda.
    D: Nunca se le permite rebasar por la derecha utilizando un carril de estacionamiento
      o de emergencia.
  answer: D
  explanation: 'El manual establece explícitamente: "NO rebase por la derecha usando
    un carril para bicicletas o un carril de estacionamiento en ningún lugar, ni en
    el carril de emergencia a la vista de un semáforo o una señal de alto".'
- id: 478
  category: sharing_the_road
  question: Al detenerse ante un paso de peatones en una carretera de varios carriles,
    ¿a qué distancia antes del paso de peatones debe detenerse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: 'Según el consejo de seguridad del manual: "Al detenerse ante un paso
    de peatones en una carretera de varios carriles, debe detenerse a unos 30 pies
    antes del paso de peatones para no bloquear la visibilidad de los peatones que
    cruzan a los conductores en los otros carriles".'
- id: 479
  category: signs_and_signals
  question: ¿Qué indica el final de una "zona de no rebasar"?
  choices:
    A: Que es automáticamente seguro rebasar.
    B: Que hay una mayor visibilidad adelante, pero aún debe determinar si es seguro
      rebasar.
    C: Que está obligado a rebasar cualquier vehículo lento que esté adelante.
    D: Que el límite de velocidad aumenta.
  answer: B
  explanation: 'El manual establece: "El final de una ''zona de no rebasar'' no significa
    que sea seguro rebasar. Significa que hay una mayor visibilidad adelante. Sigue
    dependiendo de USTED determinar si es seguro rebasar...".'
- id: 480
  category: safe_driving_rules
  question: ¿Se le permite alguna vez cruzar una línea amarilla continua marcada en
    el pavimento en una "zona de no rebasar"?
  choices:
    A: No, nunca se permite cruzar una línea amarilla continua.
    B: Sí, pero solo para rebasar un tractor o una bicicleta que se mueva lentamente.
    C: Sí, puede cruzar la línea central para entrar o salir de un callejón, camino
      privado o entrada para vehículos.
    D: Sí, si puede completar la maniobra de rebase antes de que llegue el tráfico
      en sentido contrario.
  answer: C
  explanation: 'El manual explica: "Se le permite cruzar la línea central si está
    realizando un giro a la izquierda para entrar o salir de un callejón, intersección,
    camino privado o entrada para vehículos mientras se encuentra en la ''zona de
    no rebasar''".'
- id: 481
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo está rebasando y observa que se aproxima
    un automóvil en sentido contrario?
  choices:
    A: Acelerar para que el vehículo que lo rebasa pueda colocarse detrás de usted.
    B: Moverse hacia la izquierda para bloquear al vehículo que intenta rebasar.
    C: Reducir la velocidad para permitir que el conductor que lo rebasa tenga más
      espacio para volver al carril derecho.
    D: Tocar la bocina y mantener su velocidad actual.
  answer: C
  explanation: Para ayudar a otro conductor a rebasar de manera segura, usted debe
    'Reducir la velocidad si observa un automóvil que se aproxima en la otra dirección
    mientras lo están rebasando. Al reducir la velocidad, permitirá que el conductor
    que lo rebasa tenga más espacio para volver al carril derecho...'
- id: 482
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que debe dejar entre su vehículo y una bicicleta
    al rebasarla?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: 'El manual establece: ''Al rebasar y adelantar a un ciclista que circula
    en la misma dirección, hágalo lentamente y deje al menos una distancia entre usted
    y la bicicleta de no menos de 3 pies''.'
- id: 483
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego del conductor
    de un camión grande o autobús mientras lo sigue?
  choices:
    A: Puede ver la cara del conductor en su espejo retrovisor.
    B: No puede ver los espejos laterales del camión o autobús.
    C: Está siguiendo a una distancia de más de 100 pies.
    D: Puede ver todo el remolque del camión.
  answer: B
  explanation: 'El manual proporciona un punto excelente para recordar: ''si no puede
    ver los espejos laterales del camión o autobús que está siguiendo, entonces el
    conductor del camión o autobús NO PUEDE VERLO A USTED''.'
- id: 484
  category: sharing_the_road
  question: ¿Cuál es un error peligroso que los conductores suelen cometer después
    de rebasar un camión grande o un autobús?
  choices:
    A: Acelerar demasiado rápido después de regresar al carril.
    B: Colocarse delante del camión o autobús y reducir la velocidad.
    C: Quitar la señal de giro demasiado pronto.
    D: Dejar demasiado espacio entre su automóvil y el camión.
  answer: B
  explanation: 'El manual instruye: ''Mantenga su velocidad. NUNCA se coloque delante
    de un camión o autobús (o cualquier tipo de vehículo) y reduzca la velocidad.
    Esto elimina el margen de seguridad del conductor al que acaba de rebasar...'''
- id: 485
  category: sharing_the_road
  question: ¿Cómo afecta el viajar en una pendiente descendente al rebasar un camión
    grande o un autobús?
  choices:
    A: El camión perderá velocidad, lo que facilitará el rebase.
    B: El impulso del camión hará que vaya más rápido, por lo que es posible que deba
      aumentar su velocidad para rebasarlo.
    C: El camión se verá obligado a detenerse en el arcén (hombro).
    D: Rebasar en una pendiente descendente está estrictamente prohibido por la ley.
  answer: B
  explanation: 'El manual explica que el terreno importa: ''En una pendiente descendente,
    su impulso hará que vayan más rápido, por lo que es posible que deba aumentar
    su velocidad para rebasar''.'
- id: 486
  category: defensive_driving
  question: ¿Cuál es el procedimiento adecuado cuando otro conductor intenta rebasarlo
    por la izquierda?
  choices:
    A: Acelerar para evitar que se incorpore demasiado bruscamente.
    B: Moverse al carril izquierdo para bloquearlo si es inseguro.
    C: Mantenerse en su carril, desplazarse hacia la derecha y mantener su velocidad.
    D: Encender y apagar las luces delanteras para advertir al tráfico que viene en
      sentido contrario.
  answer: C
  explanation: 'Cuando lo estén rebasando, debe ayudar al otro conductor: ''Manteniéndose
    en su carril y moviéndose hacia la derecha si lo rebasan por la izquierda. Manteniendo
    su velocidad. NO acelere para evitar que el otro conductor lo rebase''.'
- id: 487
  category: safe_driving_rules
  question: ¿Cuál de las siguientes situaciones le prohíbe cruzar la línea central
    para rebasar?
  choices:
    A: Al acercarse a un automóvil que se ha detenido para ceder el paso a peatones
      en un cruce peatonal.
    B: Cuando el vehículo de adelante circula a 15 mph por debajo del límite de velocidad.
    C: Cuando se encuentra en una carretera recta y nivelada con excelente visibilidad.
    D: Cuando el vehículo de adelante es una bicicleta.
  answer: A
  explanation: 'El manual enumera varias condiciones en las que NO puede cruzar la
    línea central para rebasar, incluyendo: ''No rebase a un automóvil que se ha detenido
    para ceder el paso a peatones en un cruce peatonal marcado o no marcado''.'
- id: 488
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿es legal exceder el límite de velocidad establecido?
  choices:
    A: Sí, pero solo por un máximo de 5 mph.
    B: Sí, si está rebasando un camión comercial con varios remolques.
    C: No, es ilegal exceder el límite de velocidad establecido incluso al rebasar.
    D: Sí, si se encuentra en una pendiente descendente y necesita rebasar rápidamente.
  answer: C
  explanation: 'El manual establece: "Recuerde, es ilegal exceder el límite de velocidad
    establecido incluso al rebasar a otros vehículos".'
- id: 489
  category: safe_driving_rules
  question: ¿Cuál es la forma adecuada de mirar hacia atrás al retroceder su vehículo?
  choices:
    A: Depender únicamente de sus espejos retrovisores y laterales.
    B: Abrir la puerta y sacar la cabeza para ver.
    C: Colocar el brazo en el respaldo del asiento y darse la vuelta para mirar directamente
      a través de la ventana trasera.
    D: Tocar la bocina y retroceder rápidamente mientras revisa el espejo retrovisor.
  answer: C
  explanation: Antes de retroceder, debe colocar el brazo en el respaldo del asiento
    y darse la vuelta para poder mirar directamente a través de la ventana trasera.
    El manual advierte explícitamente contra depender únicamente de los espejos o
    abrir la puerta para mirar hacia afuera.
- id: 490
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su giro o salida en la interestatal?
  choices:
    A: Detenerse y retroceder con cuidado por el arcén (hombro).
    B: Encender las luces de emergencia y retroceder en el carril de circulación.
    C: Hacer un giro en U a través de la mediana.
    D: Continuar hasta el siguiente giro o salida donde pueda dar la vuelta de manera
      segura y legal.
  answer: D
  explanation: Si se pasa de su giro o salida, NO retroceda; continúe hasta el siguiente
    giro o salida o donde pueda dar la vuelta de manera segura y legal. Es ilegal
    retroceder en la interestatal.
- id: 491
  category: safe_driving_rules
  question: ¿Al estacionar junto a una calzada fuera de los límites de la ciudad,
    su vehículo debe ser visible desde al menos cuántos pies en cualquier dirección?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Al estacionar junto a una calzada fuera de los límites de la ciudad,
    su vehículo debe ser visible desde al menos 200 pies en cualquier dirección.
- id: 492
  category: safe_driving_rules
  question: Al estacionar fuera de los límites de la ciudad, ¿cuánto ancho de carretera
    debe asegurarse de dejar como mínimo para que otros vehículos pasen junto a su
    vehículo estacionado?
  choices:
    A: 10 pies
    B: 12 pies
    C: 15 pies
    D: 18 pies
  answer: D
  explanation: Sin importar las circunstancias, debe asegurarse de dejar al menos
    18 pies de ancho de carretera para que el resto del tráfico pase junto a su vehículo
    estacionado cuando estacione junto a una calzada fuera de los límites de la ciudad.
- id: 493
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas delanteras al estacionar en una
    pendiente ascendente (cuesta arriba) con bordillo?
  choices:
    A: Hacia el bordillo (derecha)
    B: En dirección contraria al bordillo (izquierda)
    C: Hacia adelante, rectas
    D: Paralelas al bordillo
  answer: B
  explanation: En una pendiente ascendente con bordillo, gire las ruedas delanteras
    hacia afuera del bordillo (hacia la izquierda). De esta manera, si el automóvil
    comienza a rodar hacia atrás, chocará contra el bordillo y se detendrá.
- id: 494
  category: safe_driving_rules
  question: ¿A menos de cuántos pies de un hidrante de incendios es ilegal estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: El manual incluye "A menos de 15 pies de un hidrante de incendios"
    bajo las ZONAS DONDE ESTÁ PROHIBIDO ESTACIONAR donde es ilegal estacionar.
- id: 495
  category: safe_driving_rules
  question: ¿A menos de cuántos pies de un paso de peatones no se permite estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Es ilegal estacionar a menos de 20 pies de un paso de peatones o en
    el área marcada del paso de peatones.
- id: 496
  category: safe_driving_rules
  question: 'Al finalizar una maniobra de estacionamiento en paralelo, su vehículo
    no debe estar a una distancia del bordillo mayor a:'
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: Al finalizar su maniobra de estacionamiento en paralelo, el vehículo
    no debe estar a una distancia mayor de 18 pulgadas del bordillo.
- id: 497
  category: defensive_driving
  question: Si no puede retirar su vehículo averiado de la carretera, ¿cuál es una
    forma de advertir a otros automovilistas?
  choices:
    A: Pararse en la carretera y agitar los brazos.
    B: Atar un pañuelo en la manija de la puerta izquierda o en la antena.
    C: Encender y apagar las luces delanteras continuamente.
    D: Tocar la bocina cada 10 segundos.
  answer: B
  explanation: Si no puede retirar el vehículo de la carretera, levante el capó o
    ate un pañuelo en la manija de la puerta izquierda o en la antena para advertir
    a otros automovilistas sobre su vehículo detenido.
- id: 498
  category: vehicle_information
  question: ¿Qué debe hacer con la transmisión de su vehículo al estacionar un automóvil
    con transmisión manual?
  choices:
    A: Dejarlo en punto muerto (neutral) y poner el freno de mano.
    B: Dejarlo en posición de estacionamiento (P).
    C: Dejar el vehículo en una marcha (engranado) y poner el freno de mano.
    D: Dejarlo en punto muerto sin el freno de mano.
  answer: C
  explanation: Siempre ponga el freno de mano al estacionar. Deje el vehículo en marcha
    si tiene transmisión manual, o en posición de estacionamiento (P) si tiene transmisión
    automática.
- id: 499
  category: safe_driving_rules
  question: ¿Es legal retroceder hacia una intersección desde una entrada privada?
  choices:
    A: Sí, si mira hacia ambos lados primero.
    B: Sí, pero solo durante las horas del día.
    C: No, es ilegal retroceder hacia una intersección desde una entrada privada.
    D: No, a menos que tenga un pasajero que lo guíe.
  answer: C
  explanation: 'El manual establece explícitamente: "Es ilegal retroceder hacia una
    intersección desde una entrada privada".'
- id: 500
  category: safe_driving_rules
  question: ¿Qué establece el manual del conductor con respecto a caminar por la autopista
    interestatal?
  choices:
    A: Está permitido siempre que se mantenga en el arcén (hombro).
    B: Es legal solo durante las horas del día.
    C: Es tanto ilegal como peligroso.
    D: Se recomienda si su auto se avería y necesita gasolina.
  answer: C
  explanation: El manual establece explícitamente que caminar por la interestatal
    es tanto ilegal como peligroso, y que debe permanecer en su vehículo averiado
    hasta que llegue ayuda.
- id: 501
  category: penalties_and_points
  question: ¿Cuál es la sanción por estacionarse incorrectamente en un espacio designado
    para personas con discapacidad?
  choices:
    A: Una multa de $50 y una advertencia por escrito.
    B: Un delito menor castigado con una multa de $100 y el vehículo puede ser remolcado.
    C: Un delito grave castigado con una multa de $500.
    D: Suspensión inmediata de la licencia por 30 días.
  answer: B
  explanation: Estacionarse incorrectamente en espacios designados para personas con
    discapacidad es un delito menor castigado con una multa de $100, y el vehículo
    podría estar sujeto a ser remolcado.
- id: 502
  category: safe_driving_rules
  question: Al salir de reversa de un espacio de estacionamiento en ángulo, ¿qué debe
    recordar sobre la parte delantera de su automóvil?
  choices:
    A: Girará en la misma dirección que el giro.
    B: Girará en dirección opuesta a la del giro.
    C: Se moverá directamente hacia atrás sin girar.
    D: Girará hacia la acera más cercana.
  answer: B
  explanation: Antes de salir de reversa de un espacio de estacionamiento en ángulo,
    debe recordar que la parte delantera de su automóvil girará en dirección opuesta
    a la del giro.
- id: 503
  category: sharing_the_road
  question: 'Al rebasar una bicicleta que circula en la misma dirección, la ley exige
    que los automovilistas permitan una distancia mínima de:'
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley exige que los automovilistas, al rebasar una bicicleta que circula
    en la misma dirección, permitan una distancia mínima de 3 pies.
- id: 504
  category: safe_driving_rules
  question: Al ingresar a una autopista interestatal, ¿cuál es el uso adecuado del
    carril de aceleración?
  choices:
    A: Para estacionar su vehículo en una emergencia.
    B: Para detenerse y esperar un espacio grande en el tráfico.
    C: Para acelerar e incorporarse al tráfico que circula a alta velocidad.
    D: Para permitir que el tráfico de la interestatal tenga un lugar para salir.
  answer: C
  explanation: Al ingresar a una autopista interestatal, debe usar el carril de incorporación
    o aceleración para aumentar la velocidad e incorporarse al tráfico rápido que
    ya circula por la interestatal.
- id: 505
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso cuando usted intenta ingresar a la autopista
    interestatal desde una rampa de entrada?
  choices:
    A: El vehículo que ingresa a la interestatal.
    B: Otros automóviles que ya circulan por la interestatal.
    C: Cualquier vehículo que circule más rápido.
    D: El vehículo a la derecha.
  answer: B
  explanation: Es su responsabilidad ceder el derecho de paso a otros automóviles
    que ya están en la interestatal cuando usted está ingresando.
- id: 506
  category: signs_and_signals
  question: ¿Qué indica una señal de 'carril adicional' (lane added) a los conductores
    que ya circulan por la autopista interestatal?
  choices:
    A: Deben incorporarse a la izquierda inmediatamente.
    B: Deben evitar realizar cambios de carril hacia la derecha en este lugar.
    C: Deben ceder el paso a todo el tráfico que ingresa.
    D: La interestatal está terminando y deben salir.
  answer: B
  explanation: La señal de 'carril adicional' significa que se agrega un nuevo carril
    derecho para el tráfico entrante. El tráfico en la interestatal debe evitar realizar
    cambios de carril hacia la derecha porque el tráfico que ingresa no esperará que
    los vehículos se muevan hacia su trayectoria.
- id: 507
  category: safe_driving_rules
  question: 'En las autopistas interestatales con varios carriles que circulan en
    la misma dirección, el carril del extremo izquierdo debe utilizarse para:'
  choices:
    A: Tráfico que ingresa.
    B: Tráfico que sale.
    C: Vehículos más lentos.
    D: Tráfico más rápido.
  answer: D
  explanation: En las autopistas interestatales con varios carriles de tráfico que
    circulan en la misma dirección, debe dejar el carril del extremo izquierdo para
    el tráfico más rápido.
- id: 508
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento mínima recomendada en la autopista
    interestatal en condiciones climáticas adversas o por la noche?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Debe mantenerse al menos a dos segundos detrás de los vehículos que
    tiene delante, y aumentar este espacio a un mínimo de cuatro segundos en condiciones
    climáticas adversas, conducción nocturna y en tramos rurales de mayor velocidad.
- id: 509
  category: defensive_driving
  question: ¿Con cuánta anticipación debe observar la carretera al conducir por la
    autopista interestatal?
  choices:
    A: 5-10 segundos
    B: 10-15 segundos
    C: 15-20 segundos
    D: 20-30 segundos
  answer: C
  explanation: El manual aconseja observar la carretera adelante y tratar de vigilar
    15-20 segundos frente a su vehículo para detectar automóviles frenando, ingresando
    o saliendo.
- id: 510
  category: defensive_driving
  question: Si detecta un embotellamiento en la autopista interestatal que le obliga
    a reducir la velocidad o detenerse, ¿qué debe hacer para alertar a los conductores
    que vienen detrás?
  choices:
    A: Encender sus luces altas.
    B: Presionar ligeramente el pedal del freno varias veces.
    C: Tocar la bocina continuamente.
    D: Virar de un lado a otro en su carril.
  answer: B
  explanation: Si detecta un embotellamiento que le obliga a reducir la velocidad
    o detenerse, debe presionar ligeramente el pedal del freno varias veces para alertar
    a los conductores que vienen detrás.
- id: 511
  category: defensive_driving
  question: 'Según las preguntas de muestra del manual, la regla de los dos segundos
    para seguir a una distancia segura es válida a:'
  choices:
    A: Velocidades de hasta 30 m.p.h.
    B: Velocidades de hasta 55 m.p.h.
    C: Cualquier velocidad.
    D: Solo velocidades de autopista.
  answer: C
  explanation: Las preguntas de muestra del examen establecen que la regla de los
    dos segundos para seguir a una distancia segura será válida a cualquier velocidad.
- id: 512
  category: safe_driving_rules
  question: ¿Si va a salir de la interestatal, cuál es la forma más segura de prepararse?
  choices:
    A: Cambiarse al carril derecho lo antes posible para evitar cambios de carril
      apresurados.
    B: Permanecer en el carril izquierdo hasta llegar a la rampa de salida.
    C: Acelerar para rebasar el tráfico más lento antes de cruzarse hacia la salida.
    D: Detenerse en su carril y esperar un espacio en el carril derecho.
  answer: A
  explanation: Si va a salir de la interestatal, cámbiese al carril derecho lo antes
    posible para evitar cambios de carril apresurados, lo que podría resultar en una
    situación peligrosa.
- id: 513
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar las reglas del carril para vehículos de
    alta ocupación (HOV)?
  choices:
    A: Una multa de $25
    B: Una multa de $50 y costos judiciales
    C: Una multa de $100 y 2 puntos en su licencia
    D: Una multa de $75 y escuela de tráfico obligatoria
  answer: B
  explanation: Según el manual, los conductores que violen las reglas del carril HOV
    están sujetos a una multa de $50 y costos judiciales.
- id: 514
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos tiene permitido usar el carril para
    vehículos de alta ocupación (HOV) durante las horas pico de tráfico?
  choices:
    A: Una persona que conduce sola para rebasar a otro vehículo
    B: Una motocicleta ocupada por una persona
    C: Un automóvil de pasajeros con solo el conductor
    D: Un camión comercial con un solo conductor
  answer: B
  explanation: Durante las horas de mayor tráfico de entrada y salida, el carril HOV
    está reservado para vehículos con 2 o más personas, autobuses con 2 o más ocupantes,
    motocicletas ocupadas por 1 persona y vehículos de emergencia.
- id: 515
  category: safe_driving_rules
  question: Si viaja por el carril izquierdo en una interestatal y un vehículo se
    acerca detrás de usted a una velocidad mayor, ¿qué debe hacer?
  choices:
    A: Acelerar para igualar su velocidad
    B: Tocar los frenos para advertirles que disminuyan la velocidad
    C: Cambiarse un carril a su derecha
    D: Permanecer en su carril porque está conduciendo al límite de velocidad
  answer: C
  explanation: 'El manual establece: ''Si viaja en el carril izquierdo y alguien se
    acerca detrás de usted a una velocidad mayor, cámbiese un carril a su derecha.
    El carril izquierdo es solo para rebasar''.'
- id: 516
  category: safe_driving_rules
  question: ¿Cómo se hace un giro a la izquierda en un intercambio de trébol (cloverleaf)?
  choices:
    A: Tomar la rampa de giro a la izquierda antes del paso elevado
    B: Tomar la rampa de giro a la derecha justo después del paso elevado
    C: Tomar la rampa de giro a la derecha antes del paso elevado
    D: Cruzar la trayectoria del tráfico y girar a la izquierda
  answer: B
  explanation: En un intercambio de trébol, todos los giros son giros a la derecha.
    Para girar a la izquierda, debe tomar el giro a la derecha justo después del paso
    elevado.
- id: 517
  category: sharing_the_road
  question: 'Cuando los camiones y autobuses están entrando a la interestatal, usted
    debe:'
  choices:
    A: Acelerar para pasarlos rápidamente
    B: Tocar la bocina para avisarles que usted está allí
    C: Ser cooperativo y darles tiempo y espacio adicional para ajustarse al flujo
      del tráfico
    D: Obligarlos a ceder el paso manteniendo su velocidad y posición en el carril
  answer: C
  explanation: Recuerde que los camiones y autobuses que entran a la interestatal
    pueden necesitar tiempo adicional para ajustarse a los patrones de tráfico. Sea
    cooperativo y deles tiempo y espacio adicional para ajustarse al flujo del tráfico.
- id: 518
  category: safe_driving_rules
  question: Al salir de la interestatal, ¿cuándo debe comenzar a reducir significativamente
    su velocidad?
  choices:
    A: Una milla antes de la salida
    B: Tan pronto como señale su intención de salir
    C: Después de entrar en el carril de desaceleración
    D: Mientras todavía está en el carril de tráfico principal
  answer: C
  explanation: Debe mantener su velocidad hasta que entre en el carril de desaceleración,
    que generalmente está delimitado por una serie de reflectores blancos, y luego
    reducir su velocidad a la velocidad indicada para la rampa de salida.
- id: 519
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal estacionar un vehículo motorizado en la parte
    pavimentada o no pavimentada de una rampa de entrada o salida de la interestatal?
  choices:
    A: Cuando necesite consultar su mapa o GPS
    B: Solo si el vehículo está averiado
    C: Cuando necesite hacer una llamada telefónica
    D: Si está esperando a que otro vehículo lo alcance
  answer: B
  explanation: Es ilegal estacionar un vehículo motorizado en las partes pavimentadas
    o no pavimentadas de cualquier rampa de entrada o salida de cualquier autopista,
    a menos que el vehículo esté averiado.
- id: 520
  category: defensive_driving
  question: ¿Qué hace que un intercambio de 'entrecruzamiento' (weaving) sea particularmente
    peligroso?
  choices:
    A: El tráfico sale y entra por el mismo carril
    B: Los carriles son más estrechos que los carriles estándar de la interestatal
    C: Los conductores deben hacer giros cerrados a la izquierda a través del tráfico
    D: No hay límites de velocidad publicados en las rampas
  answer: A
  explanation: Una de las situaciones de gestión de carriles más peligrosas ocurre
    cuando el tráfico de la interestatal sale y entra por el mismo carril, lo que
    requiere atención total y reacciones rápidas.
- id: 521
  category: safe_driving_rules
  question: ¿Quién tiene permitido legalmente conducir sobre o a través de la sección
    divisoria (mediana) de una autopista interestatal?
  choices:
    A: Cualquier conductor que se pase de su salida
    B: Conductores de vehículos de alta ocupación (HOV)
    C: Solo vehículos de emergencia y cuadrillas de mantenimiento de carreteras
    D: Cualquier conductor durante un embotellamiento severo
  answer: C
  explanation: En la interestatal, NO puede conducir sobre o a través de ninguna sección
    divisoria o separación. Solo los vehículos de emergencia y las cuadrillas de mantenimiento
    de carreteras pueden cruzar la mediana de una interestatal.
- id: 522
  category: defensive_driving
  question: ¿Cuál es la práctica recomendada con respecto a conducir en los puntos
    ciegos de otros conductores en la interestatal?
  choices:
    A: Seguir de cerca por el lado para que puedan escuchar su motor
    B: Quedarse atrás o rebasarlos
    C: Encender y apagar las luces delanteras continuamente mientras esté en el punto
      ciego
    D: Mantener su velocidad y posición independientemente de su punto ciego
  answer: B
  explanation: No conduzca en el punto ciego de otros conductores. Viajar en una posición
    donde el conductor de adelante no pueda ver su vehículo es peligroso. Quédese
    atrás o rebáselos; NO los siga por el lado.
- id: 523
  category: safe_driving_rules
  question: ¿Cómo se utilizan los carriles para vehículos de alta ocupación (HOV)
    los fines de semana?
  choices:
    A: Están cerrados a todo el tráfico
    B: Están reservados estrictamente para vehículos de emergencia
    C: Sirven como carriles de uso general para todos los vehículos
    D: Requieren tres o más ocupantes en lugar de dos
  answer: C
  explanation: El carril HOV sirve como un carril de uso general los fines de semana
    y durante las horas de tráfico no pico en los días laborables.
- id: 524
  category: defensive_driving
  question: Según el manual, ¿por qué se considera que conducir de noche es mucho
    más peligroso que conducir de día?
  choices:
    A: Porque los límites de velocidad aumentan por la noche
    B: Porque hay más camiones comerciales en la carretera
    C: Debido a la fatiga, la visión drásticamente reducida y más conductores que
      han bebido
    D: Porque la iluminación de la interestatal se apaga con frecuencia para ahorrar
      energía
  answer: C
  explanation: Conducir de noche es mucho más peligroso que conducir de día. La fatiga
    y la visión drásticamente reducida son los principales responsables, y es más
    probable que haya conductores que han bebido en la carretera por la noche.
- id: 525
  category: defensive_driving
  question: ¿Con qué frecuencia debe detenerse y refrescarse para ayudar a evitar
    la hipnosis de la autopista?
  choices:
    A: Al menos cada 4 horas o 200 millas.
    B: Al menos cada 2 horas o 100 millas.
    C: Al menos cada 6 horas o 300 millas.
    D: Solo cuando necesite reabastecer combustible a su vehículo.
  answer: B
  explanation: Para evitar la hipnosis de la autopista, el manual recomienda tomar
    un descanso y salir del automóvil al menos cada dos horas, o aproximadamente cada
    100 millas.
- id: 526
  category: safe_driving_rules
  question: Para mantener la seguridad en la carretera, ¿cuál es el número máximo
    de horas que debe conducir por día?
  choices:
    A: 6 horas
    B: 8 horas
    C: 10 horas
    D: 12 horas
  answer: B
  explanation: El manual establece que es más seguro para usted y para los demás si
    no conduce más de ocho horas al día.
- id: 527
  category: signs_and_signals
  question: ¿Qué muestran las señales de mensaje dinámico (Dynamic Message Signs)
    cuando no están en uso?
  choices:
    A: El límite de velocidad actual de la interestatal.
    B: La hora y la temperatura local.
    C: Normalmente están en blanco.
    D: Anuncios de negocios locales.
  answer: C
  explanation: Las señales de mensaje dinámico proporcionan información en tiempo
    real a los automovilistas, pero el manual señala que estas señales normalmente
    están en blanco cuando no están en uso.
- id: 528
  category: defensive_driving
  question: ¿Qué comportamiento al conducir se describe como reducir la velocidad
    para mirar choques o cualquier cosa fuera de lo común, causando congestión de
    tráfico?
  choices:
    A: Seguir muy de cerca (Tailgating)
    B: Curiosidad morbosa (Rubbernecking)
    C: Hipnosis de la autopista
    D: Cambios de carril innecesarios
  answer: B
  explanation: El manual identifica el 'rubbernecking' (curiosidad morbosa) como reducir
    la velocidad para mirar choques o prácticamente cualquier otra cosa fuera de lo
    común, calificándolo como uno de los peores causantes de congestión.
- id: 529
  category: sharing_the_road
  question: ¿Qué debe hacer si las condiciones del tráfico hacen que no sea seguro
    cambiar de carril al acercarse a un vehículo de emergencia detenido en el arcén?
  choices:
    A: Detenerse en su carril hasta que el tráfico se despeje.
    B: Acelerar para pasar el vehículo de emergencia lo más rápido posible.
    C: Detenerse en el arcén opuesto.
    D: Reducir la velocidad y permanecer en el mismo carril.
  answer: D
  explanation: SOLO cuando las condiciones del tráfico hacen que no sea seguro realizar
    dicho cambio de carril, se le permite al automovilista responder a esta situación
    simplemente reduciendo la velocidad y permaneciendo en el mismo carril.
- id: 530
  category: sharing_the_road
  question: 'Además de los vehículos de emergencia y mantenimiento, la Ley de Moverse
    al Otro Carril (Move Over Law) de Tennessee también se aplica a:'
  choices:
    A: Todos los vehículos en movimiento en la interestatal.
    B: Vehículos motorizados estacionados con sus luces intermitentes de emergencia
      encendidas.
    C: Bicicletas que circulan por el arcén.
    D: Peatones que caminan por la carretera.
  answer: B
  explanation: El manual establece que, además de los vehículos de emergencia estacionados,
    la ley Move Over ahora se aplica a todos los vehículos motorizados estacionados,
    como su automóvil o camión, con sus luces intermitentes de emergencia encendidas.
- id: 531
  category: safe_driving_rules
  question: Si su vehículo se avería y necesita ayuda, ¿cómo debe hacer señales a
    otros conductores y a las autoridades?
  choices:
    A: Pararse en medio del carril y agitar los brazos.
    B: Levantar el capó y atar un paño blanco al capó o a la antena del radio.
    C: Encender y apagar las luces delanteras repetidamente.
    D: Tocar la bocina continuamente.
  answer: B
  explanation: Si tiene problemas con el vehículo y necesita ayuda, el manual aconseja
    levantar el capó y atar un paño blanco al capó o a la antena del radio.
- id: 532
  category: safe_driving_rules
  question: Si tiene problemas con el vehículo y se detiene en el acotamiento (shoulder),
    ¿cuál es el lugar más seguro para esperar ayuda?
  choices:
    A: Caminar por la interestatal para buscar un teléfono.
    B: Sentarse en el maletero de su automóvil.
    C: Dentro o cerca de su vehículo en el lado opuesto al tráfico.
    D: Pararse en el carril junto a su vehículo para dirigir el tráfico.
  answer: C
  explanation: El manual establece que, si es posible, es mejor permanecer dentro
    o cerca de su vehículo en el lado alejado del tráfico, y señala que caminar por
    la interestatal es peligroso.
- id: 533
  category: driver_responsibility
  question: Si se ve involucrado en un choque de tráfico en la interestatal, ¿cuándo
    permite la ley de Tennessee mover el vehículo al carril de emergencia?
  choices:
    A: Solo después de que la policía haya llegado y tomado fotos.
    B: Si el vehículo se puede conducir y no hay lesiones personales graves ni muertes.
    C: Nunca se le permite mover un vehículo después de un choque.
    D: Solo si el choque involucra a más de tres vehículos.
  answer: B
  explanation: Bajo la sección 'Muévalo por seguridad' (Move It for Safety), si el
    vehículo aún se puede conducir y NO HAY LESIONES PERSONALES GRAVES ni muertes,
    puede mover el vehículo o los vehículos al carril de emergencia.
- id: 534
  category: safe_driving_rules
  question: ¿Qué número puede marcar en su teléfono inalámbrico sin cargo para comunicarse
    con el Centro de Despacho de la Patrulla de Caminos de Tennessee?
  choices:
    A: '*DOT (*368)'
    B: '*HELP (*4357)'
    C: '*THP (*847)'
    D: '*911 (*911)'
  answer: C
  explanation: En caso de una emergencia en la carretera, puede marcar *THP (*847)
    para ser conectado con el despachador de la Patrulla de Caminos de Tennessee (Tennessee
    Highway Patrol) más cercano.
- id: 535
  category: defensive_driving
  question: 'Para ayudar a evitar la hipnosis de la interestatal, los conductores
    deben adquirir el hábito de:'
  choices:
    A: Mirar fijamente hacia adelante a las líneas de la carretera.
    B: Mover los ojos hacia la izquierda y hacia la derecha y revisar el espejo retrovisor.
    C: Mantener el interior del automóvil lo más cálido posible.
    D: Escuchar sonidos constantes del viento y el zumbido de los neumáticos.
  answer: B
  explanation: Para combatir la hipnosis de la interestatal, el manual aconseja a
    los conductores seguir moviendo los ojos hacia la izquierda y hacia la derecha
    y revisar el espejo retrovisor, evitando mirar fijamente hacia adelante.
- id: 536
  category: sharing_the_road
  question: Si un vehículo de emergencia está detenido en el acotamiento izquierdo
    de una carretera de varios carriles, ¿qué debe hacer de acuerdo con la Ley de
    Ceder el Paso (Move Over Law)?
  choices:
    A: Incorporarse al carril derecho de tráfico para liberar el carril del extremo
      izquierdo como barrera de seguridad.
    B: Incorporarse al carril izquierdo de tráfico para acercarse al vehículo.
    C: Detener su vehículo en el carril izquierdo.
    D: Conducir por el acotamiento derecho para rebasar.
  answer: A
  explanation: Si el vehículo de emergencia está detenido en el acotamiento izquierdo,
    el automovilista se incorpora al carril derecho de tráfico, liberando el carril
    del extremo izquierdo como barrera de seguridad.
- id: 537
  category: vehicle_information
  question: Según el manual, ¿cuál de los siguientes es un artículo recomendado para
    llevar en su automóvil específicamente para emergencias en viajes de invierno?
  choices:
    A: Un ventilador portátil
    B: Un raspador de ventanas para vidrios con hielo
    C: Refrigerante de motor adicional
    D: Un parasol
  answer: B
  explanation: La sección de equipo de seguridad y emergencia sugerido establece que
    durante los viajes de invierno, debe llevar una manta, un pequeño calentador portátil,
    un raspador de ventanas para vidrios con hielo y neumáticos para nieve o cadenas
    para neumáticos.
- id: 538
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado al entrar en una autopista interestatal?
  choices:
    A: Detenerse, revisar si hay autos y entrar cuando sea seguro.
    B: Revisar si hay autos, reducir la velocidad a 25 MPH antes de entrar al carril
      de tráfico.
    C: Revisar si hay autos, aumentar su velocidad para igualar el flujo del tráfico
      e incorporarse cuando el camino esté despejado.
    D: Tocar la bocina, mantener su velocidad actual e incorporarse directamente al
      carril derecho.
  answer: C
  explanation: Según las preguntas de muestra del examen del manual, al entrar en
    una autopista interestatal, debe revisar si hay autos, aumentar su velocidad para
    igualar el flujo del tráfico e incorporarse cuando el camino esté despejado.
- id: 539
  category: safe_driving_rules
  question: ¿Quién tiene permitido legalmente usar los cruces de emergencia en la
    interestatal en Tennessee?
  choices:
    A: Cualquier conductor que haya pasado su salida.
    B: Cualquier conductor, siempre que no haya otros vehículos presentes.
    C: Conductores de camiones comerciales durante el tráfico pesado.
    D: Solo vehículos de emergencia y cuadrillas de mantenimiento de carreteras.
  answer: D
  explanation: Los cruces de emergencia en la interestatal son legales en Tennessee
    solo para vehículos de emergencia y cuadrillas de mantenimiento de carreteras.
- id: 540
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo resulta dañado en un choque en la interestatal
    y no hay lesiones graves?
  choices:
    A: Dejar el vehículo en el carril de tráfico hasta que llegue la policía.
    B: Mover el vehículo dañado al acotamiento (shoulder).
    C: Detener el tráfico para intercambiar información de seguro de manera segura.
    D: Abandonar el vehículo y caminar hasta la salida más cercana.
  answer: B
  explanation: El Departamento de Transporte de Tennessee ha colocado letreros que
    recuerdan a los automovilistas que muevan sus vehículos dañados al acotamiento
    si no ha ocurrido ninguna lesión grave.
- id: 541
  category: defensive_driving
  question: ¿Estadísticamente, cuándo ocurren más choques fatales que en cualquier
    otro día?
  choices:
    A: Lunes y martes por la mañana.
    B: Miércoles y jueves por la noche.
    C: Viernes y sábados por la noche.
    D: Domingos por la tarde.
  answer: C
  explanation: El manual establece que ocurren más choques fatales los viernes y sábados
    por la noche que en cualquier otro día.
- id: 542
  category: safe_driving_rules
  question: ¿Cuál es la regla básica para conducir de noche de forma segura?
  choices:
    A: Usar siempre las luces altas.
    B: Nunca sobrepase el alcance de sus faros delanteros.
    C: Conducir al límite de velocidad indicado independientemente de la visibilidad.
    D: Mantener encendida la luz interior del techo.
  answer: B
  explanation: 'La regla básica para conducir de noche de forma segura es: NUNCA SOBREPASE
    EL ALCANCE DE SUS FAROS DELANTEROS, porque su rango de visibilidad está limitado
    por sus luces.'
- id: 543
  category: defensive_driving
  question: ¿Cómo debe evitar el resplandor de los faros delanteros que vienen en
    sentido contrario por la noche?
  choices:
    A: Mirar directamente a los faros que se aproximan para seguir al vehículo.
    B: Hacer cambios de luces altas repetidamente al conductor que viene de frente.
    C: Observar el borde derecho de la carretera y usar la línea blanca o el borde
      del camino como guía de dirección.
    D: Cerrar un ojo hasta que el vehículo pase.
  answer: C
  explanation: Para evitar el resplandor de las luces que vienen en sentido contrario,
    debe observar el borde derecho de la carretera y usar la línea blanca o el borde
    del camino como guía de dirección.
- id: 544
  category: vehicle_information
  question: Por ley, ¿sus faros delanteros deben permitirle ver claramente a cualquier
    persona en la carretera a qué distancia mínima por delante de su automóvil?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley exige faros delanteros que le permitan ver claramente a cualquier
    persona en la carretera al menos a doscientos (200) pies por delante de su automóvil.
- id: 545
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar la intensidad de sus faros delanteros (cambiar
    a luces bajas) al encontrarse o rebasar vehículos?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Debe cumplir con los requisitos adecuados de atenuar sus luces por
    la noche al encontrarse o rebasar vehículos a una distancia de 500 pies.
- id: 546
  category: safe_driving_rules
  question: Siempre que se estacione en o a lo largo de una carretera por la noche,
    ¿qué debe hacer?
  choices:
    A: Dejar los faros delanteros en luz alta.
    B: Dejar los faros delanteros en luz baja.
    C: Dejar encendidas las luces de emergencia y de estacionamiento.
    D: Apagar todas las luces para ahorrar batería.
  answer: C
  explanation: Siempre que se estacione en o a lo largo de una carretera por la noche,
    deje encendidas las luces de emergencia y de estacionamiento. Nunca deje los faros
    delanteros encendidos, ya que pueden cegar o confundir a los conductores que se
    aproximan.
- id: 547
  category: defensive_driving
  question: ¿Cuándo es el pavimento particularmente traicionero y más resbaladizo
    durante el clima lluvioso?
  choices:
    A: Después de que ha estado lloviendo fuertemente durante varias horas.
    B: Cuando comienza a llover por primera vez.
    C: Justo después de que deja de llover.
    D: Al conducir a través de charcos profundos.
  answer: B
  explanation: El pavimento es particularmente traicionero cuando comienza a llover
    por primera vez porque las acumulaciones de suciedad y aceite se mezclan con el
    agua, creando una película grasienta sobre la calzada.
- id: 548
  category: safe_driving_rules
  question: Al conducir en clima lluvioso, ¿qué luces debe utilizar?
  choices:
    A: Solo las luces de estacionamiento.
    B: Faros delanteros en luz alta.
    C: Faros delanteros en luz baja.
    D: Solo las luces intermitentes de emergencia.
  answer: C
  explanation: El clima lluvioso requiere conducir con los faros delanteros en luz
    baja para que la luz esté en la carretera donde usted la necesita.
- id: 549
  category: defensive_driving
  question: ¿Cuál es el mejor consejo para conducir en condiciones de niebla o humo?
  choices:
    A: Encender las luces altas y conducir rápido a través de ello.
    B: Seguir muy de cerca al vehículo que va delante.
    C: NO conduzca en condiciones de niebla o humo.
    D: Usar solo las luces de estacionamiento.
  answer: C
  explanation: El manual establece que el mejor consejo para conducir en condiciones
    de niebla o humo es "NO HACERLO". Si debe viajar, debe tomar precauciones específicas.
- id: 550
  category: safe_driving_rules
  question: Si debe viajar en condiciones de niebla o humo, ¿cómo debe usar las luces
    de su vehículo?
  choices:
    A: Conducir con las luces en luz alta.
    B: Conducir con las luces en luz baja.
    C: Conducir solo con las luces de estacionamiento encendidas.
    D: Conducir solo con las luces antiniebla encendidas.
  answer: B
  explanation: Si debe viajar en condiciones de niebla o humo, debe conducir con las
    luces en luz baja. Las luces altas afectarán su visibilidad, y nunca debe conducir
    solo con las luces de estacionamiento o antiniebla encendidas.
- id: 551
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo se apaga o queda inmovilizado mientras
    conduce en la niebla?
  choices:
    A: Permanecer dentro del vehículo y esperar ayuda.
    B: Pararse directamente detrás del vehículo para indicar al tráfico que lo rodee.
    C: Alejarse del vehículo para evitar lesiones personales.
    D: Dejar el vehículo en el carril de tráfico y caminar a casa.
  answer: C
  explanation: Si su vehículo se apaga o queda inmovilizado en la niebla, aléjese
    del vehículo para evitar lesiones personales.
- id: 552
  category: defensive_driving
  question: ¿Por qué debe evitar hacer cambios de luces (luces altas) para advertir
    a un conductor que viene en sentido contrario por la noche?
  choices:
    A: Agota la batería de su vehículo.
    B: Es ilegal en todas las circunstancias.
    C: Podría servir como distracción e interferir con su conducción, resultando en
      una colisión.
    D: Hará que sus faros se quemen más rápido.
  answer: C
  explanation: Debe evitar hacer cambios de luces altas para advertir al otro conductor,
    ya que podría servir como distracción e interferir con su conducción, resultando
    en una colisión.
- id: 553
  category: safe_driving_rules
  question: ¿Qué debe hacer si debe detener su vehículo en niebla densa porque no
    puede ver el borde de la carretera?
  choices:
    A: Detenerse en medio del carril de tráfico y encender las luces altas.
    B: Salirse de la carretera lo más a la derecha posible, bien fuera del carril
      de tráfico, y encender las luces de emergencia.
    C: Detenerse en la calzada y tocar la bocina repetidamente para advertir a los
      demás.
    D: Salirse al arcén izquierdo y apagar todas las luces.
  answer: B
  explanation: El manual establece que si no puede ver el borde de la carretera en
    la niebla, debe salirse lo más a la derecha posible, bien fuera del carril de
    tráfico, y encender las luces de emergencia.
- id: 554
  category: defensive_driving
  question: ¿Por qué el pavimento puede estar muy resbaladizo durante los primeros
    minutos cuando empieza a llover en un día caluroso?
  choices:
    A: La lluvia se congela inmediatamente sobre el asfalto caliente.
    B: El agua se mezcla con la suciedad para crear lodo profundo.
    C: El calor hace que el aceite del asfalto suba a la superficie, volviéndolo extremadamente
      resbaladizo hasta que se lava.
    D: El pavimento caliente hace que la lluvia se evapore instantáneamente, reduciendo
      la tracción de los neumáticos.
  answer: C
  explanation: Según el manual, el calor hace que el aceite del asfalto suba a la
    superficie, y esto hace que la carretera sea extremadamente resbaladiza hasta
    que el aceite se lava.
- id: 555
  category: safe_driving_rules
  question: ¿Qué exige la ley de Tennessee al conducir a través de niebla densa, lluvia
    intensa o nieve durante el día?
  choices:
    A: Encender las luces altas de los faros.
    B: Encender las luces de emergencia.
    C: Encender las luces bajas de los faros.
    D: Encender la luz interior del techo.
  answer: C
  explanation: 'El manual establece explícitamente: "AL CONDUCIR A TRAVÉS DE NIEBLA
    DENSA, LLUVIA INTENSA O NIEVE DURANTE EL DÍA, ENCIENDA LAS LUCES BAJAS... también
    es un requisito de la ley de Tennessee".'
- id: 556
  category: defensive_driving
  question: Si su vehículo comienza a patinar sobre el agua (hidroplaneo), ¿cuál es
    la mejor manera de reducir la velocidad?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Poner el vehículo en punto muerto (neutral) y avanzar por inercia.
    C: Bombear los frenos rápidamente.
    D: Reducir la velocidad gradualmente dejando de presionar el acelerador.
  answer: D
  explanation: El manual aconseja que si su vehículo comienza a hidroplanear, debe
    "reducir la velocidad gradualmente dejando de presionar el acelerador" y "no frenar
    bruscamente".
- id: 557
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una afirmación verdadera con respecto al hidroplaneo?
  choices:
    A: Solo ocurre a velocidades superiores a 55 mph.
    B: Las distancias de frenado pueden triplicarse y el control de la dirección puede
      reducirse o perderse.
    C: Aumenta el control de la dirección debido a la resistencia del agua.
    D: Solo ocurre cuando se conduce a través de aguas de inundación profundas.
  answer: B
  explanation: El manual señala que cuando ocurre el hidroplaneo, "las distancias
    de frenado pueden triplicarse y el control de la dirección puede reducirse o perderse".
    También establece que los neumáticos pueden hidroplanear a CUALQUIER velocidad.
- id: 558
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a derrapar?
  choices:
    A: Frenar bruscamente para detener el vehículo rápidamente.
    B: Girar el volante en la dirección opuesta a la que desea que vaya el coche.
    C: No tocar el freno y girar el volante en la dirección en la que desea que vaya
      su coche.
    D: Acelerar rápidamente para recuperar la tracción.
  answer: C
  explanation: Si su vehículo comienza a derrapar, el manual indica "no tocar el freno"
    y "girar el volante en la dirección en la que desea que vaya su coche".
- id: 559
  category: defensive_driving
  question: ¿Cómo debe reaccionar si sus ruedas se salen de la calzada pavimentada?
  choices:
    A: Girar el volante bruscamente hacia el pavimento de repente.
    B: Frenar bruscamente y mantener el pedal presionado.
    C: Acelerar para volver a la carretera rápidamente.
    D: Levantar el pie del acelerador y frenar ligera y brevemente.
  answer: D
  explanation: Para recuperar el control cuando se está fuera del pavimento, debe
    "levantar el pie del acelerador pero NO aplicar el freno de repente" y "frenar
    ligera y brevemente".
- id: 560
  category: signs_and_signals
  question: ¿Cuál es la función principal de las bandas sonoras (Rumble Stripes) en
    las carreteras de Tennessee?
  choices:
    A: Despertar a los conductores que se quedan dormidos al volante.
    B: Mejorar la visibilidad nocturna en condiciones húmedas de la línea de borde.
    C: Indicar el final próximo de una autopista.
    D: Reducir la velocidad de los vehículos que circulan con exceso de velocidad
      en zonas residenciales.
  answer: B
  explanation: Aunque las bandas sonoras tienen un efecto secundario de vibración
    y ruido, el manual establece que "su función principal es mejorar la visibilidad
    nocturna en condiciones húmedas de la línea de borde".
- id: 561
  category: safe_driving_rules
  question: ¿Cuánta agua en movimiento se necesita normalmente para arrastrar a la
    mayoría de los automóviles?
  choices:
    A: 6 a 12 pulgadas
    B: 18 a 24 pulgadas
    C: 36 a 48 pulgadas
    D: Al menos 60 pulgadas
  answer: B
  explanation: El manual advierte que 'la mayoría de los automóviles pueden ser arrastrados
    por 18 a 24 pulgadas de agua en movimiento'.
- id: 562
  category: penalties_and_points
  question: ¿Qué puede suceder si un conductor ignora a sabiendas las barricadas de
    advertencia de inundación claramente visibles y conduce hacia una zona inundada?
  choices:
    A: Solo recibirán una advertencia verbal de las autoridades.
    B: Pueden ser acusados de conducción temeraria y ser responsables de los costos
      de rescate.
    C: Su vehículo será confiscado permanentemente por el estado.
    D: Perderán automáticamente su licencia por cinco años.
  answer: B
  explanation: Según el manual, ignorar las señales o barricadas de advertencia de
    inundación puede resultar en que el conductor sea 'acusado de conducción temeraria'
    y sea 'responsable de la restitución de fondos por el costo de su rescate'.
- id: 563
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si detecta un tornado mientras conduce?
  choices:
    A: Intente dejar atrás el tornado conduciendo a la velocidad máxima.
    B: Quédese en su automóvil y estaciónese debajo de un paso elevado.
    C: Salga del automóvil, busque refugio en una zanja o zona baja y acuéstese boca
      abajo.
    D: Conduzca hacia el tornado para pasarlo rápidamente.
  answer: C
  explanation: 'Si detecta un tornado, el manual aconseja: ''NO intente dejarlo atrás.
    Salga del automóvil, busque refugio en una zanja o zona baja y acuéstese boca
    abajo para protegerse de los escombros que vuelan''.'
- id: 564
  category: sharing_the_road
  question: Cuando un camión grande o un autobús lo esté rebasando por la izquierda,
    ¿qué debe hacer para manejar las ráfagas de viento que estos crean?
  choices:
    A: Muévase lo más posible a la derecha de su carril y reduzca la velocidad.
    B: Muévase al lado izquierdo de su carril para bloquear el viento.
    C: Acelere rápidamente para mantenerse por delante del camión.
    D: Toque la bocina para advertir al conductor del camión.
  answer: A
  explanation: El manual establece que cuando un camión o autobús lo esté rebasando
    por la izquierda, debe 'moverse lo más posible a la derecha de su carril y reducir
    la velocidad'.
- id: 565
  category: defensive_driving
  question: ¿Cómo afecta su conducción un fuerte viento de cola (viento que sopla
    desde detrás de su vehículo)?
  choices:
    A: Hace que la dirección sea significativamente más difícil.
    B: Disminuye su velocidad, requiriendo que acelere más.
    C: Aumenta su velocidad, por lo que tendrá que desacelerar y comenzar a frenar
      antes para detenerse.
    D: Hace que su vehículo experimente hidroplaneo sobre pavimento seco.
  answer: C
  explanation: El manual explica que 'un fuerte viento de cola (viento que sopla desde
    detrás de su vehículo) aumentará su velocidad, por lo que tendrá que desacelerar
    y comenzar a frenar antes para detenerse'.
- id: 566
  category: defensive_driving
  question: Si el sol está directamente detrás de usted mientras conduce, ¿de qué
    peligro debe estar consciente?
  choices:
    A: Es posible que sus limpiaparabrisas dejen de funcionar.
    B: Los conductores que vienen en sentido contrario pueden tener un problema de
      resplandor y podrían no ver sus luces direccionales.
    C: El motor de su vehículo puede sobrecalentarse más rápidamente.
    D: No podrá ver los instrumentos de su tablero.
  answer: B
  explanation: 'El manual advierte: ''Si el sol está detrás de usted, los conductores
    que vienen en sentido contrario pueden tener el problema del resplandor. Tenga
    en cuenta que es posible que no puedan ver sus luces direccionales o su automóvil''.'
- id: 567
  category: vehicle_information
  question: ¿Cuál es la técnica correcta para desatascar un vehículo del lodo o la
    nieve?
  choices:
    A: Cambie a una marcha alta y haga girar las ruedas lo más rápido posible.
    B: Cambie a una marcha baja, mantenga las ruedas delanteras rectas y presione
      suavemente el pedal del acelerador.
    C: Gire el volante bruscamente de lado a lado mientras acelera fuertemente.
    D: Pise los frenos bruscamente mientras cambia entre marcha adelante (drive) y
      reversa.
  answer: B
  explanation: Para desatascarse del lodo o la nieve, el manual aconseja 'cambiar
    a una marcha baja y mantener las ruedas delanteras rectas', 'presionar suavemente
    el pedal del acelerador' y 'evitar que las ruedas patinen'.
- id: 568
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo se atasca en lodo o nieve profunda?
  choices:
    A: Cambie a una marcha alta y haga girar las ruedas lo más rápido posible.
    B: Cambie a una marcha baja y mantenga las ruedas delanteras rectas.
    C: Bombee el pedal del acelerador rápidamente para ganar tracción.
    D: Gire el volante bruscamente de lado a lado.
  answer: B
  explanation: Al intentar desatascar su vehículo, el manual aconseja cambiar a una
    marcha baja y mantener las ruedas delanteras rectas, mientras presiona suavemente
    el pedal del acelerador y evita que las ruedas patinen.
- id: 569
  category: vehicle_information
  question: ¿Cuándo debe instalar cadenas para neumáticos en su vehículo?
  choices:
    A: Después de quedarse atascado en la nieve.
    B: Mientras conduce en medio de la calzada.
    C: Antes de conducir en nieve o lodo.
    D: Solo cuando conduzca sobre hielo sólido.
  answer: C
  explanation: El manual establece que debe conducir lo más lejos posible hacia el
    lado derecho de la calzada antes de instalar las cadenas, y colocarlas en los
    neumáticos antes de conducir en nieve o lodo.
- id: 570
  category: defensive_driving
  question: ¿Cuál de los siguientes se considera uno de los tres grandes errores que
    cometen la mayoría de los conductores en nieve e hielo?
  choices:
    A: Girar el volante en exceso y derrapar las ruedas.
    B: Usar las luces bajas de los faros delanteros.
    C: Conducir a una velocidad constante.
    D: Usar el calefactor-desempañador.
  answer: A
  explanation: 'Los tres grandes errores de la mayoría de los conductores en nieve
    e hielo son: acelerar en exceso y hacer que las ruedas patinen, frenar en exceso
    y hacer que las ruedas se deslicen, y girar el volante en exceso y hacer que las
    ruedas derrapen.'
- id: 571
  category: safe_driving_rules
  question: ¿De qué ventanas debe limpiar la nieve, el hielo o la escarcha antes de
    conducir en clima invernal?
  choices:
    A: Solo el parabrisas.
    B: El parabrisas y las ventanas laterales delanteras.
    C: Solo la ventana trasera.
    D: TODAS las ventanas.
  answer: D
  explanation: El manual establece explícitamente que se debe limpiar la nieve, el
    hielo o la escarcha de TODAS las ventanas antes de conducir.
- id: 572
  category: safe_driving_rules
  question: 'Al viajar a 20 M.P.H., la baja tracción por el hielo y la nieve puede
    aumentar su distancia de frenado a:'
  choices:
    A: 50 pies o más.
    B: 100 pies o más.
    C: 150 pies o más.
    D: 200 pies o más.
  answer: D
  explanation: Al viajar a 20 M.P.H., la baja tracción puede aumentar la distancia
    de frenado a 200 pies o más.
- id: 573
  category: vehicle_information
  question: ¿Cómo debe aplicar los frenos sobre nieve o hielo para mantener el control
    direccional?
  choices:
    A: Bombee el pedal del freno rápidamente.
    B: Aplique presión fuerte y continua hasta que el vehículo se detenga.
    C: Aplique presión constante hasta un punto justo antes del bloqueo.
    D: Pise los frenos a fondo y manténgalos presionados.
  answer: C
  explanation: El manual aconseja aplicar los frenos con firmeza, hasta un punto justo
    antes del bloqueo, y NO bombear el pedal del freno; simplemente aplique una presión
    constante para obtener la mejor combinación de esfuerzo de frenado y control direccional.
- id: 574
  category: vehicle_information
  question: 'Para que los frenos antibloqueo (ABS) funcionen correctamente durante
    una parada de emergencia, usted debe:'
  choices:
    A: Bombear el pedal del freno.
    B: Aplicar presión constante y firme al pedal.
    C: Tocar ligeramente los frenos.
    D: Usar el freno de estacionamiento en su lugar.
  answer: B
  explanation: Para que los frenos antibloqueo funcionen correctamente, o para que
    funcionen en absoluto, debe aplicar una presión constante y firme al pedal. Durante
    una parada de emergencia, presione el pedal del freno hasta el fondo si es necesario.
- id: 575
  category: defensive_driving
  question: ¿Por qué debe tener especial precaución al conducir sobre puentes en clima
    gélido?
  choices:
    A: Los puentes suelen construirse con inclinaciones más pronunciadas.
    B: El hielo se forma en los puentes antes que en las carreteras adyacentes.
    C: Los puentes tienen menos tráfico para compactar la nieve.
    D: Los puentes absorben más calor del sol.
  answer: B
  explanation: Por lo general, las señales indican que el hielo se forma en los puentes
    antes que en las carreteras adyacentes, lo que los hace inesperadamente resbaladizos.
- id: 576
  category: driver_testing
  question: Por ley, ¿qué porcentaje de las preguntas en el examen de conocimientos
    para conductores de Tennessee debe tratar sobre alcohol y drogas?
  choices:
    A: Al menos el 10 por ciento.
    B: Al menos el 15 por ciento.
    C: Al menos el 20 por ciento.
    D: Al menos el 25 por ciento.
  answer: D
  explanation: Por ley, al menos el 25 por ciento de las preguntas del examen de conocimientos
    debe consistir en preguntas que traten el tema del alcohol, otras drogas y la
    conducción.
- id: 577
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo le toma al hígado oxidar una bebida alcohólica?
  choices:
    A: 15 minutos.
    B: 30 minutos.
    C: Una hora.
    D: Dos horas.
  answer: C
  explanation: Al llegar al hígado, el alcohol comienza a oxidarse inmediatamente.
    Sin embargo, el hígado solo puede oxidar aproximadamente una bebida por hora.
- id: 578
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de recuperar la sobriedad
    después de beber alcohol?
  choices:
    A: Beber café solo (negro).
    B: Tomar una ducha fría.
    C: Hacer ejercicio vigorosamente.
    D: Dejar pasar el tiempo.
  answer: D
  explanation: La tasa de oxidación no puede aumentarse bebiendo café, haciendo ejercicio,
    tomando una ducha fría ni con ninguna otra cosa. Solo el tiempo puede sobredimensionar
    a una persona que ha estado bebiendo.
- id: 579
  category: alcohol_drugs_health
  question: En Tennessee, ¿qué nivel de concentración de alcohol en sangre (BAC) es
    siempre ilegal por intoxicación?
  choices:
    A: '.04'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: En la mayoría de los estados, incluido Tennessee, .08 es el nivel de
    intoxicación que siempre es ilegal.
- id: 580
  category: alcohol_drugs_health
  question: Si dos personas pesan lo mismo, ¿cómo afecta la grasa corporal a la intoxicación
    por alcohol?
  choices:
    A: La persona con más grasa corporal mostrará signos de intoxicación primero.
    B: La persona con menos grasa corporal mostrará signos de intoxicación primero.
    C: La grasa corporal no tiene efecto sobre la rapidez con la que una persona se
      intoxica.
    D: Ambas personas se intoxicarán exactamente al mismo ritmo.
  answer: A
  explanation: El alcohol puede absorberse en agua, no en grasa. Las personas con
    menos grasa corporal tienen más agua en la cual diluir el alcohol. Por lo tanto,
    trago por trago, si las personas pesan lo mismo, la que tiene más grasa corporal
    mostrará signos de intoxicación primero.
- id: 581
  category: alcohol_drugs_health
  question: Con una concentración de alcohol en sangre (BAC) del .10 por ciento, ¿qué
    tan probable es que cause un choque en comparación con si estuviera sobrio?
  choices:
    A: Dos veces más probable.
    B: Siete veces más probable.
    C: Veinticinco veces más probable.
    D: Cincuenta veces más probable.
  answer: B
  explanation: Con un BAC del .10 por ciento, usted tiene siete veces más probabilidades
    de causar un choque que si estuviera sobrio.
- id: 582
  category: alcohol_drugs_health
  question: ¿Cuáles son las dos capacidades más importantes para la tarea de conducir
    que se ven afectadas por pequeñas cantidades de alcohol?
  choices:
    A: La audición y el tiempo de reacción
    B: El juicio y la visión
    C: La dirección y el frenado
    D: El estado de alerta y la concentración
  answer: B
  explanation: 'El manual establece: ''Las dos capacidades más importantes para la
    tarea de conducir son el juicio y la visión, y ambas se ven afectadas por pequeñas
    cantidades de alcohol''.'
- id: 583
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol la visión de un conductor por la noche?
  choices:
    A: Mejora el tiempo de recuperación del deslumbramiento.
    B: Reduce la capacidad de ver con claridad por la noche en más de la mitad.
    C: Aumenta la visión lateral en un 30 por ciento.
    D: Tensa los músculos oculares para enfocar mejor.
  answer: B
  explanation: El alcohol disminuye la claridad de la visión. El manual establece
    explícitamente que reduce la capacidad de ver con claridad por la noche en más
    de la mitad.
- id: 584
  category: alcohol_drugs_health
  question: ¿A qué concentración de alcohol en sangre (BAC) considera la ley que un
    conductor está legalmente intoxicado?
  choices:
    A: .04 por ciento
    B: .05 por ciento
    C: .08 por ciento
    D: .10 por ciento
  answer: C
  explanation: El manual indica que un BAC de .08 por ciento o superior se considera
    'INTOXICACIÓN LEGAL' y es ilegal conducir cuando la concentración de alcohol es
    de .08 por ciento o más.
- id: 585
  category: alcohol_drugs_health
  question: ¿Qué sucede cuando se mezcla alcohol con otro depresor, como tranquilizantes
    o sedantes?
  choices:
    A: Los efectos se anulan entre sí.
    B: Los efectos simplemente se suman.
    C: Los efectos se multiplican.
    D: El alcohol actúa como un estimulante para contrarrestar el depresor.
  answer: C
  explanation: Cuando el alcohol se combina con otro depresor, como tranquilizantes
    o sedantes, los resultados no solo se suman; se multiplican, haciendo que los
    efectos sean mucho más fuertes y peligrosos.
- id: 586
  category: penalties_and_points
  question: De acuerdo con la Ley de Consentimiento Implícito de Tennessee, ¿cuál
    es la sanción probable si se niega a realizar una prueba química de alcohol o
    drogas cuando se lo solicita un oficial de la ley?
  choices:
    A: Una multa de $500
    B: Suspensión de los privilegios de conducir por 12 meses
    C: Sentencia de cárcel inmediata de 30 días
    D: Instalación obligatoria de un dispositivo de bloqueo de encendido (ignition
      interlock device)
  answer: B
  explanation: Si es arrestado y se niega a la solicitud de un oficial de la ley de
    realizar la prueba, es probable que el tribunal suspenda sus privilegios de conducir
    por doce (12) meses.
- id: 587
  category: alcohol_drugs_health
  question: ¿Es una defensa válida para un cargo de DUI si el medicamento que estaba
    tomando fue recetado por un médico?
  choices:
    A: Sí, siempre que tenga el frasco de la receta en el automóvil.
    B: Sí, los medicamentos recetados no afectan la conducción.
    C: No, el hecho de que un medicamento sea recetado por ley no es defensa para
      conducir bajo su influencia.
    D: No, a menos que el médico le haya dado específicamente un permiso por escrito
      para conducir.
  answer: C
  explanation: 'El manual establece claramente: ''El hecho de que un medicamento sea
    recetado, por ley, NO es defensa para conducir bajo su influencia''.'
- id: 588
  category: penalties_and_points
  question: ¿Qué permite hacer a los oficiales de la ley la ley de 'No Negativa' (No
    Refusal), aprobada en 2012?
  choices:
    A: Suspender la licencia de un conductor permanentemente en la primera infracción.
    B: Solicitar órdenes de registro para muestras de sangre en casos que involucren
      a sospechosos de conducir bajo los efectos del alcohol o drogas.
    C: Arrestar a los pasajeros en un vehículo conducido por un conductor ebrio.
    D: Confiscar el vehículo de cualquier persona que se niegue a un alcoholímetro.
  answer: B
  explanation: La ley de 'No Negativa' permite a los oficiales de la ley solicitar
    órdenes de registro para muestras de sangre en casos que involucren a sospechosos
    de conducir bajo los efectos del alcohol o drogas.
- id: 589
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de alcohol al estado de alerta y la concentración
    de un conductor?
  choices:
    A: Actúa como un estimulante para aumentar el estado de alerta.
    B: Acelera los impulsos nerviosos y las funciones corporales.
    C: Actúa como un depresor y limita la capacidad del conductor para estar alerta
      y concentrarse.
    D: No tiene efecto en la concentración hasta que el BAC alcanza el .10 por ciento.
  answer: C
  explanation: El alcohol, en cualquier concentración, es un depresor, no un estimulante.
    Ralentiza todos los impulsos nerviosos y las funciones corporales, limitando la
    capacidad del conductor para estar alerta y concentrarse.
- id: 590
  category: alcohol_drugs_health
  question: ¿A qué nivel de BAC se ven afectados la reacción y la coordinación?
  choices:
    A: Tan bajo como .02 por ciento
    B: Solo por encima del .05 por ciento
    C: Exactamente al .08 por ciento
    D: Al .10 por ciento y superior
  answer: A
  explanation: El manual señala que la reacción y la coordinación se ven afectadas
    por el consumo de alcohol desde un nivel tan bajo como .02 por ciento de BAC.
- id: 591
  category: alcohol_drugs_health
  question: ¿Puede un conductor ser condenado por DUI con una concentración de alcohol
    en sangre (BAC) del .00 por ciento?
  choices:
    A: No, un BAC del .00 por ciento exonera al conductor de cualquier cargo por DUI.
    B: Sí, si su capacidad para conducir está suficientemente deteriorada por las
      drogas.
    C: Sí, pero solo si es menor de 21 años de edad.
    D: No, se requiere un BAC de al menos .02 por ciento para una condena.
  answer: B
  explanation: Un conductor puede registrar un BAC del .00 por ciento y aun así ser
    condenado por DUI si su capacidad para conducir está suficientemente deteriorada
    por las drogas. El nivel de BAC no exonera al conductor cuando es inferior al
    .08 por ciento.
- id: 592
  category: alcohol_drugs_health
  question: ¿Cuál es la relación entre el alcohol y los músculos oculares?
  choices:
    A: El alcohol hace que los músculos oculares se tensen, mejorando el enfoque.
    B: El alcohol relaja los músculos oculares, causando una visión deficiente ante
      el deslumbramiento e incapacidad para enfocar correctamente.
    C: El alcohol estimula los músculos oculares, aumentando la velocidad de recuperación
      del deslumbramiento.
    D: El alcohol no tiene efecto en los músculos oculares, solo en el cerebro.
  answer: B
  explanation: La visión ante el deslumbramiento es deficiente debido a la relajación
    de los músculos oculares. Los músculos oculares se relajan con el alcohol y no
    pueden enfocar correctamente.
- id: 593
  category: alcohol_drugs_health
  question: Según el manual, ¿qué porcentaje de la información utilizada al conducir
    es proporcionada por los ojos?
  choices:
    A: Aproximadamente el 50 por ciento
    B: Aproximadamente el 70 por ciento
    C: Casi el 90 por ciento
    D: 100 por ciento
  answer: C
  explanation: Debido a que los ojos proporcionan casi el 90 por ciento de la información
    utilizada al conducir, cualquier restricción en la visión puede causar resultados
    desastrosos.
- id: 594
  category: penalties_and_points
  question: ¿Son diferentes las sanciones por un arresto por DUI si el conductor estaba
    bajo los efectos de medicamentos recetados en lugar de alcohol?
  choices:
    A: Sí, los DUI por medicamentos recetados conllevan sanciones más leves.
    B: Sí, los DUI por medicamentos recetados solo resultan en una advertencia por
      la primera infracción.
    C: No, las sanciones son las mismas ya sea que el conductor haya consumido alcohol
      o drogas.
    D: No, pero los DUI por medicamentos recetados no aparecen en su historial de
      conducción.
  answer: C
  explanation: Las sanciones por un arresto por DUI son las mismas ya sea que el conductor
    haya consumido alcohol o drogas (incluso medicamentos recetados o de venta libre).
- id: 595
  category: alcohol_drugs_health
  question: ¿Qué es lo primero que se ve afectado después de que una persona consume
    alcohol?
  choices:
    A: Coordinación
    B: Visión
    C: Juicio
    D: Emociones
  answer: C
  explanation: Según el manual, lo primero que se ve afectado después de beber alcohol
    es el juicio de una persona.
- id: 596
  category: penalties_and_points
  question: Según la Ley de Protección Infantil contra la Conducción en Estado de
    Ebriedad (Drunk Driving Child Protection Act), ¿cuál es la sentencia mínima obligatoria
    de cárcel por violar las leyes de DUI mientras se está acompañado por un menor
    de 18 años?
  choices:
    A: 48 horas
    B: 7 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La Ley de Protección Infantil contra la Conducción en Estado de Ebriedad
    impone una sentencia mínima obligatoria de cárcel de 30 días y una multa mínima
    de $1,000 por violar las leyes de DUI cuando se está acompañado por un menor de
    18 años.
- id: 597
  category: penalties_and_points
  question: Si tiene 18, 19 o 20 años y es condenado por comprar o poseer una bebida
    alcohólica por primera vez, ¿por cuánto tiempo perderá su privilegio de conducir?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que cumpla 21 años
  answer: B
  explanation: Si tiene 18, 19 o 20 años y es condenado por comprar, intentar comprar
    o poseer cualquier bebida alcohólica, perderá su privilegio de conducir durante
    un año por una primera infracción.
- id: 598
  category: alcohol_drugs_health
  question: Aproximadamente, ¿cuánto tiempo se tarda en anular los efectos embriagadores
    de tres bebidas alcohólicas?
  choices:
    A: Una hora
    B: Dos horas
    C: Tres horas
    D: Cuatro horas
  answer: C
  explanation: Se tarda aproximadamente una hora en anular los efectos de una bebida,
    por lo que se tardan unas tres horas en anular los efectos embriagadores de tres
    bebidas.
- id: 599
  category: penalties_and_points
  question: ¿Cuál es el tiempo mínimo de cárcel por una primera condena de DUI si
    la concentración de alcohol en sangre (BAC) del conductor es de 0.20% o más?
  choices:
    A: 48 horas
    B: 7 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: Para una primera condena, el tiempo de cárcel es de 48 horas, pero
    aumenta a 7 días si el BAC es de 0.20% o más.
- id: 600
  category: penalties_and_points
  question: 'Si está operando un vehículo motorizado bajo la influencia y se ve involucrado
    en un choque que resulta en la muerte de otra persona, puede ser acusado de:'
  choices:
    A: Agresión agravada
    B: Homicidio vehicular
    C: Poner en peligro a un niño de forma especialmente agravada
    D: Poner en peligro de forma imprudente
  answer: B
  explanation: Si está operando un vehículo motorizado bajo la influencia de una droga
    o alcohol, y se ve involucrado en un choque que resulta en la muerte de otra persona(s),
    puede ser acusado de homicidio vehicular.
- id: 601
  category: penalties_and_points
  question: 'Para un infractor juvenil de entre 13 y 17 años, una primera condena
    por posesión de alcohol o drogas resulta en la suspensión del privilegio de conducir
    por:'
  choices:
    A: 6 meses o hasta los 16 años, lo que sea más largo
    B: 1 año o hasta los 17 años, lo que sea más largo
    C: 2 años o hasta los 18 años, lo que sea más largo
    D: Hasta los 21 años
  answer: B
  explanation: Si tienes entre 13 y 17 años y se determina que has poseído, consumido
    o vendido alcohol o drogas, tu privilegio de conducir será suspendido por un año
    o hasta los 17 años, lo que sea más largo.
- id: 602
  category: alcohol_drugs_health
  question: 'La cantidad de alcohol en una botella de cerveza de 12 onzas es aproximadamente
    igual a:'
  choices:
    A: Un trago (shot) de whisky de 1 onza
    B: Dos tragos (shots) de whisky de 1 onza
    C: Una copa de vino de 6 onzas
    D: Media onza de alcohol puro
  answer: A
  explanation: El manual establece que la cantidad de alcohol en una botella de cerveza
    (de 12 onzas) es aproximadamente igual a la de un trago (shot) de whisky (de 1
    onza).
- id: 603
  category: penalties_and_points
  question: ¿Cuál es el rango de multa por una segunda condena por DUI?
  choices:
    A: $350 - $1,500
    B: $600 - $3,500
    C: $1,100 - $10,000
    D: $3,000 - $15,000
  answer: B
  explanation: Según la tabla de sanciones por DUI, las multas por una segunda condena
    oscilan entre $600 y $3,500.
- id: 604
  category: penalties_and_points
  question: 'Bajo la ley de BAC para menores de 21 años, una persona que tiene al
    menos 16 años pero aún no ha cumplido los 21 será condenada por conducir bajo
    los efectos del alcohol siendo menor de edad si se le encuentra conduciendo con
    un BAC de al menos:'
  choices:
    A: .01 por ciento
    B: .02 por ciento
    C: .04 por ciento
    D: .08 por ciento
  answer: B
  explanation: Una persona que tiene al menos 16 años, pero aún no tiene 21, y que
    sea sorprendida conduciendo con un BAC de .02 por ciento será condenada por conducir
    bajo los efectos del alcohol siendo menor de edad.
- id: 605
  category: penalties_and_points
  question: 'Como condición de la libertad condicional por una condena por DUI, el
    infractor debe completar la recolección de basura durante tres turnos de ocho
    horas mientras usa ropa que muestre el mensaje:'
  choices:
    A: '"INFRACTOR DE DUI" ("DUI OFFENDER")'
    B: '"SOY UN CONDUCTOR EBRIO" ("I AM A DRUNK DRIVER")'
    C: '"TRABAJADOR DE SERVICIO COMUNITARIO" ("COMMUNITY SERVICE WORKER")'
    D: '"NO BEBA Y CONDUZCA" ("DON''T DRINK AND DRIVE")'
  answer: B
  explanation: 'Mientras recoge basura, el infractor debe usar un chaleco u otra prenda
    que muestre el mensaje: "Soy un CONDUCTOR EBRIO" ("I am a DRUNK DRIVER").'
- id: 606
  category: alcohol_drugs_health
  question: ¿Cómo se comparan las sanciones por un arresto por DUI que involucra medicamentos
    recetados con las que involucran alcohol?
  choices:
    A: Las sanciones por medicamentos recetados son menos severas.
    B: Las sanciones por medicamentos recetados son más severas.
    C: Las sanciones son las mismas para ambos.
    D: Los medicamentos recetados no resultan en un arresto por DUI.
  answer: C
  explanation: Las sanciones por un arresto por DUI son las mismas ya sea que el conductor
    haya consumido alcohol o drogas (incluso medicamentos recetados o de venta libre).
- id: 607
  category: penalties_and_points
  question: 'Una cuarta condena por DUI o posterior se clasifica como:'
  choices:
    A: Delito menor Clase A
    B: Delito grave Clase C
    C: Delito grave Clase D
    D: Delito grave Clase E
  answer: D
  explanation: La tabla de sanciones por DUI indica que una cuarta condena o posterior
    es un delito grave Clase E.
- id: 608
  category: penalties_and_points
  question: Si una persona tiene dos condenas por DUI en un período de cinco años,
    ¿durante cuánto tiempo DEBE operar un vehículo motorizado con un dispositivo de
    bloqueo de encendido después del restablecimiento de los privilegios de conducir?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: A
  explanation: Una persona con 2 DUI en un período de cinco años DEBE operar un vehículo
    motorizado con el dispositivo de bloqueo de encendido durante seis meses después
    del restablecimiento de los privilegios de conducir.
- id: 609
  category: alcohol_drugs_health
  question: ¿Por qué la probabilidad de un choque para un conductor joven es mucho
    mayor con un BAC entre .01 y .08 por ciento en comparación con los conductores
    de más edad?
  choices:
    A: Porque los conductores jóvenes tienden a conducir más rápido.
    B: Debido a la baja tolerancia al alcohol y la limitada experiencia al conducir.
    C: Porque es más probable que los conductores jóvenes conduzcan de noche.
    D: Debido a una mayor probabilidad de usar medicamentos recetados.
  answer: B
  explanation: La probabilidad de un choque para el conductor joven es mucho mayor
    con un BAC entre .01 y .08 por ciento que para los conductores de más edad. Esto
    se debe a la baja tolerancia al alcohol y a la limitada experiencia al conducir.
- id: 610
  category: alcohol_drugs_health
  question: Según el manual, ¿a qué número gratuito puede llamar para obtener referencias
    de ayuda con el uso y abuso de drogas y alcohol?
  choices:
    A: 1-800-555-DRUG
    B: 1-800-889-9789
    C: 1-800-822-4357
    D: 1-800-DRIVING
  answer: B
  explanation: El manual indica llamar a la línea gratuita 'Redline' al 1-800-889-9789
    para obtener más información sobre el uso de drogas y alcohol o para obtener referencias
    de ayuda.
- id: 611
  category: alcohol_drugs_health
  question: ¿Qué significa la Ley de Consentimiento Implícito (Implied Consent Law)
    en Tennessee?
  choices:
    A: Usted consiente el registro de su vehículo en cualquier momento.
    B: Usted acepta portar el seguro vehicular adecuado.
    C: Si se le solicita, se someterá a una prueba para determinar el contenido de
      alcohol o drogas en la sangre.
    D: Usted acepta pagar todas las multas de tráfico en un plazo de 30 días.
  answer: C
  explanation: La Ley de Consentimiento Implícito significa que, si se le solicita,
    usted se someterá a una prueba para determinar el contenido de alcohol o drogas
    en la sangre.
- id: 612
  category: license_system
  question: ¿Cuál es el propósito del Sistema de Indicadores de Conductores con Problemas
    (PDPS)?
  choices:
    A: Rastrear multas de estacionamiento no pagadas en Tennessee.
    B: Buscar en el Registro Nacional de Conductores antes de emitir una licencia
      de conducir.
    C: Asignar puntos a los conductores por infracciones de tráfico.
    D: Monitorear la asistencia escolar de los conductores adolescentes.
  answer: B
  explanation: El Departamento de Seguridad y Seguridad Nacional de Tennessee utiliza
    el Sistema de Indicadores de Conductores con Problemas (PDPS) para buscar en el
    Registro Nacional de Conductores antes de la emisión de una licencia de conducir.
- id: 613
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón por la cual su licencia de conducir
    de Tennessee podría ser revocada o suspendida?
  choices:
    A: Recibir una multa por exceso de velocidad en un período de tres años.
    B: Retirarse de una gasolinera en un vehículo motorizado sin pagar el combustible.
    C: No lavar su vehículo con regularidad.
    D: Estacionarse en una zona de carga durante cinco minutos.
  answer: B
  explanation: Retirarse de una gasolinera en un vehículo motorizado sin pagar por
    la gasolina o el combustible diésel suministrado figura como una situación en
    la que se puede revocar o suspender la licencia de conducir.
- id: 614
  category: penalties_and_points
  question: Las personas menores de 18 años pueden perder sus privilegios de conducir
    por abandonar la escuela. ¿Cómo se define 'abandonar la escuela' en este contexto?
  choices:
    A: Tener 5 ausencias injustificadas consecutivas en un semestre.
    B: Tener 10 días consecutivos o 15 días totales de ausencias injustificadas en
      un semestre.
    C: Reprobar una materia durante un período de calificación.
    D: Faltar 20 días a la escuela por cualquier motivo en un año.
  answer: B
  explanation: El abandono escolar se define como tener 10 días consecutivos o 15
    días totales de ausencias injustificadas en un semestre.
- id: 615
  category: penalties_and_points
  question: Para mantener los privilegios de conducir, una persona menor de 18 años
    debe progresar satisfactoriamente en la escuela. ¿Qué significa esto generalmente?
  choices:
    A: Mantener un promedio de calificaciones (GPA) de 3.0.
    B: Aprobar todas las materias por período de calificación.
    C: Aprobar tres materias por período de calificación.
    D: Tener asistencia perfecta.
  answer: C
  explanation: No progresar satisfactoriamente en la escuela generalmente significa
    no aprobar tres materias por período de calificación; no hacerlo puede resultar
    en la pérdida de los privilegios de conducir.
- id: 616
  category: penalties_and_points
  question: Si su licencia de conducir es suspendida o revocada, ¿dentro de cuántos
    días debe entregarla al Departamento de Seguridad?
  choices:
    A: 10 días
    B: 15 días
    C: 20 días
    D: 30 días
  answer: C
  explanation: Siempre que una licencia de conducir sea suspendida o revocada, debe
    entregarse al Departamento de Seguridad dentro de los 20 días posteriores a la
    suspensión o revocación.
- id: 617
  category: penalties_and_points
  question: ¿Cuál es la sanción por no entregar su licencia de conducir suspendida
    o revocada dentro del plazo requerido?
  choices:
    A: Una multa de $50
    B: Una multa de $75 además de cualquier otra multa y costo
    C: 6 meses adicionales de suspensión
    D: Una comparecencia obligatoria ante el tribunal
  answer: B
  explanation: No entregar su licencia significa que se le multará con $75 además
    de cualquier otra multa y costo que pueda adeudar.
- id: 618
  category: driver_responsibility
  question: Si tiene una nueva dirección, ¿dentro de cuántos días debe informarlo
    al Departamento de Seguridad?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si tiene una nueva dirección, debe informarlo al Departamento de Seguridad
    dentro de los diez (10) días posteriores al cambio.
- id: 619
  category: penalties_and_points
  question: Bajo el Acuerdo de Infractores No Residentes (Non-Resident Violator Compact),
    ¿qué sucede si ignora una citación de tráfico emitida en otro estado miembro?
  choices:
    A: Sus privilegios de conducir en Tennessee serán suspendidos, revocados o cancelados.
    B: Será arrestado la próxima vez que conduzca en Tennessee.
    C: La citación se descarta automáticamente después de un año.
    D: Solo será multado por el estado de Tennessee.
  answer: A
  explanation: Si ignora la citación de otro estado miembro, sus privilegios de conducir
    serán suspendidos, revocados o cancelados hasta que el tribunal notifique al Departamento
    de Seguridad que la citación se ha resuelto adecuadamente.
- id: 620
  category: penalties_and_points
  question: Los conductores adultos (de 18 años de edad o más) recibirán un aviso
    de propuesta de suspensión si acumulan ¿cuántos puntos en un período de 12 meses?
  choices:
    A: 6 o más puntos
    B: 8 o más puntos
    C: 10 o más puntos
    D: 12 o más puntos
  answer: D
  explanation: Los conductores adultos (de 18 años de edad o más) que acumulen 12
    o más puntos en un período de 12 meses recibirán un aviso de propuesta de suspensión.
- id: 621
  category: penalties_and_points
  question: ¿Cuántos puntos debe acumular un conductor adulto en un período de 12
    meses para recibir una carta de advertencia que le informe sobre la posibilidad
    de perder sus privilegios de conducir?
  choices:
    A: 2 a 4 puntos
    B: 4 a 6 puntos
    C: 6 a 11 puntos
    D: 10 a 15 puntos
  answer: C
  explanation: Se envía por correo una carta de advertencia a cualquier titular de
    licencia que tenga de 6 a 11 puntos en su historial de manejo en un período de
    12 meses.
- id: 622
  category: penalties_and_points
  question: ¿Cuántas infracciones por conducción temeraria en un período de 12 meses
    resultarán en la revocación o suspensión de una licencia de conducir de Tennessee?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: En Tennessee, una licencia de conducir puede ser revocada o suspendida
    por dos infracciones de conducción temeraria en un plazo de 12 meses.
- id: 623
  category: penalties_and_points
  question: ¿La posesión de qué cantidad de metanfetamina en un vehículo por parte
    de un conductor puede dar lugar a la revocación o suspensión de la licencia?
  choices:
    A: Un gramo o más
    B: Tres gramos o más
    C: Cinco gramos o más
    D: Diez gramos o más
  answer: C
  explanation: Una licencia de conducir puede ser revocada o suspendida por la posesión
    por parte de un conductor de cinco gramos o más de metanfetamina en un vehículo.
- id: 624
  category: penalties_and_points
  question: 'Antes de que una licencia sea suspendida, revocada o cancelada, el departamento
    le dará la oportunidad de una audiencia antes de tomar medidas, EXCEPTO en casos
    de:'
  choices:
    A: Acumular 12 puntos en un período de 12 meses.
    B: Sentencias y condenas definitivas.
    C: Incumplimiento del pago de la manutención infantil.
    D: Abandonar la escuela secundaria.
  answer: B
  explanation: Si su licencia está a punto de ser suspendida, revocada o cancelada,
    el departamento le dará la oportunidad de una audiencia antes de la acción, excepto
    en casos de sentencias y condenas definitivas.
- id: 625
  category: penalties_and_points
  question: ¿Cuántos puntos debe acumular un conductor adulto en un período de 12
    meses para recibir un aviso de propuesta de suspensión?
  choices:
    A: 6 o más
    B: 8 o más
    C: 10 o más
    D: 12 o más
  answer: D
  explanation: Los conductores adultos (de 18 años o más) que acumulan 12 o más puntos
    en un período de 12 meses reciben un aviso de propuesta de suspensión.
- id: 626
  category: driver_responsibility
  question: ¿Con qué frecuencia está disponible la opción del Curso de Manejo Defensivo
    para que un conductor evite o reduzca una suspensión de licencia?
  choices:
    A: Una vez al año
    B: Una vez cada tres años
    C: Una vez en cualquier período de cinco años
    D: Una vez en la vida
  answer: C
  explanation: La opción del Curso de Manejo Defensivo solo está disponible una vez
    en cualquier período de cinco años para evitar la suspensión de la licencia o
    para reducir el período de suspensión.
- id: 627
  category: penalties_and_points
  question: ¿Cuál es una consecuencia de conducir mientras su licencia está suspendida?
  choices:
    A: Se envía por correo una carta de advertencia
    B: El período de suspensión se extiende y podría resultar en un proceso penal
    C: Debe volver a tomar el examen de conocimientos escrito
    D: Su vehículo será confiscado permanentemente
  answer: B
  explanation: Conducir mientras su licencia está suspendida resultará en la extensión
    del período de suspensión y también podría resultar en un proceso penal.
- id: 628
  category: penalties_and_points
  question: ¿Cuántos puntos se agregan a su historial de manejo por rebasar a un autobús
    escolar, de una iglesia o de jóvenes que esté detenido para subir o bajar pasajeros?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: Según la tabla de puntos, rebasar a un autobús escolar, de una iglesia
    o de jóvenes detenido para subir o bajar pasajeros resulta en 8 puntos.
- id: 629
  category: alcohol_drugs_health
  question: Los conductores que pierden el conocimiento o el control debido a afecciones
    como epilepsia o diabetes deben permanecer libres de episodios durante qué período
    mínimo antes de ser elegibles para la restitución de la licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Los conductores que pierden el conocimiento o el control debido a epilepsia,
    síncope cardíaco, diabetes u otras afecciones deben ser suspendidos y permanecer
    libres de episodios durante un mínimo de seis (6) meses antes de ser elegibles
    para la restitución de la licencia.
- id: 630
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por no ceder el paso a los vehículos de emergencia?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La tabla de puntos asigna 6 puntos por "No ceder el paso a vehículos
    de emergencia".
- id: 631
  category: license_system
  question: ¿Si una persona obtiene una licencia restringida después de no cumplir
    con una citación, a dónde se le permite conducir?
  choices:
    A: Solo hacia y desde el trabajo
    B: Al trabajo y a la universidad a tiempo completo
    C: A cualquier lugar entre las 6 AM y las 6 PM
    D: Al trabajo y a servicios religiosos
  answer: A
  explanation: Para una licencia restringida debido al incumplimiento de una citación
    (Failure to Satisfy a Citation), la orden certificada permite a la persona conducir
    únicamente hacia y desde el trabajo.
- id: 632
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceder el límite de velocidad entre 16
    y 25 m.p.h. dentro de una zona de construcción?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: Exceder el límite de velocidad entre 16 y 25 m.p.h. normalmente conlleva
    4 puntos, pero en una zona de construcción conlleva 5 puntos.
- id: 633
  category: license_system
  question: Una licencia de conducir restringida después de una condena por DUI NO
    es una opción para los conductores que tienen una condena previa por ¿cuál de
    los siguientes casos dentro de los últimos 10 años?
  choices:
    A: Conducción temeraria
    B: Exceso de velocidad de más de 25 mph
    C: Conducción de adultos bajo los efectos de sustancias (impaired)
    D: Carreras de autos (piques)
  answer: C
  explanation: Una licencia restringida no es una opción para los conductores que
    tienen una condena previa por DUI o conducción de adultos bajo los efectos de
    sustancias dentro de los últimos 10 años.
- id: 634
  category: alcohol_drugs_health
  question: Si el Departamento recibe información de que su capacidad para conducir
    se ve afectada por un trastorno físico o mental, ¿dentro de cuántos días debe
    presentar un informe médico?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Se requerirá que el conductor presente (dentro de los treinta (30)
    días posteriores a la notificación) un informe médico de un doctor en medicina.
- id: 635
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a un conductor menor de 18 años por operar
    un vehículo mientras usa un teléfono celular?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La tabla de puntos especifica 6 puntos por "Operar un vehículo mientras
    se usa un teléfono celular (menor de 18 años)".
- id: 636
  category: license_system
  question: 'Un menor que pierde su licencia debido a cargos relacionados con drogas
    o alcohol puede solicitar una licencia restringida para conducir hacia y desde:'
  choices:
    A: Servicios religiosos y el trabajo
    B: La institución educativa o el trabajo
    C: Solo programas de tratamiento ambulatorio
    D: Cualquier lugar durante las horas del día
  answer: B
  explanation: Un menor que pierde su licencia debido a cargos relacionados con drogas
    o alcohol puede solicitar al juez de primera instancia una licencia restringida
    para operar un vehículo motorizado hacia y desde la institución educativa o hacia
    y desde el trabajo.
- id: 637
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a un conductor por contribuir a la ocurrencia
    de un choque que resulte en la muerte de otra persona?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: La tabla de puntos asigna 8 puntos por "Contribuir a la ocurrencia
    de un choque que resulte en la muerte de otra persona".
- id: 638
  category: driver_responsibility
  question: Al finalizar el tiempo de suspensión, ¿qué tipo de comprobante de seguro
    se requiere específicamente para los conductores adultos antes de obtener su licencia
    regular?
  choices:
    A: Seguro a todo riesgo (comprehensive)
    B: Seguro SR-22
    C: Seguro de colisión
    D: Cobertura de conductor sin seguro
  answer: B
  explanation: Al finalizar el tiempo de suspensión, debe pagar las tarifas de reinstalación
    correspondientes y presentar un comprobante de seguro de responsabilidad civil/responsabilidad
    financiera (se requiere el seguro SR-22 para conductores adultos).
- id: 639
  category: license_system
  question: ¿Qué sucederá si un conductor no responde a una solicitud departamental
    de un informe médico dentro del tiempo prescrito?
  choices:
    A: Se les multará con $50.
    B: Se suspenderá su privilegio de conducir.
    C: Se revocará el registro de su vehículo.
    D: Se les requerirá volver a tomar solo el examen escrito.
  answer: B
  explanation: Según el manual, el no responder a las solicitudes departamentales
    de un informe médico o la falta de presentación a un examen de licencia de conducir
    dentro del tiempo prescrito resultará en la suspensión del privilegio de conducir.
- id: 640
  category: driver_responsibility
  question: ¿Qué tipo de seguro brinda cobertura por los daños que usted cause a otras
    personas?
  choices:
    A: Seguro de colisión
    B: Seguro de conductor sin seguro
    C: Seguro de responsabilidad civil (liability)
    D: Seguro a todo riesgo (comprehensive)
  answer: C
  explanation: El manual define el seguro de responsabilidad civil (liability) como
    aquel que brinda cobertura por los daños que usted cause a otras personas.
- id: 641
  category: driver_responsibility
  question: ¿Exige la ley de Tennessee un seguro contra choques (collision insurance)?
  choices:
    A: Sí, para todos los conductores.
    B: Sí, pero solo para vehículos comerciales.
    C: No, no es obligatorio.
    D: No, a menos que tenga un choque previo en su historial.
  answer: C
  explanation: 'El manual establece explícitamente: "Aunque la ley de Tennessee no
    exige el seguro contra choques, la Ley de Responsabilidad Financiera exige que
    los conductores presenten pruebas de responsabilidad financiera".'
- id: 642
  category: driver_responsibility
  question: ¿Cuál de las siguientes NO figura como una forma aceptable de prueba de
    responsabilidad financiera?
  choices:
    A: Una póliza provisional de seguro (insurance binder)
    B: Una página de declaraciones de su póliza de seguro
    C: Una promesa verbal de su agente de seguros
    D: Una tarjeta de seguro de una compañía autorizada
  answer: C
  explanation: Las formas aceptables de prueba incluyen una página de declaraciones,
    una póliza provisional de seguro, una tarjeta de seguro, un certificado de depósito
    en efectivo/fianza o prueba de calificación como autoasegurador. Una promesa verbal
    no figura en la lista.
- id: 643
  category: safe_driving_rules
  question: ¿Debe notificar inmediatamente a la policía sobre cualquier choque que
    involucre muerte, lesiones o daños a la propiedad que superen qué cantidad?
  choices:
    A: $50
    B: $100
    C: $400
    D: $500
  answer: A
  explanation: Los conductores deben notificar inmediatamente a la policía local,
    a la oficina del Sheriff del condado o a la Patrulla de Caminos sobre cualquier
    choque que involucre muerte, lesiones o daños a la propiedad que superen los cincuenta
    dólares ($50).
- id: 644
  category: driver_responsibility
  question: Si un conductor no puede físicamente dar aviso inmediato de un choque
    a la policía, ¿quién está obligado a hacerlo?
  choices:
    A: El otro conductor involucrado
    B: Un pasajero que sea capaz de hacerlo
    C: El primer testigo en la escena
    D: La compañía de seguros del conductor
  answer: B
  explanation: El manual establece que si el conductor no puede físicamente dar aviso
    inmediato y hay un pasajero capaz de hacerlo, el pasajero deberá dar el aviso
    o hacer que se dé.
- id: 645
  category: driver_responsibility
  question: 'Un choque debe reportarse al Departamento de Seguridad y Seguridad Nacional
    de Tennessee como un "choque reportable" si los daños a la propiedad de cualquier
    persona superan los:'
  choices:
    A: $50
    B: $200
    C: $400
    D: $1,000
  answer: C
  explanation: Los choques reportables incluyen cualquier choque en el que una persona
    muera o resulte herida, o en el que los daños a la propiedad de cualquier persona
    superen los cuatrocientos dólares ($400).
- id: 646
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un Informe del Propietario/Conductor
    de un choque reportable ante el Departamento de Seguridad y Seguridad Nacional
    de Tennessee?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 20 días
  answer: D
  explanation: El operador y/o propietario de un vehículo involucrado en un choque
    reportable debe presentar un Informe del Propietario/Conductor del choque en un
    plazo de 20 días.
- id: 647
  category: safe_driving_rules
  question: ¿Qué debe hacer si se ve involucrado en un choque con un vehículo desatendido
    y no puede localizar al propietario?
  choices:
    A: Dejar una nota en el parabrisas e irse.
    B: Reportar el choque a la policía.
    C: Esperar en la escena hasta que el propietario regrese.
    D: Presentar un informe del Propietario/Conductor en un plazo de 30 días.
  answer: B
  explanation: Si el choque involucró un vehículo desatendido o un animal doméstico
    y no puede localizar al propietario, debe reportar el choque a la policía.
- id: 648
  category: penalties_and_points
  question: Si se le revocan sus privilegios de conducir por no establecer la responsabilidad
    financiera tras un choque, ¿qué formulario debe presentar su compañía de seguros
    de responsabilidad civil antes de la restitución?
  choices:
    A: Formulario SR-22
    B: Formulario FR-44
    C: Formulario TN-10
    D: Formulario DL-12
  answer: A
  explanation: Antes de que se puedan restituir los privilegios de conducir después
    de dicha revocación, se requiere que pague una tarifa de restitución y que una
    compañía de seguros de responsabilidad civil presente un formulario SR-22 ante
    el Departamento de Seguridad.
- id: 649
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacer en un vehículo dañado en la escena de
    un choque para evitar un incendio?
  choices:
    A: Desconectar la batería.
    B: Apagar el encendido.
    C: Echar agua al motor.
    D: Quitar el tapón de la gasolina.
  answer: B
  explanation: El manual instruye a los conductores a "Apagar el encendido en el vehículo
    dañado para evitar un incendio".
- id: 650
  category: safe_driving_rules
  question: Según la ley de Tennessee, ¿cuándo se le permite mover su vehículo fuera
    del flujo de tráfico después de un choque en la interestatal?
  choices:
    A: Solo después de que la policía haya llegado y tomado fotos.
    B: Si el vehículo se puede conducir y no hay lesiones personales graves ni muertes.
    C: Nunca se le permite mover un vehículo hasta que llegue una grúa.
    D: Solo si el daño a la propiedad es inferior a $50.
  answer: B
  explanation: Si se ve involucrado en un choque de tráfico en la interestatal, la
    ley de Tennessee le permite mover el vehículo para evitar bloquear el tráfico
    si el vehículo aún se puede conducir y NO HAY LESIONES PERSONALES GRAVES ni muertes.
- id: 651
  category: safe_driving_rules
  question: ¿Cuándo es aceptable mover a una persona lesionada de un vehículo accidentado
    si no se tiene formación médica o de rescate?
  choices:
    A: Cuando la persona le pida que la mueva.
    B: Cuando esté bloqueando el tráfico.
    C: Cuando exista un peligro inmediato, como un incendio.
    D: Cuando la ambulancia esté a más de 10 minutos de distancia.
  answer: C
  explanation: No intente mover a una persona lesionada de un vehículo accidentado
    a menos que tenga la formación médica o de rescate necesaria o que exista un peligro
    inmediato, como un incendio.
- id: 652
  category: defensive_driving
  question: Si llega primero a la escena de un accidente y no tiene formación profesional
    para prestar ayuda, ¿qué debe hacer después de llamar al 911?
  choices:
    A: Detenerse y dirigir el tráfico alrededor del accidente.
    B: Continuar lentamente en su vehículo para no interferir.
    C: Detenerse a un lado y esperar a que la policía tome su declaración.
    D: Intentar sacar a los pasajeros de los vehículos.
  answer: B
  explanation: Si no tiene formación profesional para prestar ayuda, continúe lentamente
    en su vehículo para no interferir con la llegada de la policía y los servicios
    de emergencia, evitando así una colisión secundaria.
- id: 653
  category: safe_driving_rules
  question: Si presencia un accidente, ¿cuál es el procedimiento adecuado según el
    manual?
  choices:
    A: Detenerse de forma segura a un lado de la carretera, encender las luces de
      emergencia y notificar a la policía.
    B: Perseguir a los vehículos si se trató de un choque con fuga.
    C: Continuar conduciendo y llamar a la policía cuando llegue a casa.
    D: Detenerse en medio de la carretera para bloquear el tráfico y proteger la escena.
  answer: A
  explanation: Si presenció el accidente, deténgase de forma segura a un lado de la
    carretera y encienda las luces de emergencia de su vehículo. Notifique al oficial
    de policía o al patrullero estatal de Tennessee que usted fue testigo del accidente.
- id: 654
  category: penalties_and_points
  question: Según el manual, ¿por cuál de las siguientes razones se puede revocar
    o suspender una licencia de conducir?
  choices:
    A: Acumular 8 puntos en un período de 12 meses.
    B: Alterar fraudulentamente una licencia de conducir.
    C: Recibir una sola multa de estacionamiento.
    D: Conducir a 5 mph por encima del límite de velocidad una sola vez.
  answer: B
  explanation: El manual establece que una licencia de conducir puede ser revocada
    o suspendida por alterar fraudulentamente una licencia de conducir, o por condenas
    frecuentes que resulten en 12 o más puntos en un período de 12 meses.
- id: 655
  category: defensive_driving
  question: ¿Qué significa la práctica de conducción segura "Mirar a lo lejos al conducir"
    (Aim High In Steering)?
  choices:
    A: Ajustar el volante a la posición más alta.
    B: Mirar lo más lejos posible en la carretera para detectar información importante
      sobre el tráfico.
    C: Mantener los ojos enfocados directamente en el capó de su automóvil.
    D: Conducir con ambas manos en la parte superior del volante.
  answer: B
  explanation: '"Mirar a lo lejos al conducir" significa observar la carretera a la
    mayor distancia posible para detectar información importante sobre el tráfico
    y tomar las decisiones adecuadas.'
- id: 656
  category: defensive_driving
  question: 'Para "Dejarse una salida" (Leave Yourself an Out) mientras conduce, debe
    rodear su vehículo con espacio por delante y al menos en:'
  choices:
    A: Ambos lados
    B: La parte trasera
    C: Un lado
    D: El lado del pasajero solamente
  answer: C
  explanation: El manual aconseja "Dejarse una salida" estando preparado y rodeando
    su vehículo con espacio por delante y al menos en un lado para poder escapar de
    un conflicto.
- id: 657
  category: driver_responsibility
  question: ¿Cuáles son las actitudes de conducción más importantes que puede desarrollar
    para garantizar una conducción segura?
  choices:
    A: Agresividad y velocidad
    B: Cortesía y consideración hacia los demás
    C: Confianza y asertividad
    D: Competitividad y estado de alerta
  answer: B
  explanation: Según el manual, la cortesía y la consideración hacia los demás son
    las actitudes de conducción más importantes que se pueden desarrollar y son la
    clave para una conducción segura.
- id: 658
  category: defensive_driving
  question: 'Al conducir a la defensiva, debe esperar que el otro conductor:'
  choices:
    A: Siempre obedezca las reglas de la carretera
    B: Le ceda el derecho de paso
    C: Haga lo INCORRECTO
    D: Use sus señales de giro correctamente
  answer: C
  explanation: Una regla clave para conducir alerta es esperar que el otro conductor
    haga lo INCORRECTO y tener preparado un plan de acción para contrarrestar su error.
- id: 659
  category: safe_driving_rules
  question: ¿Bajo qué condiciones debe aumentar su distancia de seguimiento a por
    lo menos 3 o 4 segundos?
  choices:
    A: Al conducir en vecindarios residenciales.
    B: Al seguir a camiones comerciales grandes o autobuses en autopistas interestatales
      de alta velocidad.
    C: Al conducir en tráfico pesado de paradas y arranques.
    D: Al acercarse a una parada de cuatro vías.
  answer: B
  explanation: El manual establece que en autopistas interestatales de alta velocidad,
    al seguir a camiones comerciales grandes o autobuses, y en condiciones de clima
    inclemente o visibilidad limitada, lo más seguro es aumentar la distancia de seguimiento
    a por lo menos 3 o 4 segundos.
- id: 660
  category: defensive_driving
  question: ¿Qué porcentaje de la información sobre la carretera y nuestro entorno
    recopilamos a través de los ojos mientras conducimos?
  choices:
    A: 50%
    B: 75%
    C: 90%
    D: 99%
  answer: C
  explanation: Al conducir, recopilamos el 90% de la información sobre la carretera
    y nuestro entorno a través de los ojos.
- id: 661
  category: defensive_driving
  question: ¿A qué distancia hacia adelante deben intentar enfocar la vista los conductores
    defensivos mientras escanean la carretera?
  choices:
    A: 2 a 3 segundos hacia adelante
    B: 5 a 8 segundos hacia adelante
    C: 10 a 15 segundos hacia adelante
    D: 20 a 30 segundos hacia adelante
  answer: C
  explanation: Los conductores defensivos intentan enfocar la vista de 10 a 15 segundos
    hacia adelante (aproximadamente la distancia de una cuadra o manzana) para ver
    las cosas con anticipación y permitir más tiempo para reaccionar.
- id: 662
  category: safe_driving_rules
  question: Al entrar en una intersección, ¿por qué debe mirar primero a la izquierda?
  choices:
    A: Porque los autos que vienen por la izquierda estarán más cerca de usted
    B: Porque los autos que vienen por la izquierda siempre tienen el derecho de paso
    C: Porque los giros a la izquierda son ilegales en la mayoría de las intersecciones
    D: Porque las señales de tráfico suelen estar colocadas a la izquierda
  answer: A
  explanation: En cualquier intersección, mire primero a la izquierda, ya que los
    autos que vienen por la izquierda estarán más cerca de usted.
- id: 663
  category: defensive_driving
  question: ¿Con qué frecuencia debe usar el espejo retrovisor para revisar el tráfico
    detrás de usted?
  choices:
    A: Aproximadamente cada 5 segundos
    B: Aproximadamente cada 10 segundos
    C: Aproximadamente cada 30 segundos
    D: Solo cuando se esté preparando para detenerse
  answer: B
  explanation: Debe usar el espejo retrovisor para revisar el tráfico detrás de usted
    con frecuencia, aproximadamente cada 10 segundos.
- id: 664
  category: safe_driving_rules
  question: ¿Cuándo debe desarrollar el hábito de usar sus luces direccionales?
  choices:
    A: Solo cuando vea otros vehículos en la carretera
    B: Solo al cambiar de carril en una carretera interestatal
    C: Incluso cuando no vea otros vehículos en la carretera
    D: Solo durante las horas del día
  answer: C
  explanation: Debe desarrollar el hábito de usar sus luces direccionales incluso
    cuando no vea otros vehículos en la carretera.
- id: 665
  category: defensive_driving
  question: Si alguien lo sigue muy de cerca (tailgating) y no hay un carril derecho
    al cual moverse, ¿cuál es la forma más segura de manejar la situación?
  choices:
    A: Reducir la velocidad rápidamente para desanimar al conductor que lo sigue de
      cerca
    B: Esperar hasta que el camino por delante esté despejado y rebasar sea legal,
      luego reducir lentamente su velocidad
    C: Aumentar la velocidad para incrementar la distancia entre usted y el conductor
      que lo sigue de cerca
    D: Tocar los frenos repetidamente para que parpadeen las luces de freno
  answer: B
  explanation: Si no hay un carril derecho, espere hasta que el camino por delante
    esté despejado y rebasar sea legal, luego reduzca lentamente su velocidad. Esto
    animará al conductor que lo sigue de cerca a rodearlo. Nunca reduzca la velocidad
    rápidamente.
- id: 666
  category: defensive_driving
  question: Mientras escanea la carretera, ¿cuál de las siguientes es una pista de
    que un vehículo podría interponerse en su camino?
  choices:
    A: Las ventanas del vehículo están bajadas
    B: El vehículo tiene el parabrisas sucio
    C: El vehículo tiene las ruedas giradas o humo en el escape
    D: El vehículo está estacionado cerca de un hidrante de incendios
  answer: C
  explanation: Debe buscar pistas como humo en el escape, luces de freno o de reversa,
    y ruedas giradas en los vehículos, ya que esto indica que los vehículos pueden
    interponerse en su camino.
- id: 667
  category: safe_driving_rules
  question: Al encontrarse con vehículos que vienen en sentido contrario en una carretera
    de dos carriles, ¿dónde debe posicionar su vehículo?
  choices:
    A: Directamente sobre la línea central
    B: Ligeramente a la derecha de su carril para no invadir la línea central
    C: Ligeramente a la izquierda de su carril para ver mejor
    D: En el arcén (hombro) derecho de la carretera
  answer: B
  explanation: Al encontrarse con vehículos que vienen en sentido contrario en una
    carretera de dos carriles, manténgase ligeramente a la derecha de su carril para
    no "invadir" la línea central.
- id: 668
  category: penalties_and_points
  question: Una licencia de conducir puede ser revocada o suspendida por condenas
    frecuentes de violaciones a las leyes de tránsito que resulten en ¿cuántos puntos
    dentro de un período de 12 meses?
  choices:
    A: 6 o más puntos
    B: 8 o más puntos
    C: 10 o más puntos
    D: 12 o más puntos
  answer: D
  explanation: Una licencia de conducir puede ser revocada o suspendida por condenas
    frecuentes de violaciones a las leyes de tránsito que resulten en 12 o más "puntos"
    dentro de un período de 12 meses.
- id: 669
  category: defensive_driving
  question: ¿Cuál es el espacio mínimo necesario cada vez que cambia de carril, entra
    en una calzada o se incorpora a otro carril de tráfico?
  choices:
    A: Espacio de dos segundos
    B: Espacio de tres segundos
    C: Espacio de cuatro segundos
    D: Espacio de cinco segundos
  answer: C
  explanation: Según el manual, se necesita un espacio mínimo de cuatro segundos cada
    vez que cambie de carril, entre en una calzada o cuando su carril se incorpore
    a otro carril de tráfico.
- id: 670
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es más seguro regresar al carril de
    conducción?
  choices:
    A: Tan pronto como su vehículo esté por delante del parachoques delantero del
      otro vehículo.
    B: Cuando pueda ver ambos faros delanteros del vehículo rebasado en su espejo
      retrovisor.
    C: Cuando el conductor al que rebasó le haga señales con sus faros delanteros.
    D: Después de que hayan pasado exactamente tres segundos desde que cambió de carril.
  answer: B
  explanation: Para finalizar un rebase de manera defensiva, lo más seguro es no regresar
    al carril de conducción hasta que pueda ver ambos faros delanteros del vehículo
    que acaba de rebasar en el espejo retrovisor.
- id: 671
  category: safe_driving_rules
  question: ¿Aproximadamente cuánto tiempo necesita para completar el rebase de un
    solo vehículo a 55 M.P.H.?
  choices:
    A: Unos 5 segundos
    B: Unos 10 segundos
    C: Unos 15 segundos
    D: Unos 20 segundos
  answer: B
  explanation: A 55 M.P.H., necesitará unos diez (10) segundos para completar el rebase
    de un solo vehículo, lo que significa que necesita un intervalo de diez segundos
    en el tráfico que viene en sentido contrario.
- id: 672
  category: defensive_driving
  question: Según la NHTSA, ¿aproximadamente qué porcentaje de todas las muertes por
    accidentes de tráfico anuales son causadas por comportamientos de conducción agresiva?
  choices:
    A: 33%
    B: 50%
    C: 66%
    D: 80%
  answer: C
  explanation: La Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA) afirma que aproximadamente el 66% de todas las muertes por accidentes
    de tráfico anuales son causadas por comportamientos de conducción agresiva.
- id: 673
  category: defensive_driving
  question: Si un conductor agresivo lo sigue, ¿cuál es la acción recomendada?
  choices:
    A: Conducir a casa inmediatamente y cerrar sus puertas con llave.
    B: Detener su vehículo y confrontar al conductor.
    C: Ir a una estación de policía o a un lugar público donde pueda obtener ayuda.
    D: Aumentar la velocidad para perder al conductor en el tráfico.
  answer: C
  explanation: Los consejos para evitar la furia al volante (road rage) indican que
    si un conductor lo sigue, debe dirigirse a una estación de policía o a un lugar
    público donde pueda obtener ayuda.
- id: 674
  category: safe_driving_rules
  question: ¿Bajo qué condiciones climáticas ocurren la mayoría de los accidentes?
  choices:
    A: En clima despejado
    B: En la nieve
    C: En la lluvia
    D: En la niebla
  answer: A
  explanation: Según la prueba corta del manual sobre condiciones especiales de conducción,
    la mayoría de los accidentes ocurren en clima despejado, señalando que "¡los días
    bonitos también pueden ser mortales!".
- id: 675
  category: defensive_driving
  question: ¿Cuáles son las tres opciones que tiene un conductor para evitar una colisión?
  choices:
    A: Detenerse, Girar, Aumentar la velocidad
    B: Frenar, Tocar la bocina, Virar bruscamente
    C: Detenerse, Retroceder, Girar
    D: Acelerar, Tocar la bocina, Frenar
  answer: A
  explanation: 'Para evitar una colisión, los conductores tienen tres opciones: 1.
    Detenerse, 2. Girar, 3. Aumentar la velocidad.'
- id: 676
  category: vehicle_information
  question: 'Si necesita detenerse rápidamente y su vehículo está equipado con un
    Sistema de Frenos Antibloqueo (ABS), usted debe:'
  choices:
    A: Bombear los frenos rápidamente para evitar derrapar.
    B: Presionar el pedal del freno tan fuerte como pueda y seguir presionándolo firmemente.
    C: Aplicar los frenos suavemente y aumentar la presión gradualmente.
    D: Presionar el pedal del freno con fuerza y soltarlo inmediatamente si siente
      que lo empuja hacia atrás.
  answer: B
  explanation: Con el ABS, debe presionar el pedal del freno tan fuerte como pueda
    y seguir presionándolo con firmeza. NO debe soltar el pedal del freno incluso
    si siente que este lo empuja hacia atrás.
- id: 677
  category: vehicle_information
  question: ¿Qué debe hacer si debe detenerse rápidamente, NO tiene ABS y sus frenos
    se bloquean provocando un derrape?
  choices:
    A: Seguir presionando el pedal del freno con la mayor fuerza posible.
    B: Soltar rápidamente el pedal del freno y luego volver a presionarlo una vez
      que el derrape se detenga.
    C: Girar el volante bruscamente en la dirección opuesta.
    D: Aplicar el freno de estacionamiento inmediatamente.
  answer: B
  explanation: Sin ABS, si los frenos se bloquean y comienza a derrapar, debe soltar
    rápidamente el pedal del freno. Tan pronto como el vehículo deje de derrapar,
    presione el pedal del freno nuevamente.
- id: 678
  category: safe_driving_rules
  question: Para realizar giros evasivos rápidos, ¿cuál es la posición recomendada
    de las manos en el volante?
  choices:
    A: A las 10 y a las 2
    B: A las 8 y a las 4
    C: A las 3 y a las 9
    D: A las 12 y a las 6
  answer: C
  explanation: Para la mayoría de los giros, especialmente los giros rápidos, lo mejor
    es tener las manos aproximadamente en las posiciones de las 3 y las 9 en punto.
- id: 679
  category: vehicle_information
  question: ¿Por qué se recomienda la posición de las manos a las 3 y a las 9 en el
    volante?
  choices:
    A: Le permite alcanzar la señal de giro más fácilmente.
    B: Mantiene sus muñecas y antebrazos fuera del área de impacto principal de la
      bolsa de aire (air bag).
    C: Evita que el volante se bloquee durante un giro brusco.
    D: Proporciona la mayor palanca para girar el volante con una sola mano.
  answer: B
  explanation: Tener las manos a las 3 y a las 9 mantiene las muñecas y los antebrazos
    fuera del área de impacto principal de la bolsa de aire (air bag) ubicada en el
    volante en caso de verse involucrado en una colisión.
- id: 680
  category: defensive_driving
  question: ¿Qué significa la regla de conducción "Dividir la diferencia" (Split the
    difference)?
  choices:
    A: Ocupar parte del carril contrario al rebasar una bicicleta.
    B: Dirigirse por un curso intermedio entre dos peligros, dejando más espacio en
      el lado más peligroso.
    C: Cruzar varios carriles de tráfico de uno en uno.
    D: Mantener una distancia de seguimiento de dos segundos en tráfico normal.
  answer: B
  explanation: '"Dividir la diferencia" significa dirigir un curso intermedio entre
    dos peligros. Si uno es más peligroso que el otro, se deja un poco más de espacio
    en el lado más peligroso.'
- id: 681
  category: safe_driving_rules
  question: Al cruzar el tráfico en una intersección, ¿qué debe asegurar antes de
    entrar?
  choices:
    A: Que puede llegar a la mitad del camino y esperar en la mediana.
    B: Que tiene un espacio lo suficientemente grande para cruzar por completo sin
      bloquear la intersección.
    C: Que el vehículo detrás de usted también esté listo para cruzar.
    D: Que acelera para ganarle al tráfico que se aproxima.
  answer: B
  explanation: Cuando cruza el tráfico, necesita un espacio lo suficientemente grande
    para atravesar toda la carretera. NO debe bloquear las intersecciones ni quedarse
    atrapado con una parte de su vehículo en un carril de circulación.
- id: 682
  category: defensive_driving
  question: Si otro conductor comete un error, como rebasarlo sin suficiente espacio,
    ¿qué debe hacer?
  choices:
    A: Acelerar para evitar que entre en su carril.
    B: Tocar la bocina y parpadear las luces para advertirle.
    C: Reducir la velocidad y dejar espacio para que regrese de manera segura al carril
      de circulación.
    D: Moverse al arcén y detenerse por completo.
  answer: C
  explanation: Si otro conductor comete un error, como rebasar sin suficiente espacio,
    debe manejar el error de manera defensiva reduciendo la velocidad y permitiendo
    espacio para que los conductores que rebasan regresen de manera segura al carril
    de circulación.
- id: 683
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos para la conducción básica?
  choices:
    A: A las 10 y a las 2
    B: A las 9 y a las 3
    C: A las 8 y a las 4
    D: A las 11 y a la 1
  answer: B
  explanation: El manual establece que la posición básica de conducción consiste en
    colocar las manos a las 9 (izquierda) y a las 3 (derecha) según las agujas del
    reloj.
- id: 684
  category: vehicle_information
  question: ¿Qué sucede en una emergencia o en condiciones resbaladizas si su vehículo
    NO tiene frenos antibloqueo (ABS) y usted frena bruscamente?
  choices:
    A: Las ruedas no se bloquearán y el automóvil permanecerá estable.
    B: El automóvil acelerará automáticamente para evitar una colisión.
    C: Todas las ruedas se bloquearán, el automóvil comenzará a derrapar y no se podrá
      dirigir.
    D: Los frenos bombearán electrónicamente mucho más rápido de lo que usted podría
      hacerlo manualmente.
  answer: C
  explanation: En condiciones de emergencia o resbaladizas sin ABS, todas las ruedas
    se bloquean; el automóvil comienza a derrapar y no se puede dirigir.
- id: 685
  category: defensive_driving
  question: Si su vehículo no tiene ABS, ¿qué debe hacer para girar rápidamente mientras
    frena?
  choices:
    A: Pisar a fondo y mantener el pedal del freno firme mientras gira.
    B: Soltar el pedal del freno y luego girar el volante.
    C: Bombear los frenos rápidamente mientras mueve el volante bruscamente.
    D: Acelerar mientras gira el volante bruscamente.
  answer: B
  explanation: Sin ABS, mientras frena, deberá soltar el pedal del freno y luego girar
    el volante para poder dar la vuelta rápidamente.
- id: 686
  category: defensive_driving
  question: ¿Cuándo podría ser mejor o necesario acelerar para evitar una colisión?
  choices:
    A: Cuando se aproxima a una señal de cruce de ciervos.
    B: Cuando otro vehículo está a punto de golpearlo por el costado o por detrás
      y hay espacio hacia adelante.
    C: Cuando conduce en una zona escolar y un automóvil lo sigue muy de cerca.
    D: Cuando se aproxima a una curva cerrada sin ABS.
  answer: B
  explanation: A veces es mejor acelerar para evitar una colisión cuando otro vehículo
    está a punto de golpearlo por el costado o por detrás y hay espacio frente a su
    vehículo para salir del peligro.
- id: 687
  category: safe_driving_rules
  question: ¿En qué estación del año se produce el mayor número de choques entre ciervos
    y automóviles?
  choices:
    A: Primavera
    B: Verano
    C: Otoño
    D: Invierno
  answer: C
  explanation: El otoño es la temporada alta de choques entre ciervos y automóviles
    porque es tanto la temporada de apareamiento como la de caza, lo que hace que
    los ciervos estén más activos.
- id: 688
  category: defensive_driving
  question: ¿Por qué debe evitar parpadear sus faros delanteros a un ciervo en la
    carretera?
  choices:
    A: Hará que el ciervo embista su vehículo.
    B: Los ciervos tienden a fijarse en los faros, por lo que parpadearlos puede hacer
      que el animal se quede paralizado en la carretera.
    C: Cegará temporalmente a los conductores que vienen en sentido contrario.
    D: Hará que el ciervo corra de forma impredecible hacia el tráfico que viene en
      sentido contrario.
  answer: B
  explanation: Los ciervos tienden a fijarse en los faros, por lo que parpadearlos
    puede hacer que el animal se quede paralizado en la carretera.
- id: 689
  category: defensive_driving
  question: ¿Qué debe hacer si una colisión con un animal parece inevitable?
  choices:
    A: Virar bruscamente a la izquierda o a la derecha para evitar al animal.
    B: Acelerar para minimizar el tiempo de impacto.
    C: Mantener su vehículo bajo control y en la calzada sin dar un volantazo.
    D: Bombear los frenos rápidamente y mover el volante bruscamente.
  answer: C
  explanation: Si una colisión parece inevitable, no dé un volantazo para evitar al
    animal; el riesgo de lesiones personales puede ser mayor si lo hace. Mantenga
    su vehículo bajo control y en la calzada.
- id: 690
  category: vehicle_information
  question: ¿Cuál es la técnica de frenado correcta al usar frenos antibloqueo (ABS)
    en una situación de emergencia real?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Tocar ligeramente los frenos para advertir a otros conductores.
    C: Presionar con fuerza y mantener el pedal presionado, incluso si vibra.
    D: Soltar un poco los frenos cuando sienta que el pedal vibra.
  answer: C
  explanation: El manual instruye a los conductores con ABS a pisar con fuerza el
    pedal del freno, mantenerlo presionado y no soltarlo incluso si el pedal vibra
    o pulsa.
- id: 691
  category: vehicle_information
  question: ¿Por qué NUNCA debe bombear el pedal del freno en un vehículo equipado
    con ABS?
  choices:
    A: Bombear los frenos hará que el motor se apague.
    B: El sistema ABS ya está bombeando electrónicamente los frenos mucho más rápido
      de lo que usted podría hacerlo manualmente.
    C: Hará que el volante se bloquee.
    D: Desactivará las bolsas de aire del vehículo.
  answer: B
  explanation: Nunca debe bombear el pedal del freno en un vehículo equipado con ABS
    porque la sensación de pulsación es simplemente el sistema ABS "bombeando" electrónicamente
    los frenos mucho más rápido de lo que usted podría hacerlo manualmente.
- id: 692
  category: safe_driving_rules
  question: ¿Cuáles son los tres componentes principales del sistema de transporte
    por carretera que deben tenerse en cuenta al conducir?
  choices:
    A: Conductor, Vehículo y Carretera
    B: Clima, Tráfico y Velocidad
    C: Visión, Audición y Reflejos
    D: Señales, Semáforos y Marcas viales
  answer: A
  explanation: 'Existen tres componentes principales en nuestro sistema de transporte
    por carretera que deben tenerse en cuenta al conducir: 1. Conductor, 2. Vehículo,
    3. Carretera.'
- id: 693
  category: driver_responsibility
  question: ¿Cuál es la causa más común de los accidentes de tráfico?
  choices:
    A: Malas condiciones climáticas
    B: Falla mecánica
    C: Error humano
    D: Carreteras en mal estado
  answer: C
  explanation: El manual establece que el error humano es la causa más común de los
    accidentes de tráfico.
- id: 694
  category: driver_responsibility
  question: Según el manual, ¿cuál de los siguientes es uno de los factores principales
    en los accidentes de tráfico?
  choices:
    A: Conducir con la radio encendida
    B: Velocidad excesiva
    C: Usar luces altas por la noche
    D: Conducir un vehículo antiguo
  answer: B
  explanation: Los factores principales en los accidentes son la velocidad excesiva,
    la falta de concentración y las maniobras evasivas inadecuadas.
- id: 695
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes condiciones temporales puede convertirlo en un
    conductor inseguro?
  choices:
    A: Ira, preocupación y fatiga
    B: Usar gafas de sol durante el día
    C: Llevar un pasajero en el asiento trasero
    D: Conducir un vehículo equipado con ABS
  answer: A
  explanation: La ira, la preocupación, la frustración, la fatiga y las enfermedades
    menores como un resfriado son algunas de las condiciones temporales que pueden
    convertirlo en un conductor inseguro.
- id: 696
  category: safe_driving_rules
  question: ¿Por qué un conductor debe usar sus espejos laterales y mirar hacia los
    lados ocasionalmente?
  choices:
    A: Porque no se puede enfocar en objetos laterales usando solo la visión periférica.
    B: Para asegurar que las puertas traseras estén bien cerradas.
    C: Para monitorear la velocidad de los vehículos en el carril opuesto.
    D: Para evitar mirar directamente a los faros de los vehículos que vienen en sentido
      contrario.
  answer: A
  explanation: Debido a que no se puede enfocar en objetos laterales, también debe
    usar sus espejos laterales y mirar hacia los lados ocasionalmente si es necesario.
- id: 697
  category: driver_responsibility
  question: ¿Qué debe hacer si choca con un animal grande, como un ciervo o un animal
    de granja?
  choices:
    A: Mover al animal fuera de la calzada usted mismo.
    B: Reportar el accidente a la policía.
    C: Abandonar la escena inmediatamente si su auto se puede conducir.
    D: Esperar junto al animal hasta que llegue su dueño.
  answer: B
  explanation: Debe reportar el accidente a la policía si involucra a un animal grande
    como un ciervo o un animal de granja.
- id: 698
  category: license_system
  question: ¿Qué indica el Código de Restricción 01 en su licencia de conducir?
  choices:
    A: Está restringido a conducir solo durante las horas del día.
    B: Debe tener a un adulto con licencia en el vehículo en todo momento.
    C: Debe usar lentes correctivos en todo momento al conducir.
    D: Tiene restringido conducir en autopistas interestatales.
  answer: C
  explanation: El manual establece que si su licencia de conducir indica que debe
    usar lentes correctivos (Código de Restricción 01), debe usarlos en todo momento
    al conducir.
- id: 699
  category: safe_driving_rules
  question: ¿Por qué debe evitar el uso de gafas de sol oscuras o lentes de contacto
    tintados por la noche?
  choices:
    A: Aumentan el resplandor de los faros que vienen en sentido contrario.
    B: Reducen la luz que necesita para ver con claridad.
    C: Hacen que sus ojos se fatiguen mucho más rápido.
    D: Es ilegal usarlos mientras conduce en Tennessee.
  answer: B
  explanation: El manual aconseja evitar el uso de gafas de sol oscuras o lentes de
    contacto tintados por la noche porque reducen la luz que necesita para ver con
    claridad.
- id: 700
  category: driver_responsibility
  question: ¿Cómo pueden compensar los conductores con discapacidad auditiva para
    mantenerse seguros en la carretera?
  choices:
    A: Confiando más en su visión.
    B: Conduciendo a velocidades más lentas que el límite establecido.
    C: Manteniendo sus ventanas bajas en todo momento.
    D: Instalando bocinas más fuertes en sus vehículos.
  answer: A
  explanation: Según el manual, los conductores que tienen una discapacidad auditiva
    pueden ajustarse y compensar confiando más en su visión para ser conductores seguros.
- id: 701
  category: defensive_driving
  question: ¿Cuál de los siguientes es un consejo recomendado para ayudar a evitar
    la fatiga al conducir en un viaje largo?
  choices:
    A: Comer una comida abundante antes de comenzar el viaje.
    B: Detenerse cada hora o con más frecuencia si es necesario para tomar un descanso.
    C: Conducir tarde en la noche cuando hay menos tráfico en la carretera.
    D: Tomar medicamentos de venta libre para ayudarle a mantenerse alerta.
  answer: B
  explanation: Para evitar la fatiga, el manual recomienda tomar descansos deteniéndose
    cada hora o con más frecuencia si es necesario para caminar y tomar aire fresco.
- id: 702
  category: alcohol_drugs_health
  question: 'En Tennessee, una persona con epilepsia puede conducir si está bajo el
    cuidado de un médico y ha estado libre de convulsiones durante un mínimo de:'
  choices:
    A: Tres meses
    B: Seis meses
    C: Un año
    D: Dos años
  answer: B
  explanation: El manual establece que en Tennessee, usted puede conducir si está
    bajo el cuidado de un médico y ha estado libre de convulsiones durante un mínimo
    de seis meses.
- id: 703
  category: alcohol_drugs_health
  question: ¿Por qué los conductores con diabetes deben revisarse los ojos con regularidad?
  choices:
    A: Porque la insulina hace que los ojos se vuelvan excesivamente sensibles al
      resplandor.
    B: Para asegurarse de que no necesiten que se añada el Código de Restricción 01
      a su licencia.
    C: Porque la diabetes hace que los ojos se sequen más rápido al conducir.
    D: Para detectar una posible ceguera nocturna u otros problemas de visión.
  answer: D
  explanation: El manual señala que si tiene diabetes, debe revisarse los ojos con
    regularidad para detectar una posible ceguera nocturna u otros problemas de visión.
- id: 704
  category: driver_responsibility
  question: Si tiende a ser una persona impaciente, ¿qué debe hacer para evitar acciones
    de conducción inseguras?
  choices:
    A: Escuchar música de ritmo rápido para mantenerse alerta.
    B: Conducir ligeramente por encima del límite de velocidad para evitar el tráfico
      pesado.
    C: Planificar siempre tiempo extra para sus viajes en automóvil.
    D: Conducir solo durante las horas de menor afluencia.
  answer: C
  explanation: El manual aconseja que si tiende a ser una persona impaciente, siempre
    debe planificar tiempo extra para sus viajes en automóvil para evitar el exceso
    de velocidad u otras acciones inseguras.
- id: 705
  category: vehicle_information
  question: ¿Cuál de los siguientes es una señal de que su sistema de frenos necesita
    ser revisado por un mecánico?
  choices:
    A: El pedal del freno se siente firme y resiste la presión.
    B: El vehículo se detiene suavemente sin desviarse hacia un lado.
    C: El pedal del freno llega hasta el piso.
    D: Los frenos son completamente silenciosos cuando se aplican.
  answer: C
  explanation: El manual advierte que es muy peligroso si los frenos no funcionan
    correctamente, como si hacen mucho ruido, huelen raro o si el pedal del freno
    llega al piso.
- id: 706
  category: vehicle_information
  question: ¿En qué tipo de clima tienden las baterías de los automóviles a agotarse
    más rápidamente?
  choices:
    A: Clima caluroso y seco
    B: Clima frío o húmedo
    C: Clima húmedo y soleado
    D: Condiciones de gran altitud
  answer: B
  explanation: Según la sección de mantenimiento del vehículo, las baterías de los
    automóviles tienden a agotarse más rápidamente en climas fríos o húmedos.
- id: 707
  category: vehicle_information
  question: ¿Cuál es una causa común de que se forme una película en el interior de
    los vidrios de un vehículo?
  choices:
    A: Usar la calefacción/desempañador con demasiada frecuencia.
    B: Usar líquido limpiaparabrisas que no se congela.
    C: Fumar dentro del vehículo.
    D: Dejar las ventanas bajas durante la lluvia.
  answer: C
  explanation: El manual indica que debe mantener limpio el interior de sus ventanas,
    especialmente si alguien que usa el vehículo fuma, porque fumar hace que se acumule
    una película en el interior del vidrio.
- id: 708
  category: vehicle_information
  question: ¿Cuál es una consecuencia de conducir con neumáticos desequilibrados y
    baja presión de aire?
  choices:
    A: Mejora la economía de combustible y la comodidad del viaje.
    B: Hace que el vehículo sea más fácil de maniobrar en condiciones húmedas.
    C: Disminuye la posibilidad de hidroplaneo.
    D: Causa un desgaste más rápido de los neumáticos y reduce la economía de combustible.
  answer: D
  explanation: El manual explica que los neumáticos desequilibrados y la baja presión
    causan un desgaste más rápido de los neumáticos, reducen la economía de combustible
    y hacen que el vehículo sea más difícil de maniobrar y detener.
- id: 709
  category: vehicle_information
  question: 'Al usar una moneda de un centavo para revisar la banda de rodadura de
    los neumáticos, el neumático se considera ilegal e inseguro si la banda de rodadura
    no llega al menos a:'
  choices:
    A: La parte superior del Monumento a Lincoln
    B: La cabeza de Lincoln (2/32 de pulgada)
    C: La fecha impresa en la moneda
    D: Las palabras 'In God We Trust'
  answer: B
  explanation: El manual establece que si introduce una moneda de un centavo en la
    banda de rodadura con la cabeza primero y la banda no llega al menos a la cabeza
    de Lincoln (2/32 de pulgada), el neumático es ilegal e inseguro.
- id: 710
  category: vehicle_information
  question: ¿Dónde se puede encontrar usualmente la presión de neumáticos recomendada
    por el vehículo en muchos autos más nuevos?
  choices:
    A: En la columna del volante.
    B: En la calcomanía en el marco de la puerta delantera del lado del conductor.
    C: En el interior de la puerta de la guantera.
    D: En el parachoques trasero del vehículo.
  answer: B
  explanation: El manual señala que en muchos autos más nuevos, la presión de neumáticos
    recomendada por el vehículo se encuentra en la calcomanía en el marco de la puerta,
    generalmente ubicada en la puerta delantera del lado del conductor.
- id: 711
  category: driver_responsibility
  question: ¿Con qué frecuencia recomienda el manual que un especialista de la vista
    le revise los ojos?
  choices:
    A: Cada seis meses
    B: Cada uno o dos años
    C: Cada cinco años
    D: Solo al renovar su licencia de conducir
  answer: B
  explanation: Debido a que ver bien es muy importante para conducir de manera segura,
    el manual recomienda que un especialista de la vista le revise los ojos cada uno
    o dos años.
- id: 712
  category: vehicle_information
  question: ¿Dónde se encuentra generalmente la presión recomendada de los neumáticos
    para los neumáticos originales de un vehículo?
  choices:
    A: Impresa directamente en los propios neumáticos
    B: En una calcomanía en el marco de la puerta delantera del lado del conductor
    C: En la columna del volante
    D: Grabada en el bloque del motor
  answer: B
  explanation: En muchos autos más nuevos, la presión recomendada de los neumáticos
    del vehículo está en la calcomanía en el marco de la puerta, generalmente ubicada
    en la puerta delantera del lado del conductor.
- id: 713
  category: vehicle_information
  question: ¿Por qué NO debe usar la presión de los neumáticos impresa en los propios
    neumáticos?
  choices:
    A: Es la presión mínima requerida para conducir de manera segura.
    B: Solo es aplicable para condiciones de conducción en invierno.
    C: Es la presión máxima recomendada y puede no coincidir con las especificaciones
      de su vehículo.
    D: Está destinada solo para neumáticos de repuesto de un tamaño diferente.
  answer: C
  explanation: 'El manual establece: "No use la presión de los neumáticos (psi) impresa
    en los propios neumáticos. Esta es la presión máxima recomendada para el neumático
    y puede no coincidir con las especificaciones del fabricante de su vehículo".'
- id: 714
  category: safe_driving_rules
  question: ¿Qué sucederá si gira el encendido de su vehículo a la posición de "bloqueo"
    (lock) mientras el vehículo está en movimiento?
  choices:
    A: Los frenos se activarán inmediatamente.
    B: El volante se bloqueará en su lugar y perderá el control del vehículo.
    C: El motor se sobrecalentará rápidamente.
    D: El vehículo se deslizará de manera segura hasta detenerse.
  answer: B
  explanation: Nunca gire el encendido de su vehículo a la posición de "bloqueo" (lock)
    mientras el vehículo está en movimiento. Esto hará que el volante se bloquee en
    su lugar y perderá el control del vehículo.
- id: 715
  category: vehicle_information
  question: Si su vehículo continúa rebotando después de un bache o una parada, ¿qué
    sistema probablemente necesita ser revisado por un mecánico?
  choices:
    A: El sistema de escape
    B: El sistema de dirección
    C: El sistema de enfriamiento del motor
    D: El sistema de suspensión
  answer: D
  explanation: Si el vehículo continúa rebotando después de un bache o una parada,
    o es difícil de controlar, es posible que necesite amortiguadores nuevos u otras
    piezas de la suspensión.
- id: 716
  category: vehicle_information
  question: ¿Cuál es una señal de advertencia peligrosa de que su vehículo puede tener
    una fuga en el escape?
  choices:
    A: El volante se vuelve difícil de girar.
    B: Usted o sus pasajeros sienten sueño al conducir o viajar.
    C: El vehículo rebota excesivamente después de detenerse.
    D: El indicador de temperatura del motor baja repentinamente.
  answer: B
  explanation: Si alguna vez comienza a notar que usted y/o sus pasajeros tienden
    a sentir sueño al conducir o viajar en su automóvil, es posible que tenga una
    fuga en el escape que deba repararse de inmediato.
- id: 717
  category: safe_driving_rules
  question: ¿Qué debe hacer si está sentado en un vehículo con el motor en marcha
    (en ralentí) durante un período prolongado?
  choices:
    A: Gire el encendido a la posición de "bloqueo" (lock).
    B: Verifique el nivel de refrigerante del radiador.
    C: Abra una ventana para que entre aire fresco.
    D: Toque la bocina periódicamente para mantenerse alerta.
  answer: C
  explanation: Cuando esté sentado durante períodos prolongados en un vehículo con
    el motor en marcha (en ralentí), abra una ventana para que entre aire fresco y
    evitar que los vapores de monóxido de carbono afecten a las personas en el vehículo.
- id: 718
  category: vehicle_information
  question: ¿Cuándo es el ÚNICO momento seguro para revisar el nivel de anticongelante/refrigerante
    de su radiador?
  choices:
    A: Inmediatamente después de operar el vehículo
    B: Mientras el motor está en marcha
    C: Cuando el vehículo está estacionado en una pendiente
    D: Cuando el vehículo está frío
  answer: D
  explanation: Tenga cuidado de revisar su radiador ÚNICAMENTE cuando el vehículo
    esté frío, no inmediatamente después de su funcionamiento.
- id: 719
  category: defensive_driving
  question: ¿Por qué es peligroso tener objetos sueltos en el piso de su vehículo?
  choices:
    A: Pueden rodar debajo del pedal del freno y evitar que usted se detenga.
    B: Harán que el sistema de suspensión rebote.
    C: Pueden causar una fuga en el escape.
    D: Agotarán la batería del vehículo.
  answer: A
  explanation: Asegúrese de que no haya objetos en el piso que puedan rodar debajo
    del pedal del freno y evitar que detenga el vehículo.
- id: 720
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el ÚNICO uso apropiado para la bocina de su
    vehículo?
  choices:
    A: Para saludar a amigos en la carretera
    B: Para animar a los conductores lentos a acelerar
    C: Como advertencia para los demás
    D: Para indicar que se está estacionando
  answer: C
  explanation: Puede que la bocina no parezca importante para la seguridad, pero como
    dispositivo de advertencia, podría salvarle la vida. Use su bocina ÚNICAMENTE
    como advertencia para los demás.
- id: 721
  category: safe_driving_rules
  question: ¿Cuánta gasolina debe asegurarse de que tenga su vehículo antes de iniciar
    cualquier viaje de duración considerable?
  choices:
    A: Al menos un cuarto de tanque
    B: Al menos medio tanque
    C: Un tanque completamente lleno
    D: Lo suficiente para llegar a la gasolinera más cercana
  answer: B
  explanation: Asegúrese de que su vehículo siempre tenga al menos medio tanque de
    gasolina antes de iniciar cualquier viaje de duración considerable.
- id: 722
  category: defensive_driving
  question: 'Según el manual, las colisiones que involucran a varios vehículos suelen
    ocurrir cuando:'
  choices:
    A: Los conductores usan sus bocinas con demasiada frecuencia.
    B: Los conductores van más rápido o más lento que el resto del tráfico.
    C: Los vehículos tienen instalados neumáticos de repuesto no originales.
    D: Los conductores revisan la presión de sus neumáticos con demasiada frecuencia.
  answer: B
  explanation: Los vehículos que se mueven en la misma dirección a la misma velocidad
    no pueden chocar entre sí. Las colisiones que involucran a varios vehículos suelen
    ocurrir cuando los conductores van más rápido o más lento que el resto del tráfico.
- id: 723
  category: defensive_driving
  question: ¿Por qué debe reducir su velocidad y estar alerta en centros comerciales,
    estacionamientos y zonas del centro de la ciudad?
  choices:
    A: Porque el límite de velocidad es siempre de 15 mph en estas áreas.
    B: Porque estas áreas siempre tienen bandas sonoras (rumble strips).
    C: Porque los vehículos y las personas se detienen, arrancan y se mueven en diferentes
      direcciones de forma rápida y aleatoria.
    D: Porque los niveles de monóxido de carbono son más altos en estas áreas.
  answer: C
  explanation: Los centros comerciales, los estacionamientos y las zonas del centro
    son áreas concurridas con vehículos y personas que se detienen, arrancan y se
    mueven en diferentes direcciones de forma rápida y aleatoria.
- id: 724
  category: safe_driving_rules
  question: ¿Por qué podría necesitar reducir la velocidad al cruzar algunos cruces
    de ferrocarril?
  choices:
    A: Para revisar la presión de sus neumáticos
    B: Porque algunos cruces son irregulares o tienen baches
    C: Para leer las especificaciones del fabricante
    D: Para permitir que el sistema de escape se enfríe
  answer: B
  explanation: 'Cruces de ferrocarril: debe asegurarse de que no vengan trenes y de
    que tenga espacio para cruzar. Algunos cruces son irregulares, por lo que debe
    reducir la velocidad para cruzar de manera segura.'
- id: 725
  category: sharing_the_road
  question: Según la ley estatal, ¿quién se considera un peatón?
  choices:
    A: Solo las personas que caminan a pie
    B: Cualquier persona a pie o que use una silla de ruedas motorizada o no motorizada
    C: Cualquier persona que ande en bicicleta o bicicleta motorizada
    D: Solo los niños y los ancianos
  answer: B
  explanation: Según la ley estatal, cualquier persona a pie o que use una silla de
    ruedas motorizada o no motorizada se considera un peatón.
- id: 726
  category: sharing_the_road
  question: ¿Qué grupos de peatones son las víctimas más frecuentes en las colisiones
    entre automóviles y peatones?
  choices:
    A: Adolescentes y adultos jóvenes
    B: Personas que trotan o corren
    C: Peatones que caminan en grupos grandes
    D: Peatones jóvenes, ancianos, discapacitados e intoxicados
  answer: D
  explanation: Debe estar especialmente alerta con los peatones jóvenes, ancianos,
    discapacitados e intoxicados. Ellos son las víctimas más frecuentes en las colisiones
    entre automóviles y peatones.
- id: 727
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre los pasos de peatones es verdadera?
  choices:
    A: Los pasos de peatones solo existen donde hay líneas pintadas.
    B: Los peatones solo tienen el derecho de paso en los pasos de peatones marcados.
    C: Hay un paso de peatones en cada intersección, incluso si no hay líneas pintadas
      que marquen el cruce.
    D: Los conductores pueden bloquear un paso de peatones si están esperando para
      girar a la derecha.
  answer: C
  explanation: Según el manual, hay un paso de peatones en cada intersección, incluso
    si las líneas pintadas y los límites no marcan el cruce.
- id: 728
  category: defensive_driving
  question: ¿Por qué los conductores deben evitar detenerse con una parte de su vehículo
    sobre el área del paso de peatones?
  choices:
    A: Activará una cámara de semáforo en rojo.
    B: Obliga a los peatones a rodear el vehículo y los pone en una situación peligrosa.
    C: Causa un desgaste excesivo en los neumáticos del vehículo.
    D: Bloquea la vista de la señal de tráfico para otros conductores.
  answer: B
  explanation: Bloquear el paso de peatones obliga a los peatones a rodear su vehículo
    y los pone en una situación peligrosa.
- id: 729
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor en una zona escolar marcada cuando las luces
    intermitentes de advertencia están funcionando y un peatón está cruzando?
  choices:
    A: Reducir la velocidad a 15 mph y proceder con precaución.
    B: Tocar la bocina para advertir al peatón.
    C: Detenerse y ceder el derecho de paso hasta que el peatón haya cruzado la calzada.
    D: Virar bruscamente hacia el carril adyacente para evitar al peatón.
  answer: C
  explanation: Cuando se encuentre en una zona escolar marcada con luces intermitentes
    de advertencia en funcionamiento, el conductor debe detenerse para ceder el derecho
    de paso y permanecer detenido hasta que el peatón haya cruzado la calzada.
- id: 730
  category: sharing_the_road
  question: Usted debe siempre ceder el paso a un peatón ciego que utilice un perro
    guía o que lleve ¿qué tipo de bastón?
  choices:
    A: Un bastón negro sólido.
    B: Un bastón blanco, metálico o blanco con punta roja.
    C: Un bastón de madera.
    D: Un bastón reflectante amarillo.
  answer: B
  explanation: Los conductores siempre deben ceder el paso a los peatones ciegos que
    lleven un bastón blanco, metálico, blanco con punta roja o que utilicen un perro
    guía.
- id: 731
  category: safe_driving_rules
  question: ¿Cuándo no hay aceras disponibles, por dónde deben caminar los peatones?
  choices:
    A: En el lado derecho de la carretera con el tráfico.
    B: En el centro de la carretera.
    C: En el lado izquierdo de la carretera de frente al tráfico.
    D: En el arcén de la carretera en la misma dirección que el tráfico.
  answer: C
  explanation: Cuando no hay aceras, los peatones siempre deben caminar por el lado
    izquierdo de la carretera de frente al tráfico para que puedan ver los peligros
    repentinos que se aproximan hacia ellos.
- id: 732
  category: safe_driving_rules
  question: ¿Cómo deben caminar dos o más peatones cuando transitan por una carretera
    sin aceras?
  choices:
    A: Uno al lado del otro para aumentar la visibilidad.
    B: En fila india.
    C: Tomados de la mano a través del carril.
    D: Uno en el lado izquierdo de la carretera y otro en el derecho.
  answer: B
  explanation: El manual establece que dos o más peatones deben caminar en fila india
    y nunca uno al lado del otro cuando caminan por la carretera.
- id: 733
  category: sharing_the_road
  question: ¿Por qué es importante que los peatones mantengan una distancia segura
    cuando están parados en las esquinas de las calles?
  choices:
    A: Para evitar que les salpique agua de los charcos.
    B: Porque los camiones y autobuses realizan giros amplios a la derecha y, en ocasiones,
      se suben a la esquina de la acera.
    C: Para dar espacio a los ciclistas para circular por la acera.
    D: Porque los coches suelen saltarse los semáforos en rojo a altas velocidades.
  answer: B
  explanation: Los camiones y autobuses realizan giros amplios a la derecha y, en
    ocasiones, se suben a la esquina de la acera, por lo que es importante que los
    peatones estén alerta y retrocedan.
- id: 734
  category: signs_and_signals
  question: ¿Qué debe hacer si se encuentra en medio de la calle y la señal de "NO
    CRUCE" (DON'T WALK) comienza a parpadear?
  choices:
    A: Detenerse inmediatamente y esperar a la siguiente señal de CRUCE (WALK).
    B: Dar la vuelta y correr de regreso a la acera de donde salió.
    C: Continuar caminando para completar el cruce.
    D: Permanecer en la mediana central hasta que el tráfico se despeje.
  answer: C
  explanation: Si se encuentra en medio de la calle y la señal de NO CRUCE comienza
    a parpadear, continúe caminando. Tendrá tiempo para completar el cruce.
- id: 735
  category: signs_and_signals
  question: ¿Qué indica una señal de CRUCE (WALK) o una luz verde de semáforo a un
    peatón?
  choices:
    A: Es completamente seguro cruzar sin mirar.
    B: Se garantiza que todo el tráfico que se aproxima se detendrá.
    C: Es su turno para cruzar, pero aún debe mirar y avanzar solo si es seguro.
    D: Debe cruzar la intersección corriendo lo más rápido posible.
  answer: C
  explanation: La señal de CRUCE y la luz verde del semáforo indican que es su turno
    de cruzar, pero NO significan que sea SEGURO cruzar. Significa MIRE y luego, SI
    es seguro, avance.
- id: 736
  category: driver_responsibility
  question: Incluso si usted tiene el derecho de paso legal como conductor, ¿qué NUNCA
    debe hacerle a un peatón que esté frente a su automóvil?
  choices:
    A: Esperar pacientemente a que cruce.
    B: Tocar la bocina o acelerar el motor para apresurarlo o asustarlo.
    C: Hacer contacto visual con él.
    D: Ceder el derecho de paso.
  answer: B
  explanation: No toque la bocina, no acelere el motor ni haga nada para apresurar
    o asustar a un peatón frente a su automóvil, incluso si usted tiene el derecho
    de paso legal.
- id: 737
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento recomendado para mirar que debe seguir un peatón
    antes de comenzar a cruzar una calle?
  choices:
    A: Mirar a la derecha-izquierda-derecha.
    B: Mirar solo hacia adelante.
    C: Mirar a la izquierda-derecha-izquierda, y por encima del hombro para ver si
      hay vehículos girando.
    D: Mirar el semáforo y avanzar inmediatamente.
  answer: C
  explanation: Antes de cruzar, deténgase en el bordillo y mire a la izquierda-derecha-izquierda,
    y si está despejado, comience a cruzar, mirando por encima del hombro para ver
    si hay vehículos girando.
- id: 738
  category: sharing_the_road
  question: ¿Por qué un peatón nunca debe caminar detrás de un camión cuando este
    está dando marcha atrás?
  choices:
    A: Los gases de escape del camión son tóxicos.
    B: Los conductores de camiones no pueden ver directamente detrás del camión y
      podrían lesionarlo gravemente.
    C: El camión podría dejar caer su carga.
    D: Es ilegal caminar detrás de cualquier vehículo comercial.
  answer: B
  explanation: Nunca camine detrás de un camión cuando esté dando marcha atrás; los
    conductores de camiones no pueden ver directamente detrás del camión y podrían
    lesionarlo gravemente debido a los grandes puntos ciegos.
- id: 739
  category: sharing_the_road
  question: Al entrar o salir de una entrada para vehículos, callejón o estacionamiento,
    ¿qué debe hacer un conductor si su trayectoria cruza una acera?
  choices:
    A: Tocar la bocina para advertir a los peatones que se detengan.
    B: Ceder el paso a los peatones que caminan por la acera.
    C: Avanzar rápidamente para evitar bloquear la acera.
    D: Encender y apagar sus faros para obtener el derecho de paso.
  answer: B
  explanation: Los conductores deben ceder el paso a los peatones que caminan por
    la acera al entrar o salir de una entrada para vehículos, garaje de estacionamiento
    público, callejón o estacionamiento y su trayectoria de viaje cruza la acera.
- id: 740
  category: safe_driving_rules
  question: ¿Cuál es la mejor opción para que un peatón sea visto por los conductores
    durante la noche?
  choices:
    A: Caminar exclusivamente por los pasos de peatones.
    B: Usar ropa oscura para reducir el resplandor.
    C: Llevar una linterna y usar ropa brillante o reflectante.
    D: Caminar por el lado derecho de la carretera.
  answer: C
  explanation: Usar ropa brillante o reflectante y llevar una linterna es su mejor
    opción para ser visto por la noche.
- id: 741
  category: sharing_the_road
  question: ¿Cuáles son las causas más comunes de colisiones entre vehículos y bicicletas?
  choices:
    A: Ciclistas que se saltan señales de alto o semáforos en rojo.
    B: Conductores que giran a la izquierda frente a una bicicleta que se aproxima
      o giran a la derecha cruzándose en la trayectoria de la bicicleta.
    C: Ciclistas que circulan en sentido contrario al tráfico.
    D: Conductores que rebasan a los ciclistas demasiado cerca en una carretera de
      varios carriles.
  answer: B
  explanation: Las causas más comunes de colisiones son los conductores que giran
    a la izquierda frente a una bicicleta que se aproxima o giran a la derecha, cruzándose
    en la trayectoria de la bicicleta.
- id: 742
  category: sharing_the_road
  question: Si su vehículo comparte el carril de giro a la izquierda con un ciclista,
    ¿qué debe hacer?
  choices:
    A: Tocar la bocina para que se quiten de su camino.
    B: Rebasarlos por la derecha antes de realizar su giro.
    C: Permanecer detrás de ellos hasta que hayan completado su giro de manera segura.
    D: Ponerse al lado de ellos y girar al mismo tiempo.
  answer: C
  explanation: Si su vehículo comparte el carril de giro a la izquierda con un ciclista,
    permanezca detrás de ellos hasta que hayan completado su giro de manera segura.
- id: 743
  category: sharing_the_road
  question: ¿Dónde tienen prohibido circular los ciclistas?
  choices:
    A: En carreteras rurales de dos carriles.
    B: En calles de la ciudad con límites de velocidad superiores a 35 mph.
    C: En autopistas de acceso limitado, vías rápidas (expressways) y otras calzadas
      marcadas específicamente.
    D: En carriles para bicicletas designados.
  answer: C
  explanation: Los ciclistas tienen prohibido circular en autopistas de acceso limitado,
    vías rápidas y otras calzadas marcadas específicamente.
- id: 744
  category: sharing_the_road
  question: En Tennessee, ¿cuál es la distancia mínima que un conductor debe dejar
    al rebasar a un ciclista que circula en la misma dirección?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Al rebasar y adelantar a un ciclista que circula en la misma dirección,
    hágalo lentamente y deje al menos una distancia entre usted y la bicicleta de
    no menos de 3 pies. ¡Es la ley en Tennessee!
- id: 745
  category: safe_driving_rules
  question: ¿Qué debe hacer si está a punto de rebasar una bicicleta en una carretera
    estrecha y cree que el ciclista no sabe que usted se aproxima?
  choices:
    A: Tocar la bocina con fuerza para asegurarse de que lo escuchen.
    B: Tocar la bocina suave y brevemente como señal.
    C: Acelerar el motor ruidosamente.
    D: Rebasarlos lo más cerca posible para que lo noten.
  answer: B
  explanation: Si está a punto de rebasar una bicicleta en una carretera estrecha
    y cree que el ciclista no sabe que usted se aproxima, toque la bocina suave y
    brevemente como señal de que va a pasar.
- id: 746
  category: sharing_the_road
  question: ¿Cuál es la señal manual adecuada para que un ciclista indique un giro
    a la izquierda?
  choices:
    A: Extender el brazo izquierdo hacia un lado doblado en un ángulo de 90 grados,
      con la mano apuntando hacia arriba.
    B: Extender el brazo izquierdo o el brazo derecho hacia un lado y doblarlo en
      un ángulo de 90 grados, con la mano apuntando hacia abajo.
    C: Extender el brazo izquierdo hacia un lado con todos los dedos extendidos o
      usar el dedo índice para señalar a la izquierda.
    D: Extender el brazo derecho recto con la palma hacia atrás.
  answer: C
  explanation: 'Giro a la izquierda: Extienda su brazo izquierdo hacia un lado con
    todos los dedos extendidos o use su dedo índice para señalar a la izquierda.'
- id: 747
  category: sharing_the_road
  question: ¿Cómo indica un ciclista que se va a detener o a disminuir la velocidad?
  choices:
    A: Extendiendo el brazo izquierdo hacia un lado con todos los dedos extendidos.
    B: Extendiendo el brazo izquierdo hacia un lado doblado en un ángulo de 90 grados,
      con la mano apuntando hacia arriba.
    C: Extendiendo el brazo derecho recto con todos los dedos extendidos.
    D: Extendiendo el brazo izquierdo o derecho hacia un lado y doblándolo en un ángulo
      de 90 grados, con la mano apuntando hacia abajo.
  answer: D
  explanation: 'Detenerse o disminuir la velocidad: Extienda su brazo izquierdo o
    derecho hacia un lado y doble el brazo en un ángulo de 90 grados en la articulación
    del codo, con la mano apuntando hacia abajo y la palma de la mano hacia atrás.'
- id: 748
  category: sharing_the_road
  question: ¿Cuándo se le permite a un ciclista el uso completo del carril?
  choices:
    A: Cuando el carril es demasiado estrecho para que tanto un vehículo como una
      bicicleta compartan el carril de manera segura.
    B: Siempre que circulen por un vecindario residencial.
    C: Solo cuando circulan en un grupo de tres o más.
    D: A los ciclistas nunca se les permite el uso completo del carril.
  answer: A
  explanation: Se debe permitir a un ciclista el uso completo del carril cuando...
    El carril es demasiado estrecho para que tanto un vehículo como una bicicleta
    compartan el carril de manera segura. En este caso, lo más seguro es dejar que
    la bicicleta ocupe todo el carril.
- id: 749
  category: vehicle_information
  question: Según la ley de Tennessee, ¿qué equipo de iluminación se requiere en una
    bicicleta que se use de noche?
  choices:
    A: Una luz blanca en la parte delantera visible desde 500 pies y un reflector
      rojo o luz roja en la parte trasera visible desde 500 pies.
    B: Una luz amarilla en la parte delantera visible desde 300 pies y un reflector
      blanco en la parte trasera.
    C: Solo un reflector rojo en la parte trasera visible desde 200 pies.
    D: Una luz blanca intermitente en la parte delantera y una luz amarilla intermitente
      en la parte trasera.
  answer: A
  explanation: La ley de Tennessee exige que una bicicleta utilizada de noche debe
    estar equipada con una lámpara en la parte delantera que emita una luz blanca
    visible desde una distancia de al menos 500 pies hacia adelante y un reflector
    rojo o una lámpara que emita una luz roja que sea visible desde una distancia
    de 500 pies hacia atrás.
- id: 750
  category: sharing_the_road
  question: ¿Por qué los ciclistas tienden a moverse hacia el centro del carril cuando
    pasan junto a autos estacionados?
  choices:
    A: Para bloquear el paso del tráfico.
    B: Para evitar herir o ser heridos por personas que bajan de esos autos.
    C: Porque el pavimento es más liso en el centro del carril.
    D: Para prepararse para un giro a la derecha.
  answer: B
  explanation: Cuando los ciclistas pasan junto a autos estacionados, tienden a alejarse
    de los autos, hacia el centro del carril. Esto es para evitar herir o ser heridos
    por personas que bajan de esos autos.
- id: 751
  category: defensive_driving
  question: ¿Qué debe hacer con sus luces delanteras cuando ve a un ciclista que viene
    en sentido contrario por la noche?
  choices:
    A: Use las luces altas para poder verlo con claridad.
    B: Toque la bocina continuamente para avisarle que usted está allí.
    C: No use las luces altas.
    D: Haga destellos con las luces altas repetidamente para advertirle.
  answer: C
  explanation: Por la noche, no use las luces altas cuando vea a un ciclista que viene
    en sentido contrario.
- id: 752
  category: sharing_the_road
  question: ¿Por qué es peligroso que un ciclista circule en sentido contrario al
    flujo del tráfico?
  choices:
    A: Hace que el ciclista viaje demasiado rápido.
    B: Puede causar que el ciclista no vea los dispositivos de control de tráfico,
      como señales de tránsito y semáforos.
    C: Es ilegal que los vehículos rebasen a un ciclista que circula en sentido contrario
      al tráfico.
    D: Hace que las llantas de la bicicleta se desgasten de manera desigual.
  answer: B
  explanation: Circule por el lado derecho, con el flujo del tráfico. Circular en
    sentido contrario al tráfico puede causar que no vea los dispositivos de control
    de tráfico, como señales de tránsito y semáforos.
- id: 753
  category: defensive_driving
  question: ¿Por qué un ciclista nunca debe meterse entre un camión grande o autobús
    y la acera?
  choices:
    A: El conductor del camión o autobús podría pedirle direcciones.
    B: El ciclista podría pinchar una llanta debido a los escombros cerca de la acera.
    C: Los camiones y autobuses realizan giros amplios a la derecha, y el ciclista
      podría ser aplastado.
    D: El ciclista se verá obligado a circular por la acera.
  answer: C
  explanation: Los camiones y autobuses realizan giros amplios a la derecha. Nunca
    se meta entre un camión o autobús y la acera o podría ser aplastado.
- id: 754
  category: sharing_the_road
  question: ¿Qué es la "Zona No" (No-Zone) en relación con los camiones grandes?
  choices:
    A: Un área de estacionamiento designada solo para camiones.
    B: Puntos ciegos en la parte delantera, trasera y en los laterales del camión
      donde el conductor no puede verlo.
    C: Una zona donde no se permite la circulación de camiones.
    D: El área inmediatamente delante de un camión donde los ciclistas tienen el derecho
      de paso.
  answer: B
  explanation: Los camiones grandes tienen puntos ciegos en la parte delantera, trasera
    y en los laterales, lo que dificulta que el conductor vea a su alrededor. Estos
    se conocen como la "Zona No" (No-Zone).
- id: 755
  category: sharing_the_road
  question: ¿Qué indica a los conductores un banderín rojo o naranja en la antena
    de una bicicleta?
  choices:
    A: El ciclista es un niño.
    B: El ciclista transporta materiales peligrosos.
    C: El ciclista tiene una discapacidad auditiva.
    D: El ciclista es un principiante.
  answer: C
  explanation: 'Si ve a un ciclista con un banderín rojo o naranja en la antena de
    la bicicleta, reduzca la velocidad: este es un símbolo común para indicar que
    el ciclista tiene una discapacidad auditiva.'
- id: 756
  category: sharing_the_road
  question: Según las investigaciones, ¿qué causa dos tercios de las colisiones entre
    automóviles y motocicletas?
  choices:
    A: El motociclista que excede el límite de velocidad o conduce de manera agresiva.
    B: El conductor del automóvil que gira delante de la motocicleta.
    C: Peatones que cruzan la calle ilegalmente.
    D: Camiones grandes que cambian de carril sin señalizar.
  answer: B
  explanation: Las investigaciones muestran que dos tercios de las colisiones entre
    automóviles y motocicletas son causadas, no por el motociclista, sino por el conductor
    que giró delante de la motocicleta.
- id: 757
  category: sharing_the_road
  question: 'Al conducir junto a una motocicleta en el mismo carril, usted debe:'
  choices:
    A: Compartir el carril con la motocicleta para mejorar el flujo del tráfico.
    B: Tocar la bocina para avisarles que está pasando.
    C: Nunca intentar compartir un carril con una motocicleta.
    D: Forzar a la motocicleta hacia el borde del carril.
  answer: C
  explanation: Las motocicletas tienen derecho al uso del carril completo. Nunca debe
    intentar compartir un carril con una motocicleta, y siempre debe respetar el espacio
    y la posición de la motocicleta en el tráfico.
- id: 758
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada que un conductor
    debe dejar cuando circula detrás de una motocicleta?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: B
  explanation: Deje al menos una distancia de seguimiento de dos segundos, para que
    el motociclista tenga tiempo suficiente para maniobrar o detenerse en una emergencia.
- id: 759
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a una motocicleta demasiado cerca o demasiado
    rápido?
  choices:
    A: La motocicleta puede intentar competir con usted.
    B: La ráfaga de aire puede hacer que el motociclista pierda el control.
    C: El motociclista podría no escuchar su motor.
    D: Es ilegal rebasar a una motocicleta en una carretera de varios carriles.
  answer: B
  explanation: Rebase como lo haría con un automóvil, y no pase demasiado cerca ni
    demasiado rápido, ya que la ráfaga de aire puede hacer que el motociclista pierda
    el control.
- id: 760
  category: defensive_driving
  question: ¿Cómo podría reaccionar un motociclista al cruzar un paso a nivel de ferrocarril?
  choices:
    A: Acelerar para cruzar lo más rápido posible.
    B: Detenerse por completo y cruzar la motocicleta caminando.
    C: Reducir la velocidad y posiblemente zigzaguear para cruzar las vías.
    D: Circular por el arcén para evitar las vías por completo.
  answer: C
  explanation: Los pasos a nivel de ferrocarril son un peligro particular para los
    ciclistas y motociclistas, y generalmente causarán que reduzcan la velocidad y
    posiblemente zigzagueen para cruzar las vías.
- id: 761
  category: sharing_the_road
  question: ¿Qué debe esperar un conductor que haga un motociclista experimentado
    al circular sobre un puente metálico o de rejilla?
  choices:
    A: Acelerar rápidamente para minimizar el tiempo en el puente.
    B: Moverse al arcén del puente.
    C: Reducir la velocidad y moverse al centro del carril.
    D: Ponerse de pie sobre los reposapiés y zigzaguear.
  answer: C
  explanation: Los puentes metálicos o de rejilla hacen que una motocicleta se tambalee
    mucho más que un automóvil. Un ciclista experimentado reduce la velocidad y se
    mueve al centro del carril para dejar espacio para manejar la superficie irregular.
- id: 762
  category: vehicle_information
  question: ¿Cuál es la pieza de equipo más importante que puede usar un motociclista
    al conducir?
  choices:
    A: Guantes de cuero
    B: Un casco aprobado por el DOT
    C: Botas con punta de acero
    D: Una chaqueta reflectante
  answer: B
  explanation: Los cascos son la pieza de equipo más importante que puede usar al
    conducir su motocicleta. Tenga cuidado con los cascos que no cumplen con los estándares
    del Departamento de Transporte de los EE. UU. (DOT).
- id: 763
  category: sharing_the_road
  question: ¿Dónde se encuentran los puntos ciegos, o "No-Zones", en un camión grande?
  choices:
    A: Solo directamente detrás del camión.
    B: Solo en el lado derecho del camión.
    C: En la parte delantera, trasera y en ambos lados del camión.
    D: Solo directamente en frente del camión.
  answer: C
  explanation: Los camiones tienen grandes "No-Zones" en ambos lados, al frente y
    detrás del camión. Los conductores de camiones no pueden verlo cuando usted circula
    en estos puntos ciegos.
- id: 764
  category: safe_driving_rules
  question: Al adelantar a un camión grande, ¿cuándo es seguro volver a incorporarse
    delante de él?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión.
    B: Cuando pueda ver la parte delantera del camión en su espejo retrovisor.
    C: Cuando el conductor del camión toque la bocina.
    D: Cuando esté exactamente a la longitud de un automóvil por delante del camión.
  answer: B
  explanation: Al adelantar, busque la parte delantera del camión en su espejo retrovisor
    antes de incorporarse delante y evite frenar.
- id: 765
  category: driver_responsibility
  question: En los choques que involucran camiones grandes y automóviles, ¿qué porcentaje
    de las víctimas mortales son sufridas por los ocupantes del automóvil?
  choices:
    A: 25 por ciento
    B: 50 por ciento
    C: 78 por ciento
    D: 95 por ciento
  answer: C
  explanation: En los choques que involucran camiones grandes, los ocupantes de un
    automóvil, generalmente el conductor, sufren el 78 por ciento de las víctimas
    mortales.
- id: 766
  category: defensive_driving
  question: ¿Por qué el punto ciego delantero de un camión grande es particularmente
    peligroso para un motociclista?
  choices:
    A: Las motocicletas aceleran mucho más lento que los camiones.
    B: Las motocicletas pueden frenar mucho más rápido que los camiones, y es posible
      que el camión no pueda detenerse a tiempo.
    C: Las luces delanteras del camión cegarán al motociclista.
    D: Los gases de escape del camión pueden abrumar al motociclista.
  answer: B
  explanation: El punto ciego delantero es particularmente peligroso si necesita detenerse
    rápidamente. Debido a su peso ligero y sistema de frenado, las motocicletas pueden
    detenerse mucho más rápido que los camiones. Es posible que un camión no pueda
    detenerse tan rápido como usted.
- id: 767
  category: sharing_the_road
  question: ¿Por qué los niños que montan en bicicleta crean problemas especiales
    para los conductores?
  choices:
    A: No son capaces de tener un juicio adecuado para determinar las condiciones
      del tráfico.
    B: Siempre conducen más rápido que el límite de velocidad.
    C: Se les exige circular por el lado izquierdo de la carretera.
    D: Usan señales manuales que son difíciles de entender.
  answer: A
  explanation: Los niños no son capaces de tener un juicio adecuado para determinar
    las condiciones del tráfico, por lo tanto, los conductores deben estar alerta
    ante la posibilidad de movimientos erráticos y cambios repentinos de dirección
    cuando hay niños en bicicleta presentes.
- id: 768
  category: sharing_the_road
  question: ¿Por qué los conductores a menudo no ven a los motociclistas en la carretera?
  choices:
    A: Las motocicletas están pintadas de colores que se mezclan con la carretera.
    B: Los conductores tienden a buscar otros automóviles y camiones, y el perfil
      estrecho de la motocicleta la hace más difícil de ver.
    C: Las motocicletas suelen conducirse por debajo del límite de velocidad.
    D: Los motociclistas no están obligados a usar luces delanteras durante el día.
  answer: B
  explanation: Los conductores tienden a buscar otros automóviles y camiones, no motocicletas.
    El perfil de una motocicleta es estrecho y el cuerpo es corto, lo que la hace
    más difícil de ver y dificulta que un conductor estime la distancia y la velocidad
    de la motocicleta.
- id: 769
  category: defensive_driving
  question: ¿Qué hace que los ciclistas sean especialmente difíciles de ver por la
    noche?
  choices:
    A: No se les permite usar reflectores.
    B: Circulan exclusivamente por el medio del carril por la noche.
    C: Las luces del tráfico que se aproxima pueden hacer que sean aún más difíciles
      de ver.
    D: Viajan mucho más rápido por la noche que durante el día.
  answer: C
  explanation: Los ciclistas que circulan de noche presentan problemas de visibilidad
    para los conductores... Las luces del tráfico que se aproxima pueden hacer que
    sean aún más difíciles de ver por la noche.
- id: 770
  category: sharing_the_road
  question: Según el manual, ¿cuánto tiempo le toma detenerse a un camión que viaja
    a 55 MPH en comparación con un automóvil?
  choices:
    A: Un camión se detiene en 240 pies, igual que un automóvil.
    B: Un camión tarda unos 300 pies en detenerse.
    C: Un camión tarda unos 450+ pies en detenerse.
    D: Un camión tarda más de 600 pies en detenerse.
  answer: C
  explanation: Un automóvil que viaja a 55 MPH puede detenerse en 240 pies; sin embargo,
    un camión que viaja a la misma velocidad de 55 MPH tarda unos 450+ pies en detenerse.
- id: 771
  category: sharing_the_road
  question: ¿Cuál es una regla de oro crucial que debe recordar con respecto a los
    puntos ciegos de un camión grande?
  choices:
    A: Si está a menos de 50 pies del camión, está en un punto ciego.
    B: Si no puede ver al conductor del camión en el espejo del camión, el conductor
      no puede verlo a usted.
    C: Los camiones solo tienen puntos ciegos en su lado derecho.
    D: Toque la bocina para asegurarse de que el conductor sepa que usted está en
      su punto ciego.
  answer: B
  explanation: 'El manual establece: "si no puede ver al conductor del camión en el
    espejo del camión, el conductor del camión no puede verlo a usted".'
- id: 772
  category: defensive_driving
  question: ¿Por qué es peligroso intentar meterse entre un camión grande y el bordillo
    cuando el camión está girando?
  choices:
    A: El camión puede acelerar repentinamente y golpear su vehículo.
    B: Los camiones a menudo se abren hacia la izquierda para realizar un giro a la
      derecha de manera segura, creando una peligrosa maniobra de "apretón" (squeeze
      play).
    C: El escape del camión se dirige hacia el bordillo y puede oscurecer su visión.
    D: Es ilegal rebasar a un camión por la derecha bajo cualquier circunstancia.
  answer: B
  explanation: Los conductores de camiones a veces necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha de manera segura. Meterse entre el camión y
    el bordillo aumenta la posibilidad de un choque al quedar atrapado en un "apretón".
- id: 773
  category: vehicle_information
  question: ¿Cuánto puede llegar a pesar una combinación típica de tractocamión y
    remolque completamente cargada?
  choices:
    A: 40,000 libras
    B: 60,000 libras
    C: 80,000 libras
    D: 100,000 libras
  answer: C
  explanation: Una combinación típica de tractocamión y remolque, un semirremolque
    cargado enganchado y arrastrado por una unidad tractora, puede pesar hasta 80,000
    libras o 40 toneladas.
- id: 774
  category: defensive_driving
  question: ¿Qué debe hacer si se detiene detrás de un camión en una pendiente ascendente?
  choices:
    A: Manténgase a la derecha en su carril y toque la bocina.
    B: Manténgase a la izquierda en su carril para que el conductor pueda verlo y
      deje espacio adicional.
    C: Acérquese lo más posible al parachoques del camión para evitar que este retroceda.
    D: Ponga su vehículo en punto muerto (neutral) y aplique el freno de estacionamiento.
  answer: B
  explanation: Si se detiene detrás de un camión en una pendiente ascendente, manténgase
    a la izquierda en su carril para que el conductor pueda verlo. Deje espacio adicional
    frente a su automóvil en caso de que el camión retroceda.
- id: 775
  category: sharing_the_road
  question: ¿Qué significa si el conductor de un camión parpadea los faros de su vehículo
    después de que usted lo rebasa?
  choices:
    A: Le está advirtiendo sobre un oficial de policía o un peligro más adelante.
    B: Está señalando que tiene espacio suficiente para volver a incorporarse delante
      de su vehículo.
    C: Está enojado porque lo rebasó demasiado cerca.
    D: Sus faros están funcionando mal y usted debería acelerar.
  answer: B
  explanation: Si el conductor del camión o autobús parpadea los faros de su vehículo
    después de que usted lo rebasa, es una señal de que tiene espacio suficiente para
    volver a incorporarse delante de su vehículo.
- id: 776
  category: vehicle_information
  question: ¿Hasta qué distancia hacia atrás puede extenderse el punto ciego de un
    camión grande?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: Los puntos ciegos de un camión se encuentran inmediatamente al frente,
    a ambos lados de la cabina y hasta 200 pies en la parte trasera.
- id: 777
  category: vehicle_information
  question: Si un tractocamión tiene un capó largo, ¿cuántos de los primeros pies
    delante del parachoques es posible que el camionero no pueda ver?
  choices:
    A: 5-10 pies
    B: 10-20 pies
    C: 20-30 pies
    D: 30-40 pies
  answer: B
  explanation: Si el tractocamión tiene un capó largo, es posible que el camionero
    no pueda ver los primeros 10-20 pies delante del parachoques, espacio suficiente
    para que una motocicleta o un automóvil se deslicen inadvertidamente en una posición
    peligrosa.
- id: 778
  category: sharing_the_road
  question: ¿Qué debe hacer cuando conduce cerca de una estación de pesaje de vehículos
    comerciales?
  choices:
    A: Acelere para pasar la estación lo más rápido posible.
    B: Evite conducir en el carril derecho para que los camiones que se mueven lentamente
      puedan incorporarse fácilmente de nuevo a la carretera.
    C: Muévase al carril derecho para seguir de cerca a los camiones.
    D: Haga parpadear sus luces altas a los camiones que se incorporan para advertirles
      de su presencia.
  answer: B
  explanation: Cuando esté cerca de una estación de pesaje de vehículos comerciales,
    evite conducir en el carril derecho para que los camiones que se mueven lentamente
    puedan incorporarse fácilmente de nuevo a la carretera.
- id: 779
  category: safe_driving_rules
  question: ¿Por qué es importante bajar la intensidad de sus faros (usar luces bajas)
    por la noche cuando conduce cerca de camiones grandes?
  choices:
    A: Las luces brillantes pueden agotar la batería de su vehículo más rápido.
    B: Las luces brillantes reflejadas en los espejos del camión pueden cegar al conductor.
    C: Los conductores de camiones usan gafas de visión nocturna que son sensibles
      a la luz.
    D: Ayuda al conductor del camión a ver mejor las líneas de la carretera.
  answer: B
  explanation: Baje la intensidad de sus luces por la noche. Las luces brillantes
    reflejadas en los espejos pueden cegar al conductor.
- id: 780
  category: defensive_driving
  question: ¿Por qué nunca debe subestimar la velocidad de un camión grande o autobús
    que se aproxima?
  choices:
    A: Siempre están excediendo el límite de velocidad establecido.
    B: Debido a su gran tamaño, a menudo parecen viajar más lentamente que su velocidad
      real.
    C: Tienen motores especiales que les permiten acelerar silenciosamente.
    D: Sus velocímetros suelen ser inexactos hasta por 10 MPH.
  answer: B
  explanation: Nunca subestime el tamaño y la velocidad de los camiones y autobuses
    que se aproximan. Debido a su gran tamaño, a menudo parecen viajar más lentamente
    que su velocidad real.
- id: 781
  category: driver_responsibility
  question: ¿Según el manual, qué es lo más importante que puede hacer para salvar
    su vida, especialmente en un choque con un camión grande?
  choices:
    A: Virar hacia la cuneta para evitar el impacto.
    B: Usar el cinturón de seguridad.
    C: Tocar la bocina continuamente antes del impacto.
    D: Sujetarse firmemente contra el volante.
  answer: B
  explanation: Usar el cinturón de seguridad es lo más importante que puede hacer
    para salvar su vida, especialmente en un choque con un camión grande. Evita que
    golpee el volante, que sea lanzado de un lado a otro y que sea expulsado del vehículo.
- id: 782
  category: sharing_the_road
  question: ¿Qué debe anticipar al rebasar a un camión grande en una pendiente cuesta
    abajo?
  choices:
    A: Es probable que el camión pierda velocidad debido al frenado del motor.
    B: El camión viajará más rápido debido a su peso, y es posible que deba aumentar
      su velocidad para rebasarlo.
    C: El camión se detendrá en el acotamiento para dejarlo pasar.
    D: El conductor del camión aplicará el freno de emergencia para mantener una velocidad
      lenta.
  answer: B
  explanation: Debido a su peso, los camiones viajan más rápido cuesta abajo y es
    posible que deba aumentar su velocidad para rebasar a un camión en una pendiente
    descendente.
- id: 783
  category: defensive_driving
  question: ¿Por qué debe evitar conducir directamente detrás de un camión o autobús
    y, en su lugar, mantener una distancia razonable?
  choices:
    A: Para evitar respirar gases de escape nocivos.
    B: Para tener una mejor vista de la carretera para anticipar problemas y tener
      espacio para una "salida" de emergencia.
    C: Porque ir a rebufo (drafting) detrás de un vehículo comercial es ilegal en
      Tennessee.
    D: Para evitar que las llantas del camión lancen piedras a su parabrisas.
  answer: B
  explanation: Mantenga una distancia razonable entre su vehículo y el vehículo grande
    que va delante. Esto le da una mejor vista de la carretera para anticipar problemas
    y le dará espacio para una "salida" de emergencia.
- id: 784
  category: sharing_the_road
  question: Al rebasar a un camión en una pendiente cuesta abajo, ¿cuál es la acción
    más segura?
  choices:
    A: Reducir la velocidad para igualar la del camión antes de rebasar.
    B: Completar el rebase lo más rápido posible y mantener su velocidad.
    C: Permanecer al lado del camión para evitar que acelere.
    D: Rebasar al camión y frenar inmediatamente para controlar su velocidad.
  answer: B
  explanation: Debido a su peso, los camiones viajan más rápido cuesta abajo. Debe
    completar su rebase lo más rápido posible, no permanezca al lado del camión y
    mantenga su velocidad después de rebasar sin reducirla.
- id: 785
  category: sharing_the_road
  question: Al encontrarse con un camión o autobús que viene en dirección opuesta,
    ¿cómo afecta la turbulencia del viento a los vehículos?
  choices:
    A: Succiona los vehículos entre sí.
    B: Empuja los vehículos separándolos.
    C: Atrae al vehículo más pequeño debajo del camión.
    D: No tiene ningún efecto sobre los vehículos.
  answer: B
  explanation: Al encontrarse con un camión o autobús en dirección opuesta, la turbulencia
    del viento entre los vehículos EMPUJA los vehículos SEPARÁNDOLOS; NO los succiona
    entre sí.
- id: 786
  category: sharing_the_road
  question: ¿Por qué debe evitar entrar en el espacio abierto en el lado derecho de
    un camión que está girando a la derecha?
  choices:
    A: El conductor del camión se está preparando para retroceder en ese espacio.
    B: El camión puede transportar materiales peligrosos que podrían derramarse.
    C: Es posible que el conductor del camión no lo vea y su automóvil pueda ser aplastado
      o golpeado lateralmente.
    D: El camión acelerará rápidamente durante el giro.
  answer: C
  explanation: Los camiones realizan giros amplios a la derecha y a menudo dejan un
    espacio abierto a la derecha. Si usted se encuentra entre el camión y la acera,
    es posible que el conductor no pueda verlo y su automóvil pueda ser aplastado
    o golpeado lateralmente por el remolque.
- id: 787
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las rampas de frenado para camiones (runaway
    truck ramps)?
  choices:
    A: Proporcionar un área de descanso para conductores comerciales cansados.
    B: Permitir que los camiones carguen y descarguen mercancía de manera segura.
    C: Detener camiones o autobuses fuera de control que bajan por pendientes pronunciadas.
    D: Pesar los camiones antes de que entren en la autopista.
  answer: C
  explanation: Las rampas de frenado para camiones están diseñadas para detener camiones
    o autobuses fuera de control que bajan por pendientes pronunciadas. Los vehículos
    nunca deben detenerse ni estacionarse en estas áreas.
- id: 788
  category: sharing_the_road
  question: ¿Aproximadamente qué distancia se extiende la 'ZONA PROHIBIDA' (NO-ZONE)
    delantera de un vehículo grande directamente frente al camión?
  choices:
    A: 10 pies
    B: 20 pies
    C: 50 pies
    D: 100 pies
  answer: B
  explanation: El área de aproximadamente hasta 20 pies directamente frente a un vehículo
    grande se considera una ZONA PROHIBIDA (NO-ZONE), donde meterse demasiado pronto
    puede causar un choque.
- id: 789
  category: sharing_the_road
  question: ¿A qué distancia mínima deben mantenerse los niños de un autobús escolar
    para permanecer fuera de la Zona de Peligro?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La Zona de Peligro es el área en todos los lados del autobús donde
    los niños corren el mayor riesgo. Los niños deben mantenerse a diez pies de distancia
    del autobús escolar y NUNCA deben pasar por detrás de él.
- id: 790
  category: safe_driving_rules
  question: ¿Según el manual, cuándo corren los niños el mayor riesgo de resultar
    heridos en relación con los autobuses escolares?
  choices:
    A: Mientras viajan dentro del autobús en la autopista.
    B: Cuando el autobús se ve involucrado en una colisión por alcance.
    C: Fuera del autobús cuando están subiendo o bajando.
    D: Cuando están sentados en la primera fila del autobús.
  answer: C
  explanation: La realidad de la seguridad en los autobuses escolares es que más niños
    resultan heridos fuera de un autobús que dentro de uno. Los niños corren el mayor
    riesgo cuando suben o bajan del autobús escolar.
- id: 791
  category: signs_and_signals
  question: ¿Cómo es el emblema de "vehículo de movimiento lento"?
  choices:
    A: Una señal amarilla en forma de diamante con letras negras.
    B: Un triángulo naranja fluorescente o reflectante.
    C: Un octágono rojo con un borde blanco.
    D: Un rectángulo blanco con el símbolo de un tractor negro.
  answer: B
  explanation: El emblema de "vehículo de movimiento lento" es un triángulo naranja
    fluorescente o reflectante que debe exhibirse en la parte trasera de los vehículos
    tirados por animales, y en la mayoría de los vehículos agrícolas y equipos de
    construcción.
- id: 792
  category: sharing_the_road
  question: Debido a que la maquinaria agrícola generalmente no tiene luces direccionales,
    ¿cómo podría prepararse un operador para realizar un giro a la derecha?
  choices:
    A: Haciendo parpadear sus faros tres veces.
    B: Abriéndose hacia la izquierda primero, y luego girando a la derecha.
    C: Deteniéndose por completo y haciendo señas al tráfico para que pase.
    D: Conduciendo por el arcén derecho antes de girar.
  answer: B
  explanation: La maquinaria agrícola generalmente no tiene luces direccionales y,
    para realizar un giro a la derecha, los operadores de maquinaria agrícola pueden
    abrirse primero hacia la izquierda y luego girar a la derecha.
- id: 793
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera sobre los vehículos
    de tracción animal en las carreteras de Tennessee?
  choices:
    A: Solo se permiten en carreteras rurales sin pavimentar.
    B: Deben ceder el derecho de paso a todos los vehículos motorizados.
    C: Tienen los mismos derechos de uso de la carretera que un vehículo motorizado.
    D: No están obligados a seguir las reglas estándar de la carretera.
  answer: C
  explanation: Los vehículos de tracción animal tienen los mismos derechos de uso
    de la carretera que un vehículo motorizado y deben seguir las mismas reglas de
    tránsito.
- id: 794
  category: defensive_driving
  question: Si va detrás de un camión bajando una colina empinada y nota que las ruedas
    echan humo o que va a gran velocidad, ¿qué debe hacer?
  choices:
    A: Acelerar y rebasar al camión inmediatamente.
    B: Tocar la bocina para alertar al conductor.
    C: Retroceder y NO rebasar.
    D: Detenerse en el arcén izquierdo y parar.
  answer: C
  explanation: Las ruedas que echan humo o una velocidad alta pueden ser una señal
    de pérdida de frenos en un vehículo pesado. Si se encuentra en esta situación,
    retroceda y NO rebase.
- id: 795
  category: sharing_the_road
  question: ¿Por qué debe evitar conducir demasiado cerca de camiones que transportan
    materiales peligrosos?
  choices:
    A: Hacen paradas frecuentes, como en los cruces ferroviarios.
    B: Viajan mucho más rápido que los camiones comerciales estándar.
    C: Crean más turbulencia de viento que otros camiones.
    D: No están equipados con luces de freno estándar.
  answer: A
  explanation: No conduzca demasiado cerca de los camiones que transportan materiales
    peligrosos, ya que realizan paradas frecuentes, como en los cruces ferroviarios.
- id: 796
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un camión o autobús lo está rebasando?
  choices:
    A: Acelerar para salir del punto ciego del camión.
    B: Moverse al centro de su carril y mantener la velocidad.
    C: Mantenerse en el lado exterior de su carril y reducir ligeramente su velocidad.
    D: Hacer parpadear sus luces altas para advertir al conductor del camión.
  answer: C
  explanation: Cuando un camión lo rebasa, puede ayudar al conductor manteniéndose
    en el lado exterior de su carril y reduciendo ligeramente su velocidad. NUNCA
    ACELERE MIENTRAS UN CAMIÓN O AUTOBÚS LO ESTÁ REBASANDO.
- id: 797
  category: safe_driving_rules
  question: 'En muchos sistemas escolares, se les enseña a los niños a escapar de
    la zona de peligro del autobús escolar dando:'
  choices:
    A: Tres pasos pequeños lejos del autobús.
    B: Cinco pasos gigantes tan pronto como bajen del autobús.
    C: Diez pasos normales hacia la parte trasera del autobús.
    D: Dos pasos gigantes hacia la parte delantera del autobús.
  answer: B
  explanation: En muchos sistemas escolares, se les enseña a los niños a escapar de
    la zona de peligro dando cinco pasos gigantes tan pronto como bajen del autobús.
- id: 798
  category: sharing_the_road
  question: 'En la mayoría de los casos, la maquinaria agrícola grande en las autopistas
    rurales viajará a velocidades inferiores a:'
  choices:
    A: 15 M.P.H.
    B: 25 M.P.H.
    C: 35 M.P.H.
    D: 45 M.P.H.
  answer: B
  explanation: En la mayoría de los casos, los vehículos de maquinaria agrícola viajarán
    a menos de 25 M.P.H.
- id: 799
  category: sharing_the_road
  question: ¿Qué debe evitar hacer al acercarse o rebasar a un jinete a caballo?
  choices:
    A: Reducir la velocidad
    B: Tocar la bocina o acelerar el motor
    C: Dejar una distancia razonable
    D: Rebasar por la izquierda
  answer: B
  explanation: 'El manual establece: "NO toque la bocina ni acelere el motor ruidosamente
    al acercarse o rebasar a un caballo".'
- id: 800
  category: vehicle_information
  question: ¿Cuál es el rango de velocidad normal para los vehículos de movimiento
    lento?
  choices:
    A: 15 a 30 mph
    B: 5 a 20 mph
    C: 10 a 25 mph
    D: 20 a 40 mph
  answer: B
  explanation: Según el manual, "Las velocidades normales para los vehículos de movimiento
    lento pueden oscilar entre 5 y 20 mph".
- id: 801
  category: safe_driving_rules
  question: ¿Cuando se requieren luces en vehículos de movimiento lento, a qué distancia
    hacia atrás es normalmente visible la lámpara roja autoluminosa?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: El manual establece que una lámpara roja autoluminosa en la parte trasera
    de un vehículo de movimiento lento es normalmente visible a 500 pies hacia atrás.
- id: 802
  category: safe_driving_rules
  question: ¿Qué carril debe utilizar el tráfico más lento?
  choices:
    A: El carril de la izquierda
    B: El carril central
    C: El carril de la derecha
    D: Cualquier carril siempre que mantengan una velocidad constante
  answer: C
  explanation: 'El manual dicta: ''El tráfico más lento debe circular por el carril
    de la derecha. El carril izquierdo es para rebasar y girar''.'
- id: 803
  category: signs_and_signals
  question: ¿De qué color es el fondo de todas las señales temporales en las zonas
    de obras?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Blanco
  answer: C
  explanation: 'El manual establece: ''Todas las señales temporales en las zonas de
    obras tienen un fondo naranja y letras o símbolos negros''.'
- id: 804
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una infracción de velocidad en una zona de
    obras donde se ha reducido la velocidad y hay trabajadores presentes?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1000
  answer: C
  explanation: Bajo la ley de Tennessee, las infracciones de velocidad en zonas de
    obras con velocidades reducidas y trabajadores presentes resultarán en una multa
    de hasta un máximo de $500.
- id: 805
  category: defensive_driving
  question: ¿Qué distancia recorre un automóvil que viaja a 60 M.P.H. en un segundo?
  choices:
    A: 44 pies
    B: 60 pies
    C: 88 pies
    D: 120 pies
  answer: C
  explanation: 'El manual señala: ''Un automóvil que viaja a 60 M.P.H. recorre 88
    pies por segundo''.'
- id: 806
  category: defensive_driving
  question: ¿Cuál es el tipo de accidente más común en una zona de obras?
  choices:
    A: Colisiones frontales
    B: Colisiones por alcance (traseras)
    C: Raspados laterales
    D: Volcamientos
  answer: B
  explanation: El manual advierte a los conductores que no sigan de cerca a otros
    vehículos porque 'la mayoría de los accidentes en zonas de obras son causados
    por colisiones por alcance'.
- id: 807
  category: sharing_the_road
  question: ¿Qué distancia le toma detenerse a un tren que viaja a 55 millas por hora?
  choices:
    A: Un cuarto de milla
    B: Media milla
    C: Una milla completa
    D: Dos millas
  answer: C
  explanation: Según el manual, 'un tren que viaja a 55 millas por hora tarda una
    milla completa en detenerse'.
- id: 808
  category: defensive_driving
  question: ¿Qué tan probable es que muera en una colisión con un tren en comparación
    con una colisión con un automóvil?
  choices:
    A: 5 veces más probable
    B: 10 veces más probable
    C: 20 veces más probable
    D: 30 veces más probable
  answer: D
  explanation: 'El manual establece: ''Usted tiene 30 veces más probabilidades de
    morir en una colisión con un tren que con un automóvil o incluso con un camión
    grande o autobús''.'
- id: 809
  category: sharing_the_road
  question: ¿Dónde ocurren la mayoría de las colisiones de trenes con automóviles?
  choices:
    A: A menos de 25 millas de la casa del conductor
    B: En caminos rurales de tierra sin señalizar
    C: Por la noche en áreas mal iluminadas
    D: A más de 100 millas de la casa del conductor
  answer: A
  explanation: El manual explica que 'la mayoría de las colisiones ocurren a menos
    de 25 millas de la casa del conductor, lo que sugiere que los conductores SABÍAN
    que las vías estaban allí...'
- id: 810
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso cuando un automóvil y un tren se acercan
    a un cruce?
  choices:
    A: El vehículo que llega primero
    B: El tren SIEMPRE tiene el derecho de paso
    C: El automóvil, si viaja a velocidades de autopista
    D: El tren, pero solo si las luces de advertencia están parpadeando
  answer: B
  explanation: 'El manual establece explícitamente: ''Los conductores SIEMPRE deben
    ceder el derecho de paso a los trenes porque ES LA LEY''.'
- id: 811
  category: sharing_the_road
  question: ¿De qué color es la vestimenta que normalmente usan los trabajadores en
    una zona de obras para asegurar que sean muy visibles?
  choices:
    A: Naranja brillante
    B: Verde amarillento brillante
    C: Blanco reflectante
    D: Rosa neón
  answer: B
  explanation: 'El manual establece: ''En estas zonas de obras, los trabajadores normalmente
    vestirán prendas de color verde amarillento brillante, como camisas, chalecos
    o cascos, para garantizar que sean muy visibles''.'
- id: 812
  category: sharing_the_road
  question: ¿Cómo deben posicionarse los jinetes cuando circulan por la carretera?
  choices:
    A: De dos en fondo en el carril derecho
    B: En fila india cerca del bordillo o borde derecho de la carretera
    C: En fila india cerca de la línea central
    D: En el arcén izquierdo de frente al tráfico
  answer: B
  explanation: El manual exige que los jinetes 'deben circular en fila india cerca
    del bordillo o borde derecho de la carretera, o en un arcén, carril o sendero
    derecho utilizable'.
- id: 813
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril equipado con dispositivos de señalización
    eléctricos o mecánicos, ¿dónde debe detener su vehículo por completo?
  choices:
    A: A menos de 100 pies, pero no a menos de 25 pies del riel más cercano.
    B: A menos de 50 pies, pero no a menos de 15 pies del riel más cercano.
    C: A menos de 30 pies, pero no a menos de 10 pies del riel más cercano.
    D: Exactamente a 20 pies del riel más cercano.
  answer: B
  explanation: El manual establece que los cruces de ferrocarril equipados con dispositivos
    de señalización eléctricos o mecánicos requieren que el conductor detenga el vehículo
    por completo a una distancia de entre 50 pies y 15 pies del riel más cercano.
- id: 814
  category: defensive_driving
  question: Si su vehículo se apaga en las vías del tren y se aproxima un tren, ¿en
    qué dirección debe correr después de salir del vehículo?
  choices:
    A: En la misma dirección en la que viaja el tren.
    B: Directamente lejos de las vías en un ángulo de 90 grados.
    C: Hacia el tren en un ángulo de 45 grados.
    D: Paralelo a las vías en la dirección opuesta al tren.
  answer: C
  explanation: Según el manual, si se aproxima un tren, debe correr hacia el tren
    en un ángulo de 45 grados para alejarse y quedar detrás del punto de impacto.
- id: 815
  category: defensive_driving
  question: ¿Por qué debe correr hacia un tren que se aproxima en un ángulo de 45
    grados si su vehículo se apaga en las vías?
  choices:
    A: Para hacerle señales al maquinista del tren para que se detenga.
    B: Para tener una mejor vista de la velocidad del tren.
    C: Para llegar más rápido a la señal del Sistema de Notificación de Emergencia.
    D: Para alejarse y quedar detrás del punto de impacto para evitar lesiones por
      escombros voladores.
  answer: D
  explanation: El manual explica que correr hacia el tren en un ángulo de 45 grados
    le permite estar lejos y detrás del punto de impacto, evitando lesiones causadas
    por los escombros que salen volando.
- id: 816
  category: safe_driving_rules
  question: ¿Qué debe hacer si ya está cruzando las vías del tren y las luces de advertencia
    comienzan a parpadear o las barreras comienzan a bajar?
  choices:
    A: Detenerse inmediatamente y retroceder.
    B: Seguir moviéndose y terminar de cruzar.
    C: Detener su vehículo en las vías y salir inmediatamente.
    D: Poner su vehículo en reversa y retroceder con cuidado fuera de las vías.
  answer: B
  explanation: 'El manual establece explícitamente: "Si está cruzando las vías y las
    luces de advertencia comienzan a parpadear o las barreras comienzan a bajar, no
    se detenga. ¡SIGA MOVIÉNDOSE!"'
- id: 817
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado a detenerse en todos los
    cruces de ferrocarril, ya sea que las señales estén activadas o no?
  choices:
    A: Motocicletas y ciclomotores.
    B: Camionetas de 15 pasajeros y vehículos recreativos.
    C: Autobuses escolares, autobuses de pasajeros y camiones que transportan materiales
      peligrosos.
    D: Grúas y vehículos de emergencia.
  answer: C
  explanation: El manual señala que los autobuses escolares, los autobuses de pasajeros
    y los camiones que transportan materiales peligrosos deben detenerse en todos
    los cruces, estén activadas las señales o no.
- id: 818
  category: signs_and_signals
  question: ¿Qué información se proporciona en la señal azul del Sistema de Notificación
    de Emergencia (ENS) en un cruce de ferrocarril?
  choices:
    A: El horario del tren y las horas estimadas de llegada.
    B: El límite de velocidad para los trenes que pasan por el cruce.
    C: Un número de contacto de emergencia y el número de cruce del DOT.
    D: La distancia a la siguiente intersección de la carretera.
  answer: C
  explanation: El manual establece que la señal ENS proporciona un número de emergencia
    al cual llamar y el número de cruce del DOT para identificar su ubicación si su
    vehículo se apaga en las vías.
- id: 819
  category: license_system
  question: ¿Qué tipo de endoso o licencia especial se requiere para operar una camioneta
    de 15 pasajeros en el estado de Tennessee?
  choices:
    A: Una Licencia de Conducir Comercial (CDL).
    B: Una licencia Clase D con un endoso de pasajeros.
    C: Una licencia de chofer.
    D: No se necesitan endosos ni licencias especiales.
  answer: D
  explanation: 'El manual establece: "No se necesitan endosos ni licencias especiales
    para operar una camioneta de 15 pasajeros en el estado de Tennessee".'
- id: 820
  category: vehicle_information
  question: Al cargar una camioneta de 15 pasajeros, ¿por qué los pasajeros deben
    sentarse lo más adelante posible en el vehículo?
  choices:
    A: Para permitir que el conductor los escuche mejor.
    B: Porque el asiento trasero está detrás del eje trasero, lo que empuja el centro
      de gravedad más hacia atrás.
    C: Para dejar los asientos traseros libres para carga pesada y equipaje.
    D: Porque los asientos delanteros están equipados con mejores bolsas de aire.
  answer: B
  explanation: El manual aconseja que los pasajeros se sienten hacia la parte delantera
    porque el asiento trasero está ubicado detrás del eje trasero, lo que causa una
    distribución desigual del peso y empuja el centro de gravedad más hacia atrás.
- id: 821
  category: vehicle_information
  question: ¿En una camioneta de 15 pasajeros, la falta de inflado de los neumáticos
    traseros es una de las principales causas de qué problema peligroso?
  choices:
    A: Sobrecalentamiento del motor.
    B: Falla de los frenos.
    C: Separación de la banda de rodadura.
    D: Deslizamiento de la transmisión.
  answer: C
  explanation: Según el manual, la falta de inflado de los neumáticos traseros (especialmente
    el trasero izquierdo) es una de las principales causas de la separación de la
    banda de rodadura en las camionetas de 15 pasajeros.
- id: 822
  category: vehicle_information
  question: ¿Cómo se debe distribuir el peso en un vehículo recreativo (RV) para proporcionar
    un mejor manejo y mantener un centro de gravedad adecuado?
  choices:
    A: Más cerca del techo y principalmente en el lado derecho.
    B: Más cerca del suelo e igual en ambos lados.
    C: Totalmente en la parte trasera del vehículo.
    D: Principalmente en la parte delantera, cerca del asiento del conductor.
  answer: B
  explanation: El manual establece que distribuir el peso más cerca del suelo e igual
    en ambos lados mantiene el centro de gravedad bajo y proporcionará un mejor manejo
    de su vehículo recreativo (RV).
- id: 823
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los puntos
    ciegos, o "Zonas Prohibidas" (No-Zones), de un vehículo recreativo (RV)?
  choices:
    A: Los RV no tienen puntos ciegos si los espejos se ajustan correctamente.
    B: Los espejos de los RV permiten al conductor ver todo en la carretera.
    C: Los RV tienen puntos ciegos grandes y los espejos no permiten que el conductor
      vea todo.
    D: Solo el lado derecho de un RV tiene un punto ciego.
  answer: C
  explanation: El manual advierte que los RV son grandes y tienen muchos puntos ciegos,
    y aunque los espejos son importantes, no permiten que el conductor vea todo en
    la carretera.
- id: 824
  category: defensive_driving
  question: Si los neumáticos de una camioneta de 15 pasajeros se salen de la calzada,
    ¿cuál es la forma más segura de recuperarse y evitar un vuelco?
  choices:
    A: Frenar bruscamente y dar un volantazo hacia la carretera.
    B: Acelerar para recuperar la tracción antes de girar de vuelta.
    C: Reducir la velocidad gradualmente y volver a la calzada cuando sea seguro hacerlo.
    D: Poner el vehículo en punto muerto (neutral) y avanzar por inercia hasta que
      la camioneta se detenga por completo.
  answer: C
  explanation: El manual aconseja que si los neumáticos de la camioneta se salen de
    la calzada, debe reducir la velocidad gradualmente y volver a la calzada cuando
    sea seguro hacerlo para evitar un vuelco.
- id: 825
  category: safe_driving_rules
  question: Al esperar en un cruce de ferrocarril con las barreras bajadas, ¿cuándo
    es legal y seguro cruzar las vías?
  choices:
    A: Tan pronto como el tren haya pasado, incluso si las barreras todavía están
      bajadas.
    B: Cuando las barreras comiencen a subir y el tren esté fuera de vista.
    C: Solo después de que las barreras se hayan levantado por completo y las luces
      hayan dejado de parpadear.
    D: Siempre que pueda ver claramente que no viene otro tren.
  answer: C
  explanation: 'El manual establece: "No cruce las vías hasta que las barreras se
    hayan levantado por completo y las luces hayan dejado de parpadear".'
- id: 826
  category: defensive_driving
  question: Al esperar a que pase un tren en un cruce de ferrocarril con más de una
    vía, ¿qué debe hacer antes de cruzar?
  choices:
    A: Avanzar inmediatamente después de que el primer tren despeje el cruce.
    B: Asegurarse de que no se aproxime otro tren desde la dirección opuesta.
    C: Seguir de cerca al vehículo que tiene delante para cruzar rápidamente.
    D: Tocar la bocina para alertar a cualquier tren que se aproxime.
  answer: B
  explanation: El manual advierte que donde hay más de una vía, el conductor que espera
    a que pase un tren debe asegurarse de que no se aproxime otro tren desde la dirección
    opuesta antes de cruzar.
- id: 827
  category: vehicle_information
  question: ¿Por qué los conductores de vehículos recreativos (RV) deben dejar más
    espacio entre su vehículo y el vehículo que tienen delante?
  choices:
    A: Porque los RV son más pesados que los automóviles y requieren una distancia
      de frenado más larga.
    B: Porque los RV tienen una distancia de frenado más corta y podrían chocar por
      detrás a otros vehículos.
    C: Porque los RV son más anchos y necesitan más espacio para cambiar de carril.
    D: Porque es ilegal que un RV siga de cerca a un automóvil de pasajeros.
  answer: A
  explanation: El manual establece que los RV son similares a los camiones en el sentido
    de que son más pesados que los automóviles y requieren una distancia de frenado
    más larga, por lo que los conductores siempre deben mantener suficiente espacio
    entre su RV y el vehículo de adelante.
- id: 828
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es la regla con respecto a los cinturones de seguridad
    para los pasajeros en un vehículo recreativo (RV)?
  choices:
    A: Solo el conductor y el pasajero delantero deben usarlos.
    B: Los pasajeros solo necesitan usarlos cuando viajan por carreteras interestatales.
    C: Todos los pasajeros deben usar cinturones de seguridad siempre que el vehículo
      esté en movimiento.
    D: Los cinturones de seguridad son opcionales si el RV viaja a menos de 30 mph.
  answer: C
  explanation: Asegúrese de que todos los pasajeros de su RV usen cinturones de seguridad
    siempre que el vehículo esté en movimiento. Los pasajeros que no estén abrochados
    pueden salir despedidos y sufrir lesiones graves en un accidente o una parada
    repentina.
- id: 829
  category: license_system
  question: En Tennessee, ¿cuánto tiempo debe tener una persona menor de 18 años un
    permiso de aprendizaje antes de poder realizar el examen de conducción?
  choices:
    A: 90 días
    B: 180 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Las personas menores de dieciocho (18) años deben tener un permiso
    de aprendizaje durante 180 días y calificar bajo el programa GDL antes de poder
    realizar el examen de conducción.
- id: 830
  category: driver_responsibility
  question: Según el manual, ¿cuál es la mayor contribución que un padre o mentor
    puede hacer a la seguridad de un nuevo conductor al volante?
  choices:
    A: Comprar un vehículo con características de seguridad avanzadas.
    B: Los ejemplos que dan a través de la paciencia, la cortesía y los hábitos de
      conducción segura.
    C: Inscribir al adolescente en un curso avanzado de conducción defensiva.
    D: Hacer que conduzcan exclusivamente durante las horas del día.
  answer: B
  explanation: Su mayor contribución a la seguridad y eficacia de su nuevo conductor
    al volante serán los ejemplos que usted dé. La paciencia, la cortesía y la voluntad
    de mejorar serán sus mejores activos.
- id: 831
  category: defensive_driving
  question: ¿Cuál de las siguientes es una técnica recomendada para enseñar a un conductor
    nuevo mientras usted conduce?
  choices:
    A: Sobrecargarlo con tanta información como sea posible.
    B: Hablar en voz alta sobre las decisiones de conducción que está tomando.
    C: Poner música a todo volumen para poner a prueba su concentración.
    D: Permanecer completamente en silencio para que pueda observarlo sin distracciones.
  answer: B
  explanation: Algo útil que puede hacer es hablar en voz alta mientras conduce. Aproveche
    las oportunidades de enseñanza mientras está al volante, como explicar en voz
    alta los pasos que está tomando para calcular su distancia de seguimiento.
- id: 832
  category: driver_testing
  question: ¿Por qué se desaconseja conducir al azar durante las sesiones de práctica?
  choices:
    A: Desperdicia demasiado combustible.
    B: Puede ser peligroso que un conductor principiante se meta en problemas en las
      etapas iniciales.
    C: No cuenta para las horas de conducción requeridas por la GDL.
    D: Causa un desgaste innecesario en el vehículo.
  answer: B
  explanation: Conducir al azar durante las sesiones de práctica puede ser peligroso.
    Es muy fácil que el conductor principiante se meta en problemas, particularmente
    en las etapas iniciales.
- id: 833
  category: driver_testing
  question: ¿Cuál es el lugar ideal para las sesiones iniciales de práctica de la
    "Fase Uno" de un nuevo conductor?
  choices:
    A: Una zona residencial tranquila
    B: Una autopista de varios carriles y alta velocidad
    C: Un estacionamiento grande y desierto
    D: Una intersección concurrida de la ciudad
  answer: C
  explanation: Un estacionamiento grande y desierto es ideal para estas sesiones iniciales
    porque permite al principiante concentrarse plenamente en la sensación de los
    controles y la respuesta del automóvil.
- id: 834
  category: driver_testing
  question: Durante la "Fase Dos" de la práctica de conducción en una zona residencial
    tranquila, ¿qué nueva habilidad se debe introducir?
  choices:
    A: Estacionamiento en paralelo
    B: Mantener la posición adecuada en el carril y permitir distancias de seguimiento
      seguras (2 segundos)
    C: Giros en U y paradas rápidas
    D: Conducir en condiciones climáticas adversas
  answer: B
  explanation: La Fase Dos implica llevar al conductor a una zona residencial tranquila
    para practicar la incorporación al tráfico, mantener la posición adecuada en el
    carril, permitir distancias de seguimiento seguras (2 segundos) y cambios de carril
    sencillos.
- id: 835
  category: driver_testing
  question: ¿En qué fase de la práctica de conducción debe un nuevo conductor comenzar
    a aprender a estacionar en paralelo y navegar por intersecciones con múltiples
    carriles de giro?
  choices:
    A: Fase Uno
    B: Fase Dos
    C: Fase Tres
    D: Fase Cuatro
  answer: C
  explanation: La Fase Tres introduce tráfico más pesado, estacionamiento en paralelo,
    estacionamiento en subida/bajada, intersecciones con múltiples carriles de giro
    y giros en U/paradas rápidas.
- id: 836
  category: driver_testing
  question: ¿Cuál de las siguientes condiciones se introduce en la Fase Cuatro de
    la práctica de conducción?
  choices:
    A: Ajustar el asiento y los espejos
    B: Dar marcha atrás y mover el coche hacia adelante
    C: Cambios de carril sencillos
    D: Conducir de noche en buenas y malas condiciones climáticas
  answer: D
  explanation: La Fase Cuatro consiste en guiar al nuevo conductor para que practique
    en condiciones tales como autopistas de alta velocidad y varios carriles, diversas
    condiciones climáticas, de noche y en conducción urbana o zonas de tráfico pesado.
- id: 837
  category: driver_responsibility
  question: Cuando un conductor nuevo comete un error grave durante una sesión de
    práctica, ¿cuál es el enfoque recomendado?
  choices:
    A: Gritarle de inmediato para que comprenda la gravedad del error.
    B: Detenerse tan pronto como pueda y discutir lo sucedido mientras aún esté fresco
      en su memoria.
    C: Ignorarlo por completo para evitar erosionar su confianza.
    D: Esperar hasta el día siguiente para mencionarlo en un entorno formal.
  answer: B
  explanation: 'Detenerse y discutir: Deténgase tan pronto como pueda, mientras un
    error grave aún esté fresco en la memoria del nuevo conductor. Luego, tómese el
    tiempo para discutir lo que sucedió y cuál debería ser la respuesta más segura.'
- id: 838
  category: license_system
  question: Bajo el programa de Licencia de Conducir Graduada (GDL) de Tennessee,
    ¿cuántas horas de conducción deben completar los menores antes de ser elegibles
    para una licencia Intermedia?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: El programa GDL de Tennessee requiere que los menores conduzcan un
    número específico de horas (50) antes de ser elegibles para ascender al nivel
    de licencia Intermedia.
- id: 839
  category: safe_driving_rules
  question: Según el manual, ¿qué proporción de conductores varones de 16 años tendrá
    un choque durante su primer año de conducción?
  choices:
    A: Uno de cada tres
    B: Uno de cada cinco
    C: Uno de cada diez
    D: Uno de cada veinte
  answer: B
  explanation: La inexperiencia combinada con la falta de habilidad significa que
    uno de cada cinco conductores varones de 16 años y aproximadamente una de cada
    diez mujeres de 16 años tendrán un choque durante su primer año de conducción.
- id: 840
  category: defensive_driving
  question: ¿Algunos de los peores accidentes para conductores jóvenes y nuevos ocurren
    bajo cuál de las siguientes condiciones?
  choices:
    A: Durante el trayecto matutino a la escuela
    B: Por la noche y con un grupo de jóvenes en el automóvil
    C: Mientras conduce solo en un estacionamiento desierto
    D: Durante sesiones de práctica supervisadas con un padre
  answer: B
  explanation: Algunos de los peores accidentes ocurren por la noche y con un grupo
    de jóvenes en el automóvil. Esta es una de las razones por las que el programa
    GDL de Tennessee impone restricciones en estas dos áreas para los nuevos conductores
    adolescentes.
- id: 841
  category: driver_responsibility
  question: ¿Por qué es importante utilizar los mismos términos de manera constante
    (por ejemplo, decir siempre "pedal del acelerador" en lugar de cambiar a "acelerador")
    al enseñar a un conductor principiante?
  choices:
    A: Ayuda al conductor a aprobar el examen de conocimientos escrito.
    B: Garantiza una comunicación clara y evita confundir al principiante.
    C: Es un requisito legal bajo el programa GDL.
    D: Evita que el vehículo se apague.
  answer: B
  explanation: 'Comuníquese con claridad: Dé las instrucciones con suficiente antelación
    e intente utilizar siempre los mismos términos (no diga acelerador una vez y pedal
    del gas la siguiente, por ejemplo) para evitar confundir al nuevo conductor.'
- id: 842
  category: driver_responsibility
  question: Cuando un adolescente solicita una Licencia de Conducir Intermedia, ¿cuál
    de los siguientes es un tema sugerido para incluir en un acuerdo de conducción
    entre padres e hijos?
  choices:
    A: La ruta que tomará el examinador de conducción
    B: La responsabilidad por multas de estacionamiento o daños al vehículo
    C: Cómo omitir el examen de habilidades viales
    D: La fecha exacta en que el adolescente obtendrá una licencia completa
  answer: B
  explanation: El manual sugiere que las áreas a considerar en un acuerdo entre padres
    e hijos incluyen la responsabilidad por multas de estacionamiento o daños al vehículo,
    entre otros temas como las horas de conducción y el mantenimiento.
- id: 843
  category: safe_driving_rules
  question: Según el manual, ¿qué se considera el mayor enemigo del conductor novato?
  choices:
    A: Conducir de noche
    B: La complacencia que surge del éxito temprano al aprender los conceptos básicos
      de la conducción
    C: El tráfico pesado en las autopistas interestatales
    D: Los examinadores de conducción estrictos
  answer: B
  explanation: 'El manual establece: "El mayor enemigo del conductor novato es la
    complacencia que surge del éxito temprano al aprender los conceptos básicos de
    la conducción".'
- id: 844
  category: driver_testing
  question: ¿Qué se requiere de los solicitantes que no hablan inglés antes de que
    se pueda realizar un examen de conducción?
  choices:
    A: Deben tener fluidez en inglés escrito
    B: Deben traer un traductor certificado en el automóvil
    C: Deben entender y hablar suficiente inglés para comunicarse de manera segura
      con el examinador
    D: Deben realizar el examen en su lengua materna
  answer: C
  explanation: El manual establece explícitamente que todos los solicitantes deben
    entender y hablar suficiente inglés para comunicarse de manera segura con el examinador
    antes de que se pueda realizar un examen de conducción.
- id: 845
  category: driver_testing
  question: ¿Aproximadamente cuánto tiempo pasa un examinador de licencias de conducir
    conduciendo con un solicitante durante el examen?
  choices:
    A: Menos de 30 minutos
    B: Exactamente una hora
    C: Al menos 45 minutos
    D: Más de dos horas
  answer: A
  explanation: El manual recuerda a los padres que "un examinador de licencias de
    conducir pasa menos de 30 minutos conduciendo con su hijo".
- id: 846
  category: driver_responsibility
  question: ¿Qué sugiere encarecidamente el manual que hagan los padres después de
    que a su hijo adolescente se le haya otorgado una licencia de conducir?
  choices:
    A: Dejar de viajar en el vehículo con ellos
    B: Continuar monitoreando el desempeño de conducción de su hijo adolescente
    C: Permitir que el adolescente conduzca a cualquier lugar sin restricciones
    D: Dejar que el adolescente pague todo el mantenimiento del vehículo de inmediato
  answer: B
  explanation: El manual aconseja que "es prudente continuar monitoreando el desempeño
    de conducción de su hijo adolescente incluso después de que se le haya otorgado
    una licencia de conducir".
- id: 847
  category: defensive_driving
  question: 'Según el manual, ser un buen conductor defensivo significa:'
  choices:
    A: Conducir solo durante las horas del día
    B: Confiar únicamente en su experiencia de conducción
    C: Más que solo ser cauteloso; requiere trabajar en el desarrollo de buenas técnicas
      de conducción
    D: Conducir por debajo del límite de velocidad en todo momento
  answer: C
  explanation: 'El texto establece: "Ser un buen conductor defensivo significa más
    que solo ser cauteloso; ¡y la mera experiencia tampoco es suficiente! El buen
    conductor defensivo tiene que trabajar en el desarrollo de buenas técnicas de
    conducción".'
- id: 848
  category: license_system
  question: Según la descripción general del manual, ¿cuál de las siguientes informaciones
    se encuentra en la Sección A?
  choices:
    A: Consejos de conducción defensiva
    B: Señales de tráfico y semáforos
    C: Qué documentos se necesitan para solicitar una licencia
    D: Leyes de conducción estatales y sanciones
  answer: C
  explanation: El manual describe que la Sección A cubre los diferentes tipos de licencias,
    qué documentos se necesitan para solicitarlas, información para solicitantes menores
    de 18 años y descripciones de los exámenes requeridos.
- id: 849
  category: signs_and_signals
  question: ¿Qué sección del manual integral cubre las señales de tráfico, los semáforos
    y las reglas de la carretera?
  choices:
    A: Sección A
    B: Sección B
    C: Sección C
    D: El Apéndice
  answer: B
  explanation: El índice del manual indica que la Sección B contiene Buenas Prácticas
    de Conducción, Reglas de la Carretera, Señales de Tráfico y Semáforos, y Leyes
    de Conducción Estatales y Sanciones.
- id: 850
  category: sharing_the_road
  question: ¿En qué parte del manual puede encontrar información sobre cómo compartir
    la carretera de manera segura y ayudar a los adolescentes a aprender a conducir?
  choices:
    A: Sección A
    B: Sección B
    C: Sección C
    D: El Glosario
  answer: C
  explanation: La Sección C del manual cubre Consejos de Seguridad, Conducción Defensiva,
    Compartir la Carretera de Manera Segura y Ayudar a los Adolescentes y Nuevos Conductores
    a Aprender a Conducir.
- id: 851
  category: driver_testing
  question: 'Al ayudar a un principiante que no habla inglés a aprender a conducir,
    los mentores deben ponerse en el papel de un examinador y dejar que el conductor
    practique:'
  choices:
    A: Seguir instrucciones sencillas en inglés
    B: Traducir todo el manual del conductor
    C: Conducir sin ninguna comunicación verbal
    D: Memorizar la ruta del examinador
  answer: A
  explanation: 'El manual aconseja a los mentores "ponerse en el papel de un examinador
    y dejar que el conductor practique siguiendo instrucciones sencillas en inglés
    (por ejemplo: ''Turn left'' [Gire a la izquierda]; ''Slow down'' [Reduzca la velocidad])".'
- id: 852
  category: license_system
  question: ¿Cuándo suelen tener los Centros de Servicios al Conductor (Driver Service
    Centers) un mayor volumen de clientes?
  choices:
    A: Temprano en la mañana los martes
    B: Cuando vuelven a abrir después de haber estado cerrados por un día festivo
    C: Durante la última semana del mes
    D: Cuando está lloviendo
  answer: B
  explanation: 'El manual señala: "Nuestros Centros de Servicios al Conductor suelen
    tener un mayor volumen de clientes cuando volvemos a abrir después de haber estado
    cerrados por un día festivo, así que planifique su visita en consecuencia".'
- id: 853
  category: license_system
  question: ¿Cómo puede verificar su elegibilidad para renovar su licencia de conducir
    de Tennessee en línea?
  choices:
    A: Visitando www.tn.gov/safety
    B: Enviando una carta por correo al examinador
    C: Realizando una nueva prueba de manejo
    D: Visitando una estación de policía local
  answer: A
  explanation: 'El manual establece: "También puede considerar el uso de nuestro sitio
    web en: www.tn.gov/safety para verificar su elegibilidad para renovar en línea".'
- id: 854
  category: safe_driving_rules
  question: 'Según el manual, la conducción segura es en gran medida una cuestión
    de:'
  choices:
    A: Tener las características de seguridad vehicular más nuevas
    B: Ver lo que hay que ver y tomar buenas decisiones
    C: Memorizar todas las carreteras estatales
    D: Conducir solo en áreas familiares
  answer: B
  explanation: El texto explica que "la conducción segura es en gran medida una cuestión
    de ver lo que hay que ver y tomar buenas decisiones, pero esto no es sencillo
    de lograr".
- id: 855
  category: driver_responsibility
  question: 'Al crear un acuerdo o "contrato" de conducción con un adolescente, los
    padres:'
  choices:
    A: Deben presentar una copia notariada al Centro de Servicios al Conductor
    B: Deben hacer que lo firme un instructor de manejo
    C: Pueden elegir si desean tenerlo por escrito y firmado o simplemente discutirlo
      en familia
    D: Están obligados por ley a mantenerlo en el vehículo en todo momento
  answer: C
  explanation: 'El manual establece: "Depende de usted si desea tener este ''contrato''
    por escrito y firmado, o simplemente discutirlo en familia...".'
- id: 856
  category: driver_responsibility
  question: 'Si bien un examinador de licencias de conducir puede evaluar la competencia
    de un conductor, la responsabilidad de la educación y de enseñar a un hijo a conducir
    recae en:'
  choices:
    A: El Departamento de Seguridad
    B: El profesor de educación vial de la escuela secundaria
    C: Los padres o el mentor interesado
    D: La legislatura estatal
  answer: C
  explanation: El manual enfatiza que "el examinador de licencias de conducir puede
    evaluar la competencia de un conductor, pero la responsabilidad de la educación
    y de enseñar a ese hijo a conducir recae en los padres o en el mentor interesado".
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 857
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal de CEDA EL PASO (YIELD) triangular roja y blanca significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 858
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal de SENTIDO CONTRARIO (WRONG WAY) roja y blanca significa
    que está viajando contra el tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 859
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UNA VÍA (ONE WAY) en blanco y negro con una flecha indica
    que el tráfico en esta calle se mueve en una sola dirección: la dirección que
    señala la flecha.'
  id: 860
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 861
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 862
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Girar a la derecha solamente
    C: Mantenerse a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de MANTÉNGASE A LA DERECHA (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 863
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 864
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 865
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color verde-amarillo fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 866
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X de cruce de ferrocarril se coloca en
    los pasos a nivel. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 867
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 868
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 869
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 870
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que debe prepararse?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otra carretera
    C: El inicio de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación advierte que
    el tráfico de otra carretera se incorporará a su carril. Esté preparado para ajustar
    su velocidad y posición.
  id: 871
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en sentidos
    opuestos. Manténgase a la derecha.
  id: 872
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto más adelante. Comience
    a reducir la velocidad y prepárese para detenerse por completo en la señal de
    alto.
  id: 873
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿Quién tiene permitido estacionarse en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que muestren un cartel o placa de discapacidad válida
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    válido pueden estacionarse en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 874
