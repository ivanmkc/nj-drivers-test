  category: license_system
  question: Si su trabajo principal es conducir un taxi o un servicio de transporte
    (shuttle) usando un vehículo de pasajeros regular, ¿qué endoso debe agregarse
    a su licencia de Clase D?
  choices:
    A: Endoso P (Pasajeros)
    B: Endoso S (Autobús escolar)
    C: Endoso F (Transporte por contrato / For-Hire)
    D: Endoso H (Materiales peligrosos)
  answer: C
  explanation: Si el trabajo principal de una persona es conducir o transportar personas
    en un vehículo de Clase D (como los conductores de taxis o servicios de transporte),
    se debe agregar un endoso de Transporte por contrato (F - For Hire) a la licencia
    de Clase D.
- id: 95
  category: license_system
  question: ¿Cuál es la edad mínima requerida para calificar para una licencia de
    conducir estándar de Clase D en Tennessee?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: C
  explanation: Para calificar para una licencia de Clase D, debe tener al menos 16
    años de edad y debe aprobar un examen de la vista, un examen de conocimientos
    y un examen de manejo.
- id: 96
  category: license_system
  question: ¿Qué tipo de vehículos se operan con una licencia de Clase M?
  choices:
    A: Autocaravanas (motor-homes) y vehículos recreativos (RVs)
    B: Motocicletas y bicicletas motorizadas
    C: Camiones comerciales de servicio mediano
    D: Vehículos de transmisión manual
  answer: B
  explanation: La tabla de Clases de Licencias especifica que se requiere una licencia
    de Clase M para operar motocicletas y bicicletas motorizadas.
- id: 97
  category: license_system
  question: ¿Qué representa el endoso especial "X" en una licencia comercial?
  choices:
    A: Remolques dobles/triples
    B: Autobús escolar
    C: Tanques y Materiales Peligrosos
    D: Diseñado para 16 o más pasajeros
  answer: C
  explanation: Según la tabla de Endosos, el endoso "X" significa Tanques y Materiales
    Peligrosos (Haz Mat).
- id: 98
  category: license_system
  question: 'Una persona que se muda a Tennessee con una licencia de otro estado debe
    solicitar una licencia de Tennessee si:'
  choices:
    A: Está de visita por unas vacaciones de dos semanas
    B: Está trabajando en Tennessee
    C: Está conduciendo un auto de alquiler
    D: Ha conducido a través del estado más de tres veces
  answer: B
  explanation: Una persona que se muda a Tennessee debe solicitar una licencia de
    conducir de Tennessee si vive en el estado por más de 30 días, está trabajando
    en Tennessee o calificaría de otro modo como votante registrado de Tennessee.
- id: 99
  category: license_system
  question: 'No puede operar un vehículo de menos de 26,000 libras con una licencia
    estándar de Clase D si el vehículo:'
  choices:
    A: Se utiliza para transportar a 16 o más pasajeros, incluido el conductor
    B: Es una camioneta (pick-up) utilizada para agricultura personal
    C: Es una camioneta de pasajeros que transporta a 12 personas
    D: Está remolcando un remolque utilitario pequeño
  answer: A
  explanation: Los vehículos de menos de 26,000 libras no pueden ser operados con
    una licencia de Clase D si el vehículo transporta a 16 o más pasajeros (incluido
    el conductor), transporta materiales peligrosos o se utiliza como autobús escolar.
- id: 100
  category: license_system
  question: ¿Qué clase de licencia se requiere para vehículos comerciales combinados
    con una Clasificación de Peso Bruto Combinado (GCWR) de más de 26,000 libras y
    un vehículo remolcado de más de 10,000 libras?
  choices:
    A: Clase A
    B: Clase B
    C: Clase C
    D: Clase D
  answer: A
  explanation: Se requiere una licencia de Clase A para vehículos combinados con un
    GCWR de más de 26,000 libras y vehículo(s) remolcado(s) de más de 10,000 libras
    utilizados con fines comerciales.
- id: 101
  category: driver_testing
  question: Además de tener al menos 16 años, ¿qué exámenes debe aprobar un solicitante
    para calificar para una licencia de Clase D?
  choices:
    A: Solo un examen de manejo
    B: Un examen de la vista, un examen de conocimientos y un examen de manejo
    C: Un examen físico y un examen de manejo
    D: Una verificación de antecedentes y un examen de conocimientos
  answer: B
  explanation: Para calificar para una licencia de Clase D, debe tener al menos 16
    años de edad y debe aprobar un examen de la vista, un examen de conocimientos
    y un examen de manejo.
- id: 102
  category: license_system
  question: ¿Qué endoso se requiere para operar un vehículo comercial con remolques
    dobles o triples?
  choices:
    A: Endoso N
    B: Endoso H
    C: Endoso T
    D: Endoso P
  answer: C
  explanation: La tabla de endosos enumera la "T" como el endoso requerido para remolques
    dobles/triples.
- id: 103
  category: license_system
  question: 'Una licencia comercial de Clase B le permite operar camiones o autobuses
    de más de 26,000 libras de peso bruto vehicular (GVWR), siempre que cualquier
    vehículo remolcado:'
  choices:
    A: No exceda las 10,000 libras de GVWR
    B: Supere las 10,000 libras de GVWR
    C: Tenga carteles de materiales peligrosos
    D: Sea un remolque doble o triple
  answer: A
  explanation: Una licencia de Clase B es para camiones o autobuses de más de 26,000
    libras de GVWR utilizados con fines comerciales, y cualquier vehículo de este
    tipo que remolque a un vehículo que no exceda las 10,000 libras de GVWR.
- id: 104
  category: license_system
  question: ¿Cuál de las siguientes profesiones generalmente requiere un endoso de
    vehículo de alquiler (For-Hire) en una licencia de Clase D?
  choices:
    A: Plomero
    B: Lector de medidores
    C: Conductor de taxi
    D: Ingeniero
  answer: C
  explanation: Ejemplos de personas cuyo trabajo requiere que tengan el endoso de
    vehículo de alquiler (For-Hire) incluyen conductores de taxi, conductores de servicios
    de transporte (shuttle) y mensajeros. Los plomeros, lectores de medidores e ingenieros
    generalmente no necesitan este endoso.
- id: 105
  category: license_system
  question: Para agregar un endoso de vehículo de alquiler (For-Hire) a una licencia
    de Clase D, un solicitante generalmente debe tener al menos 18 años y ¿cuánta
    experiencia de manejo sin restricciones?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: 5 años
  answer: C
  explanation: Los solicitantes son elegibles para solicitar el endoso de vehículo
    de alquiler (For-Hire) si tienen 2 años de experiencia de manejo sin restricciones.
- id: 106
  category: license_system
  question: 'Se requiere una licencia limitada de Clase M para motocicletas o ciclos
    motorizados con una cilindrada:'
  choices:
    A: Mayor a 125 centímetros cúbicos
    B: Menor a 125 centímetros cúbicos
    C: Exactamente de 250 centímetros cúbicos
    D: Mayor a 500 centímetros cúbicos
  answer: B
  explanation: Generalmente, si el vehículo tiene más de 125 centímetros cúbicos,
    se necesita una licencia de Clase M; si el vehículo tiene menos de 125 centímetros
    cúbicos, se necesita una licencia limitada de Clase M.
- id: 107
  category: safe_driving_rules
  question: ¿Cómo pueden los vehículos todo terreno (ATV) cruzar legalmente una carretera
    o autopista interestatal de Tennessee?
  choices:
    A: Incorporándose al tráfico y saliendo en la siguiente rampa
    B: Cruzando en ángulos de noventa grados (90 grados)
    C: Cruzando en un ángulo de cuarenta y cinco grados (45 grados)
    D: A los ATV nunca se les permite cruzar ninguna vía bajo ninguna circunstancia
  answer: B
  explanation: Legalmente, los vehículos motorizados 'todoterreno' o vehículos todo
    terreno (ATV) solo pueden cruzar las vías en ángulos de noventa grados (90 grados)
    y no deben cruzar directamente ninguna calle/carretera/autopista interestatal.
- id: 108
  category: license_system
  question: 'Se requiere una Licencia de Conducir Comercial (CDL) para los operadores
    de vehículos o combinaciones de vehículos que pesen al menos:'
  choices:
    A: 10,001 libras
    B: 15,000 libras
    C: 20,001 libras
    D: 26,001 libras
  answer: D
  explanation: Los operadores de vehículos más grandes y complejos que pesen 26,001
    libras o más deberán solicitar una Licencia de Conducir Comercial (CDL).
- id: 109
  category: license_system
  question: 'Un conductor de un vehículo más pequeño debe obtener una Licencia de
    Conducir Comercial (CDL) si el vehículo se utiliza para transportar:'
  choices:
    A: 8 o más pasajeros
    B: 10 o más pasajeros
    C: 12 o más pasajeros
    D: 16 o más pasajeros, incluido el conductor
  answer: D
  explanation: Los vehículos más pequeños requieren una CDL si se utilizan para transportar
    materiales peligrosos; para transportar dieciséis (16) o más pasajeros, incluido
    el conductor, o si se utilizan como autobús escolar.
- id: 110
  category: driver_responsibility
  question: 'Un conductor con una licencia de Clase PD (Permiso de Aprendizaje) puede
    operar un automóvil solo cuando esté acompañado por un conductor con licencia
    que tenga al menos:'
  choices:
    A: 18 años
    B: 19 años
    C: 21 años
    D: 25 años
  answer: C
  explanation: Un conductor con una licencia de Clase PD puede operar un automóvil
    solo cuando esté acompañado por un conductor con licencia que tenga al menos 21
    años y esté sentado en el asiento junto al conductor.
- id: 111
  category: license_system
  question: Si es menor de 18 años, ¿cuánto tiempo debe tener una licencia Clase PD
    válida antes de cambiarla por una licencia Clase D?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Si es menor de 18 años, debe haber tenido una licencia Clase PD válida
    durante 180 días y cumplir con todos los requisitos de la ley de Licencia de Conducir
    Graduada (GDL).
- id: 112
  category: license_system
  question: ¿A qué edad se le puede emitir a un menor una licencia Clase H (Dificultad
    o "Hardship") en casos de dificultad familiar?
  choices:
    A: 13 años
    B: 14 años
    C: 15 años
    D: 16 años
  answer: B
  explanation: Una licencia por dificultad (Clase H) puede ser emitida a un menor
    de 14 años para operar un vehículo de pasajeros Clase D, una motocicleta Clase
    M, o ambos.
- id: 113
  category: license_system
  question: ¿Cuál de las siguientes es una restricción impuesta a una licencia Clase
    H (Dificultad)?
  choices:
    A: Es válida solo durante las horas de luz del día
    B: Permite al conductor transportar hasta 3 pasajeros
    C: Es válida para conducir fuera del estado
    D: Permite la operación de vehículos comerciales
  answer: A
  explanation: La licencia Clase H es válida solo durante las horas de luz del día
    y para viajar a lugares autorizados según se especifica en la carta de aprobación.
- id: 114
  category: license_system
  question: Independientemente de la edad en el momento de la aprobación, ¿cuándo
    vence una Licencia por Dificultad (Clase H)?
  choices:
    A: Cuando el solicitante cumple 15 años
    B: Cuando el solicitante cumple 16 años
    C: Cuando el solicitante cumple 18 años
    D: Cuando el solicitante se gradúa de la escuela secundaria
  answer: B
  explanation: Independientemente de la edad en el momento de la aprobación, una Licencia
    por Dificultad vencerá cuando el solicitante cumpla los 16 años.
- id: 115
  category: license_system
  question: ¿Quién es elegible para recibir una licencia de identificación permanente
    de forma gratuita y que no vence?
  choices:
    A: Cualquier persona mayor de 65 años
    B: Cualquier persona con discapacidad mental o física
    C: Cualquier persona menor de 18 años
    D: Cualquier persona que posea una licencia Clase D válida
  answer: B
  explanation: Una 'licencia de identificación permanente' puede ser obtenida por
    cualquier persona con discapacidad mental o física. Quienes califican para esta
    identificación pueden recibirla de forma gratuita y no tiene fecha de vencimiento.
- id: 116
  category: penalties_and_points
  question: ¿Cuál es la sanción por conducir mientras su licencia está revocada, cancelada
    o suspendida?
  choices:
    A: Una multa de hasta $500 y/o 30 días de cárcel
    B: Una multa de hasta $1,000 y/o seis meses de cárcel
    C: Una multa de hasta $2,500 y/o un año de cárcel
    D: Una multa de hasta $5,000 y revocación obligatoria de la licencia de por vida
  answer: B
  explanation: Conducir con una licencia revocada, cancelada o suspendida es un delito
    menor de clase B. La sanción es una multa de hasta mil dólares ($1,000) y/o seis
    meses de cárcel.
- id: 117
  category: license_system
  question: ¿Cuál es la tarifa requerida para agregar un endoso de Vehículo de Alquiler
    (For-Hire) a una licencia Clase D?
  choices:
    A: $2.50
    B: $4.50
    C: $10.00
    D: $15.50
  answer: B
  explanation: Para agregar el endoso de Vehículo de Alquiler (For-Hire), los conductores
    deben cumplir con los requisitos de elegibilidad, aprobar los exámenes correspondientes
    y pagar una tarifa de $4.50.
- id: 118
  category: license_system
  question: ¿A qué edad deja de vencer una 'Licencia de Identificación con Vencimiento'
    (Expiring Identification License)?
  choices:
    A: '21'
    B: '50'
    C: '60'
    D: '65'
  answer: D
  explanation: 'El primer tipo de identificación es una ''Licencia de Identificación
    con Vencimiento''... NOTA: A los 65 años o más, esta identificación ya no vence.'
- id: 119
  category: license_system
  question: ¿A cuál de las siguientes personas NO se le exige tener una licencia de
    conducir de Tennessee?
  choices:
    A: Un residente que conduce un camión comercial
    B: Un operador de un tractor agrícola que se mueve temporalmente por una carretera
    C: Un estudiante de secundaria que conduce solo a la escuela
    D: Un ciudadano no estadounidense que trabaja permanentemente en Tennessee
  answer: B
  explanation: El manual establece que a los operadores de cualquier maquinaria vial,
    tractor agrícola u otro equipo agrícola que se opere o mueva temporalmente en
    una carretera no se les exige tener una licencia de conducir de Tennessee.
- id: 120
  category: license_system
  question: ¿Quién de los siguientes NO es elegible para una licencia de conducir
    de Tennessee?
  choices:
    A: Un joven de 16 años que tiene un progreso satisfactorio en la escuela
    B: Una persona menor de 18 años que ha abandonado la escuela antes de graduarse
    C: Un no residente con una licencia válida de otro estado
    D: Un veterano dado de baja con honores
  answer: B
  explanation: El manual establece que cualquier persona menor de 18 años que haya
    abandonado la escuela antes de graduarse, o que no tenga un 'progreso satisfactorio'
    en la escuela, no es elegible para una licencia.
- id: 121
  category: penalties_and_points
  question: Si lo sorprenden conduciendo sin su licencia de conducir en su posesión,
    ¿cuál es la multa potencial?
  choices:
    A: No menos de $2.00 y no más de $50.00
    B: No menos de $50.00 y no más de $100.00
    C: Exactamente $500.00
    D: Hasta $1,000.00
  answer: A
  explanation: Conducir sin su licencia en su posesión es un delito menor de Clase
    D, y puede ser multado con no menos de dos dólares ($2.00) y no más de cincuenta
    dólares ($50.00).
- id: 122
  category: license_system
  question: ¿Qué letra precede a los tipos de clase para una Licencia de Conducir
    Temporal (TDL)?
  choices:
    A: T
    B: N
    C: X
    D: F
  answer: C
  explanation: El manual establece que los tipos de clase de la TDL estarán precedidos
    por la letra 'X' (por ejemplo, XD, XM, XPD).
- id: 123
  category: license_system
  question: ¿Cuál es el tiempo máximo por el que se puede emitir una Licencia de Identificación
    Temporal (TID)?
  choices:
    A: 1 año
    B: 3 años
    C: 5 años
    D: 8 años
  answer: C
  explanation: Según el manual, el tiempo máximo por el que se puede emitir una Licencia
    de Identificación Temporal (TID) es de 5 años.
- id: 124
  category: driver_responsibility
  question: ¿A qué edad puede un menor que posee una licencia de conducir, permiso
    o identificación estatal elegir registrarse como donante de órganos en Tennessee?
  choices:
    A: Entre 10 y 12 años
    B: Entre 13 y 17 años
    C: Solo a los 16 años
    D: Los menores no pueden registrarse como donantes de órganos
  answer: B
  explanation: El manual establece que los menores que tienen entre 13 y 17 años de
    edad, y que tienen una licencia de conducir, permiso o identificación estatal,
    pueden elegir registrarse como donantes.
- id: 125
  category: driver_responsibility
  question: Según el registro de Donate Life Tennessee, ¿cuántas vidas puede salvar
    un donante de órganos?
  choices:
    A: Hasta 2 vidas
    B: Hasta 4 vidas
    C: Hasta 8 vidas
    D: Más de 20 vidas
  answer: C
  explanation: 'El manual establece: ''Un donante de órganos puede salvar hasta 8
    vidas y un donante de tejidos puede mejorar la vida de 75 o más personas''.'
- id: 126
  category: license_system
  question: ¿Qué símbolo se imprime en su licencia de conducir o identificación de
    Tennessee para indicar que es un donante de órganos registrado?
  choices:
    A: Un lazo verde
    B: Un corazón rojo
    C: Una estrella azul
    D: Una cruz médica
  answer: B
  explanation: El manual señala que se imprimirá un corazón rojo en su licencia o
    identificación para reflejar su decisión de ser donante de órganos y tejidos.
- id: 127
  category: license_system
  question: ¿Qué documento se puede utilizar para demostrar la elegibilidad para que
    aparezca la palabra 'Veterano' (Veteran) en su licencia de conducir de Tennessee?
  choices:
    A: Un certificado de nacimiento estándar
    B: Un pasaporte estadounidense válido
    C: Formulario DD-214 del Departamento de Defensa
    D: Una tarjeta de registro de votante
  answer: C
  explanation: Para que aparezca 'Veterano' (Veteran) en su licencia, debe presentar
    una copia certificada de su Formulario DD-214 del Departamento de Defensa, el
    certificado de baja honorable NAVPERS-660 o su tarjeta de identificación DD Form
    2 (Retirado).
- id: 128
  category: driver_responsibility
  question: ¿A quién debe contactar si no recibe su Tarjeta de Registro de Votante
    dentro de los 30 días posteriores a su solicitud en el Centro de Servicios al
    Conductor?
  choices:
    A: El Departamento de Seguridad
    B: La Comisión Federal de Elecciones
    C: La Comisión de Elecciones de su condado local
    D: El Centro de Servicios al Conductor donde presentó la solicitud
  answer: C
  explanation: El manual aconseja que si no ha recibido su Tarjeta de Registro de
    Votante dentro de los 30 días posteriores a su solicitud en el Centro de Servicios
    de Licencias de Conducir, debe comunicarse con la Comisión de Elecciones de su
    condado local de inmediato.
- id: 129
  category: license_system
  question: ¿Es válido un Permiso Internacional de Conducir (IDP) emitido a un ciudadano
    estadounidense para conducir dentro de los Estados Unidos?
  choices:
    A: Sí, pero solo por 6 meses
    B: Sí, si va acompañado de un pasaporte
    C: No, no es válido para conducir en los Estados Unidos ni en sus territorios
    D: No, a menos que el conductor esté operando un vehículo comercial
  answer: C
  explanation: El manual establece explícitamente que el IDP NO es válido para conducir
    en los Estados Unidos ni en sus territorios.
- id: 130
  category: license_system
  question: ¿Por cuánto tiempo es válido un Permiso Internacional de Conducir (IDP)
    a partir de la fecha de emisión?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: B
  explanation: El manual establece que el IDP es válido por solo un (1) año a partir
    de la fecha de emisión.
- id: 131
  category: license_system
  question: ¿Cuánto tiempo puede un ciudadano no estadounidense empleado en un puesto
    directivo o técnico en Tennessee conducir con una licencia válida de otro país
    antes de que se le exija solicitar una licencia de Tennessee?
  choices:
    A: 30 días
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Los ciudadanos no estadounidenses en puestos directivos o técnicos
    pueden operar vehículos con una licencia de conducir válida emitida por otro estado
    o país por un período de 6 meses, después del cual deben solicitar una licencia
    de Tennessee.
- id: 132
  category: license_system
  question: ¿Cuál de las siguientes condiciones hace que una persona no sea elegible
    para obtener una licencia de conducir de Tennessee?
  choices:
    A: No mostrar el comprobante requerido de seguro de automóvil o responsabilidad
      financiera
    B: Ser un ciudadano no estadounidense con presencia legal temporal
    C: Ser un veterano con baja honorable
    D: Inscribirse en un curso de capacitación para conductores aprobado
  answer: A
  explanation: El manual enumera a 'Cualquier persona a la que se le exija mostrar
    comprobante de seguro de automóvil/responsabilidad financiera y no lo haya hecho'
    en la sección '¿QUIÉN NO ES ELEGIBLE?'.
- id: 133
  category: license_system
  question: ¿Qué edad debe tener un ciudadano estadounidense para obtener un Permiso
    Internacional de Conducir (IDP)?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: 25 años de edad
  answer: B
  explanation: Para obtener un Permiso Internacional de Conducir, un ciudadano estadounidense
    debe tener al menos dieciocho (18) años de edad.
- id: 134
  category: license_system
  question: ¿Dónde puede un residente de Tennessee obtener un Permiso Internacional
    de Conducir (IDP)?
  choices:
    A: En cualquier Centro de Servicios para Conductores de Tennessee
    B: En la sede del Departamento de Seguridad
    C: En una oficina local de la Asociación Automovilística Estadounidense (AAA)
    D: En una oficina de pasaportes de EE. UU.
  answer: C
  explanation: Cualquier residente de Tennessee interesado en obtener un IDP debe
    comunicarse con una oficina local de la Asociación Automovilística Estadounidense
    (AAA). Los Centros de Servicios para Conductores de Tennessee NO los emiten.
- id: 135
  category: driver_responsibility
  question: 'Si usted es un delincuente sexual registrado que solicita o renueva una
    licencia de conducir, debe:'
  choices:
    A: Informar al Examinador de Licencias de Conducir del Departamento de Seguridad
    B: Solicitarla únicamente por correo
    C: Entregar la licencia de su estado anterior a la policía local
    D: Pagar un recargo especial para delincuentes
  answer: A
  explanation: Si usted es un delincuente sexual registrado, es su responsabilidad
    informar al Examinador de Licencias de Conducir del Departamento de Seguridad
    que está obligado a registrarse como delincuente sexual.
- id: 136
  category: license_system
  question: Al presentar documentos para probar su identidad para una licencia de
    conducir, ¿cuál de los siguientes es aceptable?
  choices:
    A: Fotocopias claras
    B: Faxes notariados
    C: Documentos originales o certificados
    D: Fotos digitales en su teléfono inteligente
  answer: C
  explanation: Todos los documentos deben ser originales o certificados. No se aceptarán
    faxes ni fotocopias.
- id: 137
  category: license_system
  question: ¿Cuántos comprobantes de residencia en Tennessee se requieren al solicitar
    una licencia de conducir?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: Los solicitantes deben proporcionar dos comprobantes de residencia
    en Tennessee con su nombre y dirección de residencia.
- id: 138
  category: license_system
  question: 'Los comprobantes de residencia en Tennessee deben estar actualizados.
    Según el manual, ''actualizado'' significa que tiene fecha dentro de los últimos:'
  choices:
    A: 30 días
    B: 60 días
    C: 4 meses
    D: 6 meses
  answer: C
  explanation: El manual especifica que los comprobantes aceptables de residencia
    en Tennessee deben estar actualizados, lo que significa que deben ser de los últimos
    4 meses.
- id: 139
  category: license_system
  question: 'Si es menor de 18 años, su comprobante de asistencia escolar debe estar
    firmado y fechado dentro de los últimos:'
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 90 días
  answer: C
  explanation: El comprobante de asistencia/progreso escolar para los solicitantes
    menores de 18 años debe estar firmado y fechado dentro de los últimos 30 días.
- id: 140
  category: driver_testing
  question: ¿De cuántas horas de experiencia de conducción al volante deben proporcionar
    certificación los solicitantes menores de 18 años?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: Los solicitantes menores de 18 años necesitan una certificación de
    50 horas de experiencia de conducción al volante después de tener un permiso de
    aprendizaje durante seis meses.
- id: 141
  category: license_system
  question: Al solicitar una Licencia de Conducir Comercial (CDL), ¿cuál de las siguientes
    afirmaciones es verdadera con respecto a su Número de Seguro Social (SSN)?
  choices:
    A: Puede usar una Declaración Jurada de SSN si no tiene un SSN.
    B: No se requiere un SSN para una licencia comercial.
    C: NO se permite la Declaración Jurada de SSN; las regulaciones federales exigen
      que los titulares de una CDL tengan un SSN.
    D: En su lugar, puede proporcionar un Número de Identificación Personal del Contribuyente
      (ITIN).
  answer: C
  explanation: Las regulaciones federales exigen que los titulares de una CDL tengan
    un SSN. NO se permite la Declaración Jurada de SSN al solicitar una licencia comercial.
- id: 142
  category: license_system
  question: 'Si se ha mudado desde otro estado, su licencia de conducir válida de
    otro estado puede usarse para probar su:'
  choices:
    A: Ciudadanía estadounidense
    B: Estatus de Residente Permanente Legal
    C: Identidad
    D: Residencia en Tennessee
  answer: C
  explanation: Su licencia de conducir válida de su estado anterior puede usarse para
    probar su identidad, pero no puede usarse para probar la Ciudadanía estadounidense
    o el estatus de Residente Permanente Legal.
- id: 143
  category: license_system
  question: 'Si su nombre actual es diferente al que aparece en sus documentos de
    identidad, usted debe:'
  choices:
    A: Enviar por correo una fotocopia de su certificado de matrimonio
    B: Proporcionar documentos legales originales o certificados que establezcan el
      cambio de nombre
    C: Esperar hasta que su licencia actual expire para cambiarlo
    D: Traer una carta notariada de un familiar
  answer: B
  explanation: Cada documento de respaldo para establecer un cambio de nombre debe
    ser un documento legal original o certificado. Los cambios de nombre no pueden
    aceptarse por correo.
- id: 144
  category: license_system
  question: 'Si un solicitante solo tiene un estatus de presencia legal ''temporal''
    en los EE. UU., puede ser elegible para una:'
  choices:
    A: Licencia de Conducir Comercial Permanente
    B: Licencia de Conducir Temporal (TDL) o Licencia de Identificación Temporal (TID)
    C: Licencia de Conducir Estándar Clase D
    D: Permiso Internacional de Conducir
  answer: B
  explanation: Si un solicitante solo tiene un estatus de presencia legal temporal,
    NO será elegible para una licencia de conducir estándar, pero puede ser elegible
    para una Licencia de Conducir Temporal (TDL) o una Licencia de Identificación
    Temporal (TID).
- id: 145
  category: license_system
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de un Permiso Internacional de Conducir (IDP)?
  choices:
    A: Es válido por sí solo para conducir en los Estados Unidos.
    B: Debe llevarse junto con la Licencia de Conducir válida y regular de los EE.
      UU. del conductor.
    C: Reemplaza su licencia de conducir emitida por el estado cuando viaja fuera
      del estado.
    D: Permite a los visitantes extranjeros ignorar las leyes de tránsito de los EE.
      UU.
  answer: B
  explanation: El IDP DEBE llevarse junto con la Licencia de Conducir válida y regular
    de los EE. UU. del conductor. NO es válido para conducir en los EE. UU. y NO es
    válido por sí solo para conducir.
- id: 146
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para probar la Ciudadanía
    estadounidense o el estatus de Residente Permanente Legal?
  choices:
    A: Una licencia de conducir válida de otro estado
    B: Una factura de servicios públicos de los últimos 4 meses
    C: Un Pasaporte estadounidense válido
    D: Una tarjeta de registro de votante
  answer: C
  explanation: La Tabla 2.1 enumera los documentos aceptables que prueban que un solicitante
    es ciudadano estadounidense o residente permanente legal, lo cual incluye un Pasaporte
    estadounidense válido.
- id: 147
  category: license_system
  question: ¿Cuál de las siguientes NO es una forma aceptable de identificación principal
    al solicitar una licencia de conducir?
  choices:
    A: Certificado de Nacimiento Certificado
    B: Pasaporte Válido
    C: Certificado de Nacimiento Emitido por un Hospital
    D: Identificación Militar
  answer: C
  explanation: El manual establece explícitamente que 'LOS CERTIFICADOS EMITIDOS POR
    HOSPITALES Y LOS CERTIFICADOS DE BAUTISMO NO SON ACEPTABLES' como identificación
    principal.
- id: 148
  category: license_system
  question: Si un solicitante presenta un certificado de nacimiento extranjero que
    no está emitido en inglés, ¿qué más debe proporcionar?
  choices:
    A: Una carta notariada de la embajada
    B: Un Certificado de Traducción Exacta
    C: Un Permiso Internacional de Conducir
    D: Un Pasaporte estadounidense válido
  answer: B
  explanation: Los certificados de nacimiento extranjeros, que no estén emitidos en
    inglés, deben ser traducidos y acompañados por un Certificado de Traducción Exacta.
- id: 149
  category: license_system
  question: ¿Cuántos documentos de prueba de identidad se requieren para un solicitante
    ORIGINAL que solicita una licencia de conducir?
  choices:
    A: Un documento de la lista Principal
    B: Dos documentos de la lista Secundaria
    C: Al menos un documento de la lista Principal y un segundo documento de cualquiera
      de las dos listas
    D: Tres documentos de la lista Principal
  answer: C
  explanation: Los solicitantes ORIGINALES deben tener al menos un documento de la
    lista de Identificación Principal. El segundo documento puede ser de la lista
    de Identificación Secundaria u otro documento de la lista de Identificación Principal.
- id: 150
  category: license_system
  question: ¿Qué debe hacer un nuevo residente si ha perdido su licencia de otro estado?
  choices:
    A: Proporcionar tres documentos de la lista de Identificación Secundaria
    B: Proporcionar los mismos dos documentos de prueba requeridos para un solicitante
      ORIGINAL
    C: Regresar a su estado anterior para obtener un reemplazo
    D: Esperar 30 días antes de solicitar una licencia de Tennessee
  answer: B
  explanation: Si la licencia del otro estado de un nuevo residente se ha perdido,
    el nuevo residente debe proporcionar los mismos dos (2) documentos de prueba,
    tal como se requiere para un solicitante ORIGINAL.
- id: 151
  category: license_system
  question: Al usar un certificado de matrimonio como prueba de cambio de nombre,
    ¿cuál de las siguientes afirmaciones es verdadera?
  choices:
    A: Debe ser la 'licencia' que autoriza la unión
    B: Debe estar registrado DESPUÉS del matrimonio
    C: Una fotocopia del certificado siempre es aceptable
    D: No necesita incluir la fecha de nacimiento del solicitante
  answer: B
  explanation: El certificado debe ser el original o una copia certificada que esté
    registrada DESPUÉS del matrimonio; NO solo la 'licencia' que autoriza la unión.
- id: 152
  category: license_system
  question: ¿Cuál de los siguientes se considera un documento de Identificación Secundaria
    aceptable?
  choices:
    A: Acta de nacimiento certificada
    B: Pasaporte válido
    C: Tarjeta de seguro médico
    D: Decreto de adopción
  answer: C
  explanation: Una tarjeta de seguro médico (como TennCare, Medicaid, Medicare, etc.)
    figura en la tabla de Identificación Secundaria.
- id: 153
  category: license_system
  question: ¿Cuántos documentos se requieren para demostrar la residencia en Tennessee?
  choices:
    A: Uno
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: La prueba de residencia requiere que los solicitantes proporcionen
    dos (2) documentos de la Tabla de Pruebas de Residencia Aceptables.
- id: 154
  category: license_system
  question: ¿Cuál de los siguientes NO es un documento aceptable para demostrar la
    residencia en Tennessee?
  choices:
    A: Una factura de servicios públicos actual con el sobre con matasellos
    B: Un recibo de depósito inicial para un servicio público
    C: Un estado de cuenta bancario actual
    D: Un registro de votante de Tennessee actual
  answer: B
  explanation: 'Al usar una factura de servicios públicos como prueba de residencia,
    el manual establece explícitamente: ''El recibo de depósito inicial NO es aceptable''.'
- id: 155
  category: license_system
  question: Si un solicitante usa una factura de servicios públicos como prueba de
    residencia en Tennessee, ¿qué debe incluirse con ella?
  choices:
    A: Una firma notariada
    B: El sobre con matasellos en el que se envió la factura
    C: Una copia del acta de nacimiento del solicitante
    D: Una carta de la compañía de servicios públicos
  answer: B
  explanation: Una factura de servicios públicos actual debe incluir el sobre con
    matasellos en el que se envió por correo.
- id: 156
  category: license_system
  question: ¿Se imprimirá su número de Seguro Social en su licencia de conducir de
    Tennessee?
  choices:
    A: Sí, es requerido por ley
    B: Sí, a menos que solicite lo contrario
    C: No, su número de seguro social no se imprimirá en su licencia
    D: Solo en las licencias de conducir comerciales
  answer: C
  explanation: 'El manual establece: ''Su número de seguro social no se imprimirá
    en su licencia''.'
- id: 157
  category: license_system
  question: ¿Qué tipo de tarjeta de Seguro Social es aceptable como prueba de identidad
    y número de Seguro Social?
  choices:
    A: Una réplica de metal
    B: Una réplica de plástico
    C: Una fotocopia del original
    D: Una tarjeta de Seguro Social original
  answer: D
  explanation: El manual especifica 'Una tarjeta de Seguro Social original' y señala
    bajo Identificación Secundaria 'solo original, no réplicas de metal o plástico'.
- id: 158
  category: license_system
  question: Si se utiliza una verificación de domicilio de residencia del empleador
    y este no tiene papel membretado de la empresa, ¿qué se requiere?
  choices:
    A: La firma debe estar notariada
    B: Dos firmas de diferentes gerentes
    C: Una copia de la licencia comercial del empleador
    D: No se puede usar bajo ninguna circunstancia
  answer: A
  explanation: 'El manual establece: ''Si el empleador no tiene papel membretado,
    la firma debe estar notariada''.'
- id: 159
  category: license_system
  question: ¿Qué se requiere si un solicitante proporciona una copia de un documento
    judicial de un decreto de divorcio como prueba de un cambio de nombre?
  choices:
    A: Un sello y firma copiados son aceptables
    B: Debe tener una firma/sello original adherido a la copia
    C: Los documentos judiciales no se pueden usar para cambios de nombre
    D: Debe ir acompañado de un acta de nacimiento
  answer: B
  explanation: 'El manual señala: ''Una copia de un documento judicial con una firma/sello
    original adherido a la copia es aceptable. Una copia de un documento judicial
    con un sello/firma copiado no es aceptable''.'
- id: 160
  category: license_system
  question: ¿A cuál de los siguientes solicitantes se le requiere proporcionar prueba
    de residencia en Tennessee?
  choices:
    A: Solo a los solicitantes ORIGINALES para una identificación por primera vez
    B: Solo a los solicitantes NUEVOS RESIDENTES
    C: A los solicitantes ORIGINALES, NUEVOS RESIDENTES y RESIDENTES QUE REGRESAN
    D: A los solicitantes de DUPLICADOS de una licencia de conducir (DL) de Tennessee
      existente
  answer: C
  explanation: El Examinador de Licencias de Conducir requerirá prueba de residencia
    en Tennessee para los solicitantes ORIGINALES, NUEVOS RESIDENTES y RESIDENTES
    QUE REGRESAN.
- id: 161
  category: license_system
  question: Si un solicitante es menor de edad y utiliza un documento de residencia
    a nombre de un padre o tutor legal, ¿qué más se requiere?
  choices:
    A: Una carta de la escuela del menor
    B: Prueba de parentesco
    C: Una declaración notariada de un vecino
    D: La tarjeta de Seguro Social del menor
  answer: B
  explanation: El manual establece que si el solicitante es menor de edad, se puede
    usar el nombre de un padre o tutor legal, pero '(se requerirá prueba de parentesco
    si se utiliza este tipo de prueba)'.
- id: 162
  category: license_system
  question: Si nunca se le ha emitido un Número de Seguro Social, ¿qué debe hacer
    para procesar su solicitud de licencia de conducir?
  choices:
    A: Proporcionar una carta de su empleador
    B: Solicitar en línea y marcar la casilla 'Sin SSN'
    C: Presentarse en persona y firmar una declaración jurada
    D: Traer un pasaporte y un certificado de nacimiento
  answer: C
  explanation: Los solicitantes a los que nunca se les ha emitido un número de Seguro
    Social deben presentarse en persona y firmar una declaración jurada a tal efecto
    en presencia de un Examinador de Licencias de Conducir o un Notario Público.
- id: 163
  category: license_system
  question: A partir del 1 de enero de 2016, ¿con qué frecuencia vencen las licencias
    de conducir de Tennessee para personas mayores de 21 años?
  choices:
    A: Cada 4 años en su cumpleaños
    B: Cada 5 años a partir de la fecha de emisión
    C: Cada 8 años a partir de la fecha de emisión
    D: Cada 10 años en su cumpleaños
  answer: C
  explanation: A partir del 1 de enero de 2016, las licencias de Tennessee para personas
    mayores de 21 años vencen cada ocho años a partir de la fecha de emisión.
- id: 164
  category: license_system
  question: ¿Cuál de los siguientes NO es un método de pago aceptado en los Centros
    de Servicios al Conductor de Tennessee?
  choices:
    A: Efectivo
    B: Tarjetas de crédito American Express
    C: MasterCard
    D: Giro postal
  answer: B
  explanation: Los métodos de pago aceptados en los Centros de Servicios al Conductor
    son efectivo, cheque, giro postal, y tarjetas de crédito MasterCard, Visa y Discover.
    American Express no está en la lista.
- id: 165
  category: license_system
  question: ¿Cuántos días tienen los nuevos residentes que poseen una licencia de
    conducir de otro estado para obtener una licencia de conducir de Tennessee después
    de establecer su residencia?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Los nuevos residentes o aquellos que regresan a Tennessee y poseen
    una licencia de conducir de otro estado, deben obtener una licencia de conducir
    de Tennessee a más tardar treinta (30) días después de establecer su residencia.
- id: 166
  category: driver_testing
  question: ¿Qué examen se requiere para TODOS los residentes nuevos o que regresan
    y que desean obtener una licencia de conducir de Tennessee?
  choices:
    A: Un examen de la vista
    B: Un examen práctico de manejo
    C: Un examen de conocimientos escrito
    D: Un examen médico físico
  answer: A
  explanation: Todos los residentes nuevos o que regresan deben realizar un examen
    de la vista de Tennessee en el Centro de Servicios al Conductor.
- id: 167
  category: driver_testing
  question: Si la licencia de otro estado de un nuevo residente ha estado vencida
    por más de seis meses, ¿qué exámenes debe tomar?
  choices:
    A: Solo un examen de la vista
    B: Examen de la vista y examen de conocimientos
    C: Examen de conocimientos y examen práctico de manejo
    D: Examen de conocimientos, examen práctico de manejo y examen de la vista
  answer: D
  explanation: Los residentes nuevos o que regresan cuya licencia de otro estado haya
    estado vencida por más de seis meses deben tomar el examen de conocimientos, el
    examen práctico de manejo y el examen de la vista de Tennessee.
- id: 168
  category: license_system
  question: Al solicitar una licencia, los nuevos residentes deben proporcionar dos
    pruebas de residencia en Tennessee. ¿Cuál de los siguientes es un requisito para
    estos documentos?
  choices:
    A: Deben ser fotocopias
    B: Deben tener fecha dentro de los últimos 4 meses
    C: Deben usar una dirección de apartado postal (P.O. Box)
    D: Deben tener fecha dentro de los últimos 12 meses
  answer: B
  explanation: Los solicitantes deben proporcionar dos pruebas de residencia en Tennessee
    con su nombre y dirección residencial (NO SE ACEPTAN APARTADOS POSTALES / P.O.
    BOXES), y los documentos deben estar vigentes y tener fecha dentro de los últimos
    4 meses.
- id: 169
  category: license_system
  question: ¿Bajo qué condición una licencia de conducir válida de Tennessee permanece
    válida indefinidamente para una persona en las Fuerzas Armadas de los Estados
    Unidos?
  choices:
    A: Si es miembro de la Guardia Nacional
    B: Si está en servicio activo y tiene su base fuera del estado de Tennessee
    C: Si es familiar de personal militar
    D: Si está destinado en una base dentro de Tennessee
  answer: B
  explanation: La licencia permanece válida independientemente de la fecha de vencimiento
    mostrada, siempre y cuando la persona permanezca en servicio activo, tenga su
    base fuera del estado de Tennessee y la licencia no sea entregada, cancelada o
    suspendida.
- id: 170
  category: license_system
  question: Después de ser dado de baja de las Fuerzas Armadas o reasignado a una
    estación de servicio dentro de Tennessee, ¿cuántos días tiene una persona para
    renovar su licencia de conducir?
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 120 días
  answer: B
  explanation: Una vez que la persona ha sido dada de baja o separada de dichos servicios,
    o ha sido reasignada a una estación de servicio dentro del estado, debe renovar
    su licencia dentro de los sesenta (60) días posteriores a la fecha de separación.
- id: 171
  category: license_system
  question: Si se pierde o le roban una Licencia de Conducir Temporal (TDL), ¿cómo
    puede ser reemplazada?
  choices:
    A: Solicitándola en línea a través del sitio web del estado
    B: Enviando una solicitud por correo al Departamento de Seguridad
    C: Solicitándola en persona en un centro de servicios de licencias de conducir
    D: Llamando a la línea gratuita de reemplazo
  answer: C
  explanation: Las Licencias de Conducir Temporales y las Licencias de Identificación
    Temporales no pueden ser reemplazadas en línea. Si debe solicitarla en persona,
    necesitará presentar una identificación adecuada.
- id: 172
  category: license_system
  question: Si se le emitió una licencia de conducir de Tennessee después del 1 de
    enero de 2001, ¿qué debe hacer en el momento de su PRIMERA renovación?
  choices:
    A: Renovar en línea para verificar su identidad
    B: Proporcionar documentación que demuestre que es ciudadano estadounidense o
      residente permanente legal en un Centro de Servicios al Conductor
    C: Volver a tomar el examen de conocimientos escrito
    D: Enviar por correo una fotocopia de su certificado de nacimiento al Departamento
      de Seguridad
  answer: B
  explanation: La ley de Tennessee requiere que cualquier persona a la que se le haya
    emitido una licencia después del 1 de enero de 2001 proporcione documentación
    que demuestre que es ciudadano de los Estados Unidos o residente permanente legal
    en el momento de su primera renovación. No puede renovar por correo ni por internet
    y debe visitar un Centro de Servicios al Conductor.
- id: 173
  category: driver_testing
  question: ¿Qué se requiere de los nuevos residentes de otros países al solicitar
    una licencia de conducir de Tennessee?
  choices:
    A: Deben entregar su licencia extranjera
    B: Solo se les requiere tomar un examen de la vista
    C: Deben tomar un examen de la vista, un examen de conocimientos y una prueba
      de habilidades de manejo
    D: Deben esperar seis meses antes de solicitarla
  answer: C
  explanation: 'A los nuevos residentes de otros países se les requiere tomar las
    siguientes pruebas: examen de la vista, examen de conocimientos y prueba de habilidades
    de manejo. Se les permitirá conservar la licencia emitida por ese país.'
- id: 174
  category: license_system
  question: ¿Cuál es la regla con respecto a la condición física de los documentos
    presentados como prueba de identidad y residencia?
  choices:
    A: Se prefieren fotocopias de alta calidad
    B: Los artículos deben ser documentos originales; no se aceptarán fotocopias
    C: Las copias digitales en un teléfono inteligente son aceptables
    D: Se requieren fotocopias notariadas para todas las pruebas secundarias
  answer: B
  explanation: 'El manual establece explícitamente: ''Los artículos deben ser documentos
    originales. ¡No se aceptarán fotocopias!'''
- id: 175
  category: penalties_and_points
  question: ¿Cuál es el cargo por pago atrasado si su licencia de conducir ha estado
    vencida por más de treinta (30) días calendario pero menos de seis meses?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: $20.00
  answer: A
  explanation: Según el manual, si su licencia ha estado vencida por más de treinta
    (30) días calendario, habrá un cargo por pago atrasado de cinco dólares ($5.00).
    Después de seis meses, el cargo se duplica a $10.00.
- id: 176
  category: license_system
  question: Si deja pasar cinco (5) años sin renovar su licencia de conducir, ¿qué
    debe hacer para renovarla?
  choices:
    A: Pagar un cargo por pago atrasado de $50
    B: Aprobar el examen de la vista, de conocimientos y la prueba de habilidades
    C: Tomar un curso de educación vial aprobado
    D: Esperar 180 días antes de solicitar una nueva licencia
  answer: B
  explanation: Si deja pasar cinco (5) años sin renovar, no solo tendrá que pagar
    el cargo por pago atrasado de $10.00, sino que también tendrá que aprobar el examen
    de la vista, de conocimientos y la prueba de habilidades.
- id: 177
  category: driver_responsibility
  question: Por ley estatal, ¿cuántos días tiene para notificar al Departamento de
    Seguridad si cambia su dirección de residencia?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si cambia su dirección de residencia, la ley estatal le exige notificar
    al Departamento de Seguridad dentro de los diez (10) días posteriores a este cambio.
- id: 178
  category: license_system
  question: Al proporcionar su nueva dirección al Departamento de Seguridad, ¿cuál
    de las siguientes opciones NO se acepta por sí sola como dirección residencial?
  choices:
    A: Un número de casa y calle
    B: Un número de apartamento y calle
    C: Un apartado postal (P.O. Box)
    D: Un número de autopista y ciudad
  answer: C
  explanation: Por ley, su licencia debe mostrar su dirección residencial legal. Un
    apartado postal por sí solo no será aceptado como dirección residencial.
- id: 179
  category: license_system
  question: ¿Quién está exento de participar en el Programa de Licencia de Conducir
    Graduada (GDL)?
  choices:
    A: Cualquier persona que tenga 16 años y tenga un trabajo
    B: Personas menores de 18 años que se hayan graduado de la escuela secundaria
      o hayan recibido su GED
    C: Cualquier persona que haya tenido un permiso de otro estado durante 90 días
    D: Personas que tengan 17 años y hayan completado la educación vial
  answer: B
  explanation: La ley GDL no se aplica a ninguna persona de 18 años o más, ni a aquellas
    personas menores de 18 años que se hayan graduado de la escuela secundaria o hayan
    recibido un GED.
- id: 180
  category: license_system
  question: ¿Cuál es la edad mínima para obtener un Permiso de Aprendizaje en Tennessee?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 17 años
  answer: B
  explanation: Para obtener un Permiso de Aprendizaje, debe tener 15 años y aprobar
    los exámenes escritos estándar y el examen de la vista.
- id: 181
  category: safe_driving_rules
  question: ¿Entre qué horas se le prohíbe conducir a una persona que tiene un permiso
    de aprendizaje (Learner Permit)?
  choices:
    A: 8 P.M. y 6 A.M.
    B: 9 P.M. y 5 A.M.
    C: 10 P.M. y 6 A.M.
    D: 11 P.M. y 7 A.M.
  answer: C
  explanation: Los conductores que tienen un permiso de aprendizaje no pueden conducir
    entre las 10 P.M. y las 6 A.M.
- id: 182
  category: safe_driving_rules
  question: 'Al conducir con un permiso de aprendizaje, debe estar acompañado por
    un conductor con licencia que tenga al menos:'
  choices:
    A: 18 años de edad y viaje en el asiento delantero
    B: 21 años de edad y viaje en el asiento delantero
    C: 21 años de edad y viaje en cualquier parte del vehículo
    D: 25 años de edad y viaje en el asiento delantero
  answer: B
  explanation: Solo puede conducir un automóvil si está acompañado por un conductor
    con licencia de 21 años o más que viaje en el asiento delantero del vehículo.
- id: 183
  category: driver_testing
  question: Para obtener una licencia intermedia restringida (Intermediate Restricted
    License), ¿de cuántas horas de experiencia de manejo debe tener verificación?
  choices:
    A: 30 horas (5 de noche)
    B: 40 horas (10 de noche)
    C: 50 horas (10 de noche)
    D: 60 horas (15 de noche)
  answer: C
  explanation: Debe tener una verificación de un padre, tutor legal o instructor de
    manejo con licencia que indique que ha completado cincuenta horas (diez horas
    de noche) de experiencia de manejo.
- id: 184
  category: license_system
  question: 'Para solicitar la licencia intermedia sin restricciones (Intermediate
    Unrestricted License), debe tener al menos 17 años y haber tenido una licencia
    intermedia restringida durante:'
  choices:
    A: 90 días
    B: 180 días
    C: 1 año
    D: 2 años
  answer: C
  explanation: Para solicitar la licencia intermedia sin restricciones a partir de
    la licencia intermedia restringida, debe tener 17 años y haber tenido una licencia
    intermedia restringida durante 1 año.
- id: 185
  category: penalties_and_points
  question: ¿Cuál de las siguientes opciones le impedirá pasar de una licencia intermedia
    restringida a una licencia intermedia sin restricciones?
  choices:
    A: Tener 1 infracción por no usar el cinturón de seguridad
    B: Acumular 4 puntos en su historial de manejo
    C: Tener un accidente de tránsito que haya sido su culpa
    D: No tomar un examen escrito adicional
  answer: C
  explanation: Para pasar a la licencia intermedia sin restricciones, no puede haber
    tenido un accidente de tránsito que haya sido su culpa. (Tampoco puede tener 2
    infracciones por el cinturón de seguridad, ni más de 6 puntos, y no se requieren
    exámenes adicionales).
- id: 186
  category: license_system
  question: A partir del 1 de julio de 2018, ¿en qué formato se imprimen todas las
    licencias emitidas a personas menores de 21 años?
  choices:
    A: Formato horizontal
    B: Formato vertical
    C: Formato cuadrado
    D: Formato holográfico
  answer: B
  explanation: A partir del 1 de julio de 2018, todas las licencias emitidas a personas
    menores de 21 años tienen un formato vertical.
- id: 187
  category: driver_responsibility
  question: ¿Cuál es el período de gracia para conducir un vehículo después de que
    vence su licencia de conducir?
  choices:
    A: 10 días
    B: 30 días
    C: 6 meses
    D: No hay período de gracia
  answer: D
  explanation: No existen los 'períodos de gracia'. Cuando su licencia vence, ya no
    tiene derecho a conducir un vehículo o motocicleta.
- id: 188
  category: license_system
  question: Si tiene 15 años y un permiso válido de su estado anterior, ¿cómo puede
    contar el tiempo de ese permiso de otro estado para su requisito de 180 días en
    Tennessee?
  choices:
    A: Debe proporcionar un historial de manejo certificado de su estado anterior
      emitido dentro de los 30 días previos a la solicitud
    B: Debe tomar un nuevo examen práctico de manejo de inmediato
    C: Debe hacer que el gobernador de su estado anterior firme una exención
    D: El tiempo del permiso de otro estado no se puede contar bajo ninguna circunstancia
  answer: A
  explanation: El tiempo que tuvo el permiso en su estado anterior puede incluirse
    en el período de 180 días siempre que pueda proporcionar un historial de manejo
    certificado de su estado anterior emitido dentro de los treinta (30) días inmediatamente
    anteriores a la fecha de la solicitud en Tennessee.
- id: 189
  category: driver_responsibility
  question: 'Bajo la Ley Federal de Protección de la Privacidad del Conductor (DPPA),
    el Departamento de Seguridad no divulgará su información personal para una lista
    de correo sin:'
  choices:
    A: Una orden judicial
    B: Su consentimiento expreso
    C: Una verificación de antecedentes
    D: Una tarifa de procesamiento de $10
  answer: B
  explanation: La Ley Federal de Protección de la Privacidad del Conductor (DPPA)
    prohíbe la difusión o divulgación de información personal de un registro de vehículos
    motorizados sin el 'consentimiento expreso' de ese conductor.
- id: 190
  category: license_system
  question: Si un nuevo residente menor de 18 años proporciona un historial de manejo
    certificado de su estado anterior, ¿dentro de cuántos días previos a la solicitud
    en Tennessee debe haber sido emitido?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El historial de manejo certificado debe emitirse dentro de los treinta
    (30) días inmediatamente anteriores a la fecha de la solicitud en Tennessee.
- id: 191
  category: license_system
  question: ¿Cuál de los siguientes niveles de licencia NO requiere que el conductor
    lleve una Tarjeta de Restricción?
  choices:
    A: Permiso de Aprendizaje
    B: Licencia Intermedia Restringida Clase D
    C: Licencia Intermedia Sin Restricciones Clase D
    D: Tanto el Permiso de Aprendizaje como la Licencia Intermedia Restringida
  answer: C
  explanation: Un conductor con el segundo nivel de Licencia Intermedia Sin Restricciones
    (IU, por sus siglas en inglés) Clase D no tiene ninguna restricción para conducir.
    Por lo tanto, no hay tarjeta de restricción para este nivel de licencia.
- id: 192
  category: penalties_and_points
  question: ¿Cuál es la sanción si un adolescente con una Licencia Intermedia Restringida
    es condenado por falsificar una carta de aprobación de los padres?
  choices:
    A: Se añaden 90 días al período de la Licencia Intermedia Restringida
    B: Revocación de la licencia y reemisión de un Permiso de Aprendizaje hasta los
      18 años
    C: Finalización de un curso certificado de educación vial
    D: Una suspensión de 6 meses de todos los privilegios de conducir
  answer: B
  explanation: Según la tabla de Sanciones del GDL (Licencia de Conducir Graduada),
    una carta de aprobación de los padres falsificada después de que se emite una
    Licencia Intermedia Restringida resulta en la revocación de la Licencia Intermedia
    Restringida y la reemisión de un Permiso de Aprendizaje únicamente hasta que el
    adolescente cumpla los 18 años.
- id: 193
  category: penalties_and_points
  question: ¿Qué sanción se aplica a un conductor que posee una Licencia Intermedia
    Restringida y es condenado por una segunda infracción de tránsito en movimiento?
  choices:
    A: Debe mantener un Permiso de Aprendizaje hasta los 18 años
    B: Se añaden 90 días a su período de Licencia Intermedia Restringida
    C: Debe completar un curso certificado de educación vial
    D: Su licencia es suspendida por 180 días
  answer: C
  explanation: La tabla de Sanciones del GDL establece que una condena por una segunda
    infracción de tránsito en movimiento después de que se emite una Licencia Intermedia
    Restringida requiere la finalización de un curso certificado de educación vial.
- id: 194
  category: driver_responsibility
  question: ¿Qué responsabilidad asume un adulto cuando firma un formulario de Declaración
    Jurada y Cancelación para Menores/Adolescentes (Minor/Teenage Affidavit and Cancellation)
    para un solicitante menor de dieciocho años?
  choices:
    A: Debe viajar en el asiento del pasajero en todo momento
    B: Asume la responsabilidad financiera por el conductor menor de edad
    C: Debe pagar el registro del vehículo del menor
    D: Está obligado a registrar 50 horas de tiempo de conducción con el menor
  answer: B
  explanation: La Declaración Jurada para Menores/Adolescentes confirma que el adulto
    que firma el formulario se une a la solicitud de la licencia y será responsable
    de las acciones del conductor menor de edad. Esto incluye asumir la responsabilidad
    financiera.
- id: 195
  category: license_system
  question: Si un menor solicita una clase de licencia adicional, como una licencia
    de motocicleta, ¿qué se requiere de los padres o del tutor legal?
  choices:
    A: Deben firmar una segunda declaración jurada para adolescentes para ese tipo
      de licencia
    B: Deben pagar una tarifa de solicitud doble
    C: Deben tomar un curso de seguridad en motocicleta con el menor
    D: No se requiere documentación adicional
  answer: A
  explanation: Si un menor solicita una clase de licencia adicional (como la de motocicleta),
    se requerirá que los padres o el tutor legal firmen una segunda declaración jurada
    para adolescentes para ese tipo de licencia.
- id: 196
  category: license_system
  question: ¿Por cuánto tiempo es válido el Certificado de Asistencia Escolar Obligatoria
    (Formulario SF1010) después de ser firmado por un funcionario escolar durante
    el año escolar regular?
  choices:
    A: 10 días
    B: 14 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: El solicitante debe llevar el formulario original y completo al Centro
    de Servicios al Conductor. Este formulario solo es válido por treinta (30) días
    a partir de la fecha de firma por parte del funcionario escolar.
- id: 197
  category: license_system
  question: Si un Certificado de Asistencia Escolar Obligatoria (Formulario SF1010)
    se firma dentro de los últimos 30 días del año escolar, ¿por cuánto tiempo es
    aceptado?
  choices:
    A: Solo hasta el último día del año escolar
    B: Durante todo el verano hasta 30 días después del inicio del siguiente año escolar
    C: Por exactamente 90 días a partir de la fecha de firma
    D: Hasta el cumpleaños número 18 del estudiante
  answer: B
  explanation: Durante los meses tradicionales de vacaciones de verano, un formulario
    SF1010 debidamente completado y firmado dentro de los últimos 30 días del año
    escolar será aceptado durante todo el verano hasta 30 días después del inicio
    del siguiente año escolar.
- id: 198
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como prueba de cumplimiento
    de la ley de asistencia escolar para un menor que solicita una licencia?
  choices:
    A: Un diploma original de escuela secundaria (high school)
    B: Un Certificado de Asistencia Escolar Obligatoria (Formulario SF1010)
    C: Boletas de calificaciones o expedientes académicos
    D: Una carta del director local de escuelas para solicitantes educados en casa
      (home-schooled)
  answer: C
  explanation: Las boletas de calificaciones o los expedientes académicos no son aceptables
    como prueba de cumplimiento de esta ley. Debido a las diversas escalas de calificación...
    el personal de Licencias de Conducir no está autorizado para interpretar la información
    en estos documentos.
- id: 199
  category: penalties_and_points
  question: ¿Qué sucede con los privilegios de conducir de un estudiante de quince
    años o más que abandona la escuela?
  choices:
    A: Se restringen a conducir solo hacia y desde el trabajo
    B: El Departamento de Seguridad suspende los privilegios de conducir del estudiante
    C: Debe pagar una multa para conservar su licencia
    D: Se le degrada a un Permiso de Aprendizaje
  answer: B
  explanation: Si un estudiante de quince años o más abandona la escuela, la escuela
    está obligada a notificar al Departamento de Seguridad, el cual suspende los privilegios
    de conducir del estudiante.
- id: 200
  category: license_system
  question: ¿Qué tipo de licencia se puede emitir a un solicitante menor de 18 años
    al graduarse de la escuela secundaria (high school) o recibir un GED?
  choices:
    A: Solo un Permiso de Aprendizaje
    B: Una Licencia Intermedia Restringida
    C: Una licencia de operador regular Clase D
    D: Una licencia por Dificultad Extrema (Hardship license)
  answer: C
  explanation: Al graduarse de la escuela secundaria o después de recibir un GED antes
    de los 18 años, se puede emitir una licencia de operador regular Clase D.
- id: 201
  category: license_system
  question: Si un solicitante de 16 años tuvo una licencia de otro estado por menos
    de 90 días, ¿por qué período combinado debe haber tenido un permiso de aprendizaje
    y/o licencia válida para obtener una Licencia Restringida Intermedia (Intermediate
    Restricted License)?
  choices:
    A: Al menos 60 días
    B: Al menos 90 días
    C: Al menos 180 días
    D: Al menos 365 días
  answer: C
  explanation: Si el solicitante tuvo una licencia de otro estado por MENOS de 90
    días, el historial de manejo debe confirmar que ha tenido un permiso de aprendizaje
    válido y/o una clase de licencia por un período combinado de al menos 180 días.
- id: 202
  category: penalties_and_points
  question: Si un adolescente con un Permiso de Aprendizaje (Learner Permit) acumula
    seis o más puntos en su historial de manejo, ¿cuál es la sanción?
  choices:
    A: Debe conservar el permiso hasta que mantenga un historial con menos de 6 puntos
      durante 180 días consecutivos
    B: Su permiso es revocado hasta los 18 años
    C: Debe completar un curso certificado de educación vial
    D: Se le emite inmediatamente una Licencia Restringida Intermedia
  answer: A
  explanation: Según la tabla de Sanciones del GDL, acumular seis o más puntos después
    de que se emite un Permiso de Aprendizaje requiere que el solicitante continúe
    con el permiso de aprendizaje por un período de tiempo adicional hasta que pueda
    mantener un historial con menos de 6 puntos durante 180 días consecutivos.
- id: 203
  category: penalties_and_points
  question: ¿Qué sucede si un adolescente comete una segunda infracción por no usar
    el cinturón de seguridad durante su período de Licencia Restringida Intermedia,
    pero el Departamento de Seguridad (DOS) no es notificado hasta después de que
    se le emite una Licencia Sin Restricciones Intermedia (Intermediate Unrestricted
    license)?
  choices:
    A: La infracción es perdonada y no se aplica ninguna sanción
    B: La licencia del adolescente es revocada permanentemente
    C: El adolescente será degradado nuevamente a una Licencia Restringida Intermedia
      por 90 días
    D: El adolescente debe pagar una multa de $500
  answer: C
  explanation: Si alguna de las infracciones enumeradas... ocurrió durante el tiempo
    que el adolescente tenía una Licencia Restringida Intermedia, pero el DOS no recibió
    la notificación... hasta después de que ya le habíamos emitido al adolescente
    una Licencia Sin Restricciones Intermedia... El adolescente será 'degradado' a
    una Licencia Restringida Intermedia por 90 días.
- id: 204
  category: penalties_and_points
  question: ¿Qué sucede la segunda vez que un estudiante abandona la escuela?
  choices:
    A: Debe pagar una multa de $50.
    B: Debe esperar hasta cumplir los 18 años para volver a solicitar una licencia.
    C: Debe esperar 6 meses para volver a solicitarla.
    D: Pierde permanentemente sus privilegios de manejo.
  answer: B
  explanation: Según el manual, la segunda vez que un estudiante abandona la escuela,
    debe esperar a cumplir los dieciocho (18) años de edad antes de ser elegible para
    solicitar una licencia nuevamente.
- id: 205
  category: license_system
  question: ¿Cuál es la tarifa de restablecimiento para un estudiante que abandonó
    la escuela pero regresa para recuperar sus privilegios de manejo?
  choices:
    A: $10
    B: $20
    C: $50
    D: $100
  answer: B
  explanation: El manual establece que un estudiante que regresa a la escuela deberá
    pagar una tarifa de restablecimiento de $20, además de las tarifas correspondientes
    de solicitud y licencia.
- id: 206
  category: penalties_and_points
  question: ¿Cuál es una consecuencia para el titular de un permiso de aprendizaje
    que es sorprendido usando un teléfono celular mientras conduce?
  choices:
    A: Una suspensión de 180 días de su permiso
    B: Se agregan 6 puntos a su historial de manejo
    C: Una multa de $100
    D: Revocación inmediata de su permiso hasta los 18 años
  answer: B
  explanation: Las consecuencias de una condena para un adolescente por usar un teléfono
    celular mientras conduce incluyen un delito menor de Clase C (Class C misdemeanor),
    una multa de $50, 6 puntos agregados al historial de manejo del menor y un retraso
    de 90 días en la elegibilidad para una Licencia de Conducir Restringida Intermedia.
- id: 207
  category: safe_driving_rules
  question: ¿Cuál es la multa máxima por una infracción de enviar mensajes de texto
    mientras se conduce?
  choices:
    A: $20
    B: $50
    C: $100
    D: $250
  answer: B
  explanation: Las infracciones por enviar mensajes de texto mientras se conduce pueden
    resultar en una multa que no exceda los Cincuenta Dólares ($50) y costos judiciales
    que no excedan los Diez Dólares.
- id: 208
  category: defensive_driving
  question: Según el manual, ¿qué causa la mayoría de los accidentes en zonas de trabajo?
  choices:
    A: Exceso de velocidad
    B: Colisiones frontales
    C: Colisiones por alcance (choques traseros)
    D: Conducción distraída
  answer: C
  explanation: 'El manual establece explícitamente en los consejos de seguridad para
    zonas de trabajo: "¡No siga muy de cerca a otros vehículos! La mayoría de los
    accidentes en zonas de trabajo son causados por colisiones por alcance (choques
    traseros)".'
- id: 209
  category: safe_driving_rules
  question: ¿Qué debe hacer con los faros de su vehículo al acercarse a una zona de
    trabajo?
  choices:
    A: Apagarlos para evitar cegar a los trabajadores
    B: Hacer un cambio de luces para alertar a los trabajadores de su presencia
    C: Encenderlos solo si está lloviendo
    D: Encenderlos antes de entrar a la zona
  answer: D
  explanation: 'El manual aconseja a los conductores: "¡Encienda sus luces antes de
    entrar a la zona! Encienda los faros de su vehículo para hacerse más visible para
    los trabajadores y otros automovilistas".'
- id: 210
  category: license_system
  question: ¿Cuáles son las restricciones de horario de manejo para el titular de
    un permiso de aprendizaje menor de 18 años?
  choices:
    A: Prohibido conducir entre las 10 p.m. y las 6 a.m.
    B: Prohibido conducir entre las 11 p.m. y las 6 a.m.
    C: Prohibido conducir entre las 9 p.m. y las 5 a.m.
    D: Prohibido conducir entre la medianoche y las 6 a.m.
  answer: A
  explanation: Cualquier persona menor de 18 años que tenga un permiso de aprendizaje
    tiene prohibido conducir entre las 10 p.m. y las 6 a.m.
- id: 211
  category: license_system
  question: ¿Cuánto tiempo debe tener un permiso de aprendizaje un adolescente menor
    de 18 años antes de solicitar una licencia intermedia restringida?
  choices:
    A: Un mínimo de 3 meses
    B: Un mínimo de 6 meses
    C: Un mínimo de 9 meses
    D: Un mínimo de 1 año
  answer: B
  explanation: Cualquier persona menor de 18 años debe tener su permiso de aprendizaje
    por un mínimo de seis meses antes de solicitar una licencia intermedia restringida.
- id: 212
  category: license_system
  question: Si el titular de un permiso de aprendizaje acumula 6 o más puntos en su
    historial de manejo, ¿qué debe suceder antes de que pueda solicitar una licencia
    intermedia restringida?
  choices:
    A: Debe pagar una tarifa de restablecimiento de $50.
    B: Debe completar un curso de manejo defensivo.
    C: Debe mantener un historial con menos de 6 puntos durante 180 días consecutivos.
    D: Debe esperar hasta cumplir los 18 años.
  answer: C
  explanation: Si alguien con un permiso de aprendizaje tiene infracciones de manejo
    que suman 6 o más puntos, debe continuar con el permiso de aprendizaje hasta que
    su historial tenga menos de 6 puntos durante 180 días consecutivos completos.
- id: 213
  category: safe_driving_rules
  question: ¿Cuántos pasajeros se le permite tener en el vehículo al titular de una
    licencia intermedia restringida sin ninguna excepción calificada?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Aquellos con una licencia intermedia solo pueden tener 1 pasajero adicional
    en el vehículo, a menos que se cumplan excepciones específicas (como un pasajero
    de 21 años o más con una licencia sin restricciones, o hermanos con una carta
    de los padres).
- id: 214
  category: license_system
  question: ¿Entre qué horas se le prohíbe generalmente conducir al titular de una
    licencia intermedia restringida?
  choices:
    A: 9 p.m. y 6 a.m.
    B: 10 p.m. y 6 a.m.
    C: 11 p.m. y 6 a.m.
    D: Medianoche y 5 a.m.
  answer: C
  explanation: A las personas con una licencia intermedia restringida se les prohíbe
    conducir entre las 11 p.m. y las 6 a.m., a menos que cumplan con circunstancias
    de exención específicas.
- id: 215
  category: penalties_and_points
  question: ¿Cuál es la sanción para el titular de una licencia intermedia restringida
    sorprendido con una carta falsificada que le da permiso para conducir fuera del
    horario permitido?
  choices:
    A: Una multa de $50 y 6 puntos en su historial
    B: Revocación de la licencia y reemisión de un permiso de aprendizaje hasta los
      18 años
    C: Una suspensión de 90 días de su licencia
    D: Incautación inmediata del vehículo
  answer: B
  explanation: A un conductor con una licencia intermedia restringida que sea condenado
    por tener una carta falsificada o fraudulenta se le revocará su licencia intermedia
    restringida y solo se le volverá a emitir un permiso de aprendizaje hasta que
    cumpla los 18 años.
- id: 216
  category: license_system
  question: ¿Cuánto tiempo se debe mantener una licencia intermedia restringida antes
    de solicitar una licencia intermedia sin restricciones?
  choices:
    A: 6 meses
    B: 1 año
    C: 18 meses
    D: 2 años
  answer: B
  explanation: Los adolescentes deben mantener su licencia intermedia restringida
    por un mínimo de un año antes de poder solicitar una licencia intermedia sin restricciones.
- id: 217
  category: sharing_the_road
  question: ¿Quiénes representan cuatro de cada cinco muertes en las zonas de trabajo
    en las carreteras?
  choices:
    A: Trabajadores de construcción
    B: Peatones
    C: Conductores
    D: Banderilleros
  answer: C
  explanation: Según el manual, las estadísticas muestran que los conductores representan
    cuatro de cada cinco muertes en las zonas de trabajo en las carreteras.
- id: 218
  category: safe_driving_rules
  question: 'El titular de una licencia intermedia restringida puede conducir entre
    las 4 a.m. y las 6 a.m. si:'
  choices:
    A: Conduce hacia o desde la casa de un amigo
    B: Conduce hacia o desde una actividad de caza o pesca y posee una licencia válida
      de caza o pesca
    C: Conduce hacia un gimnasio o centro de acondicionamiento físico
    D: Está acompañado por un hermano que tiene al menos 18 años
  answer: B
  explanation: Una excepción al toque de queda de 11 p.m. a 6 a.m. es si el conductor
    conduce hacia o desde una actividad de caza o pesca entre las 4 a.m. y las 6 a.m.
    y tiene en su poder una licencia válida de caza o pesca.
- id: 219
  category: penalties_and_points
  question: ¿Cuál de las siguientes opciones causará un retraso de 90 días para ser
    elegible para una licencia intermedia sin restricciones?
  choices:
    A: Recibir 4 puntos en su historial de manejo
    B: Ser condenado por una primera infracción del cinturón de seguridad
    C: Contribuir a un accidente de tránsito
    D: Conducir después de las 10:00 p.m.
  answer: C
  explanation: Un conductor adolescente no será elegible para una licencia intermedia
    sin restricciones por 90 días adicionales si ha contribuido a un accidente de
    tránsito, ha recibido 6 o más puntos, o ha sido condenado por una segunda infracción
    del cinturón de seguridad.
- id: 220
  category: penalties_and_points
  question: Si un conductor adolescente comete una segunda infracción en movimiento
    mientras tiene una licencia de conducir intermedia restringida, ¿qué debe hacer
    antes de recibir una licencia sin restricciones?
  choices:
    A: Pagar una multa de $50
    B: Esperar 6 meses adicionales
    C: Completar una clase aprobada de educación vial
    D: Volver a tomar el examen práctico de manejo
  answer: C
  explanation: Si el conductor adolescente comete una segunda infracción en movimiento
    mientras tiene la licencia de conducir intermedia restringida, DEBE COMPLETAR
    una clase aprobada de educación vial antes de recibir una licencia de conducir
    intermedia sin restricciones.
- id: 221
  category: license_system
  question: ¿Cuál es el toque de queda para conducir de un adolescente que tiene un
    Permiso de Aprendizaje (Clase PD)?
  choices:
    A: No puede conducir entre las 9:00 PM y las 5:00 AM
    B: No puede conducir entre las 10:00 PM y las 6:00 AM
    C: No puede conducir entre las 11:00 PM y las 6:00 AM
    D: No puede conducir entre la medianoche y las 6:00 AM
  answer: B
  explanation: Las restricciones para un Permiso de Aprendizaje (Clase PD) establecen
    que el conductor no puede conducir entre las 10:00 PM y las 6:00 AM.
- id: 222
  category: driver_testing
  question: ¿Cuál es el período de espera obligatorio después de reprobar el examen
    de conocimientos?
  choices:
    A: No hay período de espera
    B: 1 día
    C: 7 días
    D: 30 días
  answer: B
  explanation: Se requiere un período de espera obligatorio de 1 día después de reprobar
    el examen de conocimientos.
- id: 223
  category: driver_testing
  question: ¿Qué sucede si se sorprende a un solicitante haciendo trampa en un examen
    obligatorio para la licencia de conducir?
  choices:
    A: Recibe una advertencia y debe reiniciar el examen
    B: Reprueba automáticamente y no puede volver a intentar el examen por 7 días
    C: Reprueba automáticamente y no puede volver a intentar el examen por 30 días
    D: Se le prohíbe permanentemente obtener una licencia de conducir
  answer: C
  explanation: Cualquier forma de trampa por parte de un solicitante en un examen
    obligatorio resultará en la reprobación automática y no se le permitirá volver
    a intentar el examen por 30 días.
- id: 224
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para aprobar el examen de la vista
    para una licencia de conducir?
  choices:
    A: Visión 20/20 en cada ojo
    B: Visión 20/30 en cada ojo
    C: Visión 20/40 en cada ojo individualmente y en ambos ojos juntos
    D: Visión 20/50 en al menos un ojo
  answer: C
  explanation: Se requiere que el solicitante tenga al menos una visión de 20/40 en
    cada ojo individualmente y en ambos ojos juntos. Esto puede ser con o sin anteojos
    o lentes de contacto.
- id: 225
  category: driver_testing
  question: ¿Cuál de las siguientes opciones NO está permitida durante el examen de
    conocimientos computarizado?
  choices:
    A: Tomar el examen en español
    B: Usar un diccionario de traducción sin notas ni escritura a mano
    C: Tomar el examen en coreano
    D: Usar un diccionario electrónico o teléfono inteligente
  answer: D
  explanation: El uso de Asistentes Digitales Personales (PDA), teléfonos inteligentes,
    diccionarios electrónicos y otros dispositivos electrónicos similares NO está
    permitido durante el examen.
- id: 226
  category: driver_testing
  question: ¿Qué porcentaje del examen de conocimientos está dedicado a drogas y alcohol?
  choices:
    A: 10%
    B: 15%
    C: 25%
    D: 50%
  answer: C
  explanation: El examen de conocimientos consta de cuatro áreas, y el tema de drogas
    y alcohol representa el 25% del examen.
- id: 227
  category: license_system
  question: ¿Cuál es el formato de todas las licencias de conducir emitidas a personas
    menores de 21 años?
  choices:
    A: Formato horizontal
    B: Formato vertical
    C: Formato cuadrado
    D: Formato codificado por color rojo
  answer: B
  explanation: A partir del 1 de julio de 2018, todas las licencias emitidas a personas
    menores de 21 años tienen un formato vertical.
- id: 228
  category: driver_testing
  question: ¿Bajo qué condiciones climáticas NO se realizan los exámenes prácticos
    de manejo?
  choices:
    A: Lluvia ligera
    B: Cielos nublados
    C: Clima extremo como lluvia intensa, niebla densa o carreteras heladas
    D: Temperaturas por debajo de los 40 grados
  answer: C
  explanation: Los exámenes prácticos de manejo no se realizan en condiciones climáticas
    extremas (lluvia/nieve intensa, niebla densa, granizo, vientos fuertes, carreteras
    heladas, etc.).
- id: 229
  category: license_system
  question: ¿Cuántas horas de experiencia al volante se deben certificar para obtener
    una Licencia Intermedia Restringida?
  choices:
    A: 30 horas, incluyendo 5 de noche
    B: 40 horas, incluyendo 10 de noche
    C: 50 horas, incluyendo 10 de noche
    D: 60 horas, incluyendo 15 de noche
  answer: C
  explanation: Para obtener una Licencia Intermedia Restringida, debe presentar una
    certificación de 50 horas de experiencia al volante, incluyendo 10 horas de noche.
- id: 230
  category: driver_testing
  question: Si un solicitante menor de 18 años solicita un examen de conocimientos
    oral debido a una discapacidad de aprendizaje, ¿qué debe presentar?
  choices:
    A: Un padre o tutor legal para que le lea el examen
    B: Una declaración por escrito de un médico o especialista educativo
    C: Un intérprete de lenguaje de señas certificado
    D: Prueba de graduación de la escuela secundaria
  answer: B
  explanation: Si el solicitante que pide un examen oral es menor de dieciocho (18)
    años, se requerirá una declaración por escrito de un médico o especialista educativo
    que indique que el solicitante tiene una condición médica o discapacidad de aprendizaje
    antes de que se pueda administrar el examen.
- id: 231
  category: driver_testing
  question: ¿Cuál es el requisito mínimo de visión para que a un solicitante se le
    emita una licencia de conducir o permiso?
  choices:
    A: Visión 20/20 en cada ojo
    B: Visión 20/30 en cada ojo
    C: Visión 20/40 en cada ojo individualmente y en ambos ojos juntos
    D: Visión 20/50 en al menos un ojo
  answer: C
  explanation: Se requiere que el solicitante tenga al menos una visión de 20/40 en
    cada ojo individualmente y en ambos ojos juntos, con o sin anteojos o lentes de
    contacto.
- id: 232
  category: driver_testing
  question: Si reprueba el examen de conocimientos para la licencia de conducir, ¿cuánto
    tiempo debe esperar antes de poder intentar el examen nuevamente?
  choices:
    A: Puede volver a tomarlo inmediatamente
    B: Un mínimo de un día
    C: Siete días
    D: Treinta días
  answer: B
  explanation: Se requiere un período de espera obligatorio de 1 día después de reprobar
    cualquier examen de conocimientos para la licencia de conducir antes de regresar
    para intentarlo nuevamente.
- id: 233
  category: driver_testing
  question: ¿Qué sucederá si llega más de 5 minutos tarde a su cita programada para
    el examen práctico de manejo?
  choices:
    A: Perderá 5 puntos en su examen de manejo
    B: El examinador omitirá la inspección del vehículo previa al viaje
    C: Debe pagar un cargo por demora antes de realizar el examen
    D: Su examen práctico de manejo será cancelado y tendrá que reprogramarlo
  answer: D
  explanation: Si llega más de 5 minutos tarde a la hora de su cita, su examen práctico
    de manejo será cancelado y tendrá que reprogramarlo para una fecha posterior.
- id: 234
  category: driver_testing
  question: ¿Bajo cuál de las siguientes condiciones climáticas NO se realizará un
    examen práctico de manejo?
  choices:
    A: Lluvia ligera
    B: Niebla moderada
    C: Nieve ligera
    D: Lluvia fuerte y tormentas eléctricas
  answer: D
  explanation: Los exámenes prácticos NO se realizarán con lluvia fuerte, tormentas
    eléctricas, niebla espesa, cuando las carreteras estén inundadas, cubiertas/compactadas
    con nieve y hielo, o durante advertencias de clima severo.
- id: 235
  category: vehicle_information
  question: ¿Cualquier vehículo de motor de pasajeros fabricado o ensamblado en qué
    año o posterior debe estar equipado con cinturones de seguridad?
  choices:
    A: '1959'
    B: '1969'
    C: '1979'
    D: '1989'
  answer: B
  explanation: Cualquier vehículo de motor de pasajeros fabricado o ensamblado en
    1969 o posterior debe estar equipado con cinturones de seguridad y estos deben
    estar en buenas condiciones de uso.
- id: 236
  category: vehicle_information
  question: ¿Cuántos faros delanteros blancos se le permite tener a un vehículo de
    motor?
  choices:
    A: Exactamente dos
    B: Al menos dos pero no más de cuatro
    C: Al menos cuatro
    D: De uno a cuatro
  answer: B
  explanation: Los vehículos de motor deben estar equipados con al menos dos faros
    delanteros, pero no más de cuatro faros blancos.
- id: 237
  category: vehicle_information
  question: Para un automóvil de pasajeros, ¿el material de polarizado de las ventanas
    debe transmitir al menos qué porcentaje de luz visible?
  choices:
    A: 25%
    B: 35%
    C: 50%
    D: 75%
  answer: B
  explanation: Para un automóvil de pasajeros, no se puede adherir a ninguna ventana
    ningún material que transmita menos del 35% de la luz visible.
- id: 238
  category: vehicle_information
  question: Los automóviles de pasajeros deben tener parachoques que estén dentro
    de ¿qué rango de altura desde el suelo?
  choices:
    A: De 10 a 15 pulgadas
    B: De 14 a 22 pulgadas
    C: De 14 a 31 pulgadas
    D: De 20 a 30 pulgadas
  answer: B
  explanation: Los automóviles de pasajeros deben tener parachoques que estén dentro
    de un rango de 14 a 22 pulgadas desde el suelo.
- id: 239
  category: driver_testing
  question: ¿A quién se le permite estar en el vehículo con usted durante su examen
    de manejo?
  choices:
    A: Usted, el examinador y un padre o tutor
    B: Solo usted y el examinador (u otro personal autorizado)
    C: Usted, el examinador y un traductor de idiomas
    D: Usted, el examinador y su instructor de manejo
  answer: B
  explanation: Las únicas personas permitidas en el vehículo son usted y el examinador
    (u otro personal autorizado). No se permite ningún animal en el vehículo.
- id: 240
  category: driver_testing
  question: ¿Cuál de las siguientes acciones resultará en la reprobación automática
    e inmediata del examen práctico?
  choices:
    A: Pedirle al examinador que repita una instrucción
    B: Una infracción de cualquier ley de tránsito
    C: Frenar demasiado fuerte en una señal de alto
    D: No desempañar el parabrisas antes de comenzar
  answer: B
  explanation: 'El solicitante será reprobado inmediatamente por cualquiera de las
    siguientes razones: Infracción de cualquier ley de tránsito, falta de cooperación,
    cualquier acción peligrosa o contribuir a un accidente.'
- id: 241
  category: driver_testing
  question: Según las pautas de repetición de exámenes, si comete de 7 a 9 errores
    en su examen de habilidades (práctico), ¿cuánto dura el período de práctica obligatorio
    antes de poder volver a tomar el examen?
  choices:
    A: Al día siguiente (1 día)
    B: Siete (7) días
    C: Catorce (14) días
    D: Treinta (30) días
  answer: A
  explanation: Según la Tabla 4.2 de Pautas para la Repetición de Exámenes, cometer
    de 7 a 9 errores/puntos requiere un período de tiempo de práctica obligatorio
    hasta el día siguiente (1 día).
- id: 242
  category: driver_testing
  question: Si reprueba automáticamente el examen de manejo o comete 16 o más errores,
    ¿cuánto tiempo debe esperar antes de que se le permita volver a tomar el examen?
  choices:
    A: Al día siguiente (1 día)
    B: Siete (7) días
    C: Catorce (14) días
    D: Treinta (30) días
  answer: D
  explanation: Según la Tabla 4.2, 16 o más errores/puntos O una reprobación automática
    requieren un período de tiempo de práctica obligatorio de treinta (30) días.
- id: 243
  category: vehicle_information
  question: Por ley, ¿qué dos métodos separados para aplicar los frenos deben tener
    todos los automóviles?
  choices:
    A: Frenos delanteros y frenos traseros
    B: Un freno de pie regular y un freno de estacionamiento
    C: Frenos antibloqueo y frenos estándar
    D: Un freno de mano y un freno de motor
  answer: B
  explanation: Por ley, todos los automóviles deben tener dos métodos separados para
    aplicar los frenos. Deben tener un freno de pie regular y un freno de estacionamiento.
- id: 244
  category: driver_testing
  question: ¿Con cuánta anticipación debe planear llegar al Centro de Servicio de
    Licencias de Conducir antes de su cita programada para el examen práctico?
  choices:
    A: A la hora exacta de la cita
    B: Al menos 5 minutos antes
    C: Al menos 15 minutos antes
    D: Al menos 30 minutos antes
  answer: C
  explanation: Debe planear llegar al Centro de Servicio de Licencias de Conducir
    al menos 15 minutos antes de la hora programada de su cita para permitir el procesamiento
    del papeleo.
- id: 245
  category: vehicle_information
  question: ¿Cuál es la regla con respecto al material polarizado adherido al parabrisas
    de un vehículo motorizado?
  choices:
    A: Debe transmitir al menos el 35% de la luz visible
    B: Está permitido si transmite el 50% de la luz visible
    C: No se puede adherir ningún material polarizado al parabrisas
    D: Solo se permite en las 4 pulgadas superiores del parabrisas
  answer: C
  explanation: 'El manual establece: ''No se puede adherir ningún material polarizado
    al parabrisas de ningún vehículo motorizado''.'
- id: 246
  category: driver_testing
  question: ¿Cuál es el período de tiempo de práctica obligatorio antes de volver
    a tomar el examen si un solicitante comete 16 o más errores o tiene una reprobación
    automática en el examen de habilidades?
  choices:
    A: Siete (7) días
    B: Catorce (14) días
    C: Treinta (30) días
    D: Noventa (90) días
  answer: C
  explanation: El manual establece que 16 o más errores/puntos, o una reprobación
    automática, requieren un período de tiempo de práctica obligatorio de treinta
    (30) días antes de que se permita volver a tomar el examen.
- id: 247
  category: driver_testing
  question: ¿Con cuánta anticipación debe llegar antes de su cita programada para
    el examen práctico?
  choices:
    A: Al menos 5 minutos
    B: Al menos 10 minutos
    C: Al menos 15 minutos
    D: Al menos 30 minutos
  answer: C
  explanation: Debe llegar al menos 15 minutos antes de su cita programada para el
    examen práctico para tener tiempo para el papeleo de la solicitud.
- id: 248
  category: driver_testing
  question: Su cita para el examen práctico tendrá que ser reprogramada si llega tarde
    por al menos ¿cuántos minutos?
  choices:
    A: 5 minutos
    B: 10 minutos
    C: 15 minutos
    D: 20 minutos
  answer: A
  explanation: Para garantizar un servicio oportuno, si llega cinco (5) o más minutos
    tarde al inicio de su cita para el examen práctico, esta tendrá que ser reprogramada.
- id: 249
  category: driver_testing
  question: Los adolescentes de entre 15 y 17 años pueden tomar su examen de conocimientos
    escrito en línea bajo la supervisión de un padre o tutor legal usando ¿qué aplicación?
  choices:
    A: Aplicación Tennessee Driver Portal
    B: Aplicación Tennessee Proctor Identification (PID)
    C: Aplicación TDOSHS Secure Test
    D: Aplicación Tennessee Teen Driver
  answer: B
  explanation: Los adolescentes de 15 a 17 años pueden tomar el examen escrito en
    línea bajo la supervisión de un supervisor (proctor) a través de la aplicación
    Tennessee Proctor Identification (PID).
- id: 250
  category: safe_driving_rules
  question: ¿Por qué es peligroso conducir con el asiento en una posición reclinada
    o semireclinada?
  choices:
    A: Aumenta el riesgo de que el cinturón de seguridad se desabroche.
    B: Reduce tanto su visión como su capacidad para reaccionar ante situaciones de
      emergencia.
    C: Hace que el volante se bloquee.
    D: Evita que las bolsas de aire se desplieguen.
  answer: B
  explanation: 'El manual establece explícitamente: ''NO CONDUZCA CON EL ASIENTO EN
    UNA POSICIÓN RECLINADA O SEMIRECLINADA. Esto es peligroso y reduce tanto su visión
    como su capacidad para reaccionar ante situaciones de emergencia''.'
- id: 251
  category: vehicle_information
  question: Para evitar lesiones graves en la cabeza o el cuello por el despliegue
    de la bolsa de aire, ¿a qué distancia del volante debe estar posicionado su cuerpo?
  choices:
    A: De 4 a 6 pulgadas
    B: De 6 a 8 pulgadas
    C: De 10 a 12 pulgadas
    D: De 15 a 18 pulgadas
  answer: C
  explanation: Su cuerpo debe estar a unas 10 a 12 pulgadas de distancia del volante.
    Sentarse más cerca podría resultar en lesiones graves en la cabeza o el cuello
    si la bolsa de aire golpea la barbilla o la cara.
- id: 252
  category: vehicle_information
  question: 'Al ajustar su asiento y la columna de dirección, la parte superior del
    volante no debe estar más alta que:'
  choices:
    A: La parte superior de sus hombros.
    B: Su barbilla.
    C: Su nariz.
    D: La parte superior de su cabeza.
  answer: A
  explanation: El manual indica que la parte superior del volante no debe estar más
    alta que la parte superior de los hombros.
- id: 253
  category: vehicle_information
  question: 'Los reposacabezas de los asientos correctamente ajustados deben estar
    al mismo nivel que la parte posterior de la cabeza para prevenir:'
  choices:
    A: Lesiones por la bolsa de aire.
    B: Latigazo cervical si es golpeado por detrás.
    C: Somnolencia al conducir.
    D: Puntos ciegos.
  answer: B
  explanation: Ajuste correctamente los reposacabezas de los asientos a un nivel parejo
    con la parte posterior de la cabeza. Los reposacabezas están diseñados para prevenir
    el latigazo cervical si el vehículo es golpeado por detrás.
- id: 254
  category: safe_driving_rules
  question: Al prepararse para conducir, ¿cuándo debe ajustar sus espejos?
  choices:
    A: Antes de ajustar su asiento.
    B: Después de ajustar el asiento correctamente.
    C: Mientras conduce a baja velocidad.
    D: Solo después de revisar sus puntos ciegos.
  answer: B
  explanation: El manual instruye a los conductores a ajustar los espejos después
    de que el asiento esté ajustado correctamente, y siempre antes de conducir.
- id: 255
  category: vehicle_information
  question: 'Para ajustar correctamente el espejo lateral del conductor (izquierdo),
    debe apoyar su cabeza contra la ventana lateral izquierda y ajustar el espejo
    de manera que pueda:'
  choices:
    A: Ver todo el parachoques trasero de su vehículo.
    B: Ver la consola central de su vehículo.
    C: Ver apenas el costado de su vehículo en el lado derecho del espejo.
    D: Ver la ventana trasera completamente enmarcada.
  answer: C
  explanation: Para ajustar el espejo lateral izquierdo, apoye su cabeza contra la
    ventana lateral izquierda y ajuste el espejo de manera que apenas pueda ver el
    costado de su vehículo en el lado derecho del espejo.
- id: 256
  category: vehicle_information
  question: ¿Cómo debe posicionar su cabeza para ajustar correctamente el espejo lateral
    del pasajero (derecho)?
  choices:
    A: Contra la ventana lateral izquierda.
    B: Justo por encima de la consola central.
    C: Contra la ventana lateral del pasajero.
    D: Mirando directamente hacia adelante al parabrisas.
  answer: B
  explanation: Para ajustar el espejo lateral del pasajero, posicione su cabeza de
    manera que quede justo por encima de la consola central.
- id: 257
  category: defensive_driving
  question: Incluso con los espejos correctamente ajustados, ¿qué debe hacer siempre
    antes de intentar girar o cambiar de carril?
  choices:
    A: Tocar la bocina para advertir a otros conductores.
    B: Girar la cabeza y revisar los puntos ciegos.
    C: Parpadear las luces delanteras dos veces.
    D: Confiar completamente en su espejo retrovisor.
  answer: B
  explanation: Incluso los espejos correctamente posicionados no pueden eliminar todos
    los puntos ciegos. Siempre gire la cabeza y revise los puntos ciegos cuando desee
    girar o cambiar de carril.
- id: 258
  category: safe_driving_rules
  question: ¿Cómo debe estar posicionado correctamente el cinturón de regazo en su
    cuerpo?
  choices:
    A: Suelto sobre el estómago.
    B: Firme sobre las caderas.
    C: Alto en el abdomen.
    D: Sobre la parte superior de los muslos y las rodillas.
  answer: B
  explanation: Los cinturones de regazo deben estar posicionados firmemente sobre
    las caderas, mientras que el cinturón de hombro debe estar firme sobre el hombro.
- id: 259
  category: vehicle_information
  question: Antes de arrancar un vehículo de transmisión automática, debe colocar
    el pie en el pedal del freno y asegurarse de que el selector de marchas esté en
    qué posición?
  choices:
    A: NEUTRAL (Punto muerto)
    B: DRIVE (Conducir)
    C: PARK (Estacionamiento)
    D: REVERSE (Reversa)
  answer: C
  explanation: Coloque el pie en el pedal del freno y asegúrese de que el selector
    de marchas esté en la posición PARK (Estacionamiento) para transmisiones automáticas
    o en NEUTRAL (Punto muerto) para transmisiones manuales/estándar.
- id: 260
  category: vehicle_information
  question: ¿En qué posición debe estar el selector de marchas antes de arrancar un
    vehículo de transmisión automática?
  choices:
    A: DRIVE (Conducir)
    B: REVERSE (Reversa)
    C: NEUTRAL (Punto muerto)
    D: PARK (Estacionamiento)
  answer: D
  explanation: Antes de arrancar un vehículo de transmisión automática, coloque el
    pie en el pedal del freno y asegúrese de que el selector de marchas esté en la
    posición PARK (Estacionamiento).
- id: 261
  category: vehicle_information
  question: En un vehículo con transmisión manual, ¿qué se debe hacer antes de que
    el vehículo arranque?
  choices:
    A: Se debe pisar el embrague.
    B: La palanca de cambios debe estar en primera marcha.
    C: Se debe bombear el acelerador dos veces.
    D: El volante debe estar bloqueado.
  answer: A
  explanation: En los vehículos con transmisión manual, se debe pisar el embrague
    antes de que el vehículo arranque.
- id: 262
  category: safe_driving_rules
  question: ¿Cómo afecta a la visibilidad de su vehículo el encender las luces bajas
    durante el día?
  choices:
    A: Agota la batería y reduce la visibilidad.
    B: Hace que el vehículo sea visible al doble de distancia.
    C: Hace que el vehículo sea visible al triple de distancia.
    D: No tiene ningún efecto sobre la visibilidad durante el día.
  answer: B
  explanation: Con luz de día normal, los vehículos son visibles al doble de distancia
    cuando las luces están encendidas.
- id: 263
  category: vehicle_information
  question: ¿Cuándo se deben usar generalmente las marchas bajas (indicadas con "L",
    "2" o "1") en una transmisión automática?
  choices:
    A: Para desaceleración de emergencia si hay una falla en los frenos.
    B: Al conducir en autopistas o vías rápidas.
    C: Al retroceder en línea recta.
    D: Para el tráfico normal con paradas y arranques continuos.
  answer: A
  explanation: Las marchas bajas generalmente no se usan excepto en situaciones especiales
    o de emergencia, como la desaceleración de emergencia si hay una falla en los
    frenos, al conducir cuesta abajo en pendientes pronunciadas de montaña o al conducir
    a baja velocidad en carreteras resbaladizas.
- id: 264
  category: vehicle_information
  question: Al conducir un vehículo de transmisión manual (estándar), ¿cuándo debe
    mantener el pedal del embrague pisado a fondo?
  choices:
    A: Siempre que conduzca cuesta abajo por una colina empinada.
    B: Al avanzar por inercia para ahorrar gasolina.
    C: En todo momento mientras el vehículo esté en movimiento.
    D: Cuando su velocidad desciende por debajo de 10 MPH al detenerse.
  answer: D
  explanation: Debe mantener el pedal del embrague pisado a fondo al arrancar, al
    cambiar de marcha y cuando la velocidad descienda por debajo de 10 MPH al detenerse.
- id: 265
  category: safe_driving_rules
  question: ¿Qué indica el manual sobre avanzar por inercia (coasting) con la marcha
    en punto muerto (neutral)?
  choices:
    A: Se recomienda para ahorrar combustible.
    B: Es ilegal.
    C: Solo debe hacerse en colinas empinadas.
    D: Es la forma más segura de reducir la velocidad.
  answer: B
  explanation: 'El manual indica: "No avance por inercia con la marcha en punto muerto
    (es ilegal) ni con el pedal del embrague pisado, excepto al cambiar de marcha".'
- id: 266
  category: safe_driving_rules
  question: ¿Cuál es la regla básica que debe seguir un conductor al operar un vehículo
    con un sistema de bloqueo del volante?
  choices:
    A: Bloquear siempre el volante antes de apagar el motor.
    B: Nunca girar la llave de encendido a la posición de bloqueo cuando el vehículo
      esté en movimiento.
    C: Nunca usar el sistema de bloqueo mientras esté estacionado en una colina.
    D: Mantener siempre una mano en el botón de liberación del bloqueo.
  answer: B
  explanation: La regla básica es nunca girar la llave de encendido a la posición
    de bloqueo cuando el vehículo está en movimiento, porque el volante se bloqueará
    y se perderá el control del vehículo.
- id: 267
  category: safe_driving_rules
  question: ¿Por qué debe evitar conducir con el codo o el brazo apoyado en la puerta
    o fuera de la ventana?
  choices:
    A: Hace que el volante se bloquee.
    B: Es ilegal en el estado de Tennessee.
    C: No tendrá el control total del volante y un choque lateral podría arrancarle
      el brazo.
    D: Interfiere con el despliegue de las bolsas de aire laterales.
  answer: C
  explanation: No desarrolle el hábito de conducir con el codo o el brazo apoyado
    en la puerta o fuera de la ventana. No tendrá el control total del volante y un
    choque lateral podría arrancarle el brazo.
- id: 268
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos en el volante para evitar
    lesiones por el despliegue de la bolsa de aire?
  choices:
    A: A las 10 y a las 2 en punto
    B: A las 8 y a las 4 en punto
    C: A las 9 y a las 3 en punto
    D: A las 12 y a las 6 en punto
  answer: C
  explanation: Los conductores deben colocar la mano izquierda en la posición de las
    9 en punto y la mano derecha en la posición de las 3 en punto en el volante. Esta
    posición ayuda a evitar lesiones por el despliegue de la bolsa de aire durante
    un accidente.
- id: 269
  category: safe_driving_rules
  question: ¿Por qué se desaconseja cruzar los brazos al maniobrar o girar el volante?
  choices:
    A: Hace que el vehículo acelere involuntariamente.
    B: Es ilegal y resultará en reprobar el examen de manejo.
    C: Impide que el conductor use las luces direccionales.
    D: Puede hacer que la ropa y las joyas interfieran con un giro seguro y empeorar
      las lesiones causadas por la bolsa de aire.
  answer: D
  explanation: No cruce los brazos al maniobrar o girar el volante. Cruzar los brazos
    puede hacer que la ropa y las joyas interfieran con un giro seguro, y sufriría
    lesiones más graves si la bolsa de aire se despliega.
- id: 270
  category: safe_driving_rules
  question: ¿Por qué se recomienda el método de dirección de "empujar y tirar" (Push-Pull)
    para la conducción diaria normal en lugar del método de "mano sobre mano" (Hand-over-Hand)?
  choices:
    A: Permite un movimiento más rápido del volante en emergencias.
    B: Mantiene ambas manos en el volante durante toda la maniobra.
    C: Requiere menos esfuerzo físico para girar el volante.
    D: Es el único método que funciona con la dirección asistida.
  answer: B
  explanation: Se recomienda el método de "empujar y tirar" porque ralentiza los movimientos
    de giro, logrando un giro más suave y seguro. También mantiene ambas manos en
    el volante durante toda la maniobra.
- id: 271
  category: safe_driving_rules
  question: ¿Cuál es la posición correcta de las manos y la postura al dar marcha
    atrás en un vehículo con transmisión automática?
  choices:
    A: Sujete el volante en la posición de las 12 en punto con la mano izquierda,
      gírese hacia la derecha y coloque el brazo derecho sobre el respaldo del asiento.
    B: Sujete el volante en la posición de las 9 y las 3 en punto y mire por el espejo
      retrovisor.
    C: Sujete el volante en la posición de las 6 en punto con la mano derecha y mire
      por la ventana del lado del conductor.
    D: Mantenga ambas manos en el volante y dependa completamente de la cámara de
      marcha atrás.
  answer: A
  explanation: Al dar marcha atrás, sujete el volante en la posición de las 12 en
    punto con la mano izquierda, gírese hacia la derecha, coloque el brazo derecho
    sobre el respaldo del asiento y mire por encima de su hombro a través de la ventana
    trasera.
- id: 272
  category: driver_responsibility
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto al gas monóxido
    de carbono del motor de un automóvil?
  choices:
    A: Tiene un olor fuerte y distintivo que advierte a los conductores de una fuga.
    B: Aparece como un humo negro y espeso cuando se filtra en la cabina.
    C: Solo es peligroso si el vehículo está estacionado en un garaje cerrado.
    D: No tiene sabor, ni olor, ni es visible, pero puede matar.
  answer: D
  explanation: El gas monóxido de carbono del motor de un automóvil puede matar (no
    tiene sabor, olor ni es visible). Generalmente se filtra cuando la calefacción
    del automóvil está encendida, cuando el sistema de escape no funciona correctamente
    o en tráfico pesado.
- id: 273
  category: defensive_driving
  question: Según el manual, ¿cuál es el tipo de accidente más común registrado anualmente
    en Tennessee?
  choices:
    A: Choques frontales
    B: Choques laterales
    C: Choques por alcance (colisiones traseras)
    D: Choques en forma de T en intersecciones
  answer: C
  explanation: Al igual que la mayoría de los estados, Tennessee informa que los choques
    por alcance son el tipo de accidente más común registrado anualmente.
- id: 274
  category: safe_driving_rules
  question: Si se detiene junto a un bordillo para estacionarse correctamente, ¿qué
    tan cerca debe acercarse al bordillo?
  choices:
    A: A no más de 6 pulgadas
    B: A no más de 12 pulgadas
    C: A no más de 18 pulgadas
    D: A no más de 24 pulgadas
  answer: C
  explanation: Si se detiene junto a un bordillo, acérquese a no más de 18 pulgadas
    del bordillo para estacionarse correctamente.
- id: 275
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una forma recomendada de evitar la intoxicación
    por monóxido de carbono en su vehículo?
  choices:
    A: Mantener abierta la ventilación de aire fresco en tráfico congestionado.
    B: Dejar el motor en marcha en un garaje cerrado para calentarlo.
    C: No usar la calefacción ni el aire acondicionado en un automóvil estacionado
      con las ventanas cerradas.
    D: Solo revisar el sistema de escape si huele a gas.
  answer: C
  explanation: El manual indica que para evitar la intoxicación por monóxido de carbono,
    usted 'No debe usar la calefacción/aire acondicionado en un automóvil estacionado
    con las ventanas cerradas'.
- id: 276
  category: vehicle_information
  question: ¿Cuáles son las características del gas monóxido de carbono?
  choices:
    A: Tiene un olor fuerte y dulce.
    B: Aparece como un humo negro y espeso.
    C: No tiene sabor, ni olor, ni es visible.
    D: Huele a huevos podridos.
  answer: C
  explanation: Según el manual, el gas monóxido de carbono del motor de un automóvil
    puede matar porque 'no tiene sabor, olor ni es visible'.
- id: 277
  category: safe_driving_rules
  question: Según la ley de Manos Libres de Tennessee (Hands Free Tennessee law) implementada
    en 2019, ¿cuál de las siguientes acciones es ilegal para un conductor?
  choices:
    A: Usar un dispositivo de navegación manos libres.
    B: Alcanzar un teléfono celular de una manera que requiera que el conductor ya
      no esté correctamente sujeto por el cinturón de seguridad.
    C: Usar la pantalla del sistema de información del vehículo.
    D: Mirar pantallas visuales que muestran la vista del conductor detrás del vehículo.
  answer: B
  explanation: El Capítulo Público No. 412 hace que sea ilegal 'alcanzar un teléfono
    celular o dispositivo móvil de una manera que requiera que el conductor ya no
    esté en una posición de conducción sentado o correctamente sujeto por un cinturón
    de seguridad'.
- id: 278
  category: safe_driving_rules
  question: ¿Cuál es la ley con respecto al uso de teléfonos móviles para conductores
    de 18 años o más en una zona escolar marcada cuando las luces intermitentes están
    funcionando?
  choices:
    A: Todo uso del teléfono está estrictamente prohibido, incluido el manos libres.
    B: El uso del teléfono en la mano es una infracción, pero se permite el modo manos
      libres.
    C: Se permite el uso del teléfono en la mano si se conduce a menos de 15 mph.
    D: Solo está prohibido enviar mensajes de texto; se permiten las llamadas con
      el teléfono en la mano.
  answer: B
  explanation: El manual indica que es una infracción para las personas de 18 años
    o más usar un teléfono móvil en la mano en una zona escolar marcada con las luces
    intermitentes funcionando, pero 'Hay una excepción si el teléfono se usa en modo
    manos libres'.
- id: 279
  category: vehicle_information
  question: ¿Cuál de los siguientes dispositivos de video está permitido que sea visible
    para el conductor mientras el vehículo está en movimiento?
  choices:
    A: Una pantalla que muestra una transmisión de televisión.
    B: Un monitor que reproduce una película grabada.
    C: Un dispositivo de posicionamiento global (GPS).
    D: Una tableta que transmite un video en vivo.
  answer: C
  explanation: La ley estatal prohíbe los monitores de video que muestran señales
    de televisión o video visibles para el conductor, pero 'Un dispositivo de navegación
    o posicionamiento global... no están prohibidos'.
- id: 280
  category: safe_driving_rules
  question: Según las leyes de cinturones de seguridad de Tennessee, ¿quién está obligado
    a usar el cinturón de seguridad en el asiento delantero de un vehículo en movimiento?
  choices:
    A: Solo el conductor.
    B: Solo los pasajeros menores de 18 años.
    C: Todos los conductores y todos los pasajeros en el asiento delantero.
    D: Solo el conductor y los pasajeros menores de 17 años.
  answer: C
  explanation: 'El manual indica: ''Se requieren cinturones de seguridad para TODOS
    los conductores y todos los pasajeros en el asiento DELANTERO, en cualquier momento
    que el vehículo esté en movimiento''.'
- id: 281
  category: safe_driving_rules
  question: 'En Tennessee, los pasajeros del asiento trasero deben usar el cinturón
    de seguridad si:'
  choices:
    A: Tienen menos de 17 años.
    B: Tienen 18 años o más.
    C: Están sentados detrás del asiento del conductor.
    D: Viajan en un vehículo fabricado después de 2010.
  answer: A
  explanation: Se requieren cinturones de seguridad para los pasajeros del ASIENTO
    TRASERO 'Si los pasajeros tienen menos de 17 años'. Esta disposición ya no se
    aplica cuando los pasajeros del asiento trasero tienen 18 años o más.
- id: 282
  category: safe_driving_rules
  question: ¿Qué tipo de sistema de retención infantil se requiere para un niño menor
    de un año o que pese menos de 20 libras?
  choices:
    A: Un asiento de seguridad orientado hacia adelante.
    B: Un asiento de seguridad orientado hacia atrás.
    C: Un asiento elevado (booster) que posicione el cinturón.
    D: Un cinturón de seguridad estándar para adultos.
  answer: B
  explanation: 'El manual especifica: ''Un niño menor de un año, o cualquier niño
    que pese menos de 20 libras, debe estar en un sistema de retención de pasajeros
    infantiles (asiento de seguridad) orientado hacia la parte trasera del automóvil''.'
- id: 283
  category: safe_driving_rules
  question: 'Un niño de entre cuatro y ocho años de edad y que mida menos de cuatro
    pies y nueve pulgadas de altura debe estar asegurado en:'
  choices:
    A: Un asiento de seguridad orientado hacia atrás.
    B: Un asiento de seguridad orientado hacia adelante.
    C: Un sistema de asiento elevado (booster) que posicione el cinturón.
    D: El asiento del pasajero delantero con un cinturón de seguridad estándar.
  answer: C
  explanation: Los niños de entre cuatro y ocho años de edad y cuya altura sea inferior
    a cuatro pies y nueve pulgadas, deben estar en un sistema de asiento elevado (booster)
    que posicione el cinturón y llevar puesto el cinturón de seguridad.
- id: 284
  category: driver_responsibility
  question: Si un niño menor de 16 años no está debidamente asegurado en un vehículo,
    ¿quién es generalmente considerado responsable y puede ser multado?
  choices:
    A: El niño.
    B: El conductor del vehículo.
    C: El propietario del vehículo, incluso si no está presente.
    D: El fabricante del vehículo.
  answer: B
  explanation: La ley hace al conductor responsable de la protección de los niños
    hasta la edad de dieciséis años. Si no están debidamente asegurados, el conductor
    puede ser acusado y multado con $50.00.
- id: 285
  category: driver_responsibility
  question: Si el padre o tutor legal de un niño está presente en el automóvil pero
    NO está conduciendo, ¿quién es responsable de garantizar que el niño sea transportado
    adecuadamente?
  choices:
    A: El conductor.
    B: El padre o tutor legal.
    C: Tanto el conductor como el padre por igual.
    D: El niño.
  answer: B
  explanation: 'El manual señala: ''Si el padre o tutor legal del niño está presente
    en el automóvil pero no conduce, entonces el padre o tutor legal es responsable
    de asegurarse de que el niño sea transportado adecuadamente y puede ser multado
    por incumplimiento''.'
- id: 286
  category: defensive_driving
  question: ¿Cuál es la probabilidad de morir en un choque si sale expulsado de un
    vehículo?
  choices:
    A: Una de cada dos.
    B: Una de cada cuatro.
    C: Una de cada ocho.
    D: Una de cada diez.
  answer: C
  explanation: Según la sección de Datos sobre el Cinturón de Seguridad, 'La probabilidad
    de morir en un choque al salir expulsado de un vehículo es de una de cada ocho'.
- id: 287
  category: safe_driving_rules
  question: ¿Cómo debe usar el cinturón de seguridad del vehículo una mujer embarazada?
  choices:
    A: El cinturón de regazo por encima del abdomen y el cinturón de hombro detrás
      de la espalda.
    B: El cinturón de regazo por debajo del abdomen y el cinturón de hombro por encima
      del vientre.
    C: Solo el cinturón de regazo, colocado directamente sobre el abdomen.
    D: Solo el cinturón de hombro, colocado debajo del brazo.
  answer: B
  explanation: 'El manual indica: ''Las mujeres embarazadas deben usar el cinturón
    de regazo por debajo del abdomen y el cinturón de hombro por encima del vientre''.'
- id: 288
  category: penalties_and_points
  question: ¿Cuál es la multa máxima para un conductor sorprendido usando un teléfono
    de mano para transmitir o leer un mensaje escrito mientras el vehículo está en
    movimiento (excluyendo los costos judiciales)?
  choices:
    A: Diez dólares.
    B: Veinticinco dólares.
    C: Cincuenta dólares.
    D: Cien dólares.
  answer: C
  explanation: Las infracciones por usar un teléfono de mano para transmitir o leer
    un mensaje escrito mientras se está en movimiento 'pueden resultar en una multa
    que no exceda los cincuenta dólares, y costos judiciales que no excedan los diez
    dólares'.
- id: 289
  category: penalties_and_points
  question: ¿Cuál es la sanción para un conductor que no usa un asiento de seguridad
    o un asiento elevado (booster) para un niño menor de nueve años o cuya altura
    es inferior a cuatro pies y nueve pulgadas?
  choices:
    A: Un delito menor de Clase A y la suspensión de la licencia.
    B: Un delito menor de Clase C, asistencia obligatoria a una clase y posibles tarifas/multas.
    C: Una simple multa de $10 sin otras sanciones.
    D: Una advertencia por la primera infracción y una multa de $50 por la segunda.
  answer: B
  explanation: 'Si la infracción se relaciona con no usar un asiento de seguridad
    o un asiento elevado (booster) para niños menores de nueve años o de menos de
    4''9", el castigo es mayor: ''El conductor puede ser acusado de un delito menor
    de Clase C, se le puede exigir que asista a una clase sobre el transporte seguro
    de niños y que pague posibles tarifas y multas''.'
- id: 290
  category: safe_driving_rules
  question: Según el manual, ¿cuántas veces más probabilidades tienen los ocupantes
    expulsados de morir en un choque en comparación con los que permanecen dentro
    del vehículo?
  choices:
    A: Dos veces más probabilidades
    B: Tres veces más probabilidades
    C: Cuatro veces más probabilidades
    D: Diez veces más probabilidades
  answer: C
  explanation: El manual señala que los ocupantes expulsados tienen cuatro veces más
    probabilidades de morir que aquellos que permanecen dentro del vehículo.
- id: 291
  category: vehicle_information
  question: ¿Qué les sucede a los pasajeros sin cinturón de seguridad cuando un vehículo
    es impactado por el costado?
  choices:
    A: Se deslizarán hacia el punto del impacto.
    B: Se deslizarán en dirección opuesta al punto del impacto.
    C: Serán empujados hacia el asiento trasero.
    D: Permanecerán inmóviles mientras el vehículo se mueve.
  answer: A
  explanation: Cuando un vehículo es impactado por el costado, todo lo que no esté
    sujeto, incluidos los pasajeros, se deslizará hacia el punto del impacto, no en
    dirección opuesta.
- id: 292
  category: safe_driving_rules
  question: ¿Cuándo se considera que un niño es lo suficientemente grande para pasar
    de un sistema de retención infantil a usar los cinturones de seguridad estándar
    de regazo y hombro del vehículo?
  choices:
    A: Cuando alcanzan las 40 libras de peso.
    B: Cuando tienen al menos 6 años de edad.
    C: Cuando pueden sentarse con la espalda apoyada en el respaldo del asiento y
      sus rodillas se doblan sobre el borde.
    D: Cuando pueden abrocharse el cinturón de seguridad por sí mismos sin ayuda.
  answer: C
  explanation: Un niño es lo suficientemente grande para usar el cinturón de regazo
    y hombro del vehículo cuando puede sentarse con la espalda apoyada en el respaldo
    del asiento del vehículo y sus rodillas se doblan sobre el borde del asiento.
- id: 293
  category: safe_driving_rules
  question: ¿Dónde debe quedar ajustado de forma segura el cinturón de regazo en un
    niño que ha pasado a usar los cinturones de seguridad estándar del vehículo?
  choices:
    A: A través del estómago
    B: En la parte superior del muslo, bajo y ajustado alrededor de las caderas
    C: A través de la caja torácica
    D: Suelto sobre las rodillas
  answer: B
  explanation: El manual especifica que el cinturón de regazo debe quedar ajustado
    de forma segura en la parte superior del muslo del niño, bajo y ceñido alrededor
    de las caderas.
- id: 294
  category: safe_driving_rules
  question: ¿A qué edad indica el manual que los niños viajan más seguros en el asiento
    trasero de un vehículo?
  choices:
    A: 8 años o menos
    B: 10 años o menos
    C: 12 años o menos
    D: 15 años o menos
  answer: C
  explanation: El manual enfatiza que los niños de 12 años o menos viajan más seguros
    en el asiento trasero de un vehículo.
- id: 295
  category: vehicle_information
  question: ¿Cuál es la distancia recomendada a la que un conductor debe sentarse
    del volante para darle espacio a la bolsa de aire (airbag) para desplegarse de
    manera segura?
  choices:
    A: De 4 a 6 pulgadas
    B: De 6 a 8 pulgadas
    C: De 10 a 12 pulgadas
    D: De 15 a 18 pulgadas
  answer: C
  explanation: La Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA) recomienda una distancia de diez a doce pulgadas entre el pecho y el módulo
    de la bolsa de aire.
- id: 296
  category: penalties_and_points
  question: Según la ley de Tennessee, ¿cuál es la regla con respecto a los niños
    menores de 6 años que viajan en la caja de una camioneta (pickup)?
  choices:
    A: Es legal si están supervisados por un adulto.
    B: Es ilegal bajo cualquier circunstancia.
    C: Es legal solo en carreteras del condado.
    D: Es legal si la camioneta viaja a menos de 30 mph.
  answer: B
  explanation: En Tennessee es ilegal permitir que cualquier niño menor de 6 años
    viaje en la caja de una camioneta (pickup).
- id: 297
  category: safe_driving_rules
  question: ¿En qué tipo de vía es ilegal permitir que un niño de entre 6 y 12 años
    viaje en la caja de una camioneta (pickup)?
  choices:
    A: Cualquier carretera estatal o interestatal
    B: Cualquier camino privado
    C: Cualquier camino de tierra
    D: Cualquier entrada residencial
  answer: A
  explanation: Es ilegal permitir que cualquier niño de entre 6 y 12 años viaje en
    la caja de una camioneta (pickup) en cualquier carretera estatal o interestatal.
- id: 298
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una excepción que permite a un niño viajar
    en la caja de una camioneta (pickup)?
  choices:
    A: Al viajar a un evento escolar
    B: Cuando participa en actividades agrícolas
    C: Cuando no quedan asientos en la cabina
    D: Al conducir hacia un parque estatal
  answer: B
  explanation: Una excepción a la ley que prohíbe que los niños viajen en la caja
    de una camioneta es cuando el niño participa en actividades agrícolas.
- id: 299
  category: penalties_and_points
  question: ¿Es un delito dejar a sabiendas a un niño desatendido en un vehículo motorizado
    si el niño es menor de qué edad?
  choices:
    A: 5 años de edad
    B: 7 años de edad
    C: 9 años de edad
    D: 12 años de edad
  answer: B
  explanation: Es un delito que una persona responsable de un niño menor de 7 años
    deje a sabiendas a ese niño desatendido en un vehículo motorizado bajo ciertas
    condiciones.
- id: 300
  category: safe_driving_rules
  question: Si un niño menor de 7 años se deja en un vehículo motorizado con el motor
    en marcha, debe ser supervisado por una persona que tenga al menos ¿qué edad?
  choices:
    A: 10 años de edad
    B: 13 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: La ley establece que el niño debe ser supervisado en el vehículo motorizado
    por una persona que tenga al menos 13 años de edad.
- id: 301
  category: penalties_and_points
  question: ¿Cuál es la sanción por una primera infracción de dejar a un niño desatendido
    en un vehículo motorizado bajo condiciones ilegales?
  choices:
    A: Un delito menor de Clase C y una multa de $50
    B: Un delito menor de Clase B y una multa de $200
    C: Un delito menor de Clase A y una multa de $500
    D: Un cargo de delito grave y la suspensión de la licencia
  answer: B
  explanation: Una violación de esta sección es un delito menor de Clase B castigable
    únicamente con una multa de doscientos dólares ($200) por la primera infracción.
- id: 302
  category: safe_driving_rules
  question: Según el manual, ¿cuántas veces más probabilidades tienen los ocupantes
    de un vehículo de morir en un choque si no llevan puesto el cinturón de seguridad?
  choices:
    A: 5 veces más probabilidades
    B: 10 veces más probabilidades
    C: 20 veces más probabilidades
    D: 32 veces más probabilidades
  answer: D
  explanation: Los ocupantes de un vehículo tenían 32 veces más probabilidades de
    morir en un choque si no llevaban puesto el cinturón de seguridad.
- id: 303
  category: vehicle_information
  question: Si un niño debe viajar en el asiento delantero de una camioneta (pickup)
    con bolsa de aire en el lado del pasajero, ¿qué debe hacer?
  choices:
    A: Apagar el motor del vehículo.
    B: Mover el asiento hacia atrás lo más posible y abrochar correctamente al niño.
    C: Hacer que el niño se siente en el regazo de un adulto.
    D: Colocar al niño en un asiento de seguridad orientado hacia atrás.
  answer: B
  explanation: Si un niño debe viajar en el asiento delantero de un vehículo como
    una camioneta (pickup) con bolsa de aire en el lado del pasajero, el asiento debe
    moverse hacia atrás lo más posible y el niño debe estar abrochado correctamente.
- id: 304
  category: safe_driving_rules
  question: En un día templado con una temperatura exterior de 73 grados, ¿qué tanto
    puede calentarse el interior de un SUV en solo 10 minutos?
  choices:
    A: 85 grados
    B: 90 grados
    C: 100 grados
    D: 120 grados
  answer: C
  explanation: Según el manual, incluso en un día templado a 73 grados en el exterior,
    un SUV puede calentarse hasta 100 grados en 10 minutos.
- id: 305
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por un delito menor de Clase A relacionado
    con dejar a un niño desatendido en un vehículo?
  choices:
    A: 6 meses de cárcel y una multa de $1,000
    B: 11 meses, 29 días y/o una multa de hasta $2,500
    C: 1 a 5 años de prisión
    D: 15 a 60 años de prisión
  answer: B
  explanation: Los delitos menores de Clase A conllevan una sanción no mayor a 11
    meses y 29 días, o una multa de hasta $2,500, o ambas.
- id: 306
  category: safe_driving_rules
  question: ¿Cuál es el lugar más seguro para que viajen los niños de 12 años o menos
    en un vehículo equipado con bolsas de aire?
  choices:
    A: El asiento del pasajero delantero
    B: El asiento trasero
    C: El medio del asiento delantero tipo banca
    D: La caja de una camioneta (pickup)
  answer: B
  explanation: El manual indica que el lugar más seguro para que viajen los niños
    de 12 años o menos en un vehículo equipado con bolsas de aire es el asiento trasero.
- id: 307
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de control de tráfico en el manejo
    de incidentes, como accidentes de tráfico o derrames de materiales peligrosos?
  choices:
    A: Naranja
    B: Rosa fluorescente
    C: Marrón
    D: Rojo
  answer: B
  explanation: El rosa fluorescente (a veces llamado "coral") se utiliza para las
    señales de control de tráfico en el manejo de incidentes cuando es necesario por
    eventos como accidentes de tráfico, incendios forestales, inundaciones y derrames
    de materiales peligrosos.
- id: 308
  category: signs_and_signals
  question: ¿Qué tipo de información indica una señal de tráfico marrón?
  choices:
    A: Áreas de recreación pública y puntos de interés cultural
    B: Construcción de carreteras y desvíos
    C: Regulaciones de estacionamiento permitido
    D: Servicios policiales y áreas de descanso
  answer: A
  explanation: El marrón se utiliza como color de fondo para las señales de información
    de guía relacionadas con puntos de interés recreativo y cultural.
- id: 309
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico de ocho lados (octágono)?
  choices:
    A: Ceder el paso
    B: Cruce de ferrocarril más adelante
    C: Alto (Pare)
    D: Zona escolar más adelante
  answer: C
  explanation: La forma de octágono es la única señal de ocho lados en la vía. Siempre
    será roja con letras blancas y le indica que debe detener su vehículo por completo.
- id: 310
  category: signs_and_signals
  question: 'Una señal de tráfico circular (redonda) indica que se está aproximando
    a:'
  choices:
    A: Una intersección de cuatro vías
    B: Un cruce a nivel de ferrocarril
    C: Una zona de hospital
    D: Una rotonda
  answer: B
  explanation: Una señal circular siempre significa que se está aproximando a un cruce
    a nivel de ferrocarril y debe reducir la velocidad.
- id: 311
  category: safe_driving_rules
  question: Si un trabajador de construcción de carreteras le indica que avance, pero
    el semáforo está en rojo, ¿qué debe hacer?
  choices:
    A: Esperar a que el semáforo cambie a verde antes de avanzar.
    B: Obedecer al trabajador de construcción y avanzar.
    C: Hacerse a un lado y esperar a un oficial de policía.
    D: Tocar la bocina para advertir a otros conductores.
  answer: B
  explanation: Los conductores deben obedecer las instrucciones de las fuerzas del
    orden, el personal de construcción de carreteras o los guardias de cruce escolar,
    incluso si las instrucciones son diferentes a lo que indican los semáforos y las
    señales.
- id: 312
  category: signs_and_signals
  question: Al acercarse a una señal triangular de tres lados de Ceda el paso (Yield),
    ¿qué debe hacer si se acercan otros vehículos por la otra vía?
  choices:
    A: Acelerar para incorporarse delante de ellos.
    B: Mantener su velocidad y tocar la bocina.
    C: Detenerse y esperar a los vehículos que se acercan.
    D: Avanzar sin detenerse, ya que usted tiene el derecho de paso.
  answer: C
  explanation: Una señal de Ceda el paso de tres lados significa que debe detenerse
    y esperar cuando se acercan otros vehículos por la derecha o por la izquierda
    en la otra vía.
- id: 313
  category: signs_and_signals
  question: ¿Cuál de las siguientes opciones indica una señal de tráfico azul?
  choices:
    A: Zonas de construcción
    B: Servicios para automovilistas, como policía y áreas de descanso
    C: Advertencias generales
    D: Normas de estacionamiento permitido
  answer: B
  explanation: El azul se utiliza como color de fondo para las señales de información
    relacionadas con los servicios para automovilistas (incluidos los servicios policiales
    y las áreas de descanso) y el Marcador de Ruta de Emergencia.
- id: 314
  category: safe_driving_rules
  question: Según las normas de sistemas de retención infantil, ¿cuándo debe ir un
    niño mirando hacia la parte trasera del vehículo?
  choices:
    A: Si el niño tiene menos de 1 año y pesa menos de 20 libras.
    B: Si el niño tiene entre 1 y 3 años.
    C: Si el niño pesa más de 20 libras.
    D: Si el niño viaja en el asiento del pasajero delantero.
  answer: A
  explanation: Un niño en un sistema de retención infantil (asiento de seguridad)
    debe ir mirando hacia la parte trasera del vehículo si pesa menos de 20 libras
    y tiene menos de 1 año.
- id: 315
  category: signs_and_signals
  question: ¿Qué significa una señal rectangular roja con las palabras "ALL WAY" (Todas
    las vías) colocada debajo de una señal de alto (Stop)?
  choices:
    A: Solo el tráfico transversal debe detenerse.
    B: Todo el tráfico que se acerque a esta intersección debe detenerse.
    C: Puede avanzar sin detenerse si la vía está despejada.
    D: La carretera más adelante está cerrada a todo el tráfico.
  answer: B
  explanation: Un rectángulo rojo añadido debajo de una señal de alto con "ALL WAY"
    significa que todo el tráfico que se acerque a esta intersección debe detenerse.
- id: 316
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una señal de Ceda el paso (Yield) de tres
    lados?
  choices:
    A: Detenerse por completo siempre, independientemente del tráfico.
    B: Acelerar para incorporarse suavemente al tráfico transversal.
    C: Reducir la velocidad y entrar en la intersección con precaución si no vienen
      otros vehículos.
    D: Detenerse solo si hay un semáforo presente.
  answer: C
  explanation: El manual indica que en una señal de Ceda el paso, si está seguro de
    que no vienen otros vehículos, no es necesario detenerse por completo, pero debe
    reducir la velocidad y entrar en la intersección con precaución.
- id: 317
  category: signs_and_signals
  question: ¿Cuál es el propósito de las señales más pequeñas colocadas directamente
    debajo de una señal de cruce de ferrocarril en forma de 'X' ancha (cruz de San
    Andrés)?
  choices:
    A: Indican el límite de velocidad para el cruce.
    B: Muestran el número de vías en ese cruce en particular.
    C: Advierten de la hora exacta en que suelen pasar los trenes.
    D: Indican la distancia hasta la próxima intersección de la carretera.
  answer: B
  explanation: El manual señala que las señales más pequeñas colocadas en el poste
    directamente debajo de la cruz de San Andrés muestran el número de vías en un
    cruce en particular.
- id: 318
  category: safe_driving_rules
  question: Según el manual, ¿por qué nunca debe intentar 'ganarle' a un tren en un
    cruce de ferrocarril?
  choices:
    A: Los trenes tienen el derecho de paso solo durante las horas del día.
    B: Por lo general, calculará mal la velocidad del tren.
    C: Es ilegal cruzar las vías sin detenerse primero.
    D: El motor de su vehículo se apagará en las vías.
  answer: B
  explanation: 'El manual advierte explícitamente a los conductores: ''NUNCA INTENTE
    GANARLE AL TREN. POR LO GENERAL, CALCULARÁ MAL SU VELOCIDAD''.'
- id: 319
  category: signs_and_signals
  question: ¿Dónde se coloca típicamente en la vía una señal triangular de Zona de
    no adelantar (No Passing Zone)?
  choices:
    A: En el lado derecho de la vía.
    B: Suspendida directamente sobre el carril central.
    C: En el lado izquierdo de la vía.
    D: En la superficie del pavimento como un símbolo pintado.
  answer: C
  explanation: El manual indica que una señal triangular de Zona de no adelantar es
    amarilla o naranja y se coloca en el lado izquierdo de la vía.
- id: 320
  category: signs_and_signals
  question: ¿Cuál es la diferencia entre una señal de advertencia de giro y una señal
    de advertencia de curva?
  choices:
    A: Una señal de giro se usa para velocidades recomendadas de 30 mph o menos, mientras
      que una señal de curva es para velocidades entre 30 y 55 mph.
    B: Una señal de giro es naranja, mientras que una señal de curva es amarilla.
    C: Una señal de giro indica un callejón sin salida, mientras que una señal de
      curva indica una carretera sinuosa.
    D: Una señal de giro es solo para giros a la derecha, mientras que una señal de
      curva es solo para giros a la izquierda.
  answer: A
  explanation: El manual indica que la señal de giro se usa para marcar giros con
    una velocidad recomendada de 30 mph o menos, mientras que la señal de curva marca
    curvas con velocidades recomendadas en el rango de 30 a 55 mph.
- id: 321
  category: defensive_driving
  question: Cuando vea una señal de advertencia de caída de rocas en áreas montañosas,
    ¿a qué debe prestar atención?
  choices:
    A: A rocas que caigan directamente desde arriba sobre su vehículo.
    B: A rocas que ya puedan estar en la carretera.
    C: A vehículos de construcción descargando grava.
    D: A peatones arrojando rocas desde pasos elevados.
  answer: B
  explanation: El manual aclara que esta señal 'advierte sobre rocas que pueden estar
    en la carretera, no de rocas que puedan golpearlo desde arriba. Observe la calzada,
    no la colina'.
- id: 322
  category: sharing_the_road
  question: ¿Qué debe hacer cuando vea una señal de advertencia que le alerta sobre
    tráfico que se incorpora a su flujo principal de circulación?
  choices:
    A: Acelerar para bloquear el tráfico que se incorpora.
    B: Tocar la bocina para advertir a los vehículos que se incorporan que deben ceder
      el paso.
    C: Moverse al otro carril, si es posible, para permitirle al conductor que se
      incorpora un camino despejado.
    D: Detenerse por completo y dejar que los otros vehículos se incorporen.
  answer: C
  explanation: El manual aconseja que, después de revisar por el espejo retrovisor,
    debe moverse al otro carril, si es posible, para permitirle al conductor que se
    incorpora un camino despejado.
- id: 323
  category: signs_and_signals
  question: ¿De qué color y forma son generalmente las señales de construcción, mantenimiento
    u operaciones de emergencia?
  choices:
    A: Triángulos rojos y blancos.
    B: Círculos amarillos y negros.
    C: Rectángulos verdes y blancos.
    D: De color naranja con letras o símbolos negros, y en forma de diamante o rectangulares.
  answer: D
  explanation: El manual indica que las señales de zonas de trabajo generalmente tienen
    forma de diamante o rectangular, y son de color naranja con letras o símbolos
    negros.
- id: 324
  category: safe_driving_rules
  question: ¿Cómo debe conducir al pasar por una zona de trabajo guiada por dispositivos
    de canalización como barricadas o conos?
  choices:
    A: Mantener su vehículo en el medio del carril y obedecer el límite de velocidad
      indicado.
    B: Conducir lo más cerca posible de los conos para dejar espacio a los trabajadores.
    C: Cambiar de carril frecuentemente para encontrar la ruta más rápida a través
      de la zona.
    D: Conducir sobre la línea central para mantener una distancia segura de las barricadas.
  answer: A
  explanation: El manual instruye a los conductores a 'mantener su vehículo en el
    medio del carril y obedecer el límite de velocidad indicado' al conducir cerca
    de dispositivos de canalización.
- id: 325
  category: safe_driving_rules
  question: ¿Cómo se controlan algunas señales de límite de velocidad en zonas escolares
    para indicar cuándo pueden estar cruzando niños?
  choices:
    A: Por guardias de cruce sosteniendo paletas de alto.
    B: Por un temporizador que hace parpadear luces amarillas mientras ilumina el
      límite de velocidad.
    C: Por sensores de movimiento que detectan los vehículos que se aproximan.
    D: Por un semáforo rojo permanente.
  answer: B
  explanation: El manual indica que este tipo de señal está controlada por un temporizador
    y hace parpadear luces amarillas mientras ilumina el límite de velocidad.
- id: 326
  category: safe_driving_rules
  question: En una autopista con más de un carril en cada dirección, ¿qué significa
    la señal que le exige conducir en el carril del extremo derecho?
  choices:
    A: Debe conducir en el carril derecho a menos que desee rebasar a un vehículo
      que va más lento o hacer un giro a la izquierda.
    B: Debe conducir siempre en el carril derecho, incluso al rebasar.
    C: Debe conducir sobre las líneas de los carriles si se mueve más lento que el
      resto del tráfico.
    D: Solo puede usar el carril derecho para estacionar o en caso de emergencias.
  answer: A
  explanation: El manual explica que esta señal significa 'que debe conducir en el
    carril del extremo derecho a menos que desee rebasar a un vehículo que va más
    lento o hacer un giro a la izquierda'.
- id: 327
  category: sharing_the_road
  question: ¿De qué color es la ropa que usan los abanderados, trabajadores de servicios
    públicos y oficiales de policía en las zonas de trabajo para asegurarse de ser
    vistos en condiciones de poca luz y mal tiempo?
  choices:
    A: Uniformes de color azul oscuro o negro.
    B: Ropa o chalecos de color amarillo-verde fluorescente.
    C: Trajes reflectantes de color blanco puro.
    D: Chaquetas de camuflaje.
  answer: B
  explanation: El manual menciona que los oficiales de policía y los abanderados/trabajadores
    usan 'chalecos amarillo-verde fluorescentes' y ropa para asegurarse de ser vistos
    en condiciones normales, así como en condiciones de poca luz y mal tiempo.
- id: 328
  category: signs_and_signals
  question: ¿Qué acción debe tomar cuando vea un panel de flecha intermitente que
    le alerta sobre el cierre de un carril más adelante?
  choices:
    A: Acelerar para pasar la zona de construcción rápidamente.
    B: Esperar hasta el último momento posible para incorporarse al carril abierto.
    C: Comenzar a incorporarse al carril o carriles abiertos restantes con mucha anticipación
      a la señal.
    D: Detener su vehículo inmediatamente y esperar las instrucciones de un abanderado.
  answer: C
  explanation: 'El manual instruye: ''Los paneles de flechas intermitentes alertan
    a los conductores que se aproximan sobre cierres de carriles. Debe comenzar a
    incorporarse al carril o carriles abiertos restantes con mucha anticipación a
    esta señal''.'
- id: 329
  category: safe_driving_rules
  question: ¿Qué debe hacer al conducir cerca de dispositivos de canalización en una
    zona de trabajo?
  choices:
    A: Cambiar de carril rápidamente para evitarlos.
    B: Mantener su vehículo en el medio del carril y obedecer el límite de velocidad
      indicado.
    C: Conducir por el arcén (hombro) para dar más espacio a los trabajadores.
    D: Acelerar para salir de la zona de trabajo más rápido.
  answer: B
  explanation: El manual indica que al conducir cerca de dispositivos de canalización
    en una zona de trabajo, debe mantener su vehículo en el medio del carril y obedecer
    el límite de velocidad indicado.
- id: 330
  category: vehicle_information
  question: ¿Cuáles de los siguientes vehículos tienen más probabilidades de mostrar
    un emblema de Vehículo de Movimiento Lento (SMV, por sus siglas en inglés)?
  choices:
    A: Vehículos de emergencia respondiendo a una llamada.
    B: Autobuses comerciales y camiones grandes.
    C: Tractores agrícolas, maquinaria y vehículos tirados por caballos.
    D: Vehículos que transportan materiales peligrosos.
  answer: C
  explanation: Según el manual, puede ver el emblema SMV en vehículos de movimiento
    lento, como tractores agrícolas, maquinaria, equipos de construcción o vehículos
    tirados por caballos.
- id: 331
  category: signs_and_signals
  question: ¿Cuál es el propósito de una señal de marcador de objetos?
  choices:
    A: Marcar la línea central de una carretera de doble sentido.
    B: Indicar un cruce de peatones más adelante.
    C: Mostrar la distancia a la próxima salida de la autopista.
    D: Advertir sobre objetos cercanos al borde de la carretera, como los extremos
      de un puente.
  answer: D
  explanation: Los marcadores de objetos advierten a los conductores sobre objetos
    que no están realmente en la calzada, pero que están tan cerca del borde de la
    carretera que necesitan ser marcados, como los extremos de los puentes y los estribos
    de los pasos subterráneos.
- id: 332
  category: signs_and_signals
  question: ¿Qué colores se utilizan para las señales de marcadores de rutas interestatales?
  choices:
    A: Verde y blanco
    B: Azul y rojo
    C: Negro y blanco
    D: Amarillo y negro
  answer: B
  explanation: El manual establece que las señales azules y rojas indican que la ruta
    es parte del sistema nacional de carreteras interestatales y de defensa.
- id: 333
  category: signs_and_signals
  question: ¿De qué color son las señales que dirigen a los automovilistas a instalaciones
    de servicio como gasolineras, restaurantes y moteles?
  choices:
    A: Verde
    B: Marrón
    C: Azul
    D: Naranja
  answer: C
  explanation: El color azul de las señales de servicio dirige a los automovilistas
    a instalaciones de servicio como estaciones de servicio, restaurantes y moteles.
- id: 334
  category: safe_driving_rules
  question: ¿A quién se le permite legalmente estacionar en los espacios que muestran
    el símbolo azul de discapacidad?
  choices:
    A: A cualquier persona que se estacione por menos de 5 minutos.
    B: A mujeres embarazadas y familias con niños pequeños.
    C: A los vehículos que lleven placas de veterano discapacitado o de persona con
      discapacidad, o una calcomanía especial para personas con discapacidad.
    D: A conductores mayores de 65 años.
  answer: C
  explanation: Los espacios de estacionamiento que muestran la señal azul de discapacidad
    están reservados exclusivamente para vehículos que lleven placas de veterano discapacitado
    o de persona con discapacidad, o una calcomanía especial para personas con discapacidad.
    Su uso por parte de otras personas está prohibido por la ley.
- id: 335
  category: signs_and_signals
  question: ¿Con qué frecuencia se instalan marcadores de referencia de emergencia
    a lo largo de las secciones muy transitadas de las carreteras interestatales urbanas
    en Tennessee?
  choices:
    A: Cada 500 pies
    B: Cada 1,000 pies
    C: Cada 1 milla
    D: Cada 5 millas
  answer: B
  explanation: Para ayudar a los automovilistas a identificar mejor su ubicación,
    el estado ha instalado marcadores de referencia interestatal cada 1,000 pies a
    lo largo de las secciones muy transitadas de las carreteras interestatales urbanas.
- id: 336
  category: safe_driving_rules
  question: ¿Cuándo se le permite girar a la derecha con el semáforo en rojo?
  choices:
    A: En cualquier momento, sin detenerse.
    B: Solo cuando también esté iluminada una flecha verde.
    C: Después de detenerse por completo y cuando no haya peatones ni tráfico transversal,
      a menos que se indique lo contrario.
    D: Los giros a la derecha en rojo nunca están permitidos en Tennessee.
  answer: C
  explanation: A menos que se indique lo contrario, puede girar a la derecha en rojo
    después de detenerse por completo y cuando no haya peatones ni tráfico transversal.
- id: 337
  category: safe_driving_rules
  question: Según la ley de Tennessee, ¿cuál es el tiempo mínimo que debe mostrarse
    una luz amarilla en el semáforo antes de cambiar a rojo?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: B
  explanation: La ley de Tennessee solo requiere que la luz amarilla se muestre durante
    un mínimo de tres segundos antes de la luz roja.
- id: 338
  category: safe_driving_rules
  question: ¿Qué debe hacer si ya está DENTRO de la intersección cuando se enciende
    la luz amarilla del semáforo?
  choices:
    A: Detenerse inmediatamente en medio de la intersección.
    B: Poner su vehículo en reversa y retroceder para salir de la intersección.
    C: Acelerar significativamente para ganarle a la luz roja.
    D: No detenerse, sino continuar con precaución a través de la intersección.
  answer: D
  explanation: El manual indica que si ya está DENTRO de la intersección cuando se
    enciende la luz amarilla, no debe detenerse, sino continuar con precaución a través
    de la intersección.
- id: 339
  category: signs_and_signals
  question: ¿Qué indica una señal de semáforo con flecha roja?
  choices:
    A: Puede girar en la dirección de la flecha después de ceder el paso.
    B: Todos los giros en la dirección de la flecha están prohibidos, incluso si otros
      carriles de tráfico tienen una señal verde.
    C: Debe tratar la intersección como una parada de cuatro vías.
    D: Puede girar solo si conduce un vehículo de emergencia.
  answer: B
  explanation: Cuando la flecha es roja o su carril tiene la luz roja, todos los giros
    están prohibidos. Esto es cierto incluso si otros carriles de tráfico tienen una
    señal verde y su camino parece estar despejado.
- id: 340
  category: signs_and_signals
  question: ¿Qué significa una flecha amarilla intermitente en una intersección?
  choices:
    A: Se le permite girar a la izquierda después de ceder el paso a todo el tráfico
      en sentido contrario, ciclistas y peatones.
    B: El semáforo está descompuesto y debe detenerse por completo.
    C: Tiene el derecho de paso protegido para girar a la izquierda sin ceder el paso.
    D: Los giros a la izquierda están completamente prohibidos.
  answer: A
  explanation: Si ve una flecha amarilla intermitente, se le permite girar a la izquierda
    después de ceder el paso a todo el tráfico en sentido contrario y a cualquier
    ciclista y peatón en el cruce peatonal.
- id: 341
  category: safe_driving_rules
  question: ¿Cómo debe tratar una intersección si el semáforo no funciona y la luz
    está apagada?
  choices:
    A: Proceder a través de la intersección sin detenerse si se encuentra en la vía
      principal.
    B: Tratarla como una señal de ceda el paso.
    C: Tratarla como una intersección de parada en todas las direcciones (all-way
      stop).
    D: Esperar a que llegue un oficial de policía antes de continuar.
  answer: C
  explanation: La ley del estado de Tennessee exige que, si un semáforo no funciona,
    la intersección debe tratarse como si fuera una intersección de parada en todas
    las direcciones (all-way stop).
- id: 342
  category: safe_driving_rules
  question: Si dos vehículos llegan a una intersección de parada en todas las direcciones
    al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la izquierda debe ceder el paso al conductor de la derecha.
    B: El conductor de la derecha debe ceder el paso al conductor de la izquierda.
    C: El vehículo que viaja a mayor velocidad pasa primero.
    D: El vehículo que gira a la izquierda siempre pasa primero.
  answer: A
  explanation: La ley de derecho de paso establece que si hay dos o más vehículos
    en la intersección deteniéndose al mismo tiempo, el conductor de la izquierda
    debe ceder el paso al conductor de la derecha.
- id: 343
  category: sharing_the_road
  question: ¿Cómo define la ley de Tennessee a un peatón?
  choices:
    A: Solo una persona que camina por una acera designada.
    B: Cualquier persona a pie o que use una silla de ruedas motorizada o no motorizada.
    C: Cualquier persona que ande en bicicleta o patineta.
    D: Cualquier persona que cruce la calle fuera de un cruce peatonal.
  answer: B
  explanation: La ley de Tennessee define a un peatón como cualquier persona a pie
    o que use una silla de ruedas motorizada o no motorizada.
- id: 344
  category: safe_driving_rules
  question: ¿Cuándo se requiere que encienda los faros de su vehículo por la noche?
  choices:
    A: Desde el atardecer hasta el amanecer.
    B: 30 minutos después del atardecer hasta 30 minutos antes del amanecer.
    C: 1 hora después del atardecer hasta 1 hora antes del amanecer.
    D: Solo cuando no hay luces en la calle (alumbrado público).
  answer: B
  explanation: El manual establece que los faros de su automóvil deben estar encendidos
    30 minutos después del atardecer hasta 30 minutos antes del amanecer.
- id: 345
  category: safe_driving_rules
  question: ¿Bajo qué condiciones climáticas se requiere que encienda los faros durante
    las horas de luz del día?
  choices:
    A: Solo cuando nieva fuertemente.
    B: Siempre que el cielo esté nublado.
    C: Cuando la precipitación requiere el uso constante de los limpiaparabrisas.
    D: Solo cuando conduce por la autopista interestatal bajo la lluvia.
  answer: C
  explanation: Los faros deben encenderse durante las horas de luz del día cuando
    la lluvia, la neblina, la nieve u otra precipitación requiera el uso constante
    de los limpiaparabrisas.
- id: 346
  category: safe_driving_rules
  question: ¿A qué distancia hacia adelante debe encender los faros durante el día
    si la luz natural no es lo suficientemente buena para ver claramente a personas
    o vehículos?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Los faros de su automóvil deben encenderse en cualquier momento en
    que la luz del día no sea lo suficientemente buena para que pueda ver claramente
    a personas o vehículos a una distancia de 200 pies hacia adelante.
- id: 347
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a deslizarse en punto muerto (coasting)
    mientras viaja en una pendiente descendente?
  choices:
    A: Se recomienda para ahorrar gasolina.
    B: Puede deslizarse en punto muerto pero no con el embrague pisado.
    C: Nunca debe deslizarse con la transmisión en punto muerto o el embrague pisado.
    D: Deslizarse en punto muerto solo está permitido en carreteras con un límite
      de velocidad inferior a 45 mph.
  answer: C
  explanation: Mientras viaja en una pendiente descendente, NUNCA se deslice con la
    transmisión del vehículo en punto muerto (neutral). Además, los conductores de
    vehículos de transmisión manual no deben deslizarse con el embrague pisado.
- id: 348
  category: safe_driving_rules
  question: Si un oficial de tránsito le indica que haga algo que normalmente violaría
    una norma de tránsito, ¿qué debe hacer?
  choices:
    A: Ignorar al oficial y seguir las señales de tránsito.
    B: Obedecer las instrucciones del oficial en todo momento.
    C: Pedirle al oficial su número de placa antes de continuar.
    D: Hacerse a un lado y esperar a que cambie el semáforo.
  answer: B
  explanation: Debe obedecer a los oficiales de tránsito en todo momento. Habrá ocasiones
    en las que un oficial le indicará que haga algo que normalmente sería una violación
    de las normas de tránsito en caso de una emergencia.
- id: 349
  category: defensive_driving
  question: Según las estadísticas, ¿dónde ocurren la mitad de todos los choques de
    vehículos?
  choices:
    A: En las autopistas interestatales.
    B: A menos de 25 millas de casa.
    C: En intersecciones concurridas.
    D: Durante viajes largos por carretera.
  answer: B
  explanation: Las estadísticas muestran que la mitad de todos los choques de vehículos
    ocurren a menos de 25 millas de casa.
- id: 350
  category: signs_and_signals
  question: ¿Cómo puede saber por las líneas de borde que está conduciendo en sentido
    contrario en una carretera?
  choices:
    A: Tiene una línea blanca a su derecha y una línea amarilla a su izquierda.
    B: Tiene una línea amarilla a su derecha y una línea blanca a su izquierda.
    C: Ambas líneas de borde son blancas.
    D: Ambas líneas de borde son amarillas.
  answer: B
  explanation: Si alguna vez se encuentra con una línea amarilla a su derecha y una
    blanca a su izquierda, va en sentido contrario.
- id: 351
  category: safe_driving_rules
  question: ¿Cuándo se le permite cruzar dos líneas amarillas continuas entre carriles
    de tráfico?
  choices:
    A: Para rebasar a un vehículo que se mueve lentamente
    B: Cuando no hay tráfico en sentido contrario a la vista
    C: Para girar hacia una entrada de vehículos o camino lateral si es seguro hacerlo
    D: Nunca puede cruzar dos líneas amarillas continuas bajo ninguna circunstancia
  answer: C
  explanation: Dos líneas amarillas continuas significan que NO PUEDE cruzar las líneas
    desde ninguna dirección para rebasar. Sin embargo, puede cruzar una línea amarilla
    continua para girar hacia una entrada de vehículos o camino lateral si es seguro
    hacerlo.
- id: 352
  category: signs_and_signals
  question: ¿Qué significa si el centro de la calzada está marcado con una línea amarilla
    continua y una línea amarilla discontinua, y la línea discontinua está de su lado?
  choices:
    A: Está en una zona para rebasar y puede rebasar si es seguro
    B: No se le permite rebasar en esta área
    C: Debe prepararse para detenerse
    D: El carril es solo para girar
  answer: A
  explanation: Si la línea amarilla discontinua está de su lado, se encuentra en la
    'zona para rebasar' y puede rebasar si es seguro hacerlo.
- id: 353
  category: signs_and_signals
  question: ¿Qué indica una sola línea blanca continua entre carriles de tráfico que
    fluyen en la misma dirección?
  choices:
    A: Puede cambiar de carril libremente para rebasar
    B: Debe mantenerse en su carril y no cruzar a menos que sea una emergencia
    C: El carril se termina y debe incorporarse a la izquierda
    D: Se está acercando a una plaza de peaje
  answer: B
  explanation: Una línea blanca continua entre carriles de tráfico significa que debe
    mantenerse en su carril y no debe cruzar la línea para rebasar (a menos que una
    situación de emergencia requiera que cambie de carril).
- id: 354
  category: safe_driving_rules
  question: ¿Dónde debe detener su vehículo en una intersección si no hay una línea
    de alto pintada ni un cruce peatonal?
  choices:
    A: Justo pasando la esquina para poder ver el tráfico claramente
    B: Antes de que el parachoques delantero cruce la línea blanca del borde de la
      calle transversal
    C: Al menos a 10 pies de distancia de la intersección
    D: Junto al poste de la señal de alto
  answer: B
  explanation: Si no hay una línea de alto pintada en el pavimento, todos los vehículos
    que deban detenerse deben hacerlo antes de que el parachoques delantero cruce
    la línea blanca del borde de la calle transversal, para evitar que el vehículo
    sobresalga hacia el tráfico de la calle transversal.
- id: 355
  category: signs_and_signals
  question: ¿Qué símbolo en el pavimento designa un carril para Vehículos de Alta
    Ocupación (HOV, por sus siglas en inglés)?
  choices:
    A: Una cruz de San Andrés blanca
    B: Un círculo pintado con una X
    C: Una marca en forma de diamante
    D: Una flecha blanca grande
  answer: C
  explanation: Los carriles para Vehículos de Alta Ocupación (HOV) se designan en
    las autopistas mediante una marca en forma de diamante en el centro del carril.
- id: 356
  category: signs_and_signals
  question: ¿Qué significa si su carril de circulación está marcado con una flecha
    curva y una flecha recta?
  choices:
    A: Debe girar en la dirección de la flecha
    B: Puede girar en la dirección de la flecha o seguir recto
    C: El carril se termina y debe incorporarse
    D: Se está acercando a una rotonda
  answer: B
  explanation: Si su carril está marcado con una flecha curva y una recta, puede girar
    en la dirección de la flecha o puede seguir recto.
- id: 357
  category: signs_and_signals
  question: ¿Qué marca en el pavimento sirve como advertencia de un cruce a nivel
    de ferrocarril/carretera?
  choices:
    A: Una forma de diamante con las letras RR
    B: Una cruz de San Andrés blanca y las letras RR
    C: Una línea amarilla continua con una X roja
    D: Una doble línea blanca continua
  answer: B
  explanation: Una cruz de San Andrés blanca y las letras RR se pintan en el pavimento
    como marca de advertencia para muchos cruces a nivel de ferrocarril/carretera.
- id: 358
  category: signs_and_signals
  question: ¿Qué significa una señal peatonal que muestra el símbolo de una mano levantada?
  choices:
    A: Los peatones tienen el derecho de paso para cruzar
    B: No es seguro comenzar a cruzar la calle
    C: Los peatones deben correr rápidamente para cruzar la intersección
    D: Los vehículos deben detenerse y esperar a que los peatones se acerquen
  answer: B
  explanation: Cuando la señal peatonal muestra las palabras 'DON’T WALK' (NO CAMINE),
    o aparece el símbolo de una mano levantada, no es seguro comenzar a cruzar una
    calle o intersección.
- id: 359
  category: safe_driving_rules
  question: ¿Cuándo se requiere que encienda los faros de su automóvil para uso nocturno
    en Tennessee?
  choices:
    A: Desde el atardecer hasta el amanecer
    B: 30 minutos después del atardecer hasta 30 minutos antes del amanecer
    C: 1 hora después del atardecer hasta 1 hora antes del amanecer
    D: Solo cuando está completamente oscuro afuera
  answer: B
  explanation: Según el manual, los faros de su automóvil deben encenderse 30 minutos
    después del atardecer hasta 30 minutos antes del amanecer.
- id: 360
  category: safe_driving_rules
  question: 'En Tennessee, la ley exige que encienda los faros durante el día o en
    condiciones climáticas adversas cuando:'
  choices:
    A: Conduce en cualquier autopista interestatal.
    B: Se requiere el uso constante de los limpiaparabrisas debido a la precipitación.
    C: Conduce en el carril más a la izquierda de una carretera de varios carriles.
    D: Se acerca a una procesión funeraria debidamente identificada.
  answer: B
  explanation: El manual establece que los faros deben encenderse cuando la lluvia,
    la neblina, la nieve u otra precipitación requieran el uso constante de los limpiaparabrisas.
- id: 361
  category: safe_driving_rules
  question: ¿Cuándo debe atenuar o bajar las luces altas de su vehículo?
  choices:
    A: Cuando un vehículo que se aproxima está a menos de 500 pies.
    B: Cuando un vehículo que se aproxima está a menos de 200 pies.
    C: Cuando un vehículo que se aproxima está a menos de 1,000 pies.
    D: Solo cuando conduce en áreas urbanas congestionadas.
  answer: A
  explanation: Debe atenuar o bajar las luces cuando un vehículo que se aproxima está
    a menos de 500 pies (aproximadamente la distancia de una cuadra de la ciudad)
    o cuando sigue a otro vehículo a menos de 500 pies.
- id: 362
  category: vehicle_information
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al uso
    de las luces de estacionamiento mientras conduce?
  choices:
    A: Deben usarse en lugar de los faros delanteros en caso de niebla densa.
    B: Es ilegal conducir un vehículo solo con las luces de estacionamiento encendidas
      de noche o con mal tiempo.
    C: Hacen que su vehículo parezca estar más cerca de otros conductores de lo que
      realmente está.
    D: Es obligatorio que estén encendidas en todo momento al conducir en una zona
      escolar.
  answer: B
  explanation: 'El manual establece: ''No conduzca un vehículo solo con las luces
    de estacionamiento encendidas cuando conduzca de noche o con mal tiempo... el
    uso exclusivo de las luces de estacionamiento no solo es inseguro, sino que va
    en contra de la ley''.'
- id: 363
  category: vehicle_information
  question: 'A partir del 1 de enero de 2018, las luces de iluminación fija que se
    muestran en la parte delantera de un vehículo en Tennessee deben ser:'
  choices:
    A: Blancas o ámbar
    B: Rojas o azules
    C: Verdes o amarillas
    D: De cualquier color siempre y cuando no parpadeen
  answer: A
  explanation: A partir del 1 de enero de 2018, ningún vehículo operado en Tennessee
    deberá estar equipado con luces de iluminación fija que se muestren en la parte
    delantera del vehículo de cualquier color que no sea blanco o ámbar (o una combinación
    de ambos).
- id: 364
  category: penalties_and_points
  question: ¿Cuáles son las posibles multas por una condena por tirar basura en Tennessee?
  choices:
    A: De $10 a $500
    B: De $50 a $3,000
    C: De $100 a $5,000
    D: De $250 a $10,000
  answer: B
  explanation: Tirar basura va en contra de la ley estatal. Las multas comienzan en
    $50 y pueden llegar hasta $3,000 dependiendo de la cantidad de basura.
- id: 365
  category: safe_driving_rules
  question: ¿Qué exige la ley de Tennessee a cualquier vehículo motorizado que transporte
    material que pueda caer o ser arrastrado por el viento hacia la carretera?
  choices:
    A: El material debe estar atado con cuerdas elásticas.
    B: El vehículo debe viajar al menos a 10 mph por debajo del límite de velocidad.
    C: El material debe estar en un espacio cerrado o completamente cubierto por una
      lona.
    D: El vehículo debe mostrar un letrero de 'Vehículo de movimiento lento'.
  answer: C
  explanation: La ley de Tennessee exige que cualquier vehículo motorizado que transporte
    basura o cualquier material que pueda caer o ser arrastrado por el viento hacia
    la carretera, esté en un espacio cerrado o completamente cubierto por una lona.
- id: 366
  category: safe_driving_rules
  question: 'Se considera que usted conduce un vehículo de movimiento lento si viaja
    a una velocidad que es:'
  choices:
    A: 5 mph o más por debajo de la velocidad máxima legal.
    B: 10 mph o más por debajo de la velocidad máxima legal.
    C: 15 mph o más por debajo de la velocidad máxima legal.
    D: 20 mph o más por debajo de la velocidad máxima legal.
  answer: B
  explanation: Se considera que usted conduce un vehículo de movimiento lento si viaja
    a una velocidad que es 10 millas por hora o más por debajo de la velocidad máxima
    legal.
- id: 367
  category: sharing_the_road
  question: Si conduce un vehículo de movimiento lento, ¿cuándo debe girar o salirse
    de la carretera de manera segura?
  choices:
    A: Cuando 2 o más vehículos estén en fila detrás de usted.
    B: Cuando 3 o más vehículos estén en fila detrás de usted.
    C: Cuando 5 o más vehículos estén en fila detrás de usted.
    D: Cuando 10 o más vehículos estén en fila detrás de usted.
  answer: C
  explanation: 'El manual establece: ''Si cinco o más vehículos están en fila detrás
    de usted, gire o sálgase de la carretera tan pronto como pueda hacerlo de manera
    segura''.'
- id: 368
  category: sharing_the_road
  question: ¿Cuál es la regla para rebasar a una procesión fúnebre en una carretera
    de dos carriles en Tennessee?
  choices:
    A: Puede rebasar si toca la bocina primero.
    B: Puede rebasar solo si la procesión viaja a menos de 45 mph.
    C: Los vehículos que siguen a la procesión no pueden intentar rebasarla.
    D: Puede rebasar si enciende las luces de emergencia.
  answer: C
  explanation: La ley de Tennessee indica que los vehículos que siguen a una procesión
    fúnebre en una carretera de dos carriles no pueden intentar rebasar a dicha procesión.
- id: 369
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe mejor la Regla Básica de Velocidad
    (BSR, por sus siglas en inglés)?
  choices:
    A: Es una estricta ley de Tennessee que establece límites de velocidad exactos
      para todas las carreteras.
    B: Enseña que la velocidad a la que puede conducir está limitada por las condiciones
      actuales.
    C: Exige que todos los conductores viajen exactamente al límite de velocidad publicado.
    D: Establece que conducir más despacio siempre es más seguro.
  answer: B
  explanation: La Regla Básica de Velocidad (BSR) no es una ley de Tennessee, sino
    un principio general de seguridad. No establece un límite de velocidad exacto;
    en cambio, enseña que la velocidad a la que puede conducir está limitada por las
    condiciones actuales.
- id: 370
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad en
    las carreteras estatales y federales primarias y secundarias en Tennessee?
  choices:
    A: 45 m.p.h.
    B: 55 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: B
  explanation: A menos que se indique lo contrario, el límite de velocidad en las
    carreteras estatales y federales primarias y secundarias es de 55 m.p.h.
- id: 371
  category: safe_driving_rules
  question: ¿Cuál es la velocidad máxima establecida por la ley de Tennessee para
    las autopistas interestatales?
  choices:
    A: 55 m.p.h.
    B: 60 m.p.h.
    C: 65 m.p.h.
    D: 70 m.p.h.
  answer: D
  explanation: La velocidad máxima establecida por la ley de Tennessee para las autopistas
    interestatales es de 70 m.p.h., la cual está señalizada en la mayoría de las secciones
    rurales.
- id: 372
  category: safe_driving_rules
  question: En condiciones normales de manejo, ¿a menos de qué velocidad es ilegal
    conducir en el carril del extremo izquierdo de cualquier autopista interestatal
    en Tennessee?
  choices:
    A: 45 m.p.h.
    B: 50 m.p.h.
    C: 55 m.p.h.
    D: 65 m.p.h.
  answer: C
  explanation: Es ilegal que cualquier persona conduzca un vehículo a menos de 55
    m.p.h. en el carril del extremo izquierdo de cualquier autopista interestatal,
    a menos que la congestión y el flujo del tráfico impidan conducir de manera segura
    a dicha velocidad.
- id: 373
  category: safe_driving_rules
  question: En las autopistas interestatales de Tennessee, ¿cuál es el límite de velocidad
    mínimo en el carril o carriles derechos en condiciones normales de manejo?
  choices:
    A: 35 m.p.h.
    B: 40 m.p.h.
    C: 45 m.p.h.
    D: 55 m.p.h.
  answer: C
  explanation: En las autopistas interestatales, el límite de velocidad mínimo en
    el carril o carriles derechos es de 45 m.p.h., y en condiciones normales de manejo,
    todos los vehículos deben viajar al menos a esta velocidad.
- id: 374
  category: penalties_and_points
  question: ¿Cuál es la sanción por exceder el límite de velocidad en una zona escolar
    en Tennessee?
  choices:
    A: Se agregan automáticamente dos puntos a su historial de manejo
    B: Se agregan automáticamente cuatro puntos a su historial de manejo
    C: Se agregan automáticamente seis puntos a su historial de manejo
    D: Suspensión automática de la licencia por 30 días
  answer: C
  explanation: Según el manual, la sanción por exceder el límite de velocidad en una
    zona escolar incluye la adición automática de seis puntos a su historial de manejo,
    lo que resulta en una carta de advertencia.
- id: 375
  category: penalties_and_points
  question: 'Por ley, exceder el límite de velocidad en una zona escolar se considera:'
  choices:
    A: Manejo descuidado
    B: Manejo imprudente
    C: Manejo agresivo
    D: Una infracción de tránsito menor
  answer: B
  explanation: El manual establece que exceder el límite de velocidad en una zona
    escolar se considera por ley como manejo imprudente.
- id: 376
  category: penalties_and_points
  question: ¿Cuáles son las multas mínima y máxima por violar el límite de velocidad
    señalizado en zonas de trabajo activas en Tennessee?
  choices:
    A: $50 mínimo y $250 máximo
    B: $100 mínimo y $300 máximo
    C: $250 mínimo y $500 máximo
    D: $500 mínimo y $1,000 máximo
  answer: C
  explanation: La ley de Tennessee exige una multa mínima de $250 dólares y hasta
    una multa máxima de $500 dólares por violaciones al límite de velocidad señalizado
    en zonas de trabajo activas.
- id: 377
  category: signs_and_signals
  question: ¿Cómo pueden los conductores reconocer fácilmente las zonas de trabajo
    en las carreteras?
  choices:
    A: Por la presencia de señales y dispositivos azules y blancos
    B: Por la presencia de señales, dispositivos y ropa de color naranja o amarillo
      verdoso
    C: Por la presencia de señales rojas sólidas y luces verdes intermitentes
    D: Por la presencia de banderas a cuadros blancos y negros
  answer: B
  explanation: Las zonas de trabajo en las carreteras se reconocen fácilmente por
    la presencia de señales de color naranja (o amarillo verdoso) y otros dispositivos
    de control de tráfico de color naranja, luces intermitentes en los equipos y trabajadores
    vestidos con ropa de alta visibilidad (naranja o amarillo verdoso).
- id: 378
  category: vehicle_information
  question: Por ley, ¿qué equipo de frenado deben tener todos los automóviles?
  choices:
    A: Solo un freno de pie regular
    B: Dos métodos separados para aplicar los frenos, comúnmente un freno de pie y
      un freno de estacionamiento/emergencia
    C: Un sistema de frenos antibloqueo (ABS) y un freno de pie
    D: Frenos de disco delanteros y frenos de tambor traseros
  answer: B
  explanation: Por ley, todos los automóviles deben tener dos métodos separados para
    aplicar los frenos. Comúnmente, estos son los frenos regulares del vehículo (freno
    de pie) y un freno de estacionamiento o de emergencia.
- id: 379
  category: defensive_driving
  question: Si su vehículo NO tiene frenos antibloqueo y comienza a patinar, ¿qué
    debe hacer por lo general?
  choices:
    A: Bombear los frenos lo más rápido posible
    B: Pisar los frenos a fondo y mantener el volante derecho
    C: Quitar el pie del freno y girar el volante en la dirección del patinazo
    D: Acelerar rápidamente para recuperar la tracción
  answer: C
  explanation: Como regla general para los vehículos sin frenos antibloqueo, si el
    automóvil comienza a patinar, quite el pie del freno y gire el volante en la dirección
    del patinazo, si es seguro hacerlo.
- id: 380
  category: vehicle_information
  question: 'Al reducir la velocidad o detener un vehículo equipado con un sistema
    de frenos antibloqueo (ABS), usted debe:'
  choices:
    A: Bombear el pedal del freno rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Tocar ligeramente el pedal del freno repetidamente
    D: Quitar el pie del pedal si siente vibración
  answer: B
  explanation: Al reducir la velocidad o detenerse con ABS, aplique una presión firme
    y constante al pedal del freno. Nunca bombee el pedal con ABS.
- id: 381
  category: vehicle_information
  question: ¿Qué debe esperar sentir cuando su sistema de frenos antibloqueo (ABS)
    está en uso?
  choices:
    A: El volante se bloqueará en su lugar
    B: El pedal del freno se irá completamente hasta el fondo sin resistencia
    C: Ruido y vibración en el pedal del freno
    D: El motor se apagará temporalmente
  answer: C
  explanation: Espere ruido y vibración en el pedal del freno cuando su ABS esté en
    uso. Estas sensaciones le indican que el ABS está funcionando.
- id: 382
  category: safe_driving_rules
  question: ¿Qué significa el término "mantener el pie en el freno" (riding the brake)?
  choices:
    A: Mantener el pie suspendido sobre el pedal del freno para una respuesta más
      rápida
    B: Mantener el pie apoyado o ligeramente presionado sobre el pedal del freno
    C: Presionar los pedales del freno y del acelerador al mismo tiempo
    D: Bombear el pedal del freno repetidamente mientras conduce cuesta abajo
  answer: B
  explanation: '"Mantener el pie en el freno" (riding the brake) es mantener el pie
    apoyado o ligeramente presionado sobre el freno. Esto añade desgaste y da a los
    demás conductores una falsa impresión.'
- id: 383
  category: defensive_driving
  question: ¿Se considera "cubrir el freno" (covering the brake) una práctica de conducción
    segura?
  choices:
    A: Sí, permite un tiempo de respuesta más rápido en situaciones como acercarse
      a intersecciones
    B: No, causa un desgaste excesivo en el sistema de frenos
    C: No, da a los demás conductores la falsa impresión de que una parada es inminente
    D: Sí, pero solo cuando se conduce en autopistas interestatales
  answer: A
  explanation: Cubrir el freno significa que el pie del conductor se mantiene suspendido
    sobre el freno para un tiempo de respuesta más rápido. El manual establece que
    cubrir el freno es a menudo una práctica de conducción inteligente y segura.
- id: 384
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura en condiciones normales
    de conducción, los conductores deben usar:'
  choices:
    A: La regla de un segundo
    B: La regla de los dos segundos
    C: La regla de los cinco segundos
    D: La regla de los diez segundos
  answer: B
  explanation: A nivel nacional, las agencias de seguridad recomiendan una distancia
    de seguimiento segura. El manual aconseja usar la regla de los dos segundos para
    determinar si está siguiendo a otro vehículo demasiado de cerca.
- id: 385
  category: defensive_driving
  question: 'Durante las inclemencias del tiempo, al conducir en autopistas interestatales
    a altas velocidades o al conducir de noche, la distancia de seguimiento debe aumentarse
    a un mínimo de:'
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Durante las inclemencias del tiempo, al conducir en autopistas interestatales
    a altas velocidades y al conducir de noche, la regla de los dos segundos debe
    aumentarse a un mínimo de cuatro segundos para permitir un mejor tiempo de reacción.
- id: 386
  category: defensive_driving
  question: En los tres pasos para detener un vehículo, ¿qué es el "tiempo de percepción"?
  choices:
    A: El tiempo que tarda en mover el pie del acelerador al pedal del freno
    B: El tiempo que tarda un conductor en ver y reconocer una situación de peligro
    C: La distancia que recorre el automóvil mientras se aplican los frenos
    D: El tiempo que tardan las pastillas de freno del vehículo en acoplarse a los
      rotores
  answer: B
  explanation: El tiempo de percepción se define como el tiempo que tarda un conductor
    en ver y reconocer una situación de peligro.
- id: 387
  category: safe_driving_rules
  question: ¿Cuál es una consecuencia muy común de que los conductores sigan a otro
    vehículo demasiado de cerca (tailgating)?
  choices:
    A: Mejora el flujo del tráfico pesado
    B: Le da al conductor una mejor vista de las condiciones de la carretera más adelante
    C: Causa choques por detrás (colisiones traseras)
    D: Aumenta la eficiencia de combustible del vehículo
  answer: C
  explanation: El manual señala que los choques por detrás son muy comunes y la mayoría
    de estos choques son causados por conductores que siguen a otro vehículo demasiado
    de cerca (tailgating).
- id: 388
  category: vehicle_information
  question: Al acercarse a una señal de alto en un vehículo con transmisión manual
    (estándar), ¿qué debe hacer para reducir la velocidad?
  choices:
    A: Cambiar a punto muerto (neutral) y deslizarse hasta la señal de alto
    B: Apagar el motor para ahorrar combustible
    C: Hacer parpadear las luces de freno para avisar a los autos detrás de usted,
      y luego cambiar a una marcha más baja
    D: Mantener presionado el embrague (clutch) hasta que el vehículo se detenga por
      completo
  answer: C
  explanation: Con una transmisión manual, puede usar la palanca de cambios para reducir
    la velocidad. Primero, haga parpadear las luces de freno para avisar a los autos
    detrás de usted. Luego, cambie a una marcha más baja.
- id: 389
  category: safe_driving_rules
  question: ¿Cuáles son los tres pasos involucrados en detener un vehículo?
  choices:
    A: Tiempo de observación, tiempo de desaceleración y tiempo de parada
    B: Tiempo de percepción, tiempo de reacción y tiempo de frenado
    C: Tiempo de frenado, tiempo de derrape y tiempo de parada
    D: Tiempo de reacción, tiempo de desaceleración y tiempo de reposo
  answer: B
  explanation: 'Según el manual, hay tres pasos para detener un vehículo: tiempo de
    percepción, tiempo de reacción y tiempo de frenado.'
- id: 390
  category: safe_driving_rules
  question: ¿Cuál es el tiempo de reacción promedio desde la percepción del peligro
    hasta el inicio del frenado?
  choices:
    A: 1/2 de segundo
    B: 2/3 de segundo
    C: 1 segundo
    D: 1.16 segundos
  answer: B
  explanation: El manual establece que el tiempo de reacción es el tiempo desde la
    percepción del peligro hasta el inicio del frenado, y el promedio es de 2/3 de
    segundo.
- id: 391
  category: vehicle_information
  question: ¿Cuál de los siguientes NO se menciona como un factor que puede hacer
    variar ampliamente la distancia de frenado de un vehículo?
  choices:
    A: Tipo y estado de la carretera o pavimento
    B: Diseño del vehículo y estado de los amortiguadores
    C: El color y la visibilidad del vehículo
    D: Peso del vehículo cuando está cargado o remolcando
  answer: C
  explanation: La distancia de frenado varía debido a factores como el estado de la
    carretera, los neumáticos/frenos, los amortiguadores y el peso del vehículo. El
    color del vehículo no se menciona como un factor.
- id: 392
  category: signs_and_signals
  question: ¿Dónde debe detener su vehículo en una señal de alto (stop) si no hay
    marcas en el pavimento ni un cruce peatonal?
  choices:
    A: Diez pies antes de la señal de alto
    B: Cuando la parte delantera de su vehículo esté alineada con la ubicación de
      la señal de alto en el borde de la carretera
    C: Directamente debajo de la señal de alto
    D: En el borde exacto de la vía que se cruza
  answer: B
  explanation: 'El manual establece: ''Si no hay marcas en el pavimento, deténgase
    cuando la parte delantera de su vehículo esté alineada con la ubicación de la
    señal de alto en el borde de la carretera''.'
- id: 393
  category: defensive_driving
  question: Al detenerse detrás de otro vehículo en una intersección, ¿cuál es una
    regla general básica para mantener un espacio de separación seguro?
  choices:
    A: Debe estar al menos a la distancia de un automóvil detrás del vehículo.
    B: Debe poder ver la placa de matrícula y/o la llanta trasera del otro vehículo
      donde toca el pavimento.
    C: Debe dejar exactamente 15 pies de espacio entre los vehículos.
    D: Debe estar lo suficientemente cerca como para leer la fecha de vencimiento
      en su placa de matrícula.
  answer: B
  explanation: Una regla general básica es que debe poder ver la placa de matrícula
    y/o la llanta trasera del otro vehículo donde toca el pavimento para proporcionar
    una zona de seguridad.
- id: 394
  category: signs_and_signals
  question: ¿Cómo debe responder un conductor a un semáforo rojo intermitente?
  choices:
    A: Reducir la velocidad y avanzar con precaución.
    B: Ceder el paso al tráfico de la derecha, pero no es necesario detenerse.
    C: Detenerse por completo, al igual que con una señal de alto.
    D: Detenerse solo si hay peatones en el cruce peatonal.
  answer: C
  explanation: 'El manual establece explícitamente: ''Se requiere detenerse por completo
    ante un semáforo rojo intermitente, al igual que con una señal de alto''.'
- id: 395
  category: safe_driving_rules
  question: ¿Cómo definen la mayoría de los agentes del orden y los instructores de
    educación vial una parada completa?
  choices:
    A: Cuando el velocímetro marca exactamente cero durante tres segundos.
    B: Cuando el conductor siente que el automóvil da un ligero tirón hacia adelante
      después de que todo movimiento ha cesado.
    C: Cuando el vehículo ha reducido su velocidad a menos de 5 mph.
    D: Cuando el conductor pone el vehículo en la posición de estacionamiento (Park).
  answer: B
  explanation: La mayoría de los agentes del orden y los instructores coinciden en
    que un vehículo no se ha detenido por completo hasta que el conductor siente que
    el automóvil da un ligero tirón hacia adelante después de que todo movimiento
    ha cesado.
- id: 396
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril y viene un tren, ¿dónde debe detener
    su vehículo?
  choices:
    A: Entre 10 y 30 pies de las vías del ferrocarril
    B: Entre 15 y 50 pies de las vías del ferrocarril
    C: Exactamente a 50 pies de las vías del ferrocarril
    D: Al menos a 100 pies de las vías del ferrocarril
  answer: B
  explanation: Cuando se acerca a un cruce de ferrocarril y viene un tren, debe detenerse
    entre 15 y 50 pies de las vías del ferrocarril.
- id: 397
  category: sharing_the_road
  question: ¿A qué distancia aproximada se requiere que los trenes toquen su bocina
    antes de pasar por un cruce de ferrocarril?
  choices:
    A: 500 pies
    B: 1,000 pies
    C: 1,500 pies
    D: 2,000 pies
  answer: C
  explanation: Se requiere que los trenes toquen la bocina cuando están aproximadamente
    a 1,500 pies de pasar por un cruce de ferrocarril.
- id: 398
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado por la ley de Tennessee
    a detenerse antes de cruzar CUALQUIER paso a nivel de ferrocarril, incluso si
    no hay señales o semáforos activados?
  choices:
    A: Cualquier vehículo de pasajeros que transporte niños
    B: Autobuses de iglesias o escolares, independientemente de si transportan pasajeros
    C: Todos los camiones de reparto comercial
    D: Cualquier vehículo que remolque un tráiler
  answer: B
  explanation: Los autobuses de iglesias o escolares están obligados por ley a detenerse
    antes de cruzar CUALQUIER paso a nivel de ferrocarril, independientemente de si
    dichos autobuses transportan pasajeros en ese momento.
- id: 399
  category: safe_driving_rules
  question: ¿Cómo define el Código de Tennessee una 'parada' (stop)?
  choices:
    A: Reducir la velocidad a menos de 3 mph
    B: Cese completo del movimiento
    C: Hacer una pausa de al menos dos segundos
    D: Ceder el paso a todo el tráfico en sentido contrario
  answer: B
  explanation: El Código de Tennessee define 'parada' como el 'cese completo del movimiento'.
- id: 400
  category: signs_and_signals
  question: Si una intersección tiene un cruce peatonal marcado, ¿dónde debe detener
    su vehículo?
  choices:
    A: Dentro del cruce peatonal para tener una mejor vista del tráfico
    B: Justo después del cruce peatonal
    C: Antes de que la parte delantera de su vehículo alcance la línea blanca más
      cercana que marca el borde del cruce peatonal
    D: Alineado con la señal de alto, independientemente de las líneas del cruce peatonal
  answer: C
  explanation: Si la intersección tiene un cruce peatonal marcado en el pavimento,
    debe detenerse antes de que la parte delantera de su vehículo alcance la línea
    blanca más cercana que marca el borde del cruce peatonal.
- id: 401
  category: safe_driving_rules
  question: Según el ejemplo del manual, ¿cuál es la distancia total de parada para
    un vehículo que viaja a 70 m.p.h. en una buena carretera y con buen clima después
    de que aparece un peligro repentinamente?
  choices:
    A: 128 pies
    B: 200 pies
    C: 290 pies
    D: 418 pies
  answer: D
  explanation: A 70 m.p.h., usted recorre 128 pies antes de frenar, y la distancia
    de frenado es de 290 pies, lo que hace que la distancia total de parada sea de
    418 pies.
- id: 402
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una posible consecuencia de hacer un 'rolling
    stop' (parada sin detenerse por completo)?
  choices:
    A: Reprobar el examen práctico de manejo
    B: Recibir una multa de tránsito
    C: Ser considerado completamente responsable por la policía y las compañías de
      seguros en caso de un choque
    D: Todas las anteriores
  answer: D
  explanation: Las paradas sin detenerse por completo ('rolling stops') son motivo
    para recibir una multa de tránsito, reprobar el examen práctico y ser considerado
    completamente responsable en caso de un choque.
- id: 403
  category: penalties_and_points
  question: ¿Cuál es la sanción por no detenerse ante un autobús escolar detenido?
  choices:
    A: Delito menor de Clase B y una multa de $100
    B: Delito menor de Clase C y una multa de $50
    C: Delito menor de Clase A y una multa de entre $250 y $1,000
    D: Delito grave y una multa de $2,000
  answer: C
  explanation: El manual establece que es un delito menor de Clase A y el conductor
    puede recibir una multa de entre $250 y $1,000 por no detenerse ante un autobús
    escolar detenido.
- id: 404
  category: safe_driving_rules
  question: Al conducir en una carretera con un carril central compartido para girar
    (un quinto carril), ¿qué debe hacer al encontrarse con un autobús escolar detenido
    con luces rojas intermitentes?
  choices:
    A: Continuar con precaución sin detenerse
    B: Detenerse solo si viaja en la misma dirección que el autobús
    C: Reducir la velocidad a 15 mph y continuar
    D: Detenerse en ambas direcciones porque un carril de giro no se considera una
      barrera
  answer: D
  explanation: Un carril de giro en el medio de una carretera de cuatro carriles NO
    se considera una barrera. Los conductores que se encuentren con un autobús escolar
    detenido en este tipo de vía deberán detenerse en ambas direcciones.
- id: 405
  category: signs_and_signals
  question: ¿Qué indican las luces amarillas intermitentes en la parte delantera y
    trasera de un autobús escolar?
  choices:
    A: El autobús se está preparando para detenerse a subir o bajar niños
    B: El autobús se ha detenido y los niños están subiendo o bajando
    C: El autobús está experimentando dificultades mecánicas
    D: El autobús está retrocediendo
  answer: A
  explanation: Cuando las luces amarillas en la parte delantera y trasera del autobús
    parpadean, el autobús se está preparando para detenerse a subir o bajar niños.
    Los conductores deben reducir la velocidad y prepararse para detenerse.
- id: 406
  category: safe_driving_rules
  question: Cuando un autobús escolar se detiene en una intersección para subir y
    bajar niños, ¿qué conductores están obligados a detenerse?
  choices:
    A: Solo los conductores detrás del autobús
    B: Solo los conductores que se acercan desde la dirección opuesta
    C: Los conductores de TODAS las direcciones
    D: Solo los conductores que giran hacia la calle donde está detenido el autobús
  answer: C
  explanation: Cuando un autobús escolar se detiene en una intersección para subir
    y bajar niños, los conductores de TODAS las direcciones están obligados a detenerse
    hasta que el autobús reanude la marcha.
- id: 407
  category: driver_responsibility
  question: Si un oficial de policía le indica que se detenga después del anochecer,
    ¿qué debe hacer antes de que el oficial se acerque?
  choices:
    A: Apagar sus faros
    B: Encender la luz interior de su vehículo
    C: Salir del vehículo para saludar al oficial
    D: Tocar la bocina para confirmar la detención
  answer: B
  explanation: El manual aconseja que si la detención se realiza después del anochecer,
    debe encender la luz interior del vehículo antes de que el oficial se acerque.
- id: 408
  category: defensive_driving
  question: ¿Qué debe hacer si una patrulla de policía NO MARCADA le indica que se
    detenga por la noche y usted se siente inseguro?
  choices:
    A: Acelerar para alejarse de la patrulla no marcada
    B: Detenerse inmediatamente en medio de la carretera
    C: Conducir lentamente una corta distancia hasta el área poblada más cercana
    D: Negarse a detenerse hasta que llegue una patrulla marcada
  answer: C
  explanation: Si una patrulla de policía NO MARCADA le indica que se detenga, puede
    conducir lentamente una corta distancia hasta el área más cercana donde haya otras
    personas, como el estacionamiento de un negocio o la siguiente salida.
- id: 409
  category: driver_responsibility
  question: 'Al ser detenido por un oficial de policía, los conductores deben:'
  choices:
    A: Mantener las manos ocultas hasta que se les pida mostrarlas
    B: Mantener las manos en el volante
    C: Buscar inmediatamente su registro en la guantera
    D: Salir del vehículo para inspeccionar la parte trasera del auto
  answer: B
  explanation: Durante una parada de tráfico, los conductores deben mantener las manos
    en el volante y los pasajeros deben mantener sus manos a la vista.
- id: 410
  category: safe_driving_rules
  question: Según la Regla de Izquierda-Derecha-Izquierda para las intersecciones,
    ¿hacia dónde debe mirar primero?
  choices:
    A: A la derecha
    B: A la izquierda
    C: Hacia adelante
    D: Por su espejo retrovisor
  answer: B
  explanation: La Regla de Izquierda-Derecha-Izquierda establece que primero debe
    mirar a la izquierda para asegurarse de que el tráfico transversal esté cediendo
    el derecho de paso, luego mirar a la derecha y después a la izquierda nuevamente.
- id: 411
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los cambios
    de carril y rebasar en una intersección?
  choices:
    A: Puede rebasar a un vehículo en una intersección si el semáforo está en verde
    B: Debe hacer cambios de carril de último minuto al comenzar a cruzar una intersección
    C: NO debe rebasar a un vehículo en una intersección
    D: Puede cambiar de carril en una intersección si usa su luz direccional
  answer: C
  explanation: 'El manual establece explícitamente: "NO haga cambios de carril de
    último minuto al comenzar a cruzar una intersección. NO rebase a un vehículo en
    una intersección".'
- id: 412
  category: defensive_driving
  question: ¿Qué porcentaje de todos los accidentes de vehículos motorizados ocurren
    en las intersecciones?
  choices:
    A: 10 por ciento
    B: 21 por ciento
    C: 33 por ciento
    D: 50 por ciento
  answer: C
  explanation: Las intersecciones constituyen una parte muy pequeña de los sistemas
    de calles/carreteras, sin embargo, están implicadas en el 33 por ciento de todos
    los accidentes de vehículos motorizados.
- id: 413
  category: safe_driving_rules
  question: ¿Cuál de las siguientes opciones describe mejor la ley con respecto al
    derecho de paso?
  choices:
    A: La ley otorga el derecho de paso al vehículo más grande
    B: La ley no le otorga a nadie el derecho de paso, solo indica quién debe cederlo
    C: La ley otorga el derecho de paso al vehículo que viaja más rápido
    D: La ley otorga el derecho de paso a los peatones en todas las situaciones, independientemente
      de las señales de tránsito
  answer: B
  explanation: En realidad, la ley no le otorga a nadie el derecho de paso. Solo indica
    quién debe ceder el derecho de paso. Piense en el derecho de paso como algo que
    se debe ceder, no tomar.
- id: 414
  category: safe_driving_rules
  question: ¿Bajo qué condición NO está obligado a detenerse ante un autobús escolar
    detenido con luces rojas intermitentes?
  choices:
    A: Cuando viaja en una carretera de dos carriles en dirección opuesta
    B: Cuando llega tarde al trabajo
    C: Cuando conduce en una carretera con calzadas separadas divididas por una barrera
      no apta para el tránsito vehicular
    D: Cuando el autobús está detenido en una intersección
  answer: C
  explanation: Al conducir en una carretera con calzadas separadas para el tránsito
    en direcciones opuestas, divididas por un espacio central (mediana) o una barrera
    no apta para el tránsito vehicular, el conductor no necesita detenerse, pero debe
    avanzar con precaución.
- id: 415
  category: safe_driving_rules
  question: ¿Es legal avanzar hacia una intersección y bloquearla después de que los
    semáforos hayan cambiado?
  choices:
    A: Sí, si ingresó a la intersección mientras el semáforo estaba en amarillo
    B: Sí, si no hay letreros que indiquen 'No bloquear la intersección' (Do Not Block
      Intersection)
    C: No, siempre es ilegal bloquear una intersección, esté marcada o no
    D: No, a menos que conduzca un vehículo comercial
  answer: C
  explanation: No solo es sentido común, sino que también es ilegal bloquear una intersección
    después de que el semáforo ha cambiado. Siempre es ilegal bloquear una intersección,
    esté marcada o no.
- id: 416
  category: driver_responsibility
  question: 'Si tiene un permiso para portar armas de fuego y está armado cuando lo
    detiene un oficial de policía, usted debe:'
  choices:
    A: Esconder el arma debajo del asiento
    B: Informar al oficial que tiene un permiso y está armado
    C: Entregar el arma al oficial inmediatamente
    D: Esperar hasta que el oficial le pregunte si tiene un arma antes de mencionarlo
  answer: B
  explanation: El manual establece que los conductores deben informar a los oficiales
    si tienen un permiso para portar armas de fuego y si están armados.
- id: 417
  category: safe_driving_rules
  question: Según la ley de Tennessee, ¿a quién se le otorga legalmente el derecho
    de paso?
  choices:
    A: Al conductor que llega primero a la intersección
    B: A los peatones en todas las situaciones
    C: La ley no le otorga a nadie el derecho de paso; solo indica quién debe cederlo
    D: Al vehículo de la derecha
  answer: C
  explanation: El manual establece que, en realidad, la ley no le otorga a nadie el
    derecho de paso. Solo indica quién debe ceder el derecho de paso.
- id: 418
  category: sharing_the_road
  question: Cuando un peatón ciego o con discapacidad visual que usa un perro guía
    o un bastón blanco está cruzando la calle, ¿a qué distancia mínima debe detenerse?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: Debe tomar precauciones especiales para evitar lesionar a un peatón
    ciego o con discapacidad visual y detenerse al menos a 10 pies de distancia hasta
    que la persona haya salido de la calle.
- id: 419
  category: sharing_the_road
  question: ¿Cómo puede un conductor identificar a un peatón con discapacidad auditiva
    que requiere precauciones especiales de derecho de paso?
  choices:
    A: Lleva un bastón blanco con la punta roja
    B: Lleva un chaleco amarillo reflectante
    C: Va acompañado de un perro con una correa de color naranja brillante
    D: Usa una silla de ruedas motorizada
  answer: C
  explanation: El manual especifica que debe ceder el paso a una persona con discapacidad
    auditiva que vaya con un perro con una correa de color naranja brillante cruzando
    cualquier parte de la calle.
- id: 420
  category: safe_driving_rules
  question: ¿Cuándo es legal conducir su vehículo sobre una acera?
  choices:
    A: Al evitar un embotellamiento de tráfico
    B: Al estacionar su vehículo en una zona céntrica concurrida
    C: Solo al cruzarla para entrar o salir de un camino de entrada, callejón o estacionamiento
    D: Nunca es legal conducir sobre una acera bajo ninguna circunstancia
  answer: C
  explanation: Es ilegal conducir sobre una acera, excepto para cruzarla, como al
    entrar o salir de un camino de entrada, callejón o estacionamiento.
- id: 421
  category: safe_driving_rules
  question: En una intersección en "T" donde una calle termina en otra vía principal
    de cruce, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo en la calle que termina debe ceder el paso al tráfico en la vía
      principal
    B: Los vehículos en la vía principal deben ceder el paso al vehículo en la calle
      que termina
    C: El vehículo que llega primero a la intersección
    D: El vehículo que gira a la derecha
  answer: A
  explanation: En las intersecciones en "T" donde una calle termina en otra vía principal
    de cruce, los vehículos en la calle que termina deben ceder el paso al tráfico
    que se aproxima desde ambas direcciones en la vía principal.
- id: 422
  category: defensive_driving
  question: ¿Qué debe hacer si el tráfico delante de usted está congestionado y no
    puede atravesar completamente una intersección?
  choices:
    A: Entrar en la intersección y esperar a que el tráfico se despeje
    B: Esperar hasta que el tráfico se despeje para no bloquear la intersección
    C: Avanzar lentamente y tocar la bocina
    D: Entrar en la intersección y encender las luces de emergencia
  answer: B
  explanation: No ingrese a una intersección a menos que pueda atravesarla sin tener
    que detenerse. Debe esperar hasta que el tráfico delante de usted se despeje para
    no bloquear la intersección.
- id: 423
  category: sharing_the_road
  question: ¿Qué debe hacer cuando se aproxima un vehículo de emergencia con sirena
    o luces intermitentes?
  choices:
    A: Detenerse inmediatamente en su carril actual
    B: Acelerar para mantenerse delante del vehículo de emergencia
    C: Conducir a una posición paralela y lo más cerca posible del borde derecho o
      acera y detenerse
    D: Hacerse a un lado en el lado izquierdo de la carretera y reducir la velocidad
  answer: C
  explanation: La ley de Tennessee exige que cuando se aproxima un vehículo de emergencia,
    todo el tráfico debe ceder el derecho de paso y conducir inmediatamente a una
    posición paralela y lo más cerca posible del borde derecho o acera de la vía y
    detenerse.
- id: 424
  category: sharing_the_road
  question: Si se encuentra en medio de una intersección cuando se aproxima un vehículo
    de emergencia con la sirena encendida, ¿qué debe hacer?
  choices:
    A: Detenerse inmediatamente en medio de la intersección
    B: Atravesar la intersección antes de hacerse a un lado a la derecha
    C: Poner su vehículo en reversa y retroceder para salir de la intersección
    D: Hacerse a un lado en el lado izquierdo de la intersección
  answer: B
  explanation: Si está en una intersección, atraviese la intersección antes de hacerse
    a un lado, o podría bloquear el paso del vehículo de emergencia a través de la
    intersección.
- id: 425
  category: safe_driving_rules
  question: Según la Ley de Hacerse a un Lado (Move Over Law) de Tennessee, ¿qué debe
    hacer al acercarse a un vehículo de emergencia o de servicios públicos estacionado
    con luces intermitentes en una carretera de varios carriles?
  choices:
    A: Detener su vehículo y esperar a que el vehículo estacionado se mueva
    B: Cambiarse a un carril que no esté adyacente al vehículo, o avanzar con precaución
      reduciendo la velocidad
    C: Mantener su velocidad y tocar la bocina para alertar a los trabajadores
    D: Hacerse a un lado en el arcén y encender las luces de emergencia
  answer: B
  explanation: La Ley de Hacerse a un Lado (Move Over Law) de Tennessee exige que
    al acercarse a cualquier vehículo de emergencia estacionado con luces intermitentes,
    debe cambiarse a un carril que no esté adyacente al del vehículo, o avanzar con
    precaución reduciendo la velocidad del vehículo.
- id: 426
  category: sharing_the_road
  question: ¿Está obligado a detenerse por un autobús de tránsito (autobús metropolitano)
    que está detenido para recoger o dejar pasajeros?
  choices:
    A: Sí, debe detenerse tal como lo haría por un autobús escolar
    B: Sí, pero solo si el autobús tiene sus luces de emergencia intermitentes
    C: No, no está obligado a detenerse ni se le prohíbe rebasar
    D: No, a menos que el autobús esté en una zona escolar designada
  answer: C
  explanation: No está obligado a detenerse, ni se le prohíbe rebasar, a los autobuses
    de tránsito cuando están detenidos para recoger o dejar pasajeros, como lo estaría
    por un autobús escolar en la misma situación.
- id: 427
  category: safe_driving_rules
  question: ¿Cuál de las siguientes acciones es ilegal con respecto a los camiones
    de bomberos o vehículos de emergencia que responden a una emergencia?
  choices:
    A: Cederles el derecho de paso en una intersección
    B: Seguir a un camión de bomberos que responde a una alarma de incendio
    C: Bajar el volumen de su radio cuando se acercan
    D: Hacerse a un lado hacia la acera derecha cuando se acercan
  answer: B
  explanation: Es contra la ley seguir a un camión de bomberos u otro vehículo de
    emergencia que responde a una alarma de incendio u otra emergencia.
- id: 428
  category: safe_driving_rules
  question: ¿Cuál es la primera regla para girar?
  choices:
    A: Girar desde el carril más cercano en la dirección en la que viaja hacia el
      carril legal más cercano en la dirección a la que desea ir
    B: Girar siempre hacia el carril del extremo izquierdo
    C: Poner la luz direccional por al menos 50 pies antes de hacer el giro
    D: Tocar la bocina antes de iniciar el giro
  answer: A
  explanation: La primera regla para girar es girar desde el carril más cercano en
    la dirección en la que viaja hacia el carril legal más cercano en la dirección
    a la que desea ir.
- id: 429
  category: vehicle_information
  question: ¿Cuál de las siguientes opciones es ilegal que un vehículo privado no
    autorizado tenga instalada o visible?
  choices:
    A: Una luz blanca intermitente
    B: Una luz de emergencia amarilla intermitente
    C: Una luz de emergencia azul intermitente o una combinación de azul y rojo
    D: Una luz verde intermitente
  answer: C
  explanation: Es contra la ley que un vehículo privado no autorizado tenga una luz
    de emergencia azul intermitente o una combinación de luces de emergencia intermitentes
    azules y rojas instaladas, mantenidas o mostradas visiblemente en el vehículo
    de cualquier manera.
- id: 430
  category: safe_driving_rules
  question: Si tiene un semáforo en verde, pero otro vehículo ya está en la intersección,
    ¿qué debe hacer?
  choices:
    A: Avanzar por la intersección ya que tiene el derecho de paso
    B: Tocar la bocina para obligar al otro vehículo a moverse
    C: Ceder el paso al vehículo que ya está en la intersección
    D: Desviarse alrededor del vehículo para mantener el flujo del tráfico
  answer: C
  explanation: Debe ceder el derecho de paso a cualquier vehículo que ya esté en la
    intersección, incluso si tiene el semáforo en verde.
- id: 431
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe encender las luces direccionales antes de
    hacer un giro?
  choices:
    A: Al menos 25 pies
    B: Al menos 50 pies
    C: Al menos 100 pies
    D: Al menos 200 pies
  answer: B
  explanation: El manual establece que debe encender las luces direccionales al menos
    50 pies antes del giro.
- id: 432
  category: safe_driving_rules
  question: ¿Usar la luz direccional le da el derecho de paso para cambiar de carril
    o girar?
  choices:
    A: Sí, si lo señaliza con al menos 50 pies de anticipación.
    B: Sí, pero solo al entrar a un estacionamiento.
    C: No, poner la direccional NO le da el derecho de paso.
    D: No, a menos que esté usando señales manuales.
  answer: C
  explanation: Su direccional permite que otros conductores conozcan sus intenciones
    de cambiar la trayectoria de su vehículo, pero el manual establece explícitamente
    que poner la direccional NO le da el derecho de paso.
- id: 433
  category: defensive_driving
  question: ¿Por qué debe mantener las ruedas de su vehículo derechas mientras espera
    para hacer un giro?
  choices:
    A: Ayuda a que circule el líquido de la dirección asistida.
    B: Evita que sus llantas se desgasten de manera desigual.
    C: Si lo chocan por detrás, el impacto podría empujarlo hacia el tráfico en sentido
      contrario.
    D: Le permite acelerar más rápido cuando el semáforo cambia a verde.
  answer: C
  explanation: El manual advierte que no gire las ruedas en la dirección del giro
    mientras espera a que pase el tráfico en sentido contrario. Si lo chocan por detrás
    mientras sus ruedas están giradas, el impacto puede empujarlo hacia el tráfico
    en sentido contrario.
- id: 434
  category: safe_driving_rules
  question: Si planea girar hacia una entrada de vehículos justo después de una intersección,
    ¿cuándo debe poner la direccional?
  choices:
    A: Al menos 50 pies antes de la intersección.
    B: No ponga la direccional hasta que esté en la intersección.
    C: Justo cuando comience a girar el volante.
    D: No necesita poner la direccional para las entradas de vehículos.
  answer: B
  explanation: Si planea girar después de una intersección, no ponga la direccional
    hasta que esté en la intersección. Si la pone antes, otro conductor podría pensar
    que tiene la intención de girar en la intersección y podría cruzarse en su camino.
- id: 435
  category: defensive_driving
  question: ¿Bajo qué condición climática recomienda específicamente el manual usar
    señales manuales porque las luces direccionales de su vehículo podrían ser difíciles
    de ver?
  choices:
    A: Lluvia fuerte
    B: Niebla densa
    C: Cuando el sol brilla intensamente
    D: Durante una tormenta de nieve
  answer: C
  explanation: Las señales manuales deben usarse cuando el sol brilla intensamente.
    Esto hace que la luz direccional sea más difícil de ver fácilmente para otros
    conductores.
- id: 436
  category: safe_driving_rules
  question: 'Usted NO debe usar sus luces direccionales para:'
  choices:
    A: Indicar que se está alejando de una posición de estacionamiento.
    B: Indicarle a un conductor detrás de usted que lo rodee y rebase su vehículo.
    C: Mostrar que está ingresando a la autopista interestatal.
    D: Indicar que está disminuyendo la velocidad repentinamente.
  answer: B
  explanation: El manual establece que NO debe usar sus direccionales para indicarle
    a un conductor detrás de usted que lo rodee para rebasar su vehículo, ya que esto
    es engañoso para otros conductores.
- id: 437
  category: vehicle_information
  question: ¿Por qué debe evitar cambiar de marcha mientras está en la intersección?
  choices:
    A: Causa un desgaste excesivo en el embrague.
    B: Es ilegal y conlleva una multa alta.
    C: Su vehículo podría apagarse, causando un accidente o bloqueando la intersección.
    D: Hace que su luz direccional se apague automáticamente.
  answer: C
  explanation: 'El manual aconseja: "No cambie de marcha en la intersección (si su
    vehículo se apaga, podría causar un accidente y/o bloquear la intersección para
    el resto del tráfico)".'
- id: 438
  category: defensive_driving
  question: ¿Cómo puede llamar la atención con sus luces de freno al señalar que se
    va a detener?
  choices:
    A: Encendiendo sus luces de emergencia.
    B: Bombeando ligeramente los frenos un par de veces.
    C: Presionando el pedal del freno hasta el fondo inmediatamente.
    D: Cambiando a neutral antes de frenar.
  answer: B
  explanation: Al señalar que se va a detener, debe bombear ligeramente los frenos
    un par de veces para llamar la atención con sus luces de freno.
- id: 439
  category: safe_driving_rules
  question: Cuando se encuentra con otro conductor en una intersección y ambos quieren
    girar a la izquierda, ¿cómo deben proceder?
  choices:
    A: Cada conductor girará a la derecha del otro.
    B: El conductor que llegó primero tiene el derecho de paso para girar primero.
    C: Cada conductor girará a la izquierda del otro.
    D: Ambos conductores deben esperar una flecha verde.
  answer: C
  explanation: Cuando se encuentra con otro conductor en una intersección y ambos
    quieren girar a la izquierda, cada uno girará a la izquierda del otro.
- id: 440
  category: signs_and_signals
  question: ¿De qué color son las líneas centrales en las calles de un solo sentido?
  choices:
    A: Amarillas
    B: Blancas
    C: Rojas
    D: Azules
  answer: B
  explanation: Según el manual, las líneas centrales en las calles de doble sentido
    son amarillas, mientras que las líneas centrales en las calles de un solo sentido
    son blancas.
- id: 441
  category: safe_driving_rules
  question: ¿Qué debe hacer con su brazo al usar una señal manual durante el giro
    real?
  choices:
    A: Mantenerlo completamente extendido hasta que se complete el giro.
    B: Moverlo en un movimiento circular.
    C: Retirar el brazo hacia adentro para mantener el control del volante.
    D: Señalar el carril hacia el que está girando.
  answer: C
  explanation: Cuando use señales manuales, debe retirar el brazo hacia adentro durante
    el giro real para mantener el control del volante.
- id: 442
  category: defensive_driving
  question: ¿Cuál es un peligro potencial de olvidar apagar la luz direccional después
    de usarla?
  choices:
    A: Agotará la batería de su vehículo.
    B: Podría tentar a otros conductores a salir frente a usted.
    C: Hará que sus luces de freno dejen de funcionar.
    D: Activará automáticamente su freno de emergencia.
  answer: B
  explanation: Una señal no intencional sigue significando "giro" para otros conductores.
    Al dejarla encendida, podría tentar a otros conductores a salir frente a usted.
- id: 443
  category: safe_driving_rules
  question: Al hacer un giro de rutina a la izquierda desde una calle de doble sentido
    hacia otra calle de doble sentido, ¿por dónde debe conducir justo después de entrar
    a la nueva calle?
  choices:
    A: En el carril del extremo derecho para evitar el tráfico en sentido contrario.
    B: Justo a la derecha de la línea central en el primer carril pasando la línea
      central.
    C: Directamente sobre la línea central.
    D: En cualquier carril disponible que esté libre de tráfico.
  answer: B
  explanation: Conduzca justo a la derecha de la línea central de la calle a la que
    está entrando y asegúrese de girar hacia el primer carril pasando la línea central.
    Esto evita conflictos con otro tráfico que esté haciendo giros a la derecha o
    a la izquierda.
- id: 444
  category: signs_and_signals
  question: Si está esperando para hacer un giro a la izquierda y el semáforo cambia
    a amarillo mientras espera a que pasen los vehículos en sentido contrario, ¿qué
    debe hacer?
  choices:
    A: Acelerar rápidamente para ganarle a la luz roja.
    B: Avanzar hacia la intersección inmediatamente.
    C: NO avanzar hacia la intersección.
    D: Retroceder hacia el cruce peatonal.
  answer: C
  explanation: 'El manual indica: "Si la luz cambia a amarillo mientras espera a que
    los vehículos en sentido contrario despejen la intersección, NO avance hacia la
    intersección".'
- id: 445
  category: safe_driving_rules
  question: Al hacer un giro a la izquierda desde una calle de doble sentido hacia
    una calle de un solo sentido, ¿a qué carril debe girar?
  choices:
    A: El carril más a la derecha.
    B: El carril central.
    C: El primer carril más cercano al borde izquierdo de la acera.
    D: Cualquier carril que esté abierto actualmente.
  answer: C
  explanation: Al girar desde una calle de doble sentido hacia una calle de un solo
    sentido, el manual indica 'Gire cerradamente hacia el PRIMER carril... Debe girar
    hacia el primer carril más cercano al borde izquierdo de la acera'.
- id: 446
  category: safe_driving_rules
  question: ¿Bajo qué condición se permite un giro a la izquierda con luz roja en
    Tennessee?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de un solo sentido.
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido.
    C: Al girar desde una calle de un solo sentido hacia una calle de doble sentido.
    D: Los giros a la izquierda con luz roja nunca están permitidos.
  answer: B
  explanation: Se permite un giro a la izquierda con luz roja en todas las intersecciones
    donde una calle de un solo sentido se cruza con otra calle de un solo sentido,
    siempre y cuando se detenga por completo primero y no haya señales que lo prohíban.
- id: 447
  category: safe_driving_rules
  question: ¿Puede hacer un giro a la izquierda con luz roja al girar desde una calle
    de un solo sentido hacia una calle de doble sentido?
  choices:
    A: Sí, después de detenerse por completo.
    B: Sí, si no hay tráfico en sentido contrario.
    C: No, NO PUEDE hacer este giro a la izquierda con luz roja.
    D: Sí, pero solo entre la medianoche y las 6 AM.
  answer: C
  explanation: 'El manual establece explícitamente con respecto a girar desde una
    calle de un solo sentido hacia una calle de doble sentido: ''NO PUEDE hacer este
    giro a la izquierda con luz roja''.'
- id: 448
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe poner la luz direccional antes de un giro
    a la derecha?
  choices:
    A: Al menos 25 pies.
    B: Al menos 50 pies.
    C: Al menos 100 pies.
    D: Al menos 200 pies.
  answer: B
  explanation: El manual indica que debe 'Dar una señal para un giro a la derecha
    por al menos 50 pies'.
- id: 449
  category: defensive_driving
  question: ¿Por qué debe evitar abrirse demasiado hacia la izquierda antes o durante
    un giro a la derecha?
  choices:
    A: Hará que su volante se bloquee.
    B: El conductor detrás de usted podría pensar que está cambiando de carril o girando
      a la izquierda e intentar rebasarlo por la derecha.
    C: Es ilegal cruzar la línea blanca.
    D: Hará que entre en una rotonda.
  answer: B
  explanation: Si se abre demasiado hacia la izquierda en un giro a la derecha, 'el
    conductor detrás de usted podría pensar que está cambiando de carril o girando
    a la izquierda y podría intentar rebasarlo por la derecha'.
- id: 450
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a un camión grande por la derecha si existe
    la posibilidad de que haga un giro a la derecha?
  choices:
    A: Los camiones aceleran más rápido que los automóviles.
    B: Los camiones deben hacer giros amplios y a veces dejan un espacio abierto a
      la derecha justo antes del giro.
    C: A los camiones no se les permite usar luces direccionales.
    D: Los camiones siempre tienen el derecho de paso en las intersecciones.
  answer: B
  explanation: Los camiones grandes y autobuses DEBEN hacer giros amplios y a veces
    dejan un espacio abierto a la derecha justo antes del giro. Rebasar por la derecha
    puede causar un accidente.
- id: 451
  category: safe_driving_rules
  question: ¿En qué dirección debe circular siempre en una rotonda?
  choices:
    A: En el sentido de las agujas del reloj.
    B: En sentido contrario a las agujas del reloj (hacia la derecha).
    C: En línea recta por el centro.
    D: En la dirección que tenga menos tráfico.
  answer: B
  explanation: 'El manual indica a los conductores: ''Circule siempre por una rotonda
    hacia la derecha, en sentido contrario a las agujas del reloj''.'
- id: 452
  category: safe_driving_rules
  question: ¿Cuál es la regla sobre rebasar a otros vehículos en una rotonda de varios
    carriles?
  choices:
    A: Solo puede rebasar por la izquierda.
    B: Solo puede rebasar por la derecha.
    C: Puede rebasar si el vehículo de adelante viaja a menos de 15 mph.
    D: No adelante ni rebase a ningún vehículo.
  answer: D
  explanation: 'En una rotonda de varios carriles, el manual establece explícitamente:
    ''no adelante ni rebase a ningún vehículo''.'
- id: 453
  category: safe_driving_rules
  question: NO puede hacer una vuelta en U en ningún lugar donde no pueda ver el tráfico
    que se aproxima en ambas direcciones por al menos ¿qué distancia?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: No puede hacer una vuelta en U en ningún lugar rural o urbano, ni cerca
    de una curva o la cima de una colina, donde no pueda ver el tráfico que se aproxima
    en ambas direcciones por al menos 500 pies.
- id: 454
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida en una autopista interestatal
    en Tennessee?
  choices:
    A: Usar el cruce de emergencia en la mediana para dar la vuelta.
    B: Hacer una vuelta en U cuando la autopista esté despejada.
    C: Conducir hasta la siguiente rampa de salida.
    D: Retroceder con cuidado por el arcén (hombro).
  answer: C
  explanation: 'Es ilegal hacer una vuelta en U en una autopista interestatal o usar
    los cruces de emergencia. El manual aconseja: ''Conduzca hasta la siguiente rampa
    de salida''.'
- id: 455
  category: safe_driving_rules
  question: ¿Qué frase resume el principio del 'tráfico por la derecha' en las carreteras
    estadounidenses?
  choices:
    A: Amarillo a su derecha, blanco a su izquierda
    B: Blanco a su derecha, amarillo a su izquierda
    C: Manténgase a la derecha excepto para girar a la derecha
    D: Rebase por la derecha, conduzca por la izquierda
  answer: B
  explanation: 'El manual establece que el uso general de los carriles se resume en
    la simple frase: ''Blanco a su derecha, amarillo a su izquierda''.'
- id: 456
  category: safe_driving_rules
  question: ¿Para qué se utiliza el carril central de una carretera de doble sentido
    de tres o cinco carriles?
  choices:
    A: Para rebasar vehículos que se mueven lentamente.
    B: Solo para estacionamiento de emergencia.
    C: Solo para girar a la izquierda.
    D: Solo para girar a la derecha.
  answer: C
  explanation: 'El manual establece explícitamente: ''El carril central de una carretera
    de doble sentido de tres o cinco carriles se utiliza únicamente para girar a la
    izquierda''.'
- id: 457
  category: safe_driving_rules
  question: ¿Es legal hacer una vuelta en U en una intersección donde un semáforo
    o un oficial de policía controla el flujo del tráfico?
  choices:
    A: Sí, si tiene luz verde.
    B: Sí, si no hay tráfico en sentido contrario.
    C: No, no puede hacer una vuelta en U en estas intersecciones.
    D: Sí, pero solo en áreas rurales.
  answer: C
  explanation: 'El manual enumera los lugares donde NO puede hacer una vuelta en U,
    incluyendo: ''En cualquier intersección donde un semáforo o un oficial de policía
    esté controlando el flujo del tráfico''.'
- id: 458
  category: safe_driving_rules
  question: ¿Cómo debe indicar su intención de salir de una rotonda?
  choices:
    A: Parpadear las luces delanteras.
    B: Usar la luz direccional izquierda.
    C: Usar la luz direccional derecha.
    D: Tocar la bocina.
  answer: C
  explanation: 'El manual indica a los conductores: ''Salga de la rotonda con cuidado.
    Indique siempre su salida usando la luz direccional derecha''.'
- id: 459
  category: safe_driving_rules
  question: En una carretera de cuatro carriles, ¿por dónde debe conducir generalmente?
  choices:
    A: En el carril del extremo izquierdo en todo momento
    B: En el carril del extremo derecho, excepto al rebasar o girar a la izquierda
    C: En el carril que tenga la menor cantidad de tráfico
    D: Pisando la línea blanca discontinua para mantener la visibilidad
  answer: B
  explanation: Según el manual, en una carretera de cuatro carriles, debe 'Conducir
    en el carril del extremo derecho, excepto al rebasar a otro vehículo o al hacer
    un giro a la izquierda'.
- id: 460
  category: defensive_driving
  question: Al intentar usar un cruce designado en una carretera dividida de cuatro
    carriles, ¿qué debe hacer si ya hay otro vehículo en el cruce esperando a que
    el tráfico se despeje?
  choices:
    A: Moverse hacia el lado izquierdo del cruce junto al vehículo que espera
    B: Acercarse mucho detrás del auto que espera dentro del cruce
    C: Permanecer detenido en el carril más a la izquierda de la carretera con su
      luz direccional encendida
    D: Avanzar hasta la siguiente intersección para hacer una vuelta en U
  answer: C
  explanation: 'El manual establece: ''Si ya hay un vehículo en el cruce esperando
    a que el tráfico se despeje, permanezca detenido en el carril más a la izquierda
    de la carretera de cuatro carriles con su luz direccional encendida hasta que
    el vehículo que espera haya despejado el cruce''.'
- id: 461
  category: signs_and_signals
  question: ¿Qué significa si ve reflectores rojos frente a usted en las líneas del
    carril o en las líneas del borde de la carretera?
  choices:
    A: Se está acercando a una zona de construcción
    B: Está circulando en sentido contrario al tráfico y podría tener una colisión
      frontal
    C: Está entrando en un carril para vehículos de alta ocupación (HOV)
    D: El límite de velocidad se reduce más adelante
  answer: B
  explanation: 'El manual advierte: "Los reflectores rojos siempre significan que
    está circulando en sentido contrario al tráfico y podría tener una colisión frontal".'
- id: 462
  category: safe_driving_rules
  question: ¿Cuál es la distancia máxima que se le permite recorrer en un carril central
    compartido para girar?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: C
  explanation: El manual especifica que los carriles centrales compartidos para girar
    "no se pueden usar para rebasar y no se pueden usar para recorrer más de 300 pies".
- id: 463
  category: safe_driving_rules
  question: Si dos vehículos entran a un carril central compartido para girar desde
    direcciones opuestas al mismo tiempo, ¿quién tiene el derecho de paso?
  choices:
    A: El vehículo que viaja a mayor velocidad
    B: El vehículo que gira a la derecha
    C: El más grande de los dos vehículos
    D: El primer vehículo en entrar al carril
  answer: D
  explanation: Según el manual, "Cuando los vehículos entran al carril de giro desde
    direcciones opuestas, el primer vehículo en entrar al carril tiene el derecho
    de paso".
- id: 464
  category: signs_and_signals
  question: ¿Cómo suelen estar marcados los carriles reversibles en la calzada?
  choices:
    A: Con líneas amarillas dobles entrecortadas
    B: Con líneas blancas continuas en ambos lados
    C: Con una sola línea amarilla continua
    D: Con reflectores rojos y blancos alternados
  answer: A
  explanation: El manual indica que los carriles reversibles "suelen estar marcados
    con líneas amarillas dobles entrecortadas".
- id: 465
  category: signs_and_signals
  question: Al conducir en un carril reversible, ¿qué significa una "X" amarilla intermitente
    en la parte superior?
  choices:
    A: No puede conducir en el carril de abajo
    B: El carril es solo para girar
    C: La dirección del carril está cambiando
    D: Puede conducir en línea recta en el carril
  answer: B
  explanation: El manual explica que "Una 'X' amarilla intermitente significa que
    el carril es solo para girar".
- id: 466
  category: signs_and_signals
  question: ¿Qué acción debe tomar si ve una "X" amarilla fija sobre un carril reversible?
  choices:
    A: Acelerar para despejar el carril rápidamente
    B: Detenerse inmediatamente en el carril
    C: Salir del carril tan pronto como sea seguro hacerlo
    D: Usar el carril solo para rebasar
  answer: C
  explanation: Según el manual, "Una 'X' amarilla fija significa que el uso/dirección
    del carril está cambiando y debe salir de él tan pronto como sea seguro hacerlo".
- id: 467
  category: signs_and_signals
  question: ¿Qué indica una señal que dice "HOV 2" sobre un carril reservado?
  choices:
    A: El carril está reservado para vehículos con al menos dos personas en ellos
    B: El carril está reservado solo para vehículos comerciales pesados
    C: El carril está cerrado por las próximas dos millas
    D: Solo los vehículos híbridos o eléctricos pueden usar el carril
  answer: A
  explanation: 'El manual indica: "Por ejemplo, ''HOV 2'' significa que debe haber
    al menos dos personas en el vehículo para que usted pueda conducir legalmente
    en ese carril".'
- id: 468
  category: defensive_driving
  question: ¿Por qué es esencial mirar por encima del hombro antes de cambiar de carril?
  choices:
    A: Para comprobar la velocidad del vehículo detrás de usted
    B: Para asegurarse de que su luz direccional funciona correctamente
    C: Para revisar sus puntos ciegos en busca de vehículos que no se pueden ver en
      sus espejos
    D: Para comunicar sus intenciones a otros conductores
  answer: C
  explanation: El manual explica que un conductor "no puede ver la motocicleta u otro
    automóvil solo revisando sus espejos. Necesitaría girar físicamente la cabeza
    y mirar por encima del hombro en cada dirección para ver esos vehículos a su lado"
    para revisar los puntos ciegos.
- id: 469
  category: sharing_the_road
  question: ¿Qué debe hacer si un conductor delante de usted señala su intención de
    cambiar de carril?
  choices:
    A: Acelerar para rebasarlo antes de que cambie de carril
    B: Reducir la velocidad y dejar espacio para el cambio
    C: Cambiar de carril usted mismo para apartarse de su camino
    D: Tocar la bocina para advertirle que no se mueva
  answer: B
  explanation: 'El manual aconseja: "Cuando un conductor delante de usted (en su carril
    o en el carril de al lado) señala un cambio de carril, reduzca la velocidad y
    deje espacio para el cambio. NO acelere ni cambie de carril usted mismo...".'
- id: 470
  category: safe_driving_rules
  question: Al prepararse para rebasar a otro vehículo en una carretera de dos carriles,
    ¿cuál es una buena regla con respecto al tráfico en sentido contrario?
  choices:
    A: Si ve cualquier señal de un vehículo en sentido contrario, está demasiado cerca
      para arriesgarse a rebasar
    B: Puede rebasar si el vehículo en sentido contrario está a más de 100 pies de
      distancia
    C: Parpadear las luces delanteras para que el vehículo en sentido contrario reduzca
      la velocidad
    D: Acelerar rápidamente para ganarle al vehículo en sentido contrario
  answer: A
  explanation: 'El manual indica: "Por regla general, si ve cualquier señal de un
    vehículo en sentido contrario, está demasiado cerca para arriesgarse a rebasar.
    En caso de duda, quédese en su carril".'
- id: 471
  category: defensive_driving
  question: ¿Por qué debe mantenerse a una buena distancia detrás de un vehículo que
    desea rebasar antes de iniciar la maniobra?
  choices:
    A: Para alcanzar suficiente velocidad y rebasar rápidamente
    B: Para tener una mejor vista del camino por delante
    C: Para evitar ser golpeado por escombros levantados por sus llantas
    D: Para ocultarse en su punto ciego hasta que esté listo para rebasar
  answer: B
  explanation: 'El manual indica a los conductores: ''Manténgase a una buena distancia
    detrás del vehículo que desea rebasar para tener una mejor vista del camino por
    delante''.'
- id: 472
  category: defensive_driving
  question: ¿Por qué debe evitar asomarse cruzando la línea central solo para mirar
    antes de rebasar?
  choices:
    A: Es ilegal cruzar la línea central bajo cualquier circunstancia
    B: Indica que está siguiendo demasiado cerca o intentando rebasar de manera insegura
    C: Causará que su vehículo pierda tracción
    D: Confunde a los conductores detrás de usted haciéndoles pensar que va a girar
      a la izquierda
  answer: B
  explanation: 'El manual advierte: ''NO se asome cruzando la línea central para mirar.
    Si necesita hacer esto para ver, está siguiendo demasiado cerca o intentando rebasar''.'
- id: 473
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a los cruces
    en la mediana (crossovers) en las autopistas interestatales?
  choices:
    A: Pueden usarse para dar vuelta en U si la mediana está pavimentada
    B: Están reservados solo para vehículos de alta ocupación
    C: No hay cruces en la mediana provistos para el tráfico en las autopistas interestatales
    D: Deben tratarse igual que una calle transversal
  answer: C
  explanation: 'El manual establece explícitamente: ''NO hay cruces en la mediana
    provistos para el tráfico en las autopistas interestatales''.'
- id: 474
  category: safe_driving_rules
  question: Al rebasar a un vehículo por la izquierda, ¿cuándo es seguro regresar
    al carril derecho?
  choices:
    A: Cuando esté a 50 pies por delante del vehículo.
    B: Tan pronto como pase el parachoques delantero del vehículo.
    C: Cuando pueda ver todo el vehículo que rebasó en su espejo retrovisor.
    D: Cuando el conductor al que rebasó parpadee sus faros.
  answer: C
  explanation: 'El manual establece: ''Complete su rebase lo antes posible. Cuando
    pueda ver todo el vehículo que rebasó en su espejo retrovisor, ponga su direccional
    a la derecha y regrese a su carril''.'
- id: 475
  category: safe_driving_rules
  question: En Tennessee, ¿es ilegal rebasar a varios vehículos al mismo tiempo?
  choices:
    A: Sí, está estrictamente prohibido por la ley.
    B: No, no es ilegal, pero por lo general no se recomienda.
    C: Sí, a menos que esté en una autopista de varios carriles.
    D: No, es la forma recomendada de rebasar al tráfico lento.
  answer: B
  explanation: 'El manual señala: ''Como regla general, NO ES SEGURO rebasar a más
    de un vehículo a la vez, aunque no es ilegal en Tennessee rebasar a varios vehículos.
    Se recomienda que ni siquiera considere rebasar a varios vehículos a menos que...''.'
- id: 476
  category: safe_driving_rules
  question: ¿Bajo cuál de las siguientes condiciones está permitido rebasar por la
    derecha?
  choices:
    A: Cuando el vehículo de adelante ha puesto su direccional para dar vuelta a la
      izquierda.
    B: Cuando usa el acotamiento pavimentado de la carretera.
    C: Cuando usa un carril designado para bicicletas para esquivar el tráfico.
    D: Cuando el vehículo de adelante conduce por debajo del límite de velocidad en
      una carretera de dos carriles.
  answer: A
  explanation: Está permitido rebasar por la derecha 'Cuando el vehículo alcanzado
    ha puesto su direccional para dar vuelta o está a punto de dar vuelta a la izquierda'.
    Nunca está permitido rebasar fuera del pavimento o en un carril para bicicletas.
- id: 477
  category: safe_driving_rules
  question: ¿Cuándo se le permite rebasar a un vehículo por la derecha usando un carril
    de emergencia o un carril de estacionamiento?
  choices:
    A: Cuando el vehículo de adelante está detenido por un semáforo en rojo.
    B: Cuando está a la vista de un semáforo o una señal de alto (stop).
    C: Cuando el vehículo de adelante está dando vuelta a la izquierda.
    D: Nunca se le permite rebasar por la derecha usando un carril de estacionamiento
      o de emergencia.
  answer: D
  explanation: 'El manual establece explícitamente: ''NO rebase por la derecha usando
    un carril para bicicletas o un carril de estacionamiento en ningún lugar, ni en
    el carril de emergencia a la vista de un semáforo o una señal de alto''.'
- id: 478
  category: sharing_the_road
  question: Al detenerse en un cruce peatonal en una calle de varios carriles, ¿a
    qué distancia antes del cruce peatonal debe detenerse?
  choices:
    A: 10 pies
    B: 15 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: 'Según el Consejo de Seguridad del manual: ''Al detenerse en un cruce
    peatonal en una calle de varios carriles, debe detenerse a unos 30 pies antes
    del cruce peatonal para no bloquear la visibilidad de los peatones que cruzan
    a los conductores en el/los otro(s) carril(es)''.'
- id: 479
  category: signs_and_signals
  question: ¿Qué indica el final de una 'zona de no rebasar'?
  choices:
    A: Que es automáticamente seguro rebasar.
    B: Que hay mayor visibilidad más adelante, pero aún debe determinar si es seguro
      rebasar.
    C: Que está obligado a rebasar a cualquier vehículo de movimiento lento que esté
      adelante.
    D: Que el límite de velocidad aumenta.
  answer: B
  explanation: 'El manual establece: ''El final de una "zona de no rebasar" no significa
    que sea seguro rebasar. Significa que hay mayor visibilidad más adelante. Todavía
    depende de USTED determinar si es seguro rebasar...''.'
- id: 480
  category: safe_driving_rules
  question: ¿Se le permite alguna vez cruzar una línea amarilla continua marcada en
    el pavimento en una 'zona de no rebasar'?
  choices:
    A: No, cruzar una línea amarilla continua nunca está permitido.
    B: Sí, pero solo para rebasar a un tractor o bicicleta de movimiento lento.
    C: Sí, puede cruzar la línea central para entrar o salir de un callejón, camino
      privado o entrada de vehículos.
    D: Sí, si puede completar el rebase antes de que llegue el tráfico en sentido
      contrario.
  answer: C
  explanation: 'El manual explica: ''Se le permite cruzar la línea central si está
    dando vuelta a la izquierda para entrar o salir de un callejón, intersección,
    camino privado o entrada de vehículos mientras se encuentra en la "zona de no
    rebasar"''.'
- id: 481
  category: defensive_driving
  question: ¿Qué debe hacer si otro vehículo lo está rebasando y observa que se acerca
    un automóvil en sentido contrario?
  choices:
    A: Acelerar para que el vehículo que lo rebasa pueda meterse detrás de usted.
    B: Moverse a la izquierda para bloquear al vehículo que lo rebasa.
    C: Reducir la velocidad para darle al conductor que lo rebasa más espacio para
      regresar al carril derecho.
    D: Tocar la bocina y mantener su velocidad actual.
  answer: C
  explanation: Para ayudar a otro conductor a rebasar de manera segura, debe "reducir
    la velocidad si observa que se acerca un automóvil en la dirección opuesta mientras
    lo están rebasando. Al reducir la velocidad, le dará al conductor que lo rebasa
    más espacio para regresar al carril derecho...".
- id: 482
  category: sharing_the_road
  question: ¿Cuál es la distancia mínima que debe dejar entre su vehículo y una bicicleta
    al rebasarla?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: 'El manual indica: "Al rebasar y adelantar a un ciclista que avanza
    en la misma dirección, hágalo lentamente y deje al menos una distancia entre usted
    y la bicicleta de no menos de 3 pies".'
- id: 483
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego del conductor
    de un camión grande o autobús mientras lo sigue?
  choices:
    A: Puede ver la cara del conductor en su espejo retrovisor.
    B: No puede ver los espejos laterales del camión o autobús.
    C: Lo está siguiendo a una distancia de más de 100 pies.
    D: Puede ver el remolque completo del camión.
  answer: B
  explanation: 'El manual proporciona un excelente punto para recordar: "si no puede
    ver los espejos laterales del camión o autobús que está siguiendo, entonces el
    conductor del camión o autobús NO PUEDE VERLO A USTED".'
- id: 484
  category: sharing_the_road
  question: ¿Cuál es un error peligroso que los conductores suelen cometer después
    de rebasar a un camión grande o autobús?
  choices:
    A: Acelerar demasiado rápido después de regresar al carril.
    B: Meterse delante del camión o autobús y reducir la velocidad.
    C: Apagar su luz direccional demasiado pronto.
    D: Dejar demasiado espacio entre su automóvil y el camión.
  answer: B
  explanation: 'El manual instruye: "Mantenga su velocidad. NUNCA se meta delante
    de un camión o autobús (o cualquier tipo de vehículo) y reduzca la velocidad.
    Esto elimina el margen de seguridad del conductor al que acaba de rebasar...".'
- id: 485
  category: sharing_the_road
  question: ¿Cómo afecta viajar en una pendiente descendente al rebasar a un camión
    grande o autobús?
  choices:
    A: El camión perderá velocidad, lo que facilitará rebasarlo.
    B: El impulso del camión hará que vaya más rápido, por lo que es posible que deba
      aumentar su velocidad para rebasarlo.
    C: El camión se verá obligado a detenerse en el arcén.
    D: Rebasar en una pendiente descendente está estrictamente prohibido por la ley.
  answer: B
  explanation: 'El manual explica que el terreno importa: "En una pendiente descendente,
    su impulso hará que vayan más rápido, por lo que es posible que deba aumentar
    su velocidad para rebasar".'
- id: 486
  category: defensive_driving
  question: ¿Cuál es el procedimiento adecuado cuando otro conductor intenta rebasarlo
    por la izquierda?
  choices:
    A: Acelerar para evitar que se metan de forma muy brusca.
    B: Moverse al carril izquierdo para bloquearlos si no es seguro.
    C: Mantenerse en su carril, moverse hacia la derecha y mantener su velocidad.
    D: Parpadear las luces delanteras para advertir al tráfico en sentido contrario.
  answer: C
  explanation: 'Al ser rebasado, debe ayudar al otro conductor: "Manteniéndose en
    su carril y moviéndose hacia la derecha si lo rebasan por la izquierda. Manteniendo
    su velocidad. NO acelere para evitar que el otro conductor lo rebase".'
- id: 487
  category: safe_driving_rules
  question: ¿Cuál de las siguientes situaciones le prohíbe cruzar la línea central
    para rebasar?
  choices:
    A: Al acercarse a un automóvil que se ha detenido para ceder el paso a peatones
      en un cruce peatonal.
    B: Cuando el vehículo de adelante viaja a 15 mph por debajo del límite de velocidad.
    C: Cuando se encuentra en una carretera recta y nivelada con excelente visibilidad.
    D: Cuando el vehículo de adelante es una bicicleta.
  answer: A
  explanation: 'El manual enumera varias condiciones en las que NO puede cruzar la
    línea central para rebasar, incluyendo: "No rebase a un automóvil que se ha detenido
    para ceder el paso a peatones en un cruce peatonal marcado o no marcado".'
- id: 488
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿es legal exceder el límite de velocidad publicado?
  choices:
    A: Sí, pero solo por un máximo de 5 mph.
    B: Sí, si está rebasando a un camión comercial con múltiples remolques.
    C: No, es ilegal exceder el límite de velocidad publicado incluso al rebasar.
    D: Sí, si está en una pendiente descendente y necesita rebasar rápidamente.
  answer: C
  explanation: 'El manual indica: "Recuerde, es ilegal exceder el límite de velocidad
    publicado incluso al rebasar a otros vehículos".'
- id: 489
  category: safe_driving_rules
  question: ¿Cuál es la forma correcta de mirar hacia atrás al retroceder su vehículo?
  choices:
    A: Depender únicamente de sus espejos retrovisores y laterales.
    B: Abrir la puerta y sacar la cabeza para ver.
    C: Colocar su brazo en el respaldo del asiento y voltear para mirar directamente
      a través de la ventana trasera.
    D: Tocar la bocina y retroceder rápidamente mientras revisa el espejo retrovisor.
  answer: C
  explanation: Antes de retroceder, debe colocar su brazo en el respaldo del asiento
    y voltear para poder mirar directamente a través de la ventana trasera. El manual
    advierte explícitamente que no se debe depender únicamente de los espejos ni abrir
    la puerta para mirar hacia afuera.
- id: 490
  category: safe_driving_rules
  question: ¿Qué debe hacer si se pasa de su salida o giro en la autopista interestatal?
  choices:
    A: Detenerse y retroceder con cuidado en el arcén.
    B: Encender las luces de emergencia y retroceder en el carril de circulación.
    C: Hacer un giro en U a través de la mediana.
    D: Continuar hasta el siguiente giro o salida donde pueda dar la vuelta de manera
      segura y legal.
  answer: D
  explanation: Si se pasa de su giro o salida, NO retroceda; continúe hasta el siguiente
    giro o salida o donde pueda dar la vuelta de manera segura y legal. Es ilegal
    retroceder en la autopista interestatal.
- id: 491
  category: safe_driving_rules
  question: Al estacionar junto a una carretera fuera de los límites de la ciudad,
    ¿su vehículo debe ser visible desde al menos cuántos pies en ambas direcciones?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Al estacionar junto a una carretera fuera de los límites de la ciudad,
    su vehículo debe ser visible desde al menos 200 pies en ambas direcciones.
- id: 492
  category: safe_driving_rules
  question: Al estacionar fuera de los límites de la ciudad, ¿cuánto ancho de la vía
    debe asegurarse de dejar como mínimo para que el resto del tráfico pueda pasar
    junto a su vehículo estacionado?
  choices:
    A: 10 pies
    B: 12 pies
    C: 15 pies
    D: 18 pies
  answer: D
  explanation: Sin importar la situación, debe asegurarse de dejar al menos 18 pies
    de ancho de la vía para que el resto del tráfico pueda pasar junto a su vehículo
    estacionado al aparcar junto a una carretera fuera de los límites de la ciudad.
- id: 493
  category: safe_driving_rules
  question: ¿Hacia qué lado debe girar las ruedas delanteras al estacionar en una
    cuesta arriba con bordillo (acera)?
  choices:
    A: Hacia el bordillo (derecha)
    B: Lejos del bordillo (izquierda)
    C: Recto hacia adelante
    D: Paralelas al bordillo
  answer: B
  explanation: En una cuesta arriba con bordillo, gire las ruedas delanteras lejos
    del bordillo (hacia la izquierda). De esta manera, si el automóvil comienza a
    rodar hacia atrás, chocará contra el bordillo y se detendrá.
- id: 494
  category: safe_driving_rules
  question: ¿A cuántos pies de una boca de incendios (hidrante) es ilegal estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: B
  explanation: El manual enumera "A menos de 15 pies de una boca de incendios" bajo
    las ZONAS DE NO ESTACIONAR donde es ilegal aparcar.
- id: 495
  category: safe_driving_rules
  question: ¿A cuántos pies de un cruce peatonal no se puede estacionar?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 30 pies
  answer: C
  explanation: Es ilegal estacionar a menos de 20 pies de un cruce peatonal o dentro
    del área marcada del cruce peatonal.
- id: 496
  category: safe_driving_rules
  question: 'Al finalizar una maniobra de estacionamiento en paralelo, su vehículo
    no debe estar a una distancia del bordillo mayor a:'
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: Al finalizar su maniobra de estacionamiento en paralelo, el vehículo
    no debe quedar a más de 18 pulgadas del bordillo.
- id: 497
  category: defensive_driving
  question: Si no puede retirar su vehículo averiado de la carretera, ¿cuál es una
    forma de advertir a los demás conductores?
  choices:
    A: Pararse en la carretera y agitar los brazos.
    B: Atar un pañuelo en la manija de la puerta izquierda o en la antena.
    C: Parpadear los faros delanteros continuamente.
    D: Tocar la bocina cada 10 segundos.
  answer: B
  explanation: Si no puede retirar el vehículo de la carretera, levante el capó o
    ate un pañuelo en la manija de la puerta izquierda o en la antena para advertir
    a los demás conductores sobre su vehículo detenido.
- id: 498
  category: vehicle_information
  question: ¿Qué debe hacer con la transmisión de su vehículo al estacionar un automóvil
    con transmisión manual?
  choices:
    A: Dejarla en punto muerto (neutral) y aplicar el freno de estacionamiento.
    B: Dejarla en la posición de estacionamiento (park).
    C: Dejar el vehículo en marcha (engranado) y poner el freno de estacionamiento.
    D: Dejarla en punto muerto (neutral) sin el freno de estacionamiento.
  answer: C
  explanation: Siempre ponga el freno de estacionamiento al aparcar. Deje el vehículo
    en marcha (engranado) si tiene transmisión manual, o en la posición de estacionamiento
    (park) si tiene transmisión automática.
- id: 499
  category: safe_driving_rules
  question: ¿Es legal retroceder hacia una intersección desde un camino de entrada
    (driveway)?
  choices:
    A: Sí, si primero mira en ambas direcciones.
    B: Sí, pero solo durante las horas de luz del día.
    C: No, es ilegal retroceder hacia una intersección desde un camino de entrada.
    D: No, a menos que tenga un pasajero guiándolo.
  answer: C
  explanation: 'El manual establece explícitamente: "Es ilegal retroceder hacia una
    intersección desde un camino de entrada".'
- id: 500
  category: safe_driving_rules
  question: ¿Qué establece el manual del conductor con respecto a caminar por la autopista
    interestatal?
  choices:
    A: Está permitido siempre y cuando se mantenga en el arcén (hombro).
    B: Es legal solo durante las horas de luz del día.
    C: Es tanto ilegal como peligroso.
    D: Se recomienda si su automóvil se avería y necesita gasolina.
  answer: C
  explanation: El manual establece explícitamente que caminar por la autopista interestatal
    es tanto ilegal como peligroso, y debe permanecer en su vehículo averiado hasta
    que llegue la ayuda.
- id: 501
  category: penalties_and_points
  question: ¿Cuál es la sanción por estacionarse incorrectamente en un espacio designado
    para discapacitados?
  choices:
    A: Una multa de $50 y una advertencia por escrito.
    B: Un delito menor castigable con una multa de $100 y el vehículo puede ser remolcado.
    C: Un delito grave castigable con una multa de $500.
    D: Suspensión inmediata de la licencia por 30 días.
  answer: B
  explanation: Estacionarse incorrectamente en espacios designados para discapacitados
    es un delito menor castigable con una multa de $100, y el vehículo podría estar
    sujeto a ser remolcado.
- id: 502
  category: safe_driving_rules
  question: Al retroceder para salir de un espacio de estacionamiento en ángulo, ¿qué
    debe recordar sobre la parte delantera de su automóvil?
  choices:
    A: Girará en la misma dirección que la curva.
    B: Girará en dirección opuesta a la curva.
    C: Se moverá en línea recta hacia atrás sin girar.
    D: Girará hacia el borde de la acera más cercano.
  answer: B
  explanation: Antes de retroceder para salir de un espacio de estacionamiento en
    ángulo, debe recordar que la parte delantera de su automóvil girará en dirección
    opuesta a la curva (o al giro).
- id: 503
  category: sharing_the_road
  question: 'Al rebasar a una bicicleta que viaja en la misma dirección, la ley exige
    que los conductores dejen una distancia mínima de:'
  choices:
    A: 1 pie
    B: 2 pies
    C: 3 pies
    D: 5 pies
  answer: C
  explanation: La ley exige que los conductores, al rebasar a una bicicleta que viaja
    en la misma dirección, dejen una distancia mínima de 3 pies.
- id: 504
  category: safe_driving_rules
  question: Al ingresar a una autopista interestatal, ¿cuál es el uso correcto del
    carril de aceleración?
  choices:
    A: Para estacionar su vehículo en caso de emergencia.
    B: Para detenerse y esperar un espacio grande en el tráfico.
    C: Para acelerar e incorporarse al tráfico que se mueve rápidamente.
    D: Para permitir que el tráfico de la autopista interestatal tenga un lugar para
      salir.
  answer: C
  explanation: Al ingresar a una autopista interestatal, debe usar el carril de incorporación
    o aceleración para aumentar la velocidad e incorporarse al tráfico rápido que
    ya circula por la autopista.
- id: 505
  category: safe_driving_rules
  question: ¿Quién tiene el derecho de paso cuando usted intenta ingresar a la autopista
    interestatal desde una rampa de entrada?
  choices:
    A: El vehículo que ingresa a la autopista interestatal.
    B: Los otros automóviles que ya viajan por la autopista interestatal.
    C: El vehículo que viaje más rápido.
    D: El vehículo a la derecha.
  answer: B
  explanation: Es su responsabilidad ceder el derecho de paso a los otros automóviles
    que ya están en la autopista interestatal cuando usted va a ingresar.
- id: 506
  category: signs_and_signals
  question: ¿Qué indica una señal de 'carril añadido' (lane added) a los conductores
    que ya viajan por la autopista interestatal?
  choices:
    A: Deben incorporarse a la izquierda inmediatamente.
    B: Deben evitar hacer cambios de carril hacia la derecha en este lugar.
    C: Deben ceder el paso a todo el tráfico que ingresa.
    D: La autopista interestatal termina y deben salir.
  answer: B
  explanation: La señal de 'carril añadido' significa que se agrega un nuevo carril
    derecho para el tráfico entrante. El tráfico en la autopista interestatal debe
    evitar hacer cambios de carril hacia la derecha porque el tráfico que ingresa
    no esperará que los vehículos se muevan hacia su camino.
- id: 507
  category: safe_driving_rules
  question: 'En las autopistas interestatales con varios carriles que viajan en la
    misma dirección, el carril del extremo izquierdo debe usarse para:'
  choices:
    A: El tráfico que ingresa.
    B: El tráfico que sale.
    C: Los vehículos más lentos.
    D: El tráfico más rápido.
  answer: D
  explanation: En las autopistas interestatales con varios carriles de tráfico que
    viajan en la misma dirección, debe dejar el carril del extremo izquierdo para
    el tráfico más rápido.
- id: 508
  category: defensive_driving
  question: ¿Cuál es la distancia mínima de seguimiento recomendada en la autopista
    interestatal con mal tiempo o de noche?
  choices:
    A: Dos segundos
    B: Tres segundos
    C: Cuatro segundos
    D: Seis segundos
  answer: C
  explanation: Debe mantenerse al menos a dos segundos detrás de los vehículos que
    van delante de usted, y aumentar este espacio a un mínimo de cuatro segundos con
    mal tiempo, al conducir de noche y en tramos rurales de mayor velocidad.
- id: 509
  category: defensive_driving
  question: ¿Qué tan adelante debe observar (escanear) la carretera al conducir en
    la autopista interestatal?
  choices:
    A: 5-10 segundos
    B: 10-15 segundos
    C: 15-20 segundos
    D: 20-30 segundos
  answer: C
  explanation: El manual aconseja observar la carretera más adelante y tratar de mirar
    de 15 a 20 segundos por delante de su vehículo para ver si hay automóviles frenando,
    ingresando o saliendo.
- id: 510
  category: defensive_driving
  question: Si observa un embotellamiento en la autopista interestatal que le obliga
    a reducir la velocidad o detenerse, ¿qué debe hacer para alertar a los conductores
    detrás de usted?
  choices:
    A: Encender las luces altas.
    B: Pisar ligeramente el pedal del freno varias veces.
    C: Tocar la bocina continuamente.
    D: Desviarse de lado a lado en su carril.
  answer: B
  explanation: Si observa un embotellamiento que le obliga a reducir la velocidad
    o detenerse, debe pisar ligeramente el pedal del freno varias veces para alertar
    a los conductores detrás de usted.
- id: 511
  category: defensive_driving
  question: 'Según las preguntas de muestra del manual, la regla de los dos segundos
    para mantener una distancia de seguimiento segura es válida a:'
  choices:
    A: Velocidades de hasta 30 m.p.h.
    B: Velocidades de hasta 55 m.p.h.
    C: Cualquier velocidad.
    D: Solo a velocidades de autopista.
  answer: C
  explanation: Las preguntas de prueba de muestra indican que la regla de los dos
    segundos para mantener una distancia de seguimiento segura es válida a cualquier
    velocidad.
- id: 512
  category: safe_driving_rules
  question: Si va a salir de la autopista interestatal, ¿cuál es la forma más segura
    de prepararse?
  choices:
    A: Moverse al carril derecho lo antes posible para evitar cambios de carril apresurados.
    B: Mantenerse en el carril izquierdo hasta llegar a la rampa de salida.
    C: Acelerar para rebasar al tráfico más lento antes de cruzarse hacia la salida.
    D: Detenerse en su carril y esperar un espacio en el carril derecho.
  answer: A
  explanation: Si va a salir de la autopista interestatal, muévase al carril derecho
    lo antes posible para evitar cambios de carril apresurados, lo cual podría resultar
    en una situación peligrosa.
- id: 513
  category: penalties_and_points
  question: ¿Cuál es la sanción por violar las reglas del carril para vehículos de
    alta ocupación (HOV)?
  choices:
    A: Una multa de $25
    B: Una multa de $50 y costos judiciales
    C: Una multa de $100 y 2 puntos en su licencia
    D: Una multa de $75 y escuela de tránsito obligatoria
  answer: B
  explanation: Según el manual, los conductores que infrinjan las reglas del carril
    HOV están sujetos a una multa de $50 y costos judiciales.
- id: 514
  category: safe_driving_rules
  question: ¿Cuál de los siguientes vehículos tiene permitido usar el carril para
    vehículos de alta ocupación (HOV) durante las horas pico de tráfico?
  choices:
    A: Una persona conduciendo sola para rebasar a otro vehículo
    B: Una motocicleta ocupada por una persona
    C: Un automóvil de pasajeros solo con el conductor
    D: Un camión comercial con un solo conductor
  answer: B
  explanation: Durante las horas de alto tráfico de entrada y salida, el carril HOV
    está reservado para vehículos con 2 o más personas, autobuses con 2 o más ocupantes,
    motocicletas ocupadas por 1 persona y vehículos de emergencia.
- id: 515
  category: safe_driving_rules
  question: Si viaja en el carril izquierdo de una autopista interestatal y un vehículo
    se acerca por detrás a mayor velocidad, ¿qué debe hacer?
  choices:
    A: Acelerar para igualar su velocidad
    B: Tocar ligeramente los frenos para advertirles que reduzcan la velocidad
    C: Moverse un carril a su derecha
    D: Mantenerse en su carril porque está conduciendo al límite de velocidad
  answer: C
  explanation: 'El manual establece: ''Si viaja en el carril izquierdo y alguien se
    acerca por detrás a mayor velocidad, muévase un carril a su derecha. El carril
    izquierdo es solo para rebasar''.'
- id: 516
  category: safe_driving_rules
  question: ¿Cómo se hace un giro a la izquierda en un cruce de trébol (cloverleaf
    interchange)?
  choices:
    A: Tomar la rampa de giro a la izquierda antes del paso elevado
    B: Tomar la rampa de giro a la derecha justo después del paso elevado
    C: Tomar la rampa de giro a la derecha antes del paso elevado
    D: Cruzar la trayectoria del tráfico y girar a la izquierda
  answer: B
  explanation: En un cruce de trébol, todos los giros son a la derecha. Para girar
    a la izquierda, debe tomar el giro a la derecha justo después del paso elevado.
- id: 517
  category: sharing_the_road
  question: 'Cuando camiones y autobuses están ingresando a la autopista interestatal,
    usted debe:'
  choices:
    A: Acelerar para rebasarlos rápidamente
    B: Tocar la bocina para hacerles saber que usted está ahí
    C: Ser cooperativo y darles tiempo y espacio adicional para adaptarse al flujo
      del tráfico
    D: Obligarlos a ceder el paso manteniendo su velocidad y posición en el carril
  answer: C
  explanation: Recuerde que los camiones y autobuses que ingresan a la autopista interestatal
    pueden necesitar tiempo adicional para adaptarse a los patrones de tráfico. Sea
    cooperativo y deles tiempo y espacio adicional para adaptarse al flujo del tráfico.
- id: 518
  category: safe_driving_rules
  question: Al salir de la autopista interestatal, ¿cuándo debe comenzar a reducir
    significativamente su velocidad?
  choices:
    A: Una milla antes de la salida
    B: Tan pronto como indique su intención de salir
    C: Después de ingresar al carril de desaceleración
    D: Mientras todavía está en el carril principal de tráfico
  answer: C
  explanation: Debe mantener su velocidad hasta ingresar al carril de desaceleración,
    que generalmente está delineado por una serie de reflectores blancos, y luego
    reducir su velocidad a la velocidad indicada en la rampa de salida.
- id: 519
  category: safe_driving_rules
  question: ¿Bajo qué condición es legal estacionar un vehículo motorizado en la parte
    pavimentada o no pavimentada de una rampa de entrada o salida de una autopista
    interestatal?
  choices:
    A: Cuando necesite revisar su mapa o GPS
    B: Solo si el vehículo está averiado
    C: Cuando necesite hacer una llamada telefónica
    D: Si está esperando a que otro vehículo lo alcance
  answer: B
  explanation: Es ilegal estacionar un vehículo motorizado en las partes pavimentadas
    o no pavimentadas de cualquier rampa de entrada o salida de cualquier autopista
    a menos que el vehículo esté averiado.
- id: 520
  category: defensive_driving
  question: ¿Qué hace que un cruce de 'entrelazamiento' (weaving interchange) sea
    particularmente peligroso?
  choices:
    A: El tráfico sale y entra por el mismo carril
    B: Los carriles son más estrechos que los carriles estándar de las autopistas
      interestatales
    C: Los conductores deben hacer giros cerrados a la izquierda cruzando el tráfico
    D: No hay límites de velocidad publicados en las rampas
  answer: A
  explanation: Una de las situaciones más peligrosas en el manejo de carriles ocurre
    cuando el tráfico de la autopista interestatal sale y entra por el mismo carril,
    lo que requiere atención completa y reacciones rápidas.
- id: 521
  category: safe_driving_rules
  question: ¿A quién se le permite legalmente conducir sobre o a través de la sección
    divisoria (mediana) de una autopista interestatal?
  choices:
    A: A cualquier conductor que se pase de su salida
    B: A los conductores de Vehículos de Alta Ocupación (HOV)
    C: Solo a los vehículos de emergencia y equipos de mantenimiento de carreteras
    D: A cualquier conductor durante un embotellamiento severo
  answer: C
  explanation: En la autopista interestatal, NO debe conducir sobre o a través de
    ninguna sección divisoria o separación. Solo los vehículos de emergencia y los
    equipos de mantenimiento de carreteras pueden cruzar la mediana de una interestatal.
- id: 522
  category: defensive_driving
  question: ¿Cuál es la práctica recomendada con respecto a conducir en los puntos
    ciegos de otros conductores en la autopista interestatal?
  choices:
    A: Seguir de cerca a un lado para que puedan escuchar su motor
    B: Quedarse atrás o rebasarlos
    C: Parpadear las luces delanteras continuamente mientras esté en el punto ciego
    D: Mantener su velocidad y posición sin importar su punto ciego
  answer: B
  explanation: No conduzca en el punto ciego de otros conductores. Viajar en una posición
    donde el conductor de adelante no puede ver su vehículo es peligroso. Quédese
    atrás o rebáselo; NO lo siga a un lado.
- id: 523
  category: safe_driving_rules
  question: ¿Cómo se utilizan los carriles para Vehículos de Alta Ocupación (HOV)
    los fines de semana?
  choices:
    A: Están cerrados a todo el tráfico
    B: Están reservados estrictamente para vehículos de emergencia
    C: Sirven como carriles de uso general para todos los vehículos
    D: Requieren tres o más ocupantes en lugar de dos
  answer: C
  explanation: El carril HOV sirve como carril de uso general los fines de semana
    y durante las horas de menor tráfico en los días laborables.
- id: 524
  category: defensive_driving
  question: Según el manual, ¿por qué conducir de noche se considera mucho más peligroso
    que conducir de día?
  choices:
    A: Porque los límites de velocidad aumentan de noche
    B: Porque hay más camiones comerciales en la carretera
    C: Debido a la fatiga, la visión drásticamente reducida y a que hay más conductores
      ebrios
    D: Porque la iluminación de la interestatal se apaga con frecuencia para ahorrar
      energía
  answer: C
  explanation: Conducir de noche es mucho más peligroso que conducir de día. La fatiga
    y la visión drásticamente reducida son los principales responsables, y es más
    probable que haya conductores ebrios en la carretera por la noche.
- id: 525
  category: defensive_driving
  question: ¿Con qué frecuencia debe detenerse y refrescarse para ayudar a evitar
    la hipnosis de la autopista (interstate hypnosis)?
  choices:
    A: Al menos cada 4 horas o 200 millas.
    B: Al menos cada 2 horas o 100 millas.
    C: Al menos cada 6 horas o 300 millas.
    D: Solo cuando necesite repostar combustible en su vehículo.
  answer: B
  explanation: Para evitar la hipnosis de la autopista, el manual recomienda tomar
    un descanso y salir del automóvil al menos cada dos horas, o aproximadamente cada
    100 millas.
- id: 526
  category: safe_driving_rules
  question: Para mantener la seguridad en la carretera, ¿cuál es el número máximo
    de horas que debe conducir por día?
  choices:
    A: 6 horas
    B: 8 horas
    C: 10 horas
    D: 12 horas
  answer: B
  explanation: El manual establece que es más seguro para usted y para los demás si
    no conduce más de ocho horas al día.
- id: 527
  category: signs_and_signals
  question: ¿Qué muestran los Señalamientos Dinámicos de Mensajes (Dynamic Message
    Signs) cuando no están en uso?
  choices:
    A: El límite de velocidad actual de la interestatal.
    B: La hora y temperatura locales.
    C: Normalmente están en blanco.
    D: Anuncios de negocios locales.
  answer: C
  explanation: Los Señalamientos Dinámicos de Mensajes proporcionan información en
    tiempo real a los automovilistas, pero el manual señala que estos letreros normalmente
    están en blanco cuando no están en uso.
- id: 528
  category: defensive_driving
  question: ¿Qué comportamiento de conducción se describe como reducir la velocidad
    para mirar choques o cualquier cosa fuera de lo común, causando congestión del
    tráfico?
  choices:
    A: Seguir muy de cerca (Tailgating)
    B: Mirar por curiosidad (Rubbernecking)
    C: Hipnosis de la autopista
    D: Cambios de carril innecesarios
  answer: B
  explanation: El manual identifica el 'rubbernecking' (mirar por curiosidad) como
    reducir la velocidad para mirar choques o prácticamente cualquier otra cosa fuera
    de lo común, calificándolo como uno de los peores causantes de congestión.
- id: 529
  category: sharing_the_road
  question: ¿Qué debe hacer si las condiciones del tráfico hacen que sea inseguro
    cambiar de carril al acercarse a un vehículo de emergencia estacionado en el acotamiento?
  choices:
    A: Detenerse en su carril hasta que el tráfico se despeje.
    B: Acelerar para rebasar al vehículo de emergencia lo más rápido posible.
    C: Orillarse en el acotamiento opuesto.
    D: Reducir la velocidad y permanecer en el mismo carril.
  answer: D
  explanation: SOLO cuando las condiciones del tráfico hacen que sea inseguro realizar
    dicho cambio de carril, se le permite al automovilista responder a esta situación
    simplemente reduciendo la velocidad y permaneciendo en el mismo carril.
- id: 530
  category: sharing_the_road
  question: 'Además de los vehículos de emergencia y mantenimiento, la Ley de Hacerse
    a un Lado (Move Over Law) de Tennessee también se aplica a:'
  choices:
    A: Todos los vehículos en movimiento en la interestatal.
    B: Vehículos motorizados estacionados con sus luces intermitentes de emergencia
      encendidas.
    C: Bicicletas que viajan por el acotamiento.
    D: Peatones caminando por la carretera.
  answer: B
  explanation: El manual establece que, además de los vehículos de emergencia estacionados,
    la ley de Hacerse a un Lado (Move Over) ahora se aplica a todos los vehículos
    motorizados estacionados, como su automóvil o camión, con sus luces intermitentes
    de emergencia encendidas.
- id: 531
  category: safe_driving_rules
  question: Si su vehículo se avería y necesita ayuda, ¿cómo debe hacer señales a
    otros conductores y a las autoridades?
  choices:
    A: Pararse en medio del carril y agitar los brazos.
    B: Levantar el capó y atar un paño blanco al capó o a la antena del radio.
    C: Encender y apagar los faros repetidamente.
    D: Tocar la bocina continuamente.
  answer: B
  explanation: Si tiene problemas con el vehículo y necesita ayuda, el manual aconseja
    levantar el capó y atar un paño blanco al capó o a la antena del radio.
- id: 532
  category: safe_driving_rules
  question: Si tiene problemas con el vehículo y se detiene en el arcén (hombro de
    la carretera), ¿cuál es el lugar más seguro para esperar ayuda?
  choices:
    A: Caminar por la autopista interestatal para buscar un teléfono.
    B: Sentarse en el maletero (baúl) de su auto.
    C: Dentro o cerca de su vehículo, en el lado alejado del tráfico.
    D: Pararse en el carril junto a su vehículo para dirigir el tráfico.
  answer: C
  explanation: El manual indica que, de ser posible, es mejor permanecer dentro o
    cerca de su vehículo en el lado alejado del tráfico, y señala que caminar por
    la autopista interestatal es peligroso.
- id: 533
  category: driver_responsibility
  question: Si se ve involucrado en un accidente de tráfico en la autopista interestatal,
    ¿cuándo permite la ley de Tennessee mover el vehículo al carril de emergencia?
  choices:
    A: Solo después de que la policía haya llegado y tomado fotos.
    B: Si el vehículo se puede conducir y no hay lesiones personales graves ni muertes.
    C: Nunca se permite mover un vehículo después de un accidente.
    D: Solo si el accidente involucra a más de tres vehículos.
  answer: B
  explanation: Según la sección 'Muévalo por Seguridad' (Move It for Safety), si el
    vehículo aún se puede conducir y NO HAY LESIONES PERSONALES GRAVES ni muertes,
    puede mover el vehículo o vehículos al carril de emergencia.
- id: 534
  category: safe_driving_rules
  question: ¿Qué número puede marcar en su teléfono móvil sin costo para conectarse
    con el Centro de Despacho de la Patrulla de Carreteras de Tennessee?
  choices:
    A: '*DOT (*368)'
    B: '*HELP (*4357)'
    C: '*THP (*847)'
    D: '*911 (*911)'
  answer: C
  explanation: En caso de una emergencia en la carretera, puede marcar *THP (*847)
    para conectarse con el despachador de la Patrulla de Carreteras de Tennessee más
    cercano.
- id: 535
  category: defensive_driving
  question: 'Para ayudar a evitar la hipnosis de la autopista, los conductores deben
    acostumbrarse a:'
  choices:
    A: Mirar fijamente hacia adelante a las líneas de la carretera.
    B: Mover los ojos de izquierda a derecha y revisar el espejo retrovisor.
    C: Mantener el interior del auto lo más cálido posible.
    D: Escuchar los sonidos constantes del viento y el zumbido de los neumáticos.
  answer: B
  explanation: Para combatir la hipnosis de la autopista, el manual aconseja a los
    conductores mover los ojos de izquierda a derecha y revisar el espejo retrovisor,
    evitando mirar fijamente hacia adelante.
- id: 536
  category: sharing_the_road
  question: Si un vehículo de emergencia está detenido en el arcén izquierdo de una
    autopista de varios carriles, ¿qué debe hacer según la Ley de Hacerse a un Lado
    (Move Over Law)?
  choices:
    A: Incorporarse al carril derecho de tráfico para liberar el carril más a la izquierda
      como barrera de seguridad.
    B: Incorporarse al carril izquierdo de tráfico para acercarse al vehículo.
    C: Detener su vehículo en el carril izquierdo.
    D: Conducir por el arcén derecho para rebasar.
  answer: A
  explanation: Si el vehículo de emergencia está detenido en el arcén izquierdo, el
    conductor debe incorporarse al carril derecho de tráfico, liberando el carril
    más a la izquierda como barrera de seguridad.
- id: 537
  category: vehicle_information
  question: Según el manual, ¿cuál de los siguientes es un artículo recomendado para
    llevar en su auto específicamente para emergencias de viaje en invierno?
  choices:
    A: Un ventilador portátil.
    B: Un raspador de ventanas para vidrios congelados.
    C: Líquido refrigerante adicional para el motor.
    D: Un parasol.
  answer: B
  explanation: La sección de equipo de seguridad y emergencia sugerido indica que
    durante los viajes de invierno, debe llevar una manta, un pequeño calentador portátil,
    un raspador de ventanas para vidrios congelados y neumáticos de nieve o cadenas
    para neumáticos.
- id: 538
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento adecuado al ingresar a una autopista interestatal?
  choices:
    A: Detenerse, verificar si hay autos y entrar cuando sea seguro.
    B: Verificar si hay autos, reducir la velocidad a 25 MPH antes de ingresar al
      carril de tráfico.
    C: Verificar si hay autos, aumentar su velocidad para igualar el flujo del tráfico
      e incorporarse cuando la vía esté despejada.
    D: Tocar la bocina, mantener su velocidad actual e incorporarse directamente al
      carril derecho.
  answer: C
  explanation: Según las preguntas de prueba de muestra del manual, al ingresar a
    una autopista interestatal, debe verificar si hay autos, aumentar su velocidad
    para igualar el flujo del tráfico e incorporarse cuando la vía esté despejada.
- id: 539
  category: safe_driving_rules
  question: ¿A quién se le permite legalmente usar los cruces de emergencia en la
    autopista interestatal en Tennessee?
  choices:
    A: A cualquier conductor que se haya pasado su salida.
    B: A cualquier conductor, siempre y cuando no haya otros vehículos presentes.
    C: A los conductores de camiones comerciales durante el tráfico pesado.
    D: Solo a los vehículos de emergencia y a los equipos de mantenimiento de carreteras.
  answer: D
  explanation: Los cruces de emergencia en la autopista interestatal son legales en
    Tennessee solo para vehículos de emergencia y equipos de mantenimiento de carreteras.
- id: 540
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo resulta dañado en un accidente en la autopista
    interestatal y no hay lesiones graves?
  choices:
    A: Dejar el vehículo en el carril de tráfico hasta que llegue la policía.
    B: Mover el vehículo dañado al arcén.
    C: Detener el tráfico para intercambiar información de seguros de manera segura.
    D: Abandonar el vehículo y caminar hasta la salida más cercana.
  answer: B
  explanation: El Departamento de Transporte de Tennessee ha colocado letreros recordando
    a los conductores que muevan sus vehículos dañados al arcén si no han ocurrido
    lesiones graves.
- id: 541
  category: defensive_driving
  question: Estadísticamente, ¿cuándo ocurren más choques fatales que en cualquier
    otro día?
  choices:
    A: Las mañanas de los lunes y martes.
    B: Las noches de los miércoles y jueves.
    C: Las noches de los viernes y sábados.
    D: Las tardes de los domingos.
  answer: C
  explanation: El manual indica que ocurren más choques fatales en las noches de los
    viernes y sábados que en cualquier otro día.
- id: 542
  category: safe_driving_rules
  question: ¿Cuál es la regla básica para conducir de forma segura de noche?
  choices:
    A: Usar siempre las luces altas.
    B: Nunca sobrepasar el alcance de sus faros.
    C: Conducir al límite de velocidad indicado sin importar la visibilidad.
    D: Mantener encendida la luz interior del techo.
  answer: B
  explanation: 'La regla básica para conducir de forma segura de noche es: NUNCA SOBREPASAR
    EL ALCANCE DE SUS FAROS, porque su rango de visibilidad está limitado por la iluminación
    de sus faros.'
- id: 543
  category: defensive_driving
  question: ¿Cómo debe evitar el resplandor de los faros de los vehículos que se aproximan
    de noche?
  choices:
    A: Mirar directamente a los faros que se aproximan para seguir al vehículo.
    B: Parpadear las luces altas repetidamente al conductor que se aproxima.
    C: Mirar el borde derecho de la carretera y usar la línea blanca o el borde de
      la carretera como guía de dirección.
    D: Cerrar un ojo hasta que pase el vehículo.
  answer: C
  explanation: Para evitar el resplandor de las luces que se aproximan, debe mirar
    el borde derecho de la carretera y usar la línea blanca o el borde de la carretera
    como guía de dirección.
- id: 544
  category: vehicle_information
  question: Por ley, ¿a qué distancia mínima por delante de su vehículo deben sus
    faros permitirle ver claramente a cualquier persona en la carretera?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley exige faros que le permitan ver claramente a cualquier persona
    en la carretera al menos a doscientos (200) pies por delante de su vehículo.
- id: 545
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar las luces de sus faros al encontrarse o rebasar
    vehículos?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Debe cumplir con los requisitos adecuados de bajar las luces de noche
    al encontrarse o rebasar vehículos a una distancia de 500 pies.
- id: 546
  category: safe_driving_rules
  question: Siempre que se estacione en o a lo largo de una carretera de noche, ¿qué
    debe hacer?
  choices:
    A: Dejar los faros en luces altas.
    B: Dejar los faros en luces bajas.
    C: Dejar encendidas las luces de emergencia y de estacionamiento.
    D: Apagar todas las luces para ahorrar batería.
  answer: C
  explanation: Siempre que se estacione en o a lo largo de una carretera de noche,
    deje encendidas las luces de emergencia y de estacionamiento. Nunca deje los faros
    encendidos, ya que pueden cegar o confundir a los conductores que se aproximan.
- id: 547
  category: defensive_driving
  question: ¿Cuándo es el pavimento particularmente peligroso y más resbaladizo durante
    el clima lluvioso?
  choices:
    A: Después de que ha estado lloviendo fuertemente durante varias horas.
    B: Cuando recién comienza a llover.
    C: Justo después de que deja de llover.
    D: Al conducir a través de charcos profundos.
  answer: B
  explanation: El pavimento es particularmente peligroso cuando recién comienza a
    llover porque las acumulaciones de tierra y aceite se mezclarán con el agua, creando
    una capa grasosa en la carretera.
- id: 548
  category: safe_driving_rules
  question: Al conducir en clima lluvioso, ¿qué luces debe usar?
  choices:
    A: Solo las luces de estacionamiento.
    B: Los faros en luces altas.
    C: Los faros en luces bajas.
    D: Solo las luces intermitentes de emergencia.
  answer: C
  explanation: El clima lluvioso requiere conducir con los faros en luces bajas para
    que la luz ilumine la carretera donde la necesita.
- id: 549
  category: defensive_driving
  question: ¿Cuál es el mejor consejo para conducir en niebla o humo?
  choices:
    A: Encender las luces altas y conducir rápidamente a través de ellos.
    B: Seguir muy de cerca al vehículo que va delante de usted.
    C: NO conducir en niebla o humo.
    D: Usar solo las luces de estacionamiento.
  answer: C
  explanation: El manual indica que el mejor consejo para conducir en niebla o humo
    es "NO HACERLO". Si debe viajar, debe tomar precauciones específicas.
- id: 550
  category: safe_driving_rules
  question: Si debe viajar en niebla o humo, ¿cómo debe usar las luces de su vehículo?
  choices:
    A: Conducir con las luces altas encendidas.
    B: Conducir con las luces bajas encendidas.
    C: Conducir solo con las luces de estacionamiento encendidas.
    D: Conducir solo con las luces antiniebla encendidas.
  answer: B
  explanation: Si debe viajar en niebla o humo, debe conducir con las luces bajas
    encendidas. Las luces altas afectarán su visibilidad, y nunca debe conducir solo
    con las luces de estacionamiento o antiniebla encendidas.
- id: 551
  category: defensive_driving
  question: Si su automóvil se apaga o se avería mientras conduce en la niebla, ¿qué
    debe hacer?
  choices:
    A: Quedarse dentro del vehículo y esperar ayuda.
    B: Pararse directamente detrás del vehículo para desviar el tráfico.
    C: Alejarse del vehículo para evitar lesiones personales.
    D: Dejar el vehículo en el carril de tráfico y caminar a casa.
  answer: C
  explanation: Si su automóvil se apaga o se avería en la niebla, aléjese del vehículo
    para evitar lesiones personales.
- id: 552
  category: defensive_driving
  question: ¿Por qué debe evitar encender y apagar las luces altas para advertir a
    un conductor que se aproxima de noche?
  choices:
    A: Agota la batería de su vehículo.
    B: Es ilegal en todas las circunstancias.
    C: Podría servir como distracción e interferir con su conducción, resultando en
      un choque.
    D: Hará que sus faros se quemen más rápido.
  answer: C
  explanation: Debe evitar encender y apagar las luces altas para advertir al otro
    conductor, ya que podría servir como distracción e interferir con su conducción,
    resultando en un choque.
- id: 553
  category: safe_driving_rules
  question: ¿Qué debe hacer si debe detener su vehículo en niebla densa porque no
    puede ver el borde de la carretera?
  choices:
    A: Detenerse en medio del carril de tráfico y encender las luces altas.
    B: Salirse de la carretera lo más a la derecha posible, bien fuera del carril
      de tráfico, y encender las luces intermitentes de emergencia.
    C: Detenerse en la calzada y tocar la bocina repetidamente para advertir a los
      demás.
    D: Salirse al arcén izquierdo y apagar todas las luces.
  answer: B
  explanation: El manual indica que si no puede ver el borde de la carretera en la
    niebla, debe salirse lo más a la derecha posible, bien fuera del carril de tráfico,
    y encender las luces intermitentes de emergencia.
- id: 554
  category: defensive_driving
  question: ¿Por qué el pavimento puede estar muy resbaladizo durante los primeros
    minutos cuando empieza a llover en un día caluroso?
  choices:
    A: La lluvia se congela inmediatamente sobre el asfalto caliente.
    B: El agua se mezcla con la tierra para crear lodo profundo.
    C: El calor hace que el aceite del asfalto suba a la superficie, haciéndolo extremadamente
      resbaladizo hasta que se lava.
    D: El pavimento caliente hace que la lluvia se evapore instantáneamente, reduciendo
      la tracción de las llantas.
  answer: C
  explanation: Según el manual, el calor hace que el aceite del asfalto suba a la
    superficie, y esto hace que la carretera sea extremadamente resbaladiza hasta
    que el aceite se lava.
- id: 555
  category: safe_driving_rules
  question: ¿Qué exige la ley de Tennessee al conducir a través de niebla densa, lluvia
    fuerte o nieve durante el día?
  choices:
    A: Encender las luces altas.
    B: Encender las luces intermitentes de emergencia.
    C: Encender las luces bajas.
    D: Encender la luz interior del techo.
  answer: C
  explanation: 'El manual establece explícitamente: ''AL CONDUCIR A TRAVÉS DE NIEBLA
    DENSA, LLUVIA FUERTE O NIEVE DURANTE EL DÍA, ENCIENDA SUS LUCES BAJAS... también
    es un requisito de la ley de Tennessee''.'
- id: 556
  category: defensive_driving
  question: Si su vehículo comienza a hidroplanear (deslizarse sobre el agua), ¿cuál
    es la mejor manera de reducir la velocidad?
  choices:
    A: Frenar bruscamente de inmediato.
    B: Cambiar a neutral y dejarse llevar.
    C: Bombear los frenos rápidamente.
    D: Reducir la velocidad gradualmente soltando el acelerador.
  answer: D
  explanation: El manual aconseja que si su vehículo comienza a hidroplanear, debe
    'reducir la velocidad gradualmente soltando el acelerador' y 'No frenar bruscamente'.
- id: 557
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto al hidroplaneo?
  choices:
    A: Solo ocurre a velocidades superiores a 55 mph.
    B: Las distancias de frenado pueden triplicarse y el control de la dirección puede
      reducirse o perderse.
    C: Aumenta el control de la dirección debido a la resistencia del agua.
    D: Solo ocurre al conducir a través de aguas de inundación profundas.
  answer: B
  explanation: El manual señala que cuando ocurre el hidroplaneo, 'Las distancias
    de frenado pueden triplicarse y el control de la dirección puede reducirse o perderse'.
    También establece que las llantas pueden hidroplanear a CUALQUIER velocidad.
- id: 558
  category: defensive_driving
  question: ¿Qué debe hacer si su vehículo comienza a derrapar?
  choices:
    A: Frenar bruscamente para detener el vehículo rápidamente.
    B: Girar el volante en la dirección opuesta a la que desea que vaya el automóvil.
    C: No pisar el freno y girar el volante en la dirección a la que desea que vaya
      su automóvil.
    D: Acelerar rápidamente para recuperar la tracción.
  answer: C
  explanation: Si su vehículo comienza a derrapar, el manual indica 'No pise el freno'
    y 'Gire el volante en la dirección a la que desea que vaya su automóvil'.
- id: 559
  category: defensive_driving
  question: ¿Cómo debe reaccionar si sus llantas se salen de la calzada pavimentada?
  choices:
    A: Girar bruscamente el volante hacia el pavimento.
    B: Frenar bruscamente y mantener el pedal presionado.
    C: Acelerar para volver a la carretera rápidamente.
    D: Levantar el pie del acelerador y frenar ligera y brevemente.
  answer: D
  explanation: Para recuperar el control cuando se sale del pavimento, debe 'Levantar
    el pie del acelerador pero NO aplicar el freno bruscamente' y 'Frenar ligera y
    brevemente'.
- id: 560
  category: signs_and_signals
  question: ¿Cuál es la función principal de las bandas sonoras (Rumble Stripes) en
    las carreteras de Tennessee?
  choices:
    A: Despertar a los conductores que se quedan dormidos al volante.
    B: Mejorar la visibilidad de la línea del borde en noches lluviosas.
    C: Indicar que se aproxima el final de una autopista.
    D: Reducir la velocidad de los vehículos en áreas residenciales.
  answer: B
  explanation: Aunque las bandas sonoras tienen un efecto secundario de vibración
    y ruido, el manual establece que 'su función principal es mejorar la visibilidad
    de la línea del borde en noches lluviosas'.
- id: 561
  category: safe_driving_rules
  question: ¿Cuánta agua en movimiento se necesita normalmente para arrastrar a la
    mayoría de los automóviles?
  choices:
    A: De 6 a 12 pulgadas
    B: De 18 a 24 pulgadas
    C: De 36 a 48 pulgadas
    D: Al menos 60 pulgadas
  answer: B
  explanation: El manual advierte que 'la mayoría de los automóviles pueden ser arrastrados
    por 18 a 24 pulgadas de agua en movimiento'.
- id: 562
  category: penalties_and_points
  question: ¿Qué puede suceder si un conductor ignora a sabiendas las barricadas de
    advertencia de inundación claramente visibles y conduce hacia un área inundada?
  choices:
    A: Solo recibirá una advertencia verbal de las fuerzas del orden.
    B: Puede ser acusado de conducción temeraria y ser considerado responsable de
      los costos de rescate.
    C: Su vehículo será confiscado permanentemente por el estado.
    D: Perderá automáticamente su licencia por cinco años.
  answer: B
  explanation: Según el manual, ignorar las señales o barricadas de advertencia de
    inundación puede resultar en que el conductor sea 'acusado de conducción temeraria'
    y 'responsable de la restitución de los fondos por el costo de su rescate'.
- id: 563
  category: defensive_driving
  question: ¿Cuál es la acción recomendada si ve un tornado mientras conduce?
  choices:
    A: Intentar dejar atrás el tornado conduciendo a la máxima velocidad.
    B: Quedarse en su automóvil y estacionarse debajo de un paso elevado.
    C: Salir del automóvil, buscar refugio en una zanja o área baja y acostarse boca
      abajo.
    D: Conducir hacia el tornado para pasarlo rápidamente.
  answer: C
  explanation: 'Si ve un tornado, el manual aconseja: ''NO intente dejarlo atrás.
    Salga del automóvil, busque refugio en una zanja o área baja y acuéstese boca
    abajo para protegerse de los escombros voladores''.'
- id: 564
  category: sharing_the_road
  question: Cuando un camión grande o un autobús lo está rebasando por la izquierda,
    ¿qué debe hacer para manejar las ráfagas de viento que crean?
  choices:
    A: Moverse lo más a la derecha posible en su carril y reducir la velocidad.
    B: Moverse al lado izquierdo de su carril para bloquear el viento.
    C: Acelerar rápidamente para mantenerse delante del camión.
    D: Tocar la bocina para advertir al conductor del camión.
  answer: A
  explanation: El manual indica que cuando un camión o autobús lo rebasa por la izquierda,
    debe 'moverse lo más a la derecha posible en su carril y reducir la velocidad'.
- id: 565
  category: defensive_driving
  question: ¿Cómo afecta a su conducción un fuerte viento de cola (viento que sopla
    desde detrás de su vehículo)?
  choices:
    A: Hace que la dirección sea significativamente más difícil.
    B: Disminuye su velocidad, lo que requiere que acelere más.
    C: Aumenta su velocidad, por lo que tendrá que desacelerar y comenzar a frenar
      antes para detenerse.
    D: Hace que su vehículo hidroplanee en pavimento seco.
  answer: C
  explanation: El manual explica que 'Un fuerte viento de cola (viento que sopla desde
    detrás de su vehículo) aumentará su velocidad, por lo que tendrá que desacelerar
    y comenzar a frenar antes para detenerse'.
- id: 566
  category: defensive_driving
  question: Si el sol está directamente detrás de usted mientras conduce, ¿de qué
    peligro debe ser consciente?
  choices:
    A: Sus limpiaparabrisas pueden dejar de funcionar.
    B: Los conductores que se aproximan en sentido contrario pueden tener un problema
      de deslumbramiento y podrían no ver sus luces direccionales.
    C: El motor de su vehículo puede sobrecalentarse más rápidamente.
    D: No podrá ver los instrumentos de su tablero.
  answer: B
  explanation: 'El manual advierte: ''Si el sol está detrás de usted, los conductores
    que se aproximan pueden tener el problema del deslumbramiento. Tenga en cuenta
    que es posible que no puedan ver sus luces direccionales o su automóvil''.'
- id: 567
  category: vehicle_information
  question: ¿Cuál es la técnica correcta para desatascar un vehículo del barro o la
    nieve?
  choices:
    A: Cambiar a una marcha alta y hacer girar las ruedas lo más rápido posible.
    B: Cambiar a una marcha baja, mantener las ruedas delanteras derechas y pisar
      suavemente el pedal del acelerador.
    C: Girar el volante bruscamente de lado a lado mientras acelera fuertemente.
    D: Pisar los frenos bruscamente mientras cambia entre marcha adelante y marcha
      atrás.
  answer: B
  explanation: Para desatascarse del barro o la nieve, el manual aconseja 'Cambiar
    a una marcha baja y mantener las ruedas delanteras derechas', 'Pisar suavemente
    el pedal del acelerador' y 'Evitar hacer girar las ruedas'.
- id: 568
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo se atasca en barro profundo o nieve?
  choices:
    A: Cambiar a una marcha alta y hacer girar las ruedas lo más rápido posible.
    B: Cambiar a una marcha baja y mantener las ruedas delanteras derechas.
    C: Bombear el pedal del acelerador rápidamente para ganar tracción.
    D: Girar el volante bruscamente de lado a lado.
  answer: B
  explanation: Al intentar desatascar su vehículo, el manual aconseja cambiar a una
    marcha baja y mantener las ruedas delanteras derechas, mientras pisa suavemente
    el pedal del acelerador y evita hacer girar las ruedas.
- id: 569
  category: vehicle_information
  question: ¿Cuándo debe instalar cadenas para llantas en su vehículo?
  choices:
    A: Después de atascarse en la nieve.
    B: Mientras conduce en medio de la calzada.
    C: Antes de conducir en nieve o barro.
    D: Solo cuando conduzca sobre hielo sólido.
  answer: C
  explanation: El manual indica que debe conducir lo más a la derecha posible de la
    calzada antes de instalar las cadenas, y ponerlas en las llantas antes de conducir
    en nieve o barro.
- id: 570
  category: defensive_driving
  question: ¿Cuál de los siguientes se considera uno de los tres grandes errores que
    cometen la mayoría de los conductores en la nieve y el hielo?
  choices:
    A: Girar demasiado el volante y hacer patinar las ruedas.
    B: Usar las luces bajas.
    C: Conducir a una velocidad constante.
    D: Usar la calefacción-desempañador.
  answer: A
  explanation: 'Los tres grandes errores de la mayoría de los conductores en la nieve
    y el hielo son: acelerar demasiado y hacer girar las ruedas, frenar demasiado
    y hacer deslizar las ruedas, y girar demasiado el volante y hacer patinar las
    ruedas.'
- id: 571
  category: safe_driving_rules
  question: Antes de conducir en clima invernal, ¿de qué ventanas debe quitar la nieve,
    el hielo o la escarcha?
  choices:
    A: Solo del parabrisas.
    B: Del parabrisas y las ventanas laterales delanteras.
    C: Solo de la ventana trasera.
    D: De TODAS las ventanas.
  answer: D
  explanation: El manual indica explícitamente que se debe quitar la nieve, el hielo
    o la escarcha de TODAS las ventanas antes de conducir.
- id: 572
  category: safe_driving_rules
  question: 'Cuando viaja a 20 M.P.H., la baja tracción por el hielo y la nieve puede
    aumentar su distancia de frenado a:'
  choices:
    A: 50 pies o más.
    B: 100 pies o más.
    C: 150 pies o más.
    D: 200 pies o más.
  answer: D
  explanation: Cuando viaja a 20 M.P.H., la baja tracción puede aumentar la distancia
    de frenado a 200 pies o más.
- id: 573
  category: vehicle_information
  question: ¿Cómo debe aplicar los frenos en la nieve o el hielo para mantener el
    control direccional?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Aplicar presión fuerte y continua hasta que el vehículo se detenga.
    C: Aplicar presión constante hasta un punto justo antes de que se bloqueen.
    D: Pisar los frenos de golpe y mantenerlos presionados.
  answer: C
  explanation: El manual aconseja aplicar los frenos con firmeza, hasta un punto justo
    antes de que se bloqueen, y NO bombear el pedal del freno, simplemente aplicar
    una presión constante para obtener la mejor combinación de esfuerzo de frenado
    y control direccional.
- id: 574
  category: vehicle_information
  question: 'Para que los frenos antibloqueo (ABS) funcionen correctamente durante
    una parada de emergencia, usted debe:'
  choices:
    A: Bombear el pedal del freno.
    B: Aplicar presión constante y firme al pedal.
    C: Tocar los frenos ligeramente.
    D: Usar el freno de estacionamiento en su lugar.
  answer: B
  explanation: Para que los frenos antibloqueo funcionen correctamente, o funcionen
    en absoluto, debe aplicar una presión constante y firme al pedal. Durante una
    parada de emergencia, presione el pedal del freno hasta el fondo si es necesario.
- id: 575
  category: defensive_driving
  question: ¿Por qué debe tener especial precaución al conducir sobre puentes en clima
    helado?
  choices:
    A: Los puentes generalmente se construyen con pendientes más pronunciadas.
    B: El hielo se forma en los puentes antes que en las carreteras adyacentes.
    C: Los puentes tienen menos tráfico para compactar la nieve.
    D: Los puentes absorben más calor del sol.
  answer: B
  explanation: Por lo general, las señales indican que el hielo se forma en los puentes
    antes que en las carreteras adyacentes, haciéndolos inesperadamente resbaladizos.
- id: 576
  category: driver_testing
  question: Por ley, ¿qué porcentaje de las preguntas en el examen de conocimientos
    para conductores de Tennessee debe tratar sobre alcohol y drogas?
  choices:
    A: Al menos el 10 por ciento.
    B: Al menos el 15 por ciento.
    C: Al menos el 20 por ciento.
    D: Al menos el 25 por ciento.
  answer: D
  explanation: Por ley, al menos el 25 por ciento de las preguntas en el examen de
    conocimientos debe consistir en preguntas que traten el tema del alcohol, otras
    drogas y la conducción.
- id: 577
  category: alcohol_drugs_health
  question: Aproximadamente, ¿cuánto tiempo tarda el hígado en oxidar una bebida alcohólica?
  choices:
    A: 15 minutos.
    B: 30 minutos.
    C: Una hora.
    D: Dos horas.
  answer: C
  explanation: Al llegar al hígado, el alcohol comienza a oxidarse inmediatamente.
    Sin embargo, el hígado solo puede oxidar aproximadamente una bebida por hora.
- id: 578
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes es la única forma efectiva de recuperar la sobriedad
    después de beber alcohol?
  choices:
    A: Beber café negro.
    B: Tomar una ducha fría.
    C: Hacer ejercicio vigorosamente.
    D: Dejar pasar el tiempo.
  answer: D
  explanation: La tasa de oxidación no se puede aumentar bebiendo café, haciendo ejercicio,
    tomando una ducha fría ni con ninguna otra cosa. Solo el tiempo puede hacer que
    una persona que ha estado bebiendo recupere la sobriedad.
- id: 579
  category: alcohol_drugs_health
  question: En Tennessee, ¿qué nivel de Concentración de Alcohol en la Sangre (BAC)
    es siempre ilegal por intoxicación?
  choices:
    A: '.04'
    B: '.05'
    C: '.08'
    D: '.10'
  answer: C
  explanation: En la mayoría de los estados, incluido Tennessee, .08 es el nivel de
    intoxicación que siempre es ilegal.
- id: 580
  category: alcohol_drugs_health
  question: Si dos personas pesan lo mismo, ¿cómo afecta la grasa corporal a la intoxicación
    por alcohol?
  choices:
    A: La persona con más grasa corporal mostrará signos de intoxicación primero.
    B: La persona con menos grasa corporal mostrará signos de intoxicación primero.
    C: La grasa corporal no tiene efecto sobre la rapidez con la que una persona se
      intoxica.
    D: Ambas personas se intoxicarán exactamente al mismo ritmo.
  answer: A
  explanation: El alcohol puede absorberse en agua, no en grasa. Las personas con
    menos grasa corporal tienen más agua en la cual diluir el alcohol. Por lo tanto,
    bebida por bebida, si las personas pesan lo mismo, la que tiene más grasa corporal
    mostrará signos de intoxicación primero.
- id: 581
  category: alcohol_drugs_health
  question: Con una concentración de alcohol en la sangre (BAC) del 0.10 por ciento,
    ¿cuántas veces más probabilidades tiene de causar un accidente en comparación
    con si estuviera sobrio?
  choices:
    A: Dos veces más probabilidades.
    B: Siete veces más probabilidades.
    C: Veinticinco veces más probabilidades.
    D: Cincuenta veces más probabilidades.
  answer: B
  explanation: Con un BAC del 0.10 por ciento, usted tiene siete veces más probabilidades
    de causar un accidente que si estuviera sobrio.
- id: 582
  category: alcohol_drugs_health
  question: ¿Cuáles son las dos habilidades más importantes para la tarea de conducir
    que se ven afectadas por pequeñas cantidades de alcohol?
  choices:
    A: La audición y el tiempo de reacción
    B: El juicio y la visión
    C: La dirección y el frenado
    D: El estado de alerta y la concentración
  answer: B
  explanation: 'El manual indica: ''Las dos habilidades más importantes para la tarea
    de conducir son el juicio y la visión, y ambas se ven afectadas por pequeñas cantidades
    de alcohol''.'
- id: 583
  category: alcohol_drugs_health
  question: ¿Cómo afecta el alcohol la visión de un conductor por la noche?
  choices:
    A: Mejora el tiempo de recuperación al deslumbramiento.
    B: Reduce la capacidad de ver claramente por la noche en más de la mitad.
    C: Aumenta la visión lateral en un 30 por ciento.
    D: Tensa los músculos oculares para enfocar mejor.
  answer: B
  explanation: El alcohol disminuye la claridad de la visión. El manual establece
    explícitamente que reduce la capacidad de ver claramente por la noche en más de
    la mitad.
- id: 584
  category: alcohol_drugs_health
  question: ¿Con qué concentración de alcohol en la sangre (BAC) considera la ley
    que un conductor está legalmente intoxicado?
  choices:
    A: 0.04 por ciento
    B: 0.05 por ciento
    C: 0.08 por ciento
    D: 0.10 por ciento
  answer: C
  explanation: El manual indica que un BAC de 0.08 por ciento o más se considera 'INTOXICACIÓN
    LEGAL' y es ilegal conducir mientras la concentración de alcohol sea de 0.08 por
    ciento o mayor.
- id: 585
  category: alcohol_drugs_health
  question: ¿Qué sucede cuando se mezcla alcohol con otro depresor, como tranquilizantes
    o sedantes?
  choices:
    A: Los efectos se anulan entre sí.
    B: Los efectos simplemente se suman.
    C: Los efectos se multiplican.
    D: El alcohol actúa como un estimulante para contrarrestar el depresor.
  answer: C
  explanation: Cuando el alcohol se combina con otro depresor, como tranquilizantes
    o sedantes, los resultados no solo se suman; se multiplican, haciendo que los
    efectos sean mucho más fuertes y peligrosos.
- id: 586
  category: penalties_and_points
  question: Según la Ley de consentimiento implícito de Tennessee, ¿cuál es la sanción
    probable si se niega a someterse a una prueba química de alcohol o drogas cuando
    se lo solicita un oficial de la ley?
  choices:
    A: Una multa de $500
    B: Suspensión de los privilegios de conducir por 12 meses
    C: Sentencia inmediata de 30 días de cárcel
    D: Instalación obligatoria de un dispositivo de bloqueo de encendido
  answer: B
  explanation: Si es arrestado y se niega a la solicitud de un oficial de la ley de
    someterse a la prueba, es probable que resulte en la suspensión de sus privilegios
    de conducir por parte del tribunal durante doce (12) meses.
- id: 587
  category: alcohol_drugs_health
  question: ¿Es una defensa válida para un cargo de DUI si el medicamento que estaba
    tomando fue recetado por un médico?
  choices:
    A: Sí, siempre y cuando tenga el frasco de la receta en el automóvil.
    B: Sí, los medicamentos recetados no afectan la capacidad de conducir.
    C: No, el simple hecho de que un medicamento sea recetado por ley no es defensa
      para conducir bajo su influencia.
    D: No, a menos que el médico le haya dado permiso por escrito específicamente
      para conducir.
  answer: C
  explanation: 'El manual establece claramente: ''El simple hecho de que un medicamento
    sea recetado, por ley, NO es defensa para conducir bajo su influencia''.'
- id: 588
  category: penalties_and_points
  question: ¿Qué permite hacer a los oficiales de la ley la ley de 'No rechazo' (No
    Refusal), aprobada en 2012?
  choices:
    A: Suspender permanentemente la licencia de un conductor en la primera infracción.
    B: Solicitar órdenes de registro para muestras de sangre en casos que involucren
      a conductores sospechosos de estar bajo los efectos del alcohol o drogas.
    C: Arrestar a los pasajeros en un vehículo conducido por un conductor bajo los
      efectos del alcohol o drogas.
    D: Confiscar el vehículo de cualquier persona que se niegue a una prueba de alcoholemia.
  answer: B
  explanation: La ley de 'No rechazo' permite a los oficiales de la ley solicitar
    órdenes de registro para obtener muestras de sangre en casos que involucren a
    conductores sospechosos de estar bajo los efectos del alcohol o drogas.
- id: 589
  category: alcohol_drugs_health
  question: ¿Cómo afecta el consumo de alcohol el estado de alerta y la concentración
    de un conductor?
  choices:
    A: Actúa como un estimulante para aumentar el estado de alerta.
    B: Acelera los impulsos nerviosos y las funciones corporales.
    C: Actúa como un depresor y limita la capacidad del conductor para estar alerta
      y concentrarse.
    D: No tiene efecto sobre la concentración hasta que el BAC alcanza el 0.10 por
      ciento.
  answer: C
  explanation: El alcohol, en cualquier concentración, es un depresor, no un estimulante.
    Ralentiza todos los impulsos nerviosos y las funciones corporales, limitando la
    capacidad del conductor para estar alerta y concentrarse.
- id: 590
  category: alcohol_drugs_health
  question: ¿A qué nivel de BAC se ven afectados la reacción y la coordinación?
  choices:
    A: Desde tan solo un 0.02 por ciento
    B: Solo por encima del 0.05 por ciento
    C: Exactamente al 0.08 por ciento
    D: Al 0.10 por ciento y superior
  answer: A
  explanation: El manual señala que la reacción y la coordinación se ven afectadas
    por el consumo de alcohol desde un nivel de BAC tan bajo como el 0.02 por ciento.
- id: 591
  category: alcohol_drugs_health
  question: ¿Puede un conductor ser condenado por conducir bajo los efectos del alcohol
    o drogas (DUI) con una Concentración de Alcohol en la Sangre (BAC) del .00 por
    ciento?
  choices:
    A: No, un BAC del .00 por ciento exonera al conductor de cualquier cargo de DUI.
    B: Sí, si su capacidad para conducir está suficientemente afectada por las drogas.
    C: Sí, pero solo si son menores de 21 años.
    D: No, se requiere un BAC de al menos .02 por ciento para una condena.
  answer: B
  explanation: Un conductor puede registrar un BAC del .00 por ciento y aun así ser
    condenado por un DUI si su capacidad para conducir está suficientemente afectada
    por las drogas. El nivel de BAC no exonera a un conductor cuando es inferior al
    .08 por ciento.
- id: 592
  category: alcohol_drugs_health
  question: ¿Cuál es la relación entre el alcohol y los músculos oculares?
  choices:
    A: El alcohol hace que los músculos oculares se tensen, mejorando el enfoque.
    B: El alcohol relaja los músculos oculares, causando una mala visión ante el resplandor
      y la incapacidad de enfocar correctamente.
    C: El alcohol estimula los músculos oculares, aumentando la velocidad de recuperación
      ante el resplandor.
    D: El alcohol no tiene efecto sobre los músculos oculares, solo sobre el cerebro.
  answer: B
  explanation: La visión ante el resplandor es deficiente debido a la relajación de
    los músculos oculares. Los músculos oculares se relajan por el alcohol y no pueden
    enfocar correctamente.
- id: 593
  category: alcohol_drugs_health
  question: Según el manual, ¿qué porcentaje de la información utilizada al conducir
    es proporcionada por los ojos?
  choices:
    A: Alrededor del 50 por ciento
    B: Alrededor del 70 por ciento
    C: Casi el 90 por ciento
    D: El 100 por ciento
  answer: C
  explanation: Debido a que los ojos proporcionan casi el 90 por ciento de la información
    utilizada al conducir, cualquier restricción en la visión puede causar resultados
    desastrosos.
- id: 594
  category: penalties_and_points
  question: ¿Son diferentes las sanciones por un arresto por DUI si el conductor estaba
    afectado por medicamentos recetados en lugar de alcohol?
  choices:
    A: Sí, los DUI por medicamentos recetados conllevan sanciones más leves.
    B: Sí, los DUI por medicamentos recetados solo resultan en una advertencia para
      la primera infracción.
    C: No, las sanciones son las mismas ya sea que el conductor haya estado bebiendo
      alcohol o tomando drogas.
    D: No, pero los DUI por medicamentos recetados no aparecen en su historial de
      manejo.
  answer: C
  explanation: Las sanciones por un arresto por DUI son las mismas ya sea que el conductor
    haya estado bebiendo alcohol o tomando drogas (incluso medicamentos recetados
    o de venta libre).
- id: 595
  category: alcohol_drugs_health
  question: ¿Qué es lo primero que se ve afectado después de que una persona consume
    alcohol?
  choices:
    A: La coordinación
    B: La visión
    C: El juicio
    D: Las emociones
  answer: C
  explanation: Según el manual, lo primero que se ve afectado después de beber alcohol
    es el juicio de una persona.
- id: 596
  category: penalties_and_points
  question: Bajo la Ley de Protección Infantil contra la Conducción en Estado de Ebriedad
    (Drunk Driving Child Protection Act), ¿cuál es la pena mínima obligatoria de cárcel
    por violar las leyes de DUI mientras se está acompañado por un niño menor de 18
    años?
  choices:
    A: 48 horas
    B: 7 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La Ley de Protección Infantil contra la Conducción en Estado de Ebriedad
    impone una pena mínima obligatoria de cárcel de 30 días y una multa mínima de
    $1,000 por violar las leyes de DUI cuando se está acompañado por un niño menor
    de 18 años.
- id: 597
  category: penalties_and_points
  question: Si tiene 18, 19 o 20 años y es condenado por comprar o poseer una bebida
    alcohólica por primera vez, ¿por cuánto tiempo perderá su privilegio de conducir?
  choices:
    A: 6 meses
    B: 1 año
    C: 2 años
    D: Hasta que cumpla 21 años
  answer: B
  explanation: Si tiene 18, 19 o 20 años y es condenado por comprar, intentar comprar
    o poseer cualquier bebida alcohólica, perderá su privilegio de conducir por un
    año por una primera infracción.
- id: 598
  category: alcohol_drugs_health
  question: ¿Aproximadamente cuánto tiempo se tarda en cancelar los efectos embriagadores
    de tres bebidas alcohólicas?
  choices:
    A: Una hora
    B: Dos horas
    C: Tres horas
    D: Cuatro horas
  answer: C
  explanation: Se tarda aproximadamente una hora en cancelar los efectos de una bebida,
    por lo que se tardan unas tres horas en cancelar los efectos embriagadores de
    tres bebidas.
- id: 599
  category: penalties_and_points
  question: ¿Cuál es el tiempo mínimo de cárcel por una primera condena por DUI si
    la Concentración de Alcohol en la Sangre (BAC) del conductor es de 0.20% o más?
  choices:
    A: 48 horas
    B: 7 días
    C: 30 días
    D: 45 días
  answer: B
  explanation: Para una primera condena, el tiempo de cárcel es de 48 horas, pero
    aumenta a 7 días si el BAC es de 0.20% o más.
- id: 600
  category: penalties_and_points
  question: 'Si está operando un vehículo motorizado bajo la influencia y se ve involucrado
    en un choque que resulta en la muerte de otra persona, puede ser acusado de:'
  choices:
    A: Asalto agravado
    B: Homicidio vehicular
    C: Puesta en peligro de un menor especialmente agravada
    D: Puesta en peligro imprudente
  answer: B
  explanation: Si está operando un vehículo motorizado bajo la influencia de drogas
    o alcohol, y se ve involucrado en un choque que resulta en la muerte de otra(s)
    persona(s), puede ser acusado de homicidio vehicular.
- id: 601
  category: penalties_and_points
  question: 'Para un infractor juvenil de entre 13 y 17 años de edad, una primera
    condena por posesión de alcohol o drogas resulta en la suspensión del privilegio
    de conducir por:'
  choices:
    A: 6 meses o hasta los 16 años, lo que sea mayor
    B: 1 año o hasta los 17 años, lo que sea mayor
    C: 2 años o hasta los 18 años, lo que sea mayor
    D: Hasta los 21 años
  answer: B
  explanation: Si usted tiene entre 13 y 17 años de edad y se descubre que ha poseído,
    consumido o vendido alcohol o drogas, su privilegio de conducir será suspendido
    por un año o hasta los 17 años, lo que sea mayor.
- id: 602
  category: alcohol_drugs_health
  question: 'La cantidad de alcohol en una botella de cerveza de 12 onzas es aproximadamente
    igual a:'
  choices:
    A: Un trago (shot) de 1 onza de whisky
    B: Dos tragos (shots) de 1 onza de whisky
    C: Una copa de vino de 6 onzas
    D: Media onza de alcohol puro
  answer: A
  explanation: El manual indica que la cantidad de alcohol en una botella de cerveza
    (de 12 onzas) es aproximadamente igual a la de un trago (shot) de whisky (de 1
    onza).
- id: 603
  category: penalties_and_points
  question: ¿Cuál es el rango de la multa por una segunda condena por conducir bajo
    los efectos del alcohol o drogas (DUI)?
  choices:
    A: $350 - $1,500
    B: $600 - $3,500
    C: $1,100 - $10,000
    D: $3,000 - $15,000
  answer: B
  explanation: Según la tabla de Sanciones por DUI, las multas por una segunda condena
    oscilan entre $600 y $3,500.
- id: 604
  category: penalties_and_points
  question: 'Bajo la ley de concentración de alcohol en la sangre (BAC) para menores
    de 21 años, una persona que tenga al menos 16 años pero aún no 21 será condenada
    por conducir bajo los efectos del alcohol siendo menor de edad si se le sorprende
    conduciendo con un BAC de al menos:'
  choices:
    A: 0.01 por ciento
    B: 0.02 por ciento
    C: 0.04 por ciento
    D: 0.08 por ciento
  answer: B
  explanation: Una persona que tenga al menos 16 años, pero que aún no tenga 21 años,
    y que sea sorprendida conduciendo con un BAC de 0.02 por ciento será condenada
    por conducir bajo los efectos del alcohol siendo menor de edad.
- id: 605
  category: penalties_and_points
  question: 'Como condición de libertad condicional por una condena de DUI, un infractor
    debe completar la recolección de basura durante tres turnos de ocho horas mientras
    usa ropa que muestre el mensaje:'
  choices:
    A: '"INFRACTOR DE DUI" (DUI OFFENDER)'
    B: '"SOY UN CONDUCTOR EBRIO" (I AM A DRUNK DRIVER)'
    C: '"TRABAJADOR DE SERVICIO COMUNITARIO" (COMMUNITY SERVICE WORKER)'
    D: '"NO BEBA Y CONDUZCA" (DON''T DRINK AND DRIVE)'
  answer: B
  explanation: 'Mientras recoge la basura, el infractor debe usar un chaleco u otra
    prenda que muestre el mensaje: "SOY UN CONDUCTOR EBRIO" (I am a DRUNK DRIVER).'
- id: 606
  category: alcohol_drugs_health
  question: ¿Cómo se comparan las sanciones por un arresto por DUI que involucra medicamentos
    recetados con las que involucran alcohol?
  choices:
    A: Las sanciones por medicamentos recetados son menos severas.
    B: Las sanciones por medicamentos recetados son más severas.
    C: Las sanciones son las mismas para ambos.
    D: Los medicamentos recetados no resultan en un arresto por DUI.
  answer: C
  explanation: Las sanciones por un arresto por DUI son las mismas ya sea que el conductor
    haya estado bebiendo alcohol o tomando drogas (incluso medicamentos recetados
    o de venta libre).
- id: 607
  category: penalties_and_points
  question: 'Una cuarta condena o posterior por DUI se clasifica como:'
  choices:
    A: Delito menor de Clase A
    B: Delito grave de Clase C
    C: Delito grave de Clase D
    D: Delito grave de Clase E
  answer: D
  explanation: La tabla de Sanciones por DUI indica que una cuarta condena o posterior
    es un delito grave de Clase E.
- id: 608
  category: penalties_and_points
  question: Si una persona tiene dos condenas por DUI en un período de cinco años,
    DEBE operar un vehículo motorizado con un dispositivo de bloqueo de encendido
    (ignition interlock device) durante ¿cuánto tiempo después de la restitución de
    sus privilegios de conducir?
  choices:
    A: 6 meses
    B: 1 año
    C: 3 años
    D: 5 años
  answer: A
  explanation: Una persona con 2 DUI en un período de cinco años DEBE operar un vehículo
    motorizado con el dispositivo de bloqueo de encendido durante seis meses después
    de la restitución de sus privilegios de conducir.
- id: 609
  category: alcohol_drugs_health
  question: ¿Por qué la probabilidad de un choque para un conductor joven es mucho
    mayor con un BAC entre 0.01 y 0.08 por ciento en comparación con los conductores
    mayores?
  choices:
    A: Porque los conductores jóvenes tienden a conducir más rápido.
    B: Debido a la baja tolerancia al alcohol y la limitada experiencia de conducción.
    C: Porque los conductores jóvenes tienen más probabilidades de conducir de noche.
    D: Debido a una mayor probabilidad de usar medicamentos recetados.
  answer: B
  explanation: La probabilidad de un choque para un conductor joven es mucho mayor
    con un BAC entre 0.01 y 0.08 por ciento que para los conductores mayores. Esto
    se debe a la baja tolerancia al alcohol y a la limitada experiencia de conducción.
- id: 610
  category: alcohol_drugs_health
  question: Según el manual, ¿a qué número gratuito puede llamar para obtener referencias
    de ayuda con el uso y abuso de drogas y alcohol?
  choices:
    A: 1-800-555-DRUG
    B: 1-800-889-9789
    C: 1-800-822-4357
    D: 1-800-DRIVING
  answer: B
  explanation: El manual indica que debe llamar a la línea gratuita 'Redline' al 1-800-889-9789
    para obtener más información sobre el uso de drogas y alcohol o para obtener referencias
    de ayuda.
- id: 611
  category: alcohol_drugs_health
  question: ¿Qué significa la Ley de Consentimiento Implícito (Implied Consent Law)
    en Tennessee?
  choices:
    A: Usted da su consentimiento para que registren su vehículo en cualquier momento.
    B: Usted acepta llevar el seguro de vehículo adecuado.
    C: Si se le solicita, se someterá a una prueba para determinar el contenido de
      alcohol o drogas en la sangre.
    D: Usted acepta pagar todas las multas de tránsito dentro de 30 días.
  answer: C
  explanation: La Ley de Consentimiento Implícito significa que, si se le solicita,
    se someterá a una prueba para determinar el contenido de alcohol o drogas en la
    sangre.
- id: 612
  category: license_system
  question: ¿Cuál es el propósito del Sistema de Puntero de Conductores Problemáticos
    (PDPS, por sus siglas en inglés)?
  choices:
    A: Rastrear las multas de estacionamiento no pagadas en Tennessee.
    B: Buscar en el Registro Nacional de Conductores antes de emitir una licencia
      de conducir.
    C: Asignar puntos a los conductores por infracciones de tránsito.
    D: Monitorear la asistencia escolar de los conductores adolescentes.
  answer: B
  explanation: El Sistema de Puntero de Conductores Problemáticos (PDPS) es utilizado
    por el Departamento de Seguridad y Seguridad Nacional de Tennessee para buscar
    en el Registro Nacional de Conductores antes de emitir una licencia de conducir.
- id: 613
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón por la que su licencia de conducir
    de Tennessee puede ser revocada o suspendida?
  choices:
    A: Recibir una multa por exceso de velocidad en un período de tres años.
    B: Alejarse de una gasolinera conduciendo un vehículo motorizado sin pagar por
      el combustible.
    C: No lavar su vehículo con regularidad.
    D: Estacionarse en una zona de carga durante cinco minutos.
  answer: B
  explanation: Alejarse de una gasolinera conduciendo un vehículo motorizado sin pagar
    por la gasolina o el combustible diésel dispensado figura como una situación en
    la que una licencia de conducir puede ser revocada o suspendida.
- id: 614
  category: penalties_and_points
  question: Las personas menores de 18 años pueden perder sus privilegios de conducir
    por abandonar la escuela. ¿Cómo se define 'abandonar la escuela' en este contexto?
  choices:
    A: Tener 5 ausencias injustificadas consecutivas en un semestre.
    B: Tener 10 días consecutivos o 15 días en total de ausencias injustificadas en
      un semestre.
    C: Reprobar una materia durante un período de calificaciones.
    D: Faltar 20 días a la escuela por cualquier motivo en un año.
  answer: B
  explanation: Abandonar la escuela se define como tener 10 días consecutivos o 15
    días en total de ausencias injustificadas en un semestre.
- id: 615
  category: penalties_and_points
  question: Para mantener los privilegios de conducir, una persona menor de 18 años
    debe tener un progreso satisfactorio en la escuela. ¿Qué significa esto generalmente?
  choices:
    A: Mantener un promedio de calificaciones (GPA) de 3.0.
    B: Aprobar todas las materias por período de calificaciones.
    C: Aprobar tres materias por período de calificaciones.
    D: Tener asistencia perfecta.
  answer: C
  explanation: El progreso satisfactorio en la escuela generalmente significa aprobar
    tres materias por período de calificaciones; no hacerlo puede resultar en la pérdida
    de los privilegios de conducir.
- id: 616
  category: penalties_and_points
  question: Si su licencia de conducir es suspendida o revocada, ¿dentro de cuántos
    días debe entregarla al Departamento de Seguridad?
  choices:
    A: 10 días
    B: 15 días
    C: 20 días
    D: 30 días
  answer: C
  explanation: Siempre que una licencia de conducir sea suspendida o revocada, debe
    entregarse al Departamento de Seguridad dentro de los 20 días posteriores a la
    suspensión o revocación.
- id: 617
  category: penalties_and_points
  question: ¿Cuál es la sanción por no entregar su licencia de conducir suspendida
    o revocada dentro del plazo requerido?
  choices:
    A: Una multa de $50
    B: Una multa de $75 además de cualquier otra multa y costo
    C: 6 meses adicionales de suspensión
    D: Una comparecencia obligatoria ante el tribunal
  answer: B
  explanation: No entregar su licencia significa que será multado con $75 además de
    cualquier otra multa y costo que pueda deber.
- id: 618
  category: driver_responsibility
  question: Si tiene una nueva dirección, ¿dentro de cuántos días debe reportarla
    al Departamento de Seguridad?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Si tiene una nueva dirección, debe reportarla al Departamento de Seguridad
    dentro de los diez (10) días posteriores al cambio.
- id: 619
  category: penalties_and_points
  question: Según el Pacto de Infractores No Residentes (Non-Resident Violator Compact),
    ¿qué sucede si ignora una citación de tránsito emitida en otro estado miembro?
  choices:
    A: Sus privilegios de conducir de Tennessee serán suspendidos, revocados o cancelados.
    B: Será arrestado la próxima vez que conduzca en Tennessee.
    C: La citación se desestima automáticamente después de un año.
    D: Solo será multado por el estado de Tennessee.
  answer: A
  explanation: Si ignora la citación de otro estado miembro, sus privilegios de conducir
    serán suspendidos, revocados o cancelados hasta que el tribunal notifique al Departamento
    de Seguridad que la citación ha sido resuelta adecuadamente.
- id: 620
  category: penalties_and_points
  question: Los conductores adultos (de 18 años de edad o mayores) recibirán un aviso
    de suspensión propuesta si acumulan ¿cuántos puntos en un período de 12 meses?
  choices:
    A: 6 o más puntos
    B: 8 o más puntos
    C: 10 o más puntos
    D: 12 o más puntos
  answer: D
  explanation: Los conductores adultos (de 18 años de edad o mayores) que acumulan
    12 o más puntos en un período de 12 meses reciben un aviso de suspensión propuesta.
- id: 621
  category: penalties_and_points
  question: ¿Un conductor adulto recibirá una carta de advertencia para mantenerlo
    al tanto de la posibilidad de perder sus privilegios de conducir si acumula cuántos
    puntos dentro de cualquier período de 12 meses?
  choices:
    A: De 2 a 4 puntos
    B: De 4 a 6 puntos
    C: De 6 a 11 puntos
    D: De 10 a 15 puntos
  answer: C
  explanation: Se envía por correo una carta de advertencia a cualquier titular de
    licencia que tenga de 6 a 11 puntos en su historial de manejo dentro de cualquier
    período de 12 meses.
- id: 622
  category: penalties_and_points
  question: ¿Cuántas infracciones por manejo imprudente dentro de un período de 12
    meses resultarán en la revocación o suspensión de una licencia de conducir de
    Tennessee?
  choices:
    A: Una
    B: Dos
    C: Tres
    D: Cuatro
  answer: B
  explanation: En Tennessee, una licencia de conducir puede ser revocada o suspendida
    por dos infracciones de manejo imprudente dentro de un período de 12 meses.
- id: 623
  category: penalties_and_points
  question: ¿La posesión de qué cantidad de metanfetamina en un vehículo por parte
    de un conductor puede llevar a la revocación o suspensión de la licencia?
  choices:
    A: Un gramo o más
    B: Tres gramos o más
    C: Cinco gramos o más
    D: Diez gramos o más
  answer: C
  explanation: Una licencia de conducir puede ser revocada o suspendida por la posesión
    por parte de un conductor de cinco gramos o más de metanfetamina en un vehículo.
- id: 624
  category: penalties_and_points
  question: 'Antes de que una licencia sea suspendida, revocada o cancelada, el departamento
    le dará la oportunidad de una audiencia previa a la acción, EXCEPTO en casos de:'
  choices:
    A: Acumular 12 puntos en un período de 12 meses.
    B: Sentencias definitivas y condenas.
    C: Falta de pago de la manutención infantil.
    D: Abandonar la escuela secundaria.
  answer: B
  explanation: Si su licencia está a punto de ser suspendida, revocada o cancelada,
    el departamento le dará la oportunidad de una audiencia previa a la acción, excepto
    en casos de sentencias definitivas y condenas.
- id: 625
  category: penalties_and_points
  question: ¿Cuántos puntos debe acumular un conductor adulto dentro de un período
    de 12 meses para recibir un aviso de suspensión propuesta?
  choices:
    A: 6 o más
    B: 8 o más
    C: 10 o más
    D: 12 o más
  answer: D
  explanation: Los conductores adultos (de 18 años de edad o mayores) que acumulan
    12 puntos o más dentro de un período de 12 meses reciben un aviso de suspensión
    propuesta.
- id: 626
  category: driver_responsibility
  question: ¿Con qué frecuencia está disponible la opción del Curso de Manejo Defensivo
    para que un conductor evite o reduzca la suspensión de su licencia?
  choices:
    A: Una vez al año
    B: Una vez cada tres años
    C: Una vez en cualquier período de cinco años
    D: Una vez en la vida
  answer: C
  explanation: La opción del Curso de Manejo Defensivo solo está disponible una vez
    en cualquier período de cinco años para evitar la suspensión de la licencia o
    para reducir el período de suspensión.
- id: 627
  category: penalties_and_points
  question: ¿Cuál es una consecuencia de conducir mientras su licencia está suspendida?
  choices:
    A: Se envía una carta de advertencia por correo
    B: El período de suspensión se extiende y podría resultar en un proceso penal
    C: Debe volver a tomar el examen de conocimientos escrito
    D: Su vehículo será confiscado permanentemente
  answer: B
  explanation: Conducir mientras su licencia está suspendida resultará en la extensión
    del período de suspensión y también podría resultar en un proceso penal.
- id: 628
  category: penalties_and_points
  question: ¿Cuántos puntos se agregan a su historial de manejo por rebasar a un autobús
    escolar, de iglesia o de jóvenes detenido que está subiendo o bajando pasajeros?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: Según la tabla de puntos, rebasar a un autobús escolar, de iglesia
    o de jóvenes detenido que está subiendo o bajando pasajeros resulta en 8 puntos.
- id: 629
  category: alcohol_drugs_health
  question: Los conductores que pierden el conocimiento o el control debido a condiciones
    como epilepsia o diabetes deben permanecer libres de episodios durante ¿qué período
    mínimo antes de ser elegibles para el restablecimiento de la licencia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Los conductores que pierden el conocimiento o el control debido a epilepsia,
    síncope cardíaco, diabetes u otras condiciones deben ser suspendidos y permanecer
    libres de episodios durante un mínimo de seis (6) meses antes de ser elegibles
    para el restablecimiento de la licencia.
- id: 630
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por no ceder el derecho de paso a los vehículos
    de emergencia?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La tabla de puntos asigna 6 puntos por "No ceder el derecho de paso
    a vehículos de emergencia".
- id: 631
  category: license_system
  question: Si una persona obtiene una licencia restringida después de no cumplir
    con una citación, ¿a dónde se le permite conducir?
  choices:
    A: Solo de ida y vuelta al trabajo
    B: Al trabajo y a la universidad a tiempo completo
    C: A cualquier lugar entre las 6 AM y las 6 PM
    D: Al trabajo y a servicios religiosos
  answer: A
  explanation: Para una licencia restringida debido a la Falta de Cumplimiento de
    una Citación, la orden certificada permite a la persona conducir solo de ida y
    vuelta al trabajo.
- id: 632
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceso de velocidad de 16 a 25 m.p.h. por
    encima del límite en una zona de construcción?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: B
  explanation: El exceso de velocidad de 16 a 25 m.p.h. por encima del límite normalmente
    conlleva 4 puntos, pero en una Zona de Construcción conlleva 5 puntos.
- id: 633
  category: license_system
  question: Una licencia de conducir restringida después de una condena por DUI NO
    es una opción para los conductores que tienen una condena previa por ¿cuál de
    las siguientes infracciones en los últimos 10 años?
  choices:
    A: Conducción temeraria
    B: Exceso de velocidad de más de 25 mph
    C: Conducir con capacidades disminuidas siendo adulto
    D: Carreras clandestinas
  answer: C
  explanation: Una licencia restringida no es una opción para los conductores que
    tienen una condena previa por DUI o por conducir con capacidades disminuidas siendo
    adulto en los últimos 10 años.
- id: 634
  category: alcohol_drugs_health
  question: Si el Departamento recibe información de que su capacidad para conducir
    se ve afectada por un trastorno físico o mental, ¿dentro de cuántos días debe
    presentar un informe médico?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: Se le requerirá al conductor que presente (dentro de los treinta (30)
    días posteriores a la notificación) un informe médico de un doctor en medicina.
- id: 635
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a un conductor menor de 18 años por operar
    un vehículo mientras usa un teléfono celular?
  choices:
    A: 3 puntos
    B: 4 puntos
    C: 6 puntos
    D: 8 puntos
  answer: C
  explanation: La tabla de puntos especifica 6 puntos por "Operar un vehículo mientras
    usa un teléfono celular (menor de 18 años)".
- id: 636
  category: license_system
  question: 'Un menor que pierde su licencia debido a cargos relacionados con drogas
    o alcohol puede solicitar una licencia restringida para conducir de ida y vuelta
    a:'
  choices:
    A: Servicios religiosos y el trabajo
    B: La institución educativa o el trabajo
    C: Programas de tratamiento ambulatorio solamente
    D: Cualquier lugar durante las horas de luz del día
  answer: B
  explanation: Un menor que pierde su licencia debido a cargos relacionados con drogas
    o alcohol puede solicitar al juez de primera instancia una licencia restringida
    para operar un vehículo motorizado de ida y vuelta a la institución educativa
    o de ida y vuelta al trabajo.
- id: 637
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a un conductor por contribuir a la ocurrencia
    de un choque que resulta en la muerte de otra persona?
  choices:
    A: 4 puntos
    B: 5 puntos
    C: 6 puntos
    D: 8 puntos
  answer: D
  explanation: La tabla de puntos asigna 8 puntos por "Contribuir a la ocurrencia
    de un choque que resulta en la muerte de otra persona".
- id: 638
  category: driver_responsibility
  question: Al finalizar el tiempo de suspensión, ¿qué tipo de comprobante de seguro
    se requiere específicamente para los conductores adultos antes de obtener su licencia
    regular?
  choices:
    A: Seguro de cobertura amplia
    B: Seguro SR-22
    C: Seguro de colisión
    D: Cobertura contra conductores sin seguro
  answer: B
  explanation: Al finalizar el tiempo de suspensión, debe pagar las tarifas de restablecimiento
    correspondientes y presentar un comprobante de seguro de responsabilidad civil/responsabilidad
    financiera (se requiere el seguro SR-22 para conductores adultos).
- id: 639
  category: license_system
  question: ¿Qué sucederá si un conductor no responde a una solicitud del departamento
    para un informe médico dentro del tiempo prescrito?
  choices:
    A: Será multado con $50.
    B: Su privilegio de conducir será suspendido.
    C: El registro de su vehículo será revocado.
    D: Se le requerirá volver a tomar solo el examen escrito.
  answer: B
  explanation: Según el manual, no responder a las solicitudes del departamento para
    un informe médico o no someterse a un examen de licencia de conducir dentro del
    tiempo prescrito resultará en la suspensión del privilegio de conducir.
- id: 640
  category: driver_responsibility
  question: ¿Qué tipo de seguro proporciona cobertura por los daños que usted cause
    a otras personas?
  choices:
    A: Seguro de colisión
    B: Seguro contra conductores sin seguro
    C: Seguro de responsabilidad civil
    D: Seguro de cobertura amplia
  answer: C
  explanation: El manual define el seguro de responsabilidad civil como aquel que
    proporciona cobertura por los daños que usted cause a otras personas.
- id: 641
  category: driver_responsibility
  question: ¿La ley de Tennessee exige tener seguro de colisión?
  choices:
    A: Sí, para todos los conductores.
    B: Sí, pero solo para vehículos comerciales.
    C: No, no es obligatorio.
    D: No, a menos que tenga un choque previo en su historial.
  answer: C
  explanation: 'El manual establece explícitamente: "Aunque la ley de Tennessee no
    exige el seguro de colisión, la Ley de Responsabilidad Financiera exige que los
    conductores presenten pruebas de responsabilidad financiera".'
- id: 642
  category: driver_responsibility
  question: ¿Cuál de las siguientes opciones NO figura como una forma aceptable de
    prueba de responsabilidad financiera?
  choices:
    A: Una nota de cobertura provisional de seguro (insurance binder)
    B: Una página de declaración de su póliza de seguro
    C: Una promesa verbal de su agente de seguros
    D: Una tarjeta de seguro de una compañía autorizada
  answer: C
  explanation: Las formas aceptables de prueba incluyen una página de declaración,
    una nota de cobertura provisional (insurance binder), una tarjeta de seguro, un
    certificado de depósito en efectivo/fianza o prueba de calificación como autoasegurador.
    Una promesa verbal no está en la lista.
- id: 643
  category: safe_driving_rules
  question: ¿Debe notificar inmediatamente a la policía sobre cualquier choque que
    involucre muerte, lesiones o daños a la propiedad por encima de qué cantidad?
  choices:
    A: $50
    B: $100
    C: $400
    D: $500
  answer: A
  explanation: Los conductores deben notificar inmediatamente a la policía local,
    a la oficina del Sheriff del condado o a la Patrulla de Caminos sobre cualquier
    choque que involucre muerte, lesiones o daños a la propiedad superiores a cincuenta
    dólares ($50).
- id: 644
  category: driver_responsibility
  question: Si un conductor está físicamente incapacitado para dar aviso inmediato
    de un choque a la policía, ¿quién está obligado a hacerlo?
  choices:
    A: El otro conductor involucrado
    B: Un pasajero que sea capaz de hacerlo
    C: El primer testigo en la escena
    D: La compañía de seguros del conductor
  answer: B
  explanation: El manual establece que si el conductor está físicamente incapacitado
    para dar aviso inmediato y hay un pasajero capaz de hacerlo, el pasajero deberá
    dar el aviso o hacer que se dé.
- id: 645
  category: driver_responsibility
  question: 'Un choque debe ser reportado al Departamento de Seguridad y Seguridad
    Nacional de Tennessee como un "choque reportable" si los daños a la propiedad
    de cualquier persona superan los:'
  choices:
    A: $50
    B: $200
    C: $400
    D: $1,000
  answer: C
  explanation: Los choques reportables incluyen cualquier choque en el que una persona
    muera o resulte herida, o en el que los daños a la propiedad de cualquier persona
    superen los cuatrocientos dólares ($400).
- id: 646
  category: driver_responsibility
  question: ¿Cuántos días tiene para presentar un Reporte del Propietario/Conductor
    de un choque reportable al Departamento de Seguridad y Seguridad Nacional de Tennessee?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 20 días
  answer: D
  explanation: El operador y/o propietario de un vehículo involucrado en un choque
    reportable debe presentar un Reporte del Propietario/Conductor del choque dentro
    de 20 días.
- id: 647
  category: safe_driving_rules
  question: ¿Qué debe hacer si está involucrado en un choque con un vehículo desatendido
    y no puede localizar al propietario?
  choices:
    A: Dejar una nota en el parabrisas y alejarse conduciendo.
    B: Reportar el choque a la policía.
    C: Esperar en la escena hasta que regrese el propietario.
    D: Presentar un reporte del Propietario/Conductor dentro de 30 días.
  answer: B
  explanation: Si el choque involucró a un vehículo desatendido o un animal doméstico
    y no puede localizar al propietario, debe reportar el choque a la policía.
- id: 648
  category: penalties_and_points
  question: Si sus privilegios de manejo son revocados por no establecer responsabilidad
    financiera por un choque, ¿qué formulario debe presentar su compañía de seguro
    de responsabilidad civil antes de la reinstalación?
  choices:
    A: Formulario SR-22
    B: Formulario FR-44
    C: Formulario TN-10
    D: Formulario DL-12
  answer: A
  explanation: Antes de que se puedan reinstalar los privilegios de manejo después
    de dicha revocación, se le exige pagar una tarifa de reinstalación y hacer que
    una compañía de seguro de responsabilidad civil presente un formulario SR-22 ante
    el Departamento de Seguridad.
- id: 649
  category: safe_driving_rules
  question: ¿Qué es lo primero que debe hacerle a un vehículo dañado en la escena
    de un choque para prevenir un incendio?
  choices:
    A: Desconectar la batería.
    B: Apagar el encendido.
    C: Echar agua sobre el motor.
    D: Quitar la tapa del tanque de gasolina.
  answer: B
  explanation: El manual instruye a los conductores a "Apagar el encendido en el vehículo
    dañado para prevenir un incendio".
- id: 650
  category: safe_driving_rules
  question: Según la ley de Tennessee, ¿cuándo se le permite mover su vehículo fuera
    del flujo de tráfico después de un choque en la autopista interestatal?
  choices:
    A: Solo después de que la policía haya llegado y tomado fotos.
    B: Si el vehículo se puede conducir y no hay lesiones personales graves ni muertes.
    C: Nunca se le permite mover un vehículo hasta que llegue una grúa.
    D: Solo si los daños a la propiedad son menores a $50.
  answer: B
  explanation: Si está involucrado en un choque de tráfico en la autopista interestatal,
    la ley de Tennessee le permite mover el vehículo para evitar bloquear el tráfico
    si el vehículo aún se puede conducir y NO HAY LESIONES PERSONALES GRAVES ni muertes.
- id: 651
  category: safe_driving_rules
  question: ¿Cuándo es aceptable mover a una persona herida de un vehículo accidentado
    si usted no tiene entrenamiento médico o de rescate?
  choices:
    A: Cuando le pidan que los mueva.
    B: Cuando están bloqueando el tráfico.
    C: Cuando hay un peligro inmediato, como un incendio.
    D: Cuando la ambulancia está a más de 10 minutos de distancia.
  answer: C
  explanation: No intente mover a una persona herida de un vehículo accidentado a
    menos que tenga el entrenamiento médico o de rescate necesario, o si existe un
    peligro inmediato como un incendio.
- id: 652
  category: defensive_driving
  question: Si usted llega primero a la escena de un accidente y no está capacitado
    profesionalmente para prestar primeros auxilios, ¿qué debe hacer después de llamar
    al 911?
  choices:
    A: Detenerse y dirigir el tráfico alrededor del accidente.
    B: Continuar lentamente en su vehículo para no interferir.
    C: Hacerse a un lado y esperar a que la policía tome su declaración.
    D: Intentar sacar a los pasajeros de los vehículos.
  answer: B
  explanation: Si no está capacitado profesionalmente para prestar primeros auxilios,
    continúe lentamente en su vehículo para no interferir con la llegada de la policía
    y los servicios de emergencia, previniendo así una colisión secundaria.
- id: 653
  category: safe_driving_rules
  question: Si usted es testigo de un accidente, ¿cuál es el procedimiento adecuado
    según el manual?
  choices:
    A: Hacerse a un lado de la carretera de manera segura, encender las luces intermitentes
      de emergencia y notificar a la policía.
    B: Perseguir a los vehículos si fue un choque y fuga.
    C: Continuar conduciendo y llamar a la policía cuando llegue a casa.
    D: Detenerse en medio de la carretera para bloquear el tráfico y proteger la escena.
  answer: A
  explanation: Si presenció el accidente, hágase a un lado de la carretera de manera
    segura y encienda las luces intermitentes de emergencia de su vehículo. Notifique
    al oficial de policía o al Patrullero Estatal de Tennessee que usted fue testigo
    del accidente.
- id: 654
  category: penalties_and_points
  question: Según el manual, ¿por cuál de las siguientes razones se puede revocar
    o suspender una licencia de conducir?
  choices:
    A: Acumular 8 puntos en un período de 12 meses
    B: Alterar fraudulentamente una licencia de conducir
    C: Recibir una sola multa de estacionamiento
    D: Conducir 5 mph por encima del límite de velocidad una vez
  answer: B
  explanation: El manual establece que una licencia de conducir puede ser revocada
    o suspendida por alterar fraudulentamente una licencia de conducir, o por condenas
    frecuentes que resulten en 12 o más puntos dentro de un período de 12 meses.
- id: 655
  category: defensive_driving
  question: ¿Qué significa la práctica de conducción segura 'Apuntar alto al conducir'
    (Aim High In Steering)?
  choices:
    A: Ajustar el volante a la posición más alta
    B: Mirar lo más lejos posible en la carretera para descubrir información importante
      sobre el tráfico
    C: Mantener los ojos enfocados directamente en el capó de su automóvil
    D: Conducir con ambas manos en la parte superior del volante
  answer: B
  explanation: '''Apuntar alto al conducir'' significa mirar lo más lejos posible
    en la carretera para descubrir información importante sobre el tráfico y así tomar
    decisiones adecuadas.'
- id: 656
  category: defensive_driving
  question: 'Para ''Dejarse una salida'' (Leave Yourself an Out) mientras conduce,
    debe rodear su vehículo con espacio en la parte delantera y al menos en:'
  choices:
    A: Ambos lados
    B: La parte trasera
    C: Un lado
    D: Solo el lado del pasajero
  answer: C
  explanation: El manual aconseja 'Dejarse una salida' estando preparado y rodeando
    su vehículo con espacio en la parte delantera y al menos en un lado para escapar
    de un conflicto.
- id: 657
  category: driver_responsibility
  question: ¿Cuáles son las actitudes de conducción más importantes que puede desarrollar
    para garantizar una conducción segura?
  choices:
    A: Agresividad y velocidad
    B: Cortesía y consideración hacia los demás
    C: Confianza y asertividad
    D: Competitividad y estado de alerta
  answer: B
  explanation: Según el manual, la cortesía y la consideración hacia los demás son
    las actitudes de conducción más importantes que puede desarrollar y son la clave
    para una conducción segura.
- id: 658
  category: defensive_driving
  question: 'Al conducir a la defensiva, usted debe esperar que el otro conductor:'
  choices:
    A: Siempre obedezca las reglas de tránsito
    B: Le ceda el derecho de paso
    C: Haga lo INCORRECTO
    D: Use sus luces direccionales correctamente
  answer: C
  explanation: Una regla clave para conducir alerta es esperar que el otro conductor
    haga lo INCORRECTO, y tener un plan de acción preparado para contrarrestar su
    error.
- id: 659
  category: safe_driving_rules
  question: ¿Bajo qué condiciones debe aumentar su distancia de seguimiento a por
    lo menos 3 a 4 segundos?
  choices:
    A: Al conducir en vecindarios residenciales
    B: Al seguir camiones comerciales grandes o autobuses en autopistas interestatales
      de alta velocidad
    C: Al conducir en tráfico pesado con paradas y arranques continuos
    D: Al acercarse a una parada de cuatro vías (four-way stop)
  answer: B
  explanation: El manual establece que en autopistas interestatales de alta velocidad,
    al seguir camiones comerciales grandes o autobuses, y en condiciones de mal tiempo
    o visibilidad limitada, lo más seguro es aumentar la distancia de seguimiento
    a por lo menos 3 a 4 segundos.
- id: 660
  category: defensive_driving
  question: ¿Qué porcentaje de la información sobre la carretera y nuestro entorno
    recopilamos a través de nuestros ojos mientras conducimos?
  choices:
    A: 50%
    B: 75%
    C: 90%
    D: 99%
  answer: C
  explanation: Al conducir, recopilamos el 90% de la información sobre la carretera
    y nuestro entorno a través de nuestros ojos.
- id: 661
  category: defensive_driving
  question: ¿A qué distancia hacia adelante deben intentar enfocar la vista los conductores
    defensivos al observar el camino?
  choices:
    A: De 2 a 3 segundos hacia adelante
    B: De 5 a 8 segundos hacia adelante
    C: De 10 a 15 segundos hacia adelante
    D: De 20 a 30 segundos hacia adelante
  answer: C
  explanation: Los conductores defensivos intentan enfocar la vista de 10 a 15 segundos
    (aproximadamente la distancia de una cuadra o manzana) hacia adelante para ver
    las cosas con anticipación y tener más tiempo para reaccionar.
- id: 662
  category: safe_driving_rules
  question: Al ingresar a una intersección, ¿por qué debe mirar primero a la izquierda?
  choices:
    A: Porque los vehículos que vienen por la izquierda estarán más cerca de usted
    B: Porque los vehículos de la izquierda siempre tienen el derecho de paso
    C: Porque dar vuelta a la izquierda es ilegal en la mayoría de las intersecciones
    D: Porque las señales de tránsito generalmente se colocan a la izquierda
  answer: A
  explanation: En cualquier intersección, mire primero a la izquierda, ya que los
    vehículos que vienen por la izquierda estarán más cerca de usted.
- id: 663
  category: defensive_driving
  question: ¿Con qué frecuencia debe usar su espejo retrovisor para revisar el tráfico
    detrás de usted?
  choices:
    A: Aproximadamente cada 5 segundos
    B: Aproximadamente cada 10 segundos
    C: Aproximadamente cada 30 segundos
    D: Solo cuando se esté preparando para detenerse
  answer: B
  explanation: Debe usar su espejo retrovisor para revisar el tráfico detrás de usted
    con frecuencia, aproximadamente cada 10 segundos.
- id: 664
  category: safe_driving_rules
  question: ¿Cuándo debe desarrollar el hábito de usar sus luces direccionales?
  choices:
    A: Solo cuando vea otros vehículos en la vía
    B: Solo al cambiar de carril en una autopista interestatal
    C: Incluso cuando no vea otros vehículos en la vía
    D: Solo durante las horas de luz del día
  answer: C
  explanation: Debe desarrollar el hábito de usar sus luces direccionales incluso
    cuando no vea otros vehículos en la vía.
- id: 665
  category: defensive_driving
  question: Si un vehículo lo sigue muy de cerca (tailgating) y no hay un carril derecho
    al cual moverse, ¿cuál es la forma más segura de manejar la situación?
  choices:
    A: Frenar rápidamente para disuadir al conductor que lo sigue
    B: Esperar hasta que el camino por delante esté despejado y sea legal rebasar,
      y luego reducir lentamente su velocidad
    C: Acelerar para aumentar la distancia entre usted y el vehículo que lo sigue
    D: Tocar los frenos repetidamente para hacer parpadear las luces de freno
  answer: B
  explanation: Si no hay un carril derecho, espere hasta que el camino por delante
    esté despejado y sea legal rebasar, y luego reduzca lentamente su velocidad. Esto
    animará al conductor que lo sigue a rebasarlo. Nunca frene rápidamente.
- id: 666
  category: defensive_driving
  question: Al observar el camino, ¿cuál de las siguientes es una pista de que un
    vehículo podría interponerse en su camino?
  choices:
    A: Las ventanas del vehículo están bajadas
    B: El vehículo tiene el parabrisas sucio
    C: El vehículo tiene las ruedas giradas o sale humo del escape
    D: El vehículo está estacionado cerca de una boca de incendios
  answer: C
  explanation: Debe buscar pistas como humo del escape, luces de freno o de reversa,
    y ruedas giradas en los vehículos, ya que esto indica que podrían interponerse
    en su camino.
- id: 667
  category: safe_driving_rules
  question: Al encontrarse con vehículos que vienen en sentido contrario en una carretera
    de dos carriles, ¿dónde debe posicionar su vehículo?
  choices:
    A: Directamente sobre la línea central
    B: Ligeramente a la derecha de su carril para no invadir la línea central
    C: Ligeramente a la izquierda de su carril para ver mejor
    D: En el acotamiento (hombro) derecho de la carretera
  answer: B
  explanation: Al encontrarse con vehículos que vienen en sentido contrario en una
    carretera de dos carriles, manténgase ligeramente a la derecha de su carril para
    no 'invadir' la línea central.
- id: 668
  category: penalties_and_points
  question: ¿Una licencia de conducir puede ser revocada o suspendida por condenas
    frecuentes por infracciones de tránsito que resulten en cuántos puntos dentro
    de un período de 12 meses?
  choices:
    A: 6 o más puntos
    B: 8 o más puntos
    C: 10 o más puntos
    D: 12 o más puntos
  answer: D
  explanation: Una licencia de conducir puede ser revocada o suspendida por condenas
    frecuentes por infracciones de tránsito que resulten en 12 o más 'puntos' dentro
    de un período de 12 meses.
- id: 669
  category: defensive_driving
  question: ¿Cuál es el espacio mínimo necesario cada vez que cambia de carril, ingresa
    a una vía o se incorpora a otro carril de tráfico?
  choices:
    A: Espacio de dos segundos
    B: Espacio de tres segundos
    C: Espacio de cuatro segundos
    D: Espacio de cinco segundos
  answer: C
  explanation: Según el manual, se necesita un espacio mínimo de cuatro segundos cada
    vez que cambia de carril, ingresa a una vía o cuando su carril se incorpora a
    otro carril de tráfico.
- id: 670
  category: safe_driving_rules
  question: Al rebasar a otro vehículo, ¿cuándo es más seguro regresar al carril de
    conducción?
  choices:
    A: Tan pronto como su vehículo esté por delante del parachoques delantero del
      otro vehículo.
    B: Cuando pueda ver ambos faros delanteros del vehículo rebasado en su espejo
      retrovisor.
    C: Cuando el conductor al que rebasó le haga un cambio de luces.
    D: Después de que hayan pasado exactamente tres segundos desde que cambió de carril.
  answer: B
  explanation: Para terminar de rebasar de manera defensiva, lo más seguro es no regresar
    al carril de conducción hasta que pueda ver ambos faros delanteros del vehículo
    que acaba de rebasar en el espejo retrovisor.
- id: 671
  category: safe_driving_rules
  question: ¿Aproximadamente cuánto tiempo necesita para completar el rebase de un
    solo vehículo a 55 mph?
  choices:
    A: Aproximadamente 5 segundos
    B: Aproximadamente 10 segundos
    C: Aproximadamente 15 segundos
    D: Aproximadamente 20 segundos
  answer: B
  explanation: A 55 mph necesitará unos diez (10) segundos para completar el rebase
    de un solo vehículo, lo que significa que necesita un espacio de diez segundos
    en el tráfico en sentido contrario.
- id: 672
  category: defensive_driving
  question: Según la NHTSA, ¿aproximadamente qué porcentaje de todas las muertes de
    tránsito anuales son causadas por comportamientos de manejo agresivo?
  choices:
    A: 33%
    B: 50%
    C: 66%
    D: 80%
  answer: C
  explanation: La Administración Nacional de Seguridad del Tráfico en las Carreteras
    (NHTSA) indica que alrededor del 66% de todas las muertes de tránsito anuales
    son causadas por comportamientos de manejo agresivo.
- id: 673
  category: defensive_driving
  question: Si un conductor agresivo lo sigue, ¿cuál es la acción recomendada?
  choices:
    A: Conducir a casa inmediatamente y poner seguro a las puertas.
    B: Detener su vehículo y confrontar al conductor.
    C: Ir a una estación de policía o a un lugar público donde pueda obtener ayuda.
    D: Acelerar para perder al conductor en el tráfico.
  answer: C
  explanation: Los consejos para evitar la furia al volante indican que si un conductor
    lo sigue, debe ir a una estación de policía o a un lugar público donde pueda obtener
    ayuda.
- id: 674
  category: safe_driving_rules
  question: ¿Bajo qué condiciones climáticas ocurren la mayoría de los accidentes?
  choices:
    A: En clima despejado
    B: En la nieve
    C: En la lluvia
    D: En la niebla
  answer: A
  explanation: Según la breve prueba del manual sobre condiciones especiales de manejo,
    la mayoría de los accidentes ocurren en clima despejado, señalando que "¡los días
    hermosos también pueden ser mortales!".
- id: 675
  category: defensive_driving
  question: ¿Cuáles son las tres opciones que tiene un conductor para evitar una colisión?
  choices:
    A: Detenerse, girar, acelerar
    B: Frenar, tocar la bocina, desviarse
    C: Detenerse, retroceder, girar
    D: Acelerar, tocar la bocina, frenar
  answer: A
  explanation: 'Para evitar una colisión, los conductores tienen tres opciones: 1.
    Detenerse, 2. Girar, 3. Acelerar.'
- id: 676
  category: vehicle_information
  question: 'Si necesita detenerse rápidamente y su vehículo está equipado con un
    Sistema de Frenos Antibloqueo (ABS), usted debe:'
  choices:
    A: Bombear los frenos rápidamente para evitar derrapar.
    B: Presionar el pedal del freno lo más fuerte que pueda y mantenerlo presionado
      firmemente.
    C: Aplicar los frenos suavemente y aumentar la presión gradualmente.
    D: Presionar el pedal del freno con fuerza y soltarlo inmediatamente si siente
      que empuja hacia atrás.
  answer: B
  explanation: Con el ABS, debe presionar el pedal del freno lo más fuerte que pueda
    y mantenerlo presionado firmemente. NO debe soltar el pedal del freno incluso
    si siente que empuja hacia atrás.
- id: 677
  category: vehicle_information
  question: ¿Qué debe hacer si debe detenerse rápidamente, NO tiene ABS y sus frenos
    se bloquean causando un derrape?
  choices:
    A: Seguir presionando el pedal del freno lo más fuerte posible.
    B: Soltar rápidamente el pedal del freno y luego volver a presionarlo una vez
      que se detenga el derrape.
    C: Girar el volante bruscamente en la dirección opuesta.
    D: Aplicar el freno de estacionamiento inmediatamente.
  answer: B
  explanation: Sin ABS, si los frenos se bloquean y comienza a derrapar, debe soltar
    rápidamente el pedal del freno. Tan pronto como el vehículo deje de derrapar,
    vuelva a presionar el pedal del freno.
- id: 678
  category: safe_driving_rules
  question: Para hacer giros evasivos rápidos, ¿cuál es la posición recomendada de
    las manos en el volante?
  choices:
    A: A las 10 en punto y a las 2 en punto
    B: A las 8 en punto y a las 4 en punto
    C: A las 3 en punto y a las 9 en punto
    D: A las 12 en punto y a las 6 en punto
  answer: C
  explanation: Para la mayoría de los giros, especialmente los giros rápidos, es mejor
    tener las manos aproximadamente en las posiciones de las 3 en punto y las 9 en
    punto.
- id: 679
  category: vehicle_information
  question: ¿Por qué se recomienda la posición de las manos a las 3 en punto y a las
    9 en punto en el volante?
  choices:
    A: Le permite alcanzar la señal de giro más fácilmente.
    B: Mantiene sus muñecas y antebrazos fuera del área principal de impacto de la
      bolsa de aire (airbag).
    C: Evita que el volante se bloquee durante un giro cerrado.
    D: Proporciona la mayor palanca para girar el volante con una mano.
  answer: B
  explanation: Tener las manos a las 3 en punto y a las 9 en punto mantiene sus muñecas
    y antebrazos fuera del área principal de impacto de la bolsa de aire (airbag)
    ubicada en el volante en caso de que se vea involucrado en una colisión.
- id: 680
  category: defensive_driving
  question: ¿Qué significa la regla de manejo "Dividir la diferencia" (Split the difference)?
  choices:
    A: Pisar la línea del carril al rebasar una bicicleta.
    B: Tomar un curso intermedio entre dos peligros, dejando más espacio en el lado
      más peligroso.
    C: Cruzar múltiples carriles de tráfico un carril a la vez.
    D: Mantener una distancia de seguimiento de dos segundos en tráfico normal.
  answer: B
  explanation: '"Dividir la diferencia" significa tomar un curso intermedio entre
    dos peligros. Si uno es más peligroso que el otro, debe dejar un poco más de espacio
    en el lado más peligroso.'
- id: 681
  category: safe_driving_rules
  question: Al cruzar el tráfico en una intersección, ¿de qué debe asegurarse antes
    de entrar?
  choices:
    A: De que puede cruzar hasta la mitad y esperar en la mediana (camellón).
    B: De que tiene un espacio lo suficientemente grande para cruzar por completo
      sin bloquear la intersección.
    C: De que el vehículo detrás de usted también esté listo para cruzar.
    D: De acelerar para ganarle al tráfico que se aproxima.
  answer: B
  explanation: Al cruzar el tráfico, necesita un espacio lo suficientemente grande
    para cruzar la calle por completo. NO debe bloquear las intersecciones ni quedarse
    atrapado con una parte de su vehículo en un carril de circulación.
- id: 682
  category: defensive_driving
  question: Si otro conductor comete un error, como rebasarlo sin suficiente espacio,
    ¿qué debe hacer?
  choices:
    A: Acelerar para evitar que entre en su carril.
    B: Tocar la bocina y encender y apagar las luces para advertirle.
    C: Reducir la velocidad y dejar espacio para que regrese de manera segura al carril
      de circulación.
    D: Moverse al acotamiento (arcén) y detenerse por completo.
  answer: C
  explanation: Si otro conductor comete un error, como rebasar sin suficiente espacio,
    debe manejar el error a la defensiva reduciendo la velocidad y dejando espacio
    para que los conductores que rebasan regresen de manera segura al carril de circulación.
- id: 683
  category: safe_driving_rules
  question: ¿Cuál es la posición recomendada de las manos para la conducción básica?
  choices:
    A: A las 10 y a las 2 en punto
    B: A las 9 y a las 3 en punto
    C: A las 8 y a las 4 en punto
    D: A las 11 y a la 1 en punto
  answer: B
  explanation: El manual indica que la posición básica de conducción es colocar las
    manos a la izquierda a las 9 en punto y a la derecha a las 3 en punto.
- id: 684
  category: vehicle_information
  question: ¿Qué sucede en una emergencia o en condiciones resbaladizas si su vehículo
    NO tiene frenos antibloqueo (ABS) y usted frena bruscamente?
  choices:
    A: Las ruedas no se bloquearán y el automóvil permanecerá estable.
    B: El automóvil acelerará automáticamente para evitar una colisión.
    C: Todas las ruedas se bloquearán, el automóvil comenzará a derrapar y no se podrá
      maniobrar.
    D: Los frenos se bombearán electrónicamente mucho más rápido de lo que usted puede
      hacerlo manualmente.
  answer: C
  explanation: En condiciones de emergencia o resbaladizas sin ABS, todas las ruedas
    se bloquean; el automóvil comienza a derrapar y no se puede maniobrar.
- id: 685
  category: defensive_driving
  question: Si su vehículo no tiene ABS, ¿qué debe hacer para girar rápidamente mientras
    frena?
  choices:
    A: Pisar a fondo y mantener presionado el pedal del freno firmemente mientras
      gira.
    B: Soltar el pedal del freno y luego girar el volante.
    C: Bombear los frenos rápidamente mientras da un tirón al volante.
    D: Acelerar mientras gira el volante bruscamente.
  answer: B
  explanation: Sin ABS, mientras frena, necesitará soltar el pedal del freno y luego
    girar el volante para poder girar rápidamente.
- id: 686
  category: defensive_driving
  question: ¿Cuándo podría ser mejor o necesario acelerar para evitar una colisión?
  choices:
    A: Cuando se acerca a una señal de cruce de ciervos (venados).
    B: Cuando otro vehículo está a punto de golpearlo por un lado o por detrás y hay
      espacio en la parte delantera.
    C: Cuando conduce en una zona escolar y un automóvil lo sigue muy de cerca.
    D: Cuando se acerca a una curva cerrada sin ABS.
  answer: B
  explanation: A veces es mejor acelerar para evitar una colisión cuando otro vehículo
    está a punto de golpearlo por un lado o por detrás y hay espacio en la parte delantera
    de su vehículo para salir del peligro.
- id: 687
  category: safe_driving_rules
  question: ¿Qué estación del año es la época de mayor incidencia de choques entre
    vehículos y ciervos (venados)?
  choices:
    A: Primavera
    B: Verano
    C: Otoño
    D: Invierno
  answer: C
  explanation: El otoño es la temporada alta de choques entre vehículos y ciervos
    porque es tanto la temporada de apareamiento como la de caza, lo que hace que
    los ciervos estén más activos.
- id: 688
  category: defensive_driving
  question: ¿Por qué debe evitar encender y apagar las luces delanteras a un ciervo
    (venado) en la carretera?
  choices:
    A: Hará que el ciervo embista su vehículo.
    B: Los ciervos tienden a fijar la vista en los faros, por lo que encenderlos y
      apagarlos puede hacer que el animal se quede paralizado en la carretera.
    C: Cegará temporalmente a los conductores que se aproximan.
    D: Hará que el ciervo corra de manera impredecible hacia el tráfico que se aproxima.
  answer: B
  explanation: Los ciervos tienden a fijar la vista en los faros, por lo que encenderlos
    y apagarlos puede hacer que el animal se quede paralizado en la carretera.
- id: 689
  category: defensive_driving
  question: ¿Qué debe hacer si una colisión con un animal parece inevitable?
  choices:
    A: Desviarse bruscamente hacia la izquierda o la derecha para evitar al animal.
    B: Acelerar para minimizar el tiempo de impacto.
    C: Mantener su vehículo bajo control y en la carretera sin desviarse.
    D: Bombear los frenos rápidamente y dar un tirón al volante.
  answer: C
  explanation: Si una colisión parece inevitable, no se desvíe para evitar al animal;
    su riesgo de sufrir lesiones personales puede ser mayor si lo hace. Mantenga su
    vehículo bajo control y en la carretera.
- id: 690
  category: vehicle_information
  question: ¿Cuál es la técnica de frenado correcta al usar frenos antibloqueo (ABS)
    en una situación de emergencia real?
  choices:
    A: Bombear el pedal del freno rápidamente.
    B: Tocar ligeramente los frenos para advertir a otros conductores.
    C: Pisar fuerte y mantener el pedal presionado, incluso si vibra (pulsa).
    D: Soltar los frenos ligeramente cuando sienta que el pedal vibra.
  answer: C
  explanation: El manual indica a los conductores con ABS que 'Pisen a fondo. Golpeen
    ese pedal de freno. Pisen fuerte y mantengan el pedal presionado'. No debe soltarlo
    incluso si el pedal vibra (pulsa).
- id: 691
  category: vehicle_information
  question: ¿Por qué NUNCA debe bombear el pedal de freno de un vehículo equipado
    con frenos antibloqueo (ABS)?
  choices:
    A: Bombear los frenos hará que el motor se apague.
    B: El sistema ABS ya está bombeando electrónicamente los frenos mucho más rápido
      de lo que usted puede hacerlo manualmente.
    C: Hará que el volante se bloquee.
    D: Desactivará las bolsas de aire del vehículo.
  answer: B
  explanation: Nunca debe bombear el pedal de freno de un vehículo equipado con ABS
    porque la sensación de pulsación es simplemente el sistema ABS 'bombeando' electrónicamente
    los frenos mucho más rápido de lo que usted podría hacerlo manualmente.
- id: 692
  category: safe_driving_rules
  question: ¿Cuáles son los tres componentes principales del sistema de transporte
    vial que deben tenerse en cuenta al conducir?
  choices:
    A: Conductor, vehículo y carretera.
    B: Clima, tráfico y velocidad.
    C: Visión, audición y reflejos.
    D: Señales, semáforos y marcas viales.
  answer: A
  explanation: 'Hay tres componentes principales en nuestro sistema de transporte
    vial que deben tenerse en cuenta al conducir: 1. Conductor, 2. Vehículo, 3. Carretera.'
- id: 693
  category: driver_responsibility
  question: ¿Cuál es la causa más común de los accidentes de tránsito?
  choices:
    A: Malas condiciones climáticas.
    B: Falla mecánica.
    C: Error humano.
    D: Carreteras en mal estado.
  answer: C
  explanation: El manual establece que el error humano es la causa más común de los
    accidentes de tránsito.
- id: 694
  category: driver_responsibility
  question: Según el manual, ¿cuál de los siguientes es uno de los factores principales
    en los accidentes de tránsito?
  choices:
    A: Conducir con la radio encendida.
    B: Exceso de velocidad.
    C: Usar las luces altas de noche.
    D: Conducir un vehículo antiguo.
  answer: B
  explanation: Los factores principales en los accidentes son el exceso de velocidad,
    la falta de concentración y las maniobras evasivas inadecuadas.
- id: 695
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes condiciones temporales puede convertirlo en un
    conductor inseguro?
  choices:
    A: Enojo, preocupación y fatiga.
    B: Usar gafas de sol durante el día.
    C: Llevar un pasajero en el asiento trasero.
    D: Conducir un vehículo equipado con ABS.
  answer: A
  explanation: El enojo, la preocupación, la frustración, la fatiga y las enfermedades
    menores, como un resfriado, son algunas de las condiciones temporales que pueden
    convertirlo en un conductor inseguro.
- id: 696
  category: safe_driving_rules
  question: ¿Por qué un conductor debe usar sus espejos laterales y mirar hacia los
    lados ocasionalmente?
  choices:
    A: Porque no puede enfocar las cosas a los lados usando solo la visión periférica.
    B: Para asegurarse de que las puertas traseras estén bien cerradas.
    C: Para controlar la velocidad de los vehículos en el carril contrario.
    D: Para evitar mirar directamente a los faros de los vehículos que se aproximan.
  answer: A
  explanation: Debido a que no puede enfocar las cosas a los lados, también debe usar
    sus espejos laterales y mirar hacia los lados ocasionalmente si es necesario.
- id: 697
  category: driver_responsibility
  question: ¿Qué debe hacer si atropella a un animal grande, como un ciervo o un animal
    de granja?
  choices:
    A: Mover al animal fuera de la carretera usted mismo.
    B: Reportar el accidente a la policía.
    C: Abandonar la escena inmediatamente si su automóvil puede conducirse.
    D: Esperar junto al animal hasta que llegue su dueño.
  answer: B
  explanation: Debe reportar el accidente a la policía si involucra a un animal grande,
    como un ciervo o un animal de granja.
- id: 698
  category: license_system
  question: ¿Qué indica el Código de Restricción 01 en su licencia de conducir?
  choices:
    A: Está restringido a conducir solo durante las horas de luz del día.
    B: Debe tener un adulto con licencia en el vehículo en todo momento.
    C: Debe usar lentes correctivos en todo momento al conducir.
    D: Tiene prohibido conducir en autopistas interestatales.
  answer: C
  explanation: El manual establece que si su licencia de conducir indica que debe
    usar lentes correctivos (Código de Restricción 01), debe usarlos en todo momento
    al conducir.
- id: 699
  category: safe_driving_rules
  question: ¿Por qué debe evitar usar gafas de sol oscuras o lentes de contacto tintados
    por la noche?
  choices:
    A: Aumentan el resplandor de los faros de los vehículos que se aproximan.
    B: Reducen la luz que necesita para ver con claridad.
    C: Hacen que sus ojos se fatiguen mucho más rápido.
    D: Es ilegal usarlos mientras conduce en Tennessee.
  answer: B
  explanation: El manual aconseja evitar el uso de gafas de sol oscuras o lentes de
    contacto tintados por la noche porque reducen la luz que necesita para ver con
    claridad.
- id: 700
  category: driver_responsibility
  question: ¿Cómo pueden compensar los conductores con discapacidad auditiva para
    mantenerse seguros en la carretera?
  choices:
    A: Dependiendo más de su visión.
    B: Conduciendo a velocidades más lentas que el límite establecido.
    C: Manteniendo las ventanas bajadas en todo momento.
    D: Instalando bocinas más fuertes en sus vehículos.
  answer: A
  explanation: Según el manual, los conductores que tienen una discapacidad auditiva
    pueden adaptarse y compensar dependiendo más de su visión para ser conductores
    seguros.
- id: 701
  category: defensive_driving
  question: ¿Cuál de los siguientes es un consejo recomendado para ayudar a evitar
    la fatiga al conducir en un viaje largo?
  choices:
    A: Comer una comida abundante antes de comenzar el viaje.
    B: Detenerse cada hora o con más frecuencia si es necesario para tomar un descanso.
    C: Conducir tarde en la noche cuando hay menos tráfico en la carretera.
    D: Tomar medicamentos de venta libre para ayudarle a mantenerse alerta.
  answer: B
  explanation: Para evitar la fatiga, el manual recomienda tomar descansos deteniéndose
    cada hora o con más frecuencia si es necesario para caminar y tomar aire fresco.
- id: 702
  category: alcohol_drugs_health
  question: 'En Tennessee, una persona con epilepsia puede conducir si está bajo el
    cuidado de un médico y no ha tenido convulsiones durante un mínimo de:'
  choices:
    A: Tres meses
    B: Seis meses
    C: Un año
    D: Dos años
  answer: B
  explanation: El manual establece que en Tennessee, usted puede conducir si está
    bajo el cuidado de un médico y no ha tenido convulsiones durante un mínimo de
    seis meses.
- id: 703
  category: alcohol_drugs_health
  question: ¿Por qué los conductores con diabetes deben revisarse los ojos regularmente?
  choices:
    A: Porque la insulina hace que los ojos se vuelvan demasiado sensibles al resplandor.
    B: Para asegurarse de que no necesitan que se agregue el Código de Restricción
      01 a su licencia.
    C: Porque la diabetes hace que los ojos se sequen más rápido al conducir.
    D: Para detectar una posible ceguera nocturna u otros problemas de visión.
  answer: D
  explanation: El manual señala que si tiene diabetes, debe revisarse los ojos regularmente
    para detectar una posible ceguera nocturna u otros problemas de visión.
- id: 704
  category: driver_responsibility
  question: Si tiende a ser una persona impaciente, ¿qué debe hacer para evitar acciones
    de conducción inseguras?
  choices:
    A: Escuchar música de ritmo rápido para mantenerse alerta.
    B: Conducir un poco por encima del límite de velocidad para evitar el tráfico
      pesado.
    C: Planificar siempre tiempo adicional para sus viajes en automóvil.
    D: Conducir solo durante las horas de menor tráfico.
  answer: C
  explanation: El manual aconseja que si tiende a ser una persona impaciente, siempre
    debe planificar tiempo adicional para sus viajes en automóvil para evitar el exceso
    de velocidad u otras acciones inseguras.
- id: 705
  category: vehicle_information
  question: ¿Cuál de las siguientes es una señal de que su sistema de frenos necesita
    ser revisado por un mecánico?
  choices:
    A: El pedal del freno se siente firme y resiste la presión.
    B: El vehículo se detiene suavemente sin desviarse hacia un lado.
    C: El pedal del freno se va hasta el fondo.
    D: Los frenos son completamente silenciosos al aplicarlos.
  answer: C
  explanation: El manual advierte que es muy peligroso si los frenos no funcionan
    correctamente, como si hacen mucho ruido, huelen raro o si el pedal del freno
    se va hasta el fondo.
- id: 706
  category: vehicle_information
  question: ¿En qué tipo de clima tienden a descargarse más rápidamente las baterías
    de los automóviles?
  choices:
    A: Clima cálido y seco
    B: Clima frío o húmedo
    C: Clima húmedo y soleado
    D: Condiciones de gran altitud
  answer: B
  explanation: Según la sección de mantenimiento del vehículo, las baterías de los
    automóviles tienden a descargarse más rápidamente en clima frío o húmedo.
- id: 707
  category: vehicle_information
  question: ¿Cuál es una causa común de que se acumule una película en el interior
    de los vidrios de un vehículo?
  choices:
    A: Usar el calentador/desempañador con demasiada frecuencia.
    B: Usar líquido limpiaparabrisas anticongelante.
    C: Fumar dentro del vehículo.
    D: Dejar las ventanas bajadas durante la lluvia.
  answer: C
  explanation: El manual indica que debe mantener limpio el interior de sus ventanas,
    especialmente si alguien que usa el vehículo fuma, porque fumar hace que se acumule
    una película en el interior del vidrio.
- id: 708
  category: vehicle_information
  question: ¿Cuál es una consecuencia de conducir con neumáticos desbalanceados y
    baja presión de aire?
  choices:
    A: Mejora el ahorro de combustible y la comodidad del viaje.
    B: Hace que el vehículo sea más fácil de maniobrar en condiciones húmedas.
    C: Disminuye la probabilidad de hidroplaneo.
    D: Causa un desgaste más rápido de los neumáticos y reduce el ahorro de combustible.
  answer: D
  explanation: El manual explica que los neumáticos desbalanceados y la baja presión
    causan un desgaste más rápido de los neumáticos, reducen el ahorro de combustible
    y hacen que el vehículo sea más difícil de maniobrar y detener.
- id: 709
  category: vehicle_information
  question: 'Al usar un centavo (penny) para revisar la banda de rodadura del neumático,
    el neumático se considera ilegal e inseguro si la banda de rodadura no llega al
    menos a:'
  choices:
    A: La parte superior del Monumento a Lincoln
    B: La cabeza de Lincoln (2/32 de pulgada)
    C: La fecha impresa en el centavo
    D: Las palabras 'In God We Trust'
  answer: B
  explanation: El manual establece que si inserta un centavo en la banda de rodadura
    con la cabeza hacia abajo y la banda de rodadura no llega al menos a la cabeza
    de Lincoln (2/32 de pulgada), el neumático es ilegal e inseguro.
- id: 710
  category: vehicle_information
  question: ¿Dónde puede encontrar generalmente la presión de neumáticos recomendada
    para el vehículo en muchos automóviles más nuevos?
  choices:
    A: En la columna del volante.
    B: En la etiqueta del marco de la puerta delantera del lado del conductor.
    C: En el interior de la puerta de la guantera.
    D: En el parachoques trasero del vehículo.
  answer: B
  explanation: El manual señala que en muchos automóviles más nuevos, la presión de
    neumáticos recomendada para el vehículo se encuentra en la etiqueta del marco
    de la puerta, generalmente ubicada en la puerta delantera del lado del conductor.
- id: 711
  category: driver_responsibility
  question: ¿Con qué frecuencia recomienda el manual que un especialista le revise
    la vista?
  choices:
    A: Cada seis meses
    B: Cada año o dos
    C: Cada cinco años
    D: Solo al renovar su licencia de conducir
  answer: B
  explanation: Debido a que ver bien es muy importante para conducir de manera segura,
    el manual recomienda que un especialista le revise la vista cada año o dos.
- id: 712
  category: vehicle_information
  question: ¿Dónde se encuentra generalmente la presión de neumáticos recomendada
    para los neumáticos originales de un vehículo?
  choices:
    A: Impresa directamente en los propios neumáticos
    B: En una etiqueta en el marco de la puerta delantera del lado del conductor
    C: En la columna del volante
    D: Grabada en el bloque del motor
  answer: B
  explanation: En muchos automóviles más nuevos, la presión de neumáticos recomendada
    para el vehículo se encuentra en la etiqueta del marco de la puerta, generalmente
    ubicada en la puerta delantera del lado del conductor.
- id: 713
  category: vehicle_information
  question: ¿Por qué NO debe usar la presión de neumáticos impresa en los propios
    neumáticos?
  choices:
    A: Es la presión mínima requerida para conducir de manera segura.
    B: Solo es aplicable para condiciones de conducción en invierno.
    C: Es la presión máxima recomendada y puede no coincidir con las especificaciones
      de su vehículo.
    D: Está destinada solo para neumáticos de repuesto de un tamaño diferente.
  answer: C
  explanation: 'El manual indica: "No use la presión de neumáticos (psi) impresa en
    los propios neumáticos. Esta es la presión máxima recomendada para el neumático
    y puede no coincidir con las especificaciones del fabricante de su vehículo".'
- id: 714
  category: safe_driving_rules
  question: ¿Qué sucederá si gira el encendido de su vehículo a la posición de bloqueo
    ('lock') mientras el vehículo está en movimiento?
  choices:
    A: Los frenos se activarán inmediatamente.
    B: El volante se bloqueará en su lugar y usted perderá el control del vehículo.
    C: El motor se sobrecalentará rápidamente.
    D: El vehículo se deslizará de manera segura hasta detenerse.
  answer: B
  explanation: Nunca gire el encendido de su vehículo a la posición de bloqueo ('lock')
    mientras el vehículo está en movimiento. Esto hará que el volante se bloquee en
    su lugar y usted perderá el control del vehículo.
- id: 715
  category: vehicle_information
  question: Si su vehículo continúa rebotando después de un bache o una parada, ¿qué
    sistema probablemente necesita ser revisado por un mecánico?
  choices:
    A: El sistema de escape
    B: El sistema de dirección
    C: El sistema de enfriamiento del motor
    D: El sistema de suspensión
  answer: D
  explanation: Si el vehículo continúa rebotando después de un bache o una parada,
    o es difícil de controlar, es posible que necesite amortiguadores nuevos u otras
    piezas de suspensión.
- id: 716
  category: vehicle_information
  question: ¿Cuál es una señal de advertencia peligrosa de que su vehículo puede tener
    una fuga de escape?
  choices:
    A: El volante se vuelve difícil de girar.
    B: Usted o sus pasajeros sienten sueño al conducir o viajar en el vehículo.
    C: El vehículo rebota excesivamente después de detenerse.
    D: El indicador de temperatura del motor baja repentinamente.
  answer: B
  explanation: Si alguna vez comienza a notar que usted y/o sus pasajeros tienden
    a sentir sueño al conducir o viajar en su automóvil, es posible que tenga una
    fuga de escape que debe repararse de inmediato.
- id: 717
  category: safe_driving_rules
  question: ¿Qué debe hacer si está sentado en un vehículo con el motor en marcha
    (al ralentí) durante un período prolongado?
  choices:
    A: Girar el encendido a la posición de bloqueo ('lock').
    B: Revisar el nivel de refrigerante del radiador.
    C: Abrir una ventana para que entre aire fresco.
    D: Tocar la bocina periódicamente para mantenerse alerta.
  answer: C
  explanation: Cuando esté sentado durante períodos prolongados en un vehículo con
    el motor en marcha (al ralentí), abra una ventana para que entre aire fresco y
    evitar que los gases de monóxido de carbono intoxiquen a las personas en el vehículo.
- id: 718
  category: vehicle_information
  question: ¿Cuándo es el ÚNICO momento seguro para revisar el nivel de anticongelante/refrigerante
    de su radiador?
  choices:
    A: Inmediatamente después de operar el vehículo
    B: Mientras el motor está en marcha
    C: Cuando el vehículo está estacionado en una pendiente
    D: Cuando el vehículo está frío
  answer: D
  explanation: Tenga cuidado de revisar su radiador SOLO cuando el vehículo esté frío,
    no inmediatamente después de operarlo.
- id: 719
  category: defensive_driving
  question: ¿Por qué es peligroso tener objetos sueltos en el piso de su vehículo?
  choices:
    A: Pueden rodar debajo del pedal del freno y evitar que usted se detenga.
    B: Harán que el sistema de suspensión rebote.
    C: Pueden causar una fuga de escape.
    D: Agotarán la batería del vehículo.
  answer: A
  explanation: Asegúrese de que no haya objetos en el piso que puedan rodar debajo
    del pedal del freno y evitar que detenga el vehículo.
- id: 720
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el ÚNICO uso apropiado para la bocina de su
    vehículo?
  choices:
    A: Para saludar a amigos en la carretera
    B: Para animar a los conductores lentos a acelerar
    C: Como advertencia para los demás
    D: Para indicar que se está estacionando
  answer: C
  explanation: La bocina puede no parecer importante para la seguridad, pero como
    dispositivo de advertencia, podría salvarle la vida. SOLO use su bocina como advertencia
    para los demás.
- id: 721
  category: safe_driving_rules
  question: ¿De cuánta gasolina debe asegurarse de que disponga su vehículo antes
    de iniciar cualquier viaje de una longitud significativa?
  choices:
    A: Al menos un cuarto de tanque
    B: Al menos medio tanque
    C: Un tanque completamente lleno
    D: Lo suficiente para llegar a la gasolinera más cercana
  answer: B
  explanation: Asegúrese de que su vehículo siempre tenga al menos medio tanque de
    gasolina antes de iniciar cualquier viaje de una longitud significativa.
- id: 722
  category: defensive_driving
  question: 'Según el manual, las colisiones que involucran a múltiples vehículos
    a menudo ocurren cuando:'
  choices:
    A: Los conductores usan la bocina con demasiada frecuencia.
    B: Los conductores van más rápido o más lento que el resto del tráfico.
    C: Los vehículos tienen instalados neumáticos no originales (modificados).
    D: Los conductores revisan la presión de sus neumáticos con demasiada frecuencia.
  answer: B
  explanation: Los vehículos que se mueven en la misma dirección a la misma velocidad
    no pueden chocar entre sí. Las colisiones que involucran a múltiples vehículos
    a menudo ocurren cuando los conductores van más rápido o más lento que el resto
    del tráfico.
- id: 723
  category: defensive_driving
  question: ¿Por qué necesita reducir su velocidad y estar alerta en centros comerciales,
    estacionamientos y zonas céntricas?
  choices:
    A: Porque el límite de velocidad siempre es de 15 mph en estas áreas.
    B: Porque estas áreas siempre tienen bandas sonoras (rumble strips).
    C: Porque los vehículos y las personas se detienen, arrancan y se mueven en diferentes
      direcciones de manera rápida y aleatoria.
    D: Porque los niveles de monóxido de carbono son más altos en estas áreas.
  answer: C
  explanation: 'Centros comerciales, estacionamientos y zonas céntricas: estas son
    áreas concurridas con vehículos y personas que se detienen, arrancan y se mueven
    en diferentes direcciones de manera rápida y aleatoria.'
- id: 724
  category: safe_driving_rules
  question: ¿Por qué podría necesitar reducir la velocidad al cruzar algunos cruces
    de ferrocarril?
  choices:
    A: Para revisar la presión de sus neumáticos
    B: Porque algunos cruces son irregulares o tienen baches
    C: Para leer las especificaciones del fabricante
    D: Para dejar que el sistema de escape se enfríe
  answer: B
  explanation: 'Cruces de ferrocarril: debe asegurarse de que no vengan trenes y de
    tener espacio para cruzar. Algunos cruces son irregulares, por lo que debe reducir
    la velocidad para cruzar de manera segura.'
- id: 725
  category: sharing_the_road
  question: Según la ley estatal, ¿quién es considerado un peatón?
  choices:
    A: Solo las personas que caminan a pie
    B: Cualquier persona a pie o que use una silla de ruedas motorizada o no motorizada
    C: Cualquier persona que conduzca una bicicleta o una bicicleta a motor
    D: Solo los niños y los ancianos
  answer: B
  explanation: Cualquier persona a pie o que use una silla de ruedas motorizada o
    no motorizada es considerada un peatón por la ley estatal.
- id: 726
  category: sharing_the_road
  question: ¿Qué grupos de peatones son las víctimas más frecuentes en las colisiones
    entre automóviles y peatones?
  choices:
    A: Adolescentes y adultos jóvenes
    B: Trotadores y corredores
    C: Peatones que caminan en grupos grandes
    D: Peatones jóvenes, ancianos, discapacitados e intoxicados
  answer: D
  explanation: Debe estar especialmente alerta ante peatones jóvenes, ancianos, discapacitados
    e intoxicados. Son las víctimas más frecuentes en las colisiones entre automóviles
    y peatones.
- id: 727
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones sobre los cruces peatonales es verdadera?
  choices:
    A: Los cruces peatonales solo existen donde hay líneas pintadas.
    B: Los peatones solo tienen el derecho de paso en los cruces peatonales marcados.
    C: Hay un cruce peatonal en cada intersección, incluso si no hay líneas pintadas
      que marquen el cruce.
    D: Los conductores pueden bloquear un cruce peatonal si esperan para hacer un
      giro a la derecha.
  answer: C
  explanation: Según el manual, hay un cruce peatonal en cada intersección, incluso
    si las líneas pintadas y los límites no marcan el cruce.
- id: 728
  category: defensive_driving
  question: ¿Por qué los conductores deben evitar detenerse con una parte de su vehículo
    sobre el área del cruce peatonal?
  choices:
    A: Activará una cámara de luz roja.
    B: Obliga a los peatones a rodear el vehículo y los pone en una situación peligrosa.
    C: Causa un desgaste excesivo en los neumáticos del vehículo.
    D: Bloquea la vista del semáforo para otros conductores.
  answer: B
  explanation: Bloquear el cruce peatonal obliga a los peatones a rodear su vehículo
    y los pone en una situación peligrosa.
- id: 729
  category: safe_driving_rules
  question: ¿Qué debe hacer un conductor en una zona escolar marcada cuando las luces
    intermitentes de advertencia están funcionando y un peatón está cruzando?
  choices:
    A: Reducir la velocidad a 15 mph y avanzar con precaución.
    B: Tocar la bocina para advertir al peatón.
    C: Detenerse y ceder el derecho de paso hasta que el peatón haya cruzado la calzada.
    D: Desviarse hacia el carril adyacente para evitar al peatón.
  answer: C
  explanation: Cuando se encuentre en una zona escolar marcada con luces intermitentes
    de advertencia en funcionamiento, un conductor debe detenerse para ceder el derecho
    de paso y permanecer detenido hasta que el peatón haya cruzado la calzada.
- id: 730
  category: sharing_the_road
  question: Siempre debe ceder el paso a un peatón ciego que use un perro guía o lleve
    ¿qué tipo de bastón?
  choices:
    A: Un bastón completamente negro.
    B: Un bastón blanco, metálico o blanco con punta roja.
    C: Un bastón de madera.
    D: Un bastón reflectante amarillo.
  answer: B
  explanation: Los conductores siempre deben ceder el paso a los peatones ciegos que
    lleven un bastón blanco, metálico, blanco con punta roja o que usen un perro guía.
- id: 731
  category: safe_driving_rules
  question: Cuando no hay aceras disponibles, ¿por dónde deben caminar los peatones?
  choices:
    A: En el lado derecho de la vía, en la misma dirección que el tráfico.
    B: En el centro de la vía.
    C: En el lado izquierdo de la vía, de frente al tráfico.
    D: En el arcén de la vía, en la misma dirección que el tráfico.
  answer: C
  explanation: Cuando no hay aceras, los peatones siempre deben caminar por el lado
    izquierdo de la vía, de frente al tráfico, para poder ver cualquier peligro repentino
    que se acerque.
- id: 732
  category: safe_driving_rules
  question: ¿Cómo deben caminar dos o más peatones cuando transitan por una vía sin
    aceras?
  choices:
    A: Uno al lado del otro para aumentar la visibilidad.
    B: En una sola fila.
    C: Tomados de la mano a lo ancho del carril.
    D: Uno en el lado izquierdo de la vía y otro en el derecho.
  answer: B
  explanation: El manual establece que dos o más peatones deben caminar en una sola
    fila y nunca uno al lado del otro cuando caminan por la vía.
- id: 733
  category: sharing_the_road
  question: ¿Por qué es importante que los peatones mantengan una distancia segura
    al estar parados en las esquinas de las calles?
  choices:
    A: Para evitar que los salpiquen con agua de los charcos.
    B: Porque los camiones y autobuses hacen giros amplios a la derecha y ocasionalmente
      se suben a la esquina de la acera.
    C: Para dar espacio a los ciclistas para circular por la acera.
    D: Porque los autos a menudo se pasan los semáforos en rojo a altas velocidades.
  answer: B
  explanation: Los camiones y autobuses hacen giros amplios a la derecha y ocasionalmente
    se suben a la esquina de la acera, por lo que es importante que los peatones estén
    alerta y retrocedan.
- id: 734
  category: signs_and_signals
  question: ¿Qué debe hacer si está en el medio de la calle y la señal de "NO CAMINE"
    (DON'T WALK) comienza a parpadear?
  choices:
    A: Detenerse inmediatamente y esperar a la siguiente señal de CAMINE (WALK).
    B: Darse la vuelta y correr de regreso a la acera de donde partió.
    C: Continuar caminando para terminar de cruzar.
    D: Quedarse parado en la mediana central hasta que el tráfico se despeje.
  answer: C
  explanation: Si está en el medio de la calle y la señal de NO CAMINE (DON'T WALK)
    comienza a parpadear, continúe caminando. Tendrá tiempo para terminar de cruzar.
- id: 735
  category: signs_and_signals
  question: ¿Qué le indica a un peatón una señal de CAMINE (WALK) o un semáforo en
    verde?
  choices:
    A: Que es completamente seguro cruzar sin mirar.
    B: Que todo el tráfico que se aproxima tiene garantizado detenerse.
    C: Que es su turno de cruzar, pero aún debe mirar y avanzar solo si es seguro.
    D: Que debe correr a través de la intersección lo más rápido posible.
  answer: C
  explanation: La señal de CAMINE (WALK) y el semáforo en verde indican que es su
    turno de cruzar, pero NO significan que sea SEGURO cruzar. Significa que debe
    MIRAR y luego, SI es seguro, avanzar.
- id: 736
  category: driver_responsibility
  question: Incluso si usted tiene el derecho de paso legal como conductor, ¿qué NUNCA
    debe hacerle a un peatón que está frente a su auto?
  choices:
    A: Esperar pacientemente a que cruce.
    B: Tocar la bocina o acelerar el motor para apurarlo o asustarlo.
    C: Hacer contacto visual con él.
    D: Ceder el derecho de paso.
  answer: B
  explanation: No toque la bocina, no acelere el motor ni haga nada para apurar o
    asustar a un peatón frente a su auto, incluso si usted tiene el derecho de paso
    legal.
- id: 737
  category: safe_driving_rules
  question: ¿Cuál es el procedimiento de observación recomendado para un peatón antes
    de comenzar a cruzar una calle?
  choices:
    A: Mirar derecha-izquierda-derecha.
    B: Mirar solo hacia adelante.
    C: Mirar izquierda-derecha-izquierda, y por encima del hombro para ver si hay
      vehículos girando.
    D: Mirar hacia el semáforo y avanzar de inmediato.
  answer: C
  explanation: Antes de cruzar, deténgase en la acera y mire izquierda-derecha-izquierda,
    y si está despejado, comience a cruzar, mirando por encima del hombro para ver
    si hay vehículos girando.
- id: 738
  category: sharing_the_road
  question: ¿Por qué un peatón nunca debe caminar detrás de un camión cuando este
    está retrocediendo?
  choices:
    A: Los gases de escape del camión son tóxicos.
    B: Los conductores de camiones no pueden ver directamente detrás del camión y
      podrían lesionarlo gravemente.
    C: El camión podría dejar caer su carga.
    D: Es ilegal caminar detrás de cualquier vehículo comercial.
  answer: B
  explanation: Nunca camine detrás de un camión cuando esté retrocediendo; los conductores
    de camiones no pueden ver directamente detrás del camión y podrían lesionarlo
    gravemente debido a sus grandes puntos ciegos.
- id: 739
  category: sharing_the_road
  question: Al entrar o salir de un camino de entrada, callejón o estacionamiento,
    ¿qué debe hacer un conductor si su trayectoria cruza una acera?
  choices:
    A: Tocar la bocina para advertir a los peatones que se detengan.
    B: Ceder el paso a los peatones que caminan por la acera.
    C: Avanzar rápidamente para evitar bloquear la acera.
    D: Parpadear las luces delanteras para obtener el derecho de paso.
  answer: B
  explanation: Los conductores deben ceder el paso a los peatones que caminan por
    la acera al entrar o salir de un camino de entrada, garaje de estacionamiento
    público, callejón o estacionamiento y su trayectoria de viaje cruza la acera.
- id: 740
  category: safe_driving_rules
  question: ¿Cuál es la opción más segura para que un peatón sea visto de noche por
    los conductores?
  choices:
    A: Caminar exclusivamente por los cruces peatonales.
    B: Usar ropa oscura para reducir el resplandor.
    C: Llevar una linterna y usar ropa brillante o reflectante.
    D: Caminar por el lado derecho de la vía.
  answer: C
  explanation: Usar ropa brillante o reflectante y llevar una linterna es su opción
    más segura para ser visto de noche.
- id: 741
  category: sharing_the_road
  question: ¿Cuáles son las causas más comunes de colisiones entre vehículos y bicicletas?
  choices:
    A: Ciclistas que se pasan las señales de alto (stop) o los semáforos en rojo.
    B: Conductores que giran a la izquierda frente a una bicicleta que se aproxima
      o que giran a la derecha cruzando el camino de la bicicleta.
    C: Ciclistas que circulan en contra del flujo del tráfico.
    D: Conductores que rebasan a los ciclistas demasiado cerca en una carretera de
      varios carriles.
  answer: B
  explanation: Las causas más comunes de colisiones son los conductores que giran
    a la izquierda frente a una bicicleta que se aproxima o que giran a la derecha,
    cruzando el camino de la bicicleta.
- id: 742
  category: sharing_the_road
  question: Si su vehículo comparte el carril de giro a la izquierda con un ciclista,
    ¿qué debe hacer?
  choices:
    A: Tocar la bocina (claxon) para que se aparten de su camino.
    B: Rebasarlos por la derecha antes de hacer su giro.
    C: Mantenerse detrás de ellos hasta que hayan completado su giro de manera segura.
    D: Ponerse a su lado y girar al mismo tiempo.
  answer: C
  explanation: Si su vehículo comparte el carril de giro a la izquierda con un ciclista,
    manténgase detrás de él hasta que haya completado su giro de manera segura.
- id: 743
  category: sharing_the_road
  question: ¿Dónde tienen prohibido circular los ciclistas?
  choices:
    A: En caminos rurales de dos carriles.
    B: En calles de la ciudad con límites de velocidad superiores a 35 mph.
    C: En autopistas de acceso limitado, vías rápidas (expressways) y ciertas otras
      carreteras señalizadas.
    D: En carriles designados para bicicletas.
  answer: C
  explanation: Los ciclistas tienen prohibido circular en autopistas de acceso limitado,
    vías rápidas (expressways) y ciertas otras carreteras señalizadas.
- id: 744
  category: sharing_the_road
  question: En Tennessee, ¿cuál es la distancia mínima que debe dejar un conductor
    al rebasar a un ciclista que avanza en la misma dirección?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: Al rebasar y adelantar a un ciclista que avanza en la misma dirección,
    hágalo lentamente y deje al menos una distancia entre usted y la bicicleta de
    no menos de 3 pies. ¡Es la ley en Tennessee!
- id: 745
  category: safe_driving_rules
  question: ¿Qué debe hacer si está a punto de rebasar a una bicicleta en un camino
    estrecho y cree que el ciclista no sabe que usted se acerca?
  choices:
    A: Tocar la bocina fuertemente para asegurarse de que lo escuchen.
    B: Tocar la bocina suave y brevemente como señal.
    C: Acelerar el motor ruidosamente.
    D: Rebasarlos lo más cerca posible para que lo noten.
  answer: B
  explanation: Si está a punto de rebasar a una bicicleta en un camino estrecho y
    cree que el ciclista no sabe que usted se acerca, toque la bocina suave y brevemente
    como señal de que va a rebasar.
- id: 746
  category: sharing_the_road
  question: ¿Cuál es la señal manual correcta para que un ciclista indique un giro
    a la izquierda?
  choices:
    A: Extender el brazo izquierdo hacia un lado doblado en un ángulo de 90 grados,
      con la mano apuntando hacia arriba.
    B: Extender el brazo izquierdo o derecho hacia un lado y doblarlo en un ángulo
      de 90 grados, con la mano apuntando hacia abajo.
    C: Extender el brazo izquierdo hacia un lado con todos los dedos extendidos o
      usar el dedo índice para apuntar a la izquierda.
    D: Extender el brazo derecho recto hacia afuera con la palma hacia atrás.
  answer: C
  explanation: 'Giro a la izquierda: Extienda su brazo izquierdo hacia un lado con
    todos los dedos extendidos o use su dedo índice para apuntar a la izquierda.'
- id: 747
  category: sharing_the_road
  question: ¿Cómo señala un ciclista que se va a detener o a reducir la velocidad?
  choices:
    A: Extendiendo el brazo izquierdo hacia un lado con todos los dedos extendidos.
    B: Extendiendo el brazo izquierdo hacia un lado doblado en un ángulo de 90 grados,
      con la mano apuntando hacia arriba.
    C: Extendiendo el brazo derecho recto hacia afuera con todos los dedos extendidos.
    D: Extendiendo el brazo izquierdo o derecho hacia un lado y doblándolo en un ángulo
      de 90 grados, con la mano apuntando hacia abajo.
  answer: D
  explanation: 'Detenerse o reducir la velocidad: Extienda su brazo izquierdo o derecho
    hacia un lado y doble el brazo en un ángulo de 90 grados en la articulación del
    codo, con la mano apuntando hacia abajo y la palma de la mano hacia atrás.'
- id: 748
  category: sharing_the_road
  question: ¿Cuándo se le permite a un ciclista el uso completo del carril?
  choices:
    A: Cuando el carril es demasiado estrecho para que un vehículo y una bicicleta
      lo compartan de manera segura.
    B: Siempre que circulen por un vecindario residencial.
    C: Solo cuando circulan en un grupo de tres o más.
    D: A los ciclistas nunca se les permite el uso completo del carril.
  answer: A
  explanation: Se le debe permitir a un ciclista el uso completo del carril cuando...
    El carril es demasiado estrecho para que un vehículo y una bicicleta lo compartan
    de manera segura. En este caso, lo más seguro es dejar que la bicicleta ocupe
    todo el carril.
- id: 749
  category: vehicle_information
  question: Según la ley de Tennessee, ¿qué equipo de iluminación se requiere en una
    bicicleta que se usa de noche?
  choices:
    A: Una luz blanca en la parte delantera visible desde 500 pies y un reflector
      rojo o luz roja en la parte trasera visible desde 500 pies.
    B: Una luz amarilla en la parte delantera visible desde 300 pies y un reflector
      blanco en la parte trasera.
    C: Solo un reflector rojo en la parte trasera visible desde 200 pies.
    D: Una luz blanca intermitente en la parte delantera y una luz amarilla intermitente
      en la parte trasera.
  answer: A
  explanation: La ley de Tennessee requiere que una bicicleta que se use de noche
    esté equipada con una lámpara en la parte delantera que emita una luz blanca visible
    desde una distancia de al menos 500 pies hacia el frente y, ya sea un reflector
    rojo o una lámpara que emita una luz roja que sea visible desde una distancia
    de 500 pies hacia atrás.
- id: 750
  category: sharing_the_road
  question: ¿Por qué los ciclistas tienden a moverse hacia el centro del carril cuando
    pasan junto a autos estacionados?
  choices:
    A: Para bloquear el tráfico y evitar que los rebasen.
    B: Para evitar lesionar o ser lesionados por personas que salen de esos autos.
    C: Porque el pavimento es más liso en el centro del carril.
    D: Para prepararse para un giro a la derecha.
  answer: B
  explanation: Cuando los ciclistas pasan junto a autos estacionados, tienden a alejarse
    de los autos, hacia el centro del carril. Esto es para evitar lesionar o ser lesionados
    por personas que salen de esos autos.
- id: 751
  category: defensive_driving
  question: ¿Qué debe hacer con respecto a sus faros cuando ve a un ciclista que se
    aproxima en sentido contrario por la noche?
  choices:
    A: Usar sus luces altas para poder verlo claramente.
    B: Tocar la bocina continuamente para hacerle saber que usted está ahí.
    C: No usar las luces altas.
    D: Parpadear sus luces altas repetidamente para advertirle.
  answer: C
  explanation: Por la noche, no use las luces altas cuando vea a un ciclista que se
    aproxima en sentido contrario.
- id: 752
  category: sharing_the_road
  question: ¿Por qué es peligroso para un ciclista circular en contra del flujo del
    tráfico?
  choices:
    A: Hace que el ciclista viaje demasiado rápido.
    B: Puede causar que el ciclista no vea los dispositivos de control de tráfico,
      como las señales de tránsito y los semáforos.
    C: Es ilegal que los vehículos rebasen a un ciclista que circula en contra del
      tráfico.
    D: Causa que las llantas de la bicicleta se desgasten de manera desigual.
  answer: B
  explanation: Circule por el lado derecho, con el flujo del tráfico. Circular en
    contra del tráfico puede causar que no vea los dispositivos de control de tráfico,
    como las señales de tránsito y los semáforos.
- id: 753
  category: defensive_driving
  question: ¿Por qué un ciclista nunca debe meterse entre un camión grande o autobús
    y el borde de la acera?
  choices:
    A: El conductor del camión o autobús podría pedirle indicaciones.
    B: El ciclista podría pinchar una llanta por los escombros cerca del borde de
      la acera.
    C: Los camiones y autobuses hacen giros amplios a la derecha, y el ciclista podría
      ser aplastado.
    D: El ciclista se verá obligado a circular por la acera.
  answer: C
  explanation: Los camiones y autobuses hacen giros amplios a la derecha. Nunca se
    meta entre un camión o autobús y el borde de la acera o podría ser aplastado.
- id: 754
  category: sharing_the_road
  question: ¿Qué es la "No-Zone" (zona ciega) en relación con los camiones grandes?
  choices:
    A: Un área de estacionamiento designada solo para camiones.
    B: Puntos ciegos en la parte delantera, trasera y en los lados del camión donde
      el conductor no puede verlo.
    C: Una zona donde no se permite que circulen los camiones.
    D: El área inmediatamente frente a un camión donde los ciclistas tienen el derecho
      de paso.
  answer: B
  explanation: Los camiones grandes tienen puntos ciegos en la parte delantera, trasera
    y en los lados, lo que dificulta que el conductor vea a su alrededor. Estas áreas
    se conocen como la "No-Zone".
- id: 755
  category: sharing_the_road
  question: ¿Qué indica a los conductores un banderín rojo o naranja en la antena
    de una bicicleta?
  choices:
    A: El ciclista es un niño.
    B: El ciclista transporta materiales peligrosos.
    C: El ciclista tiene problemas de audición.
    D: El ciclista es un principiante.
  answer: C
  explanation: 'Si ve a un ciclista con un banderín rojo o naranja en la antena sujeta
    a la bicicleta, disminuya la velocidad: este es un símbolo común para indicar
    que el ciclista tiene problemas de audición.'
- id: 756
  category: sharing_the_road
  question: Según las investigaciones, ¿qué causa dos tercios de las colisiones entre
    automóviles y motocicletas?
  choices:
    A: El motociclista conduciendo a exceso de velocidad o de manera agresiva.
    B: El conductor del automóvil girando frente a la motocicleta.
    C: Peatones cruzando la calle ilegalmente.
    D: Camiones grandes cambiando de carril sin usar las direccionales.
  answer: B
  explanation: Las investigaciones muestran que dos tercios de las colisiones entre
    automóviles y motocicletas no son causadas por el motociclista, sino por el conductor
    del automóvil que giró frente a la motocicleta.
- id: 757
  category: sharing_the_road
  question: 'Al conducir junto a una motocicleta en el mismo carril, usted debe:'
  choices:
    A: Compartir el carril con la motocicleta para mejorar el flujo del tráfico.
    B: Tocar la bocina para hacerle saber que lo está rebasando.
    C: Nunca intentar compartir el carril con una motocicleta.
    D: Forzar a la motocicleta hacia el borde del carril.
  answer: C
  explanation: Las motocicletas tienen derecho a usar el carril completo. Nunca debe
    intentar compartir un carril con una motocicleta, y siempre debe respetar el espacio
    y la posición de la motocicleta en el tráfico.
- id: 758
  category: safe_driving_rules
  question: ¿Cuál es la distancia mínima de seguimiento recomendada que un conductor
    debe dejar al ir detrás de una motocicleta?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Cuatro segundos
    D: Cinco segundos
  answer: B
  explanation: Deje al menos una distancia de seguimiento de dos segundos, para que
    el motociclista tenga suficiente tiempo para maniobrar o detenerse en caso de
    emergencia.
- id: 759
  category: sharing_the_road
  question: ¿Por qué debe evitar rebasar a una motocicleta demasiado cerca o demasiado
    rápido?
  choices:
    A: La motocicleta podría intentar competir en una carrera con usted.
    B: La ráfaga de aire puede hacer que la motocicleta pierda el control.
    C: El motociclista podría no escuchar su motor.
    D: Es ilegal rebasar a una motocicleta en una autopista de varios carriles.
  answer: B
  explanation: Rebase como lo haría con un automóvil, y no rebase demasiado cerca
    ni demasiado rápido, ya que la ráfaga de aire puede hacer que la motocicleta pierda
    el control.
- id: 760
  category: defensive_driving
  question: ¿Cómo podría reaccionar un motociclista al cruzar un paso a nivel de ferrocarril?
  choices:
    A: Acelerar para cruzar lo más rápido posible.
    B: Detenerse por completo y cruzar caminando con la motocicleta.
    C: Disminuir la velocidad y posiblemente zigzaguear para cruzar las vías.
    D: Conducir por el acotamiento para evitar las vías por completo.
  answer: C
  explanation: Los pasos a nivel de ferrocarril son un peligro particular para los
    motociclistas, y generalmente harán que disminuyan la velocidad y posiblemente
    zigzagueen para cruzar las vías.
- id: 761
  category: sharing_the_road
  question: ¿Qué debe esperar un conductor que haga un motociclista experimentado
    al pasar por un puente de metal o con rejillas?
  choices:
    A: Acelerar rápidamente para minimizar el tiempo en el puente.
    B: Moverse al arcén del puente.
    C: Reducir la velocidad y moverse al centro del carril.
    D: Ponerse de pie sobre los estribos y zigzaguear.
  answer: C
  explanation: Los puentes de metal o con rejillas hacen que una motocicleta se tambalee
    mucho más que un automóvil. Un motociclista experimentado reduce la velocidad
    y se mueve al centro del carril para tener espacio para manejar la superficie
    irregular.
- id: 762
  category: vehicle_information
  question: ¿Cuál es el equipo más importante que puede usar un motociclista al conducir?
  choices:
    A: Guantes de cuero
    B: Un casco aprobado por el Departamento de Transporte (DOT)
    C: Botas con punta de acero
    D: Una chaqueta reflectante
  answer: B
  explanation: Los cascos son el equipo más importante que puede usar al conducir
    su motocicleta. Tenga cuidado con los cascos que no cumplen con los estándares
    del Departamento de Transporte de los EE. UU. (DOT).
- id: 763
  category: sharing_the_road
  question: ¿Dónde se encuentran los puntos ciegos, o "Zonas prohibidas" (No-Zones),
    en un camión grande?
  choices:
    A: Solo directamente detrás del camión.
    B: Solo en el lado derecho del camión.
    C: En la parte delantera, trasera y en ambos lados del camión.
    D: Solo directamente frente al camión.
  answer: C
  explanation: Los camiones tienen grandes "Zonas prohibidas" (No-Zones) en ambos
    lados, en la parte delantera y detrás del camión. Los conductores de camiones
    no pueden verlo cuando usted conduce en estos puntos ciegos.
- id: 764
  category: safe_driving_rules
  question: Al rebasar a un camión grande, ¿cuándo es seguro volver a incorporarse
    delante de él?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del camión.
    B: Cuando pueda ver la parte delantera del camión en su espejo retrovisor.
    C: Cuando el conductor del camión toque la bocina.
    D: Cuando esté exactamente a la distancia de un automóvil por delante del camión.
  answer: B
  explanation: Al rebasar, busque la parte delantera del camión en su espejo retrovisor
    antes de incorporarse delante y evite frenar.
- id: 765
  category: driver_responsibility
  question: En los choques que involucran camiones grandes y automóviles, ¿qué porcentaje
    de las muertes sufren los ocupantes del automóvil?
  choices:
    A: 25 por ciento
    B: 50 por ciento
    C: 78 por ciento
    D: 95 por ciento
  answer: C
  explanation: En los choques que involucran camiones grandes, los ocupantes de un
    automóvil, generalmente el conductor, sufren el 78 por ciento de las muertes.
- id: 766
  category: defensive_driving
  question: ¿Por qué el punto ciego delantero de un camión grande es particularmente
    peligroso para un motociclista?
  choices:
    A: Las motocicletas aceleran mucho más lento que los camiones.
    B: Las motocicletas pueden detenerse mucho más rápido que los camiones, y es posible
      que el camión no pueda detenerse a tiempo.
    C: Los faros del camión cegarán al motociclista.
    D: Los gases de escape del camión pueden abrumar al motociclista.
  answer: B
  explanation: El punto ciego delantero es particularmente peligroso si necesita detenerse
    rápidamente. Debido a su peso ligero y sistema de frenado, las motocicletas pueden
    detenerse mucho más rápido que los camiones. Es posible que un camión no pueda
    detenerse tan rápido como usted.
- id: 767
  category: sharing_the_road
  question: ¿Por qué los niños que andan en bicicleta crean problemas especiales para
    los conductores?
  choices:
    A: No son capaces de tener un buen juicio para determinar las condiciones del
      tráfico.
    B: Siempre conducen más rápido que el límite de velocidad.
    C: Se les exige que conduzcan por el lado izquierdo de la carretera.
    D: Usan señales con las manos que son difíciles de entender.
  answer: A
  explanation: Los niños no son capaces de tener un buen juicio para determinar las
    condiciones del tráfico, por lo tanto, los conductores deben estar alerta a la
    posibilidad de movimientos erráticos y cambios repentinos de dirección cuando
    hay niños en bicicleta presentes.
- id: 768
  category: sharing_the_road
  question: ¿Por qué los conductores a menudo no ven a los motociclistas en la carretera?
  choices:
    A: Las motocicletas están pintadas de colores que se camuflan con la carretera.
    B: Los conductores tienden a buscar otros automóviles y camiones, y el perfil
      estrecho de la motocicleta hace que sea más difícil de ver.
    C: Las motocicletas generalmente se conducen por debajo del límite de velocidad.
    D: A los motociclistas no se les exige usar faros durante el día.
  answer: B
  explanation: Los conductores tienden a buscar otros automóviles y camiones, no motocicletas.
    El perfil de una motocicleta es estrecho y la carrocería es corta, lo que hace
    que sea más difícil de ver y dificulta que un conductor calcule la distancia y
    la velocidad de la motocicleta.
- id: 769
  category: defensive_driving
  question: ¿Qué hace que los ciclistas sean especialmente difíciles de ver por la
    noche?
  choices:
    A: No se les permite usar reflectores.
    B: Conducen exclusivamente en el medio del carril por la noche.
    C: Las luces del tráfico que se aproxima pueden hacer que sean aún más difíciles
      de ver.
    D: Viajan mucho más rápido por la noche que durante el día.
  answer: C
  explanation: Los ciclistas que conducen de noche presentan problemas de visibilidad
    para los conductores... Las luces del tráfico que se aproxima pueden hacer que
    sean aún más difíciles de ver por la noche.
- id: 770
  category: sharing_the_road
  question: Según el manual, ¿cuánto tarda en detenerse un camión que viaja a 55 MPH
    en comparación con un automóvil?
  choices:
    A: Un camión se detiene en 240 pies, igual que un automóvil.
    B: Un camión necesita unos 300 pies para detenerse.
    C: Un camión necesita unos 450+ pies para detenerse.
    D: Un camión necesita más de 600 pies para detenerse.
  answer: C
  explanation: Un automóvil que viaja a 55 MPH puede detenerse en 240 pies; sin embargo,
    un camión que viaja a la misma velocidad de 55 MPH necesita unos 450+ pies para
    detenerse.
- id: 771
  category: sharing_the_road
  question: ¿Cuál es una regla general crucial que debe recordar con respecto a los
    puntos ciegos de un camión grande?
  choices:
    A: Si está a menos de 50 pies del camión, se encuentra en un punto ciego.
    B: Si no puede ver al conductor del camión en el espejo del camión, el conductor
      del camión no puede verlo a usted.
    C: Los camiones solo tienen puntos ciegos en su lado derecho.
    D: Toque la bocina para asegurarse de que el conductor sepa que usted está en
      su punto ciego.
  answer: B
  explanation: 'El manual indica: "si no puede ver al conductor del camión en el espejo
    del camión, el conductor del camión no puede verlo a usted".'
- id: 772
  category: defensive_driving
  question: ¿Por qué es peligroso intentar meterse entre un camión grande y el borde
    de la acera cuando el camión está girando?
  choices:
    A: El camión puede acelerar repentinamente y golpear su vehículo.
    B: Los camiones a menudo se abren hacia la izquierda para realizar un giro a la
      derecha de manera segura, creando una peligrosa situación de encierro ("squeeze").
    C: El escape del camión está dirigido hacia el borde de la acera y puede oscurecer
      su visión.
    D: Es ilegal rebasar a un camión por la derecha bajo cualquier circunstancia.
  answer: B
  explanation: Los conductores de camiones a veces necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha de manera segura. Meterse entre el camión y
    el borde de la acera aumenta la posibilidad de un choque al quedar atrapado en
    un "encierro" (squeeze).
- id: 773
  category: vehicle_information
  question: ¿Hasta cuánto puede pesar una combinación típica de camión con remolque
    (tractor-trailer) completamente cargada?
  choices:
    A: 40,000 libras
    B: 60,000 libras
    C: 80,000 libras
    D: 100,000 libras
  answer: C
  explanation: Una combinación típica de camión con remolque (un semirremolque cargado,
    articulado y remolcado por un tractocamión) puede pesar hasta 80,000 libras o
    40 toneladas.
- id: 774
  category: defensive_driving
  question: ¿Qué debe hacer si se detiene detrás de un camión en una pendiente ascendente?
  choices:
    A: Manténgase a la derecha en su carril y toque la bocina.
    B: Manténgase a la izquierda en su carril para que el conductor pueda verlo y
      deje espacio adicional.
    C: Acérquese lo más posible al parachoques del camión para evitar que ruede hacia
      atrás.
    D: Ponga su vehículo en punto muerto (neutral) y aplique el freno de estacionamiento.
  answer: B
  explanation: Si se detiene detrás de un camión en una pendiente ascendente, manténgase
    a la izquierda en su carril para que el conductor pueda verlo. Deje espacio adicional
    frente a su automóvil en caso de que el camión ruede hacia atrás.
- id: 775
  category: sharing_the_road
  question: ¿Qué significa si un conductor de camión parpadea (hace luces con) los
    faros de su vehículo después de que usted lo rebasa?
  choices:
    A: Le está advirtiendo sobre un oficial de policía o un peligro más adelante.
    B: Le está indicando que tiene espacio libre para volver a meterse delante de
      su vehículo.
    C: Está enojado porque lo rebasó demasiado cerca.
    D: Sus faros están fallando y usted debe acelerar.
  answer: B
  explanation: Si el conductor del camión o autobús parpadea los faros de su vehículo
    después de que usted lo rebasa, es una señal de que tiene espacio libre para volver
    a meterse delante de su vehículo.
- id: 776
  category: vehicle_information
  question: ¿Qué tan lejos hacia atrás puede extenderse el punto ciego de un camión
    grande?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 150 pies
    D: Hasta 200 pies
  answer: D
  explanation: Los puntos ciegos de un camión están inmediatamente en la parte delantera,
    a ambos lados del vehículo y hasta 200 pies en la parte trasera.
- id: 777
  category: vehicle_information
  question: Si un tractocamión tiene un capó largo, ¿cuántos pies por delante del
    parachoques es posible que el camionero no pueda ver?
  choices:
    A: 5-10 pies
    B: 10-20 pies
    C: 20-30 pies
    D: 30-40 pies
  answer: B
  explanation: Si el tractocamión tiene un capó largo, es posible que el camionero
    no pueda ver los primeros 10 a 20 pies frente al parachoques, espacio suficiente
    para que una motocicleta o un automóvil se deslice sin ser notado hacia una posición
    peligrosa.
- id: 778
  category: sharing_the_road
  question: ¿Qué debe hacer al conducir cerca de una estación de pesaje de vehículos
    comerciales?
  choices:
    A: Acelerar para pasar la estación lo más rápido posible.
    B: Evitar conducir en el carril derecho para que los camiones que se mueven lentamente
      puedan reincorporarse fácilmente a la carretera.
    C: Moverse al carril derecho para seguir de cerca a los camiones.
    D: Encender las luces altas a los camiones que se incorporan para advertirles
      de su presencia.
  answer: B
  explanation: Cuando esté cerca de una estación de pesaje de vehículos comerciales,
    evite conducir en el carril derecho para que los camiones que se mueven lentamente
    puedan reincorporarse fácilmente a la carretera.
- id: 779
  category: safe_driving_rules
  question: ¿Por qué es importante bajar las luces de sus faros por la noche al conducir
    cerca de camiones grandes?
  choices:
    A: Las luces altas pueden agotar la batería de su vehículo más rápido.
    B: Las luces altas reflejadas en los espejos del camión pueden cegar al conductor.
    C: Los conductores de camiones usan gafas de visión nocturna que son sensibles
      a la luz.
    D: Ayuda al conductor del camión a ver mejor las líneas de la carretera.
  answer: B
  explanation: Baje las luces por la noche. Las luces altas reflejadas en los espejos
    pueden cegar al conductor.
- id: 780
  category: defensive_driving
  question: ¿Por qué nunca debe subestimar la velocidad de un camión grande o autobús
    que se aproxima?
  choices:
    A: Siempre exceden el límite de velocidad publicado.
    B: Debido a su gran tamaño, a menudo parecen viajar más lentamente que su velocidad
      real.
    C: Tienen motores especiales que les permiten acelerar silenciosamente.
    D: Sus velocímetros a menudo son inexactos por hasta 10 MPH.
  answer: B
  explanation: Nunca subestime el tamaño y la velocidad de los camiones y autobuses
    que se aproximan. Debido a su gran tamaño, a menudo parecen viajar más lentamente
    que su velocidad real.
- id: 781
  category: driver_responsibility
  question: Según el manual, ¿cuál es la cosa más importante que puede hacer para
    salvar su vida, especialmente en un choque con un camión grande?
  choices:
    A: Desviarse hacia la zanja para evitar el impacto.
    B: Usar su cinturón de seguridad.
    C: Tocar la bocina continuamente antes del impacto.
    D: Sujetarse firmemente contra el volante.
  answer: B
  explanation: Usar el cinturón de seguridad es la cosa más importante que puede hacer
    para salvar su vida, especialmente en un choque con un camión grande. Evita que
    golpee el volante, sea arrojado por el interior del vehículo o salga expulsado.
- id: 782
  category: sharing_the_road
  question: ¿Qué debe anticipar al rebasar a un camión grande en una pendiente cuesta
    abajo?
  choices:
    A: Es probable que el camión pierda velocidad debido al freno del motor.
    B: El camión viajará más rápido debido a su peso, y es posible que usted deba
      aumentar su velocidad para rebasarlo.
    C: El camión se hará a un lado hacia el acotamiento para dejarle pasar.
    D: El conductor del camión aplicará el freno de emergencia para mantener una velocidad
      lenta.
  answer: B
  explanation: Debido a su peso, los camiones viajan más rápido cuesta abajo y es
    posible que deba aumentar su velocidad para rebasar a un camión en una pendiente
    descendente.
- id: 783
  category: defensive_driving
  question: ¿Por qué debe evitar conducir directamente detrás de un camión o autobús
    y, en su lugar, mantener una distancia razonable?
  choices:
    A: Para evitar respirar gases de escape nocivos.
    B: Para tener una mejor vista de la carretera y anticipar problemas, así como
      espacio para una "salida" de emergencia.
    C: Porque seguir de cerca (drafting) a un vehículo comercial es ilegal en Tennessee.
    D: Para evitar que las llantas del camión arrojen piedras a su parabrisas.
  answer: B
  explanation: Mantenga una distancia razonable entre su vehículo y el vehículo grande
    de adelante. Esto le brinda una mejor vista de la carretera para anticipar problemas
    y le dará espacio para una "salida" de emergencia.
- id: 784
  category: sharing_the_road
  question: Al rebasar a un camión en una pendiente cuesta abajo, ¿cuál es la acción
    más segura?
  choices:
    A: Reducir la velocidad para igualar la del camión antes de rebasar.
    B: Completar el rebase lo más rápido posible y mantener su velocidad.
    C: Mantenerse al lado del camión para evitar que acelere.
    D: Rebasar al camión y frenar inmediatamente para controlar su velocidad.
  answer: B
  explanation: Debido a su peso, los camiones viajan más rápido cuesta abajo. Debe
    completar su rebase lo más rápido posible, no quedarse al lado del camión y mantener
    su velocidad después de rebasar sin reducirla.
- id: 785
  category: sharing_the_road
  question: Al encontrarse con un camión o autobús que viene en dirección opuesta,
    ¿cómo afecta la turbulencia del viento a los vehículos?
  choices:
    A: Succiona a los vehículos acercándolos.
    B: Empuja a los vehículos separándolos.
    C: Jala al vehículo más pequeño debajo del camión.
    D: No tiene ningún efecto sobre los vehículos.
  answer: B
  explanation: Al encontrarse con un camión o autobús en dirección opuesta, la turbulencia
    del viento entre los vehículos los EMPUJA SEPARÁNDOLOS; NO los succiona acercándolos.
- id: 786
  category: sharing_the_road
  question: ¿Por qué debe evitar moverse hacia el espacio abierto en el lado derecho
    de un camión que está dando una vuelta a la derecha?
  choices:
    A: El conductor del camión se está preparando para retroceder hacia ese espacio.
    B: El camión podría transportar materiales peligrosos que podrían derramarse.
    C: Es posible que el conductor del camión no lo vea y su automóvil podría ser
      aplastado o golpeado lateralmente.
    D: El camión acelerará rápidamente durante la vuelta.
  answer: C
  explanation: Los camiones hacen vueltas amplias a la derecha y a menudo dejan un
    espacio abierto a la derecha. Si usted está entre el camión y el borde de la acera,
    es posible que el conductor no pueda verlo y su automóvil podría ser aplastado
    o golpeado lateralmente por el remolque.
- id: 787
  category: safe_driving_rules
  question: ¿Cuál es el propósito de las rampas de escape para camiones (runaway truck
    ramps)?
  choices:
    A: Proporcionar un área de descanso para conductores comerciales cansados.
    B: Permitir que los camiones carguen y descarguen mercancía de manera segura.
    C: Detener camiones o autobuses fuera de control que bajan por pendientes pronunciadas.
    D: Pesar los camiones antes de que entren a la autopista.
  answer: C
  explanation: Las rampas de escape para camiones están diseñadas para detener camiones
    o autobuses fuera de control que bajan por pendientes pronunciadas. Los vehículos
    nunca deben detenerse ni estacionarse en estas áreas.
- id: 788
  category: sharing_the_road
  question: ¿Aproximadamente hasta qué distancia se extiende la "ZONA CIEGA" (NO-ZONE)
    delantera directamente frente a un vehículo grande?
  choices:
    A: 10 pies
    B: 20 pies
    C: 50 pies
    D: 100 pies
  answer: B
  explanation: El área de aproximadamente hasta 20 pies directamente frente a un vehículo
    grande se considera una ZONA CIEGA (NO-ZONE), donde meterse demasiado pronto puede
    causar un choque.
- id: 789
  category: sharing_the_road
  question: ¿A qué distancia mínima deben mantenerse los niños de un autobús escolar
    para permanecer fuera de la Zona de Peligro?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: B
  explanation: La Zona de Peligro es el área en todos los lados del autobús donde
    los niños corren mayor peligro. Los niños deben mantenerse a diez pies de distancia
    del autobús escolar y NUNCA pasar por detrás de él.
- id: 790
  category: safe_driving_rules
  question: Según el manual, ¿cuándo corren los niños el mayor riesgo de resultar
    heridos en relación con los autobuses escolares?
  choices:
    A: Mientras viajan dentro del autobús en la autopista.
    B: Cuando el autobús está involucrado en un choque por detrás.
    C: Fuera del autobús cuando están subiendo o bajando.
    D: Al sentarse en la primera fila del autobús.
  answer: C
  explanation: La realidad de la seguridad de los autobuses escolares es que más niños
    resultan heridos fuera de un autobús que dentro de él. Los niños corren el mayor
    riesgo cuando suben o bajan del autobús escolar.
- id: 791
  category: signs_and_signals
  question: ¿Cómo es el emblema de 'vehículo de movimiento lento'?
  choices:
    A: Una señal amarilla en forma de diamante con letras negras.
    B: Un triángulo naranja fluorescente o reflectante.
    C: Un octágono rojo con borde blanco.
    D: Un rectángulo blanco con el símbolo de un tractor negro.
  answer: B
  explanation: El emblema de 'vehículo de movimiento lento' es un triángulo naranja
    fluorescente o reflectante que debe mostrarse en la parte trasera de los vehículos
    tirados por animales, y en la mayoría de los vehículos agrícolas y equipos de
    construcción.
- id: 792
  category: sharing_the_road
  question: Debido a que la maquinaria agrícola generalmente no tiene luces direccionales,
    ¿cómo podría prepararse un operador para hacer un giro a la derecha?
  choices:
    A: Parpadeando sus faros delanteros tres veces.
    B: Abriéndose hacia la izquierda primero, para luego girar a la derecha.
    C: Deteniéndose por completo y haciendo señas al tráfico para que pase.
    D: Conduciendo por el arcén derecho antes de girar.
  answer: B
  explanation: La maquinaria agrícola generalmente no tiene luces direccionales y,
    para hacer un giro a la derecha, los operadores de maquinaria agrícola pueden
    abrirse primero hacia la izquierda y luego girar a la derecha.
- id: 793
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es cierta sobre los vehículos tirados
    por animales en las carreteras de Tennessee?
  choices:
    A: Solo se permiten en caminos rurales sin pavimentar.
    B: Deben ceder el derecho de paso a todos los vehículos de motor.
    C: Tienen los mismos derechos de usar la vía que un vehículo de motor.
    D: No están obligados a seguir las reglas de tránsito estándar.
  answer: C
  explanation: Los vehículos tirados por animales tienen los mismos derechos de usar
    la vía que un vehículo de motor y deben seguir las mismas reglas de tránsito.
- id: 794
  category: defensive_driving
  question: Si va detrás de un camión bajando una colina empinada y nota que las ruedas
    echan humo o que va a alta velocidad, ¿qué debe hacer?
  choices:
    A: Acelerar y rebasar al camión inmediatamente.
    B: Tocar la bocina para alertar al conductor.
    C: Quedarse atrás y NO rebasar.
    D: Hacerse a un lado en el arcén izquierdo y detenerse.
  answer: C
  explanation: Las ruedas que echan humo o una alta velocidad pueden ser señal de
    pérdida de frenos en un vehículo pesado. Si se encuentra en esta situación, quédese
    atrás y NO rebase.
- id: 795
  category: sharing_the_road
  question: ¿Por qué debe evitar conducir demasiado cerca de camiones que transportan
    materiales peligrosos?
  choices:
    A: Hacen paradas frecuentes, como en los cruces de ferrocarril.
    B: Viajan mucho más rápido que los camiones comerciales estándar.
    C: Crean más turbulencia de viento que otros camiones.
    D: No están equipados con luces de freno estándar.
  answer: A
  explanation: No conduzca demasiado cerca de camiones que transportan materiales
    peligrosos, ya que hacen paradas frecuentes, como en los cruces de ferrocarril.
- id: 796
  category: sharing_the_road
  question: ¿Qué debe hacer cuando un camión o autobús lo está rebasando?
  choices:
    A: Acelerar para salir del punto ciego del camión.
    B: Moverse al centro de su carril y mantener la velocidad.
    C: Mantenerse en el lado más alejado de su carril y reducir ligeramente su velocidad.
    D: Parpadear las luces altas para advertir al conductor del camión.
  answer: C
  explanation: Cuando un camión lo rebase, puede ayudar al conductor manteniéndose
    en el lado más alejado de su carril y reduciendo ligeramente su velocidad. NUNCA
    ACELERE MIENTRAS UN CAMIÓN O AUTOBÚS LO ESTÁ REBASANDO.
- id: 797
  category: safe_driving_rules
  question: 'En muchos sistemas escolares, a los niños se les enseña a escapar de
    la zona de peligro del autobús escolar dando:'
  choices:
    A: Tres pasos pequeños alejándose del autobús.
    B: Cinco pasos gigantes tan pronto como bajan del autobús.
    C: Diez pasos normales hacia la parte trasera del autobús.
    D: Dos pasos gigantes hacia la parte delantera del autobús.
  answer: B
  explanation: En muchos sistemas escolares, a los niños se les enseña a escapar de
    la zona de peligro dando cinco pasos gigantes tan pronto como bajan del autobús.
- id: 798
  category: sharing_the_road
  question: 'En la mayoría de los casos, la maquinaria agrícola grande en las carreteras
    rurales viajará a velocidades inferiores a:'
  choices:
    A: 15 M.P.H.
    B: 25 M.P.H.
    C: 35 M.P.H.
    D: 45 M.P.H.
  answer: B
  explanation: En la mayoría de los casos, los vehículos de maquinaria agrícola viajarán
    a menos de 25 M.P.H.
- id: 799
  category: sharing_the_road
  question: ¿Qué debe evitar hacer al acercarse o rebasar a un jinete a caballo?
  choices:
    A: Reducir la velocidad
    B: Tocar la bocina o acelerar el motor ruidosamente
    C: Dejar una distancia razonable
    D: Rebasar por la izquierda
  answer: B
  explanation: 'El manual indica: ''NO toque la bocina ni "acelere" el motor ruidosamente
    al acercarse o rebasar a un caballo''.'
- id: 800
  category: vehicle_information
  question: ¿Cuál es el rango de velocidad normal para los vehículos de movimiento
    lento?
  choices:
    A: 15 a 30 mph
    B: 5 a 20 mph
    C: 10 a 25 mph
    D: 20 a 40 mph
  answer: B
  explanation: Según el manual, 'Las velocidades normales para los vehículos de movimiento
    lento pueden oscilar entre 5 y 20 mph'.
- id: 801
  category: safe_driving_rules
  question: Cuando se requieren luces en vehículos de movimiento lento, ¿hasta qué
    distancia hacia atrás es normalmente visible la lámpara roja autoluminosa?
  choices:
    A: 100 pies
    B: 250 pies
    C: 500 pies
    D: 1000 pies
  answer: C
  explanation: El manual indica que una lámpara roja autoluminosa en la parte trasera
    de un vehículo de movimiento lento es normalmente visible desde 500 pies hacia
    atrás.
- id: 802
  category: safe_driving_rules
  question: ¿Qué carril debe usar el tráfico más lento?
  choices:
    A: El carril izquierdo
    B: El carril central
    C: El carril derecho
    D: Cualquier carril siempre y cuando mantengan una velocidad constante
  answer: C
  explanation: 'El manual dicta: ''El tráfico más lento debe conducir en el carril
    derecho. El carril izquierdo es para rebasar y girar''.'
- id: 803
  category: signs_and_signals
  question: ¿De qué color es el fondo de todas las señales temporales en las zonas
    de trabajo?
  choices:
    A: Amarillo
    B: Rojo
    C: Naranja
    D: Blanco
  answer: C
  explanation: 'El manual indica: ''Todas las señales temporales en las zonas de trabajo
    tienen un fondo naranja y letras o símbolos negros''.'
- id: 804
  category: penalties_and_points
  question: ¿Cuál es la multa máxima por una infracción de velocidad en una zona de
    trabajo donde la velocidad se ha reducido y hay trabajadores presentes?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1000
  answer: C
  explanation: Según la ley de Tennessee, las infracciones de velocidad en zonas de
    trabajo con velocidades reducidas y trabajadores presentes resultarán en una multa
    de hasta un máximo de $500.
- id: 805
  category: defensive_driving
  question: ¿Qué distancia recorre en un segundo un automóvil que viaja a 60 M.P.H.?
  choices:
    A: 44 pies
    B: 60 pies
    C: 88 pies
    D: 120 pies
  answer: C
  explanation: 'El manual señala: ''Un automóvil que viaja a 60 M.P.H. recorre 88
    pies por segundo''.'
- id: 806
  category: defensive_driving
  question: ¿Cuál es el tipo de accidente más común en una zona de trabajo?
  choices:
    A: Colisiones frontales
    B: Colisiones por alcance
    C: Choques laterales
    D: Vuelcos
  answer: B
  explanation: El manual advierte a los conductores que no sigan muy de cerca a otros
    vehículos porque 'La mayoría de los accidentes en zonas de trabajo son causados
    por colisiones por alcance'.
- id: 807
  category: sharing_the_road
  question: ¿Qué distancia necesita para detenerse un tren que viaja a 55 millas por
    hora?
  choices:
    A: Un cuarto de milla
    B: Media milla
    C: Una milla completa
    D: Dos millas
  answer: C
  explanation: Según el manual, 'Un tren que viaja a 55 millas por hora necesita una
    milla completa para detenerse'.
- id: 808
  category: defensive_driving
  question: ¿Cuántas veces más probabilidades tiene de morir en una colisión con un
    tren en comparación con una colisión con un automóvil?
  choices:
    A: 5 veces más probable
    B: 10 veces más probable
    C: 20 veces más probable
    D: 30 veces más probable
  answer: D
  explanation: 'El manual indica: ''Usted tiene 30 veces más probabilidades de morir
    en una colisión con un tren que con un automóvil o incluso con un camión grande
    o un autobús''.'
- id: 809
  category: sharing_the_road
  question: ¿Dónde ocurren la mayoría de las colisiones de trenes con automóviles?
  choices:
    A: A menos de 25 millas de la casa del conductor
    B: En caminos de tierra rurales y sin señalizar
    C: De noche en áreas mal iluminadas
    D: A más de 100 millas de la casa del conductor
  answer: A
  explanation: El manual explica que 'La mayoría de las colisiones ocurren a menos
    de 25 millas de la casa del conductor, lo que sugiere que los conductores SABÍAN
    que las vías estaban allí...'.
- id: 810
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso cuando un automóvil y un tren se acercan
    a un cruce?
  choices:
    A: El vehículo que llegue primero
    B: El tren SIEMPRE tiene el derecho de paso
    C: El automóvil, si viaja a velocidades de autopista
    D: El tren, pero solo si las luces de advertencia están parpadeando
  answer: B
  explanation: 'El manual establece explícitamente: ''Los conductores SIEMPRE deben
    ceder el derecho de paso a los trenes porque ES LA LEY''.'
- id: 811
  category: sharing_the_road
  question: ¿De qué color será normalmente la ropa que usarán los trabajadores en
    una zona de trabajo para asegurarse de ser muy visibles?
  choices:
    A: Naranja brillante
    B: Amarillo-verde brillante
    C: Blanco reflectante
    D: Rosa neón
  answer: B
  explanation: 'El manual indica: "En estas zonas de trabajo, los trabajadores normalmente
    usarán ropa de color amarillo-verde brillante, como camisas, chalecos o cascos,
    para asegurarse de ser muy visibles".'
- id: 812
  category: sharing_the_road
  question: ¿Cómo deben posicionarse los jinetes a caballo cuando circulan por la
    carretera?
  choices:
    A: Dos en fondo en el carril derecho
    B: En fila india cerca del bordillo derecho o del borde de la carretera
    C: En fila india cerca de la línea central
    D: En el arcén izquierdo de frente al tráfico
  answer: B
  explanation: El manual exige que los jinetes a caballo "deben cabalgar en fila india
    cerca del bordillo derecho o del borde de la carretera, o en un arcén, carril
    o sendero derecho utilizable".
- id: 813
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril equipado con dispositivos de señales
    eléctricas o mecánicas, ¿dónde debe detener su vehículo por completo?
  choices:
    A: A no más de 100 pies, pero a no menos de 25 pies del riel más cercano.
    B: A no más de 50 pies, pero a no menos de 15 pies del riel más cercano.
    C: A no más de 30 pies, pero a no menos de 10 pies del riel más cercano.
    D: Exactamente a 20 pies del riel más cercano.
  answer: B
  explanation: El manual establece que los cruces de ferrocarril equipados con dispositivos
    de señales eléctricas o mecánicas requieren que el conductor detenga el vehículo
    por completo a no más de 50 pies, y a no menos de 15 pies del riel más cercano.
- id: 814
  category: defensive_driving
  question: Si su vehículo se detiene en las vías del tren y se acerca un tren, ¿en
    qué dirección debe correr después de salir del vehículo?
  choices:
    A: En la misma dirección en la que viaja el tren.
    B: Directamente lejos de las vías en un ángulo de 90 grados.
    C: Hacia el tren en un ángulo de 45 grados.
    D: Paralelo a las vías en la dirección opuesta al tren.
  answer: C
  explanation: Según el manual, si se acerca un tren, debe correr hacia el tren en
    un ángulo de 45 grados para estar lejos y detrás del punto de impacto.
- id: 815
  category: defensive_driving
  question: ¿Por qué debe correr hacia un tren que se aproxima en un ángulo de 45
    grados si su vehículo se detiene en las vías?
  choices:
    A: Para hacerle señales al maquinista del tren para que se detenga.
    B: Para tener una mejor vista de la velocidad del tren.
    C: Para llegar más rápido a la señal del Sistema de Notificación de Emergencias
      (ENS).
    D: Para estar lejos y detrás del punto de impacto y así evitar lesiones por escombros
      voladores.
  answer: D
  explanation: El manual explica que correr hacia el tren en un ángulo de 45 grados
    le permite estar lejos y detrás del punto de impacto, evitando lesiones por escombros
    voladores.
- id: 816
  category: safe_driving_rules
  question: ¿Qué debe hacer si ya está cruzando las vías del tren y las luces de advertencia
    comienzan a parpadear o las barreras comienzan a bajar?
  choices:
    A: Detenerse inmediatamente y retroceder.
    B: Seguir moviéndose y terminar de cruzar.
    C: Detener su vehículo en las vías y salir inmediatamente.
    D: Poner su vehículo en reversa y retroceder cuidadosamente para salir de las
      vías.
  answer: B
  explanation: 'El manual establece explícitamente: "Si está cruzando las vías y las
    luces de advertencia comienzan a parpadear o las barreras comienzan a bajar, no
    se detenga. ¡SIGA MOVIÉNDOSE!".'
- id: 817
  category: sharing_the_road
  question: ¿Cuáles de los siguientes vehículos están obligados a detenerse en todos
    los cruces de ferrocarril, ya sea que las señales estén activadas o no?
  choices:
    A: Motocicletas y ciclomotores.
    B: Furgonetas de 15 pasajeros y vehículos recreativos.
    C: Autobuses escolares, autobuses de pasajeros y camiones que transportan materiales
      peligrosos.
    D: Grúas y vehículos de emergencia.
  answer: C
  explanation: El manual señala que los autobuses escolares, los autobuses de pasajeros
    y los camiones que transportan materiales peligrosos deben detenerse en todos
    los cruces, ya sea que las señales estén activadas o no.
- id: 818
  category: signs_and_signals
  question: ¿Qué información se proporciona en la señal azul del Sistema de Notificación
    de Emergencias (ENS) en un cruce de ferrocarril?
  choices:
    A: El horario de los trenes y las horas de llegada previstas.
    B: El límite de velocidad para los trenes que pasan por el cruce.
    C: Un número de contacto de emergencia y el número de cruce del Departamento de
      Transporte (DOT).
    D: La distancia hasta la próxima intersección de la carretera.
  answer: C
  explanation: El manual indica que la señal ENS proporciona un número de emergencia
    al que llamar y el número de cruce del DOT para identificar su ubicación si su
    vehículo se detiene en las vías.
- id: 819
  category: license_system
  question: ¿Qué tipo de endoso o licencia especial se requiere para conducir una
    furgoneta de 15 pasajeros en el estado de Tennessee?
  choices:
    A: Una Licencia de Conducir Comercial (CDL).
    B: Una licencia Clase D con un endoso de pasajeros.
    C: Una licencia de chofer.
    D: No se necesitan endosos ni licencias especiales.
  answer: D
  explanation: 'El manual establece: "No se necesitan endosos ni licencias especiales
    para conducir una furgoneta de 15 pasajeros en el estado de Tennessee".'
- id: 820
  category: vehicle_information
  question: Al cargar una furgoneta de 15 pasajeros, ¿por qué los pasajeros deben
    sentarse lo más adelante posible en el vehículo?
  choices:
    A: Para permitir que el conductor los escuche mejor.
    B: Porque el asiento trasero está detrás del eje trasero, lo que empuja el centro
      de gravedad más hacia atrás.
    C: Para dejar los asientos traseros libres para carga pesada y equipaje.
    D: Porque los asientos delanteros están equipados con mejores bolsas de aire.
  answer: B
  explanation: El manual aconseja que los pasajeros se sienten hacia la parte delantera
    porque el asiento trasero está ubicado detrás del eje trasero, lo que causa una
    distribución desigual del peso y empuja el centro de gravedad más hacia atrás.
- id: 821
  category: vehicle_information
  question: En una furgoneta de 15 pasajeros, el inflado insuficiente de los neumáticos
    traseros es una causa principal de ¿qué problema peligroso?
  choices:
    A: Sobrecalentamiento del motor.
    B: Falla en los frenos.
    C: Separación de la banda de rodadura.
    D: Deslizamiento de la transmisión.
  answer: C
  explanation: Según el manual, el inflado insuficiente de los neumáticos traseros
    (especialmente el trasero izquierdo) es una causa principal de la separación de
    la banda de rodadura en las furgonetas de 15 pasajeros.
- id: 822
  category: vehicle_information
  question: ¿Cómo se debe distribuir el peso en un vehículo recreativo (RV) para proporcionar
    un mejor manejo y mantener un centro de gravedad adecuado?
  choices:
    A: Más cerca del techo y principalmente en el lado derecho.
    B: Más cerca del suelo y equitativamente en ambos lados.
    C: Completamente en la parte trasera del vehículo.
    D: Principalmente en la parte delantera cerca del asiento del conductor.
  answer: B
  explanation: El manual indica que distribuir el peso más cerca del suelo y equitativamente
    en ambos lados mantiene bajo el centro de gravedad y proporcionará un mejor manejo
    de su RV.
- id: 823
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es cierta con respecto a los puntos
    ciegos, o "Zonas ciegas" (No-Zones), de un vehículo recreativo (RV)?
  choices:
    A: Los RV no tienen puntos ciegos si los espejos están ajustados correctamente.
    B: Los espejos del RV permiten al conductor ver todo en la carretera.
    C: Los RV tienen grandes puntos ciegos y los espejos no permiten al conductor
      ver todo.
    D: Solo el lado derecho de un RV tiene un punto ciego.
  answer: C
  explanation: El manual advierte que los RV son grandes y tienen muchos puntos ciegos,
    y aunque los espejos son importantes, no permiten al conductor ver todo en la
    carretera.
- id: 824
  category: defensive_driving
  question: Si los neumáticos de una furgoneta de 15 pasajeros se salen de la carretera,
    ¿cuál es la forma más segura de recuperarse y evitar una volcadura?
  choices:
    A: Frenar bruscamente y girar el volante de golpe hacia la carretera.
    B: Acelerar para recuperar la tracción antes de volver a girar.
    C: Disminuir la velocidad gradualmente y volver a girar hacia la carretera cuando
      sea seguro hacerlo.
    D: Cambiar a neutral y dejar que la furgoneta ruede hasta detenerse por completo.
  answer: C
  explanation: El manual aconseja que si los neumáticos de la furgoneta se salen de
    la carretera, debe disminuir la velocidad gradualmente y volver a girar hacia
    la carretera cuando sea seguro hacerlo para evitar una volcadura.
- id: 825
  category: safe_driving_rules
  question: Al esperar en un cruce de ferrocarril con las barreras bajadas, ¿cuándo
    es legal y seguro cruzar las vías?
  choices:
    A: Tan pronto como el tren haya pasado, incluso si las barreras siguen bajadas.
    B: Cuando las barreras comiencen a subir y el tren se pierda de vista.
    C: Solo después de que las barreras estén completamente levantadas y las luces
      hayan dejado de parpadear.
    D: Siempre que pueda ver claramente que no viene ningún otro tren.
  answer: C
  explanation: 'El manual establece: "No cruce las vías hasta que las barreras estén
    completamente levantadas y las luces hayan dejado de parpadear".'
- id: 826
  category: defensive_driving
  question: Al esperar a que pase un tren en un cruce de ferrocarril con más de una
    vía, ¿qué debe hacer antes de cruzar?
  choices:
    A: Avanzar inmediatamente después de que el primer tren despeje el cruce.
    B: Asegurarse de que no se acerque otro tren en la dirección opuesta.
    C: Seguir de cerca al vehículo de adelante para cruzar rápidamente.
    D: Tocar la bocina para alertar a cualquier tren que se acerque.
  answer: B
  explanation: El manual advierte que donde hay más de una vía, un conductor que espera
    a que pase un tren debe asegurarse de que no se acerque otro tren en la dirección
    opuesta antes de cruzar.
- id: 827
  category: vehicle_information
  question: ¿Por qué los conductores de vehículos recreativos (RV) deben dejar más
    espacio entre su vehículo y el vehículo de adelante?
  choices:
    A: Porque los RV son más pesados que los automóviles y requieren una mayor distancia
      de frenado.
    B: Porque los RV tienen una distancia de frenado más corta y podrían chocar por
      detrás a otros vehículos.
    C: Porque los RV son más anchos y necesitan más espacio para cambiar de carril.
    D: Porque es ilegal que un RV siga de cerca a un automóvil de pasajeros.
  answer: A
  explanation: El manual indica que los RV son similares a los camiones en que son
    más pesados que los automóviles y requieren una mayor distancia de frenado, por
    lo que los conductores siempre deben mantener suficiente espacio entre su RV y
    el vehículo de adelante.
- id: 828
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a los cinturones de seguridad para los
    pasajeros en un vehículo recreativo (RV)?
  choices:
    A: Solo el conductor y el pasajero delantero deben usarlos.
    B: Los pasajeros solo necesitan usarlos cuando viajan por autopistas interestatales.
    C: Todos los pasajeros deben usar cinturones de seguridad siempre que el vehículo
      esté en movimiento.
    D: Los cinturones de seguridad son opcionales si el RV viaja a menos de 30 mph.
  answer: C
  explanation: Asegúrese de que todos los pasajeros en su RV usen cinturones de seguridad
    siempre que el vehículo esté en movimiento. Los pasajeros que no estén abrochados
    pueden salir despedidos y sufrir lesiones graves en un accidente o parada repentina.
- id: 829
  category: license_system
  question: En Tennessee, ¿cuánto tiempo debe tener un permiso de aprendizaje una
    persona menor de 18 años antes de poder tomar el examen práctico de manejo?
  choices:
    A: 90 días
    B: 180 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Las personas menores de dieciocho (18) años deben tener un permiso
    de aprendizaje durante 180 días y calificar bajo el programa GDL antes de poder
    tomar el examen práctico de manejo.
- id: 830
  category: driver_responsibility
  question: Según el manual, ¿cuál es la mayor contribución que un padre o mentor
    puede hacer a la seguridad de un nuevo conductor al volante?
  choices:
    A: Comprar un vehículo con características de seguridad avanzadas.
    B: El ejemplo que dan a través de la paciencia, la cortesía y los hábitos de conducción
      segura.
    C: Inscribir al adolescente en un curso avanzado de manejo defensivo.
    D: Hacer que conduzcan exclusivamente durante las horas del día.
  answer: B
  explanation: Su mayor contribución a la seguridad y eficacia de su nuevo conductor
    al volante será el ejemplo que usted dé. La paciencia, la cortesía y la disposición
    a mejorar serán sus mejores recursos.
- id: 831
  category: defensive_driving
  question: ¿Cuál de las siguientes es una técnica recomendada para enseñar a un conductor
    principiante mientras usted conduce?
  choices:
    A: Sobrecargarlo con la mayor cantidad de información posible.
    B: Hablar en voz alta sobre las decisiones de manejo que está tomando.
    C: Poner música alta para poner a prueba su concentración.
    D: Permanecer completamente en silencio para que pueda observarlo sin distracciones.
  answer: B
  explanation: Algo útil que puede hacer es hablar en voz alta mientras conduce. Aproveche
    las oportunidades de enseñanza mientras está al volante, como explicar en voz
    alta los pasos que está tomando para calcular su distancia de seguimiento.
- id: 832
  category: driver_testing
  question: ¿Por qué se desaconseja conducir sin rumbo durante las sesiones de práctica?
  choices:
    A: Desperdicia demasiado combustible.
    B: Puede ser peligroso que un conductor novato se meta en problemas en las primeras
      etapas.
    C: No cuenta para las horas de manejo requeridas por el programa GDL.
    D: Causa un desgaste innecesario en el vehículo.
  answer: B
  explanation: Conducir sin rumbo durante las sesiones de práctica puede ser peligroso.
    Es muy fácil que el conductor novato se meta en problemas, particularmente en
    las primeras etapas.
- id: 833
  category: driver_testing
  question: ¿Cuál es el lugar ideal para las sesiones de práctica iniciales de la
    "Fase Uno" de un conductor principiante?
  choices:
    A: Una zona residencial tranquila
    B: Una autopista de alta velocidad de varios carriles
    C: Un estacionamiento grande y desierto
    D: Una intersección concurrida de la ciudad
  answer: C
  explanation: Un estacionamiento grande y desierto es ideal para estas sesiones iniciales
    porque permite al principiante concentrarse completamente en la sensación de los
    controles y la respuesta del automóvil.
- id: 834
  category: driver_testing
  question: Durante la "Fase Dos" de la práctica de manejo en una zona residencial
    tranquila, ¿qué nueva habilidad se debe introducir?
  choices:
    A: Estacionamiento en paralelo
    B: Mantener la posición adecuada en el carril y dejar distancias de seguimiento
      seguras (2 segundos)
    C: Giros en U y paradas rápidas
    D: Conducir en malas condiciones climáticas
  answer: B
  explanation: La Fase Dos implica llevar al conductor a una zona residencial tranquila
    para practicar cómo incorporarse al tráfico, mantener la posición adecuada en
    el carril, dejar distancias de seguimiento seguras (2 segundos) y hacer cambios
    de carril sencillos.
- id: 835
  category: driver_testing
  question: ¿En qué fase de la práctica de manejo debe un conductor principiante comenzar
    a aprender a estacionarse en paralelo y a circular por intersecciones con múltiples
    carriles de giro?
  choices:
    A: Fase Uno
    B: Fase Dos
    C: Fase Tres
    D: Fase Cuatro
  answer: C
  explanation: La Fase Tres introduce tráfico más pesado, estacionamiento en paralelo,
    estacionamiento en subida/bajada, intersecciones con múltiples carriles de giro
    y giros en U/paradas rápidas.
- id: 836
  category: driver_testing
  question: ¿Cuál de las siguientes condiciones se introduce en la Fase Cuatro de
    la práctica de manejo?
  choices:
    A: Ajustar el asiento y los espejos
    B: Retroceder y avanzar el automóvil
    C: Cambios de carril sencillos
    D: Conducir de noche con buen y mal clima
  answer: D
  explanation: La Fase Cuatro implica guiar al conductor principiante para que practique
    en condiciones como autopistas de alta velocidad de varios carriles, diversas
    condiciones climáticas, de noche y en la conducción por la ciudad o en áreas de
    tráfico pesado.
- id: 837
  category: driver_responsibility
  question: Cuando un conductor principiante comete un error grave durante una sesión
    de práctica, ¿cuál es el enfoque recomendado?
  choices:
    A: Gritarle inmediatamente para que entienda la gravedad del error.
    B: Detenerse tan pronto como pueda y discutir lo sucedido mientras aún esté fresco
      en su memoria.
    C: Ignorarlo por completo para evitar mermar su confianza.
    D: Esperar hasta el día siguiente para mencionarlo en un entorno formal.
  answer: B
  explanation: 'Detenerse y discutir: Deténgase tan pronto como pueda, mientras un
    error grave aún esté fresco en la memoria del conductor principiante. Luego, tómese
    el tiempo para discutir lo que sucedió y cuál debería ser la respuesta más segura.'
- id: 838
  category: license_system
  question: Según el programa de Licencia de Conducir Graduada (GDL) de Tennessee,
    ¿cuántas horas de manejo deben completar los menores antes de ser elegibles para
    una licencia Intermedia?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 60 horas
  answer: C
  explanation: El programa GDL de Tennessee requiere que los menores conduzcan un
    número específico de horas (50) antes de ser elegibles para avanzar al nivel de
    licencia Intermedia.
- id: 839
  category: safe_driving_rules
  question: Según el manual, ¿qué proporción de conductores varones de 16 años tendrá
    un accidente durante su primer año de manejo?
  choices:
    A: Uno de cada tres
    B: Uno de cada cinco
    C: Uno de cada diez
    D: Uno de cada veinte
  answer: B
  explanation: La inexperiencia combinada con la falta de habilidad significa que
    uno de cada cinco conductores varones de 16 años y aproximadamente una de cada
    diez mujeres de 16 años tendrán un accidente durante su primer año de manejo.
- id: 840
  category: defensive_driving
  question: Algunos de los peores accidentes de conductores jóvenes y principiantes
    ocurren bajo ¿cuál de las siguientes condiciones?
  choices:
    A: Durante el viaje matutino a la escuela
    B: De noche y con un grupo de jóvenes en el automóvil
    C: Mientras conducen solos en un estacionamiento desierto
    D: Durante las sesiones de práctica supervisadas con un padre
  answer: B
  explanation: Algunos de los peores accidentes ocurren de noche y con un grupo de
    jóvenes en el automóvil. Esta es una de las razones por las que el programa GDL
    de Tennessee impone restricciones en estas dos áreas para los nuevos conductores
    adolescentes.
- id: 841
  category: driver_responsibility
  question: ¿Por qué es importante usar los mismos términos de manera consistente
    (por ejemplo, decir siempre "pedal del acelerador" en lugar de cambiar a "acelerador")
    al enseñar a un conductor principiante?
  choices:
    A: Ayuda al conductor a aprobar el examen teórico de conocimientos.
    B: Asegura una comunicación clara y evita confundir al principiante.
    C: Es un requisito legal bajo el programa de Licencias Graduadas (GDL).
    D: Evita que el vehículo se apague.
  answer: B
  explanation: 'Comuníquese claramente: Dé las instrucciones con suficiente anticipación
    y trate de usar siempre los mismos términos (por ejemplo, no diga "acelerador"
    una vez y "pedal del acelerador" la siguiente) para evitar confundir al conductor
    principiante.'
- id: 842
  category: driver_responsibility
  question: Cuando un adolescente solicita una Licencia de Conducir Intermedia, ¿cuál
    de los siguientes es un tema sugerido para incluir en un acuerdo de manejo entre
    padres y adolescentes?
  choices:
    A: La ruta que tomará el examinador de manejo.
    B: La responsabilidad por multas de estacionamiento o daños al vehículo.
    C: Cómo evitar el examen práctico de manejo.
    D: La fecha exacta en que el adolescente obtendrá una licencia completa.
  answer: B
  explanation: El manual sugiere que las áreas a considerar en un acuerdo entre padres
    y adolescentes incluyen la responsabilidad por multas de estacionamiento o daños
    al vehículo, entre otros temas como los horarios de manejo y el mantenimiento.
- id: 843
  category: safe_driving_rules
  question: Según el manual, ¿qué se considera el mayor enemigo del conductor principiante?
  choices:
    A: Conducir de noche.
    B: La complacencia que surge del éxito inicial al aprender los conceptos básicos
      de manejo.
    C: El tráfico pesado en las autopistas interestatales.
    D: Los examinadores de manejo estrictos.
  answer: B
  explanation: 'El manual establece: "El mayor enemigo del conductor principiante
    es la complacencia que surge del éxito inicial al aprender los conceptos básicos
    de manejo".'
- id: 844
  category: driver_testing
  question: ¿Qué se requiere de los solicitantes que no hablan inglés antes de que
    se les pueda administrar un examen práctico de manejo?
  choices:
    A: Deben tener fluidez en inglés escrito.
    B: Deben llevar un traductor certificado en el vehículo.
    C: Deben entender y hablar suficiente inglés para comunicarse de manera segura
      con el examinador.
    D: Deben tomar el examen en su idioma materno.
  answer: C
  explanation: El manual establece explícitamente que todos los solicitantes deben
    entender y hablar suficiente inglés para comunicarse de manera segura con el examinador
    antes de que se les pueda administrar un examen práctico de manejo.
- id: 845
  category: driver_testing
  question: Aproximadamente, ¿cuánto tiempo pasa un examinador de licencias de conducir
    manejando con un solicitante durante el examen?
  choices:
    A: Menos de 30 minutos.
    B: Exactamente una hora.
    C: Al menos 45 minutos.
    D: Más de dos horas.
  answer: A
  explanation: El manual recuerda a los padres que "un examinador de licencias de
    conducir pasa menos de 30 minutos manejando con su hijo".
- id: 846
  category: driver_responsibility
  question: ¿Qué sugiere enfáticamente el manual que hagan los padres después de que
    a su hijo adolescente se le haya emitido una licencia de conducir?
  choices:
    A: Dejar de viajar en el vehículo con ellos.
    B: Continuar monitoreando el desempeño de manejo de su hijo adolescente.
    C: Permitir que el adolescente conduzca a cualquier lugar sin restricciones.
    D: Dejar que el adolescente pague todo el mantenimiento del vehículo de inmediato.
  answer: B
  explanation: El manual aconseja que "es prudente continuar monitoreando el desempeño
    de manejo de su hijo adolescente incluso después de que se le haya emitido una
    licencia de conducir".
- id: 847
  category: defensive_driving
  question: 'Según el manual, ser un buen conductor defensivo significa:'
  choices:
    A: Conducir solo durante las horas de luz del día.
    B: Depender únicamente de su experiencia de manejo.
    C: Más que solo ser cauteloso; requiere esforzarse en desarrollar buenas técnicas
      de manejo.
    D: Conducir por debajo del límite de velocidad en todo momento.
  answer: C
  explanation: 'El texto establece: "Ser un buen conductor defensivo significa más
    que solo ser cauteloso; ¡y la mera experiencia tampoco es suficiente! El buen
    conductor defensivo tiene que esforzarse en desarrollar buenas técnicas de manejo".'
- id: 848
  category: license_system
  question: Según la descripción general del manual, ¿cuál de la siguiente información
    se encuentra en la Sección A?
  choices:
    A: Consejos de manejo defensivo.
    B: Señales de tráfico y semáforos.
    C: Qué documentos se necesitan para solicitar una licencia.
    D: Leyes de manejo del estado y sanciones.
  answer: C
  explanation: El manual describe que la Sección A cubre los diferentes tipos de licencias,
    qué documentos se necesitan para presentar la solicitud, información para solicitantes
    menores de 18 años y descripciones de los exámenes requeridos.
- id: 849
  category: signs_and_signals
  question: ¿Qué sección del manual integral cubre las señales de tráfico, los semáforos
    y las reglas de tránsito?
  choices:
    A: Sección A
    B: Sección B
    C: Sección C
    D: El Apéndice
  answer: B
  explanation: El índice del manual indica que la Sección B contiene Buenas Prácticas
    de Manejo, Reglas de Tránsito, Señales de Tráfico y Semáforos, y Leyes de Manejo
    del Estado y Sanciones.
- id: 850
  category: sharing_the_road
  question: ¿En qué parte del manual puede encontrar información sobre cómo compartir
    la vía de manera segura y ayudar a los adolescentes a aprender a manejar?
  choices:
    A: Sección A
    B: Sección B
    C: Sección C
    D: El Glosario
  answer: C
  explanation: La Sección C del manual cubre Consejos de Seguridad, Manejo Defensivo,
    Compartir la Vía de Manera Segura y Ayudar a Adolescentes y Nuevos Conductores
    a Aprender a Manejar.
- id: 851
  category: driver_testing
  question: 'Al ayudar a un principiante que no habla inglés a aprender a conducir,
    los mentores deben ponerse en el papel de un examinador y dejar que el conductor
    practique:'
  choices:
    A: Seguir instrucciones sencillas en inglés
    B: Traducir todo el manual del conductor
    C: Conducir sin ninguna comunicación verbal
    D: Memorizar la ruta del examinador
  answer: A
  explanation: 'El manual aconseja a los mentores que "se pongan en el papel de un
    examinador y dejen que el conductor practique siguiendo instrucciones sencillas
    en inglés (por ejemplo: ''Turn left'' [Gire a la izquierda]; ''Slow down'' [Reduzca
    la velocidad])."'
- id: 852
  category: license_system
  question: ¿Cuándo suelen tener un mayor volumen de clientes los Centros de Servicios
    al Conductor?
  choices:
    A: Temprano en la mañana los martes
    B: Cuando vuelven a abrir después de estar cerrados por un día festivo
    C: Durante la última semana del mes
    D: Cuando está lloviendo
  answer: B
  explanation: 'El manual señala: "Nuestros Centros de Servicios al Conductor normalmente
    tendrán un mayor volumen de clientes cuando volvamos a abrir después de estar
    cerrados por un día festivo, así que por favor planifique su visita en consecuencia".'
- id: 853
  category: license_system
  question: ¿Cómo puede verificar su elegibilidad para renovar su licencia de conducir
    de Tennessee en línea?
  choices:
    A: Visitando www.tn.gov/safety
    B: Enviando una carta por correo al examinador
    C: Tomando un nuevo examen de manejo
    D: Visitando una estación de policía local
  answer: A
  explanation: 'El manual establece: "También puede considerar usar nuestro sitio
    web en: www.tn.gov/safety para verificar su elegibilidad para renovar en línea".'
- id: 854
  category: safe_driving_rules
  question: 'Según el manual, la conducción segura es en gran medida una cuestión
    de:'
  choices:
    A: Tener las características de seguridad del vehículo más nuevas
    B: Ver lo que se necesita ver y tomar buenas decisiones
    C: Memorizar todas las carreteras estatales
    D: Conducir solo en áreas familiares
  answer: B
  explanation: El texto explica que "La conducción segura es en gran medida una cuestión
    de ver lo que se necesita ver y tomar buenas decisiones, pero esto no es fácil
    de lograr".
- id: 855
  category: driver_responsibility
  question: 'Al crear un acuerdo o ''contrato'' de conducción con un adolescente,
    los padres:'
  choices:
    A: Deben presentar una copia notariada al Centro de Servicios al Conductor
    B: Deben hacer que un instructor de manejo lo firme
    C: Pueden elegir si tenerlo por escrito y firmado o simplemente discutirlo en
      familia
    D: Están obligados por ley a mantenerlo en el vehículo en todo momento
  answer: C
  explanation: 'El manual establece: "Depende de usted si desea tener este ''contrato''
    por escrito y firmado, o simplemente discutirlo en familia..."'
- id: 856
  category: driver_responsibility
  question: 'Aunque un examinador de licencias de conducir puede evaluar la competencia
    de un conductor, la responsabilidad de la educación y de enseñar a un hijo a conducir
    recae en:'
  choices:
    A: El Departamento de Seguridad
    B: El maestro de educación vial de la escuela secundaria
    C: Los padres o el mentor a cargo
    D: La legislatura estatal
  answer: C
  explanation: El manual enfatiza que "El examinador de licencias de conducir puede
    evaluar la competencia de un conductor, pero la responsabilidad de la educación
    y de enseñar a ese hijo a conducir recae en los padres o el mentor a cargo".
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Haga una parada completa
    C: Ceda el paso al tráfico en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal roja octagonal de ALTO (STOP) significa que debe hacer una
    parada completa en la línea de alto, el cruce peatonal o antes de ingresar a la
    intersección. Verifique si hay tráfico y peatones antes de continuar.
  id: 857
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Hacer una parada completa
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para dejar que otros pasen de manera segura.
  id: 858
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre a esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe ingresar a la carretera o rampa donde está colocada esta señal. Por lo general,
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde ingresar lo pondría en el camino del tráfico en sentido contrario.
  id: 859
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta — va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que viaja en contra del tráfico en una carretera de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera segura.
  id: 860
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de sentido único (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 861
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Giros en U
    D: Adelantar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de giro en U tachada
    significa que los giros en U están prohibidos en esta ubicación.
  id: 862
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 863
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite girar en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite adelantar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en esta
    ubicación.
  id: 864
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: La carretera se estrecha más adelante
    B: No adelante a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de zona de no adelantar
    (NO PASSING ZONE) significa que no se le permite adelantar a otros vehículos en
    esta área. Marca el comienzo de una zona donde se prohíbe adelantar.
  id: 865
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye a hacer esta señal a los conductores?
  choices:
    A: Incorporarse a la derecha
    B: Solo giro a la derecha
    C: Mantenerse a la derecha de un separador u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de mantenerse a la derecha (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isleta
    de tráfico, mediana u obstrucción.
  id: 866
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 867
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta área
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que los ciervos cruzan frecuentemente la carretera en esta área. Reduzca
    la velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 868
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminar cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con la figura de un peatón
    advierte de un cruce de peatones más adelante. Esté preparado para detenerse ante
    los peatones que cruzan la carretera.
  id: 869
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal de color amarillo verdoso fluorescente en forma de pentágono
    (5 lados) indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté
    atento a los niños.
  id: 870
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no adelantar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 871
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería típicamente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (cruz de San Andrés) se coloca en los
    cruces de ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca
    un tren, debe detenerse.
  id: 872
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Se requiere girar a la derecha
    C: Una curva hacia la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 873
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se usa en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 874
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición del camino advierte esta señal?
  choices:
    A: Un camino sinuoso
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que el camino se curve primero
    hacia un lado y luego hacia el otro.
  id: 875
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte esta señal que debe esperar?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de camino resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de camino sinuoso advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a las condiciones cambiantes
    del camino.
  id: 876
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico incorporándose desde otro camino
    C: El comienzo de una autopista dividida
    D: Un camino que se estrecha a un carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de diamante advierte que
    el tráfico de otro camino se incorporará a su carril. Prepárese para ajustar su
    velocidad y posición.
  id: 877
- image: road_narrows.png
  category: signs_and_signals
  question: ¿De qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: El camino se estrecha más adelante
    C: Fin de carril
    D: Fin de autopista dividida
  answer: B
  explanation: Esta señal de advertencia indica que el camino más adelante se vuelve
    más estrecho. Prepárese para una reducción en el ancho del camino y ajuste su
    posición en el carril.
  id: 878
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: El camino termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de autopista
  answer: C
  explanation: Esta señal advierte que el camino más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en sentido
    contrario. Manténgase a la derecha.
  id: 879
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida termina. El tráfico en
    sentido contrario ya no estará separado por una mediana. Prepárese para el tráfico
    de doble sentido.
  id: 880
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Comienza una carretera dividida
    B: Zona de adelantamiento más adelante
    C: Tráfico de doble sentido más adelante — el tráfico se mueve en ambas direcciones
    D: Desvío de carril más adelante
  answer: C
  explanation: Esta señal advierte sobre tráfico de doble sentido más adelante. Es
    posible que esté saliendo de una vía de un solo sentido o de una carretera dividida
    y se encontrará con vehículos que viajan en dirección opuesta.
  id: 881
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera helada
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de resbaladizo cuando está mojado advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 882
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache o resalto en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción en la carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 883
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (stop) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un punto de control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está roja o amarilla. Esta señal a menudo se coloca donde
    el semáforo puede no ser visible desde la distancia.
  id: 884
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (stop) donde debe detenerse
    D: Un reductor de velocidad (resalto)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (stop) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 885
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce o una intersección de 4 vías más
    adelante. Esté atento al tráfico que ingresa desde las carreteras laterales.
  id: 886
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera principal desde la carretera
    lateral.
  id: 887
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están fusionando
    B: Un carril termina
    C: Se está agregando un nuevo carril — no es necesario fusionarse
    D: Se requiere girar a la derecha
  answer: C
  explanation: Una señal de carril adicional significa que un nuevo carril se une
    a la carretera sin necesidad de fusionarse. El tráfico que ingresa desde la rampa
    tiene su propio carril nuevo.
  id: 888
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionar en esta área
    C: Detenerse o dejar el motor en marcha
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 889
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: A cualquier persona por menos de 15 minutos
    B: Solo a personas de la tercera edad
    C: Solo a vehículos que muestren un cartel o placa de discapacidad válida
    D: A cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de una silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que muestren un
    cartel o placa de estacionamiento para discapacitados válida pueden estacionar
    en estos espacios. Las infracciones conllevan multas severas.
  id: 890
