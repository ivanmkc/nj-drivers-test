questions:
- id: 1
  category: license_system
  question: ¿Cuáles son las horas normales de atención de los Centros de Servicios
    para Conductores de Tennessee?
  choices:
    A: De 8:00 a.m. a 4:30 p.m.
    B: De 8:30 a.m. a 5:00 p.m.
    C: De 9:00 a.m. a 5:00 p.m.
    D: De 8:30 a.m. a 6:00 p.m.
  answer: B
  explanation: Según el manual, los Centros de Servicios para Conductores normalmente
    están abiertos de 8:30 a.m. a 5:00 p.m. y cierran en los días festivos oficiales
    del estado.
- id: 2
  category: license_system
  question: ¿Por cuánto tiempo es válida una licencia de conducir interina de Tennessee?
  choices:
    A: Hasta 10 días
    B: Hasta 15 días
    C: Hasta 20 días
    D: Hasta 30 días
  answer: C
  explanation: El manual indica que la licencia interina es válida por hasta 20 días,
    y la licencia o identificación permanente se enviará por correo a la dirección
    del cliente.
- id: 3
  category: license_system
  question: ¿Cómo se puede validar la información en la parte frontal de una tarjeta
    de licencia interina?
  choices:
    A: Leyendo el código de barras 2D
    B: Revisando la banda magnética
    C: Escaneando el chip RFID
    D: Llamando al Centro de Servicios para Conductores
  answer: A
  explanation: El manual señala que la información en la parte frontal de la tarjeta
    interina se puede validar leyendo el código de barras 2D.
- id: 4
  category: license_system
  question: ¿A partir de qué fecha debe una persona tener una REAL ID u otra identificación
    aceptable para abordar un vuelo de una aerolínea comercial dentro de los Estados
    Unidos?
  choices:
    A: 7 de mayo de 2023
    B: 7 de mayo de 2024
    C: 7 de mayo de 2025
    D: 7 de mayo de 2026
  answer: C
  explanation: El manual establece que a partir del 7 de mayo de 2025, todas las personas
    deben tener una licencia REAL ID o un pasaporte estadounidense válido y no vencido
    para abordar un vuelo de una aerolínea comercial dentro de los EE. UU.
- id: 5
  category: license_system
  question: ¿Cuál de las siguientes actividades requiere una credencial que cumpla
    con los requisitos de la REAL ID?
  choices:
    A: Conducir un vehículo motorizado
    B: Votar en una elección estatal
    C: Acceder a edificios de tribunales federales
    D: Ingresar a una instalación nuclear
  answer: D
  explanation: Se requiere una REAL ID para ingresar a ciertas propiedades federales,
    como bases militares, edificios federales e instalaciones nucleares. NO es necesaria
    para conducir, votar o acceder a edificios de tribunales federales.
- id: 6
  category: license_system
  question: ¿Para cuál de las siguientes actividades NO necesita una credencial que
    cumpla con los requisitos de la REAL ID?
  choices:
    A: Abordar un avión comercial nacional
    B: Visitar la oficina de correos
    C: Ingresar a una base militar
    D: Ingresar a un edificio federal seguro
  answer: B
  explanation: El manual enumera explícitamente 'Visitar la oficina de correos' como
    una actividad para la cual NO necesita una credencial que cumpla con los requisitos
    de la REAL ID.
- id: 7
  category: license_system
  question: ¿Cuál es la diferencia de costo entre obtener una credencial que cumpla
    con la REAL ID y una licencia de Tennessee que no cumpla con ella?
  choices:
    A: La REAL ID cuesta $10 más.
    B: La REAL ID cuesta el doble.
    C: No hay diferencia en el costo.
    D: La identificación que no cumple con los requisitos es gratis.
  answer: C
  explanation: 'El manual establece: ''No hay diferencia de costo para obtener una
    credencial que cumpla con la REAL ID y una licencia o identificación de Tennessee
    que no cumpla con la REAL ID''.'
- id: 8
  category: driver_responsibility
  question: ¿Cuál de las siguientes se considera una forma de conducción distraída?
  choices:
    A: Distracción cognitiva
    B: Distracción visual
    C: Distracción manual
    D: Todas las anteriores
  answer: D
  explanation: 'El manual explica que la conducción distraída se presenta de muchas
    formas diferentes: ''Podría ser cognitiva, podría ser visual o podría ser manual.
    Puede ser una combinación de las tres...''.'
- id: 9
  category: safe_driving_rules
  question: ¿Enviar o leer un mensaje de texto aparta sus ojos de la carretera por
    un mínimo de cuántos segundos?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 5 segundos
    D: 10 segundos
  answer: C
  explanation: Según el manual, enviar o leer un mensaje de texto aparta sus ojos
    de la carretera por un mínimo de 5 segundos.
- id: 10
  category: defensive_driving
  question: Conducir a 55 mph mientras lee un mensaje de texto durante 5 segundos
    es equivalente a recorrer la longitud de qué con los ojos cerrados?
  choices:
    A: Una cancha de baloncesto
    B: Un campo de fútbol americano entero
    C: Un campo de béisbol
    D: Una cuadra de la ciudad
  answer: B
  explanation: 'El manual establece: ''Conducir a 55 mph, es como recorrer la longitud
    de un campo de fútbol americano entero con los ojos cerrados''.'
- id: 11
  category: driver_responsibility
  question: Según la red integrada de análisis de tráfico de Tennessee (Titan, por
    sus siglas en inglés), ¿con qué frecuencia ocurre un accidente que involucra a
    un conductor distraído en Tennessee?
  choices:
    A: Cada 10 minutos y 5 segundos
    B: Cada 15 minutos y 30 segundos
    C: Cada 26 minutos y 13 segundos
    D: Cada 45 minutos y 20 segundos
  answer: C
  explanation: Según Titan, un accidente que involucra a un conductor distraído en
    Tennessee ocurre cada 26 minutos y 13 segundos.
- id: 12
  category: safe_driving_rules
  question: Según la ley de manos libres de Tennessee de 2019, ¿cuál de las siguientes
    acciones es ilegal para un conductor?
  choices:
    A: Usar un sistema GPS activado por voz sin tocar el teléfono
    B: Sostener un teléfono celular con cualquier parte de su cuerpo
    C: Hablar con los pasajeros en el vehículo
    D: Escuchar la radio incorporada del vehículo
  answer: B
  explanation: Según el Capítulo Público No. 412, es ilegal que un conductor 'sostenga
    un teléfono celular o dispositivo móvil con cualquier parte de su cuerpo'.
- id: 13
  category: safe_driving_rules
  question: La ley de manos libres prohíbe alcanzar un teléfono celular si esto requiere
    que el conductor haga ¿qué cosa?
  choices:
    A: Quitar una mano del volante
    B: Apartar la vista de la carretera por más de un segundo
    C: Dejar de estar en posición de conducción sentado o no estar correctamente sujeto
      por el cinturón de seguridad
    D: Decir un comando de voz en voz alta
  answer: C
  explanation: La ley hace ilegal 'alcanzar un teléfono celular o dispositivo móvil
    de una manera que requiera que el conductor deje de estar en posición de conducción
    sentado o no esté correctamente sujeto por el cinturón de seguridad'.
- id: 14
  category: safe_driving_rules
  question: Si necesita tocar su teléfono para acceder o ajustar su GPS mientras conduce,
    ¿qué debe hacer?
  choices:
    A: Esperar hasta estar detenido en un semáforo en rojo
    B: Hacer que un pasajero sostenga el volante
    C: Reducir la velocidad a al menos 15 mph
    D: Encontrar un lugar seguro para estacionarse, como un estacionamiento
  answer: D
  explanation: 'El manual establece: ''No se le permite tocar su teléfono para usar
    el GPS. Si necesita acceder al GPS o usar su teléfono, debe encontrar un lugar
    seguro para estacionarse, como en un estacionamiento...''.'
- id: 15
  category: license_system
  question: ¿Son elegibles las personas menores de 18 años para obtener una credencial
    que cumpla con la ley REAL ID en Tennessee?
  choices:
    A: No, deben tener al menos 18 años.
    B: No, deben tener al menos 21 años.
    C: Sí, son elegibles y siguen el mismo proceso que los titulares de credenciales
      adultos.
    D: Sí, pero solo si viajan internacionalmente.
  answer: C
  explanation: 'El manual establece: ''Las personas menores de 18 años son elegibles
    para obtener una licencia o credencial de identificación que cumpla con la ley
    REAL ID... siguiendo el mismo proceso que los titulares de credenciales adultos''.'
- id: 16
  category: safe_driving_rules
  question: Según el manual, ¿cuál es la forma correcta de usar un GPS en su teléfono
    mientras conduce?
  choices:
    A: Puede tocar su teléfono rápidamente para ajustar la ruta.
    B: Debe encontrar un lugar seguro para estacionarse y detener su vehículo por
      completo antes de operarlo.
    C: Puede usarlo siempre y cuando mantenga una mano en el volante.
    D: Solo puede usarlo mientras está detenido en un semáforo en rojo.
  answer: B
  explanation: 'El manual establece: ''Si necesita acceder al GPS o usar su teléfono,
    debe encontrar un lugar seguro para estacionarse, como en un estacionamiento,
    detener su vehículo por completo y operar su teléfono o tecnología GPS''.'
- id: 17
  category: safe_driving_rules
  question: ¿Es legal grabar videos desde su teléfono mientras conduce en Tennessee?
  choices:
    A: Sí, si el teléfono está montado en el tablero.
    B: Sí, pero solo para fines de redes sociales.
    C: No, es una violación de la ley grabar videos mientras conduce.
    D: No, a menos que esté grabando un accidente de tráfico.
  answer: C
  explanation: 'El manual establece explícitamente: ''Es muy peligroso y es una violación
    de la ley grabar videos mientras conduce''.'
- id: 18
  category: safe_driving_rules
  question: ¿Cuándo debe configurar su navegación GPS para un viaje?
  choices:
    A: Mientras se incorpora a la autopista
    B: Antes de comenzar a conducir
    C: Mientras está detenido en el primer semáforo
    D: Siempre que conduzca a menos de 30 mph
  answer: B
  explanation: 'El manual aconseja a los conductores planificar su viaje indicando:
    ''Debe configurar su navegación antes de comenzar a conducir''.'
- id: 19
  category: license_system
  question: ¿Qué sección del manual completo de Tennessee explica los detalles sobre
    las Licencias de Conducir Intermedias para solicitantes menores de 18 años?
  choices:
    A: Sección A
    B: Sección B
    C: Sección C
    D: El Índice
  answer: A
  explanation: Según la introducción, la Sección A explica 'los detalles sobre las
    Licencias de Conducir Intermedias y cómo funciona esta licencia de conducir gradual
    para los solicitantes de licencias de conducir menores de 18 años'.
- id: 20
  category: driver_testing
  question: Según el manual, ¿qué sección está diseñada para ayudar a los nuevos conductores
    a estudiar y prepararse para los conocimientos y habilidades requeridos para una
    licencia de operador?
  choices:
    A: Sección A
    B: Sección B
    C: Sección C
    D: Capítulo 2
  answer: B
  explanation: El manual establece que 'la Sección B... está diseñada para ayudar
    a los nuevos conductores a estudiar y prepararse para los conocimientos y habilidades
    requeridos para una licencia de operador'.
- id: 21
  category: sharing_the_road
  question: ¿Qué sección del manual proporciona información sobre cómo compartir la
    carretera con otros medios de transporte?
  choices:
    A: Sección A
    B: Sección B
    C: Sección C
    D: Capítulo 1
  answer: C
  explanation: La introducción señala que la Sección C 'proporciona información sobre
    cómo compartir la carretera con otros medios de transporte, los cuales tienen
    ciertos derechos y privilegios en las autopistas...'.
- id: 22
  category: license_system
  question: ¿Qué representa una licencia de Clase M en Tennessee?
  choices:
    A: Autocaravana (Motorhome)
    B: Ciclomotor (Moped)
    C: Motocicleta
    D: Transmisión manual
  answer: C
  explanation: El índice de la Sección A, Capítulo 1 enumera 'Clase M (Motocicleta)'.
- id: 23
  category: license_system
  question: ¿Qué significa el endoso 'F' en una licencia de Clase D?
  choices:
    A: Vehículo agrícola
    B: Para alquiler (For-Hire)
    C: Carga (Freight)
    D: Familia
  answer: B
  explanation: El índice enumera 'Clase D con F (Endoso para alquiler / For-Hire)'.
- id: 24
  category: license_system
  question: ¿Qué clase de licencia se designa para un Permiso de Aprendizaje (Learner
    Permit)?
  choices:
    A: Clase LP
    B: Clase L
    C: Clase PD
    D: Clase P
  answer: C
  explanation: El índice enumera 'Permiso de Aprendizaje (Clase PD)'.
- id: 25
  category: license_system
  question: ¿Qué tipo de licencia es una licencia de Clase H?
  choices:
    A: Comercial pesada
    B: Autopista (Highway)
    C: Materiales peligrosos
    D: Por dificultad (Hardship)
  answer: D
  explanation: El índice enumera 'Clase H (Por dificultad / Hardship)'.
- id: 26
  category: driver_responsibility
  question: ¿Cuál es el nombre del programa de donación de órganos y tejidos mencionado
    en el manual?
  choices:
    A: Donate Life Tennessee
    B: Registro de Órganos de Tennessee
    C: Gift of Life TN
    D: Servicios de Donantes de Tennessee
  answer: A
  explanation: El índice enumera el tema 'Donación de órganos y tejidos - Donate Life
    Tennessee'.
- id: 27
  category: driver_responsibility
  question: ¿Cuál es el término utilizado en el manual para el registro de votantes
    relacionado con las licencias de conducir?
  choices:
    A: Auto Vote
    B: Motor Voter
    C: Drive to Vote
    D: Registro de Licencia
  answer: B
  explanation: El índice enumera 'Registro de votantes - Motor Voter'.
- id: 28
  category: license_system
  question: ¿Qué significa la abreviatura TDL en el manual del conductor de Tennessee?
  choices:
    A: Licencia de Conducir de Tennessee
    B: Licencia de Conducir Temporal
    C: Licencia de Conducir de Tránsito
    D: Licencia de Conducir para Adolescentes
  answer: B
  explanation: El índice enumera 'Licencia de Conducir Temporal (TDL)'.
- id: 29
  category: license_system
  question: ¿Qué significa IDP en el contexto de las credenciales de manejo?
  choices:
    A: Permiso de Manejo de Identificación
    B: Privilegio de Manejo Interestatal
    C: Permiso Internacional de Manejo
    D: Programa de Conductor Independiente
  answer: C
  explanation: El índice enumera 'Permiso Internacional de Manejo (IDP)'.
- id: 30
  category: license_system
  question: ¿Cuál de los siguientes es un requisito enumerado en el Capítulo 2 al
    solicitar su licencia?
  choices:
    A: Prueba de propiedad del vehículo
    B: Prueba de ciudadanía estadounidense o residencia permanente legal
    C: Prueba de empleo
    D: Prueba de graduación de la escuela secundaria
  answer: B
  explanation: El índice del Capítulo 2 enumera 'Prueba de ciudadanía estadounidense
    o residencia permanente legal' como requisito para solicitar una licencia.
- id: 31
  category: license_system
  question: ¿Cuál es el primer nivel del sistema de Licencia Intermedia para conductores
    menores de 18 años después de obtener un Permiso de Aprendizaje (Learner Permit)?
  choices:
    A: Licencia Intermedia Sin Restricciones
    B: Licencia Intermedia Restringida
    C: Licencia de Conducir Regular
    D: Licencia por Dificultades (Hardship License)
  answer: B
  explanation: Según los Procedimientos de Licencia Gradual, el primer nivel después
    de un Permiso de Aprendizaje es la Licencia Intermedia Restringida.
- id: 32
  category: license_system
  question: ¿Cuál es el nivel final de los Procedimientos de Licencia Gradual para
    conductores menores de 18 años?
  choices:
    A: Licencia Intermedia Restringida
    B: Permiso de Aprendizaje
    C: Licencia de Conducir Regular
    D: Licencia Intermedia Sin Restricciones
  answer: C
  explanation: El nivel final de los Procedimientos de Licencia Gradual para conductores
    menores de 18 años es la Licencia de Conducir Regular.
- id: 33
  category: license_system
  question: ¿Cuál de los siguientes es un requisito de documentación adicional para
    los menores que solicitan una licencia?
  choices:
    A: Comprobante de propiedad del vehículo
    B: Comprobante de Asistencia/Progreso Escolar
    C: Un pasaporte válido
    D: Tarjeta de registro de votante
  answer: B
  explanation: Los requisitos de documentación adicional para menores incluyen Declaraciones
    Juradas para Menores/Adolescentes y el Comprobante de Asistencia/Progreso Escolar.
- id: 34
  category: safe_driving_rules
  question: Según los Procedimientos de Licencia Gradual para conductores menores
    de 18 años, ¿cuál es la regla sobre el uso del teléfono celular?
  choices:
    A: Solo se permite con un dispositivo manos libres
    B: Está prohibido
    C: Se permite durante las horas de luz diurna
    D: Solo se permite para navegación GPS
  answer: B
  explanation: El manual establece explícitamente que el uso del teléfono celular
    está prohibido para conductores menores de 18 años que tengan un permiso de aprendizaje
    o una licencia intermedia.
- id: 35
  category: safe_driving_rules
  question: ¿Cuál es la ley de Tennessee con respecto a enviar mensajes de texto mientras
    se conduce?
  choices:
    A: Está prohibido
    B: Está permitido para adultos mayores de 21 años
    C: Está permitido en los semáforos en rojo
    D: Solo está prohibido en zonas escolares
  answer: A
  explanation: El manual enumera 'Prohibido enviar mensajes de texto mientras se conduce'
    como una regla general para todos los conductores.
- id: 36
  category: safe_driving_rules
  question: ¿Dónde está explícitamente prohibido operar un teléfono de mano según
    el capítulo 'Familiarizándose con su vehículo'?
  choices:
    A: En las autopistas interestatales
    B: En una zona escolar
    C: En vecindarios residenciales
    D: En estacionamientos
  answer: B
  explanation: El manual establece explícitamente 'Prohibido operar un teléfono de
    mano en una zona escolar'.
- id: 37
  category: driver_testing
  question: ¿Cuál de los siguientes es uno de los exámenes requeridos para obtener
    una licencia de conducir?
  choices:
    A: Examen de audición
    B: Examen de la vista
    C: Prueba de aptitud física
    D: Examen de reflejos
  answer: B
  explanation: El capítulo de exámenes enumera el Examen de la vista, el Examen de
    conocimientos y el Examen práctico de manejo (Road Test) como las pruebas requeridas.
- id: 38
  category: driver_testing
  question: ¿Qué se requiere antes de tomar el Examen práctico de manejo (Road Test)?
  choices:
    A: Una carta notariada de un padre
    B: Una cita
    C: Una inspección del vehículo por un mecánico
    D: Un mínimo de 100 horas de práctica de manejo
  answer: B
  explanation: El manual especifica 'Se requiere cita para el Examen práctico de manejo'
    en el capítulo de Exámenes.
- id: 39
  category: driver_testing
  question: ¿Qué se debe completar como parte del Examen práctico de manejo antes
    de conducir realmente?
  choices:
    A: Una inspección del vehículo previa al viaje
    B: Un ensayo escrito
    C: Una simulación de estacionamiento en paralelo
    D: Un examen de la vista
  answer: A
  explanation: La 'Inspección del vehículo previa al viaje' se enumera como un componente
    obligatorio del Examen práctico de manejo.
- id: 40
  category: vehicle_information
  question: Según las Leyes de Cinturones de Seguridad de Tennessee, ¿cuál es uno
    de los hechos principales sobre cómo lo protegen los cinturones de seguridad?
  choices:
    A: Previenen salir expulsado del vehículo
    B: Aumentan la velocidad máxima del vehículo
    C: Evitan que las bolsas de aire se desplieguen
    D: Permiten al conductor maniobrar con una mano
  answer: A
  explanation: Uno de los hechos sobre los cinturones de seguridad enumerados en el
    manual es 'Prevenir la expulsión'.
- id: 41
  category: vehicle_information
  question: ¿Cómo manejan los cinturones de seguridad las fuerzas de un choque en
    el cuerpo?
  choices:
    A: Concentrándolas en el pecho
    B: Transfiriendo las fuerzas del choque a las partes más fuertes de la estructura
      del cuerpo
    C: Eliminando todas las fuerzas del choque
    D: Dirigiendo las fuerzas del choque al parachoques del vehículo
  answer: B
  explanation: Un dato clave sobre los cinturones de seguridad es que 'transfieren
    las fuerzas del choque a las partes más fuertes de la estructura del cuerpo'.
- id: 42
  category: vehicle_information
  question: Además de transferir las fuerzas del choque, ¿qué más hacen los cinturones
    de seguridad durante un accidente?
  choices:
    A: Distribuyen las fuerzas del choque sobre un área amplia del cuerpo
    B: Concentran las fuerzas del choque en las partes más débiles del cuerpo
    C: Empujan el cuerpo hacia adelante
    D: Desbloquean automáticamente las puertas
  answer: A
  explanation: Los cinturones de seguridad funcionan 'distribuyendo las fuerzas del
    choque sobre un área amplia del cuerpo'.
- id: 43
  category: vehicle_information
  question: ¿Cómo ayudan los cinturones de seguridad con la postura del conductor?
  choices:
    A: Permiten que el conductor se recline cómodamente
    B: Mantienen el cuerpo más cerca de la 'postura de conducción adecuada'
    C: Permiten que el conductor alcance el asiento trasero fácilmente
    D: Restringen al conductor de revisar sus puntos ciegos
  answer: B
  explanation: Los cinturones de seguridad ayudan a 'mantener el cuerpo más cerca
    de la postura de conducción adecuada'.
- id: 44
  category: vehicle_information
  question: ¿Qué partes específicas del cuerpo se mencionan explícitamente como protegidas
    por los cinturones de seguridad en el manual de Tennessee?
  choices:
    A: Las rodillas y los tobillos
    B: La cabeza y la médula espinal
    C: Los brazos y los hombros
    D: Las manos y las muñecas
  answer: B
  explanation: Uno de los datos sobre los cinturones de seguridad enumerados en el
    manual es 'proteger la cabeza y la médula espinal'.
- id: 45
  category: vehicle_information
  question: ¿Sobre qué gas peligroso específico se ofrece una advertencia especial
    en el capítulo 'Familiarizándose con su vehículo'?
  choices:
    A: Dióxido de nitrógeno
    B: Monóxido de carbono
    C: Dióxido de azufre
    D: Radón
  answer: B
  explanation: El manual incluye una 'Advertencia especial sobre la intoxicación por
    monóxido de carbono'.
- id: 46
  category: signs_and_signals
  question: Según la sección del manual sobre las formas de las señales, ¿qué indica
    una señal en forma de octágono?
  choices:
    A: Ceder el paso
