- id: 195
  category: driver_responsibility
  question: 人身売買の疑いに関する情報提供を行う際、どのような「実行可能な情報」を提供すべきですか？
  choices:
    A: あなた自身の運転記録
    B: 被害者の財務履歴
    C: 関与している車、ナンバープレート、人物の特徴
    D: あなたの車両の登録番号
  answer: C
  explanation: 実行可能な情報には、日時、場所、関与した乗用車やトラックの特徴（メーカー、モデル、色、ナンバープレート）、および人物の特徴が含まれます。
- id: 196
  category: driver_responsibility
  question: マニュアルが人身売買の疑いがある者に近づかないよう勧告しているのはなぜですか？
  choices:
