  question: 譲れ（YIELD）の標識の形と意味は何ですか？
  choices:
    A: 八角形：進む前に必ず一時停止しなければならない。
    B: 三角形：速度を落とし、進路を譲り、必要に応じて停止しなければならない。
    C: 正方形：逆走しており、引き返さなければならない。
    D: 円形：踏切に近づいており、列車が来ないか確認しなければならない。
  answer: B
  explanation: マニュアルでは、譲れ（Yield）の標識を「三角形：この標識は、速度を落とし、進路を譲る必要があることを意味します。必要に応じて、一時停止標識（stop
    sign）と同じように停止してください」と説明しています。
- id: 235
  category: signs_and_signals
  question: 赤い円に斜線が入った標識は何を示していますか？
  choices:
    A: 示されている動作は推奨されるが、必須ではない。
    B: 危険に近づいているため、速度を落とすべきである。
    C: 前方の道路はすべての車両が通行止めである。
    D: 標識に示されている動作を行ってはならない。
  answer: D
  explanation: マニュアルには、「赤い円に斜線が入った標識を見たときは、示されている曲がり方をしてはいけないという意味です」と記載されています。
- id: 236
  category: vehicle_information
  question: 気象条件により実技試験に必要とされる場合、車両に備えていなければならない装備の組み合わせは次のうちどれですか？
  choices:
    A: 全天候型フロアマットと救急セット。
    B: アイススクレーパーと緊急用フレア（発炎筒）。
    C: トラクションタイヤまたはチェーン、および作動するウィンドウデフロスター。
    D: GPSナビゲーションシステムとカーカバー。
  answer: C
  explanation: マニュアルには、「気象条件により必要な場合、車両にはトラクションタイヤまたはチェーン、ワイパー、ヘッドライト、テールライト、およびウィンドウデフロスターを備えていなければなりません」と明記されています。
- id: 237
  category: driver_testing
  question: DMVではなく、認定された第三者試験機関（Third Party drive tester）を利用する場合の潜在的なデメリットは何ですか？
  choices:
    A: 試験が大幅に難しくなる。
    B: 試験費用が高くなる可能性がある。
    C: 結果がDMVによって認められない。
    D: 予約可能な時間枠が少ない。
  answer: B
  explanation: マニュアルには、第三者試験機関はスケジュールの柔軟性が高い一方で、「ただし、第三者試験機関を利用する場合、試験費用が高くなる可能性があります」と記されています。
- id: 238
  category: signs_and_signals
  question: 「進入禁止（Do Not Enter）」の標識は、主に何を警告していますか？
  choices:
    A: 前方の道路が工事中であること。
    B: その道路が私道であること。
    C: 一方通行の道路に逆方向に進入しようとしていること。
    D: 事故のため道路が一時的に閉鎖されていること。
  answer: C
  explanation: マニュアルには、「進入禁止（Do Not Enter）– 正方形：この標識は、道路や高速道路に進入しないよう警告するものです。逆走している場合にこの標識を目にします」と記載されています。
- id: 239
  category: driver_testing
  question: 実技試験の予約は、希望日の少なくともどれくらい前に行うことが推奨されていますか？
  choices:
    A: 1週間前。
    B: 2週間前。
    C: 3週間前。
    D: 4週間前。
  answer: C
  explanation: マニュアルでは、「試験を受けたい日の少なくとも3週間前に予約を入れるのが良いでしょう」とアドバイスしています。
- id: 240
  category: vehicle_information
  question: 実技試験に使用する車両として認められるためには、助手席がどのような状態でなければなりませんか？
  choices:
    A: 電動調整機能とヒーターが装備されていること。
    B: 本革またはそれに類する素材で覆われていること。
    C: 適切で固定されており、適度に清潔であること。
    D: 物が置かれておらず、周囲に何もないこと。
  answer: C
  explanation: 実技試験の車両装備チェックリストには、「適切で固定されており、適度に清潔な助手席」が含まれています。
- id: 241
  category: driver_testing
  question: DMVで試験を受ける前に、必ず行わなければならないことは何ですか？
  choices:
    A: 少なくとも1週間前までに予約を入れる。
    B: 試験手数料を支払い、身分、生年月日、および住所の証明書を提示する。
    C: オンラインの事前審査アンケートに回答する。
    D: 所持している他州の身分証明書を返納する。
  answer: B
  explanation: マニュアルには、「試験を受ける際は毎回、まず試験手数料を支払い、身分、生年月日、および現住所の証明書を提示しなければならない」と記載されています。
- id: 242
  category: signs_and_signals
  question: 「Keep Right（右側通行）」の標識は何を示していますか？
  choices:
    A: 次の交差点で右折しなければならない。
    B: 低速車は右側の車線を走行しなければならない。
    C: この先に交通島、中央分離帯、または障害物があるため、その右側を通行しなければならない。
    D: この先の道路が右にカーブしている。
  answer: C
  explanation: マニュアルには、「Keep Right」の標識は「この先、交通島、中央分離帯、または障害物によって道路が分かれているため、右側を通行すること」を意味すると記載されています。
- id: 243
  category: signs_and_signals
  question: 「No Turn on Red（赤信号での右左折禁止）」の標識がある交差点に近づいたとき、どうしなければなりませんか？
  choices:
    A: 歩行者がいなければ、一時停止した後に右折してもよい。
    B: 信号が青に変わるまで待ってから曲がらなければならない。
    C: 一方通行の道路から別の一方通行の道路へ左折してもよい。
    D: 交差するすべての交通に道を譲った後であれば、曲がってもよい。
  answer: B
  explanation: マニュアルでは、「No Turn on Red」の標識について、「赤信号の間は曲がってはならない。信号が青に変わるまで待たなければならない」と規定されています。
- id: 244
  category: signs_and_signals
  question: 「Left Turn Yield on Green（青信号での左折は譲れ）」の標識はどういう意味ですか？
  choices:
    A: 青信号で左折する優先権がある。
    B: 左折中、対向車はあなたに道を譲らなければならない。
    C: 青の円形信号では、左折する前に対向車や歩行者に道を譲らなければならない。
    D: 青の矢印信号が出ているときのみ左折できる。
  answer: C
  explanation: マニュアルには、この標識は「青の円形信号では、安全に曲がれるようになるまで、対向車や歩行者に優先権を譲ること」を意味すると記載されています。
- id: 245
  category: signs_and_signals
  question: 横断歩道に「Stop Here for Pedestrians（歩行者のためにここで停止）」の標識がある場合、歩行者がいるときはどこで停止しなければなりませんか？
  choices:
    A: 横断歩道の少なくとも20フィート手前。
    B: 停止線。
    C: 横断歩道の手前で、視界が十分に確保できる場所ならどこでもよい。
    D: 歩行者が自分の走行車線側にいる場合のみ。
  answer: B
  explanation: マニュアルには、「歩行者が横断歩道内にいるときは、停止線で停止すること」と指示されています。
- id: 246
  category: signs_and_signals
  question: 「Winding Road（屈曲あり）」の標識は何を警告していますか？
  choices:
    A: この先の道路は濡れていると滑りやすい。
    B: すぐ先に急な曲がり角がある。
    C: 道路に一連の曲がり角やカーブがある。
    D: この先の道路が右にカーブした後、左にカーブしている。
  answer: C
  explanation: マニュアルでは、「Winding Road」の標識は「道路に一連の曲がり角やカーブがあること」を示すと定義されています。
- id: 247
  category: signs_and_signals
  question: 「Lane Reduction（車線減少）」の標識を見たとき、運転者はどのような行動をとらなければなりませんか？
  choices:
    A: 進む前に完全に停止する。
    B: 加速して、隣の車線の車の前に出る。
    C: 走行中の車線がまもなく終わるため、直進車線（本線）へ合流する。
    D: 直ちにハイウェイから出る。
  answer: C
  explanation: マニュアルには、「Lane Reduction」の標識について、「示された車線がまもなく終了する。その車線を走行している車両は、直進車線（本線）へ合流しなければならない」と記載されています。
- id: 248
  category: signs_and_signals
  question: 「Two-Way Traffic Ahead（この先対面通行）」の標識は何を警告していますか？
  choices:
    A: 中央分離帯のある幹線道路がまもなく終了する。
    B: 走行中の一方通行の道路が、まもなく対面通行の道路に合流する。
    C: 他車を追い越すことが許可されている。
    D: この先に合流車線がある。
  answer: B
  explanation: マニュアルには、「Two-Way Traffic Ahead」の標識は「一方通行の道路がこの先で対面通行の道路に合流する。対向車と向き合うことになる」という意味であると説明されています。
- id: 249
  category: signs_and_signals
  question: 「Low Clearance（高さ制限）」の標識が提供する主な警告は何ですか？
  choices:
    A: この先の道路に急勾配がある。
    B: この先の高架が低いため、車両の背が高すぎると下を通過できない可能性がある。
    C: この先に踏切がある。
    D: この先、制限速度が引き下げられる。
  answer: B
  explanation: マニュアルには、「Low Clearance」の標識は「この先の高架はクリアランス（高さ）が低い。車両が高すぎて下を通過できない場合は進んではならない」という意味であると記載されています。
- id: 250
  category: signs_and_signals
  question: 「Slippery When Wet（濡れている時滑りやすい）」の標識はどういう意味ですか？
  choices:
    A: この区域では常に制限速度以下で走行しなければならない。
    B: 路面が濡れているとき、通常よりも非常に滑りやすくなる。
    C: 大雨の際に道路が冠水しやすい。
    D: 雨が降っているときはハザードランプを点灯させなければならない。
  answer: B
  explanation: マニュアルにおけるこの標識の定義は、「路面が濡れているとき、通常よりも非常に滑りやすくなる」です。
- id: 251
  category: signs_and_signals
  question: 高速道路の緑色の出口標識に記載されている数字の目的は何ですか？
  choices:
    A: 次の都市までの距離を示している。
    B: 現在走行中の高速道路の路線番号を示している。
    C: どの出口で降りればよいかを知るのに役立つ。
    D: 出口ランプの推奨速度である。
  answer: C
  explanation: マニュアルには、「出口標識の数字は、どの出口で降りればよいかを知るのに役立ちます」と記載されています。
- id: 252
  category: signs_and_signals
  question: 史跡、景勝地、公園を指し示す標識は何色ですか？
  choices:
    A: 青色
    B: 緑色
    C: 黄色
    D: 茶色
  answer: D
  explanation: マニュアルには次のように規定されています。「歴史的、文化的、およびレクリエーション標識：これらの茶色の標識は、史跡や文化的な場所を指し示します。また、景勝地、ピクニック場、公園も指し示します。」
- id: 253
  category: signs_and_signals
  question: マニュアルによると、黄色の円形信号が点灯している交差点に近づくとき、どのようにすべきですか？
  choices:
    A: 信号が赤になる前に交差点を通過できるよう加速する。
    B: 交差点に入る前に停止する。安全に停止できない場合は、注意して通過する。
    C: 完全に停止し、信号が青に変わるのを待つ。
    D: 減速し、右折の準備をする。
  answer: B
  explanation: マニュアルには次のように記載されています。「黄色の点灯信号は、信号がまもなく赤に変わることを警告しています。交差点に入る前に停止してください。安全に停止できない場合は、注意して通過してください。」
- id: 254
  category: signs_and_signals
  question: 赤色の矢印信号が点灯している場合、どのような右左折が許可されますか？
  choices:
    A: 矢印が緑色に変わるまで、いかなる右左折も許可されない。
    B: 一時停止した後、矢印の方向にのみ曲がることができる。
    C: 完全に停止した後、赤色の円形信号で許可されているのと同じ右左折ができる。
    D: 右折はできるが、左折はできない。
  answer: C
  explanation: マニュアルでは赤色の矢印について次のように説明されています。「標識で禁止されていない限り、一時停止した後は、赤色の点灯信号で許可されているのと同じ右左折が赤色の矢印でも許可されます。」
- id: 255
  category: sharing_the_road
  question: 公共交通機関専用車線（transit-only lane）に「右折許可（Right Turns Permitted）」の標識がある場合、右折するためにその車線をどのように使用すべきですか？
  choices:
    A: 右折の準備のために、その車線の全長を使用することができる。
    B: 右折する前に、公共交通車両を追い越すために加速しなければならない。
    C: 右折のために一時的にその車線を使用できるが、常に公共交通車両に道を譲り、その後方に合流しなければならない。
    D: バスが見える場合は、その車線に入ることができない。
  answer: C
  explanation: マニュアルには、「右折のために一時的に公共交通車線を使用することができます... 常に公共交通車両や公共交通車線を走行する自転車に道を譲ってください。それらが通過した後、その後方の車線に合流してください」と記載されています。
- id: 256
  category: signs_and_signals
  question: 黄色の矢印が点滅している信号に近づいたとき、対向車の状況について何を示していますか？
  choices:
    A: 対向車側も黄色の矢印が点滅している。
    B: 対向車側は赤色の点灯信号であり、停止しなければならない。
    C: 対向車側は緑色の点灯信号である。
    D: 対向車は赤信号に備えて停止の準備をしている。
  answer: C
  explanation: マニュアルには、黄色の矢印が点滅している場合、緑色の点灯信号である対向車に道を譲らなければならないと記載されています。
- id: 257
  category: safe_driving_rules
  question: 左折する際、緑色の矢印信号と緑色の円形信号の主な違いは何ですか？
  choices:
    A: 緑色の矢印は停止して隙間を待たなければならないことを意味し、緑色の円形はすぐに曲がれることを意味する。
    B: 緑色の矢印はその方向への優先権（right of way）を与えるが、緑色の円形は対向車や歩行者に道を譲る必要がある。
    C: 両方の信号は同じ意味だが、矢印は交通量の多い場所で使用される。
    D: 緑色の矢印は左折のみを許可し、緑色の円形は左折、右折、直進を許可する。
  answer: B
  explanation: 緑色の矢印の点灯は、示された方向への優先権があることを意味します。緑色の円形信号の点灯は左折を許可しますが、まず歩行者や対向車に道を譲らなければなりません。
- id: 258
  category: safe_driving_rules
  question: センターラインが引かれていない対面通行の道路を走行する場合、道路上の位置に関してどのような法的責任がありますか？
  choices:
    A: 常に道路の右端にできるだけ寄って走行しなければならない。
    B: 対向車がいない場合は、道路の中央を使用してもよい。
    C: 対向車に対して、道路の少なくとも半分を譲らなければならない。
    D: より速い速度で走行している車両に優先権がある。
  answer: C
  explanation: マニュアルには次のように記載されています。「センターラインがなく、交通が双方向に行き交う道路では、ドライバーは対向車に対して道路の少なくとも半分を譲らなければなりません。」
- id: 259
  category: safe_driving_rules
  question: 他の特定の定義（学校、商業、居住区域など）に該当しないオレゴン州の道路および高速道路において、別の速度制限が掲示されていない場合の法定最高速度は何マイルですか？
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: 法定速度制限は、標識などで別途掲示されていない限り、「他のいかなる定義にも該当しないすべての道路および高速道路において55 mph」です。
- id: 260
  category: signs_and_signals
  question: オレゴン州における可変推奨速度（Variable Advisory Speed）標識について、正しく説明しているのは次のうちどれですか？
  choices:
    A: 白黒で「speed limit（制限速度）」と書かれており、法的強制力がある。
    B: 黄色で「advisory speed（推奨速度）」と書かれており、現在の状況に応じた速度を推奨する。
    C: オレンジ色で「work zone（作業区域）」と書かれており、作業員がいる場合にのみ適用される。
    D: 青色で「minimum speed（最低速度）」と書かれており、法的に走行できる最低速度を示している。
  answer: B
  explanation: マニュアルには、「可変推奨速度標識は黄色で、『advisory speed（推奨速度）』と書かれています。これらの標識は、走行条件に基づいた速度を推奨するものです...
    これらは制限速度ではありません...」と規定されています。
- id: 261
  category: sharing_the_road
  question: マニュアルの歩行者死亡データによると、車両に衝突された歩行者の死亡リスクが50%になるのは、車両がおよそ時速何マイル（mph）で走行している場合ですか？
  choices:
    A: 時速23マイル
    B: 時速35マイル
    C: 時速42マイル
    D: 時速58マイル
  answer: C
  explanation: マニュアルのチャートには、時速42マイルで走行中の車両に衝突された歩行者の死亡リスクは50%であると示されています。
- id: 262
  category: signs_and_signals
  question: 反対方向に進む交通を分ける以外に、黄色の実線の路面標示のもう一つの主な用途は何ですか？
  choices:
    A: 車道の右端を示すため。
    B: 自転車専用レーンを示すため。
    C: 一方通行の道路やランプ（接続路）の左端を示すため。
    D: 駐車ゾーンを指定するため。
  answer: C
  explanation: マニュアルには、黄色の標示は反対方向に進む交通を分けるため、および「一方通行の道路やランプの左端を示すため」に使用されると記載されています。
- id: 263
  category: safe_driving_rules
  question: 2本の黄色の実線を越えて運転することが法的に許可されるのは、どのような特定の状況下ですか？
  choices:
    A: 時速25マイル未満で走行している低速車両を追い越すとき。
    B: 対向車に道を譲った後、道路に出入りするために左折するとき。
    C: 前方の道路が少なくとも500フィート先まで空いているとき。
    D: 2本の黄色の実線を越えることはいかなる場合も許可されません。
  answer: B
  explanation: マニュアルには、2本の黄色の実線に関する例外として、「対向車がいなくなるのを待った後、道路に出入りするために2本の黄色の実線を越えて左折することができる」と記載されています。
- id: 264
  category: signs_and_signals
  question: 交差点に近づいたときに信号が黄色の点灯に変わった場合、正しく最も安全な行動は何ですか？
  choices:
    A: 信号が赤に変わる前に交差点を通過できるよう加速する。
    B: たとえ交差点の真ん中にいても、直ちに停止する。
    C: 安全に停止できる場合は、交差点に入る前に停止する。
    D: 減速して停止の準備をするが、後続車が近い場合はそのまま進む。
  answer: C
  explanation: マニュアルでは、黄色の点灯信号について次のようにアドバイスしています。「交差点に入る前に停止してください。安全に停止できない場合は、注意して通過してください。」
- id: 265
  category: safe_driving_rules
  question: 駐車車両や道路上の障害物を避けるためにセンターラインの左側（反対車線側）を走行しなければならない場合、まず何をしなければなりませんか？
  choices:
    A: 対向車のドライバーに警告するためにクラクションを鳴らす。
    B: すべての対向車に道を譲る。
    C: ハザードランプを点灯させる。
    D: 障害物を素早く回避するために速度を上げる。
  answer: B
  explanation: マニュアルには次のように記載されています。「道路上の危険を回避するため、またはその他の理由でセンターラインの左側を走行しなければならない場合は、対向車に道を譲らなければなりません。」
- id: 266
  category: driver_responsibility
  question: オレゴン州ドライバー・マニュアルでは、「譲り（yielding）」という行為をどのように定義していますか？
  choices:
    A: いかなる時も完全に停止すること。
    B: 他の車両や歩行者が安全に通行できるように、減速または停止すること。
    C: 他のドライバーを先に進ませるために手信号を送ること。
    D: 自分に優先権があるため、速度と位置を維持すること。
  answer: B
  explanation: マニュアルでは、譲ることを「他の車両や歩行者が安全に通行できるように、減速または停止しなければならない」と定義しています。
- id: 267
  category: signs_and_signals
  question: 「可変速度制限（Variable Speed Limit）」標識と「可変推奨速度（Variable Advisory Speed）」標識の違いは何ですか？
  choices:
    A: 可変速度制限標識は黄色で速度を推奨するものであり、推奨速度標識は白黒で法的制限である。
    B: 可変速度制限標識は白黒で法的強制力のある制限速度であり、推奨速度標識は黄色で推奨事項である。
    C: 違いはありません。これらの用語は同じ意味で使用されます。
    D: 可変速度制限標識は工事区間でのみ使用され、推奨速度標識は気象条件のために使用される。
  answer: B
  explanation: マニュアルではこの2つを区別しています。「可変速度制限（Variable Speed Limit）」標識は白黒で「speed limit」と書かれており、法的強制力があります。「可変推奨速度（Variable
    Advisory Speed）」標識は黄色で「advisory speed」と書かれており、推奨事項です。
- id: 268
  category: signs_and_signals
  question: 中央線が2本ある道路を走行中、自分の車線側の線が黄色の実線である場合、これは何を示していますか？
  choices:
    A: 一方通行の道路であること。
    B: 一時停止標識に近づいていること。
    C: 追い越しが禁止されている車線であること。
    D: 対向車が見えない場合は追い越しができること。
  answer: C
  explanation: マニュアルでは、実線と破線の2本の中央線について次のように説明しています。「自分の車線側の黄色い線が実線である場合は、追い越しが禁止されていることを示します。」
- id: 269
  category: signs_and_signals
  question: 赤色の矢印信号が点灯しているときに右左折する場合のルールは何ですか？
  choices:
    A: いかなる状況下でも右左折は認められません。
    B: 完全に停止し、交通や歩行者に道を譲った後に右左折できます。
    C: 赤色の円形信号で許可されているものと同じ右左折が、赤色の矢印信号でも許可されます。
    D: 明示的に許可する標識が掲示されている場合にのみ右左折できます。
  answer: C
  explanation: マニュアルには次のように記載されています。「赤色の矢印は、赤信号での右左折が許可されている場合を除き、停止し、信号が変わるまで停止したままでいることを意味します。赤色の円形信号で許可されているものと同じ右左折が、赤色の矢印信号でも許可されます。」
- id: 270
  category: signs_and_signals
  question: ペイントされた中央分離帯にある黄色の斜線の縞模様（ゼブラゾーン）の上を走行する際のルールは何ですか？
  choices:
    A: 低速車両を追い越すためにその上を走行してもよい。
    B: 交通が空いている場合は、そこを横切って左折することが許可されている。
    C: これらの縞模様の中を走行したり、そこを横切って左折したりすることは違法である。
    D: このエリアを左折のための待機場所として一時的に使用してもよい。
  answer: C
  explanation: マニュアルには、黄色の斜線は固定物や車両の使用が許可されていないエリアを知らせるために使用されると記載されています。また、「これらの縞模様の中を走行したり、そこを横切って左折したりすることは違法である」と明記されています。
- id: 271
  category: safe_driving_rules
  question: 同一方向に進む車線間の2本の白い実線は何を示していますか？
  choices:
    A: 車線が終了するため、すぐに合流しなければならない。
    B: 追い越しは許可されているが、推奨されない。
    C: 車線変更は禁止されている。
    D: 高乗車人数車（HOV）専用の車線である。
  answer: C
  explanation: マニュアルによると、2本の白い実線は車線変更が禁止されており、現在の車線を維持しなければならないことを意味します。多くの場合、車線変更禁止の標識が併設されています。
- id: 272
  category: signs_and_signals
  question: 路面に赤い実線が塗られ、「BUS ONLY」と書かれた車線に遭遇しました。これは何を意味しますか？
  choices:
    A: 消防車専用車線であり、常に空けておかなければならない。
    B: 公共交通機関専用車線（Transit Only lane）であり、一般車を運転して進入することはできない。
    C: 100フィート以内で右折する場合に限り、この車線を使用できる。
    D: すべての車両のための緊急停止用車線である。
  answer: B
  explanation: マニュアルには、赤い実線の車線は公共交通機関専用車線（Transit Only lane）であり、一般車用ではないと記されています。これらの車線には「BUS
    ONLY」「BUS BIKE ONLY」または「LRT」と表示されている場合があります。
- id: 273
  category: signs_and_signals
  question: 路面に描かれた白いシェブロン（V字型のマーク）の目的は何ですか？
  choices:
    A: 譲らなければならない地点を示すため。
    B: 前方にある固定物や、車両の通行が許可されていない区域を知らせるため。
    C: 交通量の多い場所での歩行者用横断歩道を示すため。
    D: 複雑な交差点で適切な車線へ誘導するため。
  answer: B
  explanation: マニュアルには、「白いシェブロン：前方道路上の固定物や、車両の通行が許可されていないその他の区域を知らせるために使用される場合があります」と記載されています。
- id: 274
  category: defensive_driving
  question: マニュアルによると、前走車との車間距離が近すぎないかを確認するための正しい手順は何ですか？
  choices:
    A: ボンネット越しに前走車の屋根が見えることを確認する。
    B: 自車と前走車の間に、少なくとも車3台分の距離を維持する。
    C: クラクションを鳴らして、前のドライバーが反応するか確認する。
    D: 前走車が固定物を通過してから、自分がその地点に到達するまでの秒数を数える。
  answer: D
  explanation: マニュアルには特定の方法が概説されています。「前走車の後部が標識や柱などの横を通過するのを確認します。自分が同じ地点に到達するまでにかかる秒数を数えてください。」2秒未満の場合は、車間距離が近すぎます。
- id: 275
  category: defensive_driving
  question: 坂道で停車する際、前走車との車間距離を広くとるべきなのはなぜですか？
  choices:
    A: 交通が動き出したときに助走をつけるため。
    B: 傾斜地ではブレーキの効きが悪くなるため。
    C: 前走車が発進する際に後退する可能性があるため。
    D: 車線の間に緊急車両が通れるようにするため。
  answer: C
  explanation: マニュアルには、車間距離を広くとる必要がある状況がいくつか挙げられており、その中に「坂道で停車する場合。前走車が動き出す際に後退する可能性があります」とあります。
- id: 276
  category: defensive_driving
  question: 複数の車線がある通りで他の車両と並んで走行する場合、側方のスペース（サイド・スペース・クッション）を確保するための最も安全な方法は何ですか？
  choices:
    A: 隣の車両と全く同じ速度を維持する。
    B: できるだけ自車線の右端に寄って走行する。
    C: 少し速度を落として下がるか、相手の車両の前に出る。
    D: 隣のドライバーに減速するよう合図を送る。
  answer: C
  explanation: 側方のスペースを維持するために、マニュアルでは他の車の真横を走行し続けるのを避けるため、「可能であれば、少し速度を落として下がるか、相手の車の前に出る」ことを推奨しています。
- id: 277
  category: defensive_driving
  question: 駐車車両の列の横を走行する場合、車線内の位置をどのように調整すべきですか？
  choices:
    A: 必要に応じてセンターラインを越え、車線の左端まで移動する。
    B: 車線の中央を維持し、速度を上げる。
    C: 車線を逸脱しない範囲で、駐車車両から離れる。
    D: 駐車車両の近くにいる人に警告するため、継続的にクラクションを鳴らす。
  answer: C
  explanation: マニュアルでは、ドアが突然開いたり歩行者が飛び出したりするのを避けるため、「車線を逸脱しない範囲で駐車車両から離れ、自車と駐車車両の間に余分なスペースを確保する」ことを推奨しています。
- id: 278
  category: sharing_the_road
  question: フリーウェイを走行中、オンランプ（進入路）から合流しようとしている車両を見かけた場合、安全な合流を助けるために何をすべきですか？
  choices:
    A: 相手が進入する前にオンランプを通り過ぎるよう加速する。
    B: 相手側に譲る義務があるため、速度と車線位置を維持する。
    C: 隣に車がいなければ、左側の車線に移動する。
    D: ハイビームを点滅させて、待機すべきだと合図を送る。
  answer: C
  explanation: マニュアルには「フリーウェイに入る車両のためにスペースを空けてください。隣に誰もいない場合は、車線を移動してください」と記されています。
- id: 279
  category: defensive_driving
  question: 減速または停止する必要があるとき、自車の装備を使用して後方に安全なスペース（スペース・クッション）を維持するにはどうすればよいですか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）を点ける。
    B: ブレーキを軽く踏んで、ブレーキランプを点灯させる。
    C: クラクションを軽く数回鳴らす。
    D: ヘッドライトを点滅させる。
  answer: B
  explanation: マニュアルでは、後続車との安全な距離を保つ方法として、「減速または停止しなければならないときに、ブレーキを軽く踏んで早めに合図を送ること。ブレーキランプが点灯することで、後続車のドライバーに減速を知らせることができます」と提案しています。
- id: 280
  category: safe_driving_rules
  question: 右左折車線や自転車車線などで使用される「幅の広い白い実線」を越えることに関するルールは何ですか？
  choices:
    A: 厳格に禁止されている。
    B: 許可されているが、推奨されない。
    C: 緊急時のみ許可される。
    D: 制限なく許可される。
  answer: B
  explanation: マニュアルには、「幅の広い白い実線を越えることは許可されていますが、推奨されません」と記されています。これは、越えることが禁止されている「2本の白い実線」とは異なります。
- id: 281
  category: signs_and_signals
  question: 高速道路の入口ランプにある白い点線は何を示していますか？
  choices:
    A: 車線がまもなく終了するため、出口に向かわなければならないことを示している。
    B: 高速道路に進入中であり、交通の流れに合流しなければならないことを示している。
    C: ピーク時のみ相乗り（カープール）専用車線であることを示している。
    D: 減速区間の始まりを示している。
  answer: B
  explanation: マニュアルには、「高速道路の入口ランプで使用される場合、高速道路に進入中であり、交通の流れに合流しなければならないことを知らせるものである」と記載されています。
- id: 282
  category: signs_and_signals
  question: 交差点内に白い点線が描かれている場合、その目的は何ですか？
  choices:
    A: 一時的な横断歩道を示すため。
    B: 信号が赤になったときに停止すべき場所を示すため。
    C: オフピーク時に駐車が許可されている場所を示すため。
    D: 交差点を通過して適切な車線に入るためのガイドとするため。
  answer: D
  explanation: マニュアルでは、白い点線の用途の一つとして、「交差点内で使用される場合、交差点を通過して適切な車線に入るためのガイドとなる」と説明されています。
- id: 283
  category: safe_driving_rules
  question: 両側に2本の黄色の実線があるペイントされた中央分離帯（メディアン）を横切ることができるのは、どのような条件のときですか？
  choices:
    A: 左折しようとしている車両を追い越すとき。
    B: 対向車がいなくなるのを待ってから左折するとき。
    C: 「転回禁止（No U-Turn）」の標識がない場所でUターンするとき。
    D: ペイントされた中央分離帯を法的に横切ることは決してできない。
  answer: B
  explanation: マニュアルには、「対向車がいなくなるのを待ってから、ペイントされた中央分離帯を横切って左折することができる。ただし、ペイントされた中央分離帯を右左折専用車線として使用することはできない」と記載されています。
- id: 284
  category: signs_and_signals
  question: 路肩線やフォグライン（霧線）として使用される白い実線の主な目的は何ですか？
  choices:
    A: 反対方向に進む交通車線を分けるため。
    B: 追い越しが禁止されていることを示すため。
    C: ドライバーが道路から外れないようにするため。
    D: 駐車が許可されている区域を示すため。
  answer: C
  explanation: マニュアルでは、白い実線は「ドライバーが道路から外れないようにするための路肩線やフォグラインとして使用される」と定義されています。
