questions:
- id: 1
  category: license_system
  question: 2025年5月現在、18歳以上の個人が米国内の民間航空機に搭乗するために必要な身分証明書の種類は何ですか？
  choices:
    A: 標準発行のオレゴン州運転免許証
    B: 連邦政府が認める形式の身分証明書
    C: 標準発行のオレゴン州学習許可証
    D: 出生証明書
  answer: B
  explanation: マニュアルには、2025年5月以降、18歳以上の方が米国内の民間航空機に搭乗するには、連邦政府が認める形式の身分証明書が必要であると記載されています。
- id: 2
  category: license_system
  question: 2025年5月現在、米国内の民間航空機への搭乗において、認められない身分証明書は次のうちどれですか？
  choices:
    A: 米国パスポート
    B: 標準発行のREAL IDではないオレゴン州運転免許証
    C: 米軍の身分証明書
    D: 永住権カード（グリーンカード）
  answer: B
  explanation: マニュアルによると、標準発行のREAL IDではないオレゴン州運転免許証、学習許可証、または身分証明書は、2025年5月以降、飛行機の搭乗には認められなくなります。
- id: 3
  category: driver_responsibility
  question: オレゴン州運転者マニュアルは、法廷で法的判例として引用することができますか？
  choices:
    A: はい。オレゴン州修正法案（ORS）の正確な文言が含まれているためです。
    B: はい。ただし交通裁判所に限ります。
    C: いいえ。これは法の情報源ではなく、法的判例として依拠されるべきではありません。
    D: いいえ。地方自治体の条例で承認されない限り引用できません。
  answer: C
  explanation: マニュアルには次のように明記されています。「このマニュアルは法の情報源ではなく、法廷やその他の行政・法的手続きにおいて法的判例として依拠または引用されるべきではありません。」
- id: 4
  category: safe_driving_rules
  question: マニュアルによると、オレゴン州運転者マニュアルに含まれていない追加の条例を定めている可能性があるのはどこですか？
  choices:
    A: 地方自治体
    B: 連邦政府
    C: 隣接する州
    D: 私有地の所有者
  answer: A
  explanation: マニュアルには「地方自治体は、このマニュアルに含まれていない追加の条例を定めている場合があります」と記されています。
- id: 5
  category: driver_responsibility
  question: なぜ新規ドライバーは路上でより大きなリスクにさらされると考えられているのですか？
  choices:
    A: 古い車両を運転するため
    B: 運転経験が不足しているため
    C: 視力検査を受ける必要がないため
    D: 夜間に運転することが多いため
  answer: B
  explanation: マニュアルには「新規ドライバーは運転経験が不足しているため、より大きなリスクにさらされています」と記載されています。
- id: 6
  category: safe_driving_rules
  question: 運転を練習している場合、安全性を高めるための最善の方法の一つは何ですか？
  choices:
    A: 日中のみ運転する
    B: 新車を購入する
    C: 有益な指導を受け、十分な練習を積む
    D: 運転中にマニュアルを読む
  answer: C
  explanation: マニュアルによると、「運転を習得中の場合、安全性を向上させる最善の方法の一つは、有益な指導を受け、十分な練習を積むことです」とされています。
- id: 7
  category: driver_responsibility
  question: オレゴン州運転者マニュアルでは、運転はどのようなものだと強調されていますか？
  choices:
    A: 憲法上の権利
    B: 特権（プリビレッジ）
    C: 雇用のための要件
    D: 連邦政府の義務
  answer: B
  explanation: マニュアルには「運転は特権（プリビレッジ）であり、道路上で全員の安全を確保するために私たち全員が役割を果たすことが重要であることを忘れないでください」と記載されています。
- id: 8
  category: alcohol_drugs_health
  question: マニュアルにおいて、全員を危険にさらすと明記されている行為は次のうちどれですか？
  choices:
    A: 大麻を使用した後の影響を受けた状態での運転
    B: ラジオを聴くこと
    C: マニュアルトランスミッション車を運転すること
    D: 友人と相乗りすること
  answer: A
  explanation: マニュアルでは、「飲酒、大麻の使用、または精神を変化させるその他の物質を使用した後の影響を受けた状態での運転（impaired driving）は、全員を危険にさらす」と警告しています。
- id: 9
  category: license_system
  question: オレゴン州運転者マニュアルは、どの種類の運転資格の取得要件について説明していますか？
  choices:
    A: クラスA営利（Class A commercial）
    B: クラスB営利（Class B commercial）
    C: クラスC非営利（Class C non-commercial）
    D: モーターサイクル限定免許
  answer: C
  explanation: マニュアルには「このマニュアルは、クラスC非営利（Class C non-commercial）運転資格の取得要件のみを扱っています」と記載されています。
- id: 10
  category: driver_testing
  question: 初めて運転資格を申請する際、DMVはどの3つの項目をテストしますか？
  choices:
    A: 聴力、運転知識、車両のメンテナンス
    B: 視力、運転知識、運転技能
    C: 反射神経、視力、縦列駐車
    D: 視力、病歴、運転技能
  answer: B
  explanation: マニュアルには「初めての運転資格取得のために、DMVは視力、運転知識、および運転技能をテストします」と記載されています。
- id: 11
  category: driver_testing
  question: DMVで試験を受ける際は毎回、身分証明書、生年月日、および他に何を提示する必要がありますか？
  choices:
    A: 現住所
    B: 車両保険の証明
    C: 社会保障カード (Social Security card)
    D: 高校の成績証明書
  answer: A
  explanation: マニュアルには、「試験を受ける際は毎回、まず試験手数料を支払い、身分証明書、生年月日、および現住所を提示しなければならない」と記載されています。
- id: 12
  category: driver_testing
  question: DMVの試験手数料はどのように支払わなければなりませんか？
  choices:
    A: 車両登録料と合算して支払う
    B: 他のいかなる手数料とも切り離して支払う
    C: クレジットカードのみで支払う
    D: 試験に合格した後に支払う
  answer: B
  explanation: マニュアルには、「試験手数料は、他のいかなる手数料とも切り離して支払わなければならない」と明記されています。
- id: 13
  category: driver_testing
  question: オレゴン州DMVで視力検査を受ける際の手数料はいくらですか？
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: 手数料はかからない
  answer: D
  explanation: マニュアルによると、「視力検査を受ける際の手数料はかかりません」。
- id: 14
  category: driver_testing
  question: 眼鏡やコンタクトレンズを着用してDMVの視力検査を受けた場合、どうなりますか？
  choices:
    A: それらを外して再検査を受けるよう求められる。
    B: 運転資格に矯正レンズが必要であることが記載される。
    C: 制限付き免許のために追加料金を支払わなければならない。
    D: 自動的に視力検査不合格となる。
  answer: B
  explanation: マニュアルには、「眼鏡やコンタクトレンズを着用して検査を受けた場合、運転資格に矯正レンズが必要であることが記載されます」とあります。
- id: 15
  category: driver_testing
  question: DMVの視力検査に合格しなかった場合、次のステップは何ですか？
  choices:
    A: 再受験まで30日間待たなければならない。
    B: 運転資格を永久に失う。
    C: DMVから、免許を持つ視力専門医に持参するための書類が渡される。
    D: 特殊な運転技能試験を受けなければならない。
  answer: C
  explanation: マニュアルでは、「視力検査に合格しなかった場合、DMVは免許を持つ視力専門医に持参するための書類を渡します」と説明されています。
- id: 16
  category: driver_testing
  question: クラスC知識試験（学科試験）に合格するには、何問正解する必要がありますか？
  choices:
    A: '25'
    B: '28'
    C: '30'
    D: '35'
  answer: B
  explanation: クラスC知識試験は35問の多肢選択式で、合格点を得るには28問に正解する必要があります。
- id: 17
  category: penalties_and_points
  question: DMVの事務所で知識試験（学科試験）中に不正行為を行ったと判断された場合、どのような罰則がありますか？
  choices:
    A: 不合格となり、30日間は再受験できない。
    B: 不合格となり、90日間は再受験できない。
    C: 罰金を支払い、直ちに再受験しなければならない。
    D: 許可証が永久に剥奪される。
  answer: B
  explanation: マニュアルには、不正行為を行ったと判断された場合、試験は不合格となり、90日間は再受験が認められないと記載されています。
- id: 18
  category: driver_testing
  question: オンラインで知識試験（学科試験）を受ける際、次のどのデバイスの使用が許可されていますか？
  choices:
    A: 携帯電話
    B: タブレット
    C: ウェブカメラ付きのデスクトップコンピューター
    D: タッチスクリーンデバイス
  answer: C
  explanation: オンラインで知識試験を受けるには、キーボード、マウス、ウェブカメラを備えたデスクトップまたはノートパソコンを使用する必要があります。携帯電話やタブレットなどのタッチスクリーンデバイスは使用できません。
- id: 19
  category: driver_testing
  question: 18歳未満でオンライン知識試験（学科試験）を受ける場合、試験監督者（Proctor）の要件は何ですか？
  choices:
    A: 18歳以上であり、無制限に試験を監督できる。
    B: 21歳以上であり、24時間以内に2回までしか試験を監督できない。
    C: 免許を持つ運転教官でなければならない。
    D: 親または法的保護者でなければならない。
  answer: B
  explanation: 18歳未満の場合、21歳以上の試験監督者がオンライン試験を監督する必要があり、試験監督者は24時間以内に2回までしか試験を監督できません。
- id: 20
  category: driver_testing
  question: DMVの事務所で受験することを求められるまでに、オンラインで知識試験（学科試験）を試行できる最大回数は何回ですか？
  choices:
    A: 2回
    B: 3回
    C: 4回
    D: 5回
  answer: C
  explanation: オンライン試験は合計4回まで受けることができます。4回試行した後は、DMVの事務所で受験しなければなりません。
- id: 21
  category: driver_testing
  question: DMVは、過去何年以内にODOT承認の運転者教育コースを修了した証明書を提出した場合、実技試験を免除することがありますか？
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: 過去2年以内にODOT承認の運転者教育コースを修了した証明書をDMVが受理した場合、DMVは実技試験を免除することがあります。
- id: 22
  category: driver_testing
  question: 実技試験中、車両への同乗が許可されているのは誰ですか？
  choices:
    A: あなたと試験官のみ
    B: あなた、試験官、および通訳者
    C: あなた、試験官、および家族
    D: あなた、試験官、および21歳以上の免許保持者
  answer: A
  explanation: 実技試験中に車両への同乗が許可されているのは、あなたと試験官のみです。通訳者、家族、友人、またはペットの同乗は認められません。
- id: 23
  category: driver_testing
  question: 実技試験に不合格となった場合、再受験までにどのくらいの期間待つ必要がありますか？
  choices:
    A: 同日の後ほどまで
    B: 翌営業日まで
    C: 丸1週間
    D: 30日間
  answer: B
  explanation: 実技試験に不合格となった場合、再受験するまで翌営業日まで待つ必要があります。
- id: 24
  category: vehicle_information
  question: 実技試験に使用する車両の要件として、正しいものはどれですか？
  choices:
    A: バックカメラが装備されていること。
    B: 助手席のドアが内側と外側の両方のハンドルで開閉できること。
    C: 車齢が10年未満であること。
    D: オートマチック車であること。
  answer: B
  explanation: 試験のために正常に機能していなければならない車両装備には、内側と外側のハンドルで開閉できる助手席のドアが含まれます。
- id: 25
  category: license_system
  question: 18歳未満で運転免許を申請する場合、実技試験を受ける前にどのくらいの期間、許可証（パーミット）を保持している必要がありますか？
  choices:
    A: 少なくとも3ヶ月
    B: 少なくとも6ヶ月
    C: 少なくとも9ヶ月
    D: 少なくとも1年
  answer: B
  explanation: 18歳未満で運転免許を申請する場合、少なくとも6ヶ月間許可証を保持している必要があります。
- id: 26
  category: signs_and_signals
  question: 公式な標識、信号、および路面標示にはいつ従わなければなりませんか？
  choices:
    A: 例外なく常に。
    B: 日中のみ。
    C: 警察官や道路作業員が交通整理を行っている場合を除き、常に。
    D: 緊急車両を運転している場合を除き、常に。
  answer: C
  explanation: 警察官や道路作業員が交通整理を行っている場合を除き、すべての公式な標識、信号、および路面標示に従わなければなりません。
- id: 27
  category: signs_and_signals
  question: 特定の行動や動きを禁止する交通標識は何色ですか？
  choices:
    A: 黄色
    B: オレンジ色
    C: 赤色
    D: 白色
  answer: C
  explanation: 特定の行動や動きを禁止する交通標識は赤色で、交差点での交通の流れを制御することで安全性を高めています。
- id: 28
  category: signs_and_signals
  question: 一時停止標識の下に「Right Turn Permitted Without Stopping（一時停止なしで右折可）」の標識がある場合、何を示していますか？
  choices:
    A: すべての車両が停止せずに進むことができる。
    B: 右折する車両は停止せずに曲がることができるが、他の車両は停止して道を譲らなければならない。
    C: 右折する車両は停止しなければならないが、左折する車両は進むことができる。
    D: 信号が青の場合のみ右折できる。
  answer: B
  explanation: この標識は一時停止標識の下に表示されることがあります。右折する車両は停止せずに曲がることができます。他の車両は停止し、優先権を譲らなければなりません。
- id: 29
  category: signs_and_signals
  question: HOV（高乗車人数車両）標識は何を示していますか？
  choices:
    A: その車線は大型商用トラック専用である。
    B: その車線は2人以上が乗車している車両専用である。
    C: その車線は工事のため閉鎖されている。
    D: その車線は追い越し専用である。
  answer: B
  explanation: HOV（高乗車人数車両）車線は、標識に記載されている通り、少なくとも2人以上が乗車している車両専用です。
- id: 30
  category: signs_and_signals
  question: 車線に描かれた白いひし形は何を示していますか？
  choices:
    A: その車線は指定された追い越し車線である。
    B: その車線は2人以上が乗車している車両専用である。
    C: その車線は終点で、車両は合流しなければならない。
    D: その車線は緊急車両専用である。
  answer: B
  explanation: 車線に描かれた白いひし形は、2人以上が乗車している車両専用のHOV（高乗車人数車両）車線であることを示しています。
- id: 31
  category: signs_and_signals
  question: 既知の潜在的な危険や道路状況の変化を知らせる警戒標識は何色ですか？
  choices:
    A: 赤
    B: 緑
    C: 黄色
    D: 青
  answer: C
  explanation: 警戒標識は黄色で、前方にある既知の潜在的な危険や道路状況の変化をドライバーに知らせます。
- id: 32
  category: signs_and_signals
  question: 「付加車線（Add Lane）」の標識は、ドライバーに何を示していますか？
  choices:
    A: 2つの道路が合流するが、合流のための車線変更（マージ）は必要ないこと。
    B: 指定された車線がまもなく終了するため、合流しなければならないこと。
    C: 表示されている側から交通が合流してくること。
    D: 道路に中央追い越し車線が追加されること。
  answer: A
  explanation: 「付加車線（Add Lane）」の標識は、2つの道路が合流するものの、それぞれの車線が独立して続くため、合流のための車線変更を行う必要がないことを示しています。
- id: 33
  category: safe_driving_rules
  question: 指定されたセーフティ・コリドー（Safety Corridor）を走行する際、どのような行動をとるべきですか？
  choices:
    A: 時速15マイルまで減速する。
    B: 安全のためライトを点灯する。
    C: 左側車線に移動する。
    D: 進入する前にクラクションを鳴らす。
  answer: B
  explanation: セーフティ・コリドーは、死亡事故や重大な負傷事故が多いハイウェイの区間に指定されています。マニュアルでは、安全のためにライトを点灯して走行するよう指示されています。
- id: 34
  category: signs_and_signals
  question: 茶色の交通標識はどのような情報を提供していますか？
  choices:
    A: ガソリンスタンドや宿泊施設などのドライバー向けサービス。
    B: 出口情報や都市への案内。
    C: 歴史的、文化的、およびレクリエーション施設。
    D: 前方にある道路の危険に関する警告。
  answer: C
  explanation: 歴史・文化・レクリエーション標識は茶色で、歴史的・文化的な場所、景勝地、ピクニック場、公園などを示します。
- id: 35
  category: signs_and_signals
  question: 停電などで信号機が消灯している交差点に差し掛かった場合、どのように進むべきですか？
  choices:
    A: 道が空いていれば、停止せずに交差点を通過する。
    B: 右側の車両に道を譲ってから進む。
    C: 全方向に一時停止標識があるものとして停止する。
    D: 警察官が到着するまで待ってから横断する。
  answer: C
  explanation: 停電などで信号が消灯している場合は、すべての方向に一時停止標識がある交差点（オールウェイ・ストップ）と同じように扱い、必ず一時停止しなければなりません。
- id: 36
  category: safe_driving_rules
  question: 赤信号が点灯している際に、左折が許可されるのはどのような条件のときですか？
  choices:
    A: 対面通行の道路から別の対面通行の道路へ曲がる場合。
    B: 一方通行の道路へ、その進行方向に沿って進入する場合。
    C: 赤信号での左折は決して許可されない。
    D: 指定された中央左折車線がある場合。
  answer: B
  explanation: 赤信号であっても、完全に停止した後であれば、一方通行の道路へその進行方向に沿って左折して進入することが許可されています。
- id: 37
  category: signs_and_signals
  question: 黄色の矢印が点滅している信号はどういう意味ですか？
  choices:
    A: 表示された方向に曲がるための優先権がある。
    B: 停止して、青色の矢印が出るまで待たなければならない。
    C: 表示された方向に進むことができるが、まず歩行者や対向車に道を譲らなければならない。
    D: 信号機が故障しているため、4方向一時停止として扱わなければならない。
  answer: C
  explanation: 黄色の矢印の点滅は、矢印の方向に進むことは可能ですが、まず歩行者や対向車に道を譲らなければならない（非保護左折など）ことを意味します。
- id: 38
  category: safe_driving_rules
  question: 以下の状況のうち、道路の左側を走行することが許可されるのはどれですか？
  choices:
    A: 見通しの悪いカーブに差し掛かったとき。
    B: 障害物を避けるためにセンターラインの左側を走行するとき。
    C: 右折の準備をしているとき。
    D: 住宅街を走行しているとき。
  answer: B
  explanation: 原則として道路の右側を走行しなければなりませんが、障害物を避けるためにセンターラインの左側を走行する場合など、特定の状況では左側走行が認められます。
- id: 39
  category: safe_driving_rules
  question: 標識や信号で制御されていない路地、私道、または駐車場から道路に進入したり横断したりする前に、何をしなければなりませんか？
  choices:
    A: 停止し、接近してくる車両や歩行者に道を譲る。
    B: 時速15マイルまで減速し、交通の流れに合流する。
    C: クラクションを鳴らして、対向車に警告する。
    D: 右側から接近してくる車両にのみ道を譲る。
  answer: A
  explanation: 標識や信号のない路地、私道、駐車場から道路に入る際は、進入する前に必ず停止し、接近してくるすべての車両や歩行者に道を譲らなければなりません。
- id: 40
  category: safe_driving_rules
  question: 特に標識がない場合、路地や狭い住宅街を走行する際の法定速度は何マイルですか？
  choices:
    A: 時速10マイル
    B: 時速15マイル
    C: 時速20マイル
    D: 時速25マイル
  answer: B
  explanation: 法律により、路地や狭い住宅街での制限速度は、特に指定がない限り時速15マイルと定められています。
- id: 41
  category: safe_driving_rules
  question: 標識などで別途指定がない限り、公立公園や住宅街での最高速度制限は何マイルですか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速30マイル
  answer: C
  explanation: 住宅街、公立公園、および海岸線での速度制限は時速25マイルです。
- id: 42
  category: signs_and_signals
  question: 青色で、ガソリン、食事、病院など、高速道路沿いのサービスや施設について知らせる標識の種類は何ですか？
  choices:
    A: 経路標識 (Route signs)
    B: 案内標識 (Guide signs)
    C: 警戒標識 (Warning signs)
    D: ドライバー用サービス標識 (Motorist Service signs)
  answer: D
  explanation: ドライバー用サービス標識（Motorist Service signs）は、ガソリン、食事、宿泊、病院など、高速道路沿いのサービスや施設を知らせる青色の標識です。
- id: 43
  category: safe_driving_rules
  question: 対向車が通行する中央線のない道路を走行する場合、車両をどのように配置すべきですか？
  choices:
    A: 他の車両が近づくまで、道路の完全に中央を走行する。
    B: 対向車のために、道路の少なくとも半分を空ける。
    C: 道路の左端を走行する。
    D: 車両が近づいてきたら、いつでも路肩に寄せて停止する。
  answer: B
  explanation: 中央線がなく、対向車が通行する道路では、運転者は対向車に対して道路の少なくとも半分を譲らなければなりません。
- id: 44
  category: signs_and_signals
  question: 黄色の点滅信号に対する適切な対応は何ですか？
  choices:
    A: 進む前に完全に停止する。
    B: 交差点を素早く通過するために加速する。
    C: 徐行し、注意して進む。
    D: 交差点を4方向一時停止（4-way stop）として扱う。
  answer: C
  explanation: 黄色の点滅信号は、徐行して注意深く進むことを意味します。
- id: 45
  category: safe_driving_rules
  question: 標識などで別途指定がない限り、最高速度制限が時速20マイルとなるのは次のうちどのエリアですか？
  choices:
    A: 公立公園
    B: あらゆる商業地区 (Business district)
    C: 海岸線
    D: 他の定義に当てはまらないすべての道路および高速道路
  answer: B
  explanation: マニュアルには、あらゆる商業地区内およびスクールゾーン内での速度制限は時速20マイルであると記載されています。
- id: 46
  category: signs_and_signals
  question: 可変推奨速度標識（Variable Advisory Speed sign）と可変速度制限標識（Variable Speed Limit sign）の主な違いは何ですか？
  choices:
    A: 推奨標識は黒と白で、制限標識は黄色である。
    B: 推奨標識は状況に基づいた速度を推奨するものであり、制限標識は状況に基づいて法的強制力のある速度制限を変更するものである。
    C: 推奨標識は夜間のみ適用され、制限標識は日中に適用される。
    D: 推奨標識は他の速度制限標識と同様に施行されるが、制限標識は基本規則法（Basic Rule Law）を通じてのみ施行される。
  answer: B
  explanation: 可変推奨速度標識は黄色で、走行条件に基づいた速度を推奨するものです。可変速度制限標識は白黒で、走行条件に基づいて実際の速度制限を変更するものであり、警察は他の速度制限標識と同様にこれを取り締まります。
- id: 47
  category: safe_driving_rules
  question: オレゴン州の基本規則法（Basic Rule Law）に関する記述のうち、正しいものはどれですか？
  choices:
    A: 天候が晴れていて交通量が少ない場合は、速度制限を超えて運転することを許可している。
    B: 州間高速道路と商業地区にのみ適用される。
    C: 現在の状況に対して合理的かつ慎重な速度で運転しなければならないと定めている。
    D: 天候や視界に関わらず、掲示された速度制限で運転することを要求している。
  answer: C
  explanation: 基本規則（Basic Rule）は、現在の状況に対して合理的かつ慎重な速度で運転しなければならないと定めています。これは常にすべての道路に適用され、速度制限を超えて運転することを許可するものではありません。
- id: 48
  category: sharing_the_road
  question: 通常の交通の流れよりも遅く走行しており、後方に渋滞が発生した場合、どうしなければなりませんか？
  choices:
    A: 掲示された制限速度を超えても、交通の流れに合わせるために加速する。
    B: 他の車両が右側から追い越せるように、左車線に移動する。
    C: 最初の安全な場所で道路から外れ、後方の車を先に行かせる。
    D: ハザードランプを点灯し、現在の車線を走行し続ける。
  answer: C
  explanation: マニュアルには次のように記載されています。「指定速度よりも遅く走行する場合は、後方の混雑に注意してください。最初の安全な場所で道路から外れ、後方の車を先に行かせてください。」
- id: 49
  category: defensive_driving
  question: 車両の速度と歩行者の死亡率に関するマニュアルのデータによると、時速42マイルで走行中の車両にはねられた歩行者の死亡リスクはどのくらいですか？
  choices:
    A: 死亡リスク 10%
    B: 死亡リスク 25%
    C: 死亡リスク 50%
    D: 死亡リスク 90%
  answer: C
  explanation: マニュアルのチャートによると、時速42マイルで走行中の車両にはねられた歩行者の死亡リスクは50%です。
- id: 50
  category: signs_and_signals
  question: 二重の実線の黄色い線は何を示していますか？
  choices:
    A: 双方向の交通において追い越しが許可されている。
    B: 追い越しは禁止されているが、道路に出入りするためにこれらの線を越えて左折することはできる。
    C: 一方通行の道路に近づいている。
    D: 低速車両を追い越すために中央車線を使用できる。
  answer: B
  explanation: 二重の実線の黄色い線は、両方向とも追い越しが禁止されていることを示します。ただし、対向車が途切れるのを待った後であれば、二重の実線の黄色い線を越えて道路に出入りするために左折することは可能です。
- id: 51
  category: safe_driving_rules
  question: 双方向左折専用車線（two-way special left turn lane）の使用に関するルールとして、正しいものはどれですか？
  choices:
    A: 低速車両を追い越すためにこの車線を使用してもよい。
    B: 左折する前に、少なくとも200フィートはこの車線を走行しなければならない。
    C: 双方向左折車線を走行することは違法であるため、左折する直前にこの車線に進入すること。
    D: 車両が故障した場合は、この車線に駐車することができる。
  answer: C
  explanation: マニュアルには、「双方向左折車線を走行することは違法であるため、左折する直前にこの車線に進入すること」と記載されています。
- id: 52
  category: signs_and_signals
  question: 両側に二重の実線の黄色い線が引かれた中央分離帯（painted median）に関するルールは何ですか？
  choices:
    A: 右左折車線として使用することができる。
    B: 対向車の通過を待った後であれば、そこを横切って左折することができる。
    C: 本線が渋滞している場合は、中央分離帯の中を走行することが許可されている。
    D: いかなる状況においても、中央分離帯を横切って曲がることは違法である。
  answer: B
  explanation: 二重の実線の黄色い線で描かれた中央分離帯は、2つの進行方向の間のエリアを示します。対向車が途切れるのを待った後であれば、中央分離帯を横切って左折することができますが、そこを右左折車線として使用したり、中を走行したりすることはできません。
- id: 53
  category: signs_and_signals
  question: 幅の広い実線の白線は何を示しており、それを越える際のルールは何ですか？
  choices:
    A: 反対方向に進む交通を分離しており、越えることは厳格に禁止されている。
    B: 歩行者用横断歩道を示しており、安全な場合にのみ越えることができる。
    C: 交通を特定の車線に誘導するために使用されており、越えることは許可されているが推奨されない。
    D: 公共交通専用車線を示しており、越えることは違法である。
  answer: C
  explanation: 幅の広い実線の白線は、交通を特定の車線（右左折車線など）に誘導したり、自転車レーンを分離したりするために使用されます。幅の広い実線の白線を越えることは許可されていますが、推奨されません。
- id: 54
  category: signs_and_signals
  question: 出口ランプや交差点の手前で点線の白線が使用されている場合、それは運転者に何を知らせていますか？
  choices:
    A: 走行中の車線が、そのまま同じルートを継続しないこと。
    B: スクールゾーンに近づいていること。
    C: 今後1マイルの間、追い越しが禁止されていること。
    D: 完全に停止しなければならないこと。
  answer: A
  explanation: 出口ランプや交差点の手前で使用される点線の白線は、右折専用車線や出口専用車線のように、現在走行している車線がそのまま同じルートを継続しないことを知らせるものです。
- id: 55
  category: signs_and_signals
  question: 路面の「譲れ（yield）」のラインはどのようにマークされていますか？
  choices:
    A: 車線を横切る1本の実線の白線。
    B: 車線内に描かれた、自分の車両の方を向いている三角形の列。
    C: 車線の中央に描かれた白いシェブロン（V字型）。
    D: 自転車のシンボルが付いた幅の広い白線。
  answer: B
  explanation: 譲れライン（yield line）は、車線内に描かれた自分の車両の方を向いている三角形の列と定義されており、優先権を譲る必要がある地点を示します。
- id: 56
  category: signs_and_signals
  question: 道路上の赤の縞模様の線は何を示していますか？
  choices:
    A: 緊急車両専用の車線。
    B: 追い越しが厳格に禁止されているエリア。
    C: 一般車が一切進入できない公共交通専用車線。
    D: 右左折、駐車、または私道への進入のために、公共交通専用（Transit Only）車線に入ることができるエリア。
  answer: D
  explanation: 赤の縞模様の線は、右左折、駐車、または私道への進入のために、公共交通専用車線に入ることができる場所を示しています。
- id: 57
  category: defensive_driving
  question: 時速30マイルを超える速度で走行する場合の推奨される安全な車間距離はどれくらいですか？
  choices:
    A: 1〜2秒
    B: 2〜3秒
    C: ちょうど3秒
    D: 4秒以上
  answer: D
  explanation: マニュアルには、「時速30マイルを超える速度では、判断を下し行動を起こすための時間を確保するため、安全な車間距離は4秒以上にする必要がある」と記載されています。
- id: 58
  category: penalties_and_points
  question: オレゴン州の運転マニュアルでは、道路上での「違法なレーシング（illegal racing）」をどのように定義していますか？
  choices:
    A: 掲示された制限速度を時速15マイル以上超えて運転すること。
    B: あらゆる加速競争、速度競争、または速度記録の作成。
    C: 1回の操作で3台以上の車両を追い越すこと。
    D: 左車線で通常の交通の流れよりも速く運転すること。
  answer: B
  explanation: マニュアルには、「いかなる道路においてもレースをすることは違法である。レーシングとは、あらゆる加速競争、速度競争、または速度記録の作成を指す」と記載されています。
- id: 59
  category: safe_driving_rules
  question: 通常の条件下で、時速30マイル以下の速度における安全な車間距離はどのように定義されていますか？
  choices:
    A: 1〜2秒
    B: 2〜4秒
    C: 4〜6秒
    D: 5〜7秒
  answer: B
  explanation: マニュアルによると、安全な車間距離は2〜4秒と定義されています。
- id: 60
  category: safe_driving_rules
  question: 時速30マイルを超える速度で走行している場合、車間距離はどれくらいにするべきですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒以上
    D: 時速10マイルごとに1秒
  answer: C
  explanation: 時速30マイルを超える速度では、判断を下し行動を起こすための時間を確保するため、安全な車間距離は4秒以上にする必要があります。
- id: 61
  category: defensive_driving
  question: 他の車両の後ろで停車する際、どのくらいの車間距離を空けるべきですか？
  choices:
    A: 前の車両の後輪が路面に接しているのが見える程度
    B: 少なくとも車1台分
    C: 車両のナンバープレートが見える程度
    D: 3フィートの距離
  answer: A
  explanation: 他の車両の後ろで停車する際は、前の車両の後輪が路面に接している部分が見えることを確認してください。
- id: 62
  category: defensive_driving
  question: 後続車が車間距離を詰めすぎており（あおり運転）、右側の車線に移動できない場合はどうすべきですか？
  choices:
    A: あおり運転をやめさせるために急ブレーキをかける
    B: ゆっくりと速度を落とす
    C: 距離を広げるために加速する
    D: ハザードランプを点滅させる
  answer: B
  explanation: 後続車が車間距離を詰めすぎていて、車線を譲ることができない場合は、ゆっくりと速度を落としてください。これにより、後続車が追い越すか、車間距離を詰めるのをやめるよう促すことができます。決して急ブレーキをかけてはいけません。
- id: 63
  category: vehicle_information
  question: 車両を後退（バック）させる際の適切な方法は何ですか？
  choices:
    A: バックミラーとサイドミラーだけに頼る
    B: 体と頭を右に向け、後方の窓から外を見る
    C: 後退する前にクラクションを3回鳴らす
    D: ドアを開け、後退しながら後ろを見る
  answer: B
  explanation: ミラーだけでは十分な視界を確保できません。できるだけ広く確認するために、体と頭を右に向け、後方の窓から直接外を見てください。
- id: 64
  category: safe_driving_rules
  question: 時速60マイル（60 mph）で走行中、危険を認識してから車両が完全に停止するまでに進む距離はどのくらいですか？
  choices:
    A: 約50フィート
    B: バスケットボールコートの長さより短い
    C: フットボール場の長さよりも長い
    D: 正確に100フィート
  answer: C
  explanation: 停止には想像以上の時間がかかります。時速60マイルでは、前方の危険を認識してブレーキを踏んでから車両が停止するまでに進む距離は、フットボール場の長さよりも長くなります。
- id: 65
  category: safe_driving_rules
  question: カーブに近づく際、いつ減速すべきですか？
  choices:
    A: カーブに入る前
    B: カーブの途中にいる間
    C: カーブを抜ける直前
    D: カーブの間ずっと速度を維持すべきである
  answer: A
  explanation: マニュアルには、カーブに入る前に減速し、カーブを抜ける際に徐々に加速するように記載されています。
- id: 66
  category: defensive_driving
  question: 車線変更をする前に、死角を確認するために何をしなければなりませんか？
  choices:
    A: バックミラーを確認する
    B: サイドミラーを確認する
    C: 進む方向の肩越しに視線を向ける
    D: 方向指示器（ウィンカー）を出す
  answer: C
  explanation: 車線変更をする前に、左に移動する場合は左肩越しに、右に移動する場合は右肩越しに視線を向け、死角に車両がいないか確認しなければなりません。
- id: 67
  category: safe_driving_rules
  question: 片側一車線の道路（2車線道路）で他の車両を追い越す際、元の車線に戻っても安全なのはいつですか？
  choices:
    A: 自分のフロントバンパーが相手の車両より前に出たらすぐに
    B: 追い越した車両がバックミラーに見えたとき
    C: 相手の車両を追い越してから100フィート進んだ後
    D: 相手のドライバーがヘッドライトを点滅させたとき
  answer: B
  explanation: 追い越した車両がバックミラーに見えたら、合図を出して元の車線に戻ります。
- id: 68
  category: safe_driving_rules
  question: 他の車両を追い越す際、制限速度を超えてもよいのはどのような場合ですか？
  choices:
    A: 時速5マイルまでなら許される
    B: トラックを追い越す場合なら時速10マイルまで許される
    C: 片側一車線のハイウェイ（2車線高速道路）においてのみ
    D: いかなる場合も許されない。制限速度を超えることは違法である
  answer: D
  explanation: 追い越しの際も制限速度を超えてはいけません。いかなる時も制限速度を超えることは違法です。
- id: 69
  category: safe_driving_rules
  question: 次の状況のうち、追い越しのた​​めにセンターラインを越えることが違法となるのはどれですか？
  choices:
    A: 前方の車両が歩行者を横断させるために横断歩道で停止しているとき
    B: 多車線の内の一方通行の道路にいるとき
    C: 前方の車両が右折しようとしているとき
    D: 黄色の破線がある住宅街を走行しているとき
  answer: A
  explanation: 前方の車両が歩行者を横断させるために横断歩道で停止しているときは、追い越しのた​​めにセンターラインを越えてはいけません。
- id: 70
  category: safe_driving_rules
  question: どのような条件下で、車両を右側から追い越すことが許可されますか？
  choices:
    A: 片側一車線の道路の左車線を、前方の車両が非常に遅く走っているとき
    B: 追い越そうとする車両が左折中、または左折の合図を出しており、右側に十分な舗装スペースがあるとき
    C: 道路の未舗装の路肩を走行することによって
    D: 指定された自転車レーンを使用することによって
  answer: B
  explanation: 追い越そうとする車両が左折中、または左折の合図を出している場合、道路の舗装部分から外れたり自転車レーンを走行したりせずに右側に十分なスペースがあれば、右側から追い越すことができます。
- id: 71
  category: sharing_the_road
  question: 他のドライバーがあなたを追い越し始めた場合、どのように支援すべきですか？
  choices:
    A: 相手が自分の後ろに入れるよう速度を上げる
    B: 安全であることを知らせるためにヘッドライトを点滅させる
    C: 手信号を使って前に行くよう合図を送る
    D: 右側に寄り、相手が車線に戻れるよう速度を調整する
  answer: D
  explanation: 他のドライバーが追い越しを始めたら、右側に寄ってください。対向車を確認し、相手の車両ができるだけ早く右車線に戻れるよう速度を調整することで、安全な追い越しを支援できます。
- id: 72
  category: safe_driving_rules
  question: 他のドライバーに対し、追い越しが安全であることを手信号やライトで知らせることについて、法律ではどのように定められていますか？
  choices:
    A: 夜間に推奨されている
    B: 大型トラックを運転している場合に義務付けられている
    C: 法律は、追い越しのタイミングを知らせるために他のドライバーに合図を送ることを禁止している
    D: 田舎の2車線道路でのみ許可されている
  answer: C
  explanation: 追い越しのタイミングを知らせるために手信号やライトを使用しないでください。法律では、追い越しの合図として他のドライバーにライトを点滅させたりすることを禁止しています。
- id: 73
  category: defensive_driving
  question: 次のうち、車間距離を長くすべき状況はどれですか？
  choices:
    A: 乾燥した舗装状態の良い道路を走行しているとき
    B: 大型トラックなど、自分の姿が見えていないドライバーの後ろを走行しているとき
    C: 小型で軽量な車両を運転しているとき
    D: 右折の準備をしているとき
  answer: B
  explanation: 自分の姿が見えていないドライバーの後ろを走行するときは、車間距離を長くする必要があります。大型車両のドライバーは、真後ろにいるあなたの車両を確認できない場合があります。
- id: 74
  category: safe_driving_rules
  question: フリーウェイ（高速道路）で通常の交通の流れよりも遅い速度で走行する場合、どうしなければなりませんか？
  choices:
    A: 左車線を走行する。
    B: 右車線を走行する。
    C: ハザードランプを点灯させる。
    D: 路肩を走行する。
  answer: B
  explanation: マニュアルのフリーウェイ走行のセクションによると、「交通の流れよりも遅い速度で走行する場合は、右車線を使用しなければならない」とされています。
- id: 75
  category: defensive_driving
  question: フリーウェイで前方の交通が減速しているのを見つけた場合、後続車のドライバーにどのように警告すべきですか？
  choices:
    A: ハザードランプを点灯させる。
    B: 手信号を使用する。
    C: ブレーキペダルを数回軽く踏む。
    D: クラクションを繰り返し鳴らす。
  answer: C
  explanation: マニュアルでは、「前方の交通が減速しているのを見つけた場合は、ブレーキペダルを数回軽く踏んで後続車のドライバーに知らせてください」とアドバイスしています。
- id: 76
  category: signs_and_signals
  question: フリーウェイのオンランプメーター（信号機）が消灯しており、使用されていない場合はどうすべきですか？
  choices:
    A: 4方向一時停止（4-way stop）として扱う。
    B: 停止して信号が青になるのを待つ。
    C: 隣の車線の車両に道を譲る。
    D: 停止せずにフリーウェイへ進む。
  answer: D
  explanation: マニュアルにはランプメーターについて次のように記載されています。「ランプメーターは使用されていないときは消灯しています。消灯しているランプメーターでは停止しないでください。」
- id: 77
  category: safe_driving_rules
  question: フリーウェイを降りる際、掲示されている推奨速度まで減速し始めるタイミングはいつですか？
  choices:
    A: まだフリーウェイの右車線を走行しているとき。
    B: 出口ランプに入ってから。
    C: 出口の少なくとも500フィート手前。
    D: ランプの突き当たりにある一時停止標識が見えたときのみ。
  answer: B
  explanation: マニュアルには次のように指示されています。「フリーウェイを出るまで速度を維持してください。出口ランプに入ったら、掲示されている推奨速度まで減速し始めてください。」
- id: 78
  category: safe_driving_rules
  question: フリーウェイで車両トラブルが発生し路肩に移動した場合、待機するのに最も安全な場所はどこですか？
  choices:
    A: 助けを求めてフリーウェイ沿いを歩く。
    B: 他の車に警告するために車両の真後ろに立つ。
    C: 車内、または車両の近くの交通から離れた側。
    D: 通りかかる車を止めるために、最も近い走行車線に立つ。
  answer: C
  explanation: マニュアルには次のように記載されています。「可能であれば、車内または車両の近くの交通から離れた側に留まる方が良いでしょう。フリーウェイ沿いを歩くのは危険です。」
- id: 79
  category: sharing_the_road
  question: トレーラーを牽引しており、後方に車が溜まっている（渋滞している）場合、どうしなければなりませんか？
  choices:
    A: 交通の流れに合わせて速度を上げる。
    B: 最初の安全な待避所（ターンアウト）に車を止め、後続車を先に行かせる。
    C: ハザードランプを点灯させ、現在の速度で走行を続ける。
    D: 後続車に右側から追い越すよう手で合図を送る。
  answer: B
  explanation: マニュアルには次のように記載されています。「後方に車が溜まっている場合は、最初の安全な待避所に車を止め、後続車を先に行かせてください。」
- id: 80
  category: penalties_and_points
  question: 乗用車で2台以上の車両またはトレーラーを牽引した際の3回目の違反に対する最大罰則は何ですか？
  choices:
    A: 最大1,000ドルの罰金。
    B: 最大2,000ドルの罰金。
    C: 最大2,500ドルの罰金と6ヶ月の禁錮刑。
    D: 1年間の免許停止。
  answer: C
  explanation: マニュアルには牽引違反の罰金が記載されています。3回目の違反の場合、罰則は「最大2,500ドルおよび6ヶ月の禁錮刑」です。
- id: 81
  category: safe_driving_rules
  question: 交通の流れの中で走行している場合、右左折や車線変更を行う前に最低何フィート手前から方向指示器を使用しなければなりませんか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには次のように記載されています。「交通の流れの中で走行している場合は、右左折または車線変更の少なくとも100フィート手前で方向指示器を使用してください。」
- id: 82
  category: safe_driving_rules
  question: 手信号の使用が許可されるのはどのような条件のときですか？
  choices:
    A: 夜間の視界が悪いときのみ。
    B: 幅広または長い車両を運転しているときはいつでも。
    C: 1,000フィートの距離で人や車両をはっきりと確認できる日中。
    D: 車両の方向指示器が故障しているときのみ。
  answer: C
  explanation: マニュアルには次のように記載されています。「手信号は、日中で、かつ1,000フィートの距離で人や車両をはっきりと確認できる場合にのみ使用してください。」
- id: 83
  category: sharing_the_road
  question: 右左折の準備をする際、自転車専用レーンに関するルールは何ですか？
  choices:
    A: 曲がる100フィート手前で自転車専用レーンに入らなければならない。
    B: 自転車専用レーンを横切って曲がることはできるが、曲がる準備のためにレーン内に進入してはならない。
    C: 自転車専用レーンを横切ることはいかなる場合も禁止されている。
    D: レーンに入る前にクラクションを鳴らして自転車専用レーンを空けさせるべきである。
  answer: B
  explanation: マニュアルには明示的に次のように記載されています。「自転車専用レーンを横切って曲がることはできますが、曲がる準備のために自転車専用レーン内に進入してはいけません。」
- id: 84
  category: defensive_driving
  question: 交差点で、曲がるための車線を間違えたことに気づいた場合、どうすべきですか？
  choices:
    A: 信号が青になる前に素早く車線を変更する。
    B: 停車して交通が途切れるのを待ち、車線を変更する。
    C: 次の交差点まで行ってから曲がる。
    D: ハザードランプをつけてそのまま曲がる。
  answer: C
  explanation: マニュアルでは次のようにアドバイスしています。「交差点で曲がるための車線を間違えた場合は、次の交差点まで進んでください。直前での車線変更や方向転換による衝突のリスクを冒すよりも、ブロックを一周する方が安全です。」
- id: 85
  category: safe_driving_rules
  question: 対面通行の道路から別の対面通行の道路へ左折する場合、曲がる直前に車両をどの位置に配置すべきですか？
  choices:
    A: 右側の縁石に最も近い車線。
    B: 中央線のすぐ右側の車線。
    C: 交差点の中央。
    D: 自転車専用レーン。
  answer: B
  explanation: マニュアルには次のように記載されています。「左折：対面通行の道路では、中央線のすぐ右側の車線に車両を寄せて曲がってください。」
- id: 86
  category: safe_driving_rules
  question: 次の状況のうち、赤信号で左折することが違法となるのはどれですか？
  choices:
    A: 一方通行の道路から一方通行の道路へ曲がる場合。
    B: 対面通行の道路から一方通行の道路へ曲がる場合。
    C: 一方通行の道路から対面通行の道路へ曲がる場合。
    D: 二重左折車線から一方通行の道路へ曲がる場合。
  answer: C
  explanation: マニュアルの「左折：一方通行の道路から対面通行の道路へ」の項目には、「赤信号でこの左折を行うことはできません」と記載されています。また、赤信号で対面通行の道路へ左折することは違法であるとも記されています。
- id: 87
  category: defensive_driving
  question: 誤ってフリーウェイに逆方向に進入し始めた場合、まず最初にすべきことは何ですか？
  choices:
    A: 加速して素早くランプから出る。
    B: 直ちにランプの脇に寄せて停車する。
    C: ギアをバックに入れて交差する道路まで後退する。
    D: 対向車に警告するためにクラクションを鳴らしながら転回する。
  answer: B
  explanation: マニュアルには次のように記載されています。「フリーウェイに逆方向に進入し始めた場合、『進入禁止（DO NOT ENTER）』または『逆走（WRONG
    WAY）』の標識が間違いを警告してくれます。直ちにランプの脇に寄せて停車してください。」
- id: 88
  category: safe_driving_rules
  question: 市街地において、Uターンが禁止されているのはどのような場所ですか？
  choices:
    A: いずれの方向からの交通からも、500フィート以内で自車を確認できない場所
    B: いずれの方向からの交通からも、1,000フィート以内で自車を確認できない場所
    C: いずれの方向からの交通からも、250フィート以内で自車を確認できない場所
    D: いずれの方向からの交通からも、750フィート以内で自車を確認できない場所
  answer: A
  explanation: マニュアルによると、市街地内のいかなる場所においても、いずれの方向から来る交通からも500フィート以内で自車を確認できない場所でのUターンは禁止されています。
- id: 89
  category: safe_driving_rules
  question: 市街地外でUターンを行う際の視認性の要件は何ですか？
  choices:
    A: いずれの方向からの交通からも、500フィート以内で自車を確認できること
    B: いずれの方向からの交通からも、1,000フィート以内で自車を確認できること
    C: いずれの方向からの交通からも、1,500フィート以内で自車を確認できること
    D: いずれの方向からの交通からも、2,000フィート以内で自車を確認できること
  answer: B
  explanation: マニュアルには、市街地外のいかなる場所においても、いずれの方向から来る交通からも1,000フィート以内で自車を確認できない場所でのUターンは禁止されていると記載されています。
- id: 90
  category: safe_driving_rules
  question: 標識や信号のない交差点では、どの車両に優先権を譲らなければなりませんか？
  choices:
    A: 左側から接近してくるすべての車両
    B: 交差点内にいる車両または右側から接近してくるすべての車両
    C: 最高速度で走行している車両
    D: 左折しようとしているすべての車両
  answer: B
  explanation: 標識や信号のない交差点に近づく際は、交差点内にいる車両または右側から接近してくる車両に優先権を譲らなければなりません。
- id: 91
  category: safe_driving_rules
  question: 標識や信号のないT字路（丁字路）の突き当たりを走行している場合、どのように行動しなければなりませんか？
  choices:
    A: 直進道路（交差する道路）を走行しているドライバーに道を譲る
    B: 右左折するので優先権があるものとして進む
    C: 停止して青信号を待つ
    D: 進行する前にクラクションを鳴らして交差する車両に警告する
  answer: A
  explanation: 標識や信号のないT字路の突き当たりを走行しているドライバーは、直進道路（交差する道路）を走行しているドライバーに道を譲らなければなりません。
- id: 92
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内を走行中に緊急車両が接近してきた場合、どうすべきですか？
  choices:
    A: 通過させるためにラウンドアバウト内ですぐに停止する
    B: そのまま進んでラウンドアバウトを出てから、右側の路肩に寄せる
    C: ラウンドアバウトの中央島に寄せる
    D: 合図を出さずに、できるだけ早く加速して脱出する
  answer: B
  explanation: ラウンドアバウト内では絶対に停止しないでください。代わりに、そのまま進んでラウンドアバウトを出てください。脱出後、右側の路肩に寄せて緊急車両を通過させます。
- id: 93
  category: safe_driving_rules
  question: 複数車線のラウンドアバウトを走行中、法律で禁止されている行為はどれですか？
  choices:
    A: 出る時に右のウィンカー（方向指示器）を出す
    B: 自分の車線を維持して走行する
    C: トラックを追い越す、またはトラックの横を並走する
    D: 進入前にラウンドアバウト内の車両に道を譲る
  answer: C
  explanation: ラウンドアバウト内では、いかなる車両も追い越そうとしないでください。特に大型トラックやトレーラーには注意が必要です。ラウンドアバウト内でトラックを追い越したり、その横を走行したりすることは禁止されています。
- id: 94
  category: sharing_the_road
  question: 信号機のある交差点で右左折する場合、歩行者がどのくらい離れてから曲がり始める必要がありますか？
  choices:
    A: 曲がろうとする車線と、その隣の車線を通り過ぎた後
    B: 曲がろうとする車線から6フィート（約1.8メートル）以上離れた時
    C: 自分の車両から10フィート（約3メートル）以上離れた時
    D: 完全に歩道に上がった時
  answer: B
  explanation: 信号機のある交差点で右左折する場合、曲がり始める前に、歩行者が曲がろうとする車線から6フィート（約1.8メートル）以上離れていなければなりません。
- id: 95
  category: sharing_the_road
  question: 信号機のない交差点で右左折する場合、歩行者に関していつ曲がるのが安全ですか？
  choices:
    A: 歩行者が自分の車線から6フィート離れた時
    B: 歩行者が曲がろうとする車線と、その隣の車線を通り過ぎた時
    C: 歩行者が縁石から足を踏み出した直後
    D: 歩行者が中央島に到達した時
  answer: B
  explanation: 信号機のない交差点で右左折する場合、曲がり始める前に、歩行者が曲がろうとする車線と、その隣の車線を通り過ぎていなければなりません。
- id: 96
  category: sharing_the_road
  question: 標識や表示のない横断歩道の最小幅はどれくらいですか？
  choices:
    A: 4フィート
    B: 6フィート
    C: 8フィート
    D: 10フィート
  answer: B
  explanation: 標識や表示のない横断歩道は、少なくとも6フィート（約1.8メートル）の幅があり、歩道や路肩がない場所でも存在します。
- id: 97
  category: sharing_the_road
  question: 白杖（白い杖）を持った視覚障害のある歩行者が道路を横断している場合、どうしなければなりませんか？
  choices:
    A: 自分の存在を知らせるためにクラクションを鳴らす
    B: 自分の車線を6フィート通り過ぎるまで道を譲る
    C: その人が道路を完全に渡りきるまで停止したままでいる
    D: スペースがあれば、ゆっくりと避けて運転する
  answer: C
  explanation: 白杖を持っている、または盲導犬を連れている視覚障害のある歩行者には、優先権を与えなければなりません。たとえ信号が青であっても、その人が道路を完全に渡りきるまで停止したままでいてください。
- id: 98
  category: safe_driving_rules
  question: 4方向一時停止（All-way stop）の交差点で、2人のドライバーが同時に停止し、どちらが先に進むべきか迷った場合、どちらが譲るべきですか？
  choices:
    A: 右側のドライバーが左側のドライバーに譲る
    B: 右折するドライバーが左折するドライバーに譲る
    C: 左側のドライバーが右側のドライバーに譲る
    D: 大きい車両が優先権を持つ
  answer: C
  explanation: 全ての方向に一時停止標識がある交差点では、最初に停止したドライバーが先に進むのが一般的なマナーです。判断に迷う場合は、自分の右側にいるドライバーに道を譲ってください。
- id: 99
  category: sharing_the_road
  question: 横断歩道で停止している車両を追い越すことが法律で禁止されているのはなぜですか？
  choices:
    A: 停止している車両が突然バックする可能性があるため
    B: そのドライバーは歩行者が道路を横断するのを待っている可能性があるため
    C: 緊急車両を妨害する可能性があるため
    D: 停止している車両が故障している可能性が高いため
  answer: B
  explanation: 横断歩道で停止している車両を追い越してはいけません。これは法律違反です。そのドライバーは、歩行者が道路を横断するのを待っている可能性があります。
- id: 100
  category: sharing_the_road
  question: ラウンドアバウト内で自転車に乗っている人に対して、どのように接すべきですか？
  choices:
    A: 左側から素早く追い越す
    B: 追い越すことを知らせるためにクラクションを鳴らす
    C: ラウンドアバウト内で自転車に乗っている人を追い越してはいけない
    D: 歩道を使うように強制する
  answer: C
  explanation: 車の流れに合流した自転車には、車線全体の使用を認めてください。ラウンドアバウト内で自転車に乗っている人を追い越してはいけません。
- id: 101
  category: safe_driving_rules
  question: ある道路から別の道路へ曲がる際の一般的なルールは何ですか？
  choices:
    A: 中央車線から一番右側の車線へ曲がる
    B: 走行中の方向で最も近い車線から、進みたい方向の最も近い車線へと曲がる
    C: 縁石に接触しないよう、大きく膨らんで曲がる
    D: 開始位置に関係なく、常に一番左側の車線に入る
  answer: B
  explanation: 右左折の一般的なルールは、走行中の方向で最も近い車線から、進みたい方向の最も近い車線へと曲がることです。大きく膨らんだり、右左折中に車線変更をしたりしないようにしてください。
- id: 102
  category: sharing_the_road
  question: 歩行者が安全地帯（セーフティアイランド）の反対側にいる場合、横断歩道の手前で停止する必要がありますか？
  choices:
    A: はい、横断歩道に歩行者がいる場合は常に停止しなければならない
    B: はい、信号が青でない限り停止しなければならない
    C: いいえ、歩行者が安全地帯の反対側にいる場合は停止する必要はない
    D: いいえ、歩行者が白杖を持っていない限り停止する必要はない
  answer: C
  explanation: マニュアルには、「歩行者が安全地帯の反対側の横断歩道にいる場合は、停止する必要はありません」と記載されています。
- id: 103
  category: sharing_the_road
  question: 白杖を使用している人や盲導犬を連れた人が青信号で道路を横断している場合、どうしなければなりませんか？
  choices:
    A: クラクションを鳴らして、青信号であることを知らせる
    B: 注意しながらその人の周りを通り過ぎる
    C: その人が道路を完全に渡り終えるまで、停止したままでいる
    D: 標識のある横断歩道にいる場合にのみ道を譲る
  answer: C
  explanation: マニュアルでは、たとえ信号が青であっても、その人が道路を完全に渡り終えるまで停止したままでいなければならないと定められています。
- id: 104
  category: safe_driving_rules
  question: 指定されたスクールゾーン内での制限速度（減速時）は何マイルですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: スクールゾーンは、20 mphの制限速度が適用される区域であり、スクールゾーンの速度制限標識によって定義されています。
- id: 105
  category: signs_and_signals
  question: スクールゾーンの速度制限標識に「School Hours（授業時間中）」と指定されている場合、授業が行われている日のどの時間帯に制限速度が適用されますか？
  choices:
    A: 午前7時から午後4時まで
    B: 午前8時から午後5時まで
    C: 午前7時から午後5時まで
    D: 午前8時から午後4時まで
  answer: C
  explanation: 「School Hours」の速度制限標識は、授業が行われている日の午前7時から午後5時までの間に適用されます。
- id: 106
  category: safe_driving_rules
  question: マニュアルによると、スクールゾーンにおいて「子供がいる（children are present）」とみなされるのは、次のうちどの状況ですか？
  choices:
    A: 子供が近くのフェンスで囲まれた校庭で遊んでいる
    B: 子供が横断歩道で待っている
    C: スクールバスが学校の駐車場に停まっている
    D: 平日の午前8時から午後3時の間である
  answer: B
  explanation: マニュアルでは、「子供がいる」状態を、子供が横断歩道で待っている、横断歩道内にいる、または横断歩道で子供を誘導するために交通パトロール隊員がいる状態と定義しています。
- id: 107
  category: sharing_the_road
  question: 自転車専用レーン（バイクレーン）を横切って走行することが許可されるのはいつですか？
  choices:
    A: 右左折の準備をする際
    B: 遅い車両を右側から追い越す際
    C: 右左折する場合、または路地、私道、私有道路に出入りする場合
    D: 自転車専用レーンを横切ることは決して許可されない
  answer: C
  explanation: 右左折する場合、または路地、私道、私有道路に出入りする場合には自転車専用レーンを横切ることができますが、右左折の準備のために自転車専用レーンに進入したり、その中を走行したりすることはできません。
- id: 108
  category: sharing_the_road
  question: 35 mphを超える速度で、自分の車線を走行している自転車を追い越す際に必要なことは何ですか？
  choices:
    A: 追い越す前にクラクションを鳴らさなければならない
    B: 自転車に乗っている人が転倒した場合でも接触を避けられるだけの十分な距離を空ける場合にのみ追い越すことができる
    C: 自転車を追い越すには、完全に車線を変更しなければならない
    D: 35 mphを超える速度で自転車を追い越すことは禁止されている
  answer: B
  explanation: 35 mphを超える速度で、自分の車線を走行している自転車を追い越す場合は、自転車に乗っている人が転倒したとしても接触しないだけの十分な距離を空ける必要があります。
- id: 109
  category: signs_and_signals
  question: 自分の車線に緑色に塗られたバイクボックス（自転車待機場所）がある赤信号で停止する場合、どうしなければなりませんか？
  choices:
    A: 自転車が前に割り込まないよう、バイクボックスの中で停止する
    B: バイクボックスの手前で停止する
    C: 自転車に道を譲った後、赤信号でも右折する
    D: 信号のセンサーを作動させるため、バイクボックスの中に半分ほど進入する
  answer: B
  explanation: ドライバーは、信号待ちの際はバイクボックスの手前で停止しなければなりません。ボックスの中で停止してはいけません。また、これらの交差点では、信号が赤の時の右折は禁止されています。
- id: 110
  category: signs_and_signals
  question: 路上に描かれた「シャロウ（sharrow）」は何を示していますか？
  choices:
    A: その車線は自転車専用である
    B: その車線は共有車線であり、自転車が走行している可能性がある
    C: この車線では自転車は自動車に道を譲らなければならない
    D: 車線が終わり、自転車は右側に合流しなければならない
  answer: B
  explanation: シャロウは、その車線が共有車線であり、自転車が走行している可能性があることを示しています。自転車のシンボルの上に2つのシェブロン（矢印記号）が描かれています。
- id: 111
  category: defensive_driving
  question: 方向指示器（ウィンカー）を出している対向のモーターサイクルの前で右左折する場合、なぜ特に注意が必要なのですか？
  choices:
    A: 交差点では常にモーターサイクルが優先されるため。
    B: 一部のモーターサイクルでは方向指示器が自動的に消えないため、ライダーが消し忘れている可能性があるから。
    C: モーターサイクルは他の車両よりも速く曲がるため。
    D: モーターサイクルの方向指示器は、しばしば配線が逆になっていることがあるため。
  answer: B
  explanation: 一部のモーターサイクルでは方向指示器が自動的に消えないため、ライダーが消し忘れることがあります。自車が動き出す前に、ライダーが実際に減速して曲がろうとしていることを確認しなければなりません。
- id: 112
  category: sharing_the_road
  question: モーターサイクルやモペッド（原動機付自転車）の運転者と車線を共有することは法律で認められていますか？
  choices:
    A: はい、車線が両方の車両にとって十分な幅であれば認められます。
    B: はい、ただし交通が停止しているか、非常にゆっくり動いている場合に限ります。
    C: いいえ、モーターサイクルやモペッドと車線を共有することは法律で禁止されています。
    D: いいえ、モーターサイクルのライダーが安全であると合図しない限り認められません。
  answer: C
  explanation: マニュアルには「モーターサイクルやモペッドの運転者と車線を共有することは法律で禁止されています。追い越す際は、彼らに車線全体を譲らなければなりません」と明記されています。
- id: 113
  category: vehicle_information
  question: 同じ速度で走行している小型車両と比較して、大型車両が停止するまでには通常どのくらいの距離が必要ですか？
  choices:
    A: ほぼ同じ距離
    B: 約2倍の距離
    C: 約3倍の距離
    D: 約4倍の距離
  answer: C
  explanation: 大型車両が停止するまでには、同じ速度で走行している小型車両の約3倍の距離がかかります。
- id: 114
  category: sharing_the_road
  question: 大型車両の側面の死角を走行しているかどうかを、どのように判断できますか？
  choices:
    A: リアバンパーから50フィート以内にいる場合。
    B: 大型車両のサイドミラーにその運転者の姿が見えない場合。
    C: 大型車両が時速55マイル（55 mph）以上で走行している場合。
    D: 大型車両の方向指示器が点滅しているのが見える場合。
  answer: B
  explanation: 大型車両には両側に大きな死角があります。大型車両のサイドミラーにその運転者の姿が見えない場合、その運転者からもあなたの姿は見えていません。
- id: 115
  category: safe_driving_rules
  question: 大型車両を追い越す際、その前方の車線に戻っても安全だと言えるのはいつですか？
  choices:
    A: 自車のリアバンパーが大型車両の前面を通過したらすぐに。
    B: バックミラーに大型車両の前面全体が見えるようになったとき。
    C: 大型車両の運転者がヘッドライトを点滅させたとき。
    D: 追い越し速度を少なくとも10秒間維持した後。
  answer: B
  explanation: 大型車両を追い越す際は、前方の車線に入る前に、バックミラーでその車両の前面全体を確認する必要があります。
- id: 116
  category: defensive_driving
  question: 対向車線にパイロット車両（先導車）が見えた場合、どうすべきですか？
  choices:
    A: 道路から完全に外れて停車する。
    B: ヘッドライトを点滅させて、運転者に気づいたことを知らせる。
    C: 速度を落とし、自車線内の右側にできるだけ寄せて走行する。
    D: 中央の右左折車線に移動して、十分なスペースを空ける。
  answer: C
  explanation: 対向車線にパイロット車両が見えた場合は、速度を落とし、自車線内にとどまりながら、できるだけ右側に寄せて走行してください。
- id: 117
  category: safe_driving_rules
  question: 未舗装の中央分離帯で仕切られた分離ハイウェイにおいて、赤色のライトを点滅させて停車しているスクールバスのために停止しなければならないのはいつですか？
  choices:
    A: 道路のどちら側にいるかにかかわらず、常に停止しなければならない。
    B: バスと同じ側の道路を走行している場合のみ、停止しなければならない。
    C: 中央分離帯を渡っている子供がいる場合のみ、停止しなければならない。
    D: 分離ハイウェイでは停止する必要はない。
  answer: B
  explanation: 未舗装の中央分離帯や障壁によって2つの道路に仕切られた分離ハイウェイでは、バスと同じ側の道路を走行している場合のみ停止する義務があります。
- id: 118
  category: sharing_the_road
  question: ペイントされた中央分離帯がある分離ハイウェイで、スクールバスが赤色のライトを点滅させて停車している場合、誰が停止しなければなりませんか？
  choices:
    A: バスと同じ側を走行している車両のみ
    B: すべての車線の車両
    C: バスの後方を走行している車両のみ
    D: どの車両も停止する必要はない
  answer: B
  explanation: ペイントされた中央分離帯や右左折車線は、2つの独立した道路とはみなされません。この場合、すべての車線の車両が、赤色ライトを点滅させているスクールバスのために停止しなければなりません。
- id: 119
  category: sharing_the_road
  question: 車線に戻ろうとしている公共交通バスに道を譲らなければならないのはいつですか？
  choices:
    A: バスが非常点滅表示灯（ハザードランプ）をつけているときはいつでも。
    B: 運転者が再進入の合図を出し、後部の電気式「譲れ（YIELD）」サインが点滅しているとき。
    C: 制限速度以下で走行している場合に限る。
    D: 公共交通バスに道を譲る義務はない。
  answer: B
  explanation: バスの運転者が車線への再進入の合図を出し、バスの後部にある電気式の「譲れ（YIELD）」サインが点滅している場合、後方から接近する車両は道を譲らなければなりません。
- id: 120
  category: signs_and_signals
  question: 低速車両マーク（エンブレム）はどのような見た目ですか？
  choices:
    A: 黒い縁取りのある黄色の三角形。
    B: 反射性の赤い縁取りと、蛍光オレンジの中心部。
    C: 中央に赤い円がある白い正方形。
    D: 黒い縁取りのある蛍光グリーンのひし形。
  answer: B
  explanation: 低速車両マークには、反射性の赤い縁取りと蛍光オレンジの中心部があります。
- id: 121
  category: vehicle_information
  question: 車両の後方からどれだけはみ出した積載物の末端に、少なくとも12インチ四方の赤い旗を表示しなければなりませんか？
  choices:
    A: 2フィート以上
    B: 3フィート以上
    C: 4フィート以上
    D: 5フィート以上
  answer: C
  explanation: 車両の後方から4フィート以上はみ出す積載物の末端には、少なくとも12インチ四方の赤い旗を表示しなければなりません。
- id: 122
  category: vehicle_information
  question: 乗用車の右側フェンダーの側面から、積載物はどれだけはみ出すことができますか？
  choices:
    A: フェンダーからはみ出してはならない
    B: 6インチまで
    C: 12インチまで
    D: 2フィートまで
  answer: B
  explanation: 乗用車の右側フェンダーの側面から、積載物は6インチを超えてはみ出してはなりません。
- id: 123
  category: sharing_the_road
  question: 葬列（葬儀の車列）の参加者ではない場合、車列の間を走行することに関してどのような規則がありますか？
  choices:
    A: ハザードランプを点灯させれば車列に加わることができる
    B: 右折する場合に限り、車両の間を走行できる
    C: 車列に加わったり、車両の間を走行したりすることは法律で禁止されている
    D: クラクションを鳴らせば車列を追い越すことができる
  answer: C
  explanation: 葬列の参加者ではない場合、車列に加わったり、車両の間を走行したりすることは法律で禁止されています。
- id: 124
  category: safe_driving_rules
  question: 多車線道路でライトを点滅させて停車している自動車に接近し、車線変更を行わない場合、どれくらい減速しなければなりませんか？
  choices:
    A: 掲示されている制限速度より少なくとも時速5マイル（5 mph）以上減速する
    B: 掲示されている制限速度より少なくとも時速10マイル（10 mph）以上減速する
    C: 正確に時速20マイル（20 mph）まで減速する
    D: 正確に時速15マイル（15 mph）まで減速する
  answer: A
  explanation: ライトを点滅させて停車している車両に接近する際に車線変更を行わない場合は、掲示されている制限速度より少なくとも時速5マイル（5 mph）以上減速する必要があります。
- id: 125
  category: safe_driving_rules
  question: ライトを点灯させたりサイレンを鳴らしたりしている緊急車両が通過した後、その車両の後方で維持しなければならない最低距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 緊急車両が通過した後は、その車両から少なくとも500フィート以上の距離を保たなければなりません。
- id: 126
  category: safe_driving_rules
  question: 警察車両に停止を求められた際、どこで停止することを避けるべきですか？
  choices:
    A: 道路の右側
    B: 交差点内または高速道路の中央分離帯
    C: 指定された駐車スペース
    D: 砂利の路肩
  answer: B
  explanation: 警察に停止を求められた際は、安全に停車できる範囲で道路の右側に寄せてください。交差点内や高速道路の中央分離帯には停車しないでください。
- id: 127
  category: penalties_and_points
  question: すべての工事区域（ワークゾーン）における交通違反の罰金はどうなりますか？
  choices:
    A: 半額になる
    B: 通常の道路と同じである
    C: 2倍になる
    D: 3倍になる
  answer: C
  explanation: すべての工事区域（ワークゾーン）において、交通違反の罰金は2倍になります。
- id: 128
  category: safe_driving_rules
  question: 工事区域（ワークゾーン）に掲示されている一時的な制限速度はいつ適用されますか？
  choices:
    A: 作業員が見えるときのみ
    B: 日中の時間帯のみ
    C: 作業員が見えないときも含め、常に適用される
    D: 重機が稼働しているときのみ
  answer: C
  explanation: 工事区域に掲示されている一時的な制限速度は、作業員が見えない場合であっても、常に適用されます。
- id: 129
  category: safe_driving_rules
  question: 停止線のない踏切で停止を求められた場合、最も近いレールからどれくらい離れて停止しなければなりませんか？
  choices:
    A: 少なくとも5フィート
    B: 少なくとも10フィート
    C: 少なくとも15フィート
    D: 少なくとも25フィート
  answer: C
  explanation: 停止を求められた場合は、停止線で停止してください。停止線がない場合は、最も近いレールから少なくとも15フィート離れた場所で停止してください。
- id: 130
  category: defensive_driving
  question: 車両が踏切内で立ち往生し、列車が接近している場合、降車した後はどの方向に移動すべきですか？
  choices:
    A: 列車が進んでいる方向と同じ方向に、線路と平行に移動する
    B: 列車が来る方向に向かって、線路から45度の角度で移動する
    C: 線路から90度の角度で、線路から離れる方向に移動する
    D: 列車から離れる方向に向かって、線路から45度の角度で移動する
  answer: B
  explanation: 列車が接近している場合は、破片などが当たらないよう、列車が来る方向に向かって線路から45度の角度で移動してください。
- id: 131
  category: safe_driving_rules
  question: 警察に車を止められ、外が暗い場合、警察官が近づいてくる前に何をすべきですか？
  choices:
    A: すべてのライトを消す
    B: ハイビームをつける
    C: 車内灯（ルームライト）をつける
    D: 懐中電灯を持って車から出る
  answer: C
  explanation: 暗い場合は、停車後、警察官が近づいてくる前に車内灯をつけてください。
- id: 132
  category: sharing_the_road
  question: 交差点を通過し始めたときに、後ろからサイレンを鳴らした救急車が近づいてきた場合、どうすべきですか？
  choices:
    A: 交差点内ですぐに停車する
    B: 交差点を通り抜け、右側に寄せて停車する
    C: 交差点内の右側に寄せて停車する
    D: 加速して交差点を抜け、そのまま走行を続ける
  answer: B
  explanation: 緊急車両のために交差点内で停車してはいけません。交差点を通り抜け、右側に寄せてから停車する必要があります。
- id: 133
  category: safe_driving_rules
  question: 線路内で車が動かなくなり、列車が近づいてきた場合、どうすべきですか？
  choices:
    A: 列車が進んでいる方向と同じ方向に、線路から離れて走る。
    B: 列車が来る方向に向かって、線路から45度の角度で離れる。
    C: 車内にとどまり、すぐに911に通報する。
    D: 車の横に立ち、腕を振って列車に知らせる。
  answer: B
  explanation: 列車が近づいてきた場合は、破片が当たらないよう、列車が来る方向に向かって線路から45度の角度で離れてください。
- id: 134
  category: sharing_the_road
  question: 路面電車やライトレールが乗客の乗り降りのために停車したとき、どうすべきですか？
  choices:
    A: クラクションを鳴らし、右側から追い越す。
    B: 時速10マイル（10 mph）以下の速度で注意深く追い越す。
    C: 動き出すか、人々が安全に離れるまで、後ろで待機する。
    D: 車線を変更し、加速して素早く追い越す。
  answer: C
  explanation: 路面電車や列車が人の乗り降りのために停車した場合は、動き出すか、人々が安全に離れるまで、その後ろに留まってください。
- id: 135
  category: sharing_the_road
  question: 隣接する車線から、自分と同じ方向に進んでいる路面電車の前を曲がるのは安全ですか？
  choices:
    A: はい、路面電車が停車している場合は安全です。
    B: はい、方向指示器（ウィンカー）を使えば安全です。
    C: いいえ、隣接する車線から路面電車の前を曲がってはいけません。
    D: いいえ、商用車を運転している場合を除き、曲がってはいけません。
  answer: C
  explanation: たとえ路面電車や列車が停車していても、隣接する車線から同じ方向に進んでいる路面電車や列車の前を曲がってはいけません。
- id: 136
  category: safe_driving_rules
  question: 縦列駐車をする際、車両を縁石からどのくらい近づける必要がありますか？
  choices:
    A: 6インチ以内
    B: 12インチ以内
    C: 18インチ以内
    D: 24インチ以内
  answer: B
  explanation: 縁石と平行に、かつ縁石から12インチ以内の場所に駐車してください。
- id: 137
  category: safe_driving_rules
  question: 縁石のある下り坂で駐車する場合、車輪をどちらに向けるべきですか？
  choices:
    A: 走行車線の方へ
    B: まっすぐ前へ
    C: 縁石の方へ
    D: 道路の端の方へ
  answer: C
  explanation: 縁石のある下り坂で駐車するときは、車両が坂を転がり落ちるのを防ぐために、車輪を縁石の方へ向けてください。
- id: 138
  category: penalties_and_points
  question: 有効な許可証なしで障害者用駐車スペースに駐車した場合の最低罰金額はいくらですか？
  choices:
    A: $50
    B: $100
    C: $165
    D: $250
  answer: C
  explanation: 障害者用駐車許可証を持っていない場合、罰金は165ドルから始まり、最大1,000ドルに達します。
- id: 139
  category: safe_driving_rules
  question: 消火栓から何フィート以内の場所に車両を停車または駐車してはいけませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: A
  explanation: 消火栓から10フィート以内の場所に車両を停車または駐車することはできません。
- id: 140
  category: safe_driving_rules
  question: 交差点にある標識のある、または標識のない横断歩道から何フィート以内に駐車することは違法ですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: C
  explanation: 交差点にある標識のある、または標識のない横断歩道から20フィート以内の場所に車両を停車または駐車することはできません。
- id: 141
  category: safe_driving_rules
  question: 信号機や標識から50フィート以内に駐車してはならないのは、どのような場合ですか？
  choices:
    A: 多車線道路にいる場合。
    B: 車両によって信号機や標識が視界から隠れてしまう場合。
    C: 制限速度が時速35マイル（35 mph）を超えている場合。
    D: 2時間以上駐車する場合。
  answer: B
  explanation: 車両によって信号機や標識が視界から隠れてしまう場合は、信号機や標識から50フィート以内に車両を停車または駐車することはできません。
- id: 142
  category: defensive_driving
  question: 緊急事態によりハイウェイの路肩に停車しなければならず、かつ200フィート離れた場所から車両を確認できない場合、どうしなければなりませんか？
  choices:
    A: ハイビームを点灯させる。
    B: 少なくとも200フィート離れた場所に旗、フレア（発炎筒）、または標識を設置して、接近してくる車両に警告する。
    C: 車道に立ち、腕を振る。
    D: エンジンをかけたまま、ドアを開けておく。
  answer: B
  explanation: 車両が前後両方向から200フィート離れた場所から確認できない場合は、接近してくる車両に警告する必要があります。これは、車両から前後両方向に少なくとも200フィート離れた場所に、旗、フレア、標識、信号、または合図者を配置することで行います。
- id: 143
  category: safe_driving_rules
  question: 緊急停車中に車両を離れる（無人にする）必要がある場合、どうすべきですか？
  choices:
    A: バッテリーの充電を維持するために、エンジンをかけたままにする。
    B: レッカー車の運転手のために、イグニッションに鍵を差したままにする。
    C: エンジンを切り、鍵を抜き、ブレーキをかけ、ハザードランプを点灯させる。
    D: バッテリーを節約するために、ハザードランプを消す。
  answer: C
  explanation: 車両を離れる必要がある場合は、エンジンを切り、鍵を抜き、ブレーキをかけ、ハザードランプを点灯させてください。
- id: 144
  category: driver_responsibility
  question: オレゴン州におけるシートベルトの正しい着用に関する規則は、次のうちどれですか？
  choices:
    A: 窮屈な場合は、ショルダーストラップを脇の下に通してもよい。
    B: ショルダーストラップを背中の後ろに回してもよい。
    C: 快適さのために、腰ベルトの部分に少し緩みを持たせるべきである。
    D: ショルダーストラップを脇の下に通したり、背中の後ろに回したりしてはならない。
  answer: D
  explanation: ベルトの腰部分や肩部分に緩みを作らないでください。ショルダーストラップを脇の下に通したり、背中の後ろに回したりしてはいけません。
- id: 145
  category: safe_driving_rules
  question: 駐車または停車した状態から発進する際、交通の流れに戻るための最も安全な方法は何ですか？
  choices:
    A: ミラーを確認し、素早く発進する。
    B: 死角とミラーを確認し、他のすべての車両に道を譲る。
    C: 他のドライバーが道を譲らなければならないため、合図を出して交通の流れに入る。
    D: 発進する前にクラクションを鳴らす。
  answer: B
  explanation: 駐車または停車した状態から発進する際は、死角とミラーを確認し、他のすべての車両に道を譲ってください。
- id: 146
  category: signs_and_signals
  question: 踏切にある緊急通知システム（ENS）の標識の目的は何ですか？
  choices:
    A: ドライバーに列車の接近を警告するため。
    B: 線路上の障害物を鉄道会社に通知し、接近中の列車に警告できるようにするため。
    C: 道路を横切る列車の制限速度を示すため。
    D: 踏切を安全に渡る方法の指示を提供するため。
  answer: B
  explanation: 線路付近の踏切の支柱にある緊急通知システム（ENS）の標識を探し、線路内の障害物を鉄道会社に通知することで、鉄道会社が接近中の列車に警告できるようにします。
- id: 147
  category: safe_driving_rules
  question: 乳児は何歳になるまで、後ろ向きのチャイルドシートに乗らなければなりませんか？
  choices:
    A: 1歳
    B: 2歳
    C: 3歳
    D: 4歳
  answer: B
  explanation: マニュアルによると、乳児は2歳になるまで後ろ向きで乗らなければなりません。
- id: 148
  category: safe_driving_rules
  question: 子供の乗客が、承認されたチャイルドシートの使用を義務付けられなくなるのはいつですか？
  choices:
    A: 6歳になったとき、または身長が4フィートになったとき。
    B: 8歳になったとき、または身長が少なくとも4フィート 9インチになったとき。
    C: 体重が60ポンドに達したとき。
    D: 10歳になったとき。
  answer: B
  explanation: 子供の乗客は、8歳になるか、身長が少なくとも4フィート9インチになり、かつ大人用のベルトが正しくフィットするようになるまで、承認されたチャイルドシートで固定される必要があります。
- id: 149
  category: defensive_driving
  question: 衝突を回避するための選択肢について、正しいものは次のうちどれですか？
  choices:
    A: 通常、車両を回転させる（ハンドルを切る）よりも、素早く停止させることができる。
    B: ほとんどの場合、車両を停止させるよりも、素早く回転させる（ハンドルを切る）ことができる。
    C: 衝突を避けるために加速することは、決して安全な選択肢ではない。
    D: 常に直ちにブレーキを強く踏むべきである。
  answer: B
  explanation: マニュアルには、ほとんどの場合、車両を停止させるよりも素早く回転させる（ハンドルを切る）ことができると記載されており、素早くハンドルを切ることは衝突を回避するための有効な手段となります。
- id: 150
  category: defensive_driving
  question: 車両が舗装路から外れてしまった場合、安全に道路に戻るための適切な方法は何ですか？
  choices:
    A: 強くブレーキをかけ、ハンドルを左に急に切る。
    B: パニックになり、すぐに舗装路へ急ハンドルで戻る。
    C: 減速し、道路に戻るのに必要な分だけ前輪を切る。
    D: 道路に戻る前に、トラクションを回復させるために加速する。
  answer: C
  explanation: 道路から外れてしまった場合は、パニックになったり強くブレーキをかけたりしてはいけません。減速し、ハンドルをしっかりと握り、急ハンドルを切らずに道路に戻るのに必要な分だけ前輪を切ってください。
- id: 151
  category: defensive_driving
  question: 対向車が自分の車線にはみ出してきた場合、なぜ絶対に反対車線に入って避けてはいけないのですか？
  choices:
    A: いかなる状況でも中央線を越えるのは違法だから。
    B: 対向車のドライバーが急に元の車線に戻る可能性があるから。
    C: 道路の反対側では車両のトラクションが失われるから。
    D: クラクションやライトを効果的に使用できなくなるから。
  answer: B
  explanation: マニュアルでは、対向車のドライバーが急に元の車線に戻り、正面衝突の危険があるため、絶対に反対車線に入らないよう警告しています。
- id: 152
  category: sharing_the_road
  question: 乗馬中の人が、あなたが近づいたときに手を挙げた場合、それは何を意味しますか？
  choices:
    A: 素早く追い越すよう合図している。
    B: あなたの存在を確認して手を振っている。
    C: 動物が怯えており、車両を停止させなければならない。
    D: 動物に警告するためにクラクションを鳴らすべきである。
  answer: C
  explanation: 乗馬中の人や動物を連れている人が手を挙げた場合は、動物が怯えていることを意味します。衝突の原因となる場合を除き、車両を停止させなければなりません。
- id: 153
  category: safe_driving_rules
  question: 日没から日の出までの時間に加えて、他にどのような時にヘッドライトを点灯しなければなりませんか？
  choices:
    A: 高速道路を走行しているときはいつでも。
    B: 状況により1,000フィート先の歩行者や車両が見えにくいとき。
    C: ワイパーを使用しているときのみ。
    D: 視界が500フィート以下に低下したとき。
  answer: B
  explanation: ヘッドライトは日没から日の出まで、および1,000フィート先の歩行者や車両が見えにくい状況ではいつでも点灯しなければなりません。
- id: 154
  category: safe_driving_rules
  question: 他の車両の後ろを走行している際、どのくらいの距離でハイビームをロービームに切り替えなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 350フィート
    D: 500フィート
  answer: C
  explanation: 他の車両の後ろを350フィート以内で走行する場合は、バックミラー越しに相手のドライバーの目をくらませないよう、ライトを暗く（ロービームに）しなければなりません。
- id: 155
  category: defensive_driving
  question: 夜間、対向車のヘッドライトの眩しさで目がくらむのを防ぐにはどうすればよいですか？
  choices:
    A: 対向車のヘッドライトを直接見る。
    B: 対向車のライトの少し右側を見て、道路の端やフォグライン（路側線）を確認する。
    C: 眩しさに対抗するためにハイビームを点灯する。
    D: 車両が通り過ぎるまで片目を閉じる。
  answer: B
  explanation: 夜間にヘッドライトの眩しさで目がくらむのを防ぐには、対向車のライトの少し右側を見て、道路の端やフォグラインを確認するようにしてください。
- id: 156
  category: safe_driving_rules
  question: 霧、砂埃、または煙の中を走行する際は、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム
    B: ロービーム
    C: パーキングライト（車幅灯）のみ
    D: ハザードランプのみ
  answer: B
  explanation: 霧、砂埃、煙、または視界の悪い場所を走行する場合は、ロービームを使用してください。ハイビームの光は反射して眩しさを引き起こすためです。
- id: 157
  category: safe_driving_rules
  question: 濡れた路面や雪道、凍結路面で走行する際に使用してはいけない車両機能は何ですか？
  choices:
    A: ワイパー
    B: ロービーム
    C: デフロスター
    D: クルーズコントロール
  answer: D
  explanation: マニュアルには「濡れた路面ではクルーズコントロールを使用しないでください」と明記されており、雪道や凍結路面での走行についても同様の警告が繰り返されています。
- id: 158
  category: vehicle_information
  question: 水たまりなどを走行してブレーキが濡れてしまった場合、どうすべきですか？
  choices:
    A: ブレーキを乾かすために繰り返し強く踏む。
    B: 反応し始めるまで、低速で走行しながら軽くブレーキをかける。
    C: ニュートラルに入れ、ブレーキが乾くまで惰性で走行する。
    D: 直ちに停車し、自然に乾くのを待つ。
  answer: B
  explanation: 水の中を走行してブレーキが濡れた場合は、ブレーキが反応し始めるまで低速で走行しながら軽くブレーキをかける必要があります。
- id: 159
  category: defensive_driving
  question: 雪や氷に覆われた道路が最も滑りやすくなるのはいつですか？
  choices:
    A: 気温が氷点下を大幅に下回っているとき。
    B: 気温が氷点下に近いとき。
    C: 日の出前の早朝の時間帯。
    D: 太陽が氷を直接照らしているとき。
  answer: B
  explanation: マニュアルでは、道路は氷点下よりも、気温が氷点下に近いときの方が最も滑りやすくなる可能性があることに注意するようアドバイスしています。
- id: 160
  category: defensive_driving
  question: 車両がスリップし始めたとき、取るべき正しいステアリング操作は何ですか？
  choices:
    A: ハンドルを完全に真っ直ぐに保持する。
    B: スリップしている方向とは逆にハンドルを切る。
    C: 車両を進めたい方向にハンドルを切る。
    D: トラクションを回復させるためにハンドルを左右に素早く切る。
  answer: C
  explanation: 車両がスリップし始めたら、ブレーキを踏まずに、車両を進めたい方向にハンドルを切ってください。
- id: 161
  category: vehicle_information
  question: オレゴン州では、スタッド付きタイヤ（スパイクタイヤ）の使用は通常どの期間に許可されていますか？
  choices:
    A: 10月1日から4月30日まで
    B: 11月1日から3月31日まで
    C: 12月1日から2月28日まで
    D: 一年中許可されている。
  answer: B
  explanation: オレゴン州では、スタッド付きタイヤの使用は通常11月1日から3月31日までのみ許可されています。
- id: 162
  category: safe_driving_rules
  question: オレゴン州における18歳未満の運転者の携帯電話使用に関する規則は何ですか？
  choices:
    A: ハンズフリー機器を使用できる。
    B: 赤信号で停車中のみテキスト送信ができる。
    C: 車両の運転中に携帯電話やその他の携帯型電子機器を使用することは違法である。
    D: GPSナビゲーションのためだけに携帯電話を使用できる。
  answer: C
  explanation: マニュアルには、18歳未満の運転者が車両の運転中に携帯電話やその他の携帯型電子機器を使用することは違法であると記載されています。
- id: 163
  category: safe_driving_rules
  question: 運転中に携帯電話を使用したい18歳以上の運転者は、どうしなければなりませんか？
  choices:
    A: 携帯電話を膝の上に置いておく。
    B: 指の最小限の操作のみで済むハンズフリー機器を使用する。
    C: 時速30マイル（30 mph）以下で走行している時のみ携帯電話を使用する。
    D: 電話に出るために路肩に停車する。
  answer: B
  explanation: 18歳以上の運転者が携帯電話を使用する場合はハンズフリー機器を使用しなければならず、機器の起動または停止には指の最小限の操作のみが必要である必要があります。
- id: 164
  category: penalties_and_points
  question: 車両からどのくらい離れた距離まで聞こえるような大音量でラジオや音響システムを再生することは違法ですか？
  choices:
    A: 25フィート
    B: 50フィート
    C: 100フィート
    D: 200フィート
  answer: B
  explanation: クラクションやサイレンを聞き取ることが重要であるため、車両から50フィート離れた場所で聞こえるほどの大音量でラジオやその他の音響システムを再生することは違法です。
- id: 165
  category: defensive_driving
  question: 「ロード・レイジ（あおり運転）」を行っている攻撃的な運転者に遭遇した場合、どうすべきですか？
  choices:
    A: 相手から離れるためにスピードを上げる。
    B: 他の運転者に警告するためにクラクションを鳴らす。
    C: 邪魔にならないようにし、相手を挑発しない。
    D: 安全な場所まで相手を追い越そうとする。
  answer: C
  explanation: 攻撃的な運転者を見かけたら、邪魔にならないようにしてください。スピードを上げたり、追い越そうとしたりして相手を挑発してはいけません。
- id: 166
  category: safe_driving_rules
  question: 運転中に眠気を防ぐために推奨されていることは次のうちどれですか？
  choices:
    A: できるだけ早く目的地に到着するように急ぐ。
    B: 脱水を防ぐために水を飲む。
    C: ラジオの音量を最大にする。
    D: 目線をまっすぐ前方に固定する。
  answer: B
  explanation: 眠気を防ぐために、マニュアルでは水を飲むことを推奨しています。脱水症状は疲労の原因となる可能性があるためです。
- id: 167
  category: alcohol_drugs_health
  question: オレゴン州の法律では、血中アルコール濃度（BAC）がいくつ以上の場合、機能が損なわれているとみなされ、DUII（酒気帯び・薬物影響下運転）で逮捕される可能性がありますか？
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: 血中アルコール濃度が0.08%以上の場合、オレゴン州の法律では機能が損なわれているとみなされます。
- id: 168
  category: alcohol_drugs_health
  question: オレゴン州の「黙示の同意（Implied Consent）」法とは何を意味しますか？
  choices:
    A: 車を止められた際、車両の捜索に同意すること。
    B: 警察官から求められた際、呼気、血液、または尿の検査を受けることに同意すること。
    C: DUIIで逮捕された場合、自動的に有罪を認めること。
    D: 交通違反切符に関連するすべての罰金を支払うことに同意すること。
  answer: B
  explanation: オレゴン州の黙示の同意法は、自動車を運転することにより、警察官から求められた際に呼気、血液、または尿の検査を受けることに同意したことを意味します。
- id: 169
  category: alcohol_drugs_health
  question: 21歳未満の場合、血中アルコール濃度がどの程度であればアルコール検査で不合格となりますか？
  choices:
    A: 0.02%以上
    B: 0.05%以上
    C: 0.08%以上
    D: いかなる量でも
  answer: D
  explanation: 21歳未満の場合、オレゴン州のゼロ・トレランス（不寛容）法により、血中アルコール濃度がいかなる量であっても検査は不合格となります。
- id: 170
  category: alcohol_drugs_health
  question: オレゴン州の「オープン・コンテナ（開封された容器）」法によると、開封されたアルコールのボトルや容器は車内のどこに保管すべきですか？
  choices:
    A: グローブボックスの中
    B: 運転席の下
    C: トランクの中
    D: 後部座席の足元
  answer: C
  explanation: オレゴン州のオープン・コンテナ法では、開封されたボトルや容器はトランクの中に置かなければならないと定められています。
- id: 171
  category: safe_driving_rules
  question: オレゴン州の法律では、何歳未満の人がボンネット、フェンダー、またはピックアップトラックの荷台に乗ることを禁止していますか？
  choices:
    A: 16歳
    B: 18歳
    C: 21歳
    D: 年齢制限はありません。すべての人に対して違法です。
  answer: B
  explanation: オレゴン州の法律では、18歳未満の人がボンネット、フェンダー、ランニングボード、またはピックアップトラックの荷台を含む車両の外側に搭乗することを禁止しています。
- id: 172
  category: defensive_driving
  question: 走行中にタイヤがバースト（破裂）した場合、まず最初に行うべきことは何ですか？
  choices:
    A: すぐに強くブレーキをかける。
    B: ハンドルをしっかりと握る。
    C: ギアをニュートラルに入れる。
    D: ハザードランプを点灯させる。
  answer: B
  explanation: タイヤがバーストした場合は、マニュアルの指示に従い、まずハンドルをしっかりと握り、その後徐々に減速して道路脇に停車してください。
- id: 173
  category: defensive_driving
  question: 走行中にブレーキが効かなくなった場合、次のうちどの行動をとるべきですか？
  choices:
    A: より高いギアにシフトアップする。
    B: すぐにエンジンを切る。
    C: ブレーキを繰り返し踏み（ポンピング）、圧力を高める。
    D: パーキングブレーキをできるだけ早く引き上げる。
  answer: C
  explanation: ブレーキが故障した場合は、ブレーキを繰り返し踏んでください。これにより、ブレーキを再び作動させるのに十分な圧力が得られる場合があります。
- id: 174
  category: defensive_driving
  question: 車のアクセルが戻らなくなった（固着した）場合、どうすべきですか？
  choices:
    A: 手のひらを使って、ギアをニュートラルに入れる。
    B: すぐにイグニッション（エンジン）を切る。
    C: アクセルペダルを素早く何度も踏む。
    D: ギアをバック（リバース）に入れる。
  answer: A
  explanation: アクセルが固着した場合は、回避ルートを探しながら、他のギアに誤って入らないよう手のひらを使ってギアをニュートラルに入れてください。
- id: 175
  category: vehicle_information
  question: 燃費を向上させ、燃料を節約するために推奨される方法は次のうちどれですか？
  choices:
    A: 急発進や急停車を行う。
    B: エンジンを温めるためにアイドリングを続ける。
    C: 一定の速度で走行し、掲示された制限速度を超えないようにする。
    D: 用事のために何度も別々に車を出す。
  answer: C
  explanation: 燃費を向上させ燃料を節約するために、マニュアルでは一定の速度で走行し、掲示された制限速度を超えないようにすることを推奨しています。
- id: 176
  category: safe_driving_rules
  question: 運転中に携帯電話にテキストメッセージが届いた場合、どうすべきですか？
  choices:
    A: すぐにメッセージを読んで返信する。
    B: 安全な駐車場所に停車するまでメッセージを無視する。
    C: 自分が入力している間、同乗者にメッセージを読んでもらう。
    D: 速度を落とし、道路を注視しながらメッセージを読む。
  answer: B
  explanation: マニュアルには、運転中に携帯電話にテキストメッセージが届いた場合、安全な駐車場所に停車するまでそのメッセージを無視すべきであると記載されています。
- id: 177
  category: license_system
  question: クラスC非営利運転免許では、最大何ポンドまでの車両を運転することが認められていますか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 26,000ポンド
    D: 33,000ポンド
  answer: C
  explanation: クラスC非営利運転免許では、商業運転免許（CDL）や二輪車免許の要件から除外されている、26,000ポンド以下の車両を運転することができます。
- id: 178
  category: license_system
  question: オレゴン州で仮免許（学習許可証）を申請するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: クラスC非営利運転免許の資格を得るための仮免許（学習許可証）を申請するには、少なくとも15歳である必要があります。
- id: 179
  category: license_system
  question: ODOT（オレゴン州運輸局）承認の交通安全教育コースを受講して「いない」18歳未満の申請者は、何時間の監督下での運転経験が必要ですか？
  choices:
    A: 40時間
    B: 50時間
    C: 80時間
    D: 100時間
  answer: D
  explanation: 18歳未満の申請者は、100時間の監督下での運転経験が必要です。ただし、ODOT承認の交通安全教育コースを受講した場合は、50時間の監督下での運転経験となります。
- id: 180
  category: license_system
  question: 必要な運転経験としてカウントされるためには、監督ドライバーは21歳以上であり、かつ少なくとも何年間の有効な運転免許を保持している必要がありますか？
  choices:
    A: 1年間
    B: 2年間
    C: 3年間
    D: 5年間
  answer: C
  explanation: 運転経験が認められるためには、21歳以上で、かつ少なくとも3年間の有効な運転免許を保持している人による監督が必要です。
- id: 181
  category: license_system
  question: オレゴン州の運転免許証（driving privilege）用の写真を撮影する際、許可されていないのは次のうちどれですか？
  choices:
    A: 微笑むこと
    B: 補聴器を着用すること
    C: 眼鏡を着用すること
    D: 髪を後ろで束ねること
  answer: C
  explanation: 写真撮影の際、帽子、眼鏡、顔へのペイントやその他の一時的な物質、または目の外見を変えるコンタクトレンズの着用は認められていません。
- id: 182
  category: license_system
  question: 本人確認および生年月日を証明するために受理可能な書類は、次のうちどれですか？
  choices:
    A: 病院発行の出生証明書
    B: 洗礼記録
    C: 有効期限が10年前に切れた米国パスポート
    D: 米国政府発行の出生証明書
  answer: D
  explanation: 受理可能な証明書類には、米国政府発行の出生証明書が含まれます。病院発行の出生証明書や洗礼記録は受理されません。また、パスポートは有効期限が切れてから5年以内である必要があります。
- id: 183
  category: license_system
  question: 現在の居住住所の証明として受理可能なものは、次のうちどれですか？
  choices:
    A: 友人からの私信
    B: 転送された郵便物
    C: 公共料金の接続注文書または請求書
    D: 名字の記載がない雑誌の定期購読
  answer: C
  explanation: 住所の証明として一般的なものには、公共料金の接続注文書、請求書、住宅ローン書類、または固定資産税の明細書が含まれます。私信や転送された郵便物は受理されません。
- id: 184
  category: license_system
  question: 免許証または許可証に「聴覚障害者または難聴者（Deaf or hard of hearing）」の表記を追加するために必要な証明は何ですか？
  choices:
    A: 医師の診断書
    B: 認定専門医による聴力図（オーディオグラム）
    C: 裁判官が署名した書類
    D: 証明は不要
  answer: D
  explanation: DMVに対し、免許証または許可証に聴覚障害者または難聴者の表記を追加するようリクエストすることができます。その際、証明書類は必要ありません。
- id: 185
  category: vehicle_information
  question: オレゴン州において、1回の衝突につき財物損害に対して義務付けられている最低保険補償額はいくらですか？
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: オレゴン州の法律では、他人の財物への損害に対し、1回の衝突につき最低20,000ドルの保険加入が義務付けられています。
- id: 186
  category: driver_responsibility
  question: 負傷者のいない衝突事故を起こした場合、車両をどうすべきですか？
  choices:
    A: 警察が到着するまで、そのままの場所に放置する。
    B: 安全が確認でき次第、速やかに走行車線から車両を移動させる。
    C: すぐに運転して帰宅し、後で警察に電話する。
    D: 車両を放置して、最寄りの電話まで歩く。
  answer: B
  explanation: 負傷者がおらず、車両を安全に移動できる場合は、速やかに走行車線から車両を移動させなければなりません。
- id: 187
  category: driver_responsibility
  question: 車両の損害が2,500ドルを超え、かつ以下のどの条件を満たす場合、72時間以内にDMVに事故報告書を提出しなければなりませんか？
  choices:
    A: 衝突が夜間に発生した。
    B: 相手のドライバーが保険に加入していない。
    C: 衝突による損傷のため、いずれかの車両が現場からレッカー移動された。
    D: 制限速度が時速55マイルを超えていた。
  answer: C
  explanation: いずれかの車両の損害が2,500ドルを超え、かつ衝突による損傷のために車両が現場からレッカー移動された場合は、72時間以内に事故報告書を提出しなければなりません。
- id: 188
  category: driver_responsibility
  question: 無人の車両に衝突し、所有者が見つからない場合はどうしなければなりませんか？
  choices:
    A: 誰も怪我をしていないので、すぐに現場を離れる。
    B: 現場を離れる前に、最大1時間車両のそばで待つ。
    C: 自分の名前、住所、および何が起きたかの簡単な説明を書いたメモを残す。
    D: レッカー車を呼び、損傷した車両を移動させる。
  answer: C
  explanation: 無人の車両に衝突し、所有者が見つからない場合は、自分の名前と住所、および事故の状況を簡潔に記したメモを残してください。
- id: 189
  category: penalties_and_points
  question: オレゴン州で運転資格を失う理由となるのは、次のうちどれですか？
  choices:
    A: 車両衝突事故の報告を怠ること。
    B: 駐車違反切符を1枚切られること。
    C: 20年以上前の古い車両を運転すること。
    D: 免許証を家に忘れること。
  answer: A
  explanation: 運転資格を失う理由には、車両衝突事故の報告義務違反、無保険運転、および酒気帯び・薬物影響下運転（DUI）などが含まれます。
- id: 190
  category: penalties_and_points
  question: 交通違反の有罪判決が多すぎるために運転資格を失うことに関連するプログラムは何ですか？
  choices:
    A: 交通リハビリテーション・システム
    B: 安全運転イニシアチブ
    C: ドライバー改善プログラム（Driver Improvement Program）
    D: 有罪判決軽減プログラム
  answer: C
  explanation: マニュアルによると、ドライバー改善プログラム（Driver Improvement Program）に基づき、交通違反の有罪判決が多すぎる場合に運転資格を失うことがあります。
- id: 191
  category: alcohol_drugs_health
