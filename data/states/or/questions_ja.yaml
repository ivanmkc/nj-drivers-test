  explanation: この標識は、この先の道路が中央分離帯や障壁によって対向車線と分けられた分離道路（divided highway）になることを警告しています。右側を通行してください。
  id: 213
- image: handicap_parking.png
  category: signs_and_signals
  question: この標識がある場所に駐車できるのは誰ですか？
  choices:
    A: 15分以内であれば誰でも
    B: 高齢者のみ
    C: 有効な障害者用駐車許可証またはナンバープレートを掲示している車両のみ
    D: 障害のある同乗者がいるすべての運転者
  answer: C
  explanation: 車椅子のシンボルが描かれた青い標識は、障害者のために予約された駐車スペースであることを示しています。有効な障害者用駐車許可証またはライセンスプレート（ナンバープレート）を掲示している車両のみが、これらのスペースに駐車できます。違反した場合は高額な罰金が科せられます。
  id: 214
- id: 215
  category: license_system
  question: REAL ID準拠のオレゴン州免許証以外で、成人が米国の国内線（商業便）に搭乗する際に認められる身分証明書として、次のうちどれが挙げられていますか？
