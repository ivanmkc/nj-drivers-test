    B: ODOT承認の運転者教育コースを修了しなければならない。
    C: 今後の試験はDMVのオフィスで予約し、受験しなければならない。
    D: 24時間の待機期間の後、さらに2回オンラインで試験を受けることができる。
  answer: C
