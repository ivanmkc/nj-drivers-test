- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行して注意深く進む
    B: 一時停止する
    C: 対向車に道を譲る
    D: 他の車両がいる場合のみ停止する
  answer: B
  explanation: 赤い八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る前で完全に停止しなければならないことを意味します。進む前に、交通状況と歩行者を確認してください。
  id: 204
- image: yield.png
  category: signs_and_signals
  question: この標識はあなたに何を求めていますか？
  choices:
    A: 一時停止する
    B: 加速して交通の流れに合流する
    C: 減速し、車両や歩行者に道を譲る
    D: 停止せずに進む
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、減速して車両や歩行者に優先権を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 205
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけたら、どうすべきですか？
  choices:
    A: Uターンする
    B: 注意深く運転を続ける
    C: 停止してバックするか、向きを変える — あなたは逆走しています
    D: 素早くそのエリアを離れるために加速する
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止/逆走）」標識は、一方通行の道路や高速道路のランプを逆走していることを意味します。直ちに停止し、安全に向きを変えるかバックしてください。
  id: 206
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が禁止されていることを意味します。
  id: 207
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
    A: 警戒標識
    B: 案内標識
    C: 規制標識
    D: 工事標識
  answer: C
  explanation: 黒い文字が書かれた白い長方形の標識は規制標識です。速度制限標識は、理想的な条件下でのその区域の法定最高速度を示しています。
  id: 208
- image: deer_crossing.png
  category: signs_and_signals
  question: この黄色いひし形の標識は何を警告していますか？
  choices:
    A: この先に動物園やサファリパークがある
    B: この区域ではシカが頻繁に道路を横断する
    C: この先は狩猟区域である
    D: 近くに野生動物保護区がある
  answer: B
  explanation: シカのシルエットが描かれた黄色いひし形の標識は、この区域でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 209
- image: school_zone.png
  category: signs_and_signals
  question: この標識の形は何を示していますか？
  choices:
    A: 踏切
    B: 工事区域
    C: 学校区域または通学路
    D: 病院区域
  answer: C
  explanation: 五角形（5辺）の蛍光黄緑色の標識は、学校区域または通学路であることを示しています。速度を落とし、子供に注意してください。
  id: 210
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: 通常、この標識はどこで見かけますか？
  choices:
    A: 学校の横断歩道
    B: 踏切
    C: 病院の入り口
    D: 歩道橋
  answer: B
  explanation: 白いX字型の踏切警標（クロスカット標識）は、踏切に設置されています。これは列車に道を譲らなければならないことを意味します。列車が近づいている場合は、一時停止しなければなりません。
  id: 211
- image: sharp_turn_right.png
  category: signs_and_signals
  question: この標識はカーブの標識とどのように異なりますか？
  choices:
    A: より緩やかな曲がり角であることを示している
    B: より大幅な減速が必要な急カーブを警告している
    C: 右折専用であることを意味している
    D: 高速道路でのみ使用される
  answer: B
  explanation: 急カーブの標識（矢印の角度が急なもの）は、通常のカーブ標識よりも急な曲がり角であることを示しています。このカーブの手前では、より大幅に速度を落とす必要があります。
  id: 212
- image: divided_highway.png
  category: signs_and_signals
  question: この標識はこの先に何があることを示していますか？
  choices:
    A: 道路の終点
    B: 対面通行
    C: 分離道路の始まり
    D: 高速道路の出口
