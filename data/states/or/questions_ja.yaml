    B: この付近ではシカが頻繁に道路を横断します
    C: この先は狩猟区域です
    D: 近くに野生動物保護区があります
  answer: B
  explanation: シカのシルエットが描かれた黄色のひし形の標識は、その付近でシカが頻繁に道路を横断することを警告しています。速度を落とし、特に夜明けや夕暮れ時は動物に注意してください。
  id: 209
- image: school_zone.png
  category: signs_and_signals
