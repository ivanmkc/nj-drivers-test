- image: stop.png
  category: signs_and_signals
  question: この標識は何を意味していますか？
  choices:
    A: 徐行して注意深く進んでください
    B: 完全に停止してください
    C: 対向車に道を譲ってください
    D: 他の車両がいる場合のみ停止してください
  answer: B
  explanation: 赤い八角形の「STOP（一時停止）」標識は、停止線、横断歩道、または交差点に入る手前で完全に停止しなければならないことを意味します。進む前に、交通状況と歩行者を確認してください。
  id: 204
- image: yield.png
  category: signs_and_signals
  question: この標識はどのような行動を求めていますか？
  choices:
    A: 完全に停止してください
    B: 加速して交通の流れに合流してください
    C: 徐行し、他の車両や歩行者に優先権を譲ってください
    D: 停止せずに進んでください
  answer: C
  explanation: 赤と白の三角形の「YIELD（譲れ）」標識は、速度を落とし、他の車両や歩行者に道を譲らなければならないことを意味します。他者が安全に通過できるように、必要に応じて停止しなければなりません。
  id: 205
- image: wrong_way.png
  category: signs_and_signals
  question: この標識を見かけた場合、どうすべきですか？
  choices:
    A: Uターンしてください
    B: 注意しながら運転を続けてください
    C: 停止して後退するか、向きを変えてください。あなたは逆走しています。
    D: 加速して速やかにそのエリアから離れてください
  answer: C
  explanation: 赤と白の「WRONG WAY（進入禁止/逆走）」標識は、一方通行の道路や高速道路のランプで交通の流れに逆らって走行していることを意味します。直ちに安全に停止し、向きを変えるか後退してください。
  id: 206
- image: no_left_turn.png
  category: signs_and_signals
  question: この標識によって禁止されている行為は何ですか？
  choices:
    A: 右折
    B: 左折
    C: Uターン
    D: 直進
  answer: B
  explanation: 左折の矢印に斜線が引かれた白い規制標識は、その交差点での左折が禁止されていることを意味します。
  id: 207
- image: speed_limit_25.png
  category: signs_and_signals
  question: 形と色に基づくと、これはどの種類の標識ですか？
  choices:
