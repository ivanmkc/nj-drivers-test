  question: オレゴン州の新規居住者の場合、どのような条件であればDMVは実技試験を免除することがありますか？
  choices:
    A: いずれかの国の有効な運転免許証を少なくとも5年間保持している場合。
    B: 有効であるか、期限切れから1年未満の他州の免許証を返納する場合。
    C: 25歳以上で、違反歴がない場合。
    D: 最初の受験で学科試験に満点で合格した場合。
  answer: B
  explanation: マニュアルには、DMVが実技試験を免除する場合として、「有効であるか、期限切れから1年未満の他州の免許証を返納する新規居住者である場合」と記載されています。
- id: 232
  category: driver_testing
  question: DMVのオフィスで学科試験を受ける際、音声補助のために持ち込みが許可されているものはどれですか？
  choices:
    A: 問題を読み上げるための個人通訳者。
    B: DMVが提供する音声デバイスのみ。
    C: 自分自身のイヤホンまたはヘッドホン。
    D: テキスト読み上げアプリを搭載したスマートフォン。
  answer: C
  explanation: マニュアルには、オフィス内での学科試験について、「試験のために自分自身のイヤホンまたはヘッドホンを持参することができます」と記載されています。
- id: 233
  category: penalties_and_points
  question: 学科試験において、不合格となり90日間の再試験制限が課される「不正行為」として具体的に定義されている行動はどれですか？
  choices:
    A: 試験官に質問の意図を確認すること。
    B: 許可を得て紙の外国語翻訳辞書を使用すること。
    C: メモを取ること、または他人に身代わり受験をさせること。
    D: 制限時間内に試験を完了できないこと。
  answer: C
  explanation: マニュアルには、不正行為とみなされるいくつかの行動が挙げられており、それには「会話、書き込みやメモ取り、携帯電話の使用、あらゆる電子機器の操作、または他人に身代わりで試験を受けさせること」が含まれます。
- id: 234
  category: signs_and_signals
  question: 「YIELD（ゆずれ）」の標識の形と意味は何ですか？
  choices:
    A: 八角形：進む前に完全に停止しなければならない。
    B: 三角形：速度を落とし、優先権を譲り、必要に応じて停止しなければならない。
    C: 正方形：逆走しており、引き返さなければならない。
    D: 円形：踏切に近づいており、列車を確認しなければならない。
  answer: B
  explanation: マニュアルでは、ゆずれ（Yield）の標識を「三角形：この標識は、速度を落として優先権を譲るべきであることを意味します。必要に応じて、一時停止標識と同じように停止してください」と説明しています。
- id: 235
  category: signs_and_signals
  question: 赤い円と斜線が描かれた標識は何を示していますか？
  choices:
    A: 示されている行動は推奨されるが、必須ではない。
    B: 危険に近づいているため、減速すべきである。
    C: 前方の道路はすべての交通に対して閉鎖されている。
    D: 標識に示されている行動をしてはいけない。
  answer: D
  explanation: マニュアルには、「赤い円と斜線のある標識を見たときは、示されているターン（曲がること）をしてはいけないという意味です」と記載されています。
- id: 236
  category: vehicle_information
  question: 実技試験において、天候条件により必要とされる場合、車両に備わっていなければならない装備の組み合わせはどれですか？
  choices:
    A: 全天候型フロアマットと救急箱。
    B: アイススクレーパーと緊急用フレア（発炎筒）。
    C: トラクションタイヤまたはチェーン、および作動するウィンドウデフロスター。
    D: GPSナビゲーションシステムとカーカバー。
  answer: C
  explanation: マニュアルには、「天候条件により必要な場合、車両にはトラクションタイヤまたはチェーン、ワイパー、ヘッドライト、テールライト、およびウィンドウデフロスターが備わっていなければなりません」と明記されています。
- id: 237
  category: driver_testing
  question: DMVの代わりに認定外部試験機関（Third Party tester）を利用する場合の潜在的なデメリットは何ですか？
  choices:
    A: 試験が大幅に難しくなる。
    B: 試験費用が高くなる可能性がある。
    C: 結果がDMVによって認められない。
    D: 予約可能な時間枠が少ない。
  answer: B
  explanation: マニュアルには、外部試験機関はスケジュールの柔軟性が高い一方で、「ただし、外部試験機関を利用する場合、試験費用が高くなる可能性があります」と記されています。
- id: 238
  category: signs_and_signals
  question: 「DO NOT ENTER（進入禁止）」の標識は、主に何を警告していますか？
  choices:
    A: 前方の道路が工事中であること。
    B: その道路が私道であること。
    C: 一方通行の道路に逆方向に進入しようとしていること。
    D: 事故により道路が一時的に閉鎖されていること。
  answer: C
  explanation: マニュアルには、「進入禁止（Do Not Enter）– 正方形：この標識は、道路や高速道路に進入しないよう警告するものです。逆走している場合にこの標識を目にすることになります」と記載されています。
- id: 239
  category: driver_testing
  question: 実技試験の予約は、最低でもどのくらい前に行うことが推奨されていますか？
  choices:
    A: 1週間前。
    B: 2週間前。
    C: 3週間前。
    D: 4週間前。
  answer: C
  explanation: マニュアルでは、「試験を受けたい日の少なくとも3週間前に予約を入れるのが良い方法です」とアドバイスしています。
- id: 240
  category: vehicle_information
  question: 実技試験に使用する車両として認められるためには、助手席はどのような状態でなければなりませんか？
  choices:
    A: 電動調整機能とヒーターが装備されていること。
    B: 革またはそれに類する素材で覆われていること。
    C: 適切で、固定されており、適度に清潔であること。
    D: 空席であり、周囲に物が一切置かれていないこと。
  answer: C
  explanation: 実技試験の車両装備チェックリストには、「適切で、固定されており、適度に清潔な助手席」が含まれています。
- id: 241
  category: driver_testing
  question: DMV（陸運局/運転免許センター）で試験を受ける前に、何をしなければなりませんか？
  choices:
    A: 少なくとも1週間前までに予約を入れる。
    B: 試験手数料を支払い、身分証明書、生年月日、および住所の証明書を提示する。
    C: オンラインの事前スクリーニングアンケートに回答する。
    D: 所持している他州の身分証明書をすべて返納する。
  answer: B
  explanation: マニュアルには、「試験を受ける際は毎回、まず試験手数料を支払い、身分証明書、生年月日、および現在の居住住所の証明書を提示しなければならない」と記載されています。
- id: 242
  category: signs_and_signals
  question: 「右側通行 (Keep Right)」の標識は何を示していますか？
  choices:
    A: 次の交差点で右折しなければならない。
    B: 低速車は右側の車線を走行しなければならない。
    C: この先に交通島、中央分離帯、または障害物があり、その右側を通行しなければならない。
    D: この先の道路が右にカーブしている。
  answer: C
  explanation: マニュアルによると、「右側通行 (Keep Right)」の標識は「この先に交通島、中央分離帯、または障害物があり、道路が分かれている。右側を通行せよ」という意味です。
- id: 243
  category: signs_and_signals
  question: 「赤信号での右折禁止 (No Turn on Red)」の標識がある交差点に近づいたとき、どうしなければなりませんか？
  choices:
    A: 歩行者がいなければ、一時停止した後に右折してもよい。
    B: 信号が青に変わるまで待ってから曲がらなければならない。
    C: 一方通行の道路から別の一方通行の道路へ左折してもよい。
    D: すべての交差車両に道を譲った後であれば曲がってもよい。
  answer: B
  explanation: マニュアルでは、「赤信号での右折禁止 (No Turn on Red)」の標識について、「赤信号の間は曲がってはならない。信号が青に変わるまで待たなければならない」と規定されています。
- id: 244
  category: signs_and_signals
  question: 「青信号での左折は譲れ (Left Turn Yield on Green)」の標識はどういう意味ですか？
  choices:
    A: 青信号で左折する場合、自分に優先権がある。
    B: 左折中、対向車は自分に道を譲らなければならない。
    C: 円形の青信号では、左折する前に対向車と歩行者に道を譲らなければならない。
    D: 青色の矢印信号が出ているときのみ左折できる。
  answer: C
  explanation: マニュアルには、この標識は「円形の青信号では、安全に曲がれるようになるまで、対向車と歩行者に優先権を譲ること」を意味すると記載されています。
- id: 245
  category: signs_and_signals
  question: 横断歩道に「歩行者のためにここで停止 (Stop Here for Pedestrians)」の標識がある場合、歩行者がいるときはどこで停止しなければなりませんか？
  choices:
    A: 横断歩道の少なくとも20フィート手前。
    B: 停止線。
    C: 横断歩道の手前で、視界が十分に確保できる場所ならどこでもよい。
    D: 歩行者が道路の自分の側の半分にいる場合のみ停止する。
  answer: B
  explanation: マニュアルには、「歩行者が横断歩道内にいるときは、停止線で停止すること」と指示されています。
- id: 246
  category: signs_and_signals
  question: 「つづら折りあり (Winding Road)」の標識は何を警告していますか？
  choices:
    A: この先の道路は濡れると滑りやすい。
    B: すぐ先に急カーブがある。
    C: 道路に一連の曲がり角やカーブがある。
    D: この先の道路が右にカーブした後、左にカーブしている。
  answer: C
  explanation: マニュアルでは、「つづら折りあり (Winding Road)」の標識は「道路に一連の曲がり角やカーブがあること」を示すと定義されています。
- id: 247
  category: signs_and_signals
  question: 「車線減少 (Lane Reduction)」の標識を見たとき、運転者はどのような行動をとらなければなりませんか？
  choices:
    A: 進む前に完全に停止する。
    B: 隣の車線の車の前に出るために加速する。
    C: 走行中の車線がまもなく終わるため、直進車線へ合流する。
    D: 直ちにハイウェイから出る。
  answer: C
  explanation: マニュアルには、「車線減少 (Lane Reduction)」の標識について、「示された車線がまもなく終了する。その車線の車両は直進車線へ合流しなければならない」と記載されています。
- id: 248
  category: signs_and_signals
  question: 「この先対面通行 (Two-Way Traffic Ahead)」の標識は何を警告していますか？
  choices:
    A: 走行中の中央分離帯のあるハイウェイがまもなく終了する。
    B: 走行中の一方通行の道路が、まもなく対面通行（双方向）の道路に合流する。
    C: 他車を追い越すことが許可されている。
    D: この先に合流車線がある。
  answer: B
  explanation: マニュアルでは、「この先対面通行 (Two-Way Traffic Ahead)」の標識は「一方通行の道路がこの先で対面通行の道路に合流する。対向車と向き合うことになる」という意味であると説明されています。
- id: 249
  category: signs_and_signals
  question: 「頭上注意 (Low Clearance)」の標識が提供する主な警告は何ですか？
  choices:
    A: この先の道路は勾配が急である。
    B: この先の跨道橋（オーバーパス）が低く、車両の高さによっては下を通過できない可能性がある。
    C: この先に踏切がある。
    D: この先で制限速度が下がる。
  answer: B
  explanation: マニュアルには、「頭上注意 (Low Clearance)」の標識は「この先の跨道橋の高さ制限が低い。車両が高すぎて下を通過できない場合は進んではならない」という意味であると記載されています。
- id: 250
  category: signs_and_signals
  question: 「路面スリップ注意 (Slippery When Wet)」の標識の意味は：
  choices:
    A: このエリアでは常に制限速度以下で走行すべきである。
    B: 路面が濡れているとき、通常よりも滑りやすくなる。
    C: 大雨の際に道路が冠水しやすい。
    D: 雨が降っているときはハザードランプを点灯させるべきである。
  answer: B
  explanation: マニュアルによるこの標識の定義は、「路面が濡れているとき、通常よりも滑りやすくなる」です。
- id: 251
  category: signs_and_signals
  question: 高速道路の緑色の出口標識にある数字の目的は何ですか？
  choices:
    A: 次の都市までの距離を示している。
    B: 走行中の高速道路の路線番号を示している。
    C: どの出口で降りるべきかを知る助けになる。
    D: 出口ランプの推奨速度である。
  answer: C
  explanation: マニュアルには、「出口標識の数字は、どの出口で降りるべきかを知る助けになります」と記載されています。
- id: 252
  category: signs_and_signals
  question: 史跡、景勝地、公園を指し示す標識は何色ですか？
  choices:
    A: 青
    B: 緑
    C: 黄色
    D: 茶色
  answer: D
  explanation: マニュアルには次のように明記されています。「歴史的、文化的、およびレクリエーション標識：これらの茶色の標識は、史跡や文化的な場所を指し示します。また、景勝地、ピクニック場、公園も指し示します。」
- id: 253
  category: signs_and_signals
  question: マニュアルによると、黄色の円形信号が点灯している交差点に近づく際、どのようにすべきですか？
  choices:
    A: 赤信号になる前に交差点を通過するために加速する。
    B: 交差点に入る前に停止する。安全に停止できない場合は、注意して通過する。
    C: 完全に停止し、信号が青になるのを待つ。
    D: 減速して右折の準備をする。
  answer: B
  explanation: マニュアルには次のように記載されています。「黄色の点灯信号は、信号がまもなく赤に変わることを警告しています。交差点に入る前に停止してください。安全に停止できない場合は、注意して通過してください。」
- id: 254
  category: signs_and_signals
  question: 赤色の矢印信号が点灯している場合、どのような右左折が許可されますか？
  choices:
    A: 矢印が青（緑）に変わるまで、いかなる右左折も許可されない。
    B: 停止した後、矢印の方向にのみ曲がることができる。
    C: 完全に停止した後、赤色の円形信号の点灯時に許可されるのと同じ右左折が可能。
    D: 右折はできるが、左折はできない。
  answer: C
  explanation: マニュアルでは赤色の矢印について次のように説明されています。「標識で禁止されていない限り、一時停止した後、赤色の点灯信号で許可されているのと同じ右左折が赤色の矢印でも許可されます。」
- id: 255
  category: sharing_the_road
  question: 公共交通機関専用レーンに「右折許可（Right Turns Permitted）」の標識がある場合、右折するためにそのレーンをどのように使用すべきですか？
  choices:
    A: 右折の準備のためにレーンの全長を使用できる。
    B: 右折する前に、公共交通機関の車両を追い越すために加速しなければならない。
    C: 右折のために一時的にレーンを使用できるが、常に公共交通機関の車両に道を譲り、それらの車両が通過した後に後ろに合流する。
    D: バスが見える場合は、レーンに入ることができない。
  answer: C
  explanation: マニュアルには、「右折のために一時的に公共交通機関専用レーンを使用できます... 常に公共交通機関の車両や専用レーンを走行する自転車に道を譲ってください。それらが通過した後に、その後ろのレーンに合流してください」と記載されています。
- id: 256
  category: signs_and_signals
  question: 黄色の矢印の点滅信号に近づいたとき、対向車の状況について何を示していますか？
  choices:
    A: 対向車側も黄色の矢印が点滅している。
    B: 対向車側は赤信号が点灯しており、停止しなければならない。
    C: 対向車側は青（緑）信号が点灯している。
    D: 対向車は赤信号のために停止する準備をしている。
  answer: C
  explanation: マニュアルには、黄色の矢印が点滅している場合、青（緑）信号が点灯している対向車に道を譲らなければならないと記載されています。
- id: 257
  category: safe_driving_rules
  question: 青（緑）の矢印信号が点灯している場合と、青（緑）の円形信号が点灯している場合で、左折するドライバーにとっての主な違いは何ですか？
  choices:
    A: 緑の矢印は停止して隙間を待たなければならないことを意味し、緑の円形はすぐに曲がれることを意味する。
    B: 緑の矢印はその方向への優先権があることを意味し、緑の円形は対向車や歩行者に道を譲る必要がある。
    C: 両方の信号は同じ意味だが、矢印は交通量の多い場所で使用される。
    D: 緑の矢印は左折のみを許可し、緑の円形は左折、右折、直進を許可する。
  answer: B
  explanation: 青（緑）の矢印信号の点灯は、示された方向への優先権があることを意味します。青（緑）の円形信号の点灯は左折を許可しますが、まず歩行者や対向車に道を譲らなければなりません。
- id: 258
  category: safe_driving_rules
  question: 中央線が引かれていない双方向道路を走行する場合、道路上の位置に関してどのような法的責任がありますか？
  choices:
    A: 常に道路の右端にできるだけ寄って走行しなければならない。
    B: 対向車がいない場合は、道路の中央を使用してもよい。
    C: 道路の少なくとも半分を対向車に譲らなければならない。
    D: より速い速度で走行している車両に優先権がある。
  answer: C
  explanation: マニュアルには次のように記載されています。「中央線がなく、交通が双方向に流れている道路では、ドライバーは道路の少なくとも半分を対向車に譲らなければなりません。」
- id: 259
  category: safe_driving_rules
  question: 別の速度制限が掲示されていない限り、他の特定の定義（学校、商業、居住区域など）に該当しないオレゴン州の道路および高速道路の法定最高速度制限は何ですか？
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: 法定速度制限は、「他の定義に該当しないすべての道路および高速道路において、別途掲示されていない限り 55 mph」です。
- id: 260
  category: signs_and_signals
  question: オレゴン州における可変推奨速度標識（Variable Advisory Speed sign）について、正しく説明しているのは次のうちどれですか？
  choices:
    A: 白地に黒で「speed limit」と書かれており、法的強制力がある。
    B: 黄色で「advisory speed」と書かれており、現在の状況に応じた速度を推奨する。
    C: オレンジ色で「work zone」と書かれており、作業員がいる場合にのみ適用される。
    D: 青色で「minimum speed」と書かれており、法的に走行できる最低速度を示す。
  answer: B
  explanation: マニュアルには、「可変推奨速度標識は黄色で『advisory speed』と書かれています。これらの標識は走行状況に基づいた速度を推奨するものです...
    これらは速度制限ではありません...」と明記されています。
- id: 261
  category: sharing_the_road
  question: マニュアルの歩行者死亡データによると、時速約何マイルで走行中の車両にはねられた場合、歩行者の死亡リスクが50%になりますか？
  choices:
    A: 23 mph
    B: 35 mph
    C: 42 mph
    D: 58 mph
  answer: C
  explanation: マニュアルの図表によると、時速42マイルで走行中の車両にはねられた歩行者の死亡リスクは50%です。
- id: 262
  category: signs_and_signals
  question: 反対方向に進む交通を分ける以外に、黄色の実線の路面標示の主な用途は何ですか？
  choices:
    A: 車道の右端を示すため。
    B: 自転車レーンを示すため。
    C: 一方通行の道路やランプの左端を示すため。
    D: 駐車ゾーンを指定するため。
  answer: C
  explanation: マニュアルには、黄色の標示は反対方向に進む交通を分けるため、および「一方通行の道路やランプの左端を示すため...」に使用されると記載されています。
- id: 263
  category: safe_driving_rules
  question: 二重の黄色の実線を越えて運転することが法的に許可されるのは、どのような特定の状況下ですか？
  choices:
    A: 時速25マイル未満で走行している低速車両を追い越すとき。
    B: 対向車に道を譲った後、道路に出入りするために左折するとき。
    C: 前方の道路が少なくとも500フィート先まで空いているとき。
    D: 二重の黄色の実線を越えることはいかなる場合も許可されません。
  answer: B
  explanation: マニュアルには二重の黄色の実線に関する例外が記載されています。「対向車がいなくなるのを待った後、道路に出入りするために二重の黄色の実線を越えて左折することができます。」
- id: 264
  category: signs_and_signals
  question: 交差点に近づいたときに信号機が黄色の点灯に変わった場合、取るべき正しく最も安全な行動は何ですか？
  choices:
    A: 信号が赤になる前に交差点を通過するために加速する。
    B: 交差点の途中にいても、すぐに停止する。
    C: 安全に停止できる場合は、交差点に入る前に停止する。
    D: 減速して停止の準備をするが、後続車が近い場合はそのまま進む。
  answer: C
  explanation: マニュアルでは黄色の点灯信号について次のようにアドバイスしています。「交差点に入る前に停止してください。安全に停止できない場合は、注意して通過してください。」
- id: 265
  category: safe_driving_rules
  question: 駐車車両や道路上の障害物などを避けるためにセンターラインの左側を走行しなければならない場合、まず何をしなければなりませんか？
  choices:
    A: 対向車の運転手に警告するためにクラクションを鳴らす。
    B: すべての対向車に道を譲る。
    C: ハザードランプを点灯させる。
    D: 障害物を素早く避けるために速度を上げる。
  answer: B
  explanation: マニュアルには次のように記載されています。「道路上の危険物を避けるため、またはその他の理由でセンターラインの左側を走行しなければならない場合は、対向車に道を譲らなければなりません。」
- id: 266
  category: driver_responsibility
  question: オレゴン州のドライバーズ・マニュアルでは、「譲り（yielding）」という行為をどのように定義していますか？
  choices:
    A: いかなる時も完全に停止すること。
    B: 他の車両や歩行者が安全に通行できるように、減速または停止すること。
    C: 他のドライバーに先に進んでもらうために手信号を送ること。
    D: 自分に優先権があるため、速度と位置を維持すること。
  answer: B
  explanation: マニュアルでは譲りを次のように定義しています。「他の車両や歩行者が安全に通行できるように、減速または停止しなければなりません。」
- id: 267
  category: signs_and_signals
  question: 「可変速度制限（Variable Speed Limit）」の標識と「可変推奨速度（Variable Advisory Speed）」の標識の違いは何ですか？
  choices:
    A: 可変速度制限標識は黄色で速度を推奨するものであり、推奨速度標識は白黒で法的制限である。
    B: 可変速度制限標識は白黒で法的強制力のある速度制限であり、推奨速度標識は黄色で推奨事項である。
    C: 違いはありません。これらの用語は入れ替えて使用されます。
    D: 可変速度制限標識は工事区域でのみ使用され、推奨速度標識は気象条件に使用される。
  answer: B
  explanation: マニュアルではこの2つを区別しています。「可変速度制限（Variable Speed Limit）」標識は白黒で「speed limit」と書かれており、法的強制力があります。「可変推奨速度（Variable
    Advisory Speed）」標識は黄色で「advisory speed」と書かれており、推奨事項です。
- id: 268
  category: signs_and_signals
  question: 二重のセンターラインがある道路を走行中で、自分の車線側のラインが黄色の実線である場合、これは何を示していますか？
  choices:
    A: 一方通行の道路にいること。
    B: 一時停止標識に近づいていること。
    C: 追い越しが禁止されている車線にいること。
    D: 対向車が見えない場合は追い越してもよいこと。
  answer: C
  explanation: マニュアルでは、実線と破線の二重センターラインについて次のように説明しています。「自分の車線側の黄色の実線は、追い越しが許可されていないことを示します。」
- id: 269
  category: signs_and_signals
  question: 赤色の矢印信号が点灯しているときに右左折する場合のルールは何ですか？
  choices:
    A: いかなる状況下でも右左折は許可されない。
    B: 完全に停止し、交通や歩行者に道を譲った後に曲がることができる。
    C: 赤色の円形信号で許可されているものと同じ右左折が、赤色の矢印でも許可される。
    D: 明示的に許可する標識が掲示されている場合にのみ曲がることができる。
  answer: C
  explanation: マニュアルには次のように記載されています。「赤色の矢印は、赤信号での右左折が許可されている場合を除き、停止し、信号が変わるまで停止したままでいることを意味します。赤色の円形信号で許可されているものと同じ右左折が、赤色の矢印でも許可されます。」
- id: 270
  category: signs_and_signals
  question: ペイントされた中央分離帯にある黄色の斜線のストライプ上を走行する場合のルールは何ですか？
  choices:
    A: 低速車両を追い越すためにその上を走行してもよい。
    B: 交通が空いている場合は、そこを越えて左折することが許可される。
    C: これらのストライプ内を走行したり、そこを越えて左折したりすることは違法である。
    D: このエリアを左折のための一時的な待機場所として使用してもよい。
  answer: C
  explanation: マニュアルには、黄色の斜線のストライプは固定物や車両の使用が許可されていないエリアを知らせるために使用されると記載されています。具体的には、「これらのストライプ内を走行したり、そこを越えて左折したりすることは違法である」と明記されています。
- id: 271
  category: safe_driving_rules
  question: 同じ方向に進む車線の間にある2本の白い実線は何を示していますか？
  choices:
    A: 車線が終了するため、すぐに合流しなければならない。
    B: 追い越しは許可されているが、推奨されない。
    C: 車線変更は禁止されている。
    D: その車線は高占有車両（HOV）専用である。
  answer: C
  explanation: マニュアルによると、2本の白い実線は車線変更が禁止されていることを意味し、現在の車線を維持しなければなりません。多くの場合、車線変更禁止の標識が併設されています。
- id: 272
  category: signs_and_signals
  question: 路面に「BUS ONLY」と書かれた赤い実線の車線に遭遇しました。これは何を意味しますか？
  choices:
    A: 消防車専用レーンであり、常に空けておかなければならない。
    B: 公共交通機関専用（Transit Only）レーンであり、一般車で走行することはできない。
    C: 100フィート以内で右折するためにこの車線を使用できる。
    D: すべての車両のための緊急停止車線である。
  answer: B
  explanation: マニュアルには、赤い実線の車線は公共交通機関専用（Transit Only）レーンであり、一般車用ではないと記載されています。これらの車線には「BUS
    ONLY（バス専用）」、「BUS BIKE ONLY（バス・自転車専用）」、または「LRT（次世代型路面電車）」と表示されている場合があります。
- id: 273
  category: signs_and_signals
  question: 路面に描かれた白いシェブロン（V字型のマーク）の目的は何ですか？
  choices:
    A: 譲り（Yield）が必要な地点を示すため。
    B: 前方の固定物や、車両の進入が禁止されている区域を知らせるため。
    C: 交通量の多い場所で歩行者用横断歩道を示すため。
    D: 複雑な交差点で適切な車線へ誘導するため。
  answer: B
  explanation: マニュアルには、「白いシェブロン：前方の道路にある固定物や、車両の進入が禁止されているその他の区域を知らせるために使用されることがあります」と記載されています。
- id: 274
  category: defensive_driving
  question: マニュアルによると、前方の車両との車間距離が近すぎないかを確認するための正しい手順は何ですか？
  choices:
    A: ボンネット越しに前方の車両の屋根が見えることを確認する。
    B: 前方の車両との間に少なくとも車3台分の距離を保つ。
    C: クラクションを鳴らして、前方のドライバーが反応するか確認する。
    D: 前方の車両が固定物を通過してから、自分がその地点に到達するまでの秒数を数える。
  answer: D
  explanation: マニュアルには特定の方法が記載されています。「前方の車両の最後尾が、標識や柱などの横を通過するのを確認します。自分が同じ地点に到達するまでにかかる秒数を数えてください。」2秒未満の場合は、車間距離が近すぎます。
- id: 275
  category: defensive_driving
  question: 坂道で停車する際、車間距離を広げるべきなのはなぜですか？
  choices:
    A: 交通が動き出したときに勢いをつけるため。
    B: 傾斜地ではブレーキの効きが悪くなるため。
    C: 前方の車両が動き出す際に後退する可能性があるため。
    D: 緊急車両が車線の間を通過できるようにするため。
  answer: C
  explanation: マニュアルには、車間距離を広げる必要がある状況がいくつか挙げられており、その中に「坂道で停車する場合。前方の車両が動き出す際に後退する可能性があります」と含まれています。
- id: 276
  category: defensive_driving
  question: 他の車両と並んで複数車線の道路を走行しているとき、側方のスペース（サイド・スペース・クッション）を確保する最も安全な方法は何ですか？
  choices:
    A: 隣の車両と全く同じ速度を維持する。
    B: できるだけ自車線の右端に寄って運転する。
    C: 少し速度を落として下がるか、相手の車両の前に出る。
    D: 他のドライバーに減速するよう合図を送る。
  answer: C
  explanation: 側方のスペースを維持するために、マニュアルでは他の車両の真横を走行し続けるのを避けるため、「可能であれば、少し速度を落として下がるか、相手の車両の前に出る」ことを推奨しています。
- id: 277
  category: defensive_driving
  question: 駐車車両の列の横を走行するとき、車線内の位置をどのように調整すべきですか？
  choices:
    A: 必要に応じてセンターラインを越え、車線の左端に移動する。
    B: 車線の中央を維持し、速度を上げる。
    C: 車線からはみ出さない範囲で、駐車車両から離れる。
    D: 駐車車両の近くにいる人に知らせるために、継続的にクラクションを鳴らす。
  answer: C
  explanation: マニュアルでは、ドアが突然開いたり歩行者が飛び出したりするのを避けるため、「車線からはみ出さない範囲で駐車車両から離れ、自車と駐車車両の間に余分なスペースを確保する」ことを推奨しています。
- id: 278
  category: sharing_the_road
  question: フリーウェイを走行中、オンランプ（進入路）から車両が合流してくるのが見えた場合、安全な合流を助けるために何をすべきですか？
  choices:
    A: 相手が合流する前にオンランプを通過できるよう加速する。
    B: 相手側に譲る義務があるため、速度と車線位置を維持する。
    C: 隣に車両がいない場合は、左側の車線に移動する。
    D: 待つように合図するため、ハイビームを点滅させる。
  answer: C
  explanation: マニュアルには、「フリーウェイに進入してくる車両のためにスペースを空けてください。隣に誰もいない場合は、車線を移動してください」と記載されています。
- id: 279
  category: defensive_driving
  question: 減速または停止する必要があるとき、後方の安全なスペース（スペース・クッション）を維持するために、車両の装備をどのように活用できますか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）を点灯させる。
    B: ブレーキを軽く踏んで、ブレーキランプを点灯させる。
    C: クラクションを軽く数回鳴らす。
    D: ヘッドライトを点滅させる。
  answer: B
  explanation: マニュアルでは、後方のドライバーに安全な距離を保たせる方法として、「減速または停止しなければならないときに、ブレーキを軽く踏んで事前に合図を送ります。ブレーキランプが点灯することで、後方のドライバーに減速していることを知らせることができます」と提案しています。
- id: 280
  category: safe_driving_rules
  question: 右左折車線や自転車レーンなどで使用される幅の広い白い実線を越えることに関するルールは何ですか？
  choices:
    A: 厳格に禁止されている。
    B: 許可されているが、推奨されない。
    C: 緊急時のみ許可される。
    D: 制限なく許可されている。
  answer: B
  explanation: マニュアルには、「幅の広い白い実線を越えることは許可されていますが、推奨されません」と記載されています。これは、越えることが禁止されている2本の白い実線とは異なります。
- id: 281
  category: signs_and_signals
  question: 高速道路の入口ランプにある白い点線は何を示していますか？
  choices:
    A: 車線が間もなく終了するため、出口に向かわなければならないことを示す。
    B: 高速道路に進入中であり、交通の流れに合流しなければならないことを示す。
    C: ピーク時間帯のみカープール専用車線であることを示す。
    D: 減速区間の始まりを示す。
  answer: B
  explanation: マニュアルには、「高速道路の入口ランプで使用される場合、高速道路に進入中であり、交通の流れに合流しなければならないことを知らせるものです」と記載されています。
- id: 282
  category: signs_and_signals
  question: 交差点内に描かれた白い点線の目的は何ですか？
  choices:
    A: 一時的な横断歩道を示すため。
    B: 信号が赤になったときに停止すべき場所を示すため。
    C: オフピーク時間帯に駐車が許可されている場所を示すため。
    D: 交差点を通過して適切な車線に入るためのガイドとするため。
  answer: D
  explanation: マニュアルでは、白い点線の用途の一つとして次のように説明されています。「交差点内で使用される場合、交差点を通過して適切な車線に入るためのガイドとなります。」
- id: 283
  category: safe_driving_rules
  question: 両側に2本の黄色い実線が引かれたペイントによる中央分離帯を横切ることができるのは、どのような状況ですか？
  choices:
    A: 左折しようとしている車両を追い越すとき。
    B: 対向車の通過を待った後、左折するとき。
    C: 「Uターン禁止」の標識がない場所でUターンするとき。
    D: 法的にペイントによる中央分離帯を横切ることは決して許されない。
  answer: B
  explanation: マニュアルには、「対向車の通過を待った後、ペイントによる中央分離帯を横切って左折することができます。ただし、中央分離帯を右左折専用車線として使用することはできません」と記載されています。
- id: 284
  category: signs_and_signals
  question: 路肩線やフォグライン（霧線）として使用される白い実線の主な目的は何ですか？
  choices:
    A: 反対方向に進む車線を分けるため。
    B: 追い越しが禁止されていることを示すため。
    C: ドライバーが道路から外れないように支援するため。
    D: 駐車が許可されている区域を示すため。
  answer: C
  explanation: マニュアルでは、白い実線を「ドライバーが道路から外れないようにするための路肩線またはフォグラインとして使用されるもの」と定義しています。
