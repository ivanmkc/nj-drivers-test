questions:
- id: 1
  category: license_system
  question: 2025年5月現在、18歳以上の個人が米国内の民間航空機に搭乗するために必要な身分証明書は何ですか？
  choices:
    A: 標準発行のオレゴン州運転免許証
    B: 連邦政府が認める形式の身分証明書
    C: 標準発行のオレゴン州練習許可証
    D: 出生証明書
  answer: B
  explanation: マニュアルには、2025年5月以降、18歳以上の方が米国内の民間航空機に搭乗するには、連邦政府が認める形式の身分証明書が必要であると記載されています。
- id: 2
  category: license_system
  question: 2025年5月現在、米国内の民間航空機への搭乗に認められない身分証明書は次のうちどれですか？
  choices:
    A: 米国パスポート
    B: 標準発行のREAL IDではないオレゴン州運転免許証
    C: 米国軍用身分証明書
    D: 永住権カード（グリーンカード）
  answer: B
  explanation: マニュアルによると、標準発行のREAL IDではないオレゴン州運転免許証、練習許可証、または身分証明書は、2025年5月以降、飛行機への搭乗には認められなくなります。
- id: 3
  category: driver_responsibility
  question: オレゴン州運転マニュアルは、裁判所において法的先例として引用できますか？
  choices:
    A: はい。オレゴン州改正実体法（ORS）の正確な文言が含まれているためです。
    B: はい。ただし、交通裁判所に限ります。
    C: いいえ。これは法律の根拠ではなく、法的先例として依拠すべきではありません。
    D: いいえ。地方自治体の条例で承認されない限り引用できません。
  answer: C
  explanation: マニュアルには、「本マニュアルは法律の根拠ではなく、裁判所やその他の行政・法的手続きにおいて法的先例として依拠または引用されるべきではない」と明記されています。
- id: 4
  category: safe_driving_rules
  question: マニュアルによると、オレゴン州運転マニュアルに記載されていない追加の条例を定めている可能性があるのはどこですか？
  choices:
    A: 地方自治体
    B: 連邦政府
    C: 隣接する州
    D: 私有地の所有者
  answer: A
  explanation: マニュアルには、「地方自治体は、本マニュアルに含まれていない追加の条例を定めている場合があります」と記されています。
- id: 5
  category: driver_responsibility
  question: 新規ドライバーが路上でより大きなリスクにさらされると考えられているのはなぜですか？
  choices:
    A: 古い車両を運転するため
    B: 運転経験が不足しているため
    C: 視力検査を受ける必要がないため
    D: 夜間に運転することが多いため
  answer: B
  explanation: マニュアルには、「新規ドライバーは運転経験が不足しているため、より大きなリスクにさらされています」と記載されています。
- id: 6
  category: safe_driving_rules
  question: 運転を学んでいる場合、安全性を高めるための最善の方法の一つは何ですか？
  choices:
    A: 日中のみ運転する
    B: 新車を購入する
    C: 有益な指導を受け、十分な練習を積む
    D: 運転中にマニュアルを読む
  answer: C
  explanation: マニュアルによると、「運転を学んでいる場合、安全性を高めるための最善の方法の一つは、有益な指導を受け、十分な練習を積むことです」とされています。
- id: 7
  category: driver_responsibility
  question: オレゴン州運転マニュアルは、運転することを何であると強調していますか？
  choices:
    A: 憲法上の権利
    B: 特権（プリビレッジ）
    C: 雇用のための要件
    D: 連邦政府の義務
  answer: B
  explanation: マニュアルには、「運転は特権であり、道路上で全員の安全を確保するために私たち全員が役割を果たすことが重要であることを忘れないでください」と記載されています。
- id: 8
  category: alcohol_drugs_health
  question: マニュアルにおいて、全員を危険にさらすと明記されている行動はどれですか？
  choices:
    A: 大麻使用後に、正常な運転ができない状態で運転すること
    B: ラジオを聴くこと
    C: マニュアル車（MT車）を運転すること
    D: 友人と相乗りすること
  answer: A
  explanation: マニュアルは、「飲酒、大麻の使用、または精神を変化させるその他の物質の使用後に、正常な運転ができない状態で運転すること（impaired
    driving）は、全員を危険にさらす」と警告しています。
- id: 9
  category: license_system
  question: オレゴン州運転マニュアルは、どの種類の運転資格を取得するための要件を扱っていますか？
  choices:
    A: クラスA商用
    B: クラスB商用
    C: クラスC非営利
    D: 二輪車（モーターサイクル）限定
  answer: C
  explanation: マニュアルには、「本マニュアルは、クラスC非営利運転資格の取得要件のみを扱っています」と記載されています。
- id: 10
  category: driver_testing
  question: 初めて運転資格を申請する際、DMVはどの3つの項目をテストしますか？
  choices:
    A: 聴力、運転知識、および車両の整備状態
    B: 視力、運転知識、および運転技能
    C: 反射神経、視力、および縦列駐車
    D: 視力、病歴、および運転技能
  answer: B
  explanation: マニュアルには、「初めての運転資格取得のために、DMVは視力、運転知識、および運転技能のテストを行います」と記載されています。
- id: 11
  category: driver_testing
  question: DMVで試験を受ける際、身分証明書、生年月日、そして他に何を提示する必要がありますか？
  choices:
    A: 現住所の証明
    B: 車両保険の証明
    C: 社会保障カード（Social Security card）
    D: 高校の成績証明書
  answer: A
  explanation: マニュアルには、「試験を受ける際は毎回、まず試験手数料を支払い、身分証明書、生年月日、および現住所の証明を提示しなければならない」と記載されています。
- id: 12
  category: driver_testing
  question: DMVの試験手数料はどのように支払う必要がありますか？
  choices:
    A: 車両登録料と一緒に支払う
    B: 他のいかなる手数料とも別に支払う
    C: クレジットカードのみで支払う
    D: 試験に合格した後に支払う
  answer: B
  explanation: マニュアルには、「試験手数料は、他のいかなる手数料とも別に支払わなければならない」と明記されています。
- id: 13
  category: driver_testing
  question: オレゴン州DMVで視力検査を受ける際の手数料はいくらですか？
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: 手数料はかからない
  answer: D
  explanation: マニュアルによると、「視力検査を受けるための手数料はかからない」とされています。
- id: 14
  category: driver_testing
  question: 眼鏡やコンタクトレンズを着用してDMVの視力検査を受けた場合、どうなりますか？
  choices:
    A: それらを外して再検査を受けるよう求められる
    B: 運転資格に矯正レンズが必要であることが記載される
    C: 限定免許のために追加の手数料を支払わなければならない
    D: 自動的に視力検査不合格となる
  answer: B
  explanation: マニュアルには、「眼鏡やコンタクトレンズを着用して検査を受けた場合、運転資格に矯正レンズが必要であることが記載される」とあります。
- id: 15
  category: driver_testing
  question: DMVの視力検査に合格しなかった場合、次のステップは何ですか？
  choices:
    A: 再検査まで30日間待たなければならない
    B: 運転資格を永久に失う
    C: DMVから、免許を持つ視力専門医に持参するための書類が渡される
    D: 特別な運転技能試験を受けなければならない
  answer: C
  explanation: マニュアルでは、「視力検査に合格しなかった場合、DMVは免許を持つ視力専門医に持参するための書類を渡す」と説明されています。
- id: 16
  category: driver_testing
  question: クラスC知識試験（学科試験）に合格するには、何問正解する必要がありますか？
  choices:
    A: 25問
    B: 28問
    C: 30問
    D: 35問
  answer: B
  explanation: クラスC知識試験は35問の多肢選択式問題で構成されており、合格点を得るには28問に正解する必要があります。
- id: 17
  category: penalties_and_points
  question: DMVのオフィスで知識試験中に不正行為をしたと判断された場合、どのような罰則がありますか？
  choices:
    A: 不合格となり、30日間は再試験を受けることができない
    B: 不合格となり、90日間は再試験を受けることができない
    C: 罰金を支払い、直ちに再試験を受けなければならない
    D: 許可証（パーミット）が永久に失効する
  answer: B
  explanation: マニュアルには、不正行為をしたと判断された場合、試験は不合格となり、90日間は再試験を受けることが許可されないと記載されています。
- id: 18
  category: driver_testing
  question: オンラインで知識試験を受ける際、次のどのデバイスの使用が許可されていますか？
  choices:
    A: 携帯電話
    B: タブレット
    C: ウェブカメラ付きのデスクトップコンピューター
    D: タッチスクリーンデバイス
  answer: C
  explanation: オンラインで知識試験を受けるには、キーボード、マウス、およびウェブカメラを備えたデスクトップまたはノートパソコンを使用する必要があります。携帯電話やタブレットなどのタッチスクリーンデバイスは使用できません。
- id: 19
  category: driver_testing
  question: 18歳未満でオンライン知識試験を受ける場合、試験監督者（Proctor）の要件は何ですか？
  choices:
    A: 18歳以上であれば、回数制限なく試験を監督できる
    B: 21歳以上であり、24時間以内に2回までの試験しか監督できない
    C: 免許を持つドライビングインストラクターでなければならない
    D: 親または法的保護者でなければならない
  answer: B
  explanation: 18歳未満の場合、21歳以上の試験監督者（Proctor）がオンライン試験を監督しなければなりません。また、監督者は24時間以内に2回までしか試験を監督することができません。
- id: 20
  category: driver_testing
  question: DMVのオフィスで試験を受ける必要があるまでに、オンラインで知識試験を受けられる最大回数は何回ですか？
  choices:
    A: 2回
    B: 3回
    C: 4回
    D: 5回
  answer: C
  explanation: オンライン試験は合計4回まで受けることができます。4回試行した後は、DMVのオフィスで試験を受けなければなりません。
- id: 21
  category: driver_testing
  question: 過去（ ）以内にODOT（オレゴン州運輸局）承認の運転者教育コースを修了した証明書を提出した場合、DMVは実地試験を免除することがあります。
  choices:
    A: 6ヶ月
    B: 1年
    C: 2年
    D: 5年
  answer: C
  explanation: 過去2年以内にODOT承認の運転者教育コースを修了した証明書をDMVが受理した場合、DMVは実地試験を免除することがあります。
- id: 22
  category: driver_testing
  question: 実地試験中、車両への同乗が許可されているのは誰ですか？
  choices:
    A: あなたと試験官のみ
    B: あなた、試験官、および通訳者
    C: あなた、試験官、および家族
    D: あなた、試験官、および21歳以上の免許保持者
  answer: A
  explanation: 実地試験中に車両への同乗が許可されているのは、あなたと試験官のみです。通訳者、家族、友人、ペットの同乗は認められません。
- id: 23
  category: driver_testing
  question: 実地試験に不合格となった場合、再試験を受けるまでどのくらい待つ必要がありますか？
  choices:
    A: 同日の後刻まで
    B: 翌営業日まで
    C: 丸1週間
    D: 30日間
  answer: B
  explanation: 実地試験に不合格となった場合、再試験を受けるには翌営業日まで待つ必要があります。
- id: 24
  category: vehicle_information
  question: 実地試験に使用する車両の要件として、正しいものは次のうちどれですか？
  choices:
    A: バックカメラが装備されていること。
    B: 助手席のドアが、内側と外側の両方のハンドルで開閉できること。
    C: 車齢が10年未満であること。
    D: オートマチック車であること。
  answer: B
  explanation: 試験のために正常に機能していなければならない車両装備には、内側と外側のハンドルで開閉できる助手席のドアが含まれます。
- id: 25
  category: license_system
  question: 18歳未満で運転免許を申請する場合、実地試験を受ける前に少なくともどのくらいの期間、許可証（パーミット）を保持している必要がありますか？
  choices:
    A: 少なくとも3ヶ月間
    B: 少なくとも6ヶ月間
    C: 少なくとも9ヶ月間
    D: 少なくとも1年間
  answer: B
  explanation: 18歳未満で運転免許を申請する場合、少なくとも6ヶ月間は許可証を保持していなければなりません。
- id: 26
  category: signs_and_signals
  question: 公式の標識、信号、および路面標示にはいつ従わなければなりませんか？
  choices:
    A: いかなる例外もなく、常に。
    B: 日中のみ。
    C: 警察官や道路作業員が交通整理を行っている場合を除き、常に。
    D: 緊急車両を運転している場合を除き、常に。
  answer: C
  explanation: 警察官や道路作業員が交通整理を行っている場合を除き、すべての公式な標識、信号、および路面標示に従わなければなりません。
- id: 27
  category: signs_and_signals
  question: 特定の行為や動きを禁止する交通標識は何色ですか？
  choices:
    A: 黄色
    B: オレンジ色
    C: 赤色
    D: 白色
  answer: C
  explanation: 特定の行為や動きを禁止する交通標識は赤色で、交差点での交通の流れを制御することで安全性を高めています。
- id: 28
  category: signs_and_signals
  question: 一時停止標識の下に「Right Turn Permitted Without Stopping（一時停止なしで右折可）」という標識がある場合、何を示していますか？
  choices:
    A: すべての交通が停止せずに進むことができる。
    B: 右折する車両は停止せずに曲がることができるが、他の車両は一時停止して譲らなければならない。
    C: 右折する車両は停止しなければならないが、左折する車両は進むことができる。
    D: 信号が青の場合のみ右折できる。
  answer: B
  explanation: この標識は一時停止標識の下に表示されることがあります。右折する車両は停止せずに曲がることができます。その他の車両は一時停止し、優先権を譲らなければなりません。
- id: 29
  category: signs_and_signals
  question: HOV（高乗車人数車両）標識は何を示していますか？
  choices:
    A: 大型商用トラック専用の車線である。
    B: 少なくとも2人以上が乗車している車両専用の車線である。
    C: 工事のため車線が閉鎖されている。
    D: 追い越し専用の車線である。
  answer: B
  explanation: HOV（高乗車人数車両）車線は、標識に記載されている通り、少なくとも2人以上が乗車している車両のために予約されています。
- id: 30
  category: signs_and_signals
  question: 車線に描かれた白いひし形のマークは何を示していますか？
  choices:
    A: 指定された追い越し車線である。
    B: 少なくとも2人以上が乗車している車両専用の車線である。
    C: 車線が終了するため、合流しなければならない。
    D: 緊急車両専用の車線である。
  answer: B
  explanation: 車線に描かれた白いひし形は、HOV（高乗車人数車両）車線であることを示しており、少なくとも2人以上が乗車している車両専用です。
- id: 31
  category: signs_and_signals
  question: 既知の潜在的な危険や道路状況の変化を警告する警戒標識は何色ですか？
  choices:
    A: 赤
    B: 緑
    C: 黄色
    D: 青
  answer: C
  explanation: 警戒標識は黄色で、前方の既知の潜在的な危険や道路状況の変化を警告します。
- id: 32
  category: signs_and_signals
  question: 「付加車線（Add Lane）」の標識はドライバーに何を示していますか？
  choices:
    A: 2つの道路が合流するが、合流（マージ）の必要はないこと。
    B: 指定された車線が間もなく終了するため、合流しなければならないこと。
    C: 表示されている側から交通が合流していること。
    D: 道路に中央追い越し車線が追加されること。
  answer: A
  explanation: 「付加車線（Add Lane）」の標識は、2つの道路が合流するものの、合流（マージ）の必要がないことを示しています。
- id: 33
  category: safe_driving_rules
  question: 指定されたセーフティ・コリドー（Safety Corridor）を走行する際、どのような行動をとるべきですか？
  choices:
    A: 時速15マイル（15 mph）まで減速する。
    B: 安全のためライトを点灯する。
    C: 左側車線に移動する。
    D: 進入する前にクラクションを鳴らす。
  answer: B
  explanation: セーフティ・コリドーは、死亡事故や重大な負傷事故が多い高速道路の区間として指定されています。マニュアルでは、安全のためにライトを点灯するようドライバーに指示しています。
- id: 34
  category: signs_and_signals
  question: 茶色の交通標識はどのような情報を提供していますか？
  choices:
    A: ガソリンスタンドや宿泊施設などのドライバー向けサービス。
    B: 出口情報や都市への道順。
    C: 歴史的、文化的、およびレクリエーション施設。
    D: 前方の道路の危険に関する警告。
  answer: C
  explanation: 歴史的、文化的、およびレクリエーション標識は茶色で、史跡や文化施設、景勝地、ピクニック場、公園などを指し示します。
- id: 35
  category: signs_and_signals
  question: 停電などで信号機が消灯している交差点に近づいた場合、どのように進むべきですか？
  choices:
    A: 道が空いていれば、停止せずに交差点を通過する。
    B: 右側の交通に道を譲ってから進む。
    C: 全ての方向に一時停止標識があるものとして停止する。
    D: 警察官が到着するまで待ってから横断する。
  answer: C
  explanation: 停電などで信号が消灯している場合は、全ての方向に一時停止標識があるものとして停止しなければなりません。
- id: 36
  category: safe_driving_rules
  question: 赤信号で左折が許可されるのはどのような条件のときですか？
  choices:
    A: 対面交通の道路から別の対面交通の道路へ曲がる場合。
    B: 一方通行の道路へ、その進行方向に進入する場合。
    C: 赤信号での左折は決して許可されない。
    D: 指定された中央右左折車線がある場合。
  answer: B
  explanation: 一方通行の道路へその進行方向に進入する場合、完全に停止した後であれば、赤信号でも左折することが許可されています。
- id: 37
  category: signs_and_signals
  question: 黄色の矢印の点滅信号は何を意味していますか？
  choices:
    A: 指定された方向に曲がるための優先権がある。
    B: 停止して青の矢印を待たなければならない。
    C: 指定された動きをすることができるが、まず歩行者と対向車に道を譲らなければならない。
    D: 信号機が故障しており、4方向一時停止として扱う必要がある。
  answer: C
  explanation: 黄色の矢印の点滅は、矢印が示す方向に進むことができますが、まず歩行者と対向車に道を譲らなければならないことを意味します。
- id: 38
  category: safe_driving_rules
  question: 次の状況のうち、道路の左側を走行することが許可されるのはどれですか？
  choices:
    A: 見通しの悪いカーブに近づいているとき。
    B: 障害物を避けるためにセンターラインの左側を走行するとき。
    C: 右折の準備をしているとき。
    D: 住宅街を走行しているとき。
  answer: B
  explanation: 障害物を避けるためにセンターラインの左側を走行する場合など、特定の状況を除き、道路の右側を走行しなければなりません。
- id: 39
  category: safe_driving_rules
  question: 標識や信号で制御されていない路地、私道、または駐車場から道路に進入したり横断したりする前に、何をしなければなりませんか？
  choices:
    A: 停止し、接近してくる車両や歩行者に道を譲る。
    B: 時速15マイル（15 mph）まで減速し、交通の流れに合流する。
    C: クラクションを鳴らして対向車に警告する。
    D: 右側から接近してくる車両にのみ道を譲る。
  answer: A
  explanation: 標識や信号で制御されていない路地、私道、または駐車場から道路に進入したり横断したりする前には、停止して接近してくる車両や歩行者に道を譲らなければなりません。
- id: 40
  category: safe_driving_rules
  question: 標識による別段の掲示がない限り、路地や狭い住宅街を走行する際の法定速度はいくらですか？
  choices:
    A: 時速10マイル（10 mph）
    B: 時速15マイル（15 mph）
    C: 時速20マイル（20 mph）
    D: 時速25マイル（25 mph）
  answer: B
  explanation: 法律により、路地や狭い住宅街を走行する際の制限速度は時速15マイル（15 mph）と定められています。
- id: 41
  category: safe_driving_rules
  question: 標識などで別途指定がない限り、公立公園や住宅街での最高速度制限は何マイル毎時（MPH）ですか？
  choices:
    A: 時速15マイル
    B: 時速20マイル
    C: 時速25マイル
    D: 時速30マイル
  answer: C
  explanation: 住宅街、公立公園、および海岸線での制限速度は時速25マイル（25 MPH）です。
- id: 42
  category: signs_and_signals
  question: 青色の標識で、ガソリン、食事、病院など、高速道路沿いのサービスや施設を知らせるものはどれですか？
  choices:
    A: ルート標識（Route signs）
    B: 案内標識（Guide signs）
    C: 警戒標識（Warning signs）
    D: 運転者サービス標識（Motorist Service signs）
  answer: D
  explanation: 運転者サービス標識は青色の標識で、ガソリン、食事、宿泊施設、病院など、高速道路沿いのサービスや施設を知らせるものです。
- id: 43
  category: safe_driving_rules
  question: 対面通行でセンターライン（中央線）がない道路を走行する場合、車両をどのように配置すべきですか？
  choices:
    A: 他の車両が近づいてくるまで、道路の完全に中央を走行する。
    B: 道路の少なくとも半分を対向車に譲る。
    C: 道路の左端を走行する。
    D: 車両が近づいてきたら、いつでも道路脇に寄せて停車する。
  answer: B
  explanation: センターラインがなく、対向車が通行する道路では、運転者は道路の少なくとも半分を対向車に譲らなければなりません。
- id: 44
  category: signs_and_signals
  question: 黄色の点滅信号に対する適切な対応は何ですか？
  choices:
    A: 進む前に完全に停止する。
    B: 交差点を素早く通過するために加速する。
    C: 徐行し、注意して進む。
    D: 交差点を全方向一時停止（4-way stop）として扱う。
  answer: C
  explanation: 黄色の点滅信号は、速度を落とし、注意して進むことを意味します。
- id: 45
  category: safe_driving_rules
  question: 標識などで別途指定がない限り、制限速度が時速20マイル（20 MPH）となるのは次のどのエリアですか？
  choices:
    A: 公立公園
    B: すべての商業地区（Business district）
    C: 海岸線
    D: 他の定義に当てはまらないすべての道路および高速道路
  answer: B
  explanation: マニュアルによると、すべての商業地区およびスクールゾーン内での制限速度は時速20マイル（20 MPH）です。
- id: 46
  category: signs_and_signals
  question: 可変推奨速度標識（Variable Advisory Speed sign）と可変速度制限標識（Variable Speed Limit sign）の主な違いは何ですか？
  choices:
    A: 推奨標識は黒と白で、制限標識は黄色である。
    B: 推奨標識は状況に基づいた速度を推奨するものであり、制限標識は状況に基づいて法的強制力のある制限速度を変更するものである。
    C: 推奨標識は夜間のみ適用され、制限標識は日中に適用される。
    D: 推奨標識は他の制限速度標識と同様に執行されるが、制限標識は基本規則法（Basic Rule Law）を通じてのみ執行される。
  answer: B
  explanation: 可変推奨速度標識は黄色で、走行条件に基づいた速度を推奨します。可変速度制限標識は白黒で、走行条件に基づいて実際の制限速度を変更するものであり、警察は他の制限速度標識と同様にこれを執行します。
- id: 47
  category: safe_driving_rules
  question: オレゴン州の基本規則法（Basic Rule Law）に関して、正しい記述はどれですか？
  choices:
    A: 天候が良く交通量が少ない場合は、制限速度を超えて走行することを許可している。
    B: 州間高速道路と商業地区にのみ適用される。
    C: 現存する状況に対して、合理的かつ慎重な速度で走行しなければならないと定めている。
    D: 天候や視界に関係なく、掲示された制限速度で走行することを要求している。
  answer: C
  explanation: 基本規則法は、現存する状況に対して合理的かつ慎重な速度で走行しなければならないと定めています。これは常にすべての道路に適用されますが、制限速度を超えて走行することを許可するものではありません。
- id: 48
  category: sharing_the_road
  question: 通常の交通の流れよりも遅く走行しており、後方に渋滞が発生した場合、どうしなければなりませんか？
  choices:
    A: 掲示された制限速度を超えても、交通の流れに合わせるために加速する。
    B: 他の車両が右側から追い越せるように、左車線に移動する。
    C: 最初の安全な場所で道路脇に寄り、後方の車両を先に行かせる。
    D: ハザードランプを点灯し、現在の車線を走行し続ける。
  answer: C
  explanation: マニュアルには次のように記載されています。「指定された速度よりも遅く走行する場合は、後方の混雑に注意してください。最初の安全な場所で道路脇に寄り、後方の車両を先に行かせてください。」
- id: 49
  category: defensive_driving
  question: 車両の速度と歩行者の死亡率に関するマニュアルのデータによると、時速42マイル（42 MPH）で走行中の車両にはねられた歩行者の死亡リスクはどのくらいですか？
  choices:
    A: 10%の死亡リスク
    B: 25%の死亡リスク
    C: 50%の死亡リスク
    D: 90%の死亡リスク
  answer: C
  explanation: マニュアルのチャートによると、時速42マイル（42 MPH）で走行中の車両にはねられた歩行者の死亡リスクは50%です。
- id: 50
  category: signs_and_signals
  question: 2本の黄色の実線（ダブル・ソリッド・イエローライン）は何を示していますか？
  choices:
    A: 双方向の交通において追い越しが許可されている。
    B: 追い越しは禁止されているが、道路に出入りするために線を越えて左折することはできる。
    C: 一方通行の道路に近づいている。
    D: 低速車両を追い越すために中央車線を使用できる。
  answer: B
  explanation: 2本の黄色の実線は、双方向の交通において追い越しが禁止されていることを示します。ただし、対向車がいなくなるのを待った後であれば、道路に出入りするためにこれらの線を越えて左折することは可能です。
- id: 51
  category: safe_driving_rules
  question: 双方向専用左折車線（two-way special left turn lane）の使用に関するルールとして、正しいものはどれですか？
  choices:
    A: 低速で走行している車両を追い越すために使用してもよい。
    B: 曲がる前に、少なくとも200フィートはその車線を走行しなければならない。
    C: 双方向左折車線内を走行することは違法であるため、曲がる直前にその車線に入るようにする。
    D: 車両が故障した場合は、この車線に駐車することができる。
  answer: C
  explanation: マニュアルには次のように記載されています。「双方向左折車線内を走行することは違法であるため、曲がる直前にその車線に入るようにしてください。」
- id: 52
  category: signs_and_signals
  question: 両側に2本の黄色い実線が引かれたペイントによる中央分離帯（painted median）に関するルールは何ですか？
  choices:
    A: 左折車線として使用してもよい。
    B: 対向車がいなくなるのを待ってから、そこを横切って左折することができる。
    C: 本線が渋滞している場合は、中央分離帯の中を走行することが許可されている。
    D: いかなる状況においても、ペイントされた中央分離帯を横切って曲がることは違法である。
  answer: B
  explanation: 2本の黄色い実線で描かれた中央分離帯は、2つの進行方向の間のエリアを示しています。対向車が途切れるのを待ってから、中央分離帯を横切って左折することはできますが、そこを左折車線として利用したり、その中を走行したりすることはできません。
- id: 53
  category: signs_and_signals
  question: 幅の広い白い実線は何を示しており、それを横切る際のルールは何ですか？
  choices:
    A: 反対方向に進む交通を分けており、横切ることは厳格に禁止されている。
    B: 歩行者用横断歩道を示しており、安全な場合にのみ横断が許可される。
    C: 交通を特定の車線に誘導するために使用され、横切ることは許可されているが推奨されない。
    D: 公共交通専用車線を示しており、横切ることは違法である。
  answer: C
  explanation: 幅の広い白い実線は、交通を特定の車線（左折専用車線など）に誘導したり、自転車レーンを区切ったりするために使用されます。幅の広い白い実線を横切ることは許可されていますが、推奨されません。
- id: 54
  category: signs_and_signals
  question: 出口ランプや交差点の手前で白い点線（dotted white line）が使用されている場合、それは運転者に何を知らせていますか？
  choices:
    A: 走行中の車線が、そのまま同じルートを継続しないこと。
    B: スクールゾーンに近づいていること。
    C: 今後1マイルは追い越しが禁止されていること。
    D: 完全に停止しなければならないこと。
  answer: A
  explanation: 出口ランプや交差点の手前で使用される白い点線は、右折専用車線や出口専用車線のように、走行中の車線がそのまま同じルートを継続しないことを知らせるものです。
- id: 55
  category: signs_and_signals
  question: 路面の「譲れライン（yield line）」はどのようにマークされていますか？
  choices:
    A: 車線を横切る1本の白い実線。
    B: 車線内に描かれた、自分の車両の方を向いた三角形の列。
    C: 車線の中央に描かれた白いシブロン（V字型）マーク。
    D: 自転車のシンボルが付いた幅の広い白線。
  answer: B
  explanation: 譲れライン（yield line）は、車線内に描かれた自分の車両の方を向いた三角形の列と定義されており、譲る（yield）必要がある地点を示しています。
- id: 56
  category: signs_and_signals
  question: 道路上の赤の縞模様の線は何を示していますか？
  choices:
    A: 緊急車両専用の車線。
    B: 追い越しが厳格に禁止されているエリア。
    C: 一般車が絶対に進入できない公共交通専用車線。
    D: 曲がるため、駐車するため、または私道に入るために、公共交通専用車線（Transit Only lane）に進入できるエリア。
  answer: D
  explanation: 赤の縞模様の線は、曲がるため、駐車するため、または私道に入るために、公共交通専用車線（Transit Only lane）に進入してもよい場所を示しています。
- id: 57
  category: defensive_driving
  question: 時速30マイル（30 mph）を超える速度で走行する場合、推奨される安全な車間距離はどれくらいですか？
  choices:
    A: 1〜2秒
    B: 2〜3秒
    C: ちょうど3秒
    D: 4秒以上
  answer: D
  explanation: マニュアルには次のように記載されています。「時速30マイルを超える速度では、判断を下し行動を起こすための時間を確保するため、安全な車間距離は4秒以上にする必要があります。」
- id: 58
  category: penalties_and_points
  question: オレゴン州の運転マニュアルでは、道路上での「違法なレース」をどのように定義していますか？
  choices:
    A: 掲示された制限速度を時速15マイル以上超えて運転すること。
    B: あらゆる加速や速度の競い合い、または速度記録の作成。
    C: 1回の操作で3台以上の車両を追い越すこと。
    D: 左車線で通常の交通の流れよりも速く運転すること。
  answer: B
  explanation: マニュアルには次のように記載されています。「いかなる道路においてもレースをすることは違法です。レースとは、あらゆる加速や速度の競い合い、または速度記録の作成を指します。」
- id: 59
  category: safe_driving_rules
  question: 通常の条件下で、時速30マイル（30 mph）以下の場合の安全な車間距離はどのように定義されていますか？
  choices:
    A: 1〜2秒
    B: 2〜4秒
    C: 4〜6秒
    D: 5〜7秒
  answer: B
  explanation: マニュアルによると、安全な車間距離は2〜4秒と定義されています。
- id: 60
  category: safe_driving_rules
  question: 時速30マイル（30 mph）を超える速度で走行している場合、車間距離はどれくらいにするべきですか？
  choices:
    A: 2秒
    B: 3秒
    C: 4秒以上
    D: 時速10マイルごとに1秒
  answer: C
  explanation: 時速30マイルを超える速度では、判断を下し行動を起こすための時間を確保するため、安全な車間距離は4秒以上にする必要があります。
- id: 61
  category: defensive_driving
  question: 前方の車両の後ろで停車するとき、どのくらいの車間距離を空けるべきですか？
  choices:
    A: 前方の車両の後輪が路面に接しているのが見える程度
    B: 少なくとも車1台分以上の長さ
    C: 車両のナンバープレートが見える程度
    D: 3フィート（約90cm）の距離
  answer: A
  explanation: 前方の車両の後ろで停車するときは、前方の車両の後輪が路面に接している部分が見えることを確認してください。
- id: 62
  category: defensive_driving
  question: 後方の車両が車間距離を詰めすぎており（あおり運転）、右車線に移動できない場合はどうすべきですか？
  choices:
    A: あおり運転をやめさせるために急ブレーキをかける
    B: ゆっくりと速度を落とす
    C: 距離を広げるために加速する
    D: ハザードランプを点滅させる
  answer: B
  explanation: 後方の車両が車間距離を詰めすぎており、車線を譲ることができない場合は、ゆっくりと速度を落としてください。これにより、後方の車両が追い越すか、あおり運転をやめるよう促すことができます。決して急ブレーキをかけてはいけません。
- id: 63
  category: vehicle_information
  question: 車両を後退（バック）させる際の適切な技術は何ですか？
  choices:
    A: バックミラーとサイドミラーだけに頼る
    B: 体と頭を右に回し、リアウィンドウから外を見る
    C: 後退する前にクラクションを3回鳴らす
    D: ドアを開け、後退しながら後ろを見る
  answer: B
  explanation: ミラーだけでは十分な視界を確保できません。できるだけ広く確認するために、体と頭を右に回し、リアウィンドウから直接後ろを見てください。
- id: 64
  category: safe_driving_rules
  question: 時速60マイル（約96km/h）で走行中、危険を認識してから車両が完全に停止するまでに進む距離はどのくらいですか？
  choices:
    A: 約50フィート（約15m）
    B: バスケットボールコートの長さ未満
    C: フットボール場の長さよりも長い
    D: 正確に100フィート（約30m）
  answer: C
  explanation: 停止には想像以上の時間がかかります。時速60マイルでは、前方の危険を認識してブレーキを踏んでから車両が停止するまでに進む距離は、フットボール場の長さよりも長くなります。
- id: 65
  category: safe_driving_rules
  question: カーブに近づく際、いつ減速すべきですか？
  choices:
    A: カーブに入る前
    B: カーブの途中で
    C: カーブを出る直前
    D: カーブの間ずっと速度を維持すべきである
  answer: A
  explanation: マニュアルには、カーブに入る前に減速し、カーブを抜ける際に徐々に加速するように記載されています。
- id: 66
  category: defensive_driving
  question: 車線変更をする前に、死角を確認するために何をしなければなりませんか？
  choices:
    A: バックミラーを確認する
    B: サイドミラーを確認する
    C: 進む方向の肩越しに目視する
    D: 方向指示器（ウィンカー）を出す
  answer: C
  explanation: 車線変更をする前に、左に移動する場合は左肩越しに、右に移動する場合は右肩越しに目視し、死角に車両がいないか確認しなければなりません。
- id: 67
  category: safe_driving_rules
  question: 片側1車線（計2車線）の道路で他の車両を追い越す際、いつ自分の車線に戻るのが安全ですか？
  choices:
    A: 自分のフロントバンパーが相手の車両より前に出たらすぐに
    B: 追い越した車両がバックミラーに見えたとき
    C: 相手の車両を通り過ぎてから100フィート（約30m）進んだ後
    D: 相手のドライバーがヘッドライトを点滅させたとき
  answer: B
  explanation: 追い越した車両がバックミラーに見えたら、合図を出して自分の車線に戻ります。
- id: 68
  category: safe_driving_rules
  question: 他の車両を追い越す際、制限速度を超えてもよいのはどのような場合ですか？
  choices:
    A: 時速5マイルまでならよい
    B: トラックを追い越す場合なら時速10マイルまでよい
    C: 片側1車線の高速道路においてのみ
    D: いかなる場合も認められない。制限速度を超えることは違法である
  answer: D
  explanation: 追い越しの際も制限速度を超えてはいけません。いかなる時も制限速度を超えることは法律違反です。
- id: 69
  category: safe_driving_rules
  question: 次の状況のうち、追い越しのた​​めにセンターラインを越えることが違法となるのはどれですか？
  choices:
    A: 前方の車両が歩行者を横断させるために横断歩道で停止しているとき
    B: 多車線の一方通行の道路にいるとき
    C: 前方の車両が右折しようとしているとき
    D: 黄色の破線がある住宅街を運転しているとき
  answer: A
  explanation: 前方の車両が歩行者を横断させるために横断歩道で停止しているときは、追い越しのた​​めにセンターラインを越えてはいけません。
- id: 70
  category: safe_driving_rules
  question: どのような条件下で、車両を右側から追い越すことが許可されますか？
  choices:
    A: 片側1車線の道路で、前方の車両が左車線をあまりにも遅く走っているとき
    B: 追い越そうとする車両が左折中であり、右側に十分な舗装されたスペースがあるとき
    C: 道路の未舗装の路肩を走行することによって
    D: 指定された自転車レーンを使用することによって
  answer: B
  explanation: 追い越そうとする車両が左折中であるか、左折の合図を出している場合、道路の舗装部分からはみ出したり自転車レーンを走行したりせずに右側に十分なスペースがあれば、右側から追い越すことができます。
- id: 71
  category: sharing_the_road
  question: 他のドライバーがあなたを追い越し始めた場合、どのように支援すべきですか？
  choices:
    A: 相手が自分の後ろに入れるよう、速度を上げる
    B: ヘッドライトを点滅させて、安全であることを知らせる
    C: 手信号を使って、前に行くよう合図を送る
    D: 右側に寄り、相手の車両が車線に戻れるよう速度を調整する
  answer: D
  explanation: 他のドライバーが追い越しを始めたら、右側に寄ってください。対向車を確認し、相手の車両ができるだけ早く右車線に戻れるよう速度を調整することで、安全な追い越しを支援することができます。
- id: 72
  category: safe_driving_rules
  question: 他のドライバーに追い越しの安全を知らせるために、手信号やライトを使用することについて法律は何と定めていますか？
  choices:
    A: 夜間は推奨されている
    B: 大型トラックを運転している場合は義務付けられている
    C: 追い越しのタイミングを知らせるために合図を点滅させることは、法律で禁止されている
    D: 田舎の2車線道路でのみ許可されている
  answer: C
  explanation: 他のドライバーに追い越しのタイミングを知らせるために、手信号やライトを使用しないでください。法律では、追い越しを促すために合図を点滅させることを禁止しています。
- id: 73
  category: defensive_driving
  question: 次のうち、車間距離を長くすべき状況はどれですか？
  choices:
    A: 乾燥した舗装状態の良い道路を走行しているとき
    B: 大型トラックなど、こちらの姿が見えないドライバーの後ろを走行しているとき
    C: 小型で軽量な車両を運転しているとき
    D: 右折の準備をしているとき
  answer: B
  explanation: こちらの姿が見えないドライバーの後ろを走る場合は、車間距離を長くする必要があります。大型車両のドライバーは、真後ろにいる車両を確認できない場合があります。
- id: 74
  category: safe_driving_rules
  question: フリーウェイ（高速道路）を通常の交通の流れより遅い速度で走行する場合、どうしなければなりませんか？
  choices:
    A: 左側の車線を走行する。
    B: 右側の車線を走行する。
    C: 非常点滅表示灯（ハザードランプ）を点灯させる。
    D: 路肩を走行する。
  answer: B
  explanation: マニュアルのフリーウェイ走行のセクションによると、「交通の流れより遅い速度で走行する場合は、右側の車線を使用しなければならない」とされています。
- id: 75
  category: defensive_driving
  question: フリーウェイで前方の交通が減速しているのを見つけた場合、後続車にどのように警告すべきですか？
  choices:
    A: 非常点滅表示灯（ハザードランプ）を点灯させる。
    B: 手信号を使用する。
    C: ブレーキペダルを数回軽く踏む。
    D: 繰り返しクラクションを鳴らす。
  answer: C
  explanation: マニュアルでは、「前方の交通が減速しているのを見つけた場合は、ブレーキペダルを数回軽く踏んで後続のドライバーに知らせる」ようアドバイスしています。
- id: 76
  category: signs_and_signals
  question: フリーウェイのオンランプメーター（流入制御信号）が消灯しており、使用されていない場合はどうすべきですか？
  choices:
    A: 4方向一時停止（4-way stop）として扱う。
    B: 停止して、信号が青になるのを待つ。
    C: 隣の車線の車両に道を譲る。
    D: 停止せずにフリーウェイへ進む。
  answer: D
  explanation: ランプメーターに関して、マニュアルには「ランプメーターは使用されていないときは消灯しています。消灯しているランプメーターでは停止しないでください」と記載されています。
- id: 77
  category: safe_driving_rules
  question: フリーウェイを出る際、掲示されている推奨速度まで減速し始めるタイミングはいつですか？
  choices:
    A: まだフリーウェイの右車線にいる間。
    B: 出口ランプに入ってから。
    C: 出口の少なくとも500フィート手前。
    D: ランプの突き当たりにある一時停止標識が見えたときのみ。
  answer: B
  explanation: マニュアルの指示は以下の通りです。「フリーウェイを降りるまで速度を維持してください。出口ランプに入ったら、掲示されている推奨速度まで減速し始めてください。」
- id: 78
  category: safe_driving_rules
  question: フリーウェイで車両トラブルが発生し路肩に移動した場合、待機する場所として最も安全なのはどこですか？
  choices:
    A: 助けを求めてフリーウェイ沿いを歩く。
    B: 他車に警告するために、車両の真後ろに立つ。
    C: 車内、または車両の近くで、交通から離れた側。
    D: 通りかかる車を止めるために、最も近い走行車線に立つ。
  answer: C
  explanation: マニュアルには「可能であれば、車内または車両の近くで、交通から離れた側に留まる方が良いでしょう。フリーウェイ沿いを歩くのは危険です」と記載されています。
- id: 79
  category: sharing_the_road
  question: トレーラーを牽引中に後続車がたまってきた場合、どうしなければなりませんか？
  choices:
    A: 交通の流れに合わせるために速度を上げる。
    B: 最初の安全な待避所（ターンアウト）に車を寄せ、後続車を先に行かせる。
    C: 非常点滅表示灯（ハザードランプ）を点灯させ、現在の速度で走行を続ける。
    D: 後続車に右側から追い越すよう手で合図を送る。
  answer: B
  explanation: マニュアルには「後続車がたまってきた場合は、最初の安全な待避所に車を寄せ、後続車を先に行かせてください」と記載されています。
- id: 80
  category: penalties_and_points
  question: 乗用車で2台以上の車両やトレーラーを牽引した際の、3回目の違反に対する最大罰則は何ですか？
  choices:
    A: 最大1,000ドルの罰金。
    B: 最大2,000ドルの罰金。
    C: 最大2,500ドルの罰金および6ヶ月の禁錮。
    D: 1年間の免許停止。
  answer: C
  explanation: マニュアルには牽引違反の罰金が記載されています。3回目の違反に対する罰則は「最大2,500ドルおよび6ヶ月の禁錮」です。
- id: 81
  category: safe_driving_rules
  question: 交通の流れの中で走行している場合、右左折や車線変更を行う前に、最低でもどのくらいの距離から合図（ウィンカー）を出す必要がありますか？
  choices:
    A: 50フィート
    B: 100フィート
    C: 200フィート
    D: 500フィート
  answer: B
  explanation: マニュアルには次のように記載されています。「交通の流れの中で走行している場合は、右左折または車線変更の少なくとも100フィート手前で合図を出してください。」
- id: 82
  category: safe_driving_rules
  question: 手信号の使用が許可されるのはどのような条件下ですか？
  choices:
    A: 夜間で視界が悪いときのみ。
    B: 幅の広い車両や長い車両を運転しているときはいつでも。
    C: 日中で、1,000フィートの距離から人や車両をはっきりと確認できるとき。
    D: 車両の方向指示器（ウィンカー）が故障しているときのみ。
  answer: C
  explanation: マニュアルには次のように記載されています。「手信号は、日中で、かつ1,000フィートの距離から人や車両をはっきりと確認できる場合にのみ使用してください。」
- id: 83
  category: sharing_the_road
  question: 右左折の準備をする際、自転車専用レーンに関するルールは何ですか？
  choices:
    A: 曲がる100フィート手前で自転車専用レーンに入らなければならない。
    B: 自転車専用レーンを横切って曲がることはできるが、曲がる準備のためにレーン内に進入してはならない。
    C: 自転車専用レーンを横切ることはいかなる場合も禁止されている。
    D: 自転車専用レーンに入る前に、クラクションを鳴らして進路を確保すべきである。
  answer: B
  explanation: マニュアルには明確に次のように記載されています。「自転車専用レーンを横切って曲がることはできますが、曲がる準備のために自転車専用レーン内に進入してはいけません。」
- id: 84
  category: defensive_driving
  question: 交差点で、曲がるための車線が間違っていることに気づいた場合、どうすべきですか？
  choices:
    A: 信号が青になる前に素早く車線変更する。
    B: 停車して交通が途切れるのを待ち、車線変更する。
    C: 次の交差点まで進んでから曲がる。
    D: そのまま曲がるが、非常点滅表示灯（ハザードランプ）を使用する。
  answer: C
  explanation: マニュアルでは次のようにアドバイスしています。「交差点で曲がる車線を間違えた場合は、次の交差点まで進んでください。直前での車線変更や方向転換による衝突のリスクを冒すよりも、ブロックを一周する方が安全です。」
- id: 85
  category: safe_driving_rules
  question: 対面通行の道路から別の対面通行の道路へ左折する場合、曲がる直前に車両をどこに配置すべきですか？
  choices:
    A: 右側の縁石に最も近い車線。
    B: センターラインのすぐ右側の車線。
    C: 交差点の中央。
    D: 自転車専用レーン。
  answer: B
  explanation: マニュアルには次のように記載されています。「左折：対面通行の道路では、センターラインのすぐ右側の車線に車両を寄せて、曲がる準備をしてください。」
- id: 86
  category: safe_driving_rules
  question: 赤信号で左折することが違法となるのは、次のうちどの状況ですか？
  choices:
    A: 一方通行の道路から一方通行の道路へ曲がる場合。
    B: 対面通行の道路から一方通行の道路へ曲がる場合。
    C: 一方通行の道路から対面通行の道路へ曲がる場合。
    D: 二重左折車線から一方通行の道路へ曲がる場合。
  answer: C
  explanation: マニュアルの「左折：一方通行から対面通行の道路へ」の項目には、「赤信号でこの左折を行うことはできません」と記載されています。また、赤信号で対面通行の道路へ左折することは違法であるとも記されています。
- id: 87
  category: defensive_driving
  question: 誤ってフリーウェイ（高速道路）に逆方向に進入し始めた場合、まず最初にすべきことは何ですか？
  choices:
    A: 加速して素早くランプから出る。
    B: 直ちにランプの脇に寄せて停車する。
    C: 車両をバックさせて交差する道路に戻る。
    D: 向きを変える間、対向車に警告するためにクラクションを鳴らす。
  answer: B
  explanation: マニュアルには次のように記載されています。「フリーウェイに逆方向に進入し始めると、『進入禁止（DO NOT ENTER）』または『逆走（WRONG
    WAY）』の標識が間違いを警告します。直ちにランプの脇に寄せて停車してください。」
- id: 88
  category: safe_driving_rules
  question: 市街地において、Uターンが禁止されているのはどのような場所ですか？
  choices:
    A: 前後のどちらの方向からも、500フィート以内に自分の車両を確認できない場所
    B: 前後のどちらの方向からも、1,000フィート以内に自分の車両を確認できない場所
    C: 前後のどちらの方向からも、250フィート以内に自分の車両を確認できない場所
    D: 前後のどちらの方向からも、750フィート以内に自分の車両を確認できない場所
  answer: A
  explanation: マニュアルによると、市街地内のいかなる場所においても、前後のどちらの方向から来る交通からも500フィート以内に自分の車両を確認できない場所でのUターンは禁止されています。
- id: 89
  category: safe_driving_rules
  question: 市街地外でUターンをする際の視界の要件は何ですか？
  choices:
    A: 前後のどちらの方向からも、500フィート以内に自分の車両が確認できること
    B: 前後のどちらの方向からも、1,000フィート以内に自分の車両が確認できること
    C: 前後のどちらの方向からも、1,500フィート以内に自分の車両が確認できること
    D: 前後のどちらの方向からも、2,000フィート以内に自分の車両が確認できること
  answer: B
  explanation: マニュアルには、市街地外のいかなる場所においても、前後のどちらの方向から来る交通からも1,000フィート以内に自分の車両を確認できない場所でのUターンは禁止されていると記載されています。
- id: 90
  category: safe_driving_rules
  question: 標識や信号のない交差点では、どの車両に優先権を譲らなければなりませんか？
  choices:
    A: 左側から接近してくるすべての車両
    B: 交差点内にいる車両、または右側から接近してくるすべての車両
    C: 最も速いスピードで走行している車両
    D: 左折しようとしているすべての車両
  answer: B
  explanation: 標識や信号のない交差点に近づく際は、交差点内にいる車両、または右側から接近してくる車両に優先権を譲らなければなりません。
- id: 91
  category: safe_driving_rules
  question: 標識や信号のない「T字路」交差点で突き当たりの道路を走行している場合、どのように行動しなければなりませんか？
  choices:
    A: 交差する直進側の道路を走るドライバーに道を譲る
    B: 自分が曲がる側なので、優先権があるものとして進む
    C: 停車して、青信号になるのを待つ
    D: 進む前にクラクションを鳴らして、交差する車両に警告する
  answer: A
  explanation: 標識や信号のない「T字路」交差点で突き当たりの道路を走行しているドライバーは、交差する直進側の道路を走行しているドライバーに道を譲らなければなりません。
- id: 92
  category: safe_driving_rules
  question: ラウンドアバウト（環状交差点）内を走行中に緊急車両が接近してきた場合、どうすべきですか？
  choices:
    A: 緊急車両を通過させるため、ラウンドアバウト内ですぐに停車する
    B: そのまま進んでラウンドアバウトを出てから、右側の路肩に寄せる
    C: ラウンドアバウトの中央島（センターアイランド）に寄せる
    D: 合図を出さずに、できるだけ早く加速して脱出する
  answer: B
  explanation: ラウンドアバウト内では絶対に停車してはいけません。そのまま走行を続けてラウンドアバウトを出てください。脱出した後、右側の路肩に寄せて緊急車両を通過させます。
- id: 93
  category: safe_driving_rules
  question: 複数車線のあるラウンドアバウト（環状交差点）を走行中、禁止されている行為はどれですか？
  choices:
    A: 脱出する際に右側のウィンカーを使用すること
    B: 自分の車線位置を維持すること
    C: トラックを追い越したり、横に並んで走行したりすること
    D: 進入前にラウンドアバウト内の交通に道を譲ること
  answer: C
  explanation: ラウンドアバウト内では、いかなる車両も追い越そうとしてはいけません。特に大型トラックやトレーラーの横を走行したり、追い越したりすることは法律で禁止されています。
- id: 94
  category: sharing_the_road
  question: 信号機のある交差点で右左折する場合、歩行者がどのくらい離れてから曲がり始める必要がありますか？
  choices:
    A: 曲がろうとしている車線と、その隣の車線を通り過ぎたとき
    B: 曲がろうとしている車線から6フィート（約1.8メートル）以上離れたとき
    C: 自分の車両から10フィート（約3メートル）以上離れたとき
    D: 完全に歩道に上がったとき
  answer: B
  explanation: 信号機のある交差点で右左折する場合、曲がり始める前に、歩行者が曲がろうとしている車線から6フィート（約1.8メートル）以上離れていなければなりません。
- id: 95
  category: sharing_the_road
  question: 信号機のない交差点で右左折する場合、歩行者に関していつ曲がるのが安全ですか？
  choices:
    A: 歩行者が自分の車線から6フィート離れたとき
    B: 歩行者が曲がろうとしている車線と、その隣の車線を通り過ぎたとき
    C: 歩行者が縁石から足を踏み出した直後
    D: 歩行者が中央島（安全地帯）に到達したとき
  answer: B
  explanation: 信号機のない交差点で右左折する場合、曲がり始める前に、歩行者が曲がろうとしている車線とその隣の車線を完全に通り過ぎている必要があります。
- id: 96
  category: sharing_the_road
  question: 表示のない横断歩道（マークのない交差点の延長線上など）の最小幅はどれくらいですか？
  choices:
    A: 4フィート（約1.2メートル）
    B: 6フィート（約1.8メートル）
    C: 8フィート（約2.4メートル）
    D: 10フィート（約3メートル）
  answer: B
  explanation: 表示のない横断歩道は、歩道や路肩がない場所であっても、少なくとも6フィート（約1.8メートル）の幅があるとみなされます。
- id: 97
  category: sharing_the_road
  question: 白い杖を持った視覚障害者の歩行者が道路を横断している場合、どうしなければなりませんか？
  choices:
    A: 自分の存在を知らせるためにクラクションを鳴らす
    B: 自分の車線を6フィート通り過ぎるまで道を譲る
    C: その人が道路を完全に渡りきるまで停車したままでいる
    D: スペースがあれば、ゆっくりと避けて走行する
  answer: C
  explanation: 白い杖を持っている、または盲導犬を連れている視覚障害者の歩行者には、優先権を与えなければなりません。たとえ信号が青であっても、その人が道路を完全に渡りきるまで停車したまま待機してください。
- id: 98
  category: safe_driving_rules
  question: 4方向一時停止（4-way stop）の交差点で、2台の車が同時に停止し、どちらが先に進むべきか迷った場合、どちらが譲るべきですか？
  choices:
    A: 右側のドライバーが、左側のドライバーに譲る
    B: 右折するドライバーが、左折するドライバーに譲る
    C: 左側のドライバーが、右側のドライバーに譲る
    D: より大きな車両に優先権がある
  answer: C
  explanation: 全方向に一時停止標識がある交差点では、最初に停止したドライバーが最初に進むのが一般的なマナーです。判断に迷う場合は、自分の右側にいるドライバーに道を譲ってください。
- id: 99
  category: sharing_the_road
  question: 横断歩道で停車している車両を追い越すことが法律で禁止されているのはなぜですか？
  choices:
    A: 停車中の車両が突然バックしてくる可能性があるため
    B: そのドライバーは歩行者が道路を横断するのを待っている可能性があるため
    C: 緊急車両の進路を妨害する可能性があるため
    D: 停車中の車両が故障している可能性が高いため
  answer: B
  explanation: 横断歩道で停車している車両を追い越してはいけません。これは法律違反です。その車両のドライバーは、歩行者が横断するのを待っている可能性があるからです。
- id: 100
  category: sharing_the_road
  question: ラウンドアバウト（環状交差点）内で自転車に乗っている人に対して、どのように接すべきですか？
  choices:
    A: 左側から素早く追い越す
    B: 追い越すことを知らせるためにクラクションを鳴らす
    C: ラウンドアバウト内で自転車に乗っている人を追い越してはいけない
    D: 歩道を使うように強制する
  answer: C
  explanation: 車列に合流した自転車には、車線全体を使用することを認めてください。ラウンドアバウト内で自転車に乗っている人を追い越してはいけません。
- id: 101
  category: safe_driving_rules
  question: ある道路から別の道路へ曲がる際の一般的なルールは何ですか？
  choices:
    A: 中央車線から一番右の車線へ曲がる
    B: 走行中の方向で最も近い車線から、進みたい方向で最も近い車線へ曲がる
    C: 縁石に接触しないよう、大きく膨らんで曲がる
    D: 開始位置に関わらず、常に一番左の車線に入る
  answer: B
  explanation: 曲がる際の一般的なルールは、走行中の方向で最も近い車線から、進みたい方向で最も近い車線へ曲がることです。曲がっている最中に大きく膨らんだり、車線変更をしたりすることは避けてください。
- id: 102
  category: sharing_the_road
  question: 歩行者が安全地帯（セーフティアイランド）の反対側にいる場合、横断歩道の手前で停止する必要がありますか？
  choices:
    A: はい、横断歩道に歩行者がいる場合は常に停止しなければなりません
    B: はい、信号が青である場合を除き、停止しなければなりません
    C: いいえ、歩行者が安全地帯の反対側にいる場合は、停止する必要はありません
    D: いいえ、白い杖を持っていない限り、停止する必要はありません
  answer: C
  explanation: マニュアルには、「歩行者が安全地帯の反対側の横断歩道にいる場合は、停止する必要はありません」と記載されています。
- id: 103
  category: sharing_the_road
  question: 白い杖を使用している人や盲導犬を連れた人が、青信号で道路を横断している場合、どうしなければなりませんか？
  choices:
    A: 青信号であることを知らせるためにクラクションを鳴らす。
    B: 注意しながらその人の周りを通り過ぎる。
    C: その人が道路を完全に渡りきるまで、停止したままでいる。
    D: 表示のある横断歩道内にいる場合にのみ、道を譲る。
  answer: C
  explanation: マニュアルには、たとえ信号が青であっても、その人が道路を完全に渡りきるまで停止したままでいなければならないと記載されています。
- id: 104
  category: safe_driving_rules
  question: 指定されたスクールゾーン（学校周辺の速度制限区域）での制限速度は何マイルですか？
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: スクールゾーンとは、20 mphの制限速度が適用される区域のことで、スクールゾーンの標識によって定義されています。
- id: 105
  category: signs_and_signals
  question: スクールゾーンの速度制限標識に「School Hours（授業時間中）」と指定されている場合、授業が行われる日の何時から何時まで制限速度が適用されますか？
  choices:
    A: 午前7時から午後4時まで
    B: 午前8時から午後5時まで
    C: 午前7時から午後5時まで
    D: 午前8時から午後4時まで
  answer: C
  explanation: 「School Hours」の速度制限標識は、授業が行われる日の午前7時から午後5時までの間に適用されます。
- id: 106
  category: safe_driving_rules
  question: マニュアルによると、スクールゾーンにおいて「子供がいる（children are present）」とみなされるのは、次のうちどの状況ですか？
  choices:
    A: 子供たちが近くのフェンスで囲まれた校庭で遊んでいる。
    B: 子供たちが横断歩道で待っている。
    C: スクールバスが学校の駐車場に停まっている。
    D: 平日の午前8時から午後3時の間である。
  answer: B
  explanation: マニュアルでは、「子供がいる」状態を、子供が横断歩道で待っている、横断歩道内にいる、または横断歩道を歩いている場合、あるいは交通指導員が子供の横断を補助するために横断歩道にいる場合と定義しています。
- id: 107
  category: sharing_the_road
  question: 自転車専用レーン（バイクレーン）を横切って走行することが許可されるのはいつですか？
  choices:
    A: 右左折の準備をしているとき。
    B: 遅い車両を右側から追い越すとき。
    C: 右左折する場合、または路地、私道、私道への出入りをする場合。
    D: 自転車専用レーンを横切ることは決して許可されない。
  answer: C
  explanation: 右左折する場合、または路地、私道、私道への出入りをする場合には自転車専用レーンを横切ることができますが、右左折の準備のために自転車専用レーンに進入したり、その中を走行したりすることはできません。
- id: 108
  category: sharing_the_road
  question: 35 mphを超える速度で走行中、自分の車線を走行している自転車を追い越す際に必要なことは何ですか？
  choices:
    A: 追い越す前にクラクションを鳴らさなければならない。
    B: 自転車に乗っている人が転倒したとしても接触しないだけの十分な距離を空けられる場合にのみ、追い越すことができる。
    C: 自転車を追い越すには、完全に車線を変更しなければならない。
    D: 35 mphを超える速度で自転車を追い越すことは禁止されている。
  answer: B
  explanation: 35 mphを超える速度では、自転車に乗っている人が転倒したとしても接触を防げるだけの十分な距離を空けられる場合に限り、同じ車線を走行している自転車を追い越すことができます。
- id: 109
  category: signs_and_signals
  question: 自分の車線に緑色に塗られた「バイクボックス（自転車待機帯）」がある赤信号で停止する場合、どうしなければなりませんか？
  choices:
    A: 自転車が前に割り込むのを防ぐため、バイクボックスの中で停止する。
    B: バイクボックスの手前で停止する。
    C: 自転車に道を譲った後、赤信号で右折する。
    D: 信号のセンサーを作動させるため、バイクボックスの中に半分ほど進入して停止する。
  answer: B
  explanation: ドライバーは、信号待ちの際はバイクボックスの手前で停止しなければなりません。ボックス内で停止してはいけません。また、これらの交差点では、信号が赤のときの右折は禁止されています。
- id: 110
  category: signs_and_signals
  question: 路面に描かれた「シャロウ（sharrow）」は何を示していますか？
  choices:
    A: その車線は自転車専用である。
    B: その車線は共有車線であり、自転車が走行している可能性がある。
    C: 自転車はこの車線で自動車に道を譲らなければならない。
    D: 車線が終了するため、自転車は右側に合流しなければならない。
  answer: B
  explanation: シャロウは、その車線が共有車線であり、自転車が走行している可能性があることを示します。自転車のシンボルの上に2つの山形記号（シェブロン）が描かれています。
- id: 111
  category: defensive_driving
  question: 対向してくるモーターサイクルが方向指示器を出している場合、その前を曲がる前に特に注意が必要なのはなぜですか？
  choices:
    A: 交差点では常にモーターサイクルに優先権があるため。
    B: 一部のモーターサイクルは方向指示器が自動的に消えないため、ライダーが消し忘れている可能性があるため。
    C: モーターサイクルは他の車両よりも速く曲がるため。
    D: モーターサイクルの方向指示器は、配線が逆になっていることが多いため。
  answer: B
  explanation: 一部のモーターサイクルでは方向指示器が自動的に消えないため、ライダーが消し忘れている可能性があります。自車が曲がる前に、ライダーが実際に減速して曲がろうとしていることを必ず確認してください。
- id: 112
  category: sharing_the_road
  question: モーターサイクルやモペッド（原動機付自転車）に乗っている人と車線を共有することは合法ですか？
  choices:
    A: はい、両方の車両にとって十分な車線幅があれば合法です。
    B: はい、ただし交通が停止しているか、非常に低速で動いている場合に限ります。
    C: いいえ、モーターサイクルやモペッドと車線を共有することは法律で禁止されています。
    D: いいえ、モーターサイクルのライダーが安全であると合図を送らない限り禁止されています。
  answer: C
  explanation: マニュアルには次のように明記されています。「モーターサイクルやモペッドに乗っている人と車線を共有することは法律違反です。追い越す際は、車線全体を空ける必要があります。」
- id: 113
  category: vehicle_information
  question: 同じ速度で走行している小型車両と比較して、大型車両が停止するのに通常どれくらいの距離が必要ですか？
  choices:
    A: ほぼ同じ距離
    B: 約2倍の距離
    C: 約3倍の距離
    D: 約4倍の距離
  answer: C
  explanation: 大型車両は、同じ速度で走行している小型車両よりも停止するのに約3倍の距離を要します。
- id: 114
  category: sharing_the_road
  question: 大型車両の側面の死角を走行しているかどうかを、どのように判断できますか？
  choices:
    A: リアバンパーから50フィート以内にいる場合。
    B: 大型車両のサイドミラーに運転手の姿が見えない場合。
    C: 大型車両が55 mph以上で走行している場合。
    D: 大型車両の方向指示器が点滅しているのが見える場合。
  answer: B
  explanation: 大型車両は両側に大きな死角があります。大型車両のサイドミラーにその運転手の姿が見えない場合、相手からもあなたの姿は見えていません。
- id: 115
  category: safe_driving_rules
  question: 大型車両を追い越す際、その前方の車線に戻っても安全なのはいつですか？
  choices:
    A: 自車のリアバンパーが大型車両のフロントを通過したらすぐ。
    B: バックミラーに大型車両のフロント全体が見えたとき。
    C: 大型車両の運転手がヘッドライトを点滅させたとき。
    D: 追い越し速度を少なくとも10秒間維持した後。
  answer: B
  explanation: 大型車両を追い越す際は、車線に戻る前に、バックミラーでその車両のフロント全体が見えることを確認する必要があります。
- id: 116
  category: defensive_driving
  question: 対向車の中に先導車（パイロットビークル）を見かけた場合、どうすべきですか？
  choices:
    A: 道路脇に完全に寄せて停車する。
    B: ヘッドライトを点滅させて、運転手に気づいたことを知らせる。
    C: 速度を落とし、車線内の右端にできるだけ寄せて走行する。
    D: 中央の右左折車線に移動して、十分なスペースを空ける。
  answer: C
  explanation: 対向車の中に先導車を見かけた場合は、速度を落とし、自車線内にとどまりつつ、できるだけ右側に寄せて走行してください。
- id: 117
  category: safe_driving_rules
  question: 未舗装の中央分離帯で仕切られた分離ハイウェイにおいて、赤色のライトを点滅させて停車しているスクールバスのために停止しなければならないのはいつですか？
  choices:
    A: 道路のどちら側にいても、常に停止しなければならない。
    B: バスと同じ側の道路を走行している場合のみ停止しなければならない。
    C: 子供が中央分離帯を渡っている場合のみ停止しなければならない。
    D: 分離ハイウェイでは停止する必要はない。
  answer: B
  explanation: 未舗装の中央分離帯や障壁によって2つの道路に仕切られている分離ハイウェイでは、バスと同じ側の道路を走行している場合のみ停止する必要があります。
- id: 118
  category: sharing_the_road
  question: ペイントされた中央分離帯がある分離ハイウェイで、スクールバスが赤色のライトを点滅させて停車している場合、誰が停止しなければなりませんか？
  choices:
    A: バスと同じ側の交通のみ
    B: すべての車線の交通
    C: バスの後方の交通のみ
    D: どの交通も停止する必要はない
  answer: B
  explanation: ペイントされた中央分離帯や右左折車線は、2つの独立した道路とはみなされません。この場合、すべての車線の交通が、赤色灯を点滅させているスクールバスのために停止しなければなりません。
- id: 119
  category: sharing_the_road
  question: 公共交通バスが走行車線に戻ろうとしているとき、いつ進路を譲らなければなりませんか？
  choices:
    A: バスがハザードランプをつけているときはいつでも。
    B: 運転手が車線復帰の合図を出し、後部の「譲れ（YIELD）」の電光サインが点滅しているとき。
    C: 制限速度以下で走行している場合のみ。
    D: 公共交通バスに進路を譲る義務はない。
  answer: B
  explanation: バスの運転手が車線への復帰の合図を出し、バスの後部にある「譲れ（YIELD）」の電光サインが点滅している場合、後方から接近する車両は進路を譲らなければなりません。
- id: 120
  category: signs_and_signals
  question: 低速車両マーク（エンブレム）はどのような見た目ですか？
  choices:
    A: 黒い縁取りのある黄色の三角形
    B: 反射性のある赤色の縁取りと、蛍光オレンジ色の中央部
    C: 中央に赤い円がある白い正方形
    D: 黒い縁取りのある蛍光緑色のひし形
  answer: B
  explanation: 低速車両マークは、反射性のある赤色の縁取りと、蛍光オレンジ色の中央部で構成されています。
- id: 121
  category: vehicle_information
  question: 荷物が車両の後方からどの程度はみ出す場合、少なくとも12インチ四方の赤い旗を表示しなければなりませんか？
  choices:
    A: 2フィート以上
    B: 3フィート以上
    C: 4フィート以上
    D: 5フィート以上
  answer: C
  explanation: 荷物が車両の後方から4フィート以上はみ出す場合は、その末端に少なくとも12インチ四方の赤い旗を表示しなければなりません。
- id: 122
  category: vehicle_information
  question: 乗用車の右側フェンダーの側面から、荷物はどの程度はみ出してもよいですか？
  choices:
    A: フェンダーからはみ出してはならない
    B: 6インチまで
    C: 12インチまで
    D: 2フィートまで
  answer: B
  explanation: 乗用車の右側フェンダーの側面から、荷物は6インチを超えてはみ出してはなりません。
- id: 123
  category: sharing_the_road
  question: 葬列（葬儀の車列）のメンバーではない場合、車列の間を走行することに関してどのような規則がありますか？
  choices:
    A: ハザードランプを点灯させれば、車列に加わることができる
    B: 右折する場合に限り、車両の間を走行できる
    C: 車列に加わったり、車列の間を走行したりすることは法律で禁止されている
    D: クラクションを鳴らせば、車列を追い越すことができる
  answer: C
  explanation: 葬列のメンバーではない場合、その車列に加わったり、車列の車両間を走行したりすることは法律で禁止されています。
- id: 124
  category: safe_driving_rules
  question: 多車線道路で点滅灯をつけた停車中の車両に接近し、車線変更を行わない場合、どの程度減速しなければなりませんか？
  choices:
    A: 制限速度より少なくとも時速5マイル以上減速する
    B: 制限速度より少なくとも時速10マイル以上減速する
    C: 正確に時速20マイルまで減速する
    D: 正確に時速15マイルまで減速する
  answer: A
  explanation: 点滅灯をつけた停車中の車両に接近する際、車線変更を行わない場合は、掲示されている制限速度より少なくとも時速5マイル（5 mph）以上減速しなければなりません。
- id: 125
  category: safe_driving_rules
  question: 赤色灯やサイレンを使用している緊急車両が通過した後、その車両から最低限維持しなければならない距離はどれくらいですか？
  choices:
    A: 100フィート
    B: 200フィート
    C: 300フィート
    D: 500フィート
  answer: D
  explanation: 緊急車両が通過した後は、その車両から少なくとも500フィート以上の距離を保たなければなりません。
- id: 126
  category: safe_driving_rules
  question: 警察車両に停止を求められた際、どこで停止するのを避けるべきですか？
  choices:
    A: 道路の右側
    B: 交差点内やハイウェイの中央分離帯
    C: 指定された駐車スペース
    D: 砂利の路肩
  answer: B
  explanation: 警察に止められた際は、安全を確認した上でできるだけ道路の右側に寄せて停車してください。交差点内やハイウェイの中央分離帯で停止してはいけません。
- id: 127
  category: penalties_and_points
  question: すべての工事区域（ワークゾーン）における交通違反の罰金はどうなりますか？
  choices:
    A: 半分に減額される
    B: 通常の道路と同じである
    C: 2倍になる
    D: 3倍になる
  answer: C
  explanation: すべての工事区域（ワークゾーン）において、交通違反の罰金は2倍になります。
- id: 128
  category: safe_driving_rules
  question: 工事区域（ワークゾーン）に掲示されている一時的な制限速度はいつ適用されますか？
  choices:
    A: 作業員が見える時のみ
    B: 日中の時間帯のみ
    C: 作業員が見えない場合も含め、常に
    D: 重機が稼働している時のみ
  answer: C
  explanation: 工事区域に掲示されている一時的な制限速度は、作業員が見えない場合であっても、常に適用されます。
- id: 129
  category: safe_driving_rules
  question: 停止線がない踏切で停止を求められた場合、最も近いレールからどの程度離れて停止しなければなりませんか？
  choices:
    A: 少なくとも5フィート
    B: 少なくとも10フィート
    C: 少なくとも15フィート
    D: 少なくとも25フィート
  answer: C
  explanation: 停止が必要な場合は停止線で止まってください。停止線がない場合は、最も近いレールから少なくとも15フィート離れた場所で停止してください。
- id: 130
  category: defensive_driving
  question: 車両が踏切内で動けなくなり、列車が接近している場合、車両から脱出した後はどの方向に移動すべきですか？
  choices:
    A: 列車の進行方向と同じ向きに、線路と平行に移動する
    B: 線路から45度の角度で、列車が来る方向に向かって移動する
    C: 線路から90度の角度で、直角に離れる
    D: 線路から45度の角度で、列車から遠ざかる方向に移動する
  answer: B
  explanation: 列車が接近している場合は、衝突による破片が飛んでくるのを避けるため、線路から45度の角度で、列車が来る方向に向かって移動してください。
- id: 131
  category: safe_driving_rules
  question: 警察に車を止められ、外が暗い場合、警察官が近づいてくる前に何をすべきですか？
  choices:
    A: すべてのライトを消す
    B: ハイビームをつける
    C: 車内の照明（ルームライト）をつける
    D: 懐中電灯を持って車から出る
  answer: C
  explanation: 暗い場合は、停車後、警察官が近づいてくる前に車内の照明（ルームライト）をつけてください。
- id: 132
  category: sharing_the_road
  question: 交差点を通過し始めたときに、後ろからサイレンを鳴らした救急車が近づいてきた場合、どうすべきですか？
  choices:
    A: 交差点内ですぐに停止する
    B: 交差点を通り抜け、右側に寄せて停止する
    C: 交差点内の右側に寄せて停止する
    D: 加速して交差点を抜け、そのまま走行を続ける
  answer: B
  explanation: 緊急車両のために交差点内で停止してはいけません。交差点を通り抜け、右側に寄せてから停止する必要があります。
- id: 133
  category: safe_driving_rules
  question: 線路上で車が動かなくなり、列車が近づいてきた場合、どうすべきですか？
  choices:
    A: 線路から離れ、列車が進んでいる方向と同じ方向に走る
    B: 線路から45度の角度で、列車が来る方向に向かって走る
    C: 車内にとどまり、すぐに911に通報する
    D: 車の横に立ち、手を振って列車に知らせる
  answer: B
  explanation: 列車が近づいてきた場合は、破片が当たらないよう、線路から45度の角度で列車が来る方向に向かって移動してください。
- id: 134
  category: sharing_the_road
  question: 路面電車やライトレールが乗客の乗り降りのために停車したとき、どうすべきですか？
  choices:
    A: クラクションを鳴らし、右側から追い越す
    B: 時速10マイル（10 mph）以下の速度で注意深く追い越す
    C: 動き出すか、人々が安全に離れるまで、後ろで待機する
    D: 車線を変更し、加速して素早く追い越す
  answer: C
  explanation: 路面電車や列車が人々の乗り降りのために停車した場合は、再び動き出すか、人々が安全に離れるまで、その後ろに留まってください。
- id: 135
  category: sharing_the_road
  question: 隣の車線を同じ方向に走行している路面電車の前を曲がるのは安全ですか？
  choices:
    A: 路面電車が停車していれば、はい
    B: 方向指示器（ウィンカー）を使えば、はい
    C: いいえ、隣の車線を走行している路面電車の前を曲がってはいけません
    D: いいえ、商用車を運転している場合を除きます
  answer: C
  explanation: たとえ路面電車や列車が停車していても、隣の車線を同じ方向に走行している路面電車や列車の前を曲がってはいけません。
- id: 136
  category: safe_driving_rules
  question: 縦列駐車をする際、車両を縁石からどのくらい近づける必要がありますか？
  choices:
    A: 6インチ以内
    B: 12インチ以内
    C: 18インチ以内
    D: 24インチ以内
  answer: B
  explanation: 縁石と平行に、かつ縁石から12インチ以内に駐車してください。
- id: 137
  category: safe_driving_rules
  question: 縁石のある下り坂で駐車する場合、車輪をどちらに向けるべきですか？
  choices:
    A: 走行車線の方へ
    B: まっすぐ前へ
    C: 縁石の方へ
    D: 道路の端の方へ
  answer: C
  explanation: 縁石のある下り坂で駐車するときは、車両が坂を転がり落ちるのを防ぐため、車輪を縁石の方に向けてください。
- id: 138
  category: penalties_and_points
  question: 有効な許可証なしで障害者用駐車スペースに駐車した場合の最低罰金額はいくらですか？
  choices:
    A: $50
    B: $100
    C: $165
    D: $250
  answer: C
  explanation: 障害者用駐車許可証を持っていない場合、罰金は165ドルから始まり、最大1,000ドルに達します。
- id: 139
  category: safe_driving_rules
  question: 消火栓から何フィート以内の場所に車両を停止または駐車してはいけませんか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: A
  explanation: 消火栓から10フィート以内の場所に車両を停止または駐車することはできません。
- id: 140
  category: safe_driving_rules
  question: 交差点にある標識のある、または標識のない横断歩道から何フィート以内に駐車することは違法ですか？
  choices:
    A: 10フィート
    B: 15フィート
    C: 20フィート
    D: 50フィート
  answer: C
  explanation: 交差点にある標識のある、または標識のない横断歩道から20フィート以内の場所に車両を停止または駐車することはできません。
- id: 141
  category: safe_driving_rules
  question: 交通信号機や標識から50フィート以内に駐車してはならないのは、どのような場合ですか？
  choices:
    A: 多車線の高速道路にいる場合。
    B: 車両によって信号機や標識が視界から隠れてしまう場合。
    C: 制限速度が時速35マイルを超えている場合。
    D: 2時間以上駐車する場合。
  answer: B
  explanation: 車両によって信号機や標識が視界から隠れてしまう場合、その信号機や標識から50フィート以内に車両を停車または駐車することはできません。
- id: 142
  category: defensive_driving
  question: 緊急事態により高速道路の路肩に駐車しなければならず、かつ200フィート離れた場所から車両が確認できない場合、どうしなければなりませんか？
  choices:
    A: ハイビーム（走行用前照灯）を点灯させる。
    B: 少なくとも200フィート離れた場所に旗、フレア（発炎筒）、または標識を設置して、接近してくる車両に警告する。
    C: 車道に立ち、腕を振る。
    D: ドアを開けたままエンジンをかけっぱなしにする。
  answer: B
  explanation: 前後の方向から200フィート離れた場所で車両が確認できない場合は、接近してくる車両に警告する必要があります。これは、車両から各方向に少なくとも200フィート離れた場所に、旗、フレア、標識、信号、または誘導員を配置することで行います。
- id: 143
  category: safe_driving_rules
  question: 緊急停車中に車両を離れる（無人にする）必要がある場合、どうすべきですか？
  choices:
    A: バッテリーを充電し続けるために、エンジンをかけたままにする。
    B: レッカー車の運転手のために、イグニッションに鍵を差したままにする。
    C: エンジンを切り、鍵を抜き、ブレーキをかけ、ハザードランプを点灯させる。
    D: バッテリーを節約するために、ハザードランプを消す。
  answer: C
  explanation: 車両を離れる必要がある場合は、エンジンを切り、鍵を抜き、ブレーキをかけ、ハザードランプを点灯させてください。
- id: 144
  category: driver_responsibility
  question: オレゴン州におけるシートベルトの正しい着用ルールは、次のうちどれですか？
  choices:
    A: 窮屈な場合は、ショルダーストラップを脇の下に通してもよい。
    B: ショルダーストラップを背中の後ろに回してもよい。
    C: 快適さのために、腰ベルトの部分に少し緩みを持たせるべきである。
    D: ショルダーストラップを脇の下に通したり、背中の後ろに回したりしてはいけない。
  answer: D
  explanation: 腰ベルトや肩ベルトの部分に緩みを持たせないでください。ショルダーストラップを脇の下に通したり、背中の後ろに回したりしてはいけません。
- id: 145
  category: safe_driving_rules
  question: 駐車または停車した状態から発進する際、交通の流れに再び入るための最も安全な方法は何ですか？
  choices:
    A: ミラーを確認し、素早く発進する。
    B: 死角とミラーを確認し、他のすべての車両に道を譲る。
    C: 他のドライバーが道を譲らなければならないため、合図を出して交通の流れに入る。
    D: 発進する前にクラクションを鳴らす。
  answer: B
  explanation: 駐車または停車した状態から発進する際は、死角とミラーを確認し、他のすべての車両に道を譲ってください。
- id: 146
  category: signs_and_signals
  question: 踏切にある緊急通知システム（ENS）の標識の目的は何ですか？
  choices:
    A: ドライバーに列車の接近を警告するため。
    B: 線路上の障害物を鉄道会社に通知し、接近する列車に警告できるようにするため。
    C: 道路を通過する列車の制限速度を示すため。
    D: 踏切を安全に渡る方法の指示を提供するため。
  answer: B
  explanation: 線路近くの踏切の柱にある緊急通知システム（ENS）の標識を探してください。これは、線路上の障害物を鉄道会社に通知し、接近する列車に警告を発信できるようにするためのものです。
- id: 147
  category: safe_driving_rules
  question: 乳幼児は何歳まで後ろ向きのチャイルドシートに乗らなければなりませんか？
  choices:
    A: 1歳
    B: 2歳
    C: 3歳
    D: 4歳
  answer: B
  explanation: マニュアルによると、乳幼児は2歳になるまで後ろ向きで乗車しなければなりません。
- id: 148
  category: safe_driving_rules
  question: 子供の乗客が承認されたチャイルドシートを使用する義務がなくなるのはいつですか？
  choices:
    A: 6歳、または身長が4フィートに達したとき。
    B: 8歳、または身長が少なくとも4フィート9インチに達したとき。
    C: 体重が60ポンドに達したとき。
    D: 10歳になったとき。
  answer: B
  explanation: 子供の乗客は、8歳になるか、身長が少なくとも4フィート9インチになり、大人用のシートベルトが正しく装着できるようになるまで、承認されたチャイルドシートを使用しなければなりません。
- id: 149
  category: defensive_driving
  question: 衝突を避けるための選択肢について、正しいものは次のうちどれですか？
  choices:
    A: 通常、ハンドルを切るよりも早く車両を停止させることができる。
    B: ほとんどの場合、停止させるよりも早くハンドルを切って車両を回避させることができる。
    C: 加速することは、衝突を避けるための安全な選択肢には決してならない。
    D: 常に直ちに急ブレーキを踏むべきである。
  answer: B
  explanation: マニュアルには、ほとんどの場合、停止させるよりも早く車両を回転（回避）させることができると記載されており、素早くハンドルを切ることは衝突を避けるための有効な手段となります。
- id: 150
  category: defensive_driving
  question: 車両が舗装路から外れてしまった場合、安全に道路に戻るための正しい方法は何ですか？
  choices:
    A: 急ブレーキをかけ、ハンドルを左に鋭く切る。
    B: パニックになり、すぐに舗装路へと急ハンドルを切る。
    C: 減速し、道路に戻るのに必要な分だけ前輪を切る。
    D: 道路に戻る前に、トラクションを回復させるために加速する。
  answer: C
  explanation: 道路から外れてしまった場合、パニックになったり急ブレーキをかけたりしてはいけません。減速し、ハンドルをしっかりと握り、急ハンドルを切らずに道路に戻るのに必要な分だけ前輪を回してください。
- id: 151
  category: defensive_driving
  question: 対向車が自分の車線にはみ出してきた場合、避けるために決して対向車線に入ってはいけないのはなぜですか？
  choices:
    A: いかなる状況でもセンターラインを越えることは違法だから。
    B: 対向車のドライバーが急に元の車線に戻る可能性があるから。
    C: 道路の反対側では車両のトラクション（摩擦力）が失われるから。
    D: クラクションやライトを効果的に使用できなくなるから。
  answer: B
  explanation: マニュアルでは、対向車のドライバーが急に元の車線に戻り、正面衝突のリスクがあるため、避ける際に対向車線へ入ることは決してしないよう警告しています。
- id: 152
  category: sharing_the_road
  question: あなたが近づいたときに、馬に乗っている人が手を挙げた場合、それは何を意味しますか？
  choices:
    A: 素早く追い越すように合図している。
    B: あなたの存在を確認して手を振っている。
    C: 動物が怯えており、車両を停止させなければならない。
    D: 動物に警告するためにクラクションを鳴らすべきである。
  answer: C
  explanation: 馬に乗っている人や動物を連れている人が手を挙げた場合は、動物が怯えていることを意味し、停止することで衝突の原因にならない限り、車両を停止させなければなりません。
- id: 153
  category: safe_driving_rules
  question: 日没から日の出までの時間に加えて、他にどのような時にヘッドライトを点灯しなければなりませんか？
  choices:
    A: 高速道路を走行している時はいつでも。
    B: 1,000フィート（約300メートル）先の歩行者や車両が見えにくい状況の時。
    C: ワイパーを使用している時のみ。
    D: 視界が500フィート（約150メートル）以下に低下した時。
  answer: B
  explanation: ヘッドライトは日没から日の出まで、および1,000フィート先の歩行者や車両を確認することが困難な状況では常に点灯しなければなりません。
- id: 154
  category: safe_driving_rules
  question: 他の車両の後ろを走行する場合、どのくらいの距離でハイビームをロービームに切り替えなければなりませんか？
  choices:
    A: 200フィート
    B: 300フィート
    C: 350フィート
    D: 500フィート
  answer: C
  explanation: 他の車両の後ろを350フィート（約105メートル）以内で走行する場合は、バックミラー越しに相手のドライバーの目がくらむのを防ぐため、ライトを減光（ロービームに切り替え）しなければなりません。
- id: 155
  category: defensive_driving
  question: 夜間、対向車のヘッドライトの眩しさで目がくらむのを防ぐにはどうすればよいですか？
  choices:
    A: 対向車のヘッドライトを直視する。
    B: 対向車のライトの少し右側を見て、道路の端や外側線（フォグライン）を確認する。
    C: 眩しさに対抗するためにハイビームを点灯する。
    D: 車両が通り過ぎるまで片目を閉じる。
  answer: B
  explanation: 夜間にヘッドライトの眩しさで目がくらむのを防ぐには、対向車のライトの少し右側を見て、道路の端や外側線（フォグライン）を確認するようにしてください。
- id: 156
  category: safe_driving_rules
  question: 霧、砂埃、または煙の中を走行する際は、どのヘッドライトを使用すべきですか？
  choices:
    A: ハイビーム（走行用前照灯）
    B: ロービーム（すれ違い用前照灯）
    C: パーキングライト（車幅灯）のみ
    D: ハザードランプ（非常点滅表示灯）のみ
  answer: B
  explanation: 霧、砂埃、煙、または視界の悪い場所を走行する場合は、ロービームを使用してください。ハイビームの光は反射して眩しさを引き起こし、視界をさらに悪化させるためです。
- id: 157
  category: safe_driving_rules
  question: 濡れた路面や雪道、凍結した路面を走行する際に使用してはいけない車両の機能は何ですか？
  choices:
    A: ワイパー
    B: ロービーム
    C: デフロスター（除霜装置）
    D: クルーズコントロール
  answer: D
  explanation: マニュアルには「濡れた路面状況ではクルーズコントロールを使用しないこと」と明記されており、雪道や凍結路面での運転についても同様の警告がなされています。
- id: 158
  category: vehicle_information
  question: 水たまりなどを走行してブレーキが濡れてしまった場合、どうすべきですか？
  choices:
    A: ブレーキを乾かすために、繰り返し強く踏み込む。
    B: 反応し始めるまで、ゆっくり走行しながら軽くブレーキをかける。
    C: ニュートラルに入れ、ブレーキが乾くまで惰性で走行する。
    D: 直ちに車両を停止させ、自然に乾くのを待つ。
  answer: B
  explanation: 水の中を走行してブレーキが濡れた場合は、ブレーキが正常に反応し始めるまで、ゆっくり走行しながら軽くブレーキをかける必要があります。
- id: 159
  category: defensive_driving
  question: 雪や氷に覆われた道路が最も滑りやすくなるのはいつですか？
  choices:
    A: 気温が氷点下を大幅に下回っている時。
    B: 気温が氷点下（0度）に近い時。
    C: 日の出前の早朝の時間帯。
    D: 太陽が氷を直接照らしている時。
  answer: B
  explanation: マニュアルでは、道路は氷点下を大幅に下回る時よりも、気温が氷点下（0度）に近い時の方が最も滑りやすくなる可能性があるため、注意するようアドバイスしています。
- id: 160
  category: defensive_driving
  question: 車両がスリップし始めた場合、正しいステアリング操作（ハンドル操作）はどれですか？
  choices:
    A: ハンドルを完全に真っ直ぐに保持する。
    B: スリップしている方向とは逆の方向にハンドルを切る。
    C: 車両を進めたい方向にハンドルを切る。
    D: トラクションを回復させるために、ハンドルを左右に素早く切る。
  answer: C
  explanation: 車両がスリップし始めた場合は、ブレーキを踏まずに、車両を進めたい方向にハンドルを切る必要があります。
- id: 161
  category: vehicle_information
  question: オレゴン州では、通常どの期間にスパイクタイヤの使用が許可されていますか？
  choices:
    A: 10月1日から4月30日まで
    B: 11月1日から3月31日まで
    C: 12月1日から2月28日まで
    D: 一年中許可されている。
  answer: B
  explanation: オレゴン州では、スパイクタイヤの使用は通常11月1日から3月31日までのみ許可されています。
- id: 162
  category: safe_driving_rules
  question: オレゴン州における18歳未満の運転者の携帯電話使用に関する規則は何ですか？
  choices:
    A: ハンズフリー・アクセサリを使用できる。
    B: 赤信号で停止している間のみテキスト送信ができる。
    C: 車両の運転中に携帯電話やその他のモバイル電子機器を使用することは違法である。
    D: GPSナビゲーションのためだけに携帯電話を使用できる。
  answer: C
  explanation: マニュアルによると、18歳未満の運転者が車両の運転中に携帯電話やその他のモバイル電子機器を使用することは違法です。
- id: 163
  category: safe_driving_rules
  question: 運転中に携帯電話を使用したい18歳以上の運転者は、どうしなければなりませんか？
  choices:
    A: 携帯電話を膝の上に置いておく。
    B: 指の最小限の操作のみを必要とするハンズフリー・アクセサリを使用する。
    C: 時速30マイル（30 mph）以下で走行しているときのみ携帯電話を使用する。
    D: 電話に出るために路肩に停車する。
  answer: B
  explanation: 18歳以上の運転者が携帯電話を使用するにはハンズフリー・アクセサリを使用しなければならず、また、デバイスの起動または停止には指の最小限の操作のみが必要である必要があります。
- id: 164
  category: penalties_and_points
  question: 車両からどのくらいの距離まで聞こえる音量でラジオや音響システムを再生することは違法ですか？
  choices:
    A: 25フィート
    B: 50フィート
    C: 100フィート
    D: 200フィート
  answer: B
  explanation: クラクションやサイレンを聞き取ることが重要であるため、車両から50フィート離れた場所で聞こえるほどの音量でラジオやその他の音響システムを再生することは違法です。
- id: 165
  category: defensive_driving
  question: 「ロード・レイジ（あおり運転）」を行っている攻撃的な運転者に遭遇した場合、どうすべきですか？
  choices:
    A: 相手から離れるためにスピードを上げる。
    B: 他の運転者に警告するためにクラクションを鳴らす。
    C: 邪魔にならないようにし、相手を挑発しない。
    D: 安全な場所まで相手より速く走ろうとする。
  answer: C
  explanation: 攻撃的な運転者を見かけたら、邪魔にならないようにしてください。スピードを上げたり、相手より速く走ろうとしたりして、相手を挑発してはいけません。
- id: 166
  category: safe_driving_rules
  question: 運転中に眠気を防ぐために推奨されていることは次のうちどれですか？
  choices:
    A: できるだけ早く目的地に到着するように無理をして走る。
    B: 脱水症状を防ぐために水を飲む。
    C: ラジオの音量を最大にする。
    D: 目線を真っ直ぐ前方に固定する。
  answer: B
  explanation: 脱水症状は疲労の原因となる可能性があるため、マニュアルでは眠気を防ぐために水を飲むことを推奨しています。
- id: 167
  category: alcohol_drugs_health
  question: オレゴン州の法律では、血中アルコール濃度（BAC）がいくつ以上の場合、運転に支障があるとみなされ、DUIIで逮捕される可能性がありますか？
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: 血中アルコール濃度（BAC）が0.08%以上の場合、オレゴン州の法律では運転に支障があるとみなされます。
- id: 168
  category: alcohol_drugs_health
  question: オレゴン州の「黙示の同意法（Implied Consent law）」とは何を意味しますか？
  choices:
    A: 車を止められた際、車両の捜索に同意すること。
    B: 警察官から求められた際、呼気、血液、または尿の検査を受けることに同意すること。
    C: DUIIで逮捕された場合、自動的に有罪を認めること。
    D: 交通違反切符に関連するすべての罰金の支払いに同意すること。
  answer: B
  explanation: オレゴン州の黙示の同意法とは、自動車を運転することにより、警察官から求められた際に呼気、血液、または尿の検査を受けることに同意したとみなされることを意味します。
- id: 169
  category: alcohol_drugs_health
  question: 21歳未満の場合、血中アルコール濃度がどのくらいであればアルコール検査に不合格となりますか？
  choices:
    A: 0.02%以上
    B: 0.05%以上
    C: 0.08%以上
    D: いかなる量でも
  answer: D
  explanation: 21歳未満の場合、オレゴン州のゼロ・トレランス法（不寛容法）により、血中アルコール濃度がいかなる量であっても検査不合格となります。
- id: 170
  category: alcohol_drugs_health
  question: オレゴン州の「オープン・コンテナ法（開栓容器法）」によると、開栓されたアルコールのボトルや容器は車内のどこに置くべきですか？
  choices:
    A: グローブボックスの中
    B: 運転席の下
    C: トランクの中
    D: 後部座席の足元
  answer: C
  explanation: オレゴン州のオープン・コンテナ法では、開栓されたボトルや容器はトランクの中に入れておかなければならないと定められています。
- id: 171
  category: safe_driving_rules
  question: オレゴン州法では、何歳未満の人がボンネット、フェンダー、またはピックアップトラックの荷台に乗ることを禁止していますか？
  choices:
    A: 16歳
    B: 18歳
    C: 21歳
    D: 年齢制限はありません。すべての人に対して違法です。
  answer: B
  explanation: オレゴン州法では、18歳未満の人がボンネット、フェンダー、ランニングボード、またはピックアップトラックの荷台を含む車両の外部に乗ることを禁止しています。
- id: 172
  category: defensive_driving
  question: 走行中にタイヤがバースト（破裂）した場合、最初にすべきことは何ですか？
  choices:
    A: すぐに急ブレーキをかける。
    B: ハンドルをしっかりと握る。
    C: ギアをニュートラルに入れる。
    D: ハザードランプを点灯させる。
  answer: B
  explanation: タイヤがバーストした場合は、マニュアルの指示に従い、まずハンドルをしっかりと握り、その後徐々に減速して路肩に停車してください。
- id: 173
  category: defensive_driving
  question: 走行中にブレーキが効かなくなった場合、次のうちどの行動をとるべきですか？
  choices:
    A: より高いギアにシフトアップする。
    B: すぐにエンジンを切る。
    C: ブレーキを数回踏み込み（ポンピング）、圧力を高める。
    D: パーキングブレーキをできるだけ早く引き上げる。
  answer: C
  explanation: ブレーキが故障した場合は、ブレーキを数回踏んでください。これにより、ブレーキを再び作動させるのに十分な圧力が得られる場合があります。
- id: 174
  category: defensive_driving
  question: 車のアクセルが戻らなくなった（固着した）場合、どうすべきですか？
  choices:
    A: 手のひらを使って、ギアをニュートラルに入れる。
    B: すぐにイグニッションをオフにする。
    C: アクセルペダルを素早く何度も踏む。
    D: ギアをリバース（後退）に入れる。
  answer: A
  explanation: アクセルが戻らなくなった場合は、回避ルートを探し、他のギアに誤って入らないよう手のひらを使ってギアをニュートラルに入れてください。
- id: 175
  category: vehicle_information
  question: 燃費を向上させ、燃料を節約するために推奨されるテクニックは次のうちどれですか？
  choices:
    A: 急発進や急停車を繰り返す。
    B: エンジンを温めるためにアイドリングを続ける。
    C: 一定の速度で走行し、制限速度を超えないようにする。
    D: 用事のために何度も別々に車で外出する。
  answer: C
  explanation: 燃費を向上させたり燃料を節約したりするために、マニュアルでは一定の速度で運転し、掲示されている制限速度を超えないようにすることを推奨しています。
- id: 176
  category: safe_driving_rules
  question: 運転中に携帯電話にテキストメッセージが届いた場合、どうすべきですか？
  choices:
    A: 素早くメッセージを読んで返信する。
    B: 安全な場所に停車するまでメッセージを無視する。
    C: 自分が入力している間、同乗者にメッセージを読んでもらう。
    D: 減速し、道路を注視しながらメッセージを読む。
  answer: B
  explanation: マニュアルには、運転中に携帯電話にテキストメッセージが届いた場合、安全な駐車場所に停車するまでそのメッセージを無視すべきであると記載されています。
- id: 177
  category: license_system
  question: クラスC非商用運転免許では、最大何ポンドまでの車両を運転することができますか？
  choices:
    A: 10,000ポンド
    B: 16,000ポンド
    C: 26,000ポンド
    D: 33,000ポンド
  answer: C
  explanation: クラスC非商用運転免許では、商用運転免許（CDL）や二輪車免許の要件が免除されている、26,000ポンド以下の車両を運転することができます。
- id: 178
  category: license_system
  question: オレゴン州で学習許可証（インストラクション・パーミット）を申請するために必要な最低年齢は何歳ですか？
  choices:
    A: 14歳
    B: 15歳
    C: 16歳
    D: 18歳
  answer: B
  explanation: クラスC非商用運転免許の資格を得るには、学習許可証を申請する際に少なくとも15歳である必要があります。
- id: 179
  category: license_system
  question: ODOT（オレゴン州運輸局）承認の交通安全教育コースを受講していない18歳未満の申請者は、何時間の監督下での運転経験が必要ですか？
  choices:
    A: 40時間
    B: 50時間
    C: 80時間
    D: 100時間
  answer: D
  explanation: 18歳未満の申請者は、100時間の監督下での運転経験が必要です。ただし、ODOT承認の交通安全教育コースを受講した場合は、50時間の監督下での運転経験となります。
- id: 180
  category: license_system
  question: 必要な運転経験としてカウントされるためには、監督ドライバーは21歳以上であり、かつ少なくとも何年間の有効な運転免許を保持している必要がありますか？
  choices:
    A: 1年間
    B: 2年間
    C: 3年間
    D: 5年間
  answer: C
  explanation: 運転経験として認められるのは、21歳以上で、かつ少なくとも3年間の有効な運転免許を保持している人による監督を受けた場合のみです。
- id: 181
  category: license_system
  question: オレゴン州の運転免許（driving privilege）用の写真を撮影する際、許可されていないのは次のうちどれですか？
  choices:
    A: 微笑むこと
    B: 補聴器を着用すること
    C: 眼鏡を着用すること
    D: 髪を後ろで束ねること
  answer: C
  explanation: 写真撮影の際、帽子、眼鏡、顔のペイントやその他の一時的な物質、または目の外見を変えるコンタクトレンズの着用は許可されていません。
- id: 182
  category: license_system
  question: 本人確認および生年月日を証明するために認められる書類は、次のうちどれですか？
  choices:
    A: 病院発行の出生証明書
    B: 洗礼記録
    C: 10年前に期限が切れた米国パスポート
    D: 米国政府発行の出生証明書
  answer: D
  explanation: 認められる証明書類には、米国政府発行の出生証明書が含まれます。病院発行の出生証明書や洗礼記録は認められず、パスポートは有効期限が切れてから5年以内である必要があります。
- id: 183
  category: license_system
  question: 現在の居住住所の証明として認められるのは、次のうちどれですか？
  choices:
    A: 友人からの個人的な郵便物
    B: 転送された郵便物
    C: 公共料金の接続注文書または請求書
    D: 名字の記載がない雑誌の定期購読
  answer: C
  explanation: 一般的な住所証明には、公共料金の接続注文書、請求書、住宅ローン書類、または固定資産税の明細書が含まれます。個人的な郵便物や転送された郵便物は認められません。
- id: 184
  category: license_system
  question: 免許証または許可証に「聴覚障害者（Deaf or hard of hearing）」の表記を追加するために必要な証明は何ですか？
  choices:
    A: 医師の診断書
    B: 認定専門医による聴力図
    C: 裁判官が署名した書類
    D: 証明は不要
  answer: D
  explanation: DMVに対し、免許証または許可証に聴覚障害者の表記を追加するようリクエストできます。証明は必要ありません。
- id: 185
  category: vehicle_information
  question: オレゴン州において、1回の衝突事故あたりの物損事故に対する最低限必要な保険補償額はいくらですか？
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: オレゴン州の法律では、他人の財産への損害に対し、1回の衝突につき最低20,000ドルの保険加入が義務付けられています。
- id: 186
  category: driver_responsibility
  question: 負傷者のいない衝突事故に巻き込まれた場合、車両をどうすべきですか？
  choices:
    A: 警察が到着するまで、そのままの場所に置いておく。
    B: 安全が確認でき次第、速やかに走行車線から移動させる。
    C: すぐに自宅まで運転して帰り、後で警察に電話する。
    D: 車両を放置して、最寄りの電話まで歩く。
  answer: B
  explanation: 負傷者がおらず、車両を安全に移動できる場合は、できるだけ早く走行車線から移動させなければなりません。
- id: 187
  category: driver_responsibility
  question: いずれかの車両の損害額が2,500ドルを超え、かつ以下の条件に当てはまる場合、72時間以内にDMVに衝突報告書を提出しなければなりません。
  choices:
    A: 衝突が夜間に発生した。
    B: 相手のドライバーが保険に加入していない。
    C: 損害により、いずれかの車両が現場からレッカー移動された。
    D: 制限速度が55 mphを超えていた。
  answer: C
  explanation: いずれかの車両の損害額が2,500ドルを超え、かつ衝突による損害でいずれかの車両が現場からレッカー移動された場合、72時間以内に衝突報告書を提出しなければなりません。
- id: 188
  category: driver_responsibility
  question: 無人の車両に衝突し、所有者が見つからない場合はどうすればよいですか？
  choices:
    A: 誰も怪我をしていないので、すぐに現場を立ち去る。
    B: 立ち去る前に、その車両のそばで最大1時間待つ。
    C: 自分の名前、住所、および何が起きたかの簡単な説明を書いたメモを残す。
    D: レッカー車を呼び、損傷した車両を移動させる。
  answer: C
  explanation: 無人の車両に衝突し、所有者が見つからない場合は、自分の名前と住所、および何が起きたかの簡単な説明を書いたメモを残してください。
- id: 189
  category: penalties_and_points
  question: オレゴン州で運転免許（driving privileges）を失う理由となるのは、次のうちどれですか？
  choices:
    A: 車両衝突事故の報告を怠ること。
    B: 駐車違反切符を1枚切られること。
    C: 20年以上前の古い車両を運転すること。
    D: 免許証を家に忘れること。
  answer: A
