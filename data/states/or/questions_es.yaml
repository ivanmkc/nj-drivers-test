questions:
- id: 1
  category: license_system
  question: ¿A partir de mayo de 2025, qué tipo de identificación se requiere para
    que las personas de 18 años o más aborden un vuelo comercial en los EE. UU.?
  choices:
    A: Una licencia de conducir de Oregon de emisión estándar
    B: Una forma de identificación aceptada federalmente
    C: Un permiso de instrucción de Oregon de emisión estándar
    D: Un acta de nacimiento
  answer: B
  explanation: El manual establece que a partir de mayo de 2025, si tiene 18 años
    o más, necesitará una forma de identificación aceptada federalmente para abordar
    un vuelo comercial en los EE. UU.
- id: 2
  category: license_system
  question: ¿Cuál de las siguientes NO es una forma aceptable de identificación para
    abordar un vuelo comercial en los EE. UU. a partir de mayo de 2025?
  choices:
    A: Pasaporte de los EE. UU.
    B: Licencia de conducir de Oregon de emisión estándar (no REAL ID)
    C: Identificación militar de los EE. UU.
    D: Tarjeta de Residente Permanente
  answer: B
  explanation: Según el manual, una licencia de conducir, permiso de instrucción o
    tarjeta de identificación de Oregon de emisión estándar (no REAL ID) ya no se
    aceptará para volar a partir de mayo de 2025.
- id: 3
  category: driver_responsibility
  question: ¿Puede el Manual del Conductor de Oregon ser citado como precedente legal
    en un tribunal de justicia?
  choices:
    A: Sí, porque contiene el lenguaje exacto de los Estatutos Revisados de Oregon.
    B: Sí, pero solo en el tribunal de tránsito.
    C: No, no es una fuente de ley y no debe utilizarse como precedente legal.
    D: No, a menos que una ordenanza del gobierno local lo apruebe.
  answer: C
  explanation: 'El manual establece explícitamente: ''Este manual no es una fuente
    de ley y no debe ser utilizado ni citado como precedente legal en un tribunal
    de justicia u otro procedimiento administrativo o legal''.'
- id: 4
  category: safe_driving_rules
  question: Según el manual, ¿quién podría tener ordenanzas adicionales que no están
    cubiertas en el Manual del Conductor de Oregon?
  choices:
    A: Los gobiernos locales
    B: El gobierno federal
    C: Los estados vecinos
    D: Los propietarios de propiedades privadas
  answer: A
  explanation: El manual señala que 'Los gobiernos locales pueden tener ordenanzas
    adicionales no cubiertas en este manual'.
- id: 5
  category: driver_responsibility
  question: ¿Por qué se considera que los conductores nuevos corren mucho más riesgo
    en la carretera?
  choices:
    A: Porque conducen vehículos más antiguos
    B: Debido a su falta de experiencia al volante
    C: Porque no se les exige realizar un examen de la vista
    D: Porque conducen con frecuencia de noche
  answer: B
  explanation: 'El manual establece: ''Los conductores nuevos corren mucho más riesgo
    debido a su falta de experiencia al volante''.'
- id: 6
  category: safe_driving_rules
  question: Si está aprendiendo a conducir, ¿cuál es una de las mejores maneras de
    mejorar su seguridad?
  choices:
    A: Conducir solo durante las horas del día
    B: Comprar un vehículo nuevo de paquete
    C: Recibir instrucción útil y practicar mucho
    D: Leer el manual mientras conduce
  answer: C
  explanation: Según el manual, 'Si está aprendiendo a conducir, una de las mejores
    maneras de mejorar su seguridad es recibir instrucción útil y practicar mucho'.
- id: 7
  category: driver_responsibility
  question: 'El Manual del Conductor de Oregon enfatiza que conducir es un:'
  choices:
    A: Derecho constitucional
    B: Privilegio
    C: Requisito para el empleo
    D: Mandato federal
  answer: B
  explanation: 'El manual establece: ''Es importante recordar que conducir es un privilegio,
    y todos desempeñamos un papel para garantizar que todos se mantengan seguros en
    nuestras carreteras''.'
- id: 8
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes comportamientos se menciona explícitamente en
    el manual como algo que pone a todos en riesgo?
  choices:
    A: Conducir bajo los efectos de sustancias después de consumir cannabis
    B: Escuchar la radio
    C: Conducir un vehículo de transmisión manual
    D: Compartir el vehículo con amigos
  answer: A
  explanation: El manual advierte que 'Conducir bajo los efectos de sustancias —después
    de beber alcohol, consumir cannabis o cualquier otra sustancia que altere su mente—
    pone a todos en riesgo'.
- id: 9
  category: license_system
  question: ¿El Manual del Conductor de Oregon aborda los requisitos para obtener
    qué tipo de privilegio de conducción?
  choices:
    A: Comercial Clase A
    B: Comercial Clase B
    C: No comercial Clase C
    D: Endoso de motocicleta
  answer: C
  explanation: 'El manual establece: ''Este manual solo aborda los requisitos para
    obtener un privilegio de conducción no comercial Clase C''.'
- id: 10
  category: driver_testing
  question: Al solicitar un privilegio de conducción original, ¿qué tres cosas evaluará
    el DMV?
  choices:
    A: Audición, conocimientos de conducción y mantenimiento del vehículo
    B: Visión, conocimientos de conducción y habilidades de conducción
    C: Reflejos, visión y estacionamiento en paralelo
    D: Visión, historial médico y habilidades de conducción
  answer: B
  explanation: 'El manual establece: ''Para un privilegio de conducción original,
    el DMV evaluará su visión, sus conocimientos de conducción y sus habilidades de
    conducción''.'
- id: 11
  category: driver_testing
  question: ¿Cada vez que realice un examen en el DMV, debe presentar prueba de identidad,
    fecha de nacimiento y qué más?
  choices:
    A: Dirección de residencia actual
    B: Comprobante de seguro del vehículo
    C: Tarjeta de Seguro Social
    D: Certificado de notas de la escuela secundaria
  answer: A
  explanation: El manual requiere que 'Cada vez que realice un examen, primero debe
    pagar la tarifa del examen y presentar prueba de identidad, fecha de nacimiento
    y dirección de residencia actual'.
- id: 12
  category: driver_testing
  question: ¿Cómo debe pagar la tarifa de su examen del DMV?
  choices:
    A: Combinada con la tarifa de registro de su vehículo
    B: Por separado de cualquier otra tarifa
    C: Solo con tarjeta de crédito
    D: Después de aprobar el examen
  answer: B
  explanation: 'El manual establece explícitamente: ''Debe pagar la tarifa de su examen
    por separado de cualquier otra tarifa''.'
- id: 13
  category: driver_testing
  question: ¿Cuál es el costo por realizar el examen de la vista en el DMV de Oregón?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: No tiene costo
  answer: D
  explanation: Según el manual, 'No hay ningún cargo por realizar el examen de la
    vista'.
- id: 14
  category: driver_testing
  question: ¿Qué sucede si realiza el examen de la vista del DMV usando anteojos o
    lentes de contacto?
  choices:
    A: Se le pedirá que se los quite y vuelva a realizar el examen.
    B: Su privilegio de conducir indicará que se requieren lentes correctivos.
    C: Debe pagar una tarifa adicional por una licencia restringida.
    D: Reprobará automáticamente el examen de la vista.
  answer: B
  explanation: 'El manual establece: ''Si realiza el examen mientras usa anteojos
    o lentes de contacto, su privilegio de conducir indicará que se requieren lentes
    correctivos''.'
- id: 15
  category: driver_testing
  question: ¿Cuál es el siguiente paso si no aprueba el examen de la vista del DMV?
  choices:
    A: Debe esperar 30 días para volver a realizar el examen.
    B: Perderá permanentemente sus privilegios de conducir.
    C: El DMV le entregará un formulario para que lo lleve a un especialista de la
      vista con licencia.
    D: Debe realizar un examen especializado de habilidades de conducción.
  answer: C
  explanation: 'El manual explica: ''Si no aprueba el examen de la vista, el DMV le
    entregará un formulario para que lo lleve a un especialista de la vista con licencia''.'
- id: 16
  category: driver_testing
  question: ¿Cuántas preguntas debe responder correctamente para aprobar el Examen
    de Conocimientos Clase C?
  choices:
    A: '25'
    B: '28'
    C: '30'
    D: '35'
  answer: B
  explanation: El Examen de Conocimientos Clase C tiene 35 preguntas de opción múltiple,
    y debe responder 28 preguntas correctamente para recibir una calificación aprobatoria.
- id: 17
  category: penalties_and_points
  question: ¿Cuál es la sanción si se determina que está haciendo trampa en su examen
    de conocimientos en una oficina del DMV?
  choices:
    A: Reprobará y no podrá volver a examinarse durante 30 días.
    B: Reprobará y no podrá volver a examinarse durante 90 días.
    C: Debe pagar una multa y volver a realizar el examen de inmediato.
    D: Su permiso será revocado permanentemente.
  answer: B
  explanation: El manual establece que si se determina que está haciendo trampa, reprobará
    su examen y no se le permitirá volver a examinarse durante 90 días.
- id: 18
  category: driver_testing
  question: ¿Cuál de los siguientes dispositivos está permitido al realizar el examen
    de conocimientos en línea?
  choices:
    A: Un teléfono móvil
    B: Una tableta
    C: Una computadora de escritorio con cámara web
    D: Un dispositivo con pantalla táctil
  answer: C
  explanation: Para realizar el examen de conocimientos en línea, debe utilizar una
    computadora de escritorio o portátil con teclado, ratón y cámara web. No puede
    utilizar un dispositivo con pantalla táctil como teléfonos móviles o tabletas.
- id: 19
  category: driver_testing
  question: Si es menor de 18 años y realiza el examen de conocimientos en línea,
    ¿cuáles son los requisitos para su supervisor (Proctor)?
  choices:
    A: Debe ser mayor de 18 años y puede supervisar exámenes ilimitados.
    B: Debe ser mayor de 21 años y puede supervisar solo dos exámenes en un período
      de 24 horas.
    C: Debe ser un instructor de manejo con licencia.
    D: Debe ser un padre o tutor legal.
  answer: B
  explanation: Si es menor de 18 años, un supervisor (Proctor) mayor de 21 años debe
    supervisar el examen en línea, y un supervisor solo puede supervisar dos exámenes
    en un período de 24 horas.
- id: 20
  category: driver_testing
  question: ¿Cuál es el número máximo de veces que puede intentar el examen de conocimientos
    en línea antes de que se le requiera realizarlo en una oficina del DMV?
  choices:
    A: Dos veces
    B: Tres veces
    C: Cuatro veces
    D: Cinco veces
  answer: C
  explanation: Puede realizar el examen en línea cuatro veces en total. Después de
    cuatro intentos, debe realizar el examen en una oficina del DMV.
- id: 21
  category: driver_testing
  question: 'El DMV puede eximir el examen de manejo si usted presenta un comprobante
    de haber completado un curso de educación vial aprobado por el ODOT en los últimos:'
  choices:
    A: Seis meses
    B: Un año
    C: Dos años
    D: Cinco años
  answer: C
  explanation: El DMV puede eximir el examen de manejo si recibe un comprobante de
    que completó un curso de educación vial aprobado por el ODOT en los últimos dos
    años.
- id: 22
  category: driver_testing
  question: ¿Quién tiene permitido estar en el vehículo con usted durante un examen
    de manejo?
  choices:
    A: Solo usted y el examinador
    B: Usted, el examinador y un traductor
    C: Usted, el examinador y un familiar
    D: Usted, el examinador y un conductor con licencia mayor de 21 años
  answer: A
  explanation: Solo usted y el examinador tienen permitido estar en el vehículo durante
    un examen de manejo. No se permiten traductores, familiares, amigos ni mascotas.
- id: 23
  category: driver_testing
  question: Si reprueba el examen de manejo, ¿cuánto tiempo debe esperar antes de
    volver a tomarlo?
  choices:
    A: Hasta más tarde el mismo día
    B: Hasta el siguiente día hábil
    C: Durante una semana completa
    D: Durante 30 días
  answer: B
  explanation: Si reprueba el examen de manejo, debe esperar hasta el siguiente día
    hábil antes de volver a tomar el examen.
- id: 24
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el vehículo que utilice en
    su examen de manejo?
  choices:
    A: Debe tener una cámara de reversa.
    B: La puerta del pasajero debe abrirse y cerrarse con una manija desde el interior
      y el exterior.
    C: Debe tener menos de 10 años de antigüedad.
    D: Debe tener transmisión automática.
  answer: B
  explanation: El equipo del vehículo que debe estar en buen estado de funcionamiento
    para el examen incluye una puerta del pasajero que se abra y se cierre con una
    manija desde el interior y el exterior.
- id: 25
  category: license_system
  question: Si es menor de 18 años y solicita una licencia de conducir, ¿cuánto tiempo
    debe haber tenido un permiso antes de realizar el examen de manejo?
  choices:
    A: Al menos 3 meses
    B: Al menos 6 meses
    C: Al menos 9 meses
    D: Al menos 1 año
  answer: B
  explanation: Debe haber tenido un permiso durante al menos 6 meses si es menor de
    18 años y solicita una licencia de conducir.
- id: 26
  category: signs_and_signals
  question: ¿Cuándo debe obedecer las señales, semáforos y marcas oficiales?
  choices:
    A: En todo momento, sin excepciones.
    B: Solo durante las horas del día.
    C: A menos que vea a un oficial de policía o a un trabajador vial redirigiendo
      el tráfico.
    D: A menos que esté conduciendo un vehículo de emergencia.
  answer: C
  explanation: Debe obedecer todas las señales, semáforos y marcas oficiales a menos
    que vea a un oficial de policía o a un trabajador vial redirigiendo el tráfico.
- id: 27
  category: signs_and_signals
  question: ¿De qué color son las señales de tráfico que prohíben ciertas acciones
    o movimientos?
  choices:
    A: Amarillo
    B: Naranja
    C: Rojo
    D: Blanco
  answer: C
  explanation: Las señales de tráfico que prohíben ciertas acciones o movimientos
    son de color rojo y aumentan la seguridad al controlar el flujo de tráfico a través
    de las intersecciones.
- id: 28
  category: signs_and_signals
  question: ¿Qué indica una señal de "Giro a la derecha permitido sin detenerse" (Right
    Turn Permitted Without Stopping) cuando se coloca debajo de una señal de alto?
  choices:
    A: Todo el tráfico puede avanzar sin detenerse.
    B: El tráfico que gira a la derecha puede girar sin detenerse, pero el resto del
      tráfico debe detenerse y ceder el paso.
    C: El tráfico que gira a la derecha debe detenerse, pero el tráfico que gira a
      la izquierda puede avanzar.
    D: Solo puede girar a la derecha si el semáforo está en verde.
  answer: B
  explanation: Esta señal puede aparecer debajo de una señal de alto. El tráfico que
    gira a la derecha puede girar sin detenerse. El resto del tráfico debe detenerse
    y ceder el derecho de paso.
- id: 29
  category: signs_and_signals
  question: ¿Qué indica una señal de Vehículo de Alta Ocupación (HOV)?
  choices:
    A: El carril está reservado para camiones comerciales grandes.
    B: El carril está reservado para vehículos que transportan al menos dos o más
      personas.
    C: El carril está cerrado por construcción.
    D: El carril es solo para rebasar.
  answer: B
  explanation: Los carriles para Vehículos de Alta Ocupación (HOV) están reservados
    para vehículos que transportan al menos dos o más personas, como se indica en
    la señal.
- id: 30
  category: signs_and_signals
  question: ¿Qué indica un diamante blanco pintado en un carril de tráfico?
  choices:
    A: El carril es un carril de rebase designado.
    B: El carril está reservado para vehículos que transportan al menos dos o más
      personas.
    C: El carril está terminando y los vehículos deben incorporarse.
    D: El carril es solo para vehículos de emergencia.
  answer: B
  explanation: Un diamante blanco pintado en un carril indica un carril para Vehículos
    de Alta Ocupación (HOV), el cual está reservado para vehículos que transportan
    al menos dos o más personas.
- id: 31
  category: signs_and_signals
  question: ¿De qué color son las señales de advertencia que le alertan sobre posibles
    peligros conocidos o cambios en las condiciones de la carretera?
  choices:
    A: Rojo
    B: Verde
    C: Amarillo
    D: Azul
  answer: C
  explanation: Las señales de advertencia son amarillas y le alertan sobre posibles
    peligros conocidos o un cambio en las condiciones de la carretera más adelante.
- id: 32
  category: signs_and_signals
  question: ¿Qué indica una señal de "Carril adicional" (Add Lane) a un conductor?
  choices:
    A: Dos carreteras se unen y no es necesario incorporarse al tráfico (merge).
    B: El carril indicado termina pronto y debe incorporarse.
    C: El tráfico se está incorporando desde el lado mostrado.
    D: Se está añadiendo un carril central de rebase a la carretera.
  answer: A
  explanation: Una señal de "Carril adicional" (Add Lane) indica que dos carreteras
    se unen y no es necesario incorporarse al tráfico (merge).
- id: 33
  category: safe_driving_rules
  question: ¿Qué acción debe tomar al conducir a través de un Corredor de Seguridad
    (Safety Corridor) designado?
  choices:
    A: Reducir su velocidad a 15 mph.
    B: Encender sus luces por seguridad.
    C: Moverse al carril izquierdo.
    D: Tocar la bocina antes de entrar.
  answer: B
  explanation: Los corredores de seguridad son tramos designados de autopistas con
    un mayor número de colisiones fatales y de lesiones graves. El manual instruye
    a los conductores a encender sus luces por seguridad.
- id: 34
  category: signs_and_signals
  question: ¿Qué tipo de información proporcionan las señales de tráfico de color
    marrón?
  choices:
    A: Servicios para automovilistas como gasolina y alojamiento.
    B: Información de salida y direcciones a ciudades.
    C: Lugares históricos, culturales y recreativos.
    D: Advertencias sobre próximos peligros en la carretera.
  answer: C
  explanation: Las señales históricas, culturales y recreativas son de color marrón
    e indican lugares históricos y culturales, áreas escénicas, zonas de picnic y
    parques.
- id: 35
  category: signs_and_signals
  question: ¿Cómo debe proceder si se acerca a una intersección donde el semáforo
    está apagado debido a una falla de energía?
  choices:
    A: Continuar a través de la intersección sin detenerse si el camino está despejado.
    B: Ceder el paso al tráfico a su derecha y continuar.
    C: Detenerse como si hubiera señales de alto (stop) en todas las direcciones.
    D: Esperar a que llegue un oficial de policía antes de cruzar.
  answer: C
  explanation: Si una señal aparece apagada, como durante una falla de energía, debe
    detenerse como si hubiera señales de alto (stop) en todas las direcciones.
- id: 36
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite girar a la izquierda con una señal roja
    continua?
  choices:
    A: Al girar desde una carretera de doble sentido hacia otra carretera de doble
      sentido.
    B: Al entrar en una carretera de un solo sentido en la dirección de dicha carretera.
    C: Los giros a la izquierda con una señal roja continua nunca están permitidos.
    D: Cuando hay un carril central de giro designado.
  answer: B
  explanation: Se le permite girar a la izquierda en rojo después de detenerse por
    completo al entrar en una carretera de un solo sentido en la dirección de dicha
    carretera.
- id: 37
  category: signs_and_signals
  question: ¿Qué significa una señal de tráfico con una flecha amarilla intermitente?
  choices:
    A: Usted tiene el derecho de paso para realizar el giro indicado.
    B: Debe detenerse y esperar a una flecha verde.
    C: Puede realizar el movimiento indicado, pero primero debe ceder el paso a los
      peatones y al tráfico que viene en sentido contrario.
    D: La señal de tráfico no funciona y debe tratarla como una parada de cuatro vías.
  answer: C
  explanation: Una flecha amarilla intermitente significa que puede realizar el movimiento
    indicado por la flecha, pero primero debe ceder el paso a los peatones y al tráfico
    que viene en sentido contrario.
- id: 38
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones se le permite conducir por el lado
    izquierdo de la carretera?
  choices:
    A: Al acercarse a una curva sin visibilidad.
    B: Al conducir a la izquierda del centro para rebasar una obstrucción.
    C: Al prepararse para hacer un giro a la derecha.
    D: Al conducir en un distrito residencial.
  answer: B
  explanation: Debe conducir por el lado derecho de la carretera excepto en situaciones
    específicas, como cuando conduce a la izquierda del centro para rebasar una obstrucción.
- id: 39
  category: safe_driving_rules
  question: ¿Qué debe hacer antes de entrar o cruzar una carretera desde un callejón,
    entrada privada o estacionamiento que no esté controlado por señales o semáforos?
  choices:
    A: Detenerse y ceder el paso a los vehículos y peatones que se aproximan.
    B: Reducir la velocidad a 15 mph e incorporarse al tráfico.
    C: Tocar la bocina para advertir al tráfico que se aproxima.
    D: Ceder el paso solo a los vehículos que se aproximan por la derecha.
  answer: A
  explanation: Debe detenerse antes de entrar o cruzar una carretera desde un callejón,
    entrada privada o estacionamiento que no esté controlado por señales o semáforos,
    y ceder el paso a los vehículos y peatones que se aproximan.
- id: 40
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad reglamentario al conducir en callejones
    o áreas residenciales estrechas, a menos que se indique lo contrario?
  choices:
    A: 10 millas por hora
    B: 15 millas por hora
    C: 20 millas por hora
    D: 25 millas por hora
  answer: B
  explanation: El límite de velocidad se establece por ley en 15 millas por hora al
    conducir en callejones y áreas residenciales estrechas.
- id: 41
  category: safe_driving_rules
  question: ¿A menos que se indique lo contrario, cuál es el límite de velocidad máximo
    en parques públicos y distritos residenciales?
  choices:
    A: 15 millas por hora
    B: 20 millas por hora
    C: 25 millas por hora
    D: 30 millas por hora
  answer: C
  explanation: El límite de velocidad es de 25 millas por hora en distritos residenciales,
    en parques públicos y en las orillas del mar.
- id: 42
  category: signs_and_signals
  question: ¿Qué tipo de señal es azul y le informa sobre servicios o instalaciones
    a lo largo de la carretera, como gasolina, comida o un hospital?
  choices:
    A: Señales de ruta
    B: Señales de guía
    C: Señales de advertencia
    D: Señales de servicios al automovilista
  answer: D
  explanation: Las señales de servicios al automovilista son señales azules que le
    informan sobre servicios o instalaciones a lo largo de la carretera, incluyendo
    gasolina, comida, alojamiento y hospitales.
- id: 43
  category: safe_driving_rules
  question: ¿Cómo debe posicionar su vehículo al conducir en una carretera sin línea
    central donde el tráfico se mueve en direcciones opuestas?
  choices:
    A: Conducir totalmente en el centro de la carretera hasta que se acerque otro
      vehículo.
    B: Ceder al menos la mitad de la carretera al tráfico que viene en sentido contrario.
    C: Conducir en el extremo izquierdo de la carretera.
    D: Hacerse a un lado y detenerse siempre que se acerque un vehículo.
  answer: B
  explanation: Cuando una carretera no tiene línea central y el tráfico se mueve en
    direcciones opuestas, los conductores deben ceder al menos la mitad de la carretera
    al tráfico que viene en sentido contrario.
- id: 44
  category: signs_and_signals
  question: ¿Cuál es la respuesta adecuada ante una señal de tráfico amarilla intermitente?
  choices:
    A: Detenerse por completo antes de avanzar.
    B: Acelerar para despejar la intersección rápidamente.
    C: Disminuir la velocidad y avanzar con precaución.
    D: Tratar la intersección como una parada de cuatro vías.
  answer: C
  explanation: Una señal amarilla intermitente significa disminuir la velocidad y
    avanzar con precaución.
- id: 45
  category: safe_driving_rules
  question: ¿En cuál de las siguientes áreas el límite de velocidad es de 20 millas
    por hora, a menos que se indique lo contrario?
  choices:
    A: Parques públicos
    B: Cualquier distrito comercial
    C: Orillas del mar
    D: Todos los caminos y carreteras que no cumplan con ninguna otra definición
  answer: B
  explanation: El manual establece que el límite de velocidad es de 20 millas por
    hora en cualquier distrito comercial y dentro de una zona de velocidad escolar.
- id: 46
  category: signs_and_signals
  question: ¿Cuál es la diferencia principal entre una señal de Velocidad Recomendada
    Variable y una señal de Límite de Velocidad Variable?
  choices:
    A: Las señales recomendadas son amarillas y negras, mientras que las de límite
      son blancas y negras.
    B: Las señales recomendadas sugieren una velocidad basada en las condiciones,
      mientras que las de límite cambian el límite de velocidad exigible según las
      condiciones.
    C: Las señales recomendadas solo se aplican de noche, mientras que las de límite
      se aplican durante el día.
    D: Las señales recomendadas se hacen cumplir como cualquier otro límite de velocidad,
      mientras que las de límite solo se hacen cumplir a través de la ley de la regla
      básica.
  answer: B
  explanation: Las señales de velocidad recomendada variable son amarillas y recomiendan
    una velocidad basada en las condiciones de conducción. Las señales de límite de
    velocidad variable son blancas y negras y realmente cambian el límite de velocidad
    según las condiciones de conducción, las cuales la policía hace cumplir como cualquier
    otro límite de velocidad.
- id: 47
  category: safe_driving_rules
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la Ley
    de la Regla Básica de Oregón?
  choices:
    A: Le permite conducir por encima del límite de velocidad si el clima está despejado
      y el tráfico es ligero.
    B: Solo se aplica en carreteras interestatales y en distritos comerciales.
    C: Establece que debe conducir a una velocidad que sea razonable y cautelosa para
      las condiciones existentes.
    D: Requiere que conduzca al límite de velocidad indicado independientemente del
      clima o la visibilidad.
  answer: C
  explanation: La regla básica establece que debe conducir a una velocidad que sea
    razonable y cautelosa para las condiciones existentes. Se aplica en todas las
    carreteras en todo momento y no le permite conducir por encima del límite de velocidad.
- id: 48
  category: sharing_the_road
  question: Si conduce más lento que la velocidad normal del tráfico y se acumula
    congestión detrás de usted, ¿qué debe hacer?
  choices:
    A: Acelerar para igualar el flujo del tráfico incluso si excede el límite indicado.
    B: Moverse al carril izquierdo para permitir que los vehículos lo rebasen por
      la derecha.
    C: Salirse de la carretera en la primera zona segura y dejar pasar al tráfico
      que viene detrás.
    D: Encender las luces de emergencia y continuar conduciendo en su carril actual.
  answer: C
  explanation: 'El manual establece: "Esté atento a la congestión detrás de usted
    si conduce más lento que la velocidad designada. Sálgase de la carretera en la
    primera zona segura y deje pasar al tráfico que viene detrás".'
- id: 49
  category: defensive_driving
  question: Según los datos del manual sobre la velocidad de los vehículos y las muertes
    de peatones, ¿qué riesgo de muerte tiene un peatón atropellado por un vehículo
    que viaja a 42 mph?
  choices:
    A: 10% de riesgo de muerte
    B: 25% de riesgo de muerte
    C: 50% de riesgo de muerte
    D: 90% de riesgo de muerte
  answer: C
  explanation: La tabla del manual muestra que un peatón atropellado por un vehículo
    que viaja a 42 MPH tiene un 50% de riesgo de muerte.
- id: 50
  category: signs_and_signals
  question: ¿Qué indica una línea amarilla sólida doble?
  choices:
    A: Se permite rebasar para ambas direcciones de tráfico.
    B: No se permite rebasar, pero puede girar a la izquierda a través de las líneas
      para entrar o salir de una carretera.
    C: Se está acercando a una calle de un solo sentido.
    D: Puede usar el carril central para rebasar vehículos que circulan despacio.
  answer: B
  explanation: Una línea amarilla sólida doble indica que no se permite rebasar en
    ambas direcciones de tráfico. Sin embargo, puede girar a la izquierda para entrar
    o salir de una carretera a través de líneas amarillas sólidas dobles después de
    esperar a que el tráfico que viene en sentido contrario despeje el camino.
- id: 51
  category: safe_driving_rules
  question: ¿Cuál de las siguientes es una regla para usar un carril central de giro
    a la izquierda de doble sentido?
  choices:
    A: Puede usar el carril para rebasar el tráfico que se mueve lentamente.
    B: Debe circular por el carril durante al menos 200 pies antes de girar.
    C: Es ilegal circular por un carril de giro a la izquierda de doble sentido, por
      lo que debe entrar en el carril justo antes de realizar el giro.
    D: Puede estacionarse en este carril si su vehículo está averiado.
  answer: C
  explanation: 'El manual establece: "Es ilegal circular por un carril de giro a la
    izquierda de doble sentido, por lo que debe entrar en el carril justo antes de
    realizar el giro".'
- id: 52
  category: signs_and_signals
  question: ¿Cuál es la regla con respecto a una mediana pintada con líneas amarillas
    dobles continuas en ambos lados?
  choices:
    A: Puede usarla como carril de giro.
    B: Puede realizar un giro a la izquierda cruzándola después de esperar a que el
      tráfico en sentido contrario se despeje.
    C: Se le permite circular por la mediana si los carriles principales están congestionados.
    D: Es ilegal girar cruzando una mediana pintada bajo cualquier circunstancia.
  answer: B
  explanation: Una mediana pintada con líneas amarillas dobles continuas marca el
    área entre dos direcciones de viaje. Puede realizar un giro a la izquierda cruzando
    una mediana pintada después de esperar a que el tráfico en sentido contrario se
    despeje, pero no puede usarla como carril de giro ni circular por ella.
- id: 53
  category: signs_and_signals
  question: ¿Qué indica una línea blanca continua ancha y cuál es la regla para cruzarla?
  choices:
    A: Separa el tráfico que se mueve en direcciones opuestas; cruzarla está estrictamente
      prohibido.
    B: Marca un cruce de peatones; solo se permite cruzar cuando esté despejado.
    C: Se utiliza para dirigir el tráfico hacia carriles específicos; se permite cruzarla
      pero no se recomienda.
    D: Indica un carril exclusivo para el transporte público; cruzarla es ilegal.
  answer: C
  explanation: Se utiliza una línea blanca continua ancha para dirigir el tráfico
    hacia carriles específicos (como carriles de giro) y separar los carriles para
    bicicletas. Se permite cruzar una línea blanca continua ancha, pero no se recomienda.
- id: 54
  category: signs_and_signals
  question: Cuando se utiliza una línea blanca punteada antes de una rampa de salida
    o intersección, ¿qué le informa al conductor?
  choices:
    A: El carril por el que circula no continuará en la misma ruta.
    B: Se está aproximando a una zona escolar.
    C: Está prohibido rebasar durante la próxima milla.
    D: Debe detenerse por completo.
  answer: A
  explanation: Cuando se utiliza antes de una rampa de salida o intersección, una
    línea blanca punteada le informa que el carril por el que circula no continuará
    en la misma ruta, como un carril de solo giro a la derecha o un carril de solo
    salida.
- id: 55
  category: signs_and_signals
  question: ¿Cómo se marca una línea de ceda el paso en el pavimento?
  choices:
    A: Una línea blanca continua que atraviesa el carril.
    B: Una fila de triángulos en su carril, apuntando hacia su vehículo.
    C: Velas blancas (cheurones) pintadas en el centro del carril.
    D: Una línea blanca ancha con un símbolo de bicicleta.
  answer: B
  explanation: Una línea de ceda el paso se define como una fila de triángulos en
    su carril, apuntando hacia su vehículo para indicar el punto en el que se requiere
    que usted ceda el paso.
- id: 56
  category: signs_and_signals
  question: ¿Qué indican las líneas rojas a rayas en la carretera?
  choices:
    A: Un carril exclusivo para vehículos de emergencia.
    B: Un área donde rebasar está estrictamente prohibido.
    C: Un carril exclusivo para el transporte público en el que los automóviles nunca
      pueden entrar.
    D: Áreas donde puede entrar a un carril exclusivo para el transporte público (Transit
      Only) para girar, estacionarse o entrar a una entrada particular.
  answer: D
  explanation: Las líneas rojas a rayas muestran dónde puede entrar al carril exclusivo
    para el transporte público (Transit Only) para girar, estacionarse o entrar a
    una entrada particular.
- id: 57
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento segura recomendada para velocidades
    superiores a 30 mph?
  choices:
    A: 1 a 2 segundos
    B: 2 a 3 segundos
    C: 3 segundos exactamente
    D: 4 segundos o más
  answer: D
  explanation: 'El manual establece: "Para velocidades superiores a 30 mph, una distancia
    de seguimiento segura debe ser de 4 segundos o más para permitirle tiempo para
    tomar una decisión y actuar".'
- id: 58
  category: penalties_and_points
  question: ¿Cómo define el manual del conductor de Oregon las carreras ilegales en
    una carretera?
  choices:
    A: Conducir a más de 15 mph sobre el límite de velocidad establecido.
    B: Cualquier concurso de aceleración o velocidad, o el establecimiento de un récord
      de velocidad.
    C: Rebasar más de tres vehículos en una sola maniobra.
    D: Conducir más rápido que la velocidad normal del tráfico en el carril izquierdo.
  answer: B
  explanation: 'El manual establece: "Es ilegal participar en carreras en cualquier
    carretera. Una carrera puede ser cualquier concurso de aceleración o velocidad
    o el establecimiento de un récord de velocidad".'
- id: 59
  category: safe_driving_rules
  question: ¿Qué se define como una distancia de seguimiento segura en condiciones
    normales para velocidades de 30 mph o menos?
  choices:
    A: 1-2 segundos
    B: 2-4 segundos
    C: 4-6 segundos
    D: 5-7 segundos
  answer: B
  explanation: Según el manual, una distancia de seguimiento segura se define como
    de 2 a 4 segundos.
- id: 60
  category: safe_driving_rules
  question: Si viaja a una velocidad superior a 30 mph, ¿cuál debería ser su distancia
    de seguimiento?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos o más
    D: 1 segundo por cada 10 mph
  answer: C
  explanation: Para velocidades superiores a 30 mph, una distancia de seguimiento
    segura debe ser de 4 segundos o más para permitirle tiempo para tomar una decisión
    y actuar.
- id: 61
  category: defensive_driving
  question: ¿Cuánto espacio debe dejar al detenerse detrás de otro vehículo?
  choices:
    A: Lo suficiente para ver dónde las llantas traseras del vehículo de adelante
      tocan el camino
    B: Al menos la longitud de un automóvil completo
    C: Lo suficiente para ver la placa de matrícula del vehículo
    D: Tres pies de distancia
  answer: A
  explanation: Al detenerse detrás de otro vehículo, asegúrese de poder ver el punto
    donde las llantas traseras del vehículo de adelante tocan el camino.
- id: 62
  category: defensive_driving
  question: ¿Qué debe hacer si un vehículo detrás de usted lo sigue demasiado de cerca
    y no puede cambiarse al carril derecho?
  choices:
    A: Frenar bruscamente para desalentar al conductor que lo sigue de cerca
    B: Reducir la velocidad lentamente
    C: Aumentar la velocidad para incrementar la distancia
    D: Encender las luces de emergencia
  answer: B
  explanation: Si un vehículo detrás de usted lo sigue demasiado de cerca y no puede
    cambiarse de carril, reduzca la velocidad lentamente. Esto puede animar al vehículo
    a rebasarlo o a dejar de seguirlo tan de cerca. Nunca frene bruscamente.
- id: 63
  category: vehicle_information
  question: ¿Cuál es la técnica adecuada para dar marcha atrás (retroceder) con un
    vehículo?
  choices:
    A: Confiar totalmente en sus espejos retrovisores y laterales
    B: Girar el cuerpo y la cabeza hacia la derecha y mirar a través de la ventana
      trasera
    C: Tocar la bocina tres veces antes de retroceder
    D: Abrir la puerta y mirar hacia atrás mientras retrocede
  answer: B
  explanation: Los espejos no le dan una visión completa. Para ver lo más posible,
    gire el cuerpo y la cabeza hacia la derecha y mire a través de la ventana trasera.
- id: 64
  category: safe_driving_rules
  question: 'A 60 mph, la distancia recorrida desde el punto en que reconoce un peligro
    hasta que su vehículo se detiene por completo es:'
  choices:
    A: Aproximadamente 50 pies
    B: Menos que la longitud de una cancha de baloncesto
    C: Mayor que la longitud de un campo de fútbol americano
    D: Exactamente 100 pies
  answer: C
  explanation: Detenerse toma más tiempo de lo que piensa. A 60 mph, la distancia
    recorrida desde el punto en que reconoce un peligro adelante y aplica los frenos,
    hasta que su vehículo se detiene, es mayor que la longitud de un campo de fútbol
    americano.
- id: 65
  category: safe_driving_rules
  question: Al acercarse a una curva, ¿cuándo debe reducir la velocidad?
  choices:
    A: Antes de entrar en la curva
    B: Mientras está en medio de la curva
    C: Justo al salir de la curva
    D: Debe mantener su velocidad durante toda la curva
  answer: A
  explanation: El manual establece que debe reducir la velocidad antes de entrar en
    una curva y luego aumentar la velocidad gradualmente a medida que sale de ella.
- id: 66
  category: defensive_driving
  question: ¿Qué debe hacer para revisar su punto ciego antes de cambiar de carril?
  choices:
    A: Revisar su espejo retrovisor interior
    B: Revisar sus espejos laterales
    C: Mirar por encima del hombro en la dirección hacia la que se está moviendo
    D: Encender su luz direccional
  answer: C
  explanation: Antes de cambiar de carril, debe mirar por encima de su hombro izquierdo
    si se mueve a la izquierda, o por encima de su hombro derecho si se mueve a la
    derecha, para poder ver si hay algún vehículo en su punto ciego.
- id: 67
  category: safe_driving_rules
  question: Al rebasar a otro vehículo en una carretera de dos carriles, ¿cuándo es
    seguro regresar a su carril?
  choices:
    A: Tan pronto como su parachoques delantero esté por delante del otro vehículo
    B: Cuando pueda ver el vehículo que rebasó en su espejo retrovisor
    C: Después de haber recorrido 100 pies más allá del vehículo
    D: Cuando el otro conductor le haga señales con las luces delanteras
  answer: B
  explanation: Cuando pueda ver el vehículo que rebasó en su espejo retrovisor, ponga
    la señal y regrese a su carril.
- id: 68
  category: safe_driving_rules
  question: 'Al rebasar a otro vehículo, se le permite exceder el límite de velocidad:'
  choices:
    A: Hasta por 5 mph
    B: Hasta por 10 mph si está rebasando un camión
    C: Solo en una carretera de dos carriles
    D: En ningún momento; es contra la ley exceder los límites de velocidad
  answer: D
  explanation: No exceda el límite de velocidad al rebasar; es contra la ley exceder
    los límites de velocidad en cualquier momento.
- id: 69
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es ilegal cruzar la línea central
    para rebasar?
  choices:
    A: Cuando el vehículo de adelante está detenido en un paso de peatones para permitir
      que un peatón cruce
    B: Cuando se encuentra en una calle de sentido único de varios carriles
    C: Cuando el vehículo de adelante está girando a la derecha
    D: Cuando conduce en una zona residencial con líneas amarillas discontinuas
  answer: A
  explanation: No debe cruzar la línea central para rebasar cuando el vehículo de
    adelante está detenido en un paso de peatones para permitir que un peatón cruce.
- id: 70
  category: safe_driving_rules
  question: ¿Bajo qué condición se le permite rebasar a un vehículo por la derecha?
  choices:
    A: Cuando el vehículo de adelante conduce demasiado lento en el carril izquierdo
      de una carretera de dos carriles
    B: Cuando el vehículo que está rebasando está girando a la izquierda y hay suficiente
      espacio pavimentado a la derecha
    C: Conduciendo por el acotamiento (hombro) no pavimentado de la carretera
    D: Usando un carril designado para bicicletas
  answer: B
  explanation: Puede rebasar por la derecha si el vehículo al que está rebasando está
    girando o ha indicado que girará a la izquierda, siempre que haya suficiente espacio
    a la derecha sin salirse de la parte pavimentada de la carretera ni conducir por
    un carril para bicicletas.
- id: 71
  category: sharing_the_road
  question: ¿Si otro conductor comienza a rebasarlo, cómo debe ayudarlo?
  choices:
    A: Acelerar para que puedan ubicarse detrás de usted
    B: Hacer cambio de luces para avisarles que es seguro
    C: Usar señales manuales para indicarles que avancen
    D: Mantenerse a la derecha y ajustar su velocidad para permitirles volver al carril
  answer: D
  explanation: Cuando otro conductor comienza a rebasar, manténgase a la derecha.
    Puede ayudar al otro conductor a rebasar de manera segura verificando el tráfico
    en sentido contrario y ajustando su velocidad para permitir que el vehículo regrese
    al carril derecho lo antes posible.
- id: 72
  category: safe_driving_rules
  question: ¿Qué dice la ley sobre el uso de las manos o las luces para indicar a
    otros conductores cuándo es seguro rebasarlo?
  choices:
    A: Se recomienda por la noche
    B: Es obligatorio cuando se conduce un camión grande
    C: La ley prohíbe hacer cualquier tipo de señal luminosa a los conductores para
      indicarles cuándo rebasar
    D: Se permite solo en carreteras rurales de dos carriles
  answer: C
  explanation: No use las manos ni las luces para indicar a otros conductores cuándo
    rebasar. La ley prohíbe hacer cualquier tipo de señal luminosa a los conductores
    para indicarles cuándo rebasar.
- id: 73
  category: defensive_driving
  question: ¿En cuál de las siguientes situaciones debería aumentar su distancia de
    seguimiento?
  choices:
    A: Al conducir en carreteras secas y bien pavimentadas
    B: Al seguir a un conductor que no puede verlo, como un camión grande
    C: Cuando conduce un vehículo más pequeño y ligero
    D: Cuando se prepara para realizar un giro a la derecha
  answer: B
  explanation: Debe aumentar su distancia de seguimiento cuando siga a conductores
    que no pueden verlo. Es posible que los conductores de vehículos grandes no puedan
    verlo cuando usted se encuentra directamente detrás de ellos.
- id: 74
  category: safe_driving_rules
  question: 'Si conduce en una autopista a una velocidad inferior al flujo normal
    del tráfico, usted debe:'
  choices:
    A: Conducir por el carril izquierdo.
    B: Conducir por el carril derecho.
    C: Encender las luces de emergencia (hazard lights).
    D: Conducir por el acotamiento.
  answer: B
  explanation: 'Según la sección de Conducción en Autopistas del manual: ''Si conduce
    a una velocidad inferior al flujo del tráfico, debe usar el carril derecho''.'
- id: 75
  category: defensive_driving
  question: ¿Cómo debe alertar a los conductores que vienen detrás de usted si nota
    que el tráfico se ralentiza más adelante en la autopista?
  choices:
    A: Encender las luces de emergencia (hazard lights).
    B: Usar señales con las manos y los brazos.
    C: Presionar ligeramente el pedal del freno varias veces.
    D: Tocar la bocina repetidamente.
  answer: C
  explanation: 'El manual aconseja: ''Si nota que el tráfico se ralentiza más adelante,
    presione ligeramente el pedal del freno varias veces para alertar a los conductores
    que vienen detrás de usted''.'
- id: 76
  category: signs_and_signals
  question: ¿Qué debe hacer si se aproxima a un semáforo de rampa de entrada a la
    autopista que está apagado y no está en uso?
  choices:
    A: Tratarlo como una parada de cuatro vías.
    B: Detenerse y esperar a que la luz cambie a verde.
    C: Ceder el paso al vehículo en el carril contiguo.
    D: No detenerse y continuar hacia la autopista.
  answer: D
  explanation: 'El manual establece con respecto a los semáforos de rampa: ''Los semáforos
    de rampa aparecerán apagados cuando no estén en uso. No se detenga ante un semáforo
    de rampa apagado''.'
- id: 77
  category: safe_driving_rules
  question: Al salir de una autopista, ¿cuándo debe comenzar a reducir la velocidad
    hasta la velocidad recomendada señalizada?
  choices:
    A: Mientras todavía está en el carril derecho de la autopista.
    B: Una vez que esté en la rampa de salida.
    C: Al menos 500 pies antes de la salida.
    D: Solo cuando vea la señal de alto al final de la rampa.
  answer: B
  explanation: 'El manual indica: ''Mantenga su velocidad hasta que esté fuera de
    la autopista. Una vez en la rampa de salida, comience a reducir la velocidad hasta
    la velocidad recomendada señalizada''.'
- id: 78
  category: safe_driving_rules
  question: Si experimenta problemas con el vehículo en una autopista y se mueve al
    acotamiento, ¿cuál es el lugar más seguro para quedarse?
  choices:
    A: Caminar por la autopista para buscar ayuda.
    B: Pararse directamente detrás de su vehículo para advertir a los demás.
    C: Dentro o cerca de su vehículo en el lado alejado del tráfico.
    D: En el carril de tráfico más cercano para pedir ayuda a un auto que pase.
  answer: C
  explanation: 'El manual establece: ''Si es posible, es mejor quedarse dentro o cerca
    de su vehículo en el lado alejado del tráfico. Caminar por una autopista es peligroso''.'
- id: 79
  category: sharing_the_road
  question: ¿Qué debe hacer si está remolcando un tráiler y el tráfico se está acumulando
    detrás de usted?
  choices:
    A: Acelerar para igualar el flujo del tráfico.
    B: Salirse en el primer apartadero (turnout) seguro para dejar pasar el tráfico.
    C: Encender las luces de emergencia y continuar a su velocidad actual.
    D: Hacer señas a los vehículos de atrás para que lo rebasen por la derecha.
  answer: B
  explanation: 'El manual establece: ''Si el tráfico se está acumulando detrás de
    usted, sálgase en el primer apartadero (turnout) seguro para dejar pasar el tráfico''.'
- id: 80
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por una tercera infracción de remolcar más
    de un vehículo o tráiler detrás de un vehículo de pasajeros?
  choices:
    A: Una multa de hasta $1,000.
    B: Una multa de hasta $2,000.
    C: Una multa de hasta $2,500 y seis meses de cárcel.
    D: Suspensión de la licencia por un año.
  answer: C
  explanation: El manual enumera las multas por infracciones de remolque. Para una
    tercera infracción, la sanción es 'Hasta $2,500 y seis meses de cárcel'.
- id: 81
  category: safe_driving_rules
  question: ¿Si su vehículo está circulando en el tráfico, cuál es la distancia mínima
    con la que debe activar la luz direccional antes de realizar un giro o un cambio
    de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: 'El manual establece: ''Si su vehículo está circulando en el tráfico,
    use la luz direccional al menos 100 pies antes del giro o cambio de carril''.'
- id: 82
  category: safe_driving_rules
  question: ¿Bajo qué condiciones se le permite utilizar señales manuales y con el
    brazo?
  choices:
    A: Solo por la noche cuando la visibilidad es escasa.
    B: En cualquier momento que conduzca un vehículo ancho o largo.
    C: A la luz del día cuando pueda ver claramente a personas y vehículos a una distancia
      de 1,000 pies.
    D: Solo cuando las luces direccionales de su vehículo estén rotas.
  answer: C
  explanation: 'El manual establece: ''Solo use señales manuales y con el brazo a
    la luz del día y cuando pueda ver claramente a personas y vehículos a una distancia
    de 1,000 pies''.'
- id: 83
  category: sharing_the_road
  question: Al prepararse para realizar un giro, ¿cuál es la regla con respecto a
    los carriles para bicicletas?
  choices:
    A: Debe entrar en el carril para bicicletas 100 pies antes de girar.
    B: Puede girar cruzando un carril para bicicletas, pero no se mueva hacia él para
      prepararse para un giro.
    C: Nunca se le permite cruzar un carril para bicicletas.
    D: Debe tocar la bocina para despejar el carril para bicicletas antes de entrar
      en él.
  answer: B
  explanation: 'El manual establece explícitamente: ''Puede girar cruzando un carril
    para bicicletas, pero no se mueva hacia un carril para bicicletas para prepararse
    para un giro''.'
- id: 84
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra en una intersección y se da cuenta de
    que está en el carril equivocado para girar?
  choices:
    A: Cambiar de carril rápidamente antes de que el semáforo se ponga en verde.
    B: Detenerse y esperar a que el tráfico se despeje para poder cambiar de carril.
    C: Ir a la siguiente intersección para girar.
    D: Realizar el giro de todos modos pero usar las luces de emergencia.
  answer: C
  explanation: 'El manual aconseja: ''Si se encuentra en una intersección y en el
    carril equivocado para girar, vaya a la siguiente intersección. Es más seguro
    dar la vuelta a la manzana que arriesgarse a una colisión debido a un cambio de
    carril o de dirección de último momento''.'
- id: 85
  category: safe_driving_rules
  question: Al realizar un giro a la izquierda desde una carretera de doble sentido
    hacia otra carretera de doble sentido, ¿dónde debe posicionar su vehículo justo
    antes del giro?
  choices:
    A: En el carril más cercano a la acera derecha.
    B: En el carril justo a la derecha de la línea central.
    C: En el centro de la intersección.
    D: En el carril para bicicletas.
  answer: B
  explanation: 'El manual establece: ''Giros a la izquierda: En una carretera de doble
    sentido, aproxímese al giro con su vehículo en el carril justo a la derecha de
    la línea central''.'
- id: 86
  category: safe_driving_rules
  question: ¿En cuál de las siguientes situaciones es ilegal realizar un giro a la
    izquierda con semáforo en rojo?
  choices:
    A: Girar desde una carretera de un solo sentido hacia otra de un solo sentido.
    B: Girar desde una carretera de doble sentido hacia una de un solo sentido.
    C: Girar desde una carretera de un solo sentido hacia una de doble sentido.
    D: Girar desde un carril de giro a la izquierda doble hacia una carretera de un
      solo sentido.
  answer: C
  explanation: 'El manual establece con respecto a un ''Giro a la izquierda: de carretera
    de un solo sentido a carretera de doble sentido'' que ''No puede realizar este
    giro con semáforo en rojo''. También señala que es ilegal ejecutar un giro a la
    izquierda hacia una carretera de doble sentido con semáforo en rojo.'
- id: 87
  category: defensive_driving
  question: Si accidentalmente comienza a entrar en una autopista en sentido contrario,
    ¿qué es lo primero que debe hacer?
  choices:
    A: Acelerar para salir de la rampa rápidamente.
    B: Salir inmediatamente hacia el lado de la rampa y detenerse.
    C: Poner su vehículo en reversa y retroceder hacia la calle transversal.
    D: Tocar la bocina para advertir al tráfico que viene de frente mientras da la
      vuelta.
  answer: B
  explanation: 'El manual establece: ''Si comienza a entrar en una autopista en sentido
    contrario, una señal de NO ENTRAR (DO NOT ENTER) o SENTIDO CONTRARIO (WRONG WAY)
    le advertirá de su error. Salga inmediatamente hacia el lado de la rampa y deténgase''.'
- id: 88
  category: safe_driving_rules
  question: ¿Dónde están prohibidos los giros en U dentro de los límites de la ciudad?
  choices:
    A: En cualquier lugar donde su vehículo no pueda ser visto por el tráfico de cualquier
      dirección en un tramo de 500 pies.
    B: En cualquier lugar donde su vehículo no pueda ser visto por el tráfico de cualquier
      dirección en un tramo de 1,000 pies.
    C: En cualquier lugar donde su vehículo no pueda ser visto por el tráfico de cualquier
      dirección en un tramo de 250 pies.
    D: En cualquier lugar donde su vehículo no pueda ser visto por el tráfico de cualquier
      dirección en un tramo de 750 pies.
  answer: A
  explanation: Según el manual, los giros en U están prohibidos en cualquier lugar
    dentro de los límites de la ciudad donde su vehículo no pueda ser visto por el
    tráfico que viene de cualquier dirección en un tramo de 500 pies.
- id: 89
  category: safe_driving_rules
  question: ¿Cuál es el requisito de visibilidad para realizar un giro en U fuera
    de los límites de la ciudad?
  choices:
    A: Su vehículo debe ser visto por el tráfico de cualquier dirección en un tramo
      de 500 pies.
    B: Su vehículo debe ser visto por el tráfico de cualquier dirección en un tramo
      de 1,000 pies.
    C: Su vehículo debe ser visto por el tráfico de cualquier dirección en un tramo
      de 1,500 pies.
    D: Su vehículo debe ser visto por el tráfico de cualquier dirección en un tramo
      de 2,000 pies.
  answer: B
  explanation: El manual establece que los giros en U están prohibidos en cualquier
    lugar fuera de los límites de la ciudad donde su vehículo no pueda ser visto por
    el tráfico que viene de cualquier dirección en un tramo de 1,000 pies.
- id: 90
  category: safe_driving_rules
  question: En una intersección sin señales ni semáforos, ¿a qué vehículo debe cederle
    el derecho de paso?
  choices:
    A: A cualquier vehículo que se aproxime por su izquierda.
    B: A cualquier vehículo que esté en la intersección o que se aproxime por su derecha.
    C: Al vehículo que circule a la mayor velocidad.
    D: A cualquier vehículo que intente realizar un giro a la izquierda.
  answer: B
  explanation: Al acercarse a una intersección sin señales ni semáforos, debe ceder
    el derecho de paso a cualquier vehículo que esté en la intersección o que se aproxime
    desde su derecha.
- id: 91
  category: safe_driving_rules
  question: ¿Qué debe hacer si conduce por una carretera que termina en una intersección
    en "T" sin señales ni semáforos?
  choices:
    A: Ceder el paso a los conductores en la carretera transversal
    B: Tomar el derecho de paso ya que está girando
    C: Detenerse y esperar una luz verde
    D: Tocar la bocina para advertir al tráfico transversal antes de avanzar
  answer: A
  explanation: Si usted es el conductor en una carretera que termina en una intersección
    en "T" sin señales ni semáforos, debe ceder el paso a los conductores en la carretera
    transversal.
- id: 92
  category: safe_driving_rules
  question: ¿Qué debe hacer si se aproxima un vehículo de emergencia mientras conduce
    dentro de una rotonda?
  choices:
    A: Detenerse inmediatamente dentro de la rotonda para dejarlo pasar
    B: Avanzar y salir de la rotonda, luego detenerse en el arcén derecho
    C: Detenerse en la isla central de la rotonda
    D: Acelerar y salir lo más rápido posible sin señalizar
  answer: B
  explanation: Nunca se detenga mientras esté dentro de la rotonda. En su lugar, avance
    y salga de la rotonda. Una vez que salga, deténgase en el arcén derecho y permita
    que pasen los vehículos de emergencia.
- id: 93
  category: safe_driving_rules
  question: 'Al conducir en una rotonda de varios carriles, es ilegal:'
  choices:
    A: Usar la señal de giro a la derecha al salir
    B: Mantener su posición en el carril
    C: Rebasar o conducir al lado de un camión
    D: Ceder el paso al tráfico dentro de la rotonda antes de entrar
  answer: C
  explanation: No intente adelantar ni rebasar a ningún vehículo, especialmente camiones
    grandes y remolques dentro de la rotonda. Es ilegal rebasar o conducir al lado
    de un camión dentro de la rotonda.
- id: 94
  category: sharing_the_road
  question: Al girar en una intersección que tiene un semáforo, ¿a qué distancia debe
    estar un peatón antes de que usted comience a girar?
  choices:
    A: Más allá del carril al que usted está girando, más el carril siguiente
    B: A seis pies o más del carril al que usted está girando
    C: A diez pies o más de su vehículo
    D: Completamente en la acera
  answer: B
  explanation: Si está girando en una intersección que tiene un semáforo, antes de
    comenzar a girar, el peatón debe estar a seis pies o más del carril al que usted
    está girando.
- id: 95
  category: sharing_the_road
  question: Al girar en una intersección que NO tiene semáforo, ¿cuándo es seguro
    girar con respecto a los peatones?
  choices:
    A: Cuando el peatón está a seis pies de su carril
    B: Cuando el peatón ha pasado el carril al que usted está girando, más el carril
      siguiente
    C: Tan pronto como el peatón baje de la acera
    D: Cuando el peatón llegue a la isla central
  answer: B
  explanation: Si está girando en una intersección que no tiene semáforo, antes de
    comenzar a girar, el peatón debe haber pasado el carril al que usted está girando,
    más el carril siguiente.
- id: 96
  category: sharing_the_road
  question: ¿Cuál es el ancho mínimo de un paso de peatones no marcado?
  choices:
    A: Cuatro pies
    B: Seis pies
    C: Ocho pies
    D: Diez pies
  answer: B
  explanation: Un paso de peatones no marcado tiene al menos seis pies de ancho y
    existe incluso si no hay acera o arcén.
- id: 97
  category: sharing_the_road
  question: 'Si un peatón ciego que lleva un bastón blanco está cruzando la carretera,
    usted debe:'
  choices:
    A: Tocar la bocina para que sepa que usted está allí
    B: Ceder el paso hasta que esté a seis pies después de su carril
    C: Permanecer detenido hasta que la persona haya cruzado toda la carretera
    D: Conducir lentamente alrededor de ellos si hay espacio
  answer: C
  explanation: Debe ceder el derecho de paso a un peatón que sea ciego, lleve un bastón
    blanco o use un perro guía. Permanezca detenido hasta que la persona haya cruzado
    toda la carretera, incluso si usted tiene la luz verde.
- id: 98
  category: safe_driving_rules
  question: En una intersección con parada en las cuatro direcciones, si dos conductores
    se detienen al mismo tiempo y tienen dudas sobre quién va primero, ¿quién debe
    ceder el paso?
  choices:
    A: El conductor de la derecha cede el paso al conductor de la izquierda
    B: El conductor que gira a la derecha cede el paso al conductor que gira a la
      izquierda
    C: El conductor de la izquierda cede el paso al conductor de la derecha
    D: El vehículo más grande tiene el derecho de paso
  answer: C
  explanation: En las intersecciones con señales de alto en las cuatro direcciones,
    es una cortesía común permitir que el conductor que se detiene primero pase primero.
    En caso de duda, ceda el paso al conductor a su derecha.
- id: 99
  category: sharing_the_road
  question: ¿Por qué es ilegal rebasar a un vehículo detenido en un paso de peatones?
  choices:
    A: El vehículo detenido podría retroceder repentinamente
    B: El conductor puede estar esperando a que un peatón cruce la carretera
    C: Podría bloquear a un vehículo de emergencia
    D: Es probable que el vehículo detenido esté averiado
  answer: B
  explanation: No rebase a un vehículo detenido en un paso de peatones, es ilegal.
    El conductor puede estar esperando a que un peatón cruce la carretera.
- id: 100
  category: sharing_the_road
  question: ¿Cómo debe interactuar con una persona que monta en bicicleta dentro de
    una rotonda?
  choices:
    A: Rebasarla rápidamente por la izquierda
    B: Tocar la bocina para advertirle que la está rebasando
    C: No rebasar a una persona que monta en bicicleta dentro de la rotonda
    D: Obligarla a usar la acera
  answer: C
  explanation: Permita que las personas que montan en bicicleta y que se han incorporado
    al tráfico utilicen todo el carril de circulación. No rebase a una persona que
    monta en bicicleta dentro de la rotonda.
- id: 101
  category: safe_driving_rules
  question: ¿Cuál es la regla general para girar de una calle a otra?
  choices:
    A: Girar desde el carril central hacia el carril del extremo derecho
    B: Girar desde el carril más cercano en la dirección en la que viaja hacia el
      carril más cercano en la dirección a la que desea ir
    C: Abrirse mucho al girar para asegurarse de no tocar el bordillo
    D: Girar siempre hacia el carril del extremo izquierdo, independientemente de
      su posición inicial
  answer: B
  explanation: La regla general para girar es hacerlo desde el carril más cercano
    en la dirección en la que viaja hacia el carril más cercano en la dirección a
    la que desea ir. Evite abrirse demasiado o cambiar de carril mientras gira.
- id: 102
  category: sharing_the_road
  question: ¿Está obligado a detenerse ante un peatón en un cruce peatonal si este
    se encuentra al otro lado de una isla de seguridad?
  choices:
    A: Sí, siempre debe detenerse ante cualquier peatón en un cruce peatonal
    B: Sí, a menos que tenga el semáforo en verde
    C: No, no está obligado a detenerse si el peatón está al otro lado de una isla
      de seguridad
    D: No, a menos que lleven un bastón blanco
  answer: C
  explanation: 'El manual establece: ''No está obligado a detenerse si el peatón se
    encuentra en un cruce peatonal al otro lado de una isla de seguridad''.'
- id: 103
  category: sharing_the_road
  question: ¿Qué debe hacer si una persona que usa un bastón blanco o un perro guía
    está cruzando la calle con un semáforo en verde?
  choices:
    A: Tocar la bocina para alertarles del semáforo en verde.
    B: Avanzar con cuidado rodeándolos.
    C: Permanecer detenido hasta que la persona haya cruzado toda la calle.
    D: Ceder el paso solo si están en un cruce peatonal marcado.
  answer: C
  explanation: El manual establece que debe permanecer detenido hasta que la persona
    haya cruzado toda la calle, incluso si usted tiene el semáforo en verde.
- id: 104
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad reducido en una zona escolar designada?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: Una zona de velocidad escolar es un área donde se aplica una velocidad
    reducida de 20 mph y está definida por señales de velocidad escolar.
- id: 105
  category: signs_and_signals
  question: Si una señal de límite de velocidad escolar especifica 'School Hours'
    (Horario escolar), ¿en qué horario se aplica el límite de velocidad reducido en
    un día de clases?
  choices:
    A: 7 a.m. a 4 p.m.
    B: 8 a.m. a 5 p.m.
    C: 7 a.m. a 5 p.m.
    D: 8 a.m. a 4 p.m.
  answer: C
  explanation: La señal de límite de velocidad de horario escolar se aplica entre
    las 7 a.m. y las 5 p.m. en los días en que hay clases.
- id: 106
  category: safe_driving_rules
  question: Según el manual, ¿cuál de las siguientes situaciones significa que 'hay
    niños presentes' (children are present) en una zona de velocidad escolar?
  choices:
    A: Hay niños jugando en un patio escolar cercano que está cercado.
    B: Hay niños esperando en un cruce peatonal.
    C: Un autobús escolar está estacionado en el estacionamiento de la escuela.
    D: Es entre las 8 a.m. y las 3 p.m. en un día de semana.
  answer: B
  explanation: El manual define 'Niños presentes' como niños esperando en un cruce
    peatonal, ocupando o caminando dentro de un cruce peatonal, o cuando un miembro
    de la patrulla de tráfico está presente para ayudar a los niños en un cruce peatonal.
- id: 107
  category: sharing_the_road
  question: ¿Cuándo se le permite conducir a través de un carril para bicicletas?
  choices:
    A: Al prepararse para realizar un giro.
    B: Al adelantar a un vehículo más lento por la derecha.
    C: Al girar o al entrar o salir de un callejón, entrada privada o camino privado.
    D: Nunca se le permite cruzar un carril para bicicletas.
  answer: C
  explanation: Puede cruzar un carril para bicicletas al girar o al entrar o salir
    de un callejón, entrada privada o camino privado, pero no puede entrar ni circular
    por un carril para bicicletas como preparación para un giro.
- id: 108
  category: sharing_the_road
  question: ¿Qué se requiere al adelantar a una persona en bicicleta que circula por
    su carril a velocidades superiores a 35 mph?
  choices:
    A: Debe tocar la bocina antes de adelantar.
    B: Solo puede adelantar si deja una distancia suficiente para evitar el contacto
      en caso de que la persona se caiga.
    C: Debe cambiar de carril por completo para adelantar a la bicicleta.
    D: No se permite adelantar bicicletas a velocidades superiores a 35 mph.
  answer: B
  explanation: A velocidades superiores a 35 mph, solo puede adelantar a una persona
    en bicicleta que circule por su carril si deja una distancia suficiente para evitar
    el contacto con el ciclista en caso de que este se caiga.
- id: 109
  category: signs_and_signals
  question: ¿Qué debe hacer cuando se detiene ante un semáforo en rojo con una caja
    para bicicletas (bike box) pintada de verde en su carril?
  choices:
    A: Detenerse dentro de la caja para bicicletas para evitar que las bicicletas
      se crucen delante de usted.
    B: Detenerse detrás de la caja para bicicletas.
    C: Girar a la derecha en rojo después de ceder el paso a las bicicletas.
    D: Avanzar hasta la mitad de la caja para bicicletas para activar el sensor del
      semáforo.
  answer: B
  explanation: Como conductor, debe detenerse ante una señal de tráfico detrás de
    la caja para bicicletas. No se detenga dentro de la caja. Además, no se permiten
    giros a la derecha en estas intersecciones cuando el semáforo está en rojo.
- id: 110
  category: signs_and_signals
  question: ¿Qué indica un 'sharrow' (flecha compartida) pintado en la carretera?
  choices:
    A: El carril es solo para bicicletas.
    B: El carril es compartido y puede haber personas en bicicleta en la vía.
    C: Las bicicletas deben ceder el paso a los vehículos motorizados en este carril.
    D: El carril termina y las bicicletas deben incorporarse a la derecha.
  answer: B
  explanation: Un 'sharrow' indica que el carril es compartido y que puede haber personas
    en bicicleta en la vía. Se indica mediante dos galones (cheurones) encima del
    símbolo de una bicicleta.
- id: 111
  category: defensive_driving
  question: ¿Por qué debe tener precaución adicional antes de girar frente a una motocicleta
    que se aproxima y tiene encendida la luz direccional?
  choices:
    A: Las motocicletas siempre tienen el derecho de paso en las intersecciones.
    B: Las luces direccionales en algunas motocicletas no se cancelan automáticamente
      y el conductor puede haber olvidado apagarla.
    C: Las motocicletas giran más rápido que otros vehículos.
    D: Las luces direccionales de las motocicletas a menudo están conectadas al revés.
  answer: B
  explanation: Las luces direccionales no se cancelan automáticamente en algunas motocicletas
    y el conductor puede olvidar apagar la señal. Debe estar seguro de que el conductor
    realmente está reduciendo la velocidad para girar antes de realizar su maniobra.
- id: 112
  category: sharing_the_road
  question: ¿Es legal compartir un carril con una persona que conduce una motocicleta
    o un ciclomotor (moped)?
  choices:
    A: Sí, si el carril es lo suficientemente ancho para ambos vehículos.
    B: Sí, pero solo cuando el tráfico está detenido o se mueve muy lentamente.
    C: No, es contra la ley compartir un carril con una motocicleta o un ciclomotor.
    D: No, a menos que el conductor de la motocicleta indique que es seguro hacerlo.
  answer: C
  explanation: 'El manual establece explícitamente: ''Es contra la ley compartir un
    carril con una persona que conduce una motocicleta o un ciclomotor. Al rebasar,
    debe permitirles el uso de un carril completo''.'
- id: 113
  category: vehicle_information
  question: En comparación con los vehículos más pequeños que viajan a la misma velocidad,
    ¿cuánta distancia suelen tardar en detenerse los vehículos grandes?
  choices:
    A: Aproximadamente la misma distancia
    B: Aproximadamente el doble de la distancia
    C: Aproximadamente tres veces la distancia
    D: Aproximadamente cuatro veces la distancia
  answer: C
  explanation: Los vehículos grandes tardan aproximadamente tres veces más en detenerse
    que los vehículos más pequeños que viajan a la misma velocidad.
- id: 114
  category: sharing_the_road
  question: ¿Cómo puede saber si está conduciendo en el punto ciego lateral de un
    vehículo grande?
  choices:
    A: Se encuentra a menos de 50 pies del parachoques trasero.
    B: No puede ver al conductor en el espejo lateral del vehículo grande.
    C: El vehículo grande viaja a más de 55 mph.
    D: Puede ver la luz direccional del vehículo grande parpadeando.
  answer: B
  explanation: Los vehículos grandes tienen puntos ciegos más grandes en ambos lados.
    Si no puede ver al conductor en el espejo lateral del vehículo grande, el conductor
    no puede verlo a usted.
- id: 115
  category: safe_driving_rules
  question: Al rebasar un vehículo grande, ¿cuándo es seguro volver al carril delante
    de él?
  choices:
    A: Tan pronto como su parachoques trasero pase la parte delantera del vehículo
      grande.
    B: Cuando pueda ver toda la parte delantera del vehículo grande en su espejo retrovisor.
    C: Cuando el conductor del vehículo grande parpadee sus faros delanteros.
    D: Después de haber mantenido su velocidad de rebase durante al menos 10 segundos.
  answer: B
  explanation: Al rebasar un vehículo grande, debe ver toda la parte delantera del
    vehículo en su espejo retrovisor antes de incorporarse delante de él.
- id: 116
  category: defensive_driving
  question: ¿Qué debe hacer si ve un vehículo guía (pilot vehicle) en el tráfico que
    viene en sentido contrario?
  choices:
    A: Salirse completamente de la carretera y detenerse.
    B: Parpadear sus faros para reconocer al conductor.
    C: Reducir su velocidad y posicionar su vehículo lo más a la derecha posible dentro
      de su carril.
    D: Moverse al carril central de giro para darles espacio adicional.
  answer: C
  explanation: Si ve un vehículo guía en el tráfico que viene en sentido contrario,
    reduzca su velocidad y posicione su vehículo lo más a la derecha posible, permaneciendo
    en su carril.
- id: 117
  category: safe_driving_rules
  question: ¿Cuándo debe detenerse ante un autobús escolar con luces rojas intermitentes
    si se encuentra en una carretera dividida por una franja central (mediana) sin
    pavimentar?
  choices:
    A: Siempre debe detenerse, independientemente del lado de la carretera en el que
      se encuentre.
    B: Debe detenerse solo si se encuentra en el mismo lado de la carretera que el
      autobús.
    C: Debe detenerse solo si hay niños cruzando la franja central.
    D: No tiene que detenerse en una carretera dividida.
  answer: B
  explanation: Si se encuentra en una carretera dividida con dos calzadas separadas
    por una franja central (mediana) sin pavimentar o una barrera, debe detenerse
    solo si se encuentra en el mismo lado de la carretera que el autobús.
- id: 118
  category: sharing_the_road
  question: Si se encuentra en una carretera dividida con una franja central (mediana)
    pintada y un autobús escolar está detenido con luces rojas intermitentes, ¿quién
    debe detenerse?
  choices:
    A: Solo el tráfico del mismo lado que el autobús
    B: Todos los carriles de tráfico
    C: Solo el tráfico detrás del autobús
    D: Ningún tráfico necesita detenerse
  answer: B
  explanation: Una franja central pintada o un carril de giro no crean dos carreteras
    separadas. En este caso, todos los carriles de tráfico deben detenerse ante un
    autobús escolar con luces rojas intermitentes.
- id: 119
  category: sharing_the_road
  question: ¿Cuándo debe ceder el paso a un autobús de transporte público que se está
    reincorporando a un carril de tráfico?
  choices:
    A: Siempre que el autobús tenga encendidas sus luces de emergencia
    B: Cuando el conductor señale para reingresar y una señal eléctrica de 'ceda el
      paso' (yield) parpadee en la parte trasera
    C: Solo si está conduciendo por debajo del límite de velocidad
    D: Nunca se requiere ceder el paso a los autobuses de transporte público
  answer: B
  explanation: Los vehículos que se aproximan por detrás deben ceder el paso cuando
    el conductor de un autobús señala para reingresar a un carril de tráfico y hay
    una señal eléctrica que parpadea 'yield' (ceda el paso) en la parte trasera del
    autobús.
- id: 120
  category: signs_and_signals
  question: ¿Cómo es el emblema de un vehículo de movimiento lento?
  choices:
    A: Un triángulo amarillo con un borde negro
    B: Un borde rojo reflectante con un centro naranja fluorescente
    C: Un cuadrado blanco con un círculo rojo en el medio
    D: Un diamante verde fluorescente con un borde negro
  answer: B
  explanation: El emblema de vehículo de movimiento lento consiste en un borde rojo
    reflectante y un centro naranja fluorescente.
- id: 121
  category: vehicle_information
  question: ¿Se debe mostrar una bandera roja de al menos 12 pulgadas cuadradas al
    final de cualquier carga que se extienda a qué distancia más allá de la parte
    trasera de un vehículo?
  choices:
    A: 2 pies o más
    B: 3 pies o más
    C: 4 pies o más
    D: 5 pies o más
  answer: C
  explanation: Se debe mostrar una bandera roja, de al menos 12 pulgadas cuadradas,
    al final de cualquier carga que se extienda 4 pies o más más allá de la parte
    trasera del vehículo.
- id: 122
  category: vehicle_information
  question: ¿A qué distancia puede extenderse una carga más allá de los lados de los
    guardabarros derechos en un vehículo de pasajeros?
  choices:
    A: No puede extenderse más allá de los guardabarros en absoluto
    B: Hasta 6 pulgadas
    C: Hasta 12 pulgadas
    D: Hasta 2 pies
  answer: B
  explanation: Las cargas no pueden extenderse más de 6 pulgadas más allá de los lados
    de los guardabarros derechos en los vehículos de pasajeros.
- id: 123
  category: sharing_the_road
  question: Si no es miembro de un cortejo fúnebre, ¿cuál es la regla con respecto
    a conducir entre los vehículos del cortejo?
  choices:
    A: Puede unirse al cortejo si enciende sus luces de emergencia
    B: Puede conducir entre los vehículos solo para realizar un giro a la derecha
    C: Es ilegal unirse o conducir entre los vehículos del cortejo
    D: Puede rebasar al cortejo si toca la bocina
  answer: C
  explanation: Si no es miembro del cortejo fúnebre, es ilegal unirse o conducir entre
    los vehículos del cortejo.
- id: 124
  category: safe_driving_rules
  question: Si se aproxima a un vehículo de motor detenido con luces intermitentes
    en una carretera de varios carriles y no cambia de carril, ¿cuánto debe reducir
    la velocidad?
  choices:
    A: Al menos 5 mph por debajo del límite de velocidad indicado
    B: Al menos 10 mph por debajo del límite de velocidad indicado
    C: A exactamente 20 mph
    D: A exactamente 15 mph
  answer: A
  explanation: Si no cambia de carril al acercarse a un vehículo detenido con luces
    intermitentes, debe reducir la velocidad al menos 5 millas por hora (mph) por
    debajo del límite de velocidad indicado.
- id: 125
  category: safe_driving_rules
  question: Después de que un vehículo de emergencia con sus luces o sirena encendidas
    lo haya pasado, ¿cuál es la distancia mínima que debe mantener detrás de él?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: D
  explanation: Después de que pase el vehículo de emergencia, debe mantenerse al menos
    a 500 pies de distancia detrás del vehículo.
- id: 126
  category: safe_driving_rules
  question: Al ser detenido por un vehículo policial, ¿dónde debe evitar detenerse?
  choices:
    A: En el lado derecho de la carretera
    B: En una intersección o en la mediana central de una autopista
    C: En un espacio de estacionamiento designado
    D: En un arcén de grava
  answer: B
  explanation: Cuando lo detenga la policía, conduzca lo más cerca posible del lado
    derecho de la carretera de manera segura. No se detenga en una intersección ni
    se detenga en la mediana central de una autopista.
- id: 127
  category: penalties_and_points
  question: ¿Qué sucede con las multas de tráfico en todas las zonas de obras?
  choices:
    A: Se reducen a la mitad
    B: Siguen siendo las mismas que en las carreteras normales
    C: Se duplican
    D: Se triplican
  answer: C
  explanation: Las multas de tráfico se duplican en todas las zonas de obras.
- id: 128
  category: safe_driving_rules
  question: ¿Cuándo se aplican los límites de velocidad temporales publicados en una
    zona de obras?
  choices:
    A: Solo cuando los trabajadores son visibles
    B: Solo durante las horas del día
    C: En todo momento, incluso si los trabajadores no son visibles
    D: Solo cuando se está operando maquinaria pesada
  answer: C
  explanation: La velocidad temporal publicada en una zona de obras se aplica en todo
    momento, incluso si los trabajadores no son visibles.
- id: 129
  category: safe_driving_rules
  question: Cuando se requiera detenerse en un cruce de ferrocarril sin línea de parada,
    ¿a qué distancia del riel más cercano debe detenerse?
  choices:
    A: Al menos 5 pies
    B: Al menos 10 pies
    C: Al menos 15 pies
    D: Al menos 25 pies
  answer: C
  explanation: Cuando sea necesario detenerse, hágalo en la línea de parada. Si no
    hay línea de parada, deténgase al menos a 15 pies del riel más cercano.
- id: 130
  category: defensive_driving
  question: Si su vehículo se queda atascado en las vías del tren y se acerca un tren,
    ¿en qué dirección debe moverse después de salir del vehículo?
  choices:
    A: Paralelo a las vías en la misma dirección en que se mueve el tren
    B: En un ángulo de 45 grados con respecto a las vías en dirección al tren
    C: Directamente lejos de las vías en un ángulo de 90 grados
    D: En un ángulo de 45 grados con respecto a las vías alejándose del tren
  answer: B
  explanation: Si se acerca un tren, muévase en un ángulo de 45 grados con respecto
    a las vías en dirección al tren para que no lo golpeen los escombros del impacto.
- id: 131
  category: safe_driving_rules
  question: Si la policía lo detiene y está oscuro afuera, ¿qué debe hacer antes de
    que el oficial se acerque?
  choices:
    A: Apagar todas las luces
    B: Encender las luces altas
    C: Encender la luz interior del vehículo
    D: Salir del vehículo con una linterna
  answer: C
  explanation: Si está oscuro, encienda la luz interior del vehículo después de detenerse
    y antes de que el oficial se acerque.
- id: 132
  category: sharing_the_road
  question: ¿Qué debe hacer si está comenzando a cruzar una intersección y ve que
    se acerca una ambulancia por detrás con la sirena encendida?
  choices:
    A: Detenerse inmediatamente en la intersección
    B: Cruzar la intersección, hacerse a la derecha y detenerse
    C: Hacerse a la derecha dentro de la intersección y detenerse
    D: Acelerar para despejar la intersección y seguir conduciendo
  answer: B
  explanation: No debe detenerse en una intersección ante un vehículo de emergencia.
    Debe cruzar la intersección, hacerse a la derecha y detenerse.
- id: 133
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo se queda atascado en las vías del tren
    y se acerca un tren?
  choices:
    A: Correr directamente lejos de las vías en la misma dirección en la que se mueve
      el tren.
    B: Moverse en un ángulo de 45 grados con respecto a las vías en dirección al tren.
    C: Permanecer en el vehículo y llamar al 911 de inmediato.
    D: Pararse junto al vehículo y agitar los brazos para alertar al tren.
  answer: B
  explanation: Si se acerca un tren, muévase en un ángulo de 45 grados con respecto
    a las vías en dirección al tren para que no le golpeen los escombros.
- id: 134
  category: sharing_the_road
  question: 'Cuando un tranvía o tren ligero se detiene para recoger o dejar pasajeros,
    usted debe:'
  choices:
    A: Tocar la bocina y rebasar por la derecha.
    B: Rebasar con cuidado a una velocidad de 10 mph o menos.
    C: Permanecer detrás de él hasta que se mueva de nuevo o las personas estén a
      salvo.
    D: Cambiar de carril y acelerar para rebasar rápidamente.
  answer: C
  explanation: Si un tranvía o tren se detiene para recoger o dejar personas, permanezca
    detrás de él hasta que se mueva de nuevo o las personas estén a salvo.
- id: 135
  category: sharing_the_road
  question: ¿Es seguro girar delante de un tranvía que viaja en su misma dirección
    desde un carril adyacente?
  choices:
    A: Sí, si el tranvía está detenido.
    B: Sí, si usa su luz de giro.
    C: No, nunca gire delante de un tranvía desde un carril adyacente.
    D: No, a menos que esté conduciendo un vehículo comercial.
  answer: C
  explanation: Nunca gire delante de un tranvía o tren que viaje en su misma dirección
    desde un carril adyacente, incluso si el tranvía o tren está detenido.
- id: 136
  category: safe_driving_rules
  question: Al estacionar en paralelo, ¿a qué distancia debe estar su vehículo del
    bordillo (acera)?
  choices:
    A: A no más de 6 pulgadas
    B: A no más de 12 pulgadas
    C: A no más de 18 pulgadas
    D: A no más de 24 pulgadas
  answer: B
  explanation: Estacione en paralelo y a no más de 12 pulgadas del bordillo.
- id: 137
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas al estacionar cuesta abajo contra un
    bordillo?
  choices:
    A: Hacia el carril de circulación
    B: Hacia adelante (rectas)
    C: Hacia el bordillo
    D: Hacia el borde de la carretera
  answer: C
  explanation: Al estacionar cuesta abajo contra un bordillo, gire las ruedas hacia
    el bordillo para evitar que su vehículo ruede cuesta abajo.
- id: 138
  category: penalties_and_points
  question: ¿Cuál es la multa mínima por estacionar en un espacio para personas con
    discapacidad sin un permiso válido?
  choices:
    A: $50
    B: $100
    C: $165
    D: $250
  answer: C
  explanation: Las multas comienzan en $165 y llegan hasta $1,000 si no es titular
    de un permiso de estacionamiento para personas con discapacidad.
- id: 139
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios no se puede detener ni estacionar
    su vehículo?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: A
  explanation: No puede detener ni estacionar su vehículo a menos de 10 pies de un
    hidrante de incendios.
- id: 140
  category: safe_driving_rules
  question: ¿Es ilegal estacionar a menos de cuántos pies de un paso de peatones marcado
    o no marcado en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 50 pies
  answer: C
  explanation: No puede detener ni estacionar su vehículo a menos de 20 pies de un
    paso de peatones marcado o no marcado en una intersección.
- id: 141
  category: safe_driving_rules
  question: 'No debe estacionarse a menos de 50 pies de una señal o semáforo si:'
  choices:
    A: Está en una autopista de varios carriles.
    B: Su vehículo oculta la señal o el semáforo de la vista.
    C: El límite de velocidad es superior a 35 mph.
    D: Se estacionará por más de 2 horas.
  answer: B
  explanation: No puede detener ni estacionar su vehículo a menos de 50 pies de una
    señal o semáforo si su vehículo oculta la señal o el semáforo de la vista.
- id: 142
  category: defensive_driving
  question: Si debe estacionarse en el acotamiento de una autopista debido a una emergencia
    y su vehículo no puede verse desde 200 pies, ¿qué debe hacer?
  choices:
    A: Encender las luces altas de los faros delanteros.
    B: Advertir al tráfico que se aproxima con banderas, bengalas o señales colocadas
      al menos a 200 pies de distancia.
    C: Pararse en la calzada y agitar los brazos.
    D: Dejar el vehículo encendido con las puertas abiertas.
  answer: B
  explanation: Si su vehículo no puede verse desde 200 pies en cada dirección, debe
    advertir al tráfico que se aproxima. Esto puede hacerse con banderas, bengalas,
    señales, dispositivos de señalización o señaleros colocados al menos a 200 pies
    de su vehículo en cada dirección.
- id: 143
  category: safe_driving_rules
  question: 'Si debe dejar su vehículo desatendido durante una parada de emergencia,
    debe:'
  choices:
    A: Dejar el motor encendido para mantener la batería cargada.
    B: Dejar las llaves en el encendido para el conductor de la grúa.
    C: Apagar el motor, quitar la llave, poner los frenos y encender las luces de
      emergencia.
    D: Apagar las luces de emergencia para ahorrar batería.
  answer: C
  explanation: Si debe dejar su vehículo desatendido, apague el motor, retire la llave,
    ponga los frenos y encienda las luces de emergencia.
- id: 144
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una regla para usar correctamente el cinturón
    de seguridad en Oregón?
  choices:
    A: Puede ponerse la correa del hombro debajo del brazo si le resulta incómoda.
    B: Puede colocar la correa del hombro detrás de la espalda.
    C: Debe dejar un poco de holgura en la parte del regazo para mayor comodidad.
    D: Nunca se ponga la correa del hombro debajo del brazo ni detrás de la espalda.
  answer: D
  explanation: No deje holgura en la parte del regazo o del hombro del cinturón. Nunca
    se ponga la correa del hombro debajo del brazo ni detrás de la espalda.
- id: 145
  category: safe_driving_rules
  question: Al salir de una posición de estacionamiento o parada, ¿cuál es la forma
    más segura de reincorporarse al tráfico?
  choices:
    A: Revisar los espejos y salir rápidamente.
    B: Revisar sus puntos ciegos y espejos, y ceder el paso a todo el resto del tráfico.
    C: Señalizar e incorporarse al tráfico, ya que los otros conductores deben cederle
      el paso.
    D: Tocar la bocina antes de salir.
  answer: B
  explanation: Al salir de una posición de estacionamiento o parada, revise sus puntos
    ciegos y espejos, y ceda el paso a todo el resto del tráfico.
- id: 146
  category: signs_and_signals
  question: ¿Cuál es el propósito de la señal del Sistema de Notificación de Emergencia
    (ENS) en un cruce de ferrocarril?
  choices:
    A: Advertir a los conductores de un tren que se aproxima.
    B: Notificar a los ferrocarriles sobre una obstrucción en las vías para que puedan
      alertar a los trenes que vienen.
    C: Indicar el límite de velocidad para los trenes que cruzan la carretera.
    D: Proporcionar instrucciones sobre cómo cruzar las vías de manera segura.
  answer: B
  explanation: Busque una señal del Sistema de Notificación de Emergencia (ENS) ubicada
    en un poste en el cruce cerca de las vías para notificar a los ferrocarriles sobre
    la obstrucción en las vías para que puedan alertar a los trenes que se aproximan.
- id: 147
  category: safe_driving_rules
  question: ¿Hasta qué edad deben viajar los bebés en un asiento de seguridad para
    niños orientado hacia atrás?
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 3 años de edad
    D: 4 años de edad
  answer: B
  explanation: Según el manual, los bebés deben viajar orientados hacia atrás hasta
    que cumplan los dos años de edad.
- id: 148
  category: safe_driving_rules
  question: ¿Cuándo ya no se requiere que un niño pasajero esté sujeto en un asiento
    de seguridad para niños aprobado?
  choices:
    A: Cuando tienen 6 años de edad o 4 pies de altura
    B: Cuando tienen 8 años de edad o al menos 4 pies 9 pulgadas de altura
    C: Cuando alcanzan las 60 libras
    D: Cuando cumplen 10 años
  answer: B
  explanation: Los niños pasajeros deben estar sujetos en asientos de seguridad para
    niños aprobados hasta que tengan 8 años de edad o al menos 4 pies 9 pulgadas de
    altura, y el cinturón de adulto les ajuste correctamente.
- id: 149
  category: defensive_driving
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a sus opciones
    para evitar una colisión?
  choices:
    A: Por lo general, puede detener el vehículo más rápido de lo que puede girarlo.
    B: En la mayoría de los casos, puede girar el vehículo más rápido de lo que puede
      detenerlo.
    C: Aumentar la velocidad nunca es una opción segura para evitar una colisión.
    D: Siempre debe pisar los frenos a fondo de inmediato.
  answer: B
  explanation: El manual establece que, en la mayoría de los casos, puede girar el
    vehículo más rápido de lo que puede detenerlo, lo que hace que girar rápidamente
    sea una forma viable de evitar una colisión.
- id: 150
  category: defensive_driving
  question: ¿Cuál es la forma adecuada de volver a la carretera de manera segura si
    su vehículo se sale del pavimento?
  choices:
    A: Frenar con fuerza y girar el volante bruscamente hacia la izquierda.
    B: Entrar en pánico y virar inmediatamente de regreso al pavimento.
    C: Reducir la velocidad y girar las ruedas delanteras lo suficiente para volver
      a la carretera.
    D: Acelerar para recuperar la tracción antes de girar de regreso a la carretera.
  answer: C
  explanation: Si se sale de la carretera, no debe entrar en pánico ni frenar con
    fuerza. Reduzca la velocidad, sujete el volante con firmeza y gire las ruedas
    delanteras lo suficiente para volver a la carretera sin girar bruscamente.
- id: 151
  category: defensive_driving
  question: ¿Si un vehículo que viene en sentido contrario se desvía hacia su carril,
    por qué NUNCA debe meterse en el carril opuesto para evitarlo?
  choices:
    A: Es ilegal cruzar la línea central bajo cualquier circunstancia.
    B: El conductor que viene en sentido contrario podría regresar bruscamente a ese
      carril.
    C: Su vehículo perderá tracción en el lado opuesto de la carretera.
    D: No podrá usar su bocina o luces de manera efectiva.
  answer: B
  explanation: El manual advierte que nunca debe meterse en el carril opuesto porque
    el conductor que viene en sentido contrario podría regresar bruscamente a ese
    carril, arriesgándose a una colisión frontal.
- id: 152
  category: sharing_the_road
  question: ¿Qué significa si una persona que monta a caballo levanta la mano cuando
    usted se acerca?
  choices:
    A: Le están indicando que los pase rápidamente.
    B: Están saludando para reconocer su presencia.
    C: El animal está asustado y usted debe detener su vehículo.
    D: Debe tocar la bocina para advertir al animal.
  answer: C
  explanation: Una mano levantada por una persona que monta a caballo o guía a un
    animal significa que el animal está asustado, y usted debe detener su vehículo
    a menos que detenerse cause una colisión.
- id: 153
  category: safe_driving_rules
  question: Además del tiempo entre la puesta del sol y el amanecer, ¿en qué otro
    momento debe encender sus faros delanteros?
  choices:
    A: Siempre que esté conduciendo en una autopista.
    B: Cuando las condiciones dificulten ver a personas o vehículos a 1,000 pies de
      distancia.
    C: Solo cuando esté usando los limpiaparabrisas.
    D: Cuando la visibilidad se reduzca a 500 pies o menos.
  answer: B
  explanation: Los faros delanteros deben encenderse desde la puesta del sol hasta
    el amanecer, y en cualquier momento en que las condiciones dificulten ver a personas
    o vehículos a 1,000 pies de distancia.
- id: 154
  category: safe_driving_rules
  question: ¿A qué distancia debe bajar las luces altas cuando sigue a otro vehículo?
  choices:
    A: 200 pies
    B: 300 pies
    C: 350 pies
    D: 500 pies
  answer: C
  explanation: Debe bajar sus luces cuando siga a otro vehículo a menos de 350 pies
    para evitar cegar al otro conductor a través de su espejo retrovisor.
- id: 155
  category: defensive_driving
  question: ¿Cómo puede evitar ser cegado por el resplandor de los faros de los vehículos
    que vienen en sentido contrario por la noche?
  choices:
    A: Mire directamente a los faros del vehículo que viene en sentido contrario.
    B: Mire un poco a la derecha de las luces que se aproximan y observe el borde
      de la carretera o la línea de niebla.
    C: Encienda sus luces altas para contrarrestar el resplandor.
    D: Cierre un ojo hasta que pase el vehículo.
  answer: B
  explanation: Para ser menos cegado por el resplandor de los faros por la noche,
    debe mirar un poco a la derecha de las luces que se aproximan y observar el borde
    de la carretera o la línea de niebla.
- id: 156
  category: safe_driving_rules
  question: ¿Qué faros delanteros debe usar cuando conduce en condiciones de niebla,
    polvo o humo?
  choices:
    A: Luces altas
    B: Luces bajas
    C: Solo luces de estacionamiento
    D: Solo luces de emergencia (hazard lights)
  answer: B
  explanation: Si conduce en niebla, polvo, humo o cualquier área de baja visibilidad,
    use los faros en luz baja porque la luz de las luces altas se reflejará y causará
    resplandor.
- id: 157
  category: safe_driving_rules
  question: ¿Qué característica del vehículo NO debe usar cuando conduce en condiciones
    de humedad o sobre nieve y hielo?
  choices:
    A: Limpiaparabrisas
    B: Luces bajas
    C: Desempañador
    D: Control de crucero (cruise control)
  answer: D
  explanation: 'El manual establece explícitamente: "No use el control de crucero
    en condiciones de humedad" y repite esta advertencia para conducir en nieve e
    hielo.'
- id: 158
  category: vehicle_information
  question: ¿Qué debe hacer si sus frenos se mojan después de conducir a través de
    agua?
  choices:
    A: Pise los frenos repetidamente con fuerza para secarlos.
    B: Aplique suavemente los frenos mientras conduce lentamente hasta que comiencen
      a responder.
    C: Ponga el vehículo en punto muerto (neutral) y avance por inercia hasta que
      los frenos se sequen.
    D: Detenga el vehículo inmediatamente y espere a que los frenos se sequen de forma
      natural.
  answer: B
  explanation: Si conduce a través de agua y los frenos se mojan, debe aplicar suavemente
    los frenos mientras conduce lentamente hasta que comiencen a responder.
- id: 159
  category: defensive_driving
  question: ¿Cuándo es probable que una carretera cubierta de nieve o hielo esté más
    resbaladiza?
  choices:
    A: Cuando la temperatura está muy por debajo del punto de congelación.
    B: Cuando la temperatura está cerca del punto de congelación.
    C: Durante las primeras horas de la mañana antes del amanecer.
    D: Cuando el sol brilla directamente sobre el hielo.
  answer: B
  explanation: El manual aconseja a los conductores tener en cuenta que es probable
    que la carretera esté más resbaladiza cuando la temperatura está cerca del punto
    de congelación en lugar de estar por debajo del punto de congelación.
- id: 160
  category: defensive_driving
  question: ¿Cuál es la acción correcta al volante si su vehículo comienza a derrapar?
  choices:
    A: Mantenga el volante perfectamente recto.
    B: Gire el volante en la dirección opuesta al derrape.
    C: Gire el volante en la dirección a la que desea que vaya el vehículo.
    D: Gire el volante bruscamente a la izquierda y a la derecha para recuperar la
      tracción.
  answer: C
  explanation: Si su vehículo comienza a derrapar, debe soltar los frenos y girar
    el volante en la dirección a la que desea que vaya el vehículo.
- id: 161
  category: vehicle_information
  question: ¿Durante qué meses se permiten generalmente los neumáticos con clavos
    en Oregón?
  choices:
    A: Del 1 de octubre al 30 de abril
    B: Del 1 de noviembre al 31 de marzo
    C: Del 1 de diciembre al 28 de febrero
    D: Se permiten durante todo el año.
  answer: B
  explanation: Los neumáticos con clavos generalmente se permiten solo desde el 1
    de noviembre hasta el 31 de marzo en Oregón.
- id: 162
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto al uso de teléfonos celulares para conductores
    menores de 18 años en Oregón?
  choices:
    A: Pueden usar un accesorio de manos libres.
    B: Solo pueden enviar mensajes de texto mientras están detenidos en un semáforo
      en rojo.
    C: Es ilegal usar un teléfono celular u otro dispositivo electrónico móvil mientras
      se opera un vehículo.
    D: Pueden usar un teléfono celular solo para navegación por GPS.
  answer: C
  explanation: El manual establece que es ilegal que los conductores menores de 18
    años usen un teléfono celular u otro dispositivo electrónico móvil mientras operan
    un vehículo.
- id: 163
  category: safe_driving_rules
  question: 'Los conductores de 18 años o más que deseen usar un teléfono celular
    mientras conducen deben:'
  choices:
    A: Mantener el teléfono en su regazo.
    B: Usar un accesorio de manos libres que requiera solo el uso mínimo de un dedo.
    C: Solo usar el teléfono mientras conducen a menos de 30 mph.
    D: Detenerse en el arcén (orilla) para responder cualquier llamada.
  answer: B
  explanation: Los conductores de 18 años o más deben usar un accesorio de manos libres
    para usar un teléfono celular, y este solo debe requerir el uso mínimo de un dedo
    para activar o desactivar el dispositivo.
- id: 164
  category: penalties_and_points
  question: ¿Es ilegal tocar una radio o sistema de sonido tan fuerte que se pueda
    escuchar a qué distancia de su vehículo?
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 200 pies
  answer: B
  explanation: Es ilegal tocar una radio u otro sistema de sonido tan fuerte que se
    pueda escuchar a 50 pies de distancia de su vehículo, ya que es importante poder
    escuchar las bocinas y sirenas.
- id: 165
  category: defensive_driving
  question: ¿Qué debe hacer si se encuentra con un conductor agresivo que muestra
    "furia al volante" (road rage)?
  choices:
    A: Acelerar para alejarse de él.
    B: Tocar la bocina para advertir a otros conductores.
    C: Mantenerse fuera de su camino y no desafiarlo.
    D: Intentar superarlo conduciendo hacia un lugar seguro.
  answer: C
  explanation: Si ve a un conductor agresivo, manténgase fuera de su camino. No lo
    desafíe aumentando la velocidad o intentando superarlo al conducir.
- id: 166
  category: safe_driving_rules
  question: ¿Cuál de las siguientes recomendaciones se da para ayudarle a mantenerse
    despierto mientras conduce?
  choices:
    A: Seguir adelante hasta su destino lo más rápido posible.
    B: Beber agua para prevenir la deshidratación.
    C: Subir el volumen de la radio al nivel máximo.
    D: Mantener la vista fija hacia adelante.
  answer: B
  explanation: Para ayudar a mantenerse despierto, el manual recomienda beber agua,
    ya que la deshidratación puede causar fatiga.
- id: 167
  category: alcohol_drugs_health
  question: 'Según la ley de Oregón, se presume que usted está incapacitado y puede
    ser arrestado por DUII si su concentración de alcohol en la sangre (BAC) es igual
    o superior a:'
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Si su concentración de alcohol en la sangre es de 0.08% o más, la ley
    de Oregón presume que usted está incapacitado.
- id: 168
  category: alcohol_drugs_health
  question: ¿Qué significa la ley de Consentimiento Implícito (Implied Consent) de
    Oregón?
  choices:
    A: Usted consiente el registro del vehículo si lo detienen.
    B: Usted acepta someterse a una prueba de aliento, sangre u orina cuando se lo
      pida un oficial de policía.
    C: Usted se declara automáticamente culpable si es arrestado por DUII.
    D: Usted consiente pagar todas las multas asociadas con las infracciones de tráfico.
  answer: B
  explanation: La ley de Consentimiento Implícito de Oregón significa que, al conducir
    un vehículo motorizado, usted ha aceptado que se someterá a una prueba de aliento,
    sangre u orina cuando se lo pida un oficial de policía.
- id: 169
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, reprobará una prueba de alcohol en la sangre
    si su concentración de alcohol en la sangre es:'
  choices:
    A: 0.02% o más
    B: 0.05% o más
    C: 0.08% o más
    D: Cualquier cantidad
  answer: D
  explanation: Si es menor de 21 años, reprobará la prueba si tiene cualquier cantidad
    de alcohol en la sangre debido a la ley de tolerancia cero de Oregón.
- id: 170
  category: alcohol_drugs_health
  question: De acuerdo con la ley de Contenedor Abierto (Open Container) de Oregón,
    ¿dónde deben guardarse las botellas o recipientes de alcohol abiertos en el vehículo?
  choices:
    A: En la guantera
    B: Debajo del asiento del conductor
    C: En el maletero (cajuela)
    D: En el piso del asiento trasero
  answer: C
  explanation: La ley de Contenedor Abierto de Oregón establece que cualquier botella
    o recipiente abierto debe estar en el maletero.
- id: 171
  category: safe_driving_rules
  question: ¿La ley de Oregón prohíbe que cualquier persona menor de qué edad viaje
    en el capó, el guardabarros o en la caja de una camioneta (pickup)?
  choices:
    A: 16 años de edad
    B: 18 años de edad
    C: 21 años de edad
    D: No hay límite de edad; es ilegal para todos.
  answer: B
  explanation: La ley de Oregón prohíbe que cualquier persona menor de 18 años viaje
    en el capó, el guardabarros, el estribo u otra parte externa de un vehículo, incluida
    la caja de una camioneta (pickup).
- id: 172
  category: defensive_driving
  question: ¿Qué es lo primero que debe hacer si se le revienta un neumático mientras
    conduce?
  choices:
    A: Frenar a fondo inmediatamente.
    B: Sujetar el volante con firmeza.
    C: Poner el vehículo en punto muerto (neutral).
    D: Encender las luces de emergencia.
  answer: B
  explanation: Si se le revienta un neumático, el manual le indica que primero sujete
    el volante con firmeza, luego reduzca la velocidad gradualmente y salga de la
    carretera.
- id: 173
  category: defensive_driving
  question: Si sus frenos dejan de funcionar mientras conduce, ¿cuál de las siguientes
    acciones debe tomar?
  choices:
    A: Cambiar a una marcha más alta.
    B: Apagar el motor inmediatamente.
    C: Bombear los frenos para aumentar la presión.
    D: Tirar del freno de mano lo más rápido posible.
  answer: C
  explanation: Si sus frenos fallan, debe bombear los frenos. Esto puede generar suficiente
    presión para que vuelvan a funcionar.
- id: 174
  category: defensive_driving
  question: ¿Qué debe hacer si el acelerador de su vehículo se queda trabado?
  choices:
    A: Poner el vehículo en punto muerto (neutral) usando la palma de la mano abierta.
    B: Apagar el encendido inmediatamente.
    C: Bombear el pedal del acelerador rápidamente.
    D: Cambiar a reversa.
  answer: A
  explanation: Si su acelerador se queda trabado, debe buscar una vía de escape y
    poner el vehículo en punto muerto (neutral) usando la palma de la mano abierta
    para evitar cambiar a otra marcha accidentalmente.
- id: 175
  category: vehicle_information
  question: ¿Cuál de las siguientes es una técnica recomendada para mejorar el rendimiento
    de la gasolina y ahorrar combustible?
  choices:
    A: Realizar arranques rápidos y paradas repentinas.
    B: Dejar el motor en ralentí para mantenerlo caliente.
    C: Conducir de manera constante y evitar exceder los límites de velocidad establecidos.
    D: Realizar múltiples viajes por separado para hacer mandados.
  answer: C
  explanation: Para mejorar el rendimiento de la gasolina o ahorrar combustible, el
    manual recomienda conducir de manera constante y evitar exceder los límites de
    velocidad establecidos.
- id: 176
  category: safe_driving_rules
  question: ¿Qué debe hacer si recibe un mensaje de texto en su teléfono celular mientras
    conduce?
  choices:
    A: Leer y responder al mensaje rápidamente.
    B: Ignorar el mensaje hasta que se detenga en un área de estacionamiento segura.
    C: Hacer que un pasajero se lo lea mientras usted escribe.
    D: Reducir la velocidad y leerlo mientras mantiene un ojo en la carretera.
  answer: B
  explanation: El manual establece que si recibe un mensaje de texto en su teléfono
    celular mientras conduce, debe ignorar el mensaje hasta que se detenga en un área
    de estacionamiento segura.
- id: 177
  category: license_system
  question: ¿Un privilegio de conducción no comercial de Clase C le permite conducir
    un vehículo de no más de cuántas libras?
  choices:
    A: 10,000 libras
    B: 16,000 libras
    C: 26,000 libras
    D: 33,000 libras
  answer: C
  explanation: Un privilegio de conducción no comercial de Clase C le permite conducir
    un vehículo de no más de 26,000 libras que esté exento de los requisitos de licencia
    de conducir comercial (CDL) o de endoso de motocicleta.
- id: 178
  category: license_system
  question: ¿Cuál es la edad mínima requerida para solicitar un permiso de instrucción
    en Oregón?
  choices:
    A: 14 años de edad
    B: 15 años de edad
    C: 16 años de edad
    D: 18 años de edad
  answer: B
  explanation: Para calificar para un privilegio de conducción no comercial de Clase
    C, debe tener al menos 15 años de edad para solicitar un permiso de instrucción.
- id: 179
  category: license_system
  question: ¿Cuántas horas de experiencia de conducción supervisada se requieren para
    un solicitante menor de 18 años que NO ha tomado un curso de educación de seguridad
    vial aprobado por el ODOT?
  choices:
    A: 40 horas
    B: 50 horas
    C: 80 horas
    D: 100 horas
  answer: D
  explanation: Los solicitantes menores de 18 años deben tener 100 horas de experiencia
    de conducción supervisada, o 50 horas de experiencia de conducción supervisada
    si han tomado un curso de educación de seguridad vial aprobado por el ODOT.
- id: 180
  category: license_system
  question: 'Para que cuente para su experiencia de conducción requerida, su conductor
    supervisor debe tener al menos 21 años y haber tenido privilegios de conducción
    válidos durante al menos:'
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 5 años
  answer: C
  explanation: Su experiencia de conducción solo cuenta si es supervisada por alguien
    de al menos 21 años de edad que haya tenido privilegios de conducción válidos
    durante al menos 3 años.
- id: 181
  category: license_system
  question: ¿Cuál de las siguientes opciones NO está permitida al tomarse la foto
    para un privilegio de conducción de Oregon?
  choices:
    A: Sonreír
    B: Usar un audífono
    C: Usar anteojos
    D: Tener el cabello recogido
  answer: C
  explanation: No se permiten sombreros, anteojos, pintura u otras sustancias temporales
    en la cara, ni lentes de contacto que cambien la apariencia del ojo al tomarse
    la foto.
- id: 182
  category: license_system
  question: ¿Cuál de los siguientes es un documento aceptable para demostrar su identidad
    y fecha de nacimiento?
  choices:
    A: Un certificado de nacimiento emitido por un hospital
    B: Un registro de bautismo
    C: Un pasaporte de EE. UU. vencido hace 10 años
    D: Un certificado de nacimiento emitido por el gobierno de EE. UU.
  answer: D
  explanation: Las pruebas aceptables incluyen un certificado de nacimiento emitido
    por el gobierno de EE. UU. Los certificados de nacimiento emitidos por hospitales
    y los registros de bautismo no son aceptables, y los pasaportes no pueden estar
    vencidos por más de 5 años.
- id: 183
  category: license_system
  question: ¿Cuál de las siguientes es una prueba aceptable de su dirección de residencia
    actual?
  choices:
    A: Correo personal de un amigo
    B: Correo reenviado
    C: Una orden de conexión o factura de servicios públicos
    D: Una suscripción a una revista sin su apellido
  answer: C
  explanation: Las pruebas de dirección comunes incluyen una orden de conexión de
    servicios públicos, una factura, un documento hipotecario o una declaración de
    impuestos sobre la propiedad. El correo personal y el correo reenviado no son
    aceptables.
- id: 184
  category: license_system
  question: ¿Qué prueba se requiere para agregar la designación de "Sordo o con dificultades
    auditivas" a su licencia o permiso?
  choices:
    A: Una nota del médico
    B: Un audiograma de un especialista certificado
    C: Un formulario firmado por un juez
    D: No se requiere ninguna prueba
  answer: D
  explanation: Puede solicitar que el DMV agregue una designación de sordo o con dificultades
    auditivas en su licencia o permiso. No se requiere ninguna prueba.
- id: 185
  category: vehicle_information
  question: ¿Cuál es la cobertura mínima de seguro requerida para daños a la propiedad
    por colisión en Oregon?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: La ley de Oregon requiere un seguro mínimo de $20,000 por colisión
    para daños a la propiedad de terceros.
- id: 186
  category: driver_responsibility
  question: Si usted está involucrado en una colisión sin heridos, ¿qué debe hacer
    con su vehículo?
  choices:
    A: Dejarlo exactamente donde está hasta que llegue la policía.
    B: Moverlo fuera de los carriles de circulación tan pronto como sea posible de
      manera segura.
    C: Conducirlo a casa de inmediato y llamar a la policía más tarde.
    D: Abandonar el vehículo y caminar hasta el teléfono más cercano.
  answer: B
  explanation: Si no hay heridos y los vehículos se pueden mover de manera segura,
    debe moverlos fuera de los carriles de circulación lo antes posible.
- id: 187
  category: driver_responsibility
  question: 'Debe presentar un informe de colisión ante el DMV dentro de las 72 horas
    si el daño a cualquier vehículo es superior a $2,500 y:'
  choices:
    A: La colisión ocurrió de noche.
    B: El otro conductor no tiene seguro.
    C: Cualquier vehículo es remolcado de la escena debido a los daños.
    D: El límite de velocidad era superior a 55 mph.
  answer: C
  explanation: Debe presentar un informe de colisión dentro de las 72 horas si el
    daño a cualquier vehículo es superior a $2,500 y cualquier vehículo es remolcado
    de la escena debido a los daños de la colisión.
- id: 188
  category: driver_responsibility
  question: ¿Qué debe hacer si choca contra un vehículo desocupado y no puede encontrar
    al propietario?
  choices:
    A: Abandonar la escena de inmediato ya que nadie resultó herido.
    B: Esperar junto al vehículo hasta una hora antes de irse.
    C: Dejar una nota con su nombre, dirección y una breve descripción de lo que sucedió.
    D: Llamar a una grúa para retirar el vehículo dañado.
  answer: C
  explanation: Si choca contra un vehículo desocupado y no puede encontrar al propietario,
    deje una nota con su nombre y dirección, junto con una breve descripción de lo
    que sucedió.
- id: 189
  category: penalties_and_points
  question: ¿Cuál de las siguientes es una razón por la que puede perder sus privilegios
    de conducción en Oregon?
  choices:
    A: No informar de una colisión de vehículos.
    B: Recibir una sola multa de estacionamiento.
    C: Conducir un vehículo de más de 20 años.
    D: Olvidar su licencia en casa.
  answer: A
  explanation: Las razones por las que puede perder su privilegio de conducir incluyen
    no informar de una colisión de vehículos, conducir sin seguro y conducir bajo
    la influencia.
- id: 190
  category: penalties_and_points
  question: ¿Qué programa está asociado con la pérdida de su privilegio de conducir
    debido a demasiadas condenas de tráfico?
  choices:
    A: Sistema de Rehabilitación de Tráfico
    B: Iniciativa de Conductor Seguro
    C: Programa de Mejora del Conductor (Driver Improvement Program)
    D: Programa de Reducción de Condenas
  answer: C
  explanation: El manual establece que usted puede perder su privilegio de conducir
    por demasiadas condenas de tráfico bajo el Programa de Mejora del Conductor (Driver
    Improvement Program).
- id: 191
  category: alcohol_drugs_health
  question: ¿Conducir bajo la influencia de cuál de los siguientes puede resultar
    en la pérdida de su privilegio de conducir?
  choices:
    A: Solo alcohol
    B: Solo drogas
    C: Solo medicamentos recetados
    D: Alcohol, drogas o inhalantes
  answer: D
  explanation: Usted puede perder su privilegio de conducir por conducir bajo la influencia
    de alcohol, drogas o inhalantes.
- id: 192
  category: penalties_and_points
  question: 'Usted puede perder su privilegio de conducir si no cumple con:'
  choices:
    A: Citaciones para ser jurado
    B: Multas judiciales
    C: Recordatorios de renovación del registro del vehículo
    D: Reglas de la asociación de vecinos
  answer: B
  explanation: El incumplimiento de las multas judiciales figura como una razón por
    la que puede perder su privilegio de conducir.
- id: 193
  category: penalties_and_points
  question: Según el manual, ¿conducir sin qué tipo de protección financiera puede
    causar que pierda su privilegio de conducir?
  choices:
    A: Cobertura contra todo riesgo (comprehensive)
    B: Cobertura de automovilista sin seguro
    C: Seguro (conducir sin seguro)
    D: Asistencia en carretera
  answer: C
  explanation: Conducir sin seguro es una de las razones por las que puede perder
    su privilegio de conducir.
- id: 194
  category: driver_responsibility
  question: Si sospecha que alguien podría ser víctima de trata de personas y ve un
    delito en curso, ¿qué debe hacer primero?
  choices:
    A: Acercarse al traficante para intervenir
    B: Llamar al 911
    C: Seguir al vehículo hasta su destino
    D: Publicarlo en las redes sociales
  answer: B
  explanation: Si sospecha que alguien podría ser víctima de trata de personas y está
    presenciando un delito en curso, el manual le indica que llame al 911.
- id: 195
  category: driver_responsibility
  question: 'Al reportar una pista sobre una sospecha de trata de personas, debe proporcionar
    "información útil" (actionable information) como:'
  choices:
    A: Su historial de manejo personal
    B: El historial financiero de la víctima
    C: Descripciones de autos, placas y personas involucradas
    D: El número de registro de su vehículo
  answer: C
  explanation: La información útil incluye horas, fechas, ubicación, descripciones
    de los autos o camiones involucrados (marca, modelo, color, placa) y descripciones
    de las personas.
- id: 196
  category: driver_responsibility
  question: ¿Por qué el manual aconseja no acercarse a sospechosos de trata de personas?
  choices:
    A: Es ilegal que los civiles hablen con los traficantes
    B: Es peligroso y podría causar problemas en el procesamiento judicial de los
      traficantes
    C: Los traficantes suelen pedirle dinero
    D: Podría darles direcciones por accidente
  answer: B
  explanation: Acercarse a los traficantes no solo es peligroso para usted y sus víctimas,
    sino que podría causar problemas en el eventual procesamiento judicial de los
    traficantes.
- id: 197
  category: driver_responsibility
  question: 'Según el manual, un menor que es vendido para el comercio sexual es:'
  choices:
    A: Solo se considera víctima si pide ayuda
    B: No se considera víctima si fue reclutado por internet
    C: Siempre una víctima de trata de personas
    D: Atendido por la oficina local del DMV
  answer: C
  explanation: 'El manual establece explícitamente: "Un menor que es vendido para
    el comercio sexual es siempre una víctima de trata de personas".'
- id: 198
  category: alcohol_drugs_health
  question: ¿A qué número debe llamar para reportar conductores ebrios?
  choices:
    A: 503-945-5000
    B: 503-299-9999
    C: '711'
    D: '911'
  answer: D
  explanation: La sección de Información de Contacto Importante indica el 911 como
    el número para Reportar Conductores Ebrios.
- id: 199
  category: safe_driving_rules
  question: ¿Dónde puede encontrar información sobre las carreteras de Oregón según
    el manual?
  choices:
    A: OregonDMV.com
    B: TripCheck.com
    C: La aplicación TAT
    D: La oficina de Registros Vitales
  answer: B
  explanation: La sección de Información de Contacto Importante indica TripCheck.com
    para obtener información sobre las carreteras.
- id: 200
  category: license_system
  question: Si necesita comunicarse con el DMV desde fuera del área de Portland, ¿qué
    número debe usar?
  choices:
    A: 503-299-9999
    B: 503-945-5000
    C: 971-673-1190
    D: 1-888-3737-888
  answer: B
  explanation: El número de contacto del DMV fuera del área de Portland es 503-945-5000.
- id: 201
  category: license_system
  question: ¿Qué servicio está disponible en todo el estado para que las personas
    sordas o con dificultades auditivas se comuniquen con el DMV?
  choices:
    A: TripCheck.com
    B: Statewide Relay 711
    C: La Línea Nacional contra la Trata de Personas
    D: Equipo de No Discriminación de ODOT
  answer: B
  explanation: El manual enumera 'TDD (personas sordas o con dificultades auditivas).......................Statewide
    Relay 711' en la información de contacto.
- id: 202
  category: driver_responsibility
  question: ¿Qué aplicación recomienda descargar el manual para identificar señales
    de alerta de trata de personas?
  choices:
    A: La aplicación TripCheck
    B: La aplicación TAT
    C: La aplicación ODOT
    D: La aplicación DMV Now
  answer: B
  explanation: 'El manual aconseja: ''Para conocer las señales de alerta de la trata
    de personas y obtener más información, descargue la aplicación TAT hoy mismo''.'
- id: 203
  category: license_system
  question: Si necesita información sobre un certificado de nacimiento de Oregón,
    ¿con qué oficina debe comunicarse?
  choices:
    A: Programa de Mejora del Conductor
    B: Equipo de No Discriminación de ODOT
    C: Registros Vitales (Vital Records)
    D: Programas para Conductores del DMV
  answer: C
  explanation: El manual enumera Registros Vitales de Oregón (Información sobre certificados
    de nacimiento) al 971-673-1190.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y continúe con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de ALTO (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el paso de peatones o antes de entrar en la
    intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 204
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el paso al tráfico y a los peatones. Debe
    detenerse si es necesario para permitir que otros pasen de forma segura.
  id: 205
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una calle de un solo sentido o en una rampa
    de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de forma segura.
  id: 206
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer un giro en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten giros a la izquierda en esta intersección.
  id: 207
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 208
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 209
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o un cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 210
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se aproxima un
    tren, debe detenerse.
  id: 211
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro brusco que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro brusco (con una flecha más angulada) indica un giro
    más cerrado que una señal de curva. Es necesario reducir la velocidad de forma
    más significativa antes de este giro.
  id: 212
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: Fin de la carretera
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico en sentidos
    opuestos. Manténgase a la derecha.
  id: 213
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de matrícula de estacionamiento para personas con discapacidad
    vigente pueden estacionar en estos espacios. Las infracciones conllevan multas
    elevadas.
  id: 214
- id: 215
  category: license_system
  question: Además de una licencia de Oregon que cumpla con la ley REAL ID, ¿cuál
    de las siguientes se enumera como una forma aceptable de identificación para que
    un adulto aborde un vuelo comercial en los EE. UU.?
  choices:
    A: Una tarjeta de crédito con foto
    B: Una tarjeta de identificación de estudiante
    C: Un pasaporte emitido por un gobierno extranjero
    D: Una licencia de conducir de Oregon estándar, que no sea REAL ID
  answer: C
  explanation: 'El manual establece: ''Las identificaciones aceptables adicionales
    incluyen, entre otras: ... Pasaporte emitido por un gobierno extranjero''. Una
    licencia estándar, que no sea REAL ID, ya no se acepta para este propósito.'
- id: 221
  category: vehicle_information
  question: ¿Según el Índice, dónde puede encontrar consejos sobre cómo mejorar el
    rendimiento de combustible de su vehículo?
  choices:
    A: Fallas en el equipo del vehículo
    B: Condiciones peligrosas
    C: Técnicas de ahorro de combustible
    D: Servicios adicionales
  answer: C
  explanation: El Índice en la página vi enumera 'Técnicas de ahorro de combustible'
    como un tema bajo la sección 'Conducción segura y responsable'.
- id: 222
  category: penalties_and_points
  question: Si desea comprender las razones por las que se le podrían retirar sus
    privilegios de conducir, ¿qué sección del manual debe leer?
  choices:
    A: Exámenes
    B: Pérdida de privilegios de conducir
    C: Responsabilidad del conductor
    D: Colisiones de tráfico
  answer: B
  explanation: El Índice en la página vi enumera 'Pérdida de privilegios de conducir'
    como un encabezado de tema principal cerca del final del manual.
- id: 223
  category: driver_responsibility
  question: En el 'Mensaje importante para los conductores', ¿qué se describe como
    el peor de los casos por elegir conducir de manera descuidada o bajo los efectos
    de sustancias?
  choices:
    A: Recibir una multa de tráfico
    B: Que aumenten las tarifas de su seguro
    C: Causar su propia muerte o la de otra persona
    D: Pagar una multa elevada
  answer: C
  explanation: 'El manual establece en la página vii: ''En el peor de los casos, puede
    perder la vida o causar la muerte de otra persona, incluida la de un ser querido''.'
- id: 224
  category: driver_responsibility
  question: 'El mensaje introductorio del Administrador del DMV enfatiza que todos
    en la vía tienen la responsabilidad compartida de:'
  choices:
    A: Conducir lo más rápido posible para reducir la congestión
    B: Usar un teléfono celular solo cuando el tráfico sea ligero
    C: Estar atento, obedecer las leyes de tránsito y compartir la vía
    D: Ceder el paso a los vehículos que se mueven más rápido en todo momento
  answer: C
  explanation: 'El mensaje en la página vii establece: ''Cada uno de nosotros tiene
    la responsabilidad... de elegir estar atento, obedecer las leyes de tránsito y
    compartir la vía con otros conductores, personas que andan en bicicleta y aquellos
    que caminan y se desplazan''.'
- id: 225
  category: license_system
  question: 'En Oregón, se requiere poseer un privilegio de conducir válido para operar
    un vehículo motorizado en:'
  choices:
    A: Solo autopistas
    B: Solo propiedad privada
    C: Autopistas o recintos abiertos al público
    D: Cualquier camino excepto entradas privadas
  answer: C
  explanation: 'El manual establece en la página 1: ''Para operar un vehículo motorizado
    en autopistas o recintos abiertos al público en Oregón, debe poseer un privilegio
    de conducir válido''.'
- id: 226
  category: driver_testing
  question: ¿A dónde le dirige el manual para encontrar la información más actualizada
    sobre las tarifas del DMV, los horarios de oficina y la programación de exámenes
    de manejo?
  choices:
    A: La última página del manual
    B: El sitio web principal del Departamento de Transporte de Oregón
    C: Llamando a la oficina del Gobernador
    D: El sitio web oficial del DMV, OregonDMV.com
  answer: D
  explanation: 'El manual establece en la página 1: ''Para obtener información actualizada
    sobre requisitos, tarifas, programación de exámenes de manejo y horarios de oficina,
    visite OregonDMV.com''.'
- id: 227
  category: license_system
  question: Para personas de 18 años o más, ¿cuál de los siguientes se enumera como
    una forma de identificación aceptada federalmente para abordar un vuelo comercial
    en los EE. UU.?
  choices:
    A: Un certificado de nacimiento
    B: Una tarjeta de Residente Permanente
    C: Una tarjeta de Seguro Social
    D: Un carné de biblioteca con foto
  answer: B
  explanation: El manual en la página ii enumera la 'tarjeta de Residente Permanente'
    como una identificación aceptable para volar.
- id: 228
  category: driver_responsibility
  question: ¿Según el Índice, dónde encontraría información sobre el seguro obligatorio
    del vehículo y qué hacer después de una colisión de tráfico?
  choices:
    A: Conducción segura y responsable
    B: Cómo solicitar
    C: Las secciones 'Seguro obligatorio' y 'Colisiones de tráfico'
    D: Pérdida de privilegios de conducir
  answer: C
  explanation: El Índice en la página vi enumera 'Seguro obligatorio' y 'Colisiones
    de tráfico' como encabezados de temas específicos y separados.
- id: 229
  category: signs_and_signals
  question: ¿Según el Índice, en qué sección se encuentra la información sobre señales
    de tráfico y semáforos específicos?
  choices:
    A: Viaje por el carril
    B: Señales y semáforos
    C: Marcas en el pavimento
    D: Zonas de obras
  answer: B
  explanation: El Índice en la página v indica claramente una sección principal titulada
    'Señales y semáforos' que contiene subsecciones para 'Señales' y 'Semáforos'.
- id: 230
  category: driver_testing
  question: Si reprueba el examen de conocimientos en línea cuatro veces, ¿cuál es
    el siguiente paso que debe tomar?
  choices:
    A: Debe esperar 90 días antes de intentar el examen nuevamente.
    B: Debe completar un curso de educación vial aprobado por el ODOT.
    C: Debe programar y realizar cualquier intento futuro en una oficina del DMV.
    D: Puede realizar el examen en línea dos veces más después de un período de espera
      de 24 horas.
  answer: C
  explanation: 'El manual establece: ''Después de cuatro intentos, debe realizar el
    examen en una oficina del DMV''.'
- id: 231
  category: driver_testing
  question: ¿Bajo qué condición puede el DMV eximir el examen de manejo para un nuevo
    residente de Oregon?
  choices:
    A: Si ha tenido una licencia de conducir válida de cualquier país durante al menos
      cinco años.
    B: Si entrega una licencia de otro estado que sea válida o haya expirado hace
      menos de un año.
    C: Si tiene más de 25 años de edad y tiene un historial de manejo limpio.
    D: Si aprueba el examen de conocimientos con una puntuación perfecta en el primer
      intento.
  answer: B
  explanation: El manual establece que el DMV puede eximir el examen de manejo si
    'Usted es un nuevo residente que entrega una licencia de otro estado que es válida
    o ha expirado hace menos de un año'.
- id: 232
  category: driver_testing
  question: Al realizar un examen de conocimientos en una oficina del DMV, ¿qué se
    le permite traer para asistencia de audio?
  choices:
    A: Un traductor personal para leer las preguntas en voz alta.
    B: Únicamente un dispositivo de audio proporcionado por el DMV.
    C: Sus propios auriculares o audífonos.
    D: Un teléfono inteligente con una aplicación de texto a voz.
  answer: C
  explanation: El manual establece que para los exámenes de conocimientos en la oficina,
    'Puede traer sus propios auriculares o audífonos para el examen'.
- id: 233
  category: penalties_and_points
  question: ¿Cuál de las siguientes acciones se define específicamente como hacer
    trampa en un examen de conocimientos, lo que resulta en reprobación y una restricción
    de 90 días para volver a realizarlo?
  choices:
    A: Pedirle al examinador que aclare una pregunta.
    B: Usar un diccionario de traducción de idiomas extranjeros en papel con permiso.
    C: Tomar notas o permitir que otra persona realice el examen por usted.
    D: No completar el examen dentro del tiempo asignado.
  answer: C
  explanation: 'El manual enumera varias acciones consideradas como trampa, incluyendo:
    ''hablar, escribir o tomar notas, usar el teléfono celular, operar cualquier dispositivo
    electrónico o permitir que otra persona realice el examen por usted''.'
- id: 234
  category: signs_and_signals
  question: ¿Cuál es la forma y el significado de una señal de CEDA EL PASO (YIELD)?
  choices:
    A: 'Octágono: Debe detenerse por completo antes de continuar.'
    B: 'Triángulo: Debe reducir la velocidad, ceder el paso y detenerse si es necesario.'
    C: 'Cuadrado: Va por el camino equivocado y debe dar la vuelta.'
    D: 'Círculo: Se está acercando a un cruce de ferrocarril y debe buscar trenes.'
  answer: B
  explanation: 'El manual describe la señal de Ceda el Paso como un ''Triángulo: Esta
    señal significa que debe reducir la velocidad y ceder el paso. Si es necesario,
    deténgase de la misma manera que lo haría ante una señal de alto''.'
- id: 235
  category: signs_and_signals
  question: ¿Qué indica una señal con un círculo rojo y una línea diagonal?
  choices:
    A: La acción mostrada es recomendada pero no obligatoria.
    B: Se está acercando a un peligro y debe reducir la velocidad.
    C: La carretera adelante está cerrada a todo el tráfico.
    D: No debe realizar la acción que se muestra en la señal.
  answer: D
  explanation: 'El manual establece: ''Cuando vea una señal con un círculo rojo y
    una línea diagonal, significa que no debe realizar el giro que se muestra''.'
- id: 236
  category: vehicle_information
  question: Si las condiciones climáticas lo requieren para su examen de manejo, ¿cuál
    de los siguientes conjuntos de equipo debe tener su vehículo?
  choices:
    A: Alfombrillas para todo clima y un botiquín de primeros auxilios.
    B: Un raspador de hielo y bengalas de emergencia.
    C: Llantas de tracción o cadenas, y un desempañador de ventanas que funcione.
    D: Un sistema de navegación GPS y una funda para el auto.
  answer: C
  explanation: 'El manual especifica: ''Si las condiciones climáticas lo requieren,
    su vehículo debe tener llantas de tracción o cadenas, limpiaparabrisas, faros
    delanteros, luces traseras y un desempañador de ventanas''.'
- id: 237
  category: driver_testing
  question: ¿Cuál es una posible desventaja de utilizar un examinador de manejo externo
    (Third Party) certificado en lugar del DMV?
  choices:
    A: El examen es significativamente más difícil.
    B: Los costos del examen pueden ser mayores.
    C: Los resultados no son reconocidos por el DMV.
    D: Tienen menos horarios de citas disponibles.
  answer: B
  explanation: El manual señala que, aunque los examinadores externos pueden ofrecer
    más flexibilidad en la programación, 'Sin embargo, los costos del examen pueden
    ser mayores al usar un examinador externo'.
- id: 238
  category: signs_and_signals
  question: ¿De qué le advierte principalmente una señal de 'No Entrar' (Do Not Enter)?
  choices:
    A: La carretera adelante está en construcción.
    B: El camino es una entrada privada.
    C: Está a punto de entrar en una calle de un solo sentido en la dirección equivocada.
    D: La carretera está cerrada temporalmente debido a un accidente.
  answer: C
  explanation: 'El manual establece: ''No Entrar (Do Not Enter) – Cuadrado: Esta señal
    le advierte que no entre en una carretera o autopista. Verá esta señal si va en
    la dirección equivocada''.'
- id: 239
  category: driver_testing
  question: ¿Cuál es la cantidad mínima de tiempo recomendada con la que debe programar
    un examen de manejo por adelantado?
  choices:
    A: Una semana.
    B: Dos semanas.
    C: Tres semanas.
    D: Cuatro semanas.
  answer: C
  explanation: 'El manual aconseja: ''Es una buena idea programar con un mínimo de
    tres semanas de anticipación a la fecha en que desea realizar su examen''.'
- id: 240
  category: vehicle_information
  question: 'Para que un vehículo sea aceptable para un examen de manejo, el asiento
    del pasajero debe estar:'
  choices:
    A: Equipado con ajustes electrónicos y calefacción.
    B: Cubierto de cuero o un material similar.
    C: Adecuado, seguro y razonablemente limpio.
    D: Vacío, sin objetos sobre él o a su alrededor.
  answer: C
  explanation: La lista de verificación del equipo del vehículo para el examen de
    manejo incluye 'Asiento del pasajero adecuado, seguro y razonablemente limpio'.
- id: 241
  category: driver_testing
  question: ¿Qué debe hacer antes de poder realizar cualquier examen en el DMV?
  choices:
    A: Programar una cita con al menos una semana de antelación.
    B: Pagar la tarifa del examen y presentar prueba de identidad, fecha de nacimiento
      y dirección.
    C: Completar un cuestionario de preselección en línea.
    D: Entregar cualquier identificación de otro estado que pueda tener.
  answer: B
  explanation: 'El manual establece: ''Cada vez que realice un examen, primero debe
    pagar la tarifa del examen y presentar prueba de identidad, fecha de nacimiento
    y dirección de residencia actual''.'
- id: 242
  category: signs_and_signals
  question: ¿Qué indica una señal de 'Manténgase a la derecha' (Keep Right)?
  choices:
    A: Debe girar a la derecha en la próxima intersección.
    B: El tráfico más lento debe permanecer en el carril derecho.
    C: Hay una isla de tráfico, mediana u obstrucción más adelante, y debe mantenerse
      a la derecha de la misma.
    D: La carretera más adelante tiene una curva hacia la derecha.
  answer: C
  explanation: 'El manual establece que una señal de ''Manténgase a la derecha'' significa:
    ''Una isla de tráfico, mediana u obstrucción divide la carretera más adelante.
    Manténgase a la derecha''.'
- id: 243
  category: signs_and_signals
  question: Cuando se aproxima a una intersección con una señal de 'No girar en rojo'
    (No Turn on Red), ¿qué debe hacer?
  choices:
    A: Puede girar a la derecha después de detenerse si no hay peatones presentes.
    B: Debe esperar a que la señal cambie a verde antes de girar.
    C: Puede girar a la izquierda desde una calle de sentido único hacia otra calle
      de sentido único.
    D: Puede girar después de ceder el paso a todo el tráfico transversal.
  answer: B
  explanation: 'El manual especifica para una señal de ''No girar en rojo'': ''No
    puede girar durante la luz roja. Debe esperar a que la señal cambie a verde''.'
- id: 244
  category: signs_and_signals
  question: ¿Qué significa una señal de 'Giro a la izquierda ceda el paso en verde'
    (Left Turn Yield on Green)?
  choices:
    A: Usted tiene el derecho de paso para girar a la izquierda con luz verde.
    B: El tráfico que viene en sentido contrario debe cederle el paso cuando usted
      esté girando a la izquierda.
    C: En una señal circular verde, debe ceder el paso al tráfico que viene en sentido
      contrario y a los peatones antes de girar a la izquierda.
    D: Solo puede girar a la izquierda cuando tenga una flecha verde.
  answer: C
  explanation: 'El manual establece que esta señal significa: ''En una señal circular
    verde, ceda el derecho de paso al tráfico que viene en sentido contrario y a los
    peatones hasta que sea seguro girar''.'
- id: 245
  category: signs_and_signals
  question: Si ve una señal de 'Deténgase aquí para los peatones' (Stop Here for Pedestrians)
    en un cruce peatonal, ¿dónde debe detenerse cuando hay un peatón presente?
  choices:
    A: Al menos 20 pies antes del cruce peatonal.
    B: En la línea de parada.
    C: En cualquier lugar antes del cruce peatonal que proporcione una buena visibilidad.
    D: Solo si el peatón está en su mitad de la carretera.
  answer: B
  explanation: 'El manual indica: ''Deténgase en la línea de parada cuando un peatón
    esté en el cruce peatonal''.'
- id: 246
  category: signs_and_signals
  question: 'Una señal de ''Camino sinuoso'' (Winding Road) le advierte que:'
  choices:
    A: La carretera más adelante es resbaladiza cuando está mojada.
    B: Hay un giro brusco inmediatamente adelante.
    C: La carretera contiene una serie de giros o curvas.
    D: La carretera más adelante curva a la derecha y luego a la izquierda.
  answer: C
  explanation: El manual define una señal de 'Camino sinuoso' como indicadora de que
    'la carretera contiene una serie de giros o curvas'.
- id: 247
  category: signs_and_signals
  question: ¿Qué acción debe tomar un conductor cuando ve una señal de 'Reducción
    de carril' (Lane Reduction)?
  choices:
    A: Detenerse por completo antes de continuar.
    B: Acelerar para adelantarse al tráfico en el otro carril.
    C: Incorporarse al carril continuo ya que su carril terminará pronto.
    D: Salir de la autopista inmediatamente.
  answer: C
  explanation: 'El manual establece para una señal de ''Reducción de carril'': ''El
    carril indicado termina pronto. Los vehículos en ese carril deben incorporarse
    al carril continuo''.'
- id: 248
  category: signs_and_signals
  question: ¿De qué le advierte la señal de 'Tráfico de doble sentido más adelante'
    (Two-Way Traffic Ahead)?
  choices:
    A: Se encuentra en una carretera dividida que está a punto de terminar.
    B: La carretera de un solo sentido en la que se encuentra está a punto de unirse
      a una carretera de doble sentido.
    C: Se le permite rebasar a otros vehículos.
    D: Hay un carril de incorporación más adelante.
  answer: B
  explanation: 'El manual explica que una señal de ''Tráfico de doble sentido más
    adelante'' significa: ''La carretera de un solo sentido se une a una carretera
    de doble sentido más adelante. Se enfrentará al tráfico que viene en sentido contrario''.'
- id: 249
  category: signs_and_signals
  question: ¿Cuál es la advertencia principal que proporciona una señal de 'Poca altura
    libre' (Low Clearance)?
  choices:
    A: La carretera más adelante tiene una pendiente pronunciada.
    B: El paso elevado más adelante es bajo y su vehículo puede ser demasiado alto
      para pasar por debajo.
    C: Hay un cruce de ferrocarril más adelante.
    D: El límite de velocidad se reduce más adelante.
  answer: B
  explanation: 'El manual establece que una señal de ''Poca altura libre'' significa:
    ''El paso elevado más adelante tiene poca altura libre. No continúe si su vehículo
    es demasiado alto para pasar por debajo''.'
- id: 250
  category: signs_and_signals
  question: 'Una señal de ''Resbaladizo cuando está mojado'' (Slippery When Wet) significa:'
  choices:
    A: Siempre debe conducir por debajo del límite de velocidad en esta área.
    B: El pavimento es inusualmente resbaladizo cuando está mojado.
    C: La carretera es propensa a inundaciones durante lluvias intensas.
    D: Debe encender sus luces de emergencia cuando llueva.
  answer: B
  explanation: 'La definición del manual para esta señal es: ''El pavimento es inusualmente
    resbaladizo cuando está mojado''.'
- id: 251
  category: signs_and_signals
  question: ¿Cuál es el propósito del número en una señal de salida verde en una autopista?
  choices:
    A: Indica la distancia a la siguiente ciudad.
    B: Muestra el número de ruta de la autopista en la que se encuentra.
    C: Le ayuda a saber qué salida tomar.
    D: Es la velocidad recomendada para la rampa de salida.
  answer: C
  explanation: 'El manual establece: ''El número en una señal de salida le ayuda a
    saber qué salida tomar''.'
- id: 252
  category: signs_and_signals
  question: ¿De qué color son las señales que indican lugares históricos, áreas panorámicas
    y parques?
  choices:
    A: Azul
    B: Verde
    C: Amarillo
    D: Marrón
  answer: D
  explanation: 'El manual especifica: ''Señales históricas, culturales y recreativas:
    Estas señales marrones indican lugares históricos y culturales. También indican
    áreas panorámicas, zonas de picnic y parques''.'
- id: 253
  category: signs_and_signals
  question: Según el manual, ¿qué debe hacer al acercarse a un semáforo con una luz
    amarilla circular fija?
  choices:
    A: Acelerar para despejar la intersección antes de que la luz cambie a rojo.
    B: Detenerse antes de entrar en la intersección o, si no puede detenerse de forma
      segura, cruzarla con cuidado.
    C: Detenerse por completo y esperar a que la luz cambie a verde.
    D: Reducir la velocidad y prepararse para girar a la derecha.
  answer: B
  explanation: 'El manual establece: ''Una señal amarilla fija le advierte que la
    señal está a punto de cambiar a rojo. Deténgase antes de entrar en la intersección.
    Si no puede detenerse de forma segura, cruce con cuidado''.'
- id: 254
  category: signs_and_signals
  question: Al encontrarse con un semáforo con una flecha roja fija, ¿qué giros se
    le permite realizar?
  choices:
    A: No se permiten giros hasta que la flecha cambie a verde.
    B: Solo puede girar en la dirección de la flecha después de detenerse.
    C: Los mismos giros permitidos para una señal roja circular fija, después de detenerse
      por completo.
    D: Puede girar a la derecha, pero no a la izquierda.
  answer: C
  explanation: 'El manual aclara para una flecha roja: ''Se permiten los mismos giros
    que para una señal roja fija'' después de detenerse, a menos que una señal lo
    prohíba.'
- id: 255
  category: sharing_the_road
  question: Si se coloca una señal de 'Giros a la derecha permitidos' (Right Turns
    Permitted) para un carril exclusivo para el transporte público, ¿cómo debe usar
    el carril para girar a la derecha?
  choices:
    A: Puede usar toda la longitud del carril para prepararse para su giro.
    B: Debe acelerar para adelantarse a cualquier vehículo de transporte público antes
      de girar.
    C: Puede usar brevemente el carril para girar, cediendo siempre el paso a los
      vehículos de transporte público e incorporándose detrás de ellos.
    D: No se le permite entrar en el carril si hay un autobús a la vista.
  answer: C
  explanation: El manual establece que puede 'usar brevemente el carril de transporte
    público para girar... Siempre ceda el paso a los vehículos de transporte público
    y a las personas que montan en bicicleta en los carriles de transporte público.
    Incorpórese al carril detrás de ellos después de que pasen'.
- id: 256
  category: signs_and_signals
  question: Cuando se acerca a una señal de flecha amarilla intermitente, ¿qué indica
    esto sobre el estado del tráfico en sentido contrario?
  choices:
    A: El tráfico en sentido contrario también tiene una flecha amarilla intermitente.
    B: El tráfico en sentido contrario tiene una señal roja fija y debe detenerse.
    C: El tráfico en sentido contrario tiene una señal verde fija.
    D: El tráfico en sentido contrario se está preparando para detenerse ante una
      señal roja.
  answer: C
  explanation: El manual establece que cuando usted tiene una flecha amarilla intermitente,
    debe ceder el paso al tráfico en sentido contrario, que tiene una señal verde
    fija.
- id: 257
  category: safe_driving_rules
  question: ¿Cuál es la diferencia clave para un conductor que gira a la izquierda
    cuando se enfrenta a una flecha verde fija en comparación con una señal verde
    circular fija?
  choices:
    A: Una flecha verde significa que debe detenerse y esperar un espacio, mientras
      que un círculo verde significa que puede girar inmediatamente.
    B: Una flecha verde le otorga el derecho de paso para el giro, mientras que un
      círculo verde requiere que ceda el paso al tráfico en sentido contrario y a
      los peatones.
    C: Ambas señales significan lo mismo, pero la flecha se usa en áreas de mayor
      tráfico.
    D: Una flecha verde permite solo un giro a la izquierda, mientras que un círculo
      verde permite movimientos a la izquierda, a la derecha y de frente.
  answer: B
  explanation: Una flecha verde fija significa que usted tiene el derecho de paso
    para el movimiento indicado. Una señal verde circular fija permite un giro a la
    izquierda, pero primero debe ceder el paso a los peatones y al tráfico en sentido
    contrario.
- id: 258
  category: safe_driving_rules
  question: Al conducir en una carretera de doble sentido que no tiene una línea central
    pintada, ¿cuál es su responsabilidad legal con respecto a la posición en la carretera?
  choices:
    A: Debe conducir lo más cerca posible del borde derecho de la carretera en todo
      momento.
    B: Puede usar el centro de la carretera si no se aproxima tráfico.
    C: Debe ceder al menos la mitad de la carretera al tráfico en sentido contrario.
    D: El vehículo que viaja a mayor velocidad tiene el derecho de paso.
  answer: C
  explanation: 'El manual establece: ''Cuando una carretera no tiene línea central
    y el tráfico se mueve en direcciones opuestas, los conductores deben ceder al
    menos la mitad de la carretera al tráfico en sentido contrario''.'
- id: 259
  category: safe_driving_rules
  question: A menos que se indique una velocidad diferente, ¿cuál es el límite de
    velocidad legal máximo en las carreteras y autopistas de Oregón que no entran
    en otra definición específica (como una zona escolar, comercial o residencial)?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: El límite de velocidad reglamentario es de 55 mph 'en todas las carreteras
    y autopistas que no cumplan con ninguna otra definición, a menos que se indique
    lo contrario'.
- id: 260
  category: signs_and_signals
  question: ¿Cuál de las siguientes opciones describe correctamente una señal de velocidad
    consultiva variable (Variable Advisory Speed) en Oregón?
  choices:
    A: Es blanca y negra, dice 'límite de velocidad' (speed limit) y es legalmente
      exigible.
    B: Es amarilla, dice 'velocidad consultiva' (advisory speed) y recomienda una
      velocidad para las condiciones actuales.
    C: Es naranja, dice 'zona de obras' (work zone) y se aplica solo cuando hay trabajadores
      presentes.
    D: Es azul, dice 'velocidad mínima' (minimum speed) e indica lo más lento que
      puede conducir legalmente.
  answer: B
  explanation: El manual especifica que 'las señales de velocidad consultiva variable
    son amarillas y dicen “velocidad consultiva” (advisory speed). Estas señales recomiendan
    una velocidad basada en las condiciones de conducción... Estos no son límites
    de velocidad...'
- id: 261
  category: sharing_the_road
  question: Según los datos de mortalidad de peatones en el manual, ¿un peatón tiene
    un 50% de riesgo de muerte si es golpeado por un vehículo que viaja a qué velocidad
    aproximada?
  choices:
    A: 23 mph
    B: 35 mph
    C: 42 mph
    D: 58 mph
  answer: C
  explanation: El gráfico del manual muestra que un peatón golpeado por un vehículo
    que viaja a 42 mph tiene un 50% de riesgo de muerte.
- id: 262
  category: signs_and_signals
  question: Además de separar el tráfico que se mueve en direcciones opuestas, ¿cuál
    es otro uso principal de una marca vial amarilla continua?
  choices:
    A: Para marcar el borde derecho de la calzada.
    B: Para indicar un carril para bicicletas.
    C: Para marcar el borde izquierdo de las carreteras de un solo sentido y las rampas.
    D: Para designar una zona de estacionamiento.
  answer: C
  explanation: El manual establece que las marcas amarillas se utilizan para separar
    el tráfico que se mueve en direcciones opuestas y "para marcar el borde izquierdo
    de las carreteras de un solo sentido y las rampas..."
- id: 263
  category: safe_driving_rules
  question: ¿Bajo qué circunstancia específica se le permite legalmente conducir a
    través de una línea amarilla doble continua?
  choices:
    A: Para rebasar a un vehículo lento que viaja a menos de 25 mph.
    B: Para realizar un giro a la izquierda para entrar o salir de una carretera,
      después de ceder el paso al tráfico que viene en sentido contrario.
    C: Si la carretera adelante está despejada por al menos 500 pies.
    D: Nunca se le permite cruzar una línea amarilla doble continua.
  answer: B
  explanation: 'El manual establece una excepción para las líneas amarillas dobles
    continuas: "Puede girar a la izquierda, para entrar o salir de una carretera,
    a través de líneas amarillas dobles continuas después de esperar a que el tráfico
    que viene en sentido contrario despeje".'
- id: 264
  category: signs_and_signals
  question: Si se aproxima a una intersección y la luz del semáforo cambia a amarillo
    fijo, ¿cuál es la acción correcta y más segura a tomar?
  choices:
    A: Acelerar para despejar la intersección antes de que la luz cambie a rojo.
    B: Detenerse inmediatamente, incluso si se encuentra en medio de la intersección.
    C: Detenerse antes de entrar en la intersección si puede hacerlo de manera segura.
    D: Reducir la velocidad y prepararse para detenerse, pero continuar si el automóvil
      de atrás está cerca.
  answer: C
  explanation: 'El manual aconseja para una señal amarilla fija: "Deténgase antes
    de entrar en la intersección. Si no puede detenerse de forma segura, conduzca
    con cuidado a través de ella".'
- id: 265
  category: safe_driving_rules
  question: Si debe conducir a la izquierda de la línea central para rebasar una obstrucción,
    como un automóvil estacionado o escombros en la carretera, ¿qué debe hacer primero?
  choices:
    A: Tocar la bocina para alertar a los conductores que vienen en sentido contrario.
    B: Ceder el paso a cualquier tráfico que venga en sentido contrario.
    C: Encender las luces de emergencia (hazard lights).
    D: Aumentar su velocidad para rodear la obstrucción rápidamente.
  answer: B
  explanation: 'El manual establece: "Si debe conducir a la izquierda de la línea
    central para rodear un peligro en la carretera o por cualquier otro motivo, debe
    ceder el paso al tráfico que viene en sentido contrario".'
- id: 266
  category: driver_responsibility
  question: ¿Cómo define el Manual del Conductor de Oregon el acto de "ceder el paso"
    (yielding)?
  choices:
    A: Llegar a una parada completa en todo momento.
    B: Reducir la velocidad o detenerse para permitir que otro vehículo o peatón continúe
      de manera segura.
    C: Hacer una señal con la mano para permitir que otro conductor proceda primero.
    D: Mantener su velocidad y posición, ya que usted tiene el derecho de paso.
  answer: B
  explanation: 'El manual define ceder el paso como: "debe reducir la velocidad o
    detenerse para permitir que otro vehículo o peatón continúe de manera segura".'
- id: 267
  category: signs_and_signals
  question: ¿En qué se diferencia una señal de "Límite de Velocidad Variable" (Variable
    Speed Limit) de una señal de "Velocidad Sugerida Variable" (Variable Advisory
    Speed)?
  choices:
    A: La señal de Límite de Velocidad Variable es amarilla y recomienda una velocidad,
      mientras que la señal sugerida es blanca y negra y es un límite legal.
    B: La señal de Límite de Velocidad Variable es blanca y negra y es un límite de
      velocidad exigible, mientras que la señal sugerida es amarilla y es una recomendación.
    C: No hay diferencia; los términos se usan indistintamente.
    D: La señal de Límite de Velocidad Variable solo se usa en zonas de construcción,
      mientras que la señal sugerida se usa para condiciones climáticas.
  answer: B
  explanation: 'El manual distingue las dos: las señales de "Variable Speed Limit"
    son blancas y negras, dicen "speed limit" y son exigibles legalmente. Las señales
    de "Variable Advisory Speed" son amarillas, dicen "advisory speed" y son recomendaciones.'
- id: 268
  category: signs_and_signals
  question: Si conduce por una carretera con una línea central doble y la línea de
    su lado del carril es amarilla continua, ¿qué indica esto?
  choices:
    A: Está en una calle de un solo sentido.
    B: Se está aproximando a una señal de alto.
    C: Está en un carril donde no se permite rebasar.
    D: Puede rebasar si no se ve tráfico en sentido contrario.
  answer: C
  explanation: 'El manual explica que para una línea central doble con una línea continua
    y una discontinua: "Una línea amarilla continua en su lado del carril indica que
    no se le permite rebasar".'
- id: 269
  category: signs_and_signals
  question: ¿Cuál es la regla para realizar un giro cuando se enfrenta a una señal
    de flecha roja fija?
  choices:
    A: No se permiten giros bajo ninguna circunstancia.
    B: Puede girar después de detenerse por completo y ceder el paso al tráfico y
      a los peatones.
    C: Los mismos giros permitidos para una señal roja circular fija están permitidos
      para una flecha roja.
    D: Solo puede girar si hay una señal colocada que lo permita explícitamente.
  answer: C
  explanation: 'El manual establece: "Una flecha roja fija significa detenerse y permanecer
    detenido hasta que la señal cambie, excepto para los giros permitidos en rojo.
    Los mismos giros permitidos para una señal roja circular fija están permitidos
    para una flecha roja".'
- id: 270
  category: signs_and_signals
  question: ¿Cuál es la regla para conducir sobre las franjas diagonales amarillas
    que se encuentran dentro de una mediana pintada?
  choices:
    A: Puede conducir sobre ellas para rebasar a un vehículo lento.
    B: Se permite realizar un giro a la izquierda a través de ellas si el tráfico
      está despejado.
    C: Es ilegal conducir o realizar un giro a través de estas franjas.
    D: Puede usar esta área como un lugar de espera temporal para un giro a la izquierda.
  answer: C
  explanation: 'El manual establece que las franjas diagonales amarillas se utilizan
    para informarle sobre objetos fijos o áreas donde no se permite el uso de vehículos.
    Especifica: "Es ilegal conducir o realizar un giro a través de estas franjas".'
- id: 271
  category: safe_driving_rules
  question: ¿Qué indica una línea blanca sólida doble entre carriles de tráfico que
    se mueven en la misma dirección?
  choices:
    A: El carril está terminando y debe incorporarse pronto.
    B: Se permite rebasar, pero no se recomienda.
    C: No se le permite cambiar de carril.
    D: El carril está reservado para vehículos de alta ocupación.
  answer: C
  explanation: Según el manual, una línea blanca sólida doble significa que no se
    le permite cambiar de carril y debe permanecer en su carril. A menudo va acompañada
    de una señal que prohíbe los cambios de carril.
- id: 272
  category: signs_and_signals
  question: Usted encuentra un carril pintado de rojo sólido con las palabras "BUS
    ONLY" en el pavimento. ¿Qué significa esto?
  choices:
    A: Es un carril de bomberos y debe mantenerse despejado en todo momento.
    B: Es un carril exclusivo para el transporte público (Transit Only) y no puede
      conducir su automóvil en él.
    C: Puede usar este carril para girar a la derecha dentro de los 100 pies.
    D: Es un carril de parada de emergencia para todos los vehículos.
  answer: B
  explanation: El manual establece que un carril rojo sólido es un carril exclusivo
    para el transporte público (Transit Only), no para automóviles. Estos carriles
    también pueden decir "BUS ONLY, BUS BIKE ONLY, o LRT".
- id: 273
  category: signs_and_signals
  question: ¿Cuál es el propósito de los galones blancos (chevrons) pintados en la
    superficie de la carretera?
  choices:
    A: Indicar el punto en el que se requiere ceder el paso.
    B: Informarle sobre objetos fijos o áreas donde no se permite el uso de vehículos.
    C: Marcar un cruce de peatones en un área de mucho tráfico.
    D: Guiarlo a través de una intersección compleja hacia el carril adecuado.
  answer: B
  explanation: 'El manual establece: "Galones blancos: Pueden usarse para informarle
    sobre objetos fijos en la carretera adelante u otras áreas donde no se permite
    el uso de vehículos".'
- id: 274
  category: defensive_driving
  question: Según el manual, ¿cuál es el procedimiento correcto para determinar si
    está siguiendo a otro vehículo demasiado de cerca?
  choices:
    A: Asegurarse de que puede ver la parte superior del vehículo delante de usted
      por encima de su capó.
    B: Mantener al menos la longitud de tres automóviles entre su vehículo y el que
      va adelante.
    C: Tocar la bocina y ver si el conductor de adelante reacciona.
    D: Contar los segundos que tarda en llegar a un objeto fijo después de que el
      vehículo de adelante lo pase.
  answer: D
  explanation: 'El manual describe un método específico: "Observe cuándo la parte
    trasera del vehículo de adelante pasa por algo como una señal o un poste. Cuente
    los segundos que tarda en llegar al mismo lugar". Un conteo de menos de dos segundos
    significa que está demasiado cerca.'
- id: 275
  category: defensive_driving
  question: ¿Por qué debería aumentar su distancia de seguimiento cuando se detiene
    en una colina?
  choices:
    A: Para tener un impulso inicial cuando el tráfico comience a moverse.
    B: Porque sus frenos son menos efectivos en una pendiente.
    C: El vehículo de adelante puede rodar hacia atrás cuando comience a moverse.
    D: Para permitir que los vehículos de emergencia pasen entre los carriles.
  answer: C
  explanation: 'El manual enumera varias situaciones que requieren una mayor distancia
    de seguimiento, incluyendo: "Cuando se detiene en una colina. El vehículo de adelante
    puede rodar hacia atrás cuando comience a moverse".'
- id: 276
  category: defensive_driving
  question: Al conducir en una calle de varios carriles junto a otros vehículos, ¿cuál
    es la forma más segura de gestionar su margen de espacio lateral?
  choices:
    A: Mantener exactamente la misma velocidad que el vehículo que está a su lado.
    B: Conducir lo más cerca posible del borde derecho de su carril.
    C: Quedarse un poco atrás o avanzar por delante del otro vehículo.
    D: Hacer una señal al otro conductor para que disminuya la velocidad.
  answer: C
  explanation: 'Para mantener un margen de espacio lateral, el manual aconseja: "Si
    es posible, quédese un poco atrás o avance por delante del otro vehículo" para
    evitar conducir directamente al lado de otro automóvil.'
- id: 277
  category: defensive_driving
  question: ¿Cómo debe ajustar su posición en el carril cuando conduce junto a una
    fila de automóviles estacionados?
  choices:
    A: Moverse al extremo izquierdo de su carril, cruzando la línea central si es
      necesario.
    B: Mantener su posición en el centro del carril y aumentar su velocidad.
    C: Alejarse de los automóviles estacionados, pero sin salirse de su carril.
    D: Tocar la bocina continuamente para alertar a las personas cerca de los automóviles
      estacionados.
  answer: C
  explanation: 'El manual recomienda: "Mantenga espacio adicional entre su vehículo
    y los automóviles estacionados alejándose de ellos sin salirse de su carril" para
    evitar puertas que se abren repentinamente o peatones.'
- id: 278
  category: sharing_the_road
  question: Si está en una autopista y ve un vehículo entrando desde una rampa de
    acceso, ¿qué debe hacer para ayudarlo a incorporarse de manera segura?
  choices:
    A: Acelerar para pasar la rampa de acceso antes de que entren.
    B: Mantener su velocidad y posición en el carril, ya que ellos están obligados
      a ceder el paso.
    C: Cambiarse a un carril a su izquierda, si no hay nadie a su lado.
    D: Usar las luces altas para indicar que deben esperar.
  answer: C
  explanation: El manual establece que debe "Hacer espacio para los vehículos que
    entran a las autopistas. Si no hay nadie a su lado, cámbiese de carril".
- id: 279
  category: defensive_driving
  question: ¿Cómo puede usar el equipo de su vehículo para ayudar a mantener un margen
    de espacio seguro detrás de usted cuando necesite disminuir la velocidad o detenerse?
  choices:
    A: Encender sus luces intermitentes de emergencia.
    B: Presionar suavemente el freno para activar sus luces de freno.
    C: Tocar la bocina ligeramente varias veces.
    D: Encender y apagar sus faros delanteros.
  answer: B
  explanation: El manual sugiere que puede ayudar a mantener al conductor detrás de
    usted a una distancia segura "señalando con anticipación al presionar suavemente
    el freno cuando tenga que disminuir la velocidad o detenerse. Sus luces de freno
    alertarán a los conductores detrás de usted que está disminuyendo la velocidad".
- id: 280
  category: safe_driving_rules
  question: ¿Cuál es la regla con respecto a cruzar una línea blanca sólida ancha,
    como la que se usa para un carril de giro o un carril para bicicletas?
  choices:
    A: Está estrictamente prohibido.
    B: Se permite pero no se recomienda.
    C: Solo se permite en una emergencia.
    D: Se permite sin restricciones.
  answer: B
  explanation: 'El manual establece: "Se permite cruzar una línea blanca sólida ancha,
    pero no se recomienda". Esto es diferente de una línea blanca sólida doble, que
    no se permite cruzar.'
- id: 281
  category: signs_and_signals
  question: ¿Qué indica una línea blanca punteada en una rampa de entrada a la autopista?
  choices:
    A: El carril está por terminar y usted debe salir.
    B: Usted está entrando a la autopista y debe incorporarse al tráfico.
    C: El carril es solo para vehículos compartidos (carpools) durante las horas pico.
    D: Marca el inicio de una zona de velocidad reducida.
  answer: B
  explanation: 'El manual especifica: ''Cuando se utiliza en una rampa de entrada
    a la autopista, le informa que está entrando a la autopista y debe incorporarse
    al tráfico''.'
- id: 282
  category: signs_and_signals
  question: Si ve líneas blancas punteadas pintadas dentro de una intersección, ¿cuál
    es su propósito?
  choices:
    A: Marcar un cruce de peatones temporal.
    B: Indicar dónde debe detenerse si el semáforo se pone en rojo.
    C: Mostrar dónde se permite estacionar durante las horas no pico.
    D: Ayudar a guiarlo a través de la intersección hacia el carril adecuado.
  answer: D
  explanation: 'El manual explica un uso de las líneas blancas punteadas: ''Cuando
    se utilizan dentro de una intersección, ayudarán a guiarlo a través de la intersección
    hacia el carril adecuado''.'
- id: 283
  category: safe_driving_rules
  question: ¿Bajo qué condición puede cruzar una mediana pintada que tiene líneas
    amarillas sólidas dobles en ambos lados?
  choices:
    A: Para rebasar a un vehículo que está girando a la izquierda.
    B: Para girar a la izquierda después de esperar a que pase el tráfico en sentido
      contrario.
    C: Para hacer un giro en U si no hay una señal de 'No U-Turn' (Prohibido girar
      en U) publicada.
    D: Nunca puede cruzar legalmente una mediana pintada.
  answer: B
  explanation: 'El manual establece: ''Puede girar a la izquierda a través de una
    mediana pintada después de esperar a que pase el tráfico en sentido contrario.
    No puede usar una mediana pintada como carril de giro''.'
- id: 284
  category: signs_and_signals
  question: ¿Cuál es el propósito principal de una línea blanca sólida utilizada como
    línea de borde o de niebla?
  choices:
    A: Separar los carriles de tráfico que van en direcciones opuestas.
    B: Indicar que no se permite rebasar.
    C: Ayudar a los conductores a permanecer en la carretera.
    D: Marcar el área donde se permite estacionar.
  answer: C
  explanation: El manual define una línea blanca sólida como aquella que se 'utiliza
    como línea de borde o de niebla para ayudar a los conductores a permanecer en
    la carretera'.
