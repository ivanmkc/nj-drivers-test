metadata:
  source: 2025 Oregon Driver Manual (oregon.gov)
  total_questions: 284
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: As of May 2025, what type of identification is required for individuals
    18 and older to board a commercial U.S. flight?
  choices:
    A: A standard issue Oregon driver's license
    B: A federally accepted form of identification
    C: A standard issue Oregon instruction permit
    D: A birth certificate
  answer: B
  explanation: The manual states that as of May 2025, if you are 18+, you need a federally
    accepted form of identification to board a commercial U.S. flight.
- id: 2
  category: license_system
  question: Which of the following is NOT an acceptable form of ID for boarding a
    commercial U.S. flight as of May 2025?
  choices:
    A: U.S. Passport
    B: Standard issue, non-REAL ID Oregon driver's license
    C: U.S. military ID
    D: Permanent Resident card
  answer: B
  explanation: According to the manual, a standard issue, non-REAL ID Oregon driver's
    license, instruction permit or identification card is no longer accepted for flying
    as of May 2025.
- id: 3
  category: driver_responsibility
  question: Can the Oregon Driver Manual be cited as legal precedent in a court of
    law?
  choices:
    A: Yes, because it contains the exact language of the Oregon Revised Statutes.
    B: Yes, but only in traffic court.
    C: No, it is not a source of law and should not be relied upon as legal precedent.
    D: No, unless a local government ordinance approves it.
  answer: C
  explanation: 'The manual explicitly states: ''This manual is not a source of law
    and should not be relied upon or cited as legal precedent in a court of law or
    other administrative or legal proceeding.'''
- id: 4
  category: safe_driving_rules
  question: According to the manual, who might have additional ordinances that are
    not covered in the Oregon Driver Manual?
  choices:
    A: Local governments
    B: The federal government
    C: Neighboring states
    D: Private property owners
  answer: A
  explanation: The manual notes that 'Local governments may have additional ordinances
    not covered in this manual.'
- id: 5
  category: driver_responsibility
  question: Why are new drivers considered to be much more at risk on the road?
  choices:
    A: Because they drive older vehicles
    B: Because of their lack of experience behind the wheel
    C: Because they are not required to take a vision test
    D: Because they frequently drive at night
  answer: B
  explanation: 'The manual states: ''New drivers are much more at risk because of
    their lack of experience behind the wheel.'''
- id: 6
  category: safe_driving_rules
  question: If you are learning to drive, what is one of the best ways to improve
    your safety?
  choices:
    A: Driving only during daylight hours
    B: Purchasing a brand new vehicle
    C: Getting useful instruction and plenty of practice
    D: Reading the manual while driving
  answer: C
  explanation: According to the manual, 'If you are learning to drive, one of the
    best ways to improve your safety is to get useful instruction and plenty of practice.'
- id: 7
  category: driver_responsibility
  question: 'The Oregon Driver Manual emphasizes that driving is a:'
  choices:
    A: Constitutional right
    B: Privilege
    C: Requirement for employment
    D: Federal mandate
  answer: B
  explanation: 'The manual states: ''It is important to remember that driving is a
    privilege, and we all play a role in ensuring that everyone remains safe on our
    roadways.'''
- id: 8
  category: alcohol_drugs_health
  question: Which of the following behaviors is explicitly mentioned in the manual
    as putting everyone at risk?
  choices:
    A: Driving impaired after using cannabis
    B: Listening to the radio
    C: Driving a manual transmission vehicle
    D: Carpooling with friends
  answer: A
  explanation: The manual warns that 'Driving impaired - after drinking alcohol, using
    cannabis, or any other substance that alters your mind... puts everyone at risk.'
- id: 9
  category: license_system
  question: The Oregon Driver Manual addresses the requirements for obtaining which
    type of driving privilege?
  choices:
    A: Class A commercial
    B: Class B commercial
    C: Class C non-commercial
    D: Motorcycle endorsement
  answer: C
  explanation: 'The manual states: ''This manual only addresses requirements for obtaining
    a Class C non-commercial driving privilege.'''
- id: 10
  category: driver_testing
  question: When applying for an original driving privilege, what three things will
    the DMV test?
  choices:
    A: Hearing, driving knowledge, and vehicle maintenance
    B: Vision, driving knowledge, and driving skill
    C: Reflexes, vision, and parallel parking
    D: Vision, medical history, and driving skill
  answer: B
  explanation: 'The manual states: ''For an original driving privilege, DMV will test
    your vision, driving knowledge and driving skill.'''
- id: 11
  category: driver_testing
  question: Every time you take a test at the DMV, you must present proof of identity,
    date of birth, and what else?
  choices:
    A: Current residence address
    B: Proof of vehicle insurance
    C: Social Security card
    D: High school transcript
  answer: A
  explanation: The manual requires that 'Every time you take a test, you must first
    pay the test fee and present proof of identity, date of birth, and current residence
    address.'
- id: 12
  category: driver_testing
  question: How must you pay your DMV test fee?
  choices:
    A: Combined with your vehicle registration fee
    B: Separate from any other fees
    C: Only with a credit card
    D: After you pass the test
  answer: B
  explanation: 'The manual explicitly states: ''You must pay your test fee separate
    from any other fees.'''
- id: 13
  category: driver_testing
  question: What is the fee for taking the vision test at the Oregon DMV?
  choices:
    A: $5.00
    B: $10.00
    C: $15.00
    D: There is no fee
  answer: D
  explanation: According to the manual, 'There is no fee for taking the vision test.'
- id: 14
  category: driver_testing
  question: What happens if you take the DMV vision test while wearing glasses or
    contact lenses?
  choices:
    A: You will be asked to remove them and retake the test.
    B: Your driving privilege will indicate that corrective lenses are required.
    C: You must pay an additional fee for a restricted license.
    D: You will automatically fail the vision test.
  answer: B
  explanation: 'The manual states: ''If you take the test while wearing glasses or
    contact lenses, your driving privilege will indicate that corrective lenses are
    required.'''
- id: 15
  category: driver_testing
  question: What is the next step if you do not pass the DMV vision test?
  choices:
    A: You must wait 30 days to retake the test.
    B: You will permanently lose your driving privileges.
    C: DMV will give you a form to take to a licensed vision specialist.
    D: You must take a specialized driving skill test.
  answer: C
  explanation: 'The manual explains: ''If you do not pass the vision test, DMV will
    give you a form to take to a licensed vision specialist.'''
- id: 16
  category: driver_testing
  question: How many questions must you answer correctly to pass the Class C Knowledge
    Test?
  choices:
    A: '25'
    B: '28'
    C: '30'
    D: '35'
  answer: B
  explanation: The Class C Knowledge Test has 35 multiple-choice questions, and you
    must answer 28 questions correctly to receive a passing score.
- id: 17
  category: penalties_and_points
  question: What is the penalty if it is determined that you are cheating on your
    knowledge test at a DMV office?
  choices:
    A: You will fail and cannot test again for 30 days.
    B: You will fail and cannot test again for 90 days.
    C: You must pay a fine and retake the test immediately.
    D: Your permit will be permanently revoked.
  answer: B
  explanation: The manual states that if it is determined that you are cheating, you
    will fail your test and will not be allowed to test again for 90 days.
- id: 18
  category: driver_testing
  question: Which of the following devices is permitted when taking the knowledge
    test online?
  choices:
    A: A mobile phone
    B: A tablet
    C: A desktop computer with a webcam
    D: A touchscreen device
  answer: C
  explanation: To take the knowledge test online, you must use a desktop or laptop
    computer with a keyboard, mouse, and webcam. You cannot use a touchscreen device
    like mobile phones or tablets.
- id: 19
  category: driver_testing
  question: If you are under 18 years of age taking the knowledge test online, what
    are the requirements for your Proctor?
  choices:
    A: They must be over 18 and can supervise unlimited tests.
    B: They must be over 21 and can supervise only two tests in a 24-hour period.
    C: They must be a licensed driving instructor.
    D: They must be a parent or legal guardian.
  answer: B
  explanation: If under 18 years of age, a Proctor over 21 years of age must supervise
    the online test, and a Proctor can only supervise two tests in a 24-hour period.
- id: 20
  category: driver_testing
  question: What is the maximum number of times you can attempt the knowledge test
    online before you are required to test at a DMV office?
  choices:
    A: Two times
    B: Three times
    C: Four times
    D: Five times
  answer: C
  explanation: You may take the test online four times total. After four attempts
    you must test at a DMV office.
- id: 21
  category: driver_testing
  question: 'The DMV may waive the drive test if you provide proof that you completed
    an ODOT-Approved Driver Education Course within the past:'
  choices:
    A: Six months
    B: One year
    C: Two years
    D: Five years
  answer: C
  explanation: DMV may waive the drive test if DMV receives proof you completed an
    ODOT-Approved Driver Education Course within the past two years.
- id: 22
  category: driver_testing
  question: Who is allowed in the vehicle with you during a drive test?
  choices:
    A: Only you and the examiner
    B: You, the examiner, and a translator
    C: You, the examiner, and a family member
    D: You, the examiner, and a licensed driver over 21
  answer: A
  explanation: Only you and the examiner are allowed in the vehicle during a drive
    test. Translators, family, friends, or pets are not allowed.
- id: 23
  category: driver_testing
  question: If you fail the drive test, how long must you wait before retaking the
    test?
  choices:
    A: Until later the same day
    B: Until the next business day
    C: For one full week
    D: For 30 days
  answer: B
  explanation: If you fail the drive test, you must wait until the next business day
    before retaking the test.
- id: 24
  category: vehicle_information
  question: Which of the following is a requirement for the vehicle you use for your
    drive test?
  choices:
    A: It must have a backup camera.
    B: The passenger door must open and close with a handle from the inside and outside.
    C: It must be less than 10 years old.
    D: It must have an automatic transmission.
  answer: B
  explanation: Vehicle equipment that must be in working order for the test includes
    a passenger door that opens and closes with a handle from inside and outside.
- id: 25
  category: license_system
  question: If you are under 18 years of age and applying for a driver license, how
    long must you have held a permit before taking the drive test?
  choices:
    A: At least 3 months
    B: At least 6 months
    C: At least 9 months
    D: At least 1 year
  answer: B
  explanation: You must have held a permit for at least 6 months if you are under
    18 years of age and applying for a driver license.
- id: 26
  category: signs_and_signals
  question: When must you obey official signs, signals, and markings?
  choices:
    A: At all times, with no exceptions.
    B: Only during daylight hours.
    C: Unless you see a police officer or road worker redirecting traffic.
    D: Unless you are driving an emergency vehicle.
  answer: C
  explanation: You must obey all official signs, signals, and markings unless you
    see a police officer or road worker redirecting traffic.
- id: 27
  category: signs_and_signals
  question: What color are traffic signs that prohibit certain actions or movements?
  choices:
    A: Yellow
    B: Orange
    C: Red
    D: White
  answer: C
  explanation: Traffic signs that prohibit certain actions or movements are red in
    color and increase safety by controlling the flow of traffic through intersections.
- id: 28
  category: signs_and_signals
  question: What does a 'Right Turn Permitted Without Stopping' sign indicate when
    placed below a stop sign?
  choices:
    A: All traffic may proceed without stopping.
    B: Traffic turning right may turn without stopping, but other traffic must stop
      and yield.
    C: Traffic turning right must stop, but left-turning traffic may proceed.
    D: You may turn right only if the traffic light is green.
  answer: B
  explanation: This sign may appear below a stop sign. Traffic turning right may turn
    without stopping. Other traffic must stop and yield right of way.
- id: 29
  category: signs_and_signals
  question: What does a High Occupancy Vehicle (HOV) sign indicate?
  choices:
    A: The lane is reserved for large commercial trucks.
    B: The lane is reserved for vehicles carrying at least two or more persons.
    C: The lane is closed for construction.
    D: The lane is for passing only.
  answer: B
  explanation: High Occupancy Vehicle lanes are reserved for vehicles carrying at
    least two or more persons, as noted on the sign.
- id: 30
  category: signs_and_signals
  question: What does a white diamond painted on a traffic lane indicate?
  choices:
    A: The lane is a designated passing lane.
    B: The lane is reserved for vehicles carrying at least two or more persons.
    C: The lane is ending and vehicles must merge.
    D: The lane is for emergency vehicles only.
  answer: B
  explanation: A white diamond painted on a lane indicates a High Occupancy Vehicle
    lane, which is reserved for vehicles carrying at least two or more persons.
- id: 31
  category: signs_and_signals
  question: What color are warning signs that alert you to known possible hazards
    or changes in road conditions?
  choices:
    A: Red
    B: Green
    C: Yellow
    D: Blue
  answer: C
  explanation: Warning signs are yellow and alert you to known possible hazards or
    a change in road conditions ahead.
- id: 32
  category: signs_and_signals
  question: What does an 'Add Lane' sign indicate to a driver?
  choices:
    A: Two roadways join together and you do not need to merge.
    B: The indicated lane ends soon and you must merge.
    C: Traffic is merging from the side shown.
    D: A center passing lane is being added to the road.
  answer: A
  explanation: An 'Add Lane' sign indicates that two roadways join together and you
    do not need to merge.
- id: 33
  category: safe_driving_rules
  question: What action should you take when driving through a designated Safety Corridor?
  choices:
    A: Reduce your speed to 15 mph.
    B: Turn on your lights for safety.
    C: Move to the left lane.
    D: Sound your horn before entering.
  answer: B
  explanation: Safety corridors are designated stretches of highway with more fatal
    and serious injury collisions. The manual instructs drivers to turn on their lights
    for safety.
- id: 34
  category: signs_and_signals
  question: What type of information is provided by brown traffic signs?
  choices:
    A: Motorist services such as gas and lodging.
    B: Exit information and directions to cities.
    C: Historic, cultural, and recreational locations.
    D: Warnings about upcoming road hazards.
  answer: C
  explanation: Historic, Cultural, and Recreational Signs are brown and point to historic
    and cultural locations, scenic areas, picnic grounds, and parks.
- id: 35
  category: signs_and_signals
  question: How should you proceed if you approach an intersection where the traffic
    signal is dark due to a power failure?
  choices:
    A: Proceed through the intersection without stopping if the way is clear.
    B: Yield to traffic on your right and proceed.
    C: Stop as if there are stop signs in all directions.
    D: Wait for a police officer to arrive before crossing.
  answer: C
  explanation: If a signal appears dark, such as during a power failure, you should
    stop as if there are stop signs in all directions.
- id: 36
  category: safe_driving_rules
  question: Under what condition are you permitted to make a left turn on a steady
    red signal?
  choices:
    A: When turning from a two-way road onto another two-way road.
    B: When entering a one-way road in the direction of the one-way road.
    C: Left turns on a steady red signal are never permitted.
    D: When there is a designated center turn lane.
  answer: B
  explanation: You are allowed to turn left on red after coming to a complete stop
    when entering a one-way road in the direction of the one-way road.
- id: 37
  category: signs_and_signals
  question: What does a flashing yellow arrow traffic signal mean?
  choices:
    A: You have the right-of-way to make the indicated turn.
    B: You must stop and wait for a green arrow.
    C: You may make the indicated movement, but must first yield to pedestrians and
      oncoming traffic.
    D: The traffic signal is out of order and you must treat it as a four-way stop.
  answer: C
  explanation: A flashing yellow arrow means that you may make the movement indicated
    by the arrow, but first you must yield to pedestrians and oncoming traffic.
- id: 38
  category: safe_driving_rules
  question: In which of the following situations are you permitted to drive on the
    left side of the road?
  choices:
    A: When approaching a blind curve.
    B: When driving to the left of center to pass an obstruction.
    C: When preparing to make a right turn.
    D: When driving in a residential district.
  answer: B
  explanation: You must drive on the right side of the road except in specific situations,
    such as when driving to the left of center to pass an obstruction.
- id: 39
  category: safe_driving_rules
  question: What must you do before entering or crossing a road from an alley, driveway,
    or parking lot not controlled by signs or signals?
  choices:
    A: Stop and yield to approaching vehicles and pedestrians.
    B: Slow down to 15 mph and merge into traffic.
    C: Sound your horn to warn oncoming traffic.
    D: Yield only to vehicles approaching from the right.
  answer: A
  explanation: You must stop before you enter or cross a road from an alley, driveway
    or parking lot not controlled by signs or signals, and yield to approaching vehicles
    and pedestrians.
- id: 40
  category: safe_driving_rules
  question: What is the statutory speed limit when driving in alleys or narrow residential
    areas, unless otherwise posted?
  choices:
    A: 10 Miles Per Hour
    B: 15 Miles Per Hour
    C: 20 Miles Per Hour
    D: 25 Miles Per Hour
  answer: B
  explanation: The speed limit is set in law at 15 Miles Per Hour when driving in
    alleys and narrow residential areas.
- id: 41
  category: safe_driving_rules
  question: Unless otherwise posted, what is the maximum speed limit in public parks
    and residential districts?
  choices:
    A: 15 Miles Per Hour
    B: 20 Miles Per Hour
    C: 25 Miles Per Hour
    D: 30 Miles Per Hour
  answer: C
  explanation: The speed limit is 25 Miles Per Hour in residential districts, in public
    parks, and on ocean shores.
- id: 42
  category: signs_and_signals
  question: Which type of sign is blue and tells you about services or facilities
    along the highway, such as gas, food, or a hospital?
  choices:
    A: Route signs
    B: Guide signs
    C: Warning signs
    D: Motorist Service signs
  answer: D
  explanation: Motorist Service signs are blue signs that tell you about services
    or facilities along the highway, including gas, food, lodging, and hospitals.
- id: 43
  category: safe_driving_rules
  question: How should you position your vehicle when driving on a road with no center
    line where traffic moves in opposite directions?
  choices:
    A: Drive entirely in the center of the road until another vehicle approaches.
    B: Give at least half the road to oncoming traffic.
    C: Drive on the far left side of the road.
    D: Pull over and stop whenever a vehicle approaches.
  answer: B
  explanation: When a road has no center line and traffic moves in opposite directions,
    drivers must give at least half the road to oncoming traffic.
- id: 44
  category: signs_and_signals
  question: What is the proper response to a flashing yellow traffic signal?
  choices:
    A: Stop completely before proceeding.
    B: Speed up to clear the intersection quickly.
    C: Slow down and proceed with caution.
    D: Treat the intersection as a four-way stop.
  answer: C
  explanation: A flashing yellow signal means slow down and proceed with caution.
- id: 45
  category: safe_driving_rules
  question: In which of the following areas is the speed limit 20 miles per hour unless
    otherwise posted?
  choices:
    A: Public parks
    B: Any business district
    C: Ocean shores
    D: All roads and highways not meeting any other definition
  answer: B
  explanation: The manual states that the speed limit is 20 Miles Per Hour in any
    business district and within a school speed zone.
- id: 46
  category: signs_and_signals
  question: What is the primary difference between a Variable Advisory Speed sign
    and a Variable Speed Limit sign?
  choices:
    A: Advisory signs are black and white, while limit signs are yellow.
    B: Advisory signs recommend a speed based on conditions, while limit signs change
      the enforceable speed limit based on conditions.
    C: Advisory signs only apply at night, while limit signs apply during the day.
    D: Advisory signs are enforced like any other speed limit sign, while limit signs
      are only enforced through the basic rule law.
  answer: B
  explanation: Variable advisory speed signs are yellow and recommend a speed based
    on driving conditions. Variable speed limit signs are black and white and actually
    change the speed limit based on driving conditions, which police enforce like
    any other speed limit sign.
- id: 47
  category: safe_driving_rules
  question: Which of the following statements is true regarding Oregon's Basic Rule
    Law?
  choices:
    A: It allows you to drive over the speed limit if the weather is clear and traffic
      is light.
    B: It only applies on interstate highways and in business districts.
    C: It states you must drive at a speed that is reasonable and cautious for existing
      conditions.
    D: It requires you to drive at the posted speed limit regardless of weather or
      visibility.
  answer: C
  explanation: The basic rule states you must drive at a speed that is reasonable
    and cautious for existing conditions. It applies on all roads at all times and
    does not allow you to drive over the speed limit.
- id: 48
  category: sharing_the_road
  question: If you are driving slower than the normal speed of traffic and congestion
    builds up behind you, what must you do?
  choices:
    A: Speed up to match the flow of traffic even if it exceeds the posted limit.
    B: Move to the left lane to allow vehicles to pass on the right.
    C: Pull off the road at the first safe area and let the traffic behind you pass.
    D: Turn on your hazard lights and continue driving in your current lane.
  answer: C
  explanation: 'The manual states: "Watch for congestion behind you if you drive slower
    than the designated speed. Pull off the road at the first safe area and let the
    traffic behind you pass."'
- id: 49
  category: defensive_driving
  question: According to the manual's data on vehicle speed and pedestrian fatalities,
    a pedestrian hit by a vehicle traveling at 42 mph has what risk of death?
  choices:
    A: 10% Risk of Death
    B: 25% Risk of Death
    C: 50% Risk of Death
    D: 90% Risk of Death
  answer: C
  explanation: The manual's chart shows that a pedestrian hit by a vehicle traveling
    at 42 MPH has a 50% Risk of Death.
- id: 50
  category: signs_and_signals
  question: What does a double solid yellow line indicate?
  choices:
    A: Passing is allowed for both directions of traffic.
    B: Passing is not allowed, but you may turn left across the lines to enter or
      exit a roadway.
    C: You are approaching a one-way street.
    D: You may use the center lane to pass slow-moving vehicles.
  answer: B
  explanation: A double solid yellow line indicates passing is not allowed for both
    directions of traffic. However, you may turn left to enter or exit a roadway across
    double solid yellow lines after waiting for oncoming traffic to clear.
- id: 51
  category: safe_driving_rules
  question: Which of the following is a rule for using a two-way special left turn
    lane?
  choices:
    A: You may use the lane to pass slow-moving traffic.
    B: You should travel in the lane for at least 200 feet before turning.
    C: It is illegal to travel in a two-way left turn lane, so enter the lane just
      before you want to make the turn.
    D: You can park in this lane if your vehicle is disabled.
  answer: C
  explanation: 'The manual states: "It is illegal to travel in a two-way left turn
    lane, so enter the lane just before you want to make the turn."'
- id: 52
  category: signs_and_signals
  question: What is the rule regarding a painted median with double solid yellow lines
    on both sides?
  choices:
    A: You may use it as a turn lane.
    B: You may make a left turn across it after waiting for oncoming traffic to clear.
    C: You are allowed to travel in the median if the main lanes are congested.
    D: It is illegal to turn across a painted median under any circumstances.
  answer: B
  explanation: A painted median with double solid yellow lines marks the area between
    two directions of travel. You may make a left turn across a painted median after
    waiting for oncoming traffic to clear, but you may not use it as a turn lane or
    travel in it.
- id: 53
  category: signs_and_signals
  question: What does a wide solid white line indicate, and what is the rule for crossing
    it?
  choices:
    A: It separates traffic moving in opposite directions; crossing is strictly prohibited.
    B: It marks a pedestrian crosswalk; crossing is only allowed when clear.
    C: It is used to direct traffic into specific lanes; crossing is permitted but
      discouraged.
    D: It indicates a transit-only lane; crossing is illegal.
  answer: C
  explanation: A wide solid white line is used to direct traffic into specific lanes
    (like turn lanes) and separate bike lanes. Crossing a wide solid white line is
    permitted but discouraged.
- id: 54
  category: signs_and_signals
  question: When a dotted white line is used prior to an exit ramp or intersection,
    what does it inform the driver?
  choices:
    A: The lane you are traveling in will not continue on the same route.
    B: You are approaching a school zone.
    C: Passing is prohibited for the next mile.
    D: You must come to a complete stop.
  answer: A
  explanation: When used prior to an exit ramp or intersection, a dotted white line
    informs you that the lane you are traveling in will not continue on the same route,
    such as a right-turn only lane or an exit only lane.
- id: 55
  category: signs_and_signals
  question: How is a yield line marked on the pavement?
  choices:
    A: A solid white line across the lane.
    B: A row of triangles in your lane, pointing toward your vehicle.
    C: White chevrons painted in the center of the lane.
    D: A wide white line with a bicycle symbol.
  answer: B
  explanation: A yield line is defined as a row of triangles in your lane, pointing
    toward your vehicle to indicate the point at which you are required to yield.
- id: 56
  category: signs_and_signals
  question: What do striped red lines on the road indicate?
  choices:
    A: A lane exclusively for emergency vehicles.
    B: An area where passing is strictly prohibited.
    C: A transit-only lane that cars may never enter.
    D: Areas where you may enter a Transit Only lane to turn, park, or enter a driveway.
  answer: D
  explanation: Striped red lines show where you may enter the Transit Only lane to
    turn, park or enter a driveway.
- id: 57
  category: defensive_driving
  question: What is the recommended safe following distance for speeds greater than
    30 mph?
  choices:
    A: 1 to 2 seconds
    B: 2 to 3 seconds
    C: 3 seconds exactly
    D: 4 seconds or more
  answer: D
  explanation: 'The manual states: "For speeds greater than 30 mph, a safe following
    distance should be 4 seconds or more to allow you time to make a decision and
    take action."'
- id: 58
  category: penalties_and_points
  question: How does the Oregon driver manual define illegal racing on a road?
  choices:
    A: Driving more than 15 mph over the posted speed limit.
    B: Any acceleration or speed contest, or the making of a speed record.
    C: Passing more than three vehicles in a single maneuver.
    D: Driving faster than the normal speed of traffic in the left lane.
  answer: B
  explanation: 'The manual states: "It is illegal to race on any road. Racing can
    be any acceleration or speed contest or the making of a speed record."'
- id: 59
  category: safe_driving_rules
  question: What is defined as a safe following distance under normal conditions for
    speeds of 30 mph or less?
  choices:
    A: 1-2 seconds
    B: 2-4 seconds
    C: 4-6 seconds
    D: 5-7 seconds
  answer: B
  explanation: According to the manual, a safe following distance is defined as 2-4
    seconds.
- id: 60
  category: safe_driving_rules
  question: If you are traveling at a speed greater than 30 mph, what should your
    following distance be?
  choices:
    A: 2 seconds
    B: 3 seconds
    C: 4 seconds or more
    D: 1 second for every 10 mph
  answer: C
  explanation: For speeds greater than 30 mph, a safe following distance should be
    4 seconds or more to allow you time to make a decision and take action.
- id: 61
  category: defensive_driving
  question: When stopping behind another vehicle, how much space should you leave?
  choices:
    A: Enough to see the rear tires of the vehicle in front meet the road
    B: At least one full car length
    C: Enough to see the vehicle's license plate
    D: Three feet of distance
  answer: A
  explanation: When stopping behind another vehicle, make sure you can see where the
    rear tires of the vehicle in front meet the road.
- id: 62
  category: defensive_driving
  question: What should you do if a vehicle behind you is following too closely and
    you cannot move over to the right lane?
  choices:
    A: Brake hard to discourage tailgating
    B: Slowly reduce your speed
    C: Speed up to increase the distance
    D: Flash your hazard lights
  answer: B
  explanation: If a vehicle behind you is following too closely and you can't move
    over, slowly reduce your speed. This may encourage the vehicle to pass you or
    to stop tailgating. Never brake hard.
- id: 63
  category: vehicle_information
  question: What is the proper technique for backing up a vehicle?
  choices:
    A: Rely entirely on your rearview and side mirrors
    B: Turn your body and head to the right and look out through the rear window
    C: Honk your horn three times before reversing
    D: Open your door and look backward while reversing
  answer: B
  explanation: Mirrors do not give you a full view. To see as much as possible, turn
    your body and head to the right and look out through the rear window.
- id: 64
  category: safe_driving_rules
  question: 'At 60 mph, the distance traveled from the point you recognize a hazard
    to where your vehicle comes to a stop is:'
  choices:
    A: About 50 feet
    B: Less than the length of a basketball court
    C: Greater than the length of a football field
    D: Exactly 100 feet
  answer: C
  explanation: Stopping takes longer than you think. At 60 mph, the distance traveled
    from the point you recognize a hazard ahead and apply the brakes, to where your
    vehicle comes to a stop is greater than the length of a football field.
- id: 65
  category: safe_driving_rules
  question: When approaching a curve, when should you slow down?
  choices:
    A: Before you enter the curve
    B: While you are in the middle of the curve
    C: Just as you exit the curve
    D: You should maintain your speed throughout the curve
  answer: A
  explanation: The manual states to slow down before you enter a curve, and then increase
    your speed gradually as you come out of it.
- id: 66
  category: defensive_driving
  question: What must you do to check your blind spot before changing lanes?
  choices:
    A: Check your rearview mirror
    B: Check your side mirrors
    C: Glance over your shoulder in the direction you are moving
    D: Turn on your turn signal
  answer: C
  explanation: Before you change lanes, you must glance over your left shoulder if
    you are moving left, or glance over your right shoulder if you are moving right
    so you can see if there are any vehicles in your blind spot.
- id: 67
  category: safe_driving_rules
  question: When passing another vehicle on a two-lane road, when is it safe to return
    to your lane?
  choices:
    A: As soon as your front bumper is ahead of the other vehicle
    B: When you can see the vehicle you passed in your rearview mirror
    C: After you have traveled 100 feet past the vehicle
    D: When the other driver flashes their headlights
  answer: B
  explanation: When you can see the vehicle you passed in your rearview mirror, signal
    and return to your lane.
- id: 68
  category: safe_driving_rules
  question: 'When passing another vehicle, you are allowed to exceed the speed limit:'
  choices:
    A: By up to 5 mph
    B: By up to 10 mph if passing a truck
    C: Only on a two-lane highway
    D: At no time; it is against the law to exceed speed limits
  answer: D
  explanation: Do not exceed the speed limit when passing; it is against the law to
    exceed speed limits at any time.
- id: 69
  category: safe_driving_rules
  question: In which of the following situations is it illegal to cross the center
    line to pass?
  choices:
    A: When the vehicle ahead is stopped at a crosswalk to permit a pedestrian to
      cross
    B: When you are on a multi-lane one-way street
    C: When the vehicle ahead is making a right turn
    D: When you are driving in a residential area with dashed yellow lines
  answer: A
  explanation: You must not cross the center line to pass when the vehicle ahead is
    stopped at a crosswalk to permit a pedestrian to cross.
- id: 70
  category: safe_driving_rules
  question: Under what condition are you permitted to pass a vehicle on the right?
  choices:
    A: When the vehicle ahead is driving too slowly in the left lane of a two-lane
      road
    B: When the vehicle you are passing is making a left turn and there is sufficient
      paved space to the right
    C: By driving onto the unpaved shoulder of the road
    D: By using a designated bike lane
  answer: B
  explanation: You may pass on the right if the vehicle you are passing is making
    or has signaled for a left turn, provided there is sufficient space to the right
    without leaving the paved portion of the road or driving in a bike lane.
- id: 71
  category: sharing_the_road
  question: If another driver starts to pass you, how should you assist them?
  choices:
    A: Speed up so they can tuck in behind you
    B: Flash your headlights to let them know it is safe
    C: Use hand signals to wave them forward
    D: Stay to the right and adjust your speed to let them move back into the lane
  answer: D
  explanation: When another driver starts to pass, stay to the right. You can help
    the other driver pass you safely by checking oncoming traffic and adjusting your
    speed to let the vehicle move back into the right lane as soon as possible.
- id: 72
  category: safe_driving_rules
  question: What does the law say about using your hands or lights to signal other
    drivers when it is safe to pass you?
  choices:
    A: It is recommended at night
    B: It is required when driving a large truck
    C: The law prohibits flashing any of your signals at drivers to let them know
      when to pass
    D: It is allowed only on rural two-lane highways
  answer: C
  explanation: Do not use your hands or lights to signal other drivers when to pass.
    The law prohibits flashing any of your signals at drivers to let them know when
    to pass.
- id: 73
  category: defensive_driving
  question: Which of the following is a situation where you should increase your following
    distance?
  choices:
    A: When driving on dry, well-paved roads
    B: When following a driver who cannot see you, such as a large truck
    C: When you are driving a smaller, lighter vehicle
    D: When you are preparing to make a right turn
  answer: B
  explanation: You should increase your following distance when following drivers
    who cannot see you. The drivers of large vehicles may not be able to see you when
    you are directly behind them.
- id: 74
  category: safe_driving_rules
  question: 'If you are driving on a freeway at a speed below the normal flow of traffic,
    you must:'
  choices:
    A: Drive in the left lane.
    B: Drive in the right lane.
    C: Turn on your hazard lights.
    D: Drive on the shoulder.
  answer: B
  explanation: According to the manual's Freeway Driving section, 'If you drive at
    a speed below the flow of traffic, you must use the right lane.'
- id: 75
  category: defensive_driving
  question: How should you alert drivers behind you if you spot traffic slowing ahead
    on the freeway?
  choices:
    A: Turn on your hazard lights.
    B: Use hand-and-arm signals.
    C: Lightly tap your brake pedal several times.
    D: Honk your horn repeatedly.
  answer: C
  explanation: The manual advises, 'If you spot traffic slowing ahead, lightly tap
    your brake pedal several times to alert drivers behind you.'
- id: 76
  category: signs_and_signals
  question: What should you do if you approach a freeway on-ramp meter that is dark
    and not in use?
  choices:
    A: Treat it as a four-way stop.
    B: Stop and wait for the light to turn green.
    C: Yield to the vehicle in the lane next to you.
    D: Do not stop and proceed onto the freeway.
  answer: D
  explanation: 'The manual states regarding ramp meters: ''Ramp meters will appear
    dark when not in use. Do not stop at a dark ramp meter.'''
- id: 77
  category: safe_driving_rules
  question: When leaving a freeway, when should you begin slowing down to the posted
    advisory speed?
  choices:
    A: While you are still in the right lane of the freeway.
    B: Once you are on the exit ramp.
    C: At least 500 feet before the exit.
    D: Only when you see the stop sign at the end of the ramp.
  answer: B
  explanation: 'The manual instructs: ''Maintain your speed until you are off the
    freeway. Once on the exit ramp, begin slowing to the posted advisory speed.'''
- id: 78
  category: safe_driving_rules
  question: If you experience vehicle trouble on a freeway and move to the shoulder,
    where is the safest place to stay?
  choices:
    A: Walking along the freeway to find help.
    B: Standing directly behind your vehicle to warn others.
    C: In or near your vehicle on the side away from traffic.
    D: In the nearest traffic lane to flag down a passing car.
  answer: C
  explanation: 'The manual states: ''If possible, it is better to stay in or near
    your vehicle on the side away from traffic. Walking along a freeway is dangerous.'''
- id: 79
  category: sharing_the_road
  question: What must you do if you are towing a trailer and traffic is stacking up
    behind you?
  choices:
    A: Speed up to match the flow of traffic.
    B: Pull off at the first safe turnout to let the traffic pass.
    C: Turn on your hazard lights and continue at your current speed.
    D: Wave the vehicles behind you to pass on the right.
  answer: B
  explanation: 'The manual states: ''If traffic is stacking up behind you, pull off
    at the first safe turnout to let the traffic pass.'''
- id: 80
  category: penalties_and_points
  question: What is the maximum penalty for a third offense of towing more than one
    vehicle or trailer behind a passenger vehicle?
  choices:
    A: Up to a $1,000 fine.
    B: Up to a $2,000 fine.
    C: Up to a $2,500 fine and six months in jail.
    D: License suspension for one year.
  answer: C
  explanation: The manual lists the fines for towing violations. For a 3rd offense,
    the penalty is 'Up to $2,500 &, six months in jail.'
- id: 81
  category: safe_driving_rules
  question: If your vehicle is moving in traffic, what is the minimum distance you
    must use your turn signal before making a turn or lane change?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: 'The manual states: ''If your vehicle is moving in traffic, use your
    turn signal at least 100 feet before the turn or lane change.'''
- id: 82
  category: safe_driving_rules
  question: Under what conditions are you permitted to use hand-and-arm signals?
  choices:
    A: Only at night when visibility is poor.
    B: Any time you are driving a wide or long vehicle.
    C: In daylight when you can clearly see people and vehicles at a distance of 1,000
      feet.
    D: Only when your vehicle's turn signal lights are broken.
  answer: C
  explanation: 'The manual states: ''Only use hand-and-arm signals in daylight and
    when you can clearly see people and vehicles at a distance of 1,000 feet.'''
- id: 83
  category: sharing_the_road
  question: When preparing to make a turn, what is the rule regarding bicycle lanes?
  choices:
    A: You must move into the bicycle lane 100 feet before turning.
    B: You may turn across a bicycle lane, but do not move into it in preparation
      for a turn.
    C: You are never allowed to cross a bicycle lane.
    D: You should honk to clear the bicycle lane before moving into it.
  answer: B
  explanation: 'The manual explicitly states: ''You may turn across a bicycle lane,
    but do not move into a bicycle lane in preparation for a turn.'''
- id: 84
  category: defensive_driving
  question: What should you do if you are at an intersection and realize you are in
    the wrong lane to turn?
  choices:
    A: Quickly change lanes before the light turns green.
    B: Stop and wait for traffic to clear so you can change lanes.
    C: Go to the next intersection to turn.
    D: Make the turn anyway but use your hazard lights.
  answer: C
  explanation: 'The manual advises: ''If you are at an intersection and in the wrong
    lane to turn, go to the next intersection. It is safer to drive around the block
    than it is to risk a collision due to a last-minute lane or direction change.'''
- id: 85
  category: safe_driving_rules
  question: When making a left turn from a two-way road onto another two-way road,
    where should you position your vehicle just before the turn?
  choices:
    A: In the lane nearest the right curb.
    B: In the lane just to the right of the center line.
    C: In the center of the intersection.
    D: In the bicycle lane.
  answer: B
  explanation: 'The manual states: ''Left Turns: On a two-way road, approach the turn
    with your vehicle in the lane just to the right of the center line.'''
- id: 86
  category: safe_driving_rules
  question: In which of the following situations is it illegal to make a left turn
    against a red light?
  choices:
    A: Turning from a one-way road onto a one-way road.
    B: Turning from a two-way road onto a one-way road.
    C: Turning from a one-way road onto a two-way road.
    D: Turning from a dual left turn lane onto a one-way road.
  answer: C
  explanation: 'The manual states regarding a ''Left Turn: One-Way Road to Two-Way
    Road'' that ''You cannot make this turn against a red light.'' It also notes it
    is illegal to execute a left turn onto a two-way road against a red light.'
- id: 87
  category: defensive_driving
  question: If you accidentally start entering a freeway the wrong way, what is the
    first thing you should do?
  choices:
    A: Accelerate to get off the ramp quickly.
    B: Immediately pull off to the side of the ramp and stop.
    C: Put your vehicle in reverse and back up into the cross street.
    D: Honk your horn to warn oncoming traffic while you turn around.
  answer: B
  explanation: 'The manual states: ''If you start to enter a freeway the wrong way,
    a DO NOT ENTER or WRONG WAY sign will warn you of your mistake. Immediately pull
    off to the side of the ramp and stop.'''
- id: 88
  category: safe_driving_rules
  question: Where are U-turns prohibited within city limits?
  choices:
    A: Any location where your vehicle cannot be seen by traffic from either direction
      within 500 feet
    B: Any location where your vehicle cannot be seen by traffic from either direction
      within 1,000 feet
    C: Any location where your vehicle cannot be seen by traffic from either direction
      within 250 feet
    D: Any location where your vehicle cannot be seen by traffic from either direction
      within 750 feet
  answer: A
  explanation: According to the manual, U-turns are prohibited at any location within
    city limits where your vehicle cannot be seen by traffic coming from either direction
    within 500 feet.
- id: 89
  category: safe_driving_rules
  question: What is the visibility requirement for making a U-turn outside of city
    limits?
  choices:
    A: Your vehicle must be seen by traffic from either direction within 500 feet
    B: Your vehicle must be seen by traffic from either direction within 1,000 feet
    C: Your vehicle must be seen by traffic from either direction within 1,500 feet
    D: Your vehicle must be seen by traffic from either direction within 2,000 feet
  answer: B
  explanation: The manual states that U-turns are prohibited at any location outside
    city limits where your vehicle cannot be seen by traffic coming from either direction
    within 1,000 feet.
- id: 90
  category: safe_driving_rules
  question: At an intersection with no signs or signals, which vehicle must you yield
    the right of way to?
  choices:
    A: Any vehicle approaching from your left
    B: Any vehicle in the intersection or approaching from your right
    C: The vehicle traveling at the highest speed
    D: Any vehicle attempting to make a left turn
  answer: B
  explanation: As you approach an intersection with no signs or signals, you must
    yield the right of way to any vehicle in the intersection or approaching from
    your right.
- id: 91
  category: safe_driving_rules
  question: If you are driving on a road that ends at a 'T' intersection with no signs
    or signals, what must you do?
  choices:
    A: Yield to drivers on the through road
    B: Take the right of way since you are turning
    C: Stop and wait for a green light
    D: Honk to warn cross traffic before proceeding
  answer: A
  explanation: If you are the driver on a road that ends at a 'T' intersection with
    no signs or signals, you must yield to drivers on the through road.
- id: 92
  category: safe_driving_rules
  question: What should you do if an emergency vehicle approaches while you are driving
    inside a roundabout?
  choices:
    A: Stop immediately inside the roundabout to let them pass
    B: Move through and exit the roundabout, then pull over to the right shoulder
    C: Pull over to the center island of the roundabout
    D: Speed up and exit as quickly as possible without signaling
  answer: B
  explanation: Never stop while inside the roundabout. Instead, move through and exit
    the roundabout. Once you exit, pull over to the right shoulder and allow emergency
    vehicles to pass.
- id: 93
  category: safe_driving_rules
  question: 'When driving in a multi-lane roundabout, it is illegal to:'
  choices:
    A: Use your right turn signal when exiting
    B: Maintain your lane position
    C: Pass or drive beside a truck
    D: Yield to traffic inside the roundabout before entering
  answer: C
  explanation: Do not attempt to overtake or pass any vehicles, especially large trucks
    and trailers within the roundabout. It is illegal to pass or drive beside a truck
    within the roundabout.
- id: 94
  category: sharing_the_road
  question: When turning at an intersection that has a traffic signal, how far away
    must a pedestrian be before you begin to turn?
  choices:
    A: Past the lane you are turning into, plus the next lane
    B: Six feet or more from the lane you are turning into
    C: Ten feet or more from your vehicle
    D: Completely on the sidewalk
  answer: B
  explanation: If you are turning at an intersection that has a traffic signal, before
    you begin to turn, the pedestrian must be six feet or more from the lane you are
    turning into.
- id: 95
  category: sharing_the_road
  question: When turning at an intersection that does NOT have a traffic signal, when
    is it safe to turn regarding pedestrians?
  choices:
    A: When the pedestrian is six feet from your lane
    B: When the pedestrian is past the lane you are turning into, plus the next lane
    C: As soon as the pedestrian steps off the curb
    D: When the pedestrian reaches the center island
  answer: B
  explanation: If you are turning at an intersection that doesn't have a traffic signal,
    before you begin to turn, the pedestrian must be past the lane you are turning
    into, plus the next lane.
- id: 96
  category: sharing_the_road
  question: What is the minimum width of an unmarked crosswalk?
  choices:
    A: Four feet
    B: Six feet
    C: Eight feet
    D: Ten feet
  answer: B
  explanation: An unmarked crosswalk is at least six feet wide and exists even if
    there is no sidewalk or shoulder.
- id: 97
  category: sharing_the_road
  question: 'If a blind pedestrian carrying a white cane is crossing the road, you
    must:'
  choices:
    A: Honk your horn to let them know you are there
    B: Yield until they are six feet past your lane
    C: Remain stopped until the person has crossed the entire road
    D: Slowly drive around them if there is room
  answer: C
  explanation: You must give the right of way to a pedestrian who is blind carrying
    a white cane or using a guide dog. Remain stopped until the person has crossed
    the entire road, even if you have a green light.
- id: 98
  category: safe_driving_rules
  question: At a four-way stop intersection, if two drivers stop at the same time
    and are in doubt of who goes first, who should yield?
  choices:
    A: The driver on the right yields to the driver on the left
    B: The driver turning right yields to the driver turning left
    C: The driver on the left yields to the driver on the right
    D: The larger vehicle has the right of way
  answer: C
  explanation: At intersections with stop signs in all four directions, it is common
    courtesy to allow the driver who stops first to go first. When in doubt, yield
    to the driver on your right.
- id: 99
  category: sharing_the_road
  question: Why is it against the law to pass a vehicle stopped at a crosswalk?
  choices:
    A: The stopped vehicle might suddenly back up
    B: The driver may be waiting for a pedestrian to cross the road
    C: You might block an emergency vehicle
    D: The stopped vehicle is likely broken down
  answer: B
  explanation: Do not pass a vehicle stopped at a crosswalk, it is against the law.
    The driver may be waiting for a pedestrian to cross the road.
- id: 100
  category: sharing_the_road
  question: How should you interact with a person riding a bicycle within a roundabout?
  choices:
    A: Pass them quickly on the left
    B: Honk to warn them you are passing
    C: Do not pass a person riding a bicycle within the roundabout
    D: Force them to use the sidewalk
  answer: C
  explanation: Allow people riding bicycles that have merged into traffic the full
    travel lane. Do not pass a person riding a bicycle within the roundabout.
- id: 101
  category: safe_driving_rules
  question: What is the general rule for turning from one road to another?
  choices:
    A: Turn from the center lane to the far right lane
    B: Turn from the nearest lane in the direction you are traveling to the nearest
      lane in the direction you want to go
    C: Swing wide to ensure you clear the curb
    D: Always turn into the left-most lane regardless of your starting position
  answer: B
  explanation: The general rule for turning is to turn from the nearest lane in the
    direction you are traveling to the nearest lane in the direction you want to go.
    Avoid swinging wide or changing lanes while turning.
- id: 102
  category: sharing_the_road
  question: Are you required to stop for a pedestrian in a crosswalk if they are on
    the other side of a safety island?
  choices:
    A: Yes, you must always stop for any pedestrian in a crosswalk
    B: Yes, unless you have a green light
    C: No, you are not required to stop if they are on the other side of a safety
      island
    D: No, unless they are carrying a white cane
  answer: C
  explanation: 'The manual states: ''You are not required to stop if the pedestrian
    is in a crosswalk on the other side of a safety island.'''
- id: 103
  category: sharing_the_road
  question: What must you do if a person using a white cane or guide dog is crossing
    the road at a green light?
  choices:
    A: Honk to alert them of the green light.
    B: Proceed carefully around them.
    C: Remain stopped until the person has crossed the entire road.
    D: Yield only if they are in a marked crosswalk.
  answer: C
  explanation: The manual states you must remain stopped until the person has crossed
    the entire road, even if you have a green light.
- id: 104
  category: safe_driving_rules
  question: What is the reduced speed limit in a designated school speed zone?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 30 mph
  answer: B
  explanation: A school speed zone is an area where a reduced speed of 20 mph applies
    and is defined by school speed signs.
- id: 105
  category: signs_and_signals
  question: If a school speed limit sign specifies 'School Hours,' during what times
    does the reduced speed limit apply on a day school is in session?
  choices:
    A: 7 a.m. to 4 p.m.
    B: 8 a.m. to 5 p.m.
    C: 7 a.m. to 5 p.m.
    D: 8 a.m. to 4 p.m.
  answer: C
  explanation: The School Hours Speed Limit Sign applies between the hours of 7 a.m.
    and 5 p.m. on a day school is in session.
- id: 106
  category: safe_driving_rules
  question: According to the manual, which of the following situations means 'children
    are present' at a school speed zone?
  choices:
    A: Children are playing in a nearby fenced schoolyard.
    B: Children are waiting at a crosswalk.
    C: A school bus is parked in the school parking lot.
    D: It is between 8 a.m. and 3 p.m. on a weekday.
  answer: B
  explanation: The manual defines 'Children are present' as children waiting at a
    crosswalk, occupying or walking within a crosswalk, or when a traffic patrol member
    is present to assist children at a crosswalk.
- id: 107
  category: sharing_the_road
  question: When are you permitted to drive across a bike lane?
  choices:
    A: When preparing for a turn.
    B: When passing a slower vehicle on the right.
    C: When turning or entering or leaving an alley, driveway, or private road.
    D: You are never permitted to cross a bike lane.
  answer: C
  explanation: You may cross a bike lane when turning or when entering or leaving
    an alley, driveway, or private road, but you may not move into or travel in a
    bike lane in preparation for a turn.
- id: 108
  category: sharing_the_road
  question: What is required when passing a person on a bicycle traveling in your
    lane at speeds greater than 35 mph?
  choices:
    A: You must honk your horn before passing.
    B: You may only pass if you leave enough distance to prevent contact if the person
      were to fall.
    C: You must change lanes completely to pass the bicycle.
    D: You are not allowed to pass bicycles at speeds greater than 35 mph.
  answer: B
  explanation: At speeds greater than 35 mph, you may only pass a person on a bicycle
    traveling in your lane if you leave enough distance to prevent contact with the
    person riding a bicycle if they were to fall.
- id: 109
  category: signs_and_signals
  question: What must you do when stopped at a red traffic signal with a green painted
    bike box in your lane?
  choices:
    A: Stop inside the bike box to prevent bicycles from cutting in front of you.
    B: Stop behind the bike box.
    C: Make a right turn on red after yielding to bicycles.
    D: Pull halfway into the bike box to trigger the traffic light sensor.
  answer: B
  explanation: As a driver, you must stop for a traffic signal behind the bike box.
    Do not stop in the box. Additionally, no right turns are allowed at these intersections
    when the traffic signal is red.
- id: 110
  category: signs_and_signals
  question: What does a 'sharrow' painted on the road indicate?
  choices:
    A: The lane is for bicycles only.
    B: The lane is shared and people riding bicycles may be in the road.
    C: Bicycles must yield to motor vehicles in this lane.
    D: The lane is ending and bicycles must merge right.
  answer: B
  explanation: A sharrow indicates that the lane is shared and people riding bicycles
    may be in the road. It is indicated by two chevrons above a bicycle symbol.
- id: 111
  category: defensive_driving
  question: Why should you be extra cautious before turning in front of an oncoming
    motorcycle with its turn signal on?
  choices:
    A: Motorcycles always have the right-of-way at intersections.
    B: Turn signals on some motorcycles do not automatically cancel and the rider
      may have forgotten to turn it off.
    C: Motorcycles turn faster than other vehicles.
    D: Motorcycle turn signals are often wired backwards.
  answer: B
  explanation: Turn signals do not automatically cancel on some motorcycles and the
    rider may forget to turn the signal off. You must be sure the rider is actually
    slowing to turn before making your move.
- id: 112
  category: sharing_the_road
  question: Is it legal to share a lane with a person riding a motorcycle or moped?
  choices:
    A: Yes, if the lane is wide enough for both vehicles.
    B: Yes, but only when traffic is stopped or moving very slowly.
    C: No, it is against the law to share a lane with a motorcycle or moped.
    D: No, unless the motorcycle rider signals that it is safe to do so.
  answer: C
  explanation: 'The manual explicitly states: ''It is against the law to share a lane
    with a person riding a motorcycle or moped. When passing, you must allow them
    a full lane.'''
- id: 113
  category: vehicle_information
  question: Compared to smaller vehicles traveling at the same speed, how much distance
    do large vehicles typically take to stop?
  choices:
    A: About the same distance
    B: About twice the distance
    C: About three times the distance
    D: About four times the distance
  answer: C
  explanation: Large vehicles take about three times the distance to stop than smaller
    vehicles traveling at the same speed.
- id: 114
  category: sharing_the_road
  question: How can you tell if you are driving in the side blind spot of a large
    vehicle?
  choices:
    A: You are within 50 feet of the rear bumper.
    B: You cannot see the driver in the side mirror of the large vehicle.
    C: The large vehicle is traveling faster than 55 mph.
    D: You can see the large vehicle's turn signal flashing.
  answer: B
  explanation: Large vehicles have larger blind spots on both sides. If you can’t
    see the driver in the side mirror of the large vehicle, the driver can’t see you.
- id: 115
  category: safe_driving_rules
  question: When passing a large vehicle, when is it safe to pull back into the lane
    in front of it?
  choices:
    A: As soon as your rear bumper clears the front of the large vehicle.
    B: When you can see the entire front of the large vehicle in your rearview mirror.
    C: When the driver of the large vehicle flashes their headlights.
    D: After you have maintained your passing speed for at least 10 seconds.
  answer: B
  explanation: When passing a large vehicle, you should look for the entire front
    of the vehicle in your rearview mirror before pulling in front.
- id: 116
  category: defensive_driving
  question: What should you do if you see a pilot vehicle in oncoming traffic?
  choices:
    A: Pull completely off the road and stop.
    B: Flash your headlights to acknowledge the driver.
    C: Reduce your speed and position your vehicle as far to the right as possible
      within your lane.
    D: Move into the center turn lane to give them extra room.
  answer: C
  explanation: If you see a pilot vehicle in oncoming traffic, reduce your speed and
    position your vehicle as far to the right as possible, while staying in your lane.
- id: 117
  category: safe_driving_rules
  question: When must you stop for a school bus with flashing red lights if you are
    on a divided highway separated by an unpaved median strip?
  choices:
    A: You must always stop, regardless of which side of the road you are on.
    B: You must stop only if you are on the same side of the road as the bus.
    C: You must stop only if there are children crossing the median.
    D: You do not have to stop on a divided highway.
  answer: B
  explanation: If you are on a divided highway with two roads separated by an unpaved
    median strip or barrier, you must stop only if you are on the same side of the
    road as the bus.
- id: 118
  category: sharing_the_road
  question: If you are on a divided highway with a painted median strip and a school
    bus is stopped with flashing red lights, who must stop?
  choices:
    A: Only traffic on the same side as the bus
    B: All lanes of traffic
    C: Only traffic behind the bus
    D: No traffic needs to stop
  answer: B
  explanation: A painted median strip or turn lane does not create two separate roads.
    In this case, all lanes of traffic must stop for a school bus with flashing red
    lights.
- id: 119
  category: sharing_the_road
  question: When must you yield to a public transit bus that is pulling back into
    a traffic lane?
  choices:
    A: Whenever the bus has its hazard lights on
    B: When the driver signals to re-enter and an electric 'yield' sign flashes on
      the back
    C: Only if you are driving under the speed limit
    D: You are never required to yield to public transit buses
  answer: B
  explanation: Vehicles approaching from the rear must yield when a bus driver signals
    to re-enter a traffic lane and there is an electric sign flashing 'yield' on the
    back of the bus.
- id: 120
  category: signs_and_signals
  question: What does a slow-moving vehicle emblem look like?
  choices:
    A: A yellow triangle with a black border
    B: A reflective red border with a fluorescent orange center
    C: A white square with a red circle in the middle
    D: A fluorescent green diamond with a black border
  answer: B
  explanation: The slow-moving vehicle emblem contains a reflective, red border and
    a fluorescent orange center.
- id: 121
  category: vehicle_information
  question: A red flag at least 12 inches square must be shown at the end of any load
    that extends how far beyond the rear of a vehicle?
  choices:
    A: 2 feet or more
    B: 3 feet or more
    C: 4 feet or more
    D: 5 feet or more
  answer: C
  explanation: A red flag, at least 12 inches square, must be shown at the end of
    any load that extends 4 feet or more beyond the rear of the vehicle.
- id: 122
  category: vehicle_information
  question: How far may a load extend beyond the sides of the right fenders on a passenger
    vehicle?
  choices:
    A: It may not extend beyond the fenders at all
    B: Up to 6 inches
    C: Up to 12 inches
    D: Up to 2 feet
  answer: B
  explanation: Loads may not extend more than 6 inches beyond the sides of the right
    fenders on passenger vehicles.
- id: 123
  category: sharing_the_road
  question: If you are not a member of a funeral procession, what is the rule regarding
    driving among the procession vehicles?
  choices:
    A: You may join the procession if you turn on your hazard lights
    B: You may drive between vehicles only to make a right turn
    C: It is against the law to join or drive between vehicles in the procession
    D: You may pass the procession if you honk your horn
  answer: C
  explanation: If you are not a member of the funeral procession, it is against the
    law for you to join or drive between vehicles in the procession.
- id: 124
  category: safe_driving_rules
  question: If you approach a motor vehicle stopped with flashing lights on a multi-lane
    road and you do not change lanes, how much must you slow down?
  choices:
    A: At least 5 mph under the posted speed limit
    B: At least 10 mph under the posted speed limit
    C: To exactly 20 mph
    D: To exactly 15 mph
  answer: A
  explanation: If you do not change lanes when approaching a stopped vehicle with
    flashing lights, you may slow down by at least 5 miles per hour under the posted
    speed limit.
- id: 125
  category: safe_driving_rules
  question: After an emergency vehicle with its lights or siren on has passed you,
    what is the minimum distance you must stay behind it?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: D
  explanation: After the emergency vehicle passes, you must stay at least 500 feet
    behind the vehicle.
- id: 126
  category: safe_driving_rules
  question: When being stopped by a police vehicle, where should you avoid stopping?
  choices:
    A: On the right side of the road
    B: In an intersection or the center median of a highway
    C: In a designated parking space
    D: On a gravel shoulder
  answer: B
  explanation: When stopped by police, drive as close as you safely can to the right
    side of the road. Do not stop in an intersection or pull into the center median
    of a highway.
- id: 127
  category: penalties_and_points
  question: What happens to traffic fines in all work zones?
  choices:
    A: They are reduced by half
    B: They remain the same as normal roads
    C: They are doubled
    D: They are tripled
  answer: C
  explanation: Traffic fines are doubled in all work zones.
- id: 128
  category: safe_driving_rules
  question: When do temporary speed limits posted in a work zone apply?
  choices:
    A: Only when workers are visible
    B: Only during daylight hours
    C: At all times, even if workers are not visible
    D: Only when heavy machinery is operating
  answer: C
  explanation: The temporary speed posted in a work zone applies at all times, even
    if workers are not visible.
- id: 129
  category: safe_driving_rules
  question: When required to stop at a railroad crossing with no stop line, how far
    from the nearest rail must you stop?
  choices:
    A: At least 5 feet
    B: At least 10 feet
    C: At least 15 feet
    D: At least 25 feet
  answer: C
  explanation: When required to stop, do so at the stop line. If there is no stop
    line, stop at least 15 feet from the nearest rail.
- id: 130
  category: defensive_driving
  question: If your vehicle gets stuck on railroad tracks and a train is approaching,
    in which direction should you move after getting out of the vehicle?
  choices:
    A: Parallel to the tracks in the same direction the train is moving
    B: At a 45-degree angle from the tracks in the direction of the train
    C: Directly away from the tracks at a 90-degree angle
    D: At a 45-degree angle from the tracks away from the train
  answer: B
  explanation: If a train approaches, move at a 45 degree angle from the tracks in
    the direction of the train so you are not hit with debris.
- id: 131
  category: safe_driving_rules
  question: If you are pulled over by the police and it is dark outside, what should
    you do before the officer approaches?
  choices:
    A: Turn off all your lights
    B: Turn on your high beams
    C: Turn on the vehicle's interior light
    D: Step out of the vehicle with a flashlight
  answer: C
  explanation: If it is dark, turn on the vehicle’s interior light after stopping
    and before the officer approaches.
- id: 132
  category: sharing_the_road
  question: What should you do if you are starting through an intersection and see
    an ambulance approaching from behind with its siren on?
  choices:
    A: Stop immediately in the intersection
    B: Drive through the intersection, pull to the right and stop
    C: Pull to the right inside the intersection and stop
    D: Speed up to clear the intersection and keep driving
  answer: B
  explanation: You must not stop in an intersection for an emergency vehicle. You
    must drive through the intersection, pull to the right, and stop.
- id: 133
  category: safe_driving_rules
  question: What should you do if your vehicle gets stuck on railroad tracks and a
    train is approaching?
  choices:
    A: Run directly away from the tracks in the same direction the train is moving.
    B: Move at a 45-degree angle from the tracks in the direction of the train.
    C: Stay in the vehicle and call 911 immediately.
    D: Stand next to the vehicle and wave your arms to alert the train.
  answer: B
  explanation: If a train approaches, move at a 45 degree angle from the tracks in
    the direction of the train so you are not hit with debris.
- id: 134
  category: sharing_the_road
  question: 'When a streetcar or light rail train stops to pick up or drop off passengers,
    you should:'
  choices:
    A: Honk your horn and pass on the right.
    B: Pass carefully at a speed of 10 mph or less.
    C: Stay behind it until it moves again or the people are safely away.
    D: Change lanes and accelerate to pass quickly.
  answer: C
  explanation: If a streetcar or train stops to pick up or drop off people, stay behind
    it until it moves again or the people are safely away.
- id: 135
  category: sharing_the_road
  question: Is it safe to turn in front of a streetcar traveling in the same direction
    as you from an adjacent lane?
  choices:
    A: Yes, if the streetcar is stopped.
    B: Yes, if you use your turn signal.
    C: No, never turn in front of a streetcar from an adjacent lane.
    D: No, unless you are driving a commercial vehicle.
  answer: C
  explanation: Never turn in front of a streetcar or train traveling in the same direction
    as you from an adjacent lane, even if the streetcar or train is stopped.
- id: 136
  category: safe_driving_rules
  question: When parallel parking, how close must your vehicle be to the curb?
  choices:
    A: No more than 6 inches
    B: No more than 12 inches
    C: No more than 18 inches
    D: No more than 24 inches
  answer: B
  explanation: Park parallel to and no more than 12 inches from the curb.
- id: 137
  category: safe_driving_rules
  question: How should you turn your wheels when parking downhill against a curb?
  choices:
    A: Toward the travel lane
    B: Straight ahead
    C: Toward the curb
    D: Toward the edge of the road
  answer: C
  explanation: When parking downhill against a curb, turn your wheels toward the curb
    to prevent your vehicle from rolling downhill.
- id: 138
  category: penalties_and_points
  question: What is the minimum fine for parking in a Disabled Person parking space
    without a valid permit?
  choices:
    A: $50
    B: $100
    C: $165
    D: $250
  answer: C
  explanation: Fines begin at $165 and go up to $1,000 if you are not a Disabled Person
    Parking Permit holder.
- id: 139
  category: safe_driving_rules
  question: You cannot stop or park your vehicle within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: A
  explanation: You cannot stop or park your vehicle within 10 feet of a fire hydrant.
- id: 140
  category: safe_driving_rules
  question: It is illegal to park within how many feet of a marked or unmarked crosswalk
    at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 50 feet
  answer: C
  explanation: You cannot stop or park your vehicle within 20 feet of a marked or
    unmarked crosswalk at an intersection.
- id: 141
  category: safe_driving_rules
  question: 'You must not park within 50 feet of a traffic signal or sign if:'
  choices:
    A: You are on a multi-lane highway.
    B: Your vehicle hides the signal or sign from view.
    C: The speed limit is over 35 mph.
    D: You are parking for more than 2 hours.
  answer: B
  explanation: You cannot stop or park your vehicle within 50 feet of a traffic signal
    or sign if your vehicle hides the signal or sign from view.
- id: 142
  category: defensive_driving
  question: If you must park on the shoulder of a highway due to an emergency and
    your vehicle cannot be seen from 200 feet, what must you do?
  choices:
    A: Turn on your high beam headlights.
    B: Warn approaching traffic with flags, flares, or signs placed at least 200 feet
      away.
    C: Stand in the roadway and wave your arms.
    D: Leave the vehicle running with the doors open.
  answer: B
  explanation: If your vehicle cannot be seen from 200 feet in each direction, you
    need to warn approaching traffic. This can be done with flags, flares, signs,
    signals or flaggers placed at least 200 feet from your vehicle in each direction.
- id: 143
  category: safe_driving_rules
  question: 'If you must leave your vehicle unattended during an emergency stop, you
    should:'
  choices:
    A: Leave the engine running to keep the battery charged.
    B: Leave the keys in the ignition for the tow truck driver.
    C: Turn off the engine, remove the key, set the brakes, and turn on hazard lights.
    D: Turn off the hazard lights to save the battery.
  answer: C
  explanation: If you must leave your vehicle unattended, turn off the engine, remove
    the key, set the brakes, and turn on your hazard lights.
- id: 144
  category: driver_responsibility
  question: Which of the following is a rule for properly wearing a safety belt in
    Oregon?
  choices:
    A: You may put the shoulder strap under your arm if it is uncomfortable.
    B: You may place the shoulder strap behind your back.
    C: You should leave a little slack in the lap portion for comfort.
    D: Never put the shoulder strap under your arm or behind your back.
  answer: D
  explanation: Do not leave slack in the lap or shoulder portion of the belt. Never
    put the shoulder strap under your arm or behind your back.
- id: 145
  category: safe_driving_rules
  question: When leaving a parked or stopped position, what is the safest way to re-enter
    traffic?
  choices:
    A: Check your mirrors and pull out quickly.
    B: Check your blind spots and mirrors, and yield to all other traffic.
    C: Signal and pull into traffic, as other drivers must yield to you.
    D: Honk your horn before pulling out.
  answer: B
  explanation: When leaving a parked or stopped position, check your blind spots and
    mirrors, and yield to all other traffic.
- id: 146
  category: signs_and_signals
  question: What is the purpose of the Emergency Notification System (ENS) sign at
    a railroad crossing?
  choices:
    A: To warn drivers of an approaching train.
    B: To notify the railroads of an obstruction on the tracks so they can alert incoming
      trains.
    C: To indicate the speed limit for trains crossing the road.
    D: To provide instructions on how to cross the tracks safely.
  answer: B
  explanation: Look for an Emergency Notification System (ENS) sign located on a post
    at the crossing near the tracks to notify the railroads of the obstruction in
    the tracks so they can alert incoming trains.
- id: 147
  category: safe_driving_rules
  question: Until what age must infants ride in a rear-facing child safety seat?
  choices:
    A: 1 year of age
    B: 2 years of age
    C: 3 years of age
    D: 4 years of age
  answer: B
  explanation: According to the manual, infants must ride rear-facing until they reach
    two years of age.
- id: 148
  category: safe_driving_rules
  question: When is a child passenger no longer required to be restrained in an approved
    child safety seat?
  choices:
    A: When they are 6 years of age or 4 feet tall
    B: When they are 8 years of age or at least 4 feet 9 inches in height
    C: When they reach 60 pounds
    D: When they turn 10 years old
  answer: B
  explanation: Child passengers must be restrained in approved child safety seats
    until they are 8 years of age or at least 4 feet 9 inches in height, and the adult
    belt fits them correctly.
- id: 149
  category: defensive_driving
  question: Which of the following is true regarding your options to avoid a collision?
  choices:
    A: You can usually stop the vehicle more quickly than you can turn it.
    B: In most cases, you can turn the vehicle more quickly than you can stop it.
    C: Speeding up is never a safe option to avoid a collision.
    D: You should always slam on your brakes immediately.
  answer: B
  explanation: The manual states that in most cases, you can turn the vehicle more
    quickly than you can stop it, making turning quickly a viable way to avoid a collision.
- id: 150
  category: defensive_driving
  question: What is the proper way to safely get back on the road if your vehicle
    drives off the pavement?
  choices:
    A: Brake hard and turn the steering wheel sharply to the left.
    B: Panic and immediately swerve back onto the pavement.
    C: Slow down and turn the front wheels just enough to get back on the road.
    D: Accelerate to regain traction before steering back onto the road.
  answer: C
  explanation: If you drive off the road, you should not panic or brake hard. Slow
    down, grip the wheel firmly, and turn the front wheels just enough to get back
    on the road without turning sharply.
- id: 151
  category: defensive_driving
  question: If an oncoming vehicle is drifting into your lane, why should you NEVER
    pull into the opposing lane to avoid them?
  choices:
    A: It is illegal to cross the center line under any circumstances.
    B: The oncoming driver may turn back sharply into that lane.
    C: Your vehicle will lose traction on the opposite side of the road.
    D: You will not be able to use your horn or lights effectively.
  answer: B
  explanation: The manual warns to never pull into the opposing lane because the oncoming
    driver may turn back sharply into that lane, risking a head-on collision.
- id: 152
  category: sharing_the_road
  question: What does it mean if a person riding on horseback raises their hand as
    you approach?
  choices:
    A: They are signaling you to pass them quickly.
    B: They are waving to acknowledge your presence.
    C: The animal is frightened and you must stop your vehicle.
    D: You should honk your horn to warn the animal.
  answer: C
  explanation: A raised hand from a person riding on horseback or leading an animal
    means the animal is frightened, and you must stop your vehicle unless stopping
    would cause a collision.
- id: 153
  category: safe_driving_rules
  question: In addition to the time from sunset to sunrise, when else must you turn
    on your headlights?
  choices:
    A: Whenever you are driving on a highway.
    B: When conditions make it difficult to see people or vehicles 1,000 feet ahead.
    C: Only when you are using your windshield wipers.
    D: When visibility is reduced to 500 feet or less.
  answer: B
  explanation: Headlights must be turned on from sunset to sunrise, and at any time
    conditions make it difficult to see people or vehicles 1,000 feet ahead.
- id: 154
  category: safe_driving_rules
  question: At what distance must you dim your high beam headlights when following
    another vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 350 feet
    D: 500 feet
  answer: C
  explanation: You must dim your lights when following another vehicle within 350
    feet to avoid blinding the other driver via their rearview mirror.
- id: 155
  category: defensive_driving
  question: How can you avoid being blinded by the headlight glare of oncoming vehicles
    at night?
  choices:
    A: Look directly at the oncoming vehicle's headlights.
    B: Look a little to the right of oncoming lights and watch the road edge or fog
      line.
    C: Turn on your high beams to counteract the glare.
    D: Close one eye until the vehicle passes.
  answer: B
  explanation: To be less blinded by headlight glare at night, you should look a little
    to the right of oncoming lights and watch the road edge or fog line.
- id: 156
  category: safe_driving_rules
  question: Which headlights should you use when driving in fog, dust, or smoke?
  choices:
    A: High beam headlights
    B: Low beam headlights
    C: Parking lights only
    D: Hazard lights only
  answer: B
  explanation: If you drive into fog, dust, smoke, or any area of low visibility,
    use headlights on low beam because light from high beams will reflect back and
    cause glare.
- id: 157
  category: safe_driving_rules
  question: What vehicle feature should you NOT use when driving in wet conditions
    or on snow and ice?
  choices:
    A: Windshield wipers
    B: Low beam headlights
    C: Defroster
    D: Cruise control
  answer: D
  explanation: The manual explicitly states, "Do not use cruise control in wet conditions"
    and repeats this warning for driving in snow and ice.
- id: 158
  category: vehicle_information
  question: What should you do if your brakes get wet after driving through water?
  choices:
    A: Slam on the brakes repeatedly to dry them off.
    B: Gently apply the brakes while driving slowly until they begin to respond.
    C: Shift into neutral and coast until the brakes dry.
    D: Stop the vehicle immediately and wait for the brakes to dry naturally.
  answer: B
  explanation: If you drive through water and the brakes get wet, you should gently
    apply the brakes while driving slowly until they begin to respond.
- id: 159
  category: defensive_driving
  question: When is a snow or ice-covered road likely to be the most slippery?
  choices:
    A: When the temperature is well below freezing.
    B: When the temperature is near the freezing point.
    C: During the early morning hours before sunrise.
    D: When the sun is shining directly on the ice.
  answer: B
  explanation: The manual advises drivers to be aware that the road is likely to be
    the most slippery when the temperature is near the freezing point rather than
    below freezing.
- id: 160
  category: defensive_driving
  question: What is the correct steering action to take if your vehicle begins to
    skid?
  choices:
    A: Hold the steering wheel perfectly straight.
    B: Steer in the opposite direction of the skid.
    C: Steer in the direction you want the vehicle to go.
    D: Turn the wheel sharply left and right to regain traction.
  answer: C
  explanation: If your vehicle begins to skid, you should stay off the brakes and
    steer in the direction you want the vehicle to go.
- id: 161
  category: vehicle_information
  question: During which months are studded tires generally allowed in Oregon?
  choices:
    A: October 1 through April 30
    B: November 1 through March 31
    C: December 1 through February 28
    D: They are allowed year-round.
  answer: B
  explanation: Studded tires are generally allowed only from November 1 through March
    31 in Oregon.
- id: 162
  category: safe_driving_rules
  question: What is the rule regarding cell phone use for drivers under 18 years of
    age in Oregon?
  choices:
    A: They may use a hands-free accessory.
    B: They can only text while stopped at a red light.
    C: It is illegal to use a cell phone or other mobile electronic device while operating
      a vehicle.
    D: They may use a cell phone only for GPS navigation.
  answer: C
  explanation: The manual states that it is illegal for drivers under 18 years of
    age to use a cell phone or other mobile electronic device while operating a vehicle.
- id: 163
  category: safe_driving_rules
  question: 'Drivers 18 years of age or older who wish to use a cell phone while driving
    must:'
  choices:
    A: Keep the phone in their lap.
    B: Use a hands-free accessory that requires only minimal use of a finger.
    C: Only use the phone while driving under 30 mph.
    D: Pull over to the shoulder to answer any calls.
  answer: B
  explanation: Drivers 18 years of age or older must use a hands-free accessory to
    use a cell phone, and it must only require minimal use of a finger to activate
    or deactivate the device.
- id: 164
  category: penalties_and_points
  question: It is illegal to play a radio or sound system so loud that it can be heard
    from what distance away from your vehicle?
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 200 feet
  answer: B
  explanation: It is illegal to play a radio or other sound system so loud it can
    be heard 50 feet away from your vehicle, as it is important to hear horns and
    sirens.
- id: 165
  category: defensive_driving
  question: What should you do if you encounter an aggressive driver exhibiting "road
    rage"?
  choices:
    A: Speed up to get away from them.
    B: Honk your horn to warn other drivers.
    C: Stay out of the way and do not challenge them.
    D: Try to out-drive them to a safe location.
  answer: C
  explanation: If you see an aggressive driver, stay out of the way. Do not challenge
    them by going faster or trying to out-drive them.
- id: 166
  category: safe_driving_rules
  question: Which of the following is recommended to help you stay awake while driving?
  choices:
    A: Push through to your destination as quickly as possible.
    B: Drink water to prevent dehydration.
    C: Turn up the radio volume to the maximum level.
    D: Keep your eyes fixed straight ahead.
  answer: B
  explanation: To help stay awake, the manual recommends drinking water, as dehydration
    can cause fatigue.
- id: 167
  category: alcohol_drugs_health
  question: 'Under Oregon law, you are presumed to be impaired and can be arrested
    for DUII if your blood alcohol concentration (BAC) is at or above:'
  choices:
    A: 0.04%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: If your blood alcohol concentration is 0.08% or more, Oregon law presumes
    you are impaired.
- id: 168
  category: alcohol_drugs_health
  question: What does Oregon's Implied Consent law mean?
  choices:
    A: You consent to a vehicle search if pulled over.
    B: You agree to take a breath, blood, or urine test when asked by a police officer.
    C: You automatically plead guilty if arrested for DUII.
    D: You consent to paying all fines associated with traffic tickets.
  answer: B
  explanation: Oregon's Implied Consent law means that by driving a motor vehicle,
    you have agreed that you will take a breath, blood, or urine test when asked by
    a police officer.
- id: 169
  category: alcohol_drugs_health
  question: 'If you are under 21 years of age, you will fail a blood alcohol test
    if your blood alcohol concentration is:'
  choices:
    A: 0.02% or more
    B: 0.05% or more
    C: 0.08% or more
    D: Any amount
  answer: D
  explanation: If you are under 21, you will fail the test if you have a blood alcohol
    concentration of any amount due to Oregon's zero tolerance law.
- id: 170
  category: alcohol_drugs_health
  question: According to Oregon's Open Container law, where should any open bottles
    or containers of alcohol be kept in the vehicle?
  choices:
    A: In the glove compartment
    B: Under the driver's seat
    C: In the trunk
    D: In the back seat floorboard
  answer: C
  explanation: Oregon's Open Container law states that any open bottles or containers
    should be in the trunk.
- id: 171
  category: safe_driving_rules
  question: Oregon law prohibits anyone under what age from riding on the hood, fender,
    or in a pickup bed?
  choices:
    A: 16 years of age
    B: 18 years of age
    C: 21 years of age
    D: There is no age limit; it is illegal for everyone.
  answer: B
  explanation: Oregon law prohibits anyone under 18 years of age from riding on the
    hood, fender, running board, or other external part of a vehicle, including a
    pickup bed.
- id: 172
  category: defensive_driving
  question: What is the first thing you should do if you experience a tire blowout
    while driving?
  choices:
    A: Brake hard immediately.
    B: Grip the steering wheel firmly.
    C: Shift into neutral.
    D: Turn on your hazard lights.
  answer: B
  explanation: If you have a blowout, the manual instructs you to first grip the steering
    wheel firmly, then slow down gradually and pull off the road.
- id: 173
  category: defensive_driving
  question: If your brakes stop working while you are driving, which of the following
    actions should you take?
  choices:
    A: Shift to a higher gear.
    B: Turn off the engine immediately.
    C: Pump the brakes to build up pressure.
    D: Pull the parking brake up as fast as possible.
  answer: C
  explanation: If your brakes fail, you should pump the brakes. This may build up
    enough pressure to get them working again.
- id: 174
  category: defensive_driving
  question: What should you do if your vehicle's accelerator sticks?
  choices:
    A: Shift the vehicle to neutral using an open palm.
    B: Turn off the ignition immediately.
    C: Pump the accelerator pedal rapidly.
    D: Shift into reverse.
  answer: A
  explanation: If your accelerator sticks, you should search for an escape path and
    shift the vehicle to neutral using an open palm to avoid shifting into another
    gear.
- id: 175
  category: vehicle_information
  question: Which of the following is a recommended technique to improve gas mileage
    and save fuel?
  choices:
    A: Making rapid starts and sudden stops.
    B: Idling the engine to keep it warm.
    C: Driving steadily and avoiding exceeding posted speed limits.
    D: Taking multiple separate trips for errands.
  answer: C
  explanation: To improve gas mileage or save fuel, the manual recommends driving
    steadily and avoiding exceeding posted speed limits.
- id: 176
  category: safe_driving_rules
  question: What should you do if you receive a text message on your cell phone while
    driving?
  choices:
    A: Read and respond to the text quickly.
    B: Ignore the text until you stop in a safe parking area.
    C: Have a passenger read it to you while you type.
    D: Slow down and read it while keeping one eye on the road.
  answer: B
  explanation: The manual states that if you receive a text on your cell phone while
    driving, you should ignore the text until you stop in a safe parking area.
- id: 177
  category: license_system
  question: A Class C non-commercial driving privilege allows you to drive a vehicle
    of not more than how many pounds?
  choices:
    A: 10,000 pounds
    B: 16,000 pounds
    C: 26,000 pounds
    D: 33,000 pounds
  answer: C
  explanation: A Class C non-commercial driving privilege allows you to drive a vehicle
    of not more than 26,000 pounds that is exempt from commercial driver license (CDL)
    or motorcycle endorsement requirements.
- id: 178
  category: license_system
  question: What is the minimum age required to apply for an instruction permit in
    Oregon?
  choices:
    A: 14 years of age
    B: 15 years of age
    C: 16 years of age
    D: 18 years of age
  answer: B
  explanation: To qualify for a Class C non-commercial driving privilege, you must
    be at least 15 years of age to apply for an instruction permit.
- id: 179
  category: license_system
  question: How many hours of supervised driving experience are required for an applicant
    under 18 who has NOT taken an ODOT-approved traffic safety education course?
  choices:
    A: 40 hours
    B: 50 hours
    C: 80 hours
    D: 100 hours
  answer: D
  explanation: Applicants under 18 must have 100 hours of supervised driving experience,
    or 50 hours of supervised driving experience if they have taken an ODOT-approved
    traffic safety education course.
- id: 180
  category: license_system
  question: 'To count toward your required driving experience, your supervising driver
    must be at least 21 years old and have had valid driving privileges for at least:'
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 5 years
  answer: C
  explanation: Your driving experience only counts if supervised by someone at least
    21 years of age who has had valid driving privileges for at least 3 years.
- id: 181
  category: license_system
  question: Which of the following is NOT allowed when having your photo taken for
    an Oregon driving privilege?
  choices:
    A: Smiling
    B: Wearing a hearing aid
    C: Wearing glasses
    D: Having your hair pulled back
  answer: C
  explanation: Hats, glasses, paint or other temporary substances on your face, or
    contact lenses that change the appearance of the eye are not allowed when having
    your photo taken.
- id: 182
  category: license_system
  question: Which of the following is an acceptable document to prove your identity
    and date of birth?
  choices:
    A: A hospital-issued birth certificate
    B: A baptismal record
    C: A U.S. passport expired for 10 years
    D: A U.S. government-issued birth certificate
  answer: D
  explanation: Acceptable proof includes a U.S. government-issued birth certificate.
    Hospital-issued birth certificates and baptismal records are not acceptable, and
    passports cannot be expired for more than 5 years.
- id: 183
  category: license_system
  question: Which of the following is acceptable proof of your current residence address?
  choices:
    A: Personal mail from a friend
    B: Forwarded mail
    C: A utility hookup order or bill
    D: A magazine subscription without your last name
  answer: C
  explanation: Common proof of address includes a utility hookup order, bill, mortgage
    document, or property tax statement. Personal mail and forwarded mail are not
    acceptable.
- id: 184
  category: license_system
  question: What proof is required to add a "Deaf or hard of hearing" designation
    to your license or permit?
  choices:
    A: A doctor's note
    B: An audiogram from a certified specialist
    C: A form signed by a judge
    D: No proof is required
  answer: D
  explanation: You may request that DMV add a deaf or hard of hearing designation
    on your license or permit. No proof is required.
- id: 185
  category: vehicle_information
  question: What is the minimum required insurance coverage for property damage per
    collision in Oregon?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: C
  explanation: Oregon law requires minimum insurance of $20,000 per collision for
    damage to the property of others.
- id: 186
  category: driver_responsibility
  question: If you are involved in a collision with no injuries, what should you do
    with your vehicle?
  choices:
    A: Leave it exactly where it is until the police arrive.
    B: Move it out of the travel lanes as soon as safely possible.
    C: Drive it home immediately and call the police later.
    D: Abandon the vehicle and walk to the nearest phone.
  answer: B
  explanation: If there are no injuries and vehicles can be safely moved, you must
    move them out of travel lanes as soon as possible.
- id: 187
  category: driver_responsibility
  question: 'You must file a collision report with the DMV within 72 hours if damage
    to any vehicle is greater than $2,500 and:'
  choices:
    A: The collision occurred at night.
    B: The other driver does not have insurance.
    C: Any vehicle is towed from the scene due to damage.
    D: The speed limit was over 55 mph.
  answer: C
  explanation: You must file a collision report within 72 hours if damage to any vehicle
    is greater than $2,500 and any vehicle is towed from the scene due to damage from
    the collision.
- id: 188
  category: driver_responsibility
  question: What must you do if you hit an unoccupied vehicle and cannot find the
    owner?
  choices:
    A: Leave the scene immediately since no one was hurt.
    B: Wait by the vehicle for up to one hour before leaving.
    C: Leave a note with your name, address, and a brief description of what happened.
    D: Call a tow truck to remove the damaged vehicle.
  answer: C
  explanation: If you hit an unoccupied vehicle and cannot find the owner, leave a
    note with your name and address, along with a brief description of what happened.
- id: 189
  category: penalties_and_points
  question: Which of the following is a reason you can lose your driving privileges
    in Oregon?
  choices:
    A: Failing to report a vehicle collision.
    B: Receiving a single parking ticket.
    C: Driving a vehicle older than 20 years.
    D: Forgetting your license at home.
  answer: A
  explanation: Reasons you can lose your driving privilege include failing to report
    a vehicle collision, driving uninsured, and driving under the influence.
- id: 190
  category: penalties_and_points
  question: What program is associated with losing your driving privilege due to too
    many traffic convictions?
  choices:
    A: Traffic Rehabilitation System
    B: Safe Driver Initiative
    C: Driver Improvement Program
    D: Conviction Reduction Program
  answer: C
  explanation: The manual states that you can lose your driving privilege for too
    many traffic convictions under the Driver Improvement Program.
- id: 191
  category: alcohol_drugs_health
  question: Driving under the influence of which of the following can result in the
    loss of your driving privilege?
  choices:
    A: Alcohol only
    B: Drugs only
    C: Prescription medications only
    D: Alcohol, drugs or inhalants
  answer: D
  explanation: You can lose your driving privilege for driving under the influence
    of alcohol, drugs or inhalants.
- id: 192
  category: penalties_and_points
  question: 'You may lose your driving privilege if you fail to comply with:'
  choices:
    A: Jury duty summons
    B: Court fines
    C: Vehicle registration renewal reminders
    D: Neighborhood association rules
  answer: B
  explanation: Failure to comply with court fines is listed as a reason you can lose
    your driving privilege.
- id: 193
  category: penalties_and_points
  question: According to the manual, driving without what type of financial protection
    can cause you to lose your driving privilege?
  choices:
    A: Comprehensive coverage
    B: Uninsured motorist coverage
    C: Insurance (Driving uninsured)
    D: Roadside assistance
  answer: C
  explanation: Driving uninsured is one of the reasons you can lose your driving privilege.
- id: 194
  category: driver_responsibility
  question: If you suspect someone could be a victim of human trafficking and see
    a crime in progress, what should you do first?
  choices:
    A: Approach the trafficker to intervene
    B: Call 911
    C: Follow the vehicle to its destination
    D: Post about it on social media
  answer: B
  explanation: If you suspect someone could be a victim of human trafficking and are
    seeing a crime in progress, the manual instructs you to call 911.
- id: 195
  category: driver_responsibility
  question: 'When reporting a tip about suspected human trafficking, you should provide
    ''actionable information'' such as:'
  choices:
    A: Your personal driving record
    B: The victim's financial history
    C: Descriptions of cars, license plates, and people involved
    D: Your vehicle's registration number
  answer: C
  explanation: Actionable information includes times, dates, location, descriptions
    of cars or trucks involved (make, model, color, license plate), and descriptions
    of people.
- id: 196
  category: driver_responsibility
  question: Why does the manual advise against approaching suspected human traffickers?
  choices:
    A: It is illegal for civilians to speak to traffickers
    B: It is dangerous and could lead to problems in the prosecution of traffickers
    C: Traffickers will usually ask you for money
    D: You might accidentally give them directions
  answer: B
  explanation: Approaching traffickers is not only dangerous for you and their victims
    but could lead to problems in the eventual prosecution of traffickers.
- id: 197
  category: driver_responsibility
  question: 'According to the manual, a minor being sold for sex is:'
  choices:
    A: Only considered a victim if they ask for help
    B: Not considered a victim if they were recruited online
    C: Always a victim of human trafficking
    D: Handled by the local DMV office
  answer: C
  explanation: 'The manual explicitly states: ''A minor being sold for sex is always
    a victim of human trafficking.'''
- id: 198
  category: alcohol_drugs_health
  question: What number should you call to report drunk drivers?
  choices:
    A: 503-945-5000
    B: 503-299-9999
    C: '711'
    D: '911'
  answer: D
  explanation: The Important Contact Information section lists 911 as the number to
    Report Drunk Drivers.
- id: 199
  category: safe_driving_rules
  question: Where can you find Oregon road information according to the manual?
  choices:
    A: OregonDMV.com
    B: TripCheck.com
    C: The TAT app
    D: The Vital Records office
  answer: B
  explanation: The Important Contact Information section lists TripCheck.com for Road
    Information.
- id: 200
  category: license_system
  question: If you need to contact the DMV from outside the Portland area, which number
    should you use?
  choices:
    A: 503-299-9999
    B: 503-945-5000
    C: 971-673-1190
    D: 1-888-3737-888
  answer: B
  explanation: The contact number for the DMV outside the Portland area is 503-945-5000.
- id: 201
  category: license_system
  question: What service is available statewide for deaf and hard of hearing individuals
    to contact the DMV?
  choices:
    A: TripCheck.com
    B: Statewide Relay 711
    C: The National Human Trafficking Hotline
    D: ODOT Nondiscrimination team
  answer: B
  explanation: The manual lists 'TDD (deaf and hard of hearing).......................Statewide
    Relay 711' in the contact information.
- id: 202
  category: driver_responsibility
  question: What app does the manual recommend downloading for red flag indicators
    of human trafficking?
  choices:
    A: The TripCheck app
    B: The TAT app
    C: The ODOT app
    D: The DMV Now app
  answer: B
  explanation: 'The manual advises: ''For red flag indicators of human trafficking
    and more information, download the TAT app today.'''
- id: 203
  category: license_system
  question: If you need information regarding an Oregon Birth Certificate, which office
    should you contact?
  choices:
    A: Driver Improvement Program
    B: ODOT Nondiscrimination team
    C: Vital Records
    D: Driver Programs DMV
  answer: C
  explanation: The manual lists Vital Records—Oregon (Birth Certificate Information)
    at 971-673-1190.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 204
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 205
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 206
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 207
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 208
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 209
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 210
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: Where would you typically see this sign?
  choices:
    A: At a school crossing
    B: At a railroad crossing
    C: At a hospital entrance
    D: At a pedestrian bridge
  answer: B
  explanation: The white X-shaped railroad crossbuck sign is placed at railroad crossings.
    It means you must yield to trains. If a train is approaching, you must stop.
  id: 211
- image: sharp_turn_right.png
  category: signs_and_signals
  question: How does this sign differ from a curve sign?
  choices:
    A: It indicates a less severe turn
    B: It warns of a sharp turn requiring a greater speed reduction
    C: It means turn right only
    D: It is only used on highways
  answer: B
  explanation: A sharp turn sign (with a more angled arrow) indicates a sharper turn
    than a curve sign. You need to reduce your speed more significantly before this
    turn.
  id: 212
- image: divided_highway.png
  category: signs_and_signals
  question: What does this sign indicate is ahead?
  choices:
    A: Road ends
    B: Two-way traffic
    C: A divided highway begins
    D: Highway exit
  answer: C
  explanation: This sign warns that the road ahead becomes a divided highway with
    a median or barrier separating opposing traffic. Keep to the right.
  id: 213
- image: handicap_parking.png
  category: signs_and_signals
  question: Who is allowed to park in a space marked with this sign?
  choices:
    A: Anyone for less than 15 minutes
    B: Senior citizens only
    C: Only vehicles displaying a valid disability placard or plate
    D: Any driver with a passenger who has a disability
  answer: C
  explanation: A blue sign with the wheelchair symbol marks parking reserved for persons
    with disabilities. Only vehicles displaying a valid disability parking placard
    or license plate may park in these spaces. Violations carry heavy fines.
  id: 214
- id: 215
  category: license_system
  question: Besides a REAL ID compliant Oregon license, which of the following is
    listed as an acceptable form of identification for an adult to board a commercial
    U.S. flight?
  choices:
    A: A credit card with a photo
    B: A student ID card
    C: A foreign government-issued passport
    D: A standard, non-REAL ID Oregon driver's license
  answer: C
  explanation: 'The manual states, ''Additional acceptable IDs include, but are not
    limited to: ... Foreign government-issued passport.'' A standard, non-REAL ID
    license is no longer accepted for this purpose.'
- id: 216
  category: vehicle_information
  question: Who is the publisher of the 2026-2027 Oregon Driver Manual?
  choices:
    A: The Oregon State Police
    B: The Oregon Legislature
    C: The Governor's Office of Transportation Safety
    D: The Oregon Department of Transportation, Driver and Motor Vehicle Services
  answer: D
  explanation: 'The manual states on page iii that it is ''Published by: Oregon Department
    of Transportation, Driver and Motor Vehicle Services.'''
- id: 217
  category: safe_driving_rules
  question: According to the Table of Contents, in which section would you find information
    about 'Pavement Markings' and 'Speed Regulations'?
  choices:
    A: Turns & Intersections
    B: Lane Travel
    C: Sharing the Road
    D: Safe & Responsible Driving
  answer: B
  explanation: The Table of Contents on page v lists 'Speed Regulations' and 'Pavement
    Markings' as sub-sections under the main heading 'Lane Travel.'
- id: 218
  category: safe_driving_rules
  question: If you wanted to study the rules for navigating a roundabout, which section
    of the manual should you consult according to the Table of Contents?
  choices:
    A: Turns & Intersections
    B: Lane Travel
    C: Curves
    D: Freeway Driving
  answer: A
  explanation: The Table of Contents on page v shows 'Roundabouts' as a topic within
    the 'Turns & Intersections' section.
- id: 219
  category: sharing_the_road
  question: According to the Table of Contents, information on how to safely share
    the road with large vehicles can be found in which chapter?
  choices:
    A: Driving a Large Vehicle or Towing
    B: Sharing the Road
    C: Defensive Driving
    D: Vehicle Equipment Failures
  answer: B
  explanation: The Table of Contents on page v lists 'Large Vehicles' as a sub-section
    under the main heading 'Sharing the Road.'
- id: 220
  category: safe_driving_rules
  question: To learn about the proper use of safety belts, which section should you
    refer to in the manual's Table of Contents?
  choices:
    A: How to Apply
    B: Safe & Responsible Driving
    C: Avoiding a Collision
    D: Mandatory Insurance
  answer: B
  explanation: The Table of Contents on page vi lists 'Safety Belts' as a sub-topic
    within the 'Safe & Responsible Driving' section.
- id: 221
  category: vehicle_information
  question: According to the Table of Contents, where can you find tips on how to
    improve your vehicle's gas mileage?
  choices:
    A: Vehicle Equipment Failures
    B: Hazardous Conditions
    C: Fuel Saving Techniques
    D: Additional Services
  answer: C
  explanation: The Table of Contents on page vi lists 'Fuel Saving Techniques' as
    a topic under the 'Safe & Responsible Driving' section.
- id: 222
  category: penalties_and_points
  question: If you want to understand the reasons why your driving privileges could
    be taken away, which section of the manual should you read?
  choices:
    A: Testing
    B: Loss of Driving Privileges
    C: Driver Responsibility
    D: Traffic Collisions
  answer: B
  explanation: The Table of Contents on page vi lists 'Loss of Driving Privileges'
    as a main topic heading near the end of the manual.
- id: 223
  category: driver_responsibility
  question: In the 'Important message to drivers,' what is described as the worst-case
    scenario for choosing to drive in a careless or impaired way?
  choices:
    A: Receiving a traffic ticket
    B: Having your insurance rates increase
    C: Causing your own death or the death of someone else
    D: Paying a large fine
  answer: C
  explanation: The manual states on page vii, 'At worst, you may lose your life or
    cause someone else’s death, including that of a loved one.'
- id: 224
  category: driver_responsibility
  question: 'The introductory message from the DMV Administrator emphasizes that everyone
    on the roadway has a shared responsibility to:'
  choices:
    A: Drive as fast as possible to reduce congestion
    B: Use a cell phone only when traffic is light
    C: Be attentive, obey traffic laws, and share the road
    D: Yield to faster-moving vehicles at all times
  answer: C
  explanation: The message on page vii states, 'Each one of us has a responsibility...
    to choose to be attentive, obey traffic laws, and share the road with other drivers,
    people riding bicycles and those who walk and roll.'
- id: 225
  category: license_system
  question: 'In Oregon, you are required to possess a valid driving privilege to operate
    a motor vehicle on:'
  choices:
    A: Highways only
    B: Private property only
    C: Highways or premises open to the public
    D: Any road except for private driveways
  answer: C
  explanation: The manual states on page 1, 'To operate a motor vehicle on highways
    or premises open to the public in Oregon, you must possess a valid driving privilege.'
- id: 226
  category: driver_testing
  question: Where does the manual direct you to find the most current information
    on DMV fees, office hours, and drive test scheduling?
  choices:
    A: The last page of the manual
    B: The Oregon Department of Transportation main website
    C: By calling the Governor's office
    D: The official DMV website, OregonDMV.com
  answer: D
  explanation: The manual states on page 1, 'For current information on requirements,
    fees, drive test scheduling and office hours, go to OregonDMV.com.'
- id: 227
  category: license_system
  question: For individuals 18 and older, which of the following is listed as a federally
    accepted form of ID for boarding a commercial U.S. flight?
  choices:
    A: A birth certificate
    B: A Permanent Resident card
    C: A Social Security card
    D: A library card with a photo
  answer: B
  explanation: The manual on page ii lists 'Permanent Resident card' as an acceptable
    ID for flying.
- id: 228
  category: driver_responsibility
  question: According to the Table of Contents, where would you find information regarding
    mandatory vehicle insurance and what to do after a traffic collision?
  choices:
    A: Safe & Responsible Driving
    B: How to Apply
    C: The sections 'Mandatory Insurance' and 'Traffic Collisions'
    D: Loss of Driving Privileges
  answer: C
  explanation: The Table of Contents on page vi lists 'Mandatory Insurance' and 'Traffic
    Collisions' as separate, specific topic headings.
- id: 229
  category: signs_and_signals
  question: According to the Table of Contents, information about specific traffic
    signs and signals is located in which section?
  choices:
    A: Lane Travel
    B: Signs & Traffic Signals
    C: Pavement Markings
    D: Work Zones
  answer: B
  explanation: The Table of Contents on page v clearly indicates a main section titled
    'Signs & Traffic Signals' which contains subsections for 'Signs' and 'Traffic
    Signals'.
- id: 230
  category: driver_testing
  question: If you fail the online knowledge test four times, what is the next step
    you must take?
  choices:
    A: You must wait 90 days before attempting the test again.
    B: You must complete an ODOT-Approved Driver Education Course.
    C: You must schedule and take any future attempts at a DMV office.
    D: You may take the test online two more times after a 24-hour waiting period.
  answer: C
  explanation: The manual states, 'After four attempts you must test at a DMV office.'
- id: 231
  category: driver_testing
  question: For a new Oregon resident, under what condition may the DMV waive the
    drive test?
  choices:
    A: If you have held a valid driver license from any country for at least five
      years.
    B: If you surrender an out-of-state license that is valid or expired less than
      one year.
    C: If you are over 25 years of age and have a clean driving record.
    D: If you pass the knowledge test with a perfect score on the first attempt.
  answer: B
  explanation: The manual states the DMV may waive the drive test if 'You are a new
    resident surrendering an out-of-state license that is valid or expired less than
    one year.'
- id: 232
  category: driver_testing
  question: When taking a knowledge test at a DMV office, what are you permitted to
    bring for audio assistance?
  choices:
    A: A personal translator to read the questions aloud.
    B: A DMV-provided audio device only.
    C: Your own earbuds or headphones.
    D: A smartphone with a text-to-speech app.
  answer: C
  explanation: The manual states for in-office knowledge tests, 'You may bring your
    own earbuds or headphones for the test.'
- id: 233
  category: penalties_and_points
  question: Which of the following actions is specifically defined as cheating on
    a knowledge test, resulting in failure and a 90-day re-test restriction?
  choices:
    A: Asking the examiner to clarify a question.
    B: Using a paper foreign language translation dictionary with permission.
    C: Taking notes or allowing someone else to take the test for you.
    D: Failing to complete the test within the allotted time.
  answer: C
  explanation: 'The manual lists several actions considered cheating, including: ''talking,
    writing or note taking, cell phone use, operation of any electronic devices, or
    allowing someone else to take a test for you.'''
- id: 234
  category: signs_and_signals
  question: What is the shape and meaning of a YIELD sign?
  choices:
    A: 'Octagon: You must come to a complete stop before proceeding.'
    B: 'Triangle: You must reduce speed, yield right of way, and stop if necessary.'
    C: 'Square: You are going the wrong way and must turn around.'
    D: 'Circle: You are approaching a railroad crossing and must look for trains.'
  answer: B
  explanation: 'The manual describes the Yield sign as a ''Triangle: This sign means
    you should reduce speed and yield right of way. If needed, stop the same as you
    would for a stop sign.'''
- id: 235
  category: signs_and_signals
  question: What does a sign with a red circle and a slash mark indicate?
  choices:
    A: The action shown is recommended but not required.
    B: You are approaching a hazard and should slow down.
    C: The road ahead is closed to all traffic.
    D: You must not perform the action shown on the sign.
  answer: D
  explanation: The manual states, 'When you see a sign with a red circle and a slash
    mark, it means do not make the turn shown.'
- id: 236
  category: vehicle_information
  question: If weather conditions require it for your drive test, which of the following
    sets of equipment must your vehicle have?
  choices:
    A: All-weather floor mats and a first-aid kit.
    B: An ice scraper and emergency flares.
    C: Traction tires or chains, and a working window defroster.
    D: A GPS navigation system and a car cover.
  answer: C
  explanation: The manual specifies, 'If weather conditions require, your vehicle
    must have traction tires or chains, windshield wipers, headlights, taillights
    and a window defroster.'
- id: 237
  category: driver_testing
  question: What is a potential disadvantage of using a certified Third Party drive
    tester instead of the DMV?
  choices:
    A: The test is significantly harder.
    B: Testing costs may be greater.
    C: The results are not recognized by the DMV.
    D: They have fewer available appointment times.
  answer: B
  explanation: The manual notes that while Third Party Testers may offer more scheduling
    flexibility, 'Testing costs may be greater when using a Third Party Tester, however.'
- id: 238
  category: signs_and_signals
  question: What does a 'Do Not Enter' sign primarily warn you about?
  choices:
    A: The road ahead is under construction.
    B: The road is a private driveway.
    C: You are about to enter a one-way street going the wrong way.
    D: The road is temporarily closed due to an accident.
  answer: C
  explanation: 'The manual states, ''Do Not Enter – Square: This sign warns you not
    to enter a road or freeway. You will see this sign if you are going the wrong
    way.'''
- id: 239
  category: driver_testing
  question: What is the recommended minimum amount of time you should schedule a drive
    test in advance?
  choices:
    A: One week.
    B: Two weeks.
    C: Three weeks.
    D: Four weeks.
  answer: C
  explanation: The manual advises, 'It’s a good idea to schedule a minimum of three
    weeks in advance of the date you want to take your test.'
- id: 240
  category: vehicle_information
  question: 'For a vehicle to be acceptable for a drive test, the passenger seat must
    be:'
  choices:
    A: Equipped with electronic adjustments and heating.
    B: Covered in leather or a similar material.
    C: Proper, secure, and reasonably clean.
    D: Empty, with no items on or around it.
  answer: C
  explanation: The vehicle equipment checklist for the drive test includes 'Proper,
    secure and reasonably clean passenger seat.'
- id: 241
  category: driver_testing
  question: What must you do before you can take any test at the DMV?
  choices:
    A: Schedule an appointment at least one week in advance.
    B: Pay the test fee and present proof of identity, birth date, and address.
    C: Complete an online pre-screening questionnaire.
    D: Surrender any out-of-state identification you may have.
  answer: B
  explanation: The manual states, 'Every time you take a test, you must first pay
    the test fee and present proof of identity, date of birth, and current residence
    address.'
- id: 242
  category: signs_and_signals
  question: What does a 'Keep Right' sign indicate?
  choices:
    A: You must make a right turn at the next intersection.
    B: Slower traffic must stay in the right lane.
    C: A traffic island, median, or obstruction is ahead, and you should stay to the
      right of it.
    D: The road ahead curves to the right.
  answer: C
  explanation: The manual states that a 'Keep Right' sign means 'A traffic island,
    median or obstruction divides the road ahead. Keep to the right.'
- id: 243
  category: signs_and_signals
  question: When you approach an intersection with a 'No Turn on Red' sign, what must
    you do?
  choices:
    A: You may turn right after stopping if no pedestrians are present.
    B: You must wait for the signal to turn green before turning.
    C: You may turn left from a one-way street onto another one-way street.
    D: You may turn after yielding to all cross traffic.
  answer: B
  explanation: 'The manual specifies for a ''No Turn on Red'' sign: ''You may not
    turn during the red light. You must wait for the signal to turn green.'''
- id: 244
  category: signs_and_signals
  question: What does a 'Left Turn Yield on Green' sign mean?
  choices:
    A: You have the right-of-way to make a left turn on a green light.
    B: Oncoming traffic must yield to you when you are turning left.
    C: On a green circular signal, you must yield to oncoming traffic and pedestrians
      before turning left.
    D: You may only turn left when you have a green arrow.
  answer: C
  explanation: 'The manual states this sign means: ''On a green circular signal, yield
    the right-of-way to oncoming traffic and pedestrians until it is safe to turn.'''
- id: 245
  category: signs_and_signals
  question: If you see a 'Stop Here for Pedestrians' sign at a crosswalk, where must
    you stop when a pedestrian is present?
  choices:
    A: At least 20 feet before the crosswalk.
    B: At the stop line.
    C: Anywhere before the crosswalk that provides a good view.
    D: Only if the pedestrian is on your half of the road.
  answer: B
  explanation: 'The manual instructs: ''Stop at the stop line when a pedestrian is
    in the crosswalk.'''
- id: 246
  category: signs_and_signals
  question: 'A ''Winding Road'' sign warns you that:'
  choices:
    A: The road ahead is slippery when wet.
    B: A sharp turn is immediately ahead.
    C: The road contains a series of turns or curves.
    D: The road ahead curves to the right, then left.
  answer: C
  explanation: The manual defines a 'Winding Road' sign as indicating 'The road contains
    a series of turns or curves.'
- id: 247
  category: signs_and_signals
  question: What action must a driver take when they see a 'Lane Reduction' sign?
  choices:
    A: Come to a complete stop before continuing.
    B: Speed up to get ahead of traffic in the other lane.
    C: Merge into the through lane as their lane is ending soon.
    D: Exit the highway immediately.
  answer: C
  explanation: 'The manual states for a ''Lane Reduction'' sign: ''The indicated lane
    ends soon. Vehicles in that lane must merge into the through lane.'''
- id: 248
  category: signs_and_signals
  question: What does the 'Two-Way Traffic Ahead' sign warn you of?
  choices:
    A: You are on a divided highway that is about to end.
    B: The one-way road you are on is about to join a two-way road.
    C: You are permitted to pass other vehicles.
    D: A merging lane is ahead.
  answer: B
  explanation: The manual explains that a 'Two-Way Traffic Ahead' sign means 'The
    one-way road joins a two-way road ahead. You will be facing oncoming traffic.'
- id: 249
  category: signs_and_signals
  question: What is the primary warning provided by a 'Low Clearance' sign?
  choices:
    A: The road ahead has a steep grade.
    B: The overpass ahead is low, and your vehicle may be too tall to pass under it.
    C: A railroad crossing is ahead.
    D: The speed limit is reduced ahead.
  answer: B
  explanation: 'The manual states a ''Low Clearance'' sign means: ''The overpass ahead
    has low clearance. Do not proceed if your vehicle is too tall to pass under it.'''
- id: 250
  category: signs_and_signals
  question: 'A ''Slippery When Wet'' sign means:'
  choices:
    A: You should always drive below the speed limit in this area.
    B: The pavement is unusually slick when it is wet.
    C: The road is prone to flooding during heavy rain.
    D: You should turn on your hazard lights when it rains.
  answer: B
  explanation: 'The manual''s definition for this sign is: ''The pavement is unusually
    slick when wet.'''
- id: 251
  category: signs_and_signals
  question: What is the purpose of the number on a green exit sign on a highway?
  choices:
    A: It indicates the distance to the next city.
    B: It shows the route number of the highway you are on.
    C: It helps you know which exit to take.
    D: It is the recommended speed for the exit ramp.
  answer: C
  explanation: The manual states, 'The number on an exit sign helps you know which
    exit to take.'
- id: 252
  category: signs_and_signals
  question: Signs that point to historic locations, scenic areas, and parks are what
    color?
  choices:
    A: Blue
    B: Green
    C: Yellow
    D: Brown
  answer: D
  explanation: 'The manual specifies: ''Historic, Cultural, and Recreational Signs:
    These brown signs point to historic and cultural locations. They also point to
    scenic areas, picnic grounds, and parks.'''
- id: 253
  category: signs_and_signals
  question: According to the manual, what should you do when approaching a steady
    circular yellow traffic signal?
  choices:
    A: Speed up to clear the intersection before the light turns red.
    B: Stop before entering the intersection, or if you cannot stop safely, drive
      carefully through it.
    C: Come to a complete stop and wait for the light to turn green.
    D: Slow down and prepare to turn right.
  answer: B
  explanation: 'The manual states: ''A steady yellow signal warns you that the signal
    is about to turn red. Stop before entering the intersection. If you cannot stop
    safely, drive carefully through it.'''
- id: 254
  category: signs_and_signals
  question: When facing a steady red arrow traffic signal, what turns are you allowed
    to make?
  choices:
    A: No turns are allowed until the arrow turns green.
    B: You may only turn in the direction of the arrow after stopping.
    C: The same turns allowed for a steady circular red signal, after coming to a
      complete stop.
    D: You may turn right, but not left.
  answer: C
  explanation: 'The manual clarifies for a red arrow: ''The same turns allowed for
    a steady red signal are allowed for a red arrow'' after stopping, unless a sign
    prohibits it.'
- id: 255
  category: sharing_the_road
  question: If a 'Right Turns Permitted' sign is posted for a transit-only lane, how
    should you use the lane to make a right turn?
  choices:
    A: You can use the full length of the lane to prepare for your turn.
    B: You must race to get ahead of any transit vehicles before turning.
    C: You can briefly use the lane to turn, always yielding to transit vehicles and
      merging behind them.
    D: You are not allowed to enter the lane if a bus is visible.
  answer: C
  explanation: The manual states you can 'briefly use the transit lane to turn...
    Always yield to transit vehicles and people riding bicycles in transit lanes.
    Merge into the lane behind them after they pass.'
- id: 256
  category: signs_and_signals
  question: When you approach a flashing yellow arrow signal, what does this indicate
    about the status of oncoming traffic?
  choices:
    A: Oncoming traffic also has a flashing yellow arrow.
    B: Oncoming traffic has a steady red signal and must stop.
    C: Oncoming traffic has a steady green signal.
    D: Oncoming traffic is preparing to stop for a red signal.
  answer: C
  explanation: The manual states that when you have a flashing yellow arrow, you must
    yield to oncoming traffic, which has a steady green signal.
- id: 257
  category: safe_driving_rules
  question: What is the key difference for a driver turning left when facing a steady
    green arrow versus a steady circular green signal?
  choices:
    A: A green arrow means you must stop and wait for a gap, while a green circle
      means you can turn immediately.
    B: A green arrow gives you the right of way for the turn, while a green circle
      requires you to yield to oncoming traffic and pedestrians.
    C: Both signals mean the same thing, but the arrow is used in higher traffic areas.
    D: A green arrow allows a left turn only, while a green circle allows left, right,
      and straight movements.
  answer: B
  explanation: A steady green arrow means you have the right of way for the indicated
    movement. A steady circular green signal permits a left turn, but you must first
    yield to pedestrians and oncoming traffic.
- id: 258
  category: safe_driving_rules
  question: When driving on a two-way road that does not have a painted center line,
    what is your legal responsibility regarding road position?
  choices:
    A: You must drive as close to the right edge of the road as possible at all times.
    B: You may use the center of the road if no traffic is approaching.
    C: You must give at least half of the road to oncoming traffic.
    D: The vehicle traveling at a higher speed has the right of way.
  answer: C
  explanation: 'The manual states: ''When a road has no center line and traffic moves
    in opposite directions, drivers must give at least half the road to oncoming traffic.'''
- id: 259
  category: safe_driving_rules
  question: Unless a different speed is posted, what is the maximum legal speed limit
    on Oregon roads and highways that do not fall under another specific definition
    (such as a school, business, or residential zone)?
  choices:
    A: 45 mph
    B: 50 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: The statutory speed limit is 55 mph 'On all roads and highways not
    meeting any other definition unless otherwise posted.'
- id: 260
  category: signs_and_signals
  question: Which of the following correctly describes a Variable Advisory Speed sign
    in Oregon?
  choices:
    A: It is black and white, says 'speed limit', and is legally enforceable.
    B: It is yellow, says 'advisory speed', and recommends a speed for current conditions.
    C: It is orange, says 'work zone', and applies only when workers are present.
    D: It is blue, says 'minimum speed', and indicates the slowest you can legally
      drive.
  answer: B
  explanation: The manual specifies that 'Variable advisory speed signs are yellow
    and say, “advisory speed.” These signs recommend a speed based on driving conditions...
    These are not speed limits...'
- id: 261
  category: sharing_the_road
  question: According to the pedestrian fatality data in the manual, a pedestrian
    has a 50% risk of death if they are struck by a vehicle traveling at what approximate
    speed?
  choices:
    A: 23 mph
    B: 35 mph
    C: 42 mph
    D: 58 mph
  answer: C
  explanation: The chart in the manual shows that a pedestrian hit by a vehicle traveling
    at 42 mph has a 50% risk of death.
- id: 262
  category: signs_and_signals
  question: In addition to separating traffic moving in opposite directions, what
    is another primary use for a solid yellow pavement marking?
  choices:
    A: To mark the right edge of the roadway.
    B: To indicate a bicycle lane.
    C: To mark the left edge of one-way roads and ramps.
    D: To designate a parking zone.
  answer: C
  explanation: The manual states that yellow markings are used to separate traffic
    moving in opposite directions and 'to mark the left edge of one-way roads and
    ramps...'
- id: 263
  category: safe_driving_rules
  question: Under which specific circumstance are you legally permitted to drive across
    a double solid yellow line?
  choices:
    A: To pass a slow-moving vehicle that is traveling under 25 mph.
    B: To make a left turn to enter or exit a roadway, after yielding to oncoming
      traffic.
    C: If the road ahead is clear for at least 500 feet.
    D: You are never permitted to cross a double solid yellow line.
  answer: B
  explanation: 'The manual states an exception for double solid yellow lines: ''You
    may turn left, to enter or exit a roadway, across double solid yellow lines after
    waiting for oncoming traffic to clear.'''
- id: 264
  category: signs_and_signals
  question: If you are approaching an intersection and the traffic signal light turns
    to a steady yellow, what is the correct and safest action to take?
  choices:
    A: Speed up to clear the intersection before the light turns red.
    B: Stop immediately, even if you are in the middle of the intersection.
    C: Stop before entering the intersection if you can do so safely.
    D: Slow down and prepare to stop, but continue if the car behind you is close.
  answer: C
  explanation: 'The manual advises for a steady yellow signal: ''Stop before entering
    the intersection. If you cannot stop safely, drive carefully through it.'''
- id: 265
  category: safe_driving_rules
  question: If you must drive to the left of the center line to pass an obstruction,
    such as a parked car or road debris, what must you do first?
  choices:
    A: Honk your horn to alert oncoming drivers.
    B: Yield to any oncoming traffic.
    C: Turn on your hazard lights.
    D: Increase your speed to get around the obstruction quickly.
  answer: B
  explanation: 'The manual states: ''If you must drive to the left of the center line
    to go around a road hazard or for any other reason, you must yield to oncoming
    traffic.'''
- id: 266
  category: driver_responsibility
  question: How does the Oregon Driver Manual define the act of 'yielding'?
  choices:
    A: Coming to a complete stop at all times.
    B: Slowing down or stopping to allow another vehicle or pedestrian to continue
      safely.
    C: Giving a hand signal to allow another driver to proceed first.
    D: Maintaining your speed and position, as you have the right-of-way.
  answer: B
  explanation: 'The manual defines yielding as: ''you must slow down or stop to allow
    another vehicle or pedestrian to continue safely.'''
- id: 267
  category: signs_and_signals
  question: How does a 'Variable Speed Limit' sign differ from a 'Variable Advisory
    Speed' sign?
  choices:
    A: The Variable Speed Limit sign is yellow and recommends a speed, while the advisory
      sign is black and white and is a legal limit.
    B: The Variable Speed Limit sign is black and white and is an enforceable speed
      limit, while the advisory sign is yellow and is a recommendation.
    C: There is no difference; the terms are used interchangeably.
    D: The Variable Speed Limit sign is only used in construction zones, while the
      advisory sign is used for weather conditions.
  answer: B
  explanation: 'The manual distinguishes the two: ''Variable Speed Limit'' signs are
    black and white, say ''speed limit,'' and are enforceable. ''Variable Advisory
    Speed'' signs are yellow, say ''advisory speed,'' and are recommendations.'
- id: 268
  category: signs_and_signals
  question: If you are driving on a road with a double center line, and the line on
    your side of the lane is solid yellow, what does this indicate?
  choices:
    A: You are on a one-way street.
    B: You are approaching a stop sign.
    C: You are in a lane where passing is not allowed.
    D: You may pass if no oncoming traffic is visible.
  answer: C
  explanation: 'The manual explains that for a double center line with one solid and
    one broken line: ''A solid yellow line on your side of the lane indicates you
    are not allowed to pass.'''
- id: 269
  category: signs_and_signals
  question: What is the rule for making a turn when you are facing a steady red arrow
    signal?
  choices:
    A: No turns are allowed under any circumstances.
    B: You may turn after coming to a complete stop and yielding to traffic and pedestrians.
    C: The same turns allowed for a steady circular red signal are allowed for a red
      arrow.
    D: You may only turn if a sign is posted that explicitly permits it.
  answer: C
  explanation: 'The manual states: ''A steady red arrow means stop and remain stopped
    until the signal changes, except for allowed turns on red. The same turns allowed
    for a steady red signal are allowed for a red arrow.'''
- id: 270
  category: signs_and_signals
  question: What is the rule for driving over yellow diagonal stripes found within
    a painted median?
  choices:
    A: You may drive over them to pass a slow-moving vehicle.
    B: It is permitted to make a left turn across them if traffic is clear.
    C: It is illegal to drive in or make a turn across these stripes.
    D: You may use this area as a temporary waiting spot for a left turn.
  answer: C
  explanation: The manual states that yellow diagonal stripes are used to inform you
    of fixed objects or areas where vehicle use is not allowed. It specifies, 'It
    is illegal to drive in or make a turn across these stripes.'
- id: 271
  category: safe_driving_rules
  question: What does a double solid white line between lanes of traffic moving in
    the same direction indicate?
  choices:
    A: The lane is ending and you must merge soon.
    B: Passing is permitted, but discouraged.
    C: You are not allowed to change lanes.
    D: The lane is reserved for high-occupancy vehicles.
  answer: C
  explanation: According to the manual, a double solid white line means you are not
    allowed to change lanes and should stay in your lane. It is often accompanied
    by a sign prohibiting lane changes.
- id: 272
  category: signs_and_signals
  question: You encounter a lane painted solid red with the words 'BUS ONLY' on the
    pavement. What does this mean?
  choices:
    A: It is a fire lane and must be kept clear at all times.
    B: It is a Transit Only lane, and you may not drive your car in it.
    C: You may use this lane to make a right turn within 100 feet.
    D: It is an emergency stopping lane for all vehicles.
  answer: B
  explanation: The manual states that a solid red lane is a Transit Only lane, not
    for cars. These lanes may also say 'BUS ONLY, BUS BIKE ONLY, or LRT'.
- id: 273
  category: signs_and_signals
  question: What is the purpose of white chevrons painted on the road surface?
  choices:
    A: To indicate the point at which you are required to yield.
    B: To inform you of fixed objects or areas where vehicle use is not allowed.
    C: To mark a pedestrian crosswalk in a high-traffic area.
    D: To guide you through a complex intersection into the proper lane.
  answer: B
  explanation: 'The manual states, ''White chevrons: May be used to inform you of
    fixed objects in the road ahead or other areas where vehicle use is not allowed.'''
- id: 274
  category: defensive_driving
  question: According to the manual, what is the correct procedure to determine if
    you are following another vehicle too closely?
  choices:
