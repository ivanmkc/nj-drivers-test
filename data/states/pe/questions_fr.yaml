  category: penalties_and_points
  question: Si un conducteur est reconnu coupable d'un excès de vitesse de 35 km/h
    au-dessus de la limite affichée à l'Î.-P.-É., combien de points d'inaptitude seront
    ajoutés à son dossier ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: C
  explanation: À l'Î.-P.-É., un excès de vitesse de 1 à 15 km/h au-dessus de la limite
    entraîne 2 points, de 16 à 30 km/h entraîne 3 points, et de 31 km/h ou plus au-dessus
    de la limite entraîne 4 points.
- id: 153
  category: penalties_and_points
  question: À l'Î.-P.-É., quelle est la durée de la suspension immédiate du permis
    sur le bord de la route pour un conducteur titulaire d'un permis complet qui fournit
    un échantillon d'haleine dans la « zone d'avertissement » (0,05 à 0,08 d'alcoolémie
    [BAC]) pour la première fois ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 7 jours
    D: 30 jours
  answer: A
  explanation: Un conducteur titulaire d'un permis complet pris avec un taux d'alcoolémie
    (BAC) dans la « zone d'avertissement » (0,05 à 0,08) s'expose à une suspension
    immédiate de permis de 24 heures sur le bord de la route pour une première infraction.
- id: 154
  category: penalties_and_points
  question: Combien de points d'inaptitude sont imposés à un conducteur à l'Île-du-Prince-Édouard
    pour avoir omis de porter sa ceinture de sécurité ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Une condamnation pour défaut de porter la ceinture de sécurité, ou
    pour défaut de s'assurer qu'un passager de moins de 16 ans est correctement attaché,
    entraîne 2 points d'inaptitude.
- id: 155
  category: penalties_and_points
  question: À l'Île-du-Prince-Édouard, tous les conducteurs de moins de ____ ans doivent
    maintenir un taux d'alcoolémie (BAC) de zéro.
  choices:
    A: '19'
    B: '21'
    C: '22'
    D: '25'
  answer: C
  explanation: La loi de l'Î.-P.-É. exige que tous les conducteurs de moins de 22
    ans aient un taux d'alcoolémie (BAC) de 0,00 %, qu'ils soient dans le programme
    de permis progressif (GDL) ou qu'ils détiennent un permis complet.
- id: 156
  category: penalties_and_points
  question: Une condamnation pour « conduite imprudente » à l'Île-du-Prince-Édouard
    entraîne une pénalité de combien de points d'inaptitude ?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 12 points
  answer: C
  explanation: La conduite imprudente est une infraction grave à l'Î.-P.-É. et entraîne
    l'ajout de 6 points d'inaptitude au dossier du conducteur.
- id: 157
  category: penalties_and_points
  question: 'Si une personne est surprise en train de conduire un véhicule à moteur
    alors que son permis de conduire est suspendu à l''Î.-P.-É., le véhicule sera
    mis en fourrière pour une période de :'
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: En vertu du programme de mise en fourrière des véhicules de l'Î.-P.-É.,
    si vous êtes surpris à conduire alors que votre permis est suspendu, le véhicule
    que vous conduisez sera mis en fourrière pendant 30 jours.
- id: 158
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour avoir omis de céder
    le passage à un piéton dans un passage pour piétons à l'Î.-P.-É. ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Le fait de ne pas céder le passage à un piéton ou à un autre véhicule
    entraîne 3 points d'inaptitude à l'Île-du-Prince-Édouard.
- id: 159
  category: penalties_and_points
  question: Combien de points d'inaptitude sont inscrits au dossier pour avoir omis
    de s'arrêter à un feu rouge ou à un panneau d'arrêt à l'Île-du-Prince-Édouard
    ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: B
  explanation: Désobéir à un dispositif de signalisation routière, comme un feu rouge
    ou un panneau d'arrêt, entraîne 3 points d'inaptitude.
- id: 160
  category: penalties_and_points
  question: À l'Î.-P.-É., combien de points d'inaptitude sont attribués pour l'infraction
    de « suivre de trop près » ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: A
  explanation: Suivre de trop près (talonner) est une infraction entraînant 2 points
    d'inaptitude à l'Île-du-Prince-Édouard.
- id: 161
  category: penalties_and_points
  question: À l'Î.-P.-É., les conducteurs condamnés pour une infraction liée à l'alcool
    en vertu du Code criminel doivent généralement participer à quel programme pour
    obtenir le rétablissement de leur permis ?
  choices:
    A: Le cours de conduite préventive
    B: Le programme de réadaptation des conducteurs
    C: Le programme d'antidémarrage avec éthylomètre (Ignition Interlock Program)
    D: Le programme de délivrance graduelle des permis
  answer: C
  explanation: L'Î.-P.-É. exige que les conducteurs condamnés pour des infractions
    de conduite liées à l'alcool en vertu du Code criminel participent au programme
    d'antidémarrage avec éthylomètre comme condition de rétablissement du permis.
- id: 162
  category: penalties_and_points
  question: Combien de points d'inaptitude sont ajoutés au dossier d'un conducteur
    de l'Î.-P.-É. pour un excès de vitesse compris entre 16 km/h et 25 km/h au-dessus
    de la limite affichée ?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 6 points
  answer: B
  explanation: À l'Î.-P.-É., un excès de vitesse de 1 à 15 km/h au-dessus de la limite
    entraîne 2 points, tandis qu'un excès de vitesse de 16 à 25 km/h au-dessus de
    la limite entraîne 3 points d'inaptitude.
- id: 163
  category: penalties_and_points
  question: Un conducteur à l'Î.-P.-É. pris en flagrant délit d'excès de vitesse de
    51 km/h ou plus au-dessus de la limite de vitesse affichée recevra combien de
    points d'inaptitude ?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Un excès de vitesse de plus de 50 km/h au-dessus de la limite à l'Î.-P.-É.
    entraîne 6 points d'inaptitude et la mise en fourrière immédiate du véhicule.
- id: 164
  category: penalties_and_points
  question: À l'Île-du-Prince-Édouard, si l'alcoolémie (BAC) d'un conducteur se situe
    dans la « zone d'avertissement » (0,05 à 0,08) pour la première fois, quelle est
    la durée de la suspension immédiate du permis sur le bord de la route ?
  choices:
    A: 24 heures
    B: 48 heures
    C: 7 jours
    D: 30 jours
  answer: A
  explanation: Pour une première infraction dans la « zone d'avertissement » (alcoolémie
    de 0,05 à 0,08), la loi de l'Î.-P.-É. impose une suspension immédiate du permis
    de 24 heures sur le bord de la route.
- id: 165
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour « conduite imprudente
    » à l'Île-du-Prince-Édouard ?
  choices:
    A: 3 points
    B: 4 points
    C: 6 points
    D: 9 points
  answer: C
  explanation: La conduite imprudente est une infraction grave à l'Î.-P.-É. et entraîne
    une pénalité de 6 points d'inaptitude.
- id: 166
  category: penalties_and_points
  question: À l'Î.-P.-É., combien de points d'inaptitude sont inscrits au dossier
    pour avoir omis de porter la ceinture de sécurité ou pour avoir omis de s'assurer
    qu'un passager de moins de 16 ans est correctement attaché ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Les infractions relatives à la ceinture de sécurité à l'Île-du-Prince-Édouard
    entraînent l'ajout de 2 points d'inaptitude au dossier du conducteur.
- id: 167
  category: penalties_and_points
  question: Si un conducteur à l'Î.-P.-É. est reconnu coupable de « délit de fuite
    » (omission de rester sur les lieux d'un accident), combien de points d'inaptitude
    sont ajoutés à son dossier ?
  choices:
    A: 4 points
    B: 6 points
    C: 8 points
    D: 12 points
  answer: B
  explanation: Le délit de fuite (omission de rester sur les lieux d'un accident)
    entraîne 6 points d'inaptitude à l'Île-du-Prince-Édouard.
- id: 168
  category: penalties_and_points
  question: Si un conducteur de l'Î.-P.-É. reçoit une deuxième suspension pour points
    d'inaptitude au cours d'une période de 24 mois, pendant combien de temps son permis
    sera-t-il suspendu ?
  choices:
    A: 3 mois
    B: 6 mois
    C: 9 mois
    D: 12 mois
  answer: B
  explanation: Une deuxième suspension pour points d'inaptitude au cours d'une période
    de 24 mois à l'Î.-P.-É. entraîne une suspension de permis de 6 mois.
- id: 169
  category: penalties_and_points
  question: Combien de points d'inaptitude sont attribués pour « conduite pendant
    une période de disqualification ou de suspension de permis » à l'Î.-P.-É. ?
  choices:
    A: 3 points
    B: 6 points
    C: 9 points
    D: 12 points
  answer: B
  explanation: Conduire pendant une période de disqualification ou de suspension à
    l'Î.-P.-É. entraîne l'ajout de 6 points d'inaptitude au dossier du conducteur.
- id: 170
  category: sharing_the_road
  question: À l'Île-du-Prince-Édouard, quelle est la sanction pour une première infraction
    consistant à ne pas s'arrêter pour un autobus scolaire dont les feux rouges clignotent
    ?
  choices:
    A: Une amende de 500 $ et 3 points d'inaptitude
    B: Une amende de 1 000 $ à 5 000 $ et 12 points d'inaptitude
    C: Une amende de 250 $ et une suspension d'un mois
    D: Une amende de 100 $ et 2 points d'inaptitude
  answer: B
  explanation: En vertu de la loi sur la circulation routière (Highway Traffic Act)
    de l'Î.-P.-É., l'omission de s'arrêter pour un autobus scolaire aux feux rouges
    clignotants entraîne une amende minimale de 1 000 $ (jusqu'à 5 000 $) et 12 points
    d'inaptitude, ce qui mène à une suspension automatique du permis.
- id: 171
  category: sharing_the_road
  question: Lorsque vous dépassez un cycliste sur une route de l'Î.-P.-É., quelle
    est la distance minimale qu'un conducteur doit maintenir entre son véhicule et
    le cycliste ?
  choices:
    A: 0,5 mètre
    B: 1 mètre
    C: 2 mètres
    D: 3 mètres
  answer: B
  explanation: La loi de l'Î.-P.-É. exige que les conducteurs maintiennent une distance
    minimale de 1 mètre entre leur véhicule et un cycliste lors d'un dépassement.
- id: 172
  category: sharing_the_road
  question: Lorsqu'un véhicule d'urgence avec des gyrophares et des sirènes s'approche
    de n'importe quelle direction sur une route à deux voies, que doit faire le conducteur
    ?
  choices:
    A: Accélérer pour libérer le passage
    B: Maintenir sa vitesse et rester dans la voie actuelle
    C: Se ranger à droite le plus possible et s'immobiliser complètement
    D: S'arrêter exactement là où il se trouve au milieu de la voie
  answer: C
  explanation: Les conducteurs doivent immédiatement se ranger vers le trottoir ou
    le bord droit de la chaussée, à l'écart de toute intersection, et s'arrêter jusqu'à
    ce que le véhicule d'urgence soit passé.
- id: 173
  category: sharing_the_road
  question: Lorsque vous suivez un gros camion commercial, pourquoi devriez-vous maintenir
    une distance de sécurité plus grande que pour une voiture de tourisme ?
  choices:
    A: Les camions ont des angles morts plus petits
    B: Pour avoir une meilleure vue de la route devant vous et rester hors de l'angle
      mort arrière du camion
    C: Les camions sont tenus de s'arrêter à tous les passages à niveau
    D: Les camions roulent toujours plus vite que la limite de vitesse
  answer: B
  explanation: Suivre un camion de trop près vous place dans sa « zone de danger »
    (angle mort) et limite considérablement votre visibilité de la route devant vous.
- id: 174
  category: sharing_the_road
  question: Selon le Guide du conducteur de l'Î.-P.-É., quelle est la distance minimale
    que vous devez maintenir lorsque vous suivez un véhicule d'incendie (camion de
    pompiers) qui répond à une alarme ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: La loi sur la circulation routière de l'Î.-P.-É. stipule que les conducteurs
    ne doivent pas suivre un véhicule d'incendie répondant à une alarme à une distance
    de moins de 150 mètres.
- id: 175
  category: sharing_the_road
  question: Si vous conduisez sur une route avec un terre-plein central physique (autoroute
    à chaussées séparées) et qu'un autobus scolaire est arrêté dans la direction opposée
    avec ses feux rouges clignotants, que devez-vous faire ?
  choices:
    A: S'arrêter et attendre que les feux cessent de clignoter
    B: Ralentir à 20 km/h
    C: Continuer avec prudence ; vous n'êtes pas tenu de vous arrêter
    D: S'arrêter seulement si des enfants traversent le terre-plein
  answer: C
  explanation: Sur une autoroute à chaussées séparées où il y a un terre-plein central
    ou une barrière physique, la circulation venant de la direction opposée à l'autobus
    n'est pas tenue de s'arrêter, bien que la prudence soit toujours recommandée.
- id: 176
  category: sharing_the_road
  question: Lorsqu'un piéton utilise une canne blanche ou un chien-guide à un passage
    pour piétons à l'Î.-P.-É., qu'est-ce que cela indique au conducteur ?
  choices:
    A: Le piéton est une personne âgée
    B: Le piéton a une déficience visuelle et doit avoir la priorité
    C: Le piéton est un fonctionnaire du gouvernement
    D: Le piéton dresse un chien
  answer: B
  explanation: Une canne blanche ou un chien-guide indique que le piéton a une déficience
    visuelle. Les conducteurs doivent faire preuve d'une prudence accrue et céder
    le passage.
- id: 177
  category: sharing_the_road
  question: En tournant à droite, vous voyez un cycliste positionné à la droite de
    votre véhicule. Que devriez-vous faire ?
  choices:
    A: Accélérer et tourner rapidement avant que le cycliste n'atteigne l'intersection
    B: Klaxonner pour dire au cycliste de s'arrêter
    C: Vérifier votre angle mort, signaler et céder le passage au cycliste avant d'effectuer
      le virage
    D: Supposer que le cycliste se déplacera sur le trottoir
  answer: C
  explanation: Les conducteurs doivent céder le passage aux cyclistes lors d'un virage.
    Le « crochet à droite » devant un cycliste est une cause fréquente d'accidents
    ; vérifiez toujours votre angle mort et assurez-vous que le cycliste est passé
    ou s'est arrêté.
- id: 178
  category: sharing_the_road
  question: 'Un panneau de véhicule lent est requis à l''arrière de tout véhicule
    qui circule à une vitesse inférieure à :'
  choices:
    A: 60 km/h
    B: 50 km/h
    C: 40 km/h
    D: 30 km/h
  answer: C
  explanation: Le panneau de véhicule lent (un triangle orange avec une bordure rouge)
    doit être affiché à l'arrière des véhicules conçus pour circuler à des vitesses
    inférieures à 40 km/h.
- id: 179
  category: sharing_the_road
  question: Lorsque vous partagez la route avec une motocyclette, pourquoi est-il
    important de laisser une largeur de voie complète au motocycliste ?
  choices:
    A: Les motocyclettes ont légalement droit à toute la largeur de la voie
    B: Les motocyclettes ont besoin d'espace pour éviter les dangers comme les nids-de-poule
      ou le gravier
    C: Il est illégal de conduire à côté d'une motocyclette dans la même voie
    D: Toutes ces réponses
  answer: D
  explanation: Les motocyclettes ont droit à la voie complète. Les conducteurs ne
    devraient jamais tenter de partager une voie avec une motocyclette car celle-ci
    a besoin d'espace pour manœuvrer autour des dangers de la route.
- id: 180
  category: sharing_the_road
  question: Vous suivez un gros camion qui tourne à droite. Le camion fait un large
    écart vers la gauche avant de tourner. Que devriez-vous faire ?
  choices:
    A: Dépasser le camion par le côté droit
    B: Rester bien en arrière et ne pas tenter de dépasser par la droite
    C: Klaxonner pour avertir le conducteur qu'il est dans la mauvaise voie
    D: Accélérer pour dépasser par la gauche
  answer: B
  explanation: Les gros camions ont besoin d'espace supplémentaire pour effectuer
    des virages. Ils font souvent un large écart vers la gauche pour éviter le trottoir
    lors d'un virage à droite. Ne tentez jamais de vous faufiler entre le camion et
    le trottoir.
- id: 181
  category: sharing_the_road
  question: À l'Île-du-Prince-Édouard, si vous êtes impliqué dans une collision avec
    un piéton, quelle est la première priorité ?
  choices:
    A: Appeler votre compagnie d'assurance
    B: Vérifier s'il y a des blessés et appeler le 911 si nécessaire
    C: Prendre des photos des dommages au véhicule
    D: Déplacer immédiatement votre véhicule sur le côté de la route
  answer: B
  explanation: La priorité immédiate dans toute collision impliquant un piéton est
    de vérifier s'il y a des blessés et de s'assurer que les services médicaux d'urgence
    sont informés.
- id: 182
  category: sharing_the_road
  question: Lorsqu'un autobus de transport en commun à l'Île-du-Prince-Édouard signale
    son intention de réintégrer la circulation à partir d'une aire d'arrêt, que devez-vous
    faire ?
  choices:
    A: Accélérer pour dépasser l'autobus
    B: Céder le passage à l'autobus si cela peut se faire en toute sécurité
    C: Maintenir votre vitesse ; l'autobus doit attendre qu'il y ait un espace
    D: S'arrêter et attendre que l'autobus termine tout son trajet
  answer: B
  explanation: Bien que la sécurité soit primordiale, les conducteurs doivent être
    courtois et céder le passage aux autobus de transport en commun qui réintègrent
    le flux de circulation afin de respecter les horaires de transport public.
- id: 183
  category: sharing_the_road
  question: À l'approche d'un véhicule d'urgence immobilisé avec ses feux clignotants
    allumés sur une autoroute de l'Île-du-Prince-Édouard, que doit faire un conducteur
    s'il y a deux voies ou plus circulant dans la même direction ?
  choices:
    A: S'arrêter immédiatement dans la voie actuelle
    B: Maintenir sa vitesse mais klaxonner pour alerter les secouristes
    C: Ralentir et changer de voie pour s'éloigner du véhicule d'urgence, si cela
      peut se faire en toute sécurité
    D: Accélérer pour dépasser le véhicule le plus rapidement possible
  answer: C
  explanation: La loi sur le corridor de sécurité de l'Île-du-Prince-Édouard exige
    que les conducteurs ralentissent et, s'il y a plusieurs voies, se déplacent vers
    une voie qui n'est pas adjacente au véhicule d'urgence pour créer une zone de
    sécurité.
- id: 184
  category: sharing_the_road
  question: À l'Île-du-Prince-Édouard, quelle est la distance minimale à laquelle
    vous devez vous arrêter de l'avant ou de l'arrière d'un autobus scolaire dont
    les feux rouges clignotent et le bras d'arrêt est déployé ?
  choices:
    A: 3 mètres
    B: 6 mètres
    C: 10 mètres
    D: 15 mètres
  answer: B
  explanation: Les conducteurs doivent s'arrêter à au moins 6 mètres d'un autobus
    scolaire lorsque ses feux rouges clignotent, qu'ils arrivent de l'avant ou qu'ils
    le suivent par l'arrière.
- id: 185
  category: sharing_the_road
  question: Lorsque vous suivez un véhicule d'urgence (comme un camion de pompiers)
    dont les sirènes ou les feux fonctionnent, quelle est la distance de suivi minimale
    requise par la loi de l'Île-du-Prince-Édouard ?
  choices:
    A: 50 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: C
  explanation: À l'Île-du-Prince-Édouard, il est illégal de suivre à moins de 150
    mètres un véhicule d'urgence qui répond à une alarme.
- id: 186
  category: sharing_the_road
  question: Selon le manuel du conducteur de l'Île-du-Prince-Édouard, comment appelle-t-on
    les grands angles morts autour d'un camion commercial où le conducteur ne peut
    pas vous voir ?
  choices:
    A: Zones de danger
    B: No-Zones
    C: Zones de silence
    D: Zones d'ombre
  answer: B
  explanation: Les angles morts situés à l'avant, à l'arrière et sur les côtés d'un
    camion sont appelés « No-Zones ». Si vous ne voyez pas le visage du conducteur
    du camion dans ses rétroviseurs latéraux, il ne peut pas vous voir.
- id: 187
  category: sharing_the_road
  question: À l'Île-du-Prince-Édouard, lorsqu'un autobus scolaire affiche des feux
    jaunes clignotants, qu'est-ce que cela indique aux autres conducteurs ?
  choices:
    A: L'autobus est sur le point de s'arrêter pour faire monter ou descendre des
      élèves
    B: L'autobus subit une défaillance mécanique
    C: L'autobus circule en dessous de la limite de vitesse
    D: L'autobus tourne à gauche
  answer: A
  explanation: Les feux jaunes clignotants sur un autobus scolaire servent d'avertissement
    que l'autobus se prépare à s'arrêter. Les conducteurs doivent se préparer à arrêter
    leur véhicule.
- id: 188
  category: sharing_the_road
  question: Lorsqu'un piéton traverse la rue à un passage pour piétons balisé ou non
    balisé à l'Île-du-Prince-Édouard, qui a la priorité ?
  choices:
    A: L'automobiliste, s'il circule à la limite de vitesse
    B: Le piéton
    C: L'automobiliste, à moins que le piéton ne se trouve dans une zone scolaire
    D: La personne qui est arrivée à l'intersection en premier
  answer: B
  explanation: En vertu de la loi sur la circulation routière de l'Île-du-Prince-Édouard,
    les conducteurs doivent céder le passage à un piéton qui se trouve dans un passage
    pour piétons (balisé ou non balisé).
- id: 189
  category: sharing_the_road
  question: Lorsque vous partagez la route avec une motocyclette, pourquoi devriez-vous
    prévoir une distance de suivi plus grande que pour une voiture ?
  choices:
    A: Les motocyclettes ont une distance d'arrêt beaucoup plus courte
    B: Les motocyclettes sont plus lourdes et plus difficiles à arrêter
    C: La loi exige de suivre les motocyclettes à une distance de 100 mètres
    D: Les motocyclettes circulent toujours plus lentement que la limite de vitesse
  answer: A
  explanation: Les motocyclettes peuvent s'arrêter beaucoup plus rapidement que les
    voitures. Suivre de trop près peut entraîner une collision si le motocycliste
    doit freiner brusquement.
- id: 190
  category: sharing_the_road
  question: 'À l''Île-du-Prince-Édouard, si un véhicule d''urgence s''approche de
    vous par l''avant ou par l''arrière avec sa sirène et ses feux allumés, vous devez
    céder le passage et :'
  choices:
    A: S'arrêter exactement là où vous êtes
    B: Accélérer pour libérer le passage
    C: Se ranger immédiatement à droite aussi loin que possible et s'arrêter
    D: Tourner dans l'entrée la plus proche et attendre
  answer: C
  explanation: Les conducteurs doivent se ranger vers le trottoir de droite ou le
    bord de la chaussée, à l'écart de toute intersection, et s'arrêter jusqu'à ce
    que le véhicule d'urgence soit passé.
- id: 191
  category: sharing_the_road
  question: 'Lorsqu''un gros camion tourne à droite à une intersection, il peut avoir
    besoin de :'
  choices:
    A: S'écarter largement vers la gauche avant de tourner
    B: Rester aussi près que possible de la bordure droite
    C: Reculer pour effectuer le virage
    D: S'arrêter et attendre que tout le reste de la circulation ait libéré l'intersection
  answer: A
  explanation: En raison de leur longueur, les gros camions doivent souvent s'écarter
    largement vers la gauche pour ne pas heurter le trottoir lors d'un virage à droite.
    Les conducteurs ne doivent jamais essayer de se faufiler entre le camion et la
    bordure du trottoir.
- id: 192
  category: sharing_the_road
  question: Selon la loi de l'Île-du-Prince-Édouard, qu'est-ce qu'un cycliste est
    tenu d'avoir lorsqu'il circule la nuit ?
  choices:
    A: Un feu blanc à l'avant et un feu rouge ou un réflecteur à l'arrière
    B: Un feu jaune à l'avant et un feu bleu à l'arrière
    C: Un gilet haute visibilité et une lampe de casque
    D: Du ruban réfléchissant sur les pédales uniquement
  answer: A
  explanation: Pour la conduite de nuit, le Highway Traffic Act de l'Île-du-Prince-Édouard
    exige que les bicyclettes soient équipées d'un feu blanc à l'avant et d'un feu
    rouge ou d'un réflecteur à l'arrière.
- id: 193
  category: sharing_the_road
  question: À l'Île-du-Prince-Édouard, qu'indique un piéton transportant une canne
    blanche ?
  choices:
    A: Le piéton est une personne âgée
    B: Le piéton est sourd
    C: Le piéton est aveugle ou a une déficience visuelle
    D: Le piéton a un problème de mobilité physique
  answer: C
  explanation: La canne blanche est utilisée par les personnes aveugles ou malvoyantes.
    Les conducteurs doivent faire preuve d'une extrême prudence et céder le passage
    à ces piétons.
- id: 194
  category: vehicle_information
  question: Quelle est la profondeur de sculpture minimale légale pour les pneus d'un
    véhicule de tourisme à l'Île-du-Prince-Édouard ?
  choices:
    A: 1,0 millimètre
    B: 1,6 millimètre
    C: 2,5 millimètres
    D: 3,2 millimètres
  answer: B
  explanation: À l'Île-du-Prince-Édouard, les pneus sont considérés comme dangereux
    et échoueront à l'inspection si la profondeur de la sculpture est inférieure à
    1,6 millimètre (2/32 de pouce).
- id: 195
  category: vehicle_information
  question: Lorsque vous suivez un autre véhicule la nuit à l'Île-du-Prince-Édouard,
    à quelle distance devez-vous passer de vos feux de route aux feux de croisement
    ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Selon la loi de l'Île-du-Prince-Édouard, vous devez passer en feux
    de croisement lorsque vous suivez un autre véhicule à une distance de 60 mètres
    ou moins.
- id: 196
  category: vehicle_information
  question: 'Tout véhicule à moteur à l''Île-du-Prince-Édouard doit être équipé d''un
    klaxon pouvant être entendu d''une distance d''au moins :'
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Le Highway Traffic Act exige un klaxon en bon état de fonctionnement
    capable d'émettre un son audible dans des conditions normales à une distance d'au
    moins 60 mètres.
- id: 197
  category: vehicle_information
  question: En ce qui concerne la teinte des vitres à l'Île-du-Prince-Édouard, laquelle
    des affirmations suivantes est vraie pour une voiture de tourisme ?
  choices:
    A: La teinte est autorisée sur le pare-brise jusqu'à 50 %.
    B: Aucune teinte après-vente n'est autorisée sur le pare-brise ou les vitres latérales
      avant.
    C: Les vitres latérales avant peuvent être teintées jusqu'à 35 %.
    D: N'importe quelle vitre peut être teintée tant que le conducteur porte des lunettes.
  answer: B
  explanation: Les règlements de l'Île-du-Prince-Édouard interdisent l'application
    de tout film de teinte de vitre après-vente sur le pare-brise ou sur les vitres
    situées directement à gauche et à droite du conducteur.
- id: 198
  category: vehicle_information
  question: 'À l''Île-du-Prince-Édouard, les feux de route doivent être capables de
    révéler des personnes et des véhicules à une distance d''au moins :'
  choices:
    A: 60 mètres
    B: 100 mètres
    C: 150 mètres
    D: 200 mètres
  answer: B
  explanation: Le Highway Traffic Act précise que les feux de route doivent être orientés
    de manière à révéler des personnes et des véhicules à une distance d'au moins
    100 mètres devant le véhicule.
- id: 199
  category: vehicle_information
  question: Si un chargement dépasse de plus de combien de mètres l'arrière d'un véhicule
    à l'Île-du-Prince-Édouard, doit-il être marqué d'un drapeau rouge ou d'un feu
    rouge ?
  choices:
    A: 0,5 mètre
    B: 1,0 mètre
    C: 1,2 mètre
    D: 2,0 mètres
  answer: C
  explanation: À l'Île-du-Prince-Édouard, si un chargement dépasse de 1,2 mètre (environ
    4 pieds) ou plus de l'arrière du véhicule, un drapeau rouge (le jour) ou un feu
    rouge (la nuit) doit être fixé à l'extrémité du chargement.
- id: 200
  category: vehicle_information
  question: 'À l''Île-du-Prince-Édouard, les feux de croisement doivent être orientés
    de manière à révéler des personnes et des véhicules à une distance d''au moins
    :'
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 60 mètres
  answer: B
  explanation: Les feux de croisement doivent être conçus et réglés de manière à révéler
    des personnes et des véhicules à une distance d'au moins 30 mètres devant le véhicule.
- id: 201
  category: vehicle_information
  question: Tout véhicule à moteur à l'Î.-P.-É. doit être muni d'un miroir placé de
    manière à offrir au conducteur une vue de la chaussée sur une distance d'au moins
    ____ vers l'arrière.
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 200 mètres
  answer: B
  explanation: La Loi sur le code de la route exige que les miroirs offrent une vue
    de la chaussée sur au moins 60 mètres vers l'arrière du véhicule.
- id: 202
  category: vehicle_information
  question: À l'Île-du-Prince-Édouard, de quelle couleur doit être le feu éclairant
    la plaque d'immatriculation arrière ?
  choices:
    A: Rouge
    B: Bleu
    C: Blanc
    D: Ambre
  answer: C
  explanation: La plaque d'immatriculation arrière doit être éclairée par un feu blanc
    afin que les caractères soient clairement lisibles à une distance de 15 mètres
    vers l'arrière.
- id: 203
  category: vehicle_information
  question: Lequel des équipements suivants est obligatoire pour tous les véhicules
    à moteur circulant sur les routes de l'Î.-P.-É. ?
  choices:
    A: Feux antibrouillard
    B: Un indicateur de vitesse en bon état de fonctionnement
    C: Un système de navigation GPS
    D: Une caméra de recul
  answer: B
  explanation: Un indicateur de vitesse fonctionnel est un équipement obligatoire
    pour tous les véhicules à moteur afin de s'assurer que le conducteur peut surveiller
    sa vitesse avec précision.
- id: 204
  category: vehicle_information
  question: À l'Île-du-Prince-Édouard, quand êtes-vous tenu d'allumer les phares de
    votre véhicule ?
  choices:
    A: D'une heure après le coucher du soleil à une heure avant le lever du soleil.
    B: Uniquement lorsqu'il pleut ou qu'il neige.
    C: Du coucher au lever du soleil et chaque fois que la visibilité est réduite
      à 150 mètres ou moins.
    D: Uniquement lors de la conduite sur des routes rurales non éclairées.
  answer: C
  explanation: Les phares doivent être allumés du coucher au lever du soleil, et à
    tout autre moment où la visibilité est réduite à 150 mètres ou moins en raison
    des conditions atmosphériques.
- id: 205
  category: vehicle_information
  question: En vertu de la Loi sur le code de la route de l'Î.-P.-É., le frein de
    service doit être capable d'arrêter le véhicule sur une route sèche et plane sur
    quelle distance lorsqu'il roule à 30 km/h ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: B
  explanation: Le frein de service doit être capable d'arrêter le véhicule sur une
    distance de 10 mètres lorsque le véhicule roule à une vitesse de 30 km/h.
- id: 206
  category: vehicle_information
  question: 'La plaque d''immatriculation arrière d''un véhicule à l''Î.-P.-É. doit
    être éclairée par un feu blanc afin d''être clairement lisible à une distance
    d''au moins :'
  choices:
    A: 10 mètres
    B: 15 mètres
    C: 20 mètres
    D: 25 mètres
  answer: B
  explanation: La loi de l'Î.-P.-É. exige que la plaque d'immatriculation arrière
    soit éclairée par un feu blanc, la rendant visible à une distance de 15 mètres
    vers l'arrière.
- id: 207
  category: vehicle_information
  question: À l'Île-du-Prince-Édouard, quelle est la règle concernant la pose de pellicules
    teintées non d'origine sur le pare-brise et les vitres latérales avant ?
  choices:
    A: C'est permis si cela bloque moins de 50 % de la lumière.
    B: C'est permis uniquement sur les 10 cm supérieurs du pare-brise.
    C: Aucune pellicule teintée non d'origine n'est autorisée sur le pare-brise ou
      les vitres latérales avant.
    D: C'est permis si le conducteur possède une note médicale.
  answer: C
  explanation: Les règlements de l'Î.-P.-É. interdisent l'application de toute pellicule
    teintée non d'origine sur le pare-brise ou sur les vitres à gauche et à droite
    du conducteur.
- id: 208
  category: vehicle_information
  question: En ce qui concerne les systèmes d'échappement des véhicules à l'Î.-P.-É.,
    lequel des éléments suivants est illégal ?
  choices:
    A: Utiliser un silencieux qui n'est pas la pièce d'origine du fabricant.
    B: Utiliser un dispositif de dérivation ou un « cut-out » de silencieux.
    C: Avoir un tuyau d'échappement qui sort sur le côté du véhicule.
    D: Utiliser un tuyau d'échappement à embout chromé.
  answer: B
  explanation: La Loi sur le code de la route de l'Î.-P.-É. interdit l'utilisation
    d'un dispositif de dérivation (bypass), d'un échappement direct, d'un « cut-out
    » ou de tout dispositif similaire augmentant le bruit.
- id: 209
  category: vehicle_information
  question: Si le rétroviseur intérieur d'un véhicule est obstrué par une remorque
    ou un chargement, quelle est l'exigence à l'Î.-P.-É. ?
  choices:
    A: Le conducteur doit retirer l'obstruction immédiatement.
    B: Le conducteur doit avoir un miroir intérieur et un miroir latéral.
    C: Le véhicule doit être équipé de rétroviseurs extérieurs sur les côtés gauche
      et droit.
    D: Le conducteur doit faire appel à un passager pour le guider en tout temps.
  answer: C
  explanation: Si la vue du rétroviseur intérieur est obstruée, le véhicule doit être
    équipé de rétroviseurs extérieurs sur les côtés gauche et droit pour offrir une
    vue dégagée vers l'arrière.
- id: 210
  category: vehicle_information
  question: À l'Î.-P.-É., de quelle couleur doivent être les feux de signalisation
    (clignotants) à l'avant d'un véhicule à moteur ?
  choices:
    A: Blanc ou ambre
    B: Rouge ou ambre
    C: Bleu ou blanc
    D: Vert ou ambre
  answer: A
  explanation: Selon les normes d'équipement des véhicules, les clignotants avant
    doivent être blancs ou ambres, tandis que les clignotants arrière doivent être
    rouges ou ambres.
- id: 211
  category: signs_and_signals
  question: À l'Île-du-Prince-Édouard, que signifie un feu rouge clignotant ?
  choices:
    A: Ralentir et avancer avec prudence
    B: Le feu est sur le point de passer au vert
    C: S'arrêter, céder le passage à la circulation et aux piétons, et avancer quand
      on peut le faire en toute sécurité
    D: S'arrêter et attendre que le feu devienne vert fixe
  answer: C
  explanation: Selon le Guide du conducteur de l'Î.-P.-É., un feu rouge clignotant
    a la même signification qu'un panneau d'arrêt. Vous devez marquer un arrêt complet,
    céder le passage et ne repartir que lorsque c'est sécuritaire.
- id: 212
  category: signs_and_signals
  question: Lorsqu'un conducteur à l'Î.-P.-É. sort son bras gauche par la fenêtre
    et le pointe vers le haut, quel signal donne-t-il ?
  choices:
    A: Virage à gauche
    B: Virage à droite
    C: Arrêt ou ralentissement
    D: Céder le passage aux piétons
  answer: B
  explanation: Le signal manuel standard pour un virage à droite consiste à sortir
    le bras gauche par la fenêtre et à le plier vers le haut au niveau du coude.
- id: 213
  category: signs_and_signals
  question: Sur les routes de l'Île-du-Prince-Édouard, qu'indique une ligne jaune
    continue de votre côté de la ligne médiane ?
  choices:
    A: Le dépassement est autorisé si la route est libre
    B: Il s'agit d'une rue à sens unique
    C: Le dépassement est interdit
    D: Vous approchez d'une zone scolaire
  answer: C
  explanation: Une ligne jaune continue de votre côté de la ligne médiane signifie
    que le dépassement est dangereux et strictement interdit.
- id: 214
  category: signs_and_signals
  question: À l'Î.-P.-É., que devez-vous faire en approchant d'un autobus scolaire,
    venant de l'une ou l'autre direction, dont les feux ambre (jaunes) clignotent
    ?
  choices:
    A: S'arrêter immédiatement
    B: Accélérer pour dépasser avant que les feux rouges ne clignotent
    C: Se préparer à s'arrêter, car l'autobus est sur le point de s'arrêter pour faire
      monter ou descendre des élèves
    D: Maintenir sa vitesse mais surveiller les enfants
  answer: C
  explanation: Les feux ambre clignotants d'un autobus scolaire servent d'avertissement
    que l'autobus ralentit et est sur le point de s'arrêter. Les conducteurs doivent
    se préparer à immobiliser leur véhicule.
- id: 215
  category: signs_and_signals
  question: Que signifie un feu jaune clignotant à une intersection à l'Île-du-Prince-Édouard
    ?
  choices:
    A: S'arrêter et attendre que le feu passe au vert
    B: Ralentir et avancer avec prudence
    C: L'intersection est fermée
    D: Les piétons ont la priorité dans toutes les directions
  answer: B
  explanation: Un feu jaune clignotant avertit les conducteurs de ralentir et d'être
    particulièrement prudents lorsqu'ils entrent dans l'intersection ou la traversent.
- id: 216
  category: signs_and_signals
  question: 'À l''Î.-P.-É., un marquage au sol consistant en un grand losange blanc
    indique :'
  choices:
    A: Une zone à forte collision
    B: Un passage pour piétons
    C: Une voie réservée à des véhicules spécifiques comme les autobus ou les vélos
    D: La fin d'une route à chaussées séparées
  answer: C
  explanation: Le symbole du losange sur la chaussée indique une voie réservée, dont
    l'usage est limité à certains types de véhicules tels que les autobus, les taxis
    ou les vélos à certaines heures.
- id: 217
  category: signs_and_signals
  question: En entrant dans un carrefour giratoire à l'Île-du-Prince-Édouard, quel
    signal devez-vous utiliser si vous avez l'intention de sortir 'tout droit' (la
    deuxième sortie) ?
  choices:
    A: Signaler à gauche à l'entrée
    B: Signaler à droite à l'entrée
    C: Ne pas signaler à l'entrée, mais signaler à droite après avoir dépassé la sortie
      précédant celle que vous visez
    D: Garder ses feux de détresse allumés jusqu'à la sortie
  answer: C
  explanation: Dans les carrefours giratoires de l'Î.-P.-É., si vous allez tout droit,
    vous ne signalez pas à l'entrée. Cependant, vous devez toujours signaler à droite
    immédiatement après avoir dépassé la sortie précédant celle que vous voulez prendre.
- id: 218
  category: signs_and_signals
  question: Quelle est la signification d'un signal de 'priorité au transport en commun',
    qui est une barre verticale blanche fixe sur fond noir ?
  choices:
    A: Toute la circulation doit s'arrêter
    B: Seuls les véhicules d'urgence peuvent passer
    C: Seuls les autobus de transport en commun peuvent passer alors que les autres
      véhicules font face à un feu rouge
    D: La route est réservée aux piétons uniquement
  answer: C
  explanation: Un signal à barre verticale blanche permet aux autobus de transport
    en commun de traverser l'intersection alors que toutes les autres voies font face
    à un feu rouge, leur accordant ainsi la priorité.
- id: 219
  category: signs_and_signals
  question: 'À l''Î.-P.-É., un panneau avec un fond orange et des symboles ou des
    lettres noirs est utilisé pour :'
  choices:
    A: Des informations réglementaires
    B: Des avertissements de travaux de construction et d'entretien
    C: Des avertissements de zone scolaire
    D: Un guidage directionnel vers les parcs
  answer: B
  explanation: L'orange est la couleur standard pour les conditions temporaires, telles
    que les zones de construction, d'entretien routier ou de travaux de services publics.
- id: 220
  category: signs_and_signals
  question: À l'Î.-P.-É., que représente une ligne blanche continue peinte en travers
    d'une voie de circulation à une intersection ?
  choices:
    A: Un séparateur de voie
    B: Une ligne d'arrêt
    C: Une limite de stationnement
    D: Un ralentisseur
  answer: B
  explanation: Une ligne blanche continue en travers d'une voie indique l'endroit
    où un véhicule doit s'arrêter pour un panneau d'arrêt ou un signal lumineux.
- id: 221
  category: signs_and_signals
  question: Que signifie une flèche verte affichée avec un feu rouge à l'Île-du-Prince-Édouard
    ?
  choices:
    A: Vous devez vous arrêter et attendre que le feu rouge change
    B: Vous pouvez tourner prudemment dans la direction de la flèche, en cédant le
      passage aux piétons
    C: La flèche est un avertissement que le feu est sur le point de passer au rouge
    D: Vous avez un virage protégé ; avancez dans la direction de la flèche
  answer: D
  explanation: Une flèche verte avec un feu rouge signifie que vous pouvez avancer
    dans la direction de la flèche. Il s'agit généralement d'un mouvement « protégé
    » où la circulation venant en sens inverse est arrêtée.
- id: 222
  category: signs_and_signals
  question: À l'Î-P-É, qu'indique un panneau en forme de pentagone (cinq côtés, pointe
    vers le haut) ?
  choices:
    A: Cédez le passage
    B: Panneau d'arrêt à venir
    C: Zone scolaire ou passage pour écoliers
    D: Passage à niveau
  answer: C
  explanation: Un panneau en forme de pentagone est utilisé exclusivement pour avertir
    les conducteurs qu'ils se trouvent dans ou à l'approche d'une zone scolaire ou
    d'un passage pour écoliers.
- id: 223
  category: signs_and_signals
  question: Que signifient les lignes blanches discontinues (pointillées) sur une
    chaussée à l'Île-du-Prince-Édouard ?
  choices:
    A: Séparation de la circulation circulant dans des directions opposées
    B: Séparation des voies de circulation circulant dans la même direction
    C: Une zone de passage pour piétons
    D: Changement de voie interdit
  answer: B
  explanation: Les lignes blanches discontinues séparent les voies de circulation
    circulant dans la même direction. Les conducteurs peuvent franchir ces lignes
    pour changer de voie lorsqu'il est sécuritaire de le faire.
- id: 224
  category: signs_and_signals
  question: Si vous approchez d'une intersection à l'Î-P-É et que le feu passe du
    vert au jaune, quelle est l'action correcte ?
  choices:
    A: Accélérer pour dégager l'intersection avant qu'il ne passe au rouge
    B: S'arrêter, à moins d'être déjà dans l'intersection ou si près que l'arrêt serait
      dangereux
    C: Toujours s'arrêter, peu importe votre position
    D: Klaxonner et avancer
  answer: B
  explanation: Un feu jaune signifie que le signal est sur le point de passer au rouge.
    Vous devez vous arrêter si vous pouvez le faire en toute sécurité. Si vous êtes
    déjà dans l'intersection, vous devez avancer avec prudence.
- id: 225
  category: signs_and_signals
  question: À l'Î-P-É, quelle est la signification d'un feu jaune (ambre) clignotant
    sur un autobus scolaire ?
  choices:
    A: L'autobus a des problèmes mécaniques
    B: L'autobus est sur le point de s'arrêter pour ramasser ou déposer des élèves
      ; préparez-vous à arrêter
    C: Vous pouvez dépasser l'autobus avec prudence
    D: L'autobus circule en dessous de la limite de vitesse
  answer: B
  explanation: L'Î-P-É utilise le système à huit feux sur les autobus scolaires. Les
    feux jaunes clignotants avertissent les autres conducteurs que l'autobus ralentit
    et est sur le point de s'arrêter pour faire monter ou descendre des enfants.
- id: 226
  category: signs_and_signals
  question: Si un conducteur à l'Île-du-Prince-Édouard tend le bras gauche horizontalement
    par la fenêtre, qu'indique ce signal manuel ?
  choices:
    A: Un virage à droite
    B: Un arrêt ou une diminution de la vitesse
    C: Un virage à gauche
    D: L'intention de se ranger le long du trottoir
  answer: C
  explanation: Le signal manuel standard pour un virage à gauche est le bras gauche
    tendu horizontalement par la fenêtre.
- id: 227
  category: signs_and_signals
  question: Quelle est la signification d'un feu jaune clignotant à une intersection
    à l'Î-P-É ?
  choices:
    A: Arrêtez-vous et attendez le feu vert
    B: Le feu est sur le point de passer au rouge ; dégagez l'intersection
    C: Ralentissez et avancez avec prudence
    D: Cédez le passage à toute la circulation venant de la droite uniquement
  answer: C
  explanation: Un feu jaune clignotant sert d'avertissement pour ralentir et être
    très prudent lorsque vous entrez ou traversez l'intersection.
- id: 228
  category: signs_and_signals
  question: 'À l''Île-du-Prince-Édouard, un panneau en forme de losange avec un fond
    orange est utilisé pour indiquer :'
  choices:
    A: Des avertissements généraux sur l'état de la route
    B: Des règles de prescription comme les limites de vitesse
    C: Des conditions temporaires telles que des travaux de construction ou de voirie
    D: Des informations sur les services et les installations
  answer: C
  explanation: Les panneaux orange en forme de losange sont utilisés spécifiquement
    pour les conditions temporaires, y compris les zones de construction et les travaux
    d'entretien, afin d'avertir les conducteurs de dangers inhabituels.
- id: 229
  category: signs_and_signals
  question: Que devez-vous faire à l'approche d'un passage à niveau à l'Î-P-É où les
    feux d'avertissement clignotent ?
  choices:
    A: Ralentir et traverser si aucun train n'est visible
    B: S'arrêter à au moins 5 mètres du rail le plus proche
    C: S'arrêter à au moins 15 mètres du rail le plus proche
    D: S'arrêter à au moins 5 mètres et à au plus 15 mètres du rail le plus proche
  answer: D
  explanation: La loi sur la circulation routière de l'Î-P-É (Highway Traffic Act)
    exige que les conducteurs s'arrêtent à au moins 5 mètres et à au plus 15 mètres
    du rail le plus proche lorsque les signaux indiquent l'approche d'un train.
- id: 230
  category: signs_and_signals
  question: 'Un panneau blanc avec un cercle noir et une bordure verte autour d''une
    flèche droite indique :'
  choices:
    A: Circulation à sens unique seulement
    B: Vous devez obligatoirement aller tout droit
    C: Aucun virage autorisé
    D: Le mouvement tout droit est autorisé
  answer: B
  explanation: Un cercle vert (panneau d'obligation) avec une flèche droite signifie
    que « tout droit seulement » est le mouvement obligatoire pour cette voie ou cette
    intersection.
- id: 231
  category: signs_and_signals
  question: À l'Î.-P.-É., que signifient les « chevrons de partage » (sharrows) (un
    symbole de bicyclette surmonté de deux chevrons) peints sur la chaussée ?
  choices:
    A: La voie est réservée exclusivement aux bicyclettes
    B: Les bicyclettes ne sont pas autorisées dans cette voie
    C: Les automobilistes et les cyclistes doivent partager la voie
    D: Les cyclistes doivent rouler sur le trottoir dans cette zone
  answer: C
  explanation: Les chevrons de partage indiquent que la voie est un espace partagé
    par les automobilistes et les cyclistes, rappelant aux conducteurs de s'attendre
    à la présence de cyclistes et aux cyclistes de se positionner en toute sécurité.
- id: 232
  category: signs_and_signals
  question: 'Lorsqu''un feu de circulation à l''Î.-P.-É. affiche une flèche verte
    fixe et un feu rouge fixe, cela signifie :'
  choices:
    A: Vous devez vous arrêter et attendre que le feu rouge devienne vert
    B: Vous pouvez avancer uniquement dans la direction de la flèche
    C: Vous pouvez avancer dans n'importe quelle direction tant que c'est sécuritaire
    D: Le signal est défectueux
  answer: B
  explanation: Une flèche verte combinée à un feu rouge signifie que vous pouvez avancer
    prudemment dans la direction de la flèche, en cédant le passage aux piétons et
    aux autres véhicules déjà engagés dans l'intersection.
- id: 233
  category: signs_and_signals
  question: À l'Île-du-Prince-Édouard, quel est le signal manuel pour un « virage
    à droite » ?
  choices:
    A: Bras gauche tendu horizontalement
    B: Bras gauche tendu vers l'extérieur et vers le haut
    C: Bras gauche tendu vers l'extérieur et vers le bas
    D: Bras droit tendu horizontalement
  answer: B
  explanation: Pour signaler un virage à droite à l'aide de signaux manuels, le conducteur
    sort le bras gauche par la fenêtre et le plie vers le haut au niveau du coude.
- id: 234
  category: signs_and_signals
  question: Que signifie un panneau « Cédez le passage » (un triangle inversé avec
    une bordure rouge) à l'Î.-P.-É. ?
  choices:
    A: S'arrêter systématiquement avant d'entrer dans l'intersection
    B: Accélérer pour s'insérer dans la circulation
    C: Ralentir et se préparer à s'arrêter ; céder le passage à la circulation dans
      l'intersection
    D: Céder le passage uniquement aux piétons, pas aux autres véhicules
  answer: C
  explanation: Un panneau de cédez le passage signifie que vous devez ralentir et,
    si nécessaire, vous arrêter pour céder le passage à tout véhicule ou piéton se
    trouvant dans l'intersection ou s'approchant d'une autre route de si près qu'il
    constitue un danger.
- id: 235
  category: signs_and_signals
  question: À l'Î.-P.-É., qu'indique généralement un feu vert clignotant à une intersection
    ?
  choices:
    A: Le feu est sur le point de passer au jaune
    B: Il s'agit d'un signal actionné par les piétons ; avancez avec prudence
    C: Vous avez un virage à gauche protégé
    D: Des véhicules d'urgence approchent
  answer: B
  explanation: Dans de nombreuses provinces de l'Atlantique, y compris l'Î.-P.-É.,
    un feu vert clignotant indique souvent un signal contrôlé par les piétons. Les
    conducteurs doivent être prêts à ce que le feu change si un piéton appuie sur
    le bouton.
