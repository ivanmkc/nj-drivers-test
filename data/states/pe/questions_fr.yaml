questions:
- id: 1
  category: license_system
  question: À l'Île-du-Prince-Édouard, quel est l'âge minimum requis pour demander
    un permis de conduire de classe 7 (d'apprentissage) ?
  choices:
    A: 14 ans
    B: 15 ans
    C: 16 ans
    D: 17 ans
  answer: C
  explanation: Selon le Guide du conducteur de l'Î.-P.-É., une personne doit avoir
    au moins 16 ans pour demander un permis de conduire d'apprentissage de classe
    7.
- id: 2
  category: license_system
  question: Dans le cadre du programme de permis de conduire progressif (GDL) de l'Î.-P.-É.,
    pendant combien de temps un conducteur de l'étape 1 (L) doit-il détenir son permis
    avant de passer un examen de conduite s'il n'a PAS suivi de programme d'éducation
    routière certifié ?
  choices:
    A: 180 jours
    B: 273 jours
    C: 365 jours
    D: 2 ans
  answer: C
  explanation: Les conducteurs de l'étape 1 (L) doivent attendre 365 jours avant de
    passer un examen de conduite. Cette période est réduite à 273 jours s'ils réussissent
    un programme d'éducation routière reconnu.
- id: 3
  category: license_system
  question: Un conducteur accompagnateur pour un conducteur de l'étape 1 (L) à l'Île-du-Prince-Édouard
    doit détenir un permis de conduire valide depuis au moins combien d'années ?
  choices:
    A: 1 an
    B: 2 ans
    C: 3 ans
    D: 4 ans
  answer: D
  explanation: La personne accompagnant un conducteur de l'étape 1 doit détenir un
    permis de conduire valide depuis au moins quatre ans.
- id: 4
  category: license_system
  question: Quelle est l'alcoolémie (BAC) maximale autorisée pour tout conducteur
    participant au programme de permis de conduire progressif (GDL) de l'Î.-P.-É.
    ?
  choices:
    A: 0,00 %
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: A
  explanation: Tous les conducteurs du programme GDL (étapes 1, 2 et 3) doivent maintenir
    un taux d'alcoolémie de zéro (0,00 %) lorsqu'ils conduisent un véhicule.
- id: 5
  category: license_system
  question: À l'étape 2 (G) du programme GDL de l'Î.-P.-É., quelles sont les restrictions
    de conduite de nuit ?
  choices:
    A: Pas de conduite entre minuit et 5 h 00
    B: Pas de conduite entre 1 h 00 et 5 h 00
    C: Pas de conduite entre 23 h 00 et 6 h 00
    D: Pas de conduite après le coucher du soleil
  answer: B
  explanation: Les conducteurs de l'étape 2 (G) ont l'interdiction de conduire entre
    1 h 00 et 5 h 00 du matin, à moins d'être âgés de 21 ans ou plus ou de bénéficier
    d'une exemption à des fins professionnelles.
- id: 6
  category: license_system
  question: Combien de points d'inaptitude entraînent une suspension automatique du
    permis pour un conducteur participant au programme de permis de conduire progressif
    (GDL) de l'Î.-P.-É. ?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: A
  explanation: Les conducteurs du programme GDL font l'objet d'une suspension lorsqu'ils
    accumulent 6 points d'inaptitude ou plus, alors que les conducteurs titulaires
    d'un permis complet sont suspendus à 12 points.
- id: 7
  category: license_system
  question: Lorsqu'un conducteur s'installe à l'Île-du-Prince-Édouard, de quel délai
    dispose-t-il pour informer la Sécurité routière (Highway Safety) de son changement
    d'adresse ?
  choices:
    A: 7 jours
    B: 10 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: Selon la loi de l'Î.-P.-É., vous devez informer la Division de la sécurité
    routière de tout changement d'adresse dans les 30 jours.
- id: 8
  category: license_system
  question: À l'étape 1 (L) du programme GDL de l'Î.-P.-É., qui est autorisé à se
    trouver dans le véhicule en plus du conducteur et de l'accompagnateur ?
  choices:
    A: Membres de la famille immédiate seulement
    B: Un ami
    C: Aucun autre passager n'est autorisé
    D: Jusqu'à deux autres passagers
  answer: C
  explanation: À l'étape 1 (L), la seule personne autorisée dans le véhicule en dehors
    du conducteur est le conducteur accompagnateur qui détient un permis depuis au
    moins 4 ans.
- id: 9
  category: license_system
  question: Quelle est la restriction concernant les passagers pour un conducteur
    de l'étape 2 (G) à l'Î.-P.-É. qui a moins de 21 ans ?
  choices:
    A: Aucun passager autorisé
    B: Un seul passager qui n'est pas un membre de la famille immédiate
    C: Uniquement les membres de la famille immédiate
    D: Un passager qui n'est pas un membre de la famille immédiate, plus les membres
      de la famille immédiate
  answer: D
  explanation: Les conducteurs de l'étape 2 (G) sont limités à un passager qui n'est
    pas un membre de la famille immédiate. Cependant, ils peuvent transporter tous
    les membres de leur famille immédiate.
- id: 10
  category: license_system
  question: Pendant combien de temps un permis de conduire standard de l'Île-du-Prince-Édouard
    est-il valide avant de devoir être renouvelé ?
  choices:
    A: 2 ans
    B: 3 ans
    C: 5 ans
    D: 10 ans
  answer: C
  explanation: Un permis de conduire de l'Î.-P.-É. est généralement valide pour une
    période de 5 ans et expire le jour de l'anniversaire du conducteur.
- id: 11
  category: license_system
  question: Laquelle des conditions suivantes est requise pour le conducteur superviseur
    d'un conducteur de niveau 1 (L) à l'Î.-P.-É. ?
  choices:
    A: Il doit être âgé d'au moins 25 ans
    B: Il doit être assis sur le siège avant à côté du conducteur
    C: Il doit posséder un permis de classe 1
    D: Il doit avoir zéro point d'inaptitude
  answer: B
  explanation: Le conducteur superviseur doit occuper le siège immédiatement à côté
    du conducteur pour lui fournir des instructions et de l'aide.
- id: 12
  category: license_system
  question: Si le permis d'un conducteur du programme de permis progressif (GDL) est
    suspendu, qu'advient-il du temps passé dans l'étape actuelle du programme ?
  choices:
    A: Le temps continue d'être comptabilisé pendant la suspension
    B: Le temps est remis à zéro
    C: Le temps est mis en pause et reprend après la suspension
    D: Le conducteur est rétrogradé au niveau 1
  answer: B
  explanation: Dans le cadre du programme de permis progressif (GDL) de l'Î.-P.-É.,
    si un permis est suspendu, le conducteur doit recommencer la période de temps
    pour cette étape spécifique à partir de zéro une fois le permis rétabli.
- id: 13
  category: license_system
  question: Quelle est la durée minimale pendant laquelle un conducteur doit rester
    au niveau 2 (G) avant de passer au niveau 3 dans le programme GDL de l'Î.-P.-É.
    ?
  choices:
    A: 6 mois
    B: 9 mois
    C: 1 an
    D: 2 ans
  answer: C
  explanation: Les conducteurs doivent rester au niveau 2 (G) pendant au moins un
    an (365 jours) sans suspension avant de pouvoir passer au niveau 3.
- id: 14
  category: license_system
  question: Quelle classe de permis est requise à l'Î.-P.-É. pour conduire un véhicule
    de tourisme standard, comme une voiture ou une petite camionnette ?
  choices:
    A: Classe 1
    B: Classe 3
    C: Classe 5
    D: Classe 6
  answer: C
  explanation: Un permis de classe 5 est le permis standard pour conduire des automobiles
    et des camions légers à l'Île-du-Prince-Édouard.
- id: 15
  category: license_system
  question: À l'Î.-P.-É., que doit faire un conducteur de niveau 3 pour obtenir un
    permis complet (hors programme GDL) ?
  choices:
    A: Passer un autre examen routier
    B: Terminer le niveau 3 (un an) sans suspension
    C: Payer des frais de graduation de 100 $
    D: Suivre un cours de conduite préventive
  answer: B
  explanation: Le niveau 3 est la dernière étape du programme de permis progressif
    (GDL). Après avoir terminé une année au niveau 3 sans suspension, le conducteur
    n'est plus soumis aux restrictions du GDL (bien qu'il doive toujours respecter
    les lois générales de la circulation).
- id: 16
  category: license_system
  question: À l'Île-du-Prince-Édouard, quelle classe de permis est spécifiquement
    requise pour conduire un tracteur agricole sur une voie publique ?
  choices:
    A: Classe 5
    B: Classe 8
    C: Classe 9
    D: Classe 3
  answer: C
  explanation: Un permis de classe 9 à l'Î.-P.-É. est un permis restreint qui permet
    uniquement la conduite d'un tracteur agricole.
- id: 17
  category: license_system
  question: 'Pour satisfaire aux normes de vision pour un permis de classe 5 ou 7
    à l''Î.-P.-É., l''acuité visuelle d''un candidat doit être d''au moins :'
  choices:
    A: 20/20 dans les deux yeux
    B: 20/40 dans au moins un œil
    C: 20/50 dans les deux yeux
    D: 20/30 dans l'œil dominant
  answer: B
  explanation: Selon le Guide du conducteur de l'Î.-P.-É., l'exigence minimale de
    vision pour un permis de conduire standard est de 20/40 dans au moins un œil,
    avec ou sans lentilles correctrices.
- id: 18
  category: license_system
  question: 'Si un résident de l''Île-du-Prince-Édouard change de nom légal, il doit
    en informer la Sécurité routière (Highway Safety) et obtenir un permis de remplacement
    dans un délai de :'
  choices:
    A: 7 jours
    B: 14 jours
    C: 30 jours
    D: 60 jours
  answer: C
  explanation: La loi de l'Î.-P.-É. exige que les conducteurs informent la Division
    de la sécurité routière d'un changement de nom ou d'adresse dans les 30 jours.
- id: 19
  category: license_system
  question: 'Il est interdit à une personne détenant un permis d''apprentissage de
    classe 6 (moto) à l''Î.-P.-É. de :'
  choices:
    A: Conduire à plus de 60 km/h
    B: Transporter des passagers
    C: Conduire sur le pont de la Confédération
    D: Conduire une moto dont le moteur est supérieur à 250 cm³
  answer: B
  explanation: Selon les règlements de l'Î.-P.-É., un apprenti motocycliste (détenteur
    d'un permis de classe 6) n'est pas autorisé à transporter des passagers.
- id: 20
  category: license_system
  question: Si un candidat à un permis de l'Î.-P.-É. provient d'un pays qui n'a pas
    d'accord d'échange réciproque avec l'Î.-P.-É., que doit-il faire ?
  choices:
    A: Attendre 6 mois pour une vérification des antécédents
    B: Demander un permis de niveau 1 et attendre 365 jours
    C: Réussir un test de vision, un test de connaissances écrit et un examen routier
    D: Remettre son permis étranger et attendre 2 ans
  answer: C
  explanation: Les conducteurs provenant de pays sans accord de réciprocité doivent
    suivre tout le processus d'examen, y compris les tests de vision, de connaissances
    et de route, bien qu'ils puissent obtenir un crédit pour leur expérience de conduite
    antérieure afin d'éviter certains délais d'attente du programme GDL.
- id: 21
  category: license_system
  question: À l'Île-du-Prince-Édouard, laquelle des classes de permis suivantes exige
    que le candidat soumette un rapport d'aptitude médicale lors de la demande initiale
    ?
  choices:
    A: Classe 5
    B: Classe 6
    C: Classe 4
    D: Classe 8
  answer: C
  explanation: Les classes commerciales (1, 2, 3 et 4) exigent un rapport d'aptitude
    médicale pour s'assurer que le conducteur est capable d'utiliser en toute sécurité
    des véhicules de grande taille ou de transporter le public.
- id: 22
  category: license_system
  question: Si un conducteur échoue à son premier examen routier à l'Île-du-Prince-Édouard,
    quel est le délai d'attente minimal avant de pouvoir tenter l'examen à nouveau
    ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: C
  explanation: À l'Î.-P.-É., si vous échouez à un examen routier, vous devez attendre
    au moins 14 jours avant d'être admissible à le repasser.
- id: 23
  category: license_system
  question: Lors d'une première demande de permis d'apprenti conducteur à l'Î.-P.-É.,
    lequel des documents suivants est considéré comme une pièce d'identité « primaire
    » valide ?
  choices:
    A: Une carte d'identité d'étudiant
    B: Un certificat de naissance canadien
    C: Une facture de services publics
    D: Une carte de crédit
  answer: B
  explanation: Un certificat de naissance canadien ou un passeport valide sont considérés
    comme des documents primaires pour établir l'identité et la présence légale à
    l'Î.-P.-É.
- id: 24
  category: license_system
  question: 'Pendant l''étape 1 (L) du programme de permis de conduire progressif
    (GDL) de l''Î.-P.-É., il est strictement interdit au conducteur d''utiliser :'
  choices:
    A: Un système de navigation GPS monté sur le tableau de bord
    B: Le système de climatisation du véhicule
    C: Tout appareil de communication électronique portatif ou mains libres
    D: Le régulateur de vitesse du véhicule
  answer: C
  explanation: Les conducteurs du programme GDL à l'Î.-P.-É. ont l'interdiction d'utiliser
    tout appareil de communication électronique, y compris les systèmes de téléphonie
    cellulaire mains libres.
- id: 25
  category: license_system
  question: Si le permis d'un conducteur est suspendu à l'Î.-P.-É., que doit faire
    le conducteur pour récupérer ses privilèges de conduite après la fin de la période
    de suspension ?
  choices:
    A: Rien ; le permis est rétabli automatiquement
    B: Payer des frais de rétablissement et éventuellement assister à une entrevue
      d'amélioration de la conduite
    C: Repasser l'examen théorique écrit uniquement
    D: Attendre une période supplémentaire de 6 mois de « bonne conduite »
  answer: B
  explanation: Après une suspension, les conducteurs doivent payer des frais de rétablissement
    et peuvent être tenus de rencontrer un agent d'amélioration de la conduite avant
    que leur permis ne leur soit rendu.
- id: 26
  category: license_system
  question: Quelle est la durée obligatoire de l'étape 3 du programme de permis de
    conduire progressif (GDL) de l'Î.-P.-É. ?
  choices:
    A: 6 mois
    B: 12 mois
    C: 18 mois
    D: 24 mois
  answer: B
  explanation: L'étape 3 est la période probatoire finale du programme GDL et dure
    12 mois de conduite sans sinistre.
- id: 27
  category: license_system
  question: Pour être admissible à un permis de classe 4 (taxi, ambulance ou petit
    autobus) à l'Î.-P.-É., quel âge minimal doit avoir le candidat ?
  choices:
    A: 18 ans
    B: 19 ans
    C: 21 ans
    D: 25 ans
  answer: B
  explanation: L'âge minimal requis pour un permis commercial de classe 4 à l'Île-du-Prince-Édouard
    est de 19 ans.
- id: 28
  category: license_system
  question: 'À l''Î.-P.-É., le conducteur accompagnateur supervisant un conducteur
    de l''étape 1 (L) doit avoir un taux d''alcoolémie (BAC) inférieur à :'
  choices:
    A: 0,00 % (Tolérance zéro)
    B: 0,02 %
    C: 0,05 %
    D: 0,08 %
  answer: C
  explanation: Alors que l'apprenti doit avoir un taux d'alcoolémie de 0,00 %, le
    conducteur accompagnateur à l'Î.-P.-É. doit avoir un taux d'alcoolémie inférieur
    à 0,05 %.
- id: 29
  category: license_system
  question: 'À l''étape 2 (G) du programme GDL de l''Î.-P.-É., le nombre total de
    passagers dans le véhicule est limité à :'
  choices:
    A: Deux passagers
    B: Trois passagers
    C: Le nombre de ceintures de sécurité fonctionnelles
    D: Membres de la famille uniquement
  answer: C
  explanation: Pendant l'étape 2, le conducteur est limité à transporter seulement
    autant de passagers qu'il y a de ceintures de sécurité fonctionnelles dans le
    véhicule.
- id: 30
  category: driver_testing
  question: Pour réussir l'examen théorique écrit de l'Île-du-Prince-Édouard, un candidat
    doit répondre correctement à au moins combien de questions sur 40 ?
  choices:
    A: '28'
    B: '30'
    C: '32'
    D: '35'
  answer: C
  explanation: L'examen théorique écrit de l'Î.-P.-É. comprend 40 questions, et une
    note de passage de 80 % (32 bonnes réponses) est requise.
- id: 31
  category: driver_testing
  question: Laquelle des conditions suivantes entraînerait le refus d'un véhicule
    pour un examen de conduite à l'Î.-P.-É. ?
  choices:
    A: Le véhicule a plus de 10 ans.
    B: La porte du côté passager ne peut pas être ouverte de l'intérieur et de l'extérieur.
    C: Le véhicule a une transmission manuelle.
    D: Le réservoir de carburant est à moins de la moitié.
  answer: B
  explanation: Pour des raisons de sécurité, l'examinateur doit pouvoir sortir facilement
    du véhicule ; par conséquent, les deux portes avant doivent être fonctionnelles
    tant de l'intérieur que de l'extérieur.
- id: 32
  category: driver_testing
  question: Un visiteur à l'Île-du-Prince-Édouard qui détient un permis de conduire
    valide d'une autre province est autorisé à conduire dans la province pendant un
    maximum de combien de jours ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 120 jours
  answer: D
  explanation: En vertu de la loi de l'Î.-P.-É., un visiteur peut conduire avec un
    permis valide d'une autre province pendant une période allant jusqu'à 120 jours.
- id: 33
  category: driver_testing
  question: À l'Île-du-Prince-Édouard, combien de points d'inaptitude sont inscrits
    au dossier d'un conducteur pour avoir omis de s'arrêter pour un autobus scolaire
    dont les feux rouges clignotent ?
  choices:
    A: 3 points
    B: 5 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: L'omission de s'arrêter pour un autobus scolaire dont les feux rouges
    clignotent est une infraction grave à l'Î.-P.-É. et entraîne une pénalité de 8
    points d'inaptitude.
- id: 34
  category: driver_testing
  question: Quelle classe de permis de l'Î.-P.-É. est requise pour conduire un camion
    de plus de deux essieux, à condition qu'il ne s'agisse pas d'un semi-remorque
    ?
  choices:
    A: Classe 1
    B: Classe 2
    C: Classe 3
    D: Classe 4
  answer: C
  explanation: Un permis de classe 3 à l'Î.-P.-É. est requis pour tout camion de plus
    de deux essieux, comme un camion tandem, mais n'inclut pas les camions semi-remorques
    (classe 1).
- id: 35
  category: driver_testing
  question: À l'Île-du-Prince-Édouard, un permis de classe 8 est spécifiquement destiné
    à la conduite de quel type de véhicule ?
  choices:
    A: Tracteurs agricoles
    B: Cyclomoteurs
    C: Ambulances
    D: Motocyclettes
  answer: B
  explanation: Un permis de classe 8 à l'Î.-P.-É. est un permis restreint qui permet
    au titulaire de conduire un cyclomoteur (moped).
- id: 36
  category: driver_testing
  question: Combien de points d'inaptitude sont attribués à un conducteur de l'Î.-P.-É.
    pour une condamnation pour usage d'un appareil de communication portatif (conduite
    distraite) ?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: La conduite distraite à l'Î.-P.-É. entraîne une pénalité de 5 points
    d'inaptitude en cas de condamnation.
- id: 37
  category: driver_testing
  question: Lors de la présentation à un examen de conduite à l'Î.-P.-É., quels sont
    les trois documents qui doivent être présentés pour le véhicule utilisé ?
  choices:
    A: Acte de vente, assurance et manuel du propriétaire
    B: Immatriculation, assurance valide et vignette d'inspection valide
    C: Journal de bord du conducteur, immatriculation et reçu de taxe
    D: Contrat de location, assurance et dossiers d'entretien
  answer: B
  explanation: Le candidat doit fournir un véhicule qui est correctement immatriculé,
    assuré et qui possède une vignette d'inspection des véhicules à moteur de l'Î.-P.-É.
    valide.
- id: 38
  category: driver_testing
  question: Un conducteur titulaire d'un permis complet (non visé par le programme
    de permis progressif - GDL) à l'Île-du-Prince-Édouard verra ses privilèges de
    conduite suspendus s'il accumule combien de points d'inaptitude ?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Alors que les conducteurs du programme GDL sont suspendus à 6 points,
    un conducteur titulaire d'un permis complet à l'Î.-P.-É. est suspendu lorsqu'il
    atteint 12 points d'inaptitude.
- id: 39
  category: driver_testing
  question: À l'Î.-P.-É., un conducteur ayant un taux d'alcoolémie (BAC) compris entre
    0,05 et 0,08 est passible d'une suspension administrative immédiate du permis
    de conduire pour une première infraction de combien d'heures ?
  choices:
    A: 12 heures
    B: 24 heures
    C: 48 heures
    D: 72 heures
  answer: B
  explanation: La loi de l'Î.-P.-É. impose une suspension immédiate de 24 heures sur
    le bord de la route pour les conducteurs dont le taux d'alcoolémie (BAC) se situe
    dans la zone d'avertissement de 0,05 à 0,08.
- id: 40
  category: driver_testing
  question: Pour les conducteurs commerciaux (classes 1, 2, 3, 4) à l'Î.-P.-É. âgés
    de moins de 45 ans, à quelle fréquence un rapport d'aptitude médicale doit-il
    être déposé auprès de la Sécurité routière ?
  choices:
    A: Chaque année
    B: Tous les 2 ans
    C: Tous les 3 ans
    D: Tous les 5 ans
  answer: D
  explanation: Les conducteurs commerciaux à l'Î.-P.-É. doivent soumettre un rapport
    médical tous les 5 ans jusqu'à l'âge de 45 ans, tous les 3 ans jusqu'à l'âge de
    65 ans, et annuellement par la suite.
- id: 41
  category: driver_testing
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    de l'Î.-P.-É. pour avoir omis de porter sa ceinture de sécurité ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: Une condamnation pour omission de porter la ceinture de sécurité à
    l'Île-du-Prince-Édouard entraîne l'inscription de 3 points d'inaptitude.
- id: 42
  category: driver_testing
  question: Quelle classe de permis de l'Î.-P.-É. est requise pour conduire un autobus
    ayant une capacité de plus de 24 passagers ?
  choices:
    A: Classe 2
    B: Classe 3
    C: Classe 4
    D: Classe 5
  answer: A
  explanation: Un permis de classe 2 est requis à l'Î.-P.-É. pour conduire tout autobus
    ayant une capacité d'accueil de plus de 24 passagers.
- id: 43
  category: driver_testing
  question: Laquelle des conditions suivantes est obligatoire pour le véhicule utilisé
    lors d'un examen de conduite à l'Î.-P.-É. ?
  choices:
    A: Il doit s'agir d'un véhicule à double commande de freinage
    B: Il doit porter une vignette d'inspection des véhicules automobiles (MVI) valide
    C: Il doit avoir moins de 10 ans
    D: Il doit être fourni par l'examinateur de conduite
  answer: B
  explanation: Le véhicule utilisé pour un examen de conduite à l'Î.-P.-É. doit être
    dans un état mécanique sûr et porter une vignette d'inspection des véhicules automobiles
    (MVI) valide, en plus d'une immatriculation et d'une assurance valides.
- id: 44
  category: driver_testing
  question: À quel âge un conducteur standard de classe 5 à l'Île-du-Prince-Édouard
    doit-il soumettre pour la première fois un rapport d'aptitude médicale à la Sécurité
    routière ?
  choices:
    A: 65 ans
    B: 70 ans
    C: 75 ans
    D: 80 ans
  answer: C
  explanation: À l'Î.-P.-É., les conducteurs titulaires d'un permis de classe 5 ou
    6 doivent soumettre un rapport médical à l'âge de 75 ans, de nouveau à 80 ans,
    puis tous les deux ans par la suite.
- id: 45
  category: driver_testing
  question: Quelle est la note de passage minimale requise pour les examens écrits
    sur le code de la route et la signalisation de l'Î.-P.-É. ?
  choices:
    A: 70 % pour chaque partie
    B: 75 % pour chaque partie
    C: 80 % pour chaque partie
    D: 90 % pour chaque partie
  answer: C
  explanation: 'L''examen écrit de l''Î.-P.-É. se compose de deux parties : la signalisation
    routière et les règles de la route. Un candidat doit obtenir au moins 80 % (16
    sur 20) dans chaque partie pour réussir.'
- id: 46
  category: driver_testing
  question: Lors d'un examen de conduite à l'Î.-P.-É., laquelle des actions suivantes
    entraînera un échec automatique immédiat ?
  choices:
    A: Omettre d'utiliser un clignotant une seule fois
    B: Toucher un trottoir lors d'un stationnement en parallèle
    C: Une action qui oblige l'examinateur à intervenir pour éviter une collision
    D: Conduire à 2 km/h sous la limite de vitesse
  answer: C
  explanation: Toute action entraînant une collision, une quasi-collision, ou obligeant
    l'examinateur à prendre les commandes du véhicule ou à intervenir pour des raisons
    de sécurité constitue un échec automatique.
- id: 47
  category: driver_testing
  question: Lors d'une demande de permis d'apprenti conducteur de classe 7 à l'Î.-P.-É.,
    combien de pièces d'identité le candidat doit-il fournir ?
  choices:
    A: Une seule pièce d'identité avec photo
    B: Deux pièces d'identité, dont au moins une doit indiquer le nom légal et la
      date de naissance du candidat
    C: Trois pièces d'identité, toutes avec photo
    D: Aucune pièce d'identité n'est requise si un parent est présent
  answer: B
  explanation: Les candidats doivent fournir au moins deux pièces d'identité. L'une
    d'elles doit être un document principal (comme un certificat de naissance ou un
    passeport) établissant le nom légal et la date de naissance.
- id: 48
  category: driver_testing
  question: À l'Î.-P.-É., quel code de mention doit être ajouté au permis de conduire
    pour permettre la conduite d'un véhicule équipé de freins à air ?
  choices:
    A: Mention A
    B: Mention B
    C: Mention S
    D: Mention Z
  answer: A
  explanation: À l'Île-du-Prince-Édouard, la mention « A » sur un permis de conduire
    signifie que le titulaire est autorisé à conduire des véhicules équipés de freins
    à air.
- id: 49
  category: driver_testing
  question: Pour un conducteur titulaire d'un permis complet (non visé par le GDL)
    à l'Î.-P.-É., à partir de combien de points d'inaptitude le permis est-il suspendu
    ?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Alors que les conducteurs du programme GDL sont suspendus à 6 points,
    un conducteur titulaire d'un permis complet à l'Î.-P.-É. fera l'objet d'une suspension
    de permis s'il accumule 12 points d'inaptitude ou plus sur une période de 24 mois.
- id: 50
  category: driver_testing
  question: Quelle classe de permis de l'Î.-P.-É. est requise pour conduire un cyclomoteur
    ou un vélo à moteur ?
  choices:
    A: Classe 5
    B: Classe 6
    C: Classe 8
    D: Classe 9
  answer: D
  explanation: La classe 9 est une classe de permis spécifique à l'Î.-P.-É. qui permet
    la conduite d'un cyclomoteur ou d'un vélo à moteur.
- id: 51
  category: driver_testing
  question: Si vous passez un examen de conduite à l'Île-du-Prince-Édouard, quel document
    devez-vous présenter pour prouver que le véhicule est assuré ?
  choices:
    A: Une déclaration verbale du propriétaire
    B: L'acte de vente du véhicule
    C: Une carte d'assurance responsabilité civile automobile valide (carte rose)
    D: La carte de santé personnelle du conducteur
  answer: C
  explanation: Avant le début d'un examen de conduite, l'examinateur vérifiera que
    le véhicule possède une carte d'assurance responsabilité civile automobile valide,
    communément appelée « carte rose ».
- id: 52
  category: driver_testing
  question: 'Un conducteur dont le permis a été suspendu pour une première sanction
    administrative liée à l''alcool à l''Île-du-Prince-Édouard doit payer des frais
    de rétablissement de :'
  choices:
    A: Aucun frais
    B: 100 $
    C: 500 $
    D: 1 000 $
  answer: C
  explanation: À l'Île-du-Prince-Édouard, les frais administratifs de rétablissement
    du permis après une suspension liée à l'alcool sont de 500 $.
- id: 53
  category: driver_testing
  question: Laquelle des affirmations suivantes est vraie concernant l'examen de conduite
    pour un permis de classe 5 à l'Île-du-Prince-Édouard ?
  choices:
    A: L'examinateur fournira un véhicule si vous n'en avez pas
    B: Vous devez démontrer un stationnement en parallèle
    C: Vous êtes autorisé à avoir un ami sur le siège arrière pour vous soutenir
    D: Vous n'avez pas besoin de porter de ceinture de sécurité si vous êtes le conducteur
  answer: B
  explanation: L'examen de conduite de classe 5 de l'Île-du-Prince-Édouard comprend
    une démonstration des compétences de conduite de base, notamment le stationnement
    en parallèle, la marche arrière et les virages. Seuls le conducteur et l'examinateur
    sont autorisés dans le véhicule.
- id: 54
  category: driver_testing
  question: 'À l''Île-du-Prince-Édouard, si vous êtes un nouveau résident et que vous
    détenez un permis de conduire valide d''une autre province canadienne, vous pouvez
    l''échanger contre un permis de l''Île-du-Prince-Édouard sans examen écrit ni
    examen de conduite, à condition que :'
  choices:
    A: Vous viviez à l'Île-du-Prince-Édouard depuis au plus un an
    B: Votre permis hors province ne soit pas expiré depuis plus d'un an
    C: Vous ayez plus de 25 ans
    D: Vous n'ayez jamais reçu de contravention pour excès de vitesse
  answer: B
  explanation: L'Île-du-Prince-Édouard a conclu un accord de réciprocité avec toutes
    les provinces canadiennes ; vous pouvez échanger un permis valide (ou expiré depuis
    moins d'un an) contre un permis de l'Île-du-Prince-Édouard de la même classe sans
    examen supplémentaire.
- id: 55
  category: driver_responsibility
  question: À l'Île-du-Prince-Édouard, quel est le montant minimum de la couverture
    d'assurance responsabilité civile envers les tiers exigé par la loi ?
  choices:
    A: 50 000 $
    B: 100 000 $
    C: 200 000 $
    D: 500 000 $
  answer: C
  explanation: Selon la loi sur l'assurance automobile obligatoire de l'Île-du-Prince-Édouard,
    tout véhicule à moteur doit être assuré pour au moins 200 000 $ en couverture
    de responsabilité civile envers les tiers.
- id: 56
  category: driver_responsibility
  question: 'En vertu de la Loi sur le code de la route de l''Île-du-Prince-Édouard,
    un accident doit être signalé au service de police le plus proche si le total
    des dommages matériels est estimé à au moins :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 1 500 $
    D: 2 000 $
  answer: D
  explanation: À l'Île-du-Prince-Édouard, les accidents impliquant des blessures,
    un décès ou des dommages matériels dépassant 2 000 $ doivent être signalés immédiatement
    à la police.
- id: 57
  category: driver_responsibility
  question: À quelle fréquence un véhicule automobile immatriculé à l'Île-du-Prince-Édouard
    doit-il subir une inspection de sécurité officielle (MVI) ?
  choices:
    A: Tous les 6 mois
    B: Tous les 12 mois
    C: Tous les 24 mois
    D: Uniquement lors de la vente du véhicule
  answer: B
  explanation: Les règlements de l'Île-du-Prince-Édouard exigent que la plupart des
    véhicules automobiles subissent une inspection annuelle des véhicules automobiles
    (MVI) pour s'assurer qu'ils respectent les normes de sécurité.
- id: 58
  category: driver_responsibility
  question: 'Lors de la vente d''un véhicule à l''Île-du-Prince-Édouard, le vendeur
    doit informer le registraire des véhicules automobiles du transfert de propriété
    dans un délai de :'
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Le vendeur d'un véhicule automobile à l'Île-du-Prince-Édouard est tenu
    d'en informer le registraire dans les 7 jours suivant la date de la vente ou du
    transfert.
- id: 59
  category: driver_responsibility
  question: Si vous êtes impliqué dans un accident avec un véhicule sans surveillance
    et que vous ne trouvez pas le propriétaire, quelle est votre responsabilité légale
    à l'Île-du-Prince-Édouard ?
  choices:
    A: Laisser une note et continuer votre chemin
    B: Attendre 30 minutes, puis partir si personne n'arrive
    C: Signaler l'accident à la police immédiatement
    D: Laisser une note avec votre nom, adresse et numéro de permis, et le signaler
      à la police si les dommages dépassent 2 000 $
  answer: D
  explanation: Les conducteurs doivent laisser un avis écrit au propriétaire et, si
    les dommages dépassent le seuil de signalement de 2 000 $, ils doivent également
    le signaler à la police.
- id: 60
  category: driver_responsibility
  question: À l'Île-du-Prince-Édouard, combien de points d'inaptitude sont inscrits
    à votre dossier de conduite pour avoir « omis de rester sur les lieux d'un accident
    » ?
  choices:
    A: 3 points
    B: 5 points
    C: 7 points
    D: 9 points
  answer: D
  explanation: Le fait de ne pas rester sur les lieux d'un accident est une infraction
    grave à l'Île-du-Prince-Édouard et entraîne l'ajout de 9 points d'inaptitude au
    dossier du conducteur.
- id: 61
  category: driver_responsibility
  question: Un nouveau résident de l'Île-du-Prince-Édouard doit immatriculer son véhicule
    provenant de l'extérieur de la province dans les combien de jours suivant l'établissement
    de sa résidence ?
  choices:
    A: 10 jours
    B: 30 jours
    C: 60 jours
    D: 90 jours
  answer: B
  explanation: Les nouveaux résidents de l'Î.-P.-É. sont tenus d'immatriculer leurs
    véhicules auprès de la Sécurité routière (Highway Safety) dans les 30 jours suivant
    l'établissement de leur résidence.
- id: 62
  category: driver_responsibility
  question: Lequel des documents suivants doit être présenté par un conducteur de
    l'Île-du-Prince-Édouard à la demande d'un agent de la paix ?
  choices:
    A: Un permis de conduire valide uniquement
    B: Un permis de conduire valide et l'immatriculation du véhicule uniquement
    C: Un permis de conduire valide, l'immatriculation du véhicule et une preuve d'assurance
      valide
    D: Un permis de conduire valide et l'acte de vente du véhicule
  answer: C
  explanation: Les conducteurs de l'Î.-P.-É. doivent avoir sur eux et être en mesure
    de présenter leur permis de conduire, le certificat d'immatriculation du véhicule
    et une carte rose d'assurance responsabilité civile automobile valide.
- id: 63
  category: driver_responsibility
  question: À l'Île-du-Prince-Édouard, qui est légalement responsable de s'assurer
    qu'un passager de moins de 16 ans porte sa ceinture de sécurité ou est installé
    dans un dispositif de retenue pour enfant approprié ?
  choices:
    A: Le passager
    B: Le conducteur du véhicule
    C: Le parent de l'enfant, même s'il n'est pas dans la voiture
    D: Personne ; les ceintures de sécurité sont facultatives pour les passagers arrière
  answer: B
  explanation: Le conducteur est responsable de s'assurer que tous les passagers de
    moins de 16 ans sont correctement attachés avec une ceinture de sécurité ou dans
    un siège de sécurité pour enfant.
- id: 64
  category: driver_responsibility
  question: Quelle est la peine pour une première condamnation pour conduite sans
    assurance automobile valide à l'Île-du-Prince-Édouard ?
  choices:
    A: Une amende de 100 $ et 1 point d'inaptitude
    B: Une amende d'au moins 600 $ et une suspension de permis de 3 mois
    C: Un avertissement verbal et un délai de grâce de 7 jours pour obtenir une assurance
    D: Une amende de 50 $ et la mise en fourrière du véhicule pendant 24 heures
  answer: B
  explanation: La conduite sans assurance à l'Î.-P.-É. entraîne de lourdes sanctions,
    notamment une amende minimale de 600 $ (plus les surprimes) et une suspension
    obligatoire du permis de conduire de 3 mois.
- id: 65
  category: driver_responsibility
  question: 'Si un conducteur titulaire d''un permis complet (non soumis au programme
    GDL) à l''Î.-P.-É. accumule 12 points d''inaptitude ou plus sur une période de
    24 mois, son permis sera suspendu pendant :'
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 12 mois
  answer: B
  explanation: Pour un conducteur titulaire d'un permis complet à l'Î.-P.-É., l'accumulation
    de 12 points d'inaptitude ou plus entraîne une suspension automatique des privilèges
    de conduite pendant 3 mois.
- id: 66
  category: driver_responsibility
  question: 'À l''Î.-P.-É., si vous êtes reconnu coupable de conduite alors que votre
    permis est annulé, suspendu ou révoqué, votre véhicule sera mis en fourrière pour
    un minimum de :'
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: C
  explanation: En vertu de la loi de l'Î.-P.-É., un véhicule conduit par une personne
    dont le permis est suspendu ou annulé fait l'objet d'une mise en fourrière obligatoire
    de 30 jours.
- id: 67
  category: driver_responsibility
  question: Un conducteur à l'Î.-P.-É. qui est impliqué dans un accident est tenu
    de fournir son nom, son adresse et quelle autre information à l'autre partie ?
  choices:
    A: Son numéro de téléphone et son numéro d'assurance sociale
    B: Le numéro d'immatriculation de son véhicule et ses informations d'assurance
    C: Son numéro de permis de conduire et sa date de naissance
    D: Le nom et les coordonnées de son employeur
  answer: B
  explanation: Le Code de la route (Highway Traffic Act) exige que les conducteurs
    impliqués dans un accident fournissent leur nom, leur adresse, le numéro d'immatriculation
    du véhicule et les détails de l'assurance à l'autre personne impliquée.
- id: 68
  category: driver_responsibility
  question: 'Dans le cadre du programme de suspension administrative du permis de
    conduire (ADLS) de l''Î.-P.-É., si le taux d''alcoolémie (BAC) d''un conducteur
    est de 0,08 ou plus, son permis est suspendu sur-le-champ pendant :'
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: D
  explanation: Les conducteurs qui présentent un taux de 0,08 ou plus (ou qui refusent
    l'alcootest) font face à une suspension administrative immédiate de leur permis
    de 90 jours à l'Î.-P.-É.
- id: 69
  category: driver_responsibility
  question: À l'Île-du-Prince-Édouard, à quoi sert le « Unsatisfied Judgment Fund
    » (Fonds d'indemnisation des victimes d'accidents) ?
  choices:
    A: À payer les réparations routières dans les zones rurales
    B: À fournir une aide financière aux conducteurs qui n'ont pas les moyens de s'assurer
    C: À payer les dommages aux victimes d'accidents causés par des conducteurs non
      assurés ou non identifiés
    D: À payer la défense juridique des conducteurs poursuivis en justice
  answer: C
  explanation: Le Judgment Recovery (P.E.I.) Ltd. (souvent mentionné dans le contexte
    du fonds) existe pour aider les victimes d'accidents de la route à obtenir réparation
    lorsque le conducteur responsable n'est pas assuré ou ne peut pas être identifié.
- id: 70
  category: driver_responsibility
  question: 'À l''Île-du-Prince-Édouard, vous devez immédiatement signaler un accident
    de la route au service de police le plus proche si le total des dommages matériels
    est estimé à au moins :'
  choices:
    A: 500 $
    B: 1 000 $
    C: 1 500 $
    D: 2 000 $
  answer: D
  explanation: Selon le Code de la route de l'Î.-P.-É., tout accident impliquant des
    blessures, un décès ou des dommages matériels semblant dépasser 2 000 $ doit être
    signalé immédiatement à la police.
- id: 71
  category: driver_responsibility
  question: Lorsqu'un véhicule est vendu à l'Île-du-Prince-Édouard, dans quel délai
    le vendeur doit-il informer la Sécurité routière (Highway Safety) du transfert
    de propriété ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 14 jours
    D: 30 jours
  answer: B
  explanation: Le vendeur d'un véhicule à moteur doit informer le registraire des
    véhicules à moteur (Sécurité routière) dans les 7 jours suivant la date de la
    vente.
- id: 72
  category: driver_responsibility
  question: Pour un conducteur titulaire d'un permis complet (non-GDL) à l'Île-du-Prince-Édouard,
    combien de points d'inaptitude accumulés sur une période de deux ans entraîneront
    une suspension du permis ?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: Un conducteur titulaire d'un permis complet à l'Î.-P.-É. verra ses
    privilèges de conduite suspendus s'il accumule 12 points d'inaptitude ou plus
    sur une période de 24 mois.
- id: 73
  category: driver_responsibility
  question: Pendant combien de temps les points d'inaptitude inscrits au dossier de
    conduite de l'Île-du-Prince-Édouard restent-ils actifs à compter de la date de
    la condamnation ?
  choices:
    A: 12 mois
    B: 24 mois
    C: 36 mois
    D: 60 mois
  answer: B
  explanation: Les points d'inaptitude à l'Î.-P.-É. restent au dossier du conducteur
    pendant 24 mois (deux ans) à compter de la date de la condamnation.
- id: 74
  category: driver_responsibility
  question: Quelle est la conséquence pour un conducteur qui est pris à conduire un
    véhicule à l'Î.-P.-É. sans assurance automobile valide ?
  choices:
    A: Un avertissement verbal pour la première infraction
    B: Une peine de prison obligatoire de 30 jours
    C: Une amende importante et une suspension obligatoire du permis de 3 mois
    D: Seulement des frais administratifs de 100 $
  answer: C
  explanation: Conduire sans assurance à l'Î.-P.-É. entraîne des sanctions importantes,
    notamment de lourdes amendes et une suspension obligatoire du permis (généralement
    3 mois pour une première infraction).
- id: 75
  category: driver_responsibility
  question: À l'Île-du-Prince-Édouard, où doit être apposé l'autocollant de validation
    de l'immatriculation sur un véhicule de tourisme ?
  choices:
    A: Sur la plaque d'immatriculation avant
    B: Sur la plaque d'immatriculation arrière
    C: Dans le coin inférieur gauche du pare-brise
    D: Sur la lunette arrière
  answer: B
  explanation: L'Î.-P.-É. exige que l'autocollant de validation de l'immatriculation
    soit apposé sur la plaque d'immatriculation arrière du véhicule.
- id: 76
  category: driver_responsibility
  question: Si le permis d'un conducteur est suspendu en raison de l'accumulation
    de points d'inaptitude, quelle est la durée standard de la première suspension
    à l'Î.-P.-É. ?
  choices:
    A: 1 mois
    B: 3 mois
    C: 6 mois
    D: 12 mois
  answer: B
  explanation: Pour une première suspension due aux points d'inaptitude, la période
    de suspension est généralement de 3 mois.
- id: 77
  category: driver_responsibility
  question: Quand l'immatriculation d'un véhicule doit-elle être renouvelée pour un
    propriétaire individuel à l'Île-du-Prince-Édouard ?
  choices:
    A: Chaque année le 1er janvier
    B: Tous les deux ans à la date d'anniversaire du propriétaire
    C: Annuellement, au plus tard le dernier jour du mois de naissance du propriétaire
    D: À la date anniversaire de l'achat du véhicule
  answer: C
  explanation: À l'Î.-P.-É., les immatriculations de véhicules pour les particuliers
    expirent chaque année le dernier jour du mois de naissance du propriétaire.
- id: 78
  category: driver_responsibility
  question: En vertu de la Loi sur le code de la route (Highway Traffic Act), que
    doit présenter un conducteur à la demande d'un agent de la paix ?
  choices:
    A: Le permis de conduire uniquement
    B: Le permis de conduire et l'immatriculation du véhicule uniquement
    C: Le permis de conduire, l'immatriculation du véhicule et une preuve d'assurance
      valide
    D: Le permis de conduire et une preuve de résidence
  answer: C
  explanation: Les conducteurs de l'Î.-P.-É. sont légalement tenus d'avoir sur eux
    et de présenter leur permis de conduire, l'immatriculation du véhicule et une
    assurance valide (carte rose) à la demande d'un agent de la paix.
- id: 79
  category: driver_responsibility
  question: À quoi sert principalement le fonds « Judgment Recovery » (ou Facility
    Association) à l'Île-du-Prince-Édouard ?
  choices:
    A: À payer les réparations routières après les accidents
    B: À fournir une assurance aux conducteurs à haut risque qui ne peuvent en obtenir
      ailleurs
    C: À payer les dommages aux victimes de conducteurs non assurés ou de délits de
      fuite
    D: À financer la division de la Sécurité routière
  answer: C
  explanation: Judgment Recovery (PEI) Inc. est destiné à aider les victimes d'accidents
    de la route impliquant des conducteurs non assurés ou non identifiés (délit de
    fuite).
- id: 80
  category: driver_responsibility
  question: Si vous êtes un visiteur à l'Île-du-Prince-Édouard, pendant combien de
    temps êtes-vous autorisé à conduire avec un permis valide d'une autre province
    ?
  choices:
    A: 30 jours
    B: 60 jours
    C: 90 jours
    D: 120 jours
  answer: D
  explanation: Les visiteurs de l'Î.-P.-É. sont autorisés à conduire avec un permis
    valide d'une autre province ou d'un autre pays pendant une période allant jusqu'à
    120 jours (4 mois).
- id: 81
  category: safe_driving_rules
  question: À l'Île-du-Prince-Édouard, quelle est la limite de vitesse par défaut
    sur les routes rurales, sauf indication contraire ?
  choices:
    A: 70 km/h
    B: 80 km/h
    C: 90 km/h
    D: 100 km/h
  answer: B
  explanation: Selon le Guide du conducteur de l'Î.-P.-É., la limite de vitesse réglementaire
    sur les routes rurales est de 80 km/h, sauf si des panneaux indiquent le contraire.
- id: 82
  category: safe_driving_rules
  question: À l'Île-du-Prince-Édouard, il est interdit de se stationner à moins de
    quelle distance d'une borne d'incendie ?
  choices:
    A: 1,5 mètre
    B: 2,5 mètres
    C: 5,0 mètres
    D: 10,0 mètres
  answer: B
  explanation: Les lois de la circulation de l'Î.-P.-É. stipulent qu'il est interdit
    de stationner un véhicule à moins de 2,5 mètres d'une borne d'incendie.
- id: 83
  category: safe_driving_rules
  question: Lorsque vous stationnez votre véhicule près d'un panneau d'arrêt ou d'un
    signal de contrôle de la circulation à l'Î.-P.-É., quelle est la distance minimale
    requise que vous devez respecter ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 20 mètres
  answer: B
  explanation: À l'Î.-P.-É., les conducteurs ne sont pas autorisés à se stationner
    à moins de 10 mètres de l'approche d'un panneau d'arrêt ou d'un signal de contrôle
    de la circulation.
- id: 84
  category: safe_driving_rules
  question: En vertu de la loi sur le « corridor de sécurité » (Move Over) de l'Î.-P.-É.,
    que doit faire un conducteur à l'approche d'un véhicule d'urgence arrêté avec
    ses gyrophares allumés sur une route à plusieurs voies ?
  choices:
    A: S'arrêter complètement jusqu'à ce que le véhicule d'urgence parte
    B: Maintenir sa vitesse mais klaxonner pour alerter les intervenants d'urgence
    C: Ralentir et changer de voie pour une voie non adjacente si cela peut être fait
      en toute sécurité
    D: Accélérer pour dépasser la zone le plus rapidement possible
  answer: C
  explanation: La loi de l'Î.-P.-É. exige que les conducteurs ralentissent et, s'ils
    se trouvent sur une route à plusieurs voies, qu'ils se déplacent vers la voie
    la plus éloignée du véhicule d'urgence si la manœuvre est sécuritaire.
- id: 85
  category: safe_driving_rules
  question: À l'Île-du-Prince-Édouard, entre quelles dates les pneus à clous sont-ils
    autorisés sur les véhicules ?
  choices:
    A: Du 1er novembre au 1er avril
    B: Du 1er octobre au 31 mai
    C: Du 1er décembre au 31 mars
    D: Du 15 octobre au 30 avril
  answer: B
  explanation: Les pneus à clous sont légalement autorisés sur les routes de l'Î.-P.-É.
    du 1er octobre au 31 mai.
- id: 86
  category: safe_driving_rules
  question: Lorsque vous conduisez de nuit à l'Î.-P.-É., à quelle distance d'un véhicule
    venant en sens inverse devez-vous passer des feux de route aux feux de croisement
    ?
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 250 mètres
  answer: B
  explanation: Le Guide du conducteur de l'Î.-P.-É. précise que les feux de route
    doivent être passés en feux de croisement lorsqu'un véhicule venant en sens inverse
    se trouve à moins de 150 mètres.
- id: 87
  category: safe_driving_rules
  question: À l'Î.-P.-É., lorsque vous suivez un autre véhicule de nuit, à quelle
    distance du véhicule qui vous précède devez-vous passer aux feux de croisement
    ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: Les conducteurs doivent passer aux feux de croisement lorsqu'ils suivent
    un autre véhicule à une distance de 60 mètres ou moins.
- id: 88
  category: safe_driving_rules
  question: Quelle est la limite de vitesse standard dans une zone scolaire à l'Île-du-Prince-Édouard
    lorsque des enfants sont présents ?
  choices:
    A: 20 km/h
    B: 30 km/h
    C: 40 km/h
    D: 50 km/h
  answer: B
  explanation: La limite de vitesse dans les zones scolaires de l'Î.-P.-É. est de
    30 km/h entre 8 h 00 et 16 h 30 les jours d'école, ou lorsque des enfants sont
    présents.
- id: 89
  category: safe_driving_rules
  question: Lorsque vous stationnez un véhicule face à la pente (vers le bas) sur
    une rue à deux sens à l'Î.-P.-É., comment les roues avant doivent-elles être orientées
    ?
  choices:
    A: Vers la bordure du trottoir
    B: À l'opposé de la bordure du trottoir
    C: Parallèles à la bordure du trottoir
    D: Cela n'a pas d'importance
  answer: A
  explanation: Lors d'un stationnement en descente, les roues doivent être tournées
    vers la bordure du trottoir de sorte que si le véhicule se met à rouler, il s'appuiera
    contre la bordure et s'arrêtera.
- id: 90
  category: safe_driving_rules
  question: À l'Î.-P.-É., dans une ville ou un village, à quelle distance à l'avance
    devez-vous signaler avant d'effectuer un virage ?
  choices:
    A: 15 mètres
    B: 30 mètres
    C: 50 mètres
    D: 100 mètres
  answer: B
  explanation: Dans les zones urbaines, les conducteurs doivent signaler leur intention
    de tourner au moins 30 mètres avant l'intersection.
- id: 91
  category: safe_driving_rules
  question: Un agent de la paix à l'Î.-P.-É. peut demander un échantillon d'haleine
    ou de sang s'il soupçonne qu'un conducteur a de l'alcool dans son système. Quelle
    est la période de suspension immédiate du permis de conduire sur le bord de la
    route pour une première infraction dans la plage d'avertissement « Warn » (0,05
    à 0,08 BAC) pour un conducteur titulaire d'un permis complet ?
  choices:
    A: 24 heures
    B: 7 jours
    C: 30 jours
    D: 90 jours
  answer: B
  explanation: À l'Î.-P.-É., un conducteur titulaire d'un permis complet qui enregistre
    un avertissement « Warn » sur un appareil de détection (BAC de 0,05 à 0,08) s'expose
    à une suspension immédiate de son permis de conduire de 7 jours pour une première
    infraction.
- id: 92
  category: safe_driving_rules
  question: En entrant dans un carrefour giratoire à l'Î.-P.-É., à qui devez-vous
    céder le passage ?
  choices:
    A: À la circulation entrant par la droite
    B: À la circulation déjà engagée dans le carrefour giratoire arrivant par la gauche
    C: À personne, vous avez la priorité
    D: Uniquement aux véhicules d'urgence
  answer: B
  explanation: Les conducteurs entrant dans un carrefour giratoire doivent céder le
    passage aux véhicules circulant déjà dans le carrefour, qui arriveront par la
    gauche.
- id: 93
  category: safe_driving_rules
  question: 'À l''Î.-P.-É., il est interdit de dépasser un autre véhicule dans un
    virage ou sur une côte si votre visibilité est obstruée sur une distance de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: La loi sur la circulation routière de l'Î.-P.-É. interdit le dépassement
    dans un virage ou sur une côte où la vue du conducteur est obstruée sur une distance
    de 150 mètres.
- id: 94
  category: safe_driving_rules
  question: Sauf indication contraire, quelle est la limite de vitesse maximale dans
    une zone rurale de l'Île-du-Prince-Édouard ?
  choices:
    A: 70 km/h
    B: 80 km/h
    C: 90 km/h
    D: 100 km/h
  answer: B
  explanation: Selon le manuel du conducteur de l'Î.-P.-É., la limite de vitesse réglementaire
    dans les zones rurales est de 80 km/h, à moins que des panneaux n'indiquent le
    contraire.
- id: 95
  category: safe_driving_rules
  question: À combien de mètres d'une borne d'incendie devez-vous vous stationner
    à l'Île-du-Prince-Édouard ?
  choices:
    A: 1 mètre
    B: 2,5 mètres
    C: 5 mètres
    D: 10 mètres
  answer: B
  explanation: À l'Île-du-Prince-Édouard, il est interdit de se stationner à moins
    de 2,5 mètres d'une borne d'incendie.
- id: 96
  category: safe_driving_rules
  question: 'À l''Île-du-Prince-Édouard, il est interdit d''effectuer un demi-tour
    dans un virage ou sur une côte où la visibilité est inférieure à :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Un demi-tour est illégal dans un virage ou près du sommet d'une côte
    où le conducteur ne peut pas être vu par les autres conducteurs arrivant de l'une
    ou l'autre direction à moins de 150 mètres.
- id: 97
  category: safe_driving_rules
  question: 'À l''approche d''un véhicule d''urgence arrêté dont les feux rouges ou
    bleus clignotent sur une route comportant deux voies ou plus dans votre direction,
    la loi de l''Î.-P.-É. vous oblige à :'
  choices:
    A: Maintenir votre vitesse mais vous déplacer vers la voie de gauche
    B: S'arrêter immédiatement dans votre voie
    C: Ralentir et se déplacer vers une voie non adjacente si cela peut être fait
      en toute sécurité
    D: Accélérer pour dépasser le véhicule rapidement
  answer: C
  explanation: La loi « Move Over » de l'Î.-P.-É. exige que les conducteurs ralentissent
    et, si cela peut être fait en toute sécurité, se déplacent vers une voie qui n'est
    pas adjacente au véhicule d'urgence.
- id: 98
  category: safe_driving_rules
  question: Quelle est la distance minimale que vous devez maintenir lors du stationnement
    par rapport au rail le plus proche d'un passage à niveau à l'Î.-P.-É. ?
  choices:
    A: 5 mètres
    B: 10 mètres
    C: 15 mètres
    D: 25 mètres
  answer: C
  explanation: À l'Île-du-Prince-Édouard, vous ne devez pas vous stationner à moins
    de 15 mètres du rail le plus proche d'un passage à niveau.
- id: 99
  category: safe_driving_rules
  question: 'Si vous êtes pris en flagrant délit d''excès de vitesse dans une zone
    de travaux désignée à l''Île-du-Prince-Édouard en présence de travailleurs, l''amende
    est :'
  choices:
    A: Réduite de moitié
    B: La même qu'une amende d'excès de vitesse ordinaire
    C: Doublée
    D: Triplée
  answer: C
  explanation: Pour protéger les travailleurs, la loi de l'Î.-P.-É. stipule que les
    amendes pour excès de vitesse sont doublées dans les zones de travaux lorsque
    des travailleurs sont présents.
- id: 100
  category: safe_driving_rules
  question: Pendant quelle période les pneus à clous sont-ils autorisés sur les véhicules
    à l'Île-du-Prince-Édouard ?
  choices:
    A: Du 1er novembre au 1er avril
    B: Du 1er octobre au 31 mai
    C: Du 1er décembre au 31 mars
    D: Du 15 septembre au 15 juin
  answer: B
  explanation: À l'Île-du-Prince-Édouard, les pneus à clous sont légalement autorisés
    sur les véhicules du 1er octobre au 31 mai.
- id: 101
  category: safe_driving_rules
  question: À l'Île-du-Prince-Édouard, quelle est la distance minimale à laquelle
    vous devez vous garer d'un passage pour piétons à une intersection ?
  choices:
    A: 2 mètres
    B: 5 mètres
    C: 8 mètres
    D: 12 mètres
  answer: B
  explanation: Il est interdit aux conducteurs de se garer à moins de 5 mètres d'un
    passage pour piétons à une intersection à l'Île-du-Prince-Édouard.
- id: 102
  category: defensive_driving
  question: À l'Île-du-Prince-Édouard, quelle est la distance de suivi minimale recommandée
    derrière un autre véhicule dans des conditions de conduite idéales ?
  choices:
    A: La longueur d'une voiture
    B: Deux secondes
    C: Trois secondes
    D: Quatre secondes
  answer: C
  explanation: Le Guide du conducteur de l'Île-du-Prince-Édouard recommande de maintenir
    une distance de suivi d'au moins trois secondes derrière le véhicule qui vous
    précède dans des conditions idéales.
- id: 103
  category: defensive_driving
  question: Lorsqu'un autobus scolaire est arrêté avec ses feux rouges clignotants
    et son bras d'arrêt déployé, à quelle distance un conducteur doit-il s'arrêter
    de l'autobus à l'Île-du-Prince-Édouard ?
  choices:
    A: 3 mètres
    B: 5 mètres
    C: 6 mètres
    D: 10 mètres
  answer: C
  explanation: En vertu de la loi sur la circulation routière (Highway Traffic Act)
    de l'Île-du-Prince-Édouard, les conducteurs s'approchant d'un autobus scolaire
    dans l'une ou l'autre direction doivent s'arrêter à au moins 6 mètres de l'autobus
    lorsque ses feux rouges clignotent.
- id: 104
  category: defensive_driving
  question: Si votre véhicule commence à faire de l'aquaplanage sur une route mouillée
    de l'Île-du-Prince-Édouard, quelle est la mesure la plus sûre à prendre ?
  choices:
    A: Freiner brusquement pour retrouver de l'adhérence
    B: Accélérer légèrement pour traverser l'eau
    C: Mettre immédiatement le véhicule au point mort
    D: Lever le pied de l'accélérateur et diriger le volant dans la direction où vous
      voulez aller
  answer: D
  explanation: Pour se rétablir de l'aquaplanage, vous devez lever le pied de l'accélérateur,
    ne pas freiner et maintenir le volant pointé dans la direction où vous voulez
    que le véhicule aille.
- id: 105
  category: defensive_driving
  question: Combien de points d'inaptitude sont inscrits au dossier d'un conducteur
    à l'Île-du-Prince-Édouard pour avoir « suivi de trop près » ?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: À l'Île-du-Prince-Édouard, la sanction pour avoir suivi de trop près
    comprend l'ajout de 2 points d'inaptitude au dossier du conducteur.
- id: 106
  category: defensive_driving
  question: Lors du balayage de la route pour détecter les dangers potentiels, à quelle
    distance vers l'avant le Guide du conducteur de l'Île-du-Prince-Édouard recommande-t-il
    de regarder dans les zones urbaines ?
  choices:
    A: 5 à 8 secondes
    B: 12 à 15 secondes
    C: 20 à 25 secondes
    D: 30 secondes
  answer: B
  explanation: Les conducteurs sont encouragés à maintenir un temps d'avance visuel
    de 12 à 15 secondes devant leur véhicule pour identifier les dangers potentiels
    et y réagir tôt.
- id: 107
  category: defensive_driving
  question: À l'Île-du-Prince-Édouard, lorsqu'un véhicule d'urgence avec des sirènes
    et des feux clignotants s'approche, que devez-vous faire ?
  choices:
    A: Accélérer pour libérer le passage
    B: S'arrêter exactement là où vous êtes
    C: Se ranger à droite aussi loin que possible et s'arrêter
    D: Se ranger à gauche et continuer à rouler lentement
  answer: C
  explanation: La loi exige que les conducteurs se dirigent immédiatement vers une
    position aussi proche que possible et parallèle au bord droit ou à la bordure
    de la chaussée, à l'écart de toute intersection, et s'arrêtent.
- id: 108
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais sur les routes de l'Île-du-Prince-Édouard,
    quels feux devez-vous utiliser ?
  choices:
    A: Feux de route
    B: Feux de croisement
    C: Feux de stationnement uniquement
    D: Feux de détresse
  answer: B
  explanation: Les feux de croisement doivent être utilisés dans le brouillard car
    les feux de route se reflètent sur l'humidité de l'air, créant un éblouissement
    et rendant la visibilité plus difficile.
- id: 109
  category: defensive_driving
  question: Quel est le principal danger de la « glace noire » sur les routes de l'Île-du-Prince-Édouard
    pendant l'hiver ?
  choices:
    A: Elle est épaisse et facile à voir
    B: Elle ne se forme que sur les routes de terre
    C: C'est une fine couche de glace transparente qui ressemble à une route mouillée
    D: Elle ne se produit que pendant la journée
  answer: C
  explanation: La glace noire est particulièrement dangereuse car elle est presque
    invisible, apparaissant comme une surface mouillée sur l'asphalte, ce qui amène
    les conducteurs à maintenir des vitesses dangereuses.
- id: 110
  category: defensive_driving
  question: 'À l''Île-du-Prince-Édouard, si vous êtes impliqué dans une collision
    où les dommages matériels totaux s''élèvent à 2 000 $ ou plus, vous devez :'
  choices:
    A: Le signaler uniquement à votre compagnie d'assurance
    B: Le signaler immédiatement au poste de police le plus proche
    C: Attendre 48 heures avant de le signaler
    D: Ne le signaler que si quelqu'un est blessé
  answer: B
  explanation: À l'Île-du-Prince-Édouard, toute collision impliquant des blessures,
    un décès ou des dommages matériels totalisant 2 000 $ ou plus doit être signalée
    immédiatement à la police.
- id: 111
  category: defensive_driving
  question: En entrant dans un carrefour giratoire à l'Î.-P.-É., laquelle des pratiques
    suivantes est une technique de conduite préventive correcte ?
  choices:
    A: Céder le passage aux véhicules déjà engagés dans le carrefour giratoire
    B: Accélérer pour s'insérer dans la circulation
    C: S'arrêter avant d'entrer même si aucun véhicule n'est présent
    D: Toujours utiliser son clignotant gauche en entrant
  answer: A
  explanation: Les conducteurs qui entrent dans un carrefour giratoire doivent céder
    le passage aux véhicules qui circulent déjà à l'intérieur de celui-ci.
- id: 112
  category: defensive_driving
  question: 'Pour éviter « l''hypnose de la route » lors de longs trajets dans les
    Maritimes, le Guide du conducteur de l''Î.-P.-É. suggère de :'
  choices:
    A: Fixer la ligne médiane
    B: Garder les yeux en mouvement et vérifier fréquemment les rétroviseurs
    C: Allumer les lumières intérieures
    D: Conduire plus vite pour arriver à destination plus tôt
  answer: B
  explanation: La conduite préventive implique un balayage visuel constant et des
    vérifications de rétroviseurs pour rester vigilant et éviter l'état de transe
    connu sous le nom d'hypnose de la route.
- id: 113
  category: defensive_driving
  question: Pour pratiquer un balayage visuel efficace, le Manuel du conducteur de
    l'Î.-P.-É. suggère qu'un conducteur doit regarder devant lui à l'endroit où il
    se trouvera dans combien de secondes ?
  choices:
    A: 2 à 5 secondes
    B: 5 à 8 secondes
    C: 12 à 15 secondes
    D: 20 à 30 secondes
  answer: C
  explanation: La conduite préventive à l'Î.-P.-É. consiste à balayer la route du
    regard 12 à 15 secondes à l'avance pour anticiper les dangers potentiels avant
    qu'ils ne surviennent.
- id: 114
  category: defensive_driving
  question: Si vous conduisez sur une autoroute de l'Î.-P.-É. en dehors d'un quartier
    commercial ou résidentiel, quelle est la distance minimale qu'un véhicule commercial
    doit maintenir lorsqu'il suit un autre véhicule commercial ?
  choices:
    A: 30 mètres
    B: 60 mètres
    C: 100 mètres
    D: 150 mètres
  answer: B
  explanation: La Loi sur la circulation routière de l'Î.-P.-É. précise que les conducteurs
    de véhicules commerciaux ou d'ensembles de véhicules doivent maintenir une distance
    de suivi d'au moins 60 mètres (200 pieds) par rapport à des véhicules similaires
    sur les routes de grande circulation.
- id: 115
  category: defensive_driving
  question: Lorsque vous conduisez dans un brouillard épais à l'Île-du-Prince-Édouard,
    quel réglage de feux devez-vous utiliser pour une sécurité maximale ?
  choices:
    A: Feux de route (pleins phares)
    B: Feux de croisement (codes)
    C: Feux de position uniquement
    D: Aucun feu
  answer: B
  explanation: Les feux de croisement doivent être utilisés par temps de brouillard
    car les feux de route se reflètent sur les gouttelettes d'eau, créant un éblouissement
    et réduisant davantage la visibilité.
- id: 116
  category: defensive_driving
  question: 'Selon la loi de l''Î.-P.-É., vous devez allumer vos phares chaque fois
    que la visibilité est réduite à moins de :'
  choices:
    A: 100 mètres
    B: 150 mètres
    C: 200 mètres
    D: 300 mètres
  answer: B
  explanation: Les phares doivent être utilisés à l'Î.-P.-É. chaque fois que les conditions
    atmosphériques (pluie, neige, brouillard, etc.) réduisent la visibilité à moins
    de 150 mètres.
- id: 117
  category: defensive_driving
  question: Lorsque vous approchez d'un véhicule d'urgence arrêté sur le bord d'une
    route de l'Î.-P.-É. avec ses gyrophares allumés, que vous oblige à faire la loi
    sur le corridor de sécurité (Move Over) ?
  choices:
    A: Maintenir votre vitesse mais klaxonner
    B: S'arrêter immédiatement au milieu de la route
    C: Ralentir et changer de voie pour la voie non adjacente si cela peut se faire
      en toute sécurité
    D: Accélérer pour dépasser rapidement la zone d'urgence
  answer: C
  explanation: La loi sur le corridor de sécurité de l'Î.-P.-É. exige que les conducteurs
    ralentissent à une vitesse sécuritaire et, s'il y a deux voies ou plus, qu'ils
    se déplacent dans la voie la plus éloignée du véhicule d'urgence si cela est sécuritaire.
- id: 118
  category: defensive_driving
  question: Qu'est-ce que « conduire au-delà de la portée de ses phares » (overdriving
    your headlights), un danger courant de la conduite de nuit à l'Î.-P.-É. ?
  choices:
    A: Conduire avec les feux de route allumés en ville
    B: Conduire à une vitesse telle que votre distance d'arrêt est supérieure à la
