    roadway, clear of any intersection, and stop until the emergency vehicle has passed.
- id: 173
  category: sharing_the_road
  question: When following a large commercial truck, why should you maintain a greater
    following distance than you would for a passenger car?
  choices:
    A: Trucks have smaller blind spots
    B: To allow yourself a better view of the road ahead and to stay out of the truck's
      rear blind spot
    C: Trucks are required to stop at all railway crossings
    D: Trucks always travel faster than the speed limit
  answer: B
  explanation: Following too closely behind a truck puts you in its 'No-Zone' (blind
    spot) and severely limits your visibility of the road ahead.
- id: 174
  category: sharing_the_road
  question: According to the PEI Driver's Manual, what is the minimum distance you
    must maintain when following a fire apparatus (fire truck) that is responding
    to an alarm?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: The PEI Highway Traffic Act states that drivers must not follow a fire
    apparatus responding to an alarm at a distance of less than 150 meters.
- id: 175
  category: sharing_the_road
  question: If you are driving on a road with a physical median (divided highway)
    and a school bus is stopped in the opposite direction with red lights flashing,
    what are you required to do?
  choices:
    A: Stop and wait for the lights to stop flashing
    B: Slow down to 20 km/h
    C: Proceed with caution; you are not required to stop
    D: Stop only if there are children crossing the median
  answer: C
  explanation: On a divided highway where there is a physical median or barrier, traffic
    approaching the bus from the opposite direction is not required to stop, though
    caution is still advised.
- id: 176
  category: sharing_the_road
  question: When a pedestrian is using a white cane or a guide dog at a crosswalk
    in PEI, what does this indicate to the driver?
  choices:
    A: The pedestrian is a senior citizen
    B: The pedestrian has a visual impairment and must be given the right-of-way
    C: The pedestrian is a government official
    D: The pedestrian is training a dog
  answer: B
  explanation: A white cane or a guide dog indicates the pedestrian has a visual impairment.
    Drivers must exercise extra caution and yield the right-of-way.
- id: 177
  category: sharing_the_road
  question: When turning right, you see a cyclist positioned to the right of your
    vehicle. What should you do?
  choices:
    A: Speed up and turn quickly before the cyclist reaches the intersection
    B: Honk to tell the cyclist to stop
    C: Check your blind spot, signal, and yield to the cyclist before making the turn
    D: Assume the cyclist will move to the sidewalk
  answer: C
  explanation: Drivers must yield to cyclists when turning. 'Right-hooking' a cyclist
    is a common cause of accidents; always check your blind spot and ensure the cyclist
    has passed or stopped.
- id: 178
  category: sharing_the_road
  question: 'A slow-moving vehicle sign is required on the rear of any vehicle that
    travels at a speed of less than:'
  choices:
    A: 60 km/h
    B: 50 km/h
    C: 40 km/h
    D: 30 km/h
  answer: C
  explanation: The slow-moving vehicle sign (an orange triangle with a red border)
    must be displayed on the rear of vehicles designed to travel at speeds of less
    than 40 km/h.
- id: 179
  category: sharing_the_road
  question: When sharing the road with a motorcycle, why is it important to leave
    a full lane width for the motorcyclist?
  choices:
    A: Motorcycles are legally entitled to the full width of the lane
    B: Motorcycles need the space to avoid hazards like potholes or gravel
    C: It is illegal to drive beside a motorcycle in the same lane
    D: All of the above
  answer: D
  explanation: Motorcycles are entitled to the full lane. Drivers should never attempt
    to share a lane with a motorcycle as they need the space to maneuver around road
    hazards.
- id: 180
  category: sharing_the_road
  question: You are following a large truck that is turning right. The truck swings
    wide to the left before turning. What should you do?
  choices:
    A: Pass the truck on the right side
    B: Stay well back and do not attempt to pass on the right
    C: Honk to warn the driver they are in the wrong lane
    D: Speed up to pass on the left
  answer: B
  explanation: Large trucks need extra space to make turns. They often swing wide
    to the left to clear the curb on a right turn. Never try to squeeze between the
    truck and the curb.
- id: 181
  category: sharing_the_road
  question: In PEI, if you are involved in a collision with a pedestrian, what is
    the first priority?
  choices:
    A: Call your insurance company
    B: Check for injuries and call 911 if necessary
    C: Take photos of the vehicle damage
    D: Move your vehicle to the side of the road immediately
  answer: B
  explanation: The immediate priority in any collision involving a pedestrian is to
    check for injuries and ensure emergency medical services are notified.
- id: 182
  category: sharing_the_road
  question: When a transit bus in PEI has signaled its intention to pull back into
    traffic from a bus bay, what should you do?
  choices:
    A: Speed up to pass the bus
    B: Yield the right-of-way to the bus if it is safe to do so
    C: Maintain your speed; the bus must wait for a gap
    D: Stop and wait for the bus to complete its entire route
  answer: B
  explanation: While safety is paramount, drivers should be courteous and yield the
    right-of-way to transit buses re-entering the flow of traffic to maintain public
    transit schedules.
- id: 183
  category: sharing_the_road
  question: When approaching a stationary emergency vehicle with its flashing lights
    engaged on a PEI highway, what must a driver do if there are two or more lanes
    of traffic moving in the same direction?
  choices:
    A: Stop immediately in the current lane
    B: Maintain speed but honk to alert the emergency workers
    C: Slow down and move into a lane not adjacent to the emergency vehicle, if safe
      to do so
    D: Speed up to pass the vehicle as quickly as possible
  answer: C
  explanation: PEI's 'Move Over' law requires drivers to slow down and, if there are
    multiple lanes, move into a lane that is not adjacent to the emergency vehicle
    to provide a safety buffer.
- id: 184
  category: sharing_the_road
  question: In Prince Edward Island, what is the minimum distance you must stop from
    the front or rear of a school bus that has its red lights flashing and stop arm
    extended?
  choices:
    A: 3 meters
    B: 6 meters
    C: 10 meters
    D: 15 meters
  answer: B
  explanation: Drivers must stop at least 6 meters from a school bus when its red
    lights are flashing, whether they are approaching from the front or following
    from behind.
- id: 185
  category: sharing_the_road
  question: When following an emergency vehicle (such as a fire truck) that has its
    sirens or lights operating, what is the minimum following distance required by
    PEI law?
  choices:
    A: 50 meters
    B: 100 meters
    C: 150 meters
    D: 200 meters
  answer: C
  explanation: In PEI, it is illegal to follow within 150 meters of an emergency vehicle
    that is responding to an alarm.
- id: 186
  category: sharing_the_road
  question: According to the PEI Driver's Manual, what are the large blind spots around
    a commercial truck where the driver cannot see you called?
  choices:
    A: Danger Zones
    B: No-Zones
    C: Quiet Zones
    D: Shadow Zones
  answer: B
  explanation: The blind spots located at the front, rear, and sides of a truck are
    referred to as 'No-Zones.' If you cannot see the truck driver's face in their
    side mirrors, they cannot see you.
- id: 187
  category: sharing_the_road
  question: In PEI, when a school bus is displaying flashing amber lights, what does
    this indicate to other drivers?
  choices:
    A: The bus is about to stop to load or unload students
    B: The bus is experiencing mechanical failure
    C: The bus is traveling below the speed limit
    D: The bus is turning left
  answer: A
  explanation: Flashing amber lights on a school bus serve as a warning that the bus
    is preparing to stop. Drivers should prepare to stop their vehicles.
- id: 188
  category: sharing_the_road
  question: When a pedestrian is crossing the street at a marked or unmarked crosswalk
    in PEI, who has the right of way?
  choices:
    A: The motorist, if they are traveling at the speed limit
    B: The pedestrian
    C: The motorist, unless the pedestrian is in a school zone
    D: Whomever arrived at the intersection first
  answer: B
  explanation: Under the PEI Highway Traffic Act, drivers must yield the right of
    way to a pedestrian who is within a crosswalk (marked or unmarked).
- id: 189
  category: sharing_the_road
  question: When sharing the road with a motorcycle, why should you allow for a larger
    following distance than you would for a car?
  choices:
    A: Motorcycles have a much shorter stopping distance
    B: Motorcycles are heavier and harder to stop
    C: Motorcycles are required by law to be followed at 100 meters
    D: Motorcycles always travel slower than the speed limit
  answer: A
  explanation: Motorcycles can stop much more quickly than cars. Following too closely
    can lead to a collision if the motorcyclist has to brake suddenly.
- id: 190
  category: sharing_the_road
  question: 'In PEI, if an emergency vehicle is approaching you from the front or
    rear with its siren and lights on, you must yield the right of way and:'
  choices:
    A: Stop exactly where you are
    B: Speed up to get out of the way
    C: Immediately pull to the right as far as possible and stop
    D: Turn into the nearest driveway and wait
  answer: C
  explanation: Drivers must pull to the right-hand curb or edge of the roadway, clear
    of any intersection, and stop until the emergency vehicle has passed.
- id: 191
  category: sharing_the_road
  question: 'When a large truck is turning right at an intersection, it may need to:'
  choices:
    A: Swing wide to the left before turning
    B: Stay as close to the right curb as possible
    C: Back up to make the turn
    D: Stop and wait for all other traffic to clear the intersection
  answer: A
  explanation: Because of their length, large trucks often need to swing wide to the
    left to clear the curb when making a right-hand turn. Drivers should never try
    to squeeze in between the truck and the curb.
- id: 192
  category: sharing_the_road
  question: Under PEI law, which of the following is a cyclist required to have when
    riding at night?
  choices:
    A: A white light on the front and a red light or reflector on the rear
    B: A yellow light on the front and a blue light on the rear
    C: A high-visibility vest and a helmet light
    D: Reflective tape on the pedals only
  answer: A
  explanation: For night riding, the PEI Highway Traffic Act requires bicycles to
    be equipped with a front white light and a rear red light or reflector.
- id: 193
  category: sharing_the_road
  question: In Prince Edward Island, what does a pedestrian carrying a white cane
    indicate?
  choices:
    A: The pedestrian is a senior citizen
    B: The pedestrian is deaf
    C: The pedestrian is blind or visually impaired
    D: The pedestrian has a physical mobility issue
  answer: C
  explanation: A white cane is used by individuals who are blind or visually impaired.
    Drivers must exercise extreme caution and yield the right of way to these pedestrians.
- id: 194
  category: vehicle_information
  question: What is the minimum legal tread depth for tires on a passenger vehicle
    in Prince Edward Island?
  choices:
    A: 1.0 millimetre
    B: 1.6 millimetres
    C: 2.5 millimetres
    D: 3.2 millimetres
  answer: B
  explanation: In PEI, tires are considered unsafe and will fail inspection if the
    tread depth is less than 1.6 millimetres (2/32 of an inch).
- id: 195
  category: vehicle_information
  question: When following another vehicle at night in Prince Edward Island, at what
    distance must you dim your high beam headlights?
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: Under PEI law, you must dim your headlights to low beams when following
    another vehicle within a distance of 60 metres.
- id: 196
  category: vehicle_information
  question: 'Every motor vehicle in Prince Edward Island must be equipped with a horn
    that can be heard from a distance of at least:'
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 150 metres
  answer: B
  explanation: The Highway Traffic Act requires a horn in good working order capable
    of emitting sound audible under normal conditions from a distance of not less
    than 60 metres.
- id: 197
  category: vehicle_information
  question: Regarding window tinting in PEI, which of the following is true for a
    passenger car?
  choices:
    A: Tinting is allowed on the windshield up to 50%.
    B: No after-market tinting is allowed on the windshield or front side windows.
    C: Front side windows may be tinted up to 35%.
    D: Any window can be tinted as long as the driver wears glasses.
  answer: B
  explanation: PEI regulations prohibit the application of any after-market window
    tint film to the windshield or the windows to the direct left and right of the
    driver.
- id: 198
  category: vehicle_information
  question: 'In Prince Edward Island, high beam headlights must be capable of revealing
    persons and vehicles at a distance of at least:'
  choices:
    A: 60 metres
    B: 100 metres
    C: 150 metres
    D: 200 metres
  answer: B
  explanation: The Highway Traffic Act specifies that high beams (upper beam) must
    be directed so that they reveal persons and vehicles at a distance of at least
    100 metres ahead.
- id: 199
  category: vehicle_information
  question: If a load extends more than how many metres beyond the rear of a vehicle
    in PEI, must it be marked with a red flag or light?
  choices:
    A: 0.5 metres
    B: 1.0 metre
    C: 1.2 metres
    D: 2.0 metres
  answer: C
  explanation: In PEI, if a load extends 1.2 metres (approximately 4 feet) or more
    beyond the rear of the vehicle, a red flag (day) or a red light (night) must be
    attached to the end of the load.
- id: 200
  category: vehicle_information
  question: 'In PEI, low beam headlights must be directed so that they reveal persons
    and vehicles at a distance of at least:'
  choices:
    A: 15 metres
    B: 30 metres
    C: 50 metres
    D: 60 metres
  answer: B
  explanation: Low beam headlights (lower beam) must be designed and adjusted to reveal
    persons and vehicles at a distance of at least 30 metres ahead.
- id: 201
  category: vehicle_information
  question: Every motor vehicle in PEI must have a mirror so located as to reflect
    to the driver a view of the highway for a distance of at least ____ to the rear.
  choices:
    A: 30 metres
    B: 60 metres
    C: 100 metres
    D: 200 metres
  answer: B
  explanation: The Highway Traffic Act requires mirrors to provide a view of the highway
    for at least 60 metres to the rear of the vehicle.
- id: 202
  category: vehicle_information
  question: In Prince Edward Island, what color must the light illuminating the rear
    license plate be?
  choices:
    A: Red
    B: Blue
    C: White
    D: Amber
  answer: C
  explanation: The rear registration plate must be illuminated by a white light so
    that the characters are clearly legible from a distance of 15 metres to the rear.
- id: 203
  category: vehicle_information
  question: Which of the following equipment is mandatory for all motor vehicles operated
    on PEI highways?
  choices:
    A: Fog lights
    B: A speedometer in good working order
    C: A GPS navigation system
    D: Rear-view camera
  answer: B
  explanation: A functional speedometer is a required piece of equipment for all motor
    vehicles to ensure the driver can accurately monitor their speed.
- id: 204
  category: vehicle_information
  question: In Prince Edward Island, when are you required to have your vehicle's
    headlights turned on?
  choices:
    A: From one hour after sunset to one hour before sunrise.
    B: Only when it is raining or snowing.
    C: From sunset to sunrise and whenever visibility is reduced to 150 metres or
      less.
    D: Only when driving on unlit rural highways.
  answer: C
  explanation: Headlights must be turned on from sunset to sunrise, and at any other
    time when visibility is reduced to 150 metres or less due to atmospheric conditions.
- id: 205
  category: vehicle_information
  question: Under the PEI Highway Traffic Act, the service brake must be capable of
    stopping the vehicle on a dry, level road within what distance when travelling
    at 30 km/h?
  choices:
    A: 5 metres
    B: 10 metres
    C: 15 metres
    D: 20 metres
  answer: B
  explanation: The service brake must be able to stop the vehicle within a distance
    of 10 metres when the vehicle is arriving at a speed of 30 km/h.
- id: 206
  category: vehicle_information
  question: 'The rear registration plate on a vehicle in PEI must be illuminated by
    a white light so that it is clearly legible from a distance of at least:'
  choices:
    A: 10 metres
    B: 15 metres
    C: 20 metres
    D: 25 metres
  answer: B
  explanation: PEI law requires the rear license plate to be illuminated by a white
    light making it visible from a distance of 15 metres to the rear.
- id: 207
  category: vehicle_information
  question: In Prince Edward Island, what is the rule regarding after-market window
    tinting on the windshield and front side windows?
  choices:
    A: It is permitted if it blocks less than 50% of light.
    B: It is permitted only on the top 10cm of the windshield.
    C: No after-market tinting is allowed on the windshield or front side windows.
    D: It is permitted if the driver has a medical note.
  answer: C
  explanation: PEI regulations prohibit the application of any after-market tinting
    film to the windshield or the windows to the left and right of the driver.
- id: 208
  category: vehicle_information
  question: Regarding vehicle exhaust systems in PEI, which of the following is illegal?
  choices:
    A: Using a muffler that is not the original factory part.
    B: Using a muffler 'cut-out' or bypass.
    C: Having an exhaust pipe that exits the side of the vehicle.
    D: Using a chrome-tipped exhaust pipe.
  answer: B
  explanation: The PEI Highway Traffic Act prohibits the use of a muffler cut-out,
    straight exhaust, bypass, or similar device that increases noise.
- id: 209
  category: vehicle_information
  question: If a vehicle's rearview mirror is obstructed by a trailer or a load, what
    is the requirement in PEI?
  choices:
    A: The driver must remove the obstruction immediately.
    B: The driver must have an interior mirror and one side mirror.
    C: The vehicle must be equipped with both a left and a right exterior side-view
      mirror.
    D: The driver must use a passenger to spot for them at all times.
  answer: C
  explanation: If the view from the internal rearview mirror is obstructed, the vehicle
    must be equipped with mirrors on both the left and right exterior sides to provide
    a clear view to the rear.
- id: 210
  category: vehicle_information
  question: In PEI, what color must the turn signal lights be on the front of a motor
    vehicle?
  choices:
    A: White or Amber
    B: Red or Amber
    C: Blue or White
    D: Green or Amber
  answer: A
  explanation: According to vehicle equipment standards, front turn signals must be
    white or amber, while rear turn signals must be red or amber.
- id: 211
  category: signs_and_signals
  question: In Prince Edward Island, what does a flashing red traffic light signify?
  choices:
    A: Slow down and proceed with caution
    B: The light is about to turn green
    C: Stop, yield to traffic and pedestrians, and proceed when it is safe to do so
    D: Stop and wait for the light to turn solid green
  answer: C
  explanation: According to the PEI Driver's Handbook, a flashing red light has the
    same meaning as a stop sign. You must come to a complete stop, yield the right-of-way,
    and proceed only when safe.
- id: 212
  category: signs_and_signals
  question: When a driver in PEI extends their left arm out the window and points
    it straight up, what signal are they giving?
  choices:
    A: Left turn
    B: Right turn
    C: Stopping or slowing down
    D: Yielding to pedestrians
  answer: B
  explanation: The standard hand signal for a right turn is the left arm extended
    out the window and bent upward at the elbow.
- id: 213
  category: signs_and_signals
  question: On Prince Edward Island roads, what does a solid yellow line on your side
    of the center line indicate?
  choices:
    A: Passing is permitted if the road is clear
    B: It is a one-way street
    C: Passing is prohibited
    D: You are approaching a school zone
  answer: C
  explanation: A solid yellow line on your side of the center line means that passing
    is unsafe and strictly prohibited.
- id: 214
  category: signs_and_signals
  question: In PEI, what must you do when approaching a school bus from either direction
    that has its amber (yellow) lights flashing?
  choices:
    A: Stop immediately
    B: Speed up to pass before the red lights flash
    C: Prepare to stop, as the bus is about to stop to pick up or discharge students
    D: Maintain speed but watch for children
  answer: C
  explanation: Flashing amber lights on a school bus serve as a warning that the bus
    is slowing down and about to stop. Drivers should prepare to stop their vehicles.
- id: 215
  category: signs_and_signals
  question: What does a flashing yellow traffic light mean at an intersection in Prince
    Edward Island?
  choices:
    A: Stop and wait for the light to turn green
    B: Slow down and proceed with caution
    C: The intersection is closed
    D: Pedestrians have the right of way in all directions
  answer: B
  explanation: A flashing yellow light warns drivers to slow down and be extra cautious
    as they enter or proceed through the intersection.
- id: 216
  category: signs_and_signals
  question: 'In PEI, a pavement marking consisting of a large white diamond shape
    indicates:'
  choices:
    A: A high-collision area
    B: A pedestrian crosswalk
    C: A reserved lane for specific vehicles like buses or bicycles
    D: The end of a divided highway
  answer: C
  explanation: The diamond symbol on the pavement indicates a reserved lane, which
    is restricted for use by specific types of vehicles such as buses, taxis, or bicycles
    during certain times.
- id: 217
  category: signs_and_signals
  question: When entering a roundabout in Prince Edward Island, which signal should
    you use if you intend to exit 'straight through' (the second exit)?
  choices:
    A: Signal left upon entry
    B: Signal right upon entry
    C: Do not signal upon entry, but signal right after passing the exit before your
      intended exit
    D: Keep your hazard lights on until you exit
  answer: C
  explanation: In PEI roundabouts, if going straight, you do not signal on entry.
    However, you must always signal right immediately after passing the exit prior
    to the one you want to take.
- id: 218
  category: signs_and_signals
  question: What is the meaning of a 'Transit Priority' signal, which is a steady
    white vertical bar on a black background?
  choices:
    A: All traffic must stop
    B: Only emergency vehicles may proceed
    C: Only transit buses may proceed while other traffic faces a red light
    D: The road is for pedestrians only
  answer: C
  explanation: A white vertical bar signal allows transit buses to move through the
    intersection while all other lanes face a red light, giving them priority.
- id: 219
  category: signs_and_signals
  question: 'A sign with an orange background and black symbols or letters in PEI
    is used for:'
  choices:
    A: Regulatory information
    B: Construction and maintenance warnings
    C: School zone warnings
    D: Directional guidance to parks
  answer: B
  explanation: Orange is the standard color for temporary conditions, such as construction,
    road maintenance, or utility work zones.
- id: 220
  category: signs_and_signals
  question: In PEI, what does a solid white line painted across a traffic lane at
    an intersection represent?
  choices:
    A: A lane divider
    B: A stop line
    C: A parking boundary
    D: A speed bump
  answer: B
  explanation: A solid white line across a lane indicates where a vehicle must stop
    for a stop sign or traffic signal.
- id: 221
  category: signs_and_signals
  question: What does a green arrow shown with a red traffic light mean in Prince
    Edward Island?
  choices:
    A: You must stop and wait for the red light to change
    B: You may turn cautiously in the direction of the arrow, yielding to pedestrians
    C: The arrow is a warning that the light is about to turn red
    D: You have a protected turn; proceed in the direction of the arrow
  answer: D
  explanation: A green arrow with a red light means you may proceed in the direction
    of the arrow. This is usually a 'protected' movement where oncoming traffic is
    stopped.
- id: 222
  category: signs_and_signals
  question: In PEI, what does a sign shaped like a pentagon (five-sided, pointed up)
    indicate?
  choices:
    A: Yield right-of-way
    B: Stop sign ahead
    C: School zone or school crossing
    D: Railway crossing
  answer: C
  explanation: A pentagon-shaped sign is used exclusively to warn drivers that they
    are in or approaching a school zone or a school crosswalk.
- id: 223
  category: signs_and_signals
  question: What do broken (dashed) white lines on a roadway indicate in Prince Edward
    Island?
  choices:
    A: Separation of traffic moving in opposite directions
    B: Separation of traffic lanes moving in the same direction
    C: A pedestrian crossing area
    D: No lane changing allowed
  answer: B
  explanation: Broken white lines separate lanes of traffic moving in the same direction.
    Drivers may cross these lines to change lanes when it is safe to do so.
- id: 224
  category: signs_and_signals
  question: If you are approaching an intersection in PEI and the traffic light changes
    from green to yellow, what is the correct action?
  choices:
    A: Speed up to clear the intersection before it turns red
    B: Stop, unless you are already in the intersection or so close that stopping
      would be unsafe
    C: Always stop, regardless of your position
    D: Honk your horn and proceed
  answer: B
  explanation: A yellow light means the signal is about to turn red. You must stop
    if you can do so safely. If you are already in the intersection, you should proceed
    with caution.
- id: 225
  category: signs_and_signals
  question: In PEI, what is the meaning of a flashing amber (yellow) light on a school
    bus?
  choices:
    A: The bus is experiencing mechanical trouble
    B: The bus is about to stop to pick up or discharge students; prepare to stop
    C: You may pass the bus with caution
    D: The bus is traveling below the speed limit
  answer: B
  explanation: PEI uses the eight-lamp system on school buses. Flashing amber lights
    warn other drivers that the bus is slowing down and is about to stop to load or
    unload children.
- id: 226
  category: signs_and_signals
  question: If a driver in Prince Edward Island extends their left arm straight out
    the window, what does this hand signal indicate?
  choices:
    A: A right turn
    B: A stop or decrease in speed
    C: A left turn
    D: An intention to pull over to the curb
  answer: C
  explanation: The standard hand signal for a left turn is the left arm extended horizontally
    out the window.
- id: 227
  category: signs_and_signals
  question: What is the meaning of a flashing yellow light at an intersection in PEI?
  choices:
    A: Stop and wait for a green light
    B: The light is about to turn red; clear the intersection
    C: Slow down and proceed with caution
    D: Yield to all traffic coming from the right only
