metadata:
  source: PEI Driver Handbook
  total_questions: 235
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Prince Edward Island, what is the minimum age required to apply for
    a Class 7 (Instructional) driver's license?
  choices:
    A: 14 years old
    B: 15 years old
    C: 16 years old
    D: 17 years old
  answer: C
  explanation: According to the PEI Driver's Guide, an individual must be at least
    16 years of age to apply for a Class 7 instructional driver's license.
- id: 2
  category: license_system
  question: Under the PEI Graduated Driver Licensing (GDL) program, how long must
    a Stage 1 (L) driver hold their permit before taking a road test if they have
    NOT completed a certified driver education program?
  choices:
    A: 180 days
    B: 273 days
    C: 365 days
    D: 2 years
  answer: C
  explanation: Stage 1 (L) drivers must wait 365 days before taking a road test. This
    period is reduced to 273 days if they successfully complete a recognized driver
    education program.
- id: 3
  category: license_system
  question: A supervising driver for a Stage 1 (L) driver in Prince Edward Island
    must have held a valid driver's license for at least how many years?
  choices:
    A: 1 year
    B: 2 years
    C: 3 years
    D: 4 years
  answer: D
  explanation: The person accompanying a Stage 1 driver must have held a valid driver's
    license for at least four years.
- id: 4
  category: license_system
  question: What is the maximum blood alcohol concentration (BAC) allowed for any
    driver in the PEI Graduated Driver Licensing (GDL) program?
  choices:
    A: 0.00%
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: A
  explanation: All drivers in the GDL program (Stages 1, 2, and 3) must maintain a
    zero (0.00%) blood alcohol level while operating a vehicle.
- id: 5
  category: license_system
  question: In Stage 2 (G) of the PEI GDL program, what are the nighttime driving
    restrictions?
  choices:
    A: No driving between midnight and 5:00 AM
    B: No driving between 1:00 AM and 5:00 AM
    C: No driving between 11:00 PM and 6:00 AM
    D: No driving after sunset
  answer: B
  explanation: Stage 2 (G) drivers are restricted from driving between the hours of
    1:00 AM and 5:00 AM, unless they are 21 years of age or older or have an exemption
    for work purposes.
- id: 6
  category: license_system
  question: How many demerit points will result in an automatic license suspension
    for a driver in the PEI Graduated Driver Licensing (GDL) program?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: A
  explanation: Drivers in the GDL program face suspension when they accumulate 6 or
    more demerit points, whereas fully licensed drivers are suspended at 12 points.
- id: 7
  category: license_system
  question: When a driver moves to Prince Edward Island, how long do they have to
    notify Highway Safety of their change of address?
  choices:
    A: 7 days
    B: 10 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Under PEI law, you must notify the Highway Safety Division of a change
    of address within 30 days.
- id: 8
  category: license_system
  question: In Stage 1 (L) of the PEI GDL program, who is permitted to be in the vehicle
    besides the driver and the supervisor?
  choices:
    A: Immediate family members only
    B: One friend
    C: No other passengers are allowed
    D: Up to two other passengers
  answer: C
  explanation: In Stage 1 (L), the only person allowed in the vehicle other than the
    driver is the supervising driver who has held a license for at least 4 years.
- id: 9
  category: license_system
  question: What is the passenger restriction for a Stage 2 (G) driver in PEI who
    is under the age of 21?
  choices:
    A: No passengers allowed
    B: Only one passenger who is not an immediate family member
    C: Only immediate family members
    D: One passenger who is not an immediate family member, plus immediate family
      members
  answer: D
  explanation: Stage 2 (G) drivers are limited to one passenger who is not an immediate
    family member. However, they may carry all members of their immediate family.
- id: 10
  category: license_system
  question: How long is a standard Prince Edward Island driver's license valid for
    before it must be renewed?
  choices:
    A: 2 years
    B: 3 years
    C: 5 years
    D: 10 years
  answer: C
  explanation: A PEI driver's license is typically valid for a period of 5 years and
    expires on the driver's birthday.
- id: 11
  category: license_system
  question: Which of the following is a requirement for the supervising driver of
    a Stage 1 (L) driver in PEI?
  choices:
    A: They must be at least 25 years old
    B: They must sit in the front seat next to the driver
    C: They must have a Class 1 license
    D: They must have zero demerit points
  answer: B
  explanation: The supervising driver must occupy the seat immediately beside the
    driver to provide instruction and assistance.
- id: 12
  category: license_system
  question: If a GDL driver's license is suspended, what happens to their time spent
    in the current GDL stage?
  choices:
    A: The time continues to count during the suspension
    B: The time is reset to zero
    C: The time is paused and resumes after the suspension
    D: The driver is moved back to Stage 1
  answer: B
  explanation: In the PEI GDL program, if a license is suspended, the driver must
    start the time period for that specific stage over again from zero once the license
    is reinstated.
- id: 13
  category: license_system
  question: What is the minimum duration a driver must remain in Stage 2 (G) before
    moving to Stage 3 in the PEI GDL program?
  choices:
    A: 6 months
    B: 9 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Drivers must remain in Stage 2 (G) for a minimum of one year (365 days)
    without suspension before they can progress to Stage 3.
- id: 14
  category: license_system
  question: Which class of license in PEI is required to operate a standard passenger
    vehicle, such as a car or small truck?
  choices:
    A: Class 1
    B: Class 3
    C: Class 5
    D: Class 6
  answer: C
  explanation: A Class 5 license is the standard license for operating automobiles
    and light trucks in Prince Edward Island.
- id: 15
  category: license_system
  question: In PEI, what must a Stage 3 driver do to graduate to a full, non-GDL license?
  choices:
    A: Take another road test
    B: Complete Stage 3 (one year) without suspension
    C: Pay a graduation fee of $100
    D: Complete a defensive driving course
  answer: B
  explanation: Stage 3 is the final step of the GDL program. After completing one
    year in Stage 3 without suspension, the driver is no longer subject to GDL restrictions
    (though they must still follow general traffic laws).
- id: 16
  category: license_system
  question: In Prince Edward Island, which class of license is specifically required
    to operate a farm tractor on a public highway?
  choices:
    A: Class 5
    B: Class 8
    C: Class 9
    D: Class 3
  answer: C
  explanation: A Class 9 license in PEI is a restricted license that permits the operation
    of a farm tractor only.
- id: 17
  category: license_system
  question: 'To meet the vision standards for a Class 5 or 7 license in PEI, an applicant''s
    visual acuity must be at least:'
  choices:
    A: 20/20 in both eyes
    B: 20/40 in at least one eye
    C: 20/50 in both eyes
    D: 20/30 in the dominant eye
  answer: B
  explanation: According to the PEI Driver's Handbook, the minimum vision requirement
    for a standard driver's license is 20/40 in at least one eye, with or without
    corrective lenses.
- id: 18
  category: license_system
  question: 'If a resident of Prince Edward Island changes their legal name, they
    must notify Highway Safety and obtain a replacement license within:'
  choices:
    A: 7 days
    B: 14 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: PEI law requires drivers to notify the Highway Safety Division of a
    name or address change within 30 days.
- id: 19
  category: license_system
  question: 'A person holding a Class 6 (Motorcycle) Instruction Permit in PEI is
    prohibited from:'
  choices:
    A: Driving faster than 60 km/h
    B: Carrying any passengers
    C: Driving on the Confederation Bridge
    D: Driving a motorcycle with an engine larger than 250cc
  answer: B
  explanation: Under PEI regulations, a motorcycle learner (Class 6 permit holder)
    is not permitted to carry passengers.
- id: 20
  category: license_system
  question: If an applicant for a PEI license is from a country that does not have
    a reciprocal exchange agreement with PEI, what must they do?
  choices:
    A: Wait 6 months for a background check
    B: Apply for a Stage 1 license and wait 365 days
    C: Complete a vision test, a written knowledge test, and a road test
    D: Surrender their foreign license and wait 2 years
  answer: C
  explanation: Drivers from non-reciprocal countries must complete the full testing
    process, including vision, knowledge, and road tests, though they may be credited
    for previous driving experience to skip GDL wait times.
- id: 21
  category: license_system
  question: In PEI, which of the following license classes requires the applicant
    to submit a medical fitness report upon initial application?
  choices:
    A: Class 5
    B: Class 6
    C: Class 4
    D: Class 8
  answer: C
  explanation: Commercial classes (1, 2, 3, and 4) require a medical fitness report
    to ensure the driver is capable of safely operating larger vehicles or transporting
    the public.
- id: 22
  category: license_system
  question: If a driver fails their initial road test in Prince Edward Island, what
    is the minimum waiting period before they can attempt the test again?
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: C
  explanation: In PEI, if you fail a road test, you must wait at least 14 days before
    you are eligible to retake it.
- id: 23
  category: license_system
  question: When applying for a first-time instruction permit in PEI, which of the
    following is considered a valid 'Primary' identification document?
  choices:
    A: A student ID card
    B: A Canadian Birth Certificate
    C: A utility bill
    D: A credit card
  answer: B
  explanation: A Canadian Birth Certificate or a valid Passport are considered primary
    documents for establishing identity and legal presence in PEI.
- id: 24
  category: license_system
  question: 'While in Stage 1 (L) of the PEI Graduated Driver Licensing program, the
    driver is strictly prohibited from using:'
  choices:
    A: A GPS navigation system mounted on the dash
    B: The vehicle's climate control system
    C: Any hand-held or hands-free electronic communication device
    D: The vehicle's cruise control
  answer: C
  explanation: GDL drivers in PEI are prohibited from using any electronic communication
    devices, including hands-free cell phone systems.
- id: 25
  category: license_system
  question: If a driver's license is suspended in PEI, what must the driver do to
    regain their driving privileges after the suspension period ends?
  choices:
    A: Nothing; it is automatically reinstated
    B: Pay a reinstatement fee and potentially attend a driver improvement interview
    C: Retake the written knowledge test only
    D: Wait an additional 6 months of 'good behavior'
  answer: B
  explanation: After a suspension, drivers must pay a reinstatement fee and may be
    required to meet with a Driver Improvement Officer before their license is returned.
- id: 26
  category: license_system
  question: How long is the mandatory duration for Stage 3 of the PEI Graduated Driver
    Licensing (GDL) program?
  choices:
    A: 6 months
    B: 12 months
    C: 18 months
    D: 24 months
  answer: B
  explanation: Stage 3 is the final probationary period of the GDL program and lasts
    for 12 months of claim-free driving.
- id: 27
  category: license_system
  question: To be eligible for a Class 4 license (Taxi, Ambulance, or small bus) in
    PEI, an applicant must be at least how old?
  choices:
    A: 18 years old
    B: 19 years old
    C: 21 years old
    D: 25 years old
  answer: B
  explanation: The minimum age requirement for a Class 4 commercial license in Prince
    Edward Island is 19 years old.
- id: 28
  category: license_system
  question: 'In PEI, the supervising driver accompanying a Stage 1 (L) driver must
    have a Blood Alcohol Concentration (BAC) of less than:'
  choices:
    A: 0.00% (Zero tolerance)
    B: 0.02%
    C: 0.05%
    D: 0.08%
  answer: C
  explanation: While the learner must have 0.00% BAC, the supervising driver in PEI
    must have a BAC of less than 0.05%.
- id: 29
  category: license_system
  question: 'In Stage 2 (G) of the PEI GDL program, the total number of passengers
    in the vehicle is limited to:'
  choices:
    A: Two passengers
    B: Three passengers
    C: The number of functioning seatbelts
    D: Family members only
  answer: C
  explanation: During Stage 2, the driver is restricted to carrying only as many passengers
    as there are functioning seatbelts in the vehicle.
- id: 30
  category: driver_testing
  question: To pass the Prince Edward Island written knowledge test, an applicant
    must correctly answer at least how many questions out of 40?
  choices:
    A: '28'
    B: '30'
    C: '32'
    D: '35'
  answer: C
  explanation: The PEI written knowledge test consists of 40 questions, and a passing
    score of 80% (32 correct answers) is required.
- id: 31
  category: driver_testing
  question: Which of the following conditions would result in a vehicle being rejected
    for a PEI road test?
  choices:
    A: The vehicle is more than 10 years old.
    B: The passenger-side door cannot be opened from the inside and outside.
    C: The vehicle has a manual transmission.
    D: The fuel tank is less than half full.
  answer: B
  explanation: For safety reasons, the examiner must be able to exit the vehicle easily;
    therefore, both front doors must be functional from both inside and outside.
- id: 32
  category: driver_testing
  question: A visitor to Prince Edward Island who holds a valid out-of-province driver's
    license is permitted to drive in the province for up to how many days?
  choices:
    A: 30 days
    B: 60 days
    C: 90 days
    D: 120 days
  answer: D
  explanation: Under PEI law, a visitor may drive on a valid out-of-province license
    for a period of up to 120 days.
- id: 33
  category: driver_testing
  question: In Prince Edward Island, how many demerit points are recorded on a driver's
    record for failing to stop for a school bus when its red lights are flashing?
  choices:
    A: 3 points
    B: 5 points
    C: 8 points
    D: 12 points
  answer: C
  explanation: Failing to stop for a school bus with flashing red lights is a serious
    offense in PEI and carries a penalty of 8 demerit points.
- id: 34
  category: driver_testing
  question: Which PEI license class is required to operate a truck with more than
    two axles, provided it is not a semi-trailer truck?
  choices:
    A: Class 1
    B: Class 2
    C: Class 3
    D: Class 4
  answer: C
  explanation: A Class 3 license in PEI is required for any truck with more than two
    axles, such as a tandem truck, but does not include tractor-trailers (Class 1).
- id: 35
  category: driver_testing
  question: In Prince Edward Island, a Class 8 license is specifically for the operation
    of which type of vehicle?
  choices:
    A: Farm tractors
    B: Mopeds
    C: Ambulances
    D: Motorcycles
  answer: B
  explanation: A Class 8 license in PEI is a restricted license that allows the holder
    to operate a moped.
- id: 36
  category: driver_testing
  question: How many demerit points are assigned to a PEI driver for a conviction
    of using a hand-held communication device (distracted driving)?
  choices:
    A: 2 points
    B: 3 points
    C: 5 points
    D: 6 points
  answer: C
  explanation: Distracted driving in PEI carries a penalty of 5 demerit points upon
    conviction.
- id: 37
  category: driver_testing
  question: When appearing for a road test in PEI, which three documents must be presented
    for the vehicle being used?
  choices:
    A: Bill of sale, insurance, and owner's manual
    B: Registration, valid insurance, and a valid inspection sticker
    C: Driver's logbook, registration, and tax receipt
    D: Lease agreement, insurance, and maintenance records
  answer: B
  explanation: The applicant must provide a vehicle that is properly registered, insured,
    and has a valid PEI motor vehicle inspection sticker.
- id: 38
  category: driver_testing
  question: A fully licensed (non-GDL) driver in Prince Edward Island will have their
    driving privileges suspended if they accumulate how many demerit points?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: While GDL drivers are suspended at 6 points, a fully licensed driver
    in PEI is suspended upon reaching 12 demerit points.
- id: 39
  category: driver_testing
  question: In PEI, a driver with a BAC between 0.05 and 0.08 is subject to an immediate
    Administrative Roadside Suspension for a first offense of how many hours?
  choices:
    A: 12 hours
    B: 24 hours
    C: 48 hours
    D: 72 hours
  answer: B
  explanation: PEI law mandates an immediate 24-hour roadside suspension for drivers
    found with a BAC in the 'warn' range of 0.05 to 0.08.
- id: 40
  category: driver_testing
  question: For commercial drivers (Classes 1, 2, 3, 4) in PEI under the age of 45,
    how often must a medical fitness report be filed with Highway Safety?
  choices:
    A: Every year
    B: Every 2 years
    C: Every 3 years
    D: Every 5 years
  answer: D
  explanation: Commercial drivers in PEI must submit a medical report every 5 years
    until age 45, every 3 years until age 65, and annually thereafter.
- id: 41
  category: driver_testing
  question: How many demerit points are applied to a PEI driver's record for failing
    to wear a seat belt?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: A conviction for failing to wear a seat belt in Prince Edward Island
    results in 3 demerit points.
- id: 42
  category: driver_testing
  question: Which PEI license class is required to operate a bus with a seating capacity
    of more than 24 passengers?
  choices:
    A: Class 2
    B: Class 3
    C: Class 4
    D: Class 5
  answer: A
  explanation: A Class 2 license is required in PEI to operate any bus with a seating
    capacity of more than 24 passengers.
- id: 43
  category: driver_testing
  question: Which of the following is a mandatory requirement for the vehicle used
    during a PEI road test?
  choices:
    A: It must be a dual-brake vehicle
    B: It must have a valid motor vehicle inspection (MVI) sticker
    C: It must be less than 10 years old
    D: It must be provided by the Driver Examiner
  answer: B
  explanation: The vehicle used for a road test in PEI must be in safe mechanical
    condition and display a valid motor vehicle inspection (MVI) sticker, along with
    valid registration and insurance.
- id: 44
  category: driver_testing
  question: At what age is a standard Class 5 driver in Prince Edward Island first
    required to submit a medical fitness report to Highway Safety?
  choices:
    A: '65'
    B: '70'
    C: '75'
    D: '80'
  answer: C
  explanation: In PEI, drivers holding a Class 5 or 6 license must submit a medical
    report at age 75, again at age 80, and every two years thereafter.
- id: 45
  category: driver_testing
  question: What is the minimum passing score required on the PEI written rules and
    signs tests?
  choices:
    A: 70% on each part
    B: 75% on each part
    C: 80% on each part
    D: 90% on each part
  answer: C
  explanation: 'The PEI written test consists of two parts: road signs and rules of
    the road. An applicant must score at least 80% (16 out of 20) on each part to
    pass.'
- id: 46
  category: driver_testing
  question: During a PEI road test, which of the following actions will result in
    an immediate automatic failure?
  choices:
    A: Failing to use a turn signal once
    B: Touching a curb while parallel parking
    C: An action that requires the examiner to intervene to prevent a collision
    D: Driving 2 km/h under the speed limit
  answer: C
  explanation: Any action that results in a collision, near-collision, or requires
    the examiner to take control of the vehicle or intervene for safety is an automatic
    failure.
- id: 47
  category: driver_testing
  question: When applying for a Class 7 Instruction Permit in PEI, an applicant must
    provide how many pieces of identification?
  choices:
    A: One piece of photo ID only
    B: Two pieces of ID, at least one of which must show the applicant's legal name
      and date of birth
    C: Three pieces of ID, all of which must have photos
    D: No ID is required if a parent is present
  answer: B
  explanation: Applicants must provide at least two pieces of identification. One
    must be a primary document (like a birth certificate or passport) that establishes
    the legal name and date of birth.
- id: 48
  category: driver_testing
  question: In PEI, which endorsement code must be added to a driver's license to
    permit the operation of a vehicle equipped with air brakes?
  choices:
    A: Endorsement A
    B: Endorsement B
    C: Endorsement S
    D: Endorsement Z
  answer: A
  explanation: In Prince Edward Island, the 'A' endorsement on a driver's license
    signifies that the holder is authorized to operate vehicles equipped with air
    brakes.
- id: 49
  category: driver_testing
  question: For a fully licensed (non-GDL) driver in PEI, at how many demerit points
    will their license be suspended?
  choices:
    A: 6 points
    B: 9 points
    C: 12 points
    D: 15 points
  answer: C
  explanation: While GDL drivers are suspended at 6 points, a fully licensed driver
    in PEI will face a license suspension upon accumulating 12 or more demerit points
    within a 24-month period.
- id: 50
  category: driver_testing
  question: Which PEI license class is required to operate a moped or motor-driven
    cycle?
  choices:
    A: Class 5
    B: Class 6
    C: Class 8
    D: Class 9
  answer: D
  explanation: Class 9 is a specific PEI license class that permits the operation
    of a moped or motor-driven cycle.
- id: 51
  category: driver_testing
  question: If you are taking a road test in PEI, what document must you present to
    prove the vehicle is insured?
  choices:
    A: A verbal statement from the owner
    B: The vehicle's bill of sale
    C: A valid motor vehicle liability insurance card (pink card)
    D: The driver's personal health card
  answer: C
  explanation: Before a road test begins, the examiner will verify that the vehicle
    has a valid motor vehicle liability insurance card, commonly known as a 'pink
    card'.
- id: 52
  category: driver_testing
  question: 'A driver who has been suspended for a first-time Alcohol-Related Administrative
    Sanction in PEI must pay a reinstatement fee of:'
  choices:
    A: No fee
    B: $100
    C: $500
    D: $1,000
  answer: C
  explanation: In PEI, the administrative reinstatement fee following an alcohol-related
    suspension is $500.
- id: 53
  category: driver_testing
  question: Which of the following is true regarding the PEI road test for a Class
    5 license?
  choices:
    A: The examiner will provide a vehicle if you do not have one
    B: You must demonstrate a parallel park
    C: You are allowed to have one friend in the back seat for support
    D: You do not need to wear a seatbelt if you are the driver
  answer: B
  explanation: The PEI Class 5 road test includes a demonstration of basic driving
    skills, including parallel parking, backing up, and turning. Only the driver and
    the examiner are permitted in the vehicle.
- id: 54
  category: driver_testing
  question: 'In PEI, if you are a new resident and hold a valid driver''s license
    from another Canadian province, you can exchange it for a PEI license without
    a written or road test, provided:'
  choices:
    A: You have lived in PEI for at least one year
    B: Your out-of-province license is not expired more than one year
    C: You are over the age of 25
    D: You have never received a speeding ticket
  answer: B
  explanation: PEI has a reciprocal agreement with all Canadian provinces; you can
    exchange a valid license (or one expired less than a year) for a PEI license of
    the same class without further testing.
- id: 55
  category: driver_responsibility
  question: In Prince Edward Island, what is the minimum amount of third-party liability
    insurance coverage required by law?
  choices:
    A: $50,000
    B: $100,000
    C: $200,000
    D: $500,000
  answer: C
  explanation: According to the PEI Compulsory Automobile Insurance Act, every motor
    vehicle must be insured for at least $200,000 in third-party liability coverage.
- id: 56
  category: driver_responsibility
  question: 'Under the PEI Highway Traffic Act, an accident must be reported to the
    nearest police agency if the total property damage is estimated to be at least:'
  choices:
    A: $500
    B: $1,000
    C: $1,500
    D: $2,000
  answer: D
  explanation: In Prince Edward Island, accidents involving injury, death, or property
    damage exceeding $2,000 must be reported to the police immediately.
- id: 57
  category: driver_responsibility
  question: How often must a motor vehicle registered in Prince Edward Island undergo
    a formal safety inspection (MVI)?
  choices:
    A: Every 6 months
    B: Every 12 months
    C: Every 24 months
    D: Only when the vehicle is sold
  answer: B
  explanation: PEI regulations require that most motor vehicles undergo an annual
    Motor Vehicle Inspection (MVI) to ensure they meet safety standards.
- id: 58
  category: driver_responsibility
  question: 'When selling a vehicle in Prince Edward Island, the seller must notify
    the Registrar of Motor Vehicles of the transfer of ownership within:'
  choices:
    A: 24 hours
    B: 7 days
    C: 14 days
    D: 30 days
  answer: B
  explanation: The seller of a motor vehicle in PEI is required to notify the Registrar
    within 7 days of the date of sale or transfer.
- id: 59
  category: driver_responsibility
  question: If you are involved in an accident with an unattended vehicle and cannot
    find the owner, what is your legal responsibility in PEI?
  choices:
    A: Leave a note and continue your journey
    B: Wait for 30 minutes, then leave if no one arrives
