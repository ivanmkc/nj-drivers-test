questions:
- id: 1
  category: license_system
  question: ¿En Oklahoma, a qué edad mínima puede una persona solicitar un permiso
    de aprendizaje si está inscrita actualmente o ha completado un curso de educación
    vial aprobado?
  choices:
    A: 14 años
    B: 15 años
    C: 15 años y medio
    D: 16 años
  answer: B
  explanation: Según el Manual del Conductor de Oklahoma, debe tener al menos 15 años
    para solicitar un permiso de aprendizaje si está inscrito o ha completado un curso
    de educación vial aprobado.
- id: 2
  category: license_system
  question: Bajo la ley de Licencia de Conducir Graduada (GDL) de Oklahoma, ¿cuánto
    tiempo debe un adolescente tener un permiso de aprendizaje antes de ser elegible
    para una Licencia Intermedia?
  choices:
    A: 3 meses
    B: 6 meses
    C: 9 meses
    D: 12 meses
  answer: B
  explanation: La ley de Oklahoma exige que se mantenga el permiso de aprendizaje
    durante al menos seis meses antes de que la persona pueda solicitar una Licencia
    Intermedia.
- id: 3
  category: license_system
  question: ¿Entre qué horas tiene restringido conducir el titular de una Licencia
    Intermedia de Oklahoma, a menos que sea por actividades relacionadas con la escuela,
    el trabajo o la iglesia?
  choices:
    A: 11:00 PM y 4:00 AM
    B: 10:00 PM y 5:00 AM
    C: Medianoche y 6:00 AM
    D: 9:00 PM y 6:00 AM
  answer: B
  explanation: Los conductores adolescentes con una Licencia Intermedia en Oklahoma
    no pueden conducir entre las 10:00 PM y las 5:00 AM, excepto por actividades relacionadas
    con la escuela, la iglesia o el empleo.
- id: 4
  category: license_system
  question: ¿Cuántos pasajeros (que no sean miembros de la familia) se le permite
    llevar en el vehículo al titular de una Licencia Intermedia de Oklahoma sin un
    adulto supervisor?
  choices:
    A: Cero
    B: Uno
    C: Dos
    D: Tres
  answer: B
  explanation: Las leyes de GDL de Oklahoma establecen que el titular de una Licencia
    Intermedia solo puede llevar a un pasajero que no viva en su hogar, a menos que
    esté acompañado por un conductor con licencia de al menos 21 años.
- id: 5
  category: license_system
  question: Para obtener una Licencia Intermedia en Oklahoma, un padre o tutor debe
    certificar que el solicitante ha completado ¿cuántas horas de práctica al volante?
  choices:
    A: 30 horas (5 de noche)
    B: 40 horas (10 de noche)
    C: 50 horas (10 de noche)
    D: 60 horas (15 de noche)
  answer: C
  explanation: Oklahoma requiere 50 horas de práctica al volante, 10 de las cuales
    deben ser nocturnas, certificadas por un padre o tutor.
- id: 6
  category: license_system
  question: Si se muda a una nueva residencia dentro de Oklahoma, debe notificar al
    Departamento de Seguridad Pública (DPS) su cambio de dirección en un plazo de
    ¿cuántos días?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Oklahoma le exige notificar al DPS por escrito cualquier
    cambio de dirección o nombre en un plazo de 10 días.
- id: 7
  category: license_system
  question: Bajo el Sistema de Puntos de Oklahoma, su licencia de conducir será suspendida
    si acumula ¿cuántos puntos en un período de cinco años?
  choices:
    A: 7 puntos
    B: 10 puntos
    C: 12 puntos
    D: 15 puntos
  answer: B
  explanation: En Oklahoma, si acumula 10 o más puntos en un período de cinco años,
    su privilegio de conducir será suspendido.
- id: 8
  category: license_system
  question: ¿Cuántos puntos se pueden eliminar de un registro de conducir de Oklahoma
    por completar con éxito un Curso de Manejo Defensivo aprobado?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 5 puntos
  answer: B
  explanation: Completar un Curso de Manejo Defensivo aprobado por Oklahoma resultará
    en una reducción de 2 puntos en su registro de conducir. Esto se puede hacer una
    vez cada 24 meses.
- id: 9
  category: license_system
  question: ¿Cuántos puntos se deducen de un registro de conducir de Oklahoma por
    cada período de 12 meses en el que no se cometan infracciones de tráfico?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: Todos los puntos
  answer: B
  explanation: Por cada período de 12 meses durante el cual no tenga condenas de tráfico,
    se eliminarán 2 puntos de su registro de conducir de Oklahoma.
- id: 10
  category: license_system
  question: La Ley de Seguro Obligatorio de Oklahoma exige que los conductores tengan
    un mínimo de ¿cuánta cobertura para daños a la propiedad?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: La ley de Oklahoma exige límites mínimos de responsabilidad de 25/50/25,
    donde el último '25' representa $25,000 para daños a la propiedad.
- id: 11
  category: license_system
  question: ¿Cuál es el nivel mínimo de concentración de alcohol en sangre (BAC) para
    que un conductor menor de 21 años sea citado por un DUI bajo la ley de "Tolerancia
    Cero" de Oklahoma?
  choices:
    A: '0.01'
    B: Cualquier cantidad medible
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: Oklahoma tiene una ley de Tolerancia Cero para menores; cualquier cantidad
    medible de alcohol (incluso 0.01) resultará en la revocación de la licencia para
    conductores menores de 21 años.
- id: 12
  category: license_system
  question: En Oklahoma, ¿por cuántos años es válida típicamente una licencia de conducir
    estándar Clase D?
  choices:
    A: 2 o 4 años
    B: 4 u 8 años
    C: 5 años
    D: 10 años
  answer: B
  explanation: Según las actualizaciones recientes de la ley de Oklahoma, los conductores
    tienen la opción de renovar su licencia por un período de 4 u 8 años.
- id: 13
  category: license_system
  question: ¿Cuál de los siguientes documentos NO es aceptable como forma principal
    de identificación al solicitar una licencia de conducir de Oklahoma?
  choices:
    A: Acta de nacimiento certificada de EE. UU.
    B: Pasaporte válido de EE. UU.
    C: Tarjeta de Seguro Social
    D: Certificado de Naturalización
  answer: C
  explanation: Aunque se requiere una tarjeta de Seguro Social para la solicitud,
    se considera un documento secundario, no un documento principal como un acta de
    nacimiento o un pasaporte.
- id: 14
  category: license_system
  question: Si un conductor de Oklahoma se ve involucrado en una colisión que resulta
    en daños a la propiedad que exceden ¿qué cantidad?, debe presentar un informe
    si la policía no investigó.
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: Según el Manual del Conductor de Oklahoma, si una colisión resulta
    en lesiones, muerte o daños a la propiedad de más de $300, y no se presentó un
    informe policial, usted debe presentar un informe ante el Departamento de Seguridad
    Pública (DPS).
- id: 15
  category: license_system
  question: ¿A qué edad puede un adolescente de Oklahoma que ha completado la educación
    vial y ha tenido una Licencia Intermedia durante 6 meses solicitar una Licencia
    sin Restricciones?
  choices:
    A: 16 años
    B: 16 años y medio
    C: 17 años
    D: 18 años
  answer: B
  explanation: Si un adolescente ha completado la educación vial y ha tenido una Licencia
    Intermedia durante al menos 6 meses sin ninguna condena de tráfico, es elegible
    para una Licencia sin Restricciones a los 16.5 años de edad.
- id: 16
  category: license_system
  question: Para aprobar el examen de la vista de Oklahoma, ¿qué agudeza visual mínima
    debe tener un solicitante en ambos ojos, con o sin lentes correctivos?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: Según el Manual del Conductor de Oklahoma, debe tener una visión de
    20/40 o mejor en ambos ojos (con o sin lentes correctivos) para aprobar el examen
    de la vista sin restricciones.
- id: 17
  category: license_system
  question: 'Bajo la Ley de Consentimiento Implícito de Oklahoma, si usted es arrestado
    por conducir bajo la influencia (DUI) y se niega a someterse a una prueba química
    de aliento o sangre administrada por el estado, sus privilegios de conducir serán:'
  choices:
    A: Suspendidos por 30 días
    B: Revocados por un período de 6 meses a 3 años
    C: Reducidos a un permiso solo para el trabajo de inmediato
    D: Sin cambios hasta que sea condenado en la corte
  answer: B
  explanation: Al conducir en las carreteras de Oklahoma, usted otorga su "consentimiento
    implícito" para las pruebas. La negativa resulta en una revocación automática
    de su licencia por parte del Departamento de Seguridad Pública, que generalmente
    varía de 6 meses a 3 años dependiendo de las ofensas anteriores.
- id: 18
  category: license_system
  question: Si cambia su nombre debido a matrimonio o una orden judicial, debe notificar
    a Service Oklahoma (anteriormente DPS) y obtener una licencia de reemplazo dentro
    de ¿cuántos días?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: A
  explanation: La ley de Oklahoma requiere que cualquier persona que cambie su nombre
    o dirección debe notificar al estado por escrito dentro de los 10 días.
- id: 19
  category: license_system
  question: En Oklahoma, ¿cuál es la edad mínima para solicitar una licencia de motocicleta
    restringida (para motocicletas de 300cc o menos)?
  choices:
    A: '14'
    B: '15'
    C: '15.5'
    D: '16'
  answer: A
  explanation: Oklahoma permite que las personas que tienen 14 años soliciten una
    licencia de motocicleta restringida después de completar un curso básico para
    motociclistas y aprobar los exámenes requeridos.
- id: 20
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para que un padre imparta la "Educación
    Vial Impartida por los Padres" (PTDE) en Oklahoma?
  choices:
    A: El padre debe tener una licencia de instructor de manejo comercial
    B: El padre debe haber tenido una licencia de conducir válida durante los últimos
      5 años
    C: El padre debe usar un plan de estudios aprobado por Service Oklahoma
    D: El padre debe ser un maestro certificado de escuela pública
  answer: C
  explanation: Los padres deben usar un proveedor y un plan de estudios de PTDE aprobado
    por el estado. También deben cumplir con requisitos específicos del historial
    de manejo, pero no necesitan una licencia de instructor comercial.
- id: 21
  category: license_system
  question: ¿Cuál es la tarifa estándar de restablecimiento para una licencia de conducir
    de Oklahoma suspendida por un DUI (conducir bajo la influencia) por primera infracción?
  choices:
    A: $50
    B: $150
    C: $300
    D: $500
  answer: C
  explanation: La tarifa estatutaria de restablecimiento para una licencia revocada
    por infracciones relacionadas con el alcohol o las drogas en Oklahoma es de $300,
    además de otras tarifas administrativas.
- id: 22
  category: license_system
  question: 'En Oklahoma, una licencia de conducir Clase D le permite operar un vehículo
    con una Clasificación de Peso Bruto del Vehículo (GVWR) de hasta:'
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 33,000 lbs
  answer: C
  explanation: Una licencia Clase D es la licencia estándar no comercial y permite
    la operación de vehículos con un GVWR de 26,000 lbs o menos.
- id: 23
  category: license_system
  question: Si lo sorprenden conduciendo sin una licencia de conducir válida en Oklahoma,
    ¿cuál es la multa máxima por una primera infracción?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: C
  explanation: Conducir sin una licencia válida en Oklahoma es un delito menor sancionable
    con una multa de $50 a $500 y/o hasta 30 días de cárcel por la primera infracción.
- id: 24
  category: license_system
  question: ¿Con cuánta antelación a la fecha de vencimiento real puede un residente
    de Oklahoma renovar su licencia de conducir?
  choices:
    A: 30 días
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: C
  explanation: A los residentes de Oklahoma se les permite renovar su licencia de
    conducir hasta un año (12 meses) antes de la fecha de vencimiento.
- id: 25
  category: license_system
  question: 'Según la ley de Oklahoma, si es declarado culpable de ''Incumplimiento''
    de la Ley de Seguro Obligatorio, su licencia y registro serán suspendidos hasta
    que:'
  choices:
    A: Hayan pasado 30 días
    B: Pague una multa de $1,000
    C: Proporcione un comprobante de seguro y pague las tarifas de restablecimiento
    D: Haya pasado un año
  answer: C
  explanation: La suspensión por falta de seguro permanece vigente hasta que el conductor
    proporcione un comprobante de seguro actual y pague todas las tarifas de restablecimiento
    requeridas.
- id: 26
  category: license_system
  question: ¿Cuál es el propósito principal de la licencia de conducir de Oklahoma
    compatible con 'REAL ID' en comparación con una licencia estándar?
  choices:
    A: Le permite conducir en otros países
    B: Es necesaria para abordar vuelos comerciales nacionales y entrar a edificios
      federales
    C: Le permite conducir camiones semirremolques comerciales
    D: Elimina todas las restricciones de la GDL para conductores adolescentes
  answer: B
  explanation: El REAL ID es un estándar de seguridad federal. A partir del 7 de mayo
    de 2025, los habitantes de Oklahoma necesitarán un REAL ID (u otra forma de identificación
    aprobada, como un pasaporte) para abordar vuelos nacionales o ingresar a instalaciones
    federales seguras.
- id: 27
  category: license_system
  question: 'En Oklahoma, si es menor de 18 años y desea solicitar un permiso o licencia,
    debe presentar un comprobante de:'
  choices:
    A: Empleo a tiempo completo
    B: Inscripción actual o graduación de la escuela secundaria
    C: Propiedad de un vehículo
    D: Un historial criminal limpio
  answer: B
  explanation: La ley de Oklahoma exige que los solicitantes menores de 18 años demuestren
    que están inscritos con éxito en la escuela, que se han graduado o que están en
    un programa de educación en el hogar (formulario de 'Inscripción/Asistencia Escolar').
- id: 28
  category: license_system
  question: Si un conductor de Oklahoma es condenado por 'Conducir bajo la influencia'
    (DUI), ¿cuántos puntos se agregan a su historial de conducción?
  choices:
    A: 2 puntos
    B: 4 puntos
    C: 5 puntos
    D: Ninguno; en su lugar, se revoca la licencia
  answer: D
  explanation: En Oklahoma, las infracciones graves como DUI, homicidio involuntario
    o delitos graves que involucran un vehículo no resultan en puntos; en su lugar,
    resultan en la revocación automática del privilegio de conducir.
- id: 29
  category: license_system
  question: ¿Cuál de los siguientes es un requisito para el titular de un Permiso
    de Aprendizaje de Oklahoma al conducir?
  choices:
    A: Debe conducir solo durante las horas del día
    B: Un conductor con licencia de 21 años o más debe estar en el asiento del pasajero
      delantero
    C: No puede tener pasajeros en el asiento trasero
    D: Debe tener a un padre o tutor legal en el vehículo en todo momento
  answer: B
  explanation: La ley de Oklahoma exige que el titular de un permiso esté acompañado
    por un conductor con licencia que tenga al menos 21 años de edad y haya tenido
    licencia durante al menos dos años, sentado en el asiento del pasajero delantero.
- id: 30
  category: driver_testing
  question: En Oklahoma, ¿cuál es el límite de velocidad máximo en la mayoría de las
    autopistas de peaje (turnpikes), a menos que se indique lo contrario?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: Según el Manual del Conductor de Oklahoma, el límite de velocidad máximo
    en las autopistas de peaje es de 75 mph, aunque algunas secciones pueden estar
    señalizadas a 80 mph.
- id: 31
  category: driver_testing
  question: Al estacionar su vehículo cerca de un hidrante de incendios en Oklahoma,
    ¿cuál es la distancia mínima que debe mantener?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: La ley de Oklahoma prohíbe estacionar a menos de 15 pies de un hidrante
    de incendios.
- id: 32
  category: driver_testing
  question: En Oklahoma, ¿con cuántos pies de antelación, como mínimo, debe usar su
    señal de giro antes de girar o cambiar de carril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: El Manual del Conductor de Oklahoma establece que debe hacer la señal
    durante al menos 100 pies antes de girar o cambiar de carril.
- id: 33
  category: driver_testing
  question: Cuando sigue a otro vehículo por la noche en Oklahoma, ¿a cuántos pies
    del vehículo que va delante debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 400 pies
    C: 600 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Oklahoma exige que los conductores bajen las luces altas
    cuando sigan a otro vehículo a una distancia de 600 pies o menos.
- id: 34
  category: driver_testing
  question: Según la ley de Oklahoma, ¿cuál es la multa máxima por una primera condena
    por arrojar basura desde un vehículo?
  choices:
    A: Hasta $500
    B: Hasta $1,000
    C: Hasta $2,000
    D: Hasta $5,000
  answer: C
  explanation: Arrojar basura en Oklahoma es una infracción grave; una condena puede
    resultar en una multa de hasta $2,000 y/o tiempo en la cárcel.
- id: 35
  category: driver_testing
  question: Al acercarse a un vehículo que viene en sentido contrario por la noche,
    la ley de Oklahoma le exige bajar las luces altas de sus faros a una distancia
    de cuántos pies?
  choices:
    A: 300 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Debe bajar las luces altas cuando un vehículo que viene en sentido
    contrario se encuentre a menos de 1,000 pies.
- id: 36
  category: driver_testing
  question: En Oklahoma, ¿los niños menores de qué edad deben estar debidamente asegurados
    en un sistema de retención infantil (asiento de seguridad)?
  choices:
    A: Menores de 4 años
    B: Menores de 6 años
    C: Menores de 8 años
    D: Menores de 10 años
  answer: C
  explanation: La ley de Oklahoma exige que los niños menores de 8 años de edad utilicen
    un sistema de retención infantil, a menos que midan más de 4'9" de altura.
- id: 37
  category: driver_testing
  question: Al estacionar un vehículo en una calle pública en Oklahoma, ¿a cuántos
    pies de una señal de alto no debe estacionarse?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Oklahoma prohíbe estacionar a menos de 30 pies de una señal
    de alto, una baliza intermitente o una señal de control de tráfico.
- id: 38
  category: driver_testing
  question: Según el Manual del Conductor de Oklahoma, ¿a qué velocidad puede comenzar
    el hidroplaneo (hidroplaning), cuando los neumáticos pierden contacto con la carretera?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph,
    y a 55 mph, los neumáticos pueden perder todo contacto con la carretera.
- id: 39
  category: driver_testing
  question: En Oklahoma, si es condenado por una primera ofensa de DUI (conducir bajo
    la influencia), ¿cuál es la posible sentencia de cárcel?
  choices:
    A: Sin tiempo en la cárcel, solo una multa
    B: De 10 días a 1 año
    C: De 30 días a 2 años
    D: Mínimo de 6 meses
  answer: B
  explanation: Un primer DUI en Oklahoma es un delito menor castigado con 10 días
    a 1 año de cárcel y una multa de hasta $1,000.
- id: 40
  category: driver_testing
  question: 'Al rebasar una bicicleta en Oklahoma, los conductores deben mantener
    una distancia de seguridad de al menos:'
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Oklahoma exige que los automovilistas dejen al menos 3 pies
    de espacio entre su vehículo y una bicicleta al rebasarla.
- id: 41
  category: driver_testing
  question: ¿En una autopista con al menos dos carriles en cada dirección, qué le
    exige la ley de "Hacerse a un lado" (Move Over) de Oklahoma que haga al acercarse
    a un vehículo de emergencia estacionado con luces intermitentes?
  choices:
    A: Detenerse por completo hasta que el vehículo se retire
    B: Mantener la velocidad pero moverse al carril izquierdo
    C: Moverse al carril que no esté adyacente al vehículo de emergencia, si es seguro
      hacerlo
    D: Acelerar para pasar la escena rápidamente
  answer: C
  explanation: La ley de "Hacerse a un lado" (Move Over) de Oklahoma exige que los
    conductores se muevan a un carril no adyacente o reduzcan la velocidad a un nivel
    seguro si no es posible cambiar de carril.
- id: 42
  category: driver_testing
  question: 'Al detenerse ante un autobús escolar con luces rojas intermitentes y
    un brazo de parada extendido en una autopista dividida por una barrera física
    o mediana, el tráfico que viaja en la dirección opuesta debe:'
  choices:
    A: Detenerse hasta que las luces dejen de parpadear
    B: Reducir la velocidad a 15 mph
    C: Proceder con precaución; no están obligados a detenerse
    D: Detenerse solo si hay niños presentes
  answer: C
  explanation: En Oklahoma, si una autopista está dividida por una barrera física
    o mediana, el tráfico que viaja en la dirección opuesta a un autobús escolar no
    está obligado a detenerse.
- id: 43
  category: driver_testing
  question: Al acercarse a un cruce de ferrocarril en Oklahoma, ¿a cuántos pies del
    riel más cercano debe detener su vehículo?
  choices:
    A: De 5 a 25 pies
    B: De 10 a 30 pies
    C: De 15 a 50 pies
    D: De 20 a 60 pies
  answer: C
  explanation: La ley de Oklahoma exige que los conductores se detengan entre 15 y
    50 pies del riel más cercano en un cruce de ferrocarril cuando las señales están
    activas.
- id: 44
  category: driver_testing
  question: En Oklahoma, ¿está prohibido estacionarse a menos de cuántos pies de un
    paso de peatones en una intersección?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: C
  explanation: Según el Manual del Conductor de Oklahoma, no se puede estacionar a
    menos de 20 pies de un paso de peatones en una intersección.
- id: 45
  category: driver_testing
  question: 'En Oklahoma, debe usar sus faros delanteros desde 1/2 hora después de
    la puesta del sol hasta 1/2 hora antes de la salida del sol, y en cualquier momento
    en que no pueda ver claramente durante al menos:'
  choices:
    A: 200 pies
    B: 500 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley de Oklahoma exige que los faros delanteros estén encendidos
    cuando la visibilidad es inferior a 1,000 pies debido a las condiciones climáticas
    o de luz.
- id: 46
  category: driver_testing
  question: En Oklahoma, ¿se considera que un conductor tiene un "DUI agravado" si
    su concentración de alcohol en sangre (BAC) es igual o superior a qué nivel?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La ley de Oklahoma define el DUI agravado como tener un BAC de 0.15%
    o superior, lo cual conlleva sanciones más severas que un DUI estándar.
- id: 47
  category: driver_testing
  question: Al rebasar una bicicleta que viaja en la misma dirección, ¿cuánto espacio
    como mínimo exige la ley de Oklahoma que dejen los automovilistas entre el vehículo
    y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de "Paso Seguro" (Safe Passage) de Oklahoma exige que los automovilistas
    dejen al menos 3 pies de espacio al adelantar a una bicicleta.
- id: 48
  category: driver_testing
  question: Si las señales de giro de su vehículo no funcionan, ¿cuál es la señal
    manual correcta para indicar un giro a la izquierda?
  choices:
    A: Brazo extendido recto hacia afuera de la ventana
    B: Brazo extendido hacia arriba
    C: Brazo extendido hacia abajo
    D: Brazo moviéndose en movimiento circular
  answer: A
  explanation: La señal manual estándar para un giro a la izquierda es el brazo izquierdo
    extendido recto hacia afuera de la ventana.
- id: 49
  category: driver_testing
  question: El Manual del Conductor de Oklahoma recomienda mantener una distancia
    de seguimiento de al menos ¿cuántos segundos detrás del vehículo que va delante
    de usted?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: Oklahoma recomienda la "regla de los tres segundos" para una distancia
    de seguimiento segura en condiciones normales de conducción.
- id: 50
  category: driver_testing
  question: Según el Manual del Conductor de Oklahoma, ¿a qué velocidad pueden sus
    neumáticos comenzar a perder todo contacto con la carretera durante una lluvia
    intensa (hidroplaneo)?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: El manual establece que, si bien el hidroplaneo (hydroplaning) puede
    comenzar a las 35 mph, los neumáticos pueden perder todo contacto con la carretera
    a las 50 mph.
- id: 51
  category: driver_testing
  question: ¿Según la ley de Oklahoma, quién está obligado a usar el cinturón de seguridad
    en un vehículo de pasajeros?
  choices:
    A: Solo el conductor
    B: Solo el conductor y los pasajeros del asiento delantero
    C: Solo los pasajeros menores de 18 años
    D: Todas las personas en el asiento delantero y los niños menores de 13 años en
      cualquier asiento
  answer: B
  explanation: 'La ley de Oklahoma exige que el conductor y todos los pasajeros del
    asiento delantero usen el cinturón de seguridad. (Nota: Las leyes de retención
    infantil se aplican por separado a los pasajeros del asiento trasero).'
- id: 52
  category: driver_testing
  question: En Oklahoma, ¿es legal girar a la izquierda con el semáforo en rojo?
  choices:
    A: No, nunca
    B: Sí, pero solo desde una calle de un solo sentido hacia otra calle de un solo
      sentido
    C: Sí, después de detenerse por completo en cualquier intersección
    D: Sí, pero solo entre la medianoche y las 5:00 AM
  answer: B
  explanation: En Oklahoma, se puede girar a la izquierda en rojo solo cuando se gira
    desde una calle de un solo sentido hacia otra calle de un solo sentido, después
    de detenerse y ceder el paso al tráfico.
- id: 53
  category: driver_testing
  question: Durante el examen de habilidades de conducción de Oklahoma, ¿cuál de las
    siguientes acciones resultará en una reprobación inmediata?
  choices:
    A: No usar la luz de giro una vez
    B: Golpear un bordillo (curva) al estacionar en paralelo
    C: Una colisión o 'acción peligrosa' que requiera la intervención del examinador
    D: Conducir a 2 mph por debajo del límite de velocidad
  answer: C
  explanation: Cualquier acción que resulte en una colisión, o una maniobra peligrosa
    en la que el examinador deba tomar el control del vehículo, resulta en la reprobación
    inmediata del examen práctico.
- id: 54
  category: driver_responsibility
  question: Cuando vende un vehículo en Oklahoma, ¿qué debe hacer con la placa (matrícula)?
  choices:
    A: Dejarla en el vehículo para el nuevo propietario
    B: Destruirla inmediatamente
    C: Conservar la placa y transferirla a otro vehículo o entregarla
    D: Enviarla por correo a la persona a quien le compró el auto
  answer: C
  explanation: Oklahoma sigue un sistema de 'Placa al Propietario'. Cuando se vende
    un vehículo, la placa permanece con el propietario, no con el vehículo.
- id: 55
  category: driver_responsibility
  question: Los nuevos residentes que se mudan a Oklahoma deben registrar su vehículo
    dentro de ¿cuántos días después de establecer su residencia?
  choices:
    A: 10 días
    B: 15 días
    C: 30 días
    D: 60 días
  answer: C
  explanation: La ley de Oklahoma exige que los nuevos residentes registren sus vehículos
    y obtengan un título de Oklahoma dentro de los 30 días posteriores al establecimiento
    de su residencia.
- id: 56
  category: driver_responsibility
  question: Según el Sistema de Puntos de Oklahoma, ¿cuántos puntos se asignan a su
    historial de conducción por una condena de 'Conducción temeraria' (Reckless Driving)?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: La conducción temeraria se considera una infracción grave en Oklahoma
    y resulta en la adición de 4 puntos al historial del conductor.
- id: 57
  category: driver_responsibility
  question: En Oklahoma, ¿cuántos puntos se agregan a su historial de conducción por
    una condena de exceso de velocidad de más de 25 mph sobre el límite establecido?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Si bien el exceso de velocidad estándar generalmente resulta en 2 puntos,
    el exceso de velocidad de más de 25 mph sobre el límite resulta en 3 puntos en
    un historial de conducción de Oklahoma.
- id: 58
  category: driver_responsibility
  question: Si es condenado por no detenerse ante un autobús escolar con luces rojas
    intermitentes y el brazo de parada extendido, ¿cuántos puntos se agregarán a su
    historial de conducción de Oklahoma?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: No detenerse ante un autobús escolar es una infracción mayor en Oklahoma
    y conlleva una penalización de 4 puntos.
- id: 59
  category: driver_responsibility
  question: ¿Cuántos puntos se asignan por una condena de 'Seguir demasiado de cerca'
    (tailgating) en el estado de Oklahoma?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Seguir demasiado de cerca es una infracción de 2 puntos según el sistema
    de puntos del Departamento de Seguridad Pública de Oklahoma.
- id: 60
  category: driver_responsibility
  question: Si su licencia de conducir de Oklahoma es suspendida por no presentar
    prueba de seguro, ¿cuál es la tarifa legal de restablecimiento que debe pagar?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: Para restablecer una licencia suspendida bajo la Ley de Seguro Obligatorio,
    el conductor debe proporcionar prueba de seguro vigente y pagar una tarifa de
    restablecimiento de $100.
- id: 61
  category: driver_responsibility
  question: La Ley de Seguro Obligatorio de Oklahoma exige que todo propietario de
    un vehículo motorizado mantenga un seguro de responsabilidad civil. ¿Cuál es la
    cobertura mínima requerida por lesiones corporales o muerte de UNA persona en
    cualquier accidente?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El requisito legal mínimo por lesiones corporales a una persona en
    Oklahoma es de $25,000.
- id: 62
  category: driver_responsibility
  question: ¿Cuál de las siguientes es una forma aceptable de presentar su formulario
    de Verificación de Seguridad de Oklahoma a un oficial de la ley?
  choices:
    A: Solo una copia en papel
    B: Una imagen mostrada en un teléfono celular o dispositivo electrónico
    C: Una declaración verbal del número de póliza
    D: Una nota escrita a mano de su agente de seguros
  answer: B
  explanation: La ley de Oklahoma permite a los conductores presentar el comprobante
    de seguro en formato impreso o electrónico, incluso en un teléfono inteligente.
- id: 63
  category: driver_responsibility
  question: En Oklahoma, ¿cuántos puntos se asignan por "Conducción desatenta" (Inattentive
    Driving)?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: La conducción desatenta es una infracción de 2 puntos en el sistema
    de puntos de Oklahoma.
- id: 64
  category: driver_responsibility
  question: Si se le condena por "No ceder el derecho de paso" (Failure to yield the
    right-of-way) en Oklahoma, ¿cuántos puntos se añaden a su registro?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: No ceder el paso resulta en la adición de 2 puntos a su registro de
    conducir en Oklahoma.
- id: 65
  category: driver_responsibility
  question: Según la ley de Oklahoma, ¿quién es responsable de asegurar que el formulario
    de Verificación de Seguridad esté en el vehículo y sea válido?
  choices:
    A: Solo el propietario registrado
    B: Solo el conductor
    C: Tanto el propietario como el conductor
    D: La compañía de seguros
  answer: C
  explanation: La ley de Oklahoma establece que tanto el propietario como el conductor
    tienen la responsabilidad de asegurar que el vehículo esté asegurado y que el
    comprobante de seguro esté en el vehículo.
- id: 66
  category: driver_responsibility
  question: ¿Cuál es el valor en puntos por una condena de "Conducir a la izquierda
    del centro" (Left of center) o "Sentido contrario en una calle de un solo sentido"
    (Wrong way on a one-way street) en Oklahoma?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Conducir por el lado equivocado de la carretera o en sentido contrario
    en una calle de un solo sentido resulta en 2 puntos en Oklahoma.
- id: 67
  category: driver_responsibility
  question: 'Si usted está involucrado en una colisión en Oklahoma, se le requiere
    mostrar su formulario de Verificación de Seguridad a:'
  choices:
    A: Solo a los oficiales de la ley
    B: Solo a los otros conductores involucrados en la colisión
    C: A la policía y a cualquier persona o representante de cualquier persona lesionada
      o cuya propiedad haya sido dañada
    D: A nadie, a menos que se le entregue una multa
  answer: C
  explanation: La ley de Oklahoma le exige mostrar el comprobante de seguro a la policía
    y a cualquier otra parte involucrada en el accidente.
- id: 68
  category: driver_responsibility
  question: En Oklahoma, ¿cuál es la multa máxima por una condena por primera vez
    de conducir sin una verificación de seguridad válida (comprobante de seguro)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Según la ley de Oklahoma, no portar un seguro válido puede resultar
    en una multa de hasta $250, 30 días de cárcel, o ambos, así como la suspensión
    de los privilegios de conducir.
- id: 69
  category: driver_responsibility
  question: Al comprar un vehículo nuevo o usado en Oklahoma, ¿cuántos días tiene
    para transferir el título y registrar el vehículo?
  choices:
    A: 10 días
    B: 20 días
    C: 30 días
    D: 45 días
  answer: C
  explanation: La ley de Oklahoma exige que el título de un vehículo se transfiera
    y el vehículo se registre dentro de los 30 días posteriores a la fecha de compra
    para evitar penalizaciones.
- id: 70
  category: driver_responsibility
  question: Si usted está involucrado en una colisión en Oklahoma que resulte en lesiones
    o muerte, y un oficial de policía no investiga, ¿dentro de cuántos días debe presentar
    un informe por escrito?
  choices:
    A: 24 horas
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: Si una colisión no es investigada por un oficial y resulta en lesiones,
    muerte o daños a la propiedad superiores a $500, se debe presentar un informe
    ante Service Oklahoma dentro de los 10 días.
- id: 71
  category: driver_responsibility
  question: ¿En Oklahoma, cuántos puntos se añaden a su historial de conducción por
    la infracción de 'Seguir demasiado de cerca'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Seguir demasiado de cerca (tailgating) resulta en la adición de 2 puntos
    al historial de conducción de Oklahoma.
- id: 72
  category: driver_responsibility
  question: ¿Cuál de los siguientes NO es un requisito para un Formulario de Verificación
    de Seguridad (comprobante de seguro) válido de Oklahoma?
  choices:
    A: El año, marca y VIN del vehículo
    B: El número de la póliza de seguro
    C: El nombre y la dirección de la compañía de seguros
    D: El número de seguro social del conductor
  answer: D
  explanation: Un formulario de verificación de seguridad debe incluir los detalles
    del vehículo, el número de póliza y la información de la compañía, pero no requiere
    el número de seguro social del conductor.
- id: 73
  category: driver_responsibility
  question: 'Para una primera condena por DUI (no bajo la ley de Tolerancia Cero)
    en Oklahoma, un conductor adulto puede enfrentar una pena de cárcel de:'
  choices:
    A: No menos de 10 días ni más de 1 año
    B: Exactamente 48 horas
    C: Sin tiempo de cárcel, solo una multa
    D: Mínimo de 30 días
  answer: A
  explanation: Una primera condena por DUI para un adulto en Oklahoma es un delito
    menor y conlleva una posible sentencia de cárcel de 10 días a 1 año.
- id: 74
  category: driver_responsibility
  question: 'En Oklahoma, la ley de ''Control Físico Real'' (APC) significa que:'
  choices:
    A: Solo puede ser arrestado por DUI si el vehículo está en movimiento
    B: Puede ser arrestado por DUI incluso si el vehículo está estacionado y el motor
      apagado si usted está intoxicado y en el asiento del conductor
    C: Usted solo es responsable del vehículo si es el dueño
    D: Debe tener las manos en el volante en todo momento
  answer: B
  explanation: Las leyes de APC permiten un arresto por DUI si una persona intoxicada
    está en posición de operar el vehículo (por ejemplo, sentada en el asiento del
    conductor con las llaves), incluso si el vehículo no está en movimiento.
- id: 75
  category: driver_responsibility
  question: Bajo el sistema de puntos de Oklahoma, ¿cuántos puntos se añaden a su
    historial por 'No ceder el paso'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: No ceder el derecho de paso resulta en la adición de 2 puntos al historial
    de un conductor de Oklahoma.
- id: 76
  category: driver_responsibility
  question: 'Oklahoma es miembro del ''Driver License Compact'' (Pacto de Licencias
    de Conducir). Esto significa que:'
  choices:
    A: Su licencia es válida en los 50 estados
    B: Las infracciones de tráfico cometidas en otros estados miembros serán reportadas
      a Oklahoma y registradas en su historial de conducción
    C: No necesita seguro al conducir en otros estados
    D: Puede tener múltiples licencias de diferentes estados
  answer: B
  explanation: El Driver License Compact es un acuerdo entre estados para compartir
    información sobre condenas de tráfico y suspensiones de licencias de no residentes.
- id: 77
  category: driver_responsibility
  question: En Oklahoma, ¿dónde debe exhibirse la placa (matrícula) en un vehículo
    de pasajeros estándar?
  choices:
    A: Solo en el parachoques delantero
    B: Solo en la parte trasera del vehículo
    C: Tanto en el parachoques delantero como en el trasero
    D: En la ventana trasera
  answer: B
  explanation: La ley de Oklahoma exige que la placa esté fijada de forma segura en
    la parte trasera del vehículo (excepto en el caso de ciertos camiones tractores).
- id: 78
  category: driver_responsibility
  question: 'En Oklahoma, el seguro de responsabilidad civil (liability insurance)
    está diseñado para pagar:'
  choices:
    A: Daños a su propio vehículo independientemente de la culpa
    B: Gastos médicos solo para usted y sus pasajeros
    C: Lesiones y daños a la propiedad que usted cause a otros en un accidente
    D: Robo o vandalismo de su vehículo
  answer: C
  explanation: La Ley de Seguro Obligatorio de Oklahoma exige un seguro de responsabilidad
    civil para garantizar que usted pueda pagar los daños o lesiones que cause a otras
    personas en una colisión.
- id: 79
  category: safe_driving_rules
  question: Al estacionar su vehículo en paralelo a una acera en Oklahoma, ¿a cuántas
    pulgadas de la acera deben estar las ruedas?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas
  answer: C
  explanation: La ley de Oklahoma exige que, al estacionar en paralelo, las ruedas
    del lado derecho de su vehículo deben estar a menos de 18 pulgadas de la acera.
- id: 80
  category: safe_driving_rules
  question: En Oklahoma, ¿es ilegal estacionar a menos de cuántos pies de un hidrante
    de incendios?
  choices:
    A: 10 pies
    B: 15 pies
    C: 20 pies
    D: 25 pies
  answer: B
  explanation: Según la ley de Oklahoma, se prohíbe estacionar a menos de 15 pies
    de un hidrante de incendios.
- id: 81
  category: safe_driving_rules
  question: Al estacionar cerca de una señal de alto, una baliza intermitente o una
    señal de control de tráfico, ¿cuál es la distancia mínima que debe mantener?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: En Oklahoma, no puede estacionar a menos de 30 pies de cualquier baliza
    intermitente, señal de alto o señal de control de tráfico ubicada al costado de
    una calzada.
- id: 82
  category: safe_driving_rules
  question: Según la ley de Oklahoma, ¿a cuántos pies de un vehículo que viene en
    sentido contrario debe bajar las luces altas de sus faros?
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: El Manual del Conductor de Oklahoma establece que debe usar luces bajas
    cuando se acerque a un vehículo en sentido contrario a menos de 500 pies.
- id: 83
  category: safe_driving_rules
  question: En Oklahoma, ¿cuál es la distancia de seguimiento recomendada detrás del
    vehículo que va delante de usted en condiciones ideales?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: 3 segundos
    D: 5 segundos
  answer: C
  explanation: El Manual del Conductor de Oklahoma recomienda utilizar la "regla de
    los tres segundos" para mantener una distancia de seguimiento segura en condiciones
    normales de conducción.
- id: 84
  category: safe_driving_rules
  question: ¿A qué velocidad suele comenzar el hidroplaneo (hydroplaning) en carreteras
    mojadas en Oklahoma?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: En Oklahoma, el hidroplaneo (donde los neumáticos pierden contacto
    con la carretera y se deslizan sobre una capa de agua) puede comenzar a velocidades
    tan bajas como 35 mph.
- id: 85
  category: safe_driving_rules
  question: En Oklahoma, ¿es ilegal rebasar a otro vehículo cuando se encuentra a
    cuántos pies de una intersección o un cruce de ferrocarril?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 300 pies
  answer: B
  explanation: La ley de Oklahoma prohíbe rebasar cuando se encuentra a menos de 100
    pies de una intersección, cruce de ferrocarril, puente, viaducto o túnel.
- id: 86
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad máximo para un autobús escolar en una
    carretera de Oklahoma, a menos que se indique lo contrario?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: En Oklahoma, el límite de velocidad máximo para los autobuses escolares
    es de 55 mph en las carreteras, a menos que se indique un límite inferior.
- id: 87
  category: safe_driving_rules
  question: En Oklahoma, ¿cuál es la sanción por una primera condena por no detenerse
    ante un autobús escolar que está cargando o descargando niños?
  choices:
    A: Una multa de $100
    B: Una multa de al menos $100 y hasta $500
    C: Sentencia automática de 1 año de cárcel
    D: Sin multa, solo una advertencia
  answer: B
  explanation: No detenerse ante un autobús escolar en Oklahoma resulta en una multa
    de no menos de $100 y no más de $500 por la primera infracción.
- id: 88
  category: safe_driving_rules
  question: Si conduce por una carretera dividida de cuatro carriles y un autobús
    escolar se detiene en el lado opuesto de la mediana con sus luces rojas intermitentes,
    ¿es necesario detenerse?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no es necesario detenerse si hay una barrera física o mediana
    C: Sí, pero solo si hay niños cruzando
    D: No, pero debe tocar la bocina
  answer: B
  explanation: En Oklahoma, no es necesario detenerse ante un autobús escolar si viaja
    en la dirección opuesta en una carretera dividida por una mediana o barrera física.
- id: 89
  category: safe_driving_rules
  question: Según la ley de Oklahoma, ¿cuándo se le permite girar a la izquierda con
    semáforo en rojo?
  choices:
    A: Nunca
    B: Al girar desde una calle de un solo sentido hacia otra calle de un solo sentido
    C: Al girar desde una calle de doble sentido hacia una calle de un solo sentido
    D: Solo entre las doce de la noche y las 5:00 AM
  answer: B
  explanation: La ley de Oklahoma permite girar a la izquierda en rojo solo cuando
    se gira desde una calle de un solo sentido hacia otra calle de un solo sentido,
    después de detenerse por completo y ceder el paso al tráfico y a los peatones.
- id: 90
  category: safe_driving_rules
  question: En Oklahoma, ¿cuál es la distancia mínima a la que debe estacionar de
    un cruce de ferrocarril?
  choices:
    A: 15 pies
    B: 25 pies
    C: 50 pies
    D: 100 pies
  answer: C
  explanation: Según el Manual del Conductor de Oklahoma, no puede estacionar a menos
    de 50 pies del riel más cercano de un cruce de ferrocarril.
- id: 91
  category: safe_driving_rules
  question: ¿Bajo la ley de Oklahoma, un giro a la izquierda en luz roja solo se permite
    bajo cuál de las siguientes circunstancias?
  choices:
    A: Al girar desde una calle de doble sentido hacia una calle de sentido único
    B: Al girar desde una calle de sentido único hacia otra calle de sentido único
    C: En cualquier intersección después de detenerse por completo
    D: Los giros a la izquierda en rojo nunca se permiten en Oklahoma
  answer: B
  explanation: En Oklahoma, solo puede girar a la izquierda en luz roja si está girando
    desde una calle de sentido único hacia otra calle de sentido único, después de
    detenerse y ceder el paso al tráfico y a los peatones.
- id: 92
  category: safe_driving_rules
  question: Al rebasar una bicicleta que viaja en la misma dirección en Oklahoma,
    ¿cuál es la distancia mínima de seguridad que un automovilista debe mantener entre
    el vehículo y la bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 5 pies
    D: 10 pies
  answer: B
  explanation: La ley de Oklahoma (HB 2453) exige que los automovilistas dejen al
    menos 3 pies de espacio al rebasar una bicicleta.
- id: 93
  category: safe_driving_rules
  question: En una carretera con al menos dos carriles de tráfico en cada dirección
    separados por una mediana o barrera física, ¿quién debe detenerse ante un autobús
    escolar con luces rojas intermitentes y un brazo de parada extendido?
  choices:
    A: El tráfico en ambas direcciones debe detenerse
    B: Solo el tráfico que sigue al autobús debe detenerse
    C: Solo el tráfico que se aproxima por el frente debe detenerse
    D: Nadie está obligado a detenerse si hay cuatro o más carriles
  answer: B
  explanation: En Oklahoma, si una carretera está dividida por una mediana o barrera,
    solo el tráfico que sigue al autobús está obligado a detenerse. El tráfico que
    viaja en la dirección opuesta puede proceder con precaución.
- id: 94
  category: safe_driving_rules
  question: En Oklahoma, ¿qué sucede con las multas por exceso de velocidad en una
    zona de mantenimiento o construcción designada cuando hay trabajadores presentes?
  choices:
    A: Las multas aumentan en $100
    B: Las multas se duplican
    C: Las multas se triplican
    D: Las multas siguen siendo las mismas pero los puntos se duplican
  answer: B
  explanation: La ley de Oklahoma ordena que las multas por infracciones de tráfico
    en zonas de obras se dupliquen cuando hay trabajadores presentes.
- id: 95
  category: safe_driving_rules
  question: ¿A cuántos pies de una señal de alto, baliza intermitente o señal de control
    de tráfico no debe estacionar su vehículo?
  choices:
    A: 15 pies
    B: 20 pies
    C: 30 pies
    D: 50 pies
  answer: C
  explanation: La ley de Oklahoma prohíbe estacionar a menos de 30 pies de cualquier
    baliza intermitente, señal de alto o señal de control de tráfico ubicada al costado
    de una calzada.
- id: 96
  category: safe_driving_rules
  question: 'Para mantener una distancia de seguimiento segura bajo condiciones normales
    de conducción en Oklahoma, debe usar la:'
  choices:
    A: Regla de un largo de vehículo
    B: Regla de los dos segundos
    C: Regla de los tres segundos
    D: Regla de los cuatro segundos
  answer: C
  explanation: El Manual del Conductor de Oklahoma recomienda la 'regla de los tres
    segundos' para mantener una distancia de seguimiento segura detrás del vehículo
    que está delante de usted.
- id: 97
  category: safe_driving_rules
  question: 'La ley ''Move Over'' de Oklahoma exige que los automovilistas que se
    aproximen a un vehículo de emergencia estacionario con luces intermitentes:'
  choices:
    A: Se detengan inmediatamente en el carril de circulación
    B: Mantengan la velocidad pero toquen la bocina para alertar a los trabajadores
      de emergencia
    C: Se muevan al carril izquierdo si es posible, o reduzcan la velocidad a una
      velocidad segura si no es posible cambiar de carril
    D: Aceleren para pasar la escena lo más rápido posible
  answer: C
  explanation: La ley Move Over de Oklahoma exige que los conductores se muevan a
    un carril no adyacente en carreteras de varios carriles o reduzcan la velocidad
    significativamente si no pueden cambiar de carril de manera segura al pasar vehículos
    de emergencia o mantenimiento estacionarios.
- id: 98
  category: safe_driving_rules
  question: Al prepararse para girar, la ley de Oklahoma exige que señalice su intención
    de girar al menos ¿a cuántos pies antes del giro?
  choices:
    A: 50 pies
    B: 100 pies
    C: 150 pies
    D: 200 pies
  answer: B
  explanation: Debe dar una señal de giro continua durante al menos 100 pies antes
    de girar o cambiar de carril.
- id: 99
  category: safe_driving_rules
  question: 'Al estacionar su vehículo cuesta arriba en una calle de doble sentido
    con bordillo, debe girar sus ruedas delanteras:'
  choices:
    A: Hacia el bordillo
    B: Lejos del bordillo
    C: Paralelas al bordillo
    D: Hacia la derecha
  answer: B
  explanation: Al estacionar cuesta arriba contra un bordillo, gire las ruedas lejos
    del bordillo (hacia la izquierda) para que, si el automóvil rueda, la parte trasera
    de la llanta delantera golpee el bordillo y detenga el vehículo.
- id: 100
  category: defensive_driving
  question: Según el Manual del Conductor de Oklahoma, ¿cuál es la distancia de seguimiento
    recomendada para la mayoría de las condiciones de conducción para evitar una colisión
    por alcance?
  choices:
    A: El largo de un vehículo por cada 10 mph
    B: Dos segundos
    C: Tres segundos
    D: Cuatro segundos
  answer: C
  explanation: Oklahoma recomienda una 'regla de tres segundos' para la distancia
    de seguimiento en condiciones normales. Debe aumentar esta distancia durante el
    mal tiempo o a velocidades más altas.
- id: 101
  category: defensive_driving
  question: Para practicar la conducción defensiva, ¿con cuánta antelación debe observar
    la carretera en busca de posibles peligros tanto en la ciudad como en la autopista?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 30 segundos
  answer: C
  explanation: Las pautas de conducción de Oklahoma sugieren mirar con 15 segundos
    de antelación. En la ciudad, esto equivale aproximadamente a una cuadra; en la
    autopista, es aproximadamente un cuarto de milla.
- id: 102
  category: defensive_driving
  question: En Oklahoma, ¿a qué velocidad puede comenzar el hidroplaneo (cuando los
    neumáticos pierden contacto con la carretera y se deslizan sobre una fina capa
    de agua)?
  choices:
    A: A tan solo 35 mph
    B: Al menos a 45 mph
    C: Solo por encima de 55 mph
    D: Solo durante tormentas eléctricas intensas
  answer: A
  explanation: El hidroplaneo puede comenzar a velocidades tan bajas como 35 mph.
    Bajo una lluvia intensa, sus neumáticos pueden perder todo contacto con la carretera
    a 55 mph.
- id: 103
  category: defensive_driving
  question: 'La ley de Oklahoma exige que encienda los faros delanteros siempre que
    utilice los limpiaparabrisas debido a las condiciones climáticas y siempre que
    la visibilidad sea inferior a:'
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley estatal exige que los faros estén encendidos cuando la visibilidad
    sea inferior a 1,000 pies y cuando se utilicen los limpiaparabrisas debido a la
    lluvia, la nieve o el aguanieve.
- id: 104
  category: defensive_driving
  question: Al conducir con niebla densa en Oklahoma, ¿qué ajuste de los faros delanteros
    debe utilizar para mantener la mejor visibilidad?
  choices:
    A: Luces altas (High beams)
    B: Luces bajas (Low beams)
    C: Solo luces de estacionamiento
    D: Luces de emergencia (Hazard lights)
  answer: B
  explanation: Se deben utilizar las luces bajas en caso de niebla. Las luces altas
    se reflejan en la humedad del aire, lo que provoca deslumbramiento y dificulta
    la visión.
- id: 105
  category: defensive_driving
  question: 'Según el Manual del Conductor de Oklahoma, si su vehículo comienza a
    derrapar en una carretera resbaladiza, usted debe:'
  choices:
    A: Frenar a fondo inmediatamente
    B: Girar el volante en la dirección opuesta al derrape
    C: Quitar el pie del acelerador y girar el volante en la dirección en la que se
      desliza la parte trasera del coche
    D: Poner el coche en punto muerto (neutral) y apagar el motor
  answer: C
  explanation: Para recuperarse de un derrape, quite el pie del acelerador y gire
    el volante en la dirección en la que la parte trasera del vehículo esté derrapando.
    No pise los frenos bruscamente.
- id: 106
  category: defensive_driving
  question: ¿En qué periodo de tiempo debe encender los faros delanteros en Oklahoma?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: Desde una hora después de la puesta del sol hasta una hora antes de la salida
      del sol
    C: Desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la
      salida del sol
    D: Solo cuando esté completamente oscuro
  answer: C
  explanation: La ley de Oklahoma exige que los faros se enciendan desde 30 minutos
    después de la puesta del sol hasta 30 minutos antes de la salida del sol.
- id: 107
  category: defensive_driving
  question: Cuando un autobús escolar se detiene en una autopista dividida con una
    mediana o barrera física, ¿qué vehículos están obligados a detenerse ante sus
    luces rojas intermitentes y el brazo de parada extendido?
  choices:
    A: Solo el tráfico que sigue al autobús
    B: Solo el tráfico que se aproxima por delante
    C: El tráfico en ambas direcciones
    D: No se requiere que ningún vehículo se detenga en autopistas divididas
  answer: A
  explanation: En Oklahoma, si un autobús se encuentra en una autopista dividida con
    una mediana o barrera, solo el tráfico que sigue al autobús debe detenerse. El
    tráfico en el lado opuesto de la barrera no tiene que detenerse.
- id: 108
  category: defensive_driving
  question: Durante el clima frío y húmedo, ¿por qué los puentes y pasos elevados
    en Oklahoma son particularmente peligrosos?
  choices:
    A: Suelen ser más estrechos que el resto de la carretera
    B: Se congelan antes que el resto de la carretera
    C: Es más probable que tengan baches
    D: El límite de velocidad es más alto en los puentes
  answer: B
  explanation: Los puentes y pasos elevados se congelan antes que el resto de la carretera
    porque están expuestos al aire frío tanto por arriba como por abajo.
- id: 109
  category: defensive_driving
  question: Si los faros de luz alta de un vehículo que viene en sentido contrario
    le deslumbran por la noche, ¿hacia dónde debe mirar para evitar quedarse temporalmente
    cegado?
  choices:
    A: Directamente a los faros que se aproximan
    B: A la línea central de la carretera
    C: Hacia el borde derecho de la carretera o la línea blanca de niebla
    D: Cerrar los ojos por una fracción de segundo
  answer: C
  explanation: Para evitar ser deslumbrado por las luces altas, mire hacia el borde
    derecho de su carril o hacia la línea blanca (línea de niebla) hasta que el vehículo
    pase.
- id: 110
  category: defensive_driving
  question: En condiciones normales, ¿cuál es la distancia total aproximada de parada
    (incluyendo el tiempo de percepción y reacción) para un automóvil que viaja a
    55 mph?
  choices:
    A: 100 pies
    B: 200 pies
    C: 400 pies
    D: 550 pies
  answer: B
  explanation: Según el Manual del Conductor de Oklahoma, a 55 mph, la distancia total
    de parada es de unos 200 pies.
- id: 111
  category: defensive_driving
  question: ¿Al entrar en una autopista de Oklahoma (interestatal), cuál es el propósito
    principal del carril de aceleración?
  choices:
    A: Proporcionar un lugar para detenerse y esperar un espacio
    B: Permitirle alcanzar la velocidad del tráfico de la autopista
    C: Darle un lugar para rebasar a los vehículos más lentos
    D: Permitirle revisar su GPS de forma segura
  answer: B
  explanation: El carril de aceleración está diseñado para permitir que los conductores
    aumenten su velocidad para igualar el flujo del tráfico en la autopista antes
    de incorporarse.
- id: 112
  category: defensive_driving
  question: Para evitar frenar a último momento o la necesidad de girar repentinamente,
    ¿cuántos segundos hacia adelante deben mirar los conductores de Oklahoma como
    mínimo?
  choices:
    A: 5 segundos
    B: 10 segundos
    C: 15 segundos
    D: 20 segundos
  answer: C
  explanation: El Manual del Conductor de Oklahoma establece que debe escanear la
    carretera al menos 15 segundos hacia adelante para anticipar peligros y cambios
    en el tráfico.
- id: 113
  category: defensive_driving
  question: Si su vehículo comienza a derrapar en una carretera resbaladiza de Oklahoma,
    ¿cuál de las siguientes es la técnica correcta de conducción defensiva?
  choices:
    A: Pisar los frenos a fondo inmediatamente
    B: Girar el volante en la dirección en la que se desliza la parte trasera del
      automóvil
    C: Girar el volante en dirección opuesta al derrape
    D: Poner el automóvil en punto muerto (neutral) y apagar el motor
  answer: B
  explanation: Para recuperarse de un derrape, debe quitar el pie del acelerador y
    girar el volante en la dirección en la que se desliza la parte trasera del vehículo.
- id: 114
  category: defensive_driving
  question: Al conducir por las carreteras de Oklahoma durante condiciones adversas
    como lluvia, nieve o hielo, ¿cómo debe ajustar su distancia de seguimiento?
  choices:
    A: Mantener la distancia estándar de 3 segundos
    B: Disminuirla a 1 segundo para mantenerse cerca del vehículo de adelante
    C: Aumentarla a por lo menos 4 a 6 segundos o más
    D: La distancia de seguimiento no importa si tiene neumáticos de invierno
  answer: C
  explanation: En condiciones climáticas adversas o de mal estado de la carretera,
    debe aumentar su distancia de seguimiento para permitir más tiempo y espacio para
    frenar.
- id: 115
  category: defensive_driving
  question: 'Para revisar sus ''puntos ciegos'' antes de cambiar de carril en Oklahoma,
    usted debe:'
  choices:
    A: Revisar únicamente el espejo retrovisor
    B: Revisar únicamente los espejos laterales
    C: Girar la cabeza y mirar por encima del hombro en la dirección en la que planea
      moverse
    D: Encender las luces altas para ver si hay alguien allí
  answer: C
  explanation: Los espejos no muestran todo; debe girar la cabeza para revisar las
    áreas (puntos ciegos) que los espejos no pueden ver antes de cambiar de carril.
- id: 116
  category: defensive_driving
  question: 'Si su vehículo está equipado con un Sistema de Frenos Antibloqueo (ABS)
    y necesita detenerse rápidamente en una carretera mojada de Oklahoma, usted debe:'
  choices:
    A: Bombear los frenos rápidamente
    B: Aplicar una presión firme y constante al pedal del freno
    C: Tocar ligeramente los frenos
    D: Usar únicamente el freno de emergencia
  answer: B
  explanation: Con el ABS, debe aplicar una presión firme y constante. No bombee los
    frenos, ya que el sistema lo hace automáticamente para evitar que las ruedas se
    bloqueen.
- id: 117
  category: defensive_driving
  question: En Oklahoma, ¿cuándo debe detenerse ante un autobús escolar con luces
    rojas intermitentes y un brazo de parada extendido en una carretera de dos carriles?
  choices:
    A: Solo si está siguiendo al autobús
    B: Solo si hay niños cruzando en ese momento
    C: Los conductores que se aproximan desde ambas direcciones deben detenerse
    D: No es necesario detenerse si el límite de velocidad es superior a 45 mph
  answer: C
  explanation: En una carretera de dos carriles, el tráfico en ambas direcciones debe
    detenerse ante un autobús escolar con sus luces rojas intermitentes y el brazo
    de parada extendido.
- id: 118
  category: defensive_driving
  question: ¿Por qué las carreteras de Oklahoma son más resbaladizas durante los primeros
    minutos de una tormenta de lluvia?
  choices:
    A: Los neumáticos todavía están calientes por el pavimento seco
    B: La lluvia se mezcla con el aceite y el polvo en la superficie de la carretera
    C: La lluvia es más fría al comienzo de una tormenta
    D: El hidroplaneo (aquaplaning) solo ocurre en los primeros cinco minutos
  answer: B
  explanation: Cuando empieza a llover, el agua se mezcla con el aceite, la grasa
    y el polvo de la carretera, creando una película muy resbaladiza antes de que
    sea eliminada por el agua.
- id: 119
  category: alcohol_drugs_health
  question: En Oklahoma, ¿cuál es el límite legal de concentración de alcohol en sangre
    (BAC) para un conductor mayor de 21 años?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: Para conductores de 21 años o más, es ilegal conducir con un BAC de
    0.08% o superior en Oklahoma.
- id: 120
  category: alcohol_drugs_health
  question: ¿Cuál es la multa máxima por una primera condena por conducir bajo los
    efectos del alcohol o drogas (DUI) en Oklahoma (excluyendo costos y cargos judiciales)?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: Una primera condena por DUI en Oklahoma es un delito menor y puede
    resultar en una multa de hasta $1,000.
- id: 121
  category: alcohol_drugs_health
  question: ¿Una condena por primera ofensa de DUI en Oklahoma puede resultar en una
    pena de cárcel obligatoria de al menos cuántos días?
  choices:
    A: 2 días
    B: 5 días
    C: 10 días
    D: 30 días
  answer: C
  explanation: En Oklahoma, una condena por primera ofensa de DUI conlleva una posible
    sentencia de cárcel de 10 días a un año.
- id: 122
  category: alcohol_drugs_health
  question: 'En Oklahoma, la ley de "Control Físico Real" (APC, por sus siglas en
    inglés) significa que usted puede ser arrestado por un DUI incluso si:'
  choices:
    A: El vehículo no se está moviendo y el motor está apagado
    B: Usted está en el asiento del pasajero
    C: Usted está fuera del vehículo con las llaves en su bolsillo
    D: Usted se encuentra en una propiedad privada
  answer: A
  explanation: La ley APC de Oklahoma permite un arresto por DUI si una persona está
    en posición de operar el vehículo (como estar sentado en el asiento del conductor
    con las llaves accesibles) mientras está intoxicada, incluso si el vehículo está
    estacionado.
- id: 123
  category: alcohol_drugs_health
  question: 'Si un conductor de Oklahoma es condenado por un DUI mientras un niño
    menor de 18 años está en el vehículo, la ofensa se clasifica como:'
  choices:
    A: Un delito menor leve (petty misdemeanor)
    B: Un delito menor estándar (misdemeanor)
    C: Peligro para Menores (Child Endangerment), lo cual es un delito grave (felony)
    D: Una infracción de tráfico no penal
  answer: C
  explanation: Conducir bajo la influencia con un pasajero menor de edad en Oklahoma
    se considera Peligro para Menores (Child Endangerment), lo cual es un delito grave
    (felony) y conlleva sanciones significativamente más altas.
- id: 124
  category: alcohol_drugs_health
  question: Según el Manual del Conductor de Oklahoma, ¿qué es lo primero que se ve
    afectado por el consumo de alcohol?
  choices:
    A: La visión
    B: La coordinación muscular
    C: El juicio
    D: El equilibrio
  answer: C
  explanation: El juicio es la primera facultad que se ve afectada por el alcohol,
    lo que a menudo lleva a los conductores a creer que son capaces de conducir de
    manera segura cuando no lo son.
- id: 125
  category: alcohol_drugs_health
  question: En Oklahoma, si usted es menor de 21 años y se encuentra cualquier cantidad
    medible de alcohol en su sistema, ¿por cuánto tiempo se le revocará la licencia
    por una primera ofensa?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Bajo la ley de Tolerancia Cero de Oklahoma, una primera ofensa de DUI
    o APC para una persona menor de 21 años resulta en una revocación de la licencia
    por 6 meses.
- id: 126
  category: alcohol_drugs_health
  question: La ley de "Contenedor Abierto" (Open Container) de Oklahoma prohíbe ¿cuál
    de los siguientes?
  choices:
    A: Cualquier bebida alcohólica abierta en el área de pasajeros de un vehículo
    B: Alcohol en el maletero del vehículo
    C: Cerveza sin abrir en el asiento trasero
    D: Alcohol en una guantera cerrada con llave
  answer: A
  explanation: Es ilegal tener un contenedor abierto de una bebida alcohólica en el
    área de pasajeros de un vehículo motorizado en cualquier calle o carretera pública
    en Oklahoma.
- id: 127
  category: alcohol_drugs_health
  question: Si usted está tomando un medicamento recetado y este afecta su capacidad
    para conducir, ¿puede ser acusado de un DUI en Oklahoma?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, el DUI solo se aplica al alcohol
    C: Sí, si el medicamento lo hace incapaz de operar un vehículo motorizado de manera
      segura
    D: Solo si el medicamento es una sustancia controlada
  answer: C
  explanation: En Oklahoma, un cargo de DUI puede resultar del uso de cualquier sustancia
    (legal o ilegal, con receta o de venta libre) que haga que un conductor sea incapaz
    de operar un vehículo de manera segura.
- id: 128
  category: alcohol_drugs_health
  question: ¿Cuál es la única forma efectiva de reducir su concentración de alcohol
    en sangre (BAC) después de beber?
  choices:
    A: Beber café solo
    B: Tomar una ducha fría
    C: Hacer ejercicio vigoroso
    D: Permitir que pase el tiempo
  answer: D
  explanation: Solo el tiempo puede hacer que una persona recupere la sobriedad. El
    café, las duchas y el ejercicio no aceleran el proceso de eliminación del alcohol
    del torrente sanguíneo.
- id: 129
  category: alcohol_drugs_health
  question: 'Bajo la ley de Oklahoma, una persona que posee una licencia válida de
    paciente de marihuana medicinal:'
  choices:
    A: Puede conducir bajo la influencia de la marihuana
    B: Está exenta de las leyes de DUI por drogas
    C: Aún puede ser acusada de un DUI si sus facultades están afectadas mientras
      conduce
    D: Solo puede ser acusada de un DUI si también tiene alcohol en su sistema
  answer: C
  explanation: Tener una licencia de marihuana medicinal no otorga el derecho a conducir
    bajo los efectos de la misma. La ley de Oklahoma prohíbe conducir bajo la influencia
    de cualquier sustancia intoxicante, incluida la marihuana.
- id: 130
  category: alcohol_drugs_health
  question: 'En Oklahoma, si es condenado por una segunda ofensa de DUI dentro de
    un periodo de diez años, el delito se clasifica como:'
  choices:
    A: Un delito menor (misdemeanor)
    B: Un delito grave (felony)
    C: Una infracción civil
    D: Una ofensa que no conlleva arresto
  answer: B
  explanation: Una segunda condena por DUI dentro de un período de diez años en Oklahoma
    es un delito grave (felony).
- id: 131
  category: alcohol_drugs_health
  question: 'El Programa de Responsabilidad para Conductores con Facultades Alteradas
    (IDAP) de Oklahoma permite que ciertos conductores mantengan sus privilegios de
    conducir al:'
  choices:
    A: Pagar una multa doble
    B: Instalar un dispositivo de interbloqueo de encendido
    C: Asistir a un curso de seguridad de 4 horas
    D: Conducir solo durante las horas del día
  answer: B
  explanation: El programa IDAP es una alternativa a la revocación de la licencia
    que requiere que el participante instale y mantenga un dispositivo de interbloqueo
    de encendido en su vehículo.
- id: 132
  category: alcohol_drugs_health
  question: 'Si tiene una condición física o mental que pueda afectar su conducción
    (como la epilepsia), la ley de Oklahoma le exige:'
  choices:
    A: Entregar su licencia de inmediato
    B: Informar la condición a Service Oklahoma (anteriormente DPS)
    C: Conducir solo con un pasajero
    D: Esperar 5 años antes de solicitar una licencia
  answer: B
  explanation: Los conductores deben informar cualquier condición física o mental
    que pueda afectar su capacidad para conducir de manera segura a Service Oklahoma
    para una revisión médica.
- id: 133
  category: alcohol_drugs_health
  question: ¿Según la ley de Oklahoma, cuál es la sentencia máxima de cárcel por una
    primera condena por conducir bajo los efectos del alcohol o drogas (DUI)?
  choices:
    A: 30 días
    B: 90 días
    C: 6 meses
    D: 1 año
  answer: D
  explanation: Una primera condena por DUI en Oklahoma es un delito menor castigado
    con encarcelamiento en la cárcel por no menos de diez días ni más de un año.
- id: 134
  category: alcohol_drugs_health
  question: 'En Oklahoma, se aplica un cargo de "DUI Agravado" si la concentración
    de alcohol en sangre (BAC) del conductor es igual o superior a:'
  choices:
    A: 0.10%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: La ley de Oklahoma define el DUI Agravado como conducir con un BAC
    de 0.15% o superior. Esto conlleva sanciones adicionales, incluyendo el interbloqueo
    de encendido obligatorio y tratamiento.
- id: 135
  category: alcohol_drugs_health
  question: Según la ley de Tolerancia Cero de Oklahoma, ¿por cuánto tiempo se le
    revocará la licencia a un conductor menor de 21 años que sea sorprendido con cualquier
    cantidad medible de alcohol en su sistema por una primera infracción?
  choices:
    A: 30 días
    B: 60 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Para los conductores menores de 21 años, cualquier cantidad medible
    de alcohol resulta en una revocación inmediata de los privilegios de conducir
    por 6 meses por una primera infracción.
- id: 136
  category: alcohol_drugs_health
  question: En Oklahoma, si es un infractor por primera vez que se niega o no pasa
    una prueba de aliento, puede participar en el programa IDAP para seguir conduciendo.
    ¿Qué significan las siglas IDAP?
  choices:
    A: Plan de Asistencia para Conductores Intoxicados
    B: Programa de Responsabilidad para Conductores con Facultades Alteradas (Impaired
      Driver Accountability Program)
    C: Prohibición Inmediata de Alcohol para el Conductor
    D: Protocolo de Autoridad de Conducción Interestatal
  answer: B
  explanation: IDAP significa Programa de Responsabilidad para Conductores con Facultades
    Alteradas, el cual permite a los conductores mantener sus privilegios de conducir
    mediante la instalación de un dispositivo de interbloqueo de encendido.
- id: 137
  category: alcohol_drugs_health
  question: 'Para ser elegible para una licencia de conducir de Oklahoma, una persona
    con antecedentes de convulsiones generalmente debe estar libre de convulsiones
    por un período de:'
  choices:
    A: 3 meses
    B: 6 meses
    C: 1 año
    D: 2 años
  answer: B
  explanation: Los estándares médicos de Oklahoma generalmente requieren que una persona
    con un trastorno convulsivo esté libre de convulsiones durante 6 meses antes de
    que se le permita conducir.
- id: 138
  category: alcohol_drugs_health
  question: En Oklahoma, ¿puede ser arrestado por DUI si está bajo la influencia de
    un medicamento recetado legalmente?
  choices:
    A: No, siempre que tenga una receta válida
    B: No, el DUI solo se aplica al alcohol y las drogas ilegales
    C: Sí, si el medicamento lo incapacita para conducir un vehículo motorizado de
      manera segura
    D: Solo si también tiene alcohol en su sistema
  answer: C
  explanation: La ley de Oklahoma establece que es ilegal conducir bajo la influencia
    de cualquier sustancia embriagante, incluidos los medicamentos recetados o de
    venta libre, si estos lo incapacitan para operar un vehículo de manera segura.
- id: 139
  category: alcohol_drugs_health
  question: ¿Cuál es el efecto principal de mezclar alcohol con otras drogas, como
    tranquilizantes o antihistamínicos?
  choices:
    A: Los efectos del alcohol se cancelan
    B: Las drogas se vuelven menos potentes
    C: Los efectos se multiplican (efecto sinérgico)
    D: No hay cambios en el nivel de deterioro
  answer: C
  explanation: Mezclar alcohol con otras drogas puede producir un efecto sinérgico,
    lo que significa que el impacto combinado en el sistema nervioso central es mucho
    mayor que la suma de los efectos individuales.
- id: 140
  category: alcohol_drugs_health
  question: 'En Oklahoma, si usted está involucrado en una colisión y un oficial de
    la ley tiene motivos razonables para creer que conducía bajo la influencia, este
    puede:'
  choices:
    A: Evaluarlo solo si está consciente
    B: Requerir que se someta a una prueba de sangre o aliento bajo el Consentimiento
      Implícito
    C: Evaluarlo solo si hubo una fatalidad
    D: No evaluarlo sin una orden de registro
  answer: B
  explanation: Según la ley de Consentimiento Implícito de Oklahoma, se considera
    que cualquier persona que opera un vehículo motorizado ha dado su consentimiento
    para una prueba de sangre o aliento con el fin de determinar el contenido de alcohol
    o drogas.
- id: 141
  category: alcohol_drugs_health
  question: 'En Oklahoma, si es condenado por una primera infracción de DWI (conducir
    con facultades disminuidas), su licencia será revocada por:'
  choices:
    A: 10 días
    B: 30 días
    C: 6 meses
    D: 1 año
  answer: C
  explanation: Una primera infracción de DWI en Oklahoma resulta en la revocación
    de la licencia de conducir por un período de 6 meses.
- id: 142
  category: penalties_and_points
  question: Si su privilegio de conducir en Oklahoma es suspendido por primera vez
    debido a la acumulación de 10 o más puntos, ¿cuánto tiempo durará la suspensión?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: B
  explanation: La primera suspensión por acumulación de puntos en Oklahoma dura 1
    mes (30 días).
- id: 143
  category: penalties_and_points
  question: ¿Por cuánto tiempo se suspenderá su licencia si acumula 10 o más puntos
    por segunda vez en un período de cinco años en Oklahoma?
  choices:
    A: 3 meses
    B: 6 meses
    C: 12 meses
    D: 2 años
  answer: A
  explanation: Una segunda suspensión bajo el Sistema de Puntos de Oklahoma dentro
    de un periodo de cinco años resulta en una suspensión de 3 meses.
- id: 144
  category: penalties_and_points
  question: En Oklahoma, ¿cuál es la multa por no usar el cinturón de seguridad o
    por no exigir que un pasajero lo use?
  choices:
    A: ' $10'
    B: ' $20'
    C: ' $50'
    D: ' $100'
  answer: B
  explanation: La multa por una infracción del cinturón de seguridad en Oklahoma es
    de $20, lo cual incluye los costos de la corte.
- id: 145
  category: penalties_and_points
  question: Para conductores de 21 años de edad o más, ¿qué rango de concentración
    de alcohol en sangre (BAC) constituye conducir con facultades disminuidas (DWI)
    en Oklahoma?
  choices:
    A: 0.01% a 0.04%
    B: 0.05% a 0.07%
    C: 0.15% o más
  answer: B
  explanation: En Oklahoma, un BAC de 0.05% a 0.07% se considera conducir con facultades
    disminuidas (DWI) para adultos.
- id: 146
  category: penalties_and_points
  question: En Oklahoma, ¿cuál es la multa máxima por rebasar a un autobús escolar
    detenido que tiene sus luces rojas de carga parpadeando y el brazo de parada extendido?
  choices:
    A: ' $100'
    B: ' $250'
    C: ' $500'
    D: ' $1,000'
  answer: D
  explanation: Rebasar a un autobús escolar detenido con luces rojas parpadeando es
    una infracción peligrosa en Oklahoma, castigable con una multa de hasta $1,000.
- id: 147
  category: penalties_and_points
  question: En Oklahoma, las multas de tráfico se __________ cuando ocurre una infracción
    en una zona de mantenimiento o construcción mientras hay trabajadores presentes.
  choices:
    A: Triplican
    B: Duplican
    C: Aumentan en $100
    D: Reducen si el conductor coopera
  answer: B
  explanation: Para proteger a los trabajadores viales, la ley de Oklahoma exige que
    las multas de tráfico se dupliquen por infracciones que ocurran en zonas de obras
    cuando haya trabajadores presentes.
- id: 148
  category: penalties_and_points
  question: ¿Cuál de las siguientes condenas resultará en la revocación obligatoria
    de una licencia de conducir de Oklahoma?
  choices:
    A: No señalar un giro
    B: Homicidio involuntario u homicidio por negligencia resultante de la operación
      de un vehículo motorizado
    C: Exceso de velocidad de 10 mph sobre el límite
    D: Seguir demasiado de cerca
  answer: B
  explanation: La condena por homicidio involuntario u homicidio por negligencia que
    involucre un vehículo requiere que el Departamento de Seguridad Pública revoque
    la licencia de conducir.
- id: 149
  category: penalties_and_points
  question: 'Una condena por primera infracción de DUI (conducir bajo la influencia)
    en Oklahoma es un delito menor y puede resultar en una sentencia de cárcel de:'
  choices:
    A: 24 a 48 horas
    B: 10 días a 1 año
    C: 6 meses a 2 años
    D: 1 a 5 años
  answer: B
  explanation: Una primera condena por DUI en Oklahoma puede llevar a una sentencia
    de cárcel que oscila entre 10 días y 1 año.
- id: 150
  category: penalties_and_points
  question: Bajo el Sistema de Puntos de Oklahoma, ¿cuántos puntos se asignan por
    'Seguir demasiado de cerca'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Seguir demasiado de cerca (tailgating) es una infracción de 2 puntos
    en Oklahoma.
- id: 151
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de conducción de Oklahoma por
    no detenerse ante una señal de alto o un semáforo?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: No detenerse ante una señal de alto o un semáforo resulta en la adición
    de 2 puntos a su historial de conducción de Oklahoma.
- id: 152
  category: penalties_and_points
  question: Bajo el Sistema de Puntos de Oklahoma, ¿cuántos puntos se asignan por
    una condena de exceso de velocidad de 26 mph o más sobre el límite establecido?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: C
  explanation: Según el Manual del Conductor de Oklahoma, el exceso de velocidad de
    26 mph o más sobre el límite resulta en la adición de 3 puntos a su historial
    de conducción.
- id: 153
  category: penalties_and_points
  question: 'En Oklahoma, si su licencia es suspendida por segunda vez debido a la
    acumulación de puntos dentro de un período de cinco años, la suspensión durará:'
  choices:
    A: 1 mes
    B: 3 meses
    C: 6 meses
    D: 1 año
  answer: B
  explanation: Una segunda suspensión por acumulación de puntos en Oklahoma resulta
    en la pérdida de los privilegios de conducir por 3 meses.
- id: 154
  category: penalties_and_points
  question: 'Para una primera condena por DUI en Oklahoma (que no involucre lesiones
    o muerte), un conductor adulto enfrenta una multa máxima de:'
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: Una primera condena por DUI en Oklahoma es un delito menor y conlleva
    una multa de hasta $1,000.
- id: 155
  category: penalties_and_points
  question: ¿Cuál es la sentencia mínima de cárcel por una condena de DUI por primera
    vez en Oklahoma?
  choices:
    A: 24 horas
    B: 48 horas
    C: 5 días
    D: 10 días
  answer: D
  explanation: Una primera condena por DUI en Oklahoma conlleva una sentencia de cárcel
    de no menos de diez días y no más de un año.
- id: 156
  category: penalties_and_points
  question: ¿Cuál es la tarifa estándar para restablecer una licencia de conducir
    que fue suspendida únicamente por acumulación de puntos en Oklahoma?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: A
  explanation: El Manual del Conductor de Oklahoma establece que la tarifa de restablecimiento
    para una licencia suspendida por puntos es de $25.
- id: 157
  category: penalties_and_points
  question: 'Según la ley de Oklahoma, se considera que un conductor está legalmente
    intoxicado (DUI) si su concentración de alcohol en sangre (BAC) es de:'
  choices:
    A: 0.02% o superior
    B: 0.05% o superior
    C: 0.08% o superior
    D: 0.10% o superior
  answer: C
  explanation: Para conductores de 21 años o más, el límite legal para DUI en Oklahoma
    es un BAC de 0.08% o superior.
- id: 158
  category: penalties_and_points
  question: En Oklahoma, ¿cuántos puntos se asignan por una condena de 'No ceder el
    paso'?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: No ceder el paso es una infracción de 2 puntos en Oklahoma.
- id: 159
  category: sharing_the_road
  question: Bajo la ley 'Move Over' (Hacerse a un lado) de Oklahoma, ¿qué debe hacer
    al acercarse a un vehículo de emergencia estacionado con sus luces intermitentes
    activadas en una carretera con dos o más carriles en su dirección?
  choices:
    A: Mantener la velocidad pero tocar la bocina
    B: Moverse al carril más alejado del vehículo de emergencia si es seguro hacerlo
    C: Detenerse inmediatamente en su carril actual
    D: Acelerar para rebasar el vehículo rápidamente
  answer: B
  explanation: La ley de Oklahoma exige que los conductores se muevan al carril izquierdo
    (o al carril que no esté adyacente al vehículo de emergencia) en carreteras de
    varios carriles. Si cambiar de carril no es seguro, el conductor debe reducir
    la velocidad.
- id: 160
  category: sharing_the_road
  question: En Oklahoma, si conduce por una carretera dividida con una barrera física
    o mediana, ¿debe detenerse ante un autobús escolar que se encuentre en el lado
    opuesto de la mediana?
  choices:
    A: Sí, siempre debe detenerse ante un autobús escolar
    B: No, no es obligatorio detenerse
    C: Sí, pero solo si el conductor del autobús le hace una señal
    D: No, pero debe acelerar para despejar el área
  answer: B
  explanation: En una carretera dividida con una mediana o barrera física, el tráfico
    que viaja en la dirección opuesta a un autobús escolar no está obligado a detenerse
    en Oklahoma.
- id: 161
  category: sharing_the_road
  question: ¿Qué es la 'No-Zone' (Zona de No Visibilidad) en relación con los camiones
    grandes y autobuses en Oklahoma?
  choices:
    A: El área donde los camiones no tienen permitido conducir
    B: Los puntos ciegos alrededor de la parte delantera, trasera y laterales del
      camión
    C: La zona de velocidad restringida para vehículos comerciales
    D: El área de carga del camión
  answer: B
  explanation: La 'No-Zone' se refiere a los grandes puntos ciegos alrededor de un
    camión donde el conductor del camión no puede ver a otros vehículos. Si usted
    no puede ver la cara del conductor del camión en su espejo lateral, él no puede
    verlo a usted.
- id: 162
  category: sharing_the_road
  question: En Oklahoma, ¿qué debe hacer un conductor cuando un peatón cruza la calle
    guiado por un animal de servicio o lleva un bastón blanco (con o sin punta roja)?
  choices:
    A: Tocar la bocina para hacerles saber que usted está allí
    B: Reducir la velocidad y estar preparado para detenerse
    C: Detenerse por completo y tomar precauciones para evitar lesiones
    D: Conducir alrededor de ellos si hay suficiente espacio
  answer: C
  explanation: La ley de Oklahoma exige que los conductores tomen las precauciones
    necesarias y se detengan por completo para evitar lesiones a los peatones ciegos
    que utilizan un bastón blanco o un animal de servicio.
- id: 163
  category: sharing_the_road
  question: Según la ley de Oklahoma, ¿quién está obligado a usar casco mientras opera
    o viaja en una motocicleta?
  choices:
    A: Todos los motociclistas independientemente de su edad
    B: Solo el conductor, no el pasajero
    C: Los pasajeros y conductores menores de 18 años de edad
    D: Solo los conductores con menos de 2 años de experiencia
  answer: C
  explanation: En Oklahoma, el uso de cascos para motocicletas es obligatorio por
    ley para todos los conductores y pasajeros menores de 18 años.
- id: 164
  category: sharing_the_road
  question: Al seguir a un vehículo de emergencia que responde a una alarma en Oklahoma,
    ¿cuál es la distancia mínima legal de seguimiento?
  choices:
    A: 100 pies
    B: 200 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Oklahoma (47 OS § 11-1108) prohíbe a los conductores seguir
    a un camión de bomberos u otro vehículo de emergencia a una distancia menor de
    500 pies.
- id: 165
  category: sharing_the_road
  question: 'Cuando un camión grande gira a la derecha en una calle con dos carriles
    en cada dirección, el conductor puede necesitar:'
  choices:
    A: Mantenerse estrictamente en el carril derecho
    B: Abrirse ampliamente hacia la izquierda para completar el giro
    C: Detenerse y esperar a que todo el tráfico despeje la intersección
    D: Girar desde el carril izquierdo
  answer: B
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para realizar un giro a la derecha. Los conductores deben evitar 'quedar atrapados'
    entre el camión y la acera.
- id: 166
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es VERDADERA con respecto a los ciclistas
    en Oklahoma?
  choices:
    A: Deben circular por la acera en todo momento
    B: Tienen los mismos derechos y responsabilidades que los conductores de vehículos
      motorizados
    C: No se les permite circular por carreteras de dos carriles
    D: Siempre deben circular en sentido contrario al flujo del tráfico
  answer: B
  explanation: En Oklahoma, los ciclistas son considerados vehículos y tienen los
    mismos derechos de uso de la vía y las mismas responsabilidades de obedecer las
    leyes de tránsito que los automovilistas.
- id: 167
  category: sharing_the_road
  question: ¿Es legal en Oklahoma el 'lane splitting' (conducir una motocicleta entre
    carriles de autos detenidos o en movimiento)?
  choices:
    A: Sí, es legal a velocidades inferiores a 30 mph
    B: Sí, pero solo durante las horas pico
    C: No, es ilegal en Oklahoma
    D: Sí, si los autos están completamente detenidos
  answer: C
  explanation: El 'lane splitting' (división de carril) es ilegal en Oklahoma. Las
    motocicletas tienen derecho al uso total de un carril, y ningún vehículo motorizado
    debe conducirse de manera que prive a cualquier motocicleta del uso total de un
    carril.
- id: 168
  category: sharing_the_road
  question: 'En Oklahoma, cuando usted gira a la derecha con luz roja después de una
    parada completa, debe ceder el derecho de paso a:'
  choices:
    A: Solo a otros vehículos motorizados
    B: Solo a los peatones en el cruce peatonal
    C: Tanto a los peatones en el cruce peatonal como al tráfico que viene en sentido
      contrario girando a la izquierda
    D: A todos los peatones y a todo el tráfico que se mueve con la luz verde
  answer: D
  explanation: Antes de girar a la derecha en rojo, debe detenerse y ceder el paso
    a todos los peatones y a cualquier vehículo que se aproxime a la intersección
    desde la otra dirección.
- id: 169
  category: sharing_the_road
  question: 'Al seguir a un camión grande por la noche, debe bajar la intensidad de
    sus faros (usar luces bajas) porque:'
  choices:
    A: Los espejos del camión reflejarán la luz brillante hacia los ojos del conductor
    B: Los conductores de camiones tienen mejor visión nocturna
    C: Las luces altas pueden dañar la cinta reflectante del camión
    D: La ley exige usar solo las luces de estacionamiento al seguir camiones
  answer: A
  explanation: Las luces brillantes que se reflejan en los grandes espejos laterales
    de un camión pueden cegar al conductor. Siempre debe bajar la intensidad de sus
    luces al seguir a cualquier vehículo.
- id: 170
  category: sharing_the_road
  question: 'En Oklahoma, si es declarado culpable de rebasar a un autobús escolar
    detenido con sus luces rojas intermitentes, la multa por una primera infracción
    es de al menos:'
  choices:
    A: $50
    B: $100
    C: $250
    D: $1,000
  answer: B
  explanation: Según la ley de Oklahoma, la multa por una primera condena por no detenerse
    ante un autobús escolar es de un mínimo de $100.
- id: 171
  category: sharing_the_road
  question: La ley de Oklahoma de 'Hacerse a un lado' (Move Over) requiere que los
    automovilistas cambien de carril o reduzcan la velocidad al acercarse a ¿cuál
    de los siguientes vehículos detenidos en el acotamiento con luces intermitentes?
  choices:
    A: Solo vehículos de la policía y de bomberos
    B: Solo ambulancias y grúas
    C: Vehículos de emergencia, vehículos de mantenimiento y grúas autorizadas
    D: Solo vehículos con luces azules y rojas
  answer: C
  explanation: La ley de Oklahoma (47 O.S. § 11-314) exige que los conductores se
    cambien de carril o reduzcan la velocidad ante vehículos de emergencia, vehículos
    de mantenimiento y grúas que estén estacionados y muestren luces intermitentes.
- id: 172
  category: sharing_the_road
  question: Según la ley de Oklahoma, ¿qué motociclistas están obligados a usar casco
    de seguridad?
  choices:
    A: Todos los motociclistas, independientemente de su edad
    B: Solo el conductor, no el pasajero
    C: Conductores y pasajeros menores de 18 años de edad
    D: Solo los conductores con un permiso de aprendizaje
  answer: C
  explanation: En Oklahoma, el uso de casco es obligatorio por ley para cualquier
    persona menor de 18 años que opere o viaje en una motocicleta (47 O.S. § 12-609).
- id: 173
  category: sharing_the_road
  question: Al conducir cerca de camiones grandes, debe evitar la 'Zona-No' (No-Zone).
    ¿Dónde se encuentra el punto ciego más grande en un camión comercial?
  choices:
    A: Directamente frente a la cabina
    B: El lado izquierdo del remolque
    C: El lado derecho del remolque
    D: Directamente detrás del remolque
  answer: C
  explanation: El punto ciego más grande (No-Zone) para el conductor de un camión
    está en el lado derecho, extendiéndose desde la cabina hasta más allá de la longitud
    del remolque.
- id: 174
  category: sharing_the_road
  question: 'Cuando un vehículo de emergencia con sirenas y luces intermitentes se
    aproxima por detrás, la ley de Oklahoma le exige:'
  choices:
    A: Aumentar la velocidad para despejar el camino
    B: Detenerse inmediatamente en su carril
    C: Orillarse al borde derecho de la calzada y detenerse
    D: Pasar al carril izquierdo para dejar que pasen por la derecha
  answer: C
  explanation: Ante la aproximación de un vehículo de emergencia autorizado que utilice
    señales auditivas y visuales, los conductores deben ceder el paso e inmediatamente
    conducir a una posición paralela y lo más cerca posible del borde o acera derecha
    y detenerse (47 O.S. § 11-405).
- id: 175
  category: sharing_the_road
  question: En Oklahoma, ¿qué debe hacer un conductor al acercarse a un peatón que
    usa un bastón blanco o un perro guía?
  choices:
    A: Tocar la bocina para que sepan que usted está allí
    B: Ceder el derecho de paso y tomar precauciones para evitar lesiones
    C: Rodearlos si hay espacio suficiente
    D: Esperar a que ellos le hagan una señal para pasar
  answer: B
  explanation: La ley de Oklahoma (47 O.S. § 11-504) exige que los conductores cedan
    el derecho de paso a cualquier peatón total o parcialmente ciego que lleve un
    bastón blanco o utilice un perro guía.
- id: 176
  category: sharing_the_road
  question: ¿Cuál es la distancia de seguimiento recomendada al viajar detrás de una
    motocicleta en Oklahoma?
  choices:
    A: 1 segundo
    B: 2 segundos
    C: Al menos 3 a 4 segundos
    D: Exactamente 10 pies
  answer: C
  explanation: El Manual del Conductor de Oklahoma recomienda una distancia de seguimiento
    de al menos 3 a 4 segundos detrás de una motocicleta para permitirle al motociclista
    suficiente espacio para maniobrar y evitar una colisión en caso de que se caiga.
- id: 177
  category: sharing_the_road
  question: ¿Por qué es peligroso colocarse al lado de un camión grande que está señalizando
    un giro a la derecha en una intersección?
  choices:
    A: Los camiones a menudo necesitan abrirse hacia la izquierda para completar un
      giro a la derecha
    B: El camión podría rodar hacia atrás
    C: Las señales de giro del camión suelen ser engañosas
    D: El camión aumentará la velocidad durante el giro
  answer: A
  explanation: Los camiones grandes a menudo necesitan abrirse hacia la izquierda
    para dar una vuelta a la derecha. Si usted se coloca en el espacio entre el camión
    y la acera, puede quedar atrapado entre ambos (una maniobra de apretón o 'squeeze
    play').
- id: 178
  category: sharing_the_road
  question: 'La ley de Oklahoma exige que toda bicicleta utilizada durante la noche
    esté equipada con una lámpara en la parte delantera que emita una luz blanca visible
    desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: Según 47 O.S. § 12-702, una bicicleta utilizada de noche debe tener
    una lámpara delantera visible desde al menos 500 pies y un reflector o lámpara
    roja en la parte trasera visible desde 600 pies.
- id: 179
  category: sharing_the_road
  question: 'Un emblema naranja triangular en la parte trasera de un vehículo indica
    que el vehículo:'
  choices:
    A: Transporta materiales peligrosos
    B: Es un vehículo de movimiento lento que viaja a 25 mph o menos
    C: Es una carga de gran tamaño
    D: Es un conductor aprendiz
  answer: B
  explanation: El emblema de vehículo de movimiento lento (una señal naranja triangular)
    es obligatorio en vehículos diseñados para viajar a velocidades de 25 mph o menos,
    como equipos agrícolas o maquinaria de construcción (47 O.S. § 12-215).
- id: 180
  category: sharing_the_road
  question: 'Si camina por una carretera en Oklahoma donde no hay aceras, debe caminar:'
  choices:
    A: En el lado derecho con el flujo del tráfico
    B: En el lado izquierdo de frente al tráfico que viene en sentido contrario
    C: En el centro de la carretera
    D: En el acotamiento de espaldas al tráfico
  answer: B
  explanation: La ley de Oklahoma (47 O.S. § 11-506) exige que los peatones caminen
    por el lado izquierdo de la calzada o su acotamiento, de frente al tráfico, cuando
    no haya aceras disponibles.
- id: 181
  category: vehicle_information
  question: 'Según el Manual del Conductor de Oklahoma, sus faros delanteros deben
    estar encendidos durante el período desde 30 minutos después de la puesta del
    sol hasta 30 minutos antes de la salida del sol y en cualquier otro momento en
    que la visibilidad sea inferior a:'
  choices:
    A: 500 pies
    B: 750 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: La ley de Oklahoma exige que los faros delanteros estén encendidos
    desde 30 minutos después de la puesta del sol hasta 30 minutos antes de la salida
    del sol, o siempre que la visibilidad sea inferior a 1,000 pies debido al clima
    u otras condiciones.
- id: 182
  category: vehicle_information
  question: Al seguir a otro vehículo por detrás por la noche en Oklahoma, ¿a qué
    distancia debe atenuar sus luces altas (high-beam)?
  choices:
    A: 200 pies
    B: 400 pies
    C: 600 pies
    D: 1,000 pies
  answer: C
  explanation: Debe atenuar sus luces altas cuando siga a otro vehículo a menos de
    600 pies para no cegar al conductor de adelante a través de su espejo retrovisor.
- id: 183
  category: vehicle_information
  question: La ley de Oklahoma exige que el freno de pie de su vehículo sea capaz
    de detener el automóvil en cuántos pies cuando viaja a 20 mph?
  choices:
    A: 20 pies
    B: 25 pies
    C: 30 pies
    D: 40 pies
  answer: C
  explanation: Según las regulaciones de equipo de Oklahoma, el freno de pie debe
    poder detener el vehículo en un tramo de 30 pies cuando se viaja a una velocidad
    de 20 mph.
- id: 184
  category: vehicle_information
  question: Todo vehículo registrado en Oklahoma debe estar equipado con un espejo
    retrovisor que permita al conductor ver la carretera por al menos cuántos pies
    hacia atrás?
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: La ley de Oklahoma exige un espejo retrovisor que proporcione una vista
    de la carretera de al menos 200 pies hacia la parte trasera del vehículo.
- id: 185
  category: vehicle_information
  question: Según la ley de Oklahoma, ¿cuál es la cantidad mínima de transmisión de
    luz requerida para el polarizado de las ventanas laterales delanteras?
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: B
  explanation: La ley de Oklahoma exige que el polarizado de las ventanas laterales
    delanteras permita el paso de al menos el 25% de la luz.
- id: 186
  category: vehicle_information
  question: 'Su vehículo debe tener una bocina (claxon) que se pueda escuchar desde
    una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las regulaciones de seguridad de Oklahoma establecen que todo vehículo
    motorizado debe estar equipado con una bocina en buen estado de funcionamiento
    capaz de emitir un sonido audible en condiciones normales desde una distancia
    no menor a 200 pies.
- id: 187
  category: vehicle_information
  question: 'En Oklahoma, la placa de matrícula trasera debe estar iluminada por una
    luz blanca para que sea claramente legible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 150 pies
  answer: B
  explanation: La ley de Oklahoma exige que la placa de matrícula trasera esté iluminada
    para que pueda leerse desde una distancia de 50 pies.
- id: 188
  category: vehicle_information
  question: ¿A qué distancia mínima deben ser visibles las luces direccionales de
    un vehículo bajo la luz solar normal?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: Los estándares de equipo de Oklahoma exigen que las luces direccionales
    sean visibles tanto por delante como por detrás a una distancia de al menos 100
    pies bajo la luz solar normal.
- id: 189
  category: vehicle_information
  question: 'En Oklahoma, los neumáticos se consideran inseguros si la banda de rodadura
    está desgastada a menos de:'
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 4/32 de pulgada
    D: 6/32 de pulgada
  answer: B
  explanation: Los neumáticos deben tener al menos 2/32 de pulgada de profundidad
    de la banda de rodadura para ser considerados seguros y legales para operar en
    las carreteras de Oklahoma.
- id: 190
  category: vehicle_information
  question: A excepción de los vehículos de emergencia autorizados, ¿cuál de los siguientes
    es ilegal tener visible desde la parte delantera del vehículo en Oklahoma?
  choices:
    A: Luces direccionales ámbar
    B: Faros delanteros blancos
    C: Una luz roja
    D: Luces antiniebla transparentes
  answer: C
  explanation: La ley de Oklahoma prohíbe que cualquier vehículo que no sea un vehículo
    de emergencia autorizado muestre una luz roja visible directamente desde el frente
    del centro del vehículo.
- id: 191
  category: vehicle_information
  question: ¿Si una carga se extiende más de cuántos pies más allá de la parte trasera
    de un vehículo en Oklahoma, se debe colocar una bandera roja al final de la carga
    durante el día?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 6 pies
  answer: C
  explanation: Siempre que una carga se extienda 4 pies o más más allá de la parte
    trasera de la plataforma o carrocería de un vehículo, se debe mostrar una bandera
    roja (de al menos 12 pulgadas cuadradas) en el extremo posterior de la carga.
- id: 192
  category: vehicle_information
  question: 'Según la ley de retención infantil de Oklahoma, los niños deben estar
    debidamente asegurados en un sistema de retención infantil orientado hacia atrás
    hasta que tengan al menos:'
  choices:
    A: 1 año de edad
    B: 2 años de edad
    C: 4 años de edad
    D: 6 años de edad
  answer: B
  explanation: La ley de Oklahoma exige que los niños permanezcan en un asiento de
    seguridad orientado hacia atrás hasta que tengan al menos 2 años de edad o hasta
    que alcancen el límite de peso o altura permitido por el fabricante.
- id: 193
  category: vehicle_information
  question: En Oklahoma, ¿un niño debe estar asegurado en un sistema de retención
    infantil o en un asiento elevado (booster seat) hasta que alcance qué edad o estatura?
  choices:
    A: 6 años de edad o 4'6" de estatura
    B: 8 años de edad o 4'9" de estatura
    C: 10 años de edad o 5'0" de estatura
    D: 12 años de edad o 4'11" de estatura
  answer: B
  explanation: La ley de Oklahoma exige que los niños utilicen un asiento elevado
    (booster seat) o un sistema de retención infantil hasta que cumplan 8 años o midan
    al menos 4 pies y 9 pulgadas de estatura.
- id: 194
  category: vehicle_information
  question: 'Según el Manual del Conductor de Oklahoma, las luces delanteras deben
    encenderse durante el período comprendido entre:'
  choices:
    A: La puesta del sol hasta la salida del sol
    B: Una hora después de la puesta del sol hasta una hora antes de la salida del
      sol
    C: 30 minutos después de la puesta del sol hasta 30 minutos antes de la salida
      del sol
    D: La oscuridad hasta la luz del día
  answer: C
  explanation: La ley de Oklahoma exige que las luces delanteras se enciendan desde
    30 minutos después de la puesta del sol hasta 30 minutos antes de la salida del
    sol, o siempre que la visibilidad sea inferior a 1,000 pies.
- id: 195
  category: vehicle_information
  question: ¿La ley de Oklahoma exige que las ventanas laterales delanteras de un
    vehículo permitan al menos qué porcentaje de transmisión de luz?
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: B
  explanation: El Título 47 § 12-406 de Oklahoma establece que las ventanas laterales
    a la izquierda y a la derecha del conductor deben permitir al menos un 25% de
    transmisión de luz.
- id: 196
  category: vehicle_information
  question: 'En Oklahoma, la bocina de un vehículo debe ser audible en condiciones
    normales desde una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: B
  explanation: Las normas de seguridad de Oklahoma exigen que la bocina de un vehículo
    motorizado se escuche desde una distancia no inferior a 200 pies.
- id: 197
  category: vehicle_information
  question: 'La luz que ilumina la placa de matrícula trasera en Oklahoma debe hacer
    que la placa sea visible desde una distancia de al menos:'
  choices:
    A: 25 pies
    B: 50 pies
    C: 100 pies
    D: 150 pies
  answer: B
  explanation: La ley de Oklahoma exige que la placa de matrícula trasera esté iluminada
    por una luz blanca para que sea claramente legible desde una distancia de 50 pies
    hacia atrás.
- id: 198
  category: vehicle_information
  question: 'Además de la conducción nocturna, la ley de Oklahoma exige el uso de
    luces delanteras cuando la visibilidad se limita a menos de:'
  choices:
    A: 500 pies
    B: 800 pies
    C: 1,000 pies
    D: 1,500 pies
  answer: C
  explanation: Las luces delanteras deben usarse en Oklahoma siempre que la visibilidad
    sea inferior a 1,000 pies debido al clima u otras condiciones atmosféricas.
- id: 199
  category: vehicle_information
  question: 'Las luces direccionales de un vehículo en Oklahoma deben ser visibles
    tanto por delante como por detrás a una distancia de al menos:'
  choices:
    A: 100 pies
    B: 200 pies
    C: 300 pies
    D: 500 pies
  answer: A
  explanation: La ley de Oklahoma exige que las luces direccionales sean visibles
    durante al menos 100 pies bajo la luz solar normal.
- id: 200
  category: vehicle_information
  question: 'Todo vehículo motorizado en Oklahoma debe estar equipado con al menos
    dos luces traseras montadas en la parte posterior, las cuales deben ser visibles
    desde una distancia de:'
  choices:
    A: 200 pies
    B: 300 pies
    C: 500 pies
    D: 1,000 pies
  answer: C
  explanation: La ley de Oklahoma exige que las luces traseras sean rojas y visibles
    desde una distancia de 500 pies hacia atrás.
- id: 201
  category: vehicle_information
  question: ¿Cuál de los siguientes equipos está específicamente prohibido en vehículos
    de pasajeros en Oklahoma?
  choices:
    A: Faros antiniebla
    B: Recortes de silenciador o derivaciones (bypass)
    C: Neumáticos para nieve con clavos (durante los meses de invierno)
    D: Cámaras de reversa de repuesto (aftermarket)
  answer: B
  explanation: La ley de Oklahoma prohíbe el uso de un recorte de silenciador, derivación
    o dispositivo similar que impida que el silenciador funcione correctamente para
    reducir el ruido.
- id: 202
  category: vehicle_information
  question: 'Se debe exhibir un emblema de "Vehículo de movimiento lento" en la parte
    trasera de cualquier vehículo de Oklahoma diseñado para operar a velocidades de:'
  choices:
    A: 15 mph o menos
    B: 25 mph o menos
    C: 35 mph o menos
    D: 45 mph o menos
  answer: B
  explanation: El emblema triangular de "Vehículo de movimiento lento" es obligatorio
    en Oklahoma para los vehículos diseñados para viajar a velocidades de 25 mph o
    menos.
- id: 203
  category: signs_and_signals
  question: Al acercarse a un cruce de ferrocarril con señales intermitentes, ¿a qué
    distancia del riel más cercano exige la ley de Oklahoma que se detenga?
  choices:
    A: Entre 5 y 25 pies
    B: Entre 10 y 30 pies
    C: Entre 15 y 50 pies
    D: Exactamente 20 pies
  answer: C
  explanation: El Manual del Conductor de Oklahoma establece que debe detenerse entre
    15 y 50 pies del riel más cercano de un cruce de ferrocarril si las señales parpadean
    o si se acerca un tren.
- id: 204
  category: signs_and_signals
  question: ¿Qué significa una luz roja intermitente en una intersección de Oklahoma?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse y esperar a que la luz cambie a verde
    C: Ceder el paso a todo el tráfico, pero no detenerse a menos que sea necesario
    D: Detenerse por completo y avanzar solo cuando sea seguro hacerlo
  answer: D
  explanation: En Oklahoma, una luz roja intermitente tiene el mismo significado que
    una señal de alto (Pare). Debe detenerse por completo y avanzar solo cuando el
    camino esté despejado.
- id: 205
  category: signs_and_signals
  question: En las carreteras de Oklahoma, ¿qué indica una línea amarilla continua
    en su lado de una carretera de dos carriles?
  choices:
    A: Está en una zona de adelantamiento
    B: No se le permite adelantar
    C: Debe reducir la velocidad a 35 mph
    D: La carretera más adelante es de un solo sentido
  answer: B
  explanation: Una línea amarilla continua en su lado de la línea central significa
    que el adelantamiento está prohibido en su dirección de viaje.
- id: 206
  category: signs_and_signals
  question: 'Una señal en forma de banderín (un triángulo isósceles que apunta a la
    derecha) colocada en el lado izquierdo de la carretera en Oklahoma indica:'
  choices:
    A: Una zona escolar
    B: Un requisito de ceder el paso
    C: Una zona de no adelantar
    D: Un cruce de ferrocarril
  answer: C
  explanation: La señal en forma de banderín es única porque se coloca en el lado
    izquierdo de la carretera para marcar el comienzo de una zona de no adelantar.
- id: 207
  category: signs_and_signals
  question: En Oklahoma, ¿una señal en forma de pentágono (cinco lados) siempre indica
    cuál de los siguientes?
  choices:
    A: Una zona de construcción
    B: Una zona escolar o cruce escolar
    C: Un marcador de carretera del condado
    D: Una señal de alto más adelante
  answer: B
  explanation: La forma de pentágono de cinco lados está reservada exclusivamente
    para zonas escolares y cruces escolares en Oklahoma y en todo EE. UU.
- id: 208
  category: signs_and_signals
  question: Cuando ve un vehículo de emergencia con luces intermitentes detenido en
    el arcén de una autopista de Oklahoma con al menos dos carriles en su dirección,
    ¿qué le exige hacer la "Ley de Hacerse a un Lado" (Move Over Law)?
  choices:
    A: Detenerse inmediatamente en la autopista
    B: Cambiarse al carril izquierdo si es seguro hacerlo, o reducir la velocidad
    C: Mantener la velocidad pero tocar la bocina
    D: Acelerar para pasar el vehículo rápidamente
  answer: B
  explanation: La Ley de Hacerse a un Lado (Move Over Law) de Oklahoma exige que los
    conductores se muevan al carril más alejado del vehículo de emergencia si es posible;
    de lo contrario, el conductor debe reducir la velocidad y proceder con precaución.
- id: 209
  category: signs_and_signals
  question: ¿Cuál es el uso adecuado de un "carril central compartido para girar"
    (marcado por líneas amarillas continuas y discontinuas) en Oklahoma?
  choices:
    A: Para adelantar vehículos de movimiento lento
    B: Para viajar durante al menos 500 pies antes de girar
    C: Para realizar giros a la izquierda únicamente
    D: Para realizar giros a la derecha únicamente
  answer: C
  explanation: Los carriles centrales compartidos para girar están reservados para
    vehículos que realizan giros a la izquierda desde cualquier dirección. No deben
    usarse para adelantar ni para el tráfico directo.
- id: 210
  category: signs_and_signals
  question: 'Al acercarse a una intersección con una luz amarilla intermitente en
    Oklahoma, usted debe:'
  choices:
    A: Detenerse y esperar a que cambie a verde
    B: Acelerar para despejar la intersección
    C: Reducir la velocidad y avanzar con precaución
    D: Tratarla como una parada de cuatro vías
  answer: C
  explanation: Una luz amarilla intermitente significa que debe reducir la velocidad
    y estar alerta, avanzando con precaución a través de la intersección.
- id: 211
  category: signs_and_signals
  question: 'Al entrar en una rotonda en Oklahoma, debe ceder el derecho de paso a:'
  choices:
    A: El tráfico que entra por la derecha
    B: El tráfico que ya está en el círculo
    C: A nadie; usted tiene el derecho de paso al entrar
    D: Solo a los vehículos de emergencia
  answer: B
  explanation: En una rotonda, los conductores que entran al círculo deben ceder el
    paso al tráfico que ya circula dentro de la rotonda.
- id: 212
  category: signs_and_signals
  question: En Oklahoma, ¿qué significa una luz roja intermitente en una intersección?
  choices:
    A: Reducir la velocidad y proceder con precaución
    B: Detenerse y esperar a que la luz cambie a verde
    C: Detenerse por completo y proceder cuando sea seguro hacerlo
    D: La señal está averiada; trátela como una parada de cuatro vías
  answer: C
  explanation: Según el Manual del Conductor de Oklahoma, una luz roja intermitente
    significa lo mismo que una señal de alto (stop). Debe detenerse por completo y
    luego proceder cuando sea seguro.
- id: 213
  category: signs_and_signals
  question: ¿Qué indica una luz amarilla intermitente a un conductor de Oklahoma?
  choices:
    A: Detenerse y esperar a que la luz cambie
    B: Reducir la velocidad y proceder con precaución
    C: Aumentar la velocidad para despejar la intersección rápidamente
    D: Ceder el paso a todo el tráfico que viene solo por la derecha
  answer: B
  explanation: Una luz amarilla intermitente es una advertencia para reducir la velocidad
    y estar especialmente alerta mientras avanza por la intersección.
- id: 214
  category: signs_and_signals
  question: Cuando vea una señal de flecha amarilla fija, ¿qué debe hacer?
  choices:
    A: El tiempo de giro protegido está terminando; prepárese para detenerse
    B: Usted tiene el derecho de paso para girar
    C: Deténgase inmediatamente, incluso si está en la intersección
    D: La flecha está a punto de cambiar a verde
  answer: A
  explanation: Una flecha amarilla fija significa que el tiempo de giro 'protegido'
    está terminando. Si ya se encuentra en la intersección, termine su giro de manera
    segura; de lo contrario, prepárese para detenerse.
- id: 215
  category: signs_and_signals
  question: En Oklahoma, ¿qué indica una señal amarilla circular con una 'X' grande
    y las letras 'RR'?
  choices:
    A: Se aproxima una intersección de autopistas
    B: Se aproxima un cruce de ferrocarril
    C: Zona de no adelantar
    D: Sentido contrario
  answer: B
  explanation: La señal amarilla redonda es una señal de advertencia anticipada de
    ferrocarril, que indica que se está aproximando a un cruce de vías férreas.
- id: 216
  category: signs_and_signals
  question: Si un conductor de Oklahoma extiende su brazo izquierdo recto hacia afuera
    por la ventana, ¿qué maniobra está señalizando?
  choices:
    A: Giro a la derecha
    B: Detenerse o reducir la velocidad
    C: Giro a la izquierda
    D: Giro en U
  answer: C
  explanation: La señal manual estándar para un giro a la izquierda es el brazo izquierdo
    extendido recto hacia afuera de la ventana.
- id: 217
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para 'Reducir la velocidad o Detenerse'
    en Oklahoma?
  choices:
    A: Brazo izquierdo extendido recto hacia afuera
    B: Brazo izquierdo extendido hacia arriba
    C: Brazo izquierdo extendido hacia abajo con la palma hacia atrás
    D: Brazo derecho extendido recto hacia afuera
  answer: C
  explanation: Para señalizar una parada o una disminución de velocidad mediante señales
    manuales, extienda el brazo izquierdo hacia abajo con la palma de la mano hacia
    atrás.
- id: 218
  category: signs_and_signals
  question: ¿Qué significan las líneas amarillas continuas dobles en el centro de
    la calzada?
  choices:
    A: Se permite adelantar desde cualquier lado
    B: Se permite adelantar solo desde su lado
    C: Está prohibido adelantar desde ambas direcciones
    D: La carretera es de un solo sentido
  answer: C
  explanation: Las líneas amarillas continuas dobles significan que no se permite
    adelantar a los vehículos que viajan en ninguna de las dos direcciones.
- id: 219
  category: signs_and_signals
  question: 'En Oklahoma, un ''Carril compartido para girar a la izquierda'' (carril
    central con líneas amarillas continuas y discontinuas) puede usarse para:'
  choices:
    A: Adelantar al tráfico más lento
    B: Conducir por largas distancias para evitar el tráfico
    C: Iniciar o completar giros a la izquierda
    D: Estacionar su vehículo temporalmente
  answer: C
  explanation: El carril central compartido está reservado únicamente para realizar
    giros a la izquierda. No se puede utilizar para adelantar ni para circular de
    paso.
- id: 220
  category: signs_and_signals
  question: ¿Cuál es el significado de una señal de tráfico en forma de pentágono
    (cinco lados)?
  choices:
    A: Ceder el derecho de paso
    B: Pare
    C: Zona escolar o cruce escolar
    D: Zona de no adelantar
  answer: C
  explanation: Una señal de cinco lados (pentágono) indica una zona escolar o un cruce
    escolar más adelante.
- id: 221
  category: signs_and_signals
  question: ¿Qué representa una línea blanca continua pintada a través de un carril
    en una intersección?
  choices:
    A: Un cruce de peatones solo para peatones
    B: Una línea de parada, que indica dónde detenerse ante una señal o semáforo
    C: Un divisor de carril para el tráfico directo
    D: Un límite de estacionamiento
  answer: B
  explanation: Una línea blanca continua a través de un carril es una línea de parada.
    Debe detenerse detrás de esta línea ante señales de alto o semáforos en rojo.
- id: 222
  category: signs_and_signals
  question: En Oklahoma, ¿de qué color son las señales reglamentarias que le indican
    lo que DEBE hacer (por ejemplo, Límite de velocidad, Prohibido girar a la izquierda)?
  choices:
    A: Amarillo
    B: Naranja
    C: Blanco y negro
    D: Verde
  answer: C
  explanation: Las señales reglamentarias, que notifican las leyes o regulaciones
    de tránsito, suelen ser rectangulares y tienen letras negras sobre un fondo blanco.
- id: 223
  category: signs_and_signals
  question: Cuando ve una señal de "Ceda el paso" (Yield), ¿qué le exige la ley de
    Oklahoma que haga?
  choices:
    A: Detenerse por completo siempre
    B: Reducir la velocidad y estar preparado para detenerse; ceder el derecho de
      paso a otros vehículos
    C: Mantener la velocidad e incorporarse rápidamente
    D: Detenerse solo si hay un oficial de policía presente
  answer: B
  explanation: Una señal de ceda el paso significa que debe reducir la velocidad y
    ceder el derecho de paso a vehículos y peatones. Debe detenerse si es necesario
    por seguridad.
- id: 224
  category: signs_and_signals
  question: ¿Qué significa una señal naranja en forma de diamante en Oklahoma?
  choices:
    A: Advertencia general de las condiciones de la carretera
    B: Zona escolar más adelante
    C: Advertencia de construcción o mantenimiento
    D: Área de recreación pública
  answer: C
  explanation: Las señales naranjas en forma de diamante se utilizan específicamente
    para advertencias de zonas de trabajo de construcción y mantenimiento.
- id: 225
  category: signs_and_signals
  question: Si se encuentra en una intersección con un semáforo en rojo y una flecha
    verde que apunta a la derecha, ¿qué se le permite hacer?
  choices:
    A: Debe esperar a que la luz principal cambie a verde antes de girar
    B: Puede girar a la derecha después de detenerse por completo
    C: Puede girar a la derecha en la dirección de la flecha sin detenerse, pero debe
      ceder el paso a los peatones
    D: Solo puede girar a la derecha si no hay una señal de "No girar en rojo"
  answer: C
  explanation: Una flecha verde significa que tiene un giro "protegido". Puede avanzar
    en la dirección de la flecha, pero aún debe ceder el paso a los peatones y a otros
    vehículos que ya estén en la intersección.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reducir la velocidad y avanzar con precaución
    B: Detenerse por completo
    C: Ceder el paso al tráfico que viene en sentido contrario
    D: Detenerse solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 226
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le exige hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Aumentar la velocidad para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen con seguridad.
  id: 227
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta vía
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 228
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debe hacer?
  choices:
    A: Hacer un giro en U
    B: Continuar conduciendo con cuidado
    C: 'Detenerse y retroceder o dar la vuelta: va en sentido contrario'
    D: Aumentar la velocidad para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando contra el tráfico en una carretera de un solo sentido o en una
    rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda de manera
    segura.
  id: 229
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Giro a la izquierda solamente
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que apunta la flecha.'
  id: 230
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Vueltas a la derecha
    B: Vueltas a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 231
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 232
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permiten vueltas en U
    B: No se permiten vueltas a la izquierda
    C: No se permiten vueltas a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 233
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín en blanco y negro de "ZONA DE NO REBASAR"
    (NO PASSING ZONE) significa que no se le permite rebasar a otros vehículos en
    esta área. Marca el comienzo de una zona de no rebasar.
  id: 234
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Gire a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de "MANTÉNGASE A LA DERECHA" (KEEP RIGHT)
    con una flecha significa que debe mantenerse en el lado derecho de una isla de
    tráfico, mediana u obstrucción.
  id: 235
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área bajo condiciones ideales.
  id: 236
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan la carretera con frecuencia en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan la carretera con frecuencia en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al atardecer.
  id: 237
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero de excursión cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 238
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona de hospital
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo-verde fluorescente
    indica una zona escolar o un cruce escolar. Reduzca la velocidad y esté atento
    a los niños.
  id: 239
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona de hospital
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras R es la señal
    de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca la
    velocidad, mire y escuche si vienen trenes.
  id: 240
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (aspa) de cruce de ferrocarril se coloca
    en los cruces de tren. Significa que debe ceder el paso a los trenes. Si se aproxima
    un tren, debe detenerse.
  id: 241
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de rombo?
  choices:
    A: La carretera termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de rombo con una flecha curva advierte
    de una curva en la carretera más adelante. Reduzca la velocidad antes de entrar
    en la curva.
  id: 242
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa que solo se puede girar a la derecha
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más brusco que una señal de curva. Debe reducir su velocidad de manera más significativa
    antes de este giro.
  id: 243
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera curve primero
    en un sentido y luego en el otro.
  id: 244
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 245
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla de incorporación en forma de rombo advierte que
    el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 246
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la vía y ajuste su posición
    en el carril.
  id: 247
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico en ambos sentidos
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 248
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico en ambos sentidos
    C: Una zona de incorporación más adelante
    D: Obras viales más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico en ambos
    sentidos.
  id: 249
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico en ambos sentidos más adelante: el tráfico circula en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico en ambos sentidos más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que circulan en dirección opuesta.
  id: 250
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de 'resbaladizo cuando está mojado' advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 251
- image: hill.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carreteras
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 252
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte de un semáforo más adelante. Esté preparado para
    detenerse si la luz está en rojo o amarillo. Esta señal se coloca a menudo donde
    el semáforo puede no ser visible desde la distancia.
  id: 253
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 254
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que entra desde las carreteras
    laterales.
  id: 255
- image: side_road.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Una carretera lateral que entra por la derecha
    C: Una curva en la carretera
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte de una carretera lateral que entra por la derecha.
    Esté atento a los vehículos que entran a la autopista desde la carretera lateral.
  id: 256
