questions:
- id: 1
  category: driver_responsibility
  question: 'Según el Manual del Conductor de Oklahoma, operar un vehículo motorizado
    en las calles y autopistas de Oklahoma se considera:'
  choices:
    A: Un derecho constitucional
    B: Un privilegio otorgado por el estado
    C: Una garantía incondicional para todos los residentes
    D: Un derecho federal
  answer: B
  explanation: El manual establece que su licencia para operar un vehículo motorizado
    en las calles y autopistas de Oklahoma es un privilegio que el estado otorga bajo
    ciertas condiciones.
- id: 2
  category: driver_testing
  question: ¿Quién es responsable de administrar y evaluar los exámenes requeridos
    para una licencia de conducir de Oklahoma?
  choices:
    A: Un oficial de policía local
    B: Un examinador de conductores profesional de Service Oklahoma
    C: Un instructor de manejo certificado de escuela secundaria
    D: Un auditor externo independiente
  answer: B
  explanation: Los exámenes serán administrados y evaluados por un examinador de conductores
    profesional de Service Oklahoma, de acuerdo con los estándares estatales y nacionales.
- id: 3
  category: license_system
  question: ¿Cuándo debe un conductor con una licencia de otro estado solicitar una
    licencia de conducir de Oklahoma?
  choices:
    A: Dentro de los 60 días de visitar el estado
    B: Inmediatamente al cruzar la frontera estatal
    C: Cuando establezca su residencia en Oklahoma
    D: Solo cuando su licencia de otro estado expire
  answer: C
  explanation: Los conductores con una licencia de otro estado deben solicitar una
    licencia de conducir de Oklahoma cuando establezcan su residencia.
- id: 4
  category: vehicle_information
  question: ¿Qué debe hacer con respecto a sus vehículos al establecer su residencia
    en Oklahoma?
  choices:
    A: Vender cualquier vehículo de otro estado
    B: Registrar sus vehículos en Oklahoma
    C: Hacer que la patrulla de caminos inspeccione sus vehículos
    D: Pagar un impuesto federal de importación por única vez
  answer: B
  explanation: Al establecer la residencia, sus vehículos deben estar registrados
    en Oklahoma.
- id: 5
  category: license_system
  question: ¿Cuál de las siguientes personas NO está obligada a tener una licencia
    de conducir de Oklahoma?
  choices:
    A: Un nuevo residente que acaba de mudarse a Oklahoma
    B: Un residente que solo conduce los fines de semana
    C: Cualquier persona que opere un tractor agrícola únicamente para actividades
      de granja o rancho
    D: Un no residente de 15 años con una licencia de su estado de origen
  answer: C
  explanation: NO se requiere una licencia de Oklahoma para cualquier persona que
    opere un tractor o implemento agrícola únicamente para actividades de granja o
    rancho.
- id: 6
  category: license_system
  question: Un no residente que tenga una licencia válida en su estado de origen no
    necesita una licencia de Oklahoma si tiene al menos ¿qué edad?
  choices:
    A: 14 años
    B: 15 años
    C: 16 años
    D: 18 años
  answer: C
  explanation: NO se requiere una licencia de Oklahoma para los no residentes de al
    menos 16 años que tengan una licencia válida para conducir en su estado o país
    de origen.
- id: 7
  category: license_system
  question: ¿Qué grupo de no residentes está exento de necesitar una licencia de conducir
    de Oklahoma si tiene una licencia válida de su estado de origen?
  choices:
    A: Estudiantes no residentes inscritos en un colegio o universidad de Oklahoma
    B: No residentes que trabajan en empleos temporales de construcción
    C: No residentes que poseen propiedades vacacionales en Oklahoma
    D: No residentes que se hospedan en un hotel por más de 30 días
  answer: A
  explanation: NO se requiere una licencia de Oklahoma para los estudiantes no residentes
    inscritos en un colegio o universidad de Oklahoma, ni para sus cónyuges e hijos
    con licencias válidas de sus estados de origen.
- id: 8
  category: license_system
  question: Al presentar una identificación principal para solicitar una licencia,
    ¿cuál de las siguientes opciones es inaceptable?
  choices:
    A: Un certificado de nacimiento de EE. UU. certificado
    B: Un pasaporte de EE. UU. vigente
    C: Una fotocopia notariada de un certificado de nacimiento
    D: Un Informe Consular de Nacimiento en el Extranjero
  answer: C
  explanation: Se requiere presentar una identificación principal. Los documentos
    notariados o las fotocopias no son aceptables.
- id: 9
  category: license_system
  question: ¿Cuál de las siguientes es una forma aceptable de identificación principal
    al solicitar una licencia de conducir de Oklahoma?
  choices:
    A: Una tarjeta de biblioteca
    B: Una licencia de conducir de Oklahoma válida emitida originalmente después del
      1 de noviembre de 2007
    C: Una factura de servicios públicos de los últimos 30 días
    D: Una tarjeta de identificación de estudiante
  answer: B
  explanation: La identificación principal aceptable incluye una licencia de conducir
    de Oklahoma válida, emitida originalmente después del 1 de noviembre de 2007.
- id: 10
  category: license_system
  question: Si su nombre cambia debido a un matrimonio, ¿cómo debe aparecer en su
    licencia de conducir?
  choices:
    A: Exactamente como se indica en el certificado de matrimonio
    B: Como su nombre de pila y el apellido de su cónyuge
    C: Con guion junto a su apellido de soltera
    D: Como usted lo escriba en el formulario de solicitud
  answer: A
  explanation: Un cambio de nombre resultante de un matrimonio, orden judicial o divorcio
    aparecerá en la licencia de conducir o tarjeta de identificación exactamente como
    se indica en el certificado de matrimonio, orden judicial o sentencia de divorcio.
- id: 11
  category: license_system
  question: ¿Qué debe proporcionar un solicitante si está renovando una licencia de
    Oklahoma que ha estado vencida por más de un año?
  choices:
    A: Una forma secundaria de identificación
    B: Un documento de la lista de identificación primaria
    C: Un registro de conducción certificado
    D: Comprobante de registro del vehículo
  answer: B
  explanation: Los solicitantes de renovaciones con una licencia de Oklahoma vencida
    o una tarjeta de identificación de Oklahoma vencida por más de 1 año deben proporcionar
    un documento de la lista de identificación primaria.
- id: 12
  category: license_system
  question: Si un cliente desea establecer un cambio de nombre basado en un matrimonio
    de derecho consuetudinario (common law marriage), ¿qué documentación se requiere?
  choices:
    A: Una confirmación verbal de ambos cónyuges
    B: Una carta notariada de un juez
    C: Una "Declaración Jurada de Matrimonio de Derecho Consuetudinario" (Affidavit
      of Common Law Marriage) con firmas notariadas del esposo y la esposa, además
      de otra fuente primaria
    D: Un certificado de matrimonio estándar de cualquier estado
  answer: C
  explanation: 'Los documentos requeridos incluyen: Para un matrimonio de derecho
    consuetudinario, una "Declaración Jurada de Matrimonio de Derecho Consuetudinario"
    que contenga las firmas notariadas del esposo y la esposa, junto con otra fuente
    primaria.'
- id: 13
  category: driver_responsibility
  question: ¿Se considera el Manual del Conductor de Oklahoma como una referencia
    legal oficial de las leyes de tránsito de Oklahoma?
  choices:
    A: Sí, es la referencia legal principal del estado.
    B: Sí, contiene los estatutos legales exactos de las leyes de tránsito.
    C: No, no es una referencia legal oficial, pero explica los conocimientos y habilidades
      en lenguaje cotidiano.
    D: No, es solo una guía para conductores de fuera del estado.
  answer: C
  explanation: 'El manual establece: "No es una referencia legal oficial de las leyes
    de tránsito de Oklahoma. Aun así, explica en lenguaje cotidiano los conocimientos
    y habilidades que necesitará para conducir de manera segura y legal..."'
- id: 14
  category: license_system
  question: ¿Qué se requiere como mínimo para solicitar el reemplazo de una licencia
    de conducir de Oklahoma perdida, robada o deteriorada?
  choices:
    A: Una forma de identificación primaria
    B: Un informe policial
    C: Dos piezas de correo que muestren su dirección
    D: Un certificado de nacimiento y una tarjeta de seguro social
  answer: A
  explanation: Los solicitantes que pidan el reemplazo de una licencia de conducir
    o tarjeta de identificación de Oklahoma perdida, robada o deteriorada deben presentar,
    como mínimo, una forma de identificación primaria.
- id: 15
  category: license_system
  question: Si su identificación primaria es un documento de USCIS (incluyendo el
    I-551) y desea cambiar su nombre en su licencia, ¿qué debe hacer primero?
  choices:
    A: Proporcionar una carta notariada de un empleador
    B: Proporcionar prueba del cambio de nombre de USCIS
    C: Esperar hasta convertirse en ciudadano estadounidense de pleno derecho
    D: Llevar a un testigo a las instalaciones de Service Oklahoma
  answer: B
  explanation: Si el documento de USCIS es la identificación primaria (incluyendo
    el I-551), el solicitante debe proporcionar prueba del cambio de nombre de USCIS
    antes de que se realice cualquier cambio.
- id: 16
  category: license_system
  question: ¿Dónde debe informar un cambio de nombre legal antes de actualizar su
    licencia de conducir o tarjeta de identificación?
  choices:
    A: El Departamento de Seguridad Pública
    B: La Administración del Seguro Social
    C: La Oficina del Secretario del Condado
    D: El Servicio de Impuestos Internos (IRS)
  answer: B
  explanation: Según el manual, los cambios de nombre legales deben informarse a la
    Administración del Seguro Social antes de que se realicen los cambios en su licencia
    o tarjeta de identificación.
- id: 17
  category: license_system
  question: A partir del 7 de mayo de 2025, ¿para qué se requerirá una REAL ID o un
    documento de identificación federal válido?
  choices:
    A: Abordar un vuelo nacional
    B: Votar en una elección local
    C: Solicitar un pasaporte
    D: Comprar un arma de fuego
  answer: A
  explanation: A partir del 7 de mayo de 2025, se requerirá una licencia o tarjeta
    de identificación REAL ID o un documento de identificación federal válido para
    abordar un vuelo nacional, visitar bases militares o ingresar a plantas de energía
    nuclear.
- id: 18
  category: driver_testing
  question: ¿Qué tipo de documento de seguro debe traer al realizar su examen de conducir?
  choices:
    A: Seguro de cobertura amplia (comprehensive)
    B: Seguro de colisión
    C: Seguro de responsabilidad civil automotriz
    D: Cobertura de conductor no asegurado
  answer: C
  explanation: El manual establece que debe traer un comprobante válido de seguro
    de responsabilidad civil automotriz si va a realizar el examen de conducir.
- id: 19
  category: license_system
  question: ¿Cuál es la edad mínima para obtener un Permiso de Aprendiz Clase D si
    está tomando o ha aprobado un curso de educación vial autorizado?
  choices:
    A: '14'
    B: '15'
    C: 15 ½
    D: '16'
  answer: B
  explanation: La edad mínima para un Permiso de Aprendiz Clase D es 15 años, siempre
    que esté tomando o haya aprobado un curso de educación vial autorizado.
- id: 20
  category: license_system
  question: ¿Qué certificado específico debe presentarse para obtener una Licencia
    Intermedia Clase D?
  choices:
    A: Certificado de finalización de Conducción Defensiva
    B: Certificado de finalización de Work Zone Safe (Zona de Obras Segura)
    C: Certificado de finalización de Seguridad en Carreteras
    D: Certificado de finalización de Primeros Auxilios
  answer: B
  explanation: Para obtener una Licencia Intermedia Clase D, los requisitos establecen
    que debe presentar un certificado de finalización de Work Zone Safe.
- id: 21
  category: safe_driving_rules
  question: Si tiene una 'Licencia solo para motocicletas' a los 14 o 15 años, ¿en
    qué horario se le permite conducir?
  choices:
    A: 5:00 a.m. a 10:00 p.m.
    B: 6:00 a.m. a 8:00 p.m.
    C: Desde el amanecer hasta el atardecer
    D: 4:30 a.m. a 9:00 p.m.
  answer: D
  explanation: Para una Licencia solo para motocicletas, el manual especifica que
    solo puede conducir entre las 4:30 a.m. y las 9:00 p.m.
- id: 22
  category: safe_driving_rules
  question: ¿Se le permite llevar a un pasajero si tiene una 'Licencia solo para motocicletas'
    antes de los 16 años?
  choices:
    A: Sí, si llevan casco
    B: Sí, si es un familiar directo
    C: No, no puede llevar a un pasajero
    D: No, a menos que sea mayor de 21 años
  answer: C
  explanation: El manual establece explícitamente para una Licencia solo para motocicletas
    que 'No puede llevar a un pasajero'. Estas restricciones se eliminan a los 16
    años.
- id: 23
  category: license_system
  question: ¿Se requiere una Licencia Comercial Clase A, B o C para un vehículo diseñado
    para transportar cuántos pasajeros (incluyendo al conductor)?
  choices:
    A: 10 o más
    B: 12 o más
    C: 15 o más
    D: 16 o más
  answer: D
  explanation: Se requiere una Licencia Comercial Clase A, B o C para un vehículo
    diseñado para transportar 16 o más pasajeros, incluyendo al conductor.
- id: 24
  category: safe_driving_rules
  question: Según la ley de Oklahoma, ¿quién está obligado a usar casco al operar
    una motocicleta?
  choices:
    A: Cualquier persona menor de 18 años
    B: Cualquier persona menor de 21 años
    C: Todos los conductores independientemente de su edad
    D: Solo los conductores con un permiso de aprendizaje
  answer: A
  explanation: El manual establece en la sección de Permiso de Licencia de Motocicleta
    que 'Se requiere casco para cualquier persona menor de 18 años'.
- id: 25
  category: license_system
  question: ¿Un Permiso de Aprendizaje Clase D es válido solo cuando se está acompañado
    por un conductor con licencia sentado a su lado que tenga al menos qué edad?
  choices:
    A: '18'
    B: '19'
    C: '21'
    D: '25'
  answer: C
  explanation: Un Permiso de Aprendizaje es válido solo mientras un conductor con
    licencia, de 21 años o más, esté sentado al lado del conductor.
- id: 26
  category: safe_driving_rules
  question: Si tiene una 'Licencia solo para motocicletas' para una motocicleta de
    entre 150cc y 300cc, ¿dónde NO se le permite conducir?
  choices:
    A: En calles de la ciudad con un límite de velocidad superior a 35 mph
    B: En autopistas con un límite de velocidad mínima señalizado
    C: En cualquier carretera después de las 5:00 p.m.
    D: En carreteras rurales de dos carriles
  answer: B
  explanation: Si su motocicleta es de más de 150cc pero no mayor de 300cc, no puede
    conducir en una autopista con un límite de velocidad mínima señalizado, como una
    interestatal o una autopista de peaje (turnpike).
- id: 27
  category: license_system
  question: Al solicitar una licencia, ¿cuál de los siguientes NO se considera una
    prueba válida de presencia legal para un ciudadano que no es de los EE. UU.?
  choices:
    A: Un pasaporte estadounidense válido
    B: Un recibo de una solicitud de presencia en los EE. UU.
    C: Un documento I-551
    D: Documentación válida del USCIS
  answer: B
  explanation: 'El manual establece explícitamente: ''Un recibo de una solicitud de
    presencia en los EE. UU. NO es prueba de presencia legal''.'
- id: 28
  category: driver_testing
  question: Al operar con un Permiso de Licencia de Motocicleta, la persona que le
    instruye debe tener al menos 21 años, tener un endoso de motocicleta y mantener
    ¿qué con usted?
  choices:
    A: Comunicación por radio
    B: Contacto visual
    C: Contacto físico
    D: Una distancia de seguimiento de no más de 50 pies
  answer: B
  explanation: Debe recibir instrucción de un padre, tutor legal o cualquier persona
    de 21 años o más que tenga una Licencia de Conducir de Oklahoma válida con un
    endoso de motocicleta agregado y que tenga contacto visual con el operador.
- id: 29
  category: license_system
  question: ¿Cuál de los siguientes NO se colocará en una licencia de conducir o tarjeta
    de identificación de Oklahoma?
  choices:
    A: Su primer nombre legal
    B: Su fecha de nacimiento
    C: Títulos o nombres eclesiásticos
    D: Su apellido legal
  answer: C
  explanation: El manual establece que 'Los títulos o nombres eclesiásticos no se
    colocarán en una licencia de conducir o en una tarjeta de identificación'.
- id: 30
  category: driver_testing
  question: Después de obtener un Permiso de Aprendizaje Comercial Clase A, B o C,
    ¿cuánto tiempo debe esperar antes de ser elegible para realizar las Pruebas de
    Habilidades (Skills Tests)?
  choices:
    A: 7 días
    B: 14 días
    C: 30 días
    D: 180 días
  answer: B
  explanation: 'Para un Permiso de Aprendizaje Comercial Clase A, B o C, el manual
    establece: ''Será elegible para las Pruebas de Habilidades 14 días después de
    obtener el permiso''.'
- id: 31
  category: license_system
  question: ¿Qué se requiere para que una persona menor de 18 años solicite una Tarjeta
    de Identificación de Oklahoma?
  choices:
    A: Un diploma de escuela secundaria
    B: La firma de un padre con custodia o tutor legal en el formulario de consentimiento
    C: Aprobar un examen de conocimientos por escrito
    D: Comprobante de inscripción en educación vial
  answer: B
  explanation: El manual establece que para obtener una Tarjeta de Identificación,
    un padre con custodia o tutor legal debe firmar el formulario de consentimiento
    si usted es menor de 18 años.
- id: 32
  category: driver_testing
  question: ¿Cuántas horas de entrenamiento real al volante se requieren para los
    estudiantes que toman Educación Vial Impartida por los Padres (Parent-Taught Driver
    Education)?
  choices:
    A: 30 horas
    B: 40 horas
    C: 50 horas
    D: 55 horas
  answer: D
  explanation: Los estudiantes en el programa de Educación Vial Impartida por los
    Padres deben completar 30 horas de capacitación en el aula y 55 horas de entrenamiento
    real al volante.
- id: 33
  category: safe_driving_rules
  question: Bajo el programa de Licencia de Conducir Graduada (GDL), ¿a qué horas
    está limitado generalmente el tiempo de conducción restringido de un adolescente?
  choices:
    A: 6 a.m. a 9 p.m.
    B: 5 a.m. a 10 p.m.
    C: 7 a.m. a 11 p.m.
    D: 6 a.m. a 10 p.m.
  answer: B
  explanation: El Proyecto de Ley de la Cámara 1599 (House Bill 1599) restringe el
    tiempo de conducción de los adolescentes a las horas de 5 a.m. a 10 p.m., con
    excepciones por trabajo, escuela, iglesia, o si un conductor con licencia mayor
    de 21 años está sentado a su lado.
- id: 34
  category: safe_driving_rules
  question: A menos que esté acompañado por un conductor con licencia mayor de 21
    años, ¿a cuántos pasajeros está limitado un adolescente con una licencia restringida?
  choices:
    A: Cero pasajeros
    B: Un pasajero, a menos que todos los pasajeros vivan en el mismo hogar
    C: Dos pasajeros
    D: Tres pasajeros
  answer: B
  explanation: La ley GDL limita a los adolescentes con una licencia restringida a
    un pasajero, a menos que todos los pasajeros vivan en el mismo hogar, o que un
    conductor con licencia mayor de 21 años de edad esté sentado al lado del adolescente.
- id: 35
  category: penalties_and_points
  question: ¿Qué sucede si se le condena por una infracción de tránsito (moving violation)
    mientras tiene una Licencia de Conducir Graduada (de aprendizaje o intermedia)?
  choices:
    A: Su licencia es revocada permanentemente
    B: Debe pagar una multa de $500 y volver a tomar el examen de conducir
    C: Permanecerá en su nivel actual de GDL hasta que hayan transcurrido 6 meses
      desde la fecha de la condena
    D: Se le suspende la conducción por 30 días
  answer: C
  explanation: Si rompe las reglas y es condenado por una infracción de tránsito,
    permanecerá en su nivel actual de GDL hasta que hayan transcurrido 6 meses desde
    la fecha de la condena.
- id: 36
  category: driver_testing
  question: Si reprueba el examen escrito para una licencia Clase D, ¿cuánto tiempo
    debe esperar antes de volver a tomarlo?
  choices:
    A: Al menos un día
    B: Al menos una semana
    C: Al menos 30 días
    D: Puede volver a tomarlo inmediatamente
  answer: A
  explanation: El manual establece que si reprueba el examen escrito, por ley debe
    esperar al menos un día antes de volver a realizar la prueba.
- id: 37
  category: vehicle_information
  question: ¿Cuál de los siguientes es un requisito para el vehículo que utiliza para
    realizar su examen de conducir?
  choices:
    A: Debe tener menos de 10 años de antigüedad
    B: Debe tener una placa (tag) vigente y usted debe mostrar el formulario de verificación
      de seguridad
    C: Debe tener controles dobles para el examinador
    D: Debe ser un sedán de cuatro puertas
  answer: B
  explanation: Para calificar para el examen de conducir, el automóvil que esté utilizando
    debe tener una placa vigente, debe mostrar el formulario de verificación de seguridad
    y debe estar en condiciones mecánicas adecuadas.
- id: 38
  category: driver_testing
  question: ¿Quién tiene permitido estar en el automóvil con usted y el examinador
    durante su examen de conducir?
  choices:
    A: Un padre o tutor legal
    B: Un instructor de educación vial certificado
    C: Su mascota
    D: Ninguna mascota ni personas adicionales
  answer: D
  explanation: El manual establece explícitamente que ninguna mascota ni personas
    adicionales pueden estar en el automóvil con usted y el examinador durante el
    examen de conducir.
- id: 39
  category: driver_testing
  question: ¿Bajo qué condiciones NO se realizará un examen de habilidades de conducción?
  choices:
    A: Cuando esté nublado o encapotado
    B: Cuando la temperatura sea bajo cero
    C: Cuando el examinador considere que las carreteras están resbaladizas o son
      peligrosas
    D: Cuando esté lloviendo ligeramente
  answer: C
  explanation: Los exámenes de habilidades no se realizarán cuando el examinador considere
    que las carreteras están resbaladizas o son peligrosas.
- id: 40
  category: license_system
  question: Si tiene un Permiso de Aprendizaje y tiene 15 años o más, ¿cuánto tiempo
    debe haber tenido su permiso antes de poder realizar el examen de conducir?
  choices:
    A: Al menos 30 días
    B: Al menos 3 meses
    C: Al menos 6 meses
    D: Al menos 1 año
  answer: C
  explanation: Según la Tabla 2, los solicitantes con un Permiso de Aprendizaje (de
    15 años en adelante) deben tener 16 años y haber tenido su permiso durante al
    menos 6 meses para realizar el examen de conducir.
- id: 41
  category: license_system
  question: ¿Cuánto tiempo debe tener el permiso de aprendizaje de motocicleta un
    joven de 14 o 15 años antes de realizar el examen de conducción?
  choices:
    A: 14 días
    B: 30 días
    C: 6 meses
    D: 1 año
  answer: B
  explanation: La Tabla 2 establece que un solicitante de motocicleta de 14 a 15 años
    debe haber tenido su permiso durante al menos 30 días para realizar el examen
    de conducción.
- id: 42
  category: license_system
  question: Al transferir una licencia Clase D válida de otro estado, ¿qué examen
    es estrictamente obligatorio?
  choices:
    A: Examen de la vista
    B: Examen escrito
    C: Examen de conducción
    D: Todos los anteriores
  answer: A
  explanation: La Tabla 2 muestra que para una transferencia de otro estado de una
    licencia Clase D válida, se requiere el examen de la vista, mientras que los exámenes
    escrito y de conducción quedan a discreción del examinador y pueden ser exonerados.
- id: 43
  category: driver_responsibility
  question: Cuando un joven de 14 o 15 años solicita una licencia de motocicleta,
    ¿qué responsabilidad asume el padre, madre o tutor que firma?
  choices:
    A: Debe viajar como pasajero en todo momento
    B: Debe pagar el combustible y el mantenimiento de la motocicleta
    C: Asume la responsabilidad financiera y legal si el adolescente infringe la ley,
      daña la propiedad o causa lesiones
    D: Debe completar un curso básico de conducción junto con el adolescente
  answer: C
  explanation: El manual establece que el padre con custodia o el tutor legal debe
    aceptar asumir la responsabilidad financiera y legal si el adolescente infringe
    la ley, daña la propiedad o causa lesiones personales mientras conduce.
- id: 44
  category: license_system
  question: Si se le ha asignado un número de Seguro Social, ¿cómo aparecerá en su
    licencia de conducir o tarjeta de identificación de Oklahoma?
  choices:
    A: Se imprimirá en el frente de la tarjeta
    B: Se imprimirá en el reverso de la tarjeta
    C: Se codificará únicamente en la banda magnética
    D: No aparecerá en su licencia ni en su tarjeta de identificación
  answer: D
  explanation: 'El manual establece: ''Si se le ha asignado un número de Seguro Social,
    debe conocer su número al momento de la solicitud... Este número no aparecerá
    en su licencia o tarjeta de identificación''.'
- id: 45
  category: vehicle_information
  question: ¿Cuál es la profundidad mínima de la banda de rodadura de los neumáticos
    requerida para que su vehículo pase la inspección del examen de conducción?
  choices:
    A: 1/32 de pulgada
    B: 2/32 de pulgada
    C: 3/32 de pulgada
    D: 4/32 de pulgada
  answer: B
  explanation: Los neumáticos deben tener una profundidad mínima de banda de rodadura
    de 2/32" y no tener capas o cuerdas expuestas en la banda de rodadura para pasar
    la inspección del vehículo.
- id: 46
  category: license_system
  question: ¿Quién es el propietario legal de su licencia de conducir de Oklahoma?
  choices:
    A: Usted, el conductor
    B: El gobierno federal
    C: El Estado de Oklahoma
    D: El Departamento de Transporte
  answer: C
  explanation: Usted no es el dueño de su licencia. Es propiedad del Estado de Oklahoma
    y puede ser denegada, cancelada, suspendida o revocada si no cumple con las leyes.
- id: 47
  category: license_system
  question: Por ley, ¿cuántos días tiene para notificar a Service Oklahoma cuando
    se muda y cambia su dirección?
  choices:
    A: 5 días
    B: 10 días
    C: 15 días
    D: 30 días
  answer: B
  explanation: Cuando se muda, la ley le exige notificar a Service Oklahoma dentro
    de un plazo de 10 días.
- id: 48
  category: vehicle_information
  question: Durante una inspección del vehículo, ¿a qué distancia debe ser audible
    la bocina de su vehículo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: Para pasar la inspección del vehículo antes de su examen de conducción,
    su bocina debe ser audible a 200 pies.
- id: 49
  category: license_system
  question: ¿Hasta qué edad se considera que su licencia de conducir de Oklahoma es
    probatoria (en período de prueba)?
  choices:
    A: '16'
    B: '18'
    C: '21'
    D: '25'
  answer: B
  explanation: Hasta que cumpla 18 años, su licencia es probatoria, lo que significa
    que se encuentra en un período de prueba para demostrar que puede conducir de
    manera segura y legal.
- id: 50
  category: license_system
  question: ¿Qué símbolo se imprimirá en el frente de su licencia de conducir si elige
    convertirse en donante de órganos y tejidos?
  choices:
    A: Una cinta azul
    B: Una cruz verde
    C: Un corazón rojo
    D: Una estrella amarilla
  answer: C
  explanation: Marcar la casilla SÍ para la opción de donante de órganos hará que
    se imprima un corazón rojo en el frente de la licencia de conducir o tarjeta de
    identificación.
- id: 51
  category: driver_responsibility
  question: ¿A quién está obligado por ley a mostrar su licencia de conducir si se
    ve involucrado en una colisión?
  choices:
    A: Solo a un oficial de policía o patrullero estatal
    B: Solo a su agente de seguros
    C: A cualquier persona con la que esté involucrado en la colisión
    D: Solo a un juez o magistrado
  answer: C
  explanation: Bajo las Responsabilidades de la Licencia, debe mostrar su licencia
    a cualquier persona con la que esté involucrado en una colisión.
- id: 52
  category: license_system
  question: ¿En qué día vence una licencia de conducir de Oklahoma?
  choices:
    A: En su cumpleaños
    B: El último día del mes en el que pagó su tarifa
    C: Exactamente 4 años después del día en que fue emitida
    D: El 31 de diciembre del año de vencimiento
  answer: B
  explanation: Su licencia puede emitirse por 4 u 8 años a partir del mes en que pagó
    la tarifa de su licencia. Vence el último día del mes.
- id: 53
  category: license_system
  question: ¿Cuántos días después de regresar al estado tiene el personal militar
    estacionado fuera de Oklahoma para renovar su licencia de conducir?
  choices:
    A: 10 días
    B: 30 días
    C: 60 días
    D: 90 días
  answer: C
  explanation: El personal militar estacionado fuera de Oklahoma no tiene que renovar
    su licencia hasta 60 días después de regresar a Oklahoma.
- id: 54
  category: vehicle_information
  question: ¿Cuál de los siguientes daños en el parabrisas hará que un vehículo no
    pase la inspección?
  choices:
    A: Cualquier tinte en las ventanas traseras
    B: Roturas en forma de estrella o puntos de impacto que se puedan sentir al tacto
    C: Un pequeño rasguño en la ventana del lado del pasajero
    D: Tinte que se extiende 3 pulgadas desde la parte superior del parabrisas
  answer: B
  explanation: Los daños como roturas en forma de estrella o puntos de impacto que
    se puedan sentir al tacto no pasarán la inspección de parabrisas y vidrios.
- id: 55
  category: driver_testing
  question: ¿Cuál de las siguientes es una razón por la que puede reprobar el examen
    de conducir?
  choices:
    A: Pedirle al examinador que repita una instrucción
    B: Negarse a realizar una maniobra
    C: Conducir un vehículo anterior a 1994
    D: Tener un corazón rojo en su permiso de aprendizaje
  answer: B
  explanation: Puede reprobar el examen de conducir por cometer demasiados errores,
    conducción peligrosa, violaciones de la ley, colisiones de tráfico o negarse a
    realizar una maniobra.
- id: 56
  category: penalties_and_points
  question: La ley estatal exige que las personas condenadas por delitos sexuales
    o delitos violentos que se muden a Oklahoma se registren ante las autoridades
    locales en un plazo de ¿cuántos días?
  choices:
    A: 3 días
    B: 5 días
    C: 10 días
    D: 14 días
  answer: A
  explanation: La ley estatal exige que las personas condenadas por delitos sexuales
    o delitos violentos que se muden a este estado se registren en el Departamento
    de Correcciones de Oklahoma en un plazo de 10 días y ante las autoridades locales
    en un plazo de 3 días.
- id: 57
  category: license_system
  question: ¿Cómo es el logotipo de veterano en una licencia de conducir de Oklahoma?
  choices:
    A: Un águila calva con la palabra "Veteran"
    B: Una placa de identificación militar
    C: Una bandera estadounidense con la palabra "Veteran" debajo
    D: Una estrella dorada con la palabra "Veteran"
  answer: C
  explanation: El logotipo de veterano es una bandera estadounidense con la palabra
    "Veteran" debajo de ella.
- id: 58
  category: license_system
  question: Si su licencia de conducir ha estado vencida por más de 1 año, ¿qué debe
    presentar para renovarla?
  choices:
    A: Un certificado de nacimiento certificado o un pasaporte de los Estados Unidos
    B: Un diploma de escuela secundaria o GED
    C: Una factura de servicios públicos reciente y un formulario W-2
    D: Una tarjeta de registro de votante
  answer: A
  explanation: Si su licencia ha vencido hace más de 1 año, debe visitar una ubicación
    de Service Oklahoma o una ubicación de un operador con licencia que esté aprobado
    para aceptar un certificado de nacimiento certificado o un pasaporte de los Estados
    Unidos.
- id: 59
  category: license_system
  question: ¿Qué puede suceder si no notifica a Service Oklahoma cuando cambia su
    dirección?
  choices:
    A: Su licencia puede ser suspendida sin que usted reciba una notificación.
    B: Se le multará con $500 de inmediato.
    C: El registro de su vehículo será cancelado permanentemente.
    D: Debe volver a tomar el examen escrito de conducir.
  answer: A
  explanation: Según el manual, no notificar a Service Oklahoma cuando cambia su nombre
    o dirección puede resultar en la suspensión de su licencia sin que reciba una
    notificación de la suspensión.
- id: 60
  category: penalties_and_points
  question: ¿Cuál es la sanción al ser condenado por conducir sin una licencia válida?
  choices:
    A: Una multa de hasta $250 y 30 días de cárcel.
    B: Una multa de hasta $500 o 6 meses de cárcel o ambos.
    C: Suspensión obligatoria de los privilegios de conducir por un año.
    D: Una multa de hasta $1,000 e incautación del vehículo.
  answer: B
  explanation: Las sanciones por conducir sin una licencia válida incluyen, tras la
    condena, una multa de hasta $500 o 6 meses de cárcel o ambos.
- id: 61
  category: license_system
  question: ¿Qué significa el código de restricción '9' en una licencia de conducir
    de Oklahoma?
  choices:
    A: El conductor debe usar lentes correctivos.
    B: El conductor está restringido a conducir únicamente motocicletas.
    C: El conductor debe estar acompañado por un conductor con licencia de 21 años
      de edad o más en el asiento delantero.
    D: El conductor solo puede operar un vehículo con transmisión automática.
  answer: C
  explanation: La Restricción 9 significa que el conductor debe estar acompañado por
    un conductor con licencia de 21 años de edad o más en el asiento delantero. Esto
    es para personas que están aprendiendo a conducir.
- id: 62
  category: license_system
  question: ¿Qué código de restricción se coloca en una licencia para personas con
    diabetes dependiente de insulina, que requiere que tengan comida, fruta o caramelos
    a su alcance?
  choices:
    A: Restricción 4
    B: Restricción 5
    C: Restricción 6
    D: Restricción 7
  answer: C
  explanation: La Restricción 6 requiere que el conductor tenga comida, fruta o caramelos
    a su alcance, específicamente para personas con diabetes dependiente de insulina.
- id: 63
  category: license_system
  question: Bajo una Restricción 'T' (Licencia de conducir graduada o GDL), ¿cuáles
    son las horas de conducción estándar permitidas a menos que se viaje por motivos
    de escuela, iglesia o trabajo?
  choices:
    A: 6:00 a.m. a 9:00 p.m.
    B: 5:00 a.m. a 10:00 p.m.
    C: 4:30 a.m. a 9:00 p.m.
    D: 7:00 a.m. a 11:00 p.m.
  answer: B
  explanation: La Restricción 'T' permite conducir de 5 a.m. a 10 p.m., a menos que
    sea por actividades relacionadas con la escuela, la iglesia o el trabajo, o si
    se está acompañado por un conductor con licencia de al menos 21 años.
- id: 64
  category: license_system
  question: Si usted es menor de 16 años y tiene una Restricción '0' (Solo motocicleta),
    ¿entre qué horas se le permite conducir?
  choices:
    A: 5:00 a.m. a 10:00 p.m.
    B: 6:00 a.m. a 8:00 p.m.
    C: 4:30 a.m. a 9:00 p.m.
    D: Desde el amanecer hasta el atardecer
  answer: C
  explanation: Para la Restricción 0, los conductores menores de 16 años están restringidos
    a un motoneta o motocicleta con un desplazamiento de pistón de no más de 300cc,
    para conducir solo entre las 4:30 a.m. y las 9:00 p.m.
- id: 65
  category: penalties_and_points
  question: Service Oklahoma suspenderá la licencia de conducir de un conductor sin
    seguro involucrado en una colisión si hay alguna lesión o daños a la propiedad
    de al menos ¿qué cantidad?
  choices:
    A: $250
    B: $500
    C: $750
    D: $1,000
  answer: B
  explanation: Service Oklahoma suspenderá la licencia de conducir del conductor sin
    seguro y/o del propietario de un vehículo involucrado en una colisión donde haya
    cualquier lesión o daños a la propiedad de $500 o más.
- id: 66
  category: driver_responsibility
  question: ¿Cuál es el límite mínimo de responsabilidad por daños a la propiedad
    requerido por la ley de Oklahoma por accidente?
  choices:
    A: $10,000
    B: $15,000
    C: $20,000
    D: $25,000
  answer: D
  explanation: La ley exige que todos los conductores y/o propietarios de vehículos
    en Oklahoma mantengan límites mínimos de responsabilidad civil, que incluyen $25,000
    por daños a la propiedad por accidente.
- id: 67
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por no presentar el comprobante de seguro
    de responsabilidad civil a un oficial de la ley cuando se le solicite?
  choices:
    A: Una multa de hasta $250, 30 días de cárcel, o ambos, además de la suspensión
      de la licencia y el registro.
    B: Una multa de hasta $500, 6 meses de cárcel, o ambos.
    C: Una condena por delito grave y la revocación permanente de los privilegios
      de conducir.
    D: Una advertencia por la primera infracción y una multa de $100 por la segunda
      infracción.
  answer: A
  explanation: Una condena por incumplimiento de la Ley de Seguro Obligatorio o por
    no presentar el comprobante de seguro puede resultar en una multa de hasta $250.00,
    30 días de cárcel o ambos, y la suspensión de la licencia y el registro.
- id: 68
  category: penalties_and_points
  question: ¿Cuál es la sanción por crear, fabricar o falsificar fraudulentamente
    un formulario de verificación de seguridad (comprobante de seguro)?
  choices:
    A: Un delito menor simple con una multa de $50.
    B: Una condena por delito grave que conlleva sanciones severas en forma de multas
      y/o encarcelamiento.
    C: Una suspensión obligatoria de 30 días de los privilegios de conducir únicamente.
    D: Una multa de hasta $250 y 6 meses de cárcel.
  answer: B
  explanation: Crear, fabricar o falsificar fraudulentamente un formulario de verificación
    de seguridad puede resultar en una condena por delito grave que conlleva sanciones
    severas tanto en multas como en encarcelamiento.
- id: 69
  category: safe_driving_rules
  question: De acuerdo con los requisitos de seguridad obligatorios de Oklahoma, ¿quién
    está obligado a usar un sistema de cinturón de seguridad debidamente ajustado
    y abrochado?
  choices:
    A: Solo el conductor
    B: Todo conductor y pasajero del asiento delantero
    C: Solo los pasajeros menores de 18 años
    D: Todos los pasajeros del vehículo independientemente de su posición en el asiento
  answer: B
  explanation: El manual establece que todo conductor y pasajero del asiento delantero
    debe usar un sistema de cinturón de seguridad debidamente ajustado y abrochado.
- id: 70
  category: safe_driving_rules
  question: ¿Un conductor debe proporcionar un sistema de retención infantil para
    cualquier niño transportado que sea menor de qué edad?
  choices:
    A: 4 años de edad
    B: 6 años de edad
    C: 8 años de edad
    D: 10 años de edad
  answer: C
  explanation: Todo conductor, al transportar a un niño menor de 8 años en un vehículo
    motorizado, debe velar por la protección de dicho niño utilizando adecuadamente
    un sistema de retención infantil.
- id: 71
  category: driver_responsibility
  question: Si permite que una persona sin licencia conduzca su vehículo, ¿quién está
    infringiendo la ley?
  choices:
    A: Solo el conductor sin licencia
    B: Solo el dueño del vehículo
    C: Tanto usted como la persona a la que dejó conducir el automóvil
    D: Ninguno, siempre que el dueño esté en el asiento del pasajero
  answer: C
  explanation: Incluso si lo acompaña un conductor con licencia, usted está infringiendo
    la ley si no tiene una licencia o un permiso de aprendizaje (Learner Permit).
    Tanto usted como la persona que le permite conducir el automóvil pueden ser arrestados.
- id: 72
  category: license_system
  question: ¿Qué debe hacer si una restricción en su licencia ya no es necesaria o
    es un error?
  choices:
    A: Tacharla en su licencia física con un marcador permanente.
    B: Comunicarse con un examinador de licencias de conducir en una ubicación de
      Service Oklahoma.
    C: Esperar hasta que su licencia expire y solicitar el cambio al renovarla.
    D: Enviar una carta por correo al departamento de policía local.
  answer: B
  explanation: Cuando una restricción ya no es necesaria, como una restricción de
    aprendizaje o física, o si es un error, comuníquese con un examinador de licencias
    de conducir en una ubicación de Service Oklahoma.
- id: 73
  category: safe_driving_rules
  question: ¿Hasta qué edad debe un sistema de retención infantil para pasajeros estar
    orientado hacia atrás, a menos que el niño alcance el límite de peso o altura
    del fabricante?
  choices:
    A: 1 año
    B: 2 años
    C: 3 años
    D: 4 años
  answer: B
  explanation: El manual establece que un sistema de retención infantil para pasajeros
    debe estar orientado hacia atrás hasta que el niño cumpla 2 años de edad o hasta
    que el niño alcance el límite de peso o altura del sistema.
- id: 74
  category: safe_driving_rules
  question: ¿Dónde recomienda la Administración de Seguridad Vial (Highway Safety
    Administration) colocar a los niños menores de 12 años si su vehículo tiene una
    bolsa de aire (airbag) en el lado del pasajero?
  choices:
    A: En el asiento delantero con la bolsa de aire desactivada
    B: En el asiento delantero con cinturón de seguridad
    C: En el asiento trasero
    D: En un asiento elevado (booster seat) en la parte delantera
  answer: C
  explanation: Si su automóvil está equipado con una bolsa de aire en el lado del
    pasajero, la Administración de Seguridad Vial recomienda colocar a los niños menores
    de 12 años en el asiento trasero debido a la potencia explosiva de las bolsas
    de aire.
- id: 75
  category: defensive_driving
  question: Según el manual, ¿por qué el asiento trasero es al menos un 26 por ciento
    más seguro que el asiento delantero?
  choices:
    A: Tiene más bolsas de aire
    B: La mayoría de los choques graves involucran la parte delantera del vehículo
    C: Los cinturones de seguridad son más fuertes
    D: Está más cerca del centro de gravedad del vehículo
  answer: B
  explanation: Incluso sin bolsas de aire, el asiento trasero es al menos un 26 por
    ciento más seguro que el asiento delantero porque la mayoría de los choques graves
    involucran la parte delantera del vehículo.
- id: 76
  category: signs_and_signals
  question: ¿Qué color se utiliza para las señales de advertencia general?
  choices:
    A: Naranja
    B: Amarillo
    C: Verde amarillento fluorescente
    D: Rojo
  answer: B
  explanation: Según la tabla de colores de señales del manual, el amarillo se utiliza
    para las señales de advertencia general.
- id: 77
  category: signs_and_signals
  question: ¿Qué forma se utiliza siempre para una señal reglamentaria que le informa
    sobre leyes, regulaciones o instrucciones?
  choices:
    A: Diamante
    B: Octágono
    C: Rectángulo
    D: Triángulo
  answer: C
  explanation: El manual establece que un rectángulo es siempre una señal reglamentaria,
    que le informa sobre leyes y regulaciones o le da instrucciones.
- id: 78
  category: penalties_and_points
  question: ¿Cuál es la pena máxima si una persona daña o retira un dispositivo de
    control de tráfico y esto resulta en lesiones personales o la muerte?
  choices:
    A: Un delito menor y una multa de $500
    B: Un delito grave (felony) castigado con hasta 2 años de prisión y una multa
      de $1,000
    C: Un delito grave castigado con hasta 5 años de prisión
    D: Una multa de $5,000 y la revocación de la licencia
  answer: B
  explanation: Si dañar o retirar un dispositivo de control de tráfico resulta en
    lesiones personales o la muerte, la persona será culpable de un delito grave (felony)
    castigado con prisión por no más de 2 años y una multa de $1,000.00 o ambas.
- id: 79
  category: signs_and_signals
  question: Al acercarse a una señal de PARE (STOP) roja de forma octagonal, ¿dónde
    debe detenerse por completo?
  choices:
    A: Solo si hay otros vehículos presentes
    B: Después de entrar en la intersección
    C: Antes del paso de peatones, incluso si no está marcado
    D: En la ubicación exacta del poste de la señal
  answer: C
  explanation: En una señal de PARE (STOP), debe detenerse por completo antes del
    paso de peatones, incluso si no está marcado, y permanecer detenido hasta que
    el camino esté despejado.
- id: 80
  category: safe_driving_rules
  question: ¿Qué indica una señal de límite de velocidad?
  choices:
    A: La velocidad sugerida para la carretera
    B: La velocidad mínima a la que puede viajar
    C: La velocidad más alta a la que puede viajar en condiciones ideales
    D: La velocidad que debe mantener en todo momento
  answer: C
  explanation: Una señal de límite de velocidad es una señal reglamentaria que muestra
    la velocidad más alta a la que puede viajar en condiciones ideales.
- id: 81
  category: signs_and_signals
  question: ¿Qué indican las señales en forma de diamante con fondo amarillo y letras
    negras?
  choices:
    A: Áreas recreativas y culturales
    B: Condiciones inmediatamente adelante, como peligros en la carretera o cambios
      de dirección
    C: Leyes y regulaciones de tránsito
    D: Construcción y mantenimiento de carreteras
  answer: B
  explanation: Las señales de advertencia tienen forma de diamante, con fondo amarillo
    y letras negras. Indican condiciones inmediatamente adelante, como peligros en
    la carretera o cambios de dirección.
- id: 82
  category: vehicle_information
  question: ¿Qué debe considerar hacer cuando ve una señal de advertencia de una colina
    empinada adelante?
  choices:
    A: Poner el vehículo en punto muerto (neutral)
    B: Usar una marcha más baja para reducir la velocidad de su vehículo
    C: Acelerar para mantener la velocidad
    D: Encender las luces de emergencia
  answer: B
  explanation: Al acercarse a una colina empinada, todos los conductores deben aproximarse
    con precaución y pueden optar por usar una marcha más baja para reducir la velocidad
    del vehículo.
- id: 83
  category: signs_and_signals
  question: En una señal de advertencia o barricada, ¿qué significan las franjas diagonales
    con inclinación hacia abajo a la derecha?
  choices:
    A: Mantenerse a la izquierda
    B: Mantenerse a la derecha
    C: La carretera está cerrada más adelante
    D: Prepárese para detenerse
  answer: B
  explanation: Las franjas con inclinación hacia abajo a la derecha significan mantenerse
    a la derecha. Las franjas diagonales muestran la dirección en la que debe pasar
    el tráfico.
- id: 84
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril con una señal de advertencia anticipada,
    ¿a qué distancia de la primera vía debe estar preparado para detenerse?
  choices:
    A: De 5 a 10 pies
    B: De 15 a 50 pies
    C: De 50 a 100 pies
    D: De 100 a 200 pies
  answer: B
  explanation: Cuando vea una señal de advertencia anticipada de vías de ferrocarril,
    debe reducir la velocidad y estar preparado para detenerse a una distancia de
    entre 15 y 50 pies de la primera vía.
- id: 85
  category: sharing_the_road
  question: ¿Cuál de los siguientes vehículos está obligado por ley a detenerse en
    un cruce de ferrocarril?
  choices:
    A: Un automóvil de pasajeros con un remolque
    B: Una camioneta (pickup)
    C: Un autobús escolar
    D: Una motocicleta
  answer: C
  explanation: Los autobuses escolares, autobuses de iglesias, autocares y cualquier
    vehículo que transporte explosivos o líquidos inflamables están obligados por
    ley a detenerse en los cruces de ferrocarril.
- id: 86
  category: safe_driving_rules
  question: ¿Cómo debe estar asegurado en un vehículo un niño que tiene al menos 4
    años pero menos de 8 años, y mide menos de 4 pies y 9 pulgadas?
  choices:
    A: Mediante un sistema de retención infantil o un cinturón de seguridad
    B: Solo mediante un asiento de seguridad orientado hacia atrás
    C: Solo siendo sostenido por un adulto
    D: No es obligatorio que estén sujetos en el asiento trasero
  answer: A
  explanation: Un niño de al menos 4 años de edad pero menor de 8 años, si no mide
    más de 4 pies y 9 pulgadas de altura, debe estar debidamente asegurado mediante
    el uso de un sistema de retención infantil o un cinturón de seguridad.
- id: 87
  category: signs_and_signals
  question: ¿Cuál es el propósito de un carril de "Solo carril central" (Center Lane
    Only) marcado con flechas de giro a la izquierda?
  choices:
    A: Para rebasar vehículos lentos
    B: Para estacionarse temporalmente
    C: Entrar únicamente para realizar un giro a la izquierda
    D: Para realizar giros en U únicamente
  answer: C
  explanation: La señal de "Solo carril central" indica que debe entrar en este carril
    únicamente para realizar un giro a la izquierda, y no debe rebasar a otros vehículos
    en este carril.
- id: 88
  category: sharing_the_road
  question: ¿Qué significa cuando un cruce de ferrocarril se encuentra dentro de una
    "Zona de Silencio" (Quiet Zone)?
  choices:
    A: Los trenes nunca harán sonar sus bocinas bajo ninguna circunstancia.
    B: Los trenes no tocan la bocina durante la operación normal, pero pueden hacerlo
      en caso de emergencia.
    C: Los vehículos deben apagar sus radios antes de cruzar las vías.
    D: El cruce no tiene luces intermitentes ni barreras.
  answer: B
  explanation: En una Zona de Silencio, los trenes no harán sonar las bocinas durante
    la operación normal, pero la bocina aún puede sonar en situaciones de emergencia
    u otras razones de seguridad.
- id: 89
  category: penalties_and_points
  question: ¿Qué sucede con las multas por exceso de velocidad en una zona de construcción
    o mantenimiento cuando hay trabajadores o equipos presentes?
  choices:
    A: Se reducen a la mitad.
    B: Siguen siendo las mismas que las multas normales por exceso de velocidad.
    C: Se duplican.
    D: Se triplican.
  answer: C
  explanation: Las multas por exceso de velocidad se duplican en una zona de construcción
    o mantenimiento cuando hay trabajadores o equipos presentes.
- id: 90
  category: penalties_and_points
  question: ¿Cuál es la sanción por no obedecer las señales, señales luminosas y marcas
    de construcción y mantenimiento?
  choices:
    A: Una advertencia por la primera infracción.
    B: Una condena por delito grave con hasta 1 año de cárcel.
    C: Un delito menor castigado con una multa de $100 a $1,000 y/o hasta 30 días
      de cárcel.
    D: Una suspensión obligatoria de la licencia por 6 meses.
  answer: C
  explanation: Tras una condena, no obedecer las señales de construcción es un delito
    menor castigado con una multa de entre $100.00 y $1,000.00 y/o hasta 30 días de
    cárcel, además de la responsabilidad por daños o lesiones.
- id: 91
  category: vehicle_information
  question: 'El emblema de Vehículo de Movimiento Lento (SMV) se utiliza en vehículos
    que circulan por carreteras públicas a velocidades de:'
  choices:
    A: 15 MPH o menos.
    B: 25 MPH o menos.
    C: 35 MPH o menos.
    D: 45 MPH o menos.
  answer: B
  explanation: El emblema de Vehículo de Movimiento Lento se utiliza en equipos que
    circulan por carreteras públicas a velocidades de 25 MPH o menos.
- id: 92
  category: signs_and_signals
  question: En las autopistas interestatales de norte a sur, ¿dónde comienza la numeración
    de los postes de millaje?
  choices:
    A: En la línea estatal del norte.
    B: En la línea estatal del sur.
    C: En la línea estatal del este.
    D: En la línea estatal del oeste.
  answer: B
  explanation: La numeración de los postes de millaje en las autopistas de norte a
    sur comienza en la línea sur, y en las autopistas de este a oeste en la línea
    oeste.
- id: 93
  category: safe_driving_rules
  question: Según el manual, ¿cuál es el único lugar legal en la carretera donde se
    puede tirar basura?
  choices:
    A: En la cuneta al lado derecho de la carretera.
    B: En cualquier rampa de salida de la autopista.
    C: En una señal de barril de basura ubicada en áreas de descanso, áreas de picnic
      y estaciones de peaje.
    D: Por la ventana, siempre que sea biodegradable.
  answer: C
  explanation: La señal de barril de basura marca el único lugar legal en la carretera
    donde se puede tirar basura. Los barriles de basura se encuentran en todas las
    áreas de descanso y picnic y en todas las estaciones de peaje de las autopistas
    de cuota (turnpikes).
- id: 94
  category: signs_and_signals
  question: ¿Cómo saben las personas daltónicas el color de un semáforo vertical estándar?
  choices:
    A: Por la forma de la carcasa de la luz.
    B: 'Por la posición de las luces: Rojo arriba, Amarillo en el medio, Verde abajo.'
    C: Por el brillo de las bombillas.
    D: Por el patrón de parpadeo de las luces.
  answer: B
  explanation: 'Las personas daltónicas conocen el color por la posición de las luces:
    Rojo arriba — Amarillo en el medio — Verde abajo.'
- id: 95
  category: safe_driving_rules
  question: Después de detenerse por completo en un semáforo en rojo, ¿cuándo se le
    permite girar a la izquierda?
  choices:
    A: Nunca se puede girar a la izquierda con luz roja.
    B: Al girar de una calle de doble sentido a una calle de sentido único.
    C: Al girar de una calle de sentido único a otra calle de sentido único, a menos
      que las señales lo prohíban.
    D: Solo entre las doce de la noche y las 6:00 AM.
  answer: C
  explanation: Después de detenerse por completo, puede girar a la izquierda desde
    una calle de sentido único hacia otra calle de sentido único, a menos que haya
    señales que prohíban el giro.
- id: 96
  category: signs_and_signals
  question: ¿Qué debe hacer al acercarse a una intersección con una flecha amarilla
    intermitente para girar a la izquierda?
  choices:
    A: Detenerse por completo y esperar a una flecha verde.
    B: Reducir la velocidad y proceder con precaución al girar a la izquierda después
      de ceder el paso al tráfico que viene en sentido contrario y a los peatones.
    C: Acelerar para despejar la intersección rápidamente.
    D: Tratarla como una parada de cuatro vías.
  answer: B
  explanation: Una flecha amarilla intermitente significa que debe reducir la velocidad
    y proceder con precaución al girar a la izquierda después de ceder el paso al
    tráfico que viene en sentido contrario y a los peatones.
- id: 97
  category: signs_and_signals
  question: 'Una luz roja intermitente en una intersección peligrosa significa lo
    mismo que una:'
  choices:
    A: Señal de ceda el paso (Yield).
    B: Señal de alto (Stop).
    C: Señal de advertencia.
    D: Señal de No Entrar.
  answer: B
  explanation: 'Una luz roja intermitente significa lo mismo que una señal de alto:
    puede avanzar cuando sea seguro cruzar la intersección.'
- id: 98
  category: safe_driving_rules
  question: Si un oficial de tránsito está dirigiendo el tráfico en una intersección
    con semáforos en funcionamiento, ¿qué debe hacer?
  choices:
    A: Obedecer los semáforos e ignorar al oficial.
    B: Obedecer al oficial de tránsito en todo momento, incluso si contradice las
      señales.
    C: Tratar la intersección como una parada de cuatro vías.
    D: Hacerse a un lado y esperar a que el oficial se retire.
  answer: B
  explanation: Debe obedecer las señales de tráfico, excepto cuando un oficial esté
    dirigiendo el tráfico. En ese caso, debe obedecer al oficial de tránsito en todo
    momento.
- id: 99
  category: signs_and_signals
  question: ¿Qué indica una señal peatonal de "Don't Walk" (No cruzar) intermitente?
  choices:
    A: Los peatones deben cruzar la calle corriendo.
    B: Los peatones pueden bajar de la acera si se dan prisa.
    C: Los peatones no deben bajar de la acera, pero deben continuar si ya se encuentran
      en la intersección.
    D: Todos los vehículos deben detenerse inmediatamente.
  answer: C
  explanation: Una señal de "Don't Walk" intermitente significa que los peatones no
    deben bajar de la acera, pero deben continuar si ya se encuentran en la intersección.
- id: 100
  category: signs_and_signals
  question: ¿Qué indica una señal de control de carril con una "X" amarilla?
  choices:
    A: El carril está abierto al tráfico.
    B: Debe despejar el carril.
    C: Está conduciendo en la dirección equivocada.
    D: Debe detenerse inmediatamente en ese carril.
  answer: B
  explanation: Una señal de control de carril con una "X" amarilla significa que debe
    despejar el carril. Si es intermitente, se permite un giro a la izquierda.
- id: 101
  category: signs_and_signals
  question: ¿Qué significa una línea amarilla continua en su carril junto a una línea
    amarilla discontinua?
  choices:
    A: El adelantamiento está permitido para el tráfico en su carril.
    B: Usted se encuentra en una calle de sentido único.
    C: No adelantar.
    D: Debe girar a la izquierda en la siguiente intersección.
  answer: C
  explanation: Una línea amarilla continua en su carril significa "NO ADELANTAR".
    El adelantamiento solo está permitido si la línea discontinua está en su carril.
- id: 102
  category: safe_driving_rules
  question: Cuando dos vehículos se aproximan al mismo tiempo a una intersección sin
    señales de alto o semáforos, ¿quién tiene el derecho de paso?
  choices:
    A: El conductor de la derecha cede el paso al conductor de la izquierda.
    B: El conductor de la izquierda cede el paso al conductor de la derecha.
    C: El vehículo que viaja más rápido tiene el derecho de paso.
    D: El vehículo más grande tiene el derecho de paso.
  answer: B
  explanation: En las intersecciones sin señales de alto o semáforos, cuando dos vehículos
    se aproximan al mismo tiempo, el conductor de la izquierda cede el paso al conductor
    de la derecha.
- id: 103
  category: sharing_the_road
  question: ¿A qué distancia debe detenerse un vehículo de una persona ciega en la
    calzada o en una intersección?
  choices:
    A: 5 pies
    B: 10 pies
    C: 15 pies
    D: 20 pies
  answer: C
  explanation: La ley establece que un vehículo debe detenerse a 15 pies de una persona
    ciega en la calzada o en una intersección.
- id: 104
  category: penalties_and_points
  question: ¿Cuál es la sanción por no detenerse ante un autobús escolar con las luces
    rojas de carga/descarga parpadeando?
  choices:
    A: Una multa de $500 y 30 días de cárcel.
    B: Revocación obligatoria de la licencia de conducir por un año.
    C: Suspensión de la licencia de conducir por 6 meses.
    D: Una advertencia por la primera infracción.
  answer: B
  explanation: Es obligatoria la revocación de la licencia de conducir por un año
    por no detenerse ante un autobús escolar con las luces rojas de carga/descarga
    parpadeando.
- id: 105
  category: safe_driving_rules
  question: Según la Ley de Moverse a un Lado (Ley Bernardo-Mills), ¿qué debe hacer
    al acercarse a un vehículo estacionado con luces intermitentes en una carretera
    de varios carriles?
  choices:
    A: Detenerse inmediatamente y esperar instrucciones.
    B: Tocar la bocina para advertir al vehículo estacionado.
    C: Cambiarse a un carril que no esté junto al vehículo detenido si es seguro hacerlo.
    D: Mantener su velocidad y permanecer en el carril derecho.
  answer: C
  explanation: En una carretera de varios carriles que va en su dirección, debe cambiarse
    a un carril que no esté junto al vehículo detenido si es seguro hacerlo, o reducir
    la velocidad y conducir con cuidado si no puede cambiar de carril de manera segura.
- id: 106
  category: sharing_the_road
  question: ¿Cómo debe tratar un cortejo fúnebre en una intersección?
  choices:
    A: El cortejo debe detenerse en todas las luces rojas y señales de alto.
    B: Los vehículos del cortejo pueden seguir al vehículo guía a través de la intersección
      independientemente de los dispositivos de control de tráfico.
    C: El cortejo debe ceder el paso a todo el resto del tráfico en las intersecciones.
    D: El cortejo solo puede avanzar sin detenerse si es escoltado por la policía.
  answer: B
  explanation: Cuando el vehículo guía del funeral entra en una intersección, los
    vehículos restantes del cortejo pueden seguir a través de la intersección independientemente
    de cualquier dispositivo de control de tráfico.
- id: 107
  category: defensive_driving
  question: ¿Cuál es la técnica adecuada de control de velocidad al cruzar una intersección?
  choices:
    A: Mantener una velocidad constante antes y durante el cruce.
    B: Acelerar antes de entrar y reducir la velocidad al cruzar.
    C: Reducir la velocidad antes de entrar y luego aumentar su velocidad hasta haber
      despejado la intersección.
    D: Detenerse en medio de la intersección para verificar el tráfico.
  answer: C
  explanation: Debe reducir la velocidad antes de entrar y luego aumentar su velocidad
    hasta haber despejado la intersección. NO reduzca la velocidad mientras gira o
    cruza.
- id: 108
  category: safe_driving_rules
  question: Si un oficial de policía le indica que se detenga mientras conduce por
    el carril izquierdo, ¿qué debe hacer?
  choices:
    A: Detenerse en el arcén izquierdo inmediatamente.
    B: Detenerse en su carril actual y encender las luces de emergencia.
    C: Detenerse en el arcén derecho, incluso si eso significa cruzar varios carriles
      de tráfico.
    D: Acelerar para encontrar la salida más cercana.
  answer: C
  explanation: Si un oficial le indica que se detenga mientras conduce por el carril
    izquierdo, aún debe detenerse en el arcén derecho, incluso si eso significa cruzar
    varios carriles de tráfico.
- id: 109
  category: sharing_the_road
  question: ¿En cuál de las siguientes situaciones NO es obligatorio detenerse ante
    un autobús escolar?
  choices:
    A: Cuando llega tarde al trabajo.
    B: Cuando el autobús está en una calzada diferente o en una carretera dividida.
    C: Cuando el conductor del autobús le hace señas.
    D: Cuando no hay niños visibles alrededor del autobús.
  answer: B
  explanation: NO tiene que detenerse ante un autobús escolar cuando el autobús está
    en una calzada diferente o cuando se aproxima al tráfico en una carretera dividida.
- id: 110
  category: defensive_driving
  question: ¿Qué es un 'choque secundario'?
  choices:
    A: Un choque que involucra a más de dos vehículos.
    B: Cualquier choque que ocurra debido a otro choque o incidente, a menudo debido
      a conductores distraídos.
    C: Un choque que ocurre en una carretera secundaria o calle lateral.
    D: Una colisión menor que no produce heridos.
  answer: B
  explanation: Un choque secundario es cualquier choque que ocurre debido a otro choque
    o incidente. Muchas veces, los choques secundarios ocurren porque un conductor
    se distrae con la vista de un choque y aparta los ojos de la carretera.
- id: 111
  category: safe_driving_rules
  question: ¿Qué debe hacer si el tráfico está detenido y bloquea una intersección
    que desea cruzar?
  choices:
    A: Entrar en la intersección y esperar hasta que el tráfico se despeje.
    B: Tocar la bocina hasta que los vehículos se muevan.
    C: Detenerse antes de llegar al paso de peatones y esperar a que el tráfico avance.
    D: Maniobrar alrededor de los vehículos detenidos utilizando el carril contrario.
  answer: C
  explanation: Si el tráfico está detenido y bloquea una intersección, deténgase antes
    de llegar al paso de peatones y espere a que el tráfico avance.
- id: 112
  category: safe_driving_rules
  question: 'Al entrar en una vía pública desde una entrada privada o un callejón,
    usted debe:'
  choices:
    A: Ceder el paso solo a los vehículos, no a los peatones.
    B: Detenerse antes de la acera o el paso de peatones, y luego avanzar cuando sea
      seguro hacerlo.
    C: Acelerar rápidamente para incorporarse al tráfico sin detenerse.
    D: Tocar la bocina y avanzar sin detenerse.
  answer: B
  explanation: Al entrar o cruzar una vía pública desde una vía privada, callejón,
    entrada o edificio, debe detenerse antes de la acera o el paso de peatones, y
    luego avanzar cuando sea seguro hacerlo.
- id: 113
  category: signs_and_signals
  question: ¿Qué es una de las cosas que le indican las marcas amarillas y blancas
    en el pavimento?
  choices:
    A: El límite de velocidad exacto de la carretera.
    B: Dónde la visibilidad es limitada y rebasar es peligroso.
    C: La distancia a la siguiente ciudad principal.
    D: Dónde el estacionamiento es gratuito.
  answer: B
  explanation: Las marcas amarillas y blancas en el pavimento le indican qué carril
    debe utilizar, dónde la visibilidad es limitada y rebasar es peligroso, dónde
    el tráfico viaja hacia usted y dónde puede esperar con seguridad para realizar
    un giro a la izquierda.
- id: 114
  category: driver_responsibility
  question: ¿Qué debe hacer si otro conductor no sigue las reglas del derecho de paso?
  choices:
    A: Mantener su curso y velocidad para hacer valer su derecho de paso.
    B: Cederles el paso cuando exista la posibilidad de daños o lesiones.
    C: Tocar la bocina y obligarlos a detenerse.
    D: Denunciarlos a la policía inmediatamente mientras conduce.
  answer: B
  explanation: Cuando otras personas no siguen las reglas del derecho de paso, usted
    debe ceder el paso —incluso si el derecho de paso le pertenece— cuando exista
    la posibilidad de daños o lesiones.
- id: 115
  category: defensive_driving
  question: ¿Cuál de las siguientes acciones NO debe realizar al acercarse a una escena
    de Gestión de Incidentes de Tráfico (TIM)?
  choices:
    A: Reducir la velocidad y proceder con precaución.
    B: Cambiarse a otro carril si es posible.
    C: Mirar con curiosidad (Rubbernecking) para ver qué sucedió.
    D: Seguir las instrucciones del personal de emergencia.
  answer: C
  explanation: Al acercarse a una escena de TIM, el conductor debe mantenerse alerta,
    cambiarse de carril, reducir la velocidad, seguir las instrucciones y 'No mirar
    con curiosidad' (Do not Rubberneck).
- id: 116
  category: sharing_the_road
  question: Al ceder el paso a una persona ciega que cruza la calle, ¿dónde debe detener
    su vehículo?
  choices:
    A: Dentro del paso de peatones para protegerla de otros autos.
    B: Fuera del paso de peatones, no dentro de él.
    C: Sobre las líneas del paso de peatones.
    D: Al menos a 50 pies de distancia del paso de peatones.
  answer: B
  explanation: La ley establece que debe detenerse inmediatamente y dejar pasar a
    la persona, y detenerse fuera del paso de peatones, no dentro de él.
- id: 117
  category: signs_and_signals
  question: ¿Qué indican las líneas amarillas discontinuas en una calzada?
  choices:
    A: El tráfico se mueve en la misma dirección y está prohibido rebasar.
    B: El tráfico se mueve en direcciones opuestas y se permite rebasar cuando sea
      seguro.
    C: El tráfico se mueve en la misma dirección y se permite rebasar.
    D: El tráfico se mueve en direcciones opuestas y está prohibido rebasar.
  answer: B
  explanation: Las líneas amarillas discontinuas significan que el tráfico se mueve
    en direcciones opuestas a cada lado de la línea, y se permite rebasar cuando sea
    seguro.
- id: 118
  category: signs_and_signals
  question: 'Una línea blanca continua entre los carriles de tráfico significa:'
  choices:
    A: El tráfico se mueve en direcciones opuestas y rebasar es seguro.
    B: El tráfico se mueve en la misma dirección, pero rebasar es peligroso.
    C: Se está acercando a una zona de no rebasar en una carretera de doble sentido.
    D: El carril está reservado solo para giros a la izquierda.
  answer: B
  explanation: Una línea blanca continua indica que el tráfico se mueve en la misma
    dirección a cada lado de la línea, pero rebasar es peligroso, como al acercarse
    a una intersección o área de incorporación.
- id: 119
  category: safe_driving_rules
  question: En una carretera de tres carriles, ¿para qué se utiliza el carril central?
  choices:
    A: Para rebasar vehículos más lentos.
    B: Para conducción normal.
    C: Solo para giros a la izquierda.
    D: Para paradas de emergencia.
  answer: C
  explanation: En las carreteras de tres carriles, los conductores de cualquier dirección
    pueden usar el carril central para girar a la izquierda. Debe entrar en este carril
    central solo para realizar un giro a la izquierda y no debe rebasar en este carril.
- id: 120
  category: safe_driving_rules
  question: ¿Por qué es ilegal conducir demasiado lento en una autopista?
  choices:
    A: Causa un desgaste excesivo en el motor de su vehículo.
    B: Es peligroso para el flujo del tráfico.
    C: Reduce la eficiencia del combustible.
    D: Impide que los vehículos de emergencia puedan pasar.
  answer: B
  explanation: El manual establece que conducir demasiado lento en una autopista es
    ilegal porque es peligroso.
- id: 121
  category: defensive_driving
  question: ¿Cuál es la distancia de seguimiento recomendada en una autopista con
    mal tiempo?
  choices:
    A: 2 segundos
    B: 3 segundos
    C: 4 segundos
    D: 5 segundos
  answer: C
  explanation: Debe mantenerse a 3 segundos detrás del vehículo que tiene delante
    en una autopista, pero permita 4 segundos en caso de mal tiempo.
- id: 122
  category: defensive_driving
  question: ¿Con cuánta anticipación debe observar si hay autos frenando, entrando
    o saliendo en una autopista?
  choices:
    A: 5-10 segundos
    B: 10-15 segundos
    C: 15-20 segundos
    D: 20-30 segundos
  answer: C
  explanation: Para evitar colisiones en una autopista, debe observar con 15 a 20
    segundos de anticipación si hay autos frenando, entrando o saliendo.
- id: 123
  category: safe_driving_rules
  question: Si se pasa de su salida en una carretera de acceso controlado, ¿qué debe
    hacer?
  choices:
    A: Cruzar la mediana para dar la vuelta
    B: Retroceder con cuidado por el arcén derecho
    C: Hacer un giro en U en el próximo retorno para vehículos de emergencia
    D: Seguir conduciendo hasta la siguiente salida, salir y volver a entrar en la
      dirección opuesta
  answer: D
  explanation: Nunca dé la vuelta en la autopista ni cruce la mediana. Siga conduciendo
    hasta la siguiente salida, salga y vuelva a entrar en la carretera en la otra
    dirección.
- id: 124
  category: safe_driving_rules
  question: 'Al entrar en una autopista desde un carril de aceleración, usted debe:'
  choices:
    A: Ceder el paso a los vehículos que ya están en la autopista
    B: Forzar su entrada en el carril derecho
    C: Detenerse al final de la rampa y esperar un espacio
    D: Mantener una velocidad de 40 mph independientemente del tráfico
  answer: A
  explanation: Al entrar en la autopista, debe ceder el paso a los vehículos que ya
    están en ella, entrar por el carril de aceleración y ajustar su velocidad.
- id: 125
  category: safe_driving_rules
  question: Al salir de una autopista, ¿con cuánta anticipación debe indicar su giro
    a la derecha?
  choices:
    A: Al menos 50 pies antes de la salida
    B: Al menos 100 pies antes de la salida
    C: Al menos 200 pies antes de la salida
    D: Al menos 500 pies antes de la salida
  answer: B
  explanation: Al salir de la autopista, debe indicar el giro a la derecha al menos
    100 pies antes de la salida.
- id: 126
  category: safe_driving_rules
  question: Antes de desplazarse a la izquierda para rebasar a otro vehículo, ¿cuánta
    carretera despejada debe verificar que haya por delante como mínimo?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: C
  explanation: No se desplace a la izquierda hasta que esté seguro de que puede hacerlo
    de forma segura. Verifique que haya al menos 200 pies de carretera despejada por
    delante sin una 'Zona de no rebasar' (No Passing Zone).
- id: 127
  category: safe_driving_rules
  question: Después de rebasar un auto por la izquierda, ¿cuándo es seguro volver
    al carril derecho?
  choices:
    A: Tan pronto como su parachoques trasero pase el parachoques delantero del otro
      auto
    B: Cuando pueda ver el auto rebasado en su espejo retrovisor
    C: Cuando el auto rebasado le haga señales con las luces delanteras
    D: Tres segundos después de haber rebasado al vehículo
  answer: B
  explanation: Rebase al auto que tiene delante y no regrese al carril derecho hasta
    que pueda ver ese auto en el espejo retrovisor.
- id: 128
  category: safe_driving_rules
  question: ¿Bajo qué condición está legalmente permitido rebasar a un vehículo por
    la derecha?
  choices:
    A: Cuando el vehículo delante de usted está girando o a punto de girar a la izquierda
    B: Conduciendo fuera del pavimento por el arcén
    C: Cuando se encuentra en una zona escolar
    D: Cuando el vehículo de adelante conduce por debajo del límite de velocidad en
      una carretera de dos carriles
  answer: A
  explanation: Puede adelantar y rebasar por la derecha cuando el vehículo que tiene
    delante esté girando o esté a punto de girar a la izquierda. Nunca es legal rebasar
    por la derecha conduciendo fuera del pavimento.
- id: 129
  category: safe_driving_rules
  question: Usted NO debe rebasar a otro vehículo a menos de cuántos pies de una vista
    obstruida, como un puente o un túnel?
  choices:
    A: 50 pies
    B: 100 pies
    C: 200 pies
    D: 500 pies
  answer: B
  explanation: NO REBASE a menos de 100 pies de una vista obstruida o si vehículos
    o peatones pudieran cruzarse en su camino, como en puentes, viaductos, túneles
    o intersecciones.
- id: 130
  category: sharing_the_road
  question: ¿Qué debe hacer si otro vehículo lo está rebasando?
  choices:
    A: Acelerar para que puedan incorporarse detrás de usted
    B: Moverse a la izquierda para bloquearlos si están excediendo la velocidad
    C: Permanecer en su carril y no aumentar su velocidad
    D: Tocar la bocina para alertarlos de su presencia
  answer: C
  explanation: Cuando alguien lo esté rebasando, permanezca en su carril, muévase
    a la derecha si lo están rebasando por la izquierda y no aumente su velocidad.
- id: 131
  category: sharing_the_road
  question: ¿Qué debe hacer si otro vehículo lo está rebasando y un automóvil se aproxima
    en dirección opuesta?
  choices:
    A: Aumentar su velocidad para apartarse rápidamente.
    B: Moverse al carril izquierdo para bloquear al vehículo que lo rebasa.
    C: Reducir la velocidad y permitir que el conductor que lo rebasa se incorpore
      delante de usted.
    D: Tocar la bocina para advertir al conductor que lo rebasa.
  answer: C
  explanation: Si un automóvil se aproxima desde la otra dirección mientras lo están
    rebasando, debe reducir la velocidad y permitir que el conductor que lo rebasa
    se incorpore delante de usted para mantener la seguridad de todos.
- id: 132
  category: safe_driving_rules
  question: ¿Con cuánta anticipación debe hacer la señal antes de girar, reducir la
    velocidad o detenerse?
  choices:
    A: Al menos 50 pies o 1/4 de cuadra.
    B: Al menos 100 pies o 1/3 de cuadra.
    C: Al menos 200 pies o 1/2 cuadra.
    D: Al menos 500 pies.
  answer: B
  explanation: El manual establece que debe hacer la señal durante al menos 100 pies
    o 1/3 de cuadra antes de girar, reducir la velocidad o detenerse.
- id: 133
  category: signs_and_signals
  question: ¿Cuál es la señal manual correcta para indicar que está reduciendo la
    velocidad o deteniéndose?
  choices:
    A: Brazo y mano extendidos hacia afuera.
    B: Brazo y mano apuntando hacia arriba.
    C: Brazo y mano apuntando hacia abajo con la palma hacia atrás.
    D: Agitar la mano de arriba abajo por la ventana.
  answer: C
  explanation: La señal manual adecuada para reducir la velocidad o detenerse es extender
    el brazo y la mano apuntando hacia abajo con la palma hacia atrás.
- id: 134
  category: defensive_driving
  question: ¿Por qué debe evitar girar el volante hacia la izquierda mientras espera
    que pase el tráfico en sentido contrario antes de realizar un giro a la izquierda?
  choices:
    A: Causa un desgaste innecesario en su sistema de dirección asistida.
    B: Si lo golpean por detrás, el impacto puede empujarlo hacia los autos que vienen
      en sentido contrario.
    C: Hace que sea más difícil para los vehículos detrás de usted ver su señal de
      giro.
    D: Es ilegal girar las ruedas mientras está detenido en una intersección.
  answer: B
  explanation: Si lo golpean por detrás mientras sus ruedas están giradas hacia la
    izquierda, el impacto puede empujarlo directamente hacia los autos que vienen
    en sentido contrario. Debe esperar hasta que pueda completar el giro antes de
    girar las ruedas.
- id: 135
  category: vehicle_information
  question: Al realizar un giro, ¿en qué momento debe seleccionar la marcha adecuada?
  choices:
    A: Mientras se encuentra en medio de la intersección.
    B: Justo después de completar el giro.
    C: Antes de entrar en la intersección.
    D: Mientras frena durante el giro.
  answer: C
  explanation: Debe seleccionar la marcha adecuada antes de entrar en la intersección
    y acelerar ligeramente durante el giro. No debe cambiar de marcha en la intersección.
- id: 136
  category: safe_driving_rules
  question: ¿Cuál es la velocidad recomendada al realizar un giro?
  choices:
    A: 10 mph o menos.
    B: 15 mph o menos.
    C: 20 mph o menos.
    D: 25 mph o menos.
  answer: A
  explanation: El manual establece que la velocidad recomendada al girar es de 10
    mph o menos.
- id: 137
  category: safe_driving_rules
  question: Cuando usted y otro conductor se encuentran en una intersección y ambos
    desean girar a la izquierda, ¿cómo deben proceder?
  choices:
    A: Ambos conductores deben girar a la derecha del otro.
    B: El conductor que llegó primero tiene el derecho de paso.
    C: Cada conductor girará a la izquierda del otro.
    D: Ambos conductores deben avanzar y esperar en el centro de la intersección.
  answer: C
  explanation: Al encontrarse con otro conductor en una intersección y ambos querer
    girar a la izquierda, cada uno girará a la izquierda del otro, saliendo desde
    el carril izquierdo y entrando en el carril izquierdo.
- id: 138
  category: vehicle_information
  question: ¿Cuál es la técnica adecuada para mirar hacia atrás al retroceder un vehículo?
  choices:
    A: Confiar totalmente en su espejo retrovisor.
    B: Usar tanto el espejo retrovisor como los espejos laterales.
    C: Colocar el brazo derecho en el respaldo del asiento y mirar directamente a
      través de la ventana trasera.
    D: Abrir la puerta del lado del conductor y mirar hacia atrás.
  answer: C
  explanation: Al retroceder, debe colocar su brazo derecho en el respaldo del asiento
    y mirar directamente a través de la ventana trasera.
- id: 139
  category: safe_driving_rules
  question: Según el manual, ¿cuál de las siguientes acciones NUNCA debe realizar
    al retroceder?
  choices:
    A: Girar el volante ligeramente en la dirección en la que debe moverse la parte
      trasera del vehículo.
    B: Mantener una velocidad lenta.
    C: Usar su espejo retrovisor para retroceder.
    D: Colocar su mano izquierda en la posición de las 12 en punto en el volante.
  answer: C
  explanation: 'El manual establece explícitamente: ''Nunca use su espejo retrovisor
    para retroceder''.'
- id: 140
  category: safe_driving_rules
  question: ¿Qué exige la 'Regla de Velocidad Básica' (Basic Speed Rule) a los conductores?
  choices:
    A: Siempre debe conducir exactamente al límite de velocidad indicado.
    B: Debe conducir a una velocidad que sea segura para las condiciones actuales.
    C: Debe conducir 5 mph por debajo del límite de velocidad por la noche.
    D: Nunca debe conducir más lento que el límite de velocidad indicado.
  answer: B
  explanation: La Regla de Velocidad Básica no establece un límite de velocidad exacto,
    sino que significa que la velocidad a la que puede conducir está limitada por
    las condiciones actuales, lo que requiere que conduzca a una velocidad que sea
    segura y le permita detenerse sin golpear a nadie.
- id: 141
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por violar la Regla Básica de Velocidad?
  choices:
    A: Una multa de $250 y 10 días de cárcel.
    B: Una multa de $500 y la suspensión de su licencia.
    C: Una multa de hasta $654.00 y 30 días de cárcel.
    D: Una multa de $1,000 y 60 días de cárcel.
  answer: C
  explanation: Al ser condenado por exceso de velocidad (violar la Regla Básica de
    Velocidad), se le puede imponer una multa de hasta $654.00 y ser sentenciado a
    30 días de cárcel.
- id: 142
  category: penalties_and_points
  question: ¿Bajo qué circunstancias se duplican las multas por exceso de velocidad?
  choices:
    A: Al conducir de noche en una carretera de dos carriles.
    B: En zonas escolares y de construcción cuando hay trabajadores o equipo presentes.
    C: Al conducir bajo lluvia intensa o niebla.
    D: Al rebasar a otro vehículo en una carretera del condado.
  answer: B
  explanation: Las multas se duplican en zonas escolares y de construcción cuando
    hay trabajadores o equipo presentes.
- id: 143
  category: safe_driving_rules
  question: A menos que se indique lo contrario, ¿cuál es el límite de velocidad estatal
    en las autopistas de peaje (turnpikes)?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: D
  explanation: Según la ley estatal, a menos que se indique lo contrario, el límite
    de velocidad en las autopistas de peaje (turnpikes) es de 80 mph.
- id: 144
  category: safe_driving_rules
  question: ¿Cuál es el límite de velocidad en una zona escolar debidamente señalizada
    en una carretera fuera de un municipio, a menos que se indique lo contrario?
  choices:
    A: 15 mph
    B: 20 mph
    C: 25 mph
    D: 35 mph
  answer: C
  explanation: El límite de velocidad estatal para las zonas escolares en cualquier
    carretera fuera de un municipio en una zona debidamente señalizada es de 25 mph,
    a menos que se indique lo contrario.
- id: 145
  category: defensive_driving
  question: ¿Qué significa 'sobrepasar el alcance de sus luces' (overdrive your lights)
    al conducir de noche?
  choices:
    A: Usar las luces altas al acercarse al tráfico en sentido contrario
    B: Conducir tan rápido que no puede detenerse dentro de la distancia que puede
      ver
    C: Dejar los faros encendidos durante el día
    D: Usar lentes de color que reducen el brillo de sus faros
  answer: B
  explanation: Sobrepasar el alcance de sus luces significa que está conduciendo demasiado
    rápido para detenerse dentro de la distancia que puede ver con sus faros. Debe
    ajustar su velocidad para poder detenerse antes de chocar con objetos delante
    de usted.
- id: 146
  category: defensive_driving
  question: Si sospecha que otro conductor lo está acosando en un incidente de furia
    al volante (road rage), ¿cuál es la acción más segura?
  choices:
    A: Conducir a casa inmediatamente y cerrar sus puertas con llave
    B: Detenerse a un lado de la carretera y confrontar al conductor
    C: Ir a un lugar seguro con gente, como una estación de policía o de bomberos
    D: Acelerar para perder al conductor agresivo en el tráfico
  answer: C
  explanation: 'Si sospecha que otro conductor lo está acosando, vaya a un lugar seguro
    como una estación de policía, de bomberos o una gasolinera donde haya gente, y
    llame al 911 si es necesario. El manual advierte explícitamente: NO conduzca a
    casa.'
- id: 147
  category: vehicle_information
  question: ¿Cuál de los siguientes NO figura como un factor que afecta su distancia
    de frenado?
  choices:
    A: Su propio tiempo de reacción
    B: El peso de su vehículo
    C: El estado de sus frenos
    D: La hora del día
  answer: D
  explanation: La distancia de frenado depende de su tiempo de reacción, las condiciones
    climáticas y de la carretera, el peso de su vehículo y el estado de sus frenos.
    La hora del día no figura como un factor directo para la distancia de frenado.
- id: 148
  category: safe_driving_rules
  question: Durante el proceso de frenado, ¿qué sucede durante el paso de 'reacción'?
  choices:
    A: Usted ve o escucha el peligro
    B: Su cerebro le indica a su pie que frene
    C: Usted presiona el pedal del freno hasta que el auto se detiene
    D: El sistema de frenos antibloqueo de su vehículo se activa
  answer: B
  explanation: Según la tabla de tiempo de percepción, reacción y frenado, el paso
    de reacción es cuando el 'cerebro le indica al pie que frene' y toma aproximadamente
    .66 segundos.
- id: 149
  category: defensive_driving
  question: ¿Cuál es la técnica de frenado adecuada si experimenta un neumático desinflado
    o un reventón?
  choices:
    A: Frenar repentinamente para detenerse lo más rápido posible
    B: Tocar sus frenos ligeramente con un intervalo de aproximadamente un segundo
    C: Quitar el pie del acelerador y aplicar los frenos con precaución
    D: Bombear el pedal del freno rápidamente
  answer: C
  explanation: En caso de un neumático desinflado o un reventón, debe quitar el pie
    del acelerador y aplicar los frenos con precaución. El manual enfatiza que NUNCA
    debe frenar repentinamente.
- id: 150
  category: defensive_driving
  question: Si su vehículo se sale del pavimento, ¿qué debe hacer para regresar a
    la carretera de manera segura?
  choices:
    A: Girar el volante bruscamente hacia la izquierda
    B: Sujetar el volante con firmeza, aplicar los frenos ligeramente y reducir la
      velocidad
    C: Acelerar para ganar tracción en el arcén suelto
    D: Frenar de golpe y detenerse por completo fuera de la carretera
  answer: B
  explanation: Si se sale del pavimento, sujete el volante con firmeza, aplique los
    frenos ligeramente y reduzca su velocidad hasta que pueda regresar al pavimento
    de manera segura.
- id: 151
  category: defensive_driving
  question: Como regla general, ¿qué debe hacer si su automóvil comienza a derrapar
    en una carretera con hielo?
  choices:
    A: Presione el pedal del freno tan fuerte como pueda
    B: Ponga el vehículo en punto muerto (neutral) y use el freno de emergencia
    C: Quite el pie del freno y gire el volante en la dirección del derrape
    D: Gire en la dirección opuesta al derrape y acelere
  answer: C
  explanation: Si el automóvil comienza a derrapar, quite el pie del freno y gire
    el volante en la dirección del derrape, siempre que esto no lo dirija hacia el
    tráfico en sentido contrario o hacia un peligro.
- id: 152
  category: safe_driving_rules
  question: ¿Por qué es probable que las carreteras estén muy resbaladizas justo después
    de que empieza a llover o a lloviznar?
  choices:
    A: La lluvia se congela inmediatamente al golpear el pavimento
    B: Las primeras gotas aflojan la grasa y la suciedad acumuladas, creando una película
      resbaladiza
    C: La lluvia hace que el asfalto se expanda y se vuelva liso
    D: El agua borra las marcas de los carriles pintadas
  answer: B
  explanation: Las carreteras están muy resbaladizas justo después de que empieza
    a llover porque las primeras gotas aflojan la grasa y la suciedad acumuladas en
    la superficie de la carretera, cubriéndola con una película resbaladiza.
- id: 153
  category: defensive_driving
  question: ¿Qué significa "hidroplaneo" (hydroplaning)?
  choices:
    A: Los frenos de su vehículo se bloquean en una superficie mojada
    B: Sus neumáticos pierden contacto con la superficie de la carretera y se desplazan
      sobre una película de agua
    C: El agua entra en el bloque del motor y hace que se apague
    D: Su vehículo se desliza lateralmente sobre hielo negro
  answer: B
  explanation: El hidroplaneo significa que sus neumáticos pierden contacto con la
    superficie de la carretera y se desplazan sobre la película de agua, lo que reduce
    la tracción y aumenta la distancia de frenado.
- id: 154
  category: safe_driving_rules
  question: ¿Cuál es un método recomendado para determinar una distancia de seguimiento
    segura?
  choices:
    A: Deje el espacio de un automóvil por cada 10 millas por hora de velocidad
    B: Mantenga exactamente 50 pies entre usted y el automóvil de adelante en todo
      momento
    C: Deje el espacio de un automóvil por cada 20 millas por hora de velocidad
    D: Use la "regla de los dos segundos" en todas las condiciones climáticas
  answer: A
  explanation: Para mantener un margen de seguridad, el manual recomienda dejar el
    espacio de un automóvil por cada 10 millas por hora de velocidad, o usar la "regla
    de los tres segundos".
- id: 155
  category: sharing_the_road
  question: Si viaja en una caravana o procesión fúnebre fuera de una zona comercial
    o residencial, ¿cuánto espacio debe dejar entre los vehículos?
  choices:
    A: Al menos 50 pies
    B: Al menos 100 pies
    C: Al menos 200 pies
    D: Al menos 500 pies
  answer: C
  explanation: Si viaja en una caravana o comitiva fuera de una zona comercial o residencial,
    debe dejar al menos 200 pies entre cada vehículo para que otros automóviles o
    camiones puedan entrar en la fila de manera segura.
- id: 156
  category: sharing_the_road
  question: ¿Por qué puede ser peligroso seguir a un camión demasiado de cerca a altas
    velocidades o en pavimento mojado?
  choices:
    A: Los camiones siempre tardan mucho más en detenerse que los automóviles en condiciones
      de humedad
    B: El escape del camión oscurecerá su visión
    C: Los camiones pueden tener mejor tracción y ser capaces de detenerse más rápido
      que un automóvil
    D: El camión hidroplaneará más fácilmente que un automóvil
  answer: C
  explanation: A altas velocidades o en pavimento mojado, los camiones pueden tener
    mejor tracción y ser capaces de detenerse más rápido que un automóvil. Si los
    sigue demasiado de cerca, es posible que no pueda detenerse a tiempo para evitar
    chocar por detrás al camión.
- id: 157
  category: defensive_driving
  question: Al conducir sobre hielo, nieve o grava en un vehículo con frenos estándar,
    ¿cómo debe aplicar los frenos para detenerse?
  choices:
    A: Pise los frenos a fondo para bloquear las ruedas
    B: Toque los frenos ligeramente, con un intervalo de aproximadamente un segundo
    C: Presione el pedal del freno con firmeza y manténgalo presionado
    D: Bombee los frenos lo más rápido posible
  answer: B
  explanation: 'En hielo, nieve, aguanieve, grava, arena y otras superficies sueltas,
    debe tocar los frenos ligeramente, con un intervalo de aproximadamente un segundo.
    Frenar repentinamente puede hacer que el automóvil derrape. (Nota: Nunca toque
    repetidamente los frenos antibloqueo).'
- id: 158
  category: sharing_the_road
  question: ¿Por qué un camión podría detenerse más rápido que un automóvil a altas
    velocidades o en pavimento mojado?
  choices:
    A: Tienen chasis más ligeros.
    B: Tienen mejor tracción.
    C: Tienen frenos antibloqueo especializados.
    D: Tienen un centro de gravedad más bajo.
  answer: B
  explanation: Según el manual, a altas velocidades o en pavimento mojado, los camiones
    pueden tener mejor tracción y ser capaces de detenerse más rápido que un automóvil.
- id: 159
  category: safe_driving_rules
  question: Al seguir a otro vehículo, ¿cuál es la distancia de seguimiento recomendada
    según su velocidad?
  choices:
    A: El espacio de un automóvil por cada 10 mph de velocidad.
    B: El espacio de dos automóviles por cada 10 mph de velocidad.
    C: El espacio de un automóvil por cada 5 mph de velocidad.
    D: El espacio de tres automóviles por cada 20 mph de velocidad.
  answer: A
  explanation: El manual recomienda dejar al menos el espacio de un automóvil por
    cada 10 mph de velocidad o aplicar la regla de los tres segundos.
- id: 160
  category: defensive_driving
  question: Para aumentar su tiempo de respuesta y ayudar a evitar colisiones por
    alcance (choques traseros), ¿con cuánta anticipación debe observar las luces de
    freno?
  choices:
    A: Solo el automóvil que está inmediatamente delante de usted.
    B: Dos automóviles más adelante en la fila.
    C: Cuatro o cinco automóviles más adelante en la fila.
    D: Diez automóviles más adelante en la fila.
  answer: C
  explanation: El manual aconseja observar las luces de freno de los cuatro o cinco
    automóviles más adelante en la fila para aumentar su tiempo de respuesta.
- id: 161
  category: defensive_driving
  question: ¿Qué debe hacer si alguien lo sigue demasiado de cerca (tailgating) y
    reducir la velocidad no lo anima a rebasar?
  choices:
    A: Aumentar la velocidad para incrementar la distancia entre ustedes.
    B: Frenar bruscamente para advertirle.
    C: Orillarse, detenerse y dejar que el conductor que lo sigue pase.
    D: Encender las luces de emergencia y mantener su velocidad.
  answer: C
  explanation: Si parpadear las luces de freno y reducir la velocidad no funcionan,
    el manual indica que debe orillarse, detenerse y dejar pasar al conductor que
    lo sigue de cerca en un área segura.
- id: 162
  category: safe_driving_rules
  question: Al dejar su automóvil, camión o camioneta estacionado, ¿cuál de los siguientes
    es un paso obligatorio?
  choices:
    A: Dejar las llaves en el encendido para emergencias.
    B: Poner la marcha en punto muerto (neutral).
    C: Poner el freno de estacionamiento.
    D: Encender las luces de estacionamiento.
  answer: C
  explanation: Al dejar su vehículo, debe poner el freno de estacionamiento, poner
    la marcha en baja, reversa o 'park' (estacionamiento), apagar el motor y bloquear
    el encendido o retirar la llave.
- id: 163
  category: defensive_driving
  question: Si su vehículo se avería en una autopista, ¿qué debe hacer después de
    moverlo completamente fuera de la vía?
  choices:
    A: Pararse en el carril para dirigir el tráfico alrededor de su auto.
    B: Encender las luces intermitentes de emergencia.
    C: Dejar la puerta del lado del conductor abierta para señalar que necesita ayuda.
    D: Hacer que los niños se paren cerca de la carretera para pedir ayuda con las
      manos.
  answer: B
  explanation: Si su vehículo se avería, muévalo completamente fuera de la autopista
    y encienda las luces intermitentes de emergencia.
- id: 164
  category: safe_driving_rules
  question: Al salir en reversa de un espacio de estacionamiento en ángulo, ¿qué debe
    hacer para advertir a los peatones cercanos?
  choices:
    A: Encender las luces altas.
    B: Hacer parpadear las luces de emergencia.
    C: Tocar la bocina suavemente.
    D: Acelerar el motor.
  answer: C
  explanation: Al salir en reversa de un espacio de estacionamiento en ángulo, el
    manual indica a los conductores que toquen la bocina suavemente para advertir
    a los peatones cercanos.
- id: 165
  category: safe_driving_rules
  question: Al estacionarse en paralelo, ¿a qué distancia máxima del bordillo (curb)
    debe estacionarse?
  choices:
    A: A menos de 6 pulgadas.
    B: A menos de 12 pulgadas.
    C: A menos de 18 pulgadas.
    D: A menos de 24 pulgadas.
  answer: C
  explanation: A menos que las señales lo prohíban o el bordillo esté pintado de amarillo,
    puede estacionarse en paralelo a cualquier bordillo y a una distancia máxima de
    18 pulgadas de este.
- id: 166
  category: safe_driving_rules
  question: Al estacionarse en paralelo en una colina, ¿a qué distancia del bordillo
    debe detenerse?
  choices:
    A: A menos de 6 pulgadas.
    B: A menos de 12 pulgadas.
    C: A menos de 18 pulgadas.
    D: A menos de 24 pulgadas.
  answer: A
  explanation: Para estacionarse en una colina, el manual establece que debe estacionarse
    en paralelo como de costumbre, pero detenerse a menos de seis pulgadas del bordillo.
- id: 167
  category: safe_driving_rules
  question: ¿Hacia dónde debe girar las ruedas al estacionarse cuesta abajo con un
    bordillo?
  choices:
    A: Gire las ruedas bruscamente en dirección contraria al bordillo.
    B: Gire las ruedas hacia el bordillo.
    C: Mantenga las ruedas perfectamente rectas.
    D: Gire las ruedas hacia la izquierda.
  answer: B
  explanation: Cuando esté cuesta abajo, debe girar las ruedas hacia el bordillo y
    avanzar lentamente hasta que la rueda esté contra el bordillo.
- id: 168
  category: safe_driving_rules
  question: Al arrancar su vehículo en una colina e incorporarse al tráfico, ¿quién
    tiene el derecho de paso?
  choices:
    A: Usted tiene el derecho de paso porque está entrando al carril.
    B: Los conductores que ya circulan por el carril.
    C: El vehículo que circula a la velocidad más lenta.
    D: Los peatones en el lado opuesto de la calle.
  answer: B
  explanation: Al salir de una posición de estacionamiento en una colina, es su responsabilidad
    esperar a que haya un espacio porque los conductores que ya circulan tienen el
    derecho de paso.
- id: 169
  category: penalties_and_points
  question: ¿Cuál es la sanción por hacer una declaración falsa en una solicitud de
    un cartel de estacionamiento para personas con discapacidad o por usarlo sin autorización?
  choices:
    A: Una advertencia por escrito.
    B: Una multa de hasta $500.
    C: Un delito menor (misdemeanor).
    D: Un delito grave (felony).
  answer: C
  explanation: Hacer una declaración falsa en una solicitud o el uso no autorizado
    de un permiso de estacionamiento para personas con discapacidad es un delito menor
    (misdemeanor).
- id: 170
  category: safe_driving_rules
  question: ¿A cuántos pies de un hidrante de incendios es ilegal estacionarse?
  choices:
    A: 10 pies.
    B: 15 pies.
    C: 20 pies.
    D: 30 pies.
  answer: B
  explanation: El manual enumera los lugares de estacionamiento prohibidos, lo que
    incluye estacionarse a menos de 15 pies de un hidrante de incendios.
- id: 171
  category: safe_driving_rules
  question: ¿A cuántos pies del riel más cercano de un cruce ferroviario no se permite
    estacionar?
  choices:
    A: 15 pies.
    B: 20 pies.
    C: 30 pies.
    D: 50 pies.
  answer: D
  explanation: Es ilegal estacionar a menos de 50 pies del riel más cercano de un
    cruce ferroviario.
- id: 172
  category: safe_driving_rules
  question: ¿Bajo qué circunstancias es legalmente permisible detener o estacionar
    su vehículo en un puente o estructura elevada?
  choices:
    A: Cuando necesite consultar su GPS o dispositivo móvil.
    B: Cuando sea necesario para evitar conflictos con otro tráfico.
    C: Al recoger o dejar a un peatón.
    D: Cuando tenga un permiso de estacionamiento para personas con discapacidad válido.
  answer: B
  explanation: La ley establece que ninguna persona debe detenerse o estacionarse
    en un puente, excepto cuando sea necesario para evitar conflictos con otro tráfico,
    o en cumplimiento de la ley, de un oficial de policía o de un dispositivo de control
    de tráfico.
- id: 173
  category: sharing_the_road
  question: ¿Quién tiene el derecho de paso en un cruce de peatones no marcado?
  choices:
    A: El vehículo que circula al límite de velocidad indicado.
    B: El vehículo que gira a la derecha con semáforo en rojo.
    C: El peatón.
    D: Solo los ciclistas.
  answer: C
  explanation: Los peatones en un cruce de peatones tienen el derecho de paso sobre
    la mayoría de los vehículos, ya sea que el cruce esté marcado o no.
- id: 174
  category: sharing_the_road
  question: ¿Cómo puede identificar a un peatón ciego a quien debe cederle el paso?
  choices:
    A: Lleva un chaleco reflectante amarillo.
    B: Lleva un bastón blanco o cromado o utiliza un perro guía.
    C: Va acompañado de un guardia de cruce.
    D: Lleva una bandera roja.
  answer: B
  explanation: Los conductores deben ceder el paso a los peatones ciegos que lleven
    un bastón blanco o cromado o que utilicen un perro guía.
- id: 175
  category: defensive_driving
  question: Si conduce por una calle de varios carriles y el automóvil en el carril
    de al lado se detiene repentinamente sin motivo aparente, ¿qué debe hacer?
  choices:
    A: Acelerar para rebasar rápidamente al automóvil detenido.
    B: Tocar la bocina para alertar al conductor detenido de que siga avanzando.
    C: Cambiar de carril y continuar al límite de velocidad indicado.
    D: Reducir la velocidad y estar atento, ya que es posible que el conductor se
      haya detenido por un peatón.
  answer: D
  explanation: Si ve que el automóvil en el carril de al lado se detiene repentinamente
    sin motivo aparente, reduzca la velocidad y esté atento. Es posible que ese conductor
    se haya detenido por un peatón.
- id: 176
  category: sharing_the_road
  question: Al alcanzar y rebasar una bicicleta que circula en la misma dirección,
    ¿cuál es la distancia mínima de seguridad que debe dejar entre su vehículo y la
    bicicleta?
  choices:
    A: 2 pies
    B: 3 pies
    C: 4 pies
    D: 5 pies
  answer: B
  explanation: La ley de Oklahoma (Título 47-11-1208-A) exige dejar una distancia
    de seguridad no inferior a 3 pies hasta que el vehículo motorizado haya pasado
    con seguridad la bicicleta rebasada.
- id: 177
  category: safe_driving_rules
  question: Si está a punto de rebasar una bicicleta en una carretera estrecha y cree
    que el ciclista no sabe que usted se acerca, ¿cómo debe indicárselo?
  choices:
    A: Tocar la bocina con fuerza hasta que se mueva.
    B: Acelerar el motor para llamar su atención.
    C: Tocar la bocina brevemente como señal.
    D: Encender y apagar las luces altas repetidamente.
  answer: C
  explanation: Debe tocar la bocina brevemente como señal de que va a pasar. No debe
    tocar la bocina con fuerza ni asustar o intentar intimidar al ciclista de ninguna
    otra manera.
- id: 178
  category: sharing_the_road
  question: ¿Bajo cuál de las siguientes condiciones se le permite a un ciclista ocupar
    el carril de tráfico completo?
  choices:
    A: Cuando el carril es demasiado estrecho para que tanto un automóvil como una
      bicicleta compartan el carril de forma segura uno al lado del otro.
    B: Siempre que circulen por una zona residencial.
    C: Solo cuando circulen de noche.
    D: Cuando circulen por debajo del límite de velocidad indicado.
  answer: A
  explanation: Un ciclista puede circular por el carril completo cuando el carril
    es demasiado estrecho para que tanto un automóvil como una bicicleta compartan
    el carril de forma segura.
- id: 179
  category: signs_and_signals
  question: Si ve una bandera especial en una bicicleta, ¿qué podría indicar sobre
    el ciclista?
  choices:
    A: El ciclista es principiante.
    B: El ciclista transporta materiales peligrosos.
    C: El ciclista puede tener una discapacidad auditiva.
    D: El ciclista es un oficial de la ley.
  answer: C
  explanation: Si ve esta bandera en una bicicleta, reduzca la velocidad; el ciclista
    puede tener una discapacidad auditiva.
- id: 180
  category: safe_driving_rules
  question: Según las pautas de seguridad para bicicletas de Oklahoma, ¿qué puede
    hacer un ciclista al acercarse a una señal de alto (pare) si no hay peligro presente?
  choices:
    A: Debe detenerse por completo durante al menos tres segundos.
    B: Debe bajarse y caminar con la bicicleta a través de la intersección.
    C: Puede continuar a través de la intersección sin detenerse.
    D: Debe esperar a que llegue un vehículo motorizado antes de continuar.
  answer: C
  explanation: En las señales de alto, si no hay peligro presente, los ciclistas pueden
    continuar sin detenerse después de reducir la velocidad.
- id: 181
  category: sharing_the_road
  question: ¿Cómo debe actuar un ciclista ante un semáforo en rojo?
  choices:
    A: Pueden pasar sin reducir la velocidad si no se ven autos.
    B: Deben detenerse antes de entrar en la intersección, pero pueden avanzar si
      es seguro hacerlo.
    C: Deben esperar hasta que la luz cambie a verde en todas las circunstancias.
    D: Se les requiere usar el cruce peatonal para evitar el semáforo en rojo.
  answer: B
  explanation: Los ciclistas deben detenerse ante una luz roja antes de entrar en
    la intersección, ceder el paso a cualquier tráfico que se aproxime y, si es seguro,
    pueden avanzar a través de la luz roja.
- id: 182
  category: defensive_driving
  question: Según las investigaciones, ¿qué causa dos tercios de las colisiones entre
    automóviles y motocicletas?
  choices:
    A: El motociclista que excede el límite de velocidad.
    B: El motociclista que zigzaguea entre carriles.
    C: El conductor de un automóvil que gira delante de la motocicleta.
    D: Malas condiciones climáticas.
  answer: C
  explanation: Las investigaciones muestran que dos tercios de las colisiones entre
    automóviles y motocicletas no son causadas por el motociclista, sino por el conductor
    que giró delante de la motocicleta.
- id: 183
  category: safe_driving_rules
  question: ¿Cuál es la distancia de seguimiento mínima recomendada al conducir detrás
    de una motocicleta?
  choices:
    A: Un segundo
    B: Dos segundos
    C: Tres segundos
    D: Cinco segundos
  answer: C
  explanation: Deje al menos una distancia de seguimiento de tres segundos para que
    el motociclista tenga tiempo suficiente para maniobrar o detenerse en una emergencia.
- id: 184
  category: sharing_the_road
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a compartir
    un carril con una motocicleta?
  choices:
    A: Puede compartir un carril con una motocicleta si el carril es lo suficientemente
      ancho.
    B: No debe intentar compartir un carril con una motocicleta y debe respetar su
      espacio.
    C: Las motocicletas deben circular por el arcén (hombro) para dejar pasar a los
      automóviles.
    D: Puede compartir un carril con una motocicleta solo en áreas residenciales.
  answer: B
  explanation: Las motocicletas tienen derecho a usar el carril. No debe intentar
    compartir un carril con una motocicleta y debe respetar su espacio y posición
    en el tráfico.
- id: 185
  category: sharing_the_road
  question: ¿Por qué debe tener cuidado de no rebasar a una motocicleta demasiado
    cerca o demasiado rápido?
  choices:
    A: La ráfaga de aire puede hacer que una motocicleta pierda el control.
    B: El escape de la motocicleta puede dañar la pintura de su vehículo.
    C: El motociclista podría intentar agarrarse de su vehículo.
    D: Es ilegal rebasar a una motocicleta en una carretera de varios carriles.
  answer: A
  explanation: Rebase como lo haría con un automóvil y no pase demasiado cerca ni
    demasiado rápido, ya que la ráfaga de aire puede hacer que una motocicleta pierda
    el control.
- id: 186
  category: license_system
  question: ¿Qué requisito específico deben cumplir todos los operadores de motocicletas
    con respecto a su licencia de conducir?
  choices:
    A: Deben tener una licencia de conducir comercial (CDL).
    B: Deben tener un endoso M en su licencia de conducir.
    C: Deben llevar una tarjeta de seguro de motocicleta especial.
    D: Deben renovar su licencia cada año.
  answer: B
  explanation: Todos los operadores de motocicletas deben tener un endoso M en su
    licencia de conducir.
- id: 187
  category: sharing_the_road
  question: ¿Dónde ocurren la mayoría de las colisiones y lesiones que involucran
    motocicletas?
  choices:
    A: En autopistas interestatales
    B: En las intersecciones
    C: En estacionamientos
    D: En carreteras rurales de dos carriles
  answer: B
  explanation: Según el manual, la mayoría de las colisiones y lesiones que involucran
    motocicletas ocurren en las intersecciones. Los conductores deben esperar hasta
    que las intenciones del motociclista sean absolutamente claras antes de avanzar.
- id: 188
  category: sharing_the_road
  question: ¿Por qué debe prestar especial atención a las motocicletas por la noche?
  choices:
    A: No están obligadas a usar faros por la noche.
    B: Su único faro delantero y luz trasera pueden mezclarse con las luces de otros
      vehículos.
    C: Viajan mucho más rápido que los automóviles por la noche.
    D: Sus faros son más brillantes y pueden cegar a otros conductores.
  answer: B
  explanation: Por la noche, se puede calcular mal la distancia fácilmente porque
    el único faro delantero y la única luz trasera de una motocicleta pueden mezclarse
    con las luces de otros vehículos.
- id: 189
  category: vehicle_information
  question: Si una motocicleta no está equipada con un parabrisas de suficiente calidad,
    tamaño y grosor, ¿qué debe usar el operador?
  choices:
    A: Un casco integral
    B: Gafas de sol
    C: Gafas protectoras aprobadas por ANSI o material de protección facial
    D: Un chaleco reflectante
  answer: C
  explanation: Los estatutos estatales requieren que, en lugar de un parabrisas, el
    operador de la motocicleta use gafas protectoras aprobadas por ANSI o material
    de protección facial diseñado para proteger contra objetos extraños.
- id: 190
  category: sharing_the_road
  question: ¿Hasta qué distancia detrás de un camión se extiende su punto ciego trasero?
  choices:
    A: Hasta 50 pies
    B: Hasta 100 pies
    C: Hasta 200 pies
    D: Hasta 500 pies
  answer: C
  explanation: Los puntos ciegos de un camión se encuentran inmediatamente delante,
    a ambos lados de la cabina y hasta 200 pies en la parte trasera.
- id: 191
  category: safe_driving_rules
  question: ¿Qué debe hacer si se detiene detrás de un camión en una pendiente ascendente?
  choices:
    A: Manténgase a la derecha en su carril y toque la bocina.
    B: Manténgase a la izquierda en su carril y deje espacio adicional delante de
      su vehículo.
    C: Acérquese lo más posible al parachoques del camión.
    D: Encienda las luces de emergencia.
  answer: B
  explanation: Si se detiene detrás de un camión en una pendiente ascendente, manténgase
    a la izquierda en su carril para que el conductor pueda verlo y deje espacio adicional
    en caso de que el camión retroceda un poco al empezar a moverse.
- id: 192
  category: sharing_the_road
  question: Al rebasar un camión, ¿cómo podría el conductor del camión indicarle que
    tiene vía libre para volver a incorporarse delante de él?
  choices:
    A: Tocando la bocina dos veces
    B: Encendiendo sus luces de emergencia
    C: Parpadeando las luces delanteras del camión
    D: Agitando la mano por la ventana
  answer: C
  explanation: Si el conductor parpadea las luces del camión después de que usted
    lo pase, es una señal de que tiene vía libre para volver a incorporarse delante
    del camión.
- id: 193
  category: defensive_driving
  question: Al encontrarse con un camión que viene en dirección opuesta, ¿por qué
    debe mantenerse lo más a la derecha posible de la carretera?
  choices:
    A: Para evitar un choque lateral y reducir la turbulencia del viento.
    B: Porque la turbulencia del viento succionará su vehículo hacia el camión.
    C: Para darle espacio al camión para hacer un giro amplio a la derecha.
    D: Para permitir que el conductor del camión vea su placa de matrícula.
  answer: A
  explanation: Manténgase lo más a la derecha posible de la carretera para evitar
    un choque lateral y reducir la turbulencia del viento entre usted y el camión.
    La turbulencia separa los vehículos; no los succiona entre sí.
- id: 194
  category: sharing_the_road
  question: ¿Por qué es peligroso meterse en el espacio abierto del lado derecho de
    un camión que está girando a la derecha?
  choices:
    A: El camión acelerará rápidamente durante el giro.
    B: Los camiones hacen giros amplios a la derecha y su automóvil puede ser aplastado
      o golpeado lateralmente.
    C: El conductor del camión bloqueará el carril intencionalmente.
    D: Es ilegal rebasar a cualquier vehículo por la derecha.
  answer: B
  explanation: Los camiones realizan giros amplios a la derecha y a menudo deben dejar
    un espacio abierto en el lado derecho. Si usted se encuentra entre el camión y
    el bordillo, es posible que el conductor no pueda verlo y su automóvil pueda ser
    aplastado o golpeado lateralmente.
- id: 195
  category: safe_driving_rules
  question: Aproximadamente, ¿cuánto tiempo le toma detenerse a un tren que viaja
    a 55 mph?
  choices:
    A: 500 pies
    B: Un cuarto de milla
    C: Media milla
    D: Una milla o más
  answer: D
  explanation: Un tren que viaja a 55 mph tarda una milla o más en detenerse.
- id: 196
  category: defensive_driving
  question: Según el manual, ¿dónde ocurren la mayoría de las colisiones entre automóviles
    y trenes?
  choices:
    A: A menos de 25 millas de la casa del conductor
    B: En caminos rurales de tierra
    C: Durante fuertes lluvias o tormentas de nieve
    D: Por la noche en zonas sin iluminación
  answer: A
  explanation: La mayoría de las colisiones ocurren a menos de 25 millas de la casa
    del conductor, a menudo debido a la negligencia cuando los conductores cruzan
    las vías sin mirar, escuchar o detenerse.
- id: 197
  category: safe_driving_rules
  question: Al acercarse a un cruce de ferrocarril con un tren aproximándose, ¿cuál
    es la distancia de parada requerida desde el riel más cercano?
  choices:
    A: Entre 100 pies y no menos de 50 pies
    B: Entre 50 pies y no menos de 15 pies
    C: Entre 25 pies y no menos de 10 pies
    D: Exactamente 15 pies
  answer: B
  explanation: La ley establece que un conductor debe detenerse a una distancia de
    entre 50 pies y no menos de 15 pies del riel más cercano de dicho ferrocarril.
- id: 198
  category: safe_driving_rules
  question: ¿Bajo qué condición debe un conductor detenerse ante un tren que se aproxima
    a un cruce de carretera?
  choices:
    A: Cuando el tren está a menos de 3000 pies y emite una señal audible
    B: Solo cuando una barrera de cruce está completamente bajada
    C: Cuando un tren que se aproxima a unos 1500 pies emite una señal audible y representa
      un peligro inmediato
    D: Solo cuando hay un banderillero presente
  answer: C
  explanation: Un conductor debe detenerse cuando un tren que se aproxima a unos 1500
    pies del cruce de la carretera emite una señal audible desde esa distancia y el
    tren representa un peligro inmediato.
- id: 199
  category: signs_and_signals
  question: ¿Cómo debe tratar una señal de cruce de ferrocarril (Crossbuck)?
  choices:
    A: Igual que una señal de PARE (STOP)
    B: Igual que una señal de CEDA EL PASO (YIELD)
    C: Igual que una señal de PROHIBIDO EL PASO (DO NOT ENTER)
    D: Igual que una señal de LÍMITE DE VELOCIDAD
  answer: B
  explanation: 'Las señales de cruce (Crossbucks) se encuentran en la mayoría de los
    cruces públicos. Trátelas igual que una señal de CEDA EL PASO (YIELD): reduzca
    la velocidad y prepárese para detenerse si ve o escucha un tren acercándose.'
- id: 200
  category: sharing_the_road
  question: Si un camión con remolque tiene un capó largo, ¿qué parte de la carretera
    directamente delante del parachoques podría no ver el camionero?
  choices:
    A: Los primeros 5 a 10 pies
    B: Los primeros 10 a 20 pies
    C: Los primeros 25 a 30 pies
    D: Los primeros 40 a 50 pies
  answer: B
  explanation: Si el camión tiene un capó largo, es posible que el camionero no pueda
    ver los primeros 10 a 20 pies de pavimento frente al parachoques, espacio suficiente
    para que un automóvil se meta sin ser visto en una posición peligrosa.
- id: 201
  category: sharing_the_road
  question: ¿Qué debe tener en cuenta al rebasar a un camión en una pendiente descendente?
  choices:
    A: Los camiones viajan más lento cuesta abajo, por lo que debe reducir su velocidad.
    B: Los camiones viajan más rápido cuesta abajo, por lo que es posible que deba
      aumentar su velocidad para rebasarlos.
    C: Debe rebasar al camión e inmediatamente reducir la velocidad para controlar
      la velocidad de ellos.
    D: Es ilegal rebasar a un camión en una pendiente descendente.
  answer: B
  explanation: Debido a su peso, los camiones viajan más rápido cuesta abajo y más
    lento cuesta arriba. Es posible que deba aumentar su velocidad para rebasar a
    un camión en una pendiente descendente.
- id: 202
  category: safe_driving_rules
  question: ¿Qué debe hacer si su vehículo se apaga en las vías del tren y las luces
    de advertencia comienzan a parpadear?
  choices:
    A: Intentar arrancar el motor inmediatamente
    B: Permanecer en el vehículo y llamar al 911
    C: Salir del vehículo y correr en un ángulo de 45 grados alejándose de las vías
      en la dirección de donde viene el tren
    D: Salir y correr en la misma dirección en la que viaja el tren
  answer: C
  explanation: Si su vehículo se apaga en las vías y las luces comienzan a parpadear,
    salga y corra en un ángulo de 45 grados alejándose de las vías en la dirección
    de donde viene el tren, luego llame inmediatamente al 911.
- id: 203
  category: sharing_the_road
  question: ¿Cuáles de los siguientes vehículos están obligados a detenerse en los
    cruces de carretera y ferrocarril?
  choices:
    A: Motocicletas y bicicletas
    B: Camiones que transportan materiales peligrosos y autobuses escolares
    C: Furgonetas de reparto y camionetas pickup
    D: Todos los vehículos que viajan a más de 40 mph
  answer: B
  explanation: Debe estar atento a los vehículos que deben detenerse en los cruces
    de carretera y ferrocarril, que incluyen camiones que transportan materiales peligrosos,
    autobuses escolares, autobuses de iglesias y autobuses de pasajeros.
- id: 204
  category: safe_driving_rules
  question: 'Si ya está cruzando las vías del tren y las luces de advertencia comienzan
    a parpadear, usted debe:'
  choices:
    A: Detenerse inmediatamente y retroceder
    B: Detenerse y esperar a que pase el tren
    C: Seguir avanzando y terminar de cruzar
    D: Poner el vehículo en punto muerto (neutral) y cruzar por inercia
  answer: C
  explanation: Si está cruzando las vías y las luces de advertencia comienzan a parpadear
    o las barreras comienzan a bajar, no se detenga. ¡SIGA AVANZANDO! Las señales
    de advertencia darán tiempo suficiente para que termine de cruzar.
- id: 205
  category: signs_and_signals
  question: ¿Qué es el Sistema de Notificación de Emergencia (ENS) en un cruce de
    ferrocarril?
  choices:
    A: Una señal roja y amarilla que advierte sobre un segundo tren
    B: Una sirena que suena cuando un tren está a 20 segundos de distancia
    C: Un letrero de emergencia azul y blanco con un número único que identifica la
      ubicación exacta del cruce
    D: Una barrera automática que baja para evitar que los vehículos crucen
  answer: C
  explanation: El ENS es un letrero de emergencia azul y blanco con un número único
    asignado a cada cruce a nivel e identifica la ubicación exacta del cruce para
    las compañías ferroviarias.
- id: 206
  category: safe_driving_rules
  question: ¿Cuándo debe cambiar sus luces altas a luces bajas al acercarse a un vehículo
    que viene en sentido contrario?
  choices:
    A: A menos de 200 pies
    B: A menos de 500 pies
    C: A menos de 600 pies
    D: A menos de 1000 pies
  answer: D
  explanation: Debe cambiar sus luces altas a luces bajas cuando se encuentre a menos
    de 1000 pies de un vehículo que viene en sentido contrario.
- id: 207
  category: safe_driving_rules
  question: 'Al seguir a otro vehículo, debe cambiar sus luces a luces bajas a una
    distancia de:'
  choices:
    A: 200 pies
    B: 400 pies
    C: 600 pies
    D: 1000 pies
  answer: C
  explanation: Debe cambiar sus luces altas a luces bajas cuando se encuentre a menos
    de 600 pies del vehículo que está siguiendo.
- id: 208
  category: safe_driving_rules
  question: Según la ley de Oklahoma, ¿cuándo deben usarse los faros delanteros según
    la hora del día?
  choices:
    A: Desde la puesta del sol hasta la salida del sol
    B: A partir de 30 minutos después de la puesta del sol y hasta 30 minutos antes
      de la salida del sol
    C: A partir de 1 hora después de la puesta del sol y hasta 1 hora antes de la
      salida del sol
    D: Solo cuando la visibilidad sea inferior a 500 pies
  answer: B
  explanation: Los faros delanteros deben usarse a partir de 30 minutos después de
    la puesta del sol y hasta 30 minutos antes de la salida del sol.
- id: 209
  category: vehicle_information
  question: 'Al conducir un vehículo con transmisión estándar, debe presionar el pedal
    del embrague (clutch) hasta el fondo cuando:'
  choices:
    A: Baja por una colina empinada por inercia
    B: Su velocidad cae por debajo de 10 mph mientras se está deteniendo
    C: Conduce por una zona escolar
    D: Quiere descansar el pie mientras conduce
  answer: B
  explanation: Presione el pedal del embrague (clutch) hasta el fondo al arrancar
    el motor, al cambiar de marcha y cuando su velocidad caiga por debajo de 10 mph
    mientras se detiene.
- id: 210
  category: vehicle_information
  question: ¿Qué significa "manejar con el pie en el embrague" (ride the clutch)?
  choices:
    A: Cambiar de marcha sin usar el pedal del embrague
    B: Bajar una colina en punto muerto (neutral)
    C: Conducir con el pie apoyado en el pedal del embrague
    D: Usar el embrague para frenar repentinamente
  answer: C
  explanation: No debe "manejar con el pie en el embrague", lo que significa que no
    debe conducir con el pie apoyado en el pedal del embrague.
- id: 211
  category: safe_driving_rules
  question: Para tener un agarre firme y sólido del volante, ¿dónde deben colocarse
    generalmente las manos?
  choices:
    A: Mano izquierda a las 12:00 y mano derecha a las 6:00
    B: Mano izquierda entre las 9:00 y las 10:30, y mano derecha entre las 2:00 y
      las 4:00
    C: Mano izquierda a las 8:00 y mano derecha a las 4:00
    D: Ambas manos apoyadas en la parte inferior del volante
  answer: B
  explanation: Generalmente, la mano izquierda debe estar entre las 9:00 y las 10:30
    y la mano derecha entre las 2:00 y las 4:00.
- id: 212
  category: alcohol_drugs_health
  question: ¿Cuál de los siguientes es un síntoma de intoxicación por monóxido de
    carbono?
  choices:
    A: La piel se vuelve roja y se sonroja
    B: Se siente hiperactivo y con energía
    C: Las luces parecen más brillantes y siente tensión en la frente
    D: Siente hambre repentina
  answer: C
  explanation: Los síntomas de la intoxicación por monóxido de carbono incluyen sentirse
    somnoliento y/o mareado, que las luces parezcan más brillantes, la piel o los
    labios azulados y tensión en la frente.
- id: 213
  category: defensive_driving
  question: 'Para ayudar a evitar la intoxicación por monóxido de carbono al conducir
    en tráfico congestionado, usted debe:'
  choices:
    A: Abrir la rejilla de ventilación de aire fresco
    B: Cerrar la rejilla de ventilación de aire fresco
    C: Encender la calefacción al máximo
    D: Bajar todas las ventanas hasta la mitad
  answer: B
  explanation: Para evitar la intoxicación por monóxido de carbono en tráfico congestionado,
    cierre la rejilla de ventilación de aire fresco.
- id: 214
  category: driver_responsibility
  question: Antes de iniciar un viaje de vacaciones o de negocios, ¿qué exige la ley
    de Oklahoma que lleve en su vehículo en formato físico?
  choices:
    A: Su certificado de nacimiento y pasaporte
    B: Un mapa de carreteras del estado
    C: El seguro y el registro de su vehículo
    D: El registro de mantenimiento de su vehículo
  answer: C
  explanation: Antes de iniciar un viaje de vacaciones o de negocios, asegúrese de
    tener una copia física del seguro y el registro de su vehículo en su automóvil,
    de acuerdo con la ley de Oklahoma.
- id: 215
  category: sharing_the_road
  question: ¿Por qué es peligroso rebasar autos o ciclistas en un cruce de carretera
    y vía férrea?
  choices:
    A: El maquinista del tren no puede verle rebasar
    B: Las llantas de la bicicleta pueden quedar atrapadas en las vías y el ciclista
      puede ser lanzado hacia su trayectoria
    C: Es ilegal conducir a más de 15 mph en cualquier cruce
    D: Las barreras del cruce bajarán automáticamente si cambia de carril
  answer: B
  explanation: Nunca rebase en un cruce de carretera y vía férrea. No rebase autos
    ni ciclistas. Las llantas de la bicicleta pueden quedar atrapadas en las vías
    y el ciclista puede ser lanzado hacia su trayectoria.
- id: 216
  category: vehicle_information
  question: ¿De qué debe tener una copia física en su vehículo antes de iniciar un
    viaje de acuerdo con la ley de Oklahoma?
  choices:
    A: Su certificado de nacimiento
    B: Seguro y registro del vehículo
    C: Un pasaporte
    D: El título de propiedad de su vehículo
  answer: B
  explanation: El manual establece que antes de iniciar un viaje, debe asegurarse
    de tener una copia física del seguro y el registro de su vehículo en su automóvil,
    de acuerdo con la ley de Oklahoma.
- id: 217
  category: safe_driving_rules
  question: ¿Cuál de los siguientes es un ejemplo de una distracción "cognitiva" del
    conductor?
  choices:
    A: Quitar las manos del volante
    B: Quitar la vista de la carretera
    C: Pensar en cualquier otra cosa que no sea conducir
    D: Intentar alcanzar un objeto que se ha caído
  answer: C
  explanation: El manual define la distracción cognitiva como "Pensar en cualquier
    otra cosa que no sea conducir".
- id: 218
  category: penalties_and_points
  question: ¿A qué sanción pueden enfrentarse los titulares de un Permiso de Aprendizaje
    o Licencia Intermedia por utilizar un dispositivo electrónico de mano para fines
    que no pongan en peligro la vida?
  choices:
    A: Una multa de advertencia
    B: Suspensión o cancelación de su licencia
    C: Un curso obligatorio de conducción defensiva
    D: Una multa de $500 e incautación del vehículo
  answer: B
  explanation: A los titulares de un Permiso de Aprendizaje o Licencia Intermedia
    se les puede suspender o cancelar la licencia por utilizar un dispositivo electrónico
    de mano mientras operan un vehículo motorizado para fines de emergencia que no
    pongan en peligro la vida.
- id: 219
  category: defensive_driving
  question: ¿Qué debe hacer si un animal corre repentinamente delante de su vehículo?
  choices:
    A: Virar bruscamente hacia la izquierda
    B: Virar bruscamente hacia la derecha
    C: NO vire bruscamente para evitar golpear al animal
    D: Toque la bocina y acelere
  answer: C
  explanation: 'El manual establece explícitamente: "NO vire bruscamente para evitar
    golpear al animal. Esto puede resultar en un choque más grave que si su vehículo
    colisionara con el animal".'
- id: 220
  category: defensive_driving
  question: ¿Durante qué meses ocurren con mayor frecuencia los choques entre ciervos
    y vehículos?
  choices:
    A: De enero a marzo
    B: De abril a junio
    C: De julio a septiembre
    D: De octubre a diciembre
  answer: D
  explanation: Según el manual, los choques entre ciervos y vehículos ocurren con
    mayor frecuencia de octubre a diciembre.
- id: 221
  category: safe_driving_rules
  question: ¿A qué profundidad de agua la mayoría de los vehículos, incluidos los
    SUV, flotarán?
  choices:
    A: 6 pulgadas
    B: 12 pulgadas
    C: 18 pulgadas
    D: 24 pulgadas (2 pies)
  answer: D
  explanation: La mayoría de los vehículos flotarán en solo 2 pies (24 pulgadas) de
    agua, incluso los SUV.
- id: 222
  category: safe_driving_rules
  question: ¿Cuánta agua en una carretera inundada es suficiente para que pierda el
    control de su vehículo o para derribarlo?
  choices:
    A: 2 pulgadas
    B: 6 pulgadas
    C: 12 pulgadas
    D: 24 pulgadas
  answer: B
  explanation: El manual advierte que 6 pulgadas de agua pueden ser suficientes para
    que pierda el control de su vehículo, y el agua que corre rápido puede derribarlo
    con solo 6 pulgadas.
- id: 223
  category: driver_responsibility
  question: Si se ve involucrado en un choque menor y su vehículo está bloqueando
    el flujo del tráfico, ¿qué debe hacer?
  choices:
    A: Dejar el vehículo exactamente donde está hasta que llegue la policía
    B: Mover el vehículo o hacer que lo muevan
    C: Esperar a una grúa antes de intentar moverlo
    D: Abandonar el vehículo y caminar a un lugar seguro
  answer: B
  explanation: Si el choque es menor y su vehículo está bloqueando el flujo del tráfico,
    debe moverlo o hacer que lo muevan.
- id: 224
  category: driver_responsibility
  question: ¿Qué debe hacer si choca con un automóvil estacionado y no puede localizar
    al propietario?
  choices:
    A: Abandonar la escena de inmediato
    B: Esperar junto al auto hasta que el dueño regrese
    C: Dejar su nombre, dirección e información del seguro donde el propietario pueda
      encontrarlo
    D: Llamar a una grúa para retirar el auto estacionado dañado
  answer: C
  explanation: Si la colisión involucra un automóvil estacionado o propiedad y no
    puede localizar al propietario, deje el nombre y la dirección del conductor y
    del propietario del vehículo, y proporcione la información del formulario de verificación
    del seguro en la propiedad dañada donde el propietario la encuentre.
- id: 225
  category: driver_responsibility
  question: Después de un choque, ¿cuándo es aceptable mover a una persona herida?
  choices:
    A: Siempre que pidan ser movidos
    B: Solo si es una necesidad de vida o muerte
    C: Si están bloqueando la carretera
    D: Siempre debe moverlos a un lado de la carretera
  answer: B
  explanation: Si alguien resulta herido, debe obtener ayuda de inmediato, pero NO
    intente mover a una persona herida a menos que sea una necesidad de vida o muerte.
- id: 226
  category: alcohol_drugs_health
  question: ¿Cómo afecta a su cuerpo la mezcla de alcohol con otras drogas?
  choices:
    A: Anula los efectos de las drogas
    B: Retrasa la absorción del alcohol
    C: Multiplica los efectos dañinos en la concentración y la coordinación
    D: No tiene ningún efecto adicional en comparación con beber alcohol solo
  answer: C
  explanation: Mezclar drogas puede ser especialmente peligroso porque reaccionan
    entre sí y multiplican los efectos dañinos en su concentración y coordinación,
    especialmente cuando una de esas drogas es el alcohol.
- id: 227
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes bebidas contiene la mayor cantidad de alcohol?
  choices:
    A: Una lata de cerveza de 12 onzas
    B: Una copa de vino de 5 onzas
    C: Un cóctel con 1.5 onzas de bebidas destiladas de 80 grados
    D: Todas contienen la misma cantidad de alcohol
  answer: D
  explanation: Una lata de cerveza de 12 onzas, una copa de vino de 5 onzas y un cóctel
    con 1.5 onzas de bebidas destiladas de 80 grados contienen la misma cantidad de
    alcohol.
- id: 228
  category: alcohol_drugs_health
  question: ¿Qué habilidad de conducción se ve afectada casi de inmediato cuando consume
    alcohol?
  choices:
    A: Su audición
    B: Su juicio
    C: Su sentido de la orientación
    D: Su visión nocturna
  answer: B
  explanation: El alcohol se desplaza rápidamente a su estómago, a su sangre y a todas
    las partes de su cuerpo. Las habilidades de conducción, especialmente su juicio,
    se ven afectadas casi de inmediato.
- id: 229
  category: penalties_and_points
  question: Según la Ley de Consentimiento Implícito de Oklahoma (Oklahoma Implied
    Consent Law), ¿por cuánto tiempo se revocará su licencia si es sancionado?
  choices:
    A: De 30 a 90 días
    B: De 90 a 180 días
    C: De 180 días a 2 años
    D: De 2 a 5 años
  answer: C
  explanation: Si se le revoca la licencia bajo la Ley de Consentimiento Implícito
    de Oklahoma, el período de revocación será de 180 días a 2 años, dependiendo de
    su historial de conducción anterior.
- id: 230
  category: safe_driving_rules
  question: ¿A cuáles de los siguientes conductores se les prohíbe realizar llamadas
    telefónicas con el celular en la mano mientras conducen en Oklahoma?
  choices:
    A: Todos los conductores mayores de 21 años
    B: Conductores comerciales y conductores de transporte público
    C: Solo conductores con licencias de otros estados
    D: Conductores que operan un vehículo en un camino de tierra
  answer: B
  explanation: A los conductores comerciales o de transporte público también se les
    prohíbe realizar llamadas telefónicas con el celular en la mano mientras conducen.
- id: 231
  category: alcohol_drugs_health
  question: ¿Qué significa la Ley de Consentimiento Implícito (Implied Consent Law)
    de Oklahoma para los conductores?
  choices:
    A: Debe consentir a un registro del vehículo si lo detienen.
    B: Usted acepta someterse a una o más pruebas para determinar su contenido de
      alcohol en sangre (BAC).
    C: Se declara automáticamente culpable de un DUI si es arrestado.
    D: Usted consiente en pagar multas de tráfico en el acto.
  answer: B
  explanation: El simple hecho de conducir o tener el control físico real de un vehículo
    motorizado significa que usted ha aceptado someterse a una o más pruebas para
    determinar su contenido de alcohol en sangre (BAC) bajo la Ley de Consentimiento
    Implícito.
- id: 232
  category: penalties_and_points
  question: ¿Qué sucede si se niega a realizar una prueba de BAC a petición de un
    oficial de la ley?
  choices:
    A: Se le dará una advertencia.
    B: Su privilegio de conducir será revocado automáticamente.
    C: Se le multará con $50 pero conservará su licencia.
    D: Debe tomar un curso de conducción defensiva.
  answer: B
  explanation: La negativa a realizar la prueba a petición de un oficial de la ley
    resultará en la revocación automática de su privilegio de conducir, incluso si
    no ha estado bebiendo.
- id: 233
  category: penalties_and_points
  question: ¿Cuál es una posible sanción por una condena por conducir con un BAC superior
    a 0.05 pero inferior a 0.08?
  choices:
    A: Una multa de $1,000 a $2,500
    B: Hasta 6 meses de cárcel
    C: Una sentencia de prisión obligatoria de 5 años
    D: Pérdida permanente de su licencia de conducir
  answer: B
  explanation: En caso de condena por un BAC superior a 0.05 pero inferior a 0.08,
    las sanciones incluyen una multa de $100–$500, hasta 6 meses de cárcel, o ambos.
- id: 234
  category: penalties_and_points
  question: ¿Cuáles son las sanciones por una primera condena por DUI (BAC de 0.08
    o más)?
  choices:
    A: Un delito grave (felony), de 1 a 5 años de prisión y una multa de hasta $2,500
    B: Un delito menor (misdemeanor), de 10 días a 1 año de cárcel y una multa de
      hasta $1,000
    C: Un delito menor, hasta 6 meses de cárcel y una multa de $100-$500
    D: Un delito grave, de 1 a 7 años de prisión y una multa de hasta $5,000
  answer: B
  explanation: Una primera infracción por DUI es un delito menor (misdemeanor) castigado
    con una pena de cárcel de no menos de diez días ni más de 1 año y una multa de
    no más de $1,000.
- id: 235
  category: penalties_and_points
  question: 'Si es condenado por una segunda infracción de DUI en un plazo de 10 años,
    se clasifica como:'
  choices:
    A: Delito menor (Misdemeanor)
    B: Infracción de tráfico
    C: Delito grave (Felony)
    D: Violación civil
  answer: C
  explanation: Una segunda infracción de DUI en un plazo de 10 años se clasifica como
    un delito grave (felony), lo que conlleva una pena de prisión de 1 a 5 años y
    una multa de hasta $2,500.
- id: 236
  category: penalties_and_points
  question: Para una primera revocación por DUI, ¿por cuánto tiempo suspenderá Service
    Oklahoma su privilegio de conducir?
  choices:
    A: 30 días
    B: 90 días
    C: 180 días
    D: 1 año
  answer: C
  explanation: Cuando Service Oklahoma recibe una notificación de una condena por
    DUI, la licencia se suspenderá por 180 días en la primera revocación.
- id: 237
  category: alcohol_drugs_health
  question: Según el manual, ¿cuántas veces más probabilidades tienen los conductores
    que consumen anfetaminas de verse involucrados en un accidente automovilístico?
  choices:
    A: Dos veces
    B: Tres veces
    C: Cuatro veces
    D: Diez veces
  answer: C
  explanation: Las drogas ilegales afectan su capacidad para conducir de manera segura.
    Por ejemplo, los conductores que consumen anfetaminas tienen cuatro veces más
    probabilidades de verse involucrados en un accidente automovilístico.
- id: 238
  category: alcohol_drugs_health
  question: ¿Cuál de las siguientes afirmaciones es verdadera con respecto a la conducción
    y el uso de marihuana en Oklahoma?
  choices:
    A: Es legal conducir siempre que tenga una tarjeta de marihuana medicinal.
    B: Es ilegal conducir con cualquier nivel detectable de cannabis en su sistema.
    C: Puede conducir si su nivel de cannabis es inferior al 0.08%.
    D: La marihuana mejora su capacidad para adaptarse al deslumbramiento.
  answer: B
  explanation: Aunque el estado ha legalizado el cannabis para algunos fines médicos,
    este perjudica el rendimiento al conducir, y es ilegal que cualquier persona conduzca
    con cualquier nivel detectable de cannabis en su sistema.
- id: 239
  category: alcohol_drugs_health
  question: 'Bajo la ley de ''Tolerancia Cero'' (Zero Tolerance) de Oklahoma, es ilegal
    que cualquier persona menor de 21 años conduzca con:'
  choices:
    A: Un BAC de 0.08 o superior únicamente.
    B: CUALQUIER cantidad medible de alcohol en su sangre o aliento.
    C: Un BAC de 0.05 o superior únicamente.
    D: Más de una bebida por hora en su sistema.
  answer: B
  explanation: Es ilegal que cualquier persona menor de 21 años conduzca con CUALQUIER
    cantidad medible de alcohol en la sangre o el aliento de la persona en el momento
    en que se administra una prueba.
- id: 240
  category: penalties_and_points
  question: ¿Cuál es el período de revocación para una persona menor de 21 años por
    su primera condena por conducir con una cantidad medible de BAC?
  choices:
    A: 30 días
    B: 90 días
    C: Seis meses
    D: Un año
  answer: C
  explanation: Bajo la Ley de Tolerancia Cero, la primera condena o infracción por
    una cantidad medible de BAC resulta en un período de revocación de SEIS MESES.
- id: 241
  category: penalties_and_points
  question: 'Si una persona menor de 18 años comete una infracción relacionada con
    la posesión o el consumo de alcohol, el tribunal puede recomendar la cancelación
    de su licencia por:'
  choices:
    A: 30 días
    B: 60 días
    C: 90 días
    D: 6 meses, 1 año o 2 años/hasta los 21 años de edad
  answer: D
  explanation: A discreción del tribunal, las sanciones para personas menores de 18
    años incluyen un período de 6 meses, 1 año o 2 años, o hasta que la persona cumpla
    los 21 años, lo que sea más largo.
- id: 242
  category: driver_responsibility
  question: ¿Puede ser condenado por conducir bajo la influencia (DUI) sin una prueba
    de concentración de alcohol en sangre (BAC)?
  choices:
    A: No, una prueba de BAC es legalmente requerida para cualquier condena por DUI.
    B: Sí, las observaciones y la información recopilada por el oficial que realiza
      el arresto pueden resultar en una condena.
    C: No, solo una prueba de sangre puede usarse como evidencia en el tribunal.
    D: Sí, pero solo si confiesa el delito.
  answer: B
  explanation: Las observaciones y la información recopilada por el oficial que realiza
    el arresto también son pruebas que pueden usarse en el tribunal y pueden resultar
    en una condena sin una prueba de BAC.
- id: 243
  category: penalties_and_points
  question: Si es condenado por conducir con un BAC superior a 0.05 pero inferior
    a 0.08, ¿cuánto tiempo dura la suspensión por una primera infracción?
  choices:
    A: 30 días
    B: 6 meses
    C: 180 días
    D: 1 año
  answer: A
  explanation: Cuando Service Oklahoma recibe una notificación de una condena por
    un BAC superior a 0.05 pero inferior a 0.08, la primera suspensión del privilegio
    de conducir de la persona es de 30 días.
- id: 244
  category: penalties_and_points
  question: ¿Cuál es la pena máxima de prisión por una tercera o subsiguiente infracción
    de DUI?
  choices:
    A: 1 año
    B: 5 años
    C: 7 años
    D: 10 años
  answer: D
  explanation: Para una tercera o subsiguiente infracción de DUI, la sanción incluye
    prisión por no menos de 1 año, sin exceder los 10 años, y una multa de no más
    de $5,000.
- id: 245
  category: alcohol_drugs_health
  question: ¿Qué debe hacer antes de tomar un medicamento recetado o de venta libre
    y conducir?
  choices:
    A: Tomar una dosis doble para mantenerse alerta.
    B: Revisar la etiqueta para ver las advertencias sobre efectos secundarios como
      la somnolencia.
    C: Beber una bebida con cafeína para contrarrestar cualquier efecto.
    D: Solo conducir durante las horas del día.
  answer: B
  explanation: Antes de tomar un medicamento, revise la etiqueta para ver las advertencias
    sobre efectos secundarios como somnolencia o nerviosismo. Si no está seguro, pregunte
    a un farmacéutico o médico.
- id: 246
  category: penalties_and_points
  question: ¿Cuál es la sanción máxima por portar, comprar o usar una identificación
    falsa según el manual?
  choices:
    A: 1 año de prisión y una multa de $1,000
    B: 5 años de prisión y una multa de $5,000
    C: 7 años de prisión y una multa de $10,000
    D: 10 años de prisión y una multa de $25,000
  answer: C
  explanation: Cada vez que use, porte, pida prestada o compre una identificación
    falsa, se considera un delito grave y podría pasar 7 años en prisión y enfrentar
    una multa de $10,000.
- id: 247
  category: license_system
  question: ¿Cuánto cuesta obtener una copia de su historial de manejo de 3 años si
    tiene menos de 65 años?
  choices:
    A: $10.00
    B: $15.00
    C: $20.00
    D: $25.00
  answer: D
  explanation: Hay una tarifa de $25.00 por una copia de su historial de manejo. Service
    Oklahoma proporcionará el historial de manejo a las personas mayores de 65 años
    sin cargo.
- id: 248
  category: license_system
  question: ¿A qué edad puede un residente de Oklahoma obtener una copia de su historial
    de manejo sin cargo?
  choices:
    A: Mayor de 55
    B: Mayor de 60
    C: Mayor de 65
    D: Mayor de 70
  answer: C
  explanation: Service Oklahoma proporcionará el historial de manejo a las personas
    mayores de 65 años sin cargo.
- id: 249
  category: penalties_and_points
  question: Bajo el Sistema Obligatorio de Puntos de Oklahoma, ¿cuántos puntos resultarán
    en la suspensión de la licencia si se acumulan en un plazo de 5 años?
  choices:
    A: 6 o más puntos
    B: 8 o más puntos
    C: 10 o más puntos
    D: 12 o más puntos
  answer: C
  explanation: Si acumula 10 o más puntos en un plazo de 5 años, su licencia será
    suspendida.
- id: 250
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan a su historial de manejo por una condena por
    conducción imprudente?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: C
  explanation: De acuerdo con el Sistema Obligatorio de Puntos, la conducción imprudente
    resulta en la asignación de 4 puntos en su historial de manejo.
- id: 251
  category: penalties_and_points
  question: ¿Cuál de las siguientes infracciones resultará en la adición de 4 puntos
    a su historial de conducción?
  choices:
    A: Exceso de velocidad de más de 25 mph por encima del límite establecido
    B: No detenerse o no permanecer detenido ante un autobús escolar que está cargando
      o descargando pasajeros
    C: No ceder el derecho de paso
    D: Conducción descuidada (careless driving)
  answer: B
  explanation: No detenerse o no permanecer detenido ante un autobús escolar que está
    cargando o descargando pasajeros resulta en 4 puntos. El exceso de velocidad de
    más de 25 mph sobre el límite es de 3 puntos, mientras que no ceder el paso y
    la conducción descuidada son de 2 puntos.
- id: 252
  category: license_system
  question: 'Una licencia de conducir emitida a una persona menor de 18 años se considera:'
  choices:
    A: Sin restricciones
    B: Probatoria (probationary)
    C: Temporal
    D: Condicional
  answer: B
  explanation: 'Una licencia emitida a conductores menores de 18 años se considera
    probatoria: usted se encuentra en un período de prueba para demostrar que puede
    conducir de manera segura y legal.'
- id: 253
  category: penalties_and_points
  question: 'Para un conductor menor de 18 años con una licencia probatoria, Service
    Oklahoma puede cancelar o suspender la licencia por:'
  choices:
    A: Solo condenas por delitos graves (felonies)
    B: Cualquier infracción de tráfico en movimiento
    C: Acumular 5 puntos en su historial
    D: Solo delitos relacionados con el alcohol
  answer: B
  explanation: Service Oklahoma puede, a su discreción, cancelar o suspender su licencia
    probatoria por cualquier infracción de tráfico en movimiento.
- id: 254
  category: penalties_and_points
  question: La ley estatal exige que su privilegio de conducir sea revocado de 6 meses
    a 3 años por ¿cuál de las siguientes condenas?
  choices:
    A: Operar un vehículo defectuoso
    B: Seguir a otro vehículo demasiado cerca
    C: Cualquier delito grave (felony) en el que se utilice un vehículo motorizado
    D: Exceso de velocidad de 10 mph sobre el límite
  answer: C
  explanation: Se requiere la revocación obligatoria de su licencia de 6 meses a 3
    años por una condena de cualquier delito grave (felony) en el que se utilice un
    vehículo motorizado.
- id: 255
  category: alcohol_drugs_health
  question: 'Si es menor de 21 años, su privilegio de conducir será revocado obligatoriamente
    por conducir o tener el control físico real de un vehículo motorizado con:'
  choices:
    A: Un contenido de alcohol en sangre (BAC) de 0.08% o superior
    B: Cualquier cantidad medible de alcohol
    C: Un contenido de alcohol en sangre (BAC) de 0.05% o superior
    D: Un contenido de alcohol en sangre (BAC) de 0.02% o superior
  answer: B
  explanation: La ley estatal exige la revocación obligatoria de 6 meses a 3 años
    si es menor de 21 años y conduce o tiene el control físico real de un vehículo
    motorizado con cualquier cantidad medible de alcohol.
- id: 256
  category: driver_responsibility
  question: ¿Quién recomienda los estándares para la capacidad física, emocional y
    mental de los solicitantes de licencia y conductores con licencia en Oklahoma?
  choices:
    A: La Unidad de Verificación de Identidad del Departamento de Seguridad Pública
    B: El Comité Asesor Médico (Medical Advisory Committee)
    C: La Legislatura de Oklahoma
    D: La Patrulla de Caminos (Highway Patrol)
  answer: B
  explanation: La ley de Oklahoma autoriza a un Comité Asesor Médico, compuesto por
    médicos, a recomendar estándares para la capacidad física, emocional y mental
    de los solicitantes de licencia y conductores con licencia.
- id: 257
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por operar un vehículo defectuoso?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: De acuerdo con el Sistema de Puntos Obligatorio, operar un vehículo
    defectuoso resulta en 1 punto.
- id: 258
  category: license_system
  question: ¿Qué información se requiere en el formulario de solicitud de registros
    para obtener una copia de su historial de conducción?
  choices:
    A: Nombre completo, número de Seguro Social y dirección
    B: Nombre completo, fecha de nacimiento y número de licencia de conducir
    C: Nombre completo, dirección y número de registro del vehículo
    D: Nombre completo, fecha de nacimiento y color de ojos
  answer: B
  explanation: El formulario de solicitud de registros debe completarse con su nombre
    completo, fecha de nacimiento y número de licencia de conducir.
- id: 259
  category: penalties_and_points
  question: ¿Cuál de las siguientes acciones puede llevar a la cancelación de su tarjeta
    de identificación o licencia de conducir?
  choices:
    A: Prestar su licencia a otra persona
    B: Mostrar una licencia con una fecha de nacimiento alterada
    C: Usar un nombre falso en una solicitud
    D: Todas las anteriores
  answer: D
  explanation: Su tarjeta de identificación o licencia de conducir puede ser cancelada
    si la presta a otra persona, muestra una con información alterada o usa un nombre
    falso o ficticio en una solicitud, entre otras infracciones.
- id: 260
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por exceso de velocidad de más de 25 mph por
    encima del límite establecido?
  choices:
    A: 2 puntos
    B: 3 puntos
    C: 4 puntos
    D: 5 puntos
  answer: B
  explanation: El Sistema de Puntos Obligatorio asigna 3 puntos por exceso de velocidad
    de más de 25 mph por encima del límite establecido.
- id: 261
  category: penalties_and_points
  question: ¿Cuántos puntos se añaden a su historial de conducción por conducir a
    la izquierda del centro o en sentido contrario en una calle de un solo sentido?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: De acuerdo con el sistema de puntos, conducir a la izquierda del centro
    o en sentido contrario en una calle de un solo sentido resulta en 2 puntos en
    su historial de conducción.
- id: 262
  category: penalties_and_points
  question: ¿Cuál es la penalización de puntos por operar un vehículo defectuoso?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: Operar un vehículo defectuoso resulta en la adición de 1 punto a su
    historial de conducción.
- id: 263
  category: penalties_and_points
  question: ¿Cuántos puntos se deducen de su historial de conducción por cada período
    de 12 meses en el que no haya condenas por infracciones de tráfico que sumen puntos?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Se deducen dos (2) puntos por cada período de 12 meses en el que no
    haya condenas por infracciones de tráfico que sumen puntos.
- id: 264
  category: penalties_and_points
  question: ¿Cuánto tiempo debe pasar sin condenas por infracciones de tráfico para
    que sus puntos se reduzcan a cero?
  choices:
    A: Un año
    B: Dos años consecutivos
    C: Tres años consecutivos
    D: Cinco años consecutivos
  answer: C
  explanation: Los puntos se reducen a cero si no hay condenas por infracciones de
    tráfico durante tres años consecutivos.
- id: 265
  category: penalties_and_points
  question: ¿Cuántos puntos se pueden deducir por completar con éxito un Curso de
    Conducción Defensiva aprobado por Service Oklahoma?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: B
  explanation: Se deducen dos (2) puntos por completar con éxito un Curso de Cumplimiento
    del Conductor o de Conducción Defensiva aprobado por Service Oklahoma.
- id: 266
  category: penalties_and_points
  question: ¿Con qué frecuencia puede recibir crédito de reducción de puntos por completar
    un Curso de Cumplimiento del Conductor o de Conducción Defensiva aprobado por
    Service Oklahoma?
  choices:
    A: Una vez cada 12 meses
    B: Una vez cada 24 meses
    C: Una vez cada 36 meses
    D: Una vez cada 5 años
  answer: B
  explanation: El crédito por completar el curso de conducción defensiva se puede
    otorgar una vez cada 24 meses.
- id: 267
  category: driver_responsibility
  question: ¿Cuál es el requisito mínimo de seguro de responsabilidad civil por lesiones
    o muerte de una persona en Oklahoma?
  choices:
    A: $10,000
    B: $15,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: El límite mínimo de responsabilidad por lesiones o muerte de una persona
    es de $25,000.
- id: 268
  category: driver_responsibility
  question: Si se ve involucrado en una colisión, ¿a quién debe mostrar su comprobante
    de seguro?
  choices:
    A: Solo a los oficiales de la ley
    B: Solo a su agente de seguros
    C: Al otro conductor y a las demás personas involucradas
    D: Solo a un representante de Service Oklahoma
  answer: C
  explanation: Si se encuentra en una colisión, debe mostrar su comprobante de seguro
    al otro conductor y a las demás personas involucradas.
- id: 269
  category: license_system
  question: ¿Qué podría suceder si no mantiene una dirección actualizada en los archivos
    de Service Oklahoma?
  choices:
    A: Se le multará con $250 de inmediato.
    B: El registro de su vehículo será revocado permanentemente.
    C: Podría enfrentar una suspensión de su licencia sin su conocimiento.
    D: Se le requerirá volver a tomar el examen de conducción.
  answer: C
  explanation: No mantener una dirección actualizada con Service Oklahoma podría resultar
    en una suspensión sin su conocimiento.
- id: 270
  category: penalties_and_points
  question: ¿Cuál es la multa máxima y el tiempo de cárcel por una condena por incumplimiento
    de la Ley de Seguro Obligatorio?
  choices:
    A: Hasta $100 y 10 días de cárcel
    B: Hasta $250 y 30 días de cárcel
    C: Hasta $500 y 60 días de cárcel
    D: Hasta $1,000 y 6 meses de cárcel
  answer: B
  explanation: La sanción por no tener seguro incluye una multa de hasta $250, 30
    días de cárcel, o ambos.
- id: 271
  category: penalties_and_points
  question: Además de las multas y el posible tiempo en la cárcel, ¿qué sucede al
    ser condenado por no presentar un comprobante de seguro a un oficial de la ley?
  choices:
    A: Suspensión de su licencia y registro
    B: Un curso obligatorio de conducción defensiva
    C: Confiscación de su vehículo
    D: Una revocación permanente de sus privilegios de conducir
  answer: A
  explanation: Una condena por no presentar un comprobante de seguro a un oficial
    de la ley resulta en la suspensión de su licencia y registro, además de multas
    y/o tiempo en la cárcel.
- id: 272
  category: penalties_and_points
  question: Cuando se deducen puntos de su historial de manejo por conducir de manera
    segura o completar un curso de conducción defensiva, ¿cuál es el total de puntos
    más bajo al que puede llegar?
  choices:
    A: -2 puntos
    B: 0 puntos
    C: 1 punto
    D: 2 puntos
  answer: B
  explanation: El manual establece que el total de puntos no puede ser inferior a
    cero.
- id: 273
  category: penalties_and_points
  question: ¿Cuántos puntos se asignan por "todas las demás infracciones" que no requieren
    una acción de suspensión o revocación?
  choices:
    A: 1 punto
    B: 2 puntos
    C: 3 puntos
    D: 4 puntos
  answer: A
  explanation: Todas las demás infracciones (excluyendo las infracciones que requieren
    una acción de suspensión o revocación) resultan en 1 punto.
- image: stop.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Reduzca la velocidad y proceda con precaución
    B: Deténgase por completo
    C: Ceda el paso al tráfico que viene en sentido contrario
    D: Deténgase solo si hay otros vehículos presentes
  answer: B
  explanation: Una señal de PARE (STOP) roja y octagonal significa que debe detenerse
    por completo en la línea de parada, el cruce de peatones o antes de entrar en
    la intersección. Verifique el tráfico y los peatones antes de continuar.
  id: 274
- image: yield.png
  category: signs_and_signals
  question: ¿Qué le obliga a hacer esta señal?
  choices:
    A: Detenerse por completo
    B: Acelerar para incorporarse al tráfico
    C: Reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones
    D: Continuar sin detenerse
  answer: C
  explanation: Una señal triangular roja y blanca de CEDA EL PASO (YIELD) significa
    que debe reducir la velocidad y ceder el derecho de paso al tráfico y a los peatones.
    Debe detenerse si es necesario para permitir que otros pasen de manera segura.
  id: 275
- image: do_not_enter.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Camino cerrado más adelante
    B: No se permite estacionar
    C: No entre en esta calzada
    D: Callejón sin salida más adelante
  answer: C
  explanation: Una señal roja y blanca de NO ENTRAR (DO NOT ENTER) significa que no
    debe entrar en la carretera o rampa donde está colocada esta señal. Generalmente
    se ve en las rampas de salida de las autopistas o en calles de un solo sentido
    donde entrar lo pondría en el camino del tráfico que viene en sentido contrario.
  id: 276
- image: wrong_way.png
  category: signs_and_signals
  question: Si ve esta señal, ¿qué debería hacer?
  choices:
    A: Dar una vuelta en U
    B: Continuar conduciendo con cuidado
    C: Detenerse y retroceder o dar la vuelta; va en sentido contrario
    D: Acelerar para salir del área rápidamente
  answer: C
  explanation: Una señal roja y blanca de SENTIDO CONTRARIO (WRONG WAY) significa
    que está viajando en contra del tráfico en una carretera de un solo sentido o
    en una rampa de autopista. Deténgase inmediatamente y dé la vuelta o retroceda
    de manera segura.
  id: 277
- image: one_way_left.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: Solo giro a la izquierda
    B: 'El tráfico fluye en una sola dirección: hacia la izquierda'
    C: Manténgase a la izquierda de la mediana
    D: Salida de la autopista a la izquierda
  answer: B
  explanation: 'Una señal de UN SOLO SENTIDO (ONE WAY) en blanco y negro con una flecha
    indica que el tráfico en esta calle se mueve en una sola dirección: la dirección
    que señala la flecha.'
  id: 278
- image: no_u_turn.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Giros a la derecha
    B: Giros a la izquierda
    C: Vueltas en U
    D: Rebasar a otros vehículos
  answer: C
  explanation: Una señal reglamentaria blanca con una flecha de vuelta en U tachada
    significa que las vueltas en U están prohibidas en este lugar.
  id: 279
- image: no_left_turn.png
  category: signs_and_signals
  question: ¿Qué acción prohíbe esta señal?
  choices:
    A: Girar a la derecha
    B: Girar a la izquierda
    C: Hacer una vuelta en U
    D: Seguir recto
  answer: B
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    izquierda tachada significa que no se permiten los giros a la izquierda en esta
    intersección.
  id: 280
- image: no_right_turn.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: No se permite dar vuelta en U
    B: No se permite girar a la izquierda
    C: No se permite girar a la derecha
    D: No se permite rebasar
  answer: C
  explanation: Una señal reglamentaria blanca que muestra una flecha de giro a la
    derecha tachada significa que los giros a la derecha están prohibidos en este
    lugar.
  id: 281
- image: no_passing.png
  category: signs_and_signals
  question: ¿Qué indica esta señal?
  choices:
    A: El camino se estrecha más adelante
    B: No rebase a otros vehículos en esta zona
    C: Tráfico de doble sentido más adelante
    D: Manténgase a la derecha
  answer: B
  explanation: Una señal en forma de banderín de color blanco y negro que dice 'NO
    PASSING ZONE' significa que no se le permite rebasar a otros vehículos en esta
    área. Marca el inicio de una zona de no rebasar.
  id: 282
- image: keep_right.png
  category: signs_and_signals
  question: ¿Qué instruye esta señal a los conductores?
  choices:
    A: Incorpórese a la derecha
    B: Giro a la derecha solamente
    C: Manténgase a la derecha de un divisor u obstrucción
    D: El carril derecho termina más adelante
  answer: C
  explanation: Una señal reglamentaria blanca de 'KEEP RIGHT' (Manténgase a la derecha)
    con una flecha significa que debe mantenerse al lado derecho de una isla de tráfico,
    mediana u obstrucción.
  id: 283
- image: speed_limit_25.png
  category: signs_and_signals
  question: ¿Qué tipo de señal es esta, según su forma y color?
  choices:
    A: Una señal de advertencia
    B: Una señal de guía
    C: Una señal reglamentaria
    D: Una señal de construcción
  answer: C
  explanation: Las señales rectangulares blancas con letras negras son señales reglamentarias.
    Las señales de límite de velocidad le indican la velocidad máxima legal para el
    área en condiciones ideales.
  id: 284
- image: deer_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal amarilla en forma de diamante?
  choices:
    A: Un zoológico o parque de animales más adelante
    B: Los ciervos cruzan frecuentemente la carretera en esta zona
    C: Zona de caza más adelante
    D: Un refugio de vida silvestre cercano
  answer: B
  explanation: Una señal amarilla en forma de diamante con la silueta de un ciervo
    advierte que estos cruzan frecuentemente la carretera en esta zona. Reduzca la
    velocidad y esté atento a los animales, especialmente al amanecer y al anochecer.
  id: 285
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal?
  choices:
    A: Zona escolar más adelante
    B: Cruce de peatones más adelante
    C: Sendero para caminatas cercano
    D: Parada de autobús más adelante
  answer: B
  explanation: Una señal amarilla en forma de diamante con una figura de peatón advierte
    de un cruce de peatones más adelante. Esté preparado para detenerse ante los peatones
    que cruzan la calle.
  id: 286
- image: school_zone.png
  category: signs_and_signals
  question: ¿Qué indica la forma de esta señal?
  choices:
    A: Un cruce de ferrocarril
    B: Una zona de construcción
    C: Una zona escolar o cruce escolar
    D: Una zona hospitalaria
  answer: C
  explanation: Una señal en forma de pentágono (5 lados) de color amarillo verdoso
    fluorescente indica una zona escolar o un cruce escolar. Reduzca la velocidad
    y esté atento a los niños.
  id: 287
- image: railroad_crossing.png
  category: signs_and_signals
  question: ¿De qué le advierte esta señal circular amarilla?
  choices:
    A: Una rotonda más adelante
    B: Una zona hospitalaria
    C: Un cruce de ferrocarril más adelante
    D: Una zona de no rebasar
  answer: C
  explanation: Una señal circular amarilla con una X negra y dos letras 'R' es la
    señal de advertencia anticipada de un cruce de ferrocarril más adelante. Reduzca
    la velocidad, mire y escuche si vienen trenes.
  id: 288
- image: railroad_crossbuck.png
  category: signs_and_signals
  question: ¿Dónde vería normalmente esta señal?
  choices:
    A: En un cruce escolar
    B: En un cruce de ferrocarril
    C: En la entrada de un hospital
    D: En un puente peatonal
  answer: B
  explanation: La señal blanca en forma de X (crossbuck) se coloca en los cruces de
    ferrocarril. Significa que debe ceder el paso a los trenes. Si se acerca un tren,
    debe detenerse.
  id: 289
- image: curve_right.png
  category: signs_and_signals
  question: ¿Qué indica esta señal amarilla en forma de diamante?
  choices:
    A: El camino termina más adelante
    B: Giro a la derecha obligatorio
    C: Una curva a la derecha más adelante
    D: Desvío más adelante
  answer: C
  explanation: Una señal amarilla en forma de diamante con una flecha curva advierte
    de una curva en el camino más adelante. Reduzca la velocidad antes de entrar en
    la curva.
  id: 290
- image: sharp_turn_right.png
  category: signs_and_signals
  question: ¿En qué se diferencia esta señal de una señal de curva?
  choices:
    A: Indica un giro menos pronunciado
    B: Advierte de un giro cerrado que requiere una mayor reducción de velocidad
    C: Significa girar a la derecha solamente
    D: Solo se utiliza en autopistas
  answer: B
  explanation: Una señal de giro cerrado (con una flecha más angulada) indica un giro
    más pronunciado que una señal de curva. Debe reducir su velocidad de manera más
    significativa antes de este giro.
  id: 291
- image: reverse_curve.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Una carretera sinuosa
    B: Una sola curva más adelante
    C: Una serie de dos curvas en direcciones opuestas
    D: Una rotonda más adelante
  answer: C
  explanation: Una señal de curva inversa advierte de dos curvas en direcciones opuestas
    más adelante. Reduzca la velocidad y prepárese para que la carretera gire primero
    en un sentido y luego en el otro.
  id: 292
- image: winding_road.png
  category: signs_and_signals
  question: ¿Qué le advierte que espere esta señal?
  choices:
    A: Una sola curva cerrada
    B: Una superficie de carretera resbaladiza
    C: Una serie de curvas o giros más adelante
    D: Una colina más adelante
  answer: C
  explanation: Una señal de carretera sinuosa advierte de una serie de curvas o giros
    más adelante. Reduzca su velocidad y esté alerta a los cambios en las condiciones
    de la carretera.
  id: 293
- image: merge.png
  category: signs_and_signals
  question: ¿Para qué le indica esta señal que se prepare?
  choices:
    A: El fin de un carril
    B: Tráfico que se incorpora desde otra carretera
    C: El comienzo de una autopista dividida
    D: Una carretera que se estrecha a un solo carril
  answer: B
  explanation: Una señal amarilla en forma de diamante de incorporación (merge) advierte
    que el tráfico de otra carretera se incorporará a su carril. Prepárese para ajustar
    su velocidad y posición.
  id: 294
- image: road_narrows.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Puente más adelante
    B: La carretera se estrecha más adelante
    C: El carril termina
    D: La autopista dividida termina
  answer: B
  explanation: Esta señal de advertencia indica que la carretera más adelante se vuelve
    más estrecha. Prepárese para una reducción del ancho de la carretera y ajuste
    su posición en el carril.
  id: 295
- image: divided_highway.png
  category: signs_and_signals
  question: ¿Qué indica esta señal que hay más adelante?
  choices:
    A: La carretera termina
    B: Tráfico de doble sentido
    C: Comienza una autopista dividida
    D: Salida de la autopista
  answer: C
  explanation: Esta señal advierte que la carretera más adelante se convierte en una
    autopista dividida con una mediana o barrera que separa el tráfico opuesto. Manténgase
    a la derecha.
  id: 296
- image: divided_highway_ends.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: La autopista dividida termina y se reanuda el tráfico de doble sentido
    C: Un área de incorporación más adelante
    D: Construcción de carretera más adelante
  answer: B
  explanation: Esta señal advierte que la autopista dividida está terminando. El tráfico
    opuesto ya no estará separado por una mediana. Prepárese para el tráfico de doble
    sentido.
  id: 297
- image: two_way_traffic.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Comienza una autopista dividida
    B: Una zona de adelantamiento más adelante
    C: 'Tráfico de doble sentido más adelante: el tráfico se mueve en ambas direcciones'
    D: Un cambio de carril más adelante
  answer: C
  explanation: Esta señal advierte de tráfico de doble sentido más adelante. Es posible
    que esté saliendo de una carretera de un solo sentido o de una autopista dividida
    y se encuentre con vehículos que viajan en la dirección opuesta.
  id: 298
- image: slippery_when_wet.png
  category: signs_and_signals
  question: ¿Sobre qué condición de la carretera advierte esta señal?
  choices:
    A: Condiciones de carretera con hielo
    B: La carretera puede estar resbaladiza cuando está mojada
    C: Carretera sinuosa más adelante
    D: Pavimento irregular
  answer: B
  explanation: Una señal de "resbaladizo cuando está mojado" advierte que la superficie
    de la carretera puede volverse muy resbaladiza durante la lluvia o en condiciones
    de humedad. Reduzca su velocidad y evite frenar o girar bruscamente.
  id: 299
- image: hill.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Un bache en la carretera
    B: Una superficie de carretera irregular
    C: Una colina o pendiente pronunciada más adelante
    D: Construcción de carretera
  answer: C
  explanation: Esta señal advierte de una colina o pendiente pronunciada más adelante.
    Es posible que deba ajustar su velocidad y cambiar a una marcha más baja, especialmente
    en camiones o al remolcar.
  id: 300
- image: signal_ahead.png
  category: signs_and_signals
  question: ¿Para qué le advierte esta señal que debe prepararse?
  choices:
    A: Una señal de alto (STOP) más adelante
    B: Un semáforo más adelante
    C: Un cruce escolar
    D: Un control policial
  answer: B
  explanation: Esta señal advierte sobre un semáforo más adelante. Esté preparado
    para detenerse si la luz está en rojo o amarillo. Esta señal suele colocarse donde
    el semáforo puede no ser visible desde la distancia.
  id: 301
- image: stop_ahead.png
  category: signs_and_signals
  question: ¿Qué le indica esta señal que debe esperar más adelante?
  choices:
    A: Una señal de ceda el paso (YIELD)
    B: Un semáforo
    C: Una señal de alto (STOP) donde debe detenerse
    D: Un reductor de velocidad (tope)
  answer: C
  explanation: Esta señal advierte que hay una señal de alto (STOP) más adelante.
    Comience a reducir la velocidad y prepárese para detenerse por completo en la
    señal de alto.
  id: 302
- image: cross_road.png
  category: signs_and_signals
  question: ¿Sobre qué advierte esta señal?
  choices:
    A: Un cruce de ferrocarril más adelante
    B: Un cruce de caminos o intersección más adelante
    C: Un hospital más adelante
    D: Un cruce de peatones
  answer: B
  explanation: Esta señal advierte que hay un cruce de caminos o una intersección
    de 4 vías más adelante. Esté atento al tráfico que ingresa desde los caminos laterales.
  id: 303
- image: side_road.png
  category: signs_and_signals
  question: ¿Sobre qué le advierte esta señal?
  choices:
    A: Una intersección en T más adelante
    B: Un camino lateral que entra por la derecha
    C: Una curva en el camino
    D: Un callejón sin salida
  answer: B
  explanation: Esta señal advierte sobre un camino lateral que entra por la derecha.
    Esté atento a los vehículos que ingresan a la carretera desde el camino lateral.
  id: 304
- image: added_lane.png
  category: signs_and_signals
  question: ¿Qué significa esta señal?
  choices:
    A: Los carriles se están incorporando
    B: Un carril está terminando
    C: Se está añadiendo un nuevo carril; no es necesario incorporarse
    D: Giro a la derecha obligatorio
  answer: C
  explanation: Una señal de carril añadido significa que un nuevo carril se une a
    la carretera sin requerir incorporación. El tráfico que entra desde la rampa tiene
    su propio carril nuevo.
  id: 305
- image: no_parking.png
  category: signs_and_signals
  question: ¿Qué prohíbe esta señal?
  choices:
    A: Detenerse en cualquier momento
    B: Estacionarse en esta área
    C: Permanecer parado o con el motor encendido
    D: Cargar o descargar
  answer: B
  explanation: Una señal roja y blanca de NO ESTACIONAR (NO PARKING) significa que
    no puede estacionar su vehículo en esta área. Puede detenerse brevemente para
    subir o bajar pasajeros.
  id: 306
- image: handicap_parking.png
  category: signs_and_signals
  question: ¿A quién se le permite estacionar en un espacio marcado con esta señal?
  choices:
    A: Cualquier persona por menos de 15 minutos
    B: Solo personas de la tercera edad
    C: Solo vehículos que exhiban un cartel o placa de discapacidad vigente
    D: Cualquier conductor con un pasajero que tenga una discapacidad
  answer: C
  explanation: Una señal azul con el símbolo de la silla de ruedas marca el estacionamiento
    reservado para personas con discapacidades. Solo los vehículos que exhiban un
    cartel o placa de estacionamiento para personas con discapacidad vigente pueden
    estacionar en estos espacios. Las infracciones conllevan multas elevadas.
  id: 307
