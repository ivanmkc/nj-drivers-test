metadata:
  source: 2025 Oklahoma Driver's Manual
  total_questions: 256
  categories:
  - alcohol_drugs_health
  - defensive_driving
  - driver_responsibility
  - driver_testing
  - license_system
  - penalties_and_points
  - safe_driving_rules
  - sharing_the_road
  - signs_and_signals
  - vehicle_information
questions:
- id: 1
  category: license_system
  question: In Oklahoma, at what minimum age can a person apply for a learner permit
    if they are currently enrolled in or have completed an approved driver education
    course?
  choices:
    A: 14 years old
    B: 15 years old
    C: 15 and a half years old
    D: 16 years old
  answer: B
  explanation: According to the Oklahoma Driver's Manual, you must be at least 15
    years old to apply for a learner permit if you are enrolled in or have completed
    an approved driver education course.
- id: 2
  category: license_system
  question: Under Oklahoma's Graduated Driver License (GDL) law, how long must a teen
    hold a learner permit before they are eligible for an Intermediate License?
  choices:
    A: 3 months
    B: 6 months
    C: 9 months
    D: 12 months
  answer: B
  explanation: Oklahoma law requires that a learner permit be held for at least six
    months before the individual can apply for an Intermediate License.
- id: 3
  category: license_system
  question: An Oklahoma Intermediate License holder is restricted from driving between
    what hours, unless for school, work, or church-related activities?
  choices:
    A: 11:00 PM and 4:00 AM
    B: 10:00 PM and 5:00 AM
    C: Midnight and 6:00 AM
    D: 9:00 PM and 6:00 AM
  answer: B
  explanation: Teen drivers with an Intermediate License in Oklahoma may not drive
    between 10:00 PM and 5:00 AM, except for activities related to school, church,
    or employment.
- id: 4
  category: license_system
  question: How many passengers (who are not family members) is an Oklahoma Intermediate
    License holder permitted to carry in the vehicle without a supervising adult?
  choices:
    A: Zero
    B: One
    C: Two
    D: Three
  answer: B
  explanation: Oklahoma GDL laws state that an Intermediate License holder may only
    carry one passenger who does not live in their household, unless accompanied by
    a licensed driver at least 21 years old.
- id: 5
  category: license_system
  question: To obtain an Intermediate License in Oklahoma, a parent or guardian must
    certify that the applicant has completed how many hours of behind-the-wheel practice?
  choices:
    A: 30 hours (5 at night)
    B: 40 hours (10 at night)
    C: 50 hours (10 at night)
    D: 60 hours (15 at night)
  answer: C
  explanation: Oklahoma requires 50 hours of behind-the-wheel practice, 10 of which
    must be at night, certified by a parent or guardian.
- id: 6
  category: license_system
  question: If you move to a new residence within Oklahoma, you must notify the Department
    of Public Safety (DPS) of your change of address within how many days?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Oklahoma law requires you to notify DPS in writing of any change in
    your address or name within 10 days.
- id: 7
  category: license_system
  question: Under the Oklahoma Point System, your driver's license will be suspended
    if you accumulate how many points within a five-year period?
  choices:
    A: 7 points
    B: 10 points
    C: 12 points
    D: 15 points
  answer: B
  explanation: In Oklahoma, if you accumulate 10 or more points within a five-year
    period, your driving privilege will be suspended.
- id: 8
  category: license_system
  question: How many points can be removed from an Oklahoma driving record for successfully
    completing an approved Defensive Driving Course?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 5 points
  answer: B
  explanation: Completion of an Oklahoma-approved Defensive Driving Course will result
    in a 2-point reduction on your driving record. This can be done once every 24
    months.
- id: 9
  category: license_system
  question: How many points are deducted from an Oklahoma driving record for every
    12-month period in which no traffic violations are committed?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: All points
  answer: B
  explanation: For every 12-month period during which you have no traffic convictions,
    2 points will be removed from your Oklahoma driving record.
- id: 10
  category: license_system
  question: Oklahoma's Compulsory Insurance Law requires drivers to carry a minimum
    of how much coverage for property damage?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: Oklahoma law requires minimum liability limits of 25/50/25, where the
    final '25' represents $25,000 for property damage.
- id: 11
  category: license_system
  question: What is the minimum Blood Alcohol Concentration (BAC) level for a driver
    under the age of 21 to be cited for a DUI under Oklahoma's 'Zero Tolerance' law?
  choices:
    A: '0.01'
    B: Any measurable amount
    C: '0.05'
    D: '0.08'
  answer: B
  explanation: Oklahoma has a Zero Tolerance law for minors; any measurable amount
    of alcohol (even 0.01) will result in a license revocation for drivers under 21.
- id: 12
  category: license_system
  question: In Oklahoma, a standard Class D driver's license is typically valid for
    how many years?
  choices:
    A: 2 or 4 years
    B: 4 or 8 years
    C: 5 years
    D: 10 years
  answer: B
  explanation: As of recent Oklahoma law updates, drivers have the option to renew
    their license for either a 4-year or an 8-year period.
- id: 13
  category: license_system
  question: Which of the following documents is NOT acceptable as a primary form of
    identification when applying for an Oklahoma driver's license?
  choices:
    A: Certified U.S. Birth Certificate
    B: Valid U.S. Passport
    C: Social Security Card
    D: Certificate of Naturalization
  answer: C
  explanation: While a Social Security Card is required for the application, it is
    considered a secondary document, not a primary document like a birth certificate
    or passport.
- id: 14
  category: license_system
  question: If an Oklahoma driver is involved in a collision resulting in property
    damage exceeding what amount, they must file a report if the police did not investigate?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: B
  explanation: According to the Oklahoma Driver's Manual, if a collision results in
    injury, death, or property damage of more than $300, and a police report was not
    filed, you must file a report with DPS.
- id: 15
  category: license_system
  question: At what age can an Oklahoma teen who has completed driver education and
    held an Intermediate License for 6 months apply for an Unrestricted License?
  choices:
    A: 16 years old
    B: 16 and a half years old
    C: 17 years old
    D: 18 years old
  answer: B
  explanation: If a teen has completed driver education and held an Intermediate License
    for at least 6 months without any traffic convictions, they are eligible for an
    Unrestricted License at age 16.5.
- id: 16
  category: license_system
  question: To pass the Oklahoma vision screening, an applicant must have at least
    what visual acuity in both eyes, with or without corrective lenses?
  choices:
    A: 20/20
    B: 20/30
    C: 20/40
    D: 20/50
  answer: C
  explanation: According to the Oklahoma Driver Manual, you must have 20/40 vision
    or better in both eyes (with or without corrective lenses) to pass the vision
    screening without restrictions.
- id: 17
  category: license_system
  question: 'Under Oklahoma''s Implied Consent Law, if you are arrested for driving
    under the influence and refuse to take a state-administered chemical test of your
    breath or blood, your driving privileges will be:'
  choices:
    A: Suspended for 30 days
    B: Revoked for a period of 6 months to 3 years
    C: Reduced to a work-only permit immediately
    D: Unchanged until you are convicted in court
  answer: B
  explanation: By driving on Oklahoma roads, you give 'implied consent' to testing.
    Refusal results in an automatic revocation of your license by the Department of
    Public Safety, typically ranging from 6 months to 3 years depending on prior offenses.
- id: 18
  category: license_system
  question: If you change your name due to marriage or a court order, you must notify
    Service Oklahoma (formerly DPS) and obtain a replacement license within how many
    days?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: A
  explanation: Oklahoma law requires that any person who changes their name or address
    must notify the state in writing within 10 days.
- id: 19
  category: license_system
  question: In Oklahoma, what is the minimum age to apply for a restricted motorcycle
    license (for motorcycles 300cc or less)?
  choices:
    A: '14'
    B: '15'
    C: '15.5'
    D: '16'
  answer: A
  explanation: Oklahoma allows individuals who are 14 years old to apply for a restricted
    motorcycle license after completing a basic rider course and passing the required
    tests.
- id: 20
  category: license_system
  question: Which of the following is a requirement for a parent to teach 'Parent-Taught
    Driver Education' (PTDE) in Oklahoma?
  choices:
    A: The parent must have a commercial driving instructor license
    B: The parent must have held a valid driver license for the past 5 years
    C: The parent must use a curriculum approved by Service Oklahoma
    D: The parent must be a certified public school teacher
  answer: C
  explanation: Parents must use a state-approved PTDE provider and curriculum. They
    must also meet specific driving record requirements, but they do not need a commercial
    instructor license.
- id: 21
  category: license_system
  question: What is the standard reinstatement fee for an Oklahoma driver license
    suspended for a DUI (first offense)?
  choices:
    A: $50
    B: $150
    C: $300
    D: $500
  answer: C
  explanation: The statutory reinstatement fee for a license revoked for alcohol or
    drug-related offenses in Oklahoma is $300, in addition to other administrative
    fees.
- id: 22
  category: license_system
  question: 'In Oklahoma, a Class D driver license allows you to operate a vehicle
    with a Gross Vehicle Weight Rating (GVWR) of up to:'
  choices:
    A: 10,000 lbs
    B: 16,000 lbs
    C: 26,000 lbs
    D: 33,000 lbs
  answer: C
  explanation: A Class D license is the standard non-commercial license and allows
    the operation of vehicles with a GVWR of 26,000 lbs or less.
- id: 23
  category: license_system
  question: If you are caught driving without a valid driver license in Oklahoma,
    what is the maximum fine for a first offense?
  choices:
    A: $100
    B: $300
    C: $500
    D: $1,000
  answer: C
  explanation: Driving without a valid license in Oklahoma is a misdemeanor punishable
    by a fine of $50 to $500 and/or up to 30 days in jail for the first offense.
- id: 24
  category: license_system
  question: How long can an Oklahoma resident renew their driver license before the
    actual expiration date?
  choices:
    A: 30 days
    B: 6 months
    C: 1 year
    D: 2 years
  answer: C
  explanation: Oklahoma residents are permitted to renew their driver license up to
    one year (12 months) before the expiration date.
- id: 25
  category: license_system
  question: 'Under Oklahoma law, if you are convicted of ''Failure to Comply'' with
    the Compulsory Insurance Law, your license and registration will be suspended
    until:'
  choices:
    A: 30 days have passed
    B: You pay a $1,000 fine
    C: You provide proof of insurance and pay the reinstatement fees
    D: One year has passed
  answer: C
  explanation: Suspension for lack of insurance remains in effect until the driver
    provides proof of current insurance and pays all required reinstatement fees.
- id: 26
  category: license_system
  question: What is the primary purpose of the 'REAL ID' compliant Oklahoma driver
    license compared to a standard license?
  choices:
    A: It allows you to drive in other countries
    B: It is required for boarding domestic commercial flights and entering federal
      buildings
    C: It allows you to drive commercial semi-trucks
    D: It removes all GDL restrictions for teen drivers
  answer: B
  explanation: The REAL ID is a federal security standard. Starting May 7, 2025, Oklahomans
    will need a REAL ID (or another approved form of ID like a passport) to board
    domestic flights or enter secure federal facilities.
- id: 27
  category: license_system
  question: 'In Oklahoma, if you are under 18 and want to apply for a permit or license,
    you must provide proof of:'
  choices:
    A: Full-time employment
    B: Current enrollment in or graduation from high school
    C: Ownership of a vehicle
    D: A clean criminal record
  answer: B
  explanation: Oklahoma law requires applicants under 18 to demonstrate they are successfully
    enrolled in school, have graduated, or are in a home school program (the 'School
    Enrollment/Attendance' form).
- id: 28
  category: license_system
  question: Which of the following is a requirement for an Oklahoma Learner Permit
    holder when driving?
  choices:
    A: They must drive only during daylight hours
    B: A licensed driver age 21 or older must be in the front passenger seat
    C: They cannot have any passengers in the back seat
    D: They must have a parent or legal guardian in the vehicle at all times
  answer: B
  explanation: Oklahoma law requires a permit holder to be accompanied by a licensed
    driver who is at least 21 years of age and has been licensed for at least two
    years, seated in the front passenger seat.
- id: 29
  category: driver_testing
  question: In Oklahoma, what is the maximum speed limit on most turnpikes, unless
    otherwise posted?
  choices:
    A: 65 mph
    B: 70 mph
    C: 75 mph
    D: 80 mph
  answer: C
  explanation: According to the Oklahoma Driver's Manual, the maximum speed limit
    on turnpikes is 75 mph, although some sections may be posted at 80 mph.
- id: 30
  category: driver_testing
  question: When parking your vehicle near a fire hydrant in Oklahoma, what is the
    minimum distance you must maintain?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Oklahoma law prohibits parking within 15 feet of a fire hydrant.
- id: 31
  category: driver_testing
  question: In Oklahoma, you must use your turn signal at least how many feet before
    turning or changing lanes?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: The Oklahoma Driver's Manual states that you must signal for at least
    100 feet before you turn or change lanes.
- id: 32
  category: driver_testing
  question: When following another vehicle at night in Oklahoma, you must dim your
    high-beam headlights when you are within how many feet of the vehicle ahead?
  choices:
    A: 200 feet
    B: 400 feet
    C: 600 feet
    D: 1,000 feet
  answer: C
  explanation: Oklahoma law requires drivers to dim high beams when following within
    600 feet of another vehicle.
- id: 33
  category: driver_testing
  question: Under Oklahoma law, what is the maximum fine for a first-time conviction
    of littering from a vehicle?
  choices:
    A: Up to $500
    B: Up to $1,000
    C: Up to $2,000
    D: Up to $5,000
  answer: C
  explanation: Littering in Oklahoma is a serious offense; a conviction can result
    in a fine of up to $2,000 and/or jail time.
- id: 34
  category: driver_testing
  question: When approaching an oncoming vehicle at night, Oklahoma law requires you
    to dim your high-beam headlights within how many feet?
  choices:
    A: 300 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: You must dim your high beams when an oncoming vehicle is within 1,000
    feet.
- id: 35
  category: driver_testing
  question: In Oklahoma, children under what age must be properly secured in a child
    passenger restraint system (car seat)?
  choices:
    A: Under 4 years old
    B: Under 6 years old
    C: Under 8 years old
    D: Under 10 years old
  answer: C
  explanation: Oklahoma law requires children under 8 years of age to be in a child
    passenger restraint system unless they are taller than 4'9".
- id: 36
  category: driver_testing
  question: When parking a vehicle on a public street in Oklahoma, you must not park
    within how many feet of a stop sign?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Oklahoma law prohibits parking within 30 feet of a stop sign, flashing
    beacon, or traffic control signal.
- id: 37
  category: driver_testing
  question: According to the Oklahoma Driver's Manual, at what speed can hydroplaning
    (tires losing contact with the road) begin?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: Hydroplaning can begin at speeds as low as 35 mph, and at 55 mph, tires
    may lose all contact with the road.
- id: 38
  category: driver_testing
  question: In Oklahoma, if you are convicted of a first-offense DUI (Driving Under
    the Influence), what is the potential jail sentence?
  choices:
    A: No jail time, only a fine
    B: 10 days to 1 year
    C: 30 days to 2 years
    D: Minimum of 6 months
  answer: B
  explanation: A first-offense DUI in Oklahoma is a misdemeanor punishable by 10 days
    to 1 year in jail and a fine of up to $1,000.
- id: 39
  category: driver_testing
  question: 'When passing a bicycle in Oklahoma, drivers must maintain a safe distance
    of at least:'
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Oklahoma law requires motorists to leave at least 3 feet of space between
    their vehicle and a bicycle when passing.
- id: 40
  category: driver_testing
  question: 'When stopping for a school bus with red flashing lights and an extended
    stop arm on a divided highway with a physical barrier or median, traffic traveling
    in the opposite direction must:'
  choices:
    A: Stop until the lights stop flashing
    B: Slow down to 15 mph
    C: Proceed with caution; they are not required to stop
    D: Stop only if there are children present
  answer: C
  explanation: In Oklahoma, if a highway is divided by a physical barrier or median,
    traffic traveling in the opposite direction of a school bus is not required to
    stop.
- id: 41
  category: driver_testing
  question: When approaching a railroad crossing in Oklahoma, you must stop your vehicle
    within how many feet of the nearest rail?
  choices:
    A: 5 to 25 feet
    B: 10 to 30 feet
    C: 15 to 50 feet
    D: 20 to 60 feet
  answer: C
  explanation: Oklahoma law requires drivers to stop between 15 and 50 feet from the
    nearest rail at a railroad crossing when signals are active.
- id: 42
  category: driver_testing
  question: In Oklahoma, you are prohibited from parking within how many feet of a
    crosswalk at an intersection?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: C
  explanation: According to the Oklahoma Driver's Manual, you may not park within
    20 feet of a crosswalk at an intersection.
- id: 43
  category: driver_testing
  question: 'In Oklahoma, you must use your headlights from 1/2 hour after sunset
    to 1/2 hour before sunrise, and at any time you cannot see clearly for at least:'
  choices:
    A: 200 feet
    B: 500 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Oklahoma law requires headlights to be on when visibility is less than
    1,000 feet due to weather or light conditions.
- id: 44
  category: driver_testing
  question: In Oklahoma, a driver is considered to be 'Aggravated DUI' if their Blood
    Alcohol Concentration (BAC) is at or above what level?
  choices:
    A: 0.08%
    B: 0.10%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Oklahoma law defines Aggravated DUI as having a BAC of 0.15% or higher,
    which carries harsher penalties than a standard DUI.
- id: 45
  category: driver_testing
  question: When passing a bicycle traveling in the same direction, Oklahoma law requires
    motorists to leave at least how much space between the vehicle and the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Oklahoma's 'Safe Passage' law requires motorists to leave at least
    3 feet of space when overtaking a bicycle.
- id: 46
  category: driver_testing
  question: If your vehicle's turn signals are not working, what is the correct hand
    signal to indicate a left turn?
  choices:
    A: Arm extended straight out the window
    B: Arm extended upward
    C: Arm extended downward
    D: Arm waving in a circular motion
  answer: A
  explanation: The standard hand signal for a left turn is the left arm extended straight
    out the window.
- id: 47
  category: driver_testing
  question: The Oklahoma Driver's Manual recommends maintaining a following distance
    of at least how many seconds behind the vehicle in front of you?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: Oklahoma recommends the 'three-second rule' for a safe following distance
    under normal driving conditions.
- id: 48
  category: driver_testing
  question: According to the Oklahoma Driver's Manual, at what speed can your tires
    begin to lose all contact with the road during heavy rain (hydroplaning)?
  choices:
    A: 35 mph
    B: 45 mph
    C: 50 mph
    D: 65 mph
  answer: C
  explanation: The manual states that while hydroplaning can start at 35 mph, tires
    may lose all contact with the road at 50 mph.
- id: 49
  category: driver_testing
  question: Under Oklahoma law, who is required to wear a seat belt in a passenger
    vehicle?
  choices:
    A: Only the driver
    B: Only the driver and front-seat passengers
    C: Only passengers under the age of 18
    D: Every person in the front seat, and children under 13 in any seat
  answer: B
  explanation: 'Oklahoma law requires the driver and every front-seat passenger to
    wear a seat belt. (Note: Child restraint laws apply separately to back-seat passengers).'
- id: 50
  category: driver_testing
  question: In Oklahoma, is it legal to turn left on a red light?
  choices:
    A: No, never
    B: Yes, but only from a one-way street onto another one-way street
    C: Yes, after coming to a complete stop at any intersection
    D: Yes, but only between the hours of midnight and 5:00 AM
  answer: B
  explanation: In Oklahoma, you may turn left on red only when turning from a one-way
    street onto another one-way street, after stopping and yielding to traffic.
- id: 51
  category: driver_testing
  question: During the Oklahoma driving skills test, which of the following actions
    will result in an immediate failure?
  choices:
    A: Failing to use a turn signal once
    B: Hitting a curb while parallel parking
    C: A collision or 'dangerous action' that requires the examiner to intervene
    D: Driving 2 mph under the speed limit
  answer: C
  explanation: Any action that results in a collision, or a dangerous maneuver where
    the examiner must take control of the vehicle, results in an immediate failure
    of the road test.
- id: 52
  category: driver_responsibility
  question: When you sell a vehicle in Oklahoma, what must you do with the license
    plate?
  choices:
    A: Leave it on the vehicle for the new owner
    B: Destroy it immediately
    C: Keep the plate and either transfer it to another vehicle or turn it in
    D: Mail it to the person you bought the car from
  answer: C
  explanation: Oklahoma follows a 'Plate-to-Owner' system. When a vehicle is sold,
    the license plate stays with the owner, not the vehicle.
- id: 53
  category: driver_responsibility
  question: New residents moving to Oklahoma must register their vehicle within how
    many days of establishing residency?
  choices:
    A: 10 days
    B: 15 days
    C: 30 days
    D: 60 days
  answer: C
  explanation: Oklahoma law requires that new residents register their vehicles and
    obtain an Oklahoma title within 30 days of establishing residency.
- id: 54
  category: driver_responsibility
  question: Under the Oklahoma Point System, how many points are assessed against
    your driving record for a conviction of 'Reckless Driving'?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Reckless driving is considered a serious offense in Oklahoma and results
    in 4 points being added to the driver's record.
- id: 55
  category: driver_responsibility
  question: In Oklahoma, how many points are added to your driving record for a conviction
    of speeding more than 25 mph over the posted limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: While standard speeding usually results in 2 points, speeding in excess
    of 25 mph over the limit results in 3 points on an Oklahoma driving record.
- id: 56
  category: driver_responsibility
  question: If you are convicted of failing to stop for a school bus with red flashing
    lights and an extended stop arm, how many points will be added to your Oklahoma
    driving record?
  choices:
    A: 2 points
    B: 3 points
    C: 4 points
    D: 5 points
  answer: C
  explanation: Failure to stop for a school bus is a major violation in Oklahoma and
    carries a penalty of 4 points.
- id: 57
  category: driver_responsibility
  question: How many points are assessed for a conviction of 'Following too closely'
    (tailgating) in the state of Oklahoma?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following too closely is a 2-point violation under the Oklahoma Department
    of Public Safety point system.
- id: 58
  category: driver_responsibility
  question: If your Oklahoma driver's license is suspended for failure to provide
    proof of insurance, what is the statutory reinstatement fee you must pay?
  choices:
    A: $25
    B: $50
    C: $100
    D: $500
  answer: C
  explanation: To reinstate a license suspended under the Compulsory Insurance Law,
    the driver must provide proof of current insurance and pay a $100 reinstatement
    fee.
- id: 59
  category: driver_responsibility
  question: Oklahoma's Compulsory Insurance Law requires every owner of a motor vehicle
    to maintain liability insurance. What is the minimum coverage required for bodily
    injury to or death of ONE person in any one accident?
  choices:
    A: $10,000
    B: $20,000
    C: $25,000
    D: $50,000
  answer: C
  explanation: The minimum legal requirement for bodily injury to one person in Oklahoma
    is $25,000.
- id: 60
  category: driver_responsibility
  question: Which of the following is an acceptable way to present your Oklahoma Security
    Verification form to a law enforcement officer?
  choices:
    A: A paper copy only
    B: An image displayed on a cellular phone or electronic device
    C: A verbal statement of the policy number
    D: A handwritten note from your insurance agent
  answer: B
  explanation: Oklahoma law allows drivers to present proof of insurance in either
    a paper or electronic format, including on a smartphone.
- id: 61
  category: driver_responsibility
  question: In Oklahoma, how many points are assessed for 'Inattentive Driving'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Inattentive driving is a 2-point violation in the Oklahoma point system.
- id: 62
  category: driver_responsibility
  question: If you are convicted of 'Failure to yield the right-of-way' in Oklahoma,
    how many points are added to your record?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failure to yield results in 2 points being added to your driving record
    in Oklahoma.
- id: 63
  category: driver_responsibility
  question: Under Oklahoma law, who is responsible for ensuring that a Security Verification
    form is in the vehicle and valid?
  choices:
    A: Only the registered owner
    B: Only the driver
    C: Both the owner and the driver
    D: The insurance company
  answer: C
  explanation: Oklahoma law states that both the owner and the driver have the responsibility
    to ensure the vehicle is insured and that proof of insurance is in the vehicle.
- id: 64
  category: driver_responsibility
  question: What is the point value for a conviction of 'Left of center' or 'Wrong
    way on a one-way street' in Oklahoma?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Driving on the wrong side of the road or the wrong way on a one-way
    street results in 2 points in Oklahoma.
- id: 65
  category: driver_responsibility
  question: 'If you are involved in a collision in Oklahoma, you are required to show
    your Security Verification form to:'
  choices:
    A: Law enforcement officers only
    B: Other drivers involved in the collision only
    C: Law enforcement and any person or representative of any person injured or whose
      property was damaged
    D: No one, unless you are issued a ticket
  answer: C
  explanation: Oklahoma law requires you to show proof of insurance to law enforcement
    and to any other parties involved in the accident.
- id: 66
  category: driver_responsibility
  question: In Oklahoma, what is the maximum fine for a first-time conviction of driving
    without a valid security verification (proof of insurance)?
  choices:
    A: $100
    B: $250
    C: $500
    D: $1,000
  answer: B
  explanation: Under Oklahoma law, failing to carry valid insurance can result in
    a fine of up to $250, 30 days in jail, or both, as well as suspension of driving
    privileges.
- id: 67
  category: driver_responsibility
  question: Upon purchasing a new or used vehicle in Oklahoma, how many days do you
    have to transfer the title and register the vehicle?
  choices:
    A: 10 days
    B: 20 days
    C: 30 days
    D: 45 days
  answer: C
  explanation: Oklahoma law requires that a vehicle title be transferred and the vehicle
    registered within 30 days of the date of purchase to avoid penalties.
- id: 68
  category: driver_responsibility
  question: If you are involved in a collision in Oklahoma that results in injury
    or death, and a police officer does not investigate, you must file a written report
    within how many days?
  choices:
    A: 24 hours
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: If a collision is not investigated by an officer and results in injury,
    death, or property damage over $500, a report must be filed with Service Oklahoma
    within 10 days.
- id: 69
  category: driver_responsibility
  question: In Oklahoma, how many points are added to your driving record for the
    offense of 'Following too closely'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following too closely (tailgating) results in 2 points being added
    to an Oklahoma driving record.
- id: 70
  category: driver_responsibility
  question: Which of the following is NOT a requirement for a valid Oklahoma Security
    Verification Form (proof of insurance)?
  choices:
    A: The vehicle's Year, Make, and VIN
    B: The insurance policy number
    C: The insurance company's name and address
    D: The driver's social security number
  answer: D
  explanation: A security verification form must include vehicle details, policy number,
    and company info, but it does not require the driver's social security number.
- id: 71
  category: driver_responsibility
  question: 'For a first DUI conviction (not under the Zero Tolerance law) in Oklahoma,
    an adult driver may face a jail term of:'
  choices:
    A: Not less than 10 days nor more than 1 year
    B: Exactly 48 hours
    C: No jail time, only a fine
    D: Minimum of 30 days
  answer: A
  explanation: A first DUI conviction for an adult in Oklahoma is a misdemeanor and
    carries a potential jail sentence of 10 days to 1 year.
- id: 72
  category: driver_responsibility
  question: 'In Oklahoma, the ''Actual Physical Control'' (APC) law means that:'
  choices:
    A: You can only be arrested for DUI if the vehicle is in motion
    B: You can be arrested for DUI even if the vehicle is parked and the engine is
      off if you are intoxicated and in the driver's seat
    C: You are only responsible for the vehicle if you own it
    D: You must have your hands on the steering wheel at all times
  answer: B
  explanation: APC laws allow for a DUI arrest if an intoxicated person is in a position
    to operate the vehicle (e.g., sitting in the driver's seat with the keys), even
    if the vehicle is not moving.
- id: 73
  category: driver_responsibility
  question: Under Oklahoma's point system, how many points are added to your record
    for 'Failure to Yield'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failure to yield right-of-way results in 2 points being added to an
    Oklahoma driver's record.
- id: 74
  category: driver_responsibility
  question: 'Oklahoma is a member of the ''Driver License Compact.'' This means that:'
  choices:
    A: Your license is valid in all 50 states
    B: Traffic violations committed in other member states will be reported to Oklahoma
      and recorded on your driving record
    C: You do not need insurance when driving in other states
    D: You can have multiple licenses from different states
  answer: B
  explanation: The Driver License Compact is an agreement between states to share
    information regarding traffic convictions and license suspensions of non-residents.
- id: 75
  category: driver_responsibility
  question: In Oklahoma, where must the license plate be displayed on a standard passenger
    vehicle?
  choices:
    A: On the front bumper only
    B: On the rear of the vehicle only
    C: On both the front and rear bumpers
    D: In the rear window
  answer: B
  explanation: Oklahoma law requires the license plate to be securely attached to
    the rear of the vehicle (except for certain truck tractors).
- id: 76
  category: driver_responsibility
  question: 'In Oklahoma, liability insurance is designed to pay for:'
  choices:
    A: Damage to your own vehicle regardless of fault
    B: Medical expenses for you and your passengers only
    C: Injuries and property damage you cause to others in an accident
    D: Theft or vandalism of your vehicle
  answer: C
  explanation: Oklahoma's Compulsory Insurance Law requires liability insurance to
    ensure you can pay for the damages or injuries you cause to other people in a
    collision.
- id: 77
  category: safe_driving_rules
  question: When parking your vehicle parallel to a curb in Oklahoma, the wheels must
    be within how many inches of the curb?
  choices:
    A: 6 inches
    B: 12 inches
    C: 18 inches
    D: 24 inches
  answer: C
  explanation: Oklahoma law requires that when parking parallel, your vehicle's right-hand
    wheels must be within 18 inches of the curb.
- id: 78
  category: safe_driving_rules
  question: In Oklahoma, it is illegal to park within how many feet of a fire hydrant?
  choices:
    A: 10 feet
    B: 15 feet
    C: 20 feet
    D: 25 feet
  answer: B
  explanation: Under Oklahoma law, you are prohibited from parking within 15 feet
    of a fire hydrant.
- id: 79
  category: safe_driving_rules
  question: When parking near a stop sign, flashing beacon, or traffic control signal,
    what is the minimum distance you must maintain?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: In Oklahoma, you may not park within 30 feet of any flashing beacon,
    stop sign, or traffic control signal located at the side of a roadway.
- id: 80
  category: safe_driving_rules
  question: Under Oklahoma law, you must dim your high-beam headlights when you are
    within how many feet of an oncoming vehicle?
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: The Oklahoma Driver's Manual states you must use low-beam headlights
    when approaching an oncoming vehicle within 500 feet.
- id: 81
  category: safe_driving_rules
  question: In Oklahoma, what is the recommended following distance behind the vehicle
    in front of you under ideal conditions?
  choices:
    A: 1 second
    B: 2 seconds
    C: 3 seconds
    D: 5 seconds
  answer: C
  explanation: The Oklahoma Driver's Manual recommends using the 'three-second rule'
    to maintain a safe following distance under normal driving conditions.
- id: 82
  category: safe_driving_rules
  question: At what speed does hydroplaning usually begin on wet roads in Oklahoma?
  choices:
    A: 25 mph
    B: 35 mph
    C: 45 mph
    D: 55 mph
  answer: B
  explanation: In Oklahoma, hydroplaning (where tires lose contact with the road and
    ride on a layer of water) can start at speeds as low as 35 mph.
- id: 83
  category: safe_driving_rules
  question: In Oklahoma, it is illegal to pass another vehicle when you are within
    how many feet of an intersection or railroad crossing?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 300 feet
  answer: B
  explanation: Oklahoma law prohibits passing when you are within 100 feet of an intersection,
    railroad crossing, bridge, viaduct, or tunnel.
- id: 84
  category: safe_driving_rules
  question: What is the maximum speed limit for a school bus on an Oklahoma highway,
    unless otherwise posted?
  choices:
    A: 35 mph
    B: 45 mph
    C: 55 mph
    D: 65 mph
  answer: C
  explanation: In Oklahoma, the maximum speed limit for school buses is 55 mph on
    highways, unless a lower limit is posted.
- id: 85
  category: safe_driving_rules
  question: In Oklahoma, what is the penalty for a first-time conviction of failing
    to stop for a school bus loading or unloading children?
  choices:
    A: A fine of $100
    B: A fine of at least $100 and up to $500
    C: Automatic 1-year jail sentence
    D: No fine, just a warning
  answer: B
  explanation: Failing to stop for a school bus in Oklahoma results in a fine of not
    less than $100 and not more than $500 for the first offense.
- id: 86
  category: safe_driving_rules
  question: If you are driving on a four-lane divided highway and a school bus is
    stopped on the opposite side of the median with its red lights flashing, do you
    need to stop?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you do not need to stop if there is a physical barrier or median
    C: Yes, but only if there are children crossing
    D: No, but you must honk your horn
  answer: B
  explanation: In Oklahoma, you are not required to stop for a school bus if you are
    traveling in the opposite direction on a highway divided by a median or physical
    barrier.
- id: 87
  category: safe_driving_rules
  question: Under Oklahoma law, when are you allowed to turn left on a red light?
  choices:
    A: Never
    B: When turning from a one-way street onto another one-way street
    C: When turning from a two-way street onto a one-way street
    D: Only between the hours of midnight and 5:00 AM
  answer: B
  explanation: Oklahoma law permits a left turn on red only when turning from a one-way
    street onto another one-way street, after coming to a complete stop and yielding
    to traffic and pedestrians.
- id: 88
  category: safe_driving_rules
  question: In Oklahoma, what is the minimum distance you must park from a railroad
    crossing?
  choices:
    A: 15 feet
    B: 25 feet
    C: 50 feet
    D: 100 feet
  answer: C
  explanation: According to the Oklahoma Driver's Manual, you may not park within
    50 feet of the nearest rail of a railroad crossing.
- id: 89
  category: safe_driving_rules
  question: Under Oklahoma law, a left turn on a red light is only permitted under
    which of the following circumstances?
  choices:
    A: When turning from a two-way street onto a one-way street
    B: When turning from a one-way street onto another one-way street
    C: At any intersection after coming to a complete stop
    D: Left turns on red are never permitted in Oklahoma
  answer: B
  explanation: In Oklahoma, you may only turn left on a red light if you are turning
    from a one-way street onto another one-way street, after stopping and yielding
    to traffic and pedestrians.
- id: 90
  category: safe_driving_rules
  question: When passing a bicycle traveling in the same direction in Oklahoma, what
    is the minimum safe distance a motorist must maintain between the vehicle and
    the bicycle?
  choices:
    A: 2 feet
    B: 3 feet
    C: 5 feet
    D: 10 feet
  answer: B
  explanation: Oklahoma law (HB 2453) requires motorists to leave at least 3 feet
    of space when passing a bicycle.
- id: 91
  category: safe_driving_rules
  question: On a highway with at least two lanes of traffic in each direction separated
    by a median or physical barrier, who must stop for a school bus with red flashing
    lights and an extended stop arm?
  choices:
    A: Traffic in both directions must stop
    B: Only traffic following the bus must stop
    C: Only traffic approaching from the front must stop
    D: No one is required to stop if there are four or more lanes
  answer: B
  explanation: In Oklahoma, if a highway is divided by a median or barrier, only traffic
    following the bus is required to stop. Traffic traveling in the opposite direction
    may proceed with caution.
- id: 92
  category: safe_driving_rules
  question: In Oklahoma, what happens to the fines for speeding in a designated maintenance
    or construction zone when workers are present?
  choices:
    A: Fines are increased by $100
    B: Fines are doubled
    C: Fines are tripled
    D: Fines remain the same but points are doubled
  answer: B
  explanation: Oklahoma law mandates that fines for traffic violations in work zones
    are doubled when workers are present.
- id: 93
  category: safe_driving_rules
  question: You must not park your vehicle within how many feet of a stop sign, flashing
    beacon, or traffic control signal?
  choices:
    A: 15 feet
    B: 20 feet
    C: 30 feet
    D: 50 feet
  answer: C
  explanation: Oklahoma law prohibits parking within 30 feet of any flashing beacon,
    stop sign, or traffic control signal located at the side of a roadway.
- id: 94
  category: safe_driving_rules
  question: 'To maintain a safe following distance under normal driving conditions
    in Oklahoma, you should use the:'
  choices:
    A: One-car-length rule
    B: Two-second rule
    C: Three-second rule
    D: Four-second rule
  answer: C
  explanation: The Oklahoma Driver's Manual recommends the 'three-second rule' to
    maintain a safe following distance behind the vehicle in front of you.
- id: 95
  category: safe_driving_rules
  question: 'Oklahoma''s ''Move Over'' law requires motorists approaching a stationary
    emergency vehicle with flashing lights to:'
  choices:
    A: Stop immediately in the lane of travel
    B: Maintain speed but honk to alert the emergency workers
    C: Move to the left lane if possible, or slow down to a safe speed if a lane change
      is not possible
    D: Speed up to pass the scene as quickly as possible
  answer: C
  explanation: Oklahoma's Move Over law requires drivers to move to a non-adjacent
    lane on multi-lane highways or slow down significantly if they cannot safely change
    lanes when passing stationary emergency or maintenance vehicles.
- id: 96
  category: safe_driving_rules
  question: When preparing to turn, Oklahoma law requires you to signal your intention
    to turn at least how many feet before the turn?
  choices:
    A: 50 feet
    B: 100 feet
    C: 150 feet
    D: 200 feet
  answer: B
  explanation: You must give a continuous turn signal for at least 100 feet before
    turning or changing lanes.
- id: 97
  category: safe_driving_rules
  question: 'When parking your vehicle headed uphill on a two-way street with a curb,
    you should turn your front wheels:'
  choices:
    A: Toward the curb
    B: Away from the curb
    C: Parallel to the curb
    D: To the right
  answer: B
  explanation: When parking uphill against a curb, turn your wheels away from the
    curb (to the left) so that if the car rolls, the back of the front tire will hit
    the curb and stop the car.
- id: 98
  category: defensive_driving
  question: According to the Oklahoma Driver's Manual, what is the recommended following
    distance for most driving conditions to avoid a rear-end collision?
  choices:
    A: One car length for every 10 mph
    B: Two seconds
    C: Three seconds
    D: Four seconds
  answer: C
  explanation: Oklahoma recommends a 'three-second rule' for following distance under
    normal conditions. You should increase this distance during poor weather or at
    higher speeds.
- id: 99
  category: defensive_driving
  question: To practice defensive driving, how far ahead should you scan the road
    for potential hazards in both city and highway driving?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 30 seconds
  answer: C
  explanation: Oklahoma driving guidelines suggest looking 15 seconds ahead. In the
    city, this is about one block; on the highway, it is about a quarter of a mile.
- id: 100
  category: defensive_driving
  question: In Oklahoma, at what speed can hydroplaning (where tires lose contact
    with the road and ride on a thin film of water) begin?
  choices:
    A: As low as 35 mph
    B: At least 45 mph
    C: Only above 55 mph
    D: Only during heavy thunderstorms
  answer: A
  explanation: Hydroplaning can begin at speeds as low as 35 mph. In a heavy rain,
    your tires can lose all contact with the road at 55 mph.
- id: 101
  category: defensive_driving
  question: 'Oklahoma law requires you to turn on your headlights whenever you are
    using your windshield wipers due to weather conditions and whenever visibility
    is less than:'
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: State law requires headlights to be on when visibility is less than
    1,000 feet and when wipers are in use due to rain, snow, or sleet.
- id: 102
  category: defensive_driving
  question: When driving in heavy fog in Oklahoma, which headlight setting should
    you use to maintain the best visibility?
  choices:
    A: High beams
    B: Low beams
    C: Parking lights only
    D: Hazard lights
  answer: B
  explanation: Low beams should be used in fog. High beams reflect off the moisture
    in the air, causing glare and making it harder to see.
- id: 103
  category: defensive_driving
  question: 'According to the Oklahoma Driver''s Manual, if your vehicle starts to
    skid on a slippery road, you should:'
  choices:
    A: Brake hard immediately
    B: Turn the steering wheel in the opposite direction of the skid
    C: Take your foot off the gas and steer in the direction the rear of the car is
      sliding
    D: Shift into neutral and turn off the engine
  answer: C
  explanation: To recover from a skid, take your foot off the accelerator and steer
    in the direction the rear of the vehicle is skidding. Do not jam on the brakes.
- id: 104
  category: defensive_driving
  question: In Oklahoma, you must turn on your headlights during what time period?
  choices:
    A: From sunset to sunrise
    B: From one hour after sunset to one hour before sunrise
    C: From 30 minutes after sunset to 30 minutes before sunrise
    D: Only when it is completely dark
  answer: C
  explanation: Oklahoma law requires headlights to be turned on from 30 minutes after
    sunset to 30 minutes before sunrise.
- id: 105
  category: defensive_driving
  question: When a school bus is stopped on a divided highway with a median or physical
    barrier, which vehicles are required to stop for its red flashing lights and extended
    stop arm?
  choices:
    A: Only traffic following the bus
    B: Only traffic approaching from the front
    C: Traffic in both directions
    D: No vehicles are required to stop on divided highways
  answer: A
  explanation: In Oklahoma, if a bus is on a divided highway with a median or barrier,
    only traffic following the bus must stop. Traffic on the opposite side of the
    barrier does not have to stop.
- id: 106
  category: defensive_driving
  question: During cold and wet weather, why are bridges and overpasses in Oklahoma
    particularly dangerous?
  choices:
    A: They are usually narrower than the rest of the road
    B: They freeze before the rest of the road
    C: They are more likely to have potholes
    D: The speed limit is higher on bridges
  answer: B
  explanation: Bridges and overpasses freeze before the rest of the road because they
    are exposed to cold air on both the top and bottom.
- id: 107
  category: defensive_driving
  question: If an oncoming vehicle's high-beam headlights blind you at night, where
    should you look to avoid being temporarily blinded?
  choices:
    A: Directly at the oncoming headlights
    B: At the center line of the road
    C: Toward the right edge of the road or the white fog line
    D: Close your eyes for a split second
  answer: C
  explanation: To avoid being blinded by high beams, look toward the right edge of
    your lane or the white line (fog line) until the vehicle passes.
- id: 108
  category: defensive_driving
  question: Under normal conditions, what is the approximate total stopping distance
    (including perception and reaction time) for a car traveling at 55 mph?
  choices:
    A: 100 feet
    B: 200 feet
    C: 400 feet
    D: 550 feet
  answer: B
  explanation: According to the Oklahoma Driver's Manual, at 55 mph, the total stopping
    distance is about 200 feet.
- id: 109
  category: defensive_driving
  question: When entering an Oklahoma expressway (interstate), what is the primary
    purpose of the acceleration lane?
  choices:
    A: To provide a place to stop and wait for a gap
    B: To allow you to reach the speed of expressway traffic
    C: To give you a place to pass slower vehicles
    D: To allow you to check your GPS safely
  answer: B
  explanation: The acceleration lane is designed to allow drivers to increase their
    speed to match the flow of traffic on the expressway before merging.
- id: 110
  category: defensive_driving
  question: To avoid last-minute braking or the need to turn suddenly, Oklahoma drivers
    should look ahead at least how many seconds?
  choices:
    A: 5 seconds
    B: 10 seconds
    C: 15 seconds
    D: 20 seconds
  answer: C
  explanation: The Oklahoma Driver's Manual states that you should scan the road at
    least 15 seconds ahead to anticipate hazards and traffic changes.
- id: 111
  category: defensive_driving
  question: If your vehicle begins to skid on a slippery Oklahoma road, which of the
    following is the correct defensive driving technique?
  choices:
    A: Slam on the brakes immediately
    B: Turn the steering wheel in the direction the rear of the car is sliding
    C: Turn the steering wheel away from the direction of the skid
    D: Shift the car into neutral and turn off the engine
  answer: B
  explanation: To recover from a skid, you should take your foot off the gas and turn
    the steering wheel in the direction the rear of the vehicle is sliding.
- id: 112
  category: defensive_driving
  question: When driving on Oklahoma roads during adverse conditions like rain, snow,
    or ice, how should you adjust your following distance?
  choices:
    A: Keep the standard 3-second distance
    B: Decrease it to 1 second to stay close to the vehicle ahead
    C: Increase it to at least 4 to 6 seconds or more
    D: Following distance does not matter if you have winter tires
  answer: C
  explanation: In adverse weather or poor road conditions, you should increase your
    following distance to allow more time and space for braking.
- id: 113
  category: defensive_driving
  question: 'To check your ''blind spots'' before changing lanes in Oklahoma, you
    should:'
  choices:
    A: Check your rearview mirror only
    B: Check your side mirrors only
    C: Turn your head and look over your shoulder in the direction you plan to move
    D: Flash your high beams to see if anyone is there
  answer: C
  explanation: Mirrors do not show everything; you must turn your head to check the
    areas (blind spots) that mirrors cannot see before changing lanes.
- id: 114
  category: defensive_driving
  question: 'If your vehicle is equipped with Anti-lock Braking System (ABS) and you
    need to stop quickly on a wet Oklahoma road, you should:'
  choices:
    A: Pump the brakes rapidly
    B: Apply firm, steady pressure to the brake pedal
    C: Lightly tap the brakes
    D: Use the emergency brake only
  answer: B
  explanation: With ABS, you should apply firm, steady pressure. Do not pump the brakes,
    as the system does this automatically to prevent wheel lock-up.
- id: 115
  category: defensive_driving
  question: In Oklahoma, when must you stop for a school bus with red flashing lights
    and an extended stop arm on a two-lane road?
  choices:
    A: Only if you are following the bus
    B: Only if children are currently crossing
    C: Drivers approaching from both directions must stop
    D: You do not need to stop if the speed limit is over 45 mph
  answer: C
  explanation: On a two-lane road, traffic in both directions must stop for a school
    bus with its red lights flashing and stop arm extended.
- id: 116
  category: defensive_driving
  question: Why are Oklahoma roads most slippery during the first few minutes of a
    rainstorm?
  choices:
    A: The tires are still hot from dry pavement
    B: The rain mixes with oil and dust on the road surface
    C: The rain is colder at the beginning of a storm
    D: Hydroplaning only happens in the first five minutes
  answer: B
  explanation: When it first starts to rain, the water mixes with oil, grease, and
    dust on the road, creating a very slippery film before it is washed away.
- id: 117
  category: alcohol_drugs_health
  question: In Oklahoma, what is the legal Blood Alcohol Concentration (BAC) limit
    for a driver over the age of 21?
  choices:
    A: 0.02%
    B: 0.05%
    C: 0.08%
    D: 0.10%
  answer: C
  explanation: For drivers aged 21 and older, it is illegal to drive with a BAC of
    0.08% or higher in Oklahoma.
- id: 118
  category: alcohol_drugs_health
  question: What is the maximum fine for a first-offense DUI conviction in Oklahoma
    (excluding court costs and fees)?
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: A first-offense DUI conviction in Oklahoma is a misdemeanor and can
    result in a fine of up to $1,000.
- id: 119
  category: alcohol_drugs_health
  question: A first-offense DUI conviction in Oklahoma can result in a mandatory jail
    term of at least how many days?
  choices:
    A: 2 days
    B: 5 days
    C: 10 days
    D: 30 days
  answer: C
  explanation: In Oklahoma, a first-offense DUI conviction carries a potential jail
    sentence of 10 days to one year.
- id: 120
  category: alcohol_drugs_health
  question: 'In Oklahoma, the ''Actual Physical Control'' (APC) law means you can
    be arrested for a DUI even if:'
  choices:
    A: The vehicle is not moving and the engine is off
    B: You are in the passenger seat
    C: You are outside the vehicle with the keys in your pocket
    D: You are on private property
  answer: A
  explanation: Oklahoma's APC law allows for a DUI arrest if a person is in a position
    to operate the vehicle (such as sitting in the driver's seat with the keys accessible)
    while intoxicated, even if the vehicle is parked.
- id: 121
  category: alcohol_drugs_health
  question: 'If an Oklahoma driver is convicted of a DUI while a child under the age
    of 18 is in the vehicle, the offense is classified as:'
  choices:
    A: A petty misdemeanor
    B: A standard misdemeanor
    C: Child Endangerment, which is a felony
    D: A non-criminal traffic violation
  answer: C
  explanation: Driving under the influence with a minor passenger in Oklahoma is considered
    Child Endangerment, which is a felony offense and carries significantly higher
    penalties.
- id: 122
  category: alcohol_drugs_health
  question: According to the Oklahoma Driver's Manual, what is the first thing affected
    by the consumption of alcohol?
  choices:
    A: Vision
    B: Muscle coordination
    C: Judgment
    D: Balance
  answer: C
  explanation: Judgment is the first faculty to be impaired by alcohol, which often
    leads drivers to believe they are capable of driving safely when they are not.
- id: 123
  category: alcohol_drugs_health
  question: In Oklahoma, if you are under 21 and any measurable amount of alcohol
    is found in your system, your license will be revoked for how long for a first
    offense?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: Under Oklahoma's Zero Tolerance law, a first-offense DUI or APC for
    a person under 21 results in a 6-month license revocation.
- id: 124
  category: alcohol_drugs_health
  question: Oklahoma's 'Open Container' law prohibits which of the following?
  choices:
    A: Any unsealed alcoholic beverage in the passenger area of a vehicle
    B: Alcohol in the trunk of the vehicle
    C: Unopened beer in the backseat
    D: Alcohol in a locked glove compartment
  answer: A
  explanation: It is illegal to have an open container of an alcoholic beverage in
    the passenger area of a motor vehicle on any public street or highway in Oklahoma.
- id: 125
  category: alcohol_drugs_health
  question: If you are taking a prescription drug and it impairs your driving ability,
    can you be charged with a DUI in Oklahoma?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI only applies to alcohol
    C: Yes, if the drug makes you incapable of safely operating a motor vehicle
    D: Only if the drug is a controlled substance
  answer: C
  explanation: In Oklahoma, a DUI charge can result from the use of any substance—legal
    or illegal, prescription or over-the-counter—that renders a driver incapable of
    safely operating a vehicle.
- id: 126
  category: alcohol_drugs_health
  question: What is the only effective way to reduce your Blood Alcohol Concentration
    (BAC) after drinking?
  choices:
    A: Drinking black coffee
    B: Taking a cold shower
    C: Exercising vigorously
    D: Allowing time to pass
  answer: D
  explanation: Only time can sober a person up. Coffee, showers, and exercise do not
    speed up the process of alcohol leaving the bloodstream.
- id: 127
  category: alcohol_drugs_health
  question: 'Under Oklahoma law, a person who possesses a valid medical marijuana
    patient license:'
  choices:
    A: May drive while under the influence of marijuana
    B: Is exempt from DUI-Drug laws
    C: May still be charged with a DUI if they are impaired while driving
    D: Can only be charged with a DUI if they also have alcohol in their system
  answer: C
  explanation: Having a medical marijuana license does not grant the right to drive
    while impaired. Oklahoma law prohibits driving under the influence of any intoxicating
    substance, including marijuana.
- id: 128
  category: alcohol_drugs_health
  question: 'In Oklahoma, if you are convicted of a second DUI offense within ten
    years, the crime is classified as:'
  choices:
    A: A misdemeanor
    B: A felony
    C: A civil infraction
    D: A non-arrestable offense
  answer: B
  explanation: A second DUI conviction within a ten-year period in Oklahoma is a felony
    offense.
- id: 129
  category: alcohol_drugs_health
  question: 'Oklahoma''s Impaired Driver Accountability Program (IDAP) allows certain
    drivers to maintain driving privileges by:'
  choices:
    A: Paying a double fine
    B: Installing an ignition interlock device
    C: Attending a 4-hour safety course
    D: Driving only during daylight hours
  answer: B
  explanation: The IDAP program is an alternative to license revocation that requires
    the participant to install and maintain an ignition interlock device on their
    vehicle.
- id: 130
  category: alcohol_drugs_health
  question: 'If you have a physical or mental condition that might affect your driving
    (such as epilepsy), Oklahoma law requires you to:'
  choices:
    A: Surrender your license immediately
    B: Report the condition to Service Oklahoma (formerly DPS)
    C: Only drive with a passenger
    D: Wait 5 years before applying for a license
  answer: B
  explanation: Drivers must report any physical or mental conditions that could impair
    their ability to drive safely to Service Oklahoma for medical review.
- id: 131
  category: alcohol_drugs_health
  question: Under Oklahoma law, what is the maximum jail sentence for a first-offense
    DUI conviction?
  choices:
    A: 30 days
    B: 90 days
    C: 6 months
    D: 1 year
  answer: D
  explanation: A first-offense DUI conviction in Oklahoma is a misdemeanor punishable
    by imprisonment in jail for not less than ten days nor more than one year.
- id: 132
  category: alcohol_drugs_health
  question: 'In Oklahoma, an ''Aggravated DUI'' charge applies if the driver''s Blood
    Alcohol Concentration (BAC) is at or above:'
  choices:
    A: 0.10%
    B: 0.12%
    C: 0.15%
    D: 0.20%
  answer: C
  explanation: Oklahoma law defines Aggravated DUI as driving with a BAC of 0.15%
    or higher. This carries additional penalties, including mandatory ignition interlock
    and treatment.
- id: 133
  category: alcohol_drugs_health
  question: Under Oklahoma's Zero Tolerance law, a driver under 21 years of age who
    is found with any measurable amount of alcohol in their system will have their
    license revoked for how long for a first offense?
  choices:
    A: 30 days
    B: 60 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: For drivers under 21, any measurable amount of alcohol results in an
    immediate revocation of driving privileges for 6 months for a first offense.
- id: 134
  category: alcohol_drugs_health
  question: In Oklahoma, if you are a first-time offender who refuses or fails a breath
    test, you may participate in the IDAP program to keep driving. What does IDAP
    stand for?
  choices:
    A: Intoxicated Driver Assistance Plan
    B: Impaired Driver Accountability Program
    C: Immediate Driver Alcohol Prohibition
    D: Interstate Driving Authority Protocol
  answer: B
  explanation: IDAP stands for the Impaired Driver Accountability Program, which allows
    drivers to maintain driving privileges by installing an ignition interlock device.
- id: 135
  category: alcohol_drugs_health
  question: 'To be eligible for an Oklahoma driver''s license, a person with a history
    of seizures must generally be seizure-free for a period of:'
  choices:
    A: 3 months
    B: 6 months
    C: 1 year
    D: 2 years
  answer: B
  explanation: Oklahoma medical standards generally require a person with a seizure
    disorder to be seizure-free for 6 months before being allowed to drive.
- id: 136
  category: alcohol_drugs_health
  question: In Oklahoma, can you be arrested for DUI if you are under the influence
    of a legal prescription drug?
  choices:
    A: No, as long as you have a valid prescription
    B: No, DUI only applies to alcohol and illegal drugs
    C: Yes, if the drug makes you incapable of safely driving a motor vehicle
    D: Only if you also have alcohol in your system
  answer: C
  explanation: Oklahoma law states it is unlawful to drive under the influence of
    any intoxicating substance, including prescription or over-the-counter drugs,
    if they render you incapable of safely operating a vehicle.
- id: 137
  category: alcohol_drugs_health
  question: What is the primary effect of mixing alcohol with other drugs, such as
    tranquilizers or antihistamines?
  choices:
    A: The effects of the alcohol are cancelled out
    B: The drugs become less potent
    C: The effects are multiplied (synergistic effect)
    D: There is no change in the level of impairment
  answer: C
  explanation: Mixing alcohol with other drugs can produce a synergistic effect, meaning
    the combined impact on the central nervous system is much greater than the sum
    of the individual effects.
- id: 138
  category: alcohol_drugs_health
  question: 'In Oklahoma, if you are involved in a collision and a law enforcement
    officer has reasonable grounds to believe you were driving under the influence,
    they can:'
  choices:
    A: Only test you if you are conscious
    B: Require you to submit to a blood or breath test under Implied Consent
    C: Only test you if there was a fatality
    D: Not test you without a search warrant
  answer: B
  explanation: Under Oklahoma's Implied Consent law, any person who operates a motor
    vehicle is deemed to have given consent to a test of their blood or breath for
    the purpose of determining alcohol or drug content.
- id: 139
  category: alcohol_drugs_health
  question: 'In Oklahoma, if you are convicted of a first-offense DWI (Driving While
    Impaired), your license will be revoked for:'
  choices:
    A: 10 days
    B: 30 days
    C: 6 months
    D: 1 year
  answer: C
  explanation: A first-offense DWI in Oklahoma results in a driver's license revocation
    for a period of 6 months.
- id: 140
  category: penalties_and_points
  question: If your Oklahoma driving privilege is suspended for the first time due
    to accumulating 10 or more points, how long will the suspension last?
  choices:
    A: 10 days
    B: 30 days
    C: 60 days
    D: 90 days
  answer: B
  explanation: The first suspension for point accumulation in Oklahoma lasts for 1
    month (30 days).
- id: 141
  category: penalties_and_points
  question: If you accumulate 10 or more points for a second time within a five-year
    period in Oklahoma, for how long will your license be suspended?
  choices:
    A: 3 months
    B: 6 months
    C: 12 months
    D: 2 years
  answer: A
  explanation: A second suspension under the Oklahoma Point System within five years
    results in a 3-month suspension.
- id: 142
  category: penalties_and_points
  question: In Oklahoma, what is the fine for failing to wear a safety belt (seatbelt)
    or failing to require a passenger to wear one?
  choices:
    A: ' $10'
    B: ' $20'
    C: ' $50'
    D: ' $100'
  answer: B
  explanation: The fine for a seatbelt violation in Oklahoma is $20, which includes
    court costs.
- id: 143
  category: penalties_and_points
  question: In Oklahoma, what is the maximum fine for passing a stopped school bus
    that has its red loading lights flashing and stop arm extended?
  choices:
    A: ' $100'
    B: ' $250'
    C: ' $500'
    D: ' $1,000'
  answer: D
  explanation: Passing a stopped school bus with red lights flashing is a dangerous
    violation in Oklahoma, punishable by a fine of up to $1,000.
- id: 144
  category: penalties_and_points
  question: In Oklahoma, traffic fines are __________ when a violation occurs in a
    maintenance or construction zone while workers are present.
  choices:
    A: Tripled
    B: Doubled
    C: Increased by $100
    D: Reduced if the driver is cooperative
  answer: B
  explanation: To protect road workers, Oklahoma law mandates that traffic fines be
    doubled for violations occurring in work zones when workers are present.
- id: 145
  category: penalties_and_points
  question: Which of the following convictions will result in the mandatory revocation
    of an Oklahoma driver's license?
  choices:
    A: Failure to signal a turn
    B: Manslaughter or negligent homicide resulting from the operation of a motor
      vehicle
    C: Speeding 10 mph over the limit
    D: Following too closely
  answer: B
  explanation: Conviction of manslaughter or negligent homicide involving a vehicle
    requires the Department of Public Safety to revoke the driver's license.
- id: 146
  category: penalties_and_points
  question: 'A first-offense DUI (Driving Under the Influence) conviction in Oklahoma
    is a misdemeanor and can result in a jail sentence of:'
  choices:
    A: 24 to 48 hours
    B: 10 days to 1 year
    C: 6 months to 2 years
    D: 1 to 5 years
  answer: B
  explanation: A first DUI conviction in Oklahoma can lead to a jail sentence ranging
    from 10 days to 1 year.
- id: 147
  category: penalties_and_points
  question: Under the Oklahoma Point System, how many points are assessed for 'Following
    too closely'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Following too closely (tailgating) is a 2-point violation in Oklahoma.
- id: 148
  category: penalties_and_points
  question: How many points are assessed against your Oklahoma driving record for
    failing to stop for a stop sign or a traffic light?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failure to stop for a stop sign or a traffic light results in 2 points
    being added to your Oklahoma driving record.
- id: 149
  category: penalties_and_points
  question: Under the Oklahoma Point System, how many points are assessed for a conviction
    of speeding 26 mph or more over the posted limit?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: C
  explanation: According to the Oklahoma Driver's Manual, speeding 26 mph or more
    over the limit results in 3 points being added to your driving record.
- id: 150
  category: penalties_and_points
  question: 'In Oklahoma, if your license is suspended for a second time due to point
    accumulation within a five-year period, the suspension will last for:'
  choices:
    A: 1 month
    B: 3 months
    C: 6 months
    D: 1 year
  answer: B
  explanation: A second suspension for point accumulation in Oklahoma results in a
    3-month loss of driving privileges.
- id: 151
  category: penalties_and_points
  question: 'For a first DUI conviction in Oklahoma (not involving injury or death),
    an adult driver faces a maximum fine of:'
  choices:
    A: $500
    B: $1,000
    C: $2,500
    D: $5,000
  answer: B
  explanation: A first DUI conviction in Oklahoma is a misdemeanor and carries a fine
    of up to $1,000.
- id: 152
  category: penalties_and_points
  question: What is the minimum jail sentence for a first-offense DUI conviction in
    Oklahoma?
  choices:
    A: 24 hours
    B: 48 hours
    C: 5 days
    D: 10 days
  answer: D
  explanation: A first DUI conviction in Oklahoma carries a jail sentence of not less
    than ten days and not more than one year.
- id: 153
  category: penalties_and_points
  question: What is the standard fee to reinstate a driver's license that was suspended
    solely for point accumulation in Oklahoma?
  choices:
    A: $25
    B: $50
    C: $75
    D: $100
  answer: A
  explanation: The Oklahoma Driver's Manual states that the reinstatement fee for
    a license suspended for points is $25.
- id: 154
  category: penalties_and_points
  question: 'Under Oklahoma law, a driver is considered legally intoxicated (DUI)
    if their Blood Alcohol Concentration (BAC) is:'
  choices:
    A: 0.02% or higher
    B: 0.05% or higher
    C: 0.08% or higher
    D: 0.10% or higher
  answer: C
  explanation: For drivers 21 and older, the legal limit for DUI in Oklahoma is a
    BAC of 0.08% or higher.
- id: 155
  category: penalties_and_points
  question: In Oklahoma, how many points are assessed for a conviction of 'Failure
    to yield right-of-way'?
  choices:
    A: 1 point
    B: 2 points
    C: 3 points
    D: 4 points
  answer: B
  explanation: Failure to yield the right-of-way is a 2-point violation in Oklahoma.
- id: 156
  category: sharing_the_road
  question: Under Oklahoma's 'Move Over' law, what must you do when approaching a
    stationary emergency vehicle with its flashing lights activated on a highway with
    two or more lanes in your direction?
  choices:
    A: Maintain speed but honk your horn
    B: Move to the lane farthest from the emergency vehicle if safe to do so
    C: Stop immediately in your current lane
    D: Speed up to pass the vehicle quickly
  answer: B
  explanation: Oklahoma law requires drivers to move to the left lane (or the lane
    not adjacent to the emergency vehicle) on multi-lane highways. If changing lanes
    is unsafe, the driver must slow down.
- id: 157
  category: sharing_the_road
  question: In Oklahoma, if you are driving on a divided highway with a physical barrier
    or median, do you need to stop for a school bus on the opposite side of the median?
  choices:
    A: Yes, you must always stop for a school bus
    B: No, you are not required to stop
    C: Yes, but only if the bus driver signals you
    D: No, but you must speed up to clear the area
  answer: B
  explanation: On a divided highway with a median or physical barrier, traffic traveling
    in the opposite direction of a school bus is not required to stop in Oklahoma.
- id: 158
  category: sharing_the_road
  question: What is the 'No-Zone' in relation to large trucks and buses in Oklahoma?
  choices:
    A: The area where trucks are not allowed to drive
    B: The blind spots around the front, rear, and sides of the truck
    C: The speed-restricted zone for commercial vehicles
    D: The cargo area of the truck
  answer: B
  explanation: The 'No-Zone' refers to the large blind spots around a truck where
    the truck driver cannot see other vehicles. If you cannot see the truck driver's
    face in their side mirror, they cannot see you.
- id: 159
  category: sharing_the_road
  question: In Oklahoma, what must a driver do when a pedestrian is crossing the street
    guided by a service animal or carrying a white cane (with or without a red tip)?
  choices:
    A: Honk to let them know you are there
    B: Slow down and be prepared to stop
    C: Come to a full stop and take precautions to avoid injury
    D: Drive around them if there is enough room
  answer: C
  explanation: Oklahoma law requires drivers to take necessary precautions and come
    to a full stop to avoid injury to blind pedestrians using a white cane or service
    animal.
- id: 160
  category: sharing_the_road
  question: According to Oklahoma law, who is required to wear a helmet while operating
    or riding on a motorcycle?
  choices:
    A: All riders regardless of age
    B: Only the operator, not the passenger
    C: Riders and operators under 18 years of age
    D: Only riders with less than 2 years of experience
  answer: C
  explanation: In Oklahoma, motorcycle helmets are legally required for all operators
    and passengers under the age of 18.
- id: 161
  category: sharing_the_road
  question: When following an emergency vehicle responding to an alarm in Oklahoma,
    what is the minimum legal following distance?
  choices:
    A: 100 feet
    B: 200 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Oklahoma law (47 OS § 11-1108) prohibits drivers from following a fire
    apparatus or other emergency vehicle closer than 500 feet.
- id: 162
  category: sharing_the_road
  question: 'When a large truck is turning right onto a street with two lanes in each
    direction, the driver may need to:'
  choices:
    A: Stay strictly in the right lane
    B: Swing wide to the left to complete the turn
    C: Stop and wait for all traffic to clear the intersection
    D: Turn from the left lane
  answer: B
  explanation: Large trucks often need to swing wide to the left to make a right turn.
    Drivers should avoid 'squeezing' between the truck and the curb.
- id: 163
  category: sharing_the_road
  question: Which of the following is TRUE regarding bicyclists in Oklahoma?
  choices:
    A: They must ride on the sidewalk at all times
    B: They have the same rights and responsibilities as motor vehicle drivers
    C: They are not allowed to ride on two-lane highways
    D: They must always ride against the flow of traffic
  answer: B
  explanation: In Oklahoma, bicyclists are considered vehicles and have the same rights
    to the road and the same responsibilities to obey traffic laws as motorists.
- id: 164
  category: sharing_the_road
  question: Is 'lane splitting' (driving a motorcycle between lanes of stopped or
    moving cars) legal in Oklahoma?
  choices:
    A: Yes, it is legal at speeds under 30 mph
    B: Yes, but only during rush hour
    C: No, it is illegal in Oklahoma
    D: Yes, if the cars are completely stopped
  answer: C
  explanation: Lane splitting is illegal in Oklahoma. Motorcycles are entitled to
    the full use of a lane, and no motor vehicle shall be driven in such a manner
    as to deprive any motorcycle of the full use of a lane.
- id: 165
  category: sharing_the_road
  question: 'In Oklahoma, when you are turning right on a red light after a complete
    stop, you must yield the right-of-way to:'
  choices:
    A: Only other motor vehicles
    B: Only pedestrians in the crosswalk
    C: Both pedestrians in the crosswalk and oncoming traffic turning left
    D: All pedestrians and all traffic moving on the green light
  answer: D
  explanation: Before turning right on red, you must stop and yield to all pedestrians
    and any vehicles approaching the intersection from the other direction.
- id: 166
  category: sharing_the_road
  question: 'When following a large truck at night, you should dim your headlights
    because:'
  choices:
    A: The truck's mirrors will reflect the bright light into the driver's eyes
    B: Truck drivers have better night vision
    C: High beams can damage the truck's reflective tape
    D: It is required by law to use parking lights only when following trucks
  answer: A
  explanation: Bright lights reflecting off the large side mirrors of a truck can
    blind the driver. You should always dim your lights when following any vehicle.
- id: 167
  category: sharing_the_road
  question: 'In Oklahoma, if you are convicted of passing a stopped school bus with
    its red lights flashing, the fine for a first offense is at least:'
  choices:
    A: $50
    B: $100
    C: $250
    D: $1,000
  answer: B
  explanation: Under Oklahoma law, the fine for a first conviction of failing to stop
    for a school bus is a minimum of $100.
- id: 168
  category: sharing_the_road
  question: Oklahoma's 'Move Over' law requires motorists to change lanes or slow
    down when approaching which of the following vehicles stopped on the shoulder
    with flashing lights?
  choices:
    A: Only police and fire vehicles
    B: Only ambulances and tow trucks
    C: Emergency vehicles, maintenance vehicles, and licensed wreckers
    D: Only vehicles with blue and red lights
  answer: C
  explanation: Oklahoma law (47 O.S. § 11-314) requires drivers to move over or slow
    down for stationary emergency vehicles, maintenance vehicles, and wreckers displaying
    flashing lights.
- id: 169
  category: sharing_the_road
  question: Under Oklahoma law, which motorcycle riders are required to wear a crash
    helmet?
  choices:
    A: All riders regardless of age
    B: Only the operator, not the passenger
    C: Riders and passengers under 18 years of age
    D: Only riders with a learner permit
  answer: C
  explanation: In Oklahoma, helmets are legally required for any person under 18 years
    of age who is operating or riding on a motorcycle (47 O.S. § 12-609).
- id: 170
  category: sharing_the_road
  question: When driving near large trucks, you should avoid the 'No-Zone.' Where
    is the largest blind spot on a commercial truck?
  choices:
    A: Directly in front of the cab
    B: The left side of the trailer
    C: The right side of the trailer
    D: Directly behind the trailer
  answer: C
  explanation: The largest blind spot (No-Zone) for a truck driver is on the right
    side, extending from the cab back past the length of the trailer.
- id: 171
  category: sharing_the_road
  question: 'When an emergency vehicle with sirens and flashing lights is approaching
    from behind, Oklahoma law requires you to:'
  choices:
    A: Speed up to get out of the way
    B: Stop immediately in your lane
    C: Pull to the right edge of the roadway and stop
    D: Pull into the left lane to let them pass on the right
  answer: C
  explanation: Upon the approach of an authorized emergency vehicle using audible
    and visual signals, drivers must yield the right-of-way and immediately drive
    to a position parallel to, and as close as possible to, the right-hand edge or
    curb and stop (47 O.S. § 11-405).
- id: 172
  category: sharing_the_road
  question: In Oklahoma, what must a driver do when approaching a pedestrian using
    a white cane or a guide dog?
  choices:
    A: Honk to let them know you are there
    B: Yield the right-of-way and take precautions to avoid injury
    C: Drive around them if there is room
    D: Wait for them to signal you to pass
  answer: B
  explanation: Oklahoma law (47 O.S. § 11-504) requires drivers to yield the right-of-way
    to any totally or partially blind pedestrian carrying a white cane or using a
    guide dog.
- id: 173
  category: sharing_the_road
  question: What is the recommended following distance when traveling behind a motorcycle
    in Oklahoma?
  choices:
    A: 1 second
    B: 2 seconds
    C: At least 3 to 4 seconds
    D: Exactly 10 feet
  answer: C
  explanation: The Oklahoma Driver's Manual recommends a following distance of at
    least 3 to 4 seconds behind a motorcycle to allow the motorcyclist enough room
    to maneuver and to avoid a collision if they should fall.
- id: 174
  category: sharing_the_road
  question: Why is it dangerous to pull up beside a large truck that is signaling
    a right turn at an intersection?
  choices:
    A: Trucks often need to swing wide to the left to complete a right turn
    B: The truck might roll backward
    C: The truck's turn signals are often misleading
    D: The truck will speed up during the turn
  answer: A
  explanation: Large trucks often need to swing wide to the left to make a right turn.
    If you pull into the space between the truck and the curb, you may be squeezed
    between the truck and the curb (a 'squeeze play').
- id: 175
  category: sharing_the_road
  question: 'Oklahoma law requires every bicycle used at nighttime to be equipped
    with a lamp on the front that emits a white light visible from a distance of at
    least:'
  choices:
    A: 100 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: According to 47 O.S. § 12-702, a bicycle used at night must have a
    front lamp visible from at least 500 feet and a red reflector or lamp on the rear
    visible from 600 feet.
- id: 176
  category: sharing_the_road
  question: 'A triangular orange emblem on the rear of a vehicle indicates that the
    vehicle:'
  choices:
    A: Is carrying hazardous materials
    B: Is a slow-moving vehicle traveling 25 mph or less
    C: Is an oversized load
    D: Is a student driver
  answer: B
  explanation: The slow-moving vehicle emblem (a triangular orange sign) is required
    on vehicles designed to travel at speeds of 25 mph or less, such as farm equipment
    or construction machinery (47 O.S. § 12-215).
- id: 177
  category: sharing_the_road
  question: 'If you are walking along a highway in Oklahoma where there are no sidewalks,
    you should walk:'
  choices:
    A: On the right side with the flow of traffic
    B: On the left side facing oncoming traffic
    C: In the center of the road
    D: On the shoulder with your back to traffic
  answer: B
  explanation: Oklahoma law (47 O.S. § 11-506) requires pedestrians to walk on the
    left side of the roadway or its shoulder, facing traffic, when sidewalks are not
    provided.
- id: 178
  category: vehicle_information
  question: 'According to the Oklahoma Driver''s Manual, your headlights must be turned
    on during the period from 30 minutes after sunset to 30 minutes before sunrise
    and at any other time when visibility is less than:'
  choices:
    A: 500 feet
    B: 750 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Oklahoma law requires headlights to be on from 30 minutes after sunset
    to 30 minutes before sunrise, or whenever visibility is less than 1,000 feet due
    to weather or other conditions.
- id: 179
  category: vehicle_information
  question: When following another vehicle from behind at night in Oklahoma, at what
    distance must you dim your high-beam headlights?
  choices:
    A: 200 feet
    B: 400 feet
    C: 600 feet
    D: 1,000 feet
  answer: C
  explanation: You must dim your high beams when following within 600 feet of another
    vehicle so that you do not blind the driver ahead through their rearview mirror.
- id: 180
  category: vehicle_information
  question: Oklahoma law requires that your vehicle's foot brake must be capable of
    stopping the car within how many feet when traveling at 20 mph?
  choices:
    A: 20 feet
    B: 25 feet
    C: 30 feet
    D: 40 feet
  answer: C
  explanation: Under Oklahoma equipment regulations, the foot brake must be able to
    stop the vehicle within 30 feet when traveling at a speed of 20 mph.
- id: 181
  category: vehicle_information
  question: Every Oklahoma registered vehicle must be equipped with a rearview mirror
    that allows the driver to see the highway for at least how many feet to the rear?
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Oklahoma law requires a rearview mirror that provides a view of the
    highway for at least 200 feet to the rear of the vehicle.
- id: 182
  category: vehicle_information
  question: Under Oklahoma law, what is the minimum amount of light transmission required
    for window tinting on the front side windows?
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: B
  explanation: Oklahoma law requires that window tinting on the front side windows
    must allow at least 25% of light to pass through.
- id: 183
  category: vehicle_information
  question: 'Your vehicle must have a horn that can be heard from a distance of at
    least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Oklahoma safety regulations state that every motor vehicle must be
    equipped with a horn in good working order capable of emitting sound audible under
    normal conditions from a distance of not less than 200 feet.
- id: 184
  category: vehicle_information
  question: 'In Oklahoma, the rear license plate must be illuminated by a white light
    so that it is clearly legible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 150 feet
  answer: B
  explanation: Oklahoma law requires the rear license plate to be illuminated so it
    can be read from a distance of 50 feet.
- id: 185
  category: vehicle_information
  question: Turn signals on a vehicle must be visible from a distance of not less
    than how many feet in normal sunlight?
  choices:
    A: 50 feet
    B: 100 feet
    C: 200 feet
    D: 500 feet
  answer: B
  explanation: Oklahoma equipment standards require that turn signals be visible to
    both the front and rear for a distance of at least 100 feet in normal sunlight.
- id: 186
  category: vehicle_information
  question: 'Tires are considered unsafe in Oklahoma if the tread is worn down to
    less than:'
  choices:
    A: 1/32 of an inch
    B: 2/32 of an inch
    C: 4/32 of an inch
    D: 6/32 of an inch
  answer: B
  explanation: Tires must have at least 2/32 of an inch of tread depth to be considered
    safe and legal for operation on Oklahoma roads.
- id: 187
  category: vehicle_information
  question: Except for authorized emergency vehicles, it is illegal in Oklahoma to
    have which of the following visible from the front of the vehicle?
  choices:
    A: Amber turn signals
    B: White headlights
    C: A red light
    D: Clear fog lights
  answer: C
  explanation: Oklahoma law prohibits any vehicle other than an authorized emergency
    vehicle from displaying a red light visible from directly in front of the center
    of the vehicle.
- id: 188
  category: vehicle_information
  question: If a load extends more than how many feet beyond the rear of a vehicle
    in Oklahoma, a red flag must be attached to the end of the load during the day?
  choices:
    A: 2 feet
    B: 3 feet
    C: 4 feet
    D: 6 feet
  answer: C
  explanation: Whenever a load extends 4 feet or more beyond the rear of the bed or
    body of a vehicle, a red flag (at least 12 inches square) must be displayed at
    the extreme rear of the load.
- id: 189
  category: vehicle_information
  question: 'Under Oklahoma''s child restraint law, children must be properly secured
    in a rear-facing child passenger restraint system until they are at least:'
  choices:
    A: 1 year old
    B: 2 years old
    C: 4 years old
    D: 6 years old
  answer: B
  explanation: Oklahoma law requires children to remain in a rear-facing car seat
    until they are at least 2 years of age or until they reach the weight or height
    limit allowed by the manufacturer.
- id: 190
  category: vehicle_information
  question: In Oklahoma, a child must be secured in a child passenger restraint system
    or booster seat until they reach what age or height?
  choices:
    A: Age 6 or 4'6" tall
    B: Age 8 or 4'9" tall
    C: Age 10 or 5'0" tall
    D: Age 12 or 4'11" tall
  answer: B
  explanation: Oklahoma law requires children to be in a booster seat or child restraint
    until they are 8 years old or at least 4 feet 9 inches tall.
- id: 191
  category: vehicle_information
  question: 'According to the Oklahoma Driver''s Manual, headlights must be turned
    on during the period from:'
  choices:
    A: Sunset to sunrise
    B: One hour after sunset to one hour before sunrise
    C: 30 minutes after sunset to 30 minutes before sunrise
    D: Darkness to daylight
  answer: C
  explanation: Oklahoma law requires that your headlights be turned on from 30 minutes
    after sunset to 30 minutes before sunrise, or whenever visibility is less than
    1,000 feet.
- id: 192
  category: vehicle_information
  question: Oklahoma law requires that the front side windows of a vehicle allow at
    least what percentage of light transmission?
  choices:
    A: 20%
    B: 25%
    C: 32%
    D: 50%
  answer: B
  explanation: Oklahoma Title 47 § 12-406 states that side windows to the left and
    right of the driver must allow at least 25% light transmission.
- id: 193
  category: vehicle_information
  question: 'In Oklahoma, a vehicle''s horn must be audible under normal conditions
    from a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: B
  explanation: Oklahoma safety regulations require that a motor vehicle horn be heard
    from a distance of no less than 200 feet.
- id: 194
  category: vehicle_information
  question: 'The light providing illumination for the rear license plate in Oklahoma
    must make the plate visible from a distance of at least:'
  choices:
    A: 25 feet
    B: 50 feet
    C: 100 feet
    D: 150 feet
  answer: B
  explanation: Oklahoma law requires the rear license plate to be illuminated by a
    white light so that it is clearly legible from a distance of 50 feet to the rear.
- id: 195
  category: vehicle_information
  question: 'Besides night driving, Oklahoma law requires headlights to be used when
    visibility is limited to less than:'
  choices:
    A: 500 feet
    B: 800 feet
    C: 1,000 feet
    D: 1,500 feet
  answer: C
  explanation: Headlights must be used in Oklahoma whenever visibility is less than
    1,000 feet due to weather or other atmospheric conditions.
- id: 196
  category: vehicle_information
  question: 'Turn signals on a vehicle in Oklahoma must be visible to both the front
    and rear for a distance of at least:'
  choices:
    A: 100 feet
    B: 200 feet
    C: 300 feet
    D: 500 feet
  answer: A
  explanation: Oklahoma law requires that turn signals be visible for at least 100
    feet in normal sunlight.
- id: 197
  category: vehicle_information
  question: 'Every motor vehicle in Oklahoma must be equipped with at least two tail
    lamps mounted on the rear, which must be visible from a distance of:'
  choices:
    A: 200 feet
    B: 300 feet
    C: 500 feet
    D: 1,000 feet
  answer: C
  explanation: Oklahoma law requires tail lamps to be red and visible from a distance
    of 500 feet to the rear.
- id: 198
  category: vehicle_information
  question: Which of the following equipment is specifically prohibited on passenger
    vehicles in Oklahoma?
  choices:
    A: Fog lamps
    B: Muffler cutouts or bypasses
    C: Studded snow tires (during winter months)
    D: Aftermarket backup cameras
  answer: B
  explanation: Oklahoma law prohibits the use of a muffler cutout, bypass, or similar
    device that prevents the muffler from operating correctly to reduce noise.
- id: 199
  category: vehicle_information
  question: 'A ''Slow Moving Vehicle'' emblem must be displayed on the rear of any
    Oklahoma vehicle designed to operate at speeds of:'
  choices:
    A: 15 mph or less
    B: 25 mph or less
    C: 35 mph or less
    D: 45 mph or less
  answer: B
  explanation: The triangular 'Slow Moving Vehicle' emblem is required in Oklahoma
    for vehicles designed to travel at speeds of 25 mph or less.
- id: 200
  category: signs_and_signals
  question: When approaching a railroad crossing with flashing signals, Oklahoma law
    requires you to stop within what distance from the nearest rail?
  choices:
    A: Between 5 and 25 feet
    B: Between 10 and 30 feet
    C: Between 15 and 50 feet
    D: Exactly 20 feet
  answer: C
  explanation: The Oklahoma Driver's Manual states you must stop within 15 to 50 feet
    from the nearest rail of a railroad crossing if signals are flashing or a train
    is approaching.
- id: 201
  category: signs_and_signals
  question: What does a flashing red traffic light mean at an Oklahoma intersection?
  choices:
    A: Slow down and proceed with caution
    B: Stop and wait for the light to turn green
    C: Yield to all traffic, but do not stop unless necessary
    D: Stop completely and proceed only when it is safe to do so
  answer: D
  explanation: In Oklahoma, a flashing red light has the same meaning as a stop sign.
    You must come to a complete stop and proceed only when the way is clear.
- id: 202
  category: signs_and_signals
  question: On Oklahoma roads, what does a solid yellow line on your side of a two-lane
    road indicate?
  choices:
    A: You are in a passing zone
    B: You are not allowed to pass
    C: You must slow down to 35 mph
    D: The road ahead is a one-way street
  answer: B
  explanation: A solid yellow line on your side of the center line means that passing
    is prohibited in your direction of travel.
- id: 203
  category: signs_and_signals
  question: 'A pennant-shaped sign (an isosceles triangle pointing right) placed on
    the left side of the road in Oklahoma indicates:'
  choices:
    A: A school zone
    B: A yield requirement
    C: A no-passing zone
    D: A railroad crossing
  answer: C
  explanation: The pennant-shaped sign is unique because it is placed on the left
    side of the road to mark the beginning of a no-passing zone.
- id: 204
  category: signs_and_signals
  question: In Oklahoma, a pentagon-shaped sign (five-sided) always indicates which
    of the following?
  choices:
    A: A construction zone
    B: A school zone or school crossing
    C: A county road marker
    D: A stop sign ahead
  answer: B
  explanation: The five-sided pentagon shape is reserved exclusively for school zones
    and school crossings in Oklahoma and across the US.
- id: 205
  category: signs_and_signals
  question: When you see an emergency vehicle with flashing lights stopped on the
    shoulder of an Oklahoma highway with at least two lanes in your direction, what
    does the 'Move Over Law' require you to do?
  choices:
    A: Stop immediately on the highway
    B: Move to the left lane if safe to do so, or slow down
    C: Maintain speed but honk your horn
    D: Speed up to pass the vehicle quickly
  answer: B
  explanation: Oklahoma's Move Over Law requires drivers to move to the lane furthest
    from the emergency vehicle if possible; if not, the driver must slow down and
    proceed with caution.
- id: 206
  category: signs_and_signals
  question: What is the proper use of a 'shared center turn lane' (marked by solid
    and dashed yellow lines) in Oklahoma?
  choices:
    A: To pass slow-moving vehicles
    B: To travel for at least 500 feet before turning
    C: To make left turns only
    D: To make right turns only
  answer: C
  explanation: Shared center turn lanes are reserved for vehicles making left turns
    from either direction. They are not to be used for passing or through travel.
- id: 207
  category: signs_and_signals
  question: 'When approaching an intersection with a flashing yellow light in Oklahoma,
    you should:'
  choices:
    A: Stop and wait for it to turn green
    B: Speed up to clear the intersection
    C: Slow down and proceed with caution
    D: Treat it like a four-way stop
  answer: C
  explanation: A flashing yellow light means you should slow down and be alert, proceeding
    with caution through the intersection.
- id: 208
  category: signs_and_signals
  question: 'When entering a roundabout in Oklahoma, you must yield the right-of-way
    to:'
  choices:
    A: Traffic entering from the right
    B: Traffic already in the circle
    C: No one; you have the right of way when entering
    D: Only emergency vehicles
  answer: B
  explanation: In a roundabout, drivers entering the circle must yield to the traffic
    already circulating within the roundabout.
- id: 209
  category: signs_and_signals
  question: In Oklahoma, what does a flashing red light at an intersection mean?
  choices:
    A: Slow down and proceed with caution
    B: Stop and wait for the light to turn green
    C: Stop completely and proceed when it is safe to do so
    D: The signal is broken; treat it as a four-way stop
  answer: C
  explanation: According to the Oklahoma Driver's Manual, a flashing red light means
    the same as a stop sign. You must come to a complete stop and then proceed when
    it is safe.
- id: 210
  category: signs_and_signals
  question: What does a flashing yellow light indicate to an Oklahoma driver?
  choices:
    A: Stop and wait for the light to change
    B: Slow down and proceed with caution
    C: Speed up to clear the intersection quickly
    D: Yield to all traffic coming from the right only
  answer: B
  explanation: A flashing yellow light is a warning to slow down and be especially
    alert as you proceed through the intersection.
- id: 211
  category: signs_and_signals
  question: When you see a steady yellow arrow signal, what should you do?
  choices:
    A: The protected turning time is ending; be prepared to stop
    B: You have the right-of-way to turn
    C: Stop immediately, even if you are in the intersection
    D: The arrow is about to turn green
  answer: A
  explanation: A steady yellow arrow means the 'protected' turning time is ending.
    If you are already in the intersection, finish your turn safely; otherwise, prepare
    to stop.
- id: 212
  category: signs_and_signals
  question: In Oklahoma, what does a circular yellow sign with a large 'X' and the
    letters 'RR' indicate?
  choices:
    A: A highway intersection is ahead
    B: A railroad crossing is ahead
    C: No passing zone
    D: Wrong way
  answer: B
  explanation: The round yellow sign is a railroad advance warning sign, indicating
    that you are approaching a railroad crossing.
- id: 213
  category: signs_and_signals
  question: If an Oklahoma driver extends their left arm straight out the window,
    which maneuver are they signaling?
  choices:
    A: Right turn
    B: Stop or slow down
    C: Left turn
    D: U-turn
  answer: C
  explanation: The standard hand signal for a left turn is the left arm extended straight
    out the window.
- id: 214
  category: signs_and_signals
  question: What is the correct hand signal for 'Slow or Stop' in Oklahoma?
  choices:
    A: Left arm extended straight out
    B: Left arm extended upward
    C: Left arm extended downward with palm facing the rear
    D: Right arm extended straight out
  answer: C
  explanation: To signal a stop or decrease in speed using hand signals, extend the
    left arm downward with the palm facing the rear.
- id: 215
  category: signs_and_signals
  question: What do double solid yellow lines in the center of the roadway signify?
  choices:
    A: Passing is permitted from either side
    B: Passing is permitted only from your side
    C: Passing is prohibited from both directions
    D: The road is one-way
  answer: C
  explanation: Double solid yellow lines mean that passing is not allowed for vehicles
    traveling in either direction.
- id: 216
  category: signs_and_signals
  question: 'In Oklahoma, a ''Shared Left Turn Lane'' (center lane with solid and
    broken yellow lines) may be used for:'
  choices:
    A: Passing slower traffic
    B: Driving for long distances to avoid traffic
    C: Starting or completing left turns
    D: Parking your vehicle temporarily
  answer: C
  explanation: The shared center lane is reserved for making left turns only. It cannot
    be used for passing or through travel.
- id: 217
  category: signs_and_signals
  question: What is the meaning of a pentagon-shaped (five-sided) traffic sign?
  choices:
    A: Yield right-of-way
    B: Stop
    C: School zone or school crossing
    D: No passing zone
  answer: C
  explanation: A five-sided (pentagon) sign indicates a school zone or a school crossing
    ahead.
- id: 218
  category: signs_and_signals
  question: What does a solid white line painted across a lane at an intersection
    represent?
  choices:
    A: A crosswalk for pedestrians only
    B: A stop line, indicating where to stop for a sign or signal
    C: A lane divider for through traffic
    D: A parking boundary
  answer: B
  explanation: A solid white line across a lane is a stop line. You must stop behind
    this line at stop signs or red lights.
- id: 219
  category: signs_and_signals
  question: In Oklahoma, what color are regulatory signs that tell you what you MUST
    do (e.g., Speed Limit, No Left Turn)?
  choices:
    A: Yellow
    B: Orange
    C: Black and white
    D: Green
  answer: C
  explanation: Regulatory signs, which provide notice of traffic laws or regulations,
    are typically rectangular and have black letters on a white background.
- id: 220
  category: signs_and_signals
  question: When you see a 'Yield' sign, what does Oklahoma law require you to do?
  choices:
    A: Stop completely every time
    B: Slow down and be prepared to stop; give right-of-way to other traffic
    C: Maintain speed and merge quickly
    D: Stop only if there is a police officer present
  answer: B
  explanation: A yield sign means you must slow down and yield the right-of-way to
    vehicles and pedestrians. You must stop if necessary for safety.
- id: 221
  category: signs_and_signals
  question: What does a diamond-shaped orange sign signify in Oklahoma?
  choices:
    A: General warning of road conditions
    B: School zone ahead
    C: Construction or maintenance warning
    D: Public recreation area
  answer: C
  explanation: Orange diamond-shaped signs are used specifically for construction
    and maintenance work zone warnings.
- id: 222
  category: signs_and_signals
  question: If you are at an intersection with a red light and a green arrow pointing
    right, what are you allowed to do?
  choices:
    A: You must wait for the main light to turn green before turning
    B: You may turn right after coming to a complete stop
    C: You may turn right in the direction of the arrow without stopping, but you
      must yield to pedestrians
    D: You can only turn right if there is no 'No Turn on Red' sign
  answer: C
  explanation: A green arrow means you have a 'protected' turn. You may proceed in
    the direction of the arrow, but you must still yield to pedestrians and other
    traffic already in the intersection.
- image: stop.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Slow down and proceed with caution
    B: Come to a complete stop
    C: Yield to oncoming traffic
    D: Stop only if other vehicles are present
  answer: B
  explanation: A red octagonal STOP sign means you must come to a complete stop at
    the stop line, crosswalk, or before entering the intersection. Check for traffic
    and pedestrians before proceeding.
  id: 223
- image: yield.png
  category: signs_and_signals
  question: What does this sign require you to do?
  choices:
    A: Come to a complete stop
    B: Speed up to merge with traffic
    C: Slow down and give the right-of-way to traffic and pedestrians
    D: Proceed without stopping
  answer: C
  explanation: A red and white triangular YIELD sign means you must slow down and
    yield the right-of-way to traffic and pedestrians. You must stop if necessary
    to let others pass safely.
  id: 224
- image: do_not_enter.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: Road closed ahead
    B: No parking allowed
    C: Do not enter this roadway
    D: Dead end ahead
  answer: C
  explanation: A red and white DO NOT ENTER sign means you must not enter the road
    or ramp where this sign is posted. It is usually seen at freeway off-ramps or
    one-way streets where entering would put you in the path of oncoming traffic.
  id: 225
- image: wrong_way.png
  category: signs_and_signals
  question: If you see this sign, what should you do?
  choices:
    A: Make a U-turn
    B: Continue driving carefully
    C: Stop and back up or turn around — you are going the wrong way
    D: Speed up to exit the area quickly
  answer: C
  explanation: A red and white WRONG WAY sign means you are traveling against traffic
    on a one-way road or highway ramp. Stop immediately and safely turn around or
    back up.
  id: 226
- image: one_way_left.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Left turn only
    B: Traffic flows in one direction — to the left
    C: Keep left of the median
    D: Highway exit to the left
  answer: B
  explanation: A black and white ONE WAY sign with an arrow indicates that traffic
    on this street moves in only one direction — the direction the arrow points.
  id: 227
- image: no_u_turn.png
  category: signs_and_signals
  question: What does this sign prohibit?
  choices:
    A: Right turns
    B: Left turns
    C: U-turns
    D: Passing other vehicles
  answer: C
  explanation: A white regulatory sign with a U-turn arrow crossed out means U-turns
    are prohibited at this location.
  id: 228
- image: no_left_turn.png
  category: signs_and_signals
  question: What action is prohibited by this sign?
  choices:
    A: Turning right
    B: Turning left
    C: Making a U-turn
    D: Going straight
  answer: B
  explanation: A white regulatory sign showing a left turn arrow crossed out means
    left turns are not allowed at this intersection.
  id: 229
- image: no_right_turn.png
  category: signs_and_signals
  question: What does this sign mean?
  choices:
    A: No U-turn allowed
    B: No left turn allowed
    C: No right turn allowed
    D: No passing allowed
  answer: C
  explanation: A white regulatory sign showing a right turn arrow crossed out means
    right turns are prohibited at this location.
  id: 230
- image: no_passing.png
  category: signs_and_signals
  question: What does this sign indicate?
  choices:
    A: Road narrows ahead
    B: Do not pass other vehicles in this zone
    C: Two-way traffic ahead
    D: Keep right
  answer: B
  explanation: A yellow with black lettering NO PASSING ZONE pennant-shaped sign means
    you are not allowed to pass other vehicles in this area. It marks the beginning
    of a no-passing zone.
  id: 231
- image: keep_right.png
  category: signs_and_signals
  question: What does this sign instruct drivers to do?
  choices:
    A: Merge right
    B: Turn right only
    C: Keep to the right of a divider or obstruction
    D: Right lane ends ahead
  answer: C
  explanation: A white regulatory KEEP RIGHT sign with an arrow means you must keep
    to the right side of a traffic island, median, or obstruction.
  id: 232
- image: speed_limit_25.png
  category: signs_and_signals
  question: What type of sign is this, based on its shape and color?
  choices:
    A: A warning sign
    B: A guide sign
    C: A regulatory sign
    D: A construction sign
  answer: C
  explanation: White rectangular signs with black lettering are regulatory signs.
    Speed limit signs tell you the maximum legal speed for the area under ideal conditions.
  id: 233
- image: deer_crossing.png
  category: signs_and_signals
  question: What does this yellow diamond-shaped sign warn you about?
  choices:
    A: A zoo or animal park ahead
    B: Deer frequently cross the road in this area
    C: Hunting area ahead
    D: A wildlife refuge nearby
  answer: B
  explanation: A yellow diamond-shaped sign with a deer silhouette warns that deer
    frequently cross the road in this area. Slow down and watch for animals, especially
    at dawn and dusk.
  id: 234
- image: pedestrian_crossing.png
  category: signs_and_signals
  question: What does this sign warn you about?
  choices:
    A: School zone ahead
    B: Pedestrian crossing ahead
    C: Hiking trail nearby
    D: Bus stop ahead
  answer: B
  explanation: A yellow diamond-shaped sign with a pedestrian figure warns of a pedestrian
    crossing ahead. Be prepared to stop for pedestrians crossing the road.
  id: 235
- image: school_zone.png
  category: signs_and_signals
  question: What does the shape of this sign indicate?
  choices:
    A: A railroad crossing
    B: A construction zone
    C: A school zone or school crossing
    D: A hospital zone
  answer: C
  explanation: A pentagon-shaped (5-sided) fluorescent yellow-green sign indicates
    a school zone or school crossing. Slow down and watch for children.
  id: 236
- image: railroad_crossing.png
  category: signs_and_signals
  question: What does this circular yellow sign warn you about?
  choices:
